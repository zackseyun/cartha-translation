id: JHN.18.33
reference: John 18:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: ml
  text: 'അതിനാൽ പീലാത്തൊസ് വീണ്ടും ഗവർണറുടെ ആസ്ഥാനമന്ദിരത്തിൽ[a] പ്രവേശിച്ചു. അദ്ദേഹം യേശുവിനെ വിളിച്ച് അവനോടു പറഞ്ഞു: “നീയാണോ യെഹൂദന്മാരുടെ രാജാവ്?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രത്തോറിയം”; റോമൻ ഗവർണറുടെ ഔദ്യോഗിക വസതിയോ ആസ്ഥാനമോ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യെഹൂദ്യരുടെ.” ഗ്രീക്ക് പദം പൊതുവേ യെഹൂദന്മാരെയോ ചില സന്ദർഭങ്ങളിൽ യെഹൂദ്യദേശക്കാരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: വീണ്ടും ... പ്രവേശിച്ചു
  rationale: ചലനം ഒരു സ്ഥലത്തിനകത്തേക്കാണെന്നും πάλιν ആവർത്തിച്ചുള്ള പ്രവേശനമാണെന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനവും കഥയുടെ മുന്നേറ്റവും സൂചിപ്പിക്കുന്ന ബന്ധകം നിലനിർത്തുന്നു.
- source_word: πραιτώριον
  choice: ഗവർണറുടെ ആസ്ഥാനമന്ദിരം
  rationale: റോമൻ ഗവർണറുടെ ഔദ്യോഗിക വസതിയോ ആസ്ഥാനമോ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; സാങ്കേതിക പദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐφώνησεν
  choice: വിളിച്ച്
  rationale: ഇവിടെ യേശുവിനെ വിളിപ്പിക്കുക എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘ആജ്ഞാപിച്ച് വരുത്തി’ എന്നതിനെക്കാൾ ഉറവിടത്തിന്റെ ശക്തി അതിരുകടക്കുന്നില്ല.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ചോദ്യം പിന്നാലെ വന്നാലും λέγω എന്ന പൊതുവായ ‘പറയുക’ എന്ന ക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Σὺ εἶ
  choice: നീയാണോ
  rationale: വ്യക്തമായി നൽകിയ σύ എന്ന സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘നീയാണോ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ രാജാവ്
  rationale: വിചാരണാസന്ദർഭത്തിലെ അംഗീകൃത രാജകീയ-രാഷ്ട്രീയ പദവി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; Ἰουδαῖοι എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: രാജകീയ പദവിയിലെ Ἰουδαίων എന്ന പദത്തിന്റെ അർഥം
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: പീലാത്തോസിന്റെ മുമ്പിലുള്ള രാഷ്ട്രീയ കുറ്റാരോപണത്തിൽ ‘യെഹൂദന്മാരുടെ രാജാവ്’ എന്നതാണ് ചരിത്രപരവും സന്ദർഭോചിതവുമായ പ്രാഥമിക വായന. എങ്കിലും ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ യെഹൂദ്യദേശക്കാരെ സൂചിപ്പിക്കാനാകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഗവർണറുടെ ആസ്ഥാനമന്ദിരം’ ഔദ്യോഗിക സ്ഥലത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു; പരമ്പരാഗത സാങ്കേതിക പദവും Ἰουδαίων എന്നതിലെ യഥാർഥ അർഥസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
