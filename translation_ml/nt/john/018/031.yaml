id: JHN.18.31
reference: John 18:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് പീലാത്തോസ് അവരോടു പറഞ്ഞു: “നിങ്ങൾതന്നെ അവനെ കൊണ്ടുപോയി നിങ്ങളുടെ നിയമപ്രകാരം അവനെ വിധിക്കുവിൻ.” യെഹൂദന്മാർ[a] അവനോടു പറഞ്ഞു: “ആരെയും വധിക്കാൻ ഞങ്ങൾക്ക് നിയമപരമായി അനുവാദമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘യെഹൂദന്മാർ’ (hoi Ioudaioi). ഈ സന്ദർഭത്തിൽ പീലാത്തോസിനോടു സംസാരിക്കുന്ന യെഹൂദ അധികാരികളെയോ കുറ്റാരോപകരെയോ ആണ് ഇതു സൂചിപ്പിക്കുന്നത്; യെഹൂദജനതയെ മുഴുവനായല്ല.
    reason: സന്ദർഭപരമായ സൂചിതർ വ്യക്തമാക്കാനും സമുദായവ്യാപകമായ തെറ്റായ വായന ഒഴിവാക്കാനും.
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനാത്മകവും ആഖ്യാനപരവുമായ തുടർച്ച സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: നിങ്ങൾതന്നെ അവനെ കൊണ്ടുപോയി
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ഈ സാഹചര്യത്തിൽ Λάβετε എന്നതിന് ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: നിങ്ങളുടെ നിയമപ്രകാരം
  rationale: κατά ഇവിടെ മാനദണ്ഡത്തോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു; പീലാത്തോസ് അവരുടെ നിയമവ്യവസ്ഥയെ വേർതിരിച്ചു പരാമർശിക്കുന്ന ഭാവവും നിലനിൽക്കുന്നു.
- source_word: κρίνατε
  choice: വിധിക്കുവിൻ
  rationale: നിയമപരമായ സന്ദർഭത്തിലെ ‘ന്യായം വിധിക്കുക’ എന്ന വിശാല അർഥം കാത്തുസൂക്ഷിക്കുന്നു; ഔപചാരിക വിചാരണയെന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തെ മുഖ്യപാഠത്തിൽ ഔപചാരികമായി നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ പരിമിതമായ സൂചിതസംഘം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: ഞങ്ങൾക്ക് നിയമപരമായി അനുവാദമില്ല
  rationale: ἔξεστιν എന്നതിലെ അനുവദനീയതയും ഈ സന്ദർഭത്തിലെ നിയമപരമായ ഭാവവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀποκτεῖναι οὐδένα
  choice: ആരെയും വധിക്കാൻ
  rationale: ന്യായാധികാരവുമായി ബന്ധപ്പെട്ട സന്ദർഭത്തിൽ ἀποκτεῖναι എന്നതിന്റെ മരണശിക്ഷ നടപ്പാക്കുന്ന ഭാവം ‘വധിക്കാൻ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; οὐδένα ‘ആരെയും’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചിതർ
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദന്മാർ’ എന്ന് നൽകി, സന്ദർഭത്തിലെ സൂചിതരെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’
  rationale: ഗ്രീക്കിലെ പദപ്രയോഗവും അതിലുള്ള സാധ്യതാപരമായ വ്യാപ്തിയും നിലനിർത്തുമ്പോൾത്തന്നെ, ഇവിടെ പീലാത്തോസിനോടു സംസാരിക്കുന്ന യെഹൂദ അധികാരികളെയോ കുറ്റാരോപകരെയോ ആണ് ഉദ്ദേശിക്കുന്നത് എന്നും യെഹൂദജനതയെ മുഴുവനായല്ല എന്നും വ്യക്തമാക്കുന്നത് തെറ്റായ സമുദായവ്യാപക വായന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. പീലാത്തോസിന്റെ വാക്കിലെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെ സൂക്ഷിച്ചു. ‘വിധിക്കുവിൻ’ എന്ന മാന്യമായ ആജ്ഞാരൂപം ഗൗരവമുള്ള സംഭാഷണശൈലിക്ക് അനുയോജ്യം; മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
