id: JHN.18.4
reference: John 18:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: ml
  text: അതുകൊണ്ട്, തന്റെമേൽ വരാനിരിക്കുന്നതെല്ലാം[a] അറിഞ്ഞിരുന്ന യേശു പുറത്തേക്കു ചെന്ന് അവരോട്, “നിങ്ങൾ ആരെയാണ് അന്വേഷിക്കുന്നത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തനിക്കു സംഭവിക്കാനിരിക്കുന്നതെല്ലാം.”
    reason: ‘തന്റെമേൽ വരാനിരിക്കുന്ന’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൂടുതൽ സ്വാഭാവികമായ അർഥപരമായ പകരംവായന.
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണവുമായി ഉള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ ബന്ധം നിലനിർത്തുന്നു; വെറും കാലക്രമം സൂചിപ്പിക്കുന്ന ‘അപ്പോൾ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ അനുമാനാത്മക ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: εἰδὼς
  choice: അറിഞ്ഞിരുന്ന
  rationale: വരാനിരിക്കുന്ന സംഭവങ്ങളെക്കുറിച്ച് യേശുവിന് നേരത്തേയും പൂർണമായും അറിവുണ്ടായിരുന്നുവെന്ന ക്രിയാവിശേഷണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: തന്റെമേൽ വരാനിരിക്കുന്നതെല്ലാം
  rationale: πάντα എന്നതിന്റെ സമഗ്രതയും ἐρχόμενα ἐπ’ αὐτόν എന്നതിലെ ആസന്നമായ സംഭവങ്ങൾ തന്റെമേൽ വരുന്നു എന്ന രൂപകഭാവവും നിലനിർത്തുന്നു; സംഭവങ്ങൾ എന്തൊക്കെയാണെന്ന് മൂലപാഠത്തേക്കാൾ വിശദീകരിക്കുന്നില്ല.
- source_word: ἐξῆλθεν
  choice: പുറത്തേക്കു ചെന്ന്
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ സാധാരണ ദിശാഭാവം സൂക്ഷിക്കുന്നു; ‘മുന്നോട്ടുവന്നു’ പോലുള്ള അധിക നാടകീയത ചേർക്കുന്നില്ല.
- source_word: λέγει
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിലാക്കി; പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് ‘പറഞ്ഞു’ എന്നതിനു പകരം ‘ചോദിച്ചു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: Τίνα
  choice: ആരെയാണ്
  rationale: ζητεῖτε എന്ന ക്രിയയുടെ കർമമായി വരുന്ന ഏകവചന ചോദനസർവനാമത്തെ മലയാളത്തിലെ കർമവിഭക്തിയോടെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ζητεῖτε
  choice: അന്വേഷിക്കുന്നത്
  rationale: ζητέω എന്നതിന്റെ ഗൗരവമുള്ള ‘തേടുക/അന്വേഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും വർത്തമാനപ്രവർത്തനഭാവം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആഖ്യാനത്തിൽ യേശുവിന്റെ മുൻകൂട്ടിയുള്ള അറിവ്
  choice: തന്റെമേൽ വരാനിരിക്കുന്നതെല്ലാം യേശു അറിഞ്ഞിരുന്നു എന്ന പാഠത്തിന്റെ പ്രസ്താവന അതേ പരിധിയിൽ നിലനിർത്തി.
  alternative: യേശുവിന്റെ സമഗ്രമായ മുൻജ്ഞാനത്തെ വ്യവസ്ഥാപിത ദൈവശാസ്ത്രഭാഷയിൽ കൂടുതൽ വ്യക്തമായി വികസിപ്പിക്കാമായിരുന്നു.
  rationale: സംഭവങ്ങൾ യേശുവിനെ അപ്രതീക്ഷിതമായി പിടികൂടിയതല്ലെന്ന് വാക്യം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനപ്പുറം ഒരു പ്രത്യേക ദൈവശാസ്ത്രസൂത്രവാക്യം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അതുകൊണ്ട്’ യുക്തിബന്ധം സൂക്ഷിക്കുന്നു; ‘തന്റെമേൽ വരാനിരിക്കുന്നതെല്ലാം’ മൂലഭാഷയുടെ രൂപം നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പ് സ്വാഭാവികമായ പകരംവായന നൽകുന്നു.
