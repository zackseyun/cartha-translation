source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: ml
  text: 'യേശു അവനോട് ഉത്തരം പറഞ്ഞു: “ഞാൻ തെറ്റായി സംസാരിച്ചെങ്കിൽ, ആ തെറ്റിനെക്കുറിച്ച് സാക്ഷ്യം പറയുക[a]; എന്നാൽ ഞാൻ ശരിയായി സംസാരിച്ചതെങ്കിൽ, എന്തിന് എന്നെ അടിക്കുന്നു[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ തിന്മയെക്കുറിച്ച് സാക്ഷ്യം പറയുക” അല്ലെങ്കിൽ “എന്തായിരുന്നു തെറ്റെന്ന് സാക്ഷ്യം പറയുക.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എന്തിന് എന്നെ പ്രഹരിക്കുന്നു?” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് പൊതുവായി അടിക്കുക എന്നും ചില സന്ദർഭങ്ങളിൽ മർദിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: യേശു അവനോട് ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ ആഖ്യാനപ്രയോഗവും ദത്തിവ് സർവനാമത്തിന്റെ ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κακῶς ἐλάλησα
  choice: ഞാൻ തെറ്റായി സംസാരിച്ചെങ്കിൽ
  rationale: κακῶς എന്നത് ഇവിടെ മോശമായോ അനുചിതമായോ തെറ്റായോ സംസാരിച്ചതിനെ സൂചിപ്പിക്കാം; നീതിന്യായസന്ദർഭത്തിലും തുടർന്നുള്ള καλῶς എന്ന വിപരീതപദത്തോടും ‘തെറ്റായി’ നന്നായി ചേരുന്നു.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: ആ തെറ്റ് എന്താണെന്ന് സാക്ഷ്യം പറയുക
  rationale: μαρτύρησον എന്നതിന്റെ നിയമപരമായ സാക്ഷ്യഭാവം സൂക്ഷിക്കുകയും τοῦ κακοῦ എന്ന നാമവത്കൃത പ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു; ആരോപിക്കപ്പെടുന്ന തെറ്റ് എന്തെന്ന് തെളിവോടെ പറയണമെന്ന ആശയം അനാവശ്യമായി വികസിപ്പിക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: εἰ δὲ καλῶς
  choice: എന്നാൽ ശരിയായിട്ടാണ് സംസാരിച്ചതെങ്കിൽ
  rationale: δὲ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’കൊണ്ട് വ്യക്തമാക്കുന്നു; καλῶς എന്നത് മുൻപത്തെ ‘തെറ്റായി’ എന്നതിന്റെ നേരിട്ടുള്ള വിപരീതമായി ‘ശരിയായിട്ട്’ എന്നു നൽകുന്നു. ആവർത്തിച്ച ക്രിയ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ചേർത്തിരിക്കുന്നു.
- source_word: τί με δέρεις
  choice: എന്തിന് എന്നെ അടിക്കുന്നു
  rationale: τί ഇവിടെ കാരണത്തെ ചോദിക്കുന്നതിനാൽ ‘എന്തിന്’ സ്വാഭാവികമാണ്. δέρω അടിക്കുക, പ്രഹരിക്കുക, ചില സന്ദർഭങ്ങളിൽ മർദിക്കുക എന്ന വിശാല അർഥപരിധിയുള്ളതിനാൽ ‘അടിക്കുന്നു’ അതിന്റെ ബലം അതിരുകടന്ന് നിർണ്ണയിക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്യായമായ പ്രഹരത്തോടുള്ള യേശുവിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: തെറ്റുണ്ടെങ്കിൽ സാക്ഷ്യപ്പെടുത്തണമെന്നും ശരിയായാണ് സംസാരിച്ചതെങ്കിൽ പ്രഹരത്തിന്റെ കാരണം ചോദിക്കണമെന്നും ഉള്ള നിയമപരവും ധാർമികവുമായ വെല്ലുവിളിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: അനീതിയെ കൂടുതൽ തുറന്നുകാട്ടുന്ന ഏറ്റുമുട്ടൽഭാവമുള്ള പരാവർത്തനം, അല്ലെങ്കിൽ നിയമപരമായ ഭാവം മയപ്പെടുത്തുന്ന വിവർത്തനം.
  rationale: ഗ്രീക്ക് വാക്യം സാക്ഷ്യം ആവശ്യപ്പെടുകയും കാരണമില്ലാത്ത പ്രഹരത്തെ ചോദ്യം ചെയ്യുകയും ചെയ്യുന്നു. അതിനപ്പുറമുള്ള ഉപദേശപരമായോ സഭാവിഭാഗപരമായോ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘സാക്ഷ്യം പറയുക’ എന്നത് നീതിന്യായഭാവം നിലനിർത്തുന്നു; ‘അടിക്കുന്നു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗ്രീക്ക് ക്രിയയുടെ വിശാല അർഥപരിധിയോട് യോജിച്ചതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
