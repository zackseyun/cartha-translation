id: JHN.18.30
reference: John 18:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: ml
  text: 'അവർ അവനോടു മറുപടി പറഞ്ഞു: “ഇവൻ തിന്മ ചെയ്യുന്നവനായിരുന്നില്ലെങ്കിൽ, ഞങ്ങൾ ഇവനെ നിനക്കു ഏല്പിച്ചുതരുകയില്ലായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: അവർ അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ മറുപടി പറയുക എന്ന പൂർണ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; αὐτῷ പീലാത്തൊസിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവനോടു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Εἰ μὴ ἦν
  choice: ആയിരുന്നില്ലെങ്കിൽ
  rationale: യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധനയുടെ ഭാവം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὗτος
  choice: ഇവൻ
  rationale: യേശുവിനെ അകലം പാലിച്ചു ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക അവഹേളനം ചേർക്കുന്നില്ല.
- source_word: κακὸν ποιῶν
  choice: തിന്മ ചെയ്യുന്നവൻ
  rationale: ποιῶν എന്ന വർത്തമാന കൃദന്തത്തിന്റെ പ്രവർത്തനഭാവവും κακόν എന്നതിന്റെ ധാർമ്മിക ഗൗരവവും നിലനിർത്തുന്നു; സാങ്കേതികമായ നിയമക്കുറ്റപ്പേര് ചുമത്തുന്നില്ല.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: ഞങ്ങൾ ഇവനെ നിനക്കു ഏല്പിച്ചുതരുകയില്ലായിരുന്നു
  rationale: യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയുടെ ഫലവാക്യം കൃത്യമായി നൽകുകയും, നീതിന്യായസന്ദർഭത്തിലെ παραδίδωμι എന്നതിന്റെ കൈമാറൽ/ഏല്പിക്കൽ അർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിനെതിരായ ആരോപണത്തിന്റെ സ്വഭാവം
  choice: ‘തിന്മ ചെയ്യുന്നവൻ’ എന്ന പൊതുവായ ആരോപണമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കുറ്റവാളി’ അല്ലെങ്കിൽ ‘ദുഷ്‌പ്രവൃത്തിക്കാരൻ’.
  rationale: κακὸν ποιῶν ഒരു നിർദിഷ്ട നിയമക്കുറ്റം വ്യക്തമാക്കുന്ന സാങ്കേതിക പദമല്ല. അതിനാൽ കുറ്റാരോപകരുടെ അവ്യക്തവും പൊതുവുമായ ആരോപണം അതേപടി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മറുപടി പറഞ്ഞു’ സ്വാഭാവികതയ്ക്കായി സ്വീകരിച്ചു; ‘ഇവൻ’ കുറ്റാരോപകരുടെ അകലം പാലിക്കുന്ന സൂചന നിലനിർത്തുന്നു. ഈ കരടിൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
