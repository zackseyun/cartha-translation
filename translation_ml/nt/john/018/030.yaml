  terminology: Key terms are sound. “തിന്മ ചെയ്യുന്നവൻ” preserves the broad accusation; “ഏല്പിച്ചുതരുക” suitably expresses handing someone over in a judicial context. No doctrinally loaded terminology has been introduced.
