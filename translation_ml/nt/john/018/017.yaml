id: JHN.18.17
reference: John 18:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: ml
  text: 'അപ്പോൾ വാതിൽ കാക്കുന്ന വേലക്കാരിയായ പെൺകുട്ടി പത്രോസിനോടു പറഞ്ഞു: “നീയും ഈ മനുഷ്യന്റെ ശിഷ്യന്മാരിൽ ഒരാളല്ലല്ലോ?” അവൻ പറഞ്ഞു: “ഞാൻ അല്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാതിൽകാവൽക്കാരിയായ അടിമപ്പെൺകുട്ടി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: παιδίσκη എന്നതിന് ‘അടിമപ്പെൺകുട്ടി’ എന്നും θυρωρός എന്നതിന് ‘വാതിൽകാവൽക്കാരി’ എന്നും നൽകാവുന്ന ശബ്ദാർഥവികല്പം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: ഇവിടെ കഥയുടെ തുടർച്ചയും സംഭവക്രമവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനബന്ധകമാണ്.
- source_word: παιδίσκη
  choice: വേലക്കാരിപ്പെൺകുട്ടി
  rationale: പ്രായവും സേവകസ്ഥാനവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു. നിയമപരമായ അടിമസ്ഥിതി ഉറപ്പിച്ച് പറയാതെ മൂലപദത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
- source_word: θυρωρός
  choice: വാതിൽ കാത്തിരുന്ന
  rationale: പ്രവേശനവാതിലിന്റെ ചുമതലയുള്ളവൾ എന്ന പ്രവർത്തനപരമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Μὴ καὶ σὺ
  choice: നീയും ... ഒരാളല്ലല്ലോ?
  rationale: നിഷേധാത്മക മറുപടി പ്രതീക്ഷിക്കുന്ന μή-ചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘അല്ലല്ലോ?’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν μαθητῶν
  choice: ശിഷ്യന്മാരിൽ ഒരാൾ
  rationale: ഒരു കൂട്ടത്തിലെ അംഗത്വം സൂചിപ്പിക്കുന്ന ἐκ എന്നതിന്റെ ഭാഗികതാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: ഈ മനുഷ്യന്റെ
  rationale: ἄνθρωπος എന്ന സാധാരണ പദവും τούτου നൽകുന്ന അകലം പാലിക്കുന്ന ഭാവവും അനാവശ്യ അപമാനഭാവം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ പത്രോസിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവിക സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: Οὐκ εἰμί
  choice: ഞാൻ അല്ല
  rationale: ഗ്രീക്കിലെ ഹ്രസ്വവും നേരിട്ടുമായ നിഷേധം അധികവാക്കുകൾ ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: μή കൊണ്ട് ആരംഭിക്കുന്ന നിഷേധചോദ്യത്തിന്റെ ശക്തി
  choice: നിഷേധാത്മക മറുപടി പ്രതീക്ഷിക്കുന്ന ‘നീയും ... ഒരാളല്ലല്ലോ?’ എന്ന രൂപം
  alternative: ‘നീയും ... ഒരാളാണോ?’ എന്ന നിഷ്പക്ഷചോദ്യം
  rationale: മൂലഭാഷയിലെ ചോദ്യത്തിന് നിഷേധമറുപടി പ്രതീക്ഷിക്കുന്ന സൂചനയുണ്ട്; അത് അമിതമായി വ്യാഖ്യാനിക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: παιδίσκη എന്ന പദത്തിലെ സാമൂഹികസ്ഥാനസൂചന
  choice: പ്രധാന പാഠത്തിൽ ‘വേലക്കാരിപ്പെൺകുട്ടി’
  alternative: ‘അടിമപ്പെൺകുട്ടി’
  rationale: പദം പെൺദാസിയെയോ അടിമപ്പെൺകുട്ടിയെയോ സൂചിപ്പിക്കാം. ഇവിടെ അവളുടെ പ്രായം, ലിംഗം, സേവകവേഷം എന്നിവയാണ് മുൻനിരയിൽ; നിയമപരമായ അടിമസ്ഥിതി പാഠം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. ചോദ്യം സംസാരഭാഷയിൽ സ്വാഭാവികമാക്കിയെങ്കിലും ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തിയിരിക്കുന്നു.
