id: JHN.18.10
reference: John 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: ml
  text: അപ്പോൾ വാൾ കൈവശമുണ്ടായിരുന്ന ശിമോൻ പത്രോസ് അത് ഊരിയെടുത്ത് മഹാപുരോഹിതന്റെ അടിമയെ[a] പ്രഹരിച്ച് അയാളുടെ വലതു ചെവി അറുത്തുകളഞ്ഞു. ആ അടിമയുടെ പേര് മൽക്കൊസ് എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മഹാപുരോഹിതന്റെ സേവകനെ.” ഗ്രീക്ക് പദമായ δοῦλος-ന് സന്ദർഭമനുസരിച്ച് “അടിമ” എന്നോ “ദാസൻ/സേവകൻ” എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭവത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതി സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; അതിനെ അതിരുകടന്ന യുക്തിനിഗമനമായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: ἔχων μάχαιραν
  choice: വാൾ കൈവശമുണ്ടായിരുന്ന
  rationale: ἔχων എന്ന പങ്കാളിത്തരൂപത്തിന്റെ വിവരണാത്മക സ്വഭാവം നിലനിർത്തുന്നു. μάχαιρα ചെറുവാളിനെയോ കഠാരയെയോ സൂചിപ്പിക്കാമെങ്കിലും ‘വാൾ’ വിശാലവും സ്വാഭാവികവുമായ പദമാണ്.
- source_word: εἵλκυσεν αὐτὴν
  choice: അത് ഊരിയെടുത്ത്
  rationale: ആയുധം ഉറയിൽനിന്ന് പുറത്തെടുക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔπαισεν
  choice: പ്രഹരിച്ച്
  rationale: ആയുധംകൊണ്ടുള്ള അടിയെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ അറിയിക്കുന്നു; തുടർന്നുള്ള ചെവി അറുത്ത സംഭവവുമായി അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: മഹാപുരോഹിതന്റെ അടിമയെ
  rationale: ഉടമസ്ഥബന്ധം വ്യക്തമാകുന്ന ഈ സന്ദർഭത്തിൽ δοῦλος എന്നതിന്റെ ബന്ധിതപദവി ‘അടിമ’ കൂടുതൽ നേരിട്ട് അറിയിക്കുന്നു. ‘ദാസൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπέκοψεν
  choice: അറുത്തുകളഞ്ഞു
  rationale: മുറിച്ചുമാറ്റുക എന്ന ക്രിയയുടെ ഫലം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ὠτάριον τὸ δεξιόν
  choice: വലതു ചെവി
  rationale: ὠτάριον എന്ന ലഘുരൂപം ഇവിടെ സാധാരണ അർഥത്തിലുള്ള ‘ചെവി’യെ സൂചിപ്പിക്കുന്നു; ‘ചെവിക്കുട’ എന്നത് അനാവശ്യമായി പ്രത്യേകീകരിക്കും.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: ആ അടിമയുടെ പേര് മൽക്കൊസ് എന്നായിരുന്നു
  rationale: δέ കൊണ്ടുവരുന്ന അനുബന്ധ തിരിച്ചറിയൽവിവരം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; Μάλχος എന്ന പേര് ഗ്രീക്ക് ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: മഹാപുരോഹിതനോടുള്ള ഉടമസ്ഥബന്ധം വ്യാകരണത്തിൽ വ്യക്തമായതിനാൽ ബന്ധിത സാമൂഹികപദവി മറച്ചുവയ്ക്കാതെ ‘അടിമ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു. എന്നാൽ പദത്തിന് സന്ദർഭാനുസൃതമായി ‘ദാസൻ’ അല്ലെങ്കിൽ ‘സേവകൻ’ എന്നും അർഥമാകാമെന്ന ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘പ്രഹരിച്ച്’ എന്നത് ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോൾ ‘അറുത്തുകളഞ്ഞു’ സംഭവഫലം നേരിട്ട് വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചൂണ്ടിക്കാട്ടുന്ന [a] ബന്ധപ്പെട്ട δοῦλος എന്ന പദത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
