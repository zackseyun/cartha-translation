id: JHN.18.35
reference: John 18:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: ml
  text: 'പീലാത്തോസ് മറുപടി പറഞ്ഞു: “ഞാൻ ഒരു യെഹൂദനല്ലല്ലോ? നിന്റെ സ്വന്തം ജനതയും മുഖ്യപുരോഹിതന്മാരും നിന്നെ എന്റെ കൈയിൽ ഏൽപ്പിച്ചു. നീ എന്താണ് ചെയ്തത്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Μήτι
  choice: ഞാൻ ... അല്ലല്ലോ, അല്ലേ?
  rationale: നിഷേധാത്മക മറുപടി പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ വാചാടോപശക്തി മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰουδαῖός
  choice: യെഹൂദൻ
  rationale: ഇവിടെ പീലാത്തോസ് തന്റെ വംശീയ-ദേശീയ തിരിച്ചറിവിനെ യേശുവിന്റെയും അവനെ ഏൽപ്പിച്ചവരുടെയും തിരിച്ചറിവിൽനിന്ന് വേർതിരിക്കുന്നു; അതിനാൽ ‘യെഹൂദൻ’ ഏറ്റവും സ്വാഭാവികം.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: നിന്റെ സ്വന്തം ജനത
  rationale: ἔθνος എന്നതിന്റെ കൂട്ടായ ജനവിഭാഗസൂചനയും τὸ σὸν എന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് പതിവായും കൃത്യമായും യോജിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: παρέδωκάν σε ἐμοί
  choice: നിന്നെ എന്റെ കൈയിൽ ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: അധികാരിയുടെ കയ്യിൽ ഏൽപ്പിക്കുന്ന ന്യായവ്യവഹാരപരമായ അർത്ഥം നൽകുന്നു; ‘ഒറ്റിക്കൊടുത്തു’ എന്ന അധിക ധാർമികഭാരം ചേർക്കുന്നില്ല.
- source_word: τί ἐποίησας
  choice: നീ എന്താണ് ചെയ്തത്?
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെക്കുറിച്ചുള്ള ചോദ്യം നിലവിലെ വിചാരണാസന്ദർഭവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαῖος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യെഹൂദൻ
  alternative: യെഹൂദ്യൻ
  rationale: ചില സന്ദർഭങ്ങളിൽ പദത്തിന് പ്രദേശപരമായ ‘യെഹൂദ്യൻ’ എന്ന അർത്ഥം സാധ്യമാണെങ്കിലും, ഇവിടെ ‘നിന്റെ സ്വന്തം ജനത’ എന്ന തുടർവാക്യത്തോടൊപ്പം വംശീയ-ദേശീയ അർത്ഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. പീലാത്തോസിന്റെ അകലം പാലിക്കുന്ന ഭാവവും നിഷേധാത്മക മറുപടി പ്രതീക്ഷിക്കുന്ന ചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു.
