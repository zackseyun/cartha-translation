    rationale: δεδεμένον is a perfect passive participle indicating that he was in a bound state when sent. “കെട്ടിയ നിലയിൽ” naturally expresses that ongoing state in modern standard Malayalam.
  - severity: low
    issue: അതുകൊണ്ട് can sound more explicitly consequential than the narrative connective requires.
    rationale: οὖν can mark inference or narrative progression. “അങ്ങനെ” is a natural Malayalam narrative rendering that preserves the connection without making the logic overly explicit.
