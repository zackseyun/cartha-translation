id: JHN.18.24
reference: John 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: ml
  text: അങ്ങനെ അന്നാസ് അവനെ കെട്ടിയ നിലയിൽ മഹാപുരോഹിതനായ കയ്യഫാവിന്റെ അടുക്കലേക്ക് അയച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ഈ സന്ദർഭത്തിൽ മുമ്പ് നടന്ന കാര്യങ്ങളെ വിശദീകരിക്കുന്ന ഇടക്കുറിപ്പായി എടുത്താൽ: “അന്നാസ് അവനെ കെട്ടിയ നിലയിൽ മഹാപുരോഹിതനായ കയ്യഫാവിന്റെ അടുക്കലേക്ക് അയച്ചിരുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് സജീവ നിർദേശകരൂപം; ലളിതമായ ആഖ്യാനത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: ആഖ്യാനത്തിലെ മുൻവിവരവുമായി ഉള്ള നിഗമനപരമോ തുടർച്ചാപരമോ ആയ ബന്ധം നിലനിർത്തുന്നു; ഇവിടെ വെറും കാലക്രമസൂചകമായ ‘പിന്നെ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ബന്ധകബലം വ്യക്തമാക്കുന്നു.
- source_word: δεδεμένον
  choice: ബന്ധിതനായി
  rationale: δέω എന്ന ക്രിയയുടെ പെർഫെക്റ്റ് കർമണി പങ്കാളിത്തരൂപം; അയയ്ക്കപ്പെട്ട സമയത്ത് അവൻ കെട്ടപ്പെട്ട നിലയിലായിരുന്നു എന്ന തുടർന്നുനിൽക്കുന്ന അവസ്ഥ ചുരുക്കമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸς
  choice: അടുക്കലേക്ക്
  rationale: ചലനക്രിയയോടൊപ്പം വ്യക്തിയിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; ‘കയ്യഫാവിന്റെ അടുക്കലേക്ക്’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Καϊάφαν
  choice: കയ്യഫാവ്
  rationale: Καϊάφας എന്ന പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം; വിഭക്തി ചേർത്ത് ‘കയ്യഫാവിന്റെ’ എന്നു നൽകി.
- source_word: τὸν ἀρχιερέα
  choice: മഹാപുരോഹിതനായ
  rationale: യഹൂദ മഹാപുരോഹിതപദവിയെയാണ് ἀρχιερεύς ഇവിടെ സൂചിപ്പിക്കുന്നത്; വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന മലയാളഘടനയിൽ സ്വാഭാവികമായി നൽകി.
- source_word: ὁ Ἅννας
  choice: അന്നാസ്
  rationale: Ἅννας എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന പ്രചാരമുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: ചുറ്റുപാടുള്ള വാക്യങ്ങളോടുള്ള ബന്ധത്തിൽ സംഭവക്രമം
  choice: അന്നാസ് അവനെ ബന്ധിതനായി കയ്യഫാവിന്റെ അടുക്കലേക്ക് അയച്ചു എന്ന ലളിതമായ ഭൂതകാല ആഖ്യാനമായി മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: 'മുമ്പ് നടന്ന കൈമാറ്റത്തെ വിശദീകരിക്കുന്ന ഇടക്കുറിപ്പായി: ‘അന്നാസ് അവനെ ബന്ധിതനായി കയ്യഫാവിന്റെ അടുക്കലേക്ക് അയച്ചിരുന്നു.’'
  rationale: ഗ്രീക്കിലെ ഏറിസ്റ്റ് നിർദേശകരൂപം സ്വാഭാവികമായി ഒരു ആഖ്യാനസംഭവമായി വായിക്കാം. യോഹന്നാൻ 18:24-ന്റെ സംഭവക്രമത്തെക്കുറിച്ചുള്ള വ്യത്യസ്ത വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്ത് സംഘർഷം പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, അതേസമയം മാന്യവും തിരുവെഴുത്ത് ആഖ്യാനത്തിന് യോജിച്ചതുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സംഭവക്രമത്തെ സംബന്ധിച്ച യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തി.
