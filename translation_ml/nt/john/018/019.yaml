id: JHN.18.19
reference: John 18:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: ml
  text: അതുകൊണ്ട് മഹാപുരോഹിതൻ യേശുവിനോട് അവന്റെ ശിഷ്യന്മാരെക്കുറിച്ചും അവന്റെ ഉപദേശത്തെക്കുറിച്ചും ചോദ്യം ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ചോദിച്ചു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ചോദിച്ചു’ എന്നും ‘ചോദ്യം ചെയ്തു’ എന്നും അർഥമാകാം; ഔപചാരികമായ വിചാരണാസന്ദർഭം പ്രതിഫലിപ്പിക്കാൻ ഇവിടെ ‘ചോദ്യം ചെയ്തു’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപരമായ തുടർച്ചയോ നിഗമനമോ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ബന്ധകബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: യഹൂദ മഹാപുരോഹിതന്റെ ഔദ്യോഗിക സ്ഥാനത്തിനുള്ള സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദം; സന്ദർഭത്തിലെ വ്യക്തിയുടെ പേര് ചേർത്ത് മൂലപാഠത്തെ വിശദീകരിച്ചോ സമന്വയിപ്പിച്ചോിട്ടില്ല.
- source_word: ἠρώτησεν
  choice: ചോദ്യംചെയ്തു
  rationale: ഔപചാരികമായ വിചാരണാസന്ദർഭം പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം ‘ചോദ്യം ചെയ്തു’ എന്നതിനെക്കാൾ കടുത്ത ‘വിസ്തരിച്ചു’ എന്ന ആശയം നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: വിചാരണയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്ന περὶ + genitive എന്ന പ്രയോഗത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളസമാനം; രണ്ടു പ്രാവശ്യവും അതേ ബന്ധം നിലനിർത്തുന്നു.
- source_word: μαθητῶν
  choice: ശിഷ്യന്മാർ
  rationale: ഗുരു–ശിഷ്യബന്ധം കൃത്യമായി സൂക്ഷിക്കുന്ന, സുവിശേഷങ്ങളിൽ സ്ഥാപിതമായ മലയാളപ്രയോഗം.
- source_word: διδαχῆς
  choice: ഉപദേശം
  rationale: ഇവിടെ യേശു പഠിപ്പിച്ച കാര്യങ്ങളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘സിദ്ധാന്തം’ എന്ന പദം വരുത്താവുന്ന പിൽക്കാല സാങ്കേതിക അർഥഭാരം ഒഴിവാക്കുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: രണ്ടിടത്തും യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ ശിഷ്യന്മാർ’, ‘അവന്റെ ഉപദേശം’ എന്ന ഘടന മൂലപാഠത്തിലെ ആവർത്തനം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിൽ അന്നാസ് ഉൾപ്പെട്ടിരിക്കുമ്പോൾ ἀρχιερεύς എന്ന സ്ഥാനപ്പേര് എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ഗ്രീക്കിലെ സ്ഥാനപ്പേര് നേരിട്ട് ‘മഹാപുരോഹിതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘മഹാപുരോഹിതനായ അന്നാസ്’ അല്ലെങ്കിൽ ‘മുഖ്യപുരോഹിതൻ’
  rationale: വ്യക്തിയുടെ പേര് ചേർത്തോ ചരിത്രപരമായ വിശദാംശങ്ങൾ സമന്വയിപ്പിച്ചോ ഇല്ലാതെ സുവിശേഷകന്റെ ആഖ്യാനരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ രണ്ടു περὶ ഘടകങ്ങളും αὐτοῦ എന്ന ആവർത്തനവും സാധ്യമായത്ര സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
