id: JHN.18.5
reference: John 18:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: ml
  text: അവർ അവനോട്, “നസറായനായ യേശുവിനെ,” എന്ന് ഉത്തരം പറഞ്ഞു. അവൻ അവരോട്, “ഞാൻ തന്നെയാണ്,” എന്നു പറഞ്ഞു. അവനെ ഒറ്റിക്കൊടുക്കുന്ന യൂദയും അവരോടൊപ്പം നിന്നിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: നസറായനായ യേശുവിനെ
  rationale: ζητεῖτε എന്ന മുൻവാക്യത്തിലെ ‘അന്വേഷിക്കുന്നു’ എന്ന ക്രിയയുടെ ആശയപരമായ കർമമായി നിൽക്കുന്ന അക്കുസറ്റീവ് രൂപം മലയാളത്തിൽ സ്വാഭാവികമായി കർമവിഭക്തിയിൽ നൽകി; Ναζωραῖος എന്ന വിശേഷണം ‘നസറായനായ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: സന്ദർഭത്തിൽ ‘നിങ്ങൾ അന്വേഷിക്കുന്ന ആൾ ഞാൻ തന്നെയാണ്’ എന്ന തിരിച്ചറിയൽ ഉത്തരം സ്വാഭാവികമായി നൽകുന്നു; അതേസമയം ഗ്രീക്കിലെ ഊന്നലും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: അവനെ ഒറ്റിക്കൊടുക്കുന്ന
  rationale: വർത്തമാന കർത്തൃകൃദന്തരൂപത്തിന്റെ പുരോഗമിക്കുന്ന സ്വഭാവം നിലനിർത്തി; സന്ദർഭത്തിൽ യൂദയുടെ വഞ്ചനാപരമായ കൈമാറ്റത്തെ ‘ഒറ്റിക്കൊടുക്കുക’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἱστήκει
  choice: അവിടെ നിന്നിരുന്നു
  rationale: പ്ലൂപർഫെക്റ്റ് രൂപം സൂചിപ്പിക്കുന്ന നിലകൊണ്ടിരുന്ന അവസ്ഥ മലയാളത്തിലെ ‘നിന്നിരുന്നു’ കൊണ്ട് നൽകി; ‘അവിടെ’ ചേർത്തത് മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കാണ്.
theological_decisions:
- issue: Ἐγώ εἰμι എന്ന പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: ഞാൻ തന്നെയാണ്
  alternative: ഞാൻ ആകുന്നു / ഞാൻ അവനാണ്
  rationale: ഈ ഉടൻസന്ദർഭത്തിൽ ഇത് യേശുവിന്റെ തിരിച്ചറിയൽ ഉത്തരമാണ്. ‘ഞാൻ തന്നെയാണ്’ എന്ന് നൽകുന്നത് ഇംഗ്ലീഷിലെ പൂരകപദം ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്കിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; അതേസമയം ദൈവനാമത്തോടുള്ള സാധ്യതയുള്ള പ്രതിധ്വനി വിശദീകരിച്ച് അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സംഭാഷണത്തിന്റെ സംക്ഷിപ്തതയും അവസാനവാക്യത്തിലെ വിവരണാത്മക ഭാവവും നിലനിർത്തി.
