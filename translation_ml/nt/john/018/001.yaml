source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: ml
  text: ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം പുറപ്പെട്ട് കിദ്രോൻ തോടിന്റെ[a] മറുകരയിലേക്കു കടന്നു. അവിടെ ഒരു തോട്ടം ഉണ്ടായിരുന്നു; യേശുവും അവന്റെ ശിഷ്യന്മാരും അതിൽ പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കിദ്രോൻ മലയിടുക്കിന് അപ്പുറത്തേക്ക്” അല്ലെങ്കിൽ “കിദ്രോൻ നീർച്ചാലിന് അപ്പുറത്തേക്ക്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം മഴക്കാലത്തു വെള്ളമൊഴുകുന്ന ഒരു നീർച്ചാലിനെയോ മലയിടുക്കിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം
  rationale: Aorist participle indicates an action preceding the main verb. This Malayalam temporal construction is natural and preserves the narrative sequence.
- source_word: ἐξῆλθεν
  choice: പോയി
  rationale: In this context the verb describes Jesus going out from the place where he had spoken. Malayalam 'പോയി' expresses the concrete movement naturally without the overly literary 'പുറപ്പെട്ടു'.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: The comitative sense of σύν is represented directly by 'ഓടൊപ്പം'; the reflexive possessive 'തന്റെ' clearly refers to Jesus.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: കിദ്രോൻ തോടിന്റെ മറുകരയിലേക്ക്
  rationale: πέραν marks movement to the far side. χείμαρρος denotes a seasonal watercourse or ravine; 'തോട്' is clear modern Malayalam, while the footnote preserves the fuller geographic range.
- source_word: ὅπου ἦν κῆπος
  choice: അവിടെ ഒരു തോട്ടം ഉണ്ടായിരുന്നു
  rationale: This naturally preserves both the locative relation and the existential force of ἦν. 'തോട്ടം' is the ordinary Malayalam equivalent of κῆπος.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: അതിൽ പ്രവേശിച്ചു
  rationale: The directional force of εἰς is conveyed by the locative-directional form 'അതിൽ' with 'പ്രവേശിച്ചു', avoiding an awkward Malayalam relative construction.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: യേശുവും ശിഷ്യന്മാരും
  rationale: Repeating 'യേശു' makes the subject unambiguous and natural in Malayalam; αὐτός does not require emphatic 'താൻതന്നെ' here.
