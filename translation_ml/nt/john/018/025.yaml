id: JHN.18.25
reference: John 18:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: ml
  text: ശിമോൻ പത്രോസ് നിന്നുകൊണ്ട് ചൂടുകൊള്ളുകയായിരുന്നു. അതുകൊണ്ട് അവർ അവനോട്[a], “നീയും അവന്റെ ശിഷ്യന്മാരിൽ ഒരാളല്ലല്ലോ?” എന്നു ചോദിച്ചു. അവൻ അത് നിഷേധിച്ച്, “ഞാനല്ല,” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീയും അവന്റെ ശിഷ്യന്മാരിൽ ഒരാളല്ലെന്ന് ഉറപ്പല്ലേ?” ഗ്രീക്കിലെ μή കൊണ്ടുള്ള ചോദ്യം നിഷേധാത്മകമായ ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്നത്.
    reason: ചോദ്യത്തിന്റെ നിഷേധാത്മക പ്രതീക്ഷയ്ക്കുള്ള ഭാഷാപരമായ മറ്റൊരു അവതരണം.
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ശിമോൻ പത്രോസ് ... ആയിരുന്നു
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തമായ കാലസൂചകപദമില്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: നിന്നുകൊണ്ട് ചൂടുകൊള്ളുകയായിരുന്നു
  rationale: പത്രോസിന്റെ തുടർന്നുകൊണ്ടിരുന്ന നിലയും സ്വയം ചൂടേൽക്കുന്നതും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഈ വാക്യത്തിൽ തീയെക്കുറിച്ച് നേരിട്ട് പറയാത്തതിനാൽ ‘തീ കായുകയായിരുന്നു’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: εἶπον οὖν αὐτῷ
  choice: അതുകൊണ്ട് അവർ അവനോട് ... എന്നു ചോദിച്ചു
  rationale: οὖν മുൻസന്ദർഭവുമായി ഫലപരമായ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു. ഉദ്ധരണി ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: നീയും ... ഒരാളല്ലല്ലോ?
  rationale: μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരവും καὶ σὺയിലെ ‘നീയും’ എന്ന ഊന്നലും മലയാളത്തിലെ ‘അല്ലല്ലോ?’ എന്ന ചോദ്യരൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ഒരാൾ
  rationale: ἐκ + ഷഷ്ഠി ഒരു കൂട്ടത്തിലെ അംഗത്വം സൂചിപ്പിക്കുന്നു.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: അവൻ അത് നിഷേധിച്ച്
  rationale: നിഷേധിച്ചത് ചോദ്യത്തിൽ ഉന്നയിച്ച അവകാശവാദമാണെന്ന് ‘അത്’ വ്യക്തമാക്കുന്നു; ἐκεῖνος നൽകുന്ന ലഘു ഊന്നൽ അതിരുകടന്ന് അടയാളപ്പെടുത്തുന്നില്ല.
- source_word: Οὐκ εἰμί
  choice: ഞാനല്ല
  rationale: ഗ്രീക്കിലെ ഹ്രസ്വവും നേരിട്ടുള്ളതുമായ നിഷേധം വിപുലീകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ നിഷേധത്തിന്റെ വ്യാപ്തി
  choice: യേശുവിന്റെ ശിഷ്യന്മാരിൽ ഒരാളാണെന്ന വാദം പത്രോസ് നേരിട്ട് നിഷേധിക്കുന്നതായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാൻ അവരിൽ ഒരാളല്ല’ എന്നു കൂടുതൽ വിശദമാക്കുക.
  rationale: ഗ്രീക്ക് ഉത്തരം ഹ്രസ്വവും ചോദ്യത്തിലെ ആശയം ആശ്രയിച്ചുള്ളതുമാണ്; അതിനെ വിപുലമായ ദൈവശാസ്ത്രപരമായ നിഷേധമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ നിഷേധാത്മക ചോദ്യത്തിന്റെ ഭാവം ‘അല്ലല്ലോ?’ വഴി നിലനിർത്തി; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘തീ’ ചേർത്തിട്ടില്ല.
