id: JHN.18.32
reference: John 18:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: ml
  text: താൻ ഏതുതരത്തിലുള്ള മരണത്തിലൂടെ മരിക്കാനിരുന്നതെന്ന് സൂചിപ്പിച്ചുകൊണ്ട് യേശു പറഞ്ഞ വചനം[a] നിവൃത്തിയാകേണ്ടതിനായിരുന്നു ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുവിന്റെ വാക്ക്’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: നിവൃത്തിയാകേണ്ടതിനായിരുന്നു ഇത്
  rationale: ἵνα ഇവിടെ സംഭവത്തിന്റെ ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തോട് ബന്ധിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ വിധത്തിൽ ‘ഇത്’ ചേർത്തു.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: യേശു പറഞ്ഞ വചനം
  rationale: λόγος ഇവിടെ യോഹന്നാൻ 1:1-ലെ വ്യക്തിനാമപരമായ ‘വചനം’ അല്ല, യേശുവിന്റെ മുൻപ്രസ്താവനയാണ്. ബന്ധവാക്യത്തിലെ ആവർത്തനം ഒഴിവാക്കി ജനിറ്റീവ് അർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കി.
- source_word: πληρωθῇ
  choice: നിവൃത്തിയാകേണ്ടതിനായിരുന്നു
  rationale: യോഹന്നാനിലെ നിവൃത്തി-ഭാഷയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; വെറും ‘സത്യമായി’ എന്നതിനെക്കാൾ മൂലപദത്തോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: ὃν εἶπεν
  choice: പറഞ്ഞ
  rationale: മുൻപ് പറഞ്ഞ വചനത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ കൃതന്തഘടനയായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: σημαίνων
  choice: സൂചിപ്പിച്ചുകൊണ്ട്
  rationale: വർത്തമാന കൃതന്തത്തിന്റെ സാഹചര്യപരമായ ഭാവം നിലനിർത്തുന്നു; ഉദ്ദേശ്യം മാത്രം നിർബന്ധമായി വായിക്കാതെ, പറയലിനോടൊപ്പം ഉണ്ടായ സൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ποίῳ θανάτῳ
  choice: എങ്ങനെയുള്ള മരണത്താൽ
  rationale: ποίῳ മരണത്തിന്റെ വസ്തുതയല്ല, അതിന്റെ തരമോ രീതിയോ ചോദിക്കുന്നു; ദത്തിവ് മരണത്തിന്റെ മാർഗം സൂചിപ്പിക്കുന്നതിനാൽ ‘മരണത്താൽ’ ഉപയോഗിച്ചു.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: മരിക്കാനിരിക്കുകയായിരുന്നു
  rationale: സമീപഭാവി/വരാനിരിക്കുന്ന സംഭവം എന്ന μέλλω-യുടെ ശക്തി നൽകുന്നു; ‘വിധിക്കപ്പെട്ടിരുന്നു’ എന്ന കൂടുതൽ നിർണയവാദപരമായ അർത്ഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ മുൻപ്രസ്താവനയും നിവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘വചനം നിവൃത്തിയാകേണ്ടതിനായിരുന്നു’ എന്ന വ്യക്തമായ നിവൃത്തി-ഭാഷ നിലനിർത്തി.
  alternative: ‘യേശു പറഞ്ഞത് സത്യമായിത്തീരേണ്ടതിന്’
  rationale: πληρόω എന്ന പദം യോഹന്നാനിൽ മുൻകൂട്ടിപ്പറഞ്ഞതിന്റെ നിവൃത്തി എന്ന ദൈവശാസ്ത്രപരമായ ആശയം വഹിക്കുന്നു; ലഘൂകരിച്ച പകരംവാക്ക് അത് ക്ഷയിപ്പിക്കും.
- issue: μέλλω യേശുവിന്റെ മരണത്തെക്കുറിച്ച് നൽകുന്ന സൂചന
  choice: ‘മരിക്കാനിരിക്കുകയായിരുന്നു’
  alternative: ‘മരിക്കാൻ വിധിക്കപ്പെട്ടിരുന്നു’
  rationale: മൂലപാഠം വരാനിരിക്കുന്ന മരണത്തെ സൂചിപ്പിക്കുന്നു; ഈ വാക്യം മാത്രം ശക്തമായ മുൻനിർണയവാദപരമായ പ്രസ്താവന നിർബന്ധിക്കുന്നില്ല.
- issue: σημαίνων എന്ന കൃതന്തത്തിന്റെ ബന്ധം
  choice: ‘സൂചിപ്പിച്ചുകൊണ്ട്’ എന്ന സാഹചര്യപരമായ കൃതന്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സൂചിപ്പിക്കാനായി’
  rationale: ഗ്രീക്കിൽ കൃതന്തം ഉദ്ദേശ്യമായി മനസ്സിലാക്കാനാകുമെങ്കിലും, അതിനെ ഉദ്ദേശ്യത്തിൽ മാത്രം പരിമിതപ്പെടുത്താതെ യഥാർത്ഥ വ്യാകരണപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമായ മലയാളം. ‘വചനം’, ‘നിവൃത്തിയാകുക’ എന്നീ പരിചിതമായ ബൈബിൾ പ്രയോഗങ്ങൾ സന്ദർഭോചിതമായി നിലനിർത്തി.
