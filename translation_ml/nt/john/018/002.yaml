id: JHN.18.2
reference: John 18:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: ml
  text: അവനെ ഒറ്റിക്കൊടുക്കുന്ന[a] യൂദാസിനും ആ സ്ഥലം അറിയാമായിരുന്നു; കാരണം, യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം പലപ്പോഴും അവിടെ ഒത്തുകൂടിയിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ ഏല്പിച്ചുകൊടുക്കുന്ന.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം പലപ്പോഴും അവിടെ കണ്ടുമുട്ടിയിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: അറിയാമായിരുന്നു
  rationale: സ്ഥലത്തെക്കുറിച്ചുള്ള യൂദാസിന്റെ മുൻപരിചയവും അറിവും സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കൃത്രിമമായ ‘എന്നാൽ’ അല്ലെങ്കിൽ കാലസൂചനയുള്ള ‘അപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: യൂദാസിനും
  rationale: ‘-ഉം’ എന്ന പ്രത്യയം καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: അവനെ ഒറ്റിക്കൊടുക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ സജീവമായ വിവരണഭാവവും ഈ സന്ദർഭത്തിലെ വഞ്ചനയുടെ ആഖ്യാനാർത്ഥവും നിലനിർത്തുന്നു.
- source_word: τὸν τόπον
  choice: ആ സ്ഥലം
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച നിർദിഷ്ട സ്ഥലത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘ആ സ്ഥലം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὅτι
  choice: കാരണം
  rationale: യൂദാസിന് സ്ഥലം അറിയാമായിരുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധത്തെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: πολλάκις
  choice: പലപ്പോഴും
  rationale: ആവർത്തിച്ചുണ്ടായിരുന്ന പ്രവൃത്തിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: συνήχθη
  choice: ഒത്തുകൂടിയിരുന്നു
  rationale: രൂപത്തിൽ നിഷ്ക്രിയമായിരുന്നാലും സന്ദർഭത്തിൽ ഒന്നിച്ചുകൂടുക എന്ന അകർമ്മക അർത്ഥം സ്വാഭാവികമാണ്. പശ്ചാത്തലത്തിൽ പതിവായി നടന്നിരുന്ന പ്രവൃത്തിയെ ‘ഒത്തുകൂടിയിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: തന്റെ ശിഷ്യന്മാരോടൊപ്പം
  rationale: μετάയുടെ സഹവാസാർത്ഥവും യേശുവുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന αὐτοῦയുടെ പ്രതിഫലനസ്വഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യൂദാസിനെക്കുറിച്ചുള്ള παραδιδοὺς എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ഒറ്റിക്കൊടുക്കുന്ന
  alternative: ഏല്പിച്ചുകൊടുക്കുന്ന
  rationale: യോഹന്നാന്റെ പീഡാനുഭവ ആഖ്യാനത്തിൽ ഇത് നിഷ്പക്ഷമായ കൈമാറ്റമല്ല, യൂദാസിന്റെ വഞ്ചനാപരമായ പ്രവൃത്തിയാണ്. മുഖ്യപാഠം ആ നൈതിക-ആഖ്യാനഭാരം വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: συνήχθηയുടെ നിഷ്ക്രിയരൂപവും സന്ദർഭാർത്ഥവും
  choice: യേശു തന്റെ ശിഷ്യന്മാരോടൊപ്പം അവിടെ ഒത്തുകൂടിയിരുന്നു
  alternative: യേശു തന്റെ ശിഷ്യന്മാരെ അവിടെ കണ്ടുമുട്ടിയിരുന്നു
  rationale: ഗ്രീക്ക് നിഷ്ക്രിയരൂപം ഇവിടെ അകർമ്മകമായി ‘ഒന്നിച്ചുകൂടി’ എന്ന അർത്ഥത്തിൽ ഗ്രഹിക്കാം. മുഖ്യപരിഭാഷ രൂപകത്തെ സംരക്ഷിക്കുമ്പോൾ, ‘കണ്ടുമുട്ടി’ എന്ന സന്ദർഭസാധ്യമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഒറ്റിക്കൊടുക്കുന്ന’ സാധാരണ വായനക്കാരന് ഉടൻ ഗ്രഹിക്കാവുന്നതാണ്; ‘ഒത്തുകൂടിയിരുന്നു’ മൂലത്തിലെ gathering അർത്ഥം സംരക്ഷിക്കുന്നു. ശക്തമായ വൈരുധ്യമോ വ്യക്തമായ കാലസൂചനയോ ഇല്ലാത്തതിനാൽ δέയ്ക്കായി വേറെ ബന്ധപദം ചേർത്തിട്ടില്ല.
