  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: ml
  text: പന്ത്രണ്ടുപേരിൽ ഒരാളായ, ദിദിമൊസ്[a] എന്നു വിളിക്കപ്പെട്ടിരുന്ന തോമസ്, യേശു വന്നപ്പോൾ അവരോടൊപ്പം ഉണ്ടായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദിദിമൊസ്’ എന്ന ഗ്രീക്ക് പേരിന്റെ അർത്ഥം ‘ഇരട്ട’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ വാക്യത്തിന്റെ ആഖ്യാനമാറ്റത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, തോമസിലേക്കുള്ള നേരിയ ആഖ്യാനമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘എന്നാൽ’ ചേർത്താൽ ഉറവിടത്തേക്കാൾ ശക്തമായ വൈരുധ്യം തോന്നാം.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: പന്ത്രണ്ടുപേരിൽ ഒരാൾ
  rationale: യേശുവിന്റെ അംഗീകൃത ശിഷ്യസംഘമായ ‘പന്ത്രണ്ടുപേർ’ എന്ന കൂട്ടപ്പേരിനെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ശിഷ്യന്മാർ’ ചേർക്കുന്നില്ല.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: ദിദിമൊസ് എന്നു വിളിക്കപ്പെട്ടിരുന്നവൻ
  rationale: Δίδυμος ഇവിടെ തോമസിനോടൊപ്പം ഉപയോഗിക്കുന്ന ഗ്രീക്ക് പേരോ വിശേഷണമോ ആണ്. മുഖ്യപാഠത്തിൽ പരിചിതരൂപം ലിപ്യന്തരം ചെയ്ത് അതിന്റെ അർത്ഥമായ ‘ഇരട്ട’ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: അവരോടൊപ്പം ഉണ്ടായിരുന്നില്ല
  rationale: μετά + genitive സഹവാസത്തെ സൂചിപ്പിക്കുന്നു; imperfect രൂപം ആ സമയത്തെ തോമസിന്റെ അഭാവം നേരിട്ട് അറിയിക്കുന്നു.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: യേശു വന്നപ്പോൾ
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള മലയാളരൂപമാണിത്; ‘എത്തിയപ്പോൾ’ എന്നതിനെക്കാൾ കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions:
- issue: Δίδυμος എന്നതിന്റെ പരിഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘ദിദിമൊസ്’ എന്നു ലിപ്യന്തരം ചെയ്ത് ‘ഇരട്ട’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുക
  alternative: മുഖ്യപാഠത്തിൽ ‘ഇരട്ട എന്നു വിളിക്കപ്പെട്ടിരുന്നവൻ’ എന്ന് അർത്ഥപരിഭാഷ ചെയ്യുക
  rationale: ഇത് സിദ്ധാന്തപരമായി തർക്കമുള്ള പദമല്ല. എന്നിരുന്നാലും വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന പരമ്പരാഗത ഗ്രീക്ക് രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ സുതാര്യമായ ശാബ്ദിക അർത്ഥം അടിക്കുറിപ്പിലൂടെ വായനക്കാരന് നൽകുകയും ചെയ്യുന്നത് പേരിന്റെ സ്വഭാവവും അർത്ഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. δέ-യ്ക്ക് അനാവശ്യമായി ‘എന്നാൽ’ അല്ലെങ്കിൽ കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. ഗ്രീക്ക് വാക്യത്തിലെ വിവരക്രമം മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമാക്കുന്നതിനായി തോമസ് എന്ന കർത്താവ് വിവരണഘടകങ്ങൾക്ക് ശേഷം നൽകിയിരിക്കുന്നു.
