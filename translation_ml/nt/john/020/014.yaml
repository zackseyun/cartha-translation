revisions:
- from: ഇതു പറഞ്ഞശേഷം അവൾ പിന്നിലേക്കു തിരിഞ്ഞു; യേശു അവിടെ നിൽക്കുന്നതു കണ്ടു. എന്നാൽ അതു യേശുവാണെന്ന് അവൾ അറിഞ്ഞില്ല.[a]
  to: ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം അവൾ പിന്നോട്ട് തിരിഞ്ഞ്, യേശു അവിടെ നിൽക്കുന്നതു കണ്ടു; അവൻ യേശുവാണെന്ന് അവൾ അറിഞ്ഞില്ല.[a]
  rationale: The revision preserves the plural force of ταῦτα and uses natural Malayalam person reference for the identity clause. It retains the Greek verb's basic ‘know’ sense in the main text, while offering ‘recognize’ only as an alternative. No explanation for Mary's lack of recognition is introduced.
