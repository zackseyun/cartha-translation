id: JHN.20.14
reference: John 20:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: ml
  text: ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം അവൾ പിന്നോട്ട് തിരിഞ്ഞ്, യേശു അവിടെ നിൽക്കുന്നതു കണ്ടു; അവൻ യേശുവാണെന്ന് അവൾ അറിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ‘അവൾ അവനെ യേശുവായി തിരിച്ചറിഞ്ഞില്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘അവൻ യേശുവാണെന്ന് അവൾ അറിഞ്ഞില്ല.’ ഇവിടെ അവൾ ആ വ്യക്തിയെ യേശുവായി തിരിച്ചറിഞ്ഞില്ല എന്ന അർഥമാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ഇതു
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായിരുന്നാലും, മുമ്പ് പറഞ്ഞ കാര്യങ്ങളെ ഒറ്റ പ്രസ്താവനയായി സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഇതു’ യോജിക്കുന്നു.
- source_word: εἰποῦσα
  choice: പറഞ്ഞശേഷം
  rationale: മറിയത്തെ വിശേഷിപ്പിക്കുന്ന ഭൂതകാലകൃതന്തത്തിന്റെ മുൻകാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: പിന്നിലേക്കു തിരിഞ്ഞു
  rationale: തന്റെ പിന്നിലുള്ള ദിശയിലേക്കു തിരിഞ്ഞെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യാർഥം നിലനിർത്തുന്നു.
- source_word: θεωρεῖ
  choice: കണ്ടു
  rationale: വർത്തമാനകാലരൂപത്തിലുള്ള ആഖ്യാനപ്രയോഗത്തെ മലയാളകഥനത്തിന് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകുന്നു; യഥാർഥ ദർശനം സൂചിപ്പിക്കുന്നു.
- source_word: ἑστῶτα
  choice: അവിടെ നിൽക്കുന്നതു
  rationale: യേശു നിൽക്കുന്ന നിലയെ വ്യക്തമാക്കുന്നു; ‘അവിടെ’ മലയാളത്തിൽ രംഗവിവരണം സ്വാഭാവികമാക്കുന്നു.
- source_word: οὐκ ᾔδει
  choice: അറിഞ്ഞില്ല
  rationale: οἶδα എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘അറിയുക’ എന്ന അർഥത്തോട് അടുത്തുനിൽക്കുകയും ‘തിരിച്ചറിഞ്ഞില്ല’ എന്ന വ്യാഖ്യാനാത്മക അർഥം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: അതു യേശുവാണെന്ന്
  rationale: മുന്നിൽ നിൽക്കുന്ന വ്യക്തിയുടെ തിരിച്ചറിയലാണ് അവൾക്ക് അറിയാതിരുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ മറിയ തിരിച്ചറിയാത്തത്
  choice: അതു യേശുവാണെന്ന് അവൾ അറിഞ്ഞില്ല
  alternative: അവൾ യേശുവിനെ തിരിച്ചറിഞ്ഞില്ല
  rationale: ഗ്രീക്ക് വാചകം അവൾക്ക് ആ വ്യക്തിയുടെ തിരിച്ചറിയൽ അറിയില്ലായിരുന്നുവെന്ന് പറയുന്നു; അതിന്റെ കാരണം വ്യക്തമാക്കുന്നില്ല. മുഖ്യവാചകം ഈ തുറന്ന നില നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അതിയായി അക്ഷരാർഥപരമായ ഘടനകൾ ഒഴിവാക്കിയെങ്കിലും ഗ്രീക്കിലെ തിരിച്ചറിയൽസംബന്ധമായ അനിശ്ചിതത്വം നിലനിർത്തി.
