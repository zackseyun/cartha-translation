id: JHN.20.20
reference: John 20:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ml
  text: ഇതു പറഞ്ഞശേഷം, അവൻ തന്റെ കൈകളും പാർശ്വവും അവർക്കു കാണിച്ചുകൊടുത്തു. കർത്താവിനെ കണ്ടപ്പോൾ ശിഷ്യന്മാർ ആനന്ദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔδειξεν ... αὐτοῖς
  choice: അവർക്കു കാണിച്ചുകൊടുത്തു
  rationale: δείκνυμι എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കാണിക്കുക’ നിലനിർത്തുകയും dative ആയ αὐτοῖς സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰς χεῖρας καὶ τὴν πλευράν
  choice: തന്റെ കൈകളും പാർശ്വവും
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ഇല്ലെങ്കിലും ശരീരഭാഗങ്ങളെക്കുറിച്ചുള്ള മലയാളപ്രയോഗത്തിൽ ‘തന്റെ’ സ്വാഭാവികമാണ്. πλευράയ്ക്ക് ‘പാർശ്വം’ മുറിവിനെ അനാവശ്യമായി വിശദീകരിക്കാതെ ശരീരത്തിന്റെ വശം സൂചിപ്പിക്കുന്നു.
- source_word: ἐχάρησαν
  choice: ആനന്ദിച്ചു
  rationale: χαίρωയുടെ സന്തോഷം/ആഹ്ലാദം എന്ന ശക്തമായ ഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὖν
  choice: വാക്യക്രമത്തിലൂടെ ഫലബന്ധം
  rationale: ഇവിടെ οὖν മുൻപ്രവൃത്തിയുടെ ഫലമായ പ്രതികരണത്തെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ ‘കണ്ടപ്പോൾ’ എന്ന ഘടന ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ വേറൊരു ‘അതിനാൽ’ ചേർത്തിട്ടില്ല.
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: aorist participle ശിഷ്യന്മാർ ആനന്ദിച്ച അവസരവും കാരണസാഹചര്യവും തുറന്നുവെക്കുന്ന സ്വാഭാവിക കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: യോഹന്നാന്റെ ഉയിർത്തെഴുന്നേൽപ്പു വിവരണത്തിൽ κύριος വെറും ആദരസംബോധനമല്ല, ക്രിസ്തുശീർഷകത്തിന്റെ ഭാരവും വഹിക്കുന്നു; ‘കർത്താവ്’ അത് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ തിരിച്ചറിയുന്ന ഈ സന്ദർഭത്തിൽ ക്രിസ്തുശീർഷകമായ അർഥഭാരം നിലനിർത്താൻ ‘കർത്താവ്’ തിരഞ്ഞെടുത്തു; ‘യജമാനൻ’ ബന്ധത്തെ വെറും സാമൂഹിക അർഥത്തിലേക്ക് ചുരുക്കാൻ ഇടയുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രവൃത്തി-പ്രതികരണ ക്രമം നിലനിർത്തി; അനാവശ്യമായ മുറിവ്-വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
