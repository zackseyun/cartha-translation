id: JHN.20.16
reference: John 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: ml
  text: 'യേശു അവളോടു പറയുന്നു: “മറിയം!” അവൾ തിരിഞ്ഞ് അവനോടു എബ്രായ ഭാഷയിൽ[a] പറയുന്നു: “റബ്ബൂനി!” (അതിന്റെ അർഥം “ഗുരുവേ” എന്നാണ്.)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അരമായ ഭാഷയിൽ.” യോഹന്നാൻ ഉപയോഗിക്കുന്ന “എബ്രായ ഭാഷയിൽ” എന്ന പ്രയോഗം യെഹൂദ്യയിലെ സെമിറ്റിക് സംസാരഭാഷയെ വിശാലമായ അർഥത്തിൽ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: എന്നു പറയുന്നു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ സജീവമായ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: Μαριάμ
  choice: മറിയം
  rationale: മലയാളത്തിൽ സുപരിചിതമായ ബൈബിൾ നാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: στραφεῖσα
  choice: തിരിഞ്ഞ്
  rationale: ക്രിയയുടെ തുടർച്ച സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἑβραϊστί
  choice: എബ്രായഭാഷയിൽ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അരമായഭാഷയെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ραββουνι
  choice: റബ്ബൂനി
  rationale: സുവിശേഷം തന്നെ ഉടൻ അർഥം വിശദീകരിക്കുന്നതിനാൽ സെമിറ്റിക് സംബോധനപദം ലിപ്യന്തരണം ചെയ്ത് അതിന്റെ സാംസ്കാരികവും വികാരപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: Διδάσκαλε
  choice: ഗുരുവേ
  rationale: സംബോധനരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ‘Teacher’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ Ἑβραϊστί എന്ന പദത്തിന്റെ ഭാഷാസൂചന
  choice: എബ്രായഭാഷയിൽ
  alternative: അരമായഭാഷയിൽ
  rationale: മൂലഗ്രീക്ക് പദത്തിന്റെ രൂപം മുഖ്യപാഠത്തിൽ മാനിക്കുന്നു. എന്നാൽ യോഹന്നാന്റെ പ്രയോഗത്തിൽ യെഹൂദ്യയിലെ സെമിറ്റിക് സംസാരഭാഷയായ അരമായയെയും ഇത് വിശാലമായി സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യോഹന്നാന്റെ ചരിത്രവർത്തമാനകാലവും ‘റബ്ബൂനി’ എന്ന മൂലസംബോധനവും നിലനിർത്തിയിരിക്കുന്നു; വിശദീകരണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകിയിരിക്കുന്നു.
