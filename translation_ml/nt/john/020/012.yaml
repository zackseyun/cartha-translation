id: JHN.20.12
reference: John 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: ml
  text: വെള്ളവസ്ത്രം ധരിച്ച് ഇരിക്കുന്ന രണ്ടു ദൂതന്മാരെ അവൾ കാണുന്നു[a]—യേശുവിന്റെ ശരീരം കിടന്നിരുന്ന സ്ഥലത്തിന്റെ തലഭാഗത്ത് ഒരാളും കാൽഭാഗത്ത് മറ്റൊരാളും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം ‘വെള്ളയിൽ’; ‘വെള്ളവസ്ത്രം ധരിച്ച’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യേശുവിന്റെ ശരീരം കിടക്കുകയായിരുന്ന സ്ഥലത്തിന്റെ തലഭാഗത്ത് ഒരാളും കാൽഭാഗത്ത് മറ്റൊരാളും.’ ഗ്രീക്കിലെ അപൂർണഭൂതകാലം ലളിതമായി ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: അവൾ കാണുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ആഖ്യാനരൂപത്തിന്റെ സജീവത നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ കർത്താവ് മഗ്ദലക്കാരി മറിയ ആയതിനാൽ മലയാളത്തിൽ സ്ത്രീലിംഗ സർവനാമം വ്യക്തമാക്കുന്നു.
- source_word: ἀγγέλους
  choice: ദൂതന്മാർ
  rationale: ശൂന്യകല്ലറയും വെള്ളവസ്ത്രവും ഉൾപ്പെടുന്ന സന്ദർഭം സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സന്ദേശവാഹകർ’ എന്ന പൊതുവായ അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: ἐν λευκοῖς
  choice: വെള്ളവസ്ത്രം ധരിച്ച്
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വെള്ളയിൽ’ എന്നാണ്; സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിനായി അതിൽ സൂചിതമായ വസ്ത്രം വ്യക്തമാക്കുന്നു.
- source_word: καθεζομένους
  choice: ഇരിക്കുന്ന
  rationale: ദൂതന്മാരുടെ ഇരിപ്പുനില നേരിട്ട്, സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത സ്ഥലസൂചകപദം ചേർക്കുന്നില്ല.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: ഒരാൾ ... തലഭാഗത്തും മറ്റൊരാൾ കാൽഭാഗത്തും
  rationale: πρός + ദത്തിവ് ഇവിടെ സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു. ശരീരം കിടന്ന സ്ഥലത്തിന്റെ രണ്ടറ്റങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὅπου ἔκειτο
  choice: കിടന്നിരുന്നിടത്തിന്റെ
  rationale: ബന്ധവാക്യത്തെ മലയാളത്തിൽ നാമവിശേഷണബന്ധമായി സ്വാഭാവികമായി പുനഃക്രമീകരിക്കുന്നു. അപൂർണഭൂതകാലം മുൻപ് തുടർന്നിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കിടന്നിരുന്നു’ ഉപയോഗിക്കുന്നു.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ ശരീരം
  rationale: സ്വാഭാവിക മലയാള ഉടമസ്ഥഘടന ഉപയോഗിക്കുന്നു; ‘ശരീരം’ ഗൗരവമുള്ളതും മൂലപദത്തിന് യോജിച്ചതുമാണ്.
theological_decisions:
- issue: പുനരുത്ഥാനകല്ലറയുടെ സന്ദർഭത്തിലെ ἀγγέλους എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: സ്വർഗീയ ദൂതന്മാർ എന്ന അർഥത്തിൽ ‘ദൂതന്മാർ’
  alternative: മനുഷ്യരായ സന്ദേശവാഹകർ
  rationale: ἄγγελος എന്നതിന് പൊതുവായി സന്ദേശവാഹകൻ എന്ന അർഥമുണ്ടെങ്കിലും, ശൂന്യകല്ലറയും വെള്ളവസ്ത്രവും ചേർന്ന സന്ദർഭം സ്വർഗീയ ജീവികളെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്.
- issue: ἔκειτο എന്ന അപൂർണഭൂതകാലത്തിന്റെ കാലസൂചന
  choice: മുമ്പ് ശരീരം കിടന്നിരുന്ന അവസ്ഥയായി അവതരിപ്പിക്കുന്നു
  alternative: ‘കിടക്കുകയായിരുന്നു’ എന്ന ലളിതമായ പുരോഗമനഭൂതകാലം
  rationale: അവൾ ദൂതന്മാരെ കാണുന്ന സമയത്തിനു മുമ്പുള്ള ശരീരത്തിന്റെ സ്ഥാനം സന്ദർഭം ആവശ്യപ്പെടുന്നു. ‘കിടന്നിരുന്ന’ എന്ന രൂപം ആ മുൻകാലാവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു; പുനരുത്ഥാനത്തിന്റെ രീതി സംബന്ധിച്ച അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിനായി സ്ഥലം സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം പുനഃക്രമീകരിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
