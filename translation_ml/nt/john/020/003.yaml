  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ ആഖ്യാനപരമായ കാരണം-ഫലബന്ധവും ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടരുന്ന ഭാവവും നിലനിർത്തി.
