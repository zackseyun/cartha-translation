id: JHN.20.3
reference: John 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: ml
  text: അതുകൊണ്ട് പത്രോസും മറ്റേ ശിഷ്യനും പുറപ്പെട്ടു കല്ലറയിലേക്കു പൊയ്ക്കൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കല്ലറയിലേക്കു പോയി.’ ഗ്രീക്കിലെ ഇംപെർഫെക്റ്റ് ക്രിയയെ ഇങ്ങനെ ലളിതമായി പരിഭാഷപ്പെടുത്താം; എന്നാൽ ‘പൊയ്ക്കൊണ്ടിരുന്നു’ എന്നത് തുടരുന്ന പ്രവൃത്തിയെ കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι ഇവിടെ ഒരു സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. ‘പുറപ്പെട്ടു’ എന്നത് ദിശാബോധവും യാത്ര ആരംഭിച്ചതും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ മറിയ പറഞ്ഞ കാര്യത്തിന്റെ ഫലമായാണ് ഈ നടപടി ഉണ്ടായതെന്ന ആഖ്യാനബന്ധം οὖν സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ Πέτρος
  choice: പത്രോസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പ്രചാരമുള്ള രൂപം ഉപയോഗിച്ചു.
- source_word: ὁ ἄλλος μαθητής
  choice: മറ്റേ ശിഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന, പത്രോസിൽനിന്നു വേർതിരിച്ചുകാണിക്കുന്ന ശിഷ്യനെയാണ് ἄλλος സൂചിപ്പിക്കുന്നത്. സുവിശേഷാഖ്യാനത്തിൽ μαθητής എന്നതിന് ‘ശിഷ്യൻ’ സ്വാഭാവികവും സ്ഥിരവുമായ പദമാണ്.
- source_word: ἤρχοντο
  choice: പൊയ്ക്കൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം കഴിഞ്ഞകാലത്ത് തുടരുകയായിരുന്ന സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. ‘പൊയ്ക്കൊണ്ടിരുന്നു’ ആ തുടരുന്ന പ്രവൃത്തി മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὸ μνημεῖον
  choice: കല്ലറയിലേക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ μνημεῖον യേശുവിനെ അടക്കിയ കല്ലറയാണ്. εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കല്ലറയിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘കല്ലറയ്ക്കുള്ളിലേക്ക്’ എന്നു പറഞ്ഞാൽ പിന്നീടു മാത്രമുണ്ടാകുന്ന പ്രവേശനം ഇവിടെ അനാവശ്യമായി സൂചിപ്പിക്കും.
