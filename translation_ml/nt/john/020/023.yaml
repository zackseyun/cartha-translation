    rationale: Greek αὐτοῖς is a dative referring to the people whose sins are in view. In Malayalam, «അവരോടു» normally conveys “to/toward them” in a relational sense and is not natural for the recipient/beneficiary in this passive construction. «അവർക്കു ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു» conveys the intended sense.
