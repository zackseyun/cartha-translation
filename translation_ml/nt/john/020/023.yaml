base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: ml
  text: നിങ്ങൾ ആരുടെയെങ്കിലും പാപങ്ങൾ ക്ഷമിച്ചാൽ[a], അവ അവർക്കു ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു; നിങ്ങൾ ആരുടെയെങ്കിലും പാപങ്ങൾ നിലനിർത്തിയാൽ[b], അവ നിലനിർത്തപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വതന്ത്രമായി: ‘നിങ്ങൾ ആരുടെയെങ്കിലും പാപങ്ങൾ ക്ഷമിച്ചാൽ, അവർക്കു ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു; നിങ്ങൾ അവ നിലനിർത്തിയാൽ, അവ നിലനിർത്തപ്പെട്ടിരിക്കുന്നു.’ രണ്ടു ഫലവാക്യങ്ങളിലും ഗ്രീക്ക് perfect passive ഉപയോഗിക്കുന്നു; പൂർത്തിയായ ഒരു പ്രവൃത്തിയുടെ ഫലം തുടരുന്നതിന് ഇത് ഊന്നൽ നൽകാം.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പിടിച്ചുവെച്ചാൽ.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് പാപങ്ങളെ വിട്ടയക്കാതെ നിലനിർത്തുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: ആരുടെയെങ്കിലും ... എങ്കിൽ
  rationale: ἄν സഹിതമുള്ള ഉപാധിവാക്യത്തിന്റെ അനിശ്ചിതവും സോപാധികവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀφῆτε
  choice: ക്ഷമിച്ചാൽ
  rationale: പാപങ്ങളുടെ സന്ദർഭത്തിൽ ἀφίημι എന്നതിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം ‘ക്ഷമിക്കുക’ ആണ്.
- source_word: τὰς ἁμαρτίας
  choice: പാപങ്ങൾ
  rationale: ഗ്രീക്കിലെ കർമത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ നിർദേശക ഉപപദം വേർതിരിച്ച് പ്രകടിപ്പിക്കേണ്ടതില്ല.
- source_word: ἀφέωνται
  choice: ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: perfect passive സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലാവസ്ഥയും മലയാളത്തിലെ ‘-പ്പെട്ടിരിക്കുന്നു’ രൂപം നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: ക്ഷമ ലഭിക്കുന്ന വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ദത്തിവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κρατῆτε
  choice: നിലനിർത്തിയാൽ
  rationale: ക്ഷമിക്കുന്നതിനോടു വിരുദ്ധമായി പാപങ്ങളെ വിട്ടയക്കാതെ നിലനിർത്തുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: κεκράτηνται
  choice: നിലനിർത്തപ്പെട്ടിരിക്കുന്നു
  rationale: ആദ്യ ഫലവാക്യത്തോടുള്ള സമാന്തരതയും perfect passive-ന്റെ തുടരുന്ന ഫലാവസ്ഥയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യരുടെ നടപടി സ്വതന്ത്രമായി ക്ഷമ പ്രാബല്യത്തിലാക്കുന്നുവോ, അതോ ദൈവിക യാഥാർഥ്യത്തോടു പൊരുത്തപ്പെടുന്നുവോ എന്ന ചോദ്യം
  choice: കർതൃനാമം ചേർക്കാതെ ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ / ‘നിലനിർത്തപ്പെട്ടിരിക്കുന്നു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവം ക്ഷമിച്ചിരിക്കുന്നു’ / ‘ദൈവം നിലനിർത്തിയിരിക്കുന്നു’ എന്നിങ്ങനെ കർത്താവിനെ വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് കർത്താവിനെ തുറന്നു പറയുന്നില്ല. കർമണിപ്രയോഗവും perfect-ന്റെ ഫലാവസ്ഥയും നിലനിർത്തുന്നത് മതവിഭാഗപരമായ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ക്ഷമിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നും ‘നിലനിർത്തപ്പെട്ടിരിക്കുന്നു’ എന്നും ഉപയോഗിച്ച് ഗ്രീക്കിലെ സമാന്തരമായ perfect passive രൂപങ്ങളും അവയുടെ ഫലാവസ്ഥയും പരമാവധി സംരക്ഷിച്ചു.
