source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: ml
  text: അപ്പോൾ ശിമോൻ പത്രോസും അവനെ പിന്തുടർന്ന് വന്നു; അവൻ കല്ലറയ്ക്കുള്ളിൽ കടന്നു; അവിടെ കിടക്കുന്ന ലിനൻ തുണികൾ കാണുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വന്നു’ എന്നും ‘കാണുന്നു’ എന്നും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന രണ്ടു ക്രിയകളും ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലത്തിലാണ്. മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിനായി ആദ്യത്തേത് ഭൂതകാലത്തിലാക്കിയെങ്കിലും, ദൃശ്യത്തിന്റെ സജീവത നിലനിർത്താൻ രണ്ടാമത്തേത് വർത്തമാനകാലത്തിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: എത്തി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള സംഭവപുരോഗതി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ കർശനമായ നിഗമനാർഥം ആവശ്യമായില്ല.
- source_word: καὶ Σίμων Πέτρος
  choice: ശിമോൻ പത്രോസും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിലെ ‘-ഉം’ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: ἀκολουθῶν αὐτῷ
  choice: അവനെ പിന്തുടർന്ന്
  rationale: പ്രധാനപ്രവൃത്തിയോടൊപ്പം നടക്കുന്ന സാഹചര്യത്തെ സ്വാഭാവികവും നേരിട്ടുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: കല്ലറയ്ക്കുള്ളിൽ കടന്ന്
  rationale: μνημεῖον ഇവിടെ അടക്കത്തിനുള്ള കല്ലറയാണ്; εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനം ‘കല്ലറയ്ക്കുള്ളിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: θεωρεῖ
  choice: കാണുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം നിലനിർത്തി ദൃശ്യത്തിന്റെ സജീവത പകരുന്നു; സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായ പദമാണ്.
- source_word: τὰ ὀθόνια
  choice: ശീലത്തുണികൾ
  rationale: അടക്കവുമായി ബന്ധപ്പെട്ട ചെറുതോ പലതോ ആയ ലിനൻ തുണികളെ സൂചിപ്പിക്കുന്ന പദം; ‘ശീലത്തുണികൾ’ വസ്തുവിന്റെ സ്വഭാവം പകരുകയും ‘ശവക്കച്ചകൾ’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: κείμενα
  choice: അവിടെ കിടക്കുന്ന
  rationale: തുണികൾ കിടക്കുന്ന നിലയെ സ്വാഭാവികമായി വിവരിക്കുന്നു; ‘അവിടെ’ ദൃശ്യസന്ദർഭം വ്യക്തമാക്കുന്നു.
