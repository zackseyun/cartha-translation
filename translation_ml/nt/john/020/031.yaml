  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: ml
  text: എന്നാൽ, യേശു മശീഹയും ദൈവപുത്രനും ആണെന്ന് നിങ്ങൾ വിശ്വസിക്കേണ്ടതിനും[a], വിശ്വസിക്കുന്നതിലൂടെ അവന്റെ നാമത്തിൽ നിങ്ങൾക്കു ജീവൻ പ്രാപിക്കേണ്ടതിനും ഇവ എഴുതപ്പെട്ടിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നിങ്ങൾ വിശ്വസിച്ചുതുടങ്ങേണ്ടതിന്’ എന്നു സൂചിപ്പിക്കാവുന്ന aorist രൂപമാണ്; മറ്റു ചിലതിൽ ‘നിങ്ങൾ വിശ്വാസത്തിൽ തുടരേണ്ടതിന്’ എന്നു സൂചിപ്പിക്കാവുന്ന present രൂപവും കാണുന്നു. മുഖ്യവാചകം ‘നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തുന്നു.
    reason: textual_variant
  - marker: b
    text: ‘മശീഹ’ എന്നതിന് അഥവാ, ‘ക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός ഒരു സ്ഥാനപ്പേരാണ്; അതിന്റെ അർത്ഥം നിലനിർത്താൻ ഇവിടെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ഇവ
  rationale: തൊട്ടുമുമ്പ് പരാമർശിച്ച അടയാളങ്ങളെയും എഴുതപ്പെട്ട വിവരണത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും മതിയായ വ്യക്തതയുമുള്ള പ്രയോഗം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യവും പ്രഭാഷണപരമായ തിരിവും പ്രകടമാക്കുന്നു.
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നത്
  rationale: പൂർത്തിയായ എഴുത്തുപ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്ന perfect passive-ന്റെ ബലം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα πιστεύητε
  choice: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; വിശ്വാസം ആരംഭിക്കുന്നതോ തുടരുന്നതോ എന്ന് മുഖ്യവാചകത്തിൽ അമിതമായി നിർണ്ണയിക്കാതെ വിശാലമായി നിലനിർത്തുന്നു.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: യേശു ... മശീഹയാണ് എന്നു
  rationale: വിശ്വാസത്തിന്റെ ഉള്ളടക്കം നേരിട്ട് നൽകുകയും Χριστός എന്ന അഭിഷിക്തസ്ഥാനപ്പേരിനെ ശബ്ദലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥസമ്പന്നമായ 'മശീഹ'യായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിനെ ചുരുക്കുകയോ വിശദീകരണം ചേർക്കുകയോ ചെയ്യാതെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: καὶ ἵνα πιστεύοντες
  choice: വിശ്വസിക്കുന്നതിലൂടെ
  rationale: രണ്ടാമത്തെ ഉദ്ദേശ്യവാക്യത്തിലെ participle-നെ ജീവൻ പ്രാപിക്കുന്നതിനുള്ള മാർഗമോ അനുബന്ധ സാഹചര്യമായോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ
  choice: അവന്റെ നാമത്തിൽ നിങ്ങൾക്കു ജീവൻ ഉണ്ടാകേണ്ടതിന്
  rationale: '''ജീവൻ'' എന്നതിൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ''നിത്യ'' എന്ന വിശേഷണം ചേർക്കുന്നില്ല; ἐν τῷ ὀνόματι എന്ന വാചകത്തിന്റെ യോഹന്നാനീയ ദൈവശാസ്ത്രസാന്ദ്രതയും നിലനിർത്തുന്നു.'
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം യേശുവിന്റെ മശീഹാത്വത്തെ തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; 'മശീഹ' എന്നത് അതിന്റെ യഹൂദ പശ്ചാത്തലവും സ്ഥാനപ്പേരെന്ന സ്വഭാവവും കൂടുതൽ സുതാര്യമായി നിലനിർത്തുന്നു.
- issue: πιστεύητε എന്ന പദത്തിന്റെ പാഠഭേദവും ക്രിയാഭാവവും
  choice: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്
  alternative: നിങ്ങൾ വിശ്വാസത്തിൽ തുടരേണ്ടതിന് / നിങ്ങൾ വിശ്വസിച്ചുതുടങ്ങേണ്ടതിന്
  rationale: SBLGNT-യിൽ present subjunctive ആണെങ്കിലും, പ്രസിദ്ധമായ aorist പാഠഭേദവും നിലവിലുണ്ട്. ആരംഭവിശ്വാസമോ തുടർച്ചയായ വിശ്വാസമോ എന്ന് മുഖ്യവാചകം തീർപ്പാക്കാതെ വിശാലമായി വിവർത്തനം ചെയ്ത് വിശദാംശം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ζωή എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ജീവൻ
  alternative: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ പദത്തിന് സമൃദ്ധമായ ദൈവശാസ്ത്രാർത്ഥമുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ αἰώνιος ഇല്ല; അതിനാൽ മൂലപാഠത്തിലില്ലാത്ത വിശേഷണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ട് ഉദ്ദേശ്യഘടകങ്ങളും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തി; എന്നാൽ അത്യന്തം ഭാരമുള്ള പദാനുപദഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
