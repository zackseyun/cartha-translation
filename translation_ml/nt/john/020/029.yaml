id: JHN.20.29
reference: John 20:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “നീ എന്നെ കണ്ടതുകൊണ്ടാണോ വിശ്വസിച്ചത്?[a] കാണാതെയും വിശ്വസിച്ചവർ ധന്യർ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നീ എന്നെ കണ്ടതുകൊണ്ട് വിശ്വസിച്ചു.” ഗ്രീക്ക് വാക്യം ചോദ്യമായോ പ്രസ്താവനയായോ വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാല ആഖ്യാനരൂപമായ λέγει വന്നിട്ടുണ്ടെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനപ്രവാഹത്തിനായി ഭൂതകാലമായ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു; αὐτῷ എന്നത് ‘അവനോടു’ എന്നു നിലനിർത്തി.
- source_word: Ὅτι ἑώρακάς με πεπίστευκας;
  choice: നീ എന്നെ കണ്ടതുകൊണ്ടാണോ വിശ്വസിച്ചത്?
  rationale: ὅτιയെ കാരണാർഥത്തിൽ എടുത്തു. രണ്ട് ക്രിയകളുടെയും perfect രൂപം കാണലിന്റെ ഫലമായി ഉണ്ടായ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ചോദ്യം എന്ന വായന വ്യക്തമാക്കുന്നതുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: സാധാരണ മാനസിക സന്തോഷത്തേക്കാൾ ദൈവാനുഗ്രഹത്താൽ ലഭിക്കുന്ന ശ്രേയസ്സിനെ സൂചിപ്പിക്കുന്ന beatitude-ശൈലിയിലെ അർഥം നിലനിർത്തുന്നു.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: കാണാതെതന്നെ വിശ്വസിച്ചവർ
  rationale: സുബ്സ്റ്റാന്റീവൽ പങ്കാളിത്തരൂപങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ ‘വിശ്വസിച്ചവർ’ എന്നു നൽകി. ഗ്രീക്കിലെ καίക്ക് വേറൊരു ‘എന്നിട്ടും’ ചേർക്കാതെ, ‘കാണാതെതന്നെ’ എന്ന രൂപത്തിലൂടെ കാണാതിരിപ്പും വിശ്വാസവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം പ്രകടമാക്കി.
theological_decisions:
- issue: യേശുവിന്റെ ആദ്യ വാക്യത്തിന്റെ ചോദ്യം/പ്രസ്താവന സ്വഭാവം
  choice: 'പ്രധാനപാഠത്തിൽ ചോദ്യമായി: ‘നീ എന്നെ കണ്ടതുകൊണ്ടാണോ വിശ്വസിച്ചത്?’'
  alternative: 'പ്രസ്താവനയായി: ‘നീ എന്നെ കണ്ടതുകൊണ്ട് വിശ്വസിച്ചു.’'
  rationale: SBLGNTയിലെ ചിഹ്നനവും സന്ദർഭത്തിലെ വാഗ്‌ശൈലിയും ചോദ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ആധുനിക ചിഹ്നനം ഇല്ലാത്തതിനാൽ പ്രസ്താവനാവായനയും സാധ്യമാണ്; അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനുഗൃഹീതർ’ എന്നത് വാഴ്ത്തുവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; വാക്യത്തിന്റെ യഥാർഥ ചിഹ്നനദ്വയാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
