  to: 'യേശു അവനോടു പറഞ്ഞു: “നീ എന്നെ കണ്ടതുകൊണ്ടാണോ വിശ്വസിച്ചത്?[a] കാണാതെയും വിശ്വസിച്ചവർ ധന്യർ.”'
  rationale: The interrogative main reading and its declarative alternative are preserved. “ധന്യർ” supplies the standard Malayalam beatitude term for μακάριοι, and “കാണാതെയും വിശ്വസിച്ചവർ” retains the Greek’s explicit coordination of not seeing and believing without inserting an adversative connective.
