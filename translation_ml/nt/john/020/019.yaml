  to: 'അങ്ങനെ, ആഴ്ചയുടെ ആദ്യദിവസമായ അന്ന് വൈകുന്നേരമായപ്പോൾ, യെഹൂദന്മാരെ[a] ഭയന്ന് ശിഷ്യന്മാർ ഉണ്ടായിരുന്നിടത്തെ വാതിലുകൾ പൂട്ടിയിരിക്കെ, യേശു വന്ന് അവരുടെ നടുവിൽ നിന്നു; അവരോടു പറഞ്ഞു: “നിങ്ങൾക്കു സമാധാനം.”[b]'
