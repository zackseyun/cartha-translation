id: JHN.20.19
reference: John 20:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: ml
  text: 'അങ്ങനെ, ആഴ്ചയുടെ ആദ്യദിവസമായ അന്ന് വൈകുന്നേരമായപ്പോൾ, യെഹൂദന്മാരെ[a] ഭയന്ന് ശിഷ്യന്മാർ ഉണ്ടായിരുന്നിടത്തെ വാതിലുകൾ പൂട്ടിയിരിക്കെ, യേശു വന്ന് അവരുടെ നടുവിൽ നിന്നു; അവരോടു പറഞ്ഞു: “നിങ്ങൾക്കു സമാധാനം.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭമനുസരിച്ച് “യെഹൂദനേതാക്കൾ” അല്ലെങ്കിൽ “യെഹൂദ്യർ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: '“സമാധാനം നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം: “നിങ്ങൾക്കു സമാധാനം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: അന്നേ ദിവസം വൈകുന്നേരമായപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന സമയപശ്ചാത്തലം സ്വാഭാവിക മലയാളത്തിലെ കാലവാക്യമായി നൽകി; οὖν-ന്റെ മൃദുവായ കഥാതുടർച്ച സന്ദർഭക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: τῇ μιᾷ σαββάτων
  choice: ആ ആഴ്ചയുടെ ആദ്യദിവസമായ
  rationale: ആഴ്ചയിലെ ആദ്യദിവസം എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ വ്യക്തവും പതിവുമായ മലയാളരൂപം.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: വാതിലുകൾ പൂട്ടിയിരിക്കെ
  rationale: പെർഫെക്റ്റ് പാസീവ് പാർട്ടിസിപ്പിൾ മുൻപ് പൂട്ടിയതിന്റെ തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ഭയത്തിന്റെ പശ്ചാത്തലത്തിൽ 'പൂട്ടിയിരിക്കെ' എന്നത് വെറും അടച്ചിരുന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ ഇരുന്ന സ്ഥലത്തിന്റെ
  rationale: ഗ്രീക്ക് പാഠം സ്ഥലം മാത്രമാണ് പറയുന്നത്; 'കൂടിയിരുന്ന' പോലുള്ള അധിക ആശയം ചേർക്കാതെ സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരെ ഭയന്ന്
  rationale: διά കൂടിയ അക്ക്യൂസറ്റീവ് സൂചിപ്പിക്കുന്ന കാരണത്തെ സ്വാഭാവികമായി നൽകുന്നു; Ἰουδαῖοι എന്ന പദത്തിന്റെ വിശാലത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔστη εἰς τὸ μέσον
  choice: അവരുടെ നടുവിൽ നിന്നുകൊണ്ട്
  rationale: യേശു അവരുടെ മധ്യത്തിൽ നിലകൊണ്ടുവെന്ന വ്യക്തമായ സ്ഥലബോധം സംരക്ഷിക്കുന്നു.
- source_word: Εἰρήνη ὑμῖν
  choice: നിങ്ങൾക്കു സമാധാനം
  rationale: ഗ്രീക്കിലെ നാമവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ആശീർവാദ/അഭിവാദന സ്വഭാവവും നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളരൂപം.
theological_decisions:
- issue: യോഹന്നാനിൽ τῶν Ἰουδαίων എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: മുഖ്യപാഠത്തിൽ 'യെഹൂദന്മാർ' എന്ന് നൽകി.
  alternative: '''യെഹൂദനേതാക്കൾ'' അല്ലെങ്കിൽ ''യെഹൂദ്യർ'''
  rationale: ഗ്രീക്ക് പദം ഇവിടെ നേതാക്കളെ മാത്രം എന്ന് വ്യക്തമാക്കുന്നില്ല. സന്ദർഭം യെരൂശലേമിലെ എതിർപ്പുകാരെ, പ്രത്യേകിച്ച് അധികാരികളെ, സൂചിപ്പിച്ചേക്കാമെങ്കിലും പരിഭാഷ പാഠത്തേക്കാൾ കൃത്രിമമായി പരിധി ചുരുക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാശൈലി. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പാദക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ ആദ്യത്തെ [a] അടയാളത്തിന്റെ സ്ഥാനം പാദക്കുറിപ്പിന്റെ വിഷയവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ അത് അനുകരിച്ചിട്ടില്ല; Ἰουδαῖοι സംബന്ധിച്ച യഥാർഥ സന്ദിഗ്ധത theological decision-ൽ രേഖപ്പെടുത്തി, എന്നാൽ പ്രസിദ്ധീകരണവാക്യം അനാവശ്യമായി ഭാരപ്പെടുത്താതിരിക്കാൻ പ്രത്യേക പാദക്കുറിപ്പ് ചേർത്തില്ല.
