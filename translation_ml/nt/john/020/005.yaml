- source_word: τὰ ὀθόνια
  choice: ചണവസ്ത്രങ്ങൾ
  rationale: ശവസംസ്കാരസന്ദർഭത്തിൽ ഉപയോഗിച്ചിരുന്ന ചെറുതോ ഒന്നിലധികമോ ആയ linen cloths എന്ന അർഥം അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ നേരിട്ട് നൽകുന്നു.
- source_word: οὐ μέντοι
  choice: എങ്കിലും
  rationale: കണ്ടതും അകത്തു കടക്കാതിരുന്നതും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰσῆλθεν
  choice: അകത്തു കടന്നില്ല
  rationale: പ്രവേശിക്കുക എന്ന aorist ക്രിയയുടെ അർഥം കല്ലറാസന്ദർഭത്തിൽ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
