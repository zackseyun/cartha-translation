lexical_decisions:
- source_word: παρακύψας
  choice: കുനിഞ്ഞ് അകത്തേക്കു നോക്കിയപ്പോൾ
  rationale: കല്ലറയുടെ പ്രവേശനത്തിൽ ശരീരം കുനിച്ച് അകത്തേക്കു നോക്കുന്ന പ്രവൃത്തി സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: βλέπει
  choice: കാണുന്നു
