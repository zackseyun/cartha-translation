  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: ml
  text: കാരണം, അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കേണ്ടതാണെന്ന തിരുവെഴുത്ത് അവർ അപ്പോഴും മനസ്സിലാക്കിയിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെടേണ്ടതായിരുന്നു.” ഇവിടെ ഗ്രീക്ക് ഭാഷയിൽ “ഉയിർത്തെഴുന്നേൽക്കുക” എന്ന സജീവ ക്രിയാരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: അപ്പോഴും ... ഇല്ലായിരുന്നു
  rationale: ആ സമയംവരെ ഗ്രാഹ്യം ഉണ്ടായിരുന്നില്ലെന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ᾔδεισαν
  choice: മനസ്സിലാക്കിയിരുന്നില്ല
  rationale: തിരുവെഴുത്തിന്റെ അർഥം ഗ്രഹിക്കാതിരുന്നതാണ് സന്ദർഭത്തിലെ ആശയം; വെറും അറിവില്ലായ്മയല്ല.
- source_word: τὴν γραφὴν
  choice: തിരുവെഴുത്ത്
  rationale: ഏകവചനരൂപം നിലനിർത്തുകയും വിശുദ്ധവും അധികാരപരവുമായ എഴുത്തിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ മനസ്സിലാക്കാതിരുന്ന തിരുവെഴുത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: δεῖ
  choice: ഉയിർത്തെഴുന്നേൽക്കേണ്ടതാണെന്ന്
  rationale: ദൈവിക അനിവാര്യതയുടെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: αὐτὸν
  choice: അവൻ
  rationale: ഗ്രീക്ക് infinitive clause-ലെ കർത്താവിനെ മലയാളത്തിലെ സ്വാഭാവിക കർത്തൃരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: νεκρῶν എന്ന ബഹുവചനത്തിന്റെ ‘മരിച്ചവരുടെ ഇടയിൽനിന്ന്’ എന്ന ആശയം സംക്ഷിപ്തവും പതിവുമായ പുനരുത്ഥാനപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ἀναστῆναι
  choice: ഉയിർത്തെഴുന്നേൽക്കുക
  rationale: ഗ്രീക്കിലെ സജീവ infinitive രൂപം നിലനിർത്തുന്നു; കർമ്മണിപ്രയോഗം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനപ്രയോഗവും പ്രവർത്തകത്വവും
  choice: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കേണ്ടതായിരുന്നു
  alternative: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെടേണ്ടതായിരുന്നു
  rationale: ἀναστῆναι ഇവിടെ സജീവരൂപമായതിനാൽ മുഖ്യവാചകം ‘ഉയിർത്തെഴുന്നേൽക്കുക’ എന്ന് നൽകുന്നു. മറ്റു ഇടങ്ങളിലെ കർമ്മണിപ്രയോഗങ്ങളുമായി കൃത്രിമമായി ഏകീകരിക്കാതെ ഈ വാക്യത്തിന്റെ സ്വന്തം പ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തിരുവെഴുത്ത്’ എന്ന ഏകവചനം, ‘മരിച്ചവരിൽനിന്ന്’ എന്ന പുനരുത്ഥാനപ്രയോഗം, സജീവമായ ‘ഉയിർത്തെഴുന്നേൽക്കുക’ എന്നിവ മൂലഭാഷയുടെ രൂപവും ആശയവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
