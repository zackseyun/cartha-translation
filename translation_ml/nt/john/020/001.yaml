source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: ml
  text: ആഴ്ചയുടെ ഒന്നാം ദിവസം[a], അതിരാവിലെ, അപ്പോഴും ഇരുട്ടായിരിക്കെ, മഗ്ദലക്കാരിയായ മറിയം കല്ലറയിലേക്കു വരുന്നു. കല്ല് കല്ലറയിൽനിന്ന് നീക്കപ്പെട്ടിരിക്കുന്നതായി അവൾ കാണുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പദാനുപദമായി, ‘ശബ്ബത്തുകളിൽ ഒന്ന്’; ആഴ്ചയുടെ ഒന്നാം ദിവസം എന്നർഥമുള്ള ഒരു പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: ആഴ്ചയുടെ ഒന്നാം ദിവസം
  rationale: പദാനുപദമായി ‘ശബ്ബത്തുകളിൽ ഒന്ന്’ എന്ന ഘടനയാണെങ്കിലും, കൊയ്നേ ഗ്രീക്കിൽ ഇത് ആഴ്ചയുടെ ഒന്നാം ദിവസത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. δέ-യുടെ മൃദുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെയും സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: മഗ്ദലക്കാരിയായ മറിയം
  rationale: പേരിനെയും മഗ്ദല സ്വദേശിനിയെന്ന വിശേഷണത്തെയും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: πρωῒ σκοτίας ἔτι οὔσης
  choice: അപ്പോഴും ഇരുട്ടായിരിക്കെ അതിരാവിലെ
  rationale: πρωῒ സൂചിപ്പിക്കുന്ന നേരത്തെയുള്ള സമയവും, ഇരുട്ട് ഇനിയും നിലനിന്നിരുന്നുവെന്ന genitive absolute-ന്റെ തുടരുന്ന സാഹചര്യവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു; ‘പുലരിയിൽ’ എന്നു പറഞ്ഞ് വെളിച്ചം വന്നതായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: εἰς τὸ μνημεῖον
  choice: കല്ലറയ്ക്കൽ
  rationale: ഇവിടെ μνημεῖον ശവസംസ്കാരത്തിനുള്ള കല്ലറയാണ്. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് മലയാളത്തിൽ ‘കല്ലറയ്ക്കൽ വരുന്നു’ എന്നു സ്വാഭാവികമായി പറയുന്നു.
- source_word: βλέπει
  choice: കാണുന്നു
  rationale: മൂലത്തിലെ ചരിത്രവർത്തമാനകാലവും നേരിട്ടുള്ള ദൃശ്യഗ്രഹണവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου
  choice: കല്ല് കല്ലറയിൽനിന്ന് നീക്കപ്പെട്ടിരിക്കുന്നതായി
  rationale: perfect passive participle പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു. ‘നീക്കപ്പെട്ടിരിക്കുന്നതായി’ എന്നത് പ്രവൃത്തികർത്താവിനെ ചേർക്കാതെ ആ ഫലാവസ്ഥ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനവിവരണത്തിലെ ആഖ്യാനകാലം
  choice: ‘വരുന്നു’, ‘കാണുന്നു’ എന്ന ചരിത്രവർത്തമാനകാലം നിലനിർത്തുക
  alternative: മലയാളത്തിലെ പതിവ് ഭൂതകാലമായ ‘വന്നു’, ‘കണ്ടു’ എന്നു മാറ്റുക
  rationale: മൂലഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം രംഗത്തിന് നൽകുന്ന സജീവത മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതാണ്; അതിനാൽ കാലരൂപം സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- issue: കല്ല് നീക്കിയ പ്രവൃത്തിയുടെ കർത്താവ്
  choice: ‘നീക്കപ്പെട്ടിരിക്കുന്നതായി’ എന്ന കർമണിപ്രയോഗം ഉപയോഗിച്ച് കർത്താവിനെ വ്യക്തമാക്കാതിരിക്കുക
  alternative: ദൈവമോ മറ്റാരെങ്കിലുമോ കല്ല് നീക്കിയെന്ന് വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം കല്ല് ആരാണ് നീക്കിയതെന്ന് പറയുന്നില്ല. അതിനാൽ പ്രസ്തുത സ്ഥലത്ത് വ്യാഖ്യാനപരമായ കർത്താവിനെ ചേർക്കാതെ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രവർത്തമാനകാലം മൂലത്തിന്റെ ആഖ്യാനസജീവതയ്ക്കായി ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
