reference: John 20:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: ml
  text: 'യേശു അവളോടു പറഞ്ഞു: “എന്നെ മുറുകെ പിടിച്ചുകൊണ്ടിരിക്കരുത്[a]; ഞാൻ ഇതുവരെ പിതാവിന്റെ അടുക്കലേക്ക് ആരോഹണം ചെയ്തിട്ടില്ല. എന്നാൽ നീ എന്റെ സഹോദരന്മാരുടെ[b] അടുക്കൽ ചെന്ന് അവരോടു പറയുക: ‘ഞാൻ എന്റെ പിതാവിന്റെയും നിങ്ങളുടെ പിതാവിന്റെയും അടുക്കലേക്കും, എന്റെ ദൈവത്തിന്റെയും നിങ്ങളുടെ ദൈവത്തിന്റെയും അടുക്കലേക്കും ആരോഹണം ചെയ്യുന്നു.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ തൊടരുത്” അല്ലെങ്കിൽ “എന്നെ പിടിച്ചുനിർത്തരുത്” എന്നും വിവർത്തനം ചെയ്യാം. വെറുമൊരു സ്പർശനത്തേക്കാൾ, യേശുവിനെ മുറുകെ പിടിക്കുകയോ തുടർന്നും പിടിച്ചുകൊണ്ടിരിക്കുകയോ ചെയ്യുന്നതായിരിക്കാം ഗ്രീക്കിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനപദത്തിന്റെ വിവർത്തനമാണ്. ഇവിടെ അത് യേശുവിന്റെ ശിഷ്യരെ സൂചിപ്പിക്കുന്നു; ശിഷ്യരെ പ്രതിനിധീകരിക്കുന്ന കൂടുതൽ വിപുലമായ ഒരു കൂട്ടത്തെയും ഉൾക്കൊള്ളാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: മുറുകെ പിടിച്ചുകൊണ്ടിരിക്കരുത്
  rationale: μή എന്ന നിഷേധത്തോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപം തുടരുന്ന പ്രവൃത്തി നിർത്തുക എന്ന അർഥം സൂചിപ്പിക്കാം. വെറും സ്പർശനത്തേക്കാൾ തുടർന്നുള്ള പിടിച്ചുനിൽക്കലാണ് സന്ദർഭത്തിൽ സാധ്യതയുള്ളത്.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: ഞാൻ ഇതുവരെ ... കയറിപ്പോയിട്ടില്ല
  rationale: യോഹന്നാനിലെ പിതാവിന്റെ അടുക്കലേക്കുള്ള ആരോഹണസൂചനയും ഗ്രീക്കിലെ സമ്പൂർണകാലത്തിന്റെ ‘ഇതുവരെ സംഭവിച്ചിട്ടില്ല’ എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ അടുക്കലേക്ക്
  rationale: ഈ ആദ്യപ്രയോഗത്തിൽ ഗ്രീക്കിൽ ‘എന്റെ’ എന്ന ഉടമസൂചകം ഇല്ല; തുടർന്നുള്ള വാക്കുകളിൽ ബന്ധം വ്യക്തമായി വേർതിരിച്ചുപറയുന്നു.
- source_word: πορεύου
  choice: ചെന്ന്
  rationale: സന്ദർഭത്തിലെ സഞ്ചാരത്തിനുള്ള ആജ്ഞ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀδελφούς
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശിഷ്യരെ സൂചിപ്പിക്കുന്നതിനെക്കുറിച്ച് അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: εἰπὲ αὐτοῖς
  choice: അവരോടു പറയുക
  rationale: റിപ്പോർട്ട് ചെയ്യാനുള്ള ആജ്ഞയെ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἀναβαίνω
  choice: കയറിപ്പോകുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവമായ മുന്നോട്ടുള്ള ഭാവം നിലനിർത്തുകയും പിതാവിന്റെ അടുക്കലേക്കുള്ള ആരോഹണത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: എന്റെ പിതാവിന്റെയും നിങ്ങളുടെ പിതാവിന്റെയും അടുക്കലേക്ക്
  rationale: യേശുവിന്റെ ബന്ധവും ശിഷ്യരുടെ ബന്ധവും സമാന്തരമായി, എന്നാൽ ഒന്നാക്കി കലർത്താതെ, നിലനിർത്തുന്നു.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: എന്റെ ദൈവത്തിന്റെയും നിങ്ങളുടെ ദൈവത്തിന്റെയും അടുക്കലേക്ക്
  rationale: ഗ്രീക്കിലെ സമാന്തരഘടനയും ‘എന്റെ ദൈവം’ എന്ന വാക്യത്തിന്റെ പൂർണ ദൈവശാസ്ത്രഭാരവും മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Μή μου ἅπτου എന്നതിന്റെ അർഥം
  choice: തുടർന്നുള്ള മുറുകെപ്പിടിക്കൽ അവസാനിപ്പിക്കാനുള്ള വിലക്ക്
  alternative: എന്നെ തൊടരുത്
  rationale: രൂപവും സന്ദർഭവും വെറും സ്പർശനത്തിനുള്ള സമ്പൂർണ വിലക്കിനെക്കാൾ തുടരുന്ന പിടിത്തത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്; എങ്കിലും പദത്തിന്റെ വ്യത്യസ്ത വിവർത്തനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ആദ്യത്തെ πατέρα എന്ന പ്രയോഗം
  choice: പിതാവ്
  alternative: എന്റെ പിതാവ്
  rationale: ആദ്യ ഉപവാക്യത്തിൽ μου ഇല്ലാത്തതിനാൽ മൂലപാഠത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: ‘എന്റെ ദൈവവും നിങ്ങളുടെ ദൈവവും’ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം
  choice: വാക്യം നേരിട്ട് വിവർത്തനം ചെയ്യുക
  alternative: ‘എന്റെ ദൈവം’ എന്നതിന്റെ ശക്തി കുറയ്ക്കുന്ന വ്യാഖ്യാനപരമായ പുനരാഖ്യാനം
  rationale: വാക്യത്തിലെ യഥാർഥ ദൈവശാസ്ത്രപിരിമുറുക്കം മുൻകൂട്ടി പരിഹരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടുക്കലേക്ക്’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ബന്ധപരമായ ദിശയും പിതാവ്/ദൈവം എന്ന സമാന്തരഘടനയും വ്യക്തമാക്കുന്നു; വാക്യത്തിന്റെ ദൈവശാസ്ത്രപിരിമുറുക്കം വ്യാഖ്യാനത്തിലൂടെ ലഘൂകരിച്ചിട്ടില്ല.
