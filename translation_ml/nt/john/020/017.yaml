  to: 'യേശു അവളോടു പറഞ്ഞു: “എന്നെ മുറുകെ പിടിച്ചുകൊണ്ടിരിക്കരുത്[a]; ഞാൻ ഇതുവരെ പിതാവിന്റെ അടുക്കലേക്ക് ആരോഹണം ചെയ്തിട്ടില്ല. എന്നാൽ നീ എന്റെ സഹോദരന്മാരുടെ[b] അടുക്കൽ ചെന്ന് അവരോടു പറയുക: ‘ഞാൻ എന്റെ പിതാവിന്റെയും നിങ്ങളുടെ പിതാവിന്റെയും അടുക്കലേക്കും, എന്റെ ദൈവത്തിന്റെയും നിങ്ങളുടെ ദൈവത്തിന്റെയും അടുക്കലേക്കും ആരോഹണം ചെയ്യുന്നു.’”'
