  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഓടിക്കൊണ്ടിരുന്നു’ എന്ന രൂപം അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം സൂക്ഷിക്കുന്നു; ‘എന്നാൽ’ ഒഴിവാക്കി δέ-യുടെ മൃദുവായ ബന്ധകസ്വഭാവം നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
