lexical_decisions:
- source_word: ἔτρεχον
  choice: ഓടിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ പുരോഗമനഭാവം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: ;
  rationale: δέ ഇവിടെ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ’ എന്നു ചേർത്ത് മൂലത്തിൽ ഇല്ലാത്ത ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കാതെ അർധവിരാമത്തിലൂടെ വാക്യഗതി സ്വാഭാവികമാക്കി.
- source_word: οἱ δύο ὁμοῦ
  choice: അവർ ഇരുവരും ഒരുമിച്ച്
  rationale: രണ്ടുപേരെയും അവരുടെ സംയുക്തപ്രവൃത്തിയെയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ἄλλος μαθητής
  choice: മറ്റേ ശിഷ്യൻ
  rationale: പത്രോസിൽനിന്ന് വേർതിരിച്ചുകാട്ടുന്ന ἄλλος എന്ന പദവും സുവിശേഷസന്ദർഭത്തിലെ μαθητής എന്ന പദത്തിന്റെ പതിവാർഥവും നിലനിർത്തുന്നു.
- source_word: προέδραμεν
  choice: മുന്നോട്ടോടി
  rationale: ‘മുന്നിൽ/മുൻപായി ഓടുക’ എന്ന സംയുക്തക്രിയയുടെ ദൃശ്യഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τάχιον τοῦ Πέτρου
  choice: പത്രോസിനെക്കാൾ വേഗത്തിൽ
  rationale: ഗ്രീക്കിലെ താരതമ്യം വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἦλθεν πρῶτος
  choice: ആദ്യം ... എത്തി
  rationale: ആദ്യനായെത്തിയെന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸ μνημεῖον
  choice: കല്ലറയ്ക്കരികിലെത്തി
  rationale: അടുത്ത വാക്യം ശിഷ്യൻ അകത്തു കടന്നിരുന്നില്ലെന്ന് വ്യക്തമാക്കുന്നതിനാൽ εἰς ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘കല്ലറയ്ക്കരികിൽ’ എന്നത് അകത്തേക്കു പ്രവേശിച്ചെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
