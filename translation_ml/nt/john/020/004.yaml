  source_fidelity: The imperfect ἔτρεχον is well rendered by “ഓടിക്കൊണ്ടിരുന്നു”; οἱ δύο ὁμοῦ, the comparative τάχιον τοῦ Πέτρου, and the priority expressed by ἦλθεν πρῶτος are all retained. However, “കല്ലറയ്ക്കരികിലെത്തി” means ‘arrived near/by the tomb’ and adds a proximity nuance not expressed by εἰς τὸ μνημεῖον. “കല്ലറയിലെത്തി” naturally expresses arrival at the tomb without implying that he entered it.
  naturalness: The sentence is fluent modern standard Malayalam and maintains an appropriate narrative register. “കല്ലറയിലെത്തി” is both more idiomatic and more direct than “കല്ലറയ്ക്കരികിലെത്തി” in this context.
  terminology: “ശിഷ്യൻ,” “പത്രോസ്,” and “കല്ലറ” are suitable and consistent terms. The footnote accurately presents “മറികടന്ന് ഓടി” as an alternative expression and does not introduce interpretive identification of the other disciple.
