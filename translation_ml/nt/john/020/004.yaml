  language: ml
  text: അവർ ഇരുവരും ഒരുമിച്ച് ഓടിക്കൊണ്ടിരുന്നു; മറ്റേ ശിഷ്യൻ പത്രോസിനെക്കാൾ വേഗത്തിൽ മുന്നോട്ടോടി ആദ്യം കല്ലറയിലെത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പത്രോസിനെ മറികടന്ന് ഓടി.” ഗ്രീക്കിലെ ക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ “മുന്നോട്ടോടി” എന്നാണ്; “പത്രോസിനെക്കാൾ വേഗത്തിൽ” എന്ന താരതമ്യവും വാക്യത്തിൽ പ്രത്യേകം നൽകിയിരിക്കുന്നു.'
