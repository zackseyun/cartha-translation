reference: John 20:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ml
  text: 'എട്ട് ദിവസം കഴിഞ്ഞ്, അവന്റെ ശിഷ്യന്മാർ വീണ്ടും അകത്തുണ്ടായിരുന്നു; തോമാസും അവരോടൊപ്പം ഉണ്ടായിരുന്നു. വാതിലുകൾ അടച്ചിരിക്കെ, യേശു വന്ന് അവരുടെ നടുവിൽ നിന്നു പറഞ്ഞു: “നിങ്ങൾക്കു സമാധാനം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: എട്ടു ദിവസം കഴിഞ്ഞപ്പോൾ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സമയാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ കലണ്ടർ കണക്കുകൂട്ടൽ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἔσω
  choice: അകത്ത്
  rationale: സ്ഥലസൂചന ലളിതമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: ἔρχεται
  choice: വന്ന്
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാള കഥനത്തിൽ സ്വാഭാവികമായി ഒഴുകുന്ന ക്രിയാരൂപത്തിൽ നൽകുന്നു; സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: വാതിലുകൾ അടച്ചിരിക്കെ
  rationale: വാതിലുകൾ അടഞ്ഞ നിലയിലായിരുന്നുവെന്ന ഗ്രീക്ക് genitive absolute-ന്റെ സാഹചര്യാർഥം വ്യക്തമാക്കുന്നു; അവ പൂട്ടിയിരുന്നുവെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: εἰς τὸ μέσον
  choice: അവരുടെ നടുവിൽ
  rationale: ശിഷ്യസംഘത്തിന്റെ മധ്യത്തിൽ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Εἰρήνη ὑμῖν
  choice: നിങ്ങൾക്കു സമാധാനം
  rationale: ആശംസയുടെ സെമിറ്റിക് ഭാവവും ‘സമാധാനം’ എന്ന പ്രധാന ദൈവശാസ്ത്രപദവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അടഞ്ഞ വാതിലുകളിലൂടെ യേശു എങ്ങനെ പ്രവേശിച്ചു എന്നത്
  choice: “വാതിലുകൾ അടച്ചിരിക്കെ” എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: “അടഞ്ഞ വാതിലുകളിലൂടെ” അല്ലെങ്കിൽ അത്ഭുതകരമായി പ്രവേശിച്ചു എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാചകം വാതിലുകളുടെ അവസ്ഥ പറയുന്നു; പ്രവേശനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ വാചകത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ἔρχεται എന്ന ചരിത്രവർത്തമാനകാലം
  choice: മലയാള കഥനത്തിന് സ്വാഭാവികമായ “വന്ന്”
  alternative: “വരുന്നു”
  rationale: മൂലത്തിലെ സജീവ കഥനഭാവം അംഗീകരിച്ചുകൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ കാലമാറ്റം ഒഴിവാക്കുന്നു; പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തോമാസ്’ എന്നതിനു പകരം മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ‘തോമാസ്’/‘തോമാ’ രൂപങ്ങളിൽ, മൂലനാമത്തോട് അടുത്തും ഔപചാരികവുമായ ‘തോമാസ്’ തെരഞ്ഞെടുത്തു; എന്നാൽ പ്രസിദ്ധീകരണശൈലി ഏകീകരണത്തിനായി പേരുകളുടെ പൊതുനയം അനുസരിച്ച് ക്രമീകരിക്കാം.
