source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: ml
  text: അവന്റെ തലയിൽ ഉണ്ടായിരുന്ന മുഖവസ്ത്രം ലിനൻ തുണികളോടൊപ്പം കിടക്കാതെ, വേറെയായി ഒരിടത്ത് ചുറ്റിവെച്ച നിലയിൽ[a] കിടക്കുന്നതും കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചുറ്റിവെച്ച’ എന്നതിന് ‘മടക്കിവെച്ച’ അല്ലെങ്കിൽ ‘ചുരുട്ടിവെച്ച’ എന്നും വിവർത്തനം ചെയ്യാം (ἐντετυλιγμένον).
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: മുഖവസ്ത്രം
  rationale: ശവസംസ്കാരസന്ദർഭത്തിലും തുടർന്നുള്ള ‘അവന്റെ തലയിൽ ഉണ്ടായിരുന്ന’ എന്ന വിശദീകരണത്തോടും യോജിക്കുന്ന, മുഖം/തല മൂടിയിരുന്ന വസ്ത്രത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: അവന്റെ തലയിൽ
  rationale: വസ്ത്രം കൃത്യമായി എങ്ങനെ വെച്ചിരുന്നു എന്ന് അധികമായി നിർണയിക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὀθονίων
  choice: ചണവസ്ത്രങ്ങൾ
  rationale: ശവകുടീരത്തിലെ ചണത്തുണികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തെ സുതാര്യമായി പകരുന്നു; ‘ശവവസ്ത്രങ്ങൾ’ എന്ന വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കുന്നു.
- source_word: κείμενον
  choice: കിടക്കുന്നതും
  rationale: κεῖμαι സൂചിപ്പിക്കുന്ന വസ്തുവിന്റെ കിടക്കുന്ന അവസ്ഥ സ്വാഭാവികമായി നൽകുന്നു; മലയാളവാക്യത്തിന്റെ ഒഴുക്കിനായി വാക്യാവസാനത്തിലെ ‘കണ്ടു’ മുൻവാക്യത്തിൽനിന്ന് അധ്യാഹരിക്കുന്നു.
- source_word: χωρὶς
  choice: വേറെയായി
  rationale: ചണവസ്ത്രങ്ങളിൽനിന്നുള്ള സ്ഥലപരമായ വേർതിരിവ് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐντετυλιγμένον
  choice: ചുറ്റിവെച്ച നിലയിൽ
  rationale: പൂർണ്ണനിഷ്പന്ന കർമണി കൃദന്തം സൂചിപ്പിക്കുന്ന, ചുറ്റപ്പെട്ട/മടക്കപ്പെട്ട നിലയെ നൽകുന്നു; ‘ഭംഗിയായി മടക്കിവെച്ച’ എന്ന ക്രമസൂചന ഗ്രീക്കിൽനിന്ന് അധികമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: εἰς ἕνα τόπον
  choice: ഒരിടത്ത്
  rationale: ഒരു പ്രത്യേക വേറിട്ട സ്ഥലമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തിലെ കണ്ട കാര്യങ്ങളുടെ തുടർച്ചയാണെന്ന ബന്ധം മലയാളത്തിലെ സമുച്ചയപ്രത്യയംകൊണ്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശവവസ്ത്രങ്ങളുടെ ക്രമീകരണം വിവരണത്തിന് അതീതമായ ദൈവശാസ്ത്രപരമായ അവകാശവാദം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: മുഖവസ്ത്രത്തിന്റെ വേറിട്ട സ്ഥാനവും അവസ്ഥയും മാത്രം നിരീക്ഷണാത്മകമായി വിവർത്തനം ചെയ്തു.
  alternative: മുഖവസ്ത്രം ഭംഗിയായി മടക്കിയിരുന്നത് ഉദ്ദേശപൂർവതയുടെയോ പുനരുത്ഥാനത്തിന്റെ ക്രമബദ്ധതയുടെയോ അടയാളമാണെന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വസ്ത്രത്തിന്റെ സ്ഥാനവും അവസ്ഥയും വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രതീകാർഥമോ സംഭവത്തിന്റെ പ്രത്യേക പുനർനിർമാണമോ പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ ‘കണ്ടു’ എന്ന ക്രിയയെ ആശ്രയിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ സമുച്ചയരൂപം ഉപയോഗിച്ചു. ‘ചുറ്റിവെച്ച നിലയിൽ’ എന്നത് മൂലപദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
