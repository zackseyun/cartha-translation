id: JHN.20.15
reference: John 20:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: ml
  text: 'യേശു അവളോടു ചോദിച്ചു: “സ്ത്രീയേ, നീ കരയുന്നത് എന്തിന്? നീ ആരെയാണ് അന്വേഷിക്കുന്നത്?” അവൻ തോട്ടക്കാരനാണെന്നു കരുതി അവൾ അവനോടു പറഞ്ഞു: “അയ്യാ[a], അങ്ങ് അവനെ എടുത്തുകൊണ്ടുപോയതാണെങ്കിൽ, അവനെ എവിടെ വെച്ചുവെന്ന് എന്നോടു പറയണമേ; ഞാൻ അവനെ എടുത്തുകൊണ്ടുപോകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: κύριε; “കർത്താവേ” എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ മറിയ സംസാരിക്കുന്നത് തോട്ടക്കാരനോടാണെന്നു കരുതുന്നതിനാൽ, ഇവിടെ ഇതിന് ആദരപൂർവമായ “അയ്യാ” എന്ന അർഥമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: സ്ത്രീയേ
  rationale: ആദരവോടെയുള്ള നേരിട്ടുള്ള അഭിസംബോധനയാണ്; ഗ്രീക്കിലെ ലാളിത്യവും യോഹന്നാനിലെ ആവർത്തനബന്ധവും നിലനിർത്തുന്നു, അധിക സ്നേഹസൂചന ചേർക്കുന്നില്ല.
- source_word: τί κλαίεις
  choice: നീ കരയുന്നത് എന്തിന്?
  rationale: κλαίω ദുഃഖത്തോടെ കരയുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ കാരണചോദ്യം ഉപയോഗിച്ചു.
- source_word: τίνα ζητεῖς
  choice: നീ ആരെയാണ് അന്വേഷിക്കുന്നത്?
  rationale: ζητέω എന്നതിന്റെ ‘അന്വേഷിക്കുക/തിരയുക’ എന്ന അർഥവും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന τίνα എന്ന കർമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δοκοῦσα
  choice: കരുതി
  rationale: മറിയയുടെ തെറ്റായ നിഗമനം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു; ഉറപ്പിന്റെ അളവ് അതിരുകടന്ന് വർധിപ്പിക്കുന്നില്ല.
- source_word: ὁ κηπουρός
  choice: തോട്ടക്കാരൻ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളരൂപം.
- source_word: Κύριε
  choice: യജമാനനേ
  rationale: മറിയ യേശുവിനെ തോട്ടക്കാരനെന്നു കരുതുന്നതിനാൽ ഇവിടെ ഇത് ക്രിസ്തുശാസ്ത്രപരമായ ‘കർത്താവേ’ എന്ന ഏറ്റുപറച്ചിലിനേക്കാൾ ആദരപൂർവമായ അഭിസംബോധനയായി വരുന്നു.
- source_word: ἐβάστασας αὐτόν
  choice: അവനെ എടുത്തുകൊണ്ടുപോയതെങ്കിൽ
  rationale: ശരീരം എടുത്ത് മറ്റൊരിടത്തേക്കു മാറ്റിയെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; βαστάζωയുടെ ശാരീരികമായി ചുമക്കുക/എടുക്കുക എന്ന ഭാവം നിലനിൽക്കുന്നു.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: അവനെ എവിടെ വെച്ചുവെന്ന്
  rationale: τίθημι എന്നതിന്റെ പൊതുവായ ‘വെക്കുക’ എന്ന അർഥം വ്യാഖ്യാനാത്മക വിപുലീകരണമില്ലാതെ നൽകുന്നു.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: ഞാൻ അവനെ എടുത്തുകൊണ്ടുപോകാം
  rationale: αἴρωയുടെ എടുക്കുക/നീക്കുക എന്ന സന്ദർഭാർഥവും ഭാവികാല ഉദ്ദേശ്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മറിയ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ തിരിച്ചറിയുന്നതിനുമുമ്പ് ഉപയോഗിക്കുന്ന κύριε എന്ന അഭിസംബോധന
  choice: യജമാനനേ
  alternative: കർത്താവേ
  rationale: മറിയ സംസാരിക്കുന്നത് തോട്ടക്കാരനോടാണെന്നു കരുതുന്നതിനാൽ ആദരപൂർവമായ സാധാരണ അഭിസംബോധനയാണ് സന്ദർഭത്തിൽ കൂടുതൽ സാധ്യതയുള്ളത്. എന്നാൽ ഗ്രീക്ക് പദം ‘കർത്താവ്’ എന്ന അർഥത്തിലും ഉപയോഗിക്കപ്പെടുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ചരിത്രവർത്തമാനകാലമായ λέγει മലയാളകഥനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമായി നൽകി. ‘സ്ത്രീയേ’ എന്നത് കടുപ്പമോ അപമാനമോ സൂചിപ്പിക്കാത്ത ഗ്രീക്ക് അഭിസംബോധനയുടെ നേരിട്ടുള്ള രൂപമായി നിലനിർത്തി; മറിയയുടെ മറുപടിയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
