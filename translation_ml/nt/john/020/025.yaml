id: JHN.20.25
reference: John 20:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് മറ്റു ശിഷ്യന്മാർ അവനോട് പറഞ്ഞുകൊണ്ടിരുന്നു: “ഞങ്ങൾ കർത്താവിനെ കണ്ടിരിക്കുന്നു.” എന്നാൽ അവൻ അവരോട് പറഞ്ഞു: “അവന്റെ കൈകളിൽ ആണികളുടെ പാട് കാണുകയും ആണികളുടെ പാടിൽ എന്റെ വിരൽ ഇടുകയും അവന്റെ പാർശ്വത്തിലേക്ക് എന്റെ കൈ കടത്തുകയും ചെയ്താലല്ലാതെ ഞാൻ ഒരിക്കലും വിശ്വസിക്കുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ തീർച്ചയായും വിശ്വസിക്കുകയില്ല.” ഗ്രീക്കിൽ ശക്തമായ ഊന്നൽനിഷേധമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തെ തുടർച്ചയായതോ ആവർത്തിച്ചതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപരമായ നിഗമനസൂചകം നിലനിർത്തുന്നു.
- source_word: οἱ ἄλλοι μαθηταί
  choice: മറ്റു ശിഷ്യന്മാർ
  rationale: തോമസിൽനിന്ന് വേർതിരിച്ചുള്ള ശേഷിച്ച ശിഷ്യന്മാരെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: Ἑωράκαμεν
  choice: ഞങ്ങൾ ... കണ്ടിരിക്കുന്നു
  rationale: പൂർണകാലത്തിന്റെ, കഴിഞ്ഞ സംഭവത്തിനുള്ള ഇപ്പോഴത്തെ പ്രസക്തി, മലയാളത്തിലെ ഈ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: κύριον
  choice: കർത്താവിനെ
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് നിലനിർത്തുന്നു.
- source_word: Ἐὰν μὴ ἴδω
  choice: കാണുകയും ... ചെയ്താലല്ലാതെ
  rationale: നിഷേധാത്മക ഉപാധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: അവന്റെ കൈകളിൽ
  rationale: ശരീരഭാഗത്തിലുള്ള മുറിവടയാളത്തെ സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ അടുത്തതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: τύπον
  choice: പാട്
  rationale: ആണികൾ അവശേഷിപ്പിച്ച ദൃശ്യമായ അടയാളം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἥλων
  choice: ആണികളുടെ
  rationale: പാടിനും അതുണ്ടാക്കിയ ആണികൾക്കും ഇടയിലെ ഷഷ്ഠീവ്യാകരണബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βάλω
  choice: ഇടുകയും
  rationale: വിരലോ കൈയോ ഒരു സ്ഥലത്തേക്ക് നീക്കി വെക്കുന്നതിനെ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: τὸν δάκτυλόν μου εἰς
  choice: എന്റെ വിരൽ ... പാടിൽ
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനം ‘പാടിൽ ... ഇടുക’ എന്ന പ്രയോഗം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: μου τὴν χεῖρα
  choice: എന്റെ കൈ
  rationale: ഗ്രീക്കിൽ വ്യക്തമാക്കിയിരിക്കുന്ന ഉടമസ്ഥസർവനാമം നിലനിർത്തുന്നു.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: അവന്റെ വശത്ത്
  rationale: πλευρά ശരീരത്തിന്റെ വശം എന്നർഥത്തിൽ വിവർത്തനം ചെയ്ത് മുറിവിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: οὐ μὴ πιστεύσω എന്നതിലെ തോമസിന്റെ നിഷേധത്തിന്റെ ശക്തി
  choice: “ഞാൻ ഒരിക്കലും വിശ്വസിക്കുകയില്ല” എന്ന ശക്തമായ നിഷേധം; ഉപാധിയോടുള്ള ബന്ധം വാക്യഘടനയിൽ നിലനിർത്തി
  alternative: “ഞാൻ തീർച്ചയായും വിശ്വസിക്കുകയില്ല”
  rationale: οὐ μή ശക്തമായ ഊന്നൽനിഷേധമാണ്. ‘ഒരിക്കലും’ അതിന്റെ വാചകശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; എന്നാൽ ‘ചെയ്താലല്ലാതെ’ എന്ന ഉപാധി നിലനിൽക്കുന്നതിനാൽ ഇത് കാലാതീതമായ അന്തിമ അവിശ്വാസമായി വ്യാഖ്യാനിക്കപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ആവർത്തനവും ഉപാധിയുടെ ശക്തിയും മൂലപാഠത്തിനനുസരിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
