  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: ml
  text: അങ്ങനെ ശിഷ്യന്മാർ വീണ്ടും തങ്ങൾ താമസിച്ചിരുന്ന സ്ഥലത്തേക്കു മടങ്ങിപ്പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “തങ്ങളുടെയടുത്തേക്ക്” അല്ലെങ്കിൽ “സ്വന്തം ഇടത്തേക്ക്.” ഈ ഗ്രീക്ക് പ്രയോഗം അവർ താമസിച്ചിരുന്ന സ്ഥലത്തേക്കു മടങ്ങിയെന്ന അർത്ഥത്തിലായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: മടങ്ങിപ്പോയി
  rationale: ἀπέρχομαι സംഭവസ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു. πάλιν, πρὸς αὑτούς എന്നിവയോടൊപ്പം ഇവിടെ മടങ്ങിപ്പോകുക എന്ന ആശയം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻവിവരണത്തിന്റെ ഫലമായുള്ള കഥാതുടർച്ചയാണ് οὖν അടയാളപ്പെടുത്തുന്നത്; ആ ബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മടങ്ങിവരവിനെയോ ആവർത്തനത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: πρὸς αὑτούς
  choice: തങ്ങൾ താമസിച്ചിരുന്ന സ്ഥലത്തേക്ക്
  rationale: അക്ഷരാർഥത്തിൽ ‘തങ്ങളിലേക്കുതന്നെ’ എന്നാകാവുന്ന ഗ്രീക്ക് പ്രയോഗം, ഈ സന്ദർഭത്തിൽ അവർ തങ്ങിയിരുന്ന സ്വന്തം ഇടത്തേക്കുള്ള മടങ്ങിപ്പോക്കിനെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം. ‘വീടുകളിലേക്ക്’ എന്നു വ്യക്തമാക്കുന്നതിനെക്കാൾ ഇത് മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വം നന്നായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οἱ μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിന്റെ μαθηταί എന്ന പതിവ് ആഖ്യാനനാമത്തിന് നിലവാരമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് പ്രയോഗത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തിയിരിക്കുന്നു.
