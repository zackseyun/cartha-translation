id: JHN.20.27
reference: John 20:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: ml
  text: 'പിന്നെ അവൻ തോമാസിനോടു പറഞ്ഞു: “നിന്റെ വിരൽ ഇവിടെ കൊണ്ടുവന്ന് എന്റെ കൈകൾ കാണുക; നിന്റെ കൈ കൊണ്ടുവന്ന് എന്റെ പാർശ്വത്തിൽ ഇടുക. അവിശ്വസിക്കുന്നവനാകാതെ വിശ്വസിക്കുന്നവനാകുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വിശ്വാസമില്ലാത്തവനാകാതെ വിശ്വസ്തനാകുക.” ഗ്രീക്ക് വിശേഷണങ്ങൾക്ക് ഈ അർഥവും വരാം; എന്നാൽ ഇവിടെ ഉയിർത്തെഴുന്നേറ്റ യേശുവിലുള്ള തോമാസിന്റെ വിശ്വാസമാണ് മുഖ്യവിഷയം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: പിന്നെ
  rationale: ആഖ്യാനത്തിലെ സമയക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Φέρε … φέρε
  choice: കൊണ്ടുവന്ന് … കൊണ്ടുവന്ന്
  rationale: രണ്ട് ആജ്ഞകളിലുമുള്ള φέρε എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തുകയും വിരലും കൈയും യേശുവിന്റെ അടുക്കലേക്ക് നീക്കുന്നതെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: δάκτυλόν σου ὧδε
  choice: നിന്റെ വിരൽ ഇവിടെ
  rationale: ὧδε എന്ന സ്ഥലസൂചകത്തിന്റെ ‘ഇവിടെ’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: ἴδε τὰς χεῖράς μου
  choice: എന്റെ കൈകൾ കാണുക
  rationale: ἴδε എന്ന ആജ്ഞയെയും χεῖράς എന്ന ബഹുവചനത്തെയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: എന്റെ പാർശ്വത്തിൽ ഇടുക
  rationale: βάλε എന്ന ശക്തമായ ആജ്ഞയ്ക്ക് ‘ഇടുക’ എന്നും πλευράയ്ക്ക് ശരീരത്തിന്റെ വശം സൂചിപ്പിക്കുന്ന മാന്യവും വ്യക്തവുമായ ‘പാർശ്വം’ എന്നും നൽകുന്നു.
- source_word: μὴ γίνου
  choice: ആകാതെ … ആകുക
  rationale: γίνομαι എന്ന ക്രിയയിലെ നിലയിലേക്കു വരുക/ആയിത്തീരുക എന്ന ചലനാത്മക ഭാവം വെറും ‘ആയിരിക്കരുത്’ എന്നതിലുപരി നിലനിർത്തുന്നു.
- source_word: ἄπιστος … πιστός
  choice: അവിശ്വസിക്കുന്നവൻ … വിശ്വസിക്കുന്നവൻ
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെക്കുറിച്ചുള്ള തോമാസിന്റെ അവിശ്വാസമാണ് തൊട്ടുമുമ്പിലെ സന്ദർഭം; അതിനാൽ വിശ്വസിക്കൽ എന്ന അർഥമേഖലയാണ് മുഖ്യപാഠത്തിൽ മുൻനിർത്തുന്നത്.
theological_decisions:
- issue: ἄπιστος / πιστός എന്ന വിരുദ്ധപദജോടിയുടെ അർഥം
  choice: അവിശ്വസിക്കുന്നവൻ / വിശ്വസിക്കുന്നവൻ
  alternative: വിശ്വാസമില്ലാത്തവൻ / വിശ്വസ്തൻ
  rationale: താൻ കാണുകയും തൊടുകയും ചെയ്താലല്ലാതെ വിശ്വസിക്കില്ലെന്ന തോമാസിന്റെ പ്രതികരണമാണ് ഉടൻമുമ്പുള്ള പശ്ചാത്തലം. അതിനാൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിലുള്ള വിശ്വാസം മുഖ്യമായി പ്രതിഫലിപ്പിക്കുന്നു; അതേസമയം ‘വിശ്വാസമില്ലാത്ത/വിശ്വസ്തമല്ലാത്ത’ എന്നും ‘വിശ്വസ്തൻ’ എന്നും അർഥമാകാവുന്ന പദങ്ങളുടെ യഥാർഥ വ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘പാർശ്വം’ ശരീരത്തിന്റെ വശം എന്ന അർഥം വ്യക്തമായി നൽകുന്നതിനൊപ്പം വാക്യത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു. ഉദ്ധരണിക്കുള്ളിലെ സമാന്തര ആജ്ഞകളും ആവർത്തനവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
