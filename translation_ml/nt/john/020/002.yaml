id: JHN.20.2
reference: John 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: ml
  text: 'അതിനാൽ അവൾ ഓടി ശിമോൻ പത്രോസിന്റെയും യേശു സ്നേഹിച്ചിരുന്ന മറ്റേ ശിഷ്യന്റെയും[a] അടുക്കൽ ചെന്ന് അവരോട് പറയുന്നു: “അവർ കർത്താവിനെ കല്ലറയിൽനിന്ന് എടുത്തുകൊണ്ടുപോയിരിക്കുന്നു; അവനെ എവിടെ വെച്ചെന്ന് ഞങ്ങൾക്കറിയില്ല[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ: “യേശു സ്നേഹിച്ചിരുന്ന മറ്റേ ശിഷ്യൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന φιλέω എന്ന ക്രിയയ്ക്ക് വ്യക്തിപരമായ സ്നേഹമോ വാത്സല്യമോ ഊന്നിപ്പറയാം; “യേശുവിന് വാത്സല്യമുണ്ടായിരുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: മറിയ “ഞങ്ങൾക്കറിയില്ല” എന്നു പറയുന്നു; ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ബഹുവചനം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു. അവളോടൊപ്പം മറ്റു സ്ത്രീകളെയും ഇതിൽ ഉൾപ്പെടുത്തിയിരിക്കാം എന്നു ചിലർ മനസ്സിലാക്കുന്നു; എന്നാൽ ഇവിടെ ഈ ബഹുവചനം ആരെ സൂചിപ്പിക്കുന്നു എന്ന് വാചകം വിശദീകരിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: അതിനാൽ അവൾ ഓടി … അടുക്കൽ ചെന്ന്
  rationale: οὖν മുൻവാക്യത്തിലെ കണ്ടെത്തലിന്റെ ഫലസൂചന നൽകുന്നതിനാൽ ‘അതിനാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി. ഓടുന്നതും അടുത്തെത്തുന്നതും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ ചേർത്തു.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: ശിമോൻ പത്രോസിന്റെ … അടുക്കൽ
  rationale: πρός വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനമാണ് സൂചിപ്പിക്കുന്നത്; ‘അടുക്കൽ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν ἄλλον μαθητήν
  choice: മറ്റേ ശിഷ്യൻ
  rationale: μαθητής-ന് സുവിശേഷസന്ദർഭത്തിൽ സ്ഥിരവും പരിചിതവുമായ പദം ‘ശിഷ്യൻ’ ആണ്; ἄλλον-ന്റെ വ്യതിരിക്തത ‘മറ്റേ’ നിലനിർത്തുന്നു.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: യേശു സ്നേഹിച്ചിരുന്ന
  rationale: φιλέω ഇവിടെ വ്യക്തിപരമായ സ്നേഹമോ വാത്സല്യമോ സൂചിപ്പിക്കുന്നു. അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ‘സ്നേഹിച്ചിരുന്ന’ നിലനിർത്തുന്നു.
- source_word: λέγει αὐτοῖς
  choice: അവരോട് പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി രംഗത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: അവർ കർത്താവിനെ കല്ലറയിൽനിന്ന് എടുത്തുകൊണ്ടുപോയിരിക്കുന്നു
  rationale: Ἦραν-ലെ വ്യക്തമല്ലാത്ത ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു. പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം മലയാളത്തിലെ ‘എടുത്തുകൊണ്ടുപോയിരിക്കുന്നു’ വ്യക്തമാക്കുന്നു; μνημεῖον ഇവിടെ ശവസംസ്കാരത്തിനുള്ള കല്ലറയാണ്.
- source_word: οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്കറിയില്ല
  rationale: ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ബഹുവചനം ഏകവചനമാക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: അവനെ എവിടെ വെച്ചെന്ന്
  rationale: τίθημι ഇവിടെ ഒരാളെ ഒരു സ്ഥലത്ത് വെക്കുക എന്ന അർഥത്തിലാണ്; ‘വെച്ചെന്ന്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള κύριος എന്ന സംബോധന
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ യേശുവിനുള്ള ആദരപൂർവവും ക്രിസ്തുശാസ്ത്രപരവുമായ പതിവു ബിരുദം നിലനിർത്താൻ ‘കർത്താവ്’ ഉപയോഗിച്ചു.
- issue: മറിയയുടെ οἴδαμεν എന്ന ഒന്നാംപുരുഷ ബഹുവചനം
  choice: ഞങ്ങൾക്കറിയില്ല
  alternative: എനിക്കറിയില്ല
  rationale: മറിയയോടൊപ്പം മറ്റാരുണ്ടായിരുന്നു എന്ന് വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ബഹുവചനം നിലനിർത്തി വാചകത്തിലെ തുറന്ന നിലയും സുവിശേഷവിവരണങ്ങൾ തമ്മിലുള്ള സാധ്യതയുള്ള പിരിമുറുക്കവും പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ആദരപൂർവവുമായ വിവരണശൈലി സ്വീകരിച്ചു. മുഖ്യവിവരണത്തിലെ ചരിത്രവർത്തമാനമായ λέγει ‘പറയുന്നു’ എന്നു നിലനിർത്തി; ഓട്ടവും എത്തിച്ചേരലും മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘ഓടി … ചെന്ന്’ എന്ന ക്രിയാശൃംഖലയാക്കി. മതവിഭാഗവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
