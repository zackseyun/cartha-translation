id: JHN.20.21
reference: John 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു വീണ്ടും അവരോടു പറഞ്ഞു: “നിങ്ങൾക്കു സമാധാനം.[a] പിതാവ് എന്നെ അയച്ചിരിക്കുന്നതുപോലെ ഞാനും നിങ്ങളെ അയയ്ക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “നിങ്ങൾക്കു സമാധാനം ഉണ്ടായിരിക്കട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവിവരണത്തോടുള്ള ആഖ്യാനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഇവിടെ കർശനമായ നിഗമനാർഥം നിർബന്ധമല്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ അഭിവാദ്യം ആവർത്തിക്കുന്നതായി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: Εἰρήνη ὑμῖν
  choice: നിങ്ങൾക്കു സമാധാനം
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് അഭിവാദ്യത്തിന്റെ സംക്ഷിപ്തതയും സെമിറ്റിക് ശൈലിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: καθὼς
  choice: …പോലെ
  rationale: പിതാവ് യേശുവിനെ അയച്ചതും യേശു ശിഷ്യന്മാരെ അയയ്ക്കുന്നതും തമ്മിലുള്ള താരതമ്യം അധികവ്യാഖ്യാനം കൂടാതെ പ്രകടമാക്കുന്നു.
- source_word: ἀπέσταλκέν
  choice: അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായെങ്കിലും ഇപ്പോഴും പ്രസക്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect-ന്റെ ഭാവം മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: മൂലപാഠത്തിലെ നിർദ്ദിഷ്ടമായ ‘പിതാവ്’ എന്ന യോഹന്നാനീയ പ്രയോഗം നിലനിർത്തുന്നു; ‘എന്റെ’ എന്നില്ലാത്ത പദം ചേർക്കുന്നില്ല.
- source_word: κἀγώ
  choice: ഞാനും
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിലെ കൂട്ടിച്ചേർക്കലും ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πέμπω
  choice: അയയ്ക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള നിയോഗപ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: പിതാവ് യേശുവിനെ അയച്ചതും യേശു ശിഷ്യന്മാരെ അയയ്ക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: “പിതാവ് എന്നെ അയച്ചിരിക്കുന്നതുപോലെ ഞാനും നിങ്ങളെ അയയ്ക്കുന്നു” എന്ന താരതമ്യം മാത്രം നിലനിർത്തി.
  alternative: “പിതാവ് എന്നെ അയച്ച അതേ അധികാരത്തിലും രീതിയിലും ഞാനും നിങ്ങളെ അയയ്ക്കുന്നു” എന്ന വിപുലീകരണം.
  rationale: ഗ്രീക്ക് പാഠം ദൗത്യങ്ങൾ തമ്മിൽ ഗൗരവമുള്ള സാദൃശ്യം സ്ഥാപിക്കുന്നു; എന്നാൽ അധികാരം, രീതി, പദവി എന്നിവയിൽ പൂർണസമത്വമുണ്ടെന്ന് വിവർത്തനം തന്നെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്ത അഭിവാദ്യവും അയയ്ക്കലുകളുടെ താരതമ്യവും നിലനിർത്തിയിരിക്കുന്നു.
