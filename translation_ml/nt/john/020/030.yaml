source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: ml
  text: യേശു ശിഷ്യന്മാരുടെ സാന്നിധ്യത്തിൽ മറ്റു പല അടയാളങ്ങളും[a] ചെയ്തു; അവ ഈ പുസ്തകത്തിൽ എഴുതപ്പെട്ടിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത്ഭുതങ്ങൾ’; ഗ്രീക്കിൽ ‘അടയാളങ്ങൾ’—യേശു ആരാണെന്ന് വെളിപ്പെടുത്തുന്ന പ്രവൃത്തികൾ എന്ന ഊന്നലോടെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: മറ്റു പല
  rationale: മുൻവിവരണത്തിൽനിന്ന് നിഗമനത്തിലേക്കു നീങ്ങുന്ന οὖν എന്ന ബന്ധകത്തിന്റെയും 31-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്ന μέν…δέ വ്യത്യാസഘടനയുടെയും ആശയം സന്ദർഭം വഹിക്കുന്നു. ഓരോ കണികയും കൃത്രിമമായി വേർതിരിച്ചു പരിഭാഷപ്പെടുത്താതെ, സ്വാഭാവികമായ മലയാളത്തിൽ സംഖ്യാബാഹുല്യവും ‘മറ്റു’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: യോഹന്നാനിൽ ഈ പദം വെറും അത്ഭുതപ്രകടനങ്ങളെയല്ല, യേശുവിന്റെ വ്യക്തിത്വത്തെയും ദൗത്യത്തെയും വെളിപ്പെടുത്തുന്ന പ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘അത്ഭുതങ്ങൾ’ എന്നതിനെക്കാൾ ‘അടയാളങ്ങൾ’ മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം സംരക്ഷിക്കുന്നു.
- source_word: ἐποίησεν
  choice: ചെയ്തു
  rationale: ποιέω എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം; ‘പ്രവർത്തിച്ചു’ അല്ലെങ്കിൽ ‘നിർവഹിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ സാന്നിധ്യത്തിൽ
  rationale: പ്രവൃത്തികൾ ശിഷ്യന്മാർ സാക്ഷികളായിരിക്കെ നടന്നുവെന്ന അർഥം വ്യക്തമായി നൽകുന്നു. ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘തന്റെ ശിഷ്യന്മാർ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: അവ … എഴുതപ്പെട്ടിട്ടില്ല
  rationale: പരിപ്രാസ്തിക പൂർണകാല കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന, പുസ്തകത്തിൽ എഴുതിയ നിലയിൽ ഇല്ലെന്ന ആശയം കർമണിരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: ഈ പുസ്തകത്തിൽ
  rationale: βιβλίον എന്ന പദത്തിന് ഈ സാഹിത്യസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് ഏറ്റവും സ്വാഭാവികവും കൃത്യവുമായ തുല്യപദം ‘പുസ്തകം’ ആണ്.
theological_decisions:
- issue: യോഹന്നാനിലെ σημεῖα എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗം
  choice: ‘അടയാളങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അത്ഭുതങ്ങൾ’
  rationale: ഈ പ്രവൃത്തികൾ ശക്തിയുടെ പ്രകടനങ്ങൾ മാത്രമല്ല, യേശു ആരാണെന്ന് സൂചിപ്പിക്കുകയും വെളിപ്പെടുത്തുകയും ചെയ്യുന്നവയാണെന്ന യോഹന്നാന്റെ ഊന്നൽ ഇതിലൂടെ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശിഷ്യന്മാരുടെ സാന്നിധ്യത്തിൽ’ എന്ന പ്രയോഗം സാക്ഷിത്വത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു; അർധവിരാമം രണ്ട് അടുത്ത് ബന്ധപ്പെട്ട പ്രസ്താവനകളെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
