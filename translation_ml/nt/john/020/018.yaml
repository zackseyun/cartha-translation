  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: ml
  text: മഗ്ദലക്കാരിയായ മറിയം ശിഷ്യന്മാരുടെ അടുക്കൽ വന്ന്, “ഞാൻ കർത്താവിനെ കണ്ടു” എന്നും അവൻ തന്നോട് ഈ കാര്യങ്ങൾ പറഞ്ഞുവെന്നും അറിയിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘മഗ്ദലക്കാരിയായ മറിയം ശിഷ്യന്മാരുടെ അടുക്കൽ വന്ന്, “ഞാൻ കർത്താവിനെ കണ്ടു” എന്നു അറിയിച്ചു; അവൻ അവളോട് ഈ കാര്യങ്ങൾ പറഞ്ഞു.’ അവസാന ഉപവാക്യം മറിയം അറിയിച്ച സന്ദേശത്തിന്റെ ഭാഗമായോ ആഖ്യാതാവിന്റെ പരാമർശമായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: വന്ന്
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനമായി അവതരിപ്പിക്കുന്നു; ശിഷ്യന്മാരുടെ അടുക്കലേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: മഗ്ദലക്കാരി മറിയം
  rationale: മഗ്ദല സ്വദേശിനിയെന്ന വിശേഷണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀγγέλλουσα
  choice: അറിയിച്ചു
  rationale: സന്ദേശം അറിയിക്കുക എന്ന കൃത്യമായ അർഥം നൽകുന്നു; മുഖ്യക്രിയയോടൊപ്പം ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാരുടെ അടുക്കൽ
  rationale: μαθηταί എന്നതിന് പതിവായ ‘ശിഷ്യന്മാർ’ ഉപയോഗിക്കുകയും വരവിന്റെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അവന്റെ’ ചേർക്കുന്നില്ല.
- source_word: Ἑώρακα
  choice: ഞാൻ കർത്താവിനെ കണ്ടു
  rationale: മലയാളത്തിൽ പൂർത്തിയായ ദർശനവും ഇപ്പോഴത്തെ പ്രസക്തിയും സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ ഭൂതകാലരൂപം ഉപയോഗിക്കുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന ബഹുമാനപദവിയുടെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: അവൻ തന്നോട് ഈ കാര്യങ്ങൾ പറഞ്ഞുവെന്നും
  rationale: മറിയം അറിയിച്ച സന്ദേശത്തിന്റെ തുടർച്ചയായി വായിക്കുന്നു; ταῦτα എന്ന ബഹുവചനസൂചന ‘ഈ കാര്യങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനസന്ദർഭത്തിലെ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ / ഗുരു
  rationale: ഇവിടെ യേശുവിനെ സൂചിപ്പിക്കുന്ന അംഗീകൃത പദവിയായതിനാൽ ‘കർത്താവ്’ അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം കുറയ്ക്കാതെ നൽകുന്നു.
- issue: καὶ ταῦτα εἶπεν αὐτῇ എന്ന അവസാന ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: 'മറിയം അറിയിച്ച സന്ദേശത്തിന്റെ ഭാഗമായി: ‘അവൻ തന്നോട് ഈ കാര്യങ്ങൾ പറഞ്ഞുവെന്നും’'
  alternative: 'ആഖ്യാതാവിന്റെ പ്രത്യേക പരാമർശമായി: ‘അവൻ അവളോട് ഈ കാര്യങ്ങൾ പറഞ്ഞു’'
  rationale: രണ്ടാമത്തെ ὅτι ഇല്ലെങ്കിലും ഈ ഉപവാക്യം ἀγγέλλουσα എന്നതിന്റെ ഉള്ളടക്കം തുടരുന്നതായി സ്വാഭാവികമായി വായിക്കാം; എന്നാൽ ഗ്രീക്ക് വാക്യഘടന മറ്റൊരു വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ അടിക്കുറിപ്പിൽ അത് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ അവസാന ഉപവാക്യത്തിന്റെ യഥാർഥ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
