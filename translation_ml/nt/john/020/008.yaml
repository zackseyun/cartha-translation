reference: John 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: ml
  text: അപ്പോൾ, കല്ലറയിലേക്കു ആദ്യം എത്തിയ മറ്റേ ശിഷ്യനും അകത്തു കടന്നു[a]. അവൻ കണ്ടു, വിശ്വസിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അകത്തേക്കു പോയി.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘വിശ്വസിച്ചു’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അവൻ എന്താണ് വിശ്വസിച്ചതെന്ന് വ്യക്തമാക്കുന്നില്ല. യേശു ഉയിർത്തെഴുന്നേറ്റെന്നോ, താൻ കണ്ട തെളിവിനെയോ, മുമ്പ് ലഭിച്ച വിവരത്തെയോ അവൻ വിശ്വസിച്ചു എന്നിങ്ങനെ വ്യത്യസ്ത വ്യാഖ്യാനങ്ങളുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: അപ്പോൾ
  rationale: കഥയുടെ തുടർച്ചയും നേരിയ നിഗമനസൂചനയും സ്വാഭാവികമായി നൽകുന്നു; ഇവിടെ ‘അതുകൊണ്ട്’ എന്നു പറഞ്ഞാൽ ഗ്രീക്കിലുള്ളതിലധികം ശക്തമായ കാരണബന്ധം തോന്നാം.
- source_word: εἰσῆλθεν
  choice: അകത്തു കടന്നു
  rationale: കല്ലറയ്ക്കുള്ളിലേക്കുള്ള വ്യക്തമായ ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ ἄλλος μαθητής
  choice: മറ്റേ ശിഷ്യൻ
  rationale: യോഹന്നാന്റെ വിവരണത്തിലെ സ്ഥിരമായ അഭിസംബോധന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: കല്ലറയുടെ അടുത്ത് ആദ്യം എത്തിയ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെയും ആ ശിഷ്യൻ പത്രോസിനുമുമ്പ് കല്ലറയ്ക്കരികിൽ എത്തിയെന്ന ആശയത്തെയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μνημεῖον
  choice: കല്ലറ
  rationale: സന്ദർഭത്തിലെ യേശുവിന്റെ സംസ്കാരസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണവുമായ മലയാളപദമാണ്.
- source_word: καὶ εἶδεν
  choice: അവൻ കണ്ടു
  rationale: ബന്ധവാക്യത്തിനു ശേഷം കർത്താവിനെ വ്യക്തമാക്കിക്കൊണ്ട് εἶδεν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: എന്താണ് വിശ്വസിച്ചതെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ കർമം ചേർക്കാതെ ക്രിയയെ അതേ സംക്ഷിപ്തതയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശിഷ്യൻ എന്താണ് വിശ്വസിച്ചത്
  choice: കർമം വ്യക്തമാക്കാതെ ‘വിശ്വസിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: യേശു ഉയിർത്തെഴുന്നേറ്റെന്ന് വിശ്വസിച്ചു; മറിയത്തിന്റെ വിവരം വിശ്വസിച്ചു; വിശ്വാസത്തിലേക്കു വന്നു.
  rationale: ഗ്രീക്കിൽ വിശ്വാസത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കിയിട്ടില്ല. അടുത്ത വാക്യത്തിന്റെ വെളിച്ചത്തിലും വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്; അതിനാൽ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ ലളിതമായ ക്രിയാക്രമവും വിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തെക്കുറിച്ചുള്ള അർഥതുറപ്പും സംരക്ഷിച്ചിട്ടുണ്ട്.
