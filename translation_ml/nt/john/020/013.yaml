id: JHN.20.13
reference: John 20:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: ml
  text: 'അവർ അവളോടു ചോദിച്ചു: “സ്ത്രീയേ, നീ കരയുന്നത് എന്തിന്?” അവൾ അവരോടു പറഞ്ഞു: “എന്റെ കർത്താവിനെ[a] അവർ എടുത്തുകൊണ്ടുപോയി; അവനെ എവിടെ വെച്ചുവെന്ന് എനിക്കറിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ കർത്താവ്” എന്നതിന് “എന്റെ യജമാനൻ” എന്നും അർഥമാകാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ κύριος ആദരസൂചകമായ അഭിസംബോധനയായും ‘കർത്താവ്’ എന്ന പദവിയായും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: സ്ത്രീയേ
  rationale: ഗ്രീക്കിൽ ഇത് അനാദരവല്ലാത്ത നേരിട്ടുള്ള സംബോധനയാണ്. ‘സ്ത്രീയേ’ മൂലപദത്തിന്റെ ലാളിത്യവും യോഹന്നാനിലെ പ്രയോഗസാമ്യവും നിലനിർത്തുന്നു.
- source_word: τί κλαίεις
  choice: നീ കരയുന്നത് എന്തിന്?
  rationale: τί അക്ഷരാർഥത്തിൽ ‘എന്ത്’ എന്നാണെങ്കിലും ഈ പ്രയോഗത്തിൽ കാരണമാണ് ചോദിക്കുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ ‘എന്തിന്?’ ആ ഭാവം കൃത്യമായി നൽകുന്നു; വർത്തമാനപ്രയോഗം തുടരുന്ന കരച്ചിലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: Ἦραν
  choice: എടുത്തുകൊണ്ടുപോയി
  rationale: കല്ലറയിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν κύριόν μου
  choice: എന്റെ കർത്താവിനെ
  rationale: κύριος എന്ന പദത്തിന്റെ ആദരസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ സാധ്യതകൾ തുറന്നുവെക്കുന്നു; അതിനെ വെറും സാമൂഹികപദവിയായ ‘യജമാനൻ’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: οὐκ οἶδα
  choice: എനിക്കറിയില്ല
  rationale: οἶδα എന്ന രൂപം ഇവിടെ വർത്തമാന അറിവിന്റെ അവസ്ഥയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യം ‘എനിക്കറിയില്ല’ എന്നാണ്.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: അവനെ എവിടെ വെച്ചുവെന്ന്
  rationale: τίθημι എന്നതിന്റെ പൊതുവായ ‘വെക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘കിടത്തി’ എന്നു വിവർത്തനം ചെയ്ത് കല്ലറാസന്ദർഭം അനാവശ്യമായി കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐκεῖνοι / αὐτοῖς
  choice: അവർ / അവരോടു
  rationale: മുൻസന്ദർഭത്തിലെ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സർവനാമപ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: മറിയയുടെ വാക്കിലെ κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: എന്റെ കർത്താവ്
  alternative: എന്റെ യജമാനൻ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ പദത്തിന് ആദരസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ അനുരണനങ്ങൾ ഉണ്ടാകാം. ‘കർത്താവ്’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: Γύναι എന്ന സംബോധനയുടെ ഭാവം
  choice: സ്ത്രീയേ
  alternative: പ്രിയ സ്ത്രീയേ / അമ്മേ
  rationale: മൂലത്തിലെ സംബോധനം ആദരവുള്ളതാണെങ്കിലും ‘പ്രിയ’ എന്ന സ്നേഹഭാവമോ ‘അമ്മേ’ എന്ന ബന്ധസൂചനയോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സംഭാഷണം ലളിതമായി നിലനിർത്തിയപ്പോൾ ‘കർത്താവ്’ എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി സംരക്ഷിച്ചു. പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് ചേർത്തിരിക്കുന്നു.
