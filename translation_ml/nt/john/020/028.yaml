  source_fidelity: 'The rendering accurately reflects ἀπεκρίθη ... καὶ εἶπεν αὐτῷ: Thomas replies and speaks to him, without adding the name Jesus. “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!” properly conveys the two article-bearing nominatives as direct address in this context and retains both possessives and the coordinated confession.'
  naturalness: The Malayalam is clear, idiomatic, and suitably reverent in modern standard usage. “മറുപടിയായി പറഞ്ഞു” naturally avoids a wooden duplication while retaining the narrative sense of the Greek construction. The vocative forms “കർത്താവേ” and “ദൈവമേ” make the direct address explicit and read naturally.
  terminology: “കർത്താവ്” and “ദൈവം” are established, dignified Malayalam equivalents for κύριος and θεός. The name “തോമസ്” is standard. The footnote is correctly anchored and fairly presents the less-supported exclamatory construal while explaining why αὐτῷ favors address to Jesus.
