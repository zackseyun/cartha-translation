id: JHN.20.28
reference: John 20:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: ml
  text: 'തോമസ് അവനോടു മറുപടിയായി പറഞ്ഞു[a]: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സാധ്യത കുറവാണെങ്കിലും, “തോമസ് മറുപടിയായി, ‘എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!’ എന്നു പറഞ്ഞു” എന്നൊരു ആശ്ചര്യോദ്ഗാരമായി ഇതിനെ വായിക്കാം. എന്നാൽ, അവൻ ‘അവനോടു’ പറഞ്ഞുവെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കുന്നതിനാൽ, ഈ വാക്കുകൾ യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയാണെന്ന വായനയ്ക്കാണ് കൂടുതൽ പിന്തുണ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടിയായി
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ ‘മറുപടി പറയുക’ എന്ന സാധാരണ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Θωμᾶς
  choice: തോമസ്
  rationale: വ്യക്തിനാമം ആധുനിക മലയാളത്തിലെ പ്രചാരമുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ദാതിവ് സർവനാമമായ αὐτῷ വ്യക്തമാക്കുന്ന ‘അവനോട്’ എന്ന അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘യേശുവിനോട്’ എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: Ὁ κύριός μου
  choice: എന്റെ കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ ആദരവും ദൈവശാസ്ത്രപരമായ ഭാരവും ‘കർത്താവ്’ നിലനിർത്തുന്നു; നേരിട്ടുള്ള സംബോധനമായതിനാൽ ‘കർത്താവേ’ എന്നു രൂപപ്പെടുത്തുന്നു.
- source_word: καὶ
  choice: എന്റെ കർത്താവേ, എന്റെ ദൈവമേ
  rationale: ഗ്രീക്കിലെ καὶ രണ്ടു വിശേഷണങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികവും ശക്തവുമായ ദ്വിസംബോധനത്തിൽ കോമയിലൂടെ അതേ ഏകീകൃത പ്രഖ്യാപനം വ്യക്തമാകുന്നു; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: ὁ θεός μου
  choice: എന്റെ ദൈവമേ
  rationale: θεός എന്നത് ‘ദൈവം’ എന്നും μου എന്നത് ‘എന്റെ’ എന്നും നേരിട്ട് നൽകുന്നു; സംബോധനരൂപം വ്യക്തിപരമായ ഏറ്റുപറച്ചിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: തോമസിന്റെ വാക്കുകൾ യേശുവിനോടുള്ള നേരിട്ടുള്ള ഏറ്റുപറച്ചിലാണോ, അതോ യേശുവിനെ അഭിസംബോധന ചെയ്യാത്ത ഒരു ആശ്ചര്യോദ്ഗാരമാണോ
  choice: 'യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധന: “എന്റെ കർത്താവേ, എന്റെ ദൈവമേ!”'
  alternative: ദൈവത്തോടുള്ള ആശ്ചര്യോദ്ഗാരമായി മാത്രം വായിക്കുക
  rationale: αὐτῷ (‘അവനോട്’) എന്ന് ഗ്രീക്ക് വ്യക്തമായി പറയുന്നു. ആർട്ടിക്കിളോടുകൂടിയ നാമനിർദേശരൂപങ്ങൾ ഇവിടെ കൊയ്നേ ഗ്രീക്കിൽ സംബോധനയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ വാക്യത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി മയപ്പെടുത്താതെ, തോമസ് യേശുവിനെ നേരിട്ട് ‘കർത്താവ്’, ‘ദൈവം’ എന്നു വിളിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മറുപടിയായി പറഞ്ഞു’ എന്നത് ἀπεκρίθη καὶ εἶπεν എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ വാക്കുപ്രതി ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു. ‘കർത്താവേ’, ‘ദൈവമേ’ എന്നീ സംബോധനരൂപങ്ങൾ നേരിട്ടുള്ള വ്യക്തിപരമായ ഏറ്റുപറച്ചിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
