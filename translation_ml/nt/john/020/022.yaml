  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: ml
  text: 'ഇതു പറഞ്ഞശേഷം, അവൻ അവരുടെമേൽ ഊതി[a] അവരോടു പറഞ്ഞു: “പരിശുദ്ധാത്മാവിനെ സ്വീകരിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിലേക്ക് ശ്വാസം ഊതി.” ഈ ക്രിയ ഉല്പത്തി 2:7-ലെയും യെഹെസ്കേൽ 37-ലെയും സൃഷ്ടിയുടെയും പുതുസൃഷ്ടിയുടെയും പ്രതിച്ഛായകളെ ഓർമ്മിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന കാലക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐνεφύσησεν
  choice: അവരുടെമേൽ ഊതി
  rationale: ക്രിയയുടെ ‘മേൽ ശ്വാസം ഊതുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ഉല്പത്തി 2:7, യെഹെസ്കേൽ 37 എന്നിവയെ ഓർമിപ്പിക്കുന്ന സൃഷ്ടി/പുതുസൃഷ്ടി പ്രതിധ്വനി മുഖ്യവാക്യത്തിൽ അതിയായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: λέγει αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള കഥനശൈലിക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Λάβετε
  choice: സ്വീകരിക്കുവിൻ
  rationale: ഇവിടെ ആത്മാവിനെ പ്രാപിക്കുന്നതിനെ സൂചിപ്പിക്കാൻ ‘എടുക്കുവിൻ’ എന്നതിനെക്കാൾ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ ആജ്ഞാരൂപം.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഇത് അനിശ്ചിതമായ ഒരു വിശുദ്ധ ആത്മാവിനെയല്ല, ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ കർമവിഭക്തി ചേർത്ത രൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: πνεῦμα ἅγιον വ്യക്തിത്വമില്ലാത്ത ‘വിശുദ്ധ ആത്മാവ്’ എന്നാണോ ദൈവിക പരിശുദ്ധാത്മാവ് എന്നാണോ പരിഭാഷപ്പെടുത്തേണ്ടത്
  choice: പരിശുദ്ധാത്മാവിനെ
  alternative: ഒരു വിശുദ്ധ ആത്മാവിനെ / വിശുദ്ധാത്മാവിനെ
  rationale: യോഹന്നാന്റെ സുവിശേഷസന്ദർഭത്തിലും വിശാലമായ പുതിയനിയമ പ്രയോഗത്തിലും ഈ പദസംയോജനം ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ നിർദേശകപദമില്ലെന്ന കാരണത്താൽ മാത്രം അനിശ്ചിതാർഥം വരുത്തുന്നില്ല.
- issue: 'ἐνεφύσησεν എന്ന ക്രിയയുടെ ദിശ: അവരുടെമേലോ അവരിലേക്കോ'
  choice: അവരുടെമേൽ ഊതി
  alternative: അവരിലേക്ക് ശ്വാസം ഊതി
  rationale: ഗ്രീക്ക് ക്രിയ ദിശയെ പൂർണമായി നിർണ്ണയിക്കുന്നില്ല. മുഖ്യവാക്യം സാധാരണ സന്ദർഭാർഥം നൽകുന്നു; ‘അവരിലേക്കോ അവരിൽ ശ്വാസം പകർന്നോ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ കഥനശൈലി. ബഹുവചന ആജ്ഞയ്ക്ക് ‘സ്വീകരിക്കുവിൻ’ ഉപയോഗിച്ചു; അമിതമായി പുരാതനമായ പദക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘ഊതി’ എന്ന ആശയത്തിനു പിന്നാലെ വരേണ്ടതിനാൽ മുഖ്യവാക്യത്തിൽ ഉദ്ധരണിക്ക് മുമ്പായി സ്ഥാപിക്കുന്നത് കൂടുതൽ കൃത്യമാകുമെങ്കിലും, നൽകിയ കരടിൽ വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
