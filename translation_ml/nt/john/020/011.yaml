id: JHN.20.11
reference: John 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: ml
  text: എന്നാൽ മറിയ കല്ലറയ്ക്കു പുറത്ത് കരഞ്ഞുകൊണ്ട് നിൽക്കുകയായിരുന്നു. അവൾ ഇങ്ങനെ കരഞ്ഞുകൊണ്ടിരിക്കെ, കല്ലറയ്ക്കുള്ളിലേക്കു നോക്കാൻ കുനിഞ്ഞു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുനിഞ്ഞ് കല്ലറയ്ക്കുള്ളിലേക്കു നോക്കി.” നോക്കുന്നതിനായി കുനിയുക എന്ന ആശയം ഗ്രീക്ക് ക്രിയയിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്ന് മറിയയിലേക്കുള്ള നേരിയ ആഖ്യാനവ്യതിയാനം വ്യക്തമാക്കുന്നു; ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: εἱστήκει
  choice: നിൽക്കുകയായിരുന്നു
  rationale: പൂർത്തഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന അവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: കല്ലറയ്ക്കു പുറത്ത്
  rationale: മറിയ കല്ലറയുടെ പുറത്താണെന്ന സ്ഥലബന്ധം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: μνημεῖον
  choice: കല്ലറ
  rationale: ഈ സംസ്കാര-പുനരുത്ഥാനസന്ദർഭത്തിലെ പാറയിൽ വെട്ടിയ ശവകുടീരത്തെ സൂചിപ്പിക്കാൻ സാധാരണ മലയാളത്തിൽ ഏറ്റവും യോജിച്ച പദം.
- source_word: κλαίουσα / ἔκλαιεν
  choice: കരഞ്ഞുകൊണ്ട് / കരഞ്ഞുകൊണ്ടിരിക്കെ
  rationale: രണ്ടിടത്തുമുള്ള തുടർച്ചയായ വിലാപപ്രവൃത്തിയും മൂലപാഠത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: ὡς οὖν
  choice: ഇങ്ങനെ ... കൊണ്ടിരിക്കെ
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയെ മുന്നോട്ടുകൊണ്ടുപോകുകയും അത് അവളുടെ കരച്ചിലിനിടെയാണെന്ന് ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു; കർശനമായ കാരണബന്ധം ചുമത്തുന്നില്ല.
- source_word: παρέκυψεν
  choice: നോക്കാൻ കുനിഞ്ഞു
  rationale: കല്ലറയ്ക്കുള്ളിലേക്കു നോക്കുന്നതിനായി ശരീരം കുനിച്ച പ്രവൃത്തി ഗ്രീക്ക് ക്രിയയിൽ ഉൾപ്പെട്ടിരിക്കുന്നതുപോലെ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ μνημεῖον
  choice: കല്ലറയ്ക്കുള്ളിലേക്കു
  rationale: കല്ലറയുടെ അകത്തേക്കുള്ള ദിശയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
