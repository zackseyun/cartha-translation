  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ തുടർച്ചയായ നിലയും കരച്ചിലിന്റെ ആവർത്തനവും സംരക്ഷിച്ചു.
