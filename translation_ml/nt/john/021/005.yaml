  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവരോടു ചോദിച്ചു: “മക്കളേ, നിങ്ങളുടെ പക്കൽ മീൻ[a] ഒന്നുമില്ല, അല്ലേ?” അവർ അവനോടു, “ഇല്ല” എന്നു മറുപടി പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കഴിക്കാനുള്ള എന്തെങ്കിലും.” ഗ്രീക്ക് പദമായ προσφάγιον അപ്പത്തോടൊപ്പം കഴിക്കുന്ന ഭക്ഷണത്തെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു; മീൻപിടിത്തത്തിന്റെ ഈ സന്ദർഭത്തിൽ അത് മിക്കവാറും മീനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള കഥാഗതിയും നിഗമനസ്വഭാവമുള്ള ബന്ധവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Παιδία
  choice: മക്കളേ
  rationale: സ്നേഹവും അടുപ്പവും കലർന്ന അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ശിഷ്യന്മാരുടെ പ്രായത്തെക്കുറിച്ചുള്ള അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: μή τι
  choice: ഒന്നുമില്ല, അല്ലേ?
  rationale: നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ സ്ഥിരീകരണചോദ്യത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: προσφάγιον
  choice: മീൻ
  rationale: പദം അപ്പത്തോടൊപ്പം കഴിക്കുന്ന ഭക്ഷണത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ മീൻപിടിത്തസന്ദർഭത്തിൽ മീൻ തന്നെയാകാനാണ് കൂടുതൽ സാധ്യത; വിശാലമായ അർത്ഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἔχετε
  choice: നിങ്ങളുടെ പക്കൽ ... ഇല്ല
  rationale: കൈവശമുണ്ടായിരിക്കുക എന്ന അർത്ഥം ചോദ്യഘടനയിൽ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: അവർ അവനോട് ... ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ കഥനപ്രയോഗത്തെ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Οὔ
  choice: ഇല്ല
  rationale: മൂലത്തിലെ ചുരുങ്ങിയ നിഷേധാത്മക മറുപടി അതേ സംക്ഷിപ്തതയിൽ നിലനിർത്തുന്നു.
