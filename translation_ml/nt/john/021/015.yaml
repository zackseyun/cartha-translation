revisions:
- from: 'അവർ പ്രഭാതഭക്ഷണം കഴിച്ചുകഴിഞ്ഞപ്പോൾ യേശു ശിമോൻ പത്രോസിനോട് ചോദിച്ചു: “യോഹന്നാന്റെ മകനായ ശിമോനേ, ഇവയെക്കാൾ അധികമായി നീ എന്നെ സ്നേഹിക്കുന്നുവോ?”[b] അവൻ യേശുവിനോട് പറഞ്ഞു: “അതെ, കർത്താവേ; ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങേക്കറിയാമല്ലോ.”[a] യേശു അവനോട് പറഞ്ഞു: “എന്റെ കുഞ്ഞാടുകളെ തീറ്റുക.”'
  to: 'അവർ പ്രഭാതഭക്ഷണം കഴിച്ചുകഴിഞ്ഞപ്പോൾ യേശു ശിമോൻ പത്രോസിനോട് ചോദിച്ചു: “യോഹന്നാന്റെ മകനായ ശിമോനേ, മറ്റുള്ളവരെക്കാളും മറ്റെന്തിനെക്കാളും നീ എന്നെ കൂടുതലായി സ്നേഹിക്കുന്നുവോ?”[b] അവൻ യേശുവിനോട് പറഞ്ഞു: “അതെ, കർത്താവേ; ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങേക്ക് അറിയാം.”[a] യേശു അവനോട് പറഞ്ഞു: “എന്റെ കുഞ്ഞാടുകളെ തീറ്റുക.”'
