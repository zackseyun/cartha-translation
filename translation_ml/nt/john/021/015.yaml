id: JHN.21.15
reference: John 21:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: ml
  text: 'അവർ പ്രഭാതഭക്ഷണം കഴിച്ചുകഴിഞ്ഞപ്പോൾ യേശു ശിമോൻ പത്രോസിനോട് ചോദിച്ചു: “യോഹന്നാന്റെ മകനായ ശിമോനേ, മറ്റുള്ളവരെക്കാളും മറ്റെന്തിനെക്കാളും നീ എന്നെ കൂടുതലായി സ്നേഹിക്കുന്നുവോ?”[b] അവൻ യേശുവിനോട് പറഞ്ഞു: “അതെ, കർത്താവേ; ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങേക്ക് അറിയാം.”[a] യേശു അവനോട് പറഞ്ഞു: “എന്റെ കുഞ്ഞാടുകളെ തീറ്റുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ യേശുവിന്റെ ചോദ്യത്തിൽ ἀγαπάω എന്ന ക്രിയയും പത്രോസിന്റെ മറുപടിയിൽ φιλέω എന്ന വേറൊരു ക്രിയയും ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നു. ചിലർ ഇവയ്ക്കിടയിൽ അർത്ഥവ്യത്യാസം കാണുന്നു; മറ്റുചിലർ ഇത് ശൈലീപരമായ പദവൈവിധ്യമാണെന്ന് കരുതുന്നു. സന്ദർഭം വ്യത്യാസം വ്യക്തമായി നിർണ്ണയിക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ രണ്ടും ‘സ്നേഹിക്കുക’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ താരതമ്യം എന്തിനോടാണെന്നത് വ്യക്തമാക്കിയിട്ടില്ല. “ഈ മനുഷ്യർ എന്നെ സ്നേഹിക്കുന്നതിലധികം,” “ഈ മനുഷ്യരെ സ്നേഹിക്കുന്നതിലധികം,” അല്ലെങ്കിൽ “ഈ കാര്യങ്ങളെ സ്നേഹിക്കുന്നതിലധികം” എന്നിങ്ങനെ ഇതിന് അർത്ഥമാകാം. മുഖ്യപാഠം ഈ സാദ്ധ്യതകൾ തുറന്നുവയ്ക്കുന്നതിനായി ‘മറ്റുള്ളവരെക്കാളും മറ്റെന്തിനെക്കാളും’ എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: പ്രഭാതഭക്ഷണം കഴിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: ἀριστάω പ്രഭാതത്തിലെ ഭക്ഷണം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സമയബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: ചോദിച്ചു / പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാള കഥനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ നൽകി; ചോദ്യം വരുന്നിടത്ത് ‘ചോദിച്ചു’ എന്നും മറുപടിയും കല്പനയും വരുന്നിടത്ത് ‘പറഞ്ഞു’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: Σίμων Ἰωάννου
  choice: യോഹന്നാന്റെ മകനായ ശിമോനേ
  rationale: Ἰωάννου എന്ന ഷഷ്ഠീവിഭക്തിരൂപം പിതൃനാമമായി നേരിട്ട് നൽകി; ‘യോനയുടെ മകൻ’ എന്ന മറ്റൊരു പാഠപരമ്പര ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: ἀγαπᾷς / φιλῶ
  choice: സ്നേഹിക്കുന്നുവോ / സ്നേഹിക്കുന്നുവെന്ന്
  rationale: രണ്ടു ക്രിയകൾക്കും സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘സ്നേഹിക്കുക’ ഉപയോഗിച്ചു. അവയ്ക്കിടയിൽ നിർബന്ധമായ ഒരു ഉയർന്ന-താഴ്ന്ന സ്നേഹവ്യത്യാസം മുഖ്യപാഠത്തിൽ ചുമത്താതെ, ഗ്രീക്കിലെ പദവ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: πλέον τούτων
  choice: ഇവയെക്കാൾ അധികമായി
  rationale: താരതമ്യം പൂർണമാക്കാതെ നിർത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു. മലയാളത്തിലെ സർവനാമതിരഞ്ഞെടുപ്പ് വസ്തുക്കളിലേക്കു ചായാൻ ഇടയുള്ളതിനാൽ മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള പത്രോസിന്റെ ആദരപൂർവമായ അഭിസംബോധനയും യോഹന്നാന്റെ സുവിശേഷത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: σὺ οἶδας
  choice: അങ്ങേക്കറിയാമല്ലോ
  rationale: σὺ എന്ന ഊന്നലും തന്റെ സ്നേഹത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ അറിവിലേക്കുള്ള പത്രോസിന്റെ അഭ്യർഥനാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Βόσκε
  choice: തീറ്റുക
  rationale: βόσκω എന്നത് വിശാലമായ മേയ്പ്പുപരിപാലനത്തേക്കാൾ പ്രത്യേകമായി ആഹാരം കൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘മേയ്ക്കുക’ എന്നതിനു പകരം ‘തീറ്റുക’ തെരഞ്ഞെടുത്തു.
- source_word: τὰ ἀρνία μου
  choice: എന്റെ കുഞ്ഞാടുകളെ
  rationale: യേശുവിന്റെ ഉടമസ്ഥതയും പരിപാലനവും സൂചിപ്പിക്കുന്ന μου നേരിട്ട് നിലനിർത്തി; ἀρνία എന്ന ആട്ടിൻകുഞ്ഞുങ്ങളുടെ ഇടയചിത്രം ‘കുഞ്ഞാടുകൾ’ എന്ന സ്വാഭാവിക പദത്തിൽ നൽകി.
theological_decisions:
- issue: ἀγαπάω, φιλέω എന്നീ സ്നേഹക്രിയകൾക്ക് മുഖ്യപാഠത്തിൽ വ്യത്യസ്ത പദങ്ങൾ നൽകണമോ
  choice: രണ്ടും ‘സ്നേഹിക്കുക’ എന്നു നൽകി; ഗ്രീക്കിലെ വ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
  alternative: ἀγαπάω എന്നത് ‘സ്നേഹിക്കുക’ എന്നും φιλέω എന്നത് ‘വാത്സല്യമുണ്ടായിരിക്കുക’ അല്ലെങ്കിൽ ‘ഇഷ്ടപ്പെടുക’ എന്നും വേർതിരിക്കുക.
  rationale: യോഹന്നാൻ ഇവിടെ ഉദ്ദേശപൂർവമായ അർത്ഥനിലവ്യത്യാസമാണോ ശൈലീപരമായ പദവൈവിധ്യമാണോ ഉപയോഗിക്കുന്നതെന്ന് തീർച്ചയില്ല. മുഖ്യപാഠത്തിൽ വ്യത്യാസം ശക്തമാക്കുന്നത് പാഠം വ്യക്തമാക്കാത്ത ഒരു സ്നേഹശ്രേണി ചുമത്താൻ ഇടയാക്കും.
- issue: πλέον τούτων എന്നതിലെ താരതമ്യത്തിന്റെ അർത്ഥം
  choice: ‘ഇവയെക്കാൾ അധികമായി’ എന്ന അപൂർണ താരതമ്യം നിലനിർത്തി, സാദ്ധ്യമായ അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ഈ ശിഷ്യന്മാർ എന്നെ സ്നേഹിക്കുന്നതിലധികം’ അല്ലെങ്കിൽ ‘ഈ കാര്യങ്ങളെ സ്നേഹിക്കുന്നതിലധികം’ എന്ന് ഒറ്റ അർത്ഥം തിരഞ്ഞെടുക്കുക.
  rationale: ഗ്രീക്ക് ആരോടോ എന്തിനോടോ, അല്ലെങ്കിൽ ആരുടെ സ്നേഹത്തോടോ താരതമ്യം ചെയ്യുന്നതാണെന്ന് തുറന്നു പറയുന്നില്ല. അതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം മുഖ്യപാഠത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ രൂപവും ‘കർത്താവേ’ എന്ന ആദരരൂപവും സ്വീകരിച്ചു. വായനാസൗകര്യത്തിനായി സംഭാഷണവാക്യങ്ങളിൽ ‘ചോദിച്ചു’, ‘പറഞ്ഞു’ എന്നിവ ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്കിലെ ആശയം മാറ്റിയിട്ടില്ല.
