source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: ml
  text: 'അവൻ വീണ്ടും, രണ്ടാം പ്രാവശ്യം, അവനോടു പറഞ്ഞു: “യോഹന്നാന്റെ മകനായ ശിമോനേ, നീ എന്നെ സ്നേഹിക്കുന്നുവോ?”[a] അവൻ അവനോടു പറഞ്ഞു: “അതെ, കർത്താവേ; ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങേക്ക് അറിയാമല്ലോ.” അവൻ അവനോടു പറഞ്ഞു: “എന്റെ ആടുകളെ ഇടയനായി പരിപാലിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ സംഭാഷണത്തിൽ ‘സ്നേഹിക്കുക’ എന്നതിന് ഗ്രീക്കിൽ രണ്ടു വ്യത്യസ്ത ക്രിയകളുണ്ട്: യേശു ἀγαπάω (agapaō) ഉപയോഗിച്ചാണ് ചോദിക്കുന്നത്; പത്രോസ് φιλέω (phileō) ഉപയോഗിച്ചാണ് മറുപടി പറയുന്നത്. ചിലർ ഇവയ്ക്കിടയിൽ അർത്ഥവ്യത്യാസം കാണുന്നു; മറ്റുചിലർ ഇതിനെ ശൈലീവ്യത്യാസമായി കാണുന്നു. വ്യത്യാസം അതിരുകടന്ന് പ്രകടിപ്പിക്കാതിരിക്കാനാണ് പ്രധാന പാഠത്തിൽ രണ്ടും ‘സ്നേഹിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: വീണ്ടും രണ്ടാം പ്രാവശ്യം
  rationale: πάλιν, δεύτερον എന്നീ രണ്ടു ഘടകങ്ങളും നിലനിർത്തി ഗ്രീക്കിലെ ആവർത്തനഊന്നൽ പ്രകടമാക്കുന്നു; മലയാളത്തിൽ മനസ്സിലാകുന്ന സ്വാഭാവിക ക്രമമാണ്.
- source_word: Σίμων Ἰωάννου
  choice: യോഹന്നാന്റെ മകനായ ശിമോനേ
  rationale: Ἰωάννου എന്ന ജനിറ്റീവ് പിതൃനാമമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു; ഈ ഗ്രീക്ക് പാഠത്തിൽ ഇല്ലാത്ത ‘യോനാ’ എന്ന പരമ്പരാഗത രൂപം സ്വീകരിക്കുന്നില്ല.
- source_word: ἀγαπᾷς με
  choice: നീ എന്നെ സ്നേഹിക്കുന്നുവോ
  rationale: ἀγαπάω എന്നതിന് സാധാരണവും മാന്യവുമായ ‘സ്നേഹിക്കുക’ ഉപയോഗിക്കുന്നു; ക്രിയാഭേദത്തിന് ഉറപ്പില്ലാത്ത പ്രത്യേക തീവ്രത ചുമത്തുന്നില്ല.
- source_word: Ναί, κύριε
  choice: അതെ, കർത്താവേ
  rationale: Ναίയുടെ ലളിതമായ സമ്മതവും κύριε എന്ന ആദരപൂർവമായ അഭിസംബോധനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σὺ οἶδας ὅτι φιλῶ σε
  choice: ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങേക്ക് അറിയാമല്ലോ
  rationale: വ്യക്തമായ σὺ നൽകുന്ന നേരിയ ഊന്നൽ ‘അങ്ങേക്ക് അറിയാമല്ലോ’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; φιλέωയും പ്രധാന പാഠത്തിൽ ‘സ്നേഹിക്കുക’ എന്നാണ് നൽകുന്നത്.
- source_word: Ποίμαινε τὰ πρόβατά μου
  choice: എന്റെ ആടുകളെ മേയ്ക്കുക
  rationale: ποιμαίνωയുടെ ഇടയപരിപാലനരൂപകവും πρόβατα എന്നതിന്റെ മൂർത്തമായ ‘ആടുകൾ’ എന്ന ചിത്രവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀγαπάω, φιλέω എന്നീ സ്നേഹക്രിയകൾ വ്യത്യസ്ത മലയാളപദങ്ങളാൽ വേർതിരിക്കണമോ
  choice: പ്രധാന പാഠത്തിൽ രണ്ടും ‘സ്നേഹിക്കുക’ എന്നു നൽകുകയും പദവ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
  alternative: ἀγαπάωയ്ക്ക് ‘സ്നേഹിക്കുക’, φιλέωയ്ക്ക് ‘ഇഷ്ടപ്പെടുക’ അല്ലെങ്കിൽ ‘വാത്സല്യം പുലർത്തുക’ എന്നു വ്യത്യസ്തമായി നൽകുക.
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഈ രണ്ടു ക്രിയകൾക്ക് ഗണ്യമായ അർത്ഥമേളനം ഉണ്ടാകാം. പ്രധാന പാഠത്തിൽ നിർബന്ധിതമായ വ്യത്യാസം സൃഷ്ടിക്കുന്നത് പാഠം വ്യക്തമായി ഉറപ്പിക്കാത്ത മാനസികമോ ദൈവശാസ്ത്രപരമോ ആയ സൂക്ഷ്മത ചുമത്തും; അടിക്കുറിപ്പ് യഥാർത്ഥ പദവ്യത്യാസം സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. പത്രോസ് യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘മേയ്ക്കുക’ ഇടയരൂപകം നിലനിർത്തുന്നു; വാക്യത്തിലെ ആവർത്തനഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
