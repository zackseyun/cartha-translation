id: JHN.21.23
reference: John 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: ml
  text: അതുകൊണ്ട്, ആ ശിഷ്യൻ മരിക്കുകയില്ല എന്ന ഈ വാർത്ത സഹോദരന്മാരുടെ ഇടയിൽ പരന്നു.[a][b] എന്നാൽ, അവൻ മരിക്കുകയില്ല എന്ന് യേശു പത്രോസിനോട് പറഞ്ഞില്ല; മറിച്ച്, “ഞാൻ വരുന്നതുവരെ അവൻ നിലനിൽക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ, അതു നിനക്ക് എന്ത്?” എന്നാണു പറഞ്ഞത്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വാക്ക് സഹോദരന്മാരുടെ ഇടയിൽ പരന്നു.” λόγος എന്ന ഗ്രീക്ക് പദത്തിന് “വാക്ക്,” “പ്രസ്താവന,” “വാർത്ത” എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള “സഹോദരന്മാർ” ശിഷ്യസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമായ ἀδελφοί ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: ആ ശിഷ്യൻ ഒരിക്കലും മരിക്കുകയില്ലെന്ന് യേശു വാഗ്ദാനം ചെയ്തില്ല; “ഞാൻ ... ആഗ്രഹിക്കുന്നെങ്കിൽ” എന്ന സാങ്കൽപ്പിക ഉപാധിയാണ് അദ്ദേഹം പറഞ്ഞത്.
    reason: theological_clarification
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς
  choice: ഇടയിൽ പരന്നു
  rationale: ആളുകളുടെ ഒരു സമൂഹത്തിനുള്ളിൽ ഒരു വിവരം പ്രചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: οὗτος ὁ λόγος
  choice: ഈ വാർത്ത
  rationale: ഇവിടെ λόγος ദൈവശാസ്ത്രപരമായ ‘വചനം’ എന്നതിലുപരി പ്രചരിച്ച ഒരു വിവരം അഥവാ റിപ്പോർട്ടാണ്; തുടർന്നുള്ള തിരുത്തലും ഇതിനെ ഒരു പ്രചാരവാർത്തയായി കാണിക്കുന്നു.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരുടെ ഇടയിൽ
  rationale: ἀδελφοί എന്ന പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുകയും, വിവരം ആ സമൂഹത്തിനുള്ളിൽ പ്രചരിച്ചു എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: ആ ശിഷ്യൻ
  rationale: ἐκεῖνος എന്ന നിർദേശകപദത്തിന്റെ പ്രത്യേകതയും യോഹന്നാന്റെ വിവരണശൈലിയിലെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: οὐκ ἀποθνῄσκει
  choice: മരിക്കുകയില്ല
  rationale: പ്രചരിച്ച അവകാശവാദത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി ഭാവിനിഷേധമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ εἶπεν δὲ
  choice: എന്നാൽ ... പറഞ്ഞില്ല
  rationale: δέ ഇവിടെ തെറ്റിദ്ധാരണ തിരുത്തുന്ന വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: αὐτῷ
  choice: പത്രോസിനോട്
  rationale: സർവനാമം തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ പത്രോസിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ സൂചിതനായ വ്യക്തിയുടെ പേര് ഉപയോഗിച്ചു.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: അവൻ നിലനിൽക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ
  rationale: θέλω എന്ന ഇച്ഛയും μένειν എന്ന ‘നിലനിൽക്കുക/തുടരുക’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു; ഉപാധിയുടെ സാങ്കൽപ്പിക സ്വഭാവം ‘എങ്കിൽ’ വ്യക്തമാക്കുന്നു.
- source_word: ἕως ἔρχομαι
  choice: ഞാൻ വരുന്നതുവരെ
  rationale: ഗ്രീക്കിനോട് ചേർന്ന് ‘വരുക’ നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായ ‘മടങ്ങിവരുക’ ചേർക്കുന്നില്ല.
- source_word: τί πρὸς σέ
  choice: അതു നിനക്ക് എന്ത്?
  rationale: മറ്റൊരു ശിഷ്യന്റെ കാര്യത്തെക്കുറിച്ചുള്ള പത്രോസിന്റെ ചിന്തയെ മാറ്റിനിർത്തുന്ന ചുരുക്കവും നേരിട്ടുമായ ഗ്രീക്ക് ശൈലി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആ ശിഷ്യൻ മരിക്കുകയില്ലെന്ന പ്രചാരത്തിന്റെ സ്വഭാവം
  choice: യേശു നൽകിയ വാഗ്ദാനമായി അല്ല, സമൂഹത്തിൽ പരന്ന വാർത്തയായി അവതരിപ്പിച്ചു.
  alternative: ‘ഈ വാക്ക് പുറത്തേക്കു പോയി’ എന്ന കൂടുതൽ പദാനുപദ പരിഭാഷ.
  rationale: വാക്യം തന്നെ പ്രചരിച്ച ധാരണയെ തിരുത്തുന്നു. ‘വാർത്ത’ എന്നത് ആ അവകാശവാദം യേശുവിന്റെ യഥാർഥ വാക്കല്ലെന്ന തുടർന്നുള്ള വിശദീകരണവുമായി യോജിക്കുന്നു.
- issue: യേശുവിന്റെ ഉപാധിവാക്യം
  choice: ‘ആഗ്രഹിക്കുന്നെങ്കിൽ’ എന്ന സാങ്കൽപ്പിക ഉപാധി വ്യക്തമായി നിലനിർത്തി.
  alternative: ആ ശിഷ്യൻ യേശുവിന്റെ വരവുവരെ നിർബന്ധമായും ജീവിക്കുമെന്ന പ്രവചനമായി അവതരിപ്പിക്കുക.
  rationale: Ἐὰν എന്ന ഉപാധിയെ പ്രവചനമോ വാഗ്ദാനമോ ആക്കി മാറ്റാതെ, മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനം’ എന്ന സഭാപരമായ സാങ്കേതികധ്വനി ഒഴിവാക്കി സന്ദർഭോചിതമായി ‘വാർത്ത’ ഉപയോഗിച്ചു. ഉദ്ധരണിയിലെ നേരിട്ടുള്ള ചോദ്യം സംക്ഷിപ്തമായി നിലനിർത്തി.
