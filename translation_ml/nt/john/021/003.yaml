id: JHN.21.3
reference: John 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: ml
  text: 'ശിമോൻ പത്രോസ് അവരോടു പറഞ്ഞു[a]: “ഞാൻ മീൻപിടിക്കാൻ പോകുന്നു.” അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങളും നിന്നോടൊപ്പം വരുന്നു.” അവർ പുറപ്പെട്ടു പടകിൽ കയറി; ആ രാത്രിയിൽ അവർ ഒന്നും പിടിച്ചില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ആഖ്യാന വർത്തമാനകാലമാണ് (‘ശിമോൻ പത്രോസ് അവരോടു പറയുന്നു ... അവർ അവനോടു പറയുന്നു’); കഥപറച്ചിലിൽ സാധാരണമായ ഈ പ്രയോഗം മലയാളത്തിൽ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: പറഞ്ഞു ... പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ആഖ്യാന വർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലം ഉപയോഗിച്ചു; ഇതിനെക്കുറിച്ചുള്ള സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: Ὑπάγω ἁλιεύειν
  choice: ഞാൻ മീൻപിടിക്കാൻ പോകുന്നു
  rationale: Ὑπάγω എന്ന ചലനക്രിയയും ἁλιεύειν എന്ന ഉദ്ദേശ്യാർഥക അനന്തക്രിയയും സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: ഞങ്ങളും നിന്നോടൊപ്പം വരുന്നു
  rationale: καὶ ἡμεῖς എന്ന ഊന്നൽ ‘ഞങ്ങളും’ എന്നും σύν എന്ന സഹവർത്തിത്വം ‘നിന്നോടൊപ്പം’ എന്നും സംരക്ഷിച്ചു.
- source_word: ἐξῆλθον
  choice: അവർ പുറപ്പെട്ടു
  rationale: സന്ദർഭത്തിലെ യാത്രയുടെ തുടക്കം സ്വാഭാവികമായി അറിയിക്കുന്നു; പദാനുപദമായ ‘പുറത്തുപോയി’യെക്കാൾ മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: പടകിൽ കയറി
  rationale: മീൻപിടിത്തസന്ദർഭത്തിൽ πλοῖον എന്നത് ‘പടക്’ എന്നും കയറുന്നതിനെ സൂചിപ്പിക്കുന്ന ἐνέβησαν സ്വാഭാവികമായി ‘കയറി’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: ആ രാത്രിയിൽ
  rationale: കാലസൂചക ദത്തിവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായ സമയപ്രയോഗമായി നൽകി.
- source_word: ἐπίασαν οὐδέν
  choice: അവർ ഒന്നും പിടിച്ചില്ല
  rationale: മീൻപിടിത്തസന്ദർഭത്തിൽ πιάζω എന്നതിന് ‘പിടിക്കുക’ യോജിക്കുന്നു; οὐδέν പൂർണമായ പരാജയത്തെ ‘ഒന്നും ... ഇല്ല’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സംഭാഷണം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സ്വാഭാവികമാക്കി; ഗ്രീക്കിലെ ആഖ്യാന വർത്തമാനകാലത്തിന്റെ പ്രത്യേകത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
