translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. നീണ്ട കർത്തൃപട്ടികയ്ക്ക് ശേഷം ‘ഇവരെല്ലാം’ ചേർത്തത് വാക്യഘടന വ്യക്തമാക്കാനാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത പുതിയ പങ്കാളികളെ ഇതിലൂടെ സൂചിപ്പിക്കുന്നില്ല.
