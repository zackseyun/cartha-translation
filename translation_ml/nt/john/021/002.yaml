language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: ml
  text: ശിമോൻ പത്രോസ്, ‘ഇരട്ട’ എന്നു വിളിക്കപ്പെട്ട തോമസ്[a], ഗലീലയിലെ കാനായിൽനിന്നുള്ള നഥനയേൽ, സെബെദിയുടെ പുത്രന്മാർ, അവന്റെ ശിഷ്യന്മാരിൽ വേറെ രണ്ടുപേർ—ഇവരെല്ലാം ഒരുമിച്ചായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ‘ദിദിമൊസ്’; ഈ പദത്തിന്റെ അർഥം ‘ഇരട്ട’ എന്നാണ്.'
    reason: Δίδυμος എന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ മൂലരൂപവും അർഥവും വായനക്കാരന് വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: ഒരുമിച്ചുണ്ടായിരുന്നു
  rationale: ἦσαν എന്ന അപൂർണഭൂതകാല ക്രിയയും ὁμοῦ എന്ന സ്ഥലപരമായ കൂട്ടായ്മയും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്ത് അവതരിപ്പിക്കുന്നു.
- source_word: Σίμων Πέτρος
  choice: ശിമോൻ പത്രോസ്
  rationale: വ്യക്തിനാമവും വിശേഷനാമവും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: ‘ഇരട്ട’ എന്നു വിളിക്കപ്പെട്ട തോമസ്[a]
  rationale: λεγόμενος എന്നത് ‘വിളിക്കപ്പെട്ട’ എന്നും Δίδυμος എന്ന അർഥവത്തായ വിശേഷണം ‘ഇരട്ട’ എന്നും പരിഭാഷപ്പെടുത്തി; ഗ്രീക്ക് രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ കാനായിൽനിന്നുള്ള നഥനയേൽ
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥലം വ്യക്തമായി നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക സ്ഥലനാമക്രമം ഉപയോഗിക്കുകയും ചെയ്തു.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: സെബെദിയുടെ പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ജനിറ്റീവ് പ്രയോഗം സന്ദർഭത്തിൽ ഉറപ്പായും സെബെദിയുടെ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘പുത്രന്മാർ’ വ്യക്തമാക്കി.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: അവന്റെ ശിഷ്യന്മാരിൽ വേറെ രണ്ടുപേർ
  rationale: ἐκ എന്ന ഭാഗികബന്ധവും δύο എന്ന എണ്ണവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിച്ചു.
- source_word: καί ... καί
  choice: പട്ടികയും അവസാനത്തിൽ ‘ഇവരെല്ലാം’ എന്ന സംഗ്രഹവും
  rationale: ആവർത്തിച്ചുള്ള ഗ്രീക്ക് സംയോജകങ്ങൾ വാക്കുതോറും പകർത്താതെ, എല്ലാ പേരുകളും ഒരേ കർത്തൃപട്ടികയിൽ ഉൾപ്പെടുന്നുവെന്ന് മലയാളത്തിൽ വ്യക്തമായി കാണിച്ചു.
