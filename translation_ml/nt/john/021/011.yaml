source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: ml
  text: അപ്പോൾ ശിമോൻ പത്രോസ് വള്ളത്തിലേക്കു കയറി[a], വലിയ മീനുകൾ—നൂറ്റമ്പത്തിമൂന്ന് എണ്ണം—നിറഞ്ഞിരുന്ന വല കരയിലേക്ക്[b] വലിച്ചുകയറ്റി. ഇത്രയധികം മീനുകൾ ഉണ്ടായിരുന്നിട്ടും വല കീറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുകളിലേക്കു കയറി.’ ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ ‘കയറി’ എന്നാണ്; സന്ദർഭത്തിൽ ശിമോൻ പത്രോസ് വല വലിച്ചുകയറ്റാൻ വള്ളത്തിലേക്കു കയറിയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിലത്തേക്ക്’; ഈ മീൻപിടിത്തസന്ദർഭത്തിൽ ‘കരയിലേക്ക്’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: കയറി
  rationale: ക്രിയയുടെ അക്ഷരാർഥമായ ‘മുകളിലേക്കു കയറി’ എന്ന ആശയം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പത്രോസ് വള്ളത്തിലേക്കോ വള്ളത്തിന്മേലേക്കോ കയറിയതായിരിക്കാം, എന്നാൽ മൂലപാഠം വള്ളത്തെ വ്യക്തമായി പറയുന്നില്ല.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭവത്തിന്റെ തുടർച്ചയും അതിനോടുള്ള പ്രതികരണവും സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἵλκυσεν
  choice: വലിച്ചുകയറ്റി
  rationale: വല വെള്ളത്തിൽനിന്ന് കരയിലേക്കു ശക്തിയായി വലിച്ചെത്തിച്ച പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ δίκτυον
  choice: വല
  rationale: മീൻപിടിത്തത്തിനുള്ള വലയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സാധാരണ മലയാളപദം.
- source_word: εἰς τὴν γῆν
  choice: കരയിലേക്ക്
  rationale: അക്ഷരാർഥം ‘നിലത്തേക്ക്/കരയിലേക്ക്’ എന്നാണ്; തടാകത്തിലെ മീൻപിടിത്തസന്ദർഭത്തിൽ ‘കരയിലേക്ക്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: വലിയ മീനുകൾ … നിറഞ്ഞിരുന്ന
  rationale: വലയുടെ നിറവും മീനുകളുടെ വലുപ്പവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: നൂറ്റമ്പത്തിമൂന്ന് എണ്ണം
  rationale: മൂലപാഠത്തിലെ കൃത്യമായ സംഖ്യ നിലനിർത്തുന്നു; ‘എണ്ണം’ ചേർക്കുന്നത് മലയാളത്തിൽ മീനുകളുടെ കണക്ക് വ്യക്തമായി വായിക്കാൻ സഹായിക്കുന്നു.
- source_word: τοσούτων ὄντων
  choice: ഇത്രയധികം മീനുകൾ ഉണ്ടായിരുന്നിട്ടും
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ സന്ദർഭോചിതമായ വഴങ്ങൽഭാവം (‘എങ്കിലും’) വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐσχίσθη
  choice: കീറിയില്ല
  rationale: വല വലിയ ഭാരത്തിലും അറ്റുപോകാതെ നിലനിന്നുവെന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
