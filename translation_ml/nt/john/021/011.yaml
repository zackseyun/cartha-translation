translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠം വ്യക്തമാക്കാത്ത ‘വള്ളം’ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ἀνέβη എന്നതിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തി; സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
