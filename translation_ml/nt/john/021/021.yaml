id: JHN.21.21
reference: John 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: ml
  text: 'അങ്ങനെ പത്രോസ് അവനെ കണ്ടപ്പോൾ യേശുവിനോടു ചോദിക്കുന്നു: “കർത്താവേ, ഇയാളുടെ കാര്യമോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: അവനെ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച ശിഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ സർവനാമരൂപം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തോടുള്ള അനുമാനാത്മക/വിവരണാത്മക ബന്ധം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: ചോദിക്കുന്നു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പറയുന്നു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് മലയാളത്തിൽ ‘ചോദിക്കുന്നു’ സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും യോഹന്നാനിലെ ബഹുമാനപൂർണമായ ശൈലിയും നിലനിർത്തുന്നു.
- source_word: οὗτος δὲ τί
  choice: ഇയാളുടെ കാര്യമോ?
  rationale: വാക്യഭാഗം സംക്ഷിപ്തവും വ്യാകരണപരമായി അപൂർണ്ണവുമാണ്; ‘ഇയാളെ സംബന്ധിച്ച് എന്ത്?’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു, മറുപടിയുടെ ഉള്ളടക്കം മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: οὗτος δὲ τί എന്ന സംക്ഷിപ്ത ചോദ്യത്തിന്റെ വ്യാപ്തി
  choice: “ഇയാളുടെ കാര്യമോ?”
  alternative: “ഇയാൾക്ക് എന്തു സംഭവിക്കും?”
  rationale: പത്രോസ് ആ ശിഷ്യന്റെ ഭാവിയെക്കുറിച്ചാണ് ചോദിക്കുന്നതെന്ന സന്ദർഭസൂചന ഉണ്ടെങ്കിലും, ഗ്രീക്ക് പാഠം അത് വ്യക്തമായി വിപുലീകരിക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ അനിശ്ചിതത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ചരിത്രവർത്തമാനകാലമായ λέγει പ്രതിഫലിപ്പിക്കാൻ ‘ചോദിക്കുന്നു’ ഉപയോഗിച്ചു; നേരിട്ടുള്ള ചോദ്യത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തി.
