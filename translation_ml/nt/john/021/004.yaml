id: JHN.21.4
reference: John 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: ml
  text: നേരം ഇതിനകം പുലർന്നപ്പോൾ, യേശു കരയിൽ നിന്നു. എങ്കിലും അവൻ യേശുവാണെന്ന് ശിഷ്യന്മാർ അറിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ യേശുവാണെന്ന് തിരിച്ചറിഞ്ഞില്ല.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “അവൻ യേശുവാണെന്ന് അറിഞ്ഞില്ല” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας ... ἤδη γενομένης
  choice: നേരം പുലർന്നുകഴിഞ്ഞപ്പോൾ
  rationale: ഈ genitive absolute കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘നേരം പുലരുക’ πρωΐαയുടെ സ്വാഭാവിക മലയാളപ്രയോഗമാണ്; ‘കഴിഞ്ഞപ്പോൾ’ എന്നത് ἤδη γενομένης എന്നതിലെ ‘ഇതിനകം സംഭവിച്ചുകഴിഞ്ഞ’ ഭാവം ഉൾക്കൊള്ളുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലഘുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും കാലവാക്യവും ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വൈരുധ്യപദം ചേർത്തിട്ടില്ല.
- source_word: ἔστη
  choice: നിന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ aorist രൂപം ഇവിടെ യേശു കരയിൽ നിൽക്കുന്നതിനെ ലളിതമായ ഭൂതകാലത്തിൽ അറിയിക്കുന്നു. ‘നിന്നുകൊണ്ടിരുന്നു’ എന്നത് ഉറവിടത്തിൽ ഇല്ലാത്ത കൂടുതൽ ദൈർഘ്യഭാവം നൽകാം.
- source_word: εἰς τὸν αἰγιαλόν
  choice: കരയിൽ
  rationale: നിൽക്കുക എന്ന ക്രിയയോടൊപ്പം εἰς സ്ഥാനം സൂചിപ്പിക്കുന്ന പ്രയോഗമാകാം; αἰγιαλός കടലിന്റെയോ തടാകത്തിന്റെയോ കരയാണ്. സന്ദർഭത്തിൽ ‘കരയിൽ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: οὐ μέντοι
  choice: എങ്കിലും ... ഇല്ല
  rationale: യേശു അവിടെ നിന്നിരുന്നിട്ടും ശിഷ്യന്മാർക്ക് അറിയാതിരുന്നതിലെ വൈരുധ്യം ഈ സംയോജനം സൂചിപ്പിക്കുന്നു. ‘എങ്കിലും ... ഇല്ല’ ആ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ᾔδεισαν
  choice: അറിഞ്ഞില്ല
  rationale: οἶδα എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ‘തിരിച്ചറിയുക’ എന്ന ആശയം സാധ്യമാണെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ കൂടുതൽ നിർദിഷ്ടമാക്കിയിട്ടില്ല.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: നിശ്ചിത ലേഖനം സന്ദർഭത്തിൽ അറിയപ്പെടുന്ന ശിഷ്യസംഘത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബഹുവചന നാമം മാത്രം ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്; ഉറവിടത്തിലില്ലാത്ത ‘അവന്റെ’ എന്ന ഉടമസ്ഥപദം ചേർത്തിട്ടില്ല.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: അത് യേശുവാണെന്ന്
  rationale: തിരിച്ചറിയൽ പ്രസ്താവനയുടെ സ്വാഭാവിക മലയാളരൂപമാണിത്. ഗ്രീക്കിലെ വർത്തമാനകാലത്തെ മലയാള പരോക്ഷവാക്യത്തിൽ ‘ആണെന്ന്’ എന്നു നിലനിർത്തുന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ ശിഷ്യന്മാർ തിരിച്ചറിയാതിരുന്നത്
  choice: അവരുടെ പരാജയം ‘അറിഞ്ഞില്ല’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു; അതിന്റെ കാരണം വിശദീകരിച്ചിട്ടില്ല.
  alternative: ‘അത് യേശുവാണെന്ന് തിരിച്ചറിഞ്ഞില്ല’ എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി വിവർത്തനം ചെയ്യുക.
  rationale: അവർ യേശുവിനെ തിരിച്ചറിയാതിരുന്നതിന്റെ കാരണം വാക്യം പറയുന്നില്ല. അതിനാൽ യേശുവിന്റെ രൂപത്തെക്കുറിച്ചോ ശിഷ്യന്മാരുടെ ഗ്രഹണശേഷിയെക്കുറിച്ചോ ഒരു ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിന്റെ നിയന്ത്രണവും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘നേരം പുലരുക’, ‘കരയിൽ നിൽക്കുക’ എന്നീ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു; ഉറവിടത്തിലെ അർഥവ്യാപ്തിയും തിരിച്ചറിയലിനെ സംബന്ധിച്ച അവ്യക്തതയും സംരക്ഷിച്ചു.
