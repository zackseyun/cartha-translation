  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: ml
  text: 'ഇവയ്ക്കു ശേഷം യേശു തിബെര്യാസ് തടാകത്തിന്റെ തീരത്ത് ശിഷ്യന്മാർക്കു വീണ്ടും തന്നെ വെളിപ്പെടുത്തി[a]. അവൻ തന്നെ വെളിപ്പെടുത്തിയത് ഇങ്ങനെയാണ്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രത്യക്ഷപ്പെട്ടു”; ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരുവൻ സ്വയം ദൃശ്യമാകുക അല്ലെങ്കിൽ സ്വയം അറിയിക്കുക എന്ന അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ബഹുവചന സൂചകത്തിന്റെ ഭാവവും യോഹന്നാന്റെ ആഖ്യാനശൈലിയിലെ കാലാന്തരസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: തന്നെ വെളിപ്പെടുത്തി
  rationale: ക്രിയയുടെ പ്രതിഫലനസ്വഭാവവും സ്വയം ദൃശ്യമാക്കുക അഥവാ അറിയിക്കുക എന്ന വെളിപ്പെടുത്തൽഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുമ്പുണ്ടായ പ്രത്യക്ഷപ്പെടലുകൾക്കുശേഷമുള്ള ആവർത്തിത സ്വയംവെളിപ്പെടുത്തലിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാർക്കു
  rationale: ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഉടമസ്ഥസൂചകമായ ‘തന്റെ’ ചേർക്കാതെ മൂലപാഠത്തോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: തിബെര്യാസ് കടൽത്തീരത്ത്
  rationale: ἐπί + genitive ഇവിടെ സൂചിപ്പിക്കുന്ന സമീപസ്ഥാനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും സ്ഥലനാമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: അവൻ തന്നെ വെളിപ്പെടുത്തിയത് ഇങ്ങനെയാണ്
  rationale: ആവർത്തിക്കുന്ന ക്രിയയെ നിലനിർത്തി, തുടർന്ന് വരുന്ന വിവരണത്തിന്റെ രീതി പരിചയപ്പെടുത്തുന്ന οὕτως മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ പ്രത്യക്ഷതയെ വിവരിക്കുന്ന ഭാഷ
  choice: തന്നെ വെളിപ്പെടുത്തി
  alternative: പ്രത്യക്ഷപ്പെട്ടു / തന്നെ അറിയിച്ചുകൊടുത്തു
  rationale: ഇത് യഥാർഥമായ ഉയിർത്തെഴുന്നേൽപ്പാനന്തര കൂടിക്കാഴ്ചയാണെന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, വെറും ദൃശ്യപ്രത്യക്ഷതയെക്കാൾ വിശാലമായ സ്വയംവെളിപ്പെടുത്തൽ എന്ന φανερόωയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കടൽത്തീരത്ത്’ എന്നത് സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അവസാനത്തെ ദ്വിബിന്ദു തുടർന്നുവരുന്ന വിവരണത്തെ പരിചയപ്പെടുത്തുന്നു.
