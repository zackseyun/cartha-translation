id: JHN.21.7
reference: John 21:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: ml
  text: അപ്പോൾ യേശു സ്നേഹിച്ചിരുന്ന ആ ശിഷ്യൻ പത്രോസിനോട്, “അത് കർത്താവാണ്” എന്നു പറഞ്ഞു. അത് കർത്താവാണെന്ന് കേട്ടപ്പോൾ ശിമോൻ പത്രോസ് തന്റെ മേലങ്കി അരയിൽ ചുറ്റിക്കെട്ടി—കാരണം, അവൻ ലഘുവസ്ത്രം ധരിച്ചിരുന്നതിനാൽ[a]—കടലിലേക്കു ചാടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ നഗ്നനായിരുന്നു.” ഗ്രീക്കിലെ γυμνός എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് പൂർണമായി നഗ്നൻ എന്നോ വേണ്ടത്ര വസ്ത്രം ധരിക്കാത്തവൻ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: οὖν ഇവിടെ കഥയുടെ തുടർച്ചയും തിരിച്ചറിവിൽനിന്നുള്ള പ്രതികരണവും സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള ആഖ്യാനബന്ധമാണ്.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: യേശു സ്നേഹിച്ചിരുന്ന ആ ശിഷ്യൻ
  rationale: ἐκεῖνος എന്ന നിർദേശകത്തിന്റെ ബലം ‘ആ’ എന്നതിലൂടെ നിലനിർത്തുകയും യോഹന്നാന്റെ സവിശേഷ വിശേഷണം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ὁ κύριός ἐστιν
  choice: അത് കർത്താവാണ്
  rationale: κύριος എന്നതിന് ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും സാധാരണ അഭിസംബോധനയും നിലനിർത്തുന്ന ‘കർത്താവ്’ ഉപയോഗിച്ചു; തിരിച്ചറിയൽപ്രയോഗത്തിൽ മലയാളത്തിൽ ‘അത് ... ആണ്’ സ്വാഭാവികമാണ്.
- source_word: ἀκούσας ὅτι ὁ κύριός ἐστιν
  choice: അത് കർത്താവാണെന്നു കേട്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ കാലസംബന്ധം ‘കേട്ടപ്പോൾ’ എന്ന സ്വാഭാവിക ഉപവാക്യത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: തന്റെ മേലങ്കി അരയിൽ കെട്ടി
  rationale: ἐπενδύτης പുറമേ ധരിക്കുന്ന വസ്ത്രമാണ്; διαζώννυμι വസ്ത്രം അരയ്ക്കു ചുറ്റി ഉറപ്പിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἦν γὰρ γυμνός
  choice: കാരണം, അവൻ വസ്ത്രം ധരിച്ചിരുന്നില്ല[a]
  rationale: γυμνός എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ നഗ്നാവസ്ഥയെ മാന്യവും സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു; സന്ദർഭാനുസൃതമായി ‘മേലങ്കിയില്ലാതെ/ലഘുവസ്ത്രത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: കടലിലേക്കു ചാടി
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്നെത്തന്നെ കടലിലേക്കെറിഞ്ഞു’ എന്ന തീവ്രതയുള്ള പ്രയോഗത്തെ ആ പ്രവൃത്തിക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളമായ ‘ചാടി’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെ തിരിച്ചറിയുമ്പോഴുള്ള κύριος എന്ന പദം
  choice: കർത്താവ്
  alternative: ഗുരു / യജമാനൻ
  rationale: പുനരുത്ഥാനാനന്തര തിരിച്ചറിവിന്റെ സന്ദർഭത്തിൽ ‘കർത്താവ്’ പദം സാധാരണ ബഹുമാനപദവിയും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും ഒരുപോലെ തുറന്നുവെക്കുന്നു.
- issue: പത്രോസിന്റെ അവസ്ഥയെ വിവരിക്കുന്ന γυμνός
  choice: വസ്ത്രം ധരിച്ചിരുന്നില്ല
  alternative: മേലങ്കിയില്ലാതെയോ ലഘുവസ്ത്രത്തിലോ ആയിരുന്നു
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; തൊഴിൽസന്ദർഭത്തിൽ ഭാഗികവസ്ത്രധാരണം സൂചിപ്പിക്കാമെന്ന യഥാർഥ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മേലങ്കി അരയിൽ കെട്ടി’ എന്നത് പുരാതന വസ്ത്രധാരണപ്രവൃത്തിയെ വിശദീകരണമില്ലാതെ ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു; γυμνός എന്നതിലെ യഥാർഥ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
