id: JHN.21.20
reference: John 21:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: ml
  text: പത്രോസ് തിരിഞ്ഞ്, യേശു സ്നേഹിച്ച ശിഷ്യൻ പിന്നാലെ വരുന്നതു കണ്ടു.[a] അത്താഴസമയത്ത് യേശുവിന്റെ നെഞ്ചോടു ചാഞ്ഞുകിടന്ന[b] ആ ശിഷ്യനാണ്, “കർത്താവേ, അങ്ങയെ ഒറ്റിക്കൊടുക്കുന്നവൻ ആരാണ്?” എന്നു പറഞ്ഞത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആരുടെ പിന്നാലെയാണ് എന്നത് ഗ്രീക്ക് മൂലത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല; “അവന്റെ പിന്നാലെ” അല്ലെങ്കിൽ “അവരുടെ പിന്നാലെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “അത്താഴസമയത്ത് അവന്റെ നെഞ്ചിന്മേൽ ചാരിക്കിടന്ന.” പുരാതനകാലത്ത് ഭക്ഷണം കഴിക്കുമ്പോൾ ചാരിക്കിടന്നിരുന്ന ശരീരനിലയെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: cultural_clarification
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: തിരിഞ്ഞുനോക്കിയപ്പോൾ
  rationale: പത്രോസ് തിരിയുന്നതും തുടർന്ന് കാണുന്നതുമായ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: βλέπει
  choice: കണ്ടു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς
  choice: യേശു സ്നേഹിച്ച ശിഷ്യൻ
  rationale: യോഹന്നാനിലെ ആവർത്തിതമായ വിശേഷണം ലളിതമായും അർത്ഥവിശ്വസ്തമായും നിലനിർത്തുന്നു.
- source_word: ἀκολουθοῦντα
  choice: പിന്നാലെ വരുന്നതു
  rationale: വ്യക്തമായി പറയാത്ത കർമത്തെ ‘അവരെ’ എന്നോ ‘അവനെ’ എന്നോ ചേർത്ത് നിശ്ചയിക്കാതെ ചലനത്തിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ
  choice: അത്താഴസമയത്ത് യേശുവിന്റെ നെഞ്ചോടു ചാഞ്ഞുകിടന്ന്
  rationale: പുരാതന വിരുന്നിലെ ചാരിക്കിടക്കുന്ന ശരീരനിലയും യേശുവിനോടുള്ള ശാരീരിക സാമീപ്യവും ആധുനിക വായനക്കാരന് മനസ്സിലാകുന്നവിധം നൽകുന്നു; സർവനാമത്തിന്റെ സൂചന വ്യക്തതയ്ക്കായി ‘യേശുവിന്റെ’ എന്നു പറയുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ ആദരവും യോഹന്നാനീയ ദൈവശാസ്ത്രപ്രതിധ്വനിയും സൂക്ഷിക്കുന്നു.
- source_word: ὁ παραδιδούς σε
  choice: അങ്ങയെ ഒറ്റിക്കൊടുക്കുന്നവൻ
  rationale: പീഡാനുഭവസന്ദർഭത്തിൽ παραδίδωμι എന്നതിന്റെ വഞ്ചനാപരമായ കൈമാറ്റാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘അങ്ങയെ’ ആദരസൂചക സംബോധനയാണ്.
theological_decisions:
- issue: βλέπει എന്ന ചരിത്രവർത്തമാനത്തിന്റെ പരിഭാഷ
  choice: ഭൂതകാലമായ ‘കണ്ടു’
  alternative: വർത്തമാനകാലമായ ‘കാണുന്നു’
  rationale: ഇത് ഉപദേശപരമായ വ്യാഖ്യാനമല്ല; മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവിക കാലക്രമം പാലിക്കുമ്പോഴും സംഭവാർഥം മാറ്റപ്പെടുന്നില്ല.
- issue: ἀκολουθοῦντα എന്നതിന്റെ വ്യക്തമാക്കാത്ത കർമം
  choice: കർമം ചേർക്കാതെ ‘പിന്നാലെ വരുന്നതു’
  alternative: ‘അവരെ പിന്തുടരുന്നതു’ അല്ലെങ്കിൽ ‘അവനെ പിന്തുടരുന്നതു’
  rationale: ഗ്രീക്ക് മൂലത്തിൽ ആരെയാണ് പിന്തുടരുന്നതെന്ന് വ്യാകരണപരമായി വ്യക്തമല്ല. അതിനാൽ യേശുവോ യേശുവും പത്രോസുമോ എന്ന സാധ്യതകളിൽ ഒന്ന് നിർബന്ധമായി നിശ്ചയിക്കാതെ യഥാർഥമായ അവ്യക്തത സൂക്ഷിക്കുന്നു.
- issue: ἐπὶ τὸ στῆθος αὐτοῦ എന്ന ഭക്ഷണഭംഗി
  choice: ‘യേശുവിന്റെ നെഞ്ചോടു ചാഞ്ഞുകിടന്ന്’
  alternative: ‘അവന്റെ നെഞ്ചിന്മേൽ ചാരിക്കിടന്ന്’
  rationale: പുരാതനകാലത്ത് ഭക്ഷണത്തിനായി ചാരിക്കിടന്ന ഭംഗി സൂചിപ്പിക്കുകയും, അനാവശ്യമായ ദൈവശാസ്ത്ര നിഗമനം ചേർക്കാതെ ബന്ധസാമീപ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശിഷ്യൻ,’ ‘കർത്താവേ,’ ‘ഒറ്റിക്കൊടുക്കുന്നവൻ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ദുഷ്കരമായ പദാനുപദക്രമം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
