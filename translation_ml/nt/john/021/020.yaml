revisions:
- from: പത്രോസ് തിരിഞ്ഞുനോക്കിയപ്പോൾ, യേശു സ്നേഹിച്ച ശിഷ്യൻ പിന്നാലെ വരുന്നതു കണ്ടു.[a] അത്താഴസമയത്ത് യേശുവിന്റെ നെഞ്ചോടു ചാഞ്ഞുകിടന്ന്, “കർത്താവേ, അങ്ങയെ ഒറ്റിക്കൊടുക്കുന്നവൻ ആരാണ്?” എന്നു ചോദിച്ചതും ഈ ശിഷ്യനായിരുന്നു.[b]
