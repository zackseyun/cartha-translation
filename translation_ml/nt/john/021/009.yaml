id: JHN.21.9
reference: John 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: ml
  text: അങ്ങനെ അവർ കരയിലിറങ്ങിയപ്പോൾ[a], അവിടെ വെച്ചിരുന്ന ഒരു കനൽത്തീയും[b], അതിന്മേൽ കിടന്നിരുന്ന മീനും, അപ്പവും കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ കരയിലെത്തിയപ്പോൾ.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “അവർ നിലത്തേക്കിറങ്ങിയപ്പോൾ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “കനൽത്തീ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്കുപദം യോഹന്നാൻ 18:18-ലും ഉപയോഗിച്ചിട്ടുണ്ട്; പത്രോസ് നേരത്തേ യേശുവിനെ നിഷേധിച്ച സന്ദർഭവുമായി ഇത് പദപരമായ ബന്ധം സൃഷ്ടിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: അങ്ങനെ …പ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചനയും οὖν എന്നതിന്റെ ആഖ്യാനബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: കരയിലേക്കിറങ്ങി
  rationale: വള്ളത്തിൽനിന്ന് കരയിലേക്കിറങ്ങുന്ന പ്രവൃത്തി സന്ദർഭാനുസൃതമായി വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; γῆ എന്നതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: βλέπουσιν
  choice: കണ്ടു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനമാണ്; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: ἀνθρακιὰν
  choice: കനൽത്തീ
  rationale: കരിയോ കനലോ കത്തിച്ചുണ്ടാക്കിയ തീയെ സൂചിപ്പിക്കുന്ന പദം; യോഹന്നാൻ 18:18-ലെ സമാനപദബന്ധവും നിലനിർത്തുന്നു.
- source_word: κειμένην
  choice: ഒരുക്കിവെച്ചിരുന്ന
  rationale: തീ അവിടെ സജ്ജമാക്കി നിലനിന്നിരുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; വെറും ‘കിടന്നിരുന്ന’ എന്ന് തീയെ വിശേഷിപ്പിക്കുന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: ὀψάριον
  choice: മീൻ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഭക്ഷണമായ മീനാണ് സ്വാഭാവിക അർഥം. ഏകവചനരൂപമാണെങ്കിലും ‘ഒരു മീൻ’ എന്ന് നിർബന്ധിച്ച് എണ്ണം അമിതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐπικείμενον
  choice: അതിന്മേൽ കിടന്നിരുന്ന
  rationale: മീൻ കനൽത്തീയുടെ മുകളിൽ ഉണ്ടായിരുന്നുവെന്ന സ്ഥലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: ἄρτος എന്നതിന്റെ സാധാരണ അർഥം നൽകുന്നു; എണ്ണം, വലുപ്പം, രൂപം എന്നിവ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനം
  choice: βλέπουσιν എന്ന വർത്തമാനകാലരൂപം ‘കണ്ടു’ എന്ന ഭൂതകാലത്തിൽ നൽകി.
  alternative: ‘കാണുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തുക.
  rationale: ഇത് ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനം ചേർക്കാതെ, സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാള ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- issue: ἀνθρακιὰ എന്ന പദത്തിന്റെ യോഹന്നാൻ 18:18-നോടുള്ള ബന്ധം
  choice: രണ്ടിടത്തും ഉപയോഗിക്കാവുന്ന ‘കനൽത്തീ’ എന്ന പദം തിരഞ്ഞെടുത്തു.
  alternative: ‘തീ’ എന്ന് പൊതുവായി വിവർത്തനം ചെയ്യുക.
  rationale: പത്രോസിന്റെ നിഷേധസന്ദർഭത്തോടുള്ള യഥാർഥ പദബന്ധം വിവർത്തനത്തിൽ നഷ്ടപ്പെടാതിരിക്കാൻ പ്രത്യേക പദം നിലനിർത്തി; അതിന്റെ വ്യാഖ്യാനപ്രാധാന്യം മുഖ്യവാക്യത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കരയിലേക്കിറങ്ങി’, ‘ഒരുക്കിവെച്ചിരുന്ന’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; മൂലത്തിലെ നിർവചനാതീതമായ എണ്ണം അല്ലെങ്കിൽ ഭക്ഷണത്തിന്റെ പാകാവസ്ഥ അനാവശ്യമായി വ്യക്തമാക്കിയിട്ടില്ല.
