source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: ml
  text: പത്രോസ് ഏതുതരം മരണത്തിലൂടെ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുമെന്നു സൂചിപ്പിക്കാനാണ് യേശു ഇതു പറഞ്ഞത്.[a] ഇതു പറഞ്ഞശേഷം യേശു പത്രോസിനോടു പറയുന്നു:[b] “എന്നെ അനുഗമിക്കുക.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഏതു വിധത്തിലുള്ള മരണത്താൽ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ഇവിടെ ചരിത്രവർത്തമാനകാലമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: “പറയുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: സൂചിപ്പിക്കാനാണ്
  rationale: പ്രസ്താവനയിലൂടെ ഒരു കാര്യം പരോക്ഷമായി വ്യക്തമാക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൃതന്തത്തിന്റെ വിശദീകരണബന്ധവും നിലനിർത്തുന്നു.
- source_word: ποίῳ θανάτῳ
  choice: ഏതുതരം മരണത്തിലൂടെ
  rationale: ποίῳ എന്ന പദത്തിലെ ഗുണപരമായ ‘ഏതുതരം/ഏതു വിധത്തിലുള്ള’ എന്ന സൂക്ഷ്മതയും ദത്തിവിന്റെ മാർഗം/വിധം എന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: δοξάσει
  choice: മഹത്ത്വപ്പെടുത്തും
  rationale: ഭാവികാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിലെ പരോക്ഷപ്രസ്താവനയിൽ ഇംഗ്ലീഷിലേതുപോലുള്ള backshift ആവശ്യമില്ല.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: δοξάζω എന്ന ക്രിയയുടെ കർമമായി θεός എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: καὶ τοῦτο εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ മുൻകാലികബന്ധം സ്വാഭാവികവും വായനാസൗകര്യമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λέγει αὐτῷ
  choice: യേശു പത്രോസിനോടു പറയുന്നു
  rationale: ചരിത്രവർത്തമാനകാലമായ λέγει എന്നത് ‘പറയുന്നു’ എന്നു നിലനിർത്തുന്നു. മലയാളത്തിൽ ആവർത്തിച്ചുള്ള സർവനാമങ്ങൾ ആശയക്കുഴപ്പം ഉണ്ടാക്കുന്നതിനാൽ സന്ദർഭത്തിൽ വ്യക്തമായ പരാമർശികളെ പേരുകളാൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: ഉടൻ പിന്തുടരാനുള്ള ആഹ്വാനവും തുടർന്നുള്ള ശിഷ്യത്വഭാവവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കല്പനാരൂപം.
theological_decisions:
- issue: പത്രോസിന്റെ മരണം ‘ദൈവത്തെ മഹത്ത്വപ്പെടുത്തും’ എന്നതിന്റെ അർഥം
  choice: ‘ദൈവത്തെ മഹത്ത്വപ്പെടുത്തും’ എന്ന വാചകം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: പത്രോസിന്റെ രക്തസാക്ഷിത്വം വിശ്വസ്തസാക്ഷ്യത്തിലൂടെ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുമെന്ന് തുറന്നുപറയുക.
  rationale: പത്രോസിന്റെ മരണം ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുമെന്ന് വാക്യം പറയുന്നു; എന്നാൽ അത് എങ്ങനെ സംഭവിക്കുമെന്ന് ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തിക്കൊണ്ട് പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ യേശു, പത്രോസ് എന്നീ പരാമർശികൾ പേരുകളാൽ നൽകിയിരിക്കുന്നു. ഉറവിടത്തിൽ ഇല്ലാത്ത ഒരു തുടക്കകാലസൂചകമോ ‘ഇപ്പോൾ’ എന്ന പദമോ ചേർത്തിട്ടില്ല.
