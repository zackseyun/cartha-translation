id: JHN.21.8
reference: John 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: ml
  text: എന്നാൽ മറ്റു ശിഷ്യന്മാർ ചെറുവള്ളത്തിൽ കരയിലേക്കു വന്നു. അവർ കരയിൽനിന്ന് അധികം അകലെയായിരുന്നില്ല; ഏകദേശം ഇരുനൂറു മുഴം[a] മാത്രം അകലെയായിരുന്നു. അവർ മീനുകളുള്ള വല വലിച്ചുകൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇരുനൂറു മുഴം ഏകദേശം 90 മീറ്റർ വരും.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: എന്നാൽ മറ്റു ശിഷ്യന്മാർ
  rationale: δέ മുൻവാക്യത്തിൽ പത്രോസ് വേറിട്ട് പ്രവർത്തിച്ചതുമായുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: τῷ πλοιαρίῳ
  choice: ചെറുവള്ളത്തിൽ
  rationale: πλοιάριον എന്ന ലഘുരൂപത്തിന്റെ ചെറുതായ വള്ളം എന്ന സൂചന നിലനിർത്തുന്നു; ഗലീലക്കടലിലെ സാഹചര്യത്തിൽ ‘വള്ളം’ സ്വാഭാവികമാണ്.
- source_word: ἦλθον
  choice: കരയിലേക്കു വന്നു
  rationale: ἦλθον എന്നതിന് ‘വന്നു’ എന്നാണ് നേരിട്ടുള്ള അർഥം. മലയാളത്തിൽ ലക്ഷ്യം വ്യക്തമാക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ ‘കരയിലേക്ക്’ ചേർത്തു.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: അവർ കരയിൽനിന്ന് അധികം അകലെയായിരുന്നില്ല
  rationale: γάρ നൽകുന്ന വിശദീകരണം വാക്യബന്ധത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. വെള്ളത്തിന് എതിർവശമായ γῆ ഇവിടെ ‘കര’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭോചിതമാണ്.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: ഏകദേശം ഇരുനൂറു മുഴം മാത്രം അകലെയായിരുന്നു
  rationale: ὡς ഏകദേശ അളവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകദേശം’ ഉപയോഗിച്ചു. πῆχυς എന്ന പുരാതന അളവ് ‘മുഴം’ എന്നു നിലനിർത്തി; ‘മാത്രം’ οὐ...ἀλλά ഘടനയിലെ പരിമിതിദർശനം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σύροντες
  choice: വലിച്ചുകൊണ്ടുവന്നു
  rationale: വരുന്നതിനോടൊപ്പം നടന്ന തുടർച്ചയായ പ്രവർത്തനം വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘വലിച്ചുകൊണ്ടുവന്നു’ അത് സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: മീനുകളുള്ള വല
  rationale: ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തി വലയിൽ മീനുകൾ ഉണ്ടായിരുന്നുവെന്ന ഉള്ളടക്കബന്ധം സൂചിപ്പിക്കാം. ‘മീനുകൾ നിറഞ്ഞ വല’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ തുറന്നുപറയാത്ത നിറവ് ചേർക്കും; ‘മീനുകളുടെ വല’ മലയാളത്തിൽ അസ്വാഭാവികവും അർഥസന്ദിഗ്ധവുമാകാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുരാതന അളവായ ‘മുഴം’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ഇന്നത്തെ ഏകദേശ അളവ് അടിക്കുറിപ്പിൽ നൽകി. മൂലത്തിലെ നീണ്ട വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി.
