  source_fidelity: 'The translation accurately represents the Greek sequence and relationships: the other disciples came in the small boat; their proximity to shore explains this; the distance is approximate at two hundred cubits; and they were dragging the fish-containing net. “ചെറുവള്ളത്തിൽ,” “കരയിൽനിന്ന് അധികം അകലെയായിരുന്നില്ല,” and “മീനുകളുള്ള വല” are contextually faithful without adding that the net was explicitly “full” of fish.'
