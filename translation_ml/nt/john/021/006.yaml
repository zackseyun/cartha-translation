translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിൽ പറയാത്ത കർമത്തെ മുഖ്യവാചകത്തിൽ ‘മീൻ’ എന്നു ചേർത്ത് അതിവ്യക്തമാക്കിയിട്ടില്ല; അടിക്കുറിപ്പിൽ ആ സൂചന സംരക്ഷിച്ചു.
