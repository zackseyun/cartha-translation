source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “വള്ളത്തിന്റെ വലതുവശത്തേക്ക് വല ഇടുക; നിങ്ങൾക്കു കിട്ടും[a].” അതിനാൽ അവർ വല ഇട്ടു; മീനുകളുടെ ബാഹുല്യം കാരണം അതു വലിച്ചെടുക്കാൻ പിന്നെ അവർക്കു കഴിഞ്ഞില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കണ്ടെത്തും.” ഗ്രീക്കിൽ കാര്യവസ്തു വ്യക്തമാക്കിയിട്ടില്ല; മീൻപിടിത്തസന്ദർഭത്തിൽ മീനുകളാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: വല ഇടുക
  rationale: βάλλω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം മീൻപിടിത്തസന്ദർഭത്തിൽ വല വെള്ളത്തിലേക്കിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വല ഇടുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: വള്ളത്തിന്റെ വലതുവശത്ത്
  rationale: μέρη അക്ഷരാർഥത്തിൽ ഭാഗങ്ങൾ/പ്രദേശങ്ങൾ എന്നാണെങ്കിലും ഇവിടെ വള്ളത്തിന്റെ വലതുവശത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; നാവികസാങ്കേതികപദം ഒഴിവാക്കി ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: πλοίου
  choice: വള്ളം
  rationale: ഗലീലക്കടലിലെ മീൻപിടിത്തസന്ദർഭത്തിൽ πλοῖον എന്നതിന് ‘വള്ളം’ സാധാരണ മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: τὸ δίκτυον
  choice: വല
  rationale: മീൻപിടിക്കാനുള്ള ഏകവചനത്തിലുള്ള വലയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: εὑρήσετε
  choice: നിങ്ങൾക്കു കിട്ടും
  rationale: ഗ്രീക്കിൽ കർമം പ്രസ്താവിച്ചിട്ടില്ല. മീൻപിടിത്തസന്ദർഭത്തിൽ ‘നിങ്ങൾക്കു കിട്ടും’ എന്നത് കർമത്തെ അനാവശ്യമായി വ്യക്തമാക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: οὐκέτι
  choice: പിന്നെ ... ഇല്ല
  rationale: പിടിത്തത്തിനു ശേഷം സ്ഥിതി മാറിയതിനെ സൂചിപ്പിക്കുന്ന കാലപരമായ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἑλκύσαι
  choice: വലിച്ചുകയറ്റാൻ
  rationale: നിറഞ്ഞ വല വള്ളത്തിലേക്കു വലിച്ചുകയറ്റുന്ന ശാരീരികപ്രവൃത്തി സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἴσχυον
  choice: അവർക്കു കഴിഞ്ഞില്ല
  rationale: ഇവിടെ ἰσχύω ശക്തിയോ ശേഷിയോ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; നിഷേധത്തോടൊപ്പം ‘കഴിഞ്ഞില്ല’ എന്നത് സ്വാഭാവിക മലയാളമാണ്.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: മീനുകളുടെ പെരുപ്പം നിമിത്തം
  rationale: ἀπό ഇവിടെ കാരണാർത്ഥകമാണ്; πλῆθος വലിയ സംഖ്യ/പെരുപ്പം സൂചിപ്പിക്കുന്നു. ഈ രൂപം അർത്ഥവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
