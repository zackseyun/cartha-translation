source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “വരൂ, പ്രാതൽ കഴിക്കൂ[a].” എന്നാൽ ശിഷ്യന്മാരിൽ ആരുംതന്നെ അവനോട്, “നീ ആരാണ്?” എന്നു ചോദിക്കാൻ[b] ധൈര്യപ്പെട്ടില്ല; അവൻ കർത്താവാണെന്ന് അറിഞ്ഞുകൊണ്ട്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രാവിലത്തെ ഭക്ഷണം കഴിക്കൂ.” ഗ്രീക്ക് ക്രിയ രാവിലത്തെ ഭക്ഷണം കഴിക്കുന്നതിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ചോദിക്കുക” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് “ചോദിച്ചറിയുക” എന്നോ “സൂക്ഷ്മമായി അന്വേഷിക്കുക” എന്നോ അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: വരൂ
  rationale: ആളുകളെ അടുത്തേക്കു ക്ഷണിക്കുന്ന ആജ്ഞാരൂപമാണിത്; ആ നേരിട്ടുള്ള ക്ഷണം സ്വാഭാവികമായ മലയാളത്തിൽ ‘വരൂ’ എന്നു നൽകുന്നു.
- source_word: ἀριστήσατε
  choice: പ്രാതൽ കഴിക്കൂ
  rationale: രാവിലത്തെ ഭക്ഷണം കഴിക്കുന്നതിനെയാണ് ക്രിയ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; ‘പ്രാതൽ കഴിക്കൂ’ ആ സമയസൂചന നിലനിർത്തുന്നു.
- source_word: οὐδεὶς δὲ
  choice: എന്നാൽ ... ആരുംതന്നെ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വ്യത്യാസമോ ആഖ്യാനമാറ്റമോ ‘എന്നാൽ’ പ്രകടമാക്കുന്നു; οὐδείς എന്നതിന്റെ ഊന്നൽ ‘ആരുംതന്നെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐτόλμα
  choice: ധൈര്യപ്പെട്ടില്ല
  rationale: ചോദ്യം ഉന്നയിക്കാനുള്ള മനോധൈര്യമോ സന്നദ്ധതയോ ഉണ്ടായില്ലെന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: ἐξετάσαι
  choice: ചോദിക്കാൻ
  rationale: നേരിട്ടുള്ള ചോദ്യത്തോടുകൂടിയ ഈ സന്ദർഭത്തിൽ ‘ചോദിക്കാൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്; സൂക്ഷ്മമായി ചോദിച്ചറിയുക എന്ന ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Σὺ τίς εἶ;
  choice: നീ ആരാണ്?
  rationale: Σύ നൽകുന്ന വ്യക്തമായ ദ്വിതീയപുരുഷ ഊന്നൽ മലയാളത്തിലെ ‘നീ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰδότες ὅτι
  choice: അവൻ കർത്താവാണെന്ന് അറിഞ്ഞിരുന്ന ശിഷ്യന്മാർ
  rationale: പങ്കാളിക്രിയയെ ഒരു വിശേഷണബന്ധമായി നൽകുന്നത് അവരുടെ അറിവ് വ്യക്തമാക്കുന്നു; അതിനെ നിർബന്ധമായി കാരണബന്ധമാക്കി മാറ്റുന്നില്ല.
- source_word: ὁ κύριός
  choice: കർത്താവ്
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും ആഖ്യാനത്തിലെ തിരിച്ചറിയലും ‘കർത്താവ്’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പുനരുത്ഥാനാനന്തര പ്രത്യക്ഷതയുടെ ഈ സന്ദർഭത്തിൽ ‘കർത്താവ്’ ആഖ്യാനപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ അർഥം അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: εἰδότες എന്ന പങ്കാളിക്രിയയുടെ യുക്തിബന്ധം
  choice: അറിഞ്ഞിരുന്ന ശിഷ്യന്മാർ
  alternative: അറിഞ്ഞിരുന്നതിനാൽ
  rationale: ഗ്രീക്ക് പങ്കാളിക്രിയ കാരണാർഥത്തിൽ മനസ്സിലാക്കാനാകുമെങ്കിലും കാരണം എന്ന ബന്ധം വ്യാകരണത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; വിശേഷണബന്ധം ആ സാധ്യത അടച്ചുപൂട്ടാതെ അറിവിന്റെ പശ്ചാത്തലം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ആദരവുള്ളതുമായ ആഖ്യാനശൈലി. ‘പ്രാതൽ’ സമയസൂചന കൃത്യമായി നിലനിർത്തുന്നു; ‘നീ ആരാണ്?’ എന്ന നേരിട്ടുള്ള ചോദ്യം മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു. പങ്കാളിക്രിയയെ വ്യക്തമായ കാരണവാക്യമാക്കാതെ യഥാർഥത്തിലെ ബന്ധസാധ്യത തുറന്നുവെച്ചിരിക്കുന്നു.
