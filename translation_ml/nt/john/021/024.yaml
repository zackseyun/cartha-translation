revisions:
- from: ഈ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം പറയുകയും ഇവ എഴുതുകയും ചെയ്ത ശിഷ്യൻ ഇയാൾ തന്നെയാണ്[a]. അവന്റെ സാക്ഷ്യം സത്യമാണെന്ന് ഞങ്ങൾ അറിയുന്നു.
  to: ഈ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നവനും ഇവ എഴുതിയവനും ഈ ശിഷ്യനാണ്; അവന്റെ സാക്ഷ്യം സത്യമാണെന്ന് ഞങ്ങൾ അറിയുന്നു.[a]
  rationale: The revision retains the source’s ambiguous ‘we,’ its identification of the disciple, and its witness/testimony wordplay. It also represents the present participle ‘testifying’ and the completed act ‘having written’ distinctly, improves formal-register naturalness, and corrects the footnote’s Malayalam syntax.
