  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: ml
  text: ഈ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നവനും ഇവ എഴുതിയവനും ഈ ശിഷ്യനാണ്; അവന്റെ സാക്ഷ്യം സത്യമാണെന്ന് ഞങ്ങൾ അറിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഈ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നവനും ഇവ എഴുതിയവനും ഈ ശിഷ്യനാണ്; അവന്റെ സാക്ഷ്യം സത്യമാണ്.’ ഈ വാക്യത്തിൽ ഗ്രീക്കിൽ ‘സാക്ഷ്യം വഹിക്കുക/സാക്ഷ്യം’ എന്ന ഒരേ പദകുടുംബത്തിലെ പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: ഇയാൾ തന്നെയാണ്
  rationale: മുമ്പ് പരാമർശിച്ച ശിഷ്യനെ തിരിച്ചറിയിക്കുന്ന സൂചകസർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ μαθητὴς
  choice: ശിഷ്യൻ
  rationale: യേശുവിന്റെ അനുയായിയെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗത്തിന് മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം.
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം പറയുകയും
  rationale: വർത്തമാനകാല കൃതന്തത്തിന്റെ സ്വഭാവസവിശേഷമോ തുടരുന്നതോ ആയ സാക്ഷ്യപ്രവർത്തനം വ്യക്തമാക്കുന്നു; περὶ τούτων എന്നതിന്റെ സൂചനാബന്ധവും നിലനിർത്തുന്നു.
- source_word: ὁ γράψας ταῦτα
  choice: ഇവ എഴുതുകയും ചെയ്ത
  rationale: എഴുത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle മലയാളത്തിലെ സ്വാഭാവിക ബന്ധവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἴδαμεν
  choice: ഞങ്ങൾ അറിയുന്നു
  rationale: ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ബഹുവചനം അതിന്റെ വക്താക്കളെ നിർണ്ണയിക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀληθὴς
  choice: സത്യമാണ്
  rationale: സാക്ഷ്യത്തിന്റെ സത്യസ്വഭാവം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘വിശ്വസനീയം’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: അവന്റെ സാക്ഷ്യം
  rationale: ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും μαρτυρῶν/μαρτυρία എന്ന ഒരേ പദകുടുംബത്തിന്റെ ബന്ധം ‘സാക്ഷ്യം പറയുക/സാക്ഷ്യം’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഞങ്ങൾ അറിയുന്നു’ എന്നതിലെ വക്താക്കളുടെ തിരിച്ചറിയൽ
  choice: ഒന്നാംപുരുഷ ബഹുവചനം ‘ഞങ്ങൾ അറിയുന്നു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, വക്താക്കൾ ആരെന്ന് വ്യക്തമാക്കുന്നില്ല.
  alternative: സുവിശേഷകന്റെ സമ്പാദകസ്വരം എന്നോ പ്രിയശിഷ്യന്റെ സാക്ഷ്യം സ്ഥിരീകരിക്കുന്ന ഒരു സമൂഹം എന്നോ നിർണ്ണയിക്കുക.
  rationale: മൂലഗ്രീക്ക് വക്താക്കളെ തിരിച്ചറിയിക്കുന്നില്ല. കർത്തൃത്വത്തെയോ സമൂഹത്തെയോ സംബന്ധിച്ച അനിശ്ചിതത്വം പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സാക്ഷ്യം പറയുക/സാക്ഷ്യം’ എന്ന പദകുടുംബബന്ധം സംരക്ഷിച്ചിരിക്കുന്നു; ‘ഞങ്ങൾ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന അനിശ്ചിതത്വം മനപ്പൂർവം തുറന്നുവെച്ചിരിക്കുന്നു.
