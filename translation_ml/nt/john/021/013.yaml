id: JHN.21.13
reference: John 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: ml
  text: യേശു വന്ന് അപ്പം എടുത്ത് അവർക്കു കൊടുക്കുന്നു[a]; മീനും അതുപോലെതന്നെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യേശു വന്നു, അപ്പം എടുത്ത് അവർക്കു കൊടുത്തു.’ ഗ്രീക്കിൽ ഇവിടെ ആഖ്യാനവർത്തമാനകാലമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അതേവിധത്തിൽ മീനും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: വന്ന് … കൊടുക്കുന്നു
  rationale: ഗ്രീക്കിലെ ആഖ്യാനവർത്തമാനത്തിന്റെ സജീവത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമവിവരണം നൽകുന്നു; ‘വന്ന്’ എന്നത് അടുത്ത പ്രവർത്തനങ്ങളുമായി ക്രിയയെ ബന്ധിപ്പിക്കുന്നു.
- source_word: λαμβάνει
  choice: അപ്പം എടുത്ത്
  rationale: ഭക്ഷണം വിതരണം ചെയ്യുന്നതിനു മുമ്പുള്ള ലളിതമായ പ്രവർത്തനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘സ്വീകരിച്ച്’ എന്നതിനെക്കാൾ ‘എടുത്ത്’ സന്ദർഭോചിതമാണ്.
- source_word: τὸν ἄρτον
  choice: അപ്പം
  rationale: സന്ദർഭത്തിലുള്ള നിർദിഷ്ട അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രത്യേക ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ ‘അപ്പം’ എന്ന സ്വാഭാവിക രൂപം മതിയാകുന്നു.
- source_word: δίδωσιν αὐτοῖς
  choice: അവർക്കു കൊടുക്കുന്നു
  rationale: ഗ്രീക്കിലെ ദാനക്രിയയും പരോക്ഷകർമവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ‘വിളമ്പുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: τὸ ὀψάριον
  choice: മീൻ
  rationale: യോഹന്നാന്റെ ഈ സന്ദർഭത്തിൽ ഭക്ഷണമായ മീനിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘ചുട്ട മീൻ’ എന്ന അധികവിശദീകരണം മൂലപദം നിർബന്ധിക്കുന്നില്ല.
- source_word: ὁμοίως
  choice: അതുപോലെതന്നെ
  rationale: അപ്പത്തോടു ചെയ്തതുതന്നെ മീനോടും ചെയ്തുവെന്ന സംക്ഷിപ്ത സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ പ്രത്യക്ഷതാവിവരണത്തിലെ ആഖ്യാനവർത്തമാന ക്രിയകൾ
  choice: 'പ്രധാനക്രിയയെ വർത്തമാനകാലത്തിൽ നിലനിർത്തി: ‘കൊടുക്കുന്നു’'
  alternative: 'ഭൂതകാലത്തിലാക്കുക: ‘വന്നു, അപ്പം എടുത്ത് അവർക്കു കൊടുത്തു’'
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല; ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സജീവത നിലനിർത്താനുള്ള പരിഭാഷാതീരുമാനമാണ്. മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയ്ക്കായി മുൻക്രിയകൾ ‘വന്ന്’, ‘എടുത്ത്’ എന്ന ബന്ധകക്രിയാരൂപങ്ങളിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും അവസാനത്തെ അപൂർണക്രിയാസമാന്തരതയും ‘മീനും അതുപോലെതന്നെ’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
