  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: ml
  text: യേശു ചെയ്ത മറ്റു പല കാര്യങ്ങളും ഉണ്ട്. അവ ഓരോന്നായി എഴുതിയാൽ, എഴുതപ്പെടുന്ന പുസ്തകങ്ങളെ ലോകംതന്നെ ഉൾക്കൊള്ളാൻ കഴിയില്ലെന്നാണ് ഞാൻ കരുതുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എഴുതപ്പെടുമായിരുന്ന പുസ്തകങ്ങൾക്കു ലോകംതന്നെ ഇടം നൽകുകയില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ഇടം ഉണ്ടാകുക’ എന്നും ‘ഉൾക്കൊള്ളുക’ എന്നും അർഥമാകാം; കൃദന്തരൂപം സന്ദർഭാനുസൃതമായി ഭാവിഫലത്തെ സൂചിപ്പിക്കുന്ന രീതിയിലും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ഉണ്ട് (പ്രത്യേക ബന്ധകപദമില്ലാതെ)
  rationale: δὲ ഇവിടെ മൃദുവായ ആശയബന്ധമാണ്; മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ എന്നോ കാലസൂചകമായ ‘ഇപ്പോൾ’ എന്നോ ചേർക്കാതെ സ്വാഭാവികമായി തുടർച്ച നിലനിർത്തുന്നു.
- source_word: ἄλλα πολλὰ
  choice: മറ്റു പല കാര്യങ്ങളും
  rationale: യേശുവിന്റെ രേഖപ്പെടുത്തിയിട്ടില്ലാത്ത അനേകം പ്രവൃത്തികളെ വിശാലമായി സൂചിപ്പിക്കുകയും മലയാളത്തിന്റെ സ്വാഭാവിക പദക്രമം പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: യേശു ചെയ്ത
  rationale: ποιέω ഇവിടെ പ്രവൃത്തികളെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘ചെയ്ത’ എന്നത് ലളിതവും വ്യാപകവുമാണ്.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: അവ ഓരോന്നായി എഴുതിയാൽ
  rationale: സാങ്കൽപ്പിക നിബന്ധനയും καθ’ ἕν എന്നതിന്റെ വിതരണാർഥമായ ‘ഓരോന്നായി’ എന്ന ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: ലോകത്തിൽത്തന്നെ ... മതിയാകില്ല
  rationale: αὐτόν നൽകുന്ന ഊന്നൽ ‘-ത്തന്നെ’ വഴി പ്രകടമാക്കുന്നു; χωρέωയുടെ സ്ഥലപരമായ ദൃശ്യഭാവത്തിന് അനുയോജ്യമായ മലയാളവാക്യഘടന ഉപയോഗിക്കുന്നു.
- source_word: οἶμαι
  choice: എന്നാണ് ഞാൻ കരുതുന്നത്
  rationale: രചയിതാവിന്റെ വ്യക്തിപരവും ആലോചനാപരവുമായ ഇടക്കുറിപ്പ് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: χωρήσειν
  choice: ഇടം മതിയാകില്ല
  rationale: ‘സ്ഥലം ഉണ്ടാകുക/ഉൾക്കൊള്ളുക’ എന്നീ അർഥസാധ്യതകളിൽ സ്ഥലപരമായ അതിശയോക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ γραφόμενα βιβλία
  choice: എഴുതപ്പെടുന്ന പുസ്തകങ്ങൾ
  rationale: വർത്തമാന കർമണി കൃദന്തരൂപം കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; സാങ്കൽപ്പികമായി എഴുത്തിലൂടെ ഉണ്ടാകുന്ന പുസ്തകങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: പുസ്തകങ്ങളെ ഉൾക്കൊള്ളാനുള്ള ലോകത്തിന്റെ ശേഷിയെക്കുറിച്ചുള്ള വാചാലമായ അതിശയോക്തി
  choice: ലോകത്തിൽത്തന്നെ ഇടം മതിയാകില്ല
  alternative: എഴുതപ്പെടുമായിരുന്ന പുസ്തകങ്ങളെ ലോകംതന്നെ ഉൾക്കൊള്ളുകയില്ല
  rationale: ‘എണ്ണമറ്റ പുസ്തകങ്ങൾ’ എന്നു ലഘൂകരിക്കാതെ മൂലപാഠത്തിലെ ശക്തമായ അതിശയോക്തിയും സ്ഥലപരമായ ദൃശ്യവും നിലനിർത്തുന്നു; അതിനെ കർശനമായ അക്ഷരാർഥപ്രസ്താവനയായി വിശദീകരിക്കുകയും ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ലോകത്തിൽത്തന്നെ ഇടം മതിയാകില്ല’ എന്ന പ്രയോഗം മൂലത്തിലെ അതിശയോക്തി സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി എത്തിക്കുന്നു; വ്യക്തിപരമായ ‘ഞാൻ കരുതുന്നത്’ നിലനിർത്തിയിരിക്കുന്നു.
