  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: ml
  text: യേശു മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടശേഷം ശിഷ്യന്മാർക്കു വെളിപ്പെട്ടത് ഇത് ഇപ്പോൾ മൂന്നാം തവണയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യേശു മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടശേഷം ശിഷ്യന്മാർക്കു പ്രത്യക്ഷപ്പെട്ടത് ഇത് ഇപ്പോൾ മൂന്നാം തവണയായിരുന്നു.”
    reason: ἐφανερώθη എന്നതിന് സന്ദർഭത്തിൽ സാധ്യമായ കൂടുതൽ സ്വാഭാവികമായ പദവികൽപം നൽകുന്നു.
lexical_decisions:
- source_word: τοῦτο
  choice: ഇതോടെ
  rationale: ഇപ്പോൾ വിവരിച്ച പ്രത്യക്ഷപ്പെടൽ ഉൾപ്പെടെ എണ്ണം മൂന്നിലെത്തിയെന്ന മുൻവിവരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤδη τρίτον
  choice: മൂന്നാം തവണയായിരുന്നു
  rationale: ἤδη ഇവിടെ ആഖ്യാനത്തിലെ ഈ ഘട്ടത്തോടെ എണ്ണം മൂന്നായതായി സൂചിപ്പിക്കുന്നു; τρίτον ആവർത്തനക്രമം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗമാണ്.
- source_word: ἐφανερώθη
  choice: വെളിപ്പെട്ടത്
  rationale: φανερόω എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപവും യോഹന്നാനിലെ വെളിപ്പെടൽ എന്ന ആശയവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ 'പ്രത്യക്ഷപ്പെട്ടത്' എന്നും അർഥമാക്കാം.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാർക്ക്
  rationale: ഗ്രീക്കിലെ നിർദേശക വിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപം; മൂലത്തിൽ ഇല്ലാത്ത 'തന്റെ' ചേർക്കുന്നില്ല.
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  rationale: മുൻകാലികബന്ധവും നിഷ്ക്രിയവാചകവും സംരക്ഷിക്കുന്നു; ἐκ νεκρῶν എന്നത് അക്ഷരാർഥത്തിന് അടുത്തായി 'മരിച്ചവരിൽനിന്ന്' എന്നു നൽകുന്നു.
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶν എന്ന പുനരുത്ഥാനഭാഷയുടെ പരിഭാഷ
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  alternative: മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റശേഷം
  rationale: ഗ്രീക്ക് പങ്കുപദം നിഷ്ക്രിയമാണ്; അതിനാൽ കർത്തരി അർഥത്തിലേക്ക് മാറ്റാതെ മൂലഭാഷയുടെ വാചകം നിലനിർത്തുന്നു.
- issue: ἐφανερώθη എന്നതിലെ നിഷ്ക്രിയരൂപവും പ്രത്യക്ഷപ്പെടൽ എന്ന സന്ദർഭാർഥവും
  choice: വെളിപ്പെട്ടത്
  alternative: പ്രത്യക്ഷപ്പെട്ടത്
  rationale: മുഖ്യപാഠം നിഷ്ക്രിയരൂപവും യോഹന്നാന്റെ ശബ്ദപ്രയോഗവും കാത്തുസൂക്ഷിക്കുന്നു; സാധുവായ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. 'വെളിപ്പെട്ടത്' മൂലത്തിലെ നിഷ്ക്രിയരൂപം കാക്കുന്നു; 'ഇതോടെ' ἤδηയുടെ ആഖ്യാനപരമായ എണ്ണൽഭാവം സ്വാഭാവികമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
