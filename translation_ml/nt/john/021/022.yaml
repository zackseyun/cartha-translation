- from: 'യേശു അവനോട് പറഞ്ഞു: “ഞാൻ വരുന്നതുവരെ അവൻ നിലനിൽക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ[a], അതിൽ നിനക്കെന്ത്? നീ എന്നെ അനുഗമിക്കുക.”[b]'
