review_pass:
  verdict: revise
  source_fidelity: The conditional construction, the volitional sense of θέλω, the non-specific μένειν, the open-ended temporal clause, the rebuking idiom τί πρὸς σέ, and the emphatic command to Peter are all substantially represented. The wording does not decide what Jesus' coming denotes.
  naturalness: The main text is clear, dignified modern Malayalam. “നിലനിൽക്കുക” is somewhat formal but is a defensible non-interpretive equivalent for μένειν and preserves its broader Johannine resonance. The marker for the temporal-clause note should be placed directly after “ഞാൻ വരുന്നതുവരെ,” rather than after the final command.
  terminology: “യേശു,” “ആഗ്രഹിക്കുന്നെങ്കിൽ,” “നിലനിൽക്കുക,” and “അനുഗമിക്കുക” are appropriate for the intended register. Footnote a needs to distinguish the Greek verb's desire/wish sense from its possible volitional ‘will’ sense; its current wording merely supplies near-synonymous Malayalam terms.
  issues:
  - severity: low
    issue: Footnote b is not anchored at the phrase it explains.
    rationale: The note explicitly concerns “ഞാൻ വരുന്നതുവരെ,” but its marker follows the entire quotation after “അനുഗമിക്കുക.” Moving the marker makes the anchor precise without affecting meaning.
  - severity: medium
    issue: Footnote a does not accurately express the stated lexical alternative for θέλω.
    rationale: “ആഗ്രഹം” and “ഇച്ഛ” are near synonyms and do not convey that θέλω may also have a volitional sense (‘will’). The note should state this distinction while leaving the main rendering unchanged.
