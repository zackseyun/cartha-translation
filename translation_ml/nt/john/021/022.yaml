id: JHN.21.22
reference: John 21:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: ml
  text: 'യേശു അവനോട് പറഞ്ഞു: “ഞാൻ വരുന്നതുവരെ[b] അവൻ നിലനിൽക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നെങ്കിൽ[a], അതിൽ നിനക്കെന്ത്? നീ എന്നെ അനുഗമിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ നിലനിൽക്കണമെന്ന് ഞാൻ ഇച്ഛിക്കുന്നെങ്കിൽ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ആഗ്രഹിക്കുക’ എന്ന അർഥത്തിനുപുറമെ ‘ഇച്ഛിക്കുക/വേണമെന്നു തീരുമാനിക്കുക’ എന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഞാൻ വരുന്നതുവരെ” എന്നത് മനപ്പൂർവം തുറന്ന നിലയിൽ വിട്ടിരിക്കുന്നു; ഇത് യേശുവിന്റെ ചരിത്രത്തിലെ പിന്നീടുള്ള ഒരു വരവിനെയാണോ അന്തിമവരവിനെയാണോ സൂചിപ്പിക്കുന്നതെന്ന് വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐὰν
  choice: എങ്കിൽ
  rationale: സോപാധികമായ പ്രസ്താവനയുടെ സാങ്കൽപ്പിക സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: ആഗ്രഹത്തെയോ ഇച്ഛയെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് വ്യക്തവും ആധുനികവുമായ തുല്യപദം; ‘ഞാൻ ഇച്ഛിക്കുന്നു’ എന്നതും സാധ്യമാണ്.
- source_word: μένειν
  choice: നിലനിൽക്കുക
  rationale: യോഹന്നാനിലെ μένω എന്ന ക്രിയയുടെ വിശാലമായ അർത്ഥവും പദബന്ധവും സംരക്ഷിക്കുന്നു; ‘ജീവിച്ചിരിക്കുക’ എന്ന് വ്യാഖ്യാനിച്ച് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: ἕως ἔρχομαι
  choice: ഞാൻ വരുന്നതുവരെ
  rationale: വരവിന്റെ സ്വഭാവമോ സമയമോ നിർവചിക്കാതെ ഗ്രീക്കിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: τί πρὸς σέ;
  choice: അതിൽ നിനക്കെന്ത്?
  rationale: മറ്റൊരാളുടെ കാര്യത്തെക്കുറിച്ചുള്ള പത്രോസിന്റെ ആശങ്കയെ നേരിട്ട് തള്ളുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: σύ μοι ἀκολούθει
  choice: നീ എന്നെ അനുഗമിക്കുക
  rationale: പ്രകടമായ σύ നൽകുന്ന ‘നീ’ എന്ന ഊന്നലും ആജ്ഞയുടെ തുടർച്ചാസാധ്യതയും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: യേശു അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള കഥനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἕως ἔρχομαι എന്നതിലെ യേശുവിന്റെ ‘വരവ്’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ‘ഞാൻ വരുന്നതുവരെ’ എന്ന് പൊതുവായി വിവർത്തനം ചെയ്ത് സൂചന തുറന്നുവെച്ചു.
  alternative: പുനരുത്ഥാനാനന്തര പ്രത്യക്ഷത, യെരൂശലേമിന്മേലുള്ള ന്യായവിധി, അല്ലെങ്കിൽ അന്തിമവരവ് എന്നിങ്ങനെ പ്രത്യേകമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം തന്നേ വരവിന്റെ സൂചന വ്യക്തമാക്കുന്നില്ല; തുടർന്നുള്ള വാക്യവും ഈ പ്രസ്താവനയെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കരുതെന്ന് കാണിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘നിലനിൽക്കുക’ യോഹന്നാന്റെ പദപ്രയോഗബന്ധം സംരക്ഷിക്കുന്നു; ‘നീ’ എന്ന പ്രകടമായ സർവനാമം ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
