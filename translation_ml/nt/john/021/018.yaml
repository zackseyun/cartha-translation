  revision_rationale: 'ഒരു ചെറിയ ശൈലീപരവും പദാർഥപരവുമായ ഭേദഗതിയാണ് ആവശ്യമായത്: രണ്ടാമത്തെ ζώσει-യുടെ കർമം വ്യക്തിയാണെന്നത് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുകയും, ആദ്യ അരകെട്ടൽപ്രയോഗത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്തു. അർഥം, കാലഭാവം, ക്രൂശീകരണസൂചനയിലെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം, അടിക്കുറിപ്പ് ആങ്കറുകൾ എന്നിവ മാറ്റിയിട്ടില്ല.'
