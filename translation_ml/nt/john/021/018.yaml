id: JHN.21.18
reference: John 21:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: ml
  text: '“സത്യമായി, സത്യമായി, ഞാൻ നിന്നോടു പറയുന്നു: നീ ചെറുപ്പമായിരുന്നപ്പോൾ നീ തന്നെ വസ്ത്രം അരയിൽ മുറുക്കിക്കെട്ടി[a], ഇഷ്ടമുള്ളിടത്തേക്കു നടന്നുപോകുമായിരുന്നു. എന്നാൽ നീ വൃദ്ധനാകുമ്പോൾ നിന്റെ കൈകൾ നീട്ടും[b]; മറ്റൊരാൾ നിന്റെ അരയിൽ വസ്ത്രം മുറുക്കിക്കെട്ടുകയും നിനക്ക് ഇഷ്ടമില്ലാത്തിടത്തേക്കു നിന്നെ കൊണ്ടുപോകുകയും ചെയ്യും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ തന്നെ അരകെട്ടി.” ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ വസ്ത്രം അരയിൽ മുറുക്കിക്കെട്ടുന്നതിനെയോ അരകെട്ടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ പത്രോസിന്റെ മുൻകാല സ്വാതന്ത്ര്യവും പിന്നീടുള്ള ആശ്രിതാവസ്ഥയും തമ്മിൽ വൈരുധ്യമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: “കൈകൾ നീട്ടും” എന്നത് പത്രോസിന്റെ ക്രൂശുമരണത്തെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നു. പത്രോസ് ഏതു വിധത്തിലുള്ള മരണത്താൽ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുമെന്ന് സൂചിപ്പിക്കാനാണ് യേശു ഇതു പറഞ്ഞതെന്ന് അടുത്ത വാക്യം വിശദീകരിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: അഥവാ, “നിന്നെ നയിക്കും” / “നിന്നെ വഹിച്ചുകൊണ്ടുപോകും.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ അയാൾക്ക് ഇഷ്ടമില്ലാത്ത ലക്ഷ്യസ്ഥാനത്തേക്കു കൊണ്ടുപോകുക എന്ന ആശയം സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യോഹന്നാനിലെ ഊന്നലുള്ള ഇരട്ട പ്രയോഗം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും യോഹന്നാന്റെ വാക്യശൈലിയും അടുത്തായി സംരക്ഷിക്കുന്നു.
- source_word: ὅτε ἦς νεώτερος
  choice: നീ ചെറുപ്പമായിരുന്നപ്പോൾ
  rationale: νεώτερος സൂചിപ്പിക്കുന്ന, പിന്നീടുള്ള വാർധക്യത്തോടുള്ള താരതമ്യഭാവം സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐζώννυες σεαυτόν
  choice: നീ തന്നെ വസ്ത്രം അരയിൽ കെട്ടി
  rationale: ζώννυμι എന്നത് വസ്ത്രം അരയിൽ കെട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നു. പത്രോസിന്റെ മുൻകാല സ്വാതന്ത്ര്യവും പിന്നീടുള്ള ആശ്രിതാവസ്ഥയും തമ്മിലുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: ഇഷ്ടമുള്ളിടത്തേക്കു നടന്നുപോകുമായിരുന്നു
  rationale: ഇവിടെ περιπατέω ധാർമിക ജീവിതത്തിന്റെ രൂപകമല്ല, സാധാരണ സഞ്ചാരമാണ്; വ്യക്തിപരമായ സ്വാതന്ത്ര്യത്തിന്റെ ദൃശ്യവും നിലനിർത്തുന്നു.
- source_word: ὅταν δὲ γηράσῃς
  choice: എന്നാൽ നീ വൃദ്ധനാകുമ്പോൾ
  rationale: ഭാവിയെ ലക്ഷ്യമാക്കുന്ന ὅταν സഹിതമുള്ള ക്രിയയും δέ നൽകുന്ന മൃദുവായ വൈരുധ്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: നിന്റെ കൈകൾ നീട്ടും
  rationale: അടുത്ത വാക്യം നൽകുന്ന വ്യാഖ്യാനം മുൻകൂട്ടി മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ ദൃശ്യഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἄλλος σε ζώσει
  choice: മറ്റൊരാൾ നിന്റെ വസ്ത്രം അരയിൽ കെട്ടുകയും
  rationale: ആദ്യത്തെ ζώννυμι പ്രയോഗത്തോടുള്ള പദാർഥബന്ധം നിലനിർത്തി, സ്വയം വസ്ത്രം കെട്ടുന്നതിൽനിന്ന് മറ്റൊരാളുടെ നിയന്ത്രണത്തിലാകുന്നതിലേക്കുള്ള മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: οἴσει
  choice: നിന്നെ കൊണ്ടുപോകുകയും ചെയ്യും
  rationale: φέρω എന്ന ക്രിയയ്ക്ക് ‘വഹിക്കുക’, ‘കൊണ്ടുപോകുക’, ‘നയിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള അനിഷ്ടമായ നീക്കത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὅπου οὐ θέλεις
  choice: നിനക്ക് ഇഷ്ടമില്ലാത്തിടത്തേക്ക്
  rationale: ഗ്രീക്കിൽ ചലനക്രിയ ആവർത്തിക്കാത്തെങ്കിലും മലയാളത്തിൽ മുമ്പുള്ള ‘കൊണ്ടുപോകുക’ എന്ന ക്രിയയോടു ചേർന്ന് അനിഷ്ടമായ ലക്ഷ്യസ്ഥാനം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഈ വാക്കുകൾ ക്രൂശീകരണത്തെക്കുറിച്ചുള്ള പ്രവചനമാണെന്ന് മുഖ്യപാഠത്തിൽ തുറന്നുപറയണമോ
  choice: മുഖ്യപാഠത്തിൽ ദൃശ്യഭാഷ അതേപടി നിലനിർത്തുക
  alternative: ‘കൈകൾ നീട്ടും’, ‘മറ്റൊരാൾ അരകെട്ടും’ എന്നിവയെ ക്രൂശീകരണത്തിന്റെ വ്യക്തമായ വിവരണമായി പരിഭാഷപ്പെടുത്തുക
  rationale: അടുത്ത വാക്യമാണ് ഈ വാക്കുകൾ പത്രോസ് ഏതു വിധത്തിലുള്ള മരണത്താൽ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുമെന്ന് സൂചിപ്പിച്ചതായി വിശദീകരിക്കുന്നത്. അതിനാൽ യേശുവിന്റെ വാക്കുകളിൽ ആ വിശദീകരണം മുൻകൂട്ടി ചേർക്കാതെ പാഠത്തിന്റെ സ്വന്തം പുരോഗതിയും വ്യാഖ്യാനാത്മക സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ യേശുവിന്റെ ഗൗരവമുള്ള പ്രഖ്യാപനത്തിന് യോജിച്ച ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘സത്യമായി, സത്യമായി’ എന്ന ആവർത്തനവും ‘വസ്ത്രം അരയിൽ കെട്ടി’ എന്ന മൂർത്തമായ ദൃശ്യവും നിലനിർത്തി; അതേസമയം അസ്വാഭാവികമായ പഴയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
