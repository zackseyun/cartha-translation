  revised_text: '“സത്യമായി, സത്യമായി, ഞാൻ നിന്നോടു പറയുന്നു: നീ ചെറുപ്പമായിരുന്നപ്പോൾ നീ തന്നെ വസ്ത്രം അരയിൽ മുറുക്കിക്കെട്ടി[a], ഇഷ്ടമുള്ളിടത്തേക്കു നടന്നുപോകുമായിരുന്നു. എന്നാൽ നീ വൃദ്ധനാകുമ്പോൾ നിന്റെ കൈകൾ നീട്ടും[b]; മറ്റൊരാൾ നിന്റെ അരയിൽ വസ്ത്രം മുറുക്കിക്കെട്ടുകയും നിനക്ക് ഇഷ്ടമില്ലാത്തിടത്തേക്കു നിന്നെ കൊണ്ടുപോകുകയും ചെയ്യും[c].”'
