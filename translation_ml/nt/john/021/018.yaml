- from: '“സത്യമായി, സത്യമായി, ഞാൻ നിന്നോടു പറയുന്നു: നീ ചെറുപ്പമായിരുന്നപ്പോൾ നീ തന്നെ വസ്ത്രം അരയിൽ കെട്ടി[a], ഇഷ്ടമുള്ളിടത്തേക്കു നടന്നുപോകുമായിരുന്നു. എന്നാൽ നീ വൃദ്ധനാകുമ്പോൾ നിന്റെ കൈകൾ നീട്ടും[b]; മറ്റൊരാൾ നിന്റെ വസ്ത്രം അരയിൽ കെട്ടുകയും നിനക്ക് ഇഷ്ടമില്ലാത്തിടത്തേക്കു നിന്നെ കൊണ്ടുപോകുകയും ചെയ്യും[c].”'
  to: '“സത്യമായി, സത്യമായി, ഞാൻ നിന്നോടു പറയുന്നു: നീ ചെറുപ്പമായിരുന്നപ്പോൾ നീ തന്നെ വസ്ത്രം അരയിൽ മുറുക്കിക്കെട്ടി[a], ഇഷ്ടമുള്ളിടത്തേക്കു നടന്നുപോകുമായിരുന്നു. എന്നാൽ നീ വൃദ്ധനാകുമ്പോൾ നിന്റെ കൈകൾ നീട്ടും[b]; മറ്റൊരാൾ നിന്റെ അരയിൽ വസ്ത്രം മുറുക്കിക്കെട്ടുകയും നിനക്ക് ഇഷ്ടമില്ലാത്തിടത്തേക്കു നിന്നെ കൊണ്ടുപോകുകയും ചെയ്യും[c].”'
  rationale: 'ഒരു ചെറിയ ശൈലീപരവും പദാർഥപരവുമായ ഭേദഗതിയാണ് ആവശ്യമായത്: രണ്ടാമത്തെ ζώσει-യുടെ കർമം വ്യക്തിയാണെന്നത് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുകയും, ആദ്യ അരകെട്ടൽപ്രയോഗത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്തു. അർഥം, കാലഭാവം, ക്രൂശീകരണസൂചനയിലെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം, അടിക്കുറിപ്പ് ആങ്കറുകൾ എന്നിവ മാറ്റിയിട്ടില്ല.'
