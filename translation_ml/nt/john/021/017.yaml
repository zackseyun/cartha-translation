source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: ml
  text: 'യേശു മൂന്നാം പ്രാവശ്യം പത്രോസിനോടു ചോദിച്ചു[a]: “യോഹന്നാന്റെ മകനായ ശിമോനേ, നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” എന്ന് മൂന്നാം പ്രാവശ്യം തന്നോടു ചോദിച്ചതുകൊണ്ട് പത്രോസ് ദുഃഖിച്ചു. അവൻ യേശുവിനോടു പറഞ്ഞു: “കർത്താവേ, അങ്ങ് സകലവും അറിയുന്നു; ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങ് അറിയുന്നു[b].” യേശു അവനോടു പറഞ്ഞു: “എന്റെ ആടുകളെ മേയിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ യേശു φιλέω (‘സ്നേഹിക്കുക, വാത്സല്യം പുലർത്തുക’) എന്ന ക്രിയയാണ് ഉപയോഗിക്കുന്നത്; മുമ്പത്തെ രണ്ടു ചോദ്യങ്ങളിൽ അവൻ ἀγαπάω ഉപയോഗിച്ചിരുന്നു. ചിലർ ഈ മാറ്റത്തിൽ അർത്ഥവ്യത്യാസം കാണുന്നു; മറ്റുചിലർ ഈ സന്ദർഭത്തിൽ രണ്ടു ക്രിയകളുടെയും അർത്ഥങ്ങൾ തമ്മിൽ മൂടിച്ചേരുന്നതായി കാണുന്നു. മുഖ്യവാചകം രണ്ടിനും ‘സ്നേഹിക്കുക’ എന്നു നൽകി ഉറപ്പില്ലാത്ത മൂർച്ചയേറിയ വ്യത്യാസം ചുമത്തുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: പത്രോസിന്റെ മറുപടിയിൽ ‘അറിയുക’ എന്നതിന് οἶδα, γινώσκω എന്നീ രണ്ടു ഗ്രീക്ക് ക്രിയകളുണ്ട്. ഇവിടെ രണ്ടും സ്വാഭാവികമായി ‘അറിയുക’ എന്നു പരിഭാഷപ്പെടുത്താം; അവയ്ക്കിടയിൽ സൂക്ഷ്മഭേദം ഉണ്ടായേക്കാമെങ്കിലും, കൂടുതൽ വ്യാഖ്യാനം കൂടാതെ അത് മലയാളത്തിൽ വേർതിരിച്ചു കാണിക്കുന്നത് അർത്ഥം അതിരുകടന്ന് നിർണയിക്കാനിടയാക്കും.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: മൂന്നാം പ്രാവശ്യം
  rationale: ആവർത്തിച്ചുള്ള ചോദ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: Σίμων Ἰωάννου
  choice: യോഹന്നാന്റെ മകനായ ശിമോനേ
  rationale: ജനിറ്റീവ് പിതൃനാമസൂചകമാണ്; ഈ ഗ്രീക്ക് വായനയിൽ പേര് യോഹന്നാൻ എന്നാണ്.
- source_word: φιλεῖς / φιλῶ
  choice: സ്നേഹിക്കുന്നുവോ / സ്നേഹിക്കുന്നു
  rationale: φιλέω സൂചിപ്പിക്കുന്ന സ്നേഹവും വാത്സല്യവും മലയാളത്തിലെ പൊതുവും ഗൗരവമുള്ളതുമായ ‘സ്നേഹിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു; ἀγαπάωയുമായുള്ള വ്യത്യാസം മുഖ്യവാചകത്തിൽ അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: ἐλυπήθη
  choice: ദുഃഖിതനായി
  rationale: പത്രോസിന്റെ ദുഃഖവും മനോവേദനയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള പത്രോസിന്റെ ഗൗരവമുള്ള അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: πάντα σὺ οἶδας
  choice: അങ്ങ് സകലവും അറിയുന്നു
  rationale: πάνταയുടെ വ്യാപ്തിയും σὺയുടെ ഊന്നലും മാന്യമായ അഭിസംബോധനയോടെ സംരക്ഷിക്കുന്നു.
- source_word: οἶδας ... γινώσκεις
  choice: അറിയുന്നു ... അറിയുന്നു
  rationale: രണ്ടു ഗ്രീക്ക് ക്രിയകൾക്കും ഈ സന്ദർഭത്തിൽ ‘അറിയുക’ സ്വാഭാവികമാണ്; കൃത്രിമമായ അർത്ഥവ്യത്യാസം ചുമത്താതെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: Βόσκε
  choice: തീറ്റുക
  rationale: βόσκωയുടെ പ്രത്യേക അർത്ഥമായ ആഹാരം നൽകുക/മേയിക്കുക എന്ന ആശയം ποιμαίνω എന്ന ‘ഇടയപരിപാലനം’ എന്ന വിശാല ആശയത്തിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: πρόβατά
  choice: ആടുകളെ
  rationale: πρόβατα ആടുകളെയാണ് സൂചിപ്പിക്കുന്നത്; കുഞ്ഞാടുകളെന്നോ മുഴുവൻ ആട്ടിൻകൂട്ടമെന്നോ പ്രത്യേകീകരിക്കുന്നില്ല.
theological_decisions:
- issue: φιλέωയും ἀγαπάωയും തമ്മിലുള്ള വ്യത്യാസം മുഖ്യവാചകത്തിൽ മൂർച്ചയോടെ രേഖപ്പെടുത്തണമോ
  choice: φιλέωയെ ‘സ്നേഹിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി സ്നേഹത്തിന്റെ വേറിട്ട ഇനം നിർബന്ധമായി സൂചിപ്പിക്കാതിരിക്കുക
  alternative: ‘സ്നേഹിക്കുക’ എന്നും ‘ഇഷ്ടപ്പെടുക/വാത്സല്യമുണ്ടാകുക’ എന്നും വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിക്കുക
  rationale: കൊയ്നേ ഗ്രീക്കിൽ ഇവയുടെ അർത്ഥമേഖലകൾ തമ്മിൽ മൂടിച്ചേരുന്നു; ഈ സന്ദർഭത്തിലെ ശൈലീവ്യത്യാസത്തിന് ദൈവശാസ്ത്രപരമായ നിർണായക ഭേദം ചുമത്താൻ ഭാഷാപരമായ തെളിവ് മതിയാകുന്നില്ല. സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ‘അങ്ങ് സകലവും അറിയുന്നു’ എന്ന പത്രോസിന്റെ പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: വാചകത്തിന്റെ ശക്തി കുറയ്ക്കാതെ ‘അങ്ങ് സകലവും അറിയുന്നു’ എന്നു നൽകുക
  alternative: ‘ഈ കാര്യത്തെക്കുറിച്ച് എല്ലാം അങ്ങ് അറിയുന്നു’ എന്നു സന്ദർഭത്തിലേക്ക് ചുരുക്കുക, അല്ലെങ്കിൽ സർവജ്ഞതയെക്കുറിച്ചുള്ള വിശദീകരണം ചേർക്കുക
  rationale: ഗ്രീക്ക് നേരിട്ട് πάντα എന്നു പറയുന്നു. പരിഭാഷ അതിനെ ചുരുക്കുകയോ ഉപദേശപരമായ വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കുകയോ ചെയ്യാതെ അതേ വ്യാപ്തിയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ മാന്യമായ ‘അങ്ങ്/അങ്ങയെ’ ഉപയോഗിച്ചു. വിവരണഭാഗത്ത് ‘അവൻ’ നിലനിർത്തി; വ്യക്തതയ്ക്കായി ആദ്യ വാക്യത്തിൽ ‘പത്രോസിനോടു’ എന്നും മറുപടിയിൽ ‘യേശുവിനോടു’ എന്നും വ്യക്തനാമങ്ങൾ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
