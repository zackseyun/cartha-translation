  to: 'യേശു മൂന്നാം പ്രാവശ്യം പത്രോസിനോടു ചോദിച്ചു[a]: “യോഹന്നാന്റെ മകനായ ശിമോനേ, നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” “നീ എന്നെ സ്നേഹിക്കുന്നുവോ?” എന്ന് മൂന്നാം പ്രാവശ്യം തന്നോടു ചോദിച്ചതുകൊണ്ട് പത്രോസ് ദുഃഖിച്ചു. അവൻ യേശുവിനോടു പറഞ്ഞു: “കർത്താവേ, അങ്ങ് സകലവും അറിയുന്നു; ഞാൻ അങ്ങയെ സ്നേഹിക്കുന്നുവെന്ന് അങ്ങ് അറിയുന്നു[b].” യേശു അവനോടു പറഞ്ഞു: “എന്റെ ആടുകളെ മേയിക്കുക.”'
