id: JHN.21.10
reference: John 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “നിങ്ങൾ ഇപ്പോൾ പിടിച്ച മീനുകളിൽനിന്ന് കുറെ കൊണ്ടുവരൂ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “നിങ്ങൾ ഇപ്പോൾ പിടിച്ച മീനുകളിൽനിന്ന് കൊണ്ടുവരൂ.”'
    reason: ἀπὸ τῶν ὀψαρίων എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ ഔപചാരികവും പദാനുപദവുമായ രൂപം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ വിവർത്തനം ചെയ്തു.
- source_word: Ἐνέγκατε
  choice: കൊണ്ടുവരൂ
  rationale: φέρω എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപമാണ്; മീനുകൾ യേശുവിന്റെ അടുത്തേക്കു കൊണ്ടുവരാനുള്ള നേരിട്ടുള്ള കല്പന സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: മീനുകളിൽ കുറെ
  rationale: ἀπόയും ജനിറ്റീവ് രൂപവും ചേർന്ന് മുഴുവൻ പിടിത്തത്തിൽനിന്നുള്ള ഒരു ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘മീനുകളിൽ കുറെ’ എന്നത് ആ ഭാഗിക അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὀψαρίων
  choice: മീനുകൾ
  rationale: സന്ദർഭം കടലിൽനിന്ന് അപ്പോൾ പിടിച്ച മീനുകളെക്കുറിച്ചാണ്; വലിപ്പമോ പാകം ചെയ്ത നിലയോ അനാവശ്യമായി നിർണ്ണയിക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὧν ἐπιάσατε
  choice: നിങ്ങൾ ... പിടിച്ച
  rationale: ബന്ധവാക്യം ഏതു മീനുകളാണെന്ന് തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ ഭൂതകാലരൂപം സ്വാഭാവികമാണ്.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: പിടിത്തം ഇപ്പോൾത്തന്നെ നടന്നതാണെന്ന സമയസമീപ്യം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. കല്പനയുടെ നേരിട്ടുള്ള സ്വരം നിലനിർത്തിക്കൊണ്ട് ഭാഗികത ‘കുറെ’ എന്നു വ്യക്തമാക്കി.
