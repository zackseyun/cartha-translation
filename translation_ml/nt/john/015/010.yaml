revisions:
- from: നിങ്ങൾ എന്റെ കല്പനകൾ പാലിച്ചാൽ, എന്റെ സ്നേഹത്തിൽ നിലനിൽക്കും; ഞാൻ എന്റെ പിതാവിന്റെ കല്പനകൾ പാലിച്ച് അവിടുത്തെ സ്നേഹത്തിൽ നിലനിൽക്കുന്നതുപോലെതന്നെ.
  to: നിങ്ങൾ എന്റെ കൽപ്പനകൾ പാലിച്ചാൽ, എന്റെ സ്നേഹത്തിൽ നിലനിൽക്കും; ഞാൻ എന്റെ പിതാവിന്റെ കൽപ്പനകൾ പാലിച്ചിരിക്കുകയും അവിടുത്തെ സ്നേഹത്തിൽ നിലനിൽക്കുകയും ചെയ്യുന്നതുപോലെതന്നെ.
