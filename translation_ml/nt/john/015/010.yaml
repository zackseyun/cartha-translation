id: JHN.15.10
reference: John 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ കൽപ്പനകൾ പാലിച്ചാൽ, എന്റെ സ്നേഹത്തിൽ നിലനിൽക്കും; ഞാൻ എന്റെ പിതാവിന്റെ കൽപ്പനകൾ പാലിച്ചിരിക്കുകയും അവിടുത്തെ സ്നേഹത്തിൽ നിലനിൽക്കുകയും ചെയ്യുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: —ആൽ
  rationale: ഉപവാക്യത്തിലെ സാധ്യതയോടുകൂടിയ യഥാർഥ വ്യവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ആവർത്തനാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐντολάς
  choice: കല്പനകൾ
  rationale: അധികാരപൂർവമായ ആജ്ഞകളെന്ന അർഥം നിലനിർത്തുകയും യോഹന്നാന്റെ പ്രയോഗത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: τηρήσητε / τετήρηκα
  choice: പാലിച്ചാൽ / പാലിച്ച്
  rationale: കല്പനകളെ അനുസരണയോടെ കാത്തുപോരുക എന്ന τηρέωയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഒരേ ക്രിയയുടെ ആവർത്തനം വിവർത്തനത്തിലും നിലനിർത്തുന്നു. രണ്ടാം പ്രയോഗത്തിലെ ഗ്രീക്ക് perfect സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന പ്രസക്തി, പിന്നാലെയുള്ള ‘നിലനിൽക്കുന്നതുപോലെ’ എന്ന വർത്തമാനബന്ധത്തിൽ പ്രകടമാകുന്നു.
- source_word: μενεῖτε / μένω
  choice: നിലനിൽക്കും / നിലനിൽക്കുന്നു
  rationale: യോഹന്നാനിലെ പ്രധാന പദമായ μένωയുടെ ബന്ധപരമായ തുടർച്ചയും രണ്ടു പ്രയോഗങ്ങളിലുമുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ ἀγάπῃ μου
  choice: എന്റെ സ്നേഹത്തിൽ
  rationale: ‘സ്നേഹത്തിനുള്ളിൽ’ എന്ന ബന്ധമേഖലയുടെ യോഹന്നാനീയ രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: καθὼς
  choice: —പോലെതന്നെ
  rationale: ശിഷ്യരുടെ അനുസരണവും യേശുവിന്റെ മാതൃകയും തമ്മിലുള്ള വ്യക്തമായ താരതമ്യം അടയാളപ്പെടുത്തുന്നു.
- source_word: τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: ദൈവിക പിതാവുമായുള്ള യേശുവിന്റെ വ്യക്തിബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: αὐτοῦ
  choice: അവിടുത്തെ
  rationale: ഉടൻ മുമ്പുള്ള ‘എന്റെ പിതാവ്’ എന്ന പരാമർശത്തിലേക്കാണ് സർവനാമം ചൂണ്ടുന്നത്; ദൈവത്തെ സൂചിപ്പിക്കുന്ന മാന്യവും സാധാരണവുമായ മലയാള സർവനാമരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അനുസരണവും യേശുവിന്റെ സ്നേഹത്തിൽ നിലനിൽക്കുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: വാക്യത്തിലെ വ്യവസ്ഥാബന്ധം നേരിട്ട് നിലനിർത്തി.
  alternative: അനുസരണം സ്നേഹം സമ്പാദിക്കുന്ന മാർഗമാണെന്നോ, വ്യവസ്ഥയ്ക്ക് യഥാർഥ ബലമില്ലാതെ അത് വെറും തെളിവാണെന്നോ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം യഥാർഥമായ ഒരു വ്യവസ്ഥയും യേശുവിന്റെ സ്വന്തം മാതൃകയുമായുള്ള താരതമ്യവും അവതരിപ്പിക്കുന്നു; എന്നാൽ യോഗ്യത, രക്ഷാനഷ്ടം, സ്ഥിരോത്സാഹം തുടങ്ങിയ വിശാലമായ സിദ്ധാന്തചോദ്യങ്ങൾ ഇവിടെ തീർപ്പാക്കുന്നില്ല.
- issue: ἀγάπη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സ്നേഹം
  alternative: കാരുണ്യം / പ്രേമം
  rationale: സന്ദർഭത്തിലെ വ്യക്തിബന്ധവും യോഹന്നാനീയ പദബന്ധവും സ്വാഭാവികവും മതവിഭാഗനിരപേക്ഷവുമായി നൽകുന്ന ആധുനിക മലയാളപദമാണ് ‘സ്നേഹം’.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിലനിൽക്കുക’ എന്ന ആവർത്തനം യോഹന്നാന്റെ ആശയപദബന്ധം മനപ്പൂർവം സംരക്ഷിക്കുന്നു. വാക്യത്തിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ആവശ്യമില്ല.
