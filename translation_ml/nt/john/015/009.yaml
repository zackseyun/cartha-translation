source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: ml
  text: പിതാവ് എന്നെ സ്നേഹിച്ചിരിക്കുന്നതുപോലെ[a] ഞാനും നിങ്ങളെ സ്നേഹിച്ചിരിക്കുന്നു. എന്റെ സ്നേഹത്തിൽ നിലനിൽക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പിതാവ് എന്നെ സ്നേഹിച്ചതുപോലെ ഞാനും നിങ്ങളെ സ്നേഹിച്ചു. എന്റെ സ്നേഹത്തിൽ നിലനിൽക്കുക.” ഗ്രീക്കിൽ അയോറിസ്റ്റ് ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവയെ ലളിതഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്താം. സന്ദർഭത്തിൽ ആ സ്നേഹത്തിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി പ്രകടമാക്കാനാണ് മുഖ്യപാഠത്തിൽ “സ്നേഹിച്ചിരിക്കുന്നു” എന്നു നൽകിയിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: സ്നേഹിച്ചിരിക്കുന്നതുപോലെ
  rationale: പിതാവിന്റെ യേശുവിനോടുള്ള സ്നേഹവും യേശുവിന്റെ ശിഷ്യരോടുള്ള സ്നേഹവും തമ്മിലുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἠγάπησέν
  choice: സ്നേഹിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ അയോറിസ്റ്റ് ഭൂതകാലമായി പരിഭാഷപ്പെടുത്താനാകുമെങ്കിലും, ഈ സന്ദർഭത്തിൽ ആ സ്നേഹത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി അറിയിക്കാൻ മലയാളത്തിലെ ഈ രൂപം യോജിക്കുന്നു.
- source_word: ὁ πατήρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ദൈവത്തെ യേശുവിന്റെ പിതാവായി സൂചിപ്പിക്കുന്ന സ്ഥാനനാമപരമായ പ്രയോഗം മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: ബന്ധകവും ഊന്നലും ഒരുമിച്ച് നിലനിർത്തി, പിതാവിന്റെ സ്നേഹത്തോടുള്ള താരതമ്യപരമായ correspondance വ്യക്തമാക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കർമരൂപം മലയാളത്തിൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἠγάπησα
  choice: സ്നേഹിച്ചിരിക്കുന്നു
  rationale: ആദ്യ ക്രിയയോടുള്ള സമാന്തരത നിലനിർത്തുകയും യേശുവിന്റെ സ്നേഹത്തിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: μείνατε
  choice: നിലനിൽക്കുക
  rationale: യോഹന്നാനിലെ μένω എന്ന പ്രധാന ആശയം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; വെറും താൽക്കാലികമായി താമസിക്കുക എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: എന്റെ സ്നേഹത്തിൽ
  rationale: ഉടമസ്ഥതാസൂചകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ച് ἀγάπηയെ ‘സ്നേഹം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἀγάπη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സ്നേഹം
  alternative: കാരുണ്യം
  rationale: ‘സ്നേഹം’ എന്നത് ഇവിടെ വ്യക്തിബന്ധപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘കാരുണ്യം’ പദത്തിന്റെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കും.
- issue: ἠγάπησέν / ἠγάπησα എന്നീ അയോറിസ്റ്റ് ക്രിയകളുടെ കാല-ദൃഷ്ട്യർഥം
  choice: സ്നേഹിച്ചിരിക്കുന്നു / സ്നേഹിച്ചിരിക്കുന്നു
  alternative: സ്നേഹിച്ചു / സ്നേഹിച്ചു
  rationale: ഗ്രീക്ക് അയോറിസ്റ്റിനെ ലളിതഭൂതകാലമായി നൽകാൻ കഴിയുമെങ്കിലും, പ്രസംഗസന്ദർഭത്തിൽ പിതാവിന്റെയും പുത്രന്റെയും സ്നേഹത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിലെ പൂർണഭൂതകാലസദൃശ രൂപം നന്നായി അറിയിക്കുന്നു; ലളിതഭൂതകാലസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിലനിൽക്കുക’ എന്ന പ്രയോഗം യോഹന്നാനിലെ ആവർത്തിതമായ μένω ആശയം സംരക്ഷിക്കുന്നു. രണ്ടാം പുരുഷ ബഹുവചനം ‘നിങ്ങൾ’ രൂപത്തിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു.
