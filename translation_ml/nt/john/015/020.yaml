id: JHN.15.20
reference: John 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറഞ്ഞ വാക്ക് ഓർക്കുക: ‘അടിമ തന്റെ യജമാനനെക്കാൾ വലിയവനല്ല.’ അവർ എന്നെ പീഡിപ്പിച്ചെങ്കിൽ, നിങ്ങളെയും പീഡിപ്പിക്കും; അവർ എന്റെ വാക്ക് അനുസരിച്ചെങ്കിൽ[a], നിങ്ങളുടെ വാക്കും അനുസരിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “കാത്തുസൂക്ഷിച്ചെങ്കിൽ”: ഇവിടെ യേശുവിന്റെ വാക്ക് സ്വീകരിച്ച് അതനുസരിച്ച് ജീവിക്കുക എന്ന ആശയവും ഉൾപ്പെടാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർന്നുനിൽക്കുന്ന ഓർമപ്പെടുത്തൽ സ്വാഭാവികമായ മലയാള ആജ്ഞാരൂപത്തിൽ നൽകുന്നു.
- source_word: λόγου
  choice: വാക്ക്
  rationale: ഇവിടെ യേശു മുമ്പ് പറഞ്ഞ പ്രത്യേക വചനത്തെയും തുടർന്ന് അവന്റെ സന്ദേശത്തെയും സൂചിപ്പിക്കുന്നു; ആവർത്തനവും യോഹന്നാനീയ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: κύριος എന്ന യജമാനനോടുള്ള അധീനസ്ഥാനമാണ് പഴഞ്ചൊല്ലിന്റെ കേന്ദ്രം; അതിനാൽ ‘ദാസൻ’ എന്നതിനെക്കാൾ ബന്ധിതവും കീഴിലുള്ളതുമായ സ്ഥാനം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: μείζων
  choice: വലിയവൻ
  rationale: പദവി, പ്രാധാന്യം, മേന്മ എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ താരതമ്യത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: യജമാനൻ
  rationale: ഇവിടെ ദൈവിക ബിരുദമല്ല, അടിമയുടെ മേൽ അധികാരമുള്ള വ്യക്തിയാണ്; ‘അടിമ—യജമാനൻ’ എന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐδίωξαν / διώξουσιν
  choice: പീഡിപ്പിച്ചെങ്കിൽ / പീഡിപ്പിക്കും
  rationale: യേശുവിനും ശിഷ്യന്മാർക്കും നേരെയുള്ള വൈരപരമായ ഉപദ്രവമാണ് സന്ദർഭത്തിലെ അർഥം.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: അനുസരിച്ചെങ്കിൽ / അനുസരിക്കും
  rationale: വാക്ക് സ്വീകരിക്കുകയും അതനുസരിച്ച് ജീവിക്കുകയും ചെയ്യുന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘കാത്തു’ എന്ന അക്ഷരാർഥം ഇവിടെ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: എന്റെ വാക്ക് ... നിങ്ങളുടേതും
  rationale: യേശുവിന്റെ വാക്കും ശിഷ്യന്മാരുടെ പ്രഘോഷണവും തമ്മിലുള്ള സമാന്തരത ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന പദത്തിന്റെ സാമൂഹിക-സ്ഥാനപരമായ അർഥം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈ ചൊല്ലിന്റെ ശക്തി δοῦλος-κύριος ബന്ധത്തിലെ അസമത്വത്തിലാണ്; ‘അടിമ’ അത് മറച്ചുവയ്ക്കാതെ പ്രകടമാക്കുന്നു.
- issue: κύριος എന്ന പദത്തിന്റെ സന്ദർഭോചിത വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ്
  rationale: ഇവിടെ ക്രിസ്തുശാസ്ത്രപരമായ ബിരുദമല്ല, അടിമയുടെ മേലധികാരിയെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- issue: τηρέω എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: അനുസരിക്കുക
  alternative: കാത്തുസൂക്ഷിക്കുക / പാലിക്കുക
  rationale: യോഹന്നാനിൽ സന്ദേശം സ്വീകരിക്കുകയും അനുസരിക്കുകയും ചെയ്യുന്നതിന്റെ ആശയം ഉൾപ്പെടുന്നു. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘അനുസരിക്കുക’ എടുത്ത് വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വ്യവസ്ഥാപരമായ സമാന്തരഘടനയും ‘എന്റെ വാക്ക്—നിങ്ങളുടേത്’ എന്ന ബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
