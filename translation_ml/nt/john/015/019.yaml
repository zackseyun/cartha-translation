  to: നിങ്ങൾ ലോകത്തിൽനിന്നുള്ളവരായിരുന്നെങ്കിൽ, ലോകം സ്വന്തമായതിനെ സ്നേഹിക്കുമായിരുന്നു.[a] എന്നാൽ, നിങ്ങൾ ലോകത്തിൽനിന്നുള്ളവർ അല്ല; മറിച്ച്, ഞാൻ നിങ്ങളെ ലോകത്തിൽനിന്ന് തിരഞ്ഞെടുത്തു. അതുകൊണ്ടാണ് ലോകം നിങ്ങളെ വെറുക്കുന്നത്.
