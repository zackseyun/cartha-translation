reference: John 15:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: ml
  text: നിങ്ങൾ ലോകത്തിൽനിന്നുള്ളവരായിരുന്നെങ്കിൽ, ലോകം സ്വന്തമായതിനെ സ്നേഹിക്കുമായിരുന്നു.[a] എന്നാൽ, നിങ്ങൾ ലോകത്തിൽനിന്നുള്ളവർ അല്ല; മറിച്ച്, ഞാൻ നിങ്ങളെ ലോകത്തിൽനിന്ന് തിരഞ്ഞെടുത്തു. അതുകൊണ്ടാണ് ലോകം നിങ്ങളെ വെറുക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ആവർത്തിച്ചുവരുന്ന ‘ലോകത്തിൽനിന്ന്’ (ἐκ τοῦ κόσμου) എന്ന പ്രയോഗത്തിന് ‘ലോകത്തിന്റേതായ’ അഥവാ ‘ലോകത്തോടു ചേർന്ന’ എന്ന ബന്ധഭാവവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: ലോകത്തിൽനിന്നുള്ളവർ / ലോകത്തിൽനിന്ന്
  rationale: ἐκ എന്നത് ഉറവിടത്തെയും ബന്ധത്തെയും സൂചിപ്പിക്കാം. ആദ്യ രണ്ടു പ്രയോഗങ്ങളിൽ ‘ലോകത്തിൽനിന്നുള്ളവർ’ എന്നത് ഈ രണ്ടു ഭാവങ്ങളും സ്വാഭാവികമായി നിലനിർത്തുന്നു; ἐξελεξάμην ഒപ്പമുള്ള മൂന്നാമത്തെ പ്രയോഗത്തിൽ ‘ലോകത്തിൽനിന്ന് തിരഞ്ഞെടുത്തു’ വേർതിരിച്ചെടുക്കൽ എന്ന സന്ദർഭഭാവം വ്യക്തമാക്കുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ വിശാലമായ ധാർമിക-ആത്മീയ അർഥപരിധി നിലനിർത്തുകയും ‘ലോകവ്യവസ്ഥ’ പോലുള്ള വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἂν ... ἐφίλει
  choice: സ്നേഹിക്കുമായിരുന്നു
  rationale: യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധനയുടെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸ ἴδιον
  choice: സ്വന്തമായതിനെ
  rationale: ‘സ്വന്തം ആളുകളെ’ എന്നു വ്യക്തികളെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാതെ ഗ്രീക്കിലെ നപുംസക ഏകവചനത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: φιλέω
  choice: സ്നേഹിക്കുക
  rationale: μισέω എന്നതുമായുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὅτι δὲ
  choice: എന്നാൽ ... ആയതിനാൽ
  rationale: δέയുടെ വൈരുധ്യവും ὅτιയുടെ കാരണഭാവവും മലയാള വാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξελεξάμην
  choice: ഞാൻ ... തിരഞ്ഞെടുത്തു
  rationale: തിരഞ്ഞെടുക്കുക എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു; മധ്യമവാചകത്തിൽനിന്ന് ‘എനിക്കായി’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: διὰ τοῦτο
  choice: ആയതിനാൽ
  rationale: ലോകത്തിന്റെ വെറുപ്പിനുള്ള കാരണബന്ധം വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി മുൻവാക്യവുമായി ചേർക്കുന്നു.
- source_word: μισεῖ
  choice: വെറുക്കുന്നു
  rationale: വർത്തമാനകാലത്തെ തുടർച്ചയായ യാഥാർഥ്യമായി ലളിതവും ശക്തവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിലെ ‘ലോകം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ലോകം’ എന്നു നിലനിർത്തി.
  alternative: ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യസമൂഹം / ലോകവ്യവസ്ഥ
  rationale: ഇവിടെ ‘ലോകം’ യേശുവിനോട് എതിർപ്പുള്ള ധാർമിക-ആത്മീയ മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, അതിനെ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ യോഹന്നാന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ പദം സംരക്ഷിക്കുന്നു.
- issue: ἐξελεξάμην എന്ന തിരഞ്ഞെടുപ്പിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന
  choice: ‘ഞാൻ നിങ്ങളെ ... തിരഞ്ഞെടുത്തു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പിന്നീടുള്ള മുൻനിർണയ സിദ്ധാന്തങ്ങളുമായി ബന്ധപ്പെടുത്തി കൂടുതൽ ഭാരമുള്ള പദപ്രയോഗം ഉപയോഗിക്കുക
  rationale: വാക്യം യേശു ശിഷ്യരെ തിരഞ്ഞെടുത്തതായി വ്യക്തമായി പറയുന്നു; എന്നാൽ ക്രിസ്തീയ പാരമ്പര്യങ്ങൾക്കിടയിലെ തിരഞ്ഞെടുപ്പുസംബന്ധമായ തർക്കങ്ങൾ ഇവിടെത്തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ ‘ലോകം’ എന്ന ആവർത്തനം നിലനിർത്തി. ‘സ്വന്തമായതിനെ’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ പൊതുമ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആശയത്തിനു ശേഷം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
