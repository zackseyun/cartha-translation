id: JHN.15.24
reference: John 15:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: ml
  text: മറ്റാരും ചെയ്യാത്ത പ്രവൃത്തികൾ ഞാൻ അവരുടെ ഇടയിൽ ചെയ്തിരുന്നില്ലെങ്കിൽ, അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല[a]. എന്നാൽ ഇപ്പോൾ അവർ എന്നെയും എന്റെ പിതാവിനെയും കാണുകയും ദ്വേഷിക്കുകയും ചെയ്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർ പാപത്തിന് കുറ്റക്കാരാകുമായിരുന്നില്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ യേശുവിന്റെ വ്യക്തിത്വവും ദൗത്യവും വെളിപ്പെടുത്തുന്ന പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന ἔργα എന്ന പദത്തിന്റെ ആവർത്തിത പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: ഞാൻ അവരുടെ ഇടയിൽ ചെയ്തിരുന്നില്ലെങ്കിൽ
  rationale: ἐν αὐτοῖς എന്നത് ‘അവരുടെ ഇടയിൽ’ എന്ന സാമൂഹിക-സ്ഥാനിക അർഥത്തിൽ എടുത്തിരിക്കുന്നു. യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ചെയ്തിരുന്നില്ലെങ്കിൽ’ ഉപയോഗിച്ചു.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: മറ്റാരും ചെയ്യാത്ത
  rationale: യേശുവിന്റെ പ്രവൃത്തികളുടെ അതുല്യത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു; ‘ചെയ്തിട്ടില്ലാത്ത’ എന്നും സാധ്യമെങ്കിലും പ്രധാനവാക്യത്തിലെ കാലരൂപത്തോടൊപ്പം ‘ചെയ്യാത്ത’ കൂടുതൽ സുഗമമാണ്.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല
  rationale: ‘പാപം ഉണ്ടായിരിക്കുക’ എന്ന യോഹന്നാനീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘കുറ്റക്കാരാകുക’ എന്നു ചുരുക്കാതെ കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: സങ്കൽപ്പിത സാഹചര്യവും നിലവിലെ യാഥാർഥ്യവും തമ്മിലുള്ള വിരോധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: കാണുകയും ദ്വേഷിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: രണ്ട് ക്രിയകളെയും καί ബന്ധിപ്പിക്കുന്നതും പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴും പ്രസക്തമായ ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: എന്നെയും എന്റെ പിതാവിനെയും
  rationale: ആവർത്തിച്ചുള്ള καί നൽകുന്ന ഇരട്ട ഊന്നൽ മലയാളത്തിലെ ‘-യെയും ... -യെയും’ ഘടനയിലൂടെ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല’ എന്നതിലെ ഉത്തരവാദിത്വത്തിന്റെ അർഥം
  choice: മൂലത്തിലെ ‘പാപം ഉണ്ടായിരിക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: അവർ പാപത്തിന് കുറ്റക്കാരാകുമായിരുന്നില്ല.
  rationale: യേശുവിന്റെ അതുല്യമായ പ്രവൃത്തികൾ കണ്ടശേഷമുള്ള അവരുടെ വർധിച്ച ഉത്തരവാദിത്വം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, വിവർത്തനം അതിനെ ഒരു പ്രത്യേക നിയമപരമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- issue: യേശുവിനെയും പിതാവിനെയും കാണുകയും ദ്വേഷിക്കുകയും ചെയ്തു എന്ന ബന്ധം
  choice: രണ്ട് ക്രിയകൾക്കും ‘എന്നെയും എന്റെ പിതാവിനെയും’ ഒരുപോലെ കർമമായി നിലനിർത്തി.
  alternative: അവർ എന്റെ പ്രവൃത്തികൾ കണ്ടിട്ടും എന്നെയും എന്റെ പിതാവിനെയും ദ്വേഷിച്ചു.
  rationale: മൂലപാഠം കർമങ്ങളെ നേരിട്ട് രണ്ട് ക്രിയകളോടും ബന്ധിപ്പിക്കുന്നതിനാൽ, ‘കണ്ടത് പ്രവൃത്തികളെയാണ്’ എന്ന വ്യാഖ്യാനപരമായ വിശദീകരണം വാചകത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രവൃത്തികൾ,’ ‘പാപം,’ ‘പിതാവ്’ എന്നീ യോഹന്നാനീയ മുഖ്യപദങ്ങൾ ഏകീകരണത്തിന് അനുയോജ്യമായി നിലനിർത്തി; ദുഷ്കരമായ ‘പാപം ഉണ്ടായിരിക്കുക’ എന്ന പ്രയോഗത്തിന് അടിക്കുറിപ്പിലൂടെ വ്യാഖ്യാനസാധ്യത നൽകി.
