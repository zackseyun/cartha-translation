    issue: ‘അയയ്ക്കാനിരിക്കുന്ന’ can suggest ‘whom I am about to/intend to send.’
    rationale: πέμψω is an unqualified future (‘I will send’). An explicit future relative clause gives this force more directly in Malayalam.
  - severity: low
    issue: ‘സാക്ഷ്യം പറയും’ is less idiomatic and less directly witness-language than ‘സാക്ഷ്യം വഹിക്കും.’
    rationale: μαρτυρήσει denotes bearing witness/testifying; ‘സാക്ഷ്യം വഹിക്കും’ is standard modern Malayalam and preserves that nuance.
