id: JHN.15.26
reference: John 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: ml
  text: ഞാൻ പിതാവിന്റെ അടുക്കൽനിന്ന് നിങ്ങളുടെ അടുക്കലേക്ക് അയയ്ക്കുന്ന സഹായകൻ[a]—പിതാവിന്റെ അടുക്കൽനിന്ന് പുറപ്പെടുന്ന സത്യത്തിന്റെ ആത്മാവ്—വരുമ്പോൾ, അവൻ എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഭിഭാഷകൻ,’ ‘ആശ്വാസകൻ,’ ‘ഉപദേശകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ παράκλητος (പാരക്ലീത്).
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: വരുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള aorist subjunctive പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വരുമ്പോൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ὁ παράκλητος
  choice: സഹായകൻ
  rationale: വിളിക്കപ്പെട്ട് അരികിൽ നിൽക്കുന്നവൻ, സഹായിക്കുന്നവൻ, പ്രതിനിധീകരിക്കുന്നവൻ എന്നീ അർഥവ്യാപ്തി ഈ പദത്തിനുണ്ട്. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘സഹായകൻ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός
  choice: ഞാൻ പിതാവിന്റെ അടുക്കൽനിന്ന് നിങ്ങളുടെ അടുക്കലേക്ക് അയയ്ക്കാനിരിക്കുന്ന
  rationale: πέμψωയുടെ ഭാവികാലവും ὑμῖν എന്ന പരോക്ഷകർമവും നിലനിർത്തുന്നു; παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടം ‘പിതാവിന്റെ അടുക്കൽനിന്ന്’ എന്നു സുതാര്യമാക്കുന്നു.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: സത്യത്തിന്റെ ആത്മാവ്
  rationale: യോഹന്നാന്റെ ശൈലിയിലുള്ള genitive ഘടന ഔപചാരികമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: പിതാവിന്റെ അടുക്കൽനിന്ന് പുറപ്പെടുന്ന
  rationale: ἐκπορεύεταιയുടെ പ്രത്യേകമായ ‘പുറപ്പെടുക/വരിക’ എന്ന ചലനാർഥം നിലനിർത്തുന്നു; പിൽക്കാല ത്രിത്വശാസ്ത്ര നിഗമനങ്ങൾ മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ
  choice: അവൻ എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയും
  rationale: ἐκεῖνοςയുടെ വ്യക്തിപരവും ഊന്നലുള്ളതുമായ പരാമർശം ‘അവൻ’ എന്നു നിലനിർത്തുന്നു; μαρτυρέωയുടെ സാക്ഷി/സാക്ഷ്യ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: παράκλητος എന്ന പദത്തിന്റെ ബഹുവ്യാപ്തി
  choice: സഹായകൻ
  alternative: അഭിഭാഷകൻ; ആശ്വാസകൻ; ഉപദേശകൻ; പാരക്ലീത്
  rationale: ഒറ്റ മലയാളപദം ഗ്രീക്കുപദത്തിന്റെ എല്ലാ ഭാവങ്ങളും ഉൾക്കൊള്ളുന്നില്ല. ‘സഹായകൻ’ ലളിതവും വ്യക്തിപരവുമായ മുഖ്യപരിഭാഷയാണ്; പ്രതിനിധിത്വ/നിയമപര ഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ആത്മാവിനെ വ്യക്തിപരമായി പരാമർശിക്കൽ
  choice: അവൻ
  alternative: അത്
  rationale: πνεῦμα വ്യാകരണപരമായി neuter ആണെങ്കിലും, ἐκεῖνος masculine രൂപത്തിൽ ആത്മാവ്/സഹായകനെ വ്യക്തിപരമായി ചൂണ്ടുന്നു. അതിനാൽ മലയാളത്തിലെ വ്യക്തിപര സർവനാമം യോജിക്കുന്നു.
- issue: ἐκπορεύεται എന്ന പദത്തിന്റെ ത്രിത്വശാസ്ത്ര പ്രാധാന്യം
  choice: പിതാവിന്റെ അടുക്കൽനിന്ന് പുറപ്പെടുന്ന
  alternative: പിതാവിൽനിന്ന് വരുന്നു; പിതാവിൽനിന്ന് പുറപ്പെടുന്നു
  rationale: മൂലപാഠത്തിലെ ഉറവിടവും ക്രിയയുടെ പ്രത്യേകതയും സൂക്ഷിക്കുന്നു; ‘പിതാവിൽനിന്നും പുത്രനിൽനിന്നും’ എന്നോ മറ്റു പിൽക്കാല സിദ്ധാന്തവ്യാഖ്യാനങ്ങളോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ദീർഘമായ വാക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പ്രധാന കാലവാക്യം അവസാനംവരെ ബന്ധിപ്പിച്ചിരിക്കുന്നു. ‘പിതാവിന്റെ അടുക്കൽനിന്ന്’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ഇരട്ട പ്രയോഗം മനപ്പൂർവം സംരക്ഷിക്കുന്നു.
