id: JHN.15.6
reference: John 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: ml
  text: ആരെങ്കിലും എന്നിൽ നിലനിൽക്കുന്നില്ലെങ്കിൽ[a], ആ വ്യക്തി മുന്തിരിവള്ളിയുടെ ഒരു കൊമ്പുപോലെ പുറത്താക്കപ്പെടുകയും ഉണങ്ങിപ്പോകുകയും ചെയ്യുന്നു. അത്തരം കൊമ്പുകളെ ശേഖരിച്ച് തീയിൽ എറിയുന്നു[b]; അവ കത്തിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നിൽ വസിക്കുന്നില്ലെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ യോഹന്നാന്റെ രചനകളിലെ ഒരു പ്രധാന പദമാണ്; അത് നിലനിൽക്കുക, വസിക്കുക, തുടർന്നിരിക്കുക എന്നീ ആശയങ്ങൾ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ദൃശ്യം പുറത്താക്കപ്പെടുന്നതിന്റെയും കത്തിക്കപ്പെടുന്നതിന്റെയും മുന്നറിയിപ്പാണ്. എന്നാൽ യഥാർഥ ശിഷ്യത്വം നഷ്ടപ്പെടുന്നതാണോ വ്യാജമായ ബന്ധം വെളിപ്പെടുന്നതാണോ ഇതിൽ വിവരിക്കുന്നത് എന്ന് ഈ വാക്യംതന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: നിലനിൽക്കുക
  rationale: യോഹന്നാന്റെ രചനകളിലെ പ്രധാന പദമായ μένω ബന്ധത്തിൽ തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘നിലനിൽക്കുക’ ആ തുടർച്ചയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ἐμοί
  choice: എന്നിൽ
  rationale: യേശുവുമായുള്ള ബന്ധത്തിന്റെയും ഐക്യത്തിന്റെയും ശക്തി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐβλήθη ἔξω
  choice: പുറത്തേക്ക് എറിയപ്പെട്ട്
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയഭാവവും പുറത്താക്കപ്പെടുന്നതിന്റെ മൂർത്തമായ ദൃശ്യവും സംരക്ഷിക്കുന്നു; സോപാധിക ഉപമയിൽ മലയാളത്തിലെ തുടർച്ചയായ വാക്യഘടന സ്വാഭാവികമാണ്.
- source_word: ὡς τὸ κλῆμα
  choice: ഒരു കൊമ്പുപോലെ
  rationale: സമീപസന്ദർഭത്തിലെ മുന്തിരിവള്ളിയുടെ കൊമ്പിനെയാണ് κλῆμα സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സന്ദർഭംകൊണ്ട് മുന്തിരിക്കൊമ്പ് വ്യക്തമാകുന്നതിനാൽ ‘കൊമ്പ്’ മതി.
- source_word: ἐξηράνθη
  choice: ഉണങ്ങിപ്പോകുന്നു
  rationale: കൊമ്പ് ഈർപ്പം നഷ്ടപ്പെട്ട് ഉണങ്ങുന്ന ദൃശ്യത്തെ നേരിട്ട് നൽകുന്നു; ‘വാടുന്നു’ എന്നതിനെക്കാൾ ഉണങ്ങലിന്റെ ആശയം വ്യക്തമാണ്.
- source_word: συνάγουσιν
  choice: ആളുകൾ ... ശേഖരിച്ച്
  rationale: ഗ്രീക്കിലെ അനിർദ്ദിഷ്ട മൂന്നാംപുരുഷ ബഹുവചനത്തെ കർത്താക്കൾ ആരെന്ന് നിശ്ചയിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: αὐτὰ
  choice: അത്തരം കൊമ്പുകൾ / അവ
  rationale: മുൻപുള്ള ഏകവചന മാതൃകയിൽപ്പെടുന്ന കൊമ്പുകളെ ഗ്രീക്ക് ബഹുവചനത്തിൽ പരാമർശിക്കുന്നു. മലയാളത്തിലെ ബഹുവചനം ഈ മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: തീയിൽ എറിയുന്നു
  rationale: പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും ശക്തവുമായ ദൃശ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καίεται
  choice: അവ കത്തിപ്പോകുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ രൂപപരമായി ഏകവചനമാണെങ്കിലും ഉടൻ മുൻപുള്ള αὐτὰ ബഹുവചന കൊമ്പുകളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദൃശ്യത്തിന്റെ കൂട്ടായ അർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ബഹുവചനം ഉപയോഗിച്ചു. നിഷ്ക്രിയ/അകർമ്മക സാധ്യത ‘കത്തിപ്പോകുന്നു’ എന്നതിൽ തുറന്നുതന്നെ നിൽക്കുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും / ആ വ്യക്തി
  rationale: അനിർദ്ദിഷ്ടവും പൊതുവുമായ ഏകവചനത്തെ ലിംഗനിർണ്ണയം കൂടാതെ അവതരിപ്പിക്കുന്നു; ‘ആ വ്യക്തി’ എന്ന പുനരുക്തി സർവനാമത്തിലെ ലിംഗസൂചന ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഈ മുന്നറിയിപ്പ് യഥാർഥ ശിഷ്യത്വം നഷ്ടപ്പെടുന്നതാണോ വ്യാജബന്ധം വെളിപ്പെടുന്നതാണോ എന്ന് നിർണ്ണയിക്കൽ
  choice: പുറത്താക്കലും ഉണങ്ങലും തീയിൽ കത്തലും ഉൾപ്പെടുന്ന ഉപമാപരമായ മുന്നറിയിപ്പ് നേരിട്ട് നിലനിർത്തി
  alternative: യഥാർഥ വിശ്വാസിയുടെ വീഴ്ചയായോ ഒരിക്കലും യഥാർഥമായി ചേർന്നിട്ടില്ലാത്തവന്റെ വെളിപ്പെടലായോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം ശക്തമായ ന്യായവിധിദൃശ്യം നൽകുന്നുവെങ്കിലും ആ വ്യക്തിയുടെ മുൻ ആത്മീയസ്ഥിതി കൃത്യമായി നിർവചിക്കുന്നില്ല. അതിനാൽ പിൽക്കാല സിദ്ധാന്തവിവാദം വിവർത്തനത്തിലൂടെ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ലിംഗനിഷ്പക്ഷതയ്ക്കായി ‘അയാൾ/അവൻ’ എന്നതിനുപകരം ‘ആ വ്യക്തി’ ഉപയോഗിച്ചു. മൂലത്തിലെ ഏകവചന കൊമ്പിൽനിന്ന് ബഹുവചന കൊമ്പുകളിലേക്കുള്ള മാറ്റം ‘അത്തരം കൊമ്പുകൾ’ എന്നതിലൂടെ വായനക്കാരന് വ്യക്തമാക്കി.
