id: JHN.15.8
reference: John 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: ml
  text: 'ഇതിലാണ് എന്റെ പിതാവ് മഹത്ത്വപ്പെടുന്നത്: നിങ്ങൾ ധാരാളം ഫലം കായ്ക്കുകയും എന്റെ ശിഷ്യന്മാരായിത്തീരുകയും ചെയ്യുന്നതിൽ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “അങ്ങനെ നിങ്ങൾ എന്റെ ശിഷ്യന്മാരായിരിക്കും.”'
    reason: γένησθε (‘ആയിത്തീരുക’) എന്നതിനു പകരം γενήσεσθε (‘ആയിരിക്കും’) എന്ന പ്രധാന പാഠഭേദം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇതിലാണ്
  rationale: തുടർന്നുവരുന്ന ἵνα-വാക്യം ‘ഇത്’ എന്താണെന്ന് വിശദീകരിക്കുന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: ἐδοξάσθη
  choice: മഹത്ത്വപ്പെടുന്നത്
  rationale: ദൈവത്തിന്റെ മഹത്ത്വം വെളിപ്പെടുകയും അംഗീകരിക്കപ്പെടുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഗ്രീക്കിലെ ദൈവിക passive-ന്റെ ബലം അനാവശ്യമായി കർത്തൃവാചകമാക്കുന്നില്ല.
- source_word: καρπὸν πολὺν φέρητε
  choice: ധാരാളം ഫലം കായ്ക്കുകയും
  rationale: യോഹന്നാൻ 15-ലെ മുന്തിരിവള്ളിയുടെയും കൊമ്പുകളുടെയും രൂപകം നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: എന്റെ ശിഷ്യന്മാരായിത്തീരുകയും
  rationale: γίνομαι എന്ന ക്രിയയുടെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക അർഥം നിലനിർത്തുന്നു; ‘ശിഷ്യന്മാരാണെന്ന് തെളിയിക്കുക’ എന്ന വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ഫലം കായ്ക്കുന്നതും ശിഷ്യത്വവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഫലം കായ്ക്കുകയും ... ശിഷ്യന്മാരായിത്തീരുകയും’ എന്ന ഏകോപിത രൂപം
  alternative: ‘ഫലം കായ്ച്ച് എന്റെ ശിഷ്യന്മാരാണെന്ന് തെളിയിക്കുക’
  rationale: SBLGNT-യിലെ καὶ γένησθε എന്ന പാഠം രണ്ടു ക്രിയകളെയും ബന്ധിപ്പിക്കുന്നു; ശിഷ്യത്വത്തെ തെളിവായി മാത്രം വ്യാഖ്യാനിക്കുന്നതോ കാരണഫലബന്ധം നിർബന്ധിക്കുന്നതോ ഒഴിവാക്കുന്നു.
- issue: ἵνα-വാക്യത്തിന്റെ പ്രവർത്തനം
  choice: മുൻപുള്ള ‘ഇത്’ വിശദീകരിക്കുന്ന ഉള്ളടക്കമായി വിവർത്തനം
  alternative: ‘അതിനുവേണ്ടി’ എന്ന ഉദ്ദേശ്യവാക്യം
  rationale: ഇവിടെ ἐν τούτῳ-യെ ἵνα-വാക്യം വിശദീകരിക്കുന്ന വായന സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ ബന്ധത്തെ മലയാളത്തിൽ കോളൺ ഉപയോഗിച്ച് വ്യക്തവും തുറന്നതുമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ധാരാളം ഫലം കായ്ക്കുക’ എന്നത് അധ്യായത്തിലെ സസ്യരൂപകവുമായി പൊരുത്തപ്പെടുന്നു; കോളൺ ഗ്രീക്ക് വാക്യത്തിലെ വിശദീകരണബന്ധം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
