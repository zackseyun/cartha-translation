id: JHN.15.22
reference: John 15:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: ml
  text: ഞാൻ വന്ന് അവരോടു സംസാരിച്ചില്ലായിരുന്നെങ്കിൽ, അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല[a]. എന്നാൽ ഇപ്പോൾ തങ്ങളുടെ പാപത്തിന് അവർക്കു യാതൊരു ഒഴികഴിവുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ പാപത്തിനു കുറ്റക്കാരാകുമായിരുന്നില്ല” അല്ലെങ്കിൽ “അവർക്കു കുറ്റബാധ്യത ഉണ്ടാകുമായിരുന്നില്ല.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഒഴികഴിവ്” എന്നതിന് “ന്യായീകരണത്തിനുള്ള കാരണം” അല്ലെങ്കിൽ “മറ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: ഞാൻ വന്ന് അവരോടു സംസാരിച്ചില്ലായിരുന്നെങ്കിൽ
  rationale: കഴിഞ്ഞകാലത്തിലെ യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; καί ബന്ധിപ്പിക്കുന്ന ‘വരുക’, ‘സംസാരിക്കുക’ എന്നീ രണ്ടു പ്രവൃത്തികളും നിലനിർത്തുന്നു.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല
  rationale: ‘പാപം ഉണ്ടായിരിക്കുക’ എന്ന യോഹന്നാനീയ പ്രയോഗം നിലനിർത്തുകയും അതിനെ ‘കുറ്റക്കാരാകുമായിരുന്നില്ല’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: സങ്കല്പിതമായ സാഹചര്യവും ഇപ്പോഴത്തെ യാഥാർഥ്യവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: യാതൊരു ഒഴികഴിവുമില്ല
  rationale: πρόφασις ഇവിടെ സൂചിപ്പിക്കുന്ന excuse/pretext എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: തങ്ങളുടെ പാപത്തെക്കുറിച്ച് പറയാൻ
  rationale: περί + genitive എന്നതിലെ ‘സംബന്ധിച്ച്’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ‘ഒഴികഴിവ്’ എന്നതിനോടൊപ്പം മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യഘടന സൃഷ്ടിക്കുന്നു.
theological_decisions:
- issue: ἁμαρτίαν οὐκ εἴχοσαν എന്നത് സമ്പൂർണ പാപരാഹിത്യമായോ യേശുവിന്റെ വെളിപ്പെടുത്തൽ നിരസിച്ചതിനുള്ള കുറ്റബാധ്യത ഇല്ലായ്മയായോ വ്യക്തമാക്കണമോ എന്ന ചോദ്യം
  choice: ‘അവർക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും തുറന്ന അർഥപരിധിയും പ്രധാന പാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അവർ പാപത്തിൽ കുറ്റക്കാരാകുമായിരുന്നില്ല’ അല്ലെങ്കിൽ ‘ഈ പാപത്തിന് അവർ ഉത്തരവാദികളാകുമായിരുന്നില്ല.’
  rationale: സന്ദർഭം യേശു വന്ന് സംസാരിച്ചതിനുശേഷമുള്ള നിരസനത്തിന്റെ ഉത്തരവാദിത്വത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പാഠം ‘പാപം ഉണ്ടായിരിക്കുക’ എന്നാണ് പറയുന്നത്. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയ്ക്ക് ‘സംസാരിച്ചില്ലായിരുന്നെങ്കിൽ … ഉണ്ടാകുമായിരുന്നില്ല’ എന്ന സ്വാഭാവിക ഘടന ഉപയോഗിച്ചു. ‘പാപം ഉണ്ടായിരിക്കുക’ അല്പം അടയാളപ്പെടുത്തിയ പ്രയോഗമാണെങ്കിലും മൂലപാഠത്തിലെ യോഹന്നാനീയ ദൈവശാസ്ത്രഭാരം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
