  text: You are my friends if you do what I command you[a].
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ സുഹൃത്തുക്കളാണ്, ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന കാര്യങ്ങൾ നിങ്ങൾ ചെയ്യുന്നെങ്കിൽ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്നതെല്ലാം നിങ്ങൾ ചെയ്താൽ, നിങ്ങൾ എന്റെ സുഹൃത്തുക്കളാണ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: വാക്യാരംഭത്തിലെ ബഹുവചന സർവനാമത്തിന് ഗ്രീക്കിൽ ഊന്നലുണ്ട്. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം പാലിച്ചുകൊണ്ട് ‘നിങ്ങൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: φίλοι μού
  choice: എന്റെ സുഹൃത്തുക്കൾ
  rationale: φίλοι ബന്ധപരമായ അടുപ്പത്തെ സൂചിപ്പിക്കുന്നു; ‘സുഹൃത്തുക്കൾ’ അതിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള തുല്യപദമാണ്.
- source_word: ἐστε
  choice: ആണ്
  rationale: വർത്തമാനകാലത്തിലുള്ള അസ്തിത്വക്രിയയെ ബഹുമാനസൂചക/ബഹുവചന കർത്താവിനൊത്ത സ്വാഭാവിക മലയാള പ്രയോഗത്തിൽ നൽകി.
- source_word: ἐὰν
  choice: ചെയ്യുന്നെങ്കിൽ
  rationale: സബ്ജങ്ക്റ്റീവിനോടുകൂടിയ ἐὰν നിബന്ധനയെ അവതരിപ്പിക്കുന്നു; ‘എങ്കിൽ’ ഘടിപ്പിച്ച രൂപം നിബന്ധന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ποιῆτε
  choice: ചെയ്യുന്നു
  rationale: കല്പനകൾ പ്രവൃത്തിയിൽ ആക്കുന്നതിനെ ലളിതമായി ‘ചെയ്യുക’ എന്നു നൽകി; ഗ്രീക്ക് വർത്തമാനരൂപത്തിൽനിന്ന് ‘തുടർന്നുകൊണ്ടിരിക്കുക’ എന്ന ദൈർഘ്യാർഥം അനാവശ്യമായി ശക്തിപ്പെടുത്തിയില്ല.
- source_word: ἃ
  choice: കല്പിക്കുന്നതു
  rationale: നപുംസകലിംഗ ബഹുവചന ബന്ധസർവനാമത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചനസദൃശമായ ‘-തു’ ഘടനയിലൂടെ അറിയിച്ചു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: പ്രകടമായ ഗ്രീക്ക് കർത്തൃസർവനാമം യേശുവിന്റെ അധികാരപരമായ വ്യക്തിഗത പ്രസ്താവനയെ നിലനിർത്തുന്നു.
- source_word: ἐντέλλομαι
  choice: കല്പിക്കുന്നു
  rationale: അധികാരത്തോടെ നിർദേശം നൽകുക എന്ന അർഥം മൃദൂകരിക്കാതെ ‘കല്പിക്കുക’ സംരക്ഷിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: ദത്തിവ് ബഹുവചനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘നിങ്ങളോടു കല്പിക്കുക’ എന്ന ഘടനയിൽ പ്രതിഫലിപ്പിച്ചു.
theological_decisions:
- issue: അനുസരണവും യേശുവിന്റെ സൗഹൃദവും തമ്മിലുള്ള നിബന്ധനാപരമായ ബന്ധം
  choice: ‘ചെയ്യുന്നെങ്കിൽ’ എന്ന നേരിട്ടുള്ള നിബന്ധനയായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ചെയ്യുമ്പോൾ’ എന്ന കാലസൂചക രൂപം
  rationale: ἐὰν + subjunctive ഇവിടെ വെറും സമയബന്ധത്തേക്കാൾ നിബന്ധനയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ഈ ബന്ധത്തെ അർഹത, രക്ഷ, നിലനിൽപ്പ് തുടങ്ങിയ വിപുലമായ ഉപദേശങ്ങളാൽ വിശദീകരിക്കാതെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം അതേപടി സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കല്പിക്കുക’ യേശുവിന്റെ അധികാരം കാത്തുസൂക്ഷിക്കുന്നു; ‘സുഹൃത്തുക്കൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ബന്ധപദമാണ്. മുഖ്യവാക്യത്തിൽ നിബന്ധന ആദ്യം വെച്ചത് മലയാളത്തിലെ ഒഴുക്കിനും വ്യക്തതയ്ക്കും അനുയോജ്യമാണ്.
