revisions:
- from: ഞാൻ നിങ്ങളോടു കല്പിക്കുന്നതു നിങ്ങൾ ചെയ്യുന്നെങ്കിൽ, നിങ്ങൾ എന്റെ സുഹൃത്തുക്കളാണ്.[a]
  to: നിങ്ങൾ എന്റെ സുഹൃത്തുക്കളാണ്, ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്ന കാര്യങ്ങൾ നിങ്ങൾ ചെയ്യുന്നെങ്കിൽ.[a]
  rationale: The revision retains the conditional relationship without theological expansion, explicitly represents the plural sense of ἃ as ‘കാര്യങ്ങൾ,’ retains the authoritative sense of ἐντέλλομαι, and restores the Greek’s initial prominence of ‘നിങ്ങൾ’ as far as natural Malayalam permits. The footnote is recast as an honest idiomatic alternative rather than an inaccurate claim of greater word-for-word literalness.
