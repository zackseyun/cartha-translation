id: JHN.15.16
reference: John 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: ml
  text: നിങ്ങളല്ല എന്നെ തിരഞ്ഞെടുത്തത്[a]; ഞാനാണ് നിങ്ങളെ തിരഞ്ഞെടുത്തതും, നിങ്ങൾ പോയി ഫലം കായ്ക്കുകയും നിങ്ങളുടെ ഫലം നിലനിൽക്കുകയും ചെയ്യേണ്ടതിനും, എന്റെ നാമത്തിൽ നിങ്ങൾ പിതാവിനോടു[c] എന്തു ചോദിച്ചാലും അവൻ നിങ്ങൾക്കു നൽകേണ്ടതിനും നിങ്ങളെ നിയോഗിച്ചതും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരഞ്ഞെടുത്തു’ എന്നതിന് ‘തിരഞ്ഞെടുക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയുടെ സാധാരണ അർഥം തിരഞ്ഞെടുക്കുക എന്നതാണ്; പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദം പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ അവസാന ഭാഗം ലക്ഷ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ἵνα ഉപവാക്യമാണ്: ‘...അവൻ നിങ്ങൾക്കു നൽകേണ്ടതിന്.’ അതിനാൽ ഇത് സന്ദർഭത്തിൽനിന്ന് വേർപെടുത്തിയ നിരുപാധിക സൂത്രവാക്യമല്ല.'
    reason: grammar_and_theological_tension
  - marker: c
    text: ഗ്രീക്കിൽ ‘എന്റെ പിതാവ്’ എന്നല്ല, ‘പിതാവ്’ എന്നാണ് വായിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: തിരഞ്ഞെടുത്തത് / തിരഞ്ഞെടുത്തു
  rationale: ἐκλέγομαι എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘തിരഞ്ഞെടുക്കുക’ എന്നത് ബന്ധപരമായ വൈരുധ്യവും യേശുവിന്റെ മുൻകൈയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദം പ്രധാന പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἔθηκα
  choice: നിയോഗിച്ചു
  rationale: τίθημι അക്ഷരാർഥത്തിൽ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ ശിഷ്യന്മാരെ ഒരു ലക്ഷ്യത്തിനായി ഏൽപ്പിക്കുന്ന ആശയമാണ്; ‘നിയോഗിച്ചു’ ദൗത്യബോധം അറിയിക്കുമ്പോഴും സഭാപദവിയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἵνα
  choice: —വേണ്ടതിനും / അങ്ങനെ
  rationale: രണ്ടു ἵνα ഉപവാക്യങ്ങളുടെയും ലക്ഷ്യ-ഫല ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താൻ ആദ്യം ‘—വേണ്ടതിനും’, തുടർന്ന് ‘അങ്ങനെ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ὑπάγητε
  choice: പോയി
  rationale: ὑπάγω എന്നതിന്റെ വിശാലമായ ‘പോകുക’ എന്ന അർഥം നിലനിർത്തുന്നു; പാഠത്തിൽ നേരിട്ട് പറയാത്ത പ്രത്യേക ദൗത്യവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: καρπὸν φέρητε
  choice: ഫലം കായ്ക്കുക
  rationale: യോഹന്നാനിലെ സസ്യരൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി അതേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: μένῃ
  choice: നിലനിൽക്കുക
  rationale: μένω സൂചിപ്പിക്കുന്ന തുടരുക, നിലനിൽക്കുക, വസിക്കുക എന്നീ അർഥസാധ്യതകളിൽ, ഫലത്തെ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ ‘നിലനിൽക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: എന്തു ചോദിച്ചാലും
  rationale: ὅ τι ἂν എന്ന അനിശ്ചിത വ്യാപ്തി മലയാളത്തിലെ ‘എന്തു...ആലും’ ഘടന കൃത്യമായി നൽകുന്നു; αἰτέωയ്ക്ക് പ്രാർഥനാസന്ദർഭത്തിൽ ‘ചോദിക്കുക’ യോജിക്കുന്നു.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന അർഥം അധികവ്യാഖ്യാനമില്ലാതെ സംരക്ഷിക്കുന്ന പതിവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: τὸν πατέρα
  choice: പിതാവിനോട്
  rationale: മൂലപാഠത്തിലെ ‘പിതാവ്’ എന്ന നിർദ്ദേശം തന്നെയാണ് നൽകിയിരിക്കുന്നത്; ‘എന്റെ പിതാവ്’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: δῷ
  choice: നൽകും
  rationale: അവസാന ἵνα ഉപവാക്യത്തിലെ aorist subjunctive മലയാളത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യ/ഫല വാക്യത്തിനകത്ത് ഭാവിരൂപത്തിൽ പ്രതിഫലിക്കുന്നു; ഇതിനെ സന്ദർഭത്തിൽനിന്നു വേർപെടുത്തിയ നിരുപാധിക വാഗ്ദാനമായി വായിക്കരുതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐξελεξάμην എന്നതിനെ സാങ്കേതിക ‘തിരഞ്ഞെടുപ്പ്’ സിദ്ധാന്തമായി അമിതമായി വായിക്കാനുള്ള സാധ്യത
  choice: ഉടൻ വരുന്ന ശിഷ്യത്വ-ദൗത്യസന്ദർഭത്തിൽ ‘ഞാനാണ് നിങ്ങളെ തിരഞ്ഞെടുത്തത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രഭാരം മുൻനിർത്തുന്ന പദം ഉപയോഗിക്കുക.
  rationale: വാക്യം യേശുവിന്റെ മുൻകൈ ഉറപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് ക്രിയയെ ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ സമ്പൂർണ തിരഞ്ഞെടുപ്പ് സിദ്ധാന്തമായി ചുരുക്കുന്നില്ല.
- issue: ἔθηκα ὑμᾶς എന്നതിന്റെ പരിധി
  choice: ഫലം കായ്ക്കാനുള്ള ലക്ഷ്യത്തോടെ ‘നിയോഗിച്ചു’ എന്നു മനസ്സിലാക്കി.
  alternative: ‘വെച്ചു’ എന്ന അക്ഷരാർഥം, അല്ലെങ്കിൽ ഒരു സഭാപദവിയിലേക്കുള്ള ഔപചാരിക അഭിഷേകം.
  rationale: സന്ദർഭം പോകൽ, ഫലം കായ്ക്കൽ, പ്രാർഥന എന്നിവയോടു ബന്ധമുള്ള ഉദ്ദേശ്യപൂർവമായ നിയോഗമാണ് സൂചിപ്പിക്കുന്നത്; പ്രത്യേക സഭാപദവി മാത്രം അല്ല.
- issue: അവസാന ἵνα ഉപവാക്യത്തിന്റെ ശക്തി
  choice: മുൻപുള്ള നിയോഗവും ഫലധാരണവും സംബന്ധിച്ച ലക്ഷ്യ/ഫലശൃംഖലയായി ‘അങ്ങനെ ... നൽകും’ എന്നു നൽകി.
  alternative: സന്ദർഭത്തിൽനിന്നു വേർപെടുത്തിയ നിരുപാധിക പ്രാർഥനാവാഗ്ദാനമായി അവതരിപ്പിക്കുക; അല്ലെങ്കിൽ ‘നൽകിയേക്കാം’ എന്ന സാധ്യതാഭാവം നൽകുക.
  rationale: ഗ്രീക്ക് subjunctive ഇവിടെ വെറും അനിശ്ചിത സാധ്യതയല്ല, ἵνα നിയന്ത്രിക്കുന്ന ലക്ഷ്യ/ഫല ഘടനയാണ്. മലയാളത്തിൽ ‘നൽകും’ സ്വാഭാവികമെങ്കിലും അതിന്റെ വ്യാകരണബന്ധം ‘അങ്ങനെ’യും അടിക്കുറിപ്പും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവോടെയും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യമായും ഉള്ള മലയാളം. ‘ഞാനാണ്’ എന്ന ഊന്നൽ οὐχ...ἀλλ’ ἐγώ എന്ന വൈരുധ്യം പ്രകടമാക്കുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളവായനയ്ക്കായി ഒരു പൂർണ്ണവിരാമം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
