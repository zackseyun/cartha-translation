revisions:
- from: നിങ്ങൾ എന്നെ തിരഞ്ഞെടുത്തതല്ല[a]; ഞാനാണ് നിങ്ങളെ തിരഞ്ഞെടുത്തതും, നിങ്ങൾ പോയി ഫലം കായ്ക്കേണ്ടതിനും നിങ്ങളുടെ ഫലം നിലനിൽക്കേണ്ടതിനും നിങ്ങളെ നിയോഗിച്ചതും. അങ്ങനെ, നിങ്ങൾ എന്റെ നാമത്തിൽ പിതാവിനോട് എന്തു ചോദിച്ചാലും അദ്ദേഹം നിങ്ങൾക്കു നൽകും.[b]
  to: നിങ്ങളല്ല എന്നെ തിരഞ്ഞെടുത്തത്[a]; ഞാനാണ് നിങ്ങളെ തിരഞ്ഞെടുത്തതും, നിങ്ങൾ പോയി ഫലം കായ്ക്കുകയും നിങ്ങളുടെ ഫലം നിലനിൽക്കുകയും ചെയ്യേണ്ടതിനും, എന്റെ നാമത്തിൽ നിങ്ങൾ പിതാവിനോടു[c] എന്തു ചോദിച്ചാലും അവൻ നിങ്ങൾക്കു നൽകേണ്ടതിനും നിങ്ങളെ നിയോഗിച്ചതും.[b]
  rationale: The revision preserves the two purpose clauses governed by Jesus’ appointment, improves the opening contrast, and supplies the audit-trail footnote concerning “the Father.” It does not resolve the verse through any denominational interpretation.
