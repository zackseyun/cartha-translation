  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: ml
  text: ഒരാൾ തന്റെ സുഹൃത്തുക്കൾക്കുവേണ്ടി തന്റെ ജീവൻ അർപ്പിക്കുന്നതിനേക്കാൾ വലിയ സ്നേഹം ആർക്കുമില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജീവൻ’ എന്നത് ഗ്രീക്കിലെ psychē എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; അതിന് ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വയം’ എന്നും അർഥമാകാം. ഇവിടെ മരണത്തിൽ വിട്ടുകൊടുക്കുന്ന ഒരാളുടെ ജീവനാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: ‘വേണ്ടി’ എന്നത് ഗ്രീക്കിലെ hyper എന്ന പദത്തിന്റെ പരിഭാഷയാണ്; അതിന് ‘അവർക്കു വേണ്ടി’ അല്ലെങ്കിൽ ‘അവരുടെ നിമിത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: ഇതിനെക്കാൾ വലിയ സ്നേഹം
  rationale: താരതമ്യാർഥത്തിലുള്ള μείζοναയും genitive of comparison ആയ ταύτηςയും സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പകർന്നു; ‘ഇത്’ പിന്നാലെയുള്ള വിശദീകരണത്തിലേക്കാണ് ചൂണ്ടുന്നത്.
- source_word: οὐδεὶς ἔχει
  choice: ആർക്കും ഇല്ല
  rationale: നിഷേധാത്മകമായ പൊതുപ്രസ്താവന മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα τις
  choice: ഒരാൾ … എന്നത്
  rationale: ἵνα ഇവിടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിലുപരി ‘ഈ സ്നേഹം’ എന്താണെന്ന് വിശദീകരിക്കുന്നു; τις എന്ന അനിശ്ചിത ഏകവചന കർത്താവിനെ ‘ഒരാൾ’ എന്നു നിലനിർത്തി.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: തന്റെ ജീവൻ അർപ്പിക്കുക
  rationale: ψυχή ഇവിടെ മരണത്തിലേക്കുള്ള സ്വയംസമർപ്പണമായ ജീവനെ സൂചിപ്പിക്കുന്നു. τίθημι എന്നതിന്റെ പദശഃ അർഥം ‘വെക്കുക’ ആണെങ്കിലും, ഈ പ്രയോഗത്തിൽ ‘ജീവൻ അർപ്പിക്കുക’ എന്നതാണ് സ്വാഭാവികവും അർഥസമ്പുഷ്ടവുമായ മലയാളം.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: തന്റെ സ്നേഹിതർക്കുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ ഗുണഭോക്തൃ/പ്രതിനിധിത്വ ഭാവം ‘വേണ്ടി’ സ്വാഭാവികമായി നൽകുന്നു; φίλοι എന്നത് ‘സ്നേഹിതർ’ എന്നു പകർന്നു.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘സ്വയം’
  rationale: സന്ദർഭം മരണത്തിലേക്കുള്ള യാഥാർഥ സ്വയംസമർപ്പണമാണ്; ശരീരം–ആത്മാവ് എന്ന വേർതിരിവ് വാക്യത്തിലേക്ക് അനാവശ്യമായി കൊണ്ടുവരാതെ സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- issue: ὑπέρ എന്നതിലെ ത്യാഗപരമായ ഭാവം
  choice: ‘വേണ്ടി’ എന്നു പകർന്നു.
  alternative: ‘പക്ഷമായി’, ‘നിമിത്തം’, അല്ലെങ്കിൽ ‘പകരമായി’
  rationale: ‘വേണ്ടി’ ഗുണഭോക്തൃവും പ്രതിനിധിത്വപരവുമായ സാധ്യത തുറന്നുവെക്കുന്നു; ഈ വാക്യം മാത്രം നിർബന്ധിക്കാത്ത പകരമരണ സിദ്ധാന്താർഥം പരിഭാഷയിൽ അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീവൻ വെക്കുക’ എന്ന പദശഃ രൂപത്തിന് പകരം സ്വാഭാവികമായ ‘ജീവൻ അർപ്പിക്കുക’ ഉപയോഗിച്ചു. ‘സ്നേഹിതർ’ എന്നത് dignified biblical register നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
