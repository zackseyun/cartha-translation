  - severity: medium
    issue: Footnote b gives ‘പക്ഷമായി’ as an alternative for ὑπέρ
    rationale: ‘പക്ഷമായി’ normally means ‘in favor of/on one’s side’ and does not naturally express the benefactive ‘for/on behalf of’ sense required in this clause.
