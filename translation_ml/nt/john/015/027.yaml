  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: ml
  text: നിങ്ങളും സാക്ഷ്യം പറയുന്നു[a], കാരണം ആദിമുതൽ നിങ്ങൾ എന്നോടുകൂടെ ഉണ്ടായിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യം വഹിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘നിങ്ങൾ ആകുന്നു’ എന്നാണ്; ആദിമുതൽ ഇപ്പോൾവരെ തുടരുന്ന അവസ്ഥ വ്യക്തമാക്കാൻ ‘ഉണ്ടായിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: നിങ്ങളും
  rationale: മുൻവാക്യത്തിൽ പരിശുദ്ധാത്മാവ് സാക്ഷ്യം പറയുന്നതുമായി ശിഷ്യരുടെ സാക്ഷ്യത്തെ ബന്ധിപ്പിക്കുകയും, വ്യക്തമായ ὑμεῖς നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μαρτυρεῖτε
  choice: സാക്ഷ്യം പറയുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ സാക്ഷി/ന്യായവ്യവഹാര ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ശിഷ്യർ സാക്ഷ്യം പറയാനുള്ള കാരണം തുടർന്നുള്ള വാക്യഭാഗം വ്യക്തമാക്കുന്നു എന്നതാണ് സന്ദർഭത്തിലെ ഏറ്റവും സ്വാഭാവിക ബന്ധം.
- source_word: ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: അവ്യക്തത നിലനിർത്തിക്കൊണ്ട് ‘തുടക്കം മുതൽ’ എന്ന കാലസൂചന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ
  rationale: യേശുവുമായുള്ള സഹവാസം/സാന്നിധ്യം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐστε
  choice: ഉണ്ടായിരുന്നല്ലോ
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാലമായിരുന്നാലും, ἀπ’ ἀρχῆς സൂചിപ്പിക്കുന്ന ഭൂതകാലം മുതൽ ഇപ്പോൾവരെ തുടരുന്ന അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘അല്ലോ’ കാരണം അറിയപ്പെട്ടതാണെന്ന ഭാവവും നൽകുന്നു.
theological_decisions:
- issue: ‘ആദിമുതൽ’ എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ആദിമുതൽ’ എന്നു മാത്രം നൽകി സന്ദർഭപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
  alternative: യേശുവിന്റെ പരസ്യശുശ്രൂഷയുടെ ആരംഭം മുതൽ എന്ന് വ്യക്തമായി വിപുലീകരിക്കുക; അല്ലെങ്കിൽ സമ്പൂർണമായ ഒരു ആദിയെ സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: സന്ദർഭം ശിഷ്യർ യേശുവിനോടൊപ്പം ഉണ്ടായിരുന്ന ചരിത്രപരമായ സഹവാസത്തെ അവരുടെ സാക്ഷ്യത്തിന്റെ അടിസ്ഥാനമാക്കുന്നു; എന്നാൽ മൂലപാഠം ആരംഭം ഏതെന്ന് ഇവിടെ വിശദീകരിക്കാത്തതിനാൽ വിവർത്തനം അതിനെ നിർബന്ധമായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘സാക്ഷ്യം പറയുന്നു’ സഭാപരമായ പരിചിതത്വവും സാധാരണ ഭാഷയിലെ വ്യക്തതയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
