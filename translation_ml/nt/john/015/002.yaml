id: JHN.15.2
reference: John 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: ml
  text: എന്നിൽ ഫലം കായ്ക്കാത്ത ഓരോ കൊമ്പും അവൻ നീക്കിക്കളയുന്നു[a]; ഫലം കായ്ക്കുന്ന ഓരോ കൊമ്പും കൂടുതൽ ഫലം കായ്ക്കാൻ അവൻ വെട്ടിയൊരുക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എടുത്തുമാറ്റുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ αἴρει എന്നതിന് ‘ഉയർത്തുന്നു’ എന്നാണ് ചിലർ മനസ്സിലാക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘വെട്ടിയൊരുക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് ‘ശുദ്ധീകരിക്കുന്നു’ എന്നും അർഥമുണ്ട്. മുന്തിരിത്തോട്ടത്തിന്റെ ദൃശ്യത്തിന് ‘വെട്ടിയൊരുക്കുന്നു’ യോജിക്കുന്നു; അടുത്ത വാക്യത്തിലെ ‘ശുദ്ധർ’ എന്ന ഭാഷയെയും ഈ പദം മുൻകൂട്ടി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: ഓരോ കൊമ്പും
  rationale: ഏകവചനനാമത്തോടുകൂടിയ πᾶν-ന്റെ വിതരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: യോഹന്നാന്റെ ബന്ധസൂചകവും ദൈവശാസ്ത്രപരവുമായ ഭാഷ വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μὴ φέρον καρπὸν
  choice: ഫലം കായ്ക്കാത്ത
  rationale: തുടരുന്ന ഫലോത്പാദനത്തിന്റെ ആശയം മുന്തിരിവള്ളിയുടെ ദൃശ്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αἴρει
  choice: നീക്കിക്കളയുന്നു
  rationale: αἴρω എന്നതിന് എടുത്തുമാറ്റുക, നീക്കുക, ഉയർത്തുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം; ഫലമില്ലാത്തതും ഫലമുള്ളതുമായ കൊമ്പുകളോടുള്ള വ്യത്യസ്ത നടപടികളുടെ സന്ദർഭത്തിൽ ‘നീക്കിക്കളയുന്നു’ ഏറ്റവും യോജിക്കുന്നു. ‘ഉയർത്തുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: καθαίρει
  choice: വെട്ടിയൊരുക്കുന്നു
  rationale: മുന്തിരിത്തോട്ടത്തിന്റെ സന്ദർഭത്തിൽ കൊമ്പ് കൂടുതൽ ഫലം കായ്ക്കുന്നതിനായി വെട്ടിയൊരുക്കുന്ന പ്രവൃത്തിയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘ശുദ്ധീകരിക്കുന്നു’ എന്ന പദാർഥബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: കൂടുതൽ ഫലം കായ്ക്കാൻ
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യവും πλείονα എന്ന താരതമ്യരൂപവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ αἴρει എന്ന ക്രിയയുടെ അർഥം
  choice: അവൻ നീക്കിക്കളയുന്നു
  alternative: അവൻ എടുത്തുമാറ്റുന്നു; അവൻ ഉയർത്തുന്നു
  rationale: ഉടൻ വരുന്ന മുന്തിരിവള്ളി-കൊമ്പ് ദൃശ്യത്തിൽ ഫലമില്ലാത്ത കൊമ്പിനോടുള്ള നടപടിയും ഫലമുള്ള കൊമ്പിനെ കൂടുതൽ ഫലത്തിനായി വെട്ടിയൊരുക്കുന്നതും തമ്മിൽ വ്യത്യാസമുണ്ട്. ‘നീക്കിക്കളയുന്നു’ ഈ വ്യത്യാസം നിലനിർത്തുന്നു; വിശ്വാസത്യാഗമോ വിശ്വാസികളുടെ അന്തിമസ്ഥിരതയോ സംബന്ധിച്ച ഏതെങ്കിലും സഭാപാരമ്പര്യനിഗമനം വാക്യത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല. ‘ഉയർത്തുന്നു’ എന്ന സജീവമായ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ ശൈലി. ‘ഫലം കായ്ക്കുക’, ‘കൊമ്പ് വെട്ടിയൊരുക്കുക’ എന്നീ പ്രയോഗങ്ങൾ കൃഷിദൃശ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
