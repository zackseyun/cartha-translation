  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: ml
  text: “എന്റെ സന്തോഷം നിങ്ങളിൽ[b] ഉണ്ടായിരിക്കാനും നിങ്ങളുടെ സന്തോഷം പൂർണ്ണമാകാനും[a] വേണ്ടിയാണ് ഞാൻ നിങ്ങളോടു ഈ കാര്യങ്ങൾ പറഞ്ഞിരിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ സന്തോഷം നിറഞ്ഞതാകാനും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ സന്തോഷം നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കാനും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ബഹുവചനമായ സൂചകസർവനാമത്തിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുകയും യോഹന്നാന്റെ പ്രഭാഷണശൈലിക്ക് സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: λελάληκα
  choice: ഞാൻ ... സംസാരിച്ചിരിക്കുന്നത്
  rationale: പൂർണകാല ക്രിയയുടെ മുൻപ് പറഞ്ഞതും ഇപ്പോഴും പ്രസക്തവുമായ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ദത്തിവിന്റെ സംഭാഷണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἵνα
  choice: '... വേണ്ടിയാണ്'
  rationale: യേശു സംസാരിച്ചതിന്റെ ഉദ്ദേശ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഫലസൂചനയും പൂർണമായി ഒഴിവാക്കുന്നില്ല.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: എന്റെ സന്തോഷം
  rationale: യേശുവിനുള്ളതായ സന്തോഷമെന്ന ഗ്രീക്ക് പ്രയോഗം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ ആന്തരിക സാന്നിധ്യസാധ്യത സംരക്ഷിക്കുന്നു; ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന കൂട്ടായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ᾖ
  choice: ഉണ്ടായിരിക്കാനും
  rationale: ἵνα-യോടൊപ്പമുള്ള വർത്തമാനകാല വിധിലിംഗത്തിന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ
  choice: -ഉം ... -ഉം
  rationale: രണ്ട് സമാന്തര ഉദ്ദേശ്യഘടകങ്ങളെ മലയാളത്തിലെ സമുച്ചയപ്രത്യയങ്ങളാൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἡ χαρὰ ὑμῶν
  choice: നിങ്ങളുടെ സന്തോഷം
  rationale: ‘എന്റെ സന്തോഷം’ എന്നതുമായുള്ള വ്യക്തമായ വൈരുധ്യവും ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: πληρωθῇ
  choice: നിറഞ്ഞതാകാനും
  rationale: ക്രിയയുടെ നിറവ്/പൂർണത എന്ന ദൃശ്യാർഥവും കർമണിസ്വഭാവവും വായനാസൗകര്യത്തോടെ പകരുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിലെ ‘എന്റെ സന്തോഷം’ എന്നതിന്റെ സ്വഭാവം
  choice: ‘എന്റെ സന്തോഷം’ എന്ന് വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നൽകി.
  alternative: ‘ഞാൻ നൽകുന്ന സന്തോഷം’ അല്ലെങ്കിൽ ‘എന്നെക്കുറിച്ചുള്ള സന്തോഷം’
  rationale: ഗ്രീക്ക് പാഠം യേശുവിന്റെ സ്വന്തം സന്തോഷം വിശ്വാസികൾ പങ്കിടുന്നതും അവനുമായുള്ള ഐക്യത്തിൽനിന്നു ലഭിക്കുന്ന സന്തോഷവും ഉൾപ്പെടാവുന്ന വിധത്തിൽ തുറന്നിരിക്കുന്നു; ഒരു അർഥത്തിലേക്കു മാത്രം ചുരുക്കുന്നത് ഒഴിവാക്കി.
- issue: ἐν ὑμῖν എന്നതിലെ സ്ഥലബന്ധം
  choice: പ്രധാനപാഠത്തിൽ ‘നിങ്ങളിൽ’
  alternative: ‘നിങ്ങളുടെ ഇടയിൽ’
  rationale: വ്യക്തികളിലുള്ള ആന്തരിക സാന്നിധ്യവും ശിഷ്യസമൂഹത്തിനിടയിലെ സാന്നിധ്യവും ഗ്രീക്കിൽ സാധ്യമാണ്. സന്ദർഭപരമായി ആന്തരിക അർഥം മുൻനിർത്തിയെങ്കിലും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ദേശ്യഘടകങ്ങൾ മുഖ്യക്രിയയ്ക്കുമുമ്പിൽ നിരത്തി മലയാളവാക്യക്രമം പാലിച്ചു; മൂലത്തിലെ ബഹുവചനവും സന്തോഷത്തിന്റെ നിറവ് എന്ന രൂപകവും സംരക്ഷിച്ചു.
