source:
  edition: SBLGNT
  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: ml
  text: നിങ്ങൾ പരസ്പരം സ്നേഹിക്കേണ്ടതിന് ഈ കാര്യങ്ങൾ ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ നിങ്ങളോടു ഈ കാര്യങ്ങൾ കൽപ്പിക്കുന്നു: പരസ്പരം സ്നേഹിക്കുക.” ഗ്രീക്കിലെ ἵνα കൊണ്ടാരംഭിക്കുന്ന ഉപവാക്യം ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതായോ കൽപ്പനയുടെ ഉള്ളടക്കത്തോടടുത്തതായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ഈ കാര്യങ്ങൾ ഞാൻ നിങ്ങളോടു കൽപ്പിക്കുകയാണ്.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ταῦτα
  choice: ഇവ
  rationale: നപുംസകലിംഗ ബഹുവചന ചൂണ്ടുപദത്തിന്റെ ബഹുവചനഭാവം നിലനിർത്തുകയും മുമ്പ് പറഞ്ഞ നിർദേശങ്ങളിലേക്കുള്ള സൂചന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐντέλλομαι
  choice: കല്പിക്കുന്നു
  rationale: കല്പിക്കുക, നിർദേശം നൽകുക എന്ന നേരിട്ടുള്ള അർഥവും വർത്തമാനകാലഭാവവും സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ദത്തിവിന്റെ അർഥം മലയാളത്തിലെ ‘കല്പിക്കുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα
  choice: -േണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα-ഉപവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; അതേസമയം ഉള്ളടക്കത്തോടടുത്ത വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കേണ്ടതിന്
  rationale: ἵνα-യോടു ചേർന്ന വർത്തമാന കർത്തരി വിധിലിംഗത്തെ ഉദ്ദേശ്യവാക്യമായി നൽകുന്നു; ആവർത്തനമോ തുടർച്ചയോ അനാവശ്യമായി അധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: ശിഷ്യസമൂഹത്തിനകത്തെ അന്യോന്യ പ്രവർത്തനം ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: കല്പനയും ἵνα-ഉപവാക്യവും തമ്മിലുള്ള ബന്ധം
  choice: യേശു ഈ കാര്യങ്ങൾ കല്പിക്കുന്നതിന്റെ ഉദ്ദേശ്യം അവർ പരസ്പരം സ്നേഹിക്കണമെന്നാണെന്ന് മുഖ്യവാചകം സൂചിപ്പിക്കുന്നു.
  alternative: '“ഞാൻ നിങ്ങളോടു കല്പിക്കുന്നത് ഇതാണ്: പരസ്പരം സ്നേഹിക്കുക” എന്നിങ്ങനെ ἵνα-ഉപവാക്യത്തെ കല്പനയുടെ ഉള്ളടക്കത്തോടടുത്തതായി വായിക്കാം.'
  rationale: ഇവിടെ ἵνα ഉദ്ദേശ്യമോ ഉദ്ദേശിച്ച ഫലമോ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; എങ്കിലും യോഹന്നാന്റെ പ്രയോഗത്തിൽ അത് വിശദീകരണപരമായ ഉള്ളടക്കത്തോടടുത്തു വരാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇവ’ മൂലത്തിലെ ബഹുവചന ചൂണ്ടുപദത്തെ സംരക്ഷിക്കുന്നു; ‘പരസ്പരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ അന്യോന്യപ്രയോഗമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
