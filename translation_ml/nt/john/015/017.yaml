  terminology: “പരസ്പരം സ്നേഹിക്കേണ്ടതിന്” is an appropriate formal rendering of the intended purpose, and “കൽപ്പിക്കുന്നു” preserves the direct force of ἐντέλλομαι. “പരസ്പരം” naturally conveys reciprocal love.
