id: JHN.15.23
reference: John 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: ml
  text: എന്നെ വെറുക്കുന്നവൻ എന്റെ പിതാവിനെയും വെറുക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: വെറുക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഇവിടെ നാമപദമായി പ്രവർത്തിച്ച് ആ പ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘വെറുക്കുന്നവൻ’ ഇതിന്റെ സാമാന്യ ഏകവചനബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐμὲ
  choice: എന്നെ
  rationale: നേരിട്ടുള്ള കർമത്തെ സൂചിപ്പിക്കുന്ന സർവനാമം. ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ വാക്യാരംഭസ്ഥാനത്താൽ മതിയായ രീതിയിൽ പ്രകടമാകുന്നു.
- source_word: μισῶν / μισεῖ
  choice: വെറുക്കുന്നവൻ / വെറുക്കുന്നു
  rationale: μισέω എന്നത് ‘വെറുക്കുക’ എന്നാണ്. ഒരേ ധാതു രണ്ടിടത്തും ഉപയോഗിച്ച് ഗ്രീക്കിലെ പദാവർത്തനം നിലനിർത്തുന്നു; മലയാളത്തിലെ വർത്തമാനകാലരൂപം പൊതുവായ പ്രസ്താവനയ്ക്കു യോജിക്കുന്നു.
- source_word: καὶ
  choice: -യെയും
  rationale: ഇവിടെ καί രണ്ടാമത്തെ കർമത്തോട് ‘കൂടി/also’ എന്ന അർഥം ചേർക്കുന്നു. ‘പിതാവിനെയും’ എന്ന രൂപം, യേശുവിനെ വെറുക്കുന്നത് പിതാവിനെയും വെറുക്കുന്നതാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν πατέρα μου
  choice: എന്റെ പിതാവിനെ
  rationale: πατήρ + μου സ്വാഭാവികമായി ‘എന്റെ പിതാവ്’ എന്നു പരിഭാഷപ്പെടുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന യേശുവിന്റെ ബന്ധപരമായ അഭിസംബോധനയ്ക്ക് ‘പിതാവ്’ എന്ന മാന്യവും നിലവാരമുള്ളതുമായ പദം യോജിക്കുന്നു.
theological_decisions:
- issue: ‘പിതാവ്’ എന്നത് ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബന്ധപരമായ വിശേഷണം
  choice: എന്റെ പിതാവ്
  alternative: എന്റെ അപ്പൻ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഇത് യേശുവും ദൈവവും തമ്മിലുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘പിതാവ്’ ആ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്ന ഔപചാരികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ രൂപമാണ്; അധിക വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തര ഘടനയും ‘വെറുക്കുക’ എന്ന പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തി; വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലുകൾ ഒഴിവാക്കി.
