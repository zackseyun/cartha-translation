  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ നാമവൽക്കരിക്കപ്പെട്ട വർത്തമാന കൃദന്തം (ὁ ... μισῶν), നേരിട്ടുള്ള കർമം (ἐμέ), ആവർത്തിക്കുന്ന μισέω, കൂടാതെ καί-യുടെ ഉൾച്ചേർക്കൽ എന്നിവയെല്ലാം കൃത്യമായി പ്രതിഫലിക്കുന്നു. ‘പിതാവിനെയും’ എന്ന രൂപം രണ്ടാമത്തെ കർമത്തോട് ‘also’ എന്ന ഉൾച്ചേർക്കൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
  naturalness: ‘എന്നെ വെറുക്കുന്നവൻ എന്റെ പിതാവിനെയും വെറുക്കുന്നു’ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. പൊതുവായ/സാമാന്യ ഏകവചനപ്രസ്താവനയ്ക്ക് ‘വെറുക്കുന്നവൻ’ യോജിക്കുന്നു.
  terminology: ‘വെറുക്കുക’ μισέω-യുടെ ശക്തി നിലനിർത്തുകയും രണ്ട് സ്ഥാനങ്ങളിലുമുള്ള പദാവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘എന്റെ പിതാവ്’ യോഹന്നാനിലെ ദൈവസൂചകമായ ബന്ധപ്രയോഗത്തിന് യോജിച്ച ഔപചാരിക പദമാണ്; മലയാളത്തിൽ വലിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ അധിക അടയാളപ്പെടുത്തൽ ആവശ്യമില്ല.
