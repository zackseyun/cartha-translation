id: JHN.15.12
reference: John 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: ml
  text: 'ഇതാണ് എന്റെ കൽപ്പന: ഞാൻ നിങ്ങളെ സ്നേഹിച്ചതുപോലെ നിങ്ങൾ പരസ്പരം സ്നേഹിക്കണം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: ഇതാണ് എന്റെ കല്പന
  rationale: നിർദേശക സർവനാമത്തിന്റെ ഊന്നലും യേശുവിന്റെ അധികാരത്തോടുകൂടിയ ἐντολή എന്ന പദത്തിന്റെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: നിങ്ങൾ പരസ്പരം സ്നേഹിക്കണം എന്നത്
  rationale: ഇവിടെ ἵνα കല്പനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. വർത്തമാനകാല ക്രിയാരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ജീവിതരീതിയെ അതിവ്യാഖ്യാനം ചെയ്യാതെ ‘സ്നേഹിക്കണം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: യേശുവിന്റെ സ്നേഹമാണ് ശിഷ്യരുടെ പരസ്പരസ്നേഹത്തിന്റെ മാതൃകയും അളവുമെന്ന താരതമ്യബലം വ്യക്തമാക്കുന്നു.
- source_word: ἠγάπησα ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ സ്നേഹിച്ചത്
  rationale: ഗ്രീക്ക് ഏറിസ്റ്റിനെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലരൂപത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ἀγαπάω എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സ്നേഹിക്കുക
  alternative: പ്രേമിക്കുക
  rationale: ‘സ്നേഹിക്കുക’ ആധുനിക മലയാളത്തിൽ വിശാലവും സ്വാഭാവികവുമായ പദമാണ്; പ്രത്യേക മതവിഭാഗപരമായ അർഥം ചേർക്കാതെ പദത്തിന്റെ നൈതികവും ബന്ധപരവുമായ ശക്തി നിലനിർത്തുന്നു.
- issue: καθὼς സൂചിപ്പിക്കുന്ന താരതമ്യത്തിന്റെ ശക്തി
  choice: പോലെതന്നെ
  alternative: പോലെ
  rationale: യേശുവിന്റെ സ്നേഹത്തെ വെറും ഉദാഹരണമായി മാത്രമല്ല, താരതമ്യത്തിന്റെ വ്യക്തമായ മാനദണ്ഡമായി വാക്യം അവതരിപ്പിക്കുന്നതിനെ ഇത് പ്രകടമാക്കുന്നു; അതിലപ്പുറം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കല്പന’ അധികാരബലം നിലനിർത്തുന്നു; ‘പരസ്പരം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
