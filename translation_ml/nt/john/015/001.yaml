id: JHN.15.1
reference: John 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: ml
  text: “ഞാനാണ് യഥാർഥ മുന്തിരിവള്ളി; എന്റെ പിതാവാണ് കൃഷിക്കാരൻ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുന്തിരിവള്ളി പരിപാലിക്കുന്നവൻ” അല്ലെങ്കിൽ “തോട്ടക്കാരൻ.” γεωργός എന്ന ഗ്രീക്ക് പദം നിലം കൃഷിചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ മുന്തിരിവള്ളിയുടെ രൂപകസന്ദർഭത്തിൽ അതിന് കൂടുതൽ പ്രത്യേകമായ അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: ഞാനാണ്
  rationale: ഊന്നലുള്ള ഒന്നാംപുരുഷ സർവനാമവും ‘ആകുന്നു’ എന്ന ക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു.
- source_word: ἄμπελος
  choice: മുന്തിരിവള്ളി
  rationale: സന്ദർഭത്തിലെ സസ്യരൂപകം വ്യക്തമായി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദമാണ്.
- source_word: ἀληθινή
  choice: യഥാർഥ
  rationale: ‘സത്യമായ’, ‘യഥാർഥമായ’, ‘മ genuine ആയ’ എന്നീ അർഥസാധ്യതകളിൽ, യോഹന്നാനിലെ ദൈവിക യാഥാർഥ്യത്തിന്റെ ധ്വനി നിലനിർത്തിക്കൊണ്ട് തെറ്റില്ലാത്തതെന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുന്നു.
- source_word: πατήρ μου
  choice: എന്റെ പിതാവ്
  rationale: യേശുവും ദൈവവും തമ്മിലുള്ള വ്യക്തിപരമായ പിതൃബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γεωργός
  choice: അതിന്റെ കൃഷിക്കാരൻ
  rationale: ഭൂമി കൃഷിചെയ്യുന്നവൻ എന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർഥം സംരക്ഷിക്കുകയും ‘അതിന്റെ’ എന്നതിലൂടെ മുന്തിരിവള്ളിയുടെ പ്രത്യേക സന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ‘ഞാനാണ്’ വചനത്തിലെ രൂപകാത്മക തിരിച്ചറിയൽ
  choice: ‘ഞാനാണ് യഥാർഥ മുന്തിരിവള്ളി’ എന്ന് രൂപകം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘ഞാനാണ് യഥാർഥമായ മുന്തിരിച്ചെടി’
  rationale: വാക്യത്തിലെ രൂപകവും യോഹന്നാനിലെ ‘യഥാർഥ’ എന്ന ദൈവശാസ്ത്രപരമായ ധ്വനിയും വിശദീകരണം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: പിതാവിനെ γεωργός എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: ‘അതിന്റെ കൃഷിക്കാരൻ’
  alternative: ‘മുന്തിരിത്തോട്ടക്കാരൻ’ / ‘തോട്ടക്കാരൻ’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പൊതുവായ കൃഷിയർഥവും ഉടനെയുള്ള മുന്തിരിവള്ളി-സന്ദർഭവും ഒരുപോലെ നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഞാനാണ്’ എന്ന രൂപം മൂലപാഠത്തിലെ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു; ‘യഥാർഥ’ എന്നത് യോഹന്നാനിലെ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
