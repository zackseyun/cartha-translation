id: JHN.15.5
reference: John 15:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: ml
  text: “ഞാൻ മുന്തിരിവള്ളിയാണ്; നിങ്ങൾ കൊമ്പുകളാണ്. ആർ എന്നിൽ നിലനിൽക്കുന്നുവോ[a], അവനിൽ ഞാനും നിലനിൽക്കുന്നു; അവൻ[b] ധാരാളം ഫലം കായ്ക്കുന്നു. കാരണം, എന്നിൽനിന്ന് വേർപെട്ട് നിങ്ങൾക്ക് ഒന്നും ചെയ്യാൻ കഴിയില്ല.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആർ എന്നിൽ വസിക്കുന്നുവോ.’ പ്രത്യേകിച്ച് യോഹന്നാന്റെ രചനകളിൽ ഈ ഗ്രീക്ക് ക്രിയ തുടർന്നുനിൽക്കുന്ന ബന്ധത്തെ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ പുല്ലിംഗ ഏകവചനരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ യേശുവിൽ നിലനിൽക്കുന്ന ഏതൊരു ശിഷ്യനെയും പ്രതിനിധീകരിക്കുന്ന പൊതുവായ പ്രസ്താവനയാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: മുന്തിരിവള്ളി
  rationale: മുന്തിരിച്ചെടിയെയും അതിന്റെ കൊമ്പുകളെയും ആസ്പദമാക്കിയ രൂപകം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ‘വള്ളി’ മാത്രം എന്നതിനെക്കാൾ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: κλήματα
  choice: കൊമ്പുകൾ
  rationale: മുന്തിരിവള്ളിയുടെ ശാഖകളെ സൂചിപ്പിക്കുന്ന സാധാരണവും എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളപദം; രൂപകം സാങ്കേതികതയില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ὁ μένων
  choice: ആർ ... നിലനിൽക്കുന്നുവോ
  rationale: തുടർച്ചയായ ബന്ധത്തിൽ തുടരുക എന്ന യോഹന്നാനീയ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും പൊതുവായി ഏതൊരു ശിഷ്യനെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: എന്നിൽ ... അവനിൽ
  rationale: പരസ്പരമായ ഉള്ളിലിരിപ്പിന്റെ ശക്തമായ ഭാഷയെ ‘കൂടെ’ എന്നു ദുർബലപ്പെടുത്താതെ ഗ്രീക്കിലെ ἐν നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: ‘and I’ എന്ന പരസ്പരഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭം ആവശ്യപ്പെടുന്നതിനാൽ ‘നിലനിൽക്കുന്നു’ എന്ന ക്രിയ ആവർത്തിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: φέρει καρπὸν πολύν
  choice: ധാരാളം ഫലം കായ്ക്കുന്നു
  rationale: മുന്തിരിവള്ളിയുടെ രൂപകത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണ്; πολύν എന്ന അളവിനെയും സംരക്ഷിക്കുന്നു.
- source_word: χωρὶς ἐμοῦ
  choice: എന്നിൽനിന്ന് വേർപെട്ട്
  rationale: വെറും സഹായമില്ലായ്മയെക്കാൾ ക്രിസ്തുവിൽനിന്നുള്ള വേർപാടാണ് ആശയം എന്ന് വ്യക്തമാക്കിക്കൊണ്ട് χωρίς എന്നതിന്റെ ബന്ധപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: നിങ്ങൾക്ക് ഒന്നും ചെയ്യാൻ കഴിയില്ല
  rationale: നിരോധനമല്ല, കഴിവില്ലായ്മയാണ് ഗ്രീക്ക് പ്രസ്താവിക്കുന്നത്; മലയാളത്തിലെ നിഷേധഘടനയിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: യോഹന്നാനീയ പരസ്പര ഉള്ളിലിരിപ്പിന്റെ ഭാഷ
  choice: ‘എന്നിൽ ... അവനിൽ’ എന്ന രൂപം നിലനിർത്തി.
  alternative: ‘എന്നോടൊപ്പം ... അവനോടൊപ്പം’
  rationale: ‘കൂടെ’ എന്ന പരിഭാഷ ബന്ധത്തെ മാത്രം സൂചിപ്പിച്ച് ഗ്രീക്കിലെ പരസ്പര ഉള്ളിലിരിപ്പിന്റെ ആഴം കുറയ്ക്കും; ‘ഇൽ’ എന്ന രൂപം വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ആഴവും വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: αὐτῷ / οὗτος എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധാനപ്രയോഗം
  choice: മുഖ്യവാക്യത്തിൽ ‘അവനിൽ’, ‘അവൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി; പൊതുവായ പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആ വ്യക്തിയിൽ’, ‘ആ വ്യക്തി’ അല്ലെങ്കിൽ ബഹുവചനം
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ഏകവചനം സംരക്ഷിക്കുമ്പോഴും പ്രസ്താവന ഏതൊരു ശിഷ്യനും ബാധകമാണെന്നത് അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: χωρὶς ἐμοῦ സൂചിപ്പിക്കുന്ന ആശ്രിതത്വം
  choice: ‘എന്നിൽനിന്ന് വേർപെട്ട്’
  alternative: ‘എന്നെ കൂടാതെ’
  rationale: യേശുവിന്റെ സഹായം ഇല്ലാതെ എന്നതിലുപരി അവനുമായുള്ള ജീവബന്ധത്തിൽനിന്നുള്ള വേർപാടാണ് മുന്തിരിവള്ളി-കൊമ്പ് രൂപകത്തിന്റെ പശ്ചാത്തലത്തിൽ മുൻനിൽക്കുന്നത്; എന്നിരുന്നാലും വാക്യത്തിന്റെ സമ്പൂർണമായ അസമർഥതാവാദം മൃദൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മുന്തിരിവള്ളി—കൊമ്പുകൾ—ഫലം കായ്ക്കുക’ എന്ന രൂപകശൃംഖല വ്യക്തമായി സൂക്ഷിച്ചു. പരമ്പരാഗതമായെങ്കിലും ഇന്ന് അപരിചിതമാകാവുന്ന പദങ്ങൾ ഒഴിവാക്കി; വാക്യത്തിന്റെ ഗൗരവവും യോഹന്നാനീയ ബന്ധഭാഷയും നിലനിർത്തി.
