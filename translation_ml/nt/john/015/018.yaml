source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: ml
  text: ലോകം നിങ്ങളെ വെറുക്കുന്നുവെങ്കിൽ, അത് നിങ്ങളെക്കാൾ മുമ്പേ എന്നെ വെറുത്തിട്ടുണ്ടെന്ന് അറിഞ്ഞുകൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അത് ആദ്യം എന്നെ വെറുത്തിട്ടുണ്ട്, നിങ്ങളെക്കാൾ മുമ്പേ.’ ഗ്രീക്കിൽ ‘ആദ്യം’ എന്ന പദം ‘നിങ്ങൾ’ എന്ന പദത്തോടൊപ്പം കാലക്രമത്തിലുള്ള മുൻഗണനയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ദൈവത്തോടുള്ള എതിർപ്പിൽ നിൽക്കുന്ന മനുഷ്യലോകം എന്ന നിഷേധാത്മക ധ്വനി പലപ്പോഴും ഉണ്ടെങ്കിലും, അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ വിശാലത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദമാണ് ‘ലോകം’.
- source_word: μισεῖ
  choice: വെറുക്കുന്നെങ്കിൽ
  rationale: വർത്തമാനകാലത്തിന്റെ പൊതുവായ/തുടരുന്ന സ്വഭാവം വ്യവസ്ഥാവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γινώσκετε
  choice: അറിഞ്ഞുകൊള്ളുക
  rationale: രൂപപരമായി നിർദേശമോ പ്രസ്താവനയോ ആകാമെങ്കിലും, സന്ദർഭത്തിൽ ഇത് നിർദേശാത്മക ആഹ്വാനമായി കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: πρῶτον ὑμῶν
  choice: നിങ്ങൾക്കുമുമ്പ്
  rationale: ὑμῶν-നോടുകൂടിയ πρῶτον കാലക്രമത്തിലുള്ള മുൻഗണന സൂചിപ്പിക്കുന്നു; ‘നിങ്ങൾക്കുമുമ്പ്’ അത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μεμίσηκεν
  choice: വെറുത്തിട്ടുണ്ട്
  rationale: പൂർണ്ണകാലരൂപം കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഇപ്പോഴും പ്രസക്തമായ ഫലം സൂചിപ്പിക്കുന്നു; ‘വെറുത്തിട്ടുണ്ട്’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐμὲ
  choice: എന്നെ
  rationale: മൂലത്തിലെ ഊന്നൽ പദക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ദൈവശാസ്ത്രത്തിൽ κόσμος എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ലോകം’ എന്നു നിലനിർത്തുക
  alternative: ‘ദൈവത്തിനെതിരെ നിൽക്കുന്ന മനുഷ്യലോകം’ അല്ലെങ്കിൽ ‘ലോകവ്യവസ്ഥ’
  rationale: യേശുവിനോടും ശിഷ്യരോടുമുള്ള എതിർപ്പാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എങ്കിലും വ്യാഖ്യാനാത്മക വിപുലീകരണം ചേർക്കാതെ ‘ലോകം’ എന്നു നൽകുന്നത് മൂലത്തിലെ വിശാലതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: γινώσκετε എന്ന രൂപത്തിന്റെ നിർദേശാത്മകമോ പ്രസ്താവനാത്മകമോ ആയ വായന
  choice: ‘അറിഞ്ഞുകൊള്ളുക’ എന്ന നിർദേശാത്മക വായന
  alternative: ‘നിങ്ങൾ അറിയുന്നു’ എന്ന പ്രസ്താവനാത്മക വായന
  rationale: രൂപം രണ്ടുവിധത്തിൽ മനസ്സിലാക്കാമെങ്കിലും, വ്യവസ്ഥാവാക്യത്തിനുശേഷമുള്ള പ്രബോധനമായി നിർദേശാത്മക വായനയാണ് സന്ദർഭത്തിൽ കൂടുതൽ യോജിച്ചത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അറിഞ്ഞുകൊള്ളുക’ പ്രബോധനാത്മക ഗൗരവം നിലനിർത്തുന്നു; ‘ലോകം’ എന്നത് വിശദീകരണപരമായ കൂട്ടിച്ചേർക്കലുകളില്ലാതെ യോഹന്നാനിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
