id: JHN.15.21
reference: John 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: ml
  text: എന്നാൽ എന്റെ നാമം നിമിത്തം അവർ ഇതെല്ലാം നിങ്ങളോടു ചെയ്യും[a]; കാരണം, എന്നെ അയച്ചവനെ അവർ അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങൾക്കെതിരെ ചെയ്യും.’ ഗ്രീക്ക് പ്രയോഗം ശിഷ്യന്മാരെ ലക്ഷ്യമാക്കിയുള്ള ശത്രുതാപരമായ പ്രവൃത്തികളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ταῦτα πάντα
  choice: ഇതെല്ലാം
  rationale: ചൂണ്ടിക്കാട്ടലും സമഗ്രതയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ποιήσουσιν
  choice: ചെയ്യും
  rationale: ഭാവികാല സജീവ ക്രിയയുടെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘പീഡിപ്പിക്കും’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളോടു
  rationale: ശിഷ്യന്മാരിലേക്കു തിരിഞ്ഞുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും സന്ദർഭത്തിലെ ശത്രുത ഉൾക്കൊള്ളാൻ കഴിയുകയും ചെയ്യുന്നു; ‘നിങ്ങൾക്കെതിരെ’ എന്ന ശക്തമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: διὰ τὸ ὄνομά μου
  choice: എന്റെ നാമം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണത്തെ വ്യക്തമാക്കുകയും ‘നാമം’ എന്നതിന്റെ വ്യക്തിത്വപരവും അധികാരപരവുമായ ഭാരം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐκ οἴδασιν
  choice: അവർ അറിയുന്നില്ല
  rationale: യോഹന്നാനിലെ ബന്ധപരമായ അറിവിനെയും സാധാരണ അറിവിനെയും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന ലളിതമായ പ്രയോഗം.
- source_word: τὸν πέμψαντά με
  choice: എന്നെ അയച്ചവനെ
  rationale: നാമവൽക്കരിച്ച കൃദന്തരൂപം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: എന്നെ അയച്ചവനെ
  alternative: എന്നെ അയച്ച പിതാവിനെ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ പിതാവാണ് സൂചിതവ്യക്തിയെങ്കിലും ഗ്രീക്ക് പാഠം ‘പിതാവ്’ എന്നു വ്യക്തമാക്കുന്നില്ല; അതിനാൽ സൂചന അതേപടി നിലനിർത്തുന്നു.
- issue: διὰ τὸ ὄνομά μου എന്നതിലെ ‘നാമം’
  choice: എന്റെ നാമം നിമിത്തം
  alternative: ഞാൻ ആരായിരിക്കുന്നുവെന്നതിനാൽ
  rationale: അർഥം വിശദീകരിച്ച് തീർക്കാതെ, യേശുവിന്റെ വ്യക്തിത്വത്തെയും അധികാരത്തെയും പ്രതിനിധാനം ചെയ്യുന്ന ‘നാമം’ എന്ന യോഹന്നാനീയ ഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമം നിമിത്തം’ എന്നത് തിരുവെഴുത്തിലെ ആശയഭാരം നിലനിർത്തുന്നതിനൊപ്പം സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതാണ്. മുഖ്യപാഠത്തിലെ ‘നിങ്ങളോടു’ ഗ്രീക്കിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ശത്രുതാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
