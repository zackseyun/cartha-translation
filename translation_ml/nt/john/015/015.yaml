revisions:
- from: ഇനി ഞാൻ നിങ്ങളെ അടിമകൾ[a] എന്നു വിളിക്കുന്നില്ല; കാരണം, യജമാനൻ[b] ചെയ്യുന്നത് എന്താണെന്ന് അടിമ അറിയുന്നില്ല. എന്നാൽ ഞാൻ നിങ്ങളെ സുഹൃത്തുക്കൾ എന്നു വിളിച്ചിരിക്കുന്നു; കാരണം, എന്റെ പിതാവിൽനിന്ന് കേട്ടതെല്ലാം ഞാൻ നിങ്ങളെ അറിയിച്ചിരിക്കുന്നു.
  to: ഇനി ഞാൻ നിങ്ങളെ അടിമകൾ[a] എന്നു വിളിക്കുന്നില്ല; കാരണം, അവന്റെ യജമാനൻ[b] ചെയ്യുന്നത് എന്താണെന്ന് അടിമ അറിയുന്നില്ല. എന്നാൽ ഞാൻ നിങ്ങളെ സുഹൃത്തുക്കൾ എന്നു വിളിച്ചിരിക്കുന്നു; കാരണം, എന്റെ പിതാവിൽനിന്ന് കേട്ടതെല്ലാം ഞാൻ നിങ്ങളെ അറിയിച്ചു.
  rationale: The revision makes the possessive αὐτοῦ explicit and changes the final verb from a Malayalam perfect to the simple completed form ‘അറിയിച്ചു,’ matching the Greek aorist ἐγνώρισα. No doctrinal interpretation or unnecessary alteration has been introduced.
