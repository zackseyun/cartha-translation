id: JHN.15.15
reference: John 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: ml
  text: ഇനി ഞാൻ നിങ്ങളെ അടിമകൾ[a] എന്നു വിളിക്കുന്നില്ല; കാരണം, അവന്റെ യജമാനൻ[b] ചെയ്യുന്നത് എന്താണെന്ന് അടിമ അറിയുന്നില്ല. എന്നാൽ ഞാൻ നിങ്ങളെ സുഹൃത്തുക്കൾ എന്നു വിളിച്ചിരിക്കുന്നു; കാരണം, എന്റെ പിതാവിൽനിന്ന് കേട്ടതെല്ലാം ഞാൻ നിങ്ങളെ അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് doulos എന്ന പദത്തിന് ‘അടിമ’, ‘ദാസൻ’, ‘സേവകൻ’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ സൗഹൃദത്തോടു വിരുദ്ധമായി അധീനപദവി ഊന്നിപ്പറയുന്നതിനാൽ ‘അടിമ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ കർത്താവ്/നാഥൻ’. ഇവിടെ ഗൃഹപരമായ യജമാനൻ–അടിമ ബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘യജമാനൻ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ഇനി ... ഇല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന നിലയിൽനിന്നുള്ള മാറ്റം സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγω ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ ... എന്നു വിളിക്കുന്നു
  rationale: ഇവിടെ λέγω വെറും ‘പറയുക’ എന്നല്ല, ഒരാളെ ഒരു നിലയിൽ വിളിക്കുകയോ വിശേഷിപ്പിക്കുകയോ ചെയ്യുന്നതാണ്.
- source_word: δούλους / δοῦλος
  choice: അടിമകൾ / അടിമ
  rationale: സുഹൃത്തുക്കൾ എന്നതിനോടുള്ള വൈരുധ്യവും യജമാനനോടുള്ള അധീനബന്ധവും ഇവിടെ പ്രധാനമായതിനാൽ ‘ദാസർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ മൂലപദത്തിന്റെ സാമൂഹിക അസമത്വം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οἶδεν τί ποιεῖ
  choice: ചെയ്യുന്നത് എന്താണെന്ന് ... അറിയുന്നില്ല
  rationale: οἶδα അറിവിനെയും τί ποιεῖ ഇപ്പോൾ നടക്കുന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτοῦ ὁ κύριος
  choice: യജമാനൻ
  rationale: ഇത് ദൈവികമായ ‘കർത്താവ്’ എന്ന പദവിയല്ല, യജമാനൻ–അടിമ ബന്ധത്തിലെ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἴρηκα φίλους
  choice: സുഹൃത്തുക്കൾ എന്നു വിളിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലം മുൻപ് നൽകിയ വിശേഷണം ഇപ്പോഴും നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്നു; ‘വിളിച്ചിരിക്കുന്നു’ ആ ഫലനില കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: πάντα ἃ
  choice: കേട്ടതെല്ലാം
  rationale: ‘എല്ലാം’ എന്ന സമഗ്രത സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: എന്റെ പിതാവിൽനിന്ന് കേട്ടത്
  rationale: ἀκούω എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുകയും παρά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉറവിടം ‘പിതാവിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγνώρισα ὑμῖν
  choice: ഞാൻ നിങ്ങളെ അറിയിച്ചിരിക്കുന്നു
  rationale: γνωρίζω എന്നത് അറിയിക്കുക/വെളിപ്പെടുത്തുക എന്നർഥം നൽകുന്നു. പൂർത്തിയായ വെളിപ്പെടുത്തലിന്റെ ഇപ്പോഴുള്ള പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ ഈ രൂപം പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിലെ രൂപം ഇവിടെ സിംപിൾ പാസ്റ്റ് (aorist) ആണെന്നതിനാൽ ‘അറിയിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം.
theological_decisions:
- issue: ശിഷ്യത്വത്തിന്റെയും പദവിയുടെയും വൈരുധ്യത്തിൽ δοῦλος എന്നതിന്റെ വിവർത്തനം
  choice: അടിമകൾ
  alternative: ദാസർ / സേവകർ
  rationale: അജ്ഞതയോടുകൂടിയ അധീനപദവിയെയും അറിവ് പങ്കിടുന്ന സൗഹൃദത്തെയും വാക്യം തമ്മിൽ വിരുദ്ധമായി നിർത്തുന്നു. ‘അടിമകൾ’ ഈ സാമൂഹിക അസമത്വം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ഗൃഹബന്ധത്തിന്റെ ഉപമയിൽ κύριος എന്നതിന്റെ വിവർത്തനം
  choice: യജമാനൻ
  alternative: കർത്താവ് / നാഥൻ
  rationale: ഇവിടെ κύριος ദൈവികമോ മശീഹാസംബന്ധമോ ആയ പദവിയല്ല; അടിമയുടെ മേലധികാരിയെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘യജമാനൻ’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- issue: εἴρηκα എന്ന പൂർണകാലത്തിന്റെയും ἐγνώρισα എന്ന aorist-ന്റെയും കാലഭാവം
  choice: വിളിച്ചിരിക്കുന്നു ... അറിയിച്ചിരിക്കുന്നു
  alternative: വിളിച്ചു ... അറിയിച്ചു
  rationale: ആദ്യ ക്രിയയുടെ നിലനിൽക്കുന്ന ഫലം വ്യക്തമായി സൂക്ഷിക്കുന്നു. രണ്ടാമത്തേത് ഗ്രീക്കിൽ aorist ആയിരുന്നാലും വെളിപ്പെടുത്തലിന്റെ ഇപ്പോഴുള്ള ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അറിയിച്ചിരിക്കുന്നു’ ഉപയോഗിച്ചു; സംഭവകേന്ദ്രിതമായ ‘അറിയിച്ചു’ എന്ന വായനയും സാധുവാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അടിമ’ എന്നത് മൂലപദത്തിന്റെ കടുപ്പവും പദവിവ്യത്യാസവും നിലനിർത്തുന്നു; ‘യജമാനൻ’ household/status ഉപമയെ വ്യക്തമായി അറിയിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [b] ‘friends’ എന്നതിന് പിന്നാലെ വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് κύριος/‘master’ എന്നതിനെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ അടയാളം ‘യജമാനൻ’ എന്ന പദത്തിന് പിന്നാലെ ശരിയായി സ്ഥാപിച്ചു.
