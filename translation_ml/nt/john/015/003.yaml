id: JHN.15.3
reference: John 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: ml
  text: ഞാൻ നിങ്ങളോടു സംസാരിച്ച വചനം നിമിത്തം നിങ്ങൾ ഇതിനകം ശുദ്ധരാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഞാൻ നിങ്ങളോടു സംസാരിച്ച വചനം മുഖാന്തരം.’
    reason: διά എന്ന പദപ്രയോഗത്തിന്റെ കാരണപരവും ഉപാധിപരവുമായ സാധ്യതകൾ നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: ഇപ്പോൾത്തന്നെ നിലവിലുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുകയും മുൻവാക്യത്തിലെ വെട്ടിയൊരുക്കൽ/ശുദ്ധീകരണ ദൃശ്യവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിൽ സർവനാമം ഊന്നിപ്പറഞ്ഞിട്ടുണ്ടെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം മതിയായ ഊന്നൽ നൽകുന്നു; ‘നിങ്ങൾ തന്നേ’ എന്ന് ചേർക്കുന്നത് അനാവശ്യമായി ശക്തമാകും.
- source_word: καθαροί
  choice: ശുദ്ധരാണ്
  rationale: ‘നിർമലർ’ എന്നതിനെക്കാൾ ‘ശുദ്ധർ’ ശുദ്ധീകരണ ആശയവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ആത്മീയമോ ധാർമികമോ ആയ അർഥം മുൻകൂട്ടി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: διὰ τὸν λόγον
  choice: വചനം നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണമെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു. അതേസമയം ‘മുഖാന്തരം’ എന്ന ഉപാധിപരമായ വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: λόγον
  choice: വചനം
  rationale: യോഹന്നാനീയ പ്രയോഗശൈലി നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷയാണ്; ‘സന്ദേശം’ അല്ലെങ്കിൽ ‘പഠിപ്പിക്കൽ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ὃν λελάληκα
  choice: സംസാരിച്ച
  rationale: λελάληκα എന്ന perfect രൂപത്തിന്റെ മുൻകാല പ്രവൃത്തിയും തുടരുന്ന ഫലവും മലയാളത്തിൽ സന്ദർഭവും ‘ഇതിനകം’ എന്ന പദവും ചേർന്ന് വ്യക്തമാക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിനായി ലളിതമായ relative construction ഉപയോഗിച്ചു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: സംസാരക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യസൂചക രൂപം; ബഹുവചനം ‘നിങ്ങൾ’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ശുദ്ധിയുടെ സ്വഭാവം
  choice: ഇപ്പോഴുള്ള ആത്മീയ/ധാർമിക ശുദ്ധിയെ സൂചിപ്പിക്കുന്ന തുറന്ന രൂപത്തിൽ പ്രസ്താവന നിലനിർത്തി.
  alternative: ഇത് പ്രത്യേകമായി സാക്രമെന്റൽ ശുദ്ധീകരണമെന്നോ നീതീകരണത്തിന്റെ ന്യായവിധിപരമായ പ്രഖ്യാപനമെന്നോ വ്യക്തമാക്കുക.
  rationale: മുന്തിരിവള്ളിയുടെയും വെട്ടിയൊരുക്കലിന്റെയും സമീപസന്ദർഭത്തിൽ, യേശു തന്റെ സംസാരിച്ച വചനവുമായി അവരുടെ ശുദ്ധിയെ ബന്ധിപ്പിക്കുന്നു. പിൽക്കാല സാങ്കേതിക സിദ്ധാന്തവിഭാഗത്തിലേക്ക് അർഥം ചുരുക്കാതെ ഉപമയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: διάയുടെ കാരണപരമോ ഉപാധിപരമോ ആയ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നിമിത്തം’ എന്ന കാരണപരമായ അർഥം സ്വീകരിച്ചു.
  alternative: ‘മുഖാന്തരം’ എന്ന ഉപാധിപരമായ അർഥം.
  rationale: διά + accusative സാധാരണയായി കാരണം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ സന്ദർഭത്തിൽ വചനം ശുദ്ധീകരണത്തിന്റെ ഉപാധിയാണെന്ന വായനയും ഭാഷാപരമായി സാധ്യമാണ്, അതിനാൽ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യോഹന്നാനീയ ‘വചനം’ എന്ന പ്രയോഗവും ‘ശുദ്ധർ’ എന്ന ശുദ്ധീകരണബന്ധവും സംരക്ഷിച്ചു; വാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്തി.
