source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: ml
  text: 'എന്നാൽ അവരുടെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്ന വചനം നിറവേറേണ്ടതിന് ഇതു സംഭവിച്ചു: “അവർ കാരണമില്ലാതെ എന്നെ വെറുത്തു.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്നാൽ അവരുടെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്ന വചനം നിറവേറേണ്ടതിന്.” ഗ്രീക്കിൽ മുഖ്യവാക്യം വ്യക്തമാക്കാതെ വിട്ടിരിക്കുന്നു; സന്ദർഭത്തിൽനിന്ന് “ഇതു സംഭവിച്ചു” എന്നു മനസ്സിലാക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ ന്യായപ്രമാണം” എന്നതിലെ “ന്യായപ്രമാണം” ഇവിടെ യഹൂദതിരുവെഴുത്തുകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ഉദ്ധരണി സങ്കീർത്തനങ്ങളിൽ നിന്നാണ് (സങ്കീ. 35:19; 69:4 കാണുക).
    reason: cross_reference
  - marker: c
    text: അഥവാ, “ഒരു കാരണവുമില്ലാതെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἵνα πληρωθῇ
  choice: നിറവേറേണ്ടതിന്
  rationale: ἵνα + ഉപാധിക്രിയയുടെ ഉദ്ദേശ്യം/ഫലം എന്ന അർഥവ്യാപ്തി തുറന്നുവെക്കുകയും യോഹന്നാനിലെ തിരുവെഴുത്തുനിവൃത്തി പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ λόγος
  choice: വചനം
  rationale: ഇവിടെ λόγος ഒരു പ്രത്യേക തിരുവെഴുത്തുപ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; യോഹന്നാൻ 1-ലെ ദൈവശാസ്ത്രപരമായ ‘വചനം’ എന്ന വിശേഷപ്രയോഗം ഉദ്ദേശിക്കുന്നില്ലെങ്കിലും ഉദ്ധരണിസൂത്രത്തിൽ ‘വചനം’ സ്വാഭാവികമാണ്.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: അവരുടെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്ന
  rationale: സമ്പൂർണ കർമണി കൃദന്തരൂപം ഇപ്പോഴും എഴുതപ്പെട്ട നിലയിൽ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; αὐτῶν എന്നത് ‘അവരുടെ’ എന്നു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: νόμῳ
  choice: ന്യായപ്രമാണം
  rationale: ഗ്രീക്കിലെ νόμος എന്ന പദം സംരക്ഷിക്കുന്നു. ഇവിടെ ഉദ്ധരണി സങ്കീർത്തനങ്ങളിൽ നിന്നായതിനാൽ ഇത് യഹൂദതിരുവെഴുത്തുകളുടെ വിശാല അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; ആ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: തിരുവെഴുത്തുവചനത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ὅτι മലയാളത്തിൽ ഉദ്ധരണിക്ക് മുമ്പുള്ള ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἐμίσησάν με
  choice: അവർ എന്നെ വെറുത്തു
  rationale: അയോറിസ്റ്റ് നിർദേശകരൂപം ഉദ്ധരണിയിൽ ലളിതമായ ഭൂതകാലമായി കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: δωρεάν
  choice: കാരണമില്ലാതെ
  rationale: ‘യാതൊരു ന്യായമായ കാരണവുമില്ലാതെ’ എന്ന അർഥം സംക്ഷിപ്തവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനത്തിൽ നിന്നുള്ള ഉദ്ധരണിയിൽ ‘അവരുടെ ന്യായപ്രമാണം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: νόμος എന്നതിന് ‘ന്യായപ്രമാണം’ എന്നു നൽകി, ഇവിടെ സങ്കീർത്തനങ്ങൾ ഉൾപ്പെടുന്ന യഹൂദതിരുവെഴുത്തുകളെ വിശാലമായി സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: പ്രധാനപാഠത്തിൽ ‘തിരുവെഴുത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലത്തിലെ νόμος എന്ന പദം മാറ്റാതെ നിലനിർത്തുകയും, അതിന്റെ ഇവിടെ ആവശ്യമായ വിശാല അർഥം വിശദീകരിക്കുകയും ചെയ്യുന്നു; അതുവഴി പദരൂപവും ആശയവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: ἀλλ’ ἵνα എന്ന അപൂർണമായി നിൽക്കുന്ന ഗ്രീക്ക് ഘടനയിൽ സൂചിതമായ മുഖ്യവാക്യം ചേർക്കൽ
  choice: സ്വാഭാവികമായ മലയാളത്തിനായി ‘ഇതു സംഭവിച്ചു’ എന്നു ചേർക്കുക.
  alternative: ‘എന്നാൽ അവരുടെ ന്യായപ്രമാണത്തിൽ എഴുതിയിരിക്കുന്ന വചനം നിറവേറേണ്ടതിന്’ എന്നിങ്ങനെ അപൂർണഘടന അതേപടി വിടുക.
  rationale: ഗ്രീക്കിൽ മുഖ്യവാക്യം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടതാണ്. മലയാളത്തിൽ അത് ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം കൊണ്ടുവരാതെ അർഥം വ്യക്തവും വാക്യം സമ്പൂർണവുമാക്കുന്നു.
- issue: ἵνα πληρωθῇ എന്നതിലെ ഉദ്ദേശ്യം–ഫലം ഭാവം
  choice: ‘നിറവേറേണ്ടതിന്’ എന്നു പരിഭാഷപ്പെടുത്തി ഇരുവശത്തേക്കുമുള്ള അർഥസാധ്യത നിലനിർത്തുക.
  alternative: ‘നിറവേറാനായി’ എന്ന ശുദ്ധ ഉദ്ദേശ്യഭാവമോ ‘അങ്ങനെ നിറവേറി’ എന്ന ശുദ്ധ ഫലഭാവമോ നൽകുക.
  rationale: ἵνα ഘടന ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വഹിക്കാം; മലയാളത്തിൽ അതിനെ അനാവശ്യമായി ഒരുവശത്തേക്ക് തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായപ്രമാണം’, ‘വചനം’, ‘നിറവേറുക’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പുകുറികളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
