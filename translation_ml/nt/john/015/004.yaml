id: JHN.15.4
reference: John 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: ml
  text: എന്നിൽ നിലനിൽക്കുക[a]; ഞാനും നിങ്ങളിൽ. മുന്തിരിവള്ളിയിൽ നിലനിൽക്കാതെ ഒരു കൊമ്പിന് സ്വയം ഫലം കായ്ക്കാൻ കഴിയാത്തതുപോലെ, എന്നിൽ നിലനിൽക്കാതെ നിങ്ങൾക്കും കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്നിൽ വസിക്കുക.” μένω എന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് തുടരുക, സ്ഥിരമായി വസിക്കുക, ചേർന്നുനിൽക്കുക എന്നീ അർത്ഥങ്ങളും ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: നിലനിൽക്കുക / നിലനിൽക്കാതെ
  rationale: μένω എന്ന ആവർത്തിത മുഖ്യപദത്തിന്റെ തുടരുക, ചേർന്നുനിൽക്കുക, ബന്ധത്തിൽ സ്ഥിരമായി വസിക്കുക എന്നീ അർത്ഥവ്യാപ്തികൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: ἐν ἐμοί
  choice: എന്നിൽ
  rationale: ἐν എന്നതിന്റെ അകത്തായിരിക്കുക/പങ്കാളിത്തം എന്ന രൂപകം നിലനിർത്തുന്നു; ‘എന്നോടൊപ്പം’ എന്നു പറഞ്ഞ് വെറും സാമീപ്യമായി ചുരുക്കുന്നില്ല.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: ഞാനും നിങ്ങളിൽ
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ‘ഞാനും നിങ്ങളിൽ നിലനിൽക്കും’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംക്ഷിപ്തമായ പരസ്പര അന്തർവാസപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τὸ κλῆμα
  choice: ഒരു കൊമ്പ്
  rationale: മുന്തിരിവള്ളിയുടെ ശാഖയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: ഫലം കായ്ക്കാൻ കഴിയാത്തതുപോലെ
  rationale: δύναμαιയിലെ കഴിവ്/അസാധ്യതയും καρπὸν φέρειν എന്ന കാർഷിക രൂപകവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἀφ’ ἑαυτοῦ
  choice: സ്വയം
  rationale: കൊമ്പിന് സ്വതന്ത്രമായി ഫലം ഉത്പാദിപ്പിക്കാനാവില്ല എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: മുന്തിരിവള്ളിയിൽ
  rationale: വള്ളി-കൊമ്പ് രൂപകം വിശദീകരണപദങ്ങൾ കൂട്ടിച്ചേർക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: അതുപോലെ ... നിങ്ങൾക്കും കഴിയില്ല
  rationale: മുൻവാക്യത്തിലെ οὐ δύναται എന്ന കഴിവില്ലായ്മയുടെ ക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യത്വത്തിലും യേശുവുമായുള്ള ഐക്യത്തിലും μένω എന്ന പദത്തിന്റെ അർത്ഥം
  choice: നിലനിൽക്കുക
  alternative: വസിക്കുക; ചേർന്നുനിൽക്കുക; തുടരുക
  rationale: തുടർച്ചയായ ബന്ധം, സ്ഥിരത, അന്തർവാസം എന്നിവയുടെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുമ്പോഴും ഒരു പ്രത്യേക വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: κἀγὼ ἐν ὑμῖν എന്ന ക്രിയാരഹിതമായ പരസ്പരവാക്യം
  choice: ഞാനും നിങ്ങളിൽ
  alternative: ഞാനും നിങ്ങളിൽ നിലനിൽക്കും; നിങ്ങളും എന്നിൽ നിലനിൽക്കും
  rationale: മൂലപാഠത്തിലെ ദീർഘലോപം സംരക്ഷിച്ച്, അത് വാഗ്ദാനമോ കല്പനയോ ആയി പ്രത്യേകം തീർപ്പാക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുന്തിരിവള്ളി–കൊമ്പ് രൂപകവും ‘എന്നിൽ/നിങ്ങളിൽ’ എന്ന പരസ്പര അന്തർവാസഭാഷയും അതേപടി സൂക്ഷിച്ചു; മലയാളത്തിൽ അനിവാര്യമായിടത്ത് മാത്രം മുൻവാക്യത്തിലെ ‘കഴിയുക’ എന്ന ക്രിയാഭാവം പൂരിപ്പിച്ചു.
