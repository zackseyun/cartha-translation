source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: ml
  text: നിങ്ങൾ എന്നിൽ നിലനിൽക്കുകയും എന്റെ വചനങ്ങൾ നിങ്ങളിൽ നിലനിൽക്കുകയും ചെയ്താൽ[a], നിങ്ങൾ ആഗ്രഹിക്കുന്നതെന്തും[b] ചോദിക്കൂ; അത് നിങ്ങൾക്കു ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നിങ്ങൾ എന്നിൽ വസിക്കുകയും എന്റെ വചനങ്ങൾ നിങ്ങളിൽ വസിക്കുകയും ചെയ്താൽ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘നിങ്ങൾ ഇച്ഛിക്കുന്നതെന്തും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: നിലനിൽക്കുക / നിലനിൽക്കുക
  rationale: യോഹന്നാന്റെ രചനയിലെ ആവർത്തിച്ചുവരുന്ന ഈ മുഖ്യപദം തുടർന്നുള്ള ബന്ധപരമായ സാന്നിധ്യവും സ്ഥിരതയും സൂചിപ്പിക്കുന്നു. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ മലയാളപദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: യേശുവുമായുള്ള ഐക്യവും ബന്ധവും സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ ‘ൽ’ രൂപം നേരിട്ട് നിലനിർത്തുന്നു; ‘എന്നോടൊപ്പം’ എന്നു ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: τὰ ῥήματά μου
  choice: എന്റെ വചനങ്ങൾ
  rationale: ῥήματα യേശുവിന്റെ അരുളപ്പാടുകളെയോ പറഞ്ഞ വാക്കുകളെയോ സൂചിപ്പിക്കുന്നു. ‘വചനങ്ങൾ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബഹുവചനമാണ്.
- source_word: ὃ ἐὰν θέλητε
  choice: നിങ്ങൾ ആഗ്രഹിക്കുന്നതെന്തും
  rationale: ഈ അനിശ്ചിത സംബന്ധപ്രയോഗം ആഗ്രഹത്തിന്റെ വിശാലമായ വിഷയത്തെ വ്യക്തമാക്കുന്നു. ‘എന്തും’ എന്നത് ഗ്രീക്കിലെ തുറന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: αἰτήσασθε
  choice: ചോദിക്കുവിൻ
  rationale: ഹർജി അർപ്പിക്കുകയോ അപേക്ഷിക്കുകയോ ചെയ്യുന്ന ആജ്ഞയാണ്. സന്ദർഭത്തിൽ ‘ചോദിക്കുവിൻ’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: γενήσεται ὑμῖν
  choice: അതു നിങ്ങൾക്കുവേണ്ടി സംഭവിക്കും
  rationale: γίνομαι എന്നതിന്റെ ‘സംഭവിക്കുക/ഉണ്ടാകുക’ എന്ന അർഥം കർത്താവിനെ വാക്യത്തിൽ ചേർക്കാതെ സംരക്ഷിക്കുന്നു. ‘ചെയ്തുതരപ്പെടും’ എന്നത് ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത പ്രവർത്താവിനെ സൂചിപ്പിച്ചേക്കാം.
theological_decisions:
- issue: പ്രാർഥനയെക്കുറിച്ചുള്ള വ്യവസ്ഥയും വാഗ്ദാനവും തമ്മിലുള്ള ഘടന
  choice: ചോദിക്കുന്നതിനെക്കുറിച്ചുള്ള വാഗ്ദാനം, ശിഷ്യർ യേശുവിൽ നിലനിൽക്കുകയും അവന്റെ വചനങ്ങൾ അവരിൽ നിലനിൽക്കുകയും ചെയ്യുക എന്ന വ്യക്തമായ വ്യവസ്ഥയ്ക്കുള്ളിൽ നിലനിർത്തുന്നു.
  alternative: വാഗ്ദാനം വ്യവസ്ഥയില്ലാത്തതുപോലെ തോന്നിക്കുന്ന സ്വതന്ത്ര പരിഭാഷ.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ἐὰν എന്ന വ്യവസ്ഥാപദം ചോദിക്കലിനെയും തുടർന്നുള്ള ഫലത്തെയും നിയന്ത്രിക്കുന്നു. അതിനാൽ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ മുറുക്കം വിശദീകരിച്ചുകളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിലനിൽക്കുക’ എന്ന ആവർത്തനം യോഹന്നാന്റെ പദപ്രയോഗം സൂക്ഷിക്കുന്നു. ബഹുവചന അഭിസംബോധനയായ ‘നിങ്ങൾ’ നിലനിർത്തിയിരിക്കുന്നു.
