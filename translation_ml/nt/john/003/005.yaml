id: JHN.3.5
reference: John 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “സത്യം, സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: വെള്ളത്തിൽനിന്നും ആത്മാവിൽനിന്നും[a][b] ജനിച്ചില്ലെങ്കിൽ ആർക്കും ദൈവരാജ്യത്തിൽ പ്രവേശിക്കാൻ കഴിയുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവ്’ ഇവിടെ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാനാണ് കൂടുതൽ സാധ്യത; എങ്കിലും ഗ്രീക്കിലെ πνεῦμα എന്ന പദം ‘ആത്മാവ്’ അല്ലെങ്കിൽ ‘ആത്മീയ ആത്മാവ്’ എന്ന പൊതുവായ അർത്ഥത്തിലും വായിക്കാവുന്നതാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘വെള്ളത്തിൽനിന്നും ആത്മാവിൽനിന്നും’ എന്ന പ്രയോഗം ശുദ്ധീകരണത്തിന്റെയും നവീകരണത്തിന്റെയും ദൃശ്യരൂപമായി, ശാരീരിക ജനനത്തെയും ആത്മീയ ജനനത്തെയും സൂചിപ്പിക്കുന്നതായി, അല്ലെങ്കിൽ സ്നാനത്തെ സൂചിപ്പിക്കുന്നതായി വ്യത്യസ്തമായി മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്. മുഖ്യപാഠം ഈ വ്യാഖ്യാനങ്ങളിൽ ഒന്നും തീരുമാനിക്കാതെ ഗ്രീക്കിന്റെ പദപ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണഭാവം നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: ആവർത്തിച്ചുള്ള ഗൗരവമേറിയ ഉറപ്പിക്കൽ മലയാളത്തിൽ വ്യക്തമായി എത്തിക്കുന്നു; ലിപ്യന്തരണം മാത്രം ഒഴിവാക്കുന്നു.
- source_word: λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ ഏകവചന അഭിസംബോധനയും നേരിട്ടുള്ള ഗൗരവഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐὰν μή τις
  choice: ജനിക്കുന്നില്ലെങ്കിൽ ആർക്കും
  rationale: τις എന്ന അനിശ്ചിതവും ലിംഗനിരപേക്ഷവുമായ പൊതുവായ സൂചന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γεννηθῇ
  choice: ജനിക്കുന്നില്ലെങ്കിൽ
  rationale: ജനിക്കപ്പെടുക എന്ന കർമണാർത്ഥം മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘വീണ്ടും’ അല്ലെങ്കിൽ ‘മുകളിൽനിന്ന്’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: വെള്ളത്തിൽനിന്നും ആത്മാവിൽനിന്നും
  rationale: ἐξ എന്ന ഉറവിടബന്ധവും രണ്ടു നാമങ്ങളെയും ബന്ധിപ്പിക്കുന്ന καίയും തുറന്ന നിലയിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐ δύναται εἰσελθεῖν
  choice: പ്രവേശിക്കാൻ കഴിയുകയില്ല
  rationale: കഴിവില്ലായ്മ സൂചിപ്പിക്കുന്ന δύναται എന്ന ക്രിയയും ‘പ്രവേശിക്കുക’ എന്ന εἰσελθεῖν-ന്റെ അർത്ഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിൽ
  rationale: βασιλείαയുടെ രാജത്വം/രാജ്യം എന്ന അർത്ഥവ്യാപ്തി അമിതമായി വ്യാഖ്യാനിക്കാതെ മലയാളത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ പ്രയോഗം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: πνεύματος എന്നതിന്റെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ ‘ആത്മാവ്’ എന്നു നൽകി പരിശുദ്ധാത്മാവിലേക്കുള്ള സാധ്യത നിലനിർത്തുന്നു
  alternative: മനുഷ്യാത്മാവ് അല്ലെങ്കിൽ പൊതുവായ ആത്മീയ തത്ത്വം എന്ന നിലയിൽ ‘ആത്മാവ്’
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് സാധ്യതയേറിയ സൂചന; എന്നാൽ ഗ്രീക്കിൽ പദം നിർദേശക ഉപപദമില്ലാതെ വരുന്നതിനാൽ പാദക്കുറിപ്പിൽ യഥാർത്ഥ അവ്യക്തത രേഖപ്പെടുത്തുന്നു.
- issue: ‘വെള്ളവും ആത്മാവും’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ഗ്രീക്കിന്റെ രൂപം സംരക്ഷിച്ച് നിർണായക വ്യാഖ്യാനം ചേർക്കുന്നില്ല
  alternative: ശുദ്ധീകരണവും നവീകരണവും; ശാരീരിക ജനനവും ആത്മീയ ജനനവും; സ്നാനം
  rationale: പാഠം ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ പ്രധാന വ്യാഖ്യാനസാധ്യതകൾ പാദക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചനമായ σοι അനുസരിച്ച് ‘നിന്നോടു’ ഉപയോഗിച്ചു. പാദക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട വാക്യഭാഗത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
