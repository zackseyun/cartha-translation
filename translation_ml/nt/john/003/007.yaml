  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: ml
  text: '“ഞാൻ നിന്നോടു പറഞ്ഞതിൽ ആശ്ചര്യപ്പെടേണ്ട: ‘നിങ്ങൾ മുകളിൽനിന്ന് ജനിക്കണം.’”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വീണ്ടും ജനിക്കണം” അല്ലെങ്കിൽ “പുതുതായി ജനിക്കണം.” ἄνωθεν എന്ന ഗ്രീക്കുപദത്തിന് “മുകളിൽനിന്ന്” എന്നും “വീണ്ടും/പുതുതായി” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: “ഞാൻ നിന്നോടു പറഞ്ഞതിൽ” എന്നതിലെ “നിന്നോടു” ഏകവചനമാണ്; എന്നാൽ “നിങ്ങൾ … ജനിക്കണം” എന്നതിലെ “നിങ്ങൾ” ഗ്രീക്കിൽ ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: ആശ്ചര്യപ്പെടേണ്ട
  rationale: μή സഹിതമുള്ള aorist subjunctive ഇവിടെ വിലക്ക് പ്രകടിപ്പിക്കുന്നു. ‘ആശ്ചര്യപ്പെടേണ്ട’ എന്നത് θαυμάζωയുടെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളശൈലിയും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: …പറഞ്ഞതിൽ
  rationale: ὅτι യേശു പറഞ്ഞതിന്റെ ഉള്ളടക്കത്തോടാണ് ആശ്ചര്യം ബന്ധിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഞാൻ … പറഞ്ഞതിൽ’ എന്ന ഘടന ഈ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἶπόν σοι
  choice: ഞാൻ നിന്നോടു പറഞ്ഞത്
  rationale: σοι ഏകവചനമായതിനാൽ ‘നിന്നോടു’ എന്നു പരിഭാഷപ്പെടുത്തി; λέγωയുടെ ലളിതവും കൃത്യവുമായ മലയാളരൂപമാണ് ‘പറഞ്ഞത്’.
- source_word: Δεῖ
  choice: ജനിക്കണം
  rationale: Δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത മലയാളത്തിലെ ‘-ണം’ എന്ന രൂപം സംക്ഷിപ്തമായും ശക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങൾ
  rationale: ὑμᾶς ബഹുവചനമാണ്. മലയാളത്തിൽ ‘നിങ്ങൾ’ ബഹുവചനമായും ആദരസൂചക ഏകവചനമായും വരാമെങ്കിലും, മുൻപുള്ള ‘നിന്നോടു’ എന്ന ഏകവചനത്തോടുള്ള വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: γεννηθῆναι
  choice: ജനിക്കുക
  rationale: ഈ യോഹന്നാനീയ സന്ദർഭത്തിൽ γεννάω ജനനത്തെ സൂചിപ്പിക്കുന്നു; passive infinitive-ന്റെ അർഥം ‘ജനിക്കണം’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ ലഭിക്കുന്നു.
- source_word: ἄνωθεν
  choice: ഉയരത്തിൽനിന്ന്
  rationale: ἄνωθεν എന്നതിന് ‘ഉയരത്തിൽനിന്ന്’ എന്നും ‘വീണ്ടും/പുതുതായി’ എന്നും അർഥമാകാം. യോഹന്നാനിലെ സ്വർഗീയ ഉത്ഭവത്തിന്റെ ഊന്നൽ പ്രധാനവാചകത്തിൽ ‘ഉയരത്തിൽനിന്ന്’ എന്നു നൽകാൻ പിന്തുണയ്ക്കുന്നു; യഥാർഥമായ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുതുജനനത്തെക്കുറിച്ചുള്ള വചനത്തിൽ ἄνωθεν എന്നതിന്റെ അർഥം
  choice: ഉയരത്തിൽനിന്ന്
  alternative: വീണ്ടും; പുതുതായി
  rationale: യോഹന്നാൻ 3-ലെ സംഭാഷണത്തിൽ ഈ പദത്തിന്റെ ദ്വയാർഥം ഉദ്ദേശ്യപൂർവമാകാം. യോഹന്നാനീയ പ്രയോഗവും ദൈവത്തിൽനിന്നുള്ള ജനനത്തിന്റെ ഊന്നലും ‘ഉയരത്തിൽനിന്ന്’ എന്ന പ്രധാനവായനയെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചന-ബഹുവചന വ്യത്യാസവും ἄνωθεν എന്ന പദത്തിന്റെ ദ്വയാർഥവും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
