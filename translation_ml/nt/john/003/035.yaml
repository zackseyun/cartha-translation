  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: ml
  text: പിതാവ് പുത്രനെ സ്നേഹിക്കുന്നു; സകലവും അവന്റെ കൈയിൽ ഏല്പിച്ചിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ കൈയിൽ കൊടുത്തിരിക്കുന്നു.’ അധികാരമോ ഉടമസ്ഥതയോ ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ദൈവത്തെ പുത്രനോടുള്ള ബന്ധത്തിൽ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ അഭിസംബോധനയായതിനാൽ ‘പിതാവ്’ എന്നു നൽകി.
- source_word: ἀγαπᾷ
  choice: സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടരുന്ന യാഥാർഥ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸν υἱόν
  choice: പുത്രനെ
  rationale: പിതാവുമായുള്ള യേശുവിന്റെ സവിശേഷ ബന്ധം സൂചിപ്പിക്കുന്ന ശീർഷകസ്വഭാവമുള്ള പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രമായ വ്യാപ്തി ചുരുക്കാതെ, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δέδωκεν
  choice: ഏല്പിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലവും ‘-ച്ചിരിക്കുന്നു’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ അധികാരവും ചുമതലയും കൈമാറുന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: അവന്റെ കൈയിൽ
  rationale: ‘കൈയിൽ’ എന്ന ഉറവിടരൂപകം നിലനിർത്തിക്കൊണ്ട് അധികാരമോ ഉടമസ്ഥതയോ ഏല്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം നൽകുന്നു.
theological_decisions:
- issue: പിതാവും പുത്രനും തമ്മിലുള്ള ബന്ധം
  choice: ‘പിതാവ്’, ‘പുത്രൻ’ എന്നീ വ്യക്തിപരവും ബന്ധപരവുമായ ശീർഷകങ്ങൾ അതേപടി നിലനിർത്തി.
  alternative: പൊതുവായ കുടുംബബന്ധപദങ്ങളായി വ്യാഖ്യാനിക്കുക
  rationale: വാക്യത്തിലെ ക്രിസ്തുകേന്ദ്രിതമായ ബന്ധം സംരക്ഷിക്കുന്നു; അതേസമയം വാചകത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തവികാസം ചേർക്കുന്നില്ല.
- issue: പുത്രന് ഏല്പിക്കപ്പെട്ടതിന്റെ വ്യാപ്തിയും നിലനിൽക്കുന്ന ഫലവും
  choice: πάντα എന്നത് ‘സകലവും’ എന്നും δέδωκεν എന്നത് ‘ഏല്പിച്ചിരിക്കുന്നു’ എന്നും നൽകി.
  alternative: ‘എല്ലാം കൊടുത്തു’
  rationale: സമഗ്രമായ വ്യാപ്തിയും ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ തുടരുന്ന ഫലവും സംരക്ഷിക്കുന്നു; പുത്രന് ഏല്പിക്കപ്പെട്ട അധികാരത്തെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ ശക്തമായ അവകാശവാദം ലഘൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘കൈയിൽ’ എന്ന മൂലരൂപകം നിലനിർത്തി; ‘ഏല്പിച്ചിരിക്കുന്നു’ എന്നത് പ്രയോഗത്തിന്റെ അർഥവും പൂർണ്ണകാലത്തിന്റെ തുടരുന്ന ഫലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
