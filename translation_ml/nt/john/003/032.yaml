id: JHN.3.32
reference: John 3:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: ml
  text: അവൻ കണ്ടതും കേട്ടതും അതുതന്നെ അവൻ സാക്ഷ്യപ്പെടുത്തുന്നു[a]; അവന്റെ സാക്ഷ്യം ആരും സ്വീകരിക്കുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യം വഹിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: ‘ആരും സ്വീകരിക്കുന്നില്ല’ എന്നത് ശക്തമായ ഒരു പൊതുപ്രസ്താവനയാണ്; എന്നാൽ അടുത്ത വാക്യം അവന്റെ സാക്ഷ്യം സ്വീകരിച്ച ഒരാളെക്കുറിച്ച് പറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: താൻ കണ്ടതും കേട്ടതും
  rationale: നപുംസകലിംഗ ഏകവചന ബന്ധസർവനാമം കണ്ടും കേട്ടും അറിഞ്ഞ ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യക്തിയെയല്ല.
- source_word: ἑώρακεν
  choice: കണ്ടതും
  rationale: ഗ്രീക്ക് പൂർണകാലം പൂർത്തിയായ ദർശനത്തിന്റെയും അതിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയുടെയും ആശയം നൽകുന്നു; മലയാളത്തിലെ സന്ദർഭം ഈ പ്രസക്തി സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἤκουσεν
  choice: കേട്ടതും
  rationale: ഗ്രീക്ക് അനിശ്ചിതഭൂതകാലത്തെ സ്വാഭാവിക മലയാള ഏകോപനത്തിലൂടെ നൽകുന്നു; കണ്ടതും കേട്ടതും എന്ന സമാന്തരഘടന വായനാസൗകര്യം നൽകുന്നു.
- source_word: τοῦτο
  choice: അതുതന്നെയാണ്
  rationale: മുമ്പ് പറഞ്ഞ ഉള്ളടക്കത്തിലേക്ക് ഊന്നലോടെ തിരിച്ചുചൂണ്ടുന്ന ഏകവചന demonstrative-ന്റെ resumptive സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: μαρτυρεῖ
  choice: സാക്ഷ്യപ്പെടുത്തുന്നത്
  rationale: നിയമപരവും വെളിപ്പെടുത്തൽസംബന്ധവുമായ സാക്ഷ്യത്തിന്റെ യോഹന്നാനീയ ഭാവം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗം.
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: μαρτυρεῖ എന്ന സമാനമൂലപദത്തോടുള്ള പദബന്ധവും സാക്ഷ്യത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ സാർവത്രിക നിഷേധത്തെ മയപ്പെടുത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λαμβάνει
  choice: സ്വീകരിക്കുന്നില്ല
  rationale: സാക്ഷ്യത്തെ കൈക്കൊള്ളുക/അംഗീകരിക്കുക എന്ന യോഹന്നാനീയ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും ഭൗതികമായ ‘ലഭിക്കുക’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ സാക്ഷ്യം ആരും സ്വീകരിക്കുന്നില്ല’ എന്ന സാർവത്രിക നിഷേധത്തിന്റെ വ്യാപ്തി
  choice: ‘ആരും സ്വീകരിക്കുന്നില്ല’ എന്ന ശക്തമായ പൊതുപ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: ‘വളരെ കുറച്ചുപേർ മാത്രമേ സ്വീകരിക്കുന്നുള്ളൂ’ എന്നിങ്ങനെ മയപ്പെടുത്തുക, അല്ലെങ്കിൽ ഗണിതപരമായി സമ്പൂർണമായ നിഷേധമായി വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ശക്തമായ സാർവത്രിക നിഷേധമാണ് ഉപയോഗിക്കുന്നത്. അടുത്ത വാക്യം സാക്ഷ്യം സ്വീകരിക്കുന്ന ഒരാളെക്കുറിച്ച് പറയുന്നതിനാൽ ഉണ്ടാകുന്ന യോഹന്നാനീയ വാചകസംഘർഷം പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അതുതന്നെയാണ്’ എന്ന ഘടന ഗ്രീക്കിലെ τοῦτο എന്ന തിരിച്ചുചൂണ്ടൽ വ്യക്തമാക്കുന്നു. രണ്ടാം καί സന്ദർഭത്തിലെ ആശയവൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
