source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: ml
  text: സ്വർഗത്തിലേക്ക് ആരും കയറിയിട്ടില്ല; സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന മനുഷ്യപുത്രനല്ലാതെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘സ്വർഗത്തിൽനിന്ന് താഴേക്കു വന്നവൻ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യപുത്രൻ’ എന്നത് യേശു സ്വയം വിശേഷിപ്പിക്കാൻ പതിവായി ഉപയോഗിച്ച പ്രയോഗമാണ്; ഇത് ദാനീയേൽ 7:13–14-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: സാർവത്രിക നിഷേധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ലിംഗപരമായി ചുരുക്കുന്ന പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἀναβέβηκεν
  choice: കയറിപ്പോയിട്ടില്ല
  rationale: പൂർത്തിയായ പ്രവൃത്തിക്ക് ഇപ്പോഴുള്ള പ്രസക്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect രൂപം മലയാളത്തിലെ സ്വാഭാവിക ഭൂതനിഷേധപ്രയോഗത്തിലൂടെ നൽകുന്നു; ഇറങ്ങിവരിക എന്ന വിരുദ്ധചലനത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰ μὴ
  choice: മാത്രമല്ലാതെ
  rationale: മുൻപുള്ള നിഷേധത്തിൽനിന്നുള്ള ഏക അപവാദം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ participle-നെ നാമവൽക്കരിച്ച രൂപത്തിൽ നൽകുകയും സ്വർഗീയ ഉത്ഭവവും താഴേക്കുള്ള ചലനവും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: സുവിശേഷങ്ങളിലെ യേശുവിന്റെ സ്ഥിരമായ സ്വയംവിശേഷണവും ദാനീയേൽ 7-ലെ പ്രതിധ്വനിയും സംരക്ഷിക്കുന്ന സ്ഥാപിത മലയാള പദം.
theological_decisions:
- issue: ‘മനുഷ്യപുത്രൻ’ എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: വ്യാഖ്യാനപരമായി പരാവർത്തനം ചെയ്യാതെ ‘മനുഷ്യപുത്രൻ’ എന്ന അംഗീകൃത വിശേഷണം നിലനിർത്തി.
  alternative: മനുഷ്യനായവൻ
  rationale: ഈ പ്രയോഗത്തിലെ സാധാരണ മനുഷ്യസൂചനയും അന്ത്യകാല/രാജകീയ പ്രതിധ്വനിയും ഒരുമിച്ച് നിലനിർത്തുന്നു; ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- issue: കയറിപ്പോകലിന്റെയും ഇറങ്ങിവരലിന്റെയും കാല-ദൃക്കോൺ സൂചന
  choice: ‘കയറിപ്പോയിട്ടില്ല’ എന്നും ‘ഇറങ്ങിവന്നവൻ’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: കയറിയിട്ടില്ല ... വന്നവൻ
  rationale: സ്വർഗീയ ഉത്ഭവത്തെയും അതുല്യമായ പ്രവേശനത്തെയും കുറിച്ചുള്ള വാക്യത്തിന്റെ ശക്തമായ അവകാശവാദം നിലനിർത്തുന്നു; ഗ്രീക്കിനപ്പുറം സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത ബൈബിൾപരമായ പദം നിലനിർത്തിയിരിക്കുന്നു. മുഖ്യവാക്യത്തിൽ ഗ്രീക്കിലെ അപവാദഘടനയും കയറുക/ഇറങ്ങുക എന്ന വിരുദ്ധചലനവും സംരക്ഷിച്ചു.
