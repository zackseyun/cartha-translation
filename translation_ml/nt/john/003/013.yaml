  to: സ്വർഗത്തിലേക്ക് ആരും കയറിയിട്ടില്ല; സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന മനുഷ്യപുത്രനല്ലാതെ.[a][b]
  rationale: The revision resolves the Malayalam syntactic problem while preserving the source’s perfect ascent claim, the directional contrast between ascent and descent, the exclusive ‘except’ construction, and the established title ‘മനുഷ്യപുത്രൻ.’ No interpretive or doctrinal expansion has been introduced.
