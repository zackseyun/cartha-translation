review_pass:
  verdict: revise
  source_fidelity: The draft preserves the core contrast of ascent and descent and correctly retains ‘മനുഷ്യപുത്രൻ’ as the title. However, the exception phrase is syntactically awkward in Malayalam because ‘മാത്രമല്ലാതെ’ is detached after an em-dash apposition. The revised wording directly represents εἰ μὴ (‘except’) by attaching -അല്ലാതെ to the complete noun phrase.
  naturalness: ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്നവൻ—മനുഷ്യപുത്രൻ—മാത്രമല്ലാതെ’ is not idiomatic, fluent modern Malayalam. ‘സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന മനുഷ്യപുത്രനല്ലാതെ’ is natural, clear, and retains the Greek’s restrictive construction.
  terminology: ‘സ്വർഗം,’ ‘കയറുക,’ ‘ഇറങ്ങിവരുക,’ and ‘മനുഷ്യപുത്രൻ’ are appropriate modern-standard Malayalam biblical terms. The title remains untranslated/paraphrased and preserves its established Gospel and Danielic resonance.
  issues:
  - severity: medium
    issue: The Malayalam exception construction is misplaced and awkward.
    rationale: In the draft, ‘മാത്രമല്ലാതെ’ follows a dash-enclosed apposition, making the sole-exception relationship less grammatical and less immediately clear. The Greek εἰ μὴ modifies the entire following referential phrase, which Malayalam expresses naturally with ‘മനുഷ്യപുത്രനല്ലാതെ.’
  - severity: low
    issue: ‘കയറിപ്പോയിട്ടില്ല’ is somewhat more cumbersome than necessary.
    rationale: ‘കയറിയിട്ടില്ല’ naturally conveys ascent in this context and provides a cleaner formal contrast with ‘ഇറങ്ങിവന്ന.’
  revised_text: സ്വർഗത്തിലേക്ക് ആരും കയറിയിട്ടില്ല; സ്വർഗത്തിൽനിന്ന് ഇറങ്ങിവന്ന മനുഷ്യപുത്രനല്ലാതെ.[a][b]
