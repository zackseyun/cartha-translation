id: JHN.3.10
reference: John 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടിയായി പറഞ്ഞു: “ഇസ്രായേലിന്റെ ഗുരു[a] നീയായിട്ടും ഇവ അറിയുന്നില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിന്റെ ഒരു ഗുരു.’ ഗ്രീക്കിൽ ‘ഗുരു’ എന്നതിന് നിശ്ചിത ഉപപദമുണ്ട്; അതിനാൽ ഈ അഭിസംബോധനയ്ക്ക് ഊന്നലോടുകൂടിയ ചോദ്യഭാവം ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ രണ്ട് ക്രിയകളുള്ള സംഭാഷണസൂത്രത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Σὺ
  choice: നീ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ, ‘ഗുരു നീ’ എന്ന വാക്യക്രമത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὁ διδάσκαλος
  choice: ഗുരു
  rationale: പഠിപ്പിക്കുന്നവൻ എന്ന അർഥവും അംഗീകൃതമായ അധ്യാപകസ്ഥാനത്തിന്റെ ഗൗരവവും സ്വാഭാവികമായി നൽകുന്നു. മലയാളത്തിൽ നിർദിഷ്ട ഉപപദമില്ലാത്തതിനാൽ വാക്യക്രമവും അടിക്കുറിപ്പും ഗ്രീക്കിലെ നിർദിഷ്ടത വ്യക്തമാക്കുന്നു.
- source_word: τοῦ Ἰσραὴλ
  choice: ഇസ്രായേലിന്റെ
  rationale: ഭൂമിശാസ്ത്രപരമായ ‘ഇസ്രായേലിൽ’ എന്നതിലുപരി ഇസ്രായേൽജനത്തോടുള്ള പ്രതിനിധിപരമായ ബന്ധം സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഇവ
  rationale: സമീപസന്ദർഭത്തിൽ യേശു പറഞ്ഞ കാര്യങ്ങളെ ചൂണ്ടിക്കാണിക്കുന്ന ബഹുവചന സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: γινώσκεις
  choice: അറിയുന്നില്ലേ
  rationale: അടിസ്ഥാനമായ ‘അറിയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മനസ്സിലാക്കുക എന്ന ഭാവവും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ὁ διδάσκαλος τοῦ Ἰσραὴλ എന്ന അഭിസംബോധനയുടെ നിർദിഷ്ടവും വാക്ചാതുര്യമുള്ളതുമായ ശക്തി
  choice: ‘ഇസ്രായേലിന്റെ ഗുരു നീ’ എന്ന ഊന്നലുള്ള നിർദിഷ്ട ഭാവം നിലനിർത്തി
  alternative: ‘ഇസ്രായേലിലെ ഒരു ഗുരു’
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ട ഉപപദം നിക്കൊദേമൊസിനെ വെറും അനേകം ഗുരുക്കന്മാരിൽ ഒരാളായി മാത്രം അവതരിപ്പിക്കുന്നില്ല; അംഗീകൃത അധ്യാപകനെന്ന നിലയെയും യേശുവിന്റെ ചോദ്യത്തിലെ മൂർച്ചയെയും സൂചിപ്പിക്കുന്നു. അതിലധികമായ ഔദ്യോഗിക പദവിയോ സിദ്ധാന്തപരമായ അവകാശവാദമോ വിവർത്തനം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. ‘മറുപടിയായി പറഞ്ഞു’ സംഭാഷണശൈലിയെ സ്വാഭാവികമാക്കുന്നു; ‘നീയായിട്ടും’ ഗ്രീക്കിലെ ‘നീ … എന്നിട്ടും അറിയുന്നില്ലേ?’ എന്ന വാക്ചാതുര്യമുള്ള വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
