id: JHN.3.36
reference: John 3:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: ml
  text: പുത്രനിൽ വിശ്വസിക്കുന്നവന് നിത്യജീവൻ ഉണ്ട്; എന്നാൽ പുത്രനെ അനുസരിക്കാത്തവൻ[a] ജീവൻ കാണുകയില്ല; ദൈവത്തിന്റെ ക്രോധം അവന്റെമേൽ നിലനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുത്രനിൽ വിശ്വസിക്കാൻ വിസമ്മതിക്കുന്നവൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അനുസരിക്കാതിരിക്കുക എന്ന അർഥത്തോടൊപ്പം വിശ്വസിക്കാൻ വിസമ്മതിക്കുക എന്ന അർഥവും വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: പുത്രനിൽ വിശ്വസിക്കുന്നവൻ
  rationale: വിശ്വാസം പുത്രനിലേക്കു വ്യക്തിപരമായി തിരിയുന്നതിനെ εἰς സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പുത്രനിൽ വിശ്വസിക്കുക’ സ്വാഭാവികവും യോഹന്നാന്റെ പ്രയോഗത്തിന് യോജിച്ചതുമാണ്.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: നിത്യജീവൻ ഉണ്ട്
  rationale: വർത്തമാനകാലമായ ἔχει ഇപ്പോഴുള്ള കൈവശാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഉണ്ട്’ അത് ലളിതമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: എന്നാൽ പുത്രനെ അനുസരിക്കാത്തവൻ
  rationale: ἀπειθέω അനുസരിക്കാതിരിക്കുക എന്ന അർഥവും വിശ്വസിക്കാൻ വിസമ്മതിക്കുക എന്ന അർഥവും വഹിക്കാം. മുഖ്യപാഠം അതിന്റെ വിശാലമായ അനുസരണക്കേടിന്റെ അർഥം നിലനിർത്തുന്നു; വിശ്വാസനിഷേധത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐκ ὄψεται ζωήν
  choice: ജീവൻ കാണുകയില്ല
  rationale: മൂലത്തിലെ ‘ജീവൻ കാണുക’ എന്ന യോഹന്നാനീയ പ്രയോഗം സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു; ഭാവികാലബലവും സംരക്ഷിക്കുന്നു.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം
  rationale: ദൈവിക ന്യായവിധിയെ സൂചിപ്പിക്കുന്ന ὀργήയുടെ ശക്തി മൃദൂകരിക്കാതെ ‘ക്രോധം’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: μένει ἐπ’ αὐτόν
  choice: അവന്റെമേൽ നിലനിൽക്കുന്നു
  rationale: μένει തുടരുന്ന വർത്തമാനാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘നിലനിൽക്കുന്നു’ യോഹന്നാനിലെ ഈ പ്രധാന ക്രിയയുടെ തുടർച്ചാബലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀπειθῶν എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘അനുസരിക്കാത്തവൻ’
  alternative: ‘പുത്രനിൽ വിശ്വസിക്കാൻ വിസമ്മതിക്കുന്നവൻ’
  rationale: πιστεύων എന്നതിനോടുള്ള വൈരുധ്യം അവിശ്വാസത്തെ മുന്നിൽ കൊണ്ടുവരുമ്പോഴും, ἀπειθέω അനുസരണക്കേടിന്റെ അർഥവും ഉൾക്കൊള്ളുന്നു. മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: നിത്യജീവന്റെയും ദൈവക്രോധത്തിന്റെയും കാലബലം
  choice: നിത്യജീവൻ ഇപ്പോൾ ഉള്ളതായും ദൈവക്രോധം ഇപ്പോൾ നിലനിൽക്കുന്നതായും വിവർത്തനം ചെയ്തു
  alternative: ഇവ രണ്ടും ഭാവിയിൽ മാത്രം സംഭവിക്കുന്നവയായി അവതരിപ്പിക്കൽ
  rationale: ἔχει, μένει എന്നിവ വർത്തമാനകാല ക്രിയകളാണ്; അതേസമയം οὐκ ὄψεται ഭാവിയിലേക്കു വിരൽചൂണ്ടുന്നു. ഈ കാലപരമായ സംഘർഷം പാഠത്തിൽ അതേപടി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പുത്രൻ,’ ‘നിത്യജീവൻ,’ ‘ദൈവത്തിന്റെ ക്രോധം’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; മൂലത്തിലെ വർത്തമാന-ഭാവി കാലവ്യത്യാസവും അർഥസന്ദിഗ്ധതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
