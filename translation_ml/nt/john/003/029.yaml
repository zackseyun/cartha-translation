id: JHN.3.29
reference: John 3:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: ml
  text: മണവാട്ടിയുള്ളവനാണ് മണവാളൻ. എന്നാൽ, നിന്നുകൊണ്ട് അവനെ കേൾക്കുന്ന മണവാളന്റെ സ്നേഹിതൻ[a], മണവാളന്റെ ശബ്ദം നിമിത്തം അതിയായി സന്തോഷിക്കുന്നു[b]. അതുകൊണ്ട്, എന്റെ ഈ സന്തോഷം പൂർണമായിത്തീർന്നിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ചുമതല ഇന്നത്തെ ചില വിവാഹങ്ങളിലെ ‘ബെസ്റ്റ് മാൻ’ എന്ന സ്ഥാനത്തോട് സാമ്യമുള്ളതാകാം; എന്നാൽ ഗ്രീക്കിലെ പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘മണവാളന്റെ സ്നേഹിതൻ’ എന്നാണ്.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘സന്തോഷത്തോടെ സന്തോഷിക്കുന്നു’; ഗ്രീക്കിലെ സജാതീയ പദപ്രയോഗം സന്തോഷത്തിന്റെ തീവ്രത ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിറവേറിയിരിക്കുന്നു.’ ഗ്രീക്ക് പദത്തിന് പൂർണതയിലേക്കോ നിറവിലേക്കോ കൊണ്ടുവരപ്പെടുക എന്ന അർഥം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: മണവാട്ടിയുള്ളവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തിന്റെ വ്യക്തിവാചകപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വിവാഹരൂപകത്തിലെ ‘മണവാട്ടി’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: νυμφίος
  choice: മണവാളൻ
  rationale: വിവാഹരൂപകം വ്യക്തമായി നിലനിർത്തുന്ന, സാധാരണ മലയാളവായനക്കാർക്ക് പരിചിതമായ പദം.
- source_word: φίλος τοῦ νυμφίου
  choice: മണവാളന്റെ സ്നേഹിതൻ
  rationale: ഗ്രീക്കിലെ ‘സ്നേഹിതൻ’ എന്ന പദത്തെ സുതാര്യമായി പരിഭാഷപ്പെടുത്തുന്നു; ‘ബെസ്റ്റ് മാൻ’ എന്ന സാംസ്കാരിക വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: നിന്നുകൊണ്ട് അവനെ കേൾക്കുന്ന
  rationale: ἑστηκὼς സൂചിപ്പിക്കുന്ന നിലകൊള്ളുന്ന ഭാവവും ἀκούων αὐτοῦ എന്നതിലെ ‘അവനെ കേൾക്കുക’ എന്ന ഘടനയും സംരക്ഷിക്കുന്നു; ഇവിടെ ഇല്ലാത്ത ‘ശബ്ദം’ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: χαρᾷ χαίρει
  choice: അതിയായി സന്തോഷിക്കുന്നു
  rationale: സജാതീയ നാമവും ക്രിയയും ചേർന്നുള്ള ഗ്രീക്ക് ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ശക്തിവാചകമായി നൽകുന്നു.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: മണവാളന്റെ ശബ്ദം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണബന്ധവും ‘ശബ്ദം’ എന്ന മൂലപദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: എന്റെ ഈ സന്തോഷം
  rationale: സൂചകസർവനാമത്തിന്റെയും ഉടമസ്ഥതാബോധത്തിന്റെയും ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πεπλήρωται
  choice: പൂർണമായിത്തീർന്നിരിക്കുന്നു
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപം സൂചിപ്പിക്കുന്ന, പൂർത്തിയിലേക്കു കൊണ്ടുവരപ്പെട്ട് ഇപ്പോൾ പൂർണാവസ്ഥയിൽ നിൽക്കുന്ന ഫലം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: വിവാഹരൂപകവും യോഹന്നാന്റെ സ്വസ്ഥാനനിർണ്ണയവും
  choice: മണവാളൻ, മണവാട്ടി, മണവാളന്റെ സ്നേഹിതൻ എന്നീ രൂപകങ്ങൾ അതേപടി നിലനിർത്തി; മണവാട്ടി ആരെ സൂചിപ്പിക്കുന്നു എന്ന് വാക്യത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ‘മണവാട്ടി’യെ സഭയോ ദൈവജനമോ എന്നു മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ സ്നേഹിതനെ ‘ബെസ്റ്റ് മാൻ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യം മണവാട്ടിയുടെ തിരിച്ചറിയൽ തുറന്നുപറയുന്നില്ല. അതിനാൽ പിൽക്കാല സഭാശാസ്ത്രനിഗമനങ്ങളോ പ്രത്യേക വിവാഹാചാരപരമായ പദവിയോ വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യാതെ മൂലത്തിലെ രൂപകവും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വിവാഹരൂപകത്തിന് ‘മണവാട്ടി/മണവാളൻ’ എന്നും ബന്ധപദത്തിന് ‘സ്നേഹിതൻ’ എന്നും ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ഊന്നൽ അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനമായി നൽകാതെ ‘അതിയായി’ എന്നു സ്വാഭാവികമാക്കി; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
