id: JHN.3.21
reference: John 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: ml
  text: എന്നാൽ സത്യം പ്രവർത്തിക്കുന്നവൻ[a] വെളിച്ചത്തിലേക്കു വരുന്നു; തന്റെ പ്രവൃത്തികൾ ദൈവത്തിൽ[c] ചെയ്യപ്പെട്ടവയാണെന്ന് വെളിപ്പെടേണ്ടതിനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സത്യം അനുഷ്ഠിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘സത്യമായതു ചെയ്യുന്നവൻ.’ ഗ്രീക്കിലെ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘സത്യം പ്രവർത്തിക്കുന്നവൻ’ എന്നാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘തന്റെ പ്രവൃത്തികൾ വെളിപ്പെടേണ്ടതിന്—കാരണം അവ ദൈവത്തിൽ ചെയ്യപ്പെട്ടവയാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘ὅτι’ എന്ന ബന്ധപദം വെളിപ്പെടുന്നതിന്റെ ഉള്ളടക്കമോ അതിന്റെ കാരണമോ അവതരിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘ദൈവത്തിൽ’ എന്നത് ‘ദൈവത്താൽ’ എന്നോ ‘ദൈവത്തിലൂടെ’ എന്നോ അർത്ഥമാക്കാനും കഴിയും; ഗ്രീക്ക് പ്രയോഗം കൃത്യമായ ബന്ധം തുറന്ന നിലയിൽ വിടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: എന്നാൽ സത്യം പ്രവർത്തിക്കുന്നവൻ
  rationale: δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. ποιῶν എന്ന വർത്തമാനകാല കൃദന്തം സ്വഭാവസവിശേഷമായ തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘സത്യം പ്രവർത്തിക്കുന്നു’ എന്ന അസാധാരണമായ പ്രയോഗം യോഹന്നാന്റെ നൈതികവും വെളിപ്പാടുസംബന്ധവുമായ ആശയവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: വെളിച്ചത്തിലേക്കു വരുന്നു
  rationale: ചലനത്തോടുകൂടിയ πρὸς ലക്ഷ്യത്തിലേക്കുള്ള സമീപനം സൂചിപ്പിക്കുന്നു; ‘വെളിച്ചത്തിലേക്കു’ എന്നത് രൂപകവും ദിശാബോധവും നിലനിർത്തുന്നു.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: തന്റെ പ്രവൃത്തികൾ ... വെളിപ്പെടേണ്ടതിനാണ്
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; φανερωθῇയുടെ കർമണിപ്രയോഗം ‘വെളിപ്പെടുക’ എന്നു നിലനിർത്തി. ἔργαയ്ക്ക് സ്വാഭാവികമായ ‘പ്രവൃത്തികൾ’ ഉപയോഗിച്ചു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: 'ഇവിടെ ὅτι വെളിപ്പെടുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം: ആ പ്രവൃത്തികൾ ദൈവത്തിൽ ചെയ്യപ്പെട്ടവയാണെന്ന്. കാരണാർത്ഥമായ ‘കാരണം’ എന്ന വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.'
- source_word: ἐν θεῷ
  choice: ദൈവത്തിൽ
  rationale: ἐν എന്നതിന്റെ തുറന്ന അർത്ഥവ്യാപ്തി സംരക്ഷിക്കുന്നു. ദൈവത്തിന്റെ പ്രവർത്തനശക്തി, ദൈവവുമായുള്ള ബന്ധം, ദൈവിക മണ്ഡലം എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ അർത്ഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: ἐστιν εἰργασμένα
  choice: ചെയ്യപ്പെട്ടവയാണ്
  rationale: പരിപൂർണ കർമണി രൂപത്തിന്റെ പൂർത്തിയായതും നിലവിലുള്ള ഫലമുള്ളതുമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ποιῶν τὴν ἀλήθειαν എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: സത്യം പ്രവർത്തിക്കുന്നവൻ
  alternative: സത്യം അനുഷ്ഠിക്കുന്നവൻ; സത്യമായതു ചെയ്യുന്നവൻ
  rationale: സത്യം അറിവോ വിശ്വാസമോ മാത്രമല്ല, പ്രവൃത്തിയിൽ പ്രകടമാകുന്നതുമാണെന്ന യോഹന്നാനീയ സാന്ദ്രത നിലനിർത്താൻ മൂലപ്രയോഗത്തോട് അടുത്ത രൂപം സ്വീകരിച്ചു.
- issue: ὅτιയുടെ വ്യാകരണബന്ധം
  choice: വെളിപ്പെടുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ‘എന്ന്’
  alternative: വെളിപ്പെടാനുള്ള കാരണം അവതരിപ്പിക്കുന്ന ‘കാരണം’
  rationale: φανερωθῇക്ക് പിന്നാലെ വരുന്നതിനാൽ ഉള്ളടക്കവായന സ്വാഭാവികമാണ്; എങ്കിലും ഗ്രീക്കിൽ കാരണവായനയും സാധ്യമാണ്, അതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἐν θεῷയുടെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ദൈവത്തിൽ
  alternative: ദൈവത്താൽ; ദൈവത്തിലൂടെ; ദൈവവുമായി ഐക്യത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം ദൈവിക പ്രവർത്തനശക്തി, മണ്ഡലം, ബന്ധം എന്നിവയ്ക്കിടയിൽ തുറന്ന നിലയിലാണ്. ഒരു പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ആ തുറന്നത്വം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സത്യം പ്രവർത്തിക്കുന്നവൻ’ അല്പം അസാധാരണമായിരുന്നാലും മൂലത്തിലെ യോഹന്നാനീയ പ്രയോഗം സംരക്ഷിക്കാനായി ഉദ്ദേശപൂർവം നിലനിർത്തി; അടിക്കുറിപ്പ് സ്വാഭാവികമായ പര്യായങ്ങൾ നൽകുന്നു.
