source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: ml
  text: യോഹന്നാനും സലീമിന് സമീപമുള്ള ഐനോനിൽ സ്നാനം നൽകിക്കൊണ്ടിരുന്നു[a]. അവിടെ ധാരാളം വെള്ളം ഉണ്ടായിരുന്നതിനാൽ[b] ആളുകൾ വന്നുകൊണ്ടിരിക്കുകയും സ്നാനം ഏൽക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്നാനം നൽകുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയെ ‘മുക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ സ്ഥാപിതമായ മതപരമായ പദം നിലനിർത്തിയിരിക്കുന്നു; ഈ പദംകൊണ്ടുമാത്രം സ്നാനരീതി തീരുമാനിക്കപ്പെടുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവിടെ അനേകം വെള്ളങ്ങൾ ഉണ്ടായിരുന്നതിനാൽ’; ‘അവിടെ വളരെ വെള്ളം ഉണ്ടായിരുന്നതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: യോഹന്നാനും ... സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: δέയുടെ മൃദുവായ ആശയബന്ധം മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ സൂചിപ്പിക്കുന്നു; καίയുടെ ‘കൂടി’ എന്ന അർഥം ‘-ഉം’കൊണ്ട് നിലനിർത്തുന്നു. ἦν കൂടിയുള്ള വർത്തമാനകൃദന്തം ഭൂതകാലത്തിലെ തുടർന്ന പ്രവൃത്തിയായതിനാൽ ‘കഴിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: ശലേമിന് സമീപമുള്ള ഐനോനിൽ
  rationale: സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; ἐγγύς സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രസാമീപ്യം സ്വാഭാവികമായി ‘സമീപമുള്ള’ എന്നു നൽകി.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: അവിടെ ധാരാളം വെള്ളം ഉണ്ടായിരുന്നതിനാൽ
  rationale: ὅτι ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ‘അനേകം വെള്ളങ്ങൾ’ എന്ന അക്ഷരാർഥ ബഹുവചനം മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ അർഥം സ്വാഭാവികമായി ‘ധാരാളം വെള്ളം’ എന്നു നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: παρεγίνοντο
  choice: ആളുകൾ വന്നുകൊണ്ടിരിക്കുകയും
  rationale: ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമായ ബഹുവചനത്തിലാണുള്ളത്; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘ആളുകൾ’ ചേർത്തു. അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ ‘വന്നുകൊണ്ടിരിക്കുകയും’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: ἐβαπτίζοντο
  choice: സ്നാനം സ്വീകരിക്കുകയും ചെയ്തു
  rationale: അപൂർണ്ണഭൂതകാല കർമണിപ്രയോഗം നിലനിർത്താൻ, മലയാളത്തിലെ സ്വാഭാവികമായ മതപരമായ പ്രയോഗമായ ‘സ്നാനം സ്വീകരിക്കുക’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: βαπτίζω എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: സ്നാനം കഴിപ്പിക്കുക / സ്നാനം സ്വീകരിക്കുക
  alternative: മുക്കുക / മുക്കപ്പെടുക
  rationale: പുതിയനിയമസന്ദർഭത്തിൽ ‘സ്നാനം’ സ്ഥാപിതവും വ്യാപകവുമായ മതപരമായ പദമാണ്. മുഖ്യപാഠത്തിൽ ഇതുപയോഗിക്കുന്നത് സ്നാനരീതിയെക്കുറിച്ചുള്ള ഏതെങ്കിലും സഭാവിഭാഗത്തിന്റെ നിഗമനം നിർബന്ധിതമാക്കുന്നില്ല; കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യോഹന്നാൻ’, ‘ഐനോൻ’, ‘ശലേം’ എന്നീ രൂപങ്ങൾ വായനാസൗകര്യമുള്ള മലയാള ലിപ്യന്തരങ്ങളാണ്. മുഖ്യപാഠം സ്വാഭാവികമാക്കിയെങ്കിലും ഗ്രീക്കിലെ തുടർച്ചയായ പ്രവൃത്തിയും കാരണബന്ധവും കർമണിഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
