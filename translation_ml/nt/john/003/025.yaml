  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: ml
  text: അപ്പോൾ യോഹന്നാന്റെ ശിഷ്യന്മാരും ഒരു യെഹൂദനും തമ്മിൽ ശുദ്ധീകരണത്തെക്കുറിച്ച്[a] ഒരു തർക്കമുണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശുദ്ധിയാക്കൽ’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ ആചാരപരമായ ശുദ്ധീകരണവും ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ഉണ്ടായി
  rationale: ഒരു സംഭവം ആരംഭിച്ചതിനെ സൂചിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ ആഖ്യാനപരമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: ഇവിടെ ഈ പദം ശക്തമായ നിഗമനത്തേക്കാൾ ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; ‘അപ്പോൾ’ ആ ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: ζήτησις
  choice: തർക്കം
  rationale: ζήτησις ചർച്ചയെയോ വിവാദത്തെയോ സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ ഭിന്നാഭിപ്രായത്തിന്റെ സ്വരം നിലനിർത്താൻ ‘തർക്കം’ അനുയോജ്യമാണ്; അതിനെ അതികഠിനമായ കലഹമായി ചിത്രീകരിക്കുന്നില്ല.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: യോഹന്നാന്റെ ശിഷ്യന്മാരും ഒരു യെഹൂദനും തമ്മിൽ
  rationale: ഗ്രീക്കിലെ ἐκ ... μετά ഘടന തർക്കത്തിൽ പങ്കെടുത്ത രണ്ടു വശങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘...യും ...നും തമ്മിൽ’ എന്നത് സ്വാഭാവികമാണ്; Ἰουδαίου ഏകവചനമാണെന്നതും നിലനിർത്തുന്നു.
- source_word: περὶ καθαρισμοῦ
  choice: ശുദ്ധീകരണത്തെക്കുറിച്ച്
  rationale: καθαρισμός പൊതുവായ ശുദ്ധീകരണത്തെയും ആചാരപരമായ ശുദ്ധീകരണത്തെയും സൂചിപ്പിക്കാം. ‘ശുദ്ധീകരണം’ ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ ‘ആചാരപരമായ’ എന്ന് ചേർത്ത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: καθαρισμός എന്ന പദത്തിന്റെ ആചാരപരമായ അർഥം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കണമോ
  choice: ശുദ്ധീകരണം
  alternative: ആചാരപരമായ ശുദ്ധീകരണം; ശുദ്ധിയാക്കൽ
  rationale: സമീപസന്ദർഭം മതപരമോ ആചാരപരമോ ആയ ശുദ്ധീകരണം ഉദ്ദേശിക്കുന്നതായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം തർക്കത്തിന്റെ കൃത്യമായ പരിധി നിർവചിക്കുന്നില്ല. അതിനാൽ വിശാലമായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി ആചാരപരമായ സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെഹൂദൻ’ ഏകവചനത്തെ കൃത്യമായി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
