  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: ml
  text: അവനിൽ[b] വിശ്വസിക്കുന്ന ഏവനും[a] നിത്യജീവൻ ഉണ്ടായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസിക്കുന്ന ഏതൊരാളും.”
    reason: lexical_alternative
  - marker: b
    text: ചില പരിഭാഷകൾ ഇവിടെ “അവനിലേക്കു” എന്നു നൽകുന്നു; എന്നാൽ ഗ്രീക്ക് പാഠം “അവനിൽ” (ἐν αὐτῷ) എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: —വേണ്ടതിന്
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യ/ഫലഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πᾶς ὁ πιστεύων
  choice: വിശ്വസിക്കുന്ന ഏവനും
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ, എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: πιστεύων
  choice: വിശ്വസിക്കുന്ന
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ πιστεύω എന്നതിന്റെ സുതാര്യവും പതിവുമായ മലയാളപരിഭാഷയാണ്; അനാവശ്യമായ വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: മൂലപാഠത്തിലെ ἐν എന്ന സ്ഥലസൂചക വിഭക്തിയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; εἰς എന്നതിന്റെ ‘അവനിലേക്കു’ എന്ന ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἔχῃ
  choice: ഉണ്ടാകേണ്ടതിന്
  rationale: ἵνα-യോടുകൂടിയ വർത്തമാനകാല subjunctive-ന്റെ ഉദ്ദേശ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ലഭിക്കുക’ എന്ന മൂലപാഠത്തിലില്ലാത്ത സ്വീകരണഭാവം ചേർക്കുന്നില്ല.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ കാലാതീതമായ ദൈർഘ്യവും വരാനിരിക്കുന്ന യുഗത്തിന്റെ ജീവഗുണവും സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ പ്രയോഗം.
theological_decisions:
- issue: ἐν αὐτῷ എന്ന യോഹന്നാനീയ വിശ്വാസപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: അവനിൽ
  alternative: അവനിലേക്കു
  rationale: ഇവിടെ ഗ്രീക്ക് പാഠം εἰς അല്ല, ἐν ആണ്. അതിനാൽ കൂടുതൽ പതിവുള്ള യോഹന്നാനീയ ഘടനയെ ഈ വാക്യത്തിലേക്ക് കൊണ്ടുവരാതെ മൂലപാഠത്തിന്റെ യഥാർഥ രൂപം സംരക്ഷിച്ചു.
- issue: πᾶς ὁ πιστεύων എന്നതിന്റെ വ്യാപ്തി
  choice: വിശ്വസിക്കുന്ന ഏവനും
  alternative: വിശ്വസിക്കുന്ന ഏതൊരാളും
  rationale: പ്രയോഗത്തിന്റെ പൊതുവായതും എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതുമായ വ്യാപ്തി വ്യക്തമായി നൽകുകയും ഏകവചന കൃദന്തരൂപത്തിന്റെ സ്വഭാവം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഉദ്ദേശ്യവാക്യമാണെന്ന ഘടന നിലനിർത്തിയിരിക്കുന്നു.
