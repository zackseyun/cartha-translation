revisions:
- from: അവന്റെ സാക്ഷ്യം സ്വീകരിച്ചവൻ ദൈവം സത്യവാനാണെന്ന് സ്ഥിരീകരിച്ചിരിക്കുന്നു.[a]
  to: അവന്റെ സാക്ഷ്യം സ്വീകരിക്കുന്ന ആരെങ്കിലും ദൈവം സത്യസന്ധനാണെന്ന് സ്ഥിരീകരിക്കുന്നു.[a]
  rationale: The revision makes the generic reference of ὁ λαβὼν explicit in natural Malayalam, uses a present generic verb form suitable for the verse’s proverbial assertion, and replaces the somewhat marked “സത്യവാൻ” with idiomatic “സത്യസന്ധൻ.” The footnote retains the literal sealing image without introducing an extraneous possessive. No theological interpretation has been added.
