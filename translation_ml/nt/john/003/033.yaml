  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: ml
  text: അവന്റെ സാക്ഷ്യം സ്വീകരിക്കുന്ന ആരെങ്കിലും ദൈവം സത്യസന്ധനാണെന്ന് സ്ഥിരീകരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ദൈവം സത്യസന്ധനാണെന്ന് മുദ്രവെച്ചിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: സ്വീകരിച്ചവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ ഭൂതകാല കൃദന്തം ഇവിടെ നാമരൂപമായി പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘സ്വീകരിച്ചവൻ’ പൂർത്തിയായ പ്രവൃത്തിയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: സന്ദർഭത്തിലെ അടുത്ത പൂർവപദമായ സ്വർഗത്തിൽനിന്നു വന്നവന്റെ—പുത്രന്റെ—സാക്ഷ്യത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ‘അവന്റെ’ അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: μαρτυρίαν
  choice: സാക്ഷ്യം
  rationale: യോഹന്നാനിലെ സാക്ഷ്യവിഷയക പ്രയോഗത്തോടു ചേരുന്നതും സ്വീകരിക്കപ്പെടുന്ന മൊഴി/സാക്ഷ്യം എന്ന അർഥം വ്യക്തമായി നൽകുന്നതുമായ സ്വാഭാവിക മലയാളപദമാണിത്.
- source_word: ἐσφράγισεν
  choice: സ്ഥിരീകരിച്ചിരിക്കുന്നു
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘മുദ്രവെച്ചു’ എന്നാണെങ്കിലും ഇവിടെ രൂപകമായി ഔദ്യോഗികമായി സാക്ഷ്യപ്പെടുത്തുക അല്ലെങ്കിൽ ഉറപ്പിക്കുക എന്ന അർഥത്തിലാണ്. ‘സ്ഥിരീകരിച്ചിരിക്കുന്നു’ ആ ആശയം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥരൂപകം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: ഇവിടെ ὅτι കാരണം സൂചിപ്പിക്കുന്നില്ല; സ്ഥിരീകരിക്കപ്പെടുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്ന്’ അതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: നിശ്ചിത കർത്താവിനെ ലളിതമായും നേരിട്ടും അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἀληθής
  choice: സത്യവാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവം സത്യം പറയുന്നവനും വിശ്വസനീയനും ആണെന്ന വ്യക്തിഗത ഗുണമാണ് ഉദ്ദേശിക്കുന്നത്. ‘സത്യവാൻ’ മലയാളത്തിൽ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോൾ ‘സത്യമുള്ളവൻ’ പോലുള്ള അസ്വാഭാവിക രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മുദ്രവയ്ക്കുന്ന രൂപകത്തിന്റെ ശക്തി
  choice: മുഖ്യപാഠത്തിൽ ἐσφράγισεν എന്നത് ‘സ്ഥിരീകരിച്ചിരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: ‘മുദ്രവെച്ചിരിക്കുന്നു’
  rationale: യേശുവിന്റെ സാക്ഷ്യം സ്വീകരിക്കുന്നത് ദൈവത്തിന്റെ സത്യസന്ധതയെ അംഗീകരിച്ച് സാക്ഷ്യപ്പെടുത്തുന്നതാണെന്ന ആശയം ആധുനിക വായനക്കാരന് വ്യക്തമായി നൽകുന്നു. അതേസമയം മൂലത്തിലെ മുദ്രാരൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἀληθής എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘ദൈവം സത്യവാനാണ്’
  alternative: ‘ദൈവം സത്യമാണ്’ അല്ലെങ്കിൽ ‘ദൈവം വിശ്വസനീയനാണ്’
  rationale: സന്ദർഭം ദൈവത്തിന്റെ സാക്ഷ്യത്തിന്റെ സത്യസന്ധതയെ മുൻനിർത്തുന്നതിനാൽ ‘സത്യവാൻ’ യോജിക്കുന്നു. ‘വിശ്വസനീയൻ’ മാത്രം ഉപയോഗിച്ചാൽ യോഹന്നാനിലെ ‘സത്യം’ എന്ന വിപുലമായ പ്രതിധ്വനി ചുരുങ്ങാം; ‘ദൈവം സത്യമാണ്’ എന്നു പറഞ്ഞാൽ അസ്തിത്വപരമായ പ്രസ്താവനയായി തെറ്റിദ്ധരിക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സ്ഥിരീകരിച്ചിരിക്കുന്നു’ എന്നത് രൂപകത്തിന്റെ ആശയം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ‘മുദ്ര വെച്ചിരിക്കുന്നു’ എന്ന അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
