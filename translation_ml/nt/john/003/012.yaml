id: JHN.3.12
reference: John 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: ml
  text: ഭൂമിയിലുള്ള കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ നിങ്ങളോടു പറഞ്ഞിട്ടും നിങ്ങൾ വിശ്വസിക്കുന്നില്ലെങ്കിൽ, സ്വർഗത്തിലുള്ള കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ നിങ്ങളോടു പറഞ്ഞാൽ നിങ്ങൾ എങ്ങനെ വിശ്വസിക്കും?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: ഭൂമിയിലുള്ള കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി പ്രവർത്തിക്കുന്നു. ‘ഭൂമിയിലുള്ള കാര്യങ്ങൾ’ എന്നത് സ്ഥലം സൂചിപ്പിക്കുന്ന അർഥവും τὰ ἐπουράνιαയോടുള്ള നേരിട്ടുള്ള വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ഭൗമിക കാര്യങ്ങൾ’ എന്നത് കൂടുതൽ അമൂർത്തമായെങ്കിലും സാധ്യമായ മറ്റൊരു പരിഭാഷയാണ്.
- source_word: εἶπον
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞിട്ടും
  rationale: λέγωയുടെ ഭൂതകാലരൂപം യേശു മുമ്പ് പറഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. ὑμῖν എന്ന പരോക്ഷ കർമം ‘നിങ്ങളോടു’ എന്നു നൽകി; καὶ οὐ πιστεύετεയുടെ സന്ദർഭത്തിൽ ‘പറഞ്ഞിട്ടും’ എന്ന ഘടന മലയാളത്തിൽ നിബന്ധനയും പ്രതീക്ഷാവിരുദ്ധതയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ πιστεύετε
  choice: നിങ്ങൾ വിശ്വസിക്കുന്നില്ല
  rationale: വർത്തമാനകാല നിരാകരണത്തെ അതേപടി നിലനിർത്തുന്നു. πιστεύωയ്ക്ക് ആശ്രയിക്കുക എന്ന ഭാവവും ഉണ്ടാകാമെങ്കിലും, ഇവിടെ ‘വിശ്വസിക്കുക’ എന്നതാണ് യോഹന്നാന്റെ സന്ദർഭത്തോടും ആവർത്തനത്തോടും ഏറ്റവും നേരിട്ടു പൊരുത്തപ്പെടുന്നത്.
- source_word: πῶς ... πιστεύσετε
  choice: നിങ്ങൾ എങ്ങനെ വിശ്വസിക്കും?
  rationale: πῶς എന്ന ചോദ്യപദവും πιστεύσετε എന്ന ഭാവികാലവും നേരിട്ട് സംരക്ഷിക്കുന്നു. ‘എങ്ങനെ വിശ്വസിക്കാനാകും?’ എന്നത് സാധ്യതയെ കൂടുതൽ വ്യാഖ്യാനിക്കുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: ἐὰν εἴπω
  choice: ഞാൻ ... പറഞ്ഞാൽ
  rationale: ἐὰν സഹിതമുള്ള aorist subjunctive ഭാവിയിലെ നിബന്ധന സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘പറഞ്ഞാൽ’ അതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: τὰ ἐπουράνια
  choice: സ്വർഗത്തിലുള്ള കാര്യങ്ങൾ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന നപുംസകലിംഗ ബഹുവചന വിശേഷണമാണ്. ‘സ്വർഗത്തിലുള്ള കാര്യങ്ങൾ’ എന്നത് τὰ ἐπίγειαയോടുള്ള സമാന്തര വൈരുധ്യം നിലനിർത്തുകയും അർഥം ‘സ്വർഗീയ രഹസ്യങ്ങൾ’ എന്നു ചുരുക്കി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഭൂമിയിലുള്ള കാര്യങ്ങൾ’ എന്നും ‘സ്വർഗത്തിലുള്ള കാര്യങ്ങൾ’ എന്നും തമ്മിലുള്ള വൈരുധ്യത്തിന്റെ അർഥം
  choice: രണ്ടു വിഭാഗങ്ങളെയും നേരിട്ട് പരിഭാഷപ്പെടുത്തി; അവയുടെ കൃത്യമായ ഉള്ളടക്കം വിശദീകരിച്ചില്ല.
  alternative: ‘ഭൂമിയിലുള്ള കാര്യങ്ങൾ’ എന്നത് ഭൂമിയിലെ ഉപമകളോ ഭൂമിയിൽ സംഭവിക്കുന്ന കാര്യങ്ങളോ എന്നും ‘സ്വർഗത്തിലുള്ള കാര്യങ്ങൾ’ എന്നത് ആഴമേറിയ ദൈവിക രഹസ്യങ്ങളോ എന്നും വ്യക്തമാക്കുക.
  rationale: വാക്യം വെളിപ്പെടുത്തലിന്റെ രണ്ടു വിഭാഗങ്ങളെ വേർതിരിക്കുന്നുണ്ടെങ്കിലും അവയ്ക്ക് ഒരു മാത്രം കൃത്യമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല. വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംസാരശൈലി. ‘ഭൗമിക/സ്വർഗീയ’ എന്ന കൂടുതൽ സാഹിത്യപരവും അമൂർത്തവുമായ ജോഡിക്ക് പകരം ‘ഭൂമിയിലുള്ള/സ്വർഗത്തിലുള്ള’ എന്ന സമാന്തര രൂപം ഉപയോഗിച്ചു. വായനാസൗകര്യത്തിനായി കാലവാക്യം ‘പറഞ്ഞിട്ടും’ എന്നു നൽകി; മൂലത്തിലെ ഭൂതകാലവും വർത്തമാനകാല അവിശ്വാസവും ഭാവികാല ചോദ്യവും നിലനിർത്തി.
