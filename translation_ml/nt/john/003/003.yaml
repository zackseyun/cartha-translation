id: JHN.3.3
reference: John 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടിയായി ഇങ്ങനെ പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: ഒരാൾ മുകളിൽനിന്ന് ജനിച്ചില്ലെങ്കിൽ[a] ദൈവരാജ്യം കാണാൻ കഴിയുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വീണ്ടും.” ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന് “മുകളിൽനിന്ന്” എന്നും “വീണ്ടും” എന്നും അർഥമാകാം; അടുത്ത വാക്യത്തിലെ സംഭാഷണം ഈ ദ്വയാർഥത്തെ ആശ്രയിച്ചാണ് മുന്നോട്ടുപോകുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ രണ്ടു ക്രിയകളുടെയും പ്രതികരണവും സംസാരവും എന്ന അർഥഘടകങ്ങൾ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: ആവർത്തനത്തിലൂടെ വരുന്ന ഊന്നൽ നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ഭാഷ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐὰν μή τις
  choice: ഒരാൾ … ഇല്ലെങ്കിൽ
  rationale: ലിംഗനിർണ്ണയം ചെയ്യാത്ത പൊതുവായ വ്യവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γεννηθῇ
  choice: ജനിച്ചില്ലെങ്കിൽ
  rationale: ജനിക്കുക എന്ന ക്രിയയുടെ നിഷ്ക്രിയാർഥം സാഹചര്യത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘വീണ്ടും’ എന്ന വ്യാഖ്യാനം ക്രിയയിൽ ചേർക്കുന്നില്ല.
- source_word: ἄνωθεν
  choice: ഉയരത്തിൽനിന്ന്
  rationale: യോഹന്നാനിലെ സ്വർഗീയ ഉത്ഭവസൂചനയ്ക്ക് മുൻഗണന നൽകുന്നു; ‘വീണ്ടും’ എന്ന യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐ δύναται
  choice: കഴിയുകയില്ല
  rationale: കഴിവില്ലായ്മയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: നേരിട്ടുള്ള ദൃശ്യാർഥത്തോടൊപ്പം ഗ്രഹിക്കുകയോ അനുഭവിക്കുകയോ ചെയ്യുക എന്ന യോഹന്നാനീയ അർഥസാധ്യതയും തുറന്നുവയ്ക്കുന്നു.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: രാജഭരണത്തിന്റെയും രാജ്യത്തിന്റെയും അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാത്ത, മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ പ്രയോഗം.
theological_decisions:
- issue: ἄνωθεν എന്ന പദത്തിന്റെ അർഥം
  choice: ഉയരത്തിൽനിന്ന്
  alternative: വീണ്ടും; പുതുതായി
  rationale: പദത്തിന് ‘ഉയരത്തിൽനിന്ന്’ എന്നും ‘വീണ്ടും’ എന്നും അർഥമാകാം. യോഹന്നാനിലെ മുകളിൽനിന്നുള്ള ഉത്ഭവം എന്ന പ്രമേയം മുഖ്യവായനയെ പിന്തുണയ്ക്കുമ്പോൾ, അടുത്ത വാക്യത്തിലെ നിക്കോദേമൊസിന്റെ പ്രതികരണം ‘വീണ്ടും’ എന്ന അർഥത്തെ ആശ്രയിക്കുന്നു. അതിനാൽ ദ്വയാർഥം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യേശുവിന്റെ ഇരട്ട ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു.
