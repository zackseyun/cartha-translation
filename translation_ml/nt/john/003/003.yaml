revisions:
- from: 'യേശു അവനോടു മറുപടിയായി പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിന്നോടു പറയുന്നു: ഒരാൾ ഉയരത്തിൽനിന്ന് ജനിച്ചില്ലെങ്കിൽ[a] ദൈവരാജ്യം കാണാൻ അയാൾക്കു കഴിയുകയില്ല.”'
