id: JHN.3.28
reference: John 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: ml
  text: “ഞാൻ മിശിഹാ[a] അല്ലെന്നും, അവനു മുമ്പായി അയയ്ക്കപ്പെട്ടവനാണെന്നും[b] ഞാൻ പറഞ്ഞതിന് നിങ്ങൾതന്നെ എനിക്കു സാക്ഷ്യം വഹിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: alternative_rendering
  - marker: b
    text: അഥവാ, “ഞാൻ അവനു മുമ്പായി അയയ്ക്കപ്പെട്ടിരിക്കുന്നു” അല്ലെങ്കിൽ “ഞാൻ അവനു മുമ്പായി അയയ്ക്കപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: ആവർത്തിച്ച സർവനാമത്തിലൂടെ വരുന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μοι μαρτυρεῖτε
  choice: എനിക്കു സാക്ഷ്യം വഹിക്കുന്നു
  rationale: യോഹന്നാന്റെ രചനയിലെ നിയമപരവും സാക്ഷ്യപരവുമായ ഭാവം നിലനിർത്തിക്കൊണ്ട്, ദാതൃവിഭക്തിയായ μοι-യുടെ അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: εἶπον
  choice: ഞാൻ പറഞ്ഞതിന്
  rationale: മുമ്പ് നടത്തിയ വ്യക്തമായ പ്രസ്താവനയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അനിശ്ചിതഭൂതകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός ഒരു പേരായല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: അയയ്ക്കപ്പെട്ടവനാണ്
  rationale: മുൻപ് അയയ്ക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോഴും നിലനിൽക്കുന്ന നിയോഗിതാവസ്ഥയെ ഗ്രീക്കിലെ പരിഭാഷാത്മക പൂർണകാലനിർമ്മിതി സൂചിപ്പിക്കുന്നു.
- source_word: ἔμπροσθεν ἐκείνου
  choice: അവനു മുമ്പായി
  rationale: അവനെക്കാൾ മുമ്പേ അയയ്ക്കപ്പെട്ട മുന്നൊരുക്കദൗത്യം വ്യക്തമാക്കുന്നു; മാനമഹത്വത്തിലെ മുൻതൂക്കം എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: സ്നാപകയോഹന്നാൻ താൻ പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനല്ലെന്നു നിഷേധിക്കുന്നതിനാൽ, പദവിയുടെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ യോജിക്കുന്നു; മറ്റൊരു പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: Ἀπεσταλμένος εἰμὶ എന്ന നിയോഗപ്രയോഗത്തിന്റെ കാലബലം
  choice: അയയ്ക്കപ്പെട്ടവനാണ്
  alternative: അയയ്ക്കപ്പെട്ടിരിക്കുന്നു / അയയ്ക്കപ്പെട്ടു
  rationale: മുൻകാലത്തെ അയയ്ക്കലും അതിന്റെ ഇപ്പോഴത്തെ നിലനിൽക്കുന്ന ഫലവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; യോഹന്നാന്റെ അധീനവും മുന്നൊരുക്കപരവുമായ ദൗത്യത്തിനപ്പുറം ഒന്നും ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. αὐτοὶ ὑμεῖς എന്ന ഊന്നലിന് ‘നിങ്ങൾതന്നെ’ ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ രണ്ട് ὅτι ഉള്ളടക്കവാക്യങ്ങളെയും ‘എന്നും … എന്നും’ എന്ന സമാന്തരഘടനയിൽ ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
