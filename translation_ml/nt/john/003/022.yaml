  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: ml
  text: ഇതിനുശേഷം, യേശുവും അവന്റെ ശിഷ്യന്മാരും യെഹൂദ്യദേശത്തേക്കു പോയി. അവിടെ അവൻ അവരോടൊപ്പം താമസിച്ചും സ്നാനം നൽകിയും ഇരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യേശു തന്നെയല്ല സ്നാനം നൽകിയതെന്നും അവന്റെ ശിഷ്യന്മാരാണ് നൽകിയതെന്നും യോഹന്നാൻ 4:2 വ്യക്തമാക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ബഹുവചന സൂചകത്തിന്റെ കാലക്രമബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ഈ കാര്യങ്ങൾക്കുശേഷം’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തേക്കാൾ ഒഴുക്കുള്ളതാണ്.
- source_word: ἦλθεν
  choice: പോയി
  rationale: മുൻ രംഗത്തിൽനിന്ന് യെഹൂദ്യദേശത്തേക്കുള്ള സഞ്ചാരം മലയാള വിവരണശൈലിയിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ആഒറിസ്റ്റ് സംഭവസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ശിഷ്യന്മാരും
  rationale: ‘അവന്റെ ശിഷ്യന്മാർ’ എന്ന ഉടമസ്ഥബന്ധം മലയാളത്തിൽ ‘യേശുവും ശിഷ്യന്മാരും’ എന്ന സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: യെഹൂദ്യദേശത്തേക്കു
  rationale: γῆയുടെ ‘ദേശം/പ്രദേശം’ എന്ന അർഥവും ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്ന εἰςഉം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; നഗരമായ യെരൂശലേമിൽനിന്ന് വിശാലമായ യെഹൂദ്യപ്രദേശത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കാം.
- source_word: διέτριβεν
  choice: കുറെക്കാലം താമസിക്കുകയും
  rationale: ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചയും διατρίβωയുടെ ‘സമയം ചെലവഴിക്കുക/താമസിക്കുക’ എന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: μετ’ αὐτῶν
  choice: അവരോടൊപ്പം
  rationale: യേശുവിന്റെ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള, സ്വാഭാവികമായ പരിഭാഷ.
- source_word: ἐβάπτιζεν
  choice: സ്നാനം നൽകുകയും ചെയ്തു
  rationale: അംഗീകൃതമായ മതകർമത്തെ വിഭാഗീയമായ നിർവചനമില്ലാതെ സൂചിപ്പിക്കുന്നു; ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന പ്രവർത്തനം മുൻക്രിയയോടു ചേർന്ന ഘടനയിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാൻ 4:2ന്റെ വെളിച്ചത്തിൽ ‘സ്നാനം നൽകി’ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ഈ വാക്യത്തിലെ വ്യാകരണപ്രകാരം യേശുവിനെ കർത്താവായി നിലനിർത്തി; പിന്നീട് വരുന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: മുഖ്യവാക്യത്തിൽ ശിഷ്യന്മാരാണ് സ്നാനം നൽകിയതെന്ന് പുനർരചിക്കുക.
  rationale: ഏകവചന ക്രിയയുടെ സ്വാഭാവിക വ്യാകരണകർത്താവ് യേശുവാണ്. യോഹന്നാൻ 4:2 യേശു നേരിട്ട് സ്നാനം നൽകിയില്ലെന്നും ശിഷ്യന്മാരാണ് നൽകിയതെന്നും പിന്നീട് വ്യക്തമാക്കുന്നു; അതുകൊണ്ട് 3:22ന്റെ വാചകം മാറ്റാതെ ആ വിവരണാത്മക സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘യെഹൂദ്യദേശം’, ‘സ്നാനം നൽകുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി പുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
