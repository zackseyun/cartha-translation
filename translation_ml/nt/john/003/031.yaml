id: JHN.3.31
reference: John 3:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: ml
  text: മുകളിൽനിന്ന് വരുന്നവൻ സകലത്തിനും മീതെയുള്ളവനാണ്.[a] ഭൂമിയിൽനിന്നുള്ളവൻ ഭൂമിയിൽനിന്നുള്ളവനാണ്, ഭൂമിയിൽനിന്ന് സംസാരിക്കുന്നു.[b] സ്വർഗത്തിൽനിന്ന് വരുന്നവൻ സകലത്തിനും മീതെയുള്ളവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആദ്യവാക്യത്തിലെ ‘മുകളിൽനിന്ന്’ എന്നതിന് ‘സ്വർഗത്തിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം. ἄνωθεν എന്ന ഗ്രീക്കുപദം മുകളിൽനിന്നുള്ള ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്നു; പിന്നീട് വരുന്ന ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന പ്രയോഗം അത് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഭൂമിയെക്കുറിച്ച് സംസാരിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഭൂമിയിൽനിന്ന്’ എന്ന പ്രയോഗം ആവർത്തിക്കുന്നു; അത് ഉറവിടത്തെയോ മണ്ഡലത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: മുകളിൽനിന്ന്
  rationale: ആവർത്തനമല്ല, മുകളിൽനിന്നുള്ള ഉത്ഭവമാണ് ഇവിടെ അർഥം. ‘ഭൂമിയിൽനിന്ന്’ എന്നതിനോടുള്ള ലംബമായ വൈരുധ്യം നിലനിർത്തുകയും പിന്നീട് വരുന്ന ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന പ്രയോഗത്തിലൂടെ അർഥം വ്യക്തമാകാൻ ഇട നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐρχόμενος
  choice: വരുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തിന്റെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വിവരണാത്മക സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπάνω πάντων
  choice: എല്ലാവർക്കും മീതെയുള്ളവൻ
  rationale: πάντων എന്നത് സന്ദർഭത്തിൽ വ്യക്തികളെയോ സകലത്തെയോ സൂചിപ്പിക്കാവുന്നതാണ്. മലയാളത്തിലെ ഈ പ്രയോഗം പരമോന്നതസ്ഥാനവും മേൽക്കോയ്മയും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘സകലത്തിനും മീതെ’ എന്നതും സാധ്യമാണ്.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: ഭൂമിയിൽനിന്നുള്ളവൻ
  rationale: ഭൗമികമായ ഉത്ഭവത്തെ മുൻനിർത്തുകയും തുടർന്നുള്ള ആവർത്തനവുമായി ചേർന്ന് നിൽക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: γῆ
  choice: ഭൂമി
  rationale: ഇവിടെ സ്വർഗത്തോടുള്ള പ്രപഞ്ചപരമായ വൈരുധ്യമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘ദേശം’ അല്ലെങ്കിൽ ‘നിലം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: ഭൂമിയിൽനിന്നുള്ളവനാണ്
  rationale: ഗ്രീക്കിലെ ആവർത്തനം ചുരുക്കാതെ, ഭൗമിക ഉത്ഭവത്തിനുള്ള ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: ഭൂമിയിൽനിന്ന് സംസാരിക്കുന്നു
  rationale: ἐκ എന്നതിന്റെ ആവർത്തനം സൂക്ഷിച്ച്, ഇത് സംസാരത്തിന്റെ ഉറവിടമോ മണ്ഡലമോ വിഷയമോ എന്ന കൃത്യമായ സൂക്ഷ്മാർഥം തുറന്നുവയ്ക്കുന്നു.
- source_word: οὐρανός
  choice: സ്വർഗം
  rationale: യോഹന്നാന്റെ ഈ സന്ദർഭത്തിൽ ഭൗതികമായ ആകാശത്തേക്കാൾ ദൈവികമായ സ്വർഗീയ മണ്ഡലമാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ആദ്യത്തെ ‘മുകളിൽനിന്ന്’ എന്നതും പിന്നീട് വരുന്ന ‘സ്വർഗത്തിൽനിന്ന്’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ἄνωθεν എന്നത് ‘മുകളിൽനിന്ന്’ എന്നും ἐκ τοῦ οὐρανοῦ എന്നത് ‘സ്വർഗത്തിൽനിന്ന്’ എന്നും വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിടത്തും ‘സ്വർഗത്തിൽനിന്ന്’ എന്ന് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിലെ ബന്ധമുള്ളതെങ്കിലും വ്യത്യസ്തമായ രണ്ടു പ്രയോഗങ്ങളും ഇതിലൂടെ നിലനിൽക്കുന്നു. രണ്ടാമത്തെ പ്രയോഗം ആദ്യത്തേതിന്റെ അർഥം വ്യക്തമാക്കുന്നു; അതേസമയം യേശുവിന്റെ സ്വർഗീയ ഉത്ഭവവും പരമോന്നതസ്ഥാനവും അധികവ്യാഖ്യാനമില്ലാതെ പ്രകടമാകുന്നു.
- issue: ഭൂമിയെക്കുറിച്ചുള്ള മൂന്നിരട്ടി ആവർത്തനത്തിന്റെ ശക്തി
  choice: ‘ഭൂമിയിൽനിന്ന് ... ഭൂമിയിൽനിന്ന് ... ഭൂമിയിൽനിന്ന്’ എന്ന ആവർത്തനം നിലനിർത്തി.
  alternative: ‘ഭൗമികനായവൻ ഭൗമികമായി സംസാരിക്കുന്നു’ എന്നപോലെ ചുരുക്കുക.
  rationale: ഈ ആവർത്തനം ഭൗമികവും സ്വർഗീയവുമായ ഉത്ഭവങ്ങൾക്കിടയിലെ വൈരുധ്യത്തിന് ഊന്നൽ നൽകുന്നു. അത് മിനുക്കിച്ചുരുക്കുന്നത് മൂലപാഠത്തിന്റെ വാചകബലം കുറയ്ക്കുകയും കൂടുതൽ വ്യാഖ്യാനാത്മകമാകുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ സമാന്തരഘടനയും ഭൂമിയെക്കുറിച്ചുള്ള ആവർത്തനവും നിലനിർത്തി. ‘എല്ലാവർക്കും മീതെയുള്ളവൻ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ മേൽക്കോയ്മ പ്രകടമാക്കുന്നു.
