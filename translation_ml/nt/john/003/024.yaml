id: JHN.3.24
reference: John 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: ml
  text: കാരണം, യോഹന്നാൻ അപ്പോഴും തടവിലാക്കപ്പെട്ടിരുന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, സ്നാപകയോഹന്നാൻ.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: അപ്പോഴും ... ഇല്ലായിരുന്നു
  rationale: ആഖ്യാനത്തിലെ ആ സമയത്തോളം സംഭവം നടന്നിരുന്നില്ലെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: ചുറ്റുമുള്ള വിവരണത്തിന് പശ്ചാത്തലവിശദീകരണം നൽകുന്ന ബന്ധകത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἦν βεβλημένος
  choice: തടവിലാക്കപ്പെട്ടിരുന്നില്ല
  rationale: പെരിഫ്രാസ്റ്റിക് പൂർവഭൂതകാല കർമണി രൂപം, പ്രസ്തുത സമയത്തിനു മുമ്പ് സംഭവിക്കേണ്ടിയിരുന്നെങ്കിലും അപ്പോൾവരെ സംഭവിച്ചിട്ടില്ലാത്ത തടവിലാക്കലിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘എറിയപ്പെട്ടിരുന്നില്ല’ എന്നതിനെക്കാൾ ജയിൽസന്ദർഭത്തിൽ ഇത് സ്വാഭാവികമാണ്.
- source_word: εἰς τὴν φυλακήν
  choice: തടവിൽ
  rationale: ഇവിടെ φυλακή കാവൽ എന്നതിലുപരി തടവ്/ജയിൽ എന്ന അർഥത്തിലാണ്; εἰς സൂചിപ്പിക്കുന്ന അവസ്ഥയിലേക്കുള്ള പ്രവേശനം ‘തടവിലാക്കുക’ എന്ന മലയാളപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: ഗ്രീക്ക് മൂലപാഠം വ്യക്തിയെ ‘യോഹന്നാൻ’ എന്നു മാത്രമാണ് വിളിക്കുന്നത്; ‘സ്നാപകൻ’ എന്ന തിരിച്ചറിയൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ὁ Ἰωάννης എന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘യോഹന്നാൻ’
  alternative: ‘സ്നാപകയോഹന്നാൻ’
  rationale: സന്ദർഭത്തിൽ ഇത് സ്നാപകയോഹന്നാനാണെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘യോഹന്നാൻ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തടവിലാക്കപ്പെട്ടിരുന്നു’ എന്ന പ്രയോഗം മൂലത്തിലെ കർമണി ഘടനയും മുൻകാലബന്ധവും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
