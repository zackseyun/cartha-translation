id: JHN.3.4
reference: John 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: ml
  text: 'നിക്കോദേമോസ് അവനോടു പറഞ്ഞു: “പ്രായമായ ഒരു മനുഷ്യന്[a] എങ്ങനെ ജനിക്കാൻ കഴിയും? അയാൾക്ക് തന്റെ അമ്മയുടെ ഗർഭത്തിലേക്ക് രണ്ടാമതൊരിക്കൽ പ്രവേശിച്ച് ജനിക്കാൻ കഴിയില്ലല്ലോ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രായമായ ഒരാൾക്ക്.” ഗ്രീക്കിൽ പൊതുവായ അർഥത്തിൽ പുല്ലിംഗ ഏകവചനമായ “ഒരു മനുഷ്യൻ” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: “രണ്ടാമതൊരിക്കൽ.” നിക്കോദേമോസ് യേശുവിന്റെ വാക്കുകളെ ശാരീരിക ജനനം എന്ന അക്ഷരാർഥത്തിൽ ഗ്രഹിക്കുന്നു.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: അവനോടു പറഞ്ഞു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിൽ വർത്തമാനകാലരൂപം ചരിത്രവർത്തമാനമായി ഉപയോഗിച്ചിരിക്കുന്നു; സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഏകവചനത്തിലുള്ള ഈ പദം ഇവിടെ പൊതുവായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ ഉറവിടത്തിലെ രൂപവും പൊതുവായ അർഥവും നിലനിർത്തുന്നു.
- source_word: γεννηθῆναι
  choice: ജനിക്കാൻ
  rationale: ഇവിടെ γεννάω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ജനനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മുൻവാക്യത്തിലെ ἄνωθεν എന്ന പദത്തിന്റെ വിവാദാർഥം ഇതിലേക്കു ചേർക്കാതെ ലളിതമായി പരിഭാഷപ്പെടുത്തി.
- source_word: γέρων ὤν
  choice: പ്രായമായ
  rationale: ‘വൃദ്ധനായിരിക്കെ’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μὴ δύναται
  choice: കഴിയില്ലല്ലോ?
  rationale: μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യത്തെ അടയാളപ്പെടുത്തുന്നു; ‘കഴിയില്ലല്ലോ?’ നിക്കോദേമോസിന്റെ അവിശ്വാസഭാവവും പ്രതീക്ഷിക്കുന്ന നിഷേധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: അമ്മയുടെ ഗർഭത്തിൽ
  rationale: അമ്മയോടു ബന്ധപ്പെടുത്തി ഉപയോഗിച്ച κοιλία ഇവിടെ ഉദരത്തെ പൊതുവായി അല്ല, ഗർഭത്തെയാണ് കൃത്യമായി സൂചിപ്പിക്കുന്നത്.
- source_word: δεύτερον
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ‘വീണ്ടും’ എന്നതിനെക്കാൾ δεύτερον എന്നതിന്റെ വ്യക്തമായ ‘രണ്ടാമതൊരിക്കൽ’ എന്ന അർഥം നിലനിർത്തുകയും നിക്കോദേമോസിന്റെ അക്ഷരാർഥഗ്രഹണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: പ്രവേശിച്ച് ജനിക്കാൻ
  rationale: ഉറവിടത്തിലെ ബന്ധിതമായ രണ്ട് ക്രിയകളും നിലനിർത്തി നിക്കോദേമോസിന്റെ ചോദ്യത്തിന്റെ ദൃശ്യതയും യുക്തിക്രമവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἄνθρωπος എന്ന പൊതുവായ പുല്ലിംഗ ഏകവചനത്തിന്റെ പരിഭാഷ
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരാൾ / ഒരു വ്യക്തി
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ഏകവചനരൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് പുരുഷന്മാരെ മാത്രം പരിമിതമായി സൂചിപ്പിക്കുന്നതല്ല, പ്രതിനിധാനപരമായി മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- issue: മുൻവാക്യത്തിലെ ‘വീണ്ടും/മുകളിൽനിന്ന്’ എന്ന ആശയം γεννηθῆναι എന്നതിൽ ചേർക്കണമോ
  choice: ജനിക്കാൻ ... രണ്ടാം പ്രാവശ്യം
  alternative: വീണ്ടും ജനിക്കാൻ
  rationale: ഈ വാക്യത്തിലെ δεύτερον വ്യക്തമായി ‘രണ്ടാം പ്രാവശ്യം’ എന്നാണ്. മുൻവാക്യത്തിലെ ἄνωθεν എന്ന പദത്തിന്റെ അർഥവൈവിധ്യം ഇവിടെ ഒറ്റ അർഥമായി തീർപ്പാക്കാതെ, നിക്കോദേമോസിന്റെ അക്ഷരാർഥത്തിലുള്ള പ്രതികരണം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കഴിയില്ലല്ലോ?’ എന്ന പ്രയോഗം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ ഭാവം നൽകുന്നു; ‘രണ്ടാം പ്രാവശ്യം’ ഉറവിടത്തിന്റെ കൃത്യതയും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
