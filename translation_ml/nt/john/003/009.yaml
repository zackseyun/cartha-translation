id: JHN.3.9
reference: John 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: ml
  text: 'നിക്കോദേമോസ് അവനോടു മറുപടി പറഞ്ഞു: “ഇവ എങ്ങനെ സംഭവിക്കാം?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവ എങ്ങനെ ഉണ്ടാകാം?”
    reason: γενέσθαι എന്ന പദത്തിന് ‘സംഭവിക്കുക’ എന്നും ‘ഉണ്ടാകുക/ആയിത്തീരുക’ എന്നും നൽകാവുന്ന അർഥവ്യത്യാസം സൂചിപ്പിക്കുന്ന പദപരമായ മറ്റൊരു പരിഭാഷ; δύναταιയുടെ സാധ്യതാബോധവും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടിയായി
  rationale: സംഭാഷണത്തിലെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന ἀποκρίνομαι എന്ന ക്രിയയുടെ പതിവ് അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘പറഞ്ഞു’ എന്നതോടൊപ്പം സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: Νικόδημος
  choice: നിക്കോദേമോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണരീതിയിൽ നൽകുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു … പറഞ്ഞു
  rationale: മൂലപാഠത്തിലെ സർവനാമം നിലനിർത്തുന്നു; ‘യേശുവിനോടു’ എന്ന് പേര് വ്യക്തമാക്കിക്കൊണ്ട് പാഠത്തിൽ ഇല്ലാത്തത് ചേർക്കുന്നില്ല.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: രീതിയെയോ സാധ്യതയെയോ ചോദിക്കുന്ന ഗ്രീക്ക് ചോദ്യക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക തർജമ.
- source_word: δύναται
  choice: കഴിയും
  rationale: കഴിവിനെയോ സാധ്യതയെയോ സൂചിപ്പിക്കുന്ന δύναμαι എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ταῦτα
  choice: ഇവ
  rationale: മുൻപ് യേശു പറഞ്ഞ കാര്യങ്ങളിലേക്കു ചൂണ്ടുന്ന നപുംസകലിംഗ ബഹുവചനത്തിന്റെ ബഹുവചനബലം സംരക്ഷിക്കുന്നു.
- source_word: γενέσθαι
  choice: സംഭവിക്കും
  rationale: γίνομαι ഇവിടെ സൂചിപ്പിക്കുന്ന സംഭവിക്കൽ അഥവാ യാഥാർഥ്യമായിത്തീരൽ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: പുതിയ ജനനത്തെക്കുറിച്ചുള്ള നിക്കോദേമോസിന്റെ ചോദ്യത്തിൽ γίνομαι എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ഇവ എങ്ങനെ സംഭവിക്കും?
  alternative: ഇവ എങ്ങനെ ഉണ്ടാകും?
  rationale: ‘സംഭവിക്കും’ എന്നത് കാര്യങ്ങൾ എങ്ങനെ നടപ്പിലാകുമെന്ന ചോദ്യത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. ‘ഉണ്ടാകും’ എന്നത് ‘ആയിത്തീരുക/നിലവിൽ വരുക’ എന്ന സാധ്യത സംരക്ഷിക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു; ഇതിലൂടെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ രഹസ്യം അനാവശ്യമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘മറുപടി പറഞ്ഞു’ എന്ന ഇരട്ടഘടന മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘മറുപടിയായി പറഞ്ഞു’ എന്നു നൽകി; സർവനാമവും ബഹുവചനവും നിലനിർത്തി.
