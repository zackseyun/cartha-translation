id: JHN.3.19
reference: John 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: ml
  text: 'വിധി ഇതാണ്: വെളിച്ചം ലോകത്തിലേക്കു വന്നിരിക്കുന്നു; എന്നാൽ മനുഷ്യർ വെളിച്ചത്തെക്കാൾ ഇരുട്ടിനെ സ്നേഹിച്ചു. കാരണം, അവരുടെ പ്രവൃത്തികൾ തിന്മയുള്ളവയായിരുന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: വിധി
  rationale: ഇവിടെ ന്യായവിധിയുടെ ഉള്ളടക്കമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘ശിക്ഷാവിധി’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: യോഹന്നാന്റെ മുഖ്യ രൂപകം വിശദീകരിച്ചുമാറ്റാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: ἐλήλυθεν
  choice: വന്നിരിക്കുന്നു
  rationale: വെളിച്ചത്തിന്റെ വരവിനും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തിനും ഊന്നൽ നൽകുന്ന ഗ്രീക്ക് പൂർണകാലത്തെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: κόσμον
  choice: ലോകത്തിലേക്കു
  rationale: യോഹന്നാനിലെ പതിവായ പ്രയോഗവും അതിലെ സൃഷ്ടി/മനുഷ്യലോകം എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἠγάπησαν
  choice: സ്നേഹിച്ചു
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ നൈതികഭാരം സംരക്ഷിക്കുന്നു; ‘തിരഞ്ഞെടുത്തു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: οἱ ἄνθρωποι
  choice: മനുഷ്യർ
  rationale: പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: μᾶλλον ... ἢ
  choice: വെളിച്ചത്തെക്കാൾ
  rationale: താരതമ്യപരമായ മുൻഗണന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ σκότος
  choice: ഇരുട്ട്
  rationale: വെളിച്ചത്തോടുള്ള യോഹന്നാനീയ പ്രതീകവൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: πονηρὰ
  choice: തിന്മയുള്ളവ
  rationale: പ്രവൃത്തികളുടെ നൈതികദോഷം വ്യക്തമായി അറിയിക്കുന്നു; ‘മോശം’ എന്നതിനെക്കാൾ ശക്തവും കൃത്യവുമാണ്.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ അർഥവും യോഹന്നാനിലെ പദബന്ധവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘വെളിച്ചം’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ‘വെളിച്ചം’ എന്ന രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘യേശു’ എന്ന് വ്യാഖ്യാനിച്ച് പകരംവയ്ക്കുക, അല്ലെങ്കിൽ വ്യക്തമായ ക്രിസ്തുശീർഷകമായി അവതരിപ്പിക്കുക.
  rationale: സന്ദർഭം പുത്രനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം രൂപകമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ യോഹന്നാനീയ ദൈവശാസ്ത്രഭാവം വിശദീകരിച്ചുമാറ്റാതെ സംരക്ഷിച്ചു.
- issue: οἱ ἄνθρωποι എന്നതിന്റെ പൊതുവായ വ്യാപ്തി
  choice: ‘മനുഷ്യർ’
  alternative: ‘പുരുഷന്മാർ’
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘മനുഷ്യർ’ ആ വ്യാപ്തി ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- issue: κρίσις എന്നതിന്റെ വ്യാപ്തി
  choice: ‘വിധി’
  alternative: ‘ശിക്ഷാവിധി’ അല്ലെങ്കിൽ ‘കുറ്റവിധി’
  rationale: വാക്യം വിധിയുടെ അടിസ്ഥാനവും വെളിപ്പെടുന്ന സ്വഭാവവും അവതരിപ്പിക്കുന്നു; ഫലം മാത്രം മുൻകൂട്ടി നിർണ്ണയിക്കുന്ന പരിഭാഷ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വെളിച്ചം–ഇരുട്ട് വൈരുധ്യവും ‘വന്നിരിക്കുന്നു’ എന്ന പൂർണകാലഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്. ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
