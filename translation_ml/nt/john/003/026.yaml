id: JHN.3.26
reference: John 3:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: ml
  text: 'അവർ യോഹന്നാന്റെ അടുക്കൽ വന്ന് അവനോടു പറഞ്ഞു: “റബ്ബീ, യോർദാന്റെ മറുകരയിൽ അങ്ങയോടുകൂടെ ഉണ്ടായിരുന്നവൻ—ആരെക്കുറിച്ച് അങ്ങ് സാക്ഷ്യം പറഞ്ഞുവോ[a]—ഇതാ, ഇയാൾ[b] സ്നാനം കഴിപ്പിക്കുന്നു; എല്ലാവരും ഇയാളുടെ അടുക്കലേക്കു ചെല്ലുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആർക്ക് അങ്ങ് സാക്ഷ്യം നൽകിയോ.” ഗ്രീക്കിലെ ദത്തീവ് ബന്ധരൂപത്തെ “ആരെക്കുറിച്ച്” എന്നും “ആർക്ക്” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അവൻ.” ഗ്രീക്ക് οὗτος കൂടുതൽ വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുന്ന “ഇയാൾ” എന്ന രൂപമാണ്; സംസാരിക്കുന്നവരുടെ തീക്ഷ്ണമായ ഊന്നൽ ഇതിൽ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: യോഹന്നാന്റെ അടുക്കൽ വന്ന്
  rationale: യോഹന്നാനെ സമീപിക്കുന്ന ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: യഹൂദ പശ്ചാത്തലവും യോഹന്നാന്റെ സുവിശേഷത്തിലെ സംബോധനരീതിയും നിലനിർത്താൻ പദം ലിപ്യന്തരണം ചെയ്തു.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദാന്റെ മറുകരയിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ പ്രയോഗത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: ആരെക്കുറിച്ച് അങ്ങ് സാക്ഷ്യം പറഞ്ഞുവോ
  rationale: സന്ദർഭത്തിൽ യോഹന്നാൻ യേശുവിനെക്കുറിച്ചു നൽകിയ സാക്ഷ്യമാണ് പ്രധാന അർഥം; ഗ്രീക്ക് ദത്തിവിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഇടച്ചൊല്ലിന്റെ ഊന്നൽ, പഴഞ്ചനാകാതെ, സ്വാഭാവികമായി പകരുന്നു.
- source_word: οὗτος
  choice: ഇയാൾ
  rationale: സാധാരണ ‘അവൻ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് സൂചകസർവനാമത്തിലെ ചൂണ്ടിക്കാണിക്കുന്നതും അല്പം തീക്ഷ്ണവുമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: βαπτίζει
  choice: സ്നാനം കഴിപ്പിക്കുന്നു
  rationale: മറ്റുള്ളവർക്കു സ്നാനം നൽകുന്ന തുടരുന്ന പ്രവൃത്തിയാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: എല്ലാവരും ഇയാളുടെ അടുക്കലേക്കു ചെല്ലുന്നു
  rationale: പരാതിയുടെ അതിശയോക്തിപരമായ പൊതുവാക്കൽ നിലനിർത്തുന്നു; ‘ചെല്ലുന്നു’ എന്നത് സംസാരിക്കുന്നവരുടെ ദിശാബോധം അനാവശ്യമായി നിർണ്ണയിക്കാതെ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ μαρτυρέω എന്ന സാക്ഷ്യപദാവലി
  choice: സാക്ഷ്യം പറഞ്ഞുവോ
  alternative: സാക്ഷ്യം വഹിച്ചുവോ
  rationale: ‘സാക്ഷ്യം പറയുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും യോഹന്നാനിലെ സാക്ഷ്യവിഷയം നിലനിർത്തുന്നതുമാണ്; ഒരു പ്രത്യേക വ്യാഖ്യാനപാരമ്പര്യവും ഇതിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ᾧ എന്ന ദത്തിവ് ആരെ സൂചിപ്പിക്കുന്നു എന്ന ബന്ധം
  choice: ആരെക്കുറിച്ച് അങ്ങ് സാക്ഷ്യം പറഞ്ഞുവോ
  alternative: ആർക്കു അങ്ങ് സാക്ഷ്യം നൽകിയോ
  rationale: സന്ദർഭം ‘ആരെക്കുറിച്ച്’ എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഗ്രീക്ക് വ്യാകരണത്തിലെ യഥാർഥ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. യോഹന്നാനോടുള്ള ആദരസൂചകമായ സംബോധനയ്ക്ക് ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യത്തിലെ പരാതിസ്വരം ‘ഇതാ, ഇയാൾ’ എന്നും ‘എല്ലാവരും’ എന്നും നിലനിർത്തിയെങ്കിലും വ്യാഖ്യാനം അമിതമായി ചേർത്തിട്ടില്ല.
