id: JHN.3.11
reference: John 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: ml
  text: '“സത്യമായി[a], സത്യമായി, ഞാൻ നിന്നോടു പറയുന്നു: ഞങ്ങൾ[b] അറിയുന്നതു പറയുന്നു, ഞങ്ങൾ കണ്ടിട്ടുള്ളതിന് സാക്ഷ്യം നൽകുന്നു, നിങ്ങൾ ഞങ്ങളുടെ സാക്ഷ്യം സ്വീകരിക്കുന്നില്ല[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ആമേൻ, ആമേൻ.”
    reason: lexical_alternative
  - marker: b
    text: “ഞങ്ങൾ”, “ഞങ്ങളുടെ” എന്നീ ആവർത്തിച്ചുള്ള ബഹുവചനങ്ങൾ ആരെ ഉൾക്കൊള്ളുന്നു എന്നതു തർക്കവിധേയമാണ്.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ “അംഗീകരിക്കുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: ഊന്നിപ്പറയുന്ന ഇരട്ട പ്രയോഗം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നു
  rationale: രണ്ടാംപുരുഷ ഏകവചനമായ σοι വ്യക്തമായി നിലനിർത്തുകയും ഗൗരവമുള്ള നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: ഞങ്ങൾ അറിയുന്നതു പറയുന്നു
  rationale: അറിയുന്നതാണ് സംസാരത്തിന്റെ ഉള്ളടക്കം എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഞങ്ങൾ’ എന്ന ബഹുവചനം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: ഞങ്ങൾ കണ്ടിട്ടുള്ളതിനു സാക്ഷ്യം നൽകുന്നു
  rationale: ἑωράκαμεν എന്ന പൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി ‘കണ്ടിട്ടുള്ളത്’ എന്ന രൂപത്തിൽ സൂചിപ്പിക്കുകയും μαρτυρέωയുടെ സാക്ഷ്യാർഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: ഞങ്ങളുടെ സാക്ഷ്യം
  rationale: മുൻപത്തെ ‘സാക്ഷ്യം നൽകുന്നു’ എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുന്നു.
- source_word: οὐ λαμβάνετε
  choice: നിങ്ങൾ ... സ്വീകരിക്കുന്നില്ല
  rationale: λαμβάνωയുടെ അടിസ്ഥാനമായ ‘സ്വീകരിക്കുക’ എന്ന ആശയം നിലനിർത്തുന്നു; ക്രിയയുടെ രണ്ടാംപുരുഷ ബഹുവചനം ‘നിങ്ങൾ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: എന്നാൽ
  rationale: ഗ്രീക്കിൽ സാധാരണ സംയോജകമായ καί ആണെങ്കിലും, സത്യസാക്ഷ്യത്തിനും അതു സ്വീകരിക്കാത്തതിനും ഇടയിലെ സന്ദർഭപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഒന്നാംപുരുഷ ബഹുവചനം (‘ഞങ്ങൾ … ഞങ്ങളുടെ’) ആരെ ഉൾക്കൊള്ളുന്നു
  choice: ‘ഞങ്ങൾ’, ‘ഞങ്ങളുടെ’ എന്നീ ബഹുവചനങ്ങൾ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തി.
  alternative: യേശുവും ശിഷ്യന്മാരും; പ്രഭാഷണപരമായ ബഹുവചനം; അല്ലെങ്കിൽ വിശാലമായ സ്വർഗീയ/ദൈവിക സാക്ഷ്യം എന്നു നിർണ്ണയിക്കുക.
  rationale: ഗ്രീക്ക് ബഹുവചനം വ്യക്തമാണ്; എന്നാൽ അതിൽ ഉൾപ്പെടുന്നവർ ആരെന്നത് തർക്കവിധേയമാണ്. വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: രണ്ടാംപുരുഷ സർവനാമങ്ങളുടെ സംഖ്യ
  choice: σοι എന്ന ഏകവചനം ‘നിന്നോടു’ എന്നും λαμβάνετε എന്ന ബഹുവചനം ‘നിങ്ങൾ’ എന്നും വേർതിരിച്ചു.
  alternative: രണ്ടും ആദരസൂചകമായ ‘നിങ്ങൾ’ ഉപയോഗിച്ച് സംഖ്യാവ്യത്യാസം മറയ്ക്കുക.
  rationale: യേശു നിക്കോദേമൊസിനോട് വ്യക്തിപരമായി സംസാരിക്കുന്നതിൽനിന്ന് ഒരു വിശാല കൂട്ടത്തെ അഭിസംബോധന ചെയ്യുന്നതിലേക്കുള്ള ഗ്രീക്ക് വചനത്തിലെ മാറ്റം മലയാളത്തിലും ദൃശ്യമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചനമായ ‘നിന്നോടു’ എന്നും ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നും ഉപയോഗിച്ച് മൂലപാഠത്തിലെ സംഖ്യാമാറ്റം സംരക്ഷിച്ചു. സാക്ഷ്യവുമായി ബന്ധപ്പെട്ട യോഹന്നാനീയ പദബന്ധം ‘സാക്ഷ്യം നൽകുന്നു / ഞങ്ങളുടെ സാക്ഷ്യം’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
