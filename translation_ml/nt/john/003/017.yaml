id: JHN.3.17
reference: John 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: ml
  text: എന്തെന്നാൽ, ലോകത്തെ വിധിക്കാനല്ല[a] ദൈവം പുത്രനെ ലോകത്തിലേക്ക് അയച്ചത്; മറിച്ച് അവനിലൂടെ ലോകം രക്ഷിക്കപ്പെടേണ്ടതിനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലോകത്തെ കുറ്റംവിധിക്കാൻ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ഈ കൂടുതൽ പരിമിതമായ അർഥം വരാമെങ്കിലും, അതിന്റെ അടിസ്ഥാനാർഥം ‘വിധിക്കുക’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: എന്തെന്നാൽ ... അല്ല
  rationale: γάρ മുൻവാക്യത്തിലെ പ്രസ്താവനയുടെ വിശദീകരണം അവതരിപ്പിക്കുന്നു; ‘എന്തെന്നാൽ’ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു, ‘അല്ല’ നിഷേധം വ്യക്തമാക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചത്
  rationale: ἀποστέλλω എന്നതിന്റെ സാധാരണ അർഥമായ ‘അയയ്ക്കുക’ ഇവിടെ സ്വാഭാവികമാണ്; നിയോഗത്തിന്റെ ആശയം അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ θεός മലയാളത്തിൽ സ്വാഭാവികമായി ‘ദൈവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τὸν υἱὸν
  choice: പുത്രനെ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘തന്റെ പുത്രനെ’ എന്നു ചേർക്കാതെ, സ്ഥാനനാമസ്വഭാവമുള്ള ‘പുത്രനെ’ നിലനിർത്തുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്ക്
  rationale: εἰς ചലനം അല്ലെങ്കിൽ പ്രവേശനം സൂചിപ്പിക്കുന്നതിനാൽ ‘ലോകത്തിലേക്ക്’ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: ലോകത്തെ വിധിക്കാൻ
  rationale: κρίνω എന്നതിന് അടിസ്ഥാനപരമായി ‘വിധിക്കുക’ എന്ന വിശാലാർഥമാണുള്ളത്; ‘കുറ്റംവിധിക്കുക’ എന്ന കൂടുതൽ പരിമിതമായ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല. ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം ‘വിധിക്കാൻ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἀλλ’ ἵνα
  choice: മറിച്ച് ... വേണ്ടതിനാണ്
  rationale: രണ്ടു ഉദ്ദേശ്യങ്ങൾ തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σωθῇ
  choice: രക്ഷിക്കപ്പെടേണ്ടതിനാണ്
  rationale: σῴζω-യുടെ കർമണിപ്രയോഗവും രക്ഷ/വിടുതൽ ഉൾക്കൊള്ളുന്ന വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: വാക്യത്തിലെ ആവർത്തനം നിലനിർത്തുകയും യോഹന്നാന്റെ പ്രയോഗത്തെ ‘മനുഷ്യർ’ എന്നതിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം അല്ലെങ്കിൽ മാധ്യമം ‘അവനിലൂടെ’ എന്നതിൽ വ്യക്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: σωθῇ എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ κρίνῃ എന്നതിന്റെ അർഥം
  choice: വിധിക്കുക
  alternative: കുറ്റംവിധിക്കുക
  rationale: κρίνω എന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിധിക്കുക’ എന്ന വിശാലമായ അടിസ്ഥാനാർഥമാണുള്ളത്. സന്ദർഭത്തിൽ ‘കുറ്റംവിധിക്കുക’ എന്ന പരിമിതാർഥം സാധ്യമാണെങ്കിലും, അത് മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നത് പുത്രന്റെ ദൗത്യത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കും. അതിനാൽ വിശാലാർഥം പാഠത്തിൽ നിലനിർത്തി പരിമിതാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘എന്തെന്നാൽ’ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു; ആവർത്തിക്കുന്ന ‘ലോകം’ എന്ന പദവും ‘പുത്രൻ’ എന്ന സ്ഥാനനാമസ്വഭാവവും സംരക്ഷിച്ചു.
