id: JHN.3.34
reference: John 3:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: ml
  text: ദൈവം അയച്ചവൻ ദൈവത്തിന്റെ വാക്കുകൾ സംസാരിക്കുന്നു; എന്തെന്നാൽ ദൈവം ആത്മാവിനെ അളവില്ലാതെ നൽകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ ആത്മാവിനെ അളവില്ലാതെ നൽകുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ‘അവൻ’ എന്നത് ദൈവം അയച്ചവനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ‘നൽകുന്നു’ എന്ന ക്രിയയുടെ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: ദൈവം അയച്ചവൻ
  rationale: ബന്ധസർവനാമത്തിന്റെ പുരുഷലിംഗ ഏകവചന സ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ നാമവൽക്കരിച്ച പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ച
  rationale: യോഹന്നാനിലെ അയയ്ക്കൽഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; ‘നിയോഗിച്ച’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വാക്കുകൾ
  rationale: ῥήματα എന്ന ബഹുവചനം സൂചിപ്പിക്കുന്ന സംസാരിക്കപ്പെട്ട വാക്കുകൾ എന്ന അർഥം വ്യക്തമാക്കുന്നു; ‘വചനങ്ങൾ’ എന്നത് എഴുതപ്പെട്ട തിരുവെഴുത്തുകളെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാൻ ഇടയുണ്ട്.
- source_word: λαλεῖ
  choice: സംസാരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർച്ചയായ സംസാരിക്കൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ ... ἐκ μέτρου
  choice: അളവില്ലാതെ
  rationale: അളന്നു പരിമിതപ്പെടുത്താതെ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകവും അർഥവും ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δίδωσιν
  choice: നൽകുന്നു
  rationale: വർത്തമാനകാല പ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു; ‘ദാനം ചെയ്യുന്നു’ എന്നതിനെക്കാൾ വിശാലവും സ്വാഭാവികവുമാണ്.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവിനെ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ഈ സന്ദർഭവും ആദരസൂചകമായ രൂപവും ആ സൂചന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: δίδωσιν (‘നൽകുന്നു’) എന്ന ക്രിയയുടെ കർത്താവ്
  choice: 'മുഖ്യപാഠത്തിൽ ദൈവത്തെ കർത്താവായി വ്യക്തമാക്കുന്നു: ‘ദൈവം ആത്മാവിനെ ... നൽകുന്നു.’'
  alternative: ദൈവം അയച്ചവൻ, അഥവാ പുത്രൻ, ആത്മാവിനെ അളവില്ലാതെ നൽകുന്നു.
  rationale: ഗ്രീക്കിൽ ഈ ക്രിയയുടെ കർത്താവ് തുറന്നുപറഞ്ഞിട്ടില്ല. വാക്യത്തിന്റെ വിശദീകരണക്രമവും അടുത്ത വാക്യത്തിലെ പിതാവിന്റെ നൽകലും ദൈവത്തെ കർത്താവായി മനസ്സിലാക്കുന്നതിന് പിന്തുണ നൽകുന്നു. എങ്കിലും അയക്കപ്പെട്ടവനെ കർത്താവായി എടുക്കുന്നതും വ്യാകരണപരമായി സാധ്യമായതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവത്തിന്റെ വാക്കുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സംസാരത്തെ സൂചിപ്പിക്കുന്ന ῥήματα എന്ന പദത്തോട് യോജിച്ചതുമാണ്. അർദ്ധവിരാമം കാരണം-ഫലം ബന്ധമുള്ള രണ്ടു ഉപവാക്യങ്ങളെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
