id: JHN.3.20
reference: John 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: ml
  text: കാരണം, തിന്മ പ്രവർത്തിക്കുന്ന ഏവനും വെളിച്ചത്തെ വെറുക്കുന്നു; തന്റെ പ്രവൃത്തികൾ വെളിപ്പെടാതിരിക്കേണ്ടതിന് അയാൾ വെളിച്ചത്തിലേക്കു വരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വെളിപ്പെടുക” എന്നതിന് “തെറ്റെന്നു തെളിയപ്പെടുക” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദത്തിന് തെറ്റ് പുറത്തുകൊണ്ടുവരുക, കുറ്റം ചൂണ്ടിക്കാണിക്കുക, ശാസിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: ഏവനും
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തോടു ചേർന്ന πᾶς, ഇങ്ങനെ പ്രവർത്തിക്കുന്ന ഏതൊരു വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ പൊതുപ്രയോഗമാണ് ‘ഏവനും’. γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണം നൽകുന്നു; വാക്യബന്ധത്തിൽ അത് പ്രത്യേകം ‘കാരണം’ എന്നു ചേർക്കാതെ സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: φαῦλα πράσσων
  choice: തിന്മ പ്രവർത്തിക്കുന്ന
  rationale: φαῦλα ഇവിടെ യോഹന്നാന്റെ വെളിച്ചം–ഇരുട്ട് വൈരുധ്യത്തിൽ ധാർമ്മിക തിന്മയെ സൂചിപ്പിക്കുന്നു. വർത്തമാനകാല കൃദന്തം സ്വഭാവസവിശേഷമായോ തുടരുന്നോ ഉള്ള പ്രവൃത്തിയെ അവതരിപ്പിക്കുന്നു; ‘പ്രവർത്തിക്കുന്ന’ ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: μισεῖ τὸ φῶς
  choice: വെളിച്ചത്തെ വെറുക്കുന്നു
  rationale: μισεῖയുടെ ശക്തമായ വിരോധഭാവവും τὸ φῶς എന്ന യോഹന്നാനീയ രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: വെളിച്ചത്തിലേക്കു വരുന്നില്ല
  rationale: വെളിപ്പാടിലേക്കും സത്യത്തിലേക്കും നീങ്ങുന്നതിന്റെ യോഹന്നാനീയ ദൃശ്യരൂപം ലളിതവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: ἵνα μὴ ἐλεγχθῇ
  choice: വെളിപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: ἵνα μήയുടെ നിഷേധാത്മക ഉദ്ദേശ്യവും വെളിച്ചം പ്രവൃത്തികളെ പുറത്തുകൊണ്ടുവരുന്ന സന്ദർഭവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു. ἐλέγχωയുടെ ശാസിക്കുക/കുറ്റം തെളിയിക്കുക എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὰ ἔργα αὐτοῦ
  choice: തന്റെ പ്രവൃത്തികൾ
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുപുരുഷരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതിബിംബ സർവനാമമായ ‘തന്റെ’ കൊണ്ടു നിലനിർത്തുന്നു; ‘പ്രവൃത്തികൾ’ ἔργαയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἐλεγχθῇ എന്ന പദം വെളിച്ചവുമായി ബന്ധപ്പെട്ട് നൽകുന്ന അർഥം
  choice: വെളിപ്പെടുക
  alternative: ശാസിക്കപ്പെടുക; കുറ്റം തെളിയിക്കപ്പെടുക
  rationale: വെളിച്ചം പ്രവൃത്തികളെ പുറത്തുകൊണ്ടുവരുന്നു എന്ന ഉടനെയുള്ള രൂപകസന്ദർഭത്തിന് ‘വെളിപ്പെടുക’ ഏറ്റവും യോജിക്കുന്നു; അതേസമയം ഗ്രീക്കുപദത്തിന്റെ ശാസനാത്മകവും കുറ്റബോധം വരുത്തുന്നതുമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: പൊതുവായ പ്രസ്താവനയിലെ ഏകവചന പുരുഷരൂപം
  choice: അയാൾ / തന്റെ
  alternative: ആ വ്യക്തി / അവരുടെ
  rationale: ὁ ... πράσσων ... αὐτοῦ എന്ന ഏകവചന പൊതുരൂപം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; പ്രസ്താവന പുരുഷന്മാർക്കു മാത്രം ബാധകമാണെന്ന അർഥം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വെളിച്ചം’ എന്ന കേന്ദ്ര യോഹന്നാനീയ രൂപകം പരാവർത്തനം ചെയ്യാതെ സൂക്ഷിച്ചു. പൊതുവായ ഏകവചനത്തിന് ‘അയാൾ/തന്റെ’ ഉപയോഗിച്ചെങ്കിലും അത് ഏതു വ്യക്തിയെയും ഉൾക്കൊള്ളുന്നതാണ്.
