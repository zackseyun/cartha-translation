id: JHN.3.16
reference: John 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ദൈവം ലോകത്തെ ഇങ്ങനെ[a] സ്നേഹിച്ചു: തന്റെ ഏകപുത്രനെ[b] നൽകി, അങ്ങനെ അവനിൽ വിശ്വസിക്കുന്ന ഏവനും നശിച്ചുപോകാതെ നിത്യജീവൻ പ്രാപിക്കേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “ദൈവം ലോകത്തെ അത്രമാത്രം സ്നേഹിച്ചു.” എന്നാൽ ഗ്രീക്ക് വാചകം ദൈവസ്നേഹത്തിന്റെ രീതിയെ ഊന്നുന്നതായും മനസ്സിലാക്കാം: “ദൈവം ലോകത്തെ ഇങ്ങനെ സ്നേഹിച്ചു.”'
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ ഏകജാതനായ പുത്രനെ” എന്നും വിവർത്തനം ചെയ്യാറുണ്ട്; “തന്റെ അനന്യനായ പുത്രനെ” എന്നും അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: ഇങ്ങനെയാണ്
  rationale: യോഹന്നാന്റെ ഈ വാക്യത്തിലെ പ്രയോഗം സ്നേഹത്തിന്റെ അളവിനേക്കാൾ അതിന്റെ രീതിയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; പുത്രനെ നൽകിയത് ആ രീതി വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണപരമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἠγάπησεν
  choice: സ്നേഹിച്ചത്
  rationale: അയോറിസ്റ്റിന്റെ സംഭവസൂചന നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഇങ്ങനെയാണ്’ ഘടനയോടു ചേരുകയും ചെയ്യുന്നു.
- source_word: τὸν κόσμον
  choice: ലോകത്തെ
  rationale: κόσμος എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; അതിനെ ‘മനുഷ്യവർഗം’ എന്നൊതുക്കുന്നില്ല.
- source_word: ὥστε ... ἔδωκεν
  choice: അവൻ ... നൽകി
  rationale: ദൈവസ്നേഹത്തിന്റെ പ്രകടനം/ഫലം സ്വാഭാവിക മലയാളത്തിൽ ദ്വിബിന്ദുവിനുശേഷം അവതരിപ്പിക്കുന്നു.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: തന്റെ ഏകപുത്രനെ
  rationale: μονογενής സൂചിപ്പിക്കുന്ന പുത്രന്റെ അനന്യതയും പിതാവുമായുള്ള പുത്രബന്ധവും ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു; പരമ്പരാഗത മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: പ്രാപിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യം/ലക്ഷ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: അവനിൽ വിശ്വസിക്കുന്ന ഏവനും
  rationale: ഉൾക്കൊള്ളുന്ന പൊതുവായ അർഥവും πιστεύω εἰς എന്ന ബന്ധപ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μὴ ἀπόληται
  choice: നശിച്ചുപോകാതെ
  rationale: ἀπόλλυμι എന്നതിന്റെ ഗൗരവം നിലനിർത്തുന്നു; നാശത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: നിത്യജീവൻ പ്രാപിക്കേണ്ടതിനാണ്
  rationale: ἔχω എന്നതിന്റെ കൈവശം/ലഭ്യതാ ആശയം സന്ദർഭോചിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Οὕτως എന്നതിന്റെ അർഥം
  choice: 'രീതി: ‘ഇങ്ങനെയാണ്’'
  alternative: 'അളവ്/തീവ്രത: ‘അത്രമാത്രം’'
  rationale: തുടർന്നുള്ള പുത്രനെ നൽകൽ ദൈവം എങ്ങനെ സ്നേഹിച്ചു എന്നു വിശദീകരിക്കുന്നു; സ്നേഹത്തിന്റെ അളവ് മാത്രം മുൻനിർത്തുന്നില്ല.
- issue: μονογενής എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ‘ഏകപുത്രൻ’
  alternative: ‘ഏകജാതനായ പുത്രൻ’ അല്ലെങ്കിൽ ‘അനന്യനായ പുത്രൻ’
  rationale: പുത്രന്റെ അനന്യബന്ധം സംരക്ഷിക്കുമ്പോൾ ശാരീരിക ജനനത്തിന്റെ ആശയം അനാവശ്യമായി ചുമത്തുന്നില്ല; ചരിത്രപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: πᾶς ὁ πιστεύων എന്നതിന്റെ വ്യാപ്തി
  choice: ‘വിശ്വസിക്കുന്ന ഏവനും’
  alternative: ‘വിശ്വസിക്കുന്നവൻ ആരായാലും’
  rationale: വാക്യത്തിന്റെ ഉൾക്കൊള്ളുന്ന പൊതുവായ ക്ഷണം നിലനിർത്തുന്നു; തിരഞ്ഞെടുപ്പ്, പ്രായശ്ചിത്തത്തിന്റെ വ്യാപ്തി, മനുഷ്യപ്രതികരണം തുടങ്ങിയ പിന്നീടുള്ള തർക്കങ്ങൾ ഇതിൽ ചേർക്കുന്നില്ല.
- issue: ἵνα ഉപവാക്യത്തിലെ ഉദ്ദേശ്യവും ഫലവും
  choice: ‘നശിച്ചുപോകാതെ നിത്യജീവൻ പ്രാപിക്കേണ്ടതിനാണ്’
  alternative: ‘നശിച്ചുപോകുകയില്ല, നിത്യജീവൻ പ്രാപിക്കും’
  rationale: സൂചകപ്രസ്താവനയായി കടുപ്പിക്കാതെ ഗ്രീക്കിലെ സബ്ജങ്ക്റ്റീവ് ഉൾപ്പെട്ട ഉദ്ദേശ്യഘടന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഏകപുത്രൻ’, ‘നിത്യജീവൻ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദത്തിനും വാക്യാവസാനത്തിനും ചേർത്തിരിക്കുന്നു.
