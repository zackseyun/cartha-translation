revisions:
- from: 'കാരണം, ദൈവം ലോകത്തെ സ്നേഹിച്ചത് ഇങ്ങനെയാണ്: അവൻ തന്റെ ഏകപുത്രനെ[b] നൽകി; അവനിൽ വിശ്വസിക്കുന്ന ഏവനും നശിച്ചുപോകാതെ നിത്യജീവൻ പ്രാപിക്കേണ്ടതിനാണ്.[a]'
