revisions:
- from: കാറ്റ് അതിന് ഇഷ്ടമുള്ളിടത്ത് വീശുന്നു[a]. അതിന്റെ ശബ്ദം നീ കേൾക്കുന്നു; എന്നാൽ അത് എവിടെനിന്നു വരുന്നു, എവിടേക്കു പോകുന്നു എന്നു നീ അറിയുന്നില്ല[b]. ആത്മാവിൽനിന്നു ജനിച്ച ഏവനും അങ്ങനെതന്നെയാണ്.
  to: കാറ്റ് അതിന് ഇഷ്ടമുള്ളിടത്ത്[a] വീശുന്നു. അതിന്റെ ശബ്ദം നീ കേൾക്കുന്നു; എന്നാൽ അത് എവിടെനിന്ന് വരുന്നു, എവിടേക്കു പോകുന്നു എന്നു നീ അറിയുന്നില്ല[b]. ആത്മാവിൽനിന്ന് ജനിച്ച ഏവനും അങ്ങനെതന്നെയാണ്.
  rationale: അർഥത്തിൽ മാറ്റമൊന്നും വരുത്താതെ അടിക്കുറിപ്പ് a-യുടെ നങ്കൂരം അതുമായി ഏറ്റവും ബന്ധപ്പെട്ട പദത്തിലേക്കു മാറ്റി; അടിക്കുറിപ്പിലെ ഗ്രീക്കുപദം ഗ്രീക്ക് ലിപിയിലാക്കി. ‘എവിടെനിന്ന്,’ ‘ആത്മാവിൽനിന്ന്’ എന്നീ സാധാരണ ആധുനിക സ്പെല്ലിങ്ങുകളും സ്വീകരിച്ചു.
