id: JHN.3.8
reference: John 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: ml
  text: കാറ്റ് അതിന് ഇഷ്ടമുള്ളിടത്ത്[a] വീശുന്നു. അതിന്റെ ശബ്ദം നീ കേൾക്കുന്നു; എന്നാൽ അത് എവിടെനിന്ന് വരുന്നു, എവിടേക്കു പോകുന്നു എന്നു നീ അറിയുന്നില്ല[b]. ആത്മാവിൽനിന്ന് ജനിച്ച ഏവനും അങ്ങനെതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ πνεῦμα എന്ന പദത്തിന് ‘കാറ്റ്’ എന്നും ‘ആത്മാവ്’ എന്നും അർഥമാകാം. ഈ വാക്യത്തിന്റെ രണ്ടു ഭാഗങ്ങളിലും യേശു ഒരേ പദം ഉപയോഗിച്ച് പദകളി സൃഷ്ടിക്കുന്നു; മലയാളത്തിൽ അത് പൂർണമായി പുനരാവിഷ്കരിക്കാനാവില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘ശബ്ദം’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ‘സ്വരം’ എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ അത് കാറ്റിന്റെ കേൾക്കാവുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (ആദ്യ പ്രയോഗം)
  choice: കാറ്റ്
  rationale: πνεῖ (‘വീശുന്നു’), കേൾക്കാവുന്ന φωνή (‘ശബ്ദം’) എന്നിവയോടൊപ്പം വരുന്നതിനാൽ ഇവിടെ കാലാവസ്ഥാപരമായ ‘കാറ്റ്’ എന്ന അർഥമാണ് സ്വാഭാവികം. വാക്യത്തിന്റെ അവസാനത്തിൽ അതേ ഗ്രീക്ക് പദം ‘ആത്മാവ്’ എന്ന അർഥത്തിൽ വരുന്നതിലെ പദപ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὅπου θέλει
  choice: അതിന് ഇഷ്ടമുള്ളിടത്ത്
  rationale: θέλει-യിലെ ഇച്ഛാശക്തിയുടെ ഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: πνεῖ
  choice: വീശുന്നു
  rationale: πνεῦμα ഇവിടെ ‘കാറ്റ്’ ആയതിനാൽ കാലാവസ്ഥാപരമായ ദൃശ്യത്തെ വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാളക്രിയയാണിത്.
- source_word: φωνήν
  choice: ശബ്ദം
  rationale: φωνή എന്നതിന് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം. ഇവിടെ കാറ്റിന്റെ കേൾക്കാവുന്ന ഫലമാണ് ഉദ്ദേശിക്കുന്നതിനാൽ ‘ശബ്ദം’ സ്വാഭാവികമാണ്.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: അത് എവിടെനിന്നു വരുന്നു, എവിടേക്കു പോകുന്നു എന്നു നീ അറിയുന്നില്ല
  rationale: πόθεν/ποῦ എന്ന ദിശാസൂചക വ്യത്യാസവും ἔρχεται/ὑπάγει എന്ന സമാന്തര ക്രിയകളും വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: οὕτως ἐστὶν
  choice: അങ്ങനെതന്നെയാണ്
  rationale: കാറ്റിന്റെ ഉപമയെ തുടർന്നുള്ള പ്രയോഗവുമായി ബന്ധിപ്പിക്കുന്ന താരതമ്യബലം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: πᾶς ὁ γεγεννημένος
  choice: ജനിച്ച ഏവനും
  rationale: സാർവത്രികമായ substantival പ്രയോഗം ‘ഏവനും’ വഴി നൽകുന്നു; perfect participle സൂചിപ്പിക്കുന്ന, ജനനത്തിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥ മലയാളത്തിലെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളപ്പെടുന്നു.
- source_word: ἐκ τοῦ πνεύματος (അവസാന പ്രയോഗം)
  choice: ആത്മാവിൽനിന്നു
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം ‘-ൽനിന്നു’ വഴി നേരിട്ട് നിലനിർത്തുന്നു. യോഹന്നാൻ 3-ലെ പുതുജനനസന്ദർഭത്തിൽ πνεῦμα ഇവിടെ ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിൽ πνεῦμα എന്ന പദത്തിന്റെ ഇരട്ട അർഥം
  choice: ആദ്യ പ്രയോഗം ‘കാറ്റ്’ എന്നും അവസാന പ്രയോഗം ‘ആത്മാവ്’ എന്നും വിവർത്തനം ചെയ്യുക.
  alternative: രണ്ടിടത്തും ഒരേ മലയാളപദം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ആദ്യ പ്രയോഗം ‘ആത്മാവ്’ എന്നു നൽകി ‘കാറ്റ്’ എന്നത് അടിക്കുറിപ്പിലാക്കുക.
  rationale: ആദ്യ ഭാഗത്തെ ‘വീശുന്നു’, ‘ശബ്ദം കേൾക്കുന്നു’ എന്നീ സൂചനകൾ ‘കാറ്റ്’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; അവസാന ഭാഗം ആത്മാവിൽനിന്നുള്ള ജനനത്തെക്കുറിച്ചാണ്. മലയാളത്തിൽ ഇരുവിധ അർഥവും ഒരേ സ്വാഭാവിക പദത്തിൽ വഹിക്കാനാവാത്തതിനാൽ മുഖ്യവാചകത്തിൽ അർഥങ്ങൾ വേർതിരിക്കുകയും ഗ്രീക്കിലെ പദപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഏകവചന അഭിസംബോധനയായ ‘നീ’ ഗ്രീക്ക് വാചകത്തെ പിന്തുടരുന്നു. ‘ദൈവാത്മാവ്’ എന്നു വിശദീകരിക്കാതെ ‘ആത്മാവ്’ എന്നു നൽകിയതിലൂടെ മൂലത്തിലെ സംക്ഷിപ്തതയും സന്ദർഭപരമായ ദൈവശാസ്ത്രബലവും നിലനിർത്തി.
