  edition: SBLGNT
  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: ml
  text: അവൻ വളരണം[a]; ഞാനോ കുറഞ്ഞുവരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ആ വ്യക്തി വർധിക്കണം; ഞാനോ ചെറുതായിത്തീരണം.’'
    reason: ‘വളരുക/കുറഞ്ഞുവരുക’ എന്ന സ്വാഭാവിക മലയാളത്തിന് പിന്നിലെ ἐκεῖνον-ന്റെ സൂചകബലവും ‘വർധിക്കുക/ചെറുതായിത്തീരുക’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള പദവിന്യാസവും കാണിക്കാൻ.
lexical_decisions:
- source_word: ἐκεῖνον
  choice: അവൻ
  rationale: δεῖയോടുകൂടിയ infinitive ഘടനയിൽ ἐκεῖνον ആശയപരമായ കർത്താവാണ്. സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവൻ’ എന്നു നൽകുന്നു.
- source_word: δεῖ
  choice: വളരണം / കുറഞ്ഞുവരണം
  rationale: ഗ്രീക്കിലെ δεῖ ഇരുവശത്തെയും infinitive-കൾക്ക് ബാധകമായ അനിവാര്യത പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ണം’ രൂപം ആ അനിവാര്യത സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: αὐξάνειν
  choice: വളരണം
  rationale: ഇത് തുടർന്നുകൊണ്ടിരിക്കുന്ന വളർച്ചയെയോ പ്രാധാന്യം വർധിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. ‘വളരണം’ ഈ വിശാലത നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: ἐμὲ
  choice: ഞാൻ
  rationale: ἐμὲ infinitive-ന്റെ ആശയപരമായ കർത്താവായതിനാൽ മലയാളത്തിൽ കർത്തൃരൂപമായ ‘ഞാൻ’ സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: ഞാനോ
  rationale: രണ്ടാമത്തെ δὲ സൂചിപ്പിക്കുന്ന വിരോധാത്മക താരതമ്യം മലയാളത്തിലെ ‘ഞാനോ’ വ്യക്തവും ചുരുക്കവുമായ രീതിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐλαττοῦσθαι
  choice: കുറഞ്ഞുവരണം
  rationale: ഈ present middle/passive infinitive ‘കുറഞ്ഞവനാകുക, ക്രമേണ കുറയുക’ എന്ന ആശയം വഹിക്കുന്നു. ‘കുറഞ്ഞുവരണം’ തുടരുന്ന പ്രക്രിയയും αὐξάνειν-നോടുള്ള സമാന്തരവിരോധവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യതയുടെ സ്വഭാവം
  choice: അനിവാര്യത ‘-ണം’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുന്നു; അതിനെ ദൈവിക ഉത്തരവെന്നോ വെറും പ്രായോഗിക ആവശ്യകതയെന്നോ കൂടുതൽ നിർവചിക്കുന്നില്ല.
  alternative: ‘ദൈവഹിതപ്രകാരം’ പോലുള്ള വിശദീകരണം ചേർക്കുക, അല്ലെങ്കിൽ അനിവാര്യത മൃദുവാക്കി ‘വളരട്ടെ’ എന്നു നൽകുക.
  rationale: സന്ദർഭത്തിൽ രക്ഷാചരിത്രപരമായ ദൈവിക അനിവാര്യതയുടെ ഭാരം ഉണ്ടാകാമെങ്കിലും വാക്യം അതിന്റെ സ്വഭാവം തുറന്നു നിർവചിക്കുന്നില്ല. അതിനാൽ ലളിതമായ അനിവാര്യരൂപം ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ള പ്രയോഗം. മൂലവാക്യത്തിന്റെ സമാന്തരഘടനയും വിരോധവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വ്യക്തമായ യേശു-യോഹന്നാൻ ബന്ധം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
