source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: ml
  text: 'യോഹന്നാൻ മറുപടി പറഞ്ഞു: “തനിക്കു സ്വർഗത്തിൽനിന്ന് നൽകപ്പെട്ടതല്ലാതെ ഒരു മനുഷ്യനും[a] ഒന്നുപോലും സ്വീകരിക്കാൻ കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഒരാൾക്കും.” ഗ്രീക്കിലെ ἄνθρωπος എന്ന പദം ഇവിടെ പൊതുവായി മനുഷ്യനെ പ്രതിനിധീകരിക്കുന്ന അർഥത്തിലാണ്; പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: യോഹന്നാൻ മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്ന വിവരണസൂത്രത്തിന്റെ പ്രതികരണവും തുടർന്നുള്ള സംസാരവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Οὐ δύναται
  choice: കഴിയില്ല
  rationale: δύναμαι സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ മലയാളത്തിലെ സ്വാഭാവികമായ ശേഷിപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യനും
  rationale: ഏകവചനവും പൊതുപ്രതിനിധാനപരവുമായ ഗ്രീക്ക് പദത്തെ നിലനിർത്തുന്നു; നിഷേധവാക്യത്തിൽ ‘-ഉം’ ചേർന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്. ഇവിടെ അർഥം പുരുഷന്മാർക്കു മാത്രമായി പരിമിതമല്ല.
- source_word: λαμβάνειν
  choice: സ്വീകരിക്കാൻ
  rationale: തുടർന്നുള്ള ‘നൽകപ്പെട്ടത്’ എന്ന ആശയത്തോടു പൊരുത്തപ്പെടുന്ന വിധത്തിൽ, പിടിച്ചെടുക്കുക എന്നതിലുപരി ലഭിക്കുന്നതിനെ സ്വീകരിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: οὐδὲ ἓν
  choice: ഒന്നുപോലും
  rationale: ഒരൊറ്റ കാര്യംപോലും എന്ന ഊന്നൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: തനിക്കു ... നൽകപ്പെട്ടതല്ലാതെ
  rationale: നൽകൽ പൂർത്തിയായതിന്റെ ഇപ്പോഴുള്ള ഫലം സൂചിപ്പിക്കുന്ന പരിപ്രാസിക പൂർണ നിഷ്ക്രിയരൂപവും αὐτῷ എന്ന പരോക്ഷ കർമവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ‘ദൈവത്തിൽനിന്ന്’ എന്നു മാറ്റാതെ അതിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രസ്താവനയിലെ ദൈവിക ഉറവിടത്തിന്റെ വ്യാപ്തി
  choice: മനുഷ്യൻ സ്വീകരിക്കുന്നതെന്തും സ്വർഗത്തിൽനിന്ന് നൽകപ്പെട്ടിരിക്കണം എന്ന വിശാലമായ വാക്യരൂപം നിലനിർത്തി.
  alternative: ഇത് ശുശ്രൂഷാപദവിക്കും ആത്മീയ അധികാരത്തിനും മാത്രം ബാധകമാണെന്നോ, എല്ലാ മനുഷ്യപ്രവർത്തനങ്ങളെയും നിർണയിക്കുന്ന സമഗ്ര നിർണയവാദമാണെന്നോ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം യോഹന്നാന്റെ ശുശ്രൂഷയും യേശുവിന്റെ വർധിച്ചുവരുന്ന പ്രാധാന്യവുമാണെങ്കിലും, വാക്യത്തിന്റെ ഭാഷ വിശാലമാണ്. അതിനാൽ സന്ദർഭപരമായ പ്രയോഗവും പൊതുവായ ദാനസിദ്ധാന്തവും തമ്മിലുള്ള ഉത്കണ്ഠ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മറുപടി പറഞ്ഞു’ എന്നത് ഗ്രീക്ക് വിവരണസൂത്രത്തെ അനാവശ്യമായ ആവർത്തനമില്ലാതെ കൈമാറുന്നു; ‘തനിക്കു’ എന്നത് ഏകവചന പൊതുപ്രതിനിധാനത്തെ നിലനിർത്തുന്നു.
