id: JHN.3.1
reference: John 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: ml
  text: പരീശന്മാരിൽപ്പെട്ട നിക്കോദേമോസ് എന്നു പേരുള്ള ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു. അവൻ യെഹൂദന്മാരുടെ ഒരു പ്രമാണിയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യരുടെ ഒരു പ്രമാണി.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം പൊതുവേ യെഹൂദന്മാരെയോ, ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യരെയോ യെഹൂദ അധികാരികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ഉണ്ടായിരുന്നു
  rationale: ἦν എന്ന അസ്തിത്വപരമായ ക്രിയയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം സന്ദർഭം വഹിക്കുന്നതിനാൽ കൃത്രിമമായ ഒരു കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഇവിടെ ഒരു നിർദിഷ്ട പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മനുഷ്യൻ’ ആ അർത്ഥം സ്വാഭാവികവും മാന്യവുമായി നൽകുന്നു.
- source_word: ἐκ τῶν Φαρισαίων
  choice: പരീശന്മാരിൽപ്പെട്ട
  rationale: ἐκ + ഷഷ്ഠീവിഭക്തി കൂട്ടത്തിനുള്ളിലെ അംഗത്വമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പരീശന്മാരിൽപ്പെട്ട’ എന്നത് അത് വ്യക്തമായി നൽകുന്നു.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: നിക്കോദേമോസ് എന്നു പേരുള്ള
  rationale: ഗ്രീക്കിലെ പേരുപറയുന്ന പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἄρχων
  choice: ഒരു പ്രമാണി
  rationale: അധികാരസ്ഥാനമുള്ള നേതാവിനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘പ്രമാണി’ ഭരണപരവും സാമൂഹികവുമായ അധികാരം ഉൾക്കൊള്ളുന്നു; നിർദിഷ്ട സഭാംഗത്വം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ
  rationale: യോഹന്നാനിലെ പദത്തിന് ജനവിഭാഗം, യെഹൂദ്യർ, അല്ലെങ്കിൽ യെഹൂദ അധികാരികൾ എന്നിങ്ങനെ സന്ദർഭാനുസൃത വ്യാപ്തിയുണ്ട്. മുഖ്യപാഠത്തിൽ വിശാലമായ അർത്ഥം നിലനിർത്തി, ഇടുങ്ങിയ സാധ്യത അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ τῶν Ἰουδαίων എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ; യെഹൂദ അധികാരികളിൽ ഒരാൾ
  rationale: നിക്കോദേമോസ് ഒരു പരീശനും അധികാരസ്ഥാനത്തുള്ളവനും ആണെന്ന സന്ദർഭത്തിൽ യെഹൂദ നേതൃത്വമാണ് പ്രത്യേകമായി മനസ്സിലാകാൻ സാധ്യത. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ ജനവിഭാഗപരവും പ്രദേശപരവുമായ വ്യാപ്തി മുഖ്യപാഠത്തിൽ അനാവശ്യമായി ചുരുക്കാതെ, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ലഘുവായ ബന്ധകത്തിന് പ്രത്യേകമായി ‘ഇപ്പോൾ’ പോലൊരു കാലസൂചകപദം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘യെഹൂദന്മാരുടെ ഒരു പ്രമാണി’ എന്ന വാക്യഭാഗത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
