id: JHN.3.18
reference: John 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: ml
  text: അവനിൽ വിശ്വസിക്കുന്നവൻ ശിക്ഷാവിധിക്കു വിധേയനാകുന്നില്ല[a]. എന്നാൽ വിശ്വസിക്കാത്തവൻ ഇതിനകം ശിക്ഷാവിധിക്കു വിധേയനായിരിക്കുന്നു; കാരണം, അവൻ ദൈവത്തിന്റെ ഏകപുത്രന്റെ[b] നാമത്തിൽ വിശ്വസിച്ചിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിധിക്കപ്പെടുന്നില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന κρίνω എന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് “വിധിക്കുക” എന്നും, ഈ സന്ദർഭത്തിൽ “ശിക്ഷാവിധിക്കു വിധേയനാക്കുക” എന്നും അർഥമാകാം. വാക്യത്തിലെ രണ്ടിടത്തും ഇതേ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരേയൊരു പുത്രൻ,” “അനന്യപുത്രൻ”; പരമ്പരാഗതമായി, “ഏകജാതനായ പുത്രൻ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ, തുടർച്ചയുള്ള ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; εἰς αὐτόν വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: οὐ κρίνεται
  choice: ശിക്ഷാവിധിക്കു വിധേയനാകുന്നില്ല
  rationale: κρίνω എന്നതിന് പൊതുവായി ‘വിധിക്കുക’ എന്നർഥമുണ്ടെങ്കിലും യോഹന്നാൻ 3:17–19-ലെ രക്ഷയും പ്രതികൂലവിധിയും തമ്മിലുള്ള പശ്ചാത്തലത്തിൽ ഇവിടെ ശിക്ഷാവിധിയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. വിശാലമായ പദാർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἤδη κέκριται
  choice: ഇതിനകം ശിക്ഷാവിധിക്കു വിധേയനായിരിക്കുന്നു
  rationale: ἤδη എന്നതിന്റെ ‘ഇതിനകം’ എന്ന ഭാവവും, പൂർത്തകാലത്തിന്റെ മുൻപ് സംഭവിച്ച വിധിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന അവസ്ഥയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: μὴ πεπίστευκεν
  choice: വിശ്വസിച്ചിട്ടില്ല
  rationale: പൂർത്തകാലരൂപം സൂചിപ്പിക്കുന്ന, ഇതുവരെ നിലനിൽക്കുന്ന അവിശ്വാസാവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ ὄνομα
  choice: നാമത്തിൽ
  rationale: വ്യക്തിയുടെ വെളിപ്പെട്ട തിരിച്ചറിയലും അധികാരവും ഉൾക്കൊള്ളുന്ന യോഹന്നാനീയ പ്രയോഗം വിവർത്തനത്തിൽ വികസിപ്പിക്കാതെ അതേ ദൃശ്യപദം നിലനിർത്തുന്നു.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഏകപുത്രന്റെ
  rationale: μονογενής സൂചിപ്പിക്കുന്ന അനന്യമായ, ഒരേയൊരു പുത്രത്വം ‘ഏകപുത്രൻ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; പരമ്പരാഗതമായ ‘ഏകജാതൻ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ κρίνω എന്ന ക്രിയയുടെ വിവർത്തനം
  choice: രണ്ടിടത്തും ‘ശിക്ഷാവിധിക്കു വിധേയനാകുക’
  alternative: ‘വിധിക്കപ്പെടുക’
  rationale: സമീപസന്ദർഭം രക്ഷയെയും പ്രതികൂലമായ ന്യായവിധിയെയും തമ്മിൽ വിരുദ്ധമായി നിർത്തുന്നതിനാൽ ‘ശിക്ഷാവിധി’ സന്ദർഭബലം വ്യക്തമാക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ ‘വിധിക്കുക’ എന്ന അർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: μονογενής എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഏകപുത്രൻ
  alternative: ഒരേയൊരു പുത്രൻ; അനന്യപുത്രൻ; പരമ്പരാഗതമായി ‘ഏകജാതനായ പുത്രൻ’
  rationale: പദം പ്രധാനമായി പുത്രന്റെ അനന്യതയെ സൂചിപ്പിക്കുന്നു; ജൈവിക ജനനധ്വനി അനാവശ്യമായി ചേർക്കാതെ അത് വ്യക്തമാക്കുന്നു. ചരിത്രപരമായ വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമപരമായ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘ശിക്ഷാവിധി’ ഉപയോഗിച്ചു; കർത്തൃപ്രയോഗത്തിലെ സമാന്തരതയും ഗ്രീക്ക് പൂർത്തകാലങ്ങളുടെ ഇപ്പോഴത്തെ ഫലഭാവവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
