  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘ശിക്ഷാവിധിക്കു വിധേയനാകുന്നില്ല / ...വിധേയനായിരിക്കുന്നു’ എന്ന സമാന്തരപ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും നിയമപരമായ രൂപകവും ഗ്രീക്കിലെ സമാന്തരതയും യോജിച്ചവിധം നിലനിർത്തുന്നു.
