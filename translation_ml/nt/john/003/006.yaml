id: JHN.3.6
reference: John 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: ml
  text: ജഡത്തിൽനിന്നു ജനിച്ചതു ജഡമാണ്; ആത്മാവിൽനിന്നു ജനിച്ചതു ആത്മാവാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആത്മാവിൽനിന്നു ജനിച്ചതു ആത്മികമാണ്.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ആത്മാവാണ്”; ഇത് ‘ജഡം’ എന്നതിനോടുള്ള ഗുണപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: ജനിച്ചതു
  rationale: നപുംസക ഏകവചനത്തിലെ ആർട്ടിക്കിളോടുകൂടിയ പൂർണ്ണകാല കർമണി കൃദന്തം ഇവിടെ പൊതുവായ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനിച്ചതു’ എന്നത് ആ പൊതുവായ, സൂക്തസദൃശമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ
  choice: -ത്തിൽനിന്നു
  rationale: ജനനത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്ന ἐκ എന്ന പദത്തിന്റെ അർഥം ഇരു ഉപവാക്യങ്ങളിലും വ്യക്തമായി നൽകുന്നു.
- source_word: σάρξ / σαρκὸς
  choice: ജഡം / ജഡത്തിൽനിന്നു
  rationale: ഇവിടെ സ്വാഭാവിക മനുഷ്യജനനവും ആത്മാവിൽനിന്നുള്ള ജനനവും തമ്മിലാണ് പ്രാഥമിക വൈരുധ്യം. ‘പാപസ്വഭാവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭം ആവശ്യപ്പെടുന്നതിനെക്കാൾ സങ്കുചിതമായ വ്യാഖ്യാനം ചേർക്കും; ‘ജഡം’ യോഹന്നാന്റെ പദപ്രയോഗവും അർഥതീവ്രതയും നിലനിർത്തുന്നു.
- source_word: πνεύματος / πνεῦμά
  choice: ആത്മാവിൽനിന്നു / ആത്മാവ്
  rationale: ആദ്യ പ്രയോഗം ആർട്ടിക്കിളോടുകൂടി ജനനത്തിന്റെ ഉറവിടമായ ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്നു. രണ്ടാമത്തേത് ആർട്ടിക്കിളില്ലാത്ത വിധേയനാമമായതിനാൽ ഗുണപരമായ അർഥത്തിനും സാധ്യതയുണ്ട്; മലയാളത്തിൽ ‘ആത്മാവ്’ എന്നു നിലനിർത്തി ആ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐστιν
  choice: ആണ്
  rationale: മൂലത്തിലെ ലളിതമായ സമവാക്യഘടനയും സൂക്തസദൃശമായ നിർവചനരീതിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ σάρξ എന്നതിന്റെ അർഥം
  choice: സ്വാഭാവിക മനുഷ്യജനനത്തിന്റെ മേഖലയെ സൂചിപ്പിക്കുന്ന ‘ജഡം’
  alternative: ‘പാപസ്വഭാവം’ അല്ലെങ്കിൽ ‘മനുഷ്യസ്വഭാവം’
  rationale: σάρξ ചില സന്ദർഭങ്ങളിൽ പാപബാധിത മനുഷ്യസ്വഭാവത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ആത്മാവിൽനിന്നുള്ള ജനനത്തോടുള്ള വൈരുധ്യമാണ് മുഖ്യം. ‘ജഡം’ എന്നു നിലനിർത്തുന്നത് ധാർമിക അധഃപതനം മാത്രം ഉദ്ദേശിക്കുന്നതായി വാക്യത്തെ ചുരുക്കുന്നില്ല.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ വിധേയമായ πνεῦμα
  choice: ‘ആത്മാവാണ്’ എന്നു നാമരൂപം നിലനിർത്തുക
  alternative: ‘ആത്മികമാണ്’ അല്ലെങ്കിൽ ദൈവാത്മാവിനോട് പൂർണമായി ഐക്യപ്പെടുത്തുന്ന വായന
  rationale: ഗ്രീക്കിൽ വിധേയനാമത്തിന് ആർട്ടിക്കിളില്ലാത്തതിനാൽ ‘ആത്മിക സ്വഭാവമുള്ളത്’ എന്ന ഗുണപരമായ വായന സാധ്യമാണ്. എങ്കിലും നാമരൂപം നിലനിർത്തുന്നത് മൂലത്തിലെ ‘ജഡം—ആത്മാവ്’ സമാന്തരതയും ദൈവാത്മാവ് ഉറവിടമാണെന്ന സന്ദർഭബന്ധവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും ലളിതവുമായ ശൈലി. ‘ജഡം’ ബൈബിൾഭാഷയിൽ പരിചിതവും മൂലത്തിലെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നതുമാണ്. ആദ്യ ഉപവാക്യത്തിന് വേറൊരു അടിക്കുറിപ്പ് ചേർക്കാതെ വിവർത്തനത്തിൽ തന്നെ ‘ജഡം’ നിലനിർത്തി; രണ്ടാമത്തെ πνεῦμα-യുടെ ഗുണപരമായ വായന മാത്രം പ്രസക്തമായ അടിക്കുറിപ്പായി നൽകിയിരിക്കുന്നു.
