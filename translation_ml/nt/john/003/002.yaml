  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: ml
  text: 'ഈ മനുഷ്യൻ രാത്രിയിൽ[a] യേശുവിന്റെ അടുക്കൽ വന്ന് അവനോട് പറഞ്ഞു: “റബ്ബീ, അങ്ങ് ദൈവത്തിൽനിന്ന് അധ്യാപകനായി വന്നിരിക്കുന്നുവെന്ന് ഞങ്ങൾ അറിയുന്നു. കാരണം, ദൈവം അവനോടുകൂടെ[c] ഇല്ലെങ്കിൽ, അങ്ങ് ചെയ്യുന്ന ഈ അടയാളങ്ങൾ[b] ചെയ്യാൻ ആർക്കും കഴിയുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രാത്രിയിൽ” എന്നതിന് “രാത്രിനേരത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ രാത്രി/ഇരുട്ട് ചിലപ്പോൾ പ്രതീകാത്മക അനുരണനവും വഹിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അടയാളങ്ങൾ” എന്നതിന് “അത്ഭുതകരമായ അടയാളങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം. യോഹന്നാനിൽ ഈ പദം പ്രവൃത്തികളുടെ അത്ഭുതസ്വഭാവത്തോടൊപ്പം അവ തങ്ങളേക്കാൾ അപ്പുറത്തേക്ക് വിരൽചൂണ്ടുന്നതും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “ദൈവം അവനോടുകൂടെ ഇല്ലെങ്കിൽ.” നിക്കോദേമൊസിന്റെ പ്രസ്താവനയിലെ മൂന്നാംപുരുഷരൂപം ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.'
    reason: source_texture
lexical_decisions:
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിൽ പരിചയപ്പെടുത്തിയ നിക്കോദേമൊസിനെ സൂചിപ്പിക്കുന്ന demonstrative-ന്റെ ഊന്നൽ നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: νυκτός
  choice: രാത്രിയിൽ
  rationale: കാലസൂചകമായ genitive-ന്റെ സ്വാഭാവിക മലയാളരൂപം; യോഹന്നാനിൽ രാത്രി/ഇരുട്ട് വഹിക്കാവുന്ന പ്രതീകാത്മക അനുരണനം അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: ഗ്രീക്കിൽ തന്നെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്ന യഹൂദ അഭിസംബോധന ചരിത്രപരമായ പശ്ചാത്തലം നിലനിർത്താൻ മലയാളത്തിലും ലിപ്യന്തരിച്ചു.
- source_word: οἴδαμεν
  choice: ഞങ്ങൾ അറിയുന്നു
  rationale: ഒന്നാംപുരുഷ ബഹുവചനം അതേപടി നിലനിർത്തുന്നു; അത് ആരെയെല്ലാം ഉൾക്കൊള്ളുന്നു എന്ന് വാചകം വ്യക്തമാക്കാത്തതിനാൽ വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: അങ്ങ് ദൈവത്തിൽനിന്നു വന്ന ഒരു ഉപദേഷ്ടാവാണ്
  rationale: ദൈവത്തിൽനിന്നുള്ള വരവും അധ്യാപകന്റെ നില/പങ്കും വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അയക്കപ്പെട്ടു’ എന്ന കൂടുതൽ ശക്തമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ταῦτα τὰ σημεῖα
  choice: ഈ അടയാളങ്ങൾ
  rationale: യോഹന്നാനിൽ പ്രവൃത്തികൾ തങ്ങളേക്കാൾ അപ്പുറത്തേക്ക് വിരൽചൂണ്ടുന്നു എന്ന σημεῖα-യുടെ സവിശേഷ അർഥം ‘അത്ഭുതങ്ങൾ’ എന്നു മാത്രം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: അങ്ങ് ചെയ്യുന്ന ഈ അടയാളങ്ങൾ ചെയ്യാൻ
  rationale: മൂലത്തിലെ ποιέω എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: ദൈവം അവനോടുകൂടെ ഇല്ലെങ്കിൽ
  rationale: നിക്കോദേമൊസ് ആദ്യം യേശുവിനെ രണ്ടാംപുരുഷത്തിൽ അഭിസംബോധന ചെയ്തശേഷം ഇവിടെ ഉപയോഗിക്കുന്ന മൂന്നാംപുരുഷരൂപം മറച്ചുവയ്ക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ σημεῖα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അടയാളങ്ങൾ
  alternative: അത്ഭുതങ്ങൾ / അത്ഭുതകരമായ അടയാളങ്ങൾ
  rationale: പ്രവൃത്തികളുടെ അത്ഭുതസ്വഭാവം നിഷേധിക്കാതെ, അവ യേശുവിന്റെ വ്യക്തിത്വത്തെയും ദൗത്യത്തെയും സൂചിപ്പിക്കുന്നു എന്ന യോഹന്നാനീയ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: രണ്ടാംപുരുഷത്തിൽനിന്ന് മൂന്നാംപുരുഷത്തിലേക്കുള്ള മാറ്റം
  choice: ദൈവം അവനോടുകൂടെ ഇല്ലെങ്കിൽ
  alternative: ദൈവം അങ്ങയോടുകൂടെ ഇല്ലെങ്കിൽ
  rationale: ഗ്രീക്ക് വാചകത്തിലെ വ്യക്തിമാറ്റം സ്വാഭാവികമാക്കാൻ നീക്കം ചെയ്യാതെ അതിന്റെ ഔപചാരികമോ വാഗ്‌രീതിപരമോ ആയ സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- issue: ἀπὸ θεοῦ ἐλήλυθας ഔദ്യോഗിക അയക്കലിനെ സൂചിപ്പിക്കുന്നുവോ
  choice: ദൈവത്തിൽനിന്നു വന്ന
  alternative: ദൈവത്താൽ അയക്കപ്പെട്ട
  rationale: വാക്യം ദൈവത്തിൽനിന്നുള്ള ഉത്ഭവം/വരവ് പറയുന്നു; ‘അയക്കുക’ എന്ന ക്രിയ ഇല്ലാത്തതിനാൽ ഔദ്യോഗിക നിയോഗം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; എന്നാൽ ഗ്രീക്കിലെ നിർണായക മൂന്നാംപുരുഷമാറ്റം ‘അവനോടുകൂടെ’ എന്നു സംരക്ഷിച്ചു. ‘റബ്ബീ’ ചരിത്രപരമായ അഭിസംബോധനയായി നിലനിർത്തി.
