    text: ‘മഹത്ത്വീകരിക്കപ്പെടണം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഭൗതികമായി ഉയർത്തുക എന്നും മഹത്ത്വപ്പെടുത്തുക എന്നും അർഥമാകാം; യോഹന്നാൻ ഇവിടെ രണ്ടു അർഥങ്ങളും ഉദ്ദേശിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς … οὕτως
  choice: … ഉയർത്തിയതുപോലെ … ഉയർത്തപ്പെടണം
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള ‘എപ്രകാരം … അപ്രകാരം’ എന്ന താരതമ്യം മലയാളത്തിൽ സ്വാഭാവികമായി ‘… ചെയ്തതുപോലെ …’ എന്ന ഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὕψωσεν / ὑψωθῆναι
  choice: ഉയർത്തി / ഉയർത്തപ്പെടണം
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ സജീവവും നിഷ്ക്രിയവുമായ രൂപങ്ങൾ മലയാളത്തിലും ഒരേ ധാതുവിലൂടെ നിലനിർത്തുന്നു. ഇതിലൂടെ സർപ്പത്തെ ഭൗതികമായി ഉയർത്തിയതും മനുഷ്യപുത്രൻ ഉയർത്തപ്പെടുന്നതിലെ ഭൗതികവും മഹത്ത്വീകരണപരവുമായ അർഥസാധ്യതകളും സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: τὸν ὄφιν
  choice: സർപ്പത്തെ
  rationale: സംഖ്യാപുസ്തകം 21-ലെ സൂചനയോടു ചേരുന്ന, ആധുനിക വായനക്കാർക്കും വ്യക്തമായ മാന്യമായ ബൈബിൾപദമാണ് ‘സർപ്പം’.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയുടെ പശ്ചാത്തലം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δεῖ
  choice: ഉയർത്തപ്പെടണം
  rationale: ഇത് വെറും ഭാവിപ്രവചനമല്ല, സംഭവിക്കേണ്ട ദൈവിക അനിവാര്യതയാണെന്ന ശക്തി ‘-ണം’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ സ്ഥാപിതമായ ഈ വിശേഷണം ദാനീയേൽപുസ്തകപരവും യോഹന്നാനീയവുമായ പ്രതിധ്വനികൾ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ ὑψόω എന്ന ക്രിയയുടെ ദ്വയാർഥം
  choice: പ്രധാനപാഠത്തിൽ രണ്ടു പ്രയോഗങ്ങളും ‘ഉയർത്തുക’ എന്ന ഒരേ ധാതുവുപയോഗിച്ച് പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടാമത്തെ പ്രയോഗം ‘മഹത്ത്വീകരിക്കപ്പെടണം’ അല്ലെങ്കിൽ ‘ഉന്നതനാക്കപ്പെടണം’ എന്നു നൽകാം.
  rationale: ഈ വാക്യം സർപ്പത്തെ ഭൗതികമായി ഉയർത്തിയതിനെയും മനുഷ്യപുത്രൻ ഉയർത്തപ്പെടുന്നതിനെയും ബന്ധിപ്പിക്കുന്നു; അതേസമയം ക്രൂശിലെ ഉയർത്തലും മഹത്ത്വീകരണവും ഒരുമിച്ചു സൂചിപ്പിക്കാൻ സാധ്യത നൽകുന്നു. ഒരേ ധാതു ഉപയോഗിക്കുന്നത് ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകളയാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉയർത്തി / ഉയർത്തപ്പെടണം’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ താരതമ്യവും ഉദ്ദേശ്യപൂർവമായ ദ്വയാർഥവും നിലനിർത്തുന്നു. നൽകിയ ഇംഗ്ലീഷ് കരടിൽ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും ചിഹ്നങ്ങളുടെ സ്ഥാനവും പരസ്പരം മാറിയതായി തോന്നുന്നതിനാൽ, ക്രോസ്-റഫറൻസ് [a] മരുഭൂമിയിലെ സംഭവത്തോടും പദാർഥവികൽപം [b] ‘ഉയർത്തപ്പെടണം’ എന്നതിനോടും ചേർത്തിരിക്കുന്നു.
