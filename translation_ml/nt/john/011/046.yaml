  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: ml
  text: എന്നാൽ അവരിൽ ചിലർ പരീശന്മാരുടെ അടുക്കൽ ചെന്ന് യേശു ചെയ്തതു അവരോടു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു ചെയ്തതു അവരെ അറിയിച്ചു.’ പരീശന്മാരുടെ അടുക്കൽ ചെന്നവരുടെ ഉദ്ദേശ്യം ഗ്രീക്കിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: എന്നാൽ അവരിൽ ചിലർ
  rationale: മുൻവാക്യത്തിൽ വിശ്വസിച്ചവരോടുള്ള വ്യത്യാസം δὲ സൂചിപ്പിക്കുന്നു; τινὲς ἐξ αὐτῶν വലിയ കൂട്ടത്തിലെ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: പരീശന്മാരുടെ അടുക്കൽ ചെന്ന്
  rationale: സംഭവസ്ഥലത്തുനിന്ന് പരീശന്മാരുടെ അടുത്തേക്കുള്ള നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അനാവശ്യമായ ഉദ്ദേശ്യം ചേർക്കുന്നില്ല.
- source_word: εἶπαν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ നിഷ്പക്ഷമായ പ്രസ്താവനാക്രിയയെ നിലനിർത്തുന്നു; ‘പരാതിപ്പെട്ടു’ പോലുള്ള ശത്രുതാപരമായ ഉദ്ദേശ്യം ആരോപിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: യേശു ചെയ്തതു
  rationale: ബന്ധസർവനാമത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുകയും യേശുവിന്റെ പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പരീശന്മാരോടു വിവരം പറഞ്ഞവരുടെ ഉദ്ദേശ്യം
  choice: ഉദ്ദേശ്യം നിർണ്ണയിക്കാത്ത നിഷ്പക്ഷമായ ‘പറഞ്ഞു’
  alternative: യേശുവിനെക്കുറിച്ച് പരാതിപ്പെട്ടു / ഒറ്റിക്കൊടുത്തു
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് അവർ പോയി യേശു ചെയ്തതു പറഞ്ഞുവെന്നു മാത്രമാണ് വ്യക്തമാക്കുന്നത്; അവരുടെ ഉദ്ദേശ്യം തുറന്നു പറയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിൽനിന്നുള്ള സാധ്യത വിവർത്തനത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പരീശന്മാർ’ എന്ന പ്രചാരത്തിലുള്ള ബൈബിൾ സമൂഹനാമം നിലനിർത്തി; ഉദ്ദേശ്യം ആരോപിക്കാത്ത നിഷ്പക്ഷ പ്രയോഗം തിരഞ്ഞെടുത്തു.
