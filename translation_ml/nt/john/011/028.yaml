id: JHN.11.28
reference: John 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: ml
  text: 'ഇതു പറഞ്ഞശേഷം അവൾ പോയി തന്റെ സഹോദരിയായ മറിയത്തെ സ്വകാര്യമായി[a] വിളിച്ച് ഇങ്ങനെ പറഞ്ഞു: “ഗുരു[b] ഇവിടെ ഉണ്ട്; നിന്നെ വിളിക്കുന്നു[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രഹസ്യമായി.” ഗ്രീക്ക് പദത്തിന് മറ്റുള്ളവർ കേൾക്കാത്തവിധം സംസാരിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അധ്യാപകൻ.” ഇവിടെ ഗ്രീക്കിലുള്ളത് “പഠിപ്പിക്കുന്നവൻ” എന്ന അർഥമുള്ള ആദരസൂചകമായ ഒരു സ്ഥാനപ്പേരാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “നിന്നെ വരാൻ വിളിക്കുന്നു.” ഗ്രീക്ക് വർത്തമാനകാലരൂപം യേശു മറിയത്തിന്റെ സാന്നിധ്യം ആവശ്യപ്പെടുന്നു എന്ന അർഥം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: Aorist participle is rendered as a natural temporal sequence while retaining the reference to Martha’s preceding words.
- source_word: ἀπῆλθεν
  choice: അവൾ പോയി
  rationale: Conveys departure simply and naturally in Malayalam narrative style.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: തന്റെ സഹോദരിയായ മറിയത്തെ … വിളിച്ച്
  rationale: Identifies Mary appositionally as Martha’s sister and renders φωνέω as calling or summoning her.
- source_word: λάθρᾳ
  choice: സ്വകാര്യമായി
  rationale: Indicates that Martha communicated beyond public hearing without necessarily implying deceit or a clandestine motive.
- source_word: εἰποῦσα
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: Introduces the direct speech idiomatically and avoids a cumbersome repetition of participial constructions.
- source_word: Ὁ διδάσκαλος
  choice: ഗുരു
  rationale: A natural respectful Malayalam title corresponding to ‘teacher’ in this narrative context.
- source_word: πάρεστιν
  choice: ഇവിടെ ഉണ്ട്
  rationale: Directly conveys present location rather than adding the idea that he has just arrived.
- source_word: φωνεῖ σε
  choice: നിന്നെ വിളിക്കുന്നു
  rationale: Preserves the Greek present tense and can naturally mean that Jesus is summoning Mary to come.
theological_decisions:
- issue: Jesus’ title διδάσκαλος
  choice: ഗുരു
  alternative: അധ്യാപകൻ / യജമാനൻ
  rationale: ‘ഗുരു’ is dignified and idiomatic as a respectful title while retaining the teaching sense; ‘യജമാനൻ’ would shift the emphasis toward mastery or ownership.
- issue: Nuance of λάθρᾳ
  choice: സ്വകാര്യമായി
  alternative: രഹസ്യമായി
  rationale: The wording preserves discreet speech outside others’ hearing without asserting deception, fear, or another unstated motive.
- issue: Force of φωνεῖ σε
  choice: നിന്നെ വിളിക്കുന്നു
  alternative: നിന്നെ വരാൻ വിളിക്കുന്നു
  rationale: The shorter wording preserves the source’s lexical and aspectual ambiguity, while the context permits the sense of requesting Mary’s presence.
translation_notes:
  register: Modern standard Malayalam with clear narrative sequencing and dignified but ordinary direct speech. ‘സ്വകാര്യമായി’ avoids overstating secrecy; ‘ഗുരു’ functions naturally as a respectful title. All footnote markers are placed at the relevant expressions in the main text.
