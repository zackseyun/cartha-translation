    rationale: “ലാസറായിരുന്നു രോഗിയായിരുന്നത്” is understandable but heavier than “രോഗിയായിരുന്ന ലാസറിന്റെ സഹോദരി … മറിയയായിരുന്നു,” which also better preserves the Greek’s focus on Mary.
