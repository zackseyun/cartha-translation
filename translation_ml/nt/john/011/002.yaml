id: JHN.11.2
reference: John 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: ml
  text: രോഗിയായിരുന്ന ലാസറിന്റെ സഹോദരി, കർത്താവിനെ സുഗന്ധതൈലംകൊണ്ട്[a] പൂശുകയും തന്റെ തലമുടികൊണ്ട് അവന്റെ കാലുകൾ തുടയ്ക്കുകയും ചെയ്ത മറിയയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സുഗന്ധലേപനംകൊണ്ട്.” ഗ്രീക്ക് പദം സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനവസ്തുവെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ആയിരുന്നു
  rationale: ഗ്രീക്കിലെ അപൂർണഭൂതകാല ക്രിയയുടെ തിരിച്ചറിയൽസ്വഭാവം നിലനിർത്തുന്നു. δέ-യുടെ മൃദുവായ ബന്ധകബലം മലയാള വാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ പ്രത്യേകമായ കാലസൂചകപദം ചേർത്തിട്ടില്ല.
- source_word: Μαριὰμ
  choice: മറിയ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ἡ ἀλείψασα
  choice: പൂശുകയും ... ചെയ്ത
  rationale: ലേഖകന്റെ വിവരണാത്മക തിരിച്ചറിയൽ നിലനിർത്തുന്നു; ἀλείφω ഇവിടെ സുഗന്ധതൈലം പുരട്ടുന്നതിനെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണവും സ്വാഭാവികവുമായ ‘പൂശുക’ തെരഞ്ഞെടുത്തു.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: യേശുവിനുള്ള ബഹുമാനപദവിയുടെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: μύρῳ
  choice: സുഗന്ധതൈലംകൊണ്ട്
  rationale: സുഗന്ധമുള്ള എണ്ണയെയോ ലേപനവസ്തുവെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമായ രൂപം; പദത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἐκμάξασα
  choice: തുടയ്ക്കുകയും ചെയ്ത
  rationale: ἐκμάσσω എന്നതിന്റെ തുടയ്ക്കുക/തുടച്ച് ഉണക്കുക എന്ന അർഥം ലളിതമായി നൽകുന്നു.
- source_word: τοὺς πόδας αὐτοῦ
  choice: അവന്റെ കാലുകൾ
  rationale: ഗ്രീക്ക് കർമവും ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: തന്റെ തലമുടികൊണ്ട്
  rationale: കരണാർഥക ദത്തിവിനെ ‘കൊണ്ട്’ എന്നു വ്യക്തമാക്കുന്നു; പ്രതിഫലനാത്മകമായ ‘തന്റെ’ മറിയയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് അനിശ്ചിതത്വമില്ലാതെ അറിയിക്കുന്നു.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: മറിയയുടെ സഹോദരനായ ലാസർ
  rationale: ബന്ധസർവനാമത്തിലെ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; സ്വാഭാവികതയ്ക്കായി ലാസറിനെ പ്രധാനവാക്യത്തിന്റെ വിഷയമാക്കി.
- source_word: ἠσθένει
  choice: രോഗിയായിരുന്നത്
  rationale: സന്ദർഭത്തിൽ ശാരീരിക രോഗത്തെ സൂചിപ്പിക്കുന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന അവസ്ഥ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇവിടെ ഇത് യേശുവിനുള്ള ബഹുമാനപദവിയാണ്; അതിന്റെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ‘യജമാനൻ’ എന്നതിനെക്കാൾ ‘കർത്താവ്’ നന്നായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ വിവരങ്ങൾ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവിക മലയാള വാക്യക്രമത്തിനായി ലാസറിനെ പ്രധാനവാക്യത്തിന്റെ വിഷയമാക്കി; ഉറവിടത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള കാലസൂചകം ചേർത്തിട്ടില്ല.
