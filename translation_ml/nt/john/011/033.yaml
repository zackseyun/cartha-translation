revisions:
- from: അതുകൊണ്ട്, യേശു അവൾ കരയുന്നതും അവളോടൊപ്പം വന്ന യെഹൂദന്മാർ കരയുന്നതും കണ്ടപ്പോൾ, തന്റെ ആത്മാവിൽ അത്യന്തം വികാരഭരിതനായി[a] തന്നെത്താൻ കലങ്ങിച്ചു.
  to: അതുകൊണ്ട്, യേശു അവൾ കരയുന്നതും അവളോടൊപ്പം വന്ന യെഹൂദന്മാർ[a] കരയുന്നതും കണ്ടപ്പോൾ, തന്റെ ആത്മാവിൽ ആഴമായി ക്ഷോഭിച്ചു[b]; സ്വയം അസ്വസ്ഥനാക്കുകയും ചെയ്തു.
