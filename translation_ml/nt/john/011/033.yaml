id: JHN.11.33
reference: John 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: ml
  text: അതുകൊണ്ട്, യേശു അവൾ കരയുന്നതും അവളോടൊപ്പം വന്ന യെഹൂദന്മാർ[a] കരയുന്നതും കണ്ടപ്പോൾ, തന്റെ ആത്മാവിൽ ആഴമായി ക്ഷോഭിച്ചു[b]; സ്വയം അസ്വസ്ഥനാക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യെഹൂദ്യർ.’ ഇവിടെ ഈ പദം മറിയത്തോടൊപ്പം വന്ന യെഹൂദ വിലാപക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്; യെഹൂദജനതയെ മുഴുവനായല്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘അമർഷപ്പെട്ടു’ എന്നോ ‘അത്യന്തം ഇളകിമറിഞ്ഞു’ എന്നോ വിവർത്തനം ചെയ്യാം. ഈ ക്രിയ ശക്തമായ ആന്തരിക വികാരക്ഷോഭത്തെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ആ വികാരം ദുഃഖമാണോ, അമർഷമാണോ, രോഷമാണോ എന്ന് പദം മാത്രം നിർണയിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തോടുള്ള ആഖ്യാനബന്ധവും തുടർച്ചയും വ്യക്തമാക്കുന്നു.
- source_word: ὡς εἶδεν
  choice: കണ്ടപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചകപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κλαίουσαν / κλαίοντας
  choice: കരയുന്നതും / കരയുന്നതും
  rationale: കേൾക്കാവുന്ന കരച്ചിലിനെ സൂചിപ്പിക്കാമെങ്കിലും ‘വിലപിക്കുക’ എന്നു നൽകി ആചാരപരമായ വിലാപം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: συνελθόντας αὐτῇ
  choice: അവളോടൊപ്പം വന്ന
  rationale: മറിയത്തോടൊപ്പം വന്നവരെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ലളിതവും വ്യക്തവുമാണ്.
- source_word: Ἰουδαίους
  choice: യെഹൂദന്മാർ
  rationale: നേരിട്ടുള്ള ജനവിഭാഗനാമം നിലനിർത്തുന്നു; ഇവിടെ എല്ലാ യെഹൂദരെയും അല്ല, മറിയത്തോടൊപ്പം വന്ന വിലാപക്കാരെയാണു സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἐνεβριμήσατο
  choice: അത്യന്തം വികാരഭരിതനായി
  rationale: ശക്തമായ ആന്തരിക വികാരക്ഷോഭം നിലനിർത്തുന്നു; അത് ദുഃഖമോ രോഷമോ അമർഷമോ എന്ന് ഏകപക്ഷീയമായി നിർണയിക്കുന്നില്ല.
- source_word: τῷ πνεύματι
  choice: തന്റെ ആത്മാവിൽ
  rationale: വികാരക്ഷോഭം നടന്ന ആന്തരിക മണ്ഡലം എന്ന ദാതിവ്യാകരണത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: ἐτάραξεν ἑαυτόν
  choice: തന്നെത്താൻ കലങ്ങിച്ചു
  rationale: ഗ്രീക്കിലെ പ്രത്യാവർത്തകപ്രയോഗം ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു; വെറും ‘കലങ്ങി’ എന്ന് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἐνεβριμήσατο എന്ന പദത്തിൽ യേശുവിന്റെ വികാരത്തിന്റെ സ്വഭാവം
  choice: നിശ്ചിത വികാരമായി വ്യാഖ്യാനിക്കാതെ ശക്തമായ ആന്തരിക വികാരക്ഷോഭമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘അമർഷപ്പെട്ടു,’ ‘രോഷാകുലനായി,’ അല്ലെങ്കിൽ ‘അത്യന്തം ക്ഷോഭിച്ചു.’
  rationale: ക്രിയയിൽ അമർഷത്തിന്റെയോ രോഷത്തിന്റെയോ ഛായ ഉണ്ടാകാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ വികാരത്തിന്റെ കൃത്യമായ സ്വഭാവവും ലക്ഷ്യവും വിവാദവിധേയമാണ്. അതിനാൽ പ്രധാനപാഠം ആ ശക്തി സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ സംഘർഷം അടച്ചുപൂട്ടാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘യെഹൂദന്മാർ’ എന്നത് ഈ സന്ദർഭത്തിൽ മറിയത്തോടൊപ്പം വന്ന യെഹൂദ വിലാപക്കാരെയാണ് സൂചിപ്പിക്കുന്നത്; ജനതയെ മുഴുവനായി പൊതുവത്കരിക്കുന്നില്ല. പ്രത്യാവർത്തകമായ ἑαυτόν സംരക്ഷിക്കാൻ അല്പം അടയാളപ്പെട്ടെങ്കിലും ഗ്രഹിക്കാവുന്ന ‘തന്നെത്താൻ കലങ്ങിച്ചു’ ഉപയോഗിച്ചു.
