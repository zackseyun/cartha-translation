  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: ml
  text: യേശു മാർത്തയെയും അവളുടെ സഹോദരിയെയും ലാസറിനെയും സ്നേഹിച്ചിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: സ്നേഹിച്ചിരുന്നു
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ അപൂർണ ഭൂതകാലരൂപം. കഴിഞ്ഞകാലത്ത് തുടർന്നുനിന്ന യേശുവിന്റെ സ്നേഹത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘സ്നേഹിച്ചുകൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ ഈ നിലസൂചക പ്രയോഗത്തിന് ഒഴുക്കുണ്ട്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: δέ ഇവിടെ ലഘുവായ വ്യവഹാരബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യം അവതരിപ്പിക്കുന്നത് സ്വാഭാവികമാണ്; ‘എന്നാൽ’ എന്ന് നൽകിയാൽ മൂലത്തിലുള്ളതിലധികം വിരുദ്ധഭാവം വരാം.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: അവളുടെ സഹോദരിയെ
  rationale: മൂലപാഠം ഈ വാക്യത്തിൽ സഹോദരിയുടെ പേര് പറയാത്തതിനാൽ അതേ അനിശ്ചിതത്വം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Μάρθαν
  choice: മാർത്ത
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Λάζαρον
  choice: ലാസർ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണം.
- source_word: καὶ ... καὶ ... καὶ
  choice: -യെയും ... -യെയും ... -യെയും
  rationale: മൂന്നു പേരെയും ഒരേ നിലയിൽ കർമങ്ങളായി ഏകോപിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിലെ ആവർത്തിത ‘-യെയും’ പ്രയോഗത്തിലൂടെ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്നേഹത്തെ സംബന്ധിച്ച ἠγάπα എന്ന അപൂർണ ഭൂതകാലക്രിയയുടെ ഭാവം
  choice: മാർത്തയോടും അവളുടെ സഹോദരിയോടും ലാസറിനോടും യേശുവിന് തുടർന്നുനിന്ന സ്നേഹം ഉണ്ടായിരുന്നു എന്ന ലളിത പ്രസ്താവന
  alternative: ‘സ്നേഹിക്കാൻ തുടങ്ങി’ എന്ന ആരംഭസൂചനയോ ‘സ്നേഹിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്ന ശക്തമായ പുരോഗമന ഊന്നലോ
  rationale: അപൂർണ ഭൂതകാലം ഇവിടെ കഴിഞ്ഞകാലത്ത് നിലനിന്നിരുന്ന അവസ്ഥയെ ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. പാഠം പറയുന്നതിലപ്പുറം പ്രത്യേക വികാരപരമോ സിദ്ധാന്തപരമോ ആയ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ പേരുകളുടെ സമാന്തര പട്ടിക നിലനിർത്തിയിട്ടുണ്ട്; ദുർഗ്രാഹ്യമായ പദശഃക്രമം ഒഴിവാക്കി. വായനക്കാരനുള്ള അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
