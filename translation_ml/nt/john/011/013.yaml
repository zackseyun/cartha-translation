revisions:
- from: യേശു പറഞ്ഞത് അവന്റെ മരണത്തെക്കുറിച്ചായിരുന്നു; എന്നാൽ അവൻ സ്വാഭാവികമായ ഉറക്കത്തെക്കുറിച്ചാണ് പറയുന്നതെന്ന് അവർ വിചാരിച്ചു.
  to: യേശു ലാസറിന്റെ മരണത്തെക്കുറിച്ചാണ് പറഞ്ഞിരുന്നത്; എന്നാൽ, അദ്ദേഹം സാധാരണ ഉറക്കത്തെക്കുറിച്ചാണ് പറയുന്നതെന്ന് അവർ കരുതി.[a]
  rationale: The revision removes a Malayalam antecedent ambiguity that could make the death Jesus' own, identifies Lazarus as the contextual referent, and renders the disciples' misunderstanding as ordinary/literal sleep. The footnote preserves the distinctive Greek expression without forcing an unnatural repetition into the main text.
