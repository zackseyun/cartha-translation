id: JHN.11.13
reference: John 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: ml
  text: യേശു ലാസറിന്റെ മരണത്തെക്കുറിച്ചാണ് പറഞ്ഞിരുന്നത്; എന്നാൽ, അദ്ദേഹം സാധാരണ ഉറക്കത്തെക്കുറിച്ചാണ് പറയുന്നതെന്ന് അവർ കരുതി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, «ഉറക്കത്തിന്റെ ഉറക്കത്തെക്കുറിച്ച്»; അതായത്, മരണത്തെക്കുറിച്ചല്ല, യഥാർഥ ഉറക്കത്തെക്കുറിച്ച്.
    reason: The Greek expression has an emphatic/reduplicative construction that distinguishes literal sleep from Jesus' figurative reference to death.
lexical_decisions:
- source_word: εἰρήκει
  choice: പറഞ്ഞത് ... ആയിരുന്നു
  rationale: പൂർവഭൂതകാലരൂപം ശിഷ്യന്മാരുടെ തെറ്റിദ്ധാരണയ്ക്കു മുമ്പ് യേശു പറഞ്ഞ കാര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന ആ മുൻകാലബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δὲ ... δὲ
  choice: ആയിരുന്നു; എന്നാൽ
  rationale: ആദ്യത്തെ δέ ലഘുവായ വിവരണബന്ധം നൽകുന്നതിനാൽ പ്രത്യേകം പദമായി വികസിപ്പിച്ചില്ല; രണ്ടാമത്തേത് യേശുവിന്റെ ഉദ്ദേശ്യവും ശിഷ്യന്മാരുടെ ധാരണയും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: അവന്റെ മരണത്തെക്കുറിച്ച്
  rationale: περί + genitive എന്നത് ‘കുറിച്ച്’ എന്ന അർഥത്തിലാണ്; αὐτοῦ സന്ദർഭത്തിൽ ലാസറിനെ സൂചിപ്പിച്ചാലും മൂലത്തിലെ സർവനാമരൂപം നിലനിർത്തി.
- source_word: ἐκεῖνοι
  choice: അവർ
  rationale: മുൻസന്ദർഭത്തിലെ ശിഷ്യന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ സർവനാമം ഉപയോഗിച്ചു.
- source_word: ἔδοξαν
  choice: വിചാരിച്ചു
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാരുടെ തെറ്റായ ധാരണയാണ് δοκέω സൂചിപ്പിക്കുന്നത്.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: സ്വാഭാവികമായ ഉറക്കത്തെക്കുറിച്ച്
  rationale: കൃത്യമായി ‘ഉറക്കത്തിന്റെ ഉറക്കം’ എന്ന ആവർത്തനഘടന മലയാളത്തിൽ അസ്വാഭാവികമാണ്. τοῦ ὕπνου ഇവിടെ κοιμήσεως-നെ യഥാർഥ ശാരീരിക ഉറക്കമായി വ്യക്തമാക്കുന്നതിനാൽ ‘സ്വാഭാവികമായ ഉറക്കം’ എന്നത് അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായി നൽകുന്നു.
- source_word: λέγει
  choice: പറയുന്നതെന്ന്
  rationale: ചരിത്രവർത്തമാനരൂപത്തെ ‘വിചാരിച്ചു’ എന്ന ഭൂതകാല ആഖ്യാനത്തിനുള്ളിൽ സ്വാഭാവികമായ ആശ്രിതവാക്യമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: മരണത്തെ ‘ഉറക്കം’ എന്നു വിളിക്കുന്നത് മരിച്ചവരുടെ അവസ്ഥയെക്കുറിച്ചുള്ള പ്രത്യേക ഉപദേശം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: യേശു ഉദ്ദേശിച്ചത് മരണമാണെന്നും ശിഷ്യന്മാർ മനസ്സിലാക്കിയത് സ്വാഭാവിക ഉറക്കമാണെന്നും മാത്രം വ്യക്തമാക്കി.
  alternative: ആത്മാവിന്റെ ഉറക്കം പോലുള്ള ഒരു ഇടക്കാലാവസ്ഥാ സിദ്ധാന്തം സൂചിപ്പിക്കുന്ന ഭാഷ ഉപയോഗിക്കുക.
  rationale: വാക്യത്തിന്റെ ഉദ്ദേശ്യം രൂപകാലങ്കാരവും ശിഷ്യന്മാരുടെ അക്ഷരാർഥത്തിലുള്ള തെറ്റിദ്ധാരണയും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുകയാണ്; അതിനപ്പുറം ഒരു സിദ്ധാന്തം പാഠത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ കാലബന്ധവും വൈരുധ്യവും സംരക്ഷിക്കുമ്പോൾ ഗ്രീക്കിലെ അസ്വാഭാവിക ആവർത്തനം പദാനുപദമായി അനുകരിക്കാതെ അതിന്റെ നിർവചക അർഥം നൽകിയിരിക്കുന്നു.
