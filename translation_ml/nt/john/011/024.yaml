id: JHN.11.24
reference: John 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: ml
  text: 'മാർത്ത അവനോടു പറഞ്ഞു: “അവസാന നാളിലെ പുനരുത്ഥാനത്തിൽ അവൻ ഉയിർത്തെഴുന്നേൽക്കുമെന്ന് എനിക്കറിയാം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ യോജിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἡ Μάρθα
  choice: മാർത്ത
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം.
- source_word: Οἶδα
  choice: എനിക്കറിയാം
  rationale: മാർത്തയുടെ ഉറച്ച അറിവ് നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀναστήσεται
  choice: ഉയിർത്തെഴുന്നേൽക്കും
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ ക്രിയയുടെ ഭാവികാലവും സ്വയം എഴുന്നേൽക്കുന്ന രൂപവും നിലനിർത്തുന്നു; ‘ഉയിർപ്പിക്കപ്പെടും’ എന്ന കർമണിരൂപത്തിലേക്ക് മാറ്റുന്നില്ല.
- source_word: ἐν τῇ ἀναστάσει
  choice: പുനരുത്ഥാനത്തിൽ
  rationale: ἐν എന്ന മുൻവാക്കിന്റെ കാലപരവും സംഭവപരവുമായ അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അവസാന നാളിലെ
  rationale: പുനരുത്ഥാനം ഏതു സമയത്തേതാണെന്ന് വ്യക്തമാക്കുന്ന, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: അന്ത്യകാല പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പരാമർശം
  choice: ‘അവസാന നാളിലെ പുനരുത്ഥാനം’ എന്ന നിർദിഷ്ട ഭാവിസംഭവത്തെ നിലനിർത്തി.
  alternative: മരണാനന്തരജീവിതത്തെക്കുറിച്ചുള്ള പൊതുവായ പ്രത്യാശയായി വിവർത്തനം ചെയ്യുക.
  rationale: ἀναστήσεται, ἀνάστασις എന്നീ ഇരട്ട പുനരുത്ഥാനപ്രയോഗവും ‘അവസാന നാൾ’ എന്ന സമയസൂചനയും ഒരു നിർദിഷ്ട അന്ത്യകാല പുനരുത്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിലപ്പുറം സിദ്ധാന്തവിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഇംഗ്ലീഷ് അടിക്കുറിപ്പിലെ ‘at the resurrection on the last day’ എന്ന ഭേദം മലയാളത്തിൽ മുഖ്യവാചകത്തോടു അർഥവ്യത്യാസമില്ലാതെ ലയിക്കുന്നതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
