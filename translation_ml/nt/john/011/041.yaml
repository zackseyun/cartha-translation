id: JHN.11.41
reference: John 11:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: ml
  text: 'അങ്ങനെ അവർ കല്ല് നീക്കി. യേശു കണ്ണുകൾ മേലോട്ടുയർത്തി[a] പറഞ്ഞു: “പിതാവേ, അങ്ങ് എന്നെ കേട്ടതിനാൽ[b] ഞാൻ അങ്ങേക്കു നന്ദി പറയുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കണ്ണുകൾ ഉയർത്തി” എന്നും, കൂടുതൽ സ്വാഭാവികമായി “മേലോട്ടു നോക്കി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അങ്ങ് എന്നെ കേട്ടതുകൊണ്ട്.” ഗ്രീക്ക് ക്രിയ പൂർത്തിയായ കേൾവിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഇരു പ്രയോഗങ്ങളും ഈ സന്ദർഭത്തിൽ സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: നീക്കി
  rationale: കല്ലറയുടെ പ്രവേശനത്തിൽനിന്ന് കല്ല് മാറ്റുന്നതാണ് സന്ദർഭം; ‘ഉയർത്തി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ ‘നീക്കി’ സ്വാഭാവികവും സന്ദർഭോചിതവും ആണ്.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻപുള്ള കല്പനയുടെ ഫലമായാണ് നടപടി നടക്കുന്നതെന്ന ആഖ്യാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: λίθον
  choice: കല്ല്
  rationale: കല്ലറ അടച്ചിരുന്ന വസ്തുവിനുള്ള സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: കണ്ണുകൾ മേലോട്ടുയർത്തി
  rationale: പ്രാർഥനയിൽ ദൃഷ്ടി മുകളിലേക്കു തിരിക്കുന്ന ഗ്രീക്ക് ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘മേലോട്ടു നോക്കി’ എന്നതിനെക്കാൾ മൂലത്തിന്റെ ഘടനയോട് അടുത്തതാണ്.
- source_word: δὲ
  choice: പ്രത്യേക ബന്ധകപദമില്ലാതെ പുതിയ വാക്യം
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ലഘുവായ ആഖ്യാനമാറ്റമാണ്. മലയാളത്തിൽ പുതിയ വാക്യം തന്നെയാണ് ആ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ‘എന്നാൽ’ അനാവശ്യമായ വിരോധം സൃഷ്ടിക്കും.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: നേരിട്ടുള്ള സംബോധനയും പ്രാർഥനയിലെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὐχαριστῶ σοι
  choice: ഞാൻ അങ്ങേക്കു നന്ദി പറയുന്നു
  rationale: വർത്തമാനകാല നന്ദിപ്രകടനം പൂർണമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ὅτι ἤκουσάς μου
  choice: അങ്ങ് എന്നെ കേട്ടതിനാൽ
  rationale: ἤκουσάς എന്ന aorist രൂപത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും പ്രാർഥനാസന്ദർഭത്തിലെ അനുകൂലമായ കേൾവിയും അനാവശ്യ വിശദീകരണം ചേർക്കാതെ അറിയിക്കുന്നു.
theological_decisions:
- issue: യേശു ദൈവത്തെ സംബോധന ചെയ്യുന്ന വിധം
  choice: പിതാവേ
  alternative: ഓ പിതാവേ
  rationale: ലളിതമായ സംബോധന മൂലപാഠത്തിലെ അടുപ്പവും ആദരവും നിലനിർത്തുന്നു; അധികമായ ആരാധനാക്രമശൈലി ചേർക്കുന്നില്ല.
- issue: ἤκουσάς μου എന്നതിന്റെ പ്രാർഥനാസന്ദർഭത്തിലെ സൂചന
  choice: അങ്ങ് എന്നെ കേട്ടതിനാൽ
  alternative: അങ്ങ് എന്നെ കേട്ടതുകൊണ്ട്
  rationale: പിതാവ് യേശുവിനെ കേട്ടുവെന്ന വാക്യത്തിന്റെ അവകാശവാദം മാത്രം നിലനിർത്തുന്നു; പിതാവും പുത്രനും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ചോ പ്രാർഥനയ്ക്കുള്ള ഉത്തരത്തെക്കുറിച്ചോ പാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ദൈവത്തെ സൂചിപ്പിക്കുന്ന രണ്ടാംപുരുഷ സർവനാമത്തിന്റെ ആദരനില
  choice: അങ്ങ് / അങ്ങേക്കു
  alternative: നീ / നിനക്കു
  rationale: ഗ്രീക്ക് ഏകവചനത്തെ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ആദരം നൽകുന്നു; ബഹുവചനസർവനാമം ഉപയോഗിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. പ്രാർഥനയിലെ ആദരം പ്രകടിപ്പിക്കാൻ ‘അങ്ങ്’ എന്ന ഏകവചനരൂപം സ്വീകരിച്ചു. ആഖ്യാനത്തിൽ അനാവശ്യമായ പഴയ ശൈലിയും ശക്തമായ വിരോധബന്ധകങ്ങളും ഒഴിവാക്കി. ഇംഗ്ലീഷ് മാതൃകയിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന യഥാർഥ പദപ്രയോഗങ്ങളോടു ചേർത്തു.
