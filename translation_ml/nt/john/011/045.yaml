  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: ml
  text: അതിനാൽ, മറിയയുടെ അടുക്കൽ വന്നിരുന്ന യെഹൂദരിൽ പലരും അവൻ ചെയ്തതു കണ്ടിട്ട് അവനിൽ വിശ്വസിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദന്മാരിൽനിന്നുള്ള പലരും’; യോഹന്നാനിലെ ചില സന്ദർഭങ്ങളിൽ Ἰουδαῖοι എന്നതിന് ‘യെഹൂദ്യർ’ എന്നും വിവർത്തനം ചെയ്യാമെന്ന് വാദിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: പലരും
  rationale: അനിശ്ചിതമായെങ്കിലും ഗണ്യമായ ഒരു സംഖ്യയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബഹുവചന വിശേഷണത്തിന് സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: ലാസറിനെ ഉയിർപ്പിച്ച മുൻസംഭവത്തിൽനിന്നുള്ള ഫലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: യെഹൂദരിൽ പലരും
  rationale: ἐκ എന്നതിന്റെ ഭാഗികാർഥം മലയാളത്തിലെ ‘-രിൽ പലരും’ എന്ന ഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു; Ἰουδαῖοι എന്നതിന് ഇവിടെ പൊതുവായി ഗ്രഹിക്കപ്പെടുന്ന ‘യെഹൂദർ’ ഉപയോഗിച്ചു.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: മറിയയുടെ അടുക്കൽ വന്നിരുന്ന
  rationale: ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് നിർണ്ണയിക്കുന്ന ഗ്രീക്ക് വിശേഷണീയ കൃദ്‌രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ആപേക്ഷിക ഘടനയായി അവതരിപ്പിക്കുന്നു; പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള വരവ് ‘വന്നിരുന്ന’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: θεασάμενοι
  choice: കണ്ടിട്ട്
  rationale: ശ്രദ്ധയോടെ കാണുക എന്ന സൂക്ഷ്മത സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നുവെങ്കിലും, സംഭവത്തെ നേരിട്ട് കണ്ടതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന രൂപമാണിത്.
- source_word: ἃ ἐποίησεν
  choice: അവൻ ചെയ്തതു
  rationale: നപുംസകലിംഗ ബഹുവചന ആപേക്ഷികപ്രയോഗത്തെ അർഥനഷ്ടമില്ലാതെ സ്വാഭാവികമായ ഏകവചനസമാഹാരരൂപത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ യേശുവിനെയാണ് ‘അവൻ’ സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിച്ചു
  rationale: യോഹന്നാനിലെ വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്ന πιστεύω εἰς എന്ന പ്രയോഗത്തിന് പതിവും വ്യക്തവുമായ മലയാളസമാനത.
theological_decisions:
- issue: യോഹന്നാനിലെ രക്ഷാകരമായ വിശ്വാസസന്ദർഭത്തിൽ πιστεύω εἰς αὐτόν എന്നതിന്റെ വിവർത്തനം
  choice: അവനിൽ വിശ്വസിച്ചു
  alternative: അവനിൽ ആശ്രയിച്ചു / അവനിൽ വിശ്വാസമർപ്പിച്ചു
  rationale: ‘അവനിൽ വിശ്വസിച്ചു’ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തിനിർദ്ദേശിത സ്വഭാവം നിലനിർത്തുന്നു; ‘വിശ്വാസമർപ്പിച്ചു’ പോലുള്ള വിപുലീകരണം മൂലപാഠത്തിൽ ഇല്ലാത്ത അധിക വ്യാഖ്യാനഭാരം ചേർക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അടുക്കൽ’, ‘വന്നിരുന്ന’, ‘കണ്ടിട്ട്’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലപാഠത്തിലെ ക്രമവും ബന്ധങ്ങളും പരമാവധി നിലനിർത്തുന്നു.
