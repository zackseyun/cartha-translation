  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഒഴുക്കുള്ളതുമാണ്. ‘മറിയയുടെ അടുക്കൽ വന്നിരുന്ന യെഹൂദരിൽ പലരും’ എന്ന ഘടന, മറിയയോടു വന്ന യെഹൂദരെന്ന പരിമിതീകരണം വ്യക്തമായി അറിയിക്കുന്നു. ‘കണ്ടിട്ട്’ ആഖ്യാനശൈലിക്കു യോജിച്ചതാണ്.
