id: JHN.11.36
reference: John 11:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യെഹൂദന്മാർ പറഞ്ഞുകൊണ്ടിരുന്നു[a]: “നോക്കൂ, അവൻ അവനെ എത്രമാത്രം സ്നേഹിച്ചിരുന്നു!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “യെഹൂദ്യർ”; ഇവിടെ സന്നിഹിതരായ യെഹൂദ കാഴ്ചക്കാരെ പ്രദേശപരമായി കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതായി എടുത്താൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം രംഗത്തിലെ തുടർന്നുകൊണ്ടിരുന്നോ പലരാൽ ആവർത്തിക്കപ്പെട്ടോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ കരച്ചിലിനോടു ബന്ധിപ്പിക്കുന്ന ആഖ്യാനത്തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: യോഹന്നാനിലെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സന്നിഹിതരായ യെഹൂദ വിലാപകരെയും കാഴ്ചക്കാരെയുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാരൂപത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: πῶς
  choice: എത്രമാത്രം
  rationale: ഇവിടെ സ്നേഹത്തിന്റെ തീവ്രതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; ഗ്രീക്കിലെ രീതിയുടെയോ അളവിന്റെയോ ആശയം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: ἐφίλει
  choice: സ്നേഹിച്ചിരുന്നു
  rationale: ലാസറിനോടുള്ള വ്യക്തിപരമായ വാത്സല്യം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ അപൂർണ ഭൂതകാലത്തിന്റെ സന്ദർഭബോധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ലാസറിനെ സൂചിപ്പിക്കുന്ന പുൽലിംഗ ഏകവചന കർമസർവനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗം
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: മൂലപദത്തിന്റെ സാധാരണ ജനവിഭാഗസൂചന മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു. ഇവിടെ അത് യെഹൂദജനത്തെ മുഴുവനായി കുറ്റപ്പെടുത്തുന്നതല്ല, സംഭവസ്ഥലത്തുണ്ടായിരുന്ന യെഹൂദ നിരീക്ഷകരെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രദേശപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഉദ്ധരണിയിൽ സംസാരഭാഷയുടെ സ്വാഭാവികതയ്ക്കായി “നോക്കൂ” ഉപയോഗിച്ചു; ചരിത്രപരമായി സംവേദനക്ഷമമായ ജനവിഭാഗസൂചന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
