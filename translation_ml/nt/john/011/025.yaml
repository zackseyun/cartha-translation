id: JHN.11.25
reference: John 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: ml
  text: 'യേശു അവളോടു പറഞ്ഞു: “ഞാനാണ് പുനരുത്ഥാനവും ജീവനും. എന്നിൽ വിശ്വസിക്കുന്നവൻ മരിച്ചാലും ജീവിക്കും,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നിൽ വിശ്വസിക്കുന്ന ഏതൊരാളും മരിച്ചാലും ജീവിക്കും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ “വിശ്വസിക്കുന്നവൻ” എന്ന പ്രയോഗവും തുടർന്നുള്ള ക്രിയയും പുല്ലിംഗ ഏകവചനരൂപത്തിലാണ്; ഇത് വിശ്വസിക്കുന്ന ഏവരെയും പ്രതിനിധീകരിച്ചാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: അവളോടു പറഞ്ഞു
  rationale: സ്ത്രീലിംഗ ഏകവചന ദത്തിവ് സർവനാമം സന്ദർഭത്തിൽ മാർത്തയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ സംഭാഷണാവതരണമാണ് ‘അവളോടു പറഞ്ഞു’.
- source_word: Ἐγώ εἰμι
  choice: ഞാനാണ്
  rationale: ഊന്നൽ നൽകുന്ന ἐγώയും കോപ്പുലയും മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഞാനാണ്’ എന്നു ചേർത്തു പ്രകടിപ്പിക്കുന്നു; യോഹന്നാനിലെ വെളിപ്പെടുത്തൽഭാരം നിലനിർത്തുന്നു.
- source_word: ἡ ἀνάστασις
  choice: പുനരുത്ഥാനം
  rationale: ഇവിടെ പൊതുവായ എഴുന്നേൽപ്പല്ല, മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനമാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ നിർദ്ദേശാർഥം ‘ഞാനാണ്’ എന്ന ഘടനയിലൂടെ വ്യക്തമാണ്.
- source_word: ἡ ζωή
  choice: ജീവൻ
  rationale: ‘പുനരുത്ഥാനം’ എന്നതിനോട് സമാന്തരമായ യേശുവിന്റെ നിർണ്ണായക സ്വയംതിരിച്ചറിയൽ നിലനിർത്തുന്നു; ‘ജീവിതം’ എന്നതിനെക്കാൾ യോഹന്നാനിലെ ജീവദായകവും നിത്യവുമായ അർഥവ്യാപ്തിക്ക് ‘ജീവൻ’ യോജിക്കുന്നു.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്നവൻ
  rationale: സത്താവാചക വർത്തമാന കൃദന്തത്തിന്റെ ഏകവചനവും വിശ്വാസംകൊണ്ട് സവിശേഷിക്കപ്പെടുന്ന വ്യക്തി എന്ന ആശയവും സംരക്ഷിക്കുന്നു; πιστεύω + εἰς എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നിൽ വിശ്വസിക്കുക’ എന്നാണ്.
- source_word: κἂν ἀποθάνῃ
  choice: മരിച്ചാലും
  rationale: κἄν നൽകുന്ന concessive condition മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി ‘-ആലും’ എന്ന രൂപത്തിൽ പ്രകടമാകുന്നു.
- source_word: ζήσεται
  choice: ജീവിക്കും
  rationale: ഭാവികാല വാഗ്ദാനം നേരിട്ട് നിലനിർത്തുന്നു; ‘വീണ്ടും ജീവിക്കും’ എന്നു ചേർത്ത് ഗ്രീക്ക് വ്യക്തമായി പറയാത്തത് അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ὁ πιστεύων എന്ന പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനവും തുടർന്നുള്ള ഏകവചന ക്രിയകളും
  choice: എന്നിൽ വിശ്വസിക്കുന്നവൻ മരിച്ചാലും ജീവിക്കും
  alternative: എന്നിൽ വിശ്വസിക്കുന്ന ഏതൊരാളും മരിച്ചാലും ജീവിക്കും
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗ രൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തി; അത് പുരുഷന്മാർക്ക് മാത്രമല്ല, വിശ്വസിക്കുന്ന ഏവരെയും പ്രതിനിധീകരിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή എന്ന യേശുവിന്റെ സ്വയംതിരിച്ചറിയലിന്റെ വ്യാപ്തി
  choice: ഞാനാണ് പുനരുത്ഥാനവും ജീവനും
  alternative: ഞാൻ പുനരുത്ഥാനവും ജീവനും നൽകുന്നവനാണ്
  rationale: യേശു ഇവ നൽകുന്നു എന്ന പ്രവർത്തനപരമായ പരാവർത്തനത്തിലേക്ക് വാചകത്തെ ചുരുക്കാതെ, ഗ്രീക്കിലെ നേരിട്ടുള്ള വിധേയനാമപ്രസ്താവനയും അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരിചിതമായ ബൈബിൾ പദങ്ങളായ ‘പുനരുത്ഥാനം’, ‘ജീവൻ’ എന്നിവ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി. ‘ഞാനാണ്’ എന്ന രൂപം മൂലത്തിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി കൈമാറുന്നു.
