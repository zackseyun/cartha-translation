id: JHN.11.3
reference: John 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് ആ സഹോദരിമാർ അവന്റെ അടുക്കൽ ആളയച്ച് പറഞ്ഞു: “കർത്താവേ, നോക്കൂ, അങ്ങ് സ്നേഹിക്കുന്നവൻ രോഗിയായിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν λέγουσαι
  choice: അവന്റെ അടുക്കൽ ആളയച്ച് പറഞ്ഞു
  rationale: സഹോദരിമാർ നേരിട്ട് പോയതല്ല, യേശുവിന് സന്ദേശം അയച്ചതാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഹ്വാനം നിലനിർത്തുന്നു; ഇവിടെ അക്ഷരാർഥത്തിലുള്ള കാഴ്ചയെക്കാൾ സന്ദേശത്തിന്റെ അടിയന്തരതയാണ് പ്രധാനം.
- source_word: ὃν φιλεῖς
  choice: അങ്ങ് സ്നേഹിക്കുന്നവൻ
  rationale: φιλέω സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്നേഹം ലളിതമായി നൽകുന്നു; ‘അങ്ങ്’ ആദരപൂർവമായ നേരിട്ടുള്ള അഭിസംബോധനയാണ്.
- source_word: ἀσθενεῖ
  choice: രോഗിയായിരിക്കുന്നു
  rationale: വർത്തമാനകാല രോഗാവസ്ഥ കൃത്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: φιλέω എന്ന ക്രിയയെ ἀγαπάωയിൽനിന്ന് പ്രത്യേക ദൈവശാസ്ത്രപരമായ സ്നേഹവിഭാഗമായി വേർതിരിക്കണമോ
  choice: സ്നേഹിക്കുന്നവൻ
  alternative: പ്രിയമുള്ളവൻ / ഇഷ്ടപ്പെടുന്നവൻ
  rationale: യോഹന്നാനിൽ ഈ സ്നേഹക്രിയകളുടെ അർഥപരിധികൾ തമ്മിൽ മൂടിക്കിടക്കുന്നു; ഈ വാക്യത്തിൽ നിർബന്ധിതമായ ദൈവശാസ്ത്രവ്യത്യാസം ഇറക്കുമതി ചെയ്യാതെ പൊതുവായ സ്നേഹബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർത്താവേ’ എന്ന അഭിസംബോധനയും ‘അങ്ങ്’ എന്ന ആദരസർവനാമവും സന്ദർഭത്തിന് യോജിക്കുന്നു.
