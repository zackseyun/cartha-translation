id: JHN.11.56
reference: John 11:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: ml
  text: 'അതിനാൽ അവർ യേശുവിനെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു. ദേവാലയാങ്കണത്തിൽ[a] നിന്നുകൊണ്ട് അവർ പരസ്പരം പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങൾക്ക് എന്തു തോന്നുന്നു? അദ്ദേഹം ഉത്സവത്തിന് തീർച്ചയായും വരില്ലെന്നാണോ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ἱερόν എന്ന പദം ആന്തരിക വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “അദ്ദേഹം ഉത്സവത്തിന് ഒരിക്കലും വരില്ലെന്നാണോ?” ഗ്രീക്കിൽ ഇവിടെ ഊന്നിയ നിഷേധപ്രയോഗമാണ് (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുകയോ ആവർത്തിക്കുകയോ ചെയ്ത അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനപരമായ തുടർച്ചയും നിഗമനഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: പരസ്പരം ചോദിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘പരസ്പരം പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നാണെങ്കിലും പിന്നാലെയുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ പരസ്പരസംഭാഷണത്തിന്റെ ആവർത്തിത സ്വഭാവം അറിയിക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയാങ്കണത്തിൽ
  rationale: ἱερόν ആന്തരിക വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയോ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ‘ദേവാലയാങ്കണം’ ഈ വ്യത്യാസം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἑστηκότες
  choice: നിന്നുകൊണ്ട്
  rationale: അവർ നിൽക്കുന്ന നിലയിൽ സംഭാഷണം നടത്തിയെന്ന പൂർണകാല പങ്കാളിക്രിയയുടെ അവസ്ഥാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: നിങ്ങൾക്ക് എന്തു തോന്നുന്നു?
  rationale: അഭിപ്രായം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: οὐ μὴ ἔλθῃ
  choice: ഒരിക്കലും വരില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തിന്റെ ശക്തി ലളിതമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ചോദ്യം പ്രതീക്ഷയോ സംശയമോ നിറഞ്ഞതായിരിക്കാമെന്ന അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: εἰς τὴν ἑορτήν
  choice: ഉത്സവത്തിന്
  rationale: യോഹന്നാനിലെ യഹൂദ പെരുന്നാൾസന്ദർഭത്തിന് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
theological_decisions:
- issue: οὐ μή ഉൾപ്പെട്ട ചോദ്യം എങ്ങനെ ഗ്രഹിക്കണം
  choice: “അദ്ദേഹം ഉത്സവത്തിന് ഒരിക്കലും വരില്ലെന്നോ?”
  alternative: “അദ്ദേഹം ഉത്സവത്തിന് തീർച്ചയായും വരില്ലെന്നാണോ?”
  rationale: ഗ്രീക്ക് ഊന്നിയ നിഷേധം സംരക്ഷിക്കുമ്പോഴും ചോദിക്കുന്നവരുടെ പ്രതീക്ഷ സംബന്ധിച്ച വാക്യത്തിന്റെ സാധ്യതാപരമായ അവ്യക്തത നിർബന്ധിച്ച് തീർപ്പാക്കാതിരിക്കാൻ ഈ രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ദേവാലയാങ്കണം’ വഴി ἱερόν-ναός വ്യത്യാസം വായനക്കാരന് വ്യക്തമാക്കുകയും, ഊന്നിയ നിഷേധത്തിന്റെ ശക്തിയും ചോദ്യത്തിലെ അവ്യക്തതയും അടിക്കുറിപ്പോടെ നിലനിർത്തുകയും ചെയ്തു.
