translation:
  language: ml
  text: യേശു കണ്ണുനീർ വാർത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു കരഞ്ഞു.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ കണ്ണുനീർ വാർക്കുന്നതിനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ മറ്റിടത്ത് പറയുന്ന ഉച്ചത്തിലുള്ള വിലാപത്തിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: കണ്ണുനീർ വാർത്തു
  rationale: δακρύω എന്ന ക്രിയ കണ്ണുനീർ വാർക്കുന്നതിനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ഉച്ചത്തിലുള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്ന κλαίω എന്ന ക്രിയയിൽനിന്ന് ഇതു വ്യത്യസ്തമാണ്. ഗ്രീക്ക് ഏറിസ്റ്റ് രൂപത്തിൽ നിർബന്ധമായും ഇല്ലാത്ത ആരംഭാർഥം ചേർക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായി ക്രിയയെ പരിഭാഷപ്പെടുത്തി.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വ്യക്തിനാമമാണ് വാക്യത്തിലെ കർത്താവ്. മലയാളത്തിൽ വ്യക്തിനാമത്തിനു മുമ്പ് അതിനു തുല്യമായ ഉപപദം ആവശ്യമില്ല.
theological_decisions:
- issue: യേശുവിന്റെ വികാരപ്രകടനം
  choice: യേശു കണ്ണുനീർ വാർത്തു
  alternative: യേശു കരഞ്ഞു
  rationale: യേശുവിന്റെ യഥാർഥ മാനുഷിക ദുഃഖപ്രകടനം ലളിതമായി നിലനിർത്തുന്നു. അതിനെ ലഘൂകരിക്കാതെയും ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നതിലധികം ഉച്ചത്തിലുള്ള വിലാപമായി വികസിപ്പിക്കാതെയും പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കണ്ണുനീർ വാർത്തു’ എന്ന പ്രയോഗം മൂലക്രിയയുടെ പ്രത്യേകത വ്യക്തമാക്കുന്നു; കൂടുതൽ പൊതുവായ ‘കരഞ്ഞു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
