id: JHN.11.44
reference: John 11:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ml
  text: 'മരിച്ചിരുന്നവൻ പുറത്തുവന്നു; അവന്റെ കാലുകളും കൈകളും ശവസംസ്കാരത്തുണിപ്പട്ടകളാൽ കെട്ടപ്പെട്ടിരുന്നു, അവന്റെ മുഖം ഒരു തുണികൊണ്ട് ചുറ്റപ്പെട്ടിരുന്നു. യേശു അവരോടു പറയുന്നു: “അവന്റെ കെട്ടുകൾ അഴിക്കൂ; അവനെ പോകാൻ അനുവദിക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: മരിച്ചിരുന്നവൻ
  rationale: പൂർണകൃത്യ പങ്കാളിത്തരൂപം മുൻപ് മരിച്ച നിലയിലായിരുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ കാലസൂചന നിലനിർത്തുന്നു.
- source_word: κειρίαις
  choice: ശവവസ്ത്രത്തുണ്ടുകൾകൊണ്ട്
  rationale: ശവസംസ്കാരത്തിൽ ശരീരം ചുറ്റാനോ കെട്ടാനോ ഉപയോഗിച്ചിരുന്ന തുണിപ്പട്ടകളെ സൂചിപ്പിക്കുന്നു; വെറും ‘കെട്ടുകൾ’ എന്നതിനെക്കാൾ സാഹചര്യസൂചന വ്യക്തമാക്കുന്നു.
- source_word: ἡ ὄψις
  choice: മുഖം
  rationale: ഇവിടെ വ്യക്തിയുടെ മുഖഭാഗം എന്ന അർത്ഥമാണ് സ്വാഭാവികം.
- source_word: σουδαρίῳ
  choice: ഒരു തുണികൊണ്ട്
  rationale: മുഖത്തോ തലയിലോ ചുറ്റിയിരുന്ന പ്രത്യേക തുണിയെ സൂചിപ്പിക്കുന്നു; ‘തൂവാല’ എന്ന ആധുനികവും ഇടുങ്ങിയതുമായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു; ഇംഗ്ലീഷ് പരിശോധനാപാഠത്തിലെ ‘says’ നോടും യോജിക്കുന്നു.
- source_word: Λύσατε αὐτόν
  choice: അവന്റെ കെട്ടുകൾ അഴിക്കൂ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനെ അഴിക്കുക’ എന്നതാണെങ്കിലും മലയാളത്തിൽ ബന്ധനങ്ങൾ അഴിക്കുക എന്ന പ്രവർത്തി വ്യക്തമായി, സ്വാഭാവികമായി പറയുന്നു.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: അവൻ പോകട്ടെ
  rationale: അനുവദിക്കുക/വിട്ടയയ്ക്കുക എന്ന ἄφετε-യുടെ ഭാവവും പോകുക എന്ന ὑπάγειν-ന്റെ അർത്ഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവൻ പോകട്ടെ’ എന്ന കല്പനയുടെ വ്യാഖ്യാനം
  choice: അവൻ പോകട്ടെ
  alternative: അവനെ വിട്ടയയ്ക്കൂ
  rationale: ശാരീരിക ബന്ധനത്തിൽനിന്നുള്ള മോചനവും തുടർന്ന് പോകാനുള്ള അനുമതിയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ഘടനയെ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
