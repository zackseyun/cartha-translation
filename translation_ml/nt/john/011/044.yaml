revisions:
- from: 'മരിച്ചിരുന്നവൻ പുറത്തുവന്നു; അവന്റെ കാലുകളും കൈകളും ശവവസ്ത്രത്തുണ്ടുകൾകൊണ്ട് കെട്ടിയിരുന്നു, മുഖം ഒരു തുണികൊണ്ട് ചുറ്റിയിരുന്നു. യേശു അവരോടു പറയുന്നു: “അവന്റെ കെട്ടുകൾ അഴിക്കൂ; അവൻ പോകട്ടെ.”'
  to: 'മരിച്ചിരുന്നവൻ പുറത്തുവന്നു; അവന്റെ കാലുകളും കൈകളും ശവസംസ്കാരത്തുണിപ്പട്ടകളാൽ കെട്ടപ്പെട്ടിരുന്നു, അവന്റെ മുഖം ഒരു തുണികൊണ്ട് ചുറ്റപ്പെട്ടിരുന്നു. യേശു അവരോടു പറയുന്നു: “അവന്റെ കെട്ടുകൾ അഴിക്കൂ; അവനെ പോകാൻ അനുവദിക്കൂ.”'
  rationale: The revision keeps the Greek historical present (“പറയുന്നു”), retains the burial-strip imagery, and makes the second command explicitly permissive, as required by ἄφετε αὐτὸν ὑπάγειν. No footnote is necessary because the wording can represent the source directly.
  reviewer_model: gpt-5.6-terra
