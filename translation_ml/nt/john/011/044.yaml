review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the deceased man’s emergence, the binding of hands and feet with burial strips, the cloth around his face, and Jesus’ historical-present speech. However, “അവൻ പോകട്ടെ” can sound like a directive that he himself should depart, whereas ἄφετε αὐτὸν ὑπάγειν directs the listeners to permit/release him to go.
  naturalness: The wording is generally clear and modern. “തുണിപ്പട്ടകളാൽ കെട്ടപ്പെട്ടിരുന്നു” is more precise than “ശവവസ്ത്രത്തുണ്ടുകൾകൊണ്ട് കെട്ടിയിരുന്നു” for κειρίαις and reads naturally in this setting.
  terminology: “തുണിപ്പട്ടകൾ” preserves the sense of burial bands/strips without importing a specific burial custom beyond the text. “അവനെ പോകാൻ അനുവദിക്കൂ” explicitly retains the permissive force of ἄφετε.
  issues:
  - severity: medium
    issue: The final imperative is undertranslated.
    rationale: “അവൻ പോകട്ടെ” does not clearly express that Jesus commands those present to let him go (ἄφετε αὐτὸν ὑπάγειν). A rendering with “അനുവദിക്കൂ” preserves the addressees’ required action.
  revised_text: 'മരിച്ചിരുന്നവൻ പുറത്തുവന്നു; അവന്റെ കാലുകളും കൈകളും ശവസംസ്കാരത്തുണിപ്പട്ടകളാൽ കെട്ടപ്പെട്ടിരുന്നു, അവന്റെ മുഖം ഒരു തുണികൊണ്ട് ചുറ്റപ്പെട്ടിരുന്നു. യേശു അവരോടു പറയുന്നു: “അവന്റെ കെട്ടുകൾ അഴിക്കൂ; അവനെ പോകാൻ അനുവദിക്കൂ.”'
