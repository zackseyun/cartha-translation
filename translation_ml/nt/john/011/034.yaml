  to: 'അവൻ പറഞ്ഞു: “നിങ്ങൾ അവനെ എവിടെയാണ് വെച്ചിരിക്കുന്നത്?” അവർ പറഞ്ഞു: “കർത്താവേ[a], വരൂ, കാണുക.”'
  rationale: The revision preserves the Greek wording and ambiguity while improving modern Malayalam idiom. It represents τεθείκατε with a natural perfect/resultative construction, avoids redundant dialogue wording, and replaces the archaic footnote alternative with a contemporary respectful-address equivalent. “കർത്താവേ” remains in the text to preserve the possible theological resonance of Κύριε.
