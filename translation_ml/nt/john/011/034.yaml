id: JHN.11.34
reference: John 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “നിങ്ങൾ അവനെ എവിടെയാണ് വെച്ചിരിക്കുന്നത്?” അവർ പറഞ്ഞു: “കർത്താവേ[a], വരൂ, കാണുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സാറേ.” ഗ്രീക്കിലെ κύριε എന്ന പദം ആദരപൂർവമായ സംബോധനമായും ഉപയോഗിക്കാം; ഇവിടെ “കർത്താവേ” എന്ന വിവർത്തനം പ്രധാന പാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ സംസാരക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. തുടർന്നുവരുന്നത് ചോദ്യമാണെങ്കിലും ‘ചോദിച്ചു’ എന്ന് വ്യാഖ്യാനാത്മകമായി മാറ്റാതെ മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: Ποῦ
  choice: എവിടെയാണ്
  rationale: സ്ഥലം ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യക്രിയാവിശേഷണം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τεθείκατε
  choice: വെച്ചത്
  rationale: τίθημι എന്ന ക്രിയ ഇവിടെ ലാസറിന്റെ ശരീരം ഒരു സ്ഥലത്ത് വെച്ച പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അടക്കം ഉൾക്കൊള്ളുന്നുണ്ടെങ്കിലും, മൂലപാഠത്തേക്കാൾ വ്യക്തമാക്കുന്ന ‘അടക്കിയത്’ ഒഴിവാക്കി ‘വെച്ചത്’ ഉപയോഗിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം ലാസറിനെ സൂചിപ്പിക്കുന്നു.
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയിൽ ആദരസൂചനയും സാധ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ ധ്വനിയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἔρχου καὶ ἴδε
  choice: വന്നു കാണുക
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവികമായ ക്ഷണപ്രയോഗമായി ചേർത്ത് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സംബോധന ചെയ്യുന്ന Κύριε എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: അങ്ങുന്നേ
  rationale: ഈ പദം ആദരപൂർവമായ സാധാരണ സംബോധനയായും ‘കർത്താവ്’ എന്ന കൂടുതൽ ഭാരമുള്ള അഭിസംബോധനയായും മനസ്സിലാക്കാം. പ്രധാന പാഠത്തിൽ ‘കർത്താവേ’ ഉപയോഗിച്ച് സാധ്യമായ ദൈവശാസ്ത്രപരമായ ധ്വനി സംരക്ഷിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ ‘പറഞ്ഞു’ നിലനിർത്തുകയും, അടക്കസന്ദർഭം വ്യാഖ്യാനിച്ച് ചേർക്കാതെ ‘വെച്ചത്’ ഉപയോഗിക്കുകയും ചെയ്തു.
