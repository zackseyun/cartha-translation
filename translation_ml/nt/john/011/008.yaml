id: JHN.11.8
reference: John 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: ml
  text: 'ശിഷ്യന്മാർ അവനോട് പറഞ്ഞു[a]: “റബ്ബീ, യെഹൂദന്മാർ ഇപ്പോൾത്തന്നെ നിന്നെ കല്ലെറിയാൻ ശ്രമിച്ചിരുന്നല്ലോ; എന്നിട്ടും നീ വീണ്ടും അവിടേക്കു പോകുകയാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദ്യക്കാർ” എന്നും, സന്ദർഭമനുസരിച്ച് “യെഹൂദ നേതാക്കൾ” എന്നും വരാം. യോഹന്നാൻ പലപ്പോഴും “യെഹൂദന്മാർ” എന്ന പദം മുഴുവൻ യെഹൂദജനത്തെയും കുറിക്കാനല്ല, യെഹൂദ്യയിൽ യേശുവിനെ എതിർത്തവരെ കുറിക്കാനാണ് ഉപയോഗിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം ആധുനിക മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി ഭൂതകാലത്തിൽ നൽകി.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: സെമിറ്റിക് സംബോധനപ്പദത്തിന്റെ ഗ്രീക്ക് ലിപ്യന്തരണം നിലനിർത്തി; ‘ഗുരോ’ എന്നു വ്യാഖ്യാനാത്മകമായി മാറ്റിയില്ല.
- source_word: νῦν
  choice: ഇപ്പോൾത്തന്നെ
  rationale: ഭീഷണി വളരെ അടുത്തകാലത്തുണ്ടായതാണെന്ന സന്ദർഭാർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചിരുന്നല്ലോ
  rationale: ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചയായോ ശ്രമാത്മകമായോ ഉള്ള ഭൂതകാലഭാവം നൽകുന്നു; ശിഷ്യന്മാരുടെ ഓർമ്മിപ്പിക്കൽഭാവം ‘അല്ലോ’ വ്യക്തമാക്കുന്നു.
- source_word: λιθάσαι
  choice: കല്ലെറിയാൻ
  rationale: കല്ലെറിഞ്ഞു കൊല്ലുക എന്ന പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘കൊല്ലാൻ’ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: പദത്തിന്റെ അടിസ്ഥാന ജനവിഭാഗസൂചന നിലനിർത്തുന്നു; യോഹന്നാനിലെ സന്ദർഭപരമായ ഇടുങ്ങിയ അർത്ഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: ὑπάγεις
  choice: പോകുകയാണോ
  rationale: ഇവിടെ മുമ്പ് പരാമർശിച്ച സ്ഥലത്തേക്കുള്ള സഞ്ചാരമാണ്; ‘പിരിഞ്ഞുപോകുക’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: ἐκεῖ
  choice: അവിടേക്കു
  rationale: അപകടം നിലനിന്നിരുന്ന യെഹൂദ്യയിലേക്കുള്ള ദിശാസൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യർ; അല്ലെങ്കിൽ സന്ദർഭത്തിൽ യെഹൂദനേതാക്കൾ
  rationale: മുഖ്യപാഠത്തിൽ പദത്തിന്റെ അടിസ്ഥാന അർത്ഥം നിലനിർത്തുന്നു. എന്നാൽ ഇവിടെ മുഴുവൻ യെഹൂദജനത്തെയും ഉദ്ദേശിക്കണമെന്നില്ലെന്ന യോഹന്നാനീയ സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു; അതുവഴി അർത്ഥം ഏകപക്ഷീയമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘റബ്ബീ’ എന്ന ചരിത്രപരമായ സംബോധന നിലനിർത്തി. ചോദ്യം ശിഷ്യന്മാരുടെ അതിശയവും എതിർപ്പും പ്രകടിപ്പിക്കുന്ന വിധത്തിൽ ‘എന്നിട്ടും’ ഉപയോഗിച്ചു; അത് καίയുടെ സന്ദർഭപരമായ പ്രതികൂലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
