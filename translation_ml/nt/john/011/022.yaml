id: JHN.11.22
reference: John 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോഴും, നീ ദൈവത്തോട് എന്തു ചോദിച്ചാലും ദൈവം നിനക്കു തരുമെന്ന് എനിക്കറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇപ്പോഴും, നീ ദൈവത്തോട് എന്തു ചോദിച്ചാലും ദൈവം നിനക്കു തരുമെന്ന് എനിക്കറിയാം.” ഗ്രീക്കിലെ സംയോജകപദം കേവലം “ഉം/കൂടാതെ” എന്ന അർത്ഥത്തിൽ വരാമെങ്കിലും, ഇവിടെ മുൻപ്രസ്താവനയ്ക്കുശേഷമുള്ള വൈരുധ്യാത്മക തിരിവായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: എന്നാൽ ഇപ്പോഴും
  rationale: മുൻവാക്യത്തിലെ ലാസറിന്റെ മരണത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയ്ക്കുശേഷം വരുന്ന വൈരുധ്യാത്മക തിരിവും νῦν എന്നതിന്റെ കാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: വർത്തമാന അർത്ഥമുള്ള ഈ പൂർണകാലരൂപത്തിന് ലളിതവും നേരിട്ടുള്ളതുമായ മലയാള സമാനപദം.
- source_word: ὅσα ἂν
  choice: എന്തു ... ആലും
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യാപ്തി മലയാളത്തിലെ സ്വാഭാവികമായ ‘എന്തു ... ആലും’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: αἰτήσῃ τὸν θεὸν
  choice: നീ ദൈവത്തോട് ... ചോദിച്ചാലും
  rationale: ഗ്രീക്കിൽ θεόν നേരിട്ടുള്ള കർമമാണെങ്കിലും, ഈ അർത്ഥത്തിൽ മലയാളത്തിൽ ‘ദൈവത്തോട് ചോദിക്കുക’ എന്നതാണ് സ്വാഭാവികമായ പ്രയോഗം; ഇല്ലാത്ത ഒരു അഭ്യർത്ഥനാവിഷയം ചേർക്കുന്നില്ല.
- source_word: δώσει σοι ὁ θεός
  choice: ദൈവം നിനക്കു തരും
  rationale: ഭാവികാലവും വ്യക്തമായ കർത്താവായ ὁ θεός-ഉം നേരിട്ട് നിലനിർത്തുന്നു; ‘നൽകും’ എന്നതിനെക്കാൾ സാധാരണവും δίδωμι-യോട് അടുത്തതുമായ ‘തരും’ തെരഞ്ഞെടുത്തു.
theological_decisions:
- issue: യേശു ദൈവത്തോട് ചോദിക്കുകയും ദൈവം അവനു നൽകുകയും ചെയ്യുമെന്ന മാർത്തയുടെ വാക്കുകൾ യേശുവിന്റെ ദൈവത്വനിഷേധമായി അതിവായിക്കപ്പെടാനുള്ള സാധ്യത.
  choice: മാർത്തയുടെ വാക്കുകൾ വിശദീകരണമോ സിദ്ധാന്തപരമായ വിപുലീകരണമോ കൂടാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘ദൈവം’ എന്നത് ‘പിതാവായ ദൈവം’ എന്ന് വികസിപ്പിക്കുകയോ അധീനതാഭാവം ഒഴിവാക്കുന്ന വിധത്തിൽ പരാവർത്തനം ചെയ്യുകയോ ചെയ്യുക.
  rationale: ഇത് മാർത്തയുടെ സംഭാഷണമാണ്; യോഹന്നാനിലെ ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ പിരിമുറുക്കം പരിഭാഷയിൽ മായ്ച്ചുകളയരുത്. ‘പിതാവ്’ എന്ന വിപുലീകരണം മൂലപാഠത്തിലില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. യേശുവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ഏകവചനമായ ‘നീ’ ഉപയോഗിച്ചു; ആവർത്തിക്കുന്ന ‘ദൈവം ... ദൈവം’ മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
