reference: John 11:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: ml
  text: മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും, യേശു എവിടെയാണെന്ന് ആർക്കെങ്കിലും അറിഞ്ഞാൽ, അവർക്ക് അവനെ പിടികൂടാൻ കഴിയേണ്ടതിന് അത് അറിയിക്കണമെന്ന് ഉത്തരവിട്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: നൽകിയിരുന്നു
  rationale: പൂർവകാലത്തിലെ മറ്റൊരു സന്ദർഭത്തിനു മുമ്പേ നൽകിയ ഉത്തരവുകളെ സൂചിപ്പിക്കുന്ന പൂർവപൂർണകാലത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേകം സംയോജകം ആവശ്യമില്ല.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: രണ്ടാം ദൈവാലയകാലത്തെ പ്രമുഖ പുരോഹിതാധികാരികളെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; ഒന്നിലധികം മഹാപുരോഹിതന്മാരെന്ന അർഥമല്ല.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണ്.
- source_word: ἐντολὰς
  choice: ഉത്തരവുകൾ
  rationale: അധികാരികൾ നൽകിയ ഔദ്യോഗികവും നിർബന്ധസ്വഭാവമുള്ളതുമായ നിർദേശങ്ങളെ സന്ദർഭോചിതമായി അറിയിക്കുന്നു.
- source_word: ἵνα ἐάν τις γνῷ
  choice: ആർക്കെങ്കിലും അറിഞ്ഞാൽ ... എന്ന്
  rationale: ഉത്തരവിന്റെ ഉള്ളടക്കത്തിലുള്ള വ്യവസ്ഥ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ποῦ ἐστιν
  choice: യേശു എവിടെയാണെന്ന്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലമായ ‘ആണ്’ നിലനിർത്തുന്നു; മലയാളത്തിലെ പരോക്ഷപ്രസ്താവനയിൽ കാലപിന്നോട്ടുമാറ്റം നിർബന്ധമല്ല. ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ സൂചിതമായ കർത്താവിനെ ‘യേശു’ എന്ന് വ്യക്തമാക്കുന്നു.
- source_word: μηνύσῃ
  choice: വിവരം അറിയിക്കണമെന്ന്
  rationale: അധികാരികൾക്ക് വിവരം റിപ്പോർട്ട് ചെയ്യുക എന്ന ഔദ്യോഗിക സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: അവനെ പിടികൂടേണ്ടതിന്
  rationale: ഉദ്ദേശ്യബന്ധം നിലനിർത്തുകയും πιάζωയുടെ പിടിച്ചെടുക്കുക/കൈവശപ്പെടുത്തുക എന്ന വിശാല അർഥം ‘അറസ്റ്റ് ചെയ്യുക’ എന്ന പ്രത്യേക നിയമപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് പദക്രമം യാന്ത്രികമായി പകർത്താതെ, ഉത്തരവിന്റെ വ്യവസ്ഥയും ഉദ്ദേശ്യവും വ്യക്തമായി വായിക്കാവുന്ന ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
