id: JHN.11.19
reference: John 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: ml
  text: യെഹൂദന്മാരിൽ പലരും മാർത്തയുടെയും മറിയയുടെയും സഹോദരനെക്കുറിച്ച് അവരെ ആശ്വസിപ്പിക്കാൻ അവരുടെ അടുക്കൽ വന്നിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യരിൽ പലരും മാർത്തയുടെയും മറിയയുടെയും അടുക്കൽ വന്നിരുന്നു.” ഗ്രീക്കുപദം പൊതുവായി യെഹൂദന്മാരെയോ, യോഹന്നാനിലെ ചില സന്ദർഭങ്ങളിൽ കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യരെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: പലരും
  rationale: πολλοί എന്നതിന്റെ സ്വാഭാവിക അർഥം ‘പലരും’ എന്നാണ്. δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ തുടർച്ച പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരിൽ
  rationale: 'ἐκ ചേർന്ന ഈ പ്രയോഗം ഭാഗികബന്ധം സൂചിപ്പിക്കുന്നു: യെഹൂദന്മാരിൽനിന്നുള്ള പലർ. ‘യെഹൂദന്മാരിൽ പലരും’ എന്നത് സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമാണ്.'
- source_word: ἐληλύθεισαν
  choice: വന്നിരുന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ അതീതപൂർണ്ണ രൂപം ആഖ്യാനത്തിലെ സമയത്തിനു മുമ്പേ അവർ എത്തിയിരുന്നുവെന്നത് സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: അവരുടെ അടുക്കൽ
  rationale: πρός ഇവിടെ വ്യക്തികളുടെ അടുക്കലേക്കുള്ള വരവ് സൂചിപ്പിക്കുന്നു. മുൻപുള്ള ‘മാർത്തയുടെയും മറിയയുടെയും’ എന്ന പ്രയോഗം രണ്ടുപേരെയും വ്യക്തമായി തിരിച്ചറിയുന്നതിനാൽ ആവർത്തനം ഒഴിവാക്കി സർവനാമം ഉപയോഗിച്ചു.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: അവരെ ആശ്വസിപ്പിക്കാൻ
  rationale: ἵνα സഹിതമുള്ള വിധിലിംഗം ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ദുഃഖാചരണസന്ദർഭത്തിൽ παραμυθέομαι എന്നതിന് ‘ആശ്വസിപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: സഹോദരനെക്കുറിച്ച്
  rationale: περί സഹോദരന്റെ മരണവുമായി ബന്ധപ്പെട്ട ദുഃഖത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ‘ആ സഹോദരൻ’ എന്ന ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ അവൻ മാർത്തയുടെയും മറിയയുടെയും സഹോദരനാണെന്ന് വ്യക്തമാകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαίων എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: ഈ വാക്യം എതിർപ്പുകാരെയോ അധികാരികളെയോ അല്ല, സഹോദരിമാരെ ആശ്വസിപ്പിക്കാൻ വന്ന ആളുകളെയാണ് വിവരിക്കുന്നത്. അതിനാൽ വിശാലമായ ജന-മതപരമായ അർഥത്തിലുള്ള ‘യെഹൂദന്മാർ’ സന്ദർഭത്തിന് യോജിക്കുന്നു; യോഹന്നാനിൽ ചിലപ്പോൾ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന അർഥം സാദ്ധ്യമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദുഃഖസന്ദർഭത്തിന് യോജിച്ച ‘ആശ്വസിപ്പിക്കാൻ’ ഉപയോഗിച്ചു; Ἰουδαίων എന്ന പദത്തിലെ യഥാർഥ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
