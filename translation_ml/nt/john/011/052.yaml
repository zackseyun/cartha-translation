id: JHN.11.52
reference: John 11:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: ml
  text: ആ ജനതയ്ക്കുവേണ്ടി മാത്രമല്ല,[a] ചിതറിക്കിടക്കുന്ന ദൈവമക്കളെ ഒന്നായി കൂട്ടിച്ചേർക്കുന്നതിനും കൂടിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ ജനത’ എന്നത് ഈ സന്ദർഭത്തിൽ യഹൂദജനതയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: ജനത
  rationale: സന്ദർഭത്തിൽ ഇത് യഹൂദജനതയെ സൂചിപ്പിക്കുന്ന ഏകവചനത്തിലുള്ള സാമൂഹിക അർഥം നിലനിർത്തുന്നു; ‘ജാതി’ എന്നതിനെക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആശയക്കുഴപ്പം കുറഞ്ഞതുമാണ്.
- source_word: ἵνα
  choice: —േണ്ടതിനും കൂടിയാണ്
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ മരണലക്ഷ്യവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിച്ചുകൊണ്ട് ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τέκνα τοῦ θεοῦ
  choice: ദൈവമക്കൾ
  rationale: τέκνα ലിംഗഭേദമില്ലാതെ മക്കളെ സൂചിപ്പിക്കുന്നു; ‘പുത്രന്മാർ’ എന്ന കൂടുതൽ പരിമിതമായ അർഥം വരുത്തുന്നില്ല.
- source_word: διεσκορπισμένα
  choice: ചിതറിക്കിടക്കുന്ന
  rationale: പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന, ചിതറിക്കപ്പെട്ടതിന്റെ തുടർന്നുനിൽക്കുന്ന അവസ്ഥ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: συναγάγῃ
  choice: കൂട്ടിച്ചേർക്കുക
  rationale: വേർപിരിഞ്ഞിരിക്കുന്നവരെ ഒരുമിച്ചു കൊണ്ടുവരുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς ἕν
  choice: ഒന്നായി
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തതയും വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യതയും നിലനിർത്തുന്നു; ‘ഒരു ശരീരമായി’ എന്ന പാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: ആ ജനതയ്ക്കുവേണ്ടി മാത്രമല്ല, ... —േണ്ടതിനും കൂടിയാണ്
  rationale: മുൻവാക്യത്തിൽ യേശു മറ്റുള്ളവർക്കുവേണ്ടി മരിക്കുന്നതിനെക്കുറിച്ചുള്ള ചിന്ത തുടരുകയും ‘മാത്രമല്ല... കൂടിയാണ്’ എന്ന വിരുദ്ധസമാന്തര ഘടന മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ദൈവമക്കൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: യഹൂദജനതയെക്കാൾ വിശാലമായി, ചിതറിക്കിടക്കുന്ന ദൈവജനത്തെ സൂചിപ്പിക്കുന്ന തുറന്ന പ്രയോഗമായി നിലനിർത്തി.
  alternative: പ്രവാസയഹൂദർ മാത്രമെന്നോ, യഹൂദരും ജാതികളും ഉൾപ്പെട്ട തിരഞ്ഞെടുക്കപ്പെട്ട വിശ്വാസികൾ എന്നോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: വാക്യം ‘ജനത’യെയും കൂടുതൽ വിശാലമായ ‘ചിതറിക്കിടക്കുന്ന ദൈവമക്കളെ’യും വേർതിരിക്കുന്നു; എന്നാൽ അവരുടെ കൃത്യമായ പരിധി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പരിഭാഷ ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ ഗ്രീക്കിൽ സൂചിതമായ ‘മരിക്കുക’ എന്ന ക്രിയ ആവർത്തിച്ച് ചേർത്തിട്ടില്ല. ‘ഒന്നായി’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ വിശാലതയും നിലനിർത്തുന്നു.
