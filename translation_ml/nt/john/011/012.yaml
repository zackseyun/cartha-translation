id: JHN.11.12
reference: John 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് ശിഷ്യന്മാർ അവനോടു പറഞ്ഞു: “കർത്താവേ, അവൻ ഉറങ്ങിപ്പോയിട്ടുണ്ടെങ്കിൽ[a], അവൻ സുഖം പ്രാപിക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഉറങ്ങാൻ പോയിട്ടുണ്ടെങ്കിൽ.” യേശു ലാസറിന്റെ മരണത്തെ ഉറക്കം എന്ന രൂപകത്തിൽ പറഞ്ഞിരുന്നു; എന്നാൽ ശിഷ്യന്മാർ അത് സാധാരണ ഉറക്കമെന്നാണ് മനസ്സിലാക്കിയത്.'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് ക്രിയയെ “രക്ഷിക്കപ്പെടും” എന്നും വിവർത്തനം ചെയ്യാം. എന്നാൽ ഇവിടെ രോഗത്തിൽനിന്ന് സുഖം പ്രാപിക്കുന്നതിനെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: യേശുവിന്റെ മുൻവാക്കിൽനിന്ന് ശിഷ്യന്മാർ എത്തിച്ചേർന്ന നിഗമനത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘അതുകൊണ്ട്’ ആ യുക്തിബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οἱ μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: ഗ്രീക്കിൽ നിർദ്ദിഷ്ടലേഖനം ഉണ്ടെങ്കിലും സന്ദർഭത്തിൽ ആരെ ഉദ്ദേശിക്കുന്നുവെന്ന് വ്യക്തമാണ്; മലയാളത്തിൽ ‘ശിഷ്യന്മാർ’ എന്നത് സ്വാഭാവികവും മതിയുമായ പ്രയോഗമാണ്.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: മൂലപാഠം യേശുവിന്റെ പേര് ആവർത്തിക്കാതെ സർവനാമമാണ് ഉപയോഗിക്കുന്നത്; സന്ദർഭത്തിൽ സൂചിതൻ വ്യക്തമായതിനാൽ അതേ രീതി നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയിൽ κύριος എന്നതിന്റെ പതിവായ മലയാളരൂപം; ആദരസൂചനയും യോഹന്നാനിലെ ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: ശിഷ്യന്മാരുടെ ധാരണയെ അടിസ്ഥാനമാക്കിയുള്ള നേരിട്ടുള്ള വ്യവസ്ഥാസൂചനയാണ്.
- source_word: κεκοίμηται
  choice: ഉറങ്ങിപ്പോയിട്ടുണ്ടെങ്കിൽ
  rationale: കൃത്യമായി സംഭവിച്ചുറച്ച അവസ്ഥ സൂചിപ്പിക്കുന്ന perfect രൂപവും ശിഷ്യന്മാർ ഉദ്ദേശിച്ച സാധാരണ ഉറക്കവും ഈ പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σωθήσεται
  choice: സുഖം പ്രാപിക്കും
  rationale: σῴζω എന്ന ക്രിയയ്ക്ക് ‘രക്ഷിക്കപ്പെടുക’ എന്ന അർഥമുണ്ടെങ്കിലും രോഗസന്ദർഭത്തിൽ അത് സുഖം പ്രാപിക്കുന്നതിനെ സൂചിപ്പിക്കാം. ശിഷ്യന്മാരുടെ വാക്കുകളുടെ സന്ദർഭാർഥം ഇതാണ്.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: ഗുരുവേ / പ്രഭോ
  rationale: ‘കർത്താവേ’ എന്നത് ആദരപൂർവമായ അഭിസംബോധനയും സുവിശേഷത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ സാധ്യതയും നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ മാത്രം അതിന്റെ പൂർണ ദൈവശാസ്ത്രാർഥം നിർബന്ധിച്ച് ചുമത്തുന്നില്ല.
- issue: κεκοίμηται എന്ന പദത്തിലെ ഉറക്കം/മരണം എന്ന ഇരട്ടസാധ്യത
  choice: പ്രധാനപാഠത്തിൽ സാധാരണ ഉറക്കമെന്ന ശിഷ്യന്മാരുടെ ധാരണ പ്രകടിപ്പിക്കുക
  alternative: വിശ്രമിച്ചിരിക്കുകയാണെങ്കിൽ
  rationale: യേശു മരണത്തെ ഉറക്കമെന്ന രൂപകത്തിൽ പറഞ്ഞെങ്കിലും ശിഷ്യന്മാർ അതിനെ സാധാരണ ഉറക്കമായി മനസ്സിലാക്കിയതാണ് കഥയിലെ സംഘർഷം. പ്രധാനപാഠം അവരുടെ ധാരണ വ്യക്തമാക്കുകയും അടിക്കുറിപ്പ് രൂപകപശ്ചാത്തലം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
- issue: σωθήσεται എന്നതിലെ ‘രക്ഷിക്കപ്പെടും’/‘സുഖം പ്രാപിക്കും’ സാധ്യത
  choice: സുഖം പ്രാപിക്കും
  alternative: രക്ഷിക്കപ്പെടും
  rationale: രോഗവും ഉറക്കവും സംബന്ധിച്ച ഈ ഉടൻസന്ദർഭത്തിൽ ശാരീരിക സൗഖ്യമാണ് ശിഷ്യന്മാർ ഉദ്ദേശിക്കുന്നത്. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സംഭാഷണം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അവതരിപ്പിച്ചു. മൂലപാഠത്തിലെ സർവനാമവും യുക്തിബന്ധവും നിലനിർത്തി; രോഗസന്ദർഭത്തിലെ അർഥം പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കിയപ്പോൾ യഥാർഥ ലെക്സിക്കൽ സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
