  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: ml
  text: 'എന്നാൽ അതു കേട്ടപ്പോൾ യേശു പറഞ്ഞു: “ഈ രോഗം മരണത്തിൽ അവസാനിക്കാനുള്ളതല്ല[a]; ദൈവത്തിന്റെ മഹത്ത്വത്തിനുവേണ്ടിയുള്ളതാണ്—അതിലൂടെ ദൈവപുത്രൻ മഹത്ത്വപ്പെടേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മരണത്തിലേക്കു നയിക്കുന്നതല്ല” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ഗ്രീക്ക് പ്രയോഗം, മരണം ഈ രോഗത്തിന്റെ അന്തിമഫലമോ ലക്ഷ്യമോ അല്ലെന്ന് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: എന്നാൽ അതു കേട്ടപ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ ആഖ്യാനമാറ്റവും ἀκούσας എന്ന ഭൂതകാല കൃദന്തത്തിന്റെ കാലസാഹചര്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘അതു’ എന്നത് ലാസറിന്റെ രോഗത്തെക്കുറിച്ചുള്ള അറിയിപ്പിനെ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിക്കുന്നു.
- source_word: ἀσθένεια
  choice: രോഗം
  rationale: ലാസറിന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വൈദ്യശാസ്ത്രപരമായി അതിസങ്കുചിതമല്ലാത്തതുമായ പദം.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: മരണത്തിൽ അവസാനിക്കാനുള്ളതല്ല
  rationale: πρός ഇവിടെ അന്തിമഫലമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു. ലാസർ സംഭവത്തിനിടെ മരിക്കുന്നുവെന്ന തുടർന്നുള്ള വിവരണത്തോടുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ഇല്ലാതാക്കാതെ, മരണം രോഗത്തിന്റെ അന്തിമപരിണതി അല്ലെന്ന ആശയം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വത്തിനുവേണ്ടിയുള്ളതാണ്
  rationale: ὑπέρ നൽകുന്ന ഉദ്ദേശ്യ/പ്രയോജനഭാവവും δόξα എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രഭാരവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα δοξασθῇ
  choice: മഹത്ത്വപ്പെടേണ്ടതിന്
  rationale: ἵνα നൽകുന്ന ഉദ്ദേശ്യബന്ധം വ്യക്തമാക്കുകയും δοξασθῇയുടെ കർമണിഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഈ സ്ഥാനപ്പേരിന്റെ കൃത്യവും മലയാളത്തിൽ സുസ്ഥിരവുമായ പരിഭാഷ.
- source_word: δι’ αὐτῆς
  choice: അതിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം/മാധ്യമം എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു; സർവനാമം രോഗത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ലാസർ പിന്നീട് യഥാർഥത്തിൽ മരിക്കുന്ന സാഹചര്യത്തിൽ ‘മരണത്തിലേക്കുള്ളതല്ല’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മരണം ഈ രോഗത്തിന്റെ അന്തിമഫലമോ ലക്ഷ്യമോ അല്ലെന്ന സൂചന നൽകുന്ന വിധത്തിൽ ‘മരണത്തിൽ അവസാനിക്കാനുള്ളതല്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ലാസർ മരിക്കുകയേയില്ലെന്ന നിരുപാധിക പ്രവചനം; അല്ലെങ്കിൽ ‘മാരകമല്ല’ എന്ന വൈദ്യപരമായ പ്രസ്താവന മാത്രം.
  rationale: യോഹന്നാൻ 11:14-ൽ ലാസർ മരിച്ചതായി വിവരണം വ്യക്തമാക്കുന്നു. അതിനാൽ πρὸς എന്നതിന്റെ അന്തിമഫല/ലക്ഷ്യഭാവം നിലനിർത്തുകയും വാക്യത്തിലെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ‘ദൈവത്തിന്റെ മഹത്ത്വം’ എന്നതും ‘ദൈവപുത്രൻ മഹത്ത്വപ്പെടുക’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തിന്റെ മഹത്ത്വവും അതിലൂടെ പുത്രൻ മഹത്ത്വപ്പെടുന്നതും രണ്ട് വ്യത്യസ്തവും പരസ്പരം ബന്ധപ്പെട്ടതുമായ പ്രസ്താവനകളായി നിലനിർത്തി.
  alternative: രണ്ടിനെയും ദൈവിക മഹത്ത്വത്തെക്കുറിച്ചുള്ള ഒരൊറ്റ പൊതുപ്രസ്താവനയായി ലയിപ്പിക്കൽ.
  rationale: ഗ്രീക്ക് വാചകം ദൈവത്തിന്റെ മഹത്ത്വത്തെയും പുത്രന്റെ മഹത്ത്വപ്പെടലിനെയും വ്യക്തമായി പരാമർശിക്കുന്നു. രണ്ടും നിലനിർത്തുന്നത് വാക്യത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രാധാന്യം അധികവ്യാഖ്യാനമില്ലാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ശൈലി സ്വീകരിച്ചു. ‘മഹത്ത്വീകരിക്കപ്പെടുക’ എന്ന കൂടുതൽ സാങ്കേതിക രൂപത്തിനു പകരം സ്വാഭാവികമായ ‘മഹത്ത്വപ്പെടുക’ ഉപയോഗിച്ചു; എന്നാൽ മൂലത്തിലെ കർമണിഭാവവും ഉദ്ദേശ്യബന്ധവും നിലനിർത്തി.
