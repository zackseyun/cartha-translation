  terminology: “രോഗിയായിരിക്കുന്നുവെന്ന്” appropriately preserves the Greek present ἀσθενεῖ in idiomatic Malayalam. “താമസിച്ചു” is an apt rendering of ἔμεινεν in this locative context. No footnote is needed, since the present-tense report is natural in Malayalam.
