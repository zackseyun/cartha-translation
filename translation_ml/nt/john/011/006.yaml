id: JHN.11.6
reference: John 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: ml
  text: അവൻ രോഗിയായിരിക്കുന്നുവെന്ന് കേട്ടപ്പോൾ, അദ്ദേഹം ഉണ്ടായിരുന്ന സ്ഥലത്ത് അപ്പോൾ രണ്ടു ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: കേട്ടപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു; οὖν സൂചിപ്പിക്കുന്ന ആഖ്യാനതുടർച്ച മലയാളത്തിലെ വാക്യക്രമത്തിലും സന്ദർഭബന്ധത്തിലും പ്രകടമാണ്.
- source_word: ἤκουσεν
  choice: കേട്ടപ്പോൾ
  rationale: ἀκούω എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തുന്നു; ‘അറിഞ്ഞപ്പോൾ’ എന്നതുപോലെ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὅτι ἀσθενεῖ
  choice: അവൻ രോഗിയായിരിക്കുന്നുവെന്ന്
  rationale: ഇവിടെ ἀσθενέω ശാരീരിക രോഗത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ വർത്തമാനകാലം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താനാകുന്നതിനാൽ ‘രോഗിയായിരിക്കുന്നുവെന്ന്’ എന്നു നൽകി.
- source_word: τότε μὲν
  choice: പിന്നെയും
  rationale: മുൻസന്ദർഭത്തിൽ യേശു ഇതിനകം ആ സ്ഥലത്തുണ്ടായിരുന്നുവെന്നതും, വാർത്ത കേട്ടശേഷവും അവിടെ തുടർന്നുവെന്നതും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. μέν-ന്റെ ലഘു ഊന്നൽ പ്രത്യേക കൃത്രിമ പദം ചേർക്കാതെ വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔμεινεν
  choice: താമസിച്ചു
  rationale: ഒരു സ്ഥലത്ത് തുടർന്നിരിക്കുക എന്ന സന്ദർഭാർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: താൻ ഉണ്ടായിരുന്ന സ്ഥലത്തുതന്നെ
  rationale: മൂലത്തിലെ സ്ഥാനസൂചന പൂർണമായി നിലനിർത്തുകയും -ത്തുതന്നെ എന്നത് അവിടെ തുടരുന്നതിലെ ഊന്നൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: δύο ἡμέρας
  choice: രണ്ടു ദിവസം
  rationale: കാലദൈർഘ്യം നേരിട്ടും വ്യക്തമായും പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ലാസറിന്റെ രോഗവാർത്ത കേട്ടശേഷം യേശു താമസിച്ചതിന്റെ ആഖ്യാനപരമായ സംഘർഷം
  choice: വാർത്ത കേട്ടിട്ടും അവിടെ രണ്ടു ദിവസംകൂടി താമസിച്ചുവെന്ന പ്രസ്താവന വിശദീകരണമോ മയപ്പെടുത്തലോ ഇല്ലാതെ നൽകി.
  alternative: താമസത്തിന് കരുണാപൂർവമായ ഉദ്ദേശ്യമുണ്ടായിരുന്നുവെന്ന് മുഖ്യവാക്യത്തിൽ വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ സംഘർഷം കുറയ്ക്കാൻ വാചകം മൃദുവാക്കുക.
  rationale: മൂലവാക്യം ഉദ്ദേശപൂർവം നിലനിർത്തുന്ന ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം പരിഭാഷയിൽ തന്നെ പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ വർത്തമാനകാലം മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ നിലനിർത്താനാകുന്നതിനാൽ കാലഭേദത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ആവശ്യമില്ല.
