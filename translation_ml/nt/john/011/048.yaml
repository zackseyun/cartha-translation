  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: ml
  text: ഇങ്ങനെ തുടരാൻ നാം അവനെ അനുവദിച്ചാൽ, എല്ലാവരും അവനിൽ വിശ്വസിക്കും; റോമാക്കാർ വന്ന് നമ്മുടെ സ്ഥലവും[a] രാഷ്ട്രവും[b] എടുത്തുകളയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നമ്മുടെ ക്ഷേത്രം’ അല്ലെങ്കിൽ ‘നമ്മുടെ സ്ഥാനം.’ ഗ്രീക്കിൽ ‘സ്ഥലം’ എന്നാണ്; അത് പ്രത്യേകിച്ച് ക്ഷേത്രത്തെയോ കൂടുതൽ വിശാലമായി അവരുടെ സ്ഥാനത്തെയോ നിലയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘നമ്മുടെ ജനത.’ ഗ്രീക്ക് പദത്തിന് ഒരു ജനതയെയോ രാഷ്ട്രീയമായൊരു രാഷ്ട്രത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: ഇങ്ങനെ തുടരാൻ നാം അവനെ അനുവദിച്ചാൽ
  rationale: ἀφίημι ഇവിടെ അനുവദിക്കുക എന്ന അർഥത്തിലാണ്; οὕτως സൂചിപ്പിക്കുന്ന നിലവിലുള്ള പ്രവർത്തനരീതി സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇങ്ങനെ തുടരാൻ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: പൊതുവായും ഉൾക്കൊള്ളുന്നതുമായ ബഹുവചനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിക്കും
  rationale: യോഹന്നാന്റെ രചനകളിൽ പതിവായ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ ദിശാത്മകവും വ്യക്തികേന്ദ്രിതവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: റോമാക്കാർ വന്ന്
  rationale: റോമാക്കാർ വരുമെന്ന ഭാവികാലപ്രസ്താവനയെ തുടർന്നുള്ള പ്രവർത്തനവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀροῦσιν
  choice: എടുത്തുകളയും
  rationale: αἴρω എന്ന പദത്തിന്റെ ‘നീക്കിക്കളയുക/എടുത്തുകളയുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘നശിപ്പിക്കും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: τόπον
  choice: സ്ഥലം
  rationale: ക്ഷേത്രം, സ്ഥാനം, അധികാരപരമായ നില എന്നിവയിൽ ഏതിനെ സൂചിപ്പിക്കുന്നു എന്ന് ഗ്രീക്ക് പദം നിർണയിക്കാത്തതിനാൽ അതിന്റെ വിശാലതയും അവ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: ἔθνος
  choice: ജനത
  rationale: ἔθνος സൂചിപ്പിക്കുന്ന ജനസമൂഹത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; രാഷ്ട്രീയ ഘടകമായ ‘രാഷ്ട്രം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: നമ്മുടെ സ്ഥലവും ജനതയും
  rationale: ἡμῶν രണ്ടു നാമങ്ങൾക്കും ബാധകമാണെന്നും ആവർത്തിച്ച καί രണ്ടിനെയും ചേർക്കുന്നുവെന്നും വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: τόπον എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: പ്രധാന പാഠത്തിൽ ‘സ്ഥലം’ എന്ന് നിലനിർത്തി
  alternative: ‘ക്ഷേത്രം’ അല്ലെങ്കിൽ ‘സ്ഥാനവും അധികാരവും’
  rationale: സന്ദർഭത്തിൽ ക്ഷേത്രമോ മതനേതാക്കളുടെ സ്ഥാപനപരമായ നിലയോ ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും മൂലപദം അത് നിർണയിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനത്തിലൂടെ അവ്യക്തത പരിഹരിച്ചിട്ടില്ല.
- issue: ἔθνος എന്നതിന്റെ സാമൂഹിക-രാഷ്ട്രീയ വ്യാപ്തി
  choice: ‘ജനത’
  alternative: ‘രാഷ്ട്രം’
  rationale: ഇവിടെ യെഹൂദജനത്തെ സൂചിപ്പിക്കുന്ന സാധ്യത ശക്തമാണ്; അതേസമയം റോമൻ ഇടപെടലിനെക്കുറിച്ചുള്ള രാഷ്ട്രീയ ആശങ്ക കാരണം ‘രാഷ്ട്രം’ എന്ന അർഥസാധ്യതയും നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഭീഷണിയുടെ അടിയന്തരത നിലനിർത്തിയിരിക്കുന്നു; എന്നാൽ മൂലത്തിലെ അർഥാവ്യക്തതകൾ പ്രധാന പാഠത്തിൽ അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല.
