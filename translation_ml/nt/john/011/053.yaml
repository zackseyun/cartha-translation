  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ml
  text: അതുകൊണ്ട്, അന്നുമുതൽ അവനെ കൊല്ലാൻ അവർ പദ്ധതിയിട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: അന്നുമുതൽ
  rationale: ἀπό ചേർന്ന കാലസൂചകപദസമുച്ചയം തുടക്കബിന്ദുവിനെയും അതിനുശേഷമുള്ള തുടർച്ചയെയും സൂചിപ്പിക്കുന്നു. ‘അന്നുമുതൽ’ സ്വാഭാവികമായ മലയാളത്തിൽ ഈ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പത്തെ ആലോചനാസഭയുടെ ഫലമായുണ്ടായ തീരുമാനത്തെ οὖν ബന്ധിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ അതിന്റെ നിഗമനാത്മക ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐβουλεύσαντο
  choice: അവർ പദ്ധതിയിട്ടു
  rationale: βουλεύομαι ഇവിടെ വെറും ചർച്ചയെയല്ല, ആലോചനയിലൂടെ രൂപപ്പെട്ട ഉദ്ദേശ്യപൂർവമായ പദ്ധതിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പദ്ധതിയിട്ടു’ ഗൂഢാലോചനയുടെ ഭാവം അതിശയോക്തിയില്ലാതെ നൽകുന്നു.
- source_word: ἵνα ἀποκτείνωσιν
  choice: കൊല്ലാൻ
  rationale: ἵναയും aorist subjunctive-ഉം deliberative ക്രിയയ്ക്കുശേഷം ലക്ഷ്യം/ഉള്ളടക്കം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ഉദ്ദേശ്യാർഥക infinitive രൂപമായ ‘കൊല്ലാൻ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സമീപസന്ദർഭത്തിൽ സർവനാമം യേശുവിനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠം പേര് ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിലും ‘അവനെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള നേതാക്കളുടെ ഉദ്ദേശ്യത്തിന്റെ സ്വഭാവം
  choice: അവനെ കൊല്ലാനുള്ള ഉറച്ച പദ്ധതിയായി പ്രസ്താവന വിവർത്തനം ചെയ്യുന്നു.
  alternative: അവനെ കൊല്ലുന്നതിനെക്കുറിച്ച് അവർ ചർച്ച ചെയ്തു / അവനെ വധിക്കുന്ന കാര്യം അവർ പരിഗണിച്ചു.
  rationale: ഗ്രീക്ക് പാഠം വെറും പരിഗണനയേക്കാൾ മുന്നോട്ടുപോയ, ആലോചനയിൽനിന്ന് രൂപപ്പെട്ട പദ്ധതിയെ സൂചിപ്പിക്കുന്നു. അതേസമയം, നിയമപരമായ നടപടിയെന്നോ പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനമെന്നോ പാഠത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യബന്ധം വ്യക്തമാക്കാൻ ‘അതുകൊണ്ട്’ ഉപയോഗിച്ചു; ‘വധിക്കാൻ’ എന്ന കൂടുതൽ നിയമപരമോ ഔപചാരികമോ ആയ പദത്തിന് പകരം മൂലത്തിലെ നേരിട്ടുള്ള അർഥം നൽകുന്ന ‘കൊല്ലാൻ’ തെരഞ്ഞെടുത്തു.
