id: JHN.11.16
reference: John 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: ml
  text: 'അപ്പോൾ, ദിദിമൊസ്[a] എന്നു വിളിക്കപ്പെട്ട തോമസ് സഹശിഷ്യന്മാരോട് പറഞ്ഞു: “നമുക്കും പോകാം, അവനോടൊപ്പം മരിക്കാനായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ദിദിമൊസ് എന്ന ഗ്രീക്കുപേരിന്റെ അർഥം “ഇരട്ട” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Θωμᾶς
  choice: തോമാസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: ദിദിമൊസ്[a] എന്നു വിളിക്കപ്പെട്ടിരുന്ന
  rationale: Δίδυμος എന്ന ഗ്രീക്ക് പേരിനെ ലിപ്യന്തരിച്ചു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ നൽകി, മൂലത്തിലെ പേരും വിശദീകരണസാധ്യതയും നിലനിർത്തി.
- source_word: τοῖς συμμαθηταῖς
  choice: സഹശിഷ്യന്മാരോട്
  rationale: തോമാസിനൊപ്പം യേശുവിനെ അനുഗമിച്ചിരുന്ന ശിഷ്യരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘സഹശിഷ്യന്മാർ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: നമുക്കും പോകാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചന പ്രേരണാർഥക പ്രയോഗവും καί നൽകുന്ന ഉൾപ്പെടുത്തലിന്റെ ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം മരിക്കാനായി
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/പ്രതീക്ഷിതഫല ബന്ധവും μετ’ αὐτοῦയുടെ സഹഗമനാർഥവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: തോമാസിന്റെ വാക്കുകളുടെ ഭാവവും ഉദ്ദേശ്യവും
  choice: വാക്കുകൾക്ക് അധിക വ്യാഖ്യാനനിറം നൽകാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ധീരമായ വിശ്വസ്തത, നിരാശാഭരിതമായ വിധിവാദം, അല്ലെങ്കിൽ പരിഹാസാത്മകമായ അശുഭപ്രതീക്ഷ എന്നിങ്ങനെ വ്യക്തമായി ചിത്രീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം തോമാസിന്റെ മാനസികഭാവം നിർണയിക്കുന്നില്ല. അതിനാൽ ധൈര്യം, നിരാശ, പരിഹാസം എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് പരിഭാഷയിൽ അടിച്ചേൽപ്പിക്കാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; പേരിന്റെ പരമ്പരാഗത രൂപം മുഖ്യവാക്യത്തിലും അതിന്റെ അർഥം അടിക്കുറിപ്പിലും നൽകി.
