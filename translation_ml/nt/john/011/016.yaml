  to: 'അപ്പോൾ, ദിദിമൊസ്[a] എന്നു വിളിക്കപ്പെട്ട തോമസ് സഹശിഷ്യന്മാരോട് പറഞ്ഞു: “നമുക്കും പോകാം, അവനോടൊപ്പം മരിക്കാനായി.”'
