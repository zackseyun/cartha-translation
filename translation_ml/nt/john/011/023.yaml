id: JHN.11.23
reference: John 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: ml
  text: 'യേശു അവളോട് പറയുന്നു: “നിന്റെ സഹോദരൻ ഉയിർത്തെഴുന്നേൽക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ഗ്രീക്ക് ചരിത്രവർത്തമാനകാലം നിലനിർത്താൻ വർത്തമാനകാലരൂപം ഉപയോഗിച്ചു; ഇത് മലയാളത്തിലും സ്വാഭാവികവും സജീവവുമാണ്.
- source_word: αὐτῇ
  choice: അവളോട്
  rationale: പറയുക എന്ന ക്രിയയോടുകൂടിയ ദത്തിവിഭക്തിയുടെ സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἀναστήσεται
  choice: ഉയിർത്തെഴുന്നേൽക്കും
  rationale: സന്ദർഭത്തിൽ മരിച്ചവരിൽനിന്നുള്ള എഴുന്നേൽപ്പിനെയാണ് ഭാവികാല മധ്യരൂപം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ഈ രൂപം പുനരുത്ഥാനാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ദൈവിക കർത്തൃത്വം പ്രത്യേകം മുൻനിർത്തുന്ന കർമണിപ്രയോഗം ഒഴിവാക്കി.
- source_word: ὁ ἀδελφός σου
  choice: നിന്റെ സഹോദരൻ
  rationale: ഉടമസ്ഥതയും സഹോദരബന്ധവും നേരായ, സാധാരണ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം; ഗ്രീക്ക് നിർദേശകപദം പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ പദപ്രയോഗവും സമയസൂചനയും
  choice: ഉയിർത്തെഴുന്നേൽക്കും
  alternative: എഴുന്നേൽക്കും / ഉയിർപ്പിക്കപ്പെടും
  rationale: പ്രസ്താവന സഹോദരന്റെ ഭാവിയിലെ ഉയിർത്തെഴുന്നേൽപ്പ് ഉറപ്പാക്കുന്നു; അത് ഉടനെയുള്ള ജീവപ്രാപ്തിയെയോ അന്ത്യനാളിലെ പുനരുത്ഥാനത്തെയോ ഇവിടെ തന്നെ നിർണയിക്കുന്നില്ല. കർമണിരൂപം ഗ്രീക്ക് രൂപത്തേക്കാൾ ദൈവിക കർത്തൃത്വത്തെ കൂടുതൽ തുറന്നുപറയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് ചരിത്രവർത്തമാനകാലം നിലനിർത്തി. ഇംഗ്ലീഷിൽ ആവശ്യമായ ‘again’ എന്ന വിശദീകരണത്തിന് തുല്യമായ പ്രത്യേക പദം മലയാളത്തിൽ ചേർത്തിട്ടില്ല; ‘ഉയിർത്തെഴുന്നേൽക്കും’ തന്നെ മരണത്തിൽനിന്നുള്ള എഴുന്നേൽപ്പിന്റെ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
