id: JHN.11.9
reference: John 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “പകലിന് പന്ത്രണ്ട് മണിക്കൂർ ഉണ്ടല്ലോ?[a] ഒരാൾ[c] പകൽസമയത്ത് നടന്നാൽ ഇടറുന്നില്ല; കാരണം ഈ ലോകത്തിന്റെ വെളിച്ചം കാണുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പകലിന്റെ പന്ത്രണ്ട് മണിക്കൂർ.”
    reason: lexical_alternative
  - marker: b
    text: “ഈ ലോകത്തിന്റെ വെളിച്ചം” എന്ന പ്രയോഗത്തിന് ദൈവിക പ്രകാശത്തെക്കുറിച്ചുള്ള യോഹന്നാനീയ പ്രമേയവുമായി വിപുലമായ പ്രതിധ്വനി ഉണ്ടായേക്കാം; എന്നാൽ പ്രധാനപാഠത്തിൽ വാക്കുകൾ പറഞ്ഞിരിക്കുന്നതുപോലെതന്നെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: 'ഗ്രീക്കിൽ പ്രതിനിധിപരമായ ഏകവചനം ഉപയോഗിച്ചിരിക്കുന്നു: “ഒരാൾ … കാണുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: കഥനസന്ദർഭത്തിലെ സാധാരണ പ്രതികരണക്രിയയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Οὐχὶ
  choice: ഉണ്ടല്ലോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ഭാവം മലയാളത്തിലെ ‘അല്ലോ?’ രൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: പകലിന് പന്ത്രണ്ട് മണിക്കൂർ
  rationale: ഇവിടെ ἡμέρα സൂചിപ്പിക്കുന്ന പകൽവേളയും അതിന്റെ പന്ത്രണ്ട് മണിക്കൂർ വിഭജനവും വ്യക്തവും ലളിതവുമായി നൽകുന്നു; ജനിതകബന്ധത്തിന്റെ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐάν τις περιπατῇ
  choice: ഒരാൾ പകൽസമയത്ത് നടന്നാൽ
  rationale: τις എന്ന അനിശ്ചിത ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ സ്വഭാവവും നിബന്ധനാവാക്യവും നിലനിർത്തുന്നു.
- source_word: προσκόπτει
  choice: ഇടറുന്നില്ല
  rationale: ‘ഇടറുക’ എന്നത് നേരിട്ടുള്ള ശാരീരിക ദൃശ്യവും സന്ദർഭത്തിലെ വിപുലമായ രൂപകസാധ്യതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: അടിസ്ഥാന പദാർഥം നൽകുകയും യോഹന്നാനിലെ സാധ്യമായ പ്രമേയപ്രതിധ്വനി വ്യാഖ്യാനിച്ചു ചേർക്കാതെ തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിന്റെ
  rationale: τούτου എന്ന സമീപസൂചകത്തിന്റെ ഊന്നലും ജനിതകബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βλέπει
  choice: കാണുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ‘കാണാൻ കഴിയുന്നു’ എന്ന വ്യാഖ്യാനപരമായ കഴിവർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘വെളിച്ചം’ എന്ന പദത്തിന്റെ യോഹന്നാനീയ പ്രതീകസാധ്യത
  choice: പ്രധാനപാഠത്തിൽ സാധാരണ ദൃശ്യമായ ‘ഈ ലോകത്തിന്റെ വെളിച്ചം’ എന്ന പ്രയോഗം നിലനിർത്തി, പ്രതീകം വ്യക്തമാക്കാതെ വിടുക
  alternative: വെളിച്ചത്തെ യേശുവിനെയോ ദൈവിക മാർഗദർശനത്തെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുക
  rationale: തൽക്ഷണസന്ദർഭത്തിൽ ഇത് പകൽ നടക്കുന്നതിനെക്കുറിച്ചുള്ള ദൃഷ്ടാന്തമായി പ്രവർത്തിക്കുന്നു; അതേസമയം യോഹന്നാനിലെ വെളിച്ചപ്രമേയത്തോടുള്ള പ്രതിധ്വനിയും സാധ്യമാണ്. ഏതെങ്കിലും ഒരു അർഥം നിർബന്ധിച്ച് തീർപ്പാക്കാതെ വാചകം അതേ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- issue: τις എന്ന അനിശ്ചിത പ്രതിനിധി ഏകവചനം
  choice: ‘ഒരാൾ’ എന്ന ഏകവചനരൂപം ഉപയോഗിക്കുക
  alternative: ബഹുവചനമോ ലിംഗനിർണ്ണയമുള്ള സർവനാമമോ ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ പ്രതിനിധിപരമായ ഏകവചനം സംരക്ഷിക്കുമ്പോൾ, മൂലത്തിൽ വ്യക്തമല്ലാത്ത പുരുഷലിംഗം മലയാളത്തിലേക്ക് അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംസാര-കഥനശൈലി. അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘ഉണ്ടല്ലോ?’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ഏകവചനബന്ധം നിലനിർത്താൻ പിന്നാലെയുള്ള ക്രിയകളിൽ മലയാളത്തിന് സ്വാഭാവികമായ കർത്തൃലോപം അനുവദിച്ചു; ഇതിലൂടെ അനാവശ്യ ലിംഗസൂചന ഒഴിവാക്കി.
