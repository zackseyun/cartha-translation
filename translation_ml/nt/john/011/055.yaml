base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: ml
  text: യെഹൂദന്മാരുടെ പെസഹ[a] അടുത്തിരുന്നു. പെസഹയ്ക്കുമുമ്പ് തങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കാൻ[b] നാട്ടിൻപുറങ്ങളിൽനിന്ന് പലരും യെരൂശലേമിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യെഹൂദരുടെ പെസഹ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘യെഹൂദന്മാരുടെ പെസഹ’ എന്നാണ്; യോഹന്നാനിൽ ഈ പ്രയോഗം ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, പെസഹയ്ക്കുള്ള ഒരുക്കമായി ആചാരപരമായ ശുദ്ധീകരണം അനുഷ്ഠിക്കാൻ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: അടുത്തിരുന്നു
  rationale: δέ മൃദുവായ ഒരു ബന്ധകമാണ്; മലയാളത്തിൽ പുതിയൊരു സമയസൂചകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആഖ്യാനബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐγγὺς
  choice: അടുത്തിരുന്നു
  rationale: ഇവിടെ സമയപരമായ സമീപ്യതയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ പെസഹ
  rationale: യോഹന്നാനിൽ ആവർത്തിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിഘടനയെ സുതാര്യമായി നിലനിർത്തുന്നു; ‘പെസഹ’ πάσχα എന്ന ഉത്സവനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപമാണ്.
- source_word: ἀνέβησαν
  choice: കയറിപ്പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള ഭൂമിശാസ്ത്രപരവും തീർഥാടനപരവുമായ ‘മുകളിലേക്കുള്ള’ യാത്രയുടെ സൂക്ഷ്മത സംരക്ഷിക്കുന്നു.
- source_word: πολλοὶ
  choice: പലരും
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന മലയാളത്തിലെ ലക്ഷ്യവിഭക്തിയിലൂടെ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ τῆς χώρας
  choice: നാട്ടിൻപുറങ്ങളിൽനിന്ന്
  rationale: നഗരത്തിനു പുറത്തുള്ള ഗ്രാമപ്രദേശങ്ങളെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ‘നാട്ടിൻപുറങ്ങൾ’ ഈ വ്യത്യാസം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸ τοῦ πάσχα
  choice: പെസഹയ്ക്കുമുമ്പ്
  rationale: സമയബന്ധം ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: തങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കാൻ
  rationale: ἵνα സഹിതമുള്ള ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തമായി നൽകുകയും ἁγνίζω എന്നതിന്റെ ശുദ്ധീകരണാർഥം മുഖ്യപാഠത്തിൽ അമിതമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പെസഹയ്ക്കുമുമ്പുള്ള ശുദ്ധീകരണത്തിന്റെ സ്വഭാവം
  choice: ‘തങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കാൻ’ എന്ന് നൽകി, ആചാരപരമായ പശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘ആചാരപരമായി തങ്ങളെത്തന്നെ ശുദ്ധീകരിക്കാൻ’ അല്ലെങ്കിൽ ‘തങ്ങളെത്തന്നെ വിശുദ്ധീകരിക്കാൻ’
  rationale: സന്ദർഭം യെഹൂദരുടെ പെസഹാതീർഥാടനത്തിനുള്ള ആചാരപരമായ ഒരുക്കമാണ്. മുഖ്യപാഠത്തിൽ പിന്നീട് രൂപപ്പെട്ട sacramental അഥവാ ആന്തരിക ധാർമിക വിഭാഗങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്കിന്റെ പൊതുവായ പദപ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെഹൂദന്മാരുടെ പെസഹ’ എന്ന സ്രോതസ്സിനോടടുത്ത ഘടനയും ‘കയറിപ്പോയി’ എന്ന യാത്രാസൂക്ഷ്മതയും നിലനിർത്തിയപ്പോൾ, ആചാരപരമായ വിശദീകരണം വായനാസൗകര്യത്തിനായി അടിക്കുറിപ്പിലാക്കി.
