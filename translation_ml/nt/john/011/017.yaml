  terminology: “കല്ലറ” is an appropriate modern rendering of μνημεῖον in this context. “യേശു എത്തിച്ചേർന്നപ്പോൾ” naturally renders the temporal participle Ἐλθών, and “അങ്ങനെ” adequately carries the narrative connective οὖν.
