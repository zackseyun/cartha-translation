  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ml
  text: അങ്ങനെ, യേശു എത്തിച്ചേർന്നപ്പോൾ, ലാസർ കല്ലറയിൽ ആയിട്ട് ഇതിനകം നാലു ദിവസം കഴിഞ്ഞിരുന്നു എന്നു കണ്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: യേശു വന്നപ്പോൾ
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ കാലബന്ധം ‘വന്നപ്പോൾ’ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: ഇവിടെ οὖν ശക്തമായ നിഗമനത്തെക്കാൾ മുൻവിവരണവുമായി സംഭവത്തെ ബന്ധിപ്പിക്കുന്ന ആഖ്യാനസംയോജകമാണ്; ‘അങ്ങനെ’ ആ പ്രവാഹം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εὗρεν
  choice: അറിഞ്ഞു
  rationale: εὑρίσκω ഇവിടെ നേരിട്ട് കണ്ടെത്തുക എന്നതിലുപരി, എത്തിച്ചേർന്നപ്പോൾ ഒരു സ്ഥിതി മനസ്സിലാക്കുക എന്ന അർഥത്തിലാണ്. ‘അറിഞ്ഞു’ മലയാളത്തിൽ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτὸν
  choice: ലാസർ
  rationale: ഗ്രീക്കിലെ സർവനാമം മുൻസന്ദർഭത്തിലെ ലാസറിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അവലംബം വ്യക്തമായി നിലനിർത്താൻ പേര് ആവർത്തിക്കുന്നു.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: ആയിട്ട് ഇതിനകം നാലു ദിവസം കഴിഞ്ഞതായി
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇതിനകം നാലു ദിവസം ഉള്ളവനായി’ എന്ന ഘടന, കല്ലറയിൽ അടക്കപ്പെട്ടതുമുതലുള്ള കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം ἤδη എന്നതും കഴിഞ്ഞ കാലദൈർഘ്യവും സംരക്ഷിക്കുന്നു.
- source_word: μνημείῳ
  choice: കല്ലറയിൽ
  rationale: μνημεῖον ഇവിടെ മൃതദേഹം വെച്ചിരുന്ന ശവകുടീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ ആധുനിക മലയാളത്തിൽ ‘കല്ലറ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: αὐτόν എന്ന സർവനാമത്തിന്റെ അവലംബം വ്യക്തമാക്കൽ
  choice: ‘ലാസർ’ എന്നു പേരെടുത്തുപറയുന്നു.
  alternative: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തുക.
  rationale: ഗ്രീക്കിൽ അവലംബം മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്. മലയാളത്തിൽ ഒറ്റവാക്യമായും വ്യക്തത ലഭിക്കാൻ പേര് ഉപയോഗിക്കുന്നത് പുതിയ വിവരം ചേർക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആഖ്യാനബന്ധവും കാലദൈർഘ്യവും സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
