translation:
  language: ml
  text: 'അപ്പോൾ യേശു അവരോടു വ്യക്തമായി പറഞ്ഞു: “ലാസർ മരിച്ചിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
