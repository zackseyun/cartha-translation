lexical_decisions:
- source_word: τότε οὖν
  choice: അപ്പോൾ
  rationale: τότε എന്നതിന്റെ കാലക്രമസൂചനയും οὖν എന്നതിന്റെ സന്ദർഭാനുസൃതമായ പരിണാമ/സംക്രമണഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു ... പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘അവരോടു പറഞ്ഞു’ എന്ന ഘടന നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: παρρησίᾳ
  choice: വ്യക്തമായി
  rationale: മുമ്പത്തെ ‘ഉറക്കം’ എന്ന പരോക്ഷപ്രയോഗത്തിനു വിരുദ്ധമായി, ഇവിടെ യേശു കാര്യം മറയില്ലാതെയും സംശയത്തിന് ഇടയില്ലാതെയും പറയുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Λάζαρος
  choice: ലാസർ
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ സ്ഥാപിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചിരിക്കുന്നു
  rationale: അയോറിസ്റ്റ് സൂചിപ്പിക്കുന്ന മരണസംഭവത്തെയും ആ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘മരിച്ചു’ എന്നതും സാധ്യമാണ്.
theological_decisions:
- issue: ലാസറിന്റെ അവസ്ഥയെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രസ്താവന
  choice: ശാരീരികമരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രസ്താവന
  alternative: മുമ്പത്തെ ‘ഉറക്കം’ എന്ന രൂപകം തുടരുക
  rationale: ἀπέθανεν എന്ന ക്രിയ ഉപയോഗിച്ച് മൂലപാഠം തന്നെ മുമ്പത്തെ രൂപകത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു; അതിനാൽ ഇവിടെ അവ്യക്തത നിലനിർത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. നേരിട്ടുള്ള ഉദ്ധരണിയും മൂലത്തിലെ വ്യക്തതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
