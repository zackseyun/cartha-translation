id: JHN.11.11
reference: John 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: ml
  text: 'ഇവ പറഞ്ഞശേഷം അവൻ അവരോടു പറഞ്ഞു: “നമ്മുടെ സുഹൃത്ത് ലാസർ ഉറങ്ങിപ്പോയിരിക്കുന്നു[a]. എന്നാൽ അവനെ ഉണർത്താൻ ഞാൻ പോകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: “മരിച്ചിരിക്കുന്നു.” ഇവിടെ യേശു മരണത്തെ സൂചിപ്പിക്കാൻ ഉറക്കം എന്ന രൂപകം ഉപയോഗിക്കുന്നു; തുടർന്നുള്ള വാക്യങ്ങളിൽ ശിഷ്യന്മാർ ആദ്യം അത് തെറ്റിദ്ധരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπεν … μετὰ τοῦτο
  choice: ഇവ പറഞ്ഞശേഷം
  rationale: മുൻപ്രസംഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനമായ ταῦταയും തുടർച്ച കാണിക്കുന്ന μετὰ τοῦτοയും സ്വാഭാവികമായ മലയാള കാലക്രമവാക്യത്തിൽ ചേർത്തു; മുൻപ് പറഞ്ഞ കാര്യങ്ങളുടെ ബഹുവചനസൂചന നിലനിർത്തുന്നു.
- source_word: λέγει αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാള ആഖ്യാനശൈലിക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകി.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: നമ്മുടെ സുഹൃത്ത് ലാസർ
  rationale: ബന്ധത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κεκοίμηται
  choice: ഉറങ്ങിപ്പോയിരിക്കുന്നു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന ഉറക്കത്തിന്റെ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു; perfect രൂപത്തിലെ സംഭവിച്ച അവസ്ഥയുടെ ഇപ്പോഴത്തെ ഫലവും മലയാളപ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: ἀλλὰ πορεύομαι
  choice: എന്നാൽ … ഞാൻ പോകുന്നു
  rationale: ലാസറിന്റെ അവസ്ഥയും യേശുവിന്റെ ഉദ്ദേശ്യപൂർവമായ യാത്രയും തമ്മിലുള്ള വൈരുധ്യവും വർത്തമാനഭാവവും നിലനിർത്തുന്നു.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: അവനെ ഉണർത്താൻ
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാള infinitive ഘടനയിൽ നൽകുകയും ഉറക്കരൂപകവുമായി ബന്ധമുള്ള ‘ഉണർത്തുക’ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κεκοίμηται എന്നത് ‘മരിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തണമോ, ഉറക്കരൂപകം നിലനിർത്തണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഉറങ്ങിപ്പോയിരിക്കുന്നു’ എന്ന് രൂപകം നിലനിർത്തി
  alternative: ‘മരിച്ചിരിക്കുന്നു’
  rationale: യേശുവിന്റെ രൂപകപ്രയോഗത്തെ ശിഷ്യന്മാർ തുടർന്നുള്ള വാക്യങ്ങളിൽ ആദ്യം തെറ്റിദ്ധരിക്കുന്നു. അതിനാൽ ‘മരിച്ചു’ എന്നു മുൻകൂട്ടി വ്യക്തമാക്കാതെ ആഖ്യാനത്തിലെ അർത്ഥസംഘർഷവും ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉറങ്ങിപ്പോയിരിക്കുന്നു’–‘ഉണർത്താൻ’ എന്ന പദബന്ധം മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായ രൂപകബന്ധം നിലനിർത്തുന്നു.
