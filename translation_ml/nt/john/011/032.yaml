id: JHN.11.32
reference: John 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: ml
  text: 'അങ്ങനെ മറിയ യേശു ഉണ്ടായിരുന്നിടത്ത് എത്തി അവനെ കണ്ടപ്പോൾ, അവന്റെ കാൽക്കൽ വീണു അവനോടു പറഞ്ഞു: “കർത്താവേ, അങ്ങ് ഇവിടെ ഉണ്ടായിരുന്നെങ്കിൽ എന്റെ സഹോദരൻ മരിക്കുകയില്ലായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതിയും ബന്ധവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὡς ἦλθεν
  choice: എത്തിയപ്പോൾ
  rationale: ὡς സഹിതമുള്ള aorist ക്രിയ ഇവിടെ സമയസാഹചര്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എത്തിയപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: യേശു ഉണ്ടായിരുന്നിടത്ത്
  rationale: സ്ഥലസൂചക ഉപവാക്യത്തിന്റെ അർഥം അധികവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἰδοῦσα αὐτόν
  choice: അവനെ കണ്ടപ്പോൾ
  rationale: സാഹചര്യസൂചക participle പ്രധാനപ്രവൃത്തിയോടു ചേർന്ന സമയബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: അവന്റെ കാൽക്കൽ വീണ്
  rationale: ഒരാളുടെ പാദങ്ങൾക്കൽ വീഴുക എന്ന ഭാവം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: λέγουσα αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: പ്രസംഗം പരിചയപ്പെടുത്തുന്ന participle മലയാളത്തിലെ സ്വാഭാവിക തുടർക്രിയയായി പരിഭാഷപ്പെടുത്തി.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്നതിന്റെ പതിവ് ബൈബിൾപരമായ അഭിസംബോധന നിലനിർത്തുകയും വെറും ആദരസൂചകതയിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰ ἦς ὧδε
  choice: അങ്ങ് ഇവിടെ ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: കഴിഞ്ഞകാലത്തിലെ യാഥാർഥ്യവിരുദ്ധ നിബന്ധന മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: മരിക്കുകയില്ലായിരുന്നു
  rationale: οὐκ ἄν സഹിതമുള്ള aorist സൂചിപ്പിക്കുന്ന കഴിഞ്ഞകാല യാഥാർഥ്യവിരുദ്ധ ഫലം കൃത്യമായി നൽകുന്നു.
- source_word: μου ὁ ἀδελφός
  choice: എന്റെ സഹോദരൻ
  rationale: μου എന്ന സ്വത്തുബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടുള്ള മറിയയുടെ κύριε എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ഈ പദത്തിന് ആദരസൂചക അഭിസംബോധന എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും, ‘കർത്താവേ’ യോഹന്നാന്റെ സുവിശേഷത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം നഷ്ടപ്പെടുത്താതെ അവ്യക്തത സംരക്ഷിക്കുന്നു; അതിനെ പൂർണമായ വിശ്വാസപ്രഖ്യാപനമായി അധികമായി നിർവചിക്കുന്നുമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; വാക്യഘടന ഉറവിടത്തിലെ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
