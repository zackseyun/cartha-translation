id: JHN.11.21
reference: John 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: ml
  text: 'അപ്പോൾ മാർത്ത യേശുവിനോടു പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് ഇവിടെ ഉണ്ടായിരുന്നെങ്കിൽ എന്റെ സഹോദരൻ മരിക്കുമായിരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ κύριε എന്ന പദം ബഹുമാനപൂർവമായ ഒരു സംബോധനയായും ഉപയോഗിക്കാം; ‘കർത്താവേ’ എന്ന പരിഭാഷ യോഹന്നാന്റെ സുവിശേഷത്തിൽ അതിനുണ്ടാകാവുന്ന ദൈവശാസ്ത്രപരമായ അർഥവും നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ചയും മുൻസന്ദർഭവുമായുള്ള ബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘അതുകൊണ്ട്’ എന്നത് ആവശ്യത്തിലധികം ശക്തമായ നിഗമനഭാവം നൽകാം.
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: യേശുവിനോടു പറഞ്ഞു
  rationale: സംസാരക്രിയയും അതിന്റെ അഭിസംബോധിതനെയും മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ബഹുമാനപൂർവമായ സംബോധനയും യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഉണ്ടാകാവുന്ന ദൈവശാസ്ത്രപരമായ ഭാരവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: εἰ ἦς ὧδε
  choice: അങ്ങ് ഇവിടെ ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: കഴിഞ്ഞകാലത്തെ യാഥാർഥ്യവിരുദ്ധമായ നിബന്ധന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘അങ്ങ്’ ബഹുമാനസൂചകമായ ഏകവചനമാണ്.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: മരിക്കുമായിരുന്നില്ല
  rationale: യാഥാർഥ്യവിരുദ്ധമായ കഴിഞ്ഞകാല നിബന്ധനയുടെ സംഭവിക്കാതിരുന്ന ഫലം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: ὁ ἀδελφός μου
  choice: എന്റെ സഹോദരൻ
  rationale: ഇവിടെ മാർത്തയുടെ ആൺസഹോദരനായ ലാസറിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ നേരിട്ടുള്ള കുടുംബബന്ധപദം ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριε എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവേ
  alternative: ബഹുമാനപൂർവമായ ഒരു സാധാരണ സംബോധനയായി മനസ്സിലാക്കാം
  rationale: ‘കർത്താവേ’ എന്നത് ബഹുമാനത്തെയും സാധ്യമായ ക്രിസ്തുശാസ്ത്രപരമായ അർഥത്തെയും നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യം മാത്രം ആ ദൈവശാസ്ത്രപരമായ അർഥം നിർബന്ധിതമാക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംഭാഷണത്തിലെ ബഹുമാനം സൂചിപ്പിക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു; അനാവശ്യമായി പുരാതനമോ സഭാവിഭാഗസവിശേഷമോ ആയ ഭാഷ ഒഴിവാക്കി.
