id: JHN.11.37
reference: John 11:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: ml
  text: 'എന്നാൽ അവരിൽ ചിലർ പറഞ്ഞു: “അന്ധന്റെ കണ്ണുകൾ തുറന്ന ഈ മനുഷ്യന്, ഇവൻ മരിക്കാതിരിക്കാൻ ഇടയാക്കാനും കഴിയുമായിരുന്നില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: എന്നാൽ അവരിൽ ചിലർ
  rationale: τινές ἐξ αὐτῶν എന്നത് സ്വാഭാവികമായി ‘അവരിൽ ചിലർ’ എന്നും, δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: εἶπαν
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ aorist indicative ലളിതമായ ഭൂതകാലമായി നൽകി.
- source_word: Οὐκ ἐδύνατο
  choice: കഴിയുമായിരുന്നില്ലേ?
  rationale: ഭൂതകാലത്തിലെ കഴിവിനെക്കുറിച്ചുള്ള വിമർശനധ്വനിയുള്ള അലങ്കാരചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: അന്ധന്റെ കണ്ണുകൾ തുറന്ന ഈ മനുഷ്യന്
  rationale: ആദ്യത്തെ οὗτος യേശുവിനെ ചൂണ്ടിക്കാട്ടുന്ന ഭാവം ‘ഈ മനുഷ്യൻ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; articular participle ബന്ധവാക്യസമാനമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ποιῆσαι ἵνα
  choice: ഇടയാക്കാനും
  rationale: ποιέω + ἵνα ഇവിടെ ഫലമുണ്ടാക്കുക എന്ന causative അർഥം നൽകുന്നു; മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: καὶ οὗτος μὴ ἀποθάνῃ
  choice: ഇവൻ മരിക്കാതിരിക്കാൻ
  rationale: καίയിലെ ‘കൂടി/also’ എന്ന ആശയം ‘-ആനും’ എന്ന ചേർക്കലിൽ ഉൾപ്പെടുത്തി; രണ്ടാമത്തെ οὗτος ലാസറിനെ ചൂണ്ടിക്കാട്ടുന്നതിനാൽ ‘ഇവൻ’ എന്നു നൽകി.
theological_decisions:
- issue: സംസാരിക്കുന്നവരുടെ ചോദ്യത്തിന്റെ ഭാവം
  choice: യേശുവിന് ലാസറിന്റെ മരണം തടയാൻ കഴിയുമായിരുന്നുവെന്ന പ്രതീക്ഷ ഉൾക്കൊള്ളുന്ന വിമർശനധ്വനിയുള്ള അലങ്കാരചോദ്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: വെറും നിഷ്പക്ഷമായ വിവരാന്വേഷണചോദ്യമായി നൽകുക.
  rationale: Οὐκ ἐδύνατο എന്ന നിഷേധചോദ്യരൂപം പ്രതീക്ഷയും പരോക്ഷമായ വിമർശനവും സൂചിപ്പിക്കുന്നു; വാചകത്തിൽ ഇല്ലാത്ത കുറ്റാരോപണം ചേർക്കാതെ ആ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഈ മനുഷ്യൻ’ യേശുവിനെയും ‘ഇവൻ’ ലാസറിനെയും വേർതിരിച്ച് കാണിക്കുന്നു. പ്രത്യേക സമുദായപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
