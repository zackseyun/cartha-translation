  to: 'അവൾ അവനോടു പറഞ്ഞു: “അതേ, കർത്താവേ; അങ്ങാണ് മശീഹാ[a], ദൈവപുത്രൻ, ലോകത്തിലേക്കു വരുന്നവൻ[b] എന്നു ഞാൻ വിശ്വസിച്ചിരിക്കുന്നു.”'
  rationale: മുഖ്യവാക്യത്തിലെ പ്രത്യേകമായി ശക്തമായ ‘തന്നെ’ ഒഴിവാക്കി ഗ്രീക്കിന്റെ അർഥവും മലയാളത്തിലെ ആദരപൂർവ സ്വാഭാവികതയും നിലനിർത്തി. b അടിക്കുറിപ്പിലെ അസ്വാഭാവിക വൈകല്പികവാചകം സ്വാഭാവികമായ മലയാളരൂപത്തിലേക്കു തിരുത്തി; വാക്യത്തിന്റെ അർഥത്തിൽ മാറ്റമില്ല.
