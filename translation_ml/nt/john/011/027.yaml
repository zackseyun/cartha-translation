  source_fidelity: 'വാക്യത്തിന്റെ പ്രധാന അർഥം കൃത്യമായി കൈമാറുന്നു: മാർത്ത യേശുവിനെ മശീഹാ, ദൈവപുത്രൻ, ലോകത്തിലേക്കു വരുന്നവൻ എന്നു പ്രഖ്യാപിക്കുന്നു. πεπίστευκα-യുടെ ഫലാവസ്ഥാപരമായ പൂർണകാലം ‘വിശ്വസിച്ചിരിക്കുന്നു’ എന്നതിൽ നന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ‘അങ്ങുതന്നെയാണ്’ എന്നതിലെ ‘തന്നെ’ ഗ്രീക്കിലെ σὺ-യുടെ നിർബന്ധമായ അർഥത്തേക്കാൾ ശക്തമായ പ്രത്യേക-തിരിച്ചറിയൽ സൂചന നൽകാം; ആദരസൂചകമായ ‘അങ്ങാണ്’ മതിയാകുന്നു.'
  naturalness: മുഖ്യവാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. നിലവിലെ b അടിക്കുറിപ്പിലെ “ലോകത്തിലേക്കു വരുന്നത് ആരോ, ആ വ്യക്തി” എന്ന പ്രയോഗം അസ്വാഭാവികവും വാക്യത്തിന്റെ ഗൗരവമുള്ള ശൈലിക്ക് യോജിക്കാത്തതുമാണ്.
  terminology: ‘കർത്താവേ,’ ‘മശീഹാ,’ ‘ദൈവപുത്രൻ,’ ‘ലോകം’ എന്നിവ യോജിച്ചും സ്ഥിരതയോടെയും ഉപയോഗിച്ചിട്ടുണ്ട്. ‘മശീഹാ’യ്ക്കു ‘ക്രിസ്തു’ എന്ന വൈകല്പികവായന നൽകുന്ന a അടിക്കുറിപ്പ് ഉചിതമാണ്.
