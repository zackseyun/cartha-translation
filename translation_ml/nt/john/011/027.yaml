id: JHN.11.27
reference: John 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: ml
  text: 'അവൾ അവനോടു പറഞ്ഞു: “അതേ, കർത്താവേ; അങ്ങാണ് മശീഹാ[a], ദൈവപുത്രൻ, ലോകത്തിലേക്കു വരുന്നവൻ[b] എന്നു ഞാൻ വിശ്വസിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ക്രിസ്തു.” Χριστός (ക്രിസ്റ്റോസ്) എന്ന ഗ്രീക്കുപദം ഇവിടെ ഒരു പദവിയായതിനാൽ അതിന്റെ അർഥം നിലനിർത്താൻ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ “ലോകത്തിലേക്കു വരുന്ന ആൾ.” ഗ്രീക്കിലെ ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപം “ലോകത്തിലേക്കു വരുന്നവൻ” എന്നോ, കൂടുതൽ വ്യക്തമായി ഒരു ബന്ധവാക്യരൂപത്തിലോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: അവൾ അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ് രൂപമെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു. സന്ദർഭത്തിൽനിന്ന് കർത്താവ് മാർത്തയാണെന്നതിനാൽ ‘അവൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: Ναί
  choice: അതേ
  rationale: സംഭാഷണത്തിലെ നേരിട്ടുള്ള സമ്മതം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: വെറും ആദരസൂചകമായ ‘യജമാനനേ’ എന്നതിനെക്കാൾ, തുടർന്നുവരുന്ന വിശ്വാസപ്രഖ്യാപനത്തിന്റെ ഭക്ത്യാദരവും ദൈവശാസ്ത്രപരമായ ഭാരവും ‘കർത്താവേ’ നിലനിർത്തുന്നു.
- source_word: ἐγὼ πεπίστευκα
  choice: ഞാൻ വിശ്വസിച്ചിരിക്കുന്നു
  rationale: πεπίστευκα എന്ന പൂർണകാലരൂപം മുമ്പ് രൂപപ്പെട്ടതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഉറച്ച വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. ἐγώയുടെ ഊന്നൽ ‘ഞാൻ’ എന്നു നിലനിർത്തി.
- source_word: ὅτι σὺ εἶ
  choice: അങ്ങുതന്നെയാണ് … എന്നു
  rationale: ὅτι വിശ്വാസത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; σὺയിലെ ഊന്നൽ ആദരപൂർവമായ ‘അങ്ങുതന്നെയാണ്’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെയല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; അതിനാൽ അർഥവും യഹൂദ പശ്ചാത്തലവും നിലനിർത്തുന്ന ‘മശീഹാ’ തെരഞ്ഞെടുത്തു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: നിശ്ചിതവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ ഈ ക്രിസ്തുശാസ്ത്ര പദവിയുടെ പതിവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: ലോകത്തിലേക്കു വരുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ നാമസ്വഭാവവും പ്രതീക്ഷിക്കപ്പെട്ടുവരുന്നവൻ എന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: κόσμον
  choice: ലോകം
  rationale: പുത്രൻ പ്രവേശിക്കുന്ന മനുഷ്യജീവിതത്തിന്റെ ലോകത്തെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: വിശ്വാസപ്രഖ്യാപനത്തിലെ Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ഔപചാരിക പ്രഖ്യാപനമായതിനാൽ, രാജകീയവും വീണ്ടെടുപ്പുസംബന്ധവുമായ ‘അഭിഷിക്തൻ’ എന്ന പശ്ചാത്തലം വ്യക്തമാക്കുന്ന പദവിരൂപം ഉപയോഗിച്ചു.
- issue: മാർത്തയുടെ അഭിസംബോധനയിലെ κύριε എന്നതിന്റെ ശക്തി
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: തൊട്ടുപിന്നാലെയുള്ള മശീഹാ-ദൈവപുത്ര പ്രഖ്യാപനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഭക്ത്യാദരവും ദൈവശാസ്ത്രപരമായ സാധ്യതയും സംരക്ഷിക്കുന്നു; എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത കൂടുതൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: πεπίστευκα എന്ന പൂർണകാലത്തിന്റെ ദൃഷ്ടിഭാവം
  choice: ഞാൻ വിശ്വസിച്ചിരിക്കുന്നു
  alternative: ഞാൻ വിശ്വസിക്കുന്നു
  rationale: മുമ്പ് ഉണ്ടായ വിശ്വാസവും അതിന്റെ ഇപ്പോഴത്തെ നിലനിൽക്കുന്ന ഫലവും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ പൂർണകാലത്തിന്റെ ഫലാവസ്ഥാപരമായ ശക്തി നിലനിർത്തി.
- issue: ὁ ἐρχόμενος എന്ന പ്രയോഗത്തിന്റെ മശീഹാപരമായ സൂചന
  choice: വരുന്നവൻ
  alternative: വരുന്ന ആൾ
  rationale: പ്രതീക്ഷിക്കപ്പെട്ട ‘വരുന്നവൻ’ എന്ന പദവിസദൃശമായ അനുരണനം നിലനിർത്തുകയും അതിനെ വ്യാഖ്യാനിച്ച് കൂടുതൽ നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘അങ്ങ്/അങ്ങുതന്നെ’ ആദരവും ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ഊന്നലും ഒരുമിച്ച് വഹിക്കുന്നു. ദൈവശാസ്ത്രപദവികൾ പരിചിതവും ഗൗരവമുള്ളതുമായ രൂപത്തിൽ നിലനിർത്തി; സ്രോതസ്സിലെ പൂർണകാലവും കൃദന്തരൂപവും അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ സംരക്ഷിച്ചു.
