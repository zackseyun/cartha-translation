id: JHN.11.51
reference: John 11:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: ml
  text: അവൻ ഇത് സ്വന്തമായി പറഞ്ഞതല്ല[a]; എന്നാൽ ആ വർഷം മഹാപുരോഹിതനായിരുന്നതിനാൽ, യേശു ജനതയ്ക്കുവേണ്ടി[c] മരിക്കാനിരിക്കുകയാണെന്ന്[b] അവൻ പ്രവചിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം മുൻകൈയാൽ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മരിക്കാൻ പോകുകയാണെന്ന്’; ‘മരിക്കാൻ വിധിക്കപ്പെട്ടിരിക്കുകയാണെന്ന്’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ജനതയുടെ പേരിൽ’.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ ... οὐκ εἶπεν
  choice: അവൻ ഇത് ... പറഞ്ഞതല്ല
  rationale: δέയുടെ മൃദുവായ ബന്ധകസ്വഭാവം മലയാള വാക്യപ്രവാഹത്തിൽ വിരാമചിഹ്നവും തുടർന്നുള്ള ‘എന്നാൽ’ എന്ന വൈരുധ്യബന്ധകവും വഴി വ്യക്തമാകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: ἀφ’ ἑαυτοῦ
  choice: സ്വന്തമായി
  rationale: വാക്കുകളുടെ ഉറവിടം അവനിൽത്തന്നെയല്ലെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘സ്വന്തം മുൻകൈയാൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: എന്നാൽ ആ വർഷത്തെ മഹാപുരോഹിതനായിരുന്നതിനാൽ
  rationale: ὢν എന്ന പങ്കുപദത്തിന്റെ പശ്ചാത്തലപരവും സാഹചര്യപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു; കാരണബന്ധം സന്ദർഭത്തിൽ സൂചിതമായതിനാൽ ‘ആയിരുന്നതിനാൽ’ സ്വാഭാവികമാണ്, എന്നാൽ പദവി ദൈവിക അംഗീകാരമാണെന്ന അധികവാദം ചേർക്കുന്നില്ല.
- source_word: ἐπροφήτευσεν
  choice: അവൻ പ്രവചിച്ചു
  rationale: യോഹന്നാൻ വ്യക്തമായി ഉപയോഗിക്കുന്ന പ്രവചനക്രിയയുടെ ദൈവശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുന്നു; കയ്യഫാവിന്റെ ബോധമോ ധാർമികനിലയോ സംബന്ധിച്ച് ഒന്നും കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: മരിക്കാനിരിക്കുകയാണെന്ന്
  rationale: μέλλωയും അനന്തക്രിയയും നൽകുന്ന ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്നതിന്റെ അർത്ഥം പ്രകടിപ്പിക്കുന്നു; നിർബന്ധിത വിധി എന്ന ആശയം അമിതമായി ചുമത്തുന്നില്ല.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: ജനതയ്ക്കുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ ഗുണകരവും പ്രതിനിധാനപരവുമായ വിശാലത നിലനിർത്തുന്നു; സാങ്കേതികമായ ഒരു പ്രായശ്ചിത്തസൂത്രത്തിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല. ἔθνος ഇവിടെ സന്ദർഭത്തിലെ യഹൂദജനതയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കയ്യഫാവിന്റെ വാക്കുകൾ പ്രവചനമായതിന്റെ സ്വഭാവം
  choice: മഹാപുരോഹിതനായിരുന്ന സാഹചര്യത്തിൽ അവൻ പ്രവചിച്ചുവെന്ന് വാക്യം പറയുന്നതുപോലെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: അവൻ ബോധപൂർവം ദൈവിക പ്രചോദനത്തിൽ പ്രവചിച്ചു; അല്ലെങ്കിൽ ഇത് പ്രവചനമല്ല, യോഹന്നാന്റെ പരിഹാസം മാത്രമാണ്.
  rationale: മൂലപാഠം ‘അവൻ പ്രവചിച്ചു’ എന്ന് വ്യക്തമായി പറയുന്നു. എന്നാൽ അവന്റെ ആന്തരിക ബോധം, നീതി, അല്ലെങ്കിൽ പ്രചോദനത്തിന്റെ സമ്പൂർണ സിദ്ധാന്തം എന്നിവ വാക്യം നിർവചിക്കുന്നില്ല.
- issue: യേശുവിന്റെ മരണവുമായി ബന്ധപ്പെട്ട ὑπέρ എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: ‘ജനതയ്ക്കുവേണ്ടി’ എന്ന വിശാലമായ ഗുണകര/പ്രതിനിധാനപര പ്രയോഗം.
  alternative: ‘ജനതയുടെ പ്രതിനിധിയായി’ അല്ലെങ്കിൽ ‘ജനതയ്ക്കുപകരം’.
  rationale: ഈ സന്ദർഭത്തിൽ ὑπέρ പ്രതിനിധാനപരമോ ഗുണകരമോ ആയ ഭാവം വഹിക്കാം. ‘പകരം’ എന്ന കൂടുതൽ സാങ്കേതിക വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘മഹാപുരോഹിതൻ’, ‘പ്രവചിച്ചു’, ‘ജനത’ എന്നീ സഭാപരിചിതവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനവ്യാപ്തിയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
