id: JHN.11.10
reference: John 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: ml
  text: എന്നാൽ ആരെങ്കിലും രാത്രിയിൽ നടന്നാൽ, അവൻ ഇടറുന്നു; കാരണം വെളിച്ചം അവനിൽ ഇല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെളിച്ചം അവനോടുകൂടെ ഇല്ല.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “അവനിൽ” എന്നാണ്; ഇത് ബാഹ്യവെളിച്ചത്തിന്റെ അഭാവത്തേക്കാൾ കൂടുതലിനെ സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: എന്നാൽ ... നടന്നാൽ
  rationale: δέയുടെ വൈരുധ്യസൂചനയും ἐάν ചേർന്ന നിബന്ധനാർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിതവും പൊതുവായി ഏവർക്കും ബാധകവുമായ അർഥം നൽകുന്നു.
- source_word: περιπατῇ
  choice: നടന്നാൽ
  rationale: നടക്കുക എന്ന നേർചിത്രം നിലനിർത്തുന്നതോടൊപ്പം അതിന്റെ സാധ്യതയുള്ള രൂപകാലങ്കാരാർഥവും തുറന്നുവെക്കുന്നു.
- source_word: ἐν τῇ νυκτί
  choice: രാത്രിയിൽ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി രാത്രിസമയത്തെ സൂചിപ്പിക്കുകയും വെളിച്ചം–ഇരുട്ട് ചിത്രണം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προσκόπτει
  choice: ഇടറുന്നു
  rationale: ശാരീരികമായി തട്ടിവീഴുന്നതും രൂപകാലങ്കാരമായി തെറ്റിപ്പോകുന്നതും ഒരുപോലെ സൂചിപ്പിക്കാൻ കഴിയുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇടറുന്നതിനുള്ള കാരണത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട വെളിച്ചം–രാത്രി ചിത്രണം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: അവനിൽ ഇല്ല
  rationale: ഗ്രീക്കിലെ ἐν എന്ന അകത്തുള്ളതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തി, ബാഹ്യവെളിച്ചത്തിന്റെ അഭാവവും ആന്തരിക ആത്മീയ സൂചനയും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷം പരിഹരിക്കാതെ വിടുന്നു.
theological_decisions:
- issue: “വെളിച്ചം അവനിൽ ഇല്ല” എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: “അവനിൽ ഇല്ല” എന്ന ആന്തരിക പ്രയോഗം നിലനിർത്തി.
  alternative: “വെളിച്ചം അവനോടുകൂടെ ഇല്ല” എന്ന സാഹചര്യപരമായ വായന.
  rationale: മൂലപാഠത്തിലെ ἐν αὐτῷ സാധാരണയായി “അവനിൽ” എന്നാണ്. യോഹന്നാന്റെ വെളിച്ചം–ഇരുട്ട് ഭാഷയിൽ ഇതിന് ബാഹ്യവും ആന്തരികവുമായ തലങ്ങൾ ഉണ്ടായേക്കാം; അതിനാൽ ഒന്നിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. “നടക്കുക,” “ഇടറുക,” “വെളിച്ചം അവനിൽ” എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യവും സാധ്യതയുള്ള ആത്മീയ ധ്വനിയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
