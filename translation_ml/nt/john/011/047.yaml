id: JHN.11.47
reference: John 11:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: ml
  text: 'അതിനാൽ മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും ഒരു ആലോചനാസഭ[a] വിളിച്ചുകൂട്ടി. അവർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “നാം എന്താണ് ചെയ്യുന്നത്? കാരണം, ഈ മനുഷ്യൻ അനേകം അടയാളങ്ങൾ ചെയ്യുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സൻഹെദ്രിൻ”; യെഹൂദരുടെ ഭരണസമിതി.
    reason: സ്ഥാപനപരമായ സാധ്യതയും പരമ്പരാഗത സാങ്കേതികനാമവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: συνήγαγον
  choice: വിളിച്ചുകൂട്ടി
  rationale: സഭയെ ഔദ്യോഗികമായി ഒരുമിച്ചുകൂട്ടിയെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: ലാസറിനെ ഉയിർപ്പിച്ച അടയാളത്തോടുള്ള തുടർപ്രതികരണവും അതിൽനിന്നുള്ള പരിണതിയും വ്യക്തമാക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: കർശനമായ അർഥത്തിൽ ഒന്നിലധികം മഹാപുരോഹിതന്മാരെയല്ല, പുരോഹിതനേതൃത്വത്തിലെ പ്രമുഖരെയാണ് ഈ ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: συνέδριον
  choice: ഒരു ആലോചനാസഭ
  rationale: ഒരു ഔദ്യോഗിക സമിതി/സഭ എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിലെ പദത്തെ നേരിട്ട് ‘സൻഹെദ്രിൻ’ എന്ന സാങ്കേതികനാമമായി മാത്രം നിർണ്ണയിക്കാതെ അതിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἔλεγον
  choice: ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിലെ തുടരുന്ന അഥവാ ആവർത്തിതമായ സംസാരഭാവം സംരക്ഷിക്കുന്നു.
- source_word: Τί ποιοῦμεν
  choice: നാം എന്താണ് ചെയ്യുന്നത്?
  rationale: വർത്തമാന നിർദേശകരൂപം അതേപടി സംരക്ഷിക്കുകയും അവരുടെ പരിഭ്രമവും നിർജ്ജീവതയെക്കുറിച്ചുള്ള ബോധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: …ചെയ്യുന്നല്ലോ
  rationale: മലയാളത്തിലെ ‘-ല്ലോ’ പ്രയോഗം അവരുടെ ചോദ്യത്തിനുള്ള കാരണമായ വ്യക്തമായ വസ്തുതയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; വേറിട്ട ‘കാരണം’ ചേർക്കേണ്ടതില്ല.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ഈ മനുഷ്യൻ
  rationale: യേശുവിനെക്കുറിച്ചുള്ള വക്താക്കളുടെ അകന്നുനിൽക്കുന്ന, അല്പം അവജ്ഞാസൂചകമായ പരാമർശഭാവം നിലനിർത്തുന്നു.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: അനേകം അടയാളങ്ങൾ പ്രവർത്തിക്കുന്നു
  rationale: വർത്തമാനകാലഭാവം നിലനിർത്തുന്നു; യോഹന്നാനിൽ യേശുവിന്റെ പ്രവൃത്തികൾ അവന്റെ വ്യക്തിത്വത്തിലേക്ക് വിരൽചൂണ്ടുന്നു എന്ന പ്രാധാന്യം ‘അത്ഭുതങ്ങൾ’ എന്നതിനെക്കാൾ ‘അടയാളങ്ങൾ’ നന്നായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ σημεῖα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടയാളങ്ങൾ
  alternative: അത്ഭുതങ്ങൾ / അത്ഭുതചിഹ്നങ്ങൾ
  rationale: പ്രവൃത്തികളുടെ അത്ഭുതസ്വഭാവം മാത്രമല്ല, യേശുവിന്റെ വ്യക്തിത്വത്തിലേക്ക് അവ വിരൽചൂണ്ടുന്ന വെളിപ്പെടുത്തൽസ്വഭാവവും ഈ പദം വഹിക്കുന്നു.
- issue: συνέδριον എന്ന പദത്തിന്റെ സ്ഥാപനപരമായ സൂചന
  choice: ഒരു ആലോചനാസഭ
  alternative: സൻഹെദ്രിൻ / ഭരണസമിതി
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പൊതുവായ അർഥം പ്രധാനവാചകത്തിൽ നൽകുന്നു; യെഹൂദ ഭരണസമിതിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു, അതുവഴി പാഠത്തിലെ യഥാർഥ പരിധിക്കപ്പുറം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നത് ഗ്രീക്ക് അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം നിലനിർത്തുന്നു. ‘പ്രവർത്തിക്കുന്നല്ലോ’ എന്ന പ്രയോഗം ὅτι നൽകുന്ന കാരണബന്ധം സംഭാഷണത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
