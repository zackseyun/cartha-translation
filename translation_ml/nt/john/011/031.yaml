id: JHN.11.31
reference: John 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: ml
  text: അപ്പോൾ വീട്ടിൽ അവളോടൊപ്പം ഉണ്ടായിരുന്നും അവളെ ആശ്വസിപ്പിച്ചുകൊണ്ടിരുന്ന യഹൂദർ[a], മറിയ പെട്ടെന്ന് എഴുന്നേറ്റ് പുറത്തേക്കു പോയത് കണ്ടപ്പോൾ, അവൾ അവിടെ കരയാൻ കല്ലറയിലേക്കു പോകുകയാണെന്ന് കരുതി അവളെ പിന്തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദ്യർ’ എന്നും വിവർത്തനം ചെയ്യാം. യോഹന്നാനിൽ Ἰουδαῖοι എന്ന പദം ചിലപ്പോൾ യെഹൂദ്യപ്രദേശത്തുകാരെയോ യഹൂദനേതൃത്വത്തെയോ കൂടുതൽ പരിമിതമായി സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അത് മറിയയോടൊപ്പം ദുഃഖാചരണത്തിൽ പങ്കെടുത്ത സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: അപ്പോൾ ... യഹൂദർ
  rationale: οὖν കഥയുടെ പുരോഗതിയും മുൻസന്ദർഭത്തിൽനിന്നുള്ള തുടർച്ചയും സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘അപ്പോൾ’ എന്നു വിവർത്തനം ചെയ്തു. Ἰουδαῖοι ഇവിടെ മറിയയോടൊപ്പം ദുഃഖാചരണത്തിൽ പങ്കെടുത്ത സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ നേരിട്ടുള്ള ‘യഹൂദർ’ നിലനിർത്തി, ഭൂമിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: വീട്ടിൽ അവളോടൊപ്പം ഇരുന്ന് അവളെ ആശ്വസിപ്പിച്ചുകൊണ്ടിരുന്ന
  rationale: ഗ്രീക്കിലെ വിശേഷണാത്മക കൃദന്തരൂപം ഏത് യഹൂദരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു. παραμυθέομαι ദുഃഖിതയെ ആശ്വസിപ്പിക്കുന്ന പ്രവൃത്തിയെന്ന നിലയിൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: പെട്ടെന്ന് എഴുന്നേറ്റ് പുറത്തേക്കു പോകുന്നതു
  rationale: ἀνέστη ഇവിടെ ഇരുന്നിടത്തുനിന്ന് എഴുന്നേൽക്കുന്നതാണ്, പുനരുത്ഥാനമല്ല. രണ്ടു പ്രവൃത്തികളുടെയും വേഗത്തിലുള്ള ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തി.
- source_word: ἠκολούθησαν αὐτῇ
  choice: അവളെ പിന്തുടർന്നു
  rationale: ഇവിടെ ἀκολουθέω ശാരീരികമായി പിന്നാലെ പോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ശിഷ്യത്വസംബന്ധമായ പ്രത്യേക അർഥം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല.
- source_word: δόξαντες
  choice: കരുതി
  rationale: അവർ കണ്ടതിൽനിന്ന് നടത്തിയ അനുമാനമാണ് δοκέωയുടെ കൃദന്തരൂപം പ്രകടിപ്പിക്കുന്നത്.
- source_word: εἰς τὸ μνημεῖον
  choice: കല്ലറയിലേക്കു
  rationale: യോഹന്നാനിലെ സംസ്കാരസന്ദർഭത്തിൽ μνημεῖον ഒരു ശവകുടീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായ ‘കല്ലറ’ തിരഞ്ഞെടുത്തു.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: അവിടെ കരയാൻ
  rationale: ἵναയും ഉപവിധിരൂപവും ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ചലനക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യപ്രയോഗമായി നൽകി.
theological_decisions:
- issue: യോഹന്നാന്റെ വിവരണത്തിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: യഹൂദർ—ഈ വാക്യത്തിൽ മറിയയോടൊപ്പം വീട്ടിലുണ്ടായിരുന്ന ദുഃഖാചരണസംഘം
  alternative: യെഹൂദ്യർ / യെഹൂദ്യനിവാസികൾ
  rationale: യോഹന്നാനിൽ Ἰουδαῖοι സന്ദർഭാനുസരിച്ച് മുഴുവൻ യഹൂദജനത്തെയോ യെഹൂദ്യപ്രദേശത്തുകാരെയോ നേതൃത്വത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ വാക്യംതന്നെ അവരെ മറിയയെ ആശ്വസിപ്പിച്ചിരുന്ന സന്നിഹിതസംഘമായി പരിമിതപ്പെടുത്തുന്നു; അതിനാൽ ഒരു വൈരാത്മകമോ സർവസമാവേശകമോ ആയ അർഥം ചുമത്താതെ നേരിട്ടുള്ള വിവർത്തനം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിന്റെ ദീർഘഘടന മലയാളത്തിൽ വായിക്കാൻ എളുപ്പമാകുന്ന വിധം ക്രമപ്പെടുത്തി; എന്നാൽ സംഭവക്രമം, അവരുടെ അനുമാനം, കരയാനുള്ള ഉദ്ദേശ്യം എന്നിവ സംരക്ഷിച്ചു.
