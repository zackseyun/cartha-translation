id: JHN.11.50
reference: John 11:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: ml
  text: ഒരു മനുഷ്യൻ ജനത്തിനുവേണ്ടി[a] മരിക്കുകയും ജനത മുഴുവൻ നശിച്ചുപോകാതിരിക്കുകയും ചെയ്യുന്നതാണ് നിങ്ങൾക്കു നല്ലതെന്ന് നിങ്ങൾ പരിഗണിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനത്തിന്റെ നന്മയ്ക്കായി’; ഈ പ്രയോഗത്തിന് ‘ജനത്തിനു പകരമായി’ എന്ന അർഥധ്വനിയും ഉണ്ടായേക്കാം.
    reason: ὑπέρ എന്ന പദത്തിന്റെ ഗുണാർത്ഥക, പ്രതിനിധിത്വ, പകരം എന്നീ അർഥസാധ്യതകൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: οὐδὲ
  choice: ഇതും ... ഇല്ല
  rationale: മുൻവാക്യത്തിലെ ശാസനയോടു മറ്റൊരു കുറ്റപ്പെടുത്തൽ കൂട്ടിച്ചേർക്കുന്ന ബന്ധക-നിഷേധബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λογίζεσθε
  choice: ആലോചിക്കുന്നില്ല
  rationale: കണക്കുകൂട്ടുക, യുക്തിചിന്ത നടത്തുക, പരിഗണിക്കുക എന്നീ അർഥങ്ങളിൽ ഇവിടെ സഭയുടെ പ്രായോഗിക ആലോചനയെ സൂചിപ്പിക്കുന്നു.
- source_word: συμφέρει ὑμῖν
  choice: നിങ്ങൾക്കു നല്ലത്
  rationale: സ്വന്തം പ്രയോജനത്തെ മുൻനിർത്തിയുള്ള താരതമ്യപരമായ ഗുണം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἵνα
  choice: '... ചെയ്യുന്നതാണ്'
  rationale: എന്താണ് പ്രയോജനകരമെന്ന ഉള്ളടക്കം മലയാളത്തിലെ നാമവാക്യഘടനയിലൂടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: εἷς ἄνθρωπος
  choice: ഒരാൾ
  rationale: ഒരു വ്യക്തി എന്ന ഏകവചനത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും മലയാളത്തിൽ ‘ഒരാൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἀποθάνῃ
  choice: മരിക്കുകയും
  rationale: ἵνα-വാക്യത്തിലെ സംഭവത്തെ അനാവശ്യമായി സാധ്യതയോ നിർബന്ധമോ ചേർക്കാതെ നേരിട്ട് പറയുന്നു.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: ജനത്തിനുവേണ്ടി
  rationale: ഗുണത്തിനായി, പ്രതിനിധിയായി, പകരമായി എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്ന വിശാലമായ പ്രയോഗം; കൈഫാവിന്റെ രാഷ്ട്രീയ ഉദ്ദേശവും യോഹന്നാന്റെ തുടർന്നുള്ള പ്രവചനാത്മക അർഥവും ഒരുമിച്ച് ഉൾക്കൊള്ളാൻ ഇടനൽകുന്നു.
- source_word: λαοῦ
  choice: ജനം
  rationale: ഇവിടെ യഹൂദജനത്തെ ഒരു സാമൂഹിക-ഉടമ്പടിസമൂഹമായി സൂചിപ്പിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ പദം.
- source_word: ὅλον τὸ ἔθνος
  choice: ജനത മുഴുവൻ
  rationale: രാഷ്ട്രീയ-വംശീയ സമഗ്രതയുള്ള ദേശീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘വിജാതീയർ’ എന്ന അർഥം ഇവിടെ പ്രസക്തമല്ല.
- source_word: ἀπόληται
  choice: നശിച്ചുപോകാതിരിക്കുകയും
  rationale: നാശം അല്ലെങ്കിൽ പൂർണമായ തകർച്ച എന്ന ഗൗരവം നിലനിർത്തുന്നു; നാശത്തിന്റെ പ്രത്യേക രീതി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ മരണവുമായി ബന്ധപ്പെട്ട ὑπέρ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘ജനത്തിനുവേണ്ടി’
  alternative: ‘ജനത്തിന്റെ നന്മയ്ക്കായി’ അല്ലെങ്കിൽ ‘ജനത്തിനു പകരമായി’
  rationale: കൈഫാവ് ഉടനടി രാഷ്ട്രീയ പ്രയോജനമാണ് ഉദ്ദേശിക്കുന്നത്; എന്നാൽ 11:51-ൽ സുവിശേഷകൻ ഈ വാക്കുകൾ അറിയാതെയുള്ള പ്രവചനമായി അവതരിപ്പിക്കുന്നു. ‘വേണ്ടി’ എന്ന വിശാലപ്രയോഗം പ്രതിനിധിത്വവും പകരമരണവും ഉൾപ്പെടെയുള്ള ധ്വനികൾ മുൻകൂട്ടി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ശാസനാഭാവവും പ്രായോഗിക സ്വാർത്ഥതയുടെ സൂചനയും നിലനിർത്തിയിരിക്കുന്നു; ‘ജനം’ എന്നും ‘ജനത’ എന്നും ഉള്ള വ്യത്യാസം λαός/ἔθνος വ്യത്യാസം സൂചിപ്പിക്കുന്നു.
