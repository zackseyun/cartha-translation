  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: ml
  text: ബേഥാന്യ യെരൂശലേമിന് അടുത്തായിരുന്നു—ഏകദേശം പതിനഞ്ച് സ്റ്റേഡിയ[a] അകലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഏകദേശം മൂന്ന് കിലോമീറ്റർ, അഥവാ രണ്ടു മൈലിനടുത്ത്.
    reason: പുരാതന ദൂരയളവിന് ആധുനിക ഏകദേശ തുല്യം നൽകുന്ന സാംസ്കാരിക കുറിപ്പ്.
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, വിവരണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ഈ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കുന്നത് അർഥത്തെ അമിതമാക്കും.
- source_word: Βηθανία
  choice: ബേഥാന്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: യെരൂശലേമിന് അടുത്തായിരുന്നു
  rationale: ἐγγύς സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ സാമീപ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: ഏകദേശം
  rationale: അളവിനോടൊപ്പം ὡς ഏകദേശത സൂചിപ്പിക്കുന്നു; ദൂരം കൃത്യമല്ലെന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: പതിനഞ്ച് സ്റ്റേഡിയ അകലെ
  rationale: മൂലപാഠത്തിലെ പുരാതന ദൂരയളവ് പ്രധാനവാചകത്തിൽ നിലനിർത്തുകയും ἀπό സൂചിപ്പിക്കുന്ന അകലത്തെ ‘അകലെ’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പുരാതന അളവായ ‘സ്റ്റേഡിയ’ പ്രധാനവാചകത്തിൽ സൂക്ഷിച്ച് വായനാസഹായിയായ ആധുനിക തുല്യം അടിക്കുറിപ്പിൽ നൽകി.
