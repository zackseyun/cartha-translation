id: JHN.11.1
reference: John 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: ml
  text: മറിയയുടെയും അവളുടെ സഹോദരിയായ മാർത്തയുടെയും ഗ്രാമമായ ബേഥാന്യയിൽനിന്നുള്ള ലാസർ എന്നൊരാൾ രോഗിയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: ആയിരുന്നു
  rationale: Ἦν എന്ന ഭൂതകാലക്രിയയെ ‘ആയിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി. δέ ഇവിടെ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമായതിനാൽ, മലയാളത്തിൽ കൃത്രിമമായ വിരോധമോ വ്യക്തമായ കാലസൂചനയോ ചേർക്കാതെ വാക്യഘടനയിലൂടെ അതിന്റെ പ്രവാഹം നിലനിർത്തി.
- source_word: τις
  choice: എന്നൊരാൾ
  rationale: അനിശ്ചിതനായെങ്കിലും നിർദിഷ്ടമായ ഒരു വ്യക്തിയെ പരിചയപ്പെടുത്തുന്ന τις-ന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നൊരാൾ’ നൽകുന്നു.
- source_word: ἀσθενῶν
  choice: രോഗിയായിരുന്നു
  rationale: ഇവിടെ പദം ശാരീരിക ബലഹീനതയെക്കാൾ രോഗാവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘രോഗിയായിരുന്നു’ ലളിതവും സന്ദർഭോചിതവുമാണ്.
- source_word: Λάζαρος
  choice: ലാസർ
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രീതിയിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἀπὸ Βηθανίας
  choice: ബേഥാന്യയിൽനിന്നുള്ള
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉറവിടം/ദേശം ‘യിൽനിന്നുള്ള’ എന്ന രൂപത്തിൽ നേരിട്ട് നിലനിർത്തി.
- source_word: ἐκ τῆς κώμης
  choice: ഗ്രാമമായ
  rationale: κώμη ഒരു ചെറുകുടിയിരിപ്പിനെയോ ഗ്രാമത്തെയോ സൂചിപ്പിക്കുന്നു. ആവർത്തനം ഒഴിവാക്കി, ബേഥാന്യയെ മറിയയുടെയും മാർത്തയുടെയും ഗ്രാമമായി തിരിച്ചറിയിക്കുന്ന സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ചു.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: മറിയയുടെയും അവളുടെ സഹോദരി മാർത്തയുടെയും
  rationale: αὐτῆς മറിയയെ സൂചിപ്പിക്കുന്നതിനാൽ മാർത്ത മറിയയുടെ സഹോദരിയാണെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തി; ജനിറ്റീവ് ബന്ധം ‘യുടെയും’ എന്ന രൂപത്തിൽ പ്രകടമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. മൂലത്തിലെ വിവരക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ സ്ഥലവിവരണം മുന്നിലാക്കി; അനാവശ്യമായ കാലസൂചകമോ ശക്തമായ വിരോധസൂചകമോ ചേർത്തിട്ടില്ല.
