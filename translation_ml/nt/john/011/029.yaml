  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പ്രധാനപാഠത്തിൽ സ്വാഭാവികത നിലനിർത്തി; ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
