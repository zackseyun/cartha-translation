id: JHN.11.29
reference: John 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: ml
  text: അവൾ അതു കേട്ടപ്പോൾ വേഗം എഴുന്നേറ്റ് അവന്റെ അടുക്കലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൾ കേട്ടപ്പോൾ വേഗം എഴുന്നേറ്റ് അവന്റെ അടുക്കലേക്കു പൊയ്ക്കൊണ്ടിരുന്നു.”'
    reason: ക്രിയാരൂപങ്ങളുടെ കൂടുതൽ അക്ഷരാർഥപരമായ അവതരണവും ἤρχετο എന്ന അപൂർണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവവും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: ἐκείνη
  choice: അവൾ
  rationale: സമീപസന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത് മറിയത്തെയാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സ്ത്രീലിംഗ സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς ἤκουσεν
  choice: അതു കേട്ടപ്പോൾ
  rationale: ὡς ഇവിടെ കാലബന്ധം സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ അറിയിപ്പിനെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ സ്വാഭാവികമായ ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: ἠγέρθη
  choice: എഴുന്നേറ്റ്
  rationale: രൂപത്തിൽ നിഷ്ക്രിയമായിരുന്നാലും ഈ സന്ദർഭത്തിൽ ക്രിയയ്ക്ക് ‘എഴുന്നേൽക്കുക’ എന്ന അകർമക അർഥമാണ്; പുറമേയുള്ള ഒരു പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: ταχὺ
  choice: വേഗം
  rationale: പ്രവൃത്തിയുടെ ത്വരിതത്വം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἤρχετο
  choice: പോയി
  rationale: അപൂർണഭൂതകാലരൂപം പുരോഗമിച്ചുകൊണ്ടിരുന്ന ചലനം ചിത്രീകരിക്കാമെങ്കിലും, തുടർച്ചയായ ആഖ്യാനത്തിൽ ‘പോയി’ സ്വാഭാവികമാണ്.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കലേക്കു
  rationale: ഒരു വ്യക്തിയുടെ ദിശയിലേക്കുള്ള ചലനം വ്യക്തമാക്കുകയും മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
