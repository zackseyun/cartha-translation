    issue: Redundant and awkward apposition
    rationale: ‘കയ്യഫാസ്, ആ വർഷം മഹാപുരോഹിതനായിരുന്ന അയാൾ’ repeats the referent with ‘അയാൾ’ and makes the modifier cumbersome. The Greek participial phrase simply describes Caiaphas; Malayalam can do this idiomatically with ‘മഹാപുരോഹിതനായിരുന്നവൻ’.
  - severity: low
    issue: Footnote understates the Greek construction
    rationale: The note refers generally to a negative expression, whereas the source/audit trail specifically identifies a double-negative construction used emphatically. Stating this improves lexical accuracy without adding interpretation.
