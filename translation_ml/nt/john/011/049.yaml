  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: ml
  text: 'എന്നാൽ അവരിൽ ഒരാളായ കയ്യഫാസ്, ആ വർഷം മഹാപുരോഹിതനായിരുന്നവൻ, അവരോടു പറഞ്ഞു: “നിങ്ങൾക്ക് യാതൊന്നും അറിയില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “നിങ്ങൾ ഒന്നും അറിയുന്നില്ല.” ഗ്രീക്കിൽ ഇരട്ട നിഷേധപ്രയോഗം ഇവിടെ ശക്തമായ ഒരു ശാസനയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: എന്നാൽ അവരിൽ ഒരാളായ
  rationale: εἷς ... τις എന്ന സംയോജനം ആ കൂട്ടത്തിൽപ്പെട്ട ഒരു വ്യക്തിയെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു. δέ മുൻചർച്ചയോടുള്ള നേരിയ വൈരുധ്യവും തുടർച്ചയും സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: Καϊάφας
  choice: കയ്യഫാസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ ലിപ്യന്തരം ചെയ്തു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഏകവചനത്തിലുള്ള പ്രത്യേക പൗരോഹിത്യസ്ഥാനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന പതിവ് മലയാളപദം.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ആ വർഷം മഹാപുരോഹിതനായിരുന്ന അയാൾ
  rationale: കയ്യഫാസിനെ വിശേഷിപ്പിക്കുന്ന കൃദന്തരൂപവും സമയസൂചനയും സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകി; സ്ഥാനത്തിന്റെ കാലപരിധിയെക്കുറിച്ചുള്ള വിശദീകരണം ചേർത്തിട്ടില്ല.
- source_word: εἶπεν αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയും ദാതൃവിഭക്തിയിലുള്ള പരോക്ഷ കർമവും നേരിട്ട്, സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ὑμεῖς
  choice: നിങ്ങൾക്ക്
  rationale: ഗ്രീക്കിലെ പ്രകടമായ ബഹുവചന സർവനാമം നിലനിർത്തി; മലയാളത്തിലെ അറിവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ദത്തഘടന ഉപയോഗിച്ചു.
- source_word: οὐκ οἴδατε οὐδέν
  choice: യാതൊന്നും അറിയില്ല
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള നിഷേധത്തെ മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായ ‘യാതൊന്നും ... ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ അറിയിച്ചു.
theological_decisions:
- issue: കയ്യഫാസിന്റെ സ്ഥാനത്തെക്കുറിച്ചുള്ള യോഹന്നാന്റെ സമയസൂചന
  choice: ആ വർഷം മഹാപുരോഹിതനായിരുന്ന
  alternative: ആ വർഷത്തെ മഹാപുരോഹിതനായിരുന്ന
  rationale: ഇത് ചരിത്രപരമായ ഒരു വിശേഷണമായി മാത്രം പരിഭാഷപ്പെടുത്തി; മഹാപുരോഹിതസ്ഥാനത്തെക്കുറിച്ചോ യോഹന്നാന്റെ വിവരണത്തിലെ വ്യംഗ്യത്തെക്കുറിച്ചോ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കയ്യഫാസിന്റെ വാക്കിലെ കടുത്ത ശാസന ‘യാതൊന്നും അറിയില്ല’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
