id: JHN.11.54
reference: John 11:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: ml
  text: അതുകൊണ്ട് യേശു ഇനി യെഹൂദന്മാരുടെ ഇടയിൽ[a] പരസ്യമായി സഞ്ചരിച്ചില്ല. പകരം, അവൻ അവിടെനിന്ന് മരുഭൂമിക്കു സമീപമുള്ള പ്രദേശത്തേക്ക്, എഫ്രയീം എന്നു വിളിക്കപ്പെടുന്ന പട്ടണത്തിലേക്ക് പോയി; അവിടെ ശിഷ്യന്മാരോടൊപ്പം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യെഹൂദ്യദേശവാസികളുടെ ഇടയിൽ.” യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദന്മാർ” എന്ന പദം സന്ദർഭമനുസരിച്ച് കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യദേശത്തെ ആളുകളെയോ യെഹൂദ അധികാരികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പത്തെ വാക്യത്തിലെ യേശുവിനെ കൊല്ലാനുള്ള ആലോചനയുടെ ഫലമായാണ് ഈ നടപടി ഉണ്ടായതെന്ന ആഖ്യാനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: οὐκέτι
  choice: മേലാൽ ... ഇല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന ഒരു പ്രവർത്തനരീതി അവസാനിച്ചതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: παρρησίᾳ περιεπάτει
  choice: പരസ്യമായി സഞ്ചരിച്ചില്ല
  rationale: ഇവിടെ παρρησίᾳ ധൈര്യത്തേക്കാൾ പൊതുജനദൃഷ്ടിയിൽ തുറന്നുള്ള പ്രവർത്തനത്തെയും περιπατέω സ്ഥലങ്ങളിലൂടെ സഞ്ചരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: യെഹൂദരുടെ ഇടയിൽ
  rationale: Ἰουδαῖοι എന്ന പദത്തിന്റെ പരിചിതമായ അർഥം നിലനിർത്തുന്നു; യോഹന്നാനിൽ സാധ്യമായ പ്രാദേശികമായ ‘യെഹൂദ്യർ’ എന്ന അർഥഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: അവിടെനിന്ന് ... പോയി
  rationale: മുൻസ്ഥലത്തുനിന്നുള്ള ആഖ്യാനചലനം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου
  choice: മരുഭൂമിക്കടുത്ത പ്രദേശത്തേക്ക്
  rationale: χώρα ഒരു പ്രദേശത്തെയും ἔρημος ജനവാസം കുറഞ്ഞ മരുഭൂപ്രദേശത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: എഫ്രയീം എന്നു വിളിക്കപ്പെടുന്ന പട്ടണത്തിലേക്ക്
  rationale: πόλις എന്നത് സന്ദർഭത്തിൽ നഗരം അല്ലെങ്കിൽ പട്ടണം ആകാം; ഇവിടെ സ്വാഭാവികമായ ‘പട്ടണം’ ഉപയോഗിച്ച് λεγομένην എന്നതിന്റെ ഘടനയും നിലനിർത്തുന്നു.
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  choice: അവിടെ ശിഷ്യന്മാരോടൊപ്പം താമസിച്ചു
  rationale: യാത്രാവിവരണത്തിൽ μένω എന്നതിന് ‘താമസിച്ചു’ സ്വാഭാവികമാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കാതെ ‘ശിഷ്യന്മാർ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ സൂചിതവിഭാഗം
  choice: യെഹൂദരുടെ ഇടയിൽ
  alternative: യെഹൂദ്യരുടെ ഇടയിൽ
  rationale: ഈ പദത്തിന് ജനവിഭാഗം, യെഹൂദ്യപ്രദേശവാസികൾ, അല്ലെങ്കിൽ ചില സന്ദർഭങ്ങളിൽ അധികാരികൾ എന്നിങ്ങനെ സന്ദർഭാനുസൃത അർഥങ്ങൾ വരാം. ഇവിടെ യേശുവിന്റെ പരസ്യസഞ്ചാരമാണ് വിഷയം; എല്ലാ യെഹൂദരെയും കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ പൊതുപ്രസ്താവനയായി വായിക്കാതിരിക്കാനായി പ്രാദേശിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ കാരണബന്ധവും പൊതുവായ സഞ്ചാരത്തിന്റെ ആശയവും നിലനിർത്തി; Ἰουδαῖοι എന്ന പദത്തിന്റെ യഥാർഥ സന്ദർഭദ്വയാർഥത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
