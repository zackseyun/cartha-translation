source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: ml
  text: അതുകൊണ്ട്, യേശു വരുന്നു[a] എന്നു മാർത്ത കേട്ടപ്പോൾ അവൾ അദ്ദേഹത്തെ എതിരേൽക്കാൻ ചെന്നു; എന്നാൽ മറിയ വീട്ടിൽ ഇരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു വന്നുകൊണ്ടിരിക്കുന്നു.’ അറിയിക്കപ്പെട്ട വാക്യത്തിൽ ഗ്രീക്ക് വർത്തമാനകാല ക്രിയയാണ് ഉപയോഗിക്കുന്നത്; അത് നടന്നുകൊണ്ടിരിക്കുന്ന വരവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ചയും ഫലബന്ധവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ὡς
  choice: കേട്ടപ്പോൾ
  rationale: ὡς ഇവിടെ കാലസൂചകമാണ്; ‘ഉടൻ’ എന്ന അധികമായ ത്വര ചേർക്കാതെ ‘പ്പോൾ’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤκουσεν
  choice: കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അറിഞ്ഞു’ എന്ന വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: അറിയിക്കപ്പെട്ട വാക്യത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവതയും നടന്നുകൊണ്ടിരിക്കുന്ന സമീപനവും മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ὑπήντησεν αὐτῷ
  choice: അദ്ദേഹത്തെ എതിരേൽക്കാൻ ചെന്നു
  rationale: ὑπαντάωയിലെ ഒരാളെ കാണാൻ നേരെ ചെല്ലുന്ന ദിശാബോധം പ്രകടമാക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലാത്ത ‘പുറത്തേക്ക്’ ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മാർത്തയുടെ പ്രവർത്തനവും മറിയയുടെ നിലയും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ οἴκῳ
  choice: വീട്ടിൽ
  rationale: സ്ഥലസൂചനയെ ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκαθέζετο
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർന്നുകൊണ്ടിരുന്ന ഭൂതകാലാവസ്ഥ സംരക്ഷിക്കുന്നു; ‘അവിടെത്തന്നെ ഇരുന്നു’ പോലുള്ള അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: മാർത്ത / മറിയ / യേശു
  rationale: ആധുനിക മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
