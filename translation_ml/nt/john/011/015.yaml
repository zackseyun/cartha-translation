  - severity: low
    issue: Footnote alternative is slightly less direct than the English audit-trail alternative.
    rationale: '''വിശ്വാസത്തിലേക്കു വരുക'' is possible, but ''വിശ്വസിക്കാൻ തുടങ്ങുക'' more directly expresses the possible ingressive emphasis without suggesting a distinct technical state.'
  - severity: low
