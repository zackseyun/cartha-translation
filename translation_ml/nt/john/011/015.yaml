base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: ml
  text: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിനായി, ഞാൻ അവിടെ ഇല്ലാതിരുന്നതിൽ നിങ്ങൾക്കുവേണ്ടി ഞാൻ സന്തോഷിക്കുന്നു.[a] എന്നാൽ നമുക്ക് അവന്റെ അടുക്കലേക്കു പോകാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ വിശ്വസിക്കാൻ തുടങ്ങേണ്ടതിന്.” ഗ്രീക്കിലെ അഒറിസ്റ്റ് സബ്ജങ്റ്റീവ് വിശ്വസിക്കാൻ തുടങ്ങുന്നതിന് ഊന്നൽ നൽകാം; എന്നാൽ കൂടുതൽ വിശാലവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമായ “വിശ്വസിക്കേണ്ടതിനായി” മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ സന്തോഷഭാവം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങളുടെ നിമിത്തം
  rationale: ശിഷ്യന്മാരുടെ പ്രയോജനത്തെ സൂചിപ്പിക്കുന്ന διά + accusative എന്ന പ്രയോഗം നിലനിർത്തുന്നു; അവർ സന്തോഷത്തിന്റെ വെറും കാരണമാണെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἵνα πιστεύσητε
  choice: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള aorist subjunctive-ന്റെ ഉദ്ദേശ്യാർഥം നൽകുന്നു; വിശ്വാസത്തിലേക്ക് പുതുതായി വരുന്നു എന്ന് നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: ഞാൻ അവിടെ ഇല്ലാതിരുന്നതിൽ
  rationale: യേശുവിന്റെ സന്തോഷത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ὅτιയെ ഇവിടെ കാരണസൂചകമായി അമിതമായി വേർതിരിക്കുന്നില്ല.
- source_word: ἀλλὰ ἄγωμεν
  choice: എന്നാൽ നമുക്ക് ... പോകാം
  rationale: വിവരണത്തിൽനിന്ന് പ്രവർത്തനത്തിലേക്കുള്ള വിരുദ്ധതയും hortatory subjunctive-ന്റെ ആഹ്വാനവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ
  rationale: ഒരു വ്യക്തിയുടെ അടുത്തേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ πιστεύσητε എന്നതിന്റെ ഭാവം
  choice: വിശ്വസിക്കേണ്ടതിന്
  alternative: വിശ്വാസത്തിലേക്കു വരേണ്ടതിന്
  rationale: aorist subjunctive-ന് ആരംഭാത്മകമായ അർഥസാധ്യതയുണ്ടെങ്കിലും, ശിഷ്യന്മാർ മുമ്പ് അവിശ്വാസികളായിരുന്നു എന്ന ശക്തമായ നിഗമനം വാക്യം നിർബന്ധിക്കുന്നില്ല. മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിമിത്തം’, ‘അടുക്കൽ’ എന്നിവ വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പ്രയോഗങ്ങളാണ്.
