  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: ml
  text: 'ഇവ പറഞ്ഞശേഷം അവൻ ഉച്ചസ്വരത്തിൽ വിളിച്ചുപറഞ്ഞു: “ലാസറേ, പുറത്തേക്കു വരിക!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ സംഭാഷണശൈലിയിൽ: “ലാസറേ, പുറത്തുവരൂ!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ഇവ
  rationale: നപുംസക ബഹുവചനമായ സൂചകസർവനാമത്തിന്റെ ബഹുവചനഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി മുൻപറഞ്ഞ വാക്കുകളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰπὼν
  choice: പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലക്രമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചസ്വരത്തിൽ
  rationale: ശബ്ദത്തിന്റെ ശക്തിയെയും ഉയർച്ചയെയും വ്യക്തമാക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: ἐκραύγασεν
  choice: വിളിച്ചുപറഞ്ഞു
  rationale: വെറും ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ ശക്തമായ ഉച്ചത്തിലുള്ള വിളി എന്ന അർഥം നൽകുന്നു; മുൻപുള്ള ‘ഉച്ചസ്വരത്തിൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: Λάζαρε
  choice: ലാസറേ
  rationale: സംജ്ഞാനാമത്തിന്റെ സംബോധനരൂപം മലയാളത്തിലെ പതിവ് ലിപ്യന്തരണത്തിലും വ്യാകരണരൂപത്തിലും നൽകുന്നു.
- source_word: δεῦρο ἔξω
  choice: പുറത്തേക്കു വരിക
  rationale: δεῦρο-യുടെ ആഹ്വാനാത്മകമായ ‘വരിക’ എന്ന അർഥവും ἔξω-യുടെ ‘പുറത്തേക്ക്’ എന്ന ദിശാഭാവവും വ്യക്തവും സ്വാഭാവികവുമായി ചേർക്കുന്നു.
theological_decisions:
- issue: പ്രസിദ്ധമായ അത്ഭുതകല്പനയെ പാരമ്പര്യഭാഷയുടെ സ്വാധീനമില്ലാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: പുറത്തേക്കു വരിക
  alternative: പുറത്തുവരൂ
  rationale: വാക്യത്തിൽ സിദ്ധാന്തപരമായി തർക്കമുള്ള പദമില്ല. മൂലത്തിലെ നേരിട്ടുള്ള ശക്തമായ ആഹ്വാനം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; അതേസമയം കൂടുതൽ സംഭാഷണശൈലിയിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ഉച്ചസ്വരത്തിൽ വിളിച്ചുപറഞ്ഞു’ എന്നത് മൂലത്തിലെ ശബ്ദശക്തിക്കുള്ള ഇരട്ട ഊന്നൽ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട കല്പനയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
