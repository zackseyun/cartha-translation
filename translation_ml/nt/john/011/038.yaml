base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: ml
  text: അപ്പോൾ യേശു വീണ്ടും ഉള്ളിൽ അഗാധമായി കലങ്ങിക്കൊണ്ട്[a] കല്ലറയുടെ അടുത്തെത്തി. അതൊരു ഗുഹയായിരുന്നു; അതിന്റെ പ്രവേശനത്തിനു നേരെ ഒരു കല്ല് കിടന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉള്ളിൽ രോഷാകുലനായി’ അല്ലെങ്കിൽ ‘ഉള്ളിൽ അത്യന്തം അസ്വസ്ഥനായി’; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ അസാധാരണമായ തീവ്രതയുള്ളതാണ്; അത് ദുഃഖം മാത്രമല്ലാത്ത ഒരു വികാരത്തെയും സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭവത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതിയും ബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച യേശുവിന്റെ ശക്തമായ വികാരപ്രതികരണം ആവർത്തിക്കുന്നതായി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: ഉള്ളിൽ അത്യന്തം വികാരക്ഷോഭിതനായി
  rationale: ക്രിയയുടെ അസാധാരണമായ തീവ്രത നിലനിർത്തുമ്പോഴും വികാരം ദുഃഖമോ രോഷമോ മാത്രമാണെന്ന് മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: ἔρχεται
  choice: എത്തി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനത്തിന് സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μνημεῖον
  choice: കല്ലറ
  rationale: തുടർന്നുള്ള ഗുഹയുടെയും അടയ്ക്കുന്ന കല്ലിന്റെയും വിവരണത്തിന് ചേരുന്ന സാധാരണ മലയാള പദം.
- source_word: σπήλαιον
  choice: ഗുഹ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: λίθος
  choice: കല്ല്
  rationale: കല്ലറയുടെ പ്രവേശനം അടയ്ക്കാൻ ഉപയോഗിച്ച കല്ലിനെ സൂചിപ്പിക്കുന്ന സാധാരണ പദം.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: അതിന്റെ വാതിൽക്കൽ ഒരു കല്ല് വെച്ചിരുന്നു
  rationale: ഗുഹാകല്ലറയുടെ പ്രവേശനഭാഗത്ത് കല്ല് സ്ഥാപിച്ചിരുന്ന പ്രായോഗിക ദൃശ്യം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വാതിൽക്കൽ’ എന്നത് പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭാനുസൃത വ്യക്തീകരണമാണ്.
theological_decisions:
- issue: യേശുവിനെ സംബന്ധിച്ച ἐμβριμώμενος എന്ന പദത്തിന്റെ വികാരതീവ്രത
  choice: യേശു ഉള്ളിൽ അത്യന്തം വികാരക്ഷോഭിതനായി എന്ന് അവതരിപ്പിക്കുന്നു; വികാരത്തിന്റെ കൃത്യസ്വഭാവം മുഖ്യപാഠത്തിൽ പരിമിതപ്പെടുത്തുന്നില്ല.
  alternative: ‘ഉള്ളിൽ രോഷാകുലനായി’ അല്ലെങ്കിൽ ‘ഉള്ളിൽ അത്യന്തം അസ്വസ്ഥനായി’.
  rationale: പദം ശക്തമായ ആന്തരിക വികാരചലനം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ അത് ദുഃഖം മാത്രമോ രോഷം മാത്രമോ ആണെന്നത് വിവാദവിധേയമാണ്. അതിനാൽ വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് മൂലത്തിലെ വികാരതീവ്രതയും അനിശ്ചിതത്വവും സംരക്ഷിച്ചിരിക്കുന്നു.
