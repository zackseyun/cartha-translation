id: JHN.11.26
reference: John 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ml
  text: ജീവിച്ചിരിക്കുന്നവനും എന്നിൽ വിശ്വസിക്കുന്നവനുമായ ഏവനും ഒരിക്കലും മരിക്കുകയില്ല. നീ ഇതു വിശ്വസിക്കുന്നുവോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: ജീവിച്ചുകൊണ്ട് എന്നിൽ വിശ്വസിക്കുന്ന ഏവനും
  rationale: Present participles describe the person as living and believing; this rendering keeps both ideas closely linked and reads naturally in modern Malayalam.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: മരിക്കുകയില്ല
  rationale: The emphatic Greek negation οὐ μή is conveyed categorically; with ‘ഒരിക്കലും’ below, the full expression strongly denies the possibility.
- source_word: εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും
  rationale: In this negative idiom, the phrase means ‘never’ (literally, ‘unto the age’), not that the act of dying continues forever. Malayalam ‘ഒരിക്കലും … ഇല്ല’ naturally preserves the emphatic force.
- source_word: πιστεύεις τοῦτο;
  choice: നീ ഇതു വിശ്വസിക്കുന്നുവോ?
  rationale: A direct singular question, preserving Jesus’ personal address to Martha.
theological_decisions:
- issue: How to express ‘will certainly never die’ despite the physical death acknowledged in the preceding verse
  choice: ഒരിക്കലും മരിക്കുകയില്ല
  alternative: എന്നേക്കുമായി മരിക്കുകയില്ല
  rationale: The text intentionally places death and life in tension across verses 25–26. The translation retains Jesus’ absolute wording without inserting an explanatory qualifier such as ‘spiritually’ or ‘finally.’
- issue: Relationship of living and believing
  choice: ജീവിച്ചുകൊണ്ട് എന്നിൽ വിശ്വസിക്കുന്ന
  alternative: ജീവിക്കുന്നവനും എന്നിൽ വിശ്വസിക്കുന്നവനുമായ
  rationale: The chosen wording preserves the coordinated present participles while avoiding a Malayalam construction that might suggest two separate classes of people.
translation_notes:
  register: Modern standard Malayalam with direct, dignified phrasing. The emphatic Greek οὐ μή … εἰς τὸν αἰῶνα is rendered by the idiomatic and categorical ‘ഒരിക്കലും … ഇല്ല.’ No interpretive qualifier is added, so the theological tension with bodily death remains visible.
