translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ കാലബന്ധവും സ്ഥലപരമായ വൈരുധ്യവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
