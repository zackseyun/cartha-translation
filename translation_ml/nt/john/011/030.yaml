revisions:
- from: യേശു അപ്പോഴും ഗ്രാമത്തിൽ എത്തിയിരുന്നില്ല; മാർത്ത അദ്ദേഹത്തെ കണ്ടുമുട്ടിയ സ്ഥലത്തുതന്നെ അദ്ദേഹം ഉണ്ടായിരുന്നു.[a]
  to: യേശു ഇതുവരെ ഗ്രാമത്തിൽ എത്തിയിരുന്നില്ല; എന്നാൽ മാർത്ത അദ്ദേഹത്തെ കണ്ടുമുട്ടിയ സ്ഥലത്ത് അദ്ദേഹം ഇപ്പോഴും ഉണ്ടായിരുന്നു.[a]
  rationale: 'The revision explicitly preserves the three linked temporal and contrastive elements of the Greek: οὔπω (“ഇതുവരെ ... ഇല്ലായിരുന്നു”), ἀλλά (“എന്നാൽ”), and ἔτι (“ഇപ്പോഴും”). It retains the concise, respectful modern Malayalam narrative register and keeps the contextual alternative for ὑπήντησεν in the anchored footnote.'
