id: JHN.11.30
reference: John 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: ml
  text: യേശു ഇതുവരെ ഗ്രാമത്തിൽ എത്തിയിരുന്നില്ല; എന്നാൽ മാർത്ത അദ്ദേഹത്തെ കണ്ടുമുട്ടിയ സ്ഥലത്ത് അദ്ദേഹം ഇപ്പോഴും ഉണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘മാർത്ത അദ്ദേഹത്തെ കാണാൻ എതിരേ ചെന്ന സ്ഥലത്ത്.’'
    reason: ὑπαντάω എന്ന ക്രിയയ്ക്ക് ‘കണ്ടുമുട്ടുക’ എന്നതിനൊപ്പം ‘കാണാൻ എതിരേ ചെന്നു കാണുക’ എന്ന കൂടുതൽ വ്യക്തമായ അർഥവും ഈ സന്ദർഭത്തിൽ സാധ്യമാണ്.
lexical_decisions:
- source_word: οὔπω
  choice: അപ്പോഴും ... എത്തിയിരുന്നില്ല
  rationale: ഈ സമയത്തോളം സംഭവം നടന്നിട്ടില്ലെന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യക്രമവും അർധവിരാമവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐληλύθει
  choice: എത്തിയിരുന്നില്ല
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭൂതപൂർവകാലരൂപം ചുറ്റുമുള്ള ആഖ്യാനകാലത്തിനു മുമ്പുള്ള അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘എത്തിയിരുന്നില്ല’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κώμην
  choice: ഗ്രാമത്തിൽ
  rationale: κώμη സാധാരണയായി ചെറിയ ജനവാസകേന്ദ്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഗ്രാമം’ അതിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാളരൂപമാണ്.
- source_word: ἀλλ’
  choice: അർധവിരാമത്തിലൂടെ പ്രതിപക്ഷബന്ധം
  rationale: ഗ്രാമത്തിൽ എത്തിയിട്ടില്ലെന്നതും മുൻസ്ഥാനത്ത് തുടരുന്നതും തമ്മിലുള്ള വൈരുധ്യം മലയാളത്തിൽ അർധവിരാമവും തുടർന്നുള്ള വാക്യഘടനയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; നിർബന്ധിതമായ ‘എന്നാൽ’ ഒഴിവാക്കുന്നു.
- source_word: ἔτι
  choice: തന്നെ ... ഉണ്ടായിരുന്നു
  rationale: അതേ സ്ഥലത്തെ തുടർച്ചയായ സാന്നിധ്യം ‘സ്ഥലത്തുതന്നെ ... ഉണ്ടായിരുന്നു’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τόπῳ
  choice: സ്ഥലത്ത്
  rationale: τόπος എന്ന പൊതുവായ സ്ഥലസൂചകപദത്തിന് ലളിതവും കൃത്യവുമായ മലയാളതുല്യം.
- source_word: ὅπου
  choice: '... സ്ഥലത്ത്'
  rationale: സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ ‘കണ്ടുമുട്ടിയ സ്ഥലത്ത്’ എന്ന സ്വാഭാവിക ഘടനയിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὑπήντησεν
  choice: കണ്ടുമുട്ടിയ
  rationale: സന്ദർഭത്തിൽ നടന്ന കൂടിക്കാഴ്ചയുടെ സ്ഥലം തിരിച്ചറിയിക്കുന്നു. ‘കണ്ടുമുട്ടി’ എന്നത് അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ‘എതിരേ ചെന്നു കണ്ടു’ എന്ന കൂടുതൽ വ്യക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: αὐτῷ
  choice: അദ്ദേഹത്തെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമം ആദരസൂചകവും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവുമായ രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: Μάρθα
  choice: മാർത്ത
  rationale: Μάρθα എന്ന പേരിന്റെ നിലവാരമുള്ള മലയാള ലിപ്യന്തരണം.
