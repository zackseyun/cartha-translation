source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: ml
  text: 'അതിനു ശേഷം അവൻ ശിഷ്യന്മാരോടു പറയുന്നു: “നമുക്ക് വീണ്ടും യെഹൂദ്യയിലേക്കു[a] പോകാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പൂർവപ്രത്യയം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കത്തെയോ അതിനകത്തേക്കുള്ള പ്രവേശനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: അതിനു ശേഷം
  rationale: രണ്ടു കാലസൂചക ഘടകങ്ങളും ചേർന്ന് കഥയിലെ തുടർച്ചയെ ഊന്നുന്നു. ‘അതിനു ശേഷം’ ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: യോഹന്നാൻ ഉപയോഗിക്കുന്ന ചരിത്രവർത്തമാനകാലം നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാരോട്
  rationale: ഗ്രീക്കിലെ പരോക്ഷകർമം നേരിട്ട് നൽകുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘തന്റെ’ എന്ന ഉടമസ്ഥസൂചകം ചേർത്തിട്ടില്ല.
- source_word: Ἄγωμεν
  choice: നമുക്ക് … പോകാം
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ ആഹ്വാനാത്മക ഉപവാക്യരൂപത്തിന്റെ സ്വാഭാവിക മലയാളസമാനമാണ്; കൂട്ടായി പോകാനുള്ള ക്ഷണം നിലനിർത്തുന്നു.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: യെഹൂദ്യയിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ പ്രദേശത്തിനകത്തേക്കുള്ള പ്രവേശനവും ഈ രൂപത്തിന് ഉൾക്കൊള്ളാനാകും.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുമ്പ് സന്ദർശിച്ച പ്രദേശത്തേക്കുള്ള മടങ്ങിപ്പോക്ക് ലളിതമായും നേരിട്ടും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം
  choice: ‘പറയുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തി
  alternative: ‘പറഞ്ഞു’ എന്ന ഭൂതകാലത്തിലേക്ക് സ്വാഭാവികമാക്കുക
  rationale: ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സജീവമായ ശൈലി പ്രതിഫലിപ്പിക്കുന്നതിനായി വർത്തമാനകാലം നിലനിർത്തി; ഇതിലൂടെ പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശിഷ്യന്മാരോടു പറയുന്നു’ എന്ന രൂപം മൂലപാഠത്തിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു. ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘യെഹൂദ്യയിലേക്കു’ എന്ന പദത്തിനരികിൽ ചേർത്തിരിക്കുന്നു.
