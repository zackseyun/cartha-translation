id: JHN.11.40
reference: John 11:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: ml
  text: 'യേശു അവളോടു പറഞ്ഞു: “നീ വിശ്വസിച്ചാൽ ദൈവത്തിന്റെ മഹത്വം കാണുമെന്ന് ഞാൻ നിന്നോടു പറഞ്ഞില്ലേ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം ഭൂതകാലരൂപം ഉപയോഗിക്കുന്നു.
- source_word: αὐτῇ
  choice: അവളോടു
  rationale: സന്ദർഭത്തിൽ ഇത് മാർത്തയെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമമാണ്; മലയാളത്തിൽ ‘അവളോടു’ സ്വാഭാവികമാണ്.
- source_word: Οὐκ εἶπόν σοι
  choice: ഞാൻ നിന്നോടു പറഞ്ഞില്ലേ?
  rationale: സ്ഥിരീകരണം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ഭാവവും നേരിട്ടുള്ള വ്യക്തിസംബോധനയും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: ἐὰν πιστεύσῃς
  choice: നീ വിശ്വസിച്ചാൽ
  rationale: യോഹന്നാന്റെ രചനയിലെ πιστεύω എന്ന ക്രിയയുടെ ബന്ധം നിലനിർത്തുകയും കൂടുതൽ സങ്കുചിതമായ വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὄψῃ
  choice: കാണുമെന്ന്
  rationale: നിബന്ധനയോടു ചേർന്ന ഭാവിക്രിയയുടെ അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ പരോക്ഷ ഉദ്ധരണിഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്വം
  rationale: δόξα എന്നതിന്റെ ദൈവിക വെളിപ്പാടിനോടു ബന്ധപ്പെട്ട ഗൗരവം ‘മഹത്വം’ നിലനിർത്തുന്നു; ജനിറ്റീവ് ബന്ധം ‘ദൈവത്തിന്റെ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: വിശ്വാസവും ദൈവത്തിന്റെ മഹത്വം കാണുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: മാർത്തയോടുള്ള നിബന്ധനാപരമായ വാഗ്ദാനമായി വാക്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വിശ്വാസത്തെയും അത്ഭുതങ്ങളെയും കുറിച്ചുള്ള സർവസാധാരണ തത്ത്വമെന്നോ ലാസറിനെ ഉയിർപ്പിക്കുന്ന സംഭവത്തിൽ മാത്രം ഒതുങ്ങുന്ന വാഗ്ദാനമെന്നോ വിശദീകരിക്കുക.
  rationale: മൂലവാക്യം ഈ വിശാലമായ ദൈവശാസ്ത്രചോദ്യങ്ങളെ തീർപ്പാക്കുന്നില്ല; അതിനാൽ അതിലെ നിബന്ധനയും ദൈവമഹത്വം കാണുമെന്ന വാഗ്ദാനവും വ്യാഖ്യാനവിസ്താരം കൂടാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അലങ്കാരചോദ്യത്തിന്റെ സ്വാഭാവിക ഊന്നൽ ‘പറഞ്ഞില്ലേ?’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു.
