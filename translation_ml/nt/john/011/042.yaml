id: JHN.11.42
reference: John 11:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: ml
  text: എന്നാൽ നീ എപ്പോഴും എന്നെ കേൾക്കുന്നുവെന്ന് ഞാൻ അറിഞ്ഞിരുന്നു. പക്ഷേ ചുറ്റും നിന്നിരുന്ന ജനക്കൂട്ടം നിമിത്തം ഞാൻ ഇത് പറഞ്ഞത്, നീയാണ് എന്നെ അയച്ചതെന്ന് അവർ വിശ്വസിക്കേണ്ടതിനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ‘നീ’ എന്നതിന് ഊന്നലുണ്ട്: ‘നീയാണ് എന്നെ അയച്ചത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδειν
  choice: ഞാൻ അറിഞ്ഞിരുന്നു
  rationale: οἶδα എന്ന ക്രിയയുടെ ഭൂതകാലപ്രയോഗം. ഈ സന്ദർഭത്തിൽ മുൻപേ നിലനിന്നിരുന്ന അറിവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അതിനെ അനാവശ്യമായി സാങ്കേതികമായ പൂർവഭൂതകാലമാക്കുന്നില്ല.
- source_word: πάντοτέ μου ἀκούεις
  choice: നീ എപ്പോഴും എന്റെ അപേക്ഷ കേൾക്കുന്നു
  rationale: പ്രാർഥനാസന്ദർഭത്തിൽ ἀκούω + ജനിറ്റീവ് വെറും ശബ്ദം കേൾക്കുന്നതിനെക്കാൾ സ്വീകരണാത്മകമായി കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘എന്നെ കേൾക്കുന്നു’ എന്നത് വ്യക്തിയോടുള്ള അനുസരണം എന്നും തെറ്റിദ്ധരിക്കാവുന്നതിനാൽ ‘എന്റെ അപേക്ഷ കേൾക്കുന്നു’ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ
  choice: എങ്കിലും
  rationale: യേശുവിന്റെ ഉറച്ച അറിവും ജനക്കൂട്ടത്തിനുവേണ്ടിയുള്ള പരസ്യപ്രസ്താവനയും തമ്മിലുള്ള വിരുദ്ധബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διὰ τὸν ὄχλον
  choice: ജനക്കൂട്ടം നിമിത്തമാണ്
  rationale: διά + അക്ക്യൂസറ്റീവ് ഇവിടെ കാരണം അഥവാ നിമിത്തം സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ἵνα-വാക്യം ഉദ്ദേശിച്ച ഫലം വ്യക്തമാക്കുന്നതിനാൽ ‘നിമിത്തം’ കാരണം-പ്രയോജനം രണ്ടിന്റെയും സാധ്യത അടച്ചുപൂട്ടുന്നില്ല.
- source_word: τὸν περιεστῶτα
  choice: ചുറ്റും നിൽക്കുന്ന
  rationale: പരിസരത്ത് നിലകൊള്ളുന്ന ജനക്കൂട്ടത്തിന്റെ സ്ഥലപരമായ അർഥം ലളിതവും ദൃശ്യവുമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: εἶπον
  choice: ഞാൻ ഇതു പറഞ്ഞത്
  rationale: λέγω-യുടെ അയോറിസ്റ്റ്. ‘ഇതു’ എന്നത് തൊട്ടുമുമ്പ് ഉച്ചരിച്ച പ്രാർഥനയെ സ്വാഭാവികമായി തിരിച്ചുചൂണ്ടുന്നു.
- source_word: ἵνα πιστεύσωσιν
  choice: അവർ വിശ്വസിക്കേണ്ടതിന്
  rationale: ἵνα + സബ്ജങ്‌ടീവ് സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: നീയാണ് എന്നെ അയച്ചതെന്ന്
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന σύ എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘നീയാണ്’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ἀπέστειλας എന്ന അയോറിസ്റ്റിനെ ‘അയച്ചു’ എന്ന ദൗത്യഭാഷയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാവ് യേശുവിന്റെ അപേക്ഷ എപ്പോഴും കേൾക്കുന്നു എന്ന പ്രസ്താവനയുടെ ശക്തി
  choice: പിതാവ് യേശുവിന്റെ അപേക്ഷ എപ്പോഴും കേൾക്കുന്നു എന്നും ജനക്കൂട്ടത്തിന്റെ പ്രയോജനത്തിനായി യേശു ശബ്ദമായി ഇതു പറഞ്ഞു എന്നും പാഠം പ്രസ്താവിക്കുന്നതുപോലെ നിലനിർത്തി.
  alternative: ഇത് പിതാവും പുത്രനും തമ്മിലുള്ള പ്രത്യേക ബന്ധത്തെക്കാൾ പൊതുവായ പ്രാർഥനോത്തരത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി വായിക്കാം.
  rationale: ലാസറിനെ ഉയിർപ്പിക്കുന്നതിന് തൊട്ടുമുമ്പുള്ള പ്രാർഥനയാണ് ഉടൻസന്ദർഭം. പിതാവും പുത്രനും തമ്മിലുള്ള അടുപ്പവും ജനക്കൂട്ടത്തോടുള്ള സാക്ഷ്യലക്ഷ്യവും സംരക്ഷിക്കുന്നു; എന്നാൽ പാഠത്തിനപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: പരസ്യമായി പറഞ്ഞ പ്രാർഥനയുടെ ഉദ്ദേശ്യം
  choice: പിതാവാണ് യേശുവിനെ അയച്ചതെന്ന് ചുറ്റുമുള്ളവർ വിശ്വസിക്കാനാണ് യേശു ഇതു പറഞ്ഞതെന്ന് പരിഭാഷ വ്യക്തമാക്കി.
  alternative: ഈ പ്രത്യേക അത്ഭുതത്തിന്റെ സാധുത ഉറപ്പിക്കുക എന്ന പരിമിത ലക്ഷ്യമായി ഇതിനെ വ്യാഖ്യാനിക്കാം.
  rationale: ἵνα-വാക്യത്തിന്റെ വ്യക്തമായ ലക്ഷ്യം ‘നീ എന്നെ അയച്ചു’ എന്ന വിശ്വാസമാണ്. യോഹന്നാനിലെ ദൗത്യവിഷയം നിലനിർത്തിയെങ്കിലും അതിനെ പരിഭാഷയിൽ കൂടുതൽ വികസിപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രാർഥനാസന്ദർഭം വ്യക്തമാക്കാൻ ‘എന്റെ അപേക്ഷ കേൾക്കുന്നു’ ഉപയോഗിച്ചു. മൂലത്തിലെ ഊന്നൽ പ്രധാനവാചകത്തിൽ തന്നെ ‘നീയാണ്’ എന്നതിലൂടെ നൽകിയിട്ടും അതിന്റെ ഉറവിടസ്വഭാവം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
