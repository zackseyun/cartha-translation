id: JHN.11.39
reference: John 11:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: ml
  text: 'യേശു പറഞ്ഞു: “കല്ല് നീക്കിക്കളയുക.” മരിച്ചവന്റെ[a] സഹോദരിയായ മാർത്ത അവനോട് പറഞ്ഞു: “കർത്താവേ, ഇപ്പോഴേക്കും അവൻ ദുർഗന്ധം വമിക്കുന്നുണ്ട്[b]; അവൻ മരിച്ചിട്ട് നാലു ദിവസമായല്ലോ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരിച്ചുപോയവന്റെ.”
    reason: τετελευτηκότος എന്ന perfect participle-ന്റെ കൂടുതൽ വിപുലമായ പരിഭാഷ.
  - marker: b
    text: അഥവാ, “നാറുന്നു”; ഗ്രീക്കിൽ ‘ഗന്ധം പുറപ്പെടുവിക്കുക’ എന്നർഥമുള്ള ഒരു ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: ὄζει എന്ന പദത്തിന്റെ കൂടുതൽ നേരിട്ടതും ശക്തവുമായ മലയാളവികല്പം രേഖപ്പെടുത്തുന്നു.
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “അവൻ നാലാം ദിവസക്കാരനാണ്”; അതായത്, അവൻ മരിച്ചിട്ട് നാലു ദിവസമായി.
    reason: τεταρταῖος എന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ അസാധാരണമായ അക്ഷരാർഥഘടന വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Ἄρατε
  choice: നീക്കിക്കളയുക
  rationale: αἴρω എന്ന ക്രിയയുടെ ബഹുവചന ആജ്ഞാരൂപം ഇവിടെ കല്ല് കല്ലറയുടെ പ്രവേശനത്തിൽനിന്ന് മാറ്റാൻ കല്പിക്കുന്നു. മലയാളത്തിൽ ‘നീക്കിക്കളയുക’ സന്ദർഭത്തിന് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὸν λίθον
  choice: കല്ല്
  rationale: കല്ലറയുടെ പ്രവേശനം മൂടിയിരുന്ന കല്ലിനെയാണ് λίθος സൂചിപ്പിക്കുന്നത്; ‘കല്ല്’ സാധാരണവും കൃത്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: τοῦ τετελευτηκότος
  choice: മരിച്ചവന്റെ
  rationale: τελευτάω എന്ന ക്രിയയുടെ perfect participle മരണം സംഭവിച്ച് ആ അവസ്ഥ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മരിച്ചവന്റെ’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള മാർത്തയുടെ ആദരപൂർവമായ അഭിസംബോധനയിൽ κύριος എന്ന പദത്തിന്റെ ഭാരവും യോഹന്നാനിലെ പ്രയോഗവും ‘കർത്താവേ’ നിലനിർത്തുന്നു.
- source_word: ἤδη
  choice: ഇപ്പോഴേക്കും
  rationale: സംസാരിക്കുന്ന സമയത്തിന് മുമ്പേ പ്രസ്തുത അവസ്ഥ ഉണ്ടായിക്കഴിഞ്ഞുവെന്ന കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὄζει
  choice: ദുർഗന്ധം വമിക്കുന്നുണ്ട്
  rationale: ὄζω എന്നത് ഗന്ധം പുറപ്പെടുവിക്കുക എന്നാണ്; മരണസന്ദർഭം അത് അസുഖകരമായ ഗന്ധമാണെന്ന് വ്യക്തമാക്കുന്നു. ഈ പരിഭാഷ അർഥം തുറന്നുപറയുന്നു, എന്നാൽ ‘നാറുന്നു’ എന്നതിനേക്കാൾ മാന്യമായ ശൈലി പാലിക്കുന്നു.
- source_word: τεταρταῖος
  choice: അവൻ മരിച്ചിട്ട് നാലു ദിവസമായി
  rationale: ഗ്രീക്കിലെ വിശേഷണം അക്ഷരാർഥത്തിൽ ‘നാലാം ദിവസക്കാരൻ’ എന്ന ആശയമാണ് നൽകുന്നത്. സ്വാഭാവിക മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ മരണത്തിനു ശേഷം നാല് ദിവസം കഴിഞ്ഞതായി വികസിപ്പിച്ചു പറയുന്നു.
- source_word: γάρ
  choice: -ല്ലോ
  rationale: മാർത്തയുടെ മുൻവാക്കിന് കാരണം നൽകുന്ന γάρ എന്ന ബന്ധത്തെ സംഭാഷണസഹജമായ മലയാളത്തിലെ ‘-ല്ലോ’ വിശദീകരണഭാവത്തോടെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: മാർത്ത യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോഴുള്ള κύριος എന്ന പദം
  choice: കർത്താവേ
  alternative: യജമാനനേ / അങ്ങുന്നേ
  rationale: ഇത് വെറും മര്യാദാപൂർവമായ ‘സാർ’ എന്ന അർഥത്തിൽ ചുരുക്കാതെ, യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ അഭിസംബോധനയ്ക്കുള്ള സാധ്യതയുള്ള ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; അതേസമയം ഈ വാക്യം മാത്രം പറയുന്നതിലധികം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാന-സംഭാഷണ ശൈലി. ‘ദുർഗന്ധം വമിക്കുന്നുണ്ട്’ എന്നത് മരണത്തിന്റെ യാഥാർഥ്യം മറച്ചുവയ്ക്കാതെ, അത്യന്തം സംസാരഭാഷാപരമായ ‘നാറുന്നു’ എന്ന രൂപത്തേക്കാൾ പ്രസിദ്ധീകരണയോഗ്യമായ ഗൗരവം പാലിക്കുന്നു.
