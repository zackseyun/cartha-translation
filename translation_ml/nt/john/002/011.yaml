id: JHN.2.11
reference: John 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: ml
  text: യേശു ഗലീലയിലെ കാനായിൽ ഇതു തന്റെ അടയാളങ്ങളുടെ ആരംഭമായി ചെയ്തു; തന്റെ മഹത്വം വെളിപ്പെടുത്തി; അവന്റെ ശിഷ്യന്മാർ അവനിൽ വിശ്വസിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത് തന്റെ അടയാളങ്ങളിൽ ആദ്യത്തേതായി ചെയ്തു.”
    reason: ἀρχή എന്ന പദം ഇവിടെ ‘ആരംഭം’ എന്നും ‘ആദ്യത്തേത്’ എന്നും മനസ്സിലാക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: ഇതു ചെയ്തു
  rationale: പ്രകടനസർവനാമവും പൊതുവായ ποιέω എന്ന ക്രിയയും ലളിതമായി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അത്ഭുതം’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀρχὴν τῶν σημείων
  choice: തന്റെ അടയാളങ്ങളുടെ ആരംഭമായി
  rationale: ἀρχή എന്നതിലെ ‘ആരംഭം’ എന്ന അർഥം സംരക്ഷിക്കുകയും ഇത് തുടർന്നുവരുന്ന അടയാളങ്ങളുടെ ഉദ്ഘാടനമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: σημείων
  choice: അടയാളങ്ങൾ
  rationale: യോഹന്നാനിൽ പ്രവൃത്തിയുടെ വെളിപ്പെടുത്തൽസ്വഭാവം സൂചിപ്പിക്കുന്ന പ്രധാന പദമായതിനാൽ ‘അത്ഭുതങ്ങൾ’ എന്നതിനു പകരം ‘അടയാളങ്ങൾ’ ഉപയോഗിച്ചു.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ കാനായിൽ
  rationale: ഭൂമിശാസ്ത്രപരമായ ബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἐφανέρωσεν
  choice: വെളിപ്പെടുത്തി
  rationale: കാണപ്പെടുകയോ അറിയപ്പെടുകയോ ചെയ്യുമാറാക്കുക എന്ന φανερόωയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν δόξαν αὐτοῦ
  choice: തന്റെ മഹത്ത്വം
  rationale: δόξαയുടെ തേജസ്സും ബഹുമാനവും വെളിവാകുന്ന അർഥം ഉൾക്കൊള്ളുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിച്ചു
  rationale: യേശുവിലേക്കു തിരിഞ്ഞ വ്യക്തിപരമായ വിശ്വാസത്തിന്റെ യോഹന്നാനീയ പ്രയോഗം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഗ്രീക്ക് നാമപദസമുച്ചയത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: യോഹന്നാനിലെ σημεῖον എന്ന സാങ്കേതിക പ്രയോഗം
  choice: ‘അടയാളങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘അത്ഭുതങ്ങൾ’
  rationale: ഈ പ്രവൃത്തികൾ ശക്തിപ്രകടനങ്ങൾ മാത്രമല്ല, യേശുവിന്റെ വ്യക്തിത്വവും മഹത്ത്വവും വെളിപ്പെടുത്തുന്ന അടയാളങ്ങളുമാണ്; അതിനാൽ മൂലപദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ധ്വനി നിലനിർത്തി.
- issue: ἀρχὴν τῶν σημείων എന്നതിന്റെ ബലം
  choice: ‘തന്റെ അടയാളങ്ങളുടെ ആരംഭമായി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘തന്റെ അടയാളങ്ങളിൽ ആദ്യത്തേതായി’
  rationale: ἀρχήയിലെ ‘ആരംഭം’ എന്ന പദസങ്കല്പം പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു; ‘ആദ്യത്തേത്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിന്റെ ആശയക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവികമായ apposition ഒഴിവാക്കാൻ ‘ആരംഭമായി’ ഉപയോഗിച്ചു. രണ്ടാം ഘടകത്തിന്റെ ഫലബന്ധം വായനാസൗകര്യത്തിനായി ‘അങ്ങനെ’ എന്ന പദംകൊണ്ട് വ്യക്തമാക്കി.
