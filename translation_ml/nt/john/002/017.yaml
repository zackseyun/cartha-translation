id: JHN.2.17
reference: John 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: ml
  text: ‘നിന്റെ ഭവനത്തോടുള്ള ആവേശം എന്നെ വിഴുങ്ങിക്കളയും’ എന്ന് എഴുതപ്പെട്ടിരിക്കുന്നു[a] എന്ന് അവന്റെ ശിഷ്യന്മാർ ഓർത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ വിഴുങ്ങിക്കളഞ്ഞിരിക്കുന്നു”; ചില പാഠപാരമ്പര്യങ്ങളിൽ സങ്കീർത്തനം 69:9-ന്റെ വാചകം ഇങ്ങനെയാണ്. എന്നാൽ ഇവിടെ യോഹന്നാന്റെ ഗ്രീക്ക് പാഠം “എന്നെ വിഴുങ്ങിക്കളയും” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: ഓർത്തു
  rationale: മധ്യമാർഥത്തിൽ പ്രയോഗിക്കപ്പെട്ട ഈ ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ ആധുനിക മലയാള പരിഭാഷയാണ് ‘ഓർത്തു’.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലെ μαθητής എന്ന പദത്തിന് നിലവാരമുള്ളതും പ്രസക്തിക്കു യോജിച്ചതുമായ മലയാള പ്രയോഗം.
- source_word: γεγραμμένον ἐστίν
  choice: എഴുതപ്പെട്ടിരിക്കുന്നത്
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ പൂർത്തിയായതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഭാവം ഇത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ζῆλος
  choice: തീക്ഷ്ണത
  rationale: ഭവനത്തിനുവേണ്ടിയുള്ള തീവ്രമായ സമർപ്പണവും ഉത്സാഹവും സൂചിപ്പിക്കുന്നു; ‘എരിവ്’ എന്ന പരമ്പരാഗത പദത്തേക്കാൾ സാധാരണ ആധുനിക വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: οἴκου
  choice: ഭവനം
  rationale: സന്ദർഭത്തിൽ ദൈവാലയത്തെയാണ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, ഉദ്ധരണിയിലെ ‘വീട്/ഭവനം’ എന്ന രൂപകം നിലനിർത്തുകയും ‘ആലയം’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καταφάγεταί
  choice: വിഴുങ്ങിക്കളയും
  rationale: ഭാവികാലരൂപവും ‘പൂർണമായി തിന്നുകളയുക/വിഴുങ്ങുക’ എന്ന ക്രിയയുടെ ശക്തമായ ദൃശ്യഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: με
  choice: എന്നെ
  rationale: സങ്കീർത്തനത്തിലെ സംസാരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
theological_decisions:
- issue: യേശുവിനോട് ബന്ധപ്പെടുത്തി ഉദ്ധരിക്കുന്ന സങ്കീർത്തനവാക്യത്തിലെ ക്രിയയുടെ കാലം
  choice: ‘എന്നെ വിഴുങ്ങിക്കളയും’ എന്ന ഭാവികാലവായന നിലനിർത്തി
  alternative: ‘എന്നെ വിഴുങ്ങിക്കളഞ്ഞിരിക്കുന്നു’
  rationale: യോഹന്നാന്റെ SBLGNT ഗ്രീക്ക് പാഠത്തിൽ καταφάγεταί എന്നത് ഭാവികാലരൂപമാണ്. ചില സങ്കീർത്തനപാഠപാരമ്പര്യങ്ങളിലെ ഭൂത/പൂർണകാല വായനയുമായി ഒത്തുചേർക്കാതെ യോഹന്നാന്റെ സ്വന്തം വാക്കുകൾ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിയുടെ പഴയനിയമബന്ധം നിലനിർത്താൻ ‘ഭവനം’ ഉപയോഗിച്ചു; സന്ദർഭാർഥം ചേർത്ത് ‘ആലയം’ എന്നു മാറ്റിയില്ല. ഉദ്ധരണിക്കുമുമ്പുള്ള ‘ഇങ്ങനെ’ മലയാളത്തിലെ സ്വാഭാവിക അവതരണത്തിനായി ചേർത്തതാണ്; പുതിയ ആശയം ചേർക്കുന്നില്ല.
