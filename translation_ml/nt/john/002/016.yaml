id: JHN.2.16
reference: John 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: ml
  text: 'പ്രാവുകളെ വിൽക്കുന്നവരോട് അവൻ പറഞ്ഞു: “ഇവ ഇവിടെനിന്ന് എടുത്തുകൊണ്ടുപോകൂ. എന്റെ പിതാവിന്റെ ഭവനം വ്യാപാരഭവനമാക്കരുത്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചന്തസ്ഥലമാക്കരുത്.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “വ്യാപാരത്തിന്റെ ഭവനമാക്കരുത്” എന്നാണ്; വാക്യത്തിലെ “ഭവനം” എന്ന പദത്തിന്റെ ആവർത്തനം മുഖ്യപാഠത്തിൽ “വ്യാപാരഭവനം” എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: പ്രാവുകളെ
  rationale: ബലിക്കായി വിൽക്കപ്പെട്ടിരുന്ന പക്ഷികളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആലയസന്ദർഭത്തിൽ ‘പ്രാവുകൾ’ സ്വാഭാവികവും സാധാരണക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: πωλοῦσιν
  choice: വിൽക്കുന്നവരോട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം അവരുടെ തുടരുന്ന വ്യാപാരപ്രവർത്തനത്തെ അടിസ്ഥാനമാക്കി ആ കൂട്ടത്തെ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: Ἄρατε
  choice: എടുത്തുകൊണ്ടുപോകൂ
  rationale: നിർണായകമായ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുകയും അവിടെനിന്നുള്ള നീക്കം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ταῦτα
  choice: ഇവ
  rationale: നപുംസകലിംഗ ബഹുവചന സൂചകസർവനാമത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; പക്ഷികളെയോ അവയോടു ബന്ധപ്പെട്ട സാധനങ്ങളെയോ മാത്രമായി അതിനെ ചുരുക്കുന്നില്ല.
- source_word: ἐντεῦθεν
  choice: ഇവിടെനിന്ന്
  rationale: സംസാരിക്കുന്ന സ്ഥലത്തുനിന്നുള്ള നീക്കം നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: μὴ ποιεῖτε
  choice: ആക്കരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞയുടെ നിരോധനാർഥം നേരിട്ട് നൽകുന്നു; ‘നിർത്തുക’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: οἶκον τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ ഭവനം
  rationale: ആലയത്തെ സൂചിപ്പിക്കുന്നതോടൊപ്പം യേശുവിന്റെ വ്യക്തമായ ഏകവചന പിതൃബന്ധാവകാശവും മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: οἶκον ἐμπορίου
  choice: വ്യാപാരഭവനം
  rationale: വ്യാപാരം/വാണിജ്യം എന്ന അർഥം നൽകുകയും ഗ്രീക്കിലെ ‘ഭവനം … ഭവനം’ എന്ന വാചകീയ ആവർത്തനം മലയാളത്തിലും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആലയത്തെ യേശു ‘എന്റെ പിതാവിന്റെ ഭവനം’ എന്നു വിളിക്കുന്നത്
  choice: ‘എന്റെ പിതാവിന്റെ ഭവനം’ എന്ന വ്യക്തമായ ഏകവചന പിതൃബന്ധപ്രസ്താവന നിലനിർത്തി.
  alternative: ‘നമ്മുടെ പിതാവിന്റെ ഭവനം’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ ഭവനം’
  rationale: ഗ്രീക്കിൽ πατρός എന്നതിനൊപ്പം ഏകവചന ഉടമസ്ഥസർവനാമമായ μου വ്യക്തമായി വരുന്നു. അതിനാൽ പാഠത്തിലുള്ള പുത്രബന്ധവും അധികാരസൂചനയും മയപ്പെടുത്താതെയും അതിനപ്പുറം വികസിപ്പിക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘വ്യാപാരഭവനം’ സാധാരണ ‘ചന്തസ്ഥലം’ എന്നതിനെക്കാൾ അല്പം ഔപചാരികമാണെങ്കിലും, മൂലത്തിലെ οἶκος എന്ന പദത്തിന്റെ ആവർത്തനവും വാചകീയ വൈരുധ്യവും നിലനിർത്താൻ ഉദ്ദേശപൂർവം തെരഞ്ഞെടുത്തു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘പ്രാവുകൾ’ എന്നതിനു ശേഷമാണെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം οἶκον ἐμπορίου എന്ന പ്രയോഗത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ചിഹ്നം അതിനോടു ചേർത്തു.
