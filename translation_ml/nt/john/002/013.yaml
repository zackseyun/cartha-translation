source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: ml
  text: യഹൂദന്മാരുടെ പെസഹ അടുത്തിരുന്നു[a]; യേശു യെരൂശലേമിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദ്യരുടെ പെസഹ.’ യോഹന്നാനിൽ Ἰουδαῖοι എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ ‘യഹൂദന്മാർ’ എന്നതിനുപകരം ‘യെഹൂദ്യർ’ എന്ന് അർഥമാകാം; എന്നാൽ ഇവിടെ അത് യഹൂദരുടെ ഉത്സവത്തെ തിരിച്ചറിയിക്കുന്നതായാണ് ഏറ്റവും സ്വാഭാവികം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς
  choice: അടുത്തിരുന്നു
  rationale: ഇവിടെ സമയപരമായ സമീപ്യം സൂചിപ്പിക്കുന്നു. ‘അടുത്തിരുന്നു’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: πάσχα
  choice: പെസഹ
  rationale: യഹൂദരുടെ പെസഹോത്സവത്തിനുള്ള മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പദം.
- source_word: τῶν Ἰουδαίων
  choice: യഹൂദന്മാരുടെ
  rationale: ഇവിടെ ഈ പദം പെസഹയെ യഹൂദോത്സവമായി തിരിച്ചറിയിക്കുന്നു. യോഹന്നാനിൽ ചില സന്ദർഭങ്ങളിൽ ‘യെഹൂദ്യർ’ എന്ന പ്രാദേശിക അർഥം സാധ്യമാകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀνέβη
  choice: കയറിപ്പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള ഉയർന്നുപോകലും തീർഥയാത്രാഭാഷയും പ്രതിഫലിപ്പിക്കുന്ന മൂലക്രിയയുടെ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: നഗരനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: Καὶ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല; വാക്യബന്ധത്തിലൂടെ പ്രകടമാക്കി
  rationale: ആദ്യ καί ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർബന്ധമായി ‘അപ്പോൾ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കാതെ സ്വാഭാവികമായി വാക്യം തുടങ്ങുന്നത് മൂലത്തിൽ ഇല്ലാത്ത സമയസൂചന ഒഴിവാക്കുന്നു. രണ്ടാമത്തെ καί അർധവിരാമത്തിലൂടെ വാക്യഘടകങ്ങളെ ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യഹൂദന്മാരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: ഈ വാക്യത്തിൽ പദം പെസഹയെ യഹൂദോത്സവമായി തിരിച്ചറിയിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. എന്നാൽ യോഹന്നാനിൽ പദത്തിന് ചിലപ്പോൾ പ്രാദേശികമായ ‘യെഹൂദ്യർ’ എന്ന അർഥം ഉണ്ടാകാവുന്നതിനാൽ ആ യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പെസഹ’, ‘യെരൂശലേം’ എന്നീ സ്ഥാപിത ബൈബിൾരൂപങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ ആഖ്യാനാരംഭപദം ചേർത്തിട്ടില്ല.
