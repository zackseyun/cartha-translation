id: JHN.2.22
reference: John 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടപ്പോൾ[a], യേശു ഇങ്ങനെ പറഞ്ഞിരുന്നുവെന്ന്[b] അവന്റെ ശിഷ്യന്മാർ ഓർത്തു; അവർ തിരുവെഴുത്തിനെയും യേശു പറഞ്ഞ വചനത്തെയും[c] വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റപ്പോൾ.” ഗ്രീക്ക് ക്രിയ കർമണിപ്രയോഗത്തിലാണ്—“ഉയിർപ്പിക്കപ്പെട്ടപ്പോൾ”; അതാണ് മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യേശു ഇങ്ങനെ പറഞ്ഞുവെന്ന്.” ഗ്രീക്കിലെ അപൂർണഭൂതകാലക്രിയ മുമ്പുണ്ടായിരുന്ന തുടർച്ചയായതോ ആവർത്തിച്ചതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: “വചനം” എന്നതിനു പകരം “പ്രസ്താവന” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദത്തിന് പറഞ്ഞ വാക്ക്, പ്രസ്താവന, സന്ദേശം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: അതുകൊണ്ട്, ...പ്പോൾ
  rationale: ὅτε എന്നതിന്റെ കാലസൂചനയും οὖν എന്നതിന്റെ നിഗമനാത്മകമായ ആഖ്യാനബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും സന്ദർഭത്തിൽ മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ബഹുവചനപ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്ന, മലയാളത്തിൽ വ്യക്തമായ പുനരുത്ഥാനപ്രയോഗമാണിത്.
- source_word: ἐμνήσθησαν
  choice: ഓർത്തു
  rationale: മുമ്പ് കേട്ട കാര്യം പിന്നീട് ഓർമയിൽ വന്നുവെന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: യേശു ഇങ്ങനെ പറഞ്ഞിരുന്നുവെന്ന്
  rationale: ἔλεγεν എന്ന അപൂർണഭൂതകാലരൂപത്തിന്റെ മുൻകാലത്തുടർച്ചാസാധ്യത സംരക്ഷിക്കാൻ ‘പറഞ്ഞിരുന്നു’ ഉപയോഗിക്കുന്നു; മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ കർത്താവായ യേശുവിനെ വ്യക്തമാക്കുന്നു.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചു
  rationale: വിശ്വസിക്കുക എന്ന അടിസ്ഥാനാർഥം വ്യാഖ്യാനാത്മകമായ അധികവിവരമില്ലാതെ നൽകുന്നു.
- source_word: τῇ γραφῇ
  choice: തിരുവെഴുത്ത്
  rationale: ഗ്രീക്കിലെ ഏകവചനം സംരക്ഷിച്ചുകൊണ്ട് അധികാരമുള്ള വിശുദ്ധലിഖിതത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: τῷ λόγῳ
  choice: വചനം
  rationale: ഇവിടെ യേശു പറഞ്ഞ ഉക്തിയെയാണ് λόγος സൂചിപ്പിക്കുന്നത്; യോഹന്നാന്റെ പദപ്രയോഗവുമായി ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: യേശു പറഞ്ഞ
  rationale: λόγος-നെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനക്രിയയുടെ കർമണിപ്രയോഗം
  choice: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടു
  alternative: അവൻ മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റു
  rationale: ഗ്രീക്ക് രൂപം കർമണിയാണ്; അതു നിലനിർത്തുന്നത് വാക്യത്തിന്റെ വ്യാകരണസൂചന മായ്ച്ചുകളയാതിരിക്കാൻ സഹായിക്കുന്നു, അതേസമയം കർത്താവിനെ വാചകത്തിൽ ചേർത്ത് വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: πιστεύω എന്ന ക്രിയയും അതിന്റെ വിഷയങ്ങളും
  choice: തിരുവെഴുത്തിനെയും ... വചനത്തെയും വിശ്വസിച്ചു
  alternative: തിരുവെഴുത്തിലും ... വചനത്തിലും വിശ്വാസമർപ്പിച്ചു
  rationale: ‘വിശ്വസിച്ചു’ എന്നത് ഏറ്റവും കുറച്ച് വ്യാഖ്യാനം ചേർക്കുന്ന സ്വാഭാവിക വിവർത്തനമാണ്; വെളിപ്പെടുത്തപ്പെട്ട വചനത്തോടുള്ള ശിഷ്യന്മാരുടെ പ്രതികരണത്തെ വികസിപ്പിച്ചു പറയുന്നില്ല.
- issue: ἔλεγεν എന്ന അപൂർണഭൂതകാലത്തിന്റെ സൂക്ഷ്മത
  choice: പറഞ്ഞിരുന്നു
  alternative: പറഞ്ഞു
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലം തുടർച്ചയായതോ ആവർത്തിച്ചതോ ആയ മുൻകാലസംസാരത്തിന് ഇട നൽകുന്നു. മുഖ്യപാഠം ആ സാധ്യത നിലനിർത്തുന്നു; എന്നാൽ നിർബന്ധമായ ആവർത്തനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തിരുവെഴുത്ത്’, ‘വചനം’, ‘ഉയിർപ്പിക്കപ്പെട്ടു’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിക്കുന്നവയാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവയാണ്. ഗ്രീക്കിലെ കർമണിപ്രയോഗം, ഏകവചനം, അപൂർണഭൂതകാലത്തിന്റെ സാധ്യത എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
