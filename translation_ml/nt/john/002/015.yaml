id: JHN.2.15
reference: John 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: ml
  text: ചരടുകൾകൊണ്ട് ഒരു ചാട്ടവാർ ഉണ്ടാക്കിയശേഷം, അവൻ എല്ലാവരെയും ദൈവാലയാങ്കണത്തിൽനിന്ന്[a] പുറത്താക്കി—ആടുകളെയും കന്നുകാലികളെയും ഉൾപ്പെടെ.[b] നാണയം മാറ്റുന്നവരുടെ നാണയങ്ങൾ ചൊരിഞ്ഞുകളഞ്ഞു, മേശകൾ മറിച്ചിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദൈവാലയം’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് ἱερόν, അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയോ അതിന്റെ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ഗ്രീക്ക് വാചകം ആദ്യം ‘എല്ലാവരെയും’ എന്നു പറഞ്ഞശേഷം ‘ആടുകളെയും കന്നുകാലികളെയും’ എന്നു വ്യക്തമാക്കുന്നു. ചാട്ടവാർ മനുഷ്യരുടെമേൽ ഉപയോഗിച്ചുവെന്ന് വാചകം തുറന്നുപറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: ഉണ്ടാക്കിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: φραγέλλιον
  choice: ചാട്ടവാർ
  rationale: അടിക്കാനോ ഓടിക്കാനോ ഉപയോഗിക്കുന്ന whip എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്ന പദം.
- source_word: ἐκ σχοινίων
  choice: ചരടുകൾകൊണ്ട്
  rationale: ചരടോ നേർത്ത കയറോ എന്ന വസ്തുസൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ ഉപകരണം ഉണ്ടാക്കിയ വസ്തു സ്വാഭാവികമായി പറയുന്നു.
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: പുരുഷലിംഗ ബഹുവചന accusative-ന്റെ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുന്നു; തുടർന്നുള്ള മൃഗപരാമർശവുമായി അതിന്റെ ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξέβαλεν
  choice: പുറത്താക്കി
  rationale: ബലമായി പുറത്താക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: τοῦ ἱεροῦ
  choice: ദൈവാലയാങ്കണത്തിൽനിന്ന്
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയോ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നതിനാൽ ഈ വ്യത്യാസം വാചകത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: ആടുകളെയും കന്നുകാലികളെയും കൂടെ
  rationale: τε...καί ഘടനയുടെ ഉൾപ്പെടുത്തൽബലം നൽകുന്നു; βοῦς എന്നത് കാളകൾ എന്നു ചുരുക്കാതെ കന്നുകാലികൾ എന്ന വിശാലവും സ്വാഭാവികവുമായ പദത്തിൽ നൽകുന്നു.
- source_word: κολλυβιστῶν
  choice: നാണയം മാറ്റുന്നവർ
  rationale: ദൈവാലയസന്ദർഭത്തിൽ വിവിധ നാണയങ്ങൾ മാറ്റിക്കൊടുത്തവരെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: നാണയങ്ങൾ ചൊരിഞ്ഞുകളയുകയും
  rationale: ἐκχέω എന്നതിലെ ‘ചൊരിയുക’ എന്ന ദൃശ്യബലം നിലനിർത്തുന്നു; κέρματα സാധാരണമായി ‘നാണയങ്ങൾ’ എന്നു നൽകുന്നു.
- source_word: ἀνέστρεψεν
  choice: മേശകൾ മറിച്ചിടുകയും ചെയ്തു
  rationale: ഈ സന്ദർഭത്തിലെ overturn/upset എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവാലയത്തിലെ യേശുവിന്റെ നടപടിയുടെ വ്യാപ്തിയും ചാട്ടവാറിന്റെ ഉപയോഗവും
  choice: ‘എല്ലാവരെയും’ എന്ന് പരിഭാഷപ്പെടുത്തി, തുടർന്ന് ആടുകളെയും കന്നുകാലികളെയും ഉൾപ്പെടുത്തി; ചാട്ടവാർ മനുഷ്യരുടെമേൽ ഉപയോഗിച്ചുവെന്ന് വാചകത്തിൽ വ്യക്തമാക്കിയില്ല.
  alternative: എല്ലാ മനുഷ്യരെയും മൃഗങ്ങളെയും പുറത്താക്കി; അല്ലെങ്കിൽ മൃഗങ്ങളെ മാത്രം പുറത്താക്കി.
  rationale: ഗ്രീക്കിൽ πάντας എന്നതിനു പിന്നാലെ ആടുകളും കന്നുകാലികളും പറയപ്പെടുന്നു. എന്നാൽ ചാട്ടവാർ മനുഷ്യരുടെമേൽ ഉപയോഗിച്ചുവെന്ന് വാക്യം തുറന്നുപറയുന്നില്ല. അതിനാൽ മൂലവാചകത്തിലെ വ്യാപ്തിയും അവ്യക്തതയും ഒരുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ദൈവാലയാങ്കണം’, ‘ചാട്ടവാർ’, ‘നാണയം മാറ്റുന്നവർ’ എന്നീ പദങ്ങൾ ചരിത്രസന്ദർഭം വ്യക്തമായി നൽകുമ്പോഴും അനാവശ്യമായ സഭാവിഭാഗീയ ഭാഷ ഒഴിവാക്കുന്നു.
