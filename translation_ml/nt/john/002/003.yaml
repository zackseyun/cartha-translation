id: JHN.2.3
reference: John 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: ml
  text: 'വീഞ്ഞ് തീർന്നപ്പോൾ[a] യേശുവിന്റെ അമ്മ അവനോടു പറയുന്നു[b]: “അവർക്ക് വീഞ്ഞില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘വീഞ്ഞ് കുറവായപ്പോൾ.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ഇവിടെ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ്; ചില വിവർത്തനങ്ങൾ ‘പറഞ്ഞു’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: വീഞ്ഞു തീർന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള എയോറിസ്റ്റ് കൃുദന്തം മുഖ്യക്രിയയ്ക്കു പശ്ചാത്തലമായ സാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘വീഞ്ഞു തീർന്നപ്പോൾ’ എന്നത് ക്ഷാമത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്ക് വിവരണത്തിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തുന്നു. യോഹന്നാന്റെ സജീവമായ ആഖ്യാനശൈലി മലയാളത്തിലും സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ അമ്മ
  rationale: ഗ്രീക്കിലെ പ്രയോഗത്തെ അടുത്ത് പിന്തുടരുകയും ഈ സന്ദർഭത്തിൽ യോഹന്നാൻ അവരെ പരാമർശിക്കുന്ന പ്രത്യേക രീതി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവനോട്
  rationale: λέγει എന്ന സംസാരക്രിയയോടൊപ്പം, ആരോടാണ് പറയുന്നതെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: അവർക്കു വീഞ്ഞില്ല
  rationale: ബഹുവചനക്രിയയുടെ കർത്താവ് മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല. ‘അവർക്ക്’ എന്നത് ആ അവ്യക്തത നിലനിർത്തുന്നു; വിവാഹവീട്ടുകാർ എന്നോ മറ്റോ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: οἶνος
  choice: വീഞ്ഞ്
  rationale: സന്ദർഭത്തിൽ പദത്തിന്റെ സാധാരണ അർഥമായ വീഞ്ഞ് തന്നെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനെ ദുർബലപ്പെടുത്തുകയോ പരാവർത്തനം ചെയ്യുകയോ ചെയ്യേണ്ട കാരണമില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലം
  choice: ‘പറയുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തി
  alternative: മലയാളത്തിലെ സാധാരണ ഭൂതകാല ആഖ്യാനത്തിനായി ‘പറഞ്ഞു’ എന്നു നൽകുക
  rationale: ഇത് പ്രധാനമായും വിവർത്തനപരമായ തീരുമാനമാണ്. വർത്തമാനകാലം നിലനിർത്തുന്നത് ഗ്രീക്ക് ആഖ്യാനത്തിന്റെ സജീവത പ്രതിഫലിപ്പിക്കുന്നു; ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം സൃഷ്ടിക്കുന്നില്ല.
- issue: ‘അവർക്കു വീഞ്ഞില്ല’ എന്നതിലെ സൂചിത ബഹുവചന കർത്താവിന്റെ പരാമർശം
  choice: ‘അവർക്ക്’ എന്നു മാത്രം നൽകി പരാമർശത്തിന്റെ അവ്യക്തത നിലനിർത്തി
  alternative: ‘വിവാഹവീട്ടുകാർക്ക്’ അല്ലെങ്കിൽ ‘വിവാഹസംഘത്തിന്’ എന്നു കർത്താവിനെ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് നേരിട്ട് പറയുന്നില്ല. അതിനാൽ സന്ദർഭത്തിന് അപ്പുറമുള്ള വിശദാംശം ചേർക്കാതെ യഥാർഥ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വാക്യം ചുരുക്കവും നേരിട്ടതുമായി സൂക്ഷിച്ചു; മൂലപാഠത്തിലെ ചരിത്രവർത്തമാനകാലവും സൂചിത ബഹുവചന കർത്താവിന്റെ അവ്യക്തതയും നിലനിർത്തി.
