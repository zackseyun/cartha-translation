source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: ml
  text: മനുഷ്യനെക്കുറിച്ച്[a] ആരെങ്കിലും സാക്ഷ്യം പറയേണ്ട ആവശ്യം അവന് ഉണ്ടായിരുന്നില്ല; കാരണം, മനുഷ്യന്റെ ഉള്ളിൽ എന്താണെന്ന് അവൻതന്നെ അറിഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഒരു വ്യക്തിയെക്കുറിച്ച്’ / ‘ഒരു വ്യക്തിയുടെ ഉള്ളിൽ എന്താണെന്ന്.’ ഗ്രീക്കിൽ ഏകവചനത്തിലുള്ള ‘മനുഷ്യൻ’ എന്ന പദം ഒരു മനുഷ്യനെയോ മനുഷ്യവർഗത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: ആവശ്യം അവനില്ലായിരുന്നു
  rationale: χρείαν ἔχειν എന്ന പ്രയോഗത്തിന്റെ ‘ആവശ്യമുണ്ടായിരിക്കുക’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിഷേധരൂപത്തോടെ നിലനിർത്തുന്നു.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: ആരും സാക്ഷ്യം പറയേണ്ട
  rationale: μαρτυρέω എന്നതിന്റെ സാക്ഷ്യ/മൊഴി അർഥം നിലനിർത്തുകയും, χρείαν εἶχεν എന്നതിനുശേഷമുള്ള ἵνα ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: മനുഷ്യനെക്കുറിച്ച്
  rationale: ഏകവചനത്തിലുള്ള ἄνθρωπος ഇവിടെ പൊതുവാചകമായി ഒരു മനുഷ്യനെയോ മനുഷ്യവർഗത്തെയോ സൂചിപ്പിക്കാം. ‘മനുഷ്യൻ’ ഈ പ്രതിനിധാന ഏകവചനവും പിന്നാലെയുള്ള ആവർത്തനവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: αὐτὸς γὰρ
  choice: കാരണം ... അവൻതന്നെ
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’ കൊണ്ടും, ഊന്നലുള്ള αὐτός ‘അവൻതന്നെ’ കൊണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: ἐγίνωσκεν
  choice: അറിഞ്ഞിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർച്ചയായോ സ്വഭാവസിദ്ധമായോ ഉള്ള അറിവിനെ സൂചിപ്പിക്കുന്നു; ‘അറിഞ്ഞിരുന്നു’ മലയാളത്തിൽ ആ നിലനിൽക്കുന്ന ഭൂതകാല അറിവ് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: മനുഷ്യന്റെ ഉള്ളിൽ എന്താണെന്ന്
  rationale: ἐν എന്ന ആന്തരികതയും വാക്യത്തിന്റെ ഉദ്ദേശപൂർവമായ വിശാലതയും നിലനിർത്തുന്നു; അത് വ്യക്തിയുടെ അന്തരംഗമോ പൊതുവായ മനുഷ്യാവസ്ഥയോ എന്നു വിവർത്തനം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: മനുഷ്യനെ സംബന്ധിച്ച യേശുവിന്റെ അറിവിന്റെ വ്യാപ്തി
  choice: മനുഷ്യന്റെ ഉള്ളിൽ എന്താണെന്ന് അവൻ നേരിട്ട് അറിഞ്ഞിരുന്നു എന്ന വിശാലമായ പ്രസ്താവന നിലനിർത്തുക
  alternative: ഓരോ വ്യക്തിയുടെയും ഉള്ളിലുള്ളത്; അല്ലെങ്കിൽ മനുഷ്യസ്വഭാവം പൊതുവിൽ
  rationale: ἀνθρώπου/ἀνθρώπῳ എന്ന പൊതുവാചക ഏകവചനം വ്യക്തിപരവും പൊതുവുമായ സൂചനകൾ ഉൾക്കൊള്ളാം. സാമൂഹിക ഉൾക്കാഴ്ചയായി ചുരുക്കാതെയും സിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്ത് വികസിപ്പിക്കാതെയും മൂലപാഠത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സാക്ഷ്യം പറയുക’ യോഹന്നാനിലെ സാക്ഷ്യഭാഷ നിലനിർത്തുന്നു; ‘മനുഷ്യൻ’ എന്ന പൊതുവാചക ഏകവചനം രണ്ടു ഉപവാക്യങ്ങളിലും പ്രതിധ്വനിപ്പിക്കുന്നു.
