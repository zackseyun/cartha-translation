id: JHN.2.10
reference: John 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “എല്ലാവരും[a] ആദ്യം നല്ല വീഞ്ഞ് വിളമ്പുന്നു; അവർ മദ്യലഹരിയിലായിക്കഴിയുമ്പോൾ[b] നിലവാരം കുറഞ്ഞ വീഞ്ഞ് വിളമ്പുന്നു. എന്നാൽ നീ നല്ല വീഞ്ഞ് ഇതുവരെ സൂക്ഷിച്ചുവച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഓരോ മനുഷ്യനും’ എന്ന ഏകവചന പൊതുപ്രയോഗം; പുരുഷന്മാരെ മാത്രം അല്ല, ആളുകളെ പൊതുവായി ഉദ്ദേശിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘മദ്യലഹരിയിലാകുമ്പോൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ സാധാരണയായി മദ്യലഹരിയിലാകുക എന്നാണ് അർഥമാക്കുന്നത്; ചില വിവർത്തനങ്ങൾ അതിനെ ‘ധാരാളം കുടിച്ചുകഴിയുമ്പോൾ’ എന്നു മയപ്പെടുത്തി പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: അവൻ അയാളോടു പറഞ്ഞു
  rationale: λέγει ഇവിടെ ചരിത്രവർത്തമാനമാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ ഭൂതകാല ആഖ്യാനരീതി ‘പറഞ്ഞു’ എന്നതാണ്.
- source_word: Πᾶς ἄνθρωπος
  choice: എല്ലാവരും
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുപ്രയോഗം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ആളുകളെ പൊതുവായി ഉദ്ദേശിക്കുന്നതിനാൽ ‘എല്ലാവരും’ സ്വാഭാവികവും അർഥകൃത്യവുമാണ്.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: ക്രമത്തെ സൂചിപ്പിക്കുന്ന ഈ ക്രിയാവിശേഷണത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: τὸν καλὸν οἶνον
  choice: നല്ല വീഞ്ഞ്
  rationale: καλός ഇവിടെ വീഞ്ഞിന്റെ ഗുണനിലവാരത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്ന് പറയുന്ന നിലവാരം കുറഞ്ഞ വീഞ്ഞിനോടുള്ള വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τίθησιν
  choice: വിളമ്പുന്നു
  rationale: അടിസ്ഥാന അർഥം ‘വയ്ക്കുന്നു’ എന്നാണെങ്കിലും, വിരുന്നിന്റെ സന്ദർഭത്തിൽ പാനീയം അതിഥികൾക്കു നൽകുന്നതിനെ ‘വിളമ്പുന്നു’ എന്ന് പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: ὅταν μεθυσθῶσιν
  choice: ആളുകൾ ലഹരിയിലായിക്കഴിയുമ്പോൾ
  rationale: μεθύω സാധാരണയായി മദ്യലഹരിയിലാകുക എന്നാണ്; aorist രൂപത്തിലെ പൂർത്തീകരണഭാവം ‘ആയിക്കഴിയുമ്പോൾ’ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിലെ ശക്തി മയപ്പെടുത്തുന്നില്ല.
- source_word: τὸν ἐλάσσω
  choice: നിലവാരം കുറഞ്ഞതും
  rationale: ἐλάσσων ഗുണത്തിൽ ‘കുറഞ്ഞത്’ അഥവാ ‘താണത്’ എന്ന താരതമ്യാർഥം നൽകുന്നു; ‘വീഞ്ഞ്’ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതിനാൽ ആവർത്തിച്ചിട്ടില്ല.
- source_word: τετήρηκας
  choice: നീ ... സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് perfect രൂപം ഇതുവരെ സൂക്ഷിച്ചതിന്റെ ഇപ്പോഴത്തെ ഫലം പ്രകടമാക്കുന്നു; മലയാളത്തിലെ ‘സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു’ അതു വ്യക്തമായി കൈമാറുന്നു.
- source_word: ἕως ἄρτι
  choice: ഇതുവരെ
  rationale: ആഖ്യാനത്തിലെ ഇപ്പോഴത്തെ നിമിഷംവരെയുള്ള കാലപരിധിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വീഞ്ഞുമായി ബന്ധപ്പെട്ട അത്ഭുതത്തിന്റെ സന്ദർഭത്തിൽ μεθυσθῶσιν എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ലഹരിയിലായിക്കഴിയുമ്പോൾ
  alternative: ധാരാളം കുടിച്ചുകഴിയുമ്പോൾ / വേണ്ടുവോളം കുടിച്ചുകഴിയുമ്പോൾ
  rationale: μεθύω എന്ന ക്രിയയുടെ സാധാരണ അർഥം മദ്യലഹരിയിലാകുക എന്നാണ്. ധാർമിക അസൗകര്യം ഒഴിവാക്കാൻ അതിനെ മയപ്പെടുത്താതെ, വിരുന്നിന്റെ ചുമതലക്കാരൻ പറയുന്ന സാമൂഹിക നിരീക്ഷണമായി അതിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു; ഈ പ്രസ്താവന മദ്യപാനത്തെ അംഗീകരിക്കുന്നു എന്ന് വിവർത്തനം കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വിരുന്നിന്റെ സന്ദർഭത്തിൽ ‘വിളമ്പുന്നു’ ഉപയോഗിച്ചു; ലഹരിയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ തുറന്ന പ്രയോഗം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
