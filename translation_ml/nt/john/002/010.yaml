  to: 'അവൻ അവനോടു പറഞ്ഞു: “എല്ലാവരും[a] ആദ്യം നല്ല വീഞ്ഞ് വിളമ്പുന്നു; അവർ മദ്യലഹരിയിലായിക്കഴിയുമ്പോൾ[b] നിലവാരം കുറഞ്ഞ വീഞ്ഞ് വിളമ്പുന്നു. എന്നാൽ നീ നല്ല വീഞ്ഞ് ഇതുവരെ സൂക്ഷിച്ചുവച്ചിരിക്കുന്നു.”'
