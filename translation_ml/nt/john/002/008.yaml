id: JHN.2.8
reference: John 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇപ്പോൾ കുറച്ച് കോരിയെടുത്ത് വിരുന്നിന്റെ മേൽനോട്ടക്കാരന്റെ അടുക്കൽ കൊണ്ടുപോകുവിൻ.” അങ്ങനെ അവർ കൊണ്ടുപോയി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: വിവരണത്തിലെ ഗ്രീക്ക് ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἀντλήσατε
  choice: കുറച്ച് കോരിയെടുത്ത്
  rationale: ദ്രാവകം കോരിയെടുക്കുക എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ വ്യക്തമായ അളവുകുറഞ്ഞ കർമം സ്വാഭാവിക മലയാളത്തിനായി സൂചിപ്പിക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: കല്പനയുടെ അടിയന്തരത വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള കാലസൂചകം.
- source_word: φέρετε
  choice: കൊണ്ടുപോകുക
  rationale: ശുശ്രൂഷകരുടെ സ്ഥാനത്തുനിന്ന് ദ്രാവകം മേൽനോട്ടക്കാരന്റെ അടുക്കലേക്ക് നീക്കുന്നതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀρχιτρικλίνῳ
  choice: വിരുന്നിന്റെ മേൽനോട്ടക്കാരന്റെ അടുക്കൽ
  rationale: വിരുന്നിന്റെ ക്രമീകരണച്ചുമതലയുള്ള വ്യക്തിയെ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ δὲ ἤνεγκαν
  choice: അങ്ങനെ അവർ കൊണ്ടുപോയി
  rationale: δέയുടെ ലഘുവായ ബന്ധകസ്വഭാവവും കല്പന അനുസരിച്ചുള്ള പ്രവൃത്തിയും സ്വാഭാവികമായി നൽകുന്നു; മലയാളത്തിൽ കർമം ആവർത്തിക്കേണ്ടതില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമം ഉപയോഗിച്ചു.
