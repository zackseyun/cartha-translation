id: JHN.2.7
reference: John 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “വെള്ളപ്പാത്രങ്ങളിൽ വെള്ളം നിറയ്ക്കുക.” അവർ അവ വക്കോളം നിറച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ ഭൂതകാലരൂപം അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: യേശുവിന്റെ വാക്കുകൾ ആരോടാണ് പറഞ്ഞതെന്ന് സൂചിപ്പിക്കുന്ന ബഹുവചന പരോക്ഷകർമം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Γεμίσατε
  choice: നിറയ്ക്കുക
  rationale: ബഹുവചന ആജ്ഞയുടെ നേരിട്ടുള്ള സ്വഭാവം നിലനിർത്തുന്ന, ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവിക രൂപം.
- source_word: τὰς ὑδρίας
  choice: വെള്ളപ്പാത്രങ്ങളിൽ
  rationale: ὑδρία വെള്ളം സൂക്ഷിക്കാനുള്ള വലിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ‘കൽപ്പാത്രങ്ങൾ’ എന്ന് ആവർത്തിച്ചിട്ടില്ലാത്തതിനാൽ ‘വെള്ളപ്പാത്രങ്ങൾ’ എന്നു മാത്രം നൽകി.
- source_word: ὕδατος
  choice: വെള്ളം
  rationale: γεμίζω എന്ന ക്രിയയോടൊപ്പമുള്ള ജനിറ്റീവ് പാത്രങ്ങളിൽ നിറയ്ക്കേണ്ട ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വെള്ളം നിറയ്ക്കുക’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ἐγέμισαν αὐτὰς
  choice: അവർ അവ ... നിറച്ചു
  rationale: പാത്രങ്ങളെ സൂചിപ്പിക്കുന്ന നപുംസക ബഹുവചന സർവനാമവും പൂർത്തിയായ പ്രവൃത്തിയും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἕως ἄνω
  choice: വക്കോളം
  rationale: പാത്രങ്ങൾ ഏറ്റവും മുകളോളം പൂർണമായി നിറച്ചുവെന്ന ആശയം സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു; ‘വായോളം’ എന്നതിനെക്കാൾ വിവിധ പാത്രരൂപങ്ങൾക്ക് യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളവായനയ്ക്ക് സ്വാഭാവികമായ ഭൂതകാലത്തിലാക്കി; വാക്യത്തിലെ കൽപ്പാത്രങ്ങൾ എന്ന മുൻസന്ദർഭവിവരം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
