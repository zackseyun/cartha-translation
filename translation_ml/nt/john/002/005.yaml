id: JHN.2.5
reference: John 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: ml
  text: 'അവന്റെ അമ്മ പരിചാരകരോട് പറഞ്ഞു: “അവൻ നിങ്ങളോട് എന്തു പറഞ്ഞാലും അതു ചെയ്യുക.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: അവന്റെ അമ്മ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും കഥയിലെ കുടുംബബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διακόνοις
  choice: ശുശ്രൂഷകരോട്
  rationale: വിവാഹവിരുന്നിൽ സേവനം ചെയ്തിരുന്നവരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സഭാപദവിയായ ‘ഡീക്കൻ’ എന്ന അർഥം ഉദ്ദേശിക്കുന്നില്ല. ‘ശുശ്രൂഷകർ’ സന്ദർഭത്തിന് യോജിച്ച മാന്യവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: Ὅ τι ἂν
  choice: എന്തു ... ആയാലും
  rationale: ἄν ചേർന്ന അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ തുറന്ന സാധ്യത ‘എന്തു പറഞ്ഞാലും’ എന്ന സ്വാഭാവിക മലയാളഘടന കൃത്യമായി പകർന്നുനൽകുന്നു.
- source_word: λέγῃ ὑμῖν
  choice: അവൻ നിങ്ങളോട് ... പറഞ്ഞാലും
  rationale: വർത്തമാനകാല subjunctive-ന്റെ അനിശ്ചിത ഭാവിസൂചന മലയാളത്തിൽ ‘പറഞ്ഞാലും’ എന്ന വ്യവസ്ഥാരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ποιήσατε
  choice: അതു ചെയ്യുക
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നിർണായക സ്വഭാവം ‘ചെയ്യുക’ നിലനിർത്തുന്നു; ‘അതു’ എന്നത് മുൻവാക്യത്തിലെ ‘എന്തു’ എന്നതിന്റെ സ്വാഭാവിക പ്രത്യയസൂചനയാണ്.
theological_decisions:
- issue: ‘അവൻ നിങ്ങളോട് എന്തു പറഞ്ഞാലും’ എന്നതിലെ പരോക്ഷ കർത്താവിന്റെ സൂചിതവ്യക്തി
  choice: ഗ്രീക്കിലെ പരോക്ഷ കർത്താവിനെ ‘അവൻ’ എന്നു നൽകി, സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കാൻ അനുവദിച്ചു.
  alternative: ‘യേശു നിങ്ങളോട് എന്തു പറഞ്ഞാലും അതു ചെയ്യുക.’
  rationale: സന്ദർഭം യേശുവാണ് സൂചിതവ്യക്തിയെന്ന് വ്യക്തമാക്കുന്നു; എങ്കിലും പേരുചേർക്കാതെ സർവനാമം ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുകയും അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. വാക്യം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർത്തിട്ടില്ല.
