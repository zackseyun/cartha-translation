revisions:
- from: 'യേശു അവളോടു പറഞ്ഞു: “അതിൽ എനിക്കും നിനക്കും എന്തു കാര്യം?[a] സ്ത്രീയേ,[b] എന്റെ നാഴിക ഇതുവരെ വന്നിട്ടില്ല.”'
  to: 'യേശു അവളോടു പറഞ്ഞു: “എനിക്കും നിനക്കും അതിൽ എന്തു കാര്യം?[a] സ്ത്രീയേ,[b] എന്റെ സമയം ഇനിയും വന്നിട്ടില്ല.”'
  rationale: ‘നാഴിക’യെ ‘സമയം’ എന്നു മാറ്റി, മൂലത്തിലെ ὥραയുടെ വിശാലമായ ‘അപ്പോയിന്റ് ചെയ്ത സമയം/ഘട്ടം’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ തെറ്റായ അളവുകോൽ-സൂചനയില്ലാതെ നൽകി. ആദ്യ ചോദ്യത്തിന്റെ പദക്രമം കൂടുതൽ സ്വാഭാവികമാക്കി. രണ്ട് അടിക്കുറിപ്പുകളുടെയും ആങ്കറുകളും ഉള്ളടക്കവും മൂലപാഠത്തിന്റെയും ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിന്റെയും സൂക്ഷ്മത നിലനിർത്തുന്നു.
