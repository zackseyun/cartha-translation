  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: ml
  text: 'യേശു അവളോടു പറഞ്ഞു: “എനിക്കും നിനക്കും അതിൽ എന്തു കാര്യം?[a] സ്ത്രീയേ,[b] എന്റെ സമയം ഇനിയും വന്നിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എനിക്ക് എന്ത്, നിനക്ക് എന്ത്?” താൽപര്യത്തിലോ ഉത്തരവാദിത്വത്തിലോ ഉള്ള അകലം പ്രകടിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്; ശത്രുത നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.'
    reason: lexical_alternative
  - marker: b
    text: അന്നത്തെ സാഹചര്യത്തിൽ “സ്ത്രീയേ” എന്നത് സാധാരണവും മാന്യവുമായ ഒരു അഭിസംബോധനയായിരിക്കാം; ഇന്നത്തെ മലയാളത്തിൽ അത് പെട്ടെന്നോ കടുപ്പമായോ കേൾക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ് രൂപമെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ കൂടുതൽ സ്വാഭാവികമാണ്; പ്രസംഗപ്രവർത്തനത്തിൽ മാറ്റമില്ല.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: അതിൽ എനിക്കും നിനക്കും എന്തു കാര്യം?
  rationale: ഈ സെമിറ്റിക്-ഗ്രീക്ക് പ്രയോഗം താൽപര്യത്തിലോ ഉത്തരവാദിത്വത്തിലോ ഉള്ള അകലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ മനസ്സിലാകുന്ന രീതിയിൽ നൽകുമ്പോഴും അതിലെ മിതമായ അകൽച്ച നിലനിർത്തുന്നു; ശത്രുതയെന്നോ ബന്ധനിഷേധമെന്നോ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: γύναι
  choice: സ്ത്രീയേ
  rationale: സംബോധനരൂപത്തിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു. ‘പ്രിയ സ്ത്രീയേ’ എന്നു ചേർത്താൽ മൂലത്തിൽ പ്രകടമല്ലാത്ത സ്നേഹഭാവം ഇറക്കുമതി ചെയ്യും; ‘മാഡം’ ഈ പശ്ചാത്തലത്തിന് സാംസ്കാരികമായി ചേരില്ല. ഇന്നത്തെ മലയാളത്തിൽ പദം കടുപ്പമായി കേൾക്കാമെന്നതിനാൽ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: οὔπω
  choice: ഇതുവരെ ... ഇല്ല
  rationale: പ്രസ്തുത സമയംവരെ സംഭവം ഉണ്ടായിട്ടില്ലെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു; ഭാവിയിൽ വരാമെന്ന സൂചനയും നിലനിൽക്കുന്നു.
- source_word: ἥκει
  choice: വന്നിട്ടില്ല
  rationale: എത്തിച്ചേരുക, സന്നിഹിതമാകുക എന്നീ ആശയങ്ങൾ നൽകുന്ന ക്രിയയെ ‘നാഴിക’യോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἡ ὥρα μου
  choice: എന്റെ നാഴിക
  rationale: ‘സമയം’ എന്ന പൊതുപദത്തേക്കാൾ ‘നാഴിക’ യോഹന്നാനിലെ ആവർത്തിക്കുന്ന ‘hour’ പ്രമേയത്തെ സംരക്ഷിക്കുന്നു; യേശുവിന്റെ ദൗത്യത്തിലെ ദൈവനിയുക്ത ഘട്ടത്തോടുള്ള വിശാലമായ അനുരണനം വായനക്കാർക്ക് തിരിച്ചറിയാനാകുന്നു.
theological_decisions:
- issue: യേശു അമ്മയെ അഭിസംബോധന ചെയ്യുന്ന വാക്കുകളുടെ ഭാവവും ശക്തിയും
  choice: ആദരവിന് വിരുദ്ധമല്ലാത്തതും എന്നാൽ അകലം സൂചിപ്പിക്കുന്നതുമായ മറുപടി
  alternative: കടുത്ത ശാസന; അല്ലെങ്കിൽ അത്യന്തം വാത്സല്യമുള്ള അഭിസംബോധന
  rationale: Τί ἐμοὶ καὶ σοί സാഹചര്യപരമായോ താൽപര്യപരമായോ അകലം സൃഷ്ടിക്കുന്നു; γύναι അന്നത്തെ സാഹചര്യത്തിൽ സാധാരണവും മാന്യവുമായ അഭിസംബോധനയായിരിക്കാം. അതിനാൽ വാചകം അപമാനകരമോ അതിവാത്സല്യപൂർണമോ ആക്കാതെ മൂലത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: യോഹന്നാന്റെ ദൈവശാസ്ത്രത്തിൽ ‘എന്റെ നാഴിക’ എന്നതിന്റെ അർഥം
  choice: ഉടൻ സംഭവിക്കാനിരിക്കുന്ന കാര്യത്തെക്കാൾ വിശാലമായ ദൈവനിയുക്ത നാഴികയിലേക്കുള്ള അനുരണനം തുറന്നുവെക്കുന്നു
  alternative: ഈ അടയാളം പ്രവർത്തിക്കേണ്ട നിമിഷം മാത്രം; അല്ലെങ്കിൽ പ്രത്യേക ദൈവശാസ്ത്രഭാരമില്ലാത്ത പൊതുവായ സമയസൂചന
  rationale: യോഹന്നാനിൽ ‘നാഴിക’ യേശുവിന്റെ ദൗത്യം, കഷ്ടാനുഭവം, മരണം, ഉയിർപ്പ്, മഹത്ത്വീകരണം എന്നിവയുമായി ആവർത്തിച്ച് ബന്ധപ്പെടുന്നു. മുഖ്യപാഠത്തിൽ അതിനെ വിശദീകരിച്ചുതീർക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സ്ത്രീയേ’യും ‘നാഴിക’യും മൂലപദങ്ങളുടെ സാഹിത്യ-ദൈവശാസ്ത്രഭാരം നിലനിർത്താൻ സംരക്ഷിച്ചു; ഇന്നത്തെ വായനക്കാരന് തെറ്റിദ്ധാരണ ഉണ്ടാകാവുന്ന അഭിസംബോധന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന വാക്കുകൾക്കു പിന്നാലെ സ്ഥാപിച്ചു.
