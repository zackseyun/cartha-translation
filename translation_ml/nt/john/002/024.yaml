  to: എന്നാൽ യേശു തന്നെയോ, അവൻ എല്ലാവരെയും അറിയുമായിരുന്നു എന്നതിനാൽ, അവർക്കു തന്നെത്തന്നെ ഏൽപ്പിച്ചിരുന്നില്ല.[a]
