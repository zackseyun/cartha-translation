  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: ml
  text: എന്നാൽ യേശു തന്നെയോ, അവൻ എല്ലാവരെയും അറിയുമായിരുന്നു എന്നതിനാൽ, അവർക്കു തന്നെത്തന്നെ ഏൽപ്പിച്ചിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മുൻവാക്യത്തിലും ഇവിടെയും ഗ്രീക്കിൽ ഒരേ ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: പലരും യേശുവിൽ ‘വിശ്വസിച്ചു’; എന്നാൽ യേശു അവർക്കു തന്നെത്തന്നെ ‘ഏൽപ്പിച്ചിരുന്നില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: എന്നാൽ യേശു തന്നെയാകട്ടെ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യപരമായ തിരിവ് ‘എന്നാൽ’ കൊണ്ടും, കർത്താവായ αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെയാകട്ടെ’ കൊണ്ടും പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἐπίστευεν
  choice: വിശ്വസിച്ചേൽപ്പിച്ചില്ല
  rationale: ഇവിടെ πιστεύω എന്ന ക്രിയയ്ക്ക് αὑτόν എന്ന വ്യക്തിപരമായ കർമവും αὐτοῖς എന്ന സംപ്രദാനിക രൂപവും ഉള്ളതിനാൽ, അർഥം ‘വിശ്വസിക്കുക’ എന്നതിലുപരി ‘വിശ്വാസത്തോടെ ഏൽപ്പിക്കുക’ എന്നതാണ്. അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാപരമായ ഭാവം മലയാളത്തിലെ സന്ദർഭസഹജമായ ഭൂതകാലരൂപത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: αὑτὸν αὐτοῖς
  choice: തന്നെ അവർക്കു
  rationale: ആത്മവാചക സർവനാമവും സംപ്രദാനിക ബന്ധവും സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τὸ αὐτὸν γινώσκειν πάντας
  choice: എല്ലാവരെയും അറിയാമായിരുന്നതിനാൽ
  rationale: διά + articular infinitive നൽകുന്ന കാരണം ‘-തിനാൽ’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; πάντας മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതിനാൽ ‘എല്ലാവരെയും’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: 2:23–24-ൽ πιστεύω എന്ന ഒരേ ക്രിയയുടെ പദപ്രയോഗം
  choice: 2:24-ൽ ‘വിശ്വസിച്ചേൽപ്പിച്ചില്ല’ എന്നു നൽകി ‘വിശ്വാസം’ എന്ന പദമൂലബന്ധവും ഏൽപ്പിക്കൽ എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
  alternative: ‘തന്നെ അവർക്കു ഏൽപ്പിച്ചില്ല’ അല്ലെങ്കിൽ അക്ഷരാർഥമായി ‘അവരെ വിശ്വസിച്ചില്ല’
  rationale: ഗ്രീക്കിൽ മുൻവാക്യത്തിലെ ‘വിശ്വസിച്ചു’ എന്ന ക്രിയ തന്നെയാണ് ഇവിടെ വേറൊരു വാക്യഘടനയിൽ ‘തന്നെ അവർക്കു വിശ്വസിച്ചേൽപ്പിച്ചു’ എന്ന അർഥത്തിൽ വരുന്നത്. മലയാളത്തിലെ സംയുക്തക്രിയ പദകളിയും ആശയവും ഭാഗികമായി സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ബന്ധം വ്യക്തമാക്കുന്നു.
- issue: πάντας എന്നതിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാവരെയും’ എന്ന പൊതുവായ പ്രയോഗം
  alternative: ‘എല്ലാ മനുഷ്യരെയും’
  rationale: മൂലപാഠം ഇവിടെ ഒരു പ്രത്യേക വിഭാഗത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല. ‘എല്ലാവരെയും’ സ്വാഭാവികവും ലിംഗഭേദമില്ലാതെ കൃത്യവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശ്വസിച്ചേൽപ്പിക്കുക’ അല്പം സാന്ദ്രമായ സംയുക്തപ്രയോഗമാണെങ്കിലും, ഗ്രീക്കിലെ പദകളിയും സന്ദർഭാർഥവും ഒരുമിച്ച് പരമാവധി നിലനിർത്തുന്നു.
