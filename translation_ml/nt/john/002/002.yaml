  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: ml
  text: യേശുവിനെയും അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാരെയും ആ വിവാഹത്തിലേക്കു ക്ഷണിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “യേശുവും അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാരും വിവാഹത്തിലേക്കു ക്ഷണിക്കപ്പെട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλήθη
  choice: ക്ഷണിക്കപ്പെട്ടിരുന്നു
  rationale: ഒരു സാമൂഹികാഘോഷത്തിൽ പങ്കെടുക്കാനുള്ള ക്ഷണത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭമായതിനാൽ καλέω എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം ഇവിടെ പൊതുവായ ‘വിളിക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘ക്ഷണിക്കപ്പെട്ടു’ എന്നാണ്.
- source_word: δὲ καὶ
  choice: -ഉം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞവരോടൊപ്പം യേശുവിനെയും ചേർക്കുന്ന മൃദുവായ ബന്ധവും കൂട്ടിച്ചേർക്കലും മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാരും
  rationale: μαθηταί എന്നത് യേശുവിനോടു ചേർന്നുനിന്ന പഠിതാക്കളുടെയും അനുയായികളുടെയും പ്രത്യേക കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ പതിവും കൃത്യവുമായ ‘ശിഷ്യന്മാർ’ നിലനിർത്തി; αὐτοῦ ആദരസൂചകമായി ‘അദ്ദേഹത്തിന്റെ’ എന്നു നൽകി.
- source_word: εἰς τὸν γάμον
  choice: ആ വിവാഹത്തിന്
  rationale: γάμος ഇവിടെ വിവാഹാഘോഷം അഥവാ വിവാഹച്ചടങ്ങ് എന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വിരുന്ന്’ ചേർക്കാതെ, മുൻവാക്യത്തിൽ പറഞ്ഞ നിർദിഷ്ട വിവാഹത്തെ ‘ആ വിവാഹം’ എന്നു സൂചിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഏകവചന നിഷ്ക്രിയക്രിയ യേശുവിനെ മുഖ്യവാക്യകർത്താവാക്കി ശിഷ്യന്മാരെ ഏകോപിപ്പിക്കുന്ന ഘടനയിലുള്ളതാണ്; മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചന ഏകോപനം ഉപയോഗിച്ചെങ്കിലും പദാനുപദഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
