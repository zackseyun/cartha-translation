  naturalness: യേശുവിനെയും അദ്ദേഹത്തിന്റെ ശിഷ്യന്മാരെയും ആ വിവാഹത്തിലേക്കു ക്ഷണിച്ചു is idiomatic modern standard Malayalam. It also expresses the additive force affecting Jesus through യേശുവിനെയും and avoids an unnecessarily marked plural passive construction.
  terminology: യേശു, ശിഷ്യന്മാർ, ക്ഷണിച്ചു, and വിവാഹം are appropriate, clear, and suitably neutral terms. വിവാഹത്തിലേക്കു better reflects εἰς than the more event-oriented വിവാഹത്തിന്.
