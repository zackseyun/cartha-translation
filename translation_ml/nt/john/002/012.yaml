  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: ml
  text: ഇതിനുശേഷം, അവൻ തന്റെ അമ്മയോടും സഹോദരന്മാരോടും[a] ശിഷ്യന്മാരോടുംകൂടെ കഫർന്നഹൂമിലേക്കു ഇറങ്ങിച്ചെന്നു. അവർ അവിടെ അധികം ദിവസങ്ങൾ താമസിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ബന്ധുക്കൾ’ അല്ലെങ്കിൽ ‘അടുത്ത കുടുംബക്കാർ’; ഗ്രീക്ക് പദം ഇടുങ്ങിയ അർഥത്തിൽ സഹോദരന്മാരെയും ചില സന്ദർഭങ്ങളിൽ വിശാലമായ കുടുംബബന്ധത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: ഇതിനുശേഷം
  rationale: സ്വാഭാവികമായ ആഖ്യാനകാലമാറ്റം; ഏകവചന നിർദ്ദേശകത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: κατέβη
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: കാനായിൽനിന്ന് കഫർന്നഹൂമിലേക്കുള്ള ഭൂപ്രകൃതിപരമായ താഴോട്ടുള്ള സഞ്ചാരം വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: εἰς Καφαρναοὺμ
  choice: കഫർന്നഹൂമിലേക്കു
  rationale: ഒരു നഗരത്തെ ലക്ഷ്യസ്ഥാനമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: തന്റെ അമ്മ
  rationale: ഗ്രീക്കിലുള്ള ബന്ധസൂചന കൃത്യമായി നിലനിർത്തുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത ‘മറിയം’ എന്ന പേര് ചേർക്കുന്നില്ല.
- source_word: οἱ ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ പദത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം നൽകുന്നു; വിശാല കുടുംബബന്ധസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ശിഷ്യന്മാർ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലെ പ്രധാന പദത്തിന് പതിവും അർഥസമ്പന്നവുമായ മലയാളസമാനപദം.
- source_word: ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας
  choice: അവർ അവിടെ അധികം ദിവസങ്ങൾ താമസിച്ചില്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മകമായ ‘അധികം ദിവസങ്ങളല്ല’ എന്ന പ്രയോഗം സുഗമമായ മലയാളത്തിൽ അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ കുടുംബവുമായി ബന്ധപ്പെട്ട ἀδελφοί എന്ന പദത്തിന്റെ സൂചിതർ
  choice: പ്രധാന പാഠത്തിൽ ‘സഹോദരന്മാർ’
  alternative: ബന്ധുക്കൾ അല്ലെങ്കിൽ അടുത്ത കുടുംബക്കാർ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള, പുല്ലിംഗ ബഹുവചന അർഥം പ്രധാന പാഠത്തിൽ നൽകുന്നു. മറിയത്തിന്റെ നിത്യകന്യകാത്വത്തെക്കുറിച്ചുള്ള പിൽക്കാല മതശാസ്ത്രവിവാദം വിവർത്തനത്തിലൂടെ തീർപ്പാക്കാതെ, വിശാല ബന്ധുത്വസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കൂടെ’ എന്ന ഘടനയിലൂടെ അനുഗമിച്ച സംഘത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു; ഉറവിടത്തിലെ അർഥദ്വയത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
