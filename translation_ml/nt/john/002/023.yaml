revisions:
- from: അവൻ പെസഹാപ്പെരുന്നാളിന്റെ സമയത്ത് യെരൂശലേമിൽ ആയിരുന്നപ്പോൾ, അവൻ ചെയ്തുകൊണ്ടിരുന്ന അടയാളങ്ങൾ കണ്ട് അനേകർ അവന്റെ നാമത്തിൽ വിശ്വസിച്ചു.[a][b]
  to: അവൻ പെസഹാപ്പെരുന്നാളിന്റെ സമയത്ത് യെരൂശലേമിൽ ആയിരുന്നപ്പോൾ, അവൻ ചെയ്തുകൊണ്ടിരുന്ന അടയാളങ്ങൾ[b] അവർ കണ്ടുകൊണ്ടിരിക്കെ, അനേകർ അവന്റെ നാമത്തിൽ വിശ്വസിച്ചു[a].
  rationale: അർത്ഥത്തിൽ മാറ്റം വരുത്താതെ അടിക്കുറിപ്പുകുറികൾ അവയുടെ ശരിയായ ആങ്കറുകളിലേക്ക് മാറ്റി. ‘കണ്ടുകൊണ്ടിരിക്കെ’ θεωροῦντες-ന്റെ സമകാലികവും തുടരുന്നതുമായ നിരീക്ഷണഭാവം മെച്ചമായി പ്രതിഫലിപ്പിക്കുന്നു. വിശ്വാസത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് വാക്യത്തിൽ ഇല്ലാത്ത വിധിനിർണയം ഒന്നും ചേർത്തിട്ടില്ല.
