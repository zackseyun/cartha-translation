id: JHN.2.23
reference: John 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: ml
  text: അവൻ പെസഹാപ്പെരുന്നാളിന്റെ സമയത്ത് യെരൂശലേമിൽ ആയിരുന്നപ്പോൾ, അവൻ ചെയ്തുകൊണ്ടിരുന്ന അടയാളങ്ങൾ[b] അവർ കണ്ടുകൊണ്ടിരിക്കെ, അനേകർ അവന്റെ നാമത്തിൽ വിശ്വസിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനിൽ വിശ്വസിച്ചു.’ അക്ഷരാർഥത്തിൽ, ‘അവന്റെ നാമത്തിൽ വിശ്വസിച്ചു’; അവന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തിൽ ആശ്രയിക്കുന്ന വിശ്വാസത്തെ ഊന്നുന്ന യോഹന്നാന്റെ സവിശേഷ പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അടയാളങ്ങൾ’ എന്നത് യേശു ആരാണെന്നതിലേക്കു വിരൽചൂണ്ടുന്ന പ്രവൃത്തികളെ സൂചിപ്പിക്കാൻ യോഹന്നാൻ സവിശേഷമായി ഉപയോഗിക്കുന്ന പദമാണ്; ചില വിവർത്തനങ്ങൾ ‘അത്ഭുത അടയാളങ്ങൾ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: അവൻ ... യെരൂശലേമിൽ ആയിരുന്നപ്പോൾ
  rationale: ὡς δέയുടെ കാലസൂചനയും നേരിയ ആഖ്യാനത്തുടർച്ചയും സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: പെസഹാപ്പെരുന്നാളിന്റെ സമയത്ത്
  rationale: രണ്ടു ഗ്രീക്ക് പദബന്ധങ്ങളും ഒരേ ഉത്സവസന്ദർഭത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി πάσχαയും ἑορτήയും ചേർന്ന അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും മാന്യവുമായ സാധാരണ മലയാളപ്രയോഗം.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ നാമത്തിൽ വിശ്വസിച്ചു
  rationale: യോഹന്നാന്റെ സവിശേഷമായ ‘നാമത്തിൽ വിശ്വസിക്കുക’ എന്ന പ്രയോഗം ചുരുക്കി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: θεωροῦντες
  choice: കണ്ട്
  rationale: അടയാളങ്ങൾ നിരീക്ഷിച്ചതും വിശ്വാസവും തമ്മിലുള്ള സമകാലിക/കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ σημεῖα ἃ ἐποίει
  choice: അവൻ ചെയ്തുകൊണ്ടിരുന്ന അടയാളങ്ങൾ
  rationale: σημεῖα എന്ന യോഹന്നാനീയ പദം ‘അടയാളങ്ങൾ’ എന്നു നിലനിർത്തുകയും ἐποίειയുടെ അപൂർണ്ണകാല തുടർച്ച ‘ചെയ്തുകൊണ്ടിരുന്ന’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ സൂചിപ്പിക്കുന്ന വിശ്വാസത്തിന്റെ സ്വഭാവം
  choice: ‘അവന്റെ നാമത്തിൽ വിശ്വസിച്ചു’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്യുക
  alternative: ‘അവനിൽ ഉപരിപ്ലവമായി വിശ്വസിച്ചു’ അല്ലെങ്കിൽ ‘അത്ഭുതങ്ങൾ കാരണം വിശ്വാസം പ്രകടിപ്പിച്ചു’
  rationale: ഈ വാക്യം വിശ്വാസത്തെ മുൻകൂട്ടി അപര്യാപ്തമെന്നു വിധിക്കുന്നില്ല. തുടർന്നുള്ള വാക്യം നൽകുന്ന സംഘർഷവും വിശദീകരണവും ഇവിടെ തന്നെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പെസഹാപ്പെരുന്നാൾ’ സാധാരണ വായനക്കാർക്ക് ഉത്സവസൂചന വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പുകുറികൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
