    rationale: '[a][b] രണ്ടും വാക്യാന്ത്യത്തിൽ വരുന്നതിനാൽ [b] ‘അടയാളങ്ങൾ’ എന്ന പദത്തോടല്ല, സമീപത്തുള്ള ‘വിശ്വസിച്ചു’ എന്ന ക്രിയയോടാണെന്നു തെറ്റിദ്ധരിക്കപ്പെടാം. ഓരോ കുറിയും അതതു പദബന്ധത്തിനു പിന്നാലെ സ്ഥാപിക്കണം.'
  - severity: low
    issue: θεωροῦντες-ന്റെ അപൂർണ്ണ/തുടർച്ചയായ ഭാവം ‘കണ്ട്’ എന്നതിൽ മങ്ങുന്നു.
