source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: ml
  text: മൂന്നാം ദിവസം ഗലീലയിലെ കാനായിൽ ഒരു വിവാഹം[a] നടന്നു. യേശുവിന്റെ അമ്മ അവിടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിവാഹാഘോഷം.’ ഗ്രീക്ക് പദം വിവാഹച്ചടങ്ങിനെയും അതോടനുബന്ധിച്ച ആഘോഷത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: ഗ്രീക്കിലെ സാധാരണ ആഖ്യാനബന്ധകമായ Καὶ മലയാളത്തിൽ വാക്യാരംഭത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായ തുടർച്ചയിലൂടെ പ്രകടമാക്കി.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: മൂന്നാം ദിവസം
  rationale: നിശ്ചിതമായ കാലസൂചന നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു; പ്രതീകാത്മക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: γάμος
  choice: ഒരു വിവാഹം
  rationale: γάμος വിവാഹസംഭവത്തെയും വിവാഹാഘോഷത്തെയും സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിലെ ‘വിവാഹം’ ഈ അർഥവ്യാപ്തി സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: നടന്നു
  rationale: ഒരു സംഭവം നടന്നതായി പരിചയപ്പെടുത്തുന്ന γίνομαιയുടെ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളം.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: ഗലീലയിലെ കാനായിൽ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἦν
  choice: ഉണ്ടായിരുന്നു
  rationale: പശ്ചാത്തലസാന്നിധ്യം ലളിതമായി അറിയിക്കുന്ന അപൂർണഭൂതകാലരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ അമ്മ
  rationale: ഗ്രീക്ക് ബന്ധം കൃത്യമായും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: ലളിതമായ സ്ഥലവാചകത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘മൂന്നാം ദിവസം’ എന്ന കാലസൂചന
  choice: കാലക്രമസൂചനയായി അതേപടി നിലനിർത്തി
  alternative: പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പ്രതീകാത്മക പരാമർശമായി പരിഭാഷയിൽ വ്യക്തമാക്കുക
  rationale: യോഹന്നാന്റെ രചനയിൽ വായനക്കാർക്ക് പ്രതീകാത്മക പ്രതിധ്വനി കാണാമെങ്കിലും, ഇവിടെ വാചകം നേരിട്ട് ഒരു സമയസൂചനയാണ്. വ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ചേർക്കാതെ യഥാർഥ പദപ്രയോഗം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. അനാവശ്യമായി ‘അപ്പോൾ/കൂടാതെ’ ചേർക്കാതെ ഗ്രീക്ക് ബന്ധകത്തിന്റെ സ്വാഭാവിക പ്രവാഹം നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിലെ [b] അടിക്കുറിപ്പ് വാക്യവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ഉറവിടഗ്രീക്കിൽ ആധാരമില്ലാത്ത ആ അടിക്കുറിപ്പ് ഉൾപ്പെടുത്തിയിട്ടില്ല.
