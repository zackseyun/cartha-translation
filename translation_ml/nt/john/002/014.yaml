id: JHN.2.14
reference: John 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: ml
  text: അവൻ ദേവാലയത്തിൽ[a] കാളകളെയും ചെമ്മരിയാടുകളെയും പ്രാവുകളെയും വിൽക്കുന്നവരെയും, ഇരുന്നുകൊണ്ടിരുന്ന നാണയം മാറ്റുന്നവരെയും കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേവാലയത്തിൽ’ എന്നതിനുള്ള ഗ്രീക്ക് പദം ἱερόν ആണ്. അത് അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: കണ്ടു
  rationale: ഇവിടെ യേശു ദേവാലയത്തിൽ പ്രവേശിച്ചപ്പോൾ നേരിട്ടു കണ്ട കാഴ്ചയെ സൂചിപ്പിക്കുന്നു. ‘കണ്ടെത്തി’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളം ‘കണ്ടു’ ആണ്; സന്ദർഭത്തിൽ മൂലക്രിയയുടെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, മുഴുവൻ ദേവാലയസമുച്ചയത്തെയോ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി ‘ദേവാലയത്തിൽ’ എന്നു നൽകി, വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: πωλοῦντας
  choice: വിൽക്കുന്നവരെയും
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടരുന്ന വ്യാപാരപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘വിൽക്കുന്നവർ’ അത് സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: βόας
  choice: കാളകളെയും
  rationale: βοῦς കന്നുകാലികളെ പൊതുവായി സൂചിപ്പിക്കാമെങ്കിലും ബലിയർപ്പണസന്ദർഭത്തിൽ ‘കാളകൾ’ വ്യക്തവും പ്രചാരമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: πρόβατα
  choice: ആടുകളെയും
  rationale: πρόβατα എന്നതിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളസമാനപദം ‘ആടുകൾ’ ആണ്.
- source_word: περιστερὰς
  choice: പ്രാവുകളെയും
  rationale: περιστερά പ്രാവ്/മാടപ്രാവ് വർഗത്തെ സൂചിപ്പിക്കുന്നു; ബലിമൃഗങ്ങളുടെ പട്ടികയിൽ ‘പ്രാവുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: κερματιστὰς
  choice: നാണയം മാറ്റിക്കൊടുക്കുന്നവർ
  rationale: κερματιστής നാണയങ്ങൾ കൈമാറ്റം ചെയ്യുന്നവനെ സൂചിപ്പിക്കുന്നു. ‘നാണയം മാറ്റിക്കൊടുക്കുന്നവർ’ ആ പ്രവർത്തനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: καθημένους
  choice: അവിടെ ഇരിക്കുന്നതും
  rationale: അവരുടെ ഇരിപ്പും സ്ഥിരസാന്നിധ്യവും സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ ഇങ്ങനെ പകർത്തുന്നു.
theological_decisions:
- issue: യെരൂശലേം ദേവാലയവുമായി ബന്ധപ്പെട്ട ἱερόν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനവാചകത്തിൽ ‘ദേവാലയത്തിൽ’; ദേവാലയസമുച്ചയമോ പ്രാകാരങ്ങളോ എന്നാണ് അർഥമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ദേവാലയപ്രാകാരങ്ങളിൽ’ അല്ലെങ്കിൽ ‘ദേവാലയസമുച്ചയത്തിൽ’
  rationale: മൃഗവ്യാപാരികളും നാണയം മാറ്റുന്നവരും ഉണ്ടായിരുന്ന സ്ഥലം അകത്തെ വിശുദ്ധമന്ദിരമല്ല, വിശാലമായ ദേവാലയപരിസരമാണ്. എന്നാൽ ‘ദേവാലയത്തിൽ’ എന്നത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്; സ്ഥലപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ടു കൂട്ടങ്ങളെയും—വിൽക്കുന്നവരെയും നാണയം മാറ്റുന്നവരെയും—വ്യക്തമായി നിലനിർത്തുന്നു; ἱερόν എന്ന പദത്തിന്റെ സ്ഥലപരമായ വ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
