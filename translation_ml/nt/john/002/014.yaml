revisions:
- from: അവൻ ദേവാലയത്തിൽ കാളകളെയും ആടുകളെയും പ്രാവുകളെയും വിൽക്കുന്നവരെയും[a] നാണയം മാറ്റിക്കൊടുക്കുന്നവർ അവിടെ ഇരിക്കുന്നതും കണ്ടു.
  to: അവൻ ദേവാലയത്തിൽ[a] കാളകളെയും ചെമ്മരിയാടുകളെയും പ്രാവുകളെയും വിൽക്കുന്നവരെയും, ഇരുന്നുകൊണ്ടിരുന്ന നാണയം മാറ്റുന്നവരെയും കണ്ടു.
  rationale: The revision restores the Greek syntax by presenting both the sellers and the money changers as coordinated groups Jesus found. It attaches ‘ഇരുന്നുകൊണ്ടിരുന്ന’ directly to the money changers, relocates the lexical footnote marker to ‘ദേവാലയത്തിൽ,’ and clarifies πρόβατα as ‘ചെമ്മരിയാടുകൾ.’
