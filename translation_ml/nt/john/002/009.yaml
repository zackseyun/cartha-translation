  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: ml
  text: വിരുന്നിന്റെ മേൽനോട്ടക്കാരൻ വീഞ്ഞായിത്തീർന്ന വെള്ളം രുചിച്ചുനോക്കിയപ്പോൾ—അത് എവിടെനിന്ന് വന്നതാണെന്ന് അയാൾ അറിഞ്ഞിരുന്നില്ല; വെള്ളം കോരിയ പരിചാരകർക്ക് അതറിയാമായിരുന്നു—വിരുന്നിന്റെ മേൽനോട്ടക്കാരൻ മണവാളനെ വിളിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ഇവിടെ ചരിത്രവർത്തമാനകാലമാണ്: ‘വിളിക്കുന്നു.’ മലയാളത്തിൽ സാധാരണയായി ‘വിളിച്ചു’ എന്നും പറയാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: വിരുന്നിന്റെ മേൽനോട്ടക്കാരൻ
  rationale: വിരുന്നിന്റെ ക്രമീകരണങ്ങൾക്കു മേൽനോട്ടം വഹിക്കുന്ന ആളെയാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്. ‘പ്രധാന പരിചാരകൻ’ എന്നതിനെക്കാൾ ചുമതലയുടെ വ്യാപ്തി വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: ἐγεύσατο
  choice: രുചിച്ചുനോക്കി
  rationale: സന്ദർഭത്തിൽ പാനീയം രുചിച്ചറിയുന്നതിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: വീഞ്ഞായിത്തീർന്ന വെള്ളം
  rationale: γεγενημένον സൂചിപ്പിക്കുന്ന പൂർത്തിയായ അവസ്ഥാമാറ്റവും അതിന്റെ നിലനിൽക്കുന്ന ഫലവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: അത് എവിടെനിന്നു വന്നെന്ന് അയാൾക്ക് അറിയില്ലായിരുന്നു
  rationale: πόθεν എന്നത് ഉത്ഭവസ്ഥാനത്തെക്കുറിച്ചുള്ള ചോദ്യമാണ്; മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διάκονοι
  choice: ശുശ്രൂഷകർ
  rationale: ഇവിടെ സഭാപദവിയല്ല, വിരുന്നിൽ സേവനം ചെയ്യുന്നവരെയാണ് ഉദ്ദേശിക്കുന്നത്. ‘ശുശ്രൂഷകർ’ ഈ സേവകഭൂമിക മാന്യവും സന്ദർഭോചിതവുമായി അറിയിക്കുന്നു.
- source_word: ἠντληκότες
  choice: കോരിയ
  rationale: വെള്ളം കോരിയെടുക്കുന്ന പ്രവൃത്തി കൃത്യമായും ലളിതമായും അറിയിക്കുന്നു.
- source_word: φωνεῖ
  choice: വിളിക്കുന്നു
  rationale: യോഹന്നാൻ ഉപയോഗിക്കുന്ന ചരിത്രവർത്തമാനകാലത്തെ നിലനിർത്തി ആഖ്യാനത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: νυμφίον
  choice: മണവാളൻ
  rationale: വിവാഹസന്ദർഭത്തിൽ സാധാരണവും ബൈബിൾഭാഷയിൽ പരിചിതവുമായ തുല്യപദം.
- source_word: ὡς δὲ
  choice: അപ്പോൾ
  rationale: പ്രത്യേകമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർക്കാതെ സംഭവക്രമത്തിലെ പരിവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: അത്ഭുതത്തിലെ അവസ്ഥാമാറ്റത്തിന്റെ വിവരണം
  choice: ‘വീഞ്ഞായിത്തീർന്ന വെള്ളം’ എന്ന് യഥാർഥ പരിവർത്തനമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വീഞ്ഞാക്കി മാറ്റിയ വെള്ളം’ അല്ലെങ്കിൽ വെറും വീഞ്ഞുപോലെ തോന്നിയ വെള്ളം എന്ന വ്യാഖ്യാനം
  rationale: ഗ്രീക്ക് വാക്യം വെള്ളം വീഞ്ഞായിത്തീർന്നതായി വ്യക്തമായി പറയുന്നു; അതിനെ ദുർബലപ്പെടുത്തുകയോ ഉറവിടത്തിലില്ലാത്ത doctrinal വിശദീകരണം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- issue: φωνεῖ എന്ന ചരിത്രവർത്തമാനകാലം
  choice: ‘വിളിക്കുന്നു’ എന്ന് വർത്തമാനകാലം നിലനിർത്തി.
  alternative: മലയാളത്തിലെ സാധാരണ ഭൂതകാല ആഖ്യാനത്തിനനുസരിച്ച് ‘വിളിച്ചു’
  rationale: ഉറവിടത്തിലെ ആഖ്യാനസജീവതയും കാലരൂപത്തിലെ ഉദ്ദേശ്യപൂർവമായ വ്യത്യാസവും വായനക്കാരന് കാണാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളവായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ബന്ധങ്ങളും സംഭവക്രമവും നിലനിർത്തി. ‘വിളിക്കുന്നു’ എന്ന അപൂർവമായ കാലമാറ്റത്തിന് മാത്രം വായനക്കാരനെ സഹായിക്കുന്ന അടിക്കുറിപ്പ് നൽകി.
