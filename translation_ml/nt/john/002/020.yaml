id: JHN.2.20
reference: John 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദർ[a] പറഞ്ഞു: “നാൽപ്പത്താറു വർഷംകൊണ്ടാണ് ഈ ദേവാലയം പണിതത്; നീ ഇതിനെ മൂന്നു ദിവസത്തിനുള്ളിൽ ഉയർത്തുമെന്നോ[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദ്യർ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ‘യെഹൂദർ’ എന്നാണ്; യോഹന്നാൻ ഈ പദം സന്ദർഭത്തിനനുസരിച്ച് വ്യത്യസ്ത അർഥവ്യാപ്തികളിൽ ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അവർ മനസ്സിലാക്കിയ അർഥത്തിൽ ‘വീണ്ടും പണിയുമെന്നോ’ എന്നും വരാം. എന്നാൽ ‘ഉയർത്തുക’ എന്ന പരിഭാഷ, യേശുവിന്റെ പുനരുത്ഥാനവുമായി യോഹന്നാൻ പിന്നീട് ബന്ധിപ്പിക്കുന്ന മൂലപദം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ പ്രസ്താവനയോടുള്ള പ്രതികരണത്തിലേക്കുള്ള സ്വാഭാവികമായ ആഖ്യാനബന്ധം വ്യക്തമാക്കുന്നു; ഇവിടെ ‘അതുകൊണ്ട്’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ പദപ്രയോഗം അതേ വ്യാപ്തിയിൽ നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘നേതാക്കൾ’ എന്ന പരിമിതി വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: നാൽപ്പത്താറു വർഷംകൊണ്ട്
  rationale: ദേവാലയനിർമാണത്തിന് എടുത്ത കാലദൈർഘ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οἰκοδομήθη
  choice: പണിതത്
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗത്തിന്റെ സംഗ്രഹാത്മക അർഥം ലളിതമായി നൽകുന്നു; നിർമാണം തുടർന്നുകൊണ്ടിരുന്നു എന്ന ചരിത്രവിവരം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὁ ναὸς οὗτος
  choice: ഈ ദേവാലയം
  rationale: ναός പ്രത്യേകിച്ച് വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം ‘ദേവാലയം’ ആണ്.
- source_word: καὶ σὺ
  choice: നീ ... എന്നോ?
  rationale: σὺ എന്ന സർവനാമത്തിന്റെ ഊന്നലും സംസാരിക്കുന്നവരുടെ അവിശ്വാസഭാവവും മലയാളത്തിലെ ചോദ്യംചെയ്യുന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν τρισὶν ἡμέραις
  choice: മൂന്നു ദിവസത്തിനുള്ളിൽ
  rationale: കാലപരിധിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും തുടർന്നുള്ള പുനരുത്ഥാനസന്ദർഭവുമായി ബന്ധപ്പെടാവുന്ന ഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐγερεῖς
  choice: ഉയർത്തുമെന്നോ
  rationale: ‘വീണ്ടും പണിയും’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ, ἐγείρω എന്ന ക്രിയയുടെ ‘ഉയർത്തുക’ എന്ന അർഥവും പുനരുത്ഥാനവുമായി പിന്നീടുണ്ടാകുന്ന ശബ്ദബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: αὐτόν
  choice: ഇതിനെ
  rationale: മുൻപുള്ള ‘ഈ ദേവാലയം’ എന്നതിലേക്കുള്ള സൂചന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗം യെഹൂദവിരുദ്ധമായി അതിവ്യാപിപ്പിച്ചു മനസ്സിലാക്കാനുള്ള സാധ്യത
  choice: പ്രധാനപാഠത്തിൽ ‘യെഹൂദർ’ നിലനിർത്തി, സന്ദർഭാനുസൃതമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: യെഹൂദ്യർ; യെഹൂദനേതാക്കൾ
  rationale: മൂലപദത്തിന്റെ രൂപം നിലനിർത്തുന്നു; എന്നാൽ എല്ലാ യെഹൂദരെയും കാലാതീതമായി കുറ്റപ്പെടുത്തുന്ന അർഥം ഉദ്ദേശിച്ചിട്ടില്ലെന്ന് വായനക്കാരനെ ബോധ്യപ്പെടുത്തുന്നു. ‘നേതാക്കൾ’ എന്നു നൽകുന്നത് ഈ വാക്യം വ്യക്തമാക്കാത്ത പരിമിതി ചേർക്കും.
- issue: ἐγερεῖς എന്ന ക്രിയയിലെ നിർമാണാർഥവും പുനരുത്ഥാനസൂചനയും
  choice: ‘ഉയർത്തുമെന്നോ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: വീണ്ടും പണിയുമെന്നോ
  rationale: സംസാരിക്കുന്നവർ ഭൗതികദേവാലയത്തിന്റെ പുനർനിർമാണം ഉദ്ദേശിച്ചിരിക്കാം; എന്നാൽ യോഹന്നാൻ അടുത്ത വാക്യങ്ങളിൽ യേശുവിന്റെ ശരീരത്തോടും പുനരുത്ഥാനത്തോടും ബന്ധിപ്പിക്കുന്ന ദ്വയാർഥവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ‘ഉയർത്തുക’ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘നാൽപ്പത്താറു വർഷംകൊണ്ടാണ്’ എന്ന ഊന്നൽഘടന ദീർഘമായ നിർമാണകാലത്തെയും ചോദിക്കുന്നവരുടെ അവിശ്വാസത്തെയും സ്വാഭാവികമായി മുന്നോട്ടുകൊണ്ടുവരുന്നു.
