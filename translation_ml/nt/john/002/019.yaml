id: JHN.2.19
reference: John 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ഈ ദൈവാലയം തകർക്കുക; മൂന്നു ദിവസത്തിനുള്ളിൽ ഞാൻ അതിനെ ഉയർത്തും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ദൈവാലയം ഇടിച്ചുകളയുക; മൂന്നു ദിവസത്തിനുള്ളിൽ ഞാൻ അതിനെ വീണ്ടും ഉയർത്തും.” ‘ഉയർത്തും’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ പുനരുത്ഥാനത്തിന്റെ ധ്വനിയുമുണ്ട്. യേശു തന്റെ ശരീരമാകുന്ന ദൈവാലയത്തെക്കുറിച്ചാണ് പറഞ്ഞതെന്ന് യോഹന്നാൻ പിന്നീട് വിശദീകരിക്കുന്നു (2:21).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സെമിറ്റിക് സ്വാധീനമുള്ള ഇരട്ട പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: Λύσατε
  choice: തകർക്കുക
  rationale: ഇവിടെ λύω എന്നത് അഴിക്കുക എന്നല്ല, ദൈവാലയം നശിപ്പിക്കുകയോ ഇടിച്ചുകളയുകയോ ചെയ്യുക എന്ന അർഥത്തിലാണ്.
- source_word: ναὸν
  choice: ദൈവാലയം
  rationale: ναός പ്രത്യേകമായി വിശുദ്ധമന്ദിരത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമായ പദം ‘ദൈവാലയം’ ആണ്.
- source_word: ἐν τρισὶν ἡμέραις
  choice: മൂന്നു ദിവസത്തിനുള്ളിൽ
  rationale: ἐν എന്നതിന്റെ സമയപരമായ പരിധി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൃത്യമായ കാലഗണനയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐγερῶ
  choice: ഞാൻ … ഉയിർത്തെഴുന്നേല്പിക്കും
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ‘എഴുന്നേല്പിക്കുക’ എന്ന അർഥവും യോഹന്നാന്റെ സന്ദർഭത്തിലെ പുനരുത്ഥാനധ്വനിയും നിലനിർത്തുന്നു; ‘വീണ്ടും പണിയും’ എന്ന വാസ്തുശില്പപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: αὐτόν
  choice: അതിനെ
  rationale: വ്യാകരണപരമായി അടുത്ത മുൻപദമായ ‘ദൈവാലയം’ എന്നതിലേക്കാണ് സർവനാമം ചൂണ്ടുന്നത്; ശരീരം എന്ന ആഴത്തിലുള്ള സൂചന തുടർന്നുള്ള സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവാലയം യേശുവിന്റെ ശരീരമാണെന്ന് ഈ വാക്യത്തിൽത്തന്നെ തുറന്നുപറയണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഈ ദൈവാലയം’ എന്ന നിഗൂഢപ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘എന്റെ ശരീരമാകുന്ന ഈ ദൈവാലയം’ എന്ന് വിശദീകരിക്കുക.
  rationale: യോഹന്നാൻ 2:21-ലാണ് വിശദീകരണം വരുന്നത്. അതിനുമുമ്പ് അർഥം തുറന്നുപറയുന്നത് ആഖ്യാനത്തിലെ ഉദ്ദേശ്യപൂർവമായ നിഗൂഢതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ഇല്ലാതാക്കും.
- issue: ἐγερῶ എന്നത് പുനർനിർമാണഭാഷയിലോ പുനരുത്ഥാനധ്വനിയുള്ള ഭാഷയിലോ നൽകണമോ
  choice: ‘ഉയിർത്തെഴുന്നേല്പിക്കും’ എന്ന് നൽകി.
  alternative: ‘വീണ്ടും പണിയും’ എന്ന് നൽകുക.
  rationale: ഈ ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ പുനരുത്ഥാനധ്വനിയുണ്ട്; അതേസമയം ദൈവാലയത്തെക്കുറിച്ചുള്ള രൂപകത്തോടും ഈ പരിഭാഷ പൊരുത്തപ്പെടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മറുപടി പറഞ്ഞു’ സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചു; ‘ഉയിർത്തെഴുന്നേല്പിക്കും’ എന്നത് മൂലത്തിലെ അർഥവ്യാപ്തിയും പുനരുത്ഥാനധ്വനിയും സംരക്ഷിക്കുന്നു.
