id: JHN.2.18
reference: John 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദർ അവനോടു ചോദിച്ചു[a]: “നീ ഈ കാര്യങ്ങൾ ചെയ്യുന്നതിനാൽ, എന്ത് അടയാളമാണ് ഞങ്ങൾക്കു കാണിച്ചുതരുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദനേതാക്കൾ” അല്ലെങ്കിൽ “യെഹൂദ്യർ.” യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദർ” എന്ന പ്രയോഗം സന്ദർഭമനുസരിച്ച് ചിലപ്പോൾ ഒരു പ്രതിനിധിസംഘത്തെയോ, പ്രത്യേകിച്ച് യെഹൂദ്യയിലെ അധികാരികളെയോ, കൂടുതൽ പരിമിതമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: അപ്പോൾ … ചോദിച്ചു
  rationale: οὖν മുൻസംഭവത്തോടുള്ള ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു. ἀπεκρίθησαν καὶ εἶπαν എന്ന ഗ്രീക്ക് സംയുക്തപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ആവർത്തിക്കാതെ, തുടർന്നുവരുന്ന ചോദ്യം പരിഗണിച്ച് ‘ചോദിച്ചു’ എന്നു നൽകി.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് കൂടുതൽ പരിമിതമായ ഒരു പ്രതിനിധിസംഘത്തെയോ യെഹൂദ്യ അധികാരികളെയോ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Τί σημεῖον
  choice: എന്ത് അടയാളം
  rationale: യോഹന്നാനിലെ σημεῖον വെറും അത്ഭുതമല്ല, യേശുവിന്റെ അധികാരത്തെ സാക്ഷ്യപ്പെടുത്തുകയും അതിനപ്പുറം ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്ന ‘അടയാളം’ എന്ന ആശയം വഹിക്കുന്നു.
- source_word: δεικνύεις ἡμῖν
  choice: ഞങ്ങൾക്കു കാണിച്ചുതരുന്നത്
  rationale: ദൃശ്യമായ സ്ഥിരീകരണം ആവശ്യപ്പെടുന്ന വെല്ലുവിളി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ἡμῖν എന്ന ദാതൃരൂപവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: നീ ഈ കാര്യങ്ങൾ ചെയ്യുന്നതിന്
  rationale: ὅτι ഇവിടെ ഈ പ്രവൃത്തികൾ ചെയ്യാനുള്ള അധികാരത്തിന്റെ അടിസ്ഥാനത്തിൽ അടയാളം ആവശ്യപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ചെയ്യുന്നതിന്’ എന്ന ഘടന കാരണവും അധികാരാവകാശവും തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ ‘οἱ Ἰουδαῖοι’ എന്ന പ്രയോഗത്തിന്റെ സൂചിതർ
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദർ’ നിലനിർത്തി
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’
  rationale: ഈ വാക്യം മാത്രം നേതാക്കളെന്നോ യെഹൂദ്യപ്രദേശക്കാരെന്നോ വ്യക്തമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ വ്യാപ്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് സന്ദർഭപരമായ പരിമിത അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ‘ഉത്തരം പറഞ്ഞു’ എന്ന ഇരട്ടപ്രയോഗം യാന്ത്രികമായി പകർത്താതെ മലയാളസംഭാഷണത്തിന് യോജിച്ച ‘ചോദിച്ചു’ ഉപയോഗിച്ചു; ‘അടയാളം’ എന്ന യോഹന്നാനീയ മുഖ്യപദം സംരക്ഷിച്ചു.
