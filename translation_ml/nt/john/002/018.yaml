revisions:
- from: 'അപ്പോൾ യെഹൂദർ അവനോടു ചോദിച്ചു[a]: “നീ ഈ കാര്യങ്ങൾ ചെയ്യുന്നതിന് എന്ത് അടയാളമാണ് ഞങ്ങൾക്കു കാണിച്ചുതരുന്നത്?”'
  to: 'അപ്പോൾ യെഹൂദർ അവനോടു ചോദിച്ചു[a]: “നീ ഈ കാര്യങ്ങൾ ചെയ്യുന്നതിനാൽ, എന്ത് അടയാളമാണ് ഞങ്ങൾക്കു കാണിച്ചുതരുന്നത്?”'
  rationale: The revision changes only the Malayalam rendering of ὅτι ταῦτα ποιεῖς, from a potentially purpose-oriented construction to a natural causal construction. It retains the source’s challenge, present action, Johannine ‘sign’ language, and the existing contextual footnote.
