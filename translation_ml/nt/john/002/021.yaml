  edition: SBLGNT
  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: ml
  text: എന്നാൽ അവൻ തന്റെ ശരീരമാകുന്ന ദേവാലയത്തെക്കുറിച്ചാണു സംസാരിച്ചുകൊണ്ടിരുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തന്റെ ശരീരമാകുന്ന വിശുദ്ധമന്ദിരം’ എന്നും വിവർത്തനം ചെയ്യാം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ναός ആണ്; മുഴുവൻ ദേവാലയസമുച്ചയത്തേക്കാൾ പ്രത്യേകമായി അതിലെ ഉള്ളിലുള്ള വിശുദ്ധമന്ദിരത്തെ ഈ പദം പലപ്പോഴും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ ഈ സൂചകസർവനാമം യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘അവൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ തെറ്റിദ്ധാരണയോടുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἔλεγεν
  choice: സംസാരിച്ചത്
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ വിവരണാത്മക സ്വഭാവം ‘സംസാരിക്കുകയായിരുന്നു’ എന്ന ഘടനയിൽ നിലനിർത്തുന്നു; ‘അർഥമാക്കിയത്’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: ജനിറ്റീവിനോടുകൂടിയ περίയുടെ സാധാരണ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ναοῦ
  choice: ദേവാലയം
  rationale: വായനാസൗകര്യമുള്ള പതിവുപദം; മുഴുവൻ ആലയസമുച്ചയത്തേക്കാൾ ഉള്ളിലെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കാവുന്ന ναός എന്ന പദത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: σώματος
  choice: ശരീരം
  rationale: മൂലത്തിലെ പ്രധാന രൂപകവും ദൈവശാസ്ത്രപരമായ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: ശരീരം വാക്യത്തിലെ കർത്താവായ യേശുവിന്റെതാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി കാണിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ശരീരത്തെ ദേവാലയവുമായി രൂപകാത്മകമായി തിരിച്ചറിയുന്നത്
  choice: ‘തന്റെ ശരീരമാകുന്ന ദേവാലയം’ എന്ന് രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
  alternative: ‘തന്റെ ശരീരത്തിന്റെ ദേവാലയം’ / ‘തന്റെ ശരീരമെന്ന വിശുദ്ധമന്ദിരം’
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയ്ക്ക് ‘തന്റെ ശരീരത്തിന്റെ ദേവാലയം’ എന്ന കൂടുതൽ പദാനുപദ രൂപം സാധ്യമാണെങ്കിലും മലയാളത്തിൽ അത് ശരീരം കൈവശംവെക്കുന്ന മറ്റൊരു ദേവാലയം എന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം. ‘ശരീരമാകുന്ന ദേവാലയം’ യോഹന്നാന്റെ വിശദീകരണാത്മക തിരിച്ചറിയൽ നിലനിർത്തുകയും അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദേവാലയം’ പ്രധാന പാഠത്തിൽ വായനാസൗകര്യത്തിനായി ഉപയോഗിച്ചു; ναός എന്ന പദത്തിന്റെ കൂടുതൽ നിർദിഷ്ടമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി.
