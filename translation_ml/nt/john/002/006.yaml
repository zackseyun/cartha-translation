source:
  edition: SBLGNT
  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: ml
  text: യെഹൂദരുടെ ശുദ്ധീകരണാചാരമനുസരിച്ച്[a] കല്ലുകൊണ്ടുള്ള ആറു വെള്ളപ്പാത്രങ്ങൾ അവിടെ വെച്ചിരുന്നു; ഓരോന്നിനും രണ്ടോ മൂന്നോ അളവ് ഉൾക്കൊള്ളാനുള്ള ശേഷിയുണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദരുടെ ശുദ്ധീകരണാചാരത്തിനായി’; ഈ പ്രയോഗം ആചാരപരമായ ശുദ്ധീകരണരീതികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: '‘അളവ്’ (ഗ്രീക്ക്: metretēs) ഒരു പുരാതന ദ്രവ അളവായിരുന്നു; ഏകദേശം 35–40 ലിറ്റർ.'
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  choice: കല്ലുകൊണ്ടുള്ള വെള്ളപ്പാത്രങ്ങൾ
  rationale: λίθιναι പാത്രങ്ങളുടെ നിർമ്മാണവസ്തു കല്ലാണെന്നു വ്യക്തമാക്കുന്നു; ὑδρίαι വെള്ളം സൂക്ഷിക്കുന്ന പാത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: ἦσαν δὲ ἐκεῖ … κείμεναι
  choice: അവിടെ വെച്ചിരുന്നു
  rationale: δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു. κείμεναι ഇവിടെ പാത്രങ്ങൾ ഒരു സ്ഥലത്ത് വെച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: യെഹൂദരുടെ ശുദ്ധീകരണാചാരമനുസരിച്ച്
  rationale: κατά ഇവിടെ ആചാരത്തോടുള്ള അനുരൂപതയെയോ അതുമായി ബന്ധപ്പെട്ട ഉപയോഗത്തെയോ സൂചിപ്പിക്കാം. καθαρισμός എന്നതിന്റെ ആചാരപരമായ ശുദ്ധീകരണാർത്ഥം ‘ശുദ്ധീകരണാചാരം’ വ്യക്തമാക്കുന്നു.
- source_word: χωροῦσαι
  choice: കൊള്ളുമായിരുന്നു
  rationale: ഇവിടെ χωρέω പാത്രത്തിന്റെ ഉൾക്കൊള്ളൽശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: ഓരോന്നിലും രണ്ടോ മൂന്നോ അളവ് വീതം
  rationale: ἀνάയുടെ വിതരണാർഥം ‘ഓരോന്നിലും … വീതം’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു. μετρητής എന്ന പുരാതന അളവിനെ കൃത്യമല്ലാത്ത ആധുനിക പരിവർത്തനത്തോടെ മുഖ്യപാഠത്തിൽ മാറ്റാതെ ‘അളവ്’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῶν Ἰουδαίων എന്ന പ്രയോഗത്തിന്റെ സാംസ്കാരിക-മതപരമായ അർഥം
  choice: യെഹൂദരുടെ
  alternative: യെഹൂദ്യരുടെ
  rationale: ഈ സന്ദർഭത്തിൽ പ്രയോഗം പ്രദേശപരമായ തിരിച്ചറിയലിനേക്കാൾ ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട യെഹൂദ ആചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: κατά എന്നതിലെ അനുരൂപതയും ഉദ്ദേശ്യവും തമ്മിലുള്ള സൂക്ഷ്മത
  choice: ശുദ്ധീകരണാചാരമനുസരിച്ച്
  alternative: ശുദ്ധീകരണാചാരത്തിനായി
  rationale: മുഖ്യപാഠത്തിൽ ആചാരത്തോടുള്ള അനുരൂപത നിലനിർത്തുന്നു; പാത്രങ്ങൾ ആ ശുദ്ധീകരണത്തിനായി ഉപയോഗിച്ചിരുന്നുവെന്ന ഉദ്ദേശ്യാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘കൽഭരണികൾ’ എന്ന സാന്ദ്രമായ രൂപത്തിനു പകരം കൂടുതൽ സ്വാഭാവികമായ ‘കല്ലുകൊണ്ടുള്ള വെള്ളപ്പാത്രങ്ങൾ’ ഉപയോഗിച്ചു. പുരാതന അളവിന്റെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച് ഏകദേശ ആധുനിക തുല്യം അടിക്കുറിപ്പിലാക്കി.
