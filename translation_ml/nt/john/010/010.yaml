revisions:
- from: കള്ളൻ വരുന്നത് മോഷ്ടിക്കാനും അറുക്കാനും നശിപ്പിക്കാനും മാത്രമാണ്[a]; ഞാനോ വന്നത് അവർക്ക് ജീവൻ ഉണ്ടാകാനും അത് സമൃദ്ധമായി ഉണ്ടാകാനുമാണ്[b].
  to: കള്ളൻ വരുന്നത് മോഷ്ടിക്കാനും അറുക്കാനും നശിപ്പിക്കാനും മാത്രമാണ്[a]; ഞാനോ, അവർക്ക് ജീവൻ ലഭിക്കാനും അത് സമൃദ്ധമായി ലഭിക്കാനുമാണ് വന്നത്[b].
  rationale: ‘ഉണ്ടാകുക’ എന്ന അസ്തിത്വസൂചനയ്ക്ക് പകരം ‘ലഭിക്കുക’ ഉപയോഗിച്ചു. ഇതിലൂടെ ജീവന്റെ ദാനവും അതിന്റെ സമൃദ്ധിയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി വരുന്നു; ‘നിത്യജീവൻ’ പോലുള്ള വ്യാഖ്യാനവിപുലീകരണമോ ഭൗതികസമൃദ്ധിയെന്ന സൂചനയോ ചേർക്കുന്നില്ല. അടിക്കുറിപ്പ് b-യും പ്രധാനപാഠത്തിലെ പരിഷ്കൃത ഘടനയോട് ചേർത്ത് സ്വാഭാവികമാക്കി.
