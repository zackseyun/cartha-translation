id: JHN.10.10
reference: John 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: ml
  text: കള്ളൻ വരുന്നത് മോഷ്ടിക്കാനും അറുക്കാനും നശിപ്പിക്കാനും മാത്രമാണ്[a]; ഞാനോ, അവർക്ക് ജീവൻ ലഭിക്കാനും അത് സമൃദ്ധമായി ലഭിക്കാനുമാണ് വന്നത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അറുക്കാനും’ എന്നതിന് പകരം ‘കൊല്ലാനും’ എന്നും പരിഭാഷപ്പെടുത്താം (θύσῃ). ഈ ഗ്രീക്ക് ക്രിയ പലപ്പോഴും മൃഗങ്ങളെ അറുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ആടുകളുടെ ദൃശ്യവുമായി അത് യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർക്ക് ജീവൻ സമൃദ്ധമായി ലഭിക്കാനും’ അല്ലെങ്കിൽ ‘അവർക്ക് ജീവൻ പൂർണതയിൽ ലഭിക്കാനും.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: കള്ളൻ
  rationale: നിശ്ചയാർഥകവും പ്രതിനിധാനപരവുമായ ഏകവചനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഇടയനെയും ആടുകളെയും കുറിച്ചുള്ള പ്രഭാഷണത്തിൽ ഒരു വിഭാഗത്തെ പ്രതിനിധാനം ചെയ്യുന്ന രൂപമാണിത്.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: വരുന്നത് ... മാത്രമാണ്
  rationale: വരവിന്റെ ഉദ്ദേശ്യം പിന്നാലെ പറയുന്ന പ്രവൃത്തികളിൽ മാത്രമായി പരിമിതപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα κλέψῃ
  choice: മോഷ്ടിക്കാനും
  rationale: ഉദ്ദേശ്യത്തെ ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; തുടർന്നുള്ള സമാന്തര ക്രിയകളുമായുള്ള ഘടനയും കാക്കുന്നു.
- source_word: θύσῃ
  choice: അറുക്കാനും
  rationale: മൃഗങ്ങളെ അറുക്കുക എന്ന സാധാരണ അർഥം സന്ദർഭത്തിലെ ആടുകളുടെ ദൃശ്യവുമായി യോജിക്കുന്നു; പൊതുവായ ‘കൊല്ലുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀπολέσῃ
  choice: നശിപ്പിക്കാനും
  rationale: നാശത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാതെ സമഗ്രമായ വിനാശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγὼ ἦλθον
  choice: ഞാനോ വന്നത്
  rationale: കള്ളന്റെ ഉദ്ദേശ്യവും യേശുവിന്റെ ഉദ്ദേശ്യവും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം ‘ഞാനോ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുകയും അഓറിസ്റ്റിനെ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: അവർക്ക് ജീവൻ ഉണ്ടാകാനും
  rationale: യോഹന്നാനിലെ പ്രധാന പദമായ ζωήയെ ‘നിത്യജീവൻ’ എന്ന് വികസിപ്പിക്കാതെ ‘ജീവൻ’ എന്നു തന്നെ നിലനിർത്തുന്നു; ഉദ്ദേശ്യവാക്യവും സംരക്ഷിക്കുന്നു.
- source_word: περισσὸν ἔχωσιν
  choice: അത് സമൃദ്ധമായി ഉണ്ടാകാനുമാണ്
  rationale: περισσόν ജീവൻ ഉണ്ടായിരിക്കുന്നതിന്റെ അളവിനെയോ സമൃദ്ധിയെയോ വിശേഷിപ്പിക്കുന്നു. ‘അത്’ എന്നത് ജീവനെ വ്യക്തമായി തിരിച്ചുചൂണ്ടുന്നു; ഭൗതിക സമൃദ്ധിയെന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ζωήയുടെ വ്യാപ്തി
  choice: ജീവൻ
  alternative: നിത്യജീവൻ; യഥാർഥ ജീവൻ
  rationale: വാക്യത്തിൽ ‘നിത്യമായ’ എന്ന വിശേഷണം ഇല്ല. ‘ജീവൻ’ എന്ന പരിഭാഷ പദത്തിന്റെ യോഹന്നാനീയ ദൈവശാസ്ത്രഗാംഭീര്യം നിലനിർത്തുന്നു, എന്നാൽ മൂലപാഠം വ്യക്തമാക്കാത്ത ഒരു കൂടുതൽ നിർദിഷ്ട ആശയം പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: περισσόν എന്ന പദത്തിന്റെ ശക്തി
  choice: സമൃദ്ധമായി
  alternative: സമൃദ്ധിയിൽ; പൂർണമായി
  rationale: യേശു നൽകുന്ന ജീവന്റെ നിറവും സമൃദ്ധിയും ഇത് അറിയിക്കുന്നു; അതിനെ ഭൗതിക സമ്പത്തിന്റെയോ ഐശ്വര്യത്തിന്റെയോ വാഗ്ദാനമായി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘കള്ളൻ’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന പദമാണ്. സമാന്തരമായ ‘മോഷ്ടിക്കാനും, അറുക്കാനും, നശിപ്പിക്കാനും’ എന്ന ക്രമം ഗ്രീക്കിലെ മൂന്നു പ്രവൃത്തികളുടെ ശക്തി നിലനിർത്തുന്നു; ‘ഞാനോ’ രണ്ടു ദൗത്യങ്ങൾ തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
