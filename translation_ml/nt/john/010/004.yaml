  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: ml
  text: തന്റെ ആടുകളെയെല്ലാം പുറത്തുകൊണ്ടുവന്നശേഷം[a], അവൻ അവയുടെ മുമ്പിൽ നടക്കുന്നു; ആടുകൾ അവന്റെ ശബ്ദം അറിയുന്നതിനാൽ അവനെ അനുഗമിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പുറത്തേക്ക് ഓടിച്ചുവിട്ടശേഷം” അല്ലെങ്കിൽ “പുറത്തേക്ക് നയിച്ചശേഷം” എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കു ക്രിയയ്ക്ക് ഒരു അടച്ച ഇടത്തിൽനിന്ന് പുറത്തേക്ക് ഓടിക്കുന്നതിന്റെയോ കൊണ്ടുവരുന്നതിന്റെയോ അർഥം ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: -ശേഷം
  rationale: സബ്ജങ്ക്റ്റീവോടുകൂടിയ അനിശ്ചിത കാലവാക്യം ഇവിടെ ഇടയൻ ആദ്യം ആടുകളെ പുറത്തുകൊണ്ടുവരുകയും തുടർന്ന് മുമ്പായി നടക്കുകയും ചെയ്യുന്ന ക്രമമായി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰ ἴδια πάντα
  choice: തനിക്കുള്ളവരെയെല്ലാം
  rationale: ഗ്രീക്കിലെ നപുംസക ബഹുവചനപ്രയോഗം ഇടയനുള്ളവയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ആടുകളാണെങ്കിലും, പിന്നാലെ വരുന്ന ‘ആടുകൾ’ എന്ന വ്യക്തമായ പരാമർശത്തിനു മുമ്പ് അതു ചേർക്കാതെ മൂലപ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: ἐκβάλῃ
  choice: പുറത്തുകൊണ്ടുവന്ന
  rationale: ἐκβάλλω എന്നതിന് തള്ളിപ്പുറത്താക്കുക എന്ന ശക്തമായ അർഥമുണ്ടാകാമെങ്കിലും, തൊഴുത്തിൽനിന്ന് ആടുകളെ പുറത്തേക്കു കൊണ്ടുവരുന്ന ഈ ഇടയസന്ദർഭത്തിൽ ‘പുറത്തുകൊണ്ടുവരുക’ സ്വാഭാവികവും അനാവശ്യമായ കഠിനത ഒഴിവാക്കുന്നതുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: അവൻ അവർക്കു മുമ്പായി നടക്കുന്നു
  rationale: ഇടയൻ ആടുകളുടെ മുന്നിൽ നടന്ന് വഴികാട്ടുന്ന ദൃശ്യവും സ്ഥലബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: ആടുകൾ അവനെ അനുഗമിക്കുന്നു
  rationale: ἀκολουθέωയോടുള്ള ദത്തിവിഭക്തി മലയാളത്തിൽ നേരിട്ടുള്ള കർമത്തോടെ സ്വാഭാവികമായി നൽകുന്നു; ഇടയനെ പിന്തുടരുന്ന ആശയം ‘അനുഗമിക്കുന്നു’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: അവന്റെ ശബ്ദം അറിയുന്നതിനാൽ
  rationale: ὅτι കാരണത്തെ സൂചിപ്പിക്കുകയും οἶδα ‘അറിയുക’ എന്ന അടിസ്ഥാന അർഥം വഹിക്കുകയും ചെയ്യുന്നു; തിരിച്ചറിയൽ എന്ന സന്ദർഭനിറം ഉൾക്കൊള്ളാമെങ്കിലും അത് വിവർത്തനത്തിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ഇടയദൃശ്യവും ἐκβάλῃ എന്ന ക്രിയയുടെ ശക്തിയും
  choice: ‘പുറത്തുകൊണ്ടുവന്ന’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘പുറത്തേക്ക് ഓടിച്ചുവിട്ട’ അല്ലെങ്കിൽ ‘പുറത്തേക്ക് നയിച്ച’
  rationale: അടുത്ത സന്ദർഭം സ്വന്തം ആടുകളോടുകൂടിയ ഇടയനെയാണ് ചിത്രീകരിക്കുന്നത്, ശത്രുതാപരമായ പുറത്താക്കലല്ല. അതിനാൽ പുറത്തേക്കുള്ള ചലനം സംരക്ഷിക്കുമ്പോഴും ക്രിസ്തു തന്റെ ആടുകളോട് ബലപ്രയോഗം ചെയ്യുന്നു എന്ന വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ‘പുറത്തുകൊണ്ടുവരുക’ ഉപയോഗിച്ചു; ക്രിയയുടെ ശക്തിയിലുള്ള യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തനിക്കുള്ളവരെയെല്ലാം’ മൂലത്തിലെ സംക്ഷിപ്തമായ ഉടമസ്ഥതാപ്രയോഗം നിലനിർത്തുന്നു; ‘അവർക്കു മുമ്പായി നടക്കുന്നു’ ഇടയദൃശ്യത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
