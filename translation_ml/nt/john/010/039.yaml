  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: ml
  text: അതിനാൽ അവർ വീണ്ടും അവനെ പിടിക്കാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു; എന്നാൽ അവൻ അവരുടെ കൈയിൽനിന്ന് ഒഴിഞ്ഞുപോയി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അവരുടെ കൈയിൽനിന്ന്’; ഇവിടെ ‘കൈ’ അധികാരത്തെയോ നിയന്ത്രണത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘അവരുടെ പിടിയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ഫലിക്കാതെപോയതോ ആയ ശ്രമത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പിടിക്കാൻ ശ്രമിച്ചു’ എന്നത് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ആ ഭാവം നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ വാദപ്രതിവാദത്തിൽനിന്നുണ്ടാകുന്ന പ്രതികരണത്തെ ബന്ധിപ്പിക്കുന്ന അനുമാനാത്മകമായ discourse marker ആണ്.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുമ്പുണ്ടായ പിടികൂടൽശ്രമത്തിന്റെ ആവർത്തനം നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πιάσαι
  choice: പിടിക്കാൻ
  rationale: ശാരീരികമായി പിടിച്ചടക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; ‘അറസ്റ്റ് ചെയ്യുക’ എന്ന നിയമപരമായ അധികസൂചന ചേർക്കുന്നില്ല.
- source_word: ἐξῆλθεν
  choice: ഒഴിഞ്ഞുപോയി
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം ‘പുറത്തുപോയി’ എന്നാണെങ്കിലും, ἐκ τῆς χειρὸς αὐτῶν എന്ന ഘടനയോടൊപ്പം ഇവിടെ അവരുടെ നിയന്ത്രണത്തിൽനിന്ന് പുറത്തുകടന്ന ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: അവരുടെ കൈയിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘കൈ’യും അധികാരം/പിടി സൂചിപ്പിക്കുന്ന പ്രയോഗവും അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ വിടുതലിനെ വ്യക്തമായ ‘രക്ഷപ്പെട്ടു’ എന്ന ക്രിയയാക്കി പറയണമോ, ഗ്രീക്കിലെ ‘അവരുടെ കൈയിൽനിന്ന് പുറത്തുപോയി’ എന്ന പ്രയോഗത്തോട് ചേർന്നുനിൽക്കണമോ
  choice: ‘അവരുടെ കൈയിൽനിന്ന് ഒഴിഞ്ഞുപോയി’
  alternative: ‘അവരിൽനിന്ന് രക്ഷപ്പെട്ടു’ / ‘അവരുടെ പിടിയിൽനിന്ന് പുറത്തുപോയി’
  rationale: ‘രക്ഷപ്പെട്ടു’ എന്ന് അമിതമായി വ്യാഖ്യാനിക്കാതെ, പിടിയിലും നിയന്ത്രണത്തിലുംനിന്ന് പുറത്തുകടന്നുവെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അറസ്റ്റ് ചെയ്യാൻ’ എന്നതിനു പകരം ‘പിടിക്കാൻ’ ഉപയോഗിച്ച് മൂലത്തിലെ ശാരീരികവും വൈരപരവുമായ ഭാവം നിലനിർത്തി; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തു.
