  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: ml
  text: യേശു ദൈവാലയപരിസരത്ത്[a] ശലോമോന്റെ തൂണമണ്ഡപത്തിൽ[b] നടന്നുകൊണ്ടിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവാലയപരിസരം” എന്നതിനുള്ള ഗ്രീക്ക് പദം ഇവിടെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദൈവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ “തൂണുനിരയുള്ള മൂടിയ നടപ്പാത”; ഗ്രീക്ക് പദം മേൽക്കൂരയും തൂണുകളുമുള്ള നടപ്പാതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഈ വാക്യം മുൻവാക്യത്തിന്റെ പശ്ചാത്തലവിവരണം തുടരുന്നു. മലയാളത്തിൽ നിർബന്ധമായി ‘യും/അപ്പോൾ’ ചേർക്കുന്നത് അസ്വാഭാവികമാകുകയോ ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാലക്രമസൂചന നൽകുകയോ ചെയ്യും.
- source_word: περιεπάτει
  choice: നടന്നുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പുരോഗമനസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἱερῷ
  choice: ദൈവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൈവാലയാങ്കണം’ പൊതുജനങ്ങൾക്ക് സഞ്ചരിക്കാവുന്ന പരിസരത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: στοᾷ
  choice: മണ്ഡപത്തിൽ
  rationale: στοά തൂണുകളുള്ള മേൽക്കൂരയിട്ട നടപ്പാതയെയോ മണ്ഡപത്തെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘മണ്ഡപം’ വായനാസൗകര്യവും സ്ഥലനാമത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു; കൃത്യമായ വാസ്തുവിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ Σολομῶνος
  choice: ശലോമോന്റെ
  rationale: ബന്ധസൂചക ഷഷ്ഠിയെ മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
