translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ക്രിയയുടെ അപൂർണ്ണ ഭൂതകാലസ്വഭാവം ‘നടന്നുകൊണ്ടിരിക്കുകയായിരുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിച്ചു. രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
