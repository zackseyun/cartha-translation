  terminology: Use ‘ദൈവാലയപരിസരം’ for ἱερόν, avoiding an implication of the inner sanctuary or a single courtyard. ‘ശലോമോന്റെ തൂണമണ്ഡപം’ appropriately renders the established place-name while retaining the colonnaded-portico sense of στοά.
