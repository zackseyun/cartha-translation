id: JHN.10.31
reference: John 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: ml
  text: അതുകൊണ്ട് യെഹൂദന്മാർ[a] അവനെ കല്ലെറിയാൻ വീണ്ടും കല്ലുകൾ എടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഈ സന്ദർഭത്തിൽ ‘യെഹൂദനേതാക്കൾ’ എന്നോ ‘യെഹൂദ്യർ’ എന്നോ മനസ്സിലാക്കാം. യോഹന്നാന്റെ സുവിശേഷത്തിലെ ‘യെഹൂദന്മാർ’ എന്ന പ്രയോഗം പലപ്പോഴും യെഹൂദജനതയെ മുഴുവനായി അല്ല, യേശുവിനെ എതിർത്ത ചില പ്രത്യേക യെഹൂദരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: എടുത്തു
  rationale: βαστάζω എന്നതിന് ‘വഹിക്കുക’, ‘എടുക്കുക’ എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ഉടൻ കല്ലെറിയാനുള്ള ഉദ്ദേശ്യത്തോടെ കല്ലുകൾ കൈയിലെടുക്കുന്നതായതിനാൽ ‘എടുത്തു’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ പ്രസ്താവനയോടുള്ള പ്രതികരണവും അതിൽനിന്നുള്ള കഥാഗതിബന്ധവും οὖν സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ ഈ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: πάλιν ആവർത്തനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘വീണ്ടും’ അതിന്റെ സ്വാഭാവികമായ മലയാളപരിഭാഷയാണ്.
- source_word: λίθους
  choice: കല്ലുകൾ
  rationale: λίθος എന്ന സാധാരണ നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘കല്ല്’ ആണ്. കല്ലെറിഞ്ഞു കൊല്ലാനുള്ള ഉദ്ദേശ്യം ക്രിയയിൽ വ്യക്തമാകുന്നതിനാൽ നാമത്തിൽ അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നു. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഇത് സന്ദർഭാനുസരണം യേശുവിന്റെ പ്രത്യേക യെഹൂദ എതിരാളികളെ സൂചിപ്പിക്കാമെന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα λιθάσωσιν
  choice: കല്ലെറിയാൻ
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; λιθάζω എന്ന പ്രത്യേക ക്രിയയുടെ അർഥം സ്വാഭാവികമായും സംക്ഷിപ്തമായും ‘കല്ലെറിയാൻ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമമാണ്; ‘അവനെ’ കൃത്യമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചനയും വ്യാപ്തിയും
  choice: പ്രധാനവാചകത്തിൽ ‘യെഹൂദന്മാർ’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, സന്ദർഭപരമായി ചുരുങ്ങിയ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’
  rationale: വാക്യം തന്നെ ‘നേതാക്കൾ’ എന്ന് പ്രത്യേകം പറയാത്തതിനാൽ പ്രധാനവാചകത്തിൽ അർഥവ്യാപ്തി ചുരുക്കുന്നത് ഒഴിവാക്കി. എന്നാൽ ഈ പ്രയോഗം യെഹൂദജനതയെ മുഴുവനായി സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ യോഹന്നാന്റെ സന്ദർഭപരമായ ഉപയോഗം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ ഉദ്ദേശ്യബന്ധവും ആവർത്തനവും വ്യക്തമായി നിലനിർത്തിയപ്പോൾ, οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിലെ സന്ദർഭപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
