id: JHN.10.30
reference: John 10:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/030.yaml
  text: I and the Father are one[a].
translation:
  language: ml
  text: ഞാനും പിതാവും ഒന്നാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒന്ന്’ എന്നതിനുള്ള ഗ്രീക്ക് പദം നപുംസകലിംഗത്തിലാണ്. ഇത് യേശുവും പിതാവും ഒരേ വ്യക്തിയാണെന്ന് അർഥമാക്കാതെ അവരുടെ ഏകത്വത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമായി നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ ഏകവചന സർവനാമമാണ്; ഊന്നൽ നിലനിർത്താൻ മലയാളത്തിലും പ്രകടമായി ചേർത്തു.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: രണ്ട് കർത്താക്കളെയും സ്വാഭാവികമായ മലയാള സമുച്ചയഘടനയിൽ ബന്ധിപ്പിക്കുന്നു; അധിക അർത്ഥഭാവം ചേർക്കുന്നില്ല.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ യേശുവിന്റെ പിതാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമപരമായ പ്രയോഗം; ആ ദൈവിക-വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: ἕν
  choice: ഒന്ന്
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ഏകവചനത്തിന്റെ നേരിട്ടുള്ള തുല്യപ്രയോഗം; ഐക്യം പ്രസ്താവിക്കുമ്പോഴും യേശുവിനെയും പിതാവിനെയും ഒരേ വ്യക്തിയായി തിരിച്ചറിയുന്നില്ല.
- source_word: ἐσμεν
  choice: ആകുന്നു
  rationale: ഒന്നാംപുരുഷ ബഹുവചന വർത്തമാനരൂപത്തിന്റെ അർത്ഥം വാക്യത്തിലെ സംയുക്തകർത്താവിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘ഞാനും പിതാവും’ എന്നത് വ്യക്തിവ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: നപുംസകലിംഗമായ ἕν എന്ന പദവും ബഹുവചനമായ ἐσμεν എന്ന ക്രിയയും ചേർന്നുള്ള ക്രിസ്തുശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പ്രസ്താവന
  choice: യേശുവും പിതാവും തമ്മിലുള്ള യഥാർഥ ഏകത്വം ഉറപ്പിക്കുമ്പോഴും അവരുടെ വ്യക്തിവ്യത്യാസം നിലനിർത്തുന്ന വിധത്തിൽ ‘ഞാനും പിതാവും ഒന്നാകുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാനും പിതാവും ഒരേ കാര്യമാണ്’ / ‘ഞാനും പിതാവും ഐക്യത്തിലാണ്’
  rationale: ‘ഒന്ന്’ എന്ന നപുംസകലിംഗരൂപം ഇരുവരെയും ഒരേ വ്യക്തിയാക്കുന്ന വായന ഒഴിവാക്കുന്നു; ബഹുവചനക്രിയ വ്യക്തിവ്യത്യാസം സൂചിപ്പിക്കുന്നു. അതേസമയം, വാക്യത്തെ വെറും അഭിപ്രായസാമ്യമായി ദുർബലപ്പെടുത്തുകയോ പിൽക്കാല സിദ്ധാന്തഭാഷ ചേർത്ത് വിശദീകരിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒന്നാകുന്നു’ എന്ന പരമ്പരാഗതവും ഇപ്പോഴും ഗ്രാഹ്യവുമായ പ്രയോഗം മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
