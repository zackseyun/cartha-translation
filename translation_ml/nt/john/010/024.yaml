id: JHN.10.24
reference: John 10:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: ml
  text: 'അതിനാൽ യെഹൂദന്മാർ[b] അവനെ വളഞ്ഞുനിന്ന് അവനോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “എത്രകാലം നീ ഞങ്ങളെ അനിശ്ചിതത്വത്തിൽ നിർത്തും?[a] നീ തന്നെയാണ് മശീഹ എങ്കിൽ, ഞങ്ങളോട് വ്യക്തമായി പറയുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “എത്രകാലം നീ ഞങ്ങളുടെ പ്രാണനെ ഉയർത്തിവയ്ക്കും?” ഒരാളെ അനിശ്ചിതത്വത്തിലോ ആകാംക്ഷയിലോ നിർത്തുക എന്നർഥമുള്ള ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദന്മാർ” എന്നത് ചില സന്ദർഭങ്ങളിൽ യെഹൂദജനതയെ മുഴുവനായി സൂചിപ്പിക്കാതെ, കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യയിലെ അധികാരികളെയോ യേശുവിന്റെ എതിരാളികളെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: വളഞ്ഞുനിന്ന്
  rationale: κυκλόω എന്ന ക്രിയയുടെ ‘ചുറ്റിവളയുക’ എന്ന ഭൗതികവും ഇവിടെ അല്പം ഏറ്റുമുട്ടൽഭാവമുള്ളതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭവുമായി ഉള്ള നിഗമനാത്മക/ആഖ്യാനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ പദപ്രയോഗം പ്രധാനവാചകത്തിൽ അതേ പരിധിയോടെ നിലനിർത്തുന്നു; യോഹന്നാനിലെ സന്ദർഭപരമായ ചുരുങ്ങിയ സൂചന അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടരുന്ന പ്രവൃത്തിഭാവം സൂക്ഷിക്കുകയും തുടർന്ന് വരുന്ന വാക്കുകൾ ഒരു ചോദ്യമായതിനാൽ സ്വാഭാവിക മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: Ἕως πότε
  choice: എത്രകാലം
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: ഞങ്ങളെ അനിശ്ചിതത്വത്തിൽ നിർത്തും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഞങ്ങളുടെ പ്രാണനെ ഉയർത്തുന്നു’ എന്ന രൂപകപ്രയോഗം ഇവിടെ ആശയക്കുഴപ്പത്തിലോ ആകാംക്ഷയിലോ നിർത്തുക എന്നാണ്; അർഥം വ്യക്തമായി നൽകുകയും ദൃശ്യരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു യെഹൂദ പ്രതീക്ഷയിലുള്ള അഭിഷിക്ത രാജാവും വിടുവിക്കുന്നവനും എന്ന പദവിയായതിനാൽ ‘മശീഹ’ എന്ന് നൽകുന്നു.
- source_word: εἰπὲ ἡμῖν
  choice: ഞങ്ങളോട് ... പറയുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: παρρησίᾳ
  choice: വ്യക്തമായി
  rationale: ഈ സന്ദർഭത്തിൽ ആവശ്യപ്പെടുന്നത് തുറന്നതും അസന്ദിഗ്ധവുമായ പ്രസ്താവനയാണ്; ‘വ്യക്തമായി’ അതിനെ കൃത്യമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ഈ പദം പേരുപോലെ അല്ല, ചോദ്യംചെയ്യപ്പെടുന്ന യെഹൂദ മശീഹാപദവിയായാണ് പ്രവർത്തിക്കുന്നത്.
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്നതിന്റെ സൂചന
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ നേതാക്കൾ / യെഹൂദ്യർ
  rationale: ഈ വാക്യം തന്നെ നേതാക്കൾ എന്നോ യെഹൂദ്യർ എന്നോ പരിധി ചുരുക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിലെ യഥാർഥ വ്യാപ്തി പ്രധാനവാചകത്തിൽ നിലനിർത്തി സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വളഞ്ഞുനിന്ന്’ എന്നത് സംഭവത്തിന്റെ ഭൗതിക തീവ്രതയും ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്നത് ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന ഭാവവും സൂക്ഷിക്കുന്നു. അക്ഷരാർഥത്തിൽ ദുരൂഹമായ ഗ്രീക്ക് പ്രയോഗം പ്രധാനവാചകത്തിൽ ആശയസമത്വത്തോടെ നൽകി അതിന്റെ രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
