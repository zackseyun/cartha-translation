id: JHN.10.32
reference: John 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “പിതാവിൽനിന്നുള്ള[a] അനേകം നല്ല പ്രവൃത്തികൾ ഞാൻ നിങ്ങൾക്കു കാണിച്ചുതന്നു. അവയിൽ ഏതു പ്രവൃത്തി നിമിത്തമാണ് നിങ്ങൾ എന്നെ കല്ലെറിയുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില വിവർത്തനങ്ങളിൽ “എന്റെ പിതാവിൽനിന്നുള്ള” എന്നു കാണാം; ഇവിടെ സ്വീകരിച്ച ഗ്രീക്ക് പാഠത്തിൽ “പിതാവിൽനിന്നുള്ള” എന്നു മാത്രമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ സാധാരണ പ്രതികരണക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Πολλὰ ἔργα καλὰ
  choice: അനേകം നല്ല പ്രവൃത്തികൾ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ἔργα യേശുവിന്റെ ദൈവിക പ്രാധാന്യമുള്ള പ്രവൃത്തികളെയും അടയാളങ്ങളെയും സൂചിപ്പിക്കാം; ‘പ്രവൃത്തികൾ’ ആ ബന്ധം നിലനിർത്തുന്നു. καλά അവയുടെ നന്മയും പ്രശംസനീയതയും പ്രകടമാക്കുന്നു.
- source_word: ἔδειξα
  choice: ഞാൻ നിങ്ങൾക്കു കാണിച്ചുതന്നു
  rationale: ἔδειξα എന്നത് വെറും പ്രവർത്തിച്ചുവെന്നതിലുപരി അവർക്കു ദൃശ്യമാക്കി എന്ന ആശയം വഹിക്കുന്നു; ‘കാണിച്ചുതന്നു’ മലയാളത്തിൽ സ്വാഭാവികമായി അതു നൽകുന്നു.
- source_word: ἐκ τοῦ πατρός
  choice: പിതാവിൽനിന്നുള്ള
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ‘എന്റെ’ എന്ന ഉടമസ്ഥസർവനാമം ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: അവയിൽ ഏതു പ്രവൃത്തി നിമിത്തമാണ്
  rationale: διά + accusative ഇവിടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. αὐτῶν മുൻപറഞ്ഞ പ്രവൃത്തികളിലേക്കു മടങ്ങിപ്പോകുന്നതും ഏകവചനമായ ἔργον നിലനിർത്തുന്നതും ഈ രൂപത്തിൽ വ്യക്തമാണ്.
- source_word: ἐμὲ λιθάζετε
  choice: നിങ്ങൾ എന്നെ കല്ലെറിയുന്നത്
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ‘കല്ലെറിഞ്ഞു കൊല്ലാൻ ശ്രമിക്കുന്നത്’ എന്നു വികസിപ്പിക്കുന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഉദ്ദേശവും ശ്രമവും കൂട്ടിച്ചേർക്കും.
theological_decisions:
- issue: യേശുവിന്റെ വാക്കുകളിലെ ‘പിതാവ്’ എന്ന പരാമർശം
  choice: ‘പിതാവ്’ എന്നു മാത്രം നിലനിർത്തി
  alternative: ‘എന്റെ പിതാവ്’
  rationale: തിരഞ്ഞെടുത്ത ഗ്രീക്ക് പാഠത്തിൽ μου (‘എന്റെ’) ഇല്ല. സന്ദർഭം യേശുവും പിതാവും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും വിവർത്തനം മൂലപാഠത്തേക്കാൾ അത് ശക്തിപ്പെടുത്തുന്നില്ല.
- issue: പ്രവൃത്തികൾ ‘പിതാവിൽനിന്നുള്ളവ’ എന്നതിന്റെ ബന്ധം
  choice: ഉറവിടം സൂചിപ്പിക്കുന്ന ‘പിതാവിൽനിന്നുള്ള’
  alternative: ‘പിതാവിനുവേണ്ടി ചെയ്ത’ / ‘പിതാവിന്റെ അധികാരത്താൽ ചെയ്ത’
  rationale: ἐκ നേരിട്ട് ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. പ്രതിനിധിത്വമോ അധികാരമോ എന്ന വ്യാഖ്യാനം മാത്രം തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ അർഥപരിധി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘നല്ല പ്രവൃത്തികൾ’, ‘പിതാവിൽനിന്നുള്ള’, ‘കല്ലെറിയുന്നത്’ എന്നീ രൂപങ്ങൾ യോഹന്നാന്റെ പദപ്രയോഗവും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
