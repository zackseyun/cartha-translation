id: JHN.10.5
reference: John 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: ml
  text: എന്നാൽ അന്യനായ ഒരാളെ അവർ ഒരിക്കലും അനുഗമിക്കുകയില്ല[a]; പകരം അയാളിൽനിന്ന് ഓടിപ്പോകും. കാരണം, അന്യരുടെ ശബ്ദം അവർക്ക് അറിയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവർ തീർച്ചയായും അനുഗമിക്കുകയില്ല.” ഗ്രീക്കിൽ ഊന്നിയ നിഷേധമാണ് (οὐ μή) ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: “ശബ്ദം അറിയില്ല” എന്നത് “ശബ്ദം തിരിച്ചറിയുന്നില്ല” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ / τῶν ἀλλοτρίων
  choice: അന്യനായ ഒരാളെ / അന്യരുടെ
  rationale: ഇടയ-ആട് രൂപകത്തിൽ ആടുകൾക്ക് സ്വന്തക്കാരനല്ലാത്ത, പരിചിതനായ ഇടയനിൽനിന്ന് വ്യത്യസ്തനായ ഒരാളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘വിദേശി’ വംശീയമോ ദേശീയമോ ആയ അർഥം അനാവശ്യമായി നൽകും; ‘അന്യൻ’ രൂപകത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: ഒരിക്കലും അനുഗമിക്കുകയില്ല
  rationale: οὐ μήയും ഭാവികാല ക്രിയയും ചേർന്നുള്ള ഊന്നിയ നിഷേധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀκολουθήσουσιν
  choice: അനുഗമിക്കുകയില്ല
  rationale: ആടുകൾ ഒരാളുടെ പിന്നാലെ പോകുന്നതും രൂപകത്തിലെ ബന്ധപരമായ അർഥവും ഒരുപോലെ ഉൾക്കൊള്ളുന്ന വ്യക്തമായ പ്രയോഗം.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: അയാളിൽനിന്ന് ഓടിപ്പോകും
  rationale: അന്യനിൽനിന്ന് അകന്നോടുന്ന ശക്തമായ പ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἴδασι
  choice: അറിയില്ല
  rationale: οἶδα അറിവിനെയോ തിരിച്ചറിവിനെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ ‘അറിയില്ല’ ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; സന്ദർഭസാധ്യമായ ‘തിരിച്ചറിയുന്നില്ല’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: φωνήν
  choice: ശബ്ദം
  rationale: ഇവിടെ തിരിച്ചറിയാവുന്ന വിളിയെയോ സ്വരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ശബ്ദം’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും രൂപകത്തിന് യോജിച്ചതുമാണ്.
- source_word: δὲ ... ἀλλὰ
  choice: എന്നാൽ ... പകരം
  rationale: ഒന്നിനെ നിഷേധിച്ച് അതിന്റെ വിരുദ്ധപ്രതികരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വൈരുധ്യഘടന വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ആട്–ഇടയൻ രൂപകത്തിലെ ‘അന്യൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: രൂപകം വിശദീകരിച്ച് വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘അന്യൻ’ എന്നത് വ്യാജോപദേഷ്ടാവോ നിയമവിരുദ്ധനായ നേതാവോ ആണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം രൂപകത്തിന്റെ ഉള്ളിൽ തന്നെയാണ് സംസാരിക്കുന്നത്; ഇവിടെ അതിന്റെ സൂചിതവ്യക്തിയെ നേരിട്ട് തിരിച്ചറിയിക്കുന്നില്ല. വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നത് ഗ്രീക്ക് പറയുന്നതിലധികം വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രൂപകത്തിന്റെ ലാളിത്യവും ഗ്രീക്കിലെ ഊന്നിയ നിഷേധവും സംരക്ഷിച്ചു; സഭാപാരമ്പര്യവിശേഷമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
