revisions:
- from: ആരും അത് എന്നിൽനിന്ന് എടുത്തുകളയുന്നില്ല; ഞാൻതന്നെ സ്വമേധയാ അത് അർപ്പിക്കുന്നു.[a] അത് അർപ്പിക്കാൻ എനിക്ക് അധികാരമുണ്ട്; വീണ്ടും അത് ഏറ്റെടുക്കാനും എനിക്ക് അധികാരമുണ്ട്.[b][c] ഈ കല്പന എനിക്ക് എന്റെ പിതാവിൽനിന്ന് ലഭിച്ചു.
  to: ആരും അത്[c] എന്നിൽനിന്ന് എടുത്തുകളയുന്നില്ല; മറിച്ച്, ഞാൻതന്നെ അത് സ്വമേധയാ വെച്ചുകൊടുക്കുന്നു.[a] അത് വെച്ചുകൊടുക്കാൻ എനിക്ക് അധികാരമുണ്ട്[b]; വീണ്ടും അതിനെ എടുക്കാനും എനിക്ക് അധികാരമുണ്ട്. ഈ കല്പന എനിക്ക് എന്റെ പിതാവിൽനിന്ന് ലഭിച്ചു.
  rationale: The revision replaces interpretively loaded or potentially misleading verbs with Malayalam expressions that more closely reproduce the Greek’s repeated ‘lay down’/‘take’ contrast. It also places the referential note on the pronoun it explains, while preserving the voluntary agency, authority, and Father-command relationship of the source text.
