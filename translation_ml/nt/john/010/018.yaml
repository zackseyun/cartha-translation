id: JHN.10.18
reference: John 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: ml
  text: ആരും അത്[c] എന്നിൽനിന്ന് എടുത്തുകളയുന്നില്ല; മറിച്ച്, ഞാൻതന്നെ അത് സ്വമേധയാ വെച്ചുകൊടുക്കുന്നു.[a] അത് വെച്ചുകൊടുക്കാൻ എനിക്ക് അധികാരമുണ്ട്[b]; വീണ്ടും അതിനെ എടുക്കാനും എനിക്ക് അധികാരമുണ്ട്. ഈ കല്പന എനിക്ക് എന്റെ പിതാവിൽനിന്ന് ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻതന്നെ സ്വമേധയാ’ എന്നതിന് ‘എന്റെ സ്വന്തം മുൻകൈയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. യേശു തന്റെ ജീവൻ സ്വമേധയാ നൽകുന്നു എന്നതാണ് ഊന്നൽ.
    reason: lexical_alternative
  - marker: b
    text: ‘അധികാരം’ എന്നതിന് ‘അവകാശം’ അല്ലെങ്കിൽ ‘ശക്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിൽ കഴിവും അവകാശസഹിതമായ അനുമതിയും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: c
    text: ‘അത്’ എന്നത് യേശുവിന്റെ ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; യോഹന്നാൻ 10:17 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει
  choice: എടുത്തുകളയുന്നില്ല
  rationale: ἀπ’ ἐμοῦ എന്ന ഘടനയോടൊപ്പം ഇവിടെ ജീവൻ യേശുവിൽനിന്ന് ബലമായി എടുത്തുകളയുന്നതിനെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള സ്വമേധയുള്ള അർപ്പണവുമായി വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: അത് അർപ്പിക്കുന്നു / അത് അർപ്പിക്കാൻ
  rationale: മലയാളത്തിൽ ജീവനെക്കുറിച്ച് ‘വെച്ചുകൊടുക്കുന്നു’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ ‘അർപ്പിക്കുന്നു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്; സ്വമേധയായുള്ള ജീവത്യാഗത്തിന്റെ ആശയം വ്യക്തമാക്കുമ്പോഴും ‘കൊല്ലപ്പെടുന്നു’ എന്ന് വിശദീകരിച്ചു ചേർക്കുന്നില്ല.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ഞാൻതന്നെ സ്വമേധയാ
  rationale: പ്രത്യാവർത്തകമായ ഊന്നലും സ്വന്തം സന്നദ്ധപ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പിതാവിൽനിന്നുള്ള കല്പനയെ നിഷേധിക്കുന്ന തരത്തിലുള്ള സ്വതന്ത്രത ഇതിൽ സൂചിപ്പിക്കപ്പെടുന്നില്ല.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: കേവലമായ കഴിവിനെക്കാൾ അവകാശസഹിതമായ അധികാരത്തെ സൂചിപ്പിക്കുന്നു; വാക്യാവസാനത്തിലെ പിതാവിന്റെ കല്പനയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: വീണ്ടും അത് ഏറ്റെടുക്കാൻ
  rationale: λαμβάνω എന്നതിന് ‘എടുക്കുക’ എന്നും ‘സ്വീകരിക്കുക’ എന്നും അർഥസാധ്യതയുണ്ട്. ‘ഏറ്റെടുക്കുക’ സജീവമായ പുനർഗ്രഹണത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ആ അർഥവ്യാപ്തി ഭാഗികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐντολήν
  choice: കല്പന
  rationale: ἐντολήയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ദൗത്യം’ എന്ന മൃദുവായ വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: παρὰ τοῦ πατρός μου
  choice: എന്റെ പിതാവിൽനിന്ന്
  rationale: παρά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉറവിടം സ്വാഭാവികമായി നൽകുകയും വ്യക്തിപരമായ പിതൃബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ മരണത്തിലും ജീവൻ വീണ്ടും ഏറ്റെടുക്കുന്നതിലും ἐξουσίαയുടെ അർഥം
  choice: അധികാരം
  alternative: ശക്തി; അവകാശം
  rationale: ഇത് കേവല ശേഷിയല്ല, അവകാശസഹിതമായ പ്രവർത്തനാധികാരമാണ്. ഇതിലൂടെ യേശുവിന്റെ സജീവമായ സ്വയംഅർപ്പണവും പിതാവിന്റെ കല്പനയോടുള്ള ബന്ധവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- issue: ἀπ’ ἐμαυτοῦ എന്നതിന്റെ പ്രാബല്യം
  choice: ഞാൻതന്നെ സ്വമേധയാ
  alternative: എന്നിൽനിന്നുതന്നെ; എന്റെ സ്വന്തം മുൻകൈയിൽ
  rationale: യേശുവിന്റെ ജീവത്യാഗം നിർബന്ധിതമല്ലെന്നത് വ്യക്തമാക്കുന്നു; അതേസമയം പിതാവിൽനിന്ന് ലഭിച്ച കല്പനയിൽനിന്നുള്ള സ്വാതന്ത്ര്യം എന്ന ആശയം ചേർക്കുന്നില്ല.
- issue: αὐτήν എന്ന സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: അത്
  alternative: എന്റെ ജീവൻ
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ ‘എന്റെ ജീവൻ’ എന്നതാണ് സൂചിതവിഷയം. സർവനാമം നിലനിർത്തുന്നത് ഗ്രീക്ക് വാക്യത്തിന്റെ ആവർത്തനവും ബന്ധവും സംരക്ഷിക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πάλιν λαβεῖν എന്നതിലെ സജീവതയും സ്വീകരണസാധ്യതയും
  choice: വീണ്ടും ഏറ്റെടുക്കുക
  alternative: വീണ്ടും എടുക്കുക; വീണ്ടും സ്വീകരിക്കുക
  rationale: ഗ്രീക്കിലെ ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന അർഥവ്യാപ്തി അനാവശ്യമായി ഒറ്റവശത്തേക്ക് തീർപ്പാക്കാതെ, യേശുവിന്റെ സജീവമായ പങ്ക് മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘ജീവൻ വെച്ചുകൊടുക്കുക’ എന്ന കൃത്രിമ അക്ഷരാനുവാദം ഒഴിവാക്കി ‘അർപ്പിക്കുക’ ഉപയോഗിച്ചു. ‘ഞാൻതന്നെ സ്വമേധയാ’ എന്ന രൂപം യേശുവിന്റെ സന്നദ്ധത ഊന്നുന്നു; പിതാവുമായുള്ള ബന്ധം വിച്ഛേദിക്കുന്നില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
