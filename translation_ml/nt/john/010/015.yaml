id: JHN.10.15
reference: John 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: ml
  text: പിതാവ് എന്നെ അറിയുകയും ഞാൻ പിതാവിനെ അറിയുകയും ചെയ്യുന്നതുപോലെ, ഞാൻ ആടുകൾക്കായി[a] എന്റെ ജീവൻ[b] അർപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആടുകൾക്കുവേണ്ടി.’ ഗ്രീക്ക് പ്രയോഗത്തിന് ഗുണഭോക്തൃപരമോ പ്രതിനിധാനപരമോ യാഗപരമോ ആയ അർഥശക്തി ഉണ്ടായേക്കാം.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ പ്രാണൻ.’ സ്വയംസമർപ്പണത്തിന്റെ ഈ സന്ദർഭത്തിൽ അർഥം ‘എന്റെ ജീവൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ചെയ്യുന്നതുപോലെ
  rationale: മുൻവാക്യത്തിലെ ഇടയനും ആടുകളും തമ്മിലുള്ള പരസ്പര അറിവിനെ പിതാവും പുത്രനും തമ്മിലുള്ള പരസ്പര അറിവിനോടു താരതമ്യം ചെയ്യുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γινώσκει / γινώσκω
  choice: അറിയുന്നു / അറിയുന്നു
  rationale: ബന്ധപരവും ആഴമുള്ളതുമായ അറിവിനെ സൂചിപ്പിക്കുമ്പോഴും ഗ്രീക്കിലെ ഒരേ ക്രിയയുടെ ആവർത്തനവും വാക്യത്തിന്റെ സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: പിതാവ് / പിതാവിനെ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘എന്റെ പിതാവ്’ എന്നു ചേർക്കാതെ യോഹന്നാന്റെ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κἀγὼ
  choice: ഞാൻ ... അറിയുകയും
  rationale: καί + ἐγώ എന്ന സംയുക്തത്തിന്റെ ഏകോപനവും പരസ്പരതയും മലയാളത്തിലെ ‘-ഉകയും ... -ഉകയും’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ψυχήν μου
  choice: എന്റെ ജീവൻ
  rationale: സ്വയം മരണത്തിന് ഏല്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ψυχή എന്നത് അമൂർത്തമായ ആത്മാവിനേക്കാൾ ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: τίθημι
  choice: അർപ്പിക്കുന്നു
  rationale: ψυχήν τίθημι എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ ഉദ്ദേശപൂർവമായ സ്വയംസമർപ്പണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ അറിയിക്കുന്നു; ‘വെക്കുന്നു’ എന്ന അക്ഷരാർഥം ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: ὑπὲρ
  choice: -ക്കുവേണ്ടി
  rationale: ആടുകളുടെ നന്മയ്ക്കായുള്ളതും പ്രതിനിധാനപരമോ യാഗപരമോ ആയേക്കാവുന്നതുമായ വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τῶν προβάτων
  choice: ആടുകൾ
  rationale: ഈ ഭാഗത്തിന്റെ കേന്ദ്രമായ ഇടയരൂപകം ‘ആട്ടിൻകൂട്ടം’ എന്നു പൊതുവാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വയംസമർപ്പണത്തിൽ ὑπὲρ എന്നതിന്റെ വ്യാപ്തി
  choice: ആടുകൾക്കുവേണ്ടി
  alternative: ആടുകളുടെ പ്രതിനിധിയായി; ആടുകൾക്കു പകരം
  rationale: ഗ്രീക്ക് പദം ഗുണഭോക്തൃപരവും പ്രതിനിധാനപരവും യാഗപരവുമായ ശക്തി വഹിക്കാം. ‘വേണ്ടി’ ഈ വ്യാപ്തി നിലനിർത്തുന്നു; ‘പകരം’ എന്നു മുഖ്യപാഠത്തിൽ നൽകിയാൽ പദത്തിന്റെ അർഥം ഒരൊറ്റ സിദ്ധാന്തപരമായ രൂപത്തിൽ അനാവശ്യമായി ചുരുങ്ങും.
- issue: ഈ സന്ദർഭത്തിലെ ψυχή എന്നതിന്റെ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ് / പ്രാണൻ
  rationale: നല്ല ഇടയൻ ആടുകൾക്കായി മരിക്കുന്ന സന്ദർഭത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് യേശു തന്റെ ജീവൻ സമർപ്പിക്കുന്നതാണ്; മനുഷ്യഘടനയെക്കുറിച്ചുള്ള വേറൊരു ആശയം ‘ആത്മാവ്’ അനാവശ്യമായി സൂചിപ്പിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പിതാവ്–പുത്രൻ പരസ്പര അറിവിന്റെ സമാന്തരതയും ഇടയൻ–ആടുകൾ രൂപകവും നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ ക്രമം പ്രധാനപാഠത്തിൽ പ്രത്യക്ഷപ്പെടുന്ന ക്രമത്തിന് അനുസരിച്ചാണ്.
