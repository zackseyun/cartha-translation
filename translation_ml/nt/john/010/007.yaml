id: JHN.10.7
reference: John 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു അവരോടു വീണ്ടും പറഞ്ഞു: “സത്യം, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: ഞാൻ ആടുകളുടെ വാതിലാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആടുകളുടെ കവാടം.” ഇടയപരിപാലനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഗ്രീക്ക് θύρα എന്ന പദത്തിന് “വാതിൽ” എന്നും “കവാടം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽ അവർ യേശുവിന്റെ വാക്ക് മനസ്സിലാക്കിയില്ലെന്നതിനോടുള്ള യുക്തിപരവും ആഖ്യാനപരവുമായ തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: യേശു തന്റെ വിശദീകരണം ആവർത്തിച്ചു തുടരുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യോഹന്നാനിലെ ഇരട്ട ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളവായനക്കാർക്ക് അർഥം സുതാര്യമാക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: പ്രഖ്യാപനത്തിന്റെ ഔപചാരികമായ ഭാവവും വർത്തമാനകാല സംസാരസൂത്രവും നിലനിർത്തുന്നു.
- source_word: ἐγώ εἰμι
  choice: ഞാൻ ... ആണ്
  rationale: ഊന്നലുള്ള സ്വയംതിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡ θύρα
  choice: വാതിൽ
  rationale: θύραയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ആട്ടിൻതൊഴുത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘കവാടം’ എന്നതും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τῶν προβάτων
  choice: ആടുകളുടെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘ആടുകൾക്കുള്ള’ എന്നു ലക്ഷ്യാർഥത്തിൽ മാറ്റുന്നതിനെക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: ‘ഞാൻ ആടുകളുടെ വാതിലാണ്’ എന്ന രൂപകാത്മക സ്വയംതിരിച്ചറിയൽ
  choice: ഞാൻ ആടുകളുടെ വാതിലാണ്
  alternative: ഞാൻ ആടുകൾക്കുള്ള കവാടമാണ്
  rationale: യേശുവിന്റെ രൂപകം സിദ്ധാന്തപരമായ വിശദീകരണമായി വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു. ഷഷ്ഠീവിഭക്തിയുടെ ബന്ധവും ‘വാതിൽ/കവാടം’ എന്ന പദാർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യോഹന്നാന്റെ ഗൗരവമുള്ള ഇരട്ടപ്രഖ്യാപനം നിലനിർത്തിയിരിക്കുന്നു; രൂപകത്തിന്റെ അർഥം വ്യാഖ്യാനിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
