  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: ml
  text: യേശു ഈ ആലങ്കാരിക പ്രസ്താവന അവരോടു പറഞ്ഞു[a]. എന്നാൽ, താൻ അവരോടു പറഞ്ഞ കാര്യങ്ങൾ എന്താണെന്ന് അവർ മനസ്സിലാക്കിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉപമ,” “ദൃഷ്ടാന്തം,” അല്ലെങ്കിൽ “പഴഞ്ചൊല്ല്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പൊതുവേ ഒരു സൂചനാത്മകമോ ആലങ്കാരികമോ ആയ പ്രസ്താവനയെ സൂചിപ്പിക്കാം; ഇവിടെ യേശു ഇടയനെക്കുറിച്ചു പറഞ്ഞത് അക്ഷരാർഥത്തിലല്ലാത്ത രൂപത്തിലാണെന്ന് ഇത് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: അലങ്കാരപ്രയോഗം
  rationale: ഇവിടെ ഈ പദം അക്ഷരാർഥത്തിലല്ലാത്ത, സൂചനാത്മകമായ ഒരു പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു. ‘ഉപമ’ എന്ന സാങ്കേതിക അർഥത്തിലേക്കോ ‘പഴഞ്ചൊല്ല്’ എന്ന പരിമിത അർഥത്തിലേക്കോ ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: λέγω എന്ന സാധാരണ ക്രിയയ്ക്ക് സ്വാഭാവികമായ മലയാളരൂപം; പ്രസ്താവന അവരോടു നടത്തിയതെന്ന അർഥം വ്യക്തമാണ്.
- source_word: ἐκεῖνοι δὲ
  choice: എന്നാൽ ... അവർ
  rationale: യേശുവിനും കേട്ടവർക്കുമിടയിലെ വൈരുധ്യം δέ സൂചിപ്പിക്കുന്നു; ἐκεῖνοι മലയാളത്തിൽ അനാവശ്യ കാഠിന്യമില്ലാതെ സർവനാമത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἔγνωσαν
  choice: മനസ്സിലാക്കിയില്ല
  rationale: സന്ദർഭത്തിൽ അറിയാതിരിക്കുക എന്നതിലുപരി യേശുവിന്റെ സൂചനാത്മക വാക്കുകളുടെ അർഥം ഗ്രഹിക്കാതിരുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: അവരോടു പറഞ്ഞതിന്റെ അർഥം എന്താണെന്ന്
  rationale: ഗ്രീക്കിലെ അല്പം അസാധാരണമായ ഘടന വാക്കിന് വാക്കായി പകർത്താതെ, അവർ ഗ്രഹിക്കാതിരുന്നത് പറഞ്ഞ കാര്യങ്ങളുടെ അർഥമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
