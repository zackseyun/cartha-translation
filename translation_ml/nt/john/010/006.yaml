  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അലങ്കാരപ്രയോഗം’ മൂലപദത്തിന്റെ വിശാലമായ സൂചനാത്മക അർഥം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സാധ്യമായ മറ്റ് പരിഭാഷകൾ രേഖപ്പെടുത്തുന്നു.
