  to: യേശു ഈ ആലങ്കാരിക പ്രസ്താവന അവരോടു പറഞ്ഞു[a]. എന്നാൽ, താൻ അവരോടു പറഞ്ഞ കാര്യങ്ങൾ എന്താണെന്ന് അവർ മനസ്സിലാക്കിയില്ല.
