source:
  edition: SBLGNT
  text: ὁ δὲ εἰσερχόμενος διὰ τῆς θύρας ποιμήν ἐστιν τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: ml
  text: എന്നാൽ വാതിലിലൂടെ പ്രവേശിക്കുന്നവൻ ആടുകളുടെ ഇടയനാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആടുകളുടെ ഒരു ഇടയനാണ്.” ഗ്രീക്കിൽ ‘ഇടയൻ’ എന്ന വിധേയനാമത്തിന് ആർട്ടിക്കിൾ ഇല്ല; എന്നാൽ അനധികൃതമായി കടക്കുന്നവരോടുള്ള വൈരുധ്യം കണക്കിലെടുക്കുമ്പോൾ ഇവിടെ നിയമാനുസൃത ഇടയനെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: എന്നാൽ ... പ്രവേശിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമരൂപമായി പ്രവർത്തിക്കുന്നു. മുൻവാക്യത്തിലെ കള്ളനും കവർച്ചക്കാരനും ആയുള്ള വൈരുധ്യം δέ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: διὰ τῆς θύρας
  choice: വാതിലിലൂടെ
  rationale: ഷഷ്ഠീവിഭക്തിയോടുകൂടിയ διά ഇവിടെ ഒരു വഴിയിലൂടെ അകത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘വാതിലിലൂടെ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ποιμήν
  choice: ഇടയനാണ്
  rationale: ποιμήν എന്നതിന് ‘ഇടയൻ’ എന്ന നേരിട്ടുള്ള അർഥം സ്വീകരിച്ചു. ഗ്രീക്കിൽ വിധേയനാമത്തിന് ആർട്ടിക്കിൾ ഇല്ലെങ്കിലും സന്ദർഭം ആടുകൾക്കുള്ള നിയമാനുസൃതവും തിരിച്ചറിയപ്പെടുന്നതുമായ ഇടയനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഈ രൂപം നിർവചനപരമായ വായനയ്ക്ക് യോജിക്കുന്നു.
- source_word: τῶν προβάτων
  choice: ആടുകളുടെ
  rationale: πρόβατα എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ആടുകൾ’ നിലനിർത്തി; ‘ആട്ടിൻകൂട്ടം’ എന്നു മാറ്റുന്നത് മൂലത്തിലെ ബഹുവചന നാമത്തെ വ്യാഖ്യാനാത്മകമായി മാറ്റും.
theological_decisions:
- issue: വിധേയസ്ഥാനത്തുള്ള ποιμήν എന്ന പദത്തിന്റെ നിർവചനസ്വഭാവം
  choice: ആടുകളുടെ ഇടയൻ
  alternative: ആടുകളുടെ ഒരു ഇടയൻ
  rationale: വിധേയനാമമായ ποιμήν-ന് ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ അനിർവചനപരമായ വായന വ്യാകരണപരമായി സാധ്യമാണ്. എന്നാൽ മുൻവാക്യത്തിലെ അനധികൃതമായി കടക്കുന്നവരോടുള്ള വൈരുധ്യം ഇവിടെ ആടുകൾക്കുള്ള നിയമാനുസൃത ഇടയനെ തിരിച്ചറിയിക്കുന്നതായി സന്ദർഭം സൂചിപ്പിക്കുന്നു. അതിനാൽ മുഖ്യപാഠത്തിൽ നിർവചനപരമായ അർഥം നൽകി, യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘വാതിലിലൂടെ’, ‘ആടുകളുടെ ഇടയൻ’ എന്നീ ലളിതമായ രൂപങ്ങൾ മൂലത്തിലെ ദൃശ്യരൂപം നിലനിർത്തുകയും സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുകയും ചെയ്യുന്നു.
