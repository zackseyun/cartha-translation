source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: ml
  text: ഞാൻ വാതിലാണ്[a]. എന്നിലൂടെ ആരെങ്കിലും പ്രവേശിച്ചാൽ രക്ഷിക്കപ്പെടും; അകത്തു ചെല്ലുകയും പുറത്തു വരുകയും മേച്ചിൽ കണ്ടെത്തുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കവാടം.” ഗ്രീക്ക് പദത്തിന് വാതിൽ എന്നോ കവാടം എന്നോ അർഥമാകാം; കൂടുതൽ നേരിട്ടുള്ള പദമായതിനാൽ മുഖ്യപാഠത്തിൽ “വാതിൽ” നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: വാതിൽ
  rationale: θύρα എന്ന പദത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള മലയാള തുല്യപദമാണ് “വാതിൽ.” ആട്ടിൻകൂട്ടത്തിന്റെ പശ്ചാത്തലത്തിൽ “കവാടം” എന്നും അർഥമാകാമെന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δι’ ἐμοῦ
  choice: എന്നിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മാർഗമോ മാധ്യമമോ സൂചിപ്പിക്കുന്നു. “എന്നിലൂടെ” എന്നത് യേശുവാണ് പ്രവേശനമാർഗം എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐάν τις εἰσέλθῃ
  choice: ആരെങ്കിലും പ്രവേശിച്ചാൽ
  rationale: ἐάν + സബ്ജങ്ക്റ്റീവ് ഒരു പൊതുവായ നിബന്ധനയാണ്; τις എന്ന അനിശ്ചിതവും എല്ലാവർക്കും തുറന്നതുമായ വ്യാപ്തി “ആരെങ്കിലും” നിലനിർത്തുന്നു.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: σῴζω എന്നതിന് രക്ഷിക്കുക, വിടുവിക്കുക എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും യോഹന്നാനിലെ വിശാലമായ രക്ഷാസംബന്ധിയായ ഭാവവും ഇടയരൂപകത്തിലെ സുരക്ഷാഭാവവും ഒരുമിച്ച് തുറന്നുവയ്ക്കാൻ “രക്ഷിക്കപ്പെടും” അനുയോജ്യമാണ്.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: അകത്തു ചെല്ലുകയും പുറത്തു വരുകയും ചെയ്യും
  rationale: മൂലപാഠത്തിലെ അകത്തേക്കും പുറത്തേക്കുമുള്ള സമാന്തര ചലനദൃശ്യം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νομὴν
  choice: മേച്ചിൽ
  rationale: νομή എന്നത് മേച്ചിലിനെയോ മേയുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കുന്നു. ആടുകളെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ “മേച്ചിൽ” ലളിതവും സ്വാഭാവികവും രൂപകത്തിന് യോജിച്ചതുമാണ്.
- source_word: εὑρήσει
  choice: കണ്ടെത്തും
  rationale: εὑρίσκω എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗമാണിത്.
theological_decisions:
- issue: ഇടയസന്ദർഭത്തിലെ θύρα എന്ന രൂപകത്തിന്റെ പരിഭാഷ
  choice: വാതിൽ
  alternative: കവാടം
  rationale: “വാതിൽ” ഗ്രീക്കിന്റെ നേരിട്ടുള്ള പദരൂപവും യോഹന്നാനിലെ “ഞാൻ ആകുന്നു” രൂപകവും നിലനിർത്തുന്നു. ഇടയസന്ദർഭം “കവാടം” എന്ന വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- issue: σωθήσεται എന്നതിന്റെ വ്യാപ്തി
  choice: രക്ഷിക്കപ്പെടും
  alternative: വിടുവിക്കപ്പെടും
  rationale: ഇത് കേവലം ശാരീരിക സുരക്ഷയായി ചുരുക്കുകയോ വ്യവസ്ഥിത ദൈവശാസ്ത്രത്തിലെ കൂടുതൽ സങ്കുചിതമായ നിർവചനമായി വികസിപ്പിക്കുകയോ ചെയ്യാതെ, രക്ഷയുടെയും ഇടയപരിപാലനത്തിലെ സുരക്ഷയുടെയും ഭാവങ്ങൾ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. “ആരെങ്കിലും” എന്നതിനു ശേഷം ലിംഗസൂചക സർവനാമം ചേർക്കാതെ, ഗ്രീക്കിലെ അനിശ്ചിത ഏകവചനത്തിന്റെ പൊതുവ്യാപ്തി സ്വാഭാവികമായ മലയാളവാക്യഘടനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
