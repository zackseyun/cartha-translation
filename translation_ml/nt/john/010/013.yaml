id: JHN.10.13
reference: John 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ml
  text: കാരണം, അവൻ കൂലിക്കാരനാണ്; ആടുകളെക്കുറിച്ച് അവന് കരുതലില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന കൂലിക്കാരന്റെ ഓട്ടത്തിന് ഈ വാക്യം കാരണം നൽകുന്നു; അതിനാൽ കാരണാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μισθωτός
  choice: കൂലിക്കാരൻ
  rationale: സ്വന്തം ആടുകളോടുള്ള ഉടമസ്ഥ ഉത്തരവാദിത്വത്താൽ അല്ല, കൂലിക്കായി ജോലി ചെയ്യുന്ന ആളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ഇടയസന്ദർഭത്തിലും ആധുനിക മലയാളത്തിലും ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: അവന് ... കരുതലില്ല
  rationale: ദത്തിവോടും περί-യോടും കൂടിയ μέλει എന്ന പ്രയോഗം ഒരാളോടോ കാര്യത്തോടോ ഉള്ള താത്പര്യവും കരുതലും സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ അതിന്റെ നൈതിക ശക്തി നിലനിർത്തുന്നു.
- source_word: τῶν προβάτων
  choice: ആടുകളെക്കുറിച്ച്
  rationale: ഗ്രീക്കിലെ ആടുകൾ എന്ന നാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തി, പ്രഭാഷണത്തിലെ ഇടയചിത്രണം നിലനിർത്തുന്നു; ‘ആട്ടിൻകൂട്ടം’ എന്നു വ്യാഖ്യാനപരമായി വിപുലീകരിക്കുന്നില്ല.
theological_decisions:
- issue: നല്ല ഇടയനോടുള്ള താരതമ്യത്തിൽ കൂലിക്കാരന്റെ സ്വഭാവീകരണം
  choice: വാക്യം പറയുന്ന നൈതിക വൈരുധ്യം നേരിട്ട് അവതരിപ്പിച്ചു; കൂലിക്കാരൻ ആരെ പ്രതിനിധീകരിക്കുന്നു എന്ന് പ്രത്യേകം നിർണ്ണയിച്ചില്ല.
  alternative: കൂലിക്കാരനെ വ്യാജനേതാക്കളുടെ ഒരു പ്രത്യേക വിഭാഗമായി തിരിച്ചറിയുക, അല്ലെങ്കിൽ അവന്റെ നിലപാടിനെ വെറും തൊഴിൽപരമായ അകൽച്ചയായി മൃദൂകരിക്കുക.
  rationale: അവൻ കൂലിക്കാരനായതിനാലും ആടുകളോട് കരുതലില്ലാത്തതിനാലുമാണ് ഓടിപ്പോകുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. പാഠം പറയാത്ത പ്രത്യേക ഉപദേശപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൂലിക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘കരുതലില്ല’ എന്നത് μέλει എന്നതിലെ താത്പര്യവും ഉത്തരവാദിത്വബോധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
