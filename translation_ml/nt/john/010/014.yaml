id: JHN.10.14
reference: John 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: ml
  text: ഞാൻ നല്ല ഇടയനാണ്; എനിക്കുള്ളവരെ ഞാൻ അറിയുന്നു, എനിക്കുള്ളവർ എന്നെയും അറിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ആടുകളെ ഞാൻ അറിയുന്നു, എന്റെ ആടുകൾ എന്നെയും അറിയുന്നു.’ രണ്ടു വാക്യഭാഗങ്ങളിലും ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘എനിക്കുള്ളവർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμήν
  choice: ഇടയൻ
  rationale: സന്ദർഭത്തിലെ ആടുകളെ മേയ്ക്കുന്നവന്റെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു; ‘പാസ്റ്റർ’ പോലുള്ള പിൽക്കാല സഭാപദവി ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: καλός
  choice: നല്ല
  rationale: ധാർമിക മികവും ഉചിതമായ ശ്രേഷ്ഠതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
- source_word: γινώσκω / γινώσκουσί
  choice: അറിയുന്നു
  rationale: വെറും തിരിച്ചറിയലിനേക്കാൾ വ്യക്തിപരവും പരസ്പരബന്ധപരവുമായ അറിവിനെ സൂചിപ്പിക്കുകയും ഇരു വാക്യഭാഗങ്ങളിലെയും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: എനിക്കുള്ളവർ
  rationale: നപുംസക ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ യേശുവിനുള്ളവരായ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. ‘എന്റെ ആടുകൾ’ എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ ഉടമസ്ഥതയും ബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐγώ εἰμι
  choice: ഞാൻ ... ആണ്
  rationale: ഊന്നിപ്പറഞ്ഞ സ്വയംപരിചയപ്പെടുത്തലും വർത്തമാനകാല അർഥവും നിലനിർത്തുന്നു.
- source_word: καί
  choice: ; / ,
  rationale: ഗ്രീക്കിലെ ലളിതമായ സംയോജനം മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി വിരാമചിഹ്നങ്ങളിലൂടെ ബന്ധിപ്പിച്ചു; ആശയപരമായ കൂട്ടിച്ചേർക്കൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: യേശുവും അവനുള്ളവരും തമ്മിലുള്ള പരസ്പര അറിവ്, പിൽക്കാല സിദ്ധാന്തഭാഷ ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: എനിക്കുള്ളവർ
  alternative: എന്റെ ആടുകൾ
  rationale: മൂലത്തിലെ τὰ ἐμά എന്ന സംക്ഷിപ്ത ഉടമസ്ഥപ്രയോഗം സംരക്ഷിക്കുകയും വ്യക്തിപരമായ ബന്ധവും ഉൾപ്പെടലും വ്യക്തമാക്കുകയും ചെയ്യുന്നു; സന്ദർഭസൂചിതമായ ‘ആടുകൾ’ എന്നത് അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നല്ല ഇടയൻ’ എന്ന പരിചിതമായ ബൈബിൾരൂപകം നിലനിർത്തി; പരസ്പരമായ ‘അറിയുക’ എന്ന ആവർത്തനവും ഉടമസ്ഥബന്ധവും വ്യക്തമായി സൂക്ഷിച്ചു.
