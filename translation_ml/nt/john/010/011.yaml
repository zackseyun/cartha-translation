    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: ഞാനാണ്
  rationale: വ്യക്തമായ കർത്തൃസർവനാമം നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഞാനാണ്’ എന്ന രൂപം വ്യക്തമാക്കുന്നു; ദൈവനാമത്തോടുള്ള സൂചന നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ποιμὴν
  choice: ഇടയൻ
  rationale: ആടുകളെ മേയ്ക്കുന്നവൻ എന്ന നേരിട്ടുള്ള ദൃശ്യാർഥം നൽകുന്നു; പിൽക്കാല സഭാപദവിയുടെ ആശയം ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
- source_word: καλός
  choice: നല്ല
  rationale: ധാർമിക നന്മ, ശ്രേഷ്ഠത, മാതൃകാപരത എന്നീ സാധ്യതകളെ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗം.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: തന്റെ ജീവൻ അർപ്പിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘തന്റെ പ്രാണനെ വെക്കുന്നു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിലെ ഗ്രീക്ക് പ്രയോഗം ജീവൻ സ്വമേധയാ നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ജീവൻ അർപ്പിക്കുന്നു’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ത്യാഗാർഥം പകരുന്നു.
- source_word: ὑπὲρ τῶν προβάτων
  choice: ആടുകൾക്കുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ പ്രയോജനാർഥവും പ്രതിനിധിത്വസാധ്യതയും അനാവശ്യമായി ചുരുക്കാതെ പകരുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Ἐγώ εἰμι എന്ന സ്വയംപരിചയപ്പെടുത്തലിന്റെ ശക്തി
  choice: ‘ഞാനാണ്’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ദൈവനാമത്തോടുള്ള സൂചന വ്യക്തമാക്കുന്ന വികസിത പരിഭാഷ; അല്ലെങ്കിൽ ഊന്നൽ കുറഞ്ഞ ‘ഞാൻ ... ആകുന്നു’
  rationale: ഇവിടെ വ്യാകരണപരമായി ഇത് വിധേയപദത്തോടുകൂടിയ സ്വയംപരിചയപ്പെടുത്തലാണ്. യോഹന്നാനിലെ വിശാലമായ ദൈവശാസ്ത്രപ്രതിധ്വനികൾ സാധ്യമെങ്കിലും അവയെ പരിഭാഷയിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- issue: καλός എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘നല്ല ഇടയൻ’
  alternative: ‘ശ്രേഷ്ഠനായ ഇടയൻ’ അല്ലെങ്കിൽ ‘മാതൃകയായ ഇടയൻ’
  rationale: ‘നല്ല’ എന്നത് പരിചിതവും കൃത്യവുമാണ്; പദത്തിലുള്ള ശ്രേഷ്ഠതയുടെയും മാതൃകാപരതയുടെയും ഭാവം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ὑπὲρ τῶν προβάτων എന്നതും യേശുവിന്റെ മരണവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ആടുകൾക്കുവേണ്ടി’
  alternative: ‘ആടുകളുടെ പക്ഷമായി’ അല്ലെങ്കിൽ ‘ആടുകളുടെ നന്മയ്ക്കായി’
  rationale: പ്രയോജനാർഥവും പ്രതിനിധിത്വാർഥവും തുറന്നുവെക്കുന്നു; വാക്യം വ്യക്തമായി നിർണ്ണയിക്കാത്ത ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇടയൻ’ എന്ന പരിചിത ബൈബിൾദൃശ്യപദം നിലനിർത്തി. ‘ജീവൻ അർപ്പിക്കുന്നു’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമായി പകരുന്നു; ഉടമസ്ഥതയോ പ്രത്യേക പ്രായശ്ചിത്തവ്യാഖ്യാനമോ അധികമായി ചേർത്തിട്ടില്ല.
