source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: ml
  text: എനിക്കുമുമ്പ് വന്നവരെല്ലാം കള്ളന്മാരും കൊള്ളക്കാരുമാണ്[a]; എന്നാൽ ആടുകൾ അവരുടെ വാക്കു കേട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എനിക്കു മുന്നേ.’ ഈ പ്രയോഗം കാലപരമായി ‘എനിക്കുമുമ്പ്’ എന്നോ, യേശുവിൽനിന്ന് വേറിട്ട് അധികാരം അവകാശപ്പെട്ട് മുന്നേ വന്നവർ എന്ന അർഥത്തിലോ മനസ്സിലാക്കാം. സന്ദർഭം സൂചിപ്പിക്കുന്നത് മുമ്പുണ്ടായിരുന്ന ദൈവദാസന്മാരെ എല്ലാവരെയും അല്ല, വ്യാജ ഇടയന്മാരെയാണ്. ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ ‘എനിക്കുമുമ്പ്’ എന്ന വാക്കുകൾ ഇല്ല.
    reason: alternative_reading; textual_variant
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: വന്നവരെല്ലാം
  rationale: ഗ്രീക്കിലെ സമഗ്രവും വിതരണാത്മകവുമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἦλθον
  choice: വന്ന
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ ലളിതമായ ഭൂതകാലസൂചന നിലനിർത്തുന്നു.
- source_word: πρὸ ἐμοῦ
  choice: എനിക്കുമുമ്പ്
  rationale: കാലപരമായ ‘എനിക്കുമുമ്പ്’ എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; ‘എനിക്കു മുന്നേ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κλέπται
  choice: കള്ളന്മാർ
  rationale: രഹസ്യമായോ അനധികൃതമായോ അപഹരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: λῃσταί
  choice: കൊള്ളക്കാർ
  rationale: κλέπται എന്നതിൽനിന്ന് വ്യത്യസ്തമായി കൂടുതൽ ബലപ്രയോഗപരമോ ആക്രമണാത്മകമോ ആയ കവർച്ചക്കാരെ സൂചിപ്പിക്കുന്ന പരിചിതമായ പദം.
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: വാക്യത്തിലെ വ്യക്തമായ വിരുദ്ധബന്ധം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: അവരുടെ വാക്കു കേട്ടില്ല
  rationale: കേവലം ശബ്ദം കേൾക്കാതിരുന്നതല്ല, അവരുടെ വിളിക്ക് ചെവികൊടുക്കുകയോ അനുസരിക്കുകയോ ചെയ്തില്ല എന്ന ഇടയൻ–ആട് സന്ദർഭത്തിലെ പ്രതികരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: τὰ πρόβατα
  choice: ആടുകൾ
  rationale: യോഹന്നാൻ 10-ലെ ഇടയരൂപകത്തിന് യോജിക്കുന്ന നേരിട്ടുള്ള സാധാരണ മലയാളം.
theological_decisions:
- issue: ‘എനിക്കുമുമ്പ് വന്നവരെല്ലാം’ എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ഗ്രീക്കിന്റെ വിശാലമായ രൂപം ചുരുക്കാതെ ‘എനിക്കുമുമ്പ് വന്നവരെല്ലാം’ എന്നു നിലനിർത്തി.
  alternative: ‘എനിക്കു മുന്നേ വന്നവരെല്ലാം’; അല്ലെങ്കിൽ യേശുവിൽനിന്ന് വേറിട്ട് അധികാരം അവകാശപ്പെട്ട വ്യാജ ഇടയന്മാർ എന്ന് പാഠത്തിൽത്തന്നെ വ്യക്തമാക്കൽ.
  rationale: വാക്യരൂപം വിശാലമാണെങ്കിലും, സന്ദർഭം മുമ്പുണ്ടായിരുന്ന ദൈവദൂതന്മാരെ മുഴുവനും കുറ്റപ്പെടുത്തുന്നതിനെക്കാൾ വ്യാജ ഇടയന്മാരിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ഈ വ്യാഖ്യാനപരമായ നിയന്ത്രണം പ്രധാനപാഠത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നത് യഥാർഥമായ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, അതേസമയം മാന്യമായ ശൈലി. κλέπται/λῃσταί വ്യത്യാസം ‘കള്ളന്മാർ/കൊള്ളക്കാർ’ എന്ന പദജോടിയിലൂടെ നിലനിർത്തി; ഗ്രീക്കിലെ വ്യാപ്തിയും സന്ദർഭജന്യമായ അവ്യക്തതയും പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
