  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: ml
  text: അക്കാലത്ത് യെരൂശലേമിൽ പ്രതിഷ്ഠോത്സവം[a] നടന്നു. ശീതകാലമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഹനുക്കാ’; ദേവാലയത്തിന്റെ പുനഃപ്രതിഷ്ഠയെ അനുസ്മരിക്കുന്ന യഹൂദോത്സവം.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: നടന്നു
  rationale: ഇവിടെ γίνομαι ഒരു സംഭവം നടന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നടന്നു’ സ്വാഭാവികവും സംഭവാർഥം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: τότε
  choice: അക്കാലത്ത്
  rationale: τότε നൽകുന്ന കാലസൂചനയെ സ്വാഭാവികമായ ആഖ്യാനഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ ἐγκαίνια
  choice: പ്രതിഷ്ഠോത്സവം
  rationale: ദേവാലയത്തിന്റെ പുനഃപ്രതിഷ്ഠ അനുസ്മരിക്കുന്ന ഉത്സവമാണ് ഉദ്ദേശിക്കുന്നത്; ‘പ്രതിഷ്ഠോത്സവം’ ഗ്രീക്ക് പദത്തിന്റെ അർഥം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക മലയാളരൂപം.
- source_word: χειμὼν ἦν
  choice: അപ്പോൾ ശീതകാലമായിരുന്നു
  rationale: ലളിതമായ വിവരണവാക്യത്തിന്റെ അർഥം നിലനിർത്തുന്നു; ‘അപ്പോൾ’ ചേർക്കുന്നത് മലയാളത്തിലെ വാക്യബന്ധം സ്വാഭാവികമാക്കുന്നു.
theological_decisions:
- issue: τὰ ἐγκαίνια എന്ന ഉത്സവത്തിന്റെ തിരിച്ചറിയൽ
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രതിഷ്ഠോത്സവം’
  alternative: ‘ഹനുക്കാ’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി, വായനക്കാർക്ക് പരിചിതമായ പൊതുനാമവും ചരിത്രസന്ദർഭവും അടിക്കുറിപ്പിൽ നൽകുന്നു; ഇതിലൂടെ മൂലഭാഷാപ്രാമുഖ്യവും സാംസ്കാരിക വ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പ്രതിഷ്ഠോത്സവം’ സാധാരണ വായനക്കാർക്ക് അർഥം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ തിരഞ്ഞെടുത്തു; സാംസ്കാരിക നാമം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
