id: JHN.10.26
reference: John 10:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾ വിശ്വസിക്കുന്നില്ല[a], കാരണം നിങ്ങൾ എന്റെ ആടുകളിൽപ്പെട്ടവരല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എന്നാൽ, നിങ്ങൾ എന്റെ ആടുകളിൽപ്പെട്ടവരല്ല എന്ന് വിശ്വസിക്കുന്നില്ല.” ഗ്രീക്കിലെ ബന്ധകപദം കാരണം സൂചിപ്പിക്കുന്നതിനുപകരം വിശ്വാസത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായും വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിൽ സർവനാമം വ്യക്തമായി വന്നതിനാൽ അത് നിലനിർത്തുന്നു; അധിക ഊന്നൽ ചേർക്കുന്ന ‘നിങ്ങൾ തന്നെയോ’ എന്ന രൂപം ആവശ്യമില്ല.
- source_word: οὐ πιστεύετε
  choice: വിശ്വസിക്കുന്നില്ല
  rationale: നിഷേധത്തോടുകൂടിയ വർത്തമാനകാല ക്രിയയെ സ്വാഭാവിക മലയാള വർത്തമാനകാലത്തിൽ നൽകുന്നു; യോഹന്നാനിലെ പ്രയോഗത്തിന് ‘വിശ്വസിക്കുക’ അനുയോജ്യമാണ്.
- source_word: ὅτι
  choice: കാരണം
  rationale: സന്ദർഭത്തിൽ കാരണാർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്. എങ്കിലും ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ‘എന്ന്’ എന്ന വായന സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὐκ ἐστὲ ἐκ τῶν προβάτων
  choice: നിങ്ങൾ ... ആടുകളുടെ കൂട്ടത്തിൽപ്പെട്ടവരല്ല
  rationale: ἐκ ഇവിടെ ഒരു കൂട്ടത്തിലെ അംഗത്വമോ അതിനോടുള്ള ഉൾപ്പെടലോ സൂചിപ്പിക്കുന്നു; ‘കൂട്ടത്തിൽപ്പെട്ടവർ’ എന്നത് മലയാളത്തിൽ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τῶν ἐμῶν
  choice: എന്റെ
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപത്തെ സ്വാഭാവികമായി നാമത്തിന് മുമ്പിലുള്ള ‘എന്റെ’ എന്ന വിശേഷണമായി നൽകുന്നു.
theological_decisions:
- issue: അവിശ്വാസവും യേശുവിന്റെ ആടുകളിൽ ഉൾപ്പെടുന്നതും തമ്മിലുള്ള ബന്ധത്തിൽ ὅτι എന്നതിന്റെ അർഥം
  choice: 'കാരണാർഥം: ‘കാരണം നിങ്ങൾ എന്റെ ആടുകളുടെ കൂട്ടത്തിൽപ്പെട്ടവരല്ല’'
  alternative: 'ഉള്ളടക്കാർഥം: ‘നിങ്ങൾ എന്റെ ആടുകളുടെ കൂട്ടത്തിൽപ്പെട്ടവരല്ല എന്ന് നിങ്ങൾ വിശ്വസിക്കുന്നില്ല’'
  rationale: തന്റെ ശബ്ദം കേട്ട് തന്നെ അനുഗമിക്കുന്ന ആടുകളെയും വിശ്വസിക്കാത്ത എതിരാളികളെയും വേർതിരിക്കുന്ന സമീപസന്ദർഭത്തിന് കാരണാർഥം കൂടുതൽ യോജിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് ഘടന ഉള്ളടക്കാർഥവും അനുവദിക്കുന്നതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം ഏകപക്ഷീയമായി പരിഹരിക്കാതെ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യതയുള്ള മലയാളം. ‘ആടുകളുടെ കൂട്ടത്തിൽപ്പെട്ടവർ’ എന്ന പ്രയോഗം അംഗത്വത്തിന്റെ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് യഥാർഥ ഗ്രീക്ക് ദ്വയാർഥം സംരക്ഷിക്കുന്നു.
