    rationale: 'The Greek presents a closely connected statement. Malayalam is smoother and clearer with commas: ‘എന്നാൽ, നിങ്ങൾ വിശ്വസിക്കുന്നില്ല, കാരണം ...’'
  - severity: low
    issue: ‘എന്റെ ആടുകളുടെ കൂട്ടത്തിൽപ്പെട്ടവരല്ല’ is slightly heavy and repetitive.
    rationale: ‘എന്റെ ആടുകളിൽപ്പെട്ടവരല്ല’ naturally expresses belonging among/of Jesus’ sheep and is closer in form to the Greek phrase.
