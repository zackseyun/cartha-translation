id: JHN.10.34
reference: John 10:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “നിങ്ങളുടെ ന്യായപ്രമാണത്തിൽ, ‘ഞാൻ പറഞ്ഞു: നിങ്ങൾ ദൈവങ്ങളാണ്[a]’ എന്നു എഴുതിയിട്ടില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവിക സത്തകൾ.’ യേശു ഇവിടെ സങ്കീർത്തനം 82:6 ഉദ്ധരിക്കുന്നു. അവിടെയുള്ള ഈ പദം ആരെ സൂചിപ്പിക്കുന്നു എന്നത് വ്യാഖ്യാനത്തിൽ തർക്കവിഷയമാണ്; ഉദ്ധരണിയുടെ നേരിട്ടുള്ള പദപ്രയോഗമാണ് മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: അവരോടു മറുപടി പറഞ്ഞു
  rationale: യോഹന്നാനിലെ സംഭാഷണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗം; ദാതൃവിഭക്തിയായ αὐτοῖς-നെ ‘അവരോടു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: എഴുതിയിട്ടില്ലേ?
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുമ്പോൾ ഉപയോഗിക്കുന്ന ഗ്രീക്ക് പൂർണകാല നിഷ്ക്രിയപ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും നിഷേധപ്രശ്നത്തിന്റെ പ്രതീക്ഷയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: നിങ്ങളുടെ ന്യായപ്രമാണത്തിൽ
  rationale: ഇവിടെ νόμος സങ്കീർത്തനം 82:6 ഉൾപ്പെടുന്ന തിരുവെഴുത്തുകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ തിരിച്ചറിയാവുന്ന പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Ἐγὼ εἶπα
  choice: ഞാൻ പറഞ്ഞു
  rationale: വ്യക്തമായ Ἐγώ എന്ന സർവനാമം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: Θεοί
  choice: ദേവന്മാർ
  rationale: സങ്കീർത്തനം 82:6-ലെ ഉദ്ധരണിയുടെ നേരിട്ടുള്ള ബഹുവചനപദം നിലനിർത്തുകയും വ്യാഖ്യാനപരമായി അതിനെ മൃദൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐστε
  choice: ആണ്
  rationale: ഗ്രീക്കിലെ ബന്ധകക്രിയ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘വിളിക്കപ്പെടുന്നു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സങ്കീർത്തനം 82:6 ഉദ്ധരിക്കുമ്പോഴുള്ള θεοί എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദേവന്മാർ
  alternative: ദൈവിക സത്തകൾ
  rationale: ‘ദേവന്മാർ’ എന്ന നേരിട്ടുള്ള വിവർത്തനം യേശുവിന്റെ വാദത്തിന്റെ ഭാഷയും അതിലുള്ള വ്യാഖ്യാനപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു. ആരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത് എന്ന തർക്കവിഷയം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. ഉദ്ധരണിയിലെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
