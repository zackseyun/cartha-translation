id: JHN.10.17
reference: John 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ പിതാവ് എന്നെ സ്നേഹിക്കുന്നു; കാരണം, ഞാൻ എന്റെ ജീവൻ അത് വീണ്ടും ഏറ്റെടുക്കുന്നതിനായി അർപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താലാണ്
  rationale: മുൻപും പിന്നാലെയും വരുന്ന ആശയങ്ങളോടുള്ള കാരണബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: പിതാവ് എന്നെ സ്നേഹിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടമായ ‘പിതാവ്’ എന്ന കർത്താവിനെയും ‘എന്നെ’ എന്ന കർമത്തെയും കൈവശസൂചകം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: അർപ്പിക്കുന്നതിനാലാണ് എന്ന കാരണാർഥം
  rationale: ഇവിടെ ὅτι പിതാവിന്റെ സ്നേഹത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നു; മലയാള വാക്യഘടനയിൽ ‘-തിനാലാണ്’ എന്ന രൂപവും തുടർന്നുള്ള വിശദീകരണത്തിന് ദ്വിബിന്ദുവും ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τίθημι
  choice: അർപ്പിക്കുന്നു
  rationale: ψυχήയോടൊപ്പം ഇത് സ്വന്തം ജീവൻ സ്വമേധയാ മരണത്തിന് ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘വെക്കുന്നു’ എന്നതിനെക്കാൾ ‘അർപ്പിക്കുന്നു’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: τὴν ψυχήν μου
  choice: എന്റെ ജീവൻ
  rationale: ഈ സന്ദർഭത്തിൽ ψυχή ശരീരം–ആത്മാവ് വേർതിരിവിനെക്കാൾ മരണത്തിൽ വിട്ടുകൊടുക്കുകയും വീണ്ടും ഏറ്റെടുക്കുകയും ചെയ്യുന്ന ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: എടുത്തെടുക്കാനായി
  rationale: ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഫലമെന്നോ വെറും ഭാവികാലമെന്നോ മാത്രം നിർണയിക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ജീവൻ അർപ്പിച്ചതിനുശേഷം അതിനെ പുനരേറ്റെടുക്കുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: λάβω αὐτήν
  choice: അത് ഏറ്റെടുക്കുക
  rationale: ജീവൻ വീണ്ടും കൈക്കൊള്ളുക എന്ന സന്ദർഭാർഥം നൽകുന്നു. ‘സ്വീകരിക്കുക’ എന്ന സാധ്യതയേക്കാൾ യോഹന്നാൻ 10:17–18-ലെ പ്രവർത്തനശേഷിയുമായി ‘ഏറ്റെടുക്കുക’ നന്നായി യോജിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ സ്വമേധയുള്ള മരണത്തിന്റെ സന്ദർഭത്തിൽ ψυχήയുടെ അർഥം
  choice: ‘ജീവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആത്മാവ്’
  rationale: വാക്യം യേശു തന്റെ ജീവൻ മരണത്തിൽ അർപ്പിക്കുകയും വീണ്ടും ഏറ്റെടുക്കുകയും ചെയ്യുന്നതിനെക്കുറിച്ചാണ്. ‘ആത്മാവ്’ എന്നു നൽകിയാൽ സന്ദർഭം മുൻനിർത്താത്ത ശരീരം–ആത്മാവ് വേർതിരിവ് വായനയിലേക്ക് വന്നേക്കാം.
- issue: ἵνα λάβω എന്നതിലെ ഉദ്ദേശ്യം/ഫലം സംബന്ധിച്ച സൂക്ഷ്മത
  choice: ‘വീണ്ടും ഏറ്റെടുക്കാനായി’
  alternative: ‘വീണ്ടും ഏറ്റെടുക്കുംവിധം’ അല്ലെങ്കിൽ ‘വീണ്ടും ഏറ്റെടുക്കുമെന്ന്’
  rationale: ἵναയുടെ ഉദ്ദേശ്യബലം നിലനിർത്തുന്നു; അതിനെ വെറും ഭാവിപ്രവചനമായോ ഫലമായോ ചുരുക്കുന്നില്ല.
- issue: പിതാവിന്റെ സ്നേഹവും യേശുവിന്റെ ജീവാർപ്പണവും തമ്മിലുള്ള കാരണബന്ധം
  choice: διὰ τοῦτο…ὅτι എന്ന ഇരട്ട കാരണഘടന നിലനിർത്തി
  alternative: രണ്ടാം ഉപവാക്യം വെറും വിശദീകരണമോ ഉള്ളടക്കമോ ആയി നൽകുക
  rationale: മൂലവാക്യം പിതാവിന്റെ സ്നേഹത്തിനുള്ള കാരണം യേശുവിന്റെ സ്വമേധയുള്ള ജീവാർപ്പണവുമായി ബന്ധിപ്പിക്കുന്നു; ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്താതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘ജീവൻ വെക്കുന്നു’ എന്ന അസ്വാഭാവിക അക്ഷരപരിഭാഷ ഒഴിവാക്കി സ്വമേധയുള്ള ജീവത്യാഗം പ്രകടമാക്കുന്ന ‘അർപ്പിക്കുന്നു’ തെരഞ്ഞെടുത്തു.
