id: JHN.10.16
reference: John 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: ml
  text: ഈ ആട്ടിൻതൊഴുത്തിൽപ്പെടാത്ത മറ്റു ആടുകളും എനിക്കുണ്ട്. അവയെയും ഞാൻ കൊണ്ടുവരണം; അവ എന്റെ ശബ്ദം കേൾക്കും.[a] അങ്ങനെ ഒരൊറ്റ ആട്ടിൻകൂട്ടവും[b] ഒരൊറ്റ ഇടയനും ഉണ്ടാകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവ എന്റെ ശബ്ദത്തിനു ചെവികൊടുക്കും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദത്തിന് ‘കേൾക്കുക’ എന്നും ‘ശ്രദ്ധിച്ചു കേൾക്കുക’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ പ്രതികരിക്കുന്ന കേൾവി ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ആട്ടിൻതൊഴുത്ത്’ (αὐλή)—ആടുകളെ പാർപ്പിക്കുന്ന സ്ഥലം—എന്നതിനും ‘ആട്ടിൻകൂട്ടം’ (ποίμνη)—ആടുകളുടെ സമൂഹം—എന്നതിനും വ്യത്യസ്ത പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ അവസാനവാക്യം ‘ഒരൊറ്റ തൊഴുത്ത്’ എന്നല്ല, ‘ഒരൊറ്റ ആട്ടിൻകൂട്ടം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: വേറെ ആടുകൾ
  rationale: πρόβατα സാധാരണയായി ‘ആടുകൾ’ എന്നാണ്; കുഞ്ഞാടുകൾ എന്ന പ്രത്യേക അർഥമില്ല. ἄλλα ഇപ്പോൾ പരാമർശത്തിലുള്ളവയ്ക്കു പുറമേയുള്ളവയെ സൂചിപ്പിക്കുന്നു.
- source_word: αὐλή
  choice: ആട്ടിൻതൊഴുത്ത്
  rationale: ഇടയസന്ദർഭത്തിൽ αὐλή ആടുകളെ പാർപ്പിക്കുന്ന വളഞ്ഞ ഇടത്തെയോ തൊഴുത്തിനെയോ സൂചിപ്പിക്കുന്നു. ‘ആട്ടിൻതൊഴുത്ത്’ രൂപകത്തെ വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: κἀκεῖνα
  choice: അവയെയും
  rationale: നപുംസക ബഹുവചനമായ ‘ആടുകൾ’ എന്നതിലേക്കാണ് സർവനാമം മടങ്ങുന്നത്; καί ഉൾക്കൊള്ളുന്ന ‘കൂടി/യും’ എന്ന അർഥം ‘അവയെയും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δεῖ με ἀγαγεῖν
  choice: ഞാൻ കൊണ്ടുവരണം
  rationale: δεῖ ആവശ്യകതയുടെ ശക്തി വഹിക്കുന്നു; ‘വരണം’ എന്നല്ല, ‘കൊണ്ടുവരണം’ എന്ന് പറയുന്നത് ἀγαγεῖν എന്നതിന്റെ അർഥവും ഇടയരൂപകവും നിലനിർത്തുന്നു.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: അവ എന്റെ ശബ്ദം കേൾക്കും
  rationale: ἀκούω എന്നതിന് കേൾക്കുക എന്നും ശ്രദ്ധിച്ചു കേൾക്കുക/അനുസരിക്കുക എന്നും അർഥമാകാം. ‘ശബ്ദം കേൾക്കും’ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും പ്രതികരണപരമായ കേൾവിയുടെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: γενήσονται
  choice: ഉണ്ടാകും
  rationale: γίνομαι ഇവിടെ ഭാവിയിൽ നിലവിൽ വരുന്ന ഏകീകരിച്ച അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഉണ്ടാകും’ സ്വാഭാവികമാണ്.
- source_word: μία ποίμνη
  choice: ഒരൊറ്റ ആട്ടിൻകൂട്ടം
  rationale: ποίμνη തൊഴുത്തിനെയല്ല, ആടുകളുടെ കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഒരൊറ്റ’ μίαയുടെ ഏകത്വത്തിന് സ്വാഭാവിക ഊന്നൽ നൽകുന്നു.
- source_word: εἷς ποιμήν
  choice: ഒരൊറ്റ ഇടയൻ
  rationale: ποιμήν എന്നത് ഇടയൻ എന്നാണ്; ആവർത്തിക്കുന്ന ‘ഒരൊറ്റ’ മൂലപാഠത്തിലെ സമാന്തര ഘടനയും ഏകത്വവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐλή, ποίμνη എന്നീ വ്യത്യസ്ത പദങ്ങളുടെ വേർതിരിവ്
  choice: ആട്ടിൻതൊഴുത്ത് ... ആട്ടിൻകൂട്ടം
  alternative: ആട്ടിൻതൊഴുത്ത് ... ആട്ടിൻതൊഴുത്ത്
  rationale: ഗ്രീക്കിൽ ആദ്യത്തേത് പാർപ്പിടമായ αὐλήയും അവസാനത്തേത് ആടുകളുടെ സമൂഹമായ ποίμνηയും ആണ്. രണ്ടിനെയും ‘തൊഴുത്ത്’ എന്നു വിവർത്തനം ചെയ്യുന്നത് മൂലപാഠത്തിലെ വ്യത്യാസം ഇല്ലാതാക്കുകയും ഒരേയൊരു സ്ഥാപനപരമായ ചുറ്റുമതിൽ എന്ന ആശയം അനാവശ്യമായി സൃഷ്ടിക്കുകയും ചെയ്യും.
- issue: δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകത
  choice: ഞാൻ കൊണ്ടുവരണം
  alternative: ഞാൻ കൊണ്ടുവരേണ്ടതുണ്ട്
  rationale: യോഹന്നാനിൽ δεῖ പലപ്പോഴും ശക്തമായ ആവശ്യകത സൂചിപ്പിക്കുന്നു. ‘കൊണ്ടുവരണം’ ആ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ ആ ആവശ്യകതയുടെ ദൈവശാസ്ത്രപരമായ കാരണം വിവർത്തനം സ്വയം നിർവചിക്കുന്നില്ല.
- issue: ἀκούω എന്നതിലെ അർഥവ്യാപ്തി
  choice: എന്റെ ശബ്ദം കേൾക്കും
  alternative: എന്റെ ശബ്ദത്തിനു ചെവികൊടുക്കും
  rationale: സന്ദർഭം പ്രതികരണപരമായ കേൾവിയെ സൂചിപ്പിക്കാമെങ്കിലും ക്രിയയ്ക്ക് സാധാരണ ‘കേൾക്കുക’ എന്ന അർഥവും ഉണ്ട്. മുഖ്യപാഠം കൂടുതൽ തുറന്ന അർഥം നിലനിർത്തുന്നു; ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. ‘വേറെ’, ‘കൊണ്ടുവരണം’, ‘ഉണ്ടാകും’ തുടങ്ങിയ സ്വാഭാവിക രൂപങ്ങൾ ഉപയോഗിച്ചു; തൊഴുത്തും കൂട്ടവും തമ്മിലുള്ള മൂലപാഠവ്യത്യാസം വ്യക്തമായി സൂക്ഷിച്ചു.
