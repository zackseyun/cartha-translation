revisions:
- from: ഞാൻ അവർക്കു നിത്യജീവൻ നൽകുന്നു; അവർ ഒരിക്കലും എന്നേക്കും നശിച്ചുപോകുകയില്ല; ആരും അവരെ എന്റെ കൈയിൽനിന്ന് പിടിച്ചുപറിക്കുകയുമില്ല.
