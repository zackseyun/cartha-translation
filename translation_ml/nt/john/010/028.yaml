id: JHN.10.28
reference: John 10:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ml
  text: ഞാൻ അവർക്കു നിത്യജീവൻ നൽകുന്നു; അവർ ഒരിക്കലും നശിച്ചുപോകുകയില്ല; ആരും അവരെ എന്റെ കയ്യിൽനിന്ന് പിടിച്ചുപറിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: ‘Eternal life’ എന്ന ആശയം സ്വാഭാവികവും സഭാഭേദമില്ലാത്തതുമായ സ്ഥാപിത മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും എന്നേക്കും നശിച്ചുപോകുകയില്ല
  rationale: οὐ μήയുടെ ശക്തമായ നിഷേധവും εἰς τὸν αἰῶνα എന്ന കാലപരമായ ഊന്നലും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു; മൂലത്തിലെ ആവർത്തനസദൃശമായ ഊന്നൽ മിനുക്കി നീക്കുന്നില്ല.
- source_word: ἁρπάσει
  choice: പിടിച്ചുപറിക്കുക
  rationale: ബലമായി തട്ടിയെടുക്കുക എന്ന ἁρπάζωയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ τῆς χειρός μου
  choice: എന്റെ കൈയിൽനിന്ന്
  rationale: സംരക്ഷണത്തെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്ന മൂലരൂപകം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: οὐ μήയും εἰς τὸν αἰῶναയും ചേർന്നുള്ള ഉറപ്പിന്റെ ശക്തി
  choice: അവർ ഒരിക്കലും എന്നേക്കും നശിച്ചുപോകുകയില്ല
  alternative: അവർ ഒരിക്കലും നശിച്ചുപോകുകയില്ല
  rationale: മൂലഗ്രീക്കിലെ ഇരട്ട ഊന്നൽ—ശക്തമായ നിഷേധവും ‘എന്നേക്കും’ എന്ന പ്രയോഗവും—വ്യാഖ്യാനപരമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ‘എന്റെ കൈ’ എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: രൂപകം നേരിട്ട് നിലനിർത്തി
  alternative: എന്റെ സംരക്ഷണത്തിൽനിന്ന്
  rationale: സംരക്ഷണം എന്ന ആശയം ഉൾപ്പെട്ടിരിക്കാമെങ്കിലും, രൂപകത്തെ വ്യാഖ്യാനമായി മാറ്റുന്നത് അർഥപരിധി അനാവശ്യമായി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ മൂന്നു സമാന്തര ഘടകങ്ങളും അർദ്ധവിരാമങ്ങൾകൊണ്ട് തെളിവായി വേർതിരിച്ചിരിക്കുന്നു.
