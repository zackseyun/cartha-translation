id: JHN.10.37
reference: John 10:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: ml
  text: ഞാൻ എന്റെ പിതാവിന്റെ പ്രവൃത്തികൾ ചെയ്യുന്നില്ലെങ്കിൽ, എന്നെ വിശ്വസിക്കരുത്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ പറയുന്നത് വിശ്വസിക്കരുത്.”'
    reason: The Greek πιστεύω with μοι may convey believing Jesus personally or believing what he says.
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: ഞാൻ … ചെയ്യുന്നില്ലെങ്കിൽ
  rationale: εἰ introduces the condition and οὐ negates the present indicative ποιῶ. The Malayalam conditional form naturally expresses “if I am not doing,” while the present stem leaves room for ongoing or characteristic action.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: പ്രവൃത്തികൾ is a natural, dignified equivalent for ἔργα and preserves the Johannine emphasis on Jesus’ deeds as testimony to his identity.
- source_word: τοῦ πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: This directly represents the Greek genitive and retains “പിതാവ്” as the relational divine designation used by Jesus.
- source_word: μὴ πιστεύετέ μοι
  choice: എന്നെ വിശ്വസിക്കരുത്
  rationale: The prohibition is expressed naturally in Malayalam. The dative μοι most directly yields “believe me,” while its possible propositional sense is retained in a footnote.
theological_decisions:
- issue: Force of πιστεύω with dative μοι
  choice: എന്നെ വിശ്വസിക്കരുത്
  alternative: ഞാൻ പറയുന്നത് വിശ്വസിക്കരുത്
  rationale: πιστεύω with the dative can refer either to believing a person or accepting that person’s testimony. The direct personal construction is preserved in the text without resolving the overlap; the testimonial nuance appears in the footnote.
translation_notes:
  register: Modern standard Malayalam in a clear, dignified register. The conditional syntax follows ordinary Malayalam word order, and the footnote marker is placed after the phrase it qualifies.
