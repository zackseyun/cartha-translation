  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: ml
  text: ദൈവത്തിന്റെ വചനം ലഭിച്ചവരെ അവൻ ‘ദൈവങ്ങൾ’ എന്നു വിളിച്ചെങ്കിൽ[a]—തിരുവെഴുത്ത് അസാധുവാക്കാനാവില്ല—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവികർ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ദൈവങ്ങൾ’ എന്നാണ്; ഇത് സങ്കീർത്തനം 82:6-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. ഇവിടെ സൂചിപ്പിക്കുന്നത് മനുഷ്യ ന്യായാധിപന്മാരെയാണെന്ന് ചില വ്യാഖ്യാതാക്കൾ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘റദ്ദാക്കാനാവില്ല’ അല്ലെങ്കിൽ ‘മാറ്റിവെക്കാനാവില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: യേശുവിന്റെ ന്യായവാദത്തിലെ വ്യവസ്ഥാപക ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκείνους
  choice: അവരെ
  rationale: തിരുവെഴുത്തിൽ അഭിസംബോധന ചെയ്യപ്പെട്ടവരിലേക്കാണ് സൂചന; മൂലത്തിൽ ഇല്ലാത്ത ‘മനുഷ്യർ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: εἶπεν
  choice: വിളിച്ചു
  rationale: ‘ദൈവങ്ങൾ എന്നു പറഞ്ഞു’ എന്നതിനെക്കാൾ, ഒരുപേരിൽ വിശേഷിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് ‘വിളിച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: θεοὺς
  choice: ‘ദൈവങ്ങൾ’
  rationale: സങ്കീർത്തനം 82:6-ലെ പദം യേശു ഉദ്ധരിക്കുന്നതുപോലെ നേരിട്ട് നിലനിർത്തുന്നു; ‘ന്യായാധിപന്മാർ’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: ദൈവത്തിന്റെ വചനം ലഭിച്ചവരെ
  rationale: ദൈവവചനം അവരിലേക്കു വന്നുവെന്ന സംഭവാർത്ഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐ δύναται λυθῆναι
  choice: അസാധുവാക്കാനാവില്ല
  rationale: ഇവിടെ λύω സൂചിപ്പിക്കുന്ന റദ്ദാക്കൽ, പ്രാബല്യം ഇല്ലാതാക്കൽ എന്നീ ആശയങ്ങൾ വ്യക്തമായി പകരുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: അധികാരമുള്ള വിശുദ്ധലിഖിതത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സുപരിചിതവും ഗൗരവമുള്ളതുമായ പദമാണ്.
theological_decisions:
- issue: ‘ദൈവങ്ങൾ’ എന്നു വിളിക്കപ്പെട്ടവരുടെ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ ‘ദൈവങ്ങൾ’ എന്ന പദം അതേപടി നിലനിർത്തുക
  alternative: ‘ന്യായാധിപന്മാർ’ അല്ലെങ്കിൽ ‘ദൈവികർ’
  rationale: യേശുവിന്റെ ന്യായവാദം സങ്കീർത്തനം 82:6-ലെ കൃത്യമായ പദപ്രയോഗത്തെ ആശ്രയിക്കുന്നു. ഇവർ ആരാണെന്ന വ്യാഖ്യാനഭിന്നത പ്രധാന പാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- issue: തിരുവെഴുത്ത് ‘അസാധുവാക്കാനാവില്ല’ എന്നതിന്റെ ബലം
  choice: തിരുവെഴുത്തിന്റെ പ്രാബല്യം ഇല്ലാതാക്കാനാവില്ലെന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തുക
  alternative: ‘ലംഘിക്കാനാവില്ല’ അല്ലെങ്കിൽ ‘മാറ്റിവെക്കാനാവില്ല’
  rationale: വാക്യം യേശുവിന്റെ വാദത്തിന് ആധാരമായ തിരുവെഴുത്തിന്റെ അലംഘനീയമായ അധികാരം വ്യക്തമാക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക നിർവചനം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഇടയ്ക്കുള്ള വിശദീകരണസ്വഭാവമുള്ള ഉപവാക്യം ദീർഘരേഖകൾകൊണ്ട് വേർതിരിച്ചിട്ടുണ്ട്; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
