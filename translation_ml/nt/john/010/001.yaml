id: JHN.10.1
reference: John 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: ml
  text: '“സത്യം, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: വാതിലിലൂടെ[b] ആടുകളുടെ തൊഴുത്തിലേക്ക്[a] കടക്കാതെ മറ്റൊരിടത്തുകൂടി കയറുന്നവൻ അവൻ കള്ളനും കവർച്ചക്കാരനും[c] ആകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആടുകളുടെ വേലിക്കെട്ടിനുള്ളിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. αὐλή എന്ന ഗ്രീക്കുപദം ചുറ്റുമതിലുള്ള മുറ്റത്തെയോ ആടുകളെ പാർപ്പിക്കുന്ന അടച്ച ഇടത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കവാടത്തിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. θύρα എന്ന ഗ്രീക്കുപദത്തിന് സന്ദർഭമനുസരിച്ച് ‘വാതിൽ’ അല്ലെങ്കിൽ ‘കവാടം’ എന്നർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘കള്ളൻ’ (κλέπτης), ‘കവർച്ചക്കാരൻ’ (λῃστής) എന്നീ പദങ്ങൾ വേർതിരിച്ചിരിക്കുന്നു; രണ്ടാമത്തേത് പലപ്പോഴും ബലപ്രയോഗമോ അക്രമമോ ഉള്ള മോഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_distinction
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യോഹന്നാനിലെ ആവർത്തിച്ചുള്ള ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ സൂത്രത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: നേരിട്ടുള്ള പ്രസ്താവനയുടെ ഔപചാരികതയും ബഹുവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: കടക്കാതെ ... കയറുന്നവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന substantival participle മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുവാചകമായി അവതരിപ്പിക്കുന്നു.
- source_word: διὰ τῆς θύρας
  choice: വാതിലിലൂടെ
  rationale: θύρα എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഇടയസന്ദർഭത്തിൽ ‘കവാടം’ എന്നതും സാധ്യമാണ്.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: ആടുകളുടെ തൊഴുത്തിലേക്ക്
  rationale: αὐλή സൂചിപ്പിക്കുന്ന ചുറ്റുമതിലുള്ള ആടുകളുടെ ഇടം വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: മറ്റൊരിടത്തുകൂടി കയറുന്നവൻ
  rationale: ἀναβαίνων എന്നതിലെ കയറിയെത്തുന്ന ഭൗതികചിത്രവും ἀλλαχόθεν എന്നതിലെ വേറൊരു ഭാഗത്തുനിന്നുള്ള പ്രവേശനവും നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: മുൻപറഞ്ഞ ഏകവചന വ്യക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി തിരിച്ചറിയിക്കുന്നു; ഗ്രീക്കിലെ സൂചകബലം വാക്യഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: κλέπτης
  choice: കള്ളൻ
  rationale: രഹസ്യമായി മോഷ്ടിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: λῃστής
  choice: കവർച്ചക്കാരൻ
  rationale: ബലപ്രയോഗമോ അക്രമമോ ഉൾക്കൊള്ളാവുന്ന λῃστής എന്ന പദത്തെ κλέπτης-ൽനിന്ന് വേർതിരിക്കുന്നു.
theological_decisions:
- issue: θύρα/αὐλή രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘വാതിൽ’, ‘ആടുകളുടെ തൊഴുത്ത്’ എന്ന മൂർത്തമായ ചിത്രങ്ങൾ മാത്രം പരിഭാഷപ്പെടുത്തി; രൂപകത്തിന്റെ അർഥം ഇവിടെ വിശദീകരിച്ചില്ല.
  alternative: ‘കവാടം’, ‘ആട്ടിൻപുറം’ എന്നു നൽകുകയോ യേശു, രക്ഷ, നേതാക്കൾ എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുകയോ ചെയ്യുക.
  rationale: ഈ വാക്യം രൂപകത്തെ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള സന്ദർഭത്തിനു മുമ്പായി അതിന്റെ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ ഇറക്കിവയ്ക്കരുത്.
- issue: κλέπτης καὶ λῃστής തമ്മിലുള്ള വ്യത്യാസം
  choice: ‘കള്ളനും കവർച്ചക്കാരനും’ എന്ന രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ഉപയോഗിച്ചു.
  alternative: രണ്ടും ‘മോഷ്ടാവ്’ എന്ന ഒറ്റ ആശയമായി ലയിപ്പിക്കുക.
  rationale: മറഞ്ഞ് മോഷ്ടിക്കുന്നതും ബലപ്രയോഗമുള്ള കവർച്ചയും തമ്മിലുള്ള ഗ്രീക്ക് പദവ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: പുരുഷലിംഗ ഏകവചന പൊതുപ്രയോഗം
  choice: ‘കയറുന്നവൻ ... കള്ളനും കവർച്ചക്കാരനും’ എന്ന ഏകവചന പുരുഷരൂപം നിലനിർത്തി.
  alternative: ‘ആരെങ്കിലും’ എന്ന ലിംഗനിരപേക്ഷ രൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ ഏകവചന പുരുഷരൂപം പ്രതിനിധാനപരമാണെങ്കിലും വ്യാകരണരൂപം അനാവശ്യമായി സമതലപ്പെടുത്താതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രൂപകത്തിന്റെ ഗ്രാമീണ ഭാവം നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ പദപ്രയോഗങ്ങളും അനാവശ്യ വ്യാഖ്യാനവികാസവും ഒഴിവാക്കി.
