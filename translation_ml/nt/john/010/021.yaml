  source_fidelity: 'ഗ്രീക്ക് പാഠത്തിന്റെ എല്ലാ പ്രധാന ഘടകങ്ങളും കൃത്യമായി പ്രതിഫലിക്കുന്നു: ἄλλοι-യുടെ വിരുദ്ധകൂട്ട അർഥം, ἔλεγον-ന്റെ അപൂർണഭൂതകാല തുടർച്ച, δαιμονιζομένου-യുടെ ഉറവിട/ഉടമസ്ഥതാ സൂചന, കണ്ണുകൾ ‘തുറക്കുക’ എന്ന മൂർത്തപ്രയോഗം എന്നിവ നിലനിൽക്കുന്നു. μή-ചോദ്യത്തിന്റെ നിഷേധപ്രതീക്ഷ സന്ദർഭോചിതമായ ‘കഴിയുമോ?’യിൽ സ്വാഭാവികമായി ലഭ്യമാണ്.'
  naturalness: ‘മറ്റുള്ളവർ പറഞ്ഞുകൊണ്ടിരുന്നു’യും ‘ഭൂതം ബാധിച്ച ഒരാളുടേതല്ല’യും ആധുനിക നിലവാര മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘ഒരു ഭൂതത്തിന് അന്ധരുടെ കണ്ണുകൾ തുറക്കാൻ കഴിയുമോ?’ എന്ന ചോദ്യം സ്വാഭാവികമായ വാചകരീതിയാണ്.
  terminology: δαιμονίζομαι / δαιμόνιον എന്നിവയ്ക്ക് ‘ഭൂതം ബാധിച്ച ഒരാൾ’ / ‘ഒരു ഭൂതം’ എന്ന പ്രയോഗം നേരിട്ടും സ്ഥിരതയോടെയും നൽകിയിരിക്കുന്നു; പാഠത്തിനപ്പുറമുള്ള സാങ്കേതികമോ വിഭാഗീയമോ ആയ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
