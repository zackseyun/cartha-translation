id: JHN.10.21
reference: John 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: ml
  text: 'മറ്റുള്ളവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഈ വാക്കുകൾ ഭൂതം ബാധിച്ച ഒരാളുടേതല്ല.[a] ഒരു ഭൂതത്തിന് അന്ധരുടെ കണ്ണുകൾ തുറക്കാൻ കഴിയുമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ വാക്കുകൾ ഭൂതം ബാധിച്ച ഒരാളിൽനിന്നുള്ളതല്ല.”
    reason: ഗ്രീക്കിലെ ഷഷ്ഠീപ്രയോഗത്തെ വാക്കുകളുടെ ഉടമസ്ഥതയായോ അവയുടെ ഉറവിടമായോ സ്വാഭാവികമായി വ്യക്തമാക്കാം.
lexical_decisions:
- source_word: ἄλλοι
  choice: മറ്റുള്ളവർ
  rationale: മുൻവാക്യത്തിൽ സംസാരിച്ചവരിൽനിന്നു വ്യത്യസ്തമായ മറ്റൊരു കൂട്ടത്തെ ലളിതമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലം സംഭാഷണം തുടരുകയോ ആവർത്തിക്കപ്പെടുകയോ ചെയ്തതിന്റെ ഭാവം നൽകുന്നതിനാൽ അതു മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ταῦτα τὰ ῥήματα
  choice: ഈ വാക്കുകൾ
  rationale: യേശു പറഞ്ഞ കാര്യങ്ങളെയാണ് ῥήματα സൂചിപ്പിക്കുന്നത്; നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പരിഭാഷയാണിത്.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: ഭൂതം ബാധിച്ച ഒരാളുടേതല്ല
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീപ്രയോഗം ഈ വാക്കുകൾ അത്തരമൊരു വ്യക്തിയുടേതല്ലെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഘടന ഉപയോഗിക്കുന്നു.
- source_word: μὴ ... δύναται
  choice: കഴിയുമോ?
  rationale: μή പ്രതീക്ഷിക്കുന്ന ഉത്തരം നിഷേധമാണെന്ന് സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ അതു വ്യക്തമായതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ ആലങ്കാരിക ചോദ്യരൂപം ഉപയോഗിക്കുന്നു.
- source_word: δαιμόνιον
  choice: ഒരു ഭൂതത്തിന്
  rationale: δαιμόνιον എന്ന പദത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘ദുഷ്ടാത്മാവ്’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: അന്ധരുടെ കണ്ണുകൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ദൃശ്യരൂപം നിലനിർത്തുകയും മുൻസന്ദർഭത്തിലെ അന്ധന്റെ സൗഖ്യവുമായി ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνοῖξαι
  choice: തുറക്കാൻ
  rationale: ‘കണ്ണുകൾ തുറക്കുക’ എന്ന ഗ്രീക്കിലെ മൂർത്തമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘കാഴ്ച നൽകുക’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
theological_decisions:
- issue: δαιμονίζομαι / δαιμόνιον എന്നീ പദങ്ങളുടെ പരിഭാഷ
  choice: ഭൂതം ബാധിച്ച ഒരാൾ / ഒരു ഭൂതം
  alternative: ഭൂതാവിഷ്ടനായ ഒരാൾ / ഒരു ദുഷ്ടാത്മാവ്
  rationale: വാക്യം യേശുവിന്റെ വാക്കുകളും പ്രവൃത്തിയും ഭൂതത്തിന്റെ പ്രവർത്തനവുമായി പൊരുത്തപ്പെടുന്നില്ലെന്ന ജനക്കൂട്ടത്തിന്റെ നിഗമനം അവതരിപ്പിക്കുന്നു. തിരുവെഴുത്തിലെ ഭാഷയുടെ ശക്തി മയപ്പെടുത്താതെയും ‘ബാധ’യുടെ സ്വഭാവത്തെക്കുറിച്ച് അനാവശ്യമായ സാങ്കേതിക സിദ്ധാന്തം ചേർക്കാതെയും പരിഭാഷപ്പെടുത്തുന്നു.
- issue: μή ആരംഭിക്കുന്ന ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി
  choice: ഒരു ഭൂതത്തിന് അന്ധരുടെ കണ്ണുകൾ തുറക്കാൻ കഴിയുമോ?
  alternative: ഒരു ഭൂതത്തിന് അന്ധരുടെ കണ്ണുകൾ തുറക്കാൻ കഴിയില്ലല്ലോ?
  rationale: ഗ്രീക്കിൽ പ്രതീക്ഷിക്കുന്ന ഉത്തരം ‘ഇല്ല’ എന്നതാണ്. ലളിതമായ മലയാള ചോദ്യരൂപം സന്ദർഭത്തിൽ ആ നിഷേധപ്രതീക്ഷ വ്യക്തമായി നൽകുകയും വാചകത്തിന്റെ തുറന്ന ചോദ്യഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപം അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നൽകുന്നു; ‘കണ്ണുകൾ തുറക്കുക’ എന്ന മൂർത്തമായ ബൈബിൾ ദൃശ്യരൂപം സംരക്ഷിച്ചിരിക്കുന്നു.
