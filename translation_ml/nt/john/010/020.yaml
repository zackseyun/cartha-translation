id: JHN.10.20
reference: John 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: ml
  text: 'എന്നാൽ അവരിൽ പലരും പറഞ്ഞുകൊണ്ടിരുന്നു: “അവന് ഒരു ദുരാത്മാവുണ്ട്; അവൻ ഭ്രാന്തനാണ്. നിങ്ങൾ എന്തിന് അവന്റെ വാക്കു കേൾക്കുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം രംഗത്തിൽ തുടർന്നോ ആവർത്തിച്ചോ നടന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: അവരിൽ പലരും
  rationale: കൂട്ടത്തിലെ ഒരു വിഭാഗത്തെയാണ് ഈ ഭാഗികപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: Δαιμόνιον ἔχει
  choice: അവന് ഒരു ഭൂതമുണ്ട്
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രയോഗം വ്യാഖ്യാനപരമായ ‘ഭൂതബാധിതനാണ്’ എന്ന രൂപത്തേക്കാൾ സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: μαίνεται
  choice: അവന് ഭ്രാന്താണ്
  rationale: മാനസികനില തെറ്റിയവനാണെന്ന ശത്രുതാപരമായ ആരോപണം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: നിങ്ങൾ എന്തിന് അവന്റെ വാക്കു കേൾക്കുന്നു?
  rationale: τί ഇവിടെ സന്ദർഭാനുസൃതമായി ‘എന്തിന്’ എന്ന അർഥത്തിലാണ്; αὐτοῦ ἀκούετε എന്നത് ഒരാളുടെ വാക്കു ശ്രദ്ധിച്ചു കേൾക്കുക എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നൽകി.
theological_decisions:
- issue: യേശുവിന്റെ അവസ്ഥയെക്കുറിച്ചുള്ള ശത്രുതാപരമായ ആരോപണം
  choice: അവന് ഒരു ഭൂതമുണ്ട്; അവന് ഭ്രാന്താണ്
  alternative: അവൻ ഭൂതബാധിതനും ഭ്രാന്തനുമാണ്
  rationale: ആരോപണത്തിന്റെ കാഠിന്യം മയപ്പെടുത്താതെയും അതിന് വൈദ്യശാസ്ത്രപരമോ സിദ്ധാന്തപരമോ ആയ വിശദീകരണം ചേർക്കാതെയും ഗ്രീക്കിലെ രണ്ട് പ്രസ്താവനകളും നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ആരോപണം ഉദ്ധരണിക്കുള്ളിൽ വ്യക്തവും നേരിട്ടുമാണ്; അനാവശ്യമായ സഭാപദാവലി ഒഴിവാക്കി.
