id: JHN.10.41
reference: John 10:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: ml
  text: 'അനേകർ അവന്റെ അടുക്കൽ വന്നു പറഞ്ഞു: “യോഹന്നാൻ ഒരു അടയാളവും ചെയ്തില്ല; എന്നാൽ ഇദ്ദേഹത്തെക്കുറിച്ച് യോഹന്നാൻ പറഞ്ഞതെല്ലാം സത്യമായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἦλθον πρὸς αὐτόν
  choice: അവന്റെ അടുക്കൽ വന്നു
  rationale: πρός സഹിതമുള്ള ചലനത്തിന്റെ വ്യക്തിയിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἔλεγον
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ അപൂർണ്ണകാലം തുടർച്ചയെയോ ആവർത്തനത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഈ കൂട്ടായ റിപ്പോർട്ടിൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്; ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ഇവിടെ അനാവശ്യമായി ദൈർഘ്യം ഊന്നാം.
- source_word: σημεῖον
  choice: അടയാളം
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലെ പ്രമേയപ്രാധാന്യമുള്ള ‘sign’ ആശയം നിലനിർത്തുന്നു; ‘അത്ഭുതം’ എന്നത് അതിന്റെ സൂചനാത്മകത ചുരുക്കാം.
- source_word: ἐποίησεν οὐδέν
  choice: ഒരു അടയാളവും ചെയ്തില്ല
  rationale: ഗ്രീക്കിലെ സമ്പൂർണ നിഷേധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: πάντα δὲ ὅσα
  choice: എന്നാൽ ... പറഞ്ഞതെല്ലാം
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: περὶ τούτου
  choice: ഇദ്ദേഹത്തെക്കുറിച്ച്
  rationale: τούτου എന്ന സമീപസൂചകത്തിന്റെ ബലം നിലനിർത്തിക്കൊണ്ട്, യേശുവിനെ ആദരസൂചകമായ സ്വാഭാവിക മലയാളത്തിൽ പരാമർശിക്കുന്നു.
- source_word: ἀληθῆ ἦν
  choice: സത്യമായിരുന്നു
  rationale: പിന്നീട് തെളിഞ്ഞു എന്ന അധികഭാവം ചേർക്കാതെ ഗ്രീക്ക് വിധേയവിശേഷണത്തെ നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ σημεῖον എന്ന പദത്തിന്റെ പ്രമേയപരമായ ഉപയോഗം
  choice: അടയാളം
  alternative: അത്ഭുതം
  rationale: പ്രവൃത്തി അത്ഭുതകരമാണെന്നതിലുപരി മറ്റൊന്നിലേക്കു വിരൽചൂണ്ടുന്നു എന്ന യോഹന്നാനീയ അർത്ഥസാധ്യത സംരക്ഷിക്കുന്നു.
- issue: περὶ τούτου എന്നതിലെ സൂചകഭാവം
  choice: ഇദ്ദേഹത്തെക്കുറിച്ച്
  alternative: അവനെക്കുറിച്ച്
  rationale: ഗ്രീക്കിലെ demonstrative force മായ്ച്ചുകളയാതെ, സന്ദർഭത്തിലെ യേശുവിനെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന. ഉദ്ധരണിയിലെ ജനങ്ങളുടെ സാക്ഷ്യസ്വരം നിലനിർത്തുന്നു; വിഭാഗീയ പദാവലി ഒഴിവാക്കുന്നു.
