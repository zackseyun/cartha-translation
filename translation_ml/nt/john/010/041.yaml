  revision_rationale: സുരക്ഷിതമായ തിരുത്തൽ ആവശ്യമില്ല. നിലവിലെ വിവർത്തനം ഉറവിടപാഠത്തിന്റെ അർത്ഥം, യോഹന്നാനീയ «അടയാളം» പദപ്രയോഗം, וכן περὶ τούτου-യിലെ സൂചകഭാവം എന്നിവ മതിയായും സ്വാഭാവികമായും കൈമാറുന്നു. ഇംഗ്ലീഷ് ഓഡിറ്റ് ട്രെയിലിലെ വ്യത്യസ്തമായ «about him/this man» മുൻഗണന മലയാളത്തിലെ «ഇദ്ദേഹത്തെക്കുറിച്ച്» എന്ന സ്വാഭാവിക, സമീപസൂചകമായ പ്രയോഗത്തെ അസാധുവാക്കുന്നില്ല.
