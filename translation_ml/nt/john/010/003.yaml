    issue: The opening phrase «അവനുവേണ്ടി» weakens/shifts the dative force of τούτῳ.
    rationale: It can suggest that the gatekeeper opens on the shepherd’s behalf rather than that he opens to the shepherd. «അവനു» preserves the Greek personal dative without adding a beneficiary nuance.
