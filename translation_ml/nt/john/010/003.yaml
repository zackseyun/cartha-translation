id: JHN.10.3
reference: John 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: ml
  text: അവനു വാതിൽകാവൽക്കാരൻ വാതിൽ തുറക്കുന്നു; ആടുകൾ അവന്റെ ശബ്ദം കേൾക്കുന്നു. അവൻ തന്റെ സ്വന്തം ആടുകളെ പേരുചൊല്ലി വിളിച്ച് അവയെ പുറത്തേക്കു നയിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയെ പുറത്തേക്കു കൊണ്ടുവരുന്നു.’
    reason: ἐξάγει എന്ന ക്രിയയ്ക്ക് ‘നയിക്കുന്നു’ എന്നും ‘കൊണ്ടുവരുന്നു’ എന്നും സന്ദർഭത്തിൽ സാധുവായ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: τούτῳ
  choice: അവനുവേണ്ടി
  rationale: മുൻവാക്യത്തിലെ ഇടയനെയാണ് ഈ ദത്തിവ് സർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അവനുവേണ്ടി’ എന്നത് വാതിൽകാവൽക്കാരൻ അയാൾക്കായി വാതിൽ തുറക്കുന്നു എന്ന ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ θυρωρός
  choice: വാതിൽകാവൽക്കാരൻ
  rationale: ആട്ടിൻതൊഴുത്തിന്റെ പ്രവേശനകവാടം കാത്തുസൂക്ഷിക്കുകയും തുറക്കുകയും ചെയ്യുന്ന ആളെ സൂചിപ്പിക്കുന്ന, സന്ദർഭോചിതവും ആധുനികവുമായ പദം.
- source_word: ἀνοίγει
  choice: വാതിൽ തുറന്നുകൊടുക്കുന്നു
  rationale: ഗ്രീക്കിൽ കർമം പ്രസക്തിസൂചനയാൽ മനസ്സിലാക്കപ്പെടുന്നു. മലയാളത്തിൽ ‘വാതിൽ’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്; ‘തുറന്നുകൊടുക്കുന്നു’ എന്നത് ദത്തിവിലുള്ള വ്യക്തിക്കായി ചെയ്യുന്ന പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: τὰ πρόβατα
  choice: ആടുകൾ
  rationale: ഇടയരൂപകത്തിലെ πρόβατα എന്നതിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: അവന്റെ ശബ്ദം കേൾക്കുന്നു
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ബഹുവചന കർത്താവിനോടൊപ്പം ഏകവചന ക്രിയ വന്നിട്ടുണ്ടെങ്കിലും അർഥം ബഹുവചനമാണ്. മലയാളത്തിൽ ‘ആടുകൾ ... കേൾക്കുന്നു’ സ്വാഭാവികമായി ഇത് നിലനിർത്തുന്നു.
- source_word: τὰ ἴδια πρόβατα
  choice: തന്റെ സ്വന്തം ആടുകളെ
  rationale: ἴδια സൂചിപ്പിക്കുന്ന ഉടമസ്ഥതയും പ്രത്യേക ബന്ധവും ‘സ്വന്തം’ എന്ന ഊന്നലിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: പേരുചൊല്ലി വിളിച്ച്
  rationale: ഓരോ ആടിനെയും അതിന്റെ പേരിൽ വിളിക്കുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ പ്രയോഗത്തെ അനാവശ്യമായി വാക്കുതോറും പകർത്തുന്നില്ല.
- source_word: ἐξάγει αὐτά
  choice: അവയെ പുറത്തേക്കു നയിക്കുന്നു
  rationale: ἐξάγω എന്നതിന് ‘പുറത്തേക്കു കൊണ്ടുവരുക’ എന്നും ‘പുറത്തേക്കു നയിക്കുക’ എന്നും അർഥമാകാം. ഇടയന്റെ മാർഗനിർദേശത്തെ സ്വാഭാവികമായി ചിത്രീകരിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘നയിക്കുന്നു’ സ്വീകരിച്ചു; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: ഇടയരൂപകത്തിലെ വ്യക്തിയുടെ തിരിച്ചറിയലും പ്രവർത്തനവും
  choice: 'വാക്യത്തിലെ കഥാപാത്രങ്ങളെ രൂപകത്തിന്റെ തലത്തിൽത്തന്നെ നിലനിർത്തി: വാതിൽകാവൽക്കാരൻ അവനുവേണ്ടി തുറക്കുന്നു; ആടുകൾ അവന്റെ ശബ്ദം കേൾക്കുന്നു; അവൻ സ്വന്തം ആടുകളെ വിളിച്ചു നയിക്കുന്നു.'
  alternative: ‘അവൻ’ എന്നിടത്ത് യേശുവിന്റെ പേര് നേരിട്ട് ചേർത്ത് ക്രിസ്തുശാസ്ത്രപരമായ തിരിച്ചറിയൽ ഈ വാക്യത്തിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ രൂപകത്തിന് ക്രിസ്തുശാസ്ത്രപരമായ പ്രാധാന്യമുണ്ടെങ്കിലും ഗ്രീക്ക് വാക്യം ഇവിടെ പേര് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ രൂപകത്തിലെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഇടയരൂപകം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന ‘നയിക്കുന്നു’ എന്ന പദത്തോടാണ് ചേർത്തിരിക്കുന്നത്.
