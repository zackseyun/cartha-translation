revisions:
- from: എന്നാൽ ഞാൻ അവ ചെയ്യുന്നു എങ്കിൽ, നിങ്ങൾ എന്നെ വിശ്വസിക്കാതിരുന്നാലും[a] പ്രവൃത്തികളെ വിശ്വസിക്കുവിൻ. അങ്ങനെ, പിതാവ് എന്നിലും ഞാൻ പിതാവിലും ആകുന്നു എന്നു നിങ്ങൾ അറിയുകയും അറിഞ്ഞുകൊണ്ടിരിക്കുകയും ചെയ്യട്ടെ[b].
  to: എന്നാൽ ഞാൻ അവ ചെയ്യുന്നുവെങ്കിൽ, നിങ്ങൾ എന്നെ വിശ്വസിക്കുന്നില്ലെങ്കിലും[a] പ്രവൃത്തികളെ വിശ്വസിക്കുവിൻ. അങ്ങനെ പിതാവ് എന്നിലും ഞാൻ പിതാവിലും ആണെന്ന് നിങ്ങൾ അറിയുകയും ആ അറിവിൽ തുടരുകയും ചെയ്യേണ്ടതിന്[b].
  rationale: The revision corrects the Malayalam mood and syntax of the Greek purpose clause while retaining the source’s possible progression from coming to know to ongoing recognition. It also makes the opening condition more idiomatic. No theological expansion has been introduced, and the footnote anchors remain correctly placed.
