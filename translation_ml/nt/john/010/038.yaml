id: JHN.10.38
reference: John 10:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ അവ ചെയ്യുന്നുവെങ്കിൽ, നിങ്ങൾ എന്നെ വിശ്വസിക്കുന്നില്ലെങ്കിലും[a] പ്രവൃത്തികളെ വിശ്വസിക്കുവിൻ. അങ്ങനെ പിതാവ് എന്നിലും ഞാൻ പിതാവിലും ആണെന്ന് നിങ്ങൾ അറിയുകയും ആ അറിവിൽ തുടരുകയും ചെയ്യേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങൾ എന്നിൽ വിശ്വസിക്കുന്നില്ലെങ്കിലും.’ ഗ്രീക്കിൽ ‘വിശ്വസിക്കുക’ എന്ന ക്രിയ ദത്തിവിഭക്തിയിലുള്ള സർവനാമത്തോടുകൂടെയാണ്; അതിന് ‘എന്നെ വിശ്വസിക്കുക’ എന്നും ‘എന്നിൽ വിശ്വസിക്കുക’ എന്നും അർഥമാകാം. ഇവിടെ ‘പ്രവൃത്തികളെ വിശ്വസിക്കുവിൻ’ എന്ന തുടർന്നുള്ള പ്രയോഗത്തോടുള്ള വൈരുധ്യത്തിൽ ‘എന്നെ വിശ്വസിക്കുക’ കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അറിയുകയും ആ അറിവിൽ തുടരുകയും’ എന്നത് ഗ്രീക്കിലെ ഒരേ ക്രിയയുടെ രണ്ടു വ്യത്യസ്ത രൂപങ്ങളെ പ്രതിഫലിപ്പിക്കുന്നു; അറിവിലേക്കെത്തുന്നതും ആ അറിവിൽ തുടരുന്നതും ഇതിലൂടെ ഊന്നിപ്പറയുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: ഞാൻ അവ ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൂചിപ്പിച്ചിരിക്കുന്ന പ്രവൃത്തികളെയാണ് ‘അവ’ എന്നു വ്യക്തമാക്കുന്നത്.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: നിങ്ങൾ എന്നെ വിശ്വസിക്കാതിരുന്നാലും
  rationale: πιστεύω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവിഭക്തി ഇവിടെ യേശുവിന്റെ സാക്ഷ്യം വിശ്വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘പ്രവൃത്തികളെ വിശ്വസിക്കുവിൻ’ എന്ന വൈരുധ്യവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: പ്രവൃത്തികളെ വിശ്വസിക്കുവിൻ
  rationale: പ്രവൃത്തികൾ നൽകുന്ന സാക്ഷ്യം അംഗീകരിക്കുക എന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗം പരമാവധി നേരിട്ട് നിലനിർത്തുന്നു; ‘പ്രവൃത്തികളിൽ വിശ്വസിക്കുവിൻ’ എന്നു പറഞ്ഞാൽ അവയെ വിശ്വാസത്തിന്റെ അന്തിമ ലക്ഷ്യമാക്കുന്നതായി തെറ്റിദ്ധരിക്കാം.
- source_word: ἔργοις
  choice: പ്രവൃത്തികൾ
  rationale: യോഹന്നാനിൽ യേശുവിന്റെ വെളിപ്പെടുത്തുന്ന പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന ആവർത്തിത പദപ്രയോഗം നിലനിർത്തുന്നു; മൂലത്തിൽ σημεῖα അല്ലാത്തതിനാൽ ‘അടയാളങ്ങൾ’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: നിങ്ങൾ അറിയുകയും അറിഞ്ഞുകൊണ്ടിരിക്കുകയും ചെയ്യട്ടെ
  rationale: γνῶτε എന്ന aorist രൂപവും γινώσκητε എന്ന present രൂപവും തമ്മിലുള്ള ഭാവവ്യത്യാസം—അറിവിലേക്കെത്തലും അതിൽ തുടർന്നുനിൽക്കലും—മലയാളത്തിൽ സ്വാഭാവികമായി കഴിയുന്നത്ര പ്രകടമാക്കുന്നു.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: പിതാവ് എന്നിലും ഞാൻ പിതാവിലും ആകുന്നു
  rationale: പരസ്പര അന്തർവാസത്തിന്റെ യോഹന്നാനീയ ഭാഷയെ വിശദീകരണപരമായ വിപുലീകരണമില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πατήρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലെ ‘ὁ πατήρ’ എന്ന നിർദിഷ്ട രൂപം പിന്തുടരുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്റെ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പിതാവിന്റെയും പുത്രന്റെയും പരസ്പര അന്തർവാസം
  choice: ‘പിതാവ് എന്നിലും ഞാൻ പിതാവിലും ആകുന്നു’ എന്ന നേരിട്ടുള്ള ബന്ധഭാഷ നിലനിർത്തി.
  alternative: ‘പിതാവ് എന്നോടു ഐക്യപ്പെട്ടിരിക്കുന്നു; ഞാനും പിതാവിനോടു ഐക്യപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘പിതാവ് എന്നിൽ വസിക്കുന്നു; ഞാൻ പിതാവിൽ വസിക്കുന്നു.’
  rationale: മൂലവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ ശക്തിയും ഉദ്ദേശപൂർവമായ ഗൗരവവും നിലനിർത്തുന്നു; പിന്നീടുണ്ടായ സിദ്ധാന്തപരമായ പദാവലി വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: γνῶτε, γινώσκητε എന്നീ രണ്ടു രൂപങ്ങളുടെ ബന്ധം
  choice: ‘അറിയുകയും അറിഞ്ഞുകൊണ്ടിരിക്കുകയും’ എന്നു ഭാവവ്യത്യാസം സൂചിപ്പിച്ചു.
  alternative: ‘അറിഞ്ഞ് മനസ്സിലാക്കുകയും’ അല്ലെങ്കിൽ ലളിതമായി ‘അറിയുകയും.’
  rationale: രണ്ടാമത്തെ ക്രിയയ്ക്ക് ‘മനസ്സിലാക്കുക’ എന്ന വേറൊരു നിഘണ്ടു അർഥം അനാവശ്യമായി നൽകാതെ, ഒരേ ക്രിയയുടെ വ്യത്യസ്ത ഭാവരൂപങ്ങൾ സൂചിപ്പിക്കുന്ന ആരംഭവും തുടർച്ചയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വിശ്വസിക്കുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം വാക്യത്തിന്റെ തിരുവെഴുത്തുസ്വരവും വ്യക്തതയും നിലനിർത്തുന്നു; പരസ്പര അന്തർവാസഭാഷ വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചിട്ടില്ല.
