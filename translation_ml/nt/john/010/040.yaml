  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: ml
  text: അവൻ വീണ്ടും യോഹന്നാൻ ആദ്യം സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്ന യോർദ്ദാന്റെ മറുകരയിലുള്ള[a] സ്ഥലത്തേക്കു പോയി; അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യോർദ്ദാനപ്പുറത്തുള്ള.’
    reason: πέραν τοῦ Ἰορδάνου എന്ന പ്രയോഗത്തിന്റെ മറ്റൊരു സ്വാഭാവിക വിവർത്തനം.
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: സന്ദർഭത്തിൽ ഇപ്പോഴുള്ള സ്ഥലം വിട്ട് മറ്റൊരിടത്തേക്കുള്ള യാത്ര ‘പോയി’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആ സ്ഥലത്തേക്കുള്ള ആവർത്തിച്ചുള്ള യാത്രയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദ്ദാന്റെ മറുകരയിലുള്ള
  rationale: പുഴയുടെ അപ്പുറത്തുള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: εἰς τὸν τόπον
  choice: സ്ഥലത്തേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിലെ ദിശാവിഭക്തിയിലൂടെ നൽകുന്നു.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: യോഹന്നാൻ ആദ്യം സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്ന
  rationale: ἦν ... βαπτίζων എന്ന ഘടന മുൻകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കഴിപ്പിച്ചുകൊണ്ടിരുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി; τὸ πρῶτον ‘ആദ്യം’ എന്നു നിലനിർത്തി.
- source_word: ἔμεινεν
  choice: താമസിച്ചു
  rationale: ആ സ്ഥലത്ത് തുടർന്നു പാർത്തുവെന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκεῖ
  choice: അവിടെ
  rationale: സ്ഥലസൂചകമായ ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
