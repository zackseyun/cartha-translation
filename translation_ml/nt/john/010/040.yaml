  terminology: ‘യോർദ്ദാൻ,’ ‘യോഹന്നാൻ,’ and ‘സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്ന’ are appropriate and maintain the conventional biblical register without adding interpretation.
