translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്ന’ എന്ന രൂപം യോഹന്നാന്റെ മുൻകാലത്തെ തുടർച്ചയായ പ്രവർത്തനം നിലനിർത്തുന്നു; ‘മറുകര’ എന്നത് നദിയെ സംബന്ധിച്ച സ്ഥലബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
