id: JHN.10.25
reference: John 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു പറഞ്ഞെങ്കിലും നിങ്ങൾ വിശ്വസിക്കുന്നില്ല. എന്റെ പിതാവിന്റെ നാമത്തിൽ[a] ഞാൻ ചെയ്യുന്ന പ്രവൃത്തികൾതന്നെ എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ പിതാവിന്റെ അധികാരത്താൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഇവ എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ἀποκρίνομαι എന്നതിന്റെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: Εἶπον ὑμῖν καὶ οὐ πιστεύετε
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞിട്ടും നിങ്ങൾ വിശ്വസിക്കുന്നില്ല
  rationale: മുൻപ് പറഞ്ഞ കാര്യം സൂചിപ്പിക്കുന്ന aorist-ന്റെ ബലം നിലനിർത്തുന്നു; καί ഇവിടെ പ്രകടമാക്കുന്ന വൈരുധ്യം ‘പറഞ്ഞിട്ടും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കുന്നില്ല
  rationale: യോഹന്നാനിലെ πιστεύω എന്ന പദത്തിന്റെ വിശ്വാസം/സ്വീകരണം എന്ന അർഥവും സുവിശേഷത്തിലുടനീളമുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: യേശുവിന്റെ പ്രവർത്തനങ്ങളെയും അടയാളങ്ങളെയും സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗത്തിന് യോജിച്ച, പൊതുവായി ഗ്രഹിക്കാവുന്ന പദം.
- source_word: ἐν τῷ ὀνόματι
  choice: നാമത്തിൽ
  rationale: പ്രതിനിധിത്വം, അധികാരം, നിയോഗം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: ദൈവത്തോടുള്ള യേശുവിന്റെ ബന്ധപരമായ അഭിസംബോധന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: പ്രവൃത്തികൾതന്നെ എന്നെക്കുറിച്ചു സാക്ഷ്യം പറയുന്നു
  rationale: ταῦτα എന്നതിലെ ഊന്നൽ ‘തന്നെ’കൊണ്ട് പ്രകടമാക്കുകയും μαρτυρέω എന്നതിലെ സാക്ഷ്യത്തിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പ്രവൃത്തികളും പിതാവിന്റെ അധികാരവും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്റെ പിതാവിന്റെ നാമത്തിൽ’ എന്ന മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്റെ പിതാവിന്റെ അധികാരത്താൽ’
  rationale: വാക്യം ദൈവിക അധികാരവും പ്രതിനിധിത്വവും സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം അനുവദിക്കുന്ന അർഥവ്യാപ്തി ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘പ്രവൃത്തികൾ’, ‘നാമത്തിൽ’, ‘സാക്ഷ്യം പറയുന്നു’ എന്നീ പദങ്ങൾ യോഹന്നാനിലെ ആവർത്തിതമായ ആശയബന്ധം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ footnote markers അവയുടെ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്ത സ്ഥാനങ്ങളിലായിരുന്നു; മലയാളത്തിൽ [a] ‘നാമത്തിൽ’ എന്നതിനോടും [b] ‘സാക്ഷ്യം പറയുന്നു’ എന്നതിനോടും ചേർത്ത് അർഥപരമായി ശരിയായ സ്ഥാനങ്ങളിൽ നൽകിയിരിക്കുന്നു.
