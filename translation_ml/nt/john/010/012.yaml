id: JHN.10.12
reference: John 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: ml
  text: കൂലിക്കാരൻ ഇടയനല്ല; ആടുകൾ അവന്റേതുമല്ല. ചെന്നായ വരുന്നതു കാണുമ്പോൾ അവൻ ആടുകളെ വിട്ട് ഓടിപ്പോകുന്നു[a]—ചെന്നായ അവയെ പിടിച്ചെടുക്കുകയും ചിതറിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആടുകളെ ഉപേക്ഷിച്ച് ഓടിപ്പോകുന്നു.” ‘വിടുക’ എന്ന ക്രിയയ്ക്ക് അപകടസമയത്ത് കൈവിടുക എന്ന ശക്തമായ അർഥവും ഇവിടെ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: കൂലിക്കാരൻ
  rationale: കൂലിക്കുവേണ്ടി ജോലി ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപദം; ഇടയനുമായുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: οὐκ ὢν ποιμήν
  choice: ഇടയനല്ല
  rationale: പങ്കാളിക്രിയാരൂപത്തിന്റെ ആശയം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: ആടുകൾ അവന്റെ സ്വന്തവുമല്ല
  rationale: ആടുകൾ അവനുള്ളവയല്ലെന്ന ഉടമസ്ഥതയുടെയും വ്യക്തിപരമായ ബന്ധത്തിന്റെയും അഭാവം ἴδιαയ്ക്ക് അനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: θεωρεῖ
  choice: കാണുമ്പോൾ
  rationale: അടുത്തുവരുന്ന അപകടം തിരിച്ചറിയുന്നതിനെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τὸν λύκον ἐρχόμενον
  choice: ചെന്നായ വരുന്നതു
  rationale: വർത്തമാന പങ്കാളിക്രിയ നൽകുന്ന അടുത്തുവരുന്ന ചലനത്തിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: ἀφίησιν
  choice: വിട്ട്
  rationale: അടിസ്ഥാന അർഥമായ ‘വിടുക’ നിലനിർത്തുന്നു; അപകടസമയത്തെ ഉപേക്ഷിക്കൽ എന്ന ശക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: φεύγει
  choice: ഓടിപ്പോകുന്നു
  rationale: അപകടത്തിൽനിന്നുള്ള പലായനം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἁρπάζει
  choice: പിടിച്ചെടുക്കുന്നു
  rationale: ഇരയെ ബലമായി കൈവശപ്പെടുത്തുന്ന ചെന്നായയുടെ പ്രവൃത്തി വ്യക്തമാക്കുന്നു; വെറും ‘പിടിക്കുന്നു’ എന്നതിലധികം ശക്തി നൽകുന്നു.
- source_word: σκορπίζει
  choice: ചിതറിക്കുന്നു
  rationale: ആടുകളെ പല ദിശകളിലായി ചിതറിക്കുന്നതെന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: πρόβατα
  choice: ആടുകൾ
  rationale: കൂട്ടം എന്ന സംഗ്രഹപദത്തിനു പകരം ഗ്രീക്കിലെ ബഹുവചനവും ദൃശ്യരൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇടയരൂപകത്തിന്റെ വ്യാഖ്യാനപരമായ ശക്തി
  choice: ‘ഇടയൻ,’ ‘കൂലിക്കാരൻ,’ ‘ആടുകൾ,’ ‘ചെന്നായ’ എന്നീ മേച്ചിൽജീവിതവുമായി ബന്ധപ്പെട്ട പദങ്ങൾ അതേ രൂപകത്തിനുള്ളിൽ നിലനിർത്തി.
  alternative: ‘നേതാവ്,’ ‘പരിപാലകൻ,’ ‘ശത്രു’ തുടങ്ങിയ വ്യാഖ്യാനാത്മക പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: യോഹന്നാൻ 10-ലെ തുടർച്ചയായ ഇടയരൂപകം മൂലപാഠത്തിന്റെ അവിഭാജ്യഘടകമാണ്; അമൂർത്തമായ വ്യാഖ്യാനപദങ്ങൾ അതിന്റെ ദൃശ്യശക്തി കുറയ്ക്കുകയും പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; പ്രവർത്തനങ്ങളുടെ ക്രമവും രൂപകവും നിലനിർത്തി.
