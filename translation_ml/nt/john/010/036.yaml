id: JHN.10.36
reference: John 10:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: ml
  text: പിതാവ് വിശുദ്ധീകരിച്ച്[a] ലോകത്തിലേക്ക് അയച്ചവനെക്കുറിച്ച്, ‘ഞാൻ ദൈവപുത്രനാണ്’ എന്നു ഞാൻ പറഞ്ഞതുകൊണ്ട്, ‘നീ ദൈവദൂഷണം ചെയ്യുന്നു’ എന്ന് നിങ്ങൾ പറയുന്നുവോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശുദ്ധീകരിച്ച്” എന്നതിന് “പ്രതിഷ്ഠിച്ച്” എന്നോ “വേർതിരിച്ച്” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: വിശുദ്ധീകരിച്ച്
  rationale: ἁγιάζω എന്ന ക്രിയയുടെ വിശുദ്ധി, പ്രതിഷ്ഠ, വേർതിരിക്കൽ എന്നീ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു. പുത്രൻ മുമ്പ് അശുദ്ധനായിരുന്നു എന്ന ധ്വനി സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല; ദൗത്യത്തിനായി പ്രതിഷ്ഠിച്ചു/വേർതിരിച്ചു എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ച
  rationale: യോഹന്നാനിലെ ദൗത്യഭാഷയും ἀποστέλλω എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κόσμον
  choice: ലോകത്തിലേക്ക്
  rationale: κόσμος എന്നതിനുള്ള പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; സൃഷ്ടലോകത്തെയും മനുഷ്യലോകത്തെയും ഉൾക്കൊള്ളാവുന്ന യോഹന്നാനീയ അർത്ഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: Βλασφημεῖς
  choice: നീ ദൈവദൂഷണം പറയുന്നു
  rationale: നേരിട്ടുള്ള കുറ്റാരോപണമായി ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്; വർത്തമാനകാല ക്രിയയുടെ തുടർച്ചയായോ നിലവിലുള്ളതായോ ഉള്ള ബലം നിലനിർത്തുന്നു.
- source_word: Υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: മലയാളത്തിൽ സ്ഥാപിതവും സ്വാഭാവികവുമായ ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകരൂപം; പദസമുച്ചയത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: ὃν ὁ πατὴρ
  choice: പിതാവ് ... അയച്ചവനെക്കുറിച്ച്
  rationale: ഗ്രീക്ക് relative construction മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിക്കുന്നു; സൂചിപ്പിക്കപ്പെടുന്ന വ്യക്തിയെയും പിതാവിന്റെ പ്രവർത്തനങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι ... ὅτι
  choice: ‘...’ എന്ന് ... പറഞ്ഞതുകൊണ്ട്, ‘...’ എന്ന്
  rationale: ആദ്യ ὅτι കുറ്റാരോപണത്തിന്റെ ഉദ്ധരണിയും രണ്ടാമത്തേത് അതിന്റെ കാരണവും ഉള്ളടക്കവും സൂചിപ്പിക്കുന്നതായി മലയാളവാക്യഘടനയിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുത്രനെ സംബന്ധിച്ച ἡγίασεν എന്ന ക്രിയ
  choice: വിശുദ്ധീകരിച്ച്
  alternative: പ്രതിഷ്ഠിച്ച് / വേർതിരിച്ച്
  rationale: മൂലപദത്തിന്റെ വിശുദ്ധിയുമായുള്ള ബന്ധവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. ഇത് പുത്രന്റെ ധാർമ്മിക മെച്ചപ്പെടുത്തലിനെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ദൗത്യത്തിനായി പ്രതിഷ്ഠിക്കൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: Υἱὸς τοῦ θεοῦ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ബലം
  choice: ദൈവപുത്രൻ
  alternative: ദൈവത്തിന്റെ പുത്രൻ
  rationale: ദൈവദൂഷണാരോപണത്തിന്റെ തൽസന്ദർഭത്തിൽ ശീർഷകത്തിന്റെ ബലം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; പാഠത്തിനപ്പുറമുള്ള പിൽക്കാല സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ സങ്കീർണ്ണത മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിലാക്കിയെങ്കിലും ചോദ്യം, ഉദ്ധരണികൾ, കാരണബന്ധം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പരിഭാഷാപ്രശ്നമുള്ള വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
