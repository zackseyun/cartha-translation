id: JHN.10.19
reference: John 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: ml
  text: ഈ വാക്കുകൾ കാരണം യെഹൂദന്മാരുടെ ഇടയിൽ വീണ്ടും ഒരു ഭിന്നത ഉണ്ടായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യരുടെ ഇടയിൽ”; യോഹന്നാനിലെ ചില സന്ദർഭങ്ങളിൽ “യെഹൂദ നേതാക്കളുടെ ഇടയിൽ.” ഇവിടെ “യെഹൂദന്മാർ” എന്നത് ഗ്രീക്ക് പദപ്രയോഗത്തെ പ്രതിഫലിപ്പിക്കുന്നു. എന്നാൽ യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ പദം പലപ്പോഴും മുഴുവൻ യെഹൂദജനത്തെയല്ല, സന്ദർഭത്തിലെ ഒരു പ്രത്യേക വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: ഭിന്നത
  rationale: ജനങ്ങളുടെ പ്രതികരണം രണ്ടായി പിരിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: യോഹന്നാന്റെ വിവരണത്തിൽ മുമ്പും ഇത്തരമൊരു ഭിന്നത ഉണ്ടായിരുന്നുവെന്ന ആവർത്തനഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: ഉണ്ടായി
  rationale: ഒരു അവസ്ഥ നിലവിൽവന്നുവെന്ന സംഭവാത്മക അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: യെഹൂദന്മാരുടെ ഇടയിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; യോഹന്നാനിലെ സന്ദർഭാധിഷ്ഠിത അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ
  choice: നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന കാരണബന്ധം സംക്ഷിപ്തവും ഗൗരവപൂർണവുമായി നൽകുന്നു.
- source_word: τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: യേശു മുമ്പ് പറഞ്ഞ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
theological_decisions:
- issue: യോഹന്നാനിൽ Ἰουδαῖοι എന്ന പദത്തിന്റെ സൂചിതവിഭാഗം
  choice: മുഖ്യവാക്യത്തിൽ “യെഹൂദന്മാർ” എന്നു നൽകി, സന്ദർഭത്തിൽ അത് യെഹൂദ്യരെയോ യെഹൂദനേതാക്കളെയോ സൂചിപ്പിക്കാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: “യെഹൂദ്യർ” അല്ലെങ്കിൽ “യെഹൂദനേതാക്കൾ”
  rationale: മൂലപാഠത്തിന്റെ ഭാഷ മുഖ്യവാക്യത്തിൽ നിലനിർത്തിക്കൊണ്ട്, മുഴുവൻ യെഹൂദജനത്തെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സന്ദർഭപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. “ഭിന്നതയുണ്ടായി” എന്ന പ്രയോഗം വിഭജിത പ്രതികരണത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; [a] എന്ന അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
