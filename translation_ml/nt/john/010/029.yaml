id: JHN.10.29
reference: John 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: ml
  text: എന്റെ പിതാവ്[a], അവരെ എനിക്കു തന്നിരിക്കുന്നവൻ, സകലത്തിലും വലിയവനാണ്; പിതാവിന്റെ കൈയിൽനിന്ന് അവരെ പിടിച്ചുപറിക്കാൻ ആർക്കും കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പദാനുപദമായി: ‘എന്റെ പിതാവ് എനിക്കു തന്നിരിക്കുന്നത് സകലത്തിലും വലുതാണ്.’ ഇവിടത്തെ ഗ്രീക്ക് വാചകഘടന ദുഷ്കരമാണ്; ചിലർ താരതമ്യത്തിന്റെ കർത്താവായി നൽകിയ വ്യക്തികളെയല്ല, നൽകിയിരിക്കുന്ന സമ്മാനത്തെയാണ് മനസ്സിലാക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: എന്റെ പിതാവ്
  rationale: യേശുവും ദൈവവും തമ്മിലുള്ള പിതൃപുത്രബന്ധം വ്യാഖ്യാനവികാസമില്ലാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ δέδωκέν μοι
  choice: അവരെ എനിക്കു തന്നിരിക്കുന്നവൻ
  rationale: നപുംസക ഏകവചനത്തിലുള്ള ὃ വാചകഘടനാപരമായി ദുഷ്കരമാണെങ്കിലും, മുൻവാക്യങ്ങളിലെ ആടുകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. അതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘അവരെ’ വ്യക്തമാക്കുന്നു; δέδωκεν എന്ന പൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലം ‘തന്നിരിക്കുന്ന’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: πάντων μεῖζων
  choice: സകലത്തിലും വലിയവൻ
  rationale: താരതമ്യത്തിന്റെ പരിധി ആളുകളിലേക്കോ വസ്തുക്കളിലേക്കോ മാത്രം ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: οὐδεὶς δύναται
  choice: ആർക്കും കഴിയില്ല
  rationale: കഴിവില്ലായ്മയെ വ്യക്തമാക്കുന്ന δύναται എന്ന പദത്തിന്റെ അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἁρπάζειν
  choice: പിടിച്ചുപറിക്കാൻ
  rationale: ബലപ്രയോഗത്തിലൂടെ പെട്ടെന്ന് തട്ടിയെടുക്കുക എന്ന അർത്ഥവും 28-ാം വാക്യവുമായുള്ള പദബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: പിതാവിന്റെ കൈയിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ‘ഉള്ളിൽനിന്ന്/കൈയിൽനിന്ന്’ എന്ന ദിശാബോധവും സംരക്ഷണത്തിന്റെയും അധികാരത്തിന്റെയും കൈ-രൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὃ δέδωκέν μοι എന്നതിലെ പാഠവിമർശനപരവും വാക്യഘടനാപരവുമായ ദുഷ്കരത
  choice: സന്ദർഭത്തിലെ ആടുകളെ ഉദ്ദേശിച്ച് ‘അവരെ എനിക്കു തന്നിരിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: ‘എന്റെ പിതാവ് എനിക്കു തന്നിരിക്കുന്നത് സകലത്തിലും വലുതാണ്.’
  rationale: അച്ചടിച്ച ഗ്രീക്ക് പാഠത്തിലെ നപുംസക സർവനാമം കൂടുതൽ പദാനുപദമായി വിവർത്തനം ചെയ്യുമ്പോൾ സമ്മാനം തന്നെയാണ് താരതമ്യത്തിന്റെ കർത്താവെന്ന് മനസ്സിലാക്കാം. എന്നാൽ 27–28 വാക്യങ്ങളിലെ ആടുകളും അവരെ ആരും പിടിച്ചുപറിക്കുകയില്ല എന്ന ആശയവും പ്രധാന വാചകത്തിലെ വ്യക്തിസൂചനയെ പിന്തുണയ്ക്കുന്നു. യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: πάντων μεῖζων എന്ന താരതമ്യത്തിന്റെ പരിധി
  choice: ‘സകലത്തിലും വലിയവൻ’ എന്ന വിശാല പ്രയോഗം ഉപയോഗിക്കുന്നു.
  alternative: ‘എല്ലാവരിലും വലിയവൻ’ അല്ലെങ്കിൽ ‘എല്ലാറ്റിനെക്കാളും വലിയവൻ’.
  rationale: πάντων ആളുകളെയോ വസ്തുക്കളെയോ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ ഏതെങ്കിലും ഒരു പരിധി അടിച്ചേൽപ്പിക്കാതെ വാചകത്തിന്റെ സമഗ്രവും പരമവുമായ താരതമ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിടിച്ചുപറിക്കുക’ ബലപ്രയോഗത്തിന്റെ ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘സകലത്തിലും’ താരതമ്യത്തിന്റെ വിശാലത അമിതമായി നിർവചിക്കാതെ സൂക്ഷിക്കുന്നു.
