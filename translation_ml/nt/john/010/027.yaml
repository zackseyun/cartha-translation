id: JHN.10.27
reference: John 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ml
  text: എന്റെ ആടുകൾ എന്റെ ശബ്ദം കേൾക്കുന്നു; ഞാൻ അവയെ അറിയുന്നു; അവ എന്നെ അനുഗമിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: എന്റെ ആടുകൾ
  rationale: ഇടയൻ–ആടുകൾ എന്ന രൂപകത്തിൽ πρόβατα എന്നതിന് സ്വാഭാവികമായ മലയാളം ‘ആടുകൾ’ ആണ്. τὰ ἐμὰ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥത ‘എന്റെ’ എന്നു ലളിതമായി നിലനിർത്തുന്നു.
- source_word: τῆς φωνῆς μου
  choice: എന്റെ ശബ്ദം
  rationale: വ്യക്തിയെ തിരിച്ചറിയാൻ സഹായിക്കുന്ന ശബ്ദം എന്ന സന്ദർഭത്തിൽ φωνήയ്ക്ക് ‘ശബ്ദം’ സ്വാഭാവികമാണ്; ‘സ്വരം’ എന്നതിനെക്കാൾ വിശാലവും സാധാരണവുമായ പ്രയോഗമാണിത്.
- source_word: ἀκούουσιν
  choice: കേൾക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന പതിവായ, തുടരുന്ന പ്രവർത്തനം മലയാളത്തിലെ സാധാരണ വർത്തമാനരൂപം വ്യക്തമാക്കുന്നു. ‘ശ്രദ്ധിച്ചുകേൾക്കുന്നു’ എന്നു വികസിപ്പിക്കാതെ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: ഞാൻ അവയെ അറിയുന്നു
  rationale: γινώσκω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘അറിയുന്നു’ ബന്ധപരമായ ആഴത്തിന് ഇടം നൽകുന്നു; ‘വ്യക്തിപരമായി അറിയുന്നു’ എന്ന വ്യാഖ്യാനവികാസം ചേർക്കുന്നില്ല. ആടുകളെ സൂചിപ്പിക്കുന്ന നപുംസകസർവനാമത്തിന് മലയാളത്തിൽ ‘അവയെ’ സ്വാഭാവികമാണ്.
- source_word: ἀκολουθοῦσίν μοι
  choice: അവ എന്നെ അനുഗമിക്കുന്നു
  rationale: അനുഗമിക്കുക എന്നത് ἀκολουθέωയുടെ നേരിട്ടുള്ള അർഥവും ശിഷ്യത്വസന്ദർഭത്തിന് യോജിച്ച മാന്യമായ ആധുനിക പ്രയോഗവുമാണ്. വർത്തമാനരൂപം സ്വഭാവസവിശേഷമായ തുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇടയൻ–ആടുകൾ രൂപകത്തിലെ γινώσκωയുടെ ബന്ധപരമായ അർഥബലം
  choice: ‘അറിയുന്നു’ എന്നു വിപുലീകരണമില്ലാതെ പരിഭാഷപ്പെടുത്തി
  alternative: ‘വ്യക്തിപരമായി അറിയുന്നു’ അല്ലെങ്കിൽ ‘തിരിച്ചറിയുന്നു’
  rationale: ‘അറിയുന്നു’ എന്നത് യോഹന്നാനീയമായ ബന്ധപരമായ ആഴം സംരക്ഷിക്കുന്നു; അതേസമയം പ്രത്യേകമായ ഒരു ദൈവശാസ്ത്രവ്യാഖ്യാനം വാക്യത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല. ‘തിരിച്ചറിയുന്നു’ അർഥത്തെ ദുർബലമാക്കാം; ‘വ്യക്തിപരമായി’ എന്നത് വ്യാഖ്യാനപരമായ വികസനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്ന് സമാന്തര പ്രസ്താവനകളുടെ താളം അർദ്ധവിരാമങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
