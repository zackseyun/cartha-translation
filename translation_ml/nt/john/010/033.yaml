id: JHN.10.33
reference: John 10:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: ml
  text: 'യഹൂദന്മാർ അവനോടു മറുപടി പറഞ്ഞു: “ഒരു നല്ല പ്രവൃത്തി നിമിത്തമല്ല ഞങ്ങൾ നിന്നെ കല്ലെറിയുന്നത്; മറിച്ച് ദൈവദൂഷണം നിമിത്തവും, മനുഷ്യനായിരിക്കെ നീ നിന്നെത്തന്നെ ദൈവമാക്കുന്നതുകൊണ്ടുമാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ നിന്നെത്തന്നെ ഒരു ദൈവമാക്കുന്നു.” ഗ്രീക്കിലെ θεόν എന്ന പദത്തിന് നിശ്ചിത ഉപപദമില്ല; എന്നാൽ ദൈവദൂഷണക്കുറ്റം ഉന്നയിക്കുന്ന ഈ സന്ദർഭത്തിൽ “ദൈവം” എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: യഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ യോഹന്നാനീയ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ ദൈവാലയത്തിൽ യേശുവിനെ എതിർക്കുന്ന സംഘത്തെയാണ് ഉടൻ സൂചിപ്പിക്കുന്നതെങ്കിലും, ‘യഹൂദനേതാക്കൾ’ എന്നു പരിഭാഷപ്പെടുത്തി മൂലപദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: Περὶ καλοῦ ἔργου
  choice: ഒരു നല്ല പ്രവൃത്തി നിമിത്തം
  rationale: περί സഹിതമുള്ള ഷഷ്ഠിവിഭക്തി ഇവിടെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്നു; ഏകവചനമായ ἔργου-യും καλοῦ നൽകുന്ന ധാർമിക ഗുണവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λιθάζομέν
  choice: ഞങ്ങൾ നിന്നെ കല്ലെറിയുന്നത്
  rationale: വർത്തമാനകാല ക്രിയയുടെ തത്സമയ പ്രവർത്തനമോ ഉറച്ച ഉദ്ദേശ്യമോ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: βλασφημίας
  choice: ദൈവദൂഷണം
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തെ അപമാനിക്കുന്ന വാക്കോ അവകാശവാദമോ എന്ന അർഥം വ്യക്തമാക്കുന്ന പ്രചാരത്തിലുള്ള മലയാള പദമാണ്.
- source_word: ἄνθρωπος ὢν
  choice: മനുഷ്യനായിരിക്കെ
  rationale: പങ്കാളിക്രിയാ ഘടനയിലെ സാഹചര്യപരവും വിട്ടുവീഴ്ചാസൂചകവുമായ ഭാവം നിലനിർത്തി, കുറ്റാരോപകരുടെ മനുഷ്യൻ–ദൈവം വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: നീ നിന്നെത്തന്നെ ദൈവമാക്കുന്നു
  rationale: പ്രതിഫലന സർവനാമത്തോടും വിധേയപൂരകത്തോടുമുള്ള ποιέω എന്ന ഘടന ‘സ്വയം X ആക്കുക/അവകാശപ്പെടുക’ എന്നാണ്. ദൈവദൂഷണക്കുറ്റത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ദൈവം’ എന്നതാണ് സാധ്യതയേറിയ അർഥം; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ποιεῖς σεαυτὸν θεόν എന്ന കുറ്റാരോപണത്തിലെ θεόν-ന്റെ പരിഭാഷ
  choice: ദൈവം
  alternative: ഒരു ദൈവം
  rationale: θεόν നിർദേശക ഉപപദമില്ലാത്ത രൂപമാണെങ്കിലും, ദൈവദൂഷണക്കുറ്റവും യോഹന്നാന്റെ ഏകദൈവവിശ്വാസപരമായ സന്ദർഭവും പരിഗണിക്കുമ്പോൾ, ഇസ്രായേലിന്റെ ദൈവത്തിനുള്ള പദവി യേശു അവകാശപ്പെടുന്നു എന്നാണ് കുറ്റാരോപകർ മനസ്സിലാക്കിയതെന്ന ഭാവം ‘ദൈവം’ കൂടുതൽ നന്നായി നൽകുന്നു. വ്യാകരണപരമായി സാധ്യമായ ‘ഒരു ദൈവം’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ കുറ്റാരോപണഭാവവും ‘നല്ല പ്രവൃത്തി/ദൈവദൂഷണം’ എന്ന വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക ഭാഷ ഒഴിവാക്കിയിരിക്കുന്നു.
