id: JHN.16.20
reference: John 16:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: ml
  text: 'സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ കരയുകയും വിലപിക്കുകയും ചെയ്യും; എന്നാൽ ലോകം സന്തോഷിക്കും. നിങ്ങൾ ദുഃഖിതരാകും; എന്നാൽ നിങ്ങളുടെ ദുഃഖം സന്തോഷമായിത്തീരും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളുടെ ദുഃഖം സന്തോഷമായി മാറും.”
    reason: εἰς χαρὰν γενήσεται എന്നതിലെ അവസ്ഥാമാറ്റം മലയാളത്തിൽ കൂടുതൽ ചലനാത്മകമായി പ്രകടിപ്പിക്കുന്ന സാധുവായ പകരം പരിഭാഷ.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർണമായ ഉറപ്പിക്കൽസൂത്രത്തിലെ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളവായനക്കാർക്ക് അർഥം നേരിട്ട് ഗ്രഹിക്കാവുന്ന രൂപം ഉപയോഗിക്കുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള അഭിസംബോധനയും യോഹന്നാനിൽ ആവർത്തിച്ചു വരുന്ന പ്രയോഗവും അടുത്തായി നിലനിർത്തുന്നു.
- source_word: κλαύσετε
  choice: നിങ്ങൾ കരയും
  rationale: ദുഃഖത്തിന്റെ പ്രകടമായ കരച്ചിൽ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: θρηνήσετε
  choice: വിലപിക്കുകയും ചെയ്യും
  rationale: κλαύσετε എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തി, ദുഃഖം വാക്കുകളിലൂടെയോ ആചാരപരമായോ പ്രകടിപ്പിക്കുന്നതിന്റെ ഭാവം നൽകുന്നു.
- source_word: ὁ δὲ κόσμος
  choice: എന്നാൽ ലോകം
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം നിലനിർത്തുന്നു; κόσμος എന്ന യോഹന്നാനീയ പദത്തെ ‘അവിശ്വാസികളായ ലോകം’ എന്ന വ്യാഖ്യാനവികാസമില്ലാതെ വിശാലമായി വിടുന്നു.
- source_word: χαρήσεται
  choice: സന്തോഷിക്കും
  rationale: ശിഷ്യരുടെ ദുഃഖത്തോടുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുകയും തുടർന്ന് വരുന്ന χαράയുമായുള്ള പദബന്ധം ‘സന്തോഷം’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λυπηθήσεσθε
  choice: നിങ്ങൾ ദുഃഖിതരാകും
  rationale: ഭാവികാലത്തിലെ അവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും തുടർന്ന് വരുന്ന λύπηയുമായുള്ള അർഥബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ λύπη ὑμῶν
  choice: നിങ്ങളുടെ ദുഃഖം
  rationale: മുൻപുള്ള ‘ദുഃഖിതരാകും’ എന്ന പ്രയോഗവുമായി ഗ്രീക്കിലെ പദബന്ധം പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰς χαρὰν γενήσεται
  choice: സന്തോഷമായിത്തീരും
  rationale: εἰς സഹിതമുള്ള γενήσεται സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റം അടുത്തായി അവതരിപ്പിക്കുന്നു; അതിന്റെ ചലനാത്മകമായ മറ്റൊരു മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘ലോകം’ എന്ന് വ്യാഖ്യാനവികാസമില്ലാതെ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവിശ്വാസികളായ ലോകം’ അല്ലെങ്കിൽ ‘ദൈവവിരുദ്ധമായ ലോകക്രമം’
  rationale: യോഹന്നാനിൽ ഈ പദത്തിന് പലപ്പോഴും പ്രതികൂലമായ ധാർമിക ഭാവമുണ്ടെങ്കിലും, ഈ വാക്യം അതിനെ വിശദമായി നിർവചിക്കുന്നില്ല. അതിനാൽ ശിഷ്യരോടു വൈരുധ്യത്തിൽ സന്തോഷിക്കുന്ന കൂട്ടം എന്ന സൂചന നിലനിർത്തി, ദൈവശാസ്ത്രപരമായ സംഘർഷം മുഖ്യവാചകത്തിൽ പരിഹരിച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗൗരവപൂർണമായ ആവർത്തനവും കരയുക/വിലപിക്കുക, ദുഃഖിതരാകുക/ദുഃഖം എന്നീ ഗ്രീക്ക് പദബന്ധങ്ങളും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട അവസാന വാക്യഭാഗത്താണ് ചേർത്തിരിക്കുന്നത്.
