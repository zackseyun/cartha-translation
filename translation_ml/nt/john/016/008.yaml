source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: ml
  text: അവൻ[a] വരുമ്പോൾ[c], പാപത്തെക്കുറിച്ചും നീതിയെക്കുറിച്ചും[b] ന്യായവിധിയെക്കുറിച്ചും ലോകം തെറ്റിലാണെന്ന് ബോധ്യപ്പെടുത്തും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ ഒരുവൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ഊന്നലുള്ള നിർദേശസർവനാമമാണ് ഇത്, വരാനിരിക്കുന്ന സഹായിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ന്യായം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: c
    text: 'മറ്റൊരു രൂപം: ‘അവൻ വന്നശേഷം, ആ ഒരുവൻ…’.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθὼν
  choice: വരുമ്പോൾ
  rationale: കാലാർഥമുള്ള ഏറിസ്റ്റ് പങ്കാളിക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വന്നശേഷം’ എന്നതിലധികം കൃത്യമായി മുഖ്യക്രിയയോടുള്ള കാലബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: സമീപസന്ദർഭത്തിലെ കാര്യസ്ഥനെ സൂചിപ്പിക്കുന്ന ഊന്നലുള്ള നിർദേശസർവനാമമാണിത്. മലയാളത്തിലെ ‘അവൻ’ വ്യക്തിസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഗ്രീക്കിലെ പ്രത്യേക ഊന്നൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐλέγξει
  choice: ലോകം തെറ്റിലാണെന്ന് ബോധ്യപ്പെടുത്തും
  rationale: ഇവിടെ ക്രിയയ്ക്ക് തെറ്റ് വെളിപ്പെടുത്തുക, തെറ്റാണെന്ന് തെളിയിക്കുക, കുറ്റം ബോധ്യപ്പെടുത്തുക എന്നീ അർഥച്ചായകളുണ്ട്. ‘കുറ്റബോധം വരുത്തും’ എന്നത് ഉള്ളിലെ വികാരത്തിലേക്ക് അർഥം ചുരുക്കാം; തിരഞ്ഞെടുത്ത രൂപം ധാർമിക-ന്യായപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: κόσμον
  choice: ലോകം
  rationale: യോഹന്നാനിലെ വിശാലമായ ദൈവശാസ്ത്രപരമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ലോകത്തിലെ മനുഷ്യർ’ എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: περὶ
  choice: —യെക്കുറിച്ച്
  rationale: മൂന്നുതവണ ആവർത്തിക്കുന്ന ഗ്രീക്ക് ബന്ധപദത്തിന്റെ സമാന്തരഘടന മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ἁμαρτίας
  choice: പാപം
  rationale: ഏകവചനരൂപം നിലനിർത്തുന്ന സാധാരണവും വ്യക്തവുമായ തർജമ.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: മലയാളത്തിൽ ‘നീതി’ എന്നത് ശരിയായ നില/നീതിമത്തത്വം, ന്യായം എന്നീ അർഥവ്യാപ്തികൾ വഹിക്കുന്നു; തുടർന്നുള്ള വാക്യത്തിലെ ക്രിസ്തുസംബന്ധമായ വിശദീകരണം മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
- source_word: κρίσεως
  choice: ന്യായവിധി
  rationale: നിയമപരവും അന്തിമവിധിസംബന്ധവുമായ അർഥശക്തി സൂക്ഷിക്കുന്നു; ‘ശിക്ഷാവിധി’ എന്നു ഫലത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ἐκεῖνος എന്നതിന്റെ സൂചനയും ഊന്നലും
  choice: സന്ദർഭത്തിലെ കാര്യസ്ഥനെ സൂചിപ്പിക്കുന്ന ‘അവൻ’; ഗ്രീക്കിലെ ഊന്നൽ അടിക്കുറിപ്പിൽ
  alternative: ‘ആ ഒരുവൻ’
  rationale: ‘ആ ഒരുവൻ’ ഗ്രീക്കിന്റെ രൂപം കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിച്ചാലും ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികവും അനാവശ്യമായി നിഗൂഢവുമാകാം. ‘അവൻ’ സ്വാഭാവികമാണ്; ഉടൻമുമ്പുള്ള സന്ദർഭമാണ് സൂചിതനെ തിരിച്ചറിയിക്കുന്നത്.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ അർഥം
  choice: നീതി
  alternative: ന്യായം; നീതിമത്തത്വം
  rationale: ‘നീതി’ മലയാളത്തിൽ ആവശ്യമായ വിശാലതയും യോഹന്നാൻ 16:10-ലെ തുടർവിശദീകരണവുമായി ബന്ധപ്പെടാനുള്ള ഇടവും നിലനിർത്തുന്നു. ‘ന്യായം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐλέγξει എന്നതിന്റെ ധാർമിക-ന്യായപരമായ ശക്തി
  choice: ലോകം തെറ്റിലാണെന്ന് ബോധ്യപ്പെടുത്തും
  alternative: ലോകത്തെ കുറ്റം ബോധ്യപ്പെടുത്തും; ലോകത്തിന്റെ തെറ്റ് വെളിപ്പെടുത്തും
  rationale: ലോകത്തിന്റെ തെറ്റ് തെളിയിക്കലും ബോധ്യപ്പെടുത്തലും ഉൾക്കൊള്ളുന്നു; കേവലം മാനസിക കുറ്റബോധമെന്നോ അന്തിമ കുറ്റവിധിയെന്നോ അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്നു περὶ ഘടകങ്ങളുടെ സമാന്തരത ‘—യെക്കുറിച്ചും’ എന്ന ആവർത്തനത്തിലൂടെ സൂക്ഷിച്ചു. ‘ലോകം തെറ്റിലാണെന്ന് ബോധ്യപ്പെടുത്തും’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലക്രിയയുടെ വെളിപ്പെടുത്തൽ/തെളിയിക്കൽ/ബോധ്യപ്പെടുത്തൽ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
