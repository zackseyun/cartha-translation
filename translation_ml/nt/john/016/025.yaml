source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: ml
  text: “ഇക്കാര്യങ്ങൾ ഞാൻ നിങ്ങളോടു ആലങ്കാരിക ഭാഷയിൽ[a] സംസാരിച്ചിരിക്കുന്നു. ഞാൻ ഇനി ആലങ്കാരിക ഭാഷയിൽ നിങ്ങളോടു സംസാരിക്കാതെ, പിതാവിനെക്കുറിച്ച് വ്യക്തമായി നിങ്ങളോടു അറിയിക്കുന്ന ഒരു നാഴിക വരുന്നു[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉപമകളിലൂടെ” അല്ലെങ്കിൽ “മറയുള്ള വാക്കുകളിൽ”; ഇവിടെ ഗ്രീക്ക് പദം ആലങ്കാരികമോ പരോക്ഷമോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഒരു സമയം വരുന്നു.” യോഹന്നാൻ പലപ്പോഴും “നാഴിക” എന്ന പദം പ്രത്യേക ദൈവശാസ്ത്രപരമായ അർഥസൂചനയോടെ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: ആലങ്കാരിക ഭാഷയിൽ
  rationale: യോഹന്നാനിലെ പ്രയോഗത്തിൽ ഇത് ഉപമ എന്ന പ്രത്യേക സാഹിത്യരൂപത്തെക്കാൾ ആലങ്കാരികമോ പരോക്ഷമോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; ആവർത്തിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് രണ്ടു സ്ഥാനത്തും ഒരേ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: λελάληκα
  choice: സംസാരിച്ചിരിക്കുന്നു
  rationale: പൂർണകാലത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുകയും പിന്നീടുള്ള λαλήσω എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔρχεται ὥρα
  choice: ഒരു നാഴിക വരുന്നു
  rationale: അനാർത്ത്രസ് രൂപത്തിന് യോജിച്ച അനിശ്ചിതത്വവും യോഹന്നാനിലെ ‘നാഴിക’ എന്ന ദൈവശാസ്ത്രപരമായ അനുരണനവും സംരക്ഷിക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി … സംസാരിക്കാതെ
  rationale: ഭാവിയിലെ മാറ്റത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: λαλήσω
  choice: സംസാരിക്കുക
  rationale: λελάληκα എന്നതുമായുള്ള ക്രിയാപദ ഏകോപനം നിലനിർത്തുന്നു.
- source_word: παρρησίᾳ
  choice: തുറന്ന്
  rationale: ഇവിടെ ധൈര്യത്തെക്കാൾ പരോക്ഷഭാഷയ്ക്കു വിരുദ്ധമായ വ്യക്തവും മറയില്ലാത്തതുമായ സംസാരമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπαγγελῶ
  choice: പറയും
  rationale: പിതാവിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള വെളിപ്പെടുത്തലിനെ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തുറന്നുപറയും’ എന്ന സംയുക്തരൂപം സന്ദർഭത്തിലെ വൈരുധ്യം നന്നായി വഹിക്കുന്നു.
- source_word: περὶ τοῦ πατρὸς
  choice: പിതാവിനെക്കുറിച്ച്
  rationale: ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ ‘പിതാവ്’ എന്ന പദം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: യോഹന്നാനിലെ ὥρα എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഒരു നാഴിക വരുന്നു
  alternative: ഒരു സമയം വരുന്നു; ആ നാഴിക വരുന്നു
  rationale: ‘നാഴിക’ യോഹന്നാനിലെ പ്രത്യേക അനുരണനം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ നിർദ്ദേശകോപപദമില്ലാത്ത രൂപം കാരണം ‘ആ നാഴിക’ എന്നു അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- issue: ἐν παροιμίαις എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ παρρησίᾳയുടെ അർഥം
  choice: തുറന്ന്
  alternative: വ്യക്തമായി; മറയില്ലാതെ
  rationale: പൊതുസ്ഥലത്തെ ധൈര്യപ്രകടനമെന്ന ആശയം ചേർക്കാതെ, ആലങ്കാരികമോ പരോക്ഷമോ ആയ സംസാരത്തിനു പകരമുള്ള നേരിട്ടുള്ള വെളിപ്പെടുത്തൽ എന്ന വൈരുധ്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആലങ്കാരിക ഭാഷ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ‘ഉപമ’ എന്ന ചുരുങ്ങിയ സാങ്കേതിക അർഥം അനാവശ്യമായി ചുമത്താത്തതുമാണ്. παρρησίᾳയ്ക്കായി ‘തുറന്ന്’ എന്നത് ἀπαγγελῶയോടു ചേർത്ത് ‘തുറന്നുപറയുക’ എന്ന സ്വാഭാവിക പ്രയോഗമാക്കി.
