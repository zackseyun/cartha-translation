language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങൾക്കും ഇപ്പോൾ ദുഃഖമുണ്ട്. എന്നാൽ ഞാൻ നിങ്ങളെ വീണ്ടും കാണും[a]; നിങ്ങളുടെ ഹൃദയം ആനന്ദിക്കും. നിങ്ങളുടെ സന്തോഷം ആരും നിങ്ങളിൽനിന്ന് എടുത്തുകളയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ എന്നെ വീണ്ടും കാണും.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “ഞാൻ നിങ്ങളെ വീണ്ടും കാണും” എന്നാണ്; ശിഷ്യന്മാരുടെ അടുക്കലേക്കുള്ള യേശുവിന്റെ മടങ്ങിവരവിലെ മുൻകൈയ്ക്ക് ഇത് ഊന്നൽ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ പ്രസവവേദനയുടെയും തുടർന്ന് ഉണ്ടാകുന്ന സന്തോഷത്തിന്റെയും ഉപമ ഈ വാക്യത്തിൽ ശിഷ്യന്മാർക്ക് ബാധകമാക്കുന്നു. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ അനുമാനബന്ധവും താരതമ്യബന്ധവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: നിങ്ങൾക്കും ഇപ്പോൾ ദുഃഖമുണ്ട്
  rationale: λύπη സൂചിപ്പിക്കുന്ന ദുഃഖം നിലനിർത്തുന്നു. μέν-ന്റെ പ്രതീക്ഷാത്മക വൈരുധ്യം തുടർന്നുള്ള ‘എന്നാൽ’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: എന്നാൽ ഞാൻ നിങ്ങളെ വീണ്ടും കാണും
  rationale: δέ ഇപ്പോഴത്തെ ദുഃഖത്തോടുള്ള വൈരുധ്യവും πάλιν വീണ്ടും ഉണ്ടാകുന്ന കൂടിക്കാഴ്ചയും സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ഒന്നാംപുരുഷ കർത്താവിനെയും രണ്ടാംപുരുഷ കർമത്തെയും മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: നിങ്ങളുടെ ഹൃദയം ആനന്ദിക്കും
  rationale: ‘ഹൃദയം’ എന്ന ഏകവചന കൂട്ടായ പ്രയോഗവും χαίρω എന്ന ക്രിയയുടെ സജീവമായ ആനന്ദഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν χαρὰν ὑμῶν
  choice: നിങ്ങളുടെ സന്തോഷം
  rationale: χαράയുടെ സ്വാഭാവികവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ മലയാളരൂപം; മുൻപുള്ള ‘ആനന്ദിക്കും’ എന്നതുമായ ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: ആരും നിങ്ങളിൽനിന്ന് എടുത്തുകളയുകയില്ല
  rationale: αἴρω ἐκ/ἀπό ഘടനയിലെ നീക്കംചെയ്യൽ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്കിൽ വർത്തമാനകാലമാണെങ്കിലും വാക്യത്തിന്റെ ഭാവികാല ദിശ പരിഗണിച്ച് മലയാളത്തിൽ ഭാവികാലം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഭാവിയിലെ പുനഃസംഗമത്തിലെ കർത്താവും ഊന്നലും
  choice: ഞാൻ നിങ്ങളെ വീണ്ടും കാണും
  alternative: നിങ്ങൾ എന്നെ വീണ്ടും കാണും
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ὄψομαι എന്ന ഒന്നാംപുരുഷ ക്രിയയുടെ കർത്താവ് യേശുവും ὑμᾶς എന്നത് കർമവുമാണ്. സമീപവാക്യങ്ങളോടോ പരിചിതമായ വിവർത്തനരീതിയോടോ പൊരുത്തപ്പെടുത്താതെ ഈ രൂപം നിലനിർത്തുന്നത് യേശുവിന്റെ മുൻകൈ എന്ന സൂക്ഷ്മതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തെ വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; എന്നാൽ അതിലെ വൈരുധ്യവും കാരണക്രമവും നിലനിർത്തി. ‘ഹൃദയം’ എന്ന ബൈബിൾസംബന്ധിയായെങ്കിലും സാധാരണക്കാർക്ക് പരിചിതമായ രൂപകം അതേപടി സംരക്ഷിച്ചു.
