id: JHN.16.18
reference: John 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “അവൻ ‘അൽപസമയം’ എന്നു പറയുന്നതെന്താണ്? അവൻ എന്താണ് പറയുന്നതെന്ന് ഞങ്ങൾക്കറിയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുകയോ ആവർത്തിക്കുകയോ ചെയ്ത സംസാരത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ഒറ്റത്തവണ പറഞ്ഞുവെന്നതിലുപരി നീണ്ടുനിന്ന ആശയക്കുഴപ്പം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യങ്ങളിലെ യേശുവിന്റെ വാക്കുകളോടുള്ള ശിഷ്യന്മാരുടെ പ്രതികരണമാണ് ഇതെന്ന് വ്യക്തമാക്കുന്ന ബന്ധകപ്രയോഗം.
- source_word: Τί ἐστιν τοῦτο
  choice: ഇതെന്താണ്?
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ചോദ്യം വ്യാഖ്യാനിച്ച് തീർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ λέγει μικρόν
  choice: 『അല്പസമയം』 എന്ന് അവൻ പറയുന്ന
  rationale: μικρόν എന്ന ആശയക്കുഴപ്പമുണ്ടാക്കിയ പദപ്രയോഗത്തെ നേരിട്ടുള്ള ഉദ്ധരണിയായി മുൻനിർത്തുകയും ὃ λέγει എന്ന ബന്ധവാക്യത്തിന്റെ രൂപം പരമാവധി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: μικρόν
  choice: അല്പസമയം
  rationale: ഈ യോഹന്നാനീയ സന്ദർഭത്തിൽ ചെറിയൊരു സമയദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗം.
- source_word: οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്കറിയില്ല
  rationale: οἶδα എന്ന ക്രിയയുടെ വർത്തമാനാർഥവും നിഷേധവും നേരിട്ട്, സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τί λαλεῖ
  choice: അവൻ എന്താണ് പറയുന്നതെന്ന്
  rationale: λαλεῖ എന്ന സംസാരക്രിയയെ ‘അർഥമാക്കുന്നു’ എന്ന് വ്യാഖ്യാനിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മുൻപത്തെ λέγει-യുമായുള്ള ആവർത്തനവും മൂലപാഠത്തെപ്പോലെ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ശിഷ്യന്മാരുടെ ആശയക്കുഴപ്പം പ്രകടമാക്കുന്ന നേരിട്ടുള്ള ചോദ്യരൂപവും മൂലത്തിലെ ‘പറയുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിച്ചിട്ടുണ്ട്.
