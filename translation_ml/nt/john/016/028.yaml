source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: ml
  text: ഞാൻ പിതാവിൽനിന്നു പുറപ്പെട്ടു[a] ലോകത്തിലേക്കു വന്നിരിക്കുന്നു. വീണ്ടും, ഞാൻ ലോകം വിട്ട് പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ പിതാവിൽനിന്നു വന്നു.’
    reason: ἐξῆλθον ἐκ എന്ന പ്രയോഗം ഉറവിടത്തിൽനിന്നുള്ള പുറപ്പെടലായി കൂടുതൽ സാക്ഷാൽകരിച്ചോ, ലളിതമായി ‘വന്നു’ എന്നോ പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: പിതാവിൽനിന്നു പുറപ്പെട്ട്
  rationale: ἐξέρχομαι എന്ന ക്രിയയും ἐκ എന്ന ഉപസർഗവും ചേർന്നു സൂചിപ്പിക്കുന്ന ഉറവിടത്തിൽനിന്നുള്ള പുറപ്പെടൽ നിലനിർത്തുന്നു; അതേസമയം മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു വന്നിരിക്കുന്നു
  rationale: Perfect രൂപത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ പ്രസക്തിയും ‘വന്നിരിക്കുന്നു’ പ്രകടിപ്പിക്കുന്നു; εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ഗതി ‘ലോകത്തിലേക്ക്’ നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആദ്യ ഗതിക്കു പിന്നാലെയുള്ള മടക്കഗതിയെയും സംഭവക്രമത്തിലെ അടുത്ത നീക്കത്തെയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀφίημι τὸν κόσμον
  choice: ലോകം വിട്ട്
  rationale: സമീപഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന വിടൽ മലയാളത്തിലെ സ്വാഭാവികമായ ക്രിയാശൃംഖലയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നു
  rationale: πρός സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ദിശ ‘അടുക്കലേക്ക്’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശു ‘പിതാവിൽനിന്നു പുറപ്പെട്ടു’ എന്ന പ്രസ്താവനയുടെ അർഥവ്യാപ്തി
  choice: പിതാവിൽനിന്നുള്ള ഉറവിടവും അവിടേക്കുള്ള മടക്കവും നേരിട്ട് നിലനിർത്തി.
  alternative: ഇത് ‘ദൈവത്തിൽനിന്നു വന്നു’ എന്നു ദുർബലപ്പെടുത്തുകയോ, മുൻഅസ്തിത്വത്തെയും അവതാരത്തെയും കുറിച്ചുള്ള വിശദമായ സിദ്ധാന്തഭാഷ ചേർക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം പിതാവിൽനിന്നുള്ള പുറപ്പെടലും പിതാവിലേക്കുള്ള മടക്കവും ഉറപ്പിക്കുന്നു. ഈ ഉയർന്ന ക്രിസ്തുശാസ്ത്രപരമായ അവകാശവാദം നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്ക് വാചകത്തിനപ്പുറം സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘പിതാവിന്റെ അടുക്കലേക്ക്’ എന്നത് വ്യക്തിയിലേക്കുള്ള ഗതി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗം ഒഴിവാക്കി.
