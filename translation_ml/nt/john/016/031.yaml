  text: Jesus answered them[a], “Do you now believe?”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “നിങ്ങൾ ഇപ്പോൾ വിശ്വസിക്കുന്നുവോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ഇപ്പോൾ വിശ്വസിക്കുന്നു.” ഗ്രീക്ക് വാക്യം ഒരു പ്രസ്താവനയായും വായിക്കാം; എങ്കിലും സന്ദർഭം ആലങ്കാരിക ചോദ്യമായ വായനയ്ക്കാണ് കൂടുതൽ അനുകൂലമായത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ആഖ്യാനക്രിയയ്ക്ക് സ്വാഭാവികവും അർത്ഥവിശ്വസ്തവുമായ മലയാളപ്രയോഗം.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: യേശുവിന്റെ മറുപടി ആരോടാണെന്നു സൂചിപ്പിക്കുന്ന ദത്തിവ്യാകരണത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥിരപ്പെട്ടിരിക്കുന്ന പേരുരൂപം.
- source_word: Ἄρτι
  choice: ഇപ്പോൾ
  rationale: വർത്തമാനക്ഷണത്തെ ഊന്നുന്ന ἄρτι എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കുന്നുവോ
  rationale: πιστεύω എന്ന ക്രിയയുടെ വർത്തമാനകാല, രണ്ടാംപുരുഷ ബഹുവചനരൂപവും ചോദ്യഭാവവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἄρτι πιστεύετε എന്നതിന്റെ ചോദ്യമോ പ്രസ്താവനയോ എന്ന അനിശ്ചിതത്വം
  choice: “നിങ്ങൾ ഇപ്പോൾ വിശ്വസിക്കുന്നുവോ?” എന്ന അലങ്കാരചോദ്യമായി മുഖ്യവാചകത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: “നിങ്ങൾ ഇപ്പോൾ വിശ്വസിക്കുന്നു.”
  rationale: ഗ്രീക്ക് വാക്യത്തിന് വിരാമചിഹ്നം ആശ്രയിച്ച് ചോദ്യമായോ പ്രസ്താവനയായോ വായിക്കാം. അടുത്ത വാക്യത്തിലെ ശിഷ്യന്മാർ ചിതറിപ്പോകുമെന്ന പ്രസ്താവന ചോദ്യവായനയെ കൂടുതൽ അനുകൂലിക്കുന്നു; എങ്കിലും മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. യഥാർഥ ഗ്രീക്ക് അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
