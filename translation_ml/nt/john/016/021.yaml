id: JHN.16.21
reference: John 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: ml
  text: ഒരു സ്ത്രീ പ്രസവിക്കുമ്പോൾ, അവളുടെ സമയം വന്നതിനാൽ അവൾക്കു ദുഃഖമുണ്ട്; എന്നാൽ കുഞ്ഞിനെ പ്രസവിച്ചുകഴിഞ്ഞാൽ, ഒരു മനുഷ്യജീവി ലോകത്തിലേക്കു ജനിച്ചിരിക്കുന്നു എന്ന സന്തോഷം നിമിത്തം അവൾ ആ കഷ്ടത പിന്നെ ഓർക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: പ്രസവത്തെക്കുറിച്ചുള്ള പൊതുവായ ഈ ദൃഷ്ടാന്തത്തിൽ ‘ഭാര്യ’ എന്നതിനെക്കാൾ ‘സ്ത്രീ’യാണ് നേരായ അർഥം.
- source_word: ὅταν τίκτῃ
  choice: പ്രസവിക്കുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള വർത്തമാനകാല ക്രിയാരൂപം പൊതുവായി സംഭവിക്കുന്ന, നടന്നുകൊണ്ടിരിക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പ്രസവിക്കുമ്പോൾ’ സ്വാഭാവികമായി അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: λύπην ἔχει
  choice: ദുഃഖമുണ്ട്
  rationale: λύπη ശാരീരിക വേദനയിൽ മാത്രം ഒതുങ്ങാതെ ദുഃഖവും മനോവ്യഥയും സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള സന്തോഷത്തോടുള്ള വൈരുധ്യവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: ἡ ὥρα αὐτῆς
  choice: അവളുടെ സമയം
  rationale: മലയാളത്തിൽ ‘അവളുടെ സമയം’ പ്രസവത്തിനുള്ള നിർണിത സമയം എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും യോഹന്നാനിലെ ὥρα എന്ന പദത്തിന്റെ ആശയഭാരം ഒരു പരിധിവരെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γεννήσῃ τὸ παιδίον
  choice: കുഞ്ഞിനെ പ്രസവിച്ചുകഴിഞ്ഞാൽ
  rationale: പൂർത്തിയായ പ്രസവസംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist രൂപത്തിന്റെ ഭാവം ‘പ്രസവിച്ചുകഴിഞ്ഞാൽ’ വ്യക്തമാക്കുന്നു; παιδίον ഇവിടെ ‘കുഞ്ഞ്’ എന്നാണ്.
- source_word: οὐκέτι μνημονεύει
  choice: പിന്നെ ഓർക്കുന്നില്ല
  rationale: മുമ്പുണ്ടായ കഷ്ടത ഇനി മനസ്സിൽ വെച്ചുകൊണ്ടിരിക്കാത്തതിനെ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς θλίψεως
  choice: ആ കഷ്ടത
  rationale: പ്രസവത്തിന്റെ കഠിനാനുഭവവും വ്യഥയും ഉൾക്കൊള്ളുന്ന θλῖψις എന്ന പദത്തിന് ‘കഷ്ടത’ സ്വാഭാവികമാണ്; സാങ്കേതിക അന്ത്യകാല അർഥം അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: διὰ τὴν χαράν
  choice: സന്തോഷം നിമിത്തം
  rationale: accusative-നോടുകൂടിയ διά കാരണത്തെ സൂചിപ്പിക്കുന്നു; ‘നിമിത്തം’ ഗൗരവമുള്ളതും വ്യക്തവുമായ കാരണപ്രയോഗമാണ്.
- source_word: ὅτι ἐγεννήθη
  choice: ജനിച്ചിരിക്കുന്നതിന്റെ
  rationale: സന്തോഷത്തിന്റെ കാരണമോ ഉള്ളടക്കമോ വ്യക്തമാക്കുന്ന ὅτι-വാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ജനനം പൂർത്തിയായ സംഭവമാണെന്ന ഭാവവും നിലനിൽക്കുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ἄνθρωπος എന്ന പദത്തിന്റെ നേരായ രൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് പുരുഷശിശുവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതല്ല, പൊതുവായി ഒരു മനുഷ്യജീവിയെ സൂചിപ്പിക്കുന്നതാണ്, അതിനാൽ വിശദീകരണ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു
  rationale: കുഞ്ഞ് ജനിച്ചു പ്രവേശിക്കുന്ന ലോകത്തെയാണ് ഇവിടെ κόσμος സൂചിപ്പിക്കുന്നത്; ലളിതമായ നേരിട്ടുള്ള പരിഭാഷയാണ്.
theological_decisions:
- issue: ἄνθρωπος എന്ന പദത്തിന്റെ പൊതുവായ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ഒരു മനുഷ്യൻ’, അടിക്കുറിപ്പിൽ ലിംഗനിരപേക്ഷമായ അർഥവ്യക്തീകരണം
  alternative: ‘ഒരു മനുഷ്യജീവി’ അല്ലെങ്കിൽ സന്ദർഭാനുസൃതമായി ‘ഒരു കുഞ്ഞ്’
  rationale: ഗ്രീക്ക് നാമം വ്യാകരണപരമായി പുല്ലിംഗമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ അർഥപരമായി പൊതുവായതാണ്. ‘ഒരു മനുഷ്യൻ’ മൂലപദത്തിന്റെ രൂപത്തോടും യോഹന്നാന്റെ ശ്രദ്ധേയമായ പ്രയോഗത്തോടും അടുത്തുനിൽക്കുന്നു; അടിക്കുറിപ്പ് അതിനെ പുരുഷശിശുവായി മാത്രം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വചനത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ആദ്യവാക്യത്തിലെ നീണ്ട ഘടന വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു. ‘അവളുടെ സമയം’ എന്ന പ്രയോഗം മൂലത്തിലെ യോഹന്നാനീയ പ്രതിധ്വനി പൂർണമായി ഇല്ലാതാക്കാതെ സ്വാഭാവികമാക്കി.
