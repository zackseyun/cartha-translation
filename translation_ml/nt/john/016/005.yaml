id: JHN.16.5
reference: John 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ ഞാൻ എന്നെ അയച്ചവന്റെ അടുക്കലേക്ക് പോകുന്നു, നിങ്ങളിൽ ആരും എന്നോട്, ‘നീ എവിടേക്കാണ് പോകുന്നത്?’ എന്നു ചോദിക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന ആശയവ്യത്യാസവും νῦν എന്ന കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπάγω
  choice: പോകുന്നു
  rationale: യോഹന്നാനിലെ സന്ദർഭത്തിൽ ലക്ഷ്യത്തിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലപ്രയോഗം; ‘പോകുന്നു’ മലയാളത്തിൽ സ്വാഭാവികവും അധികവ്യാഖ്യാനം ചേർക്കാത്തതുമാണ്.
- source_word: πρὸς τὸν πέμψαντά με
  choice: എന്നെ അയച്ചവന്റെ അടുക്കലേക്ക്
  rationale: ഗ്രീക്കിലെ വ്യക്തിപരമായ articular participle നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇവിടെ വ്യക്തമാക്കാത്ത ‘പിതാവ്’ എന്ന തിരിച്ചറിയൽ വിവർത്തനത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: πέμψαντά
  choice: അയച്ച
  rationale: πέμπω എന്ന ക്രിയയുടെ ദൗത്യസന്ദർഭത്തിലുള്ള നേരിട്ടും പതിവുമായ മലയാളസമം; ‘നിയോഗിച്ച’ എന്നത് ഇവിടെ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആരും
  rationale: ഭാഗികബന്ധവും ശക്തമായ നിഷേധവും സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐρωτᾷ με
  choice: എന്നോട് ... ചോദിക്കുന്നില്ല
  rationale: ഇവിടെ ἐρωτάω ഒരു ചോദ്യം ചോദിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കനുസരിച്ച് ഉദ്ധരണിക്കു ചുറ്റും ക്രിയ വിന്യസിച്ചു.
- source_word: Ποῦ ὑπάγεις;
  choice: നീ എവിടേക്കാണ് പോകുന്നത്?
  rationale: ദിശാസൂചനയും നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ തിരിച്ചറിയൽ
  choice: ‘എന്നെ അയച്ചവന്റെ അടുക്കലേക്ക്’ എന്ന് പൊതുവായിത്തന്നെ വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘എന്നെ അയച്ച പിതാവിന്റെ അടുക്കലേക്ക്’
  rationale: യോഹന്നാന്റെ വിശാലസന്ദർഭത്തിൽ സൂചിതനായിരിക്കുന്നത് പിതാവാണെങ്കിലും, ഈ ഗ്രീക്ക് വാക്യത്തിൽ ‘പിതാവ്’ എന്നു വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ ഉറവിടത്തിലെ രൂപം സംരക്ഷിച്ച് ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘അടുക്കലേക്ക്’ വ്യക്തിയിലേക്കുള്ള ഗതിയെ ദിഗ്നിഫൈഡ് രീതിയിൽ വ്യക്തമാക്കുന്നു; വാക്യം ordinary readers-ന് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വിഭജിച്ചിരിക്കുന്നു.
