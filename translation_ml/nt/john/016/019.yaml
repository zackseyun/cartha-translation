id: JHN.16.19
reference: John 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: ml
  text: 'യേശു, അവർ തന്നോടു ചോദിക്കാൻ ആഗ്രഹിക്കുന്നുവെന്ന് അറിഞ്ഞു, അവരോടു പറഞ്ഞു: “’അൽപസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണുകയില്ല; പിന്നെയും അൽപസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും’ എന്നു ഞാൻ പറഞ്ഞതിനെക്കുറിച്ച് നിങ്ങൾ തമ്മിൽ ചർച്ച ചെയ്യുകയാണോ?[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ പറഞ്ഞതുകൊണ്ടാണോ.” ഗ്രീക്കിലെ ബന്ധപദം ചർച്ചയുടെ ഉള്ളടക്കത്തെയോ അതിന്റെ കാരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'ഇവിടെ “കാണുക” എന്നതിന് ഗ്രീക്കിൽ രണ്ടു വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: ആദ്യം θεωρέω (“നോക്കിക്കാണുക/നിരീക്ഷിക്കുക”), പിന്നീട് ὁράω (“കാണുക”). സന്ദർഭത്തിലെ സമാന്തരത നിലനിർത്താൻ മലയാളത്തിൽ രണ്ടും “കാണുക” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: അറിഞ്ഞ്
  rationale: യേശു ശിഷ്യന്മാരുടെ ഉദ്ദേശ്യം മനസ്സിലാക്കിയെന്ന അർഥം സ്വാഭാവികവും നേരിട്ടുമായി നൽകുന്നു.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: അവർ തന്നോടു ചോദിക്കാൻ ആഗ്രഹിക്കുന്നുവെന്ന്
  rationale: തുടർന്നുനിന്ന ആഗ്രഹത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ἐρωτάω എന്നത് ഇവിടെ എതിർപ്പോടെയുള്ള ചോദ്യംചെയ്യൽ അല്ല, മറിച്ച് ചോദിച്ചറിയലാണ്.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: ഇതിനെക്കുറിച്ചാണോ നിങ്ങൾ തമ്മിൽ അന്വേഷിക്കുന്നത്
  rationale: ζητέωയുടെ അടിസ്ഥാനമായ അന്വേഷിക്കൽ എന്ന ആശയവും, ശിഷ്യന്മാർ പരസ്പരം അർഥം കണ്ടെത്താൻ ശ്രമിക്കുന്ന സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: Μικρὸν
  choice: അല്പസമയം കഴിഞ്ഞാൽ
  rationale: ഇവിടെ കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐ θεωρεῖτέ με
  choice: നിങ്ങൾ ഇനി എന്നെ കാണുകയില്ല
  rationale: മുൻപിലുള്ള സമയസൂചനയോടൊപ്പം, ഉടൻ സംഭവിക്കാനിരിക്കുന്ന കാണാതാകലിനെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: പിന്നെയും അല്പസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും
  rationale: ക്രമവും ആവർത്തിച്ചുള്ള ദർശനവും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὅτι εἶπον എന്നതിലെ ὅτιയുടെ ബന്ധം
  choice: ‘എന്നു ഞാൻ പറഞ്ഞതിനെക്കുറിച്ചാണോ’ എന്ന ഉള്ളടക്കസംബന്ധിയായ വായന
  alternative: ‘ഞാൻ പറഞ്ഞതുകൊണ്ടാണോ’ എന്ന കാരണസംബന്ധിയായ വായന
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണി ശിഷ്യന്മാരുടെ അന്വേഷണവിഷയം എന്താണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ ഉള്ളടക്കവായന മുഖ്യപാഠത്തിൽ സ്വാഭാവികമാണ്; ഗ്രീക്ക് അനുവദിക്കുന്ന കാരണവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: θεωρέω, ὁράω എന്നീ രണ്ടു ‘കാണുക’ ക്രിയകളുടെ വ്യത്യാസം
  choice: മുഖ്യപാഠത്തിൽ രണ്ടിനും ‘കാണുക’ ഉപയോഗിക്കുക
  alternative: ആദ്യത്തേതിനെ ‘നിരീക്ഷിക്കുക/കണ്ടുകൊണ്ടിരിക്കുക’ എന്നും രണ്ടാമത്തേതിനെ ‘കാണുക’ എന്നും വേർതിരിക്കുക
  rationale: ഈ സന്ദർഭത്തിലെ ഊന്നൽ താൽക്കാലിക അഭാവത്തിലും വീണ്ടും കാണുന്നതിലുമാണ്. കൃത്രിമമായ പദവ്യത്യാസം സൃഷ്ടിക്കാതെ സമാന്തരത നിലനിർത്തുന്നു; മൂലപദവ്യത്യാസം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ζητεῖτε എന്ന ചോദ്യത്തിന്റെ ഭാവം
  choice: ‘അന്വേഷിക്കുകയാണോ?’ എന്ന യഥാർഥ ചോദ്യം
  alternative: ‘നിങ്ങൾ തമ്മിൽ ഇതിനെക്കുറിച്ചു സംസാരിക്കുകയാണ്’ എന്ന പ്രസ്താവന
  rationale: ഗ്രീക്കിലെ ചോദ്യംരൂപവും ശിഷ്യന്മാരുടെ സ്വകാര്യ അന്വേഷണത്തെ വെളിപ്പെടുത്തുന്ന യേശുവിന്റെ ഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘അല്പസമയം കഴിഞ്ഞാൽ’ എന്ന പ്രയോഗം ആവർത്തിച്ച് മൂലത്തിലെ സമാന്തരഘടന നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദങ്ങൾ ഒഴിവാക്കി.
