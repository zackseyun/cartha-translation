  to: 'യേശു, അവർ തന്നോടു ചോദിക്കാൻ ആഗ്രഹിക്കുന്നുവെന്ന് അറിഞ്ഞു, അവരോടു പറഞ്ഞു: “’അൽപസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണുകയില്ല; പിന്നെയും അൽപസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും’ എന്നു ഞാൻ പറഞ്ഞതിനെക്കുറിച്ച് നിങ്ങൾ തമ്മിൽ ചർച്ച ചെയ്യുകയാണോ?[a][b]”'
  rationale: The revision preserves the content reading of ὅτι εἶπον and the temporal force of the paired clauses, while replacing a less idiomatic expression for the disciples’ mutual deliberation with natural modern Malayalam. Footnote anchors are retained and placed at the end of the question, where both notes apply to the quoted saying and its framing.
