id: JHN.16.23
reference: John 16:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: ml
  text: 'ആ ദിവസം നിങ്ങൾ എന്നോട് ഒന്നും ചോദിക്കുകയില്ല[a]. സത്യം, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ പിതാവിനോട് എന്റെ നാമത്തിൽ എന്തു യാചിച്ചാലും[b], അവിടുന്ന് അതു നിങ്ങൾക്കു തരും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്യത്തിൽ ‘ചോദിക്കുക’ എന്നതിന് രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയകളുണ്ട്: ആദ്യം യേശുവിനോടു ചോദിക്കുകയോ അന്വേഷിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ἐρωτάω; പിന്നെ പിതാവിനോടു അപേക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന αἰτέω.'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ‘എന്റെ നാമത്തിൽ’ എന്ന പ്രയോഗം ‘തരും’ എന്ന ക്രിയയ്ക്കു ശേഷമാണുള്ളത്. അതിനാൽ ഇതിനെ: ‘നിങ്ങൾ പിതാവിനോട് എന്തു യാചിച്ചാലും, അവിടുന്ന് എന്റെ നാമത്തിൽ അതു നിങ്ങൾക്കു തരും’ എന്നും വ്യാകരണപരമായി ബന്ധിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസത്തിൽ
  rationale: യോഹന്നാനിലെ കാലസൂചനയും അതിനുള്ള വിശാലമായ ധ്വനിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: നിങ്ങൾ എന്നോട് ഒന്നും ചോദിക്കുകയില്ല
  rationale: ἐμέ എന്ന നേരിട്ടുള്ള കർമം വ്യക്തമാക്കുകയും οὐδέν എന്ന സമ്പൂർണ നിഷേധം നിലനിർത്തുകയും ചെയ്യുന്നു; ‘ചോദ്യം ചെയ്യുകയില്ല’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് സന്ദർഭത്തെ അതിയായി വ്യാഖ്യാനിച്ചേക്കാം.
- source_word: ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യോഹന്നാന്റെ സവിശേഷമായ ഊന്നൽനൽകുന്ന ആവർത്തനം സംരക്ഷിച്ചുകൊണ്ട് സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഭാഷ നൽകുന്നു.
- source_word: ἄν τι αἰτήσητε
  choice: എന്തു യാചിച്ചാലും
  rationale: അനിശ്ചിതവും തുറന്നതുമായ അപേക്ഷയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αἰτήσητε
  choice: യാചിച്ചാലും
  rationale: ആദ്യഭാഗത്തെ ἐρωτάω എന്ന ‘ചോദിക്കുക’ എന്ന ക്രിയയിൽനിന്ന് വ്യത്യസ്തമായി, പിതാവിനോടുള്ള അപേക്ഷയുടെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനോട്
  rationale: മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘എന്റെ’ എന്ന ഉടമസ്ഥപദം ചേർക്കാതെ നിർദ്ദിഷ്ടമായ ‘പിതാവ്’ എന്ന പരാമർശം നിലനിർത്തുന്നു.
- source_word: δώσει ὑμῖν
  choice: അവിടുന്ന് അതു നിങ്ങൾക്കു തരും
  rationale: മലയാളവാക്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി അപേക്ഷിച്ച കാര്യത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ ചേർക്കുന്നു; ആദരസൂചകമായ ഏകവചന സർവനാമം ആധുനിക സഭാഭാഷയിൽ സ്വാഭാവികമാണ്.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യോഹന്നാനിലെ പ്രധാനപ്പെട്ട പ്രയോഗം അധിക വ്യാഖ്യാനം കൂടാതെ ഔപചാരികമായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനോടു ചോദിക്കുന്നതും (ἐρωτάω) പിതാവിനോടു യാചിക്കുന്നതും (αἰτέω) തമ്മിലുള്ള ക്രിയാഭേദം
  choice: ആദ്യത്തേത് ‘ചോദിക്കുക’ എന്നും രണ്ടാമത്തേത് ‘യാചിക്കുക’ എന്നും വേർതിരിച്ചു.
  alternative: രണ്ടും ‘ചോദിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി വ്യത്യാസം അടിക്കുറിപ്പിൽ മാത്രം രേഖപ്പെടുത്തുക.
  rationale: മലയാളത്തിൽ ഈ ക്രിയാഭേദം അസ്വാഭാവികതയില്ലാതെ പ്രകടിപ്പിക്കാം; എന്നാൽ അർത്ഥവ്യത്യാസം അതിരുകടന്ന് നിർവചിക്കാതിരിക്കാൻ അടിക്കുറിപ്പും നൽകുന്നു.
- issue: ‘എന്റെ നാമത്തിൽ’ ഉള്ള അപേക്ഷയ്ക്കുള്ള വാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: വാക്യം പറയുന്നതുപോലെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; മുഖ്യവാചകത്തിൽ അധിക നിബന്ധനകളൊന്നും ചേർത്തില്ല.
  alternative: യേശുവിന്റെ ഇഷ്ടത്തോടൊത്ത അപേക്ഷകൾക്കു മാത്രമെന്ന വ്യാഖ്യാനപരമായ പരിധി മുഖ്യവാചകത്തിൽ ചേർക്കുക.
  rationale: വിശാലമായ യോഹന്നാനീയ പശ്ചാത്തലം വ്യാഖ്യാനത്തെ സഹായിച്ചാലും, ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത നിബന്ധനകൾ പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യരുത്.
- issue: ἐν τῷ ὀνόματί μου എന്നതിന്റെ വ്യാകരണബന്ധത്തിലെ സാധ്യതയുള്ള അനിശ്ചിതത്വം
  choice: ‘എന്റെ നാമത്തിൽ’ എന്നത് അപേക്ഷയോടു ബന്ധിപ്പിക്കുന്ന പരമ്പരാഗത വാക്യക്രമം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു.
  alternative: വാചകഭേദം/വിരാമക്രമം അനുസരിച്ച് ‘അവിടുന്ന് എന്റെ നാമത്തിൽ അതു നിങ്ങൾക്കു തരും’ എന്നു δώσει-യോടു ബന്ധിപ്പിക്കുക.
  rationale: SBLGNT-യിലെ പദക്രമം രണ്ട് ബന്ധങ്ങളും ചർച്ച ചെയ്യാൻ ഇടവരുത്തുന്നു; സാധാരണയായി സ്വീകരിക്കപ്പെടുന്ന ബന്ധം മുഖ്യവാചകത്തിൽ കൊടുക്കുകയും യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യാചിക്കുക’ അപേക്ഷയുടെ ഭാവം വ്യക്തമാക്കുന്നു; ‘അവിടുന്ന്’ പിതാവിനെ സൂചിപ്പിക്കുന്ന മാന്യമായ സർവനാമമായി ഉപയോഗിച്ചു. മുഖ്യവാചകം സംക്ഷിപ്തമായി സൂക്ഷിച്ച് യഥാർഥ പദാർഥ-വ്യാകരണ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
