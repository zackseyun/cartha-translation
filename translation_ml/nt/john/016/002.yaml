id: JHN.16.2
reference: John 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: ml
  text: അവർ നിങ്ങളെ സിനഗോഗുകളിൽനിന്ന് പുറത്താക്കും[a]. മാത്രമല്ല, നിങ്ങളെ കൊല്ലുന്ന ഏവനും താൻ ദൈവത്തിന് സേവനം[b] അർപ്പിക്കുകയാണെന്ന് കരുതുന്ന ഒരു സമയം വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിനഗോഗുസമൂഹത്തിൽനിന്ന് ഭ്രഷ്ടരാക്കും’ അല്ലെങ്കിൽ ‘സിനഗോഗുകളിൽ അംഗത്വം നിഷേധിക്കും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആരാധന’ അല്ലെങ്കിൽ ‘മതപരമായ സേവനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: അവർ നിങ്ങളെ സിനഗോഗുകളിൽനിന്ന് പുറത്താക്കും
  rationale: പ്രവചനത്തിന്റെ ഭാവികാലവും ποιέωയുടെ കാരകശക്തിയും നിലനിർത്തിക്കൊണ്ട്, സിനഗോഗുസമൂഹത്തിൽനിന്നുള്ള മത-സാമൂഹിക പുറത്താക്കലിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ബഹുവചനരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: ἀλλ’
  choice: അതിലുപരി
  rationale: ഇവിടെ ലളിതമായ വിരോധത്തേക്കാൾ പീഡനത്തിന്റെ തീവ്രത ഉയർത്തുന്ന ആശയബന്ധമാണ്; ‘അതിലുപരി’ ആ പുരോഗതി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἔρχεται ὥρα ἵνα
  choice: ഒരു സമയം വരുന്നു
  rationale: ὥρα എന്ന യോഹന്നാനീയ പ്രയോഗത്തിന്റെ കാലസൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ അക്ഷരാർഥമായ ‘ഒരു മണിക്കൂർ വരുന്നു’ അസ്വാഭാവികവും ‘നാഴിക’ പുരാതനമോ നിർദിഷ്ട സമയഅളവോ ആയി തെറ്റിദ്ധരിക്കപ്പെടാവുന്നതുമായതിനാൽ ‘ഒരു സമയം’ തെരഞ്ഞെടുത്തു. ἵνα ഇവിടെ ആ സമയത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: നിങ്ങളെ കൊല്ലുന്ന ഏവനും
  rationale: സുബ്സ്റ്റാന്റീവ് പാർട്ടിസിപ്പിളിന്റെ പൊതുവ്യാപകവും ഏകവചനപരവുമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δόξῃ
  choice: കരുതുന്ന
  rationale: പ്രവൃത്തിയെക്കുറിച്ചുള്ള പീഡകന്റെ ആത്മനിഷ്ഠമായ ധാരണയെയോ വിശ്വാസത്തെയോ സൂചിപ്പിക്കുന്നു; ദൈവിക അംഗീകാരം സൂചിപ്പിക്കുന്നില്ല.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: ദൈവത്തിന് സേവനം അർപ്പിക്കുക
  rationale: λατρείαയുടെ ആരാധനാപരവും മതപരവുമായ സേവനഭാവവും προσφέρειν എന്നതിലെ അർപ്പണഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘ദൈവത്തിന്’ എന്നത് സേവനത്തിന്റെ മതപരമായ സ്വഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കൊലപാതകരുടെ മതപരമായ സ്വയംബോധം
  choice: താൻ ദൈവത്തിന് സേവനം അർപ്പിക്കുകയാണെന്ന് കരുതും
  alternative: താൻ ദൈവത്തെ ആരാധിക്കുകയാണെന്ന് കരുതും
  rationale: കൊലപാതകത്തെ ദൈവത്തിനുള്ള സാധുവായ മതസേവനമായി അവർ തെറ്റായി ധരിക്കുന്നതിലെ ഞെട്ടിക്കുന്ന വൈരുധ്യം നിലനിർത്തുന്നു; വിവർത്തനം ആ പ്രവൃത്തിക്ക് ദൈവിക അംഗീകാരം നൽകുന്നില്ല.
- issue: πᾶς ὁ ἀποκτείνας എന്നതിലെ വ്യാകരണലിംഗവും പൊതുവ്യാപകതയും
  choice: നിങ്ങളെ കൊല്ലുന്ന ഏവനും താൻ… എന്നു കരുതും
  alternative: നിങ്ങളെ കൊല്ലുന്നവർ തങ്ങൾ… എന്നു കരുതും
  rationale: മലയാളത്തിലെ ‘ഏവനും’–‘താൻ’ ഘടന ഉറവിടത്തിലെ ഏകവചനവും പ്രതിനിധാനപരമായ പൊതുവ്യാപകതയും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു; അനാവശ്യമായി പുരുഷലിംഗം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘സിനഗോഗ്’ ചരിത്രപരമായ സ്ഥാപനത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിപ്യന്തരണം നിലനിർത്തി. ‘നാഴിക’ ഒഴിവാക്കി ‘ഒരു സമയം’ ഉപയോഗിച്ചത് ഇന്നത്തെ വായനക്കാരിൽ അളവുസംബന്ധമായ തെറ്റിദ്ധാരണ ഒഴിവാക്കാനാണ്.
