  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: ml
  text: നിങ്ങൾ ഇടറിപ്പോകാതിരിക്കാനാണ് ഞാൻ ഈ കാര്യങ്ങൾ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇടറുക,’ ‘ഇടർച്ചയിലാകുക,’ അല്ലെങ്കിൽ ‘മനംനൊന്തുപോകുക.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇടർച്ചമൂലം ഒരാൾ അവിശ്വാസത്തിലേക്കോ വിശ്വാസത്യാഗത്തിലേക്കോ നീങ്ങുന്നതിനെ സൂചിപ്പിക്കാനുമാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ ഈ സൂചകസർവനാമം യേശു മുമ്പ് പറഞ്ഞ വാക്കുകളിലേക്കു തിരിഞ്ഞുനോക്കുന്നു; ബഹുവചനവും യോഹന്നാന്റെ പ്രഭാഷണശൈലിയും നിലനിർത്തുന്നു.
- source_word: λελάληκα
  choice: ഞാൻ ... പറഞ്ഞിരിക്കുന്നു
  rationale: λαλέω എന്ന ക്രിയയുടെ perfect active indicative രൂപം. ‘പറഞ്ഞിരിക്കുന്നു’ എന്നത് മുമ്പ് പറഞ്ഞതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ദത്തിവ്; മലയാളത്തിലെ ‘നിങ്ങൾ/നിങ്ങളോടു’ ബഹുവചനത്തെയും ആദരസൂചക ഏകവചനത്തെയും സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ സന്ദർഭം ശിഷ്യന്മാരെന്ന ബഹുവചനം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα μὴ
  choice: '...ആതിരിക്കേണ്ടതിനാണ്'
  rationale: നിഷേധത്തോടുകൂടിയ ഉദ്ദേശ്യവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: σκανδαλισθῆτε
  choice: ഇടറിപ്പോകാതിരിക്കുക
  rationale: σκανδαλίζω എന്ന ക്രിയയുടെ aorist passive subjunctive രൂപം. ‘ഇടറിപ്പോകുക’ മൂലപദത്തിലെ ഇടർച്ചയുടെ രൂപകം നിലനിർത്തുകയും, വരാനിരിക്കുന്ന പീഡനത്തിൽ വിശ്വാസം തളരുകയോ ഉപേക്ഷിക്കുകയോ ചെയ്യുന്ന കൂടുതൽ ഗൗരവമുള്ള സാധ്യതയ്ക്കും ഇടം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പീഡനത്തിന്റെ പശ്ചാത്തലത്തിൽ σκανδαλισθῆτε എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ഇടറിപ്പോകാതിരിക്കുക
  alternative: വിശ്വാസത്തിൽനിന്ന് വീണുപോകാതിരിക്കുക; ഇടറാതിരിക്കുക; കുറ്റം കാണാതിരിക്കുക
  rationale: തുടർന്നുള്ള വാക്യത്തിലെ പീഡനസന്ദർഭം വിശ്വാസത്യാഗംവരെ ഉൾക്കൊള്ളുന്ന ഗൗരവം നൽകുന്നു. എങ്കിലും ‘വിശ്വാസത്തിൽനിന്ന് വീണുപോകുക’ എന്നു മുഖ്യപാഠത്തിൽ പറയുന്നത് ഗ്രീക്കിലെ രൂപകത്തെയും അർഥവ്യാപ്തിയെയും അമിതമായി നിർണയിക്കും. അതിനാൽ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഈ കാര്യങ്ങൾ’ ബഹുവചനം നിലനിർത്തുന്നു; ‘പറഞ്ഞിരിക്കുന്നു’ perfect രൂപത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി അറിയിക്കുന്നു. മുഖ്യപാഠത്തിലെ ‘ഇടറിപ്പോകുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ രൂപകം സംരക്ഷിക്കുന്നതുമാണ്.
