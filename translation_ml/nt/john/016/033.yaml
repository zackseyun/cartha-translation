id: JHN.16.33
reference: John 16:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: ml
  text: നിങ്ങൾക്ക് എന്നിൽ സമാധാനം ഉണ്ടാകേണ്ടതിന് ഞാൻ ഈ കാര്യങ്ങൾ നിങ്ങളോടു സംസാരിച്ചിരിക്കുന്നു. ലോകത്തിൽ നിങ്ങൾക്ക് കഷ്ടതയുണ്ട്; എങ്കിലും ധൈര്യപ്പെടുവിൻ[a]; ഞാൻ ലോകത്തെ ജയിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനസ്സുറപ്പുള്ളവരായിരിപ്പിൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ബഹുവചന സർവനാമത്തിന്റെ രൂപം നിലനിർത്തുകയും യേശുവിന്റെ മുൻപ്രസംഗത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: λελάληκα
  choice: സംസാരിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് perfect-ന്റെ ശക്തി മലയാളത്തിൽ കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: ഉണ്ടാകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യാർഥം സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള ഐക്യഭാഷ വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: ആശ്വാസം, ക്ഷേമം, യേശുവുമായുള്ള ബന്ധത്തിൽ ലഭിക്കുന്ന ഉറപ്പ് എന്നിവ ഉൾക്കൊള്ളാവുന്ന പതിവും യോജിച്ചതുമായ പദം.
- source_word: θλῖψιν
  choice: കഷ്ടത
  rationale: സമ്മർദം, പീഡനം, ദുരിതം എന്നീ ആശയങ്ങളുടെ ഭാരമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാള പദം.
- source_word: θαρσεῖτε
  choice: ധൈര്യപ്പെടുവിൻ
  rationale: പ്രതിസന്ധിയുടെ നടുവിൽ ആത്മവിശ്വാസം കൈക്കൊള്ളാനുള്ള ബഹുവചന ആജ്ഞ വ്യക്തമായി നൽകുന്നു.
- source_word: νενίκηκα
  choice: ജയിച്ചിരിക്കുന്നു
  rationale: നിർണായകമായി പൂർത്തിയായതും തുടർന്നുനിൽക്കുന്ന ഫലമുള്ളതുമായ ജയത്തെ perfect രൂപത്തിന് അനുയോജ്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ ബഹുസ്തരാർത്ഥമുള്ള പ്രയോഗം ‘ലോകവ്യവസ്ഥ’ തുടങ്ങിയ വ്യാഖ്യാനപരമായ ചുരുക്കങ്ങളില്ലാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: രണ്ടിടത്തും ‘ലോകം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ലോകവ്യവസ്ഥ’ അല്ലെങ്കിൽ ‘വീണുപോയ ഈ ലോകം’
  rationale: ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യക്രമത്തെ സന്ദർഭം സൂചിപ്പിക്കാൻ അനുവദിക്കുമ്പോഴും പദത്തിന്റെ യോഹന്നാനീയ ബഹുസ്തരാർത്ഥം ചുരുക്കുന്നില്ല.
- issue: Perfect കാലരൂപങ്ങളായ λελάληκα, νενίκηκα എന്നിവയുടെ ശക്തി
  choice: ‘സംസാരിച്ചിരിക്കുന്നു’, ‘ജയിച്ചിരിക്കുന്നു’ എന്ന പൂർത്തീകരണവും ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്ന രൂപങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘സംസാരിച്ചു’, ‘ജയിച്ചു’
  rationale: പൂർത്തിയായ പ്രവൃത്തികളുടെ തുടർന്നുനിൽക്കുന്ന പ്രാധാന്യം സംരക്ഷിക്കുന്നു; പ്രത്യേകിച്ച് ക്രൂശിനു മുമ്പുള്ള കഥാസന്ദർഭത്തിൽ യേശു പ്രഖ്യാപിക്കുന്ന ജയത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ധൈര്യപ്പെടുവിൻ’ എന്നത് തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. ഇംഗ്ലീഷ് മാതൃകയിലെ അടിക്കുറിപ്പുകൾക്ക് സ്ഥാനം മാറിയതായി തോന്നുന്നതിനാൽ, ഉറവിടഗ്രീക്കിനനുസരിച്ച് θαρσεῖτε എന്ന പദത്തിനരികിലാണ് lexical alternative അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നത്; εἰρήνην എന്നതിന് ‘take heart’ എന്നത് യോജിക്കാത്തതിനാൽ അവിടെ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
