id: JHN.16.27
reference: John 16:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: ml
  text: പിതാവുതന്നെ നിങ്ങളെ സ്നേഹിക്കുന്നു, എന്തെന്നാൽ നിങ്ങൾ എന്നെ സ്നേഹിക്കുകയും ഞാൻ ദൈവത്തിൽനിന്ന് വന്നതാണെന്ന് വിശ്വസിക്കുകയും ചെയ്തിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്നു.” ഗ്രീക്ക് പ്രയോഗത്തിന് ദൈവസന്നിധിയിൽനിന്ന് വന്നുവെന്ന സൂചനയും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: പിതാവുതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്നതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണമായി മലയാളത്തിലെ വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: φιλεῖ
  choice: സ്നേഹിക്കുന്നു
  rationale: ഇവിടെ വ്യക്തിപരമായ സ്നേഹവും വാത്സല്യവും സൂചിപ്പിക്കുന്നു; ‘സ്നേഹിക്കുന്നു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: ὑμεῖς ἐμὲ πεφιλήκατε
  choice: നിങ്ങൾ എന്നെ സ്നേഹിക്കുകയും … ചെയ്തിരിക്കുന്നു
  rationale: പ്രകടമായ ὑμεῖς നൽകുന്ന വിഷയഊന്നൽ ‘നിങ്ങൾ’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു; perfect രൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി ‘ചെയ്തിരിക്കുന്നു’ എന്ന സംയുക്തഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: πεπιστεύκατε
  choice: വിശ്വസിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: മുൻകാലത്ത് ഉണ്ടായ വിശ്വാസത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം perfect കാലരൂപം സൂചിപ്പിക്കുന്നു; proposition സ്വീകരിക്കുന്ന വിശ്വാസത്തിന് ‘വിശ്വസിക്കുക’ ഏറ്റവും നേരിട്ടുള്ള പദമാണ്.
- source_word: παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: ദൈവത്തിന്റെ അടുക്കൽനിന്ന് വന്നതാണ്
  rationale: παρά + genitive ഉറവിടത്തെയും ഒരാളുടെ സന്നിധിയിൽനിന്നുള്ള വരവിനെയും സൂചിപ്പിക്കാം. ‘അടുക്കൽനിന്ന്’ ഈ രണ്ടിന്റെയും സൂചന നിലനിർത്തുന്നു; ἐξῆλθον സ്വാഭാവിക മലയാളത്തിൽ ‘വന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘ഞാൻ ദൈവത്തിൽനിന്ന് വന്നു’ എന്ന പ്രസ്താവനയുടെ ക്രിസ്തുശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ‘ഞാൻ ദൈവത്തിന്റെ അടുക്കൽനിന്ന് വന്നതാണ്’ എന്ന് ദൗത്യവും ഉത്ഭവവും സൂചിപ്പിക്കുന്ന ഭാഷയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്നു’ / ‘ഞാൻ ദൈവസന്നിധിയിൽനിന്ന് വന്നു’
  rationale: ഗ്രീക്ക് വാചകം യേശുവിന്റെ ദൈവത്തോടുള്ള ഉത്ഭവ-ദൗത്യബന്ധം ഉറപ്പിക്കുന്നു; എന്നാൽ അതിനെ വിശദീകരിക്കുന്ന ഒരു സിദ്ധാന്തപരമായ പരാവർത്തനം ചേർക്കുന്നില്ല. ‘അടുക്കൽനിന്ന്’ ഉറവിടവും സന്നിധിയും തമ്മിലുള്ള യഥാർഥ അർത്ഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘പിതാവുതന്നെ’ എന്ന രൂപം മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. പ്രധാനവാക്യത്തിലെ ‘അടുക്കൽനിന്ന്’ സ്വാഭാവികതയും ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തിയും സന്തുലിതമാക്കുന്നു.
