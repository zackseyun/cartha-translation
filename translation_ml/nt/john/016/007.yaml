id: JHN.16.7
reference: John 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ നിങ്ങളോടു സത്യം പറയുന്നു: ഞാൻ പോകുന്നതാണ് നിങ്ങൾക്കു നല്ലത്. കാരണം, ഞാൻ പോകാതിരുന്നാൽ സഹായകൻ[a] തീർച്ചയായും നിങ്ങളുടെ അടുക്കൽ വരികയില്ല; എന്നാൽ ഞാൻ പോയാൽ, അവനെ നിങ്ങളുടെ അടുക്കൽ അയയ്ക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അഭിഭാഷകൻ,’ ‘ഉപദേഷ്ടാവ്,’ അല്ലെങ്കിൽ ‘ആശ്വാസദായകൻ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം: παράκλητος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ശിഷ്യന്മാരുടെ ദുഃഖത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു സത്യം പറയുന്നു
  rationale: സത്യസന്ധമായ ഉറപ്പുനൽകുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഗൗരവവും നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω
  choice: ഞാൻ പോകുന്നതാണ് നിങ്ങൾക്കു നല്ലത്
  rationale: συμφέρει സൂചിപ്പിക്കുന്ന ഗുണമോ പ്രയോജനമോ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി അറിയിക്കുന്നു; ἵνα-വാക്യത്തെ മലയാളത്തിൽ സുഗമമായ നാമവാക്യഘടനയായി നൽകുന്നു.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: ഞാൻ പോകാതിരുന്നാൽ
  rationale: നിഷേധാത്മക ഉപാധിയും മുൻവാക്യത്തിലെ ‘പോകുക’ എന്ന ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിക്കുന്നു. γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമവും തുടർന്നുള്ള കാരണവിവരണവുംകൊണ്ട് വ്യക്തമാണ്.
- source_word: ὁ παράκλητος
  choice: സഹായകൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ വ്യക്തിപരമായി വന്ന് യേശുവിന്റെ പക്ഷത്ത് പ്രവർത്തിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന, സാധാരണ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിശാലമായ പദം. ഗ്രീക്ക് പദത്തിന്റെ അഭിഭാഷക, ഉപദേഷ്ടാവ്, ആശ്വാസദായകൻ തുടങ്ങിയ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ ἔλθῃ
  choice: തീർച്ചയായും നിങ്ങളുടെ അടുക്കൽ വരികയില്ല
  rationale: οὐ μή സഹിതമുള്ള ശക്തമായ നിഷേധം ‘തീർച്ചയായും ... വരികയില്ല’ എന്നതിലൂടെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: ശിഷ്യന്മാരുടെ അടുത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐὰν δὲ πορευθῶ
  choice: എന്നാൽ ഞാൻ പോയാൽ
  rationale: മുൻ ഉപാധിയോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും πορεύομαι എന്ന സാധാരണ ഗമനക്രിയയെ അതിശയോക്തിയില്ലാതെ പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: πέμψω αὐτὸν
  choice: അവനെ ... അയയ്ക്കും
  rationale: πέμπω എന്നതിന്റെ സാധാരണ അർത്ഥമായ ‘അയയ്ക്കുക’ നൽകുന്നു; αὐτόν എന്ന വ്യക്തിപരമായ പുരുഷലിംഗ പരാമർശം ‘അവനെ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രസംഗത്തിലെ παράκλητος എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: സഹായകൻ
  alternative: അഭിഭാഷകൻ; ഉപദേഷ്ടാവ്; ആശ്വാസദായകൻ; പാരക്ലേതോസ്
  rationale: ഒരൊറ്റ മലയാളപദവും παράκλητος എന്നതിന്റെ മുഴുവൻ അർത്ഥവ്യാപ്തിയും ഉൾക്കൊള്ളുന്നില്ല. ‘സഹായകൻ’ വ്യക്തിപരമായ പ്രവർത്തനവും വിശാലമായ പങ്കും ലളിതമായി അറിയിക്കുന്നു; നിയമപരവും ഉപദേശപരവും ആശ്വാസപരവുമായ മറ്റു സൂചനകൾ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: പരിശുദ്ധാത്മാവിനെ/സഹായകനെക്കുറിച്ചുള്ള വ്യക്തിപരമായ പരാമർശം
  choice: അവനെ
  alternative: അതിനെ
  rationale: ഗ്രീക്കിലെ αὐτόν പുരുഷലിംഗരൂപമാണ്; കൂടാതെ അയയ്ക്കപ്പെടുകയും വരികയും ചെയ്യുന്ന വ്യക്തിപരമായ പ്രവർത്തകനായാണ് παράκλητος അവതരിപ്പിക്കപ്പെടുന്നത്. അതിനാൽ നിർവ്യക്തമായ ‘അതിനെ’ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ സാങ്കേതിക പദങ്ങൾ മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി, παράκλητος എന്ന പദത്തിന്റെ പ്രധാന അർത്ഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നിലനിർത്തി. ഉപാധിവാക്യങ്ങളുടെ ആവർത്തനവും ശക്തമായ നിഷേധവും വ്യക്തിപരമായ സർവനാമവും സംരക്ഷിച്ചു.
