  to: 'എന്നാൽ ഞാൻ നിങ്ങളോടു സത്യം പറയുന്നു: ഞാൻ പോകുന്നതാണ് നിങ്ങൾക്കു നല്ലത്. കാരണം, ഞാൻ പോകാതിരുന്നാൽ സഹായകൻ[a] തീർച്ചയായും നിങ്ങളുടെ അടുക്കൽ വരികയില്ല; എന്നാൽ ഞാൻ പോയാൽ, അവനെ നിങ്ങളുടെ അടുക്കൽ അയയ്ക്കും.'
  rationale: γάρ-ന്റെ കാരണവിവരണബന്ധം വ്യക്തമായി പുനഃസ്ഥാപിക്കാൻ മാത്രം ‘കാരണം’ ചേർത്തു. മറ്റ് പദപ്രയോഗങ്ങളും വാക്യഘടനയും മൂലഗ്രീക്കിന്റെ അർത്ഥവും ഊന്നലും നിലനിർത്തുന്നതിനാൽ മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പിൽ ഗ്രീക്ക് പദം അതിന്റെ മൂലരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
