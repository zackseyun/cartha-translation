id: JHN.16.15
reference: John 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: ml
  text: 'പിതാവിനുള്ളതെല്ലാം എന്റേതാണ്. അതുകൊണ്ടാണ് ഞാൻ പറഞ്ഞത്: ‘അവൻ എനിക്കുള്ളതിൽനിന്ന് എടുക്കുന്നു; നിങ്ങളോടു അറിയിക്കും.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ὅσα
  choice: ഉള്ളതെല്ലാം
  rationale: സമഗ്രത ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἔχει ὁ πατὴρ
  choice: പിതാവിനുള്ള
  rationale: ἔχω എന്നതിന്റെ ഉടമസ്ഥതാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ὁ πατήρ ഇവിടെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമമാണ്.
- source_word: ἐμά ἐστιν
  choice: എന്റേതാണ്
  rationale: ശക്തമായ ഉടമസ്ഥതാവകാശം കൂട്ടിച്ചേർക്കലുകളില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനാത്മക കാരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: εἶπον
  choice: ഞാൻ പറഞ്ഞത്
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റിനെ സന്ദർഭത്തിന് യോജിച്ച ലളിത ഭൂതകാലമായി നൽകുന്നു.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: എനിക്കുള്ളതിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ നാമപദലോപമുള്ള ഉടമസ്ഥതാപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: λαμβάνει
  choice: എടുക്കുന്നു
  rationale: വർത്തമാനകാലരൂപവും ‘എടുക്കുക/സ്വീകരിക്കുക’ എന്ന ശബ്ദാർഥവ്യാപ്തിയിലെ പ്രധാന സാധ്യതയും നിലനിർത്തുന്നു; ‘സ്വീകരിക്കുന്നു’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀναγγελεῖ
  choice: അറിയിച്ചുതരുകയും ചെയ്യും
  rationale: ഭാവികാലവും വെളിപ്പെടുത്തി അറിയിക്കുന്ന പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ശിഷ്യന്മാരോടുള്ള ബഹുവചന പരോക്ഷ കർമത്തെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: പിതാവിനുള്ളതും പുത്രന്റേതുമായുള്ള ബന്ധം
  choice: പിതാവിനുള്ളതെല്ലാം എന്റേതാണ്
  alternative: പിതാവിനുള്ളതെല്ലാം എനിക്കുള്ളതാണ്
  rationale: പിതാവിനുള്ളതെല്ലാം പുത്രന്റേതാണെന്ന ശക്തമായ അവകാശവാദം പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: ആത്മാവ് പുത്രനിൽനിന്ന് എടുക്കുന്നത്/സ്വീകരിക്കുന്നത്
  choice: എനിക്കുള്ളതിൽനിന്ന് എടുക്കുന്നു
  alternative: എനിക്കുള്ളതിൽനിന്ന് സ്വീകരിക്കുന്നു
  rationale: λαμβάνει എന്ന പദത്തിന്റെ രണ്ടു സാധുവായ സൂക്ഷ്മാർഥങ്ങളിൽ ഒന്നിനെ മുഖ്യപാഠത്തിലും മറ്റേതിനെ അടിക്കുറിപ്പിലും നൽകി ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മത അതിവ്യാഖ്യാനമില്ലാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ λαμβάνει എന്ന വർത്തമാനകാലവും ἀναγγελεῖ എന്ന ഭാവികാലവും വേർതിരിച്ചു നിലനിർത്താൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
