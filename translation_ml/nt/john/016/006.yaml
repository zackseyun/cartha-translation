id: JHN.16.6
reference: John 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ഈ കാര്യങ്ങൾ നിങ്ങളോടു പറഞ്ഞതുകൊണ്ട് ദുഃഖം നിങ്ങളുടെ ഹൃദയം നിറച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ ഹൃദയങ്ങൾ.’ ഗ്രീക്കിൽ ‘നിങ്ങളുടെ’ എന്നത് ബഹുവചനവും ‘ഹൃദയം’ എന്നത് ഏകവചനവുമാണ്; ഇത് സംഘത്തിന്റെ പൊതുവായ ആന്തരിക ദുഃഖത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: പറഞ്ഞതുകൊണ്ട്
  rationale: ഇവിടെ ὅτι ശിഷ്യരുടെ ദുഃഖത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥം നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: യേശു മുമ്പ് പറഞ്ഞ വിഷയങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: λελάληκα
  choice: ഞാൻ ... പറഞ്ഞിരിക്കുന്നു
  rationale: പൂർത്തിയായ സംസാരപ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: ബഹുവചനത്തിലുള്ള അഭിസംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ λύπη
  choice: ദുഃഖം
  rationale: λύπη സൂചിപ്പിക്കുന്ന ആഴമുള്ള മനോവേദനയ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: πεπλήρωκεν
  choice: നിറച്ചിരിക്കുന്നു
  rationale: ‘നിറയ്ക്കുക’ എന്ന അടിസ്ഥാന അർഥവും പൂർണ്ണകാലത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലവും സംരക്ഷിക്കുന്നു; ‘കീഴടക്കിയിരിക്കുന്നു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: ὑμῶν τὴν καρδίαν
  choice: നിങ്ങളുടെ ഹൃദയം
  rationale: ബഹുവചന ഉടമസ്ഥസർവനാമത്തോടൊപ്പം ഏകവചനമായ καρδίαν എന്ന ഗ്രീക്ക് ഘടന സംരക്ഷിച്ച് സംഘത്തിന്റെ പങ്കിട്ട ആന്തരിക ദുഃഖം പ്രകടമാകാൻ ഇടനൽകുന്നു.
theological_decisions:
- issue: ‘ഹൃദയം’ എന്ന കൂട്ടായ ഏകവചനമോ ‘ഹൃദയങ്ങൾ’ എന്ന വിതരണ ബഹുവചനമോ
  choice: നിങ്ങളുടെ ഹൃദയം
  alternative: നിങ്ങളുടെ ഹൃദയങ്ങൾ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥരൂപം ബഹുവചനവും καρδίαν ഏകവചനവുമാണ്. അതിനാൽ ശിഷ്യസംഘത്തിന്റെ പങ്കിട്ട ആന്തരിക അവസ്ഥയെ സൂചിപ്പിക്കാവുന്ന യഥാർഥ അസ്പഷ്ടത നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ഏകവചനം സ്വീകരിക്കുകയും ബഹുവചനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴത്തെ ഫലം ‘പറഞ്ഞിരിക്കുന്നു,’ ‘നിറച്ചിരിക്കുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ പ്രകടമാക്കി; കൂട്ടായ ഏകവചനത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
