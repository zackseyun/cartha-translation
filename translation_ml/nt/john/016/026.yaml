source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: ml
  text: ആ ദിവസം നിങ്ങൾ എന്റെ നാമത്തിൽ ചോദിക്കും; നിങ്ങളെക്കുറിച്ച് ഞാൻ പിതാവിനോടു അപേക്ഷിക്കുമെന്നു ഞാൻ നിങ്ങളോടു പറയുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾക്കുവേണ്ടി” അല്ലെങ്കിൽ “നിങ്ങളുടെ നന്മയ്ക്കായി.” ഈ വാക്യത്തിൽ ശിഷ്യർ ‘ചോദിക്കും’ എന്നതിന് αἰτέω എന്നും യേശു പിതാവിനോട് ‘അപേക്ഷിക്കും’ എന്നതിന് ἐρωτάω എന്നും വ്യത്യസ്തമായ രണ്ടു ഗ്രീക്ക് ക്രിയകൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസം
  rationale: ഈ പദസമുച്ചയം കാലസൂചനയാണ്; ἐκείνῃ എന്ന സൂചനയുടെ ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ വ്യക്തിയോടും അധികാരത്തോടുമുള്ള ബന്ധം ഉൾക്കൊള്ളുന്ന യോഹന്നാനീയ പ്രയോഗം അതിവ്യാഖ്യാനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: αἰτήσεσθε
  choice: നിങ്ങൾ ചോദിക്കും
  rationale: ഭാവികാലം, മധ്യമവാചകം, ബഹുവചനം എന്നിവ സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നില്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലവും പ്രസ്താവനയുടെ നേരിട്ടുള്ള സ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐρωτήσω
  choice: ഞാൻ ... അപേക്ഷിക്കുമെന്ന്
  rationale: പിതാവിനോടുള്ള യേശുവിന്റെ അഭ്യർഥനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും αἰτέω, ἐρωτάω എന്നീ വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയകളുടെ സൂക്ഷ്മഭേദം ഭാഗികമായി പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനോട്
  rationale: പ്രകടമായ ഉടമസ്ഥസർവനാമം ചേർക്കാതെ ഗ്രീക്കിലെ ‘പിതാവ്’ എന്ന രൂപം നിലനിർത്തുന്നു; മലയാള വ്യാകരണത്തിന് അനുസരിച്ച് ദാതൃരൂപം ഉപയോഗിക്കുന്നു.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: περί + genitive ഇവിടെ ‘നിങ്ങളെ സംബന്ധിച്ച്’ എന്നും ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നും അർഥമാകാം; പ്രാർത്ഥനാസന്ദർഭത്തിൽ സ്വാഭാവികമായ പ്രതിനിധാനാർഥം മുഖ്യപാഠത്തിൽ നൽകി മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശു ഭാവിയിലെ എല്ലാ മധ്യസ്ഥപ്രാർത്ഥനയും നിഷേധിക്കുന്നുവോ, അതോ ഈ സന്ദർഭത്തിൽ ശിഷ്യരുടെ പിതാവിലേക്കുള്ള പ്രവേശനം തന്റെ അപേക്ഷയെ ആശ്രയിച്ചാണെന്ന് പറയാതിരിക്കുകയോ
  choice: ഈ സന്ദർഭത്തിൽ യേശു പറയുന്നില്ലെന്ന നിലയിൽ വാക്യം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; എല്ലാ ഭാവി മധ്യസ്ഥതയും നിഷേധിക്കുന്നതായി വികസിപ്പിക്കുന്നില്ല.
  alternative: യേശു അവർക്കുവേണ്ടി ഒരിക്കലും മധ്യസ്ഥത ചെയ്യുകയില്ലെന്ന ശക്തമായ വ്യാഖ്യാനം, അല്ലെങ്കിൽ യാതൊരു മധ്യസ്ഥതയും കൂടാതെ പിതാവിലേക്കുള്ള നേരിട്ടുള്ള പ്രവേശനം എന്ന വിശദീകരണപരമായ വിവർത്തനം.
  rationale: തുടർന്നുള്ള സന്ദർഭം പിതാവിനോടുള്ള ശിഷ്യരുടെ നേരിട്ടുള്ള അപേക്ഷയെ ഊന്നുമ്പോഴും, യേശുവിന്റെ മധ്യസ്ഥതയെക്കുറിച്ചുള്ള മറ്റു പുതിയനിയമ വചനങ്ങളുമായുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ മൂലവാക്യത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എന്റെ നാമത്തിൽ’, ‘പിതാവ്’ എന്നീ യോഹന്നാനീയ പദപ്രയോഗങ്ങൾ അന്തർപാഠപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്താൻ സംരക്ഷിച്ചു.
