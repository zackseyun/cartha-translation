    rationale: «നിറഞ്ഞതായിത്തീരും» means ‘will become full,’ whereas ᾖ πεπληρωμένη presents joy as being in the state of fullness under the ἵνα purpose/result clause. A revision can preserve both the purpose linkage and the fullness image.
