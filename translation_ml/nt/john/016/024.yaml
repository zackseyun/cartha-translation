id: JHN.16.24
reference: John 16:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: ml
  text: ഇതുവരെ നിങ്ങൾ എന്റെ നാമത്തിൽ ഒന്നും ചോദിച്ചിട്ടില്ല. ചോദിക്കുവിൻ; നിങ്ങൾക്കു ലഭിക്കും[a], നിങ്ങളുടെ സന്തോഷം നിറഞ്ഞതായിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചോദിച്ചുകൊണ്ടിരിക്കുവിൻ; നിങ്ങൾക്കു ലഭിക്കും.” ഇവിടെ “ചോദിക്കുവിൻ” എന്ന വർത്തമാനകാല കല്പന തുടർച്ചയായോ ആവർത്തിച്ചോ ചോദിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ സന്തോഷം പൂർണമായിരിക്കേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: ഇതുവരെ
  rationale: ഇപ്പോഴത്തെ നിമിഷംവരെയുള്ള കാലയളവ് സ്വാഭാവികവും സംക്ഷിപ്തവുമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: ഒന്നും ചോദിച്ചിട്ടില്ല
  rationale: നിഷേധത്തോടുകൂടിയ οὐδὲν എന്നതിന്റെ ‘ഒന്നും ... ഇല്ല’ എന്ന അർഥവും, ‘ഇതുവരെ’ എന്ന കാലസൂചനയോടു ചേരുന്ന മലയാള പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ വ്യക്തി, അധികാരം, ദൗത്യം എന്നിവയുമായുള്ള ബന്ധം ഉൾക്കൊള്ളാവുന്ന സമ്പന്നമായ യോഹന്നാനീയ പ്രയോഗത്തെ ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: αἰτεῖτε
  choice: ചോദിക്കുവിൻ
  rationale: കല്പനയുടെ ബലം മാന്യവും സ്വാഭാവികവുമായ ബൈബിൾ മലയാളത്തിൽ നൽകുന്നു; വർത്തമാനകാല കല്പന സൂചിപ്പിക്കാവുന്ന തുടർച്ചയോ ആവർത്തനമോ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: λήμψεσθε
  choice: നിങ്ങൾക്കു ലഭിക്കും
  rationale: അപേക്ഷയ്ക്കുള്ള മറുപടിയായി ലഭിക്കുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: അങ്ങനെ നിങ്ങളുടെ സന്തോഷം നിറഞ്ഞതായിത്തീരും
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഫലബന്ധവും πεπληρωμένηയുടെ നിറവ് കൈവന്ന നിലയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘പൂർണമാകും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘എന്റെ നാമത്തിൽ’ എന്ന പ്രാർഥനാഭാഷയുടെ അർഥം
  choice: ‘എന്റെ നാമത്തിൽ’ എന്ന അക്ഷരാർഥ പ്രയോഗം നിലനിർത്തുക
  alternative: ‘എന്റെ അധികാരത്തിൽ’, ‘എനിക്കുവേണ്ടി’, അല്ലെങ്കിൽ ‘എന്നോടുള്ള ഐക്യത്തിൽ’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: മൂലപ്രയോഗം യേശുവിന്റെ വ്യക്തി, അധികാരം, ദൗത്യം എന്നിവയുമായുള്ള ബന്ധം ഉൾക്കൊള്ളുന്നുവെങ്കിലും അവയിൽ ഏതെങ്കിലും ഒറ്റ അർഥത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
- issue: πεπληρωμένηയിലെ നിറവിന്റെ ദൃശ്യവും ഫലാവസ്ഥയും
  choice: ‘നിറഞ്ഞതായിത്തീരും’
  alternative: ‘പൂർണമാകും’
  rationale: യോഹന്നാനിലെ ‘നിറവ്’ എന്ന ദൃശ്യത്തെ നിലനിർത്തിക്കൊണ്ട്, കൈവരിച്ച ഫലാവസ്ഥ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘എന്റെ നാമത്തിൽ’ എന്ന ദൈവശാസ്ത്രപരമായി സമ്പന്നമായ പ്രയോഗം വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തി. ബഹുവചന അഭിസംബോധനയ്ക്കായി ‘നിങ്ങൾ/ചോദിക്കുവിൻ’ ഉപയോഗിച്ചു; അത്യന്തം പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
