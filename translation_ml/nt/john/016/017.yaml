id: JHN.16.17
reference: John 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: ml
  text: 'അതിനാൽ അവന്റെ ശിഷ്യന്മാരിൽ ചിലർ തമ്മിൽ പറഞ്ഞു: “അവൻ നമ്മോടു, ‘കുറച്ചുകാലം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണുകയില്ല; വീണ്ടും കുറച്ചുകാലം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും’ എന്നും, ‘ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതുകൊണ്ട്’[a] എന്നും പറയുന്നത് എന്താണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നു എന്ന്.” ഗ്രീക്ക് സംയോജകപദം ഉദ്ധരിച്ച ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായോ കാരണാർഥത്തിൽ (“പോകുന്നതുകൊണ്ട്”) ആയോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ വാക്കുകളോടുള്ള നിഗമനാത്മകമായ ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാരിൽ ചിലർ
  rationale: ἐκ എന്ന ഭാഗികപ്രയോഗം ശിഷ്യന്മാരിൽ എല്ലാവരെയുമല്ല, ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς ἀλλήλους
  choice: തമ്മിൽ
  rationale: പരസ്പരമുള്ള സംഭാഷണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: അവൻ നമ്മോടു പറയുന്ന ഇതെന്താണ്?
  rationale: ശിഷ്യന്മാരുടെ ആശയക്കുഴപ്പമുള്ള ചോദ്യം ഗ്രീക്ക് ഘടനയോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: Μικρὸν
  choice: കുറച്ചുകാലം കഴിഞ്ഞാൽ
  rationale: ഇവിടെ പദം സമയപരമായ അർഥത്തിലാണ്; മലയാളത്തിൽ സന്ദർഭത്തിന് യോജിച്ച വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: θεωρεῖτέ
  choice: കാണുകയില്ല
  rationale: ദൃശ്യമായോ അനുഭവപരമായോ കാണുക എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു.
- source_word: ὄψεσθέ
  choice: കാണും
  rationale: ഗ്രീക്കിൽ വ്യത്യസ്ത ക്രിയയാണെങ്കിലും, വാക്യത്തിലെ പ്രതിധ്വനിക്കുന്ന സമാന്തരത മലയാളത്തിൽ ‘കാണുക’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: പിന്നെയും
  rationale: വീണ്ടും സംഭവിക്കുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതുകൊണ്ട്
  rationale: ὅτιയുടെ കാരണാർഥസാധ്യത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉദ്ധരിച്ച ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ‘എന്ന്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πατέρα
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലെ ‘പിതാവ്’ എന്ന നിർദിഷ്ടരൂപം നിലനിർത്തുന്നു; ‘എന്റെ പിതാവ്’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ പോകലും വീണ്ടും കാണപ്പെടലും എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ശിഷ്യന്മാരുടെ അനിശ്ചിതത്വം അതേപടി നിലനിർത്തുന്നു
  alternative: മരണം-പുനരുത്ഥാനം, സ്വർഗാരോഹണം, പുനരുത്ഥാനാനന്തര പ്രത്യക്ഷതകൾ, അല്ലെങ്കിൽ ആത്മാവിലൂടെയുള്ള സാന്നിധ്യം എന്നിങ്ങനെ ഏതെങ്കിലും ഒന്നായി വ്യക്തമാക്കുക
  rationale: ഈ വാക്യം തന്നെ സൂചനയുടെ അർഥം തീർപ്പാക്കുന്നില്ല; മറിച്ച് ശിഷ്യന്മാരുടെ ആശയക്കുഴപ്പമാണ് അവതരിപ്പിക്കുന്നത്. അതിനാൽ മുഖ്യപാഠം പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ശിഷ്യന്മാരുടെ ആശയക്കുഴപ്പവും ὅτιയുടെ യഥാർഥ ദ്വയാർഥസാധ്യതയും സംരക്ഷിച്ചിരിക്കുന്നു.
