id: JHN.16.13
reference: John 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: ml
  text: എന്നാൽ സത്യത്തിന്റെ ആത്മാവായ അദ്ദേഹം വരുമ്പോൾ, നിങ്ങളെ സമ്പൂർണ സത്യത്തിലേക്കു[a] വഴിനടത്തും. കാരണം, അദ്ദേഹം സ്വന്തമായി സംസാരിക്കുകയില്ല[b]; കേൾക്കുന്നതെന്തോ അതു സംസാരിക്കുകയും വരാനിരിക്കുന്ന കാര്യങ്ങൾ[c] നിങ്ങളോടു അറിയിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സമ്പൂർണ സത്യത്തിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘സമ്പൂർണ സത്യത്തിൽ’ എന്നാണ്; ‘വഴിനടത്തും’ എന്ന ക്രിയയോടൊപ്പം ദിശാസൂചനയുള്ള വിവർത്തനവും സാധ്യമാണ്.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തന്നിൽനിന്ന് സംസാരിക്കുകയില്ല’; അഥവാ, ‘സ്വന്തമായി സംസാരിക്കുകയില്ല.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘വരാനുള്ളത്’ / ‘വരുന്ന കാര്യങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... വരുമ്പോൾ
  rationale: ὅταν എന്നതിന്റെ ഭാവിമുഖമായ കാലബന്ധവും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും/തുടർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔλθῃ ἐκεῖνος
  choice: അദ്ദേഹം വരുമ്പോൾ
  rationale: ἐκεῖνος വ്യക്തിപരമായ പരാമർശമാണ്. ആദരസൂചകമായ ‘അദ്ദേഹം’ മലയാളത്തിൽ പരിശുദ്ധാത്മാവിനെ വ്യക്തിയായി സൂചിപ്പിക്കുമ്പോൾ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: സത്യത്തിന്റെ ആത്മാവ്
  rationale: യോഹന്നാനിലെ വിശേഷണനാമത്തിന്റെ ജനിറ്റീവ് ഘടന അതേപടി സംരക്ഷിക്കുന്നു; ‘സത്യമായ ആത്മാവ്’ എന്ന വ്യാഖ്യാനപരമായ രൂപം ഒഴിവാക്കുന്നു.
- source_word: ὁδηγήσει
  choice: വഴിനടത്തും
  rationale: ὁδηγέω എന്ന പദത്തിലെ നയിക്കൽ/വഴികാട്ടൽ രൂപകം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: സത്യം മുഴുവനിലേക്കും
  rationale: ἐν ഔപചാരികമായി ‘യിൽ’ എന്നാണെങ്കിലും ὁδηγέωയോടൊപ്പം ദിശാസൂചനയുള്ള അർഥം സാധ്യമാണ്. πάσῃയും നിർദേശക ആർട്ടിക്കിളും ചേർന്നതിനാൽ ‘എല്ലാ സത്യങ്ങളിലേക്കും’ എന്നതിനെക്കാൾ ‘സത്യം മുഴുവനിലേക്കും’ യോജിക്കുന്നു; ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: കാരണം, അദ്ദേഹം സ്വയം ഒന്നും സംസാരിക്കുകയില്ല
  rationale: ἀφ’ ἑαυτοῦ എന്നതിലെ ‘തന്നിൽനിന്ന്’ എന്ന ആശ്രയബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗമായ ‘സ്വയം’ കൊണ്ട് നൽകുന്നു; ‘സ്വന്തം അധികാരത്തിൽ’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: കേൾക്കുന്നതെന്തോ അതു സംസാരിക്കും
  rationale: സ്വീകരിക്കുന്നതും തുടർന്ന് സംസാരിക്കുന്നതും തമ്മിലുള്ള ഉറവിടക്രമവും ഗ്രീക്കിലെ ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: τὰ ἐρχόμενα
  choice: വരാനിരിക്കുന്ന കാര്യങ്ങൾ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കൃദന്തം വരാനിരിക്കുന്ന സംഭവങ്ങളെയോ യാഥാർഥ്യങ്ങളെയോ സൂചിപ്പിക്കുന്നു; അവ എന്താണെന്ന് അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ἀναγγελεῖ ὑμῖν
  choice: നിങ്ങളെ അറിയിക്കും
  rationale: ἀναγγέλλωയുടെ അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; വെളിപ്പെടുത്തൽ എന്ന ആശയം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: ആത്മാവിനെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ പരാമർശം
  choice: ‘അദ്ദേഹം’ എന്ന വ്യക്തിപരമായ സർവനാമം ഉപയോഗിച്ചു
  alternative: ‘അത്’ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ഓരോ തവണയും ‘ആത്മാവ്’ ആവർത്തിക്കുക
  rationale: നപുംസകലിംഗമായ πνεῦμαയോടൊപ്പം തന്നെ മൂലപാഠം പുല്ലിംഗമായ ἐκεῖνος ഉപയോഗിക്കുന്നു. അതിനാൽ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നത് മൂലപാഠസാക്ഷ്യത്തോട് യോജിക്കുന്നു.
- issue: ἐν τῇ ἀληθείᾳ πάσῃ എന്നതിന്റെ ദിശാസൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘സത്യം മുഴുവനിലേക്കും’
  alternative: ‘സത്യം മുഴുവനിലും’
  rationale: വഴിനടത്തുക എന്ന ക്രിയയോടൊപ്പം ദിശാസൂചന മലയാളത്തിൽ സ്വാഭാവികമാണ്; എന്നാൽ ἐν എന്നതിന്റെ ഔപചാരിക സ്ഥാനാർഥം യഥാർഥ വിവർത്തനസാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἀφ’ ἑαυτοῦ എന്ന ആശ്രയഭാഷ
  choice: ‘സ്വയം ഒന്നും സംസാരിക്കുകയില്ല’
  alternative: ‘സ്വന്തം നിലയിൽ സംസാരിക്കുകയില്ല’ / ‘തന്നിൽനിന്ന് സംസാരിക്കുകയില്ല’
  rationale: ആത്മാവിന്റെ വാക്കുകളുടെ ഉറവിടബന്ധം സൂചിപ്പിക്കുമ്പോഴും ‘സ്വന്തം അധികാരത്തിൽ’ പോലുള്ള വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്രഭാഷ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ apposition മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘സത്യത്തിന്റെ ആത്മാവായ അദ്ദേഹം’ എന്നു ചേർത്തു. ‘അറിയിക്കും’ സാധാരണ പ്രയോഗമാണ്; വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ മുഴുവൻ ഘടന ഔപചാരികമായെങ്കിലും പഴഞ്ചനല്ലാത്ത രീതിയിൽ സൂക്ഷിച്ചു.
