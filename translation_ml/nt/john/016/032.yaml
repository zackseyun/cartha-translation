source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: ml
  text: ഇതാ, നിങ്ങൾ ഓരോരുത്തരും അവരവരുടേതിലേക്കു[a] ചിതറിപ്പോകുകയും എന്നെ തനിച്ചാക്കുകയും ചെയ്യുന്ന സമയം വരുന്നു; അതു വന്നുകഴിഞ്ഞുമിരിക്കുന്നു. എങ്കിലും ഞാൻ തനിച്ചല്ല, കാരണം പിതാവ് എന്നോടുകൂടെ ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോരുത്തരും അവരവരുടെ വീട്ടിലേക്കോ സ്ഥലത്തേക്കോ സ്വന്തമായ കാര്യങ്ങളിലേക്കോ.” ഗ്രീക്കുപദപ്രയോഗം ഒരു പ്രത്യേക സ്ഥലത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ഓരോരുത്തർക്കും സ്വന്തമായതിനെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള വ്യവഹാരസൂചകത്തിന്റെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: ഒരു നാഴിക വരുന്നു—വന്നുകഴിഞ്ഞുമിരിക്കുന്നു
  rationale: നിർണായക സമയം അടുത്തുവരുന്നതും ഒരർഥത്തിൽ ഇതിനകം എത്തിയിരിക്കുന്നതുമായ വർത്തമാനകാല–പൂർണകാല സംഘർഷം നിലനിർത്തുന്നു; അനിശ്ചിതമായ ὥρα അനുസരിച്ച് ‘ഒരു നാഴിക’ എന്നു കൊടുക്കുന്നു.
- source_word: ἵνα σκορπισθῆτε
  choice: നിങ്ങൾ ... ചിതറിപ്പോകുകയും ചെയ്യുന്ന
  rationale: സമയത്തിന്റെ ഉള്ളടക്കം/ഫലം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ശിഷ്യന്മാർ വേർപിരിഞ്ഞുപോകുന്ന സംഭവത്തിന്റെ ഉറപ്പ് പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: ഓരോരുത്തരും താന്താങ്ങളുടെ സ്വന്തമായവയിലേക്ക്
  rationale: τὰ ἴδια എന്നത് വീട്, സ്ഥലം, വസ്തുക്കൾ, സ്വന്തം കാര്യങ്ങൾ എന്നിവയെ ഉൾക്കൊള്ളാവുന്നതിനാൽ ഒരു പ്രത്യേക അർഥത്തിലേക്ക് ചുരുക്കാതെ മൂലത്തിലെ വ്യാപ്തി കാക്കുന്നു.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: എന്നെ തനിച്ചാക്കുകയും
  rationale: ἀφίημι ഇവിടെ പിന്നിൽ വിട്ടുപോകുക എന്ന ആശയം നൽകുന്നു; ‘ഉപേക്ഷിക്കുക’ എന്ന കൂടുതൽ ശക്തമായ പദം ചുമത്താതെ സാഹചര്യത്തിലെ വൈകാരിക ഭാരം സൂക്ഷിക്കുന്നു.
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: എങ്കിലും ഞാൻ തനിച്ചല്ല
  rationale: ശിഷ്യന്മാർ വിട്ടുപോകുന്നതും പിതാവിന്റെ സാന്നിധ്യവും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: പിതാവ് എന്നോടുകൂടെ ഉണ്ട്
  rationale: യേശു തനിച്ചല്ലാത്തതിന്റെ കാരണം നേരിട്ട് നൽകുകയും യോഹന്നാനിലെ ബന്ധസൂചകമായ ‘പിതാവ്’ എന്ന വിശേഷണം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാർ യേശുവിനെ വിട്ടുപോകുന്നതും പിതാവിന്റെ സാന്നിധ്യവും തമ്മിലുള്ള ബന്ധം
  choice: എങ്കിലും ഞാൻ തനിച്ചല്ല; പിതാവ് എന്നോടുകൂടെ ഉണ്ട്
  alternative: ഞാൻ തനിച്ചല്ല, കാരണം പിതാവ് എന്നോടുകൂടെ ഉണ്ട്
  rationale: ശിഷ്യന്മാർ യഥാർഥത്തിൽ യേശുവിനെ തനിച്ചാക്കുമെന്ന പ്രസ്താവനയും പിതാവിന്റെ സാന്നിധ്യംമൂലം അവൻ പൂർണമായി തനിച്ചല്ലെന്ന പ്രസ്താവനയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἕκαστος എന്ന ഏകവചന വിതരണഭാവം
  choice: ഓരോരുത്തരും താന്താങ്ങളുടെ
  alternative: എല്ലാവരും അവരവരുടെ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി ഓരോ വ്യക്തിയെയും വേർതിരിച്ചുകാട്ടുന്ന വിതരണഭാവം നിലനിർത്തുന്നു; വ്യാകരണലിംഗം മലയാളത്തിലേക്ക് അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാഴിക’ യോഹന്നാനിലെ നിർണായക സമയബോധം നൽകുന്നു; ഇത് കൃത്യമായ അറുപത് മിനിറ്റിനെ സൂചിപ്പിക്കുന്നതല്ല. ദീർഘവാക്യത്തിന്റെ പ്രവാഹവും മൂലത്തിലെ ‘വരുന്നു/വന്നുകഴിഞ്ഞു’ എന്ന സംഘർഷവും ഡാഷുകൾകൊണ്ട് വ്യക്തമായി സൂക്ഷിച്ചു.
