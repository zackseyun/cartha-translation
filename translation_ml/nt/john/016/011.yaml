  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: ml
  text: 'ന്യായവിധിയെക്കുറിച്ചും: ഈ ലോകത്തിന്റെ ഭരണാധികാരി[a] വിധിക്കപ്പെട്ടിരിക്കുന്നതിനാൽ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് സാത്താനെ സൂചിപ്പിക്കുന്നതാകാം; യോഹന്നാൻ 12:31; 14:30 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘വിധിക്കപ്പെട്ടവനായി നിലകൊള്ളുന്നതിനാൽ.’ ഗ്രീക്കിലെ പൂർണകാലരൂപം, പൂർത്തിയായ വിധിയുടെയും അതിന്റെ തുടരുന്ന ഫലത്തിന്റെയും ഭാവം നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: ന്യായവിധിയെക്കുറിച്ചും
  rationale: περί + genitive വിഷയത്തെ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ മുൻപുള്ള ‘പാപം… നീതി… ന്യായവിധി’ എന്ന നിരയോട് ബന്ധിപ്പിക്കുന്നതിനാൽ ‘-യും’ ഉപയോഗിച്ചു. κρίσις എന്നതിന് സന്ദർഭോചിതമായ നേരിട്ടുള്ള പദം ‘ന്യായവിധി’ ആണ്.
- source_word: ὅτι
  choice: എന്നതിനാൽ
  rationale: ഇവിടെ ὅτι ന്യായവിധിയെക്കുറിച്ച് ബോധ്യപ്പെടുത്തുന്നതിന്റെ കാരണം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἄρχων
  choice: ഭരണാധികാരി
  rationale: ἄρχων ഭരിക്കുകയോ അധികാരം പ്രയോഗിക്കുകയോ ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘പ്രഭു’ പോലുള്ള പദങ്ങൾ അനാവശ്യമായ രാജകീയമോ ദൈവികമോ ആയ ഭാവം നൽകാമെന്നതിനാൽ ‘ഭരണാധികാരി’ തിരഞ്ഞെടുത്തു.
- source_word: τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിന്റെ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ κόσμος എന്നത് സാധാരണയായി ‘ലോകം’ എന്നാണ്; ‘ഈ’ എന്ന demonstrative കൃത്യമായി നിലനിർത്തി.
- source_word: κέκριται
  choice: ന്യായം വിധിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: κρίνωയുടെ perfect passive രൂപമാണിത്. വിധി നടന്നുകഴിഞ്ഞതും അതിന്റെ ഫലം തുടരുന്നതുമായ ഭാവവും passive voice-ഉം ഈ പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ശിക്ഷിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന് പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഈ ലോകത്തിന്റെ ഭരണാധികാരി’ ആരെന്നത്
  choice: പ്രധാനവാക്യത്തിൽ ആ വിശേഷണം അതേപടി നിലനിർത്തി; സാത്താൻ എന്ന് നേരിട്ട് ചേർത്തില്ല.
  alternative: ‘ഈ ലോകത്തിന്റെ ഭരണാധികാരിയായ സാത്താൻ’ എന്ന് വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: യോഹന്നാൻ 12:31; 14:30 എന്നിവയുടെ വെളിച്ചത്തിൽ ഇത് സാത്താനെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നു. എങ്കിലും ഈ വാക്യം പേര് പറയാതെ വിശേഷണം മാത്രം ഉപയോഗിക്കുന്നതിനാൽ അതിലെ പരോക്ഷത സംരക്ഷിച്ചു.
- issue: κέκριται എന്നതിന്റെ ന്യായവിധി/ശിക്ഷാവിധി സൂക്ഷ്മത
  choice: ‘ന്യായം വിധിക്കപ്പെട്ടിരിക്കുന്നു’
  alternative: ‘ശിക്ഷാവിധിക്കു വിധേയനായിരിക്കുന്നു’ / ‘കുറ്റം വിധിക്കപ്പെട്ടിരിക്കുന്നു’
  rationale: സന്ദർഭം പ്രതികൂലവിധിയെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും κρίνω എന്ന പദത്തെ ‘ശിക്ഷാവിധി’ എന്നു മാത്രം ചുരുക്കാതെ അതിന്റെ വിശാലമായ അർഥപരിധിയും perfect tense-ന്റെ തുടരുന്ന ഫലവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. മുൻവാക്യങ്ങളിലെ വിഷയനിരയുമായി ബന്ധം സൂചിപ്പിക്കാൻ ‘-യും’ ഉപയോഗിച്ചു. മൂലപാഠത്തിൽ ‘രാജകുമാരൻ’ എന്ന ആശയം ഇല്ലാത്തതിനാൽ ‘പ്രഭു/രാജാവ്’ ഒഴിവാക്കി ‘ഭരണാധികാരി’ സ്വീകരിച്ചു.
