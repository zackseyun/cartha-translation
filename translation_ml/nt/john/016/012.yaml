  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: ml
  text: നിങ്ങളോടു പറയാൻ ഇനിയും പല കാര്യങ്ങൾ എനിക്കുണ്ട്; എന്നാൽ ഇപ്പോൾ അവ വഹിക്കാൻ നിങ്ങൾക്കു കഴിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇപ്പോൾ അത് വഹിക്കാൻ നിങ്ങൾക്കു കഴിയില്ല” അല്ലെങ്കിൽ “ഇപ്പോൾ അവ സഹിക്കാൻ നിങ്ങൾക്കു കഴിയില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ചുമക്കുക, വഹിക്കുക, സഹിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: ഇനിയും
  rationale: യേശുവിന് പറയാനുള്ള കാര്യങ്ങൾ ശേഷിക്കുന്നുവെന്ന തുടർച്ചാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πολλὰ
  choice: വളരെ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, സൂചിതമായ ആശയം മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: ἔχω
  choice: എനിക്കുണ്ട്
  rationale: പറയാനുള്ളത് ശേഷിക്കുന്നു എന്ന ἔχω + infinitive ഘടനയുടെ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑμῖν λέγειν
  choice: നിങ്ങളോടു പറയാൻ
  rationale: λέγειν എന്ന പൊതുവായ ‘പറയുക’ എന്ന അർഥവും ὑμῖν എന്ന ദത്തിവിന്റെ അഭിമുഖഭാവവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: വാക്യത്തിലെ വ്യക്തമായ വൈരുധ്യബന്ധം dignified modern Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐ δύνασθε
  choice: നിങ്ങൾക്കു കഴിയില്ല
  rationale: കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന δύνασθε എന്ന ക്രിയാഭാവം ചുരുക്കവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: βαστάζειν
  choice: വഹിക്കാൻ
  rationale: ചുമക്കുക, വഹിക്കുക, സഹിക്കുക എന്നീ അർഥസാധ്യതകളുള്ള ഗ്രീക്ക് രൂപകം നിലനിർത്തുകയും അതിനെ ‘മനസ്സിലാക്കുക’ എന്നു മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἄρτι
  choice: ഇപ്പോൾ
  rationale: തുടർന്നുവരുന്ന വാക്യങ്ങളിലെ ഭാവികാല സാഹചര്യത്തോടുള്ള വർത്തമാനകാല വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ഇപ്പോഴത്തെ അശക്തിയുമായി ബന്ധപ്പെട്ട βαστάζειν എന്നതിന്റെ അർഥം
  choice: കൂടുതൽ ഉപദേശത്തിന്റെ ഭാരം ഇപ്പോൾ വഹിക്കാൻ ശിഷ്യന്മാർക്കു കഴിയുന്നില്ല
  alternative: ഇപ്പോൾ അതു പൂർണമായി മനസ്സിലാക്കാൻ കഴിയുന്നില്ല; അല്ലെങ്കിൽ ഇപ്പോൾ അതു കേട്ടു സഹിക്കാൻ കഴിയുന്നില്ല
  rationale: βαστάζω ബൗദ്ധികവും ആത്മീയവും മാനസികവുമായ ശേഷികളെ ഉൾക്കൊള്ളാവുന്നതാണ്. ‘വഹിക്കാൻ’ എന്ന പ്രയോഗം അതിനെ മനസ്സിലാക്കൽ മാത്രമായോ സഹിക്കൽ മാത്രമായോ നിർണയിക്കാതെ അർഥവൈവിധ്യവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വഹിക്കാൻ’ എന്ന രൂപകാത്മക പ്രയോഗം സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതും മൂലഭാഷയിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നതുമാണ്.
