reference: John 16:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: ml
  text: ഇപ്പോൾ, അങ്ങേക്ക് എല്ലാം അറിയാമെന്നും ആരും അങ്ങയോട് ചോദിക്കേണ്ട ആവശ്യം അങ്ങേക്കില്ലെന്നും[a] ഞങ്ങൾ അറിയുന്നു. അങ്ങ് ദൈവത്തിൽനിന്നു വന്നുവെന്ന് ഇതുകൊണ്ട് ഞങ്ങൾ വിശ്വസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചോദിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇവിടെ ‘ചോദ്യം ചെയ്യുക’ എന്നും അർഥമാകാം. യേശുവിന്റെ അറിവും ശിഷ്യന്മാർ പറയാതെവെച്ച ചിന്തകളുമാണ് സന്ദർഭവിഷയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: ശിഷ്യന്മാരുടെ ഇപ്പോഴത്തെ തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലവാചകം.
- source_word: οἴδαμεν
  choice: ഞങ്ങൾ അറിയുന്നു
  rationale: രൂപത്തിൽ perfect ആയ οἶδα ഇവിടെ വർത്തമാനകാല അർഥത്തിലാണ്; മലയാളത്തിലെ ലളിതമായ വർത്തമാനപ്രയോഗം അതിനെ കൃത്യമായി നൽകുന്നു.
- source_word: οἶδας πάντα
  choice: അങ്ങേക്ക് എല്ലാം അറിയാം
  rationale: πάνταയുടെ സമഗ്രത നിലനിർത്തുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആദരസൂചകപ്രയോഗമാണിത്.
- source_word: οὐ χρείαν ἔχεις
  choice: ആവശ്യം അങ്ങേക്കില്ല
  rationale: ഗ്രീക്കിലെ നാമപദാധിഷ്ഠിതമായ ‘ആവശ്യമില്ല’ എന്ന ഘടനയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: ആരും അങ്ങയോട് ചോദിക്കേണ്ട
  rationale: ἐρωτάω എന്ന ക്രിയയിലെ ‘ചോദിക്കുക/ചോദ്യംചെയ്യുക’ എന്ന അർഥവ്യാപ്തി മലയാളത്തിലെ ‘ചോദിക്കുക’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; സന്ദർഭത്തിൽ യേശു പറയാതെവച്ച ചിന്തകളും അറിയുന്നു എന്ന ആശയത്തോടും ഇത് യോജിക്കുന്നു.
- source_word: ἐν τούτῳ
  choice: ഇതുകൊണ്ട്
  rationale: ശിഷ്യന്മാരുടെ വിശ്വാസനിഗമനത്തിന് ആധാരമായ തെളിവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πιστεύομεν
  choice: ഞങ്ങൾ വിശ്വസിക്കുന്നു
  rationale: ഈ ഏറ്റുപറച്ചിലിന്റെ സന്ദർഭത്തിൽ πιστεύωയുടെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἀπὸ θεοῦ
  choice: ദൈവത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ പറയുന്നതുപോലെ ‘ദൈവത്തിൽനിന്ന്’ എന്നു തന്നെ നൽകുന്നു; ‘പിതാവിൽനിന്ന്’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐξῆλθες
  choice: വന്നു
  rationale: ഇവിടെ യേശുവിന്റെ ഉറവിടത്തെയും ദൗത്യത്തെയും സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിൽനിന്നു വന്നു’ എന്നത് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ‘അങ്ങേക്ക് എല്ലാം അറിയാം’ എന്ന പ്രസ്താവനയുടെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ശിഷ്യന്മാരുടെ പ്രസ്താവനയെ വിശദീകരിച്ചു വികസിപ്പിക്കാതെ അതേ സമഗ്രതയോടെ നിലനിർത്തി.
  alternative: ‘അങ്ങ് സർവജ്ഞനാണ്’ എന്ന വ്യക്തമായ ദൈവശാസ്ത്രപദം ചേർക്കുക.
  rationale: വാക്യം യേശുവിന്റെ അറിവിനെക്കുറിച്ചുള്ള ശിഷ്യന്മാരുടെ ഏറ്റുപറച്ചിലാണ്. ‘എല്ലാം അറിയാം’ എന്ന വാചകം അതിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനവികസനം ചേർക്കുന്നില്ല.
- issue: ἀπὸ θεοῦ ἐξῆλθες എന്നതിന്റെ അർഥം
  choice: അങ്ങ് ദൈവത്തിൽനിന്നു വന്നു
  alternative: അങ്ങ് പിതാവിൽനിന്നു വന്നു
  rationale: വാക്യത്തിലെ θεοῦ എന്ന പദത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു. സമീപസന്ദർഭവുമായി ഒത്തുചേർക്കാനായി ‘പിതാവ്’ എന്നു മാറ്റുന്നത് ഈ വാക്യത്തിന്റെ പദപ്രയോഗത്തെക്കാൾ അപ്പുറത്തേക്കു പോകും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. യേശുവിനെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ എന്ന ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ അറിവ്, ചോദിക്കൽ, വിശ്വാസനിഗമനം എന്നീ ആശയങ്ങളുടെ ബന്ധം നിലനിർത്തിക്കൊണ്ട് വാക്യക്രമം മലയാളത്തിന് സ്വാഭാവികമാക്കി.
