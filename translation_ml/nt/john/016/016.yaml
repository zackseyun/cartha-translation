  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: ml
  text: “അല്പസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ ഇനി കാണുകയില്ല; വീണ്ടും അല്പസമയം കഴിഞ്ഞാൽ നിങ്ങൾ എന്നെ കാണും.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെ ‘കാണുക’ എന്നതിന് ഗ്രീക്കിൽ രണ്ട് വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: ആദ്യ വാക്യഭാഗത്തിൽ θεωρέω, രണ്ടാമത്തേതിൽ ὁράω. അവയ്ക്കിടയിൽ സൂക്ഷ്മമായ അർഥവ്യത്യാസം ഉണ്ടായേക്കാമെങ്കിലും, ഈ വാക്യത്തിലെ മുഖ്യവൈരുധ്യം കാലപരമായതിനാൽ രണ്ടും ‘കാണുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: അല്പസമയം കഴിഞ്ഞാൽ
  rationale: നപുംസക ഏകവചന വിശേഷണം ഇവിടെ ക്രിയാവിശേഷണപരമായി ഒരു ഹ്രസ്വമായ സമയപരിധിയെ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന രണ്ട് ഘടകങ്ങളുടെയും കാലപരമായ അർഥവും സമാന്തരഘടനയും ഈ പ്രയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... കാണുകയില്ല
  rationale: നിലവിലെ ഘട്ടത്തിനുശേഷമുള്ള അവസാനിപ്പിക്കൽ സൂചിപ്പിക്കുന്ന οὐκέτι എന്നതിന്റെ സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘ഇനി ... ഇല്ല’.
- source_word: θεωρεῖτέ
  choice: കാണുകയില്ല
  rationale: θεωρέωയ്ക്ക് ശ്രദ്ധിച്ചു നോക്കുക എന്ന സൂക്ഷ്മഭാവം ഉണ്ടാകാമെങ്കിലും ഇവിടെ അടിസ്ഥാന അർഥമായ ‘കാണുക’ മതിയാകുന്നു; ὁράωയുമായുള്ള വ്യത്യാസം കൃത്രിമമായി വലുതാക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: തുടർന്നുണ്ടാകുന്ന വിപരീതാവസ്ഥയെയും ആവർത്തനത്തെയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὄψεσθέ
  choice: കാണും
  rationale: ὁράωയുടെ ഭാവികാലരൂപം ഇവിടെ ഭാവിയിലെ കാണലിനെ സൂചിപ്പിക്കുന്നു. ആദ്യ ക്രിയയോടുള്ള സമാന്തരത നിലനിർത്താൻ ‘കാണുക’ തന്നെയാണ് ഉപയോഗിച്ചത്.
- source_word: με
  choice: എന്നെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന ഒന്നാംപുരുഷ ഏകവചന കർമസർവനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: καὶ
  choice: ; വീണ്ടും
  rationale: ആവർത്തിക്കുന്ന καὶ രണ്ട് സമതുലിതമായ വാക്യഭാഗങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ അർധവിരാമവും ‘വീണ്ടും’ എന്ന ബന്ധപ്രയോഗവും ഗ്രീക്കിലെ താളവും ക്രമവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: θεωρέω, ὁράω എന്നീ രണ്ട് ‘കാണുക’ ക്രിയകളെ മലയാളത്തിൽ വ്യത്യസ്ത പദങ്ങളാൽ വേർതിരിക്കണമോ
  choice: പ്രധാന പാഠത്തിൽ രണ്ടിനും ‘കാണുക’ ഉപയോഗിക്കുക
  alternative: ‘നോക്കിക്കാണുക ... കാണുക’ അല്ലെങ്കിൽ ‘കാണുക ... ദർശിക്കുക’ എന്ന് വ്യത്യാസപ്പെടുത്തുക
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഈ ക്രിയകൾക്ക് ഗണ്യമായ അർഥവ്യാപ്തി ഒത്തുചേരുന്നു. വ്യത്യസ്ത മലയാളപദങ്ങൾ ഉപയോഗിച്ചാൽ മൂലപാഠം ഉറപ്പിക്കാത്ത ആത്മീയമോ അനുഭവപരമോ ആയ വേർതിരിവ് വായനക്കാരനിൽ സൃഷ്ടിക്കാം. സാധ്യതയുള്ള സൂക്ഷ്മവ്യത്യാസം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
