  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: ml
  text: അവൻ എന്നെ മഹത്ത്വപ്പെടുത്തും; കാരണം, എനിക്കുള്ളതിൽനിന്ന് അവൻ സ്വീകരിച്ച് നിങ്ങളോടു അറിയിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കുള്ളതിൽനിന്ന് അവൻ എടുത്ത് നിങ്ങളോടു അറിയിക്കും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: സമീപസന്ദർഭത്തിലെ സഹായകനായ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തിപരമായ സർവനാമം സ്വാഭാവികമാണ്.
- source_word: ἐμὲ
  choice: എന്നെ
  rationale: ‘മഹത്ത്വപ്പെടുത്തും’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമായ ഒന്നാംപുരുഷ ഏകവചന സർവനാമം.
- source_word: δοξάσει
  choice: മഹത്ത്വപ്പെടുത്തും
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ വെളിപ്പെടുത്തലും മഹിമയും ഉൾക്കൊള്ളുന്ന θεολογിക ഭാരം ‘മഹത്ത്വപ്പെടുത്തും’ സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ആത്മാവ് യേശുവിനെ മഹത്ത്വപ്പെടുത്തുന്നതിന്റെ കാരണം ഇവിടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: എനിക്കുള്ളതിൽനിന്ന്
  rationale: യേശുവിനുള്ളതിൽനിന്ന് ആത്മാവ് സ്വീകരിക്കുന്നു എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; അത് ഉപദേശമോ അധികാരമോ വെളിപ്പാടോ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: λήμψεται
  choice: സ്വീകരിച്ച്
  rationale: λαμβάνω എന്ന പദത്തിന് ‘എടുക്കുക’, ‘സ്വീകരിക്കുക’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഈ സന്ദർഭത്തിൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികമാണ്; മറുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀναγγελεῖ
  choice: അറിയിക്കും
  rationale: ἀναγγέλλω എന്നത് അറിയിക്കുക, പ്രഖ്യാപിക്കുക, റിപ്പോർട്ട് ചെയ്യുക എന്നീ ആശയങ്ങൾ വഹിക്കുന്നു; ‘അറിയിക്കും’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑμῖν
  choice: നിങ്ങളെ
  rationale: ‘അറിയിക്കുക’ എന്ന മലയാള ക്രിയയോടൊപ്പം വിവരം അറിയിക്കപ്പെടുന്ന വ്യക്തികളെ ‘നിങ്ങളെ’ എന്നു കർമരൂപത്തിൽ പറയുന്നത് സ്വാഭാവികമാണ്; മൂലത്തിലെ ദ്വിതീയപുരുഷ ബഹുവചനം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐκ τοῦ ἐμοῦ λήμψεται എന്നതിൽ ആത്മാവും യേശുവും തമ്മിലുള്ള ബന്ധം
  choice: എനിക്കുള്ളതിൽനിന്ന് അവൻ സ്വീകരിച്ച്
  alternative: എന്നിൽനിന്ന് അവൻ സ്വീകരിച്ച് / എനിക്കുള്ളതിൽനിന്ന് അവൻ എടുത്ത്
  rationale: വാക്യത്തെ പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്ര നിർവചനമായി ചുരുക്കാതെ, പുത്രനുള്ളത് ആത്മാവ് അറിയിക്കുന്നു എന്ന യോഹന്നാനീയ ആശയത്തിന്റെ വിശാലതയും പദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മഹത്ത്വപ്പെടുത്തും’ എന്ന പദം യോഹന്നാനീയ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
