source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: ml
  text: നീതിയെക്കുറിച്ചും[a], ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിനാലും നിങ്ങൾ ഇനി എന്നെ കാണാത്തതിനാലും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായത്തെക്കുറിച്ച്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് ധാർമിക ശരിത്വത്തെയും ന്യായത്തെയും സൂചിപ്പിക്കാനാകും; ഇവിടെ യേശു പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിലൂടെ അവിടുത്തെ ശരിത്വം സ്ഥിരീകരിക്കപ്പെടുന്നതാണ് സന്ദർഭത്തിലെ മുഖ്യസൂചന.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: 9–11 വാക്യങ്ങളിലെ ആവർത്തിത പട്ടികഘടന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: δικαιοσύνη എന്ന പദത്തിന്റെ ധാർമിക ശരിത്വവും ന്യായവും ഉൾക്കൊള്ളാവുന്ന വിശാലത മലയാളത്തിലെ ‘നീതി’ സ്വാഭാവികമായി വഹിക്കുന്നു; യേശു പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിലൂടെ വെളിപ്പെടുന്ന അവിടുത്തെ ശരിത്വം/നീതീകരണം സന്ദർഭത്തിൽ പ്രസക്തമാണ്.
- source_word: δέ
  choice: -ഉം
  rationale: ശക്തമായ വൈരുധ്യമല്ല, പട്ടികയിലെ അടുത്ത ഇനത്തിലേക്കുള്ള കൂട്ടിച്ചേർക്കലാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ὅτι
  choice: -ുന്നതിനാൽ
  rationale: തുടർന്നുവരുന്ന രണ്ടു പ്രസ്താവനകളെയും കാരണമായി അവതരിപ്പിക്കുന്ന ὅτιയുടെ causal force വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ അടുക്കലേക്ക്
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ὑπάγωയോടൊപ്പമുള്ള πρός എന്നതിന്റെ ദിശാബോധം നിലനിർത്തുന്നു; ഗ്രീക്കിലുള്ള ‘പിതാവ്’ എന്ന ബന്ധനാമത്തിൽ ‘എന്റെ’ എന്നു ചേർക്കുന്നില്ല.
- source_word: ὑπάγω
  choice: പോകുന്നു
  rationale: സന്ദർഭത്തിൽ സമീപഭാവിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനരൂപത്തിന്റെ അടിയന്തരത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... ഇല്ല
  rationale: ഇപ്പോഴുമുതൽ ഒരു അനുഭവം അവസാനിക്കുന്നതിനെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: θεωρεῖτέ
  choice: കാണുക
  rationale: ഇവിടെ ശിഷ്യന്മാർ യേശുവിനെ ദൃശ്യമായി കാണുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിരീക്ഷിക്കുക’ എന്നത് അനാവശ്യമായ അധിക സൂക്ഷ്മത വരുത്തും.
theological_decisions:
- issue: δικαιοσύνη എന്ന ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം; നീതിനിഷ്ഠ
  rationale: ‘നീതി’ ധാർമിക ശരിത്വത്തെയും ന്യായത്തെയും ഉൾക്കൊള്ളുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ്. യേശു പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിലൂടെ അവിടുത്തെ ശരിത്വം സ്ഥിരീകരിക്കപ്പെടുന്നു എന്ന സന്ദർഭസൂചന നിലനിർത്തുമ്പോഴും, പദത്തിന്റെ അർഥം അതിൽ മാത്രം ഒതുക്കുന്നില്ല.
- issue: ὅτι അവതരിപ്പിക്കുന്ന വിശദീകരണത്തിന്റെ വ്യാപ്തി
  choice: ‘ഞാൻ ... പോകുന്നതിനാലും നിങ്ങൾ ... കാണാത്തതിനാലും’ എന്ന രണ്ടു ഘടകങ്ങളും കാരണമായി നിലനിർത്തുക
  alternative: രണ്ടാമത്തെ ഘടകത്തെ കാരണത്തിൽനിന്ന് വേർതിരിച്ച് സ്വതന്ത്ര ഫലമായി വായിക്കുക
  rationale: ഗ്രീക്കിലെ καί രണ്ടു പ്രസ്താവനകളെ ബന്ധിപ്പിക്കുന്നു. കൃത്രിമമായി ബന്ധം തീർപ്പാക്കാതെ അവ രണ്ടും ὅτιയുടെ വിശദീകരണത്തിനകത്ത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മുൻവാക്യങ്ങളിലെ പട്ടികതുടർച്ചയ്ക്കായി ‘-ഉം’ ഉപയോഗിച്ചു; വാക്യം വിശാലസന്ദർഭത്തിലെ അപൂർണ പട്ടികഘടകമായതിനാൽ അവസാനത്തിൽ അർധവിരാമം നൽകി.
