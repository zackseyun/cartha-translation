  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: ml
  text: അവർ പിതാവിനെയോ എന്നെയോ അറിഞ്ഞിട്ടില്ലാത്തതിനാൽ ഈ കാര്യങ്ങൾ ചെയ്യും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ പിതാവിനെയോ എന്നെയോ അറിഞ്ഞില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയെ സന്ദർഭാനുസരിച്ച് ലളിതഭൂതകാലമായോ ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള രൂപമായോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: വാക്യാരംഭത്തിൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ തുടർച്ചയായ വായനയിൽ സ്വാഭാവികമായി വ്യക്തമാണ്; ‘കൂടാതെ’ ചേർത്താൽ അനാവശ്യമായ ഊന്നൽ വരാം.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ശത്രുതാപരമായ പ്രവൃത്തികളിലേക്കുള്ള ബഹുവചന പിന്നോട്ടുള്ള സൂചന നിലനിർത്തുന്നു.
- source_word: ποιήσουσιν
  choice: ചെയ്യും
  rationale: ποιέω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം വസ്തുവായ ‘ഈ കാര്യങ്ങൾ’ എന്നതിനൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅτι
  choice: അതിനാൽ
  rationale: ഇവിടെ ὅτι അവരുടെ പ്രവൃത്തികളുടെ കാരണം അവതരിപ്പിക്കുന്നു; കാരണാർഥം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἔγνωσαν
  choice: അറിഞ്ഞിട്ടില്ല
  rationale: അവരുടെ അറിയായ്മയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ഗ്രീക്ക് ഏറിസ്റ്റിനെ ‘അറിഞ്ഞില്ല’ എന്നും ‘അറിഞ്ഞെത്തിയിട്ടില്ല’ എന്നും നൽകാൻ സാധിക്കുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ ദൈവത്തെ പുത്രനോടുള്ള ബന്ധത്തിൽ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സ്ഥാനനാമം നിലനിർത്തുന്നു.
- source_word: οὐδὲ ἐμέ
  choice: എന്നെയോ
  rationale: നിഷേധവാക്യത്തിൽ പിതാവിനെയും യേശുവിനെയും ഉൾക്കൊള്ളുന്ന ‘neither … nor’ അർഥം മലയാളത്തിലെ ‘-യോ … -യോ’ ഘടനയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തെയും യേശുവിനെയും ‘അറിയുക’ എന്ന യോഹന്നാനീയ ഭാഷ
  choice: പിതാവിനെയോ എന്നെയോ അറിഞ്ഞിട്ടില്ല
  alternative: പിതാവിനെയോ എന്നെയോ അറിഞ്ഞില്ല; പിതാവിനെയോ എന്നെയോ അറിഞ്ഞെത്തിയിട്ടില്ല
  rationale: പീഡനത്തിന്റെ കാരണം പിതാവിനെയും യേശുവിനെയും സംബന്ധിച്ച ബന്ധപരമായ അറിയായ്മയാണെന്ന വാദം വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു. ‘അറിയുക’ എന്നത് വെറും വിവരബോധമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യക്രമം യാന്ത്രികമായി അനുകരിക്കാതെ കാരണബന്ധം വ്യക്തമായി നൽകി; യോഹന്നാനീയ ‘അറിയുക’ എന്ന ആശയത്തിന്റെ ബന്ധപരമായ വ്യാപ്തി വിശദീകരിച്ച് പരിമിതപ്പെടുത്തിയിട്ടില്ല.
