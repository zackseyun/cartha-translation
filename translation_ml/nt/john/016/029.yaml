reference: John 16:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: ml
  text: 'അവന്റെ ശിഷ്യന്മാർ പറഞ്ഞു: “ഇതാ, ഇപ്പോൾ അങ്ങ് മറയില്ലാതെ[a] സംസാരിക്കുന്നു; ഒരു ആലങ്കാരിക പ്രയോഗവും[b] ഉപയോഗിക്കുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വ്യക്തമായി” അല്ലെങ്കിൽ “തുറന്നുപറഞ്ഞ്.” ഗ്രീക്ക് പ്രയോഗത്തിന് തുറന്നോ വ്യക്തമായോ, അല്ലെങ്കിൽ തുറന്ന മനസ്സോടെയോ സംസാരിക്കുക എന്നർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പഴഞ്ചൊല്ല്,” “ഉപമ,” അല്ലെങ്കിൽ “മറഞ്ഞ അർഥമുള്ള വാക്ക്.” ഇവിടെ രൂപകപരമോ പരോക്ഷമോ ആയ സംസാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാള കഥനശൈലിയിൽ ഭൂതകാലമായി നൽകി.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: ഉടമസ്ഥബന്ധവും സൂചിതവ്യക്തിയുമായുള്ള ബന്ധവും നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഇടയക്ഷരത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: യേശുവിന്റെ സംസാരരീതിയിൽ ഇപ്പോൾ ഉണ്ടായതായി ശിഷ്യന്മാർ കരുതുന്ന മാറ്റം സൂചിപ്പിക്കുന്നു.
- source_word: ἐν παρρησίᾳ
  choice: മറയില്ലാതെ
  rationale: παροιμία എന്ന പരോക്ഷമോ ആലങ്കാരികമോ ആയ സംസാരത്തോടുള്ള സന്ദർഭോചിതമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘തുറന്നുപറയുക’, ‘വ്യക്തമായി’ എന്നീ അർഥസാധ്യതകളും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαλεῖς
  choice: സംസാരിക്കുന്നു
  rationale: നിലവിലെ സംഭാഷണസാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: παροιμίαν
  choice: ആലങ്കാരിക പ്രയോഗം
  rationale: യോഹന്നാനിലെ സന്ദർഭത്തിൽ പഴഞ്ചൊല്ല് എന്നതിലുപരി രൂപകാത്മകമോ പരോക്ഷമോ മറഞ്ഞതോ ആയ വാക്കിനെ സൂചിപ്പിക്കുന്നു.
- source_word: οὐδεμίαν
  choice: ഒരു ... വും ... ഇല്ല
  rationale: സമ്പൂർണ നിഷേധത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: λέγεις
  choice: പറയുന്നില്ല
  rationale: മൂലത്തിലെ ‘പറയുക’ എന്ന ക്രിയയെ ഔപചാരികമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
theological_decisions:
- issue: παροιμία എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ παρρησίαയുടെ അർഥം
  choice: യേശു പരോക്ഷമോ ആലങ്കാരികമോ ആയ ഭാഷയ്ക്കു പകരം മറയില്ലാതെ/വ്യക്തമായി സംസാരിക്കുന്നു എന്നാണ് ശിഷ്യന്മാർ പറയുന്നത്.
  alternative: യേശു ധൈര്യത്തോടെയോ നിർഭയമായോ സംസാരിക്കുന്നു.
  rationale: വാക്യത്തിലെ നേരിട്ടുള്ള വൈരുധ്യം ἐν παρρησίᾳ എന്നതിനും παροιμίαν οὐδεμίαν എന്നതിനുമിടയിലാണ്. അതിനാൽ ധൈര്യത്തേക്കാൾ തുറന്നതും വ്യക്തവുമായ ആവിഷ്കാരമാണ് ഇവിടെ പ്രധാനമായ അർഥം; മറ്റു സാധ്യമായ സൂക്ഷ്മതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ മാന്യവും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ചതുമായ ശൈലി. യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ തുറന്ന/വ്യക്തമായ സംസാരവും ആലങ്കാരിക/പരോക്ഷമായ സംസാരവും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തി.
