id: JHN.16.4
reference: John 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: ml
  text: എന്നാൽ, അവരുടെ സമയം വരുമ്പോൾ, ഞാൻ നിങ്ങളോടു പറഞ്ഞുവെന്ന് നിങ്ങൾ ഓർക്കേണ്ടതിനാണ് ഞാൻ ഇക്കാര്യങ്ങൾ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നത്.[a] എന്നാൽ, ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ ആദിമുതൽ ഇക്കാര്യങ്ങൾ നിങ്ങളോടു പറഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവരുടെ സമയം വരുമ്പോൾ, ഞാൻ നിങ്ങളോടു പറഞ്ഞുവെന്ന് നിങ്ങൾ അവരെ/അവയെ ഓർക്കേണ്ടതിന്.” ഗ്രീക്കുപാഠത്തിൽ αὐτῶν എന്ന രൂപം രണ്ടുതവണ വരുന്നു: ആദ്യത്തേത് “സമയം” എന്ന പദത്തോടും രണ്ടാമത്തേത് “ഓർക്കുക” എന്ന ക്രിയയോടും ബന്ധപ്പെട്ടിരിക്കുന്നു. ഇവയുടെ സൂചന മലയാളത്തിൽ സുഗമമായി ആവർത്തിച്ചു നൽകുക പ്രയാസമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: പറഞ്ഞിരിക്കുന്നത്
  rationale: ഗ്രീക്ക് പൂർണകാലം സൂചിപ്പിക്കുന്ന, കഴിഞ്ഞ സംസാരത്തിന് ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി മലയാളത്തിലെ സ്വാഭാവികമായ പൂർണകാലരൂപത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ταῦτα
  choice: ഇക്കാര്യങ്ങൾ
  rationale: മുൻവാക്യങ്ങളിലെ മുന്നറിയിപ്പുകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἵνα
  choice: ഓർക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യാർഥം കൃത്യമായി നിലനിർത്തുകയും മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: ഇവരുടെ സമയം വരുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന സന്ദർഭത്തെ ὅταν സൂചിപ്പിക്കുന്നു. ὥραയ്ക്ക് യോഹന്നാനിൽ നിയുക്തസമയം എന്ന അർഥസൂചന ഉണ്ടെങ്കിലും ഇവിടെ 'സമയം' സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; αὐτῶν എന്നതിന്റെ അനിശ്ചിത സൂചന 'ഇവരുടെ' എന്നു നിലനിർത്തുന്നു.
- source_word: μνημονεύητε
  choice: നിങ്ങൾ ഓർക്കുക
  rationale: ഓർമിക്കുക എന്ന നേരിട്ടുള്ള അർഥം വ്യക്തവും സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞുവെന്ന്
  rationale: ὅτι അവതരിപ്പിക്കുന്ന ഉള്ളടക്കവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധരണിപൂരക രൂപത്തിൽ നൽകുന്നു; ἐγώയുടെ ഊന്നൽ 'ഞാൻ' നിലനിർത്തുന്നു.
- source_word: ἐξ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: കാലാരംഭം മുതൽ എന്ന ആശയം ചുരുക്കമായും ഗൗരവമുള്ള ആധുനിക മലയാളത്തിലും നൽകുന്നു.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ
  rationale: കൂടെ ഉണ്ടായിരിക്കുക എന്ന ബന്ധാർഥവും ὅτιയുടെ കാരണാർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὥρα αὐτῶν എന്നതിലെ αὐτῶν ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നു എന്ന ചോദ്യം
  choice: '''ഇവരുടെ സമയം'' എന്നു പരിഭാഷപ്പെടുത്തി സൂചനയുടെ അനിശ്ചിതത്വം നിലനിർത്തി.'
  alternative: '''അവ സംഭവിക്കേണ്ട സമയം'' അല്ലെങ്കിൽ ''അവരുടെ നാഴിക'' എന്നു വ്യാഖ്യാനിക്കാം.'
  rationale: സമീപസന്ദർഭം പീഡകരെയും അവർ ചെയ്യുന്ന കാര്യങ്ങളെയും ഉൾക്കൊള്ളാൻ ഇടയാക്കുന്നു. ഏതെങ്കിലും ഒരു സൂചനയെ നിർബന്ധമായി തിരഞ്ഞെടുത്ത് വ്യാഖ്യാനപരമായ സംഘർഷം ഇല്ലാതാക്കാതിരിക്കാൻ വ്യക്തിനിർദ്ദേശമുള്ളെങ്കിലും നിർണായകമല്ലാത്ത രൂപം ഉപയോഗിച്ചു.
- issue: SBLGNT-യിൽ αὐτῶν രണ്ടുതവണ വരുന്നത്
  choice: ആദ്യത്തേത് മുഖ്യപാഠത്തിൽ 'ഇവരുടെ' എന്നു വ്യക്തമാക്കി; രണ്ടാമത്തേതിന്റെ സാന്നിധ്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, മുഖ്യവാക്യം സ്വാഭാവികമാക്കി.
  alternative: അക്ഷരാർഥത്തിന് അടുത്തായി 'അവയെ നിങ്ങൾ ഓർക്കേണ്ടതിന്—ഞാൻ നിങ്ങളോടു പറഞ്ഞുവെന്ന്' എന്നു നൽകാം.
  rationale: രണ്ടാമത്തെ αὐτῶν മലയാളമുഖ്യപാഠത്തിൽ യാന്ത്രികമായി ആവർത്തിച്ചാൽ ബന്ധം അസ്വാഭാവികവും അർഥം മങ്ങിയതുമാകും. എന്നാൽ സ്രോതസ്സിലെ യഥാർഥ പാഠസങ്കീർണത മറയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ആവശ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. 'നാഴിക' എന്ന പരമ്പരാഗത പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന 'സമയം' ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിന്റെ സുതാര്യത നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ ആവർത്തിച്ച αὐτῶν മൂലമുള്ള അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
