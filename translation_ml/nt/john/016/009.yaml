  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ ἁμαρτίας μέν, ὅτι οὐ πιστεύουσιν εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/009.yaml
  text: concerning sin[a], because they do not believe in me;
translation:
  language: ml
  text: പാപത്തെക്കുറിച്ച്—അവർ എന്നിൽ വിശ്വസിക്കാത്തതുകൊണ്ട്[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവർ എന്നിൽ വിശ്വസിക്കുന്നില്ല എന്ന കാര്യത്തെക്കുറിച്ച്.’ ഗ്രീക്കിലെ സംയോജകം കാരണമായോ വിശദീകരണമായോ മനസ്സിലാക്കാം; ഈ സന്ദർഭത്തിൽ ‘വിശ്വസിക്കാത്തതുകൊണ്ട്’ എന്നത് അതിന്റെ വിശദീകരണശക്തി കൂടുതൽ വ്യക്തമായി നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: ജനകത്തിൽ വരുന്ന περί ഇവിടെ പരിശുദ്ധാത്മാവ് ബോധ്യപ്പെടുത്തുന്ന വിഷയത്തെ അവതരിപ്പിക്കുന്നു. 10–11 വാക്യങ്ങളിലെ സമാന്തരഘടനയോടും സ്വാഭാവിക മലയാളപ്രയോഗത്തോടും ‘കുറിച്ച്’ യോജിക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപം
  rationale: ഏകവചനത്തിലുള്ള അമൂർത്തനാമത്തിന്റെ വിഭാഗാർഥം നിലനിർത്തുന്നു; ‘പാപങ്ങൾ’ എന്നാക്കി വ്യക്തിഗത പ്രവൃത്തികളായി ചുരുക്കുന്നില്ല.
- source_word: μέν
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇത് 9–11 വാക്യങ്ങളിലെ പട്ടികയിലെ ആദ്യ ഇനത്തെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ സമാന്തരഘടനയും വിരാമചിഹ്നവും അതിന്റെ സംവാദധർമ്മം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ὅτι
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ‘പാപത്തെക്കുറിച്ച്’ എന്നതിന് വിശദീകരണകാരണമായി ഈ സംയോജകം പ്രവർത്തിക്കുന്നു. ‘എന്നതിനാൽ’ എന്നതും സാധ്യമെങ്കിലും ‘വിശ്വസിക്കാത്തതുകൊണ്ട്’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: οὐ πιστεύουσιν
  choice: അവർ വിശ്വസിക്കുന്നില്ല
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന അവിശ്വാസാവസ്ഥയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἰς ἐμέ
  choice: എന്നിൽ
  rationale: യോഹന്നാനിലെ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ വിശ്വാസദിശ ‘എന്നിൽ വിശ്വസിക്കുക’ എന്ന പതിവ് മലയാളരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിൽ സൂചിപ്പിക്കുന്ന പാപത്തിന്റെ സ്വഭാവം
  choice: ഈ സന്ദർഭത്തിൽ യേശുവിൽ വിശ്വസിക്കാത്തതാണ് ‘പാപം’ എന്നതിന്റെ നിർണായക പ്രകടനമോ വിശദീകരണമോ ആയി വാക്യം ബന്ധിപ്പിക്കുന്നു.
  alternative: പൊതുവായ മനുഷ്യപാപാവസ്ഥയെ ഉദ്ദേശിച്ച്, അവിശ്വാസത്തെ അതിന്റെ ഒരു ഉദാഹരണമായി മാത്രം കാണുക.
  rationale: ὅτι എന്നതിനു ശേഷമുള്ള വാക്യം ‘പാപത്തെക്കുറിച്ച്’ എന്നതിനെ നേരിട്ട് വിശദീകരിക്കുന്നു. എന്നാൽ അതിനപ്പുറം സമഗ്രമായ ഒരു സിദ്ധാന്തപ്രസ്താവന വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. 9–11 വാക്യങ്ങളിലെ സമാന്തരക്രമം കണക്കിലെടുത്ത് ‘പാപത്തെക്കുറിച്ച്’ എന്ന വിഷയാവതരണം നിലനിർത്തി. വിശദീകരണഭാഗം തെളിയിക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
