  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: ml
  text: അടുത്ത ദിവസം[a] യോഹന്നാൻ വീണ്ടും അവിടെ നിൽക്കുകയായിരുന്നു; അവന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേർ അവനോടൊപ്പം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അടുത്ത ദിവസം യോഹന്നാൻ വീണ്ടും നിൽക്കുകയായിരുന്നു; അവന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേർ [അവിടെ ഉണ്ടായിരുന്നു].”'
    reason: മൂലപാഠത്തിലെ ലളിതമായ ഏകോപനത്തിനും സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിക്കേണ്ട വിധേയത്തിനും സാധ്യമായ കൂടുതൽ അക്ഷരാർഥപരമായ വിന്യാസം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: അടുത്ത ദിവസം
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ἐπαύριον എന്ന കാലസൂചക പ്രയോഗം ‘അടുത്ത ദിവസം’ അഥവാ ‘തുടർന്നുള്ള ദിവസം’ എന്നാണ് അർഥമാക്കുന്നത്. ‘അടുത്ത ദിവസം’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ കാലബന്ധം കൃത്യമായി നൽകുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുൻ രംഗവുമായി ബന്ധപ്പെടുത്തി ആവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ πάλιν എന്നതിന് ലളിതവും സ്വാഭാവികവുമായ ‘വീണ്ടും’ സ്വീകരിച്ചു.
- source_word: εἱστήκει
  choice: അവിടെ നിൽക്കുകയായിരുന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഈ രൂപം ഭൂതകാലത്തിലെ തുടരുന്ന അവസ്ഥയെ ചിത്രീകരിക്കുന്നു. ‘നിൽക്കുകയായിരുന്നു’ ആ നിലയുടെ ദൈർഘ്യസ്വഭാവം നൽകുന്നു; ‘അവിടെ’ എന്നത് ഗ്രീക്കിൽ പ്രത്യേകം ഇല്ലെങ്കിലും മലയാളത്തിൽ രംഗസ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ചേർത്തതാണ്.
- source_word: ὁ Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലും ആധുനിക ഉപയോഗത്തിലും പരിചിതമായ രൂപം. സന്ദർഭത്തിൽ സ്നാപകയോഹന്നാനാണെങ്കിലും മൂലപാഠം ‘യോഹന്നാൻ’ എന്നു മാത്രം പറയുന്നതിനാൽ വികസിപ്പിച്ചിട്ടില്ല.
- source_word: καὶ
  choice: ; … -ഉം
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഏകോപനം മലയാളത്തിൽ അർധവിരാമവും ‘-ഉം’ ഘടനയും ഉപയോഗിച്ച് സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: അവന്റെ ശിഷ്യന്മാരിൽ രണ്ടുപേരും അവനോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: ἐκ എന്നത് കൂട്ടത്തിൽനിന്നുള്ള രണ്ടുപേരെന്ന ഭാഗികബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളവാക്യത്തിന് ആവശ്യമായ വിധേയം സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിച്ച് ‘അവനോടൊപ്പം ഉണ്ടായിരുന്നു’ എന്നു നൽകി; μαθηταί എന്നതിന് പതിവായ ‘ശിഷ്യന്മാർ’ നിലനിർത്തി.
