  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിന്റെ ദൃശ്യസ്വഭാവവും ലളിതമായ ഏകോപനവും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ആവശ്യമായ വിധേയം സ്വാഭാവികമായി പൂരിപ്പിച്ചു.
