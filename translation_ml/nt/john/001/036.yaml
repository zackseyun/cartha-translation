  text: καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: ml
  text: 'നടന്നുപോകുന്ന യേശുവിനെ നോക്കി അവൻ പറഞ്ഞു: “ഇതാ, ദൈവത്തിന്റെ കുഞ്ഞാട്!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: സൂക്ഷിച്ചുനോക്കിക്കൊണ്ട്
  rationale: കേവലം ‘നോക്കുക’ എന്നതിലുപരി ശ്രദ്ധയോടെ ദൃഷ്ടി പതിപ്പിക്കുക എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: περιπατοῦντι
  choice: നടന്നുകൊണ്ടിരുന്ന
  rationale: യേശു അപ്പോൾ നടന്നുകൊണ്ടിരിക്കുകയായിരുന്നു എന്ന സമകാലിക പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞാസ്വഭാവമുള്ള ഉദ്ഗാരത്തെ ചുരുക്കവും ഗൗരവവുമുള്ള മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കുഞ്ഞാട്
  rationale: യോഹന്നാന്റെ സവിശേഷമായ ദൈവശാസ്ത്രപരമായ വിശേഷണം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ കുഞ്ഞാട്’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥപരിധി
  choice: ദൈവത്തിന്റെ കുഞ്ഞാട്
  alternative: ദൈവം നൽകുന്ന കുഞ്ഞാട് / ദൈവത്തിനുള്ള കുഞ്ഞാട്
  rationale: τοῦ θεοῦ എന്ന ജനിറ്റീവിന്റെ കൃത്യബന്ധം വാക്യം തന്നെ വിശദീകരിക്കുന്നില്ല; അതിനാൽ മലയാളത്തിലും സ്വാഭാവികമായ ജനിറ്റീവ് രൂപം ഉപയോഗിച്ച് ആ ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയിൽ ശ്രദ്ധ ക്ഷണിക്കുന്ന ‘ഇതാ’ നിലനിർത്തി.
