id: JHN.1.14
reference: John 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: ml
  text: വചനം ജഡമായിത്തീർന്ന്, കൃപയും സത്യവും നിറഞ്ഞവനായി നമ്മുടെ ഇടയിൽ വസിച്ചു[a]. ഞങ്ങൾ അവന്റെ മഹത്ത്വം കണ്ടു—പിതാവിൽനിന്നുള്ള ഏകജാതന്റേതുപോലെയുള്ള മഹത്ത്വം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ ഇടയിൽ കൂടാരമടിച്ചു വസിച്ചു”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ കൂടാരത്തെയും സമാഗമകൂടാരത്തിലെ ദൈവസാന്നിധ്യത്തെയും ഓർമിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: വചനം
  rationale: യോഹന്നാന്റെ ആമുഖത്തിലെ വ്യക്തിപരവും ദൈവശാസ്ത്രപരവുമായി സമ്പന്നമായ ശീർഷകം നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായ പദം.
- source_word: σὰρξ ἐγένετο
  choice: ജഡമായിത്തീർന്നു
  rationale: മനുഷ്യാവതാരത്തിലെ യഥാർഥ ദേഹധാരണം വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ ശക്തമായ പരിവർത്തനഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു; ‘മനുഷ്യനായി’ എന്നത് അർഥം വ്യക്തമാക്കുമെങ്കിലും σάρξ എന്ന പദത്തിന്റെ മൂർച്ച കുറയ്ക്കും.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: നമ്മുടെ ഇടയിൽ വസിച്ചു
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും; കൂടാരമടിച്ച് വസിക്കുക എന്ന സാദൃശ്യസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐθεασάμεθα
  choice: ഞങ്ങൾ ... കണ്ടു
  rationale: നേരിട്ടുള്ള ദർശനസാക്ഷ്യത്തിന്റെ ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: യോഹന്നാനിലെ ദൈവിക തേജസ്സും ബഹുമാനവും ഉൾക്കൊള്ളുന്ന സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ മലയാള പ്രയോഗം.
- source_word: μονογενοῦς
  choice: ഏകജാതൻ
  rationale: μονογενής സൂചിപ്പിക്കുന്ന അതുല്യവും ഏകവുമായ പുത്രബന്ധത്തെ സംക്ഷിപ്തമായി വഹിക്കുന്നു; ‘ഏകജാതപുത്രൻ’ എന്നും ‘അതുല്യനായ പുത്രൻ’ എന്നും വ്യാഖ്യാനിക്കാവുന്ന പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρὰ πατρός
  choice: പിതാവിൽനിന്നുള്ള
  rationale: സന്ദർഭത്തിലെ ഉത്ഭവ/ബന്ധ സൂചന സ്വാഭാവികമായി നൽകുന്നു. ഗ്രീക്കിൽ ‘പിതാവ്’ എന്നതിന് നിർദ്ദിഷ്ട ഉപപദമില്ലാത്തതിനാൽ മലയാളത്തിലും അനാവശ്യമായി വ്യാഖ്യാനം കൂട്ടുന്നില്ല.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: കൃപയും സത്യവും നിറഞ്ഞ
  rationale: ഗ്രീക്കിലെ പരിചിതമായ ഉടമ്പടിഭാഷയുടെ പ്രതിധ്വനിയും നാമനിർദ്ദേശക വിശേഷണത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: μονογενοῦς എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ വിവർത്തനം
  choice: ഏകജാതൻ
  alternative: ഏകജാതപുത്രൻ; അതുല്യനായ ഏകപുത്രൻ
  rationale: മൂലപാഠത്തിൽ ‘പുത്രൻ’ എന്ന നാമം പ്രത്യക്ഷമല്ല; അതിനാൽ പ്രധാനപാഠം ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു. പദം ഏകത്വം/അതുല്യത സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായ ‘ഏകജാതപുത്രൻ’ എന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐσκήνωσεν എന്നതിലെ സമാഗമകൂടാരസാദൃശ്യം എത്രമാത്രം മുൻനിരയിൽ കൊണ്ടുവരണം
  choice: നമ്മുടെ ഇടയിൽ വസിച്ചു
  alternative: നമ്മുടെ ഇടയിൽ കൂടാരമടിച്ചു വസിച്ചു
  rationale: പ്രധാനപാഠത്തിന്റെ സ്വാഭാവികത കാത്തുകൊണ്ട്, മരുഭൂമിയിലെ കൂടാരവും ദൈവസാന്നിധ്യവും ഓർമിപ്പിക്കുന്ന പദസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: πλήρης എന്ന വിശേഷണം വ്യാകരണപരമായി ആരെ വിശേഷിപ്പിക്കുന്നു
  choice: ‘മഹത്ത്വം’ ആവർത്തിച്ച് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കി
  alternative: ‘അവൻ കൃപയും സത്യവും നിറഞ്ഞവനായിരുന്നു’
  rationale: ഗ്രീക്കിലെ πλήρης നാമനിർദ്ദേശക രൂപം വചനത്തെയോ ഏകജാതനെയോ വിശേഷിപ്പിക്കുന്നതായി വായിക്കപ്പെടുന്നു; മലയാളത്തിലെ അവസാനത്തെ ‘മഹത്ത്വം’ കാവ്യാത്മകമായി ബന്ധിപ്പിച്ചാലും അത് മഹത്ത്വം തന്നെയാണ് കൃപയും സത്യവും നിറഞ്ഞത് എന്നു തെറ്റിദ്ധരിപ്പിക്കാം. അതിനാൽ ഈ സാധ്യത പുനഃപരിശോധനാവിഷയമാണ്; ദൈവശാസ്ത്രപരമായ സംഘർഷം മായ്ച്ചുകളയാതെ പാഠത്തിന്റെ ഒഴുക്ക് കാക്കാൻ ശ്രമിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾപദങ്ങളായ ‘വചനം’, ‘ജഡം’, ‘മഹത്ത്വം’, ‘കൃപ’, ‘സത്യം’ എന്നിവ അവയുടെ യോഹന്നാനീയ ഭാരം കാരണം നിലനിർത്തി; അത്യന്തം പുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
