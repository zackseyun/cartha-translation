reference: John 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: ml
  text: 'യോഹന്നാൻ അവനെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നു; അവൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞിരിക്കുന്നു: “എന്റെ പിന്നാലെ വരുന്നവൻ എന്നെക്കാൾ മുന്നിലായിത്തീർന്നിരിക്കുന്നു[a], കാരണം അവൻ എനിക്കു മുമ്പായിരുന്നു[b]” എന്നു ഞാൻ പറഞ്ഞത് ഇവനെക്കുറിച്ചായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെക്കാൾ മുൻഗണന നേടിയിരിക്കുന്നു” / “എന്നെ മറികടന്നിരിക്കുന്നു.” ഗ്രീക്ക് പ്രയോഗം ക്രമത്തിലെ മുൻസ്ഥാനം മാത്രമല്ല, പദവിയിലോ പ്രാധാന്യത്തിലോ ഉള്ള മുൻഗണനയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ എനിക്കു മുമ്പേ അസ്തിത്വത്തിലുണ്ടായിരുന്നു.” മുഖ്യവാചകത്തിലെ “എനിക്കു മുമ്പായിരുന്നു” എന്നത് ഗ്രീക്കിനോട് കൂടുതൽ അടുത്തുനിൽക്കുകയും സന്ദർഭത്തിൽ മുൻഅസ്തിത്വത്തിന്റെ സൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: സാക്ഷ്യം പറയുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവവും തുടരുന്നതുമായ സാക്ഷ്യഭാവം നിലനിർത്തുന്നു; സാധാരണ ആധുനിക മലയാളത്തിലും നിയമസാക്ഷ്യത്തിന്റെ അർഥവും വ്യക്തമാണ്.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive എന്ന ഘടനയുടെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: κέκραγεν
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞിരിക്കുന്നു
  rationale: ക്രിയയുടെ perfect രൂപത്തിലുള്ള, നടന്നതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ പ്രഖ്യാപനഭാവം ‘പറഞ്ഞിരിക്കുന്നു’ വഴി സൂചിപ്പിക്കുന്നു; ‘ഉറക്കെ വിളിച്ച്’ എന്ന അർഥവും വ്യക്തമായി നൽകുന്നു.
- source_word: λέγων
  choice: '— എന്ന് പറഞ്ഞുവോ / വിളിച്ചുപറഞ്ഞിരിക്കുന്നു:'
  rationale: മലയാളത്തിലെ നേരിട്ടുള്ള ഉദ്ധരണിഘടനയിൽ participial linkage സ്വാഭാവികമായി സംയോജിപ്പിച്ചു.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: ഞാൻ ആരെക്കുറിച്ച് … എന്നു പറഞ്ഞുവോ, അവൻ ഇവനായിരുന്നു
  rationale: ἦν എന്ന ഭൂതകാലവും relative construction-ഉം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: എന്റെ പിന്നാലെ വരുന്നവൻ
  rationale: substantival participle-ന്റെ ചലനവും ക്രമപരമായ ‘പിന്നാലെ’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: എന്നെക്കാൾ മുമ്പനായിത്തീർന്നിരിക്കുന്നു
  rationale: γέγονεν എന്ന perfect രൂപത്തിലെ ‘ആയിത്തീർന്നിരിക്കുന്നു’ എന്ന ഭാവവും ἔμπροσθεν എന്ന മുൻഗണന/സ്ഥാനം സൂചിപ്പിക്കുന്ന ഭാഷയും അമിതവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: πρῶτός μου ἦν
  choice: അവൻ എനിക്കു മുമ്പായിരുന്നു
  rationale: മുൻകാലത്വമോ മുൻഗണനയോ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമായും വ്യാഖ്യാനവികാസമില്ലാതെയും സൂക്ഷിക്കുന്നു; സന്ദർഭം മുൻഅസ്തിത്വത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ അനുവദിക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യം ക്രിസ്തുവിന്റെ മുൻഅസ്തിത്വത്തെ എത്രമാത്രം തുറന്നുപറയണം
  choice: πρῶτός μου ἦν എന്നത് ‘അവൻ എനിക്കു മുമ്പായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ എനിക്കു മുമ്പേ അസ്തിത്വത്തിലുണ്ടായിരുന്നു’ / ‘അവൻ എനിക്കു മുമ്പേ ഉണ്ടായിരുന്നു’
  rationale: വാക്യം ക്രിസ്തുവിന്റെ മുൻഅസ്തിത്വത്തെയും ശ്രേഷ്ഠതയെയും ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തേക്കാൾ വിശദമായ അസ്തിത്വഭാഷ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സന്ദർഭപരമായ ശക്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സാക്ഷ്യം പറയുന്നു’, ‘വിളിച്ചുപറഞ്ഞിരിക്കുന്നു’ എന്നിവ യോഹന്നാന്റെ സാക്ഷ്യത്തിന്റെയും പ്രഖ്യാപനത്തിന്റെയും ശക്തി നിലനിർത്തുന്നു. ഉദ്ധരണിക്കുള്ളിലെ സങ്കീർണ relative construction മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം പുനഃക്രമീകരിച്ചെങ്കിലും മൂലപാഠത്തിലെ കാലഭേദങ്ങളും ആവർത്തിച്ച ‘മുമ്പ്’ ഭാഷയും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
