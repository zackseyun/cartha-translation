- from: 'ഞാനും അവനെ അറിഞ്ഞിരുന്നില്ല.[a] എന്നാൽ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കാൻ എന്നെ അയച്ചവൻ എന്നോടു പറഞ്ഞു: ‘ആരുടെമേൽ ആത്മാവ് ഇറങ്ങിവന്നു നിലനിൽക്കുന്നതായി നീ കാണുന്നുവോ,[b] അവനാണ് പരിശുദ്ധാത്മാവിൽ സ്നാനം കഴിപ്പിക്കുന്നവൻ.’'
  to: 'ഞാനും അവനെ അറിഞ്ഞിരുന്നില്ല.[a] എന്നാൽ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കാൻ എന്നെ അയച്ചവൻ എന്നോടു പറഞ്ഞു: ‘നീ ആരുടെമേൽ ആത്മാവ് ഇറങ്ങിവരുന്നതും നിലനിൽക്കുന്നതും കാണുന്നുവോ,[b] അവനാണ് പരിശുദ്ധാത്മാവിൽ സ്നാനം കഴിപ്പിക്കുന്നവൻ.’'
  rationale: ആത്മാവിന്റെ ഇറങ്ങിവരലിനെയും നിലനിൽക്കലിനെയും വിവരിക്കുന്ന രണ്ടു വർത്തമാന കൃതന്തങ്ങളുടെ സമാന്തരം മലയാളത്തിൽ ‘ഇറങ്ങിവരുന്നതും നിലനിൽക്കുന്നതും’ എന്ന് പുനഃസ്ഥാപിച്ചു. മറ്റു പദപ്രയോഗങ്ങളും അടിക്കുറിപ്പുകളും മൂലപാഠത്തോടും ആധുനിക മലയാള ഉപയോഗത്തോടും യോജിക്കുന്നതിനാൽ മാറ്റിയിട്ടില്ല.
