id: JHN.1.33
reference: John 1:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: ml
  text: 'ഞാനും അവനെ അറിഞ്ഞിരുന്നില്ല.[a] എന്നാൽ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കാൻ എന്നെ അയച്ചവൻ എന്നോടു പറഞ്ഞു: ‘നീ ആരുടെമേൽ ആത്മാവ് ഇറങ്ങിവരുന്നതും നിലനിൽക്കുന്നതും കാണുന്നുവോ,[b] അവനാണ് പരിശുദ്ധാത്മാവിൽ സ്നാനം കഴിപ്പിക്കുന്നവൻ.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാനും അവനെ തിരിച്ചറിഞ്ഞിരുന്നില്ല.” സന്ദർഭത്തിൽ ഗ്രീക്ക് പ്രയോഗം പരിചയമില്ലായ്മയെയോ തിരിച്ചറിയാതിരിക്കലെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “നിലനിൽക്കുക” എന്ന് പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയ യോഹന്നാന്റെ രചനകളിൽ പ്രധാനപ്പെട്ടതാണ്; ഇതിനെ “വസിക്കുക” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: ഞാനും അവനെ അറിഞ്ഞിരുന്നില്ല
  rationale: κἀγώയിലെ തുടർച്ചയും ഊന്നലും ‘ഞാനും’ നിലനിർത്തുന്നു. οὐκ ᾔδειν മുൻകാലത്തെ അറിവില്ലായ്മയെയോ തിരിച്ചറിയാതിരിക്കലെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള ‘അറിഞ്ഞിരുന്നില്ല’ സ്വീകരിച്ചു.
- source_word: ὁ πέμψας με βαπτίζειν ἐν ὕδατι
  choice: വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കാൻ എന്നെ അയച്ചവൻ
  rationale: നാമവൽക്കരിച്ച കൃതന്തത്തിന്റെ നിർദിഷ്ടത ‘അയച്ചവൻ’ എന്നതിലൂടെ സ്വാഭാവികമായി വരുന്നു. ἐν എന്ന ഒരേ ഉപസർഗം പിന്നീടുള്ള ആത്മാവിലെ സ്നാനത്തിലും ഉള്ളതിനാൽ ‘വെള്ളത്തിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: ആരുടെമേൽ ... നീ കാണുന്നുവോ
  rationale: തിരിച്ചറിയാനുള്ള അടയാളം അവതരിപ്പിക്കുന്ന അനിശ്ചിത ബന്ധവാക്യത്തിന്റെ സ്വഭാവം മലയാളത്തിലെ ‘ആരുടെമേൽ ... കാണുന്നുവോ’ എന്ന ഘടന സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: ആത്മാവ് ഇറങ്ങിവന്നു നിലനിൽക്കുന്നതായി
  rationale: καταβαίνωയുടെ താഴോട്ടുള്ള ചലനവും μένωയുടെ യോഹന്നാനീയ പ്രാധാന്യമുള്ള ‘നിലനിൽക്കുക’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു. ആവർത്തിച്ച ἐπ’ αὐτόν മലയാളത്തിൽ അനാവശ്യമായതിനാൽ ബന്ധഘടനയിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: അവനാണ് പരിശുദ്ധാത്മാവിൽ സ്നാനം കഴിപ്പിക്കുന്നവൻ
  rationale: οὗτός ἐστιν എന്ന തിരിച്ചറിയൽ സൂത്രത്തിന്റെ ഊന്നൽ ‘അവനാണ്’ നൽകുന്നു. ഇപ്പോഴത്തെ കൃതന്തത്തെ ‘സ്നാനം കഴിപ്പിക്കുന്നവൻ’ എന്നും ἐν എന്നത് ‘-യിൽ’ എന്നും നിലനിർത്തി.
theological_decisions:
- issue: πνεῦμα / πνεύματι ἁγίῳ എന്നതിന്റെ ദൈവിക പരാമർശം
  choice: ആത്മാവ് ... പരിശുദ്ധാത്മാവ്
  alternative: ആത്മാവ് ... പരിശുദ്ധ ആത്മാവ്
  rationale: അവസാനത്തെ πνεύματι ἁγίῳ ആദ്യത്തെ ആത്മാവിന്റെ ദൈവിക പരാമർശം വ്യക്തമാക്കുന്നു. മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ഏകപദരൂപമായ ‘പരിശുദ്ധാത്മാവ്’ ഉപയോഗിക്കുന്നത് അധിക സിദ്ധാന്താർഥം ചേർക്കുന്നില്ല.
- issue: രണ്ടു സ്നാനവാക്യങ്ങളിലുമുള്ള ἐν
  choice: വെള്ളത്തിൽ ... പരിശുദ്ധാത്മാവിൽ
  alternative: വെള്ളംകൊണ്ട് ... പരിശുദ്ധാത്മാവുകൊണ്ട്
  rationale: മൂലപാഠം രണ്ടു സ്ഥാനത്തും ഒരേ ഉപസർഗം ഉപയോഗിക്കുന്നു. ‘-യിൽ’ എന്ന സമാന്തരരൂപം ആ ബന്ധം നിലനിർത്തുകയും ഉപാധി/മാധ്യമം എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: οὐκ ᾔδειν എന്നതിലെ അറിവോ തിരിച്ചറിവോ
  choice: അറിഞ്ഞിരുന്നില്ല
  alternative: തിരിച്ചറിഞ്ഞിരുന്നില്ല
  rationale: ക്രിയയ്ക്ക് സന്ദർഭത്തിൽ ഇരു സാധ്യതയും ഉണ്ട്. കൂടുതൽ നേരിട്ടുള്ള അർഥം മുഖ്യപാഠത്തിൽ നൽകി, തിരിച്ചറിയൽ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സ്നാനം കഴിപ്പിക്കുക’ എന്ന രൂപം βαπτίζωയുടെ കർത്തൃപ്രയോഗം വ്യക്തമാക്കുന്നു. മൂലത്തിലെ ἐν ... ἐν സമാന്തരത ‘വെള്ളത്തിൽ ... പരിശുദ്ധാത്മാവിൽ’ എന്ന് നിലനിർത്തി; അവ്യക്തത അനാവശ്യമായി തീർപ്പാക്കിയിട്ടില്ല.
