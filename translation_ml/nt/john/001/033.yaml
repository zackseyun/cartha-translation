  source_fidelity: 'മുഖ്യ അർഥവും വാക്യഘടനയും പൊതുവേ ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: യോഹന്നാന്റെ മുൻകാല അറിവില്ലായ്മ, വെള്ളത്തിലുള്ള സ്നാനം, ആത്മാവിന്റെ അടയാളം, പരിശുദ്ധാത്മാവിലുള്ള സ്നാനം എന്നിവ ശരിയായി സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ καταβαῖνον എന്ന വർത്തമാന കൃതന്തം ‘ഇറങ്ങിവന്നു’ എന്ന പൂർത്തിഭാവരൂപത്തിൽ വരുന്നത് മൂലത്തിലെ ‘ഇറങ്ങിവരുന്നതും’ എന്ന നിരീക്ഷണപ്രക്രിയയെ ക്ഷയിപ്പിക്കുന്നു.'
  naturalness: ‘നീ ആരുടെമേൽ ആത്മാവ് ഇറങ്ങിവരുന്നതും നിലനിൽക്കുന്നതും കാണുന്നുവോ’ എന്ന രൂപം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. അത് ആത്മാവിന്റെ രണ്ടു സമാന്തര പ്രവൃത്തികളെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
  terminology: ‘സ്നാനം കഴിപ്പിക്കുക,’ ‘ആത്മാവ്,’ ‘പരിശുദ്ധാത്മാവ്’ എന്നിവ ഗൗരവമുള്ള ആധുനിക ബൈബിൾരജിസ്റ്ററിൽ സ്വാഭാവികവും യോജിച്ചതുമാണ്. ‘വെള്ളത്തിൽ ... പരിശുദ്ധാത്മാവിൽ’ എന്ന സമാന്തരം ഗ്രീക്കിലെ ἐν ... ἐν നിലനിർത്തുന്നു.
  issues:
  - severity: medium
