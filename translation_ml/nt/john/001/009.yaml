id: JHN.1.9
reference: John 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: ml
  text: ഓരോരുത്തരെയും പ്രകാശിപ്പിക്കുന്ന യഥാർഥമായ വെളിച്ചം[a] ലോകത്തിലേക്കു വരികയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ലോകത്തിലേക്കു വരുന്ന ഓരോരുത്തരെയും പ്രകാശിപ്പിക്കുന്ന യഥാർഥമായ വെളിച്ചം ഉണ്ടായിരുന്നു.” ‘വരുന്ന’ എന്ന ഗ്രീക്ക് കൃദന്തം ‘യഥാർഥമായ വെളിച്ചം’ എന്നതിനുപകരം ‘ഓരോരുത്തരെയും’ എന്നതിനോട് ചേർത്തും വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: സാധാരണ നാമപദമായ φῶς-ന്റെ സ്വാഭാവിക മലയാളരൂപം; യോഹന്നാന്റെ സന്ദർഭത്തിലെ ക്രിസ്തുസൂചന നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി വ്യക്തിനാമസ്വഭാവം നൽകുന്നില്ല.
- source_word: ἀληθινόν
  choice: യഥാർഥ
  rationale: വസ്തുതാപരമായി ശരി എന്നതിലുപരി അസലായതും പരമമായ യാഥാർഥ്യമുള്ളതുമായ യോഹന്നാനീയ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: φωτίζει
  choice: പ്രകാശിപ്പിക്കുന്ന
  rationale: വെളിച്ചം നൽകുക എന്ന നേരാർഥവും ആത്മീയ/രൂപകാലങ്കാരപരമായ അർഥസാധ്യതയും ഒരുമിച്ച് നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: πάντα ἄνθρωπον
  choice: ഓരോ മനുഷ്യനെയും
  rationale: ഏകവചന സർവസാധാരണ പ്രയോഗത്തിന്റെ രൂപം പരമാവധി സൂക്ഷിക്കുകയും എല്ലാ മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു വരികയായിരുന്നു
  rationale: പ്രധാനവായനയിൽ കർത്താവായ ‘യഥാർഥ വെളിച്ചം’ ലോകത്തിലേക്കു വരുന്നതായി സ്വീകരിക്കുന്നു; ഗ്രീക്കിലെ യഥാർഥ ഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κόσμον
  choice: ലോകം
  rationale: κόσμος എന്ന പദത്തിന്റെ യോഹന്നാനിലെ പതിവും സന്ദർഭോചിതവുമായ മലയാളസമം.
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: അപൂർണഭൂതകാലഭാവം ‘വരികയായിരുന്നു’ എന്ന സംയുക്തക്രിയയിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐρχόμενον (‘വരുന്ന’) ഏതിനോടാണ് വ്യാകരണപരമായി ചേരുന്നത്?
  choice: 'അർഥപരമായി ‘യഥാർഥ വെളിച്ചം’ എന്നതിനോട് ചേർത്ത്: ‘ലോകത്തിലേക്കു വരികയായിരുന്നു.’'
  alternative: '‘ഓരോ മനുഷ്യനെയും’ എന്നതിനോട് ചേർത്ത്: ‘ലോകത്തിലേക്കു വരുന്ന ഓരോ മനുഷ്യനെയും പ്രകാശിപ്പിക്കുന്ന യഥാർഥ വെളിച്ചം ഉണ്ടായിരുന്നു.’'
  rationale: ἐρχόμενον എന്ന ഗ്രീക്ക് കൃദന്തം വ്യാകരണപരമായി ἄνθρωπον എന്നതിനോട് ചേരാം. എന്നാൽ യോഹന്നാനിലെ സമാനമായ ‘ലോകത്തിലേക്കു വരുക’ എന്ന ക്രിസ്തുസൂചക പ്രയോഗങ്ങളും മുഖവുരയുടെ പ്രമേയവും പ്രധാനവായനയെ പിന്തുണയ്ക്കുന്നു. യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യഥാർഥ വെളിച്ചം’ എന്ന സാധാരണ നാമപദപ്രയോഗം നിലനിർത്തി; ഘടനാസന്ദിഗ്ധത പ്രധാനവാചകത്തിൽ നിർബന്ധമായി പരിഹരിക്കാതെ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
