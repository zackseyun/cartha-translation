  language: ml
  text: ഞാനും അവനെ അറിഞ്ഞിരുന്നില്ല[a]. എന്നാൽ, അവൻ ഇസ്രായേലിനു വെളിപ്പെടേണ്ടതിന്, ഞാൻ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിച്ചുകൊണ്ട് വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ തിരിച്ചറിഞ്ഞിരുന്നില്ല.’ വ്യക്തിപരമായി അറിയാതിരുന്നതിനെയോ തിരിച്ചറിയാതിരുന്നതിനെയോ ഗ്രീക്ക് പദം സൂചിപ്പിക്കാം; മുഖ്യവാചകം വിശാലമായ അർഥം നിലനിർത്തുന്നു.
    reason: lexical_alternative
