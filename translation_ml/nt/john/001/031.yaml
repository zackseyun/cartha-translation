theological_decisions:
- issue: യോഹന്നാൻ യേശുവിനെ ‘അറിഞ്ഞിരുന്നില്ല’ എന്നതിന്റെ വ്യാപ്തി
  choice: അവനെ അറിഞ്ഞിരുന്നില്ല
  alternative: അവനെ തിരിച്ചറിഞ്ഞിരുന്നില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗം വ്യക്തിപരമായ പരിചയമില്ലായ്മയെയും തിരിച്ചറിയാതിരിക്കലിനെയും അനുവദിക്കാം. മശീഹയായി അറിഞ്ഞിരുന്നില്ല എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്നാനം കഴിപ്പിക്കുക’ സഭാപരമായി പരിചിതമാണെങ്കിലും സ്നാനത്തിന്റെ രീതിയെ വാചകത്തിനപ്പുറം നിർവചിക്കുന്നില്ല; ‘വെള്ളത്തിൽ’ എന്നത് മൂലത്തിലെ ἐν ὕδατι സംരക്ഷിക്കുന്നു.
