  source_fidelity: പ്രധാനവാക്യം SBLGNT-യിലെ ക്രമവും സൂചനയും പൊതുവേ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു. എന്നാൽ മൂലപാഠത്തിലെ വിശദീകരണപരാന്തസിസ് ഉദ്ധരണിക്കുള്ളിലെ ‘മശീഹ’യോടു നേരിട്ട് ചേരേണ്ടതാണ്; കരടിൽ അത് റിപ്പോർട്ടിങ് ക്രിയയ്ക്കു ശേഷമുള്ള വേറിട്ട വാക്യമായി മാറിയിരിക്കുന്നു. χριστός-ന്റെ അർഥവ്യാഖ്യാനമായി ‘അഭിഷിക്തൻ’ സുരക്ഷിതമാണ്.
