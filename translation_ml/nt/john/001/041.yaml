revisions:
- from: അവൻ ആദ്യം സ്വന്തം സഹോദരനായ ശിമോനെ കണ്ടെത്തി, “ഞങ്ങൾ മശീഹയെ കണ്ടെത്തിയിരിക്കുന്നു” എന്ന് അവനോടു പറഞ്ഞു. (“മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയാൽ “അഭിഷിക്തൻ” എന്നാണ്.)[a][b]
  to: 'അവൻ ആദ്യം[b] സ്വന്തം സഹോദരനായ ശിമോനെ കണ്ടെത്തി; അവനോടു പറഞ്ഞു: “ഞങ്ങൾ മശീഹയെ കണ്ടെത്തിയിരിക്കുന്നു” (അതായത്, “അഭിഷിക്തൻ”).'
  rationale: പരാന്തസിസ് ‘മശീഹ’യ്ക്കു തൊട്ടുപിന്നാലെ സ്ഥാപിച്ച് മൂലപാഠത്തിലെ വിശദീകരണബന്ധം പുനഃസ്ഥാപിച്ചു. χριστός-ന്റെ വിശദീകരണസ്വഭാവം നിലനിർത്താൻ ‘അഭിഷിക്തൻ’ ഉപയോഗിച്ചു; അനാവശ്യമായ പരമ്പരാഗത-രൂപക്കുറിപ്പ് ഒഴിവാക്കി. πρῶτον-നുള്ള പാഠഭേദക്കുറിപ്പ് അതത് പദത്തിൽ തന്നെ ആങ്കർ ചെയ്തു.
