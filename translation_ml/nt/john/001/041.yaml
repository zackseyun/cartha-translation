id: JHN.1.41
reference: John 1:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: ml
  text: 'അവൻ ആദ്യം[b] സ്വന്തം സഹോദരനായ ശിമോനെ കണ്ടെത്തി; അവനോടു പറഞ്ഞു: “ഞങ്ങൾ മശീഹയെ കണ്ടെത്തിയിരിക്കുന്നു” (അതായത്, “അഭിഷിക്തൻ”).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ആദ്യം’ എന്നതിനുപകരം ‘ആദ്യനായവൻ’ എന്നു വായിക്കുന്നു; അപ്പോൾ അർഥം: “സ്വന്തം സഹോദരനായ ശിമോനെ ആദ്യം കണ്ടെത്തിയത് അവനായിരുന്നു.”'
    reason: SBLGNT-യിലെ πρῶτον (‘ആദ്യം’) എന്ന വായനയ്ക്കു പകരമുള്ള πρῶτος (‘ആദ്യനായവൻ’) എന്ന പാഠഭേദവും അതിന്റെ അർഥവ്യത്യാസവും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: εὑρίσκει
  choice: കണ്ടെത്തി
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ഭൂതകാലം ഉപയോഗിച്ചു.
- source_word: οὗτος
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ ഇത് അന്ത്രയോസിനെ സൂചിപ്പിക്കുന്നു; ‘ഇവൻ’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ ‘അവൻ’ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമാണ്.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: ശിമോനെ കണ്ടെത്തിയത് അന്ത്രയോസിന്റെ ആദ്യ പ്രവൃത്തിയായിരുന്നു എന്ന ക്രമസൂചന നിലനിർത്തുന്നു; പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: സ്വന്തം സഹോദരനായ
  rationale: ἴδιον നൽകുന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു; ശിമോനുമായുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘സഹോദരനായ’ എന്നു ചേർത്തു.
- source_word: Σίμωνα
  choice: ശിമോൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: λέγει αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലമാക്കി; ‘പറഞ്ഞു’ ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തതാണ്.
- source_word: Εὑρήκαμεν
  choice: ഞങ്ങൾ ... കണ്ടെത്തിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് perfect രൂപത്തിന്റെ പൂർത്തിയായ കണ്ടെത്തലും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിലെ ‘കണ്ടെത്തിയിരിക്കുന്നു’ സംരക്ഷിക്കുന്നു.
- source_word: Μεσσίαν
  choice: മശീഹ
  rationale: സെമിറ്റിക് മശീഹാ പദത്തിന്റെ പേരുപോലുള്ള ലിപ്യന്തരണം നിലനിർത്തി, യഹൂദ മശീഹാപശ്ചാത്തലം സംരക്ഷിക്കുന്നു.
- source_word: μεθερμηνευόμενον
  choice: പരിഭാഷപ്പെടുത്തിയാൽ ... എന്നാണ്
  rationale: സെമിറ്റിക് പദത്തിന് ഗ്രീക്ക് സമാനപദം നൽകുന്ന വിശദീകരണസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: χριστός
  choice: അഭിഷിക്തൻ
  rationale: χριστός എന്ന പദത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നതിനാൽ, വിശദീകരണപരമായ പരാന്തസിസിന്റെ ഉദ്ദേശ്യം മലയാളവായനക്കാരനും ഗ്രഹിക്കാം; പരമ്പരാഗത ‘ക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: മശീഹാ പദവും χριστός എന്ന വിശദീകരണവും എങ്ങനെ അവതരിപ്പിക്കണം
  choice: പ്രധാനവാക്യത്തിൽ ‘മശീഹ’; വിശദീകരണത്തിൽ ‘അഭിഷിക്തൻ’
  alternative: ‘മശീഹ ... അതായത് ക്രിസ്തു’
  rationale: മൂലപാഠത്തിൽ സെമിറ്റിക് Μεσσίας എന്ന പദത്തെ ഗ്രീക്ക് χριστός ഉപയോഗിച്ച് വിശദീകരിക്കുന്നു. രണ്ടും കടംകൊണ്ട പദങ്ങളായി മാത്രം നൽകിയാൽ വിശദീകരണത്തിന്റെ അർഥം മങ്ങും. അതിനാൽ χριστός എന്നതിന്റെ അർഥം ‘അഭിഷിക്തൻ’ എന്നു പ്രധാനപാഠത്തിൽ നൽകി, പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: πρῶτον എന്ന പാഠത്തിന്റെ വ്യാകരണബന്ധം
  choice: ‘അവൻ ആദ്യം ... കണ്ടെത്തി’
  alternative: ‘സ്വന്തം സഹോദരനെ ആദ്യം കണ്ടെത്തിയത് അവനായിരുന്നു’
  rationale: SBLGNT പ്രധാനപാഠത്തിലെ πρῶτον ക്രിയാവിശേഷണവായന പിന്തുടർന്നു. πρῶτος എന്ന പാഠഭേദം അന്ത്രയോസിനാണ് മുൻഗണന നൽകുന്നത്; യഥാർഥ പാഠപരവും അർഥപരവുമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സ്വന്തം’ എന്ന ഊന്നലും perfect ക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും നിലനിർത്തി. ദൈവശാസ്ത്രപരമായ പാരമ്പര്യപദം മാത്രം ആവർത്തിച്ച് മൂലത്തിലെ വിശദീകരണബന്ധം മറയ്ക്കാതെ, സാധാരണ വായനക്കാരന് അർഥം വ്യക്തമാകുന്ന രൂപം തിരഞ്ഞെടുത്തു.
