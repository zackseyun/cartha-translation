id: JHN.1.43
reference: John 1:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: ml
  text: 'പിറ്റേന്ന് യേശു ഗലീലയിലേക്കു പുറപ്പെടാൻ ആഗ്രഹിച്ചു. അവൻ ഫിലിപ്പോസിനെ കണ്ടെത്തി അവനോട് പറഞ്ഞു: “എന്നെ അനുഗമിക്കുക.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെ അനുഗമിക്കുക” എന്നതിന് യേശുവിനൊപ്പം ചെല്ലുക എന്ന അർഥവും അവന്റെ ശിഷ്യനായി പിന്തുടരുക എന്ന വിശാലമായ അർഥവും ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: ആഖ്യാനത്തിലെ തുടർച്ച സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἠθέλησεν
  choice: ആഗ്രഹിച്ചു
  rationale: θέλω എന്ന പദത്തിലെ ഇച്ഛയുടെയും ഉദ്ദേശ്യത്തിന്റെയും ഭാവം നിലനിർത്തുന്നു; ‘തീരുമാനിച്ചു’ എന്നു പറഞ്ഞ് ആലോചനാപൂർവമായ തീരുമാനത്തെ അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: ഗലീലയിലേക്കു പുറപ്പെടാൻ
  rationale: ἐξέρχομαι സൂചിപ്പിക്കുന്ന പുറപ്പെടലും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശയും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു.
- source_word: εὑρίσκει Φίλιππον
  choice: ഫിലിപ്പോസിനെ കണ്ടെത്തി
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനമായി നൽകുന്നു; സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λέγει αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കുക
  rationale: ശാരീരികമായി കൂടെ ചെല്ലുക എന്ന അർഥവും ശിഷ്യനായി പിന്തുടരുക എന്ന വിശാലമായ അർഥവും വാചകത്തിൽ തുറന്നുവെക്കുന്നു.
- source_word: Φίλιππον
  choice: ഫിലിപ്പോസ്
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: ഗ്രീക്കിൽ വ്യക്തമായിരിക്കുന്ന കർത്താവിനെ മലയാളത്തിലും നിലനിർത്തി സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഫിലിപ്പോസിനോടുള്ള യേശുവിന്റെ ആജ്ഞയുടെ വ്യാപ്തി
  choice: “എന്നെ അനുഗമിക്കുക” എന്ന നേരിട്ടുള്ള ആഹ്വാനം
  alternative: യേശുവിനൊപ്പം ശാരീരികമായി ചെല്ലാനുള്ള ക്ഷണം മാത്രം
  rationale: ἀκολούθει μοι ഉടൻ കൂടെ സഞ്ചരിക്കാനുള്ള അർഥവും ശിഷ്യത്വത്തിലേക്കുള്ള ആഹ്വാനവും വഹിക്കാൻ കഴിയും. വിവർത്തനം ഒന്നിനെ മാത്രം ഉറപ്പിക്കാതെ ഈ അർഥസാന്ദ്രത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനം അതേപടി പകർത്തുന്നത് മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ ഭൂതകാലം ഉപയോഗിച്ചു. ‘ഗലീലയിലേക്കു’ എന്നത് εἰς ന്റെ ലക്ഷ്യദിശ സ്വാഭാവികമായി നൽകുന്നു.
