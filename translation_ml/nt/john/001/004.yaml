  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: ml
  text: അവനിൽ ജീവൻ ഉണ്ടായിരുന്നു; ആ ജീവൻ മനുഷ്യരുടെ വെളിച്ചമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനുഷ്യരാശിയുടെ വെളിച്ചം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ പ്രയോഗം എല്ലാ മനുഷ്യരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: മുൻവാക്യത്തിലെ ‘വചനം’ എന്ന വ്യക്തിപരമായ പരാമർശത്തിലേക്കാണ് αὐτῷ വിരൽചൂണ്ടുന്നത്. ἐν എന്നതിന്റെ സ്വാഭാവിക അർഥമായ ‘-ൽ’ നിലനിർത്തുന്നു.
- source_word: ζωὴ
  choice: ജീവൻ
  rationale: ζωή എന്നതിന്റെ ലളിതവും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ് ‘ജീവൻ’. യോഹന്നാന്റെ രചനയിൽ ഇതിനുള്ള സമ്പന്നമായ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിച്ച് ചേർക്കാതെ സന്ദർഭത്തിൽ നിന്നുതന്നെ ഗ്രഹിക്കാനായി നിലനിർത്തുന്നു.
- source_word: ἦν
  choice: ഉണ്ടായിരുന്നു / ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ആദ്യ ഉപവാക്യത്തിൽ സ്വാഭാവികമായി ‘ഉണ്ടായിരുന്നു’ എന്നും നാമവിധേയ ഘടനയുള്ള രണ്ടാം ഉപവാക്യത്തിൽ ‘ആയിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: ἡ ζωὴ
  choice: ആ ജീവൻ
  rationale: ആവർത്തിക്കുന്ന നിർദേശക ഉപപദം മുമ്പ് പറഞ്ഞ ജീവനെ തിരിച്ചുസൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ അനാഫോറിക് ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ആ’ ഉപയോഗിച്ചു.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: φῶς എന്ന യോഹന്നാനീയ പ്രതീകത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. നിശ്ചിതത്വവും നാമവിധേയബന്ധവും ‘വെളിച്ചമായിരുന്നു’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωποι ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യരുടെ’ എന്നത് ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിബന്ധവും ഉൾക്കൊള്ളുന്ന പൊതുവായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതവും വ്യക്തിപരമായ ഭാവവും
  choice: വചനത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ‘അവനിൽ’
  alternative: ‘അതിൽ’, വചനത്തെ അമൂർത്തമായ ആശയമായി മാത്രം എടുത്താൽ
  rationale: യോഹന്നാൻ 1-ന്റെ അടുത്ത സന്ദർഭത്തിൽ വചനം വ്യക്തിപരമായ നിലയിൽ അവതരിപ്പിക്കപ്പെടുന്നു. അതിനാൽ വാക്യത്തിലില്ലാത്ത പിൽക്കാല ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കാതെ ‘അവനിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- issue: ἀνθρώπων എന്നതിന്റെ പൊതുവായ മാനവസൂചന
  choice: മനുഷ്യരുടെ
  alternative: മനുഷ്യരാശിയുടെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ഇവിടെ എല്ലാ മനുഷ്യരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യരുടെ’ ലിംഗഭേദമില്ലാത്തതും മൂലത്തിലെ ഷഷ്ഠിവിഭക്തി ഘടനയോട് അടുത്തതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാന്റെ ആമുഖത്തിലെ ആവർത്തനവും ‘ജീവൻ–വെളിച്ചം’ എന്ന പ്രതീകബന്ധവും നിലനിർത്തി.
