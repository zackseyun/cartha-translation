id: JHN.1.18
reference: John 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: ml
  text: ദൈവത്തെ ആരും ഒരിക്കലും കണ്ടിട്ടില്ല; പിതാവിന്റെ മടിയിലുള്ള ഏകനും അതുല്യനുമായ ദൈവം[a][b] അവിടത്തെ വെളിപ്പെടുത്തി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ഏകപുത്രൻ’ (അല്ലെങ്കിൽ ‘ഏകജാതനായ പുത്രൻ’) എന്നാണ് വായന; ഇത് ‘ഏകനും അതുല്യനുമായ ദൈവം’ എന്ന വായനയ്ക്കു പകരമുള്ള പാഠഭേദമാണ്.
    reason: textual_variant
  - marker: b
    text: ‘പിതാവിന്റെ അരികിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പിതാവിന്റെ മടിയിൽ’ എന്നാണ്; അത്യന്തം അടുത്ത ബന്ധമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവിടത്തെ വിശദീകരിച്ചു,’ ‘അവിടത്തെ വെളിപ്പെടുത്തി,’ അല്ലെങ്കിൽ ‘അവിടത്തെ അറിയിച്ചുതന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: ദൈവത്തെ
  rationale: ἑώρακεν എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; ഇവിടെ പരമദൈവത്തെ സൂചിപ്പിക്കുന്ന θεός എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οὐδεὶς ... πώποτε
  choice: ആരും ഒരിക്കലും ... ഇല്ല
  rationale: സാർവത്രിക നിഷേധവും ‘ഏതെങ്കിലും കാലത്ത്/ഒരിക്കലെങ്കിലും’ എന്ന πώποτεയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἑώρακεν
  choice: കണ്ടിട്ടില്ല
  rationale: നിഷേധത്തോടുകൂടിയ ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഇന്നുവരെയുള്ള വ്യാപ്തി മലയാളത്തിലെ പൂർണനിഷേധരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μονογενὴς θεὸς
  choice: ഏകവും അതുല്യനുമായ ദൈവം
  rationale: SBLGNTയിലെ θεός എന്ന വായന പിന്തുടരുന്നു. μονογενής ഇവിടെ ജനിപ്പിക്കപ്പെട്ടവൻ എന്നതിലുപരി ഏകത്വവും അനന്യതയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഏകവും അതുല്യനുമായ’ എന്നു നൽകി.
- source_word: ὁ ὢν
  choice: ഇരിക്കുന്ന
  rationale: തുടർന്നുനിൽക്കുന്ന ബന്ധാവസ്ഥയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃന്തത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: പിതാവിന്റെ മടിയിൽ
  rationale: κόλπος എന്ന ദേഹരൂപകവും അതിലൂടെ പ്രകടമാകുന്ന അത്യന്തം അടുത്ത ബന്ധവും സംരക്ഷിക്കുന്നു; ‘പിതാവിന്റെ അരികിൽ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἐκεῖνος
  choice: ദൈവമാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ ‘ആണ്’ ചേർന്ന വിധേയനിർമാണത്തിലൂടെ പ്രകടമാക്കുന്നു; വേറൊരു സർവനാമം ചേർത്താൽ മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമാകും.
- source_word: ἐξηγήσατο
  choice: വെളിപ്പെടുത്തിയത്
  rationale: വിവരിക്കുക, വ്യാഖ്യാനിക്കുക, അറിയിക്കുക എന്നീ അർത്ഥവ്യാപ്തികളിൽ സന്ദർഭാനുസൃതമായ ദൈവിക വെളിപ്പെടുത്തൽ വ്യക്തമായി നൽകുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: μονογενὴς θεὸς എന്ന വായനയും ὁ μονογενὴς υἱός എന്ന പാഠഭേദവും
  choice: പ്രധാനപാഠത്തിൽ SBLGNTയിലെ ‘ഏകവും അതുല്യനുമായ ദൈവം’ എന്ന വായന
  alternative: ‘ഏകപുത്രൻ’ അല്ലെങ്കിൽ ‘ഏകജാതനായ പുത്രൻ’
  rationale: നൽകിയ മൂലപാഠം μονογενὴς θεός എന്നാണ്. പ്രധാനമായ ഈ പാഠഭേദം നിശ്ശബ്ദമായി പരിഹരിക്കാതെ മറ്റൊരു പുരാതന വായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: μονογενής എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ഏകവും അതുല്യനുമായ
  alternative: ഏകജാതനായ
  rationale: ഈ സന്ദർഭത്തിലെ പദം പ്രാഥമികമായി അനന്യതയും ഒരേയൊരാളായ നിലയും സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായി സുപരിചിതമായ ‘ഏകജാതൻ’ എന്ന രൂപം പാഠഭേദത്തിന്റെ ഭാഗമായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ദൈവത്തെ വെളിപ്പെടുത്തുന്നവനും ‘ദൈവം’ എന്നു വിളിക്കപ്പെടുന്നതുമായ വ്യക്തിയുടെ പരാമർശം
  choice: വാക്യത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ സംഘർഷം അതേപടി നിലനിർത്തി
  alternative: ‘പുത്രൻ’ എന്നു പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക
  rationale: അച്ചടിച്ച ഗ്രീക്ക് പാഠം ദൈവത്തെ ആരും കണ്ടിട്ടില്ലെന്ന പ്രസ്താവനയ്ക്കു പിന്നാലെ μονογενὴς θεός എന്നു പറയുന്നു. വിവർത്തനം ഈ ഭാഷയെ മതസിദ്ധാന്തപരമായി ലളിതമാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കുന്ന സർവനാമമായി ആദരസൂചകമായ ‘അവിടത്തെ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ κόλπος എന്ന രൂപകം ‘മടിയിൽ’ എന്നു നിലനിർത്തുകയും, അസ്പഷ്ടതകളും പ്രധാന പാഠഭേദവും അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
