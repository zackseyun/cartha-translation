revisions:
- from: ദൈവത്തെ ആരും ഒരിക്കലും കണ്ടിട്ടില്ല; പിതാവിന്റെ മടിയിൽ ഇരിക്കുന്ന ഏകവും അതുല്യനുമായ ദൈവമാണ്[a][b] അവിടത്തെ വെളിപ്പെടുത്തിയത്.[c]
  to: ദൈവത്തെ ആരും ഒരിക്കലും കണ്ടിട്ടില്ല; പിതാവിന്റെ മടിയിലുള്ള ഏകനും അതുല്യനുമായ ദൈവം[a][b] അവിടത്തെ വെളിപ്പെടുത്തി.[c]
  rationale: 'The revision corrects the Malayalam adjective agreement, avoids an unnecessarily physical sense of ‘sitting’ while retaining the ‘bosom/lap’ metaphor, and aligns the lexical-alternative footnote with the audit trail. It retains the SBLGNT wording’s deliberate tension: the one identified as unique God makes God known, without doctrinal paraphrase.'
  reviewer_model: gpt-5.6-terra
