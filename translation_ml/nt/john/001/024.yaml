id: JHN.1.24
reference: John 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: ml
  text: അവർ പരീശന്മാരിൽനിന്ന് അയയ്ക്കപ്പെട്ടവരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ പരീശന്മാർ അയച്ചതായിരുന്നു.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, അവർ പരീശന്മാരിൽനിന്ന് അയയ്ക്കപ്പെട്ടവരായിരുന്നു എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ Καὶ മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധകമാണ്. ഒറ്റ വാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘പിന്നെ’ ചേർത്താൽ ഗ്രീക്കിൽ ഇല്ലാത്ത വ്യാഖ്യാനഭാവം വരാം; അതിനാൽ സ്വാഭാവികമായ വാക്യാരംഭത്തിനായി അത് പരോക്ഷമായി മാത്രം നിലനിർത്തി.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: അയയ്ക്കപ്പെട്ടിരുന്നവർ ... ആയിരുന്നു
  rationale: പൂർണകൃതന്തവും ἦσαν എന്ന ക്രിയയും ചേർന്ന പരിപ്രയോഗം മുമ്പ് നടന്ന അയയ്ക്കലിന്റെ ഫലമായ നില സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘അയയ്ക്കപ്പെട്ടിരുന്നവർ’ ഈ നില സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ
  choice: -ൽനിന്നുള്ളവർ
  rationale: ἐκ കർത്തൃത്വത്തേക്കാൾ ഉറവിടമോ കൂട്ടത്തിൽനിന്നുള്ള വരവോ നേരിട്ട് സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘പരീശന്മാരാൽ’ എന്നു പറഞ്ഞ് agency ഉറപ്പിക്കുന്നതിനുപകരം ‘പരീശന്മാരിൽനിന്നുള്ളവർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τῶν Φαρισαίων
  choice: പരീശന്മാർ
  rationale: Φαρισαῖοι എന്ന യഹൂദമതവിഭാഗത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ പേരാണ് ‘പരീശന്മാർ’.
theological_decisions:
- issue: ദൂതസംഘവും പരീശന്മാരും തമ്മിലുള്ള ബന്ധം
  choice: അവർ പരീശന്മാരിൽനിന്നുള്ളവരായിരുന്നു എന്ന ഉറവിട/ബന്ധ അർഥം നിലനിർത്തി.
  alternative: അവർ പരീശന്മാരാൽ അയയ്ക്കപ്പെട്ടവരായിരുന്നു.
  rationale: ἐκ + ജനിറ്റീവ് നേരിട്ട് സൂചിപ്പിക്കുന്നത് ഉറവിടമാണ്; പരീശന്മാർ അയച്ച കർത്താക്കളാണെന്ന അർഥം സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും വ്യാകരണം അതിനെ വ്യക്തമായി ഉറപ്പിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ ഈ വ്യത്യാസം തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അയയ്ക്കപ്പെട്ടിരുന്നവർ’ എന്ന രൂപം ഗ്രീക്കിലെ ഫലനില സൂക്ഷിക്കുന്നു; ‘പരീശന്മാരിൽനിന്നുള്ളവർ’ ഉറവിടവും കർത്തൃത്വവും തമ്മിലുള്ള യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
