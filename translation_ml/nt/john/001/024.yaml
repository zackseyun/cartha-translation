revisions:
- from: അയയ്ക്കപ്പെട്ടിരുന്നവർ പരീശന്മാരിൽനിന്നുള്ളവരായിരുന്നു.[a]
  to: അവർ പരീശന്മാരിൽനിന്ന് അയയ്ക്കപ്പെട്ടവരായിരുന്നു.[a]
  rationale: The revision places ‘പരീശന്മാരിൽനിന്ന്’ with ‘അയയ്ക്കപ്പെട്ടവരായിരുന്നു,’ reflecting the Greek construction while retaining its source/origin nuance. The footnote gives the contextually plausible agency reading as an alternative. No doctrinal interpretation is introduced.
