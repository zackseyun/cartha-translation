source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: ml
  text: 'നഥനയേൽ അവനോട് പറഞ്ഞു: “നസറെത്തിൽനിന്ന് എന്തെങ്കിലും നല്ലത് വരുമോ?[a]” ഫിലിപ്പോസ് അവനോട് പറഞ്ഞു: “വന്ന് കാണുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നസറെത്തിൽനിന്ന് എന്തെങ്കിലും നല്ലത് ഉണ്ടാകാൻ കഴിയുമോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: നഥനയേൽ അവനോട് പറഞ്ഞു
  rationale: καὶ എന്ന ലളിതമായ ബന്ധകത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം പദമായി ആവർത്തിക്കാതെ വാക്യക്രമത്തിലൂടെ സൂചിപ്പിക്കുന്നു; εἶπεν αὐτῷ എന്നത് ‘അവനോട് പറഞ്ഞു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐκ Ναζαρὲτ
  choice: നസറെത്തിൽനിന്ന്
  rationale: ἐκ ഉറവിടത്തെയോ ഉത്ഭവസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; സ്ഥലനാമത്തോടുകൂടിയ ‘-ൽനിന്ന്’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: എന്തെങ്കിലും നല്ലത് വരുമോ?
  rationale: δύναται സാധ്യതയെ സൂചിപ്പിക്കുന്നു; τι ἀγαθόν ‘എന്തെങ്കിലും നല്ലത്’ എന്നും, ἐκ എന്ന ഉറവിടപ്രയോഗത്തോടു ചേർന്ന εἶναι മലയാളത്തിൽ സ്വാഭാവികമായി ‘വരുക’ എന്നും നൽകി. കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ‘ഉണ്ടാകുക’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: ഫിലിപ്പോസ് അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനമായ λέγει മലയാള ആഖ്യാനത്തിന്റെ സ്വാഭാവിക ഭൂതകാലത്തിൽ നൽകി; കർത്താവും പരോക്ഷകർമവും വ്യക്തമായി നിലനിർത്തി.
- source_word: Ἔρχου καὶ ἴδε
  choice: വന്നു കാണുക
  rationale: രണ്ട് ഏകവചന ആജ്ഞകളെയും സംക്ഷിപ്തമായ ക്ഷണമായി നിലനിർത്തുന്നു; ‘കാണുക’ യോഹന്നാനിലെ കാണലിന്റെയും തിരിച്ചറിവിന്റെയും അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നസറെത്തിനെക്കുറിച്ചുള്ള നഥനയേലിന്റെ ചോദ്യത്തിന്റെ ഭാവം
  choice: സംശയം പ്രകടമാക്കുന്ന നേരിട്ടുള്ള അലങ്കാരചോദ്യമായി മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: പരിഹാസമോ അവജ്ഞയോ വ്യക്തമാക്കുന്ന വാക്കുകൾ ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം സംശയം സൂചിപ്പിക്കുന്നുവെങ്കിലും പരിഹാസത്തിന്റെയോ കടുത്ത അവജ്ഞയുടെയോ ഭാവം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നില്ല; അതിനാൽ അത്തരം വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി; ചോദ്യം സ്വാഭാവികമാക്കിയെങ്കിലും മൂലത്തിലെ അർഥവ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
