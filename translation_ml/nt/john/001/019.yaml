  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: ml
  text: 'യെഹൂദർ[a] യെരൂശലേമിൽനിന്ന് പുരോഹിതന്മാരെയും ലേവ്യരെയും അവനോടു, “നീ ആരാണ്?” എന്നു ചോദിക്കാനായി അയച്ചപ്പോൾ യോഹന്നാൻ നൽകിയ സാക്ഷ്യം ഇതാണ്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ മതനേതാക്കൾ” അല്ലെങ്കിൽ “യെഹൂദ്യർ.” യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദർ” എന്ന പ്രയോഗം പലപ്പോഴും യെഹൂദജനത്തെ മുഴുവനായി അല്ല, പ്രത്യേകിച്ച് യെഹൂദ്യയിലെ മതാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: സാക്ഷ്യം
  rationale: നിയമപരമായ സാക്ഷ്യധ്വനി നിലനിർത്തുന്നതും ഈ സന്ദർഭത്തിൽ യോഹന്നാൻ നൽകുന്ന സാക്ഷ്യവാക്കിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നതുമായ പദം.
- source_word: τοῦ Ἰωάννου
  choice: യോഹന്നാന്റെ
  rationale: യോഹന്നാനെക്കുറിച്ചുള്ള സാക്ഷ്യമെന്നല്ല, യോഹന്നാൻ നൽകുന്ന സാക്ഷ്യമെന്ന കർത്തൃജനിറ്റീവ് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὅτε
  choice: ചോദിച്ചപ്പോൾ
  rationale: സംഭവത്തിന്റെ സമയസന്ദർഭം അവതരിപ്പിക്കുന്ന temporal ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയോടു ചേർത്ത് നൽകുന്നു.
- source_word: ἀπέστειλαν
  choice: അയച്ച്
  rationale: സന്ദർഭത്തിന് യോജിച്ച ലളിതവും നേരിട്ടുമായ പരിഭാഷ.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്കിലെ കൂട്ടവിളിയെ മുഖ്യപാഠത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു; യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇതിന് പലപ്പോഴും കൂടുതൽ പരിമിതമായ അർഥമുണ്ടെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξ Ἱεροσολύμων
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: പുറപ്പെട്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: പുരോഹിതന്മാരെയും ലേവ്യരെയും
  rationale: ദേവാലയവുമായി ബന്ധപ്പെട്ട രണ്ടു വ്യത്യസ്ത വിഭാഗങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: അവന്റെ അടുക്കൽ അയച്ച് … എന്ന് ചോദിച്ചപ്പോൾ
  rationale: അയച്ചതിന്റെ ഉദ്ദേശ്യം മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Σὺ τίς εἶ;
  choice: നീ ആരാണ്?
  rationale: Σὺ എന്ന വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളചോദ്യം.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: മുഖ്യപാഠത്തിൽ “യെഹൂദർ” എന്നു നിലനിർത്തി, സന്ദർഭത്തിൽ യെഹൂദ്യ മതനേതൃത്വത്തെ പ്രത്യേകിച്ച് സൂചിപ്പിക്കാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: “യെഹൂദ മതനേതാക്കൾ” അല്ലെങ്കിൽ “യെഹൂദ്യർ” എന്നു മുഖ്യപാഠത്തിൽ നൽകുക.
  rationale: മൂലപദത്തിന്റെ യഥാർഥ വ്യാപ്തി മുൻകൂട്ടി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു; അതേസമയം മുഴുവൻ യെഹൂദജനത്തെയും ഉദ്ദേശിക്കുന്നതായി തെറ്റായി പൊതുവൽക്കരിക്കാതിരിക്കാൻ സന്ദർഭസൂചന നൽകുന്നു. യെരൂശലേമിൽനിന്ന് പുരോഹിതന്മാരെയും ലേവ്യരെയും അയച്ചത് അധികാരികളാണ് പ്രധാനമായി ഉദ്ദേശിക്കപ്പെട്ടിരിക്കുന്നത് എന്നു സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യാരംഭത്തിലെ “ഇതാണ്” ഘടന സാക്ഷ്യത്തെ മുൻനിർത്തുന്നു. ὅτε-ഉപവാക്യം മലയാളത്തിൽ “ചോദിച്ചപ്പോൾ” എന്ന സമയഘടനയായി നൽകി; തുടർന്നുള്ള വാക്യങ്ങളുമായി വിവരണബന്ധം സൂചിപ്പിക്കാൻ അവസാനം ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
