id: JHN.1.27
reference: John 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: ml
  text: എന്റെ പിന്നാലെ വരുന്നവൻ, അവന്റെ ചെരിപ്പിന്റെ വാറ് അഴിക്കാൻ ഞാൻ യോഗ്യനല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: എന്റെ പിന്നാലെ വരുന്നവൻ
  rationale: നിശ്ചയാർഥക അംഗത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഒരു പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘പിന്നാലെ വരുന്നവൻ’ ശുശ്രൂഷാക്രമത്തിലെ തുടർച്ച എന്ന ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു; കേവലം സ്ഥലപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: οὗ
  choice: അവന്റെ
  rationale: സംബന്ധസർവനാമത്തിന്റെ ഷഷ്ഠീവിഭക്തി ചെരിപ്പിന്റെ വാറിനോടുള്ള ഉടമസ്ഥബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവന്റെ’ എന്നത് ഏറ്റവും സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: ഞാൻ യോഗ്യനല്ല
  rationale: ἄξιος സൂചിപ്പിക്കുന്ന യോഗ്യതയില്ലായ്മയും യോഹന്നാന്റെ താഴ്മയും വ്യാഖ്യാനാതിക്രമമില്ലാതെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα λύσω
  choice: അഴിക്കാൻപോലും
  rationale: യോഗ്യതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിനു പിന്നാലെയുള്ള ἵνα + subjunctive മലയാളത്തിൽ ഉദ്ദേശിക്കപ്പെട്ട പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ക്രിയാനാമരൂപത്തിൽ സ്വാഭാവികമാണ്. ‘പോലും’ മൂലവാക്യത്തിലെ താഴ്മയുടെ ശക്തി മലയാളത്തിൽ വ്യക്തമായി എത്തിക്കുന്നു; പുതിയൊരു പ്രവൃത്തി ചേർക്കുന്നില്ല.
- source_word: ἱμάντα τοῦ ὑποδήματος
  choice: ചെരിപ്പിന്റെ വാറ്
  rationale: ἱμάς ചെരിപ്പ് കെട്ടുന്ന വാറിനെയും ὑπόδημα കാലിൽ കെട്ടുന്ന പാദരക്ഷയെയും സൂചിപ്പിക്കുന്നു. ‘ചെരിപ്പിന്റെ വാറ്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ചരിത്രസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
theological_decisions:
- issue: ‘എന്റെ പിന്നാലെ’ എന്നതും വരാനിരിക്കുന്ന വ്യക്തിയുമായുള്ള ബന്ധവും
  choice: ശുശ്രൂഷാക്രമത്തിലെ തുടർച്ച തുറന്നുവെക്കുന്ന ‘എന്റെ പിന്നാലെ വരുന്നവൻ’
  alternative: എന്റെ പിന്നിൽ വരുന്നവൻ
  rationale: യോഹന്നാന്റെ പിന്നാലെ ശുശ്രൂഷയിൽ പ്രത്യക്ഷപ്പെടുന്ന വ്യക്തിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. സമീപവാക്യങ്ങളിൽ കാണുന്ന ശ്രേഷ്ഠതയുടെ ആശയം ഈ ഉപവാക്യത്തിലേക്ക് പ്രത്യേകം ചേർക്കാതെ, സമയക്രമവും സാധ്യതയുള്ള സ്ഥാനരൂപകവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ വാക്യഖണ്ഡസ്വഭാവം അർദ്ധവിരാമത്തിലൂടെ നിലനിർത്തി. ഈ വാക്യത്തിന് പ്രത്യേക പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണക്കുറിപ്പോ ചേർത്തിട്ടില്ല.
