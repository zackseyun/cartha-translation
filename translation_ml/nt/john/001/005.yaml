id: JHN.1.5
reference: John 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: ml
  text: വെളിച്ചം ഇരുട്ടിൽ പ്രകാശിക്കുന്നു; ഇരുട്ട് അതിനെ കീഴടക്കിയിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരുട്ട് അതിനെ ഗ്രഹിച്ചിട്ടില്ല” അല്ലെങ്കിൽ “മനസ്സിലാക്കിയിട്ടില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കീഴടക്കുക എന്നും ഗ്രഹിക്കുക/മനസ്സിലാക്കുക എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: യോഹന്നാന്റെ ആമുഖത്തിലെ വിഷയാത്മകമായ വെളിച്ചത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നാമത്തിന്റെ നിർദിഷ്ടത സന്ദർഭത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക നിർദിഷ്ടോപാധി ചേർത്തിട്ടില്ല.
- source_word: σκοτίᾳ / σκοτία
  choice: ഇരുട്ട് / ഇരുട്ടിൽ
  rationale: വെളിച്ചത്തോടുള്ള വിഷയാത്മകവും വ്യക്തിവൽക്കരിക്കപ്പെട്ടതുമായ വിരോധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: φαίνει
  choice: പ്രകാശിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന, സജീവമായ പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατέλαβεν
  choice: കീഴടക്കിയിട്ടില്ല
  rationale: വെളിച്ചവും ഇരുട്ടും തമ്മിലുള്ള സംഘർഷബിംബത്തിൽ ‘overcome’ എന്ന അർഥം യോജിക്കുന്നു; അതേസമയം ഗ്രഹിക്കുക/മനസ്സിലാക്കുക എന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αὐτό
  choice: അതിനെ
  rationale: നപുംസകലിംഗമായ φῶς എന്ന പദത്തോടുള്ള വ്യാകരണസമ്മതി പിന്തുടരുന്നു; വിശാലസന്ദർഭത്തിലെ വചനത്തിന്റെ വ്യക്തിപരമായ സൂചനയെ ഈ വാക്യത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വെളിച്ചം–ഇരുട്ട് വിരോധത്തിൽ κατέλαβεν എന്ന ക്രിയയുടെ അർഥം
  choice: കീഴടക്കിയിട്ടില്ല
  alternative: അതിനെ ഗ്രഹിച്ചിട്ടില്ല / മനസ്സിലാക്കിയിട്ടില്ല / പിടിച്ചെടുത്തിട്ടില്ല
  rationale: ഗ്രീക്ക് ക്രിയയ്ക്ക് ബൗദ്ധികമായ ‘ഗ്രഹിക്കുക’ എന്നും വൈരപരമായ ‘പിടിച്ചടക്കുക/കീഴടക്കുക’ എന്നും അർഥമാകാം. ഉടനെയുള്ള വെളിച്ചം–ഇരുട്ട് ബിംബം ‘കീഴടക്കുക’ എന്നതിനെ പിന്തുണയ്ക്കുന്നു; യോഹന്നാന്റെ പദപ്രയോഗത്തിലെ ഇരട്ട അർഥസാധ്യത നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റേ വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ട് καί ബന്ധകങ്ങളെ മലയാളത്തിലെ പ്രവാഹത്തിനനുസരിച്ച് അർധവിരാമത്തിലൂടെ ബന്ധിപ്പിച്ചു; അർഥപരമായ സമാന്തരത നിലനിർത്തി.
