id: JHN.1.25
reference: John 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: ml
  text: 'അവർ അവനോടു ചോദിച്ചു: “നീ മശീഹയോ ഏലിയാവോ ആ പ്രവാചകനോ[a] അല്ലെങ്കിൽ, പിന്നെ എന്തിനാണ് സ്നാനം കഴിപ്പിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആ പ്രവാചകൻ” എന്നത് മോശെയെപ്പോലെയുള്ള പ്രതീക്ഷിത പ്രവാചകനെ സൂചിപ്പിക്കുന്നതാകാം (ആവർത്തനം 18:15 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: അവർ അവനോടു ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ ‘ചോദിച്ചു, അവനോടു പറഞ്ഞു’ എന്നിങ്ങനെ രണ്ടു ക്രിയകളുണ്ടെങ്കിലും, മലയാളത്തിൽ രണ്ടും പദാനുപദമായി നിലനിർത്തുന്നത് അനാവശ്യമായ ആവർത്തനമായി തോന്നും; ‘അവനോടു ചോദിച്ചു’ രണ്ടിന്റെയും സംവാദപരമായ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: Τί οὖν βαπτίζεις
  choice: പിന്നെ എന്തിനാണ് സ്നാനം കഴിപ്പിക്കുന്നത്?
  rationale: τί οὖν ഇവിടെ പ്രവൃത്തിയുടെ കാരണമോ അധികാരമോ ചോദിക്കുന്ന പ്രയോഗമായതിനാൽ ‘പിന്നെ എന്തിനാണ്’ സ്വാഭാവികമായ മലയാളമാണ്. വർത്തമാനകാലരൂപം യോഹന്നാന്റെ തുടരുന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: βαπτίζεις
  choice: സ്നാനം കഴിപ്പിക്കുന്നത്
  rationale: ഇവിടെ കർത്താവ് മറ്റുള്ളവരെ സ്നാനപ്പെടുത്തുന്നതാണ് ഉദ്ദേശ്യം; ‘സ്നാനം കഴിപ്പിക്കുക’ ആ സകർമക അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമമല്ല, യഹൂദരുടെ പ്രതീക്ഷയിലുള്ള അഭിഷിക്തന്റെ സ്ഥാനപ്പേരാണ്; അതിനാൽ ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ ‘മശീഹ’ സന്ദർഭം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἠλίας
  choice: ഏലിയാവ്
  rationale: പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὁ προφήτης
  choice: ആ പ്രവാചകൻ
  rationale: നിർദ്ദിഷ്ടമായി പ്രതീക്ഷിക്കപ്പെട്ട ഒരു പ്രവാചകനെ ഗ്രീക്ക് നിർദ്ദേശിക്കുന്നു. മലയാളത്തിൽ ‘ആ പ്രവാചകൻ’ എന്നത് അക്ഷരവലുപ്പത്തെ ആശ്രയിക്കാതെ ആ നിർദ്ദിഷ്ടത സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οὐδὲ ... οὐδὲ
  choice: -യോ ... -യോ ... അല്ലെങ്കിൽ
  rationale: മലയാളത്തിലെ നിഷേധാത്മക ഐച്ഛികപട്ടികയുടെ സ്വാഭാവിക ഘടന ഉപയോഗിച്ച് മൂന്നു തിരിച്ചറിയലുകളും തുല്യമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സംഭാഷണത്തിലെ യഹൂദ മശീഹാപ്രതീക്ഷ വ്യക്തമാക്കുകയും ഈ പദം ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നുവെന്നത് നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: ὁ προφήτης ഒരു നിർദ്ദിഷ്ട പ്രതീക്ഷിത വ്യക്തിയെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ആ പ്രവാചകൻ
  alternative: പ്രവാചകൻ
  rationale: ഗ്രീക്ക് നിർദ്ദിഷ്ട ഉപപദവും സന്ദർഭത്തിലെ വേറിട്ട തിരിച്ചറിയലും ഒരു അറിയപ്പെട്ട പ്രതീക്ഷിത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ അതിനെ വ്യാഖ്യാനത്തിൽക്കാൾ അധികമായി നിർവചിക്കാതെ വിവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംവാദശൈലി. ഗ്രീക്കിലെ ഇരട്ട പ്രസ്താവനാസൂത്രം മലയാളത്തിൽ ചുരുക്കിയെങ്കിലും ചോദ്യത്തിന്റെ ശക്തിയും മൂന്നു സ്ഥാനപ്പേരുകളുടെ വേർതിരിവും നിലനിർത്തി.
