source:
  edition: SBLGNT
  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവന്റെ നിറവിൽനിന്ന് നാമെല്ലാവരും സ്വീകരിച്ചിരിക്കുന്നു—കൃപയ്ക്കു പകരം കൃപയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൃപമേൽ കൃപ’ എന്നും ‘ഒന്നിനു പിന്നാലെ മറ്റൊരു കൃപ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം ഒരു കൃപാദാനം മറ്റൊന്നിനെ തുടർന്നുവരുന്നതായി സൂചിപ്പിക്കാം; എന്നാൽ ἀντί എന്ന പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥം ‘പകരം’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: അവന്റെ നിറവിൽനിന്ന്
  rationale: πλήρωμα സൂചിപ്പിക്കുന്ന സമ്പൂർണതയെയും അതിൽനിന്നാണ് ലഭിക്കുന്നത് എന്ന ἐκ-ന്റെ ആശയത്തെയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἡμεῖς πάντες
  choice: നാമെല്ലാവരും
  rationale: വ്യക്തമായ സർവനാമവും πάντες നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἐλάβομεν
  choice: സ്വീകരിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റിനെ മലയാളത്തിൽ ഇപ്പോഴത്തെ ഫലസംബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്ന രൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: രണ്ടാം ഘടകത്തെ ആദ്യത്തോടു ബന്ധിപ്പിക്കുന്ന ലളിതമായ സംയോജനം നിലനിർത്തുന്നു.
- source_word: χάριν ἀντὶ χάριτος
  choice: കൃപയ്ക്കു പകരം കൃപ
  rationale: ἀντί എന്നതിന്റെ അടിസ്ഥാനമായ ‘പകരം’ എന്ന അർത്ഥം സംരക്ഷിച്ച്, പകരംവരവ്/തുടർച്ച സംബന്ധിച്ച മൂലവാക്യത്തിലെ ഉദ്ദേശ്യപൂർവമായ അർത്ഥതുറപ്പ് നിലനിർത്തുന്നു.
theological_decisions:
- issue: χάριν ἀντὶ χάριτος എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: കൃപയ്ക്കു പകരം കൃപ
  alternative: കൃപമേൽ കൃപ; ഒന്നിനു പിന്നാലെ മറ്റൊരു കൃപ
  rationale: ἀντί സാധാരണയായി ‘പകരം’ എന്ന് അർത്ഥമാക്കുന്നുവെങ്കിലും, ഇവിടെ തുടർച്ചയായി ലഭിക്കുന്ന കൃപയും സൂചിപ്പിക്കാം. മുഖ്യപാഠം കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സംഘർഷം നിലനിർത്തുന്നു; വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നിറവ്’, ‘കൃപ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; തർക്കവിഷയമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥതുറപ്പ് മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
