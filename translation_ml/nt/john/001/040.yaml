source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: ml
  text: ശിമോൻ പത്രോസിന്റെ സഹോദരനായ അന്ത്രെയാസ്, യോഹന്നാനിൽനിന്ന് കേട്ട് അവനെ അനുഗമിച്ച ആ രണ്ടുപേരിൽ ഒരാളായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ’ എന്നത് സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: സർവനാമത്തിന്റെ സൂചിതവ്യക്തി വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: ഇവിടെ εἰμίയുടെ അപൂർണഭൂതകാലരൂപം അന്ത്രയോസിനെ ആ രണ്ടുപേരിൽ ഒരാളായി തിരിച്ചറിയിക്കുന്ന ലളിതമായ സംയോജകക്രിയയാണ്.
- source_word: Ἀνδρέας
  choice: അന്ത്രയോസ്
  rationale: മലയാള ബൈബിൾപാരമ്പര്യത്തിൽ പരിചിതവും ഗ്രീക്ക് നാമത്തോട് അടുത്തുനിൽക്കുന്നതുമായ ലിപ്യന്തരണം.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: ശിമോൻ പത്രോസിന്റെ സഹോദരനായ
  rationale: ജനിതകബന്ധവും അന്ത്രയോസിനെ തിരിച്ചറിയിക്കുന്ന വിശേഷണസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἷς ἐκ τῶν δύο
  choice: ആ രണ്ടുപേരിൽ ഒരാൾ
  rationale: ഭാഗസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: τῶν ἀκουσάντων
  choice: കേട്ട്
  rationale: അവർ ആദ്യം യോഹന്നാനിൽനിന്നു കേൾക്കുകയും തുടർന്ന് അനുഗമിക്കുകയും ചെയ്ത സംഭവക്രമം മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: παρὰ Ἰωάννου
  choice: യോഹന്നാനിൽനിന്നു
  rationale: παρά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉറവിടം അതേപടി നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘സ്നാപകൻ’ ചേർക്കുന്നില്ല.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: അവനെ അനുഗമിച്ച
  rationale: ἀκολουθέωയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. αὐτῷയുടെ സർവനാമരൂപം പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനിച്ച് പേരാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെ’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു
  alternative: ‘യേശുവിനെ അനുഗമിച്ച’ എന്ന് വ്യക്തമായി പേരുചേർക്കുക; അല്ലെങ്കിൽ യോഹന്നാനെ സൂചിപ്പിക്കുന്നതായി വായിക്കുക
  rationale: യോഹന്നാൻ 1:35–39-ലെ സംഭവക്രമം അവർ യോഹന്നാന്റെ വാക്കു കേട്ടശേഷം യേശുവിനെ അനുഗമിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പാഠത്തിലെ സർവനാമം പേരാക്കി മാറ്റാതെ അതിന്റെ രൂപപരമായ തുറന്ന നില പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വാക്യഘടന. പരിചിതമായ ബൈബിൾ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
