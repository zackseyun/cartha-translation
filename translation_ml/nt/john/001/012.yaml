id: JHN.1.12
reference: John 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: ml
  text: എന്നാൽ അവനെ സ്വീകരിച്ച എല്ലാവർക്കും—അതായത്, അവന്റെ നാമത്തിൽ വിശ്വസിക്കുന്നവർക്ക്—ദൈവത്തിന്റെ മക്കളായിത്തീരാനുള്ള അവകാശം[a] അവൻ നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അധികാരം” അല്ലെങ്കിൽ “കഴിവ്.” ഗ്രീക്ക് പദത്തിന് നൽകപ്പെട്ട അധികാരം, അവകാശം, അല്ലെങ്കിൽ പ്രാപ്തി എന്നിങ്ങനെ അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: എല്ലാവർക്കും
  rationale: ‘അവനെ സ്വീകരിച്ച’ എന്ന ബന്ധവാക്യത്തോടൊപ്പം, ഉൾപ്പെടുന്ന എല്ലാവരെയും സൂചിപ്പിക്കുന്ന ബഹുവചനപ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നിരാകരണത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἔλαβον αὐτόν
  choice: അവനെ സ്വീകരിച്ച
  rationale: ഇവിടെ ശാരീരികമായി എടുക്കുക എന്നതല്ല, വചനത്തെ സ്വാഗതംചെയ്ത് അംഗീകരിക്കുക എന്ന ആശയമാണ്; ‘സ്വീകരിക്കുക’ ഗ്രീക്കിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἔδωκεν
  choice: അവൻ നൽകി
  rationale: δίδωμι എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള വിവർത്തനം.
- source_word: ἐξουσίαν
  choice: അവകാശം
  rationale: ഇവിടെ വെറും ശക്തിയേക്കാൾ, ദൈവത്തിന്റെ മക്കളായിത്തീരാൻ നൽകപ്പെട്ട അംഗീകൃത അവകാശമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τέκνα θεοῦ
  choice: ദൈവത്തിന്റെ മക്കൾ
  rationale: τέκνα ലിംഗപരമായി ഉൾക്കൊള്ളുന്ന ‘മക്കൾ’ എന്നാണ്; പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്ന ‘പുത്രന്മാർ’ എന്നതല്ല.
- source_word: γενέσθαι
  choice: ആയിത്തീരാൻ
  rationale: ഒരു പുതിയ നിലയിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്നവർക്ക്
  rationale: വിശ്വാസത്താൽ സവിശേഷരായവരെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ നാമത്തിൽ
  rationale: അവന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തിലേക്കു ലക്ഷ്യമിടുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുകയും ‘നാമം’ എന്ന മൂലപദം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അവനെ സ്വീകരിച്ചവർ’ എന്നതും ‘അവന്റെ നാമത്തിൽ വിശ്വസിക്കുന്നവർ’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പ്രയോഗങ്ങളും നിലനിർത്തി, രണ്ടാമത്തേത് ആദ്യത്തേതിനെ വിശദീകരിക്കുന്ന സമാനാധികരണപ്രയോഗമായി ‘അതായത്’ ചേർത്ത് അവതരിപ്പിച്ചു.
  alternative: രണ്ടും പൂർണ പര്യായങ്ങളായി കണ്ട് ഒരു ആശയം മാത്രം വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് രണ്ടുപ്രയോഗങ്ങളും നിലനിർത്തുന്നു; രണ്ടാമത്തേത് ആദ്യത്തെ വിഭാഗത്തെ കൂടുതൽ വ്യക്തമായി തിരിച്ചറിയുന്നു. രണ്ടും സംരക്ഷിക്കുന്നത് യോഹന്നാന്റെ ദൈവശാസ്ത്രപരമായ ഭാഷാഭംഗി നിലനിർത്തുന്നു.
- issue: ദൈവിക മക്കൾ എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ദൈവത്തിന്റെ മക്കൾ
  alternative: ദൈവത്തിന്റെ പുത്രന്മാർ
  rationale: മൂലപാഠത്തിലെ τέκνα എല്ലാ ലിംഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന കുടുംബബന്ധപദമാണ്; υἱοί എന്ന പുരുഷലിംഗപദം ഇവിടെ ഇല്ല.
- issue: ἐξουσίαν എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: അവകാശം
  alternative: അധികാരം അഥവാ കഴിവ്
  rationale: ദൈവത്തിന്റെ മക്കളാകാനുള്ള പദവി മനുഷ്യർ സ്വയം നേടിയെടുക്കുന്നതായി പറയാതെ, അവൻ നൽകിയ അംഗീകൃത അവകാശമായി അവതരിപ്പിക്കുന്നു; എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർത്ഥപരിധി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘവാക്യത്തിന്റെ ബന്ധം വ്യക്തമാക്കാൻ ഇടവരകളും ‘അതായത്’ എന്ന വിശദീകരണസൂചകവും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘അവകാശം’ എന്ന പദത്തിനു പിന്നാലെ വെച്ചു.
