  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: ml
  text: അവൻ വെളിച്ചമായിരുന്നില്ല[a]; വെളിച്ചത്തെക്കുറിച്ചു സാക്ഷ്യം പറയാനാണ് അവൻ വന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവൻ വെളിച്ചമായിരുന്നില്ല; എന്നാൽ വെളിച്ചത്തെക്കുറിച്ചു സാക്ഷ്യം പറയേണ്ടതിന്.’ രണ്ടാം ഉപവാക്യത്തിലെ പ്രധാനക്രിയ ഗ്രീക്കിൽ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടവിധം വിട്ടുകളഞ്ഞിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: ആയിരുന്നില്ല
  rationale: εἰμί എന്ന ക്രിയയുടെ നിഷേധരൂപത്തിലുള്ള അപൂർണഭൂതകാലത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻ
  rationale: രൂപത്തിൽ നിർദേശക സർവനാമമാണെങ്കിലും യോഹന്നാന്റെ ശൈലിയിൽ ഇവിടെ വ്യക്തിയെ ഊന്നി സൂചിപ്പിക്കുന്നു; ‘അവൻ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ φῶς
  choice: വെളിച്ചം
  rationale: മുഖവുരയിൽ ഇതിനകം അവതരിപ്പിച്ചിരിക്കുന്ന നിർദിഷ്ട വെളിച്ചത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സന്ദർഭം നിർദിഷ്ടത വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക നിർദേശപദം ആവശ്യമില്ല.
- source_word: ἀλλ’ ἵνα
  choice: എന്നാൽ ... പറയാനാണ് അവൻ വന്നത്
  rationale: ἀλλάയ്ക്കുശേഷം ഗ്രീക്കിൽ പ്രധാനക്രിയ വിട്ടുകളഞ്ഞിരിക്കുന്നു. മുൻവാക്യത്തിലെ സന്ദർഭത്തിൽനിന്ന് ‘വന്നു’ എന്നു പൂരിപ്പിക്കുന്നത് ലക്ഷ്യസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μαρτυρήσῃ
  choice: സാക്ഷ്യം പറയാൻ
  rationale: μαρτυρέωയുടെ സാക്ഷ്യപരവും നിയമസാക്ഷ്യത്തോടു ബന്ധപ്പെട്ടതുമായ ഭാവം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം.
- source_word: περὶ τοῦ φωτός
  choice: വെളിച്ചത്തെക്കുറിച്ച്
  rationale: περί + genitive ഇവിടെ വിഷയബന്ധം സൂചിപ്പിക്കുന്നു; ‘കുറിച്ച്’ എന്നത് ആ ബന്ധത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപമാണ്.
theological_decisions:
- issue: യോഹന്നാനും വെളിച്ചവും തമ്മിലുള്ള തിരിച്ചറിയലും പങ്കും
  choice: യോഹന്നാൻ വെളിച്ചമല്ലെന്നു നിഷേധിക്കുകയും വെളിച്ചത്തെക്കുറിച്ചു സാക്ഷ്യം പറയുന്നതാണ് അവന്റെ വരവിന്റെ ലക്ഷ്യമെന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
  alternative: ‘അവൻ വെളിച്ചമായിരുന്നില്ല; എന്നാൽ വെളിച്ചത്തെക്കുറിച്ചു സാക്ഷ്യം പറയേണ്ടതിന്’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം.
  rationale: സാക്ഷിയെയും വെളിച്ചത്തെയും വേർതിരിക്കുന്ന മുഖവുരയിലെ സംഘർഷം നിലനിർത്തുന്നു. ‘വന്നു’ എന്ന പൂരണം ഗ്രീക്കിലെ സന്ദർഭാധിഷ്ഠിതമായ ക്രിയാലോപം വ്യക്തമാക്കുന്നതേയുള്ളൂ; അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സാക്ഷ്യം പറയുക’ എന്ന പ്രയോഗം യോഹന്നാന്റെ സാക്ഷ്യഭാഷ നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്കിലെ ക്രിയാലോപം രേഖപ്പെടുത്തുന്നു.
