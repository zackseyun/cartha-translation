  source_fidelity: മൂലഗ്രീക്കിലെ οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν എന്ന വാക്യത്തിന്റെ അനാഫോറികമായ വ്യക്തിപരമായ സൂചന, അപൂർണ്ണഭൂതകാലം, ‘ആദിയിൽ’ എന്ന ഉല്പത്തി-പ്രതിധ്വനി, ദൈവത്തോടുള്ള ബന്ധം എന്നിവ മുഖ്യപാഠം വിശ്വസ്തമായി കൈമാറുന്നു. ‘അവൻ’ സന്ദർഭത്തിലെ λόγος-ത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
  naturalness: ‘അവൻ ആദിയിൽ ദൈവത്തോടുകൂടെ ആയിരുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. ‘ദൈവത്തോടുകൂടെ’ കുറച്ച് ഔപചാരിക സ്വരമുള്ളതാണെങ്കിലും വേദപാഠരജിസ്റ്ററിൽ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
  terminology: ‘ആദിയിൽ,’ ‘ദൈവം,’ ‘അവൻ’ എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. ‘ദൈവത്തോടുകൂടെ’ πρός-ന്റെ ബന്ധപരമായ അർഥം അമിതമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ അറിയിക്കുന്നു. [a] അടയാളവും അടിക്കുറിപ്പും പരസ്പരം പൊരുത്തപ്പെടുന്നു.
