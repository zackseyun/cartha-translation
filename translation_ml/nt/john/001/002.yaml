id: JHN.1.2
reference: John 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: ml
  text: അവൻ ആദിയിൽ ദൈവത്തോടുകൂടെ ആയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവൻ ആദിയിൽ ദൈവത്തോടുകൂടെ ആയിരുന്നു.’
    reason: οὗτος എന്നതിന്റെ കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: οὗτος
  choice: അവൻ
  rationale: ഇത് രൂപപരമായി ‘ഇവൻ/ഈ ഒരുവൻ’ എന്നർഥമുള്ള സൂചകസർവനാമമാണെങ്കിലും, സന്ദർഭത്തിൽ 1:1-ലെ ‘വചനം’ എന്നതിലേക്കാണ് തിരിഞ്ഞുനിൽക്കുന്നത്. ആ വ്യക്തിപരമായ പരാമർശം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അവൻ’ എന്നു നൽകുന്നു; ‘ഇവൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണ്ണഭൂതകാലരൂപം ഇവിടെ തുടർന്നുനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ആയിരുന്നു’ സ്വാഭാവികവും മൂലത്തിന്റെ കാലഭാവം മതിയായ വിധത്തിൽ സൂക്ഷിക്കുന്നതുമാണ്.
- source_word: ἐν ἀρχῇ
  choice: ആദിയിൽ
  rationale: ഉല്പത്തി 1:1-നോടുള്ള വ്യക്തമായ സാഹിത്യപ്രതിധ്വനി നിലനിർത്തുന്ന, സഭാപാരമ്പര്യത്തിനപ്പുറവും മനസ്സിലാകുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ള മലയാളപ്രയോഗമാണിത്.
- source_word: πρὸς
  choice: ത്തോടുകൂടെ
  rationale: πρός + accusative ഇവിടെ സാന്നിധ്യത്തോടൊപ്പം ബന്ധവും വ്യത്യസ്തതയും സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തോടുകൂടെ’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുമ്പോൾ ‘ദൈവത്തിലേക്ക്’ എന്ന അത്യന്തം ദിശാസൂചകമായ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവം
  rationale: ഗ്രീക്കിൽ നിർദ്ദേശകപദമുണ്ടെങ്കിലും മലയാളത്തിൽ ഇവിടെ ‘ആ ദൈവം’ എന്നു പറയുന്നത് അനാവശ്യമായ പ്രത്യേക ഊന്നൽ സൃഷ്ടിക്കും. വിഭക്തിയോടുകൂടിയ ‘ദൈവത്തോടുകൂടെ’ തന്നെയാണ് സ്വാഭാവിക രൂപം.
theological_decisions:
- issue: യോഹന്നാൻ 1:1-നോടുള്ള ബന്ധത്തിൽ οὗτος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സർവനാമം ‘വചനം’ എന്നതിലേക്കു തിരിഞ്ഞുനിൽക്കുന്നതായി കണ്ട് വ്യക്തിപരമായി ‘അവൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ഇവൻ’
  rationale: ഈ വാക്യം 1:1-ൽ പറഞ്ഞ വചനത്തിന്റെ ആദിയിലെ നിലയും ദൈവത്തോടുള്ള ബന്ധവും വീണ്ടും ഉറപ്പിക്കുന്നു. ‘അവൻ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തഭാഷ ചേർക്കാതെ ആ വ്യക്തിപരമായ പരാമർശം സ്വാഭാവികമായി നൽകുന്നു.
- issue: πρὸς τὸν θεόν എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: ബന്ധപരമായ സാന്നിധ്യവും വ്യത്യസ്തതയും ‘ദൈവത്തോടുകൂടെ’ എന്നു പ്രകടിപ്പിച്ചു.
  alternative: ‘ദൈവത്തിങ്കലേക്ക്’; ‘ദൈവസന്നിധിയിൽ’
  rationale: ഈ പദസമുച്ചയം വചനവും ദൈവവും തമ്മിലുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തോടുകൂടെ’ എന്നത് അടുപ്പവും വ്യത്യസ്തതയും നിലനിർത്തുന്നു; അതേസമയം മൂലപാഠം വ്യക്തമാക്കാത്ത സത്താശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആദിയിൽ’ എന്ന പ്രയോഗം ഉല്പത്തി 1:1-നോടുള്ള പ്രതിധ്വനി നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
