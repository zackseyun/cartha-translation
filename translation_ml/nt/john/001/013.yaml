- from: അവർ ജനിച്ചത് രക്തങ്ങളിൽനിന്നോ[a] ജഡത്തിന്റെ ഇച്ഛയിൽനിന്നോ ഒരു പുരുഷന്റെ ഇച്ഛയിൽനിന്നോ അല്ല, ദൈവത്തിൽനിന്നത്രേ.
  to: അവർ ജനിച്ചത് രക്തങ്ങളിൽനിന്നല്ല[a], ജഡത്തിന്റെ ഇച്ഛയിൽനിന്നുമല്ല, പുരുഷന്റെ ഇച്ഛയിൽനിന്നുമല്ല; ദൈവത്തിൽനിന്നാണ്.
  rationale: The revision corrects the Malayalam coordination of the three Greek negations without altering the meaning or the source’s progression. It retains the formally significant plural ‘രക്തങ്ങളിൽനിന്ന്’ in the text, explains it in a properly anchored footnote, preserves ‘ജഡം’ for σάρξ, and renders the generic singular ἀνδρός idiomatically as ‘പുരുഷന്റെ.’
