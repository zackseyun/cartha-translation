source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: ml
  text: അവർ ജനിച്ചത് രക്തങ്ങളിൽനിന്നല്ല[a], ജഡത്തിന്റെ ഇച്ഛയിൽനിന്നുമല്ല, പുരുഷന്റെ ഇച്ഛയിൽനിന്നുമല്ല; ദൈവത്തിൽനിന്നാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ സ്വാഭാവികമായി, “വംശപരമ്പരയിൽനിന്ന്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “രക്തങ്ങളിൽനിന്ന്” എന്ന അസാധാരണമായ ബഹുവചനമാണ്; അത് സ്വാഭാവിക വംശപരമ്പരയെയോ മനുഷ്യ മാതാപിതാക്കളിൽനിന്നുള്ള ജനനത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: അവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്നവരിലേക്കാണ് ബഹുവചന സർവനാമം വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്താൻ ‘അവർ’ ഉപയോഗിച്ചു.
- source_word: ἐξ αἱμάτων
  choice: രക്തങ്ങളിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ അസാധാരണമായ ബഹുവചനം സംരക്ഷിക്കുന്നു; ഇവിടെ അത് സ്വാഭാവിക വംശപരമ്പരയെയോ മനുഷ്യ മാതാപിതാക്കളിൽനിന്നുള്ള ജനനത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. കൂടുതൽ സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: θελήματος
  choice: ഇച്ഛ
  rationale: മനുഷ്യന്റെ ആഗ്രഹം, ഉദ്ദേശ്യം, അല്ലെങ്കിൽ ഇച്ഛാശക്തി എന്ന അർഥപരിധി ഉൾക്കൊള്ളുകയും ആവർത്തിത ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: σαρκὸς
  choice: ജഡം
  rationale: ശാരീരികമായ മനുഷ്യജനനവുമായി ബന്ധപ്പെട്ട പ്രേരണയെ ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘പാപസ്വഭാവം’ എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്കിന്റെ ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: ἀνδρὸς
  choice: ഒരു പുരുഷൻ
  rationale: പ്രായപൂർത്തിയായ ആൺമനുഷ്യനെയും ജനനത്തിലെ പുരുഷപങ്കിനെയും സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം സംരക്ഷിക്കുന്നു.
- source_word: ἐκ θεοῦ
  choice: ദൈവത്തിൽനിന്ന്
  rationale: മുൻപുള്ള മൂന്നു നിഷേധിക്കപ്പെട്ട മനുഷ്യസ്രോതസ്സുകൾക്ക് എതിരായി ദൈവത്തെ ജനനത്തിന്റെ ഉറവിടമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐγεννήθησαν
  choice: ജനിച്ചത്
  rationale: γεννάω എന്ന ക്രിയയുടെ നിർജീവ ഭൂതകാല അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ജനിപ്പിക്കപ്പെട്ടു’ എന്ന കൃത്രിമമായ രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യജനനവും ദൈവിക ഉത്ഭവവും തമ്മിലുള്ള വൈരുധ്യം
  choice: സ്വാഭാവിക വംശപരമ്പരയിലോ മനുഷ്യന്റെ പ്രജനന ഇച്ഛയിലോ അല്ല, ദൈവത്തിലാണ് ഈ ജനനത്തിന്റെ ഉറവിടമെന്ന് പാഠം പറയുന്നു.
  alternative: ഇത് ജനവിഭാഗപരമായ വംശാവലിയെ മാത്രം നിഷേധിക്കുന്നതായി ചുരുക്കിവായിക്കാം; അല്ലെങ്കിൽ പിൽക്കാല പാരമ്പര്യങ്ങളിലെ പ്രത്യേക കൂദാശാപരമോ തത്ത്വചിന്താപരമോ ആയ വ്യാഖ്യാനം നേരിട്ട് ഇതിൽ ഉൾപ്പെടുത്താം.
  rationale: മൂന്നുതവണയുള്ള നിഷേധവും അവസാനത്തെ ‘ദൈവത്തിൽനിന്ന്’ എന്ന വൈരുധ്യവും സംരക്ഷിച്ചു. എന്നാൽ പുതുജനനത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വിശദീകരണം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ജഡം’ എന്ന ബൈബിൾപരമായി പരിചിതമായ പദം മൂലപാഠത്തിന്റെ രൂപകം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; വാക്യഘടന വായനാസൗകര്യത്തിനായി മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി.
