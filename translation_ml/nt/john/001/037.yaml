id: JHN.1.37
reference: John 1:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: ml
  text: അദ്ദേഹം പറയുന്നതു കേട്ട ആ രണ്ടു ശിഷ്യന്മാർ[a] യേശുവിനെ അനുഗമിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യക്തമാക്കിയാൽ, “അദ്ദേഹത്തിന്റെ ആ രണ്ടു ശിഷ്യന്മാർ”; ഇവിടെ “അദ്ദേഹം” സ്നാപകയോഹന്നാനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤκουσαν
  choice: കേട്ട
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist രൂപം ഇവിടെ പറഞ്ഞത് കേൾക്കുക എന്ന ലളിതമായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ദീർഘമായി ശ്രദ്ധിച്ചുകേൾക്കുക എന്ന ആശയം നിർബന്ധമല്ല.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: ആ രണ്ടു ശിഷ്യന്മാർ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച സ്നാപകയോഹന്നാന്റെ രണ്ടു ശിഷ്യന്മാരെയാണ് നിർദ്ദിഷ്ടമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘ആ’ ഈ മുൻപരാമർശബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; αὐτοῦ എന്നതിന്റെ ബന്ധം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: λαλοῦντος
  choice: അദ്ദേഹം പറയുന്നതു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം കേൾക്കലിനോടൊപ്പം നടന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ‘പറയുന്നതു’ ആ സമകാലികത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: ἀκολουθέω ഇവിടെ ആദ്യം യേശുവിന്റെ പിന്നാലെ പോകുക എന്ന ഭൗതിക അർത്ഥവും, കഥയുടെ വികാസത്തിൽ ശിഷ്യരായി പിന്തുടരുക എന്ന ധ്വനിയും വഹിക്കുന്നു. ‘അനുഗമിച്ചു’ രണ്ടും തുറന്നുവയ്ക്കുന്നു.
- source_word: τῷ Ἰησοῦ
  choice: യേശുവിനെ
  rationale: ἀκολουθέωയോടുകൂടിയ dative പിന്തുടരപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സകർമകമായി ‘യേശുവിനെ അനുഗമിച്ചു’ എന്നതാണ് സ്വാഭാവികം.
theological_decisions:
- issue: οἱ δύο μαθηταὶ αὐτοῦ എന്നതിലെ αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു
  choice: സ്നാപകയോഹന്നാനെയാണ് സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കി; മുഖ്യവാചകത്തിൽ ‘ആ രണ്ടു ശിഷ്യന്മാർ’ എന്നും അടിക്കുറിപ്പിൽ ബന്ധം വ്യക്തമാക്കിയും നൽകി.
  alternative: ‘അദ്ദേഹത്തിന്റെ രണ്ടു ശിഷ്യന്മാർ’ എന്ന് സർവനാമബന്ധം മുഖ്യവാചകത്തിൽ നേരിട്ട് നിലനിർത്തുക.
  rationale: യോഹന്നാൻ 1:35–36-ലെ ഉടൻമുൻപുള്ള സന്ദർഭത്തിൽ യോഹന്നാൻ തന്റെ രണ്ടു ശിഷ്യന്മാരോടൊപ്പം നിൽക്കുകയും യേശുവിനെക്കുറിച്ച് സംസാരിക്കുകയും ചെയ്യുന്നു. അതിനാൽ സൂചന യോഹന്നാനിലേക്കാണ്; എന്നാൽ മുഖ്യവാചകത്തിൽ സർവനാമം ആവർത്തിക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികവും ആശയക്കുഴപ്പമുള്ളതുമായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അനുഗമിച്ചു’ എന്ന പദം സംഭവത്തിലെ ഭൗതിക പിന്തുടരലും ശിഷ്യത്വത്തിന്റെ കഥാപരമായ ധ്വനിയും അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
