reference: John 1:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ὁ Φίλιππος ἀπὸ Βηθσαϊδά, ἐκ τῆς πόλεως Ἀνδρέου καὶ Πέτρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: ml
  text: ഫിലിപ്പോസ് അന്ത്രയോസിന്റെയും പത്രോസിന്റെയും പട്ടണമായ ബേത്ത്സയിദയിൽനിന്നുള്ളവനായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫിലിപ്പോസ് ബേത്ത്സയിദയിൽനിന്നുള്ളവനായിരുന്നു, അന്ത്രയോസിന്റെയും പത്രോസിന്റെയും പട്ടണത്തിൽനിന്ന്.” ഇതിന്റെ അർഥം ബേത്ത്സയിദ അവരുടെ സ്വദേശപ്പട്ടണമായിരുന്നു എന്നാണ്.
    reason: ഗ്രീക്കിലെ ആവർത്തിച്ച ‘നിന്ന്’ പ്രയോഗവും അന്ത്രയോസും പത്രോസും ബേത്ത്സയിദയുമായുള്ള സ്വദേശബന്ധവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: εἰμίയുടെ അപൂർണഭൂതകാലരൂപം ഇവിടെ ഫിലിപ്പോസിന്റെ സ്വദേശബന്ധം സൂചിപ്പിക്കുന്ന ഭൂതകാലാവസ്ഥയാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രവാഹം നിലനിർത്താം.
- source_word: ὁ Φίλιππος
  choice: ഫിലിപ്പോസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: ἀπὸ Βηθσαϊδά
  choice: ബേത്ത്സയിദയിൽനിന്നുള്ളവൻ
  rationale: ἀπό ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വദേശബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: ἐκ τῆς πόλεως
  choice: പട്ടണം
  rationale: πόλις എന്നത് നഗരം അല്ലെങ്കിൽ പട്ടണം എന്നർഥമാകാം; ഇവിടെ ചെറിയ പ്രദേശത്തെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളപ്രയോഗമായി 'പട്ടണം' തിരഞ്ഞെടുത്തു.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: അന്ത്രയോസിന്റെയും പത്രോസിന്റെയും
  rationale: ജനിറ്റീവ് രൂപങ്ങൾ ആ പട്ടണവുമായി ഇരുവർക്കുമുള്ള സ്വദേശബന്ധം സൂചിപ്പിക്കുന്നു; അടിസ്ഥാനരൂപം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തിച്ച ഉറവിടപ്രയോഗം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ രണ്ടാമത്തെ ഘടകം വിശദീകരണ ഉപവാക്യമായി നൽകി; വ്യാകരണപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
