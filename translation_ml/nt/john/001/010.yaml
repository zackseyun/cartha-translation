id: JHN.1.10
reference: John 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: ml
  text: അവൻ ലോകത്തിലായിരുന്നു; ലോകം അവനിലൂടെ ഉളവായി[a]; എന്നിട്ടും ലോകം അവനെ അറിഞ്ഞില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനിലൂടെ സൃഷ്ടിക്കപ്പെട്ടു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ഉളവായി’ അഥവാ ‘അസ്തിത്വത്തിലേക്കു വന്നു’ എന്നർത്ഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവനെ അറിഞ്ഞില്ല’ എന്നതിന് ‘അവനെ തിരിച്ചറിഞ്ഞില്ല’ എന്നോ ‘അവനെ അംഗീകരിച്ചില്ല’ എന്നോ ഉള്ള അർത്ഥവും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: ലോകം / ലോകത്തിൽ
  rationale: ഈ വാക്യത്തിൽ κόσμος മൂന്നു പ്രാവശ്യം വരുന്നു. ‘ലോകം’ എന്ന ഒരേ പദം നിലനിർത്തുന്നത് സൃഷ്ടലോകം, മനുഷ്യലോകം എന്നീ അർത്ഥതലങ്ങൾ മുൻകൂട്ടി ഒന്നിലേക്കു ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἦν
  choice: ആയിരുന്നു
  rationale: εἰμίയുടെ അപൂർണ്ണഭൂതകാലരൂപം തുടർന്നിരുന്ന സാന്നിധ്യത്തെ ലളിതമായി സൂചിപ്പിക്കുന്നു. ‘ലോകത്തിലായിരുന്നു’ എന്നത് സ്വാഭാവികവും അധിക ദാർശനിക ആശയം ചേർക്കാത്തതുമാണ്.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διά + genitive ഇവിടെ മധ്യസ്ഥമായ പ്രവർത്തനമോ കാരണോപാധിയോ സൂചിപ്പിക്കുന്നു. ‘അവനിലൂടെ’ യോഹന്നാൻ 1:3-ലെ പ്രയോഗത്തോടും യോജിക്കുന്നു.
- source_word: ἐγένετο
  choice: ഉളവായി
  rationale: γίνομαι ഇവിടെ അസ്തിത്വത്തിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉളവായി’ എന്നത് മുമ്പുള്ള ἦν (‘ആയിരുന്നു’) എന്നതിൽനിന്നുള്ള യോഹന്നാന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἔγνω
  choice: അറിഞ്ഞില്ല
  rationale: γινώσκωയുടെ അടിസ്ഥാന അർത്ഥം ‘അറിയുക’ എന്നതാണ്. സന്ദർഭത്തിൽ തിരിച്ചറിയലും അംഗീകരിക്കലും ഉൾപ്പെടാമെങ്കിലും, ‘അറിഞ്ഞില്ല’ ഗ്രീക്കിലെ വിശാലമായ അർത്ഥസാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: αὐτόν / αὐτοῦ
  choice: അവനെ / അവനിലൂടെ
  rationale: സർവനാമങ്ങൾ മുൻസന്ദർഭത്തിലെ വചനത്തെ സൂചിപ്പിക്കുന്നു. പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്ന രൂപം മൂലപാഠത്തിലെ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രകടമല്ലാത്ത കർത്താവിന്റെ സൂചിതവിഷയം
  choice: മുൻസന്ദർഭത്തിലെ വചനത്തെ സൂചിപ്പിച്ച് ‘അവൻ’ എന്നു വ്യക്തിപരമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അത്’ എന്നു നപുംസകരൂപത്തിൽ നൽകുക.
  rationale: ഈ വാക്യത്തിൽ കർത്തൃനാമം ആവർത്തിക്കുന്നില്ലെങ്കിലും യോഹന്നാൻ 1:1–9-ലെ ഉടൻമുൻസന്ദർഭം വ്യക്തിപരമായ പുരുഷസർവനാമസൂചന നൽകുന്നു. ‘അവൻ’ എന്നത് പാഠത്തിന്റെ പ്രവാഹം സംരക്ഷിക്കുന്നു; പിന്നീടുള്ള സിദ്ധാന്തഭാഷ ചേർക്കുന്നില്ല.
- issue: വചനവും സൃഷ്ടിയും തമ്മിലുള്ള ഭാഷാപരമായ വ്യത്യാസം
  choice: ἦν എന്നതിന് ‘ആയിരുന്നു’ എന്നും ἐγένετο എന്നതിന് ‘ഉളവായി’ എന്നും നൽകി.
  alternative: ‘ലോകം അവനിലൂടെ സൃഷ്ടിക്കപ്പെട്ടു.’
  rationale: വചനത്തിന്റെ മുൻനിലനിൽപ്പിനെയും ലോകം അസ്തിത്വത്തിലേക്കു വന്നതിനെയും വേർതിരിക്കുന്ന മൂലപാഠത്തിലെ ἦν/ἐγένετο വ്യത്യാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- issue: അവസാനത്തെ καίയുടെ ബന്ധം
  choice: സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാക്കാൻ ‘എന്നിട്ടും’ എന്നു നൽകി.
  alternative: ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘എന്നും’ എന്ന സാധാരണ സംയോജകം.
  rationale: താൻ മുഖാന്തരം ഉളവായ ലോകത്തിൽ അവൻ ഉണ്ടായിരുന്നിട്ടും ലോകം അവനെ അറിഞ്ഞില്ല എന്ന വ്യക്തമായ വിരോധബന്ധമാണ് മൂന്നാം ഉപവാക്യത്തിൽ. ‘എന്നിട്ടും’ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പുതിയ ഉള്ളടക്കം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂന്ന് ഉപവാക്യങ്ങളിലുമുള്ള ‘ലോകം’ എന്ന ആവർത്തനം യോഹന്നാന്റെ വാക്യഘടനയും അർത്ഥതലങ്ങളും നിലനിർത്താൻ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ വിവരണങ്ങളുമായി പൊരുത്തപ്പെടാത്തതായി തോന്നിയതിനാൽ, [a] ἐγένετο-യോടും [b] ἔγνω-യോടും ചേർത്തു.
