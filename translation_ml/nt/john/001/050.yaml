  terminology: ‘യേശു,’ ‘അത്തിമരം,’ ‘വിശ്വസിക്കുക,’ and ‘വലിയ കാര്യങ്ങൾ’ are appropriate and consistent terms. The rendering does not add a doctrinal interpretation or intensify the rhetorical question into a rebuke.
