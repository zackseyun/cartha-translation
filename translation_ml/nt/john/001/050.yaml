id: JHN.1.50
reference: John 1:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: ml
  text: 'യേശു അവനോടു മറുപടി പറഞ്ഞു: “അത്തിമരത്തിന്റെ ചുവട്ടിൽ നിന്നെ കണ്ടു എന്നു ഞാൻ നിന്നോടു പറഞ്ഞതുകൊണ്ടാണോ നീ വിശ്വസിക്കുന്നത്?[a] ഇവയെക്കാൾ വലിയ കാര്യങ്ങൾ നീ കാണും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത്തിമരത്തിന്റെ ചുവട്ടിൽ നിന്നെ കണ്ടു എന്നു ഞാൻ നിന്നോടു പറഞ്ഞതുകൊണ്ട് നീ വിശ്വസിക്കുന്നുവോ?”
    reason: ആദ്യ ὅτιയും πιστεύεις എന്ന ചോദ്യവും മലയാളത്തിൽ അല്പം വ്യത്യസ്തമായ ഊന്നലോടെ സ്വാഭാവികമായി ക്രമീകരിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: യേശു അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ സാധാരണ സംഭാഷണസൂത്രമായ ‘മറുപടി നൽകി പറഞ്ഞു’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം കൂടാതെ അവതരിപ്പിക്കുന്നു.
- source_word: Ὅτι ... πιστεύεις;
  choice: '... പറഞ്ഞതുകൊണ്ടാണോ നീ വിശ്വസിക്കുന്നത്?'
  rationale: ആദ്യ ὅτιയുടെ കാരണാർഥവും ചോദ്യത്തിന്റെ വാചാടോപസ്വഭാവവും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι εἶδόν σε
  choice: നിന്നെ കണ്ടു എന്നു
  rationale: രണ്ടാമത്തെ ὅτι പറഞ്ഞതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ ‘എന്നു’ ഉപയോഗിച്ചു; εἶδόν ലളിതമായ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ὑποκάτω τῆς συκῆς
  choice: അത്തിമരത്തിന്റെ ചുവട്ടിൽ
  rationale: ദൃശ്യബിംബം കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πιστεύεις
  choice: നീ വിശ്വസിക്കുന്നത്
  rationale: യോഹന്നാനിലെ വിശ്വാസസംബന്ധിയായ പദപ്രയോഗം നിലനിർത്തുകയും വർത്തമാനകാല ചോദ്യമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: μείζω τούτων
  choice: ഇവയെക്കാൾ വലിയ കാര്യങ്ങൾ
  rationale: നപുംസക ബഹുവചന താരതമ്യപ്രയോഗം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὄψῃ
  choice: നീ കാണും
  rationale: ഭാവികാലത്തിന്റെ ലളിതവും ആധുനികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: πιστεύεις എന്നതിന്റെ വാചകബലം
  choice: ‘...കൊണ്ടാണോ നീ വിശ്വസിക്കുന്നത്?’ എന്ന വാചാടോപചോദ്യം
  alternative: ‘...പറഞ്ഞതുകൊണ്ട് നീ വിശ്വസിക്കുന്നു’ എന്ന പ്രസ്താവന
  rationale: ഗ്രീക്ക് വാക്യക്രമവും സന്ദർഭവും ചോദ്യവായനയെ പിന്തുണയ്ക്കുന്നു. അതിനെ കടുത്ത ശാസനയായോ നഥനയേലിന്റെ വിശ്വാസത്തെക്കുറിച്ചുള്ള തീർപ്പായോ മൂർച്ചപ്പെടുത്താതെ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അത്തിമരം’, ‘വിശ്വസിക്കുക’, ‘വലിയ കാര്യങ്ങൾ’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യ പുരാതനഭാഷയും വ്യാഖ്യാനവിസ്താരവും ഒഴിവാക്കി.
