id: JHN.1.47
reference: John 1:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ml
  text: 'യേശു നഥനയേൽ തന്റെ അടുക്കലേക്കു വരുന്നതു കണ്ടിട്ട് അവനെക്കുറിച്ച് പറഞ്ഞു: “ഇതാ, വഞ്ചനയില്ലാത്ത ഒരു യഥാർഥ ഇസ്രായേല്യൻ!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് ഉദ്‌ഘോഷത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: ഒരു യഥാർഥ ഇസ്രായേല്യൻ
  rationale: ἀληθῶς എന്നത് ഇവിടെ നഥനയേലിന്റെ ഇസ്രായേല്യസ്വഭാവത്തെ ഊന്നിപ്പറയുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: δόλος
  choice: വഞ്ചന
  rationale: കപടത, ചതി, വഞ്ചന എന്നിവ ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ അർഥം സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ മലയാളപദത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν ᾧ ... οὐκ ἔστιν
  choice: വഞ്ചനയില്ലാത്ത
  rationale: അക്ഷരാർഥത്തിലെ ‘ആരിൽ ... ഇല്ലയോ’ എന്ന ഘടനയുടെ അർഥം നഷ്ടപ്പെടാതെ സ്വാഭാവിക മലയാള വിശേഷണഘടനയായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ‘യഥാർഥ ഇസ്രായേല്യൻ’ എന്ന വിശേഷണത്തിന്റെ അർഥവ്യാപ്തി
  choice: വാക്യത്തിൽ ഉള്ള പ്രശംസ മാത്രം നിലനിർത്തി; അധിക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തില്ല.
  alternative: ‘സത്യവിശ്വാസിയായ ഇസ്രായേല്യൻ’ എന്നോ ‘ആത്മീയ ഇസ്രായേല്യൻ’ എന്നോ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം അത്തരം പ്രത്യേക ദൈവശാസ്ത്ര നിർവചനം നേരിട്ട് നൽകുന്നില്ല; അതിനാൽ അതിലെ തുറന്ന അർഥവും സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ഭാഷ. ‘പറഞ്ഞു’ എന്ന ഭൂതകാലം ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള കഥനശൈലിക്ക് സ്വാഭാവികമാക്കുന്നു.
