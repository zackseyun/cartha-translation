language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: ml
  text: കാരണം, ന്യായപ്രമാണം മോശെയിലൂടെ നൽകപ്പെട്ടു; കൃപയും സത്യവും യേശുവായ മശീഹായിലൂടെ വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “യേശുക്രിസ്തുവിലൂടെ.”'
    reason: Χριστός എന്ന പദവിയുടെ പരമ്പരാഗത ലിപ്യന്തരാധിഷ്ഠിത പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധകത്തിന്റെ കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: മോശയുമായി ബന്ധപ്പെട്ട, അറിയപ്പെട്ട ഉടമ്പടിനിയമസംഹിതയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും മാന്യവുമായ പദം.
- source_word: διὰ Μωϋσέως
  choice: മോശയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയോ കർത്തൃത്വമോ നിലനിർത്തുകയും യേശുവിനെക്കുറിച്ചുള്ള സമാന്തരപ്രയോഗവുമായി പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἐδόθη
  choice: നൽകപ്പെട്ടു
  rationale: aorist passive രൂപവും ദൈവിക ദാനമെന്ന സൂചനയും അനാവശ്യ വ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിലെ ദൈവിക അനുഗ്രഹത്തിന്റെയും അനർഹദാനത്തിന്റെയും സമ്പന്നമായ അർഥം വഹിക്കുന്ന സ്ഥാപിത മലയാളപദം.
- source_word: ἡ ἀλήθεια
  choice: സത്യം
  rationale: യോഹന്നാൻ 1:14-ലെ പ്രതിധ്വനിയും വെളിപ്പെട്ട സത്യം/യാഥാർഥ്യം എന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലൂടെ
  rationale: διάയുടെ മധ്യസ്ഥതാസൂചന സമാന്തരമായി നിലനിർത്തുന്നു; Χριστός ഒരു പദവിയായി അർഥവത്തായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐγένετο
  choice: വന്നു
  rationale: ἐδόθη എന്നതോടുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് കൃപയും സത്യവും ചരിത്രത്തിൽ യാഥാർഥ്യമായി എത്തിയെന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ മശീഹാപദവിയുടെ അർഥം വഹിക്കുന്നതിനാൽ അതിന്റെ അർഥം പരിഭാഷയിൽ പ്രകടമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബൈബിൾ ശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടനയും ‘നൽകപ്പെട്ടു/വന്നു’ എന്ന ക്രിയാവ്യത്യാസവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിന് പിന്നാലെ സ്ഥാപിച്ചു.
