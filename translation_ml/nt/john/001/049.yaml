reference: John 1:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ml
  text: 'നഥനയേൽ അവനോടു മറുപടി പറഞ്ഞു: “റബ്ബീ, അങ്ങാണ് ദൈവപുത്രൻ; അങ്ങാണ് ഇസ്രായേലിന്റെ രാജാവ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ἀποκρίνομαι എന്ന ക്രിയയുടെ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമായ മലയാളപ്രയോഗം.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ യഹൂദ സാംസ്കാരിക പശ്ചാത്തലവും നേരിട്ടുള്ള അഭിസംബോധനയും നിലനിർത്താൻ പദം ലിപ്യന്തരണം ചെയ്തു; ‘ഗുരോ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് അതിന്റെ പ്രത്യേക യഹൂദരൂപം മങ്ങിച്ചേക്കാം.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: നിശ്ചിതവും പദവിസ്വഭാവമുള്ളതുമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി കുറയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: βασιλεὺς
  choice: രാജാവ്
  rationale: നേരിട്ടുള്ള പദസമതുല്യം; τοῦ Ἰσραήλ എന്ന വിശേഷണഘടകത്തോടൊപ്പം ഇവിടെ നിശ്ചിതമായ രാജകീയ പദവിയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യവഹാരം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘ഇസ്രായേലിന്മേൽ’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: അങ്ങാണ് … അങ്ങാണ്
  rationale: ആവർത്തിച്ചുള്ള വ്യക്തിപ്രത്യയത്തിന്റെയും ക്രിയയുടെയും ഊന്നലും സമാന്തരമായ വിശ്വാസപ്രഖ്യാപനഘടനയും നിലനിർത്തുന്നു.
- source_word: Ναθαναήλ
  choice: നഥനയേൽ
  rationale: മൂലഗ്രീക്കിലെ Ναθαναήλ എന്ന വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘ദൈവപുത്രൻ’ എന്ന നഥനയേലിന്റെ പ്രഖ്യാപനത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: പദവിയുടെ നിശ്ചിതത്വം നിലനിർത്തി ‘ദൈവപുത്രൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവത്തിന്റെ ഒരു പുത്രൻ’ അല്ലെങ്കിൽ പദവിസ്വഭാവം കുറയുന്ന മറ്റൊരു പരാവർത്തനം.
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ പ്രയോഗത്തിനുള്ള മശീഹാപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ പ്രാധാന്യം ദുർബലമാക്കാതെയും പിന്നീടുള്ള സിദ്ധാന്തഭാഷ ചേർക്കാതെയും മൂലവാചകം സംരക്ഷിക്കുന്നു.
- issue: ‘ഇസ്രായേലിന്റെ രാജാവ്’ എന്നതിന്റെ രാജകീയ-മശീഹാപരമായ അർഥം
  choice: ‘ഇസ്രായേലിന്റെ രാജാവ്’ എന്ന വ്യക്തമായ രാജകീയ പദവി നിലനിർത്തി.
  alternative: ‘ഇസ്രായേലിനെ ഭരിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്മേൽ രാജാവ്’.
  rationale: മൂലത്തിലെ ഔപചാരിക പദവിയും പ്രതീക്ഷിക്കപ്പെട്ട രാജകീയ മശീഹയോടുള്ള സൂചനയും പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന രണ്ടാംപുരുഷരൂപം
  choice: ആദരസൂചക ഏകവചനമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
  alternative: ‘നീ’.
  rationale: Ῥαββί എന്ന ആദരപദത്തോടും നഥനയേലിന്റെ വിശ്വാസപ്രഖ്യാപനത്തിന്റെ ഭാവത്തോടും യോജിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളം; ഇതിലൂടെ ദൈവശാസ്ത്രപരമായ അധിക അർഥം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനഊന്നൽ ‘അങ്ങാണ് … അങ്ങാണ്’ എന്ന ഘടനയിൽ സംരക്ഷിച്ചു. സാംസ്കാരിക അഭിസംബോധനയായ ‘റബ്ബീ’ ലിപ്യന്തരിച്ചു; വിശദീകരണ അടിക്കുറിപ്പ് ആവശ്യമായില്ല.
