  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: ml
  text: അവൻ സാക്ഷിയായി[a] വന്നു; വെളിച്ചത്തെക്കുറിച്ച് സാക്ഷ്യം നൽകാനും, അവനിലൂടെ എല്ലാവരും വിശ്വസിക്കാനുമായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യത്തിനായി.’
    reason: lexical_alternative
  - marker: b
    text: ‘അവനിലൂടെ’ എന്നത് യോഹന്നാന്റെ സാക്ഷ്യത്തിലൂടെ എന്നർഥം. ചിലർ ഇവിടെ ‘അവൻ’ എന്നത് വെളിച്ചത്തെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പരിചയപ്പെടുത്തിയ യോഹന്നാനിലേക്കാണ് നിർദ്ദേശക സർവനാമം വിരൽചൂണ്ടുന്നത്. ‘ഇവൻ’ എന്നത് ഊന്നൽ കൂടുതൽ നേരിട്ട് നിലനിർത്തുമെങ്കിലും, തുടർച്ചയായ ആഖ്യാനത്തിൽ ‘അവൻ’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതമായ ആഖ്യാനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς μαρτυρίαν
  choice: സാക്ഷ്യത്തിനായി
  rationale: സാക്ഷ്യം നൽകുക എന്ന ഉദ്ദേശ്യവും സാക്ഷിയുടെ പങ്കും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തമായ പ്രയോഗം. ‘ഒരു സാക്ഷിയായി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα μαρτυρήσῃ
  choice: സാക്ഷ്യം വഹിക്കേണ്ടതിന്
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം നിലനിർത്തുകയും μαρτυρέω എന്നതിന്റെ സാക്ഷ്യപരമായ അർഥം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: περὶ τοῦ φωτός
  choice: വെളിച്ചത്തെക്കുറിച്ച്
  rationale: περί + genitive എന്നതിന്റെ ‘കുറിച്ച്’ എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു. മലയാളത്തിൽ വലിയക്ഷരം ഉപയോഗിച്ച് വ്യക്തിനാമസദൃശത സൂചിപ്പിക്കാനാകാത്തതിനാൽ ‘വെളിച്ചം’ എന്ന രൂപം തന്നെയാണ് ഉപയോഗിച്ചത്.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: എല്ലാവരും വിശ്വസിക്കേണ്ടതിന്
  rationale: രണ്ടാമത്തെ ഉദ്ദേശ്യവാക്യവും πάντες എന്നതിന്റെ വ്യാപകതയും നിലനിർത്തുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/കർതൃത്വം സ്വാഭാവികമായി നൽകുന്നു; സർവനാമത്തിന്റെ പരാമർശസാധ്യത തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: δι’ αὐτοῦ എന്നതിലെ ‘അവൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനവാചകത്തിൽ അത് സാക്ഷിയായ യോഹന്നാനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം
  alternative: അത് വെളിച്ചത്തെ സൂചിപ്പിക്കുന്നതായി ചിലർ വായിക്കുന്നു
  rationale: വാക്യത്തിലെ കർത്താവും സന്ദർഭത്തിൽ വെളിച്ചത്തിൽനിന്ന് വേർതിരിക്കപ്പെട്ട സാക്ഷിയും യോഹന്നാനാണ്; അതിനാൽ യോഹന്നാൻ സ്വാഭാവികമായ മുൻപദമാണ്. എങ്കിലും ഗ്രീക്ക് സർവനാമം വ്യാകരണപരമായി മറ്റൊരു വായനയെ പൂർണമായി തടയാത്തതിനാൽ അടിക്കുറിപ്പിൽ ആ സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ടു ἵνα ഉദ്ദേശ്യഘടകങ്ങളും സമാന്തരമായ ‘വേണ്ടതിനും’ രൂപങ്ങളിൽ നിലനിർത്തിയിരിക്കുന്നു; ദീർഘവാക്യത്തിന്റെ ഘടന വ്യക്തമാക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
