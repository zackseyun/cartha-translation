- from: അവൻ സാക്ഷ്യത്തിനായി[a] വന്നു—വെളിച്ചത്തെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കേണ്ടതിനും അവനിലൂടെ എല്ലാവരും വിശ്വസിക്കേണ്ടതിനും.[b]
  to: അവൻ സാക്ഷിയായി[a] വന്നു; വെളിച്ചത്തെക്കുറിച്ച് സാക്ഷ്യം നൽകാനും, അവനിലൂടെ എല്ലാവരും വിശ്വസിക്കാനുമായി.[b]
