  rationale: യോഹന്നാനെ വ്യക്തമായി പറയുന്നതിലൂടെ യേശു യോഹന്നാന്റെ അടുക്കലേക്കാണ് വരുന്നതെന്ന് ഉറപ്പാക്കുന്നു. ഇതിലൂടെ മൂലത്തിലെ αὐτόν-ന്റെ സന്ദർഭനിശ്ചിതമായ പരാമർശം സംരക്ഷിക്കപ്പെടുന്നു. മറ്റു പ്രധാന പദങ്ങളും ഏകവചനമായ “പാപം” എന്ന രൂപവും നിലനിർത്തിയിരിക്കുന്നു.
