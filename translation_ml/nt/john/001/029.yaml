id: JHN.1.29
reference: John 1:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ml
  text: 'പിറ്റേന്ന് യേശു തന്റെ അടുക്കലേക്കു വരുന്നതു യോഹന്നാൻ കണ്ടു പറഞ്ഞു: “ഇതാ, ലോകത്തിന്റെ പാപം നീക്കുന്ന[a] ദൈവത്തിന്റെ കുഞ്ഞാട്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീക്കുന്ന” എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് “ചുമക്കുന്ന” എന്നും അർഥമാകാം.
    reason: αἴρω എന്ന ഗ്രീക്ക് പദത്തിന്റെ സന്ദർഭാനുസൃതമായ അർത്ഥവ്യാപ്തി സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളരൂപം.
- source_word: Ἴδε
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഹ്വാനം ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കുഞ്ഞാട്
  rationale: ἀμνός എന്നത് കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു; ഉടമസ്ഥതയോ ദൈവിക നിയോഗമോ തുറന്നുവയ്ക്കുന്ന τοῦ θεοῦ എന്ന ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ αἴρων
  choice: നീക്കുന്ന
  rationale: സന്ദർഭത്തിൽ പാപത്തെ ഇല്ലാതാക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിനുള്ള ‘ചുമക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: ലോകത്തിന്റെ പാപം
  rationale: ഏകവചനമായ ἁμαρτίανയും ലോകമൊട്ടാകെയുള്ള വ്യാപ്തിയും ഉറവിടത്തിന് അനുസരിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: αἴρων എന്ന വർത്തമാന കർത്തൃവാചകത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: നീക്കുന്ന
  alternative: ചുമക്കുന്ന
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ‘പാപം നീക്കുക’ ശക്തമായ വായനയാണ്; എങ്കിലും ബലിയർപ്പണവുമായി ബന്ധപ്പെട്ട ‘പാപം ചുമക്കുക’ എന്ന ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി നിശ്ശബ്ദമായി ഒഴിവാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘ദൈവത്തിന്റെ കുഞ്ഞാട്’ എന്ന പ്രയോഗത്തിന്റെ കൃത്യമായ സൂചന
  choice: വാചകം വിശദീകരിക്കാതെ അതേ രൂപത്തിൽ നിലനിർത്തി
  alternative: പെസഹാക്കുഞ്ഞാട് അല്ലെങ്കിൽ യാഗക്കുഞ്ഞാട് എന്ന് വ്യക്തമാക്കുക
  rationale: മൂലവാക്യം ഒരു പ്രത്യേക പഴയനിയമ പശ്ചാത്തലം തുറന്നുപറയുന്നില്ല; അതിനാൽ ഏതെങ്കിലും ഏക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഭൂതകാല ആഖ്യാനരൂപത്തിൽ അവതരിപ്പിച്ചു. ‘ഇതാ’ എന്നത് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗൗരവമുള്ള ശൈലി നിലനിർത്തുന്നു.
