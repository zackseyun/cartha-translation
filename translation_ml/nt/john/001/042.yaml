id: JHN.1.42
reference: John 1:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: ml
  text: 'അവൻ അവനെ യേശുവിന്റെ അടുക്കലേക്കു കൊണ്ടുവന്നു. യേശു അവനെ ഉറ്റുനോക്കി പറഞ്ഞു: “നീ യോഹന്നാന്റെ[a] മകനായ ശിമോൻ ആണ്. നീ കേഫാ[b] എന്നു വിളിക്കപ്പെടും” (കേഫാ എന്നതിന്റെ പരിഭാഷ പത്രോസ് എന്നാണ്).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യോഹന്നാൻ’ എന്നതിനുപകരം ‘യോനാ’ എന്നാണ്; SBLGNT പാഠത്തിൽ ‘യോഹന്നാൻ’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ‘കേഫാ’ എന്ന സെമിറ്റിക് (അരമായ) പേരിന് തത്തുല്യമായ ഗ്രീക്ക് പേരാണ് ‘പത്രോസ്’; ഈ പേരുകൾക്ക് ‘പാറ’ അല്ലെങ്കിൽ ‘കല്ല്’ എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: അവൻ അവനെ യേശുവിന്റെ അടുക്കൽ കൊണ്ടുവന്നു
  rationale: ἄγω എന്ന ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിയും πρός എന്നതിന്റെ ഒരാളുടെ അടുക്കലേക്കുള്ള ചലനവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ സർവനാമങ്ങൾ മൂലം നിലനിൽക്കുന്ന സന്ദർഭാശ്രിതത്വം പേരുകൾ ചേർത്ത് പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐμβλέψας αὐτῷ
  choice: അവനെ സൂക്ഷിച്ചുനോക്കിക്കൊണ്ട്
  rationale: ἐμβλέπω സാധാരണ നോട്ടത്തേക്കാൾ ശ്രദ്ധയോടെയുള്ള നോട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘സൂക്ഷിച്ചുനോക്കി’ ആ തീവ്രത സ്വാഭാവികമായി പകരുന്നു.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: നീ യോഹന്നാന്റെ മകൻ ശിമോൻ ആണ്
  rationale: വ്യക്തമായ σὺ നൽകുന്ന നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുകയും SBLGNTയിലെ Ἰωάννου എന്ന പാഠം പിന്തുടരുകയും ചെയ്യുന്നു.
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: നീ കേഫാ എന്നു വിളിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; Κηφᾶς വ്യക്തിനാമമായതിനാൽ അർത്ഥവിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: കേഫാ എന്നതിന്റെ പരിഭാഷ പത്രോസ് എന്നാണ്
  rationale: ഗ്രീക്ക് വാചകത്തിലെ വിശദീകരണപരമായ പരാന്തീസും രണ്ട് വ്യക്തിനാമങ്ങളും നിലനിർത്തുന്നു; Πέτρος എന്നതിന് മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘പത്രോസ്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: Κηφᾶς/Πέτρος എന്ന പേരുകളുടെ വിശദീകരണം
  choice: പ്രധാന വാചകത്തിൽ ‘കേഫാ’ എന്നും ‘പത്രോസ്’ എന്നും വ്യക്തിനാമങ്ങളായി നിലനിർത്തുക
  alternative: രണ്ടിനും ‘പാറ’ അല്ലെങ്കിൽ ‘കല്ല്’ എന്ന് അർത്ഥവിവർത്തനം നൽകുക
  rationale: ഈ വാക്യം പുതിയ പേര് നൽകുന്നതിനെക്കുറിച്ചാണ്; മൂലപാഠം സെമിറ്റിക് പേരിന് ഗ്രീക്ക് പേരിലൂടെ വിശദീകരണം നൽകുന്നു. പേരുകൾ ലിപ്യന്തരണം ചെയ്യുകയും അവയുടെ അടിസ്ഥാന അർത്ഥം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നത് പിന്നീടുള്ള ദൈവശാസ്ത്ര നിഗമനങ്ങൾ പ്രധാന വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ പദപ്രാധാന്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘അവൻ അവനെ’ എന്ന ആവർത്തനം സന്ദർഭത്തിൽ വ്യക്തമായിരിക്കെ മൂലത്തിലെ സർവനാമഘടന സംരക്ഷിക്കുന്നു. വ്യക്തിനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ സ്വീകരിച്ചു.
