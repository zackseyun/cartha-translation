id: JHN.1.21
reference: John 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: ml
  text: 'അവർ അവനോട് ചോദിച്ചു: “അപ്പോൾ എന്ത്? നീ ഏലിയാവാണോ?” അവൻ പറയുന്നു[b]: “ഞാനല്ല.” “നീ ആ പ്രവാചകനാണോ?”[a] അവൻ മറുപടി പറഞ്ഞു: “അല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആ പ്രത്യേക പ്രവാചകൻ”; മോശെയെപ്പോലുള്ളവനായി വരുമെന്ന് പ്രതീക്ഷിക്കപ്പെട്ട പ്രവാചകനെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത് (ആവർത്തനം 18:15, 18).
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്കിൽ ഇവിടെ ചരിത്രവർത്തമാനകാലമാണ്: “അവൻ പറയുന്നു.” വിവരണത്തിന് സജീവത നൽകുന്ന ശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ചോദിച്ചു
  rationale: ἐρωτάω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ഇവിടെ നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നു; തീവ്രത കൂട്ടാതെ സ്വാഭാവികമായി അർഥം നൽകുന്നത് ‘ചോദിച്ചു’ ആണ്.
- source_word: Τί οὖν;
  choice: എങ്കിൽ പിന്നെ എന്ത്?
  rationale: മുൻപത്തെ നിഷേധങ്ങളിൽനിന്ന് ഉയരുന്ന തുടർചോദ്യത്തിന്റെ യുക്തിയും ഗ്രീക്കിലെ സംക്ഷിപ്തവും അല്പം അപൂർണ്ണവുമായ ഭാവവും ഇത് നിലനിർത്തുന്നു.
- source_word: σὺ Ἠλίας εἶ
  choice: നീ ഏലിയാവാണോ?
  rationale: σὺ എന്ന സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാള ചോദ്യഘടനയിൽ നിലനിർത്തുന്നു; Ἠλίας എന്ന പേര് മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപമായ ‘ഏലിയാവ്’ എന്നു നൽകുന്നു.
- source_word: Οὐκ εἰμί
  choice: ഞാനല്ല
  rationale: കർമപൂരകം ചേർക്കാതെ ഗ്രീക്കിലെ ഹ്രസ്വവും ഉറച്ചതുമായ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: Ὁ προφήτης
  choice: ആ പ്രവാചകൻ
  rationale: നിർദ്ദിഷ്ടമായ, പ്രതീക്ഷിക്കപ്പെട്ട ഒരു വ്യക്തിയെയാണ് ഗ്രീക്ക് നിർദ്ദേശിക്കുന്നത്; ‘ആ പ്രവാചകൻ’ ഈ നിർദ്ദിഷ്ടത നിലനിർത്തുന്നു, എന്നാൽ അദ്ദേഹം ആരെന്ന് മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: λέγει
  choice: അവൻ പറയുന്നു
  rationale: യോഹന്നാന്റെ വിവരണത്തിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി രംഗത്തിന് ഗ്രീക്കിലുള്ള സജീവത നൽകുന്നു.
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ചോദ്യത്തോടുള്ള പ്രതികരണം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: Οὔ
  choice: അല്ല
  rationale: ഒറ്റയ്ക്കു നിൽക്കുന്ന നിഷേധകണത്തിന്റെ നേരിട്ടുള്ള, ഹ്രസ്വമായ മലയാള തുല്യം.
theological_decisions:
- issue: ‘ആ പ്രവാചകൻ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: മുഖ്യവാചകത്തിൽ ‘ആ പ്രവാചകൻ’ എന്നു മാത്രം നൽകി നിർദ്ദിഷ്ടത നിലനിർത്തുന്നു.
  alternative: ആവർത്തനം 18:15, 18-ൽ പ്രതീക്ഷിക്കപ്പെട്ട മോശെയെപ്പോലുള്ള പ്രവാചകൻ എന്നു മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക; അല്ലെങ്കിൽ ഒരു സാധാരണ പ്രവാചകൻ എന്നു നൽകുക.
  rationale: ὁ എന്ന നിർദ്ദിഷ്ട ഉപപദം അറിയപ്പെടുന്ന പ്രതീക്ഷിത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. സാദ്ധ്യമായ മോശെസദൃശ പ്രവാചകസൂചന അടിക്കുറിപ്പിൽ അറിയിക്കാം; മുഖ്യവാചകം ആ തിരിച്ചറിയൽ അന്തിമമായി തീർപ്പാക്കുന്നില്ല.
- issue: ഏലിയാവിനെക്കുറിച്ചുള്ള യോഹന്നാന്റെ നിഷേധം
  choice: ‘ഞാനല്ല’ എന്ന നേരിട്ടുള്ള നിഷേധം വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
  alternative: ‘ഞാൻ അക്ഷരാർഥത്തിൽ ഏലിയാവല്ല’ എന്നു വികസിപ്പിക്കുക, അല്ലെങ്കിൽ മറ്റു സുവിശേഷഭാഗങ്ങളുമായി പൊരുത്തപ്പെടുത്തുന്ന വിശദീകരണം ചേർക്കുക.
  rationale: ഈ വാക്യം യോഹന്നാന്റെ നേരിട്ടുള്ള നിഷേധം രേഖപ്പെടുത്തുന്നു. മറ്റു ഭാഗങ്ങളുമായി വ്യാഖ്യാനപരമായി സമന്വയിപ്പിക്കുന്നത് വിവർത്തനത്തിന്റെ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. സംഭാഷണത്തിലെ ഹ്രസ്വതയും തുടർചോദ്യങ്ങളുടെ പെട്ടെന്നുള്ള ഗതിയും നിലനിർത്തി. ‘നീ’ എന്ന രൂപം മൂലത്തിലെ ഏകവചന നേരിട്ടുള്ള അഭിസംബോധന സ്വാഭാവികമായി പകർത്തുന്നു; വ്യാഖ്യാനപരമായ ബഹുമാനരൂപമോ മതവിഭാഗപരമായ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
