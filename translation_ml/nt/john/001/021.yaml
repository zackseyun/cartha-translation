  source_fidelity: The draft accurately represents the sequence of questions, the emphatic direct questions concerning Elijah and ‘the Prophet,’ John’s concise denials, and the Greek historical present in λέγει. ‘ആ പ്രവാചകൻ’ appropriately preserves the definite, recognized title without deciding its referent.
