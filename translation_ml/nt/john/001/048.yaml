id: JHN.1.48
reference: John 1:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: ml
  text: 'നഥനയേൽ അവനോടു പറഞ്ഞു: “അങ്ങ് എന്നെ എങ്ങനെ അറിയുന്നു?”[a] യേശു അവനോടു ഉത്തരം പറഞ്ഞു: “ഫിലിപ്പോസ് നിന്നെ വിളിക്കുന്നതിനുമുമ്പ്, നീ അത്തിമരത്തിന്റെ ചുവട്ടിലായിരുന്നപ്പോൾ ഞാൻ നിന്നെ കണ്ടു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അങ്ങ് എന്നെ എവിടെനിന്ന് അറിയുന്നു?”'
    reason: Πόθεν എന്ന പദത്തിന്റെ അക്ഷരാർഥരൂപം സംരക്ഷിക്കുന്ന പദസംബന്ധിയായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: അങ്ങ് എന്നെ എങ്ങനെ അറിയുന്നു?
  rationale: Πόθεν അക്ഷരാർഥത്തിൽ ‘എവിടെനിന്ന്’ എന്നാണെങ്കിലും γινώσκεις എന്ന ക്രിയയോടുകൂടെ ഇവിടെ അറിവിന്റെ ഉറവിടമോ വിധമോ ചോദിക്കുന്ന പ്രയോഗമാണ്. സ്വാഭാവികമായ മലയാളത്തിൽ ‘എങ്ങനെ അറിയുന്നു?’ ആ അർഥം നൽകുന്നു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: γινώσκεις
  choice: അറിയുന്നു
  rationale: വ്യക്തിയെക്കുറിച്ചുള്ള അറിവിനെയോ പരിചയത്തെയോ സൂചിപ്പിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപ്രയോഗം.
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: യേശു അവനോട് ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം നൽകി, പറഞ്ഞു’ എന്ന ഇരട്ട ക്രിയാരൂപത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉത്തരം പറഞ്ഞു’ എന്നൊറ്റ പ്രയോഗത്തിൽ സമഗ്രമായി ലഭിക്കുന്നു.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: ഫിലിപ്പോസ് നിന്നെ വിളിക്കുന്നതിനുമുമ്പ്
  rationale: Πρὸ τοῦ + infinitive മുൻകാലബന്ധം വ്യക്തമാക്കുന്നു; φωνέω ഇവിടെ ‘വിളിക്കുക’ എന്ന സാധാരണ അർഥത്തിലാണ്.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: നീ അത്തിമരത്തിന്റെ ചുവട്ടിൽ ഇരിക്കുമ്പോൾത്തന്നെ
  rationale: ὄντα ഇവിടെ നഥനയേലിന്റെ അന്നത്തെ സ്ഥിതിയെ സൂചിപ്പിക്കുന്ന സാഹചര്യപങ്കാളിത്തരൂപമാണ്. മലയാളത്തിൽ മരത്തിന്റെ ചുവട്ടിലായിരുന്നതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഇരിക്കുമ്പോൾ’ ഉപയോഗിച്ചു; ‘ത്തന്നെ’ ആ സാഹചര്യത്തിൽ കണ്ടുവെന്ന ഊന്നൽ സുതാര്യമാക്കുന്നു.
- source_word: συκῆν
  choice: അത്തിമരം
  rationale: συκῆ എന്നതിന് നിലവാരമുള്ള മലയാള സസ്യനാമം.
- source_word: εἶδόν σε
  choice: ഞാൻ നിന്നെ കണ്ടു
  rationale: aorist indicative-ന്റെ ലളിതമായ ഭൂതകാലബലം നേരിട്ട് നിലനിർത്തുന്നു; സംഭവങ്ങളുടെ മുൻകാലബന്ധം ഇതിനുമുമ്പുള്ള ഉപവാക്യം തന്നെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നഥനയേലിനെക്കുറിച്ചുള്ള യേശുവിന്റെ അറിവിന്റെ സ്വഭാവം
  choice: യേശു മുമ്പേ നഥനയേലിനെ കണ്ടുവെന്ന പ്രസ്താവന വിശദീകരണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: അത് അത്ഭുതകരമായ മുൻജ്ഞാനമാണെന്നോ സാധാരണ നിരീക്ഷണമാണെന്നോ പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം യേശു എങ്ങനെ കണ്ടു അല്ലെങ്കിൽ അറിഞ്ഞു എന്നു വിശദീകരിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സാധ്യതകളിൽ ഒന്നിനെ പരിഭാഷയിലൂടെ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. നഥനയേൽ യേശുവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; യേശുവിന്റെ മറുപടിയിൽ ഏകവചന അടുപ്പരൂപമായ ‘നിന്നെ’ മൂലഭാഷയിലെ ഏകവചനത്തെ നിലനിർത്തുന്നു.
