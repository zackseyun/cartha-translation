id: JHN.1.11
reference: John 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: ml
  text: അവൻ തനിക്കു സ്വന്തമായതിലേക്കു വന്നു[a]; എന്നാൽ അവന്റെ സ്വന്തജനങ്ങൾ അവനെ സ്വീകരിച്ചില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ തന്റേതായവയിലേക്കു വന്നു.” ആദ്യത്തെ ഗ്രീക്ക് പ്രയോഗം നപുംസക ബഹുവചനമാണ്; തുടർന്ന് വരുന്ന “അവന്റെ സ്വന്തജനങ്ങൾ” എന്ന പുരുഷലിംഗ ബഹുവചനത്തിൽനിന്ന് അത് വ്യത്യസ്തമാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “അവനെ അംഗീകരിച്ചില്ല” അല്ലെങ്കിൽ “അവനെ സ്വാഗതം ചെയ്തില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: തനിക്കു സ്വന്തമായതിലേക്ക്
  rationale: നപുംസക ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗം വ്യക്തികളെയല്ല, അവനു സ്വന്തമായിരുന്ന ഇടം, ഭവനം, മേഖല, അല്ലെങ്കിൽ വസ്തുക്കൾ എന്നിവയെ സൂചിപ്പിക്കുന്നു. അവയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἦλθεν
  choice: വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാല ആഖ്യാനാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: οἱ ἴδιοι
  choice: അവന്റെ സ്വന്തജനങ്ങൾ
  rationale: പുരുഷലിംഗ ബഹുവചനം ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ആദ്യത്തെ നപുംസക പ്രയോഗത്തിൽനിന്നുള്ള വ്യത്യാസം ‘ജനങ്ങൾ’ എന്നു വ്യക്തമാക്കി നിലനിർത്തുന്നു.
- source_word: παρέλαβον
  choice: സ്വീകരിച്ചില്ല
  rationale: ഒരു വ്യക്തിയെ കൈക്കൊള്ളുക, അംഗീകരിക്കുക, സ്വാഗതം ചെയ്യുക എന്നീ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സന്ദർഭത്തിലെ വചനത്തെ/വെളിച്ചത്തെ സൂചിപ്പിക്കുന്ന പുരുഷപ്രത്യയം സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἴδιος എന്ന പദത്തിന്റെ രണ്ടു പ്രയോഗങ്ങളിലെ സൂചനയും വ്യത്യാസവും
  choice: ആദ്യപ്രയോഗം അവനു സ്വന്തമായിരുന്ന ഇടം, മേഖല, ഭവനം, അല്ലെങ്കിൽ വസ്തുക്കൾ എന്നിവയെ പൊതുവായി സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തേത് അവന്റെ സ്വന്തം ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
  alternative: രണ്ടു പ്രയോഗങ്ങളും അവന്റെ സ്വന്തം ജനങ്ങളെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ആദ്യത്തേത് പ്രത്യേകമായി അവന്റെ ഭവനത്തെ സൂചിപ്പിക്കുന്നു.
  rationale: ഗ്രീക്കിൽ ആദ്യത്തേത് നപുംസക ബഹുവചനവും രണ്ടാമത്തേത് പുരുഷലിംഗ ബഹുവചനവുമാണ്. അതിനാൽ സ്ഥലം/സ്വത്ത് എന്ന ആശയവും വ്യക്തികൾ എന്ന ആശയവും തമ്മിലുള്ള മനഃപൂർവമായ വ്യത്യാസം നിലനിർത്തി, ആദ്യത്തേതിനെ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്കു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘തനിക്കു സ്വന്തമായത്’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു; ‘സ്വന്തജനങ്ങൾ’ വ്യക്തികളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
