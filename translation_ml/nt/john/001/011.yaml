  source_fidelity: ഗ്രീക്ക് εἰς τὰ ἴδια (നപുംസക ബഹുവചനം) എന്ന ആദ്യപ്രയോഗവും οἱ ἴδιοι (പുരുഷലിംഗ ബഹുവചനം) എന്ന രണ്ടാംപ്രയോഗവും തമ്മിലുള്ള വ്യത്യാസം വിവർത്തനം വ്യക്തമായി സംരക്ഷിക്കുന്നു. ‘തനിക്കു സ്വന്തമായതിലേക്കു’ ആദ്യപ്രയോഗത്തിന്റെ മേഖലം/സ്വത്ത്/തന്റേതായവ എന്നിവയെന്ന തുറന്ന സൂചന നിലനിർത്തുന്നു; ‘അവന്റെ സ്വന്തജനങ്ങൾ’ വ്യക്തികളെ ശരിയായി വ്യക്തമാക്കുന്നു. παρέλαβον-ന് ‘സ്വീകരിച്ചില്ല’ യോജിച്ച വിശാലമായ പരിഭാഷയാണ്.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘എന്നാൽ’ ഇവിടെ നിഷേധാത്മകമായ രണ്ടാംവാക്യത്തിന്റെ വിരുദ്ധത തെളിയിക്കുന്ന സ്വാഭാവിക സംയോജകമാണ്.
  terminology: ‘സ്വന്തമായത്,’ ‘സ്വന്തജനങ്ങൾ,’ ‘സ്വീകരിക്കുക’ എന്നീ പദങ്ങൾ സ്ഥിരതയോടെയും അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെയും ഉപയോഗിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പുകൾ നപുംസക/പുരുഷലിംഗ ബഹുവചനവ്യത്യാസവും ‘സ്വീകരിക്കുക’ എന്നതിന്റെ പ്രസക്തമായ പകരംനിലപാടുകളും കൃത്യമായി നൽകുന്നു.
