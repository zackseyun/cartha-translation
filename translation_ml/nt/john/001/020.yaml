id: JHN.1.20
reference: John 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: ml
  text: 'അവൻ ഏറ്റുപറഞ്ഞു; നിഷേധിച്ചില്ല; അവൻ ഏറ്റുപറഞ്ഞത് ഇതാണ്: “ഞാൻ മശീഹയല്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός (ക്രിസ്റ്റോസ്) എന്ന സ്ഥാനപ്പേരാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്. ഈ സന്ദർഭത്തിൽ അത് മശീഹയെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: സമ്മതിച്ചു
  rationale: ഇവിടെ ക്രിയ പരസ്യവും വ്യക്തവുമായ അംഗീകാരത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്താൻ ‘സമ്മതിച്ചു’ രണ്ടിടത്തും ഉപയോഗിച്ചു; ആദ്യപ്രയോഗത്തിലെ ‘തുറന്നു’ എന്നത് പ്രസ്താവനയുടെ പരസ്യസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἠρνήσατο
  choice: നിഷേധിച്ചില്ല
  rationale: യോഹന്നാന്റെ ഭാഷാപ്രയോഗത്തിൽ ἀρνέομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘നിഷേധിക്കുക’ എന്നാണ്; സമ്മതിച്ചതിനെ ഊന്നിപ്പറയുന്ന വിരുദ്ധപ്രയോഗവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: καὶ ... καὶ ... καὶ
  choice: …; … . … എന്ന് …
  rationale: ആവർത്തിക്കുന്ന καί നൽകുന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമവും വിരാമചിഹ്നങ്ങളും ഉപയോഗിച്ച് പുനരാവിഷ്കരിച്ചു. മൂന്ന് ഘട്ടങ്ങളായ സമ്മതിക്കൽ, നിഷേധിക്കാതിരിക്കൽ, വ്യക്തമായ പ്രഖ്യാപനം എന്നിവ നിലനിർത്തി.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: ഞാൻ … അല്ല
  rationale: വ്യക്തമായി നൽകിയ Ἐγώയുടെ ഊന്നൽ മലയാളത്തിലെ നേരിട്ടുള്ള ‘ഞാൻ … അല്ല’ എന്ന നിഷേധപ്രസ്താവനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു പേരുപോലെയല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമമായാണ് പ്രവർത്തിക്കുന്നത്. അതിനാൽ യഹൂദ മശീഹാപ്രതീക്ഷ വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സ്നാപകയോഹന്നാൻ താൻ പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തനല്ലെന്ന് നിഷേധിക്കുന്ന സന്ദർഭമാണിത്. അതിനാൽ സ്ഥാനനാമസ്വഭാവവും യഹൂദ പശ്ചാത്തലവും സൂക്ഷിക്കുന്ന ‘മശീഹ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; സഭാപരമായി പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ശക്തമായ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയപ്പോൾ, മലയാളത്തിൽ അസ്വാഭാവികമായ തുടർച്ചയായ സംയോജകങ്ങൾ ഒഴിവാക്കി വിരാമചിഹ്നങ്ങളിലൂടെ പ്രസ്താവനയുടെ പടിവാതിൽപോലുള്ള ഊന്നൽ പ്രകടമാക്കി.
