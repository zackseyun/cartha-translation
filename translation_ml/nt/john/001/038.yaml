id: JHN.1.38
reference: John 1:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: ml
  text: 'യേശു തിരിഞ്ഞ്, അവർ അവനെ അനുഗമിച്ചുകൊണ്ടിരിക്കുന്നതു കണ്ടു, അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്താണ് അന്വേഷിക്കുന്നത്?” അവർ അവനോടു പറഞ്ഞു: “റബ്ബീ” (വിവർത്തനം ചെയ്താൽ ‘ഗുരുവേ’ എന്നാണ് അർഥം), “അങ്ങ് എവിടെയാണ് താമസിക്കുന്നത്?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “റബ്ബീ” എന്നത് “ഗുരു” എന്നർഥമുള്ള എബ്രായ/അരമായ അഭിസംബോധനയാണ്.
    reason: cultural_note
  - marker: b
    text: ഇവിടെ “താമസിക്കുക” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ യോഹന്നാന്റെ സുവിശേഷത്തിൽ മറ്റിടങ്ങളിൽ “നിലനിൽക്കുക” എന്ന അർഥത്തിലും ഉപയോഗിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: തിരിഞ്ഞ്
  rationale: യേശു സംസാരിക്കുന്നതിനുമുമ്പ് ചെയ്ത ചലനത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു; ദിശ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: θεασάμενος
  choice: കണ്ട്
  rationale: ശ്രദ്ധാപൂർവമായ ദൃശ്യഗ്രഹണത്തെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀκολουθοῦντας
  choice: അനുഗമിക്കുന്നതു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും, ശാരീരികമായി പിന്നാലെ ചെല്ലുന്നതും ശിഷ്യത്വത്തിലേക്കുള്ള സൂചനയും നിർബന്ധിത വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Τί ζητεῖτε;
  choice: നിങ്ങൾ എന്താണ് അന്വേഷിക്കുന്നത്?
  rationale: ζητέω എന്നതിന്റെ സാധാരണ തിരച്ചിൽ എന്ന അർഥവും യോഹന്നാനിലെ കൂടുതൽ ആഴമുള്ള അന്വേഷണമെന്ന സാധ്യതയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: വാചകം തന്നെ ഉടൻ അർഥവിവരണം നൽകുന്നതിനാൽ സെമിറ്റിക് അഭിസംബോധന ലിപ്യന്തരണം ചെയ്തു നിലനിർത്തുന്നു.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: വിവർത്തനം ചെയ്താൽ ‘ഗുരുവേ’ എന്നർഥം
  rationale: സംബോധനാരൂപമായ Διδάσκαλε-നെ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുകയും യോഹന്നാന്റെ വിശദീകരണസ്വഭാവം കാക്കുകയും ചെയ്യുന്നു.
- source_word: ποῦ μένεις;
  choice: അങ്ങ് എവിടെയാണ് താമസിക്കുന്നത്?
  rationale: ഈ സന്ദർഭത്തിലെ താമസസ്ഥലത്തെക്കുറിച്ചുള്ള പ്രായോഗിക ചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിൽ പിന്നീട് ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം നേടുന്ന μένω എന്ന ക്രിയയുടെ ഈ ആദ്യ സന്ദർഭത്തിലെ വിവർത്തനം
  choice: അങ്ങ് എവിടെയാണ് താമസിക്കുന്നത്?
  alternative: അങ്ങ് എവിടെയാണ് വസിക്കുന്നത്?/നിലനിൽക്കുന്നത്?
  rationale: തൽക്ഷണ സന്ദർഭത്തിൽ അവർ യേശുവിന്റെ താമസസ്ഥലം ചോദിക്കുകയാണ്. ‘താമസിക്കുന്നു’ എന്നത് ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അതേസമയം മൂലക്രിയയുടെ വിശാലമായ യോഹന്നാനീയ പ്രയോഗം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ζητέω എന്ന ക്രിയയിലെ സാധ്യതയുള്ള യോഹന്നാനീയ ദ്വയാർഥം
  choice: നിങ്ങൾ എന്താണ് അന്വേഷിക്കുന്നത്?
  alternative: നിങ്ങൾ എന്താണ് തിരയുന്നത്?
  rationale: ‘അന്വേഷിക്കുന്നത്’ സാധാരണ തിരച്ചിലിനെയും കൂടുതൽ ആഴമുള്ള ആത്മീയ അന്വേഷണമെന്ന സാധ്യതയെയും മായ്ച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യരീതി. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ‘റബ്ബീ’ എന്ന സാംസ്കാരിക പദം വാചകത്തിനുള്ളിലെ വിശദീകരണത്തോടെയും അടിക്കുറിപ്പോടെയും നിലനിർത്തി.
