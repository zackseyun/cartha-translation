  to: 'യേശു തിരിഞ്ഞ്, അവർ അവനെ അനുഗമിച്ചുകൊണ്ടിരിക്കുന്നതു കണ്ടു, അവരോടു പറഞ്ഞു: “നിങ്ങൾ എന്താണ് അന്വേഷിക്കുന്നത്?” അവർ അവനോടു പറഞ്ഞു: “റബ്ബീ” (വിവർത്തനം ചെയ്താൽ ‘ഗുരുവേ’ എന്നാണ് അർഥം), “അങ്ങ് എവിടെയാണ് താമസിക്കുന്നത്?”[a][b]'
  rationale: യേശുവിനെ കർമമായി വ്യക്തമായി ചേർത്ത് ἀκολουθοῦντας-ന്റെ അർഥം പുനഃസ്ഥാപിച്ചു. മൂലത്തിലെ സംസാരക്രിയകൾ “പറഞ്ഞു” എന്നു വിവർത്തനം ചെയ്ത്, തിരച്ചിൽ സൂചിപ്പിക്കുന്ന ζητέω, റബ്ബീയുടെ വാചകത്തിനുള്ളിലെ വിശദീകരണം, താമസസ്ഥലം ചോദിക്കുന്ന μένω എന്നിവയുടെ അർഥവും ശൈലിയും നിലനിർത്തി. അടിക്കുറിപ്പ് b കൂടുതൽ സ്വാഭാവികമായും കൃത്യമായും പുനരാഖ്യാനം ചെയ്തു.
