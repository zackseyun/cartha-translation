lexical_decisions:
- source_word: ταῦτα
  choice: ഇവ
  rationale: മുൻവിവരിച്ച സംഭാഷണവും സംഭവങ്ങളും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം; ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: ἐν Βηθανίᾳ
  choice: ബേഥാന്യയിൽവെച്ച്
  rationale: സ്ഥലനാമത്തോടുകൂടിയ ἐν എന്ന സ്ഥലസൂചക പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγένετο
  choice: സംഭവിച്ചത്
  rationale: സംഭവങ്ങൾ നടന്നുവെന്ന ആഖ്യാനാർഥം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: യോർദാനക്കരെ
  rationale: നദിയുടെ മറുകരയിലുള്ള സ്ഥലം എന്ന ബന്ധപരമായ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഏത് ദിശയെന്നത് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ὅπου
  choice: അവിടെയാണ്
  rationale: മുൻപറഞ്ഞ സ്ഥലത്തെ ബന്ധിപ്പിക്കുന്ന ὅπου എന്ന അവ്യയത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: യോഹന്നാൻ സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്നത്
  rationale: ἦν + വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ഭൂതകാലപ്രവർത്തനം ‘-ച്ചുകൊണ്ടിരുന്നത്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; βαπτίζωയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ ‘സ്നാനം കഴിപ്പിക്കുക’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: Βηθανίᾳ (‘ബേഥാന്യ’) എന്ന സ്ഥലനാമവും Βηθαβαρᾷ (‘ബേഥാബാര’) എന്ന പാഠഭേദവും
  choice: ബേഥാന്യ
  alternative: ബേഥാബാര
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മൂലപാഠത്തിൽ Βηθανίᾳ എന്നാണ്. അതിനാൽ മുഖ്യപാഠം അതിനെ പിന്തുടരുന്നു; ചില കൈയെഴുത്തുപ്രതികളിലും പിൽക്കാല വിവർത്തനപാരമ്പര്യങ്ങളിലും കാണുന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യോർദാനക്കരെ’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മൂലത്തിലെ സ്ഥലബന്ധം കൃത്യമായി നിലനിർത്തുന്നതുമാണ്.
