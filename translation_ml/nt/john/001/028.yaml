  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: ml
  text: ഇവ യോർദാന്നക്കരെ, യോഹന്നാൻ സ്നാനം കഴിപ്പിച്ചുകൊണ്ടിരുന്ന ബേഥാന്യയിൽ[a] വെച്ചു സംഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിലും പിൽക്കാല വിവർത്തനപാരമ്പര്യങ്ങളിലും ‘ബേഥാന്യ’ എന്നതിനുപകരം ‘ബേഥാബാര’ എന്നാണ് വായിക്കുന്നത്.
