  text: Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: ml
  text: ദൈവത്തിൽനിന്ന് അയക്കപ്പെട്ട ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു; അവന്റെ പേര് യോഹന്നാൻ എന്നായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: ഉണ്ടായി
  rationale: ഇവിടെ γίνομαι ആഖ്യാനത്തിൽ ഒരു പുതിയ വ്യക്തിയെ അവതരിപ്പിക്കുന്നു. ‘ഉണ്ടായി’ അസ്തിത്വപരമായ അർഥം നിലനിർത്തുന്നു; സൃഷ്ടിക്കപ്പെട്ടു എന്നോ വെറുതെ പ്രത്യക്ഷപ്പെട്ടു എന്നോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ
  rationale: ഏകവചനത്തിലുള്ള ഈ പദം യോഹന്നാൻ എന്ന പുരുഷവ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഒരു മനുഷ്യൻ’ സ്വാഭാവികവും മൂലപദത്തോട് അടുത്തതുമാണ്.
- source_word: ἀπεσταλμένος
  choice: അയയ്ക്കപ്പെട്ട
  rationale: പൂർണ്ണകാല കർമണി പങ്കുപദം ദൗത്യത്തിനായി അയയ്ക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം ദൈവിക നിയോഗത്തിന്റെ ആശയം നിലനിർത്തുകയും കർമണി ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: παρὰ θεοῦ
  choice: ദൈവത്തിന്റെ അടുക്കൽനിന്ന്
  rationale: παρά + genitive ഉറവിടത്തെയോ പുറപ്പെടുന്ന സ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിന്റെ അടുക്കൽനിന്ന്’ ഉറവിടത്തിന് ഊന്നൽ നൽകുന്നു; ‘ദൈവത്താൽ’ എന്ന പ്രയോഗം നൽകാവുന്ന കർത്തൃത്വ-ഊന്നൽ അനാവശ്യമായി മുൻനിരയിൽ കൊണ്ടുവരുന്നില്ല.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: അവന്റെ പേര് യോഹന്നാൻ എന്നായിരുന്നു
  rationale: ‘അവന് പേര്—യോഹന്നാൻ’ എന്ന ഗ്രീക്ക് ശൈലിയുടെ തിരിച്ചറിയൽബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി അംഗീകരിക്കപ്പെട്ട പരമ്പരാഗത നാമരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: യോഹന്നാന്റെ ദൗത്യത്തിന്റെ സ്വഭാവം
  choice: യോഹന്നാൻ ദൈവത്തിന്റെ അടുക്കൽനിന്ന് അയയ്ക്കപ്പെട്ടവനായി അവതരിപ്പിക്കപ്പെടുന്നു.
  alternative: യോഹന്നാൻ ദൈവത്താൽ അയയ്ക്കപ്പെട്ടു.
  rationale: ἀπεσταλμένος παρὰ θεοῦ എന്നത് ദൈവിക ഉറവിടവും നിയോഗവും സൂചിപ്പിക്കുന്നു. പ്രവാചകപദവിയെക്കുറിച്ചോ മറ്റു പിൽക്കാല ദൈവശാസ്ത്ര നിർവചനങ്ങളെക്കുറിച്ചോ വാക്യം പറയുന്നതിലധികം വിവർത്തനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ഉറവിട-ഊന്നൽ സംരക്ഷിക്കാൻ ‘ദൈവത്തിന്റെ അടുക്കൽനിന്ന്’ ഉപയോഗിച്ചു. ഈ വാക്യത്തിൽ അടിക്കുറിപ്പ് ആവശ്യമായ നിർണായക പാഠഭേദമോ വിവർത്തനസന്ദിഗ്ധതയോ ഇല്ല.
