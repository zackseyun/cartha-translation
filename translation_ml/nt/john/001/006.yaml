revisions:
- from: ദൈവത്തിന്റെ അടുക്കൽനിന്ന് അയയ്ക്കപ്പെട്ട ഒരു മനുഷ്യൻ ഉണ്ടായി; അവന്റെ പേര് യോഹന്നാൻ എന്നായിരുന്നു.
  to: ദൈവത്തിൽനിന്ന് അയക്കപ്പെട്ട ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു; അവന്റെ പേര് യോഹന്നാൻ എന്നായിരുന്നു.
  rationale: 'The revision replaces an unnecessarily spatial rendering of παρὰ θεοῦ with idiomatic ‘ദൈവത്തിൽനിന്ന്’ and smooths the narrative introduction. It preserves the source text’s claims: a male human figure, divinely sent, named John. No footnote is required, since the compact Greek naming idiom is translated straightforwardly and no material ambiguity needs to be signaled.'
