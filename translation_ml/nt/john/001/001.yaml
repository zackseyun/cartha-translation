  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ml
  text: ആദിയിൽ[b] വചനം ഉണ്ടായിരുന്നു; വചനം ദൈവത്തോടുകൂടെ ആയിരുന്നു; വചനം ദൈവമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'അഥവാ, “വചനം ദൈവികമായിരുന്നു,” അല്ലെങ്കിൽ “ദൈവം എങ്ങനെയായിരുന്നുവോ, അങ്ങനെയായിരുന്നു വചനം.” അവസാന ഖണ്ഡത്തിലെ ഗ്രീക്ക് പദക്രമം ‘ദൈവം’ എന്നതിന് ഗുണാത്മക ഊന്നൽ നൽകുന്നു: വചനത്തെ മുൻഖണ്ഡത്തിലെ ‘ദൈവം’ എന്ന വ്യക്തിയിൽനിന്ന് വേർതിരിച്ചുകൊണ്ടുതന്നെ വചനത്തിന്റെ പൂർണ്ണ ദൈവത്വം ഉറപ്പിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: “ആദിയിൽ” എന്ന പ്രാരംഭപ്രയോഗം ഉല്പത്തി 1:1-നെ പ്രതിധ്വനിപ്പിക്കുകയും വചനത്തെ സൃഷ്ടിയുടെ ആരംഭവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: ആദിയിൽ
  rationale: ഉല്പത്തി 1:1-നോടുള്ള സാഹിത്യപരവും ആശയപരവുമായ പ്രതിധ്വനി നിലനിർത്തുന്ന, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ἦν
  choice: ഉണ്ടായിരുന്നു / ആയിരുന്നു
  rationale: εἰμί എന്ന ക്രിയയുടെ അപൂർണ്ണഭൂതകാലരൂപം സന്ദർഭത്തിനനുസരിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകിയിരിക്കുന്നു. ആദ്യ ഖണ്ഡത്തിൽ അസ്തിത്വവും തുടർന്നുള്ള ഖണ്ഡങ്ങളിൽ ബന്ധവും സ്വഭാവവും വ്യക്തമായി പ്രകടമാക്കാൻ ഈ വ്യത്യാസം സഹായിക്കുന്നു.
- source_word: ὁ λόγος
  choice: വചനം
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ വെളിപ്പെടുത്തലിന്റെയും ദൈവിക വ്യക്തിത്വത്തിന്റെയും അർത്ഥസമ്പുഷ്ടത സൂക്ഷിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ക്രിസ്തുശാസ്ത്രപരമായ വിശേഷണം.
- source_word: πρὸς τὸν θεόν
  choice: ദൈവത്തോടുകൂടെ
  rationale: πρός സൂചിപ്പിക്കുന്ന ബന്ധപരമായ അടുപ്പവും വ്യക്തിപരമായ വ്യതിരിക്തതയും അമിതവ്യാഖ്യാനം കൂടാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവം
  rationale: നിശ്ചിതവും വ്യക്തിപരവുമായ ദൈവപരാമർശം മലയാളത്തിൽ ലേഖനം ആവശ്യമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θεὸς ἦν ὁ λόγος
  choice: വചനം ദൈവമായിരുന്നു
  rationale: വാക്യാരംഭത്തിലെ article ഇല്ലാത്ത predicate θεός-ന്റെ ഗുണാത്മകബലം നിലനിർത്തിക്കൊണ്ട് വചനത്തിന്റെ പൂർണ്ണ ദൈവത്വം ഉറപ്പിക്കുന്നു; മുൻഖണ്ഡത്തിലെ ദൈവത്തോടുള്ള വ്യക്തിപരമായ വ്യതിരിക്തത ഇല്ലാതാക്കുന്നില്ല.
theological_decisions:
- issue: അവസാന ഖണ്ഡത്തിലെ article ഇല്ലാത്ത predicate θεός എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വചനം ദൈവമായിരുന്നു
  alternative: വചനം ദൈവികമായിരുന്നു; ദൈവം എങ്ങനെയായിരുന്നുവോ, അങ്ങനെയായിരുന്നു വചനം
  rationale: ഗ്രീക്ക് പദക്രമവും വ്യാകരണവും ഇവിടെ θεός-ന് പ്രധാനമായും ഗുണാത്മകബലം നൽകുന്നു. മുഖ്യവാചകം വചനത്തിന്റെ പൂർണ്ണ ദൈവത്വം ഉറപ്പിക്കുമ്പോൾ മുൻഖണ്ഡത്തിൽ പറഞ്ഞ ദൈവവും വചനവും ഒരേ വ്യക്തിയാണെന്ന് നിർബന്ധിക്കുന്നില്ല. മറ്റു സാധ്യതകൾ സൂക്ഷ്മത വ്യക്തമാക്കുന്നുവെങ്കിലും ‘ദൈവികം’ എന്നത് മലയാളത്തിൽ ബലം കുറയ്ക്കാം; രണ്ടാമത്തേത് പരിഭാഷയെക്കാൾ വിശദീകരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെ രചിച്ചു. ‘വചനം’ എന്ന സ്ഥാപിത പദം നിലനിർത്തി; വാക്യത്തിന്റെ ത്രിഖണ്ഡ ലയവും ആവർത്തനവും സാധ്യമായത്ര സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
