source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: ml
  text: 'യോഹന്നാൻ അവരോടു മറുപടി പറഞ്ഞു: “ഞാൻ വെള്ളത്തിൽ സ്നാനം കഴിപ്പിക്കുന്നു. നിങ്ങൾ അറിയാത്ത ഒരാൾ നിങ്ങളുടെ ഇടയിൽ[a] നിൽക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ മധ്യേ.”
    reason: μέσος ὑμῶν എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ സാഹിത്യഭാവമുള്ള സാധുവായ മലയാളപര്യായം.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: യോഹന്നാൻ അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ മറുപടി പറയുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയും തുടർന്ന് വരുന്ന കൃതന്തവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരൊറ്റ വാക്യപ്രയോഗമായി നൽകി; ആവർത്തനഭാരം ഒഴിവാക്കിയെങ്കിലും അർഥം നിലനിർത്തുന്നു.
- source_word: βαπτίζω
  choice: സ്നാനം കഴിപ്പിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിലെ മതപരമായ ക്രിയയെ മലയാളത്തിൽ വ്യാപകമായി മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; ‘മുക്കുന്നു’ എന്നത് മൂലപദം നിർബന്ധിക്കാത്ത ആചാരരീതിയെ പ്രത്യേകം നിർവചിച്ചേക്കാം.
- source_word: ἐν ὕδατι
  choice: വെള്ളത്തിൽ
  rationale: ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ സ്ഥലസൂചന നേരിട്ട് നിലനിർത്തുകയും ‘വെള്ളംകൊണ്ട്’ എന്ന ഉപകരണാർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μέσος ὑμῶν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: സംഘത്തിനുള്ളിലെ സാന്നിധ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളം; കൂടുതൽ സാഹിത്യഭാവമുള്ള ‘നിങ്ങളുടെ മധ്യേ’ എന്നതും സാധുവാണ്.
- source_word: ἕστηκεν
  choice: നിൽക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ നില മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയാത്ത ഒരാൾ
  rationale: അജ്ഞാതനായ വ്യക്തിയെക്കുറിച്ചുള്ള ബന്ധവാക്യം മലയാളക്രമത്തിൽ സ്വാഭാവികമായി മുൻപിൽ നൽകി; ‘തിരിച്ചറിയാത്ത’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കാതെ അറിവില്ലായ്മയുടെ വിശാലത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവരുടെ ഇടയിൽ നിൽക്കുന്ന പേരുപറയാത്ത വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: ‘ഒരാൾ’ എന്നു മാത്രം നൽകി തിരിച്ചറിയൽ തുറന്നുവെച്ചു
  alternative: ‘മശീഹാ’ അല്ലെങ്കിൽ ‘യേശു’ എന്നു വ്യക്തമാക്കുക
  rationale: വിശാലമായ സന്ദർഭം ആ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ പേര് പറയാതെ നിലനിർത്തുന്ന ആഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘സ്നാനം കഴിപ്പിക്കുന്നു’ നിലനിർത്തിയെങ്കിലും പ്രത്യേക സ്നാനരീതിയെ നിർബന്ധിക്കുന്ന പദപ്രയോഗം ഒഴിവാക്കി.
