id: JHN.1.45
reference: John 1:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: ml
  text: 'ഫിലിപ്പോസ് നഥനയേലിനെ കണ്ട് അവനോടു പറഞ്ഞു: “മോശെ ന്യായപ്രമാണത്തിൽ ആരെക്കുറിച്ച് എഴുതിയോ, പ്രവാചകന്മാരും ആരെക്കുറിച്ച് എഴുതിയോ, ആ ആളെ ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു—യോസേഫിന്റെ മകനായ, നസറെത്തിൽനിന്നുള്ള യേശുവിനെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: കണ്ടു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ ഭൂതകാലം സ്വാഭാവികമായി സംഭവക്രമം അറിയിക്കുന്നു.
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകി.
- source_word: Ὃν ... ἔγραψεν
  choice: ആരെക്കുറിച്ച് എഴുതിയോ, അവനെ
  rationale: ബന്ധസർവനാമം ἔγραψεν എന്ന ക്രിയയുടെ കർമമാണ്; ‘ആരെക്കുറിച്ച്’ എന്നത് മലയാളത്തിൽ ഈ വ്യക്തിപരമായ പരാമർശം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: മോശയോടു ബന്ധപ്പെട്ട തിരുവെഴുത്തുസമാഹാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: οἱ προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: പ്രവാചകരെയും അവരുടെ തിരുവെഴുത്തുസാക്ഷ്യത്തെയും സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: εὑρήκαμεν
  choice: ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴും പ്രസക്തമായ കണ്ടെത്തൽ എന്ന ഫലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: യോസേഫിന്റെ മകൻ
  rationale: വാക്യത്തിൽ ഫിലിപ്പോസ് നൽകുന്ന സാധാരണ സാമൂഹിക തിരിച്ചറിയൽ മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: നസറെത്തിൽനിന്നുള്ള
  rationale: ἀπό എന്നതിന്റെ ഉത്ഭവം/ബന്ധം സൂചിപ്പിക്കുന്ന അർഥം ‘നിന്നുള്ള’ എന്നതിലൂടെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Φίλιππος / Ναθαναὴλ / Μωϋσῆς / Ἰωσὴφ / Ἰησοῦν
  choice: ഫിലിപ്പോസ് / നഥനയേൽ / മോശ / യോസേഫ് / യേശു
  rationale: ആധുനിക മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപങ്ങൾ സ്വീകരിച്ചു.
theological_decisions:
- issue: ‘യോസേഫിന്റെ മകൻ’ എന്ന തിരിച്ചറിയലും ക്രിസ്തുശാസ്ത്രവും
  choice: ഫിലിപ്പോസിന്റെ വാക്കുകളായി ‘യോസേഫിന്റെ മകൻ’ എന്നു മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: ‘യോസേഫിന്റെ മകനെന്ന് കരുതപ്പെട്ടിരുന്ന’ അല്ലെങ്കിൽ നിയമപരമായ മകൻ എന്ന വിശദീകരണം ചേർക്കുക.
  rationale: മൂലവാക്യം ഫിലിപ്പോസിന്റെ അന്നത്തെ സാധാരണ സാമൂഹിക തിരിച്ചറിയലാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. പിന്നീടുള്ള ക്രിസ്തുശാസ്ത്രബോധം വിവർത്തനത്തിലേക്ക് ചേർത്ത് വാക്യം മാറ്റുന്നത് ഒഴിവാക്കി.
- issue: മോശയുടെയും പ്രവാചകന്മാരുടെയും സാക്ഷ്യത്തിന്റെ വ്യാപ്തി
  choice: മോശയും പ്രവാചകന്മാരും ഒരേ വ്യക്തിയെക്കുറിച്ച് എഴുതിയതായി വാക്യഘടന നിലനിർത്തി.
  alternative: പ്രത്യേക മിശിഹാ പ്രവചനങ്ങളുടെ പട്ടികയോ വിശദീകരണമോ വിവർത്തനത്തിൽ ചേർക്കുക.
  rationale: ഫിലിപ്പോസ് ഉന്നയിക്കുന്ന തിരുവെഴുത്തുസാക്ഷ്യം വ്യക്തമായി നൽകുന്നു; എന്നാൽ മൂലപാഠം പറയുന്നതിലധികം മിശിഹാവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും ചേർന്ന മലയാളം. ‘ന്യായപ്രമാണം’ പോലുള്ള പരിചിത തിരുവെഴുത്തുപദം നിലനിർത്തിയപ്പോൾ, ഗ്രീക്ക് വാക്യത്തിന്റെ സങ്കീർണത മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല.
