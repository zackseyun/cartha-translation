revisions:
- from: 'ഫിലിപ്പോസ് നഥനയേലിനെ കണ്ടു അവനോടു പറഞ്ഞു: “ന്യായപ്രമാണത്തിൽ മോശയും പ്രവാചകന്മാരും ആരെക്കുറിച്ച് എഴുതിയോ, അവനെ ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു—നസറെത്തിൽനിന്നുള്ള യോസേഫിന്റെ മകൻ യേശുവിനെ.”'
  to: 'ഫിലിപ്പോസ് നഥനയേലിനെ കണ്ട് അവനോടു പറഞ്ഞു: “മോശെ ന്യായപ്രമാണത്തിൽ ആരെക്കുറിച്ച് എഴുതിയോ, പ്രവാചകന്മാരും ആരെക്കുറിച്ച് എഴുതിയോ, ആ ആളെ ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു—യോസേഫിന്റെ മകനായ, നസറെത്തിൽനിന്നുള്ള യേശുവിനെ.”'
  rationale: The revision explicitly distinguishes Moses’ writing in the Law from the prophets’ writing, preserving the Greek syntactic scope. It retains the source’s ambiguity-free personal reference and Philip’s unqualified identification of Jesus as Joseph’s son, while using idiomatic modern Malayalam.
