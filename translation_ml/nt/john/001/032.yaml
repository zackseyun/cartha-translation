id: JHN.1.32
reference: John 1:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: ml
  text: 'യോഹന്നാൻ ഇങ്ങനെ സാക്ഷ്യപ്പെടുത്തി: “ആത്മാവ് ഒരു പ്രാവിനെപ്പോലെ[a] സ്വർഗത്തിൽനിന്ന്[b] ഇറങ്ങിവരുന്നതു ഞാൻ കണ്ടിരിക്കുന്നു; ആ ആത്മാവ് അവന്റെമേൽ നിലനിന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പ്രാവായി.” ഗ്രീക്ക് പദപ്രയോഗം ഇങ്ങനെ വിവർത്തനം ചെയ്യാനും കഴിയും; എങ്കിലും സാദൃശ്യം സൂചിപ്പിക്കുന്ന “പ്രാവിനെപ്പോലെ” എന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സ്വർഗത്തുനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: സാക്ഷ്യപ്പെടുത്തി
  rationale: μαρτυρέω എന്ന ക്രിയയിലെ സാക്ഷി/സാക്ഷ്യം എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγων ὅτι
  choice: ഇങ്ങനെ
  rationale: സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം കൂടാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τεθέαμαι
  choice: ഞാൻ കണ്ടിരിക്കുന്നു
  rationale: θεάομαι എന്ന ക്രിയയുടെ perfect രൂപത്തിലുള്ള നേരിട്ടുകണ്ട സാക്ഷ്യവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: καταβαῖνον
  choice: ഇറങ്ങിവരുന്നതു
  rationale: താഴോട്ടുള്ള ചലനം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും മലയാളത്തിലെ ഉദ്ധരണിക്കുള്ളിൽ സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ὡς περιστερὰν
  choice: ഒരു പ്രാവിനെപ്പോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; ആത്മാവ് അക്ഷരാർഥത്തിൽ ഒരു പ്രാവായിരുന്നുവെന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥാനത്തുനിന്നുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഇവിടെ οὐρανός എന്നതിന്റെ സന്ദർഭോചിത അർഥം ‘സ്വർഗം’ ആണ്.
- source_word: ἔμεινεν
  choice: നിലനിന്നു
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ പ്രാധാന്യമുള്ള μένω എന്ന ക്രിയയുടെ തുടർച്ച/സ്ഥിരത എന്ന ആശയം ‘തങ്ങി’ എന്നതിനെക്കാൾ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെമേൽ
  rationale: ആ വ്യക്തിയുടെമേൽ ആത്മാവ് നിലനിന്നുവെന്ന ἐπίയുടെ ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: τὸ πνεῦμα ആരെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: പൊതുവായ അർഥത്തിലുള്ള ‘ഒരു ആത്മാവ്’
  rationale: യോഹന്നാൻ 1:32–33-ലെ ദൈവിക അടയാളവും പരിശുദ്ധാത്മാവിൽ സ്നാനം നൽകുന്നവനെക്കുറിച്ചുള്ള പരാമർശവും നിർദ്ദിഷ്ടമായ ദൈവാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും മൂലവാക്യത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ὡς περιστερὰν എന്നതിന്റെ സ്വഭാവം
  choice: ‘ഒരു പ്രാവിനെപ്പോലെ’ എന്ന ഉപമ
  alternative: ‘ഒരു പ്രാവായി’
  rationale: ὡς ഏറ്റവും സ്വാഭാവികമായി സാദൃശ്യം സൂചിപ്പിക്കുന്നു; പ്രകടനത്തിന്റെ സ്വഭാവത്തെ വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- issue: ἔμεινεν എന്ന ക്രിയയുടെ കർത്താവിനെ മലയാളത്തിൽ പുനരാവർത്തിക്കൽ
  choice: ‘ആ ആത്മാവ്’ എന്ന് പുനരാവർത്തിച്ചു
  alternative: ‘അത്’ അല്ലെങ്കിൽ കർത്താവില്ലാത്ത ‘നിലനിന്നു’
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ വ്യാകരണരൂപത്തെ വ്യക്തിത്വനിഷേധമായി തെറ്റിദ്ധരിക്കാതിരിക്കാനും മലയാളത്തിൽ ആരാണ് നിലനിന്നതെന്ന് വ്യക്തമാക്കാനും നാമം പുനരാവർത്തിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സാക്ഷ്യപ്പെടുത്തി’, ‘കണ്ടിരിക്കുന്നു’, ‘നിലനിന്നു’ എന്നിവ മൂലപാഠത്തിലെ സാക്ഷ്യഭാവവും perfect ക്രിയയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും യോഹന്നാനിലെ μένω എന്ന ക്രിയയുടെ പ്രമേയപരമായ ഭാരംയും സംരക്ഷിക്കുന്നു.
