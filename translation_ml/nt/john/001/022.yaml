id: JHN.1.22
reference: John 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അദ്ദേഹത്തോടു പറഞ്ഞു: “ഞങ്ങളെ അയച്ചവർക്ക് മറുപടി നൽകാനായി, താങ്കൾ ആരാണ്? താങ്കളെക്കുറിച്ച് എന്തു പറയുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻ സംഭാഷണത്തിൽനിന്നുള്ള നിഗമനപരവും തുടർച്ചാസൂചകവുമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἶπαν ... αὐτῷ
  choice: അവർ അദ്ദേഹത്തോടു ചോദിച്ചു
  rationale: λέγω അടിസ്ഥാനത്തിൽ ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യം പരിഗണിച്ച് ‘ചോദിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: Τίς εἶ;
  choice: താങ്കൾ ആരാണ്?
  rationale: വ്യക്തിയുടെ തിരിച്ചറിയൽ നേരിട്ട് ചോദിക്കുന്ന ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും മാന്യമായ അഭിസംബോധനയും നിലനിർത്തുന്നു.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: മറുപടി നൽകേണ്ടതുണ്ട്
  rationale: അയച്ചവർക്കു മറുപടി കൊണ്ടുപോകുക എന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘നൽകേണ്ടതിന്’ എന്നതിനേക്കാൾ സുതാര്യമാണ്.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: ഞങ്ങളെ അയച്ചവർക്കു
  rationale: സുബ്സ്റ്റാന്റീവായ ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിളിനെ ചുരുക്കവും കൃത്യവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τί λέγεις περὶ σεαυτοῦ
  choice: താങ്കളെക്കുറിച്ച് താങ്കൾതന്നെ എന്തു പറയുന്നു?
  rationale: περί + ജനിറ്റീവിന്റെ ‘കുറിച്ച്’ എന്ന അർഥവും σεαυτοῦ എന്ന പ്രതിഫലന സർവനാമത്തിന്റെ സ്വയംസാക്ഷ്യ ഊന്നലും വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ചോദ്യം ചെയ്യുന്നവർ യോഹന്നാനോടു സംസാരിക്കുന്നതിനാൽ ‘താങ്കൾ’ ഉപയോഗിച്ചു; അതിയായ ഔപചാരികത ഒഴിവാക്കി.
