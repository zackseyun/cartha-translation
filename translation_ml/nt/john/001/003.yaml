revisions:
- from: സകലവും അവനിലൂടെ അസ്തിത്വത്തിൽ വന്നു; അവനെക്കൂടാതെ അസ്തിത്വത്തിൽ വന്ന യാതൊന്നും അസ്തിത്വത്തിൽ വന്നില്ല.[a]
  to: സകലവും അവനിലൂടെ ഉളവായി; അവനെക്കൂടാതെ ഉളവായതൊന്നും ഉളവായില്ല.[a]
  rationale: The revision retains the source-text attachment of ὃ γέγονεν to verse 3, the totalizing scope of the verse, and its emphatic repetition, while using idiomatic modern Malayalam. The footnote continues to preserve the disputed ancient punctuation/division without treating either reading as doctrinally decisive.
