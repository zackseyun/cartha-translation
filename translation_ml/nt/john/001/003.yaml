id: JHN.1.3
reference: John 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: ml
  text: സകലവും അവനിലൂടെ ഉളവായി; അവനെക്കൂടാതെ ഉളവായതൊന്നും ഉളവായില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, നാലാം വാക്യം ഇവിടെ തുടങ്ങാം: “ഉളവായത് അവനിൽ ജീവനായിരുന്നു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രമായ വ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ പ്രകടമാക്കുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മാധ്യമത്തെയോ പ്രവർത്തകത്വത്തെയോ നിലനിർത്തുന്നു; 'അവനാൽ' എന്നതിനെക്കാൾ ഗ്രീക്കിലെ വ്യത്യാസം വ്യക്തമായി കാക്കുന്നു.
- source_word: ἐγένετο
  choice: അസ്തിത്വത്തിൽ വന്നു
  rationale: വെറും നിർമാണമല്ല, നിലവിൽ വരിക എന്ന γίνομαιയുടെ അർഥം പ്രകടമാക്കുന്നു.
- source_word: χωρὶς αὐτοῦ
  choice: അവനെക്കൂടാതെ
  rationale: χωρίς സൂചിപ്പിക്കുന്ന വേർപാടും സ്വതന്ത്രമായ ഉത്ഭവത്തിന്റെ നിഷേധവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐδὲ ἕν
  choice: യാതൊന്നും ... ഇല്ല
  rationale: ഒരൊറ്റ വസ്തുവുപോലും ഒഴിവല്ലെന്ന സമ്പൂർണവും ഊന്നലോടുകൂടിയതുമായ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὃ γέγονεν
  choice: അസ്തിത്വത്തിൽ വന്ന
  rationale: നൽകിയിരിക്കുന്ന വിരാമചിഹ്നക്രമമനുസരിച്ച് ഈ ഉപവാക്യം മൂന്നാം വാക്യത്തോടു ചേർക്കുന്നു; γέγονεν എന്ന perfect രൂപത്തിന്റെ പൂർത്തിയായതും നിലനിൽക്കുന്ന ഫലമുള്ളതുമായ ആശയം സന്ദർഭത്തിൽ കാക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യമായ ὃ γέγονεν ഏതിനോടു ചേർക്കണം
  choice: 'മൂന്നാം വാക്യത്തോടു ചേർത്ത്: ''അസ്തിത്വത്തിൽ വന്ന യാതൊന്നും അസ്തിത്വത്തിൽ വന്നില്ല.'''
  alternative: 'നാലാം വാക്യത്തിന്റെ തുടക്കമായി: ''അസ്തിത്വത്തിൽ വന്നത് അവനിൽ ജീവൻ ആയിരുന്നു.'''
  rationale: ആദ്യകാല ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ഇന്നത്തെ വിരാമചിഹ്നക്രമം ഉണ്ടായിരുന്നില്ല; അതിനാൽ രണ്ടു ബന്ധനങ്ങളും വ്യാകരണപരമായി സാധ്യമാണ്. പ്രധാന പാഠം നൽകിയിരിക്കുന്ന SBLGNT വിരാമക്രമം പിന്തുടരുന്നു; യഥാർഥമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാന്റെ പ്രസ്താവനയിലെ സാർവത്രിക വ്യാപ്തിയും ആവർത്തനവും കഴിയുന്നത്ര നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവാക്കുകൾ ഒഴിവാക്കി.
