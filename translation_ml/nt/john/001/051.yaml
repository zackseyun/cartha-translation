id: JHN.1.51
reference: John 1:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: നിങ്ങൾ[a] സ്വർഗം തുറന്നിരിക്കുന്നതും ദൈവത്തിന്റെ ദൂതന്മാർ മനുഷ്യപുത്രന്റെമേൽ കയറുകയും ഇറങ്ങുകയും ചെയ്യുന്നതും കാണും.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളോടു’ എന്നും ‘നിങ്ങൾ കാണും’ എന്നും ഗ്രീക്കിൽ ബഹുവചനമാണ്; അവൻ നഥനയേലിനോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോഴും പ്രസ്താവനയുടെ അഭിസംബോധന വിശാലമാകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ദൃശ്യം ഉല്പത്തി 28:12-ലെ യാക്കോബിന്റെ സ്വപ്നത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു; ഇവിടെ ദൂതന്മാരുടെ കയറ്റവും ഇറക്കവും മനുഷ്യപുത്രനെ കേന്ദ്രീകരിച്ചാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: ആവർത്തിച്ചുള്ള ഗൗരവപൂർണമായ ഉറപ്പിക്കൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ആമേൻ’ എന്ന ശബ്ദലിപ്യന്തരണം മുഖ്യവാചകത്തിൽ വിശദീകരണമില്ലാതെ വിടുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ὑμῖν / ὄψεσθε
  choice: നിങ്ങളോടു / നിങ്ങൾ കാണും
  rationale: രണ്ടു രൂപങ്ങളും ഗ്രീക്കിൽ ബഹുവചനമാണ്. മലയാളം അത് സ്വാഭാവികമായും വ്യക്തമായും മുഖ്യവാചകത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: സ്വർഗം തുറന്നിരിക്കുന്നതും
  rationale: പൂർണകാല കൃദന്തരൂപം സ്വർഗം തുറക്കപ്പെട്ട നിലയിൽ തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തുറന്നിരിക്കുന്ന’ ആ അവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ദൂതന്മാർ
  rationale: ദൈവത്തോടും ദർശനാത്മക പശ്ചാത്തലത്തോടും ചേർന്നതിനാൽ ഇവിടെ അതിമാനുഷിക ദൂതന്മാരാണ് ഉദ്ദേശ്യം.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: കയറുകയും ഇറങ്ങുകയും ചെയ്യുന്നതും
  rationale: ദിശാസൂചകമായ ഇരട്ടപ്രയോഗവും ഉല്പത്തി 28:12-ലെ പ്രതിധ്വനിയും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രന്റെമേൽ
  rationale: ἐπί എന്ന ബന്ധപദത്തിന്റെ സ്ഥലപരമായ രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: യേശുവിന്റെ ഈ സ്വയംവിശേഷണത്തിന്റെ തിരുവെഴുത്തുപരവും അന്ത്യകാലപരവുമായ പ്രതിധ്വനി നിലനിർത്തുന്ന സ്ഥാപിത മലയാളരൂപം.
theological_decisions:
- issue: ആഖ്യാനത്തിൽ ഒരാളോടാണ് (αὐτῷ) സംസാരിക്കുന്നത്; എന്നാൽ നേരിട്ടുള്ള വാക്കിലെ അഭിസംബോധന ബഹുവചനമാണ് (ὑμῖν, ὄψεσθε).
  choice: മുഖ്യവാചകത്തിൽ ‘നിങ്ങളോടു’, ‘നിങ്ങൾ’ എന്നീ ബഹുവചനരൂപങ്ങൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പിൽ ഈ മാറ്റം ചൂണ്ടിക്കാട്ടി.
  alternative: ഒരേയൊരു നഥനയേലിനെ മാത്രം സൂചിപ്പിക്കുന്ന ഏകവചനരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം പ്രസ്താവനയുടെ പരിധി നഥനയേലിനപ്പുറം വ്യാപിപ്പിക്കുന്നു; മലയാളത്തിൽ സംഖ്യ വ്യക്തമായി രേഖപ്പെടുത്താനാകുന്നതിനാൽ അത് മുഖ്യവാചകത്തിൽ തന്നെ സംരക്ഷിക്കണം.
- issue: ദൂതന്മാർ മനുഷ്യപുത്രന്റെമേൽ കയറുകയും ഇറങ്ങുകയും ചെയ്യുന്ന ദൃശ്യം ഉല്പത്തി 28:12-ലെ യാക്കോബിന്റെ സ്വപ്നത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു.
  choice: രൂപകം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി; ബന്ധം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: മനുഷ്യപുത്രൻ സ്വർഗവും ഭൂമിയും ബന്ധിപ്പിക്കുന്നവനാണെന്ന് മുഖ്യവാചകത്തിൽ പരാവർത്തനം ചെയ്യുക.
  rationale: അത്തരം വിശദീകരണം സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ അർഥം തുറന്നുപറയുമെങ്കിലും മൂലവാചകത്തിലെ ദൃശ്യരൂപത്തെയും വ്യാഖ്യാനാത്മക തുറന്ന നിലയെയും ചുരുക്കും.
- issue: ἐπί എന്ന പദം ദൂതന്മാരുടെ ചലനവും മനുഷ്യപുത്രനും തമ്മിലുള്ള ബന്ധം എങ്ങനെ സൂചിപ്പിക്കുന്നു എന്നത്.
  choice: ‘മനുഷ്യപുത്രന്റെമേൽ’ എന്നു നൽകി സ്ഥലപരമായ അസ്പഷ്ടതയും ശക്തമായ രൂപകവും സംരക്ഷിച്ചു.
  alternative: ‘മനുഷ്യപുത്രന്റെ അടുക്കലേക്കും അവിടെനിന്നും’ അല്ലെങ്കിൽ ‘മനുഷ്യപുത്രനെ ചുറ്റി’ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: മാറ്റുവിവർത്തനങ്ങൾ ദൃശ്യത്തെ എളുപ്പമാക്കുമെങ്കിലും ഗ്രീക്കിലെ ‘മേൽ/മീതെ’ എന്ന നേരിട്ടുള്ള ബന്ധത്തെ വ്യാഖ്യാനിച്ച് പരിഹരിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സത്യമായി, സത്യമായി’ എന്നത് സൂത്രവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിത തിരുവെഴുത്തുപദവും ‘മനുഷ്യപുത്രന്റെമേൽ’ എന്ന ഉദ്ദേശപൂർവം കട്ടിയുള്ള രൂപകവും മൂലത്തിലെ അന്തർപാഠപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
