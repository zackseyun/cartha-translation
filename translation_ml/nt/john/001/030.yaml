source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: ml
  text: ഇദ്ദേഹമാണ് ഞാൻ, ‘എന്റെ പിന്നാലെ ഒരു മനുഷ്യൻ വരുന്നു; അദ്ദേഹം എന്നെക്കാൾ മുന്നിലായിരിക്കുന്നു, കാരണം അദ്ദേഹം എനിക്കു മുമ്പേ ഉണ്ടായിരുന്നു’ എന്നു പറഞ്ഞത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: അദ്ദേഹം തന്നെയാണ് ഇവൻ
  rationale: ചൂണ്ടിക്കാണിച്ചുകൊണ്ടുള്ള ഊന്നിയ തിരിച്ചറിയൽ മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി നിലനിർത്തുന്നു.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: ഞാൻ ആരെക്കുറിച്ച് ... എന്നു പറഞ്ഞുവോ
  rationale: εἶπον-നോടൊപ്പമുള്ള ὑπὲρ οὗ എന്ന പ്രയോഗത്തിന്റെ ‘ആരെക്കുറിച്ച്’ എന്ന ബന്ധാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: Ὀπίσω μου ἔρχεται
  choice: എന്റെ പിന്നാലെ ... വരുന്നു
  rationale: ὀπίσωയുടെ കാലക്രമപരമായ അർഥം നിലനിർത്തുകയും ഗ്രീക്കിലെ താരതമ്യഘടന പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνὴρ
  choice: ഒരു മനുഷ്യൻ
  rationale: പുരുഷനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം ലിംഗനിരപേക്ഷമാക്കാതെ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: എനിക്കു മുമ്പനായിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ നിലയും മുൻഗണന/ഉന്നതസ്ഥാനം എന്ന സാധ്യതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് നൽകുന്ന കാരണം മലയാളത്തിൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: πρῶτός μου ἦν
  choice: അദ്ദേഹം എനിക്കു മുമ്പേ ഉണ്ടായിരുന്നു
  rationale: കാലപരമായ മുൻനിലയും സന്ദർഭത്തിലെ പൂർവാസ്തിത്വസൂചനയും നൽകുന്നു; അതേസമയം ‘നിലനിന്നിരുന്നു’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യം ക്രിസ്തുവിന്റെ പൂർവാസ്തിത്വവുമായി എത്ര വ്യക്തമായി ബന്ധിപ്പിക്കണം
  choice: അദ്ദേഹം എനിക്കു മുമ്പേ ഉണ്ടായിരുന്നു
  alternative: അദ്ദേഹം എന്നെക്കാൾ മുമ്പേ നിലനിന്നിരുന്നു
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ പൂർവാസ്തിത്വം ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്നു. എങ്കിലും ഗ്രീക്കിലെ സംക്ഷിപ്തതയും കാലപരമായ മുൻനില/ശ്രേഷ്ഠത തമ്മിലുള്ള അർഥപിരിമുറുക്കവും പൂർണമായി വ്യാഖ്യാനിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
- issue: ἔμπροσθέν μου γέγονεν എന്നതിലെ മുൻഗണനയോ സ്ഥാനമഹിമയോ
  choice: എനിക്കു മുമ്പനായിരിക്കുന്നു
  alternative: എന്നെക്കാൾ ശ്രേഷ്ഠനായിരിക്കുന്നു
  rationale: മൂലപദം മുൻനിലയെയും ഉയർന്ന സ്ഥാനത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഒരു അർഥം മാത്രം നിർബന്ധിക്കാതെ ഈ തുറന്ന സ്വഭാവം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സാക്ഷ്യഭാഷയാണ് ഉപയോഗിച്ചത്. ‘അവൻ’ എന്നതിനു പകരം ‘അദ്ദേഹം’ ഉപയോഗിച്ച് ഗൗരവം കാത്തു; മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ കാലപരമായ മുൻനിലയും സ്ഥാനപരമായ മുൻഗണനയും തമ്മിലുള്ള അർഥസാധ്യതകൾ കഴിയുന്നത്ര സംരക്ഷിച്ചു.
