  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: ml
  text: ഞാനും കണ്ടിട്ടുണ്ട്; ഇവൻ ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവനാണെന്ന് സാക്ഷ്യവും നൽകിയിട്ടുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ എന്നതിനുപകരം ‘ദൈവപുത്രൻ’ എന്നു വായിക്കുന്നു.
