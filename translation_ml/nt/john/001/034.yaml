lexical_decisions:
- source_word: κἀγώ
  choice: ഞാൻ
  rationale: καί + ἐγώ എന്ന സംയുക്തരൂപം മുൻസന്ദർഭത്തോടുള്ള തുടർച്ചയും കർത്താവിന് ഊന്നലും നൽകുന്നു. മലയാളത്തിൽ പദക്രമവും സന്ദർഭവും ആ ഊന്നൽ സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ വേറൊരു ‘കൂടി’ ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: ἑώρακα
  choice: കണ്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം യോഹന്നാന്റെ കണ്ട അനുഭവം പൂർത്തിയായതും അതിന്റെ പ്രസക്തി നിലനിൽക്കുന്നതുമാണെന്ന് സൂചിപ്പിക്കുന്നു; ‘കണ്ടിരിക്കുന്നു’ അത് മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μεμαρτύρηκα
  choice: സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ സാക്ഷ്യപ്രവൃത്തിയുടെ തുടർന്നുനിൽക്കുന്ന സാധുത വ്യക്തമാക്കാൻ പൂർണ്ണകാലസദൃശമായ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: ὅτι
  choice: എന്നു
  rationale: ഇവിടെ ὅτι കാരണം അല്ല, സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്; മലയാളത്തിലെ ഉദ്ധരണിപൂരകമായ ‘എന്നു’ സ്വാഭാവികമാണ്.
- source_word: οὗτός
  choice: ഇവൻ
  rationale: യേശുവിനെ നേരിട്ട് ചൂണ്ടിക്കാണിക്കുന്ന demonstrative-ന്റെ സമീപതയും വ്യക്തിസൂചനയും ‘ഇവൻ’ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἐκλεκτός
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വിശേഷണം നാമപദമായി പ്രവർത്തിക്കുന്നു. ‘തിരഞ്ഞെടുക്കപ്പെട്ടവൻ’ ആ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; വ്യാഖ്യാനാത്മകമായ അധിക പദവി ചേർക്കുന്നില്ല.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ഉടമസ്ഥ/ബന്ധസൂചക രൂപത്തിൽ നൽകി; ‘ദൈവത്തിൽനിന്നുള്ള’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
theological_decisions:
- issue: യോഹന്നാൻ 1:34-ലെ ക്രിസ്തുസംബന്ധിയായ പദവിയും പാഠഭേദവും
  choice: ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  alternative: ദൈവപുത്രൻ
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ὁ ἐκλεκτὸς τοῦ θεοῦ നേരിട്ട് പരിഭാഷപ്പെടുത്തി. പരിചിതമായ മറ്റൊരു പാഠഭേദത്തിലേക്ക് മുഖ്യപാഠത്തെ ഒത്തുചേർക്കാതെ, പ്രധാനപ്പെട്ട ‘ദൈവപുത്രൻ’ എന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് പൂർണ്ണകാലരൂപങ്ങളുടെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തി ‘കണ്ടിരിക്കുന്നു’, ‘സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്നു’ എന്നിവയിലൂടെ സൂക്ഷിച്ചു. പാഠഭേദസൂചകം മുഖ്യപാഠത്തിൽ [a] ആയി ഉൾപ്പെടുത്തി.
