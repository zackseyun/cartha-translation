id: JHN.1.23
reference: John 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു[a]: “മരുഭൂമിയിൽ വിളിച്ചുപറയുന്ന ഒരുവന്റെ ശബ്ദമാണ് ഞാൻ: ‘കർത്താവിന്റെ വഴി നേരെയാക്കുക,’ എന്ന് യെശയ്യാ പ്രവാചകൻ പറഞ്ഞതുപോലെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘മരുഭൂമിയിൽ’ എന്നത് ‘വിളിച്ചുപറയുന്ന’ എന്നതിനുപകരം ‘ശബ്ദം’ എന്നതോടും ബന്ധിപ്പിക്കാവുന്നതാണ്. എന്നാൽ പ്രധാനപാഠത്തിലെ ബന്ധമാണ് ഇവിടെ കൂടുതൽ സ്വാഭാവികം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: അവൻ പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിന് യോജിക്കുന്ന സ്വാഭാവികമായ ആഖ്യാനപ്രയോഗം; ഗ്രീക്കിലെ സാധാരണ വാക്യാരംഭത്തെ അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: Ἐγὼ
  choice: ഞാൻ
  rationale: പ്രകടമായ സർവനാമം യോഹന്നാന്റെ സ്വയം തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമം ആവശ്യമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: φωνὴ
  choice: ശബ്ദം
  rationale: രൂപകത്തെ നേരിട്ട് നിലനിർത്തുന്നു. മലയാളത്തിൽ അനിശ്ചിത ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ ‘ഒരു’ ചേർക്കാതെതന്നെ ഗ്രീക്കിലെ അനിർദിഷ്ടത സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: βοῶντος
  choice: വിളിച്ചുപറയുന്ന ഒരുവന്റെ
  rationale: ജനിറ്റീവ് പാർട്ടിസിപ്പിളിന്റെ ‘വിളിച്ചുപറയുന്ന ഒരുവന്റെ ശബ്ദം’ എന്ന ബന്ധം വ്യക്തമായി നൽകുകയും പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ഭൗമിക അർത്ഥവും യെശയ്യാ ഉദ്ധരണിയുടെ പ്രവാചകപ്രതിധ്വനിയും ഒരുപോലെ സൂക്ഷിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: Εὐθύνατε
  choice: നേരെയാക്കുക
  rationale: നേരിട്ടുള്ള ആജ്ഞാരൂപം; വഴിയെ നേരെയാക്കുന്ന യെശയ്യാവിലെ ദൃശ്യബിംബം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν ὁδὸν
  choice: വഴി
  rationale: അക്ഷരാർഥത്തിലുള്ള പാതയുടെയും രൂപകാർഥത്തിലുള്ള ഒരുക്കത്തിന്റെയും സാധ്യത സംരക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന്റെ ദൈവികവും ഉടമ്പടിസംബന്ധവുമായ ഭാരം യെശയ്യാ ഉദ്ധരണിയിൽ നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: പറഞ്ഞതുപോലെ
  rationale: യോഹന്നാന്റെ സ്വയംവിവരണവും പ്രവാചകവചനവും തമ്മിലുള്ള പൊരുത്തം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: യെശയ്യാ പ്രവാചകൻ
  rationale: ഗ്രീക്ക് പദക്രമത്തോടടുത്തതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും തിരിച്ചറിയാവുന്നതുമായ രൂപം.
theological_decisions:
- issue: യെശയ്യാ ഉദ്ധരണിയിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഇത് യെശയ്യാവിൽ നിന്നുള്ള ദൈവിക ഉദ്ധരണിയായതിനാൽ ‘കർത്താവ്’ ഉടമ്പടിസംബന്ധവും ദൈവശാസ്ത്രപരവുമായ ഭാരം സംരക്ഷിക്കുന്നു; ‘യജമാനൻ’ ഇവിടെ അർത്ഥത്തെ ദുർബലമാക്കും.
- issue: ‘മരുഭൂമിയിൽ’ എന്നത് ഏതിനോടു ചേരുന്നു
  choice: മരുഭൂമിയിൽ വിളിച്ചുപറയുന്ന ഒരുവൻ
  alternative: മരുഭൂമിയിലുള്ള ശബ്ദം
  rationale: ഗ്രീക്ക് വാക്യത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ വായനയിൽ സ്ഥലം സൂചിപ്പിക്കുന്ന പ്രയോഗം ‘വിളിച്ചുപറയുന്ന’ എന്ന ക്രിയാഭാവത്തോടാണ് ചേരുന്നത്. എങ്കിലും മറ്റൊരു വ്യാകരണബന്ധം സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. പ്രവാചക ഉദ്ധരണിയുടെ ഗൗരവം നിലനിർത്തുമ്പോഴും ‘നേരെയാക്കുക’ പോലുള്ള ഇപ്പോഴത്തെ സ്വാഭാവിക രൂപങ്ങൾ തിരഞ്ഞെടുത്തു; അത്യന്തം പുരാതനമായ ആജ്ഞാരൂപങ്ങൾ ഒഴിവാക്കി.
