id: JHN.1.39
reference: John 1:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “വരൂ, നിങ്ങൾ കാണും.” അങ്ങനെ അവർ ചെന്നു, അവൻ എവിടെയാണ് താമസിക്കുന്നതെന്നു കണ്ടു; ആ ദിവസം അവർ അവനോടൊപ്പം താമസിച്ചു. ഏകദേശം പത്താം മണിക്കൂറായിരുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സൂര്യോദയം മുതൽ കണക്കാക്കിയാൽ വൈകുന്നേരം ഏകദേശം 4 മണി; റോമൻ സമയഗണനയനുസരിച്ചാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു—അങ്ങനെയെങ്കിൽ രാവിലെ ഏകദേശം 10 മണി.
    reason: ‘പത്താം മണിക്കൂർ’ എന്നതിനു സാധ്യമായ രണ്ടു സമയഗണനാരീതികൾ വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: വരൂ
  rationale: ബഹുവചനത്തിലുള്ള ക്ഷണം നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത അധിക സൂചനകളൊന്നും ചേർക്കുന്നില്ല.
- source_word: ὄψεσθε
  choice: നിങ്ങൾ കാണും
  rationale: ഭാവികാലരൂപവും ‘വരൂ, നിങ്ങൾ കാണും’ എന്ന ക്ഷണത്തിന്റെ തുറന്ന സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἦλθαν οὖν
  choice: അങ്ങനെ അവർ ചെന്നു
  rationale: οὖν സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ഫലം ‘അങ്ങനെ’ എന്നു നൽകുന്നു; യേശുവിന്റെ ക്ഷണത്തോടുള്ള അവരുടെ പ്രതികരണമായി ‘ചെന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εἶδαν
  choice: കണ്ടു
  rationale: ὄψεσθε എന്ന മുൻക്രിയയുമായുള്ള പദപ്രതിധ്വനി കഴിയുന്നത്ര നിലനിർത്തുന്ന ലളിതമായ ആഖ്യാനരൂപം.
- source_word: ποῦ μένει
  choice: അവൻ എവിടെയാണ് താമസിക്കുന്നത്
  rationale: ഈ സന്ദർഭത്തിൽ μένω യേശു പാർത്തിരുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ‘താമസിക്കുന്നു’ സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: παρ’ αὐτῷ ἔμειναν
  choice: അവർ അവനോടൊപ്പം താമസിച്ചു
  rationale: παράയുടെ സഹവാസസൂചനയും μένωയുടെ ‘താമസിക്കുക’ എന്ന അർത്ഥവും നിലനിർത്തുന്നു; മുമ്പുള്ള μένειയുമായുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ആ ദിവസം
  rationale: മൂലപാഠം പറയുന്നതു മാത്രം നൽകുന്നു; ‘ആ ദിവസത്തിന്റെ ശേഷിച്ച സമയം’ അല്ലെങ്കിൽ ‘ദിവസം മുഴുവൻ’ എന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: അപ്പോൾ ഏകദേശം പത്താം മണിക്കൂറായിരുന്നു
  rationale: ὡς എന്നതിന്റെ ഏകദേശതയും δεκάτη എന്ന ക്രമസംഖ്യയും നിലനിർത്തുന്നു; ഏതു സമയഗണനാരീതിയാണെന്ന് മുഖ്യപാഠത്തിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: λέγει αὐτοῖς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലമായി നൽകുന്നു.
theological_decisions:
- issue: ‘പത്താം മണിക്കൂർ’ കണക്കാക്കുന്ന രീതി
  choice: മുഖ്യപാഠത്തിൽ ‘പത്താം മണിക്കൂർ’ എന്ന മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: സൂര്യോദയം മുതൽ കണക്കാക്കി വൈകുന്നേരം ഏകദേശം നാലുമണി എന്നു നൽകുക; അല്ലെങ്കിൽ റോമൻ സമയഗണനയായി രാവിലെ ഏകദേശം പത്തുമണി എന്നു നൽകുക.
  rationale: പാഠം ഏതു സമയഗണനാരീതിയാണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ തർക്കവിധേയമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കാതെ പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘താമസിക്കുന്നു/താമസിച്ചു’ എന്ന ആവർത്തനം μένω എന്ന ഗ്രീക്ക് ക്രിയയുടെ പദബന്ധം നിലനിർത്താൻ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു. സമയത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട ‘പത്താം മണിക്കൂർ’ എന്ന പ്രയോഗത്തിനു ശേഷമാണ് അടയാളപ്പെടുത്തിയിരിക്കുന്നത്.
