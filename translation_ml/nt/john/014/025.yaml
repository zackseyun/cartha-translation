source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: ml
  text: നിങ്ങളോടുകൂടെ കഴിയുമ്പോൾ ഞാൻ ഈ കാര്യങ്ങൾ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളോടുകൂടെ തുടരുമ്പോൾ” അഥവാ “ഞാൻ നിങ്ങളോടുകൂടെ ആയിരിക്കുമ്പോൾ.” ഗ്രീക്കിൽ യോഹന്നാന്റെ രചനകളിൽ ആവർത്തിച്ചുവരുന്ന “നിലനിൽക്കുക/വസിക്കുക” എന്ന ക്രിയയുടെ കൃദ്യന്തരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ സർവനാമം മുമ്പു പറഞ്ഞ ഉപദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; ബഹുവചനഭാവം നിലനിർത്തുന്നു.
- source_word: λελάληκα
  choice: ഞാൻ … പറഞ്ഞിരിക്കുന്നു
  rationale: λαλέω എന്ന ക്രിയയുടെ പൂർണ്ണകാലരൂപമാണ്; മുമ്പ് പറഞ്ഞ വാക്കുകളുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവികമായ മലയാളപ്രയോഗവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: ശിഷ്യന്മാരെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചന ദത്തിവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: παρ’ ὑμῖν
  choice: നിങ്ങളോടുകൂടെ
  rationale: παρά ദത്തിവിഭക്തിയോടുകൂടെ ഇവിടെ സാമീപ്യവും സാന്നിധ്യവും സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളോടുകൂടെ’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: μένων
  choice: കഴിയുമ്പോൾ
  rationale: നിലനിൽക്കുക, വസിക്കുക, തുടരുക എന്നീ അർഥങ്ങളുള്ള μένω എന്ന വർത്തമാനകാല കൃദ്യന്തരൂപത്തെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; യേശു ശിഷ്യന്മാരോടുകൂടെ തുടരുന്ന കാലത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ രചനകളിൽ ആവർത്തിക്കുന്ന μένω എന്ന പദത്തിന്റെ ആശയബന്ധം
  choice: നിങ്ങളോടുകൂടെ കഴിയുമ്പോൾ
  alternative: നിങ്ങളോടുകൂടെ തുടരുമ്പോൾ / ഞാൻ നിങ്ങളോടുകൂടെ ആയിരിക്കുമ്പോൾ
  rationale: ‘കഴിയുമ്പോൾ’ എന്നത് ഈ സന്ദർഭത്തിലെ ശാരീരിക സാന്നിധ്യം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘തുടരുമ്പോൾ’ പദബന്ധം കൂടുതൽ നേരിട്ട് കാണിച്ചാലും ഇവിടെ അല്പം അസ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് ഗ്രീക്കിലെ ആവർത്തകപദത്തിന്റെ ബന്ധം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞിരിക്കുന്നു’ പൂർണ്ണകാലത്തിന്റെ തുടർപ്രസക്തി നിലനിർത്തുന്നു; ‘കഴിയുമ്പോൾ’ സംസാരഭാഷാപരമാകാതെ സ്വാഭാവികമായ സാന്നിധ്യാർഥം നൽകുന്നു.
