id: JHN.14.28
reference: John 14:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: ml
  text: 'ഞാൻ നിങ്ങളോടു പറഞ്ഞത് നിങ്ങൾ കേട്ടല്ലോ: ‘ഞാൻ പോകുന്നു; ഞാൻ നിങ്ങളുടെ അടുക്കലേക്കു വരുന്നു.’ നിങ്ങൾ എന്നെ സ്നേഹിച്ചിരുന്നെങ്കിൽ, ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിൽ നിങ്ങൾ സന്തോഷിച്ചേനേ[a]; കാരണം പിതാവ് എന്നെക്കാൾ വലിയവനാണ്[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിൽ നിങ്ങൾ സന്തോഷിക്കുമായിരുന്നു.” ഗ്രീക്ക് രൂപം കൂടുതൽ പൊതുവായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ സന്ദർഭത്തിലെ യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയ്ക്ക് “സന്തോഷിച്ചേനേ” കൂടുതൽ യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “പിതാവ് എന്നെക്കാൾ വലിയവനാണ്” എന്നത് എഴുതിയിരിക്കുന്നതുപോലെ പരിഭാഷപ്പെടുത്തിയതാണ്; “പദവിയിൽ” എന്നതുപോലുള്ള വ്യാഖ്യാനപരമായ പരിമിതി ഇതിൽ ചേർത്തിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: നിങ്ങൾ കേട്ടല്ലോ
  rationale: ആവർത്തിച്ചു ഓർമിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ, പൂർത്തിയായ കേൾവിയെ സൂചിപ്പിക്കുന്ന aorist-നെയും സ്വാഭാവിക മലയാള വ്യവഹാരത്തെയും ഇത് ചേർത്ത് പ്രകടിപ്പിക്കുന്നു.
- source_word: Ὑπάγω
  choice: ഞാൻ പോകുന്നു
  rationale: ശിഷ്യരിൽനിന്നുള്ള ആസന്നമായ വേർപാടിനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലരൂപത്തിന്റെ ഭാവിനിർദ്ദേശം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളുടെ അടുക്കലേക്കു വരുന്നു
  rationale: ഭാവിനിർദ്ദേശമുള്ള ഗ്രീക്ക് വർത്തമാനകാലത്തിന്റെ സജീവത നിലനിർത്തുകയും വരവിന്റെ ലക്ഷ്യം വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰ ἠγαπᾶτέ με
  choice: നിങ്ങൾ എന്നെ സ്നേഹിച്ചിരുന്നെങ്കിൽ
  rationale: യാഥാർഥ്യത്തിനു വിരുദ്ധമായ നിബന്ധനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സ്നേഹത്തെ വെറും കഴിഞ്ഞകാല സംഭവമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἐχάρητε ἄν
  choice: നിങ്ങൾ സന്തോഷിച്ചേനേ
  rationale: aorist indicative-ഉം ἄν-ഉം ചേർന്ന യാഥാർഥ്യവിരുദ്ധ ഫലവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതിൽ
  rationale: യാത്രയെയോ നീക്കത്തെയോ സൂചിപ്പിക്കുന്ന πορεύομαι എന്ന പദവും ബന്ധപരമായ ലക്ഷ്യസ്ഥാനവും നിലനിർത്തുന്നു.
- source_word: πατέρα / πατὴρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ശീർഷകസ്വഭാവം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘എന്റെ’ എന്ന ഉടമസ്ഥപദം ചേർക്കുന്നില്ല.
- source_word: μείζων μού
  choice: എന്നെക്കാൾ വലിയവനാണ്
  rationale: താരതമ്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; പദവിയിലോ ചുമതലയിലോ എന്ന വ്യാഖ്യാനപരമായ പരിമിതി കൂട്ടിച്ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പിതാവ് എന്നെക്കാൾ വലിയവനാണ്’ എന്ന വാക്കിന്റെ ത്രിത്വശാസ്ത്രപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ അർഥം
  choice: താരതമ്യത്തെ വ്യാഖ്യാനപരമായ വിശേഷണം കൂടാതെ നേരിട്ട് നിലനിർത്തി.
  alternative: ‘പദവിയിൽ പിതാവ് എന്നെക്കാൾ വലിയവനാണ്’ അല്ലെങ്കിൽ ‘മനുഷ്യാവതാരാവസ്ഥയിൽ പിതാവ് എന്നെക്കാൾ വലിയവനാണ്’
  rationale: ഗ്രീക്ക് വാക്യം താരതമ്യം തുറന്ന നിലയിൽ പ്രസ്താവിക്കുന്നു. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമായ പരിഹാരം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ യഥാർഥ പാഠസമ്മർദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അടുക്കലേക്കു’ എന്ന രൂപം ബന്ധപരമായ ദിശ വ്യക്തമാക്കുന്നു; അതേസമയം അനാവശ്യമായി പുരാതനമായ ക്രിയാരൂപങ്ങളും സഭാവിഭാഗസവിശേഷ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
