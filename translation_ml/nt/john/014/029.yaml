id: JHN.14.29
reference: John 14:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: ml
  text: ഇപ്പോൾ, അതു സംഭവിക്കുന്നതിനുമുമ്പ്, ഞാൻ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു; അതു സംഭവിക്കുമ്പോൾ നിങ്ങൾ വിശ്വസിക്കാനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: ഇപ്പോൾ
  rationale: νῦν എന്നതിന്റെ കാലസൂചന സ്വാഭാവികമായി നൽകുന്നു; καί ഇവിടെ മുൻവാക്യത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἴρηκα ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞിരിക്കുന്നു
  rationale: λέγωയുടെ perfect രൂപം മുൻപ് പറഞ്ഞതിന്റെ ഇപ്പോഴുള്ള പ്രസക്തി നിലനിർത്തുന്നു; ദത്തിവ് ὑμῖν മലയാളത്തിൽ ‘നിങ്ങളോടു’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: πρὶν γενέσθαι
  choice: അതു സംഭവിക്കുന്നതിനുമുമ്പേ
  rationale: πρίν + aorist infinitive ഭാവിയിലെ സൂചിത സംഭവത്തിനു മുമ്പുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അവ്യക്തമായ കർത്താവിനെ ‘അതു’ എന്നു പൂരിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: -േണ്ടതിനാണ്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ ലക്ഷ്യം വ്യക്തമാക്കുന്ന ഘടനയിലൂടെ നൽകുന്നു.
- source_word: ὅταν γένηται
  choice: അതു സംഭവിക്കുമ്പോൾ
  rationale: ὅταν + subjunctive ഭാവിയിൽ പ്രതീക്ഷിക്കുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; രണ്ട് γίνομαι രൂപങ്ങൾക്കും ‘സംഭവിക്കുക’ ഉപയോഗിച്ച് മൂലത്തിലെ ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: πιστεύσητε
  choice: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്
  rationale: യോഹന്നാനിലെ πιστεύωയ്ക്ക് ‘വിശ്വസിക്കുക’ സ്വാഭാവികവും സ്ഥിരവുമായ പരിഭാഷയാണ്; സന്ദർഭം വിശ്വാസത്തിന്റെ ആരംഭമോ തുടർച്ചയോ എന്ന് നിർബന്ധമായി നിർണ്ണയിക്കാത്തതിനാൽ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: πιστεύσητε ഇവിടെ വിശ്വാസത്തിന്റെ ആരംഭമോ ശക്തിപ്പെടലോ സൂചിപ്പിക്കുന്നുവോ
  choice: നിങ്ങൾ വിശ്വസിക്കേണ്ടതിന്
  alternative: നിങ്ങൾ വിശ്വാസത്തിൽ ഉറച്ചുനിൽക്കേണ്ടതിന് / നിങ്ങൾ ആശ്രയിക്കേണ്ടതിന്
  rationale: ഗ്രീക്ക് ക്രിയ ഇവിടെ ആദ്യമായി വിശ്വസിക്കുന്നതും നിലവിലുള്ള വിശ്വാസം ശക്തിപ്പെടുന്നതും തമ്മിൽ വ്യക്തമായി വേർതിരിക്കുന്നില്ല. അതിനാൽ വിശാലമായ ‘വിശ്വസിക്കുക’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ γίνομαι എന്ന ക്രിയയുടെ ആവർത്തനം ‘സംഭവിക്കുക’ എന്ന ഒരേ പദംകൊണ്ട് സംരക്ഷിച്ചിരിക്കുന്നു; perfect രൂപത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി ‘പറഞ്ഞിരിക്കുന്നു’ വഴി പ്രകടമാക്കുന്നു.
