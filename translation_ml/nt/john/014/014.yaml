  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ നാമത്തിൽ എന്നോട്[a] എന്തെങ്കിലും അപേക്ഷിച്ചാൽ, ഞാൻ അതു ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ ‘എന്നോട്’ എന്ന പദമില്ല; അവയിൽ വായന: ‘നിങ്ങൾ എന്റെ നാമത്തിൽ എന്തെങ്കിലും അപേക്ഷിച്ചാൽ, ഞാൻ അതു ചെയ്യും.’'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: -ച്ചാൽ
  rationale: സോപാധികമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ക്രിയയോടു ചേർന്ന ‘-ച്ചാൽ’ എന്ന രൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: സോപാധിക വാക്യത്തിലെ അനിശ്ചിതവും തുറന്നതുമായ വ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αἰτήσητέ
  choice: അപേക്ഷിച്ചാൽ
  rationale: ἐάν-നോടു ചേർന്ന എയോറിസ്റ്റ് സബ്ജങ്ക്ടീവിന്റെ സോപാധിക അർഥം നൽകുകയും, വെറും വിവരാന്വേഷണമല്ലാത്ത അഭ്യർഥനയുടെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: με
  choice: എന്നോട്
  rationale: SBLGNT പാഠത്തിലുള്ള നേരിട്ടുള്ള കർമസർവനാമം വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു; മലയാളത്തിൽ ‘അപേക്ഷിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ‘എന്നോട്’ സ്വാഭാവികമാണ്.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തോടും അധികാരത്തോടും വ്യക്തിത്വത്തോടുമുള്ള ബന്ധം സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ പ്രയോഗം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമാക്കിയ കർത്തൃസർവനാമം നേരിട്ട് നൽകുന്നു; അനാവശ്യമായ അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ποιήσω
  choice: ഞാൻ അതു ചെയ്യും
  rationale: ഭാവികാല വാഗ്ദാനം വ്യക്തമായി നൽകുന്നു; ‘അതു’ മുമ്പ് പറഞ്ഞ അപേക്ഷയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: με (‘എന്നെ/എന്നോട്’) എന്ന പദത്തിന്റെ സാന്നിധ്യവും അപേക്ഷ നേരിട്ട് യേശുവിനോടാണെന്ന സൂചനയും
  choice: പ്രധാനപാഠത്തിൽ ‘എന്നോട്’ ഉൾപ്പെടുത്തി
  alternative: ‘നിങ്ങൾ എന്റെ നാമത്തിൽ എന്തെങ്കിലും അപേക്ഷിച്ചാൽ, ഞാൻ അതു ചെയ്യും.’
  rationale: നൽകിയിരിക്കുന്ന SBLGNT ഗ്രീക്ക് പാഠത്തിൽ με ഉണ്ട്. അതിനാൽ അതിനെ ഒഴിവാക്കാതെ പ്രധാനപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി; പദം ഇല്ലാത്ത കൈയെഴുത്തുപ്രതി വായന അടിക്കുറിപ്പിൽ സുതാര്യമായി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ചോദിച്ചാൽ’ എന്നത് ഒരു ചോദ്യം ചോദിക്കുന്നതായും ധരിക്കാവുന്നതിനാൽ, അഭ്യർഥനയുടെ ഭാവം കൂടുതൽ വ്യക്തമായി നൽകുന്ന ‘അപേക്ഷിച്ചാൽ’ തിരഞ്ഞെടുത്തു.
