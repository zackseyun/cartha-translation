id: JHN.14.10
reference: John 14:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: ml
  text: ഞാൻ പിതാവിലും പിതാവ് എന്നിലും ആണെന്നു നീ വിശ്വസിക്കുന്നില്ലേ? ഞാൻ നിങ്ങളോടു പറയുന്ന വാക്കുകൾ ഞാൻ സ്വന്തമായി പറയുന്നതല്ല[a]; എന്നിൽ വസിക്കുന്ന[b] പിതാവാണ് തന്റെ പ്രവൃത്തികൾ ചെയ്യുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നിൽനിന്നുതന്നെ.’ ഈ പ്രയോഗം സ്വന്തം മുൻകൈയിലോ അധികാരത്തിലോ സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്നിൽ നിലനിൽക്കുന്ന.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദം തുടർന്നുള്ള വാസത്തെയോ നിലനിൽപ്പിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: വിശ്വസിക്കുന്നില്ലേ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ആവർത്തിക്കുന്ന πιστεύω എന്ന ക്രിയയുമായുള്ള ബന്ധം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: പിതാവിലും ... എന്നിലും
  rationale: പരസ്പര അന്തർവാസത്തെ സൂചിപ്പിക്കുന്ന ἐν എന്ന പദം വ്യാഖ്യാനിച്ച് ‘ഒന്നാണ്’ എന്നു മാറ്റാതെ അതിന്റെ ബന്ധപരമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: τὰ ῥήματα
  choice: വാക്കുകൾ
  rationale: സന്ദർഭത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അർത്ഥം നൽകുന്നു; ‘അരുളപ്പാടുകൾ’ പോലുള്ള കൂടുതൽ ശൈലീബദ്ധമായ പദം ഒഴിവാക്കുന്നു.
- source_word: λέγω ... λαλῶ
  choice: പറയുന്ന ... പറയുന്നതല്ല
  rationale: ഗ്രീക്കിലെ പദവ്യത്യാസം മലയാളത്തിൽ നിർബന്ധിച്ച് അസ്വാഭാവികമാക്കാതെ, ആശയത്തിന്റെ വ്യക്തതയ്ക്കായി ഒരേ സ്വാഭാവിക ക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: സ്വന്തമായി
  rationale: സ്വന്തം ഉറവിടത്തിൽനിന്നോ മുൻകൈയിലോ അധികാരത്തിലോ സംസാരിക്കുക എന്ന വിശാലമായ സൂചന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: μένων
  choice: വസിക്കുന്ന
  rationale: തുടർന്നുള്ള സാന്നിധ്യവും അന്തർവാസവും സൂചിപ്പിക്കുന്ന μένω എന്ന പദത്തിന്റെ യോഹന്നാനീയ ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: തന്റെ പ്രവൃത്തികൾ ചെയ്യുന്നു
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസൂചന പ്രതിനിധീകരിക്കുകയും ‘പ്രവൃത്തികൾ’ എന്ന യോഹന്നാനീയ പദാവലി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പിതാവിന്റെയും പുത്രന്റെയും പരസ്പര അന്തർവാസം
  choice: ‘ഞാൻ പിതാവിലും പിതാവ് എന്നിലും’ എന്ന ബന്ധപരമായ ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘ഞാനും പിതാവും ഒന്നാണ്’ അല്ലെങ്കിൽ ‘പിതാവുമായി ഐക്യത്തിലാണ്’ എന്ന വ്യാഖ്യാനപരമായ രൂപങ്ങൾ.
  rationale: ഈ വാക്യത്തിന്റെ കൃത്യമായ ഭാഷയെ മറ്റൊരു യോഹന്നാനീയ പ്രസ്താവനയുമായി ലയിപ്പിക്കാതെയും പിൽക്കാല സിദ്ധാന്തപദങ്ങൾ ചേർക്കാതെയും ഗ്രീക്കിലെ യഥാർഥ ദൈവശാസ്ത്രസാന്ദ്രത സംരക്ഷിക്കുന്നു.
- issue: യേശുവിന്റെ വാക്കുകളിലും പ്രവൃത്തികളിലും പിതാവിന്റെ പ്രവർത്തനം
  choice: യേശു സ്വന്തമായി സംസാരിക്കുന്നില്ലെന്നും അവനിൽ വസിക്കുന്ന പിതാവ് തന്റെ പ്രവൃത്തികൾ ചെയ്യുന്നുവെന്നും വ്യക്തിവ്യത്യാസം നിലനിർത്തുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സ്വന്തം അധികാരത്തിൽ സംസാരിക്കുന്നില്ല’ എന്നും ‘പിതാവ് എന്നിലൂടെ പ്രവർത്തിക്കുന്നു’ എന്നും കൂടുതൽ വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: പിതാവും പുത്രനും തമ്മിലുള്ള ഐക്യവും ദൗത്യത്തിലെ പുത്രന്റെ പിതാവിനോടുള്ള ബന്ധവും ഒരേസമയം നിലനിർത്തുന്നു; വാക്യം പറയുന്നതിലധികം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീ’ എന്ന ഏകവചന അഭിസംബോധനയും ‘നിങ്ങളോടു’ എന്ന ബഹുവചനവും ഗ്രീക്കിലെ സംഖ്യാവ്യത്യാസം അനുസരിച്ച് നിലനിർത്തി. ദൈവശാസ്ത്രപരമായി സാന്ദ്രമായ ‘പിതാവിലും ... എന്നിലും’ എന്ന ഘടന ലളിതീകരിക്കാതെ സൂക്ഷിച്ചു.
