id: JHN.14.9
reference: John 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “ഇത്രയും കാലം[a] ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിട്ടും, ഫിലിപ്പോസേ, നീ ഇനിയും എന്നെ അറിഞ്ഞിട്ടില്ലേ? എന്നെ കണ്ടവൻ പിതാവിനെ കണ്ടിരിക്കുന്നു. ‘പിതാവിനെ ഞങ്ങൾക്കു കാണിച്ചുതരൂ’ എന്നു നീ എങ്ങനെ പറയുന്നു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത്ര ദീർഘകാലം.”
    reason: Τοσούτῳ χρόνῳ എന്ന പ്രയോഗത്തിന്റെ സാധുവായ മറ്റൊരു മലയാളാവിഷ്കാരം.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: ഇത്രയും കാലം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ദാതിവ് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വാചാടോപശക്തി നിലനിർത്തുന്നതുമായ മലയാളരൂപം.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ടായിട്ടും
  rationale: വർത്തമാനകാലംവരെ തുടർന്ന സാന്നിധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; തുടർന്നുവരുന്ന ശാസനാഭാവവും ബന്ധിപ്പിക്കുന്നു.
- source_word: οὐκ ἔγνωκάς με
  choice: നീ ഇനിയും എന്നെ അറിഞ്ഞിട്ടില്ലേ
  rationale: ഗ്രീക്കിലെ പൂർണകാലം സൂചിപ്പിക്കുന്ന നിലവിലെ അവസ്ഥയും സന്ദർഭത്തിലെ ശാസനാഭാവവും ‘ഇനിയും’ എന്ന പദത്തോടുകൂടെ നിലനിർത്തുന്നു.
- source_word: Φίλιππε
  choice: ഫിലിപ്പോസേ
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിന്റെ സംബോധനാവിഭക്തി.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: എന്നെ കണ്ടവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പൂർണകാല കൃദന്തരൂപത്തെ ചുരുക്കവും സ്വാഭാവികവുമായ നാമവൽക്കൃത പ്രയോഗമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἑώρακεν τὸν πατέρα
  choice: പിതാവിനെ കണ്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ പൂർണകാലത്തിന്റെ ഫലം നിലനിൽക്കുന്നതായി അറിയിക്കുകയും ‘പിതാവ്’ എന്ന യോഹന്നാനീയ പ്രയോഗം വ്യാഖ്യാനവികാസമില്ലാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πῶς σὺ λέγεις
  choice: എന്നു നീ എങ്ങനെ പറയുന്നു
  rationale: അവിശ്വാസവും ശാസനയും നിറഞ്ഞ വാചാടോപചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: പിതാവിനെ ഞങ്ങൾക്കു കാണിച്ചുതരണമേ
  rationale: ദείκνυμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘കാണിക്കുക’ എന്ന അർഥവും അഭ്യർഥനയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ കാണുന്നതും പിതാവിനെ കാണുന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്നെ കണ്ടവൻ പിതാവിനെ കണ്ടിരിക്കുന്നു’ എന്ന ശക്തമായ പ്രസ്താവന നേരിട്ട് നിലനിർത്തി.
  alternative: ‘പിതാവ് എങ്ങനെയുള്ളവനാണെന്ന് കണ്ടിരിക്കുന്നു’ എന്ന ദുർബലമായ പ്രതിനിധാനപരമായ വ്യാഖ്യാനം, അല്ലെങ്കിൽ പിൽക്കാല വിശ്വാസപ്രമാണഭാഷ ചേർത്ത വിപുലീകരണം.
  rationale: മൂലവാക്യത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തിയും ഉദ്ദേശപൂർവമായ ദൈവശാസ്ത്രസാന്ദ്രതയും കുറയ്ക്കാതെയും അതിനപ്പുറം വിശദീകരണം ചേർക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സംബോധനയും വാചാടോപചോദ്യവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; വിഭാഗീയമോ വ്യാഖ്യാനാത്മകമോ ആയ അധികഭാഷ ഒഴിവാക്കി.
