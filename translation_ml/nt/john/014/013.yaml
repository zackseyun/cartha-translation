id: JHN.14.13
reference: John 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: ml
  text: നിങ്ങൾ എന്റെ നാമത്തിൽ എന്തു ചോദിച്ചാലും, അതു ഞാൻ ചെയ്യും; പിതാവ് പുത്രനിൽ[a] മഹത്വപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുത്രൻ മുഖാന്തരം.” ഗ്രീക്കിൽ “പുത്രനിൽ” എന്നാണ്; പിതാവ് മഹത്വപ്പെടുന്നതിന്റെ സാഹചര്യമെയോ മാർഗത്തെയോ ഇത് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: എന്തു … ചെയ്താലും
  rationale: അനിശ്ചിതത്വവും വിശാലമായ പരിധിയും സൂചിപ്പിക്കുന്ന ഈ ഗ്രീക്ക് ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αἰτήσητε
  choice: നിങ്ങൾ … ചോദിച്ചാലും
  rationale: രണ്ടാംപുരുഷ ബഹുവചനവും അപേക്ഷയുടെയോ പ്രാർഥനയുടെയോ ആശയവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: യേശുവുമായുള്ള ബന്ധം, പ്രതിനിധാനം, അധികാരം എന്നീ സാധ്യതകൾ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ യോഹന്നാനിലെ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τοῦτο
  choice: അതു
  rationale: ഗ്രീക്കിലെ സൂചകസർവനാമം വ്യക്തമായി നിലനിർത്തുകയും മുമ്പുള്ള അപേക്ഷയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ποιήσω
  choice: ഞാൻ ചെയ്യും
  rationale: ποιέω എന്ന ക്രിയയുടെ വിശാലവും നേരിട്ടുള്ളതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: … വേണ്ടതിന്
  rationale: വാക്യത്തിലെ ഉദ്ദേശ്യബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δοξασθῇ
  choice: മഹത്ത്വപ്പെടേണ്ടതിന്
  rationale: ദൈവിക മഹത്ത്വത്തെക്കുറിച്ചുള്ള ബൈബിൾഭാഷ നിലനിർത്തുകയും കർത്തൃപ്രയോഗമല്ലാത്ത ഗ്രീക്ക് രൂപത്തിന്റെ ആശയം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിൽ ‘എന്റെ പിതാവ്’ എന്നല്ല, സവിശേഷ ദൈവിക സംബോധനയായ ‘പിതാവ്’ എന്നാണ്.
- source_word: ἐν τῷ υἱῷ
  choice: പുത്രനിൽ
  rationale: ἐν എന്നതിനെ ‘മുഖാന്തരം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, സ്ഥാനമോ മേഖലയോ മാർഗമോ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എന്റെ നാമത്തിൽ’ ചോദിക്കുക എന്നതിന്റെ അർഥം
  choice: വ്യാഖ്യാനവികാസമില്ലാതെ ‘എന്റെ നാമത്തിൽ’ എന്നു നിലനിർത്തി.
  alternative: ‘എന്റെ അധികാരത്തിൽ,’ ‘എന്നോടുള്ള ഐക്യത്തിൽ,’ അല്ലെങ്കിൽ ‘എന്റെ സ്വഭാവത്തിനും ഇഷ്ടത്തിനും അനുസരിച്ച്.’
  rationale: യോഹന്നാന്റെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗത്തിന് പല പരസ്പരബന്ധിത തലങ്ങളുണ്ട്; ഒറ്റ ഉപദേശപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കാൻ മൂലരൂപം നിലനിർത്തുന്നു.
- issue: ἐν τῷ υἱῷ എന്നതിലെ ἐν-ന്റെ അർഥവ്യാപ്തി
  choice: ‘പുത്രനിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പുത്രൻ മുഖാന്തരം.’
  rationale: ἐν ഇവിടെ മേഖലയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കാം. ഗ്രീക്ക് ഒരു അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ലാത്തതിനാൽ മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമത്തിൽ,’ ‘പിതാവ്,’ ‘പുത്രൻ,’ ‘മഹത്ത്വപ്പെടുക’ എന്നീ സുപരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; വാക്യക്രമം സ്വാഭാവികമാക്കിയെങ്കിലും ഗ്രീക്ക് പാഠത്തിലെ ഊന്നലുകളും ഉദ്ദേശ്യബന്ധവും സംരക്ഷിച്ചിട്ടുണ്ട്.
