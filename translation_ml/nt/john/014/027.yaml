id: JHN.14.27
reference: John 14:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: ml
  text: സമാധാനം ഞാൻ നിങ്ങൾക്കു വിട്ടുതരുന്നു; എന്റെ സമാധാനം ഞാൻ നിങ്ങൾക്കു നൽകുന്നു. ലോകം നൽകുന്നതുപോലെയല്ല ഞാൻ നിങ്ങൾക്കു നൽകുന്നത്. നിങ്ങളുടെ ഹൃദയം കലങ്ങരുത്; ഭയപ്പെടുകയുമരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭയന്ന് ധൈര്യം കൈവിടുകയുമരുത്.’ ഗ്രീക്ക് ക്രിയ ഭയന്നുപോകുക, ഭീരുവാകുക, ധൈര്യം നഷ്ടപ്പെടുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: സംഘർഷമില്ലായ്മയെക്കാൾ വിശാലമായ അർഥസാധ്യത ഈ പദത്തിനുണ്ടെങ്കിലും, യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ തത്തുല്യപദമാണ് ‘സമാധാനം’.
- source_word: ἀφίημι
  choice: വിട്ടുതരുന്നു
  rationale: യേശു തന്റെ സമാധാനം ശിഷ്യന്മാരുടെ പക്കൽ ശേഷിപ്പിക്കുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘വസ്വിയ്യത്തായി നൽകുന്നു’ എന്നതുപോലുള്ള വ്യാഖ്യാനാത്മകമായ testamentary അർഥം മുഖ്യവാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: τὴν ἐμὴν
  choice: എന്റെ സമാധാനം
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള ഉടമസ്ഥപ്രയോഗം നിലനിർത്തുകയും യേശു നൽകുന്ന സമാധാനവും ലോകം നൽകുന്നതും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: δίδωμι
  choice: നൽകുന്നു
  rationale: ആവർത്തിച്ചുവരുന്ന വർത്തമാനകാല ക്രിയയെയും യേശുവിന്റെ നൽകലും ലോകത്തിന്റെ നൽകലും തമ്മിലുള്ള താരതമ്യത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: ലോകം നൽകുന്നതുപോലെയല്ല ഞാൻ നിങ്ങൾക്കു നൽകുന്നത്
  rationale: ഗ്രീക്കിലെ വിരുദ്ധതയും താരതമ്യവും വ്യക്തമായി സൂക്ഷിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമമാണിത്.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിൽ ഈ പദത്തിനുള്ള വിശാലവും ചിലപ്പോൾ ദൈവവിരുദ്ധമായ മനുഷ്യക്രമത്തെ സൂചിപ്പിക്കുന്നതുമായ അനുരണനം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μὴ ταρασσέσθω
  choice: കലങ്ങരുത്
  rationale: മനസ്സിലെ അസ്വസ്ഥതയെയും വ്യാകുലതയെയും സ്വാഭാവികമായി അറിയിക്കുകയും യോഹന്നാൻ 14:1-ലെ പ്രയോഗവുമായി പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὑμῶν ἡ καρδία
  choice: നിങ്ങളുടെ ഹൃദയം
  rationale: ബഹുവചന ഉടമസ്ഥസർവനാമത്തോടുകൂടിയ ഗ്രീക്കിലെ സമൂഹവാചക ഏകവചനമായ ‘ഹൃദയം’ അതേപടി നിലനിർത്തുന്നു.
- source_word: μηδὲ δειλιάτω
  choice: ഭയപ്പെടുകയുമരുത്
  rationale: ഭയന്നുപോകുക, ധൈര്യം നഷ്ടപ്പെടുക എന്നീ അർഥങ്ങളുള്ള ക്രിയയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; അർഥത്തിന്റെ കൂടുതൽ ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശു നൽകുന്ന സമാധാനത്തിന്റെ സ്വഭാവം
  choice: മുഖ്യവാചകത്തിൽ ‘സമാധാനം’ എന്നും ‘എന്റെ സമാധാനം’ എന്നും മാത്രം നൽകുന്നു.
  alternative: ആന്തരിക ശാന്തി, ഉടമ്പടിപരമായോ അന്ത്യകാലപരമായോ ഉള്ള സമ്പൂർണക്ഷേമം, ദൈവവുമായുള്ള അനുരഞ്ജനം എന്നിങ്ങനെ പ്രത്യേകമായി വിശദീകരിക്കുക.
  rationale: ഈ വാക്യം സമാധാനത്തെ ഒരു അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല. അതിനാൽ അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യതയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനം, വിരുദ്ധത, സമൂഹവാചക ഏകവചനം എന്നിവ സാധ്യമായത്ര നിലനിർത്തിയിരിക്കുന്നു; ദൈവശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
