translation:
  language: ml
  text: ഞാൻ പോകുന്നിടത്തേക്കുള്ള വഴി നിങ്ങൾ അറിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “ഞാൻ എവിടേക്കു പോകുന്നു എന്നു നിങ്ങൾ അറിയുന്നു; വഴിയും നിങ്ങൾ അറിയുന്നു.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം ഗ്രീക്കിൽ καὶ സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ‘കൂടാതെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കുന്നത് അനാവശ്യമായ ഊന്നൽ നൽകും; സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിൽ ബന്ധം പരോക്ഷമായി നിലനിൽക്കുന്നു.
- source_word: ὅπου
  choice: പോകുന്നിടത്തേക്ക്
  rationale: സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ‘എവിടെ/ഇടം’ എന്ന അർഥം നിലനിർത്തുന്നു. ὑπάγω എന്ന ചലനക്രിയയോടൊപ്പം ലക്ഷ്യസ്ഥാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘ഇടത്തേക്ക്’ എന്നു പ്രകടമാകുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: പ്രകടമായ ഒന്നാംപുരുഷ സർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὑπάγω
  choice: പോകുന്നു
  rationale: വർത്തമാനരൂപത്തിലുള്ള സഞ്ചാരത്തെ ലളിതമായും സ്വാഭാവികമായും നൽകുന്നു; ‘വിട്ടുപോകുന്നു’ എന്നു പറഞ്ഞ് വിടവാങ്ങൽസന്ദർഭം അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: οἴδατε
  choice: നിങ്ങൾ അറിയുന്നു
  rationale: οἶδα എന്ന പൂർണകാലരൂപത്തിന് ഇവിടെ വർത്തമാന അർഥമാണ്. ബഹുവചന അഭിസംബോധനയും അറിവെന്ന ലളിതമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: τὴν ὁδόν
  choice: വഴി
  rationale: ὁδός എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സന്ദർഭോചിതവുമായ തുല്യപദം. യോഹന്നാൻ 14:6-ലെ തുടർവിവരണം മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ ‘വഴി’ എന്ന സാദ്ധ്യമായ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഞാൻ പോകുന്നിടം’ എന്ന ഉപവാക്യവും ‘വഴി’യും തമ്മിലുള്ള വാക്യഘടനാപരമായ ബന്ധം
  choice: ഞാൻ പോകുന്നിടത്തേക്കുള്ള വഴി നിങ്ങൾ അറിയുന്നു.
  alternative: ഞാൻ എവിടേക്കു പോകുന്നുവോ, ആ വഴി നിങ്ങൾ അറിയുന്നു.
  rationale: ഗ്രീക്ക് വാചകം യേശു പോകുന്ന ലക്ഷ്യസ്ഥാനവുമായി ബന്ധപ്പെട്ട വഴിയാണ് ശിഷ്യന്മാർ അറിയുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘ഇടത്തേക്കുള്ള വഴി’ എന്ന മലയാളരൂപം ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; യേശു പോകുന്ന സ്ഥലം തന്നെയും അവർ അറിയുന്നു എന്ന് വേറിട്ട അവകാശവാദം ചേർക്കുന്നില്ല.
- issue: ദീർഘമായ കൈയെഴുത്തുപ്രതി വായന
  choice: SBLGNT-യിലെ ഹ്രസ്വവായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: ‘ഞാൻ എവിടേക്കു പോകുന്നു എന്നു നിങ്ങൾ അറിയുന്നു; വഴിയും നിങ്ങൾ അറിയുന്നു.’
  rationale: ദീർഘവായന ചില കൈയെഴുത്തുപ്രതികളിൽ കാണപ്പെടുന്നുവെങ്കിലും നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ അത് ഇല്ല. അതിനാൽ അത് മുഖ്യപാഠത്തിലേക്ക് കലർത്താതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വാക്യഘടനയാണ് ഉപയോഗിച്ചത്; ‘വഴി’ എന്ന പദത്തിന്റെ ഭൗതികവും രൂപകാത്മകവുമായ സാദ്ധ്യതകൾ തുറന്നുവെച്ചിരിക്കുന്നു.
