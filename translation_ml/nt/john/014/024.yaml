id: JHN.14.24
reference: John 14:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: ml
  text: എന്നെ സ്നേഹിക്കാത്തവൻ എന്റെ വാക്കുകൾ പാലിക്കുന്നില്ല. നിങ്ങൾ കേൾക്കുന്ന വചനം എന്റേതല്ല; എന്നെ അയച്ച പിതാവിന്റേതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾ കേൾക്കുന്ന സന്ദേശം എന്റേതല്ല; എന്നെ അയച്ച പിതാവിൽനിന്നുള്ളതാണ്.”'
    reason: λόγος എന്നതിനെ ‘സന്ദേശം’ എന്നും ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയെ ഉറവിടസൂചനയായും വിവർത്തനം ചെയ്യാവുന്ന പദാർഥവികൽപം.
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: എന്നെ സ്നേഹിക്കാത്തവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവായ വ്യക്തിസൂചനയും സ്നേഹത്തിന്റെ തുടർച്ചയായ സ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοὺς λόγους μου
  choice: എന്റെ വാക്കുകൾ
  rationale: ബഹുവചനം കാത്തുസൂക്ഷിക്കുകയും യേശുവിന്റെ അരുളപ്പാടുകളെയും ഉപദേശത്തെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τηρεῖ
  choice: പാലിക്കുന്നില്ല
  rationale: യോഹന്നാനിലെ സന്ദർഭത്തിൽ τηρέω അനുസരിക്കുക, മുറുകെപ്പിടിക്കുക, ആചരിക്കുക എന്നീ അർഥവ്യാപ്തിയുള്ളതാണ്; ഇവിടെ 'പാലിക്കുക' അത് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ὁ λόγος
  choice: വചനം
  rationale: ഏകവചനത്തിലുള്ള λόγος യേശുവിലൂടെ കേൾക്കുന്ന ഏകീകൃത ഉപദേശത്തെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു; 'വചനം' യോഹന്നാനിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: ὃν ἀκούετε
  choice: നിങ്ങൾ കേൾക്കുന്ന
  rationale: വർത്തമാനകാലത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത 'എന്നിൽനിന്ന്' എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: എന്റേതല്ല
  rationale: ἐμός എന്ന ഉടമസ്ഥതാസൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു; ഉറവിടത്തെക്കുറിച്ചുള്ള അർഥം തുടർന്നുള്ള വിരുദ്ധഘടന വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: എന്നെ അയച്ച പിതാവിന്റേതാണ്
  rationale: ഗ്രീക്കിലെ സമാന്തരമായ ഉടമസ്ഥത/ഉറവിട സൂചന നിലനിർത്തിക്കൊണ്ട്, 'എന്നെ അയച്ച' എന്ന വിശേഷണം 'പിതാവ്' എന്നതോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ഉപദേശവും പിതാവിന്റെ ഉപദേശവും തമ്മിലുള്ള ബന്ധം
  choice: “വചനം എന്റേതല്ല; എന്നെ അയച്ച പിതാവിന്റേതാണ്” എന്ന പാഠത്തിലെ വ്യക്തിവ്യത്യാസവും സന്ദേശത്തിന്റെ ഏകതയും അതേ സംഘർഷത്തോടെ നിലനിർത്തി.
  alternative: “സന്ദേശം പിതാവിൽനിന്നുള്ളതാണ്” എന്ന് ഉറവിടം മാത്രം വിശദീകരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠം യേശുവിന്റെ വചനത്തെ സ്വതന്ത്ര ഉറവിടത്തിലുള്ള ‘എന്റേത്’ എന്ന നിലയിൽ നിഷേധിച്ച് അയച്ച പിതാവിനോടു ബന്ധിപ്പിക്കുന്നു. അതിനെ യേശു തന്റെ ഉപദേശം തള്ളിപ്പറയുന്നതായോ, മറുവശത്ത് വ്യക്തിവ്യത്യാസം മായ്ക്കുന്നതായോ വ്യാഖ്യാനിക്കാതെ പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്നേഹിക്കുക’, ‘പാലിക്കുക’, ‘വചനം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ യോഹന്നാന്റെ പദപ്രയോഗബന്ധങ്ങൾ സൂക്ഷിക്കുന്നു.
