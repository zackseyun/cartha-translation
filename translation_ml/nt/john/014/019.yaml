id: JHN.14.19
reference: John 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: ml
  text: ഇനി അൽപ്പസമയം മാത്രം; ലോകം എന്നെ ഇനി കാണുകയില്ല, നിങ്ങളോ എന്നെ കാണും.[a] ഞാൻ ജീവിക്കുന്നതിനാൽ നിങ്ങളും ജീവിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാണുക’ എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും ‘ശ്രദ്ധയോടെ നോക്കുക/നിരീക്ഷിക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് ക്രിയയ്ക്ക് വെറുമൊരു ക്ഷണികനോട്ടത്തേക്കാൾ വിപുലമായ അർഥം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളും ജീവിക്കും’ എന്നത് ശിഷ്യർ യേശുവിന്റെ പുനരുത്ഥാനജീവനിൽ പങ്കുചേരുന്നതിനെയോ, അവനോടുള്ള ഐക്യത്തിലെ ആത്മീയജീവനെയോ, രണ്ടിനെയുംകൂടിയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: ഇനി അല്പസമയംകൂടി കഴിഞ്ഞാൽ
  rationale: അവശേഷിക്കുന്ന ഹ്രസ്വകാലത്തെയും അതിനുശേഷം സംഭവിക്കാനിരിക്കുന്ന മാറ്റത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ പ്രയോഗത്തിന്റെ വ്യാപ്തി ചുരുക്കി വ്യാഖ്യാനിക്കാതെ, സ്ഥാപിതവും സ്വാഭാവികവുമായ തത്തുല്യപദം നിലനിർത്തുന്നു.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: കാണുകയില്ല / കാണും
  rationale: θεωρέω ശ്രദ്ധയോടെയുള്ള കാണലിനെയോ നിരീക്ഷണത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഇരു പ്രയോഗങ്ങളിലും സ്വാഭാവികമായി ചേരുന്നതും അർഥവ്യാപ്തി നിലനിർത്തുന്നതും ‘കാണുക’ ആണ്.
- source_word: οὐκέτι
  choice: കാണുകയില്ല
  rationale: ἔτι μικρόν നൽകുന്ന സമീപഭാവി സമയചട്ടക്കൂടിനുള്ളിൽ, ഇനി സംഭവിക്കാത്ത അവസ്ഥയെ മലയാളത്തിലെ ഭാവിനിഷേധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: നിങ്ങളോ
  rationale: ലോകവും ശിഷ്യരും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ ‘-ഓ’ ഘടന സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ὅτι
  choice: -തിനാൽ
  rationale: യേശുവിന്റെ ജീവൻ ശിഷ്യരുടെ ജീവനുള്ള അടിസ്ഥാനമാണെന്ന കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγὼ ζῶ
  choice: ഞാൻ ജീവിക്കുന്നു
  rationale: വർത്തമാനകാലവും യേശുവിന്റെ ജീവിക്കുന്ന യാഥാർഥ്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും വ്യാഖ്യാനാത്മക വികസനമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: നിങ്ങളും ജീവിക്കും
  rationale: καίയിലെ ‘കൂടി/also’ എന്ന ബന്ധം ‘-ഉം’ വഴി നിലനിർത്തുകയും ζήσετεയുടെ ഭാവികാലം വ്യക്തമായി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശിഷ്യർ യേശുവിനെ ‘കാണും’ എന്നതിന്റെ അർഥം
  choice: പുനരുത്ഥാനശേഷമുള്ള ഭൗതിക ദർശനമോ വിശ്വാസത്തിലൂടെയുള്ള ആത്മീയ ഗ്രഹണമോ അന്തിമകാല ദർശനമോ എന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കാതെ ‘കാണും’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘നിരീക്ഷിക്കും’ അല്ലെങ്കിൽ ‘ദർശിക്കും’ എന്നു നൽകി ഒരു പ്രത്യേക തരത്തിലുള്ള കാണലിന് കൂടുതൽ ഊന്നൽ നൽകുക.
  rationale: θεωρέωയ്ക്ക് സമൃദ്ധമായ അർഥവ്യാപ്തിയുണ്ട്; ഈ വാക്യത്തിലെ യോഹന്നാനീയ ദൈവശാസ്ത്രപരമായ പാളികൾ ചുരുക്കാതെ നിലനിർത്തുന്നതാണ് ഉചിതം.
- issue: ‘നിങ്ങളും ജീവിക്കും’ എന്നതിന്റെ അർഥം
  choice: ആത്മീയജീവൻ, പുനരുത്ഥാനജീവൻ, ക്രിസ്തുവിനോടുള്ള ഐക്യത്തിലെ ജീവൻ എന്നിവയിൽ ഒന്നായി ചുരുക്കാതെ വിശാലമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘നിങ്ങൾ പുനരുത്ഥാനജീവൻ പ്രാപിക്കും’ അല്ലെങ്കിൽ ‘ആത്മീയമായി ജീവിക്കും’ എന്നു വ്യക്തമാക്കുക.
  rationale: ζήσετεയുടെ ഭാവികാല പ്രയോഗം ഒന്നിലധികം ദൈവശാസ്ത്രപരമായ അനുരണനങ്ങൾ വഹിക്കാം; ഗ്രീക്ക് പാഠം നിർണ്ണയിക്കാത്തത് വിവർത്തനവും നിർണ്ണയിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളോ’ എന്ന വൈരുധ്യഘടനയും ‘നിങ്ങളും’ എന്ന ഉൾപ്പെടുത്തൽഘടനയും ഗ്രീക്ക് ബന്ധകങ്ങളുടെ പ്രവർത്തനം വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു; ദൈവശാസ്ത്രപരമായ ബഹുവ്യഞ്ജകത മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചിരിക്കുന്നു.
