source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: ml
  text: ഞാൻ പിതാവിലും പിതാവ് എന്നിലും ആണെന്ന് എന്നെ വിശ്വസിക്കൂ; അല്ലെങ്കിൽ, ആ പ്രവൃത്തികൾതന്നെ നിമിത്തം വിശ്വസിക്കൂ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ ‘വിശ്വസിക്കൂ’ എന്നതിന് ഗ്രീക്കിൽ വ്യക്തമായ കർമമില്ല; ആ പ്രവൃത്തികൾതന്നെ വിശ്വാസത്തിനുള്ള മതിയായ അടിസ്ഥാനമാണെന്നാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: എന്നെ വിശ്വസിക്കൂ
  rationale: πιστεύω എന്ന ക്രിയയോടുകൂടിയ μοι എന്ന ദത്തിവിഭക്തി ഇവിടെ ‘എന്നെ വിശ്വസിക്കൂ’ എന്ന വ്യക്തിപരമായ അഭ്യർഥനയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘ഞാൻ പറയുന്നത് വിശ്വസിക്കൂ’ എന്ന വിപുലീകരണം ആശയം വ്യക്തമാക്കുമെങ്കിലും മൂലപാഠത്തിൽ ഇല്ലാത്ത വാക്കുകൾ ചേർക്കും.
- source_word: ὅτι
  choice: ആണെന്ന്
  rationale: വിശ്വസിക്കേണ്ട പ്രസ്താവനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥകമായ ‘കാരണം’ എന്നതിനു പകരം മലയാളത്തിലെ ഉള്ളടക്കസൂചകമായ ‘എന്ന്’ ഉപയോഗിച്ചു.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: പിതാവിലും ... എന്നിലും
  rationale: യോഹന്നാന്റെ പരസ്പര അന്തർവാസത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത ἐν നേരിട്ട് നിലനിർത്തുന്നു; ‘പിതാവിനോട് ഒന്നായിരിക്കുന്നു’ പോലുള്ള വ്യാഖ്യാനപരമായ പുനർവാക്യം ഒഴിവാക്കുന്നു.
- source_word: εἰ δὲ μή
  choice: അല്ലെങ്കിൽ
  rationale: മുൻ അഭ്യർഥന സ്വീകരിക്കപ്പെടാത്ത പക്ഷം വിശ്വാസത്തിനുള്ള മറ്റൊരു അടിസ്ഥാനം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വൈരുധ്യവും വ്യവസ്ഥാഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: ആ പ്രവൃത്തികൾതന്നെ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ആ അർഥം നൽകുന്നു; αὐτάയുടെ ഊന്നൽ ‘തന്നെ’ കൊണ്ട് സംരക്ഷിക്കുന്നു.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കൂ
  rationale: അവസാന ആജ്ഞയ്ക്ക് ഗ്രീക്കിൽ വ്യക്തമായ കർമമില്ല. മലയാളത്തിലും കർമം ചേർക്കാതെ ലഘുവായി നിലനിർത്തി; വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചാഭാവം അമിതമായി വ്യക്തമാക്കുന്ന ‘വിശ്വസിച്ചുകൊണ്ടിരിക്കൂ’ ഒഴിവാക്കി.
theological_decisions:
- issue: പുത്രന്റെയും പിതാവിന്റെയും പരസ്പര അന്തർവാസം
  choice: ‘ഞാൻ പിതാവിലും പിതാവ് എന്നിലും’ എന്ന ബന്ധസൂചകമായ മൂലരൂപം നിലനിർത്തി.
  alternative: ‘ഞാനും പിതാവും ഒന്നാണ്’ അല്ലെങ്കിൽ ‘ഞാൻ പിതാവിനോട് ഒന്നായിരിക്കുന്നു’
  rationale: മൂലപാഠം ശക്തമായ ഐക്യവും പരസ്പര അന്തർവാസവും പ്രസ്താവിക്കുന്നു. അതിന്റെ ദൈവശാസ്ത്രഭാരം കുറയ്ക്കാതെയും മറ്റൊരു യോഹന്നാനീയ വാക്യരൂപം ഇവിടെ പകരാതെയും യഥാർഥ പദപ്രയോഗം സംരക്ഷിച്ചു.
- issue: പ്രവൃത്തികൾ വിശ്വാസത്തിന്റെ അടിസ്ഥാനമാകുന്നത്
  choice: അവസാനത്തെ ‘വിശ്വസിക്കൂ’ എന്നതിന് കർമം ചേർക്കാതെ, പ്രവൃത്തികൾതന്നെ വിശ്വാസത്തിനുള്ള അടിസ്ഥാനമായി അവതരിപ്പിച്ചു.
  alternative: ‘പ്രവൃത്തികൾ നിമിത്തം എന്നെ വിശ്വസിക്കൂ’ അല്ലെങ്കിൽ ‘എന്നിൽ വിശ്വസിക്കൂ’
  rationale: രണ്ടാമത്തെ πιστεύετε-യ്ക്ക് ഗ്രീക്കിൽ വ്യക്തമായ കർമമില്ല. കർമം ചേർക്കുന്നത് സാധ്യമായ അർഥം വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിലെ സംക്ഷിപ്തതയും ചെറിയ അനിശ്ചിതത്വവും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. പഴയ ശൈലിയിലുള്ള ‘വിശ്വസിക്കുവിൻ’ എന്നതിനു പകരം സ്വാഭാവികമായ ‘വിശ്വസിക്കൂ’ സ്വീകരിച്ചു; ‘പിതാവ്’, ‘പ്രവൃത്തികൾ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി.
