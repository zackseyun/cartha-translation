id: JHN.14.1
reference: John 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: ml
  text: നിങ്ങളുടെ ഹൃദയം കലങ്ങാതിരിക്കട്ടെ. ദൈവത്തിൽ വിശ്വസിക്കുവിൻ[a][b]; എന്നിലും വിശ്വസിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ദൈവത്തിൽ വിശ്വസിക്കുന്നു; എന്നിലും വിശ്വസിക്കുവിൻ.” πιστεύετε എന്ന ഗ്രീക്ക് രൂപം “നിങ്ങൾ വിശ്വസിക്കുന്നു” എന്ന സൂചകവൃത്തിയായോ “വിശ്വസിക്കുവിൻ” എന്ന ആജ്ഞാവൃത്തിയായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ദൈവത്തിൽ ആശ്രയിക്കുവിൻ; എന്നിലും ആശ്രയിക്കുവിൻ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് വിശ്വസിക്കുക എന്നതിനൊപ്പം ആശ്രയിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: കലങ്ങിപ്പോകരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല നിഷ്ക്രിയ ആജ്ഞാരൂപം ഒരു നിരോധനമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു. ‘കലങ്ങിപ്പോകരുത്’ എന്നത് മനസ്സിലെ അസ്വസ്ഥത, വ്യാകുലത, സംഭ്രമം എന്നിവ ഉൾക്കൊള്ളുന്ന ταράσσω എന്ന പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ὑμῶν ἡ καρδία
  choice: നിങ്ങളുടെ ഹൃദയം
  rationale: ὑμῶν ബഹുവചനമായിരിക്കുമ്പോഴും ἡ καρδία ഏകവചനമാണ്; ശിഷ്യസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ഈ സമാഹാര ഏകവചനം മലയാളത്തിലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πιστεύετε
  choice: വിശ്വസിക്കുവിൻ
  rationale: πιστεύω വിശ്വസിക്കുക, ആശ്രയിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ളതും ഗൗരവമുള്ളതുമായ ‘വിശ്വസിക്കുവിൻ’ സ്വീകരിച്ചു; വിശ്വാസത്തിന്റെ ആശ്രയഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸν θεόν
  choice: ദൈവത്തിൽ
  rationale: πιστεύωയോടൊപ്പം εἰς ലക്ഷ്യോന്മുഖമായ വിശ്വാസത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവത്തിൽ’ എന്നത് സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: എന്നിലും വിശ്വസിക്കുവിൻ
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം’കൊണ്ട് പ്രകടമാക്കുകയും ഗ്രീക്കിലെ πιστεύετε എന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πιστεύετε എന്ന രണ്ടു രൂപങ്ങളുടെയും സൂചകവൃത്തി–ആജ്ഞാവൃത്തി അവ്യക്തത
  choice: 'രണ്ടും ആജ്ഞകളായി: ‘ദൈവത്തിൽ വിശ്വസിക്കുവിൻ; എന്നിലും വിശ്വസിക്കുവിൻ.’'
  alternative: ‘നിങ്ങൾ ദൈവത്തിൽ വിശ്വസിക്കുന്നു; എന്നിലും വിശ്വസിക്കുവിൻ.’
  rationale: രണ്ടാം പുരുഷ ബഹുവചന വർത്തമാനകാല സൂചകവൃത്തിക്കും ആജ്ഞാവൃത്തിക്കും ഗ്രീക്കിൽ ഒരേ രൂപമാണ്. മുമ്പുള്ള നിരോധനാത്മക ആജ്ഞയോടും ആശ്വാസപ്രസംഗത്തിന്റെ സന്ദർഭത്തോടും രണ്ടു ആജ്ഞകൾ സ്വാഭാവികമായി ചേരുന്നു. എങ്കിലും യഥാർഥമായ വ്യാകരണാവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശ്വസിക്കുവിൻ’ എന്ന ആദരപൂർവ ബഹുവചന ആജ്ഞാരൂപം ശിഷ്യസമൂഹത്തോടുള്ള അഭിസംബോധന വ്യക്തമാക്കുന്നു; ‘ഹൃദയം’ എന്ന ഏകവചനം മൂലപാഠത്തിലെ സമാഹാരപ്രയോഗം നിലനിർത്തുന്നു.
