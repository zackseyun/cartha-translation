id: JHN.14.22
reference: John 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: ml
  text: 'ഇസ്കര്യോത്താവല്ലാത്ത യൂദാസ് അവനോടു പറഞ്ഞു: “കർത്താവേ, അങ്ങ് ലോകത്തിന് അല്ലാതെ ഞങ്ങൾക്കു സ്വയം വെളിപ്പെടുത്താൻ പോകാൻ എന്തു സംഭവിച്ചിട്ടാണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാല ചരിത്രാഖ്യാനരൂപമായ ‘പറയുന്നു’ എന്നാണ് അക്ഷരാർഥമെങ്കിലും, ഇവിടെ ചോദ്യം ഉന്നയിക്കുന്ന സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനത്തിന് ‘ചോദിച്ചു’ യോജിക്കുന്നു.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: ഇസ്കര്യോത്താവല്ലാത്ത യൂദാസ്
  rationale: ഇസ്കര്യോത്താ യൂദാസിൽനിന്ന് ഈ ശിഷ്യനെ വേർതിരിക്കുന്ന മൂലപാഠത്തിലെ വിശദീകരണം വ്യക്തവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ആദരസൂചകവും ദൈവശാസ്ത്രഭാരമുള്ളതുമായ κύριος എന്ന പദത്തിന്റെ പതിവ് മലയാളരൂപം.
- source_word: τί γέγονεν
  choice: എന്താണ് സംഭവിച്ചിരിക്കുന്നത്
  rationale: γίνομαι എന്ന ക്രിയയുടെ പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന, സംഭവിച്ചതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥ നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: സ്വയം വെളിപ്പെടുത്തലിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി ലളിതമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: μέλλεις
  choice: പോകുന്നതിന്
  rationale: തുടർന്നുചെയ്യാനുള്ള ഉദ്ദേശ്യമോ മുന്നോട്ടുള്ള സംഭവമോ സൂചിപ്പിക്കുന്ന μέλλωയുടെ ഭാവാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐμφανίζειν σεαυτόν
  choice: സ്വയം വെളിപ്പെടുത്താൻ
  rationale: കാണിച്ചുതരുക, അറിയിക്കുക, പ്രത്യക്ഷമാക്കുക എന്നീ അർഥസാധ്യതകളുള്ള പദപ്രയോഗത്തിന്റെ പ്രതിഫലകസ്വഭാവവും വിശാലതയും ‘സ്വയം വെളിപ്പെടുത്തുക’ നിലനിർത്തുന്നു.
- source_word: κόσμῳ
  choice: ലോകത്തിനു
  rationale: യോഹന്നാന്റെ രചനയിലെ κόσμος എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ബഹുതലത്വം വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ ‘ലോകം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ രചനയിലെ κόσμος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ലോകം
  alternative: മനുഷ്യരാശി പൊതുവേ / അവിശ്വാസിയായ ലോകവ്യവസ്ഥ
  rationale: ഈ വാക്യം പദത്തിന്റെ എല്ലാ സൂക്ഷ്മാർഥങ്ങളും തീർപ്പാക്കുന്നില്ല. അതിനാൽ യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സന്ദർഭനിർണയത്തിനുള്ള തുറന്ന നിലയും ‘ലോകം’ എന്ന പരിഭാഷ സംരക്ഷിക്കുന്നു.
- issue: ἐμφανίζειν എന്നതിലെ വെളിപ്പെടുത്തലിന്റെ സ്വഭാവം
  choice: സ്വയം വെളിപ്പെടുത്തുക
  alternative: സ്വയം പ്രത്യക്ഷനാകുക / സ്വയം അറിയിക്കുക
  rationale: ഇത് ദൃശ്യപ്രത്യക്ഷതയിലോ അറിവുനൽകലിലോ മാത്രം ഒതുക്കാതെ മൂലപദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘അങ്ങ്’ ആദരസൂചകമായ നേരിട്ടുള്ള അഭിസംബോധനയായി ഉപയോഗിച്ചു; ‘ഞങ്ങൾക്കു’/‘ലോകത്തിനു’ എന്നീ രൂപങ്ങൾ ഔപചാരികതയും വായനാസൗകര്യവും തുലനം ചെയ്യുന്നു.
