  source_fidelity: മൂലഗ്രീക്കിലെ ἐν τῇ οἰκίᾳ τοῦ πατρός μου, μοναὶ πολλαί, εἰ δὲ μή, εἶπον ἂν ὑμῖν ὅτι, πορεύομαι ἑτοιμάσαι τόπον ὑμῖν എന്നിവയുടെ അർത്ഥവും ബന്ധങ്ങളും വിവർത്തനം വിശ്വസ്തമായി നിലനിർത്തുന്നു. ‘അങ്ങനെയല്ലായിരുന്നെങ്കിൽ’ എന്ന സോപാധിക പ്രയോഗവും ‘പറയുമായിരുന്നോ?’ എന്ന അലങ്കാരചോദ്യവും തിരഞ്ഞെടുക്കപ്പെട്ട ഇംഗ്ലീഷ് വായനയോടും ഗ്രീക്ക് പാഠത്തോടും യോജിക്കുന്നു. ὅτι-വാക്യത്തിന്റെ പകരം പ്രസ്താവനാവായന അടിക്കുറിപ്പിൽ ഉചിതമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
  naturalness: മുഖ്യപാഠം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും ഒഴുക്കുള്ളതുമാണ്. ‘എന്റെ പിതാവിന്റെ ഭവനത്തിൽ,’ ‘അനേകം വാസസ്ഥലങ്ങളുണ്ട്,’ ‘നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കാൻ ഞാൻ പോകുന്നു’ എന്നിവ മാന്യമായ തിരുവെഴുത്തുശൈലിയിൽ സ്വാഭാവികമാണ്. ‘ഭവനം’ അല്പം ഔപചാരികമായിരുന്നാലും ഇവിടെ യോജിച്ചതും വ്യക്തവുമാണ്.
  terminology: ‘പിതാവിന്റെ ഭവനം,’ ‘വാസസ്ഥലങ്ങൾ,’ ‘സ്ഥലം,’ ‘ഒരുക്കാൻ’ എന്നീ തെരഞ്ഞെടുപ്പുകൾ മൂലപാഠത്തിന്റെ പ്രതിച്ഛായയും വ്യാപ്തിയും സൂക്ഷിക്കുന്നു. μονήയെ ‘മുറികൾ’ അല്ലെങ്കിൽ ‘മാളികകൾ’ എന്നു അനാവശ്യമായി ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല. അടിക്കുറിപ്പ് a-യിലെ പദാർഥപരമായ ബദലും യോഹന്നാനിലെ വസിക്കൽ-ആശയബന്ധവും യുക്തമാണ്.
