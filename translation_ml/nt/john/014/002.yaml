id: JHN.14.2
reference: John 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: ml
  text: എന്റെ പിതാവിന്റെ ഭവനത്തിൽ അനേകം വാസസ്ഥലങ്ങളുണ്ട്[a]. അങ്ങനെയല്ലായിരുന്നെങ്കിൽ[b], നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കാൻ ഞാൻ പോകുന്നു എന്നു ഞാൻ നിങ്ങളോടു പറയുമായിരുന്നോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനേകം മുറികളുണ്ട്.’ ഗ്രീക്ക് പദത്തിന് താമസിക്കാനോ വസിക്കാനോ ഉള്ള സ്ഥലങ്ങൾ എന്നർത്ഥം വരാം. ‘വാസസ്ഥലങ്ങൾ’ എന്നത് കൂടുതൽ വിശാലമാണ്; ഈ അധ്യായത്തിലെ ‘വസിക്കുക’ എന്ന ആശയവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം: ‘അങ്ങനെയല്ലായിരുന്നെങ്കിൽ, ഞാൻ നിങ്ങളോടു പറയുമായിരുന്നു; കാരണം നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കാൻ ഞാൻ പോകുന്നു.’ ഗ്രീക്ക് വാക്യത്തെ അലങ്കാരചോദ്യമായോ പ്രസ്താവനയായോ ഗ്രഹിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: ഭവനം
  rationale: ഇവിടെ οἰκία ഒരു വീടിനെയോ വസതിയെയോ സൂചിപ്പിക്കുന്നു. ‘ഭവനം’ മൂലപാഠത്തിലെ മൂർത്തമായ ചിത്രം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: πατρός μου
  choice: എന്റെ പിതാവിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; ഇവിടെ ‘പിതാവ്’ യേശു ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന പ്രയോഗമാണ്.
- source_word: μοναὶ πολλαί
  choice: അനേകം വാസസ്ഥലങ്ങൾ
  rationale: μονή താമസിക്കാനോ വസിക്കാനോ ഉള്ള സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘വാസസ്ഥലങ്ങൾ’ എന്നത് ‘മുറികൾ’ എന്നതിനെക്കാൾ വിശാലമാണ്; യോഹന്നാൻ 14-ലെ വസിക്കൽ എന്ന ആശയബന്ധവും ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: εἰ δὲ μή
  choice: അങ്ങനെയല്ലായിരുന്നെങ്കിൽ
  rationale: മുൻപ്രസ്താവന നിഷേധിക്കപ്പെടുന്ന സോപാധിക പ്രയോഗത്തെ പൂർണ്ണവും സ്വാഭാവികവുമായ മലയാളവാക്യമായി നൽകുന്നു.
- source_word: εἶπον ἂν ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുമായിരുന്നോ
  rationale: ἄν ചേർന്ന ഭൂതകാലക്രിയയുടെ സോപാധിക ഭാവവും തിരഞ്ഞെടുത്ത വാചകഘടനയിലെ അലങ്കാരചോദ്യത്തിന്റെ ശക്തിയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: പറയപ്പെട്ടതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി ὅτιയെ ഗ്രഹിച്ച് മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണിസൂചകമായ ‘എന്നു’ ഉപയോഗിക്കുന്നു; ‘കാരണം’ എന്ന വ്യത്യസ്ത ഗ്രഹണം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πορεύομαι
  choice: ഞാൻ പോകുന്നു
  rationale: സന്നിഹിതവും ഭാവിയിലേക്കു ചൂണ്ടുന്നതുമായ ഗ്രീക്ക് വർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാനരൂപത്തിൽ നൽകുന്നു.
- source_word: ἑτοιμάσαι
  choice: ഒരുക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-നെ വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τόπον
  choice: ഒരു സ്ഥലം
  rationale: τόπος എന്ന വിശാലപദത്തെ ‘മുറി’ എന്നു ചുരുക്കാതെ ‘സ്ഥലം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: ദാതൃവിഭക്തിയുടെ ഗുണഭോക്തൃഭാവം വ്യക്തമാക്കുന്നു; ബഹുവചനം മലയാളത്തിലെ ‘നിങ്ങൾ’ എന്ന രൂപത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: അന്ത്യകാലചിത്രണവുമായി ബന്ധപ്പെട്ട μονήയുടെ പരിഭാഷ
  choice: അനേകം വാസസ്ഥലങ്ങൾ
  alternative: അനേകം മുറികൾ; അനേകം മാളികകൾ
  rationale: ‘മാളികകൾ’ ആധുനിക മലയാളത്തിൽ പദത്തിന്റെ അർത്ഥത്തെ അതിരുകടന്ന് വിപുലീകരിക്കും; ‘മുറികൾ’ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത വാസ്തുവിദ്യാത്മക വിഭജനം സൂചിപ്പിക്കാം. ‘വാസസ്ഥലങ്ങൾ’ ചിത്രം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: രണ്ടാം വാക്യഭാഗത്തിന്റെ വിരാമചിഹ്നവും വാക്യശക്തിയും
  choice: 'അലങ്കാരചോദ്യമായി: ‘അങ്ങനെയല്ലായിരുന്നെങ്കിൽ, ... ഞാൻ നിങ്ങളോടു പറയുമായിരുന്നോ?’'
  alternative: 'പ്രസ്താവനയായി: ‘അങ്ങനെയല്ലായിരുന്നെങ്കിൽ, ഞാൻ നിങ്ങളോടു പറയുമായിരുന്നു; കാരണം നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കാൻ ഞാൻ പോകുന്നു.’'
  rationale: മൂല ഗ്രീക്കിൽ ആദ്യകാല വിരാമചിഹ്നങ്ങൾ ഇല്ലാത്തതിനാൽ ὅτιയും വാക്യവിഭജനവും ഒന്നിലധികം രീതിയിൽ ഗ്രഹിക്കാം. അലങ്കാരചോദ്യവായന സന്ദർഭത്തിൽ നന്നായി ഒഴുകുന്നു; എന്നാൽ പ്രസ്താവനാവായനയും യഥാർത്ഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരമ്പരാഗതമായെങ്കിലും ഇപ്പോഴും വ്യക്തമായ ‘പിതാവിന്റെ ഭവനം’ എന്ന ചിത്രം നിലനിർത്തി; ‘മാളികകൾ’ പോലുള്ള അർത്ഥവിപുലീകരണവും ‘മുറികൾ’ എന്ന അനാവശ്യ ചുരുക്കവും മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
