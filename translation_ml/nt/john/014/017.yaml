id: JHN.14.17
reference: John 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: ml
  text: സത്യത്തിന്റെ ആത്മാവിനെ[a] ലോകത്തിന് സ്വീകരിക്കാൻ കഴിയില്ല; കാരണം ലോകം അവനെ കാണുകയോ അറിയുകയോ ചെയ്യുന്നില്ല. നിങ്ങൾ അവനെ അറിയുന്നു; കാരണം അവൻ നിങ്ങളോടുകൂടെ വസിക്കുന്നു, നിങ്ങളിൽ ഉണ്ടായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സത്യത്തിന്റെ ആത്മാവിനെ; ലോകത്തിന് അതിനെ സ്വീകരിക്കാൻ കഴിയില്ല ... കാരണം ലോകം അതിനെ കാണുകയോ അറിയുകയോ ചെയ്യുന്നില്ല.’ ‘ആത്മാവ്’ (πνεῦμα) എന്ന പദം ഗ്രീക്കിൽ നപുംസകലിംഗമാണ്; എന്നാൽ ഇവിടെ സൂചിപ്പിക്കപ്പെടുന്നത് വ്യക്തിപരമായ പ്രവർത്തകനെയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കും.’ ബഹുവചനമായ ‘നിങ്ങൾ’ എന്നതിനോടൊപ്പം ഗ്രീക്ക് പ്രയോഗത്തിന് സമൂഹപരമായ ഈ അർത്ഥവും സാധ്യമാണ്; എങ്കിലും ‘നിങ്ങളോടുകൂടെ’ എന്ന പ്രയോഗത്തോടുള്ള വ്യത്യാസം ‘നിങ്ങളിൽ’ കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα τῆς ἀληθείας
  choice: സത്യത്തിന്റെ ആത്മാവ്
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും യോഹന്നാന്റെ സവിശേഷ പ്രയോഗവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആത്മാവ്’ ഉപയോഗിച്ചു.
- source_word: ὃ / αὐτό
  choice: അവനെ
  rationale: πνεῦμα വ്യാകരണപരമായി നപുംസകലിംഗമാണെങ്കിലും സന്ദർഭത്തിലെ സൂചിതവ്യക്തി വ്യക്തിപരമായ ദൈവിക പ്രവർത്തകനാണ്; മലയാളത്തിൽ ‘അവനെ’ എന്ന വ്യക്തിസൂചക രൂപം സ്വാഭാവികമാണ്. വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിലെ വിശാലമായ അർത്ഥസാധ്യത നിലനിർത്തുന്നു; ‘മനുഷ്യവർഗം’ എന്നോ ‘ദുഷ്ടലോകവ്യവസ്ഥ’ എന്നോ അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: οὐ δύναται λαβεῖν
  choice: സ്വീകരിക്കാൻ കഴിയില്ല
  rationale: δύναται എന്ന കഴിവില്ലായ്മയും λαβεῖν എന്ന ‘സ്വീകരിക്കുക’ എന്ന അർത്ഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεωρεῖ
  choice: കാണുന്നു
  rationale: ഇന്ദ്രിയഗ്രഹണത്തിന്റെയും തിരിച്ചറിവിന്റെയും സാധ്യത തുറന്നുവെക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: γινώσκει / γινώσκετε
  choice: അറിയുന്നില്ല / അറിയുന്നു
  rationale: ലോകത്തിന്റെ അറിവില്ലായ്മയും ശിഷ്യരുടെ അറിവും തമ്മിലുള്ള ഗ്രീക്ക് പദാവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: παρ’ ὑμῖν μένει
  choice: നിങ്ങളോടുകൂടെ വസിക്കുന്നു
  rationale: παράയുടെ ‘കൂടെ’ എന്ന ബന്ധവും μένωയുടെ തുടർന്നുനിൽക്കുന്ന സാന്നിധ്യവും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ὑμῖν ἔσται
  choice: നിങ്ങളിൽ ഉണ്ടായിരിക്കുകയും ചെയ്യും
  rationale: ἐν എന്നതിന്റെ പ്രാഥമികമായ ‘ഉള്ളിൽ’ എന്ന അർത്ഥവും ഭാവികാലമായ ἔσταιയും നിലനിർത്തുന്നു; ബഹുവചനത്തെ അടിസ്ഥാനമാക്കിയുള്ള ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: വ്യാകരണപരമായി നപുംസകലിംഗമായ πνεῦμαയെ വ്യക്തിപരമായി പരാമർശിക്കൽ
  choice: ആത്മാവിനെ ‘അവൻ/അവനെ’ എന്നു പരാമർശിച്ചു
  alternative: വ്യാകരണരൂപം പിന്തുടർന്ന് ‘അത്/അതിനെ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗം πνεῦμα എന്ന നാമത്തിന്റെ വ്യാകരണലിംഗമാണ്; സമീപസന്ദർഭം ആത്മാവിനെ വ്യക്തിപരമായ പ്രവർത്തകനായി അവതരിപ്പിക്കുന്നു. എന്നാൽ വ്യാകരണപരമായ വ്യത്യസ്ത പരിഭാഷാസാധ്യത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
- issue: παρ’ ὑμῖν എന്നും ἐν ὑμῖν എന്നും ഉള്ള ബന്ധങ്ങളുടെ വ്യത്യാസം
  choice: ‘നിങ്ങളോടുകൂടെ’ എന്നും ‘നിങ്ങളിൽ’ എന്നും വേർതിരിച്ചു
  alternative: രണ്ടും പൊതുവായ സാന്നിധ്യമായി നൽകുക, അല്ലെങ്കിൽ ἐν ὑμῖν എന്നത് ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നു നൽകുക
  rationale: രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് പൂർവപ്രത്യയപ്രയോഗങ്ങൾ സൃഷ്ടിക്കുന്ന ആശയപരമായ വ്യത്യാസവും പുരോഗതിയും പരിഭാഷയിൽ മായ്ച്ചുകളയാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം, എന്നാൽ വചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വസിക്കുന്നു’ യോഹന്നാനിലെ μένω എന്ന പദത്തിന്റെ തുടർച്ചയും സ്ഥിരസാന്നിധ്യവും പ്രകടമാക്കുന്നു. വ്യക്തിപരമായ സർവനാമവും ഉള്ളിലെ/സമൂഹത്തിലെ സാന്നിധ്യവും സംബന്ധിച്ച യഥാർത്ഥ ഭാഷാപരമായ സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
