revisions:
- from: സത്യത്തിന്റെ ആത്മാവ്[a]. ലോകത്തിന് അവനെ സ്വീകരിക്കാൻ കഴിയില്ല; കാരണം ലോകം അവനെ കാണുകയോ അറിയുകയോ ചെയ്യുന്നില്ല. നിങ്ങൾ അവനെ അറിയുന്നു; കാരണം അവൻ നിങ്ങളോടുകൂടെ വസിക്കുന്നു, നിങ്ങളിൽ ഉണ്ടായിരിക്കുകയും ചെയ്യും[b].
  to: സത്യത്തിന്റെ ആത്മാവിനെ[a] ലോകത്തിന് സ്വീകരിക്കാൻ കഴിയില്ല; കാരണം ലോകം അവനെ കാണുകയോ അറിയുകയോ ചെയ്യുന്നില്ല. നിങ്ങൾ അവനെ അറിയുന്നു; കാരണം അവൻ നിങ്ങളോടുകൂടെ വസിക്കുന്നു, നിങ്ങളിൽ ഉണ്ടായിരിക്കും[b].
  rationale: The revision repairs the syntactic error by marking ‘സത്യത്തിന്റെ ആത്മാവിനെ’ as the object of ‘സ്വീകരിക്കാൻ കഴിയില്ല.’ It also substitutes the natural simple future ‘ഉണ്ടായിരിക്കും’ for the cumbersome serial form. Both footnotes are retained with wording adjusted to match the revised text and to state the grammatical alternative precisely.
