id: JHN.14.12
reference: John 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: ml
  text: '“സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: എന്നിൽ വിശ്വസിക്കുന്നവൻ[a] ഞാൻ ചെയ്യുന്ന പ്രവൃത്തികൾ അവനും ചെയ്യും; ഇവയെക്കാൾ വലിയ പ്രവൃത്തികളും അവൻ ചെയ്യും[b]. കാരണം, ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘വിശ്വസിക്കുന്നവൻ … അവൻ’ എന്നത് വ്യാകരണപരമായി പുല്ലിംഗത്തിലുള്ള പ്രതിനിധി ഏകവചനമാണ്; ഏതു വിശ്വാസിയെയും പൊതുവായി ഇത് സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഇവയെക്കാൾ വലിയവയും’; മുൻവാക്യത്തിലെ ‘പ്രവൃത്തികൾ’ എന്ന പദം ഇവിടെ ഗ്രീക്കിൽ അർഥത്തിൽ പൂരിപ്പിക്കപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: യേശുവിന്റെ ഗൗരവപൂർണവും ഊന്നൽ നൽകുന്നതുമായ ഇരട്ട പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ആമേൻ’ എന്നു വിവർത്തനം ചെയ്യാതെ വിടുന്നതിനെക്കാൾ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്നവൻ
  rationale: നാമരൂപത്തിൽ പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തെയും യോഹന്നാനിലെ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ വ്യക്തിപരമായ വിശ്വാസബന്ധത്തെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിൽ യേശുവിന്റെ അടയാളങ്ങളെയും പ്രവർത്തനങ്ങളെയും ഉൾക്കൊള്ളുന്ന ആവർത്തിത പദസഞ്ചയം നിലനിർത്തുന്നു.
- source_word: ἃ ἐγὼ ποιῶ
  choice: ഞാൻ ചെയ്യുന്ന
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും അനാവശ്യമായി തുടർച്ചാഭാവം ശക്തിപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κἀκεῖνος ποιήσει
  choice: അവനും ചെയ്യും
  rationale: κἀκεῖνος എന്നതിലെ ‘ആ വ്യക്തിയും’ എന്ന ഊന്നൽ ‘അവനും’ എന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു; ποιῶ/ποιήσει എന്ന ക്രിയാസാമ്യം ‘ചെയ്യുന്ന/ചെയ്യും’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: ഇവയെക്കാൾ വലിയ പ്രവൃത്തികളും അവൻ ചെയ്യും
  rationale: മുൻവാക്യത്തിലെ ‘പ്രവൃത്തികൾ’ എന്ന നാമം ഗ്രീക്കിൽ ഇവിടെ അർഥപൂർണമായി പൂരിപ്പിക്കപ്പെടുന്നു. മലയാളത്തിൽ വാക്യം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ അത് ആവർത്തിക്കുന്നു; ‘വലിയ’ എന്നതിന്റെ കൃത്യമായ അർഥവ്യാപ്തി വിശദീകരിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ὅτι
  choice: കാരണം
  rationale: യേശു പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതും മുൻപറഞ്ഞ വലിയ പ്രവൃത്തികളും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: ഞാൻ പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നു
  rationale: πρός എന്നതിന്റെ ദിശയും ബന്ധപരമായ ഭാവവും ‘അടുക്കലേക്കു’ നൽകുന്നു; ഗ്രീക്കിലെ ‘പിതാവ്’ എന്ന നിർദേശത്തെ ‘എന്റെ പിതാവ്’ എന്നു വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഇവയെക്കാൾ വലിയ പ്രവൃത്തികൾ’ എന്നതിന്റെ അർഥം
  choice: വിശ്വസിക്കുന്നവൻ യേശുവിന്റെ പ്രവൃത്തികളെക്കാൾ വലിയ പ്രവൃത്തികൾ ഏതോ അർഥത്തിൽ ചെയ്യുമെന്ന് വാക്യം പറയുന്നതുപോലെ വിശാലമായി നിലനിർത്തുന്നു; അതിന്റെ കാരണം യേശു പിതാവിന്റെ അടുക്കലേക്കു പോകുന്നതുമായി ബന്ധിപ്പിക്കുന്നു.
  alternative: അവയുടെ വലിപ്പം ദൗത്യത്തിന്റെ വ്യാപ്തിയെയോ വീണ്ടെടുപ്പുചരിത്രത്തിലെ പ്രാധാന്യത്തെയോ പരിശുദ്ധാത്മാവിലൂടെ സഭ ചെയ്യുന്ന ശുശ്രൂഷയെയോ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: ‘വലിയ’ എന്ന താരതമ്യം ഏതു കൃത്യമായ മാനദണ്ഡത്തിലാണ് എന്നത് വാക്യം വിശദീകരിക്കുന്നില്ല. അതിനാൽ ശക്തി, വ്യാപ്തി, ചരിത്രപ്രാധാന്യം എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് വിവർത്തനത്തിൽ നിർബന്ധമായി ചുമത്തുന്നില്ല.
- issue: ὁ πιστεύων ... κἀκεῖνος എന്ന പ്രതിനിധി ഏകവചനം
  choice: ‘വിശ്വസിക്കുന്നവൻ ... അവൻ’ എന്ന വ്യാകരണപരമായി പുല്ലിംഗമായ പ്രതിനിധി ഏകവചനം നിലനിർത്തുന്നു.
  alternative: ‘വിശ്വസിക്കുന്ന ആരും ... അവർ’ എന്ന ലിംഗനിരപേക്ഷ ബഹുവചനരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ ഏകവചന ഘടനയും തുടർച്ചയും സംരക്ഷിക്കുന്നു; അതേസമയം ഇത് പുരുഷന്മാർക്കു മാത്രമല്ല, ഏതു വിശ്വാസിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾ ഭാഷയുടെ പരിചിതത്വം നിലനിർത്തുമ്പോഴും കാലഹരണപ്പെട്ട പദക്രമവും അത്യധികം സംസ്കൃതഭാരവും ഒഴിവാക്കി. ഇരട്ട ἀμὴν ആവർത്തനത്തിലൂടെ വരുന്ന ഊന്നൽ സംരക്ഷിച്ചു.
