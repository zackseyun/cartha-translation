id: JHN.14.31
reference: John 14:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ പിതാവിനെ സ്നേഹിക്കുന്നുവെന്ന് ലോകം അറിയേണ്ടതിന്, പിതാവ് എന്നോടു കൽപ്പിച്ചതുപോലെതന്നെ[a] ഞാൻ ചെയ്യുന്നു. എഴുന്നേൽക്കൂ; നമുക്ക് ഇവിടെനിന്ന് പോകാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പിതാവ് എന്നോടു കൽപ്പിച്ചതുപോലെ, അങ്ങനെ ഞാൻ ചെയ്യുന്നു.”'
    reason: καθὼς … οὕτως എന്ന അനുരൂപഘടനയെ കൂടുതൽ പ്രത്യക്ഷമായി കാണിക്കുന്ന വാക്യഘടനാപരമായ പര്യായം.
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിപരീതബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα γνῷ
  choice: അറിയേണ്ടതിന്
  rationale: ἵναയും ഉപവിധിക്രിയയും ചേർന്നുള്ള ഉദ്ദേശ്യാർഥം സംക്ഷിപ്തമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: യോഹന്നാന്റെ രചനകളിലെ κόσμος എന്ന പദത്തിന്റെ വിശാലമായ മാനുഷികവും ദൈവശാസ്ത്രപരവുമായ ധ്വനി നിലനിർത്തുന്നു.
- source_word: ἀγαπῶ
  choice: ഞാൻ ... സ്നേഹിക്കുന്നു
  rationale: വർത്തമാനകാലക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ἀγαπάωയുടെ സാധാരണ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: മൂലപാഠത്തിൽ ഉടമസ്ഥസർവനാമം ഇല്ലാത്തതിനാൽ ‘എന്റെ പിതാവിനെ’ എന്ന് കൂട്ടിച്ചേർക്കാതെ ബന്ധപരമായ സ്ഥാനപ്പേര് സംരക്ഷിക്കുന്നു.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ
  choice: പിതാവ് എന്നോടു കല്പിച്ചതുപോലെതന്നെ
  rationale: καθώς സൂചിപ്പിക്കുന്ന കൃത്യമായ അനുരൂപതയും ἐντέλλομαι എന്ന ക്രിയയുടെ ആജ്ഞാസ്വഭാവവും നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ഭൂതകാലരൂപത്തോട് യോജിച്ച് ‘കല്പിച്ചു’ എന്ന അർഥം നൽകുന്നു.
- source_word: οὕτως ποιῶ
  choice: ഞാൻ ചെയ്യുന്നു
  rationale: καθώς ... οὕτως ഘടന മലയാളത്തിൽ ‘...പോലെതന്നെ ഞാൻ ചെയ്യുന്നു’ എന്ന് സ്വാഭാവികമായി പുനഃസൃഷ്ടിക്കുന്നു.
- source_word: Ἐγείρεσθε
  choice: എഴുന്നേൽക്കൂ
  rationale: ബഹുവചന ആജ്ഞയുടെ അർഥം സാധാരണക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: നമുക്ക് ഇവിടെനിന്ന് പോകാം
  rationale: ആദ്യപുരുഷ ബഹുവചന പ്രേരണാർഥ ഉപവിധിയും പുറപ്പെടുന്ന സ്ഥലസൂചനയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ πατήρ എന്ന ബന്ധപരമായ സ്ഥാനപ്പേര്
  choice: പിതാവ്
  alternative: എന്റെ പിതാവ്
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ഉടമസ്ഥസർവനാമമില്ല. അതിനാൽ അതു ചേർക്കാതെ പിതാവും പുത്രനും തമ്മിലുള്ള ബന്ധം മൂലപാഠം പറയുന്ന വിധത്തിൽത്തന്നെ നിലനിർത്തുന്നു.
- issue: പിതാവ് പുത്രനോടു നൽകുന്നതിനെ വിവരിക്കുന്ന ἐντέλλομαι എന്ന ക്രിയയുടെ ശക്തി
  choice: കല്പിച്ചു
  alternative: നിർദേശിച്ചു
  rationale: ക്രിയയുടെ ആജ്ഞയുടെയോ ചുമതലപ്പെടുത്തലിന്റെയോ ശക്തി മയപ്പെടുത്താതെ യേശുവിന്റെ അനുസരണം പ്രകടമാക്കുന്നു.
- issue: ἵνα-വാക്യവും καθώς ... οὕτως ഘടനയും തമ്മിലുള്ള വാക്യഘടനാബന്ധം
  choice: ലോകം അറിയേണ്ടതിന്, പിതാവ് കല്പിച്ചതുപോലെതന്നെ ഞാൻ ചെയ്യുന്നു
  alternative: ഞാൻ പിതാവിനെ സ്നേഹിക്കുന്നുവെന്നും പിതാവ് കല്പിച്ചതുപോലെ ഞാൻ ചെയ്യുന്നുവെന്നും ലോകം അറിയേണ്ടതിനാണിത്
  rationale: പ്രധാനപാഠം οὕτως ποιῶയെ ഉദ്ദേശ്യവാക്യത്തിന്റെ പ്രധാനക്രിയയായി സ്വാഭാവികമായി വായിക്കുന്നു; καίയുടെ വ്യാപ്തി മൂലം സാധ്യമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘എഴുന്നേൽക്കൂ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സന്ദർഭത്തിന് യോജിച്ച ഗൗരവവും നിലനിർത്തുന്നു. ‘കല്പിച്ചു’ എന്നത് മൂലക്രിയയുടെ ശക്തി സംരക്ഷിക്കുന്നു; അനാവശ്യമായ ഉടമസ്ഥപദമോ ദൈവശാസ്ത്രപരമായ വിശദീകരണമോ ചേർത്തിട്ടില്ല.
