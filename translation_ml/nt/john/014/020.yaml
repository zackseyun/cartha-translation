source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: ml
  text: ആ ദിവസം[a], ഞാൻ എന്റെ പിതാവിൽ ആണെന്നും, നിങ്ങൾ എന്നിൽ ആണെന്നും, ഞാൻ നിങ്ങളിൽ ആണെന്നും നിങ്ങൾ അറിയും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ആ ദിവസത്തിൽ.’'
    reason: lexical_alternative
  - marker: b
    text: മൂലപാഠത്തിൽ ‘-ൽ’ എന്ന ആശയം മൂന്നു തവണ ആവർത്തിക്കുന്നു. യോഹന്നാനിലെ പരസ്പര അന്തർവാസത്തിന്റെ പ്രമേയം പ്രതിഫലിപ്പിക്കാൻ അത് ഇവിടെ അതേപടി നിലനിർത്തിയിരിക്കുന്നു. ‘ഐക്യത്തിൽ’ എന്നു വ്യാഖ്യാനിക്കാമെങ്കിലും അത് കൂടുതൽ വിശദീകരണപരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ആ ദിവസം
  rationale: കാലസൂചനയായ ഈ പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം; ἐκείνῃ എന്ന നിർദേശകത്തിന്റെ വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: γνώσεσθε ὑμεῖς
  choice: നിങ്ങൾ അറിയും
  rationale: ഭാവിയിൽ ലഭിക്കുന്ന അറിവോ തിരിച്ചറിവോ വിശാലമായി സൂചിപ്പിക്കുന്നു. വ്യക്തമായി നൽകിയിരിക്കുന്ന ὑμεῖς മലയാളത്തിൽ കർത്താവിനെ പ്രത്യക്ഷമായി ചേർത്തുകൊണ്ട് നിലനിർത്തുന്നു; ‘അറിഞ്ഞുതുടങ്ങും’ എന്നു പറഞ്ഞ് പ്രക്രിയയ്ക്ക് അനാവശ്യ ഊന്നൽ നൽകുന്നില്ല.
- source_word: ὅτι
  choice: എന്ന്
  rationale: ശിഷ്യർ അറിയാൻ പോകുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി സ്വാഭാവിക മലയാള പരോക്ഷവാക്യരൂപം ഉപയോഗിക്കുന്നു; കാരണാർഥം നൽകുന്നില്ല.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: ഞാൻ എന്റെ പിതാവിലും
  rationale: ἐν എന്നതിന്റെ സ്ഥലസംബന്ധിയായ രൂപകം ‘-ൽ’ വഴി നേരിട്ട് നിലനിർത്തുന്നു. തുടർന്നുള്ള സമാന്തര ഘടകങ്ങളുമായി ബന്ധിപ്പിക്കാൻ ‘-ഉം’ ചേർക്കുന്നു.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: നിങ്ങൾ എന്നിലും
  rationale: ഗ്രീക്കിലെ ക്രിയയില്ലാത്ത സമാന്തര ഘടന മലയാളത്തിൽ അവസാനത്തെ ‘ആണ്’ എന്ന ക്രിയയോടു ചേർത്തു സ്വാഭാവികമായി നൽകുന്നു; ‘എന്നിൽ’ എന്ന രൂപം പരസ്പര അന്തർവാസത്തിന്റെ ഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: ഞാൻ നിങ്ങളിലും
  rationale: κἀγώയിലെ ‘ഞാനും/ഞാൻ ... ഉം’ എന്ന ബന്ധം മലയാളത്തിലെ ‘-ഉം’ വഴി പ്രകടമാക്കുന്നു; ‘നിങ്ങളിൽ’ എന്നു നൽകി ἐν ആവർത്തിക്കുന്ന രൂപം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ പരസ്പര അന്തർവാസഭാഷ (ἐν ... ἐν ... ἐν)
  choice: 'മൂന്നു ഘടകങ്ങളിലും ‘-ൽ’ എന്ന അർഥരൂപം നിലനിർത്തി: ‘എന്റെ പിതാവിലും ... എന്നിലും ... നിങ്ങളിലും.’'
  alternative: ‘എന്റെ പിതാവിനോട് ഒന്നായിരിക്കുന്നു ... എന്നോടു ഐക്യപ്പെട്ടിരിക്കുന്നു’ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കുക.
  rationale: ‘ഐക്യം’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് വാക്യത്തെ ചുരുക്കാതെ, ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായി സമ്പന്നമായ മൂലരൂപകവും അതിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: യേശുവും പിതാവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഞാൻ എന്റെ പിതാവിലും ... ആണ്’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: ‘ഞാനും പിതാവും സത്തയിൽ ഒന്നാണ്’ അല്ലെങ്കിൽ ‘ഞാൻ പിതാവിനോടുകൂടെയാണ്.’
  rationale: വാക്യത്തിന്റെ ശക്തി ദുർബലമാക്കുകയോ പിൽക്കാല സൈദ്ധാന്തിക നിർവചനം വാക്യത്തിനുള്ളിൽ ചേർക്കുകയോ ചെയ്യാതെ മൂലപാഠത്തിന്റെ പ്രസ്താവന അതേ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സമാന്തര ഘടകങ്ങളെ ഒരൊറ്റ ‘ആണ്’ എന്ന ക്രിയയുമായി ബന്ധിപ്പിക്കുന്നത് മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്; ആവർത്തിക്കുന്ന ‘-ൽ’ രൂപവും ബന്ധിപ്പിക്കുന്ന ‘-ഉം’ ഘടകവും ഗ്രീക്കിലെ ഘടനയും പ്രമേയവും സംരക്ഷിക്കുന്നു.
