  terminology: ‘പിതാവ്’ appropriately renders the filial designation, and ‘-ൽ’ preserves Johannine ἐν language without interpretively reducing it to ‘union.’ The footnote appropriately identifies the literal repeated locative wording and avoids doctrinal over-specification.
