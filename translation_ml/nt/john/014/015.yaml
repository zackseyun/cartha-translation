id: JHN.14.15
reference: John 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: ml
  text: നിങ്ങൾ എന്നെ സ്നേഹിക്കുന്നുവെങ്കിൽ, എന്റെ കൽപ്പനകൾ പാലിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ആജ്ഞകൾ അനുസരിക്കും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് പാലിക്കുക, ആചരിക്കുക, കാത്തുസൂക്ഷിക്കുക, അനുസരിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ‘പാലിക്കും’ എന്നത് ഈ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: എങ്കിൽ
  rationale: ἐάν വ്യവസ്ഥാസൂചകമാണ്. മലയാളത്തിൽ അനുബന്ധക്രിയയോടുചേർന്ന ‘-ുന്നുവെങ്കിൽ’ എന്ന രൂപം സ്വാഭാവികമായി ‘if’ എന്ന അർഥം നൽകുന്നു; ആവർത്തനാർഥമുള്ള ‘എപ്പോഴെല്ലാം’ ഇവിടെ ആവശ്യമില്ല.
- source_word: ἀγαπᾶτέ
  choice: നിങ്ങൾ … സ്നേഹിക്കുന്നു
  rationale: ἐάν-നോടുകൂടിയ വർത്തമാന കർത്തരി സുബ്ജങ്ക്റ്റീവ്, രണ്ടാം പുരുഷ ബഹുവചനം. മലയാളത്തിലെ വ്യവസ്ഥാരൂപമായ ‘സ്നേഹിക്കുന്നുവെങ്കിൽ’ സ്വാഭാവികവും ἀγαπάω എന്നതിന്റെ സ്നേഹാർഥം നേരിട്ട് നിലനിർത്തുന്നതുമാണ്.
- source_word: με
  choice: എന്നെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന ഏകവചന ദ്വിതീയാവിഭക്തി സർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: ἐντολάς
  choice: കല്പനകൾ
  rationale: ἐντολή എന്നതിന്റെ ഗൗരവവും യോഹന്നാനിലെ പരിചിതമായ പ്രയോഗവും ‘കല്പനകൾ’ നിലനിർത്തുന്നു; ‘ആജ്ഞകൾ’ സാധുവായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: τὰς ἐμὰς
  choice: എന്റെ
  rationale: നിശ്ചയോപപദവും ഉടമസ്ഥതാസർവനാമവും ചേർന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്റെ’ എന്നു വരുന്നു; അസ്വാഭാവികമായ വിപുലീകരണം ആവശ്യമില്ല.
- source_word: τηρήσετε
  choice: പാലിക്കും
  rationale: ഇത് രണ്ടാം പുരുഷ ബഹുവചന ഭാവികാല നിർദേശക രൂപമാണ്. ‘പാലിക്കും’ ഭാവിപ്രസ്താവന നിലനിർത്തുകയും τηρέω-യുടെ അനുസരിക്കുക, ആചരിക്കുക, കാത്തുസൂക്ഷിക്കുക എന്നീ അർഥവ്യാപ്തിയിൽ സാധ്യമായത്ര ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τηρήσετε എന്നത് കല്പനയായി വിവർത്തനം ചെയ്യണമോ ഭാവികാല പ്രസ്താവനയായി വിവർത്തനം ചെയ്യണമോ
  choice: 'ഭാവികാല പ്രസ്താവന: ‘പാലിക്കും’'
  alternative: 'കല്പനാത്മക അർഥം: ‘എന്റെ കല്പനകൾ പാലിക്കുക’'
  rationale: ഗ്രീക്ക് രൂപം ഭാവികാല നിർദേശകമാണ്, കല്പനാരൂപമല്ല. വാക്യത്തിന് പ്രബോധനപരമായ ശക്തിയുണ്ടാകാമെങ്കിലും, യേശുവിനോടുള്ള സ്നേഹം അവന്റെ കല്പനകൾ പാലിക്കുന്നതിൽ പ്രകടമാകുന്നു എന്ന വ്യാകരണരൂപവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വിവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പാലിക്കും’ എന്ന ഭാവികാലരൂപം മൂലപാഠത്തിന്റെ വ്യാകരണം കാത്തുസൂക്ഷിക്കുന്നു; ‘കല്പനകൾ’ ബൈബിൾസന്ദർഭത്തിലെ ഗൗരവം നിലനിർത്തിയിട്ടും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതാണ്.
