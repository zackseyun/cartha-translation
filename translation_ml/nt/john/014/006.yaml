id: JHN.14.6
reference: John 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു[a]: “ഞാൻ തന്നെയാണ് വഴിയും സത്യവും ജീവനും. എന്നിലൂടെയല്ലാതെ ആരും പിതാവിന്റെ അടുക്കൽ വരുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “യേശു അവനോടു പറയുന്നു.” ഇവിടെ ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലം ഉപയോഗിച്ചിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ്; എന്നാൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിക്കായി ഭൂതകാലമായ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു. മൂലരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: യേശുവിന്റെ വാക്കുകൾ ആരോടാണ് പറഞ്ഞതെന്ന് സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി സർവനാമത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻതന്നെ ... ആകുന്നു
  rationale: വ്യക്തമായി നൽകിയ ἐγώ എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നതിലൂടെ നിലനിർത്തി; ‘ആകുന്നു’ മൂന്ന് നാമപദങ്ങൾക്കും ചേർന്ന ഏക വിധേയക്രിയയായി സ്വാഭാവികമായി വരുന്നു.
- source_word: ἡ ὁδός
  choice: വഴി
  rationale: നേരിട്ടുള്ളതും രൂപകാലങ്കാരപരവുമായ അർഥങ്ങൾ ഒരുപോലെ വഹിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἡ ἀλήθεια
  choice: സത്യം
  rationale: ἀλήθεια എന്നതിന്റെ അടിസ്ഥാന അർഥം കൃത്യമായി നൽകുകയും യോഹന്നാനിലെ വിപുലമായ അർഥസാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ ζωή
  choice: ജീവൻ
  rationale: യോഹന്നാനിലെ സമൃദ്ധമായ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിച്ച് ചുരുക്കാതെ, ζωή എന്നതിന്റെ നേരിട്ടുള്ള മലയാളസമാനപദം സ്വീകരിച്ചു.
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: സാർവത്രിക നിഷേധം മലയാളത്തിലെ സ്വാഭാവിക നിഷേധഘടനയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നില്ല
  rationale: ഒരു പൊതുവായ, കാലാതീതമായ യാഥാർഥ്യം സൂചിപ്പിക്കുന്ന വർത്തമാനകാലപ്രയോഗം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν πατέρα
  choice: പിതാവിന്റെ അടുക്കൽ
  rationale: πρός സൂചിപ്പിക്കുന്ന വ്യക്തിയിലേക്കുള്ള ഗതിയും സമീപനവും ‘അടുക്കൽ’ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ അഭിസംബോധനയായി ‘പിതാവ്’ ഉപയോഗിച്ചു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഇവിടെ εἰ μὴ ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്നതിനാൽ ‘അല്ലാതെ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: δι’ ἐμοῦ
  choice: എന്നിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം അഥവാ മാർഗം നേരിട്ട് നിലനിർത്തുന്നു; ‘എന്നാൽ’ എന്നതിനെക്കാൾ ആശയക്കുഴപ്പം കുറഞ്ഞ രൂപം.
theological_decisions:
- issue: യേശുവിലൂടെ മാത്രമുള്ള പിതാവിലേക്കുള്ള പ്രവേശനത്തിന്റെ അനന്യത
  choice: “എന്നിലൂടെയല്ലാതെ ആരും പിതാവിന്റെ അടുക്കൽ വരുന്നില്ല” എന്ന നേരിട്ടുള്ള, ഒഴിവാക്കലില്ലാത്ത പ്രസ്താവന നിലനിർത്തി.
  alternative: “എന്നിലൂടെ അല്ലെങ്കിൽ ആരും പിതാവിന്റെ അടുക്കൽ വരുന്നില്ല”
  rationale: οὐδεὶς ... εἰ μὴ δι’ ἐμοῦ എന്ന ഗ്രീക്ക് ഘടന യേശുവിലൂടെയുള്ള പ്രവേശനത്തിന്റെ അനന്യത വ്യക്തമായി പറയുന്നു; അതിനെ മൃദൂകരിക്കുകയോ വാക്യത്തിനപ്പുറം വികസിപ്പിക്കുകയോ ചെയ്തില്ല.
- issue: യോഹന്നാനിലെ മൂന്ന് വിധേയനാമങ്ങളുടെ ഘടന
  choice: “വഴിയും സത്യവും ജീവനും” എന്ന സമാന്തര ത്രിപദഘടന സ്വീകരിച്ചു.
  alternative: “വഴി, സത്യം, ജീവൻ”
  rationale: ഓരോ നാമത്തിനുമുമ്പും ഗ്രീക്ക് നിർദേശകപദം ആവർത്തിക്കുകയും καί കൊണ്ട് അവയെ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു. മലയാളത്തിലെ ‘-ഉം’ ആവർത്തനം ഈ വ്യത്യസ്തതയും വാഗ്മിതാഭാരവും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- issue: Ἐγώ എന്ന വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ
  choice: “ഞാൻതന്നെ” എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: “ഞാൻ”
  rationale: ഗ്രീക്കിൽ ക്രിയാരൂപം മാത്രം മതിയായിരിക്കെ Ἐγώ വ്യക്തമായി ചേർത്തിരിക്കുന്നത് ഊന്നൽ നൽകുന്നു. ‘ഞാൻതന്നെ’ അത് മലയാളത്തിൽ പ്രകടമാക്കുന്നു; എന്നാൽ അതിലപ്പുറം ഒരു വ്യാഖ്യാനപരമായ അവകാശവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവവും ലാളിത്യവും ചേർന്ന ശൈലി. ‘ഞാൻതന്നെ’ മൂലത്തിലെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; ‘വഴിയും സത്യവും ജീവനും’ എന്ന രൂപം ഗ്രീക്കിലെ ത്രിപദസമാന്തര്യം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടയാളം അനുബന്ധ അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
