revisions:
- from: 'യേശു അവനോട് ഉത്തരം പറഞ്ഞു: “ആരെങ്കിലും എന്നെ സ്നേഹിക്കുന്നെങ്കിൽ, അവൻ എന്റെ വാക്ക് പാലിക്കും[a]. എന്റെ പിതാവ് അവനെ സ്നേഹിക്കും; ഞങ്ങൾ അവന്റെ അടുക്കൽ വന്ന് അവനോടുകൂടെ വാസമുറപ്പിക്കും[b].”'
  to: 'യേശു അവനോട് ഉത്തരം പറഞ്ഞു: “ആരെങ്കിലും എന്നെ സ്നേഹിക്കുന്നെങ്കിൽ, അവൻ എന്റെ വാക്ക് പാലിക്കും[a]. എന്റെ പിതാവ് അവനെ സ്നേഹിക്കും; ഞങ്ങൾ അവന്റെ അടുക്കൽ വന്ന് അവനോടുകൂടെ ഞങ്ങളുടെ വാസസ്ഥലം ഒരുക്കും[b].”'
  rationale: The revision makes the ‘make a dwelling’ component of μονὴν ... ποιησόμεθα explicit in fluent modern Malayalam, while preserving the Greek’s plural subject and its relational ‘with him.’ Footnote b has been made idiomatic and remains a lexical alternative rather than an interpretive expansion.
