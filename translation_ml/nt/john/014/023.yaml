reference: John 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: ml
  text: 'യേശു അവനോട് ഉത്തരം പറഞ്ഞു: “ആരെങ്കിലും എന്നെ സ്നേഹിക്കുന്നെങ്കിൽ, അവൻ എന്റെ വാക്ക് പാലിക്കും[a]. എന്റെ പിതാവ് അവനെ സ്നേഹിക്കും; ഞങ്ങൾ അവന്റെ അടുക്കൽ വന്ന് അവനോടുകൂടെ ഞങ്ങളുടെ വാസസ്ഥലം ഒരുക്കും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്റെ ഉപദേശം” എന്നോ “ഞാൻ പറയുന്നത്” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവനോടുകൂടെ ഒരു വാസസ്ഥലം ഉണ്ടാക്കും” എന്നോ “അവനോടുകൂടെ ഞങ്ങളുടെ ഭവനം ആക്കും” എന്നോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ മറുപടിയെ സൂചിപ്പിക്കുന്ന ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അസ്വാഭാവികമായ പദാനുപദ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Ἐάν τις
  choice: ആരെങ്കിലും … എങ്കിൽ
  rationale: വ്യവസ്ഥാപകവും അനിശ്ചിതവുമായ ഏകവചന പ്രയോഗത്തിന്റെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന പരിധി നിലനിർത്തുന്നു.
- source_word: ἀγαπᾷ / ἀγαπήσει
  choice: സ്നേഹിക്കുന്നെങ്കിൽ / സ്നേഹിക്കും
  rationale: രണ്ടിടത്തും ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ബന്ധം ദൃശ്യമാക്കുന്ന, സാധാരണവും മാന്യവുമായ മലയാളം.
- source_word: τὸν λόγον μου
  choice: എന്റെ വാക്ക്
  rationale: യേശുവിന്റെ സന്ദേശത്തെയും അരുളപ്പാടിനെയും സൂചിപ്പിക്കുന്ന λόγος എന്ന പദത്തിന്റെ യോഹന്നാനീയ പ്രതിധ്വനി നിലനിർത്തുന്നു; ‘ഉപദേശം’ എന്ന് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τηρήσει
  choice: പാലിക്കും
  rationale: വാക്ക് അനുസരിച്ച് ജീവിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുമ്പോഴും വെറും നിയമാനുസരണം എന്നതിലേക്ക് ആശയം ചുരുക്കുന്നില്ല.
- source_word: ὁ πατήρ μου
  choice: എന്റെ പിതാവ്
  rationale: ദൈവത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ പതിവായ യോഹന്നാനീയ അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: ഞങ്ങൾ അവന്റെ അടുക്കൽ വന്ന്
  rationale: വ്യക്തിയിലേക്കുള്ള ബന്ധപരമായ വരവ് എന്ന πρός സഹിതമുള്ള ἔρχομαιയുടെ ചലനാർഥവും ഒന്നാംപുരുഷ ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: അവനോടുകൂടെ വാസമുറപ്പിക്കും
  rationale: ‘ഒരാളോടുകൂടെ വാസം സ്ഥാപിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള ശൈലിയിൽ നൽകുന്നു; താൽക്കാലിക സന്ദർശനമല്ല, നിലനിൽക്കുന്ന സാന്നിധ്യമാണെന്ന ഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: “ഞങ്ങൾ വരും … വാസമുറപ്പിക്കും” എന്നതിലെ ദൈവിക ബഹുവചനം
  choice: യേശുവിനെയും പിതാവിനെയും സൂചിപ്പിക്കുന്ന ‘ഞങ്ങൾ’ എന്ന ബഹുവചനം വ്യക്തമായി നിലനിർത്തി.
  alternative: ബഹുവചനത്തിന് ഊന്നൽ വരാതിരിക്കാൻ വാക്യം പരോക്ഷമാക്കുക.
  rationale: ἐλευσόμεθα, ποιησόμεθα എന്നീ ഒന്നാംപുരുഷ ബഹുവചന ക്രിയകൾ യേശുവും പിതാവും സംയുക്തമായി വരുന്നതും വസിക്കുന്നതും വ്യക്തമാക്കുന്നു. അതിന് അപ്പുറമുള്ള വ്യാഖ്യാനം ചേർക്കാതെ പാഠത്തിലെ വ്യക്തിവ്യത്യാസവും ഏകീകൃത പ്രവർത്തനവും സംരക്ഷിക്കുന്നു.
- issue: അനിശ്ചിത ഏകവചനത്തിലെ ലിംഗസൂചന
  choice: τις എന്നതിന് ‘ആരെങ്കിലും’ എന്നും തുടർന്നുള്ള ഏകവചന സൂചനയ്ക്ക് ‘അവൻ/അവനെ/അവന്റെ’ എന്നും നൽകി.
  alternative: തുടർന്നുള്ള എല്ലാ പരാമർശങ്ങളും ആവർത്തിച്ചുള്ള ലിംഗനിരപേക്ഷ നാമപ്രയോഗങ്ങളാക്കുക.
  rationale: മലയാളത്തിലെ സാധാരണ പൊതുവായ ഏകവചനഘടനയിൽ സ്വാഭാവികതയും ഗ്രീക്കിലെ ഏകവചന യോജിപ്പും നിലനിർത്തുന്നു; ആരംഭത്തിലെ ‘ആരെങ്കിലും’ തുറന്ന പരിധി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘വാക്ക്’, ‘പാലിക്കും’, ‘വാസമുറപ്പിക്കും’ എന്നിവ പദാനുപദ കാഠിന്യം ഒഴിവാക്കി മൂലത്തിലെ യോഹന്നാനീയ ആശയബന്ധങ്ങളും നിലനിൽക്കുന്ന ദൈവിക സാന്നിധ്യത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
