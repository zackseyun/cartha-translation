  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: ml
  text: 'തോമാസ് അവനോടു പറഞ്ഞു: “കർത്താവേ, അങ്ങ് എവിടേക്കാണ് പോകുന്നതെന്ന് ഞങ്ങൾക്കറിയില്ല. വഴി ഞങ്ങൾക്ക് എങ്ങനെ അറിയാനാകും?[a]”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വഴി അറിയാൻ ഞങ്ങൾക്ക് എങ്ങനെ കഴിയും?”'
    reason: lexical_alternative
  - marker: b
    text: '“അറിയുക” എന്നതിനുള്ള ഒരേ ഗ്രീക്ക് ക്രിയ ഈ വാക്യത്തിൽ രണ്ടുതവണ ഉപയോഗിച്ചിരിക്കുന്നു: “ഞങ്ങൾക്കറിയില്ല” എന്നും “വഴി … അറിയാനാകും” എന്നും.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: തോമാസ് അവനോടു പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ ഗ്രീക്ക് ചരിത്രവർത്തമാനമായ λέγει സ്വാഭാവികമായ മലയാളത്തിൽ ഭൂതകാലമായി നൽകി; αὐτῷ എന്ന സർവനാമവും നിലനിർത്തി.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ബഹുമാനവും ശിഷ്യത്വപരമായ അംഗീകാരവും ഒരുപോലെ നിലനിർത്തുന്ന പതിവായ സംബോധനരൂപം.
- source_word: οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്കറിയില്ല
  rationale: οἶδα അറിവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മനസ്സിലാകുന്നില്ല’ എന്നതിനെക്കാൾ നേരിട്ടുള്ള തുല്യപ്രയോഗമാണിത്.
- source_word: ποῦ ὑπάγεις
  choice: അങ്ങ് എവിടേക്കാണ് പോകുന്നത്
  rationale: യോഹന്നാനിൽ ὑπάγω-യ്ക്ക് പോകുക/പിരിഞ്ഞുപോകുക എന്ന ആഴമുള്ള പശ്ചാത്തലമുണ്ടാകാമെങ്കിലും, ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെക്കുറിച്ചുള്ള തോമാസിന്റെ അജ്ഞത നിഷ്പക്ഷമായി നിലനിർത്തുന്നു.
- source_word: πῶς δυνάμεθα
  choice: എങ്ങനെ അറിയാനാകും
  rationale: πῶς എന്ന ചോദ്യവും δύναμαι സൂചിപ്പിക്കുന്ന കഴിവ്/സാധ്യതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὴν ὁδὸν
  choice: വഴി
  rationale: ὁδός എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപദം; അടുത്ത വാക്യത്തിലെ പ്രമേയബന്ധം മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: εἰδέναι
  choice: അറിയാനാകും
  rationale: οἴδαμεν / εἰδέναι എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും ‘അറിയുക’ എന്ന് ആവർത്തിച്ച് തോമാസിന്റെ യുക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പശ്ചാത്തലത്തിൽ ὑπάγεις എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന
  choice: ‘എവിടേക്കാണ് പോകുന്നത്’ എന്ന് നിഷ്പക്ഷമായി വിവർത്തനം ചെയ്തു
  alternative: ‘എവിടേക്കാണ് പിരിഞ്ഞുപോകുന്നത്’ / ‘എവിടേക്കാണ് യാത്രയാകുന്നത്’
  rationale: പിതാവിങ്കലേക്കുള്ള മടക്കത്തെക്കുറിച്ചുള്ള വിശാലമായ യോഹന്നാനീയ സൂചന ഇവിടെ വിശദീകരിക്കാതെ, തോമാസിന്റെ അജ്ഞതയും ആഖ്യാനത്തിലെ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. യേശുവിനെ അഭിസംബോധന ചെയ്യുമ്പോൾ ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘അറിയുക’ എന്ന ആവർത്തനം മലയാളത്തിലും സംരക്ഷിച്ചു; ‘പിന്നെ’ എന്നത് തോമാസ് ഉന്നയിക്കുന്ന യുക്തിബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
