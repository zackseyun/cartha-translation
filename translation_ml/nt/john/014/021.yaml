id: JHN.14.21
reference: John 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: ml
  text: എന്റെ കല്പനകൾ ഉള്ളവനും അവ പാലിക്കുന്നവനും എന്നെ സ്നേഹിക്കുന്നവനാണ്.[a] എന്നെ സ്നേഹിക്കുന്നവനെ എന്റെ പിതാവ് സ്നേഹിക്കും; ഞാനും അവനെ സ്നേഹിക്കുകയും എന്നെത്തന്നെ അവന് വെളിപ്പെടുത്തുകയും ചെയ്യും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ പുല്ലിംഗ ഏകവചനരൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ അവ പ്രതിനിധാനപരമായി, ഈ വിവരണത്തിന് യോജിക്കുന്ന ഏതൊരാളെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്നെത്തന്നെ അവന് കാണിച്ചുകൊടുക്കും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ അറിയിക്കുകയോ ദൃശ്യമാക്കുകയോ ചെയ്യുക എന്നർഥമുണ്ടാകാം; ഈ സന്ദർഭത്തിൽ വ്യക്തിപരമായ സ്വയംവെളിപ്പെടുത്തലിനാണ് ഊന്നൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: സ്വീകരിച്ച് … ഉള്ളവൻ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന ‘സ്വീകരിച്ച്’
  rationale: ഇവിടെ ἔχω വെറും കൈവശംവയ്ക്കലിനെക്കാൾ യേശുവിന്റെ കല്പനകൾ ഏറ്റുവാങ്ങി സ്വന്തമാക്കിയിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വീകരിച്ച്’ എന്നത് ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുടർന്നുള്ള ‘പാലിക്കുന്ന’ എന്നതിൽനിന്ന് വേറിട്ടും നിൽക്കുന്നു.
- source_word: τὰς ἐντολάς μου
  choice: എന്റെ കല്പനകൾ
  rationale: ἐντολήയുടെ അധികാരപരമായ അർഥവും യോഹന്നാനിലെ പ്രയോഗവും ‘കല്പനകൾ’ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τηρῶν
  choice: പാലിക്കുന്ന
  rationale: τηρέωയ്ക്ക് കാത്തുസൂക്ഷിക്കുക, ആചരിക്കുക, അനുസരിക്കുക എന്നീ വ്യാപ്തികളുണ്ട്. കല്പനകളോടൊപ്പം ‘പാലിക്കുക’ സ്വാഭാവികവും വിശ്വസ്തമായ അനുസരണത്തിന്റെ ആശയം ഉൾക്കൊള്ളുന്നതുമാണ്.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: അവനാണ് എന്നെ സ്നേഹിക്കുന്നവൻ
  rationale: ἐκεῖνος നൽകുന്ന ഊന്നൽ ‘അവനാണ്’ എന്ന തിരിച്ചറിയൽഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: സ്നേഹിക്കുന്ന / സ്നേഹിക്കും / സ്നേഹിക്കും
  rationale: ἀγαπάω എന്ന ഒരേ പദകുടുംബത്തിന്റെ ആവർത്തനം മലയാളത്തിലും ‘സ്നേഹിക്കുക’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: എന്നെ സ്നേഹിക്കുന്നവനെ
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ചിന്തയുടെ തുടർച്ചയാണ്. മലയാളത്തിലെ വാക്യബന്ധത്തിൽ പ്രത്യേക സംയോജകം ചേർക്കാതിരിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: എന്റെ പിതാവ് സ്നേഹിക്കും
  rationale: ഗ്രീക്കിലെ ഭാവി കർമണി മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരിപ്രയോഗമായി നൽകിയെങ്കിലും സ്നേഹത്തിന്റെ കർത്താവായ ‘എന്റെ പിതാവ്’ വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καὶ ἐγώയിലെ കൂട്ടിച്ചേർക്കൽഭാവവും ἐγώയുടെ ഊന്നലും ‘ഞാനും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: എന്നെത്തന്നെ അവനു വെളിപ്പെടുത്തും
  rationale: ἐμφανίζωയിലെ വ്യക്തിപരമായ സ്വയംവെളിപ്പെടുത്തൽ ‘വെളിപ്പെടുത്തും’ സംരക്ഷിക്കുന്നു; ἐμαυτόν എന്ന പ്രതിഫലനസർവനാമത്തിന്റെ ഊന്നൽ ‘എന്നെത്തന്നെ’ നൽകുന്നു.
theological_decisions:
- issue: സ്നേഹവും കല്പനപാലനവും തമ്മിലുള്ള ബന്ധം
  choice: കല്പനകൾ സ്വീകരിച്ച് പാലിക്കുന്നവനെയാണ് യേശുവിനെ സ്നേഹിക്കുന്നവനായി വാക്യം തിരിച്ചറിയുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: അനുസരണം സ്നേഹത്തെ തെളിയിക്കുന്നു; അല്ലെങ്കിൽ അനുസരണം ദൈവസ്നേഹം സമ്പാദിക്കുന്നു.
  rationale: ഗ്രീക്ക് വാക്യഘടന തിരിച്ചറിയൽബന്ധം പ്രസ്താവിക്കുന്നു; കാരണബന്ധമോ പ്രതിഫലാർഹതയോ പ്രത്യേകം ചേർക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം അതേപടി നിലനിർത്തുന്നു.
- issue: പിതാവിന്റെയും യേശുവിന്റെയും സ്നേഹം
  choice: ‘എന്റെ പിതാവ് സ്നേഹിക്കും; ഞാനും അവനെ സ്നേഹിച്ച്…’ എന്ന് നൽകി.
  alternative: ദൈവസ്നേഹം അനുസരണത്തിനുള്ള സമ്പാദിത പ്രതിഫലമാണെന്ന് വിശദീകരിക്കുക.
  rationale: ഭാവികാലപ്രസ്താവനകൾ വ്യക്തമായി നിലനിർത്തുന്നു; എന്നാൽ അവയുടെ ദൈവശാസ്ത്രപരമായ കാരണം പരിഭാഷയിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- issue: യേശുവിന്റെ സ്വയംവെളിപ്പെടുത്തലിന്റെ സ്വഭാവം
  choice: ‘എന്നെത്തന്നെ അവനു വെളിപ്പെടുത്തും’
  alternative: ‘എന്നെത്തന്നെ അവനു കാണിച്ചുകൊടുക്കും’
  rationale: ἐμφανίζωയ്ക്ക് അറിയിക്കുക, ദൃശ്യമാക്കുക, വെളിപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. സന്ദർഭം വ്യക്തിപരമായ സ്വയംവെളിപ്പെടുത്തലിന് ഇട നൽകുന്നതിനാൽ ‘വെളിപ്പെടുത്തും’ അർഥം അനാവശ്യമായി ശാരീരിക ദർശനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ‘അവൻ/അവനെ/അവനു’ എന്ന ഏകവചനരൂപങ്ങൾ പ്രധാനപാഠത്തിൽ നിലനിർത്തി, ഉൾക്കൊള്ളുന്ന പ്രതിനിധാനബലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ആ വ്യക്തി’ അല്ലെങ്കിൽ ബഹുവചനം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം പൊതുവായ പ്രതിനിധാനാർഥത്തിലാണ്. വ്യാകരണരൂപം സംരക്ഷിക്കുമ്പോഴും അതിന്റെ വ്യാപ്തി പുരുഷന്മാർക്കു മാത്രമല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കല്പനകൾ’, ‘പിതാവ്’, ‘വെളിപ്പെടുത്തും’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ അധികാരപരവും ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു. നീണ്ട കർമണിപ്രയോഗം ഒഴിവാക്കി സ്വാഭാവിക മലയാളവാക്യക്രമം സ്വീകരിച്ചു; എന്നാൽ മൂലത്തിലെ ഏകവചനം, ആവർത്തിച്ച ‘സ്നേഹം’, സ്വയംവെളിപ്പെടുത്തൽ എന്നിവ സംരക്ഷിച്ചു.
