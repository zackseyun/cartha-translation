revisions:
- from: എന്റെ കല്പനകൾ സ്വീകരിച്ച് അവ പാലിക്കുന്നവനാണ് എന്നെ സ്നേഹിക്കുന്നവൻ.[a] എന്നെ സ്നേഹിക്കുന്നവനെ എന്റെ പിതാവ് സ്നേഹിക്കും; ഞാനും അവനെ സ്നേഹിച്ച് എന്നെത്തന്നെ അവനു വെളിപ്പെടുത്തും.[b]
  to: എന്റെ കല്പനകൾ ഉള്ളവനും അവ പാലിക്കുന്നവനും എന്നെ സ്നേഹിക്കുന്നവനാണ്.[a] എന്നെ സ്നേഹിക്കുന്നവനെ എന്റെ പിതാവ് സ്നേഹിക്കും; ഞാനും അവനെ സ്നേഹിക്കുകയും എന്നെത്തന്നെ അവന് വെളിപ്പെടുത്തുകയും ചെയ്യും.[b]
  rationale: The revision removes the unwarranted nuance of acceptance from ἔχων, while retaining the natural Malayalam expression ‘കല്പനകൾ ഉള്ളവൻ.’ It also makes the final two future actions explicitly coordinate, as in the Greek, without changing the intended meaning. Footnote anchors and their explanatory functions are retained.
