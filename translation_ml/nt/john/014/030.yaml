  source_fidelity: 'മുഖ്യവാചകം ഗ്രീക്കിനെ വിശ്വസ്തമായി പിന്തുടരുന്നു: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν എന്നത് ‘ഇനി ഞാൻ നിങ്ങളോടു അധികം സംസാരിക്കുകയില്ല’ എന്നു സ്വാഭാവികമായും കൃത്യമായും നൽകിയിരിക്കുന്നു. ὁ τοῦ κόσμου ἄρχων-നു ‘ലോകത്തിന്റെ അധിപതി’ എന്നും, ἔρχεται-നു ‘വരുന്നു’ എന്നും നൽകിയിരിക്കുന്നത് യോജിച്ചതാണ്. ἐν ἐμοὶ οὐκ ἔχει οὐδέν-ന്റെ സംക്ഷിപ്തവും ബഹുവ്യാഖ്യാസാധ്യതയുള്ളതുമായ സ്വഭാവം ‘എന്നിൽ അവന് ഒന്നുമില്ല’ എന്നതിൽ സംരക്ഷിക്കപ്പെടുന്നു.'
