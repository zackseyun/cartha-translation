id: JHN.14.30
reference: John 14:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: ml
  text: ഇനി ഞാൻ നിങ്ങളോടു അധികം സംസാരിക്കുകയില്ല; കാരണം ലോകത്തിന്റെ അധിപതി[a] വരുന്നു. എന്നിൽ അവന് ഒന്നുമില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ ലോകത്തിന്റെ അധിപതി’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; എന്നാൽ ഇവിടെ ഗ്രീക്ക് പാഠത്തിൽ ‘ഈ’ എന്ന പദമില്ല.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘എന്റെമേൽ അവന് യാതൊരു അവകാശവുമില്ല’ അല്ലെങ്കിൽ ‘എന്നിൽ അവന് യാതൊരു പിടിയുമില്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘എന്നിൽ അവന് ഒന്നുമില്ല.’'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι
  choice: ഇനി … ഇല്ല
  rationale: ഈ നിമിഷംമുതൽ ഒരു പ്രവൃത്തി തുടരുകയില്ലെന്ന കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πολλὰ λαλήσω
  choice: അധികം സംസാരിക്കുകയില്ല
  rationale: πολλὰ ഇവിടെ ക്രിയാവിശേഷണമായി ‘വളരെയധികം’ എന്ന അർഥത്തിലാണ്; ‘പല കാര്യങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടു
  rationale: ശിഷ്യന്മാരുമായുള്ള നേരിട്ടുള്ള സംഭാഷണബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: സമീപിച്ചുകൊണ്ടിരിക്കുന്ന വരവിനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലരൂപത്തിന്റെ ഭാവിയെ അഭിമുഖീകരിക്കുന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: ലോകത്തിന്റെ അധിപതി
  rationale: ἄρχων എന്ന പദത്തിന്റെ ഭരണാധികാരസൂചന ‘അധിപതി’ വ്യക്തമായി നൽകുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഈ’ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പദപ്രയോഗം അതേപടി നിലനിർത്തി അതിന്റെ വ്യാഖ്യാനസാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
- source_word: οὐκ ἔχει οὐδέν
  choice: അവന് ഒന്നുമില്ല
  rationale: അവകാശമോ പിടിയോ സ്വാധീനമോ ഇല്ലെന്നു സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ അക്ഷരാർഥത്തോട് അടുത്തായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ലോകത്തിന്റെ അധിപതി’ ആരെയാണ് സൂചിപ്പിക്കുന്നത്
  choice: വ്യക്തിയെ ‘ലോകത്തിന്റെ അധിപതി’ എന്ന മൂലപാഠത്തിലെ സ്ഥാനപ്പേരിലൂടെ മാത്രം അവതരിപ്പിക്കുന്നു.
  alternative: ‘സാത്താൻ’ എന്നു നേരിട്ട് തിരിച്ചറിയുക; അല്ലെങ്കിൽ ലോകത്തിലെ ദുഷ്ടശക്തികളുടെ പൊതുവായ വ്യക്തിവൽക്കരണമായി കാണുക.
  rationale: യോഹന്നാന്റെ പശ്ചാത്തലത്തിൽ ഈ സ്ഥാനപ്പേര് സാധാരണയായി സാത്താനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം ഇവിടെ ആ പേര് നേരിട്ട് ഉപയോഗിക്കുന്നില്ല. അതിനാൽ തിരിച്ചറിയൽ വായനക്കാരന്റെ സന്ദർഭബോധത്തിന് വിടുന്നു.
- issue: ‘എന്നിൽ അവന് ഒന്നുമില്ല’ എന്നതിന്റെ അർഥം
  choice: സംക്ഷിപ്തവും അർഥവ്യാപ്തിയുള്ളതുമായ പ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
  alternative: ‘എന്റെമേൽ അവന് യാതൊരു അവകാശവുമില്ല,’ ‘എന്നിൽ അവന് യാതൊരു പിടിയുമില്ല,’ അല്ലെങ്കിൽ ‘എന്റെമേൽ അവന് അധികാരമില്ല.’
  rationale: ഈ പ്രയോഗം അവകാശം, പിടി, കുറ്റാരോപണത്തിനുള്ള അടിസ്ഥാനം, പങ്കിട്ട നിലപാട് തുടങ്ങിയ പരസ്പരം ബന്ധപ്പെട്ട ആശയങ്ങൾ സൂചിപ്പിക്കാം. അവയിൽ ഒന്നു മാത്രം മുഖ്യവാചകത്തിൽ തിരഞ്ഞെടുത്താൽ ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ സംക്ഷിപ്തത ചുരുങ്ങും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സംസാരിക്കുകയില്ല,’ ‘അധിപതി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്. ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളുടെ സ്ഥാനവൈരുധ്യം തിരുത്തി, ഓരോ ചിഹ്നവും അതത് പ്രയോഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
