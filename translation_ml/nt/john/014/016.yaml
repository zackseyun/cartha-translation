id: JHN.14.16
reference: John 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: ml
  text: ഞാനും പിതാവിനോടു അപേക്ഷിക്കും; അവിടുന്ന് നിങ്ങൾക്കു മറ്റൊരു സഹായകനെ[a] നൽകും, അദ്ദേഹം എന്നേക്കും നിങ്ങളോടുകൂടെ ഇരിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് παράκλητος എന്ന പദത്തിന് ‘പക്ഷവാദി,’ ‘ഉപദേഷ്ടാവ്,’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘ആശ്വാസകൻ’ എന്നും പരിഭാഷ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: ഞാൻ
  rationale: καί + ἐγώ എന്ന സംയുക്തരൂപം മുൻവാക്യത്തോടുള്ള ബന്ധവും വിഷയത്തിന് നേരിയ ഊന്നലും നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ ‘ഞാൻ’ അതിനെ അമിതമായി ഊന്നാതെ അറിയിക്കുന്നു.
- source_word: ἐρωτήσω
  choice: അപേക്ഷിക്കും
  rationale: ἐρωτάω ഇവിടെ പിതാവിനോടുള്ള അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു. ‘അപേക്ഷിക്കും’ ആ അർഥം സ്വാഭാവികവും ആദരസൂചകവുമായി നൽകുന്നു; ‘പ്രാർഥിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക മതപരമായ പ്രയോഗം ചേർക്കുന്നില്ല.
- source_word: τὸν πατέρα
  choice: പിതാവിനോട്
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘എന്റെ പിതാവ്’ എന്നു ചേർക്കാതെ യോഹന്നാന്റെ പ്രയോഗമായ ‘പിതാവ്’ നിലനിർത്തുന്നു.
- source_word: ἄλλον
  choice: മറ്റൊരു
  rationale: ἄλλος മുമ്പേ ഉള്ള ഒരാളിൽനിന്നു വ്യത്യസ്തനായ മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു. യേശുവുമായുള്ള ബന്ധം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ‘അതേ തരത്തിലുള്ള’ എന്ന വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: παράκλητον
  choice: സഹായകനെ[a]
  rationale: παράκλητος എന്നതിന് സഹായം, പ്രതിനിധാനം, പക്ഷവാദം, ഉപദേശം, ആശ്വാസം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാല അർഥമുണ്ട്. ആധുനിക മലയാളത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമായ പദമായി ‘സഹായകൻ’ തിരഞ്ഞെടുത്തു; മറ്റു പ്രധാന അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δώσει ὑμῖν
  choice: അവിടുന്ന് നിങ്ങൾക്ക് … നൽകും
  rationale: ഭാവികാല ക്രിയയും പരോക്ഷ കർമവും വ്യക്തമായി നിലനിർത്തുന്നു. പിതാവിനെ പരാമർശിക്കാൻ ആധുനിക മാനക മലയാളത്തിലെ ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു.
- source_word: ἵνα ᾖ
  choice: ഇരിക്കേണ്ടതിന്
  rationale: ἵνα കൂടിയ വർത്തമാനകാല subjunctive നൽകുന്ന ഉദ്ദേശ്യഭാവം മലയാളത്തിലെ ‘-േണ്ടതിന്’ എന്ന രൂപത്തിലൂടെ സംരക്ഷിക്കുന്നു; അതിനെ വെറും ഭാവികാല പ്രസ്താവനയാക്കി മാറ്റുന്നില്ല.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ
  rationale: μετά + genitive എന്നതിന്റെ നേരിട്ടുള്ള സഹവാസാർഥം നൽകുന്നു; ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന വ്യത്യസ്ത സാധ്യത ഇവിടെ സ്വീകരിച്ചിട്ടില്ല.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: യോഹന്നാന്റെ ഈ സന്ദർഭത്തിൽ സ്ഥിരമായ, അവസാനമില്ലാത്ത നിലനിൽപ്പിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യപദമാണിത്.
theological_decisions:
- issue: ത്രിത്വസംബന്ധമായ സന്ദർഭത്തിൽ παράκλητος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹായകൻ
  alternative: പക്ഷവാദി; ഉപദേഷ്ടാവ്; പരമ്പരാഗതമായി ആശ്വാസകൻ
  rationale: ‘മറ്റൊരു παράκλητος’ വ്യക്തിയായ ഒരാളെ സൂചിപ്പിക്കുന്നതിനാൽ നിർവ്യക്തമായ ‘സഹായം’ എന്ന രൂപം ഒഴിവാക്കി. ‘സഹായകൻ’ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെ ഒരൊറ്റ നിയമപരമായോ ആശ്വാസപരമായോ ചുമതലയിലേക്ക് ചുരുക്കാതെ വ്യക്തിത്വവും വിശാലമായ പ്രവർത്തനപരിധിയും സംരക്ഷിക്കുന്നു. പദത്തിന്റെ നിയമപരവും ഉപദേശപരവും ആശ്വാസപരവുമായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘അവിടുന്ന്,’ ‘അദ്ദേഹം’ എന്നീ ആദരസൂചക രൂപങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക ദൈവപരാമർശരീതിക്കനുസരിച്ചാണ്. ഗ്രീക്കിലെ ഉദ്ദേശ്യഭാവവും παράκλητος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
