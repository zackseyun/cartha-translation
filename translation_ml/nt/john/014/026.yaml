id: JHN.14.26
reference: John 14:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: ml
  text: എന്നാൽ സഹായകൻ[a]—പിതാവ് എന്റെ നാമത്തിൽ അയയ്ക്കുന്ന പരിശുദ്ധാത്മാവ്—അവൻതന്നെ നിങ്ങൾക്ക് എല്ലാം പഠിപ്പിക്കുകയും ഞാൻ നിങ്ങളോടു പറഞ്ഞതെല്ലാം നിങ്ങളെ ഓർമിപ്പിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘സഹായകൻ’ എന്നതിന് ‘പക്ഷവാദി,’ ‘ഉപദേഷ്ടാവ്,’ അല്ലെങ്കിൽ ‘ആശ്വാസകൻ’ എന്നും വിവർത്തനം ചെയ്യാം (ഗ്രീക്ക്: പരാക്ലേതോസ്).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: സഹായകൻ
  rationale: നിയമപരമായ പക്ഷവാദം, പ്രതിനിധാനം, സഹായം, ആശ്വാസം എന്നീ പല ഭാവങ്ങളും ഈ പദത്തിനുണ്ട്. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തിപരമായ സജീവപങ്ക് സൂചിപ്പിക്കുന്നതുമായ ‘സഹായകൻ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; പദത്തിന്റെ വിശാലമായ അർത്ഥപരിധി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ആധുനിക മലയാളത്തിൽ സ്ഥിരപ്പെട്ടതും πνεῦμα എന്ന പദത്തിന്റെ അർത്ഥം യോജിച്ചവിധം നൽകുന്നതുമായ വിശേഷനാമം.
- source_word: ὃ πέμψει ὁ πατὴρ
  choice: പിതാവ് ... അയയ്ക്കുന്ന
  rationale: ഗ്രീക്കിലെ ഭാവികാല ആശയം മലയാളത്തിലെ ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; തുടർന്ന് വരുന്ന മുഖ്യക്രിയകൾ വാഗ്ദാനത്തിന്റെ ഭാവികാലം വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ ὀνόματί μου
  choice: എന്റെ നാമത്തിൽ
  rationale: പ്രതിനിധാനം, അധികാരം, നിയോഗം എന്നീ സാധ്യതകൾ ഒന്നിലേക്കു ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അവൻതന്നെ
  rationale: മുൻപുള്ള παράκλητος എന്ന വ്യക്തിപരമായ വിശേഷനാമത്തിലേക്കു ശക്തമായി ചൂണ്ടുന്ന ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διδάξει ὑμᾶς πάντα
  choice: നിങ്ങൾക്ക് എല്ലാം പഠിപ്പിക്കും
  rationale: διδάσκω എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥവും πάντα എന്നതിന്റെ വിശാലതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπομνήσει ὑμᾶς
  choice: നിങ്ങളെ ഓർമിപ്പിക്കും
  rationale: മറന്നത് വീണ്ടും മനസ്സിലേക്കു കൊണ്ടുവരിക എന്ന causative ആശയം സംക്ഷിപ്തമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞതെല്ലാം
  rationale: ബന്ധവാക്യഘടനയും യേശുവിന്റെ മുൻവാക്കുകളിലേക്കുള്ള നേരിട്ടുള്ള സൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിനെ വ്യക്തിപരമായി പരാമർശിക്കൽ
  choice: ‘അവൻതന്നെ’ എന്ന വ്യക്തിപരമായ സർവനാമം ഉപയോഗിച്ചു
  alternative: വ്യാകരണപരമായി നപുംസകലിംഗമായ πνεῦμα അടിസ്ഥാനമാക്കി വ്യക്തിത്വമില്ലാത്ത പരാമർശം ഉപയോഗിക്കുക
  rationale: വാക്യത്തിൽ നപുംസകലിംഗമായ πνεῦμα ഉണ്ടായിരുന്നാലും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന παράκλητος എന്ന പദവും ഊന്നലുള്ള പുല്ലിംഗസർവനാമമായ ἐκεῖνος ഉം വരുന്നു. അതിനാൽ വ്യക്തിപരമായ പ്രവർത്തനശേഷി മലയാളത്തിൽ പ്രകടമാക്കുന്നത് ഉറവിടവാക്യഘടനയോട് യോജിക്കുന്നു.
- issue: παράκλητος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യപാഠത്തിൽ ‘സഹായകൻ’
  alternative: ‘പക്ഷവാദി,’ ‘ഉപദേഷ്ടാവ്,’ അല്ലെങ്കിൽ ‘ആശ്വാസകൻ’
  rationale: ഒരൊറ്റ മലയാളപദത്തിനും ഗ്രീക്ക് പദത്തിന്റെ മുഴുവൻ അർത്ഥപരിധിയും ഉൾക്കൊള്ളാനാകില്ല. ‘സഹായകൻ’ പൊതുവായ സജീവപങ്ക് വ്യക്തമായി നൽകുന്നു; നിയമപരവും ഉപദേശപരവും ആശ്വാസപരവുമായ മറ്റു ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ഇടയ്ക്കുള്ള വിശേഷണവാക്യം ദീർഘരേഖകൾക്കുള്ളിൽ നൽകി apposition വ്യക്തമാക്കിയിരിക്കുന്നു; ‘അവൻതന്നെ’ ഗ്രീക്കിലെ ἐκεῖνος എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
