  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: ml
  text: “ഞാൻ നിങ്ങളെ അനാഥരായി വിട്ടുകളയുകയില്ല; ഞാൻ നിങ്ങളുടെ അടുക്കലേക്കു വരുന്നു.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ നിങ്ങളുടെ അടുക്കലേക്കു വരുന്നു” എന്നത് യേശു ഉയിർത്തെഴുന്നേറ്റശേഷം ശിഷ്യന്മാർക്കു പ്രത്യക്ഷപ്പെടുന്നതിനെയോ, പരിശുദ്ധാത്മാവിലൂടെ വരുന്നതിനെയോ, ഭാവിയിൽ വീണ്ടും വരുന്നതിനെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് വാചകം ഇവയിൽ ഒന്നുമാത്രം നിർബന്ധിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: വിട്ടുകളയുകയില്ല
  rationale: ഇവിടെ ἀφίημι എന്ന ക്രിയയ്ക്ക് ‘പിന്നിൽ ഉപേക്ഷിക്കുക’ എന്ന അർഥമാണ്. ‘വിട്ടുകളയുക’ എന്നത് സന്ദർഭത്തിൽ സ്വാഭാവികവും അനാഥരെന്ന കുടുംബരൂപകത്തോട് യോജിച്ചതുമാണ്.
- source_word: ὀρφανούς
  choice: അനാഥരായി
  rationale: മാതാപിതാക്കളുടെ പരിപാലനമില്ലാത്ത മക്കൾ എന്ന മൂർത്തമായ കുടുംബരൂപകം നിലനിർത്തുന്നു; വെറും മാനസികമായ ഉപേക്ഷിക്കപ്പെടൽ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: ἔρχομαι
  choice: വരുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപത്തിന്റെ സജീവമായ സമീപഭാവി ഭാവം നിലനിർത്തുന്നു; ‘വരും’ എന്നു ലളിതഭാവിയാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കലേക്കു
  rationale: വ്യക്തികളിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ അർഥം സ്വാഭാവികവും അല്പം ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Οὐκ
  choice: ഇല്ല
  rationale: ഭാവിക്രിയയുടെ സാധാരണ നിഷേധം മലയാളത്തിൽ ‘വിട്ടുകളയുകയില്ല’ എന്ന ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘ഞാൻ നിങ്ങളുടെ അടുക്കലേക്കു വരുന്നു’ എന്നതിന്റെ സമയവും സൂചനയും
  choice: യേശു ഉയിർത്തെഴുന്നേറ്റശേഷം പ്രത്യക്ഷപ്പെടുന്നതാണോ, പരിശുദ്ധാത്മാവിലൂടെ വരുന്നതാണോ, ഭാവിയിലെ മടങ്ങിവരവാണോ എന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിക്കാതെ വിവർത്തനം ചെയ്തു.
  alternative: ഇവയിൽ ഏതെങ്കിലും ഒരു സംഭവത്തെ മാത്രം വ്യക്തമായി സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുക.
  rationale: അടുത്ത സന്ദർഭം ആത്മാവിനെക്കുറിച്ചുള്ള വാഗ്ദാനം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം യേശുവിന്റെ വ്യക്തിപരമായ വരവിനെയും സ്വാഭാവികമായി സൂചിപ്പിക്കാം. അതിനാൽ പാഠത്തിലെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിലും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെയും നൽകിയിരിക്കുന്നു. ‘അനാഥരായി’ എന്നത് മൂലത്തിലെ കുടുംബരൂപകം നേരിട്ട് നിലനിർത്തുന്നതിനാൽ വേറെ ശബ്ദപരമായ അടിക്കുറിപ്പ് ആവശ്യമില്ല. അടിക്കുറിപ്പിന്റെ ചിഹ്നം അതു വിശദീകരിക്കുന്ന രണ്ടാം ഉപവാക്യത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
