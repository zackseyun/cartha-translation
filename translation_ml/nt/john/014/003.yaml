id: JHN.14.3
reference: John 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: ml
  text: ഞാൻ പോയി നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കിയാൽ, ഞാൻ വീണ്ടും വരുന്നു[a][b], നിങ്ങളെ എന്റെ അടുക്കലേക്കു കൂട്ടിക്കൊള്ളും; ഞാൻ ഉള്ളിടത്ത് നിങ്ങളും ഉണ്ടായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ വീണ്ടും വരും.” ഗ്രീക്കിൽ വർത്തമാനരൂപത്തിലുള്ള ക്രിയയാണ് (“ഞാൻ വരുന്നു”) ഭാവിയർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ഞാൻ വീണ്ടും വരുന്നു” എന്നത് യേശുവിന്റെ അന്തിമ മടങ്ങിവരവിനെയോ, ഉയിർത്തെഴുന്നേറ്റശേഷമുള്ള പ്രത്യക്ഷതകളെയോ, പരിശുദ്ധാത്മാവിന്റെ വരവിനെയോ, ഇവയിൽ ഒന്നിലധികം ഉൾക്കൊള്ളുന്ന പലതലങ്ങളുള്ള വാഗ്ദത്തത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന കാര്യത്തിൽ വ്യാഖ്യാനങ്ങൾ വ്യത്യസ്തമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: ഞാൻ പോയി … ഒരുക്കിയാൽ
  rationale: ἐάν സഹിതമുള്ള aorist subjunctive ഭാവിയിലെ വ്യവസ്ഥ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സംയുക്ത വ്യവസ്ഥാരൂപം ഗ്രീക്കിലെ രണ്ടു ക്രിയകളെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കിയാൽ
  rationale: ἑτοιμάζω എന്നതിന്റെ ‘ഒരുക്കുക’ എന്ന നേരായ അർഥവും τόπος എന്നതിന്റെ ‘സ്ഥലം’ എന്ന അർഥവും അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: πάλιν ἔρχομαι
  choice: ഞാൻ വീണ്ടും വരുന്നു
  rationale: ἔρχομαι വർത്തമാനരൂപത്തിലാണെങ്കിലും സന്ദർഭത്തിൽ ഭാവിസൂചനയുണ്ട്. ‘വീണ്ടും വരുന്നു’ എന്നത് ആ രൂപത്തിന്റെ സജീവത നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ഭാവിയർഥമുള്ള മറ്റൊരു വിവർത്തനം നൽകുന്നു.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: നിങ്ങളെ എന്റെ അടുക്കലേക്കു ചേർത്തുകൊള്ളും
  rationale: παραλαμβάνω ഇവിടെ ഒരാളെ സ്വന്തം സാന്നിധ്യത്തിലേക്ക് സ്വീകരിച്ചു കൂടെക്കൊള്ളുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചേർത്തുകൊള്ളും’ ബന്ധപരമായ ഭാവം നൽകുകയും πρὸς ἐμαυτόν ‘എന്റെ അടുക്കലേക്ക്’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα
  choice: … ഉണ്ടായിരിക്കേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-േണ്ടതിന്’ എന്ന രൂപം ഉദ്ദേശ്യബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ഞാൻ ഇരിക്കുന്നിടത്ത്
  rationale: εἰμί എന്ന വർത്തമാനരൂപം നേരിട്ട് നിലനിർത്തുന്നു. ἐγώയുടെ ഊന്നൽ മലയാളത്തിലെ വ്യക്തമായ ‘ഞാൻ’ മുഖേന പ്രകടമാകുന്നു.
- source_word: καὶ ὑμεῖς ἦτε
  choice: നിങ്ങളും ഉണ്ടായിരിക്കേണ്ടതിന്
  rationale: καί എന്നത് ‘-ഉം’ ആയി പ്രതിഫലിക്കുന്നു. ἵναയ്ക്കു ശേഷമുള്ള subjunctive ലളിതഭാവിപ്രസ്താവനയാക്കാതെ ഉദ്ദേശ്യമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: πάλιν ἔρχομαι എന്ന യേശുവിന്റെ വാഗ്ദത്തത്തിന്റെ സ്വഭാവം
  choice: കൃത്യമായ രീതിയോ സമയമോ നിർണ്ണയിക്കാതെ ‘ഞാൻ വീണ്ടും വരുന്നു’ എന്ന ഭാവിമുഖമായ വാഗ്ദത്തമായി വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ഉയിർത്തെഴുന്നേറ്റശേഷമുള്ള പ്രത്യക്ഷതകളെയോ പരിശുദ്ധാത്മാവിന്റെ വരവിനെയോ അന്തിമമായ മടങ്ങിവരവിനെയോ, അല്ലെങ്കിൽ ഒന്നിലധികം നിറവേറലുകളുള്ള വാഗ്ദത്തത്തെയോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: വാക്യം യേശുവിന്റെ പുതുക്കപ്പെട്ട സാന്നിധ്യവും ശിഷ്യന്മാരെ തന്റെ അടുക്കൽ ചേർത്തുകൊള്ളുന്നതും വ്യക്തമായി വാഗ്ദാനം ചെയ്യുന്നു; എന്നാൽ വരവിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനവ്യത്യാസം മൂലപാഠം തന്നെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരമ്പരാഗത മതഭാഷയുടെ അമിതഭാരം ഒഴിവാക്കി; എന്നാൽ വാക്യത്തിന്റെ ഗൗരവവും ഗ്രീക്കിലെ വർത്തമാനരൂപത്തിന്റെ സജീവതയും ഉദ്ദേശ്യവാക്യത്തിന്റെ ഭാവവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
