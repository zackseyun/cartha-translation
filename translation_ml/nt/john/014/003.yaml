revisions:
- from: ഞാൻ പോയി നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കിയാൽ, ഞാൻ വീണ്ടും വരുന്നു[a]; ഞാൻ ഇരിക്കുന്നിടത്ത് നിങ്ങളും ഉണ്ടായിരിക്കേണ്ടതിന് നിങ്ങളെ എന്റെ അടുക്കലേക്കു ചേർത്തുകൊള്ളും.[b]
  to: ഞാൻ പോയി നിങ്ങൾക്കായി ഒരു സ്ഥലം ഒരുക്കിയാൽ, ഞാൻ വീണ്ടും വരുന്നു[a][b], നിങ്ങളെ എന്റെ അടുക്കലേക്കു കൂട്ടിക്കൊള്ളും; ഞാൻ ഉള്ളിടത്ത് നിങ്ങളും ഉണ്ടായിരിക്കേണ്ടതിന്.
  rationale: The revision corrects the overly specific “ഇരിക്കുന്നിടത്ത്” to the semantically neutral “ഉള്ളിടത്ത്,” and uses “എന്റെ അടുക്കലേക്കു കൂട്ടിക്കൊള്ളും” to express Jesus’ promised reception of the disciples into his presence. Footnote b is re-anchored to the phrase it explains. No interpretive decision is imposed concerning the nature or timing of the promised coming.
