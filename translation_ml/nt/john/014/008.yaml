id: JHN.14.8
reference: John 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: ml
  text: 'ഫിലിപ്പൊസ് അവനോടു പറഞ്ഞു: “കർത്താവേ, പിതാവിനെ ഞങ്ങൾക്കു കാണിച്ചുതരണമേ; അതു ഞങ്ങൾക്കു മതി.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പ്രഭോ, പിതാവിനെ ഞങ്ങൾക്കു കാണിച്ചുതരണമേ; അതു ഞങ്ങൾക്കു മതി.”'
    reason: κύριε എന്ന സംബോധനത്തിന് ‘പ്രഭോ’ എന്നതും സാധുവായ മലയാളപര്യായമാണ്.
lexical_decisions:
- source_word: Λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമായ ‘പറയുന്നു’ എന്നാണ്; എന്നാൽ ആധുനിക മലയാള ആഖ്യാനത്തിൽ സംഭാഷണം പരിചയപ്പെടുത്താൻ ഭൂതകാലരൂപമായ ‘പറഞ്ഞു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: αὐτῷ
  choice: അവനോടു
  rationale: സംസാരത്തിന്റെ പരോക്ഷകർമം സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി സർവനാമത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: Φίλιππος
  choice: ഫിലിപ്പോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ സംബോധനരൂപം. യോഹന്നാനിലെ ഈ സന്ദർഭത്തിൽ യേശുവിനോടുള്ള ആദരവും ക്രിസ്തുശാസ്ത്രപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: δεῖξον
  choice: കാണിച്ചുതരണമേ
  rationale: ദൃശ്യമായോ അറിവിലൂടെയോ അറിയിച്ചുതരാനുള്ള നേരിട്ടുള്ള അഭ്യർഥനയാണ്. ‘കാണിച്ചുതരണമേ’ ആജ്ഞാരൂപത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ആദരപൂർവമായ അപേക്ഷയായി സ്വാഭാവികമാണ്.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: ആർക്കാണ് കാണിച്ചുതരേണ്ടത് എന്നു സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ യേശുവിന്റെ പിതാവായ ദൈവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘പിതാവ്’ ഈ പ്രത്യേക ദൈവിക പരാമർശം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: καὶ
  choice: ;
  rationale: ആദ്യ അഭ്യർഥനയെയും അതിന്റെ മതിപ്പാകുന്ന ഫലത്തെയും ബന്ധിപ്പിക്കുന്ന καὶ-യുടെ ബന്ധം മലയാളത്തിൽ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; അർഥബന്ധം നിലനിൽക്കുന്നു.
- source_word: ἀρκεῖ
  choice: മതി
  rationale: ‘പര്യാപ്തമാണ്’ എന്ന അർഥം ലളിതവും ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങൾക്കു
  rationale: ആർക്കാണ് അത് മതിയാകുന്നതെന്ന് വ്യക്തമാക്കുന്ന ദത്തിവിഭക്തി; ‘ഞങ്ങൾക്കു മതി’ എന്നത് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: യേശുവിനെ സംബോധന ചെയ്യുന്ന κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ
  rationale: ‘കർത്താവേ’ എന്നത് ആദരപൂർവമായ സംബോധനയും യോഹന്നാന്റെ സുവിശേഷത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും ഒരുമിച്ച് നിലനിർത്തുന്നു. ‘യജമാനനേ’ ഇവിടെ അത്യന്തം ലൗകികമായി തോന്നാം; ‘പ്രഭോ’ സാധുവാണെങ്കിലും ഇന്നത്തെ സാധാരണ മലയാളത്തിൽ കുറച്ച് സാഹിത്യപരമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ‘കാണിച്ചുതരണമേ’ അപേക്ഷയുടെ ആദരഭാവം സൂക്ഷിക്കുന്നു; ‘മതി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ പര്യാപ്തതയുടെ അർഥം നിലനിർത്തുന്നു.
