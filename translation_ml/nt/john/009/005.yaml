- source_word: ὅταν ἐν τῷ κόσμῳ ὦ
  choice: ഞാൻ ലോകത്തിൽ ഉള്ളിടത്തോളം
  rationale: ὅταν സഹിതമുള്ള സബ്ജങ്ക്ടീവ് രൂപത്തിന്റെ കാലപരമായ അർഥം ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പകരുന്നു; ‘എപ്പോഴൊക്കെ’ എന്ന ആവർത്തനഭാവം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ, യേശു ലോകത്തിൽ ഉള്ള കാലയളവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: ഞാൻ ലോകത്തിന്റെ വെളിച്ചമാണ്
  rationale: ഉറവിടത്തിലെ രൂപകവും ഊന്നലുള്ള ‘ഞാൻ’ എന്ന കർത്താവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὅταν എന്ന പദത്തിന്റെ കാലപരമായ പരിധി
  choice: ഉള്ളിടത്തോളം
  alternative: ആയിരിക്കുമ്പോഴെല്ലാം
  rationale: വാക്യസന്ദർഭത്തിൽ യേശു ലോകത്തിൽ സന്നിഹിതനായിരിക്കുന്ന കാലത്തെ സൂചിപ്പിക്കുന്ന വായനയാണ് കൂടുതൽ സ്വാഭാവികം; എന്നാൽ മൂലരൂപത്തിലെ പൊതുവായ/അനിശ്ചിത കാലസൂചനയെ കടുത്ത സിദ്ധാന്തനിഗമനമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി; മൂലത്തിലെ സംക്ഷിപ്തതയും വെളിച്ചത്തിന്റെ രൂപകവും സംരക്ഷിച്ചു.
