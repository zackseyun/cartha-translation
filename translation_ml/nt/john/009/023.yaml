id: JHN.9.23
reference: John 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: ml
  text: 'അതുകൊണ്ടാണ് അവന്റെ മാതാപിതാക്കൾ പറഞ്ഞത്: “അവന് പ്രായമുണ്ട്[a]; അവനോടുതന്നെ ചോദിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവൻ മതിയായ പ്രായമുള്ളവനാണ്; അവനോടുതന്നെ ചോദ്യം ചെയ്യൂ.”'
    reason: Ἡλικίαν ἔχει എന്ന പ്രയോഗത്തിന്റെ ‘മതിയായ പ്രായം’ എന്ന സന്ദർഭാർഥവും ἐπερωτήσατε എന്നതിന് സാധ്യമായ ഔപചാരികമായ പദവിന്യാസവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ കാരണത്തിലേക്കു തിരിഞ്ഞുനോക്കുന്ന പ്രയോഗത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: അവന്റെ മാതാപിതാക്കൾ
  rationale: ആ മനുഷ്യന്റെ അപ്പനെയും അമ്മയെയും കൂട്ടായി സൂചിപ്പിക്കുന്ന ബഹുവചന നാമത്തിന് കൃത്യവും സ്വാഭാവികവുമായ തർജമ.
- source_word: εἶπαν
  choice: പറഞ്ഞത്
  rationale: പ്രത്യേകമായ മറുപടിയുടെയോ അറിയിപ്പിന്റെയോ ഭാവം അധികമായി ചേർക്കാതെ സാധാരണ സംസാരക്രിയയെ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἡλικίαν ἔχει
  choice: അവന് പ്രായപൂർത്തിയായി
  rationale: അക്ഷരാർഥത്തിൽ ‘പ്രായമുണ്ട്’ എന്നാണെങ്കിലും, ഇവിടെ സ്വന്തം കാര്യത്തിൽ ഉത്തരം പറയാൻ മതിയായ പ്രായമായിരിക്കുന്നു എന്ന സാമൂഹിക-നിയമപരമായ അർഥമാണ്. ‘പ്രായപൂർത്തിയായി’ അത് വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: αὐτὸν
  choice: അവനോടുതന്നെ
  rationale: അന്വേഷണം മാതാപിതാക്കളോടല്ല, ആ മനുഷ്യനോടുതന്നെ നടത്തണമെന്ന ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπερωτήσατε
  choice: ചോദിക്കൂ
  rationale: ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ചോദ്യംചെയ്യൂ’ എന്നതിനെക്കാൾ പൊതുവായതും സന്ദർഭോചിതവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിയിൽ നേരിട്ടുള്ള സംസാരത്തിന്റെ ലാളിത്യവും αὐτόν എന്ന സർവനാമത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
