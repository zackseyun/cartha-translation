  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄγουσιν αὐτὸν πρὸς τοὺς Φαρισαίους τόν ποτε τυφλόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: ml
  text: മുമ്പ് അന്ധനായിരുന്ന ആ മനുഷ്യനെ അവർ പരീശന്മാരുടെ അടുക്കൽ കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: അവർ ... കൊണ്ടുപോയി
  rationale: ഗ്രീക്കിൽ ഇത് ആഖ്യാനത്തിലെ ചരിത്രവർത്തമാനകാലമാണ്. സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലരൂപം യോജിക്കുന്നു; πρός സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കവും ‘കൊണ്ടുപോയി’ വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸν
  choice: ആ മനുഷ്യനെ
  rationale: പദശഃ ‘അവനെ’ എന്നാണെങ്കിലും, പിന്നാലെയുള്ള τόν ποτε τυφλόν എന്ന സമാനാധികരണ പ്രയോഗത്തോടു ചേർത്ത് വ്യക്തിയെ സ്വാഭാവികമായി തിരിച്ചറിയിക്കാൻ ‘ആ മനുഷ്യനെ’ എന്നു നൽകി.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: പരീശന്മാരുടെ അടുക്കൽ
  rationale: πρός + accusative ഇവിടെ വ്യക്തികളുടെ അടുത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ‘അടുക്കൽ’ എന്നത് അനാവശ്യമായി ഔദ്യോഗിക വിചാരണയുടെ അർഥം ചേർക്കാതെ ദിശയും ലക്ഷ്യവും നിലനിർത്തുന്നു.
- source_word: Φαρισαίους
  choice: പരീശന്മാർ
  rationale: മലയാള ബൈബിൾഭാഷയിലും പൊതുപ്രയോഗത്തിലും സ്ഥാപിതമായ സമൂഹനാമരൂപം.
- source_word: τόν ποτε τυφλόν
  choice: മുമ്പ് അന്ധനായിരുന്ന ആ മനുഷ്യനെ
  rationale: ഈ വിശേഷണപ്രയോഗം ‘മുമ്പ് അന്ധനായിരുന്നവൻ’ എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സൂചിതമായ വ്യക്തിയെ ‘മനുഷ്യൻ’ എന്നു വ്യക്തമാക്കി, മുൻകാല അവസ്ഥയും ഇപ്പോഴത്തെ മാറ്റവും സംരക്ഷിച്ചു.
- source_word: ποτε
  choice: മുമ്പ്
  rationale: ഇവിടെ ‘ഒരിക്കൽ’ എന്നതിലുപരി മുൻകാല അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മുമ്പ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τυφλόν
  choice: അന്ധനായിരുന്ന
  rationale: അവന്റെ മുൻകാല അന്ധതയെ സൂചിപ്പിക്കുന്ന വിശേഷണം; ποτε-യോടൊപ്പം ഭൂതകാലബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ ചരിത്രവർത്തമാനത്തെ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിനനുസരിച്ച് ഭൂതകാലത്തിൽ നൽകി. അർഥപരമായ യഥാർഥ ബദൽ ഇല്ലാത്തതിനാൽ ഇംഗ്ലീഷ് പതിപ്പിലെ പദക്രമഭേദത്തെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് മലയാളത്തിൽ ആവശ്യമില്ല.
