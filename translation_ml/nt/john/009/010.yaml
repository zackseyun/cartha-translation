id: JHN.9.10
reference: John 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട് ചോദിച്ചു: “നിന്റെ കണ്ണുകൾ എങ്ങനെയാണ് തുറക്കപ്പെട്ടത്[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ കണ്ണുകൾ എങ്ങനെ തുറക്കപ്പെട്ടു?” ഗ്രീക്ക് മൂലപാഠത്തിൽ കർമണിരൂപമാണ്.
    reason: മൂലപാഠത്തിലെ കർമണിരൂപം നിലനിർത്തുന്ന മറ്റൊരു സ്വാഭാവിക മലയാള പദക്രമം നൽകുന്നു.
lexical_decisions:
- source_word: ἔλεγον
  choice: ചോദിച്ചു
  rationale: ഇത് അപൂർണഭൂതകാലരൂപമാണെങ്കിലും, ഉദ്ധരിച്ചിരിക്കുന്നത് ഒരു ചോദ്യമായതിനാൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ ‘ചോദിച്ചു’ എന്നു നൽകി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നത് ഇവിടെ അസ്വാഭാവികമാകാം; ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ ആവർത്തനത്തിന് മൂലപാഠത്തേക്കാൾ അധിക ഊന്നൽ നൽകാം.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള തുടർച്ചയും അതിന്റെ ഫലമായുണ്ടായ ചോദ്യവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ സാധ്യമെങ്കിലും ഈ ആഖ്യാനത്തിൽ കൂടുതൽ കർക്കശമായി കേൾക്കും.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: സംസാരത്തിന്റെ പരോക്ഷകർമമായ ദത്തിവിഭക്തി സർവനാമത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: രീതിയെക്കുറിച്ചു ചോദിക്കുന്ന ചോദ്യാവ്യയത്തിന്റെ സ്വാഭാവിക മലയാളതുല്യം.
- source_word: ἠνεῴχθησάν
  choice: തുറക്കപ്പെട്ടു
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിരൂപം സംരക്ഷിക്കുന്നു; കണ്ണുകൾ സ്വയം തുറന്നു എന്നതിനേക്കാൾ അവ തുറക്കപ്പെട്ടു എന്ന മൂലപാഠത്തിലെ രൂപം നിലനിർത്തുന്നു.
- source_word: σου οἱ ὀφθαλμοί
  choice: നിന്റെ കണ്ണുകൾ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥബന്ധവും ബഹുവചനമായ ‘കണ്ണുകൾ’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ചോദ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി λέγω സന്ദർഭാനുസൃതമായി ‘ചോദിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി; ἠνεῴχθησάν എന്നതിലെ കർമണിരൂപം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
