id: JHN.9.14
reference: John 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: ml
  text: യേശു ചെളി[a] ഉണ്ടാക്കി ആ മനുഷ്യന്റെ കണ്ണുകൾ തുറന്ന[b] ദിവസം ഒരു ശബ്ബത്തുദിവസമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കളിമണ്ണ്.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ, ‘അവന്റെ കണ്ണുകൾ തുറന്നു’ എന്നത് സൗഖ്യപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: ഒരു ശബ്ബത്തുദിവസം
  rationale: സംഭവം ശബ്ബത്തുദിവസത്തിലാണ് നടന്നതെന്ന കലണ്ടർസംബന്ധമായ സൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നിയമവിവാദത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: … ദിവസം
  rationale: ഗ്രീക്കിലെ കാലസൂചകമായ ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവികമായ വിശേഷണവാക്യക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: πηλός
  choice: ചെളി
  rationale: ഉമിനീരും മണ്ണും ചേർത്തുണ്ടാക്കിയ വസ്തുവിന് സന്ദർഭത്തിൽ ഏറ്റവും സാധാരണവും സ്വാഭാവികവുമായ പദം; ‘കളിമണ്ണ്’ സാധ്യമായ മറ്റൊരു അർഥമാണ്.
- source_word: ἐποίησεν
  choice: ഉണ്ടാക്കി
  rationale: ποιέω എന്ന സാധാരണ ക്രിയയുടെ ലളിതമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀνέῳξεν
  choice: തുറന്നു
  rationale: യോഹന്നാന്റെ മൂർത്തമായ പ്രയോഗം നിലനിർത്തി, വ്യാഖ്യാനാത്മകമായ ‘കാഴ്ച നൽകി’ എന്നു മാറ്റുന്നില്ല.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: അവന്റെ കണ്ണുകൾ
  rationale: ശരീരഭാഗത്തെ നേരിട്ടുള്ള പരാമർശം നിലനിർത്തുന്നു; ‘അവന്റെ കാഴ്ച’ എന്ന അമൂർത്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മൃദുവായ ആഖ്യാനബന്ധം മലയാള വാക്യക്രമം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘എന്നാൽ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യഭാവം വരാം.
theological_decisions:
- issue: യേശുവിന്റെ സൗഖ്യപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട ശബ്ബത്ത് പരാമർശം
  choice: ശബ്ബത്തുദിവസം എന്ന കാലസൂചന മാത്രം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ശബ്ബത്തുനിയമത്തെയോ തുടർന്നുള്ള വിവാദത്തെയോ വിശദീകരിക്കുന്ന ഭാഷ ചേർക്കുക.
  rationale: വാക്യം തുടർന്നുള്ള സംഘർഷത്തിന് പശ്ചാത്തലം ഒരുക്കുന്ന ഒരു ആഖ്യാനവസ്തുതയാണ് നൽകുന്നത്; അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രമം പുനഃസംഘടിപ്പിച്ചു; മൂർത്തമായ ‘കണ്ണുകൾ തുറന്നു’ എന്ന പ്രയോഗം നിലനിർത്തി.
