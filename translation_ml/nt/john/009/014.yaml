  to: യേശു ചെളി[a] ഉണ്ടാക്കി ആ മനുഷ്യന്റെ കണ്ണുകൾ തുറന്ന[b] ദിവസം ഒരു ശബ്ബത്തുദിവസമായിരുന്നു.
