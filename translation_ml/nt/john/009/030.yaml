id: JHN.9.30
reference: John 9:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: ml
  text: 'ആ മനുഷ്യൻ അവരോടു മറുപടി പറഞ്ഞു: “ഇതാണല്ലോ അതിശയകരമായ കാര്യം[a]: അദ്ദേഹം എവിടെനിന്നുള്ളവനാണെന്ന്[b] നിങ്ങൾക്കറിയില്ല; എന്നിട്ടും അദ്ദേഹം എന്റെ കണ്ണുകൾ തുറന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആശ്ചര്യകരമായ കാര്യം.”
    reason: θαυμαστόν എന്ന പദം ‘അതിശയകരം,’ ‘ആശ്ചര്യകരം’ എന്നീ അടുത്ത അർഥങ്ങൾ വഹിക്കാം.
  - marker: b
    text: അഥവാ, “അദ്ദേഹം എവിടെനിന്നു വരുന്നു എന്ന്.”
    reason: πόθεν ἐστίν എന്നത് ഒരാളുടെ ഉറവിടമോ ഉത്ഭവമോ സൂചിപ്പിക്കുന്നതിനാൽ ഈ സ്വാഭാവിക പകരവിവർത്തനവും സാധ്യമാണ്.
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: ആ മനുഷ്യൻ അവരോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം പറഞ്ഞു, അവരോടു പറഞ്ഞു’ എന്ന സംഭാഷണസൂത്രം ആധുനിക മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു; ὁ ἄνθρωπος എന്നത് സന്ദർഭത്തിലെ സുഖംപ്രാപിച്ച പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: ഇതാണല്ലോ അതിശയകരമായ കാര്യം
  rationale: ἐν τούτῳ എന്നതിന്റെ ചൂണ്ടിക്കാണിക്കൽ ‘ഇതാണ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു. γάρ നൽകുന്ന വിശദീകരണാത്മകവും പരിഹാസസൂചകവുമായ ഊന്നൽ ‘അല്ലോ’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; θαυμαστόν എന്നത് ‘അതിശയകരമായ’ എന്ന് വിവർത്തനം ചെയ്തു.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: നിങ്ങൾക്കറിയില്ല
  rationale: οἶδα ഇവിടെ യേശുവിന്റെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള അറിവില്ലായ്മയാണ് സൂചിപ്പിക്കുന്നത്. വ്യക്തമായി വന്നിരിക്കുന്ന ὑμεῖς ‘നിങ്ങൾക്ക്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: πόθεν ἐστίν
  choice: അദ്ദേഹം എവിടെനിന്നുള്ളവനാണെന്ന്
  rationale: πόθεν വ്യക്തിയുടെ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ ചോദിക്കുന്നു. ഈ രൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: പദശഃ ‘കൂടാതെ/ഉം’ എന്നാണെങ്കിലും, മതനേതാക്കൾ അദ്ദേഹത്തിന്റെ ഉത്ഭവം അറിയുന്നില്ലെന്ന അവകാശവാദവും അദ്ദേഹം നടത്തിയ സൗഖ്യപ്പെടുത്തലും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സന്ദർഭത്തിൽ ഉള്ളതിനാൽ ‘എന്നിട്ടും’ അതിന്റെ പ്രസംഗബലം വ്യക്തമാക്കുന്നു.
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: അദ്ദേഹം എന്റെ കണ്ണുകൾ തുറന്നു
  rationale: ശാരീരിക സൗഖ്യത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗം അക്ഷരാർഥത്തിലും സ്വാഭാവികമായും നിലനിർത്തുന്നു; ആത്മീയ കാഴ്ചയുടെ പരോക്ഷധ്വനി വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാനിലെ ‘കണ്ണുകൾ തുറക്കുക’ എന്ന പ്രയോഗത്തിന്റെ ആത്മീയ പരോക്ഷധ്വനി
  choice: ശാരീരിക സൗഖ്യത്തെ സൂചിപ്പിക്കുന്ന ‘എന്റെ കണ്ണുകൾ തുറന്നു’ എന്ന മൂലപ്രയോഗം നിലനിർത്തുക
  alternative: ആത്മീയ ബോധോദയത്തെ മുൻനിർത്തുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്യുക
  rationale: ഉടൻ പ്രസക്തമായ അർഥം ജന്മനാ അന്ധനായിരുന്ന മനുഷ്യന്റെ ശാരീരിക സൗഖ്യമാണ്. ആത്മീയ കാഴ്ചയും അന്ധതയും സംബന്ധിച്ച യോഹന്നാന്റെ വിശാലമായ പ്രമേയം സന്ദർഭത്തിൽനിന്ന് ഉയർന്നുവരാൻ അനുവദിക്കുന്നു; അത് വിവർത്തനത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള സംഭാഷണശൈലി. ‘അദ്ദേഹം’ ആദരസൂചകമായി സ്വാഭാവികമാണ്; വാക്യത്തിലെ പരിഹാസവും വൈരുധ്യവും ‘അല്ലോ,’ ‘എന്നിട്ടും’ എന്നിവയിലൂടെ അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
