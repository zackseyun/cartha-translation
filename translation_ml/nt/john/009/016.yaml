  to: 'അതുകൊണ്ട് പരീശന്മാരിൽ ചിലർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഈ മനുഷ്യൻ ദൈവത്തിൽനിന്നുള്ളവനല്ല; കാരണം, അവൻ ശബ്ബത്ത് ആചരിക്കുന്നില്ല.” എന്നാൽ മറ്റുള്ളവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “പാപിയായ ഒരു മനുഷ്യന്[a] ഇത്തരം അടയാളങ്ങൾ[b] ചെയ്യാൻ എങ്ങനെ കഴിയും?” അങ്ങനെ അവർക്കിടയിൽ ഭിന്നത ഉണ്ടായിരുന്നു.'
