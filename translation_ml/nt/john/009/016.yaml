id: JHN.9.16
reference: John 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: ml
  text: 'അതുകൊണ്ട് പരീശന്മാരിൽ ചിലർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഈ മനുഷ്യൻ ദൈവത്തിൽനിന്നുള്ളവനല്ല; കാരണം, അവൻ ശബ്ബത്ത് ആചരിക്കുന്നില്ല.” എന്നാൽ മറ്റുള്ളവർ പറഞ്ഞുകൊണ്ടിരുന്നു: “പാപിയായ ഒരു മനുഷ്യന്[a] ഇത്തരം അടയാളങ്ങൾ[b] ചെയ്യാൻ എങ്ങനെ കഴിയും?” അങ്ങനെ അവർക്കിടയിൽ ഭിന്നത ഉണ്ടായിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു പാപിക്ക്.’ ഗ്രീക്കിൽ ‘പാപിയായ’ എന്ന വിശേഷണം ‘മനുഷ്യൻ’ എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യേശുവിന്റെ പ്രവൃത്തികളുടെ വെളിപ്പെടുത്തുന്ന അർഥം ഊന്നിക്കാട്ടാൻ യോഹന്നാൻ പലപ്പോഴും ‘അടയാളങ്ങൾ’ എന്ന പദം ഉപയോഗിക്കുന്നു. ‘അത്ഭുതകരമായ അടയാളങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: ചിലർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപമായ ἔλεγον രംഗത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ആ ക്രിയാഭാവം നിലനിർത്തുന്നു. τινές എന്നതിന് സ്വാഭാവികമായ മലയാളം ‘ചിലർ’ എന്നാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള തുടർച്ചയോ നിഗമനബന്ധമോ οὖν സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘അതുകൊണ്ട്’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν Φαρισαίων
  choice: പരീശന്മാരിൽ ചിലർ
  rationale: പരീശന്മാരുടെ കൂട്ടത്തിൽനിന്നുള്ള ഒരു വിഭാഗത്തെയാണ് ഈ പ്രയോഗം തിരിച്ചറിയിക്കുന്നത്; മലയാളത്തിൽ ഈ ഘടന സ്വാഭാവികമാണ്.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: ഈ മനുഷ്യൻ
  rationale: പുരുഷനായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെയും ചൂണ്ടിക്കാട്ടുന്ന ഭാവത്തെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παρὰ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവൻ
  rationale: ഉത്ഭവമോ ഉറവിടമോ എന്ന അർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘ദൈവം അയച്ചവൻ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τηρεῖ
  choice: ആചരിക്കുന്നില്ല
  rationale: ശബ്ബത്തിനോടൊപ്പം ‘ആചരിക്കുക’ എന്നത് കല്പനാനുഷ്ഠാനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸ σάββατον
  choice: ശബ്ബത്ത്
  rationale: യഹൂദരുടെ വിശ്രമദിനത്തിനുള്ള നിലവാരമുള്ള മലയാള പദം.
- source_word: ἄλλοι ἔλεγον
  choice: മറ്റുള്ളവർ പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: വിരുദ്ധനിലപാടുള്ള മറ്റൊരു വിഭാഗത്തെ ἄλλοι സൂചിപ്പിക്കുന്നു; ആവർത്തിക്കുന്ന ἔλεγον എന്ന അപൂർണഭൂതകാലത്തിന്റെ ക്രിയാഭാവവും നിലനിർത്തുന്നു.
- source_word: Πῶς δύναται
  choice: എങ്ങനെ കഴിയും?
  rationale: കഴിവിനെയോ സാധ്യതയെയോ ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: പാപിയായ ഒരു മനുഷ്യൻ
  rationale: ἁμαρτωλός എന്ന വിശേഷണം ἄνθρωπος എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοιαῦτα σημεῖα
  choice: ഇത്തരം അടയാളങ്ങൾ
  rationale: τοιαῦτα എന്നതിന് ‘ഇത്തരം’ എന്നും σημεῖα എന്നതിന് ‘അടയാളങ്ങൾ’ എന്നും നൽകി, യോഹന്നാനിലെ വെളിപ്പെടുത്തൽസൂചനയുള്ള പദം ‘അത്ഭുതങ്ങൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: σχίσμα
  choice: ഭിന്നത
  rationale: കൂട്ടത്തിനകത്തെ വിഭജനത്തെയും അഭിപ്രായഭേദത്തെയും dignified, natural Malayalam-ൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ σημεῖα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടയാളങ്ങൾ
  alternative: അത്ഭുതങ്ങൾ / അത്ഭുതകരമായ അടയാളങ്ങൾ
  rationale: യേശുവിന്റെ പ്രവൃത്തികൾ അവയുടെ അത്ഭുതസ്വഭാവത്തിനപ്പുറം വെളിപ്പെടുത്തുന്ന അർഥത്തിലേക്കു ചൂണ്ടുന്നതായി യോഹന്നാൻ പതിവായി σημεῖα ഉപയോഗിക്കുന്നു. ‘അടയാളങ്ങൾ’ ആ ദൈവശാസ്ത്രപരമായ ഭാരം അധികവാക്കുകൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: യേശു ‘ദൈവത്തിൽനിന്നുള്ളവൻ’ എന്ന പ്രസ്താവന
  choice: ദൈവത്തിൽനിന്നുള്ളവൻ
  alternative: ദൈവം അയച്ചവൻ
  rationale: παρὰ θεοῦ ഉറവിടത്തെയോ ദൈവിക അംഗീകാരത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും ‘അയച്ചവൻ’ എന്ന പ്രത്യേക ദൗത്യഭാഷ ഇവിടെ വ്യക്തമല്ല. തിരഞ്ഞെടുത്ത രൂപം ആ ഉദ്ദേശ്യപൂർവമായ വീതി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപാരായണത്തിന് യോജിച്ചതുമായ മാന്യമായ മലയാളം. ‘ദൈവത്തിൽനിന്നുള്ളവൻ,’ ‘ശബ്ബത്ത് ആചരിക്കുക,’ ‘അടയാളങ്ങൾ’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ആശയവ്യാപ്തിയും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു. അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു തൊട്ടുപിന്നാലെ നൽകിയിരിക്കുന്നു.
