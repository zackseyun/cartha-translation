translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭിക്ഷക്കാരൻ’ എന്നതിനു പകരം വ്യക്തിയെ അപമാനിക്കാത്ത ‘യാചകൻ’ ഉപയോഗിച്ചു; ചോദ്യത്തിൽ സംസാരഭാഷയുടെ സ്വാഭാവികതയും മൂലത്തിലെ തിരിച്ചറിയൽഭാവവും നിലനിർത്തി.
