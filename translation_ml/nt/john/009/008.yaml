source:
  edition: SBLGNT
  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: ml
  text: 'അപ്പോൾ അയൽക്കാരും മുമ്പ് അവനെ യാചകനായി കണ്ടിരുന്നവരും ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇരുന്ന് യാചിക്കാറുണ്ടായിരുന്നത്[a] ഇയാൾ തന്നെയല്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഇരുന്നും യാചിച്ചും ഇരുന്നവൻ ഇയാൾ തന്നെയല്ലേ?” ഗ്രീക്കിലെ ‘ഇരിക്കുന്നവൻ’, ‘യാചിക്കുന്നവൻ’ എന്ന വർത്തമാന കൃദ്‌രൂപങ്ങൾ, അവന്റെ പതിവായ മുൻപ്രവൃത്തിയാൽ അവനെ തിരിച്ചറിയിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭവത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ ശക്തമായ നിഗമനാർഥം നിർബന്ധമല്ല.
- source_word: γείτονες
  choice: അയൽക്കാർ
  rationale: അവന്റെ സമീപത്ത് താമസിച്ചിരുന്നവരെ നേരിട്ടും സാധാരണ മലയാളത്തിലും സൂചിപ്പിക്കുന്നു.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: മുമ്പ് അവനെ ... കണ്ടിരുന്നവർ
  rationale: മുൻകാലത്ത് അവനെ കണ്ടും തിരിച്ചറിഞ്ഞും വന്നിരുന്നുവെന്ന പശ്ചാത്തലവും പങ്കാളിക്രിയയുടെ തുടർച്ചാഭാവവും നൽകുന്നു.
- source_word: ὅτι προσαίτης ἦν
  choice: യാചകനായി
  rationale: ὅτιയുടെ കൃത്യബന്ധം അല്പം അസ്പഷ്ടമാണ്; മലയാളത്തിൽ ‘യാചകനായി കണ്ടിരുന്നവർ’ എന്നു പറയുന്നത് അനാവശ്യമായ കാരണാർഥം ചുമത്താതെ അവന്റെ മുൻപരിചിതമായ നില വ്യക്തമാക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടരുന്നതോ പലരിലായി ആവർത്തിക്കുന്നതോ ആയ സംസാരഭാവം നിലനിർത്തുന്നു.
- source_word: Οὐχ οὗτός ἐστιν
  choice: ഇയാൾ തന്നെയല്ലേ?
  rationale: അനുകൂലമായ ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്നതെന്ന ഗ്രീക്ക് ചോദ്യത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: ഇരുന്ന് യാചിക്കാറുണ്ടായിരുന്നത്
  rationale: രണ്ട് പങ്കാളിക്രിയകളും അവനെ തിരിച്ചറിയിച്ചിരുന്ന പതിവായ മുൻപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി.
