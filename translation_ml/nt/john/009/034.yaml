id: JHN.9.34
reference: John 9:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: ml
  text: 'അവർ അവനോടു മറുപടിയായി പറഞ്ഞു: “നീ പൂർണമായും പാപങ്ങളിൽ ജനിച്ചവൻ; എന്നിട്ടും നീ ഞങ്ങളെ പഠിപ്പിക്കുന്നുവോ?” തുടർന്ന് അവർ അവനെ പുറത്താക്കി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവർ അവനെ പുറത്താക്കി” എന്നത് അവരുടെ സന്നിധിയിൽനിന്ന് നീക്കിയതിനെ സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ, സിനഗോഗ് സമൂഹത്തിൽനിന്നുള്ള ബഹിഷ്കരണവും ഇതിൽ സൂചിതമായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: അവർ അവനോടു മറുപടിയായി പറഞ്ഞു
  rationale: യോഹന്നാന്റെ ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ ഊന്നൽ പൂർണമായി നഷ്ടപ്പെടുത്താതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἐν ἁμαρτίαις
  choice: പാപങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തി കുറ്റാരോപണത്തിന്റെ രൂക്ഷത സംരക്ഷിക്കുന്നു; അതിനെ ‘പാപത്തിൽ’ എന്ന ഏകവചനമോ ‘പാപി’ എന്ന വ്യാഖ്യാനമോ ആക്കുന്നില്ല.
- source_word: ἐγεννήθης ὅλος
  choice: നീ പൂർണമായും ... ജനിച്ചവൻ
  rationale: ὅλος നൽകുന്ന സമഗ്രതയുടെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: എന്നിട്ടും നീ ഞങ്ങളെ പഠിപ്പിക്കുന്നുവോ?
  rationale: ഊന്നലുള്ള σὺയും നിന്ദാഭാവമുള്ള ആലങ്കാരിക ചോദ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: അവർ അവനെ പുറത്താക്കി
  rationale: ശത്രുതാപരമായ പുറത്താക്കൽ വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളം; കൃത്യമായ സ്ഥാപനപരമായ നടപടിയെന്ന് നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ജന്മനാ അന്ധനായ മനുഷ്യൻ ‘പാപങ്ങളിൽ ജനിച്ചു’ എന്ന കുറ്റാരോപണത്തിന്റെ അർഥം
  choice: പ്രസംഗകരുടെ നിന്ദാപരമായ കുറ്റാരോപണം അതിന്റെ ബഹുവചനത്തോടെയും അവ്യക്തതയോടെയും നിലനിർത്തി.
  alternative: ‘നീ പാപത്തിൽ ജനിച്ചു’, ‘നീ ജന്മനാ മുഴുവൻ പാപിയാണ്’, അല്ലെങ്കിൽ ‘മാതാപിതാക്കളുടെ പാപദോഷത്തിൽ ജനിച്ചു’.
  rationale: ഗ്രീക്ക് വാക്യം ഈ ആരോപണത്തെ രേഖപ്പെടുത്തുന്നുവെങ്കിലും സ്വന്തം പാപമോ പാരമ്പര്യപാപമോ മാതാപിതാക്കളുടെ പാപമോ എന്നത് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക ഉപദേശം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἐξέβαλον എന്നത് സന്നിധിയിൽനിന്നുള്ള പുറത്താക്കലോ സിനഗോഗ് സമൂഹത്തിൽനിന്നുള്ള ബഹിഷ്കരണമോ
  choice: ‘പുറത്താക്കി’ എന്ന് പരിഭാഷപ്പെടുത്തി, സന്ദർഭത്തിലെ സാധ്യത തുറന്നുവെച്ചു.
  alternative: ‘സിനഗോഗിൽനിന്ന് ബഹിഷ്കരിച്ചു’.
  rationale: ഉടൻ സംഭവിച്ച പുറത്താക്കലും സമൂഹപരമായ ബഹിഷ്കരണസൂചനയും രണ്ടും സന്ദർഭത്തിൽ സാധ്യമാണ്; മൂലവാക്യം സ്ഥാപനപരമായ അർഥം നേരിട്ട് വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. കുറ്റാരോപണത്തിന്റെ രൂക്ഷത നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി പുരാതനമോ സമുദായവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
