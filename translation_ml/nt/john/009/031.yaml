id: JHN.9.31
reference: John 9:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: ml
  text: ദൈവം പാപികളെ കേൾക്കുന്നില്ലെന്ന് നമുക്കറിയാം. എന്നാൽ, ഒരാൾ ദൈവഭക്തനായിരിക്കുകയും അവിടുത്തെ ഇഷ്ടം നിറവേറ്റുകയും ചെയ്യുന്നെങ്കിൽ, ദൈവം അവനെ കേൾക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെ ആരാധിക്കുന്നവനായ.”
    reason: θεοσεβής എന്ന വിശേഷണത്തിന്റെ സാധ്യമായ lexical alternative.
lexical_decisions:
- source_word: οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: οἶδα എന്ന പൂർണരൂപം കൊയ്നേ ഗ്രീക്കിൽ വർത്തമാനാർഥത്തിൽ പ്രവർത്തിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമതുല്യം ‘നമുക്കറിയാം’ ആണ്.
- source_word: ἁμαρτωλῶν
  choice: പാപികളുടെ
  rationale: ജനിറ്റീവ് ബഹുവചനം ἀκούει എന്ന ക്രിയയോടൊപ്പം ഇവിടെ പരിഗണിക്കുന്ന ആളുകളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘പാപികൾ’ ധാർമിക-മതപരമായ ശക്തി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀκούει
  choice: അപേക്ഷ കേൾക്കുന്നു
  rationale: വ്യക്തിയെ ജനിറ്റീവായി സ്വീകരിക്കുന്ന ἀκούω ഇവിടെ വെറും ശബ്ദഗ്രഹണമല്ല, അനുകൂലമായി ചെവിക്കൊടുക്കുകയോ പ്രതികരിക്കുകയോ ചെയ്യുന്നതാണ്. മലയാളത്തിൽ ‘അപേക്ഷ കേൾക്കുന്നു’ ആ സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ഉത്തരം നൽകുന്നു’ എന്നതുവരെ അതിനെ അതിവ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: θεοσεβὴς
  choice: ദൈവഭക്തനായ
  rationale: θεοσεβής ദൈവത്തെ ഭയഭക്തിയോടെ ആദരിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു. ‘ദൈവഭക്തൻ’ ദൈവത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശവും വിശാലമായ ഭക്ത്യാദരാർഥവും നിലനിർത്തുന്നു.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: അവിടുത്തെ ഇഷ്ടം നിറവേറ്റുന്നു
  rationale: ποιεῖν τὸ θέλημα എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം; ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു.
- source_word: τούτου ἀκούει
  choice: അവന്റെ അപേക്ഷ ദൈവം കേൾക്കുന്നു
  rationale: τούτου മുൻപറഞ്ഞ ദൈവഭക്തനായ വ്യക്തിയിലേക്കു ഊന്നലോടെ തിരിച്ചുചൂണ്ടുന്നു. മലയാളത്തിൽ പരാമർശം വ്യക്തമാക്കാൻ ‘ദൈവം’ ആവർത്തിക്കുകയും ആദ്യ ἀκούει-നോടുള്ള അർഥസാമ്യം നിലനിർത്തുകയും ചെയ്തു.
- source_word: ἀλλ’ ἐάν τις
  choice: എന്നാൽ ഒരാൾ … ചെയ്യുന്നെങ്കിൽ
  rationale: വിരുദ്ധമായ വ്യവസ്ഥാവാക്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും അനിശ്ചിത ഏകവചനത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ദൈവം പാപികളുടെ അപേക്ഷ കേൾക്കുന്നില്ല’ എന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: സംസാരിക്കുന്നയാളുടെ പ്രസ്താവനയുടെ ശക്തി കുറയ്ക്കാതെയും അതിനെ സമഗ്രമായ സിദ്ധാന്തപ്രസ്താവനയാക്കി വികസിപ്പിക്കാതെയും അതേപടി അവതരിപ്പിച്ചു.
  alternative: ‘ദൈവം പാപികളുടെ പ്രാർഥനയ്ക്ക് ഉത്തരം നൽകുന്നില്ല’ അല്ലെങ്കിൽ ‘ദൈവം പാപികളെ അംഗീകരിക്കുന്നില്ല.’
  rationale: ഗ്രീക്ക് പാഠം ദൈവം പാപികളെ ‘കേൾക്കുന്നില്ല’ എന്നാണ് പറയുന്നത്; ദൈവഭക്തനും ദൈവഹിതം ചെയ്യുന്നവനുമായ വ്യക്തിയെ കേൾക്കുന്നതുമായി അത് വിരുദ്ധമായി നിൽക്കുന്നു. ‘അപേക്ഷ’ ചേർക്കുന്നത് മലയാളത്തിൽ ഉദ്ദേശിച്ച ശ്രവണ-പ്രതികരണാർഥം വ്യക്തമാക്കുന്നു; എന്നാൽ എല്ലാ സാഹചര്യങ്ങളെയും കുറിച്ചുള്ള സിദ്ധാന്തപരമായ നിഗമനം ചേർക്കുന്നില്ല.
- issue: θεοσεβής എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവഭക്തനായ
  alternative: ദൈവത്തെ ആരാധിക്കുന്നവൻ
  rationale: ഈ വിശേഷണം ആരാധനാക്രിയയിൽ മാത്രം ഒതുങ്ങാതെ ദൈവത്തോടുള്ള ഭയഭക്തിയെയും ആദരവിനെയും സൂചിപ്പിക്കുന്നു. മറ്റൊരു സാധുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളം; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടുത്തെ’ ഉപയോഗിച്ചു. ἀκούει-യുടെ സന്ദർഭാർഥം വെറും ശ്രവണത്തിൽ ഒതുങ്ങാതിരിക്കാനായി ‘അപേക്ഷ കേൾക്കുന്നു’ എന്നു നൽകി; ‘ഉത്തരം നൽകുന്നു’ എന്ന ശക്തമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
