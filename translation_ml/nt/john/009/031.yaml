- from: ദൈവം പാപികളുടെ അപേക്ഷ കേൾക്കുന്നില്ലെന്ന് നമുക്കറിയാം. എന്നാൽ ഒരാൾ ദൈവഭക്തനായിരിക്കുകയും അവിടുത്തെ ഇഷ്ടം നിറവേറ്റുകയും ചെയ്യുന്നെങ്കിൽ, അവന്റെ അപേക്ഷ ദൈവം കേൾക്കുന്നു.[a]
