translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഉദ്ധരണിക്കുള്ളിലെ സമാന്തരമായ രണ്ട് ὅτι ഉപവാക്യങ്ങൾ ‘എന്നും ... എന്നും’ എന്ന ഘടനയിൽ നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചിക അതുമായി ബന്ധപ്പെട്ട ‘അന്ധനായി ജനിച്ചു’ എന്ന പ്രയോഗത്തിനരികിൽ ചേർത്തു.
