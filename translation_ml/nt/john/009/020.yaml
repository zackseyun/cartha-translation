source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: ml
  text: 'അപ്പോൾ അവന്റെ മാതാപിതാക്കൾ മറുപടിയായി പറഞ്ഞു: “ഇവൻ ഞങ്ങളുടെ മകനാണെന്നും ഇവൻ അന്ധനായി ജനിച്ചുവെന്നും[a] ഞങ്ങൾക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനനംമുതൽ അന്ധനായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ ചോദ്യംചെയ്യലിനെ തുടർന്നുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: ആ മനുഷ്യന്റെ അച്ഛനെയും അമ്മയെയും കൂട്ടായി സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെയും മറുപടി നൽകുക, പറയുക എന്നീ ഘടകങ്ങൾ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Οἴδαμεν
  choice: ഞങ്ങൾക്കറിയാം
  rationale: മാതാപിതാക്കൾ സാക്ഷ്യപ്പെടുത്തുന്ന ഉറച്ച അറിവിനെ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: ഇവൻ ഞങ്ങളുടെ മകനാണ്
  rationale: οὗτος എന്ന സമീപസൂചകത്തിന്റെ തിരിച്ചറിയൽശക്തി ‘ഇവൻ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: τυφλὸς
  choice: അന്ധനായി
  rationale: ജനനസമയത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്ന വിധത്തിൽ predicate adjective സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐγεννήθη
  choice: ജനിച്ചു
  rationale: ജനനസന്ദർഭത്തിലെ γεννάω എന്ന ക്രിയയുടെ aorist passive രൂപത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ തത്തുല്യം.
- source_word: τυφλὸς ἐγεννήθη
  choice: അന്ധനായി ജനിച്ചു
  rationale: ഗ്രീക്കിലെ പദക്രമവും അർത്ഥവും നേരിട്ട്, വ്യക്തമായി നിലനിർത്തുന്ന മലയാളപ്രയോഗം.
