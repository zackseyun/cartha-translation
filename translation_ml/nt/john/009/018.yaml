  revised_text: അതുകൊണ്ട്, കാഴ്ച ലഭിച്ചവന്റെ മാതാപിതാക്കളെ അവർ വിളിച്ചുവരുത്തുന്നതുവരെ, അവൻ അന്ധനായിരുന്നു എന്നും കാഴ്ച ലഭിച്ചു എന്നും യെഹൂദന്മാർ വിശ്വസിച്ചില്ല[a].
