id: JHN.9.18
reference: John 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: ml
  text: അതുകൊണ്ട്, കാഴ്ച ലഭിച്ചവന്റെ മാതാപിതാക്കളെ അവർ വിളിച്ചുവരുത്തുന്നതുവരെ, അവൻ അന്ധനായിരുന്നു എന്നും കാഴ്ച ലഭിച്ചു എന്നും യെഹൂദന്മാർ വിശ്വസിച്ചില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, സന്ദർഭത്തിൽ യോഹന്നാൻ ‘യെഹൂദന്മാർ’ എന്ന പദം എങ്ങനെ ഉപയോഗിക്കുന്നു എന്നതനുസരിച്ച്, ‘യെഹൂദ നേതാക്കൾ’ എന്നോ ‘യെഹൂദ്യർ’ എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചില്ല
  rationale: ὅτι എന്ന ഉള്ളടക്കവാക്യത്തോടുകൂടെ ഇവിടെ ഒരു വാദം സത്യമാണെന്ന് അംഗീകരിക്കാതിരിക്കുക എന്ന അർഥമാണ്; അതിനാൽ ‘വിശ്വസിച്ചില്ല’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. യോഹന്നാനിലെ സന്ദർഭാനുസൃതമായ സാദ്ധ്യമായ പരിമിത അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവൻ … എന്നും
  rationale: മലയാളത്തിൽ ‘അവനെക്കുറിച്ച്, അവൻ…’ എന്ന ഭാരമുള്ള ഘടന ഒഴിവാക്കി, വ്യക്തിയെ സംബന്ധിച്ച അവകാശവാദം സ്വാഭാവികമായ ഉള്ളടക്കവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἦν τυφλὸς
  choice: അവൻ അന്ധനായിരുന്നു
  rationale: ἦν എന്ന ഭൂതകാലാവസ്ഥ നേരിട്ട് നൽകുന്നു; രോഗശാന്തിക്ക് മുമ്പുണ്ടായിരുന്ന അവസ്ഥ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἀνέβλεψεν
  choice: കാഴ്ച ലഭിച്ചു
  rationale: സൗഖ്യദാനസന്ദർഭത്തിൽ ἀναβλέπω കാഴ്ച പ്രാപിക്കുക എന്നതാണ്; ‘കാഴ്ച തിരിച്ചുകിട്ടി’ എന്നു പറഞ്ഞാൽ മുമ്പ് കാഴ്ചയുണ്ടായിരുന്നുവെന്ന അനാവശ്യ സൂചന വരാം.
- source_word: ἕως ὅτου
  choice: …വരെ
  rationale: പ്രവർത്തിയുടെ സമയപരിധി വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐφώνησαν
  choice: വിളിച്ചുവരുത്തി
  rationale: ഇവിടെ ചോദ്യം ചെയ്യാനായി മാതാപിതാക്കളെ വരുത്തുന്ന അർഥം ‘വിളിച്ചുവരുത്തി’ വ്യക്തമായി നൽകുന്നു; വെറും ‘വിളിച്ചു’ എന്നതിലെ ദ്വയാർഥത ഒഴിവാക്കുന്നു.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: γονεῖς എന്ന ബഹുവചന നാമത്തിന്റെ കൃത്യവും സാധാരണവുമായ മലയാളസമാനം.
- source_word: τοῦ ἀναβλέψαντος
  choice: കാഴ്ച ലഭിച്ചവന്റെ
  rationale: ആർട്ടിക്കുലർ പാർട്ടിസിപ്പിളിന്റെ തിരിച്ചറിയൽശക്തി നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ എന്ന പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചിതർ
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദനേതാക്കൾ / യെഹൂദ്യർ
  rationale: മൂലപാഠത്തിലെ വിശാലമായ പദം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സന്ദർഭം അനുവദിക്കുന്ന പരിമിത സൂചനകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇതിലൂടെ ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതെ യഥാർഥമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവർത്തനം. ഗ്രീക്ക് വാക്യത്തിന്റെ അന്വേഷണപരമായ സന്ദർഭവും οἱ Ἰουδαῖοι എന്നതിലെ വ്യാഖ്യാനസാദ്ധ്യതയും നിലനിർത്തിയിരിക്കുന്നു.
