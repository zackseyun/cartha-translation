id: JHN.9.25
reference: John 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: ml
  text: 'അപ്പോൾ ആ മനുഷ്യൻ മറുപടി പറഞ്ഞു: “അവൻ പാപിയാണോ എന്ന് എനിക്കറിയില്ല.[a] ഒരു കാര്യം എനിക്കറിയാം: ഞാൻ അന്ധനായിരുന്നു; ഇപ്പോൾ ഞാൻ കാണുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ പാപിയാണെങ്കിൽ, എനിക്കറിയില്ല.”
    reason: εἰ എന്ന പദത്തിന് ഇവിടെ പരോക്ഷചോദ്യമായ ‘ആണോ എന്ന്’ എന്ന അർഥത്തോടൊപ്പം കൂടുതൽ പദാനുപദമായ സോപാധികരൂപവും സാധ്യമാണ്.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: യോഹന്നാനിലെ സംഭാഷണവിവരണത്തിന് സ്വാഭാവികവും നേരിട്ടുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻ സംഭാഷണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ഇവിടെ കർശനമായ കാരണനിഗമനം ആരോപിക്കാതെ സ്വാഭാവികമായ ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: ആ മനുഷ്യൻ
  rationale: മുമ്പ് അന്ധനായിരുന്ന മനുഷ്യനിലേക്കുള്ള ഗ്രീക്കിലെ പ്രകടമായ സൂചന സംരക്ഷിക്കുന്നു.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: അവൻ പാപിയാണോ എന്ന്
  rationale: അറിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയയോടു ചേർന്ന പരോക്ഷചോദ്യമായി εἰയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; സോപാധിക അർഥം അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
- source_word: οὐκ οἶδα
  choice: എനിക്കറിയില്ല
  rationale: വർത്തമാനാർഥമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: ἓν οἶδα
  choice: ഒരു കാര്യം എനിക്കറിയാം
  rationale: മുൻപത്തെ ‘എനിക്കറിയില്ല’ എന്നതിനോടുള്ള ഊന്നിയ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: τυφλὸς ὢν
  choice: ഞാൻ അന്ധനായിരുന്നു
  rationale: മനുഷ്യന്റെ മുൻകാല അവസ്ഥയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἄρτι βλέπω
  choice: ഇപ്പോൾ ഞാൻ കാണുന്നു
  rationale: മുൻകാല അന്ധതയും ഇപ്പോഴത്തെ കാഴ്ചയും തമ്മിലുള്ള ശക്തമായ കാലവൈരുധ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യേശു പാപിയാണെന്ന ആരോപണത്തെക്കുറിച്ചുള്ള സൗഖ്യം പ്രാപിച്ച മനുഷ്യന്റെ പരിമിതമായ അറിവ്
  choice: അവൻ പാപിയാണോ എന്ന് എനിക്കറിയില്ല
  alternative: അവൻ പാപിയാണെങ്കിൽ, എനിക്കറിയില്ല
  rationale: ഇത് സംസാരിക്കുന്ന മനുഷ്യന്റെ അറിവിന്റെ പരിധിയാണ് രേഖപ്പെടുത്തുന്നത്; യേശുവിനെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ അന്തിമ ദൈവശാസ്ത്രവിധിയായി മാറ്റുന്നില്ല. ‘ആണോ എന്ന്’ എന്ന രൂപം അവന്റെ അനിശ്ചിത പ്രതികരണം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ സംഭാഷണശൈലി. ചുരുക്കവും സാക്ഷ്യത്തിന്റെ ഊന്നലും നിലനിർത്താൻ അവസാന രണ്ടു അവസ്ഥകൾ അർധവിരാമംകൊണ്ട് വേർതിരിച്ചു.
