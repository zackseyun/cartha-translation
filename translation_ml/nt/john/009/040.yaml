source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: ml
  text: 'അവനോടുകൂടെ ഉണ്ടായിരുന്ന പരീശന്മാരിൽ ചിലർ ഈ കാര്യങ്ങൾ കേട്ട് അവനോട് പറഞ്ഞു: “ഞങ്ങളും അന്ധരല്ലല്ലോ, അല്ലേ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളും അന്ധരല്ല, അല്ലേ?” ഗ്രീക്കിലെ ചോദ്യം ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന രീതിയിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: കേട്ട്
  rationale: ആഖ്യാനസന്ദർഭത്തിൽ യേശു പറഞ്ഞതു അവർ കേട്ടു എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; മലയാളവാക്യത്തിൽ തുടർപ്രവൃത്തിയുമായി ബന്ധിപ്പിക്കാൻ വിനയെച്ചരൂപം ഉപയോഗിച്ചു.
- source_word: ἐκ τῶν Φαρισαίων
  choice: പരീശന്മാരിൽ ചിലർ
  rationale: 'ἐκ സഹിതമുള്ള ഷഷ്ഠി വിഭക്തിയുടെ ഭാഗികത നിലനിർത്തുന്നു: എല്ലാ പരീശന്മാരുമല്ല, അവരിൽ ചിലർ.'
- source_word: ταῦτα
  choice: ഇതു
  rationale: മുൻപു പറഞ്ഞ കാര്യങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി സമാഹരിച്ചുസൂചിപ്പിക്കുന്നു; ‘വാക്കുകൾ’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: അവനോടുകൂടെ ഉണ്ടായിരുന്ന
  rationale: യേശുവിനോടൊപ്പം സന്നിഹിതരായിരുന്ന പരീശന്മാരെ തിരിച്ചറിയിക്കുന്ന കർത്തൃവാചകത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: εἶπον αὐτῷ
  choice: അവനോട് പറഞ്ഞു
  rationale: λέγωയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; ഉദ്ധരണിയുടെ ചോദ്യരൂപം തന്നെ ചോദ്യം വ്യക്തമാക്കുന്നു.
- source_word: Μὴ
  choice: അന്ധരല്ലല്ലോ, അല്ലേ?
  rationale: μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരവും സംസാരിക്കുന്നവരുടെ അവിശ്വാസഭാവവും മലയാളത്തിലെ നിഷേധപ്രതീക്ഷയുള്ള ചോദ്യഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: καὶ
  choice: ഞങ്ങളും
  rationale: മുമ്പ് പരാമർശിച്ച അന്ധരോടൊപ്പം ‘ഞങ്ങളും’ എന്ന ഉൾപ്പെടുത്തൽ καίയുടെ ‘കൂടി/also’ എന്ന ബലം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τυφλοί
  choice: അന്ധർ
  rationale: രൂപകാർഥം സന്ദർഭത്തിനു വിടുകയും മൂലത്തിലെ വിശേഷണത്തെ ‘ആത്മീയമായി അന്ധർ’ എന്നു വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐσμεν
  choice: അല്ലല്ലോ
  rationale: വർത്തമാനകാല അസ്തിത്വക്രിയ നിഷേധപ്രതീക്ഷയുള്ള മലയാളചോദ്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: τυφλοί എന്നതിന്റെ രൂപകാത്മക അർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘അന്ധർ’ എന്നു മാത്രം നിലനിർത്തുക
  alternative: ‘ആത്മീയമായി അന്ധർ’
  rationale: സന്ദർഭം രൂപകാർഥം വ്യക്തമാക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പദം അതിന് പ്രത്യേക വിശേഷണം ചേർക്കുന്നില്ല. ലളിതമായ രൂപം യോഹന്നാനിലെ വിരോധാഭാസം നിലനിർത്തുകയും വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: μή കൊണ്ടുള്ള ചോദ്യത്തിന്റെ പ്രതീക്ഷ
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ‘അന്ധരല്ലല്ലോ, അല്ലേ?’
  alternative: നിഷ്പക്ഷമായ ‘ഞങ്ങളും അന്ധരാണോ?’
  rationale: μή സാധാരണയായി ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യത്തെ സൂചിപ്പിക്കുന്നു; നിഷ്പക്ഷചോദ്യം ആ സൂക്ഷ്മത നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പരീശന്മാർ’, ‘അന്ധർ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ചോദ്യത്തിലെ ആത്മവിശ്വാസവും നിഷേധപ്രതീക്ഷയും ‘അല്ലല്ലോ, അല്ലേ?’ എന്ന സംഭാഷണസഹജമായ രൂപത്തിൽ നൽകി.
