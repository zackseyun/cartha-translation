id: JHN.9.35
reference: John 9:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: ml
  text: 'അവർ അവനെ പുറത്താക്കിയെന്ന് യേശു കേട്ടു. അവനെ കണ്ടെത്തിയപ്പോൾ യേശു ചോദിച്ചു: “നീ മനുഷ്യപുത്രനിൽ വിശ്വസിക്കുന്നുവോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “മനുഷ്യപുത്രൻ” എന്നതിനുപകരം “ദൈവപുത്രൻ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: പുറത്താക്കി
  rationale: ἐκβάλλω എന്ന ക്രിയയും ἔξω എന്ന ക്രിയാവിശേഷണവും ചേർന്ന് നിർബന്ധപൂർവമായ പുറത്താക്കലിനെ ഊന്നിപ്പറയുന്നു. സന്ദർഭത്തിലെ സമൂഹഭ്രഷ്ടതയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പുറത്താക്കി’ വ്യക്തമാക്കുന്നു.
- source_word: εὑρὼν
  choice: കണ്ടെത്തിയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തരൂപത്തിന് ഇവിടെ കാലസൂചകമായ അർഥമാണ് സ്വാഭാവികം; സംഭവങ്ങളുടെ ക്രമം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: Σὺ πιστεύεις
  choice: നീ ... വിശ്വസിക്കുന്നുവോ?
  rationale: പ്രകടമായ Σὺ നൽകുന്ന ഊന്നൽ ‘നീ’ എന്ന സർവനാമം നിലനിർത്തുന്നതിലൂടെ സംരക്ഷിക്കുന്നു; πιστεύω എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘വിശ്വസിക്കുക’ യോജിക്കുന്നു.
- source_word: εἰς
  choice: -നിൽ
  rationale: πιστεύω എന്നതോടുകൂടിയ εἰς ഒരു വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-നിൽ വിശ്വസിക്കുക’ അതിന്റെ സ്വാഭാവിക തുല്യപ്രയോഗമാണ്.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനിയേൽ 7-ലെയും യോഹന്നാന്റെ സുവിശേഷത്തിലെയും അന്തർപാഠബന്ധം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ ശീർഷകമാണിത്.
theological_decisions:
- issue: ചോദ്യത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകത്തിന്റെ പാഠഭേദം
  choice: മനുഷ്യപുത്രൻ
  alternative: ദൈവപുത്രൻ
  rationale: SBLGNT-യുടെ മുഖ്യപാഠത്തിൽ ἀνθρώπου (‘മനുഷ്യന്റെ’) എന്നാണ്. പ്രധാനപ്പെട്ടതും ചരിത്രപരമായി സ്വാധീനമുള്ളതുമായ ‘ദൈവപുത്രൻ’ എന്ന പാഠഭേദം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘മനുഷ്യപുത്രൻ’ എന്ന സ്ഥാപിതമായ ബൈബിൾ ശീർഷകം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ചോദ്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
