id: JHN.9.26
reference: John 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: ml
  text: 'അതിനാൽ അവർ അവനോടു പറഞ്ഞു: “അവൻ നിന്നോട് എന്തു ചെയ്തു? അവൻ നിന്റെ കണ്ണുകൾ എങ്ങനെ തുറന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: ചോദിച്ചു
  rationale: മൂലക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, പിന്നാലെ വരുന്ന രണ്ട് നേരിട്ടുള്ള ചോദ്യങ്ങൾ കാരണം മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള തുടർച്ചയും നിഗമനാത്മക ബന്ധവും നിലനിർത്തുന്നു; വെറും കാലക്രമം സൂചിപ്പിക്കുന്ന ‘അപ്പോൾ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: സൗഖ്യം ലഭിച്ച മനുഷ്യനെ സൂചിപ്പിക്കുന്ന പരോക്ഷ കർമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Τί ἐποίησέν σοι
  choice: അയാൾ നിന്നോട് എന്താണ് ചെയ്തത്?
  rationale: ποιέω + ദത്തി ഇവിടെ ‘നിന്നോട് എന്തു ചെയ്തു’ എന്ന് സ്വാഭാവികമായി വരുന്നു; ‘നിനക്കുവേണ്ടി’ എന്ന് വിവർത്തനം ചെയ്ത് ഗുണപരമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: πῶς
  choice: എങ്ങനെയാണ്
  rationale: രീതി അഥവാ മാർഗം ചോദിക്കുന്ന നേരിട്ടുള്ള സമാനപ്രയോഗം.
- source_word: ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: അയാൾ നിന്റെ കണ്ണുകൾ തുറന്നത്
  rationale: ശരീരഭാഗത്തോടുള്ള ഗ്രീക്ക് സ്വത്തുസൂചകഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിന്റെ കണ്ണുകൾ’ എന്നു നൽകുന്നു; സജീവക്രിയയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള ചോദ്യം. ചോദ്യകർത്താക്കളുടെ അന്വേഷണസ്വരം നിലനിർത്താൻ ‘നിന്നോട് എന്താണ് ചെയ്തത്?’ എന്നു ഉപയോഗിച്ചു. മുൻവാക്യത്തിൽ യേശുവിനെ പരാമർശിക്കുന്നതിനാൽ ആവർത്തിച്ച് പേര് ചേർക്കാതെ ‘അയാൾ’ എന്നു നൽകി.
