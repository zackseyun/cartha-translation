id: JHN.9.36
reference: John 9:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: ml
  text: 'അയാൾ ഉത്തരം പറഞ്ഞു: “കർത്താവേ,[a] ഞാൻ അവനിൽ വിശ്വസിക്കേണ്ടതിന് അവൻ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സാർ.” ഗ്രീക്കിലെ κύριε എന്ന പദം “കർത്താവേ” എന്നതിനു പുറമേ ബഹുമാനപൂർവമായ സംബോധനമായും ഉപയോഗിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: അയാൾ ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ മറുപടി-പ്രസംഗ സൂത്രവാക്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ἐκεῖνος മുൻസന്ദർഭത്തിലെ അന്ധനായി ജനിച്ച മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Καὶ τίς ἐστιν
  choice: അവൻ ആരാണ്?
  rationale: ആരംഭത്തിലെ καί ഇവിടെ പ്രതികരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വേറിട്ട് ‘അപ്പോൾ’ ചേർക്കാതെ ചോദ്യം നേരിട്ട് നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριε എന്ന സംബോധനയ്ക്ക് ‘കർത്താവേ’ എന്നും ബഹുമാനസൂചകമായ ‘യജമാനനേ/സാർ’ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ പതിവായ ദൈവശാസ്ത്രപരമായ തുല്യം നിലനിർത്തി സന്ദർഭത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: ഞാൻ അവനിൽ വിശ്വസിക്കേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യഭാവവും πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ ‘അവനിൽ വിശ്വസിക്കുക’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സൗഖ്യം ലഭിച്ച മനുഷ്യന്റെ പൂർണമായ തിരിച്ചറിവിനു മുമ്പുള്ള κύριε എന്ന സംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ; സാർ
  rationale: ഈ സന്ദർഭത്തിൽ സംബോധനം വെറും ബഹുമാനപ്രയോഗമോ ‘കർത്താവ്’ എന്ന തിരിച്ചറിവോ ആകാം. മുഖ്യപാഠം ‘കർത്താവേ’ എന്നു നൽകുന്നു; എന്നാൽ ഗ്രീക്കിലുള്ള യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. എന്നാൽ ‘എന്നോടു പറയണമേ’ എന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ പ്രസിദ്ധീകരണത്തിന് മുമ്പ് ഒഴിവാക്കേണ്ട വിപുലീകരണമായി ശ്രദ്ധിക്കണം.
