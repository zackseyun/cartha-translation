  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: ml
  text: എന്നാൽ അവൻ ഇപ്പോൾ എങ്ങനെ കാണുന്നുവെന്ന് ഞങ്ങൾക്കറിയില്ല; ആരാണ് അവന്റെ കണ്ണുകൾ തുറന്നതെന്ന് ഞങ്ങൾക്കറിയില്ല. അവനോടു ചോദിക്കൂ; അവൻ പ്രായപൂർത്തിയായവനാണ്. അവൻ തന്റെ കാര്യത്തെക്കുറിച്ച് സ്വയം സംസാരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന് സ്വന്തം കാര്യത്തെക്കുറിച്ച് സ്വയം സംസാരിക്കാൻ കഴിയും.” ഗ്രീക്കിലെ ഭാവികാലരൂപം, ഉത്തരം പറയാനുള്ള അവന്റെ കഴിവിനെയോ ഉത്തരവാദിത്വത്തെയോ സൂചിപ്പിക്കുന്ന പ്രായോഗിക പ്രസ്താവനയായി പ്രവർത്തിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: എന്നാൽ അവൻ ഇപ്പോൾ എങ്ങനെ കാണുന്നു
  rationale: πῶς എന്നതിന്റെ ‘എങ്ങനെ’ എന്ന ചോദ്യഭാവവും, δέ എന്നതിന്റെ മൃദുവായ വൈരുധ്യവും, νῦν βλέπει എന്നതിന്റെ വർത്തമാനകാല അർഥവും നിലനിർത്തുന്നു. ‘കാണാൻ കഴിയുന്നു’ എന്നു ചേർത്ത് കഴിവിനെ മാത്രം മുൻനിർത്തുന്നില്ല.
- source_word: οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്ക് അറിയില്ല
  rationale: οἶδα എന്ന ക്രിയയുടെ ‘അറിയുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ഗ്രീക്കിലെ ആവർത്തനം ഊന്നലിനായി മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: ആരാണ് അവന്റെ കണ്ണുകൾ തുറന്നതെന്നും
  rationale: ἀνοίγω എന്നതിന്റെ ‘തുറക്കുക’ എന്ന ദൃശ്യപ്രയോഗം അതേപടി നിലനിർത്തുകയും സംഭവവിവരണത്തിലെ അത്ഭുതവുമായി ഉള്ള പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτὸν ἐρωτήσατε
  choice: അവനോടു ചോദിക്കൂ
  rationale: ബഹുവചനസംബോധനയിലുള്ള ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἡλικίαν ἔχει
  choice: അവൻ പ്രായപൂർത്തിയായവനാണ്
  rationale: സന്ദർഭത്തിൽ ഇത് ശരീരത്തിന്റെ ഉയരമല്ല, സ്വതന്ത്രമായി ഉത്തരം പറയാൻ തക്ക പ്രായവും പക്വതയും സൂചിപ്പിക്കുന്നു. ആ നിയമ-സാമൂഹിക ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: അവൻ തന്നെക്കുറിച്ച് താൻതന്നെ സംസാരിക്കും
  rationale: αὐτός എന്ന ഊന്നലിനെ ‘താൻതന്നെ’ എന്നും περὶ ἑαυτοῦ എന്നതിനെ ‘തന്നെക്കുറിച്ച്’ എന്നും നിലനിർത്തുന്നു; λαλήσει എന്ന ഭാവികാലത്തെ ‘സംസാരിക്കും’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: ἡλικίαν ἔχει എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം
  choice: സ്വതന്ത്രമായി മറുപടി നൽകാൻ തക്ക പ്രായപൂർത്തി
  alternative: പൊതുവായ പക്വത; ശരീരത്തിന്റെ ഉയരം
  rationale: മാതാപിതാക്കൾ അധികാരികളുടെ ചോദ്യം മകനിലേക്കു തിരിച്ചുവിടുന്ന ചോദ്യംചെയ്യൽസന്ദർഭമാണ്. അതിനാൽ നിയമപരവും സാമൂഹികവുമായ ഉത്തരവാദിത്വമുള്ള പ്രായമാണ് ഇവിടെ പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്.
- issue: αὐτὸς περὶ ἑαυτοῦ λαλήσει എന്നതിന്റെ ഭാവം
  choice: അവൻ സ്വന്തം കാര്യത്തെക്കുറിച്ച് താൻതന്നെ സാക്ഷ്യം പറയും എന്ന പ്രായോഗിക പ്രസ്താവന
  alternative: അവൻ തന്നെക്കുറിച്ച് വെറുതെ സംസാരിക്കും; അവന് സ്വയം ഉത്തരം പറയാൻ കഴിയും
  rationale: ഭാവികാലം നേരിട്ട് നിലനിർത്തിക്കൊണ്ട് ചോദ്യംചെയ്യൽസന്ദർഭത്തിലെ സ്വയം ഉത്തരം പറയാനുള്ള ഉത്തരവാദിത്വവും ശേഷിയും സൂചിപ്പിക്കുന്നു; കഴിവ് എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചോദ്യംചെയ്യൽസന്ദർഭത്തിന്റെ ഔപചാരികഭാവം നിലനിർത്തിയിട്ടുണ്ട്. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ആദ്യ ഉപവാക്യത്തിനു സമീപമാണെങ്കിലും അതിന്റെ ഉള്ളടക്കം അവസാനത്തെ ഗ്രീക്ക് ഭാവികാലക്രിയയായ λαλήσει-യെ സംബന്ധിക്കുന്നതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ [a] അതത് അവസാനവാക്യത്തോടു ചേർത്തിരിക്കുന്നു.
