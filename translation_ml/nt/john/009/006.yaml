source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: ml
  text: ഇവ പറഞ്ഞശേഷം, അവൻ നിലത്ത് തുപ്പി, തുപ്പൽകൊണ്ട് ചെളിയുണ്ടാക്കി, ആ ചെളി അയാളുടെ കണ്ണുകളിൽ പുരട്ടി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആ ചെളികൊണ്ട് അയാളുടെ കണ്ണുകൾ അഭിഷേകം ചെയ്തു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് “അഭിഷേകം ചെയ്യുക” എന്നോ “പുരട്ടുക/പൂശുക” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: Aorist participle indicates that the saying preceded the following actions. This Malayalam phrasing conveys the sequence naturally and concisely.
- source_word: ἔπτυσεν χαμαί
  choice: അവൻ നിലത്തു തുപ്പി
  rationale: χαμαί denotes the ground; the rendering preserves the concrete action in ordinary modern Malayalam.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: തുപ്പൽകൊണ്ട് ചെളിയുണ്ടാക്കി
  rationale: πηλός here is wet earth or mud, and ἐκ τοῦ πτύσματος identifies saliva as what was used to form it. ‘ചെളി’ is plainer in this context than ‘കളിമണ്ണ്.’
- source_word: ἐπέχρισεν
  choice: പുരട്ടി
  rationale: The verb describes applying or smearing a substance onto something. ‘പുരട്ടി’ naturally conveys the physical action without imposing ceremonial overtones.
- source_word: αὐτοῦ ... ἐπὶ τοὺς ὀφθαλμούς
  choice: അയാളുടെ കണ്ണുകളിൽ
  rationale: The pronoun refers contextually to the blind man. ‘അയാളുടെ’ distinguishes him clearly from the subject ‘അവൻ’ while avoiding an unnecessary supplied noun.
- source_word: τὸν πηλόν
  choice: ആ ചെളി
  rationale: The article refers back to the mud just made; ‘ആ’ preserves this anaphoric force naturally in Malayalam.
theological_decisions:
- issue: Potential ceremonial nuance of ἐπέχρισεν
  choice: The main text uses the concrete physical verb ‘പുരട്ടി.’
  alternative: ‘ആ ചെളികൊണ്ട് അയാളുടെ കണ്ണുകൾ അഭിഷേകം ചെയ്തു’ or ‘പൂശി.’
  rationale: Although the Greek verb may be used for anointing, the immediate context describes the physical application of mud. The main rendering avoids adding a ceremonial or sacramental claim while the footnote preserves the lexical range.
translation_notes:
  register: Modern standard Malayalam in a dignified but accessible narrative register. ‘അവൻ’ refers to Jesus and ‘അയാളുടെ’ to the blind man, preventing pronoun ambiguity. The footnote marker is placed after the verb whose lexical range it explains.
