  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: ml
  text: ദൈവം മോശയോടു സംസാരിച്ചിട്ടുണ്ടെന്ന് ഞങ്ങൾക്കറിയാം; എന്നാൽ ഈ മനുഷ്യൻ എവിടെനിന്നുള്ളവനാണെന്ന്[a] ഞങ്ങൾക്കറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എവിടെനിന്നു വരുന്നു എന്ന്.’ യോഹന്നാന്റെ സുവിശേഷത്തിൽ യേശുവിന്റെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള ചോദ്യങ്ങൾക്ക് സാധാരണ അർഥത്തോടൊപ്പം കൂടുതൽ ആഴമുള്ള ദൈവശാസ്ത്രപരമായ അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: വ്യക്തമായി ഉപയോഗിച്ചിരിക്കുന്ന സർവനാമം അവകാശവാദത്തിലെ ഊന്നലും തുടർന്നുള്ള ‘ഈ മനുഷ്യൻ’ എന്ന വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: οἴδαμεν
  choice: ഞങ്ങൾക്കറിയാം
  rationale: അറിവും ഉറപ്പും സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്വാഭാവിക മലയാളരൂപം; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ ക്രിയ നിലനിർത്തി.
- source_word: Μωϋσεῖ
  choice: മോശയോടു
  rationale: ദൈവം മോശയോടു സംസാരിച്ചതെന്ന ദത്തിവ് ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λελάληκεν
  choice: സംസാരിച്ചിട്ടുണ്ടെന്ന്
  rationale: ഗ്രീക്ക് പൂർണകാലത്തിന്റെ, കഴിഞ്ഞ സംഭവത്തെ നിലവിലുള്ള ഉറച്ച സത്യമായി അവതരിപ്പിക്കുന്ന ഭാവം മലയാളത്തിലെ ‘-ിട്ടുണ്ട്’ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: സന്ദർഭത്തിലെ ഏകദൈവത്തെ സൂചിപ്പിക്കുന്ന മാനക മലയാള പദം.
- source_word: τοῦτον δὲ
  choice: എന്നാൽ ഈ മനുഷ്യൻ
  rationale: δέയുടെ വൈരുധ്യവും τοῦτον എന്ന അകലം പാലിക്കുന്ന പരാമർശവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അനാവശ്യമായി അധികം നിന്ദാസൂചന ചേർക്കുന്നില്ല.
- source_word: οὐκ οἴδαμεν
  choice: ഞങ്ങൾക്കറിയില്ല
  rationale: ആദ്യത്തെ οἴδαμεν എന്നതിനോടുള്ള ആവർത്തനവും വൈരുധ്യവും നിലനിർത്തുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ രൂപം.
- source_word: πόθεν ἐστίν
  choice: എവിടെനിന്നുള്ളവനാണെന്ന്
  rationale: ഭൗമിക ഉത്ഭവവും കൂടുതൽ ആഴമുള്ള ഉറവിടസൂചനയും തുറന്നുവെക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: πόθεν ἐστίν എന്നതിൽ യേശുവിന്റെ ഉത്ഭവത്തിന്റെ അർഥം
  choice: ‘എവിടെനിന്നുള്ളവനാണ്’ എന്നു വിശാലമായി പരിഭാഷപ്പെടുത്തി, സാധാരണ ഭൗമിക ഉത്ഭവമാണോ കൂടുതൽ ആഴമുള്ള ദൈവിക ഉറവിടമാണോ എന്ന് നിർണയിക്കാതെ വെച്ചു.
  alternative: ‘എവിടെനിന്നു വരുന്നു’ അല്ലെങ്കിൽ ‘അവന്റെ ഉത്ഭവം എന്താണ്’
  rationale: യോഹന്നാനിൽ യേശുവിന്റെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള ഭാഷയ്ക്ക് സാധാരണവും ദൈവശാസ്ത്രപരവുമായ തലങ്ങൾ ഉണ്ടാകാം. പരിഭാഷ ആ കഥനവൈരുധ്യവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ഈ മനുഷ്യൻ’ എന്നത് സംസാരിക്കുന്നവരുടെ അകലം പാലിക്കുന്ന ഭാവം നിലനിർത്തുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത അധിക നിന്ദാഭാവം ചേർക്കുന്നില്ല.
