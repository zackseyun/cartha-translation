  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: ml
  text: 'അതിനാൽ അവർ മുമ്പ് അന്ധനായിരുന്ന ആ മനുഷ്യനെ രണ്ടാമതും വിളിച്ച് അവനോടു പറഞ്ഞു: “ദൈവത്തിന് മഹത്വം നൽകുക[a]. ഈ മനുഷ്യൻ ഒരു പാപിയാണെന്ന് ഞങ്ങൾക്കറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, സത്യം പറയാൻ ആവശ്യപ്പെടുന്ന ഒരു ശൈലീപ്രയോഗമായിരിക്കാം: “ദൈവത്തിന് മഹത്വം നൽകുക,” അതായത്, “ദൈവസന്നിധിയിൽ സത്യം പറയുക” അഥവാ “ദൈവസന്നിധിയിൽ തുറന്നു സമ്മതിക്കുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: വിളിച്ചു
  rationale: അധികാരികൾ സൗഖ്യം പ്രാപിച്ച മനുഷ്യനെ വീണ്ടും തങ്ങളുടെ മുമ്പാകെ വിളിക്കുന്നതാണ് സന്ദർഭം. ‘വിളിച്ചു’ എന്നത് സ്വാഭാവികവും, മൂലപദത്തിൽ വ്യക്തമല്ലാത്ത ഔദ്യോഗിക ബലപ്രയോഗം സൂചിപ്പിക്കാത്തതുമാണ്.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുമ്പത്തെ സംഭാഷണത്തിൽനിന്നുള്ള തുടർച്ചയും നിഗമനസ്വഭാവവും ഈ ബന്ധകം സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ δευτέρου
  choice: രണ്ടാമതും
  rationale: ‘രണ്ടാം പ്രാവശ്യം’ എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ὃς ἦν τυφλός
  choice: മുമ്പ് അന്ധനായിരുന്ന
  rationale: അയാൾ ഇപ്പോൾ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നതിനാൽ, അന്ധത കഴിഞ്ഞകാല അവസ്ഥയാണെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: ദൈവത്തിനു മഹത്ത്വം കൊടുക്കുക
  rationale: വാക്യത്തിന്റെ നേരിട്ടുള്ള ദൈവസ്തുതിപരമായ രൂപം നിലനിർത്തുന്നു; സത്യം പറയാനുള്ള ഗൗരവമേറിയ ആഹ്വാനമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἡμεῖς οἴδαμεν
  choice: ഞങ്ങൾക്കറിയാം
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന ἡμεῖς നൽകുന്ന ഊന്നലും സംസാരിക്കുന്നവരുടെ ഉറച്ച അവകാശവാദവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ഈ മനുഷ്യൻ
  rationale: മൂലത്തിലെ നിർദ്ദേശകപ്രയോഗം കൃത്യമായി നൽകുന്നു; അധികമായ അവഹേളനസ്വരം ചേർക്കുന്നില്ല.
- source_word: ἁμαρτωλός
  choice: ഒരു പാപി
  rationale: ആ മനുഷ്യനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള കുറ്റാരോപണം അമൂർത്തമാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ എന്ന പ്രയോഗത്തിന്റെ ശൈലീപ്രയോഗപരമായ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘ദൈവത്തിനു മഹത്ത്വം കൊടുക്കുക’ എന്ന നേരിട്ടുള്ള രൂപം നിലനിർത്തുക
  alternative: ‘ദൈവസന്നിധിയിൽ സത്യം പറയുക’ അല്ലെങ്കിൽ ‘ദൈവസന്നിധിയിൽ തുറന്നു സമ്മതിക്കുക’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ ഉപയോഗിക്കുക
  rationale: ഈ പ്രയോഗം സത്യം പറയാനോ തുറന്നു സമ്മതിക്കാനോ ഉള്ള ഗൗരവമേറിയ ആഹ്വാനമായി പ്രവർത്തിച്ചിരിക്കാം; എന്നാൽ ഗ്രീക്ക് രൂപം ദൈവത്തിനു മഹത്ത്വം നൽകുക എന്നാണ്. അതിനാൽ പ്രധാന പാഠം നേരിട്ടുള്ള രൂപം നിലനിർത്തുകയും സാധ്യതയുള്ള ശൈലീപ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ ആരോപണവും പ്രയോഗത്തിന്റെ ദൈവസ്തുതിപരമായ രൂപവും നിലനിർത്തിയിരിക്കുന്നു.
