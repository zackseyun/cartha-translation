id: JHN.9.3
reference: John 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: ml
  text: 'യേശു ഉത്തരം പറഞ്ഞു: “ഇവനോ ഇവന്റെ മാതാപിതാക്കളോ പാപം ചെയ്തിട്ടില്ല; മറിച്ച്, ദൈവത്തിന്റെ പ്രവൃത്തികൾ ഇവനിൽ[a] വെളിപ്പെടേണ്ടതിനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇവനിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഇവനിൽ’ എന്നാണ്; ദൈവത്തിന്റെ പ്രവൃത്തികൾ പ്രകടമാകുന്ന രംഗത്തെയോ മാർഗത്തെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ഉത്തരം പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിലെ ἀποκρίνομαι എന്ന ക്രിയയുടെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: Οὔτε ... οὔτε
  choice: ഇവനോ ഇവന്റെ മാതാപിതാക്കളോ ... ചെയ്തിട്ടില്ല
  rationale: രണ്ടു സാധ്യതകളെയും ഒരുപോലെ നിഷേധിക്കുന്ന ഗ്രീക്ക് സഹബന്ധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: οὗτος
  choice: ഇവൻ
  rationale: സന്ദർഭത്തിൽ ജന്മനാ അന്ധനായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; അധികവിവരം ചേർക്കാതെ നിർദ്ദേശസർവനാമത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: ἥμαρτεν
  choice: പാപം ചെയ്തിട്ടില്ല
  rationale: ἁμαρτάνω എന്ന ക്രിയയുടെ ലളിതമായ ഭൂതകാലാർഥം നിഷേധരൂപത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: γονεῖς എന്നതിന്റെ കൃത്യവും സാധാരണവുമായ മലയാളസമാനപദം.
- source_word: ἀλλ’ ἵνα
  choice: മറിച്ച് ... വെളിപ്പെടേണ്ടതിനാണ്
  rationale: മുമ്പുള്ള വിശദീകരണങ്ങളെ നിരസിച്ചശേഷം ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇത് സംഭവിച്ചു’ എന്ന വാക്കുകൾ ചേർത്തിട്ടില്ല.
- source_word: φανερωθῇ
  choice: വെളിപ്പെടേണ്ടതിനാണ്
  rationale: നിഷ്ക്രിയഭാവവും ἵνα ഉപവാക്യത്തിലെ ഉദ്ദേശ്യസ്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പ്രവൃത്തികൾ
  rationale: യോഹന്നാന്റെ പ്രയോഗശൈലിയും ഗ്രീക്ക് ഉടമസ്ഥബന്ധവും സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: ഇവനിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുകയും ദൈവപ്രവൃത്തികൾ ഈ മനുഷ്യനിൽ ആണോ അവൻ മുഖാന്തരമാണോ പ്രകടമാകുന്നത് എന്ന സൂക്ഷ്മത അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഈ മനുഷ്യന്റെ അന്ധതയും പാപവും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള നിഷേധത്തിന്റെ വ്യാപ്തി
  choice: ഈ പ്രത്യേക സംഭവത്തിൽ ഇവനോ ഇവന്റെ മാതാപിതാക്കളോ ചെയ്ത പാപമാണ് കാരണം എന്ന ധാരണ മാത്രം വാക്യം നിഷേധിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: യാതൊരു കഷ്ടപ്പാടിനും വ്യക്തിയുടെയോ മാതാപിതാക്കളുടെയോ പാപവുമായി ബന്ധമില്ലെന്ന സർവസാധാരണ പ്രസ്താവനയായി വികസിപ്പിക്കുക.
  rationale: യേശു ശിഷ്യന്മാരുടെ നിർദിഷ്ട ചോദ്യത്തിനാണ് മറുപടി പറയുന്നത്; മൂലവാക്യം പറയുന്നതിലപ്പുറം ഒരു സാർവത്രിക സിദ്ധാന്തം വിവർത്തനത്തിൽ ചേർക്കരുത്.
- issue: ἵνα ഉദ്ദേശ്യമാണോ ഫലമാണോ സൂചിപ്പിക്കുന്നത്
  choice: ഉദ്ദേശ്യധ്വനിയുള്ള ‘വെളിപ്പെടേണ്ടതിനാണ്’ എന്ന രൂപം സ്വീകരിച്ചു.
  alternative: ‘അങ്ങനെ ദൈവത്തിന്റെ പ്രവൃത്തികൾ ഇവനിൽ വെളിപ്പെട്ടു’ എന്ന ഫലധ്വനി നൽകുക, അല്ലെങ്കിൽ അന്ധതയ്ക്ക് ദൈവിക ഉദ്ദേശ്യമുണ്ടെന്ന ധ്വനി ഒഴിവാക്കുന്ന വിധം വാക്യം പുനർവിരാമപ്പെടുത്തുക.
  rationale: ἵναയും subjunctive-ഉം ചേർന്ന ഘടനയുടെ ഏറ്റവും നേരിട്ടുള്ള വായന ഉദ്ദേശ്യമാണ്. അതോടൊപ്പം, ദൈവം അന്ധത വരുത്തിയെന്ന് മൂലം വ്യക്തമായി പറയാത്തതിനാൽ അത്തരം വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ വചനത്തിന്റെ ഗൗരവവും ഗ്രീക്ക് വാക്യത്തിലെ ഉദ്ദേശ്യധ്വനിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചിരിക്കുന്നു.
