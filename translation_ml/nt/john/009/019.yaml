  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ml
  text: 'അവർ അവരോടു ചോദിച്ചു: “ഇവൻ നിങ്ങളുടെ മകനാണോ, ജന്മനാ അന്ധനായാണ് ജനിച്ചതെന്ന് നിങ്ങൾ പറയുന്നത്? അങ്ങനെയെങ്കിൽ, ഇപ്പോൾ ഇവൻ എങ്ങനെ കാണുന്നു?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: അവർ അവരോടു ചോദിച്ചു
  rationale: പ്രധാനക്രിയയും ചോദ്യം പരിചയപ്പെടുത്തുന്ന പങ്കാളിക്രിയയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒറ്റ പ്രസ്താവനയായി നൽകുന്നു; ചോദ്യംചെയ്യലിന് അനാവശ്യമായ ഔപചാരികതയോ കടുപ്പമോ ചേർക്കുന്നില്ല.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: ഇവൻ നിങ്ങളുടെ മകനാണോ?
  rationale: ഗ്രീക്കിൽ രൂപപരമായി പ്രസ്താവനയായിരിക്കാമെങ്കിലും സന്ദർഭത്തിൽ ഇത് നേരിട്ടുള്ള ചോദ്യമാണ്; മലയാളത്തിൽ ചോദ്യംരൂപം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη
  choice: ഇവൻ ജന്മനാ അന്ധനായിരുന്നു എന്നാണല്ലോ നിങ്ങൾ പറയുന്നത്
  rationale: ὑμεῖς എന്ന ഊന്നൽ ‘നിങ്ങൾ’ വഴി നിലനിർത്തുന്നു. λέγετε എന്ന നിഷ്പക്ഷ ക്രിയയെ സംശയം കൂട്ടുന്ന ‘അവകാശപ്പെടുന്നു’ എന്നതിനു പകരം ‘പറയുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി. τυφλὸς ἐγεννήθη എന്നത് സ്വാഭാവികമായി ‘ജന്മനാ അന്ധനായിരുന്നു’ എന്നു നൽകി.
- source_word: πῶς οὖν
  choice: അങ്ങനെയെങ്കിൽ ... എങ്ങനെ
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെയെങ്കിൽ’ അത് മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: βλέπει ἄρτι
  choice: ഇപ്പോൾ ഇവൻ എങ്ങനെ കാണുന്നു
  rationale: βλέπει എന്ന വർത്തമാനകാല യാഥാർഥ്യവും ἄρτι സൂചിപ്പിക്കുന്ന മുൻകാല അന്ധതയോടുള്ള ഇപ്പോഴത്തെ വൈരുധ്യവും നേരിട്ട് നിലനിർത്തുന്നു; ‘കാണാൻ കഴിയുന്നു’ എന്നു നൽകി കഴിവിലേക്കു മാത്രം അർഥം മാറ്റുന്നില്ല.
