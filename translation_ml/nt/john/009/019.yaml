translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനാത്മകമായ ‘പറഞ്ഞുകൊണ്ട് ചോദിച്ചു’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ചുരുക്കി; എന്നാൽ രണ്ട് ചോദ്യങ്ങളുടെയും യുക്തിബന്ധവും മാതാപിതാക്കളോടുള്ള ഊന്നലും സംരക്ഷിച്ചു.
