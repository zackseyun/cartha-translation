revisions:
- from: 'യേശു പറഞ്ഞു: “ന്യായവിധിക്കായിട്ടാണ്[a] ഞാൻ ഈ ലോകത്തിലേക്കു വന്നത്; കാണാത്തവർ കാണേണ്ടതിനും കാണുന്നവർ അന്ധരായിത്തീരേണ്ടതിനും തന്നെ.”'
  to: 'യേശു പറഞ്ഞു: “ന്യായവിധിക്കായി[a] ഞാൻ ഈ ലോകത്തിലേക്കു വന്നത് കാണാത്തവർ കാണാനും കാണുന്നവർ അന്ധരായിത്തീരാനും ആണ്.”'
  rationale: The revision retains the source’s judicial language and its intentional ambiguity concerning sight, while replacing Malayalam forms that can imply obligation with natural infinitival purpose/result clauses. It also removes an unsupported emphatic particle. The footnote remains anchored to “ന്യായവിധിക്കായി” and continues to distinguish judgment’s judicial effect from condemnation alone.
  reviewer_model: gpt-5.6-terra
