source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: ml
  text: 'യേശു പറഞ്ഞു: “ന്യായവിധിക്കായി[a] ഞാൻ ഈ ലോകത്തിലേക്കു വന്നത് കാണാത്തവർ കാണാനും കാണുന്നവർ അന്ധരായിത്തീരാനും ആണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ന്യായവിധിക്കായി.’ ഗ്രീക്കിലെ εἰς κρίμα എന്ന പ്രയോഗം ശിക്ഷാവിധിയെ മാത്രം അല്ല, യേശുവിന്റെ വരവിലൂടെ ഉണ്ടാകുന്ന ന്യായപരമായ ഫലത്തെയും ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: നീതിന്യായപരമായ വേർതിരിവും അതിന്റെ ഫലവും ഉൾക്കൊള്ളുന്ന പദം. ‘ശിക്ഷാവിധി’ എന്നു ചുരുക്കിയാൽ കാണാത്തവർ കാണുന്നു എന്ന അനുകൂല ഫലം ഉൾപ്പെടുന്ന വാക്യത്തിന്റെ വ്യാപ്തി നഷ്ടപ്പെടും.
- source_word: κόσμον
  choice: ലോകം
  rationale: യോഹന്നാനിലെ സാധാരണ പ്രയോഗത്തോടും ഇവിടെ ഉദ്ദേശിക്കുന്ന മനുഷ്യലോകത്തോടും യോജിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: കാണാത്തവർ / കാണുന്നവർ
  rationale: രണ്ടു കൃദന്തരൂപങ്ങളുടെയും സമാന്തരഘടന കാത്തുസൂക്ഷിക്കുകയും ശാരീരികവും ആത്മീയവുമായ കാഴ്ചയുടെ അർഥസാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βλέπωσιν
  choice: കാണേണ്ടതിന്
  rationale: ἵνα-ഉപവാക്യത്തിലെ ഉദ്ദേശ്യ/ഫല സൂചന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കാഴ്ച പ്രാപിക്കുക’ എന്നതിനെക്കാൾ ശാരീരിക-ആത്മീയ ദ്വയാർഥം നന്നായി നിലനിർത്തുന്നു.
- source_word: τυφλοὶ γένωνται
  choice: അന്ധരായിത്തീരേണ്ടതിന്
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന ആയിത്തീരൽ എന്ന ഫലഭാവവും predicate adjective ആയ τυφλοίയുടെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: ഞാൻ ഈ ലോകത്തിലേക്കു വന്നത്
  rationale: εἰς സഹിതമുള്ള വരവിന്റെ ദിശയും യോഹന്നാനിലെ ലോകത്തിലേക്കുള്ള വരവ് എന്ന ഭാഷയും സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: യോഹന്നാൻ 3:17-ലെ ‘ലോകത്തെ വിധിക്കാനല്ല’ എന്ന പ്രസ്താവനയുമായുള്ള ബന്ധം
  choice: κρίμα എന്നത് ‘ന്യായവിധി’ എന്നു തന്നെ പരിഭാഷപ്പെടുത്തി പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
  alternative: ‘വേർതിരിവ്’ എന്നു വ്യാഖ്യാനപരമായി മൃദൂകരിക്കുകയോ ‘ശിക്ഷാവിധി’ എന്നു ശിക്ഷയിൽ മാത്രം പരിമിതപ്പെടുത്തുകയോ ചെയ്യുക.
  rationale: 'യേശുവിന്റെ വരവ് യഥാർഥ ആത്മീയസ്ഥിതി വെളിപ്പെടുത്തുന്ന ന്യായപരമായ മറിച്ചിടലിന് ഇടയാക്കുന്നു: കാണാത്തവർ കാണുന്നു; കാണുന്നവർ അന്ധരായിത്തീരുന്നു. മറ്റു യോഹന്നാനീയ പ്രസ്താവനകളുമായി തൽക്ഷണം സമന്വയിപ്പിക്കാൻ ശ്രമിക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.'
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവഭാവമുള്ളതുമായ മലയാളം. ‘കാണാത്തവർ/കാണുന്നവർ’ എന്ന സമാന്തരപ്രയോഗം മൂലപാഠത്തിലെ ശാരീരിക-ആത്മീയ ദ്വയാർഥവും വാക്യത്തിന്റെ മറിച്ചിടൽശക്തിയും നിലനിർത്തുന്നു.
