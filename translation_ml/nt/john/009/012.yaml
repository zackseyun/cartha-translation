  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: ml
  text: 'അവർ അവനോട്, “ആ മനുഷ്യൻ എവിടെയാണ്?” എന്നു ചോദിച്ചു. അവൻ പറഞ്ഞു: “എനിക്കറിയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: അവർ
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമത്തിൽ പ്രത്യേകം ‘പിന്നെ/അപ്പോൾ’ ചേർക്കാതെ സൂചിപ്പിക്കുന്നു; കർത്താവിനെ ആദ്യം നിർത്തുന്നത് വാക്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: εἶπαν αὐτῷ
  choice: അവർ അവനോട് … എന്നു ചോദിച്ചു
  rationale: പദശഃ ‘അവനോട് പറഞ്ഞു’ എന്നാണെങ്കിലും തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും അർത്ഥവിശ്വസ്തവുമാണ്.
- source_word: Ποῦ
  choice: എവിടെയാണ്
  rationale: സ്ഥലത്തെക്കുറിച്ചുള്ള ചോദ്യം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκεῖνος
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന substantival demonstrative-ന്റെ അകലസൂചന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: λέγει
  choice: അവൻ പറഞ്ഞു
  rationale: യോഹന്നാനിലെ ചരിത്രവർത്തമാനകാലം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ ഭൂതകാലത്തിൽ നൽകുന്നു; സംഭാഷണത്തിന്റെ സജീവതയ്ക്ക് അനാവശ്യമായ കൃത്രിമത്വം വരുത്തുന്നില്ല.
- source_word: Οὐκ οἶδα
  choice: എനിക്കറിയില്ല
  rationale: ലളിതവും നേരിട്ടുള്ളതുമായ ആധുനിക മലയാള പ്രയോഗം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവും സ്വാഭാവികവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ἐκεῖνος എന്ന demonstrative-ന്റെ സൂചന ‘ആ മനുഷ്യൻ’ എന്നു നിലനിർത്തിയതിനാൽ പാഠക്കുറിപ്പ് ആവശ്യമില്ല.
