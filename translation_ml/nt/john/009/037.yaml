id: JHN.9.37
reference: John 9:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: ml
  text: 'യേശു അവനോടു പറഞ്ഞു: “നീ അവനെ കണ്ടിട്ടുമുണ്ട്; നിന്നോടു സംസാരിക്കുന്നവൻ അവൻ തന്നെയാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ആഖ്യാനസംഭാഷണത്തിൽ λέγω എന്ന ക്രിയയുടെ എയോറിസ്റ്റിനും അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന ദത്തിവിനും സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: Καὶ
  choice: ;
  rationale: ഇവിടെ καί രണ്ട് പ്രഖ്യാപനങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ പദശഃ ‘കൂടാതെ/ഉം’ ചേർക്കുന്നതിനെക്കാൾ അർദ്ധവിരാമം സ്വാഭാവികമായി ഏകോപനം പ്രകടിപ്പിക്കുന്നു; അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ἑώρακας
  choice: നീ ... കണ്ടിരിക്കുന്നു
  rationale: ὁράωയുടെ പൂർണ്ണഭൂതകാലരൂപം പൂർത്തിയായ ദർശനത്തിന്റെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയുടെയും ഭാവം വഹിക്കുന്നു; ‘കണ്ടിരിക്കുന്നു’ അത് നിലനിർത്തുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: മുൻസന്ദർഭത്തിൽ ചോദിക്കപ്പെട്ട പുരുഷലിംഗ ഏകവചന വ്യക്തിയെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; പദവി ഈ വാക്യത്തിൽ ആവർത്തിക്കാതെ സർവനാമമായി നിലനിർത്തുന്നു.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: നിന്നോടു സംസാരിക്കുന്നവൻ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിയെ ‘സംസാരിക്കുന്നവൻ’ പകർത്തുന്നു. μετά + genitive യിലെ സഹസംഭാഷണഭാവം മലയാളത്തിലെ ‘നിന്നോടു സംസാരിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἐκεῖνός ἐστιν
  choice: തന്നെയാണ് അവൻ
  rationale: തിരിച്ചറിയിക്കൽ സൂത്രത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ വഴി നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിലെ പദവി അനാവശ്യമായി വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മുൻവാക്യത്തിൽ ചോദിക്കപ്പെട്ട മനുഷ്യപുത്രനുമായി യേശു സ്വയം തിരിച്ചറിയുന്നത്
  choice: ‘നിന്നോടു സംസാരിക്കുന്നവൻ തന്നെയാണ് അവൻ’ എന്ന നേരിട്ടുള്ളതും വിപുലീകരിക്കാത്തതുമായ തിരിച്ചറിയിക്കൽ
  alternative: ‘നിന്നോടു സംസാരിക്കുന്നത് മനുഷ്യപുത്രനായ ഞാനാണ്’
  rationale: ഗ്രീക്ക് വാക്യം മുൻപ് പരാമർശിച്ച വ്യക്തിയുമായി യേശുവിനെ തിരിച്ചറിയിക്കുന്നു, എന്നാൽ പദവി ഇവിടെ വീണ്ടും പറയുന്നില്ല. അതിനാൽ വെളിപ്പെടുത്തലിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് വ്യാഖ്യാനാത്മകമായ പദവിച്ചേർക്കൽ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാന-സംഭാഷണ ശൈലി. ഗ്രീക്കിന്റെ പൂർണ്ണഭൂതകാല പ്രസക്തിയും തിരിച്ചറിയിക്കൽ ഊന്നലും സംരക്ഷിച്ചു; മലയാളത്തിൽ അസ്വാഭാവികമായ പദശഃ ഘടന ഒഴിവാക്കി.
