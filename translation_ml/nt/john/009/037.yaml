- from: 'യേശു അവനോടു പറഞ്ഞു: “നീ അവനെ കണ്ടിരിക്കുന്നു; നിന്നോടു സംസാരിക്കുന്നവൻ തന്നെയാണ് അവൻ.”'
  to: 'യേശു അവനോടു പറഞ്ഞു: “നീ അവനെ കണ്ടിട്ടുമുണ്ട്; നിന്നോടു സംസാരിക്കുന്നവൻ അവൻ തന്നെയാണ്.”'
  rationale: The revision preserves the Greek’s perfect ‘you have seen,’ its coordination of seeing and present speaking, and its direct self-identification without importing the preceding title. ‘നിന്നോടു സംസാരിക്കുന്നവൻ’ is the normal modern Malayalam way to express the conversational sense of λαλῶν μετὰ σοῦ; no footnote is required because an alternative phrasing would not clarify the Malayalam sufficiently to warrant one.
