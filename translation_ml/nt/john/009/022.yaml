id: JHN.9.22
reference: John 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: ml
  text: അവന്റെ മാതാപിതാക്കൾ ഇങ്ങനെ പറഞ്ഞത് യെഹൂദന്മാരെ[a] ഭയന്നിരുന്നതിനാലാണ്. കാരണം, ആരെങ്കിലും അവനെ മശീഹയെന്ന്[b] ഏറ്റുപറഞ്ഞാൽ അയാൾ സിനഗോഗിൽനിന്ന് പുറത്താക്കപ്പെടണമെന്ന് യെഹൂദന്മാർ നേരത്തേതന്നെ ധാരണയിലെത്തിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘യെഹൂദന്മാർ.’ ഈ സന്ദർഭത്തിൽ, യെഹൂദജനത്തെ മുഴുവനായി അല്ല, സിനഗോഗിൽനിന്ന് പുറത്താക്കാൻ അധികാരമുണ്ടായിരുന്ന യെഹൂദനേതാക്കളെയായിരിക്കാം പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തുവെന്ന്’ അഥവാ ‘ക്രിസ്തുവാണെന്ന്.’
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: ഇങ്ങനെ പറഞ്ഞത്
  rationale: ταῦτα എന്ന ബഹുവചന സൂചന മുൻപുള്ള മാതാപിതാക്കളുടെ വാക്കുകളെ ഒന്നാകെ ചൂണ്ടുന്നു; മലയാളത്തിൽ ‘ഇങ്ങനെ’ സ്വാഭാവികമായി ആ പരാമർശം വഹിക്കുന്നു.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: അവന്റെ മാതാപിതാക്കൾ
  rationale: γονεῖς എന്നത് മാതാപിതാക്കൾ എന്ന സാധാരണ അർഥത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἐφοβοῦντο
  choice: ഭയപ്പെട്ടതുകൊണ്ടാണ്
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന നിലനിന്നിരുന്ന ഭയം സന്ദർഭത്തിൽ സ്വാഭാവികമായ കാരണവാക്യമായി നൽകുന്നു.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അധികാരമുള്ള യെഹൂദനേതാക്കളായിരിക്കാം ഉദ്ദേശ്യം എന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤδη ... συνετέθειντο
  choice: നേരത്തേതന്നെ ധാരണയിലെത്തിയിരുന്നു
  rationale: ἤδηയുടെ മുൻകാലസൂചനയും συνετέθειντοയുടെ മുൻകൂട്ടിയുള്ള കൂട്ടായ തീരുമാനവും പൂർവപൂർണ ഭാവത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: അവനെ മശീഹയെന്ന് ഏറ്റുപറഞ്ഞാൽ
  rationale: ὁμολογέωയുടെ പരസ്യമായ അംഗീകാരം ‘ഏറ്റുപറയുക’ എന്നും χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നും നൽകുന്നു.
- source_word: ἀποσυνάγωγος γένηται
  choice: പള്ളിയിൽനിന്ന് പുറത്താക്കണമെന്ന്
  rationale: സിനഗോഗ് സമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലാണ് പദം സൂചിപ്പിക്കുന്നത്; കേരളീയ യെഹൂദാരാധനാലയത്തിന് സ്വാഭാവികമായ ‘പള്ളി’ ഉപയോഗിച്ച് ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു / ക്രിസ്തു എന്നു
  rationale: ഇവിടെ പദം വ്യക്തിനാമംപോലെ അല്ല, അഭിഷിക്തനായ പ്രതീക്ഷിത രക്ഷകന്റെ സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ യെഹൂദ മശീഹാപശ്ചാത്തലം നിലനിർത്തുന്നു.
- issue: οἱ Ἰουδαῖοι എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: യെഹൂദന്മാർ എന്ന മുഖ്യപാഠം, വിശദീകരണ അടിക്കുറിപ്പോടെ
  alternative: യെഹൂദനേതാക്കൾ / യെഹൂദ്യർ
  rationale: മൂലപദത്തിന്റെ യഥാർഥ വ്യാപ്തിയും യോഹന്നാനിലെ സന്ദർഭാധീനമായ അർഥവും സംരക്ഷിക്കുന്നു; മുഴുവൻ യെഹൂദജനത്തെയും വിവേചനമില്ലാതെ ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ അടിക്കുറിപ്പ് തടയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെഹൂദന്മാർ’ എന്ന മൂലപദസുതാര്യതയും ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരിന്റെ യെഹൂദ പശ്ചാത്തലവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
