revisions:
- from: 'അവൻ അവനോട് പറഞ്ഞു: “പോയി ശീലോഹാം കുളത്തിൽ കഴുകുക.” (“അയയ്ക്കപ്പെട്ടവൻ” എന്നാണ് അതിന്റെ പരിഭാഷ[a].) അങ്ങനെ അവൻ പോയി കഴുകി; കണ്ടുകൊണ്ട് മടങ്ങിവന്നു.'
  to: 'അവൻ അവനോട് പറഞ്ഞു: “പോയി ശീലോഹാം കുളത്തിൽ കഴുകുക.” (അതിന്റെ അർഥം “അയയ്ക്കപ്പെട്ടവൻ” എന്നാണ്[a].) അങ്ങനെ അവൻ പോയി കഴുകി; കാണുന്നവനായി മടങ്ങിവന്നു.'
  rationale: The revision retains the source text's sequence and ambiguity, improves the Malayalam parenthetical construction, and uses an idiomatic participial expression for the man's return seeing. It neither develops nor suppresses the narrative's possible symbolic resonance.
