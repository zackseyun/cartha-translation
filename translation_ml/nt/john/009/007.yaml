id: JHN.9.7
reference: John 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: ml
  text: 'അവൻ അവനോട് പറഞ്ഞു: “പോയി ശീലോഹാം കുളത്തിൽ കഴുകുക.” (അതിന്റെ അർഥം “അയയ്ക്കപ്പെട്ടവൻ” എന്നാണ്[a].) അങ്ങനെ അവൻ പോയി കഴുകി; കാണുന്നവനായി മടങ്ങിവന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയയ്ക്കപ്പെട്ടവൻ” എന്നാണ് അതിന്റെ പരിഭാഷ.
    reason: ἑρμηνεύεται എന്ന പദത്തിന് സന്ദർഭത്തിൽ ‘അർഥം’ എന്നും ‘പരിഭാഷ’ എന്നും നൽകാം. മുഖ്യപാഠത്തിലെ ‘അർഥം’ സ്വാഭാവികമായ പേരുവിശദീകരണമാണ്; അടിക്കുറിപ്പ് ഭാഷാന്തരപരമായ ഭാവം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: Ὕπαγε
  choice: പോയി
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള ആജ്ഞയാണ്. തുടർന്നുള്ള ‘കഴുകുക’ എന്ന ആജ്ഞയോടു ചേർന്ന് ‘പോയി’ എന്നത് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗമാണ്.
- source_word: νίψαι / ἐνίψατο
  choice: കഴുകുക / കഴുകി
  rationale: νίπτω സാധാരണയായി ശരീരമോ ശരീരത്തിന്റെ ഒരു ഭാഗമോ കഴുകുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ പ്രതിഫലനസർവനാമം പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: εἰς τὴν κολυμβήθραν
  choice: കുളത്തിൽ
  rationale: κολυμβήθρα ഒരു കുളത്തെയോ ജലസംഭരണിയെയോ സൂചിപ്പിക്കുന്നു. കഴുകുക എന്ന ക്രിയയോടൊപ്പം ‘കുളത്തിൽ’ എന്നത് ലക്ഷ്യവും കഴുകുന്ന സ്ഥലവും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘കുളത്തിലേക്ക്’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അപൂർണ്ണമായി തോന്നും.
- source_word: Σιλωάμ
  choice: ശീലോഹാം
  rationale: ഗ്രീക്ക് രൂപമായ Σιλωάμ-നെ അടുത്തായി പ്രതിനിധീകരിക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണമാണ്.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: “അയയ്ക്കപ്പെട്ടവൻ” എന്നാണ് അതിന്റെ പരിഭാഷ
  rationale: ἑρμηνεύεται നൽകുന്ന ഭാഷാപരമായ വിശദീകരണം വ്യക്തമായി നിലനിർത്തുന്നു. Ἀπεσταλμένος എന്ന പുൽലിംഗ നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ സ്വഭാവം ‘അയയ്ക്കപ്പെട്ടവൻ’ സംരക്ഷിക്കുന്നു; യോഹന്നാന്റെ പ്രതീകാത്മക സൂചനയെ വിവർത്തനം കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: ആജ്ഞയുടെ സ്വാഭാവികമായ തുടർച്ചയും ഫലവും സൂചിപ്പിക്കുന്ന കഥനബന്ധമായി οὖν ഇവിടെ പ്രവർത്തിക്കുന്നു. ‘അങ്ങനെ’ ആ ബന്ധം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἀπῆλθεν
  choice: പോയി
  rationale: പുറപ്പെട്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന ലളിതമായ കഥനക്രിയയാണ്; ‘പോയി’ അധികഭാവം ചേർക്കാതെ അർഥം നൽകുന്നു.
- source_word: ἦλθεν βλέπων
  choice: കണ്ടുകൊണ്ട് മടങ്ങിവന്നു
  rationale: βλέπων എന്ന വർത്തമാന കൃദന്തത്തിന്റെ സജീവവും ദൃശ്യവുമായ ഭാവം ‘കണ്ടുകൊണ്ട്’ നിലനിർത്തുന്നു. അവൻ പോയ സ്ഥലത്തുനിന്നുള്ള വരവ് മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മടങ്ങിവന്നു’ ഉപയോഗിച്ചു; ‘കാഴ്ച ലഭിച്ചു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
theological_decisions:
- issue: ശീലോഹാം എന്ന പേരിന്റെ വിശദീകരണം യോഹന്നാന്റെ പ്രതീകാത്മകതയെ അതിവ്യാഖ്യാനിക്കാതെ നൽകൽ
  choice: ‘“അയയ്ക്കപ്പെട്ടവൻ” എന്നാണ് അതിന്റെ പരിഭാഷ’ എന്ന വാക്യം ആഖ്യാനത്തിന്റെ ഭാഗമായി പരാന്തസിസിൽ നിലനിർത്തി.
  alternative: പിതാവ് അയച്ച യേശുവുമായുള്ള പ്രതീകബന്ധം വിവർത്തനത്തിൽ തുറന്നുപറയുക.
  rationale: പേരിന്റെ വിശദീകരണം ഗ്രീക്ക് പാഠത്തിൽ തന്നെയുണ്ട്; അതിനാൽ അത് മുഖ്യപാഠത്തിൽ വേണം. എന്നാൽ സൂചനയുടെ ദൈവശാസ്ത്രപരമായ അർഥം യോഹന്നാൻ ഇവിടെ തുറന്നുപറയുന്നതിലധികം വിവർത്തനം വികസിപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ആജ്ഞയും തുടർന്നുള്ള പ്രവർത്തനങ്ങളും സംക്ഷിപ്തമായി സൂക്ഷിച്ചിരിക്കുന്നു. പരാന്തസിസിലുള്ള പേരുവ്യാഖ്യാനം മൂലപാഠത്തിന്റെ ഘടന അനുസരിക്കുന്നു; ചികിത്സയുടെ ഫലം ‘കണ്ടുകൊണ്ട്’ എന്ന കൃദന്തരൂപത്തിലൂടെ ദൃശ്യമായി നിലനിർത്തുന്നു.
