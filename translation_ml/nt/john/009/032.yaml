reference: John 9:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: ml
  text: പണ്ടുമുതൽ, ജന്മനാ അന്ധനായ ഒരാളുടെ കണ്ണുകൾ ആരെങ്കിലും തുറന്നതായി ഒരിക്കലും കേട്ടിട്ടില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലോകാരംഭംമുതൽ, ജന്മനാ അന്ധനായ ഒരാളുടെ കണ്ണുകൾ ആരെങ്കിലും തുറന്നതായി ഒരിക്കലും കേട്ടിട്ടില്ല.”
    reason: ἐκ τοῦ αἰῶνος എന്ന കാലസൂചകപ്രയോഗത്തിന്റെ പരമ്പരാഗതവും കൂടുതൽ വ്യാഖ്യാനാത്മകവുമായ വിവർത്തനം.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: പണ്ടുമുതൽ
  rationale: ‘ആ യുഗംമുതൽ’ എന്ന അക്ഷരാർഥമുള്ള ഈ പ്രയോഗം, ഓർമിക്കപ്പെടുന്ന ചരിത്രകാലമൊട്ടാകെ എന്ന ആശയത്തിൽ ക്രിയാവിശേഷണമായി പ്രവർത്തിക്കുന്നു. ‘പണ്ടുമുതൽ’ അതിന്റെ ചരിത്രപരമായ വ്യാപ്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘നിത്യതമുതൽ’ എന്ന അതിശക്തമായ തത്ത്വചിന്താപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: οὐκ ἠκούσθη
  choice: ഒരിക്കലും കേട്ടിട്ടില്ല
  rationale: ഇവിടെ കർമണിപ്രയോഗം മുമ്പ് ഇങ്ങനെയൊരു സംഭവം റിപ്പോർട്ട് ചെയ്യപ്പെട്ടിട്ടില്ല എന്ന അർഥമാണ് നൽകുന്നത്. മലയാളത്തിലെ ‘കേട്ടിട്ടില്ല’ സ്വാഭാവികമായി ആ ഭാവം അറിയിക്കുന്നു.
- source_word: ὅτι
  choice: …തായി
  rationale: കേൾക്കപ്പെട്ടിട്ടില്ലാത്ത കാര്യത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ὅτι മലയാളത്തിൽ ഉദ്ധരണാർഥകമായ ‘…തായി’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: ἠνέῳξέν
  choice: തുറന്നതായി
  rationale: ‘കണ്ണുകൾ തുറക്കുക’ എന്ന മൂലപ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘കാഴ്ച നൽകിയതായി’ എന്നു വിവർത്തനം ചെയ്താൽ ക്രിയയുടെ അർഥം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നതാകും.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: പൊതുവായ നിഷേധവാക്യത്തിലെ അനിശ്ചിത കർത്താവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὀφθαλμοὺς
  choice: കണ്ണുകൾ
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളരൂപം; ഉടമസ്ഥബന്ധം തുടർന്നുള്ള ഷഷ്ഠിവിഭക്തി ഘടനയിൽ വ്യക്തമാകുന്നു.
- source_word: τυφλοῦ γεγεννημένου
  choice: ജന്മനാ അന്ധനായ ഒരാളുടെ
  rationale: ജനിച്ച കാലംമുതൽ അന്ധനായിരുന്ന വ്യക്തിയെയാണ് കൃതന്തപ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ഒരാൾ’ ഗ്രീക്കിലെ പുരുഷലിംഗ വ്യാകരണരൂപത്തെ അനാവശ്യമായി ‘പുരുഷൻ’ എന്നു നിർണ്ണയിക്കാതെ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος എന്നതിന്റെ കാലവ്യാപ്തി
  choice: ഓർമിക്കപ്പെടുന്ന പൂർവകാലംമുതൽ എന്ന ചരിത്രപരമായ പ്രയോഗം
  alternative: ലോകാരംഭംമുതൽ; നിത്യതമുതൽ
  rationale: പ്രസംഗകൻ മനുഷ്യാനുഭവത്തിൽ മുമ്പുണ്ടായിട്ടില്ലാത്ത സംഭവത്തെക്കുറിച്ചാണ് വാദിക്കുന്നത്; നിത്യകാലത്തെക്കുറിച്ചുള്ള തത്ത്വചിന്താപരമായ പ്രസ്താവനയല്ല. മുഖ്യപാഠം ഈ വാചാടോപപരമായ ശക്തി അതിശയോക്തിയില്ലാതെ നിലനിർത്തുന്നു; പരമ്പരാഗതമായ വിപുലീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ജന്മനാ അന്ധനായ ഒരാൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘കണ്ണുകൾ തുറക്കുക’ എന്ന മൂലരൂപം അത്ഭുതത്തിന്റെ ഭാഷ മാറ്റാതെ സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
