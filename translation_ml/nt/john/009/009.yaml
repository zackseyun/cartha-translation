language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: ml
  text: ചിലർ, “ഇയാൾ തന്നെയാണ്,” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു. മറ്റുചിലർ, “അല്ല, ഇയാൾ അവനെപ്പോലെയുണ്ട്,” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു. അയാൾ, “ഞാൻ തന്നെയാണ്[a],” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാനാണ്.” ഇവിടെ അയാൾ, അവർ ചർച്ച ചെയ്യുന്ന വ്യക്തി താൻ തന്നെയാണെന്ന് തിരിച്ചറിയിക്കുകയാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: ചിലർ … മറ്റുചിലർ
  rationale: ജനക്കൂട്ടത്തിലെ വ്യത്യസ്ത വിഭാഗങ്ങളെ സ്വാഭാവികമായ മലയാളത്തിൽ വേർതിരിച്ചുകാട്ടുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു / പറഞ്ഞു
  rationale: ആദ്യ പ്രയോഗത്തിലെ imperfect ജനക്കൂട്ടത്തിൽ നടന്നുകൊണ്ടിരുന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തേതിലും അതേ ചർച്ചയാണ് ഉദ്ദേശ്യമെങ്കിലും മലയാളത്തിലെ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കാൻ ലളിതരൂപം ഉപയോഗിച്ചു.
- source_word: Οὗτός ἐστιν
  choice: ഇയാൾ തന്നെയാണ്
  rationale: ചൂണ്ടിക്കാട്ടിയുള്ള ഹ്രസ്വമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നു; ‘തന്നെയാണ്’ സന്ദർഭത്തിലെ വ്യക്തിത്വസ്ഥിരീകരണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Οὐχί, ἀλλὰ
  choice: അല്ല, …
  rationale: മുൻവാദത്തെ നിഷേധിച്ച് വിരുദ്ധാഭിപ്രായം അവതരിപ്പിക്കുന്ന സംഭാഷണശൈലി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: ഇയാൾ അവനെപ്പോലെയുണ്ട്
  rationale: തിരിച്ചറിയലല്ല, സാദൃശ്യം മാത്രമാണെന്ന വ്യത്യാസം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐκεῖνος ἔλεγεν
  choice: എന്നാൽ അയാൾ … ആവർത്തിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: സംവാദത്തിനിടെ ആ മനുഷ്യൻ തുടർച്ചയായോ ആവർത്തിച്ചോ ഉറപ്പിച്ചുപറഞ്ഞതിന്റെ imperfect ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: ഇവിടെ ചർച്ച ചെയ്യപ്പെടുന്ന വ്യക്തി താനാണെന്ന സാധാരണ സ്വയംതിരിച്ചറിയലാണ് സന്ദർഭാർഥം; ഗ്രീക്കിലെ ഹ്രസ്വരൂപത്തെ കുറിച്ച് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ രചനയിലെ Ἐγώ εἰμι എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഞാൻ തന്നെയാണ്
  alternative: ഞാൻ ആകുന്നു
  rationale: സംസാരിക്കുന്നത് സൗഖ്യം ലഭിച്ച മനുഷ്യനാണ്; തങ്ങൾ ചർച്ച ചെയ്യുന്ന ആൾ താനാണെന്ന് അയാൾ തിരിച്ചറിയിക്കുന്നു. അതിനാൽ ഇവിടെ ക്രിസ്തുശാസ്ത്രപരമായ ഒരു പ്രഖ്യാപനം ചേർക്കാതെ സന്ദർഭത്തിലെ സാധാരണ സ്വയംതിരിച്ചറിയൽ നൽകുന്നു; അതേസമയം അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ സംഭാഷണശൈലി. ‘ഇയാൾ/അയാൾ’ എന്ന രൂപങ്ങൾ ദൃശ്യസന്ദർഭത്തിലെ ചൂണ്ടിക്കാട്ടലും വ്യക്തിവ്യത്യാസവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
