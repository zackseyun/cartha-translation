revisions:
- from: 'അപ്പോൾ പരീശന്മാരും അവനോട് വീണ്ടും, അവന് എങ്ങനെയാണ് കാഴ്ച ലഭിച്ചതെന്ന്[b] ചോദിച്ചു. അവൻ അവരോട് പറഞ്ഞു: “അവൻ എന്റെ കണ്ണുകളിൽ ചെളി[a] വെച്ചു; ഞാൻ കഴുകി; ഇപ്പോൾ ഞാൻ കാണുന്നു.”'
  to: 'അപ്പോൾ പരീശന്മാരും അവനോട് അവന് എങ്ങനെ കാഴ്ച ലഭിച്ചെന്ന് വീണ്ടും ചോദിച്ചു. അവൻ അവരോടു പറഞ്ഞു: “അവൻ എന്റെ കണ്ണുകൾക്കുമേൽ ചെളി[a] വെച്ചു; ഞാൻ കഴുകി; ഞാൻ കാണുന്നു.”'
