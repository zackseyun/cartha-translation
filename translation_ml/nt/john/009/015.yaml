source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: ml
  text: 'അപ്പോൾ പരീശന്മാരും അവനോട് അവന് എങ്ങനെ കാഴ്ച ലഭിച്ചെന്ന് വീണ്ടും ചോദിച്ചു. അവൻ അവരോടു പറഞ്ഞു: “അവൻ എന്റെ കണ്ണുകൾക്കുമേൽ ചെളി[a] വെച്ചു; ഞാൻ കഴുകി; ഞാൻ കാണുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കളിമണ്ണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: അപ്പോൾ ... വീണ്ടും
  rationale: οὖν ഇവിടെ ശക്തമായ നിഗമനത്തേക്കാൾ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; πάλιν ചോദ്യം ആവർത്തിച്ചതിനെ വ്യക്തമാക്കുന്നു.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: പരീശന്മാരും
  rationale: καί സൂചിപ്പിക്കുന്ന ‘also/too’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഉം’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: ἠρώτων
  choice: ചോദിച്ചു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപത്തിന്റെ തുടരുന്ന/ആവർത്തിക്കുന്ന ഭാവം ‘വീണ്ടും’ എന്ന പദം ഇതിനകം വ്യക്തമാക്കുന്നതിനാൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: πῶς ἀνέβλεψεν
  choice: എങ്ങനെയാണ് കാഴ്ച ലഭിച്ചത്
  rationale: ജന്മനാ അന്ധനായിരുന്നയാൾ കാണാൻ തുടങ്ങിയതിനെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ‘മുകളിലേക്ക് നോക്കി’ എന്ന അനർഥം ഒഴിവാക്കുന്നു.
- source_word: Πηλὸν
  choice: ചെളി
  rationale: πηλός ചെളിയെയോ കളിമണ്ണിനെയോ സൂചിപ്പിക്കാം; ഈ പ്രവൃത്തിവിവരണത്തിൽ സാധാരണ വായനക്കാർക്ക് ‘ചെളി’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: എന്റെ കണ്ണുകളിൽ ... വെച്ചു
  rationale: കണ്ണുകളുടെ മേൽ വസ്തു വെച്ച പ്രവൃത്തി ലളിതവും നേരിട്ടുമായി പകരുന്നു; ‘പുരട്ടി’ എന്ന കൂടുതൽ പ്രത്യേകമായ പ്രവൃത്തി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐνιψάμην
  choice: ഞാൻ കഴുകി
  rationale: മധ്യമപ്രയോഗത്തിന്റെ സ്വയം ചെയ്ത പ്രവൃത്തി മലയാളത്തിൽ കർത്താവിനോടുകൂടിയ ‘കഴുകി’ എന്ന രൂപത്തിൽ സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: βλέπω
  choice: ഇപ്പോൾ ഞാൻ കാണുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ഇപ്പോഴത്തെ ഫലം മലയാളത്തിൽ സ്വാഭാവികവും സജീവവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ ഹ്രസ്വവും നേരിട്ടുമായ മറുപടി നിലനിർത്താൻ അർധവിരാമങ്ങൾ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പ്-ചിഹ്നങ്ങളുടെ സ്ഥാനം അവയുടെ യഥാർഥ പദബന്ധങ്ങളോട് പൊരുത്തപ്പെടുന്നവിധം ശരിയാക്കി: [a] ‘ചെളി’യോടും [b] ‘കാഴ്ച ലഭിച്ചു’വിനോടും ചേർത്തു.'
