id: JHN.9.17
reference: John 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ ആ അന്ധനോട് വീണ്ടും ചോദിച്ചു: “അവൻ നിന്റെ കണ്ണുകൾ തുറന്നതുകൊണ്ട്[b], അവനെക്കുറിച്ച് നീ[a] എന്തു പറയുന്നു?” അവൻ പറഞ്ഞു: “അവൻ ഒരു പ്രവാചകനാണ്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “നീ” എന്നു വ്യക്തമായി ചേർത്തിരിക്കുന്നത് ഊന്നലിനാണ്; “നീതന്നെ എന്തു പറയുന്നു?” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അവൻ നിന്റെ കണ്ണുകൾ തുറന്നതിനാൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “അവൻ പ്രവാചകനാണ്” എന്നും വായിക്കാം. ഗ്രീക്ക് പ്രയോഗത്തിന് കൂടുതൽ പദവിസദൃശമായ ശക്തിയുണ്ടാകാം; എന്നാൽ സന്ദർഭം “ഒരു പ്രവാചകൻ” എന്ന അർഥത്തെയും പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻപത്തെ സംഭാഷണത്തിന്റെ തുടർച്ചയും അതിൽനിന്നുണ്ടാകുന്ന അടുത്ത നടപടിയും സ്വാഭാവികമായ ആഖ്യാനഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τῷ τυφλῷ
  choice: ആ അന്ധനോട്
  rationale: വിശേഷണം നാമമായി പ്രയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് രൂപം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ‘മുമ്പ് അന്ധനായിരുന്ന’ എന്ന വീക്ഷണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന ചോദ്യംചെയ്യലിൽ ചോദ്യം ആവർത്തിക്കപ്പെടുന്നതിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: Τί σὺ λέγεις
  choice: നീ എന്തു പറയുന്നു
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ σὺ നൽകിയ ഊന്നൽ ‘നീ’ എന്ന സർവനാമത്തിലൂടെ പ്രകടമാക്കുന്നു; ‘നിന്റെ അഭിപ്രായം എന്താണ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ὅτι
  choice: തുറന്നതുകൊണ്ട്
  rationale: ഇവിടെ ചോദ്യം ഉന്നയിക്കുന്നതിനുള്ള കാരണം അല്ലെങ്കിൽ അടിസ്ഥാനം സൂചിപ്പിക്കുന്ന വായന സ്വാഭാവികമായി നൽകുന്നു; ‘തുറന്നതിനാൽ’ എന്നതും സാധ്യമാണ്.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: അവൻ നിന്റെ കണ്ണുകൾ തുറന്നു
  rationale: aorist ക്രിയയുടെ പൂർത്തിയായ പ്രവൃത്തിയും മൂലപാഠത്തിലെ ദൃശ്യരൂപവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Προφήτης
  choice: ഒരു പ്രവാചകൻ
  rationale: സന്ദർഭത്തിൽ യേശുവിനെ പ്രവാചകനായി തിരിച്ചറിയുന്ന അനിശ്ചിത/ഗുണസൂചക അർഥം നൽകുന്നു; മൂലപാഠം നിർബന്ധിക്കാത്ത ഒരു സ്ഥിരമായ വിശേഷപദവി മുഖ്യപാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: Προφήτης എന്നത് സാധാരണ നാമമായോ പ്രത്യേക പദവിയായോ വായിക്കണമോ
  choice: ഒരു പ്രവാചകൻ
  alternative: പ്രവാചകൻ
  rationale: സൗഖ്യം പ്രാപിച്ച മനുഷ്യൻ യേശുവിനെക്കുറിച്ചുള്ള തന്റെ വളർന്നുവരുന്ന തിരിച്ചറിവാണ് ഇവിടെ പറയുന്നത്. ‘ഒരു പ്രവാചകൻ’ എന്നത് ആ ആഖ്യാനപുരോഗതി നിലനിർത്തുന്നു; അതേസമയം ഗ്രീക്ക് രൂപത്തിനുണ്ടാകാവുന്ന കൂടുതൽ പദവിസദൃശമായ ശക്തി അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ചോദ്യംചെയ്യലിന്റെ ഭാവം ലളിതമായി നിലനിർത്തി; സഭാവിഭാഗ-വിശിഷ്ട പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകളോടോ ഉപവാക്യങ്ങളോടോ ചേർത്ത് മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
