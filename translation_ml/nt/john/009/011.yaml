id: JHN.9.11
reference: John 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: ml
  text: 'അയാൾ മറുപടി പറഞ്ഞു: “യേശു എന്നു വിളിക്കപ്പെടുന്ന ആ മനുഷ്യൻ ചെളിയുണ്ടാക്കി എന്റെ കണ്ണുകളിൽ പുരട്ടി. പിന്നെ എന്നോട്, ‘ശീലോഹാമിലേക്കു പോയി കഴുകുക’ എന്നു പറഞ്ഞു. അതുകൊണ്ട് ഞാൻ പോയി കഴുകി; എനിക്ക് കാഴ്ച ലഭിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: അയാൾ മറുപടി പറഞ്ഞു
  rationale: ἐκεῖνος എന്ന വ്യക്തമായ സർവനാമം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുകയും സാധാരണ ആഖ്യാനശൈലി പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: യേശു എന്നു വിളിക്കപ്പെടുന്ന ആ മനുഷ്യൻ
  rationale: സംസാരിക്കുന്നയാൾ ഈ ഘട്ടത്തിൽ യേശുവിനെ ഒരു മനുഷ്യനായി മാത്രം തിരിച്ചറിയുന്ന ആഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ നിലപാട് മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: πηλὸν ἐποίησεν
  choice: ചെളിയുണ്ടാക്കി
  rationale: πηλός ചെളിയെയോ കളിമണ്ണിനെയോ സൂചിപ്പിക്കാം; ഉടനെയുള്ള സന്ദർഭത്തിൽ ‘ചെളി’ ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: എന്റെ കണ്ണുകളിൽ പുരട്ടി
  rationale: ἐπιχρίω സൂചിപ്പിക്കുന്ന പുരട്ടുന്ന പ്രവൃത്തി വ്യക്തമായി നൽകുന്നു; ‘അഭിഷേകം ചെയ്തു’ എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആചാരപരമായ ധ്വനി വരുത്താം.
- source_word: εἶπέν μοι ὅτι
  choice: എന്നോട് ... എന്നു പറഞ്ഞു
  rationale: നേരിട്ടുള്ള കല്പന അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: ശീലോഹാമിലേക്കു പോയി കഴുകുക
  rationale: സ്ഥലനാമം മൂലപാഠത്തിലുള്ളതുപോലെ മാത്രം നൽകുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘കുളം’ ആവർത്തിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: അതുകൊണ്ട് ഞാൻ പോയി കഴുകി
  rationale: οὖν സൂചിപ്പിക്കുന്ന ഫലബന്ധവും തുടർച്ചയായ രണ്ടു പ്രവൃത്തികളും ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνέβλεψα
  choice: എനിക്ക് കാഴ്ച ലഭിച്ചു
  rationale: ജന്മാന്ധന്റെ സൗഖ്യസന്ദർഭത്തിൽ ἀναβλέπω എന്നത് വെറുതെ ‘നോക്കി’ എന്നല്ല, കാഴ്ച ലഭിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള സംസാരിക്കുന്നയാളുടെ വിശേഷണം
  choice: യേശു എന്നു വിളിക്കപ്പെടുന്ന ആ മനുഷ്യൻ
  alternative: യേശു എന്ന മനുഷ്യൻ
  rationale: സൗഖ്യം ലഭിച്ചയാളുടെ ഈ ഘട്ടത്തിലെ പരിമിതമായ തിരിച്ചറിവ് സംരക്ഷിക്കുന്നു; പിന്നീടുള്ള ഉയർന്ന ക്രിസ്തുശാസ്ത്രപരമായ ഏറ്റുപറച്ചിൽ ഇവിടെ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ തെരഞ്ഞെടുത്തു; മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പുരോഗതി നിലനിർത്തി.
