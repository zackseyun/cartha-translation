id: JHN.9.41
reference: John 9:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “നിങ്ങൾ അന്ധരായിരുന്നെങ്കിൽ നിങ്ങൾക്കു പാപം ഉണ്ടാകുമായിരുന്നില്ല. എന്നാൽ ഇപ്പോൾ, ‘ഞങ്ങൾ കാണുന്നു’ എന്നു നിങ്ങൾ പറയുന്നു; അതുകൊണ്ട് നിങ്ങളുടെ പാപം നിലനിൽക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പാപം” എന്നതിന് ഇവിടെ “പാപത്തിനുള്ള ഉത്തരവാദിത്വം” എന്ന അർഥച്ചായയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: അന്ധർ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ആത്മീയമായ അന്ധതയെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും വ്യാഖ്യാനപരമായ ‘ആത്മീയമായി’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: οὐκ ἂν εἴχετε
  choice: നിങ്ങൾക്കു ... ഉണ്ടാകുമായിരുന്നില്ല
  rationale: ἄν ചേർന്ന അപൂർണഭൂതകാല ക്രിയ സങ്കൽപ്പവിരുദ്ധമായ ഫലം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἁμαρτίαν
  choice: പാപം
  rationale: ἁμαρτίαയുടെ നേരിട്ടുള്ള സമാനപദമാണിത്. ഇവിടെ കുറ്റബോധ്യതയുടെ അർഥച്ചായ ഉണ്ടായേക്കാമെങ്കിലും പ്രധാനപാഠത്തിൽ അതിനെ അതിയായി നിർവചിക്കുന്നില്ല.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: സങ്കൽപ്പിച്ച അവസ്ഥയും നിലവിലെ യാഥാർഥ്യവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: ‘ഞങ്ങൾ കാണുന്നു’ എന്നു നിങ്ങൾ പറയുന്നു
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിൽനിന്ന് ഒന്നാംപുരുഷ ബഹുവചന ഉദ്ധരണിയിലേക്കുള്ള ഗ്രീക്ക് വാക്യത്തിന്റെ മാറ്റവും അതിലെ വിരോധാഭാസവും സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: നിങ്ങളുടെ പാപം നിലനിൽക്കുന്നു
  rationale: യോഹന്നാന്റെ രചനയിൽ പ്രധാനമായ μένει എന്ന ക്രിയയുടെ തുടർച്ചയുള്ള അവസ്ഥയെ ‘നിലനിൽക്കുന്നു’ സ്വാഭാവികമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അന്ധർ’ ആത്മീയ അന്ധതയെയും ‘പാപം’ ദൈവസന്നിധിയിലെ കുറ്റബോധ്യതയെയും സൂചിപ്പിക്കുന്നതായി പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കണമോ എന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘അന്ധർ’, ‘പാപം’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: “നിങ്ങൾ ആത്മീയമായി അന്ധരായിരുന്നെങ്കിൽ നിങ്ങൾ പാപത്തിൽ കുറ്റക്കാരാകുമായിരുന്നില്ല.”
  rationale: സന്ദർഭം ആത്മീയ ഗ്രഹണത്തെക്കുറിച്ചാണെങ്കിലും അധ്യായത്തിലുടനീളമുള്ള ശാരീരിക അന്ധതയുടെ രൂപകം യേശുവിന്റെ വാക്കുകളിൽ ഉദ്ദേശപൂർവം തുടരുന്നു. വ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് ചേർത്താൽ യോഹന്നാന്റെ ഭാഷയിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനാവശ്യമായി ചുരുങ്ങും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അന്ധർ’, ‘പാപം’, ‘നിലനിൽക്കുന്നു’ എന്നീ ലളിതവും നേരിട്ടുള്ളതുമായ പദങ്ങൾ യോഹന്നാന്റെ രൂപകവും ആവർത്തനശൈലിയും സംരക്ഷിക്കുന്നു. പാദക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘പാപം നിലനിൽക്കുന്നു’ എന്ന പ്രസ്താവനയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
