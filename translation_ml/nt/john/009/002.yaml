id: JHN.9.2
reference: John 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: ml
  text: 'അവന്റെ ശിഷ്യന്മാർ അവനോടു ചോദിച്ചു: “റബ്ബീ, ഇവൻ അന്ധനായി ജനിക്കാൻ പാപം ചെയ്തത് ആര്—ഇവനോ ഇവന്റെ മാതാപിതാക്കളോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരുടെ പാപത്തിന്റെ ഫലമായിട്ടാണ് ഇവൻ അന്ധനായി ജനിച്ചത്?” ഗ്രീക്കിലെ ഉപവാക്യം ശിഷ്യന്മാരുടെ ചോദ്യത്തിൽ അവർ അനുമാനിച്ച ഉദ്ദേശ്യ-അല്ലെങ്കിൽ ഫലബന്ധം സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ചോദിച്ചു
  rationale: ἐρωτάω എന്ന ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ; സന്ദർഭം ആവശ്യപ്പെടാത്ത ഔപചാരികതയോ തീവ്രതയോ ചേർക്കുന്നില്ല.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: ഗുരു-അനുയായി ബന്ധം വ്യക്തമാക്കുന്ന, സുവിശേഷവിവരണത്തിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: λέγοντες
  choice: 'ചോദിച്ചു:'
  rationale: ഗ്രീക്കിലെ ‘ചോദിച്ചു, പറഞ്ഞുകൊണ്ട്’ എന്ന ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ഒറ്റ ക്രിയയിലും തുടർന്നുള്ള നേരിട്ടുള്ള ഉദ്ധരണിയിലും പ്രകടമാകുന്നു.
- source_word: Ῥαββί
  choice: റബ്ബീ
  rationale: യഹൂദ പശ്ചാത്തലമുള്ള അഭിസംബോധനയുടെ ചരിത്രസ്വഭാവം നിലനിർത്തുന്ന ലിപ്യന്തരണം.
- source_word: τίς
  choice: ആര്
  rationale: ഉത്തരവാദിയായ വ്യക്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἥμαρτεν
  choice: പാപം ചെയ്തത്
  rationale: ἁμαρτάνω എന്ന ക്രിയയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാപദസമുച്ചയമായി നൽകുന്നു.
- source_word: οὗτος
  choice: ഇവൻ
  rationale: സന്നിഹിതനായ പുരുഷനെ ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ നേരിട്ടുള്ള, സംക്ഷിപ്തമായ മലയാളരൂപം.
- source_word: γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: γονεῖς എന്ന ബഹുവചനപദത്തിന്റെ കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ തുല്യപദം.
- source_word: ἵνα
  choice: ജനിക്കാൻ
  rationale: ചോദ്യത്തിൽ ശിഷ്യന്മാർ മുൻകൂട്ടി കരുതുന്ന പാപവും ജന്മാന്ധതയും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അതിനെ വിവരണകർത്താവിന്റെ അംഗീകൃത കാരണവാദമായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: τυφλὸς
  choice: അന്ധനായി
  rationale: ജനനസമയത്തെ അവസ്ഥ സൂചിപ്പിക്കുന്ന predicate adjective-ന്റെ കൃത്യമായ മലയാളപ്രയോഗം.
- source_word: γεννηθῇ
  choice: ജനിക്കാൻ
  rationale: ἵνα നിയന്ത്രിക്കുന്ന aorist passive subjunctive-ന്റെ ആശ്രിതബന്ധം മലയാള infinitival ഘടനയിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശിഷ്യന്മാരുടെ ചോദ്യത്തിലെ ἵνα സൂചിപ്പിക്കുന്ന പാപവും ജന്മാന്ധതയും തമ്മിലുള്ള ബന്ധം
  choice: “അന്ധനായി ജനിക്കാൻ” എന്നു നൽകി, ശിഷ്യന്മാർ അനുമാനിച്ച ബന്ധം അവരുടെ ചോദ്യമായി നിലനിർത്തി.
  alternative: “അതിന്റെ ഫലമായി ഇവൻ അന്ധനായി ജനിച്ചോ?” / “ഇവൻ അന്ധനായി ജനിക്കത്തക്കവണ്ണം”
  rationale: വാക്യം ശിഷ്യന്മാരുടെ ധാരണ റിപ്പോർട്ട് ചെയ്യുന്നതാണ്; വ്യക്തിയുടെയോ മാതാപിതാക്കളുടെയോ പാപം ജന്മാന്ധതയ്ക്ക് കാരണമാണെന്ന് വിവരണകർത്താവ് ഉപദേശിക്കുന്നില്ല. അതിനാൽ ഗ്രീക്കിലെ ഉദ്ദേശ്യ/ഫല ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘റബ്ബീ’ എന്ന ചരിത്രപരമായ അഭിസംബോധന നിലനിർത്തി; ചോദ്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ഗ്രീക്ക് participle മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ മുഖ്യക്രിയയിൽ ഉൾപ്പെടുത്തി.
