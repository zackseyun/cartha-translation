    rationale: ‘നിങ്ങൾക്കും ... എന്നുണ്ടോ?’ മലയാളത്തിൽ ഒരു നിഷ്പക്ഷ ചോദ്യമായി കേൾക്കാം. ഗ്രീക്ക് μήയുടെ പ്രതീക്ഷിത നിഷേധോത്തരം വിവർത്തനത്തിൽ പ്രകടമാക്കേണ്ടതാണ്. ‘...ആഗ്രഹിക്കുന്നില്ലല്ലോ?’ അതു സ്വാഭാവികമായി നൽകുന്നു.
