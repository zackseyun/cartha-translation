  rationale: ഗ്രീക്കിലെ μή മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കാൻ അവസാന ചോദ്യം നിഷേധപ്രതീക്ഷയുള്ള സ്വാഭാവിക മലയാളചോദ്യമായി പരിഷ്കരിച്ചു. മറ്റെല്ലാ ഘടകങ്ങളും—മുമ്പേ പറഞ്ഞത്, ശ്രദ്ധിക്കാതിരുന്നത്, വീണ്ടും കേൾക്കാനുള്ള ചോദ്യം, ‘അവന്റെ ശിഷ്യന്മാർ’ എന്ന ബന്ധം, ‘ആയിത്തീരുക’ എന്ന നിലമാറ്റഭാവം—നിലനിർത്തി. അടിക്കുറിപ്പ് b മുഖ്യപാഠത്തിലെ പരിഷ്കൃത വ്യാകരണഭാവത്തോടു ചേർത്ത് വ്യക്തമാക്കി.
