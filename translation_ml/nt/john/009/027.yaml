id: JHN.9.27
reference: John 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: ml
  text: 'അവൻ അവരോടു മറുപടി പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു നേരത്തേ പറഞ്ഞല്ലോ; എന്നാൽ നിങ്ങൾ ശ്രദ്ധിച്ചില്ല.[a] വീണ്ടും കേൾക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് എന്തിന്? നിങ്ങളും അവന്റെ ശിഷ്യന്മാരായിത്തീരാൻ ആഗ്രഹിക്കുന്നില്ലല്ലോ?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ കേട്ടില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കേൾക്കുക’ എന്നും ‘ശ്രദ്ധിച്ചു കേൾക്കുക’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ പറഞ്ഞതു ചെവിക്കൊള്ളാതിരിക്കുക എന്ന ഭാവമാണ് സാധ്യതയേറിയത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തീർച്ചയായും നിങ്ങളും അവന്റെ ശിഷ്യന്മാരായിത്തീരാൻ ആഗ്രഹിക്കുന്നില്ലല്ലോ?” ഗ്രീക്കിലെ ചോദ്യം നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: അവൻ അവരോടു മറുപടി പറഞ്ഞു
  rationale: സാധാരണ ആഖ്യാനപ്രയോഗമായ ἀποκρίνομαι എന്നതിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം; αὐτοῖς എന്നതും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἤδη
  choice: നേരത്തേ
  rationale: മുമ്പുതന്നെ പറഞ്ഞ കാര്യമാണെന്ന ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐκ ἠκούσατε
  choice: നിങ്ങൾ ശ്രദ്ധിച്ചില്ല
  rationale: ἀκούω എന്നതിന് ‘കേൾക്കുക’ എന്നും ‘ശ്രദ്ധിച്ചു കേൾക്കുക/അനുസരിക്കുക’ എന്നും അർഥമാകാം. ഇവിടെ ശബ്ദം കേൾക്കാതിരുന്നതല്ല, പറഞ്ഞതു സ്വീകരിക്കാതിരുന്നതാണ് ശാസനയുടെ കേന്ദ്രം; അതിനാൽ ‘ശ്രദ്ധിച്ചില്ല’ യോജിക്കുന്നു.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: വീണ്ടും കേൾക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് എന്തിന്?
  rationale: τί ഇവിടെ സന്ദർഭത്തിൽ അസഹിഷ്ണുത കലർന്ന ‘എന്തിന്?’ എന്ന അർഥത്തിൽ സ്വാഭാവികമാണ്; πάλιν, θέλετε, ἀκούειν എന്നിവയുടെ ഘടകങ്ങളും സംരക്ഷിക്കുന്നു.
- source_word: μὴ καὶ ὑμεῖς
  choice: നിങ്ങൾക്കും ... എന്നുണ്ടോ?
  rationale: καίയുടെ ‘നിങ്ങളും’ എന്ന ഊന്നൽ ‘നിങ്ങൾക്കും’ നിലനിർത്തുന്നു. μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന പരിഹാസചോദ്യത്തിന്റെ ഭാവം നൽകുന്നു; മലയാളത്തിലെ സന്ദർഭവും ചോദ്യംചെയ്യുന്ന സ്വരവും അത് വഹിക്കുന്നു.
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: അവന്റെ ശിഷ്യന്മാരായിത്തീരാൻ
  rationale: αὐτοῦ μαθηταί എന്നത് സ്വാഭാവികമായി ‘അവന്റെ ശിഷ്യന്മാർ’ എന്നും γενέσθαιയുടെ ഒരു നിലയിലേക്കു വരുന്നതെന്ന ഭാവം ‘ആയിത്തീരുക’ എന്നും പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: അവസാന ചോദ്യത്തിന്റെ വാചകഭാവം
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന പരിഹാസചോദ്യമായി മുഖ്യപാഠത്തിൽ അവതരിപ്പിച്ചു.
  alternative: “നിങ്ങൾക്കും അവന്റെ ശിഷ്യന്മാരായിത്തീരണമെന്നില്ലല്ലോ?” അല്ലെങ്കിൽ “തീർച്ചയായും നിങ്ങൾക്കും ... ആകണമെന്നില്ലല്ലോ?”
  rationale: μή സാധാരണയായി നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തെ സൂചിപ്പിക്കുന്നു. എന്നാൽ മലയാളത്തിൽ അതിനെ അത്യധികം വിശദീകരിക്കുന്ന നിഷേധഘടന ചേർത്താൽ വാക്യം കൃത്രിമമാകാം; അതിനാൽ സ്വാഭാവിക ചോദ്യം മുഖ്യപാഠത്തിലും വ്യാകരണസൂചന അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. സൗഖ്യം പ്രാപിച്ച മനുഷ്യന്റെ അസഹിഷ്ണുതയും പരിഹാസവും നിലനിർത്തിയെങ്കിലും അനാവശ്യമായി കടുപ്പിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
