- from: 'അവൻ അവരോടു മറുപടി പറഞ്ഞു: “ഞാൻ നിങ്ങളോടു നേരത്തേ പറഞ്ഞല്ലോ; എന്നാൽ നിങ്ങൾ ശ്രദ്ധിച്ചില്ല.[a] വീണ്ടും കേൾക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് എന്തിന്? നിങ്ങൾക്കും അവന്റെ ശിഷ്യന്മാരായിത്തീരണമെന്നുണ്ടോ?”[b]'
