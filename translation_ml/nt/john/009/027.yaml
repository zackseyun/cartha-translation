  source_fidelity: മുഖ്യപാഠത്തിലെ ആദ്യ രണ്ടു വാക്യങ്ങളും ഗ്രീക്കിനോട് നന്നായി പൊരുത്തപ്പെടുന്നു. എന്നാൽ അവസാന ചോദ്യത്തിലെ ഗ്രീക്ക് μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നുവെന്ന വ്യാകരണസൂചന മുഖ്യപാഠത്തിലെ സാധാരണ ‘...ഉണ്ടോ?’ എന്ന ചോദ്യത്തിൽ വ്യക്തമായി പ്രതിഫലിക്കുന്നില്ല.
  naturalness: ‘അവൻ അവരോടു മറുപടി പറഞ്ഞു,’ ‘വീണ്ടും കേൾക്കാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നത് എന്തിന്?’ എന്നിവ സ്വാഭാവിക ആധുനിക നിലവാരമലയാളമാണ്. ‘ആഗ്രഹിക്കുന്നില്ലല്ലോ?’ എന്ന രൂപം ഇവിടെ പരിഹാസവും നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഭാവവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
