- from: ഈ മനുഷ്യൻ ദൈവത്തിൽനിന്നുള്ളവൻ അല്ലായിരുന്നെങ്കിൽ[a], അവന് ഒന്നും ചെയ്യാൻ കഴിയുമായിരുന്നില്ല.
