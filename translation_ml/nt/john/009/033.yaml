  source_fidelity: 'The draft accurately represents the Greek conditional argument: εἰ μὴ with the imperfect ἦν is conveyed as a counterfactual condition, παρὰ θεοῦ retains the broad sense of source as ‘from God,’ and οὐκ ἠδύνατο ποιεῖν οὐδέν is faithfully rendered as total inability.'
