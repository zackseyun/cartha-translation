  terminology: ‘ദൈവത്തിൽനിന്ന്’ appropriately avoids overinterpreting the phrase as ‘sent by God’ or ‘authorized by God.’ ‘ഈ മനുഷ്യൻ,’ ‘ഒന്നും,’ and ‘ചെയ്യാൻ കഴിയുമായിരുന്നില്ല’ are suitable in register and meaning.
