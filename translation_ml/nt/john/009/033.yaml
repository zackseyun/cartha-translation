id: JHN.9.33
reference: John 9:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: ml
  text: ഈ മനുഷ്യൻ ദൈവത്തിൽനിന്നുള്ളവനായിരുന്നില്ലെങ്കിൽ[a], അവന് ഒന്നും ചെയ്യാൻ കഴിയുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഈ മനുഷ്യൻ ദൈവത്തിൽനിന്നുള്ളവനല്ലെങ്കിൽ.’'
    reason: εἰ μὴ എന്നതിന് ‘അല്ലായിരുന്നെങ്കിൽ’ എന്നതിനുപകരം ‘അല്ലെങ്കിൽ’ എന്ന സംക്ഷിപ്ത സോപാധികരൂപവും ഉപയോഗിക്കാം.
lexical_decisions:
- source_word: εἰ μὴ
  choice: അല്ലായിരുന്നെങ്കിൽ
  rationale: നിഷേധാത്മകമായ സോപാധിക ഘടന (‘അല്ലായിരുന്നെങ്കിൽ’) സുതാര്യമായി നിലനിർത്തുകയും, സന്ദർഭത്തിലെ യാഥാർഥ്യവിരുദ്ധമായ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἦν
  choice: ആയിരുന്നെങ്കിൽ
  rationale: അപൂർണ ഭൂതകാല ക്രിയാരൂപം ഇവിടെ സോപാധിക വാക്യത്തിൽ വരുന്നതിനാൽ, ‘ആയിരുന്നെങ്കിൽ’ എന്ന രൂപം മലയാളത്തിൽ ഉദ്ദേശിച്ച യാഥാർഥ്യവിരുദ്ധ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം ചർച്ചചെയ്യപ്പെടുന്ന യേശുവിനെയാണ് പുരുഷലിംഗ ഏകവചന നിർദേശസർവനാമം സൂചിപ്പിക്കുന്നത്; ‘ഈ മനുഷ്യൻ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: παρὰ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവൻ
  rationale: παρά + ജനിറ്റീവ് ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിൽനിന്നുള്ളവൻ’ അതിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘ദൈവം അയച്ചവൻ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപദപ്രയോഗത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കും.
- source_word: οὐκ ἠδύνατο
  choice: കഴിയുമായിരുന്നില്ല
  rationale: കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സോപാധികമായ വാദത്തിന്റെ ഫലവാക്യത്തിൽ സ്വാഭാവിക മലയാളമായി നൽകുന്നു.
- source_word: ποιεῖν
  choice: ചെയ്യാൻ
  rationale: ποιέω എന്ന വിശാലാർഥമുള്ള ക്രിയയ്ക്ക് ഇവിടെ ‘ചെയ്യുക’ സ്വാഭാവികമാണ്; അത്ഭുതപ്രവൃത്തികൾ എന്ന വ്യാഖ്യാനം പാഠത്തിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὐδέν
  choice: ഒന്നും
  rationale: നിഷേധക്രിയയോടൊപ്പം ‘ഒന്നും’ സമ്പൂർണമായ കഴിവില്ലായ്മയുടെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള ‘ദൈവത്തിൽനിന്ന്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘ദൈവത്തിൽനിന്നുള്ളവൻ’ എന്ന മൂലഭാഷയുടെ വിശാലമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവം അയച്ചവൻ’ അല്ലെങ്കിൽ ‘ദൈവത്താൽ അധികാരപ്പെടുത്തപ്പെട്ടവൻ’
  rationale: ഈ വാക്യം യേശുവിന്റെ പ്രവൃത്തികളുടെ ദൈവിക ഉറവിടത്തെയോ അംഗീകാരത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പ്രയോഗം ദൗത്യത്തെയോ അസ്തിത്വസ്വഭാവത്തെയോ കുറിച്ചുള്ള കൂടുതൽ സാങ്കേതിക നിർവചനം നൽകുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും പിരിമുറുക്കവും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. വാക്യത്തിന്റെ യാഥാർഥ്യവിരുദ്ധ സോപാധിക ഭാവം ‘അല്ലായിരുന്നെങ്കിൽ … കഴിയുമായിരുന്നില്ല’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കി; മൂലത്തിലുള്ള ദൈവശാസ്ത്രപരമായ വിശാലത ചുരുക്കിയിട്ടില്ല.
