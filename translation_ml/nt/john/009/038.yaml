  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “കർത്താവേ,[a] ഞാൻ വിശ്വസിക്കുന്നു.” അവൻ അവനെ ആരാധിച്ചു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അയ്യാ.” ഗ്രീക്ക് κύριε എന്ന പദം ആദരസൂചകമായ സംബോധനമായും ഉപയോഗിക്കാം; ഇവിടെ വിശ്വാസപ്രഖ്യാപനവും ആരാധനയും ചേർന്ന സന്ദർഭം കണക്കിലെടുത്ത് “കർത്താവേ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “അവന്റെ മുമ്പിൽ കുനിഞ്ഞുവണങ്ങി” / “അവനെ ആദരവോടെ വണങ്ങി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കുനിഞ്ഞുവണങ്ങുക അല്ലെങ്കിൽ ആദരവ് പ്രകടിപ്പിക്കുക എന്ന അർഥവും വരാം; ഇവിടെ സന്ദർഭം കണക്കിലെടുത്ത് “ആരാധിച്ചു” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: അപ്പോൾ അവൻ
  rationale: പ്രത്യയംപോലെ പ്രവർത്തിക്കുന്ന ὁ സൗഖ്യം പ്രാപിച്ച മനുഷ്യനെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥയുടെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിയിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: φημίയുടെ ഭൂതകാലരൂപം സാധാരണ സംഭാഷണാവതാരികയാണ്; ‘പറഞ്ഞു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Πιστεύω
  choice: ഞാൻ വിശ്വസിക്കുന്നു
  rationale: യേശുവിന്റെ സ്വയംവെളിപ്പെടുത്തലിനുള്ള നേരിട്ടുള്ള മറുപടിയാണിത്. യോഹന്നാനിലെ ‘വിശ്വസിക്കുക’ എന്ന പ്രധാന ആശയബന്ധവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριε ആദരസൂചകമായ സംബോധനയായിരിക്കാമെങ്കിലും, ഇവിടെ വിശ്വാസപ്രഖ്യാപനവും തുടർന്നുള്ള προσκύνησις-ഉം ഉള്ളതിനാൽ ‘കർത്താവേ’യാണ് മുഖ്യപാഠത്തിൽ യോജിച്ചത്.
- source_word: προσεκύνησεν
  choice: ആരാധിച്ചു
  rationale: προσκυνέω കുനിഞ്ഞുവണങ്ങുന്നതിനെയോ ആദരാഞ്ജലി അർപ്പിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം. എന്നാൽ യേശുവിലുള്ള വിശ്വാസപ്രഖ്യാപനത്തിനു പിന്നാലെയുള്ള ഈ സന്ദർഭത്തിൽ ‘ആരാധിച്ചു’ എന്നത് ശക്തമായ സന്ദർഭാർഥം നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῷ
  choice: യേശുവിനെ
  rationale: ഗ്രീക്കിൽ സർവനാമം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും, മലയാളത്തിൽ തുടർച്ചയായ ‘അവൻ’ രൂപങ്ങൾ മൂലമുണ്ടാകാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പരാമർശവിഷയമായ യേശുവിന്റെ പേര് വ്യക്തമായി നൽകി.
theological_decisions:
- issue: κύριε എന്നത് കേവലം ആദരസൂചകമായ ‘അങ്ങേ’ എന്നാണോ, ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം വഹിക്കുന്ന ‘കർത്താവേ’ എന്നാണോ നൽകേണ്ടത്
  choice: കർത്താവേ
  alternative: അങ്ങേ
  rationale: യേശുവിന്റെ സ്വയംവെളിപ്പെടുത്തലിനു പിന്നാലെ ആ മനുഷ്യൻ വിശ്വാസം പ്രഖ്യാപിക്കുകയും അവനെ προσκυνέω ചെയ്യുകയും ചെയ്യുന്നതിനാൽ സന്ദർഭം ഉയർന്ന അർഥത്തെ അനുകൂലിക്കുന്നു. എങ്കിലും ഗ്രീക്കുപദത്തിന്റെ ആദരസൂചക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: προσεκύνησεν എന്നത് ‘ആരാധിച്ചു’ എന്നാണോ, കുറച്ച് വ്യക്തത കുറഞ്ഞ ‘കുനിഞ്ഞുവണങ്ങി’ എന്നാണോ നൽകേണ്ടത്
  choice: ആരാധിച്ചു
  alternative: അവന്റെ മുമ്പിൽ കുനിഞ്ഞുവണങ്ങി
  rationale: പ്രവൃത്തിയുടെ ലക്ഷ്യം യേശുവാണ്; അത് വ്യക്തമായ വിശ്വാസപ്രഖ്യാപനത്തിനു തൊട്ടുപിന്നാലെയാണ് വരുന്നത്. അതിനാൽ ‘ആരാധിച്ചു’ സന്ദർഭത്തിലെ സാധ്യതയേറിയ അർഥം പകർത്തുന്നു. ശരീരഭാവം/ആദരാഞ്ജലി എന്ന നിഘണ്ടുസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിട്ടുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നേരിട്ടുള്ള വാക്കിൽ സ്വാഭാവികമായ ‘കർത്താവേ’യും ‘ഞാൻ വിശ്വസിക്കുന്നു’യും നിലനിർത്തി. സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കാൻ അവസാന ഘടകത്തിൽ ‘യേശുവിനെ’ എന്നു വ്യക്തമാക്കി.
