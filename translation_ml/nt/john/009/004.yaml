  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: ml
  text: പകലായിരിക്കുമ്പോൾ എന്നെ അയച്ചവന്റെ പ്രവൃത്തികൾ നാം ചെയ്യണം; ആർക്കും പ്രവർത്തിക്കാൻ കഴിയാത്ത രാത്രി വരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “എന്നെ അയച്ചവന്റെ പ്രവൃത്തികൾ ഞാൻ ചെയ്യണം.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς δεῖ
  choice: നാം ചെയ്യണം
  rationale: ἡμᾶς എന്ന ബഹുവചനത്തെ ‘നാം’ എന്നും δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകതയെ സ്വാഭാവികമായി ‘ചെയ്യണം’ എന്നും നൽകി.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: പ്രവൃത്തികൾ ചെയ്യണം
  rationale: സജാതീയമായ ക്രിയയും നാമവും മലയാളത്തിൽ ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവികമായി നൽകുന്നു; യോഹന്നാനിലെ ദൈവം ഏല്പിച്ച പ്രവൃത്തികളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοῦ πέμψαντός με
  choice: എന്നെ അയച്ചവന്റെ
  rationale: നാമവൽക്കരിച്ച കൃതന്തത്തെ വ്യക്തവും സംക്ഷിപ്തവുമായ മലയാളപ്രയോഗത്തിൽ നൽകി; അയച്ചവൻ ആരെന്നത് വാക്യത്തിൽ അധികമായി വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: ἕως ἡμέρα ἐστίν
  choice: പകലായിരിക്കുമ്പോൾ
  rationale: വരാനിരിക്കുന്ന രാത്രിയോടുള്ള കാലവ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔρχεται νὺξ
  choice: രാത്രി വരുന്നു
  rationale: വർത്തമാനകാല രൂപത്തിന്റെ ആസന്നഭാവം നിലനിർത്തുന്ന ലളിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: ആർക്കും പ്രവർത്തിക്കാൻ കഴിയാത്ത
  rationale: നിഷേധവും കഴിവില്ലായ്മയും ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: 'വാക്യാരംഭത്തിലെ പാഠഭേദം: ἡμᾶς (‘നാം’) / ἐμέ (‘ഞാൻ’)'
  choice: എന്നെ അയച്ചവന്റെ പ്രവൃത്തികൾ നാം ചെയ്യണം
  alternative: എന്നെ അയച്ചവന്റെ പ്രവൃത്തികൾ ഞാൻ ചെയ്യണം
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ ἡμᾶς എന്ന ബഹുവചനത്തെ മുഖ്യപാഠത്തിൽ പിന്തുടർന്നു. വ്യാപകമായ ഏകവചന പാഠഭേദം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തി. ‘പ്രവൃത്തികൾ’ എന്ന പദം യോഹന്നാന്റെ ആശയപരമായ ബന്ധം സംരക്ഷിക്കുന്നു.
