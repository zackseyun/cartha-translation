translation:
  language: ml
  text: അവൻ കടന്നുപോകുമ്പോൾ[a], ജന്മനാ അന്ധനായ ഒരു മനുഷ്യനെ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
