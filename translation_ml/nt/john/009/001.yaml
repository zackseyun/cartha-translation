    text: അഥവാ, ‘കടന്നുപോകവെ’; യേശു വഴിയിലൂടെ പോകുന്ന സമയത്താണ് ആ മനുഷ്യനെ കണ്ടതെന്ന് ഗ്രീക്ക് കൃദന്തം ചിത്രീകരിക്കുന്നു.
