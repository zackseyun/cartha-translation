lexical_decisions:
- source_word: Καὶ
  choice: അവൻ കടന്നുപോകുമ്പോൾ
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബന്ധകമായ Καὶ മുൻസന്ദർഭത്തോടുള്ള ആഖ്യാനത്തുടർച്ച സൂചിപ്പിക്കുന്നു. എന്നാൽ മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘പിന്നെ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യക്തമായ കാലക്രമസൂചന നൽകാം; അതിനാൽ തുടർന്നുവരുന്ന സമയവാക്യവുമായി സ്വാഭാവികമായി സംയോജിപ്പിച്ചു.
- source_word: παράγων
  choice: കടന്നുപോകുമ്പോൾ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തം εἶδεν എന്ന മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പശ്ചാത്തലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കടന്നുപോകുമ്പോൾ’ ആ സമകാലികത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു; ‘ശ്രദ്ധിച്ചു’ എന്നത് മൂലത്തിൽ നിർബന്ധമില്ലാത്ത വ്യാഖ്യാനഭാവം ചേർക്കും.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: ἄνθρωπος ഇവിടെ ഒരു പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. തുടർസന്ദർഭത്തിൽ ആ വ്യക്തി പുരുഷനാണെങ്കിലും, ‘മനുഷ്യൻ’ എന്ന സ്വാഭാവിക മലയാളപദം മൂലപദത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും അനാവശ്യമായ വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τυφλὸν
  choice: അന്ധനായ
  rationale: ἄνθρωπον എന്ന നാമത്തെ വിശേഷിപ്പിക്കുന്ന പദം മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: ἐκ γενετῆς
  choice: ജന്മനാ
  rationale: ജനിച്ചതു മുതൽ നിലനിന്നിരുന്ന അവസ്ഥയെ സംക്ഷിപ്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗത്തിൽ കൃത്യമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ἄνθρωπον എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: ഒരു മനുഷ്യനെ
  alternative: ഒരു പുരുഷനെ
  rationale: ἄνθρωπος സ്വതവേ ‘മനുഷ്യൻ/വ്യക്തി’ എന്നും അർഥമാക്കാം; തുടർകഥയിൽ വ്യക്തി പുരുഷനാണെന്ന് വ്യക്തമാകുന്നു. ഈ വാക്യത്തിൽ ‘മനുഷ്യൻ’ സ്വാഭാവികവും ഉറവിടപദത്തിന്റെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കർത്താവായ യേശുവിന്റെ പേര് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ ഗ്രീക്കിലെപ്പോലെ സർവനാമരൂപം നിലനിർത്തി. ‘ജന്മനാ അന്ധനായ’ എന്നത് കൃത്യവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പ്രയോഗമാണ്.
