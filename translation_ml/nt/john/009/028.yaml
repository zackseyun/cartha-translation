id: JHN.9.28
reference: John 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: ml
  text: 'അവർ അവനെ അധിക്ഷേപിച്ചുകൊണ്ട് പറഞ്ഞു: “നീയാണ് ആ മനുഷ്യന്റെ ശിഷ്യൻ[a]; ഞങ്ങളാകട്ടെ മോശെയുടെ ശിഷ്യന്മാരാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീ അവന്റെ ശിഷ്യനാണ്.” ഗ്രീക്കിൽ “അയാളുടെ/ആ മനുഷ്യന്റെ” എന്നർഥമുള്ള നിർദേശകസർവനാമമാണ്; ഇവിടെ അതിന് അവജ്ഞ കലർന്ന അകൽച്ചയുടെ സ്വരം ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: അധിക്ഷേപിച്ചുകൊണ്ട്
  rationale: വാക്കുകളാൽ നിന്ദിക്കുകയും ആക്ഷേപിക്കുകയും ചെയ്യുക എന്ന λοιδορέωയുടെ ശക്തമായ അർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള ‘പറഞ്ഞു’ എന്ന ക്രിയയുമായി സ്വാഭാവികമായി ചേരുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സൗഖ്യം പ്രാപിച്ച മനുഷ്യനെയാണ് നേരിട്ടുള്ള കർമമായി സൂചിപ്പിക്കുന്നത്.
- source_word: καὶ εἶπον
  choice: പറഞ്ഞു
  rationale: മലയാളത്തിൽ മുൻക്രിയയെ ‘-കൊണ്ട്’ രൂപത്തിൽ ചേർത്തതിനാൽ ഗ്രീക്കിലെ ക്രിയാസമന്വയം സ്വാഭാവികമായ ഒറ്റ വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Σὺ μαθητὴς εἶ
  choice: നീയാണ് … ശിഷ്യൻ
  rationale: വാക്യാരംഭത്തിലെ Σὺ നൽകുന്ന ഊന്നൽ ‘നീയാണ്’ എന്ന രൂപം വ്യക്തമായി നിലനിർത്തുന്നു; μαθητής എന്നതിന് യോഹന്നാനിലെ അനുയായിത്വബന്ധം സൂക്ഷിക്കുന്ന ‘ശിഷ്യൻ’ ഉപയോഗിച്ചു.
- source_word: ἐκείνου
  choice: ആ മനുഷ്യന്റെ
  rationale: ദൂരവത്കരണവും ഈ ശത്രുതാപരമായ സന്ദർഭത്തിൽ സാധ്യമായ അവജ്ഞാഭാവവും സൂക്ഷിക്കുന്നു; ‘അവന്റെ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന്റെ സ്വരം വ്യക്തമാക്കുന്നു.
- source_word: ἡμεῖς δὲ
  choice: ഞങ്ങളാകട്ടെ
  rationale: δέയുടെ വൈരുധ്യവും ἡμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: മോശെയുടെ ശിഷ്യന്മാരാണ്
  rationale: ബന്ധസൂചകമായ ജനിറ്റീവും ബഹുവചന μαθηταίയും നേരായും സ്വാഭാവികമായും നൽകുന്നു; രണ്ടു ഭാഗങ്ങളിലും ‘ശിഷ്യൻ/ശിഷ്യന്മാർ’ എന്ന പദസാമ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന ἐκείνου എന്നതിന്റെ ഭാവം
  choice: ‘ആ മനുഷ്യന്റെ’ എന്ന് നൽകി സംസാരിക്കുന്നവരുടെ അകൽച്ചയും സന്ദർഭസൂചിതമായ അവജ്ഞയും നിലനിർത്തി.
  alternative: ‘അവന്റെ’ എന്ന് കൂടുതൽ നിഷ്പക്ഷമായി നൽകാം.
  rationale: ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന് സ്വതവേ എല്ലായിടത്തും അവജ്ഞാഭാവം നിർബന്ധമല്ല; എങ്കിലും ഇവിടെ അവർ ആ മനുഷ്യനെ അധിക്ഷേപിക്കുന്ന ശത്രുതാപരമായ സന്ദർഭം അകൽച്ചയുള്ള പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു. ഈ സാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: μαθητής എന്ന പദത്തിന്റെ ഏകീകരിച്ച പരിഭാഷ
  choice: രണ്ടിടത്തും ‘ശിഷ്യൻ/ശിഷ്യന്മാർ’ ഉപയോഗിച്ചു.
  alternative: ‘അനുയായി/അനുയായികൾ’ അല്ലെങ്കിൽ ‘വിദ്യാർഥി/വിദ്യാർഥികൾ’ ഉപയോഗിക്കാം.
  rationale: ഇവിടെ പദം വെറും പഠിതാവിനേക്കാൾ വ്യക്തിയോടുള്ള ബന്ധവും അനുസരണയും സൂചിപ്പിക്കുന്നു; ഒരേ പദം ആവർത്തിക്കുന്നത് യേശുവിനോടും മോശെയോടുമുള്ള അവകാശപ്പെട്ട ബന്ധത്തിന്റെ വാചകവൈരുധ്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നീയാണ് …; ഞങ്ങളാകട്ടെ …’ എന്ന ഘടന മൂലപാഠത്തിലെ ഊന്നലും വൈരുധ്യവും നിലനിർത്തുന്നു. ‘അധിക്ഷേപിച്ചുകൊണ്ട് പറഞ്ഞു’ എന്നത് ശക്തമായ വാക്കാലുള്ള നിന്ദയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
