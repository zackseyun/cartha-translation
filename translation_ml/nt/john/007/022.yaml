source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ മോശെ നിങ്ങൾക്കു പരിച്ഛേദനം നൽകിയിരിക്കുന്നു—അത് മോശെയിൽനിന്നുള്ളതല്ല, പിതാക്കന്മാരിൽനിന്നുള്ളതാണ്[a]—നിങ്ങൾ ശബ്ബത്തിൽ ഒരു പുരുഷനെ പരിച്ഛേദനം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അത് മോശെയിൽനിന്നുള്ളതുകൊണ്ടല്ല, പിതാക്കന്മാരിൽനിന്നുള്ളതുകൊണ്ടാണ്.” ഈ ഇടയ്ക്കുള്ള വാക്കുകൾ പരിച്ഛേദനം മോശെയിൽ ആരംഭിച്ചതല്ലെന്നും പിതാക്കന്മാരിൽനിന്നു വന്നതാണെന്നും വിശദീകരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: യേശുവിന്റെ തുടർന്നുള്ള വിശദീകരണത്തെ അവതരിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾനാമരൂപം ഉപയോഗിക്കുന്നു.
- source_word: δέδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: ഭൂതകാലത്തിൽ നൽകപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ക്രമീകരണമെന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: τὴν περιτομήν
  choice: പരിച്ഛേദനം
  rationale: ഉടമ്പടിയോടു ബന്ധപ്പെട്ട ആചാരത്തെയും അതിന്റെ സ്ഥാപനത്തെയും സൂചിപ്പിക്കുന്ന പതിവായ മലയാളപദം.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: അത് മോശെയിൽനിന്നുള്ളതല്ല, പിതാക്കന്മാരിൽനിന്നുള്ളതാണ്
  rationale: പരിച്ഛേദനത്തിന്റെ ചരിത്രപരമായ ഉറവിടം മോശെയ്ക്കു മുമ്പുള്ള പിതാക്കന്മാരിലാണെന്ന ഇടയ്ക്കുള്ള വിശദീകരണം വികസിപ്പിക്കാതെ വ്യക്തമാക്കുന്നു; ἐκ എന്നതിന്റെ ഉറവിടഭാവം ‘നിന്നുള്ളത്’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἐν σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: ഒരു പ്രത്യേക ശബ്ബത്തെയല്ല, പൊതുവായ ശബ്ബത്താചരണത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക കാലപ്രയോഗം.
- source_word: περιτέμνετε
  choice: നിങ്ങൾ ... പരിച്ഛേദനം ചെയ്യുന്നു
  rationale: അംഗീകരിക്കപ്പെട്ട പതിവാചാരത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലവും ബഹുവചന അഭിസംബോധനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു പുരുഷനെ
  rationale: പരിച്ഛേദനത്തിന്റെ സന്ദർഭത്തിൽ പുരുഷനായ വ്യക്തിയാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെന്ന് വ്യക്തമാക്കുന്നു; പൊതുവായ ‘ഒരാളെ’ എന്ന പ്രയോഗം വരുത്താവുന്ന മങ്ങൽ ഒഴിവാക്കുന്നു.
- source_word: καί
  choice: എന്നിട്ടും
  rationale: മോശെയ്ക്കുമുമ്പുള്ള ഉത്ഭവത്തെക്കുറിച്ചുള്ള ഇടയ്ക്കുള്ള വിശദീകരണത്തിനു ശേഷം പ്രധാന വാക്യത്തിലേക്കു മടങ്ങുന്നതും ശബ്ബത്തിൽ ഈ ആചാരം നടത്തുന്നതിലെ വാദപരമായ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘പിതാക്കന്മാർ’ എന്നതിന്റെ പരാമർശം
  choice: പരിച്ഛേദനം മോശെയിൽനിന്നല്ല, ഗോത്രപിതാക്കന്മാരിൽനിന്നാണ് വന്നതെന്ന ചരിത്രപരമായ അർഥം വിവർത്തനത്തിൽ നിലനിർത്തി.
  alternative: ഇസ്രായേലിന്റെ പൂർവികരെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: യേശുവിന്റെ വാദത്തിന് ആവശ്യമായത് പരിച്ഛേദനം മോശെയുടെ ന്യായപ്രമാണത്തിനു മുമ്പുള്ളതാണെന്ന കാര്യമാണ്. ‘പിതാക്കന്മാർ’ എന്ന മൂലപദസമീപമായ രൂപം കൂടുതൽ സങ്കുചിതമായ വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കാതെ ഈ അർഥപരിധി സംരക്ഷിക്കുന്നു.
- issue: οὐχ ὅτι എന്ന ഘടനയുടെ ബന്ധം
  choice: പരിച്ഛേദനത്തിന്റെ ഉറവിടത്തെ തിരുത്തുന്ന പ്രസ്താവനയായി മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘അത് മോശെയിൽനിന്നുള്ളതുകൊണ്ടല്ല, പിതാക്കന്മാരിൽനിന്നുള്ളതുകൊണ്ടാണ്’ എന്ന കാരണഘടനയായി വായിക്കാം.
  rationale: ഗ്രീക്ക് ഘടനയ്ക്ക് വിശദീകരണപരവും കാരണപരവുമായ അവതരണസാധ്യതയുണ്ട്. മുഖ്യവാചകം ചരിത്രപരമായ ഉറവിടത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; കാരണഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളമാണ് ഉപയോഗിച്ചത്. ‘പരിച്ഛേദനം,’ ‘ശബ്ബത്ത്,’ ‘പിതാക്കന്മാർ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. ഇടയ്ക്കുള്ള വിശദീകരണം ദീർഘരേഖകൾകൊണ്ട് വേർതിരിക്കുകയും അടിക്കുറിപ്പ് ചിഹ്നം [a] മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തുകയും ചെയ്തു.
