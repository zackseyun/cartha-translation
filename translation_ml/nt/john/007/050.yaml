  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: ml
  text: 'അവരിൽ ഒരാളായിരുന്ന നിക്കോദേമൊസ്—നേരത്തേ അവന്റെ അടുക്കൽ വന്നിരുന്നയാൾ—അവരോടു പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും, ആഖ്യാനസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള ഭൂതകാലം പ്രയോഗിച്ചു.
- source_word: Νικόδημος
  choice: നിക്കോദേമൊസ്
  rationale: പേരിന്റെ ഗ്രീക്ക് രൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: സംസാരക്രിയയോടൊപ്പമുള്ള πρός ആർക്കാണ് വാക്ക് അഭിസംബോധന ചെയ്യുന്നതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: നേരത്തേ അവന്റെ അടുക്കൽ വന്നിരുന്നയാൾ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃ分词സമാന ഘടന നിക്കോദേമൊസിനെ തിരിച്ചറിയിക്കുന്ന അനുബന്ധവിവരമായി നൽകി; πρότερον എന്നതിന്റെ സമയമുൻഗണന ‘നേരത്തേ’ എന്നു നിലനിർത്തി. αὐτόν എന്ന സർവനാമം വ്യാഖ്യാനിച്ച് ‘യേശു’ എന്നു മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: അവരിൽ ഒരാളായിരുന്ന
  rationale: നിക്കോദേമൊസ് ആ കൂട്ടത്തിൽപ്പെട്ടവനായിരുന്നു എന്ന പശ്ചാത്തലവിവരം നൽകുന്നു; കാരണാർഥം അനാവശ്യമായി ചേർക്കാതെ കൃ分词സമാന ഭാവം സംരക്ഷിച്ചു.
theological_decisions:
- issue: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον എന്നതിലെ αὐτόν എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: മുഖ്യപാഠത്തിൽ ‘അവന്റെ’ എന്നു സർവനാമരൂപം നിലനിർത്തി.
  alternative: ‘യേശുവിന്റെ അടുക്കൽ’ എന്നു സൂചിതനെ നേരിട്ട് വ്യക്തമാക്കുക.
  rationale: യോഹന്നാൻ 3:1–2-ലെ വിശാലസന്ദർഭത്തിൽ സൂചിതൻ യേശുവാണെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം പേര് ആവർത്തിക്കാതെ സർവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സന്ദർഭസൂചനയെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനമായി ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ അനുബന്ധഘടകങ്ങൾ ദീർഘമായ മലയാളവാക്യം അസ്പഷ്ടമാകാതിരിക്കാൻ ഡാഷുകൾക്കിടയിൽ നൽകി; വാക്യം അടുത്ത വാക്യത്തിലേക്കുള്ള നേരിട്ടുള്ള പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്നതിനാൽ അവസാനത്തിൽ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
