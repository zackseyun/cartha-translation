id: JHN.7.33
reference: John 7:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു പറഞ്ഞു: “ഇനി അല്പകാലം കൂടി ഞാൻ നിങ്ങളോടൊപ്പമുണ്ട്; ഞാൻ എന്നെ അയച്ചവന്റെ അടുക്കലേക്ക് പോകുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ സംഭവങ്ങളോടുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Ἔτι χρόνον μικρόν
  choice: ഇനി അല്പകാലംകൂടെ
  rationale: ἔτι എന്നതിലെ ‘ഇനിയും/കൂടെ’ എന്ന ശേഷിക്കുന്ന സമയത്തിന്റെ ഭാവവും χρόνον μικρόν എന്നതിലെ ഹ്രസ്വകാലവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: ഞാൻ നിങ്ങളോടൊപ്പമുണ്ട്
  rationale: വർത്തമാനകാലത്തിലുള്ള യേശുവിന്റെ സാന്നിധ്യം ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: καὶ ὑπάγω
  choice: പിന്നെ ... ഞാൻ പോകുന്നു
  rationale: καί അടിസ്ഥാനമായി ബന്ധിപ്പിക്കുമ്പോഴും മുൻപുള്ള ‘ഇനി അല്പകാലംകൂടെ’ എന്ന സമയസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി ആവശ്യപ്പെടുന്ന തുടർച്ച ‘പിന്നെ’ വ്യക്തമാക്കുന്നു; ὑπάγωയുടെ ലളിതമായ പുറപ്പെടൽഭാവം ‘പോകുന്നു’ നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν πέμψαντά με
  choice: എന്നെ അയച്ചവന്റെ അടുക്കലേക്കു
  rationale: നാമവൽക്കരിച്ച കൃതന്തത്തിന്റെ ‘എന്നെ അയച്ചവൻ’ എന്ന പരോക്ഷമായ ബന്ധപ്രയോഗം നിലനിർത്തുകയും πρὸς എന്ന ദിശ/വ്യക്തിയിലേക്കുള്ള ഗതി ‘അടുക്കലേക്കു’ കൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ ആരെന്ന തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘എന്നെ അയച്ചവൻ’ എന്ന പരോക്ഷപ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്നെ അയച്ച പിതാവ്’
  rationale: യോഹന്നാന്റെ വിശാലസന്ദർഭത്തിൽ ഇത് പിതാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം ഇവിടെ ‘പിതാവ്’ എന്നു നേരിട്ട് പറയുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ പരോക്ഷത സംരക്ഷിച്ചു.
- issue: ὑπάγωയിലെ പുറപ്പെടലും പിതാവിലേക്കുള്ള മടങ്ങിപ്പോക്കും
  choice: ‘പോകുന്നു’ എന്ന ലളിതമായ പ്രയോഗം
  alternative: ‘മടങ്ങിപ്പോകുന്നു’ അല്ലെങ്കിൽ ‘വിട്ടുപോകുന്നു’
  rationale: യോഹന്നാനിൽ ഈ ക്രിയയ്ക്ക് ദൈവശാസ്ത്രപരമായ ആഴമുണ്ടാകാമെങ്കിലും ഈ വാക്യത്തിൽ ‘മടങ്ങി’ എന്ന ഘടകം തുറന്നുപറഞ്ഞിട്ടില്ല; അതിനാൽ അത് പാഠത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അല്പകാലംകൂടെ’, ‘അടുക്കലേക്കു’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായിരിക്കെ മൂലവാക്യത്തിന്റെ ഗൗരവവും ബന്ധഘടനയും നിലനിർത്തുന്നു. നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ അടയാളം–ഉള്ളടക്കം തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, മൂലപാഠസാക്ഷ്യവുമായി യോജിക്കുന്ന സന്ദർഭവിശദീകരണം മാത്രം [a] ആയി ചേർത്തു.
