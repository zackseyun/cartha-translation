id: JHN.7.28
reference: John 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: ml
  text: 'അതുകൊണ്ട്, ദൈവാലയത്തിൽ ഉപദേശിച്ചുകൊണ്ടിരുന്ന യേശു ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “നിങ്ങൾ എന്നെ അറിയുന്നു; ഞാൻ എവിടെനിന്നുള്ളവനാണെന്നും അറിയുന്നു.[a] ഞാൻ സ്വമേധയാ വന്നതല്ല.[b] എന്നാൽ എന്നെ അയച്ചവൻ സത്യനായവനാണ്;[c] നിങ്ങൾ അവനെ അറിയുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഈ വാക്കുകൾ സന്ദർഭത്തിൽ പരിഹാസമോ വെല്ലുവിളിയോ ആയി കേൾക്കാം: “നിങ്ങൾ എന്നെ അറിയുന്നുവോ? ഞാൻ എവിടെനിന്നുള്ളവനാണെന്നും അറിയുന്നുവോ?” എന്നാൽ ഗ്രീക്ക് വാചകം രൂപത്തിൽ ഒരു പ്രസ്താവനയാണ്.'
    reason: alternative_reading
  - marker: b
    text: “സ്വമേധയാ” എന്നത് സ്വന്തം മുൻകൈയിലോ സ്വന്തം നിലയ്ക്കോ എന്ന അർഥത്തിലാണ്; അക്ഷരാർഥത്തിൽ, “എന്നിൽനിന്നല്ല” എന്നും പറയാം.
    reason: lexical_alternative
  - marker: c
    text: “സത്യനായ” എന്നതിന് ഇവിടെ “യഥാർഥനായ” അല്ലെങ്കിൽ “വാസ്തവമായ” എന്ന അർഥവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: ദൈവാലയത്തിലെ പരസ്യമായ, ഉച്ചത്തിലുള്ള പ്രഖ്യാപനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ദുഃഖത്താലുള്ള നിലവിളി എന്ന അനാവശ്യ അർഥം വരുത്തുന്നില്ല.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν ദൈവാലയ സമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദൈവാലയത്തിൽ’ എന്നത് സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമാണ്.
- source_word: διδάσκων ... καὶ λέγων
  choice: ഉപദേശിച്ചുകൊണ്ടിരുന്ന ... വിളിച്ചുപറഞ്ഞു
  rationale: പൊതുവായ ഉപദേശം നടന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; ഉദ്ധരണിയുടെ ആരംഭം തന്നെ ‘പറഞ്ഞു’ എന്ന ആശയം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Κἀμὲ οἴδατε
  choice: നിങ്ങൾ എന്നെ അറിയുന്നു
  rationale: പ്രഖ്യാപനരൂപം നിലനിർത്തുകയും സന്ദർഭത്തിലെ സാധ്യതയുള്ള പരിഹാസമോ വെല്ലുവിളിയോ വായനക്കാരൻ തിരിച്ചറിയാൻ ഇടവരുത്തുകയും ചെയ്യുന്നു.
- source_word: οἴδατε ... οἴδατε
  choice: അറിയുന്നു ... അറിയുന്നു
  rationale: യോഹന്നാന്റെ വാചകത്തിലെ പ്രാധാന്യമുള്ള ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: πόθεν εἰμί
  choice: ഞാൻ എവിടെനിന്നുള്ളവനാണെന്ന്
  rationale: ഭൗമിക ഉത്ഭവമോ അതിലും ആഴമുള്ള ഉത്ഭവമോ എന്നു നിർണയിക്കാതെ ഗ്രീക്കിലെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: സ്വയം
  rationale: യേശു സ്വന്തം നിലയ്ക്കോ സ്വന്തം മുൻകൈയിലോ വന്നതല്ല എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἐλήλυθα
  choice: വന്നതല്ല
  rationale: മലയാളത്തിലെ പൂർത്തീകരിച്ച വരവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ഇപ്പോഴത്തെ ദൗത്യവുമായി അതിന്റെ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀληθινὸς
  choice: സത്യമായവൻ
  rationale: ‘സത്യസന്ധൻ’ എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സത്യമായ, യഥാർഥമായ, വിശ്വസനീയമായ എന്ന യോഹന്നാനീയ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὁ πέμψας με
  choice: എന്നെ അയച്ചവൻ
  rationale: വ്യക്തിപരമായ കർത്തൃത്വം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: നിങ്ങൾ അവനെ അറിയുന്നില്ല
  rationale: വ്യക്തിയെ അറിയാത്തതിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള കുറ്റപ്പെടുത്തൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിങ്ങൾ എന്നെ അറിയുന്നു; ഞാൻ എവിടെനിന്നുള്ളവനാണെന്നും അറിയുന്നു’ എന്നത് നേരിട്ടുള്ള പ്രസ്താവനയോ പരിഹാസാത്മകമായ ചോദ്യമോ എന്നത്
  choice: പ്രധാന പാഠത്തിൽ ഗ്രീക്കിലെ പ്രഖ്യാപനരൂപം നിലനിർത്തി
  alternative: ‘നിങ്ങൾ എന്നെ അറിയുന്നുവോ? ഞാൻ എവിടെനിന്നുള്ളവനാണെന്നും അറിയുന്നുവോ?’ എന്ന ചോദ്യരൂപം, അല്ലെങ്കിൽ പരിഹാസം വ്യക്തമാക്കുന്ന വിവർത്തനം
  rationale: സന്ദർഭത്തിൽ പരിഹാസമോ വെല്ലുവിളിയോ കേൾക്കാമെങ്കിലും ഗ്രീക്ക് വ്യാകരണപരമായി പ്രഖ്യാപനമാണ്. അർഥത്തിലെ സംഘർഷം പരിഹരിച്ചുകളയാതെ അടിക്കുറിപ്പിൽ സാധ്യത അറിയിക്കുന്നു.
- issue: ‘ഞാൻ എവിടെനിന്നുള്ളവൻ’ എന്നും ‘ഞാൻ സ്വയം വന്നതല്ല’ എന്നും പറയുന്നതിലെ ഉത്ഭവം
  choice: ഭൗമിക ഉത്ഭവവും ദൈവിക ദൗത്യവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിധം വിശാലമായി നിലനിർത്തി
  alternative: പൂർണമായി ഭൂമിശാസ്ത്രപരമായ ഉത്ഭവമെന്നോ വ്യക്തമായി സ്വർഗീയ ഉത്ഭവമെന്നോ വിവർത്തനം ചെയ്യുക
  rationale: യോഹന്നാനിൽ യേശുവിന്റെ ഉത്ഭവത്തെക്കുറിച്ച് പലതലത്തിലുള്ള അർഥമുണ്ട്. ഈ വാക്യം പറയുന്നതിലധികം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ വ്യക്തമായ പരാമർശം
  choice: ‘എന്നെ അയച്ചവൻ’ എന്നു തന്നെ നിലനിർത്തി
  alternative: ‘എന്നെ അയച്ച പിതാവ്’
  rationale: സന്ദർഭം പിതാവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് ‘പിതാവ്’ എന്ന പദം ഉപയോഗിക്കുന്നില്ല.
- issue: ἀληθινός എന്നതിലെ സത്യവും യഥാർഥതയും
  choice: ‘സത്യമായവൻ’
  alternative: ‘സത്യസന്ധൻ’ അല്ലെങ്കിൽ ‘യഥാർഥനായവൻ’
  rationale: വാക്കിനെ വെറും സത്യസന്ധതയിലേക്കോ വെറും അസ്തിത്വയാഥാർഥ്യത്തിലേക്കോ ചുരുക്കാതെ രണ്ടിന്റെയും പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. ‘ദൈവാലയം’, ‘ഉപദേശിക്കുക’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. പ്രഖ്യാപനത്തിന്റെ ശക്തിക്കായി ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞു’ ഉപയോഗിച്ചു.
