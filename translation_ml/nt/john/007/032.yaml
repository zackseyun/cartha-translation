id: JHN.7.32
reference: John 7:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: ml
  text: ജനക്കൂട്ടം അവനെക്കുറിച്ച് ഈ കാര്യങ്ങൾ പിറുപിറുക്കുന്നത് പരീശന്മാർ കേട്ടു.[a] മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും അവനെ പിടികൂടാൻ[c] ഉദ്യോഗസ്ഥരെ[b] അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പിറുപിറുക്കുന്നത്’ എന്നതിന് ‘മുറുമുറുക്കുന്നത്’ അല്ലെങ്കിൽ ‘പരാതിപറയുന്നത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം താഴ്ന്ന ശബ്ദത്തിലുള്ള, പലപ്പോഴും അസന്തോഷം കലർന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉദ്യോഗസ്ഥർ’ എന്നതിന് ‘ദേവാലയകാവൽക്കാർ’ അല്ലെങ്കിൽ ‘കാവൽക്കാർ’ എന്നും പരിഭാഷപ്പെടുത്താം. യെഹൂദ അധികാരികൾ അയച്ച ഔദ്യോഗിക പരിചാരകരെയോ സേവകരെയോ ആണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘പിടികൂടാൻ’ എന്നതിന് സന്ദർഭാനുസൃതമായി ‘അറസ്റ്റുചെയ്യാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘പിടിക്കാൻ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: കേട്ടു
  rationale: ഇവിടെ ἀκούω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ജനക്കൂട്ടത്തിന്റെ സംസാരം അവരുടെ ചെവിയിലെത്തി എന്ന ലളിതമായ അർഥം നൽകുന്നു.
- source_word: τοῦ ὄχλου
  choice: ജനക്കൂട്ടം
  rationale: ὄχλος കൂടിനിന്നിരുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ജനക്കൂട്ടം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: γογγύζοντος
  choice: പിറുപിറുക്കുന്നത്
  rationale: γογγύζω താഴ്ന്ന ശബ്ദത്തിലുള്ള, പലപ്പോഴും അസന്തോഷമോ മടിയോ കലർന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ‘പിറുപിറുക്കുക’ ഈ ശബ്ദഭാവം നിലനിർത്തുന്നു.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: അവനെക്കുറിച്ച് ഇങ്ങനെ
  rationale: περὶ αὐτοῦ എന്നത് ‘അവനെക്കുറിച്ച്’ എന്നും ταῦτα ജനക്കൂട്ടം പറഞ്ഞ കാര്യങ്ങളെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഇങ്ങനെ’ എന്നത് ആശയം സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ബഹുവചനമായ ἀρχιερεῖς അന്നത്തെ പുരോഹിതനേതൃത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഒന്നിലധികം മഹാപുരോഹിതന്മാരെ അല്ല.
- source_word: ὑπηρέτας
  choice: ഉദ്യോഗസ്ഥരെ
  rationale: ഈ സന്ദർഭത്തിൽ ὑπηρέται യെഹൂദ അധികാരികളുടെ കീഴിൽ പ്രവർത്തിച്ച ഔദ്യോഗിക സേവകരെയോ കാവൽക്കാരെയോ സൂചിപ്പിക്കുന്നു. ‘ഉദ്യോഗസ്ഥർ’ ഔദ്യോഗികത നിലനിർത്തുകയും ഗ്രീക്കിലുള്ളതിലധികം സ്ഥാപനവിശദാംശം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: അവനെ പിടികൂടാൻ
  rationale: ἵνα ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; πιάζω പിടിക്കുക, കയ്യിലാക്കുക എന്ന അർഥത്തിലാണ്. ‘പിടികൂടാൻ’ ശാരീരികമായി കസ്റ്റഡിയിലെടുക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ὑπηρέτας എന്ന പദം സൂചിപ്പിക്കുന്നവരുടെ സ്ഥാപനപരമായ തിരിച്ചറിയൽ
  choice: യെഹൂദ മതാധികാരികളുടെ കീഴിലുള്ള ഔദ്യോഗിക ഉദ്യോഗസ്ഥർ
  alternative: ദേവാലയകാവൽക്കാർ; സേവകർ
  rationale: യേശുവിനെ പിടികൂടാനുള്ള ഔദ്യോഗിക നടപടിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എന്നാൽ ഗ്രീക്ക് പദം തന്നെ ഇവരെ കൃത്യമായി ‘ദേവാലയ പോലീസ്’ എന്നു നിർവചിക്കുന്നില്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ പൊതുവായ ഔദ്യോഗിക പദം ഉപയോഗിച്ച് കൂടുതൽ വ്യക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഔദ്യോഗിക-ചരിത്രപരമായ സൂചനകൾ നിലനിർത്തിയെങ്കിലും മൂലപാഠത്തേക്കാൾ അധികമായ സ്ഥാപനവിശദാംശമോ മതവിഭാഗപരമായ വ്യാഖ്യാനമോ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
