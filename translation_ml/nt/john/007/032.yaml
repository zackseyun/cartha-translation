revisions:
- from: ജനക്കൂട്ടം അവനെക്കുറിച്ച് ഇങ്ങനെ പിറുപിറുക്കുന്നത് പരീശന്മാർ കേട്ടു.[a] അപ്പോൾ മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും അവനെ പിടികൂടാൻ ഉദ്യോഗസ്ഥരെ[b] അയച്ചു.[c]
  to: ജനക്കൂട്ടം അവനെക്കുറിച്ച് ഈ കാര്യങ്ങൾ പിറുപിറുക്കുന്നത് പരീശന്മാർ കേട്ടു.[a] മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരും അവനെ പിടികൂടാൻ[c] ഉദ്യോഗസ്ഥരെ[b] അയച്ചു.
  rationale: വാക്യത്തിൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അപ്പോൾ’ ഒഴിവാക്കി. ταῦതയുടെ ബഹുവചനം ‘ഈ കാര്യങ്ങൾ’ എന്നു വ്യക്തമാക്കി. γογγύζοντος-നു തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘മന്ത്രിക്കുന്നത്’ മാറ്റി അർഥസന്നിഹിതമായ പകരങ്ങൾ നൽകി. πιάσωσιν-നെ വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് അതിന്റെ വിവർത്തനമായ ‘പിടികൂടാൻ’ എന്നതിന്റെ ഉടൻപിന്നിലേക്കു മാറ്റി.
