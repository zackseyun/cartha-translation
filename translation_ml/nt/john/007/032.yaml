    issue: ‘അപ്പോൾ’ ചേർത്തിരിക്കുന്നു
    rationale: καί ഇവിടെ കാലക്രമമോ നിഗമനമോ പ്രത്യേകം നിർബന്ധിക്കുന്നില്ല. ‘അപ്പോൾ’ ചേർക്കുന്നത് വിവർത്തനത്തിൽ ഇല്ലാത്ത ബന്ധം ഉൾപ്പെടുത്തുന്നു.
  - severity: medium
