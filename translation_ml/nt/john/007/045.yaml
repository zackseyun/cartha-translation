id: JHN.7.45
reference: John 7:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: ml
  text: അങ്ങനെ ഉദ്യോഗസ്ഥർ മുഖ്യപുരോഹിതന്മാരുടെയും പരീശന്മാരുടെയും അടുക്കൽ വന്നു. അവരാകട്ടെ ഉദ്യോഗസ്ഥരോട്, “നിങ്ങൾ എന്തുകൊണ്ടാണ് അവനെ കൊണ്ടുവരാതിരുന്നത്?” എന്നു ചോദിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽ സംഭവിച്ചതിന്റെ തുടർച്ചയും ഫലവും സൂചിപ്പിക്കുന്ന ബന്ധകം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ὑπηρέται
  choice: ഉദ്യോഗസ്ഥർ
  rationale: യേശുവിനെ പിടിക്കാനായി അധികാരികൾ അയച്ച ഔദ്യോഗിക സേവകരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിന് യോജിക്കുന്നു, അതേസമയം ‘ദേവാലയകാവൽക്കാർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ നിർണ്ണയം ഒഴിവാക്കുന്നു.
- source_word: ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന പദത്തിന് മലയാളത്തിൽ വ്യക്തവും പതിവുമായ തുല്യപദം.
- source_word: Φαρισαίους
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദ മതവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള പേരുരൂപം.
- source_word: ἐκεῖνοι
  choice: അവരാകട്ടെ
  rationale: മുഖ്യപുരോഹിതന്മാരും പരീശന്മാരുമാണ് അടുത്ത വാക്കുകൾ പറയുന്നതെന്ന് വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ ഊന്നലുള്ള സൂചകസർവനാമത്തിന്റെ വൈരുധ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Διὰ τί
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണം ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ ആധുനിക മലയാളരൂപം.
- source_word: ἠγάγετε
  choice: കൊണ്ടുവരാതിരുന്നത്
  rationale: ἄγω എന്ന ക്രിയയ്ക്ക് ‘നയിക്കുക’ എന്നും ‘കൊണ്ടുവരുക’ എന്നും അർഥമാകാം; യേശുവിനെ പിടിച്ച് അധികാരികളുടെ അടുക്കൽ എത്തിക്കേണ്ട സന്ദർഭത്തിൽ ‘കൊണ്ടുവരുക’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ഏകവചന കർമസർവനാമം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ആദ്യവാക്യത്തിൽ ഉദ്യോഗസ്ഥർ എത്തുന്നതും രണ്ടാം വാക്യത്തിൽ അധികാരികൾ ചോദ്യം ചെയ്യുന്നതും വ്യക്തമായി വേർതിരിച്ചു; ഗ്രീക്കിലെ ἐκεῖνοι എന്ന ഊന്നലുള്ള കർത്താവിനെ ‘അവരാകട്ടെ’ എന്നു സംരക്ഷിച്ചു.
