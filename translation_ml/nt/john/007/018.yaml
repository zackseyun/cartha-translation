id: JHN.7.18
reference: John 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: ml
  text: സ്വന്തത്തിൽനിന്നു സംസാരിക്കുന്നവൻ[a] സ്വന്തം മഹത്വം തേടുന്നു; എന്നാൽ തന്നെ അയച്ചവന്റെ മഹത്വം തേടുന്നവൻ സത്യവാനാണ്[b]; അവനിൽ അനീതി[c] ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വന്തമായി” അല്ലെങ്കിൽ “സ്വന്തം അധികാരത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സത്യസന്ധനാണ്.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അന്യായം,” “അധാർമ്മികത,” അല്ലെങ്കിൽ “തെറ്റായ പ്രവൃത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: സ്വന്തത്തിൽനിന്നു
  rationale: ‘തന്നിൽനിന്ന്/സ്വന്തത്തിൽനിന്ന്’ എന്ന ഉറവിടാർഥവും അയച്ചവനിൽനിന്നുള്ള ദൗത്യത്തോടുള്ള യോഹന്നാനീയ വൈരുധ്യവും നിലനിർത്തുന്നു; മലയാളത്തിലെ സാധ്യതയുള്ള അർഥവ്യക്തതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λαλῶν
  choice: സംസാരിക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തെ പൊതുവായ പ്രസ്താവനയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δόξαν
  choice: മഹത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ബഹുമാനം, കീർത്തി, ദൈവിക മഹിമ എന്നിവ ഉൾക്കൊള്ളുന്ന യോഹന്നാനീയ വ്യാപ്തി സംരക്ഷിക്കുന്ന പതിവും സ്വാഭാവികവുമായ പദം.
- source_word: τὴν ἰδίαν
  choice: സ്വന്തം
  rationale: ഒരാൾക്കുതന്നെ അവകാശപ്പെട്ടത് എന്ന ഊന്നൽ അയച്ചവന്റെ മഹത്വത്തോടുള്ള വൈരുധ്യത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ζητεῖ
  choice: തേടുന്നു
  rationale: ζητέωയുടെ അടിസ്ഥാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ക്രിയാപദ ആവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: തന്നെ അയച്ചവന്റെ
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശക കൃദന്തരൂപത്തിന്റെ വ്യക്തിപരമായ പ്രവർത്തകത്വവും ദൗത്യബന്ധവും സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: οὗτος
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ പ്രകടമായ നിർദ്ദേശക ഊന്നൽ ഉണ്ടെങ്കിലും ‘ഇവൻ’ ഇവിടെ മലയാളത്തിൽ അനാവശ്യമായ സാമീപ്യസൂചന ഉണ്ടാക്കാം; വാക്യഘടനയിലെ വിഷയപുനരാവർത്തനം ആവശ്യമായ ഊന്നൽ നൽകുന്നു.
- source_word: ἀληθής
  choice: സത്യവാൻ
  rationale: വക്താവിന്റെ സത്യതയും വിശ്വാസ്യതയും സൂചിപ്പിക്കുകയും ‘സത്യസന്ധൻ’ എന്ന കൂടുതൽ നൈതികമായി പരിമിതമായ വായനയിൽ മാത്രം പൂട്ടാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀδικία
  choice: അനീതി
  rationale: അന്യായം, അധാർമ്മികത, തെറ്റായ പ്രവൃത്തി എന്നിവ ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ നൈതിക വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: അവനിൽ … ഇല്ല
  rationale: ഗ്രീക്കിലെ അസ്തിത്വപ്രയോഗവും വ്യക്തിയുടെ ഉള്ളിലുള്ള നൈതിക സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘സ്വന്തത്തിൽനിന്നു’ സംസാരിക്കുന്നതും അയച്ചവന്റെ മഹത്വം തേടുന്നതും തമ്മിലുള്ള വൈരുധ്യം
  choice: സ്വയം ഉറവിടമാക്കിയ, സ്വന്തം മഹത്വം തേടുന്ന സംസാരത്തെ അയച്ചവന്റെ മഹത്വം ലക്ഷ്യമാക്കുന്ന സംസാരത്തോട് വിരുദ്ധമായി അവതരിപ്പിച്ചു.
  alternative: ‘സ്വന്തം അധികാരത്തിൽ’ എന്നു വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ ഈ വാക്യം യേശുവിനെയും വ്യാജോപദേഷ്ടാക്കളെയും മാത്രം വേർതിരിക്കുന്ന പ്രസ്താവനയായി ചുരുക്കുക.
  rationale: സമീപസന്ദർഭം ഉപദേശത്തിന്റെ ഉറവിടത്തെയും ലക്ഷ്യത്തെയും കുറിച്ചാണ്. മൂലപാഠത്തേക്കാൾ അപ്പുറമുള്ള പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രവിഭാഗങ്ങൾ ചേർക്കാതെ ദൗത്യത്തിന്റെയും മഹത്വത്തിന്റെയും ഭാഷ നിലനിർത്തി.
- issue: ἀληθής എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: സത്യവാൻ
  alternative: സത്യസന്ധൻ; യഥാർഥൻ
  rationale: വക്താവിന്റെ സത്യത, വിശ്വാസ്യത, ആത്മാർഥത എന്നിവയ്ക്കിടയിലെ സാധ്യത നിലനിർത്തുന്നു; ‘സത്യസന്ധൻ’ എന്നത് അർഥത്തെ വാക്കുകളുടെ സത്യസന്ധതയിലേക്ക് കുറയ്ക്കാം.
- issue: ἀδικία എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: അനീതി
  alternative: അന്യായം; അധാർമ്മികത; തെറ്റായ പ്രവൃത്തി
  rationale: സാമൂഹിക അന്യായം മാത്രമോ ഒറ്റപ്പെട്ട തെറ്റായ പ്രവൃത്തി മാത്രമോ എന്ന നിലയിലേക്ക് അർഥം ചുരുക്കാതെ നൈതികവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മഹത്വം,’ ‘സത്യവാൻ,’ ‘അനീതി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും യോഹന്നാനീയ ദൈവശാസ്ത്രഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്. സമാന്തരമായ ‘മഹത്വം തേടുന്നു/തേടുന്നവൻ’ എന്ന ഘടന മൂലത്തിലെ ആവർത്തനവും വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
