  source_fidelity: 'The Malayalam accurately represents the Greek contrast: speech originating ''from oneself,'' pursuit of one''s own glory, pursuit of the sender''s glory, and the resulting characterization as true and free from ἀδικία. The substantive participial constructions and repeated ζητεῖ/തേടുന്നു are preserved. The Greek demonstrative οὗτος is not explicitly represented, but the Malayalam subject construction adequately carries the contrast without loss of meaning.'
