id: JHN.7.24
reference: John 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: ml
  text: പുറംകാഴ്ച അനുസരിച്ച് വിധിക്കരുത്; മറിച്ച്, നീതിപൂർവം വിധിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പുറംകാഴ്ച നോക്കി വിധിക്കരുത്; മറിച്ച്, നീതിയുള്ള വിധി വിധിക്കുക.”'
    reason: κατ’ ὄψιν എന്ന പ്രയോഗത്തിനും τὴν δικαίαν κρίσιν എന്ന പദഘടനയ്ക്കും കൂടുതൽ അക്ഷരാർഥപരമായ ഒരു ബദൽ പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: വിധിക്കരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനശക്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത ‘വിധിക്കുന്നത് നിർത്തുക’ എന്ന ഭാവം ചേർക്കുന്നില്ല.
- source_word: κατ’ ὄψιν
  choice: പുറംകാഴ്ചയനുസരിച്ച്
  rationale: കണ്ണിൽ കാണുന്ന ബാഹ്യരൂപത്തെയോ ഉപരിതലത്തിലുള്ള ധാരണയെയോ അടിസ്ഥാനമാക്കുക എന്ന പ്രയോഗാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀλλὰ
  choice: എന്ന ആശയവൈരുധ്യം അർധവിരാമത്തിലൂടെ
  rationale: നിരോധിക്കപ്പെട്ട വിധിനിർണയരീതിയും കല്പിക്കപ്പെട്ട ശരിയായ രീതിയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ അർധവിരാമവും വാക്യഘടനയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘എന്നാൽ’ ചേർക്കാതെ വാക്യം കൂടുതൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὴν δικαίαν κρίσιν
  choice: നീതിപൂർവം
  rationale: ‘നീതിയായ വിധി വിധിക്കുക’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കി, വിധിനിർണയം നീതിക്ക് അനുസൃതമായിരിക്കണം എന്ന അർഥം കൃത്യമായി നൽകുന്നു. δικαίαν എന്നതിലെ ധാർമികവും ന്യായപരവുമായ ഗുണം ‘നീതിപൂർവം’ നിലനിർത്തുന്നു.
- source_word: κρίνετε
  choice: വിധിക്കുക
  rationale: ആദ്യ ഉപവാക്യത്തിലെ അതേ ക്രിയാമൂലം ആവർത്തിച്ച് ഗ്രീക്കിലെ വാഗ്‌രൂപപരമായ സമാന്തരത നിലനിർത്തുന്നു; ആധുനിക ലിഖിതമലയാളത്തിലെ മാന്യമായ ആജ്ഞാരൂപമാണിത്.
theological_decisions:
- issue: δικαίαν എന്നതിന്റെ ധാർമിക-ന്യായപരമായ അർഥവ്യാപ്തി
  choice: നീതിപൂർവം
  alternative: ന്യായമായി
  rationale: ‘നീതിപൂർവം’ എന്നത് നടപടിക്രമപരമായ ന്യായത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ, സന്ദർഭത്തിലെ ധാർമികമായ ശരിതനിമയും ഉൾക്കൊള്ളുന്നു; പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലിഖിതശൈലി. ‘വിധിക്കുവിൻ’ പോലുള്ള പഴയ ആജ്ഞാരൂപം ഒഴിവാക്കി ‘വിധിക്കുക’ ഉപയോഗിച്ചു. ചുരുക്കവും ഓർമ്മിക്കാവുന്നതുമായ വിരുദ്ധസമാന്തര ഘടന നിലനിർത്തി.
