id: JHN.7.26
reference: John 7:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: ml
  text: നോക്കൂ, അവൻ പരസ്യമായി സംസാരിക്കുന്നു; അവർ അവനോട് ഒന്നും പറയുന്നില്ല. ഇവനാണ് മശീഹ എന്നു അധികാരികൾ ശരിക്കും അറിഞ്ഞിട്ടുണ്ടാകുമോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അധികാരികൾ ഇവനാണ് മശീഹ എന്ന് വാസ്തവമായും അറിഞ്ഞിട്ടുണ്ടാകുമോ?”'
    reason: μήποτε ഉൾക്കൊള്ളുന്ന ആശ്ചര്യഭരിതമായ സന്ദേഹചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന മറ്റൊരു പദക്രമം.
lexical_decisions:
- source_word: ἴδε
  choice: നോക്കൂ
  rationale: ശ്രോതാവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന സംവാദപ്രയോഗമായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: παρρησίᾳ
  choice: പരസ്യമായി
  rationale: ധൈര്യത്തെക്കാൾ പൊതുവേദിയിലെ തുറന്ന സംസാരത്തിനാണ് സന്ദർഭത്തിൽ ഊന്നൽ; അതിനാൽ ‘പരസ്യമായി’ എന്നു നൽകി.
- source_word: λαλεῖ
  choice: സംസാരിക്കുന്നു
  rationale: സംഭവം നടക്കുന്നതിനിടയിലെ തുടർച്ചയായ പ്രവൃത്തിയെ വർത്തമാനകാലത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: അവർ അവനോട് ഒന്നും പറയുന്നില്ല
  rationale: αὐτῷ എന്ന ദാതിവിഭക്തിയുടെ ‘അവനോട്’ എന്ന അർഥം നിലനിർത്തി; സന്ദർഭത്തിൽ സൂചിതമായ ‘എതിർത്ത്’ എന്ന ആശയം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: μήποτε
  choice: അറിഞ്ഞിരിക്കുമോ?
  rationale: ആശ്ചര്യത്തോടെയുള്ള സന്ദേഹനിഗമനം മലയാളത്തിലെ സാധ്യതാസൂചക ചോദ്യരൂപത്തിലൂടെ നൽകി; ഉറച്ച നിഷേധമായി മാറ്റിയിട്ടില്ല.
- source_word: ἀληθῶς
  choice: ശരിക്കും
  rationale: സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഊന്നൽ വ്യക്തമാക്കുന്നതുമായ ആധുനിക പ്രയോഗം.
- source_word: ἔγνωσαν
  choice: അറിഞ്ഞിരിക്കുമോ
  rationale: അധികാരികൾ ആ തിരിച്ചറിവിൽ എത്തിയിട്ടുണ്ടാകാമോ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ ἄρχοντες
  choice: അധികാരികൾ
  rationale: സന്ദർഭത്തിലെ യെഹൂദ ഭരണ-നേതൃത്വ വൃത്തത്തെ സൂചിപ്പിക്കുന്ന, ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: ഇയാളാണ് മശീഹ എന്ന്
  rationale: χριστός ഇവിടെ വ്യക്തിനാമംപോലെയല്ല, യെഹൂദരുടെ പ്രതീക്ഷയിലുള്ള അഭിഷിക്തന്റെ പദവിയായാണ് വരുന്നത്; οὗτός ἐστιν എന്ന തിരിച്ചറിയൽ ഊന്നൽ ‘ഇയാളാണ്’ എന്നതിൽ നിലനിർത്തി.
theological_decisions:
- issue: ὁ χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ χριστός മശീഹാപദവിയായതിനാൽ യെഹൂദ പ്രതീക്ഷയുടെ പശ്ചാത്തലം വ്യക്തമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം പാഠത്തിലെ പദവിസ്വഭാവം ചിലപ്പോൾ മങ്ങിച്ചേക്കാം.
- issue: μήποτε അടങ്ങിയ ചോദ്യത്തിന്റെ ഭാവം
  choice: ആശ്ചര്യത്തോടെയുള്ള സാധ്യതാചോദ്യം
  alternative: ഉറച്ച നിഷേധം സൂചിപ്പിക്കുന്ന ചോദ്യം
  rationale: ഗ്രീക്ക് രൂപം ഇവിടെ ജനക്കൂട്ടത്തിന്റെ അമ്പരപ്പോടെയുള്ള അനുമാനത്തിന് ഇട നൽകുന്നു; ‘തീർച്ചയായും അല്ല’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രമാണികൾ’ പോലുള്ള പഴയ സഭാഭാഷ ഒഴിവാക്കി ‘അധികാരികൾ’ ഉപയോഗിച്ചു; വാക്യത്തിലെ ആശ്ചര്യവും തുറന്ന പൊതുസംസാരത്തിന്റെ ഭാവവും നിലനിർത്തി.
