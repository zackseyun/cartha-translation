id: JHN.7.4
reference: John 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: ml
  text: കാരണം, പരസ്യമായി അറിയപ്പെടാൻ ആഗ്രഹിക്കുന്ന ആരും ഒന്നും രഹസ്യമായി ചെയ്യുന്നില്ല. നീ ഈ കാര്യങ്ങൾ ചെയ്യുന്നെങ്കിൽ, നിന്നെത്തന്നെ ലോകത്തിനു വെളിപ്പെടുത്തുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: കാരണം ... ആരും ... ഇല്ല
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധം ‘കാരണം’ എന്നതിലൂടെ നിലനിർത്തുന്നു; οὐδεὶς സ്വാഭാവികമായ മലയാള നിഷേധഘടനയായ ‘ആരും ... ഇല്ല’ എന്നു നൽകുന്നു.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: ഒന്നും രഹസ്യമായി ചെയ്യുന്നില്ല
  rationale: τι എന്ന അനിശ്ചിത കർമവും ἐν κρυπτῷ എന്ന രഹസ്യതയുടെ ആശയവും വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: പരസ്യമായി അറിയപ്പെടാൻ ആഗ്രഹിക്കുന്ന
  rationale: ഇവിടെ παρρησία സംസാരധൈര്യത്തേക്കാൾ പരസ്യതയെയും പൊതുജനമധ്യേ അറിയപ്പെടുന്നതിനെയും സൂചിപ്പിക്കുന്നു. ζητεῖ ഉദ്ദേശ്യപൂർവമായ ആഗ്രഹമായി നൽകുന്നു; αὐτός നൽകുന്ന കർത്തൃഊന്നൽ മലയാളവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: εἰ ταῦτα ποιεῖς
  choice: നീ ഈ കാര്യങ്ങൾ ചെയ്യുന്നെങ്കിൽ
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല നിബന്ധനയെ നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: φανέρωσον σεαυτόν
  choice: നിന്നെത്തന്നെ ... വെളിപ്പെടുത്തുക
  rationale: ആജ്ഞയുടെ നിർണായക സ്വഭാവവും സ്വയം പൊതുവിൽ പ്രകടമാക്കുക എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: τῷ κόσμῳ
  choice: ലോകത്തിനു
  rationale: തൽസന്ദർഭത്തിലെ പൊതുജനാർത്ഥം അനുവദിക്കുമ്പോഴും യോഹന്നാനിലെ κόσμος എന്ന പ്രധാന പദത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര പ്രതിധ്വനി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിലെ κόσμος എന്ന പദത്തിന്റെ അർത്ഥം
  choice: ലോകത്തിനു
  alternative: പൊതുജനങ്ങൾക്ക്
  rationale: സന്ദർഭം പൊതുവായ ദൃശ്യതയെക്കുറിച്ചാണെങ്കിലും ‘ലോകം’ എന്നത് യോഹന്നാനിലെ പ്രധാന പദസാമ്യം സംരക്ഷിക്കുകയും ഈ വാക്യത്തിൽ സ്വാഭാവികമായി നിലകൊള്ളുകയും ചെയ്യുന്നു.
- issue: ἐν παρρησίᾳ εἶναι എന്നതിലെ പരസ്യത
  choice: പരസ്യമായി അറിയപ്പെടാൻ
  alternative: പൊതുജനങ്ങളുടെ കൺമുന്നിലായിരിക്കാൻ
  rationale: ഇവിടെ പ്രസംഗധൈര്യം എന്ന പ്രത്യേക അർത്ഥം ചുമത്താതെ, പൊതുവിൽ തുറന്നറിയപ്പെടുക എന്ന സന്ദർഭോചിത അർത്ഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി. സഹോദരന്മാരുടെ വെല്ലുവിളിസ്വരം ആജ്ഞാരൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
