id: JHN.7.27
reference: John 7:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: ml
  text: എന്നാൽ ഇവൻ എവിടെനിന്നുള്ളവനാണെന്ന് നമുക്കറിയാം; പക്ഷേ മശീഹ വരുമ്പോൾ[a], അവൻ എവിടെനിന്നുള്ളവനാണെന്ന് ആരും അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു വരുമ്പോൾ.”
    reason: χριστός എന്ന ഗ്രീക്ക് പദം ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം; മുഖ്യപാഠത്തിൽ അതിന്റെ പദവിസ്വഭാവം വ്യക്തമാക്കാൻ ‘മശീഹ’ ഉപയോഗിച്ചിരിക്കുന്നു.
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῦτον
  choice: ഇവൻ
  rationale: യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്ന വ്യക്തവും അല്പം തീക്ഷ്ണവുമായ പരാമർശഭാവം നിലനിർത്തുന്നു.
- source_word: οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: സംസാരിക്കുന്നവർ തങ്ങൾക്കുള്ളതായി അവകാശപ്പെടുന്ന അറിവിനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: πόθεν ἐστίν
  choice: എവിടെനിന്നുള്ളവനാണ്
  rationale: ഉത്ഭവസ്ഥലത്തെയോ ഉറവിടത്തെയോ കുറിച്ചുള്ള ചോദ്യം സ്വാഭാവികമായി നൽകുകയും രണ്ടു പ്രയോഗങ്ങളിലെയും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ δὲ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ χριστός ഒരു പേരായല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ യഹൂദ മശീഹാപദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
- source_word: ὅταν ἔρχηται
  choice: വരുമ്പോൾ
  rationale: അനിശ്ചിതമായ ഭാവിസംഭവത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐδεὶς γινώσκει
  choice: ആരും അറിയുന്നില്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല സർവനിഷേധത്തെ വ്യാഖ്യാനപരമായി ഭാവികാലമാക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ജനക്കൂട്ടം പ്രതീക്ഷിക്കുന്ന മശീഹാപുരുഷനെയാണ് പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്; അതിനാൽ പദവിയുടെ യഹൂദ-അന്ത്യകാല പശ്ചാത്തലം ‘മശീഹ’ കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: മശീഹയുടെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള ജനക്കൂട്ടത്തിന്റെ അവകാശവാദം
  choice: അവരുടെ വാക്കുകൾ വിശദീകരണമില്ലാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി
  alternative: ‘മശീഹ എവിടെനിന്നു വരുമെന്ന് ആരും അറിയുകയില്ല’ എന്ന വ്യാഖ്യാനവിപുലീകരണം
  rationale: ഇത് ആഖ്യാതാവിന്റെ ഉപദേശപ്രസ്താവനയല്ല, ജനക്കൂട്ടത്തിന്റെ ധാരണയാണ്; അതിന്റെ സത്യാസത്യങ്ങൾ പരിഭാഷയിൽ തീർപ്പാക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംസാരശൈലി. ‘ഇവൻ’ ജനക്കൂട്ടത്തിന്റെ ചൂണ്ടിക്കാണിക്കുന്ന ഭാവം നിലനിർത്തുന്നു; ‘എവിടെനിന്നുള്ളവൻ’ എന്ന ആവർത്തനം ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
