id: JHN.7.35
reference: John 7:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദന്മാർ[a] തമ്മിൽ പറഞ്ഞു: “നമുക്കിവനെ കണ്ടെത്താനാകാത്തിടത്തേക്കാണ് ഇവൻ പോകാനിരിക്കുന്നത്? ഗ്രീക്കുകാരുടെ ഇടയിലെ യെഹൂദപ്രവാസത്തിലേക്കു[b] പോയി ഗ്രീക്കുകാരെ പഠിപ്പിക്കാനല്ലല്ലോ ഇവൻ പോകാനിരിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യർ.” ഗ്രീക്കുപദം പൊതുവായി യെഹൂദന്മാരെയോ ചില സന്ദർഭങ്ങളിൽ യെഹൂദ്യയിൽനിന്നുള്ളവരെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഗ്രീക്കുകാരുടെ ഇടയിലെ യെഹൂദപ്രവാസം” എന്നത് ഗ്രീക്ക്-സംസാരിക്കുന്ന ജനവിഭാഗങ്ങളുടെ ഇടയിൽ ചിതറിപ്പാർന്നിരുന്ന യെഹൂദസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ചിതറിപ്പാർന്ന ഗ്രീക്കുകാരെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കുപദത്തിന്റെ പൊതുവായ ജനവിഭാഗസൂചന നിലനിർത്തുന്നു; പാഠത്തിൽ വ്യക്തമല്ലാത്ത ‘നേതാക്കൾ’ എന്ന അർഥം ചേർക്കുന്നില്ല. ‘യെഹൂദ്യർ’ എന്ന പ്രാദേശിക സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πρὸς ἑαυτούς
  choice: തമ്മിൽ പറഞ്ഞു
  rationale: ഇവിടെ പരസ്പരം സംസാരിക്കുന്നതാണെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ποῦ οὗτος
  choice: ഇവൻ എവിടേക്ക്
  rationale: οὗτος എന്നതിലെ അകലം പാലിക്കുന്നതോ അവജ്ഞ കലർന്നതോ ആയ ഭാവം ‘ഇവൻ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μέλλει πορεύεσθαι
  choice: പോകാനിരിക്കുന്നു / പോകാനാണ്
  rationale: μέλλω + infinitive നൽകുന്ന ഭാവി ഉദ്ദേശ്യത്തിന്റെയോ സമീപഭാവിയുടെയോ സൂചന സന്ദർഭാനുസൃതമായി പകർത്തുന്നു.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: നമുക്കു കണ്ടെത്താൻ കഴിയാത്തവിധം
  rationale: അവർക്ക് അവനെ കണ്ടെത്താനാവാത്ത ഫലമാണ് ചോദ്യം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി കഴിവിന്റെ പ്രയോഗം ഉപയോഗിച്ചെങ്കിലും അടിസ്ഥാന അർഥം മാറ്റുന്നില്ല.
- source_word: μὴ
  choice: …ആണോ?
  rationale: നിഷേധാത്മക മറുപടി പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യത്തെ മലയാളത്തിൽ സന്ദർഭവും സ്വരവും വഴി സൂചിപ്പിക്കുന്നു; കൃത്രിമമായ വാൽചോദ്യം ഒഴിവാക്കുന്നു.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: ഗ്രീക്കുകാരുടെ ഇടയിൽ ചിതറിപ്പാർക്കുന്ന യെഹൂദന്മാരുടെ അടുക്കൽ
  rationale: ഇത് ചിതറിക്കിടക്കുന്ന ഗ്രീക്കുകാരെയല്ല, ഗ്രീക്കുകാരുടെ ഇടയിൽ പ്രവാസികളായി പാർക്കുന്ന യെഹൂദരെ സൂചിപ്പിക്കുന്നു. മലയാളവായനക്കാരന് അർഥം ഉടൻ ഗ്രഹിക്കാവുന്നവിധം ലക്ഷ്യസംഘത്തെ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς Ἕλληνας
  choice: ഗ്രീക്കുകാരെ
  rationale: ‘വിജാതീയർ’ എന്നു വിപുലീകരിക്കാതെ Ἕλληνες എന്നതിന്റെ നേരിട്ടുള്ള ജനവിഭാഗസൂചന സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: ഈ വാക്യം പ്രാദേശിക അർഥം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ വിശാലവും നേരിട്ടുള്ളതുമായ ‘യെഹൂദന്മാർ’ സ്വീകരിച്ചു. എന്നാൽ പദത്തിന്റെ പ്രാദേശിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: διασπορὰν τῶν Ἑλλήνων എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: ഗ്രീക്കുകാരുടെ ഇടയിൽ ചിതറിപ്പാർക്കുന്ന യെഹൂദന്മാർ
  alternative: ഗ്രീക്കുകാരുടെ ചിതറിപ്പാർപ്പ്
  rationale: യഹൂദപ്രയോഗത്തിൽ διασπορά സാധാരണയായി ജനതകളുടെ ഇടയിൽ ചിതറിപ്പാർക്കുന്ന യെഹൂദരെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ഗ്രീക്കുകാരാൽ രൂപപ്പെട്ട ചിതറിപ്പാർപ്പ്’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി സ്ഥലം/സഹവാസബന്ധം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘ഇവൻ’ എന്ന പ്രയോഗം മൂലത്തിലെ അകലം പാലിക്കുന്ന ഭാവം സൂക്ഷിക്കുന്നു. ‘ചിതറിപ്പാർക്കുന്ന യെഹൂദന്മാർ’ എന്ന വിശദീകരണാത്മക പരിഭാഷ സാംസ്കാരിക ആശയം വ്യക്തമായി കൈമാറുന്നു.
