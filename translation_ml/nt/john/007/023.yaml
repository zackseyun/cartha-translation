id: JHN.7.23
reference: John 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: ml
  text: മോശെയുടെ ന്യായപ്രമാണം ലംഘിക്കപ്പെടാതിരിക്കാൻ ഒരു പുരുഷൻ ശബ്ബത്തിൽ പരിച്ഛേദനം ഏൽക്കുന്നുവെങ്കിൽ,[a][b] ശബ്ബത്തിൽ ഒരു മനുഷ്യനെ മുഴുവനായി സൗഖ്യമാക്കിയതുകൊണ്ട് നിങ്ങൾ എന്നോട് കോപിക്കുന്നുവോ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിച്ഛേദനം ചെയ്യപ്പെടുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘പരിച്ഛേദനം സ്വീകരിക്കുന്നു’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ലംഘിക്കപ്പെടാതിരിക്കാൻ’ എന്നതിനുപകരം ‘നീക്കിക്കളയപ്പെടാതിരിക്കാൻ’ അല്ലെങ്കിൽ ‘അസാധുവാക്കപ്പെടാതിരിക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരു മനുഷ്യനെ മുഴുവനായി സൗഖ്യമാക്കി’ എന്ന പ്രയോഗം ശരീരത്തിന്റെ ഒരു ഭാഗത്തെ പരിച്ഛേദനം ചെയ്യുന്നതും മുഴുവൻ മനുഷ്യനെയും സൗഖ്യമാക്കുന്നതും തമ്മിലുള്ള യേശുവിന്റെ താരതമ്യത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: പരിച്ഛേദനം ഏൽക്കുന്നു
  rationale: ഗ്രീക്കിലെ ‘പരിച്ഛേദനം സ്വീകരിക്കുന്നു’ എന്ന പ്രയോഗത്തിന്റെ സ്വീകർത്തൃഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: ἄνθρωπος
  choice: ഒരാൾ / ഒരു മനുഷ്യൻ
  rationale: ആദ്യ സന്ദർഭത്തിൽ പരിച്ഛേദനം മൂലം പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും ‘ഒരാൾ’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; രണ്ടാമത്തെ സന്ദർഭത്തിൽ ὅλον എന്ന ഊന്നൽ പ്രകടമാക്കാൻ ‘ഒരു മനുഷ്യനെ മുഴുവനായി’ ഉപയോഗിച്ചു.
- source_word: ἐν σαββάτῳ
  choice: ശബ്ബത്തിൽ
  rationale: കാലസൂചക ദത്തിവിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: മോശെയുടെ ന്യായപ്രമാണം ലംഘിക്കപ്പെടാതിരിക്കേണ്ടതിന്
  rationale: λύω എന്നതിന് ഇവിടെ നിയമം ലംഘിക്കുക, അസാധുവാക്കുക, നീക്കിക്കളയുക എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; സന്ദർഭത്തിൽ ‘ലംഘിക്കപ്പെടുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: χολᾶτε
  choice: നിങ്ങൾ എന്നോട് കോപിക്കുന്നുവോ
  rationale: ക്രോധമോ രോഷമോ പ്രകടിപ്പിക്കുന്ന ക്രിയയുടെ തീവ്രത കൂട്ടാതെ നേരിട്ടുള്ള ചോദ്യരൂപം നൽകുന്നു.
- source_word: ὅλον ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ മുഴുവനായി
  rationale: ശരീരത്തിന്റെ ഒരു ഭാഗത്തെ സംബന്ധിക്കുന്ന പരിച്ഛേദനവും മുഴുവൻ മനുഷ്യനെ സൗഖ്യമാക്കുന്നതും തമ്മിലുള്ള വാക്യത്തിലെ ഊന്നിയ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ὑγιῆ ἐποίησα
  choice: സൗഖ്യമാക്കി
  rationale: ‘ആരോഗ്യമുള്ളവനാക്കി’ എന്ന പദാനുപദരൂപത്തേക്കാൾ മലയാളത്തിൽ സ്വാഭാവികം; ‘മുഴുവനായി’ എന്ന ഘടകത്തിലൂടെ മൂലത്തിലെ വാക്ചാതുര്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ശബ്ബത്തിലെ പരിച്ഛേദനവും സൗഖ്യമാക്കലും തമ്മിലുള്ള യേശുവിന്റെ താരതമ്യം
  choice: മോശെയുടെ ന്യായപ്രമാണം ലംഘിക്കാതിരിക്കാൻ ശബ്ബത്തിൽ പരിച്ഛേദനം അനുവദിക്കുന്നുവെങ്കിൽ, ഒരു മനുഷ്യനെ മുഴുവനായി സൗഖ്യമാക്കുന്നത് അതിലും ന്യായമാണെന്ന ശക്തമായ താരതമ്യം വാക്യത്തിൽ നിലനിർത്തി.
  alternative: ആചാരനിയമവും കരുണാപ്രവൃത്തിയും തമ്മിലുള്ള പൊതുവായ വിരോധമായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: മൂലവാക്യത്തിന്റെ ന്യായവാദം അംഗീകരിക്കപ്പെട്ടിരുന്ന ശബ്ബത്തിലെ പരിച്ഛേദനത്തിൽനിന്ന് മുഴുവൻ മനുഷ്യന്റെ പുനഃസ്ഥാപനത്തിലേക്കാണ് നീങ്ങുന്നത്. ന്യായപ്രമാണത്തിനെതിരായ പിൽക്കാല സിദ്ധാന്തവാദം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം,’ ‘ശബ്ബം,’ ‘പരിച്ഛേദനം’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ വ്യക്തതയ്ക്കായി നിലനിർത്തി; വാക്യത്തിന്റെ ചോദ്യാത്മക ശക്തിയും മൂലത്തിലെ താരതമ്യവും സംരക്ഷിച്ചു.
