  text: After saying these things, he himself remained in Galilee.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾ പറഞ്ഞശേഷം, അവൻ തന്നെ ഗലീലയിൽ താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ഇതു
  rationale: നപുംസകലിംഗ ബഹുവചനമായ ഗ്രീക്ക് രൂപം മുൻപറഞ്ഞ കാര്യങ്ങളെ ഒന്നായി സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഇതു പറഞ്ഞശേഷം’ സ്വാഭാവികവും അർഥസമ്പൂർണ്ണവുമാണ്.
- source_word: δὲ … εἰπὼν
  choice: പറഞ്ഞശേഷം
  rationale: δέ ഇവിടെ മൃദുവായ ആഖ്യാനത്തുടർച്ചയും, ഭൂതകാല കൃദന്തരൂപമായ εἰπών മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനവും സൂചിപ്പിക്കുന്നു; ഇവ രണ്ടും ചേർന്ന് ‘പറഞ്ഞശേഷം’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: പ്രകടമായി നൽകിയിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ചുറ്റുപാടിൽ സഹോദരന്മാരുടെ പ്രവർത്തനത്തിൽനിന്ന് യേശുവിന്റെ സ്വന്തം പ്രവർത്തനത്തെ വേർതിരിക്കുന്ന സൂചനയും ഇതിൽ സംരക്ഷിക്കപ്പെടുന്നു.
- source_word: ἔμεινεν
  choice: തുടർന്നു
  rationale: μένω ഇവിടെ ഒരു സ്ഥലത്ത് തുടരുക എന്ന ആഖ്യാനാർഥത്തിലാണ്; ‘ഗലീലയിൽ തുടർന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ നിലനിൽപ്പ് അറിയിക്കുന്നു.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ഗലീലയിൽ
  rationale: നേരിട്ടുള്ള സ്ഥലസൂചനയെ ചുരുക്കവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
