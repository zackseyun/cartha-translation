id: JHN.7.48
reference: John 7:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: ml
  text: പ്രമാണികളിലോ പരീശന്മാരിലോ ആരെങ്കിലും അവനിൽ വിശ്വസിച്ചിട്ടുണ്ടോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ μή ചേർത്ത് രൂപപ്പെടുത്തിയ ഈ ചോദ്യം ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: ആരെങ്കിലും ... ഉണ്ടോ?
  rationale: μή ഉപയോഗിച്ചുള്ള ഈ ചോദ്യം ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നതാണെങ്കിലും, ഗ്രീക്കിലെ ചോദ്യരൂപം നിലനിർത്തുന്നു; നിഷേധം മുഖ്യവാക്യത്തിൽ തുറന്നുപറയുന്നില്ല.
- source_word: ἐκ τῶν ἀρχόντων
  choice: പ്രമാണികളിലോ
  rationale: ഇവിടെ ἄρχοντες അംഗീകൃത യഹൂദ ഭരണനേതാക്കളെ സൂചിപ്പിക്കുന്നു. ‘പ്രമാണികൾ’ ഔദ്യോഗിക സ്ഥാനവും സാമൂഹിക അധികാരവും സ്വാഭാവികമായി അറിയിക്കുന്നു; ἐκ എന്നത് കൂട്ടത്തിലെ അംഗത്വമായി ‘-ിൽ’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചിട്ടുണ്ടോ
  rationale: മുൻകാലം മുതൽ ഇപ്പോഴത്തെ ചർച്ചവരെ ആരെങ്കിലും വിശ്വസിച്ചിട്ടുണ്ടോ എന്ന വാദാത്മക ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്; πιστεύω എന്നതിന്റെ സ്ഥിരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: εἰς αὐτόν
  choice: അവനിൽ
  rationale: യോഹന്നാനിലെ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ വ്യക്തിയോടുള്ള വിശ്വാസം എന്ന അർഥം മലയാളത്തിൽ ‘അവനിൽ വിശ്വസിക്കുക’ എന്ന് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἢ
  choice: -ലോ ... -ലോ
  rationale: ഗ്രീക്കിലെ ‘അല്ലെങ്കിൽ’ എന്ന ഏകോപനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ വികൽപഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῶν Φαρισαίων
  choice: പരീശന്മാരിലോ
  rationale: അറിയപ്പെടുന്ന മതവിഭാഗത്തിന്റെ പേരായ Φαρισαῖοι എന്നത് പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ നൽകുന്നു; ἐκ സൂചിപ്പിക്കുന്ന കൂട്ടത്തിലെ അംഗത്വം ‘-ിൽ’ കൊണ്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാദാത്മക ചോദ്യം
  choice: ‘ആരെങ്കിലും ... ഉണ്ടോ?’ എന്ന ചോദ്യരൂപം നിലനിർത്തുക.
  alternative: ‘പ്രമാണികളിലോ പരീശന്മാരിലോ ആരും അവനിൽ വിശ്വസിച്ചിട്ടില്ലല്ലോ’ എന്ന് വ്യക്തമായ നിഷേധമായി നൽകുക.
  rationale: μή τις സംസാരിക്കുന്നവർ ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നതായി സൂചിപ്പിക്കുന്നു; എങ്കിലും മൂലപാഠം നിഷേധപ്രസ്താവനയല്ല, ചോദ്യമാണ്. അതിനാൽ അവരുടെ അവജ്ഞാഭാവം സൂചിപ്പിച്ചുകൊണ്ട് രൂപപരമായും ആശയപരമായും ഉള്ള സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രമാണികൾ’ ഔദ്യോഗിക യഹൂദ നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ചോദ്യം വാദാത്മകമാണെന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
