id: JHN.7.17
reference: John 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: ml
  text: ആരെങ്കിലും അവന്റെ ഇഷ്ടം ചെയ്യാൻ ആഗ്രഹിക്കുന്നുവെങ്കിൽ, ഉപദേശം ദൈവത്തിൽനിന്നുള്ളതാണോ, അതോ ഞാൻ എന്നിൽനിന്ന് സംസാരിക്കുന്നതാണോ എന്ന് അവൻ അറിയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സ്വന്തമായി’ അഥവാ ‘സ്വന്തം അധികാരത്തിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘എന്നിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: ആരെങ്കിലും … ആഗ്രഹിക്കുന്നെങ്കിൽ
  rationale: ἐάν സഹിതമുള്ള വിധിലിംഗം ഒരു പൊതുവ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു; θέλωയിലെ ആഗ്രഹത്തിന്റെയും മനസ്സിന്റെയും ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ θέλημα αὐτοῦ
  choice: അവന്റെ ഇഷ്ടം
  rationale: സന്ദർഭത്തിൽ സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠം ‘ദൈവത്തിന്റെ’ എന്നു ആവർത്തിക്കാത്തതിനാൽ സർവനാമരൂപം നിലനിർത്തുന്നു.
- source_word: ποιεῖν
  choice: ചെയ്യാൻ
  rationale: θέλημα എന്നതിനോടൊപ്പം ποιεῖν എന്നത് ഒരാളുടെ ഇഷ്ടം ‘ചെയ്യുക’ എന്ന നേരിട്ടുള്ള അർഥത്തിലാണ്; മലയാളത്തിലും ഇത് സ്വാഭാവികമാണ്.
- source_word: γνώσεται
  choice: അയാൾ അറിയും
  rationale: ഭാവികാലരൂപം ഫലമായി ലഭിക്കുന്ന അറിവിനെയോ തിരിച്ചറിവിനെയോ സൂചിപ്പിക്കുന്നു. ‘അറിയും’ എന്നത് പ്രക്രിയയെ അനാവശ്യമായി ഊന്നാതെ നേരിട്ട് അർഥം നൽകുന്നു.
- source_word: περὶ τῆς διδαχῆς
  choice: ഈ ഉപദേശം … എന്ന്
  rationale: περί + genitive ഉപദേശത്തെ സംബന്ധിച്ചുള്ള അറിവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പരോക്ഷചോദ്യഘടനയിൽ വിഷയം മുമ്പിൽ വെച്ച് ‘എന്ന്’ ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്; ‘ഈ’ എന്നത് സന്ദർഭത്തിൽ ചർച്ചയിലുള്ള യേശുവിന്റെ ഉപദേശത്തെ വ്യക്തമാക്കുന്നു.
- source_word: πότερον … ἢ
  choice: … ആണോ അതോ … ആണോ
  rationale: രണ്ട് ബദലുകൾ തമ്മിലുള്ള വ്യക്തമായ താരതമ്യം മലയാളത്തിലെ ‘ആണോ അതോ … ആണോ’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളത്
  rationale: ἐκ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവത്തിൽനിന്നുള്ളത്’ എന്നത് നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: എന്നിൽനിന്നുതന്നെ
  rationale: വാചകത്തിന്റെ ഉറവിടം സ്വയം ആണെന്ന മൂലപാഠത്തിലെ രൂപകം നിലനിർത്തുന്നു; ‘സ്വന്തം അധികാരത്തിൽ’ എന്ന വ്യാഖ്യാനത്തെ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: λαλῶ
  choice: സംസാരിക്കുകയാണോ
  rationale: ഈ പ്രഭാഷണസന്ദർഭത്തിലെ ഗ്രീക്ക് വർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക തുടർവർത്തമാനരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὸ θέλημα αὐτοῦ എന്നതിലെ αὐτοῦ-ന്റെ സൂചന
  choice: ദൈവമാണ് സൂചിതനെങ്കിലും മുഖ്യവാചകത്തിൽ ‘അവന്റെ ഇഷ്ടം’ എന്ന സർവനാമരൂപം നിലനിർത്തി.
  alternative: ദൈവത്തിന്റെ ഇഷ്ടം
  rationale: തൊട്ടടുത്ത സന്ദർഭം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ ‘ദൈവത്തിന്റെ’ എന്നു തുറന്നെഴുതുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമാകും.
- issue: ἀπ’ ἐμαυτοῦ എന്നതിന്റെ വ്യാപ്തി
  choice: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ‘എന്നിൽനിന്നുതന്നെ’ എന്ന രൂപം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു.
  alternative: സ്വന്തം നിലയ്ക്ക്; സ്വന്തം അധികാരത്തിൽ
  rationale: ഗ്രീക്ക് നേരിട്ട് സ്വയം എന്ന ഉറവിടത്തെയാണ് പറയുന്നത്. സ്വതന്ത്രമായ അധികാരത്തിന്റെ ആശയം സാധ്യമായ സൂചനയാണെങ്കിലും, അത് മുഖ്യവാചകത്തിൽ നിർബന്ധിതമായി ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ വ്യവസ്ഥ, രണ്ട് ബദലുകളുടെ ഘടന, ഉറവിടത്തെക്കുറിച്ചുള്ള ഭാഷ എന്നിവ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചേരേണ്ട യഥാർഥ പദപ്രയോഗമായ ‘എന്നിൽനിന്നുതന്നെ’ എന്നതിന് പിന്നാലെ [a] ചേർത്തു.
