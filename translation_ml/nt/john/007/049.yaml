  terminology: ‘ന്യായപ്രമാണം’ is an established and comprehensible Malayalam biblical term for νόμος in this Torah/Mosaic-law context. The cultural footnote supplies the needed specificity without overexplaining the main text. ‘ശാപത്തിന് കീഴിലാണ്’ is a valid lexical alternative for ἐπάρατοι.
