  source_fidelity: ‘എന്നാൽ’ accurately renders the adversative ἀλλά. ‘ഈ ജനക്കൂട്ടം’ reflects ὁ ὄχλος οὗτος without importing the pejorative sense of ‘mob.’ ‘ന്യായപ്രമാണം അറിയാത്ത’ faithfully represents the attributive participial phrase, and ‘ശപിക്കപ്പെട്ടവരാണ്’ suitably conveys the plural predicate ἐπάρατοί εἰσιν, preserving the Pharisees’ condemnatory wording rather than presenting it as narrator endorsement.
