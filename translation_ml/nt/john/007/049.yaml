base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: ml
  text: എന്നാൽ ന്യായപ്രമാണം[a] അറിയാത്ത ഈ ജനക്കൂട്ടം ശപിക്കപ്പെട്ടവരാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായപ്രമാണം’ എന്നു പറയുന്നത് യഹൂദരുടെ തോറാ അഥവാ മോശെയുടെ നിയമത്തെയാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘ശാപത്തിന് കീഴിലാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ അധികാരികളുടെ നിലപാടിനോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ὄχλος οὗτος
  choice: ഈ ജനക്കൂട്ടം
  rationale: ὄχλος എന്നതിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത ‘ആൾക്കൂട്ടം/കലാപക്കൂട്ടം’ എന്ന അധിക നിന്ദാഭാവം ചേർക്കുന്നില്ല.
- source_word: ὁ μὴ γινώσκων
  choice: അറിയാത്ത
  rationale: ജനക്കൂട്ടത്തെ വിശേഷിപ്പിക്കുന്ന attributive participle മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പകർന്നു.
- source_word: τὸν νόμον
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് യഹൂദരുടെ തോറാ/മോശെയുടെ നിയമം ആണെന്ന സന്ദർഭാർഥം മലയാള ബൈബിൾഭാഷയിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπάρατοί
  choice: ശപിക്കപ്പെട്ടവരാണ്
  rationale: ‘ശാപത്തിന് കീഴിലുള്ളവർ’ എന്ന സാദ്ധ്യമായ അർഥത്തോടൊപ്പം ഗ്രീക്കിലെ ശക്തമായ കുറ്റവിധിയുടെ ഭാവവും predicate plural-ഉം നിലനിർത്തുന്നു.
- source_word: εἰσιν
  choice: ആണ് (ശപിക്കപ്പെട്ടവരാണ് എന്ന ബഹുവചന രൂപത്തിൽ)
  rationale: ഗ്രീക്കിലെ ബഹുവചനം മലയാളത്തിൽ ജനക്കൂട്ടത്തിലെ ആളുകളെ സൂചിപ്പിക്കുന്ന ‘ശപിക്കപ്പെട്ടവരാണ്’ എന്ന രൂപത്തിലൂടെ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രസ്താവന പരീശന്മാരുടെ ശത്രുതാപരമായ വിധിയാണോ, ആഖ്യാതാവിന്റെ ദൈവശാസ്ത്രപരമായ ഉറപ്പോ എന്നത്
  choice: നേരിട്ടുള്ള സംഭാഷണത്തിലെ കഠിനമായ വിധിയായി യാതൊരു മയപ്പെടുത്തലുമില്ലാതെ വിവർത്തനം ചെയ്തു.
  alternative: ‘അവർ പറയുന്നതനുസരിച്ച് ഈ ജനക്കൂട്ടം ശപിക്കപ്പെട്ടതാണ്’ എന്നിങ്ങനെ ആഖ്യാതാവിനെ പ്രത്യേകം അകറ്റിനിർത്തുന്ന വിശദീകരണം ചേർക്കുക.
  rationale: മൂലപാഠം യേശുവിന്റെ എതിരാളികളുടെ നേരിട്ടുള്ള വാക്കുകളാണ് നൽകുന്നത്. അവയെ ആഖ്യാതാവ് അംഗീകരിക്കുന്നു എന്നും നിരാകരിക്കുന്നു എന്നും വിവർത്തനം അധികമായി സൂചിപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ പരിചിതമായ ബൈബിൾപദമായിരിക്കുമ്പോഴും അടിക്കുറിപ്പ് അതിന്റെ സാംസ്കാരിക സൂചന വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
