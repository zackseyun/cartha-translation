id: JHN.7.36
reference: John 7:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: ml
  text: “‘നിങ്ങൾ എന്നെ അന്വേഷിക്കും; എന്നാൽ കണ്ടെത്തുകയില്ല; ഞാൻ എവിടേക്കു പോകുന്നുവോ അവിടേക്ക് വരാൻ നിങ്ങൾക്കു കഴിയുകയുമില്ല’ എന്ന് അവൻ പറഞ്ഞ ഈ വാക്കിന്റെ അർഥമെന്ത്?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ പറഞ്ഞ ഈ മൊഴി എന്താണ്?’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ λόγος എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘വാക്ക്’, ‘മൊഴി’, ‘പ്രസ്താവന’, ‘സന്ദേശം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ചില പരിഭാഷകൾ ഇവിടെ ‘ഞാൻ എവിടേക്കു പോകുന്നുവോ അവിടേക്ക്’ എന്നു നൽകുന്നു. എന്നാൽ ഗ്രീക്ക് പാഠം ‘ഞാൻ എവിടെയാണോ അവിടേക്ക്’ എന്നാണ് പറയുന്നത്; യോഹന്നാന്റെ വാക്കുകളിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം ഇതിൽ നിലനിൽക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: വാക്ക്
  rationale: ഇവിടെ λόγος യേശു പറഞ്ഞ ഒരു ഒറ്റ പദത്തെയല്ല, മുഴുവൻ പ്രസ്താവനയെയാണു സൂചിപ്പിക്കുന്നത്. ‘ഈ വാക്ക്’ എന്ന പ്രയോഗം മലയാളത്തിൽ ഒരു മൊഴിയുടെയോ പ്രസ്താവനയുടെയോ ഉള്ളടക്കത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കാം; അർഥം എന്ന പദത്തോടൊപ്പം ചേർത്തത് τίς ἐστιν എന്ന ചോദ്യത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: ഈ വാക്കിന്റെ അർഥമെന്ത്?
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഈ വാക്ക് എന്താണ്?’ മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ജനക്കൂട്ടം ആ മൊഴിയുടെ അർഥം ചോദിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നതിനാൽ ഈ രൂപം മൂലചോദ്യത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ζητήσετέ με
  choice: നിങ്ങൾ എന്നെ അന്വേഷിക്കും
  rationale: ζητέω എന്നതിന്റെ അന്വേഷിക്കുക/തിരയുക എന്ന അർഥം നിലനിർത്തുന്നു; ‘അന്വേഷിക്കും’ യോഹന്നാനിലെ ഗൗരവമുള്ള പ്രയോഗത്തിന് യോജിക്കുന്നു.
- source_word: οὐχ εὑρήσετε
  choice: എന്നാൽ കണ്ടെത്തുകയില്ല
  rationale: ഭാവികാല നിഷേധം നേരിട്ട് നിലനിർത്തുന്നു. ‘എന്നെ’ ആദ്യ ഉപവാക്യത്തിൽ വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ ആവർത്തിക്കാതെ തന്നെ കർമം വ്യക്തമാണ്.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: ഞാൻ എവിടെയാണോ
  rationale: മൂലത്തിലെ വർത്തമാനകാലമായ εἰμί കൃത്യമായി നിലനിർത്തുന്നു; ‘ഞാൻ എവിടേക്കു പോകുന്നുവോ’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: അവിടേക്ക് വരാൻ നിങ്ങൾക്കു കഴിയുകയുമില്ല
  rationale: δύνασθε സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ വ്യക്തമായി നൽകുന്നു. ὅπου എന്ന ബന്ധവാക്യത്തോടു സ്വാഭാവികമായ മലയാളബന്ധം ഉണ്ടാക്കാൻ ‘അവിടേക്ക്’ ഉപയോഗിച്ചു; കൂടെയുള്ള -ഉം καί എന്ന ബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: εἶπε
  choice: എന്ന് അവൻ പറഞ്ഞ
  rationale: ഉദ്ധരണിയെ പ്രധാന ചോദ്യവുമായി ബന്ധിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ ഭൂതകാലരൂപം.
theological_decisions:
- issue: 'യേശുവിന്റെ മൊഴിയിലെ വർത്തമാനകാലം: ‘ഞാൻ എവിടെയാണോ’'
  choice: ‘ഞാൻ എവിടെയാണോ’ എന്ന വർത്തമാനകാലം നിലനിർത്തി.
  alternative: ‘ഞാൻ എവിടേക്കു പോകുന്നുവോ’
  rationale: ഗ്രീക്കിൽ εἰμί വർത്തമാനകാലത്തിലാണ്. യോഹന്നാന്റെ ഭാഷയിലെ യേശുവിന്റെ സ്ഥാനം, ഉത്ഭവം, പിതാവുമായുള്ള ബന്ധം എന്നിവ സംബന്ധിച്ച ഉദ്ദേശ്യപൂർവമായ സംഘർഷസാധ്യത പരിഭാഷയിൽ വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നേരിട്ടുള്ള ‘ഈ വാക്ക് എന്താണ്?’ എന്ന അസ്വാഭാവിക രൂപത്തിനു പകരം ‘ഈ വാക്കിന്റെ അർഥമെന്ത്?’ ഉപയോഗിച്ചു. ഉദ്ധരണിയിലെ രണ്ടു ഉപവാക്യങ്ങളും καί അനുസരിച്ച് ഒരൊറ്റ തുടർച്ചയായ മൊഴിയായി നിലനിർത്തി.
