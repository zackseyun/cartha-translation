  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: ml
  text: ഞാൻ അവനെ അറിയുന്നു[a], കാരണം ഞാൻ അവനിൽനിന്നാണ്[b]; അവൻ എന്നെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ὅτι എന്ന ഗ്രീക്ക് സംയോജകത്തെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ‘എന്ന്’ എന്ന അർത്ഥത്തിലും എടുക്കാം. എങ്കിലും സന്ദർഭം കാരണസൂചകമായ ‘കാരണം’ എന്ന അർത്ഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഞാൻ അവന്റെ അടുക്കൽ നിന്ന് വന്നു’ അഥവാ ‘ഞാൻ അവന്റെ സന്നിധിയിൽനിന്നാണ്.’ ഗ്രീക്ക് പ്രയോഗം കേവലം ‘അവനിൽനിന്ന്’ എന്നതിനെക്കാൾ വ്യക്തമായി ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം പ്രകടമായി വന്നതിനാൽ യേശുവിന്റെ ഊന്നലുള്ള സ്വയംപ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: οἶδα
  choice: അറിയുന്നു
  rationale: വർത്തമാനകാല അറിവിന്റെ നിലയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; സന്ദർഭത്തിലെ മറ്റുള്ളവരുടെ അറിവില്ലായ്മയോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ പിതാവിനെ സൂചിപ്പിക്കുന്ന വ്യക്തിസർവനാമം വ്യാഖ്യാനപരമായ വിശദീകരണം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ യേശു അവനെ അറിയുന്നതിന്റെ കാരണം അവതരിപ്പിക്കുന്നതായി സന്ദർഭം ശക്തമായി സൂചിപ്പിക്കുന്നു; ‘എന്ന്’ എന്ന ഉള്ളടക്കസൂചക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρ’ αὐτοῦ
  choice: അവനിൽനിന്ന്
  rationale: ജനിറ്റീവോടുകൂടിയ παρά ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കാം. ‘അവനിൽനിന്ന്’ സ്വാഭാവികവും അർത്ഥപരമായി തുറന്നതുമായ മലയാളമാണ്.
- source_word: εἰμι
  choice: ആണ്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല സംയോജകക്രിയ നിലനിർത്തുന്നു; ‘വന്നു’ എന്നു വികസിപ്പിച്ച് അർത്ഥം ദൗത്യത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: κἀκεῖνός
  choice: അവൻ
  rationale: καί + ἐκεῖνος എന്ന സംയുക്തരൂപത്തിന്റെ സന്ദർഭോചിതമായ സ്വാഭാവിക മലയാളം; മുൻവാക്യബന്ധം അർധവിരാമത്തിലൂടെ വ്യക്തമാണ്.
- source_word: με
  choice: എന്നെ
  rationale: ἀπέστειλεν എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം കൃത്യമായി നൽകുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ഏറിസ്റ്റ് ഇൻഡിക്കേറ്റീവിന് സ്വാഭാവികമായ ഭൂതകാലരൂപം; യോഹന്നാനിലെ അയയ്ക്കൽ/ദൗത്യ ആശയം അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι എന്നതിൽ യേശുവും പിതാവും തമ്മിലുള്ള ബന്ധത്തിന്റെ അർത്ഥം
  choice: ‘ഞാൻ അവനിൽനിന്നാണ്’ എന്ന് വിവർത്തനം ചെയ്ത് ഉറവിടം/ഉത്ഭവം പ്രകടിപ്പിക്കുമ്പോഴും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ആഴം തുറന്നുവെക്കുന്നു.
  alternative: ‘ഞാൻ അവന്റെ അടുക്കൽനിന്നു വന്നു’ അല്ലെങ്കിൽ ‘ഞാൻ അവന്റെ സന്നിധിയിൽനിന്നാണ്’
  rationale: ഈ പ്രയോഗം യേശുവിന്റെ പിതാവുമായുള്ള സവിശേഷ ബന്ധത്തെയും ഉത്ഭവത്തെയും സൂചിപ്പിക്കുന്നു. ‘വന്നു’ എന്നു മാത്രം പറഞ്ഞ് ദൗത്യത്തിലേക്കോ ‘സന്നിധിയിൽനിന്ന്’ എന്നു പറഞ്ഞ് സ്ഥലബന്ധത്തിലേക്കോ അർത്ഥം ചുരുക്കാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ὅτι എന്ന സംയോജകത്തിന്റെ കാരണസൂചകമോ ഉള്ളടക്കസൂചകമോ ആയ പ്രയോഗം
  choice: പ്രധാനവാചകത്തിൽ കാരണസൂചകമായി ‘കാരണം’ ഉപയോഗിക്കുന്നു.
  alternative: ഉള്ളടക്കസൂചകമായി ‘എന്ന്’
  rationale: തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിൽ യേശുവിന്റെ യഥാർഥ അറിവും അവന്റെ ഉറവിടവും തമ്മിലുള്ള ബന്ധം കാരണസൂചക വായനയ്ക്ക് പിന്തുണ നൽകുന്നു; എങ്കിലും വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവനിൽനിന്നാണ്’ എന്ന സംക്ഷിപ്തരൂപം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ ഗ്രീക്കിലെ വർത്തമാനകാലവും ഉറവിടസൂചനയും സംരക്ഷിക്കുന്നു. വാക്യത്തിലെ രണ്ടു അടുത്ത ബന്ധമുള്ള പ്രസ്താവനകൾ വേർതിരിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു.
