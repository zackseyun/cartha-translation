source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: ml
  text: എങ്കിലും, യെഹൂദരെ ഭയന്ന് ആരും അവനെക്കുറിച്ച് പരസ്യമായി സംസാരിക്കുകയില്ലായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ സന്ദർഭത്തിൽ കൂടുതൽ നിർദിഷ്ടമായി, ‘യെഹൂദ നേതാക്കളെ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യയിലെ അധികാരികളെ’ എന്നും അർഥമാകാം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘യെഹൂദർ’ എന്ന പദം ചിലപ്പോൾ യെഹൂദജനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കാം; മറ്റു ചില ഭാഗങ്ങളിൽ യേശുവിനെ എതിർത്തിരുന്ന യെരൂശലേം-കേന്ദ്രമായ അധികാരികളെയുമാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: ആരും … ഇല്ല
  rationale: സമഗ്രമായ നിഷേധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സർവനാമത്തെ സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μέντοι
  choice: എങ്കിലും
  rationale: മുൻവാക്യങ്ങളിലെ വ്യത്യസ്ത അഭിപ്രായങ്ങളോട് ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: παρρησίᾳ
  choice: പരസ്യമായി
  rationale: മറച്ചുവെക്കാതെയും പൊതുവേദിയിലും സംസാരിക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; ‘ധൈര്യത്തോടെ’ എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἐλάλει
  choice: സംസാരിച്ചിരുന്നില്ല
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയുള്ളതോ പതിവായതോ ആയ ഭൂതകാലഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive എന്ന ഘടനയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: διὰ τὸν φόβον
  choice: ഭയന്ന്
  rationale: ഭയമാണ് പരസ്യമായി സംസാരിക്കാതിരുന്നതിന്റെ കാരണമെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദരെ
  rationale: ഗ്രീക്കിലെ വിശാലവും സന്ദർഭാനുസൃതമായി വ്യത്യസ്തവുമായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ വിവരണത്തിലെ τῶν Ἰουδαίων എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദരെ’ എന്നു നിലനിർത്തി, സന്ദർഭത്തിൽ അത് യെഹൂദനേതാക്കളെയോ യെഹൂദ്യയിലെ അധികാരികളെയോ കൂടുതൽ നിർദിഷ്ടമായി സൂചിപ്പിക്കാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: യെഹൂദനേതാക്കളെ / യെഹൂദ്യയിലെ അധികാരികളെ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ വ്യാപ്തിയും യോഹന്നാനിലെ സന്ദർഭാനുസൃതമായ അർഥവ്യത്യാസവും സംരക്ഷിക്കുന്നു. അതേസമയം, എല്ലാ യെഹൂദരെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്ന കാലവിരുദ്ധമോ യെഹൂദവിരുദ്ധമോ ആയ വായന ഒഴിവാക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സംസാരിച്ചിരുന്നില്ല’ എന്ന രൂപം ഗ്രീക്ക് ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചാഭാവം സൂക്ഷിക്കുന്നു; ‘പരസ്യമായി’ പൊതുവിൽ മറയില്ലാതെ സംസാരിക്കുക എന്ന ആശയം നൽകുന്നു.
