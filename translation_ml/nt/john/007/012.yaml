source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: ml
  text: അവനെക്കുറിച്ച് ജനക്കൂട്ടങ്ങൾക്കിടയിൽ വളരെയേറെ പിറുപിറുപ്പുണ്ടായിരുന്നു[a]. ചിലർ, “അവൻ നല്ലവനാണ്” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു. മറ്റു ചിലർ, “അല്ല; മറിച്ച് അവൻ ജനക്കൂട്ടത്തെ വഴിതെറ്റിക്കുന്നു[b]” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അടക്കംപറച്ചിൽ” അല്ലെങ്കിൽ “കുശുകുശുപ്പ്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ജനക്കൂട്ടത്തെ വഞ്ചിക്കുന്നു” അല്ലെങ്കിൽ “തെറ്റായ വഴിയിലേക്കു നയിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: അടക്കംപറച്ചിൽ
  rationale: തുറന്ന പൊതുചർച്ചയല്ലാതെ താഴ്ന്ന ശബ്ദത്തിൽ നടക്കുന്ന അഭിപ്രായപ്രകടനത്തെയോ പിറുപിറുപ്പിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ രഹസ്യസ്വഭാവമുള്ള, ഭിന്നാഭിപ്രായങ്ങളടങ്ങിയ സംസാരത്തെ സ്വാഭാവിക മലയാളത്തിൽ ഇതു പ്രകടിപ്പിക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: യേശുവാണ് സംസാരവിഷയം എന്ന ലളിതമായ അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πολύς
  choice: ഏറെ
  rationale: അടക്കംപറച്ചിലിന്റെ വ്യാപ്തി ഗണ്യമായിരുന്നുവെന്ന ഊന്നൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐν τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങൾക്കിടയിൽ
  rationale: ὄχλοι എന്ന ബഹുവചനം നിലനിർത്തുകയും കൂടിവന്ന വിവിധ കൂട്ടങ്ങൾക്കിടയിലെ സംസാരമെന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: ചിലർ ... മറ്റു ചിലർ ...
  rationale: ജനക്കൂട്ടങ്ങളിലെ രണ്ടു വിരുദ്ധ വിഭാഗങ്ങളെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ἀγαθός ἐστιν
  choice: അവൻ നല്ലവനാണ്
  rationale: ഗ്രീക്കിലെ വിശേഷണപ്രയോഗം വ്യക്തിയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള വിലയിരുത്തലായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തിപ്രത്യയരൂപം ഉപയോഗിക്കുന്നു; അധികമായ ദൈവശാസ്ത്രപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: Οὔ, ἀλλὰ
  choice: അല്ല, മറിച്ച്
  rationale: ആദ്യ അഭിപ്രായത്തെ നേരിട്ട് നിഷേധിച്ച് എതിർവാദം ഉന്നയിക്കുന്ന ഘടനയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: πλανᾷ
  choice: വഴിതെറ്റിക്കുന്നു
  rationale: തെറ്റായ വഴിയിലേക്കു നയിക്കുക എന്ന അർഥം വ്യക്തമാക്കുന്നു; മനഃപൂർവമായ വഞ്ചനയാണോ ഫലമായുള്ള തെറ്റിച്ചുനയിക്കലാണോ എന്ന് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
- source_word: τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ
  rationale: ഇവിടെയുള്ള ഏകവചനത്തെ കൂട്ടായ ജനസമൂഹമായി പരിഭാഷപ്പെടുത്തി ഗ്രീക്കിലെ എണ്ണമാറ്റം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള ജനക്കൂട്ടത്തിന്റെ വിരുദ്ധ വിലയിരുത്തലുകൾ
  choice: അനുകൂലവും പ്രതികൂലവുമായ രണ്ടു പ്രസ്താവനകളും നേരിട്ടും നിഷ്പക്ഷമായും റിപ്പോർട്ട് ചെയ്തു.
  alternative: ഒരഭിപ്രായത്തെ ആഖ്യാതാവിന്റെ അംഗീകാരമെന്നപോലെ മൃദൂകരിക്കുകയോ ശക്തിപ്പെടുത്തുകയോ ചെയ്യുക.
  rationale: വാക്യം യേശുവിനെക്കുറിച്ചുള്ള വിഭജിതമായ പൊതുജനാഭിപ്രായമാണ് രേഖപ്പെടുത്തുന്നത്; ആഖ്യാതാവ് ഇവിടെ ഏതെങ്കിലും പക്ഷത്തെ തുറന്നു പിന്തുണയ്ക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ജനക്കൂട്ടങ്ങൾ/ജനക്കൂട്ടം എന്ന ബഹുവചന-ഏകവചന വ്യത്യാസവും വിരുദ്ധ അഭിപ്രായങ്ങളുടെ നേരിട്ടുള്ള ഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
