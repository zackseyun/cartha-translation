id: JHN.7.42
reference: John 7:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: ml
  text: “മശീഹ[a] ദാവീദിന്റെ സന്തതിയിൽനിന്ന്, ദാവീദ് ഉണ്ടായിരുന്ന ഗ്രാമമായ ബെത്‌ലഹേമിൽനിന്ന് വരുന്നു എന്ന് തിരുവെഴുത്ത് പറഞ്ഞിട്ടില്ലേ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ക്രിസ്തു.” ഗ്രീക്കിൽ: ὁ χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: യോഹന്നാനിലെ പ്രയോഗത്തിൽ അധികാരമുള്ള വിശുദ്ധലിഖിതത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം; മലയാളത്തിൽ ‘തിരുവെഴുത്ത്’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: εἶπεν
  choice: പറഞ്ഞിട്ടില്ലേ
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റ് ഇവിടെ തിരുവെഴുത്തിന്റെ നിലനിൽക്കുന്ന സാക്ഷ്യത്തെ ഉന്നയിക്കുന്ന അലങ്കാരചോദ്യമാണ്; മലയാളത്തിലെ നിഷേധരൂപത്തിലുള്ള ചോദ്യം അതിന്റെ ബലം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: ദാവീദിന്റെ സന്തതിയിൽനിന്നും
  rationale: σπέρμα ഇവിടെ അക്ഷരാർഥത്തിലുള്ള വിത്തല്ല, വംശപരമ്പരയാണ്; ‘സന്തതി’ ആ വംശാവലി അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ Βηθλέεμ
  choice: ബെത്‌ലഹേമിൽനിന്നും
  rationale: ἀπό ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: τῆς κώμης
  choice: ഗ്രാമമായ
  rationale: κώμη ചെറിയ പാർപ്പിടകേന്ദ്രം/ഗ്രാമം എന്ന അർഥത്തിലാണ്; ‘ഗ്രാമം’ പട്ടണം എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: ὅπου ἦν Δαυίδ
  choice: ദാവീദ് ഉണ്ടായിരുന്ന
  rationale: ഗ്രീക്കിലെ ലളിതമായ ‘ദാവീദ് ഉണ്ടായിരുന്ന’ എന്ന വാചകം നിലനിർത്തുന്നു; ‘താമസിച്ചിരുന്ന’ അല്ലെങ്കിൽ ‘വന്ന’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: തിരുവെഴുത്തിൽ പ്രസ്താവിച്ചിരിക്കുന്ന മശീഹയുടെ ഉത്ഭവത്തെക്കുറിച്ചുള്ള പൊതുവർത്തമാനകാലത്തെ നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός യഹൂദരുടെ പ്രതീക്ഷയിലുള്ള അഭിഷിക്ത രാജാവും വിമോചകനുമായ പദവിയാണ്; പേരുപോലെ ലിപ്യന്തരണം ചെയ്യുന്നതിനു പകരം പദവിയുടെ അർഥം നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭം യഹൂദ മശീഹാപ്രതീക്ഷയെക്കുറിച്ചുള്ള തർക്കമാണ്; അതിനാൽ പദവിയുടെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ യോജിക്കുന്നു. ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ അലങ്കാരചോദ്യവും ‘ദാവീദ് ഉണ്ടായിരുന്ന’ എന്ന ഉദ്ദേശപൂർവമായ ലാളിത്യവും സംരക്ഷിച്ചിട്ടുണ്ട്; അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
