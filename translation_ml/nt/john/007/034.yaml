id: JHN.7.34
reference: John 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: ml
  text: നിങ്ങൾ എന്നെ അന്വേഷിക്കും; എന്നാൽ കണ്ടെത്തുകയില്ല. ഞാൻ എവിടെയാണോ, അവിടേക്കു വരാൻ നിങ്ങൾക്കു കഴിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: അന്വേഷിക്കും
  rationale: ഭാവികാല സജീവക്രിയയായ ഈ പദം യേശുവിനെ കണ്ടെത്താൻ ശ്രമിക്കുന്ന സന്ദർഭം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: με
  choice: എന്നെ
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: οὐχ εὑρήσετε
  choice: കണ്ടെത്തുകയില്ല
  rationale: ഊന്നൽ കൂട്ടിച്ചേർക്കാതെ നിഷേധിക്കപ്പെട്ട ഭാവികാലക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: ഞാൻ എവിടെയാണോ
  rationale: സ്ഥലസൂചനയും ἐγώ നൽകുന്ന ‘ഞാൻ’ എന്ന നേരിയ ഊന്നലും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അവിടെ ഞാൻ ഉണ്ടായിരിക്കും’ എന്ന ഭാവികാലഭാവം ചേർക്കുന്നില്ല.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: അവിടേക്കു വരാൻ നിങ്ങൾക്കു കഴിയില്ല
  rationale: δύνασθε സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മയെ വ്യക്തമായി നിലനിർത്തുന്നു; അനുമതിയില്ലായ്മയെന്ന അർഥം നൽകുന്നില്ല. ὅπου എന്ന സ്ഥലബന്ധം സ്വാഭാവിക മലയാളത്തിനായി ‘അവിടേക്കു’ എന്നതിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: “ഞാൻ എവിടെയാണോ, അവിടേക്കു വരാൻ നിങ്ങൾക്കു കഴിയില്ല” എന്ന പ്രസ്താവനയിലെ കഴിയായ്മയുടെ സ്വഭാവം
  choice: കഴിവില്ലായ്മയായി മാത്രം പരിഭാഷപ്പെടുത്തി; അതിന്റെ കാരണം വ്യക്തമാക്കിയില്ല.
  alternative: “അവിടേക്കു വരാൻ നിങ്ങൾക്ക് അനുവാദമില്ല” എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: δύνασθε കഴിവിനെയോ സാധ്യത്തെയോ സംബന്ധിക്കുന്നതാണ്, അനുമതിയെ അല്ല. ഈ കഴിയായ്മ ധാർമികമോ ആത്മീയമോ ന്യായവിധിസംബന്ധമോ താൽക്കാലികമോ എന്ന് വാക്യം തന്നെ നിർവചിക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. രണ്ട് സമാന്തര പ്രസ്താവനകളുടെ ശക്തി നിലനിർത്താൻ അർധവിരാമവും പൂർണവിരാമവും ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
