id: JHN.7.15
reference: John 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദന്മാർ[a] ആശ്ചര്യപ്പെട്ടുകൊണ്ട് പറഞ്ഞു: “ഈ മനുഷ്യൻ പഠിച്ചിട്ടില്ലാതിരിക്കെ എങ്ങനെ പാണ്ഡിത്യമുള്ളവനായിരിക്കുന്നു?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഇവിടെ “യെഹൂദന്മാർ” എന്നത് യെരൂശലേമിൽ യേശുവിനോട് സംസാരിച്ചവരെയോ എതിർത്തവരെയോ—സാധ്യതയോടെ യെഹൂദ്യ അധികാരികളെയും ഉൾപ്പെടുത്തി—സന്ദർഭാനുസൃതമായി സൂചിപ്പിക്കുന്നു; മുഴുവൻ യെഹൂദജനതയെയല്ല.
    reason: cultural_note
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “അക്ഷരങ്ങൾ അറിയുന്നു”; സന്ദർഭത്തിൽ ഔപചാരിക പഠനത്തിലൂടെ ലഭിക്കുന്ന അറിവിനെയോ പാണ്ഡിത്യത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: ആശ്ചര്യപ്പെട്ടുകൊണ്ട്
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: യോഹന്നാനിലെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പൊതുവായ പദരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ പരിമിതമായ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കൃതന്തത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനരീതിയിൽ നൽകുന്നു.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: മാർഗമോ അടിസ്ഥാനമോ ചോദിക്കുന്ന നേരിട്ടുള്ള ചോദ്യത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: οὗτος
  choice: ഈ മനുഷ്യന്
  rationale: ‘ഇവന്‍’ എന്നതിനേക്കാൾ dignified ആയിരിക്കെ ഗ്രീക്കിലെ അല്പം അകലം പാലിക്കുന്ന സൂചന നിലനിർത്തുന്നു.
- source_word: γράμματα οἶδεν
  choice: ഇത്ര പാണ്ഡിത്യം ലഭിച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘അക്ഷരങ്ങൾ അറിയുന്നു’ എന്നാണെങ്കിലും, ഇവിടെ ഔപചാരികമായ പഠനത്തിലൂടെ ലഭിക്കുന്ന ഗ്രന്ഥജ്ഞാനമോ പാണ്ഡിത്യമോ ആണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ അക്ഷരാർഥപ്രയോഗം വെറും സാക്ഷരതയായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- source_word: μὴ μεμαθηκώς
  choice: പഠിച്ചിട്ടില്ലാത്ത
  rationale: അംഗീകൃതമായ ഔപചാരിക ശിക്ഷണം ലഭിച്ചിട്ടില്ലെന്ന ആശയം സ്ഥാപനത്തെ അതിയായി നിർണയിക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘യെഹൂദന്മാർ’ നിലനിർത്തി സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’ എന്ന് പ്രധാനപാഠത്തിൽ നൽകുക.
  rationale: മൂലപദത്തിന്റെ വിശാലത ചുരുക്കാതെ നിലനിർത്തുകയും, അത് മുഴുവൻ യെഹൂദജനതയെയും സൂചിപ്പിക്കുന്നുവെന്ന ആധുനിക തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: γράμματα എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘പാണ്ഡിത്യം’ എന്ന സന്ദർഭോചിത അർഥം നൽകി അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
  alternative: ‘അക്ഷരങ്ങൾ അറിയുന്നു’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: ഇവിടെ ചോദ്യം സാധാരണ സാക്ഷരതയെക്കുറിച്ചല്ല, ഔപചാരികമായി പഠിക്കാതെയുള്ള ഗ്രന്ഥപരമായ അറിവിനെക്കുറിച്ചാണ്; എന്നിരുന്നാലും ഗ്രീക്ക് ഭാഷാശൈലി അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ തുടരുന്ന ആശ്ചര്യഭാവം സംരക്ഷിച്ചു. ‘യെഹൂദന്മാർ’ എന്ന പദത്തിന്റെ സന്ദർഭപരമായ പരിധിയും γράμματα എന്ന ഭാഷാശൈലിയുടെ അക്ഷരാർഥവും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കി.
