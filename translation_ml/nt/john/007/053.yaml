  naturalness: ‘ഓരോരുത്തരും താന്താന്റെ വീട്ടിലേക്കു പോയി’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്. അടിക്കുറിപ്പിലെ ‘ദൈവശാസ്ത്രപരവും ഇടയപരവുമായ പ്രിയം’ എന്ന പ്രയോഗം താരതമ്യേന അസ്വാഭാവികമാണ്.
