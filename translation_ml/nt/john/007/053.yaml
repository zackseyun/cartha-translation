translation:
  language: ml
  text: ഓരോരുത്തരും താന്താന്റെ വീട്ടിലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തോടെയാണ് വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള വിവരണം ആരംഭിക്കുന്നത് (യോഹന്നാൻ 7:53–8:11). മൂന്നാം നൂറ്റാണ്ടിലെ പാപ്പിറസ് കൈയെഴുത്തുപ്രതികളിലും നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നീ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലും ആദ്യകാല കോപ്റ്റിക്, സുറിയാനി പരിഭാഷകളിലും ഈ ഭാഗം മുഴുവനും ഇല്ല. അഞ്ചാം നൂറ്റാണ്ടിലെ കോഡെക്സ് ബെസയിലും ലത്തീൻ പാരമ്പര്യത്തിലും പിൽക്കാല ബൈസന്റൈൻ ഭൂരിപക്ഷപാരമ്പര്യത്തിലും ഇതുണ്ട്. ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ കഥ യോഹന്നാൻ 21:25-നു ശേഷമോ ലൂക്കോസ് 21:38-നു ശേഷമോ പോലുള്ള വ്യത്യസ്ത സ്ഥാനങ്ങളിൽ കാണപ്പെടുന്നു. ഇത് സങ്കീർണമായ പാഠചരിത്രത്തെ സൂചിപ്പിക്കുന്നു; സ്വതന്ത്രമായി പ്രചരിച്ചിരുന്ന ഒരു പാരമ്പര്യം പിന്നീട് പാഠപാരമ്പര്യത്തിൽ ഉൾപ്പെട്ടതാകാമെന്ന അഭിപ്രായവും ഉണ്ട്. ഏകദേശം 1,500 വർഷത്തെ ക്രൈസ്തവ വായനയിൽ ഇതിനുണ്ടായിരുന്ന ദൈവശാസ്ത്രപരവും ഇടയപരവുമായ പ്രാധാന്യവും സ്നേഹാദരവും കണക്കിലെടുത്ത് ഇത് ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: അപ്പോൾ
  rationale: വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ബന്ധകമായി ഇവിടെ സ്വാഭാവികമായ മലയാളം; ഗ്രീക്കിലെ ലളിതമായ ‘καί’യുടെ സന്ദർഭപ്രകാരമുള്ള അർഥം നൽകുന്നു.
- source_word: ἐπορεύθη
  choice: പോയി
  rationale: പിരിഞ്ഞ് സ്വന്തം വസതിയിലേക്കുള്ള സഞ്ചാരത്തെ ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἕκαστος
  choice: ഓരോരുത്തരും
  rationale: ഓരോ വ്യക്തിയെയും പ്രത്യേകം ഊന്നുന്ന ഏകവചന ഗ്രീക്ക് പദത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: അവരവരുടെ വീട്ടിലേക്കു
  rationale: ‘സ്വന്തം വീട്ടിലേക്ക്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം കൃത്യമായി നൽകുകയും ഓരോരുത്തരുടെയും സ്വന്തം വീട് എന്ന വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യോഹന്നാൻ 7:53–8:11-ന്റെ പാഠചരിത്രം
  choice: ലഭിച്ച ബൈസന്റൈൻ മൂലപാഠപ്രകാരം വാക്യം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, പാഠവ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ഈ ഭാഗം മുഖ്യപാഠത്തിൽനിന്ന് ഒഴിവാക്കുക അല്ലെങ്കിൽ കോഷ്ഠകത്തിൽ മാത്രം നൽകുക.
  rationale: ഈ ഭാഗം പിൽക്കാല ബൈസന്റൈൻ പാരമ്പര്യത്തിൽ ഉറച്ച സാന്നിധ്യമുള്ളതും ദീർഘകാല സഭാവായനയിൽ സംരക്ഷിക്കപ്പെട്ടതുമാണ്; അതേസമയം ആദ്യകാല സാക്ഷ്യങ്ങളിൽ ഇല്ലായ്മയും വിവിധ സ്ഥാനങ്ങളിലെ പ്രത്യക്ഷതയും വായനക്കാരനിൽനിന്ന് മറയ്ക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘അവരവരുടെ’ എന്ന പ്രയോഗം ἕκαστος ... αὐτοῦ എന്ന വിതരണാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
