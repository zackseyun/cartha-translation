  rationale: മുഖ്യപാഠത്തിൽ മൂലഗ്രീക്കിന്റെ വിതരണാർഥവും ലളിതമായ ഭൂതകാലവിവരണവും നിലനിർത്തി, മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന ഒഴിവാക്കി. അടിക്കുറിപ്പ് ആദ്യകാല അഭാവം, പിൽക്കാല സാന്നിധ്യം, സ്ഥാനാന്തര സാക്ഷ്യം എന്നിവ റിപ്പോർട്ട് ചെയ്യുന്നു; എന്നാൽ പാഠചരിത്രത്തെക്കുറിച്ചുള്ള തർക്കവിഷയമായ വായ്മൊഴി-ഉത്ഭവനിഗമനം തീർച്ചയായി അവതരിപ്പിക്കാതെ സാധ്യതയായി രേഖപ്പെടുത്തുന്നു.
