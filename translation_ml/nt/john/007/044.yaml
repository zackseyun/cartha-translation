translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പിടികൂടാൻ’ എന്നത് മൂലപദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; നിയമപരമായ അറസ്റ്റ് എന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
