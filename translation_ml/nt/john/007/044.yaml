  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: ml
  text: എന്നാൽ അവരിൽ ചിലർ അവനെ പിടികൂടാൻ[a] ആഗ്രഹിച്ചു; എങ്കിലും ആരും അവന്റെമേൽ കൈവെച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അറസ്റ്റ് ചെയ്യാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: എന്നാൽ ... ചിലർ
  rationale: മുൻവാക്യങ്ങളിലെ ജനക്കൂട്ടത്തിന്റെ വ്യത്യസ്ത പ്രതികരണങ്ങളോടുള്ള വൈരുധ്യം δὲ സൂചിപ്പിക്കുന്നു; τινὲς അനിശ്ചിതമായ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ചിലർ’ സ്വാഭാവികമാണ്.
- source_word: ἐξ αὐτῶν
  choice: അവരിൽ
  rationale: വലിയ കൂട്ടത്തിനുള്ളിലെ ചിലരെ സൂചിപ്പിക്കുന്ന ‘from among them’ എന്ന അർഥം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἤθελον
  choice: ആഗ്രഹിച്ചു
  rationale: ഭൂതകാലത്തിലെ ഉദ്ദേശമോ ആഗ്രഹമോ വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് അപൂർണ്ണകാലത്തിന്റെ ദൈർഘ്യഭാവം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πιάσαι αὐτόν
  choice: അവനെ പിടികൂടാൻ
  rationale: πιάζω എന്നതിന്റെ അടിസ്ഥാനമായ പിടിച്ചെടുക്കൽ എന്ന അർഥവും ഈ സന്ദർഭത്തിലെ അറസ്റ്റ് ചെയ്യൽ എന്ന സൂചനയും ഒരുപോലെ അനുവദിക്കുന്നു.
- source_word: ἀλλ’ οὐδεὶς
  choice: എങ്കിലും ആരും ... ഇല്ല
  rationale: അവരുടെ ഉദ്ദേശവും യഥാർഥ ഫലവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: അവന്റെമേൽ കൈവെച്ചില്ല
  rationale: ഒരാളെ ബലമായി പിടിക്കുകയോ കസ്റ്റഡിയിലെടുക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും ശക്തിയും മലയാളത്തിലെ പരിചിതമായ സമാനപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
