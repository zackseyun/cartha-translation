id: JHN.7.6
reference: John 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു അവരോടു പറഞ്ഞു: “എന്റെ സമയം ഇനിയും വന്നിട്ടില്ല[a]; എന്നാൽ നിങ്ങൾക്കുള്ള സമയം എപ്പോഴും അനുകൂലമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കായി നിശ്ചയിക്കപ്പെട്ട സമയം ഇനിയും എത്തിയിട്ടില്ല.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം പൊതുവായ സമയത്തെ മാത്രമല്ല, യോജിച്ച അഥവാ നിശ്ചിത സമയത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനപരമായ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: യേശു ... പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും മലയാള ആഖ്യാനശൈലിയിൽ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: ദാതൃവിഭക്തിയിലെ പരോക്ഷ കർമത്തെ സന്ദർഭത്തിലെ വ്യക്തികളെ അധികമായി വ്യക്തമാക്കാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: καιρός
  choice: സമയം
  rationale: പൊതുവായ കാലത്തേക്കാൾ യോജിച്ച അഥവാ നിശ്ചിത അവസരത്തെ സൂചിപ്പിക്കാമെങ്കിലും, പ്രധാനവാചകത്തിൽ അർത്ഥം അമിതമായി നിർണയിക്കാതെ സ്വാഭാവികമായ പദം നിലനിർത്തുന്നു.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: എന്റെ സമയം
  rationale: ഊന്നലുള്ള ഉടമസ്ഥഘടനയും യേശുവിന്റെ സമയവും മറ്റുള്ളവരുടെ സമയവും തമ്മിലുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: οὔπω πάρεστιν
  choice: ഇനിയും വന്നിട്ടില്ല
  rationale: പ്രസ്തുത സമയം ഇതുവരെ എത്തിയിട്ടില്ലെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യേശുവിന്റെ സമയവും അവരുടേതും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: നിങ്ങളുടെ സമയം
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ‘എന്റെ സമയം’ എന്ന ഘടനയോടുള്ള സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: πάντοτέ
  choice: എപ്പോഴും
  rationale: ‘എല്ലാ സമയത്തും’ എന്ന അർത്ഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕτοιμος
  choice: ഒരുങ്ങിയിരിക്കുന്നു
  rationale: സമയം ലഭ്യവും യോജിച്ചതുമായ നിലയിൽ ഉണ്ടെന്ന ആശയം സംരക്ഷിക്കുമ്പോൾ ‘സമയം ഒരുങ്ങിയിരിക്കുന്നു’ എന്ന ഗൗരവമുള്ള പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ യേശുവിന്റെ ‘സമയം’ എന്നതിന്റെ അർത്ഥം
  choice: പ്രധാനവാചകത്തിൽ ‘എന്റെ സമയം’ എന്നു നൽകി.
  alternative: ‘എനിക്കായി നിശ്ചയിക്കപ്പെട്ട സമയം’ അല്ലെങ്കിൽ ‘എന്റെ നാഴിക’
  rationale: ഇവിടെ ഗ്രീക്ക് പദം καιρός ആണ്, ὥρα അല്ല. യേശുവിന്റെ ദൗത്യവുമായി ബന്ധപ്പെട്ട ദൈവനിശ്ചിത സമയത്തിന്റെ ധ്വനി ഉണ്ടാകാമെങ്കിലും അതിനെ പ്രധാനവാചകത്തിൽ വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ അർത്ഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. καιρός എന്ന പദത്തിലെ ‘യോജിച്ച/നിശ്ചിത സമയം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു; പ്രധാനവാചകത്തിൽ സമാന്തരഘടനയും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
