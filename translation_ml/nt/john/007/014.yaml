  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: ml
  text: പെരുന്നാൾ ഇതിനകം പകുതിയിലെത്തിയപ്പോൾ[a], യേശു ദൈവാലയത്തിലേക്കു കയറിച്ചെന്നു[b] പഠിപ്പിച്ചുകൊണ്ടിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പെരുന്നാൾ മധ്യത്തിലെത്തിയപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ദൈവാലയം” എന്നു പരിഭാഷപ്പെടുത്തിയ ἱερόν എന്ന ഗ്രീക്കുപദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയോ അതിലെ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “പഠിപ്പിക്കുകയായിരുന്നു.” ഗ്രീക്ക് ഇംപെർഫെക്റ്റ് തുടരുന്ന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: ആയിക്കഴിഞ്ഞപ്പോൾ
  rationale: പെരുന്നാൾ അതിന്റെ മധ്യഘട്ടത്തിൽ ഇതിനകം എത്തിയെന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δὲ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: പെരുന്നാൾ പകുതിയായിക്കഴിഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന കാലസാഹചര്യവും μεσόω സൂചിപ്പിക്കുന്ന മധ്യത്തിലെത്തിയ അവസ്ഥയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνέβη
  choice: കയറിച്ചെന്നു
  rationale: ἀναβαίνω എന്ന പദത്തിലെ ‘മുകളിലേക്കു പോകുക’ എന്ന ദിശാസൂചനയും ദൈവാലയത്തിലേക്കുള്ള പ്രവേശനവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: εἰς τὸ ἱερὸν
  choice: ദൈവാലയത്തിലേക്കു
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന നിലനിർത്തുന്നു; ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത് എന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: ഗ്രീക്ക് ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന പ്രവൃത്തിയെന്ന ഭാവം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ‘തുടങ്ങി’ എന്ന ആരംഭസൂചന ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἱερόν എന്ന പദത്തിന്റെ പരിധി
  choice: പ്രധാനവാചകത്തിൽ ‘ദൈവാലയം’; അടിക്കുറിപ്പിൽ ദൈവാലയസമുച്ചയം/അങ്കണങ്ങൾ എന്നു വ്യക്തമാക്കുന്നു
  alternative: ദൈവാലയാങ്കണങ്ങളിലേക്കു
  rationale: ἱερόν എന്നത് ναός പോലെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. എന്നാൽ സാധാരണ വായനയ്ക്ക് പരിചിതമായ ‘ദൈവാലയം’ നിലനിർത്തി സ്ഥലപരമായ കൃത്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ἐδίδασκεν എന്ന ഇംപെർഫെക്റ്റിന്റെ ഭാവം
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  alternative: പഠിപ്പിക്കാൻ തുടങ്ങി
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെന്ന ഭാവം വ്യക്തമാണ്; ‘തുടങ്ങി’ എന്നത് സന്ദർഭത്തിൽ സാധ്യമെങ്കിലും ഗ്രീക്ക് ക്രിയയിൽ നിർബന്ധമായും പ്രകടമല്ല.
