id: JHN.7.31
reference: John 7:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: ml
  text: 'എന്നാൽ ജനക്കൂട്ടത്തിൽപ്പെട്ട പലരും അവനിൽ വിശ്വസിച്ചു. അവർ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “മശീഹാ[a] വരുമ്പോൾ, ഈ മനുഷ്യൻ ചെയ്തതിലും അധികം അടയാളങ്ങൾ ചെയ്യുകയില്ലല്ലോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.” ഇവിടെ ഗ്രീക്കിലെ Χριστός യഹൂദരുടെ മശീഹാപ്രതീക്ഷയുടെ പശ്ചാത്തലത്തിൽ ഒരു പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “മശീഹാ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: എന്നാൽ ജനക്കൂട്ടത്തിൽപ്പെട്ട പലരും
  rationale: ἐκ τοῦ ὄχλου എന്നതിന്റെ വലിയ ജനക്കൂട്ടത്തിൽനിന്നുള്ള ഒരു വിഭാഗം എന്ന അംശാർത്ഥം ‘ജനക്കൂട്ടത്തിൽപ്പെട്ട’ എന്നു സ്വാഭാവികമായി നൽകുന്നു. δέ ചുറ്റുപാടിലെ അവിശ്വാസത്തോടുള്ള മൃദുവായ വൈരുധ്യമായി ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിച്ചു
  rationale: വിശ്വാസം യേശുവിലേക്കു വ്യക്തിപരമായി തിരിയുന്നതിനെ സൂചിപ്പിക്കുന്ന πιστεύω εἰς എന്ന യോഹന്നാനീയ പ്രയോഗം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചിരുന്നോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ χριστός ഒരു വ്യക്തിനാമംപോലെയല്ല, യഹൂദരുടെ പ്രതീക്ഷയിലുള്ള അഭിഷിക്തന്റെ പദവിയായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ‘മശീഹാ’ എന്നു നൽകി.
- source_word: πλείονα σημεῖα
  choice: അധികം അടയാളങ്ങൾ
  rationale: πλείονα പ്രധാനമായും എണ്ണത്തിലെ കൂടുതലിനെ സൂചിപ്പിക്കുന്നു; ‘വലിയ’ എന്ന ഗുണപരമായ അർത്ഥം ചേർക്കുന്നില്ല. യോഹന്നാനിലെ σημεῖα എന്ന സവിശേഷ പദപ്രയോഗം ‘അത്ഭുതങ്ങൾ’ എന്നു ചുരുക്കാതെ ‘അടയാളങ്ങൾ’ എന്നു നിലനിർത്തുന്നു.
- source_word: οὗτος ἐποίησεν
  choice: ഈ മനുഷ്യൻ ചെയ്തതിലും
  rationale: οὗτος ജനക്കൂട്ടം യേശുവിനെ പരാമർശിക്കുന്ന പൊതുസംസാരശൈലിയിലാണ്; ‘ഈ മനുഷ്യൻ’ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ‘വരുമ്പോൾ’ എന്ന സന്ദർഭം പ്രതീക്ഷിക്കപ്പെടുന്ന യഹൂദ മശീഹാപദവിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത തത്തുല്യം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: μή ഉള്ള ചോദ്യത്തിന്റെ പ്രതീക്ഷിത നിഷേധസ്വരം
  choice: ചെയ്യുകയില്ലല്ലോ?
  alternative: ചെയ്യുമോ?
  rationale: μή ഈ ചോദ്യം ‘ഇല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യമാണെന്ന് സൂചിപ്പിക്കുന്നു. ‘ചെയ്യുകയില്ലല്ലോ?’ ആ പ്രതീക്ഷ നിലനിർത്തുന്നു; അതേസമയം ജനക്കൂട്ടത്തിന്റെ നിഗമനം വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പൊതുഭാഷ ഉപയോഗിച്ചു. ജനക്കൂട്ടത്തിന്റെ തുടർച്ചയായ സംസാരവും വാചാടോപചോദ്യത്തിലെ നിഷേധപ്രതീക്ഷയും നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവിവരങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
