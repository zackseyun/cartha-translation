  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ml
  text: അങ്ങനെ, അവനെച്ചൊല്ലി ജനക്കൂട്ടത്തിൽ ഭിന്നതയുണ്ടായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: ഭിന്നത
  rationale: ജനങ്ങൾക്കിടയിൽ ഉണ്ടായ പിളർപ്പിനെയോ അഭിപ്രായഭേദത്തെയോ സൂചിപ്പിക്കുന്ന പദമാണ്; ആ സാമൂഹിക വിഭജനം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘ഭിന്നത’ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ചർച്ചയുടെ ഫലമോ തുടർച്ചയോ അടയാളപ്പെടുത്തുന്നു; ‘അതുകൊണ്ട്’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγένετο
  choice: ഉണ്ടായി
  rationale: σχίσμα എന്ന അവസ്ഥ നിലവിൽ വന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
- source_word: ἐν τῷ ὄχλῳ
  choice: ജനക്കൂട്ടത്തിൽ
  rationale: കൂടിനിന്നിരുന്ന ജനസമൂഹത്തിനുള്ളിൽ ഭിന്നത ഉണ്ടായെന്ന സ്ഥലപരവും സാമൂഹികവുമായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: δι’ αὐτόν
  choice: അവൻ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു. ‘അവൻ നിമിത്തം’ കാരണബന്ധം നിലനിർത്തുകയും സർവനാമം അനാവശ്യമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: αὐτόν എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി; സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘യേശു നിമിത്തം’ എന്ന് വ്യക്തമായി പറയുക.
  rationale: ഗ്രീക്ക് മൂലത്തിലെ സർവനാമരൂപം മലയാളത്തിലും സ്വാഭാവികമാണ്; സന്ദർഭം സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നതിനാൽ പേര് ചേർത്ത് വ്യാഖ്യാനപരമായി പരിഹരിക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും കാരണബന്ധവും സർവനാമപരമായ സന്ദർഭാശ്രിതത്വവും നിലനിർത്തിയിരിക്കുന്നു.
