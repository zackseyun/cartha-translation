id: JHN.7.38
reference: John 7:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: ml
  text: എന്നിൽ വിശ്വസിക്കുന്നവന്റെ ഉള്ളിൽനിന്ന്[b], തിരുവെഴുത്ത് പറഞ്ഞിരിക്കുന്നതുപോലെ[a], ജീവജലത്തിന്റെ നദികൾ ഒഴുകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ വാക്യവിഭജനം രണ്ടുവിധത്തിൽ മനസ്സിലാക്കാം; “തിരുവെഴുത്ത് പറഞ്ഞിരിക്കുന്നതുപോലെ” എന്ന ഘടകത്തെ “എന്നിൽ വിശ്വസിക്കുന്നവൻ” എന്നതോടും ബന്ധിപ്പിച്ചു വായിക്കാം.
    reason: syntactic_ambiguity
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “അവന്റെ വയറിൽനിന്ന്” അല്ലെങ്കിൽ “അവന്റെ ഗർഭപാത്രത്തിൽനിന്ന്”; ഇവിടെ ഇത് അന്തരംഗത്തെ സൂചിപ്പിക്കുന്ന രൂപകമായിരിക്കാം. “അവന്റെ” എന്നത് വിശ്വസിക്കുന്നവനെയല്ല, മിശിഹാവിനെയാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: എന്നിൽ വിശ്വസിക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം വിശ്വാസത്താൽ സവിശേഷനായ ഒരാളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ഏകവചനവും പൊതുവായ അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: തിരുവെഴുത്ത് പറഞ്ഞിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്തിന്റെ ആധികാരിക സാക്ഷ്യത്തെ പരിചയപ്പെടുത്തുന്ന പ്രയോഗമാണിത്. ഗ്രീക്കിലെ ഏകവചനമായ ἡ γραφή നിലനിർത്തുകയും, അതിന്റെ പ്രസ്താവന ഇപ്പോഴും പ്രാബല്യമുള്ളതെന്ന മലയാളത്തിലെ സ്വാഭാവിക ഭാവം നൽകുകയും ചെയ്യുന്നു.
- source_word: ποταμοὶ
  choice: നദികൾ
  rationale: ചെറിയ നീരൊഴുക്കുകളേക്കാൾ സമൃദ്ധിയുടെ ശക്തമായ ദൃശ്യബിംബം നൽകുന്ന ‘നദികൾ’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: അവന്റെ ഉള്ളിൽനിന്ന്
  rationale: κοιλία എന്നതിന് അക്ഷരാർഥത്തിൽ വയർ അഥവാ ഗർഭപാത്രം എന്നാകാമെങ്കിലും ഇവിടെ വ്യക്തിയുടെ അന്തരംഗകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്. ‘ഉള്ളിൽനിന്ന്’ എന്നത് അനാവശ്യമായ ശരീരശാസ്ത്രപരമായ ധാരണ ഒഴിവാക്കി ഉറവിടഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ῥεύσουσιν
  choice: ഒഴുകും
  rationale: ഭാവികാല സജീവ നിർദ്ദേശകത്തിന്റെ ലളിതവും കൃത്യവുമായ പരിഭാഷ; മൂലത്തിൽ ഇല്ലാത്ത അധിക തീവ്രത ചേർക്കുന്നില്ല.
- source_word: ὕδατος ζῶντος
  choice: ജീവജലം
  rationale: യോഹന്നാനിലെ ആവർത്തിതവും ദൈവശാസ്ത്രപരമായി സമ്പന്നവുമായ രൂപകം മലയാളത്തിലെ സ്ഥാപിതമായ സംയുക്തപദത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: വിശ്വസിക്കുന്നവനെയാണ് സൂചിപ്പിക്കുന്നതായി മുഖ്യവാചകത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: മിശിഹാ/യേശുവിനെ സൂചിപ്പിക്കുന്നു; ജീവജലം അവനിൽനിന്ന് ഒഴുകുന്നു.
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണപൂർവപദം ‘വിശ്വസിക്കുന്നവൻ’ ആണ്; കൂടാതെ 7:39-ലെ വിശ്വാസികൾ സ്വീകരിക്കാനിരുന്ന ആത്മാവിനെക്കുറിച്ചുള്ള വിശദീകരണവുമായി ഇത് യോജിക്കുന്നു. എന്നാൽ മിശിഹാവിനെ സൂചിപ്പിക്കുന്ന വായന സാദ്ധ്യമാകുന്നതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: κοιλία എന്ന പദത്തിന്റെ രൂപകാർഥം
  choice: ഉള്ളിൽ
  alternative: വയർ; ഗർഭപാത്രം; അന്തരംഗം
  rationale: അക്ഷരാർഥം നിലനിർത്തിയാൽ ആധുനിക വായനക്കാരന് വെറും ശരീരാവയവത്തെക്കുറിച്ചുള്ള തെറ്റിദ്ധാരണ ഉണ്ടാകാം. ഇവിടെ വ്യക്തിയുടെ ആന്തരിക കേന്ദ്രമാണ് ഉദ്ദേശ്യമെന്നത് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: καθὼς എന്നതിന്റെ ബന്ധവും വാക്യചിഹ്നനവും
  choice: ‘അവന്റെ ഉള്ളിൽനിന്ന് ... നദികൾ ഒഴുകും’ എന്ന വാഗ്ദാനവുമായി തിരുവെഴുത്ത് പറഞ്ഞതിനെ ബന്ധിപ്പിച്ചു.
  alternative: ‘തിരുവെഴുത്ത് പറഞ്ഞതുപോലെ എന്നിൽ വിശ്വസിക്കുന്നവൻ’ എന്നു മുൻവാക്യഘടകവുമായി ബന്ധിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ വിരാമചിഹ്നങ്ങൾ മൂലകൃതിയുടെ ഭാഗമല്ല; ബന്ധം വ്യാകരണപരമായി ചർച്ചാവിഷയമാണ്. സാധാരണ വായന മുഖ്യവാചകത്തിൽ നൽകി, മറ്റൊരു സാധ്യമായ ഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘തിരുവെഴുത്ത്’, ‘ജീവജലം’ എന്നീ പരിചിത ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ സഭാവിഭാഗ-സവിശേഷ വ്യാഖ്യാനം ഒഴിവാക്കി.
