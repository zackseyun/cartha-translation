id: JHN.7.52
reference: John 7:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: ml
  text: 'അവർ അവനോടു മറുപടിയായി പറഞ്ഞു: “നീയും ഗലീലയിൽനിന്നുള്ളവനാണോ?[a] അന്വേഷിച്ചുനോക്കൂ; ഗലീലയിൽനിന്ന് ഒരു പ്രവാചകനും ഉയർന്നുവരുന്നില്ല.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീയും ഗലീലയിൽനിന്നുള്ളവനല്ലല്ലോ?” ഗ്രീക്കിലെ ചോദ്യം നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന രീതിയിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: “ഗലീലയിൽനിന്ന് ഒരു പ്രവാചകനും എഴുന്നേൽപ്പിക്കപ്പെടുന്നില്ല” എന്നും പരിഭാഷപ്പെടുത്താം; ദൈവം പ്രവാചകന്മാരെ എഴുന്നേൽപ്പിക്കുന്നു എന്ന സാധ്യമായ സൂക്ഷ്മത ഈ രൂപം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: യോഹന്നാന്റെ വിവരണശൈലിയിലെ ഇരട്ട ക്രിയയുടെ സ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം നൽകുന്നു.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: നീയും ഗലീലയിൽനിന്നുള്ളവനാണോ?
  rationale: μή സൂചിപ്പിക്കുന്ന നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന പരിഹാസച്ചുവ സന്ദർഭത്തിൽ കേൾക്കാവുന്ന വിധത്തിൽ സ്വാഭാവികമായ ചോദ്യം ഉപയോഗിക്കുന്നു; കൂടുതൽ വ്യക്തമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐραύνησον καὶ ἴδε
  choice: അന്വേഷിച്ചുനോക്കൂ
  rationale: രണ്ട് ആജ്ഞകളുടെയും സജീവമായ അന്വേഷണവും അതിലൂടെ ബോധ്യപ്പെടലും മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തക്രിയയിലൂടെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προφήτης
  choice: ഒരു പ്രവാചകനും
  rationale: ഗ്രീക്കിൽ നിർദേശക ലേഖനം ഇല്ലാത്തതിനാൽ ഒരു പ്രത്യേക അന്ത്യകാല പ്രവാചകനെയല്ല, ഏതൊരു പ്രവാചകനെയും കുറിച്ചുള്ള പൊതുവാദമായാണ് പരിഭാഷപ്പെടുത്തുന്നത്.
- source_word: οὐκ ἐγείρεται
  choice: ഉയർന്നുവരുന്നില്ല
  rationale: ഒരു പ്രവാചകൻ ഉദയം ചെയ്യുകയോ പ്രത്യക്ഷപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാചിത്രം നിലനിർത്തുന്നു; ദൈവം എഴുന്നേൽപ്പിക്കുന്നു എന്ന സാധ്യമായ കർമണി സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യത്തിന്റെ ഭാവം
  choice: നീയും ഗലീലയിൽനിന്നുള്ളവനാണോ?
  alternative: നീയും ഗലീലയിൽനിന്നുള്ളവനല്ലല്ലോ?
  rationale: μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നതായി സൂചിപ്പിച്ചാലും, പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായ മലയാളചോദ്യം ഉപയോഗിച്ച് സന്ദർഭത്തിലെ അവജ്ഞാഭാവം നിലനിർത്തുന്നു; കൂടുതൽ ശക്തമായ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ἐγείρεται എന്ന ക്രിയയിലെ കർത്തൃ/കർമണി സൂക്ഷ്മത
  choice: ഉയർന്നുവരുന്നില്ല
  alternative: എഴുന്നേൽപ്പിക്കപ്പെടുന്നില്ല
  rationale: പ്രവാചകന്റെ ഉദയം എന്ന നേരിട്ടുള്ള അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ദൈവത്താൽ എഴുന്നേൽപ്പിക്കപ്പെടുന്നു എന്ന സാധ്യമായ ദൈവശാസ്ത്രപര സൂക്ഷ്മത പ്രധാനപാഠത്തിൽ നിർബന്ധമായി ചുമത്താതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. എതിരാളികളുടെ പരിഹാസവും വെല്ലുവിളിയും അതിശയോക്തിയില്ലാതെ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
