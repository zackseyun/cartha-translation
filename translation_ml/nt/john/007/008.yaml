  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചക ബഹുവചന കല്പനയായ ‘കയറിപ്പോകുവിൻ’ ഉപയോഗിച്ചു. ‘പെരുന്നാൾ’ മതപരമായ ഉത്സവസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു. വാക്യം ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാക്കി; പാഠഭേദവും καιρός എന്നതിന്റെ അർത്ഥസാധ്യതയും അടിക്കുറിപ്പുകളിൽ സൂക്ഷിച്ചു.
