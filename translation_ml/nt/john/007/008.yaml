theological_decisions:
- issue: പെരുന്നാളിലേക്കു പോകുന്നതിനെക്കുറിച്ചുള്ള യേശുവിന്റെ പ്രസ്താവനയിലെ പാഠഭേദം
  choice: പ്രധാനപാഠത്തിൽ SBLGNTയിലെ οὐκ (‘പോകുന്നില്ല’) പിന്തുടർന്നു.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ οὔπω (‘ഇനിയും പോകുന്നില്ല’) എന്നു വായിക്കുന്നു.
  rationale: പിന്നീട് യേശു പെരുന്നാളിലേക്കു പോകുന്നതുമായി ബന്ധപ്പെട്ട വ്യാഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ നിശ്ശബ്ദമായി പരിഹരിക്കാതെ, അടിസ്ഥാനപാഠം നിലനിർത്തി പാഠഭേദം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: καιρός എന്നതിലെ ദൈവനിശ്ചിത സമയത്തിന്റെ സാധ്യത
  choice: ‘എന്റെ സമയം’
  alternative: ‘എനിക്കായി നിശ്ചയിച്ച സമയം’
  rationale: മൂലപദത്തിന്റെ സംക്ഷിപ്തതയും അർത്ഥവ്യാപ്തിയും നിലനിർത്തി കൂടുതൽ വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
