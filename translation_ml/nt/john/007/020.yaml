id: JHN.7.20
reference: John 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ⸀ὄχλος· Δαιμόνιον ἔχεις· τίς σε ζητεῖ ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: ml
  text: 'ജനക്കൂട്ടം മറുപടി പറഞ്ഞു: “നിനക്കൊരു ഭൂതമുണ്ട്.[a] നിന്നെ കൊല്ലാൻ ശ്രമിക്കുന്നത് ആര്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നീ ഭൂതബാധിതനാണ്.” അക്ഷരാർഥം: “നിനക്കൊരു ഭൂതമുണ്ട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണം സൂചിപ്പിക്കുന്ന സാധാരണ ആഖ്യാനപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὄχλος
  choice: ജനക്കൂട്ടം
  rationale: സംഭവസ്ഥലത്തുണ്ടായിരുന്ന ആളുകളുടെ കൂട്ടത്തെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: Δαιμόνιον ἔχεις
  choice: നിനക്കൊരു ഭൂതമുണ്ട്
  rationale: ‘നിനക്ക് ഒരു ഭൂതമുണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും ആരോപണത്തിന്റെ മൂർച്ചയും സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘ഭൂതബാധിതനാണ്’ എന്നത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τίς
  choice: ആര്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ചോദ്യംചെയ്യുന്ന സർവനാമം നിലനിർത്തുന്നു; ചോദ്യം വാചകത്തെ നേരിട്ടുള്ള നിഷേധമായി മാറ്റുന്നില്ല.
- source_word: ζητεῖ
  choice: ശ്രമിക്കുന്നത്
  rationale: ഇവിടെ കൊല്ലാനുള്ള തുടരുന്ന ഉദ്ദേശ്യവും ശ്രമവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘അന്വേഷിക്കുന്നു’ എന്ന അക്ഷരാർഥപ്രയോഗം ഈ സന്ദർഭത്തിൽ അസ്വാഭാവികമാകും.
- source_word: ἀποκτεῖναι
  choice: കൊല്ലാൻ
  rationale: നിയമപരമോ ധാർമികമോ ആയ അധിക അർഥം ചേർക്കാതെ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെതിരായ ആരോപണത്തിൽ δαιμόνιον എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ‘നിനക്കൊരു ഭൂതമുണ്ട്’ എന്ന ഗ്രീക്ക് ശൈലി മുഖ്യവാചകത്തിൽ നിലനിർത്തുക.
  alternative: ‘നീ ഭൂതബാധിതനാണ്.’
  rationale: ജനക്കൂട്ടത്തിന്റെ ശത്രുതാപരമായ ആരോപണം വാചകം റിപ്പോർട്ട് ചെയ്യുന്നതേയുള്ളൂ; അത് അംഗീകരിക്കുന്നില്ല. അക്ഷരാർഥത്തോട് അടുത്ത പ്രയോഗം മൂലവാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുകയും കൂടുതൽ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ആരോപണത്തിലെ നേരിട്ടുള്ള രണ്ടാംപുരുഷ ഏകവചനപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു.
