id: JHN.7.30
reference: John 7:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: ml
  text: അതുകൊണ്ട് അവർ അവനെ പിടികൂടാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു[a], എന്നാൽ ആരും അവന്റെ മേൽ കൈവെച്ചില്ല; കാരണം അവന്റെ സമയം ഇനിയും വന്നിരുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അറസ്റ്റ് ചെയ്യാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പിടികൂടുക’ എന്നർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ അതിന് അറസ്റ്റ് ചെയ്യുക എന്ന ആശയവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ സമയം’ എന്നത് യോഹന്നാനിൽ ആവർത്തിക്കുന്ന ഒരു പ്രയോഗമാണ്. യേശുവിന്റെ ദൗത്യത്തിൽ ദൈവം നിശ്ചയിച്ച സമയത്തെ—പ്രത്യേകിച്ച് അവന്റെ കഷ്ടാനുഭവം, മരണം, ഉയിർത്തെഴുന്നേൽപ്പ്, മഹത്ത്വീകരണം എന്നിവയുമായി ബന്ധപ്പെട്ട സമയത്തെ—ഇത് സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: ശ്രമിക്കുകയായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ പ്രയോഗം ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞതിൽനിന്നുള്ള ആഖ്യാനപരവും യുക്തിപരവുമായ തുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: πιάσαι
  choice: പിടികൂടാൻ
  rationale: മൂലപദത്തിന്റെ ‘പിടിക്കുക/കൈവശമാക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അറസ്റ്റ് ചെയ്യുക എന്ന സൂചനയും ഇതിൽ സ്വാഭാവികമായി ഉൾപ്പെടുന്നു.
- source_word: οὐδεὶς
  choice: ആരും ... ഇല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: അവന്റെമേൽ കൈവെച്ചില്ല
  rationale: ഒരാളെ ബലമായി പിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ശൈലി നിലനിർത്തുകയും ഏകവചനമായ ‘കൈ’ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ആരും പ്രവർത്തിക്കാതിരുന്നതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὔπω
  choice: ഇനിയും ... ഇല്ല
  rationale: ‘ഇതുവരെ സംഭവിച്ചിട്ടില്ല’ എന്ന സമയനിഷേധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐληλύθει
  choice: വന്നിരുന്നില്ല
  rationale: ആ ആഖ്യാനസമയത്തേക്കും നിർണായക നാഴിക എത്തിയിരുന്നില്ലെന്ന പൂർവപൂർണകാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἡ ὥρα αὐτοῦ
  choice: അവന്റെ നാഴിക
  rationale: യോഹന്നാനിൽ ആവർത്തിക്കുന്ന, ദൈവനിശ്ചിത സമയത്തെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള പദപ്രയോഗം നിലനിർത്തുന്നു; ‘സമയം’ എന്നു പൊതുവാക്കാതെ ആഖ്യാന-ദൈവശാസ്ത്രപരമായ ബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ‘അവന്റെ നാഴിക’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘അവന്റെ നാഴിക’ എന്ന പദപ്രയോഗം വിശദീകരിക്കാതെ നിലനിർത്തി.
  alternative: ‘അവന്റെ സമയം’ അല്ലെങ്കിൽ ‘അവന്റെ മരണത്തിനായി നിശ്ചയിച്ച സമയം’
  rationale: യേശുവിന്റെ ദൗത്യത്തിലെ ദൈവനിശ്ചിത സമയത്തെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം അതിനെ മരണത്തിലോ അറസ്റ്റിലോ മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാഴിക’ സാധാരണ ‘സമയം’ എന്നതിനെക്കാൾ അല്പം ഗൗരവമുള്ളതാണെങ്കിലും യോഹന്നാനിലെ ആവർത്തിത ദൈവശാസ്ത്രപരമായ പ്രയോഗം നിലനിർത്താൻ ഉദ്ദേശപൂർവം തെരഞ്ഞെടുത്തു. ‘എന്നിട്ടും’ എന്നത് പ്രതീക്ഷയ്ക്കു വിരുദ്ധമായി ആരും കൈവെച്ചില്ലെന്ന καί-യുടെ സന്ദർഭപരമായ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
