- from: അതുകൊണ്ട് അവർ അവനെ പിടികൂടാൻ ശ്രമിക്കുകയായിരുന്നു[a]. എന്നിട്ടും ആരും അവന്റെമേൽ കൈവെച്ചില്ല; കാരണം അവന്റെ നാഴിക ഇനിയും വന്നിരുന്നില്ല[b].
