id: JHN.7.7
reference: John 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: ml
  text: ലോകത്തിന് നിങ്ങളെ വെറുക്കാൻ കഴിയില്ല[a]; എന്നാൽ അത് എന്നെ വെറുക്കുന്നു. കാരണം, അതിന്റെ പ്രവൃത്തികൾ തിന്മയുള്ളവയാണെന്ന് ഞാൻ അതിനെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലോകത്തിന് നിങ്ങളെ വെറുക്കാനാവില്ല.’
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ രചനകളിൽ ‘ലോകം’ എന്നത് പലപ്പോഴും സൃഷ്ടപ്രപഞ്ചത്തെത്തന്നെയല്ല, ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യക്രമത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: കഴിയില്ല
  rationale: δύναμαι സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ പലതലങ്ങളുള്ള അർഥം വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തുന്ന പതിവ് മലയാള സമതുല്യം.
- source_word: μισεῖν / μισεῖ
  choice: വെറുക്കാൻ / വെറുക്കുന്നു
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും വാക്യത്തിലെ ശക്തമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἐμὲ δὲ
  choice: എന്നാൽ അത് എന്നെ
  rationale: δέ അടയാളപ്പെടുത്തുന്ന ‘നിങ്ങൾ—ഞാൻ’ വൈരുധ്യം മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μαρτυρῶ
  choice: ഞാൻ ... സാക്ഷ്യം പറയുന്നു
  rationale: μαρτυρέωയുടെ സാക്ഷ്യ/ന്യായവ്യവഹാര ഭാവം നിലനിർത്തുന്ന വ്യക്തവും മാന്യവുമായ പ്രയോഗം.
- source_word: περὶ αὐτοῦ
  choice: അതിനെക്കുറിച്ച്
  rationale: αὐτοῦയുടെ മുൻപദമായ κόσμοςനെ വ്യക്തിവൽക്കരിച്ച് അതിവ്യാഖ്യാനിക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: τὰ ἔργα αὐτοῦ
  choice: അതിന്റെ പ്രവൃത്തികൾ
  rationale: ἔργαയുടെ ധാർമികവും യോഹന്നാനീയവുമായ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: πονηρά
  choice: തിന്മയുള്ളവ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന ധാർമിക ദോഷം ‘മോശം’ എന്നതിനെക്കാൾ കൃത്യമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ പശ്ചാത്തലത്തിൽ ‘ലോകം’ എന്നതിന്റെ സൂചനയും ദൈവശാസ്ത്രപരമായ ശക്തിയും
  choice: പ്രധാനപാഠത്തിൽ ‘ലോകം’ എന്നു തന്നെ നിലനിർത്തുക
  alternative: ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യവ്യവസ്ഥ / ദൈവത്തിനെതിരെ മത്സരിക്കുന്ന മനുഷ്യർ
  rationale: κόσμος എന്ന പദത്തിന്റെ യോഹന്നാനീയമായ പലതല അർഥവും ദൈവസൃഷ്ടിയായ ലോകവും ദൈവത്തോട് എതിർപ്പുള്ള മനുഷ്യക്രമവും തമ്മിലുള്ള പിരിമുറുക്കവും വ്യാഖ്യാനപരമായ വിപുലീകരണത്തിലൂടെ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനം, വൈരുധ്യം, κόσμος എന്ന പദത്തിന്റെ ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
