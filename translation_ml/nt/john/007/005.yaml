id: JHN.7.5
reference: John 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: ml
  text: കാരണം, അവന്റെ സഹോദരന്മാർപോലും അവനിൽ വിശ്വസിച്ചിരുന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവന്റെ സഹോദരന്മാർപോലും അവനിൽ വിശ്വസിച്ചില്ല.’ ഗ്രീക്കിലെ ഇംപെർഫെക്റ്റ് ക്രിയയെ ലളിതമായ ഭൂതകാലമായോ ഭൂതകാലത്ത് തുടർന്നിരുന്ന നിലയായോ വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: പോലും ... ഇല്ല
  rationale: ഇവിടെ οὐδὲ വെറും സംയോജനമല്ല, ഊന്നലാണ് നൽകുന്നത്; മലയാളത്തിലെ ‘പോലും ... ഇല്ല’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞതിന്റെ വിശദീകരണകാരണം ഈ കണം അവതരിപ്പിക്കുന്നു; ‘കാരണം’ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ഈ പ്രയോഗം കഥാസന്ദർഭത്തിൽ യേശുവിന്റെ പുരുഷസഹോദരന്മാരെയോ അടുത്ത പുരുഷബന്ധുക്കളെയോ സൂചിപ്പിക്കുന്നു; കൂടുതൽ നിർവചിക്കാതെ ‘സഹോദരന്മാർ’ എന്നത് യോജിക്കുന്നു.
- source_word: ἐπίστευον
  choice: വിശ്വസിച്ചിരുന്നില്ല
  rationale: ഇംപെർഫെക്റ്റ് രൂപം ഭൂതകാലത്ത് തുടർന്നിരുന്ന അവിശ്വാസത്തെ സൂചിപ്പിക്കാം. ‘വിശ്വസിച്ചിരുന്നില്ല’ ആ തുടർച്ചാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς αὐτόν
  choice: അവനിൽ
  rationale: πιστεύω എന്ന ക്രിയയോടുകൂടിയ εἰς വ്യക്തിയിലേക്കു തിരിയുന്ന വിശ്വാസമോ ആശ്രയമോ സൂചിപ്പിക്കുന്നു; ‘അവനിൽ വിശ്വസിക്കുക’ യോഹന്നാന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളമാണ്.
theological_decisions:
- issue: യോഹന്നാന്റെ പ്രയോഗത്തിൽ πιστεύω εἰς αὐτόν എന്നതിന്റെ അർഥം
  choice: യേശുവിൽ വ്യക്തിപരമായി വിശ്വസിക്കുക/ആശ്രയിക്കുക
  alternative: അവനെ വിശ്വസിക്കുക; അവനിൽ ആശ്രയം വെക്കുക
  rationale: യോഹന്നാൻ πιστεύω + εἰς എന്ന ഘടന പതിവായി യേശുവിലേക്കു തിരിയുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കാൻ ഉപയോഗിക്കുന്നു. അവരുടെ അവിശ്വാസത്തിന്റെ കാരണങ്ങളെയോ പിന്നീടുള്ള അവസ്ഥയെയോ വാക്യം വിശദീകരിക്കുന്നില്ല; വിവർത്തനവും അതിലപ്പുറം പോകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘വിശ്വസിച്ചിരുന്നില്ല’ എന്ന രൂപം ഗ്രീക്ക് ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ ലളിത ഭൂതകാലരൂപവും നൽകിയിരിക്കുന്നു.
