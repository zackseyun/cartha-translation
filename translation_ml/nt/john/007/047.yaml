  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: ml
  text: 'അപ്പോൾ പരീശന്മാർ അവരോടു മറുപടി പറഞ്ഞു: “നിങ്ങളും വഴിതെറ്റിക്കപ്പെട്ടിട്ടില്ലല്ലോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളും വഞ്ചിക്കപ്പെട്ടിട്ടില്ലല്ലോ?” ഈ ക്രിയയ്ക്ക് തെറ്റായി നയിക്കപ്പെടുക എന്നും വഞ്ചിക്കപ്പെടുക എന്നും അർഥമാകാം; “വഴിതെറ്റിക്കപ്പെടുക” തെറ്റിലേക്ക് നയിക്കപ്പെട്ടതിന്റെ ഭാവം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: ചോദിച്ചു
  rationale: ἀποκρίνομαι സാധാരണയായി ‘മറുപടി പറഞ്ഞു’ എന്നർഥമുള്ളതാണെങ്കിലും, നേരിട്ടുള്ള ചോദ്യത്തെ പരിചയപ്പെടുത്തുന്ന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിന് ‘ചോദിച്ചു’ എന്ന് നൽകി; പ്രതികരണത്തിന്റെ സ്വഭാവം ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള തുടർച്ചയും അതിനെത്തുടർന്നുള്ള പ്രതികരണവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഇവിടെ ‘അതുകൊണ്ട്’ എന്നത് അനാവശ്യമായി ശക്തമായ നിഗമനഭാവം നൽകാം.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: മറുപടി ലഭിച്ച ഉദ്യോഗസ്ഥരെയാണ് ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംഭാഷണലക്ഷ്യം സ്വാഭാവികമായി ‘അവരോടു’ എന്നു വരുന്നു.
- source_word: οἱ Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദവിഭാഗത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള പേരാണ്; ഗ്രീക്കിലെ നിർദ്ദിഷ്ടത സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ പ്രത്യേക നിർദ്ദേശപദം ആവശ്യമില്ല.
- source_word: Μὴ καὶ ὑμεῖς
  choice: നിങ്ങളും … ഓ?
  rationale: καί എന്നതിലെ ‘കൂടി/also’ എന്ന അർഥം ‘നിങ്ങളും’ നിലനിർത്തുന്നു. μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരത്തെ മലയാളത്തിലെ ചോദ്യരൂപവും സന്ദർഭവും പ്രകടമാക്കുന്നു; ‘തീർച്ചയായും അല്ലല്ലോ’ എന്ന് അധികമായി ചേർത്തിട്ടില്ല.
- source_word: πεπλάνησθε
  choice: വഴിതെറ്റിക്കപ്പെട്ടോ
  rationale: πλανάωയുടെ perfect passive/middle രൂപം മറ്റൊരാളാൽ തെറ്റിലേക്ക് നയിക്കപ്പെട്ട നിലയെ സൂചിപ്പിക്കുന്നു. ‘വഴിതെറ്റിക്കപ്പെട്ടോ’ ആ passive ഭാവവും ബൗദ്ധിക/ആത്മീയ തെറ്റിന്റെ നിഴലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: μή കൊണ്ടു തുടങ്ങുന്ന ചോദ്യത്തിന്റെ വാചാടോപബലം
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമായി, എന്നാൽ ‘തീർച്ചയായും’ പോലുള്ള വിശദീകരണം ചേർക്കാതെ വിവർത്തനം ചെയ്തു.
  alternative: “നിങ്ങളും വഞ്ചിക്കപ്പെട്ടിട്ടില്ലല്ലോ?”
  rationale: പരീശന്മാർ ‘ഇല്ല’ എന്ന ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്നത്; എന്നാൽ ആ പ്രതീക്ഷയെ മുഖ്യപാഠത്തിൽ അതിവ്യക്തമാക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമാകും. മലയാളത്തിലെ ചോദ്യരൂപം സന്ദർഭത്തിലെ പരിഹാസവും അവിശ്വാസവും വഹിക്കാൻ മതിയാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി. ‘പരീശന്മാർ’ എന്ന പ്രചാരമുള്ള ബൈബിൾപദം നിലനിർത്തി; വാചകം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ ചുരുക്കി.
