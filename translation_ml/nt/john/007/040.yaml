lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിൽ ചിലർ
  rationale: ἐκ എന്ന പ്രയോഗത്തിന്റെ ഭാഗികാർഥം വ്യക്തമാക്കി, മുഴുവൻ ജനക്കൂട്ടമല്ല അതിൽ ചിലരാണ് സംസാരിച്ചതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള തുടർച്ചയെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ബന്ധകബലം നിലനിർത്തുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ കാലബന്ധത്തോടെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τῶν λόγων τούτων
  choice: ഈ വാക്കുകൾ
  rationale: യേശു തൊട്ടുമുമ്പ് പറഞ്ഞ കാര്യങ്ങളെയാണ് λόγοι ഇവിടെ സൂചിപ്പിക്കുന്നത്; ലളിതവും നേരിട്ടുമുള്ള മലയാളപ്രയോഗമാണിത്.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: imperfect ക്രിയയുടെ തുടർച്ചയുള്ളതോ ആവർത്തിതമോ ആയ ഭാവം സാധാരണ ഭൂതകാലത്തെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Οὗτός ἐστιν
  choice: ഇദ്ദേഹം ... ആണ്
  rationale: യേശുവിലേക്കു വിരൽചൂണ്ടുന്ന demonstrative-ന്റെ സജീവത മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀληθῶς
  choice: സത്യമായും
  rationale: പ്രസ്താവനയുടെ ഉറപ്പും ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ὁ προφήτης
  choice: ആ പ്രവാചകൻ
  rationale: നിർദ്ദിഷ്ടവും പദവിസദൃശവുമായ പ്രയോഗം സൂക്ഷിക്കുന്നു; സാധാരണയായി ഏതെങ്കിലും ഒരു പ്രവാചകൻ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: “ὁ προφήτης” സൂചിപ്പിക്കുന്ന വ്യക്തിത്വം
  choice: പ്രധാനപാഠത്തിൽ “ആ പ്രവാചകൻ” എന്നു നൽകി, പ്രതീക്ഷിക്കപ്പെട്ട പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദവിസദൃശത നിലനിർത്തുന്നു.
  alternative: പൊതുവായ അർഥത്തിൽ “പ്രവാചകൻ” എന്നു നൽകുക, അല്ലെങ്കിൽ “മശീഹാ” എന്നു വ്യക്തമായി തിരിച്ചറിയിക്കുക.
  rationale: ആവർത്തനം 18:15-ലെ മോശെയെപ്പോലുള്ള പ്രവാചകനെക്കുറിച്ചുള്ള പ്രതീക്ഷ ഇവിടെ പശ്ചാത്തലമായിരിക്കാം. എന്നാൽ ഈ വാക്യം ആ പ്രവാചകനെ മശീഹായുമായി വ്യക്തമായി സമീകരിക്കുന്നില്ല; അതിനാൽ ആ വ്യാഖ്യാനപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
