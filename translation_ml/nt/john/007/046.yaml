  choice: ഒരു മനുഷ്യനും
  alternative: ആരും
  rationale: മൂലത്തിലെ ἄνθρωπος എന്ന മനുഷ്യസൂചക നാമപദം പരിഭാഷയിൽ ദൃശ്യമാക്കുന്നു; അതേസമയം ഈ സന്ദർഭത്തിൽ അത് പൊതുവായി ‘ആരും’ എന്ന അർഥത്തിൽ പ്രവർത്തിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
