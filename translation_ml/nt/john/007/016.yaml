id: JHN.7.16
reference: John 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: ml
  text: 'അതിനാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു: “എന്റെ ഉപദേശം എന്റേതല്ല; എന്നെ അയച്ചവന്റേതാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ അയച്ചവനിൽനിന്നുള്ളതാണ്.” ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിപ്രയോഗം ഉടമസ്ഥതയെയും ഉറവിടത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: അതിനാൽ യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: οὖν എന്ന ബന്ധകത്തിന്റെ നിഗമനാത്മകവും സംഭാഷണത്തുടർച്ച സൂചിപ്പിക്കുന്നതുമായ ബലം ‘അതിനാൽ’ നിലനിർത്തുന്നു. ἀπεκρίθη ... καὶ εἶπεν എന്ന ഗ്രീക്ക് വിവരണസൂത്രം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മറുപടി പറഞ്ഞു’ എന്നു സംക്ഷിപ്തമാക്കി; സംസാരത്തിന്റെ അർഥഘടകം നഷ്ടപ്പെടുന്നില്ല.
- source_word: Ἡ ἐμὴ διδαχὴ
  choice: എന്റെ ഉപദേശം
  rationale: διδαχή ഇവിടെ പഠിപ്പിക്കുന്ന ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഉപദേശം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്; ‘സിദ്ധാന്തം’ എന്നത് ആവശ്യത്തിലധികം സാങ്കേതികമാകും.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: എന്റേതല്ല
  rationale: ആവർത്തിച്ചുള്ള ἐμὴയുടെ ഊന്നലും തുടർന്നുള്ള ഉടമസ്ഥത/ഉറവിട വ്യത്യാസവും ചുരുക്കമായും നേരിട്ടും നിലനിർത്തുന്നു.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: എന്നെ അയച്ചവന്റേതാണ്
  rationale: ഗ്രീക്കിലെ genitive പ്രയോഗത്തെ പ്രത്യക്ഷമായ ഉടമസ്ഥതയായി അവതരിപ്പിക്കുകയും മുൻപുള്ള ‘എന്റേതല്ല’ എന്നതിനോടുള്ള സമാന്തരവിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു. ഉറവിടസൂചനയ്ക്കുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: πέμψαντός
  choice: അയച്ച
  rationale: πέμπωയുടെ സാധാരണ അർഥം നേരിട്ട് നൽകുന്നു; ‘നിയോഗിച്ച’ എന്നു പറയുന്നത് മൂലപാഠത്തിൽ നിർബന്ധമല്ലാത്ത ഔദ്യോഗിക ഭാവം ചേർക്കും.
theological_decisions:
- issue: യേശുവിന്റെ ഉപദേശവും അവനെ അയച്ചവനും തമ്മിലുള്ള ബന്ധം
  choice: ‘എന്റേതല്ല; എന്നെ അയച്ചവന്റേതാണ്’ എന്ന ഉറവിട/ഉടമസ്ഥതാ വിരോധം അതേപടി നിലനിർത്തി.
  alternative: യേശു സ്വന്തം അധികാരം നിഷേധിക്കുന്നുവെന്നോ, മറുവശത്ത് അവനും അയച്ചവനും തമ്മിലുള്ള വ്യത്യാസം ഇല്ലാതാക്കുന്നുവെന്നോ വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം ഉപദേശത്തിന്റെ സ്വതന്ത്രമായ ഉത്ഭവം യേശുവിൽ നിന്നല്ലെന്ന് പറയുന്നു; എന്നാൽ അത് യേശുവിന്റെ അധികാരത്തെയോ സ്വഭാവത്തെയോ കുറിച്ചുള്ള പൂർണ സിദ്ധാന്തപ്രഖ്യാപനമല്ല. അതിനാൽ വ്യക്തിവ്യത്യാസവും ദൗത്യ/ഉറവിട ഏകതയും ഉൾക്കൊള്ളുന്ന യോഹന്നാനീയമായ സംഘർഷം വിവർത്തനം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിക്കുള്ളിൽ അർഥപരമായി ബന്ധപ്പെട്ട സ്ഥാനത്താണ് [a] അടിക്കുറിപ്പുസൂചിക നൽകിയിരിക്കുന്നത്.
