reference: John 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: ml
  text: ഈ കാര്യങ്ങൾക്കു ശേഷം യേശു ഗലീലയിൽ സഞ്ചരിച്ചുകൊണ്ടിരുന്നു. യെഹൂദ്യയിൽ സഞ്ചരിക്കാൻ അവന് ഇഷ്ടമില്ലായിരുന്നു; കാരണം, യെഹൂദന്മാർ[a] അവനെ കൊല്ലാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദ്യക്കാർ’ എന്നും ‘യെഹൂദ നേതാക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ ‘യെഹൂദന്മാർ’ എന്ന പ്രയോഗം പലപ്പോഴും യെഹൂദജനതയെ മുഴുവനായി സൂചിപ്പിക്കുന്നില്ല; ആഖ്യാനസന്ദർഭത്തിൽ പ്രത്യേകിച്ച് യെഹൂദ്യയിലെ യെഹൂദ അധികാരികളെയോ യേശുവിനെ എതിർത്തവരെയോ ആണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ബഹുവചന സൂചകത്തിന്റെ രൂപവും യോഹന്നാനിലെ ആഖ്യാനബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: περιεπάτει / περιπατεῖν
  choice: സഞ്ചരിച്ചുകൊണ്ടിരുന്നു / സഞ്ചരിക്കാൻ
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ഒരു പ്രദേശത്തിനുള്ളിൽ ചുറ്റിസഞ്ചരിക്കുക എന്ന അർഥമാണ്; അതേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു. അപൂർണ്ണകാലത്തിന്റെ തുടർച്ച ആദ്യ പ്രയോഗത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ഗലീലയിൽ
  rationale: വ്യാപ്തി അതിരുകടന്ന് നിർണയിക്കാതെ സ്ഥലസൂചന നേരിട്ട് നൽകുന്നു.
- source_word: οὐ γὰρ ἤθελεν
  choice: അവന് ഇഷ്ടമില്ലായിരുന്നു
  rationale: കഴിവില്ലായ്മയല്ല, മനസ്സോ സന്നദ്ധതയോ ഇല്ലായ്മയാണ് ἤθελεν സൂചിപ്പിക്കുന്നത്; γάρ നൽകുന്ന വിശദീകരണബന്ധം തുടർന്നുള്ള കാരണവാക്യഘടനയിൽ വ്യക്തമാകുന്നു.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: യെഹൂദ്യയിൽ
  rationale: റോമൻ പ്രവിശ്യ/പ്രദേശനാമത്തിനുള്ള പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: യേശു യെഹൂദ്യയിൽ സഞ്ചരിക്കാൻ ഇഷ്ടപ്പെടാതിരുന്നതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐζήτουν
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: ἀποκτεῖναι-യോടൊപ്പം വന്നപ്പോൾ കൊല്ലാനുള്ള തുടർച്ചയായ ശ്രമമോ ഉദ്ദേശ്യമോ സ്വാഭാവികമായി അറിയിക്കുന്നു; അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ഔപചാരിക വ്യാപ്തി മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിലെ കൂടുതൽ പരിമിതമായ ആഖ്യാനപരമായ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποκτεῖναι
  choice: അവനെ കൊല്ലാൻ
  rationale: ഉദ്ദേശ്യം നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്ന പരിഭാഷ.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചിതവിഭാഗം
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദന്മാർ’ എന്ന് നിലനിർത്തി സന്ദർഭപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യക്കാർ’ എന്ന് മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപദത്തിന്റെ യഥാർഥ പൊതുരൂപം സംരക്ഷിക്കുമ്പോഴും, അത് എല്ലാ യെഹൂദജനങ്ങളെയും വിവേചനമില്ലാതെ കുറ്റപ്പെടുത്തുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ യോഹന്നാന്റെ ആഖ്യാനസന്ദർഭം അടിക്കുറിപ്പിലൂടെ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘നടന്നു’ എന്ന പദാനുപദരൂപം പ്രദേശത്തിനുള്ളിലെ പ്രവർത്തനത്തെ മലയാളത്തിൽ തെറ്റായി ചുരുക്കാൻ ഇടയുള്ളതിനാൽ ‘സഞ്ചരിക്കുക’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനവും അപൂർണ്ണകാലത്തിലെ തുടർച്ചയും കഴിയുന്നത്ര നിലനിർത്തി.
