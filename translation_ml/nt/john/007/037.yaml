  source_fidelity: The Malayalam faithfully renders the temporal setting ('on the last, great day of the feast'), Jesus' standing posture and loud public utterance, and the conditional invitation. 'ആർക്കെങ്കിലും ദാഹമുണ്ടെങ്കിൽ' preserves the generic openness of τις and the thirst imagery, while 'എന്റെ അടുക്കൽ വന്ന് കുടിക്കട്ടെ' retains both imperatival elements without interpretive expansion.
