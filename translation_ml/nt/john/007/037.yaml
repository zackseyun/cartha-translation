id: JHN.7.37
reference: John 7:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: ml
  text: 'ഉത്സവത്തിന്റെ അവസാന ദിവസമായ ആ മഹാദിനത്തിൽ യേശു നിന്നുകൊണ്ട് ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “ആർക്കെങ്കിലും ദാഹമുണ്ടെങ്കിൽ, എന്റെ അടുക്കൽ വന്ന് കുടിക്കട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: അവസാന ദിവസമായ ... ദിനത്തിൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവ് കാലസൂചന നൽകുന്നു; δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ അതിന്റെ ശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: ഉത്സവത്തിന്റെ ... ആ മഹാദിനത്തിൽ
  rationale: μέγας എന്ന ഊന്നൽ ‘മഹാദിനം’ എന്നു നിലനിർത്തുന്നു; ἑορτήയ്ക്ക് സന്ദർഭോചിതമായ ആധുനിക മലയാളം ‘ഉത്സവം’ ആണ്.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: യേശു നിന്നുകൊണ്ട്
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന നിൽക്കുന്ന നിലപാട് സംരക്ഷിക്കുന്നു; ‘എഴുന്നേറ്റു’ എന്ന, മൂലത്തിൽ വ്യക്തമല്ലാത്ത ചലനം ചേർക്കുന്നില്ല.
- source_word: ἔκραξεν λέγων
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള പരസ്യപ്രഖ്യാപനവും λέγων പരിചയപ്പെടുത്തുന്ന വാക്കുകളും സ്വാഭാവികമായ ഒറ്റ മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: Ἐάν τις διψᾷ
  choice: ആർക്കെങ്കിലും ദാഹമുണ്ടെങ്കിൽ
  rationale: τις എന്ന അനിശ്ചിതവും പൊതുവുമായ ഏകവചനപ്രയോഗവും διψάωയുടെ ദാഹരൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: എന്റെ അടുക്കൽ വന്ന് കുടിക്കട്ടെ
  rationale: രണ്ട് വർത്തമാനകാല ആജ്ഞാരൂപങ്ങളുടെയും ക്ഷണം/ആഹ്വാനം മലയാളത്തിലെ ഏകവചന പൊതുപ്രയോഗത്തിലൂടെ ലളിതമായി നൽകുന്നു; ആവർത്തിച്ച കർത്തൃസർവനാമം മലയാളത്തിൽ ആവശ്യമില്ല.
theological_decisions:
- issue: ദാഹത്തിന്റെയും കുടിക്കലിന്റെയും രൂപകാർഥം
  choice: ‘ദാഹം’, ‘കുടിക്കുക’ എന്നീ ദൃശ്യരൂപങ്ങൾ വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘ജീവനുവേണ്ടി ആഗ്രഹിക്കുന്നെങ്കിൽ’ അല്ലെങ്കിൽ ‘വിശ്വസിക്കട്ടെ’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം.
  rationale: വാക്യത്തിന്റെ തുറന്ന ക്ഷണവും തുടർന്നുള്ള സന്ദർഭത്തിൽ വികസിക്കുന്ന ദൈവശാസ്ത്രപരമായ അർഥസാധ്യതകളും സംരക്ഷിക്കാൻ രൂപകം മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- issue: τις എന്ന പൊതുവായ ഏകവചനപ്രയോഗത്തിന്റെ ലിംഗസൂചന
  choice: ‘ആർക്കെങ്കിലും’ എന്നും കർത്തൃസർവനാമമില്ലാത്ത ‘വന്ന് കുടിക്കട്ടെ’ എന്നും നൽകി.
  alternative: ‘അവൻ എന്റെ അടുക്കൽ വരട്ടെ’ എന്ന വ്യക്തമായ പുരുഷലിംഗ സർവനാമം.
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുസ്വഭാവം മലയാളക്രിയാരൂപം നിലനിർത്തുന്നു; മലയാളത്തിൽ അനാവശ്യമായ പുരുഷലിംഗസൂചന ചേർക്കാതെ മൂലത്തിന്റെ പരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. ‘മഹാദിനം’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞു’ പൊതുപ്രഖ്യാപനത്തിന്റെ ശക്തി പകരുന്നു. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പ് ഇംഗ്ലീഷിലെ സർവനാമപ്രശ്നത്തോട് മാത്രം ബന്ധപ്പെട്ടതും അതിന്റെ [a] ചിഹ്നം തെറ്റായ സ്ഥാനത്ത് നൽകിയതുമായതിനാൽ മലയാളത്തിൽ ആവശ്യമില്ല; അതുകൊണ്ട് അടിക്കുറിപ്പൊന്നും ചേർത്തിട്ടില്ല.
