  terminology: '''ഉത്സവം,'' ''മഹാദിനം,'' ''ദാഹം,'' and ''കുടിക്കുക'' are suitable and consistent choices. The translation preserves the metaphor rather than interpreting drinking as belief or reception of the Spirit. No unnecessary masculine pronoun has been introduced; Malayalam naturally expresses the generic singular without one.'
