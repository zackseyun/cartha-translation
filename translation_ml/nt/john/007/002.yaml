  terminology: “കൂടാരപ്പെരുന്നാൾ” is an established and suitable Malayalam name for σκηνοπηγία. The footnote’s “കുടിലുകളുടെ ഉത്സവം” appropriately supplies the more literal ‘Booths’ alternative. “യഹൂദരുടെ” is accurate and contextually neutral.
