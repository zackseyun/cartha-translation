id: JHN.7.2
reference: John 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: ml
  text: യഹൂദരുടെ ഉത്സവമായ കൂടാരപ്പെരുന്നാൾ[a] അടുത്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘കുടിലുകളുടെ ഉത്സവം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യപ്രവാഹം തന്നെ ആ ബന്ധം അറിയിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള വൈരുധ്യസൂചകം ചേർത്തിട്ടില്ല.
- source_word: ἐγγὺς
  choice: അടുത്തിരുന്നു
  rationale: കാലപരമായ സമീപ്യം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἑορτὴ
  choice: ഉത്സവം
  rationale: മതപരമായ ആഘോഷത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: τῶν Ἰουδαίων
  choice: യഹൂദരുടെ
  rationale: ഈ ഉത്സവം യഹൂദജനതയുടേതാണെന്ന് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ജനിറ്റീവിനെ കൃത്യമായി നിലനിർത്തുന്നു; ഇവിടെ വിവാദാത്മകമായ അർത്ഥമില്ല.
- source_word: σκηνοπηγία
  choice: കൂടാരപ്പെരുന്നാൾ
  rationale: താൽക്കാലിക കൂടാരങ്ങളുമായി ബന്ധപ്പെട്ട ഉത്സവത്തിന്റെ പരിചിതമായ മലയാളനാമം; മൂലപദത്തിലെ ‘കൂടാരം’ എന്ന ആശയം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἰουδαίων എന്നതിന്റെ ഉത്സവനാമത്തിലുള്ള പ്രയോഗം
  choice: യഹൂദരുടെ
  alternative: യഹൂദ ഉത്സവം
  rationale: ഇവിടെ പദം ഉത്സവത്തിന്റെ ജനതാപരവും മതപരവുമായ ബന്ധം തിരിച്ചറിയിക്കുന്നു; യഹൂദരെക്കുറിച്ചുള്ള പ്രതികൂലമോ വിവാദാത്മകമോ ആയ പ്രസ്താവനയല്ല.
- issue: σκηνοπηγία എന്ന ഉത്സവനാമം
  choice: കൂടാരപ്പെരുന്നാൾ
  alternative: കുടിലുകളുടെ ഉത്സവം
  rationale: പരിചിതമായ പേരിലൂടെ വായനാസൗകര്യം നൽകുകയും, അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുസൃതമായ പര്യായം രേഖപ്പെടുത്തി മൂലാർത്ഥം സുതാര്യമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഉത്സവമായ കൂടാരപ്പെരുന്നാൾ’ എന്ന ഘടന ഗ്രീക്കിലെ വിശദീകരണാത്മക പുനർനാമകരണത്തെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
