id: JHN.7.51
reference: John 7:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: ml
  text: “ഒരാളെ ആദ്യം അവനിൽനിന്ന് കേൾക്കുകയും അവൻ എന്താണ് ചെയ്യുന്നതെന്ന് അറിയുകയും ചെയ്യാതെ നമ്മുടെ ന്യായപ്രമാണം വിധിക്കുന്നില്ലല്ലോ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: ഇല്ലല്ലോ?
  rationale: വാക്യാരംഭത്തിലെ μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ നിഷേധപ്രസ്താവനയോടു ചേർന്ന ‘ഇല്ലല്ലോ?’ ആ വാചാടോപശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ νόμος ἡμῶν
  choice: നമ്മുടെ ന്യായപ്രമാണം
  rationale: ഇവിടെ νόμος നിക്കൊദേമോസ് ഉന്നയിക്കുന്ന യഹൂദ നിയമമാനദണ്ഡത്തെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണം’ നിയമപരവും തിരുവെഴുത്തുസംബന്ധവുമായ പശ്ചാത്തലം നിലനിർത്തുന്നു; ‘നമ്മുടെ’ എന്നത് സമൂഹപരമായ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: κρίνει
  choice: വിധിക്കുന്നു
  rationale: κρίνω എന്നതിന്റെ പൊതുവായ നിയമാർഥമായ വിധിനിർണയം നിലനിർത്തുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത ശക്തമായ ‘കുറ്റം വിധിക്കുന്നു’ എന്ന അർഥം ചേർക്കുന്നില്ല.
- source_word: τὸν ἄνθρωπον
  choice: ഒരുവനെ
  rationale: ἄνθρωπον ഇവിടെ പൊതുവായ പ്രതിനിധി ഏകവചനമാണ്. ‘ഒരുവനെ’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഏകവചനവും പൊതുവായ മനുഷ്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐὰν μὴ
  choice: ചെയ്യാതെ
  rationale: ആദ്യം കേൾക്കുകയും അറിയുകയും ചെയ്യുക എന്ന ആവശ്യമായ വ്യവസ്ഥയെ മലയാളത്തിലെ നിഷേധാത്മക ക്രിയാവിശേഷണരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: വാദം ആദ്യം അവനിൽനിന്നുതന്നെ കേൾക്കുകയും
  rationale: παρ’ αὐτοῦ എന്നത് ആ വ്യക്തിയിൽനിന്നു നേരിട്ട് കേൾക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവനിൽനിന്നുതന്നെ’ അതിന് ഊന്നൽ നൽകുന്നു. നിയമസന്ദർഭത്തിൽ മലയാളവാക്യം പൂർണമാക്കാൻ ‘വാദം’ ചേർത്തിട്ടുണ്ട്; അത് പറയാനുള്ളത്/സാക്ഷ്യം എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: γνῷ
  choice: അറിയുകയും
  rationale: കേസിന്റെ വസ്തുത മനസ്സിലാക്കുക എന്ന γινώσκωയുടെ അർഥം ലളിതമായും നേരിട്ടും നൽകുന്നു.
- source_word: τί ποιεῖ
  choice: അവൻ എന്താണ് ചെയ്യുന്നതെന്ന്
  rationale: ποιεῖയുടെ വർത്തമാനകാലസ്വഭാവം ‘എന്താണ് ചെയ്യുന്നത്’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ‘എന്തു ചെയ്തു’ എന്ന് ഭൂതകാലമാക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ പശ്ചാത്തലത്തിന് ‘ന്യായപ്രമാണം’, ‘വിധിക്കുന്നു’, ‘വാദം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാചാടോപചോദ്യവും നടപടിക്രമത്തിലെ ക്രമവും നിലനിർത്തി.
