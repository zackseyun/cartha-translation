  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടിയായി പറഞ്ഞു: “ഞാൻ ഒരു പ്രവൃത്തി[a] ചെയ്തു; നിങ്ങൾ എല്ലാവരും ആശ്ചര്യപ്പെടുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൃത്യം.” ഗ്രീക്ക് പദത്തിന് ഈ രണ്ടു അർഥങ്ങളും ഉണ്ടാകാം; “പ്രവൃത്തി” എന്നത് യേശുവിന്റെ പ്രവർത്തനങ്ങളെക്കുറിച്ച് യോഹന്നാൻ ആവർത്തിച്ച് ഉപയോഗിക്കുന്ന പദവുമായുള്ള ബന്ധം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യേശു ശബ്ബത്തിൽ സൗഖ്യമാക്കിയ മനുഷ്യനെക്കുറിച്ചുള്ള സംഭവത്തെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത് (യോഹന്നാൻ 5:1–18).
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: രണ്ട് ഗ്രീക്ക് ക്രിയകളുടെയും പ്രതികരണവും പ്രസ്താവനയും ഉൾക്കൊള്ളുന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘ഉത്തരം പറഞ്ഞു പറഞ്ഞു’ എന്ന അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Ἓν ἔργον
  choice: ഒരു പ്രവൃത്തി
  rationale: Ἓν എന്ന ഊന്നലുള്ള സംഖ്യയും യോഹന്നാനിൽ ആവർത്തിക്കുന്ന ἔργον എന്ന മുഖ്യപദത്തിന്റെ ‘പ്രവൃത്തി’ എന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ἐποίησα
  choice: ചെയ്തു
  rationale: ലളിതമായ ഭൂതകാല ക്രിയയെ അധിക ഔപചാരികതയില്ലാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: πάντες
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: അഭിസംബോധന ചെയ്യപ്പെടുന്ന സംഘത്തിലെ എല്ലാവരെയും സൂചിപ്പിക്കുന്നതും ബഹുവചനം വ്യക്തമാക്കുന്നതുമായ സ്വാഭാവിക പ്രയോഗം.
- source_word: θαυμάζετε
  choice: ആശ്ചര്യപ്പെടുന്നു
  rationale: വർത്തമാനകാലവും വിസ്മയത്തോടൊപ്പം അമ്പരപ്പോ ചോദ്യഭാവമോ ഉൾക്കൊള്ളാവുന്ന അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു; പ്രതികരണം അനുകൂലമാണെന്ന് മുൻകൂട്ടി തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ ἔργον എന്ന പദത്തിന്റെ പ്രാധാന്യം
  choice: പ്രവൃത്തി
  alternative: കൃത്യം
  rationale: യേശുവിന്റെ പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കാൻ യോഹന്നാൻ ആവർത്തിച്ച് ഉപയോഗിക്കുന്ന മുഖ്യപദവുമായി ബന്ധം നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തിൽ അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘മറുപടിയായി പറഞ്ഞു’ എന്നത് ഉറവിടത്തിലെ ഇരട്ട ക്രിയാസൂത്രത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുന്നു. ‘അതിൽ’ എന്ന ബന്ധപദം പ്രതികരണത്തിന് കാരണമായ ആ പ്രവൃത്തിയിലേക്കുള്ള സൂചന മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
