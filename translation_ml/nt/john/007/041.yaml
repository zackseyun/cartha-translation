id: JHN.7.41
reference: John 7:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: ml
  text: 'മറ്റുചിലർ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇവനാണ് മശീഹാ[a].” എന്നാൽ മറ്റുചിലർ പറഞ്ഞുകൊണ്ടിരുന്നു: “മശീഹാ ഗലീലയിൽനിന്ന് വരുന്നതല്ലല്ലോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: Χριστός എന്ന ഗ്രീക്ക് പദത്തിന്റെ പരമ്പരാഗത പദവിരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: ἄλλοι
  choice: മറ്റുചിലർ
  rationale: ജനക്കൂട്ടത്തിനുള്ളിലെ മറ്റൊരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന നാമവിശേഷണമാണ്; ‘മറ്റുചിലർ’ വിഭാഗവ്യത്യാസം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു / പറഞ്ഞു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം ജനക്കൂട്ടത്തിൽ തുടർന്നോ ആവർത്തിച്ചോ നടന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ആദ്യ സന്ദർഭത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന് അത് പ്രകടമാക്കി; ആവർത്തനം ഭാരമാകാതിരിക്കാൻ രണ്ടാമത്തേതിൽ സ്വാഭാവികമായ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു.
- source_word: Οὗτός ἐστιν
  choice: ഇവനാണ്
  rationale: ഒരു പുരുഷനെ തിരിച്ചറിഞ്ഞ് ചൂണ്ടിക്കാണിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളരൂപം.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമമല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ പദവിയാണ്; ‘മശീഹാ’ അതിന്റെ യഹൂദ പശ്ചാത്തലവും പദവിസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: οἱ δὲ
  choice: എന്നാൽ വേറെ ചിലർ
  rationale: δέയോടുകൂടിയ ബഹുവചന ആർട്ടിക്കിൾ മുമ്പത്തെ വിഭാഗത്തോടു വിരുദ്ധമായ മറ്റൊരു കൂട്ടത്തെ പരിചയപ്പെടുത്തുന്നു.
- source_word: Μὴ γὰρ
  choice: …അല്ലല്ലോ …?
  rationale: μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണ്; γάρ നൽകുന്ന ഉറപ്പോടുകൂടിയ എതിർപ്പ് മലയാളത്തിലെ ‘അല്ലല്ലോ’ എന്ന സ്വാഭാവിക ചോദ്യരൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: ഗലീലയിൽനിന്ന്
  rationale: ἐκ ഇവിടെ ഉത്ഭവസ്ഥലത്തെയോ വരവിന്റെ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നത്
  rationale: മശീഹായെക്കുറിച്ചുള്ള പൊതുവായ പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ജനക്കൂട്ടം പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തൻ ആരെന്നു തർക്കിക്കുന്ന സന്ദർഭമായതിനാൽ പദവിയായ ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; പരമ്പരാഗത ഗ്രീക്ക് ആധാരിത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: മശീഹായുടെ ഗലീലീയ ഉത്ഭവത്തെക്കുറിച്ചുള്ള ചോദ്യത്തിന്റെ സ്വരം
  choice: മശീഹാ ഗലീലയിൽനിന്നല്ലല്ലോ വരുന്നത്?
  alternative: മശീഹാ ഗലീലയിൽനിന്ന് വരുമോ?
  rationale: μή γάρ നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാഗ്മിതാപരമായ ചോദ്യം ആയതിനാൽ സംസാരിക്കുന്നവരുടെ ഉറച്ച ധാരണ പ്രകടമാക്കുന്ന ‘അല്ലല്ലോ’ ഉപയോഗിച്ചു; അവരുടെ ധാരണ ശരിയാണെന്ന് വിവർത്തനം സ്വയം വിധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ജനക്കൂട്ടത്തിലെ പരസ്പരവിരുദ്ധ അഭിപ്രായവും രണ്ടാം വാക്യത്തിലെ നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യസ്വരവും നിലനിർത്തിയിരിക്കുന്നു.
