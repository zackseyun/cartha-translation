revisions:
- from: 'മറ്റുചിലർ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇവനാണ് മശീഹാ[a].” എന്നാൽ വേറെ ചിലർ പറഞ്ഞു: “മശീഹാ ഗലീലയിൽനിന്നല്ലല്ലോ വരുന്നത്?”'
  to: 'മറ്റുചിലർ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇവനാണ് മശീഹാ[a].” എന്നാൽ മറ്റുചിലർ പറഞ്ഞുകൊണ്ടിരുന്നു: “മശീഹാ ഗലീലയിൽനിന്ന് വരുന്നതല്ലല്ലോ?”'
  rationale: രണ്ടു സന്ദർഭങ്ങളിലും ഉള്ള ἔλεγον-ന്റെ ഇംപെർഫെക്റ്റ് ഭാവം നിലനിർത്താൻ രണ്ടാം «പറഞ്ഞു» എന്നത് «പറഞ്ഞുകൊണ്ടിരുന്നു» എന്നാക്കി. വാഗ്മിതാപരമായ നിഷേധചോദ്യത്തിന്റെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളവും നിലനിർത്താൻ വാക്കുകളുടെ ക്രമം ചെറുതായി മിനുക്കി.
