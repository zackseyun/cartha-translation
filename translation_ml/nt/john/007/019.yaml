source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: ml
  text: മോശ നിങ്ങൾക്കു നിയമം നൽകിയില്ലേ? എന്നിട്ടും നിങ്ങളിൽ ആരും നിയമം പാലിക്കുന്നില്ല.[a] എന്നെ കൊല്ലാൻ നിങ്ങൾ ശ്രമിക്കുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിയമം ചെയ്യുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ Μωϋσῆς δέδωκεν ὑμῖν τὸν νόμον;
  choice: മോശ നിങ്ങൾക്കു നിയമം നൽകിയില്ലേ?
  rationale: οὐ കൊണ്ടു തുടങ്ങുന്ന ചോദ്യം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യമാണ്. δέδωκεν എന്ന പൂർണകാലരൂപത്തിന്റെ നിലവിലുള്ള പ്രസക്തി മലയാളത്തിലെ സ്വാഭാവികമായ ‘നൽകിയില്ലേ?’ എന്ന പ്രയോഗത്തിൽ മതിയായ വിധം നിലനിൽക്കുന്നു.
- source_word: Μωϋσῆς
  choice: മോശ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതവും നിലവാരമുള്ളതുമായ പേരുരൂപം.
- source_word: τὸν νόμον
  choice: നിയമം
  rationale: സന്ദർഭത്തിൽ മോശയിലൂടെ ലഭിച്ച തോറാ അഥവാ മോശയുടെ നിയമമാണ് ഉദ്ദേശ്യം. ‘നിയമം’ സാധാരണ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; പ്രത്യേക നാമമെന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: 'ഇവിടെ καί വെറും കൂട്ടിച്ചേർക്കലിനേക്കാൾ വൈരുധ്യം സൂചിപ്പിക്കുന്നു: നിയമം ലഭിച്ചിട്ടും അവർ അത് പാലിക്കുന്നില്ല.'
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആരും
  rationale: സമ്പൂർണ നിഷേധത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποιεῖ τὸν νόμον
  choice: നിയമം പാലിക്കുന്നില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘നിയമം ചെയ്യുക’ എന്നാണെങ്കിലും, നിയമം അനുഷ്ഠിക്കുക/ആചരിക്കുക എന്ന ആശയത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപ്രയോഗം ‘നിയമം പാലിക്കുക’ എന്നതാണ്.
- source_word: τί με ζητεῖτε ἀποκτεῖναι;
  choice: എന്നെ കൊല്ലാൻ നിങ്ങൾ ശ്രമിക്കുന്നത് എന്തിന്?
  rationale: τί കാരണം ചോദിക്കുന്ന ‘എന്തിന്’ എന്നും ζητεῖτε ἀποκτεῖναι തുടരുന്ന ഉദ്ദേശ്യമോ ശ്രമമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ ‘കൊല്ലാൻ ശ്രമിക്കുക’ എന്നും നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘നിയമം’ എന്നതിന്റെ സൂചന
  choice: മോശയിലൂടെ ലഭിച്ച നിയമം/തോറാ
  alternative: പൊതുവായ ധാർമിക നിയമം
  rationale: യേശു മോശയെ വ്യക്തമായി പരാമർശിക്കുന്നതിനാൽ ഇവിടെ νόμος എന്നത് അമൂർത്തമായ നിയമസങ്കൽപ്പത്തേക്കാൾ മോശയുടെ നിയമത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വിശദീകരണപദങ്ങൾ മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ സന്ദർഭം ഈ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പരമ്പരാഗതമായ ‘ന്യായപ്രമാണം’ എന്നതിനു പകരം സാധാരണ വായനക്കാർക്ക് കൂടുതൽ നേരിട്ടു മനസ്സിലാകുന്ന ‘നിയമം’ ഉപയോഗിച്ചു. വാചാടോപചോദ്യങ്ങളും കുറ്റാരോപണത്തിന്റെ നേരിട്ടുള്ള സ്വരവും നിലനിർത്തി.
