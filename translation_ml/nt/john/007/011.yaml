id: JHN.7.11
reference: John 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദന്മാർ[a] പെരുന്നാളിൽ അവനെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു; “അയാൾ എവിടെയാണ്?” എന്നും അവർ ചോദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദ്യർ”; യോഹന്നാന്റെ ആഖ്യാനസന്ദർഭത്തിൽ ഇത് കൂടുതൽ പ്രത്യേകമായി യെഹൂദ്യയിലെ യെഹൂദ അധികാരികളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: Ἰουδαῖοι എന്ന പദത്തിന്റെ സന്ദർഭപരമായ മറ്റൊരു അർഥസാധ്യത സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽ യേശു പരസ്യമായി പെരുന്നാളിലേക്കു പോകാതിരുന്നതുമായി ഈ സംഭവത്തെ ബന്ധിപ്പിക്കുന്ന ആഖ്യാനപരമായ തുടർച്ചയും നിഗമനഭാവവും പ്രകടമാക്കുന്നു.
- source_word: Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: പദത്തിന് പൊതുവായി യെഹൂദന്മാർ, യെഹൂദ്യർ, അല്ലെങ്കിൽ സന്ദർഭാനുസരണം യെഹൂദ അധികാരികൾ എന്നിങ്ങനെ അർഥമാകാം. വാക്യം തന്നിൽ പരിധി വ്യക്തമാക്കാത്തതിനാൽ വിശാലമായ പദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: ἐζήτουν
  choice: അന്വേഷിച്ചുകൊണ്ട്
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; തുടർന്നുള്ള ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്ന ക്രിയയോടൊപ്പം ഒരേ നടന്നുകൊണ്ടിരുന്ന സംഭവമായി വായിക്കാം.
- source_word: ἐν τῇ ἑορτῇ
  choice: പെരുന്നാളിൽ
  rationale: മുൻസന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെട്ടിരിക്കുന്ന പെരുന്നാളിന്റെ സമയത്തും വേദിയിലും നടന്ന പ്രവൃത്തിയെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: മൂലപദം അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നാണെങ്കിലും അതിനു പിന്നാലെയുള്ളത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; അപൂർണ ഭൂതകാലത്തിന്റെ തുടരുന്ന അല്ലെങ്കിൽ ആവർത്തിക്കുന്ന ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἐκεῖνος
  choice: അയാൾ
  rationale: വെറും ‘അവൻ’ എന്നതിനെക്കാൾ അകലം സൂചിപ്പിക്കുന്ന സർവനാമഭാവം നൽകുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ എന്ന നാമം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ Ἰουδαῖοι എന്ന പദത്തിന്റെ സൂചിതവിഭാഗം
  choice: മുഖ്യപാഠത്തിൽ ‘യെഹൂദന്മാർ’ എന്ന് നൽകി സൂചിതവിഭാഗത്തെ നേതാക്കളിലേക്കോ യെഹൂദ്യരിലേക്കോ ചുരുക്കാതിരിക്കുക
  alternative: ‘യെഹൂദ്യർ’ അല്ലെങ്കിൽ ‘യെഹൂദ അധികാരികൾ’
  rationale: ഈ വാക്യം തന്നെ ഒരു പ്രത്യേക ഉപവിഭാഗത്തെ വ്യക്തമാക്കുന്നില്ല. യോഹന്നാന്റെ ആഖ്യാനത്തിൽ പദത്തിന് കൂടുതൽ പരിമിതമായ സന്ദർഭാർഥം ഉണ്ടാകാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നത് അർഥസന്ദിഗ്ധതയെ അനാവശ്യമായി പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. തുടർച്ചയായ പ്രവൃത്തിയെ ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം വ്യക്തമാക്കുന്നു; ‘അയാൾ’ എന്നത് ἐκεῖνος എന്ന പദത്തിലെ അകൽച്ചാഭാവം അതിശയോക്തിയില്ലാതെ പകരുന്നു.
