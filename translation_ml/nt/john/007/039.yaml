id: JHN.7.39
reference: John 7:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: ml
  text: അവൻ ഇതു പറഞ്ഞത്, അവനിൽ വിശ്വസിച്ചവർ സ്വീകരിക്കാനിരുന്ന ആത്മാവിനെക്കുറിച്ചാണ്[a]. കാരണം, യേശു ഇതുവരെ മഹത്ത്വീകരിക്കപ്പെട്ടിരുന്നില്ല; അതിനാൽ ആത്മാവ് അപ്പോഴും ഉണ്ടായിരുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ആത്മാവ്’ എന്നു പറയുന്നത് വിശ്വാസികൾ സ്വീകരിക്കാനിരുന്ന ദൈവാത്മാവിനെയാണ്; ഗ്രീക്കിൽ ‘പരിശുദ്ധ’ എന്ന പദമില്ല.
    reason: source_clarity
  - marker: b
    text: കൂടുതൽ വ്യക്തമായി, ‘ആത്മാവ് അപ്പോഴും നൽകപ്പെട്ടിരുന്നില്ല’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആത്മാവ് അപ്പോഴും ഉണ്ടായിരുന്നില്ല’ എന്നാണ്; ഈ പ്രസ്താവന യേശു ഇതുവരെ മഹത്ത്വീകരിക്കപ്പെട്ടിരുന്നില്ല എന്നതുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: ആത്മാവ്
  rationale: സന്ദർഭത്തിൽ വിശ്വാസികൾ സ്വീകരിക്കാനിരുന്ന ദൈവാത്മാവാണ് ഉദ്ദേശ്യം. ഗ്രീക്കിൽ ἅγιον ഇല്ലാത്തതിനാൽ ‘പരിശുദ്ധാത്മാവ്’ എന്നു വിപുലീകരിക്കാതെ ‘ആത്മാവ്’ എന്നു നിലനിർത്തുന്നു.
- source_word: οὗ
  choice: ആ ആത്മാവിനെ
  rationale: ഗ്രീക്ക് ബന്ധസർവനാമം ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികവും അവ്യക്തതയില്ലാത്തതുമായ ബന്ധം നൽകാൻ നാമം ആവർത്തിച്ചു.
- source_word: ἔμελλον λαμβάνειν
  choice: സ്വീകരിക്കാനിരിക്കുകയായിരുന്നു
  rationale: μέλλωയും infinitive-ഉം നൽകുന്ന ഭാവികാലസൂചനയും പ്രതീക്ഷിത സംഭവത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: അവനിൽ വിശ്വസിച്ചവർ
  rationale: യോഹന്നാനിലെ πιστεύω εἰς എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; aorist participle-നെ അനാവശ്യമായി പൂർവപൂർണകാലമാക്കുന്നില്ല.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: ആത്മാവ് അപ്പോഴും ഉണ്ടായിരുന്നില്ല
  rationale: ‘നൽകപ്പെട്ടിട്ടില്ല’ എന്ന ഗ്രീക്കിലില്ലാത്ത ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, മൂലത്തിന്റെ ചുരുക്കവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സൂക്ഷിക്കുന്നു.
- source_word: οὐδέπω ἐδοξάσθη
  choice: ഇനിയും മഹത്ത്വീകരിക്കപ്പെട്ടിട്ടില്ലായിരുന്നു
  rationale: യേശുവിന്റെ മഹത്ത്വീകരണം ഇതുവരെ സംഭവിച്ചിരുന്നില്ലെന്ന സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐδοξάσθη
  choice: മഹത്ത്വീകരിക്കപ്പെട്ടു
  rationale: യോഹന്നാനിലെ δοξάζω എന്ന പ്രധാന ആശയപദം നിലനിർത്തുന്നു; മരണം, ഉയിർപ്പ്, ഉയർത്തപ്പെടൽ എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμα എന്ന വാക്യം ആത്മാവ് മുമ്പ് അസ്തിത്വത്തിലില്ലായിരുന്നു എന്ന ധാരണയുണ്ടാക്കാതെ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം?
  choice: മുഖ്യവാചകത്തിൽ ‘ആത്മാവ് അപ്പോഴും ഉണ്ടായിരുന്നില്ല’ എന്ന മൂലത്തോട് അടുത്ത പിരിമുറുക്കമുള്ള രൂപം നിലനിർത്തി, സാദ്ധ്യമായ വ്യാഖ്യാനാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: ‘ആത്മാവ് അപ്പോഴും നൽകപ്പെട്ടിരുന്നില്ല’ അല്ലെങ്കിൽ ‘ആത്മാവ് അപ്പോഴും സന്നിഹിതനായിരുന്നില്ല’.
  rationale: ഗ്രീക്ക് വാചകം ‘നൽകപ്പെട്ടു’ എന്നോ ‘സന്നിഹിതനായിരുന്നു’ എന്നോ പറയുന്നില്ല. അതിനാൽ അർഥം നിശ്ശബ്ദമായി തീർപ്പാക്കാതെ, യേശുവിന്റെ മഹത്ത്വീകരണവുമായി ബന്ധിപ്പിച്ചിരിക്കുന്ന മൂലവാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്ക് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്നു മലയാളവാക്യങ്ങളാക്കി; കാരണബന്ധവും ആവർത്തനവും നിലനിർത്തി. ‘മഹത്ത്വീകരിക്കപ്പെട്ടു’ എന്ന യോഹന്നാനീയ ആശയപദം ഏകീകരിച്ച് ഉപയോഗിച്ചു.
