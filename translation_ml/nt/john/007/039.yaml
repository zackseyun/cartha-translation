    rationale: ‘അവൻ ഇതു പറഞ്ഞത് ആത്മാവിനെക്കുറിച്ചായിരുന്നു. അവനിൽ വിശ്വസിച്ചവർ ആ ആത്മാവിനെ സ്വീകരിക്കാനിരിക്കുകയായിരുന്നു’ എന്ന വിഭജനം οὗ ἔμελλον λαμβάνειν എന്ന ബന്ധവാക്യത്തെ കുറച്ച് നേരിട്ടല്ലാത്തതാക്കുന്നു. ‘...സ്വീകരിക്കാനിരുന്ന ആത്മാവിനെക്കുറിച്ചാണ്...’ എന്ന രൂപം മൂലഘടനയും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
