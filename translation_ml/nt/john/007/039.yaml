  source_fidelity: 'മുഖ്യഅർഥം പൊതുവേ കൃത്യമാണ്: πνεῦμα ‘ആത്മാവ്,’ πιστεύσαντες εἰς αὐτόν ‘അവനിൽ വിശ്വസിച്ചവർ,’ ἔμελλον λαμβάνειν എന്ന പ്രതീക്ഷിത സ്വീകരണം, യേശുവിന്റെ മഹത്ത്വീകരണവുമായി ബന്ധിപ്പിച്ച οὔπω γὰρ ἦν πνεῦμα എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ നിലവിലെ മൂന്ന് സ്വതന്ത്രവാക്യങ്ങളിലുള്ള രൂപം ബന്ധസർവനാമത്തിന്റെ ഘടനയെ അല്പം മങ്ങിക്കുന്നു. അതിനെ ഒരു സ്വാഭാവിക മലയാളവാക്യത്തിൽ പുനഃസ്ഥാപിക്കാം.'
  naturalness: ‘സ്വീകരിക്കാനിരിക്കുകയായിരുന്നു’ എന്നും ‘മഹത്ത്വീകരിക്കപ്പെട്ടിട്ടില്ലായിരുന്നതിനാൽ’ എന്നും വ്യാകരണപരമായി സാധ്യമാണെങ്കിലും ആധുനിക നിലവാരമലയാളത്തിൽ ഭാരമുള്ളവയാണ്. ‘സ്വീകരിക്കാനിരുന്ന’ എന്നും ‘യേശു ഇതുവരെ മഹത്ത്വീകരിക്കപ്പെട്ടിരുന്നില്ല’ എന്നും കൂടുതൽ സ്വാഭാവികവും വായനാസുഗമവുമാണ്.
  terminology: ‘ആത്മാവ്’യും ‘മഹത്ത്വീകരിക്കപ്പെട്ടു’വും യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ അല്ലെങ്കിൽ ‘നൽകപ്പെട്ടു’ എന്ന ആശയം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് b, വാചകത്തിന്റെ അസാധാരണമായ ചുരുക്കം സംരക്ഷിച്ചുകൊണ്ട് ‘നൽകപ്പെട്ടിരുന്നില്ല’ എന്ന വിശദീകരണസാധ്യത ഉചിതമായി അറിയിക്കുന്നു.
