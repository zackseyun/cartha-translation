revisions:
- from: അവൻ ഇതു പറഞ്ഞത് ആത്മാവിനെക്കുറിച്ചായിരുന്നു[a]. അവനിൽ വിശ്വസിച്ചവർ ആ ആത്മാവിനെ സ്വീകരിക്കാനിരിക്കുകയായിരുന്നു. യേശു ഇനിയും മഹത്ത്വീകരിക്കപ്പെട്ടിട്ടില്ലായിരുന്നതിനാൽ ആത്മാവ് അപ്പോഴും ഉണ്ടായിരുന്നില്ല[b].
  to: അവൻ ഇതു പറഞ്ഞത്, അവനിൽ വിശ്വസിച്ചവർ സ്വീകരിക്കാനിരുന്ന ആത്മാവിനെക്കുറിച്ചാണ്[a]. കാരണം, യേശു ഇതുവരെ മഹത്ത്വീകരിക്കപ്പെട്ടിരുന്നില്ല; അതിനാൽ ആത്മാവ് അപ്പോഴും ഉണ്ടായിരുന്നില്ല[b].
  rationale: ബന്ധസർവനാമം ആത്മാവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ പുനഃസ്ഥാപിക്കുകയും, ഭാവിസൂചനയുള്ള μέλλω + infinitive-നെ ‘സ്വീകരിക്കാനിരുന്ന’ എന്നു സ്വാഭാവികമായി നൽകുകയും ചെയ്തു. οὔπω γὰρ ἦν πνεῦμα എന്ന വാചകത്തിന്റെ വ്യാഖ്യാനപരമായി പ്രയാസമുള്ള ചുരുക്കം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്; ‘നൽകപ്പെട്ടിരുന്നില്ല’ എന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ മാത്രമാണ്. കാരണബന്ധം വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘അതുകൊണ്ട്’ ഉപയോഗിച്ചെങ്കിലും, യേശുവിന്റെ മഹത്ത്വീകരണം നടക്കാതിരുന്നതും ആത്മാവിനെക്കുറിച്ചുള്ള പ്രസ്താവനയും തമ്മിലുള്ള മൂലപാഠത്തിലെ ബന്ധത്തിൽ ഒരു പുതിയ ദൈവശാസ്ത്രനിഗമനവും ചേർത്തിട്ടില്ല.
