id: JHN.7.25
reference: John 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: ml
  text: 'അപ്പോൾ യെരൂശലേം നിവാസികളിൽ ചിലർ[a] പറഞ്ഞുകൊണ്ടിരുന്നു: “ഇയാളല്ലേ അവർ കൊല്ലാൻ അന്വേഷിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരൂശലേമ്യരിൽ ചിലർ.”
    reason: Ἱεροσολυμιτῶν എന്ന പദം യെരൂശലേം നിവാസികളെ സൂചിപ്പിക്കുന്നു; ‘യെരൂശലേമ്യർ’ എന്നത് അതിന്റെ സംക്ഷിപ്തമായ ബദൽ പ്രയോഗമാണ്.
lexical_decisions:
- source_word: Ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം രംഗത്തിൽ തുടർന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ പ്രയോഗം അതിന്റെ ക്രിയാഭാവം നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ആഖ്യാനത്തുടർച്ചയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ കർശനമായ നിഗമനാർഥം നിർബന്ധമല്ല.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: യെരൂശലേം നിവാസികളിൽ ചിലർ
  rationale: അനിശ്ചിതമായ ഒരു ഉപവിഭാഗത്തെയും ἐκ എന്നതിന്റെ ‘കൂട്ടത്തിൽനിന്ന്’ എന്ന ആശയത്തെയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Οὐχ οὗτός ἐστιν
  choice: ഇയാളെ തന്നെയല്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന നിഷേധചോദ്യത്തിന്റെ ഊന്നൽ ‘തന്നെയല്ലേ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ὃν ζητοῦσιν ἀποκτεῖναι
  choice: കൊല്ലാൻ അവർ അന്വേഷിക്കുന്നത്
  rationale: ζητοῦσιν എന്ന വർത്തമാനകാലത്തിലെ തുടരുന്ന അന്വേഷണവും ἀποκτεῖναι എന്നതിന്റെ നേരായ ‘കൊല്ലുക’ എന്ന അർഥവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ചോദ്യത്തിലെ പ്രതീക്ഷിത അനുകൂല ഉത്തരത്തിന്റെ ഭാവം ‘തന്നെയല്ലേ’ എന്നും, അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ച ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നും പ്രകടിപ്പിച്ചു.
