  verdict: revise
  source_fidelity: The draft accurately represents the imperfect Ἔλεγον (‘were saying’), the unspecified subset of Jerusalem residents, and the rhetorical question expecting agreement. However, the word order in ‘കൊല്ലാൻ അവർ അന്വേഷിക്കുന്നത് ഇയാളെ’ is less natural and momentarily obscures that ‘this one’ is the person whom they seek to kill.
  naturalness: ‘അപ്പോൾ യെരൂശലേം നിവാസികളിൽ ചിലർ’ and ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ are natural modern standard Malayalam. Recasting the question as ‘ഇയാളല്ലേ അവർ കൊല്ലാൻ അന്വേഷിക്കുന്നത്?’ gives an idiomatic Malayalam relative sense while retaining the source’s emphasis and question force.
  terminology: ‘യെരൂശലേം നിവാസികൾ’ is clear and appropriate for Ἱεροσολυμιτῶν. ‘കൊല്ലാൻ’ accurately renders ἀποκτεῖναι without importing judicial meaning. The alternate ‘യെരൂശലേമ്യർ’ is possible but less common in contemporary Malayalam, so it is retained only as a lexical footnote.
