reference: John 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: ml
  text: എന്നാൽ, അവന്റെ സഹോദരന്മാർ പെരുന്നാളിലേക്കു കയറിപ്പോയശേഷം, അവനും കയറിപ്പോയി; പക്ഷേ പരസ്യമായിട്ടല്ല, രഹസ്യമായിട്ടെന്നപോലെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രഹസ്യമായി.’ ഗ്രീക്കിലെ പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘രഹസ്യമായിട്ടെന്നപോലെ’ എന്നാണ്; ഇത് പ്രസ്താവനയെ അല്പം മൃദൂകരിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: എന്നാൽ ... ശേഷം
  rationale: ὡς അഓറിസ്റ്റ് ക്രിയയോടൊപ്പം സമയബന്ധം സൂചിപ്പിക്കുന്നു; δέ നേരിയ മാറ്റമോ വൈരുധ്യമോ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘എന്നാൽ ... ശേഷം’ എന്ന ഘടന സംഭവക്രമവും മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: കയറിപ്പോയശേഷം ... കയറിപ്പോയി
  rationale: ἀναβαίνω എന്നതിന്റെ ‘മുകളിലേക്കു പോകുക’ എന്ന ഭൗമശാസ്ത്രപരവും തീർത്ഥയാത്രാപരവുമായ ഭാവം ‘കയറിപ്പോകുക’ നിലനിർത്തുന്നു; ‘ശേഷം’ രണ്ട് പ്രവൃത്തികളുടെ ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: സമീപസന്ദർഭത്തിൽ ἀδελφοί യേശുവിന്റെ പുരുഷസഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിർണ്ണയം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὴν ἑορτήν
  choice: പെരുന്നാളിന്
  rationale: ἑορτή ഇവിടെ കൂടാരപ്പെരുന്നാളിനെ സൂചിപ്പിക്കുന്നു. യഹൂദ മതാഘോഷത്തിന്റെ സന്ദർഭത്തിൽ ‘പെരുന്നാൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ പദമാണ്.
- source_word: τότε καὶ αὐτὸς
  choice: അവനും
  rationale: καὶ αὐτός നൽകുന്ന കൂട്ടിച്ചേർക്കൽ ‘അവനും’ വ്യക്തമാക്കുന്നു; മുൻകാലവാക്യത്തിലെ ‘ശേഷം’ τότε സൂചിപ്പിക്കുന്ന തുടർക്രമം ഇതിനകം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οὐ φανερῶς
  choice: പരസ്യമായിട്ടല്ല
  rationale: φανερῶς എന്നതിന്റെ തുറന്നോ പൊതുവായോ ഉള്ള രീതിയെ നേരിട്ട് പ്രകടിപ്പിക്കുകയും പിന്നാലെയുള്ള രഹസ്യതയോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: രഹസ്യത്തിലെന്നപോലെ
  rationale: ὡς മൂലം പ്രസ്താവനയ്ക്കുള്ള നേരിയ യോഗ്യത അഥവാ മൃദൂകരണം നിലനിർത്തുന്നു; വെറും ‘രഹസ്യമായി’ എന്ന് പറഞ്ഞ് ഉറപ്പിച്ചുകളയുന്നില്ല.
theological_decisions:
- issue: പെരുന്നാളിന് കയറിപ്പോകില്ലെന്ന യേശുവിന്റെ മുൻപ്രസ്താവനയുമായി ഈ പ്രവൃത്തിക്കുള്ള ബന്ധം
  choice: സഹോദരന്മാർ പോയശേഷം യേശുവും പരസ്യമായിട്ടല്ലാതെ പോയെന്ന വിവരണം വ്യാഖ്യാനപരമായി പൊരുത്തപ്പെടുത്താതെ നിലനിർത്തി.
  alternative: യേശു മനസ്സുമാറ്റിയെന്നോ മുൻപ്രസ്താവനയുമായി എങ്ങനെ പൊരുത്തപ്പെടുന്നുവെന്നോ പരിഭാഷയിൽ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം സംഭവത്തെ മാത്രം വിവരിക്കുന്നു; പ്രത്യക്ഷമായ ആഖ്യാനപിരിമുറുക്കം പരിഹരിക്കുന്നില്ല. അതിനാൽ പരിഭാഷയും അതിനെ തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘കയറിപ്പോയി’ എന്നത് യെരൂശലേമിലേക്കുള്ള യാത്രയുടെ മൂലഭാഷാഭാവം നിലനിർത്തുന്നു; ‘രഹസ്യത്തിലെന്നപോലെ’ അപൂർവമെങ്കിലും മനസ്സിലാകുന്ന രീതിയിൽ ഗ്രീക്കിലെ യഥാർഥ യോഗ്യത സംരക്ഷിക്കുന്നു.
