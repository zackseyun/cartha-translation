source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് അവന്റെ സഹോദരന്മാർ അവനോടു പറഞ്ഞു: “ഇവിടെനിന്ന് പുറപ്പെട്ട് യെഹൂദ്യയിലേക്കു പോകുക; നീ ചെയ്യുന്ന പ്രവൃത്തികൾ നിന്റെ ശിഷ്യന്മാരും കാണേണ്ടതിന്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാണും” എന്നോ “നിരീക്ഷിക്കും” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ശ്രദ്ധയോടെ നോക്കുക എന്ന ഊന്നൽ ഉണ്ടാകാം; ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഈ ഉപവാക്യത്തിൽ അത് ഭാവികാലരൂപത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനപരവും തുടർച്ചാസൂചകവുമായ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: അവന്റെ സഹോദരന്മാർ
  rationale: വ്യാകരണപരമായി പുരുഷലിംഗ ബഹുവചനമായ ഗ്രീക്ക് പദവും യേശുവിന്റെ പുരുഷ കുടുംബാംഗങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ബന്ധത്തിന്റെ കൃത്യ സ്വഭാവത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: ഇവിടെനിന്ന് പുറപ്പെട്ട്
  rationale: നിലവിലുള്ള സ്ഥലത്തുനിന്ന് നീങ്ങാനുള്ള നേരിട്ടുള്ള ആജ്ഞയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: യെഹൂദ്യയിലേക്കു പോകുക
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ആജ്ഞയും ലക്ഷ്യസ്ഥാനമായ പ്രദേശനാമവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἵνα καὶ
  choice: …നിന്റെ ശിഷ്യന്മാരും കാണേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യാർഥവും καὶയുടെ ‘കൂടി/ഉം’ എന്ന അർഥവും മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: οἱ μαθηταί σου
  choice: നിന്റെ ശിഷ്യന്മാർ
  rationale: യോഹന്നാനിലെ ഗുരു–ശിഷ്യ ബന്ധം സൂക്ഷിക്കുന്ന പതിവും കൃത്യവുമായ പരിഭാഷയാണ്.
- source_word: θεωρήσουσιν
  choice: കാണേണ്ടതിന്
  rationale: രൂപത്തിൽ ഭാവികാല നിർദേശകമായ ക്രിയ ἵνα-ഉദ്ദേശ്യവാക്യത്തിൽ വരുന്നതിനാൽ, മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കാണുക/നിരീക്ഷിക്കുക എന്ന ദൃശ്യാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: നീ ചെയ്യുന്ന പ്രവൃത്തികൾ
  rationale: ‘നിന്റെ പ്രവൃത്തികൾ’ എന്ന കൈവശാർഥത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യമായി അവതരിപ്പിക്കുമ്പോഴും യോഹന്നാനിൽ പ്രമേയപ്രാധാന്യമുള്ള ἔργαയ്ക്ക് ‘പ്രവൃത്തികൾ’ എന്ന പദം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ സഹോദരന്മാർ’ എന്നതിന്റെ പരാമർശം
  choice: കഥയിൽ സംസാരിക്കുന്ന യേശുവിന്റെ കുടുംബത്തിലെ പുരുഷ അംഗങ്ങളെന്ന നിലയിൽ ‘അവന്റെ സഹോദരന്മാർ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: വിശാലമായ അർഥത്തിൽ ബന്ധുക്കൾ അഥവാ കുടുംബക്കാർ എന്നു നൽകാം.
  rationale: സമീപസന്ദർഭം അവരെ യേശുവിന്റെ സഹോദരന്മാരായി നേരിട്ട് അവതരിപ്പിക്കുന്നു. എന്നാൽ അവരുടെ ബന്ധത്തിന്റെ ജൈവികമോ മറ്റേതെങ്കിലും കൃത്യസ്വഭാവമോ പരിഭാഷയിൽ അധികമായി നിർണ്ണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘യെഹൂദ്യ’, ‘ശിഷ്യന്മാർ’, ‘പ്രവൃത്തികൾ’ എന്നീ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദങ്ങൾ നിലനിർത്തി; പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യമായ സഭാപാരമ്പര്യ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
