id: JHN.8.46
reference: John 8:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: ml
  text: നിങ്ങളിൽ ആർക്ക് എന്നെ പാപത്തിന്റെ കാര്യത്തിൽ കുറ്റക്കാരനാണെന്ന് തെളിയിക്കാനാകും?[a] ഞാൻ സത്യം പറയുന്നുവെങ്കിൽ, നിങ്ങൾ എന്തുകൊണ്ട് എന്നെ വിശ്വസിക്കുന്നില്ല?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളിൽ ആർ എന്നെ പാപത്തിന്റെ കാര്യത്തിൽ കുറ്റക്കാരനാണെന്ന് തെളിയിക്കുന്നു?’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ എന്തുകൊണ്ട് എന്നിൽ വിശ്വാസം വെക്കുന്നില്ല?’ ഗ്രീക്ക് പദപ്രയോഗത്തിന് ഒരാളുടെ വാക്ക് വിശ്വസിക്കുക എന്നും അയാളിൽ വിശ്വാസം വെക്കുക എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആർക്ക്
  rationale: ‘നിങ്ങളിൽ ആർ’ എന്ന നേരിട്ടുള്ള വെല്ലുവിളിയെ സ്വാഭാവികമായ മലയാള ചോദ്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐλέγχει
  choice: കുറ്റക്കാരനെന്നു തെളിയിക്കാൻ കഴിയും
  rationale: ഈ സന്ദർഭത്തിലെ ആരോപണാത്മകവും ന്യായവിസ്താരസദൃശവുമായ ഭാവം നിലനിർത്തുന്നു; ‘ശാസിക്കുക’ എന്നതിലേക്കു അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: περὶ ἁμαρτίας
  choice: പാപത്തെക്കുറിച്ച്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന ‘പാപം സംബന്ധിച്ച്’ എന്ന വിശാലബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: εἰ ἀλήθειαν λέγω
  choice: ഞാൻ സത്യം പറയുന്നുവെങ്കിൽ
  rationale: εἰ എന്ന വ്യവസ്ഥാരൂപം ‘എങ്കിൽ’ എന്നു നിലനിർത്തുന്നു; അതിനെ വ്യാഖ്യാനപരമായി ‘ഞാൻ സത്യം പറയുന്നതിനാൽ’ എന്നാക്കി മാറ്റുന്നില്ല.
- source_word: διὰ τί
  choice: എന്തുകൊണ്ട്
  rationale: കാരണം ചോദിക്കുന്ന സാധാരണവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: πιστεύετέ μοι
  choice: എന്നെ വിശ്വസിക്കുന്നില്ല
  rationale: ദാതിവോടുകൂടിയ πιστεύωയിൽ ഉള്ള ഒരാളുടെ വാക്ക് വിശ്വസിക്കുക, അയാളിൽ വിശ്വാസം വെക്കുക എന്നീ ബന്ധിത അർത്ഥങ്ങൾ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ പാപരാഹിത്യവും സത്യവചനവും സൂചിപ്പിക്കുന്ന ചോദ്യങ്ങളുടെ പ്രഭാവം
  choice: ചോദ്യങ്ങൾ വിശദീകരിച്ചു വികസിപ്പിക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘എന്നിൽ ഏതെങ്കിലും പാപമുണ്ടെന്ന് നിങ്ങളിൽ ആർക്കെങ്കിലും തെളിയിക്കാമോ?’ എന്നിങ്ങനെ നിഗൂഢാർത്ഥം തുറന്നുപറയുക.
  rationale: മൂലപാഠം ശക്തമായ അവകാശവാദം ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു. അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രഭാവം മൃദൂകരിക്കാതെയും അധിക വ്യാഖ്യാനം ചേർക്കാതെയും സംരക്ഷിക്കുന്നു.
- issue: πιστεύετέ μοι എന്നതിലെ വിശ്വസിക്കൽ/ആശ്രയിക്കൽ ഭാവം
  choice: ‘എന്നെ വിശ്വസിക്കുന്നില്ല’ എന്നു നൽകി ഇരുഭാവങ്ങൾക്കും ഇടം നൽകി.
  alternative: ‘ഞാൻ പറയുന്നത് വിശ്വസിക്കുന്നില്ല’ അല്ലെങ്കിൽ ‘എന്നിൽ ആശ്രയിക്കുന്നില്ല’.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ സാക്ഷ്യത്തെ അംഗീകരിക്കുന്നതും വ്യക്തിയിൽ വിശ്വാസം വെക്കുന്നതും ഒരുമിച്ച് പ്രതിധ്വനിക്കാം; ഒറ്റ അർത്ഥത്തിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കോടതിസദൃശമായ വെല്ലുവിളിയുടെ ഭാവം നിലനിർത്തുന്നതിനൊപ്പം അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
