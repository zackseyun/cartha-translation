source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: ml
  text: എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നവൻ ഞാൻ തന്നെയാണ്[a]; എന്നെ അയച്ച പിതാവും എന്നെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നവൻ ഞാൻ തന്നെയാണ് ... എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: ഞാൻ തന്നെയാണ്
  rationale: തുടർന്നുവരുന്ന നാമവത്കൃത കൃദന്തരൂപത്തിന്റെ കർത്താവായി ἐγώയെ ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ ‘ഞാൻ തന്നെയാണ്’ എന്നത് സ്വാഭാവികമായി ഈ ഊന്നൽ പ്രകടമാക്കുന്നു; ഇതിനെ സ്വതന്ത്രമായ ‘ഞാൻ ആകുന്നു’ പ്രഖ്യാപനമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὁ μαρτυρῶν
  choice: സാക്ഷ്യം പറയുന്നവൻ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ വർത്തമാന കൃദന്തരൂപം ‘സാക്ഷ്യം പറയുന്നവൻ’ എന്ന നാമവത്കൃത അർഥത്തിലാണ്. ‘സാക്ഷ്യം പറയുക’ നിയമപരവും സാക്ഷ്യപരവുമായ ഭാവം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: περὶ ἐμαυτοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: ജനിറ്റീവിനോടുകൂടിയ περί ഇവിടെ ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്നാണ് സ്വാഭാവികം. ‘എനിക്കുവേണ്ടി’ എന്നു നൽകുന്നത് നിയമപരമായ പക്ഷപോഷണത്തിന്റെ അർഥം അധികമായി ചേർക്കും.
- source_word: μαρτυρεῖ
  choice: സാക്ഷ്യം പറയുന്നു
  rationale: ആദ്യ ഉപവാക്യത്തിലെ μαρτυρῶν എന്ന പദത്തോടുള്ള ആവർത്തനബന്ധം നിലനിർത്താനും സാക്ഷ്യത്തിന്റെ ആശയം വ്യക്തമാക്കാനും അതേ മലയാള പദസമുച്ചയം ഉപയോഗിച്ചു.
- source_word: περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: περὶ ἐμαυτοῦ എന്നതോടുള്ള സമാന്തരത നിലനിർത്തി, ‘എന്നെ സംബന്ധിച്ച്’ എന്നതിനെക്കാൾ സാധാരണവും സ്വാഭാവികവുമായ രൂപം തിരഞ്ഞെടുത്തു.
- source_word: ὁ πέμψας με πατήρ
  choice: എന്നെ അയച്ച പിതാവ്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തം പിതാവിനെ വിശേഷിപ്പിക്കുന്നതിനാൽ ‘എന്നെ അയച്ച പിതാവ്’ എന്ന ബന്ധവാക്യസമാന ഘടന കൃത്യമാണ്. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘എന്റെ’ അല്ലെങ്കിൽ ‘ദൈവമായ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ‘പിതാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വാചകത്തിലുള്ളതുപോലെ ‘പിതാവ്’ എന്നു മാത്രം നൽകി, ‘എന്നെ അയച്ച’ എന്ന വിശേഷണം നിലനിർത്തി.
  alternative: ‘എന്റെ പിതാവ്’ അല്ലെങ്കിൽ ‘പിതാവായ ദൈവം’
  rationale: മൂലപാഠം ὁ ... πατήρ എന്നാണ് പറയുന്നത്. ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ അവകാശവാദം സംരക്ഷിക്കുമ്പോഴും വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതിരിക്കാൻ ലളിതമായ രൂപം ആവശ്യമാണ്.
- issue: സാക്ഷ്യഭാഷയുടെ നിയമപരമായ ഭാവം
  choice: μαρτυρέωയുടെ രണ്ടു രൂപങ്ങൾക്കും ‘സാക്ഷ്യം പറയുക’ എന്ന ഒരേ പദപ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘സാക്ഷീകരിക്കുക’ അല്ലെങ്കിൽ ‘സാക്ഷ്യം വഹിക്കുക’
  rationale: ഈ വാക്യം യോഹന്നാനിലെ സാക്ഷ്യത്തിന്റെ കോടതിസദൃശ പ്രമേയത്തിൽ ഉൾപ്പെടുന്നു. ‘സാക്ഷ്യം പറയുക’ ആ ഭാവം വ്യക്തവും ആധുനികവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു സമാന്തര ഉപവാക്യങ്ങളിലുമുള്ള സാക്ഷ്യപദത്തിന്റെ ആവർത്തനം സൂക്ഷിച്ചു. ‘ഞാൻ തന്നെയാണ്’ എന്ന രൂപം കർത്താവിന്റെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; അനാവശ്യമായ സിദ്ധാന്തവികാസം ഒഴിവാക്കി.
