  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള വിവരണത്തിന്റെ (യോഹന്നാൻ 7:53–8:11) തുടർച്ചയാണ്. പാഠസാക്ഷ്യങ്ങളെക്കുറിച്ച് യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη (πορεύομαι)
  choice: പോയി
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ലളിതമായ സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്ന ഈ ഭൂതകാല ക്രിയയ്ക്ക് സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: ὄρος
  choice: മല
  rationale: ἐλαιῶν എന്ന ഭൂമിശാസ്ത്രനാമത്തോടു ചേർന്ന് മലയാളത്തിൽ പതിവായ ‘ഒലിവുമല’ എന്ന രൂപം നൽകുന്നു.
- source_word: ἐλαιῶν (ἐλαία)
  choice: ഒലിവ്
  rationale: ജനിറ്റീവ് ബഹുവചനം ഒലിവുമരങ്ങളുമായി ബന്ധപ്പെട്ട മലയെ സൂചിപ്പിക്കുന്നു; സ്ഥാപിതമായ സ്ഥലനാമമായി ‘ഒലിവുമല’ സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മറ്റുള്ളവർ വീടുകളിലേക്കു പോയതും യേശു ഒലിവുമലയിലേക്കു പോയതും തമ്മിലുള്ള മൃദുവായ വ്യത്യാസവും കഥയുടെ തുടർച്ചയും നിലനിർത്തുന്നു.
theological_decisions: []
