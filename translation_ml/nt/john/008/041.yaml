id: JHN.8.41
reference: John 8:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: ml
  text: 'നിങ്ങൾ നിങ്ങളുടെ പിതാവിന്റെ പ്രവൃത്തികളാണ് ചെയ്യുന്നത്.” അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾ ലൈംഗിക അധാർമികതയിൽനിന്ന് ജനിച്ചവരല്ല[a]; ഞങ്ങൾക്ക് ഒരേയൊരു പിതാവേയുള്ളൂ—ദൈവം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ അവിഹിതസന്തതികളല്ല.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “ഞങ്ങൾ ലൈംഗിക അധാർമികതയിൽനിന്ന് ജനിച്ചവരല്ല” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: ചെയ്യുന്നത്
  rationale: വർത്തമാനകാല ക്രിയയുടെ തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവർത്തനഭാവം മലയാളത്തിലെ ‘ആണ് ചെയ്യുന്നത്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: ἔργα എന്നതിന്റെ സാധാരണ അർഥവും യോഹന്നാനിലെ പദപ്രയോഗബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: നിങ്ങളുടെ പിതാവിന്റെ
  rationale: അക്ഷരാർഥവും ആത്മീയ ഉറവിടത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകാത്മക പിരിമുറുക്കവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ πορνείας
  choice: ലൈംഗിക അധാർമികതയിൽനിന്ന്
  rationale: πορνείαയുടെ വിശാലമായ അർഥം നിലനിർത്തുകയും ജനനവുമായി ചേർന്നുള്ള ഗ്രീക്ക് പ്രയോഗം അതിവ്യാഖ്യാനിക്കാതെ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ γεγεννήμεθα
  choice: ജനിച്ചവരല്ല
  rationale: ഗ്രീക്കിലെ perfect passive ജനനത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽ സ്വാഭാവികമായ ആധുനിക മലയാളമായി നൽകുന്നു.
- source_word: ἕνα πατέρα ἔχομεν
  choice: ഞങ്ങൾക്ക് ഒരേയൊരു പിതാവേയുള്ളൂ
  rationale: ἕνα ഊന്നിപ്പറയുന്ന ഏകത്വം ‘ഒരേയൊരു ... മാത്രമേയുള്ളൂ’ എന്ന മലയാളഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവം
  rationale: ‘പിതാവ്’ ആരാണെന്ന് വ്യക്തമാക്കുന്ന apposition ദീർഘരേഖയിലൂടെ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἐκ πορνείας οὐ γεγεννήμεθα എന്നത് നിയമവിരുദ്ധ ജനനത്തിന്റെ അവകാശവാദമായി പരസ്യമായി വ്യാഖ്യാനിക്കണമോ
  choice: ‘ഞങ്ങൾ ലൈംഗിക അധാർമികതയിൽനിന്ന് ജനിച്ചവരല്ല’ എന്ന ഉറവിടത്തോട് അടുത്ത പ്രസ്താവന മുഖ്യവാചകത്തിൽ നിലനിർത്തി
  alternative: ‘ഞങ്ങൾ അവിഹിതസന്തതികളല്ല’
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം അവിഹിതജനനം നിഷേധിക്കുന്നതായി സൂചിപ്പിക്കാമെങ്കിലും, അതിനെ മുഖ്യവാചകത്തിൽ പരസ്യമായി തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷയും വാദാത്മക പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. പിതൃത്വത്തെ സംബന്ധിച്ച രൂപകവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തിയിരിക്കുന്നു.
