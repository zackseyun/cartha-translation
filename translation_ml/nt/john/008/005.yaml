id: JHN.8.5
reference: John 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: ml
  text: '[a]നമ്മുടെ ന്യായപ്രമാണത്തിൽ ഇങ്ങനെയുള്ള സ്ത്രീകളെ കല്ലെറിയണമെന്ന് മോശ കല്പിച്ചിട്ടുണ്ട്. എന്നാൽ നീ എന്തു പറയുന്നു?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയുടെ കഥയുടെ തുടർച്ച (യോഹന്നാൻ 7:53–8:11). യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: τὰς τοιαύτας
  choice: ഇങ്ങനെയുള്ള സ്ത്രീകളെ
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ പ്രയോഗം സന്ദർഭത്തിൽ വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീകളെപ്പോലുള്ളവരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായും വ്യക്തമായും ഇത് പ്രകടിപ്പിക്കുന്നു.
- source_word: λιθοβολεῖσθαι
  choice: കല്ലെറിയണമെന്ന്
  rationale: കല്ലെറിഞ്ഞുള്ള ശിക്ഷയെ സൂചിപ്പിക്കുന്ന കർമണി അനന്തക്രിയയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മരണഫലം മൂലപാഠത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ലാത്തതിനാൽ ‘കൊല്ലണം’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: ἐνετείλατο
  choice: കല്പിച്ചിട്ടുണ്ട്
  rationale: മോശ നൽകിയ അധികാരപൂർവമായ നിയമകല്പനയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ aorist രൂപത്തിന്റെ മുൻകാല നടപടിയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിലെ ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്നതോടൊപ്പം മോശയുടെ കല്പനയും യേശുവിനോടുള്ള ചോദ്യവും ഉൾപ്പെടുന്ന വാദത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: σὺ οὖν τί λέγεις;
  choice: എന്നാൽ നീ എന്തു പറയുന്നു?
  rationale: οὖν എന്ന നിഗമനാത്മക ബന്ധവും σὺ എന്ന ഊന്നലും സ്വാഭാവിക മലയാള ചോദ്യരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മോശയുടെ ന്യായപ്രമാണം ഏതു വ്യക്തികൾക്ക് കല്ലെറിഞ്ഞുള്ള ശിക്ഷ നിർദേശിക്കുന്നു എന്ന നിയമപരമായ വിശദീകരണം
  choice: വക്താക്കളുടെ വാദം മൂലപാഠത്തിലുള്ളതുപോലെ ‘ഇങ്ങനെയുള്ള സ്ത്രീകളെ’ എന്നു നിലനിർത്തി
  alternative: ബന്ധപ്പെട്ട പുരുഷനും സ്ത്രീക്കും ബാധകമായ നിയമവ്യവസ്ഥയെ വിശദീകരിച്ച് വാക്യം വികസിപ്പിക്കുക
  rationale: ഈ വാക്യം കഥാപാത്രങ്ങളുടെ പ്രസ്താവനയാണ്; വിവർത്തനം അതിനെ തിരുത്തുകയോ മോശയുടെ നിയമത്തിലെ മറ്റു ഭാഗങ്ങളുമായി സമന്വയിപ്പിക്കാൻ അധികവിവരം ചേർക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം’, ‘കല്പിച്ചിട്ടുണ്ട്’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതന പദക്രമം ഒഴിവാക്കി.
