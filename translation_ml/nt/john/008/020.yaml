id: JHN.8.20
reference: John 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: ml
  text: ദൈവാലയത്തിൽ[a] ഉപദേശിച്ചുകൊണ്ടിരിക്കെ, അവൻ ഭണ്ഡാരസ്ഥലത്ത് ഈ വാക്കുകൾ പറഞ്ഞു. ആരും അവനെ പിടികൂടിയില്ല; കാരണം അവന്റെ നാഴിക ഇനിയും വന്നിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവാലയാങ്കണങ്ങളിൽ’; ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'യോഹന്നാനിൽ ‘അവന്റെ നാഴിക’ എന്നത് യേശുവിന്റെ നിർണായക കഷ്ടാനുഭവത്തിനും മഹത്ത്വീകരണത്തിനുമായി നിശ്ചയിക്കപ്പെട്ട സമയത്തെ സൂചിപ്പിക്കുന്നു. മറ്റൊരു പരിഭാഷ: ‘അവനുവേണ്ടി നിശ്ചയിക്കപ്പെട്ട സമയം.’'
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: ഈ വാക്കുകൾ
  rationale: ῥήματα ഇവിടെ തൊട്ടുമുമ്പുള്ള യേശുവിന്റെ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; ‘ഈ വാക്കുകൾ’ സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമാണ്.
- source_word: ἐλάλησεν
  choice: സംസാരിച്ചു
  rationale: λαλέω സംസാരിക്കുകയോ ഉച്ചരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഈ വാക്കുകൾ’ എന്നതിനോടൊപ്പം ‘സംസാരിച്ചു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: ഭണ്ഡാരസ്ഥലത്തുവെച്ച്
  rationale: γαζοφυλάκιον ദൈവാലയത്തിലെ ഭണ്ഡാരമേഖലയെ സൂചിപ്പിക്കാം; ഒറ്റ പെട്ടിയെന്ന ധാരണ ഒഴിവാക്കി സ്ഥലസൂചന വ്യക്തമാക്കുന്നു.
- source_word: διδάσκων
  choice: ഉപദേശിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തം മുഖ്യക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ സമയബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം അല്ല, ദൈവാലയസമുച്ചയം മുഴുവനെയും സൂചിപ്പിക്കുന്നു; പ്രധാനപാഠത്തിൽ പതിവായ രൂപം നിലനിർത്തി അടിക്കുറിപ്പിൽ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: ἐπίασεν
  choice: പിടിച്ചില്ല
  rationale: πιάζω പിടികൂടുക/കൈയടക്കുക എന്ന ശാരീരികവും വൈരപരവുമായ അർത്ഥം വഹിക്കുന്നു; നിയമപരമായ ‘അറസ്റ്റ്’ എന്ന സൂക്ഷ്മത അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὔπω ἐληλύθει
  choice: ഇനിയും വന്നിരുന്നില്ല
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ pluperfect രൂപം ആ ഘട്ടത്തിൽ സമയം എത്തിയിരുന്നില്ലെന്ന ആശയം നൽകുന്നു.
- source_word: ἡ ὥρα αὐτοῦ
  choice: അവന്റെ നാഴിക
  rationale: യോഹന്നാനിലെ ആവർത്തിതവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ ‘hour’ പ്രമേയം ‘സമയം’ എന്ന് പൊതുവാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ ‘അവന്റെ നാഴിക’ എന്ന പ്രയോഗം
  choice: പ്രധാനപാഠത്തിൽ ‘അവന്റെ നാഴിക’ നിലനിർത്തി.
  alternative: അവനുവേണ്ടി നിശ്ചയിക്കപ്പെട്ട സമയം / അവന്റെ സമയം
  rationale: യേശുവിന്റെ കഷ്ടാനുഭവവും മഹത്ത്വീകരണവും ഉൾക്കൊള്ളുന്ന നിർണായക ഘട്ടത്തെ യോഹന്നാൻ ‘നാഴിക’ എന്ന പ്രമേയത്തിലൂടെ അവതരിപ്പിക്കുന്നു. ‘നിശ്ചയിക്കപ്പെട്ട’ എന്ന് പ്രധാനപാഠത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തിൽ പരോക്ഷമായത് വ്യാഖ്യാനിച്ച് ചേർക്കും; ‘സമയം’ എന്നു മാത്രം പറയുന്നത് പ്രമേയത്തിന്റെ ഭാരം കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭണ്ഡാരസ്ഥലം’ ഒറ്റ കാണിക്കപ്പെട്ടിയേക്കാൾ വിശാലമായ ദൈവാലയഭണ്ഡാരമേഖലയെ സൂചിപ്പിക്കുന്നു. ‘നാഴിക’ യോഹന്നാന്റെ സവിശേഷ പ്രമേയം നിലനിർത്താൻ ഉപയോഗിച്ചു.
