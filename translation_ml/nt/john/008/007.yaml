  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: ml
  text: 'എന്നാൽ അവർ അവനോടു ചോദ്യംചെയ്തുകൊണ്ടേയിരുന്നപ്പോൾ[a], അവൻ നിവർന്ന് അവരോടു പറഞ്ഞു: “നിങ്ങളിൽ പാപമില്ലാത്തവൻ ആദ്യം അവളുടെ നേരെ കല്ലെറിയട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയുടെ കഥയുടെ ഭാഗമാണ് (യോഹന്നാൻ 7:53–8:11). ഈ ഭാഗം ആദ്യകാല ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ കാണുന്നില്ല. യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: ചോദിച്ചുകൊണ്ടുതന്നെ ഇരുന്നപ്പോൾ
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയയും വർത്തമാനകാല കൃദന്തരൂപവും ചേർന്ന് സൂചിപ്പിക്കുന്ന തുടർച്ചയും നിർബന്ധപൂർവമായ ചോദ്യംചെയ്യലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀνακύψας
  choice: നിവർന്നുനിന്ന്
  rationale: മുമ്പ് കുനിഞ്ഞിരുന്ന നിലയിൽനിന്ന് ശരീരം നിവർത്തിയ പ്രവൃത്തിയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀναμάρτητος
  choice: പാപമില്ലാത്തവൻ
  rationale: അപൂർവമായ ഗ്രീക്ക് വിശേഷണത്തിന്റെ ‘പാപമില്ലാത്ത’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘കുറ്റമില്ലാത്തവൻ’ എന്നതിനെക്കാൾ ഇതിലെ ധാർമിക വ്യാപ്തിയും നിയമപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: ആദ്യം അവളുടെമേൽ കല്ലെറിയട്ടെ
  rationale: ‘ആദ്യം’ എന്നതിന് ഗ്രീക്കിലുള്ള ഊന്നൽ നിലനിർത്തുകയും കല്ലെറിയൽ ആരംഭിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἀναμάρτητος എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: പാപമില്ലാത്തവൻ
  alternative: ഈ പ്രത്യേക പാപത്തിൽ കുറ്റമില്ലാത്തവൻ
  rationale: മൂലപദം പാപത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അത് വ്യഭിചാരപാപത്തിലേക്കു മാത്രം ചുരുക്കുന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഒരു വ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള പ്രസ്താവനയുടെ ശക്തിയും മൂലത്തിലെ ധാർമിക-നിയമപരമായ സംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
