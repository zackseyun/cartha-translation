  to: 'യേശു മറുപടി പറഞ്ഞു: “ഞാൻ എന്നെത്തന്നെ മഹത്ത്വപ്പെടുത്തിയാൽ, എന്റെ മഹത്ത്വം ഒന്നുമല്ല. എന്നെ മഹത്ത്വപ്പെടുത്തുന്നത്, നിങ്ങൾ ‘ഞങ്ങളുടെ ദൈവം’ എന്ന് പറയുന്ന എന്റെ പിതാവാണ്.[a]”'
