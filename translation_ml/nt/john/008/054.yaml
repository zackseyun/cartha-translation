id: JHN.8.54
reference: John 8:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “ഞാൻ എന്നെത്തന്നെ മഹത്ത്വപ്പെടുത്തിയാൽ, എന്റെ മഹത്ത്വം ഒന്നുമല്ല. എന്നെ മഹത്ത്വപ്പെടുത്തുന്നത്, നിങ്ങൾ ‘ഞങ്ങളുടെ ദൈവം’ എന്ന് പറയുന്ന എന്റെ പിതാവാണ്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഞങ്ങളുടെ ദൈവം” എന്നതിനുപകരം “നിങ്ങളുടെ ദൈവം” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: δοξάσω / δοξάζων
  choice: മഹത്ത്വപ്പെടുത്തിയാൽ / മഹത്ത്വപ്പെടുത്തുന്നത്
  rationale: യോഹന്നാനിലെ δόξα–δοξάζω പ്രമേയത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുകയും വെറും ആദരിക്കൽ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: എന്റെ മഹത്ത്വം ഒന്നുമല്ല
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള നിഷേധവാക്യം അടുത്തായി പിന്തുടരുന്ന, മലയാളത്തിൽ വ്യക്തമായ രൂപം.
- source_word: ὁ πατήρ μου ὁ δοξάζων με
  choice: എന്നെ മഹത്ത്വപ്പെടുത്തുന്നത് എന്റെ പിതാവാണ്
  rationale: നിശ്ചയാർഥക ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ വിവരണാത്മക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: ‘അവിടുന്ന് ഞങ്ങളുടെ ദൈവമാണ്’ എന്ന് നിങ്ങൾ പറയുന്ന ആ പിതാവ്
  rationale: ὃν എന്ന ബന്ധസർവനാമത്തിന്റെ മുൻപദം മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിച്ച്, ὅτι-വാക്യത്തെ സ്വാഭാവികമായ ഉദ്ധരണിരൂപത്തിൽ നൽകുന്നു; അടിസ്ഥാനപാഠത്തിലെ ἡμῶν അനുസരിച്ച് ‘ഞങ്ങളുടെ’ ഉപയോഗിക്കുന്നു.
- source_word: θεὸς
  choice: ദൈവം
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ഏകദൈവമാണ് സൂചിപ്പിക്കപ്പെടുന്നത്.
theological_decisions:
- issue: θεὸς ἡμῶν/ὑμῶν ἐστιν എന്നിടത്തെ സർവനാമ പാഠഭേദം
  choice: ഞങ്ങളുടെ ദൈവമാണ്
  alternative: നിങ്ങളുടെ ദൈവമാണ്
  rationale: നൽകിയ SBLGNT അടിസ്ഥാനപാഠത്തിലെ ἡμῶν പിന്തുടരുന്നു. തർക്കസന്ദർഭത്തിന്റെ സൂക്ഷ്മതയെ ബാധിക്കുന്ന ὑμῶν എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹത്ത്വം/മഹത്ത്വപ്പെടുത്തുക’ എന്ന പദകുടുംബം യോഹന്നാന്റെ ആവർത്തിത glory പ്രമേയം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
