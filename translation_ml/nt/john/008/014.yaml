id: JHN.8.14
reference: John 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “ഞാൻ എന്നെക്കുറിച്ചുതന്നെ സാക്ഷ്യം പറഞ്ഞാലും[a], എന്റെ സാക്ഷ്യം സത്യമാണ്. കാരണം, ഞാൻ എവിടെനിന്നു വന്നു എന്നും എവിടേക്കു പോകുന്നു എന്നും എനിക്കറിയാം. എന്നാൽ ഞാൻ എവിടെനിന്നു വരുന്നു എന്നോ എവിടേക്കു പോകുന്നു എന്നോ[b] നിങ്ങൾ അറിയുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെക്കുറിച്ചുതന്നെ സാക്ഷ്യം വഹിച്ചാലും.”
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “എവിടേക്കു പോകുന്നു എന്നോ” എന്നതിനുപകരം “എവിടേക്കു പോകുന്നു എന്നും” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: മറുപടി പറഞ്ഞു
  rationale: രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെയും സംയുക്തപ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘മറുപടി നൽകി പറഞ്ഞു’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: Κἂν
  choice: പറഞ്ഞാലും
  rationale: വാദത്തിനുവേണ്ടി ഒരു സാധ്യത സമ്മതിക്കുന്ന concessive ഭാവം മലയാളത്തിലെ ‘-ആലും’ രൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μαρτυρῶ
  choice: സാക്ഷ്യം പറഞ്ഞാലും
  rationale: യോഹന്നാനിലെ സാക്ഷി/സാക്ഷ്യം എന്ന നിയമസംബന്ധമായ അർഥനിഴൽ കാത്തുസൂക്ഷിക്കുന്നതോടൊപ്പം സാധാരണ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: περὶ ἐμαυτοῦ
  choice: എന്നെക്കുറിച്ചുതന്നെ
  rationale: περί + genitive എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നൽകുകയും ἐγώയുടെ ഊന്നൽ ‘തന്നെ’യിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘എനിക്കുവേണ്ടി’ എന്ന അധിക നിയമാർഥം ചേർക്കുന്നില്ല.
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: എന്റെ സാക്ഷ്യം സത്യമാണ്
  rationale: ‘സാധുവാണ്’ എന്നതിലേക്കു ചുരുക്കാതെ യോഹന്നാനിലെ സത്യം എന്ന ആശയവും പ്രസ്താവനയുടെ നേരിട്ടുള്ള രൂപവും നിലനിർത്തുന്നു.
- source_word: ὅτι οἶδα
  choice: കാരണം ... എനിക്കറിയാം
  rationale: ὅτιയുടെ കാരണസൂചകബന്ധവും οἶδαയുടെ അറിവിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള അവകാശവാദവും വ്യക്തമായി നൽകുന്നു.
- source_word: πόθεν ἦλθον
  choice: ഞാൻ എവിടെനിന്നു വന്നു
  rationale: aorist ἦλθον സൂചിപ്പിക്കുന്ന മുൻകാല വരവും ഉത്ഭവവും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ποῦ ὑπάγω
  choice: എവിടേക്കു പോകുന്നു
  rationale: ദിശയുള്ള ഇപ്പോഴത്തെ ഗമനം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: എന്നാൽ ... നിങ്ങൾ അറിയുന്നില്ല
  rationale: δέയുടെ വൈരുധ്യവും വ്യക്തമായി നൽകിയിരിക്കുന്ന ὑμεῖςയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: πόθεν ἔρχομαι
  choice: ഞാൻ എവിടെനിന്നു വരുന്നു
  rationale: ആദ്യ ഭാഗത്തിലെ aorist ἦλθον-നോട് വ്യത്യസ്തമായി ഇവിടത്തെ present ἔρχομαιയെ വർത്തമാനരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വസാക്ഷ്യത്തിന്റെ സ്വഭാവം
  choice: തന്റെ ഉത്ഭവവും ലക്ഷ്യവും തനിക്കറിയുന്നതിനാൽ തന്റെ സാക്ഷ്യം സത്യമാണെന്ന യേശുവിന്റെ അവകാശവാദം വാക്യം പറയുന്നതുപോലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
  alternative: സാക്ഷ്യത്തിന്റെ നിയമസാധുതയ്ക്ക് മാത്രം ഊന്നൽ നൽകുക, അല്ലെങ്കിൽ സ്വർഗീയ ഉത്ഭവം വിവർത്തനത്തിൽത്തന്നെ തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാക്യം ‘സത്യം’ എന്നും ‘എവിടെനിന്നു/എവിടേക്ക്’ എന്നും പറയുന്നു. വിശാലമായ യോഹന്നാനീയ ക്രിസ്തുശാസ്ത്രം സന്ദർഭത്തിൽനിന്ന് തെളിയാൻ അനുവദിച്ച്, ഇവിടെ വ്യക്തമാക്കാത്ത ദൈവശാസ്ത്ര വിശദീകരണം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘സാക്ഷ്യം’ എന്ന പദം യോഹന്നാനിലെ ആവർത്തിത സാക്ഷി-പ്രമേയം നിലനിർത്തുന്നു. ആദ്യത്തെ ἦλθον (‘വന്നു’) എന്ന ഭൂതകാലവും പിന്നീടുള്ള ἔρχομαι (‘വരുന്നു’) എന്ന വർത്തമാനകാലവും വേർതിരിച്ചിരിക്കുന്നു.
