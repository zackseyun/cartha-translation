  rationale: ഇവിടെ γῆ സമീപത്തെ ഭൂതലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘നിലത്ത്’ എന്നത് സാധാരണ മലയാളത്തിൽ കൃത്യവും സ്വാഭാവികവുമാണ്.
