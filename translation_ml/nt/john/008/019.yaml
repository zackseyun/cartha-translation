source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനോട്, “നിന്റെ പിതാവ് എവിടെയാണ്?” എന്നു ചോദിച്ചുകൊണ്ടിരുന്നു. യേശു ഉത്തരം പറഞ്ഞു: “നിങ്ങൾ എന്നെയോ എന്റെ പിതാവിനെയോ അറിയുന്നില്ല. നിങ്ങൾ എന്നെ അറിഞ്ഞിരുന്നെങ്കിൽ, എന്റെ പിതാവിനെയും അറിയുമായിരുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ ഔപചാരികമായി: “നിങ്ങൾ എന്നെ അറിഞ്ഞിട്ടുണ്ടായിരുന്നെങ്കിൽ, എന്റെ പിതാവിനെയും അറിഞ്ഞിട്ടുണ്ടാകുമായിരുന്നു.” ഗ്രീക്കിലെ വ്യവസ്ഥാവാക്യം യാഥാർഥ്യത്തിനു വിരുദ്ധമായ ഭാവം കൂടുതൽ ഊന്നി പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം നടന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നു. നേരിട്ടുള്ള വാക്കുകൾ ഒരു ചോദ്യമായതിനാൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിനെക്കാൾ ‘ചോദിച്ചുകൊണ്ടിരുന്നു’ സ്വാഭാവികമാണ്; എന്നാൽ ആവർത്തനത്തെ അമിതമായി ഊന്നുന്നില്ല.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: സംഭാഷണത്തിന്റെ തുടർച്ചയെയോ മുൻവാക്കിൽനിന്നുള്ള പ്രതികരണത്തെയോ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ എന്നത് ചില സന്ദർഭങ്ങളിൽ കാരണഫലബന്ധം അമിതമായി വ്യക്തമാക്കാം.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: നിന്റെ പിതാവ് എവിടെയാണ്?
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള ചോദ്യം നിലനിർത്തുന്നു. മലയാളലിപിയിൽ വലിയക്ഷരവ്യത്യാസമില്ലെങ്കിലും സന്ദർഭം ‘പിതാവ്’ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπεκρίθη
  choice: ഉത്തരം പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ സാധാരണ പ്രതികരണക്രിയയെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: നിങ്ങൾ എന്നെയോ എന്റെ പിതാവിനെയോ അറിയുന്നില്ല
  rationale: οὔτε…οὔτε എന്ന സമാന്തര നിഷേധം മലയാളത്തിലെ ‘-യോ…-യോ അറിയുന്നില്ല’ എന്ന സ്വാഭാവിക ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: οἶδατε / ᾔδειτε
  choice: അറിയുന്നില്ല / അറിഞ്ഞിരുന്നെങ്കിൽ / അറിയുമായിരുന്നു
  rationale: οἶδα എന്ന ക്രിയയിലെ അറിവ്, തിരിച്ചറിവ്, ബന്ധപരമായ പരിചയം എന്നീ സാധ്യതകൾ ചുരുക്കാതെ ‘അറിയുക’ നിലനിർത്തുന്നു; വ്യവസ്ഥാവാക്യത്തിൽ മലയാളത്തിലെ കാല-ഭാവരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: നിങ്ങൾ എന്നെ അറിഞ്ഞിരുന്നെങ്കിൽ, എന്റെ പിതാവിനെയും അറിയുമായിരുന്നു
  rationale: ഗ്രീക്കിലെ യാഥാർഥ്യത്തിനു വിരുദ്ധമായ വ്യവസ്ഥാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു. καί എന്നതിന്റെ ഉൾപ്പെടുത്തൽ ‘പിതാവിനെയും’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: ‘പിതാവ്’ ദൈവത്തെ സൂചിപ്പിക്കുന്നതാണോ എന്നത്
  choice: വാചകത്തിൽ ‘പിതാവ്’ എന്ന ബന്ധപദം അതേപടി നിലനിർത്തി
  alternative: ‘ദൈവമായ പിതാവ്’ എന്ന് വിശദീകരിക്കുക
  rationale: യോഹന്നാന്റെ സന്ദർഭം സൂചിപ്പിക്കുന്ന ദൈവിക പരാമർശം നിലനിൽക്കുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: യേശുവിനെയും പിതാവിനെയും ‘അറിയുക’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അറിയുക’
  alternative: ‘തിരിച്ചറിയുക’ അല്ലെങ്കിൽ ‘മനസ്സിലാക്കുക’
  rationale: യോഹന്നാനിലെ പദത്തിന്റെ ബൗദ്ധികവും ബന്ധപരവുമായ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: വ്യവസ്ഥാവാക്യത്തിന്റെ കാലവും യാഥാർഥ്യവിരുദ്ധതയും
  choice: ‘അറിഞ്ഞിരുന്നെങ്കിൽ … അറിയുമായിരുന്നു’
  alternative: ‘അറിഞ്ഞിട്ടുണ്ടായിരുന്നെങ്കിൽ … അറിഞ്ഞിട്ടുണ്ടാകുമായിരുന്നു’
  rationale: പ്രധാന പരിഭാഷ ഇപ്പോഴത്തെ യാഥാർഥ്യത്തിനു വിരുദ്ധമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ ഭൂതകാലാഭിമുഖമായ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു; ‘പിതാവ്’ എന്ന യോഹന്നാനീയ ബന്ധപദവും ‘അറിയുക’ എന്ന വിശാലമായ ആശയവും വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
