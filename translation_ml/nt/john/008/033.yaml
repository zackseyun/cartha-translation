id: JHN.8.33
reference: John 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: ml
  text: 'അവർ അവനോടു മറുപടി പറഞ്ഞു: “ഞങ്ങൾ അബ്രാഹാമിന്റെ സന്തതിയാണ്[a]; ഒരിക്കലും ആരുടെയും അടിമകളായിരുന്നിട്ടില്ല[b]. പിന്നെ, ‘നിങ്ങൾ സ്വതന്ത്രരായിത്തീരും’[c] എന്നു നീ പറയുന്നത് എങ്ങനെ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “അബ്രാഹാമിന്റെ വിത്ത്.” ഗ്രീക്കിൽ ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ഒരിക്കലും ആരെയും സേവിച്ചിട്ടില്ല.” ഈ ക്രിയയ്ക്ക് സേവിക്കുക എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ അടിമത്തം/ബന്ധനം എന്ന അർഥത്തിനാണ് കൂടുതൽ പ്രാധാന്യം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ “നിങ്ങൾ സ്വതന്ത്രരാകും.” ഗ്രീക്ക് കൂടുതൽ അക്ഷരാർഥത്തിൽ “നിങ്ങൾ സ്വതന്ത്രരായിത്തീരും” എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: അവർ അവനോടു മറുപടി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രതികരണത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Σπέρμα Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ സന്തതി
  rationale: σπέρμα ഇവിടെ ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടനാമമാണ്; ‘സന്തതി’ ആ കൂട്ടാർഥം നിലനിർത്തുന്നു.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: ഒരിക്കലും ആരുടെയും അടിമകളായിരുന്നിട്ടില്ല
  rationale: പൂർണകാലക്രിയയും πώποτε-യുടെ സമ്പൂർണ നിഷേധവും സ്വാഭാവികമായി പകരുന്നു; സ്വാതന്ത്ര്യം–അടിമത്തം എന്ന സന്ദർഭത്തിൽ ബന്ധനത്തിന്റെ അർഥമാണ് പ്രധാനമായത്.
- source_word: πῶς σὺ λέγεις
  choice: പിന്നെ ... എന്നു നീ പറയുന്നത് എങ്ങനെ?
  rationale: σὺ നൽകുന്ന ഊന്നലും ചോദ്യം പ്രകടിപ്പിക്കുന്ന അവിശ്വാസഭാവവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: നിങ്ങൾ സ്വതന്ത്രരായിത്തീരും
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റം ‘ആയിത്തീരും’ എന്നതിലൂടെ കൃത്യമായി നിലനിർത്തുന്നു; ἐλεύθεροι-യ്ക്ക് ‘സ്വതന്ത്രർ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: സ്വാതന്ത്ര്യം–ബന്ധനം എന്ന സന്ദർഭത്തിൽ δουλεύω-യുടെ പരിഭാഷ
  choice: അടിമകളായിരുന്നിട്ടില്ല
  alternative: സേവിച്ചിട്ടില്ല
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിലെ അടിമത്തവും സ്വാതന്ത്ര്യവും തമ്മിലുള്ള പ്രത്യക്ഷ വൈരുധ്യം കണക്കിലെടുത്ത്, ദുർബലമായ ‘സേവിക്കുക’ എന്നതിനുപകരം ബന്ധിതാവസ്ഥയുടെ ശക്തി നിലനിർത്തുന്നു.
- issue: Σπέρμα Ἀβραάμ എന്ന വംശാവകാശപ്രസ്താവന
  choice: അബ്രാഹാമിന്റെ സന്തതി
  alternative: അബ്രാഹാമിന്റെ വിത്ത് / അബ്രാഹാമിന്റെ വംശജർ
  rationale: ശാരീരിക വംശപരമ്പരയുടെ അവകാശവാദം മാത്രമാണ് ഇവിടെ വ്യക്തമാക്കുന്നത്; മറ്റിടങ്ങളിലെ ദൈവശാസ്ത്രപരമായ അർഥങ്ങൾ ഇറക്കുമതി ചെയ്യാതെ ഏകവചന കൂട്ടാർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വംശപരമ്പരയ്ക്കായി ‘സന്തതി’, ബന്ധിതാവസ്ഥയ്ക്കായി ‘അടിമ’, γίνομαι സൂചിപ്പിക്കുന്ന മാറ്റത്തിനായി ‘ആയിത്തീരും’ എന്നിവ ഉപയോഗിച്ചു.
