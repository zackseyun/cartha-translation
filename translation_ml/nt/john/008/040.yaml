  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, ദൈവത്തിൽനിന്ന് കേട്ട സത്യം നിങ്ങളോടു പറഞ്ഞിട്ടുള്ള ഒരു മനുഷ്യനായ എന്നെ കൊല്ലാൻ നിങ്ങൾ ശ്രമിക്കുന്നു. അബ്രാഹാം ഇത് ചെയ്തില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: δέയുടെ വൈരുധ്യഭാവവും νῦν എന്നതിന്റെ കാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: എന്നെ കൊല്ലാൻ നിങ്ങൾ ശ്രമിക്കുന്നു
  rationale: ζητέω + infinitive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യപൂർവമായ ശ്രമവും വർത്തമാനകാലത്തിന്റെ തുടരുന്ന ഭാവവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനായ എന്നെ
  rationale: യേശു തന്നെക്കുറിച്ച് ഉപയോഗിക്കുന്ന ἄνθρωπον എന്ന പദത്തിന്റെ വ്യക്തമായ മാനുഷിക അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ വാക്യഘടന സ്വാഭാവികമാക്കാൻ ‘എന്നെ’യോട് ചേർത്തിരിക്കുന്നു.
- source_word: τὴν ἀλήθειαν
  choice: സത്യം
  rationale: നിശ്ചിതമായ സത്യസന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ ഘടനയിൽ പ്രത്യേക നിർദേശപദം ആവശ്യമില്ല.
- source_word: ὑμῖν λελάληκα
  choice: നിങ്ങളോടു പറഞ്ഞ
  rationale: perfect രൂപത്തിന്റെ പൂർത്തിയായിട്ടും ഇപ്പോഴും പ്രസക്തമായ സംസാരപ്രവൃത്തി സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്ന് കേട്ട
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടത്തെ ‘ദൈവത്തിൽനിന്ന്’ എന്നു കൃത്യമായി നൽകുന്നു; ‘പിതാവിൽനിന്ന്’ എന്ന കൂടുതൽ പ്രത്യേകമായ ശീർഷകം ചേർക്കുന്നില്ല.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: അബ്രാഹാം ഇങ്ങനെ ചെയ്തില്ല
  rationale: അബ്രാഹാമിന്റെ പ്രവൃത്തിയുമായുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; τοῦτο ഇവിടെ മുമ്പ് വിവരിച്ച പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ സ്വയംവിവരണത്തിലെ ἄνθρωπον
  choice: ഒരു മനുഷ്യനായ എന്നെ
  alternative: ഒരു മനുഷ്യജീവിയായ എന്നെ
  rationale: മൂലപദത്തിന്റെ സാധാരണ അർഥവും യേശുവിന്റെ മനുഷ്യത്വത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രസ്താവനയും നിലനിർത്തുന്നു; ദൈവത്വത്തെ കുറയ്ക്കുകയോ ഇവിടെ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- issue: παρὰ τοῦ θεοῦ എന്നതിലെ സന്ദേശത്തിന്റെ ഉറവിടം
  choice: ദൈവത്തിൽനിന്ന്
  alternative: പിതാവിൽനിന്ന്
  rationale: ഗ്രീക്ക് പാഠത്തിൽ θεός ആണ് ഉള്ളത്, πατήρ അല്ല; അതിനാൽ കൂടുതൽ പ്രത്യേകമായ ദൈവശാസ്ത്രപരമായ ശീർഷകം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ വൈരുധ്യം, വർത്തമാനകാല ശ്രമം, യേശുവിന്റെ മാനുഷിക സ്വയംവിവരണം എന്നിവ വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
