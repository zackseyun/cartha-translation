source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: ml
  text: അതിനാൽ അവർ കല്ലുകൾ അവന്റെ നേരെ എറിയാൻ എടുത്തു. എന്നാൽ യേശു മറഞ്ഞ് ദേവാലയത്തിൽനിന്ന്[a] പുറത്തുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ കൃത്യമായി, ‘ദേവാലയപരിസരത്തിൽനിന്ന്’ അഥവാ ‘ദേവാലയാങ്കണങ്ങളിൽനിന്ന്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ἱερόν ആണ്; അത് അകത്തെ വിശുദ്ധമന്ദിരത്തെയല്ല, മുഴുവൻ ദേവാലയപരിസരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: എടുത്തു
  rationale: αἴρω ഇവിടെ എറിയാനായി കല്ലുകൾ കൈയിലെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘എടുത്തു’ സ്വാഭാവികവും സന്ദർഭത്തിലെ ശത്രുതാപരമായ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നതുമാണ്.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തോടുള്ള ഫലപരമായോ നിഗമനപരമായോ ബന്ധം നിലനിർത്തുന്നു.
- source_word: λίθους
  choice: കല്ലുകൾ
  rationale: കല്ലെറിയാനുള്ള ശ്രമത്തിന്റെ സന്ദർഭത്തിൽ λίθος എന്ന പദത്തിന്റെ സാധാരണയും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: അവനെ എറിയാൻ
  rationale: ἵνα സഹിതമുള്ള വിധേയക്രിയ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയാനാമരൂപം ഉപയോഗിക്കുന്നത് സ്വാഭാവികമാണ്. ‘അവനെ എറിയാൻ’ എന്നത് കല്ലുകൾ അവന്റെ നേരെ എറിയുക എന്ന അർഥം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκρύβη
  choice: മറഞ്ഞ്
  rationale: രൂപത്തിൽ കർമണിയായിരുന്നാലും ഇവിടെ മധ്യമാർഥത്തിൽ ‘സ്വയം മറഞ്ഞു’ എന്നാണ് സ്വാഭാവിക അർഥം; അജ്ഞാതനായ മറ്റൊരാൾ യേശുവിനെ ഒളിപ്പിച്ചു എന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറത്തുപോയി
  rationale: ἐξέρχομαι സൂചിപ്പിക്കുന്ന പുറത്തേക്കുള്ള സഞ്ചാരം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: ദേവാലയത്തിൽനിന്ന്
  rationale: വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ പൊതുവായ ‘ദേവാലയം’ ഉപയോഗിക്കുന്നു; ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെയല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യേശു അവിടെനിന്ന് രക്ഷപ്പെട്ടതിന്റെ സ്വഭാവം
  choice: യേശു മറഞ്ഞ് പുറത്തുപോയി എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: യേശു അത്ഭുതകരമായി അവരുടെ നടുവിലൂടെ കടന്നുപോയി, അല്ലെങ്കിൽ അദൃശ്യനായി എന്നു ചേർക്കുക.
  rationale: SBLGNT പാഠം യേശു മറഞ്ഞ് ദേവാലയത്തിൽനിന്ന് പുറത്തുപോയി എന്നു മാത്രമാണ് പറയുന്നത്. പിന്നീടുള്ള ചില കൈയെഴുത്തുപ്രതി പാരമ്പര്യങ്ങളിലെ വിപുലീകരണങ്ങൾ ഇവിടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്നാൽ’ δέയുടെ വൈരുധ്യബന്ധം സ്വാഭാവികമായി നൽകുന്നു. മുഖ്യപാഠം സാധാരണ വായനക്കാർക്ക് സുഗമമാക്കി, ἱερόν എന്ന പദത്തിന്റെ സാങ്കേതിക കൃത്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
