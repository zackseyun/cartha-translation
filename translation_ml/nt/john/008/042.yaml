- from: 'യേശു അവരോടു പറഞ്ഞു: “ദൈവം നിങ്ങളുടെ പിതാവായിരുന്നെങ്കിൽ നിങ്ങൾ എന്നെ സ്നേഹിക്കുമായിരുന്നു; കാരണം ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന് ഇവിടെ ഇരിക്കുന്നു.[a] ഞാൻ സ്വയം വന്നതല്ല;[b] അവിടുന്നാണ് എന്നെ അയച്ചത്.”'
  to: 'യേശു അവരോടു പറഞ്ഞു: “ദൈവം നിങ്ങളുടെ പിതാവായിരുന്നെങ്കിൽ നിങ്ങൾ എന്നെ സ്നേഹിക്കുമായിരുന്നു; കാരണം ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ട് വന്നിരിക്കുന്നു.[a] ഞാൻ സ്വയം വന്നതല്ല;[b] മറിച്ച് അവിടുന്നാണ് എന്നെ അയച്ചത്.”'
