reference: John 8:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “ദൈവം നിങ്ങളുടെ പിതാവായിരുന്നെങ്കിൽ നിങ്ങൾ എന്നെ സ്നേഹിക്കുമായിരുന്നു; കാരണം ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ട് വന്നിരിക്കുന്നു.[a] ഞാൻ സ്വയം വന്നതല്ല;[b] മറിച്ച് അവിടുന്നാണ് എന്നെ അയച്ചത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ട് വന്നിരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ഞാൻ എന്റെ സ്വന്തം മുൻകൈയിൽ വന്നതല്ല.” ഗ്രീക്ക് പ്രയോഗം സ്വന്തം ഉറവിടത്തെയോ സ്വതന്ത്ര മുൻകൈയെയോ ഊന്നിക്കാട്ടാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: ദൈവം നിങ്ങളുടെ പിതാവായിരുന്നെങ്കിൽ നിങ്ങൾ എന്നെ സ്നേഹിക്കുമായിരുന്നു
  rationale: ഗ്രീക്കിലെ യാഥാർഥ്യവിരുദ്ധ ഉപാധിയെ മലയാളത്തിൽ ‘ആയിരുന്നെങ്കിൽ ... സ്നേഹിക്കുമായിരുന്നു’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐγὼ γὰρ
  choice: കാരണം ഞാൻ
  rationale: γάρ ഇവിടെ മുൻവാക്യത്തിന് കാരണം നൽകുന്നതിനാൽ ആ വാദബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: ഞാൻ ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന് ഇവിടെ ഇരിക്കുന്നു
  rationale: ἐξῆλθον എന്നതിലെ ഉറവിടത്തിൽനിന്നുള്ള പുറപ്പെടലും ἥκω എന്നതിലെ എത്തിച്ചേർന്നുള്ള ഇപ്പോഴത്തെ സാന്നിധ്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട സാങ്കേതിക ദൈവശാസ്ത്രപദം ചുമത്തുന്നില്ല.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: ഞാൻ സ്വയം വന്നതല്ല
  rationale: ἀπ’ ἐμαυτοῦ എന്നത് സ്വയമൂലത്തെയോ സ്വതന്ത്ര മുൻകൈയെയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ഈ പ്രയോഗം സ്വാഭാവികമായി രണ്ടിനും ഇടം നൽകുന്നു.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: അവിടുന്നാണ് എന്നെ അയച്ചത്
  rationale: ἐκεῖνος എന്നതിന്റെ ഊന്നൽ ‘ആണ്’ വഴി സൂചിപ്പിക്കുകയും ദൈവത്തെ സൂചിപ്പിക്കുന്ന മാന്യമായ സർവനാമം ഉപയോഗിക്കുകയും ἀπέστειλεν എന്ന ദൗത്യഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ ദൈവത്തിൽനിന്നുള്ള ഉത്ഭവവും വരവും എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ദൈവത്തിൽനിന്ന് പുറപ്പെട്ടുവന്ന് ഇവിടെ ഇരിക്കുന്നു
  alternative: ദൈവത്തിൽനിന്ന് വന്നു; ഇപ്പോൾ ഇവിടെ ഇരിക്കുന്നു
  rationale: വാക്യം യേശുവിന്റെ ദൈവിക ഉറവിടവും അയക്കപ്പെട്ട ദൗത്യവും ഉറപ്പിക്കുന്നു. ‘പുറപ്പെട്ടുവന്ന്’ ἐξῆλθον എന്നതിന്റെ ശക്തി നിലനിർത്തുമ്പോഴും പിൽക്കാല വിശ്വാസപ്രമാണങ്ങളിലെ സാങ്കേതിക അർഥം നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: ἀπ’ ἐμαυτοῦ എന്നതിലെ ഉറവിടം–സ്വതന്ത്ര മുൻകൈ ദ്വയാർഥത
  choice: ഞാൻ സ്വയം വന്നതല്ല
  alternative: ഞാൻ എന്റെ സ്വന്തം മുൻകൈയിൽ വന്നതല്ല
  rationale: മുഖ്യവാചകം ഗ്രീക്കിലെ യഥാർഥ ദ്വയാർഥത നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ സ്വതന്ത്ര മുൻകൈ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗമാണ്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
