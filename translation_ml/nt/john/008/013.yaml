id: JHN.8.13
reference: John 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: ml
  text: 'അതിനാൽ പരീശന്മാർ അവനോട് പറഞ്ഞു: “നീ നിന്നെക്കുറിച്ചുതന്നെ സാക്ഷ്യം പറയുന്നു; നിന്റെ സാക്ഷ്യം സത്യമല്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ സാക്ഷ്യം സാധുവല്ല.” ഗ്രീക്കിൽ അക്ഷരാർഥം “സത്യമല്ല” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അതിന് നിയമപരമായി സാധുവല്ല എന്ന ധ്വനിയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ പ്രസ്താവനയോടുള്ള യുക്തിപരവും ആഖ്യാനപരവുമായ പ്രതികരണം സൂചിപ്പിക്കുന്നു.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: പരീശന്മാർ അവനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കർത്താവ്, ക്രിയ, പരോക്ഷകർമം എന്നിവ സ്വാഭാവികമായ മലയാള വാക്യക്രമത്തിൽ നൽകുന്നു; αὐτῷ എന്ന സർവനാമം നിലനിർത്തുന്നു.
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: നീ നിന്നെക്കുറിച്ചുതന്നെ സാക്ഷ്യം പറയുന്നു
  rationale: പ്രകടമായ Σὺ എന്ന സർവനാമത്തിന്റെയും σεαυτοῦ എന്ന ആത്മവാചക സർവനാമത്തിന്റെയും ഊന്നൽ ‘നീ ... തന്നേ’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു; വർത്തമാനകാലവും സാക്ഷ്യത്തിന്റെ നിയമപരമായ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: ἡ μαρτυρία σου
  choice: നിന്റെ സാക്ഷ്യം
  rationale: μαρτυρεῖς എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും തെളിവ്/സാക്ഷ്യം എന്ന ആശയം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἔστιν ἀληθής
  choice: സത്യമല്ല
  rationale: ἀληθής എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം നൽകുന്നു; ഈ സന്ദർഭത്തിൽ ഉണ്ടാകാവുന്ന ‘സാധുവല്ല’ എന്ന നിയമപരമായ ധ്വനി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിലെ അർത്ഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സ്വയം നൽകിയ സാക്ഷ്യത്തെക്കുറിച്ചുള്ള പരീശന്മാരുടെ എതിർപ്പിന്റെ സ്വഭാവം
  choice: നിന്റെ സാക്ഷ്യം സത്യമല്ല
  alternative: നിന്റെ സാക്ഷ്യം സാധുവല്ല
  rationale: സംഭാഷണത്തിന് നിയമപരമായ പശ്ചാത്തലമുണ്ടെങ്കിലും ἀληθής എന്ന പദം നിയമസാധുതയിൽ മാത്രം ഒതുങ്ങുന്നില്ല. ‘സത്യമല്ല’ എന്നത് സത്യാവകാശവും നിയമപരമായ സാധുതയും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘സാക്ഷ്യം പറയുന്നു’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിലെ സാക്ഷ്യ/തെളിവ് പദബന്ധം സൂക്ഷിക്കുന്നതുമാണ്.
