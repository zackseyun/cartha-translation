  rationale: ആരംഭത്തിലെ ഇരട്ട ഉറപ്പിക്കൽ സമാന്തരവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായി മാറ്റി; ഉറവിടത്തിലെ ലിംഗനിരപേക്ഷമായ അനിശ്ചിതവിഷയത്തെ പുരുഷലിംഗ സൂചനയാക്കാതെ, ഫലവാക്യത്തിലെ അനാവശ്യ സർവനാമം ഒഴിവാക്കി. മരണത്തെക്കുറിച്ചുള്ള വാക്കുകളുടെ വ്യാഖ്യാനതുറപ്പ് നിലനിർത്തിയിരിക്കുന്നു.
