    rationale: The pair “സത്യം, സത്യമായി” changes the parallel Greek repetition into two different forms. “തീർച്ചയായും, തീർച്ചയായും” preserves the doubled emphatic formula in natural modern Malayalam.
  - severity: low
    issue: Gendered supplied pronoun “അയാൾ”
    rationale: The Greek τις is indefinite and gender-inclusive. “അയാൾ” is commonly masculine in modern Malayalam. Omitting the pronoun is natural and avoids adding gender.
