id: JHN.8.51
reference: John 8:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ml
  text: 'തീർച്ചയായും, തീർച്ചയായും, ഞാൻ നിങ്ങളോടു പറയുന്നു: ആരെങ്കിലും എന്റെ വചനം പാലിച്ചാൽ, ഒരിക്കലും മരണം കാണുകയില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘എന്നേക്കും മരണം കാണുകയില്ല.’ ഗ്രീക്ക് വാക്യം അതിശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു.'
    reason: εἰς τὸν αἰῶνα എന്ന കാലപ്രയോഗവും οὐ μή എന്ന ശക്തമായ നിഷേധവും വ്യക്തമാക്കുന്നു; മുഖ്യവാചകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യോഹന്നാനിലെ യേശുവിന്റെ ഇരട്ട ഉറപ്പിക്കൽ നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം നൽകുന്നു.
- source_word: τὸν ἐμὸν λόγον
  choice: എന്റെ വചനം
  rationale: λόγος ഇവിടെ യേശുവിന്റെ സന്ദേശമോ ഉപദേശമോ സൂചിപ്പിക്കുന്നു; പരിചിതമായ ‘വചനം’ എന്ന പദം അർത്ഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τηρήσῃ
  choice: പാലിച്ചാൽ
  rationale: ശ്രദ്ധയോടെ കാത്തുസൂക്ഷിക്കുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന ആശയം സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θάνατον ... θεωρήσῃ
  choice: മരണം കാണുകയില്ല
  rationale: മരണത്തെ അനുഭവിക്കുക എന്ന അർത്ഥമുള്ള ഉറവിടത്തിലെ ദൃശ്യരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: ശക്തമായ ഗ്രീക്ക് നിഷേധവും ‘എന്നേക്കും’ എന്ന കാലപ്രയോഗവും മലയാളത്തിലെ സ്വാഭാവികമായ സമ്പൂർണ നിഷേധത്തിലൂടെ ഒരുമിച്ച് അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘മരണം കാണുകയില്ല’ എന്ന വാഗ്ദാനത്തിന്റെ സ്വഭാവം
  choice: രൂപകം വിശദീകരിക്കാതെ ഉറവിടത്തിലെ വാക്കുകൾ നിലനിർത്തി
  alternative: ‘ആത്മീയമരണം അനുഭവിക്കുകയില്ല’ അല്ലെങ്കിൽ ‘നിത്യമായി മരിക്കുകയില്ല’
  rationale: വാക്യം ശാരീരിക മരണവും നിത്യജീവനും തമ്മിലുള്ള യോഹന്നാനീയ സംഘർഷം സ്വയം വിശദീകരിക്കുന്നില്ല; ഒരു പ്രത്യേക വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ മൂലത്തിലെ അർത്ഥതുറപ്പ് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അയാൾ’ ലിംഗനിരപേക്ഷമായ ഏകവചന സൂചനയായി ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ദൃഢമായ പ്രഖ്യാപനശൈലി സംരക്ഷിച്ചു.
