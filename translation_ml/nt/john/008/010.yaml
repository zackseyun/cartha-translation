  rationale: 'The revision preserves the Byzantine Greek source and the English audit trail while more closely representing the Greek participles: Jesus “straightened up” and, “seeing no one except the woman,” spoke to her. The legal sense of κατακρίνω and the respectful, non-pejorative force of “സ്ത്രീയേ” are retained. The existing textual-critical note remains necessary and requires no change.'
