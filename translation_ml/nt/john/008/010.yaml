source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: ml
  text: 'പിന്നെ യേശു[a] നിവർന്ന്, സ്ത്രീയെയല്ലാതെ മറ്റാരെയും കാണാതെ, അവളോടു പറഞ്ഞു: “സ്ത്രീയേ, നിന്നെ കുറ്റം ചുമത്തിയവർ എവിടെയുണ്ട്? ആരും നിന്നെ കുറ്റക്കാരിയെന്നു വിധിച്ചില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള വിവരണത്തിന്റെ (യോഹന്നാൻ 7:53–8:11) ഭാഗമാണ് ഈ വാക്യം. ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ഈ ഭാഗം കാണുന്നില്ല. യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: നിവർന്നുനിന്ന്
  rationale: മുൻവാക്യങ്ങളിൽ നിലത്ത് എഴുതാൻ കുനിഞ്ഞിരുന്ന യേശു ശരീരം നിവർത്തിയതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θεασάμενος
  choice: കാണാതിരുന്നപ്പോൾ
  rationale: ജനക്കൂട്ടം പോയിക്കഴിഞ്ഞതായി യേശു ദൃശ്യമായി മനസ്സിലാക്കിയെന്ന ലളിതമായ അർഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: κατήγοροί
  choice: കുറ്റാരോപകർ
  rationale: നിയമപരമോ അർധനിയമപരമോ ആയ സാഹചര്യത്തിൽ അവൾക്കെതിരെ കുറ്റം ചുമത്തിയവരെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: κατέκρινεν
  choice: കുറ്റക്കാരിയെന്നു വിധിച്ചില്ലേ
  rationale: വെറും വിലയിരുത്തലല്ല, കുറ്റം ഉറപ്പിച്ച് പ്രതികൂലവിധി പ്രസ്താവിക്കുന്ന നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാൻ 7:53–8:11-ന്റെ പാഠചരിത്രം
  choice: വാക്യം മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്ത് [a] എന്ന പാഠവിമർശന കുറിപ്പ് ചേർത്തു.
  alternative: ആദ്യകാല ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ഇല്ലാത്തതിനാൽ ഭാഗം മുഖ്യപാഠത്തിൽ നിന്ന് ഒഴിവാക്കുക അല്ലെങ്കിൽ കോഷ്ഠകത്തിൽ മാത്രം നൽകുക.
  rationale: നൽകിയിരിക്കുന്ന ബൈസന്റൈൻ ഗ്രീക്ക് സ്രോതസ്സിൽ വാക്യം ഉള്ളതിനാൽ അത് വിവർത്തനം ചെയ്യുന്നു; അതേസമയം പ്രധാനപ്പെട്ട കൈയെഴുത്തുപ്രതി തെളിവ് വായനക്കാരിൽ നിന്ന് മറയ്ക്കാതെ കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്ത്രീയേ’ എന്ന സംബോധന ഗ്രീക്ക് Ἡ γυνήയുടെ നേരിട്ടുള്ളതും സന്ദർഭത്തിൽ അപമാനകരമല്ലാത്തതുമായ രൂപമായി നിലനിർത്തി; നിയമപരമായ ഭാവം വ്യക്തമാക്കാൻ ‘കുറ്റാരോപകർ’, ‘കുറ്റക്കാരിയെന്നു വിധിക്കുക’ എന്നിവ ഉപയോഗിച്ചു.
