id: JHN.8.34
reference: John 8:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: ml
  text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: പാപം ചെയ്യുന്ന ഏവനും പാപത്തിന്റെ അടിമയാണ്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോടു മറുപടി പറഞ്ഞു
  rationale: സംഭാഷണത്തിലെ പ്രതികരണഭാവം നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യം, സത്യമായി
  rationale: യോഹന്നാനിലെ സവിശേഷമായ ഇരട്ട ഉറപ്പുവാക്യത്തിന്റെ ആവർത്തനവും ഗൗരവവും വായനക്കാർക്കു വ്യക്തമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: മൂലത്തിലെ വർത്തമാനകാല പ്രഖ്യാപനസൂത്രത്തെ അടുത്തും സ്വാഭാവികവുമായി പകർന്നു നൽകുന്നു.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന ഏവനും
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായോ സ്വഭാവപരമായോ ഉള്ള പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ഒറ്റപ്പെട്ട ഒരു പ്രവൃത്തിയെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: പാപത്തിന്റെ അധീനതയും ബന്ധനവും കേന്ദ്രമായതിനാൽ സേവകൻ എന്നതിനെക്കാൾ ശക്തമായി മൂലരൂപകത്തെ നിലനിർത്തുന്നു.
- source_word: τῆς ἁμαρτίας
  choice: പാപത്തിന്റെ
  rationale: ജനിറ്റീവ് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പകർന്നു, പാപത്തിന്റെ ഉടമസ്ഥതയിലോ അധീനതയിലോ ഉള്ളവൻ എന്ന രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പാപപ്രവൃത്തിയുടെ സ്വഭാവവും അതിന്റെ അടിമത്തവും
  choice: “പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന ഏവനും പാപത്തിന്റെ അടിമയാണ്” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: “പാപം ചെയ്യുന്ന ഏവനും പാപത്തിന്റെ അടിമയാണ്”
  rationale: ποιῶν എന്ന വർത്തമാനകാല കൃദന്തം സന്ദർഭത്തിൽ തുടർച്ചയായോ സ്വഭാവപരമായോ ഉള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കാം. “ചെയ്തുകൊണ്ടിരിക്കുന്ന” എന്നത് ആ ഭാവം പ്രകടമാക്കുന്നു; അതേസമയം എല്ലാ ഒറ്റപ്പെട്ട പ്രവൃത്തികളെയും കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തവാക്യമായി വാചകത്തെ അതിവ്യാഖ്യാനിക്കുന്നില്ല. “അടിമ” ബന്ധനരൂപകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാന്റെ ഇരട്ട ഉറപ്പുവാക്യത്തിലെ ആവർത്തനം നിലനിർത്തി; പാപത്തിന്റെ അധീനത വ്യക്തമാക്കാൻ ‘അടിമ’ ഉപയോഗിച്ചു.
