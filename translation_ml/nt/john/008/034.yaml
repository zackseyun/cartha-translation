revisions:
- from: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “സത്യം, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന ഏവനും പാപത്തിന്റെ അടിമയാണ്.[a]”'
  to: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: പാപം ചെയ്യുന്ന ഏവനും പാപത്തിന്റെ അടിമയാണ്.”'
  rationale: The revision preserves the source’s emphatic double affirmation with matching Malayalam repetition and uses a more idiomatic rendering of the present participle. The generic present “പാപം ചെയ്യുന്ന” adequately preserves the characteristic-practice sense in context without making the wording unnecessarily cumbersome. Since the revised text does not require a lexical-alternative note for comprehension or fidelity, the former footnote anchor and note are removed.
