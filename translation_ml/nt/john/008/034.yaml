review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the responsive verb, the doubled solemn affirmation, the present participial description of sinning, and the metaphor of bondage. However, the mixed form “സത്യം, സത്യമായി” does not preserve the Greek repetition in a balanced Malayalam form.
  naturalness: “പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന” is understandable but somewhat heavy in modern Malayalam. “പാപം ചെയ്യുന്ന” is natural and, in this generic articular-present construction, can convey habitual or characteristic conduct without asserting uninterrupted action.
  terminology: “അടിമ” appropriately retains the force of δοῦλος in this context, where enslavement to sin is the central metaphor. “പാപത്തിന്റെ അടിമ” is clear and idiomatic.
  issues:
  - severity: low
    issue: 'The doubled affirmation is rendered with two different forms: “സത്യം, സത്യമായി.”'
    rationale: Ἀμὴν ἀμὴν is deliberately repeated. “സത്യമായി, സത്യമായി” retains both the repetition and a natural solemn Malayalam register.
  - severity: low
    issue: “പാപം ചെയ്തുകൊണ്ടിരിക്കുന്ന” can suggest an explicitly continuous action more strongly than required.
    rationale: The present participle supports a characteristic or ongoing sense, but “പാപം ചെയ്യുന്ന” expresses this naturally in Malayalam while avoiding undue emphasis on continuous action.
  revised_text: 'യേശു അവരോടു മറുപടി പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: പാപം ചെയ്യുന്ന ഏവനും പാപത്തിന്റെ അടിമയാണ്.”'
