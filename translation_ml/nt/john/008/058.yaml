source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: ml
  text: 'യേശു അവരോടു പറഞ്ഞു: “സത്യമായി, സത്യമായി ഞാൻ നിങ്ങളോടു പറയുന്നു: അബ്രാഹാം ഉണ്ടാകുന്നതിനുമുമ്പ്[a], ഞാൻ ആകുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അബ്രാഹാം ജനിക്കുന്നതിനുമുമ്പ്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അതിലും വിശാലമായി “ഉണ്ടാകുക” അഥവാ “അസ്തിത്വത്തിലേക്കു വരുക” എന്നർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഞാൻ ഉണ്ടായിട്ടുണ്ട്.” എന്നാൽ ഗ്രീക്കിൽ വർത്തമാനകാലരൂപമായ “ഞാൻ ആകുന്നു” എന്നാണ്; അതിന്റെ സാധ്യതയുള്ള ദൈവശാസ്ത്രപരമായ അനുരണനവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: യേശു അവരോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് ആഖ്യാനവാക്യത്തിന്റെ പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി, അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἀμὴν ἀμὴν
  choice: സത്യമായി, സത്യമായി
  rationale: ഇരട്ടിച്ചുള്ള ഊന്നലും ഗൗരവമുള്ള പ്രഖ്യാപനശൈലിയും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആമേൻ, ആമേൻ’ എന്ന ലിപ്യന്തരണം അർഥം കുറച്ച് മറയ്ക്കാം.
- source_word: λέγω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറയുന്നു
  rationale: യോഹന്നാനിലെ ആവർത്തിതവും ഗൗരവപൂർണവുമായ നേരിട്ടുള്ള അഭിസംബോധനയെ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: πρὶν
  choice: മുമ്പ്
  rationale: തുടർന്നുവരുന്ന ക്രിയാസംജ്ഞയോടു ചേർന്ന് കാലപരമായ മുൻഗണന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἀβραὰμ
  choice: അബ്രാഹാം
  rationale: മലയാളത്തിൽ സ്ഥിരപ്രചാരമുള്ള വ്യക്തിനാമരൂപം.
- source_word: γενέσθαι
  choice: ഉണ്ടായിത്തീരുന്നതിന്
  rationale: γίνομαι എന്ന ക്രിയയുടെ വിശാലമായ ‘ഉണ്ടായിത്തീരുക/അസ്തിത്വത്തിലേക്കു വരുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘ജനിക്കുന്നതിന്’ എന്ന് പരിഭാഷപ്പെടുത്തി ശാരീരിക ജനനത്തിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐγὼ εἰμί
  choice: ഞാൻ ആകുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലവും അസാധാരണമായ സമ്പൂർണ പ്രസ്താവനാഭാവവും നേരിട്ട് നിലനിർത്തുന്നു; ‘ഞാൻ ഉണ്ടായിട്ടുണ്ട്’ എന്നാക്കി കാലാർഥം മിനുക്കി മാറ്റുന്നില്ല.
theological_decisions:
- issue: ക്രിസ്തുശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള ἐγὼ εἰμί എന്ന പ്രയോഗം
  choice: ഞാൻ ആകുന്നു
  alternative: ഞാൻ ഉണ്ടായിട്ടുണ്ട് / ഞാൻ നിലനിന്നിരുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ഗ്രീക്ക് രൂപവും അതിന്റെ ദൈവിക സ്വയംവെളിപ്പെടുത്തലുമായുള്ള സാധ്യതയുള്ള അനുരണനവും വായനക്കാരന് കാണാവുന്നവിധം നിലനിർത്തുന്നു. അതിനെ കേവലം മുൻഅസ്തിത്വത്തിന്റെ പ്രസ്താവനയായി ചുരുക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. യോഹന്നാനിലെ ഔപചാരിക പ്രഖ്യാപനഭാവം നിലനിർത്താൻ ‘സത്യമായി, സത്യമായി’ എന്നും ‘ഞാൻ ആകുന്നു’ എന്നും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന വാക്കുകൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
