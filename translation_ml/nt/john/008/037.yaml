source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: ml
  text: നിങ്ങൾ അബ്രാഹാമിന്റെ സന്തതിയാണെന്ന്[a] എനിക്കറിയാം. എന്നിട്ടും നിങ്ങൾ എന്നെ കൊല്ലാൻ ശ്രമിക്കുന്നു; കാരണം എന്റെ വചനത്തിന് നിങ്ങളിൽ ഇടം ലഭിക്കുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അബ്രാഹാമിന്റെ ബീജം’ അല്ലെങ്കിൽ ‘അബ്രാഹാമിന്റെ പിൻഗാമികൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എന്റെ വചനം നിങ്ങളിൽ ഇടം കണ്ടെത്തുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ സന്തതി
  rationale: ഏകവചനത്തിലുള്ള συλλογിക പ്രയോഗം ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ മലയാളത്തിൽ സ്വാഭാവികവും കൂട്ടമായ അർഥം നിലനിർത്തുന്നതുമാണ്; ‘മക്കൾ’ എന്നത് സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യത്യാസം മുൻകൂട്ടി നിർണയിച്ചേക്കാം.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: നിങ്ങൾ എന്നെ കൊല്ലാൻ ശ്രമിക്കുന്നു
  rationale: ζητέω + infinitive ഇവിടെ ചെയ്യാൻ അന്വേഷിക്കുക/ശ്രമിക്കുക എന്ന അർഥപരിധിയിലാണ്. വർത്തമാനകാലത്തിലുള്ള തുടരുന്ന ഉദ്ദേശ്യവും പ്രവർത്തനവും സ്വാഭാവിക മലയാളത്തിൽ ‘ശ്രമിക്കുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: എന്റെ വചനം
  rationale: ‘വചനം’ λόγος എന്ന പദത്തിന്റെ യോഹന്നാനീയ പദബന്ധം നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്നത് അതിന്റെ പാളികളുള്ള അർഥം ചുരുക്കിയേക്കാം.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: നിങ്ങളിൽ ഇടം ലഭിക്കുന്നില്ല
  rationale: χωρέω-യിലെ ഇടം കണ്ടെത്തുക/സ്വീകരിക്കപ്പെടുക എന്ന രൂപകം സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; സ്വീകരണമില്ലായ്മയോ പുരോഗതിയില്ലായ്മയോ എന്ന അർഥസാധ്യതകളെ അതിയായി ചുരുക്കുന്നില്ല.
- source_word: ἀλλὰ
  choice: എന്നിട്ടും
  rationale: അബ്രാഹാമിന്റെ ശാരീരിക സന്തതിയാണെന്ന സമ്മതവും യേശുവിനെ കൊല്ലാനുള്ള അവരുടെ ശ്രമവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἶδα ὅτι
  choice: എന്ന് എനിക്കറിയാം
  rationale: ഗ്രീക്കിലെ ഉള്ളടക്കവാക്യം മലയാളത്തിലെ സ്വാഭാവിക പരോക്ഷവാക്യക്രമത്തിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിൽനിന്നുള്ള ശാരീരിക വംശപരമ്പരയും അബ്രാഹാമിനോടുള്ള യഥാർഥ ആത്മീയ ഐക്യവും തമ്മിലുള്ള ബന്ധം
  choice: σπέρμα Ἀβραάμ എന്നത് വംശപരമായ അർഥത്തിൽ ‘അബ്രാഹാമിന്റെ സന്തതി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: അബ്രാഹാമിന്റെ മക്കൾ
  rationale: ഈ വാക്യത്തിൽ യേശു അവരുടെ ശാരീരിക വംശപരമ്പര സമ്മതിക്കുമ്പോഴും അവരുടെ പ്രതികരണത്തെ ചോദ്യം ചെയ്യുന്നു. ‘സന്തതി’ ഈ വസ്തുതാപരമായ സമ്മതം നിലനിർത്തുകയും ചുറ്റുമുള്ള വാക്യങ്ങളിൽ വികസിക്കുന്ന ദൈവശാസ്ത്രപരമായ വൈരുധ്യം മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനം’ യോഹന്നാനീയ പദബന്ധം സംരക്ഷിക്കുന്നു; മുഖ്യവാക്യത്തിലെ ‘ഇടം ലഭിക്കുന്നില്ല’ ഉറവിടത്തിലെ രൂപകവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
