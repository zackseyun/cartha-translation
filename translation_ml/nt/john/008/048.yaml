id: JHN.8.48
reference: John 8:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: ml
  text: 'യെഹൂദർ[a] അവനോടു മറുപടിയായി പറഞ്ഞു: “നീ ഒരു ശമര്യക്കാരനാണെന്നും നിനക്കൊരു ഭൂതം ഉണ്ടെന്നും[c] ഞങ്ങൾ പറയുന്നത് ശരിയല്ലേ?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില സന്ദർഭങ്ങളിൽ “യെഹൂദ്യർ” എന്നോ “യെഹൂദനേതാക്കൾ” എന്നോ അർഥമാകാം. യോഹന്നാന്റെ സുവിശേഷത്തിൽ “യെഹൂദർ” എന്ന പദം പലപ്പോഴും യേശുവിനെ എതിർക്കുന്ന ഒരു പ്രത്യേക വിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; എല്ലാ യെഹൂദരെയും ഒന്നടങ്കമല്ല.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ഞങ്ങൾ ശരിയായിട്ടല്ലേ പറയുന്നത്…?”
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ഒരു ഭൂതം ഉണ്ട്”; ചില പരിഭാഷകൾ കൂടുതൽ വ്യാഖ്യാനപരമായി “ഭൂതബാധിതനാണ്” എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν … καὶ εἶπαν αὐτῷ
  choice: അവനോടു മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ‘ഉത്തരം നൽകി, അവനോടു പറഞ്ഞു’ എന്ന ഇരട്ട പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്കിലെ പൊതുവായ ജനവിഭാഗനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘യെഹൂദനേതാക്കൾ’ എന്ന കൂടുതൽ പരിമിതമായ അർഥം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: ഞങ്ങൾ പറയുന്നത് ശരിയല്ലേ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് നിഷേധാത്മക അലങ്കാരചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: Σαμαρίτης
  choice: ഒരു ശമര്യക്കാരൻ
  rationale: ഇവിടെ അധിക്ഷേപമായി ഉപയോഗിച്ചിരിക്കുന്ന വംശീയ-മതപരമായ തിരിച്ചറിയൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: δαιμόνιον ἔχεις
  choice: നിനക്കൊരു ഭൂതം ഉണ്ട്
  rationale: ‘ഒരു ഭൂതം ഉണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ വ്യാഖ്യാനപരമായ ‘ഭൂതബാധിതൻ’ എന്നതിലേക്കു മാറ്റാതെ സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചിതവിഭാഗം
  choice: യെഹൂദർ
  alternative: യെഹൂദ്യർ; യെഹൂദനേതാക്കൾ
  rationale: മൂലപാഠം ഇവിടെ ‘നേതാക്കൾ’ എന്നു വ്യക്തമാക്കാത്തതിനാൽ പ്രധാനവാചകത്തിൽ പൊതുവായ പദം നിലനിർത്തുന്നു. അതേസമയം, ഇത് എല്ലാ യെഹൂദരെയും വിവേചനമില്ലാതെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കാതിരിക്കാനുള്ള സന്ദർഭപരമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ അലങ്കാരചോദ്യവും ‘ഭൂതം ഉണ്ട്’ എന്ന സുതാര്യമായ പ്രയോഗവും നിലനിർത്തിയിരിക്കുന്നു; യെഹൂദരെക്കുറിച്ചുള്ള സന്ദർഭപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
