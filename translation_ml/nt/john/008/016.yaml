  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ വിധിച്ചാൽപ്പോലും[a], എന്റെ വിധി സത്യമാണ്; കാരണം ഞാൻ ഒറ്റയ്ക്കല്ല, ഞാനും എന്നെ അയച്ച പിതാവും ഒരുമിച്ചാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ വിധിച്ചാൽ’ അല്ലെങ്കിൽ ‘ഞാൻ വിധിക്കുകയാണെങ്കിൽ.’ ഗ്രീക്കിലെ നിബന്ധനാപ്രയോഗം കൂടുതൽ ഔപചാരികമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ സന്ദർഭത്തിൽ ‘വിധിച്ചാൽപ്പോലും’ എന്ന വിട്ടുവീഴ്ച സൂചിപ്പിക്കുന്ന ഭാവമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: ഞാൻ വിധിച്ചാൽപോലും
  rationale: ἐὰν + വർത്തമാനകാല subjunctive ഒരു സാധ്യതാപരമായ നിബന്ധനയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ concessive ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘വിധിച്ചാൽപോലും’ തെരഞ്ഞെടുത്തു; ‘ഞാൻ വിധിച്ചാൽ’ എന്ന ഔപചാരിക നിബന്ധനയും സാധ്യമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യമോ ആശയവികാസമോ സൂചിപ്പിക്കുന്ന δέ-യുടെ adversative ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: എന്റെ വിധി
  rationale: κρίσις എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധിയായ ഭാവം നിലനിർത്തുകയും ഗ്രീക്ക് possessive ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀληθινή
  choice: സത്യമാണ്
  rationale: ‘യഥാർഥം’, ‘സാധുവായത്’ എന്നീ അർഥസാധ്യതകൾ ഉണ്ടായാലും, യോഹന്നാനിലെ സത്യത്തെക്കുറിച്ചുള്ള ആശയപ്രതിധ്വനി നിലനിർത്താനും സത്യസന്ധതയും സാധുതയും ഉൾക്കൊള്ളാനും ‘സത്യം’ അനുയോജ്യമാണ്.
- source_word: μόνος οὐκ εἰμί
  choice: ഞാൻ ഏകനല്ല
  rationale: യേശുവിന്റെ വിധി ഒറ്റപ്പെട്ടതോ സ്വതന്ത്രമായതോ അല്ലെന്ന ബന്ധപരമായ ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: ഞാനും എന്നെ അയച്ച പിതാവും കൂടെയുണ്ട്
  rationale: ഗ്രീക്കിലെ സംയുക്തമായ ‘ഞാനും ... പിതാവും’ എന്ന ഘടന നിലനിർത്തുന്നു. മലയാളത്തിൽ വാക്യം വ്യാകരണപരമായി പൂർണമാക്കാൻ ‘കൂടെയുണ്ട്’ ചേർത്തിരിക്കുന്നു; ഇത് പിതാവിനോടുള്ള യേശുവിന്റെ ഏകാകിയല്ലാത്ത ബന്ധം വ്യക്തമാക്കുന്നു, പക്ഷേ അതിൽ കൂടുതൽ സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ വിധിയും പിതാവിന്റെ സാന്നിധ്യവും തമ്മിലുള്ള ബന്ധം
  choice: യേശുവിന്റെ വിധി സത്യമാണെന്നത്, അവൻ തനിച്ചല്ലെന്നും അവനെ അയച്ച പിതാവ് അവനോടുകൂടെ ഉണ്ടെന്നും പറഞ്ഞുകൊണ്ട് വാക്യം അടിസ്ഥാനപ്പെടുത്തുന്നു.
  alternative: ഇത് പിതാവിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ പങ്കിനെക്കാൾ, രണ്ടു സാക്ഷികളെക്കുറിച്ചുള്ള നിയമപരമായ വാദമായി മാത്രം വായിക്കാം.
  rationale: മൂലവാക്യം യേശുവിന്റെ വിധിയുടെ സത്യത്തെ അവന്റെ ഏകാകിയല്ലായ്മയോടും അയച്ച പിതാവിനോടും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു. വിവർത്തനം ഈ ബന്ധം സംരക്ഷിക്കുന്നു; എന്നാൽ പിന്നീടുള്ള സിദ്ധാന്തപരമായ നിർവചനങ്ങൾ അതിലേക്കു ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘വിധി’, ‘സത്യം’, ‘പിതാവ്’ എന്നീ പദങ്ങൾ യോഹന്നാനിലെ ന്യായവിധി-സാക്ഷ്യം-സത്യം എന്നീ ആശയബന്ധങ്ങൾ നിലനിർത്തുന്നു. ‘ഏകനല്ല’ എന്നത് അല്പം ഔപചാരികമായെങ്കിലും വേദപാഠത്തിന് യോജിച്ചും വ്യക്തവുമാണ്.
