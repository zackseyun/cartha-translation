id: JHN.8.52
reference: John 8:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: ml
  text: 'യേശുവിനോടു യഹൂദന്മാർ പറഞ്ഞു: “നിനക്കു പിശാചുണ്ടെന്ന് ഇപ്പോൾ ഞങ്ങൾക്കു മനസ്സിലായി.[a] അബ്രാഹാം മരിച്ചു; പ്രവാചകന്മാരും മരിച്ചു. എന്നിട്ടും നീ പറയുന്നു: ‘എന്റെ വചനം പാലിക്കുന്നവൻ ഒരിക്കലും മരണത്തെ രുചിക്കുകയില്ല.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നീ പിശാചുബാധിതനാണ്.” ഗ്രീക്കിൽ അക്ഷരാർഥം: “നിനക്കു പിശാചുണ്ട്.”'
    reason: lexical_alternative
  - marker: b
    text: '“ഒരിക്കലും ... ഇല്ല” എന്നത് ഗ്രീക്കിലെ അതിശക്തമായ നിഷേധമാണ്: ഒരു കാലത്തും മരണത്തെ രുചിക്കുകയില്ല.'
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: യോഹന്നാനിലെ ഈ സന്ദർഭത്തിൽ യേശുവിനെ എതിർക്കുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിന്റെ നേരിട്ടുള്ള വിവർത്തനം; ‘യെഹൂദനേതാക്കൾ’ എന്നത് വ്യാഖ്യാനപരമായി പരിധി ചുരുക്കും.
- source_word: Νῦν ἐγνώκαμεν
  choice: ഇപ്പോൾ ഞങ്ങൾക്കു മനസ്സിലായി
  rationale: മുമ്പുണ്ടായിരുന്ന സംശയം ഇപ്പോൾ തീർന്ന് ഒരു നിഗമനത്തിലെത്തിയെന്ന perfect ക്രിയയുടെ ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δαιμόνιον ἔχεις
  choice: നിനക്കു ഭൂതമുണ്ട്
  rationale: ‘ഒരു ഭൂതം നിനക്കുണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; ‘ഭൂതബാധിതനാണ്’ എന്ന വ്യാഖ്യാനപരമായ പകരംവാക്ക് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: അബ്രാഹാം മരിച്ചു; പ്രവാചകന്മാരും മരിച്ചു
  rationale: രണ്ടു കർത്താക്കൾക്കും ‘മരിച്ചു’ ചേർക്കുന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവും ആക്കുന്നു; καί-യുടെ ‘കൂടി/ഉം’ എന്ന ബലം നിലനിർത്തുന്നു.
- source_word: καὶ σὺ λέγεις
  choice: എന്നിട്ടും നീ പറയുന്നു
  rationale: മുൻവാക്യവും യേശുവിന്റെ അവകാശവാദവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: എന്റെ വചനം പാലിക്കുന്നവൻ
  rationale: λόγος എന്നതിന് യോഹന്നാനീയ പ്രയോഗവുമായി ചേരുന്ന ‘വചനം’ എന്നും τηρέω എന്നതിന് കാത്തുസൂക്ഷിക്കൽ/അനുസരണം ഉൾക്കൊള്ളുന്ന സ്വാഭാവികമായ ‘പാലിക്കുക’ എന്നും നൽകുന്നു.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും മരണം ആസ്വദിക്കുകയില്ല
  rationale: οὐ μή ... εἰς τὸν αἰῶνα എന്ന ശക്തമായ നിഷേധത്തെ ‘ഒരിക്കലും ... ഇല്ല’ എന്നു സ്വാഭാവികമായി പകരുന്നു; γεύομαι-യുടെ രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘മരണം ആസ്വദിക്കുക’ എന്ന വാഗ്ദാനത്തിന്റെ അർഥം
  choice: ശാരീരികമരണമോ ആത്മീയമരണമോ അന്ത്യകാലത്തെ നിത്യനാശമോ എന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കാതെ രൂപകപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ഒരിക്കലും മരിക്കുകയില്ല’ എന്ന വ്യാഖ്യാനപരമായ വിവർത്തനം.
  rationale: എതിർവാദികൾ വാക്കുകളെ ശാരീരികമരണവുമായി ബന്ധിപ്പിക്കുമ്പോഴും യോഹന്നാന്റെ വിവരണത്തിൽ പലതലത്തിലുള്ള അർഥസാധ്യത നിലനിൽക്കുന്നു; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിച്ചുകളയരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഭൂതം,’ ‘വചനം,’ ‘മരണം ആസ്വദിക്കുക’ എന്നീ മൂലപാഠസന്നിഹിത പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അതേസമയം വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
