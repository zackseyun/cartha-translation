revisions:
- from: 'യേശുവിനോടു യെഹൂദർ പറഞ്ഞു: “നിനക്കു ഭൂതമുണ്ടെന്ന് ഇപ്പോൾ ഞങ്ങൾക്കു മനസ്സിലായി.[a] അബ്രാഹാം മരിച്ചു; പ്രവാചകന്മാരും മരിച്ചു. എന്നിട്ടും നീ പറയുന്നു: ‘എന്റെ വചനം പാലിക്കുന്നവൻ ഒരിക്കലും മരണം ആസ്വദിക്കുകയില്ല.’[b]”'
  to: 'യേശുവിനോടു യഹൂദന്മാർ പറഞ്ഞു: “നിനക്കു പിശാചുണ്ടെന്ന് ഇപ്പോൾ ഞങ്ങൾക്കു മനസ്സിലായി.[a] അബ്രാഹാം മരിച്ചു; പ്രവാചകന്മാരും മരിച്ചു. എന്നിട്ടും നീ പറയുന്നു: ‘എന്റെ വചനം പാലിക്കുന്നവൻ ഒരിക്കലും മരണത്തെ രുചിക്കുകയില്ല.’[b]”'
  rationale: The revised wording improves lexical precision for δαιμόνιον and replaces an unnatural literalism with the standard Malayalam metaphor ‘മരണത്തെ രുചിക്കുക.’ ‘ഒരിക്കലും’ carries the force of οὐ μὴ ... εἰς τὸν αἰῶνα without interpreting the nature of the death in view. Footnote anchors and their corresponding notes remain complete and correctly placed.
