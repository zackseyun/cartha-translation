  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: ml
  text: നിങ്ങൾ സത്യം അറിയും[a]; സത്യം നിങ്ങളെ സ്വതന്ത്രരാക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ സത്യം അറിഞ്ഞുവരും.’
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിന്റെ പദപ്രയോഗത്തിൽ സ്വാതന്ത്ര്യം എന്തിൽനിന്നുള്ളതാണെന്ന് വ്യക്തമാക്കുന്നില്ല; ചുറ്റുമുള്ള സന്ദർഭം അതിനെ പാപത്തിൽനിന്നുള്ള സ്വാതന്ത്ര്യവുമായി ബന്ധിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: നിങ്ങൾ ... അറിയും
  rationale: γινώσκω എന്ന ക്രിയയുടെ ഭാവികാലരൂപത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘അറിഞ്ഞുവരും’ എന്ന അർഥനിഴൽ സാധ്യമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർത്തിട്ടില്ല.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: സത്യം / സത്യം
  rationale: ഗ്രീക്കിൽ രണ്ടിടത്തും നിർദേശക ഉപപദം ഉണ്ടെങ്കിലും മലയാളത്തിൽ പ്രത്യേക ആർട്ടിക്കിൾ ഇല്ല. ‘സത്യം’ എന്ന പദത്തിന്റെ ആവർത്തനം മൂലപാഠത്തിലെ പ്രത്യേകതയും വാക്ചാതുര്യവും നിലനിർത്തുന്നു.
- source_word: ἐλευθερώσει
  choice: സ്വതന്ത്രരാക്കും
  rationale: ἐλευθερόω എന്ന ക്രിയയുടെ കാരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു; വിമോചനത്തിന്റെ സ്വഭാവം മുഖ്യവാചകത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കർമരൂപം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καὶ ... καὶ
  choice: ആദ്യബന്ധകം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ പരോക്ഷമാക്കി; രണ്ടാമത്തേതിന്റെ ഏകോപനബന്ധം അർധവിരാമത്തിലൂടെ പ്രകടമാക്കി
  rationale: ഒറ്റപ്പെട്ട വാക്യമായി വായിക്കുമ്പോൾ ‘കൂടാതെ/എന്നിട്ട്’ എന്നു യാന്ത്രികമായി ചേർക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാകും. രണ്ട് സമാന്തര പ്രസ്താവനകളുടെ പുരോഗതിയും താളവും അർധവിരാമം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘സത്യം നിങ്ങളെ സ്വതന്ത്രരാക്കും’ എന്നതിലെ സ്വാതന്ത്ര്യത്തിന്റെ സ്വഭാവം
  choice: രാഷ്ട്രീയമോ മാനസികമോ ആത്മീയമോ എന്നു മുഖ്യവാചകത്തിൽ നിർവചിക്കാതെ പ്രസ്താവന തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
  alternative: ‘സത്യം നിങ്ങളെ പാപത്തിൽനിന്ന് സ്വതന്ത്രരാക്കും’
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ സ്വാതന്ത്ര്യത്തെ പാപത്തിൽനിന്നുള്ള മോചനവുമായി ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ മോചനത്തിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സന്ദർഭം അതിനെ വ്യാഖ്യാനിക്കാൻ അനുവദിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സത്യം’ എന്ന ആവർത്തനവും രണ്ട് സമാന്തര ഭാവികാല പ്രസ്താവനകളും നിലനിർത്തി; അർധവിരാമം ഗ്രീക്ക് വാക്യത്തിന്റെ താളവും യുക്തിപരമായ പുരോഗതിയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
