base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ എന്റെ മഹത്വം അന്വേഷിക്കുന്നില്ല; അതിനെ അന്വേഷിക്കുകയും ന്യായം വിധിക്കുകയും ചെയ്യുന്ന ഒരാളുണ്ട്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അന്വേഷിക്കുകയും ന്യായം വിധിക്കുകയും ചെയ്യുന്ന ആ ഒരാളുണ്ട്.” ‘അന്വേഷിക്കുന്നു’ എന്ന ക്രിയയുടെ അന്തർലീന കർമം മുൻവാക്യത്തിലെ യേശുവിന്റെ മഹത്വമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: പേരുപറയാത്ത ഈ വ്യക്തി പിതാവാണെന്നാണ് സന്ദർഭത്തിൽ സാധാരണ മനസ്സിലാക്കപ്പെടുന്നത്; എന്നാൽ ഗ്രീക്ക് വാക്യം ഇവിടെ അത് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: എന്നാൽ ഞാൻ
  rationale: δέയുടെ വൈരുധ്യസൂചന ‘എന്നാൽ’ കൊണ്ടും, ἐγώയുടെ ഊന്നൽ വ്യക്തമായ ‘ഞാൻ’ കൊണ്ടും നിലനിർത്തുന്നു.
- source_word: οὐ ζητῶ
  choice: അന്വേഷിക്കുന്നില്ല
  rationale: വർത്തമാനകാല നിഷേധത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും പിന്നീട് വരുന്ന ζητῶν എന്ന പദവുമായുള്ള ശാബ്ദികബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὴν δόξαν μου
  choice: എന്റെ മഹത്ത്വം
  rationale: δόξα ഇവിടെ വ്യക്തിക്കുള്ള മഹത്ത്വം/ബഹുമാനം സൂചിപ്പിക്കുന്നു; ‘മഹത്ത്വം’ യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും നിലനിർത്തുന്നു. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘സ്വന്തം’ ചേർക്കുന്നില്ല.
- source_word: ἔστιν ὁ ζητῶν
  choice: അത് അന്വേഷിക്കുന്ന ... ഒരാളുണ്ട്
  rationale: അസ്തിത്വസൂചകമായ ἔστινയും നാമവൽക്കരിച്ച കൃദന്തരൂപവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ ‘എന്റെ മഹത്ത്വം’ ആണ് ζητῶν എന്നതിന്റെ അന്തർലീന കർമം; അതിനാൽ ‘അത്’ ചേർത്തിരിക്കുന്നു.
- source_word: καὶ κρίνων
  choice: ന്യായം വിധിക്കുകയും ചെയ്യുന്ന
  rationale: κρίνωയുടെ ന്യായവിധിസംബന്ധമായ അർത്ഥം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു; ζητῶνയോടു സമാന്തരമായ കൃദന്തരൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അന്വേഷിക്കുകയും ന്യായം വിധിക്കുകയും ചെയ്യുന്ന പേരുപറയാത്ത വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനവാചകത്തിൽ ‘ഒരാളുണ്ട്’ എന്നു മാത്രം നൽകി തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നില്ല.
  alternative: ‘പിതാവ് അത് അന്വേഷിക്കുകയും ന്യായം വിധിക്കുകയും ചെയ്യുന്നു.’
  rationale: സന്ദർഭത്തിൽ ഇത് പിതാവിനെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കപ്പെടുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം ഇവിടെ പിതാവിനെ വ്യക്തമായി പേരെടുത്തുപറയുന്നില്ല. അതിനാൽ മൂലവാചകത്തിന്റെ നിയന്ത്രണവും ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മഹത്ത്വം’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും യോഹന്നാനിലെ δόξα എന്ന പദത്തിന്റെ വിശാല അർത്ഥം വഹിക്കുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
