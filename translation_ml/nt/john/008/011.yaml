id: JHN.8.11
reference: John 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: ml
  text: 'അവൾ പറഞ്ഞു: “ആരുമില്ല, കർത്താവേ.” യേശു പറഞ്ഞു: “ഞാനും നിനക്കു ശിക്ഷാവിധി കൽപ്പിക്കുന്നില്ല; പോകുക, ഇനി പാപം ചെയ്യരുത്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള വിവരണത്തിന്റെ (യോഹന്നാൻ 7:53–8:11) അവസാന വാക്യം. യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: കർത്താവേ
  rationale: സംബോധനാരൂപമായ κύριε എന്നതിന് ‘യജമാനനേ/സാർ’ എന്ന വിനയപൂർവ അഭിസംബോധനയും സാധ്യമാണെങ്കിലും, യേശുവിന്റെ അധികാരത്തെ അംഗീകരിക്കുന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ ‘കർത്താവേ’ നിലനിർത്തുന്നു.
- source_word: κατακρίνω
  choice: കുറ്റം വിധിക്കുന്നു
  rationale: ന്യായവിധിയിലൂടെ ഒരാളെ കുറ്റക്കാരിയായി വിധിക്കുക എന്ന നീതിന്യായപരമായ അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μηκέτι ἁμάρτανε
  choice: ഇനി പാപം ചെയ്യരുത്
  rationale: μηκέτι സൂചിപ്പിക്കുന്ന ‘ഇതുമുതൽ മേലിൽ അരുത്’ എന്ന കാലപരമായ ഊന്നൽ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: πορεύου
  choice: പോകുക
  rationale: വർത്തമാന മധ്യമ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള വിടവാങ്ങൽ നിർദേശം dignified modern Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: κύριε എന്ന അഭിസംബോധനയുടെ അർഥവ്യാപ്തി
  choice: കർത്താവേ
  alternative: യജമാനനേ / സാർ
  rationale: വാക്കിന് വിനയപൂർവമായ സാധാരണ അഭിസംബോധന എന്ന അർഥം ഉണ്ടാകാമെങ്കിലും, ‘കർത്താവേ’ എന്നത് യേശുവിന്റെ അധികാരത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത വായന നിലനിർത്തുന്നു; അതേസമയം ഈ ഒറ്റ പദത്തിൽനിന്ന് സ്ത്രീയുടെ പൂർണ ക്രിസ്തുശാസ്ത്രപരമായ ബോധ്യം നിർബന്ധമായി നിഗമനം ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ നേരിട്ടുള്ള സംഭാഷണഭാവവും നീതിന്യായപരമായ ഭാഷയും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്ത് ചേർത്തിരിക്കുന്നു.
