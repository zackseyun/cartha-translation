id: JHN.8.45
reference: John 8:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ സത്യം പറയുന്നതുകൊണ്ട്[a] നിങ്ങൾ എന്നെ വിശ്വസിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിലെ ὅτι എന്ന പദം കൂടുതൽ പദാനുപദമായി ‘എന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം: ‘എന്നാൽ ഞാൻ സത്യം പറയുന്നു എന്ന് നിങ്ങൾ എന്നെ വിശ്വസിക്കുന്നില്ല.’ ഇവിടെ അതിനെ ‘കൊണ്ട്’ എന്ന കാരണാർഥത്തിൽ മനസ്സിലാക്കുന്നതാണ് സന്ദർഭത്തിന് കൂടുതൽ യോജിച്ചത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി നൽകിയിരിക്കുന്നതിനാൽ, ശ്രോതാക്കളോടുള്ള ഊന്നിയ വൈരുധ്യം നിലനിർത്താൻ അത് പരിഭാഷയിൽ സൂക്ഷിച്ചു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: പറയുന്നതുകൊണ്ട്
  rationale: ഇവിടെ ὅτι കാരണാർഥകമായി മനസ്സിലാക്കുന്നതാണ് വാക്യത്തിന്റെ യുക്തിയും സന്ദർഭത്തിലെ തീക്ഷ്ണമായ വൈരുധ്യവും ഏറ്റവും നന്നായി നൽകുന്നത്.
- source_word: τὴν ἀλήθειαν
  choice: സത്യം
  rationale: ἀλήθεια എന്നതിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; മലയാളത്തിൽ ഈ പ്രയോഗത്തിന് നിർദേശകപദം ചേർക്കേണ്ടതില്ല.
- source_word: λέγω
  choice: പറയുന്നു
  rationale: വർത്തമാനകാലം നിലനിർത്തുകയും ‘സത്യം പറയുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ πιστεύετέ μοι
  choice: നിങ്ങൾ എന്നെ വിശ്വസിക്കുന്നില്ല
  rationale: πιστεύω ദത്തിവോടുകൂടെ ഇവിടെ ഒരാളെ വിശ്വസിക്കുക എന്നർഥം നൽകുന്നു; വ്യക്തിപരമായ കർമബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὅτι എന്നതും യേശുവിന്റെ സത്യവചനവും ശ്രോതാക്കളുടെ അവിശ്വാസവും തമ്മിലുള്ള ബന്ധം
  choice: 'കാരണാർഥകം: ‘ഞാൻ സത്യം പറയുന്നതുകൊണ്ട്’'
  alternative: 'പ്രസ്താവനാർഥകം: ‘ഞാൻ സത്യം പറയുന്നു എന്ന്’'
  rationale: തൊട്ടുമുൻപുള്ള പ്രസംഗസന്ദർഭത്തിൽ യേശു സത്യം പറയുന്നതുതന്നെയാണ് അവർ അവനെ വിശ്വസിക്കാത്തതിന്റെ കാരണമെന്ന തീക്ഷ്ണമായ വിരോധാഭാസം കാണുന്നു. ഇത് ഉപദേശപരമായ കൂട്ടിച്ചേർക്കലല്ല, വാക്യഘടനയും പ്രസംഗസന്ദർഭവും അടിസ്ഥാനമാക്കിയുള്ള തീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഊന്നിയ ‘ഞാൻ’ നിലനിർത്തി; ‘സത്യം പറയുക’, ‘എന്നെ വിശ്വസിക്കുക’ എന്നീ സാധാരണവും വ്യക്തവുമായ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു.
