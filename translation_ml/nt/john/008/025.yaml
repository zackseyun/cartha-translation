id: JHN.8.25
reference: John 8:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ml
  text: 'അതിനാൽ അവർ അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു: “നീ ആരാണ്?” യേശു അവരോടു പറഞ്ഞു: “ആദിമുതൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞുവരുന്നതുതന്നെ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ഈ വാക്യഘടന ദുഷ്കരമാണ്. ഇവിടെ സ്വീകരിച്ചിരിക്കുന്നതുപോലെ, ‘ആദിമുതൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞുവരുന്നതുതന്നെ’ എന്നു വായിക്കാം. മറ്റുചില വ്യാഖ്യാനങ്ങൾ ഇതിനെ ‘ആദ്യമായി/തുടക്കത്തിൽ, ഞാൻ നിങ്ങളോടു പറയുന്നതു’ എന്നും, അല്ലെങ്കിൽ ‘ഞാൻ നിങ്ങളോടു സംസാരിക്കുന്നത് എന്തിന്?’ എന്നും മനസ്സിലാക്കുന്നു.
    reason: Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അംഗീകൃത വ്യാഖ്യാന-അനിശ്ചിതത്വം രേഖപ്പെടുത്തുന്നു; മുഖ്യപാഠം ഇംഗ്ലീഷ് POBയുടെ സന്ദർഭാനുസൃത വായന നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἔλεγον
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ ആവർത്തിതമോ തുടർച്ചയായതോ ആയ ഭാവം നിലനിർത്തുന്നു; നേരിട്ടുള്ള ചോദ്യം പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ചോദിക്കുക’ ഉപയോഗിച്ചു.
- source_word: Σὺ τίς εἶ;
  choice: നീ ആരാണ്?
  rationale: സർവനാമത്തിന് നൽകിയ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക നേരിട്ടുള്ള ചോദ്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: Τὴν ἀρχὴν
  choice: ആദിമുതൽ
  rationale: സന്ദർഭത്തിൽ കാലസൂചനയായി വായിക്കുന്ന പ്രധാന വ്യാഖ്യാനം പിന്തുടരുന്നു; യേശു തുടക്കംമുതൽ പറഞ്ഞുവന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പറഞ്ഞുകൊണ്ടിരിക്കുന്നതുതന്നെ
  rationale: λαλῶ എന്ന വർത്തമാനകാലത്തിന്റെ തുടർച്ചാഭാവവും καί നൽകുന്ന ‘അതുതന്നെ’ എന്ന ഊന്നലും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν എന്ന വാക്യഘടനയുടെ അർഥവ്യക്തത
  choice: “ആദിമുതൽ ഞാൻ നിങ്ങളോടു പറഞ്ഞുകൊണ്ടിരിക്കുന്നതുതന്നെ.”
  alternative: “ഞാൻ നിങ്ങളോടു സംസാരിക്കുന്നതെന്തിന്?” എന്നോ “ആദ്യമേ, ഞാൻ നിങ്ങളോടു പറയുന്നതുതന്നെ” എന്നോ വായിക്കാവുന്നതാണ്.
  rationale: ഗ്രീക്ക് വാക്യഘടന ദുഷ്കരവും വ്യാഖ്യാനസാധ്യതകളുള്ളതുമാണ്. സമീപസന്ദർഭത്തിനും പ്രാചീന വിവർത്തനപരമ്പരയിലെ പ്രധാന വായനയ്ക്കും ഇംഗ്ലീഷ് POB-ക്കും ഒത്ത കാലസൂചനാ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അടിക്കുറിപ്പ് ഉൾപ്പെടുന്നതിനാൽ അതിന്റെ [a] ചിഹ്നം മുഖ്യപാഠത്തിലെ ബന്ധപ്പെട്ട ദുഷ്കരവാക്യത്തിൽ ചേർക്കണം.
