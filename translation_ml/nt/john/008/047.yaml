id: JHN.8.47
reference: John 8:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: ml
  text: 'ദൈവത്തിൽനിന്നുള്ളവൻ[b] ദൈവത്തിന്റെ വചനങ്ങൾ കേൾക്കുന്നു. നിങ്ങൾ കേൾക്കാത്തത് ഇതുകൊണ്ടാണ്: നിങ്ങൾ ദൈവത്തിൽനിന്നുള്ളവരല്ല[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഇവിടെ ‘കാരണം’ എന്ന അർഥത്തിൽ പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ὅτι എന്ന ഗ്രീക്ക് പദത്തിന് ‘എന്ന്’ എന്നും അർഥമാകാം. അങ്ങനെ വായിച്ചാൽ: ‘നിങ്ങൾ ദൈവത്തിൽനിന്നുള്ളവരല്ലെന്ന് നിങ്ങൾ കേൾക്കുന്നില്ല.’ എന്നാൽ സന്ദർഭത്തിൽ കാരണാർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.'
    reason: alternative_reading
  - marker: b
    text: ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നത് ‘ദൈവത്തിന്റേതായ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം ഇവിടെ പ്രധാനമായും ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὢν
  choice: ദൈവത്തിൽനിന്നുള്ളവൻ
  rationale: ലേഖനത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ഒരു വിഭാഗത്തിലെ വ്യക്തിയെ ഏകവചന പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ രൂപം സ്വീകരിച്ചു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള
  rationale: ἐκ ഉടമസ്ഥതയേക്കാൾ ഉറവിടം അല്ലെങ്കിൽ ഉത്ഭവം സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിൽനിന്നുള്ള’ ഈ ഭാവം നിലനിർത്തുന്നു.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനങ്ങൾ
  rationale: ῥήματα എന്നതിന്റെ ബഹുവചനവും ദൈവവചനത്തിന് യോജിച്ച ഗൗരവമുള്ള ആധുനിക മലയാളപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἀκούει / ἀκούετε
  choice: കേൾക്കുന്നു / കേൾക്കാത്തത്
  rationale: സന്ദർഭത്തിൽ സ്വീകരിച്ചു അനുസരിക്കുക എന്ന സൂചന ഉണ്ടാകാമെങ്കിലും, അടിസ്ഥാന അർഥമായ ‘കേൾക്കുക’ നിലനിർത്തി; ‘അനുസരിക്കുക’ എന്ന് വ്യാഖ്യാനിച്ചില്ല.
- source_word: διὰ τοῦτο
  choice: അതിനാലാണ്
  rationale: കാരണം-ഫലം ബന്ധം സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചന രണ്ടാംപുരുഷ സർവനാമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: -തിനാൽ
  rationale: സന്ദർഭത്തിൽ കാരണാർഥം കൂടുതൽ യോജിക്കുന്നു; ഗ്രീക്കിൽ സാധ്യമായ പ്രഖ്യാപനാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: നിങ്ങൾ ദൈവത്തിൽനിന്നുള്ളവരല്ല
  rationale: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ἐκ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; പ്രത്യേക സിദ്ധാന്തപരമായ വിഭാഗത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ‘ദൈവത്തിൽനിന്നുള്ളവൻ’ എന്നതിന്റെ അർഥം
  choice: ഉറവിടം സൂചിപ്പിക്കുന്ന ‘ദൈവത്തിൽനിന്നുള്ള’ എന്ന ഭാഷ നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റേതായവൻ’ അല്ലെങ്കിൽ പ്രത്യേകമായി ‘ദൈവത്തിൽനിന്ന് ജനിച്ചവൻ’
  rationale: തിരഞ്ഞെടുപ്പ്, പുനർജനനം, ഉടമ്പടിയംഗത്വം തുടങ്ങിയ പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങളിലൊന്നായി വാക്യത്തെ നിർണയിക്കാതെ യോഹന്നാന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ἀκούω എന്ന ക്രിയയുടെ ശക്തി
  choice: ‘കേൾക്കുക’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ശ്രദ്ധിക്കുക’ അല്ലെങ്കിൽ ‘അനുസരിക്കുക’
  rationale: യഥാർഥ കേൾവിയിൽ സ്വീകരണവും പ്രതികരണവും ഉൾപ്പെട്ടേക്കാമെങ്കിലും, മൂലക്രിയയുടെ നേരിട്ടുള്ള അർഥവും വാക്യത്തിലെ ആവർത്തനവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിരൂപം, ബഹുവചന ‘നിങ്ങൾ’, ‘കേൾക്കുക’ എന്ന ആവർത്തനം, ഉറവിടം സൂചിപ്പിക്കുന്ന ഭാഷ എന്നിവ സംരക്ഷിച്ചു. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പ്രസ്താവനയുടെ അവസാനം ചേർത്തു.
