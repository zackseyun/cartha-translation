id: JHN.8.27
reference: John 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: ml
  text: താൻ അവരോടു പിതാവിനെക്കുറിച്ച് സംസാരിച്ചുകൊണ്ടിരുന്നതെന്ന് അവർ മനസ്സിലാക്കിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “താൻ അവരോടു പിതാവിനെക്കുറിച്ച് സംസാരിച്ചുകൊണ്ടിരുന്നതെന്ന് അവർ അറിഞ്ഞില്ല.”
    reason: οὐκ ἔγνωσαν എന്നതിന് സന്ദർഭാനുസൃതമായി ‘മനസ്സിലാക്കിയില്ല’ എന്നും കൂടുതൽ പദാനുസൃതമായി ‘അറിഞ്ഞില്ല’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: അവർ മനസ്സിലാക്കിയില്ല
  rationale: γινώσκω എന്നതിന് സാധാരണയായി ‘അറിയുക’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ യേശു ആരെ ഉദ്ദേശിച്ചുവെന്നത് അവർ ഗ്രഹിച്ചില്ല എന്നതാണ് സന്ദർഭാർഥം. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘മനസ്സിലാക്കിയില്ല’ എന്നു നൽകി; ‘അറിഞ്ഞില്ല’ എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ മനസ്സിലാക്കാതിരുന്നതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന ഘടകമായി മലയാളത്തിലെ ‘എന്ന്’ സ്വാഭാവികമാണ്.
- source_word: τὸν πατέρα
  choice: പിതാവിനെ
  rationale: യോഹന്നാന്റെ തൊട്ടടുത്ത സന്ദർഭത്തിൽ ഇത് യേശു ദൈവത്തെ തന്റെ പിതാവായി പരാമർശിക്കുന്നതാണെന്ന് വ്യക്തമാകുന്നു. മലയാള ബൈബിൾ ശൈലിയിൽ ദൈവിക അഭിസംബോധന സൂചിപ്പിക്കാൻ ‘പിതാവ്’ ഉപയോഗിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടു
  rationale: λέγω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവ് ഇവിടെ സംസാരത്തിന്റെ ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവരോടു സംസാരിക്കുക’ എന്നത് സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: ἔλεγεν
  choice: സംസാരിച്ചതെന്ന്
  rationale: ഗ്രീക്ക് അപൂർണഭൂതകാലം തുടർന്നുകൊണ്ടിരുന്ന സംസാരത്തെ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ഈ വാക്യഘടനയ്ക്കുള്ളിൽ ‘സംസാരിച്ചതെന്ന്’ സ്വാഭാവികമായി സംഭവം അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ആശയവിനിമയപ്രവർത്തനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പിതാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: യേശു ദൈവമായ പിതാവിനെക്കുറിച്ചാണ് സംസാരിച്ചത്.
  alternative: ഒരു മനുഷ്യപിതാവിനെക്കുറിച്ചാണ് സംസാരിച്ചത്.
  rationale: യോഹന്നാന്റെ സമീപസന്ദർഭത്തിൽ ‘പിതാവ്’ ആവർത്തിച്ച് ദൈവത്തെ സൂചിപ്പിക്കുന്നു. ഈ തിരിച്ചറിയൽ സന്ദർഭത്തിൽനിന്നുള്ളതാണ്; പാഠത്തിനു പുറത്തുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: γινώσκω എന്നതിന്റെ സന്ദർഭാനുസൃത വിവർത്തനം
  choice: ‘മനസ്സിലാക്കിയില്ല’
  alternative: ‘അറിഞ്ഞില്ല’ അല്ലെങ്കിൽ ‘തിരിച്ചറിഞ്ഞില്ല’
  rationale: ശ്രോതാക്കൾ യേശുവിന്റെ വാക്കുകളുടെ ഉദ്ദേശ്യം ഗ്രഹിക്കാതിരുന്നതാണ് ഇവിടെ പ്രധാനമായും സൂചിപ്പിക്കുന്നത്. അതേസമയം ‘അറിഞ്ഞില്ല’ എന്ന പദാനുസൃത സാദ്ധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘താൻ’ എന്ന പ്രതിഫല സർവനാമം ആശ്രിതവാക്യത്തിലെ കർത്താവായ യേശുവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘പിതാവ്’ യോഹന്നാനീയ സന്ദർഭത്തിലെ ദൈവിക പരാമർശമായി നിലനിർത്തുന്നു.
