- from: 'അതുകൊണ്ട് അവൻ വീണ്ടും അവരോടു പറഞ്ഞു: “ഞാൻ പോകുന്നു; നിങ്ങൾ എന്നെ അന്വേഷിക്കും[a]. എന്നാൽ നിങ്ങളുടെ പാപത്തിൽത്തന്നെ നിങ്ങൾ മരിക്കും[b]. ഞാൻ പോകുന്നിടത്തേക്ക് വരാൻ നിങ്ങൾക്കു കഴിയില്ല[c].”'
  to: 'അതുകൊണ്ട് അവൻ വീണ്ടും അവരോടു പറഞ്ഞു: “ഞാൻ പോകുന്നു; നിങ്ങൾ എന്നെ അന്വേഷിക്കും[a], നിങ്ങളുടെ പാപത്തിൽ നിങ്ങൾ മരിക്കും[b]. ഞാൻ പോകുന്നിടത്തേക്ക് വരാൻ നിങ്ങൾക്കു കഴിയില്ല[c].”'
  rationale: The revision removes the unsupported emphasis in ‘പാപത്തിൽത്തന്നെ’ and avoids adding contrast through ‘എന്നാൽ.’ It retains the Greek singular ‘sin,’ the sequence of the clauses, the ambiguity of Jesus’ going, and the explicit inability to come.
