id: JHN.8.21
reference: John 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് അവൻ വീണ്ടും അവരോടു പറഞ്ഞു: “ഞാൻ പോകുന്നു; നിങ്ങൾ എന്നെ അന്വേഷിക്കും[a], നിങ്ങളുടെ പാപത്തിൽ നിങ്ങൾ മരിക്കും[b]. ഞാൻ പോകുന്നിടത്തേക്ക് വരാൻ നിങ്ങൾക്കു കഴിയില്ല[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ എന്നെ തിരയും.” ഈ ക്രിയ ഒരാളെ തിരയുന്നതിനെ സൂചിപ്പിക്കാം; യോഹന്നാനിൽ ഇതിന് കൂടുതൽ ആഴമുള്ള ആത്മീയ ധ്വനിയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ഏകവചനം: “നിങ്ങളുടെ പാപത്തിൽ.” ചില പരിഭാഷകൾ “നിങ്ങളുടെ പാപങ്ങളിൽ” എന്നു നൽകുന്നു; എന്നാൽ ഏകവചനം ഓരോ പാപപ്രവൃത്തിയേക്കാളും തുടരുന്ന പാപാവസ്ഥയെ ഊന്നുന്നതായിരിക്കാം.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നിങ്ങൾക്കു വരാനാവില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻസംഭാഷണത്തിൽനിന്നുള്ള തുടർച്ചയും നിഗമനസ്വഭാവവും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Ἐγὼ ὑπάγω
  choice: ഞാൻ പോകുന്നു
  rationale: വർത്തമാനകാലവും യേശുവിന്റെ പുറപ്പെടലിന്റെ ആശയവും നിലനിർത്തുന്നു. 'പോകുന്നു' എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; പിതാവിന്റെ അടുക്കലേക്കുള്ള മടങ്ങിപ്പോക്കെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ζητήσετέ με
  choice: നിങ്ങൾ എന്നെ അന്വേഷിക്കും
  rationale: ζητέω എന്ന പദത്തിന്റെ ഒരാളെ തിരയുക/അന്വേഷിക്കുക എന്ന അടിസ്ഥാനാർഥവും യോഹന്നാനിൽ ഉണ്ടാകാവുന്ന ആഴമുള്ള ആത്മീയ ധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: നിങ്ങളുടെ പാപത്തിൽത്തന്നെ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ἁμαρτίᾳയും ἐν എന്നതിന്റെ സ്ഥിതി സൂചിപ്പിക്കുന്ന ബലവും സംരക്ഷിക്കുന്നു; 'തന്നെ' ആ അവസ്ഥയിൽ മരിക്കുമെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποθανεῖσθε
  choice: നിങ്ങൾ മരിക്കും
  rationale: ഭാവികാലരൂപത്തിന്റെ ലളിതവും കൃത്യവുമായ മലയാള പരിഭാഷ.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: ഞാൻ പോകുന്നിടത്തേക്ക്
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ὑπάγωയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് ലക്ഷ്യസ്ഥാനബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: വരാൻ നിങ്ങൾക്കു കഴിയില്ല
  rationale: δύνασθε സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ/അസാധ്യത വ്യക്തമായി സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἁμαρτίᾳ എന്ന ഏകവചനവും കൂടുതൽ പതിവായ ബഹുവചന പരിഭാഷയും
  choice: മുഖ്യവാചകത്തിൽ “നിങ്ങളുടെ പാപത്തിൽത്തന്നെ”
  alternative: “നിങ്ങളുടെ പാപങ്ങളിൽ”
  rationale: മൂലപാഠം ഏകവചനമാണ്. ഇത് വേറിട്ട പാപപ്രവൃത്തികളുടെ പട്ടികയേക്കാൾ പാപത്തിന്റെ തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കാം; എന്നാൽ ആ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ ഏകവചനത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ὑπάγω എന്നതിലെ യേശുവിന്റെ പുറപ്പെടലിന്റെ വ്യാപ്തി
  choice: “ഞാൻ പോകുന്നു”
  alternative: “ഞാൻ പോയിക്കൊണ്ടിരിക്കുന്നു”; “ഞാൻ വിട്ടുപോകുന്നു”
  rationale: യോഹന്നാനിൽ ഈ 'പോക്ക്' യേശുവിന്റെ മരണം, ഉയിർപ്പ്, പിതാവിലേക്കുള്ള മടങ്ങിപ്പോക്ക് എന്നിവയിലേക്കു സൂചന നൽകാം. മുഖ്യവാചകം ലക്ഷ്യസ്ഥാനം വിശദീകരിക്കാതെ മൂലത്തിലെ പരോക്ഷത സംരക്ഷിക്കുന്നു.
- issue: οὐ δύνασθε എന്നതിലെ അസാധ്യതയുടെ സ്വഭാവം
  choice: “വരാൻ നിങ്ങൾക്കു കഴിയില്ല”
  alternative: “നിങ്ങൾക്കു വരാനാവില്ല”
  rationale: വാക്യം കഴിവില്ലായ്മയെയോ അസാധ്യതയെയോ പ്രസ്താവിക്കുന്നു; അതിന്റെ കാരണം നൈതികമോ ആത്മീയമോ അന്തിമമോ എന്നു പരിഭാഷയിൽ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് ഗ്രീക്കിലെ ഏകവചനവും ആവർത്തനവും അസാധ്യതയുടെ ബലവും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
