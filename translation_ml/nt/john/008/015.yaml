  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: ml
  text: നിങ്ങൾ ജഡപ്രകാരം വിധിക്കുന്നു[a]; ഞാൻ ആരെയും വിധിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മാനുഷിക മാനദണ്ഡപ്രകാരം’ അല്ലെങ്കിൽ ‘ബാഹ്യരൂപം നോക്കി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന രണ്ടാംപുരുഷ ബഹുവചന സർവനാമം ഗ്രീക്കിൽ താരതമ്യാത്മക ഊന്നൽ വഹിക്കുന്നു. തുടർന്നുള്ള ‘ഞാൻ’ എന്നതുമായുള്ള വിരോധഘടനയിലൂടെ മലയാളത്തിൽ ആ ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: κατὰ τὴν σάρκα
  choice: ജഡപ്രകാരം
  rationale: σάρξ എന്ന പദത്തിന്റെ ഉറവിടഭാഷാ രൂപകവും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് മാനുഷികമോ ബാഹ്യമോ ആയ മാനദണ്ഡങ്ങളെ സൂചിപ്പിക്കാം; ആ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: κρίνετε
  choice: വിധിക്കുന്നു
  rationale: വർത്തമാനകാല രണ്ടാംപുരുഷ ബഹുവചന ക്രിയയെ നേരിട്ടും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ സർവനാമം ‘നിങ്ങൾ’ എന്നതിനോടുള്ള ശക്തമായ താരതമ്യം നിലനിർത്തുന്നു.
- source_word: οὐ κρίνω οὐδένα
  choice: ഞാൻ ആരെയും വിധിക്കുന്നില്ല
  rationale: ഗ്രീക്കിലെ സമ്പൂർണ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും വാക്യത്തിന്റെ ചുരുക്കവും ശക്തിയും നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κατὰ τὴν σάρκα എന്ന പ്രയോഗത്തിലെ σάρξ എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘ജഡപ്രകാരം’ എന്ന് നൽകി, കേവലം മാനുഷികമോ ലൗകികമോ ബാഹ്യമോ ആയ മാനദണ്ഡപ്രകാരമുള്ള വിധിയെ സൂചിപ്പിക്കാനുള്ള സാധ്യത തുറന്നുവെച്ചു.
  alternative: ‘മാനുഷിക മാനദണ്ഡപ്രകാരം’ അല്ലെങ്കിൽ ‘ബാഹ്യരൂപം നോക്കി’
  rationale: കൂടുതൽ വ്യാഖ്യാനാത്മകമായൊരു അർഥത്തിലേക്ക് വാചകത്തെ ചുരുക്കാതെ ഉറവിടത്തിലെ രൂപകവും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജഡപ്രകാരം’ എന്ന ചുരുക്കപ്രയോഗം ഉറവിടരൂപകം സംരക്ഷിക്കുന്നു; സാധാരണ വായനക്കാർക്കായി സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
