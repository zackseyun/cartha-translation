  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: ml
  text: 'യേശു മറുപടി പറഞ്ഞു: “എനിക്ക് ഒരു പിശാചുമില്ല[a]. എന്നാൽ ഞാൻ എന്റെ പിതാവിനെ ബഹുമാനിക്കുന്നു; നിങ്ങൾ എന്നെ അപമാനിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യാഖ്യാനപരമായി: “ഞാൻ പിശാചുബാധിതനല്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: യോഹന്നാനിലെ സംഭാഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം; പ്രതികരിച്ച് സംസാരിച്ചതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: δαιμόνιον
  choice: ഭൂതം
  rationale: ദുഷ്ടാത്മസത്തയെ സൂചിപ്പിക്കുന്ന δαιμόνιον എന്ന പദത്തിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാള തുല്യം.
- source_word: οὐκ ἔχω
  choice: എനിക്കില്ല
  rationale: ‘ഉണ്ടായിരിക്കുക/കൈവശമുണ്ടാകുക’ എന്ന ഗ്രീക്ക് ഘടനയെ ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ഭൂതബാധിതനല്ല എന്ന വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τιμῶ
  choice: ബഹുമാനിക്കുന്നു
  rationale: τιμάωയുടെ ‘ആദരിക്കുക, വിലമതിക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുകയും ἀτιμάζωയുമായുള്ള വിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸν πατέρα μου
  choice: എന്റെ പിതാവിനെ
  rationale: യേശു ദൈവത്തെ തന്റെ പിതാവായി പരാമർശിക്കുന്ന യോഹന്നാനീയ സന്ദർഭം നിലനിർത്തുന്നു; മലയാളത്തിൽ പ്രത്യേക നാമപരാമർശം സന്ദർഭംകൊണ്ട് വ്യക്തമാകുന്നു.
- source_word: ἀτιμάζετέ
  choice: അപമാനിക്കുന്നു
  rationale: ബഹുമാനിക്കുന്നതിന് വിപരീതമായി മാനഹാനി വരുത്തുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: με
  choice: എന്നെ
  rationale: നേരിട്ടുള്ള കർമസർവനാമം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: Ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ കർത്തൃസർവനാമം നിലനിർത്തുന്നു; അടുത്തുള്ള ‘നിങ്ങൾ’ എന്ന വിരുദ്ധതയും ഇതിലൂടെ കേൾക്കാം.
theological_decisions:
- issue: ‘എന്റെ പിതാവ്’ എന്ന പരാമർശം
  choice: യേശു ദൈവത്തെ തന്റെ പിതാവായി പരാമർശിക്കുന്നതായി ‘എന്റെ പിതാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: സാധാരണ കുടുംബാർഥത്തിലുള്ള ‘എന്റെ അച്ഛൻ’
  rationale: യോഹന്നാന്റെ ഉടനെയുള്ള സന്ദർഭത്തിൽ ‘പിതാവ്’ ദൈവത്തെക്കുറിച്ചുള്ള യേശുവിന്റെ സവിശേഷ അഭിസംബോധനയാണ്; അധിക വ്യാഖ്യാനം ചേർക്കാതെ അത് നിലനിർത്തുന്നു.
- issue: ‘ഭൂതമുണ്ട്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഗ്രീക്കിലെ നേരിട്ടുള്ള പ്രയോഗം ‘എനിക്ക് ഭൂതമില്ല’ എന്ന് മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘എനിക്ക് ഭൂതബാധയില്ല’ അല്ലെങ്കിൽ ‘ഞാൻ ഭൂതബാധിതനല്ല’
  rationale: ἔχω + δαιμόνιον എന്ന മൂലഘടന സംരക്ഷിക്കുമ്പോഴും അതിന്റെ വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. ‘ബഹുമാനിക്കുന്നു/അപമാനിക്കുന്നു’ എന്ന വിരുദ്ധജോടിയിലൂടെ τιμῶ/ἀτιμάζετέ എന്ന ഗ്രീക്ക് പദവിരോധം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
