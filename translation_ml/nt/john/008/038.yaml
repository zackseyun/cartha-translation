  source_fidelity: 'പ്രധാനവാചകം ഗ്രീക്കിലെ വിരുദ്ധസമാന്തരത്വം നന്നായി നിലനിർത്തുന്നു: παρὰ + ദത്തിവിലെ ‘പിതാവിന്റെ സന്നിധിയിൽ’ എന്ന സാന്നിധ്യാർഥവും, παρὰ + ഷഷ്ഠിയിലെ ‘നിങ്ങളുടെ പിതാവിൽനിന്ന്’ എന്ന ഉറവിടാർഥവും വേർതിരിച്ചിരിക്കുന്നു. ἃ, ἑώρακα, λαλῶ, ἠκούσατε, ποιεῖτε എന്നിവയുടെ ആശയവും യോജ്യമാണ്. എന്നാൽ οὖν-ന് ‘അതുകൊണ്ട്’ അല്പം ശക്തമായ കാരണാർഥം നൽകുന്നു; ഇവിടെ ‘അപ്പോൾ’ കൂടുതൽ നേരിട്ടുള്ളതാണ്.'
  naturalness: ‘ഞാൻ പിതാവിന്റെ സന്നിധിയിൽ കണ്ടതു പറയുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘അപ്പോൾ’ ഉപയോഗിക്കുന്നത് വാക്യത്തിന്റെ സംഭാഷണപ്രവാഹം മെച്ചപ്പെടുത്തുന്നു. അടിക്കുറിപ്പ് b-യിലെ ആജ്ഞാർഥ ബദൽ രണ്ടാംപുരുഷ ബഹുവചനമായി നൽകണം; ‘ചെയ്യുക’ സാധാരണ ഏകവചന/ബഹുമാനരൂപമായി കേൾക്കാം.
  terminology: ‘പിതാവ്’ എന്ന പ്രയോഗം ആദ്യഭാഗത്തെ ദൈവസൂചനയും രണ്ടാംഭാഗത്തെ മനഃപൂർവം വ്യക്തമാക്കാത്ത വിരുദ്ധസൂചനയും സംരക്ഷിക്കുന്നു. രണ്ടാമത്തെ പിതാവിനെ പിശാച് എന്നു മുഖ്യവാചകത്തിൽ മുൻകൂട്ടി വ്യക്തമാക്കാതിരുന്നതു ശരിയാണ്.
