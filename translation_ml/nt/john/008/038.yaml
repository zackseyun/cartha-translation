id: JHN.8.38
reference: John 8:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: ml
  text: ഞാൻ പിതാവിന്റെ സന്നിധിയിൽ കണ്ടതു പറയുന്നു; അപ്പോൾ നിങ്ങളും നിങ്ങളുടെ പിതാവിൽനിന്നു[a] കേട്ടതു ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പിതാവിൽനിന്നു.’ ഗ്രീക്കിൽ ‘നിങ്ങളുടെ’ എന്ന പദമില്ല; എന്നാൽ സന്ദർഭം ഇവിടെ യേശുവിന്റെ പിതാവിനോടു വ്യത്യസ്തനായ അവരുടെ പിതാവിനെ സൂചിപ്പിക്കുന്നു (വാ. 44 കാണുക).'
    reason: മൂലവാചകത്തിലെ ഉടമസ്ഥതാസൂചനയുടെ അവ്യക്തത സംരക്ഷിക്കാൻ.
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘കേട്ടതു ചെയ്യുവിൻ.’ ഗ്രീക്കിലെ ക്രിയാരൂപം പ്രസ്താവനയായോ ആജ്ഞയായോ വായിക്കാം.'
    reason: ക്രിയാഭാവത്തിലെ വ്യാകരണപരമായ അവ്യക്തത രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: ἃ
  choice: കണ്ടതു / കേട്ടതു
  rationale: നപുംസകലിംഗ ബഹുവചന ആപേക്ഷിക സർവനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വസ്തുവാചക ഏകവചനരൂപത്തിൽ നൽകി; ‘കാര്യങ്ങൾ’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: ἑώρακα
  choice: കണ്ടതു
  rationale: പൂർണകാലരൂപം മുൻകാല ദർശനത്തിനും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും സൂചന നൽകുന്നു; സന്ദർഭത്തിൽ ‘കണ്ടതു’ സ്വാഭാവികമായി ഈ ആശയം വഹിക്കുന്നു.
- source_word: παρὰ τῷ πατρὶ
  choice: പിതാവിന്റെ സന്നിധിയിൽ
  rationale: παρά + ദത്തിവ് സമീപത്വമോ സാന്നിധ്യമോ സൂചിപ്പിക്കുന്നു. ‘പിതാവിൽനിന്ന്’ എന്ന ഉറവിടാർത്ഥത്തേക്കാൾ മൂലഭാഷയിലെ വ്യത്യാസം ഇത് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: λαλῶ
  choice: പറയുന്നു
  rationale: നേരിട്ടുള്ള കർമത്തോടുകൂടിയ ‘സംസാരിക്കുന്നു/പറയുന്നു’ എന്ന അർത്ഥം. മലയാളത്തിൽ ‘കണ്ടതു പറയുന്നു’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യവുമായി അനുമാനാത്മകമായ ബന്ധം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ എന്നും സാധ്യമാണ്.
- source_word: παρὰ τοῦ πατρὸς
  choice: നിങ്ങളുടെ പിതാവിൽനിന്നു
  rationale: παρά + ഷഷ്ഠി ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ഇല്ലെങ്കിലും സന്ദർഭത്തിലെ വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘നിങ്ങളുടെ’ ചേർത്തു; അടിക്കുറിപ്പിൽ കൂടുതൽ അക്ഷരാർഥരൂപം നൽകി.
- source_word: ποιεῖτε
  choice: ചെയ്യുന്നു
  rationale: വർത്തമാനകാലരൂപത്തെ അവരുടെ പ്രവൃത്തിയെ വിവരിക്കുന്ന പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു; രൂപം ആജ്ഞയായും വ്യാഖ്യാനിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: πατήρ / πατρὸς
  choice: പിതാവ് / പിതാവ്
  rationale: ആദ്യത്തേത് ദൈവത്തെ സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തേതിന്റെ വ്യക്തമായ തിരിച്ചറിയൽ ഈ വാക്യത്തിൽ മുൻകൂട്ടി നിർണ്ണയിക്കാതെ ‘നിങ്ങളുടെ പിതാവ്’ എന്നു മാത്രം നൽകി.
theological_decisions:
- issue: രണ്ടാമത്തെ ‘പിതാവ്’ ആരെന്നത് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘നിങ്ങളുടെ പിതാവ്’ എന്നു നൽകി, പിശാച് എന്നു നേരിട്ട് തിരിച്ചറിഞ്ഞില്ല.
  alternative: ‘പിതാവിൽനിന്ന്’ അല്ലെങ്കിൽ ‘പിശാചിൽനിന്ന്’
  rationale: വാക്യം 44-ൽ തിരിച്ചറിയൽ വ്യക്തമായിത്തീരുന്നുവെങ്കിലും ഇവിടെ മൂലവാചകം അത് തുറന്നുപറയുന്നില്ല. അതിനാൽ പ്രസംഗത്തിന്റെ ക്രമാനുഗതമായ വെളിപ്പെടുത്തലും ദൈവപിതാവും അവരുടെ പിതാവും തമ്മിലുള്ള വൈരുധ്യവും സംരക്ഷിച്ചു.
- issue: ποιεῖτε പ്രസ്താവനയോ ആജ്ഞയോ
  choice: ‘ചെയ്യുന്നു’ എന്ന പ്രസ്താവന
  alternative: ‘ചെയ്യുവിൻ/ചെയ്യുക’ എന്ന ആജ്ഞ
  rationale: ഉടൻ വരുന്ന സന്ദർഭത്തിൽ യേശു അവരുടെ നിലവിലുള്ള പ്രവൃത്തികളെ പിതൃത്വത്തിന്റെ തെളിവായി ചൂണ്ടിക്കാണിക്കുന്നതിനാൽ പ്രസ്താവന കൂടുതൽ യോജിക്കുന്നു; എങ്കിലും ഗ്രീക്കുരൂപത്തിന്റെ വ്യാകരണപരമായ അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സന്നിധിയിൽ’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ παρά + ദത്തിവിന്റെ സാന്നിധ്യാർത്ഥം നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാഭാഷ ഒഴിവാക്കി.
