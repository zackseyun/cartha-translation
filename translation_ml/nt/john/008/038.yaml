  to: ഞാൻ പിതാവിന്റെ സന്നിധിയിൽ കണ്ടതു പറയുന്നു; അപ്പോൾ നിങ്ങളും നിങ്ങളുടെ പിതാവിൽനിന്നു[a] കേട്ടതു ചെയ്യുന്നു.[b]
  rationale: മുഖ്യവാചകത്തിന്റെ അർഥം മാറ്റാതെ οὖν-ന്റെ ബന്ധസൂചനയെ മലയാളത്തിൽ കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ ‘അതുകൊണ്ട്’ എന്നത് ‘അപ്പോൾ’ എന്നാക്കി. കൂടാതെ, ഗ്രീക്ക് രൂപത്തിന്റെ ആജ്ഞാർഥസാദ്ധ്യത സൂചിപ്പിക്കുന്ന അടിക്കുറിപ്പിലെ മലയാള ബഹുവചനരൂപം തിരുത്തി.
