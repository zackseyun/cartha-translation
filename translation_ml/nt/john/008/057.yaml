source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദർ[a] അവനോട് പറഞ്ഞു: “നിനക്ക് ഇനിയും അമ്പതു വയസ്സായിട്ടില്ല; എന്നിട്ടും നീ അബ്രാഹാമിനെ കണ്ടിട്ടുണ്ടോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യർ”; സന്ദർഭത്തിൽ ഈ പദം എത്ര വിശാലമായ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു എന്നതനുസരിച്ച് “യെഹൂദനേതാക്കൾ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: യോഹന്നാനിലെ സാധാരണ വിവരണപദത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം. ഈ സന്ദർഭത്തിൽ നേതാക്കളെ മാത്രം ഉദ്ദേശിക്കുന്നതായി ഗ്രീക്ക് വാചകം വ്യക്തമാക്കാത്തതിനാൽ അർത്ഥം ചുരുക്കിയിട്ടില്ല.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാക്കിനോടുള്ള പ്രതികരണപരമായ കഥാസംബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: നിനക്ക് ഇനിയും അമ്പതു വയസ്സായിട്ടില്ല
  rationale: പ്രായം വർഷങ്ങളായി ‘ഉണ്ട്’ എന്നു പറയുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവിക മലയാള പ്രായപ്രയോഗമായി നൽകിയിരിക്കുന്നു.
- source_word: καὶ
  choice: എന്നിട്ടും
  rationale: ഇവിടെ വെറും കൂട്ടിച്ചേർക്കലിനെക്കാൾ ശക്തമായ അവിശ്വാസജന്യ വൈരുധ്യമാണ് ചോദ്യത്തിൽ പ്രകടമാകുന്നത്; മലയാളത്തിൽ ‘എന്നിട്ടും’ അത് സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ἑώρακας
  choice: കണ്ടിട്ടുണ്ടോ
  rationale: ὁράω എന്ന ക്രിയയുടെ perfect രൂപത്തിലെ ഇതുവരെ പ്രസക്തമായ അനുഭവ/ഫലഭാവം മലയാളത്തിലെ ‘കണ്ടിട്ടുണ്ട്’ എന്ന രൂപം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: Ἀβραὰμ
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതമായ പേരുരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: യോഹന്നാനിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: യെഹൂദർ
  alternative: യെഹൂദ്യർ; യെഹൂദനേതാക്കൾ
  rationale: മൂലവാചകം ഇവിടെ നേതാക്കളെ മാത്രം പ്രത്യേകം പറയുന്നില്ല. അതിനാൽ മുഖ്യവാചകത്തിൽ വിശാലവും നേരിട്ടുള്ളതുമായ രൂപം നിലനിർത്തി; സന്ദർഭാനുസൃതമായി സാധ്യമായ മറ്റു പരിധികൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സംസാരത്തിലെ അവിശ്വാസഭാവം ‘എന്നിട്ടും ... കണ്ടിട്ടുണ്ടോ?’ എന്ന സ്വാഭാവിക ചോദ്യഘടനയിൽ നിലനിർത്തി.
