id: JHN.8.55
reference: John 8:55
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: ml
  text: എന്നിട്ടും നിങ്ങൾ അവനെ അറിഞ്ഞിട്ടില്ല[a]; എന്നാൽ ഞാൻ അവനെ അറിയുന്നു. അവനെ അറിയുന്നില്ലെന്ന് ഞാൻ പറഞ്ഞാൽ[b], നിങ്ങളെപ്പോലെ ഞാനും കള്ളം പറയുന്നവനായിരിക്കും. എന്നാൽ ഞാൻ അവനെ അറിയുകയും അവന്റെ വചനം പാലിക്കുകയും ചെയ്യുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾ അവനെ അറിയുന്നില്ല.’ ഗ്രീക്ക് ക്രിയ പൂർണകാലരൂപത്തിലാണ്; ഇപ്പോഴും തുടരുന്ന യഥാർഥ അറിവില്ലായ്മയ്ക്ക് അത് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെ അറിയുന്നില്ലെന്ന് ഞാൻ പറയുകയാണെങ്കിൽ.’ ഗ്രീക്ക് പ്രയോഗം ഒരു സാങ്കൽപ്പിക നിബന്ധനയാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘പാലിക്കുന്നു’ എന്നത് ‘അനുസരിക്കുന്നു,’ ‘ആചരിക്കുന്നു,’ അല്ലെങ്കിൽ ‘കാത്തുസൂക്ഷിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. യോഹന്നാനിൽ ഈ ക്രിയ ദൈവത്തിന്റെ വചനം വിശ്വസ്തമായി പാലിക്കുകയും കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്ന ആശയം പലപ്പോഴും വഹിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: അറിഞ്ഞിട്ടില്ല
  rationale: ഗ്രീക്കിലെ പൂർണകാലരൂപം മുൻകാലംമുതൽ ഇപ്പോഴും തുടരുന്ന യഥാർഥ അറിവില്ലായ്മയെ സൂചിപ്പിക്കാം; മലയാളത്തിലെ ‘അറിഞ്ഞിട്ടില്ല’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οἶδα
  choice: അറിയുന്നു
  rationale: രൂപത്തിൽ പൂർണകാലമായിരുന്നാലും οἶδα വർത്തമാനാവസ്ഥ സൂചിപ്പിക്കുന്ന ‘അറിയുക’ എന്ന അർഥത്തിലാണ്; അതിനാൽ വർത്തമാനകാലം യോജിക്കുന്നു.
- source_word: κἂν εἴπω
  choice: ഞാൻ പറഞ്ഞാൽ
  rationale: സാങ്കൽപ്പിക നിബന്ധന മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘പറയുകയാണെങ്കിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ἔσομαι
  choice: ആയിരിക്കും
  rationale: നിബന്ധനയുടെ സാങ്കൽപ്പിക ഫലം മലയാളത്തിൽ ‘ആയിരിക്കും’ എന്ന രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅμοιος ὑμῖν
  choice: നിങ്ങളെപ്പോലെ
  rationale: എതിരാളികളോടുള്ള നേരിട്ടുള്ള താരതമ്യത്തിന്റെ മൂർച്ച നിലനിർത്തുന്നു.
- source_word: ψεύστης
  choice: ഒരു നുണയൻ
  rationale: വെറും തെറ്റുപറയുന്നയാൾ എന്നതിലുപരി കള്ളം പറയുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപദത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὸν λόγον αὐτοῦ
  choice: അവന്റെ വചനം
  rationale: λόγος എന്ന പദത്തിലെ വാക്ക്/സന്ദേശം എന്നീ സാധ്യതകൾ നിലനിർത്തുകയും യോഹന്നാന്റെ ശൈലിയോട് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: τηρῶ
  choice: പാലിക്കുന്നു
  rationale: τηρέωയിലെ അനുസരിക്കുക, കാത്തുസൂക്ഷിക്കുക, ആചരിക്കുക എന്നീ അർഥവ്യാപ്തി സന്ദർഭോചിതമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
- source_word: καὶ ... δὲ
  choice: എന്നിട്ടും ... എന്നാൽ
  rationale: മുൻവാക്യത്തോടും യേശുവും എതിരാളികളും തമ്മിലുമുള്ള വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെ അറിയുന്നതിലുള്ള യേശുവിന്റെ അവകാശവാദവും എതിരാളികളുമായുള്ള വൈരുധ്യവും
  choice: യഥാർഥ അറിവും അവന്റെ വചനം പാലിക്കുന്നതും സംബന്ധിച്ച അവകാശവാദം വിശദീകരണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പ്രത്യേക ദൈവപുത്രത്വത്തെ എടുത്തുപറയുന്ന വിശദീകരണം ചേർക്കുക, അല്ലെങ്കിൽ ‘അറിയുന്നു’ എന്നതിനെ വെറും പരിചയമായി മൃദൂകരിക്കുക.
  rationale: മൂലവാക്യം യേശുവിന്റെ അറിവും എതിരാളികളുടെ അറിവില്ലായ്മയും തമ്മിൽ ശക്തമായ വൈരുധ്യം സ്ഥാപിക്കുന്നു. പാഠത്തിന് പുറത്തുള്ള സിദ്ധാന്തവികാസം ചേർക്കാതെയും അവകാശവാദത്തിന്റെ ശക്തി കുറയ്ക്കാതെയും അത് നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനം’ യോഹന്നാനിലെ പദപ്രയോഗപരമായ ബന്ധം നിലനിർത്തുന്നു; ‘നുണയൻ’ നേരിട്ടുള്ള കുറ്റപ്പെടുത്തലിന്റെ മൂർച്ച സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കുശേഷം നൽകിയിരിക്കുന്നു.
