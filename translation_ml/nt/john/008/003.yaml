lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: കൊണ്ടുവന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി; സ്ത്രീയെ യേശുവിന്റെ അടുക്കലേക്ക് കൊണ്ടുവരുന്നതാണ് സന്ദർഭം.
- source_word: γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: യഹൂദ തിരുവെഴുത്തുകളിലും ന്യായപ്രമാണത്തിലും പ്രാവീണ്യമുള്ളവരെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദം.
- source_word: ἐν μοιχείᾳ κατειλημμένην (καταλαμβάνω)
  choice: വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തം അവൾ വ്യഭിചാരത്തിൽ ഏർപ്പെട്ടിരിക്കെ കണ്ടെത്തപ്പെട്ടുവെന്ന ആശയം നൽകുന്നു; ‘പിടിക്കപ്പെട്ട’ എന്നത് അത് സ്വാഭാവികമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു.
- source_word: στήσαντες (ἵστημι)
  choice: നിർത്തിയശേഷം
  rationale: അവർ അവളെ കൂട്ടത്തിന്റെ നടുവിൽ ബോധപൂർവം നിർത്തിയ പ്രവൃത്തിയെയും മുഖ്യക്രിയയ്ക്കു മുൻപുള്ള കൃദന്തബന്ധത്തെയും വ്യക്തമാക്കുന്നു.
- source_word: ἐν μέσῳ (μέσος)
  choice: നടുവിൽ
  rationale: സന്നിഹിതരായവരുടെ മധ്യത്തിൽ അവളെ നിർത്തിയതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
