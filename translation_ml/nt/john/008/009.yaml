source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: ml
  text: അതു കേട്ടവർ[a], മനസ്സാക്ഷിയാൽ കുറ്റം ബോധ്യപ്പെട്ട്, മൂത്തവരിൽ തുടങ്ങി ഒടുവിലുള്ളവർവരെ[b] ഓരോരുത്തരായി പുറത്തേക്കു പോയി. യേശു മാത്രം ശേഷിച്ചു; ആ സ്ത്രീ നടുവിൽ നിന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള ഭാഗത്തിന്റെ (യോഹന്നാൻ 7:53–8:11) തുടർച്ചയാണ്. യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവസാനത്തേവരെ.’
    reason: previous_rendering
lexical_decisions:
- source_word: συνείδησις
  choice: മനസ്സാക്ഷി
  rationale: ശരിയും തെറ്റും തിരിച്ചറിയുകയും ഒരാളുടെ പ്രവൃത്തിയെക്കുറിച്ച് ഉള്ളിൽ സാക്ഷ്യം പറയുകയും ചെയ്യുന്ന ധാർമിക ബോധത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദം.
- source_word: ἐλέγχω
  choice: കുറ്റം ബോധ്യപ്പെടുക
  rationale: ഇവിടെ പുറമേയുള്ള ശാസനയെക്കാൾ മനസ്സാക്ഷി മുഖേന സ്വന്തം കുറ്റം ഉള്ളിൽ തിരിച്ചറിയുന്നതാണ് ആശയം; അതിനാൽ ‘കുറ്റം ബോധ്യപ്പെട്ട്’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: πρεσβύτερος
  choice: മൂത്തവർ
  rationale: ഇവിടെ ഔദ്യോഗിക സ്ഥാനമായ ‘മൂപ്പന്മാർ’ എന്നതിലുപരി പ്രായത്തെയോ മുതിർച്ചയെയോ സൂചിപ്പിക്കുന്ന ക്രമമാണ് സന്ദർഭത്തിൽ പ്രധാനമെന്ന് തോന്നുന്നു; ‘മൂത്തവർ’ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: εἷς καθ' εἷς
  choice: ഓരോരുത്തരായി
  rationale: ഒരാൾക്കുപിന്നാലെ മറ്റൊരാൾ എന്ന വിതരണാത്മക അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: നടുവിൽ നിന്നുകൊണ്ടിരുന്നു
  rationale: സ്ത്രീ അവളെ നിർത്തിയിരുന്ന കൂട്ടത്തിന്റെ നടുവിലുള്ള സ്ഥാനത്ത് തുടർന്നും നിൽക്കുന്നതിനെ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πρεσβυτέρων എന്നത് പ്രായമോ ഔദ്യോഗിക പദവിയോ
  choice: പ്രായത്തിൽ മൂത്തവർ എന്ന അർഥത്തിൽ ‘മൂത്തവർ’
  alternative: സഭയിലെയോ സമൂഹത്തിലെയോ ഔദ്യോഗിക ‘മൂപ്പന്മാർ’
  rationale: ‘തുടങ്ങി ... വരെ’ എന്ന ക്രമസൂചനയും എതിർ അറ്റമായ ἐσχάτων എന്ന പദവും പ്രായമോ മുതിർച്ചയോ അടിസ്ഥാനമായുള്ള വായനയ്ക്ക് കൂടുതൽ പിന്തുണ നൽകുന്നു; ഔദ്യോഗിക പദവി അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: κατελείφθη μόνος ὁ Ἰησοῦς καὶ ἡ γυνή എന്ന വാക്യത്തിലെ ‘യേശു മാത്രം’ എന്ന ആശയവും സ്ത്രീയുടെ സാന്നിധ്യവും
  choice: ‘യേശു മാത്രം ശേഷിച്ചു; ആ സ്ത്രീ നടുവിൽ നിന്നുകൊണ്ടിരുന്നു’ എന്നിങ്ങനെ ഇരുവശവും നിലനിർത്തി
  alternative: ‘യേശുവും സ്ത്രീയും മാത്രം ശേഷിച്ചു’
  rationale: മൂലത്തിൽ μόνος പ്രത്യേകമായി യേശുവിനെ വിശേഷിപ്പിക്കുന്നതിനാൽ ആ ഊന്നൽ മായ്ക്കാതെ, സ്ത്രീ അവിടെ ഉണ്ടായിരുന്നുവെന്ന തുടർവാക്യവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ഗൗരവമുള്ള വിവരണശൈലി നിലനിർത്തി. ‘മനസ്സാക്ഷിയാൽ കുറ്റം ബോധ്യപ്പെട്ട്’ എന്ന പ്രയോഗം ധാർമിക-ആന്തരിക അർഥം വ്യക്തമാക്കുന്നു; ‘മൂത്തവർ’ ഔദ്യോഗിക സഭാപദവി സൂചിപ്പിക്കാതിരിക്കാൻ തെരഞ്ഞെടുത്തു.
