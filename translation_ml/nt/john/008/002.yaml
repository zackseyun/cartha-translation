id: JHN.8.2
reference: John 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ὄρθρου δὲ πάλιν παρεγένετο εἰς τὸ ἱερόν, καὶ πᾶς ὁ λαὸς ἤρχετο πρὸς αὐτόν· καὶ καθίσας ἐδίδασκεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: ml
  text: പുലർച്ചെ അവൻ വീണ്ടും ദൈവാലയത്തിലേക്കു വന്നു. ജനമെല്ലാം അവന്റെ അടുക്കൽ വന്നുകൊണ്ടിരുന്നു; അവൻ ഇരുന്ന് അവരെ പഠിപ്പിച്ചുതുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള വിവരണത്തിന്റെ (യോഹന്നാൻ 7:53–8:11) തുടർച്ചയാണ്. ആ വിവരണം ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല. യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: പുലർച്ചെ
  rationale: സൂര്യോദയത്തോടടുത്ത പ്രഭാതസമയത്തെ സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: παρεγένετο
  choice: വന്നു
  rationale: ഒരു സ്ഥലത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; εἰς τὸ ἱερόν എന്ന ലക്ഷ്യസ്ഥാനത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἱερόν
  choice: ദൈവാലയം
  rationale: അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, പൊതുവായി പഠിപ്പിക്കാവുന്ന മുഴുവൻ ദൈവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ പതിവായ മലയാള പദം മതിയാകുന്നു.
- source_word: πᾶς ὁ λαὸς
  choice: ജനമെല്ലാം
  rationale: ജനക്കൂട്ടത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἤρχετο
  choice: വന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: καθίσας
  choice: ഇരുന്ന്
  rationale: പഠിപ്പിക്കുന്നതിനു മുമ്പുണ്ടായ ഇരിക്കൽ എന്ന പ്രവർത്തനം മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐδίδασκεν
  choice: പഠിപ്പിച്ചുതുടങ്ങി
  rationale: അപൂർണഭൂതകാലത്തിന് ഇവിടെ സാധ്യമായ ആരംഭസൂചനയെ നിലനിർത്തുന്നു; തുടർച്ചയായ അർഥത്തിനും സാധ്യതയുണ്ടെങ്കിലും മുൻപുള്ള ഇരിക്കൽപ്രവർത്തനത്തിനു ശേഷം പഠിപ്പിക്കൽ ആരംഭിച്ചതെന്ന വായന സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ‘ദൈവാലയം’ പൊതുവായ വായനക്കാർക്ക് പരിചിതമായ പദമായി ഉപയോഗിച്ചു; ‘വന്നുകൊണ്ടിരുന്നു’ എന്ന രൂപം ജനങ്ങൾ തുടർച്ചയായി അവന്റെ അടുക്കൽ എത്തിക്കൊണ്ടിരുന്നുവെന്ന ഭാവം നൽകുന്നു.
