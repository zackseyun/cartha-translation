id: JHN.8.22
reference: John 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: ml
  text: 'അപ്പോൾ യെഹൂദർ[a] ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “അവൻ തന്നെത്താൻ കൊല്ലുമോ? ‘ഞാൻ പോകുന്നിടത്തേക്ക് നിങ്ങൾക്കു വരാൻ കഴിയില്ല’ എന്നു അവൻ പറയുന്നുവല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന വിഭാഗത്തിന്റെ വ്യാപ്തി അനുസരിച്ച്, “യെഹൂദ്യർ” എന്നോ “യെഹൂദനേതാക്കൾ” എന്നോ ആകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ നിന്നുള്ള അവരുടെ നിഗമനത്തെയും ആഖ്യാനബന്ധത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: ഗ്രീക്ക് പദപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭം അനുസരിച്ച് യെഹൂദ്യരെയോ യെഹൂദനേതാക്കളെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Μήτι
  choice: …എന്നാണോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന സംശയചോദ്യമാണ്; മലയാളത്തിൽ ഈ രൂപം അവരുടെ അവിശ്വാസപൂർണമായ ഊഹം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: അവൻ തന്നെത്താൻ കൊല്ലും
  rationale: ക്രിയയുടെ പ്രതിഫലനാർഥം വ്യക്തവും നേരിട്ടുമായി നൽകുന്നു.
- source_word: ὅτι
  choice: …എന്നു പറയുന്നതിനാൽ
  rationale: യേശുവിന്റെ വാക്കിൽനിന്നാണ് അവർ ഈ ഊഹം ഉന്നയിക്കുന്നതെന്ന കാരണബന്ധം പ്രകടമാക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നതിനാൽ
  rationale: വർത്തമാനകാലത്തിന്റെ ആശയം കാരണവാക്യത്തിൽ സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: താൻ പോകുന്നിടത്തേക്ക്
  rationale: ഉദ്ധരിച്ച വാക്കുകൾ അവരുടെ സംസാരത്തിനകത്ത് പരോക്ഷ ഉദ്ധരണിയായി സ്വാഭാവികമായി ചേരുന്നതിനാൽ ഒന്നാംപുരുഷമായ ‘ഞാൻ’ എന്നത് ‘താൻ’ ആയി മാറുന്നു; ὑπάγω എന്നതിന്റെ പോകുക/വിട്ടുപോകുക എന്ന ചലനാർഥം അമിതമായി വിശദീകരിക്കാതെ നൽകുന്നു.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: നിങ്ങൾക്കു വരാൻ കഴിയില്ല
  rationale: δύνασθε സൂചിപ്പിക്കുന്ന അസാധ്യതയെ വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ οἱ Ἰουδαῖοι എന്ന പ്രയോഗത്തിന്റെ സൂചിതവിഭാഗം
  choice: പ്രധാനപാഠത്തിൽ ‘യെഹൂദർ’ എന്നു നിലനിർത്തുക
  alternative: ‘യെഹൂദ്യർ’ അല്ലെങ്കിൽ ‘യെഹൂദനേതാക്കൾ’
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘യെഹൂദർ’ എന്നാണ്. യോഹന്നാന്റെ സന്ദർഭത്തിൽ ചിലപ്പോൾ യെഹൂദ്യയിലെ എതിരാളികളെയോ അധികാരികളെയോ സൂചിപ്പിക്കാമെങ്കിലും ഈ വാക്യം മാത്രം സൂചിതവിഭാഗത്തെ വ്യക്തമായി ചുരുക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം പ്രധാനപാഠത്തിൽ വരുത്താതെ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ തുടരുന്ന സംസാരഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നു നൽകി. പ്രധാനപാഠത്തിലെ ചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ യേശുവിന്റെ വാക്കുകൾ പരോക്ഷ ഉദ്ധരണിയായി ചേർത്തിട്ടുണ്ടെങ്കിലും ഉള്ളടക്കവും സംശയഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
