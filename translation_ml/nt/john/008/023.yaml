id: JHN.8.23
reference: John 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞുകൊണ്ടിരുന്നു: “നിങ്ങൾ താഴെനിന്നുള്ളവർ; ഞാൻ മുകളിൽനിന്നുള്ളവൻ.[a] നിങ്ങൾ ഈ ലോകത്തിൽനിന്നുള്ളവർ; ഞാൻ ഈ ലോകത്തിൽനിന്നുള്ളവനല്ല.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ താഴെയുള്ളവയിൽനിന്നുള്ളവർ; ഞാൻ മുകളിലുള്ളവയിൽനിന്നുള്ളവൻ.”
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ സുവിശേഷത്തിൽ “ലോകം” എന്നത് പലപ്പോഴും ഭൗതിക ഭൂമിയെ മാത്രമല്ല, ദൈവത്തിൽനിന്ന് അകന്നുനിൽക്കുന്ന മനുഷ്യക്രമത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന സംസാരത്തെ സൂചിപ്പിക്കാം; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം നിലനിർത്തുന്നു.
- source_word: Ὑμεῖς / ἐγώ
  choice: നിങ്ങൾ / ഞാൻ
  rationale: ഗ്രീക്കിലെ പ്രകടമായ സർവനാമങ്ങൾ ഊന്നലും യേശുവും കേൾവിക്കാരും തമ്മിലുള്ള വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: താഴെയുള്ളതിൽനിന്നുള്ളവർ / മുകളിലുള്ളതിൽനിന്നുള്ളവൻ
  rationale: ἐκ എന്നതിലെ ഉറവിടം/ഉത്ഭവം എന്ന ആശയവും ലംബമായ വൈരുധ്യവും സംരക്ഷിക്കുന്നു; ‘അധോലോകം/സ്വർഗം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ പദത്തിന്റെ ഭൗതികവും മാനുഷിക-ദൈവവിമുഖ ക്രമവുമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന സാധാരണ മലയാളപദമാണിത്.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിൽനിന്ന്
  rationale: രണ്ടിടത്തെയും ചൂണ്ടുപദവും ആവർത്തിക്കുന്ന ἐκ ഘടനയും നിലനിർത്തി ഉത്ഭവം/ബന്ധപ്പെട്ട മേഖല എന്ന ആശയം പ്രകടമാക്കുന്നു.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: ഞാൻ ഈ ലോകത്തിൽനിന്നുള്ളവനല്ല
  rationale: ‘ഈ ലോകത്തിൽപ്പെട്ടവനല്ല’ എന്ന ആശയവിവർത്തനത്തേക്കാൾ ഉറവിടം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: ‘താഴെയുള്ളത്/മുകളിലുള്ളത്’ എന്നും ‘ഈ ലോകം’ എന്നും ഉള്ള വൈരുധ്യത്തിന്റെ അർത്ഥം
  choice: ഉത്ഭവത്തെയും മേഖലയെയും സൂചിപ്പിക്കുന്ന രൂപകഭാഷ അതേപടി സംരക്ഷിച്ചു.
  alternative: വൈരുധ്യത്തെ ‘ഭൂമിയിൽനിന്ന്/സ്വർഗത്തിൽനിന്ന്’ എന്നോ വ്യക്തമായ ധാർമിക വൈരുധ്യമായോ വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് ശക്തമായ യോഹന്നാനീയവും ക്രിസ്തുശാസ്ത്രപരവുമായ വൈരുധ്യം അവതരിപ്പിക്കുന്നുവെങ്കിലും അതിനെ ഒരു പ്രത്യേക വിശദീകരണത്തിലേക്ക് ചുരുക്കുന്നില്ല; വിവർത്തനവും ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർത്ഥവ്യാപ്തിയും നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആവർത്തനവും ‘നിങ്ങൾ/ഞാൻ’ എന്ന ഊന്നലും മൂലപാഠത്തിലെ വൈരുധ്യം നിലനിർത്താൻ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
