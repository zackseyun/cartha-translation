reference: John 8:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: ml
  text: 'അതുകൊണ്ട് യേശു പറഞ്ഞു: “നിങ്ങൾ മനുഷ്യപുത്രനെ ഉയർത്തുമ്പോൾ[b], അപ്പോൾ നിങ്ങൾ അറിയും: ‘ഞാനാണ്[a]; ഞാൻ എന്റെ സ്വന്തം നിലയിൽ ഒന്നും ചെയ്യുന്നില്ല; പിതാവ് എന്നെ പഠിപ്പിച്ചതുപോലെ ഞാൻ ഈ കാര്യങ്ങൾ പറയുന്നു.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ ആകുന്നു.” ഗ്രീക്കിൽ പ്രകടമായ ഒരു വിധേയപദവുമില്ലാതെ “ഞാൻ ആകുന്നു” (ἐγώ εἰμι) എന്നു മാത്രമാണ്.'
    reason: alternative_reading
  - marker: b
    text: “ഉയർത്തുക” എന്നത് ശാരീരികമായി മുകളിലേക്ക് ഉയർത്തുന്നതിനെയും, യോഹന്നാന്റെ പ്രയോഗത്തിൽ മഹത്ത്വത്തിലേക്ക് ഉയർത്തുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻ സംഭാഷണത്തിൽനിന്നുള്ള തുടർച്ചയും നിഗമനസ്വഭാവവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ὅταν
  choice: ഉയർത്തുമ്പോൾ എന്നതിലെ ‘-ുമ്പോൾ’
  rationale: ആവർത്തിച്ചുണ്ടാകുന്ന സംഭവമല്ല, ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന ഒരു പ്രത്യേക സംഭവമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: ὑψώσητε
  choice: ഉയർത്തുമ്പോൾ
  rationale: ശാരീരികമായി ഉയർത്തുന്നതിനെയും മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടുന്നതിനെയും സൂചിപ്പിക്കാവുന്ന യോഹന്നാനീയ ദ്വയാർഥം നിലനിർത്തുന്നു; ‘ക്രൂശിക്കുമ്പോൾ’ എന്ന് വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രനെ
  rationale: സുവിശേഷങ്ങളിലെ സ്ഥിരമായ സ്വയംവിശേഷണവും അതിന്റെ തിരുവെഴുത്താന്തര പ്രതിധ്വനികളും നിലനിർത്തുന്നു.
- source_word: γνώσεσθε
  choice: അപ്പോൾ നിങ്ങൾ അറിയും
  rationale: ഭാവിയിൽ ഉണ്ടാകുന്ന തിരിച്ചറിവിനെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐγώ εἰμι
  choice: ഞാനാണ്
  rationale: പ്രകടമായ വിധേയം ഇല്ലാത്ത ഗ്രീക്ക് പ്രയോഗത്തിന് മലയാളത്തിലെ സ്വാഭാവികമായ അപൂർണവാക്യരൂപം നൽകുന്നു; അതിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: ഞാൻ സ്വയം
  rationale: സ്വതന്ത്രമായ ഉറവിടത്തിൽനിന്നോ സ്വന്തം മുൻകൈയാലോ ചെയ്യുക എന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ποιῶ οὐδέν
  choice: ഒന്നും ചെയ്യുന്നില്ല
  rationale: യേശുവിന്റെ പ്രവർത്തനത്തെക്കുറിച്ചുള്ള പൊതുവായ വർത്തമാനകാല പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: പിതാവ് എന്നെ പഠിപ്പിച്ചതുപോലെതന്നെ
  rationale: καθώς എന്നതിലെ കൃത്യമായ അനുരൂപതയുടെ ഊന്നൽ ‘പോലെതന്നെ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ταῦτα λαλῶ
  choice: ഇവ സംസാരിക്കുന്നു
  rationale: ταῦτα എന്ന സൂചനാപദവും λαλέω എന്നതിലെ സംസാരിക്കൽ എന്ന ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിധേയമില്ലാത്ത ἐγώ εἰμι എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ഞാനാണ്
  alternative: ഞാൻ ആകുന്നു
  rationale: വാക്യം സ്വാഭാവിക മലയാളത്തിൽ വായിക്കാവുന്നതാക്കുമ്പോഴും ആരാണ്/എന്താണ് എന്നത് തുറന്ന നിലയിൽ വെക്കുന്നു. ദൈവിക സ്വയംവെളിപ്പെടുത്തലിലേക്കുള്ള സാധ്യതയുള്ള സൂചനയെ നിർബന്ധിതമായി ഉറപ്പിക്കുകയോ ഇല്ലാതാക്കുകയോ ചെയ്യുന്നില്ല; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ὑψώσητε എന്ന ക്രിയയുടെ യോഹന്നാനീയ അർഥവ്യാപ്തി
  choice: ഉയർത്തുമ്പോൾ
  alternative: ക്രൂശിക്കുമ്പോൾ; മഹത്ത്വപ്പെടുത്തുമ്പോൾ
  rationale: ക്രൂശിൽ ശാരീരികമായി ഉയർത്തപ്പെടുന്നതും മഹത്ത്വത്തിലേക്ക് ഉയർത്തപ്പെടുന്നതും ഒരുമിച്ച് പ്രതിധ്വനിക്കാവുന്ന ദ്വയാർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘മനുഷ്യപുത്രൻ’, ‘പിതാവ്’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, അമിതപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി. അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കുതന്നെ ചേർത്തിരിക്കുന്നു.
