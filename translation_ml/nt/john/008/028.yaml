revisions:
- from: 'അതുകൊണ്ട് യേശു പറഞ്ഞു: “നിങ്ങൾ മനുഷ്യപുത്രനെ ഉയർത്തുമ്പോൾ[b], ഞാനാണ്[a] എന്നും ഞാൻ സ്വയം ഒന്നും ചെയ്യുന്നില്ലെന്നും, പിതാവ് എന്നെ പഠിപ്പിച്ചതുപോലെതന്നെ ഇവ സംസാരിക്കുന്നുവെന്നും അപ്പോൾ നിങ്ങൾ അറിയും.”'
  to: 'അതുകൊണ്ട് യേശു പറഞ്ഞു: “നിങ്ങൾ മനുഷ്യപുത്രനെ ഉയർത്തുമ്പോൾ[b], അപ്പോൾ നിങ്ങൾ അറിയും: ‘ഞാനാണ്[a]; ഞാൻ എന്റെ സ്വന്തം നിലയിൽ ഒന്നും ചെയ്യുന്നില്ല; പിതാവ് എന്നെ പഠിപ്പിച്ചതുപോലെ ഞാൻ ഈ കാര്യങ്ങൾ പറയുന്നു.’”'
  rationale: The revision retains the key ambiguities of ἐγώ εἰμι and ὑψώσητε, while making the three coordinated assertions clear in natural modern Malayalam. It also renders ἀπ’ ἐμαυτοῦ with a phrase that better reflects independent source or initiative, without importing a doctrinal interpretation.
