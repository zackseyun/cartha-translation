  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: ml
  text: എന്നെ അയച്ചവൻ എന്നോടുകൂടെ ഉണ്ട്. അവൻ എന്നെ ഒറ്റയ്ക്കു വിട്ടിട്ടില്ല; കാരണം, അവനു പ്രസാദകരമായതു ഞാൻ എപ്പോഴും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: എന്നെ അയച്ചവൻ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് ഭൂതകാല കൃദന്തത്തിന്റെ ബന്ധപരമായ രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പിതാവാണ് സൂചിതനെങ്കിലും അതു നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: എന്നോടുകൂടെ ഉണ്ട്
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന കൂടെയുണ്ടായിരിക്കുക എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: അവൻ എന്നെ തനിച്ചാക്കിയിട്ടില്ല
  rationale: ἀφῆκεν എന്ന aorist രൂപത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിലെ -യിട്ടില്ല രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു; μόνον എന്നത് കർത്താവിനെ ഒറ്റയ്ക്കാക്കുക എന്ന predicative അർഥത്തിൽ ‘തനിച്ച്’ എന്നു നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ഇവിടെ ὅτι മുൻപ്രസ്താവനയുടെ കാരണം അവതരിപ്പിക്കുന്നതിനാൽ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: അവനു പ്രസാദകരമായതു
  rationale: ‘അവനു പ്രസാദകരമായ കാര്യങ്ങൾ’ എന്ന ഗ്രീക്ക് substantival neuter plural ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംഗ്രഹിക്കുന്നു; പ്രസാദകരം എന്ന പദം ἀρεστός എന്നതിന്റെ വിലയിരുത്തൽഭാവം നിലനിർത്തുന്നു.
- source_word: ποιῶ πάντοτε
  choice: ഞാൻ എപ്പോഴും ചെയ്യുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ പതിവായ/തുടർച്ചയായ പ്രവർത്തനവും πάντοτε സൂചിപ്പിക്കുന്ന സ്ഥിരതയും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ സൂചിതൻ
  choice: പിതാവ് എന്ന് വിശദീകരിച്ചു ചേർക്കാതെ ഗ്രീക്കിലെ ബന്ധപരമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘എന്നെ അയച്ച പിതാവ്’ എന്ന് വ്യക്തമാക്കുക.
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ സൂചിതൻ പിതാവാണെങ്കിലും മൂലപാഠം ‘അയച്ചവൻ’ എന്ന പ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്; അതു നിലനിർത്തുന്നത് യോഹന്നാന്റെ ശൈലി സംരക്ഷിക്കുകയും പാഠത്തിൽ ഇല്ലാത്ത നാമം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀφῆκεν എന്ന aorist രൂപത്തിന്റെ കാലഭാവം
  choice: ‘തനിച്ചാക്കിയിട്ടില്ല’ എന്ന് ഇപ്പോഴത്തെ പ്രസക്തിയുള്ള പൂർത്തിരൂപത്തിൽ നൽകി.
  alternative: ‘തനിച്ചാക്കിയില്ല’ എന്ന ലളിത ഭൂതകാലം.
  rationale: ഗ്രീക്ക് aorist ഒരു സംഭവത്തെ സമഗ്രമായി അവതരിപ്പിക്കുമ്പോഴും ഇവിടെ മുൻവാക്യത്തിലെ ‘എന്നോടുകൂടെ ഉണ്ട്’ എന്ന തുടർന്നുള്ള സാന്നിധ്യവുമായി ബന്ധമുണ്ട്; മലയാളത്തിലെ -യിട്ടില്ല രൂപം ആ പ്രസക്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- issue: ‘കാരണം’ എന്ന പ്രസ്താവനയുടെ ദൈവശാസ്ത്രപരമായ ബന്ധം
  choice: ὅτιയുടെ നേരിട്ടുള്ള കാരണാർഥം നിലനിർത്തി; അതിന്റെ വ്യാപകമായ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിച്ചില്ല.
  alternative: ഇത് യേശുവിന്റെ അനുസരണമാണ് പിതാവിന്റെ സാന്നിധ്യത്തിന് യോഗ്യത നേടിക്കൊടുക്കുന്നത് എന്നോ, സാന്നിധ്യത്തിന്റെ തെളിവു മാത്രമാണെന്നോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യത്തിന്റെ വ്യാകരണം കാരണബന്ധം പ്രകടിപ്പിക്കുന്നു; അതിനെ ദുർബലപ്പെടുത്തുകയോ പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കുകയോ ചെയ്യാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘എന്നോടുകൂടെ’യും ‘പ്രസാദകരമായതു’യും ഔപചാരികതയും സ്വാഭാവികതയും തമ്മിൽ തുലനം ചെയ്യുന്നു. പ്രസിദ്ധീകരണവാക്യത്തിന് ആവശ്യമായ വ്യത്യസ്ത വായനയോ നിർബന്ധമായ ശാബ്ദിക വിശദീകരണമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
