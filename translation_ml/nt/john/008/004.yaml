  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: ml
  text: 'അവർ[a] അവനോട് പറഞ്ഞു: “ഗുരോ, ഈ സ്ത്രീ വ്യഭിചാരം ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ പിടിക്കപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വ്യഭിചാരത്തിൽ പിടിക്കപ്പെട്ട സ്ത്രീയെക്കുറിച്ചുള്ള വിവരണത്തിന്റെ (യോഹന്നാൻ 7:53–8:11) തുടർച്ച. യോഹന്നാൻ 7:53-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: Διδάσκαλε
  choice: ഗുരോ
  rationale: നേരിട്ടുള്ള സംബോധനയുടെ ഭാവം നിലനിർത്തുന്ന, സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗം.
- source_word: κατείληπται
  choice: പിടിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ നിലവിലുള്ള പ്രസക്തിയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἐπαυτοφώρῳ
  choice: ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: കുറ്റകൃത്യം നടക്കുന്നതിനിടയിൽ നേരിട്ട് പിടിക്കപ്പെട്ടു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μοιχευομένη
  choice: വ്യഭിചാരം ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: സ്ത്രീ പിടിക്കപ്പെട്ട സമയത്ത് പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്നു എന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഗുരോ’ എന്ന സംബോധനയും ‘പിടിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന പൂർണകാല കർമണിരൂപവും മൂലപാഠത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
