id: JHN.8.39
reference: John 8:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: ml
  text: 'അവർ അവനോട് ഉത്തരം പറഞ്ഞു: “അബ്രാഹാമാണ് ഞങ്ങളുടെ പിതാവ്.” യേശു അവരോട് പറയുന്നു: “നിങ്ങൾ അബ്രാഹാമിന്റെ മക്കളാണെങ്കിൽ, അബ്രാഹാമിന്റെ പ്രവൃത്തികൾ ചെയ്യുമായിരുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നിങ്ങൾ അബ്രാഹാമിന്റെ മക്കളായിരുന്നെങ്കിൽ, അബ്രാഹാമിന്റെ പ്രവൃത്തികൾ ചെയ്യുമായിരുന്നു.” ഗ്രീക്കിലെ അപൂർണഭൂതകാല ക്രിയാരൂപം യാഥാർഥ്യവിരുദ്ധമായ ഒരു നിബന്ധനയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: അവർ അവനോട് ഉത്തരം പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ഇരട്ട ക്രിയാപ്രയോഗത്തിന്റെ പ്രതികരണഭാവം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: അബ്രാഹാമാണ് ഞങ്ങളുടെ പിതാവ്
  rationale: അബ്രാഹാമിലുള്ള ഊന്നൽ ‘ആണ്’ എന്ന ഊന്നൽരൂപത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: യേശു അവരോട് പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി വിവരണത്തിന്റെ സജീവത സംരക്ഷിക്കുന്നു.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ മക്കൾ
  rationale: τέκνα ലിംഗഭേദമില്ലാത്ത സന്താനബന്ധത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മക്കൾ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: അബ്രാഹാമിന്റെ പ്രവൃത്തികൾ
  rationale: ἔργα എന്നതിന്റെ മൂർത്തമായ നൈതിക അർഥവും അവകാശപ്പെടുന്ന വംശബന്ധവും യഥാർഥ പ്രവർത്തനവും തമ്മിലുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἐποιεῖτε
  choice: ചെയ്തുകൊണ്ടിരിക്കുമായിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും ഈ നിബന്ധനാവാക്യത്തിലെ യാഥാർഥ്യവിരുദ്ധ സൂചനയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ മക്കൾ എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: വംശബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഭാഷ അക്ഷരാർഥത്തിൽ നിലനിർത്തി, അതിനെ അബ്രാഹാമിന്റെ പ്രവൃത്തികളുമായുള്ള വൈരുധ്യത്തിൽ അവതരിപ്പിച്ചു.
  alternative: ഇത് ശാരീരിക വംശപരമ്പരയെ പൂർണമായി നിഷേധിക്കുന്നതായോ ആത്മീയ പുത്രത്വത്തെ മാത്രം ഉറപ്പിക്കുന്നതായോ തുറന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം പിതൃത്വാവകാശവാദത്തെയും പ്രവൃത്തികളുടെ പൊരുത്തക്കേടിനെയും നേർക്കുനേർ നിർത്തുന്നു; അതിനപ്പുറമുള്ള ഒരു ദൈവശാസ്ത്രവ്യവസ്ഥ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: നിബന്ധന യാഥാർഥ്യമാണോ യാഥാർഥ്യവിരുദ്ധമാണോ എന്ന വ്യാകരണപരമായ സംഘർഷം
  choice: ‘മക്കളാണെങ്കിൽ’ എന്ന വർത്തമാന നിബന്ധനയും ‘ചെയ്തുകൊണ്ടിരിക്കുമായിരുന്നു’ എന്ന യാഥാർഥ്യവിരുദ്ധ ഫലവാക്യവും നിലനിർത്തി.
  alternative: ‘മക്കളായിരുന്നു നിങ്ങളെങ്കിൽ’ എന്ന് ഇരുവശവും വ്യക്തമായ യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയായി ഒത്താക്കുക.
  rationale: SBLGNT-യിലെ ἐστε എന്ന വർത്തമാനരൂപവും ἐποιεῖτε എന്ന അപൂർണഭൂതകാലരൂപവും സൃഷ്ടിക്കുന്ന യഥാർഥ സംഘർഷം മിനുക്കി നീക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ചരിത്രവർത്തമാനകാലവും യോഹന്നാന്റെ വാദത്തിലെ വ്യാകരണ-ദൈവശാസ്ത്ര സംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
