source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: ml
  text: എന്റെ സംസാരരീതി നിങ്ങൾക്കു മനസ്സിലാകാത്തത് എന്തുകൊണ്ട്? എന്റെ വചനം കേൾക്കാൻ നിങ്ങൾക്കു കഴിയാത്തതുകൊണ്ടാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ സംസാരം’ അല്ലെങ്കിൽ ‘എന്റെ ഭാഷ’. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം യേശുവിന്റെ സംസാരരീതിയെ സൂചിപ്പിക്കുന്നു; അടുത്ത ഭാഗത്തെ ‘എന്റെ വചനം’ എന്നതിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നിങ്ങൾക്ക് എന്റെ വചനം കേൾക്കാനാവില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: സംസാരരീതി
  rationale: ഇവിടെ പദം യേശുവിന്റെ സംസാരത്തിന്റെ രീതിയെയോ സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്നു. തുടർന്ന് വരുന്ന λόγος എന്ന ‘വചനം’ എന്നതിൽനിന്നുള്ള വ്യത്യാസവും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: γινώσκετε
  choice: മനസ്സിലാകാത്തത്
  rationale: സന്ദർഭത്തിൽ ഇത് വെറും അറിയലിനെയല്ല, യേശുവിന്റെ സംസാരത്തിന്റെ അർഥം ഗ്രഹിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀκούειν
  choice: കേൾക്കാൻ
  rationale: അടിസ്ഥാനമായ ‘കേൾക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സ്വീകരിക്കുകയോ അനുസരിക്കുകയോ ചെയ്യുക എന്ന ആശയം പരിഭാഷയിൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: λόγον
  choice: വചനം
  rationale: യേശുവിന്റെ വാക്കിനെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വചനം’ എന്നത് മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്; λαλιὰν എന്ന ‘സംസാരരീതി’യിൽനിന്നുള്ള വ്യത്യാസവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οὐ δύνασθε
  choice: നിങ്ങൾക്കു കഴിയാത്തത്
  rationale: വാക്യം പറയുന്ന കഴിവില്ലായ്മയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം പരിഭാഷയിൽ വിശദീകരിക്കുന്നില്ല.
- source_word: ὅτι
  choice: -തുകൊണ്ടാണ്
  rationale: മുൻചോദ്യത്തിനുള്ള കാരണം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: എന്റെ
  rationale: രണ്ടിടത്തുമുള്ള ഉടമസ്ഥതാസൂചന നേരിട്ടും സമാന്തരമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എന്റെ വചനം കേൾക്കാൻ നിങ്ങൾക്കു കഴിയുന്നില്ല’ എന്നതിലെ കഴിവില്ലായ്മയുടെ സ്വഭാവം
  choice: കഴിവില്ലായ്മയെ നേരിട്ട് പ്രസ്താവിക്കുക; അതിന്റെ കാരണം വിശദീകരിക്കാതിരിക്കുക
  alternative: ധാർമ്മികമായ മനസ്സില്ലായ്മ, ന്യായവിധിപരമായ കാഠിന്യപ്പെടുത്തൽ, അല്ലെങ്കിൽ ആത്മീയ അശക്തി എന്നിങ്ങനെ വ്യാഖ്യാനിക്കുക
  rationale: വാക്യം കഴിവില്ലായ്മ പ്രസ്താവിക്കുന്നുണ്ടെങ്കിലും അതിന്റെ പൂർണ ദൈവശാസ്ത്രപരമായ കാരണം ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പരിഭാഷ ആ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യോത്തരഘടന ഉപയോഗിച്ചു. ‘സംസാരരീതി’യും ‘വചനം’യും ഉപയോഗിച്ച് λαλιὰ/λόγος വ്യത്യാസം നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ഒഴിവാക്കി.
