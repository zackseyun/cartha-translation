id: JHN.8.26
reference: John 8:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: ml
  text: നിങ്ങളെക്കുറിച്ച് പറയാനും വിധിക്കാനും എനിക്ക് പലതുമുണ്ട്.[a] എന്നാൽ എന്നെ അയച്ചവൻ സത്യവാനാണ്; അവനിൽനിന്ന് ഞാൻ കേട്ട ആ കാര്യങ്ങൾതന്നെയാണ്[b] ഞാൻ ലോകത്തോടു പറയുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെ സംബന്ധിച്ച്.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘അവനിൽനിന്ന് ഞാൻ കേട്ടവ, അവയാണ് ഞാൻ ലോകത്തോടു പറയുന്നത്.’ ഗ്രീക്കിൽ ‘അവ’ എന്ന നിർദേശകസർവനാമം ആവർത്തിച്ച് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: പലതും
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമരൂപത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; ‘പലതും’ സ്വാഭാവികമായ മലയാളത്തിൽ അതിന്റെ ബഹുത്വം നിലനിർത്തുന്നു.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ചു
  rationale: ജനിറ്റീവിനോടുകൂടിയ περί ഇവിടെ വിഷയം/പരാമർശം സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളെക്കുറിച്ചു’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: λαλεῖν
  choice: പറയാനും
  rationale: ആദ്യത്തെ അനന്തക്രിയാരൂപം κρίνειν-നോടു ചേർന്ന് വരുന്നതിനാൽ ‘പറയാനും വിധിക്കാനും’ എന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: κρίνειν
  choice: വിധിക്കാനും
  rationale: ‘വിധിക്കുക’ എന്നത് κρίνωയുടെ വിശാലമായ ന്യായവിധി അർഥം നിലനിർത്തുന്നു; ‘ശിക്ഷയ്ക്കു വിധിക്കുക’ എന്ന ഇടുങ്ങിയ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὁ πέμψας με
  choice: എന്നെ അയച്ചവൻ
  rationale: നാമവൽക്കരിച്ച ആർട്ടിക്കിളോടുകൂടിയ കൃതന്തത്തെ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘പിതാവ്’ എന്ന നാമം ചേർക്കുന്നില്ല.
- source_word: ἀληθής
  choice: സത്യവാനാണ്
  rationale: സത്യം പറയുന്നവൻ/വിശ്വസനീയൻ എന്ന വ്യക്തിഗത ഗുണം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും യോഹന്നാനിലെ ‘സത്യം’ എന്ന ആശയബന്ധം നിലനിർത്തുന്നു.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: അവനിൽനിന്നു ഞാൻ കേട്ട കാര്യങ്ങൾ
  rationale: ബന്ധവാക്യം കേട്ട ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചനഭാവം ‘കാര്യങ്ങൾ’ വഴി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: തന്നെ
  rationale: മുൻപുള്ള ബന്ധവാക്യത്തെ ആവർത്തിച്ചു ഊന്നുന്ന ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന്റെ പ്രഭാവം മലയാളത്തിൽ ‘കാര്യങ്ങൾതന്നെ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λαλῶ
  choice: ഞാൻ ... പറയുന്നു
  rationale: വർത്തമാനകാലത്തെ പൊതുപ്രഖ്യാപനഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തോടു
  rationale: സംസാരത്തിന്റെ ദിശയെയും അഭിസംബോധിതരെയും സൂചിപ്പിക്കുന്ന εἰς ഇവിടെ ‘ലോകത്തോടു’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്താം.
theological_decisions:
- issue: ‘എന്നെ അയച്ചവൻ’ എന്നതിന്റെ സൂചിതൻ
  choice: പിതാവിനെ സൂചിപ്പിക്കുന്നതു സന്ദർഭത്തിൽ നിലനിർത്തി; എന്നാൽ പരിഭാഷയിൽ ‘പിതാവ്’ എന്നു വ്യക്തമാക്കിയില്ല.
  alternative: ‘എന്നെ അയച്ച പിതാവ് സത്യവാനാണ്’
  rationale: യോഹന്നാന്റെ സന്ദർഭം സൂചിതനെ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ ഇവിടെ ‘പിതാവ്’ എന്ന നാമമില്ല; അതിനാൽ മൂലരൂപം സംരക്ഷിച്ചു.
- issue: κρίνειν എന്നതിന്റെ ശക്തി
  choice: ‘വിധിക്കാനും’
  alternative: ‘കുറ്റം വിധിക്കാനും’ / ‘ശിക്ഷയ്ക്കു വിധിക്കാനും’
  rationale: κρίνωയുടെ വിശാലമായ അർഥപരിധിയും ഈ വാക്യത്തിലെ തുറന്ന നിലയും നിലനിർത്തുന്നു; ‘കുറ്റം വിധിക്കുക’ എന്ന ഇടുങ്ങിയ അർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: ἀληθής എന്നതിന്റെ അർഥനിറം
  choice: ‘സത്യവാനാണ്’
  alternative: ‘സത്യമാണ്’ / ‘വിശ്വസനീയനാണ്’
  rationale: അയച്ചവന്റെ വാക്കിന്റെയും സ്വഭാവത്തിന്റെയും സത്യതയെ വ്യക്തിയെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘യഥാർഥൻ’ എന്ന മാത്രം അർഥത്തിലേക്കോ ‘വിശ്വസനീയൻ’ എന്ന മാത്രം അർഥത്തിലേക്കോ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പലതുമുണ്ട്’, ‘എന്നെ അയച്ചവൻ’, ‘കാര്യങ്ങൾതന്നെ’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ ഘടനയും ഊന്നലും അനാവശ്യമായ കൃത്രിമത്വമില്ലാതെ സൂക്ഷിക്കുന്നു.
