revisions:
- from: നിങ്ങളെക്കുറിച്ചു പറയാനും വിധിക്കാനും എനിക്ക് പലതുമുണ്ട്.[a] എന്നാൽ എന്നെ അയച്ചവൻ സത്യവാനാണ്; അവനിൽനിന്നു ഞാൻ കേട്ട കാര്യങ്ങൾതന്നെ[b] ഞാൻ ലോകത്തോടു പറയുന്നു.
  to: നിങ്ങളെക്കുറിച്ച് പറയാനും വിധിക്കാനും എനിക്ക് പലതുമുണ്ട്.[a] എന്നാൽ എന്നെ അയച്ചവൻ സത്യവാനാണ്; അവനിൽനിന്ന് ഞാൻ കേട്ട ആ കാര്യങ്ങൾതന്നെയാണ്[b] ഞാൻ ലോകത്തോടു പറയുന്നത്.
  rationale: രണ്ടാമത്തെ ഭാഗത്തിൽ ഗ്രീക്കിലെ ἃ ... ταῦτα എന്ന ആവർത്തനഘടന ‘അവനിൽനിന്ന് ഞാൻ കേട്ട ആ കാര്യങ്ങൾതന്നെയാണ്’ എന്ന രൂപത്തിൽ വ്യക്തമായി പുനഃസൃഷ്ടിച്ചു. അർഥത്തിൽ മാറ്റമില്ല; demonstrative-ഉം അതിന്റെ ഊന്നലും മാത്രം കൂടുതൽ കൃത്യമായി പ്രതിഫലിക്കുന്നു. അക്ഷരവിന്യാസം ആധുനിക നിലവാരപ്രയോഗത്തിലേക്കും ക്രമീകരിച്ചു.
