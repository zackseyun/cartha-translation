id: JHN.8.24
reference: John 8:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: ml
  text: അതുകൊണ്ട് നിങ്ങൾ നിങ്ങളുടെ പാപങ്ങളിൽ മരിക്കുമെന്ന് ഞാൻ നിങ്ങളോടു പറഞ്ഞു. കാരണം, “ഞാൻ ആകുന്നു”[a] എന്നു നിങ്ങൾ വിശ്വസിക്കാത്തപക്ഷം, നിങ്ങളുടെ പാപങ്ങളിൽ നിങ്ങൾ മരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞാൻ അവൻ ആകുന്നു.” ഗ്രീക്കിൽ “ഞാൻ ആകുന്നു” എന്നതിനുശേഷം വ്യക്തമായ വിധേയപദമില്ല; യോഹന്നാന്റെ സുവിശേഷത്തിൽ ഈ വാക്കുകൾക്ക് കൂടുതൽ ആഴത്തിലുള്ള അനുരണനം ഉണ്ടായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: അതുകൊണ്ടാണ് ... ഞാൻ നിങ്ങളോടു പറഞ്ഞത്
  rationale: οὖν മുൻസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അതുകൊണ്ടാണ്’ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു. εἶπον-ന്റെ ഭൂതകാലവും ὑμῖν-ന്റെ അഭിസംബോധനയും ‘ഞാൻ നിങ്ങളോടു പറഞ്ഞത്’ എന്നു നിലനിർത്തി.
- source_word: ἀποθανεῖσθε
  choice: നിങ്ങൾ മരിക്കും
  rationale: ഭാവികാലരൂപത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘നശിക്കും’ എന്നത് മൂലക്രിയയിൽ വ്യക്തമല്ലാത്ത വ്യാഖ്യാനഭാരം ചേർക്കും.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: നിങ്ങളുടെ പാപങ്ങളിൽ
  rationale: ἁμαρτίαις എന്ന ബഹുവചനം ‘പാപങ്ങളിൽ’ എന്നു സംരക്ഷിക്കുന്നു. ἐν ഇവിടെ പാപങ്ങളിൽ തുടരുന്ന അവസ്ഥയെയോ മേഖലയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐὰν γὰρ μὴ πιστεύσητε
  choice: '... എന്നു നിങ്ങൾ വിശ്വസിക്കാത്തപക്ഷം'
  rationale: ἐὰν μή-യുടെ നിഷേധാത്മക ഉപാധി ‘വിശ്വസിക്കാത്തപക്ഷം’ എന്നു സ്വാഭാവികമായി നൽകി. γάρ മുൻവാക്യത്തിന്റെ കാരണം വിശദീകരിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമത്തിലും ബന്ധത്തിലും അത് വ്യക്തമായതിനാൽ വേറൊരു കൃത്രിമ ബന്ധപദം ചേർത്തിട്ടില്ല.
- source_word: ὅτι ἐγώ εἰμι
  choice: ഞാൻ ആകുന്നു എന്നു
  rationale: ഗ്രീക്കിൽ ἐγώ εἰμι-യ്ക്കുശേഷം വ്യക്തമായ വിധേയപദമില്ല. ‘ഞാൻ ആകുന്നു’ എന്ന രൂപം ആ അപൂർണതയും യോഹന്നാനിലെ സാധ്യമായ ആഴമുള്ള അനുരണനവും നിലനിർത്തുന്നു; ‘ഞാൻ അവൻ ആകുന്നു’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത വിധേയപദം നൽകും.
theological_decisions:
- issue: ἐγώ εἰμι എന്നതിന് വ്യക്തമായ വിധേയപദമില്ലാത്തത്
  choice: ഞാൻ ആകുന്നു
  alternative: ഞാൻ അവൻ ആകുന്നു
  rationale: ഈ പ്രയോഗം സന്ദർഭത്തിൽ സ്വയം തിരിച്ചറിയിക്കലായും കൂടുതൽ പരമമായ പ്രഖ്യാപനത്തിന്റെ അനുരണനമുള്ളതായും കേൾക്കാം. പ്രധാനപാഠത്തിൽ മൂലത്തിലെ തുറന്ന നില സംരക്ഷിക്കുകയും, സ്വാഭാവിക തിരിച്ചറിയൽവായന അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പാപങ്ങളിൽ’ എന്ന ബഹുവചനവും ആവർത്തനവും മൂലപാഠത്തെ അനുസരിച്ച് നിലനിർത്തി; നിർണായകമായ ἐγώ εἰμι ഉദ്ദേശപൂർവം വ്യാഖ്യാനിച്ച് പൂർത്തിയാക്കിയില്ല.
