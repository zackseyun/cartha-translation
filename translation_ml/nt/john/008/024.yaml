review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future warning, the plural ‘sins,’ the negative condition, and the predicate-less ἐγώ εἰμι. The inferential οὖν is represented, but the emphatic cleft ‘അതുകൊണ്ടാണ്’ is less direct than needed; γάρ should be explicitly represented by ‘കാരണം.’
  naturalness: ‘അതുകൊണ്ടാണ് … പറഞ്ഞത്’ is grammatically possible but unnecessarily clefted and slightly stiff in this context. ‘അതുകൊണ്ട് … ഞാൻ നിങ്ങളോടു പറഞ്ഞു’ is more natural modern Malayalam. Explicit quotation marks help readers parse the otherwise deliberately open expression ‘ഞാൻ ആകുന്നു.’
  terminology: ‘പാപങ്ങളിൽ,’ ‘വിശ്വസിക്കാത്തപക്ഷം,’ and ‘ഞാൻ ആകുന്നു’ appropriately preserve the Greek wording and its theological openness. The footnote’s alternative ‘ഞാൻ അവൻ ആകുന്നു’ is suitable as an idiomatic supplied-predicate reading, without imposing it on the main text.
  issues:
  - severity: low
    issue: The causal force of γάρ is not explicitly translated.
    rationale: Although Malayalam can sometimes leave the connection implicit, ‘കാരണം’ naturally represents γάρ here and makes the stated ground clear.
  - severity: low
    issue: ‘അതുകൊണ്ടാണ്’ introduces an unnecessary emphatic cleft.
    rationale: The Greek οὖν is a discourse inference, not an emphatic focus construction. ‘അതുകൊണ്ട്’ gives the connection more directly and naturally.
  revised_text: അതുകൊണ്ട് നിങ്ങൾ നിങ്ങളുടെ പാപങ്ങളിൽ മരിക്കുമെന്ന് ഞാൻ നിങ്ങളോടു പറഞ്ഞു. കാരണം, “ഞാൻ ആകുന്നു”[a] എന്നു നിങ്ങൾ വിശ്വസിക്കാത്തപക്ഷം, നിങ്ങളുടെ പാപങ്ങളിൽ നിങ്ങൾ മരിക്കും.
