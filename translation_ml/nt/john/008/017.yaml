id: JHN.8.17
reference: John 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: ml
  text: നിങ്ങളുടെ നിയമത്തിലും “രണ്ടു മനുഷ്യരുടെ സാക്ഷ്യം സത്യമാണ്” എന്നു എഴുതിയിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രണ്ടുപേരുടെ സാക്ഷ്യം സാധുവാണ്.” ഇവിടെ “സത്യമാണ്” എന്നതിന് നിയമപരമായി സാധുവാണ് എന്ന അർഥസൂചനയും ഉണ്ടാകാം.
    reason: ‘സത്യമാണ്’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തിക്കൊണ്ട്, നിയമസന്ദർഭത്തിൽ ἀληθής സൂചിപ്പിക്കാവുന്ന സാധുത വ്യക്തമാക്കുന്നു; ‘രണ്ടുപേർ’ മനുഷ്യസാക്ഷികൾ എന്ന പൊതുസൂചനയുടെ സ്വാഭാവിക ബദലാണ്.
lexical_decisions:
- source_word: νόμῳ
  choice: നിയമം
  rationale: യേശു സംവാദികളോട് ചൂണ്ടിക്കാണിക്കുന്ന യഹൂദരുടെ തിരുവെഴുത്താധിഷ്ഠിത നിയമസംഹിതയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘നിങ്ങളുടെ നിയമം’ എന്ന പ്രയോഗം വാക്യത്തിന്റെ നിയമപരവും വാഗ്വാദപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ὑμετέρῳ
  choice: നിങ്ങളുടെ
  rationale: രണ്ടാംപുരുഷ ഉടമസ്ഥവിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തി യേശുവിന്റെ വാക്കുകളിലെ വാഗ്വാദപരമായ അകലം നിലനിർത്തുന്നു; ‘നിങ്ങളുടെ സ്വന്തം’ എന്നു ചേർത്ത് ഊന്നൽ വർധിപ്പിക്കുന്നില്ല.
- source_word: γέγραπται
  choice: എഴുതിയിട്ടുണ്ടല്ലോ
  rationale: തിരുവെഴുത്തിനെ ഉദ്ധരിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ പൂർത്തീകരിച്ചും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘-ല്ലോ’ സന്ദർഭത്തിലെ ഓർമ്മപ്പെടുത്തൽഭാവവും പ്രകടമാക്കുന്നു.
- source_word: δύο ἀνθρώπων
  choice: രണ്ടു മനുഷ്യരുടെ
  rationale: ἄνθρωπος എന്നത് മനുഷ്യരെ സൂചിപ്പിക്കുന്ന പൊതുപദമാണ്; അതിനാൽ പുരുഷന്മാർക്കു മാത്രമായി അർത്ഥം ചുരുക്കാതെ ഉറവിടത്തിലെ മനുഷ്യസാക്ഷികളുടെ ആശയം നിലനിർത്തുന്നു.
- source_word: μαρτυρία
  choice: സാക്ഷ്യം
  rationale: നിയമപരമായ പശ്ചാത്തലത്തിൽ μαρτυρίαയ്ക്ക് യോജിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപദമാണിത്.
- source_word: ἀληθής
  choice: സത്യമാണ്
  rationale: ഗ്രീക്കിലെ അടിസ്ഥാന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു; നിയമപരമായ ‘സാധുവാണ്’ എന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ ... δὲ
  choice: -ത്തിലും
  rationale: ബന്ധകവും നേരിയ ഊന്നലുമുള്ള സംയുക്തഭാവം മലയാളത്തിലെ ‘നിയമത്തിലും’ എന്ന രൂപം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ നിയമം’ എന്ന പ്രയോഗത്തിന്റെ വാഗ്വാദപരമായ ഭാവം
  choice: ‘നിങ്ങളുടെ’ എന്ന ഉടമസ്ഥപ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘നിയമം’ എന്നു മാത്രം പറയുക; ‘നിങ്ങളുടെ സ്വന്തം നിയമം’ എന്നു കൂടുതൽ ഊന്നിപ്പറയുക.
  rationale: ഗ്രീക്കിൽ രണ്ടാംപുരുഷ ഉടമസ്ഥവിശേഷണം വ്യക്തമാണ്. ഇത് നിലനിർത്തുന്നത് യേശു നിയമത്തെ തള്ളിക്കളയുന്നു എന്ന ആശയം ചേർക്കാതെയും വാചകത്തിലെ സംഘർഷം മയപ്പെടുത്താതെയും അതിന്റെ വാഗ്വാദപരമായ ഭാവം സംരക്ഷിക്കുന്നു.
- issue: δύο ἀνθρώπων എന്നതിന്റെ ലിംഗവ്യാപ്തി
  choice: ‘രണ്ടു മനുഷ്യരുടെ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രണ്ടു പുരുഷന്മാരുടെ’; ‘രണ്ടുപേരുടെ’.
  rationale: ἀνθρώπων എന്ന പദം ഇവിടെ മനുഷ്യസാക്ഷികളെ പൊതുവായി സൂചിപ്പിക്കാം; പുരുഷന്മാർക്കു മാത്രമായി അർത്ഥം നിശ്ചയിക്കാൻ ഗ്രീക്ക് നിർബന്ധിക്കുന്നില്ല. അതേസമയം ‘മനുഷ്യരുടെ’ എന്നത് ഉറവിടപദത്തിന്റെ വ്യക്തമായ മാനവസൂചന നിലനിർത്തുന്നു.
- issue: ἀληθής എന്നതിന്റെ സത്യവും നിയമസാധുതയും
  choice: മുഖ്യവാചകത്തിൽ ‘സത്യമാണ്’ എന്ന് നൽകി.
  alternative: ‘സാധുവാണ്’; ‘വിശ്വസനീയമാണ്’.
  rationale: അടിസ്ഥാന പദാർത്ഥം ‘സത്യം’ എന്നതാണ്; എന്നാൽ ഈ നിയമസൂക്തിയിൽ സാക്ഷ്യത്തിന്റെ സാധുതയും ഉൾക്കൊള്ളാം. മുഖ്യവാചകം ഒരു അർത്ഥത്തിൽ ഒതുക്കാതെ ആ നിയമപരമായ സൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ന്യായപ്രമാണം’ എന്ന സഭാപരമായി പരിചിതമായ പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്ന ‘നിയമം’ ഉപയോഗിച്ചു; എന്നാൽ തിരുവെഴുത്ത്-നിയമ പശ്ചാത്തലം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
