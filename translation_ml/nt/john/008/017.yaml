    rationale: The Greek is the conventional scriptural-citation formula ‘it is written.’ ‘എഴുതിയിരിക്കുന്നു’ naturally conveys its continuing written authority and avoids an added conversational or admonitory force.
  - severity: low
    issue: Quotation punctuation and word order are somewhat awkward.
    rationale: Malayalam reads more naturally when the quoted proposition is followed directly by ‘എന്നു എഴുതിയിരിക്കുന്നു,’ rather than separating the quotation after a comma following ‘നിയമത്തിലും.’
