source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: ml
  text: അവർ യേശുവിനെ പരീക്ഷിക്കാനായി ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു; അവനെതിരെ കുറ്റാരോപണം ഉന്നയിക്കാനുള്ള അവസരം ലഭിക്കേണ്ടതിനായിരുന്നു അത്. എന്നാൽ യേശു കുനിഞ്ഞ്, വിരൽകൊണ്ട് നിലത്ത് എഴുതിക്കൊണ്ടിരുന്നു; അവരെ ശ്രദ്ധിക്കാത്തതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πειράζοντες
  choice: പരീക്ഷിക്കാനും
  rationale: സന്ദർഭത്തിൽ ഇത് പ്രലോഭിപ്പിക്കൽ എന്നതിലുപരി, യേശുവിനെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഒരു കുടുക്കിൽപ്പെടുത്താനുള്ള ദുഷ്ടലക്ഷ്യത്തോടെയുള്ള പരീക്ഷണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: κατηγορίαν
  choice: കുറ്റാരോപണം
  rationale: യേശുവിനെതിരെ ഉന്നയിക്കാവുന്ന ഔപചാരികമായ കുറ്റമോ ആരോപണമോ ആണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: μὴ προσποιούμενος
  choice: അവരെ ശ്രദ്ധിക്കാതെ
  rationale: ശ്രദ്ധിക്കാത്തതുപോലെ പെരുമാറുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘അവരെ’ എന്ന കർമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ ചേർത്തിരിക്കുന്നു.
- source_word: ἔγραφεν
  choice: എഴുതിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ തുടർച്ചാഭാവം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ഉദ്ദേശ്യവാക്യം മലയാളത്തിൽ വ്യക്തമായി ഒഴുകുന്നതിനായി ‘ഇട കണ്ടെത്താനുമായിരുന്നു’ എന്നു നൽകി; യേശു നിലത്ത് എന്താണ് എഴുതിയതെന്നു മൂലപാഠം പറയാത്തതിനാൽ അത് വിശദീകരിച്ചിട്ടില്ല.
