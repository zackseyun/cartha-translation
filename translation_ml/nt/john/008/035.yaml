source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: ml
  text: അടിമ[a] വീട്ടിൽ എന്നേക്കും തുടരുന്നില്ല; മകൻ[b] എന്നേക്കും തുടരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാസൻ’ എന്നും വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ മകനോടു താരതമ്യപ്പെടുത്തുന്ന വീട്ടിലെ പദവിവ്യത്യാസം വ്യക്തമാക്കാൻ ‘അടിമ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘മകൻ’ എന്നത് ഒരു വീട്ടിലെ മകനെക്കുറിച്ചുള്ള പൊതുപ്രസ്താവനയായിരിക്കാം; ചുറ്റുപാടിലുള്ള സംഭാഷണത്തിൽ അത് യേശുവിനെയും പരോക്ഷമായി സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: അടിമ
  rationale: വീട്ടിനുള്ളിലെ പദവിയിൽ മകനോടുള്ള വൈരുധ്യം ഇവിടെ പ്രധാനമായതിനാൽ, ബന്ധിതവും സ്ഥിരാവകാശമില്ലാത്തതുമായ നില വ്യക്തമാക്കുന്ന ‘അടിമ’ തിരഞ്ഞെടുത്തു.
- source_word: μένει
  choice: തുടരുന്നു / തുടരുന്നില്ല
  rationale: രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ ക്രിയ ആവർത്തിച്ചുകൊണ്ട്, വീട്ടിലെ നിലയും ബന്ധവും തുടർന്നുനിൽക്കുന്നതെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οἰκία
  choice: വീട്
  rationale: മലയാളത്തിൽ ‘വീട്’ എന്നത് കെട്ടിടത്തെ മാത്രമല്ല, കുടുംബവലയത്തെയും അതിലെ അംഗത്വത്തെയും സൂചിപ്പിക്കാം; അതിനാൽ മൂലപദത്തോടു ചേർന്നുനിൽക്കുകയും സന്ദർഭത്തിലെ സാമൂഹിക അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: സ്ഥിരമായ തുടർച്ചയെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്ന പ്രയോഗം; രണ്ടു ഖണ്ഡങ്ങളിലെയും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: υἱός
  choice: മകൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനത്തെയും വീട്ടിലെ അടിമ–മകൻ പദവിവൈരുധ്യത്തെയും കൃത്യമായി സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ നേരിയ ബന്ധകസ്വഭാവമുള്ള δέ-യുടെ വൈരുധ്യം രണ്ടു സമാന്തര ഖണ്ഡങ്ങളുടെ ഘടനയും അർധവിരാമവും സ്വാഭാവികമായി വഹിക്കുന്നു; ‘എന്നാൽ’ ചേർത്താൽ ആവശ്യത്തിലധികം ശക്തമായ വിരോധം തോന്നാം.
theological_decisions:
- issue: ‘മകൻ’ എന്നതിന് സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ അനുരണനം ഉണ്ടാകാമോ
  choice: പഴമൊഴിസദൃശമായ പൊതുവായ ‘മകൻ’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ദൈവപുത്രനായ യേശുവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘പുത്രൻ’ എന്നു നൽകുക
  rationale: വാക്യം വീട്ടിലെ അടിമയുടെയും മകന്റെയും പദവിയെക്കുറിച്ചുള്ള പൊതുസത്യമായി പ്രവർത്തിക്കുമ്പോഴും അടുത്ത വാക്യത്തിൽ യേശുവിലേക്കുള്ള പ്രയോഗത്തിന് വഴിയൊരുക്കുന്നു. അതിനാൽ ഈ വാക്യം മാത്രം ആ സൂചനയെ വ്യക്തമായ ഒരു ക്രിസ്തുശാസ്ത്രപദവിയായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും ലളിതവും മാന്യവുമായ മലയാളം. ‘തുടരുന്നു’ എന്ന ആവർത്തനം മൂലത്തിലെ μένει എന്ന ആവർത്തനം സംരക്ഷിക്കുന്നു. ‘വീട്’ കുടുംബത്തെയും അംഗത്വത്തെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി ഉപയോഗിച്ചു.
