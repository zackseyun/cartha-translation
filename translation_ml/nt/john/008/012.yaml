id: JHN.8.12
reference: John 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു വീണ്ടും അവരോടു പറഞ്ഞു: “ഞാൻ ലോകത്തിന്റെ വെളിച്ചം ആകുന്നു. എന്നെ അനുഗമിക്കുന്നവൻ ഇരുട്ടിൽ ഒരിക്കലും നടക്കുകയില്ല[a]; മറിച്ച് ജീവന്റെ വെളിച്ചം അവനുണ്ടാകും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ശക്തമായ നിഷേധരൂപമാണ് (οὐ μή); ‘തീർച്ചയായും ഇരുട്ടിൽ നടക്കുകയില്ല’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജീവന്റെ വെളിച്ചം’ എന്നത് ‘ജീവൻ നൽകുന്ന വെളിച്ചം’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: അപ്പോൾ … വീണ്ടും
  rationale: οὖν-നെ അതിശക്തമായ നിഗമനസൂചകമായി മാറ്റാതെ സംഭാഷണത്തിന്റെ തുടർച്ചയായി ‘അപ്പോൾ’ എന്നും, Πάλιν-നെ ‘വീണ്ടും’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐλάλησεν … λέγων
  choice: പറഞ്ഞു
  rationale: ‘സംസാരിച്ചു, പറഞ്ഞുകൊണ്ട്’ എന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ നേരിട്ടുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ ഏക ക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ … ആകുന്നു
  rationale: വിധേയനാമത്തോടു ചേർന്ന സാധാരണ ബന്ധകവാക്യമായി പരിഭാഷപ്പെടുത്തുന്നു; ദൈവനാമത്തിലേക്കുള്ള സാധ്യതയുള്ള സൂചന വിവർത്തനത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: ലോകത്തിന്റെ വെളിച്ചം
  rationale: യോഹന്നാന്റെ രൂപകവും κόσμος എന്ന പദത്തിന്റെ വിശാലമായ അർഥപരിധിയും നിലനിർത്തുന്ന നേരിട്ടുള്ള വിവർത്തനം.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: എന്നെ അനുഗമിക്കുന്നവൻ
  rationale: വ്യക്തിയെ പ്രതിനിധീകരിക്കുന്ന ഏകവചന ഗ്രീക്ക് കർത്തൃവാചക കൃദന്തത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: ഇരുട്ടിൽ ഒരിക്കലും നടക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധം ‘ഒരിക്കലും … ഇല്ല’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുകയും ‘നടക്കുക’ എന്ന യോഹന്നാനീയ രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλ’ ἕξει
  choice: മറിച്ച് … അവനുണ്ടാകും
  rationale: ἀλλά സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യം ‘മറിച്ച്’ കൊണ്ടും ἕξει എന്ന ഭാവികാലം സ്വാഭാവികമായ ‘ഉണ്ടാകും’ കൊണ്ടും നൽകുന്നു.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: ജീവന്റെ വെളിച്ചം
  rationale: ബന്ധസൂചക ഷഷ്ഠിയുടെ അർഥം ‘ജീവൻ നൽകുന്ന വെളിച്ചം’ എന്നു മാത്രം ചുരുക്കാതെ അതിന്റെ കാവ്യാത്മകവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Ἐγώ εἰμι എന്ന യേശുവിന്റെ സ്വയംപരിചയപ്പെടുത്തലിന്റെ ശക്തി
  choice: ‘ഞാൻ ലോകത്തിന്റെ വെളിച്ചം ആകുന്നു’ എന്ന വിധേയനാമമുള്ള വാക്യമായി ലളിതമായി വിവർത്തനം ചെയ്തു.
  alternative: ദൈവനാമത്തിന്റെ പ്രതിധ്വനി വ്യക്തമാക്കാൻ ‘ഞാൻ തന്നെയാണ്’ എന്ന ഊന്നൽ ചേർക്കുക.
  rationale: ഇവിടെ Ἐγώ εἰμι എന്നതിന് ‘ലോകത്തിന്റെ വെളിച്ചം’ എന്ന വിധേയനാമം വ്യക്തമായി ചേർന്നിരിക്കുന്നു. അതിനാൽ വ്യാകരണഘടന നേരിട്ട് നൽകുകയും വിശാലമായ യോഹന്നാനീയ പ്രതിധ്വനികൾ വായനക്കാരന് തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- issue: ‘ജീവന്റെ വെളിച്ചം’ എന്ന പ്രയോഗത്തിലെ ഷഷ്ഠിബന്ധം
  choice: ‘ജീവന്റെ വെളിച്ചം’ എന്ന സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ജീവൻ നൽകുന്ന വെളിച്ചം’ അല്ലെങ്കിൽ ‘ജീവദായകമായ വെളിച്ചം’.
  rationale: ഗ്രീക്ക് പ്രയോഗം ജീവൻ നൽകുന്ന വെളിച്ചം, ജീവനുമായി ബന്ധപ്പെട്ട വെളിച്ചം, ജീവന്റെ സ്വഭാവമുള്ള വെളിച്ചം തുടങ്ങിയ പരസ്പരം ബന്ധമുള്ള ആശയങ്ങൾക്ക് ഇടം നൽകുന്നു; വ്യാഖ്യാനപരമായ വിപുലീകരണം ആ അർഥസമ്പന്നത ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വെളിച്ചം’, ‘ഇരുട്ട്’, ‘നടക്കുക’ എന്നീ കേന്ദ്രരൂപകങ്ങൾ വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി. ഗ്രീക്ക് ക്രിയാസംയോജനം മലയാളത്തിലെ സ്വാഭാവികമായ ‘പറഞ്ഞു’ എന്ന രൂപത്തിലാക്കി.
