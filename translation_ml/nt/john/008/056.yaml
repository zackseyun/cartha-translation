id: JHN.8.56
reference: John 8:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: ml
  text: നിങ്ങളുടെ പിതാവായ അബ്രാഹാം എന്റെ ദിവസം കാണാൻ അത്യന്തം ആനന്ദിച്ചു[a][b]; അവൻ അതു കണ്ടു സന്തോഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ ദിവസം കാണുമെന്നതിൽ അത്യന്തം ആനന്ദിച്ചു’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἵνα-വാക്യഘടനയ്ക്ക് ഉദ്ദേശ്യത്തിന്റെയോ ഉള്ളടക്കത്തിന്റെയോ അടുത്ത അർത്ഥസാധ്യതകളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ ദിവസം’ എന്നത് യേശുവിന്റെ മിശിഹാസംബന്ധമായ ദിവസത്തെയോ പൂർത്തീകരണത്തെയോ വിശാലമായി സൂചിപ്പിക്കാം; ഏത് പ്രത്യേക സംഭവമോ കാലമോ ആണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഈ വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ ὁ πατὴρ ὑμῶν
  choice: നിങ്ങളുടെ പിതാവായ അബ്രാഹാം
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുന്നു.
- source_word: ἠγαλλιάσατο
  choice: അത്യന്തം ആനന്ദിച്ചു
  rationale: ക്രിയ സൂചിപ്പിക്കുന്ന ശക്തമായ ആഹ്ലാദം വ്യക്തമാക്കുന്നു; പിന്നാലെയുള്ള ἐχάρηയിൽനിന്നുള്ള അർത്ഥവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἵνα ἴδῃ
  choice: കാണുമെന്നതിൽ
  rationale: അബ്രാഹാമിന്റെ മുന്നോട്ടുനോക്കുന്ന പ്രതീക്ഷയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഉദ്ദേശ്യം/ഉള്ളടക്കം എന്നീ സമീപ സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: എന്റെ ദിവസം
  rationale: വാക്യം നിർവചിക്കാത്ത മിശിഹാസംബന്ധമായ വ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അക്ഷരാർഥവും ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: καὶ εἶδεν
  choice: അവൻ അതു കണ്ടു
  rationale: ഗ്രീക്കിൽ സന്ദർഭത്തിൽനിന്നു മനസ്സിലാകുന്ന കർമത്തെ മലയാളത്തിൽ ‘അതു’ എന്നു വ്യക്തമാക്കി സ്വാഭാവികത കൈവരിക്കുന്നു.
- source_word: καὶ ἐχάρη
  choice: സന്തോഷിച്ചു
  rationale: χαίρωയുടെ സാധാരണ സന്തോഷാർഥം നൽകുകയും ആദ്യത്തെ ശക്തമായ ἀγαλλιάωയിൽനിന്ന് പദവ്യത്യാസം പാലിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘എന്റെ ദിവസം’ എന്നതിന്റെ കൃത്യമായ സൂചന
  choice: ‘എന്റെ ദിവസം’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: യേശുവിന്റെ ജനനം, ഭൂമിയിലെ ശുശ്രൂഷ, ക്രൂശുമരണം-പുനരുത്ഥാനം, മിശിഹായുഗം, അല്ലെങ്കിൽ അന്ത്യവെളിപ്പാട് എന്നിങ്ങനെ ഏതെങ്കിലും ഒരു സംഭവമായി വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം ഉദ്ദേശിക്കുന്ന കൃത്യമായ സംഭവമോ കാലമോ നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ യഥാർഥ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും പിരിമുറുക്കവും പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- issue: ἵνα ἴδῃ എന്ന ഘടനയുടെ ബലം
  choice: മുന്നോട്ടുനോക്കുന്ന പ്രതീക്ഷയായി ‘കാണുമെന്നതിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കാണേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യാർഥമോ ‘കാണാൻ’ എന്ന ചുരുക്കരൂപമോ.
  rationale: സന്ദർഭത്തിൽ പ്രതീക്ഷയുടെ അംശം വ്യക്തമാണ്; എന്നാൽ ഗ്രീക്കിലെ ഉദ്ദേശ്യം/ഉള്ളടക്കം എന്ന സമീപ സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അത്യന്തം ആനന്ദിച്ചു’/‘സന്തോഷിച്ചു’ എന്ന വ്യത്യാസം രണ്ടു ഗ്രീക്ക് സന്തോഷക്രിയകളുടെയും തീവ്രതാഭേദം വായനക്കാരന് ഗ്രഹിക്കാവുന്നവിധം സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പ്രയോഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
