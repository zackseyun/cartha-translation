id: JHN.8.44
reference: John 8:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: ml
  text: നിങ്ങൾ നിങ്ങളുടെ പിതാവായ പിശാചിൽനിന്നുള്ളവരാണ്; നിങ്ങളുടെ പിതാവിന്റെ ആഗ്രഹങ്ങൾ നിറവേറ്റാനാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്. അവൻ ആരംഭം മുതൽ കൊലപാതകിയായിരുന്നു; അവൻ സത്യത്തിൽ നിലകൊണ്ടിട്ടില്ല, കാരണം അവനിൽ സത്യമില്ല. അവൻ നുണ പറയുമ്പോഴെല്ലാം,[a] തനിക്കുള്ളതിൽനിന്നാണ് സംസാരിക്കുന്നത്,[b] കാരണം അവൻ നുണയനും അതിന്റെ പിതാവുമാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവൻ നുണ സംസാരിക്കുമ്പോഴെല്ലാം” അല്ലെങ്കിൽ “അവൻ ആ നുണ സംസാരിക്കുമ്പോഴെല്ലാം.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തനിക്കുള്ളതിൽനിന്ന് സംസാരിക്കുന്നു”; അതായത്, തനിക്കു സ്വന്തമായ സ്വഭാവത്തിൽനിന്നോ സവിശേഷതയിൽനിന്നോ സംസാരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അതിന്റെ’ എന്നത് നുണയെ സൂചിപ്പിക്കുന്നതായി സാധാരണ മനസ്സിലാക്കുന്നു. പൊതുവായ അർഥത്തിൽ, “നുണകളുടെ പിതാവ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: നിങ്ങളുടെ പിതാവായ പിശാചിൽനിന്നുള്ളവർ
  rationale: ἐκ എന്നത് ഇവിടെ ഉറവിടമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ പിശാചിനോടുള്ള ആത്മീയ ഉത്ഭവം/ചായ്‌വ് എന്ന ശക്തമായ പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: ἐπιθυμίας
  choice: മോഹങ്ങൾ
  rationale: ലൈംഗിക അർഥത്തിലേക്ക് ചുരുക്കാതെ ദുഷ്ടമായ ആഗ്രഹങ്ങളെയും പ്രേരണകളെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: θέλετε ποιεῖν
  choice: നിറവേറ്റാനാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്
  rationale: പ്രവർത്തിക്കാനുള്ള മനസ്സും ഉദ്ദേശ്യവും വ്യക്തമാക്കുന്നു; ποιεῖν എന്നതിന്റെ പ്രവൃത്തിഫലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνθρωποκτόνος
  choice: മനുഷ്യഘാതകൻ
  rationale: മനുഷ്യനെ കൊല്ലുന്നവൻ എന്ന മൂലപദത്തിന്റെ വ്യാപ്തി കൃത്യമായി സൂക്ഷിക്കുന്ന, ഗൗരവമുള്ള മലയാളപ്രയോഗം.
- source_word: ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: യോഹന്നാന്റെ രചനകളിലെ ആരംഭസംബന്ധമായ ഭാഷയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: സത്യത്തിൽ നിലകൊണ്ടിട്ടില്ല
  rationale: ἔστηκεν എന്ന നിലകൊള്ളൽ-രൂപകം സംരക്ഷിക്കുന്നു; മുമ്പ് സത്യത്തിൽ ഉണ്ടായിരുന്നിട്ട് പിന്നീട് വീണു എന്ന വിവാദമായ സൂചന ചേർക്കുന്നില്ല.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: അവൻ നുണ പറയുമ്പോഴെല്ലാം
  rationale: ഗ്രീക്കിലെ പദപ്രയോഗം മലയാളത്തിൽ അക്ഷരാർഥമായി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ ആവർത്തിത സ്വഭാവം വ്യക്തമാക്കുന്ന സ്വാഭാവിക രൂപം സ്വീകരിച്ചു.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: തന്റെ സ്വന്തമായതിൽനിന്നാണ് സംസാരിക്കുന്നത്
  rationale: ‘സ്വന്തമായവയിൽനിന്ന്’ എന്ന തുറന്ന ഗ്രീക്ക് പ്രയോഗം അതിന്റെ രൂപകാത്മകമായ അവ്യക്തതയോടെ നിലനിർത്തുന്നു; ‘സ്വഭാവത്തിൽനിന്ന്’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ψεύστης
  choice: നുണയൻ
  rationale: നേരിട്ടും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളസമാനപദം.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: അതിന്റെ പിതാവ്
  rationale: αὐτοῦ എന്നത് ഏറ്റവും സ്വാഭാവികമായി മുൻപുള്ള നുണയെ സൂചിപ്പിക്കുന്നു. ഏകവചനവും പിതാവ് എന്ന ഉറവിട-രൂപകവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: ‘അതിന്റെ പിതാവ്’—അത് നുണയെ സൂചിപ്പിക്കുന്നു
  alternative: ‘നുണകളുടെ പിതാവ്’ എന്ന പൊതുവത്കരിച്ച വ്യാഖ്യാനം; അല്ലെങ്കിൽ വ്യാകരണപരമായി ദുഷ്കരമായ ‘അവന്റെ പിതാവ്’
  rationale: ഏറ്റവും അടുത്തതും സന്ദർഭത്തിന് യോജിച്ചതുമായ സൂചിതവിഷയം τὸ ψεῦδος ആണ്. എന്നാൽ പൊതുവത്കരിച്ച വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: പിശാച് ഒരിക്കൽ സത്യത്തിൽ നിലകൊണ്ടിരുന്നുവെന്ന് വാക്യം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘സത്യത്തിൽ നിലകൊണ്ടിട്ടില്ല’
  alternative: ‘സത്യത്തിൽ തുടർന്നില്ല’ അല്ലെങ്കിൽ ‘സത്യത്തിൽ ഉറച്ചുനിന്നില്ല’
  rationale: മൂലത്തിലെ നിലകൊള്ളൽ-രൂപകം സൂക്ഷിക്കുകയും മുമ്പുണ്ടായിരുന്ന ഒരു അവസ്ഥയിൽനിന്നുള്ള വീഴ്ച എന്ന ദൈവശാസ്ത്ര നിഗമനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും നേരിട്ടുള്ള ഏറ്റുമുട്ടൽഭാവവും നിലനിർത്തി. ‘മനുഷ്യഘാതകൻ’ പോലുള്ള അല്പം ഉയർന്ന രജിസ്റ്ററിലുള്ള പദം മൂലത്തിലെ കൃത്യതയ്ക്കായി ഉപയോഗിച്ചു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
