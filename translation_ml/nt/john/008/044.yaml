revisions:
- from: നിങ്ങൾ നിങ്ങളുടെ പിതാവായ പിശാചിൽനിന്നുള്ളവരാണ്; നിങ്ങളുടെ പിതാവിന്റെ മോഹങ്ങൾ നിറവേറ്റാനാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്. അവൻ ആദിമുതൽ മനുഷ്യഘാതകനായിരുന്നു; അവൻ സത്യത്തിൽ നിലകൊണ്ടിട്ടില്ല, കാരണം അവനിൽ സത്യമില്ല. അവൻ നുണ പറയുമ്പോഴെല്ലാം തന്റെ സ്വന്തമായതിൽനിന്നാണ് സംസാരിക്കുന്നത്,[a] കാരണം അവൻ നുണയനും അതിന്റെ പിതാവുമാണ്.[b]
  to: നിങ്ങൾ നിങ്ങളുടെ പിതാവായ പിശാചിൽനിന്നുള്ളവരാണ്; നിങ്ങളുടെ പിതാവിന്റെ ആഗ്രഹങ്ങൾ നിറവേറ്റാനാണ് നിങ്ങൾ ആഗ്രഹിക്കുന്നത്. അവൻ ആരംഭം മുതൽ കൊലപാതകിയായിരുന്നു; അവൻ സത്യത്തിൽ നിലകൊണ്ടിട്ടില്ല, കാരണം അവനിൽ സത്യമില്ല. അവൻ നുണ പറയുമ്പോഴെല്ലാം,[a] തനിക്കുള്ളതിൽനിന്നാണ് സംസാരിക്കുന്നത്,[b] കാരണം അവൻ നുണയനും അതിന്റെ പിതാവുമാണ്.[c]
  rationale: The revision improves modern Malayalam idiom, restores a needed footnote for the Greek expression τὸ ψεῦδος, and keeps the source’s deliberate openness in ἐκ τῶν ἰδίων. It retains ‘സത്യത്തിൽ നിലകൊണ്ടിട്ടില്ല,’ avoiding an implication that the devil formerly remained in truth, and retains the singular ‘അതിന്റെ പിതാവ്’ without doctrinal expansion.
