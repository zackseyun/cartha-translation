  to: “മരിച്ച നമ്മുടെ പിതാവായ അബ്രാഹാമിനെക്കാൾ നീ വലിയവനല്ലല്ലോ? പ്രവാചകന്മാരും മരിച്ചു. നീ നിന്നെത്തന്നെ ആരെന്നാണ് അവകാശപ്പെടുന്നത്?”
