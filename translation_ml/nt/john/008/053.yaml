reference: John 8:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: ml
  text: “മരിച്ച നമ്മുടെ പിതാവായ അബ്രാഹാമിനെക്കാൾ നീ വലിയവനല്ലല്ലോ? പ്രവാചകന്മാരും മരിച്ചു. നീ നിന്നെത്തന്നെ ആരെന്നാണ് അവകാശപ്പെടുന്നത്?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ σὺ μείζων εἶ
  choice: വലിയവനാണെന്നാണോ നീ കരുതുന്നത്?
  rationale: μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരവും വെല്ലുവിളിയുടെ സ്വരവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; μείζων എന്നതിന്റെ വിശാലമായ അർഥം ‘വലിയവൻ’ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: നമ്മുടെ പിതാവായ അബ്രാഹാമിനെക്കാൾ
  rationale: താരതമ്യജനിറ്റീവിനെ ‘-നെക്കാൾ’ കൊണ്ടും അബ്രാഹാമിനോടുള്ള പൂർവപിതൃബഹുമാനത്തെ ‘നമ്മുടെ പിതാവായ’ കൊണ്ടും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅστις ἀπέθανεν
  choice: മരിച്ചുപോയ
  rationale: അബ്രാഹാമിന്റെ ചരിത്രപരമായ മരണവസ്തുത നേരിട്ട് അറിയിക്കുന്നു; മലയാളവാക്യത്തിൽ ബന്ധവാക്യത്തെ സ്വാഭാവികമായി നാമത്തിന് മുമ്പിൽ ചേർക്കുന്നു.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: പ്രവാചകന്മാരും മരിച്ചു
  rationale: καί സൂചിപ്പിക്കുന്ന സമാന്തരമായ അധിക ഉദാഹരണം ‘-ഉം’ കൊണ്ടു ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: നീ നിന്നെത്തന്നെ ആരായിട്ടാണ് അവതരിപ്പിക്കുന്നത്?
  rationale: സ്വയം ഒരു പ്രത്യേക വ്യക്തിയോ പദവിയുള്ളവനോ ആയി മുന്നോട്ടുവയ്ക്കുക എന്ന പ്രയോഗാർഥം നിലനിർത്തുന്നു; വെറും ‘ആരാക്കുന്നു’ എന്ന അസ്വാഭാവിക പദാനുപദ വിവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനെയും പ്രവാചകന്മാരെയും അപേക്ഷിച്ചുള്ള യേശുവിന്റെ പദവിയെക്കുറിച്ചുള്ള വാഗ്വാദപരമായ വെല്ലുവിളി
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ശത്രുതാപരമായ ചോദ്യമായി വിവർത്തനം ചെയ്തു.
  alternative: “നമ്മുടെ പിതാവായ അബ്രാഹാമിനെക്കാൾ നീ വലിയവനാണോ?” എന്ന നിഷ്പക്ഷ ചോദ്യം.
  rationale: ഗ്രീക്കിലെ μή സംസാരിക്കുന്നവർ ‘അല്ല’ എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള സംഘർഷം നിലനിർത്തുന്നു; വാക്യത്തിൽത്തന്നെ സിദ്ധാന്തപരമായ പരിഹാരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ. ചോദ്യം നേരിടുന്ന വ്യക്തിയോടുള്ള ഏകവചന ‘നീ’ മൂലപാഠത്തിലെ σύയുടെ നേരിട്ടുള്ള, ഏറ്റുമുട്ടൽ നിറഞ്ഞ സ്വരം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
