    rationale: നിലവിലെ മുഖ്യപാഠം ഇതിനകം ‘കരുതുന്നത്’ ചേർക്കുന്നതിനാൽ, അടിക്കുറിപ്പ് നിർദേശിക്കുന്ന നേരിട്ടുള്ള രൂപം യഥാർത്ഥത്തിൽ ഉറവിടത്തോട് കൂടുതൽ ചേർന്നതാണ്; പരിഷ്കൃത മുഖ്യപാഠത്തിൽ ഈ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
