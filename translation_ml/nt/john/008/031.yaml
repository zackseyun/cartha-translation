id: JHN.8.31
reference: John 8:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: ml
  text: 'അപ്പോൾ യേശു യേശുവിനെ വിശ്വസിച്ചിരുന്ന[a] യെഹൂദരോടു പറയുകയായിരുന്നു: “നിങ്ങൾ എന്റെ വചനത്തിൽ നിലനിൽക്കുന്നുവെങ്കിൽ, നിങ്ങൾ സത്യമായും എന്റെ ശിഷ്യന്മാരാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവിൽ വിശ്വസിച്ചിരുന്ന യെഹൂദരോട്.” ഗ്രീക്കിൽ അക്ഷരാർഥം “യേശുവിനെ വിശ്വസിച്ചിരുന്ന” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്ക് അപൂർണ ഭൂതകാലം തുടർച്ചയായോ പുരോഗമിച്ചുകൊണ്ടിരുന്നോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കാം. എന്നാൽ മലയാളത്തിൽ ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ ഇവിടെ അസ്വാഭാവികമായി തോന്നുന്നതിനാൽ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികമായ ‘പറഞ്ഞു’ ഉപയോഗിച്ചു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭവുമായി ഉള്ള അനുമാനപരമായോ തുടർച്ചാപരമായോ ബന്ധം സൂചിപ്പിക്കുന്നു; ‘അതിനാൽ’ അതിന്റെ ബന്ധകശക്തി വ്യക്തമായി നൽകുന്നു.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: തന്നെ വിശ്വസിച്ചിരുന്ന യെഹൂദരോട്
  rationale: പൂർണകാല പങ്കുപദം മുൻപ് ഉണ്ടായതും തുടരുന്ന പ്രസക്തിയുള്ളതുമായ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വിശ്വസിച്ചിരുന്ന’ എന്നു നൽകി. αὐτῷ ദത്തിവിഭക്തിയായതിനാൽ εἰς ചേർന്ന ‘അവനിൽ വിശ്വസിച്ചു’ എന്നതിനെക്കാൾ നേരിട്ടുള്ള ‘തന്നെ വിശ്വസിച്ചു’ പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
- source_word: Ἐὰν
  choice: എങ്കിൽ
  rationale: ഉപാധി അവതരിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി നൽകിയിരിക്കുന്ന സർവനാമം മലയാളത്തിലും നിലനിർത്തി; ഇതിലൂടെ ആവശ്യമായ ഊന്നൽ സ്വാഭാവികമായി ലഭിക്കുന്നു.
- source_word: μείνητε
  choice: നിലനിൽക്കുന്നെങ്കിൽ
  rationale: യോഹന്നാന്റെ രചനയിൽ μένω സൂചിപ്പിക്കുന്ന തുടർച്ച, സ്ഥിരത, ബന്ധപരമായ നിലനിൽപ്പ് എന്നിവ ‘നിലനിൽക്കുക’ നന്നായി വഹിക്കുന്നു.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: എന്റെ വചനത്തിൽ
  rationale: λόγος ഇവിടെ യേശുവിന്റെ സന്ദേശത്തെയോ ഉപദേശത്തെയോ സൂചിപ്പിച്ചാലും, യോഹന്നാനിലെ പദപ്രയോഗവും ദൈവശാസ്ത്രപരമായ അനുരണനവും കാത്തുസൂക്ഷിക്കാൻ ‘വചനം’ ഉപയോഗിച്ചു.
- source_word: ἀληθῶς
  choice: യഥാർഥത്തിൽ
  rationale: ശിഷ്യത്വത്തിന്റെ യാഥാർഥ്യവും ആധികാരികതയും വ്യക്തമാക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഗൗരവവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: μαθηταί μού ἐστε
  choice: നിങ്ങൾ എന്റെ ശിഷ്യന്മാരാണ്
  rationale: സുവിശേഷസന്ദർഭത്തിൽ μαθητής എന്നതിന് സ്ഥാപിതവും വ്യക്തവുമായ പദം ‘ശിഷ്യൻ’ ആണ്.
theological_decisions:
- issue: πιστεύω എന്ന ക്രിയയോടൊപ്പം ദത്തിവിഭക്തിയിലുള്ള αὐτῷ എന്നതിന്റെ പരിഭാഷ
  choice: തന്നെ വിശ്വസിച്ചിരുന്ന
  alternative: തന്നിൽ വിശ്വസിച്ചിരുന്ന
  rationale: ഗ്രീക്കിൽ ഇവിടെ εἰς എന്ന ഉപസർഗമില്ല; അതിനാൽ പാഠം പറയുന്നതിനെക്കാൾ വിപുലമായ ദൈവശാസ്ത്രപരമായ അർഥം പ്രധാനപാഠത്തിൽ ചേർക്കാതെ നേരിട്ടുള്ള രൂപം സ്വീകരിച്ചു. യോഹന്നാനിലെ വിശ്വാസഭാഷയനുസരിച്ച് സാധ്യതയുള്ള ‘തന്നിൽ വിശ്വസിച്ചിരുന്ന’ എന്ന വായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി പിന്തുടർന്നു. ‘വചനം’, ‘ശിഷ്യന്മാർ’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
