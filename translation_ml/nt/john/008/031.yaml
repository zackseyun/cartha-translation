  naturalness: ‘യേശു … പറയുകയായിരുന്നു’ is idiomatic modern Malayalam for the Greek imperfect in this narrative setting. ‘അപ്പോൾ’ is natural here, and ‘സത്യമായും’ reads smoothly while conveying ἀληθῶς.
  terminology: ‘വചനം’ for λόγος and ‘ശിഷ്യന്മാർ’ for μαθηταί are appropriate, established Malayalam biblical terms. ‘യേശുവിനെ വിശ്വസിച്ചിരുന്ന’ preserves the direct-object sense of πιστεύω with the dative without importing ‘in him’ into the main text.
