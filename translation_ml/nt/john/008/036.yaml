id: JHN.8.36
reference: John 8:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: ml
  text: അതുകൊണ്ട് പുത്രൻ നിങ്ങളെ സ്വതന്ത്രരാക്കിയാൽ, നിങ്ങൾ യഥാർഥത്തിൽ[a] സ്വതന്ത്രരായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തീർച്ചയായും’ അല്ലെങ്കിൽ ‘വാസ്തവമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. സ്വാതന്ത്ര്യം യഥാർഥവും പൂർണവുമാണെന്ന് ഗ്രീക്ക് ക്രിയാവിശേഷണം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: അതുകൊണ്ട് … -യാൽ
  rationale: οὖν സൂചിപ്പിക്കുന്ന മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം ‘അതുകൊണ്ട്’ എന്നും, ἐὰν സൂചിപ്പിക്കുന്ന വ്യവസ്ഥ മലയാളത്തിലെ ‘-യാൽ’ രൂപത്തിലൂടെയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς
  choice: പുത്രൻ
  rationale: യോഹന്നാന്റെ സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുവിശേഷണപരമായ നിർദിഷ്ട പദവിയാണ്; മലയാള ബൈബിൾ ഭാഷയിൽ ‘പുത്രൻ’ ആ പദവിയെ മാന്യമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: ഗ്രീക്കിലെ രണ്ടാംപുരുഷ ബഹുവചനത്തെ ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: ἐλευθερώσῃ
  choice: സ്വതന്ത്രരാക്കിയാൽ
  rationale: ἐὰν-നോടുകൂടിയ വ്യവസ്ഥാപ്രയോഗവും ഒരാളെ സ്വതന്ത്രനാക്കുന്ന പ്രവർത്തിയും സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: ὄντως
  choice: യഥാർഥത്തിൽ
  rationale: സ്വാതന്ത്ര്യത്തിന്റെ യാഥാർഥ്യവും സത്യസന്ധതയും ഊന്നിപ്പറയുന്ന ക്രിയാവിശേഷണത്തിന്റെ ബലം നിലനിർത്തുന്നു; അതിന്റെ ഊന്നൽ വ്യക്തമാക്കാൻ അടിക്കുറിപ്പും ചേർത്തിരിക്കുന്നു.
- source_word: ἐλεύθεροι
  choice: സ്വതന്ത്രരായി
  rationale: ഇത് പ്രവർത്തിയെക്കാൾ അതിന്റെ ഫലമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണമാണ്; ‘സ്വതന്ത്രരായി’ ആ അവസ്ഥ നിലനിർത്തുന്നു.
- source_word: ἔσεσθε
  choice: ഇരിക്കും
  rationale: ഭാവികാലത്തെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘പുത്രൻ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: യേശുവിനെ അനന്യമായി സൂചിപ്പിക്കുന്ന ക്രിസ്തുവിശേഷണപരമായ പദവി
  alternative: ഒരു സാധാരണ പുത്രൻ
  rationale: യോഹന്നാൻ 8-ലെ ഭവനം, അടിമ, പുത്രൻ എന്നിവയെക്കുറിച്ചുള്ള വാദസന്ദർഭത്തിൽ ὁ υἱός നിർദിഷ്ടമായി യേശുവിനെ സൂചിപ്പിക്കുന്നു. വിവർത്തനം ‘പുത്രൻ’ എന്ന പദവി നിലനിർത്തുന്നു.
- issue: ഇവിടെ പറയുന്ന സ്വാതന്ത്ര്യത്തിന്റെ സ്വഭാവം
  choice: യഥാർഥവും പൂർണവുമായ സ്വാതന്ത്ര്യം; അതിനെ ഒരു പ്രത്യേക വിഭാഗത്തിലേക്ക് വിവർത്തനത്തിൽ ചുരുക്കുന്നില്ല
  alternative: ആത്മീയ സ്വാതന്ത്ര്യം മാത്രം; അല്ലെങ്കിൽ സാമൂഹിക-രാഷ്ട്രീയ സ്വാതന്ത്ര്യം മാത്രം
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം പാപത്തിന്റെ അടിമത്തത്തെക്കുറിച്ചാണെങ്കിലും, ഈ വാക്യം ഫലത്തെ വിശാലമായി പറയുന്നു. ‘യഥാർഥത്തിൽ സ്വതന്ത്രർ’ എന്ന ആശയം പാഠത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും അതിന്റെ പരിധി അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘സ്വതന്ത്രരാക്കിയാൽ … സ്വതന്ത്രരായിരിക്കും’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ἐλευθερόω/ἐλεύθερος പദബന്ധം ബോധപൂർവം നിലനിർത്തുന്നു.
