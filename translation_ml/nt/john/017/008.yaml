id: JHN.17.8
reference: John 17:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: ml
  text: കാരണം, നീ എനിക്കു നൽകിയ വചനങ്ങൾ[a] ഞാൻ അവർക്കു നൽകിയിരിക്കുന്നു. അവർ അവ സ്വീകരിച്ചു; ഞാൻ നിന്നിൽനിന്നു വന്നതാണെന്ന്[b] യഥാർഥമായി അറിഞ്ഞു; നീ എന്നെ അയച്ചുവെന്ന് വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മൊഴികൾ.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഞാൻ നിന്നിൽനിന്നു പുറപ്പെട്ടുവന്നതാണെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: വചനങ്ങൾ
  rationale: സംസാരിക്കപ്പെട്ട വാക്കുകൾ അഥവാ മൊഴികൾ എന്ന ബഹുവചനാർഥം നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്ന ഏകവചന വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἔδωκάς ... δέδωκα
  choice: നൽകിയ ... നൽകിയിരിക്കുന്നു
  rationale: ആദ്യ ക്രിയയുടെ സമാപ്തമായ ഭൂതകാലപ്രവൃത്തിയും രണ്ടാമത്തെ ക്രിയയുടെ ഇപ്പോഴും പ്രസക്തമായ പൂർത്തീകരണവും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിച്ചുകാട്ടുന്നു.
- source_word: ἔλαβον
  choice: സ്വീകരിക്കുകയും
  rationale: നൽകപ്പെട്ട വെളിപ്പാട് ഏറ്റുവാങ്ങുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ഭൗതികമായി ‘എടുക്കുക’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἔγνωσαν ἀληθῶς
  choice: വാസ്തവമായി അറിയുകയും
  rationale: ἀληθῶς എന്നതിന്റെ ‘വാസ്തവമായി/യഥാർഥമായി’ എന്ന ഭാവം നിലനിർത്തുന്നു; വെറും ഉറപ്പിന്റെ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: ഞാൻ നിന്റെ അടുക്കൽനിന്നു വന്നതാണെന്ന്
  rationale: παρά + ഷഷ്ഠി സൂചിപ്പിക്കുന്ന ഉത്ഭവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘പുറപ്പെട്ടുവന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിക്കുകയും ചെയ്തു
  rationale: തുടർന്നുള്ള ὅτι-വാക്യം ഒരു പ്രസ്താവന സത്യമാണെന്ന വിശ്വാസം സൂചിപ്പിക്കുന്നതിനാൽ നേരിട്ടുള്ള തർജമ ഉപയോഗിക്കുന്നു.
- source_word: ἀπέστειλας
  choice: അയച്ചു
  rationale: പിതാവ് യേശുവിനെ അയച്ചതിനെ നേരിട്ട് പറയുന്നു; ‘നിയോഗിച്ചു’ എന്ന അധിക വ്യാഖ്യാനഭാവം ചേർക്കുന്നില്ല.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന വിശദീകരണപരമായ ശക്തി മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθον എന്നതിൽ യേശുവും പിതാവും തമ്മിലുള്ള ബന്ധം
  choice: ഞാൻ നിന്റെ അടുക്കൽനിന്നു വന്നതാണെന്ന്
  alternative: ഞാൻ നിന്നിൽനിന്നു പുറപ്പെട്ടുവന്നതാണെന്ന്
  rationale: പിതാവിൽനിന്നുള്ള ഉത്ഭവം പ്രസ്താവിക്കുമ്പോഴും പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല; അക്ഷരാർഥപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ὅτι-വാക്യത്തോടുകൂടിയ πιστεύωയുടെ വിവർത്തനം
  choice: നീ എന്നെ അയച്ചുവെന്ന് വിശ്വസിച്ചു
  alternative: നീ എന്നെ അയച്ചുവെന്ന് ഉറച്ചുനിന്നു
  rationale: ഇവിടെ വിശ്വാസത്തിന്റെ ഉള്ളടക്കം ഒരു ὅτι-വാക്യമായി നൽകിയിരിക്കുന്നതിനാൽ ‘വിശ്വസിച്ചു’ എന്നത് വാക്യഘടനയും അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആശയക്രമവും ആവർത്തിച്ച ബന്ധങ്ങളും നിലനിർത്തി.
