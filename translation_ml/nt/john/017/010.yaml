theological_decisions:
- issue: പുത്രനും പിതാവും തമ്മിലുള്ള പരസ്പര ഉടമസ്ഥത
  choice: ‘എന്റേതെല്ലാം നിന്റേതാണ്; നിന്റേതെല്ലാം എന്റേതുമാണ്’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: പങ്കിട്ട ഉടമസ്ഥതയെ മയപ്പെടുത്തി വെറും പ്രവർത്തനപരമായ സഹകരണമെന്നു വ്യാഖ്യാനിക്കൽ.
  rationale: ഗ്രീക്ക് പാഠം പരസ്പര ഉടമസ്ഥത വ്യക്തമായി പ്രസ്താവിക്കുന്നു. അതിനെ ദുർബലപ്പെടുത്താതെയും വാക്യത്തിൽ ഇല്ലാത്ത പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ചേർക്കാതെയും നിലനിർത്തി.
- issue: ‘അവരിൽ’ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ നേരിട്ടുള്ള സ്ഥാനസൂചക രൂപമായ ‘അവരിൽ’ നിലനിർത്തി.
  alternative: ‘അവരിലൂടെ’ എന്ന ഉപകരണാർഥമോ ‘അവരുടെ ഇടയിൽ’ എന്ന സാന്നിധ്യാർഥമോ പ്രധാനപാഠത്തിൽ തിരഞ്ഞെടുക്കൽ.
  rationale: ἐν സന്ദർഭത്തിൽ സ്ഥാനം, ഉപകരണം, പ്രകടനം എന്നിവയുടെ സൂക്ഷ്മഭാവങ്ങൾ വഹിക്കാം. പാഠം ഒന്നിനെ നിർബന്ധമായി തീർപ്പാക്കാത്തതിനാൽ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ ഉപയോഗിച്ചു. ‘മഹത്ത്വീകരിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്നതായിരിക്കെ ഗ്രീക്ക് പൂർത്തകാല നിഷ്ക്രിയത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
