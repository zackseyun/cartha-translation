id: JHN.17.18
reference: John 17:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: ml
  text: അങ്ങ് എന്നെ ലോകത്തിലേക്ക് അയച്ചതുപോലെ, ഞാനും അവരെ ലോകത്തിലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: അയച്ചതുപോലെ
  rationale: പിതാവ് യേശുവിനെ അയച്ചതും യേശു ശിഷ്യന്മാരെ അയച്ചതും തമ്മിലുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐμὲ
  choice: എന്നെ
  rationale: ἀπέστειλας എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ അനാവശ്യമായ അധികവാക്കുകളില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἀπέστειλας
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും യോഹന്നാനിലെ ദൗത്യഭാഷയും സംരക്ഷിക്കുന്നു; ‘നിയോഗിച്ചു’ എന്നത് ഇവിടെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ഗതിയും κόσμος എന്ന യോഹന്നാനിലെ പ്രധാന പദത്തിന്റെ വിശാലമായ അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിന്റെ ചേർക്കൽഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും രണ്ടു വാക്യഭാഗങ്ങളുടെ സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπέστειλα
  choice: അയച്ചു
  rationale: ആദ്യ വാക്യഭാഗത്തിലെ ἀπέστειλας എന്നതോടുള്ള ഉദ്ദേശ്യപൂർവമായ ക്രിയാസമാന്തരത നിലനിർത്താൻ അതേ മലയാളക്രിയ ഉപയോഗിക്കുന്നു.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: സന്ദർഭത്തിൽ ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: κόσμον
  choice: ലോകം
  rationale: യോഹന്നാനിലെ θεശാസ്ത്രപരമായ പിരിമുറുക്കം മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ κόσμος എന്ന പ്രധാന പദത്തെ ‘ലോകം’ എന്ന് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പിതാവ് പുത്രനെ അയച്ചതും പുത്രൻ ശിഷ്യന്മാരെ അയച്ചതും തമ്മിലുള്ള ദൗത്യസമാന്തരത
  choice: രണ്ടിടത്തും ‘അയച്ചു’ എന്ന ഒരേ ക്രിയ ഉപയോഗിച്ചു.
  alternative: ആദ്യത്തേത് ‘അയച്ചു’ എന്നും രണ്ടാമത്തേത് ‘നിയോഗിച്ചു’ എന്നും വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: വാക്യം ദൗത്യങ്ങളുടെ സാദൃശ്യം ഊന്നുന്നു; അവയുടെ പദവിയോ സ്വഭാവമോ പൂർണമായി ഒരേ എന്നാണ് പറയുന്നത് അല്ല. ഒരേ ക്രിയ ഉപയോഗിക്കുന്നത് മൂലപാഠത്തിലെ സമാന്തരത സംരക്ഷിക്കുമ്പോൾ ശിഷ്യന്മാരുടെ ദൗത്യത്തെ പുത്രന്റെ അതുല്യ ദൗത്യത്തോട് തുല്യമാക്കുന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പിതാവിനെ അഭിസംബോധന ചെയ്യാൻ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ ചുരുക്കവും ‘അയച്ചു … അയച്ചു’ എന്ന സമാന്തരഘടനയും നിലനിർത്തി.
