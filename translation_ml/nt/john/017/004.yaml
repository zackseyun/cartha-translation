- from: നീ എനിക്കു ചെയ്യാൻ തന്ന പ്രവൃത്തി പൂർത്തിയാക്കിക്കൊണ്ട് ഞാൻ ഭൂമിയിൽ നിന്നെ മഹത്ത്വപ്പെടുത്തി.[a]
  to: നീ എനിക്കു ചെയ്യാൻ തന്ന പ്രവൃത്തി പൂർത്തിയാക്കിയതിലൂടെ ഞാൻ ഭൂമിയിൽ നിന്നെ മഹത്വപ്പെടുത്തി.[a]
  rationale: «പൂർത്തിയാക്കിയതിലൂടെ» പ്രധാനക്രിയയായ «മഹത്വപ്പെടുത്തി»യോടുള്ള മാർഗബന്ധം നിലനിർത്തുകയും പൂർത്തീകരണത്തിന്റെ അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് participle-ന്റെ സാധ്യമായ അനുബന്ധമോ സമാന്തരമോ ആയ വായനയെ സ്വാഭാവികവും പൂർണവുമായ മലയാളത്തിൽ നൽകുന്നു.
