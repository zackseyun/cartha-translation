id: JHN.17.4
reference: John 17:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: ml
  text: നീ എനിക്കു ചെയ്യാൻ തന്ന പ്രവൃത്തി പൂർത്തിയാക്കിയതിലൂടെ ഞാൻ ഭൂമിയിൽ നിന്നെ മഹത്വപ്പെടുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ഭൂമിയിൽ നിന്നെ മഹത്വപ്പെടുത്തി; നീ എനിക്കു ചെയ്യാൻ തന്ന പ്രവൃത്തി പൂർത്തിയാക്കി.”
    reason: τελειώσας എന്ന aorist participle-നെ മുഖ്യക്രിയയോടൊപ്പമുള്ള/അനുബന്ധ പ്രവൃത്തിയായി കൂടുതൽ ഔപചാരികമായി പകർത്താവുന്ന വ്യത്യസ്ത വായന.
lexical_decisions:
- source_word: ἐδόξασα
  choice: മഹത്ത്വപ്പെടുത്തി
  rationale: യോഹന്നാന്റെ രചനകളിൽ δοξάζω ദൈവത്തിന്റെ മഹത്ത്വം വെളിപ്പെടുത്തുകയും അവിടുത്തേക്ക് മഹത്ത്വം വരുത്തുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മഹത്ത്വപ്പെടുത്തി’ ഈ ദൈവശാസ്ത്രഭാരം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: ἐπί + genitive ഇവിടെ സ്ഥലസൂചനയാണ്. മലയാളത്തിൽ ‘ഭൂമിയിൽ’ എന്നത് കൃത്യവും സ്വാഭാവികവുമാണ്; ഗ്രീക്കിലെ നിർദേശക ഉപപദം വേറിട്ട് പകർത്തേണ്ടതില്ല.
- source_word: τελειώσας
  choice: പൂർത്തിയാക്കിക്കൊണ്ട്
  rationale: aorist participle പ്രധാനക്രിയയായ ‘മഹത്ത്വപ്പെടുത്തി’ എന്നതിന്റെ മാർഗമോ അനുബന്ധസാഹചര്യമോ വ്യക്തമാക്കുന്നു. ‘പൂർത്തിയാക്കിക്കൊണ്ട്’ ഈ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ἔργον
  choice: പ്രവൃത്തി
  rationale: ἔργον എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘പ്രവൃത്തി’ യേശുവിന് പിതാവ് ഏൽപ്പിച്ച ദൗത്യത്തെയും അതിന്റെ നിർവഹണത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: δέδωκάς μοι
  choice: നീ എനിക്കു ... തന്ന
  rationale: perfect രൂപം മുമ്പ് നൽകിയതും ഇപ്പോഴും പ്രസക്തവുമായ ഏൽപ്പിക്കലിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ബന്ധവാക്യത്തിൽ ‘തന്ന’ ഈ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἵνα ποιήσω
  choice: ചെയ്യാൻ
  rationale: ἵνα + subjunctive ഇവിടെ നൽകിയ പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. ‘ചെയ്യാൻ’ എന്ന infinitival പ്രയോഗം ആ ഉദ്ദേശ്യബന്ധം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγώ σε
  choice: ഞാൻ ... നിന്നെ
  rationale: ഗ്രീക്കിൽ ἐγώ ഊന്നൽ നൽകുന്നുവെങ്കിലും ‘ഞാൻ തന്നേ’ എന്നു ചേർക്കുന്നത് സന്ദർഭത്തിൽ അതിവിവർത്തനമാകും. സാധാരണ മലയാള സർവനാമക്രമം മതിയായ വ്യക്തത നൽകുന്നു.
theological_decisions:
- issue: τελειώσας എന്ന പങ്കുപദവും പിതാവിനെ മഹത്ത്വപ്പെടുത്തിയതും തമ്മിലുള്ള ബന്ധം
  choice: ഏൽപ്പിച്ച പ്രവൃത്തി പൂർത്തിയാക്കുന്നതിലൂടെയാണ് യേശു പിതാവിനെ മഹത്ത്വപ്പെടുത്തിയതെന്ന മാർഗബന്ധം മുഖ്യവാചകത്തിൽ പ്രകടിപ്പിക്കുന്നു.
  alternative: ‘നീ എനിക്കു ചെയ്യാൻ തന്ന പ്രവൃത്തി പൂർത്തിയാക്കിയശേഷം’ എന്ന കാലബന്ധം; അല്ലെങ്കിൽ ‘ഞാൻ നിന്നെ മഹത്ത്വപ്പെടുത്തി; പ്രവൃത്തി പൂർത്തിയാക്കി’ എന്ന സമാന്തരബന്ധം.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ participle പ്രധാനക്രിയ എങ്ങനെ നടന്നു എന്നു വിശദീകരിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. അതേസമയം participle-ന്റെ ‘പൂർത്തിയാക്കി/പൂർത്തിയാക്കിയവനായി’ എന്ന കൂടുതൽ ഔപചാരിക വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ ‘മഹത്ത്വം’ എന്ന പദസഞ്ചയം നിലനിർത്തി; വാക്യബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തി.
