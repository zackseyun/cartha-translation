id: JHN.17.9
reference: John 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: ml
  text: ഞാൻ അവർക്കുവേണ്ടി അപേക്ഷിക്കുന്നു[a][b]. ലോകത്തിനുവേണ്ടി ഞാൻ അപേക്ഷിക്കുന്നില്ല; മറിച്ച്, നീ എനിക്കു നൽകിയിട്ടുള്ളവർക്കുവേണ്ടിയാണ്; കാരണം അവർ നിനക്കുള്ളവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെക്കുറിച്ച്”; ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് പദപ്രയോഗത്തിന് ‘വേണ്ടി’ എന്നും ‘കുറിച്ച്’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പ്രാർഥിക്കുന്നു”; ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനാർഥം “ചോദിക്കുക” അല്ലെങ്കിൽ “അപേക്ഷിക്കുക” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: അപേക്ഷിക്കുന്നു
  rationale: അടിസ്ഥാനമായ ‘ചോദിക്കുക/അപേക്ഷിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും, പിതാവിനോടുള്ള പ്രാർഥനയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു; ‘പ്രാർഥിക്കുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ഒഴിവാക്കുന്നു.
- source_word: περὶ αὐτῶν
  choice: അവർക്കുവേണ്ടി
  rationale: അപേക്ഷയുടെ സന്ദർഭത്തിൽ περί + genitive ഗുണഭോക്തൃപരമായ ‘വേണ്ടി’ എന്ന അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘അവരെക്കുറിച്ച്’ എന്നും സാധ്യമാണെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κόσμου
  choice: ലോകം
  rationale: യോഹന്നാനിലെ θεολογികവും അർഥപരവുമായ വ്യാപ്തി ചുരുക്കാതെ κόσμος എന്ന പദത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὧν δέδωκάς μοι
  choice: നീ എനിക്കു നൽകിയിട്ടുള്ളവർ
  rationale: വ്യക്തികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമവും, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം നിലനിൽക്കുന്നതു സൂചിപ്പിക്കുന്ന perfect ക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὅτι σοί εἰσιν
  choice: കാരണം അവർ നിനക്കുള്ളവരാണ്
  rationale: ὅτιയുടെ കാരണാർഥവും σοί εἰσιν എന്നതിലെ ബന്ധപരവും ഉടമസ്ഥതാപരവുമായ ആശയവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐγώ
  choice: ഞാൻ
  rationale: വാക്യത്തിലെ വ്യക്തമായ കർത്താവിനെയും ലോകവുമായി വരുത്തുന്ന വിരുദ്ധഘടനയെയും നിലനിർത്തുന്നു.
- source_word: ἀλλά
  choice: എന്നാൽ/ആണ് എന്ന വിരുദ്ധഘടന
  rationale: ‘ലോകത്തിനുവേണ്ടിയല്ല … നൽകിയിട്ടുള്ളവർക്കുവേണ്ടിയാണ്’ എന്ന മലയാളത്തിലെ വിരുദ്ധകേന്ദ്രിത ഘടനയിലൂടെ ശക്തമായ contrast സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐρωτῶ എന്നത് വ്യക്തമായ പ്രാർഥനാപദമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘അപേക്ഷിക്കുന്നു’ എന്നു നൽകി
  alternative: ‘പ്രാർഥിക്കുന്നു’ / ‘ചോദിക്കുന്നു’
  rationale: സന്ദർഭം പ്രാർഥനയായിരിക്കുമ്പോഴും ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനമായ അപേക്ഷിക്കുക/ചോദിക്കുക എന്ന അർഥം സംരക്ഷിക്കുന്നു; ഉറവിടത്തിൽ ഉള്ളതിലധികം ആരാധനാപരമായ ഭാഷ ചേർക്കുന്നില്ല.
- issue: περίയുടെ അർഥം ‘വേണ്ടി’ എന്നോ ‘കുറിച്ച്’ എന്നോ
  choice: പ്രധാന പാഠത്തിൽ ‘വേണ്ടി’
  alternative: ‘അവരെക്കുറിച്ച്’
  rationale: ഇവിടെ മധ്യസ്ഥമായ അപേക്ഷയുടെ സന്ദർഭത്തിൽ ‘വേണ്ടി’ സ്വാഭാവികമാണ്; യഥാർഥ ലെക്സിക്കൽ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ‘ലോകം’ എന്നതിന്റെ പരിധി
  choice: വ്യാഖ്യാനപരമായി ചുരുക്കാതെ ‘ലോകം’ എന്നു തന്നെ
  alternative: ‘മനുഷ്യരാശി പൊതുവിൽ’ / ‘അവിശ്വാസിയായ ലോകവ്യവസ്ഥ’
  rationale: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും ഈ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: ‘ലോകത്തിനുവേണ്ടിയല്ല’ എന്ന പ്രസ്താവനയുടെ പരിധി
  choice: ഈ പ്രത്യേക അപേക്ഷയുടെ പ്രസ്താവനയായി നേരിട്ട് നിലനിർത്തി
  alternative: ലോകത്തിനായി യേശു ഒരിക്കലും അപേക്ഷിക്കുന്നില്ലെന്ന പൊതുസിദ്ധാന്തമായി വികസിപ്പിക്കൽ
  rationale: പാഠം പറയുന്നതിനെക്കാൾ അപ്പുറം പോകാതെയും അതിന്റെ മൂർച്ച മങ്ങിക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷ. ‘അപേക്ഷിക്കുന്നു’ പ്രാർഥനാസന്ദർഭവും ഗ്രീക്ക് ക്രിയയുടെ സാധാരണ അർഥവും ഒരുമിച്ച് വഹിക്കുന്നു. പ്രധാന പാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുയോജ്യമായ സ്ഥാനങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
