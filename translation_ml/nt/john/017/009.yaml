  source_fidelity: 'പ്രധാന വിവർത്തനം ഗ്രീക്ക് പാഠത്തിന്റെ വാക്യഘടനയും അർഥവും വിശ്വസ്തമായി നൽകുന്നു: ἐγώയിലെ ഊന്നൽ ‘ഞാൻ’ എന്നതിൽ, ἐρωτῶയിലെ അപേക്ഷാർഥം, περίയുടെ സന്ദർഭോചിതമായ ‘വേണ്ടി’ എന്ന അർഥം, κόσμος എന്ന തുറന്ന പ്രയോഗം, δέδωκάς എന്ന പെർഫെക്റ്റിന്റെ ‘നൽകിയിട്ടുള്ള’ എന്ന ഭാവം, ὅτιയുടെ കാരണാർഥം എന്നിവ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. ‘മറിച്ച്’ ചേർക്കുന്നതിലൂടെ οὐ … ἀλλὰ എന്ന വ്യക്തമായ വിരുദ്ധഘടന കൂടുതൽ തെളിയും.'
  naturalness: ‘ഞാൻ അവർക്കുവേണ്ടി അപേക്ഷിക്കുന്നു’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘ലോകത്തിനുവേണ്ടി ഞാൻ അപേക്ഷിക്കുന്നില്ല; മറിച്ച്…’ എന്ന രൂപം അസ്പഷ്ടതയില്ലാതെ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
  terminology: ‘അപേക്ഷിക്കുന്നു’ ἐρωτῶയ്ക്ക് യോജിച്ചതാണ്; ‘പ്രാർഥിക്കുന്നു’ എന്നു വ്യാഖ്യാനപരമായി ഉറപ്പിക്കാതെ പ്രാർഥനാസന്ദർഭത്തിന് യോജിക്കുന്നു. ‘ലോകം’ എന്നത് κόσμος-ന്റെ യോഹന്നാനിലെ ബഹുവ്യാപകത സംരക്ഷിക്കുന്നു. നിലവിലെ b അടിക്കുറിപ്പ് σοί εἰσιν-നെക്കുറിച്ചാണ്, എന്നാൽ ഇംഗ്ലീഷ് ഓഡിറ്റ്-ട്രെയിലിലും മലയാള ലെക്സിക്കൽ തീരുമാനങ്ങളിലും b-യുടെ ഉദ്ദേശ്യം ἐρωτῶയുടെ ബദൽ വായനയാണെന്ന് കാണുന്നു; അതിനാൽ അതിന്റെ ആങ്കറും ഉള്ളടക്കവും തിരുത്തണം.
