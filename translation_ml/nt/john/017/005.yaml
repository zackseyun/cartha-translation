  source_fidelity: 'പ്രധാന അർഥം കരടിൽ വിശ്വസ്തമായി കൈമാറിയിട്ടുണ്ട്: പിതാവിനോടുള്ള അപേക്ഷ, ലോകത്തിനു മുമ്പുള്ള മഹത്ത്വം, പിതാവിനോടുകൂടെയുള്ള മുൻകാലബന്ധം എന്നിവ വ്യക്തമാണ്. എന്നാൽ τῇ δόξῃ എന്ന ദത്തിവിന്റെ സഹചാര/ബന്ധാർഥം ‘മഹത്ത്വത്താൽ’ എന്നതിനെക്കാൾ ‘മഹത്ത്വത്തോടുകൂടെ’ എന്നു നൽകുന്നതാണ് കൂടുതൽ നേരിട്ടുള്ളത്; ‘-ത്താൽ’ മാർഗാർഥം ശക്തമായി സൂചിപ്പിച്ചേക്കാം.'
  naturalness: ‘അങ്ങയുടെ സന്നിധിയിൽ’യും ‘അങ്ങയോടുകൂടെ’യും ആധുനിക മാന്യമായ പ്രാർഥനാഭാഷയിൽ സ്വാഭാവികമാണ്. പരിഷ്കരിച്ച വാക്യക്രമം ദീർഘമായ വിശേഷണവാക്യം വ്യക്തമായി വായിക്കാൻ സഹായിക്കുന്നു. അടിക്കുറിപ്പ് b-യിലെ ‘ലോകം ഉണ്ടായിരിക്കുന്നതിനുമുമ്പ്’ എന്ന രൂപം സ്വാഭാവികമല്ലാത്തതിനാൽ പരിഷ്കരിച്ചു.
