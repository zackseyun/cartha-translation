id: JHN.17.5
reference: John 17:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: ml
  text: ഇപ്പോൾ, പിതാവേ, അങ്ങയുടെ സന്നിധിയിൽ, ലോകം ഉണ്ടാകുന്നതിനുമുമ്പ് അങ്ങയോടുകൂടെ എനിക്കുണ്ടായിരുന്ന മഹത്ത്വത്തോടുകൂടെ എന്നെ മഹത്ത്വപ്പെടുത്തണമേ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξασόν
  choice: മഹത്ത്വപ്പെടുത്തണമേ
  rationale: δοξάζω എന്ന യോഹന്നാനീയ പദത്തിന്റെ ‘മഹത്ത്വം’ എന്ന ആശയവും പ്രാർഥനയിലെ ആജ്ഞാപൂർവ അഭ്യർഥനാഭാവവും നിലനിർത്തുന്നു; ‘ബഹുമാനിക്കണമേ’ എന്നത് ഇവിടെ അർഥത്തെ അനാവശ്യമായി ചുരുക്കും.
- source_word: παρὰ σεαυτῷ
  choice: അങ്ങയുടെ സന്നിധിയിൽ
  rationale: ദത്തിവോടുകൂടിയ παρά സാമീപ്യമോ സാന്നിധ്യമോ സൂചിപ്പിക്കുന്നു. ‘അങ്ങയുടെ സന്നിധിയിൽ’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ഈ ബന്ധപരവും സ്ഥാനപരവുമായ അർഥം നൽകുന്നു.
- source_word: τῇ δόξῃ
  choice: മഹത്ത്വത്താൽ
  rationale: ദത്തിവ് ഇവിടെ മഹത്ത്വപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട മാർഗമോ സഹചാരിത്വമോ സൂചിപ്പിക്കാം. ‘മഹത്ത്വത്താൽ’ എന്ന പ്രയോഗം നിർദിഷ്ട മഹത്ത്വംകൊണ്ട് മഹത്ത്വപ്പെടുത്തണമെന്ന അഭ്യർഥന വ്യക്തമായി കൈമാറുന്നു.
- source_word: ᾗ εἶχον
  choice: എനിക്കുണ്ടായിരുന്ന
  rationale: അപൂർണഭൂതകാലമായ εἶχον യേശുവിന് മുമ്പേ ഉണ്ടായിരുന്ന മഹത്ത്വത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഉണ്ടായിരുന്ന’ ഈ മുൻകാല കൈവശാവസ്ഥ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: ലോകം ഉണ്ടാകുന്നതിനുമുമ്പ്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് മുൻകാലബന്ധം പ്രകടിപ്പിക്കുന്നു. ഈ വിവർത്തനം ലോകത്തിന്റെ അസ്തിത്വത്തിനു മുമ്പുള്ള സമയത്തെ നേരിട്ട് സൂചിപ്പിക്കുകയും ‘ലോകം ഉണ്ടായിരിക്കുന്നതിനുമുമ്പ്’ എന്ന അസ്വാഭാവിക രൂപം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: παρὰ σοί
  choice: അങ്ങയോടുകൂടെ
  rationale: ദത്തിവോടുകൂടിയ παρά ഇവിടെ പിതാവിനോടുള്ള സാമീപ്യവും സഹവാസവും സൂചിപ്പിക്കുന്നു. ‘അങ്ങയോടുകൂടെ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: σύ, πάτερ
  choice: പിതാവേ
  rationale: σύ ഗ്രീക്കിൽ ഊന്നൽ നൽകുന്നു. എന്നാൽ മലയാള പ്രാർഥനാശൈലിയിൽ ആദരസൂചകമായ സംബോധനയും ക്രിയാരൂപവും കർത്താവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതിനാൽ ‘അങ്ങുതന്നെ, പിതാവേ’ എന്ന ഭാരമുള്ള രൂപം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
- source_word: κόσμον
  choice: ലോകം
  rationale: യോഹന്നാനിൽ κόσμος എന്നതിന് സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പദം ‘ലോകം’ ആണ്; ‘പ്രപഞ്ചം’ എന്നത് ഇവിടെ അർഥപരിധിയെ അനാവശ്യമായി മാറ്റാം.
theological_decisions:
- issue: വാക്യം സൂചിപ്പിക്കുന്ന പുത്രന്റെ പൂർവാസ്തിത്വം
  choice: ലോകം ഉണ്ടാകുന്നതിനുമുമ്പ് യേശുവിന് പിതാവിനോടുകൂടെ മഹത്ത്വം ഉണ്ടായിരുന്നുവെന്ന് കാലവാക്യം നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: കാലവാക്യത്തെ മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട മഹത്ത്വം മാത്രമായി വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ലോകത്തിന്റെ അസ്തിത്വത്തിനു മുമ്പ് യേശുവിന് പിതാവിനോടുകൂടെ ഉണ്ടായിരുന്ന മഹത്ത്വത്തെ നേരിട്ട് അവതരിപ്പിക്കുന്നു. വിവർത്തനം ഈ അവകാശവാദത്തെ വികസിപ്പിക്കാതെയും മൃദൂകരിക്കാതെയും നിലനിർത്തുന്നു.
- issue: പിതാവിനോടുകൂടെ ഉണ്ടായിരുന്ന ‘മഹത്ത്വത്തിന്റെ’ സ്വഭാവം
  choice: δόξα എന്നത് ‘മഹത്ത്വം’ എന്നു തന്നെ നിലനിർത്തി; വിശദീകരണാത്മക വിശേഷണം ചേർത്തില്ല.
  alternative: തേജസ്സ്, മാഹാത്മ്യം, ബഹുമാനം.
  rationale: ഈ വാക്യം മഹത്ത്വത്തിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിക്കുന്നില്ല. ‘മഹത്ത്വം’ യോഹന്നാനീയ പദബന്ധം നിലനിർത്തുകയും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ ആഴം മുൻകൂട്ടി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപം പിതാവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയ്ക്ക് അനുയോജ്യമാണ്. ഗ്രീക്ക് വാക്യക്രമം അതേപടി പകർത്താതെ, കാലവാക്യവും ബന്ധവാക്യവും മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന ക്രമത്തിൽ വെച്ചു; ‘മഹത്ത്വം/മഹത്ത്വപ്പെടുത്തുക’ എന്ന പദബന്ധം ഉദ്ദേശപൂർവം നിലനിർത്തി.
