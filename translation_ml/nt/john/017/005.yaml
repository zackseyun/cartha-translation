  to: ഇപ്പോൾ, പിതാവേ, അങ്ങയുടെ സന്നിധിയിൽ, ലോകം ഉണ്ടാകുന്നതിനുമുമ്പ് അങ്ങയോടുകൂടെ എനിക്കുണ്ടായിരുന്ന മഹത്ത്വത്തോടുകൂടെ എന്നെ മഹത്ത്വപ്പെടുത്തണമേ.
  rationale: 'മുഖ്യപരിഷ്കാരം τῇ δόξῃ-യെ ‘മഹത്ത്വത്തോടുകൂടെ’ എന്നു നൽകുന്നതാണ്; ഇതിലൂടെ മൂലത്തിലെ നിർദിഷ്ട മഹത്ത്വത്തോടുള്ള ബന്ധം നിലനിൽക്കുകയും മാർഗാർഥം അമിതമായി ചുമത്തപ്പെടാതിരിക്കുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് b സ്വാഭാവിക ആധുനിക മലയാളത്തിലേക്ക് ക്രമീകരിച്ചു. അടിക്കുറിപ്പ് ആങ്കറുകൾ മാറ്റിയിട്ടില്ല: a ‘അങ്ങയുടെ സന്നിധിയിൽ’ എന്നും b കാലവാക്യത്തോടും ചേർന്നിരിക്കുന്നു.'
