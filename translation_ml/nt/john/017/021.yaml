id: JHN.17.21
reference: John 17:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: ml
  text: അവരെല്ലാവരും ഒന്നായിരിക്കേണ്ടതിന്[a]—പിതാവേ, അങ്ങ് എന്നിലും ഞാൻ അങ്ങയിലും ആയിരിക്കുന്നതുപോലെ—അവരും നമ്മിൽ ആയിരിക്കേണ്ടതിന്[b], അങ്ങാണ് എന്നെ അയച്ചതെന്ന് ലോകം വിശ്വസിക്കേണ്ടതിന്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അവരെല്ലാവരും ഐക്യപ്പെട്ടിരിക്കേണ്ടതിന്.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അവരെല്ലാവരും ഒന്നായിരിക്കേണ്ടതിന്’ എന്നാണ്; ഐക്യത്തെ ഒരു പ്രത്യേക വശത്തിലേക്കു ചുരുക്കാതെ അതിന്റെ പൂർണമായ അർത്ഥവ്യാപ്തി ഈ രൂപം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്നിൽ,’ ‘അങ്ങയിൽ,’ ‘നമ്മിൽ’ എന്നിങ്ങനെ ആവർത്തിക്കുന്ന ‘-യിൽ’ എന്ന പ്രയോഗം യോഹന്നാന്റെ പരസ്പര അന്തർവാസത്തിന്റെയും പങ്കാളിത്തത്തിന്റെയും ഭാഷയെ പ്രതിഫലിപ്പിക്കുന്നു; ഇത് വെറും സഹവാസത്തെക്കാൾ ശക്തമാണ്.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ ‘വിശ്വാസത്തിലേക്കു വരേണ്ടതിന്.’ ലോകം വിശ്വസിക്കുന്നതിനെ ഗ്രീക്ക് സൂചിപ്പിക്കുന്നുവെങ്കിലും, വിശ്വസിക്കാൻ തുടങ്ങുന്നതിലാണോ വിശ്വാസത്തിൽ തുടരുന്നതിലാണോ ഊന്നൽ എന്ന് വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: -േണ്ടതിന്
  rationale: മൂന്നു ἵνα ഉപവാക്യങ്ങളുടെയും ഉദ്ദേശ്യ/ഫലബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ഒരേ ഘടന ആവർത്തിക്കുന്നു.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: സന്ദർഭത്തിലുള്ള എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἓν
  choice: ഒന്ന്
  rationale: ഐക്യത്തിന്റെ സ്വഭാവം സംഘടനാപരമോ ലക്ഷ്യപരമോ തത്ത്വപരമോ എന്ന് ചുരുക്കി നിർവചിക്കാതെ ഗ്രീക്കിലെ നപുംസക ഏകവചനരൂപം സംരക്ഷിക്കുന്നു.
- source_word: καθὼς
  choice: ആയിരിക്കുന്നതുപോലെ
  rationale: വിശ്വാസികളുടെ ഏകതയും പിതാവും പുത്രനും തമ്മിലുള്ള ബന്ധവും തമ്മിലുള്ള താരതമ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; മലയാളവാക്യത്തിന് ആവശ്യമായ ക്രിയയും സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
- source_word: πάτερ
  choice: പിതാവേ
  rationale: നേരിട്ടുള്ള സംബോധനവും ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ അർത്ഥവും നിലനിർത്തുന്നു.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: എന്നിൽ ... അങ്ങയിൽ
  rationale: യോഹന്നാന്റെ പരസ്പര അന്തർവാസ/പങ്കാളിത്ത ഭാഷയെ ദുർബലപ്പെടുത്താതെ ἐν എന്നതിന്റെ ആവർത്തനം ഒരേവിധം സംരക്ഷിക്കുന്നു.
- source_word: κἀγώ
  choice: ഞാൻ
  rationale: മുൻപുള്ള ബന്ധത്തിന് സമാന്തരമായ പരസ്പരത മലയാളത്തിലെ സംയോജിത ഘടനയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: καὶ αὐτοὶ
  choice: അവരും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽബലം നിലനിർത്തി, വിശ്വാസികളുടെ പങ്കാളിത്തത്തെ പിതാ-പുത്രബന്ധത്തോടു ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: വെറും സഹവാസം എന്നതിലേക്കു ചുരുക്കാതെ ഗ്രീക്കിലെ ‘in us’ എന്ന അന്തർവാസ/പങ്കാളിത്ത ഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിൽ ദൈവശാസ്ത്രസാന്ദ്രതയുള്ള സ്ഥിരപദവും അതിന്റെ വിശാല വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: πιστεύῃ
  choice: വിശ്വസിക്കേണ്ടതിന്
  rationale: വർത്തമാന സബ്ജങ്ക്റ്റീവിൽ ആരംഭിക്കുന്ന വിശ്വാസമോ തുടരുന്ന വിശ്വാസമോ പ്രത്യേകം നിർണ്ണയിക്കാതെ ഉദ്ദേശ്യവാക്യമായി നൽകുന്നു.
- source_word: ἀπέστειλας
  choice: അയച്ചു
  rationale: അയയ്ക്കൽ എന്ന പൂർത്തിയായ പ്രവൃത്തിയെ മലയാളത്തിൽ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പിതാവിനോടും പുത്രനോടും ബന്ധപ്പെടുത്തി പറയുന്ന വിശ്വാസികളുടെ ഏകതയുടെ സ്വഭാവം
  choice: ἓν എന്നത് ‘ഒന്ന്’ എന്നും ἐν ἡμῖν എന്നത് ‘നമ്മിൽ’ എന്നും വ്യാഖ്യാനവികാസമില്ലാതെ നൽകുന്നു.
  alternative: ‘എല്ലാവരും ഐക്യപ്പെട്ടിരിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘ലക്ഷ്യത്തിൽ ഒന്നായിരിക്കേണ്ടതിന്’
  rationale: വിശ്വാസികളുടെ ഏകതയെ സംഘടനാപരമോ ധാർമ്മികമോ സത്താപരമോ ആയി വാക്യം ചുരുക്കി നിർവചിക്കുന്നില്ല. ‘ഒന്ന്’, ‘നമ്മിൽ’ എന്നീ രൂപങ്ങൾ ദൈവശാസ്ത്രപരമായ ആഴവും യഥാർഥമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- issue: യോഹന്നാന്റെ അന്തർവാസഭാഷയുടെ പരിഭാഷ
  choice: ‘എന്നിൽ’, ‘അങ്ങയിൽ’, ‘നമ്മിൽ’ എന്നിങ്ങനെ ἐν നേരിട്ട് നിലനിർത്തുന്നു.
  alternative: ‘എന്നോടൊപ്പം / അങ്ങയോടൊപ്പം / നമ്മോടൊപ്പം’ അല്ലെങ്കിൽ ‘നമ്മോടു ചേർന്ന്’
  rationale: ആവർത്തിക്കുന്ന ἐν പരസ്പര അന്തർവാസത്തെയും പങ്കാളിത്തത്തെയും സൂചിപ്പിക്കുന്ന യോഹന്നാന്റെ സവിശേഷ ഭാഷയാണ്; ‘ഒപ്പം’ എന്നത് അതിന്റെ ശക്തി കുറയ്ക്കും.
- issue: πιστεύῃ എന്ന വർത്തമാന സബ്ജങ്ക്റ്റീവിന്റെ ഭാവം
  choice: ‘വിശ്വസിക്കേണ്ടതിന്’
  alternative: ‘വിശ്വസിക്കാൻ തുടങ്ങേണ്ടതിന്’ അല്ലെങ്കിൽ ‘വിശ്വാസത്തിലേക്കു വരേണ്ടതിന്’
  rationale: ലോകം പുതുതായി വിശ്വസിക്കാൻ തുടങ്ങുന്നതാണോ വിശ്വാസത്തിൽ തുടരുന്നതാണോ എന്നത് ക്രിയാരൂപം മാത്രം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ഒരു ഭാവം മാത്രം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പിതാവിനോടുള്ള ആദരസൂചക ഏകവചനമായി ‘അങ്ങ്/അങ്ങയിൽ’ ഉപയോഗിച്ചു. മൂന്നു ἵνα ഉപവാക്യങ്ങളുടെയും ആവർത്തനഘടന ‘-േണ്ടതിന്’ വഴി നിലനിർത്തി; ഇടയ്ക്കുള്ള സംബോധനവും താരതമ്യവും ദീർഘചിഹ്നങ്ങൾകൊണ്ട് വായനാസൗകര്യത്തോടെ വേർതിരിച്ചു.
