source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: ml
  text: നീ എനിക്കു നൽകിയിരിക്കുന്ന മഹത്വം ഞാനും അവർക്കു നൽകിയിരിക്കുന്നു[a]—നാം ഒന്നായിരിക്കുന്നതുപോലെ അവരും ഒന്നായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നീ എനിക്കു നൽകിയിരിക്കുന്ന മഹത്വം ഞാൻകൂടി അവർക്കു നൽകിയിരിക്കുന്നു.’ ഗ്രീക്കിലെ κἀγώ എന്നതിന് ‘ഞാനും’ എന്ന അർഥത്തിൽ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ ഉണ്ടാകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καί + ἐγώ എന്ന സംയുക്തരൂപത്തിലെ കൂട്ടിച്ചേർക്കൽ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഞാനും’ എന്നു നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തോടുള്ള ബന്ധവും ഇതിൽ സൂചിതമാണ്.
- source_word: δόξαν
  choice: മഹത്വം
  rationale: യോഹന്നാന്റെ രചനയിലെ δόξα ദൈവിക മഹത്വത്തിന്റെ ഭാരമുള്ള പദമാണ്; വെറും മനുഷ്യബഹുമാനമായി ചുരുക്കാതിരിക്കാൻ ‘മഹത്വം’ തിരഞ്ഞെടുത്തു.
- source_word: ἣν δέδωκάς μοι
  choice: നീ എനിക്കു നൽകിയിരിക്കുന്ന
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലം പൂർത്തിയായ പ്രവൃത്തിയുടെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; ‘നൽകിയിരിക്കുന്ന’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δέδωκα αὐτοῖς
  choice: അവർക്കു നൽകിയിരിക്കുന്നു
  rationale: ഇവിടെയും പൂർണ്ണകാലത്തിന്റെ നിലവിലുള്ള ഫലം ‘നൽകിയിരിക്കുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἵνα ὦσιν
  choice: ആയിരിക്കേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യബലം വ്യക്തമായി നൽകുന്നു; വെറും ഭാവിസൂചനയായി മാറ്റുന്നില്ല.
- source_word: ἓν
  choice: ഒന്ന്
  rationale: നപുംസകലിംഗ ഏകവചനമായ ‘ഒന്ന്’ ഐക്യത്തെ സൂചിപ്പിക്കുന്നു; ‘ഐക്യപ്പെട്ടവർ’ എന്ന വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കുന്നു.
- source_word: καθὼς
  choice: പോലെ
  rationale: താരതമ്യം ലളിതവും വ്യക്തവുമായി അടയാളപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἡμεῖς ἕν
  choice: നാം ഒന്നായിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ ആവർത്തിക്കാത്തെങ്കിലും മലയാളത്തിൽ പൂർണ്ണവാക്യത്തിനായി അത് ചേർക്കുന്നു; ഐക്യത്തിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിക്കാതെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വാസികളുടെ ഏകതയും പിതാവിന്റെയും പുത്രന്റെയും ഏകതയും തമ്മിലുള്ള താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: ‘നാം ഒന്നായിരിക്കുന്നതുപോലെ അവരും ഒന്നായിരിക്കേണ്ടതിന്’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ഇത് ബന്ധപരമോ, ദൈവജീവനിലെ പങ്കാളിത്തമോ, സ്ഥാപനപരമായ സഭൈക്യമോ ആണെന്ന് പ്രത്യേകം നിർവചിക്കുക.
  rationale: വാക്യം യഥാർഥമായ ഒരു താരതമ്യം അവതരിപ്പിക്കുന്നുവെങ്കിലും ആ ഏകതയുടെ രീതി ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംഘർഷവും പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മഹത്വം’, ‘ഒന്ന്’ എന്നീ യോഹന്നാനീയമായി പ്രാധാന്യമുള്ള പദങ്ങൾ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തി; രണ്ട് ഗ്രീക്ക് പൂർണ്ണകാലങ്ങളുടെയും നിലനിൽക്കുന്ന ഫലം മലയാളത്തിലെ ‘നൽകിയിരിക്കുന്ന/നൽകിയിരിക്കുന്നു’ രൂപങ്ങളിലൂടെ പ്രകടമാക്കി.
