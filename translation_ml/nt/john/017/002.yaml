theological_decisions:
- issue: ‘എല്ലാ ജഡം’ എന്നതിന്റെയും ‘നീ അവന് നൽകിയിട്ടുള്ള എല്ലാവരും’ എന്നതിന്റെയും വ്യാപ്തിയും ബന്ധവും
  choice: പുത്രന്റെ അധികാരത്തിന്റെ സാർവ്വത്രിക വ്യാപ്തിയും പിതാവ് പുത്രന് നൽകിയവർക്ക് നിത്യജീവൻ നൽകുന്നതും തമ്മിലുള്ള വാക്യത്തിലെ വ്യത്യാസം അതേപടി നിലനിർത്തി.
  alternative: ‘എല്ലാ മനുഷ്യരുടെയും മേൽ’ എന്നു മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനാത്മകമായി നൽകുക; അല്ലെങ്കിൽ πᾶν ὃ എന്നത് ‘നീ അവന് നൽകിയിട്ടുള്ള സകലവും’ എന്നു അക്ഷരാർത്ഥത്തിൽ നൽകുക.
  rationale: ഗ്രീക്ക് വാക്യം സാർവ്വത്രിക അധികാരത്തെയും നിത്യജീവൻ ലഭിക്കുന്ന പ്രത്യേക കൂട്ടത്തെയും വേർതിരിക്കുന്നു. ഒരു മതവിഭാഗത്തിന്റെ വ്യവസ്ഥകൊണ്ട് ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ‘ജഡം’ എന്ന ബൈബിൾപ്രയോഗം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ സാധാരണ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു. ഗ്രീക്കിലെ clause order കഴിയുന്നത്ര പിന്തുടർന്ന്, നിത്യജീവൻ ലഭിക്കുന്നവർ ‘എല്ലാ ജഡം’ എന്നതല്ല, പിതാവ് പുത്രന് നൽകിയവരാണെന്ന് വ്യാകരണപരമായി വ്യക്തമായി.
