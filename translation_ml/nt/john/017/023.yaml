revisions:
- from: ഞാൻ അവരിലും അങ്ങ് എന്നിലും ആയിരിക്കട്ടെ; അങ്ങനെ അവർ ഒന്നിലേക്കു പൂർണരാക്കപ്പെടട്ടെ[a]. അപ്പോൾ അങ്ങ് എന്നെ അയച്ചെന്നും അങ്ങ് എന്നെ സ്നേഹിച്ചതുപോലെ അവരെയും സ്നേഹിച്ചെന്നും ലോകം അറിയും.
  to: ഞാൻ അവരിലും അങ്ങ് എന്നിലും ആയിരിക്കെ, അവർ ഒന്നായി പൂർണത പ്രാപിക്കേണ്ടതിന്; അങ്ങനെ, അങ്ങ് എന്നെ അയച്ചെന്നും അങ്ങ് എന്നെ സ്നേഹിച്ചതുപോലെ അവരെയും സ്നേഹിച്ചെന്നും ലോകം അറിയേണ്ടതിന്.
  rationale: The revision replaces the unwarranted volitive opening with ‘ആയിരിക്കെ,’ which retains the source’s asserted mutual-indwelling setting without supplying an imperative. It renders τετελειωμένοι together with εἰς ἕν as completion into unity, while avoiding an implication of absolute sinlessness. Both purpose clauses are retained as purpose-oriented Malayalam clauses, and the direct comparison of the Father’s love remains unchanged.
