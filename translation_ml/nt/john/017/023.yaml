id: JHN.17.23
reference: John 17:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: ml
  text: ഞാൻ അവരിലും അങ്ങ് എന്നിലും ആയിരിക്കെ, അവർ ഒന്നായി പൂർണത പ്രാപിക്കേണ്ടതിന്; അങ്ങനെ, അങ്ങ് എന്നെ അയച്ചെന്നും അങ്ങ് എന്നെ സ്നേഹിച്ചതുപോലെ അവരെയും സ്നേഹിച്ചെന്നും ലോകം അറിയേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: അവരിലും / എന്നിലും
  rationale: യോഹന്നാന്റെ സുവിശേഷത്തിലെ പരസ്പര അന്തർവാസഭാഷ നിലനിർത്താൻ ἐν എന്നതിനെ ‘ഇൽ’ എന്ന അർഥത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: τετελειωμένοι
  choice: പൂർണരാക്കപ്പെടട്ടെ
  rationale: പൂർത്തിയായ പ്രവർത്തനത്തിന്റെ ഫലാവസ്ഥ സൂചിപ്പിക്കുന്ന perfect passive participle-ന്റെ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ധാർമിക പാപരാഹിത്യം മാത്രം അർഥമാക്കുന്നില്ല.
- source_word: εἰς ἕν
  choice: ഒന്നിലേക്ക്
  rationale: εἰς + accusative സൂചിപ്പിക്കുന്ന ഏകതയിലേക്കുള്ള ഗതിയും ഫലവും നിലനിർത്തുന്നു.
- source_word: γινώσκῃ
  choice: അറിയും
  rationale: ἵνα ഉദ്ദേശ്യ/ഫലവാക്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ലോകം തിരിച്ചറിയുന്നതെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ പതിവായ പദപ്രയോഗം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀπέστειλας
  choice: അയച്ചു
  rationale: പിതാവ് പുത്രനെ അയച്ച ദൗത്യഭാവം സ്വാഭാവികമായും സ്ഥിരതയോടെയും നൽകുന്നു.
- source_word: ἠγάπησας
  choice: സ്നേഹിച്ചു
  rationale: രണ്ടിടത്തുമുള്ള ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: സ്നേഹിച്ചതുപോലെ
  rationale: താരതമ്യത്തിന്റെ ശക്തി മയപ്പെടുത്താതെയും അതിന്റെ വ്യാപ്തി വിശദീകരിക്കാതെയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അങ്ങ് എന്നെ സ്നേഹിച്ചതുപോലെ അവരെയും സ്നേഹിച്ചു’ എന്ന താരതമ്യത്തിന്റെ ശക്തി
  choice: താരതമ്യം മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അതേ തരത്തിലുള്ള സ്നേഹത്തോടെ’ എന്ന വ്യാഖ്യാനപരമായ മയപ്പെടുത്തൽ.
  rationale: καθὼς യഥാർഥ താരതമ്യം അവതരിപ്പിക്കുന്നു; പിതാവിന് വിശ്വാസികളോടുള്ള സ്നേഹവും പുത്രനോടുള്ള സ്നേഹവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ ഭാരം പരിഭാഷ സംരക്ഷിക്കണം.
- issue: τετελειωμένοι എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ഏകതയിലേക്കു പൂർണരാക്കപ്പെടുക.
  alternative: സമ്പൂർണ പാപരാഹിത്യത്തിലെത്തുക; അല്ലെങ്കിൽ വെറും ‘ഐക്യപ്പെട്ടിരിക്കുക’.
  rationale: ക്രിയ പൂർത്തീകരണവും ഫലാവസ്ഥയും സൂചിപ്പിക്കുന്നു. ‘ഒന്നിലേക്ക്’ എന്നതോടൊപ്പം ഇത് ഏകതയിലേക്കുള്ള പൂർത്തീകരണത്തെ പ്രകടിപ്പിക്കുന്നു; സമ്പൂർണ പാപരാഹിത്യം നിർബന്ധിച്ച് വായിക്കുന്നില്ല.
- issue: ആദ്യത്തെ ἵναയും രണ്ടാമത്തെ ἵναയും തമ്മിലുള്ള ബന്ധം
  choice: ആദ്യത്തേത് ‘അങ്ങനെ’ എന്നും രണ്ടാമത്തേത് ‘അപ്പോൾ’ എന്നും സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
  alternative: രണ്ടും ഒരേപോലെ ‘അതിനായി’ എന്ന് ആവർത്തിക്കുക.
  rationale: ഗ്രീക്കിലെ തുടർച്ചയായ ഉദ്ദേശ്യ/ഫലബന്ധം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നൽകുന്നു; ലോകത്തിന്റെ അറിവ് വിശ്വാസികളുടെ പൂർത്തീകരിക്കപ്പെട്ട ഏകതയുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പിതാവിനോടുള്ള അഭിസംബോധനയ്ക്ക് ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാക്യഘടന പൂർണമായി അനുകരിക്കാതെ, അന്തർവാസം, ഏകതയിലേക്കുള്ള പൂർത്തീകരണം, സ്നേഹത്തിന്റെ ശക്തമായ താരതമ്യം എന്നിവ നിലനിർത്തി.
