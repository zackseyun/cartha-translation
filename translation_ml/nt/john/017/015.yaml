  to: അവരെ ലോകത്തിൽനിന്ന് എടുത്തുകളയണമെന്ന് ഞാൻ അപേക്ഷിക്കുന്നില്ല; മറിച്ച്, ദുഷ്ടനിൽനിന്ന്[a] നീ അവരെ കാത്തുകൊള്ളണമെന്ന് ഞാൻ അപേക്ഷിക്കുന്നു.
