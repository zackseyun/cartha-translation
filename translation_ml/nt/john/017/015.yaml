id: JHN.17.15
reference: John 17:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: ml
  text: അവരെ ലോകത്തിൽനിന്ന് എടുത്തുകളയണമെന്ന് ഞാൻ അപേക്ഷിക്കുന്നില്ല; മറിച്ച്, ദുഷ്ടനിൽനിന്ന്[a] നീ അവരെ കാത്തുകൊള്ളണമെന്ന് ഞാൻ അപേക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തിന്മയിൽനിന്ന്.” ഗ്രീക്കിലെ τοῦ πονηροῦ എന്ന പ്രയോഗത്തിന് “ദുഷ്ടൻ” എന്നും “തിന്മ” എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ഞാൻ അപേക്ഷിക്കുന്നത്
  rationale: വർത്തമാനകാലത്തിലെ അപേക്ഷയെ സ്വാഭാവികമായ പ്രാർഥനാഭാഷയിൽ അവതരിപ്പിക്കുന്നു; ‘അപേക്ഷിക്കുക’ എന്നത് പദത്തിന്റെ അടിസ്ഥാനമായ ചോദിക്കൽ/അഭ്യർഥിക്കൽ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἄρῃς
  choice: എടുത്തുകളയുക
  rationale: αἴρω ഇവിടെ നീക്കിക്കളയുക എന്ന അർഥത്തിലാണ്; ἐκ τοῦ κόσμου എന്ന ഘടനയോടൊപ്പം ‘ലോകത്തിൽനിന്ന് എടുത്തുകളയുക’ സ്വാഭാവികമാണ്.
- source_word: κόσμου
  choice: ലോകം
  rationale: യോഹന്നാന്റെ രചനകളിൽ κόσμος പലപ്പോഴും ദൈവത്തോട് വിരോധമുള്ള മനുഷ്യലോകക്രമത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, വിശാലതയും സന്ദർഭാർഥവും നിലനിർത്തുന്ന സാധാരണ പരിഭാഷ ‘ലോകം’ ആണ്.
- source_word: τηρήσῃς
  choice: കാത്തുകൊള്ളുക
  rationale: τηρέω എന്നതിലെ കാക്കുക, സംരക്ഷിക്കുക, നിലനിർത്തുക എന്നീ ആശയങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സംരക്ഷണത്തിന്റെ രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐκ
  choice: -ൽനിന്ന്
  rationale: τηρήσῃς ... ἐκ എന്ന ഘടനയിൽ അപകടത്തിൽനിന്നോ ദോഷത്തിൽനിന്നോ സംരക്ഷിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: τοῦ πονηροῦ
  choice: ദുഷ്ടൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഏകവചന വിശേഷണം പുല്ലിംഗമായി ‘ദുഷ്ടൻ’ എന്നും നപുംസകലിംഗമായി ‘തിന്മ’ എന്നും ഗ്രഹിക്കാം. യോഹന്നാനീയ പ്രയോഗം വ്യക്തിപരമായ സൂചനയ്ക്ക് പിന്തുണ നൽകുന്നതിനാൽ മുഖ്യവാചകത്തിൽ ‘ദുഷ്ടൻ’ സ്വീകരിക്കുന്നു; യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ πονηροῦ എന്നത് വ്യക്തിപരമായ ‘ദുഷ്ടൻ’ ആണോ വ്യക്തിരഹിതമായ ‘തിന്മ’ ആണോ
  choice: ദുഷ്ടൻ
  alternative: തിന്മ
  rationale: ഗ്രീക്ക് രൂപം ഇരു വായനകളും അനുവദിക്കുന്നു. യോഹന്നാനീയ പ്രയോഗത്തിൽ വ്യക്തിപരമായ ദുഷ്ടശക്തിയിലേക്കുള്ള സൂചന ശക്തമായതിനാൽ മുഖ്യവാചകത്തിൽ ‘ദുഷ്ടൻ’ തെരഞ്ഞെടുത്തു; എന്നാൽ ദൈവശാസ്ത്രപരമായ സന്ദിഗ്ധത തീർപ്പാക്കാതെ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രാർഥനാഭാഷ. ‘ഞാൻ അപേക്ഷിക്കുന്നത്’ എന്ന ആവർത്തിത ഘടന ഗ്രീക്ക് വാക്യത്തിലെ οὐκ ... ἀλλ’ ... എന്ന ശക്തമായ വിരോധബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
