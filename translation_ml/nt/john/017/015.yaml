  terminology: ലോകം, എടുത്തുകളയുക, and കാത്തുകൊള്ളുക are suitable. ദുഷ്ടൻ is an acceptable personal rendering of τοῦ πονηροῦ; the footnote must preserve the viable neuter sense, ‘evil.’
