revisions:
- from: ലോകത്തിൽനിന്ന്[a] നീ എനിക്കു നൽകിയ മനുഷ്യർക്ക്[b] ഞാൻ നിന്റെ നാമം[c] വെളിപ്പെടുത്തിയിരിക്കുന്നു[d]. അവർ നിനക്കുള്ളവരായിരുന്നു; നീ അവരെ എനിക്കു നൽകി; അവർ നിന്റെ വചനം കാത്തിരിക്കുന്നു[e].
  to: ലോകത്തിൽനിന്ന്[a] നീ എനിക്കു നൽകിയ ആളുകൾക്ക്[b] ഞാൻ നിന്റെ നാമം[c] വെളിപ്പെടുത്തി[d]. അവർ നിനക്കുള്ളവരായിരുന്നു; നീ അവരെ എനിക്കു നൽകി; അവർ നിന്റെ വചനം കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു[e].
  rationale: The revision corrects the aspectual rendering of τετήρηκαν and uses a more natural generic Malayalam expression for ἄνθρωποι. It otherwise preserves the draft's faithful terminology, theological restraint, and footnote coverage.
