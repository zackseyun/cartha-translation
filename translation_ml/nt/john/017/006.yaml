id: JHN.17.6
reference: John 17:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: ml
  text: ലോകത്തിൽനിന്ന്[a] നീ എനിക്കു നൽകിയ ആളുകൾക്ക്[b] ഞാൻ നിന്റെ നാമം[c] വെളിപ്പെടുത്തി[d]. അവർ നിനക്കുള്ളവരായിരുന്നു; നീ അവരെ എനിക്കു നൽകി; അവർ നിന്റെ വചനം കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലോകത്തിൽനിന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മനുഷ്യർക്ക്.’ സമീപസന്ദർഭത്തിൽ യേശുവിന്റെ ശിഷ്യന്മാരാണ് സൂചിതർ.
    reason: lexical_alternative
  - marker: c
    text: ‘നിന്റെ നാമം’ എന്നത് ഉച്ചരിക്കപ്പെടുന്ന ഒരു പേരിനെ മാത്രം അല്ല, ദൈവം വെളിപ്പെടുത്തിയ തന്റെ വ്യക്തിത്വത്തെയും സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘അറിയിച്ചു’ അല്ലെങ്കിൽ ‘വെളിവാക്കി.’
    reason: lexical_alternative
  - marker: e
    text: അഥവാ, ‘നിന്റെ വചനം പാലിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അനുസരിച്ചിരിക്കുന്നു.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘നിന്റെ വചനം കാത്തുസൂക്ഷിച്ചിരിക്കുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: φανερόω എന്നത് വെളിവാക്കുക, അറിയിക്കുക എന്ന അർഥം നൽകുന്നു. സന്ദർഭത്തിൽ ദൈവത്തിന്റെ നാമത്തെ വെളിപ്പെടുത്തിയെന്ന ആശയം സ്വാഭാവികമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു; അഓറിസ്റ്റിനെ മലയാളത്തിലെ പൂർത്തിയായ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ ὄνομα
  choice: നിന്റെ നാമം
  rationale: മൂലപാഠത്തിലെ ദൃശ്യരൂപമായ ‘നാമം’ നിലനിർത്തുന്നു. യോഹന്നാന്റെ പ്രയോഗത്തിൽ ഇത് ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വവും സ്വഭാവവും ഉൾക്കൊള്ളുന്നുവെങ്കിലും അതിനെ വ്യാഖ്യാനപരമായി ചുരുക്കുന്നില്ല.
- source_word: τοῖς ἀνθρώποις
  choice: മനുഷ്യർക്ക്
  rationale: ἄνθρωποι എന്നതിന്റെ സാധാരണ അർഥം ‘മനുഷ്യർ/ആളുകൾ’ എന്നാണ്. സമീപസന്ദർഭത്തിലെ സൂചിതർ യേശുവിന്റെ ശിഷ്യന്മാരാണെങ്കിലും, ഗ്രീക്ക് പദം ἄνδρες അല്ലാത്തതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി ‘പുരുഷന്മാർ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: οὓς ἔδωκάς μοι
  choice: നീ എനിക്കു നൽകിയ
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥവും പിതാവ് അവരെ പുത്രന് നൽകിയെന്ന പ്രസ്താവനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ κόσμου
  choice: ലോകത്തിൽനിന്ന്
  rationale: ἐκ എന്നതിലെ ഒരു കൂട്ടത്തിനുള്ളിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന സാധ്യത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: σοὶ ἦσαν
  choice: അവർ നിനക്കുള്ളവരായിരുന്നു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: നീ അവരെ എനിക്കു നൽകി
  rationale: κἀμοί എന്നതിലെ ‘എനിക്കും/എനിക്ക്’ എന്ന ബന്ധം സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸν λόγον σου
  choice: നിന്റെ വചനം
  rationale: λόγος എന്ന പദത്തിന്റെ ‘വാക്ക്/സന്ദേശം/ഉപദേശം’ എന്ന അർഥവ്യാപ്തിയും യോഹന്നാനിലെ ദൈവശാസ്ത്രപരമായ അനുരണനവും ‘വചനം’ നിലനിർത്തുന്നു.
- source_word: τετήρηκαν
  choice: കാത്തിരിക്കുന്നു
  rationale: τηρέω എന്നതിലെ കാത്തുസൂക്ഷിക്കൽ, അനുസരിച്ച് പാലിക്കൽ എന്നീ അർഥങ്ങൾ തുറന്നുവെക്കുന്നു. ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം മലയാളരൂപം സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നിന്റെ നാമം’ എന്നതിന്റെ യോഹന്നാനീയ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നിന്റെ നാമം’ നിലനിർത്തി
  alternative: ‘നീ ആരാണെന്ന്’ അല്ലെങ്കിൽ ‘നിന്റെ സ്വഭാവം’ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: ഇത് പിതാവിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും സ്വഭാവത്തെയും സാന്നിധ്യത്തെയും സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിന്റെ ദൃശ്യരൂപവും ദൈവശാസ്ത്രപരമായ ആഴവും നഷ്ടപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- issue: τοῖς ἀνθρώποις എന്നതിന്റെ ലിംഗവും സൂചിതരും
  choice: ‘മനുഷ്യർക്ക്’
  alternative: ‘പുരുഷന്മാർക്ക്’ അല്ലെങ്കിൽ ‘ആളുകൾക്ക്’
  rationale: ഉടൻ സൂചിപ്പിക്കപ്പെടുന്ന ശിഷ്യർ പുരുഷന്മാരായിരുന്നെങ്കിലും ἄνθρωποι സ്വതവേ പൊതുവായ പദമാണ്. ‘മനുഷ്യർ’ ചരിത്രസന്ദർഭം നിഷേധിക്കാതെയും മൂലപദത്തെ അനാവശ്യമായി ലിംഗപരമായി ചുരുക്കാതെയും പരിഭാഷപ്പെടുത്തുന്നു.
- issue: പിതാവ് ആളുകളെ പുത്രന് നൽകുന്നതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന
  choice: ‘നീ അവരെ എനിക്കു നൽകി’ എന്ന പ്രസ്താവന വിശദീകരണം ചേർക്കാതെ നിലനിർത്തി
  alternative: തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സംവിധാനപ്രകാരം വികസിപ്പിക്കുക
  rationale: വാക്യം ദൈവികമായ നൽകൽ വ്യക്തമായി പ്രസ്താവിക്കുന്നു; എന്നാൽ അതിന്റെ മുഴുവൻ ക്രമമോ കാരണമോ ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: τετήρηκαν എന്നതിലെ കാത്തുസൂക്ഷിക്കലും അനുസരണവും
  choice: ‘കാത്തിരിക്കുന്നു’
  alternative: ‘അനുസരിച്ചിരിക്കുന്നു’
  rationale: മൂലക്രിയയ്ക്ക് കാത്തുസൂക്ഷിക്കുക, പാലിക്കുക, അനുസരിക്കുക എന്നീ ബന്ധിത അർഥങ്ങളുണ്ട്. പ്രധാനപാഠം കൂടുതൽ നേരിട്ട രൂപം സ്വീകരിക്കുന്നു; അനുസരണത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ പ്രാർത്ഥനയുടെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘നാമം,’ ‘വചനം’ എന്നീ ബൈബിൾപരമായി പ്രാധാന്യമുള്ള പദങ്ങൾ വ്യാഖ്യാനപരമായി ലഘൂകരിക്കാതെ സൂക്ഷിച്ചു; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
