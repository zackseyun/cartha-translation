source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ ഞാൻ അങ്ങയുടെ അടുക്കലേക്കു വരുന്നു. എന്റെ സന്തോഷം അവരിൽത്തന്നെ[b] പൂർണമാകേണ്ടതിന്[a] ഞാൻ ലോകത്തിൽവെച്ച് ഇക്കാര്യങ്ങൾ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിറഞ്ഞിരിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘സമ്പൂർണമാകേണ്ടതിന്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരുടെ ഉള്ളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: νῦν ഇപ്പോഴത്തെ സമയത്തെയും δέ മുമ്പുള്ളതിൽനിന്നുള്ള മൃദുവായ ആശയമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ ഇപ്പോൾ’ അതിശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കാതെ രണ്ടും നിലനിർത്തുന്നു.
- source_word: πρὸς σὲ ἔρχομαι
  choice: ഞാൻ അങ്ങയുടെ അടുക്കലേക്കു വരുന്നു
  rationale: πρός സഹിതമുള്ള ἔρχομαι പിതാവിന്റെ അടുക്കലേക്കുള്ള ചലനം വ്യക്തമാക്കുന്നു. പ്രാർത്ഥനയിലെ ആദരസൂചകമായ അഭിസംബോധനയ്ക്കായി ‘അങ്ങയുടെ’ ഉപയോഗിച്ചു.
- source_word: ταῦτα λαλῶ
  choice: ഞാൻ ഇക്കാര്യങ്ങൾ പറയുന്നു
  rationale: ταῦτα എന്ന ബഹുവചനത്തെ ‘ഇക്കാര്യങ്ങൾ’ എന്നു നിലനിർത്തുന്നു; λαλῶയുടെ വർത്തമാനകാല പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ ‘പറയുന്നു’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ κόσμῳ
  choice: ലോകത്തിൽവെച്ച്
  rationale: യേശു ലോകത്തിൽ ഉണ്ടായിരിക്കെ ഈ വാക്കുകൾ പറയുന്നതാണ് സന്ദർഭം; അതേസമയം യോഹന്നാനിലെ ‘ലോകം’ എന്ന പ്രധാന പദവും നിലനിർത്തുന്നു.
- source_word: ἵνα ἔχωσιν
  choice: ഉണ്ടാകേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. മലയാളവാക്യത്തിൽ സന്തോഷത്തിന്റെ പൂർണതയുമായി ചേർത്ത് ‘പൂർണമാകേണ്ടതിന്’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: എന്റെ സന്തോഷം
  rationale: ἐμὴν യേശുവിനുള്ള സന്തോഷത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; വ്യാഖ്യാനപരമായ വിപുലീകരണം കൂടാതെ ഉടമസ്ഥത നിലനിർത്തുന്നു.
- source_word: πεπληρωμένην
  choice: പൂർണമാകുക
  rationale: πληρόωയുടെ perfect passive രൂപം സന്തോഷം പൂർണതയിലെത്തി നിലനിൽക്കുന്ന ആശയം നൽകുന്നു. ‘പൂർണമാകുക’ ആ ഫലാവസ്ഥയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: അവരിൽത്തന്നെ
  rationale: പ്രതിഫലന സർവനാമം ശിഷ്യന്മാരുടെ ഉള്ളിലുള്ള അനുഭവത്തെയോ അവരിൽ നിലനിൽക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു; ‘അവരിൽത്തന്നെ’ മൂലരൂപത്തോട് അടുത്തുനിൽക്കുന്നു.
theological_decisions:
- issue: ‘എന്റെ സന്തോഷം’ എന്നതിന്റെ സ്വഭാവം
  choice: യേശുവിനുള്ള സന്തോഷം ശിഷ്യന്മാരിൽ പൂർണമാകുന്നു
  alternative: യേശുവിനെക്കുറിച്ചുള്ള ശിഷ്യന്മാരുടെ സന്തോഷം
  rationale: ἐμὴν എന്ന ഉടമസ്ഥവിശേഷണം സ്വാഭാവികമായി യേശുവിന്റെ സ്വന്തം സന്തോഷത്തെ സൂചിപ്പിക്കുന്നു. ആ സന്തോഷത്തിൽ ശിഷ്യന്മാർ എങ്ങനെ പങ്കുചേരുന്നു എന്നത് വിശദീകരിക്കാതെ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. പിതാവിനോടുള്ള പ്രാർത്ഥനയായതിനാൽ ‘അങ്ങ്’ എന്ന ആദരരൂപം ഉപയോഗിച്ചു; യോഹന്നാനിലെ ‘ലോകം,’ ‘എന്റെ സന്തോഷം’ എന്നീ മുഖ്യപ്രയോഗങ്ങൾ സംരക്ഷിച്ചു.
