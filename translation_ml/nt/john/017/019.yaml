id: JHN.17.19
reference: John 17:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: ml
  text: അവർക്കുവേണ്ടി ഞാൻ എന്നെത്തന്നെ വിശുദ്ധീകരിക്കുന്നു[a], അവരും സത്യത്തിൽ[b] വിശുദ്ധീകരിക്കപ്പെട്ടവരായിരിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെത്തന്നെ വിശുദ്ധമായി വേർതിരിച്ചു സമർപ്പിക്കുന്നു.’ വാക്യത്തിൽ പിന്നീട് വരുന്ന ‘വിശുദ്ധീകരിക്കപ്പെട്ടവർ’ എന്ന പദത്തിലും ഇതേ ഗ്രീക്ക് ധാതുവാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആ സത്യത്തിൽ’; 17:17 താരതമ്യം ചെയ്യുക. ‘സത്യത്താൽ’ എന്നും ഈ പ്രയോഗം മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: അവർക്കുവേണ്ടി
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπέρ ഇവിടെ അവരുടെ നന്മയ്ക്കായി, അവർക്കുവേണ്ടി എന്ന അർഥം നൽകുന്നു; പകരമരണത്തിന്റെ ആശയം വാചകത്തിൽനിന്ന് അധികമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: ἁγιάζω … ἡγιασμένοι
  choice: വിശുദ്ധീകരിക്കുന്നു … വിശുദ്ധീകരിക്കപ്പെട്ടവരായിരിക്കുക
  rationale: ഒരേ ഗ്രീക്ക് ധാതുവിന്റെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു. ആദ്യ പ്രയോഗത്തിൽ ഇത് ധാർമിക അശുദ്ധിയിൽനിന്നുള്ള മാറ്റമെന്നതിലുപരി വിശുദ്ധ ദൗത്യത്തിനായുള്ള സ്വയം വേർതിരിക്കലിനെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; പൂർണകാല നിഷ്ക്രിയരൂപം ഫലമായി നിലവിൽ വരുന്ന അവസ്ഥയും പ്രകടമാക്കുന്നു.
- source_word: ἐμαυτόν
  choice: എന്നെത്തന്നെ
  rationale: യേശുവിന്റെ പ്രവൃത്തി അവനിലേക്കുതന്നെ തിരിയുന്നതായി പ്രതിഫലന സർവനാമം വ്യക്തമായി നൽകുന്നു.
- source_word: ἵνα
  choice: —ആയിരിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ αὐτοὶ
  choice: അവരും
  rationale: καί നൽകുന്ന ഉൾപ്പെടുത്തലും αὐτοί നൽകുന്ന ഊന്നലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: അനാർത്രസ് ഗ്രീക്ക് പ്രയോഗത്തെ അനാവശ്യമായി കൂടുതൽ നിർദിഷ്ടമാക്കാതെ, വിശുദ്ധീകരണം സംഭവിക്കുന്ന മണ്ഡലമോ യാഥാർഥ്യമോ ആയി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശു തന്നെത്തന്നെ വിശുദ്ധീകരിക്കുന്നു എന്നതിന്റെ അർഥം
  choice: തന്റെ ദൗത്യത്തിനായി തന്നെത്തന്നെ വിശുദ്ധമായി വേർതിരിച്ച് സമർപ്പിക്കുന്നു
  alternative: ധാർമികമായി കൂടുതൽ വിശുദ്ധനാകുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ ἁγιάζω യേശുവിന്റെ ദൗത്യത്തിനായുള്ള സ്വയം സമർപ്പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ഒരേ ധാതുബന്ധം മറയ്ക്കാതിരിക്കാൻ മുഖ്യപാഠത്തിൽ ‘വിശുദ്ധീകരിക്കുന്നു’ നിലനിർത്തി, അർഥവ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐν ἀληθείᾳ എന്നതിന്റെ ബന്ധം
  choice: സത്യത്തിൽ—വിശുദ്ധീകരണത്തിന്റെ മണ്ഡലമോ യാഥാർഥ്യമോ
  alternative: സത്യത്താൽ; ആ സത്യത്തിൽ
  rationale: മൂലപാഠത്തിൽ നിർദിഷ്ട ആർട്ടിക്കിൾ ഇല്ല. അതിനാൽ ‘സത്യത്തിൽ’ എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തുന്നു; 17:17-നോടുള്ള ബന്ധം വായനക്കാരന് കേൾക്കാൻ കഴിയുകയും ഉപാധി/കരണം എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ച വിശുദ്ധീകരണ-ധാതുബന്ധം നിലനിർത്തിയിട്ടുണ്ട്; ആദ്യ പ്രയോഗത്തിലെ സമർപ്പണാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു. അവസാനത്തെ ‘അത്’ മലയാളത്തിൽ ഉദ്ദേശ്യബന്ധം സ്വാഭാവികമാക്കുന്നു; മുൻപ്രവൃത്തിയെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
