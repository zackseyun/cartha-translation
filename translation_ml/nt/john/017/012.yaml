id: JHN.17.12
reference: John 17:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: ml
  text: ഞാൻ അവരോടുകൂടെ ആയിരുന്നപ്പോൾ, നീ എനിക്കു നൽകിയ നിന്റെ നാമത്തിൽ ഞാൻ അവരെ കാത്തുപോന്നു; ഞാൻ അവരെ കാവൽചെയ്തു. അവരിൽ ആരും നശിച്ചുപോയില്ല[a]—നാശത്തിന്റെ പുത്രൻ[b] ഒഴികെ—തിരുവെഴുത്ത് നിവൃത്തിയാകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അവരിൽ ആരും നഷ്ടപ്പെട്ടില്ല.’'
    reason: lexical_alternative
  - marker: b
    text: '‘നാശത്തിന്റെ പുത്രൻ’ എന്നത് എബ്രായശൈലിയിലുള്ള പ്രയോഗമാണ്; മറ്റൊരു പരിഭാഷ: ‘നാശത്തിനായി വിധിക്കപ്പെട്ടവൻ’; പരമ്പരാഗതമായി: ‘നാശപുത്രൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: ഞാൻ അവരോടുകൂടെ ആയിരുന്നപ്പോൾ
  rationale: കാലസംബന്ധിയായ ഉപവാക്യവും യേശു ശിഷ്യന്മാരോടുകൂടെ ഉണ്ടായിരുന്ന തുടർച്ചയായ അവസ്ഥയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐτήρουν αὐτοὺς
  choice: ഞാൻ അവരെ കാത്തുപോന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനം ‘കാത്തുപോന്നു’ വ്യക്തമാക്കുന്നു; തുടർന്ന് വരുന്ന φυλάσσω-യിൽനിന്നുള്ള പദവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματί σου
  choice: നിന്റെ നാമത്തിൽ
  rationale: ‘നാമം’ ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട സ്വഭാവത്തെയും അധികാരത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സമ്പന്നമായ പ്രയോഗമായതിനാൽ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ᾧ δέδωκάς μοι
  choice: നീ എനിക്കു നൽകിയ
  rationale: നപുംസക ഏകവചനമായ ബന്ധസർവനാമം ‘നാമം’ എന്നതിനോടാണ് സ്വാഭാവികമായി ചേരുന്നത്; അതിനാൽ ശിഷ്യന്മാരെയല്ല, നാമത്തെയാണ് ഈ ഉപവാക്യം വിശേഷിപ്പിക്കുന്നത്.
- source_word: καὶ ἐφύλαξα
  choice: ഞാൻ അവരെ കാവൽചെയ്തു
  rationale: τηρέω-യിൽനിന്നുള്ള വ്യത്യാസം സൂക്ഷിച്ച്, സംരക്ഷിച്ചു കാവൽനിൽക്കുക എന്ന ശക്തമായ ഭാവം നൽകുന്നു.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: അവരിൽ ആരും നശിച്ചുപോയില്ല
  rationale: ἀπόλλυμι എന്ന പദത്തിന്റെ ഗൗരവമുള്ള ‘നശിക്കുക’ എന്ന അർഥം നൽകുന്നു; യോഹന്നാനിലെ ‘നഷ്ടപ്പെട്ടില്ല’ എന്ന പ്രതിധ്വനിയുള്ള മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: നാശത്തിന്റെ പുത്രൻ
  rationale: സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: തിരുവെഴുത്ത് നിവൃത്തിയാകേണ്ടതിന്
  rationale: ἵνα നിർമാണത്തിലെ ഉദ്ദേശ്യം/ഫലം എന്ന ഭാവവും πληρόω-യുടെ നിവൃത്തി എന്ന തിരുവെഴുത്തുപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ᾧ δέδωκάς μοι എന്ന ബന്ധവാക്യത്തിന്റെ സൂചിതപദം
  choice: ‘നീ എനിക്കു നൽകിയ’ എന്നത് ‘നിന്റെ നാമം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്നു.
  alternative: ‘നീ എനിക്കു നൽകിയവർ’ എന്ന അർഥത്തിൽ ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്നു.
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ നപുംസക ഏകവചന ബന്ധസർവനാമം നപുംസക ഏകവചനമായ ‘നാമം’ എന്ന പദത്തോടാണ് വ്യാകരണപരമായി യോജിക്കുന്നത്; പരിചിതമായ മറ്റൊരു യോഹന്നാനീയ പ്രയോഗത്തോട് സമീകരിച്ചിട്ടില്ല.
- issue: ὁ υἱὸς τῆς ἀπωλείας എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘നാശത്തിന്റെ പുത്രൻ’ എന്ന സെമിറ്റിക് ശൈലി നിലനിർത്തുന്നു.
  alternative: ‘നാശത്തിനായി വിധിക്കപ്പെട്ടവൻ’ അല്ലെങ്കിൽ പരമ്പരാഗതമായി ‘നാശപുത്രൻ’.
  rationale: ഈ പ്രയോഗം നാശത്താൽ സ്വഭാവീകരിക്കപ്പെട്ടവനെയോ നാശത്തിലേക്കു പോകുന്നവനെയോ സൂചിപ്പിക്കാം; മുൻനിർണ്ണയത്തെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തപ്രസ്താവനയായി വികസിപ്പിക്കാതെ ഉള്ളിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἵναയും തിരുവെഴുത്തിന്റെ നിവൃത്തിയും
  choice: ‘തിരുവെഴുത്ത് നിവൃത്തിയാകേണ്ടതിന്’ എന്ന് ഉദ്ദേശ്യം/ഫലം തുറന്നുവെക്കുന്നു.
  alternative: ‘അങ്ങനെ തിരുവെഴുത്ത് നിവൃത്തിയായി’ എന്ന ശുദ്ധ ഫലവായന.
  rationale: ἵνα നിർമാണത്തിന്റെ ഉദ്ദേശ്യ-ഫല വ്യാപ്തി ഏകപക്ഷീയമായി തീർപ്പാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘കാത്തുപോന്നു’/‘കാവൽചെയ്തു’ എന്ന പദവ്യത്യാസം ഗ്രീക്കിലെ τηρέω/φυλάσσω വ്യത്യാസം സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
