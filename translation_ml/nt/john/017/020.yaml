id: JHN.17.20
reference: John 17:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: ml
  text: “ഇവരെക്കുറിച്ചുമാത്രമല്ല ഞാൻ അപേക്ഷിക്കുന്നത്; ഇവരുടെ വചനത്തിലൂടെ[a] എന്നിൽ വിശ്വസിക്കുന്നവരെക്കുറിച്ചും അപേക്ഷിക്കുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സന്ദേശത്തിലൂടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: അപേക്ഷിക്കുന്നു
  rationale: പിതാവിനോടുള്ള യേശുവിന്റെ അഭ്യർഥനയാണ് സന്ദർഭം. മലയാളത്തിൽ ‘ചോദിക്കുന്നു’ എന്നത് ചോദ്യം ചോദിക്കുന്നതായും മനസ്സിലാകാം; ‘അപേക്ഷിക്കുന്നു’ ഇവിടെ അഭ്യർഥനയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ ‘പ്രാർഥിക്കുന്നു’ എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: περὶ τούτων
  choice: ഇവരെക്കുറിച്ച്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന ‘സംബന്ധിച്ച്/കുറിച്ച്’ എന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു. τούτων ആരെയാണെന്ന് വിവർത്തനത്തിൽ കൂടുതൽ വ്യക്തമാക്കാതെ, തൊട്ടുമുമ്പ് പരാമർശിച്ച ശിഷ്യരിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു.
- source_word: μόνον
  choice: മാത്രം
  rationale: അപേക്ഷയുടെ പരിധി ആദ്യം ഒരു കൂട്ടത്തിൽ ഒതുങ്ങുന്നതല്ലെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ καὶ
  choice: -മാത്രമല്ല … -ക്കുറിച്ചും
  rationale: ഗ്രീക്കിലെ വിരോധവും കൂട്ടിച്ചേർക്കലും മലയാളത്തിലെ സ്വാഭാവികമായ ‘മാത്രമല്ല … ഉം’ ഘടനയിലൂടെ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τῶν πιστευόντων
  choice: വിശ്വസിക്കുന്നവർ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ക്രിയാത്മകത നിലനിർത്തുന്നു. ‘വിശ്വാസികൾ’ എന്ന കൂടുതൽ സ്ഥിരസ്വഭാവമുള്ള നാമപദം ഒഴിവാക്കുന്നു.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: ഇവരുടെ വചനത്തിലൂടെ
  rationale: διά മാർഗം സൂചിപ്പിക്കുന്നതിനാൽ ‘-ലൂടെ’ ഉപയോഗിച്ചു. λόγος എന്നതിന് ‘വചനം’ നൽകി യോഹന്നാനിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു; ഇവിടെ അത് ശിഷ്യരുടെ സാക്ഷ്യവചനത്തെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കാം.
- source_word: εἰς ἐμέ
  choice: എന്നിൽ
  rationale: യോഹന്നാനിൽ πιστεύω + εἰς എന്ന വ്യക്തിപരമായ വിശ്വാസഘടനയ്ക്ക് സ്വാഭാവികമായ മലയാളരൂപം. ‘എന്നിലേക്ക്’ എന്ന അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അപേക്ഷയുടെ പരിധി ഉടൻ സന്നിഹിതരായ ശിഷ്യർക്കപ്പുറത്തേക്കു വ്യാപിക്കുന്നുണ്ടോ
  choice: ശിഷ്യരുടെ വചനത്തിലൂടെ യേശുവിൽ വിശ്വസിക്കുന്ന മറ്റുള്ളവരെയും വാക്യം ഉൾക്കൊള്ളുന്നു; അവരുടെ വിശ്വാസത്തിന്റെ കാലം വ്യക്തമാക്കുന്നില്ല.
  alternative: ഇവിടെ ഭാവിയിൽ വിശ്വസിക്കാനിരിക്കുന്നവരെ മാത്രമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ‘വിശ്വസിക്കാനിരിക്കുന്നവർ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: τῶν πιστευόντων എന്നത് വർത്തമാനകാല കൃദന്തരൂപമാണ്; സന്ദർഭം ഭാവിയിലെ വിശ്വാസികളെയും സ്വാഭാവികമായി ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്കിൽ ‘വരുംകാലത്ത്’ എന്ന പദം ചേർത്തിട്ടില്ല. അതിനാൽ മലയാളത്തിലും ‘വിശ്വസിക്കുന്നവർ’ എന്ന് നൽകി കാലപരിധിയിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ‘ഇവരെക്കുറിച്ചുമാത്രമല്ല … ഇവരെക്കുറിച്ചും’ എന്ന സമാന്തരഘടന മൂലവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിയായതിനാൽ ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ചേർത്തിരിക്കുന്നു.
