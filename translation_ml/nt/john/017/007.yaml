  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: ml
  text: നീ എനിക്കു തന്നിട്ടുള്ളതെല്ലാം നിന്നിൽനിന്നുള്ളതാണെന്ന് ഇപ്പോൾ അവർ മനസ്സിലാക്കിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നീ എനിക്കു തന്നിട്ടുള്ളതെല്ലാം നിന്നിൽനിന്നു വരുന്നതാണെന്ന്.’
    reason: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന παρὰ σοῦ എന്ന പ്രയോഗം മലയാളത്തിൽ മറ്റൊരു സ്വാഭാവിക രീതിയിൽ അവതരിപ്പിക്കാവുന്നതിനാൽ.
lexical_decisions:
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: ശിഷ്യന്മാരുടെ അറിവിന്റെ ഇപ്പോഴത്തെ ഘട്ടത്തെയും മുൻകാല തിരിച്ചറിവിന്റെ നിലവിലുള്ള ഫലത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലക്രിയാവിശേഷണം.
- source_word: ἔγνωκαν
  choice: അവർ മനസ്സിലാക്കിയിരിക്കുന്നു
  rationale: γινώσκω എന്ന ക്രിയയുടെ പൂർണകാലരൂപം മുൻപ് ഉണ്ടായ തിരിച്ചറിവിന്റെ ഇപ്പോഴത്തെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ രൂപം ആ ഫലാവസ്ഥ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അവർ മനസ്സിലാക്കിയ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പൂരകസംയോജകം.
- source_word: πάντα ὅσα
  choice: എല്ലാം
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; ബന്ധവാക്യത്തിന്റെ അർഥം ‘നീ എനിക്കു തന്നിട്ടുള്ള’ എന്നതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: δέδωκάς
  choice: തന്നിട്ടുള്ള
  rationale: δίδωμι എന്ന ക്രിയയുടെ പൂർണകാലം, പിതാവ് നൽകിയതും അതിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രസക്തിയും സൂചിപ്പിക്കുന്നു.
- source_word: μοι
  choice: എനിക്ക്
  rationale: പരോക്ഷകർമത്തെ മലയാളത്തിൽ ദത്തിവിഭക്തിയിലൂടെ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: παρὰ σοῦ
  choice: നിന്നിൽനിന്നുള്ളത്
  rationale: παρά + ഷഷ്ഠി ഇവിടെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ‘നിന്നിൽനിന്നുള്ളത്’ ആ ഉറവിടബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: εἰσιν
  choice: ആണ്
  rationale: ഗ്രീക്കിൽ ക്രിയ ബഹുവചനമാണെങ്കിലും, മലയാളത്തിലെ ‘എല്ലാം’ എന്ന സമഗ്രസർവനാമത്തോടൊപ്പം ഏകവചന ക്രിയാപദം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പിതാവ് പുത്രന് നൽകിയവയും അവയുടെ ഉറവിടവും തമ്മിലുള്ള ബന്ധം
  choice: ‘നീ എനിക്കു തന്നിട്ടുള്ളതെല്ലാം നിന്നിൽനിന്നുള്ളതാണ്’ എന്ന ഉറവിടപ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നീ എനിക്കു തന്നിട്ടുള്ളതെല്ലാം നിന്നിൽനിന്നു വരുന്നതാണ്.’
  rationale: വാക്യം പുത്രന് ലഭിച്ചതെല്ലാം പിതാവിൽനിന്നുള്ളതാണെന്ന് ഊന്നുന്നു. പിന്നീട് രൂപപ്പെട്ട ദൈവശാസ്ത്ര വ്യാഖ്യാനങ്ങൾ ചേർക്കാതെ മൂലപാഠത്തിലെ അവകാശവാദവും അതിലെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. യേശു പിതാവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ഏകവചന അടുപ്പസൂചകമായ ‘നീ’ നിലനിർത്തി. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഘടനയ്ക്കനുസരിച്ച് ക്രമീകരിച്ചു.
