source:
  edition: SBLGNT
  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: ml
  text: സത്യത്താൽ[a] അവരെ വിശുദ്ധീകരിക്കണമേ; അങ്ങയുടെ വചനം സത്യമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സത്യത്തിൽ.” ഗ്രീക്കിലെ ἐν എന്ന പദം ഇവിടെ വിശുദ്ധീകരണത്തിന്റെ ഉപാധിയെയോ അതിന്റെ മേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: grammatical_ambiguity
  - marker: b
    text: അഥവാ, “അങ്ങയുടെ വചനം ആ സത്യമാണ്.” ഗ്രീക്കിൽ വിധേയനാമമായ “സത്യം” ആർട്ടിക്കിൾ ഇല്ലാതെ വരുന്നതിനാൽ, “സത്യമാണ്” എന്ന ഗുണാത്മക അർഥത്തിന് ഊന്നൽ ഉണ്ടായിരിക്കാം; നിർണായക തിരിച്ചറിയലും സാധ്യമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: വിശുദ്ധീകരിക്കണമേ
  rationale: ἁγιάζω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ പ്രാർഥനാഭാവത്തിലാണ്. ‘വിശുദ്ധീകരിക്കുക’ എന്നത് ദൈവത്തിനായി വേർതിരിക്കുക, വിശുദ്ധരാക്കുക എന്നീ ബന്ധപ്പെട്ട അർഥങ്ങൾ നിലനിർത്തുന്നു; ‘-ണമേ’ സന്ദർഭത്തിന് യോജിച്ച ആദരപൂർവമായ അപേക്ഷാഭാവം നൽകുന്നു.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: ശിഷ്യന്മാരെ സൂചിപ്പിക്കുന്ന ബഹുവചന കർമസർവനാമത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: ἐν + ദത്തിവ് ഘടനയുടെ സ്ഥാനപരമായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു. അതേസമയം ഉപാധിസൂചകമായ ‘സത്യത്താൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὁ λόγος ὁ σὸς
  choice: അങ്ങയുടെ വചനം
  rationale: λόγος ഇവിടെ ദൈവം അറിയിച്ച വചനത്തെ സൂചിപ്പിക്കുന്നു. ‘വചനം’ യോഹന്നാനീയ പ്രയോഗവുമായി ചേരുന്നതും സാധാരണ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്; ὁ σὸς ആദരപൂർവമായി ‘അങ്ങയുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀλήθειά ἐστιν
  choice: സത്യമാണ്
  rationale: നിർദ്ദേശകപദമായ ἀλήθεια ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലാതെയാണ് വരുന്നത്. ‘സത്യമാണ്’ അതിന്റെ ഗുണാത്മക ശക്തി നിലനിർത്തുന്നു; ‘ആ സത്യമാണ്’ എന്ന നിർണായക വായനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ἐν τῇ ἀληθείᾳ എന്നതിലെ ἐν സ്ഥാനപരമാണോ ഉപാധിസൂചകമാണോ
  choice: സത്യത്തിൽ
  alternative: സത്യത്താൽ
  rationale: പ്രധാനപാഠം ഗ്രീക്ക് ഘടനയോട് കൂടുതൽ അടുത്ത സ്ഥാനപരമായ വായന നൽകുന്നു; എന്നാൽ വിശുദ്ധീകരണത്തിന്റെ ഉപാധിയായി സത്യം മനസ്സിലാക്കുന്നതും വ്യാകരണപരമായി സാധ്യമാണ്. അതിനാൽ വ്യാഖ്യാനം ഏകപക്ഷീയമായി തീർപ്പാക്കാതെ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ ἀλήθεια ഗുണാത്മകമായോ നിർണായകമായോ പരിഭാഷപ്പെടുത്തുക
  choice: അങ്ങയുടെ വചനം സത്യമാണ്
  alternative: അങ്ങയുടെ വചനം ആ സത്യമാണ്
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത നിർദ്ദേശക നാമം ഗുണാത്മക ഊന്നൽ വഹിക്കാം. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘സത്യമാണ്’ സ്വീകരിച്ചു; നിർണായക തിരിച്ചറിയൽ പ്രകടമാക്കുന്ന പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർവവുമായ പ്രാർഥനാശൈലി സ്വീകരിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിന് ‘അങ്ങയുടെ’ എന്നും അപേക്ഷയ്ക്ക് ‘-ണമേ’ എന്നും ഉപയോഗിച്ചു. സാങ്കേതിക ദൈവശാസ്ത്രഭാഷ അമിതമാക്കാതെ, മൂലപാഠത്തിലെ സ്ഥാനപര/ഉപാധിസൂചകവും ഗുണാത്മക/നിർണായകവുമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
