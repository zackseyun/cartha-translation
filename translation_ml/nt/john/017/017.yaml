- from: സത്യത്തിൽ[a] അവരെ വിശുദ്ധീകരിക്കണമേ; അങ്ങയുടെ വചനം സത്യമാണ്[b].
  to: സത്യത്താൽ[a] അവരെ വിശുദ്ധീകരിക്കണമേ; അങ്ങയുടെ വചനം സത്യമാണ്[b].
