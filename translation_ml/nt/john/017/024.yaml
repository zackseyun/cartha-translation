id: JHN.17.24
reference: John 17:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: ml
  text: പിതാവേ, അങ്ങ് എനിക്കു തന്നിട്ടുള്ളവർ[a] ഞാൻ എവിടെയാണോ അവിടെ അവരും എന്നോടുകൂടെ ആയിരിക്കണമെന്നും, അങ്ങനെ ലോകസ്ഥാപനത്തിനുമുമ്പേ അങ്ങ് എന്നെ സ്നേഹിച്ചതിനാൽ എനിക്കു തന്നിട്ടുള്ള എന്റെ മഹത്വം അവർ കാണേണ്ടതിനും ഞാൻ ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “അങ്ങ് എനിക്കു തന്നിട്ടുള്ളത്” എന്നാണ്. ഈ പ്രയോഗം കൂട്ടമായി പിതാവ് പുത്രനു നൽകിയ ആളുകളെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “അങ്ങ് എനിക്കു തന്നിട്ടുള്ളവർ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: പിതാവേ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയാണ്; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസൂചന ചേർക്കാതെ സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളരൂപം.
- source_word: ὃ δέδωκάς μοι
  choice: അങ്ങ് എനിക്കു തന്നിട്ടുള്ളവർ
  rationale: ὃ വ്യാകരണപരമായി നപുംസക ഏകവചനമാണെങ്കിലും ഇവിടെ കൂട്ടമായ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള κἀκεῖνοι, ὦσιν എന്നിവയുടെ ബഹുവചനവും ഇതു വ്യക്തമാക്കുന്നു.
- source_word: δέδωκάς
  choice: തന്നിട്ടുള്ള
  rationale: ഗ്രീക്ക് പർഫെക്റ്റ് സൂചിപ്പിക്കുന്ന പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ തുടരുന്ന ഫലവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: പ്രാർഥനാസന്ദർഭത്തിൽ ശക്തമായ ഇച്ഛയെ പ്രകടിപ്പിക്കുമ്പോഴും കല്പനയോ നിർണയപ്രഖ്യാപനമോ എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: ഞാൻ എവിടെയാണോ അവിടെ
  rationale: സ്ഥലസംബന്ധിയായ വാക്യഘടനയും ἐγώ നൽകുന്ന സൂക്ഷ്മ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: അവിടെ എന്നോടുകൂടെ ആയിരിക്കണമെന്ന്
  rationale: κἀκεῖνοιയിലെ കൂട്ടിച്ചേർക്കൽഭാവം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ആശ്രിതവാക്യം.
- source_word: θεωρῶσιν
  choice: അവർ കാണട്ടെ
  rationale: കാണുക, ദർശിക്കുക എന്ന ആശയം ആധുനിക സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ മഹത്ത്വം എന്ന കർമം ആഴമുള്ള ദർശനഭാവം നിലനിർത്തുന്നു.
- source_word: τὴν δόξαν τὴν ἐμὴν
  choice: എന്റെ മഹത്ത്വം
  rationale: ആവർത്തിച്ച നിർദ്ദേശകവും ഉടമസ്ഥവിശേഷണവും നൽകുന്ന അർഥം ഭാരമില്ലാതെ കൃത്യമായി പകരുന്നു.
- source_word: ἣν δέδωκάς μοι
  choice: എനിക്കു തന്നിട്ടുള്ള
  rationale: മഹത്ത്വത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം; പർഫെക്റ്റിന്റെ തുടരുന്ന ഫലം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: -തുകൊണ്ട്
  rationale: പിതാവ് പുത്രനെ ലോകസ്ഥാപനത്തിനുമുമ്പേ സ്നേഹിച്ചതും മഹത്ത്വം നൽകിയതും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ലോകസ്ഥാപനത്തിനുമുമ്പേ
  rationale: സൃഷ്ടിക്കും മുമ്പുള്ള കാലസൂചനയെ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ സംക്ഷിപ്തവും ദിഗ്നിഫൈഡ് ആയ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ലോകസ്ഥാപനത്തിനുമുമ്പുള്ള പിതാവിന്റെ പുത്രനോടുള്ള സ്നേഹം സൂചിപ്പിക്കുന്ന പുത്രന്റെ മുൻഅസ്തിത്വം
  choice: “ലോകസ്ഥാപനത്തിനുമുമ്പേ അങ്ങ് എന്നെ സ്നേഹിച്ചതുകൊണ്ട്” എന്ന നേരിട്ടുള്ള കാലസൂചന നിലനിർത്തി.
  alternative: കാലാതീതമായ ആശയമെന്നോ മുൻനിശ്ചയമെന്നോ മാത്രം വ്യാഖ്യാനിച്ച് പുനരാഖ്യാനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് പാഠം സൃഷ്ടിക്കുമുമ്പുള്ള സ്നേഹത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നു; പരിഭാഷ അത് വിശദീകരിക്കുകയോ മൃദൂകരിക്കുകയോ ചെയ്യരുത്.
- issue: പ്രാർഥനയിലെ θέλωയുടെ ശക്തി
  choice: “ഞാൻ ആഗ്രഹിക്കുന്നു”
  alternative: “ഞാൻ ഇച്ഛിക്കുന്നു” / “ഞാൻ കല്പിക്കുന്നു” എന്ന ശക്തമായോ നിർണായകമായോ തോന്നാവുന്ന രൂപങ്ങൾ.
  rationale: ശക്തമായ വ്യക്തിപരമായ ഇച്ഛ നിലനിർത്തുന്നു; എന്നാൽ പ്രാർഥനയെ ഒരു നിർണയപ്രഖ്യാപനമായി തീർപ്പാക്കുന്നില്ല.
- issue: മഹത്ത്വം നൽകിയതും സ്നേഹിച്ചതും തമ്മിലുള്ള ὅτι ബന്ധം
  choice: കാരണം സൂചിപ്പിക്കുന്ന “-തുകൊണ്ട്”
  alternative: വിശദീകരണാത്മകമായ “എന്ന്” അല്ലെങ്കിൽ അസ്പഷ്ടമായ ബന്ധം.
  rationale: ഇവിടെ ὅτι കാരണാർഥത്തിൽ വായിക്കാവുന്നതാണ്; ആ ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു, എന്നാൽ അതിനപ്പുറമുള്ള ദൈവശാസ്ത്രക്രമം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദൈവസംബോധനയിൽ “അങ്ങ്” ഉപയോഗിച്ചു. “മഹത്ത്വം,” “ലോകസ്ഥാപനം” എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും മൂലപാഠത്തിന്റെ ആശയസാന്ദ്രതയും നിലനിർത്തുന്നു.
