id: JHN.17.1
reference: John 17:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ml
  text: 'യേശു ഈ കാര്യങ്ങൾ പറഞ്ഞശേഷം സ്വർഗത്തിലേക്ക് കണ്ണുകൾ ഉയർത്തി പറഞ്ഞു: “പിതാവേ, ആ നാഴിക വന്നിരിക്കുന്നു. പുത്രൻ അങ്ങയെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന് അങ്ങയുടെ പുത്രനെ മഹത്ത്വപ്പെടുത്തണമേ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: ഈ കാര്യങ്ങൾ പറഞ്ഞശേഷം
  rationale: Ταῦτα മുൻപുള്ള പ്രഭാഷണത്തെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചനമാണ്. പ്രധാന ക്രിയയും തുടർന്നുള്ള പങ്കുപദപ്രയോഗവും തമ്മിലുള്ള സ്വാഭാവിക മലയാള ബന്ധം വ്യക്തമാക്കാൻ ‘പറഞ്ഞശേഷം’ ഉപയോഗിച്ചു.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: കണ്ണുകൾ ഉയർത്തി
  rationale: ἐπαίρω എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന ശാരീരിക ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: εἰς ദിശയെ സൂചിപ്പിക്കുന്നു; പ്രാർഥനയിലെ മേലോട്ടുള്ള ദൃഷ്ടി മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: Πάτερ
  choice: പിതാവേ
  rationale: ഗ്രീക്കിലെ സംബോധനത്തെ ‘എന്റെ’ എന്നില്ലാതെ നേരിട്ട് പകർന്നു.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: ആ നാഴിക വന്നിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം നിർണായകമായ നാഴിക എത്തിച്ചേർന്നിരിക്കുന്നുവെന്ന ആശയം നൽകുന്നു. ‘നാഴിക’ യോഹന്നാനിലെ ആവർത്തിതമായ ‘hour’ പ്രമേയം നിലനിർത്തുന്നു.
- source_word: δόξασόν
  choice: മഹത്ത്വപ്പെടുത്തണമേ
  rationale: δοξάζω സൂചിപ്പിക്കുന്ന മഹത്ത്വത്തിന്റെ വെളിപ്പെടുത്തലും ബഹുമാനവും ഉൾക്കൊള്ളുന്ന, പ്രാർഥനാഭാവമുള്ള അഭ്യർഥന.
- source_word: σου τὸν υἱόν
  choice: അങ്ങയുടെ പുത്രനെ
  rationale: ബന്ധസൂചക സർവനാമത്തോടുകൂടിയ ‘പുത്രൻ’ എന്ന പദം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: ἵνα ὁ υἱὸς δοξάσῃ σέ
  choice: അങ്ങനെ പുത്രൻ അങ്ങയെ മഹത്ത്വപ്പെടുത്തട്ടെ
  rationale: ἵναയുടെ ഉദ്ദേശ്യ/ഫലബന്ധം ‘അങ്ങനെ’ എന്നതിലൂടെ നിലനിർത്തി. ഗ്രീക്കിൽ രണ്ടാമത് ‘പുത്രൻ’ എന്നതിന് possessive ഇല്ലാത്തതിനാൽ മലയാളത്തിലും ‘അങ്ങയുടെ’ ആവർത്തിച്ചില്ല.
theological_decisions:
- issue: പിതാവും പുത്രനും തമ്മിലുള്ള പരസ്പര മഹത്ത്വപ്പെടുത്തൽ
  choice: “അങ്ങയുടെ പുത്രനെ മഹത്ത്വപ്പെടുത്തണമേ; അങ്ങനെ പുത്രൻ അങ്ങയെ മഹത്ത്വപ്പെടുത്തട്ടെ” എന്ന സമാന്തര ഘടന നിലനിർത്തി.
  alternative: ‘അങ്ങയുടെ പുത്രനു മഹത്ത്വം നൽകണമേ; അങ്ങനെ അവൻ അങ്ങയ്ക്കു മഹത്ത്വം കൊണ്ടുവരട്ടെ.’
  rationale: വാക്യത്തിലെ പരസ്പരതയും δοξάζω എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനവും വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
- issue: υἱός എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ബന്ധപദത്തിന്റെ അവതരണം
  choice: ‘പുത്രൻ’ ഉപയോഗിച്ചു.
  alternative: ‘മകൻ’
  rationale: യോഹന്നാനിലെ പിതാവ്–പുത്രൻ ബന്ധത്തിന്റെ തലക്കെട്ടുസ്വഭാവവും ഗൗരവവും ‘പുത്രൻ’ വ്യക്തമായി നിലനിർത്തുന്നു; ഇതിലൂടെ മൂലത്തിൽ ഇല്ലാത്ത കൂടുതൽ സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യത്തിന്റെ പ്രാർഥനാഭാവം നിലനിർത്താൻ ‘-ണമേ’, ‘-ട്ടെ’ രൂപങ്ങൾ സ്വീകരിച്ചു.
