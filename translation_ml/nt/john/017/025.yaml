  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: ml
  text: നീതിമാനായ പിതാവേ, ലോകം[b] അങ്ങയെ അറിഞ്ഞിട്ടില്ലെങ്കിലും, ഞാനോ അങ്ങയെ അറിഞ്ഞിരിക്കുന്നു[a], അങ്ങാണ് എന്നെ അയച്ചതെന്ന് ഇവരും അറിഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ലോകം അങ്ങയെ അറിഞ്ഞില്ല; ഞാനോ അങ്ങയെ അറിഞ്ഞു; അങ്ങാണ് എന്നെ അയച്ചതെന്ന് ഇവരും അറിഞ്ഞു.” ഗ്രീക്കിൽ ഈ ‘അറിയുക’ ക്രിയകൾ എല്ലാം aorist രൂപങ്ങളിലാണ്; പ്രധാനപാഠം സന്ദർഭത്തിലെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: യോഹന്നാന്റെ രചനകളിൽ ‘ലോകം’ എന്നത് സൃഷ്ടലോകത്തെ മാത്രമല്ല, പലപ്പോഴും ദൈവത്തിൽനിന്ന് അകന്നുനിൽക്കുന്ന മനുഷ്യരെയും മനുഷ്യവ്യവസ്ഥയെയും സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: നീതിമാനായ പിതാവേ
  rationale: വിളിസംബോധനയുടെ രൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. δίκαιος എന്ന പദത്തിന്റെ ധാർമികവും ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി ‘നീതിമാൻ’ സംരക്ഷിക്കുന്നു; അതിനെ ന്യായവിധിയിലെ നീതിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: καὶ
  choice: എങ്കിലും
  rationale: ആദ്യത്തെ καὶ ഇവിടെ ലോകത്തിന്റെ അറിവില്ലായ്മയും യേശുവിന്റെ അറിവും തമ്മിലുള്ള വിട്ടുവീഴ്ചാസൂചകമായ വിരോധം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എങ്കിലും’ ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὁ κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിലെ പദത്തിന്റെ സൃഷ്ടലോകം, മനുഷ്യസമൂഹം, ദൈവത്തിൽനിന്ന് അകന്ന മനുഷ്യവ്യവസ്ഥ എന്നീ പാളികളുള്ള അർഥസാധ്യത തുറന്നുവെക്കുന്നു.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: അറിഞ്ഞിട്ടില്ല / അറിയുന്നു / അറിഞ്ഞിരിക്കുന്നു
  rationale: മൂലത്തിലെ aorist രൂപങ്ങളുടെ പൂർത്തിയായതും ഇപ്പോഴും പ്രസക്തവുമായ ബന്ധപരമായ അറിവ് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. മൂന്ന് രൂപങ്ങളും യാന്ത്രികമായി ഒരേ ഭൂതകാലരൂപത്തിലാക്കാതെ സന്ദർഭത്തിലെ നിലനിൽക്കുന്ന പ്രസക്തി സംരക്ഷിക്കുന്നു.
- source_word: ἐγὼ δέ
  choice: ഞാനോ
  rationale: δέയുടെ വിരോധസൂചന ‘-ഓ’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: οὗτοι
  choice: ഇവരും
  rationale: സന്ദർഭത്തിൽ യേശുവിന്റെ അനുയായികളെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും, മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ശിഷ്യന്മാർ’ എന്ന വ്യാഖ്യാനപദം ചേർക്കാതെ demonstrative-ന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: σύ με ἀπέστειλας
  choice: അങ്ങാണ് എന്നെ അയച്ചത്
  rationale: σύയുടെ ഊന്നൽ ‘അങ്ങാണ്’ എന്നു പ്രകടിപ്പിക്കുകയും ἀπέστειλας നേരിട്ടും വ്യക്തമായും ‘അയച്ചത്’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: δίκαιε എന്ന പിതാവിന്റെ വിശേഷണം
  choice: നീതിമാനായ പിതാവേ
  alternative: ന്യായവാനായ പിതാവേ
  rationale: ‘നീതിമാൻ’ ധാർമിക നേരും ദൈവിക നീതിയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘ന്യായവാൻ’ ന്യായവിധിയിലോ നിഷ്പക്ഷതയിലോ മാത്രം അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
- issue: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ അർഥം
  choice: ലോകം
  alternative: ലോകത്തിലെ മനുഷ്യർ / ദൈവത്തിൽനിന്ന് അകന്ന ലോകവ്യവസ്ഥ
  rationale: മൂലപദത്തിന്റെ പാളികളുള്ള യോഹന്നാനീയ അർഥം പ്രധാനപാഠത്തിൽ പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
- issue: γινώσκω എന്ന ക്രിയയുടെ aorist രൂപങ്ങളുടെ കാല-ദൃക്കോൺ
  choice: അറിഞ്ഞിട്ടില്ല / അറിയുന്നു / അറിഞ്ഞിരിക്കുന്നു
  alternative: അറിഞ്ഞില്ല / അറിഞ്ഞു / അറിഞ്ഞു
  rationale: പ്രാർത്ഥനാസന്ദർഭത്തിലെ ഇപ്പോഴത്തെ പ്രസക്തിയും ബന്ധപരമായ അറിവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ലളിതഭൂതകാല സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഭാഷ ലളിതവും പ്രാർത്ഥനാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമാണ്. ‘ഞാനോ’ വിരോധം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘ഇവരും’ മൂലത്തിലെ സൂചനാപദത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
