id: JHN.17.11
reference: John 17:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: ml
  text: ഞാൻ ഇനി ലോകത്തിൽ ഇല്ല; എന്നാൽ അവർ ലോകത്തിൽ ഉണ്ട്. ഞാൻ അങ്ങയുടെ അടുക്കലേക്കു വരുന്നു. പരിശുദ്ധ പിതാവേ, അങ്ങ് എനിക്കു നൽകിയിരിക്കുന്ന അങ്ങയുടെ നാമത്തിൽ[a][b] അവരെ കാത്തുകൊള്ളണമേ; നാം ഒന്നായിരിക്കുന്നതുപോലെ അവരും ഒന്നായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങയുടെ നാമത്താൽ’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ നാമം മുഖാന്തരം അവരെ സംരക്ഷിക്കണമേ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗത്തിന് പരിധി, ഉപാധി, അല്ലെങ്കിൽ അധികാരം സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള പാഠഭേദം ബന്ധസർവനാമത്തെ സംബന്ധിച്ചതാണ്. ചില കൈയെഴുത്തുപ്രതികൾ ‘അങ്ങ് എനിക്കു നൽകിയിരിക്കുന്ന അങ്ങയുടെ നാമത്തിൽ അവരെ കാത്തുകൊള്ളണമേ’ എന്നു വായിക്കുമ്പോൾ, മറ്റുചില പാഠരൂപങ്ങൾ ‘അങ്ങ് എനിക്കു നൽകിയവരെ അങ്ങയുടെ നാമത്തിൽ കാത്തുകൊള്ളണമേ’ എന്നു മനസ്സിലാക്കപ്പെടുന്നു. ഇവിടെ SBLGNT പാഠമാണ് പിന്തുടരുന്നത്; അതിൽ ‘നൽകിയിരിക്കുന്ന’ എന്നത് ‘നാമത്തെ’ കുറിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: ഇനി ... ഇല്ല
  rationale: സംസാരിക്കുന്ന സമയത്തെ ആധാരമാക്കി ഒരു അവസ്ഥ അവസാനിച്ചിരിക്കുന്നു എന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κόσμος
  choice: ലോകം
  rationale: ശിഷ്യന്മാർ തുടരുന്ന ഭൗമിക മനുഷ്യജീവിതത്തിന്റെ മണ്ഡലം എന്ന യോഹന്നാനീയ അർഥവ്യാപ്തി, അതിനെ ‘സമൂഹം’ എന്നോ ‘യുഗം’ എന്നോ ചുരുക്കാതെ, നിലനിർത്തുന്നു.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: ഞാൻ അങ്ങയുടെ അടുക്കലേക്കു വരുന്നു
  rationale: ἔρχομαι എന്ന വർത്തമാനകാലരൂപത്തിന്റെ സന്ദർഭോചിതമായ പുരോഗമന/സമീപഭാവി ഭാവം നിലനിർത്തുന്നു; ലക്ഷ്യസ്ഥാനമായ പിതാവിന്റെ വീക്ഷണത്തോടും ‘വരുന്നു’ യോജിക്കുന്നു.
- source_word: πάτερ ἅγιε
  choice: പരിശുദ്ധ പിതാവേ
  rationale: പിതാവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയും ἅγιε സൂചിപ്പിക്കുന്ന വിശുദ്ധതയും സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τήρησον
  choice: കാത്തുകൊള്ളണമേ
  rationale: τηρέω എന്ന പദത്തിലെ സംരക്ഷിക്കുക, കാത്തുസൂക്ഷിക്കുക, നിലനിർത്തുക എന്നീ വിശാല അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന പ്രാർഥനാഭാഷയാണ് ഇത്; ശാരീരിക സംരക്ഷണത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν τῷ ὀνόματί σου
  choice: അങ്ങയുടെ നാമത്തിൽ
  rationale: ἐν സൂചിപ്പിക്കാവുന്ന മണ്ഡലം, ഉപാധി, അധികാരം എന്നീ സാധ്യതകളെ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ മൂലവാചകത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ᾧ δέδωκάς μοι
  choice: അങ്ങ് എനിക്കു നൽകിയ
  rationale: ᾧ എന്ന ബന്ധസർവനാമം ὀνόματι (‘നാമം’) എന്നതിനോടു യോജിക്കുന്ന SBLGNT പാഠം പിന്തുടർന്ന്, പിതാവ് പുത്രനു നൽകിയതു ‘നാമം’ ആണെന്ന വ്യാകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα ὦσιν ἓν
  choice: അവരും ഒന്നായിരിക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും ἓν സൂചിപ്പിക്കുന്ന ഐക്യവും നൽകുന്നു; അവരെ ഒരൊറ്റ വ്യക്തിയോ വസ്തുവോ ആക്കുന്നതായി തെറ്റിദ്ധരിപ്പിക്കുന്നില്ല.
- source_word: καθὼς ἡμεῖς
  choice: നാം ഒന്നായിരിക്കുന്നതുപോലെ
  rationale: പിതാവിന്റെയും പുത്രന്റെയും ഐക്യവും ശിഷ്യന്മാരുടെ ഐക്യവും തമ്മിലുള്ള താരതമ്യം നിലനിർത്തുന്നു; ആ താരതമ്യത്തിന്റെ സ്വഭാവം വിവർത്തനത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ‘അങ്ങയുടെ നാമത്തിൽ അവരെ കാത്തുകൊള്ളണമേ’ എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘അങ്ങയുടെ നാമത്തിൽ ... കാത്തുകൊള്ളണമേ’ എന്നു സംക്ഷിപ്തമായി നിലനിർത്തി.
  alternative: ‘അങ്ങയുടെ നാമത്താൽ അവരെ കാക്കണമേ’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ നാമം മുഖാന്തരം അവരെ സംരക്ഷിക്കണമേ.’
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം മണ്ഡലം, ഉപാധി, അധികാരം, വെളിപ്പെടുത്തപ്പെട്ട സ്വഭാവം എന്നിവ സൂചിപ്പിക്കാം. പ്രധാനപാഠം അവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- issue: ‘നാം ഒന്നായിരിക്കുന്നതുപോലെ അവരും ഒന്നായിരിക്കേണ്ടതിന്’ എന്ന താരതമ്യത്തിന്റെ ശക്തി
  choice: ശിഷ്യന്മാരുടെ ഐക്യവും പിതാ-പുത്ര ഐക്യവും തമ്മിലുള്ള യഥാർഥ താരതമ്യം നിലനിർത്തി; അതിന്റെ തത്ത്വശാസ്ത്രപരമായ സ്വഭാവം വിവർത്തനത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ഇത് വെറും ധാർമിക സഹകരണമെന്നു ദുർബലപ്പെടുത്തുക, അല്ലെങ്കിൽ ശിഷ്യന്മാർക്കും പിതാവിനും പുത്രനും ഒരേ സത്താപരമായ ഐക്യമാണെന്നു വിവർത്തനത്തിൽ ചേർക്കുക.
  rationale: καθώς താരതമ്യത്തിന് ഗൗരവം നൽകുന്നു; എന്നാൽ ഐക്യത്തിന്റെ കൃത്യസ്വഭാവം ഈ വാക്യം മാത്രം നിർവചിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുകയും പിൽക്കാല വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ദൈവത്തോടുള്ള ആദരസൂചക ഏകവചനമായി ‘അങ്ങ്/അങ്ങയുടെ’ സ്വീകരിച്ചു. വാക്യക്രമം സ്വാഭാവിക മലയാളത്തിനായി അല്പം പുനഃക്രമീകരിച്ചെങ്കിലും ഗ്രീക്ക് പാഠത്തിലെ ആശയബന്ധങ്ങളും പ്രാർഥനയുടെ ഗതിയും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ആശയബന്ധമില്ലാത്ത സ്ഥാനങ്ങളിലായിരുന്നതിനാൽ, [a], [b] എന്നിവ രണ്ടും ‘അങ്ങയുടെ നാമത്തിൽ’ എന്ന ബന്ധപ്പെട്ട വാചകഭാഗത്തോടു ചേർത്തു.
