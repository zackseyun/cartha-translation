revisions:
- from: നിന്റെ നാമം ഞാൻ അവർക്കു അറിയിച്ചിരിക്കുന്നു[a]; ഇനിയും അറിയിക്കും. നീ എന്നെ സ്നേഹിച്ച സ്നേഹം അവരിൽ ഉണ്ടായിരിക്കാനും[b], ഞാൻ അവരിൽ ആയിരിക്കാനും വേണ്ടിയാണിത്.
  to: നിന്റെ നാമം ഞാൻ അവർക്കു അറിയിച്ചു[a]; അറിയിക്കുകയും ചെയ്യും. അങ്ങനെ, നീ എന്നെ സ്നേഹിച്ച സ്നേഹം അവരിൽ ഉണ്ടായിരിക്കാനും[b] ഞാൻ അവരിൽ ആയിരിക്കാനും.
  rationale: അഓറിസ്റ്റായ ἐγνώρισα-യെ ‘അറിയിച്ചു’ എന്നു തിരുത്തി; ഭാവികാലമായ γνωρίσω-യിൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ഇനിയും’ ഒഴിവാക്കി. ἵναയുടെ ഉദ്ദേശ്യബലം ‘അങ്ങനെ’ എന്നതിലൂടെ സൂചിപ്പിച്ച്, സ്നേഹം അവരിൽ ആയിരിക്കുന്നതും യേശു അവരിൽ ആയിരിക്കുന്നതും സമാന്തര ഘടകങ്ങളായി നിലനിർത്തി. അടിക്കുറിപ്പുകൾ അവ സൂചിപ്പിക്കുന്ന പദങ്ങളോട് വ്യക്തമായി ആങ്കർ ചെയ്തു.
