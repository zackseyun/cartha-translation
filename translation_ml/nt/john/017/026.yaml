id: JHN.17.26
reference: John 17:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: ml
  text: നിന്റെ നാമം ഞാൻ അവർക്കു അറിയിച്ചു[a]; അറിയിക്കുകയും ചെയ്യും. അങ്ങനെ, നീ എന്നെ സ്നേഹിച്ച സ്നേഹം അവരിൽ ഉണ്ടായിരിക്കാനും[b] ഞാൻ അവരിൽ ആയിരിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ നാമം ഞാൻ അവർക്കു വെളിപ്പെടുത്തി; വെളിപ്പെടുത്തുകയും ചെയ്യും.” ഇവിടെ “നിന്റെ നാമം” എന്നത് കേവലം വിളിപ്പേരല്ല, ദൈവം വെളിപ്പെടുത്തിയ തന്റെ വ്യക്തിത്വത്തെയും സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: “അവരിൽ” എന്നതിന് “അവരുടെ ഇടയിൽ” എന്നും അർഥമാകാം; എന്നാൽ “അവരിൽ” എന്നത് യോഹന്നാന്റെ സുവിശേഷത്തിലെ ഉള്ളിൽ വസിക്കൽ എന്ന ആശയവും നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: അറിയിച്ചിരിക്കുന്നു
  rationale: γνωρίζω എന്ന ക്രിയയുടെ ‘അറിയിക്കുക’ എന്ന കാരണാർഥം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ aorist ഭൂതകാലപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, യേശുവിന്റെ പൂർത്തിയായ വെളിപ്പെടുത്തലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കാൻ പൂർണവർത്തമാനരൂപം ഉപയോഗിച്ചു.
- source_word: τὸ ὄνομά σου
  choice: നിന്റെ നാമം
  rationale: ‘നാമം’ എന്ന മൂർത്തമായ ബൈബിൾപ്രയോഗം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു; ഇവിടെ അത് ദൈവത്തിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും സ്വഭാവത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: γνωρίσω
  choice: ഇനിയും അറിയിക്കും
  rationale: ഭാവികാലത്തെ വ്യക്തമായി സൂചിപ്പിക്കുകയും മുൻക്രിയയുമായുള്ള ആവർത്തനസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു; ‘ഇനിയും’ തുടർന്നുള്ള വെളിപ്പെടുത്തലിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα
  choice: വേണ്ടിയാണിത്
  rationale: ἵνα ഉപവാക്യത്തിന്റെ ഉദ്ദേശ്യബലം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: നീ എന്നെ സ്നേഹിച്ച സ്നേഹം
  rationale: ഗ്രീക്കിലെ ബന്ധവാക്യത്തിന്റെ ആവർത്തനവും ‘സ്നേഹം’ എന്ന മുഖ്യനാമവും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവരിൽ
  rationale: ἐν + dative എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും യോഹന്നാനിലെ ഉള്ളിൽ വസിക്കൽ എന്ന ആശയസാദ്ധ്യതയും നിലനിർത്തുന്നു; ‘അവരുടെ ഇടയിൽ’ എന്നതും സന്ദർഭപരമായി സാധ്യമാണ്.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: ഞാൻ അവരിൽ ആയിരിക്കാനും
  rationale: ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത ᾖ എന്ന ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർക്കുന്നു; ദൈവസ്നേഹവും ക്രിസ്തുവിന്റെ സാന്നിധ്യവും സമാന്തര ലക്ഷ്യങ്ങളായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ സുവിശേഷത്തിലെ ‘നിന്റെ നാമം’ എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നിന്റെ നാമം’ എന്നു നിലനിർത്തി.
  alternative: ‘നീ ആരാണെന്ന്’ അല്ലെങ്കിൽ ‘നിന്റെ സ്വഭാവം’
  rationale: ‘നാമം’ പിതാവിന്റെ വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും സ്വഭാവത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, അതിനെ പ്രധാനപാഠത്തിൽ വിശദീകരിക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കും.
- issue: ദൈവസ്നേഹവും ക്രിസ്തുവിന്റെ അവരിലുള്ള സാന്നിധ്യവും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടും ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യത്തിന്റെ സമാന്തര ഘടകങ്ങളായി വിവർത്തനം ചെയ്തു.
  alternative: ക്രിസ്തു അവരിൽ ഉള്ളതിനാൽ സ്നേഹം അവരിൽ ഉണ്ടാകുന്നു എന്ന കാരണബന്ധം വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഇവയെ ഏകോപിപ്പിക്കുന്നുവെങ്കിലും അവയ്ക്കിടയിലെ കാരണബന്ധം തുറന്നു പറയുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രബന്ധം വിവർത്തനത്തിൽ നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമം’ പോലുള്ള ബൈബിൾപ്രയോഗം സംരക്ഷിച്ചപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തി. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പടയാളങ്ങളും [a], [b] എന്ന ക്രമത്തിൽ നൽകിയിട്ടുണ്ട്.
