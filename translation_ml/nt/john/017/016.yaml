  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: ml
  text: ഞാൻ ലോകത്തിൽനിന്നുള്ളവനല്ലാത്തതുപോലെ, അവരും ലോകത്തിൽനിന്നുള്ളവരല്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലോകത്തിന്റേതല്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ἐκ എന്ന ഗ്രീക്ക് പദത്തിന് ഉറവിടം, ഉത്ഭവം, അല്ലെങ്കിൽ ബന്ധം സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: ലോകത്തിൽനിന്നുള്ളവർ
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം, ഉത്ഭവം, ബന്ധം എന്നീ അർഥസാധ്യതകൾ നിലനിർത്തുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കാനായി വിഭക്തിപ്രയോഗം വിശേഷണരൂപത്തിൽ അവതരിപ്പിച്ചു; ഇരു ഉപവാക്യങ്ങളിലും ഒരേ രൂപം പാലിച്ചു.
- source_word: κόσμου
  choice: ലോകം
  rationale: യോഹന്നാനിലെ κόσμος എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കാതെ ലളിതമായ പദം നിലനിർത്തുന്നു; ‘ലോകവ്യവസ്ഥ’ പോലുള്ള വ്യാഖ്യാനവികാസം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: οὐκ εἰσὶν
  choice: അവരല്ല
  rationale: വർത്തമാനകാല നിഷേധപ്രസ്താവന മലയാളത്തിലെ സ്വാഭാവിക നാമവാക്യഘടനയിൽ കൃത്യമായി നൽകുന്നു.
- source_word: καθὼς
  choice: അല്ലാത്തതുപോലെ
  rationale: യേശുവിനും ശിഷ്യന്മാർക്കും ഇടയിലുള്ള താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമാക്കിയ ഒന്നാംപുരുഷ സർവനാമത്തിന്റെ താരതമ്യാത്മക ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ ദൈവശാസ്ത്രത്തിൽ ‘ലോകം’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ലോകം’ എന്ന ലളിതരൂപം നിലനിർത്തി.
  alternative: ലോകവ്യവസ്ഥ; ദൈവത്തിൽനിന്ന് അകന്ന ഇപ്പോഴത്തെ ക്രമം
  rationale: ഇവിടെ κόσμος എന്ന പദത്തെ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നത് വാക്യത്തിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും അനാവശ്യമായി പരിഹരിച്ചുകളയും.
- issue: ഉപവാക്യങ്ങളുടെ ക്രമം
  choice: 'യേശുവിനെക്കുറിച്ചുള്ള താരതമ്യ ഉപവാക്യം ആദ്യം നൽകി: ‘ഞാൻ ... പോലെ, അവരും ...’.'
  alternative: 'ഗ്രീക്ക് ക്രമം നേരിട്ട് പിന്തുടർന്ന്: ‘അവർ ... അല്ല, ഞാൻ ... അല്ലാത്തതുപോലെ.’'
  rationale: അർഥവും താരതമ്യവും മാറ്റാതെ ആധുനിക മലയാളത്തിലെ കൂടുതൽ സ്വാഭാവികമായ വാക്യക്രമം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ലോകം’ എന്ന യോഹന്നാനീയ പദത്തിന്റെ അർഥവ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തി.
