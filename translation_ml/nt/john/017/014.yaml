id: JHN.17.14
reference: John 17:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: ml
  text: ഞാൻ അവർക്കു നിന്റെ വചനം നൽകിയിരിക്കുന്നു. ലോകം അവരെ വെറുത്തിരിക്കുന്നു; കാരണം, അവരും ലോകത്തിൽനിന്നുള്ളവർ[a] അല്ല, ഞാൻ ലോകത്തിൽനിന്നുള്ളവൻ അല്ലാത്തതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലോകത്തിന്റേതല്ല.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ലോകത്തിൽനിന്ന്’ എന്ന പ്രയോഗമാണ്; അത് ഉറവിടത്തെയോ പെട്ടിരിപ്പിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: നൽകിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം രണ്ടും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: λόγον
  choice: വചനം
  rationale: ഇവിടെ പിതാവ് യേശുവിലൂടെ അറിയിച്ച വചനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. യോഹന്നാന്റെ പദപ്രയോഗവും ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും നിലനിർത്താൻ ‘സന്ദേശം’ എന്നതിനെക്കാൾ ‘വചനം’ ഉചിതമാണ്.
- source_word: κόσμος
  choice: ലോകം
  rationale: യോഹന്നാനിൽ ഈ പദം പലപ്പോഴും ദൈവത്തോടു വിരോധമുള്ള മനുഷ്യലോകത്തെ സൂചിപ്പിച്ചാലും അതിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ സാധാരണ പദമായ ‘ലോകം’ നിലനിർത്തുന്നു.
- source_word: ἐμίσησεν
  choice: വെറുത്തിരിക്കുന്നു
  rationale: ഗ്രീക്ക് ഭൂതകാലക്രിയയെ സന്ദർഭത്തിൽ ഇപ്പോഴും നിലനിൽക്കുന്ന വിരോധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഇത് വെറും ക്ഷണിക വികാരമെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: തുടർന്നുള്ള വാക്യം ലോകത്തിന്റെ വെറുപ്പിനുള്ള കാരണം വ്യക്തമാക്കുന്നതിനാൽ കാരണാർഥം സ്വീകരിച്ചു.
- source_word: ἐκ τοῦ κόσμου
  choice: ലോകത്തിൽനിന്നുള്ളവർ / ലോകത്തിൽനിന്നുള്ളവൻ
  rationale: ἐκ ഉറവിടത്തെയോ ബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ലോകത്തിൽനിന്നുള്ള’ എന്ന രൂപം ഉറവിടം/പെട്ടിരിപ്പ് എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: അല്ലാത്തതുപോലെ
  rationale: ശിഷ്യന്മാരുടെയും യേശുവിന്റെയും ലോകത്തോടുള്ള ബന്ധം തമ്മിലുള്ള നേരിട്ടുള്ള താരതമ്യം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവും ശിഷ്യന്മാരും ‘ലോകത്തിൽനിന്നുള്ളവർ’ അല്ലെന്ന താരതമ്യം
  choice: ‘ഞാൻ ലോകത്തിൽനിന്നുള്ളവൻ അല്ലാത്തതുപോലെ അവരും ലോകത്തിൽനിന്നുള്ളവർ അല്ല’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞാൻ ലോകത്തിന്റേതല്ലാത്തതുപോലെ അവരും ലോകത്തിന്റേതല്ല’
  rationale: മൂലപാഠം യേശുവിനും ശിഷ്യന്മാർക്കും ലോകത്തോടുള്ള ബന്ധത്തിൽ യഥാർഥമായൊരു സാദൃശ്യം അവതരിപ്പിക്കുന്നു. ἐκ എന്നതിനെ വെറും സാമൂഹിക പെട്ടിരിപ്പായി ചുരുക്കാതെയും പാഠത്തിനപ്പുറമുള്ള അധിഭൗതിക വിശദീകരണം ചേർക്കാതെയും ഉറവിടം/പെട്ടിരിപ്പ് എന്ന യോഹന്നാനീയ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’ എന്ന സഭാപരിചിത പദം യോഹന്നാനീയ പദപ്രയോഗം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാൻ ക്രമപ്പെടുത്തി.
