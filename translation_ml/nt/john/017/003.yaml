id: JHN.17.3
reference: John 17:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: ml
  text: 'നിത്യജീവൻ ഇതാണ്: ഏക സത്യദൈവമായ അങ്ങയെയും അങ്ങ് അയച്ച മശീഹയായ യേശുവിനെയും അവർ അറിയുന്നതാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പരമ്പരാഗതമായി, ‘യേശുക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός എന്ന പദം ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരായോ, ചില സന്ദർഭങ്ങളിൽ പേരുപോലുള്ള പ്രയോഗമായോ ഉപയോഗിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: എന്നത് ഇതാണ്
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട് നിത്യജീവൻ എന്താണെന്ന് വിശദീകരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἡ αἰώνιος ζωὴ
  choice: നിത്യജീവൻ
  rationale: യോഹന്നാന്റെ രചനകളിൽ സ്ഥിരമായി വരുന്ന, വരാനിരിക്കുന്ന യുഗത്തിന്റെയും നിലനിൽക്കുന്ന ദൈവികജീവന്റെയും ആശയം ഉൾക്കൊള്ളുന്ന പരിചിതമായ മലയാളപ്രയോഗം.
- source_word: ἵνα γινώσκωσι
  choice: അവർ അറിയുക
  rationale: ഇവിടെ ἵνα നിത്യജീവന്റെ ഉള്ളടക്കം നിർവചിക്കുന്നു. വർത്തമാനകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന വ്യക്തിപരമായ അറിവിനെ ‘അറിയുക’ സ്വാഭാവികമായി തുറന്നുവെക്കുന്നു; ഉദ്ദേശ്യമോ നിർബന്ധമോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: σὲ
  choice: അങ്ങയെ
  rationale: യേശു പിതാവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ഏകവചനരൂപം ഉപയോഗിച്ചു.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: ഏക സത്യദൈവമായ
  rationale: μόνον എന്നതിന്റെ ഏകത്വവും ἀληθινός എന്നതിന്റെ ‘സത്യമായ/യഥാർഥമായ’ അർഥവും സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ὃν ἀπέστειλας
  choice: അങ്ങ് അയച്ച
  rationale: യേശുവിനെ പിതാവ് അയച്ചവനായി തിരിച്ചറിയിക്കുന്ന ആപേക്ഷിക ഉപവാക്യം ലളിതമായ ഭൂതകാലത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Ἰησοῦν Χριστόν
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ ‘മശീഹ’ എന്ന അർഥം വ്യക്തമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഏക സത്യദൈവം’ എന്ന വിശേഷണവും യേശുവുമായുള്ള ബന്ധവും
  choice: പിതാവിനെ ‘ഏക സത്യദൈവം’ എന്നു നേരിട്ട് അഭിസംബോധന ചെയ്യുകയും യേശുവിനെ അങ്ങ് അയച്ചവനായി വേർതിരിച്ചുപറയുകയും ചെയ്യുന്ന വാക്യഘടന അതേപടി നിലനിർത്തി.
  alternative: പിന്നീടുള്ള ത്രിത്വവാദപരമോ ത്രിത്വവിരുദ്ധമോ ആയ നിഗമനങ്ങൾ വ്യക്തമാക്കുന്ന വിശദീകരണം വാക്യത്തിൽ ചേർക്കുക.
  rationale: മൂലവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യക്തിവ്യത്യാസവും പരിഭാഷകൻ പരിഹരിക്കാതെ നിലനിർത്തണം.
- issue: Χριστόν എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വിശദീകരണാത്മകവും വിശ്വാസപ്രഖ്യാപനപരവുമായ സന്ദർഭത്തിൽ സ്ഥാനപ്പേരിന്റെ അർഥം ഇപ്പോഴും സജീവമാണ്; അതേസമയം പേരുപോലെ ഉപയോഗിക്കപ്പെടുന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാഭാഷയാണ് ഉപയോഗിച്ചത്. പിതാവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപം സ്വീകരിച്ചു. ‘മശീഹയായ യേശു’ എന്ന പദക്രമം മലയാളത്തിലെ സ്വാഭാവികതയും Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
