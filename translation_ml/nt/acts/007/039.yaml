id: ACT.7.39
reference: Acts 7:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾧ οὐκ ἠθέλησαν ὑπήκοοι γενέσθαι οἱ πατέρες ἡμῶν, ἀλλὰ ἀπώσαντο καὶ ἐστράφησαν ⸂ἐν ταῖς καρδίαις⸃ αὐτῶν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/039.yaml
  text: Our fathers were unwilling to become obedient to him[a], but rejected him and turned back in their hearts to Egypt[b],
translation:
  language: ml
  text: നമ്മുടെ പിതാക്കന്മാർ അവനെ അനുസരിക്കാൻ വിസമ്മതിച്ചു; മറിച്ച്, അവർ അവനെ നിരസിച്ചു[a]—തങ്ങളുടെ ഹൃദയങ്ങളിൽ ഈജിപ്തിലേക്കു തിരിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ തള്ളിമാറ്റി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ തള്ളിയകറ്റുക, അകറ്റിനിർത്തുക എന്ന ശക്തമായ ഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവർ അപ്പോഴും മരുഭൂമിയിലായിരുന്നെങ്കിലും ഉള്ളിൽ ഈജിപ്തിലേക്കു മടങ്ങാൻ ആഗ്രഹിച്ചു.
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: അവന്
  rationale: മുൻവാക്യത്തിലെ മോശെയെ സൂചിപ്പിക്കുന്ന ഏകവചന ദത്തിവിഭക്തിയിലുള്ള ബന്ധസർവനാമം; ‘അനുസരണമുള്ളവരാകാൻ’ എന്ന പ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവന്’ എന്നു വരുന്നു.
- source_word: οὐκ ἠθέλησαν
  choice: തയ്യാറായില്ല
  rationale: വെറും പ്രവൃത്തിനിഷേധമല്ല, മനസ്സിന്റെ വിസമ്മതമാണ് ഇവിടെ പ്രകടമാകുന്നത്. ആ ഭാവം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπήκοοι γενέσθαι
  choice: അനുസരണമുള്ളവരാകാൻ
  rationale: ‘അനുസരിക്കുക’ എന്നു മാത്രം ചുരുക്കാതെ, ὑπήκοοι എന്ന വിശേഷണത്തിന്റെയും γενέσθαι എന്ന ‘ആകുക’ എന്ന ക്രിയയുടെയും ഘടന നിലനിർത്തുന്നു.
- source_word: οἱ πατέρες ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഇസ്രായേലിന്റെ മുൻതലമുറകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും ബൈബിൾശൈലിയിൽ പരിചിതവുമായ പരിഭാഷ.
- source_word: ἀπώσαντο
  choice: തള്ളിക്കളഞ്ഞു
  rationale: മോശെയെ അകറ്റിനിർത്തുകയും നിരസിക്കുകയും ചെയ്ത ശക്തമായ പ്രവൃത്തിയെ ഗ്രീക്ക് ക്രിയയോട് അടുത്തുനിന്ന് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐστράφησαν
  choice: തിരിഞ്ഞു
  rationale: εἰς Αἴγυπτον എന്ന ദിശാസൂചനയോടൊപ്പം ഈജിപ്തിലേക്കുള്ള മനസ്സിന്റെ പുനഃചായ്വ് വ്യക്തമാക്കുന്നു; ‘മടങ്ങി’ എന്നു ചേർത്ത് ശാരീരിക തിരിച്ചുപോക്കായി അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: തങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ആഗ്രഹവും ഉദ്ദേശ്യവും ഉൾപ്പെടുന്ന ആന്തരിക മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം നിലനിർത്തുകയും ഗ്രീക്കിലെ ബഹുവചനത്തെ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς Αἴγυπτον
  choice: ഈജിപ്തിലേക്കു
  rationale: εἰς നൽകുന്ന ദിശാബോധം ലളിതവും കൃത്യവുമായി പകരുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ ഈജിപ്തിലേക്കു തിരിഞ്ഞതിന്റെ സ്വഭാവം
  choice: ‘തങ്ങളുടെ ഹൃദയങ്ങളിൽ ഈജിപ്തിലേക്കു തിരിഞ്ഞു’
  alternative: ‘ഹൃദയത്തിൽ ഈജിപ്തിലേക്കു മടങ്ങി’
  rationale: ‘ഹൃദയങ്ങളിൽ’ എന്ന വ്യക്തമായ വാക്യഘടകം ആന്തരികമായ ആഗ്രഹത്തിന്റെയും കൂറിന്റെയും തിരിച്ചുപോക്കിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അതിനെ വെറും വികാരമെന്നോ യഥാർഥ ശാരീരിക മടക്കമെന്നോ ഒതുക്കാതെ മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘പിതാക്കന്മാർ,’ ‘ഹൃദയങ്ങളിൽ’ എന്നീ ബൈബിൾ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; അടിക്കുറിപ്പുകൾ ശക്തമായ ക്രിയാഭാവവും ആന്തരിക തിരിഞ്ഞുനോട്ടവും വ്യക്തമാക്കുന്നു.
