revisions:
- from: അവന് അനുസരണമുള്ളവരാകാൻ നമ്മുടെ പിതാക്കന്മാർ തയ്യാറായില്ല; മറിച്ച്, അവർ അവനെ തള്ളിക്കളഞ്ഞു[a], തങ്ങളുടെ ഹൃദയങ്ങളിൽ ഈജിപ്തിലേക്കു തിരിഞ്ഞു[b].
