  to: ദാവീദിന്റെ കാലംവരെ നിലനിന്ന ആ കൂടാരം നമ്മുടെ പൂർവികർ തലമുറതലമുറയായി ഏറ്റുവാങ്ങി[b], ദൈവം നമ്മുടെ പൂർവികരുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ ജനതകളുടെ ദേശം കൈവശപ്പെടുത്തിയപ്പോൾ, യോശുവയോടൊപ്പം[a] കൊണ്ടുവന്നു.
  rationale: The revision removes the unspecified “there,” makes “our fathers” explicit, and keeps the temporal phrase with the tabernacle in a natural Malayalam relative construction. It preserves the contextual implication of continued presence through David's days without asserting a particular location. The possession clause retains the historically implied land while clearly distinguishing it from God's driving out of the nations.
