id: ACT.7.45
reference: Acts 7:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: ml
  text: ദാവീദിന്റെ കാലംവരെ നിലനിന്ന ആ കൂടാരം നമ്മുടെ പൂർവികർ തലമുറതലമുറയായി ഏറ്റുവാങ്ങി[b], ദൈവം നമ്മുടെ പൂർവികരുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ ജനതകളുടെ ദേശം കൈവശപ്പെടുത്തിയപ്പോൾ, യോശുവയോടൊപ്പം[a] കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ‘യേശു’ എന്നും ‘യോശുവ’ എന്നും സൂചിപ്പിക്കാവുന്ന അതേ നാമരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് നൂന്റെ മകനായ യോശുവയാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അതു അനന്തരമായി ഏറ്റുവാങ്ങിയശേഷം’; ഈ ഗ്രീക്ക് ക്രിയാഭാഗം തലമുറകളിലൂടെയുള്ള കൈമാറ്റത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ആ കൂടാരം
  rationale: സ്ത്രീലിംഗ ഏകവചന ബന്ധസർവനാമം മുൻവാക്യത്തിലെ സാക്ഷ്യകൂടാരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ബന്ധവാക്യം സ്വാഭാവികമാക്കാൻ സൂചിത നാമം വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: εἰσήγαγον
  choice: കൊണ്ടുവന്നു
  rationale: εἰσάγω എന്ന ക്രിയയുടെ ‘അകത്തേക്കു കൊണ്ടുവരുക’ എന്ന ആശയം ദേശപ്രവേശനത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διαδεξάμενοι
  choice: തലമുറയായി ഏറ്റുവാങ്ങി
  rationale: മുൻഗാമികളിൽനിന്ന് അനന്തരാവകാശമായി സ്വീകരിക്കുന്നതും തലമുറകളുടെ തുടർച്ചയും ക്രിയാഭാഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: οἱ πατέρες ἡμῶν
  choice: നമ്മുടെ പൂർവികർ
  rationale: ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദം; പ്രസംഗത്തിലെ പൂർവികചരിത്രസൂചന നിലനിർത്തുന്നു.
- source_word: μετὰ Ἰησοῦ
  choice: യോശുവയോടൊപ്പം
  rationale: Ἰησοῦς എന്ന ഗ്രീക്ക് നാമം യേശുവിനെയും യോശുവയെയും സൂചിപ്പിക്കാമെങ്കിലും, മോശെയ്ക്കുശേഷമുള്ള ദേശപ്രവേശനസന്ദർഭത്തിൽ നൂന്റെ മകനായ യോശുവയാണ് ഉദ്ദേശ്യം.
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: ജനതകളുടെ ദേശം കൈവശമാക്കിയപ്പോൾ
  rationale: κατάσχεσις കൈവശപ്പെടുത്തൽ/ഉടമസ്ഥതയെ സൂചിപ്പിക്കുന്നു. പിന്നാലെ ജനതകളെ ദൈവം നീക്കിയതായി പറയുന്നതിനാൽ, മലയാളത്തിൽ തെറ്റായി മനുഷ്യരെ ‘കൈവശമാക്കി’ എന്നു തോന്നാതിരിക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ ‘ദേശം’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: ദൈവം അവരുടെ മുമ്പിൽനിന്ന് നീക്കിക്കളഞ്ഞ ജനതകൾ
  rationale: ἐξωθέωയുടെ ശക്തമായ നീക്കിപ്പുറത്താക്കൽ അർഥവും ἀπὸ προσώπου എന്ന സാന്നിധ്യസൂചക പ്രയോഗവും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: ദാവീദിന്റെ കാലംവരെ
  rationale: ദാവീദിന്റെ നാളുകൾവരെ എന്ന കാലപരിധി ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Ἰησοῦ എന്ന നാമത്തിന്റെ സൂചിത വ്യക്തി
  choice: യോശുവ
  alternative: യേശു
  rationale: ഗ്രീക്കിൽ ഒരേ നാമരൂപമാണെങ്കിലും, ഇസ്രായേൽ മോശെയ്ക്കുശേഷം ദേശത്തു പ്രവേശിക്കുന്ന ചരിത്രസന്ദർഭം നൂന്റെ മകനായ യോശുവയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. വ്യത്യസ്ത ഗ്രീക്ക് രൂപസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: διαδεξάμενοι എന്ന ക്രിയാഭാഗത്തിന്റെ ഊന്നൽ
  choice: പൂർവികർ കൂടാരം തലമുറയായി ഏറ്റുവാങ്ങി
  alternative: പൂർവികർ മാറിമാറി അതു കൊണ്ടുവന്നു
  rationale: ഈ ക്രിയ മുൻഗാമികളിൽനിന്നുള്ള സ്വീകരണത്തെയും അനന്തരതയെയും സൂചിപ്പിക്കുന്നു; വെറും ക്രമാനുസൃത പ്രവർത്തനമായി ചുരുക്കുന്നില്ല.
- issue: ἕως τῶν ἡμερῶν Δαυίδ എന്നതിന്റെ വാക്യബന്ധം
  choice: കൂടാരം അവിടെ തുടർന്ന കാലപരിധിയായി സ്വാഭാവികമായി അവതരിപ്പിച്ചു
  alternative: കൊണ്ടുവന്ന പ്രവർത്തനത്തോട് നേരിട്ട് ചേർത്ത് ‘ദാവീദിന്റെ കാലംവരെ കൊണ്ടുവന്നു’ എന്നു നൽകുക
  rationale: ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്കു നീളുന്നതും ബന്ധത്തിൽ ചെറിയ സങ്കീർണതയുള്ളതുമാണ്. മലയാളത്തിൽ തെറ്റായ ദീർഘകാല ‘കൊണ്ടുവരൽ’ അർഥം ഒഴിവാക്കി, കൂടാരത്തിന്റെ ചരിത്രസാന്നിധ്യം എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി. ‘പൂർവികർ’ എന്ന പദം ആവർത്തനത്തിലെ ചരിത്രബന്ധം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
