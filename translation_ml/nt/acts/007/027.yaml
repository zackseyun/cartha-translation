  text: ὁ δὲ ἀδικῶν τὸν πλησίον ἀπώσατο αὐτὸν εἰπών· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστὴν ἐφ’ ⸀ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/027.yaml
  text: But the man who was wronging his neighbor pushed him away[a], saying, ‘Who appointed you ruler and judge over us?’
translation:
  language: ml
  text: 'എന്നാൽ തന്റെ സഹമനുഷ്യനോട് അനീതി ചെയ്തുകൊണ്ടിരുന്നവൻ മോശെയെ തള്ളിമാറ്റി[a], പറഞ്ഞു: “ഞങ്ങളുടെമേൽ ഭരണാധികാരിയും ന്യായാധിപനുമായി നിന്നെ നിയമിച്ചത് ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ബലമായി തള്ളിയകറ്റി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ശക്തമായ ശാരീരിക തള്ളലിനെയോ അവഗണനയോടെയുള്ള നിരാകരണത്തെയോ ഊന്നിപ്പറയാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: അനീതി ചെയ്തുകൊണ്ടിരുന്നവൻ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും ἀδικέω എന്ന പദത്തിലെ അനീതിയുടെ ആശയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πλησίον
  choice: അയൽക്കാരൻ
  rationale: ‘സമീപസ്ഥൻ/അയൽക്കാരൻ’ എന്ന സാധാരണ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സഹയിസ്രായേല്യനാണെങ്കിലും അത് പാഠത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἀπώσατο
  choice: തള്ളിമാറ്റി
  rationale: ശാരീരികമായി തള്ളുന്നതും ശക്തമായി അകറ്റിക്കളയുന്നതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κατέστησεν
  choice: നിയമിച്ചത്
  rationale: ഒരാളെ അധികാരസ്ഥാനത്ത് ആക്കുക എന്ന καθίστημι-യുടെ കാരണാർഥം ഈ പ്രയോഗത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄρχοντα
  choice: ഭരണാധികാരി
  rationale: ഭരണപരമായ അധികാരം സൂചിപ്പിക്കുന്ന നേരിട്ടും ഗൗരവമുള്ളതുമായ മലയാള പദം.
- source_word: δικαστὴν
  choice: ന്യായാധിപൻ
  rationale: വിധിനിർണയാധികാരമുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പതിവായ ഔപചാരിക മലയാള പദം.
- source_word: ἐφ’ ἡμῶν
  choice: ഞങ്ങളുടെമേൽ
  rationale: ഒരു കൂട്ടത്തിന്മേൽ അധികാരം പ്രയോഗിക്കുന്നതിനെക്കുറിച്ചുള്ള വെല്ലുവിളിയാണ് ഇവിടെ; ‘ഞങ്ങളുടെമേൽ’ ആ ബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
