id: ACT.7.7
reference: Acts 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: ml
  text: “അവർ സേവിക്കുന്ന[a] ജനതയെ ഞാൻ ന്യായംവിധിക്കും,” എന്ന് ദൈവം പറഞ്ഞു. “അതിനുശേഷം അവർ പുറത്തുവന്ന് ഈ സ്ഥലത്ത് എന്നെ ആരാധിക്കും[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അടിമവേല ചെയ്യുന്ന’ / ‘അടിമകളായി സേവിക്കുന്ന.’ ഗ്രീക്കിൽ ‘സേവിക്കുക’ എന്ന ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ സന്ദർഭം ഈജിപ്തിലെ ഇസ്രായേലിന്റെ അടിമത്തമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്നെ സേവിക്കും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ദൈവത്തിനു നൽകുന്ന മതപരമായ സേവനത്തെയോ ആരാധനയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: ജനത
  rationale: അബ്രാഹാമിന്റെ സന്തതിയെ അടിമപ്പെടുത്തുന്ന രാഷ്ട്രീയ-ജനസമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘ജനത’ സ്വാഭാവികവും ഏകവചനത്തിന്റെ അർഥം നിലനിർത്തുന്നതുമാണ്.
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: അവർ സേവിക്കുന്ന
  rationale: δουλεύω എന്ന ക്രിയയുടെ ‘സേവിക്കുക’ എന്ന രൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഈജിപ്തിലെ നിർബന്ധിത അടിമവേല എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κρινῶ
  choice: ഞാൻ ന്യായംവിധിക്കും
  rationale: ദൈവം വിധി നടപ്പാക്കുന്നതിന്റെ ന്യായാധിപത്യസ്വഭാവം വ്യക്തമാക്കുകയും ‘ശിക്ഷിക്കും’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ θεὸς εἶπεν
  choice: എന്ന് ദൈവം പറഞ്ഞു
  rationale: ഉദ്ധരണിക്കുള്ളിലെ പ്രസ്താവകസൂചന മലയാളത്തിലെ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ നൽകുന്നു.
- source_word: μετὰ ταῦτα
  choice: അതിനുശേഷം
  rationale: സംഭവങ്ങളുടെ തുടർച്ച ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐξελεύσονται
  choice: അവർ പുറത്തുവന്ന്
  rationale: അടിമപ്പെടുത്തിയ ജനതയിൽനിന്നുള്ള പുറപ്പാട് സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ദിശയും തുടർന്നുള്ള ആരാധനയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: λατρεύσουσίν μοι
  choice: എന്നെ ആരാധിക്കും
  rationale: ദൈവത്തിനു നൽകുന്ന മതപരമായ സേവനം എന്ന λατρεύωയുടെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു; ‘എന്നെ സേവിക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: ഈ സ്ഥലത്ത്
  rationale: τόπος എന്നതിന്റെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷയാണ്; സ്ഥലസൂചനയെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അടിമത്തത്തിന്റെ സന്ദർഭത്തിൽ δουλεύω പരിഭാഷപ്പെടുത്തൽ
  choice: സേവിക്കുന്ന
  alternative: അടിമവേല ചെയ്യുന്ന / അടിമകളായി സേവിക്കുന്ന
  rationale: ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുമ്പോഴും ഈജിപ്തിലെ നിർബന്ധിത അടിമത്തം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ദൈവത്തോടുള്ള λατρεύω പരിഭാഷപ്പെടുത്തൽ
  choice: ആരാധിക്കും
  alternative: സേവിക്കും
  rationale: ഇവിടെ സാധാരണ തൊഴിൽസേവനമല്ല, ദൈവത്തിനു നൽകുന്ന മതപരമായ ശുശ്രൂഷയാണ് ഉദ്ദേശിക്കുന്നത്; ‘ആരാധിക്കും’ അത് വ്യക്തമായി പകരുന്നു, അതേസമയം മറ്റൊരു സാധുവായ പദസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള ഉദ്ധരണിയും പ്രസ്താവകസൂചനയും വ്യക്തമായി വേർതിരിച്ചു. ‘സേവിക്കുക’ എന്ന പദത്തിലെ അടിമത്തസൂചനയും ‘ആരാധിക്കുക’ എന്ന പദത്തിലെ മതപരമായ സേവനസൂചനയും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാളിയിൽ [b] ചിഹ്നം പ്രസ്താവകസൂചനയ്ക്കരികിലായിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് λατρεύωയെ സംബന്ധിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ആരാധിക്കും’ എന്നതിനോടു ചേർത്തു.
