source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτόν· Ἔξελθε ἐκ τῆς γῆς σου καὶ ⸀ἐκ τῆς συγγενείας σου, καὶ δεῦρο εἰς ⸀τὴν γῆν ἣν ἄν σοι δείξω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/003.yaml
  text: And he said to him[a], ‘Go out from your land and from your kindred, and come into the land that I will show you.’
translation:
  language: ml
  text: 'അവൻ അവനോടു പറഞ്ഞു: “നിന്റെ ദേശത്തുനിന്നും നിന്റെ ബന്ധുജനങ്ങളിൽനിന്നും[a] പുറപ്പെട്ട്, ഞാൻ നിനക്കു കാണിച്ചുതരുന്ന ദേശത്തേക്കു വരിക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്റെ ബന്ധുക്കളിൽനിന്നും” അല്ലെങ്കിൽ “നിന്റെ കുടുംബത്തിൽനിന്നും.” ഗ്രീക്കിലെ συγγένεια എന്ന പദം ഒരാളുടെ ബന്ധുത്വസമൂഹത്തെയോ ബന്ധുജനങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτόν
  choice: അവൻ അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കർത്താവിനെയും കർമസ്ഥാനത്തുള്ള സർവനാമത്തെയും അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘അവൻ’ ആരെന്നത് വ്യക്തമാണ്.
- source_word: Ἔξελθε
  choice: പുറപ്പെടുക
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ചലനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκ τῆς γῆς σου
  choice: നിന്റെ ദേശത്തുനിന്നും
  rationale: γῆയുടെ പ്രദേശസംബന്ധിയായ വിശാല അർഥം നിലനിർത്തുന്നു; ആധുനിക രാഷ്ട്രസങ്കല്പം അനാവശ്യമായി സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: συγγενείας
  choice: ബന്ധുജനങ്ങൾ
  rationale: ഒരു വ്യക്തിയുടെ ബന്ധുത്വസമൂഹത്തെയോ കുലബന്ധുക്കളെയോ സൂചിപ്പിക്കുന്ന συλλക്റ്റീവ് അർഥം നൽകുന്നു.
- source_word: δεῦρο
  choice: വരിക
  rationale: δεῦροയിലെ സംസാരിക്കുന്നവന്റെ ദിശയിലേക്കുള്ള ആഹ്വാനഭാവം ‘പോകുക’ എന്നു സമതലപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: εἰς τὴν γῆν
  choice: ദേശത്തേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἣν ἄν σοι δείξω
  choice: ഞാൻ നിനക്കു കാണിച്ചുതരുന്ന
  rationale: ἄν സഹിതമുള്ള aorist subjunctive-ന്റെ ഭാവിമുഖവും ഇതുവരെ നിർണയിച്ചറിയിക്കാത്ത ലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘വരിക’ എന്ന ദിശാസൂചനയും ‘ദേശം’ എന്ന വിശാല പ്രദേശാർഥവും നിലനിർത്തി. അടിക്കുറിപ്പിന്റെ സൂചിക അതു വിശദീകരിക്കുന്ന ‘ബന്ധുജനങ്ങൾ’ എന്ന പദത്തിനുശേഷം ചേർത്തു.
