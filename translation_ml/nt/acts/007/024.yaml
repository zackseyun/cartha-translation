id: ACT.7.24
reference: Acts 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: ml
  text: അന്യായം അനുഭവിക്കുന്ന ഒരാളെ കണ്ടപ്പോൾ, അവൻ അയാളെ പ്രതിരോധിച്ചു; ഈജിപ്തുകാരനെ അടിച്ച്[b], പീഡിപ്പിക്കപ്പെട്ടവനുവേണ്ടി പ്രതികാരം ചെയ്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പീഡിപ്പിക്കപ്പെട്ടവനുവേണ്ടി നീതി നടപ്പാക്കി.’ ἐποίησεν ἐκδίκησιν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് പ്രതികാരം ചെയ്യുക, അല്ലെങ്കിൽ പീഡിതനെ ന്യായീകരിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ ഈ പ്രഹരം മരണത്തിൽ കലാശിച്ചതായി പുറപ്പാട് 2 വ്യക്തമാക്കുന്നു. എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘അടിക്കുക’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: കണ്ടപ്പോൾ
  rationale: അഒറിസ്റ്റ് കൃദ്‌രൂപത്തെ മുഖ്യപ്രവൃത്തികളുടെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τινα
  choice: ഒരാളെ
  rationale: വ്യക്തിയുടെ ലിംഗമോ കൂടുതൽ തിരിച്ചറിയൽവിവരമോ ചേർക്കാതെ ഗ്രീക്കിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἀδικούμενον
  choice: അന്യായം അനുഭവിക്കുന്ന
  rationale: അനീതിക്ക് ഇരയാകുന്നതെന്ന ധാർമിക അർഥവും പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്നുവെന്ന കൃദ്‌രൂപത്തിന്റെ ഭാവവും പ്രകടമാക്കുന്നു.
- source_word: ἠμύνατο
  choice: അയാളെ സംരക്ഷിക്കാൻ മുന്നിട്ടിറങ്ങി
  rationale: ആക്രമിക്കപ്പെടുന്നയാളുടെ പ്രതിരോധത്തിനായി ഇടപെടുക എന്ന മധ്യമരൂപത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: നീതി നടപ്പാക്കി
  rationale: പ്രതികാരം ചെയ്യുക, നീതി ലഭ്യമാക്കുക, കുറ്റത്തിന് പ്രതിഫലം നൽകുക എന്നീ അർഥസാധ്യതകളുള്ള പ്രയോഗത്തെ വ്യക്തിപരമായ പകയായി ചുരുക്കാതെ സന്ദർഭോചിതമായി അവതരിപ്പിക്കുന്നു.
- source_word: τῷ καταπονουμένῳ
  choice: പീഡിപ്പിക്കപ്പെട്ടിരുന്നവനുവേണ്ടി
  rationale: കഠിനമായി ഉപദ്രവിക്കപ്പെടുന്ന അവസ്ഥയും ദത്തിവിന്റെ ഗുണഭോക്തൃഭാവമായ ‘വേണ്ടി’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: πατάξας
  choice: അടിച്ചുകൊണ്ട്
  rationale: πατάσσω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള ‘അടിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മരണം സംഭവിച്ചെങ്കിലും അത് മുഖ്യപാഠത്തിൽ ക്രിയയ്ക്കുമപ്പുറം വ്യക്തമാക്കുന്നില്ല.
- source_word: τὸν Αἰγύπτιον
  choice: ഈജിപ്തുകാരനെ
  rationale: ജനവിഭാഗസൂചകമായ നാമപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: മോശെയുടെ പ്രവൃത്തിയിലെ ἐκδίκησις എന്ന പദത്തിന്റെ നീതി/പ്രതികാരം അർഥവ്യാപ്തി
  choice: നീതി നടപ്പാക്കി
  alternative: പീഡിപ്പിക്കപ്പെട്ടിരുന്നവനുവേണ്ടി പ്രതികാരം ചെയ്തു
  rationale: മോശെ പീഡിതനുവേണ്ടി ഇടപെട്ട് ഈജിപ്തുകാരനെ പ്രഹരിച്ചതെന്ന പ്രതികാരപരമായ വശം മായ്ക്കാതെ, സ്വകാര്യപ്രതികാരത്തിന് ദൈവശാസ്ത്രപരമായ അംഗീകാരം പരിഭാഷയിൽ ചേർക്കാതെയും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ന്യായസ്ഥാപനഭാവം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അയാളെ’ എന്നത് മുൻപുള്ള അനിശ്ചിത വ്യക്തിയെ വ്യക്തമായി തിരിച്ചുചൂണ്ടുന്നു. ഗ്രീക്കിലെ കൃദ്‌രൂപങ്ങളുടെ ബന്ധം സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ പുനഃക്രമീകരിച്ചെങ്കിലും പ്രവർത്തനക്രമവും അർഥബന്ധവും സംരക്ഷിച്ചിട്ടുണ്ട്.
