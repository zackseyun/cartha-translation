id: ACT.7.2
reference: Acts 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: ml
  text: 'അപ്പോൾ അദ്ദേഹം പറഞ്ഞു: “സഹോദരന്മാരേ, പിതാക്കന്മാരേ[a], കേൾക്കുക: നമ്മുടെ പിതാവായ അബ്രാഹാം മെസൊപ്പൊട്ടേമിയയിൽ ആയിരുന്നപ്പോൾ, ഹാരാനിൽ താമസിക്കുന്നതിനുമുമ്പ്[b], മഹത്വത്തിന്റെ ദൈവം അദ്ദേഹത്തിന് പ്രത്യക്ഷനായി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുരുഷന്മാരേ, സഹോദരന്മാരേ, പിതാക്കന്മാരേ.” ഗ്രീക്കിലെ ഔപചാരിക സംബോധന വ്യക്തമായി പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഹാരാനിൽ കുടിയേറുന്നതിനുമുമ്പ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: അപ്പോൾ അദ്ദേഹം പറഞ്ഞു
  rationale: δέ ഇവിടെ സംഭാഷണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന ലഘുവായ ബന്ധകമാണ്. മുൻചോദ്യത്തോടുള്ള പ്രതികരണം സ്വാഭാവികമായി അറിയിക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു; ἔφη എന്ന സാധാരണ ആഖ്യാനക്രിയ ‘പറഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: സഹോദരന്മാരേ, പിതാക്കന്മാരേ
  rationale: ന്യായസഭയെയും സന്നിഹിതരെയും അഭിസംബോധന ചെയ്യുന്ന ഔപചാരികവും വ്യക്തമായി പുരുഷലിംഗപരവുമായ സംബോധനയാണിത്. ἄνδρες എന്നതിന്റെ ഔപചാരികശക്തി മലയാളത്തിലെ ഈ സ്വാഭാവിക സംബോധനയിൽ ഉൾക്കൊള്ളുന്നു; പദാനുപദമായ ദീർഘരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀκούσατε
  choice: കേൾക്കുക
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞയാണ്. ‘കേൾക്കുക’ ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: Ὁ θεὸς τῆς δόξης
  choice: മഹത്ത്വത്തിന്റെ ദൈവം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും പഴയനിയമഭാഷയുമായിരിക്കാവുന്ന പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ‘മഹത്ത്വമുള്ള ദൈവം’ എന്ന വിശേഷണപരമായ ലഘൂകരണം ഒഴിവാക്കുന്നു.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ ὁράω എന്ന ക്രിയയുടെ കർമണി രൂപത്തിന് സ്വാഭാവികമായ അർഥം ‘പ്രത്യക്ഷനായി’ എന്നാണ്. ‘സ്വയം വെളിപ്പെടുത്തി’ എന്നത് അധിക വ്യാഖ്യാനം ചേർക്കും.
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: നമ്മുടെ പിതാവായ അബ്രാഹാമിന്
  rationale: അബ്രാഹാമുമായുള്ള സമൂഹപരമായ ഐക്യത്തെ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമം ഉപയോഗിക്കുന്നു.
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: അദ്ദേഹം മെസൊപ്പൊത്താമ്യയിൽ ആയിരുന്നപ്പോൾ
  rationale: പാർട്ടിസിപ്പിളിന്റെ കാലസാഹചര്യാർഥം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: ഹാരാനിൽ താമസിക്കുന്നതിനുമുമ്പ്
  rationale: κατοικέω എന്നത് ഒരു സ്ഥലത്ത് താമസിക്കുക, പാർക്കുക, കുടിയേറുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘താമസിക്കുക’ ഏറ്റവും ലളിതവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമായ മുഖ്യവായനയാണ്; ‘കുടിയേറുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന ഔപചാരിക സംബോധനയുടെ പരിഭാഷ
  choice: സഹോദരന്മാരേ, പിതാക്കന്മാരേ
  alternative: പുരുഷന്മാരേ, സഹോദരന്മാരേ, പിതാക്കന്മാരേ
  rationale: ഗ്രീക്കിലെ സംബോധന വ്യക്തമായി പുരുഷലിംഗപരമാണ്; അതിനെ ലിംഗനിരപേക്ഷമാക്കിയിട്ടില്ല. എന്നാൽ ἄνδρες എന്നത് ഈ സംയുക്ത ഔപചാരിക സംബോധനയുടെ ഭാഗമായതിനാൽ, മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കി അതിന്റെ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: θεὸς τῆς δόξης എന്ന ദൈവിക വിശേഷണത്തിന്റെ രൂപം
  choice: മഹത്ത്വത്തിന്റെ ദൈവം
  alternative: മഹത്ത്വമുള്ള ദൈവം
  rationale: ജനിറ്റീവ് ഘടനയും തിരുവെഴുത്തിലെ സാധ്യതയുള്ള അന്തർപാഠപ്രതിധ്വനിയും നിലനിർത്തി; അതിനെ ഒരു സാധാരണ വിശേഷണമായി വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഔപചാരിക സംബോധനയും ‘മഹത്ത്വത്തിന്റെ ദൈവം’ എന്ന തിരുവെഴുത്തുസ്വഭാവമുള്ള പ്രയോഗവും നിലനിർത്തി. കാലസാഹചര്യവാക്യത്തെ ഡാഷുകൾക്കുള്ളിൽ വെച്ച് ദീർഘവാക്യത്തിന്റെ വ്യക്തത മെച്ചപ്പെടുത്തി.
