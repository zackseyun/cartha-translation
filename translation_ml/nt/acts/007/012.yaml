id: ACT.7.12
reference: Acts 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ Ἰακὼβ ὄντα ⸂σιτία εἰς Αἴγυπτον⸃ ἐξαπέστειλεν τοὺς πατέρας ἡμῶν πρῶτον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: ml
  text: എന്നാൽ ഈജിപ്തിൽ ധാന്യമുണ്ടെന്ന്[a] യാക്കോബ് കേട്ടപ്പോൾ, നമ്മുടെ പിതാക്കന്മാരെ ആദ്യമായി അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈജിപ്തിൽ ഭക്ഷ്യശേഖരമുണ്ടെന്ന്.’ ഗ്രീക്കിലെ σιτία എന്ന പദം പൊതുവായി ഭക്ഷ്യസാധനങ്ങളെയോ കരുതൽശേഖരത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ ‘ധാന്യം’ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ കാലബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: സ്തെഫാനൊസിന്റെ വിവരണത്തിലെ മൃദുവായ വഴിത്തിരിവ് അടയാളപ്പെടുത്തുന്നു; അതിരുകടന്ന വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: ഈജിപ്തിൽ ധാന്യമുണ്ടെന്ന്
  rationale: ἀκούωയ്ക്ക് ശേഷമുള്ള accusative-participle ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷപ്രസ്താവനയായി നൽകുന്നു.
- source_word: σιτία
  choice: ധാന്യം
  rationale: ഈ പദത്തിന് പൊതുവായി ഭക്ഷ്യശേഖരം എന്നർഥവും ഉണ്ടാകാം; എന്നാൽ യോസേഫിന്റെയും ക്ഷാമത്തിന്റെയും പശ്ചാത്തലത്തിൽ ധാന്യം എന്നതാണ് കൂടുതൽ കൃത്യം.
- source_word: ἐξαπέστειλεν
  choice: അവിടേക്ക് അയച്ചു
  rationale: യാത്രയ്ക്കായി അയച്ചുവെന്ന ആശയം ലക്ഷ്യസൂചനയോടെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്ക് ഉപസർഗത്തെ കൃത്രിമമായി പദാനുപദം പകർത്തുന്നില്ല.
- source_word: τοὺς πατέρας ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരെ
  rationale: ഇവിടെ യിസ്രായേലിന്റെ പുരുഷ പൂർവപിതാക്കളായ യാക്കോബിന്റെ പുത്രന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ കുടുംബബന്ധഭാഷ നിലനിർത്തുന്നു.
- source_word: πρῶτον
  choice: ആദ്യമായി
  rationale: പിന്നീടുള്ള രണ്ടാമത്തെ യാത്രയ്ക്കു വിരുദ്ധമായി ഇത് ആദ്യത്തെ അയക്കലാണെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν എന്നതിന്റെ വിവർത്തനം
  choice: നമ്മുടെ പിതാക്കന്മാരെ
  alternative: നമ്മുടെ പൂർവികരെ; ഗോത്രപിതാക്കന്മാരെ
  rationale: പരാമർശം പൊതുവായി എല്ലാ പൂർവികരെയും കുറിച്ചല്ല, യാക്കോബിന്റെ പുത്രന്മാരായ പുരുഷ പൂർവപിതാക്കളെക്കുറിച്ചാണ്. അതിനാൽ മൂലത്തിലെ കുടുംബപരവും ലിംഗനിർദ്ദിഷ്ടവുമായ ഭാഷ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘പിതാക്കന്മാർ’ എന്ന ബൈബിൾപരമായ കുടുംബബന്ധപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
