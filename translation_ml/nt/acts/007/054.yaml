id: ACT.7.54
reference: Acts 7:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούοντες δὲ ταῦτα διεπρίοντο ταῖς καρδίαις αὐτῶν καὶ ἔβρυχον τοὺς ὀδόντας ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/054.yaml
  text: When they heard these things[a], they were cut to the heart and gnashed their teeth at him.
translation:
  language: ml
  text: ഇതു കേട്ടപ്പോൾ അവർ ഹൃദയത്തിൽ കീറിമുറിക്കപ്പെട്ടവരെപ്പോലെ ആയി; അവന്റെ നേരെ പല്ലുകടിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούοντες
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാന ക്രിയകളുടെ സാഹചര്യവും സമയബന്ധവും വ്യക്തമാക്കുന്ന വർത്തമാനകാല കൃതന്തത്തെ സ്വാഭാവികമായ മലയാള സമയവാക്യമായി നൽകി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനമുന്നേറ്റമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യക്രമം അതു സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വിരോധസൂചകം ചേർത്തില്ല.
- source_word: ταῦτα
  choice: ഇതു
  rationale: മുൻപുള്ള സ്തെഫാനൊസിന്റെ പ്രസംഗത്തെ മൊത്തമായി ചൂണ്ടിക്കാണിക്കുന്നതിന് മലയാളത്തിൽ ഏകവചനസമാനമായ ‘ഇതു’ സ്വാഭാവികമാണ്.
- source_word: διεπρίοντο
  choice: അവരുടെ ഹൃദയം പിളർന്നുപോകുന്നതുപോലെ അവർ ക്രുദ്ധരായി
  rationale: ‘കീറുക/അറുക്കുക’ എന്ന സജീവ ദൃശ്യരൂപവും കടുത്ത ആന്തരിക കോപം എന്ന സന്ദർഭാർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ταῖς καρδίαις αὐτῶν
  choice: അവരുടെ ഹൃദയം
  rationale: ബാധിക്കപ്പെട്ട ആന്തരിക മണ്ഡലത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ബഹുവചനം മലയാളത്തിലെ സ്വാഭാവിക വിതരണ ഏകവചനമായി നൽകി.
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: പല്ലുകടിച്ചു
  rationale: കടുത്ത ശത്രുതയും രോഷവും പ്രകടിപ്പിക്കുന്ന ദൃശ്യമായ മലയാള പ്രയോഗം.
- source_word: ἐπ’ αὐτόν
  choice: സ്തെഫാനൊസിന്റെ നേരെ
  rationale: ശത്രുതയുടെ ദിശ വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ‘അവന്റെ നേരെ’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ വ്യക്തതയ്ക്കായി പേര് ആവർത്തിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം പിളർന്നുപോകുന്നതുപോലെ’ എന്ന രൂപം മൂലഭാഷയിലെ ദൃശ്യരൂപത്തെയും സന്ദർഭത്തിലെ രോഷത്തെയും കൂട്ടിച്ചേർക്കുന്നു; അടിക്കുറിപ്പ് അർഥപരമായ മറ്റൊരു സാധ്യത വ്യക്തമാക്കുന്നു.
