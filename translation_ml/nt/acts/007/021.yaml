translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ദത്തെടുത്തു’ എന്ന നിയമപരമോ വ്യാഖ്യാനപരമോ ആയ പദം ഒഴിവാക്കി, എടുത്തതും മകനായി വളർത്തിയതും വേർതിരിച്ചുള്ള ഗ്രീക്ക് വാക്യഘടന നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ അടിക്കുറിപ്പുകളുടെ സ്ഥാനക്കുഴപ്പം തിരുത്തി: [a] ἀνείλατο-യോടും [b] εἰς υἱόν-നോടും ചേർത്തിരിക്കുന്നു.'
