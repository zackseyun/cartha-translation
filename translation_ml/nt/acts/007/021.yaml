id: ACT.7.21
reference: Acts 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: ml
  text: എന്നാൽ അവനെ പുറത്തു കിടത്തിവിട്ടപ്പോൾ, ഫറവോന്റെ മകൾ അവനെ എടുത്ത്[a] തന്റെ മകനായി[b] വളർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എടുത്തുയർത്തി.’ പുറത്തു കിടത്തിവിട്ട ഒരു ശിശുവിനെ എടുത്തുകൊള്ളുക എന്ന അർത്ഥം ഈ ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു മകനായി’ അല്ലെങ്കിൽ ‘മകനെന്ന നിലയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: പുറത്തു കിടത്തിവിട്ടപ്പോൾ
  rationale: ശിശുവിനെ പുറത്തുവെക്കുകയോ ഉപേക്ഷിച്ച നിലയിൽ വിടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന അഓറിസ്റ്റ് കർമണി കൃദന്തരൂപം. ‘ഉപേക്ഷിച്ചപ്പോൾ’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യം അമിതമായി നിർണയിക്കാതെ, ചരിത്രസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മോശെയെ പുറത്തുവിട്ട സംഭവത്തിൽനിന്ന് ഫറവോന്റെ മകൾ അവനെ ഏറ്റെടുക്കുന്ന സംഭവത്തിലേക്കുള്ള ആഖ്യാനപരമായ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: ἀνείλατο
  choice: എടുത്ത്
  rationale: പുറത്തു കിടത്തിവിട്ട ശിശുവിനെ എടുത്തുകൊള്ളുക എന്ന അർത്ഥം ഇവിടെ നൽകുന്നു. ‘ദത്തെടുത്തു’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ, തുടർന്ന് εἰς υἱόν വ്യക്തമാക്കുന്ന മകനെന്ന നില മുൻകൂട്ടി ഈ ക്രിയയിൽ ചേർത്തുപറയുന്നതാകും.
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: ഫറവോന്റെ മകൾ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഘടനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀνεθρέψατο
  choice: വളർത്തി
  rationale: ഒരു കുട്ടിയെ പോറ്റിവളർത്തുക, വളർത്തിക്കൊണ്ടുവരുക എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർത്ഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἑαυτῇ εἰς υἱόν
  choice: തനിക്കു മകനായി
  rationale: പ്രതിഫലന ദത്തിവും εἰς υἱόν എന്ന ഫലമോ നിലയോ സൂചിപ്പിക്കുന്ന പ്രയോഗവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; അവൾ അവനെ തന്റെ മകനെന്ന നിലയിൽ വളർത്തിയെന്ന ആശയം വ്യക്തമാകുന്നു.
