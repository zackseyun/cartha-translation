id: ACT.7.49
reference: Acts 7:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: ml
  text: ‘സ്വർഗം എനിക്കു സിംഹാസനമാണ്; ഭൂമി എന്റെ പാദങ്ങൾക്കു പാദപീഠമാണ്. നിങ്ങൾ എനിക്കായി ഏതുതരം ഭവനം പണിയും, കർത്താവ് അരുളിച്ചെയ്യുന്നു, അല്ലെങ്കിൽ എന്റെ വിശ്രമത്തിനുള്ള സ്ഥലം ഏതാണ്?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: ആകാശം
  rationale: ഭൂമിയോടു വിരുദ്ധമായി നിൽക്കുന്ന സ്വർഗീയ വ്യാപ്തിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ ഉദ്ധരണിയുടെ വിശാല പ്രപഞ്ചസന്ദർഭത്തിന് ‘ആകാശം’ സ്വാഭാവികമാണ്.
- source_word: θρόνος
  choice: സിംഹാസനം
  rationale: രാജാധികാരത്തിന്റെ ഇരിപ്പിടമെന്ന രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: γῆ
  choice: ഭൂമി
  rationale: ആകാശത്തോടു ചേർന്ന പ്രപഞ്ചവ്യാപകമായ അർഥം; ‘ദേശം’ എന്ന പരിമിത അർഥമല്ല.
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: എന്റെ പാദപീഠം
  rationale: ‘എന്റെ കാലുകളുടെ പാദപീഠം’ എന്ന പദാനുപദ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാണ്; ‘പാദപീഠം’ എന്നതിൽ പാദബന്ധം ഇതിനകം വ്യക്തമായതിനാൽ ചിത്രം പൂർണമായി നിലനിൽക്കുന്നു.
- source_word: ποῖον
  choice: ഏതുതരം
  rationale: തിരിച്ചറിയൽ മാത്രമല്ല, ഭവനത്തിന്റെ തരമോ സ്വഭാവമോ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സൂക്ഷിക്കുന്നു.
- source_word: οἶκον
  choice: ഭവനം
  rationale: സന്ദർഭത്തിൽ ദേവാലയം ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും ഗ്രീക്കിലെ പൊതുവായ ‘വീട്/ഭവനം’ എന്ന പദം നിലനിർത്തി വ്യാഖ്യാനം മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
- source_word: οἰκοδομήσετέ
  choice: നിങ്ങൾ പണിയും
  rationale: ഭാവികാല സൂചകത്തിന്റെ നേരിട്ടുള്ള ചോദ്യരൂപം നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ κύριος എന്ന പദത്തിന്റെ പതിവും മാന്യവുമായ മലയാള സമാനപദം.
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: എന്റെ വിശ്രമത്തിനുള്ള സ്ഥലം
  rationale: ഗ്രീക്കിലെ ‘എന്റെ വിശ്രമത്തിന്റെ സ്ഥലം’ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ദൈവിക വിശ്രമത്തിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിൽ κύριος എന്ന ദൈവനാമസൂചക പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഇവിടെ പുതിയനിയമ ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണ് ഉള്ളത്; അതിനാൽ പഴയനിയമ പശ്ചാത്തലത്തെ അടിസ്ഥാനമാക്കി പ്രത്യേക ദൈവനാമം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്ക് രൂപത്തെ പിന്തുടരുന്നു.
- issue: οἶκος എന്ന പദത്തിന്റെ ദേവാലയസംബന്ധമായ സൂചന
  choice: ഭവനം
  alternative: ദേവാലയം
  rationale: സന്ദർഭത്തിൽ ദേവാലയം സൂചിപ്പിച്ചാലും മൂലപാഠം പൊതുവായ ‘ഭവനം’ എന്നാണ് പറയുന്നത്; അതിലെ വാചകവ്യാപ്തിയും വാഗ്‌വൈഭവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. പ്രവാചകീയ ഉദ്ധരണിയുടെ ഗൗരവം സൂക്ഷിക്കാൻ ‘ഭവനം’, ‘അരുളിച്ചെയ്യുന്നു’ എന്നിവ ഉപയോഗിച്ചു; അനാവശ്യമായി പുരാതനമായ പദക്രമം ഒഴിവാക്കി.
