id: ACT.7.57
reference: Acts 7:57
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κράξαντες δὲ φωνῇ μεγάλῃ συνέσχον τὰ ὦτα αὐτῶν, καὶ ὥρμησαν ὁμοθυμαδὸν ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/057.yaml
  text: But crying out with a loud voice[a], they covered their ears and rushed together at him,
translation:
  language: ml
  text: എന്നാൽ അവർ ഉച്ചത്തിൽ നിലവിളിച്ച് തങ്ങളുടെ ചെവികൾ പൊത്തിപ്പിടിച്ചു; ഒറ്റക്കെട്ടായി[a] അവന്റെ നേരെ പാഞ്ഞടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരേ മനസ്സോടെ.” ὁμοθυμαδόν എന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണം അവരുടെ ഏകോപിതമായ പ്രവർത്തനത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξαντες
  choice: നിലവിളിച്ച്
  rationale: κράζω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള പ്രവൃത്തികളുമായുള്ള കൃദന്തബന്ധം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ ദർശനവിവരണത്തിൽനിന്ന് ജനക്കൂട്ടത്തിന്റെ വിരുദ്ധപ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും വ്യക്തമാക്കുന്നു.
- source_word: φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ
  rationale: ‘വലിയ ശബ്ദത്തോടെ’ എന്ന അക്ഷരാർഥത്തെ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: തങ്ങളുടെ ചെവികൾ പൊത്തിപ്പിടിച്ചു
  rationale: കേൾക്കാതിരിക്കാനായി ചെവികൾ അടച്ചുപിടിക്കുന്ന പ്രവൃത്തിയെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὥρμησαν
  choice: പാഞ്ഞടുത്തു
  rationale: പെട്ടെന്നുള്ളതും ശക്തവുമായ മുന്നേറ്റത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത അധിക ഹിംസാതീവ്രത ചേർക്കുന്നില്ല.
- source_word: ὁμοθυμαδὸν
  choice: ഒറ്റക്കെട്ടായി
  rationale: സംഘത്തിന്റെ ഏകോപിതമായ പ്രവർത്തനവും പൊതുവായ ഉദ്ദേശ്യവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπ’ αὐτόν
  choice: അവന്റെ നേരെ
  rationale: ἐπί + കർമകാരക രൂപം ഇവിടെ ഒരാളിലേക്കു ലക്ഷ്യമിട്ടുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ശത്രുതാപരമായ മുന്നേറ്റത്തിന്റെ ദിശ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഇംഗ്ലീഷ് പാഠത്തിൽ [a] അടയാളം ‘with a loud voice’ എന്നതിനുശേഷം വന്നിട്ടുണ്ടെങ്കിലും അടിക്കുറിപ്പ് ὁμοθυμαδόν എന്ന പദത്തെക്കുറിച്ചായതിനാൽ, മൂലഭാഷാ തെളിവനുസരിച്ച് അടയാളം ‘ഒറ്റക്കെട്ടായി’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
