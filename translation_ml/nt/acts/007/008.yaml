id: ACT.7.8
reference: Acts 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: ml
  text: അവൻ അബ്രാഹാമിന് പരിച്ഛേദനയുടെ ഉടമ്പടി നൽകി. അങ്ങനെ അബ്രാഹാം യിസ്ഹാക്കിനെ ജനിപ്പിച്ചു; എട്ടാം ദിവസം അവനെ പരിച്ഛേദനം ചെയ്തു. യിസ്ഹാക്ക് യാക്കോബിനെ ജനിപ്പിച്ചു; യാക്കോബ് പന്ത്രണ്ട് ഗോത്രപിതാക്കന്മാരെ ജനിപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: പരിച്ഛേദനയുടെ ഉടമ്പടി
  rationale: διαθήκη എന്നതിന് ഈ ബൈബിൾചരിത്രസന്ദർഭത്തിൽ ‘ഉടമ്പടി’ യോജിക്കുന്നു. περιτομῆς എന്ന ജനിറ്റീവ് പരിച്ഛേദനയാൽ സവിശേഷമാക്കപ്പെട്ട ഉടമ്പടിയെ സൂചിപ്പിക്കുന്നു.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: ഉടമ്പടി നൽകിയതും തുടർന്നുള്ള സംഭവങ്ങളും തമ്മിലുള്ള അനുക്രമ/ഫലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγέννησεν
  choice: ജനിപ്പിച്ചു
  rationale: പുരുഷവംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന γεννάωയുടെ സജീവവും സംക്ഷിപ്തവുമായ അർഥം നൽകുന്നു; പുരാതനശൈലിയിലുള്ള പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: περιέτεμεν
  choice: പരിച്ഛേദനം ചെയ്യുകയും ചെയ്തു
  rationale: περιτέμνωയുടെ നേരിട്ടുള്ള അർഥം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: എട്ടാം ദിവസം
  rationale: കാലസൂചകമായ ദത്തിവ് പ്രയോഗത്തെ അധികവിവരം ചേർക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: πατριάρχας
  choice: ഗോത്രപിതാക്കന്മാർ
  rationale: ഇസ്രായേലിന്റെ പന്ത്രണ്ട് ഗോത്രങ്ങളുടെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്ന πατριάρχης എന്ന പദത്തിന്റെ ചരിത്രപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: യിസ്ഹാക്ക് / യാക്കോബ്
  rationale: മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ പേരുരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനോടുള്ള ഉടമ്പടിയുടെ നിർദിഷ്ടത
  choice: പരിച്ഛേദനയുടെ ഉടമ്പടി
  alternative: പരിച്ഛേദന സംബന്ധിച്ച ഒരു ഉടമ്പടി
  rationale: ഉല്പത്തി 17-ൽ വിവരിക്കുന്ന തിരിച്ചറിയാവുന്ന പ്രത്യേക ഉടമ്പടിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ നിർദിഷ്ടത നിലനിർത്തുന്നു.
- issue: γεννάωയുടെ വംശാവലിപരമായ അർഥം
  choice: ജനിപ്പിച്ചു
  alternative: പിതാവായി
  rationale: ഗ്രീക്കിലെ സജീവമായ പുരുഷവംശപരമ്പരാപ്രയോഗം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- issue: ആദ്യത്തെ സർവനാമങ്ങളുടെ വ്യക്തത
  choice: അവൻ അബ്രാഹാമിന് … അങ്ങനെ അബ്രാഹാം
  alternative: അവന് … അങ്ങനെ അവൻ
  rationale: മുൻവാക്യത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദ്യ സർവനാമത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട്, ഒരേ വാക്യത്തിൽ കർത്താവ് മാറുന്നിടത്ത് അബ്രാഹാമിന്റെ പേര് വ്യക്തമാക്കുന്നു. ഇതിലൂടെ ദൈവം യിസ്ഹാക്കിനെ ജനിപ്പിച്ചു എന്ന തെറ്റായ വായന ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്കിലെ വംശാവലിപരമായ സംക്ഷിപ്തത നിലനിർത്തുന്നു; എന്നാൽ കർത്താവ് മാറുന്നിടത്ത് ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അബ്രാഹാം’ വ്യക്തമാക്കിയിരിക്കുന്നു.
