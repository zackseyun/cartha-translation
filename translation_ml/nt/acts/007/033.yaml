id: ACT.7.33
reference: Acts 7:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: ml
  text: 'അപ്പോൾ കർത്താവ് അവനോടു പറഞ്ഞു: “നിന്റെ കാലുകളിൽനിന്ന് ചെരിപ്പ് ഊരിമാറ്റുക[a]. എന്തെന്നാൽ, നീ നിൽക്കുന്ന സ്ഥലം വിശുദ്ധ നിലമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിന്റെ കാലുകളിൽനിന്ന് ചെരിപ്പ് അഴിക്കുക.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പതിവായ ആദരപൂർവ മലയാള പരിഭാഷയാണ് ‘കർത്താവ്’. ഗ്രീക്കിൽ ദൈവനാമം നേരിട്ട് ഇല്ലാത്തതിനാൽ പ്രത്യേക ദൈവനാമരൂപം ചേർത്തിട്ടില്ല.
- source_word: Λῦσον
  choice: ഊരിമാറ്റുക
  rationale: λύω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘അഴിക്കുക’ എന്നാണെങ്കിലും, പാദരക്ഷയുടെ സന്ദർഭത്തിൽ ഉദ്ദേശ്യം അത് നീക്കുക എന്നതാണ്. ‘ഊരിമാറ്റുക’ ആജ്ഞയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ὑπόδημα
  choice: ചെരിപ്പ്
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കൂട്ടാർഥമുള്ള ഏകവചനമായ ‘ചെരിപ്പ്’ എന്നു നിലനിർത്തുന്നു; ബഹുവചനമാക്കി പരിചിതരൂപത്തോട് സമന്വയിപ്പിച്ചിട്ടില്ല.
- source_word: τῶν ποδῶν σου
  choice: നിന്റെ കാലുകളിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ‘കാലുകൾ’ എന്ന ബഹുവചനവും ἀπόയുടെ വേർപാട് സൂചിപ്പിക്കുന്ന അർഥവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὁ γὰρ τόπος
  choice: എന്തെന്നാൽ, ... സ്ഥലം
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നും τόπος എന്നത് ‘സ്ഥലം’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: നീ നിൽക്കുന്ന
  rationale: ἐπίയോടുകൂടിയ ബന്ധസർവനാമവും ഇപ്പോഴുള്ള നില സൂചിപ്പിക്കുന്ന ἕστηκας എന്ന പൂർണകാലരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായി ‘നീ നിൽക്കുന്ന’ എന്നു നൽകുന്നു.
- source_word: γῆ ἁγία
  choice: വിശുദ്ധ നിലം
  rationale: ഇവിടെ γῆ ഒരു പ്രാദേശിക ഭൂപ്രദേശത്തെയല്ല, മോശെ നിൽക്കുന്ന നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘വിശുദ്ധ ഭൂമി’ എന്നതിനെക്കാൾ ‘വിശുദ്ധ നിലം’ സന്ദർഭത്തിന് കൃത്യമാണ്.
theological_decisions:
- issue: പുറപ്പാട് പുസ്തകത്തിലെ ദൈവപ്രത്യക്ഷത ഉദ്ധരിക്കുന്ന ഭാഗത്ത് κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ / ചെറിയ അക്ഷരവ്യത്യാസത്തോടെ പ്രത്യേക ‘കർത്താവ്’ രൂപം
  rationale: ഈ പുതിയനിയമ ഗ്രീക്ക് വാക്യത്തിൽ κύριος മാത്രമാണുള്ളത്; ദൈവനാമമായ ചതുരക്ഷരി നേരിട്ട് ഇല്ല. അതിനാൽ മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു, അതേസമയം ദൈവിക ആദരവും തിരുവെഴുത്തിലെ തുടർച്ചയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഏകവചനമായ ‘ചെരിപ്പ്’ ഗ്രീക്ക് രൂപം സംരക്ഷിക്കുന്നു; ‘വിശുദ്ധ നിലം’ പ്രാദേശിക ground എന്ന അർഥം വ്യക്തമാക്കുന്നു.
