  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: ml
  text: എന്നാൽ പരിശുദ്ധാത്മാവു നിറഞ്ഞവനായിരുന്ന അവൻ സ്വർഗത്തിലേക്ക് ഉറ്റുനോക്കി[a], ദൈവത്തിന്റെ മഹിമയും ദൈവത്തിന്റെ വലതുഭാഗത്ത് നിൽക്കുന്ന യേശുവിനെയും കണ്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശ്രദ്ധയോടെ സ്വർഗത്തിലേക്ക് നോക്കി.”
    reason: lexical_alternative
  - marker: b
    text: “ദൈവത്തിന്റെ വലതുഭാഗത്ത്” എന്നത് പരമോന്നത ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനം സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων
  choice: നിറഞ്ഞവനായിരുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സ്തെഫാനൊസിന്റെ തുടർന്നുനിൽക്കുന്ന അവസ്ഥയെ മുഖ്യപ്രവൃത്തിക്കു പശ്ചാത്തലമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: πλήρης πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞവൻ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന ഗ്രന്ഥസന്ദർഭത്തിൽ ദൈവിക വ്യക്തിയായ പരിശുദ്ധാത്മാവിനാൽ പൂർണമായി നിറഞ്ഞ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗമാണിത്.
- source_word: ἀτενίσας
  choice: ഉറ്റുനോക്കി
  rationale: ശ്രദ്ധ കേന്ദ്രീകരിച്ചുള്ള തീവ്രമായ നോട്ടം സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: ദർശനാത്മകമായ ഈ സന്ദർഭത്തിൽ οὐρανός വെറും ആകാശത്തെയല്ല, സ്വർഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἶδεν
  choice: കണ്ടു
  rationale: മുഖ്യക്രിയയുടെ നേരിട്ടുള്ളതും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: δόξαν θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വം
  rationale: ദൈവത്തിന്റെ പ്രത്യക്ഷമായ തേജസ്സും മഹിമയും സൂചിപ്പിക്കുന്ന പ്രയോഗം; ‘മഹത്ത്വം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: മലയാളത്തിലെ അംഗീകൃത നാമരൂപം ഉപയോഗിച്ചു; വാക്യത്തിലെ വിഭക്തിക്കനുസരിച്ച് ‘യേശുവിനെയും’ എന്നു രൂപപ്പെടുത്തി.
- source_word: ἑστῶτα
  choice: നിൽക്കുന്ന
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണകാല കൃദന്തം യേശുവിന്റെ നിൽക്കുന്ന നിലയെ സജീവമായി ചിത്രീകരിക്കുന്നു.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വലതുഭാഗത്ത്
  rationale: ἐκ δεξιῶν എന്ന സ്ഥാനസൂചക പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും ബൈബിൾപ്രതീകം നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ ജനക്കൂട്ടത്തിന്റെ ശത്രുതയോടുള്ള ലഘുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിലെ ദൈവിക വ്യക്തിസൂചന
  choice: പരിശുദ്ധാത്മാവ്
  alternative: വിശുദ്ധമായ ആത്മാവ് / വിശുദ്ധ മനോഭാവം
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന ഗ്രന്ഥത്തിലെ പ്രയോഗവും ഉടനടിയുള്ള സന്ദർഭവും ഇവിടെ ഒരു മനോഭാവത്തെയോ നിർവ്യക്ത ശക്തിയെയോ അല്ല, പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: ദൈവത്തിന്റെ വലതുഭാഗത്ത് യേശു നിൽക്കുന്ന ദർശനം
  choice: ദൈവത്തിന്റെ വലതുഭാഗത്ത് നിൽക്കുന്ന യേശു
  alternative: ദൈവത്തിന്റെ വലത്തുനിന്ന് നിൽക്കുന്ന യേശു
  rationale: ഈ പരിഭാഷ ദൈവത്തെയും യേശുവിനെയും വാക്യത്തിൽ വേർതിരിച്ചുതന്നെ നിലനിർത്തുകയും, ബഹുമാനവും അധികാരവും സൂചിപ്പിക്കുന്ന വലതുഭാഗം എന്ന ബൈബിൾപ്രതീകം പരാവർത്തനം ചെയ്ത് ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ദർശനത്തിന്റെ സജീവത നിലനിർത്താൻ ‘ഉറ്റുനോക്കി’, ‘നിൽക്കുന്ന’ എന്നീ നേരിട്ടുള്ള രൂപങ്ങൾ തെരഞ്ഞെടുത്തു; സാങ്കേതികമോ സഭാവിഭാഗവിശേഷമായോ ഉള്ള പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
