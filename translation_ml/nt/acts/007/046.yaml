    issue: ‘അനുവാദം ചോദിച്ചു’ adds the idea of permission.
    rationale: The Greek ᾐτήσατο means ‘asked/requested’; it does not specify that David asked God for authorization. ‘അഭ്യർഥിച്ചു’ conveys a request without introducing that additional implication.
