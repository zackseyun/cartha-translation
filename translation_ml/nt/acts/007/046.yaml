- from: അവൻ ദൈവസന്നിധിയിൽ പ്രീതി നേടി; യാക്കോബിന്റെ ദൈവത്തിനായി ഒരു വാസസ്ഥലം കണ്ടെത്താൻ അനുവാദം ചോദിച്ചു.[a]
