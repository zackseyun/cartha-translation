id: ACT.7.6
reference: Acts 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: ml
  text: 'എന്നാൽ ദൈവം ഇപ്രകാരം പറഞ്ഞു: “അവന്റെ സന്തതി അന്യദേശത്ത് പരദേശിയായി പാർക്കും; അവർ ആ സന്തതിയെ അടിമയാക്കുകയും നാനൂറു വർഷം പീഡിപ്പിക്കുകയും ചെയ്യും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സംസാരഭാഷാസ്വാഭാവികമായി: “അവന്റെ പിൻതലമുറക്കാർ അന്യദേശത്ത് പരദേശികളായി പാർക്കും; അവർ അവരെ അടിമയാക്കി നാനൂറു വർഷം പീഡിപ്പിക്കും.” ഗ്രീക്കിൽ “സന്തതി ... അതിനെ” എന്ന കൂട്ടാർഥ ഏകവചനമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: എന്നാൽ ദൈവം ഇപ്രകാരം പറഞ്ഞു
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ ആശയമാറ്റം ‘എന്നാൽ’ എന്നു നിലനിർത്തുന്നു; οὕτως വ്യക്തമായി ‘ഇപ്രകാരം’ എന്നും ἐλάλησεν സാധാരണവും മാന്യവുമായ ‘പറഞ്ഞു’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: അവന്റെ സന്തതി
  rationale: σπέρμα ഇവിടെ അബ്രാഹാമിന്റെ പിൻതലമുറയെ സൂചിപ്പിക്കുന്ന ഏകവചന കൂട്ടനാമമാണ്. ‘സന്തതി’ ആ കൂട്ടാർഥവും ഏകവചനരൂപവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: അന്യദേശത്ത് പരദേശിയായി പാർക്കും
  rationale: πάροικος സ്വന്തം നാടല്ലാത്തിടത്ത് അവകാശമില്ലാതെ താമസിക്കുന്ന വിദേശവാസിയെ സൂചിപ്പിക്കുന്നു; ἀλλοτρία ‘മറ്റൊരാളുടേത്/അന്യമായത്’ എന്ന ആശയം നൽകുന്നു. ഈ മലയാളപ്രയോഗം താമസവും അന്യത്വവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: δουλώσουσιν αὐτὸ
  choice: അവർ ആ സന്തതിയെ അടിമയാക്കുകയും
  rationale: δουλόω എന്നതിന്റെ അടിമത്തത്തിലാക്കുക എന്ന ശക്തമായ അർഥം ‘അടിമയാക്കുക’ നിലനിർത്തുന്നു. αὐτό എന്ന ഏകവചന സർവനാമത്തിന്റെ കൂട്ടാർഥം അസ്വാഭാവികമായ ‘അതിനെ’ ഒഴിവാക്കി ‘ആ സന്തതിയെ’ എന്ന് ആവർത്തിച്ച് സംരക്ഷിച്ചു.
- source_word: κακώσουσιν
  choice: പീഡിപ്പിക്കുകയും ചെയ്യും
  rationale: κακόω ഇവിടെ ദോഷം ചെയ്യുക, കഷ്ടപ്പെടുത്തുക, മോശമായി പെരുമാറുക എന്നീ വിശാല അർഥങ്ങൾ വഹിക്കുന്നു; ചരിത്രസന്ദർഭത്തിലെ ദീർഘകാല കഷ്ടതയെ ‘പീഡിപ്പിക്കുക’ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἔτη τετρακόσια
  choice: നാനൂറു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് accusative മലയാളത്തിൽ മുൻപ്രത്യയമില്ലാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ സന്തതിയെക്കുറിച്ചുള്ള കൂട്ടാർഥ ഏകവചനം
  choice: ‘സന്തതി ... ആ സന്തതിയെ’ എന്ന ഏകവചന കൂട്ടനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘പിൻതലമുറക്കാർ ... അവരെ’ എന്ന സ്വാഭാവിക ബഹുവചനം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ τὸ σπέρμα ... αὐτό ഏകവചനരൂപത്തിലുള്ള കൂട്ടാർഥപ്രയോഗമാണ്. വാഗ്ദാനപരമ്പരയിലെ ഈ ശ്രദ്ധേയമായ ഭാഷ മായ്ച്ചുകളയാതെ, മലയാളത്തിൽ മനുഷ്യരെ ‘അത്’ എന്നു വിളിക്കുന്ന അസ്വാഭാവികത ഒഴിവാക്കാൻ നാമം ആവർത്തിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘അരുളിച്ചെയ്തു’ എന്ന കൂടുതൽ ആരാധനാഭാഷാപരമായ പദത്തിനുപകരം മൂലത്തിലെ സാധാരണ സംസാരക്രിയയ്ക്ക് ‘പറഞ്ഞു’ ഉപയോഗിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണിരൂപം മലയാളത്തിൽ ഭാവികാലബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
