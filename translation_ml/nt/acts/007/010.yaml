id: ACT.7.10
reference: Acts 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: ml
  text: അവന്റെ എല്ലാ കഷ്ടതകളിൽനിന്നും അവനെ വിടുവിക്കുകയും[a], ഈജിപ്തിന്റെ രാജാവായ ഫറവോന്റെ മുമ്പാകെ അവന് പ്രീതിയും[b] ജ്ഞാനവും നൽകുകയും, അവനെ ഈജിപ്തിനും ഫറവോന്റെ മുഴുവൻ ഭവനത്തിനും മേൽ ഭരണാധികാരിയായി[c] നിയമിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ എല്ലാ ദുരിതങ്ങളിൽനിന്നും അവനെ രക്ഷിക്കുകയും.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘പ്രീതി’ എന്നത് ഫറവോന്റെ ദൃഷ്ടിയിൽ ലഭിച്ച അനുകൂലമായ പരിഗണനയെ സൂചിപ്പിക്കുന്നു; ‘കൃപ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഈജിപ്തിനും ഫറവോന്റെ മുഴുവൻ ഭവനത്തിനും മേൽ അവനെ ഭരണാധിപനായി നിയമിക്കുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: വിടുവിച്ചു
  rationale: അപകടത്തിൽനിന്നോ ദുരിതത്തിൽനിന്നോ സജീവമായി മോചിപ്പിക്കുക എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: θλίψεων
  choice: കഷ്ടതകൾ
  rationale: യോസേഫ് അനുഭവിച്ച സമ്മർദങ്ങളും ദുരിതങ്ങളും കഷ്ടപ്പാടുകളും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: χάριν
  choice: പ്രീതി
  rationale: ഇവിടെ ദൈവശാസ്ത്രപരമായ സാങ്കേതിക അർഥത്തേക്കാൾ ഫറവോന്റെ അനുകൂലമായ പരിഗണനയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: σοφίαν
  choice: ജ്ഞാനം
  rationale: ഫറവോൻ തിരിച്ചറിഞ്ഞ പ്രായോഗിക വിവേകവും ജ്ഞാനവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐναντίον
  choice: മുമ്പാകെ
  rationale: ഒരാളുടെ സന്നിധിയിലും ദൃഷ്ടിയിലും എന്ന ആശയം സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατέστησεν
  choice: നിയമിച്ചു
  rationale: അധികാരസ്ഥാനത്ത് ഔദ്യോഗികമായി ആക്കുക എന്ന ക്രിയയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἡγούμενον
  choice: ഭരണാധികാരി
  rationale: ഭരിക്കുന്നവൻ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ആധുനിക ബ്യൂറോക്രാറ്റിക് പദവിയെന്ന പരിമിതി ഒഴിവാക്കുന്നു.
- source_word: ἐπ’ Αἴγυπτον
  choice: ഈജിപ്തിനു മേൽ
  rationale: അധികാരം പ്രയോഗിക്കുന്ന മേഖലയെ സൂചിപ്പിക്കുന്ന ἐπίയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: ഫറവോന്റെ മുഴുവൻ ഭവനം
  rationale: οἶκος ഭൗതിക കെട്ടിടത്തെക്കാൾ രാജാവിന്റെ കുടുംബവും ഗൃഹകാര്യസംവിധാനവും ഉൾപ്പെടുന്ന അധികാരമേഖലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സർവനാമം യോസേഫിനെ സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ സന്ദർഭത്തിൽ വ്യക്തമായ ഫറവോന്റെ പേര് ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: വാക്യത്തിലെ ക്രിയകളുടെ അപ്രകടമായ കർത്താവ്
  choice: മലയാളത്തിലും ദൈവം എന്ന കർത്താവിനെ പ്രത്യേകം ചേർക്കാതെ മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന വിധത്തിൽ ക്രിയകൾ ഏകോപിപ്പിച്ചു.
  alternative: ‘ദൈവം’ എന്ന് വ്യക്തമായി ചേർക്കുക.
  rationale: ഗ്രീക്കിൽ ദൈവം ഈ വാക്യത്തിൽ വീണ്ടും പേരെടുത്ത് പറയുന്നില്ല; പ്രവൃത്തികൾ 7:9-ലെ ദൈവത്തെ സ്വാഭാവികമായി തുടർന്നുകാട്ടുന്നു. പേര് ചേർക്കാതിരിക്കുന്നത് മൂലപാഠത്തിന്റെ ശൈലിയും സന്ദർഭബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: ὅλον τὸν οἶκον αὐτοῦ എന്നതിലെ αὐτοῦയുടെ സൂചിതവ്യക്തി
  choice: ഫറവോന്റെ മുഴുവൻ ഭവനം
  alternative: അവന്റെ മുഴുവൻ ഭവനം
  rationale: അധികാരനിയമനത്തിന്റെ ഉല്പത്തി 41 പശ്ചാത്തലത്തിലും അടുത്ത പ്രസക്ത നാമമായ ഫറവോനോടുള്ള ബന്ധത്തിലും ഇത് ഫറവോന്റെ ഭവനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവന്റെ’ എന്നത് യോസേഫിനെ സൂചിപ്പിക്കുന്നതായി എളുപ്പം തെറ്റിദ്ധരിക്കപ്പെടുന്നതിനാൽ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് ഏകോപിതവാക്യത്തിന്റെ ഘടന ‘വിടുവിക്കുകയും… നൽകുകയും… നിയമിക്കുകയും ചെയ്തു’ എന്ന ക്രമത്തിൽ നിലനിർത്തി. മതവിഭാഗവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
