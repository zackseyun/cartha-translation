  terminology: ‘രേഫാൻ ദേവന്റെ’ ഗ്രീക്കിലെ τοῦ θεοῦ Ῥαιφάν-നോട് യോജിക്കുന്നു; ‘നിങ്ങളുടെ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. ‘രൂപങ്ങൾ’ τύπους-ന്റെ തുറന്ന അർഥപരിധി നിലനിർത്തുന്നു. പേരുകളുടെ ലിപ്യന്തരണവും ഉചിതമാണ്.
