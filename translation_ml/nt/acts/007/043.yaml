id: ACT.7.43
reference: Acts 7:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: ml
  text: നിങ്ങൾ മോലോക്കിന്റെ കൂടാരവും രേഫാൻ ദേവന്റെ നക്ഷത്രവും[a]—അവയെ ആരാധിക്കാനായി നിങ്ങൾ ഉണ്ടാക്കിയ രൂപങ്ങളും[b]—എടുത്തുചുമന്നു. ഞാൻ നിങ്ങളെ ബാബിലോണിനപ്പുറത്തേക്ക് നാടുകടത്തും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആമോസ് 5:26-ലെ എബ്രായ സ്രോതസ്സിനെ പ്രതിഫലിപ്പിച്ച് ചില പരിഭാഷകൾ ഇവിടെ ‘നിങ്ങളുടെ ദേവനായ രേഫാന്റെ’ എന്നു വായിക്കുന്നു. എന്നാൽ പ്രവൃത്തികളിലെ ഗ്രീക്ക് പാഠം ‘രേഫാൻ ദേവന്റെ’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘രൂപങ്ങൾ’ എന്നതിന് ‘പ്രതിരൂപങ്ങൾ’ അല്ലെങ്കിൽ ‘ചിത്രരൂപങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: പ്രവൃത്തികളിലെ പാഠം ‘ബാബിലോണിനപ്പുറം’ എന്നാണ്. ഉദ്ധരിക്കപ്പെട്ട ആമോസ് 5:27 സാധാരണയായി ‘ദമാസ്കസിനപ്പുറം’ എന്നാണ് പരിഭാഷപ്പെടുത്തുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: എടുത്തുചുമന്നു
  rationale: ആരാധനയ്ക്കുള്ള വസ്തുക്കൾ എടുത്ത് വഹിച്ചതെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; വെറും ‘എടുത്തു’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമാക്കുന്നു, എന്നാൽ ഘോഷയാത്രയോ ദീർഘകാല സഞ്ചാരമോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: σκηνὴν
  choice: കൂടാരം
  rationale: σκηνήയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ‘തിരുനിവാസം’ എന്നു പറഞ്ഞാൽ ദൈവത്തിന്റെ നിയമാനുസൃത വിശുദ്ധമന്ദിരവുമായി തെറ്റിദ്ധാരണ ഉണ്ടാകാം; ‘ക്ഷേത്രം’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: Μολὸχ
  choice: മോലോക്ക്
  rationale: ഗ്രീക്ക് നാമരൂപമായ Μολόχ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: ἄστρον
  choice: നക്ഷത്രം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; വിഗ്രഹാരാധനാസന്ദർഭം കണക്കിലെടുത്ത് ‘നക്ഷത്രചിഹ്നം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: രേഫാൻ ദേവന്റെ
  rationale: പ്രവൃത്തികളിലെ ഗ്രീക്ക് പാഠത്തിലുള്ള ‘രേഫാൻ ദേവന്റെ’ എന്ന ഘടന പിന്തുടരുന്നു; ആമോസിലെ ‘നിങ്ങളുടെ ദേവൻ’ എന്ന വായന മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: Ῥαιφάν
  choice: രേഫാൻ
  rationale: പ്രവൃത്തികളിലെ ഗ്രീക്ക് നാമരൂപത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: τύπους
  choice: രൂപങ്ങൾ
  rationale: τύπος എന്ന പദത്തിന്റെ ‘രൂപം/പ്രതിരൂപം’ എന്ന അർഥം നിലനിർത്തുന്നു. ‘വിഗ്രഹങ്ങൾ’ സന്ദർഭത്തിന് യോജിച്ചാലും ഗ്രീക്കിനേക്കാൾ നിർവചനാത്മകമായതിനാൽ ഒഴിവാക്കി.
- source_word: ἐποιήσατε
  choice: നിങ്ങൾ ഉണ്ടാക്കിയ
  rationale: വസ്തുക്കൾ അവർതന്നെ നിർമിച്ചതെന്ന നേരിട്ടുള്ള കുറ്റാരോപണം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: προσκυνεῖν αὐτοῖς
  choice: അവയെ ആരാധിക്കാനായി
  rationale: മതപരമായ സന്ദർഭത്തിൽ προσκυνέωയ്ക്ക് ‘ആരാധിക്കുക’ സ്വാഭാവികമാണ്. αὐτοῖς സൂചിപ്പിക്കുന്ന ബഹുവചന വസ്തുക്കളെ ‘അവയെ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: μετοικιῶ
  choice: നാടുകടത്തും
  rationale: ബലപ്രയോഗത്തോടെയുള്ള ദേശാന്തരവാസം/പ്രവാസം സൂചിപ്പിക്കുന്ന ഭാവികാല ക്രിയയുടെ ന്യായവിധിസ്വരം സംക്ഷിപ്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: ബാബിലോണിനപ്പുറത്തേക്ക്
  rationale: പ്രവൃത്തികളുടെ ഗ്രീക്ക് പാഠത്തിലെ സ്ഥലനാമവും ‘അപ്പുറം’ എന്ന ദിശാസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്തെഫാനൊസ് ഉദ്ധരിക്കുന്ന ആമോസ് ഭാഗത്തിലെ പ്രവാസലക്ഷ്യം മൂലപാരമ്പര്യത്തിൽ വ്യത്യസ്തമായി കാണപ്പെടുന്നത്
  choice: ബാബിലോണിനപ്പുറത്തേക്ക്
  alternative: ദമാസ്കസിനപ്പുറത്തേക്ക്
  rationale: പ്രവൃത്തികൾ 7:43-ന്റെ ഗ്രീക്ക് പാഠം Βαβυλῶνος എന്നു വ്യക്തമായി വായിക്കുന്നു. അതിനാൽ ആമോസ് 5:27-നോട് സമരസപ്പെടുത്താതെ പ്രവൃത്തികളിലെ വായന മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും വ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്തു.
- issue: രേഫാനെ വിശേഷിപ്പിക്കുന്ന ഉടമസ്ഥപ്രയോഗം
  choice: രേഫാൻ ദേവന്റെ
  alternative: നിങ്ങളുടെ ദേവനായ രേഫാന്റെ
  rationale: പ്രവൃത്തികളിലെ ഗ്രീക്ക് പാഠം τοῦ θεοῦ Ῥαιφάν (‘രേഫാൻ ദേവന്റെ’) എന്നാണ്; ആമോസ് 5:26-ലെ എബ്രായ സ്രോതസ്സിനെ പ്രതിഫലിപ്പിക്കുന്ന ‘നിങ്ങളുടെ ദേവൻ’ എന്ന വായന മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വിഗ്രഹാരാധനാസന്ദർഭം വ്യക്തമാക്കിയെങ്കിലും ‘കൂടാരം,’ ‘നക്ഷത്രം,’ ‘രൂപങ്ങൾ’ എന്നീ ഗ്രീക്ക് പദങ്ങളുടെ തുറന്ന അർഥപരിധി നിലനിർത്തി. ദൈർഘ്യമേറിയ വാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ വിശദീകരണഘടകത്തെ ഡാഷുകൾക്കുള്ളിൽ നൽകി.
