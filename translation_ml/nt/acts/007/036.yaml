id: ACT.7.36
reference: Acts 7:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: ml
  text: ഇദ്ദേഹം ഈജിപ്തുദേശത്തും ചെങ്കടലിലും[a] മരുഭൂമിയിൽ നാൽപ്പതു വർഷക്കാലവും അത്ഭുതങ്ങളും അടയാളങ്ങളും പ്രവർത്തിച്ച് അവരെ പുറത്തേക്കു നയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാങ്ങണക്കടൽ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്. എന്നാൽ ഇവിടെ ഗ്രീക്കുപാഠത്തിൽ ‘ചെങ്കടൽ’ (Ἐρυθρὰ Θάλασσα) എന്നാണ്; പുതിയനിയമത്തിലും ഗ്രീക്ക് പഴയനിയമത്തിലും ഇസ്രായേൽ കടന്ന സ്ഥലത്തിന് ഉപയോഗിക്കുന്ന പതിവുപേരാണിത്.
    reason: എബ്രായ പശ്ചാത്തലത്തെ പ്രതിഫലിപ്പിക്കുന്ന മറ്റൊരു പേരറിയിക്കുമ്പോഴും ഗ്രീക്കുപാഠത്തിന്റെ നേരിട്ടുള്ള അർഥം വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: οὗτος
  choice: ഇദ്ദേഹം
  rationale: മോശയെ ചൂണ്ടിക്കാണിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു; ‘അവൻ’ എന്നതിനെക്കാൾ പ്രകടവും, മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമാണ്.
- source_word: ἐξήγαγεν αὐτούς
  choice: അവരെ പുറത്തേക്കു നയിച്ചു
  rationale: പുറത്തുകൊണ്ടുവരുക, നയിച്ചുകൊണ്ടുപോകുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന ക്രിയയുടെ പുറപ്പാട്-സന്ദർഭത്തിലെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ποιήσας
  choice: പ്രവർത്തിച്ച്
  rationale: പ്രധാനക്രിയയോടു ചേർന്നുള്ള ഗ്രീക്ക് കൃദന്തരൂപത്തിന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τέρατα καὶ σημεῖα
  choice: അത്ഭുതങ്ങളും അടയാളങ്ങളും
  rationale: വിസ്മയം ഉളവാക്കുന്ന പ്രവൃത്തികളും അവ സൂചിപ്പിക്കുന്ന പ്രാമാണിക അർഥവും തമ്മിലുള്ള ലൂക്കോസിന്റെ പതിവായ പദജോടി വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: ഈജിപ്തുദേശത്തും
  rationale: γῇ എന്ന ‘ദേശം’ ഘടകം സംരക്ഷിക്കുകയും തുടർന്നുള്ള സ്ഥലപരമ്പരയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: ചെങ്കടലിലും[a]
  rationale: ഗ്രീക്കിലെ സ്ഥാപിതമായ ‘ചെങ്കടൽ’ എന്ന പേരും ആവർത്തിക്കുന്ന ἐν എന്ന സ്ഥലസൂചനയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα
  choice: മരുഭൂമിയിൽ നാൽപ്പതു വർഷക്കാലവും
  rationale: ഇസ്രായേലിന്റെ മരുഭൂപ്രയാണത്തെ സൂചിപ്പിക്കുന്ന പതിവായ ഭാഷയും കാലദൈർഘ്യവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: പുറപ്പാടിൽ മോശയുടെ പങ്കും അത്ഭുതപ്രവൃത്തികളുടെ കർത്തൃത്വവും
  choice: മോശയെ ഊന്നിപ്പറയുന്ന ‘ഇദ്ദേഹം’ നിലനിർത്തി, അവൻ ജനത്തെ നയിക്കുകയും അത്ഭുതങ്ങളും അടയാളങ്ങളും പ്രവർത്തിക്കുകയും ചെയ്തതായി വാക്യത്തിന്റെ വ്യാകരണരൂപം അതേപടി അവതരിപ്പിച്ചു.
  alternative: ദൈവം മോശയിലൂടെ ഇവ ചെയ്തുവെന്ന് മുഖ്യവാക്യത്തിൽ വിശദീകരിക്കുക, അല്ലെങ്കിൽ ‘അവൻ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി ഊന്നൽ കുറയ്ക്കുക.
  rationale: വാക്യം മോശയെ മനുഷ്യപ്രതിനിധിയായി നേരിട്ട് അവതരിപ്പിക്കുന്നു; ദൈവിക കർത്തൃത്വത്തെക്കുറിച്ചുള്ള വിശാലമായ തിരുവെഴുത്തുസന്ദർഭം നിഷേധിക്കാതെയും ഇവിടെ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെയും ഈ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ഇദ്ദേഹം’ പ്രസംഗത്തിലെ ചൂണ്ടിക്കാണിക്കൽ-ഊന്നൽ നൽകുന്നു; ‘ഈ മോശ’ എന്ന് പേര് ചേർത്ത് മൂലപാഠത്തെ വിപുലീകരിച്ചിട്ടില്ല. സ്ഥലസൂചനകളിലെ ആവർത്തനബന്ധം ‘-ത്തും/-ലും’ രൂപങ്ങളിലൂടെ നിലനിർത്തി.
