source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: ml
  text: പിന്നെ യോസേഫ് ആളയച്ച് തന്റെ പിതാവായ യാക്കോബിനെയും എല്ലാ ബന്ധുക്കളെയും വിളിച്ചുവരുത്തി; ആകെ എഴുപത്തഞ്ചുപേർ[a] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പഴയനിയമ ഭാഗങ്ങളിൽ ആകെ സംഖ്യ ‘എഴുപത്’ എന്നാണ് (ഉദാഹരണത്തിന്, ഉല്പത്തി 46:27-ന്റെയും പുറപ്പാട് 1:5-ന്റെയും എബ്രായ പാഠം); ഇവിടെ പ്രവൃത്തികൾ ‘എഴുപത്തഞ്ച്’ എന്നാണ് പറയുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: ആളയച്ച്
  rationale: പ്രധാന ക്രിയയ്ക്കുമുമ്പുള്ള അയയ്ക്കൽപ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു; ഗ്രീക്കിൽ അയച്ചത് ആരെയെന്നോ എന്തെന്നോ വ്യക്തമല്ലാത്തതിനാൽ അതു കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: പിന്നെ
  rationale: വിവരണത്തിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: μετεκαλέσατο
  choice: വിളിച്ചുവരുത്തി
  rationale: ആരെങ്കിലും തന്റെ അടുക്കൽ വരാൻ വിളിപ്പിക്കുക അഥവാ ആളയച്ചുവരുത്തുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: തന്റെ പിതാവായ യാക്കോബിനെ
  rationale: ബന്ധം വ്യക്തമായി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടന ഉപയോഗിക്കുന്നു.
- source_word: πᾶσαν τὴν συγγένειαν
  choice: എല്ലാ ബന്ധുക്കളെയും
  rationale: συγγένεια സൂചിപ്പിക്കുന്ന മുഴുവൻ ബന്ധുഗണത്തെയും ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു; ‘കുടുംബം’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കാം.
- source_word: ἐν ψυχαῖς
  choice: ആകെ ... പേർ
  rationale: അക്ഷരാർഥമായ ‘ആത്മാക്കൾ’ എന്നതിനു പകരം വ്യക്തികളെ എണ്ണുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἑβδομήκοντα πέντε
  choice: എഴുപത്തഞ്ച്
  rationale: ഗ്രീക്ക് സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions:
- issue: ഉല്പത്തി പാരമ്പര്യങ്ങളുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ യാക്കോബിന്റെ ബന്ധുഗണത്തിന്റെ ആകെ സംഖ്യ
  choice: ആകെ എഴുപത്തഞ്ചുപേർ
  alternative: ആകെ എഴുപതുപേർ
  rationale: പ്രവൃത്തികളുടെ ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘എഴുപത്തഞ്ച്’ എന്നു പറയുന്നു. ചില പഴയനിയമ എബ്രായ പാഠങ്ങളിൽ കാണുന്ന ‘എഴുപത്’ എന്ന സംഖ്യയുമായി സമന്വയിപ്പിക്കാതെ, ഈ പാഠത്തിന്റെ വായന മുഖ്യവാക്യത്തിൽ നിലനിർത്തുകയും വ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന വിധത്തിലും തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവത്തോടെയും വിവർത്തനം ചെയ്തു. ‘ആളയച്ച് ... വിളിച്ചുവരുത്തി’ എന്ന പ്രയോഗം ഗ്രീക്ക് ക്രിയകളുടെ ക്രമവും വ്യത്യാസവും സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
