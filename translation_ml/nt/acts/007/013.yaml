id: ACT.7.13
reference: Acts 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ δευτέρῳ ⸀ἀνεγνωρίσθη Ἰωσὴφ τοῖς ἀδελφοῖς αὐτοῦ, καὶ φανερὸν ἐγένετο τῷ Φαραὼ τὸ ⸀γένος Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: ml
  text: രണ്ടാം പ്രാവശ്യം വന്നപ്പോൾ യോസേഫിനെ സഹോദരന്മാർ തിരിച്ചറിഞ്ഞു[a]; യോസേഫിന്റെ കുടുംബം ഫറവോന്നു വെളിവായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭത്തിൽ: ‘യോസേഫ് സഹോദരന്മാർക്കു സ്വയം വെളിപ്പെടുത്തി.’ ഗ്രീക്ക് ക്രിയ കർമണിപ്രയോഗത്തിലാണ്: ‘തിരിച്ചറിയപ്പെട്ടു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘കുടുംബം’ എന്നതിന് ‘ബന്ധുജനം’ എന്നോ ‘വംശം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: രണ്ടാം പ്രാവശ്യം വന്നപ്പോൾ
  rationale: ഗ്രീക്കിലെ പദപ്രയോഗം ‘രണ്ടാം അവസരത്തിൽ’ എന്നാണ്; സന്ദർഭത്തിൽ സഹോദരന്മാർ വീണ്ടും ഈജിപ്തിലേക്കു വന്നതാണ് ഉദ്ദേശ്യം. ‘വന്നപ്പോൾ’ എന്ന ചേർക്കൽ മലയാളത്തിൽ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀνεγνωρίσθη
  choice: തിരിച്ചറിഞ്ഞു
  rationale: 'ഗ്രീക്കിലെ ക്രിയ വ്യാകരണപരമായി കർമണിപ്രയോഗമാണ്: യോസേഫ് സഹോദരന്മാരാൽ തിരിച്ചറിയപ്പെട്ടു. മലയാളത്തിൽ ‘യോസേഫിനെ സഹോദരന്മാർ തിരിച്ചറിഞ്ഞു’ എന്നത് ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഉല്പത്തി വിവരണത്തിൽ യോസേഫ് തന്റെ വ്യക്തിത്വം വെളിപ്പെടുത്തിയെന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.'
- source_word: ἀδελφοῖς αὐτοῦ
  choice: സഹോദരന്മാർ
  rationale: ഉല്പത്തി വിവരണത്തിലെ യോസേഫിന്റെ ആൺസഹോദരന്മാരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: φανερὸν ἐγένετο
  choice: അറിവായി
  rationale: ഒരു കാര്യം ഒരാൾക്കു വെളിവാകുകയോ അറിയപ്പെടുകയോ ചെയ്യുന്നതിനെ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γένος Ἰωσήφ
  choice: യോസേഫിന്റെ കുടുംബത്തെക്കുറിച്ച്
  rationale: γένος ഇവിടെ യോസേഫിന്റെ ബന്ധുജനത്തെയോ കുടുംബത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കുടുംബം’ സാധാരണ വായനക്കാർക്കു വ്യക്തമാണ്; ‘വംശം’ എന്നത് സന്ദർഭത്തിൽ അനാവശ്യമായി വിശാലമോ തെറ്റിദ്ധരിപ്പിക്കുന്നതോ ആകാം.
- source_word: τῷ Φαραώ
  choice: ഫറവോനും
  rationale: ഫറവോനാണ് ഈ വിവരം അറിഞ്ഞത് എന്ന ദാതൃബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘-ഉം’ ആദ്യ ഉപവാക്യത്തോടുള്ള തുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: 'യോസേഫിന്റെ തിരിച്ചറിയൽ: കർമണിപ്രയോഗമോ സ്വയം വെളിപ്പെടുത്തലോ'
  choice: മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ കർമണിരൂപത്തോട് ചേർന്ന് ‘യോസേഫിനെ സഹോദരന്മാർ തിരിച്ചറിഞ്ഞു’ എന്നു നൽകി.
  alternative: ‘യോസേഫ് സഹോദരന്മാർക്കു തന്നെത്തന്നെ വെളിപ്പെടുത്തി.’
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം സംരക്ഷിക്കുമ്പോഴും ഉല്പത്തി 45-ലെ കഥാസന്ദർഭം സ്വയം വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു. ആ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി; പാഠത്തിൽ ഒറ്റ വ്യാഖ്യാനം നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു വ്യക്തവും ആരാധനാവായനയ്ക്കു യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും γένος എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
