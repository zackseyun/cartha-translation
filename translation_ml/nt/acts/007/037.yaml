id: ACT.7.37
reference: Acts 7:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: ml
  text: ഇസ്രായേൽമക്കളോട്[a], ‘ദൈവം നിങ്ങളുടെ സഹോദരന്മാരുടെ[b] ഇടയിൽനിന്ന് എന്നെപ്പോലെ ഒരു പ്രവാചകനെ[c] നിങ്ങൾക്കായി എഴുന്നേല്പിക്കും’ എന്നു പറഞ്ഞ മോശ ഇതുതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇസ്രായേലിന്റെ പുത്രന്മാരോട്’; ‘ഇസ്രായേൽജനത്തോട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നു പറയുന്നത് സഹഇസ്രായേല്യരെയാണ്; ഗ്രീക്കിൽ പദം പുല്ലിംഗ ബഹുവചനമാണ്.
    reason: cultural_note
  - marker: c
    text: ആവർത്തനം 18:15-ലെ പ്രതീക്ഷയും പ്രവൃത്തികളിൽ അത് യേശുവിനോട് പ്രയോഗിക്കുന്നതും കണക്കിലെടുത്ത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘ആ പ്രവാചകനെ’ എന്നും വായിക്കാം; എന്നാൽ ഗ്രീക്കിൽ ഇവിടെ ആർട്ടിക്കിൾ ഇല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: മോശ ഇതുതന്നെയാണ്
  rationale: οὗτός എന്നതിന്റെ ഊന്നലോടെയുള്ള തിരിച്ചറിയിക്കൽ ‘ഇതുതന്നെയാണ്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ആർട്ടിക്കിൾ മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ആ മോശ’ എന്നു നിർബന്ധിക്കുന്നില്ല.
- source_word: εἴπας
  choice: എന്നു പറഞ്ഞ
  rationale: മോശയെ വിശേഷിപ്പിക്കുന്ന aorist participle മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവാക്യഘടനയായി നൽകി.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: ഇസ്രായേൽമക്കളോട്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും സമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗം; മൂലത്തിലെ υἱοῖς എന്ന രൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: Προφήτην
  choice: ഒരു പ്രവാചകനെ
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത Προφήτην എന്ന പദത്തിന് നേരിട്ടുള്ള അനിശ്ചിത രൂപം; സന്ദർഭത്തിലെ ക്രിസ്തുസംബന്ധിയായ പ്രാധാന്യം മുഖ്യവാക്യത്തിൽ മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀναστήσει
  choice: എഴുന്നേല്പിക്കും
  rationale: ദൈവം ഒരു പ്രവാചകനെ ജനത്തിന്റെ ഇടയിൽനിന്ന് ഉയർത്തിക്കൊണ്ടുവരും എന്ന അർഥവും പ്രവൃത്തികളിലെ ആവർത്തിക്കുന്ന പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: നിങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: ἐκ + genitive സൂചിപ്പിക്കുന്ന കൂട്ടത്തിനകത്തുനിന്നുള്ള ഉറവിടം വ്യക്തമായി നൽകുന്നു; ദേശീയ-കുടുംബബന്ധത്തിന്റെ രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: ὡς ἐμέ
  choice: എന്നെപ്പോലെ
  rationale: മോശയോടുള്ള സാദൃശ്യം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തനം 18:15-ലെ ഉദ്ധരണിയുടെ മശീഹാസംബന്ധിയായ പ്രാധാന്യം
  choice: മുഖ്യവാക്യത്തിൽ ‘ഒരു പ്രവാചകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആ പ്രവാചകൻ’ എന്നു വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: പ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ ഈ വാക്ക് യേശുവിനോട് പ്രയോഗിക്കപ്പെടുന്നുവെങ്കിലും, ഇവിടെ Προφήτην ആർട്ടിക്കിൾ ഇല്ലാത്ത രൂപമാണ്. അതിനാൽ ക്രിസ്തുസംബന്ധിയായ വായന നിഷേധിക്കാതെയും മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെയും മൂലത്തിലെ വ്യാഖ്യാനസാധ്യത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഉദ്ധരണിയുടെ പ്രവചനസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
