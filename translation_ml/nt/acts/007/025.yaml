  to: ദൈവം മോശയുടെ കൈവഴി അവർക്കു വിടുതൽ നൽകുന്നുവെന്ന് തന്റെ സഹോദരന്മാർ[b] മനസ്സിലാക്കുന്നുണ്ടെന്ന് മോശ വിചാരിച്ചു; എന്നാൽ അവർ മനസ്സിലാക്കിയില്ല.[a]
