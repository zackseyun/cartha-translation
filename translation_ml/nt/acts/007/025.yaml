id: ACT.7.25
reference: Acts 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: ml
  text: ദൈവം മോശയുടെ കൈവഴി അവർക്കു വിടുതൽ നൽകുന്നുവെന്ന് തന്റെ സഹോദരന്മാർ[b] മനസ്സിലാക്കുന്നുണ്ടെന്ന് മോശ വിചാരിച്ചു; എന്നാൽ അവർ മനസ്സിലാക്കിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രക്ഷ.” ഗ്രീക്ക് പദത്തിന് രക്ഷ, വിടുതൽ, മോചനം എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ തൊട്ടടുത്ത സന്ദർഭം മോശ മുഖാന്തരം ഇസ്രായേലിനു ദൈവം നൽകുന്ന വിടുതലിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് മോശയുടെ സഹഇസ്രായേല്യരെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഇത് പുല്ലിംഗ ബഹുവചന ബന്ധുപദമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: വിചാരിച്ചു
  rationale: അപൂർണ്ണഭൂതകാലം പശ്ചാത്തലത്തിലുള്ള മോശയുടെ ധാരണയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപം സന്ദർഭത്തിൽ ആ അർഥം വഹിക്കുന്നു.
- source_word: συνιέναι / συνῆκαν
  choice: മനസ്സിലാക്കുമെന്ന് / മനസ്സിലാക്കിയില്ല
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനവും മോശയുടെ പ്രതീക്ഷയും ജനത്തിന്റെ യഥാർഥ പ്രതികരണവും തമ്മിലുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἀδελφοὺς
  choice: സഹോദരന്മാർ
  rationale: മോശയുടെ സഹഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്ന പുല്ലിംഗ ബഹുവചന ബന്ധുപദം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: διὰ χειρὸς αὐτοῦ
  choice: തന്റെ കൈയിലൂടെ
  rationale: മോശയെ ദൈവിക പ്രവർത്തനത്തിന്റെ ഉപാധിയായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ദൃശ്യപ്രയോഗം സംരക്ഷിക്കുന്നു; ഇവിടെ ‘തന്റെ’ എന്നത് മോശയെ സൂചിപ്പിക്കുന്നു.
- source_word: δίδωσιν
  choice: നൽകുകയാണെന്ന്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം പരോക്ഷവചനത്തിനുള്ളിൽ ദൈവം അന്നുതന്നെ പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്നു എന്ന മോശയുടെ ധാരണ വ്യക്തമാക്കുന്നു.
- source_word: σωτηρίαν
  choice: വിടുതൽ
  rationale: ഈജിപ്തിലെ പീഡനത്തിൽനിന്നുള്ള ഇസ്രായേലിന്റെ ചരിത്രപരമായ രക്ഷയാണ് തൊട്ടടുത്ത സന്ദർഭം; ‘വിടുതൽ’ ആ അർഥം സ്വാഭാവികമായി നൽകുകയും വിശാലമായ രക്ഷാർഥത്തെ നിഷേധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മോശയുടെ സന്ദർഭത്തിലെ σωτηρία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിടുതൽ
  alternative: രക്ഷ
  rationale: ഈ വാക്യത്തിലെ അടിയന്തര സന്ദർഭം മോശ മുഖാന്തരം ഇസ്രായേലിനു ലഭിക്കുന്ന ചരിത്രപരമായ മോചനമാണ്. ‘വിടുതൽ’ അതിനെ മുൻനിർത്തുന്നു; എന്നാൽ മൂലപദത്തിനുള്ള വിശാലമായ ‘രക്ഷ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തന്റെ കൈയിലൂടെ’ എന്ന മൂലഭാഷയിലെ ദൃശ്യപ്രയോഗം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രസക്തമായ ഘടകങ്ങൾക്ക് ശേഷം [a][b] ആയി മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
