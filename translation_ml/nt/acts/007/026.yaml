id: ACT.7.26
reference: Acts 7:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: ml
  text: 'പിറ്റേ ദിവസം, അവർ തമ്മിൽ പൊരുതിക്കൊണ്ടിരിക്കുമ്പോൾ മോശ അവർക്കു പ്രത്യക്ഷനായി. അവർക്കിടയിൽ സമാധാനം സ്ഥാപിക്കാൻ ശ്രമിച്ചുകൊണ്ട്[a] അദ്ദേഹം പറഞ്ഞു: “പുരുഷന്മാരേ, നിങ്ങൾ സഹോദരന്മാരാണ്; എന്തിനാണ് പരസ്പരം അന്യായം ചെയ്യുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർക്കിടയിൽ സമാധാനം സ്ഥാപിച്ചുകൊണ്ടിരുന്നു.” ഗ്രീക്കിലെ അപൂർണഭൂതകാലരൂപം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം; എന്നാൽ തുടർന്നുള്ള വാക്യത്തിൽ മോശയുടെ ശ്രമം നിരസിക്കപ്പെടുന്നതിനാൽ, “സമാധാനം സ്ഥാപിക്കാൻ ശ്രമിച്ചു” എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: പിറ്റേ ദിവസം
  rationale: തുടർന്നുവരുന്ന ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഈ കർമണിരൂപം ആഖ്യാനത്തിൽ അകർമകമായ ‘പ്രത്യക്ഷനായി’ എന്ന അർഥത്തിലാണ് സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നത്.
- source_word: αὐτοῖς μαχομένοις
  choice: അവർ തമ്മിൽ പൊരുതിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകൃതന്തം സൂചിപ്പിക്കുന്ന, മോശ പ്രത്യക്ഷനായ സമയത്ത് നടന്നുകൊണ്ടിരുന്ന സംഘർഷം വ്യക്തമാക്കുന്നു.
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: അവരെ സമാധാനത്തിലാക്കാൻ ശ്രമിച്ചുകൊണ്ട്
  rationale: അപൂർണഭൂതകാലരൂപത്തിന് സന്ദർഭത്തിൽ ശ്രമസൂചകമായ അർഥം ഉണ്ടാകാം; അടുത്ത വാക്യത്തിൽ ശ്രമം നിരസിക്കപ്പെടുന്നതിനാൽ ഈ പരിഭാഷ യോജിക്കുന്നു. εἰς εἰρήνην സൂചിപ്പിക്കുന്ന സമാധാനാവസ്ഥയിലേക്കുള്ള നീക്കവും നിലനിർത്തുന്നു.
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: സഹോദരന്മാരേ
  rationale: വാക്കുതോറുമുള്ള ആവർത്തനം മലയാളത്തിൽ കൃത്രിമമാകുന്നതിനാൽ, ഒരേ ജനത്തിൽപ്പെട്ട സഹോദരന്മാർ എന്ന അഭ്യർഥനയുടെ പ്രായോഗിക ശക്തി സ്വാഭാവികമായ സംബോധനയിൽ പകർന്നു; പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἀδικεῖτε ἀλλήλους
  choice: പരസ്പരം അന്യായം ചെയ്യുന്നത്
  rationale: ἀδικέω എന്നത് ഇവിടെ അന്യോന്യം തെറ്റോ അനീതിയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അന്യായം ചെയ്യുക’ ഈ നൈതികവും ബന്ധപരവുമായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന അഭിസംബോധനയുടെ ബന്ധസൂചന
  choice: സഹോദരന്മാരേ
  alternative: പുരുഷന്മാരേ, നിങ്ങൾ സഹോദരന്മാരാണ്
  rationale: ഇവിടെ രണ്ടുപേരും സഹ ഇസ്രായേല്യരാണെന്ന ഐക്യത്തിലേക്കുള്ള അഭ്യർഥനയാണ് പ്രധാനം. സ്വാഭാവിക മലയാളത്തിനായി അത് സംബോധനയായി നൽകി; ഗ്രീക്കിന്റെ വാക്യഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. ‘മോശ’ എന്ന പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കൃത്രിമമായി തോന്നാവുന്ന ആവർത്തനം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അതിന്റെ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
