id: ACT.7.30
reference: Acts 7:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: ml
  text: നാല്പതു വർഷം പൂർത്തിയായപ്പോൾ[a], സീനായ് മലയുടെ മരുഭൂമിയിൽ[c] ഒരു മുൾപ്പടർപ്പിലെ തീജ്വാലയിൽ[b] ഒരു ദൂതൻ അവനു പ്രത്യക്ഷനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാല്പതു വർഷം തികഞ്ഞപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഒരു മുൾപ്പടർപ്പിന്റെ അഗ്നിജ്വാലയിൽ’; പുറപ്പാട് 3:2 കാണുക.
    reason: cross_reference
  - marker: c
    text: പുറപ്പാട് 3:2-ലെ ‘കർത്താവിന്റെ ദൂതനുമായി’ ചില വ്യാഖ്യാതാക്കൾ ഈ ദൂതനെ ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ പ്രവൃത്തികളുടെ പാഠം ‘ഒരു ദൂതൻ’ എന്നു മാത്രമാണ് പറയുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: നാല്പതു വർഷം പൂർത്തിയായപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കാലസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘പൂർത്തിയായപ്പോൾ’ എന്നത് πληρόω എന്ന ക്രിയയുടെ ആശയം നിലനിർത്തുന്നതിനൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഈ പാസീവ് രൂപം ദൈവിക പ്രത്യക്ഷതാവിവരണങ്ങളിൽ അകർമകമായ ‘പ്രത്യക്ഷനായി’ എന്ന അർഥത്തിൽ സാധാരണ ഉപയോഗിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: സന്ദർഭത്തിൽ മോശെയെ സൂചിപ്പിക്കുന്ന ദത്തിവ് രൂപത്തിന്റെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: സീനായ് മലയുടെ മരുഭൂമിയിൽ
  rationale: ἔρημος എന്നതിന്റെ ബൈബിൾ ഭൂമിശാസ്ത്രപരമായ ഭാവം ‘മരുഭൂമി’ സ്വാഭാവികമായി നൽകുന്നു; ജനിറ്റീവ് ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: ἄγγελος
  choice: ഒരു ദൂതൻ
  rationale: ഈ പ്രത്യക്ഷതാസന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകനല്ല, സ്വർഗീയ ദൂതനാണ് ഉദ്ദേശ്യം. ഗ്രീക്കിൽ നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ഇല്ലാത്തതും പരിഭാഷ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: ഒരു മുൾപ്പടർപ്പിലെ തീജ്വാലയിൽ
  rationale: ഗ്രീക്കിലെ സങ്കുചിതമായ ജനിറ്റീവ് ബന്ധം പുറപ്പാട് 3:2-ലെ ദൃശ്യവുമായി ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘തീജ്വാല’ φλογὶ πυρός എന്ന ഇരട്ട അഗ്നിചിത്രം ചുരുക്കാതെ പകർത്തുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രത്യക്ഷതാസന്ദർഭത്തിലെ ἄγγελος എന്ന പ്രത്യക്ഷരൂപത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘ഒരു ദൂതൻ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  alternative: ‘കർത്താവിന്റെ ദൂതൻ’ അല്ലെങ്കിൽ ‘ഒരു സന്ദേശവാഹകൻ’
  rationale: പ്രവൃത്തികൾ 7:30-ലെ ഗ്രീക്ക് പാഠത്തിൽ ἄγγελος എന്നു മാത്രമാണുള്ളത്; ‘കർത്താവിന്റെ ദൂതൻ’ എന്ന പൂർണരൂപമില്ല. അതിനാൽ പുറപ്പാട് 3:2-ൽനിന്നുള്ള ശക്തമായ തിരിച്ചറിയൽ പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘മുൾപ്പടർപ്പ്’, ‘തീജ്വാല’, ‘പ്രത്യക്ഷനായി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പുറപ്പാട് പശ്ചാത്തലത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്.
