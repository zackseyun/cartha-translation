  text: οὐχὶ ἡ χείρ μου ἐποίησεν ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/050.yaml
  text: Did not my hand make all these things?[a][b]
translation:
  language: ml
  text: എന്റെ കൈയല്ലയോ ഇവയെല്ലാം ഉണ്ടാക്കിയത്?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ചലനാത്മകമായി: ‘ഞാനല്ലയോ ഇവയെല്ലാം ഉണ്ടാക്കിയത്?’'
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യം യെശയ്യാവ് 66:2-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: οὐχὶ
  choice: അല്ലയോ
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരപ്രശ്നത്തെ സൂചിപ്പിക്കുന്നു; ‘അല്ലയോ’ ആ പ്രതീക്ഷയും ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ χείρ μου
  choice: എന്റെ കൈ
  rationale: χείρ എന്നതിന്റെ മൂർത്തമായ അർഥം ‘കൈ’ എന്നാണ്. ദൈവിക പ്രവർത്തനശേഷിയെ സൂചിപ്പിക്കുന്ന ഈ മാനവരൂപകപ്രയോഗം യെശയ്യാവ് 66:2-ലെ പ്രതിധ്വനിയോടൊപ്പം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐποίησεν
  choice: ഉണ്ടാക്കിയത്
  rationale: ποιέω ഇവിടെ സൃഷ്ടിക്കുക, നിലവിൽ വരുത്തുക എന്ന അർഥത്തിലാണ്. ‘ഉണ്ടാക്കിയത്’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സൃഷ്ടിയുടെ സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: ταῦτα πάντα
  choice: ഇവയെല്ലാം
  rationale: ταῦτα എന്ന സമീപസൂചകത്തിന്റെയും πάντα എന്ന സമഗ്രതയുടെയും അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പൂർണമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള മാനവരൂപകഭാഷ
  choice: ദൈവിക പ്രവർത്തനത്തിന്റെ സ്വയംപരാമർശമായി ‘എന്റെ കൈ’ നിലനിർത്തി
  alternative: ‘ഞാനല്ലയോ ഇവയെല്ലാം ഉണ്ടാക്കിയത്?’ എന്ന ചലനാത്മക പരിഭാഷ
  rationale: ഇത് യെശയ്യാവ് 66:2-ന്റെ ഉദ്ധരണിയാണ്. ‘എന്റെ കൈ’ എന്ന ദൃശ്യബിംബം സംരക്ഷിക്കുന്നത് അമൂർത്തമായ വ്യാഖ്യാനം ചേർക്കാതെ തിരുവെഴുത്തിലെ ഭാഷയും അലങ്കാരപ്രഭാവവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അലങ്കാരപ്രശ്നത്തിന്റെ ഊന്നലും മൂലപാഠത്തിലെ ‘എന്റെ കൈ’ എന്ന മൂർത്തമായ ദൃശ്യബിംബവും സംരക്ഷിച്ചു.
