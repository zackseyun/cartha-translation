language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: ml
  text: അപ്പോൾ അദ്ദേഹം കൽദയരുടെ ദേശത്തുനിന്ന് പുറപ്പെട്ട് ഹാരാനിൽ താമസമാക്കി. അവിടെനിന്ന്, അദ്ദേഹത്തിന്റെ പിതാവ് മരിച്ചതിനുശേഷം, ദൈവം[a] അദ്ദേഹത്തെ നിങ്ങൾ ഇപ്പോൾ പാർക്കുന്ന ഈ ദേശത്തേക്കു മാറ്റിപ്പാർപ്പിച്ചു,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ അദ്ദേഹത്തെ മാറ്റിപ്പാർപ്പിച്ചു.” ഗ്രീക്കിൽ ഈ ക്രിയയുടെ കർത്താവിനെ പ്രത്യേകം പറഞ്ഞിട്ടില്ല; സന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ സ്ഥലംമാറ്റം അദ്ദേഹത്തിന്റെ പിതാവ് മരിച്ചതിനുശേഷമാണെന്ന് സ്തെഫാനോസ് പറയുന്നു. ബന്ധപ്പെട്ട കാലക്രമത്തിനായി ഉല്പത്തി 11:32; 12:4 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകം.
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: കൽദയരുടെ ദേശത്തുനിന്ന് പുറപ്പെട്ട്
  rationale: മുൻകൃത്യവും ഉറവിടസ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; γῆ Χαλδαίων എന്ന പൂർണ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κατῴκησεν ἐν Χαρράν
  choice: ഹാരാനിൽ താമസമാക്കി
  rationale: κατοικέω ഇവിടെ സ്ഥിരതാമസം ആരംഭിക്കുന്ന ആശയം നൽകുന്നു; ‘താമസമാക്കി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κἀκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: καί + ἐκεῖθεν എന്ന കഥാക്രമബന്ധം മലയാളത്തിലെ വാക്യബന്ധത്തിലൂടെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ പിതാവ് മരിച്ചതിനുശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന ശേഷകാലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μετῴκισεν αὐτὸν
  choice: ദൈവം അദ്ദേഹത്തെ ... മാറ്റിപ്പാർപ്പിച്ചു
  rationale: μετοικίζω മറ്റൊരാളെ ഒരു സ്ഥലത്തേക്കു മാറ്റി താമസിപ്പിക്കുക എന്ന causative ആശയം നൽകുന്നു. ഗ്രീക്കിൽ കർത്താവ് തുറന്നുപറഞ്ഞിട്ടില്ലെങ്കിലും മുൻസന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ വ്യക്തതയ്ക്കായി ‘ദൈവം’ ചേർക്കുന്നു; അടിക്കുറിപ്പിൽ യഥാർത്ഥ വ്യാകരണപരമായ അനിശ്ചിതത്വം രേഖപ്പെടുത്തുന്നു.
- source_word: εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: നിങ്ങൾ ഇപ്പോൾ പാർക്കുന്ന ഈ ദേശത്തേക്കു
  rationale: ചലനദിശയും ഇപ്പോഴത്തെ താമസവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; γῆയ്ക്ക് ‘ദേശം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: μετῴκισεν എന്ന ക്രിയയുടെ പറയാത്ത കർത്താവ്
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കുക
  alternative: ‘അദ്ദേഹത്തെ ... മാറ്റിപ്പാർപ്പിച്ചു’ എന്ന് കർത്താവിനെ പറയാതെ വിടുക, അല്ലെങ്കിൽ ‘അവൻ അദ്ദേഹത്തെ’ എന്നു നൽകുക
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ കർത്താവ് പ്രത്യക്ഷമല്ല; എന്നാൽ പ്രവൃത്തികൾ 7:2-3-ലെ ദൈവിക കർത്തൃത്വം സന്ദർഭത്തിൽ തുടരുന്നു. വായനാസ്പഷ്ടതയ്ക്കായി ‘ദൈവം’ ചേർക്കുന്നു, അതേസമയം അടിക്കുറിപ്പിലൂടെ മൂലപാഠത്തിലെ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: തേരഹിന്റെ മരണവും അബ്രാഹാമിന്റെ യാത്രയും സംബന്ധിച്ച കാലക്രമസംഘർഷം
  choice: ‘പിതാവ് മരിച്ചതിനുശേഷം’ എന്ന് ഗ്രീക്ക് പാഠത്തിലെ ക്രമം അതേപടി വിവർത്തനം ചെയ്യുക
  alternative: ഉല്പത്തി 11:32; 12:4 എന്നിവയുമായി ഒത്തുചേരാൻ വാചകം പരാവർത്തനം ചെയ്യുക
  rationale: പ്രവൃത്തികളിലെ സ്തെഫാനോസിന്റെ പ്രസ്താവനയെ തിരുത്തുകയോ നിശ്ശബ്ദമായി സമന്വയിപ്പിക്കുകയോ ചെയ്യാതെ അതിലെ യഥാർത്ഥ ദൈവശാസ്ത്ര-കാലക്രമ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അബ്രാഹാമിനെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. ‘പാർക്കുന്ന’ സാധാരണ ആധുനിക പ്രയോഗമാണ്; ‘വസിക്കുന്ന’ എന്ന കൂടുതൽ ഔപചാരിക രൂപം ഒഴിവാക്കി. സ്ഥലനാമം ‘ഹാരാൻ’ എന്ന പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ നൽകി.
