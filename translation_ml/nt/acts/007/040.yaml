source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ml
  text: 'അവർ അഹരോനോടു പറഞ്ഞു: “ഞങ്ങൾക്കു മുമ്പായി പോകുന്ന ദേവന്മാരെ ഞങ്ങൾക്കായി ഉണ്ടാക്കിത്തരിക.[a] കാരണം, ഈ മോശെ—ഈജിപ്ത് ദേശത്തുനിന്ന് ഞങ്ങളെ പുറത്തുകൊണ്ടുവന്നവൻ—അവന് എന്തു സംഭവിച്ചുവെന്ന് ഞങ്ങൾക്കറിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിഗ്രഹങ്ങളെ.” ഗ്രീക്കുപദത്തിന്റെ അക്ഷരാർഥം “ദേവന്മാർ” എന്നാണ്. പുറപ്പാട് വിവരണത്തിലെ പദപ്രയോഗവും ജനങ്ങൾ ഉന്നയിച്ച അവകാശവാദവും നിലനിർത്താനാണ് പ്രധാനവാചകത്തിൽ അത് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: അവർ അഹരോനോട് പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ഇത് മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപമാണെങ്കിലും, മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ സമാപികാക്രിയയായി വിവർത്തനം ചെയ്തു.
- source_word: Ποίησον ἡμῖν
  choice: ഞങ്ങൾക്കായി ഉണ്ടാക്കിത്തരിക
  rationale: ποιέω എന്ന ക്രിയയുടെ ‘ഉണ്ടാക്കുക’ എന്ന നേരിട്ടുള്ള അർഥവും അപേക്ഷയുടെ ഗുണഭോക്തൃഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεοὺς
  choice: ദേവന്മാരെ
  rationale: മൂലപദം ‘വിഗ്രഹങ്ങൾ’ എന്നല്ല, അക്ഷരാർഥത്തിൽ ‘ദേവന്മാർ’ എന്നാണ്; പുറപ്പാട് വിവരണത്തിന്റെ പദപ്രയോഗവും ജനങ്ങളുടെ അവകാശവാദവും ഇതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: ഞങ്ങൾക്കു മുമ്പായി പോകേണ്ട
  rationale: προπορεύομαι എന്നതിന്റെ ‘മുമ്പായി പോകുക’ എന്ന ചലനാർഥം നിലനിർത്തുന്നു; ‘ഞങ്ങളെ നയിക്കുക’ എന്ന അധിക വ്യാഖ്യാനഭാവം ചേർക്കുന്നില്ല.
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: ഈ മോശെ
  rationale: οὗτος എന്ന ചൂണ്ടുപദത്തിന്റെ അകൽച്ചയോ അവജ്ഞയോ സൂചിപ്പിക്കാവുന്ന ഭാവം ‘ഈ മോശെ’ നിലനിർത്തുന്നു. γάρ നൽകുന്ന കാരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിലും തുടർന്നുള്ള വിശദീകരണത്തിലും സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക ബന്ധപദം ചേർത്തിട്ടില്ല.
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: ഈജിപ്തുദേശത്തുനിന്ന് ഞങ്ങളെ പുറത്തുകൊണ്ടുവന്നവൻ
  rationale: ἐξάγω എന്നതിലെ പുറത്തേക്കുള്ള ചലനവും γῆς എന്ന ‘ദേശം’ ഘടകവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: അവന് എന്തു സംഭവിച്ചെന്ന് ഞങ്ങൾക്കറിയില്ല
  rationale: സമകാലിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലത്തിലെ അജ്ഞതയുടെ പ്രസ്താവന കൃത്യമായി നൽകുന്നതുമായ പ്രയോഗം.
theological_decisions:
- issue: വിഗ്രഹാരാധനയുടെ സന്ദർഭത്തിൽ θεοὺς എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദേവന്മാരെ
  alternative: വിഗ്രഹങ്ങളെ
  rationale: വിവരണം ജനങ്ങളുടെ സ്വന്തം അഭ്യർഥന ഉദ്ധരിക്കുമ്പോൾ θεοὺς എന്ന പദമാണ് ഉപയോഗിക്കുന്നത്; വ്യാഖ്യാനപരമായ ‘വിഗ്രഹങ്ങൾ’ പ്രധാനവാചകത്തിൽ പകരാതെ മൂലത്തിലെ പദവും ദൈവശാസ്ത്രപരമായ പരിഹാസവും സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയുടെ ശക്തിയും ‘ഈ മോശെ’ എന്നതിലെ അകൽച്ചാഭാവവും നിലനിർത്തി; മലയാളത്തിൽ അനാവശ്യമായി കൃത്രിമമാകുന്ന കൃദന്തരൂപവും γάρ-ന്റെ വാക്കുതോറുമുള്ള പരിഭാഷയും ഒഴിവാക്കി.
