- from: 'അവർ അഹരോനോട് പറഞ്ഞു: “ഞങ്ങൾക്കു മുമ്പായി പോകേണ്ട ദേവന്മാരെ ഞങ്ങൾക്കായി ഉണ്ടാക്കിത്തരിക.[a] ഈ മോശെ—ഈജിപ്തുദേശത്തുനിന്ന് ഞങ്ങളെ പുറത്തുകൊണ്ടുവന്നവൻ—അവന് എന്തു സംഭവിച്ചെന്ന് ഞങ്ങൾക്കറിയില്ല.”'
