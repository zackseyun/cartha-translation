id: ACT.7.41
reference: Acts 7:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: ml
  text: ആ നാളുകളിൽ അവർ ഒരു കാളക്കുട്ടിയെ ഉണ്ടാക്കി[a]; ആ വിഗ്രഹത്തിനു ബലി അർപ്പിച്ചു. തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽ അവർ ആനന്ദിച്ചുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കാളക്കുട്ടിയെ രൂപപ്പെടുത്തി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “തങ്ങളുടെ കൈകൾകൊണ്ട് ഉണ്ടാക്കിയതിനെച്ചൊല്ലി അവർ ആനന്ദിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: ഒരു കാളക്കുട്ടിയെ ഉണ്ടാക്കി
  rationale: ഒറ്റ ഗ്രീക്ക് ക്രിയയിൽ കാളക്കുട്ടിയെ ഉണ്ടാക്കുക/രൂപപ്പെടുത്തുക എന്ന അർഥമുണ്ട്. പിന്നാലെ അതിനെ ‘വിഗ്രഹം’ എന്നു വ്യക്തമാക്കുന്നതിനാൽ ഇവിടെ ‘കാളക്കുട്ടി’ എന്നു മാത്രം പറയുന്നത് സ്വാഭാവികവും ആവർത്തനരഹിതവുമാണ്.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ആ നാളുകളിൽ
  rationale: ഗ്രീക്കിലെ സാധാരണ കാലസൂചനയുടെ ഘടനയും അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνήγαγον θυσίαν
  choice: ബലി അർപ്പിച്ചു
  rationale: ബലികർമത്തിന്റെ പശ്ചാത്തലത്തിൽ ക്രിയാപദസമുച്ചയം ബലി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ബലി അർപ്പിച്ചു’ മലയാളത്തിൽ വ്യക്തവും പതിവുമായ പ്രയോഗമാണ്.
- source_word: τῷ εἰδώλῳ
  choice: ആ വിഗ്രഹത്തിനു
  rationale: നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ മുമ്പ് പറഞ്ഞ കാളക്കുട്ടിയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്. εἴδωλον എന്നതിന്റെ വിമർശനാത്മകമായ വിഗ്രഹാരാധനാസൂചന ‘വിഗ്രഹം’ നിലനിർത്തുന്നു.
- source_word: εὐφραίνοντο
  choice: ആനന്ദിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിലെ തുടരുന്ന പ്രവർത്തിയുടെ ഭാവം ‘-കൊണ്ടിരുന്നു’ വഴി പ്രകടമാക്കുന്നു; ‘ആഘോഷിച്ചുകൊണ്ടിരുന്നു’ എന്നത് സാധ്യമെങ്കിലും അല്പം കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: തങ്ങളുടെ കൈകളുടെ പ്രവൃത്തികളിൽ
  rationale: വിഗ്രഹാരാധനയ്‌ക്കെതിരായ തിരുവെഴുത്തിലെ വിമർശനത്തിന്റെ പ്രതിധ്വനി സംരക്ഷിക്കാൻ രൂപകാത്മക പ്രയോഗം താരതമ്യേന അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിഗ്രഹാരാധനയെക്കുറിച്ചുള്ള ഭാഷയും വാക്യത്തിന്റെ വിമർശനശക്തിയും
  choice: εἴδωλον എന്നത് ‘വിഗ്രഹം’ എന്നും ‘കൈകളുടെ പ്രവൃത്തികൾ’ എന്ന രൂപകം നിലനിർത്തിയും വിവർത്തനം ചെയ്തു.
  alternative: ‘പ്രതിമ’; ‘തങ്ങളുടെ കൈകൾകൊണ്ട് ഉണ്ടാക്കിയതിൽ’
  rationale: സ്തെഫാനൊസിന്റെ പ്രസംഗം ഇസ്രായേലിന്റെ വിഗ്രഹാരാധനയെ പ്രവാചകീയ ഭാഷയിൽ കുറ്റപ്പെടുത്തുന്നു. നിഷ്പക്ഷമായ കരകൗശലഭാഷയാക്കി മൃദൂകരിക്കാതെ ആ ദൈവശാസ്ത്രപരമായ കുറ്റപ്പെടുത്തൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൈകളുടെ പ്രവൃത്തികൾ’ എന്ന അല്പം ഔപചാരികമായ തിരുവെഴുത്തുരൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു; തുടരുന്ന പ്രവർത്തിയെ സൂചിപ്പിക്കാൻ ‘ആനന്ദിച്ചുകൊണ്ടിരുന്നു’ ഉപയോഗിച്ചു.
