id: ACT.7.35
reference: Acts 7:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: ml
  text: “നിന്നെ ഭരണാധികാരിയും ന്യായാധിപനും ആക്കിയത് ആര്?” എന്നു പറഞ്ഞ് അവർ തള്ളിക്കളഞ്ഞ ഈ മോശെയെത്തന്നെ, മുൾപ്പടർപ്പിൽ അവനു പ്രത്യക്ഷനായ ദൂതന്റെ കൈവഴി, ഭരണാധികാരിയും വീണ്ടെടുപ്പുകാരനുമായി[a] ദൈവം അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിമോചകൻ.’ ഗ്രീക്കുപദം വിടുതലോ മോചനമോ വരുത്തുന്ന ഒരാളെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: തള്ളിക്കളഞ്ഞ
  rationale: സന്ദർഭത്തിൽ മോശെയുടെ അധികാരത്തെ നിരസിച്ചതാണ് സൂചിപ്പിക്കുന്നത്; വെറും വാക്കാൽ നിഷേധിച്ചതല്ല.
- source_word: κατέστησεν
  choice: ആക്കിയത്
  rationale: ഒരാളെ അധികാരസ്ഥാനത്ത് നിയമിക്കുകയോ സ്ഥാപിക്കുകയോ ചെയ്യുന്നതാണ് അർഥം; ഉദ്ധരിച്ച ചോദ്യത്തിൽ ‘ആക്കിയത്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἄρχοντα
  choice: ഭരണാധികാരി
  rationale: അധികാരം പ്രയോഗിക്കുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും ഔദ്യോഗിക ഭാവവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: δικαστήν
  choice: ന്യായാധിപൻ
  rationale: ന്യായവിധി നടത്തുന്നയാളെ നേരിട്ടും മാന്യമായും സൂചിപ്പിക്കുന്ന ആധുനിക പ്രയോഗം.
- source_word: λυτρωτὴν
  choice: വീണ്ടെടുപ്പുകാരൻ
  rationale: വിടുതൽ വരുത്തുന്നവൻ എന്ന അർഥത്തോടൊപ്പം വീണ്ടെടുപ്പിന്റെ ശക്തമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀπέσταλκεν
  choice: അയച്ചു
  rationale: ഗ്രീക്കിലെ പൂർത്തിയായ അയയ്ക്കൽപ്രവൃത്തിയെ മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σὺν χειρὶ
  choice: കൈമുഖാന്തരം
  rationale: ദൂതന്റെ ഇടനിലയെയോ പ്രവർത്തനോപാധിയെയോ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ഭാവമുള്ള പ്രയോഗം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἀγγέλου
  choice: ദൂതൻ
  rationale: മുൾപ്പടർപ്പിൽ പ്രത്യക്ഷപ്പെട്ട സ്വർഗീയ ദൂതനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: മുൾപ്പടർപ്പിൽ അവനു പ്രത്യക്ഷനായ
  rationale: ഗ്രീക്കിലെ കർമണി രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ‘പ്രത്യക്ഷനായ’ എന്നു നൽകി; മൂലത്തിൽ ഇല്ലാത്ത ‘കത്തുന്ന’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: Τοῦτον ... τοῦτον
  choice: ഈ മോശെയെത്തന്നെ
  rationale: ആവർത്തിച്ച ചൂണ്ടുപദങ്ങളുടെ ഊന്നൽ മലയാളത്തിൽ ‘-ത്തന്നെ’കൊണ്ട് സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: ഭരണാധികാരിയും വീണ്ടെടുപ്പുകാരനുമായി
  rationale: ആവർത്തിച്ച καί സൂചിപ്പിക്കുന്ന രണ്ടു ചുമതലകളെയും ‘-യും ... -യും’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രക്ഷാചരിത്രത്തിൽ മോശെയുടെ പങ്കിനെ വിവരിക്കുന്ന λυτρωτής എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വീണ്ടെടുപ്പുകാരൻ
  alternative: വിമോചകൻ
  rationale: ‘വീണ്ടെടുപ്പുകാരൻ’ വിടുതലിന്റെയും വീണ്ടെടുപ്പിന്റെയും ഭാരം സംരക്ഷിക്കുന്നു; എന്നാൽ മോശെയെയും ക്രിസ്തുവിനെയും പൂർണമായി തുല്യരാക്കുന്ന ആശയം വിവർത്തനത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ഊന്നൽ ‘ഈ മോശെയെത്തന്നെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; മൂലത്തിൽ വ്യക്തമാക്കാത്ത ‘കത്തുന്ന’ എന്ന പദം ചേർത്തിട്ടില്ല.
