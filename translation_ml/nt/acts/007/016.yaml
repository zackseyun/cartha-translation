id: ACT.7.16
reference: Acts 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: ml
  text: അവരെ ശെഖേമിലേക്കു മാറ്റിക്കൊണ്ടുപോയി, ശെഖേമിലെ ഹാമോരിന്റെ പുത്രന്മാരിൽനിന്ന് അബ്രാഹാം വെള്ളിവില കൊടുത്തു വാങ്ങിയ കല്ലറയിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സ്തെഫാനോസിന്റെ ഈ വാക്കുകൾ ഉല്പത്തി 23-ലെയും 33:19-ലെയും വിവരങ്ങളുമായി താരതമ്യം ചെയ്യാം: ഉല്പത്തി 23-ൽ അബ്രാഹാം മക്പേലയിലെ ഒരു സംസ്കാരസ്ഥലം എഫ്രോനിൽനിന്ന് വാങ്ങുന്നു; ഉല്പത്തി 33:19-ൽ യാക്കോബ് ശെഖേമിനടുത്തുള്ള ഭൂമി ഹാമോരിന്റെ പുത്രന്മാരിൽനിന്ന് വാങ്ങുന്നു.'
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: കൊണ്ടുപോയി
  rationale: മരിച്ച പിതാക്കന്മാരുടെ ഭൗതികാവശിഷ്ടങ്ങൾ മറ്റൊരു സ്ഥലത്തേക്കു മാറ്റിയതിനെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: Συχὲμ / Συχέμ
  choice: ശെഖേം
  rationale: സ്ഥലനാമത്തിന്റെ ഗ്രീക്ക് രൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ വായിക്കാൻ സ്വാഭാവികമായ ലിപ്യന്തരണം.
- source_word: ἐτέθησαν
  choice: അടക്കം ചെയ്തു
  rationale: കല്ലറയെ സംബന്ധിച്ച സന്ദർഭത്തിൽ τίθημι എന്നതിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥമായ ‘വെച്ചു’ എന്നതിനെക്കാൾ യോജ്യം.
- source_word: μνήματι
  choice: കല്ലറയിൽ
  rationale: μνῆμα സൂചിപ്പിക്കുന്ന ശവസംസ്കാരസ്ഥലത്തിന് സാധാരണ മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ὠνήσατο
  choice: വാങ്ങിയ
  rationale: ക്രിയയുടെ വാങ്ങുക/വിലയ്ക്കെടുക്കുക എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τιμῆς ἀργυρίου
  choice: വെള്ളി വിലയായി കൊടുത്തു
  rationale: വില വെള്ളിയായിരുന്നുവെന്ന ഗ്രീക്ക് നിർമാണത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: ഹാമോരിന്റെ പുത്രന്മാരിൽനിന്ന്
  rationale: παρά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉറവിടം ‘നിന്ന്’ എന്നതിലൂടെ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν Συχέμ
  choice: ശെഖേമിലെ
  rationale: അവസാന സ്ഥാനസൂചനയെ ഹാമോരിന്റെ പുത്രന്മാരോട് ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക വായന സ്വീകരിക്കുന്നു; ഇടപാട് നടന്ന സ്ഥലം എന്ന ബന്ധവും വാക്യത്തിന്റെ മൊത്തത്തിലുള്ള അർഥത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ഉല്പത്തി പുസ്തകത്തിലെ ശവസംസ്കാരസ്ഥലവും ഭൂമി വാങ്ങലും സംബന്ധിച്ച വിവരണങ്ങളുമായുള്ള ചരിത്രപരമായ സംഘർഷം
  choice: അബ്രാഹാം ശെഖേമിലെ ഹാമോരിന്റെ പുത്രന്മാരിൽനിന്ന് കല്ലറ വാങ്ങിയെന്ന സ്തെഫാനോസിന്റെ വാക്കുകൾ ഗ്രീക്ക് പാഠത്തിലുള്ളതുപോലെ നിലനിർത്തി.
  alternative: ഉല്പത്തി 33:19 അനുസരിച്ച് വാങ്ങിയത് യാക്കോബാണെന്നോ, ഉല്പത്തി 23 അനുസരിച്ച് അബ്രാഹാം വാങ്ങിയത് മക്പേലയിലെ എഫ്രോനിൽനിന്നാണെന്നോ ചേർത്ത് സമന്വയിപ്പിക്കുക.
  rationale: വിവർത്തനം ബന്ധപ്പെട്ട പഴയനിയമ വിവരണങ്ങളനുസരിച്ച് പാഠത്തെ തിരുത്തുകയോ സംഘർഷം മറയ്ക്കുകയോ ചെയ്യാതെ മൂലഗ്രീക്ക് സാക്ഷ്യപ്പെടുത്തുന്നതു തന്നെയായിരിക്കണം; താരതമ്യവിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടക്കം ചെയ്തു’ എന്നത് ശവസംസ്കാരസന്ദർഭം വ്യക്തമായി നൽകുന്നു. ചരിത്രപരമായ സംഘർഷം മുഖ്യപാഠത്തിൽ സമന്വയിപ്പിക്കാതെ അടിക്കുറിപ്പിലൂടെ വായനക്കാരനെ ബന്ധപ്പെട്ട ഉല്പത്തി ഭാഗങ്ങളിലേക്കു നയിക്കുന്നു.
