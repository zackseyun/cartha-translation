revisions:
- from: അവരെ ശെഖേമിലേക്കു കൊണ്ടുപോയി, ശെഖേമിലെ ഹാമോരിന്റെ പുത്രന്മാരിൽനിന്ന് അബ്രാഹാം വെള്ളി വിലയായി കൊടുത്തു വാങ്ങിയ കല്ലറയിൽ അടക്കം ചെയ്തു.[a]
  to: അവരെ ശെഖേമിലേക്കു മാറ്റിക്കൊണ്ടുപോയി, ശെഖേമിലെ ഹാമോരിന്റെ പുത്രന്മാരിൽനിന്ന് അബ്രാഹാം വെള്ളിവില കൊടുത്തു വാങ്ങിയ കല്ലറയിൽ വെച്ചു.[a]
  rationale: പരിഷ്കാരം അർഥം മാറ്റുന്നില്ല. μετατίθημι-യുടെ സ്ഥലാന്തരസൂചനയും τίθημι-യുടെ ‘വെക്കുക’ എന്ന ലളിതമായ ശവകുടീരസന്ദർഭാർഥവും കൂടുതൽ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു; വെള്ളിവിലയെ സ്വാഭാവിക മലയാളത്തിൽ പറയുന്നു. മുഖ്യപാഠം അബ്രാഹാമിനെയും ശെഖേമിലെ ഹാമോരിന്റെ പുത്രന്മാരെയും തന്നെയാണ് പറയുന്നത്; ഉല്പത്തിവിവരങ്ങളോടു ചേർത്ത് സമന്വയിപ്പിക്കുന്നില്ല. അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട രണ്ടു ഭാഗങ്ങളും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
