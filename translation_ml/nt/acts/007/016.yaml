    rationale: ‘അടക്കം ചെയ്തു’ സംസ്കാരക്രിയയെ വ്യക്തമാക്കുന്നു, എന്നാൽ ഗ്രീക്കിൽ ‘കല്ലറയിൽ വെച്ചു/സ്ഥാപിച്ചു’ എന്നാണ്. ‘വെച്ചു’ എന്നത് ഉറവിടപാഠത്തിന്റെ പദപ്രയോഗവും ഉദ്ദേശ്യമായ സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
  - severity: low
