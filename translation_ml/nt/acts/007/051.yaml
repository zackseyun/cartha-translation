id: ACT.7.51
reference: Acts 7:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: ml
  text: കടുംകഴുത്തുള്ളവരേ, ഹൃദയത്തിലും ചെവികളിലും പരിച്ഛേദനയില്ലാത്തവരേ, നിങ്ങൾ എപ്പോഴും പരിശുദ്ധാത്മാവിനെ എതിർക്കുന്നു; നിങ്ങളുടെ പിതാക്കന്മാർ[a] ചെയ്തതുപോലെതന്നെ നിങ്ങളും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “നിങ്ങളുടെ പൂർവികർ.” ഗ്രീക്കിൽ: “നിങ്ങളുടെ പിതാക്കന്മാർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: ദുശ്ശാഠ്യക്കാരേ
  rationale: കഴുത്തു വഴങ്ങാത്ത ശാഠ്യത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വെറും ‘ശാഠ്യമുള്ളവർ’ എന്നതിനെക്കാൾ കുറ്റാരോപണത്തിന്റെ തീക്ഷ്ണത നിലനിർത്തുന്നു.
- source_word: ἀπερίτμητοι
  choice: പരിച്ഛേദനയില്ലാത്തവരേ
  rationale: ഉടമ്പടിയുമായി ബന്ധപ്പെട്ട പ്രവാചകീയ രൂപകം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: καρδίαις καὶ τοῖς ὠσίν
  choice: ഹൃദയത്തിലും ചെവികളിലും
  rationale: ബന്ധം/പരിധി സൂചിപ്പിക്കുന്ന ദത്തിവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ആന്തരിക അനുസരണക്കേടിന്റെയും കേൾക്കാനുള്ള വിസമ്മതത്തിന്റെയും സംയുക്തരൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀεὶ
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായി ആവർത്തിക്കുന്ന പെരുമാറ്റരീതിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: പ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ വ്യക്തിപരമായ ദൈവിക പരിശുദ്ധാത്മാവിനുള്ള നിലവാരമുള്ള മലയാള പ്രയോഗം.
- source_word: ἀντιπίπτετε
  choice: എതിർക്കുന്നു
  rationale: സജീവമായ പ്രതിരോധവും വിരോധവും അധിക വ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: οἱ πατέρες ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ കുടുംബപദവും സ്തെഫാനൊസിന്റെ ചരിത്രപരമായ കുറ്റാരോപണത്തിന്റെ വാചാടോപശക്തിയും നിലനിർത്തുന്നു.
- source_word: ὡς ... καὶ ὑμεῖς
  choice: ചെയ്തതുപോലെതന്നെ നിങ്ങളും ചെയ്യുന്നു
  rationale: ഗ്രീക്കിൽ അധ്യാഹരിച്ചിരിക്കുന്ന ക്രിയാതുല്യത മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു; പുതിയ ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘പരിശുദ്ധാത്മാവ്’ എന്നതിന്റെ സൂചന
  choice: വ്യക്തിപരമായ ദൈവിക പരിശുദ്ധാത്മാവ്
  alternative: പൊതുവായ ദൈവിക സ്വാധീനം അല്ലെങ്കിൽ വിശുദ്ധ മനോഭാവം
  rationale: പ്രവൃത്തികളിൽ നിർദ്ദിഷ്ടമായ ഈ ഗ്രീക്ക് പദസമുച്ചയം സാധാരണയായി വ്യക്തിപരമായ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: ഉടമ്പടിസംബന്ധിയായ അപമാനരൂപകം
  choice: ഹൃദയത്തിലും ചെവികളിലും ‘പരിച്ഛേദനയില്ലാത്തവർ’ എന്ന രൂപകം സംരക്ഷിച്ചു
  alternative: ‘ഹൃദയം അടഞ്ഞവരും കേൾക്കാത്തവരും’ എന്ന വ്യാഖ്യാനപരമായ രൂപം
  rationale: ഇസ്രായേൽ തിരുവെഴുത്തുകളിലെ പ്രവാചകീയ ഉടമ്പടിഭാഷയുമായുള്ള ബന്ധവും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ തീക്ഷ്ണതയും സംരക്ഷിക്കുന്നു.
- issue: ലിംഗസൂചകമായ പൂർവികപദം
  choice: പിതാക്കന്മാർ
  alternative: പൂർവികർ
  rationale: πατέρες എന്ന ഗ്രീക്ക് പദത്തിന്റെ വ്യക്തമായ പുരുഷലിംഗരൂപവും പ്രസംഗത്തിലെ തലമുറാപരമായ കുറ്റാരോപണവും സംരക്ഷിക്കുന്നു; കൂടുതൽ ഉൾക്കൊള്ളുന്ന പകരംവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള നേരിട്ടുള്ള അഭിസംബോധന. കുറ്റാരോപണത്തിന്റെ തീക്ഷ്ണത നിലനിർത്തിക്കൊണ്ട് അത്യന്തം പഴഞ്ചനായ പദക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘പിതാക്കന്മാർ’ എന്ന പദത്തിന് ഉടൻപിന്നാലെ വരേണ്ടതായതിനാൽ പ്രസിദ്ധീകരണരൂപത്തിൽ അതനുസരിച്ച് സ്ഥാപിക്കണം.
