reference: Acts 7:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: ml
  text: അവർ അവനെ നഗരത്തിനു പുറത്തേക്കു തള്ളിയശേഷം അവനെ കല്ലെറിഞ്ഞുകൊണ്ടിരുന്നു. സാക്ഷികൾ തങ്ങളുടെ മേൽവസ്ത്രങ്ങൾ[a] ശൗൽ എന്നു പേരുള്ള ഒരു യുവാവിന്റെ കാൽക്കൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തങ്ങളുടെ വസ്ത്രങ്ങൾ’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ മേലങ്കികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം പുറമേ ധരിക്കുന്ന വസ്ത്രങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: പുറത്തേക്കു തള്ളിയശേഷം
  rationale: ബലമായി പുറത്താക്കിയെന്ന ക്രിയയുടെ ഭാവവും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെന്ന ആഒറിസ്റ്റ് കൃദന്തത്തിന്റെ ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔξω τῆς πόλεως
  choice: നഗരത്തിനു പുറത്തേക്കു
  rationale: നഗരത്തിനുള്ളിൽനിന്ന് പുറത്തേക്കുള്ള ചലനം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐλιθοβόλουν
  choice: കല്ലെറിഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയ സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി മലയാളത്തിലെ പുരോഗമനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ μάρτυρες
  choice: സാക്ഷികൾ
  rationale: ഇവിടെ നിയമനടപടിയിലെ സാക്ഷികളെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാലത്തെ ‘രക്തസാക്ഷികൾ’ എന്ന അർഥം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: ἀπέθεντο
  choice: വെച്ചു
  rationale: വസ്ത്രങ്ങൾ അഴിച്ചുവച്ച് ഒരാളുടെ കാൽക്കൽ ഏൽപ്പിക്കുന്ന പ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: തങ്ങളുടെ മേലങ്കികൾ
  rationale: ἱμάτια പുറമേ ധരിക്കുന്ന വസ്ത്രങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘മേലങ്കികൾ’ അർഥം വ്യക്തമാക്കുകയും ഒരു പ്രത്യേക രൂപത്തിലുള്ള അങ്കിയിലേക്കു ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: παρὰ τοὺς πόδας
  choice: കാൽക്കൽ
  rationale: ഒരാളുടെ പാദങ്ങൾക്കരികിൽ എന്തെങ്കിലും വയ്ക്കുന്നതിന് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: νεανίου
  choice: ഒരു യുവാവിന്റെ
  rationale: താരതമ്യേന ചെറുപ്പക്കാരനായ പുരുഷനെ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തുല്യം.
- source_word: καλουμένου Σαύλου
  choice: ശൗൽ എന്നു പേരുള്ള
  rationale: ആ വ്യക്തിയുടെ പേര് പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: വധശിക്ഷയുടെ പശ്ചാത്തലത്തിൽ μάρτυρες എന്ന പദത്തിന്റെ തിരിച്ചറിയൽ
  choice: നിയമപരമായ അർഥത്തിൽ ‘സാക്ഷികൾ’
  alternative: രക്തസാക്ഷികൾ
  rationale: ഈ കഥാസന്ദർഭത്തിൽ ന്യായനടപടിയിൽ സാക്ഷ്യം പറഞ്ഞ് കല്ലെറിയലിൽ പങ്കെടുത്തവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. പിൽക്കാല സഭാപരമായ ‘രക്തസാക്ഷി’ എന്ന അർഥം ഇവിടെ കൊണ്ടുവരുന്നത് അനുചിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ പ്രവൃത്തികളുടെ ക്രമവും കല്ലെറിയൽ തുടർന്നുകൊണ്ടിരുന്നുവെന്ന ക്രിയാഭാവവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന ‘മേലങ്കികൾ’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
