id: ACT.7.56
reference: Acts 7:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഇതാ, ആകാശങ്ങൾ തുറന്നിരിക്കുന്നതും[a] മനുഷ്യപുത്രൻ[b] ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് നിൽക്കുന്നതും ഞാൻ കാണുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തുറക്കപ്പെട്ടിരിക്കുന്നതും.” ഗ്രീക്കിൽ പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപമാണ്; സ്തെഫാനൊസിന്റെ ദർശനത്തിൽ ആകാശങ്ങൾ ഇതിനകം തുറക്കപ്പെട്ട് അങ്ങനെതന്നെ നിലകൊള്ളുന്നതിന് ഇത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യപുത്രൻ” ദാനീയേൽ 7:13-നെ പ്രതിധ്വനിപ്പിക്കുന്ന, അംഗീകൃതമായ ഒരു മശീഹാ ശീർഷകമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രോതാക്കളുടെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഉദ്‌ഘോഷത്തിന്റെ അടിയന്തരതയും ദർശനത്തിന്റെ സജീവതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θεωρῶ
  choice: ഞാൻ കാണുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർന്നുകൊണ്ടിരിക്കുന്ന ദർശനാനുഭവത്തെ ലളിതമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τοὺς οὐρανοὺς
  choice: ആകാശങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം സംരക്ഷിക്കുകയും ദർശനത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διηνοιγμένους
  choice: തുറന്നിരിക്കുന്നതും
  rationale: പൂർണകാല നിഷ്ക്രിയ കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന, മുമ്പ് തുറക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോഴും തുറന്നിരിക്കുന്ന അവസ്ഥ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: മനുഷ്യപുത്രൻ
  rationale: ദാനീയേൽ 7-നോടു ബന്ധമുള്ള അംഗീകൃത മശീഹാ ശീർഷകം അക്ഷരാർഥത്തോടെയും പരമ്പരാഗത തിരിച്ചറിവോടെയും നിലനിർത്തുന്നു.
- source_word: ἐκ δεξιῶν
  choice: വലത്തുഭാഗത്ത്
  rationale: ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാള സമാനപ്രയോഗമാണിത്.
- source_word: ἑστῶτα
  choice: നിൽക്കുന്നതും
  rationale: യേശു നിൽക്കുന്ന ഭാവം വ്യക്തമായി സംരക്ഷിക്കുന്നു; ഇരിക്കുന്നതായി പറയുന്ന മറ്റു വചനങ്ങളോടു ചേർത്ത് സമന്വയിപ്പിക്കുന്നില്ല.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഘടന അനാവശ്യമായ വിശദീകരണമില്ലാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπου എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം
  choice: മനുഷ്യപുത്രൻ
  alternative: മനുഷ്യനായവൻ
  rationale: ഗ്രീക്ക് പദപ്രയോഗവും ദാനീയേൽ 7:13-ലെ മശീഹാ പ്രതിധ്വനിയും അംഗീകൃത ശീർഷകസ്വഭാവവും ‘മനുഷ്യപുത്രൻ’ കൂടുതൽ നന്നായി സംരക്ഷിക്കുന്നു.
- issue: മഹത്ത്വീകരിക്കപ്പെട്ട യേശുവിന്റെ ശരീരഭാവം
  choice: ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് നിൽക്കുന്നതും
  alternative: ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുന്നതും
  rationale: മൂലപാഠം വ്യക്തമായി ‘നിൽക്കുന്നു’ എന്നു പറയുന്നു. മറ്റു ഭാഗങ്ങളിലെ ‘ഇരിക്കുന്നു’ എന്ന സാധാരണ പ്രയോഗത്തോട് ഇതിനെ സമന്വയിപ്പിക്കാതെ വചനത്തിന്റെ പ്രത്യേകതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ദർശനത്തിന്റെ ഉജ്ജ്വലതയ്ക്കായി ‘ഇതാ’ നിലനിർത്തി; ഗ്രീക്കിലെ ബഹുവചനം ‘ആകാശങ്ങൾ’ എന്നും, പൂർണകാലത്തിന്റെ ഫലാവസ്ഥ ‘തുറന്നിരിക്കുന്നതും’ എന്നും നൽകി. വാക്യത്തിന്റെ സമാന്തര ഘടന മലയാളത്തിൽ സുതാര്യമാക്കാൻ ‘തുറന്നിരിക്കുന്നതും … നിൽക്കുന്നതും ഞാൻ കാണുന്നു’ എന്ന ക്രമം സ്വീകരിച്ചു.
