id: ACT.7.32
reference: Acts 7:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ ὁ θεὸς τῶν πατέρων σου, ὁ θεὸς Ἀβραὰμ ⸀καὶ Ἰσαὰκ ⸁καὶ Ἰακώβ. ἔντρομος δὲ γενόμενος Μωϋσῆς οὐκ ἐτόλμα κατανοῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: ml
  text: “ഞാൻ നിന്റെ പൂർവപിതാക്കന്മാരുടെ ദൈവമാണ്—അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം.” അപ്പോൾ മോശെ ഭയന്നുവിറച്ചു; സൂക്ഷിച്ചു നോക്കാൻ ധൈര്യപ്പെട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൂക്ഷ്മമായി നിരീക്ഷിക്കാൻ’ അല്ലെങ്കിൽ ‘ശ്രദ്ധാപൂർവം പരിശോധിക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് സൂക്ഷിച്ചു നോക്കുക, ശ്രദ്ധാപൂർവം പരിഗണിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: ഞാൻ നിന്റെ പൂർവപിതാക്കന്മാരുടെ ദൈവമാണ്
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് തിരിച്ചറിയൽവാക്യത്തിൽ ഊന്നലുള്ള Ἐγώ ഉണ്ട്. സ്വാഭാവിക മലയാളത്തിനായി ‘ആണ്’ ചേർത്തു. πατέρων എന്നതിന്റെ വംശപരവും ഉടമ്പടിസംബന്ധവുമായ ഭാവം വ്യക്തമാക്കാൻ ‘പൂർവപിതാക്കന്മാർ’ എന്നു നൽകി.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം
  rationale: ഓരോ പേരിനെയും ബന്ധിപ്പിക്കുന്ന ആവർത്തിത καί-യുടെ താളവും ഓരോരുത്തരുമായുള്ള ബന്ധവും ‘-ന്റെയും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
- source_word: ἔντρομος δὲ γενόμενος
  choice: അപ്പോൾ മോശെ ഭയന്നുവിറച്ചു
  rationale: ἔντρομος ഭയത്തെയും വിറയലിനെയും സൂചിപ്പിക്കാം. ഗ്രീക്ക് കൃതന്തഘടനയെ സ്വാഭാവിക മലയാളത്തിലെ സമാപികാക്രിയയായി മാറ്റി; δέ ഇവിടെ നേരിയ ആഖ്യാനമാറ്റമായി ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: οὐκ ἐτόλμα
  choice: ധൈര്യപ്പെട്ടില്ല
  rationale: τολμάω എന്നതിന്റെ ‘ചെയ്യാൻ തുനിയുക/ധൈര്യപ്പെടുക’ എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατανοῆσαι
  choice: സൂക്ഷിച്ചുനോക്കാൻ
  rationale: കാഴ്ചയുടെ ഈ സന്ദർഭത്തിൽ ക്രിയ സൂക്ഷ്മമായി നോക്കുക എന്ന concrete അർഥം നൽകുന്നു; ശ്രദ്ധാപൂർവം നിരീക്ഷിക്കുക അല്ലെങ്കിൽ പരിശോധിക്കുക എന്ന വിപുലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: പുറപ്പാട് ഉദ്ധരണിയിലെ ദൈവിക സ്വയംപരിചയപ്പെടുത്തൽ
  choice: ഞാൻ നിന്റെ പൂർവപിതാക്കന്മാരുടെ ദൈവമാണ്
  alternative: ഞാൻ—നിന്റെ പൂർവപിതാക്കന്മാരുടെ ദൈവം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ബന്ധകക്രിയ ഇല്ലെങ്കിലും മലയാളത്തിലെ പൂർണവും സ്വാഭാവികവുമായ തിരിച്ചറിയൽവാക്യത്തിന് ‘ആണ്’ ആവശ്യമാണ്. ഇത് ഉദ്ധരണിയുടെ പ്രഖ്യാപനശക്തി നിലനിർത്തുന്നു; അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പിതാക്കന്മാർ’ എന്നതിനെക്കാൾ വംശപരമായ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘പൂർവപിതാക്കന്മാർ’ ഉപയോഗിച്ചു; വ്യക്തിനാമങ്ങൾക്ക് മലയാള ബൈബിൾപരമ്പരയിൽ സുപരിചിതമായ രൂപങ്ങൾ നിലനിർത്തി.
