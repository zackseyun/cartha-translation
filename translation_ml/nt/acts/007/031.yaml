id: ACT.7.31
reference: Acts 7:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: ml
  text: 'മോശ അത് കണ്ടപ്പോൾ, ആ കാഴ്ചയിൽ[a] അത്ഭുതപ്പെട്ടു. സൂക്ഷിച്ചുനോക്കാൻ അവൻ അടുത്തുചെന്നപ്പോൾ, കർത്താവിന്റെ[c] ശബ്ദം ഉണ്ടായി[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ ദർശനത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ὅραμα എന്ന ഗ്രീക്ക് പദം ദൃശ്യമായ ഒരു പ്രത്യക്ഷതയെയോ ദർശനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവിന്റെ ശബ്ദം വന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: പുറപ്പാട് 3-ലെ സംഭവമാണ് ഇവിടെ അനുസ്മരിപ്പിക്കപ്പെടുന്നത് എന്നതിനാൽ ചിലർ ‘യഹോവയുടെ’ എന്നു പ്രതീക്ഷിച്ചേക്കാം; എന്നാൽ ഇവിടത്തെ ഗ്രീക്ക് പാഠത്തിൽ κύριος (‘കർത്താവ്’) എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐθαύμασεν
  choice: അത്ഭുതപ്പെട്ടു
  rationale: θαυμάζω ഇവിടെ വിസ്മയവും ആശ്ചര്യവും സൂചിപ്പിക്കുന്നു; ‘അത്ഭുതപ്പെട്ടു’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: τὸ ὅραμα
  choice: ആ കാഴ്ച
  rationale: ὅραμα ദൃശ്യമായ പ്രത്യക്ഷതയെയോ ദർശനത്തെയോ സൂചിപ്പിക്കാം. കത്തിക്കൊണ്ടിരുന്ന മുൾപ്പടർപ്പെന്ന ദൃശ്യപ്രതിഭാസത്തോടുള്ള മോശയുടെ പ്രതികരണമാണ് സന്ദർഭം; അതിനാൽ ‘ആ കാഴ്ച’ തെരഞ്ഞെടുത്തു, ‘ദർശനം’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: προσερχομένου
  choice: അടുത്തുചെന്നപ്പോൾ
  rationale: αὐτοῦ സഹിതമുള്ള genitive absolute സമീപിച്ചുകൊണ്ടിരുന്ന സമയസാഹചര്യം വ്യക്തമാക്കുന്നു; ‘അടുത്തുചെന്നപ്പോൾ’ ചലനവും സമയബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατανοῆσαι
  choice: സൂക്ഷിച്ചുനോക്കാൻ
  rationale: κατανοέω ശ്രദ്ധാപൂർവം നിരീക്ഷിക്കുക എന്ന അർഥത്തിലാണ്; ദൃശ്യസന്ദർഭത്തിൽ ‘സൂക്ഷിച്ചുനോക്കാൻ’ കൃത്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പവുമാണ്.
- source_word: ἐγένετο φωνὴ
  choice: ഒരു ശബ്ദം വന്നു
  rationale: ἐγένετο + നാമം ഒരു സംഭവം ഉണ്ടായതിനെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയാണ്. ‘ഒരു ശബ്ദം വന്നു’ അതിന്റെ സംഭവസ്വഭാവം നിലനിർത്തുന്നു; ‘കേട്ടു’ എന്ന് പരിഭാഷപ്പെടുത്തുന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത ശ്രവണദൃഷ്ടികോണം ചേർക്കും.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദം ഇവിടെ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി. φωνὴ κυρίου എന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കർത്താവിന്റെ ഒരു ശബ്ദം’ എന്നു വരുന്നു.
theological_decisions:
- issue: ദൈവപ്രത്യക്ഷതയുടെ സന്ദർഭത്തിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: പുറപ്പാട് 3-ലെ ദൈവപ്രത്യക്ഷതയാണ് ഈ ഭാഗത്തിന്റെ പശ്ചാത്തലമെങ്കിലും, ഇവിടെ ഗ്രീക്ക് പാഠത്തിലുള്ളത് κύριος ആണ്, യഹോവയുടെ എബ്രായ നാമരൂപമല്ല. അതിനാൽ മൂലപാഠത്തിന്റെ രൂപം പിന്തുടർന്ന് ‘കർത്താവ്’ എന്നു നൽകി; പശ്ചാത്തലത്തെ അടിസ്ഥാനമാക്കിയുള്ള ‘യഹോവ’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘കണ്ടപ്പോൾ’, ‘അടുത്തുചെന്നപ്പോൾ’ എന്നീ രൂപങ്ങൾ ഗ്രീക്കിലെ participial ഘടനകളുടെ സമയബന്ധം സ്വാഭാവികമാക്കുന്നു. ‘ഒരു ശബ്ദം വന്നു’ അല്പം ഔപചാരികമാണെങ്കിലും ἐγένετο φωνὴ എന്ന സംഭവാവതരണത്തെ അധിക വ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
