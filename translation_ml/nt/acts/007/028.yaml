id: ACT.7.28
reference: Acts 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἀνελεῖν με σὺ θέλεις ὃν τρόπον ἀνεῖλες ⸀ἐχθὲς τὸν Αἰγύπτιον;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/028.yaml
  text: Do you want to kill me the way you killed the Egyptian yesterday?
translation:
  language: ml
  text: ‘ഇന്നലെ ആ ഈജിപ്തുകാരനെ കൊന്നതുപോലെ എന്നെയും കൊല്ലാനാണോ നിന്റെ ഉദ്ദേശ്യം?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: …ആണോ നിന്റെ ഉദ്ദേശ്യം?
  rationale: പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക മറുപടിയുടെ സൂചനയുള്ള ഗ്രീക്ക് ചോദ്യത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ ആശങ്കയും വെല്ലുവിളിയും നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: കൊല്ലാൻ / കൊന്നതുപോലെ
  rationale: ഈ സന്ദർഭത്തിൽ αἱρέω എന്ന ക്രിയയുടെ അർഥം ‘കൊല്ലുക’ എന്നതാണ്; ഭാവിക്രിയാഭാവവും ഭൂതകാലക്രിയയും വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: ὃν τρόπον
  choice: കൊന്നതുപോലെ
  rationale: ‘ഏതു വിധത്തിൽ/എങ്ങനെയോ അതുപോലെ’ എന്ന താരതമ്യബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: ἐχθὲς τὸν Αἰγύπτιον
  choice: ഇന്നലെ ആ ഈജിപ്തുകാരനെ
  rationale: ἐχθές എന്ന സമയസൂചനയും നിർദിഷ്ടനായ ഈജിപ്തുകാരനെ സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിളിന്റെ നിർദിഷ്ടതയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആരോപണവും ഭയവും കലർന്ന നേരിട്ടുള്ള ചോദ്യത്തിന്റെ ഭാവം നിലനിർത്തുന്ന, ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ പ്രസംഗമാണെന്ന് വ്യക്തമാക്കുന്നു.
