id: ACT.7.42
reference: Acts 7:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: ml
  text: 'എന്നാൽ ദൈവം അവരിൽനിന്ന് തിരിഞ്ഞുകളഞ്ഞ് ആകാശസൈന്യത്തെ സേവിക്കാൻ[a] അവരെ ഏല്പിച്ചുകൊടുത്തു. പ്രവാചകന്മാരുടെ പുസ്തകത്തിൽ[d] എഴുതിയിരിക്കുന്നതുപോലെ: “ഇസ്രായേൽഗൃഹമേ, മരുഭൂമിയിൽ നാല്പതു വർഷം നിങ്ങൾ എനിക്ക് അറുക്കപ്പെട്ട വഴിപാടുകളും യാഗങ്ങളും അർപ്പിച്ചുവോ?[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആകാശസൈന്യത്തെ ആരാധിക്കാൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് മതപരമായി സേവിക്കുക എന്നും ആരാധിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ആകാശസൈന്യം” എന്നത് ആകാശഗോളങ്ങളെയും, വിപുലമായ അർഥത്തിൽ വിഗ്രഹാരാധനയിൽ അവയുമായി ബന്ധപ്പെടുത്തിയ സ്വർഗീയ ശക്തികളെയും സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: c
    text: ആമോസ് 5:25-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: d
    text: അഥവാ, “പ്രവാചകന്മാരുടെ ചുരുളിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστρεψεν
  choice: അവരിൽനിന്ന് തിരിഞ്ഞുകളഞ്ഞ്
  rationale: തുടർന്നുവരുന്ന ന്യായവിധിയുടെ ഭാഷയോടൊപ്പം, വെറും തിരിയലല്ല ദൈവത്തിന്റെ ബന്ധപരമായ പിന്മാറ്റമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: παρέδωκεν
  choice: ഏല്പിച്ചുകൊടുത്തു
  rationale: കലാപത്തിനുള്ള ന്യായവിധിയായി അവരെ അവരുടെ വിഗ്രഹാരാധനയ്ക്ക് വിട്ടുകൊടുക്കുന്ന ഗൗരവമുള്ള അർഥം നിലനിർത്തുന്നു; ദൈവം പാപത്തിന് പ്രേരിപ്പിച്ചു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: λατρεύειν
  choice: സേവിക്കാൻ
  rationale: ആരാധനാപരമായ സേവനവും ആരാധനയും സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് ക്രിയയുടെ വിശാലത നിലനിർത്തുന്നു; ‘ആരാധിക്കാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: ആകാശസൈന്യത്തെ
  rationale: ആകാശഗോളങ്ങളെയോ അവയുമായി ബന്ധപ്പെടുത്തിയ സ്വർഗീയ ശക്തികളെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗം കഴിയുന്നത്ര രൂപപരമായി നിലനിർത്തുന്നു.
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ പുസ്തകത്തിൽ
  rationale: βίβλος എന്നത് പുസ്തകമോ ചുരുളോ ആകാം; സാധാരണ വായനയ്ക്ക് ‘പുസ്തകം’ സ്വാഭാവികമാണ്, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലുണ്ട്.
- source_word: σφάγια καὶ θυσίας
  choice: അറുക്കപ്പെട്ട വഴിപാടുകളും യാഗങ്ങളും
  rationale: σφάγιαയിലെ അറുക്കലിന്റെ സൂക്ഷ്മതയും θυσίαςയിലെ പൊതുവായ യാഗാർഥവും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: Μὴ ... προσηνέγκατέ μοι
  choice: നിങ്ങൾ എനിക്ക് ... അർപ്പിച്ചുവോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തെ സ്വാഭാവിക മലയാള ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; സന്ദർഭം അതിന്റെ കുറ്റാരോപണഭാവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ന്യായവിധിയിലെ ദൈവിക പ്രവർത്തനം
  choice: ദൈവം അവരിൽനിന്ന് തിരിഞ്ഞ് അവരെ ഏല്പിച്ചുകൊടുത്തു
  alternative: ദൈവം അവരെ വിഗ്രഹാരാധന ചെയ്യിച്ചു / വെറുതെ അനുവദിച്ചു
  rationale: രണ്ട് ക്രിയകളും മുൻകലാപത്തോടുള്ള ന്യായവിധിപരമായ പിന്മാറ്റം സൂചിപ്പിക്കുന്നു. ദൈവം അവരുടെ പാപത്തിന്റെ കർത്താവാണെന്നോ പ്രവർത്തനം വെറും അനുമതിമാത്രമാണെന്നോ വിവർത്തനം വിധിച്ചുറപ്പിക്കുന്നില്ല.
- issue: ‘ആകാശസൈന്യം’ എന്നതിന്റെ സൂചന
  choice: വ്യാപ്തി ചുരുക്കാതെ പരമ്പരാഗത ബൈബിൾ പ്രയോഗം നിലനിർത്തി
  alternative: നക്ഷത്രങ്ങൾ മാത്രം / ദൂതന്മാർ മാത്രം
  rationale: ഈ സന്ദർഭത്തിൽ ആകാശഗോളങ്ങളെയും അവയുമായി ബന്ധപ്പെടുത്തിയ ശക്തികളെയും സൂചിപ്പിക്കാം; ഒരു പ്രത്യേക സൂചനയിലേക്ക് മുഖ്യപാഠം ചുരുക്കുന്നില്ല.
- issue: ആമോസ് 5:25-ലെ അലങ്കാരചോദ്യത്തിന്റെ അർഥം
  choice: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യം അതേപടി നിലനിർത്തി
  alternative: ‘നിങ്ങൾ എനിക്ക് അർപ്പിച്ചില്ല’ എന്ന പ്രഖ്യാപനമായി മാറ്റുക
  rationale: ചോദ്യരൂപം മൂലപാഠത്തിന്റെ വാഗ്‌ശൈലിയും, മരുഭൂമിയിലെ യാഗങ്ങളെക്കുറിച്ചുള്ള വചനത്തിലെ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഇസ്രായേൽഗൃഹമേ’, ‘യാഗങ്ങൾ’, ‘പ്രവാചകന്മാർ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമായ ‘ആകാശസൈന്യം’ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
