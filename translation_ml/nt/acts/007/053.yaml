  text: οἵτινες ἐλάβετε τὸν νόμον εἰς διαταγὰς ἀγγέλων, καὶ οὐκ ἐφυλάξατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/053.yaml
  text: you who received the law as delivered by angels[a], and did not keep it.
translation:
  language: ml
  text: ദൈവദൂതന്മാരുടെ ക്രമീകരണങ്ങളനുസരിച്ച് ന്യായപ്രമാണം ലഭിച്ച നിങ്ങൾ അതു പാലിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവദൂതന്മാരിലൂടെ” അല്ലെങ്കിൽ “ദൈവദൂതന്മാരുടെ നിർദേശപ്രകാരം.” ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്. ന്യായപ്രമാണം നൽകപ്പെട്ടതിൽ ദൈവദൂതന്മാർക്ക് പങ്കുണ്ടായിരുന്നുവെന്നാണ് ഇതു സൂചിപ്പിക്കുന്നത്; ആ പങ്കിന്റെ കൃത്യമായ രീതി വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ലഭിച്ചവരായിട്ടും നിങ്ങൾ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള കുറ്റാരോപണം നിലനിർത്തുന്നു. തുടർന്നുള്ള ‘പാലിച്ചില്ല’ എന്ന വിരുദ്ധത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കാൻ ‘-ആയിട്ടും’ ഉപയോഗിച്ചു.
- source_word: ἐλάβετε
  choice: ലഭിച്ച
  rationale: നിയമം കൈപ്പറ്റിയതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും അർത്ഥനിഷ്ഠവുമായ പ്രയോഗം; മനസ്സോടെ അംഗീകരിച്ചു എന്ന അധിക സൂചന ഒഴിവാക്കുന്നു.
- source_word: τὸν νόμον
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ മോശൈക നിയമത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സന്ദർഭത്തിൽ വ്യക്തവുമായ പദം.
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: ദൂതന്മാരുടെ മധ്യസ്ഥതയിൽ
  rationale: ദുഷ്കരമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മുഖ്യ ആശയമായ നിയമദാനത്തിലെ ദൂതന്മാരുടെ പങ്ക് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആ മധ്യസ്ഥതയുടെ കൃത്യമായ രീതി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀγγέλων
  choice: ദൂതന്മാർ
  rationale: ഈ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകരെയല്ല, നിയമദാനവുമായി ബന്ധപ്പെട്ട സ്വർഗീയ ജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οὐκ ἐφυλάξατε
  choice: നിങ്ങൾ അത് പാലിച്ചില്ല
  rationale: നിയമത്തെ അനുസരിച്ച് ആചരിക്കുക എന്ന φυλάσσωയുടെ സന്ദർഭോചിത അർത്ഥം വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘അത്’ എന്നത് ഗ്രീക്കിൽ ഉൾക്കൊള്ളുന്ന കർമത്തെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: εἰς διαταγὰς ἀγγέλων എന്ന പ്രയോഗത്തിലെ ദൂതന്മാരുടെ പങ്ക്
  choice: നിയമം ദൂതന്മാരുടെ മധ്യസ്ഥതയിൽ ലഭിച്ചു
  alternative: ദൂതന്മാരുടെ ക്രമീകരണങ്ങളിലൂടെ / ദൂതന്മാരുടെ നിർദേശപ്രകാരം നിയമം ലഭിച്ചു
  rationale: വാക്യം നിയമദാനത്തിൽ ദൂതന്മാർക്ക് പങ്കുണ്ടെന്ന പാരമ്പര്യം സൂചിപ്പിക്കുന്നു; എന്നാൽ διαταγαί എന്നതിന്റെ കൃത്യമായ സൂക്ഷ്മാർഥം വിവാദമായതിനാൽ മധ്യസ്ഥതയുടെ സംവിധാനം അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; ദുഷ്കരമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
