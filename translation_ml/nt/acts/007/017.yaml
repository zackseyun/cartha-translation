id: ACT.7.17
reference: Acts 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καθὼς δὲ ἤγγιζεν ὁ χρόνος τῆς ἐπαγγελίας ἧς ⸀ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ, ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη ἐν Αἰγύπτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/017.yaml
  text: But as the time of the promise that God had made to Abraham was drawing near[a], the people increased and multiplied in Egypt,
translation:
  language: ml
  text: എന്നാൽ ദൈവം അബ്രാഹാമിനോടു ചെയ്ത വാഗ്ദത്തത്തിന്റെ സമയം അടുത്തുകൊണ്ടിരിക്കെ[a], ഈജിപ്തിൽ ജനത വർധിക്കുകയും പെരുകുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവം അബ്രാഹാമിനു വാഗ്ദത്തം നൽകിയ സമയമോ’ ‘ദൈവം അബ്രാഹാമിനു ഉറപ്പുനൽകിയ വാഗ്ദത്തത്തിന്റെ സമയമോ.’ ഇവിടെ ഗ്രീക്ക് ക്രിയ ദൈവം പ്രഖ്യാപിച്ച പ്രതിബദ്ധതയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς δὲ
  choice: എന്നാൽ ... വന്നപ്പോൾ
  rationale: καθώς എന്നതിന്റെ കാലസംബന്ധമായ അർഥം ‘വന്നപ്പോൾ’ എന്നും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആശയമാറ്റം ‘എന്നാൽ’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ശക്തമായ വൈരുധ്യം ചുമത്തുന്നില്ല.
- source_word: ἤγγιζεν
  choice: അടുത്തുവന്നപ്പോൾ
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന പുരോഗമിച്ചുകൊണ്ടിരുന്ന സമീപനം ഈ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: വാഗ്ദത്തത്തിന്റെ സമയം
  rationale: χρόνος എന്ന പൊതുവായ ‘സമയം’ എന്ന അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘നിശ്ചിത സമയം’ എന്ന ആശയം ചേർക്കുന്നില്ല. ἐπαγγελίαയ്ക്ക് മാന്യവും പരിചിതവുമായ ‘വാഗ്ദത്തം’ ഉപയോഗിക്കുന്നു.
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: ദൈവം അബ്രാഹാമിനോടു ചെയ്ത
  rationale: ‘വാഗ്ദത്തം ചെയ്യുക’ എന്ന സ്വാഭാവിക മലയാള സംയോജനത്തിൽ ὡμολόγησεν എന്നത് സന്ദർഭാനുസൃതമായി നൽകുന്നു. ‘സത്യം ചെയ്തു’ എന്ന് പരിഭാഷപ്പെടുത്തി മൂലത്തിൽ ഇല്ലാത്ത ശപഥഭാവം ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ηὔξησεν ὁ λαὸς καὶ ἐπληθύνθη
  choice: ജനം വർധിച്ചു പെരുകി
  rationale: രണ്ടു ക്രിയകളുടെയും വേറിട്ട അർഥനിറങ്ങൾ ‘വർധിച്ചു’, ‘പെരുകി’ എന്നിങ്ങനെ നിലനിർത്തുന്നു; λαός ഇവിടെ ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν Αἰγύπτῳ
  choice: ഈജിപ്തിൽ
  rationale: ലളിതമായ സ്ഥലസൂചനയെ ആധുനിക മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ദേശനാമത്തോടെ നൽകുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനോടുള്ള ദൈവത്തിന്റെ വാഗ്ദത്തവുമായി ബന്ധപ്പെട്ട ὡμολόγησεν എന്ന ക്രിയയുടെ പരിഭാഷ
  choice: ‘ദൈവം അബ്രാഹാമിനോടു ചെയ്ത വാഗ്ദത്തം’
  alternative: ‘ദൈവം അബ്രാഹാമിനോടു വാഗ്ദാനം ചെയ്ത വാഗ്ദത്തം’; ‘ദൈവം അബ്രാഹാമിനോടു ഉറപ്പുനൽകിയ വാഗ്ദത്തം’; ‘ദൈവം അബ്രാഹാമിനോടു സത്യം ചെയ്ത വാഗ്ദത്തം’
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ പ്രഖ്യാപിതമായ പ്രതിബദ്ധതയെ സൂചിപ്പിക്കാം. ‘വാഗ്ദത്തം ചെയ്തു’ എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; ‘സത്യം ചെയ്തു’ എന്നത് മൂലക്രിയ നിർബന്ധമായി സൂചിപ്പിക്കാത്ത ശപഥഭാവം ചേർക്കും. പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വാഗ്ദത്തം’ ബൈബിൾപരമായ പരിചിതത്വം നിലനിർത്തുമ്പോഴും ഇപ്പോഴും വ്യക്തമാണ്. വാക്യത്തിന്റെ കാലസംബന്ധമായ പുരോഗതിയും ഇരട്ട വളർച്ചാക്രിയകളും സംരക്ഷിച്ചിട്ടുണ്ട്.
