- from: എന്നാൽ ദൈവം അബ്രാഹാമിനോടു ചെയ്ത വാഗ്ദത്തത്തിന്റെ സമയം അടുത്തുവന്നപ്പോൾ[a], ഈജിപ്തിൽ ജനം വർധിച്ചു പെരുകി.
  to: എന്നാൽ ദൈവം അബ്രാഹാമിനോടു ചെയ്ത വാഗ്ദത്തത്തിന്റെ സമയം അടുത്തുകൊണ്ടിരിക്കെ[a], ഈജിപ്തിൽ ജനത വർധിക്കുകയും പെരുകുകയും ചെയ്തു.
  rationale: The revision preserves the Greek imperfect's progressive sense, makes the collective reference of λαός clearer, and replaces a redundant footnote alternative with natural Malayalam. It retains the established term ‘വാഗ്ദത്തം’ and does not introduce oath-language or theological interpretation.
