  yaml_path: translation/nt/acts/007/047.yaml
  text: But Solomon built a house for him[a].
translation:
  language: ml
  text: എന്നാൽ ശലോമോൻ അവനുവേണ്ടി ഒരു ഭവനം പണിതു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ദേവാലയം’; ഗ്രീക്കിൽ ‘ഒരു ഭവനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Σολομῶν
  choice: ശലോമോൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾ രൂപം; പേര് വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നേരിയ വൈരുധ്യവും ചരിത്രവിവരണത്തിലെ മുന്നോട്ടുള്ള നീക്കവും സൂചിപ്പിക്കുന്നു.
- source_word: οἰκοδόμησεν
  choice: പണിതു
  rationale: ഇവിടെ ക്രിയ ഒരു കെട്ടിടത്തിന്റെ യഥാർഥ നിർമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പ്രയോഗം.
- source_word: αὐτῷ
  choice: അവനുവേണ്ടി
  rationale: സന്ദർഭത്തിൽ സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു; ഉദ്ദേശ്യവും സമർപ്പണവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ദാതൃപ്രയോഗം.
- source_word: οἶκον
  choice: ഒരു ഭവനം
  rationale: ഗ്രീക്കിലെ പൊതുവായ ‘വീട്/ഭവനം’ എന്ന പദപ്രയോഗം നിലനിർത്തുകയും, ദൈവത്തിനുള്ള ‘ഭവനം’ എന്ന ക്ഷേത്രഭാഷയുടെ ഗൗരവവും തുടർന്നുള്ള വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: οἶκον എന്നത് ‘ഭവനം’ എന്നോ വ്യാഖ്യാനാത്മകമായി ‘ദേവാലയം’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ഭവനം
  alternative: ദേവാലയം
  rationale: മൂലപാഠം പ്രത്യേകമായ ναός/ἱερόν എന്നതിനു പകരം സാധാരണയായ οἶκος ഉപയോഗിക്കുന്നു. ‘ഭവനം’ എന്നു നൽകുന്നത് സ്തെഫാനൊസിന്റെ പദപ്രയോഗവും കൈകൊണ്ടു പണിത ഭവനങ്ങളിൽ അത്യുന്നതൻ വസിക്കുന്നില്ലെന്ന തുടർന്നുള്ള പ്രസ്താവനയുമായുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; സന്ദർഭപരമായ അർഥമായ ‘ദേവാലയം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വീട്’ എന്നതിനേക്കാൾ ‘ഭവനം’ ക്ഷേത്രസംബന്ധമായ പ്രതിധ്വനിയും വാക്യത്തിന്റെ ഔപചാരിക ഗൗരവവും നന്നായി സംരക്ഷിക്കുന്നു.
