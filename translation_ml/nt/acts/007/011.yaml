id: ACT.7.11
reference: Acts 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: ml
  text: ഈജിപ്തിലും കനാനിലും ഉടനീളം ക്ഷാമവും വലിയ ദുരിതവും ഉണ്ടായി; നമ്മുടെ പിതാക്കന്മാർ[a] ഭക്ഷ്യസാധനങ്ങൾ കണ്ടെത്താൻ കഴിഞ്ഞില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ പൂർവികർ.” ഗ്രീക്കിൽ “നമ്മുടെ പിതാക്കന്മാർ” എന്നാണ്; ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ
  choice: അപ്പോൾ ... ഉണ്ടായി
  rationale: δέ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ἦλθεν ക്ഷാമം സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. മലയാളത്തിൽ ‘അപ്പോൾ ... ഉണ്ടായി’ സ്വാഭാവികമായി ഈ രണ്ടിന്റെയും ബലം നൽകുന്നു.
- source_word: λιμὸς
  choice: ക്ഷാമം
  rationale: വ്യാപകമായ ഭക്ഷ്യക്ഷാമം എന്ന അർഥത്തിന് ആധുനിക മലയാളത്തിലെ കൃത്യവും സാധാരണവുമായ പദം.
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: ഈജിപ്തിലും കനാനിലും എല്ലായിടത്തും
  rationale: ἐπί + accusative സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയും ὅλην നൽകുന്ന സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θλῖψις μεγάλη
  choice: വലിയ കഷ്ടത
  rationale: ക്ഷാമത്തോടൊപ്പമുള്ള കടുത്ത ദുരിതമാണ് ഇവിടെ ഉദ്ദേശ്യം; അന്ത്യകാലസംബന്ധിയായ പ്രത്യേക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὐχ ηὕρισκον
  choice: കണ്ടെത്താൻ കഴിഞ്ഞില്ല
  rationale: imperfect രൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രായോഗിക അസമർഥത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χορτάσματα
  choice: ആഹാരം
  rationale: ഭക്ഷണസാധനങ്ങൾ എന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘ധാന്യം’ എന്നത് അനാവശ്യമായി അർഥം ചുരുക്കും.
- source_word: οἱ πατέρες ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ കുടുംബപദവും ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരിലേക്കുള്ള പരാമർശവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൂർവികരെ സൂചിപ്പിക്കുന്ന ലിംഗനിർദിഷ്ട ഭാഷ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: οἱ πατέρες ἡμῶν അക്ഷരാർഥത്തിൽ ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നാണ്; രക്ഷാചരിത്രത്തിലെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. അതിനാൽ ഉറവിടത്തിലെ പുരുഷലിംഗ പരാമർശം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് ഉറവിടത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയും തുടർച്ചയായ ദുരിതവും ലിംഗനിർദിഷ്ട പൂർവികഭാഷയും സംരക്ഷിച്ചു.
