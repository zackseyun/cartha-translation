source:
  edition: SBLGNT
  text: ἔφυγεν δὲ Μωϋσῆς ἐν τῷ λόγῳ τούτῳ, καὶ ἐγένετο πάροικος ἐν γῇ Μαδιάμ, οὗ ἐγέννησεν υἱοὺς δύο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/029.yaml
  text: So Moses fled at this word[a], and became a sojourner in the land of Midian[b], where he fathered two sons.
translation:
  language: ml
  text: ഈ വാക്കിനെത്തുടർന്ന് മോശെ പലായനം ചെയ്തു[a]. അവൻ മിദ്യാൻദേശത്ത് ഒരു പരദേശവാസിയായി താമസിച്ചു[b]. അവിടെ അവൻ രണ്ടു പുത്രന്മാരുടെ പിതാവായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ പ്രസ്താവന നിമിത്തം.” ഗ്രീക്കിലെ പ്രയോഗം ഈ വാക്കാണ് മോശെയുടെ പലായനത്തിന് ഉടൻ കാരണമായതെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വിദേശിയായി ജീവിച്ചു” അല്ലെങ്കിൽ “അന്യദേശവാസിയായി.” സ്വന്തം നാടല്ലാത്ത ദേശത്തു താമസിക്കുന്ന ഒരാളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: ഓടിപ്പോയി
  rationale: φεύγω എന്ന ക്രിയയുടെ പെട്ടെന്നുള്ള പലായനഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ആഖ്യാനത്തിന്റെ തുടർച്ചയും മുൻസംഭവത്തിൽനിന്നുള്ള ഫലബന്ധവും സൂചിപ്പിക്കുന്നു; ‘ഈ വാക്കു കേട്ടപ്പോൾ’ എന്ന ഘടനയിൽ ആ ബന്ധം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: ഈ വാക്കു കേട്ടപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയാണ് മോശെയുടെ പലായനത്തിന് ഉടൻ കാരണമായതെന്ന ആശയം നൽകുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗത്തിനുള്ള കാരണാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐγένετο πάροικος
  choice: പരദേശിയായി താമസിച്ചു
  rationale: സ്വദേശമല്ലാത്ത സ്ഥലത്ത് വിദേശവാസിയായി കഴിയുന്ന πάροικος എന്ന പദത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν γῇ Μαδιάμ
  choice: മിദ്യാൻദേശത്ത്
  rationale: γῇ എന്ന ഭൂമിശാസ്ത്രപരമായ ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
- source_word: οὗ
  choice: അവിടെ
  rationale: മിദ്യാൻദേശത്തേക്കു തിരിച്ചുചൂണ്ടുന്ന സ്ഥലസൂചകബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγέννησεν
  choice: അവന് … ജനിച്ചു
  rationale: പുരുഷകർത്താവായ മോശെ രണ്ടു പുത്രന്മാരുടെ പിതാവായി എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; ‘ജനിപ്പിച്ചു’ എന്ന അസ്വാഭാവികമോ തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: υἱοὺς δύο
  choice: രണ്ടു പുത്രന്മാർ
  rationale: പദസമുച്ചയത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാള തുല്യം.
