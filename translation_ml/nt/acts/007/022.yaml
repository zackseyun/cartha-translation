  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: ml
  text: മോശെ ഈജിപ്തുകാരുടെ സകല ജ്ഞാനത്തിലും വിദ്യാഭ്യാസം നേടി; തന്റെ വാക്കുകളിലും പ്രവൃത്തികളിലും അദ്ദേഹം പ്രബലനായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സംസാരത്തിലും പ്രവർത്തനത്തിലും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: വിദ്യാഭ്യാസം നേടി
  rationale: പαιδεύω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ഇവിടെ മോശെയ്ക്കു ലഭിച്ച പരിശീലനവും വിദ്യാഭ്യാസവും സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗമാണിത്.
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: ഈജിപ്തുകാരുടെ സകല ജ്ഞാനത്തിലും
  rationale: ദത്തിവ് രൂപം വിദ്യാഭ്യാസത്തിന്റെ വിഷയമേഖലയായി അവതരിപ്പിക്കുകയും πάσῃയുടെ വ്യാപ്തിയും Αἰγυπτίων എന്ന ജനസംബന്ധിയായ ജനിറ്റീവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δυνατὸς
  choice: പ്രബലനായിരുന്നു
  rationale: δυνατός എന്ന പദത്തിലെ ശക്തി, പ്രാപ്തി, ഫലപ്രാപ്തി എന്നീ ഭാവങ്ങൾ 'പ്രബലൻ' സംക്ഷിപ്തമായും മാന്യമായും പകരുന്നു.
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: വാക്കുകളിലും പ്രവൃത്തികളിലും
  rationale: λόγοις / ἔργοις എന്ന സമാന്തരയുഗ്മം അടുത്തായി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളപ്രയോഗം നൽകുന്നു.
- source_word: αὐτοῦ
  choice: തന്റെ
  rationale: വാക്യത്തിലെ കർത്താവായ മോശെയിലേക്കാണ് സർവനാമം സ്വാഭാവികമായി മടങ്ങുന്നത്; മലയാളത്തിൽ ആത്മവാചകമായ 'തന്റെ' ആ ബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: λόγοις എന്നതിൽ മോശെയുടെ പ്രാപ്തിയുടെ വ്യാപ്തി
  choice: പുറപ്പാട് 4:10-നോടു പൊരുത്തപ്പെടുത്താൻ വ്യാഖ്യാനപരമായി മാറ്റാതെ, 'തന്റെ വാക്കുകളിലും പ്രവൃത്തികളിലും അദ്ദേഹം പ്രബലനായിരുന്നു' എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: '''സംസാരത്തിലും പ്രവർത്തനത്തിലും പ്രാപ്തനായിരുന്നു'' എന്നു കൂടുതൽ സ്വതന്ത്രമായി പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ ഇത് മോശെയുടെ സ്വന്തം വാക്കുകളെക്കാൾ അവയുടെ ഫലത്തെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു വ്യാഖ്യാനിക്കുക.'
  rationale: സ്തെഫാനോസിന്റെ പ്രസ്താവന അതിന്റെ സ്വന്തം അർത്ഥത്തിൽ നിലനിർത്തണം. പുറപ്പാട് 4:10-ൽ മോശെ തന്റെ വാഗ്‌ചാതുര്യക്കുറവ് പറയുന്നതുമായുള്ള പ്രത്യക്ഷമായ പിരിമുറുക്ക് പരിഭാഷയിൽ മായ്ച്ചുകളയാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തരഘടനയും വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തിയിരിക്കുന്നു.
