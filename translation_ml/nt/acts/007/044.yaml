id: ACT.7.44
reference: Acts 7:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ σκηνὴ τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν κατὰ τὸν τύπον ὃν ἑωράκει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/044.yaml
  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: ml
  text: മരുഭൂമിയിൽ നമ്മുടെ പിതാക്കന്മാരോടുകൂടെ സാക്ഷ്യത്തിന്റെ കൂടാരം[a] ഉണ്ടായിരുന്നു. മോശയോടു സംസാരിക്കുന്നവൻ[c] മോശ കണ്ടിരുന്ന മാതൃകയനുസരിച്ച് അത് നിർമിക്കണമെന്ന് നിർദേശിച്ചതുപോലെയായിരുന്നു ആ കൂടാരം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാക്ഷ്യകൂടാരം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘മോശയോടു സംസാരിച്ചവൻ.’ സന്ദർഭാർഥം വ്യക്തമാക്കി ‘മോശയോടു സംസാരിച്ച ദൈവം/കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് സംസാരിക്കുന്നയാളെ പേരിട്ട് പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: “സാക്ഷ്യത്തിന്റെ കൂടാരം”
  rationale: σκηνήയുടെ അടിസ്ഥാന അർഥമായ കൊണ്ടുനടക്കാവുന്ന കൂടാരം വ്യക്തമാക്കുകയും τοῦ μαρτυρίου എന്ന ഷഷ്ഠീവ്യാകരണബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഇത് സ്ഥാപിതമായ ഒരു വിശേഷണനാമമാണെന്ന് വായനക്കാരന് തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരോടുകൂടെ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുരുഷലിംഗപ്രയോഗവും ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു; ദത്തിവിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി ‘ഓടുകൂടെ’ എന്നു നൽകുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: പുറപ്പാട് പശ്ചാത്തലത്തിലെ പതിവായ ഭൂമിശാസ്ത്രപരമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: καθὼς διετάξατο
  choice: നിർദേശിച്ചതുപോലെ
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കല്പിച്ചതുപോലെ’ എന്നതിനെക്കാൾ മൂലത്തിലെ പ്രവർത്തനനിർദേശത്തിന്റെ ഭാവം ഇവിടെ സുഗമമായി പ്രകടമാകുന്നു.
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: മോശയോടു സംസാരിക്കുന്നവൻ
  rationale: വർത്തമാന കൃദന്തരൂപം കഴിയുന്നത്ര നിലനിർത്തുകയും സംസാരിക്കുന്നയാളെ ദൈവം/കർത്താവ് എന്ന് മൂലത്തേക്കാൾ വ്യക്തമായി തിരിച്ചറിയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ποιῆσαι αὐτὴν
  choice: മോശ അത് നിർമിച്ചു
  rationale: ഗ്രീക്കിൽ ആശ്രിത അനന്തക്രിയയുടെ കർത്താവായി സന്ദർഭത്തിൽ മനസ്സിലാകുന്ന മോശയെ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു. കൂടാരനിർമാണസന്ദർഭത്തിൽ ‘നിർമിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: κατὰ τὸν τύπον
  choice: മാതൃകയനുസരിച്ച്
  rationale: τύπος ഇവിടെ മോശയ്ക്ക് കാണിച്ച നിർമാണമാതൃകയെയോ മാതൃരൂപത്തെയോ സൂചിപ്പിക്കുന്നു; ‘മാതൃക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: ὃν ἑωράκει
  choice: താൻ കണ്ട
  rationale: മാതൃക മുമ്പേ കണ്ടത് മോശയാണെന്ന ആശയം മലയാളത്തിലെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ പൂർവകാലബന്ധം വാക്യക്രമംകൊണ്ട് വ്യക്തമാകുന്നു.
theological_decisions:
- issue: മോശയോടു സംസാരിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘മോശയോടു സംസാരിക്കുന്നവൻ’ എന്ന് പരോക്ഷമായി നിലനിർത്തി.
  alternative: ‘ദൈവം’ അല്ലെങ്കിൽ ‘കർത്താവ്’ എന്ന് വ്യക്തമായി ചേർക്കുക; അല്ലെങ്കിൽ ‘മോശയോടു സംസാരിച്ചവൻ’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് സംസാരിക്കുന്നയാളെ പേരിട്ട് തിരിച്ചറിയുന്നില്ല. സന്ദർഭത്തിൽ ദൈവമാണെന്ന് മനസ്സിലാകുമെങ്കിലും, വിവർത്തനം മൂലപാഠത്തേക്കാൾ വ്യക്തമായ ദൈവനാമം ചേർക്കുന്നില്ല; കൃദന്തരൂപത്തിന്റെ കാലഭാവവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: ἑωράκει എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ‘താൻ കണ്ട’ എന്ന പ്രതിഫലനപ്രയോഗത്തിലൂടെ മോശയെ കർത്താവായി സൂചിപ്പിച്ചു.
  alternative: ‘അവൻ കണ്ട’ എന്നു നൽകുക, അതിലൂടെ സർവനാമപരമായ ചെറിയ അനിശ്ചിതത്വം ശേഷിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വ്യാകരണത്തിലും പുറപ്പാട് പശ്ചാത്തലത്തിലും മാതൃക കണ്ടത് മോശയാണ്. മലയാളത്തിൽ ‘അവൻ’ ഉപയോഗിച്ചാൽ അടുത്തുള്ള ‘സംസാരിക്കുന്നവൻ’ എന്ന പ്രയോഗം കാരണം അനാവശ്യമായ തെറ്റിദ്ധാരണ ഉണ്ടാകാം; ‘താൻ’ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൂടാരം,’ ‘മരുഭൂമി,’ ‘മാതൃക’ തുടങ്ങിയ സാധാരണ പദങ്ങൾ ഉപയോഗിച്ചു; അപരിചിതമായ സഭാപരമായ സാങ്കേതികപദങ്ങൾ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി. വാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ ദീർഘമായ ഗ്രീക്ക് വാക്യം രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
