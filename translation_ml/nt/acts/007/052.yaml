id: ACT.7.52
reference: Acts 7:52
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: ml
  text: പ്രവാചകന്മാരിൽ ആരെയാണ് നിങ്ങളുടെ പിതാക്കന്മാർ[c] പീഡിപ്പിക്കാതിരുന്നത്? നീതിമാന്റെ[a] വരവിനെക്കുറിച്ച് മുൻകൂട്ടി പ്രഖ്യാപിച്ചവരെ അവർ കൊന്നു; ഇപ്പോൾ നിങ്ങളാകട്ടെ ആ നീതിമാനെ ഒറ്റിക്കൊടുത്തവരും[b] കൊലപാതകികളും ആയിത്തീർന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ന്യായവാൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വഞ്ചകരും.’
    reason: lexical_alternative
  - marker: c
    text: ‘പിതാക്കന്മാർ’ എന്നത് ‘പൂർവികർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പിതാക്കന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: പ്രവാചകന്മാരിൽ ആരെയാണ്
  rationale: ഭാഗിക ജനിറ്റീവ് ഘടന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുമ്പോഴും, ഒരു പ്രവാചകനും പീഡനം ഒഴിവായില്ലെന്ന വാചാടോപപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐδίωξαν
  choice: പീഡിപ്പിക്കാതിരുന്നത്
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ശത്രുതാപരമായ പിന്തുടരലിനെയും ഉപദ്രവത്തെയും സൂചിപ്പിക്കുന്നു; ‘പീഡിപ്പിക്കുക’ അതിന്റെ പ്രസക്തമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: οἱ πατέρες ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിന്റെ രൂപത്തോടും സ്തെഫാനൊസിന്റെ കുറ്റാരോപണാത്മകമായ വാചാടോപത്തോടും അടുത്തുനിൽക്കുന്ന പ്രയോഗം; ‘പൂർവികർ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπέκτειναν
  choice: കൊന്നുകളഞ്ഞു
  rationale: പൂർണ്ണമായ കൊലപ്രവൃത്തി ആധുനിക മലയാളത്തിൽ വ്യക്തവും ശക്തവുമായി അറിയിക്കുന്നു.
- source_word: τοὺς προκαταγγείλαντας
  choice: മുൻകൂട്ടി പ്രഖ്യാപിച്ചവരെ
  rationale: προ- എന്ന മുൻകാലസൂചനയും καταγγέλλω എന്ന പ്രഖ്യാപനസ്വഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: περὶ τῆς ἐλεύσεως
  choice: വരവിനെക്കുറിച്ച്
  rationale: ἐλεύσις എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രവചനത്തിന്റെ വിഷയവും വ്യക്തമാക്കുന്നു.
- source_word: τοῦ δικαίου
  choice: നീതിമാൻ
  rationale: നീതിയുള്ളവൻ എന്ന വിവരണാർഥവും യേശുവിനെ സൂചിപ്പിക്കുന്ന വിശേഷണനാമത്തിന്റെ ശക്തിയും നിലനിർത്തുന്ന പതിവും സുതാര്യവുമായ മലയാളപദം.
- source_word: οὗ
  choice: ആ നീതിമാനെ
  rationale: ബന്ധസർവനാമത്തിന്റെ സൂചന മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിച്ച്, തുടർന്ന് വരുന്ന ‘ഒറ്റിക്കൊടുത്തവരും കൊലപാതകികളും’ എന്ന കുറ്റാരോപണം ആരെ സംബന്ധിച്ചതാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: പിതാക്കന്മാരുടെ മുൻകാല പ്രവൃത്തിയും കേൾവിക്കാരുടെ ഇപ്പോഴത്തെ കുറ്റവും തമ്മിലുള്ള കാലവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: προδόται
  choice: ഒറ്റിക്കൊടുത്തവർ
  rationale: രാഷ്ട്രീയമായ ‘രാജ്യദ്രോഹികൾ’ എന്ന അധിക അർഥം വരുത്താതെ, യേശുവിനെ കൈമാറിയ വ്യക്തിപരമായ വഞ്ചനയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: φονεῖς
  choice: കൊലപാതകികൾ
  rationale: വെറും ‘കൊന്നവർ’ എന്നതിനെക്കാൾ കുറ്റകരമായ കൊലയുടെ ധാർമിക-ന്യായപരമായ ഗൗരവം വ്യക്തമാക്കുന്നു.
- source_word: ἐγένεσθε
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: അവർ അങ്ങനെ ‘ആയിത്തീർന്നു’ എന്ന പ്രവേശനാത്മക അർഥത്തോടൊപ്പം അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: τοῦ δικαίου എന്നത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന വിശേഷണനാമമായി വിവർത്തനം ചെയ്യൽ
  choice: നീതിമാൻ
  alternative: ന്യായവാൻ
  rationale: സന്ദർഭത്തിൽ ഇത് പ്രവാചകന്മാർ മുൻകൂട്ടി അറിയിച്ച യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നീതിമാൻ’ വിശേഷണാർഥവും നാമരൂപത്തിലുള്ള ശീർഷകശക്തിയും അനാവശ്യമായ വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: ബന്ധസർവനാമം സൂചിപ്പിക്കുന്ന വ്യക്തിയെ മലയാളത്തിൽ ആവർത്തിക്കൽ
  choice: ആ നീതിമാനെ
  alternative: അവനെ
  rationale: ഗ്രീക്കിലെ οὗ ആരെ സൂചിപ്പിക്കുന്നു എന്നത് മലയാളവാക്യത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ വ്യക്തമാക്കുന്നു; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. വാചാടോപചോദ്യം സ്വാഭാവിക ക്രമത്തിൽ നിലനിർത്തി. καὶ മൂലപാഠത്തിലെ തുടർച്ച രണ്ടാം വാക്യത്തിലൂടെ നേരിട്ട് സൂക്ഷിക്കുകയും, οὗ മുഖേനയുള്ള ബന്ധം അർദ്ധവിരാമത്തോടെ വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
