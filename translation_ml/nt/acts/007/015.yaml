source:
  edition: SBLGNT
  text: ⸂καὶ κατέβη⸃ Ἰακὼβ εἰς Αἴγυπτον. καὶ ἐτελεύτησεν αὐτὸς καὶ οἱ πατέρες ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/015.yaml
  text: And Jacob went down into Egypt[a], and he died, he and our fathers.
translation:
  language: ml
  text: യാക്കോബ് ഈജിപ്തിലേക്ക് ഇറങ്ങിച്ചെന്നു. അവനും നമ്മുടെ പിതാക്കന്മാരും[a] മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നമ്മുടെ പൂർവികരും.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നാണ്; ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη (καταβαίνω)
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ഈജിപ്തിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള ഗ്രീക്കിലെ ദിശാസൂചന നിലനിർത്തുന്നു; മലയാളത്തിലും സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: Ἰακώβ
  choice: യാക്കോബ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: εἰς Αἴγυπτον
  choice: ഈജിപ്തിലേക്ക്
  rationale: ഒരു സ്ഥലത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐτελεύτησεν (τελευτάω)
  choice: മരിച്ചു
  rationale: മരണത്തെ നേരിട്ടും വ്യക്തമായും സൂചിപ്പിക്കുന്ന സാധാരണ ആധുനിക മലയാളപദം; അനാവശ്യമായ മൃദൂക്തി ഒഴിവാക്കുന്നു.
- source_word: αὐτὸς
  choice: അവനും
  rationale: ഗ്രീക്കിൽ പ്രത്യക്ഷമായി നൽകിയിരിക്കുന്ന സർവനാമം നിലനിർത്തുകയും തുടർന്ന് പറയുന്ന പിതാക്കന്മാരോടൊപ്പം യാക്കോബിനെയും ചേർക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ πατέρες ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ ‘പിതാക്കന്മാർ’ എന്ന കുടുംബ-ചരിത്രപരമായ പദം നിലനിർത്തുന്നു; ഇവിടെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ചരിത്രപരമായ പൂർവികരെ സൂചിപ്പിക്കുന്ന πατέρες എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: സ്തെഫാനോസ് തന്റെ ശ്രോതാക്കളോടൊപ്പം ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെ ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നു വിളിക്കുന്ന ഉടമ്പടി-ചരിത്രപരമായ തിരിച്ചറിവ് ഈ രൂപം കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ലളിതവും മാന്യവുമായ മലയാളം. ‘ഇറങ്ങിച്ചെന്നു’ എന്നത് മൂലത്തിലെ ദിശാസൂചന സംരക്ഷിക്കുന്നു. ഗ്രീക്കിലെ രണ്ടു വാക്യങ്ങളുടെ ഘടനയും വ്യക്തതയ്ക്കായി നിലനിർത്തിയിരിക്കുന്നു.
