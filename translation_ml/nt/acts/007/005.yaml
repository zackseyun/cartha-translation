  source_fidelity: 'മുഖ്യപാഠം ഗ്രീക്കിന്റെ അർഥം വിശ്വസ്തമായി നൽകുന്നു: ഭൂമിയിൽ അബ്രാഹാമിന് അവകാശം നൽകിയില്ലെന്നും, ഏറ്റവും ചെറിയൊരു സ്ഥലമുപോലും നൽകിയില്ലെന്നും, പിന്നീട് അവനും അവന്റെ സന്തതിക്കും അതു കൈവശമായി നൽകാമെന്നു വാഗ്ദാനം ചെയ്തെന്നും വ്യക്തമാക്കുന്നു. അവസാന ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാല/വഴങ്ങിപ്പറയുന്ന അവ്യക്തത ‘അന്ന്’ എന്ന പ്രയോഗം നന്നായി സംരക്ഷിക്കുന്നു.'
  naturalness: പാഠം ആധുനിക നിലവാരമുള്ള സ്വാഭാവിക മലയാളമാണ്. ‘കാൽവെക്കാൻപോലും ഒരിടം’ എന്നത് ഗ്രീക്ക് ഇടിയത്തിന്റെ അർഥം വായനക്കാർക്ക് വ്യക്തമായി എത്തിക്കുന്നു. ‘കൈവശമായി’യും ‘സന്തതി’യും ഈ ഔപചാരിക-വിവരണാത്മക രജിസ്റ്ററിന് യോജിക്കുന്നു.
