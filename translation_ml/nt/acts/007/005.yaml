id: ACT.7.5
reference: Acts 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: ml
  text: ആ ദേശത്ത് ദൈവം അവന് ഒരു അവകാശവും നൽകിയില്ല—കാൽവെക്കാൻപോലും ഒരിടം നൽകിയില്ല.[a] എങ്കിലും, അത് അവനും അവന്റെ ശേഷം അവന്റെ സന്തതിക്കും കൈവശമായി നൽകാമെന്ന് ദൈവം വാഗ്ദാനം ചെയ്തു; അന്ന് അവന് ഒരു കുട്ടിപോലും ഉണ്ടായിരുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു കാലടിയോളം ഭൂമിപോലും.” ഭൂമിയുടെ സാധ്യമായ ഏറ്റവും ചെറിയ ഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവന് ഒരു കുട്ടിയും ഇല്ലായിരുന്നെങ്കിലും.” ഗ്രീക്ക് നിർമിതി കാലസൂചകമായി, “അവന് ഒരു കുട്ടിയും ഇല്ലാതിരുന്നപ്പോൾ,” എന്നും മനസ്സിലാക്കാം; എന്നാൽ വാഗ്ദാനം നൽകപ്പെട്ട സമയത്ത് അവന് കുട്ടിയില്ലായിരുന്നതിന്റെ ശ്രദ്ധേയത സന്ദർഭത്തിൽ ശക്തമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: അവകാശം
  rationale: ലഭിച്ച ഭൂവിഹിതം എന്ന നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘സ്വത്ത്’ എന്നതിനെക്കാൾ അബ്രാഹാമിനോടുള്ള ഭൂവാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിന് യോജിക്കുന്നു.
- source_word: οὐδὲ βῆμα ποδός
  choice: കാൽവെക്കാൻപോലും ഒരിടം
  rationale: അക്ഷരാർഥത്തിലെ ‘കാലടിയുടെ ചുവട്’ മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ, ഭൂമിയുടെ ഏറ്റവും ചെറിയ അളവുപോലും ലഭിച്ചില്ലെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യതയും അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπηγγείλατο
  choice: വാഗ്ദാനം ചെയ്തു
  rationale: ദൈവികമായ ഉറച്ച പ്രതിജ്ഞയെ അധിക വിശദീകരണമില്ലാതെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: εἰς κατάσχεσιν
  choice: കൈവശമായി
  rationale: ഭൂമി സ്വന്തമായി കൈവശം ലഭിക്കുന്നതെന്ന κατάσχεσις എന്ന പദത്തിന്റെ ഫലസൂചക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: σπέρματι
  choice: സന്തതി
  rationale: രൂപത്തിൽ ഏകവചനവും അർഥത്തിൽ സമൂഹവാചകവുമായ ഗ്രീക്ക് പ്രയോഗത്തോട് ചേർന്നുനിൽക്കുകയും അബ്രാഹാമിക വാഗ്ദാനഭാഷ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: μετ’ αὐτόν
  choice: അവന്റെ ശേഷം
  rationale: അബ്രാഹാമിനു ശേഷമുള്ള സന്തതിപരമ്പരയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: അന്ന് അവന് ഒരു കുട്ടിപോലും ഉണ്ടായിരുന്നില്ല
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നിർമിതിയുടെ സാഹചര്യകാലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാഗ്ദാനം ലഭിക്കുമ്പോഴത്തെ സന്താനരാഹിത്യം നിലനിർത്തുന്നു.
- source_word: τέκνου
  choice: കുട്ടി
  rationale: ‘മകൻ’ എന്നതിനെക്കാൾ വിശാലമായ τέκνον എന്ന പദത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: വാഗ്ദാനസമയത്തെ അബ്രാഹാമിന്റെ സന്താനരാഹിത്യത്തിന് കാലസൂചകമോ വഴങ്ങിപ്പറയുന്ന ഭാവമോ
  choice: അന്ന് അവന് ഒരു കുട്ടിപോലും ഉണ്ടായിരുന്നില്ല
  alternative: അവന് ഒരു കുട്ടിയും ഇല്ലായിരുന്നെങ്കിലും
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് അബ്സല്യൂട്ട് സാഹചര്യം/കാലം സൂചിപ്പിക്കാം; സന്ദർഭത്തിൽ വഴങ്ങിപ്പറയുന്ന ഭാവം ശക്തമാണെങ്കിലും അതു മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർക്കാതെ യഥാർഥ വ്യാകരണപരമായ അവ്യക്തത സംരക്ഷിക്കുന്നു. ‘പോലും’ വാഗ്ദാനവും നിലവിലെ സന്താനരാഹിത്യവും തമ്മിലുള്ള ശ്രദ്ധേയമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ആദ്യവാക്യത്തിലെ ഗ്രീക്ക് സർവനാമത്തിന്റെ സൂചിത കർത്താവ് മുൻസന്ദർഭത്തിൽ ദൈവമായതിനാൽ മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘ദൈവം’ എന്നു വ്യക്തമാക്കി. ‘സന്തതി’ ഉടമ്പടിസംബന്ധമായ സമൂഹവാചക അർഥം നിലനിർത്തുന്നു.
