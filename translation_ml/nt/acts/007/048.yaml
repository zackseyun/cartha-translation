  text: ἀλλ’ οὐχ ὁ ὕψιστος ἐν ⸀χειροποιήτοις κατοικεῖ· καθὼς ὁ προφήτης λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: ml
  text: 'എന്നാൽ അത്യുന്നതൻ മനുഷ്യകൈകളാൽ നിർമിച്ചവയിൽ[a] വസിക്കുന്നില്ല; പ്രവാചകൻ പറയുന്നതുപോലെ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യകൈകളാൽ നിർമിച്ച ആലയങ്ങളിൽ.” ഗ്രീക്ക് പ്രയോഗം “മനുഷ്യകൈകളാൽ നിർമിച്ചവയിൽ” എന്ന വിശാലമായ അർഥമുള്ളതാണ്; എന്നാൽ തൊട്ടടുത്ത സന്ദർഭം ആലയത്തെക്കുറിച്ചാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: ശലോമോൻ ഒരു ആലയം പണിതുവെന്ന മുൻവാക്യത്തോട് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ബന്ധകമാണ്.
- source_word: οὐχ
  choice: വസിക്കുന്നില്ല
  rationale: κατοικεῖ എന്ന ക്രിയയോടു ചേർന്ന നിഷേധത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയുടെ നിഷേധരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ὕψιστος
  choice: അത്യുന്നതൻ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ θεός ഇല്ലാത്തതിനാൽ ‘ദൈവം’ എന്നു കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐν χειροποιήτοις
  choice: മനുഷ്യകൈകളാൽ നിർമിച്ചവയിൽ
  rationale: χειροποίητος എന്നതിന്റെ മനുഷ്യനിർമിതമെന്ന അർഥവും ബഹുവചനത്തിന്റെ വിശാലതയും സംരക്ഷിക്കുന്നു. സമീപസന്ദർഭം ആലയത്തെക്കുറിച്ചാണെങ്കിലും മുഖ്യവാചകത്തെ ‘ആലയങ്ങളിൽ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: κατοικεῖ
  choice: വസിക്കുന്നു
  rationale: ദൈവിക സാന്നിധ്യത്തിന്റെയും പാർപ്പിന്റെയും ആശയം dignified, സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: καθὼς
  choice: പോലെ
  rationale: തുടർന്നുവരുന്ന പ്രവാചകവചനത്തെ മുൻപ്രസ്താവനയുടെ സ്ഥിരീകരണമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ὁ προφήτης
  choice: പ്രവാചകൻ
  rationale: മൂലപാഠം പ്രവാചകന്റെ പേര് പറയാത്തതിനാൽ യെശയ്യാവ് എന്ന പേര് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന വർത്തമാനകാല സൂത്രവാക്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: χειροποιήτοις എന്നതിന്റെ സൂചന മുഖ്യവാചകത്തിൽ ‘ആലയങ്ങൾ’ എന്നു വ്യക്തമാക്കണമോ
  choice: ‘മനുഷ്യകൈകളാൽ നിർമിച്ചവയിൽ’ എന്ന വിശാല പ്രയോഗം നിലനിർത്തി
  alternative: ‘മനുഷ്യകൈകളാൽ നിർമിച്ച ആലയങ്ങളിൽ’
  rationale: സമീപസന്ദർഭം ആലയമാണെങ്കിലും ഗ്രീക്ക് വിശാലമാണ്; മനുഷ്യൻ നിർമിച്ച വിശുദ്ധവസ്തുക്കളെയും ഘടനകളെയും സംബന്ധിച്ച വചനത്തിന്റെ വിമർശനാത്മക ശക്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: ὁ ὕψιστος എന്നതിൽ ‘ദൈവം’ ചേർക്കണമോ
  choice: ‘അത്യുന്നതൻ’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു
  alternative: ‘അത്യുന്നതനായ ദൈവം’
  rationale: സ്ഥാനനാമം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും θεός മൂലപാഠത്തിൽ ഇല്ല; അതിനാൽ വ്യക്തമല്ലാത്ത പദം ചേർക്കാതെ അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അത്യുന്നതൻ’ എന്ന ദൈവിക സ്ഥാനനാമവും ‘വസിക്കുന്നു’ എന്ന തിരുവെഴുത്തുസന്ദർഭത്തിന് യോജിച്ച ക്രിയയും ഉപയോഗിച്ചു; ഗ്രീക്കിലെ വിശാലത അടിക്കുറിപ്പോടുകൂടെ സംരക്ഷിച്ചു.
