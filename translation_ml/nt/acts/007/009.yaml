id: ACT.7.9
reference: Acts 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: ml
  text: ഗോത്രപിതാക്കന്മാർ യോസേഫിനോടു അസൂയപ്പെട്ട് അവനെ ഈജിപ്തിലേക്കു വിറ്റു; ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: ഗോത്രപിതാക്കന്മാർ
  rationale: ഇവിടെ യാക്കോബിന്റെ പുത്രന്മാരായ ഇസ്രായേലിന്റെ ആദിപിതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഗോത്രപിതാക്കന്മാർ’ ചരിത്രപരമായ ഈ പ്രത്യേക അർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘പൂർവികർ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: ζηλώσαντες
  choice: യോസേഫിനോട് അസൂയപ്പെട്ട്
  rationale: പ്രധാന പ്രവൃത്തിയായ വിൽപ്പനയ്ക്കു പിന്നിലെ പ്രേരണയാണ് ഭൂതകാല കൃതന്തം സൂചിപ്പിക്കുന്നത്. ഈ മലയാളപ്രയോഗം അതിന്റെ മാനസിക ശക്തിയും പ്രവർത്തനബന്ധവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἀπέδοντο
  choice: അവനെ ... വിറ്റു
  rationale: ഉല്പത്തി പശ്ചാത്തലത്തിലും ഈ വാക്യസന്ദർഭത്തിലും ക്രിയയുടെ നിർദിഷ്ട അർഥം യോസേഫിനെ വിലയ്ക്കു കൈമാറുക എന്നതാണ്. ‘വിറ്റു’ അത് വ്യക്തമായി പകരുന്നു.
- source_word: εἰς Αἴγυπτον
  choice: ഈജിപ്തിലേക്കു
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ആ ചലനാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്ന രൂപമാണിത്.
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: ദൈവസാന്നിധ്യത്തെ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ പകരുന്നു. ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ മുൻപദമായ യോസേഫ് വ്യക്തമായതിനാൽ പേര് ആവർത്തിക്കേണ്ടതില്ല.
theological_decisions:
- issue: യോസേഫിന്റെ കഷ്ടതയ്ക്കിടയിലെ ദൈവസാന്നിധ്യം
  choice: എന്നാൽ ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നു
  alternative: ദൈവം യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നു
  rationale: സഹോദരന്മാരുടെ ദ്രോഹത്തിനിടയിലും ദൈവം യോസേഫിനോടുകൂടെ ഉണ്ടായിരുന്നുവെന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ഇത് നിലനിർത്തുന്നു; ദൈവപരിപാലനത്തെക്കുറിച്ച് വാക്യം നേരിട്ട് പറയാത്ത വിശദീകരണങ്ങൾ ചേർക്കുന്നില്ല. ഗ്രീക്കിലെ καί സാധാരണയായി ‘കൂടാതെ/ഉം’ എന്ന ബന്ധകമാണെങ്കിലും, ഇവിടെ മുൻവാക്യത്തോടുള്ള ആശയവൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, അതേസമയം ഗൗരവമുള്ള ശൈലി. ‘ഗോത്രപിതാക്കന്മാർ’ എന്ന പദം സന്ദർഭത്തിന്റെ ചരിത്രപരമായ കൃത്യതയ്ക്കായി നിലനിർത്തി. പ്രസിദ്ധീകരണവാക്യത്തിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ആവശ്യമില്ല.
