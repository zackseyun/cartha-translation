source:
  edition: SBLGNT
  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: ml
  text: ആ സമയത്ത് മോശെ ജനിച്ചു; അവൻ ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ സുന്ദരനായിരുന്നു.[a] അവനെ തന്റെ പിതാവിന്റെ വീട്ടിൽ മൂന്നു മാസം വളർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന് സുന്ദരനായിരുന്നു.” “സുന്ദരൻ” എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് “കാണാൻ നല്ലവൻ,” “സുമുഖൻ,” അല്ലെങ്കിൽ “വിശിഷ്ടൻ” എന്നും അർഥമാകാം; എന്നാൽ ദൈവത്തെക്കുറിച്ചുള്ള പരാമർശം ഗ്രീക്കിൽ വ്യക്തമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: ആ സമയത്ത്
  rationale: കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐγεννήθη
  choice: ജനിച്ചു
  rationale: ജനനസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: Μωϋσῆς
  choice: മോശ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ പേരുരൂപം.
- source_word: ἀστεῖος τῷ θεῷ
  choice: ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ സുന്ദരനായിരുന്നു
  rationale: ἀστεῖος എന്നതിന്റെ സൗന്ദര്യാർഥവും τῷ θεῷ എന്ന വ്യക്തമായ ദൈവപരമായ വിലയിരുത്തലും സംരക്ഷിക്കുന്നു; 'ദൈവത്തിന് സുന്ദരൻ' എന്ന കൃത്രിമമായ മലയാളം ഒഴിവാക്കുന്നു.
- source_word: ἀνετράφη
  choice: വളർത്തി
  rationale: ശിശുവിനെ പരിപാലിച്ച് വളർത്തുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ അനിശ്ചിത കർത്താവോടുകൂടിയ സജീവരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μῆνας τρεῖς
  choice: മൂന്നു മാസം
  rationale: ദൈർഘ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: പിതാവിന്റെ വീട്ടിൽ
  rationale: οἶκος എന്നതിന്റെ ഗൃഹ/കുടുംബപരമായ അർഥം ലളിതമായി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ പിതാവ് മോശയുടെ പിതാവാണെന്ന് വ്യക്തമാണ്.
theological_decisions:
- issue: ἀστεῖος τῷ θεῷ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ സുന്ദരനായിരുന്നു
  alternative: ദൈവത്തിന് സുന്ദരനായിരുന്നു; അതിസുന്ദരനായിരുന്നു; വിശിഷ്ടനായിരുന്നു
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ദൈവത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശം നിലനിർത്തുകയും അതിനെ വെറും മനുഷ്യവിലയിരുത്തലായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു. അതേസമയം, 'തിരഞ്ഞെടുക്കപ്പെട്ടവൻ' തുടങ്ങിയ പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രനിഗമനങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുഖ്യവാക്യത്തിൽ 'ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ' എന്ന സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ച് ഗ്രീക്കിലെ വിലയിരുത്തൽബന്ധം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
