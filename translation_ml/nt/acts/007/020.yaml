  to: ആ സമയത്ത് മോശെ ജനിച്ചു; അവൻ ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ സുന്ദരനായിരുന്നു.[a] അവനെ തന്റെ പിതാവിന്റെ വീട്ടിൽ മൂന്നു മാസം വളർത്തി.
