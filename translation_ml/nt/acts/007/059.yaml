source:
  edition: SBLGNT
  text: καὶ ἐλιθοβόλουν τὸν Στέφανον ἐπικαλούμενον καὶ λέγοντα· Κύριε Ἰησοῦ, δέξαι τὸ πνεῦμά μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/059.yaml
  text: And they were stoning Stephen as he called out and said[a], “Lord Jesus, receive my spirit.”
translation:
  language: ml
  text: 'അവർ സ്തെഫാനോസിനെ കല്ലെറിഞ്ഞുകൊണ്ടിരിക്കെ, അദ്ദേഹം വിളിച്ചപേക്ഷിച്ച്[a] പറഞ്ഞു: “കർത്താവായ യേശുവേ, എന്റെ ആത്മാവിനെ സ്വീകരിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടത്തെ വിളിച്ചപേക്ഷിച്ചുകൊണ്ട്.” ഗ്രീക്ക് കൃദ്യന്തരൂപത്തിന് പ്രാർഥനയിൽ ഒരാളെ വിളിച്ചപേക്ഷിക്കുന്നു എന്ന അർത്ഥം കൂടുതൽ വ്യക്തമായി നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: കല്ലെറിഞ്ഞുകൊണ്ടിരിക്കെ
  rationale: അപൂർണ ഭൂതകാലക്രിയ ongoing action സൂചിപ്പിക്കുന്നു; സ്തെഫാനോസ് സംസാരിക്കുന്ന സമയത്തും കല്ലേറ് തുടരുകയായിരുന്നുവെന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπικαλούμενον
  choice: വിളിച്ചപേക്ഷിച്ച്
  rationale: ഇവിടെ സ്തെഫാനോസ് യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്ത് അപേക്ഷിക്കുന്നതാണ്; ‘വിളിച്ചപേക്ഷിച്ച്’ എന്നത് വിളിച്ചുപറയലിന്റെയും പ്രാർഥനാപൂർവമായ അഭ്യർഥനയുടെയും അർത്ഥങ്ങൾ ഒരുമിച്ച് നൽകുന്നു.
- source_word: λέγοντα
  choice: പറഞ്ഞു
  rationale: സ്തെഫാനോസിന്റെ നേരിട്ടുള്ള വാക്കുകൾ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്ന ലളിതമായ പരിഭാഷ.
- source_word: Κύριε Ἰησοῦ
  choice: കർത്താവായ യേശുവേ
  rationale: κύριε എന്ന ആദരപൂർവമായ നേരിട്ടുള്ള സംബോധനയും യേശുവിന്റെ വ്യക്തിനാമവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δέξαι
  choice: സ്വീകരിക്കണമേ
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ ആജ്ഞാരൂപത്തെ മലയാളത്തിലെ ആദരപൂർവമായ അപേക്ഷാരൂപത്തിൽ സ്വാഭാവികവും ഗൗരവപൂർണവുമായി നൽകുന്നു.
- source_word: τὸ πνεῦμά μου
  choice: എന്റെ ആത്മാവിനെ
  rationale: മരണസമയത്ത് സ്തെഫാനോസ് തന്റെ ആത്മാവിനെ യേശുവിൽ ഏൽപ്പിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച, വ്യക്തവും പതിവുമായ പ്രയോഗം.
theological_decisions:
- issue: സ്തെഫാനോസ് ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ വിളിച്ചപേക്ഷിക്കുന്നതിന്റെ പ്രാർഥനാസ്വഭാവം പരിഭാഷയിൽ എത്ര വ്യക്തമായി കാണിക്കണം
  choice: ‘വിളിച്ചപേക്ഷിച്ച്’ എന്നും നേരിട്ടുള്ള സംബോധനയായി ‘കർത്താവായ യേശുവേ’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വിളിച്ചുപറഞ്ഞ്’ എന്നു മാത്രം നൽകുക; അല്ലെങ്കിൽ വാചകത്തിൽ ഇല്ലാത്ത കർമം ചേർത്ത് ‘അവിടത്തെ വിളിച്ചപേക്ഷിച്ച്’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് വാക്യം സ്തെഫാനോസ് യേശുവിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതായി അവതരിപ്പിക്കുന്നു. ἐπικαλούμενον എന്നതിന് വിളിച്ചപേക്ഷിക്കുക/പ്രാർഥനയിൽ വിളിക്കുക എന്ന അർത്ഥമുണ്ടെങ്കിലും കർമം ഗ്രീക്കിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; അതിനാൽ പ്രാർഥനാസ്വഭാവം സംരക്ഷിക്കുമ്പോഴും സൂചിപ്പിക്കപ്പെട്ട കർമം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. തുടർന്നുകൊണ്ടിരുന്ന കല്ലേറും അതിനിടയിലെ സ്തെഫാനോസിന്റെ അപേക്ഷയും ഒരേ വാക്യത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
