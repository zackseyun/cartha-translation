  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: ml
  text: 'പിന്നെ അവൻ മുട്ടുകുത്തി ഉച്ചസ്വരത്തിൽ നിലവിളിച്ചു: “കർത്താവേ, ഈ പാപം അവരുടെമേൽ ചുമത്തരുതേ.[a]” ഇതു പറഞ്ഞശേഷം അവൻ നിദ്രപ്രാപിച്ചു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ പാപം അവരുടെ കണക്കിൽ ചേർക്കരുതേ” അല്ലെങ്കിൽ “ഈ പാപത്തിന് അവരെ കുറ്റക്കാരായി കണക്കാക്കരുതേ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “നിദ്രപ്രാപിച്ചു”; മരണത്തെ സൂചിപ്പിക്കാൻ പതിവായി ഉപയോഗിച്ചിരുന്ന ഒരു പ്രയോഗം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: പിന്നെ അവൻ മുട്ടുകുത്തി
  rationale: ‘മുട്ടുകൾ നിലത്തുവെച്ച്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളസമാനമാണ് ‘മുട്ടുകുത്തി.’ δέ ഇവിടെ ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ ‘പിന്നെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ഉച്ചസ്വരത്തിൽ നിലവിളിച്ചു
  rationale: κράζω ഉച്ചത്തിലുള്ള വിളിയെ സൂചിപ്പിക്കുന്നു; φωνῇ μεγάλῃ എന്ന പദസമുച്ചയത്തിന്റെ ഊന്നൽ ‘ഉച്ചസ്വരത്തിൽ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: സന്ദർഭത്തിൽ യേശുവിനോടുള്ള പ്രാർഥനാപൂർവമായ സംബോധനമാണിത്. κύριος എന്ന സ്ഥാനനാമത്തിന്റെ ആദരവും പുതിയനിയമത്തിലെ പരിചിതമായ പ്രയോഗവും ‘കർത്താവേ’ നിലനിർത്തുന്നു.
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: ഈ പാപം അവരുടെമേൽ ചുമത്തരുതേ
  rationale: ἵστημι ഇവിടെ ഒരാളുടെ കണക്കിൽ കുറ്റം ചുമത്തുക എന്ന ന്യായവിധിസംബന്ധമായ അർഥത്തിലാണ്. ‘അവരുടെമേൽ ചുമത്തരുതേ’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ταύτην എന്ന സൂചകപദത്തെ ‘ഈ’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ τοῦτο εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: ഗ്രീക്ക് കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന സമയക്രമം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκοιμήθη
  choice: നിദ്രപ്രാപിച്ചു
  rationale: കർത്തരിപ്രയോഗത്തിലുള്ള ഈ ക്രിയ സ്തെഫാനൊസിന്റെ മരണത്തെ ‘ഉറക്കം’ എന്ന രൂപകത്തിലൂടെ പറയുന്നു. ‘നിദ്രപ്രാപിച്ചു’ ആ രൂപകം ഇല്ലാതാക്കാതെ ഗൗരവമുള്ള മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκοιμήθη എന്ന മരണസൂചകമായ രൂപകത്തിന്റെ പരിഭാഷ
  choice: നിദ്രപ്രാപിച്ചു
  alternative: മരിച്ചു
  rationale: ഗ്രീക്ക് പാഠം മരണത്തെ നേരിട്ട് പറയാതെ ഉറക്കത്തിന്റെ രൂപകം ഉപയോഗിക്കുന്നു. പാഠത്തിന്റെ ഭാഷയും ധ്വനിയും നിലനിർത്താൻ രൂപകം സംരക്ഷിച്ചു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: സ്തെഫാനൊസിന്റെ പ്രാർഥനയിലെ Κύριε എന്ന സംബോധന
  choice: കർത്താവേ
  alternative: നാഥാ
  rationale: മുൻവാക്യത്തിന്റെ സന്ദർഭത്തിൽ ഈ പ്രാർഥന യേശുവിനോടാണ്. ‘കർത്താവേ’ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പുതിയനിയമ സ്ഥാനനാമം നിലനിർത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവപൂർണമായ മലയാളം ഉപയോഗിച്ചു. പ്രാർഥനയിലെ വിനയസൂചകമായ ‘-രുതേ’ രൂപം നിലനിർത്തി. ‘നിദ്രപ്രാപിച്ചു’ അല്പം സാഹിത്യഗൗരവമുള്ളതായിരുന്നാലും ഗ്രീക്കിലെ ഉറക്കരൂപകം കൃത്യമായി സംരക്ഷിക്കുന്നതിനാൽ തിരഞ്ഞെടുത്തു.
