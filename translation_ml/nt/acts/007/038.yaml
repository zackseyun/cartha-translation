source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: ml
  text: മരുഭൂമിയിലെ സഭയിൽ[a], സീനായ് മലയിൽ തന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന ദൂതനോടും നമ്മുടെ പിതാക്കന്മാരോടും[b] കൂടെ ഉണ്ടായിരുന്നത് ഇവനാണ്. നമുക്കു നൽകാനായി ജീവനുള്ള അരുളപ്പാടുകൾ[c] അവൻ സ്വീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനസമൂഹത്തിൽ’ അല്ലെങ്കിൽ ‘കൂട്ടായ്മയിൽ’; പരമ്പരാഗതമായി, ‘മരുഭൂമിയിലെ സഭയിൽ.’ ഇവിടെ ഇസ്രായേൽജനത്തിന്റെ ഒത്തുചേരലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നു പറയുന്നത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ്; ‘നമ്മുടെ പൂർവികർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ജീവനുള്ള വചനങ്ങൾ’ അല്ലെങ്കിൽ ‘ജീവൻ നൽകുന്ന അരുളപ്പാടുകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: ജനസമൂഹത്തിൽ
  rationale: മരുഭൂമിയിൽ ഒന്നിച്ചുകൂടിയ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; പിൽക്കാലത്തെ സ്ഥാപനപരമായ ‘സഭ’ എന്ന ആശയം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: ἐρήμῳ
  choice: മരുഭൂമിയിലെ
  rationale: ഇസ്രായേലിന്റെ മരുഭൂമിയാത്ര എന്ന ബൈബിൾ പശ്ചാത്തലത്തിന് സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: ἀγγέλου
  choice: ദൂതനോടും
  rationale: സീനായ് പശ്ചാത്തലത്തിൽ മനുഷ്യസന്ദേശവാഹകനെയല്ല, ദൈവദൂതനെയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘ദൂതൻ’ ഈ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: λαλοῦντος
  choice: സംസാരിച്ചുകൊണ്ടിരുന്ന
  rationale: ഗ്രീക്ക് വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πατέρων ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരോടും
  rationale: ഇസ്രായേലിന്റെ പുരുഷപൂർവികരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ വ്യക്തമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐδέξατο
  choice: സ്വീകരിച്ചു
  rationale: ദൈവിക വെളിപ്പാടിന്റെ സ്വീകർത്താവായി മോശെയെ അവതരിപ്പിക്കുന്ന സന്ദർഭത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: λόγια
  choice: അരുളപ്പാടുകൾ
  rationale: സാധാരണ വാക്കുകളെന്നതിലുപരി ദൈവികമായ ഉച്ചാരണങ്ങളെയോ വെളിപ്പാടുകളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സവിശേഷത സംരക്ഷിക്കുന്നു.
- source_word: ζῶντα
  choice: ജീവനുള്ള
  rationale: ‘ജീവൻ നൽകുന്ന’ എന്നു വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ, മൂലത്തിലെ ‘ജീവിക്കുന്ന/ജീവനുള്ള’ എന്ന സമ്പന്നമായ വിശേഷണം നിലനിർത്തുന്നു.
- source_word: δοῦναι ἡμῖν
  choice: നമുക്കു നൽകേണ്ടതിന്
  rationale: മോശെ അരുളപ്പാടുകൾ സ്വീകരിച്ചതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് അനന്തക്രിയയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ γενόμενος
  choice: കൂടെ ഉണ്ടായിരുന്നത്
  rationale: ആ സാഹചര്യത്തിൽ മോശെയുടെ സാന്നിധ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ വാക്കുതോറുമുള്ള അസ്വാഭാവികത ഒഴിവാക്കി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മരുഭൂമിയിലെ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന ἐκκλησία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജനസമൂഹം
  alternative: സഭ; കൂട്ടായ്മ
  rationale: പദത്തിന്റെ ‘ഒന്നിച്ചുകൂടിയ സമൂഹം’ എന്ന അർഥം നിലനിർത്തുമ്പോഴും, ഇവിടെ പിൽക്കാല പുതിയനിയമസഭ എന്ന സ്ഥാപനപരമായ ആശയം നിർബന്ധമായി വായിച്ചുകയറ്റുന്നത് ഒഴിവാക്കുന്നു.
- issue: λόγια ζῶντα എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ജീവനുള്ള അരുളപ്പാടുകൾ
  alternative: ജീവനുള്ള വചനങ്ങൾ; ജീവൻ നൽകുന്ന അരുളപ്പാടുകൾ
  rationale: അരുളപ്പാടുകൾ ‘ജീവനുള്ളവ’യാണെന്ന മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രത സംരക്ഷിക്കുന്നു; അവയെ ‘ജീവൻ നൽകുന്നവ’ എന്ന ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
