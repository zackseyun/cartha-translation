  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജനസമൂഹം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സ്ഥാപനപരമായ സഭാഭാവം ഒഴിവാക്കുന്നു; ‘അരുളപ്പാടുകൾ’ ദൈവിക ഉച്ചാരണങ്ങളുടെ സവിശേഷത നിലനിർത്തുന്നു.
