id: ACT.7.19
reference: Acts 7:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: ml
  text: ഈ മനുഷ്യൻ നമ്മുടെ ജനത്തോട് കപടതന്ത്രത്തോടെ[a] പെരുമാറി, നമ്മുടെ പിതാക്കന്മാരെ[c] ഉപദ്രവിച്ചു; അവരുടെ ശിശുക്കളെ പുറത്തുപേക്ഷിക്കാൻ ഇടയാക്കി[b], അവരെ ജീവനോടെ നിലനിർത്താതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ ജനത്തോട് വഞ്ചനാപൂർവം പെരുമാറി.’ ഗ്രീക്ക് പദം കൗശലത്തോടുകൂടിയതും വഞ്ചനാപരവുമായ ഇടപെടലിനെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, കുഞ്ഞുങ്ങളെ മരിക്കാൻ വിട്ടുകൊടുക്കുക എന്ന ഉദ്ദേശ്യത്തോടെ പുറത്തു തള്ളിക്കളയുക.
    reason: cultural_note
  - marker: c
    text: ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നത് ഇവിടെ ‘നമ്മുടെ പൂർവികർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ഇസ്രായേലിന്റെ മുൻതലമുറകളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത കുടുംബപദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ രാജാവിനെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: κατασοφισάμενος
  choice: കൗശലപൂർവം പെരുമാറി
  rationale: സന്ദർഭത്തിൽ ദുഷ്ടവും വഞ്ചനാപരവുമായ കൗശലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: τὸ γένος ἡμῶν
  choice: നമ്മുടെ ജനം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഇസ്രായേൽ ജനസമൂഹമാണ്; ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: ἐκάκωσεν
  choice: ഉപദ്രവിച്ചു
  rationale: ദോഷം ചെയ്യുക, മോശമായി പെരുമാറുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു; രാഷ്ട്രീയ പീഡനം എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: τοὺς πατέρας
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ പരമ്പരാഗത കുടുംബ-ചരിത്ര ഭാഷ നിലനിർത്തുന്നു; ഇവിടെ ഇസ്രായേലിന്റെ മുൻതലമുറകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦ ποιεῖν
  choice: ഇടയാക്കി
  rationale: ക്രിയയോടു ബന്ധപ്പെട്ട മാർഗമോ ഫലമോ പ്രകടമാക്കുന്നു; മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്ത നിർബന്ധത്തിന്റെ ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τὰ βρέφη ἔκθετα αὐτῶν
  choice: അവരുടെ ശിശുക്കളെ പുറത്തുപേക്ഷിക്കാൻ
  rationale: വളരെ ചെറിയ കുഞ്ഞുങ്ങളെ പുറത്തു തള്ളിക്കളഞ്ഞ് മരണത്തിന് വിട്ടുകൊടുക്കുന്ന ചരിത്രപരമായ പ്രവൃത്തിയെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: അങ്ങനെ അവർ ജീവനോടെ ശേഷിക്കാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യമോ ഫലമോ എന്ന ഗ്രീക്ക് നിർമാണത്തിലെ സൂക്ഷ്മമായ തുറന്ന നില കാത്തുകൊണ്ട്, ജീവനോടെ സംരക്ഷിക്കപ്പെടാതിരിക്കുക എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: εἰς τό നിർമാണത്തിലെ ഉദ്ദേശ്യം/ഫലം
  choice: അങ്ങനെ അവർ ജീവനോടെ ശേഷിക്കാതിരിക്കേണ്ടതിന്
  alternative: അവർ ജീവനോടെ ശേഷിക്കാതിരിക്കാനായി
  rationale: ഫറവോന്റെ ഉദ്ദേശ്യം ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്നുവെങ്കിലും, നിർമാണത്തിൽ ഫലത്തിന്റെ നിഴലും ഉള്ളതിനാൽ അതിനെ പൂർണമായി അടച്ചുപൂട്ടാത്ത രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പുറത്തുപേക്ഷിക്കുക’ എന്നത് ചരിത്രപരമായ infant exposure എന്ന പ്രവൃത്തിയെ കുറിപ്പിന്റെ സഹായത്തോടെ വ്യക്തമാക്കുന്നു; ‘പിതാക്കന്മാർ’ എന്ന പരമ്പരാഗത രൂപത്തിന് ‘പൂർവികർ’ എന്ന സ്വാഭാവിക പകരം കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
