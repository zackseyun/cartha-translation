  text: Then the high priest said[a], “Are these things so?”
translation:
  language: ml
  text: 'അപ്പോൾ മഹാപുരോഹിതൻ പറഞ്ഞു[a]: “ഈ കാര്യങ്ങൾ അങ്ങനെയാണോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ചോദിച്ചു.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “പറഞ്ഞു” എന്നാണ്. ചോദ്യം കൂടുതൽ വ്യക്തമായി: “ഈ ആരോപണങ്ങൾ സത്യമാണോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: ചോദിച്ചു
  rationale: λέγω എന്ന ക്രിയയുടെ രൂപം അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞു’ എന്നാണെങ്കിലും, ഇവിടെ നേരിട്ടുള്ള ചോദ്യം അവതരിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: δέ ഇവിടെ മുൻവിവരണത്തിൽനിന്നുള്ള ആഖ്യാനപുരോഗതിയെ സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ സ്വാഭാവികമായ മലയാള സംക്രമണം നൽകുന്നു.
- source_word: ἀρχιερεύς
  choice: മഹാപുരോഹിതൻ
  rationale: ഏകവചനത്തിലുള്ള ἀρχιερεύς-ന് യഹൂദ ന്യായസഭയുടെ ഈ സന്ദർഭത്തിൽ പതിവായും കൃത്യമായും ചേരുന്ന മലയാളപദം ‘മഹാപുരോഹിതൻ’ ആണ്.
- source_word: Εἰ
  choice: -ആണോ
  rationale: നേരിട്ടുള്ള ചോദ്യത്തിൽ εἰ ഒരു ഉവ്വ്/ഇല്ല ചോദ്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ചോദ്യപ്രത്യയമായ ‘-ആണോ’ അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ബഹുവചന സർവനാമം മുൻസന്ദർഭത്തിലെ ആരോപണങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ഈ കാര്യങ്ങൾ’ മൂലത്തിലെ പൊതുവായ പ്രയോഗം നിലനിർത്തുന്നു; ‘ഈ ആരോപണങ്ങൾ’ കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: οὕτως ἔχει
  choice: ഇങ്ങനെതന്നെയാണോ
  rationale: οὕτως ἔχει എന്ന പ്രയോഗത്തിന്റെ അർഥം ‘ഇങ്ങനെ ആയിരിക്കുക/കാര്യം ഇങ്ങനെയായിരിക്കുക’ എന്നാണ്; ‘ഇങ്ങനെതന്നെയാണോ’ അതിന്റെ ചോദ്യംചെയ്യുന്ന ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
