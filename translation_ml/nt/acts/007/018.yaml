  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄχρι οὗ ἀνέστη βασιλεὺς ἕτερος ⸂ἐπ’ Αἴγυπτον⸃, ὃς οὐκ ᾔδει τὸν Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/018.yaml
  text: until another king arose over Egypt[b][a], who did not know Joseph.
translation:
  language: ml
  text: യോസേഫിനെ അറിയാതിരുന്ന[b] മറ്റൊരു രാജാവ് ഈജിപ്തിന്മേൽ അധികാരത്തിൽ വരുന്നതുവരെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അധികാരത്തിൽ വന്നു” എന്നതിനുള്ള ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “എഴുന്നേറ്റു” എന്നാണ്; “ഈജിപ്തിന്മേൽ അധികാരത്തിൽ വന്നു” എന്നത് “ഈജിപ്തിനെ ഭരിക്കാൻ വന്നു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “യോസേഫിനെ അറിയാതിരുന്ന” എന്നതിന് “യോസേഫിനെ അംഗീകരിക്കാതിരുന്ന” അല്ലെങ്കിൽ “യോസേഫിനെ പരിഗണിക്കാതിരുന്ന” എന്ന അർഥസൂചനയും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι οὗ
  choice: വരുന്നതുവരെ
  rationale: മുൻവിവരിച്ച അവസ്ഥ തുടർന്നിരുന്ന സമയപരിധിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνέστη
  choice: അധികാരത്തിൽ വന്നു
  rationale: ഭരണാധികാരിയുടെ ഉദയത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പ്രയോഗം; അക്ഷരാർഥമായ ‘എഴുന്നേറ്റു’ മലയാളത്തിൽ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാം.
- source_word: βασιλεὺς ἕτερος
  choice: മറ്റൊരു രാജാവ്
  rationale: ἕτερος മുൻ രാജാവിൽനിന്നുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നു; ‘മറ്റൊരു രാജാവ്’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: ἐπ’ Αἴγυπτον
  choice: ഈജിപ്തിന്മേൽ
  rationale: ἐπί + accusative ഇവിടെ ഒരു പ്രദേശത്തിന്മേലുള്ള ഭരണാധികാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ὃς οὐκ ᾔδει τὸν Ἰωσήφ
  choice: യോസേഫിനെ അറിയാത്ത
  rationale: οἶδα എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; അംഗീകരിക്കാതിരിക്കുക/പരിഗണിക്കാതിരിക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
