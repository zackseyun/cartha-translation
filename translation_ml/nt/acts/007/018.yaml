translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഭരണാധികാരിയുടെ ഉദയം സ്വാഭാവികമായി അറിയിക്കാൻ ‘അധികാരത്തിൽ വന്നു’ ഉപയോഗിച്ചു; മൂലത്തിലെ സാധ്യതയുള്ള അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
