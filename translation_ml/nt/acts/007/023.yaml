id: ACT.7.23
reference: Acts 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: ml
  text: അവന് നാല്പത് വയസ്സ് തികയാറായപ്പോൾ[a], തന്റെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കളെ[c] ചെന്നുകാണണമെന്ന ചിന്ത അവന്റെ ഹൃദയത്തിൽ ഉദിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നാല്പത് വർഷക്കാലം അവന് പൂർത്തിയായിക്കൊണ്ടിരുന്നപ്പോൾ.’
    reason: മൂലഭാഷയിലെ കാലയളവ് പൂർത്തിയായിക്കൊണ്ടിരിക്കുന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
  - marker: b
    text: അഥവാ, ‘അവന്റെ ഹൃദയത്തിൽ ഉയർന്നുവന്നു’; ഉള്ളിലെ ആഗ്രഹമോ നിശ്ചയമോ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗം.
    reason: മൂലത്തിലെ രൂപകവും അതിന്റെ സാധ്യതയുള്ള അർഥനിറങ്ങളും സംരക്ഷിക്കുന്നു.
  - marker: c
    text: ‘ഇസ്രായേൽമക്കൾ’ ഇവിടെ ഇസ്രായേല്യരെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിൽ, ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ.’
    reason: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ബന്ധുപ്രയോഗം വിശദീകരിക്കുന്നു.
lexical_decisions:
- source_word: Ὡς δὲ
  choice: അപ്പോൾ
  rationale: സംഭവവിവരണത്തിലെ ബന്ധവും സമയസൂചനയും സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിലൂടെ പ്രകടമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ എന്ന പ്രത്യേക സമയപദം ചേർക്കുന്നില്ല.
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: അവന് നാല്പതു വയസ്സ് തികഞ്ഞപ്പോൾ
  rationale: ‘നാല്പതു വർഷക്കാലം അവന് പൂർത്തിയായി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ഇത് വെറും ഏകദേശപ്രായമായി ചുരുക്കാതെ കാലയളവ് പൂർത്തിയായെന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: അവന്റെ ഹൃദയത്തിൽ ഉദിച്ചു
  rationale: ഉള്ളിലെ ആഗ്രഹമോ നിശ്ചയമോ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു; ‘അവൻ തീരുമാനിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് രൂപകം ഇല്ലാതാക്കുന്നില്ല.
- source_word: ἐπισκέψασθαι
  choice: ചെന്നുകാണാൻ
  rationale: സന്ദർശിക്കുക, സ്ഥിതി അന്വേഷിക്കുക എന്നീ അർഥനിറങ്ങൾ ഉൾക്കൊള്ളുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: തന്റെ സഹോദരന്മാരെ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചന ബന്ധുപദം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള വിശേഷണം ഇവർ മോശെയുടെ സഹഇസ്രായേല്യരാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സെമിറ്റിക് വംശനാമത്തിന് മലയാളത്തിൽ പരിചിതവും സ്വാഭാവികവുമായ രൂപം; ഇത് ‘സഹോദരന്മാർ’ ആരെന്നു വ്യക്തമാക്കുന്ന സമാനാധികരണ പ്രയോഗമാണ്.
theological_decisions:
- issue: ബന്ധുത്വപദവും ജനവിഭാഗനാമവും
  choice: തന്റെ സഹോദരന്മാരായ ഇസ്രായേൽമക്കൾ
  alternative: തന്റെ സഹഇസ്രായേല്യർ; ഇസ്രായേലിന്റെ പുത്രന്മാരായ തന്റെ സഹോദരന്മാർ
  rationale: ഇവിടെ ‘സഹോദരന്മാർ’ ജൈവസഹോദരന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല; മോശെയുടെ സ്വന്തം ജനമായ ഇസ്രായേല്യരെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലത്തിലെ കുടുംബബന്ധഭാഷയും അതിനെ വ്യക്തമാക്കുന്ന ജനവിഭാഗനാമവും രണ്ടും നിലനിർത്തുന്നു.
- issue: മോശെയുടെ ഉള്ളിലെ പ്രേരണയുടെ സ്വഭാവം
  choice: അവന്റെ ഹൃദയത്തിൽ ഉദിച്ചു
  alternative: അവൻ തീരുമാനിച്ചു; അവന് ആഗ്രഹം തോന്നി
  rationale: ഗ്രീക്ക് പ്രയോഗം ആഗ്രഹം, ഉദ്ദേശ്യം, ഉള്ളിലെ നിശ്ചയം എന്നിവയ്ക്കിടയിൽ കൃത്യമായി ഒന്ന് മാത്രം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ രൂപകം നിലനിർത്തി ദൈവിക പ്രേരണയാണോ സ്വമേധയാ എടുത്ത തീരുമാനമാണോ എന്ന് പരിഭാഷയിൽ അധികമായി നിശ്ചയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഹൃദയത്തിൽ ഉദിച്ചു’ എന്ന പ്രയോഗം മൂലത്തിലെ രൂപകം നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘ഇസ്രായേൽമക്കൾ’ പരമ്പരാഗത വേദഭാഷയും ആധുനിക വായനാസൗകര്യവും തമ്മിൽ തുലനം ചെയ്യുന്നു.
