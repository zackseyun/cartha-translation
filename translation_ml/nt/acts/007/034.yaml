  naturalness: ‘അവരുടെ നെടുവീർപ്പ് ഞാൻ കേട്ടിരിക്കുന്നു’ മാന്യമായ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ബാക്കി വാക്യക്രമവും രജിസ്റ്ററും വ്യക്തവും സ്വാഭാവികവുമാണ്.
