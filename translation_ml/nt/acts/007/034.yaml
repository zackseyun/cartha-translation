id: ACT.7.34
reference: Acts 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: ml
  text: “ഈജിപ്തിലുള്ള എന്റെ ജനത്തോടുള്ള പീഡനം[a] ഞാൻ തീർച്ചയായും കണ്ടിരിക്കുന്നു; അവരുടെ നെടുവീർപ്പ് ഞാൻ കേട്ടിരിക്കുന്നു; അവരെ വിടുവിക്കാനായി[b] ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു. ഇപ്പോൾ വരിക; ഞാൻ നിന്നെ ഈജിപ്തിലേക്ക് അയയ്ക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പീഡനം’ എന്നതിന് ‘ദുർവ്യവഹാരം’ എന്നോ ‘കഷ്ടപ്പാട്’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിടുവിക്കാനായി’ എന്നതിന് ‘രക്ഷിക്കാനായി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: ഞാൻ തീർച്ചയായും കണ്ടിരിക്കുന്നു
  rationale: പങ്കാളിക്രിയയും സമാപകക്രിയയും ചേർന്ന സെമിറ്റിക് ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘കണ്ടുകൊണ്ട് കണ്ടു’ ഒഴിവാക്കുന്നു.
- source_word: κάκωσιν
  choice: പീഡനം
  rationale: ദുഷ്‌പരിചരണവും കഷ്ടപ്പെടുത്തലും ഉൾക്കൊള്ളുന്ന പദം; സന്ദർഭത്തിലെ അടിച്ചമർത്തൽ അതിയായി വിശദീകരിക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: ഈജിപ്തിലുള്ള എന്റെ ജനം
  rationale: ജനത്തിന്റെ സ്ഥലവും ദൈവത്തോടുള്ള ഉടമസ്ഥബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: അവരുടെ ഞരക്കം
  rationale: ഗ്രീക്കിലെ ഏകവചന സർവനാമം സമൂഹവാചിയായ ‘ജനം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബഹുവചനസൂചന സ്വാഭാവികമാണ്. ‘ഞരക്കം’ വേദനയിൽനിന്നുള്ള groaning എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: κατέβην
  choice: ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു
  rationale: ദൈവിക ഇടപെടലിനെ വിവരിക്കുന്ന മനുഷ്യരൂപകഭാഷ വിശദീകരിച്ചുമാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐξελέσθαι
  choice: വിടുവിക്കാനായി
  rationale: അപകടത്തിൽനിന്നോ പീഡനത്തിൽനിന്നോ മോചിപ്പിക്കുക എന്ന ἐξαιρέωയുടെ സന്ദർഭാർഥം മാന്യവും പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δεῦρο
  choice: വരിക
  rationale: മോശെയെ മുന്നോട്ടു വിളിക്കുന്ന സംക്ഷിപ്തമായ ആഹ്വാനം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἀποστείλω σε εἰς Αἴγυπτον
  choice: ഞാൻ നിന്നെ ഈജിപ്തിലേക്ക് അയയ്ക്കും
  rationale: ഭാവികാലത്തിലുള്ള നിയോഗപ്രസ്താവനയും ലക്ഷ്യസ്ഥാനവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവം ‘ഇറങ്ങിവരുന്നു’ എന്ന മനുഷ്യരൂപകപ്രയോഗം
  choice: ഞാൻ ഇറങ്ങിവന്നിരിക്കുന്നു
  alternative: ഞാൻ ഇടപെടാൻ വന്നിരിക്കുന്നു
  rationale: മൂലപാഠത്തിലെ ദൈവിക ഇറങ്ങിവരവിന്റെ ഭാഷയെ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ അതേ രൂപകത്തോടുകൂടെ സംരക്ഷിക്കുന്നു.
- issue: ἐξελέσθαι എന്നതിലെ രക്ഷ/വിടുതൽ ആശയം
  choice: വിടുവിക്കാനായി
  alternative: രക്ഷിക്കാനായി
  rationale: രണ്ടു പദങ്ങളും സാധുവാണെങ്കിലും, പീഡനബന്ധനത്തിൽനിന്നുള്ള മോചനത്തെ ‘വിടുവിക്കുക’ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു; പ്രത്യേക സിദ്ധാന്താർഥം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ദൈവവചനശൈലി. മൂലത്തിലെ ആവർത്തനാത്മക ഊന്നൽ മലയാളത്തിൽ ക്രിയാവിശേഷണംകൊണ്ട് പ്രകടിപ്പിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [b] അടയാളം ‘come’ എന്നതിനു ശേഷമാണെങ്കിലും അതിന്റെ കുറിപ്പ് ἐξελέσθαι എന്ന പദത്തിന്റെ പകരംവിവർത്തനത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ ‘വിടുവിക്കാനായി’ എന്നതിനു ചേർത്തു.
