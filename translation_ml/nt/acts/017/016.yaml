id: ACT.17.16
reference: Acts 17:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς Ἀθήναις ἐκδεχομένου αὐτοὺς τοῦ Παύλου, παρωξύνετο τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ ⸀θεωροῦντος κατείδωλον οὖσαν τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: ml
  text: പൗലോസ് ഏഥൻസിൽ അവരെ കാത്തിരിക്കുമ്പോൾ, നഗരം വിഗ്രഹങ്ങൾകൊണ്ട് നിറഞ്ഞിരിക്കുന്നതു[b] കണ്ടുകൊണ്ടിരിക്കെ അവന്റെ ആത്മാവ് അവന്റെ ഉള്ളിൽ ക്ഷോഭിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അസ്വസ്ഥമായിക്കൊണ്ടിരുന്നു’ എന്നോ ‘ഉള്ളിൽ ഇളകിക്കൊണ്ടിരുന്നു’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് ക്രിയ തീക്ഷ്ണമായ ആന്തരിക പ്രക്ഷുബ്ധതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നഗരം വിഗ്രഹങ്ങളാൽ മൂടപ്പെട്ടിരിക്കുന്നതു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: കാത്തിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന, കൂട്ടാളികൾ വരുന്നതിനായി പൗലോസ് തുടർച്ചയായി കാത്തിരുന്ന കാലസാഹചര്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρωξύνετο
  choice: ശക്തമായി ക്ഷോഭിച്ചു
  rationale: അപൂർണ്ണകാല മധ്യ/കർമണി രൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ, തീക്ഷ്ണമായ ആന്തരിക പ്രതികരണം നിലനിർത്തുന്നു; വെറും ദുഃഖമായി അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: അവന്റെ ആത്മാവ്
  rationale: പൗലോസിന്റെ സ്വന്തം ആന്തരിക ആത്മാവിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; പരിശുദ്ധാത്മാവിനെ വിവർത്തനത്തിലൂടെ അനുമാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἐν αὐτῷ
  choice: അവന്റെ ഉള്ളിൽ
  rationale: ക്ഷോഭത്തിന്റെ ആന്തരിക സ്ഥാനം മൂലപാഠത്തിലെ ആവർത്തനത്തോടുകൂടി നിലനിർത്തുന്നു.
- source_word: θεωροῦντος
  choice: കണ്ട്
  rationale: സൂക്ഷ്മമായി നിരീക്ഷിച്ചറിഞ്ഞതോടൊപ്പം ഉണ്ടായ പ്രതികരണത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κατείδωλον
  choice: വിഗ്രഹങ്ങൾകൊണ്ട് നിറഞ്ഞിരിക്കുന്നതു
  rationale: നഗരത്തിൽ വിഗ്രഹങ്ങൾ അത്യധികമായി നിറഞ്ഞിരുന്നതെന്ന അപൂർവ വിശേഷണത്തിന്റെ ദൃശ്യവും ശക്തവുമായ അർത്ഥം നേരിട്ട് നൽകുന്നു.
- source_word: πόλιν
  choice: നഗരം
  rationale: മുമ്പ് പറഞ്ഞ ഏഥൻസിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ പൊതുനാമം അതേപടി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യക്രമം ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ അനാവശ്യമായ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പൗലോസിന്റെ സ്വന്തം മാനുഷിക ആത്മാവ്
  alternative: പരിശുദ്ധാത്മാവിന്റെ പ്രേരണയെക്കുറിച്ചുള്ള പരോക്ഷ സൂചന
  rationale: ‘അവന്റെ ആത്മാവ്’ എന്ന ഉടമസ്ഥപ്രയോഗവും ‘അവന്റെ ഉള്ളിൽ’ എന്ന പദസമുച്ചയവും പൗലോസിന്റെ ആന്തരിക പ്രതികരണത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്. പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനം വാക്യം വ്യക്തമായി പ്രസ്താവിക്കാത്തതിനാൽ അത് വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘അവന്റെ ആത്മാവ് അവന്റെ ഉള്ളിൽ’ എന്ന ചെറിയ ആവർത്തനം മൂലപാഠത്തിന്റെ ഊന്നൽ നിലനിർത്താനാണ്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
