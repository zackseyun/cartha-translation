- from: പൗലോസ് ഏഥൻസിൽ അവർക്കായി കാത്തിരിക്കുമ്പോൾ, നഗരം വിഗ്രഹങ്ങൾകൊണ്ട് നിറഞ്ഞിരിക്കുന്നതു കണ്ട് അവന്റെ ആത്മാവ് അവന്റെ ഉള്ളിൽ ശക്തമായി ക്ഷോഭിച്ചു.[a][b]
  to: പൗലോസ് ഏഥൻസിൽ അവരെ കാത്തിരിക്കുമ്പോൾ, നഗരം വിഗ്രഹങ്ങൾകൊണ്ട് നിറഞ്ഞിരിക്കുന്നതു[b] കണ്ടുകൊണ്ടിരിക്കെ അവന്റെ ആത്മാവ് അവന്റെ ഉള്ളിൽ ക്ഷോഭിച്ചുകൊണ്ടിരുന്നു.[a]
