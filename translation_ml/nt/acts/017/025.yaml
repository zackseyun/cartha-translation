source:
  edition: SBLGNT
  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: ml
  text: മനുഷ്യരുടെ കൈകളാൽ അവൻ ശുശ്രൂഷ ചെയ്യപ്പെടുന്നുമില്ല[a], അവന് എന്തെങ്കിലും ആവശ്യമുള്ളതുപോലെ; അവൻതന്നെയല്ലോ എല്ലാവർക്കും ജീവനും ശ്വാസവും സകലതും നൽകുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനുഷ്യരുടെ കൈകളാൽ ആരാധിക്കപ്പെടുന്നുമില്ല.’ ഗ്രീക്കുപദം മതപരമായ സന്ദർഭത്തിൽ അർപ്പിക്കുന്ന സേവനത്തെയോ ശുശ്രൂഷയെയോ സൂചിപ്പിക്കാം; മനുഷ്യരുടെ പരിചരണത്തെ ദൈവം ആശ്രയിക്കുന്നില്ല എന്നതാണ് ഇവിടെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: ശുശ്രൂഷ ചെയ്യപ്പെടുന്നു
  rationale: ഇവിടെ രോഗശാന്തിയല്ല, ഒരാൾക്ക് ആവശ്യമായ പരിചരണമോ സേവനമോ നൽകുന്നതാണ് അർഥം. ആരാധനാസന്ദർഭത്തിലെ സേവനവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദപ്രയോഗമാണിത്.
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: മനുഷ്യരുടെ കൈകളാൽ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ പ്രയോഗം നിലനിർത്തുകയും മനുഷ്യർ നൽകുന്ന ആരാധനാപരമായ ശുശ്രൂഷയുടെ പശ്ചാത്തലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: προσδεόμενός τινος
  choice: അവന് എന്തെങ്കിലും ആവശ്യമുള്ളതുപോലെ
  rationale: ദൈവത്തിന് മനുഷ്യസഹായം ആവശ്യമാണെന്ന സങ്കൽപ്പം നിഷേധിക്കുന്ന വാക്യത്തിന്റെ വാഗ്‌ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: മനുഷ്യരിൽനിന്ന് സ്വീകരിക്കേണ്ടവനല്ല, മറിച്ച് നൽകുന്നവനാണ് ദൈവം എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: διδοὺς
  choice: നൽകുന്നത്
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ കാരണസൂചനയോടെ വർത്തമാനകാല പ്രവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: πᾶσι
  choice: എല്ലാവർക്കും
  rationale: ദാതാവായ ദൈവത്തിന്റെ സാർവത്രിക വ്യാപ്തി വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ പ്രധാനമായും ജീവികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ζωὴν
  choice: ജീവൻ
  rationale: ദൈവം ജീവന്റെ ദാതാവാണെന്ന അടിസ്ഥാന അർഥം നേരിട്ട് പകരുന്നു.
- source_word: πνοὴν
  choice: ശ്വാസം
  rationale: ζωή എന്ന പദത്തോടുള്ള കൂട്ടുപ്രയോഗത്തിൽ ജീവികളുടെ ആശ്രിതാവസ്ഥയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക അർഥം; ‘ആത്മാവ്’ എന്നത് ഇവിടെ അതിവ്യാഖ്യാനമാകും.
- source_word: καὶ τὰ πάντα
  choice: സകലതും
  rationale: ജീവനും ശ്വാസവും മാത്രമല്ല, സൃഷ്ടികൾക്കുള്ള എല്ലാറ്റിന്റെയും ദാതാവ് ദൈവമാണെന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: οὐδὲ
  choice: ചെയ്യപ്പെടുന്നുമില്ല
  rationale: മുൻവാക്യത്തിലെ നിഷേധാത്മക വിവരണത്തിന്റെ തുടർച്ച മലയാളത്തിലെ ‘-ഉമില്ല’ രൂപത്തിലൂടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: θεραπεύεται എന്നത് വ്യക്തമായി ‘ആരാധിക്കപ്പെടുന്നു’ എന്നോ കൂടുതൽ വിശാലമായി സേവനം/ശുശ്രൂഷ സ്വീകരിക്കുന്നു എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ശുശ്രൂഷ ചെയ്യപ്പെടുന്നു
  alternative: ആരാധിക്കപ്പെടുന്നു
  rationale: പൗലൊസിന്റെ വാദം ദൈവം മനുഷ്യരുടെ മതപരമായ പരിചരണത്തെയോ സേവനത്തെയോ ആശ്രയിക്കുന്നില്ല എന്നതാണ്. ‘ശുശ്രൂഷ ചെയ്യപ്പെടുന്നു’ ആരാധനാപരമായ സേവനം ഉൾക്കൊള്ളുമ്പോഴും അർഥത്തെ ആരാധനയിൽ മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശുശ്രൂഷ ചെയ്യപ്പെടുന്നു’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ദൈവിക passive രൂപവും മതപരമായ സേവനത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; ‘സകലതും’ വാക്യത്തിന്റെ ഗൗരവമുള്ള സമാപനം സംരക്ഷിക്കുന്നു.
