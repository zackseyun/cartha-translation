id: ACT.17.34
reference: Acts 17:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: ml
  text: എന്നാൽ ചില പുരുഷന്മാർ പൗലോസിനോടു ചേർന്നു വിശ്വസിച്ചു.[a] അവരിൽ അരയോപഗിതനായ ദിയോനീസിയോസും[b] ദമരിസ് എന്നു പേരുള്ള ഒരു സ്ത്രീയും അവരോടൊപ്പം മറ്റുള്ളവരും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചേർന്നു” എന്നതിന് “അദ്ദേഹത്തോടു ബന്ധപ്പെട്ടു” എന്നോ “അദ്ദേഹത്തോടു അടുത്തുചേർന്നു” എന്നോ വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം പൗലോസുമായുള്ള അടുത്ത വ്യക്തിബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “അരയോപഗിതൻ” എന്നത് അരയോപഗോസ് എന്ന ഭരണ-ന്യായസഭയിലെ ഒരു അംഗത്തെയോ ആ സഭയുമായി ബന്ധപ്പെട്ട ഒരാളെയോ സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: എന്നാൽ ചില പുരുഷന്മാർ
  rationale: δὲ മുൻവാക്യത്തിലെ പ്രതികരണങ്ങളോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ἄνδρες ഇവിടെ വ്യക്തമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തി.
- source_word: κολληθέντες αὐτῷ
  choice: പൗലോസിനോടു ചേർന്ന്
  rationale: κολλάομαι അടുത്ത ബന്ധത്തോടെ ഒരാളോടു ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. സർവനാമത്തിന്റെ സൂചിത വ്യക്തി സന്ദർഭത്തിൽ പൗലോസ് ആണെന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തതയ്ക്കായി പേര് ഉപയോഗിച്ചു; ബന്ധത്തിന്റെ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; വിശ്വാസത്തിന്റെ കർമമോ വിപുലമായ സിദ്ധാന്തപരമായ സൂത്രവാക്യമോ വാക്യത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐν οἷς καὶ
  choice: അവരിൽ ... ഉണ്ടായിരുന്നു
  rationale: വിശ്വസിച്ചവരിൽ പേരെടുത്ത് പറയുന്നവരെ അവതരിപ്പിക്കുന്ന ബന്ധവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: അരയോപഗോസ് സഭാംഗമായ ദിയോനീസിയോസ്
  rationale: Ἀρεοπαγίτης എന്ന പദം അരയോപഗോസുമായി ഔദ്യോഗികമായി ബന്ധപ്പെട്ടയാളെ, സാധ്യതയേറിയ അർഥത്തിൽ സഭാംഗത്തെ, സൂചിപ്പിക്കുന്നു. പദത്തിന്റെ ചെറിയ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: ദമരിസ് എന്നു പേരുള്ള ഒരു സ്ത്രീ
  rationale: സ്ത്രീലിംഗസൂചനയും വ്യക്തിനാമവും നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: അവരോടൊപ്പമുള്ള മറ്റുള്ളവർ
  rationale: പേരെടുത്ത രണ്ടുപേർക്കു പുറമേ ഉണ്ടായിരുന്ന കൂടുതൽ ആളുകളെയും അവരുടെ സഹവർത്തിത്വത്തെയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: πιστεύω എന്ന ക്രിയയുടെ സന്ദർഭാർഥം
  choice: വിശ്വസിച്ചു
  alternative: വിശ്വാസത്തിലേക്കു വന്നു
  rationale: പൗലോസിന്റെ പ്രസംഗത്തോടുള്ള യഥാർഥ വിശ്വാസപ്രതികരണമാണ് വിവരണം; എന്നാൽ മൂലവാക്യം കൂടുതൽ സമ്പൂർണമായ സിദ്ധാന്തപരമായ പ്രയോഗം നൽകാത്തതിനാൽ ലളിതമായ ക്രിയ നിലനിർത്തി.
- issue: κολληθέντες എന്നതിലെ വ്യക്തിബന്ധത്തിന്റെ ശക്തി
  choice: പൗലോസിനോടു ചേർന്ന്
  alternative: പൗലോസിനോടു പറ്റിച്ചേർന്ന്
  rationale: അവരുടെ പ്രതികരണം കേവലം ആശയസമ്മതമല്ല, പൗലോസുമായുള്ള അടുത്ത ചേർച്ചയും ആണെന്ന ഭാവം സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ അതിരുകടന്ന വികാരഭാവം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർത്ത് ലിപ്യന്തരിച്ചു. മൂലത്തിലെ പുരുഷലിംഗസൂചനയും ‘വിശ്വസിച്ചു’ എന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംയമനവും നിലനിർത്തി; സാംസ്കാരികവും പദാർഥപരവുമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
