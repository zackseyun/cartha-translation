id: ACT.17.32
reference: Acts 17:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: ml
  text: മരിച്ചവരുടെ പുനരുത്ഥാനത്തെക്കുറിച്ചു കേട്ടപ്പോൾ ചിലർ പരിഹസിച്ചു. എന്നാൽ മറ്റുള്ളവർ, “ഇതിനെക്കുറിച്ച് താങ്കൾ പറയുന്നത് ഞങ്ങൾ മറ്റൊരിക്കൽ കേൾക്കാം,” എന്നു പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഇതിനെക്കുറിച്ച് ഞങ്ങൾ താങ്കളെ വീണ്ടും കേൾക്കും.”'
    reason: ഗ്രീക്കിലെ καὶ πάλιν (‘വീണ്ടും’) എന്നതിന്റെ വ്യക്തമായ ബലം കാണിക്കുന്ന കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള പദക്രമം.
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: കേട്ടപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലസാഹചര്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. δὲ ഇവിടെ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ അനാവശ്യമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല; തുടർന്നുള്ള വിരോധം ‘എന്നാൽ’ വഴി പ്രകടമാകുന്നു.
- source_word: ἀνάστασιν νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: മരിച്ചവരെ സംബന്ധിക്കുന്ന പുനരുത്ഥാനം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയവ്യാപ്തി നിലനിർത്തുന്നു; ‘മരിച്ചവരിൽനിന്നുള്ള’ എന്ന് മാറ്റി അർഥം ചുരുക്കുന്നില്ല.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ചിലർ ... എന്നാൽ മറ്റുള്ളവർ
  rationale: രണ്ട് വിഭാഗങ്ങളുടെ പ്രതികരണങ്ങൾ തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐχλεύαζον
  choice: പരിഹസിച്ചു
  rationale: അപഹസിക്കുകയോ കളിയാക്കുകയോ ചെയ്ത പ്രതികരണം നേരിട്ട് നൽകുന്നു; അപൂർണ്ണഭൂതകാലരൂപത്തിൽനിന്ന് നിർബന്ധമല്ലാത്ത ‘പരിഹസിക്കാൻ തുടങ്ങി’ എന്ന ആരംഭാർഥം ചേർക്കുന്നില്ല.
- source_word: Ἀκουσόμεθά σου
  choice: താങ്കൾ പറയുന്നത് ഞങ്ങൾ ... കേൾക്കാം
  rationale: വ്യക്തിയുടെ വാക്കു കേൾക്കുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. ‘താങ്കൾ’ പൊതുസഭയിലെ മാന്യമായ അഭിസംബോധനയ്ക്കു യോജിക്കുന്നു.
- source_word: περὶ τούτου καὶ πάλιν
  choice: ഇതിനെക്കുറിച്ച് ... മറ്റൊരിക്കൽ
  rationale: സംസാരവിഷയവും വീണ്ടും/മറ്റൊരു അവസരത്തിൽ കേൾക്കുമെന്ന കാലസൂചനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀνάστασιν νεκρῶν എന്ന പുനരുത്ഥാനഭാഷയുടെ വ്യാപ്തി
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  alternative: മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം
  rationale: ഗ്രീക്ക് പ്രയോഗം മരിച്ചവരെ ഒരു വിഭാഗമായി ഉൾക്കൊള്ളുന്ന പുനരുത്ഥാനധാരണയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി മുൻകൂട്ടി ചുരുക്കാതിരിക്കാൻ കൂടുതൽ ഔപചാരികമായ രൂപം നിലനിർത്തി.
- issue: രണ്ടാമത്തെ വിഭാഗത്തിന്റെ മറുപടി താൽപര്യമോ വിനയപൂർവമായ നീട്ടിവെക്കലോ എന്നത്
  choice: നിഷ്പക്ഷമായി ‘മറ്റൊരിക്കൽ കേൾക്കാം’
  alternative: അവർ കൂടുതൽ അറിയാൻ ആഗ്രഹിച്ചു / അവർ അവനെ നിരസിച്ചു
  rationale: വാക്കുകൾ വീണ്ടും കേൾക്കുമെന്നു മാത്രമേ വ്യക്തമാക്കുന്നുള്ളൂ; അവരുടെ ഉള്ളുദ്ദേശം വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മറ്റൊരിക്കൽ കേൾക്കാം’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ഭാവികാലത്തെയും വീണ്ടും കേൾക്കുമെന്ന ആശയത്തെയും സ്വാഭാവികമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
