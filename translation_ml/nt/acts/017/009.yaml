id: ACT.17.9
reference: Acts 17:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λαβόντες τὸ ἱκανὸν παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν ἀπέλυσαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/009.yaml
  text: And after taking security from Jason and the others[a], they released them.
translation:
  language: ml
  text: അവർ യാസോനിൽനിന്നും മറ്റുള്ളവരിൽനിന്നും മതിയായ ജാമ്യം[a] വാങ്ങിയശേഷം അവരെ വിട്ടയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മതിയായ തുക”; സമാധാനപരമായി പെരുമാറുമെന്ന് ഉറപ്പാക്കാൻ നൽകിയ നിയമപരമായ ഈടോ ബോണ്ടോ ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: വാങ്ങിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ ἱκανὸν
  choice: മതിയായ ജാമ്യം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ മതിയായ ഉറപ്പോ സാമ്പത്തിക ഈടോ സ്വീകരിച്ചതാണ് സൂചന. ‘ജാമ്യം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘മതിയായ’ എന്ന പദം ഗ്രീക്കിലെ ἱκανόν എന്നതിന്റെ അളവുസൂചനയും നിലനിർത്തുന്നു.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: യാസോനിൽനിന്നും മറ്റുള്ളവരിൽനിന്നും
  rationale: παρά + genitive ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; λοιποί ഇവിടെ യാസോനോടൊപ്പമുള്ള ശേഷിച്ച ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπέλυσαν
  choice: വിട്ടയച്ചു
  rationale: തടഞ്ഞുവെച്ചിരുന്നവരെ ഔദ്യോഗികമായി പോകാൻ അനുവദിച്ചെന്ന ന്യായപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: തടഞ്ഞുവെക്കപ്പെട്ട യാസോനെയും മറ്റുള്ളവരെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമസന്ദർഭ ഭാഷ ഉപയോഗിച്ചു. ‘ജാമ്യം’ പരിചിതമായ പദമാണെങ്കിലും ഗ്രീക്ക് കൃത്യമായി ഏത് തരത്തിലുള്ള ഈടിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് നിർണയിക്കാത്തതിനാൽ അടിക്കുറിപ്പിൽ പദശഃ സാധ്യതയും പ്രവർത്തനപരമായ വിശദീകരണവും നൽകി.
