id: ACT.17.14
reference: Acts 17:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: ml
  text: അപ്പോൾ സഹോദരന്മാർ[a] പൗലോസിനെ ഉടൻതന്നെ കടൽവരെ[b] പോകാൻ അയച്ചുവിട്ടു; എന്നാൽ ശീലാസും തിമൊഥെയൊസും അവിടെത്തന്നെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാർ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ പദം സഹവിശ്വാസികളെ കൂട്ടമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കടലിലേക്ക്’ അല്ലെങ്കിൽ ‘കടലിന്റെ ദിശയിലേക്ക്’; ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ കൃത്യമായി ഒന്നും വ്യക്തമാക്കാതെ കടൽത്തീരംവരെയുള്ള യാത്രയെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: അപ്പോൾ ... ഉടൻതന്നെ
  rationale: δὲ τότε സൂചിപ്പിക്കുന്ന ആഖ്യാനത്തിലെ സമയമാറ്റം ‘അപ്പോൾ’ എന്നും εὐθέως സൂചിപ്പിക്കുന്ന ത്വരിതത്വം ‘ഉടൻതന്നെ’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξαπέστειλαν
  choice: പറഞ്ഞയച്ചു
  rationale: ഒരു സ്ഥലത്തുനിന്ന് പുറപ്പെടുവിച്ചയയ്ക്കുക എന്ന സംയുക്തക്രിയയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സഹവിശ്വാസികളെ കൂട്ടമായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πορεύεσθαι
  choice: പോകാൻ
  rationale: അയച്ചതിന്റെ ഉദ്ദേശ്യം ലളിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: കടൽവരെ
  rationale: കടൽത്തീരംവരെ നീങ്ങുക എന്ന അർഥം നിലനിർത്തുകയും, തീരമാണോ കടൽമാർഗമുള്ള തുടർയാത്രയാണോ എന്നത് നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπέμεινάν
  choice: തുടർന്നു
  rationale: ഇവിടെ കഷ്ടം സഹിക്കുക എന്നതല്ല, അതേ സ്ഥലത്ത് ശേഷിക്കുക എന്ന സന്ദർഭാർഥമാണ്; ‘അവിടെത്തന്നെ തുടർന്നു’ ഈ വിരുദ്ധത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: ശീലാസും തിമൊഥെയൊസും
  rationale: τε ... καὶ എന്ന കൂട്ടിച്ചേർക്കൽ ഇരുവരെയും സമപ്രാധാന്യത്തോടെ ഉൾപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘-ഉം ... -ഉം’ അതിന് സ്വാഭാവിക സമാനമാണ്.
- source_word: ἐκεῖ
  choice: അവിടെത്തന്നെ
  rationale: സ്ഥലസൂചന നൽകുന്നതോടൊപ്പം പൗലോസിന്റെ പുറപ്പെടലുമായുള്ള വ്യത്യാസം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ἀδελφοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ സന്ദർഭത്തിൽ മുഴുവൻ സഹവിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ളതിനാൽ ആ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പറഞ്ഞയച്ചു’, ‘അവിടെത്തന്നെ തുടർന്നു’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിലെ പുറപ്പെടൽ–താമസം എന്ന വ്യത്യാസം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
