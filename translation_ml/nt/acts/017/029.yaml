id: ACT.17.29
reference: Acts 17:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: ml
  text: അതുകൊണ്ട്, നാം ദൈവത്തിന്റെ സന്തതിയായിരിക്കെ, ദൈവികസത്ത[a] സ്വർണം, വെള്ളി, കല്ല് എന്നിവപോലെയോ മനുഷ്യന്റെ കരകൗശലവും ഭാവനയുംകൊണ്ട് രൂപപ്പെടുത്തിയ കൊത്തുരൂപം[b] പോലെയോ ആണെന്നു നാം കരുതരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവത്വം,” “ദൈവികസ്വഭാവം” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം ദൈവികമായതിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഇവിടെ പൗലോസിന്റെ വാദത്തിൽ അത് സത്യദൈവത്തെയാണ് പരാമർശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “കൊത്തിയെടുത്ത രൂപം” അല്ലെങ്കിൽ “കൊത്തിയുണ്ടാക്കിയ വസ്തു” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: സന്തതി
  rationale: ദൈവത്തിൽനിന്നുള്ള ഉത്ഭവവും ബന്ധവും സൂചിപ്പിക്കുന്നു; വംശം എന്നത് ജനവിഭാഗപരമായ അർഥം വരുത്താനിടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽനിന്ന് പൗലോസ് എത്തുന്ന നിഗമനം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὑπάρχοντες
  choice: ആയിരിക്കെ
  rationale: സന്ദർഭത്തിലെ കാരണാത്മക പങ്ക് സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: നാം കരുതരുത്
  rationale: ചിന്തയോടു ബന്ധപ്പെട്ട ധാർമിക ബാധ്യതയും അനുചിതത്വവും ലളിതമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: സ്വർണം, വെള്ളി, കല്ല് എന്നിവപോലെ
  rationale: ഗ്രീക്കിൽ പേരെടുത്ത മൂന്നു വസ്തുക്കളും നിലനിർത്തുന്നു.
- source_word: χαράγματι
  choice: കൊത്തുരൂപം
  rationale: കൊത്തിയോ രേഖപ്പെടുത്തിയോ നിർമിച്ച വസ്തു/രൂപം എന്ന അർഥം നൽകുന്നു; പ്രതിമ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: മനുഷ്യന്റെ കരകൗശലവും ഭാവനയുംകൊണ്ട് രൂപപ്പെടുത്തിയ
  rationale: τέχνηയിലെ നിർമാണവൈദഗ്ധ്യവും ἐνθύμησις എന്നതിലെ മാനസിക സങ്കൽപ്പവും സ്വാഭാവികമായി ചേർത്തു പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ θεῖον
  choice: ദൈവികസത്ത
  rationale: ദൈവികമായതിനെ സൂചിപ്പിക്കുന്ന വിശാലമായ പദത്തിന്റെ തത്ത്വചിന്താപരമായ ഭാവം നിലനിർത്തുന്നു; അതിനെ വ്യക്തിത്വരഹിതമായ ശക്തിയെന്നോ പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദമെന്നോ നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ഏകദൈവവിശ്വാസപരവും തത്ത്വചിന്താപരവുമായ പ്രസംഗത്തിൽ τὸ θεῖον എന്നതിന്റെ വിവർത്തനം
  choice: ദൈവികസത്ത
  alternative: ദൈവത്വം; ദൈവികസ്വഭാവം; ദൈവം
  rationale: സത്യദൈവത്തെയാണ് പൗലോസ് ഉദ്ദേശിക്കുന്നതെങ്കിലും, അദ്ദേഹത്തിന്റെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലതയും അരയോപാഗസ് പ്രസംഗത്തിന്റെ തത്ത്വചിന്താപരമായ രജിസ്റ്ററും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. തത്ത്വചിന്താപരമായ τὸ θεῖον എന്ന പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചിരിക്കുന്നു; വിഗ്രഹനിർമാണത്തിന്റെ കലാപരവും മാനസികവുമായ രണ്ടു ഘടകങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
