  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ഏക ക്രിയയുടെ പരിധി മലയാളത്തിൽ വ്യക്തവും ഒഴുക്കുള്ളതുമാക്കാൻ രണ്ട് ഘടകങ്ങളിലും ‘സംവദിച്ചു’ ആവർത്തിച്ചു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് തൊട്ടുപിന്നിൽ നൽകിയിരിക്കുന്നു.
