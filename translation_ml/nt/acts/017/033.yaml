  text: So Paul went out from among them[a].
translation:
  language: ml
  text: അങ്ങനെ പൗലോസ് അവരുടെ ഇടയിൽനിന്ന് പുറത്തുപോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇപ്രകാരം പൗലോസ് അവരുടെ മധ്യത്തിൽനിന്ന് പിരിഞ്ഞുപോയി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: സംഭവവിവരണത്തെ സമാപിപ്പിക്കുന്ന ‘അങ്ങനെ/ഇപ്രകാരം’ എന്ന ബന്ധകാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ Παῦλος
  choice: പൗലോസ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പ്രചാരമുള്ള പേരുരൂപം നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറത്തുപോയി
  rationale: ἐξέρχομαι എന്ന ക്രിയയിലെ പുറത്തേക്കുള്ള ചലനാർഥം തുടർന്നുള്ള ἐκ μέσου αὐτῶν എന്ന പ്രയോഗത്തോടൊപ്പം വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ἐκ μέσου αὐτῶν
  choice: അവരുടെ ഇടയിൽനിന്ന്
  rationale: കൂടിയിരുന്ന ആ സമൂഹത്തിന്റെ മധ്യത്തിൽനിന്ന് പിരിഞ്ഞുപോകുന്നതിനെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions: []
