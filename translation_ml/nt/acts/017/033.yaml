  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി; മൂലത്തിലെ ചുരുക്കവും ചലനാർഥവും നിലനിർത്തിയിരിക്കുന്നു.
