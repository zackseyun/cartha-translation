  to: അതുകൊണ്ട് അവരിൽ പലരും വിശ്വസിച്ചു; മാന്യസ്ഥാനമുള്ള ഗ്രീക്ക് സ്ത്രീകളിൽനിന്നും പുരുഷന്മാരിൽനിന്നും കുറച്ചുപേരല്ല വിശ്വസിച്ചത്.[a]
  rationale: ‘സ്ത്രീകളിൽനിന്നും പുരുഷന്മാരിൽനിന്നും’ separates the two coordinated groups and prevents ‘ഗ്രീക്ക്’ and ‘മാന്യസ്ഥാനമുള്ള’ from being read as modifiers of ‘പുരുഷന്മാർ.’ The explicit repeated verb is natural Malayalam and reflects the shared Greek predicate without adding theological content. The footnote remains correctly anchored to the preserved litotes.
