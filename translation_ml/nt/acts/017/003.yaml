source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: ml
  text: മശീഹ കഷ്ടം അനുഭവിക്കുകയും മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുകയും ചെയ്യേണ്ടതായിരുന്നു എന്നും, “ഞാൻ നിങ്ങളോടു പ്രഖ്യാപിക്കുന്ന ഈ യേശുവാണ് മശീഹ” എന്നും അവൻ വ്യക്തമായിക്കാണിച്ചും തെളിവുകൾ നിരത്തിയും പറഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മശീഹ” എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. “ഉയിർത്തെഴുന്നേൽക്കുക” എന്നതിന് “മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെടുക” എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; എന്നാൽ ഇവിടെ ഗ്രീക്കിൽ സജീവരൂപമാണ്.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: വിശദീകരിച്ചും
  rationale: തിരുവെഴുത്തുകളുടെ അർഥം തുറന്നുകാട്ടുകയോ വ്യക്തമാക്കുകയോ ചെയ്യുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: παρατιθέμενος
  choice: തെളിവുകൾ നിരത്തിയും
  rationale: വാദത്തിനുള്ള ആധാരങ്ങൾ ശ്രോതാക്കളുടെ മുമ്പിൽ അവതരിപ്പിക്കുന്ന അർഥം നൽകുന്നു; ഔപചാരികമായി തെളിയിച്ചു എന്ന അതിശക്തമായ അവകാശവാദം ഒഴിവാക്കുന്നു.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: മശീഹ
  rationale: രണ്ടിടത്തും Χριστός വ്യക്തിനാമത്തിന്റെ ഭാഗമായി അല്ല, പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തന്റെ പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നു.
- source_word: ἔδει
  choice: ചെയ്യേണ്ടത് അനിവാര്യമായിരുന്നു
  rationale: തിരുവെഴുത്തിൽ അധിഷ്ഠിതമായ ദൈവിക അനിവാര്യതയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: παθεῖν
  choice: കഷ്ടം അനുഭവിക്കുകയും
  rationale: മശീഹയുടെ പീഡാനുഭവത്തെ സൂചിപ്പിക്കുന്ന πάσχωയുടെ സാധാരണവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽക്കുകയും
  rationale: സജീവരൂപത്തിലുള്ള ഗ്രീക്ക് അനന്തക്രിയയുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: καταγγέλλω ὑμῖν
  choice: ഞാൻ നിങ്ങളോടു പ്രസംഗിക്കുന്ന
  rationale: പൊതുവായി പ്രഖ്യാപിക്കുന്ന പ്രവൃത്തിയെ മലയാള ബൈബിൾ വ്യവഹാരത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; സന്ദേശത്തിന്റെ ശ്രോതാക്കളെയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പദവിപരമായ പ്രയോഗം
  choice: രണ്ടിടത്തും “മശീഹ”
  alternative: രണ്ടിടത്തും “ക്രിസ്തു”
  rationale: യേശുവാണ് തിരുവെഴുത്തുകളിൽ പ്രതീക്ഷിക്കപ്പെട്ട അഭിഷിക്തൻ എന്ന വാദമാണ് വാക്യത്തിലുള്ളത്; അതിനാൽ യഹൂദ-തിരുവെഴുത്തു പശ്ചാത്തലം “മശീഹ” കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: ἀναστῆναι എന്നതിന്റെ കർത്തൃപ്രയോഗ ഭാവം
  choice: ഉയിർത്തെഴുന്നേൽക്കുക
  alternative: ഉയിർപ്പിക്കപ്പെടുക
  rationale: ഇവിടെ ഗ്രീക്കിൽ സജീവ അനന്തക്രിയയാണ്. പുതിയ നിയമത്തിലെ മറ്റു ഭാഗങ്ങളിൽ ദൈവം യേശുവിനെ ഉയിർപ്പിച്ചു എന്നു പറയുന്നതിനെ നിഷേധിക്കാതെ, ഈ വാക്യത്തിന്റെ രൂപം തന്നെ പരിഭാഷയിൽ പിന്തുടരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ടു പങ്കാളിക്രിയകളെയും “വിശദീകരിച്ചും തെളിവുകൾ നിരത്തിയും” എന്ന സമാന്തര ഘടനയിൽ സൂക്ഷിച്ചു. ഉദ്ധരണി ഉപയോഗിച്ച് പൗലോസിന്റെ പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കം വ്യക്തമായി വേർതിരിച്ചു.
