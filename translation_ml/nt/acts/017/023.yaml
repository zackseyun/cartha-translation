id: ACT.17.23
reference: Acts 17:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ കടന്നുപോകുന്നതിനിടെ നിങ്ങളുടെ ആരാധനാവസ്തുക്കൾ സൂക്ഷ്മമായി നിരീക്ഷിച്ചപ്പോൾ, ‘അജ്ഞാതനായ ഒരു ദൈവത്തിന്’[a] എന്ന് ലിഖിതമുണ്ടായിരുന്ന ഒരു യാഗപീഠംപോലും കണ്ടു. അതിനാൽ, നിങ്ങൾ അറിയാതെ ആരാധിക്കുന്നത് എന്താണോ,[b] അതാണ് ഞാൻ നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അജ്ഞാത ദൈവത്തിന്.’ ഗ്രീക്ക് ലിഖിതത്തിൽ നിശ്ചിത ഉപപദമില്ല; അതിനാൽ ‘ഒരു’ ചേർത്ത അനിശ്ചിത വായനയും ‘ഒരു’ ഇല്ലാത്ത ചുരുക്കവായനയും സാധ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ അറിയാതെ ആരെ ആരാധിക്കുന്നുവോ.’ എന്നാൽ ഗ്രീക്കിൽ ‘ആർ’ എന്ന വ്യക്തിനിർദ്ദേശ രൂപമല്ല, ‘എന്ത്/അത്’ എന്ന നപുംസകലിംഗ ആപേക്ഷിക സർവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: ഞാൻ കടന്നുപോകുന്നതിനിടെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പുരോഗമനാത്മകവും കാലസൂചകവുമായ അർഥം സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നഗരത്തിലൂടെ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀναθεωρῶν
  choice: സൂക്ഷ്മമായി നിരീക്ഷിച്ചപ്പോൾ
  rationale: വെറുതെ കാണുന്നതിലുപരി ശ്രദ്ധയോടെ നോക്കുക എന്ന ക്രിയയുടെ അർഥം പ്രകടമാക്കുന്നു.
- source_word: τὰ σεβάσματα
  choice: നിങ്ങളുടെ ആരാധനാവസ്തുക്കൾ
  rationale: ആരാധനയ്ക്കോ മതപരമായ ആദരവിനോ വിധേയമായ വിവിധ വസ്തുക്കളെ ഉൾക്കൊള്ളുന്ന വിശാലമായ പദപ്രയോഗം; ‘ക്ഷേത്രങ്ങൾ’ പോലുള്ള ചുരുങ്ങിയ അർഥം ഒഴിവാക്കുന്നു.
- source_word: βωμόν
  choice: യാഗപീഠം
  rationale: മതപരമായ ബലിപീഠത്തെ സൂചിപ്പിക്കുന്ന βωμός എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാള തത്തുല്യം.
- source_word: ἐπεγέγραπτο
  choice: കൊത്തിവെച്ചിരുന്ന
  rationale: യാഗപീഠത്തിലെ മുൻകൂട്ടിയുള്ള ലിഖിതത്തെ സൂചിപ്പിക്കുന്ന പൂർത്തഭൂതകാല നിഷ്ക്രിയഭാവം സാഹചര്യോചിതമായി നൽകുന്നു.
- source_word: Ἀγνώστῳ θεῷ
  choice: അജ്ഞാതനായ ഒരു ദൈവത്തിന്
  rationale: ലേഖനത്തിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ അനിശ്ചിതത്വം ‘ഒരു’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; സമർപ്പണലിഖിതത്തിന്റെ ദാതൃവിഭക്തിയും നിലനിർത്തുന്നു.
- source_word: ὃ οὖν
  choice: അതിനാൽ ... എന്താണോ
  rationale: οὖν എന്നതിന്റെ നിഗമനബന്ധവും ὃ എന്ന നപുംസകലിംഗ ആപേക്ഷിക സർവനാമത്തിന്റെ വസ്തുനിർദ്ദേശവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἀγνοοῦντες
  choice: അറിയാതെ
  rationale: ആരാധനയുടെ രീതി വ്യക്തമാക്കുന്ന കൃദന്തരൂപം സ്വാഭാവികമായി നൽകുകയും ‘അജ്ഞാതൻ’ എന്ന ആശയത്തോടുള്ള വാചകബന്ധം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐσεβεῖτε
  choice: ആരാധിക്കുന്നത്
  rationale: ഇവിടെ മതപരമായ ഭക്ത്യാദരത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സന്ദർഭോചിത പദം.
- source_word: καταγγέλλω
  choice: ഞാൻ നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നത്
  rationale: പരസ്യവും അധികാരപൂർവവുമായ അറിയിപ്പിന്റെ ഭാവം ‘പ്രഖ്യാപിക്കുക’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὃ എന്ന നപുംസകലിംഗ ആപേക്ഷിക സർവനാമത്തിന്റെ സൂചന
  choice: ‘നിങ്ങൾ അറിയാതെ ആരാധിക്കുന്നത് എന്താണോ’ എന്ന വസ്തുനിർദ്ദേശ രൂപം
  alternative: ‘നിങ്ങൾ അറിയാതെ ആരെ ആരാധിക്കുന്നുവോ’ എന്ന വ്യക്തിനിർദ്ദേശ രൂപം
  rationale: ഗ്രീക്ക് പാഠം നപുംസകലിംഗ സർവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ ദൈവത്തെ നേരിട്ട് വ്യക്തിനിർദ്ദേശമായി മാറ്റാതെ, അഥേനക്കാരുടെ ആരാധനാവിഷയത്തെക്കുറിച്ചുള്ള പൗലൊസിന്റെ ഉദ്ദേശപൂർവമായ വാചകസംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: Ἀγνώστῳ θεῷ എന്ന ലിഖിതത്തിലെ നിർദേശകത
  choice: ‘അജ്ഞാതനായ ഒരു ദൈവത്തിന്’
  alternative: ‘അജ്ഞാത ദൈവത്തിന്’
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ല; മലയാളത്തിൽ ‘ഒരു’ ചേർക്കുന്നത് സ്വാഭാവികമായ അനിശ്ചിത വായന നൽകുന്നു. എങ്കിലും നിർദേശകത വ്യക്തമാക്കാതെ തന്നെ മറ്റൊരു ചുരുക്കവായന സാധ്യമാണെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രസംഗശൈലി സ്വീകരിച്ചു. ‘ആരാധനാവസ്തുക്കൾ,’ ‘യാഗപീഠം,’ ‘പ്രഖ്യാപിക്കുന്നു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സന്ദർഭത്തിന്റെ മതപരമായ ഔപചാരികത നിലനിർത്തുന്നതുമാണ്. ഗ്രീക്കിന്റെ ദീർഘവാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ സൂക്ഷിച്ചു; അനാവശ്യമായ സ്ഥലസൂചനകളോ വിഭാഗീയ വ്യാഖ്യാനങ്ങളോ ചേർത്തിട്ടില്ല.
