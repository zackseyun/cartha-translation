revisions:
- from: എന്തെന്നാൽ, ഞാൻ കടന്നുപോകുന്നതിനിടെ നിങ്ങളുടെ ആരാധനാവസ്തുക്കൾ സൂക്ഷ്മമായി നിരീക്ഷിച്ചപ്പോൾ, ‘അജ്ഞാതനായ ഒരു ദൈവത്തിന്’[a] എന്ന് കൊത്തിവെച്ചിരുന്ന ഒരു യാഗപീഠംപോലും കണ്ടു. അതിനാൽ, നിങ്ങൾ അറിയാതെ ആരാധിക്കുന്നത് എന്താണോ,[b] അതാണ് ഞാൻ നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നത്.
  to: എന്തെന്നാൽ, ഞാൻ കടന്നുപോകുന്നതിനിടെ നിങ്ങളുടെ ആരാധനാവസ്തുക്കൾ സൂക്ഷ്മമായി നിരീക്ഷിച്ചപ്പോൾ, ‘അജ്ഞാതനായ ഒരു ദൈവത്തിന്’[a] എന്ന് ലിഖിതമുണ്ടായിരുന്ന ഒരു യാഗപീഠംപോലും കണ്ടു. അതിനാൽ, നിങ്ങൾ അറിയാതെ ആരാധിക്കുന്നത് എന്താണോ,[b] അതാണ് ഞാൻ നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നത്.
  rationale: The revision removes the unsupported implication that the altar text was engraved, while retaining the temporal-progressive sense, the broad category of religious objects, the articleless dedication, and the intentionally neuter reference to the object of worship. Footnote a is adjusted to use more accurate grammatical terminology.
