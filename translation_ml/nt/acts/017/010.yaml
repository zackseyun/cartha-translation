source:
  edition: SBLGNT
  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: ml
  text: സഹോദരന്മാർ[a] പൗലോസിനെയും ശീലാസിനെയും ഉടനെ രാത്രിയിൽ ബെരോവ്യയിലേക്കു അയച്ചുവിട്ടു. അവർ അവിടെ എത്തിയപ്പോൾ യെഹൂദന്മാരുടെ സിനഗോഗിലേക്കു ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാർ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്. ഈ പദത്തിന് വിശ്വാസിസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹം പൊതുവായി ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: നടപടി താമസമില്ലാതെ നടന്നുവെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ νυκτός
  choice: രാത്രിയിൽ
  rationale: രാത്രിസമയത്ത് യാത്രയയച്ചുവെന്ന കാലസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξέπεμψαν
  choice: അയച്ചു
  rationale: ἐκπέμπω എന്ന ക്രിയയുടെ ‘പുറത്തേക്ക്/അകലെ അയയ്ക്കുക’ എന്ന സന്ദർഭാർഥം ലക്ഷ്യസ്ഥാനം ചേർന്ന വാക്യത്തിൽ ‘അയച്ചു’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: പൗലോസിനെയും ശീലാസിനെയും
  rationale: τε ... καί ഇരുവരെയും ഉൾക്കൊള്ളുന്നതായി മലയാളത്തിലെ ‘-യെയും ... -യെയും’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: Βέροιαν
  choice: ബെരോവ
  rationale: ഗ്രീക്ക് Βέροια എന്ന സ്ഥലനാമത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: οἵτινες παραγενόμενοι
  choice: അവർ അവിടെ എത്തിയശേഷം
  rationale: സംബന്ധസർവനാമവും കാലസൂചക കൃതന്തവും ചേർന്ന തുടർച്ചയെ സ്വാഭാവിക മലയാള ആഖ്യാനമായി നൽകുന്നു.
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ സിനഗോഗ്
  rationale: ജനിറ്റീവ് ഘടന സുതാര്യമായി നിലനിർത്തുകയും അത് പ്രാദേശിക യെഹൂദസമൂഹത്തിന്റെ സിനഗോഗിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാവുന്നതാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπῄεσαν
  choice: പോയി
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ ആഖ്യാനപ്രയോഗം മലയാളത്തിലെ ലളിത ഭൂതകാലത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἀδελφοὶ എന്ന പദം സമ്മിശ്ര വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാമോ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു; വിശാലമായ വിശ്വാസിസമൂഹത്തെ ഉൾക്കൊള്ളാനുള്ള സാധ്യത അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
- issue: τῶν Ἰουδαίων എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: യെഹൂദന്മാരുടെ
  alternative: യെഹൂദ സിനഗോഗ്
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ഘടന മറച്ചുവയ്ക്കാതെ നൽകുന്നു. ഇത് ബെരോവയിലെ യെഹൂദസമൂഹവുമായി ബന്ധപ്പെട്ട സിനഗോഗിനെ തിരിച്ചറിയുന്നതാണ്; ദൈവശാസ്ത്രപരമായ കുറ്റവിധിയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ഗ്രീക്ക് വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ സംഭവക്രമവും പ്രധാന പദബന്ധങ്ങളും സംരക്ഷിച്ചിട്ടുണ്ട്. ഇംഗ്ലീഷ് consultation layer-ലെ b, c അടിക്കുറിപ്പുകൾ നൽകിയ സ്ഥാനങ്ങളുമായി പൊരുത്തപ്പെടുന്നില്ലെന്നും അവയുടെ ഉള്ളടക്കം ഇതിനകം പ്രധാനവാചകത്തിലുള്ള നേരിട്ടുള്ള അർഥവികല്പങ്ങളാണെന്നും കണ്ട് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
