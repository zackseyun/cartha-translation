  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: ml
  text: 'എന്നാൽ അവരെ കണ്ടെത്താനാകാതെ, അവർ യാസോനെയും ചില സഹോദരന്മാരെയും[a] നഗരാധികാരികളുടെ[b] മുമ്പിലേക്ക് വലിച്ചിഴച്ചു. അവർ ഉറക്കെ വിളിച്ചുപറഞ്ഞു: “ലോകത്തെ[c] ഇളക്കിമറിച്ച ഇവർ ഇവിടെയും എത്തിയിരിക്കുന്നു!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “സഹോദരന്മാർ” എന്നത് സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു; സന്ദർഭമനുസരിച്ച് ഈ പ്രയോഗത്തിൽ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “പൊളിറ്റാർക്കുകൾ” എന്നാണ്; മക്കെദോന്യയിൽ നഗരഭരണാധികാരികൾക്കുണ്ടായിരുന്ന പ്രാദേശിക പദവിപ്പേരാണിത്.
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “ജനവാസമുള്ള ലോകം”; അറിയപ്പെട്ടിരുന്ന സംസ്കൃതലോകത്തെയും പലപ്പോഴും റോമാ ലോകത്തെയും ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες
  choice: കണ്ടെത്താതിരുന്നതിനാൽ
  rationale: നിഷേധത്തോടുകൂടിയ ഏറിസ്റ്റ് കൃദന്തം മുഖ്യപ്രവൃത്തിക്കു മുമ്പുള്ള സാഹചര്യത്തെയും അതിന്റെ കാരണബന്ധത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔσυρον
  choice: വലിച്ചിഴച്ചു
  rationale: σύρω ബലമായി വലിച്ചുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; ശാരീരിക ബലപ്രയോഗത്തിന്റെ തീവ്രത ഈ പദം നിലനിർത്തുന്നു.
- source_word: τινας ἀδελφοὺς
  choice: ചില സഹോദരന്മാരെ
  rationale: ഇവിടെ ἀδελφοί ക്രിസ്തീയ സമൂഹത്തിലെ സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ പുല്ലിംഗരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തി, സമൂഹപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: നഗരാധികാരികളുടെ മുമ്പിലേക്ക്
  rationale: πολιτάρχης മക്കെദോന്യയിലെ പ്രത്യേക നഗരഭരണപദവിയാണ്. അപരിചിതമായ പദവി അതേപടി പകർത്താതെ അതിന്റെ പ്രവർത്തനപരമായ അർഥം വ്യക്തമാക്കുകയും ἐπί സൂചിപ്പിക്കുന്ന ഔദ്യോഗിക സന്നിധിയിലേക്കുള്ള നീക്കം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βοῶντες
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞു
  rationale: കൃത്യത്തോടൊപ്പം നടന്ന ശക്തമായ പൊതുനിലവിളിയാണ് ഈ കൃദന്തം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി സ്വതന്ത്ര ക്രിയാവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: ലോകത്തെ ഇളക്കിമറിച്ച ഇവർ
  rationale: ἀναστατόω വലിയ കലക്കമോ upheaval-ഓ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. “ഇളക്കിമറിച്ച” കുറ്റാരോപണത്തിന്റെ ശക്തിയും ദൃശ്യതയും നിലനിർത്തുന്നു; οἰκουμένηയുടെ കൂടുതൽ കൃത്യമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: ഇവർ ഇവിടെയും എത്തിയിരിക്കുന്നു
  rationale: πάρειμι സന്നിഹിതരായിരിക്കുക എന്നോ എത്തിച്ചേർന്നിരിക്കുക എന്നോ അർഥമാക്കാം. ഈ സാഹചര്യത്തിൽ എത്തിച്ചേർന്നതും ഇപ്പോൾ സന്നിഹിതരായിരിക്കുന്നതും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന രൂപമാണിത്; καί “-യും” എന്നതിലൂടെ നിലനിർത്തുന്നു.
