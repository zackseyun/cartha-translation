translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ജനക്കൂട്ടത്തിന്റെ ബലപ്രയോഗവും കുറ്റാരോപണത്തിന്റെ തീവ്രതയും വ്യക്തമായി നിലനിർത്തുന്നു. അപരിചിതമായ ഔദ്യോഗിക പദവിയും οἰκουμένηയുടെ വ്യാപ്തിയും മുഖ്യവാചകം ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചിരിക്കുന്നു.
