lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: അതുകൊണ്ട്, അജ്ഞതയുടെ കാലങ്ങളെ
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനാത്മകമായ മുന്നേറ്റം സൂചിപ്പിക്കുന്നു; μὲν പഴയ കാലവും ഇപ്പോഴത്തെ അവസ്ഥയും തമ്മിലുള്ള മൃദുവായ വ്യത്യാസത്തിന് പശ്ചാത്തലം ഒരുക്കുന്നു. ἄγνοιαയെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ ‘അജ്ഞത’ എന്നു നിലനിർത്തുന്നു.
- source_word: ὑπεριδὼν
  choice: കണ്ടില്ലെന്നുവെച്ചിട്ട്
  rationale: ὑπεροράω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം ദൈവം ആ കാലങ്ങളെ അംഗീകരിച്ചുവെന്നല്ല, ഉടൻ ന്യായവിധി നടപ്പാക്കാതെ കടന്നുപോയി/സഹിച്ചുവെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘കണ്ടില്ലെന്നുവെക്കുക’ ഈ രൂപകവും അർത്ഥസമ്മർദവും നിലനിർത്തുന്നു.
- source_word: τὰ νῦν παραγγέλλει
  choice: ഇപ്പോൾ ... കല്പിക്കുന്നു
  rationale: τὰ νῦν മുൻകാലത്തോടുള്ള ഇപ്പോഴത്തെ വ്യത്യാസം അടയാളപ്പെടുത്തുന്നു; παραγγέλλει അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കല്പിക്കുന്നു’ യോജിക്കുന്നു.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: എല്ലായിടത്തുമുള്ള സകല മനുഷ്യരോടും
  rationale: ἄνθρωποι ഇവിടെ ലിംഗപരമായി പരിമിതമല്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. πάντας, πανταχοῦ എന്നിവയുടെ സർവവ്യാപക ഊന്നൽ ‘സകല’, ‘എല്ലായിടത്തുമുള്ള’ എന്നീ പദങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: μετανοεῖν
  choice: മാനസാന്തരപ്പെടാൻ
  rationale: μετανοέω ചിന്തയിലെ മാറ്റം മാത്രമല്ല, ദൈവത്തിങ്കലേക്കുള്ള ധാർമിക തിരിവും ഉൾക്കൊള്ളുന്നു. ആ സമഗ്രമായ ബൈബിൾ ആശയം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ ‘മാനസാന്തരപ്പെടുക’ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അജ്ഞതയുടെ കാലങ്ങളോടുള്ള ദൈവത്തിന്റെ മുൻകാല നടപടി
  choice: ‘കണ്ടില്ലെന്നുവെച്ചിട്ട്’ എന്നത് ഉടൻ ന്യായവിധി നടത്താതെ സഹിച്ചതിനെ സൂചിപ്പിക്കുന്നു
  alternative: ദൈവം പാപത്തെ അവഗണിക്കുകയോ അജ്ഞതയെ പൂർണമായി കുറ്റവിമുക്തമാക്കുകയോ ചെയ്തു
  rationale: ὑπεριδών എന്ന പദവും തുടർന്നുള്ള മാനസാന്തര കല്പനയും ചേർന്ന് ദൈവത്തിന്റെ ദീർഘക്ഷമയെയും മനുഷ്യന്റെ ഉത്തരവാദിത്വത്തെയും ഒരുമിച്ച് നിലനിർത്തുന്നു; അംഗീകാരമോ നിസ്സംഗതയോ വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: മാനസാന്തരപ്പെടാനുള്ള കല്പനയുടെ വ്യാപ്തി
  choice: എല്ലായിടത്തുമുള്ള സകല മനുഷ്യരും
  alternative: പുരുഷന്മാർ മാത്രം, അല്ലെങ്കിൽ ജാതികൾ മാത്രം
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ സർവമനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന സമഗ്ര വ്യാപ്തിയാണ് നൽകുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാനസാന്തരപ്പെടുക’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ബൈബിൾപദമായതിനാൽ നിലനിർത്തി. പ്രധാനവാക്യത്തിലെ [a] അടിക്കുറിപ്പ് ὑπεριδών എന്ന പദത്തിന്റെ യഥാർഥ അർത്ഥപരിധിയും ദൈവിക അംഗീകാരം സൂചിപ്പിക്കാത്തതും വ്യക്തമാക്കുന്നു.
