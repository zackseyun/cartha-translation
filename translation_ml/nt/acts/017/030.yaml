  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, അജ്ഞതയുടെ കാലങ്ങളെ ദൈവം ഗണ്യമാക്കാതെ വിട്ടിരുന്നെങ്കിലും, ഇപ്പോൾ എല്ലായിടത്തുമുള്ള എല്ലാവരോടും മാനസാന്തരപ്പെടാൻ കല്പിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവഗണിച്ച്” അല്ലെങ്കിൽ “കടന്നുപോയി.” ദൈവം അജ്ഞതയുടെ ആ കാലങ്ങളെ അംഗീകരിച്ചു എന്നല്ല, അവയെ ഉടൻ ന്യായംവിധിക്കാതെ സഹിച്ചു എന്നതാണ് ആശയം.
