id: ACT.17.26
reference: Acts 17:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: ml
  text: ഒരുവനിൽനിന്ന് മനുഷ്യരുടെ എല്ലാ ജനതകളെയും അവൻ ഉളവാക്കി; അവർ ഭൂമുഖത്തെങ്ങും വസിക്കേണ്ടതിന് അവരുടെ നിശ്ചയിക്കപ്പെട്ട കാലങ്ങളും വാസസ്ഥലത്തിന്റെ അതിരുകളും അവൻ നിർണയിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ഒരുവനിൽനിന്ന്’ എന്നതിനുപകരം ‘ഒരേ രക്തത്തിൽനിന്ന്’ എന്നു വായിക്കുന്നു. മുഖ്യവാചകം SBLGNT-യിലെ ‘ഒന്നിൽനിന്ന്’ എന്ന വായനയെ പിന്തുടരുന്നു; വ്യക്തതയ്ക്കായി ‘ഒരുവൻ’ എന്നു ചേർത്തിരിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: ‘അവർക്കായി നിശ്ചയിച്ച കാലങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: ഉളവാക്കി
  rationale: ποιέω ഇവിടെ മനുഷ്യജനതകളുടെ പൊതുവായ ഉത്ഭവം ദൈവം വരുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; സൃഷ്ടിപ്പിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കാതെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐξ ἑνὸς
  choice: ഒരുവനിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ ‘ഒന്നിൽനിന്ന്/ഒരുവനിൽനിന്ന്’ എന്നത്രയേ ഉള്ളൂ. മനുഷ്യനെ സൂചിപ്പിക്കുന്ന സന്ദർഭം മലയാളത്തിലെ പുല്ലിംഗ ഏകവചനരൂപം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘രക്തം’ എന്ന പാഠഭേദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: മനുഷ്യരുടെ എല്ലാ ജനതകളെയും
  rationale: ἔθνος എന്നത് വ്യത്യസ്ത ജനതകളെ സൂചിപ്പിക്കുന്നു; ἀνθρώπων അവ മനുഷ്യരിൽപ്പെട്ട ജനതകളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: κατοικεῖν
  choice: വസിക്കേണ്ടതിന്
  rationale: ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യ/ഫലഭാവം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ വാസധ്വനി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: ഭൂമുഖത്തെങ്ങും
  rationale: ‘ഭൂമിയുടെ മുഴുവൻ മുഖത്തും’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁρίσας
  choice: നിർണയിച്ചു
  rationale: ദൈവം കാലങ്ങളും അതിരുകളും നിശ്ചയിച്ചതെന്ന പരിധിനിർണ്ണയത്തിന്റെ ആശയം നൽകുന്നു.
- source_word: προστεταγμένους καιρούς
  choice: അവരുടെ നിശ്ചയിക്കപ്പെട്ട കാലങ്ങൾ
  rationale: καιροί സാധാരണ നിമിഷങ്ങളല്ല, നിർദ്ദിഷ്ട കാലഘട്ടങ്ങളാണ്; προστεταγμένους അവ മുൻകൂട്ടി ക്രമീകരിക്കപ്പെട്ടവയെന്ന ആശയം നൽകുന്നു.
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: വാസസ്ഥലങ്ങളുടെ അതിരുകൾ
  rationale: ജനതകൾ വസിക്കുന്ന പ്രദേശങ്ങളുടെ ഭൂമിശാസ്ത്രപരമായ പരിധികളെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐξ ἑνὸς എന്നതിലെ സൂചിത പരാമർശം വ്യക്തമാക്കണമോ
  choice: ഒരുവനിൽനിന്ന്
  alternative: ഒന്നിൽനിന്ന് / ഒരു പൂർവികനിൽനിന്ന്
  rationale: മൂലപാഠത്തിൽ ‘രക്തം’ ഇല്ല. ‘ഒരുവൻ’ എന്ന മലയാളരൂപം മനുഷ്യപരാമർശം വ്യക്തമാക്കുമ്പോഴും ‘ആദാം’ എന്ന പേര് അല്ലെങ്കിൽ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ദൈവിക നിർണ്ണയത്തിന്റെ വ്യാപ്തി
  choice: കാലങ്ങളും വാസസ്ഥലങ്ങളുടെ അതിരുകളും അവൻ നിർണയിച്ചു
  alternative: അവർക്കായി കാലങ്ങളും അതിരുകളും അനുവദിച്ചു
  rationale: ὁρίσας, προστεταγμένους എന്നിവയിലെ സജീവമായ നിശ്ചയിക്കൽ നിലനിർത്തുന്നു; എന്നാൽ അതിന്റെ രീതി, ഉദ്ദേശ്യം, നിർണ്ണയവാദപരമായ വ്യാഖ്യാനം എന്നിവ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഭൂമുഖത്തെങ്ങും’ എന്നത് ബൈബിൾപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
