id: ACT.17.31
reference: Acts 17:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: ml
  text: കാരണം, താൻ നിയോഗിച്ച ഒരു മനുഷ്യനിലൂടെ നീതിയോടെ[a] ജനവാസമുള്ള ലോകത്തെ ന്യായംവിധിക്കാൻ പോകുന്ന ഒരു ദിവസം അവൻ നിശ്ചയിച്ചിരിക്കുന്നു. ആ മനുഷ്യനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിലൂടെ അവൻ എല്ലാവർക്കും തെളിവ്[b] നൽകിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായത്തോടെ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഉറപ്പ്’; കൂടുതൽ പദശഃ, ‘വിശ്വാസം’ (πίστιν παρασχὼν πᾶσιν). ഇവിടെ അർഥം എല്ലാവർക്കും നൽകിയ പൊതുവായ തെളിവോ ഉറപ്പോ ആണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മാനസാന്തരത്തിനുള്ള ആഹ്വാനത്തിന്റെ കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് സംയോജകത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔστησεν ἡμέραν
  choice: ഒരു ദിവസം നിശ്ചയിച്ചിരിക്കുന്നു
  rationale: ദൈവം ഒരു നിർദിഷ്ട ദിവസം ഉറപ്പായി നിശ്ചയിച്ചുവെന്ന അർഥം വ്യക്തവും ഗൗരവപൂർണവുമായി അറിയിക്കുന്നു.
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: ന്യായംവിധിക്കാൻ പോകുന്ന
  rationale: μέλλει സൂചിപ്പിക്കുന്ന ഉദ്ദേശിക്കപ്പെട്ട ഭാവിക്രിയയുടെ ഭാവം ലളിതമായ ഭാവികാലത്തിലേക്ക് ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν οἰκουμένην
  choice: നിവസിതലോകത്തെ
  rationale: οἰκουμένηയുടെ ‘മനുഷ്യർ വസിക്കുന്ന ലോകം’ എന്ന പ്രത്യേക അർഥവും ന്യായവിധിയുടെ സാർവത്രിക മാനുഷിക വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἐν δικαιοσύνῃ
  choice: നീതിയോടെ
  rationale: δικαιοσύνηയുടെ അടിസ്ഥാനാർഥമായ നീതി/നീതിനിഷ്ഠയും ന്യായവിധി പക്ഷപാതരഹിതവും ശരിയായതുമായിരിക്കുമെന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: താൻ നിയോഗിച്ച ഒരു മനുഷ്യനിലൂടെ
  rationale: ἀνήρ എന്ന ലിംഗനിർദിഷ്ട പദത്തെ ‘മനുഷ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും, അനിർദിഷ്ട രൂപം ‘ഒരു’ എന്നു നിലനിർത്തുകയും, ὥρισεν എന്നതിനെ നിയോഗിക്കൽ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: എല്ലാവർക്കും ഇതിന്റെ തെളിവ് നൽകിയിരിക്കുന്നു
  rationale: ഈ പ്രയോഗത്തിൽ πίστις വിശ്വാസം എന്നതിലുപരി പൊതുവായ ഉറപ്പോ തെളിവോ സൂചിപ്പിക്കുന്നതിനാൽ സന്ദർഭാർഥം നൽകുന്നു; പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: ആ മനുഷ്യനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിലൂടെ
  rationale: ഉയിർപ്പാണ് ദൈവം തെളിവ് നൽകിയ മാർഗം എന്ന കൃതന്തത്തിന്റെ ബന്ധം വ്യക്തമാക്കുന്നു; αὐτόν ആരെ സൂചിപ്പിക്കുന്നു എന്നതും മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: δικαιοσύνηയുടെ പരിഭാഷ
  choice: നീതിയോടെ
  alternative: ന്യായത്തോടെ
  rationale: ‘നീതി’ എന്നത് പദത്തിന്റെ വിശാലമായ ധാർമിക അർഥം നിലനിർത്തുന്നു; ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ‘ന്യായത്തോടെ’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πίστις എന്നതിന്റെ πίστιν παρασχὼν πᾶσιν എന്ന പ്രയോഗത്തിലെ അർഥം
  choice: തെളിവ്
  alternative: ഉറപ്പ്; പദശഃ ‘വിശ്വാസം’
  rationale: παρέχωയോടൊപ്പമുള്ള ഈ പ്രയോഗം ഇവിടെ ഉയിർപ്പിലൂടെ നൽകിയ പൊതുവായ ഉറപ്പോ തെളിവോ ആണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ πίστις എന്ന പദത്തിന്റെ കൂടുതൽ പദശഃ രൂപം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἀνδρί എന്നതിന്റെ ലിംഗവും നിർദിഷ്ടതയും
  choice: ഒരു മനുഷ്യൻ
  alternative: ആ മനുഷ്യൻ
  rationale: ഗ്രീക്ക് ἀνήρ പുരുഷനെ സൂചിപ്പിക്കുകയും ഇവിടെ നിർദിഷ്ട ഉപപദം ഇല്ലാതിരിക്കുകയും ചെയ്യുന്നതിനാൽ ‘ഒരു മനുഷ്യൻ’ എന്നു നൽകുന്നു; സന്ദർഭത്തിൽ പരാമർശം യേശുവിനാണെന്നത് പരിഭാഷയിൽ അധികമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘നിവസിതലോകം’ മൂലപദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു; ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി, ആശയബന്ധം ‘ഇതിന്റെ’ എന്ന പദത്തിലൂടെ സംരക്ഷിച്ചു.
