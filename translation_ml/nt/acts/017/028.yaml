- from: ‘അവനിലല്ലോ നാം ജീവിക്കുന്നതും ചലിക്കുന്നതും നിലനിൽക്കുന്നതും.’ നിങ്ങളുടെ സ്വന്തം കവികളിൽ ചിലരും പറഞ്ഞിട്ടുള്ളതുപോലെ, ‘നാമും അവന്റെ സന്തതിയല്ലോ.’
