id: ACT.17.28
reference: Acts 17:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: ml
  text: കാരണം, അവനിലാണല്ലോ നാം ജീവിക്കുകയും ചലിക്കുകയും നിലനിൽക്കുകയും ചെയ്യുന്നത്. നിങ്ങളുടെ സ്വന്തം കവികളിൽ ചിലർ പറഞ്ഞതുപോലെ, ‘കാരണം, നാമും അവന്റെ സന്തതിയാണ്.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ സർവനാമവും ‘ൽ’ എന്ന സ്ഥാനസൂചകപ്രത്യയവും ഉപയോഗിച്ച് ഗ്രീക്കിലെ ബന്ധപരവും ആശ്രയപരവുമായ പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ζῶμεν καὶ κινούμεθα καὶ ἐσμέν
  choice: നാം ജീവിക്കുന്നതും ചലിക്കുന്നതും നിലനിൽക്കുന്നതും
  rationale: മൂന്നു സമാന്തര ക്രിയകളുടെയും താളവും വ്യത്യാസവും സൂക്ഷിക്കുന്നു. ἐσμέν എന്നത് വെറും തിരിച്ചറിയൽസൂചകമായ ‘ആകുന്നു’ എന്നതിലുപരി ഇവിടെ അസ്തിത്വത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിലനിൽക്കുന്നു’ എന്ന് വിവർത്തനം ചെയ്തു.
- source_word: τινες τῶν καθ’ ὑμᾶς ποιητῶν
  choice: നിങ്ങളുടെ സ്വന്തം കവികളിൽ ചിലർ
  rationale: καθ’ ὑμᾶς എന്നതിലെ ശ്രോതാക്കളോടുള്ള സാംസ്കാരികബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘നിങ്ങളുടെ സ്വന്തം’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: γένος
  choice: സന്തതി
  rationale: വംശം, ജന്മബന്ധം, ഉത്ഭവം എന്നിവ ഉൾക്കൊള്ളുന്ന പദം; ഉദ്ധരണിയുടെ കാവ്യസ്വഭാവത്തിനും ദൈവത്തോടുള്ള സൃഷ്ടിജന്യബന്ധത്തിനും യോജിച്ച സാധാരണ മലയാളപദം.
theological_decisions:
- issue: ‘അവനിൽ’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: പ്രയോഗം വിശദീകരിക്കാതെ 그대로 നിലനിർത്തി
  alternative: ‘അവന്റെ ശക്തിയാൽ’ അല്ലെങ്കിൽ ‘അവനെ ആശ്രയിച്ച്’ എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക
  rationale: മൂലപാഠം ദൈവവും മനുഷ്യജീവിതവും തമ്മിലുള്ള ബന്ധം കൃത്യമായി നിർവചിക്കുന്നില്ല; അതിനാൽ അതിലെ യഥാർഥ ആശയസാന്ദ്രതയും തുറന്ന നിലയും സംരക്ഷിച്ചു.
- issue: ‘അവന്റെ സന്തതി’ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ പരിധി
  choice: കാവ്യോദ്ധരണി നേരിട്ട് വിവർത്തനം ചെയ്തു
  alternative: ‘അവന്റെ സൃഷ്ടികൾ’ എന്നു മാറ്റുക
  rationale: γένος എന്നത് ‘സൃഷ്ടികൾ’ എന്നതിനെക്കാൾ ശക്തമായ വംശോത്ഭവഭാഷയാണ്. ഇവിടെ ജൈവമോ രക്ഷാസംബന്ധമോ ആയ ദൈവപുത്രത്വം പ്രസ്താവിക്കുന്നതായി പാഠത്തിൽ ഇല്ലെങ്കിലും, ആ പദത്തിന്റെ ശക്തി മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ആദ്യവാക്യത്തിലെ മൂന്ന് ക്രിയകളുടെ സമാന്തരതയും ‘അല്ലോ’ മുഖേന γάρ നൽകുന്ന വിശദീകരണ/ഊന്നൽഭാവവും സൂക്ഷിച്ചു; കാവ്യോദ്ധരണികൾ ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ നൽകി.
