source:
  edition: SBLGNT
  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: ml
  text: പൗലോസിന്റെ പതിവനുസരിച്ച്[a] അദ്ദേഹം അവരുടെ ഇടയിൽ പ്രവേശിച്ചു; മൂന്നു ശബ്ബത്തുകളിൽ[b] തിരുവെഴുത്തുകളുടെ അടിസ്ഥാനത്തിൽ അവരുമായി യുക്തിപൂർവം സംവദിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പൗലോസിന് പതിവായിരുന്നതുപോലെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മൂന്നു ശബ്ബത്തുകളിലായി.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവരുമായി ചർച്ച ചെയ്തു’ അല്ലെങ്കിൽ ‘അവരുമായി സംവാദം നടത്തി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: പൗലോസിന്റെ പതിവനുസരിച്ച്
  rationale: κατά എന്ന പദവും εἴωθα എന്ന ക്രിയയുടെ കൃതന്തവും ചേർന്ന പ്രയോഗം സ്ഥിരമായ ശീലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും ആ അർഥം നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: അദ്ദേഹം അവരുടെ അടുക്കൽ ചെന്നു
  rationale: εἰσέρχομαι സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള ചലനവും πρὸς αὐτούς സൂചിപ്പിക്കുന്ന വ്യക്തികളിലേക്കുള്ള ദിശയും ഈ വിവർത്തനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽനിന്നുള്ള ‘സിനഗോഗ്’ എന്ന നാമം വാക്യത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐπὶ σάββατα τρία
  choice: മൂന്നു ശബ്ബത്തുകളിൽ
  rationale: ἐπί + accusative ഇവിടെ മൂന്നു ശബ്ബത്ത് അവസരങ്ങളിലായി നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പ്രധാന പാഠം ആവർത്തിത ദിവസങ്ങളെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കാലവ്യാപ്തി ഊന്നുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: διελέξατο
  choice: യുക്തിപൂർവം സംവദിച്ചു
  rationale: διαλέγομαι എന്ന പദത്തിൽ സംവാദത്തിന്റെയും യുക്തിനിർഭരമായ വിശദീകരണത്തിന്റെയും ഭാവങ്ങൾ ഉണ്ട്. ‘യുക്തിപൂർവം സംവദിച്ചു’ എന്നത് സംഭാഷണസ്വഭാവം നഷ്ടപ്പെടുത്താതെയും ശത്രുതാപരമായ തർക്കം സൂചിപ്പിക്കാതെയും ഇരുഭാവങ്ങളും കൈമാറുന്നു.
- source_word: ἀπὸ τῶν γραφῶν
  choice: തിരുവെഴുത്തുകളെ ആധാരമാക്കി
  rationale: ἀπό ഇവിടെ സംവാദത്തിന്റെ ഉറവിടമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; γραφαί യെഹൂദ-ക്രൈസ്തവ സന്ദർഭത്തിലെ വിശുദ്ധ ലിഖിതങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തിരുവെഴുത്തുകൾ’ മലയാളത്തിലെ വ്യക്തവും അംഗീകൃതവുമായ പദമാണ്.
theological_decisions:
- issue: സിനഗോഗിലെ പ്രവർത്തനത്തിൽ ‘അവർ’ എന്ന സർവനാമത്തിന്റെ സൂചിതർ
  choice: പ്രധാന പാഠത്തിൽ ‘അവർ’ എന്ന സർവനാമം നിലനിർത്തി.
  alternative: ‘അദ്ദേഹം സിനഗോഗിൽ ചെന്നു’ അല്ലെങ്കിൽ ‘അവിടെയുള്ള യെഹൂദരുടെ അടുക്കൽ ചെന്നു.’
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം സിനഗോഗിനെ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം വ്യക്തമായ നാമങ്ങൾക്കു പകരം സർവനാമങ്ങളാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മൂലപാഠത്തേക്കാൾ കൂടുതൽ പ്രത്യേകത ചേർക്കാതെ സർവനാമം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘യുക്തിപൂർവം സംവദിച്ചു’ എന്ന പ്രയോഗം ബൗദ്ധികമായ വിശദീകരണവും പരസ്പരസംവാദവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
