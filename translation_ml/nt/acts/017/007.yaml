  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: ml
  text: യാസോൻ അതിഥികളായി സ്വീകരിച്ചിരിക്കുന്ന[a] ഇവരെല്ലാവരും കൈസറുടെ ഉത്തരവുകൾക്ക്[b] വിരുദ്ധമായി പ്രവർത്തിക്കുന്നു; യേശു എന്ന മറ്റൊരു[c] രാജാവുണ്ടെന്ന് അവർ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വീകരിച്ച’ എന്നോ ‘താമസിപ്പിച്ച’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് അതിഥികളെ സ്വീകരിക്കുക, ആതിഥ്യം നൽകുക എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘ശാസനകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പദം ഔദ്യോഗിക വിധികളെയോ നിയമപരമായ നിർദേശങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘വ്യത്യസ്തനായ ഒരു രാജാവ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘മറ്റൊരു രാജാവ്’ എന്നാണ്; കൈസറിന്റെ ഭരണത്തിന് എതിരായ ഒരു മത്സരാവകാശവാദമായാണ് ആരോപണം അവതരിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: അതിഥികളായി സ്വീകരിച്ചിരിക്കുന്ന
  rationale: ഈ ക്രിയ അതിഥികളെ സ്വീകരിക്കുന്നതോ ആതിഥ്യം നൽകുന്നതോ സൂചിപ്പിക്കുന്നു. വർത്തമാനഫലമുള്ള പൂർണകാലരൂപത്തിന്റെ ഭാവം ‘സ്വീകരിച്ചിരിക്കുന്ന’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀπέναντι
  choice: വിരുദ്ധമായി
  rationale: ഷഷ്ഠീവിഭക്തിയോടുകൂടിയ ഈ പദം എതിർപ്പോ വിരോധമോ സൂചിപ്പിക്കുന്നു; നിയമപരമായ ആരോപണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘വിരുദ്ധമായി’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δογμάτων
  choice: ഉത്തരവുകൾ
  rationale: റോമൻ പൗരഭരണ പശ്ചാത്തലത്തിൽ ഔദ്യോഗിക വിധികളെയോ ശാസനകളെയോ സൂചിപ്പിക്കുന്നു. ‘ഉത്തരവുകൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: πράσσουσι
  choice: പ്രവർത്തിക്കുന്നു
  rationale: വർത്തമാനകാലം തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ അവതരിപ്പിക്കുന്നു. ‘പ്രവർത്തിക്കുന്നു’ ആരോപിക്കപ്പെടുന്ന പെരുമാറ്റത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: βασιλέα ἕτερον
  choice: മറ്റൊരു രാജാവ്
  rationale: βασιλεύς എന്നത് വ്യക്തമായി ‘രാജാവ്’ എന്നാണ്; ἕτερος മറ്റൊരു വ്യക്തിയെയോ വ്യത്യസ്ത അവകാശവാദിയെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ രാഷ്ട്രീയ ആരോപണത്തിന്റെ മൂർച്ച നിലനിൽക്കുന്നു.
- source_word: λέγοντες
  choice: പറയുന്നു
  rationale: ഈ പങ്കാളിക്രിയ അവരുടെ എതിർപ്രവർത്തനത്തിന്റെ രീതി അഥവാ ഉള്ളടക്കം വിശദീകരിക്കുന്നു. ‘പറയുന്നു’ എന്നത് സംശയഭാവം അധികമായി ചേർക്കാതെ മൂലത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു.
- source_word: εἶναι Ἰησοῦν
  choice: യേശു എന്ന ... രാജാവുണ്ടെന്ന്
  rationale: ഗ്രീക്കിലെ പരോക്ഷവാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ച്, രാജാവ് യേശുവാണെന്ന തിരിച്ചറിയൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὗτοι πάντες
  choice: ഇവരെല്ലാവരും
  rationale: ചൂണ്ടിക്കാണിക്കലും എല്ലാവരെയും ഉൾപ്പെടുത്തുന്ന ആരോപണവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ രാജാവായി പ്രഖ്യാപിക്കുന്നതിലെ രാഷ്ട്രീയ ആരോപണം
  choice: കൈസറിനോടുള്ള മത്സരാവകാശവാദമായി കേൾക്കുന്ന വിധത്തിൽ ‘മറ്റൊരു രാജാവ്’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: രാഷ്ട്രീയ ധ്വനി കുറയ്ക്കാൻ ‘മറ്റൊരു ഭരണാധികാരി’ എന്നോ ആത്മീയ അർഥത്തിലേക്ക് ചുരുക്കിയോ പരിഭാഷപ്പെടുത്തുക.
  rationale: കൈസറുടെ ഉത്തരവുകളുമായി ബന്ധപ്പെടുത്തി എതിരാളികൾ ഉന്നയിക്കുന്ന ആരോപണം വ്യക്തമായി രാഷ്ട്രീയ സ്വഭാവമുള്ളതാണ്. ‘രാജാവ്’ എന്ന പരിഭാഷ ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള നിയമ-രാഷ്ട്രീയ ആരോപണത്തിന്റെ ഭാവം നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധം അർദ്ധവിരാമത്തിലൂടെ സ്വാഭാവികമാക്കി; രാഷ്ട്രീയവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മൃദൂകരിച്ചിട്ടില്ല.
