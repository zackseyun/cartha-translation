translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘അഥേന’, ‘ശീലാസ്’, ‘തിമൊഥെയൊസ്’ എന്നീ രൂപങ്ങൾ മൂലഭാഷയോട് അടുത്തുനിൽക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
