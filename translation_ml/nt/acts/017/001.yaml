  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διοδεύσαντες δὲ τὴν Ἀμφίπολιν καὶ ⸀τὴν Ἀπολλωνίαν ἦλθον εἰς Θεσσαλονίκην, ὅπου ⸀ἦν συναγωγὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/001.yaml
  text: After passing through Amphipolis and Apollonia[a], they came to Thessalonica[b], where there was a synagogue of the Jews.
translation:
  language: ml
  text: അംഫിപൊലിസിലൂടെയും അപൊല്ലോനിയയിലൂടെയും കടന്നുപോയശേഷം[a] അവർ തെസ്സലോനിക്കയിൽ എത്തി. അവിടെ യെഹൂദരുടെ ഒരു സിനഗോഗ്[b] ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അംഫിപൊലിസിലൂടെയും അപൊല്ലോനിയയിലൂടെയും സഞ്ചരിച്ചശേഷം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘യെഹൂദരുടെ സിനഗോഗ്’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഗ്രീക്കിൽ ‘സിനഗോഗ്’ എന്ന പദത്തിനു മുമ്പിൽ നിർദിഷ്ട ഉപപദമില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διοδεύσαντες
  choice: കടന്നുപോയശേഷം
  rationale: പ്രധാന ക്രിയയായ ἦλθον-നു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപമാണിത്. നഗരങ്ങളിലൂടെ സഞ്ചരിച്ചശേഷം അടുത്ത ലക്ഷ്യസ്ഥാനത്ത് എത്തിയെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധം മാത്രമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യക്രമം തന്നെ ആ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നോ ‘ഇപ്പോൾ’ എന്നോ ചേർക്കുന്നത് അനാവശ്യമായ അർഥഭാരം സൃഷ്ടിക്കും.
- source_word: Ἀμφίπολιν
  choice: അംഫിപൊലിസ്
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: Ἀπολλωνίαν
  choice: അപ്പൊല്ലോനിയ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἦλθον
  choice: അവർ എത്തി
  rationale: ἔρχομαι എന്ന ലളിതമായ ഗതിക്രിയയുടെ ഇവിടെ ഉദ്ദേശിക്കുന്ന ലക്ഷ്യസ്ഥാനപ്രാപ്തി സ്വാഭാവിക മലയാളത്തിൽ ‘എത്തി’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: εἰς Θεσσαλονίκην
  choice: തെസ്സലോനിക്കയിൽ
  rationale: εἰς ഒരു നഗരത്തിലേക്കുള്ള ഗതിയും ലക്ഷ്യസ്ഥാനവും സൂചിപ്പിക്കുന്നു. ‘എത്തി’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ അധികാരണമുള്ള ‘തെസ്സലോനിക്കയിൽ’ സ്വാഭാവികമാണ്.
- source_word: ὅπου
  choice: അവിടെ
  rationale: സ്ഥലസൂചകമായ ആപേക്ഷിക ക്രിയാവിശേഷണത്തെ മുൻപറഞ്ഞ നഗരവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: συναγωγὴ
  choice: ഒരു സിനഗോഗ്
  rationale: ഗ്രീക്കിൽ നാമത്തിന് നിർദിഷ്ട ഉപപദമില്ല. അതിനാൽ അനിശ്ചിതത്വം നിലനിർത്താൻ ‘ഒരു’ ചേർത്തു; യെഹൂദരുടെ ആരാധനാസമ്മേളനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യേക പദമായി ‘സിനഗോഗ്’ നിലനിർത്തി.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദരുടെ
  rationale: സിനഗോഗുമായുള്ള ബന്ധമോ ഉടമസ്ഥതയോ സൂചിപ്പിക്കുന്ന ബഹുവചന ഷഷ്ഠീരൂപം നേരിട്ട്, സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ആഖ്യാനസന്ദർഭത്തിലെ Ἰουδαίων എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: യെഹൂദരുടെ
  alternative: യൂദയായിലുള്ളവരുടെ / യെഹൂദജനത്തിന്റെ
  rationale: ഇവിടെ പദം തെസ്സലോനിക്കയിലെ സിനഗോഗുമായി ബന്ധപ്പെട്ട യെഹൂദസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഭൂമിശാസ്ത്രപരമായി യൂദയാ നിവാസികളെ മാത്രമല്ല. ‘യെഹൂദജനത്തിന്റെ’ എന്നത് പ്രാദേശിക സന്ദർഭത്തേക്കാൾ വിപുലമായ അർഥം നൽകാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. സ്ഥലനാമങ്ങൾ ശബ്ദാനുസൃതമായി ലിപ്യന്തരണം ചെയ്തു. ‘സിനഗോഗ്’ എന്നത് മതപരവും ചരിത്രപരവുമായ പ്രത്യേകത നഷ്ടപ്പെടാതിരിക്കാൻ നിലനിർത്തി; നിർദിഷ്ടതയെക്കുറിച്ചുള്ള ഗ്രീക്ക് വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
