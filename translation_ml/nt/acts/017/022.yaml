source:
  edition: SBLGNT
  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: ml
  text: 'അപ്പോൾ പൗലോസ് അരയോപഗസിന്റെ നടുവിൽ നിന്നുകൊണ്ട് പറഞ്ഞു: “അഥേനക്കാരായ പുരുഷന്മാരേ, നിങ്ങൾ എല്ലാ വിധത്തിലും വളരെ മതനിഷ്ഠയുള്ളവരാണെന്ന്[a] ഞാൻ കാണുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കൂടുതൽ അന്ധവിശ്വാസമുള്ളവർ” അഥവാ “കൂടുതൽ മതനിഷ്ഠയുള്ളവർ.” ഗ്രീക്ക് പദം അനുകൂലമായോ പ്രതികൂലമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: നിന്നുകൊണ്ട്
  rationale: വേദിയുടെ പശ്ചാത്തലവും പൗലോസിന്റെ നില്പും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് എയോറിസ്റ്റ് കൃദന്തരൂപത്തെ അനാവശ്യമായി ദീർഘിപ്പിക്കുന്നില്ല.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആഖ്യാനമാറ്റം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: അരയോപഗസിന്റെ നടുവിൽ
  rationale: സ്ഥലസൂചനയായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു; ‘അരയോപഗസിന്റെ മുമ്പാകെ’ എന്ന സഭാസംബന്ധിയായ വ്യാഖ്യാനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: Ἀρείου Πάγου
  choice: അരയോപഗസ്
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ നേരിട്ടുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; ‘മാർസ് കുന്ന്’ എന്ന ലത്തീൻ പാരമ്പര്യരൂപം ഒഴിവാക്കുന്നു.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: പ്രസംഗം ആരംഭിക്കുന്ന സാധാരണ ആഖ്യാനക്രിയയായി സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: അഥേനയിലെ പുരുഷന്മാരേ
  rationale: സംബോധനഭാവവും ἄνδρες എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: κατὰ πάντα
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: പൗലോസിന്റെ നിരീക്ഷണത്തിന്റെ വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὡς
  choice: എന്ന്
  rationale: θεωρῶ എന്ന ഗ്രഹണക്രിയയുടെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളഘടന നൽകുന്നു.
- source_word: δεισιδαιμονεστέρους
  choice: വളരെ മതനിഷ്ഠയുള്ളവർ
  rationale: പദത്തിന്റെ അനുകൂലമോ പ്രതികൂലമോ ആകാവുന്ന അർഥപരിധി മുഖ്യപാഠത്തിൽ അതിരുകടന്ന് പ്രതികൂലമാക്കാതെ, താരതമ്യരൂപത്തിന്റെ തീവ്രത സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: θεωρῶ
  choice: ഞാൻ കാണുന്നു
  rationale: നിരീക്ഷണവും അതിൽനിന്നുള്ള ഗ്രഹണവും ലളിതവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: അഥേനക്കാരുടെ മതഭാവത്തെ δεισιδαιμονεστέρους എന്നു വിശേഷിപ്പിക്കുന്നതിലെ സ്വരം
  choice: മുഖ്യപാഠത്തിൽ താരതമ്യേന നിഷ്പക്ഷവും അനുകൂലവുമായ ‘വളരെ മതനിഷ്ഠയുള്ളവർ’
  alternative: ‘അന്ധവിശ്വാസികൾ’ അല്ലെങ്കിൽ ‘കൂടുതൽ മതനിഷ്ഠയുള്ളവർ’
  rationale: ഗ്രീക്ക് പദം പ്രശംസാപരമായോ വിമർശനപരമായോ ഗ്രഹിക്കാം; പ്രസംഗത്തിന്റെ തുടക്കത്തിൽ പൗലോസിന്റെ വാക്കുകളിലുള്ള പ്രസംഗതന്ത്രപരമായ ഇരട്ടസാധ്യതയെ ഒരേയൊരു ദിശയിൽ തീർപ്പാക്കാതിരിക്കാൻ നിഷ്പക്ഷമായ രൂപം മുഖ്യപാഠത്തിലും മറ്റു വായനകൾ അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രസംഗശൈലി. ഔപചാരിക സംബോധന നിലനിർത്തിയിരിക്കുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
