id: ACT.17.24
reference: Acts 17:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: ml
  text: ലോകത്തെയും അതിലുള്ള സകലത്തെയും സൃഷ്ടിച്ച ദൈവം, ആകാശത്തിന്റെയും ഭൂമിയുടെയും കർത്താവായിരിക്കെ, മനുഷ്യകൈകളാൽ നിർമിച്ച ക്ഷേത്രങ്ങളിൽ വസിക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας
  choice: സൃഷ്ടിച്ച
  rationale: ദൈവം ലോകത്തെ ഉണ്ടാക്കിയതിനെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. മലയാളത്തിൽ ‘സൃഷ്ടിച്ച’ എന്നത് സ്വാഭാവികവും സന്ദർഭത്തിലെ സൃഷ്ടികർമ്മം വ്യക്തമായി അറിയിക്കുന്നതുമാണ്.
- source_word: κόσμον
  choice: ലോകത്തെ
  rationale: ഇവിടെ സൃഷ്ടിക്കപ്പെട്ട ലോകക്രമത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു; ‘ലോകം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വിശാലവുമായ പദമാണ്.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: അതിലുള്ള സകലത്തെയും
  rationale: ലോകത്തിനുള്ളിലുള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന πάντα എന്ന പദത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: ὑπάρχων κύριος
  choice: കർത്താവായിരിക്കെ
  rationale: ὑπάρχων സൂചിപ്പിക്കുന്ന നിലവിലുള്ള അവസ്ഥയെ നിലനിർത്തുന്നു; അതിനെ കാരണാർഥമായി മാത്രം വ്യാഖ്യാനിക്കാതെ participial ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ആകാശത്തിന്റെയും ഭൂമിയുടെയും മേലുള്ള ദൈവത്തിന്റെ പരമാധികാരം വ്യക്തമാക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സുപരിചിതമായ പദമാണ്.
- source_word: οὐρανοῦ καὶ γῆς
  choice: ആകാശത്തിന്റെയും ഭൂമിയുടെയും
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ οὐρανοῦയും പരമ്പരാഗതമായ ആകാശം-ഭൂമി ജോടിയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: χειροποιήτοις
  choice: മനുഷ്യകൈകളാൽ നിർമിച്ച
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘കൈകളാൽ ഉണ്ടാക്കിയ’ എന്നാണ്; ‘മനുഷ്യ’ എന്ന് വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ ഉദ്ദേശ്യം സ്വാഭാവികമായി അറിയിക്കുകയും ദൈവസൃഷ്ടിയുമായുള്ള വ്യത്യാസം തെളിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ναοῖς
  choice: ക്ഷേത്രങ്ങളിൽ
  rationale: ദൈവവാസസ്ഥാനമായി കരുതപ്പെടുന്ന ആരാധനാലയങ്ങളെ സൂചിപ്പിക്കുന്ന ναός എന്ന പദത്തിന് ഈ ബഹുദൈവാരാധനാ സന്ദർഭത്തിൽ ‘ക്ഷേത്രം’ വ്യക്തമായ പൊതുപദമാണ്.
- source_word: κατοικεῖ
  choice: വസിക്കുന്നില്ല
  rationale: സ്ഥിരമായി പാർക്കുക/വസിക്കുക എന്ന അർഥം നൽകുന്നു; ക്ഷേത്രത്തിൽ ദൈവം വസിക്കുന്നു എന്ന ആശയത്തോടുള്ള വാക്യത്തിന്റെ നേരിട്ടുള്ള നിഷേധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ അതീതതയും ക്ഷേത്രങ്ങളിലെ പ്രാദേശികവൽക്കരണവും
  choice: സ്രഷ്ടാവും ആകാശഭൂമികളുടെ കർത്താവുമായ ദൈവം മനുഷ്യർ നിർമിച്ച ക്ഷേത്രങ്ങളിൽ വസിക്കുന്നില്ല എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
  alternative: ദൈവത്തെ ക്ഷേത്രങ്ങൾക്കുള്ളിൽ ഒതുക്കാനാവില്ല എന്നു കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്താം.
  rationale: മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള അവകാശവാദം വിപുലീകരിക്കാതെയും ഏതെങ്കിലും സമ്പ്രദായപരമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കർത്താവ്’, ‘വസിക്കുന്നു’ എന്നിവ ബൈബിൾ രജിസ്റ്റർ നിലനിർത്തുന്നു; വാക്യഘടന ഗ്രീക്കിലെ participial ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
