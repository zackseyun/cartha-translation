  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: ml
  text: അവർ ദൈവത്തെ അന്വേഷിക്കേണ്ടതിന്, ഒരുപക്ഷേ അവനെ തപ്പിത്തിരഞ്ഞ്[a] കണ്ടെത്തിയേക്കാം; എങ്കിലും അവൻ നമ്മിൽ ഓരോരുത്തരിൽനിന്നും അകലെയല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തപ്പിത്തിരഞ്ഞ്’ എന്നതിന് ‘കൈകൊണ്ട് തപ്പി അന്വേഷിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ പരിമിതമായ കാഴ്ചയിലോ ഇരുട്ടിലോ കൈകൊണ്ട് തപ്പി അന്വേഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: അന്വേഷിക്കേണ്ടതിന്
  rationale: മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന infinitive ദൈവിക ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: ഇവിടെ άρθρο പ്രത്യേകമായ വേറൊരു അർഥം നിർബന്ധിക്കുന്നില്ല; സാധാരണ മലയാള ദൈവസംബോധനയാണ് യോജിച്ചത്.
- source_word: εἰ ἄρα γε
  choice: ഒരുപക്ഷേ ... കണ്ടെത്തിയേക്കാം
  rationale: മനുഷ്യാന്വേഷണത്തിന്റെ അനിശ്ചിതവും സാദ്ധ്യതാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ψηλαφήσειαν
  choice: തപ്പിത്തിരഞ്ഞ്
  rationale: പരിമിതമായ കാഴ്ചയിലോ ഇരുട്ടിലോ സ്പർശിച്ചറിഞ്ഞ് അന്വേഷിക്കുന്നതുപോലുള്ള മൂലക്രിയയുടെ ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: καὶ εὕροιεν
  choice: കണ്ടെത്തിയേക്കാം
  rationale: ψηλαφήσειαν-നോട് ചേർന്ന optative സാദ്ധ്യത മലയാളത്തിലെ ‘-യേക്കാം’ രൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καί γε
  choice: എങ്കിലും
  rationale: മനുഷ്യാന്വേഷണത്തിന്റെ അനിശ്ചിതത്വത്തിനു വിരുദ്ധമായി ദൈവത്തിന്റെ യഥാർഥ സാമീപ്യം ഉറപ്പിക്കുന്ന concessive ബന്ധം നൽകുന്നു.
- source_word: οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: നമ്മിൽ ഓരോരുത്തരിൽനിന്നും അകലെയല്ല
  rationale: ἑνὸς ἑκάστου എന്ന വിതരണാത്മക ഊന്നൽ സംരക്ഷിച്ചുകൊണ്ട് സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: ὑπάρχοντα
  choice: അവൻ ... അകലെയല്ല
  rationale: ദൈവത്തിന്റെ യഥാർഥ സാമീപ്യം സൂചിപ്പിക്കുന്ന participle മലയാളത്തിൽ finite predication ആയി പകരുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ സമീപ്യതയും മനുഷ്യന്റെ അന്വേഷണവും
  choice: ‘ഒരുപക്ഷേ ... തപ്പിത്തിരഞ്ഞ് കണ്ടെത്തിയേക്കാം’ എന്ന അനിശ്ചിതത്വവും ‘എങ്കിലും അവൻ ... അകലെയല്ല’ എന്ന ഉറപ്പും ഒരുമിച്ച് നിലനിർത്തി.
  alternative: സ്പർശരൂപകം മൃദുവാക്കി ‘അന്വേഷിച്ചു കണ്ടെത്തുക’ എന്നു മാത്രം പറയുക.
  rationale: ഗ്രീക്ക് പാഠം മനുഷ്യന്റെ പരിമിതമായ ഗ്രഹണവും ദൈവത്തിന്റെ യഥാർഥ സാമീപ്യവും തമ്മിലുള്ള പിരിമുറുക്കം പരിഹരിക്കാതെ ചേർത്തുനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘തപ്പിത്തിരഞ്ഞ്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ സ്പർശരൂപകം നിലനിർത്തുന്നതുമാണ്; വിശദീകരണ അടിക്കുറിപ്പ് [a] വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
