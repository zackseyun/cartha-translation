id: ACT.17.13
reference: Acts 17:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: ml
  text: എന്നാൽ, പൗലോസ് ബെരോവയിലും ദൈവവചനം പ്രഖ്യാപിച്ചുവെന്ന് തെസ്സലോനിക്കയിൽനിന്നുള്ള യെഹൂദന്മാർ അറിഞ്ഞപ്പോൾ, അവർ അവിടെയും വന്ന് ജനക്കൂട്ടങ്ങളെ ഇളക്കിവിടുകയും അസ്വസ്ഥരാക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: എന്നാൽ ...പ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യവും ὡς സൂചിപ്പിക്കുന്ന കാലബന്ധവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἔγνωσαν
  choice: അറിഞ്ഞു
  rationale: വിവരം ലഭിച്ച് മനസ്സിലാക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: തെസ്സലോനിക്കയിൽനിന്നുള്ള യെഹൂദന്മാർ
  rationale: എല്ലാ യെഹൂദന്മാരെയും പൊതുവായി സൂചിപ്പിക്കാതെ, തെസ്സലോനിക്കയിൽനിന്നുള്ള പ്രത്യേക സംഘത്തെ തിരിച്ചറിയിക്കുന്നു.
- source_word: ὅτι καὶ ἐν τῇ Βεροίᾳ
  choice: ബെരോവയിലും ... എന്ന്
  rationale: καί ഇവിടെ മറ്റൊരു സ്ഥലമായ ബെരോവയെയും ഉൾപ്പെടുത്തുന്നു; മലയാളത്തിലെ ‘-യും’ ആ അധികസ്ഥലബോധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατηγγέλη
  choice: പ്രസംഗിച്ചു
  rationale: καταγγέλλωയുടെ പരസ്യമായി അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന അർഥം ഈ അപ്പൊസ്തലപ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മലയാളത്തിലെ ക്രമവാക്യം മുൻപ് നടന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക പൂർവപൂർണകാല രൂപം ആവശ്യമില്ല.
- source_word: ὑπὸ τοῦ Παύλου
  choice: പൗലോസ്
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിലെ വ്യക്തികർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തരിപ്രയോഗമായി മാറ്റുന്നു; പ്രവർത്തകൻ പൗലോസാണെന്ന അർഥം മാറ്റമില്ലാതെ നിലനിൽക്കുന്നു.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിൽനിന്നുള്ളതായി പ്രസംഗിക്കപ്പെട്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും ഗൗരവമുള്ളതുമായ മലയാള ബൈബിൾപ്രയോഗം.
- source_word: ἦλθον κἀκεῖ
  choice: അവർ അവിടെയും വന്നു
  rationale: κἀκεῖയിലെ ‘അവിടെയും’ എന്ന അധികസ്ഥലബോധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: σαλεύοντες
  choice: ഇളക്കിവിടുകയും
  rationale: ജനക്കൂട്ടത്തെ അശാന്തിയിലേക്കോ പ്രക്ഷോഭത്തിലേക്കോ നയിക്കുന്ന പ്രവർത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ ταράσσοντες
  choice: കലക്കമുണ്ടാക്കുകയും
  rationale: ταράσσωയിലെ അസ്വസ്ഥത, കുഴപ്പം, പൊതു കലക്കം എന്നീ ആശയങ്ങൾ നൽകുകയും ആദ്യ കൃതന്തത്തോടുള്ള തീവ്രതാസംബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ὄχλοι എന്ന ബഹുവചനത്തിന്റെ നിഷ്പക്ഷമായ അർഥം നിലനിർത്തുന്നു; ‘കലാപക്കൂട്ടം’ പോലുള്ള അതിശക്തമായ അർഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦ എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവവചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട ദൈവിക സന്ദേശം എന്ന സന്ദർഭാർഥവും പ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനവും നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സാങ്കേതിക അർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: κατηγγέλη എന്ന കർമണിരൂപം
  choice: പൗലോസ് ... പ്രസംഗിച്ചു എന്ന സ്വാഭാവിക മലയാള കർത്തരിപ്രയോഗം
  alternative: പൗലോസിനാൽ ... പ്രസംഗിക്കപ്പെട്ടു
  rationale: പ്രവർത്തകനെയും പ്രവൃത്തിയെയും മാറ്റാതെ സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു; ഗ്രീക്ക് കർമണിരൂപത്തിന് സ്വതന്ത്രമായ ദൈവശാസ്ത്രപരമായ ഊന്നൽ ഇവിടെ നിർബന്ധമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പേരുകൾ ‘തെസ്സലോനിക്ക’, ‘ബെരോവ’, ‘പൗലോസ്’ എന്ന വ്യാപകമായ മലയാള ബൈബിൾരൂപങ്ങളിൽ നൽകി. മൂലവാക്യത്തിലെ രണ്ട് സമാന്തര കൃതന്തങ്ങളെയും വേർതിരിച്ച് നിലനിർത്തി.
