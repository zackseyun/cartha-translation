id: ACT.17.19
reference: Acts 17:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ അവനെ പിടിച്ച് അരയോപഗോസിലേക്കു[b] കൊണ്ടുപോയി ഇങ്ങനെ ചോദിച്ചു: “നീ സംസാരിക്കുന്ന ഈ പുതിയ ഉപദേശം എന്താണെന്ന് ഞങ്ങൾക്കു അറിയാനാകുമോ?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്കു അറിയാമോ?” ഗ്രീക്കിലെ പ്രയോഗം വിനയമുള്ള അഭ്യർഥനയായും കഴിവിനെക്കുറിച്ചുള്ള ചോദ്യമായും വായിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അരയോപഗോസ്’ എന്നത് കുന്നിനെയോ അതുമായി ബന്ധപ്പെട്ട സമിതിയെയോ സൂചിപ്പിക്കാം; പരമ്പരാഗതമായി ‘മാർസ് കുന്ന്’ എന്നും പറയാറുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: പിടിച്ചു
  rationale: ശാരീരികമായി കൈവെച്ച് കൂട്ടിക്കൊണ്ടുപോയെന്ന ആശയം നിലനിർത്തുന്നു; ‘പിടികൂടി’ എന്നതുപോലെ അറസ്റ്റ് അല്ലെങ്കിൽ കടുത്ത ബലപ്രയോഗം അനിവാര്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: τε
  choice: അതിനാൽ
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ലഘുവായ ആഖ്യാനബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: അരയോപഗോസിലേക്കു
  rationale: സ്ഥലത്തെയോ അതുമായി ബന്ധപ്പെട്ട സമിതിയെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പേരിനെ ലിപ്യന്തരണം ചെയ്ത് അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: ἤγαγον
  choice: കൊണ്ടുപോയി
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കു നയിച്ചുകൊണ്ടുപോയ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λέγοντες
  choice: ചോദിച്ചു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകൾ ചോദ്യമായതിനാൽ, സമകാലികമായ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Δυνάμεθα γνῶναι
  choice: ഞങ്ങൾക്കു അറിയാമോ?
  rationale: കഴിവിനെക്കുറിച്ചുള്ള കർശനചോദ്യമെന്നതിലുപരി വിനയമുള്ള അഭ്യർഥനയുടെ ഭാവം നൽകുന്നു; ‘ഞങ്ങൾക്ക് അറിയാൻ കഴിയുമോ?’ എന്ന കൂടുതൽ പദാനുപദ രൂപവും സാധ്യമാണ്.
- source_word: καινὴ
  choice: പുതിയ
  rationale: ശ്രോതാക്കൾക്കു പുതുമയുള്ളതോ പുതിയ തരത്തിലുള്ളതോ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: നീ സംസാരിക്കുന്ന
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ അതേപടി നൽകിയാൽ കൃത്രിമമാകുന്നതിനാൽ, അർഥം കൃത്യമായി നിലനിർത്തുന്ന സ്വാഭാവിക കർത്തരിപ്രയോഗം സ്വീകരിച്ചു.
- source_word: διδαχή
  choice: ഉപദേശം
  rationale: ‘സിദ്ധാന്തം’ എന്ന സാങ്കേതിക സഭാപദത്തിന്റെ അധികഭാരം ഒഴിവാക്കി, ഇവിടെ പറയുന്ന പഠിപ്പിക്കലിനെ സാധാരണവും മാന്യവുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിനെ അരയോപഗോസിലേക്കു കൊണ്ടുപോയതിന്റെ സ്വഭാവം
  choice: ഉറച്ച ശാരീരിക മുൻകൈ ഉൾപ്പെട്ടെങ്കിലും നിർബന്ധമായും ശത്രുതാപരമല്ലാത്ത കൂട്ടിക്കൊണ്ടുപോകൽ
  alternative: ഔപചാരിക അറസ്റ്റ്; അല്ലെങ്കിൽ വെറും ആദരപൂർവമായ ക്ഷണം
  rationale: ἐπιλαμβάνομαι എന്ന ക്രിയയ്ക്ക് പിടിക്കുക എന്ന ശക്തി ഉണ്ടെങ്കിലും സന്ദർഭം തുറന്ന ശത്രുതയേക്കാൾ അന്വേഷണാത്മക കൗതുകമാണ് കാണിക്കുന്നത്. അതിനാൽ ‘പിടിച്ചു’ എന്നു നൽകി, അറസ്റ്റ് എന്ന നിഗമനം ചേർത്തിട്ടില്ല.
- issue: Ἄρειος Πάγος എന്നതിന്റെ സൂചന
  choice: ‘അരയോപഗോസ്’ എന്ന proper name ഉപയോഗിച്ച് സ്ഥലം/സമിതി എന്ന അവ്യക്തത നിലനിർത്തുന്നു
  alternative: ‘മാർസ് കുന്ന്’ എന്ന സ്ഥലപ്പേര്; അല്ലെങ്കിൽ ‘അരയോപഗോസ് സമിതിയുടെ മുമ്പിൽ’
  rationale: ഗ്രീക്ക് പദം കുന്നിനെയും അതുമായി ബന്ധപ്പെട്ട ഭരണസമിതിയെയും സൂചിപ്പിക്കാം. വാക്യം തീർച്ചപ്പെടുത്താത്ത ചരിത്രവിശദാംശം പരിഭാഷ തീർച്ചപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിന്റെ അസ്വാഭാവിക കർമണിഘടന മലയാളത്തിലേക്ക് പദാനുപദമായി മാറ്റാതെ അർഥം സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
