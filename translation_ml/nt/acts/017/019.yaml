revisions:
- from: 'അതിനാൽ അവർ അവനെ പിടിച്ചു അരയോപഗോസിലേക്കു[b] കൊണ്ടുപോയി ചോദിച്ചു: “നീ സംസാരിക്കുന്ന ഈ പുതിയ ഉപദേശം എന്താണെന്നു ഞങ്ങൾക്കു അറിയാമോ?[a]”'
  to: 'അപ്പോൾ അവർ അവനെ പിടിച്ച് അരയോപഗോസിലേക്കു[b] കൊണ്ടുപോയി ഇങ്ങനെ ചോദിച്ചു: “നീ സംസാരിക്കുന്ന ഈ പുതിയ ഉപദേശം എന്താണെന്ന് ഞങ്ങൾക്കു അറിയാനാകുമോ?[a]”'
  rationale: മൃദുവായ τέ-യെ കാരണസൂചകമായ «അതിനാൽ» എന്നു വ്യാഖ്യാനിക്കാതെ «അപ്പോൾ» എന്നു മാറ്റി. Δυνάμεθα γνῶναι-യുടെ അർഥവും ചോദ്യത്തിന്റെ മര്യാദയുള്ള സ്വരവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ «ഞങ്ങൾക്കു അറിയാനാകുമോ?» എന്നു തിരുത്തി. മറ്റെല്ലാ തിരഞ്ഞെടുപ്പുകളും ഉറവിടത്തോടും ഇംഗ്ലീഷ് audit trail-ലുള്ള അർഥനിർണയങ്ങളോടും യോജിക്കുന്നതിനാൽ നിലനിർത്തി.
