id: ACT.21.26
reference: Acts 21:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: ml
  text: അപ്പോൾ പൗലോസ് ആ പുരുഷന്മാരെ കൂട്ടിക്കൊണ്ടുപോയി; പിറ്റേന്ന് അവരോടൊപ്പം ശുദ്ധീകരണം അനുഷ്ഠിച്ചശേഷം, ശുദ്ധീകരണദിവസങ്ങൾ പൂർത്തിയാകുന്നതിനെക്കുറിച്ച് അറിയിച്ചുകൊണ്ട്, അവരിൽ ഓരോരുത്തർക്കുവേണ്ടിയുള്ള വഴിപാട് അർപ്പിക്കപ്പെടുന്നതുവരെ അദ്ദേഹം ദേവാലയാങ്കണത്തിൽ[a] പ്രവേശിച്ചുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ ἱερόν എന്ന പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയാകെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_clarification
  - marker: b
    text: ഗ്രീക്കിലെ “വഴിപാട് അർപ്പിക്കപ്പെടുന്നതുവരെ” എന്ന ഭാഗം ഇവിടെ ദേവാലയപ്രവേശനത്തോടു ബന്ധിപ്പിച്ചിരിക്കുന്നു. അതിനെ ശുദ്ധീകരണദിവസങ്ങളുടെ പൂർത്തീകരണത്തിന്റെ സമയപരിധിയോടു ബന്ധിപ്പിച്ചും മനസ്സിലാക്കാം.
    reason: structural_ambiguity
lexical_decisions:
- source_word: παραλαβὼν
  choice: കൂടെക്കൂട്ടി
  rationale: പൗലോസ് ആ പുരുഷന്മാരെ തന്നോടൊപ്പം കൊണ്ടുപോയെന്ന സഹഗമനാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: പിറ്റേന്ന്
  rationale: തൊട്ടടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: അവരോടൊപ്പം ശുദ്ധീകരണം അനുഷ്ഠിച്ചശേഷം
  rationale: ആചാരപരമായ ശുദ്ധീകരണത്തിൽ പൗലോസും പങ്കെടുത്തുവെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; കർത്തരി-കർമണി വ്യത്യാസം അനാവശ്യമായി കടുപ്പിക്കുന്നില്ല.
- source_word: εἰσῄει
  choice: പ്രവേശിച്ച്
  rationale: ഗ്രീക്ക് imperfect രൂപത്തിന് തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഈ വാക്യത്തിലെ സംഭവക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; നിർബന്ധമായി ആവർത്തനം ചുമത്തുന്നില്ല.
- source_word: τὸ ἱερόν
  choice: ദേവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്ഥലബന്ധത്തിന് 'ദേവാലയാങ്കണം' കൂടുതൽ കൃത്യമാണ്.
- source_word: διαγγέλλων
  choice: അറിയിച്ചു
  rationale: ദേവാലയാധികാരികൾക്ക് നൽകിയ ഔപചാരിക അറിയിപ്പിനെ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: ശുദ്ധീകരണദിവസങ്ങൾ എന്നു പൂർത്തിയാകുമെന്ന്
  rationale: ആവശ്യമായ ആചാരകാലം ഓരോരുത്തർക്കും എപ്പോൾ അവസാനിക്കുമെന്ന അറിയിപ്പായി ഗ്രീക്ക് നാമവാക്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ തുറന്നുപറയുന്നു.
- source_word: ἕως οὗ προσηνέχθη
  choice: വഴിപാട് അർപ്പിക്കുന്നതുവരെയുള്ള
  rationale: ἕως οὗ അവസാനപരിധി സൂചിപ്പിക്കുന്നു; προσφέρωയുടെ യാഗാരാധനാസന്ദർഭം 'അർപ്പിക്കുക' കൃത്യമായി നൽകുന്നു. ഗ്രീക്കിലെ passive മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുകർത്തൃപ്രയോഗമായി മാറുന്നു.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: അവരിൽ ഓരോരുത്തനുവേണ്ടിയും
  rationale: വഴിപാട് ഓരോ വ്യക്തിയുടെയും പേരിൽ/പ്രയോജനത്തിനായി അർപ്പിക്കപ്പെടുന്നതിനെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἡ προσφορά
  choice: വഴിപാട്
  rationale: യാഗാർപ്പണസന്ദർഭത്തിന് യോജിച്ച പൊതുവായ പദം; നിർദിഷ്ട ബലിയുടെ ഇനം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ദേവാലയശുദ്ധീകരണത്തിൽ പൗലോസിന്റെ പങ്കാളിത്തത്തിന്റെ ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ
  choice: സംഭവം വിവരിക്കുന്നതുപോലെ മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: പൗലോസ് ആചാരത്തെ അംഗീകരിച്ചുവെന്നോ നിരസിച്ചുവെന്നോ സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനഭാഷ ചേർക്കുക
  rationale: വാക്യം സംഭവത്തെ വിവരിക്കുന്നുവെങ്കിലും മോശൈക ന്യായപ്രമാണത്തിന്റെ തുടർപ്രാബല്യത്തെക്കുറിച്ചുള്ള വിശാലമായ ദൈവശാസ്ത്രചർച്ച ഇവിടെ തീർപ്പാക്കുന്നില്ല.
- issue: εἰσῄει എന്ന imperfect ക്രിയയുടെ ഭാവം
  choice: മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമമായി 'പ്രവേശിച്ച്'
  alternative: '''പ്രവേശിച്ചുകൊണ്ടിരുന്നു'' അഥവാ ''പതിവായി പ്രവേശിച്ചു'''
  rationale: imperfect തുടർച്ചയോ ആവർത്തനമോ അനുവദിക്കുന്നുവെങ്കിലും ഈ സന്ദർഭത്തിൽ അത് നിർബന്ധമല്ല; കൂടുതൽ നിർണ്ണായകമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചുമത്തിയിട്ടില്ല.
- issue: ശുദ്ധീകരണകാലവും വഴിപാടും തമ്മിലുള്ള വാക്യഘടന
  choice: വഴിപാട് അർപ്പിക്കുന്നതുവരെയുള്ള കാലമായി ബന്ധിപ്പിച്ചു
  alternative: അറിയിക്കൽ വഴിപാട് അർപ്പിക്കപ്പെടുന്നതുവരെ തുടർന്നുവെന്നപോലെ ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടന സംക്ഷിപ്തവും അല്പം ദുഷ്കരവുമാണ്. ആചാരകാലത്തിന്റെ അവസാനപരിധിയോട് ἕως οὗ ബന്ധിപ്പിക്കുന്നത് സന്ദർഭോചിതമാണ്; ഘടനാപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ആചാരപരമായ പദങ്ങൾക്ക് 'ശുദ്ധീകരണം', 'വഴിപാട്', 'അർപ്പിക്കുക' എന്നിവ ഉപയോഗിച്ചു. 'ദേവാലയാങ്കണം' ἱερόν എന്ന പദത്തിന്റെ വിശാലമായ സ്ഥലാർഥം നിലനിർത്തുന്നു.
