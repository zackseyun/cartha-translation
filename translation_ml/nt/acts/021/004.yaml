  source_fidelity: The translation accurately represents the sequence of the aorist participle ("കണ്ടെത്തിയശേഷം"), the location sense of αὐτοῦ ("അവിടെ"), the seven-day duration, and the imperfect ἔλεγον through the continued/repeated sense of "ആവർത്തിച്ചു പറഞ്ഞുകൊണ്ടിരുന്നു." "ആത്മാവിലൂടെ" preserves διὰ τοῦ πνεύματος without deciding whether the Spirit issued a direct prohibition or the disciples drew that conclusion from revelation. "പോകരുതെന്ന്" naturally conveys the infinitival negative in this travel context, though it does not reproduce the conventional upward orientation explicitly; this is acceptable since ἐπιβαίνειν itself need not denote elevation here.
