id: ACT.21.4
reference: Acts 21:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: ml
  text: ശിഷ്യന്മാരെ കണ്ടെത്തിയശേഷം ഞങ്ങൾ അവിടെ ഏഴു ദിവസം താമസിച്ചു. അവർ ആത്മാവിലൂടെ[a] പൗലോസിനോട് യെരൂശലേമിലേക്കു പോകരുതെന്ന് ആവർത്തിച്ചു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. പൗലോസിന് വരാനിരുന്ന കഷ്ടത ആത്മാവ് വെളിപ്പെടുത്തിയെന്നും, അതിൽനിന്ന് അദ്ദേഹം യെരൂശലേമിലേക്കു പോകരുതെന്ന് ശിഷ്യന്മാർ നിഗമനം ചെയ്തെന്നും ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνευρόντες
  choice: കണ്ടെത്തിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പു നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μαθητάς
  choice: ശിഷ്യന്മാരെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ μαθητής എന്ന പദത്തിന്റെ സ്ഥിരവും പരിചിതവുമായ മലയാളരൂപം; വിശ്വാസികൾ എന്ന വിശാലമായ അർഥത്തിലേക്കു മാറ്റുന്നില്ല.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: ഞങ്ങൾ അവിടെ ... താമസിച്ചു
  rationale: ἐπιμένω എന്നതിന്റെ ഇവിടെ പ്രസക്തമായ ‘തങ്ങുക/താമസിക്കുക’ എന്ന അർഥവും αὐτοῦ എന്ന സ്ഥലസൂചനയും വ്യക്തമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘അവരോടൊപ്പം’ ചേർക്കുന്നില്ല.
- source_word: ἡμέρας ἑπτά
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἵτινες
  choice: അവർ
  rationale: മുമ്പു പറഞ്ഞ ശിഷ്യന്മാരിലേക്കുള്ള സൂചന പുതിയ വാക്യത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: ആവർത്തിച്ചു പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: imperfect ക്രിയയുടെ തുടർച്ചയോ ആവർത്തനമോ സൂചിപ്പിക്കുന്ന ഭാവം പ്രകടമാക്കുന്നു.
- source_word: διὰ τοῦ πνεύματος
  choice: ആത്മാവിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/പ്രവർത്തകത്വം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന പദം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: μὴ ἐπιβαίνειν
  choice: പോകരുതെന്ന്
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയുടെ സന്ദർഭത്തിൽ ἐπιβαίνω എന്നതിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘കയറിപ്പോകുക’ എന്ന അക്ഷരാർഥം ഇവിടെ അനാവശ്യമായ ഭൗതിക കയറ്റത്തിന്റെ ധ്വനി സൃഷ്ടിച്ചേക്കാം.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: പൗലോസിന്റെ യെരൂശലേം യാത്രയുമായി διὰ τοῦ πνεύματος എന്ന പ്രയോഗത്തിനുള്ള ബന്ധം
  choice: ആത്മാവിലൂടെ
  alternative: ആത്മാവിനാൽ; അല്ലെങ്കിൽ, വരാനിരിക്കുന്ന കഷ്ടത ആത്മാവ് വെളിപ്പെടുത്തിയതിന്റെ അടിസ്ഥാനത്തിൽ ശിഷ്യന്മാർ പോകരുതെന്ന നിഗമനത്തിലെത്തി
  rationale: ശിഷ്യന്മാർ ‘ആത്മാവിലൂടെ’ പൗലോസിനോടു പറഞ്ഞുവെന്ന വാചകം അതേപടി നിലനിർത്തുന്നു. ഇത് ആത്മാവ് നേരിട്ട് വിലക്കിയതാണോ, അതോ ആത്മാവ് വെളിപ്പെടുത്തിയ കഷ്ടതയിൽനിന്ന് ശിഷ്യന്മാർ വിലക്ക് നിഗമനം ചെയ്തതാണോ എന്നു വിവർത്തനം തീർപ്പാക്കുന്നില്ല; അപ്പൊസ്തലപ്രവൃത്തികൾ 19:21; 20:22–23 എന്നിവയുമായുള്ള വ്യാഖ്യാനപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘യെരൂശലേം’ എന്ന സ്ഥാപിത ബൈബിൾ സ്ഥലനാമം നിലനിർത്തി. ആവർത്തനഭാവം വ്യക്തമാക്കാൻ ‘ആവർത്തിച്ചു പറഞ്ഞുകൊണ്ടിരുന്നു’ ഉപയോഗിച്ചു; വ്യാഖ്യാനപരമായ സംഘർഷം മുഖ്യവാചകത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
