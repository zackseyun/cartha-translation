id: ACT.21.6
reference: Acts 21:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀπησπασάμεθα ἀλλήλους, καὶ⸃ ⸀ἐνέβημεν εἰς τὸ πλοῖον, ἐκεῖνοι δὲ ὑπέστρεψαν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: ml
  text: ഞങ്ങൾ പരസ്പരം യാത്രപറഞ്ഞശേഷം[a] കപ്പലിൽ കയറി; അവർ തങ്ങളുടെ വീടുകളിലേക്കു മടങ്ങിപ്പോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരസ്പരം വിടവാങ്ങിയശേഷം.’ ഗ്രീക്ക് പ്രയോഗത്തിന് അഭിവാദ്യം ചെയ്യുക എന്നോ യാത്രപറയുക എന്നോ അർഥമാകാം; പുറപ്പെടുന്ന ഈ സന്ദർഭം യാത്രപറയുന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തങ്ങളുടേതായവയിലേക്ക്.’ ഇത് ‘സ്വന്തം വീടുകളിലേക്ക്’ അല്ലെങ്കിൽ ‘സ്വന്തം സ്ഥലത്തേക്ക്’ എന്നർഥമുള്ള ഒരു പ്രയോഗശൈലിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: ഞങ്ങൾ പരസ്പരം യാത്രപറഞ്ഞശേഷം
  rationale: ക്രിയയ്ക്ക് അഭിവാദ്യം ചെയ്യുക എന്നും യാത്രപറയുക എന്നും അർഥമാകാം; എന്നാൽ വേർപിരിഞ്ഞുപോകുന്ന ഈ സന്ദർഭത്തിൽ ‘പരസ്പരം യാത്രപറഞ്ഞു’ എന്നതാണ് സ്വാഭാവികം. പരസ്പരതയും നിലനിർത്തുന്നു.
- source_word: ἐνέβημεν
  choice: കപ്പലിൽ കയറി
  rationale: കപ്പൽ പോലുള്ള വാഹനത്തിൽ കയറുക എന്ന സന്ദർഭോചിത അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πλοῖον
  choice: കപ്പൽ
  rationale: പദത്തിന് വള്ളം അല്ലെങ്കിൽ കപ്പൽ എന്ന വിശാല അർഥമുണ്ടെങ്കിലും, അപ്പൊസ്തലപ്രവൃത്തികളിലെ സമുദ്രയാത്രാസന്ദർഭത്തിന് ‘കപ്പൽ’ യോജിക്കുന്നു.
- source_word: ὑπέστρεψαν
  choice: മടങ്ങിപ്പോയി
  rationale: തിരികെ പോകുക എന്ന കഥനചലനം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὰ ἴδια
  choice: തങ്ങളുടെ വീടുകളിലേക്കു
  rationale: അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടേതായവയിലേക്ക്/സ്ഥലങ്ങളിലേക്ക്’ എന്നുള്ള പ്രയോഗം സ്വന്തം വീട് അല്ലെങ്കിൽ സ്വന്തം സ്ഥലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയാണ്; സന്ദർഭത്തിൽ ‘വീടുകളിലേക്ക്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
