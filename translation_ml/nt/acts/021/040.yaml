source:
  edition: SBLGNT
  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: ml
  text: 'അവൻ അനുവാദം നൽകിയപ്പോൾ, പൗലോസ് പടികളിൽ നിന്നുകൊണ്ട് ജനത്തോടു കൈകൊണ്ട് ആംഗ്യം കാണിച്ചു. വലിയ നിശ്ശബ്ദത ഉണ്ടായപ്പോൾ, അവൻ എബ്രായ ഭാഷയിൽ[a] അവരോടു സംസാരിച്ചു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അരമായ ഭാഷയിൽ’ എന്നും അർഥമാകാം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘എബ്രായ ഭാഷയിൽ/ഭാഷാഭേദത്തിൽ’ എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് സാധാരണയായി അരമായ എന്നു വിളിക്കപ്പെടുന്ന പ്രാദേശിക സെമിറ്റിക് സംസാരഭാഷയെ സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: അവൻ അനുവാദം നൽകിയപ്പോൾ
  rationale: മുൻസന്ദർഭത്തിലെ സൈന്യാധിപനെ സൂചിപ്പിക്കുന്ന genitive absolute ആണ്. കർത്താവിനെ അനാവശ്യമായി ആവർത്തിക്കാതെ സർവനാമം നിലനിർത്തുകയും കാലസംബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: പടിക്കെട്ടുകളിൽ നിന്നുകൊണ്ട്
  rationale: പൗലോസിന്റെ നിലപാട് വിവരിക്കുന്ന perfect participle ആണ്. ἀναβαθμοί ഇവിടെ കോട്ടയിലേക്കുള്ള പടികളെയോ പടിക്കെട്ടിനെയോ സൂചിപ്പിക്കുന്നു; ബഹുവചനരൂപമായ ‘പടിക്കെട്ടുകളിൽ’ ഉറവിടത്തോട് ചേർന്നുനിൽക്കുന്നു.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: ജനത്തോട് കൈകൊണ്ട് ആംഗ്യം കാണിച്ചു
  rationale: ജനത്തിന്റെ ശ്രദ്ധ നേടാനോ അവരെ ശാന്തരാക്കാനോ കൈകൊണ്ട് അടയാളം കാണിക്കുന്ന പ്രവൃത്തിയാണ് κατασείω സൂചിപ്പിക്കുന്നത്. ഉദ്ദേശ്യം അമിതമായി വിശദീകരിക്കാതെ ദൃശ്യപ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: τῷ λαῷ
  choice: ജനത്തോട്
  rationale: λαός എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ജനം’ നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായ ‘ജനക്കൂട്ടം’ എന്ന വ്യാഖ്യാനപരമായ പദം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: അവിടെ പൂർണ നിശ്ശബ്ദതയായപ്പോൾ
  rationale: രണ്ടാമത്തെ genitive absolute, ഗണ്യമായ നിശ്ശബ്ദത നിലവിൽ വന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പൂർണ നിശ്ശബ്ദത’ മലയാളത്തിൽ സ്വാഭാവികമായി തീവ്രത അറിയിക്കുന്നു.
- source_word: προσεφώνησεν
  choice: അവരെ അഭിസംബോധന ചെയ്തു
  rationale: പൊതുവേദിയിൽ ഒരു സമൂഹത്തോട് സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; ഔപചാരികതയും സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: എബ്രായ ഭാഷയിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘എബ്രായ ഭാഷയിൽ/ഭാഷാഭേദത്തിൽ’ എന്നാണ്. ഇത് അരമായയെ സൂചിപ്പിക്കാമെങ്കിലും പ്രധാനപാഠത്തിൽ ഉറവിടത്തിന്റെ രൂപം നിലനിർത്തി, സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λέγων
  choice: 'പറഞ്ഞു:'
  rationale: അടുത്ത വാക്യത്തിൽ വരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ പരിചയപ്പെടുത്തുന്ന participle ആണ്. മലയാളത്തിൽ ‘അഭിസംബോധന ചെയ്തു പറഞ്ഞു:’ എന്ന ഘടന പ്രസംഗത്തിലേക്കുള്ള നീക്കം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘എബ്രായ ഭാഷ’ എന്ന പ്രയോഗത്തിന്റെ കൃത്യമായ ഭാഷാസൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘എബ്രായ ഭാഷയിൽ’ എന്നു നിലനിർത്തി
  alternative: ‘അരമായ ഭാഷയിൽ’
  rationale: Ἑβραΐδι διαλέκτῳ എന്ന ഗ്രീക്ക് രൂപം നേരിട്ട് എബ്രായ ഭാഷ/ഭാഷാഭേദം എന്നു പറയുന്നു; അന്നത്തെ പ്രാദേശിക സെമിറ്റിക് സംസാരഭാഷയായ അരമായയെ ഇത് സൂചിപ്പിച്ചിരിക്കാം. ഉറവിടത്തിലെ യഥാർഥ അനിശ്ചിതത്വം തീർപ്പാക്കാതെ ബദൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. മൂലത്തിലെ രണ്ടു കാലസംബന്ധ ഘടനകളും പൊതുപ്രസംഗത്തിന്റെ ഔപചാരികഭാവവും നിലനിർത്തി. ഭാഷാസംബന്ധമായ അനിശ്ചിതത്വം പ്രധാനപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
