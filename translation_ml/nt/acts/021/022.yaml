  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: ml
  text: അപ്പോൾ എന്താണ് ചെയ്യേണ്ടത്? നീ വന്നിട്ടുണ്ടെന്ന് അവർ തീർച്ചയായും കേൾക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അപ്പോൾ എന്താണ്?’ സാഹചര്യത്തിന്റെ വെളിച്ചത്തിൽ എന്തു ചെയ്യണം എന്നു ചോദിക്കുന്ന ഗ്രീക്ക് ശൈലിയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: അപ്പോൾ എന്താണ് ചെയ്യേണ്ടത്?
  rationale: അക്ഷരാർഥത്തിൽ ‘അപ്പോൾ എന്താണ്?’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ നിലവിലെ സാഹചര്യം കണക്കിലെടുത്ത് ഇനി എന്തു ചെയ്യണം എന്ന പ്രായോഗിക ചോദ്യമാണിത്. സ്വാഭാവിക മലയാളത്തിൽ അതിന്റെ വ്യവഹാരാർഥം വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάντως
  choice: തീർച്ചയായും
  rationale: തുടർന്ന് പറയുന്ന കാര്യം സംഭവിക്കുമെന്ന ഉറപ്പിനെ ക്രിയാവിശേഷണം ഊന്നിപ്പറയുന്നു.
- source_word: ἀκούσονται
  choice: അവർ ... കേൾക്കും
  rationale: ഭാവികാല മധ്യരൂപം ഇവിടെ സജീവാർഥത്തിലാണ്. ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമാണെങ്കിലും സന്ദർഭം സൂചിപ്പിക്കുന്ന ബഹുവചന കർത്താവിനെ മലയാളത്തിൽ ‘അവർ’ എന്നു ചേർത്തു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: കേൾക്കാൻ പോകുന്ന വാർത്തയുടെ ഉള്ളടക്കമാണ് ഇത് അവതരിപ്പിക്കുന്നത്; കാരണം സൂചിപ്പിക്കുന്ന പ്രയോഗമല്ല.
- source_word: ἐλήλυθας
  choice: നീ വന്നിട്ടുണ്ടെന്ന്
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ പൂർണ്ണകാലരൂപം പൗലോസിന്റെ വരവിനെയും അതിന്റെ ഇപ്പോഴത്തെ ഫലമായ സാന്നിധ്യത്തെയും സൂചിപ്പിക്കുന്നു. ‘വന്നിട്ടുണ്ട്’ അത് മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ഏകവചനമായ ‘നീ’ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും ഉറപ്പിന്റെ ഊന്നലും നിലനിർത്തി.
