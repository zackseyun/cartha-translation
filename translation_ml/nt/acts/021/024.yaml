revisions:
- from: ഈ പുരുഷന്മാരെ കൂട്ടിക്കൊണ്ടുപോയി[a] അവരോടൊപ്പം നീയും ശുദ്ധീകരണം അനുഷ്ഠിക്കുക; അവർ തല മുണ്ഡനം ചെയ്യേണ്ടതിന് അവരുടെ ചെലവുകൾ വഹിക്കുക. അപ്പോൾ നിന്നെക്കുറിച്ച് അവർ കേട്ടിട്ടുള്ള കാര്യങ്ങളിൽ കഴമ്പൊന്നുമില്ലെന്നും നീയും ന്യായപ്രമാണം പാലിച്ചുകൊണ്ട് അതിനനുസരിച്ച് ജീവിക്കുന്നുവെന്നും എല്ലാവരും അറിയും.[b]
  to: ഈ പുരുഷന്മാരെ കൂടെ കൂട്ടി[a] അവരോടൊപ്പം നീയും ശുദ്ധീകരണം അനുഷ്ഠിക്കുക; അവർ തല ക്ഷൗരം ചെയ്യാൻ അവരുടെ ചെലവുകൾ വഹിക്കുക. അപ്പോൾ, നിന്നെക്കുറിച്ച് അവർ കേട്ടിട്ടുള്ള കാര്യങ്ങളിൽ കഴമ്പൊന്നുമില്ലെന്നും നീയും ന്യായപ്രമാണം പാലിച്ചുകൊണ്ട് അതിനനുസരിച്ച് ജീവിക്കുന്നുവെന്നും[b] എല്ലാവരും അറിയും.
  rationale: The revision makes a small contextual improvement to the first imperative, uses a more idiomatic expression for shaving the head, and moves footnote b to the exact phrase it explains. It otherwise preserves the draft's faithful rendering of the Greek wording, including the observable claim that Paul lives in line with and keeps the law.
