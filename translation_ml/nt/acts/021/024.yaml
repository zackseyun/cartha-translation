id: ACT.21.24
reference: Acts 21:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: ml
  text: ഈ പുരുഷന്മാരെ കൂടെ കൂട്ടി[a] അവരോടൊപ്പം നീയും ശുദ്ധീകരണം അനുഷ്ഠിക്കുക; അവർ തല ക്ഷൗരം ചെയ്യാൻ അവരുടെ ചെലവുകൾ വഹിക്കുക. അപ്പോൾ, നിന്നെക്കുറിച്ച് അവർ കേട്ടിട്ടുള്ള കാര്യങ്ങളിൽ കഴമ്പൊന്നുമില്ലെന്നും നീയും ന്യായപ്രമാണം പാലിച്ചുകൊണ്ട് അതിനനുസരിച്ച് ജീവിക്കുന്നുവെന്നും[b] എല്ലാവരും അറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ പുരുഷന്മാരെ കൂടെ കൂട്ടി.”
    reason: പരാമർശിക്കപ്പെട്ട പുരുഷന്മാരെ സ്വീകരിച്ച് കൂടെ കൊണ്ടുപോകുക എന്ന παραλαμβάνωയുടെ അർഥവ്യാപ്തി സൂചിപ്പിക്കാൻ.
  - marker: b
    text: “അതിനനുസരിച്ച് ജീവിക്കുക” എന്നതിന്റെ ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ “നിരയൊത്ത് നടക്കുക” എന്നാണ്; ഇവിടെ ന്യായപ്രമാണം പാലിക്കുന്നതിന് യോജിച്ചവിധം ജീവിക്കുക എന്നർഥം.
    reason: στοιχέωയുടെ രൂപകവും സന്ദർഭാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: ഈ പുരുഷന്മാരെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: മുൻവാക്യത്തിലെ നാല് പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. παραλαμβάνω എന്നത് ഇവിടെ അവരെ കൂടെ കൂട്ടുക എന്ന അർഥത്തിലാണ്; അനുബന്ധ കൃതന്തമായ രൂപം മലയാളത്തിൽ തുടർനിർദേശമായി സ്വാഭാവികമായി നൽകി.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: അവരോടൊപ്പം നീയും ശുദ്ധീകരണം അനുഷ്ഠിക്കുക
  rationale: ആചാരപരമായ ശുദ്ധീകരണത്തിൽ പ്രവേശിക്കുന്നതെയാണ് ἁγνίζω സൂചിപ്പിക്കുന്നത്. 'അനുഷ്ഠിക്കുക' എന്നത് ആചാരപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുകയും സ്വയം അതിൽ പങ്കെടുക്കുന്ന ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: അവരുടെ ചെലവുകൾ വഹിക്കുക
  rationale: അവർക്കുവേണ്ടി, സാധ്യതയേറിയ നിലയിൽ നേർച്ചയുമായി ബന്ധപ്പെട്ട, ചെലവുകൾ ഏറ്റെടുക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: അവർ തല മുണ്ഡനം ചെയ്യേണ്ടതിന്
  rationale: ἵναയോടു ചേർന്ന ഭാവികാലരൂപം ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. ഏകവചനമായ 'തല' ഗ്രീക്കിൽ വിതരണാർഥകമാണ്; മലയാളത്തിലും ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: γνώσονται πάντες
  choice: അപ്പോൾ ... എല്ലാവരും അറിയും
  rationale: മുൻപറഞ്ഞ പ്രവൃത്തികളുടെ ഫലമായി ഉണ്ടാകുന്ന അറിവ് വ്യക്തമാക്കാൻ 'അപ്പോൾ' ഉപയോഗിച്ചു.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: നിന്നെക്കുറിച്ച് അവർ കേട്ടിട്ടുള്ള കാര്യങ്ങൾ
  rationale: κατηχέωയ്ക്ക് 'പഠിപ്പിക്കുക' എന്നും 'അറിയിക്കുക' എന്നും അർഥമാകാം. ഇവിടെ പൗലോസിനെക്കുറിച്ച് പ്രചരിച്ച വിവരങ്ങളാണ് സന്ദർഭം; അതിനാൽ സാധാരണവും നിഷ്പക്ഷവുമായ 'കേട്ടിട്ടുള്ള' തിരഞ്ഞെടുത്തു.
- source_word: οὐδέν ἐστιν
  choice: കഴമ്പൊന്നുമില്ല
  rationale: റിപ്പോർട്ടുകൾക്ക് യാഥാർഥ്യാധാരമില്ല എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: στοιχεῖς
  choice: അതിനനുസരിച്ച് ജീവിക്കുന്നു
  rationale: στοιχέω എന്നത് നിരയൊത്ത് നടക്കുക എന്ന അക്ഷരാർഥത്തിൽനിന്ന് ഒരു മാനദണ്ഡത്തിന് അനുസൃതമായി പെരുമാറുക, ജീവിക്കുക എന്ന അർഥം വഹിക്കുന്നു. രൂപകം അസ്പഷ്ടമാകാതിരിക്കാനാണ് അർഥം തുറന്നുപറഞ്ഞത്.
- source_word: καὶ αὐτὸς
  choice: നീയും
  rationale: മറ്റുള്ളവർക്കൊപ്പം പൗലോസും വ്യക്തിപരമായി അങ്ങനെ ചെയ്യുന്നു എന്ന കൂട്ടിച്ചേർക്കലും ഊന്നലും മലയാളത്തിലെ 'നീയും' സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: φυλάσσων τὸν νόμον
  choice: ന്യായപ്രമാണം പാലിച്ചുകൊണ്ട്
  rationale: φυλάσσω νόμος എന്ന കൂട്ടുപ്രയോഗത്തിന് ന്യായപ്രമാണം കാത്തുപാലിക്കുക എന്നതാണ് അർഥം. στοιχεῖς എന്ന വേറിട്ട ക്രിയയുടെ ആശയവും നിലനിർത്താൻ രണ്ടും വേർതിരിച്ച് വിവർത്തനം ചെയ്തു.
- source_word: νόμον
  choice: ന്യായപ്രമാണം
  rationale: സന്ദർഭത്തിൽ യഹൂദ ന്യായപ്രമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മാന്യവുമായ പദം; 'മോശെയുടെ' എന്ന് മൂലത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ഈ വിവരണത്തിൽ ന്യായപ്രമാണത്തോടുള്ള പൗലോസിന്റെ ബന്ധം
  choice: നീയും ന്യായപ്രമാണം പാലിച്ചുകൊണ്ട് അതിനനുസരിച്ച് ജീവിക്കുന്നു
  alternative: നീയും ന്യായപ്രമാണം പാലിക്കുന്നു
  rationale: στοιχεῖς, φυλάσσων എന്നീ രണ്ടു ആശയങ്ങളെയും നിലനിർത്തി, ഈ പ്രവൃത്തിയിൽനിന്ന് മറ്റുള്ളവർ പൗലോസിന്റെ ദൃശ്യമായ ജീവിതരീതിയെക്കുറിച്ച് മനസ്സിലാക്കുന്നതാണ് വാക്യം പറയുന്നതെന്ന് പ്രകടമാക്കി. പൗലോസിന്റെ വിശാലമായ ന്യായപ്രമാണദർശനത്തെ ഇവിടെ തീർപ്പാക്കുകയോ മറ്റു ഭാഗങ്ങളുമായി കൃത്രിമമായി സമന്വയിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആചാരപരമായ പശ്ചാത്തലത്തിന് 'ശുദ്ധീകരണം അനുഷ്ഠിക്കുക' എന്നും νόμος എന്നതിന് പരിചിതമായ 'ന്യായപ്രമാണം' എന്നും ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടു വ്യത്യസ്ത ക്രിയകളായ στοιχεῖς, φυλάσσων എന്നിവയെ ഒറ്റ ആശയമായി ചുരുക്കാതെ 'പാലിച്ചുകൊണ്ട് അതിനനുസരിച്ച് ജീവിക്കുക' എന്നു നിലനിർത്തി.
