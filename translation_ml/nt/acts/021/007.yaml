source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: ml
  text: ഞങ്ങൾ സോറിൽനിന്നുള്ള കടൽയാത്ര പൂർത്തിയാക്കി പ്തൊലെമായിസിൽ എത്തി; സഹോദരന്മാരെ[a] അഭിവാദ്യം ചെയ്തശേഷം അവരുടെ കൂടെ ഒരു ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരന്മാരും സഹോദരിമാരും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്. ഈ പുരുഷലിംഗ ബഹുവചനപദം സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: ഞങ്ങളാകട്ടെ
  rationale: വ്യക്തമായ സർവനാമം ആഖ്യാനത്തിലെ കർത്താവിനെ ഊന്നുന്നു; δέ നൽകുന്ന മൃദുവായ മാറ്റം/തുടർച്ച ‘-ആകട്ടെ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸν πλοῦν διανύσαντες
  choice: കപ്പൽയാത്ര പൂർത്തിയാക്കി
  rationale: πλοῦς കടൽയാത്രയെയും διανύω അതിന്റെ പൂർത്തീകരണത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രമാനുസൃതമായ മുൻപ്രവൃത്തി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ Τύρου
  choice: തീരൊസിൽനിന്നുള്ള
  rationale: ἀπό പുറപ്പെടുന്ന സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: പ്തൊലെമായിസിൽ എത്തി
  rationale: യാത്രാസന്ദർഭത്തിൽ καταντάω ലക്ഷ്യസ്ഥാനത്ത് എത്തുക എന്നാണ്; εἰς ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു.
- source_word: ἀσπασάμενοι
  choice: അഭിവാദ്യം ചെയ്തശേഷം
  rationale: ἀσπάζομαι ഇവിടെ അഭിവാദ്യം ചെയ്യുക എന്നർഥം; aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം ഔപചാരികമായി നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തെ വിശാലമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: ഞങ്ങൾ അവരോടൊപ്പം ഒരു ദിവസം താമസിച്ചു
  rationale: μένω യാത്രാസന്ദർഭത്തിൽ താമസിക്കുക എന്നും accusative കാലദൈർഘ്യം ‘ഒരു ദിവസം’ എന്നും παρά ദത്തിവ് അവരുടെ കൂടെയായിരിക്കുക എന്നും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തീയ സമൂഹസന്ദർഭത്തിൽ ἀδελφοὺς എന്നതിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാരെ
  alternative: സഹോദരീസഹോദരന്മാരെ; സഹവിശ്വാസികളെ
  rationale: ഗ്രീക്ക് രൂപം പുരുഷലിംഗ ബഹുവചനമാണെങ്കിലും ആദിമ ക്രിസ്തീയ പ്രയോഗത്തിൽ സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന സഹവിശ്വാസികളെ സൂചിപ്പിക്കാം. മുഖ്യപാഠം രൂപത്തിന്റെ ലിംഗസവിശേഷത നിലനിർത്തുകയും അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളോട് അടുത്ത് ‘തീരൊസ്’, ‘പ്തൊലെമായിസ്’ എന്നു ലിപ്യന്തരിച്ചു; വാക്യത്തിന്റെ പങ്കാളിക്രമവും ‘ഞങ്ങൾ’ എന്ന വ്യക്തമായ ആഖ്യാനകർത്താവും സംരക്ഷിച്ചു.
