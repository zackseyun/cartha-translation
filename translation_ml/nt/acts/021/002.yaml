  to: ഫൊയ്‌നിക്യയിലേക്കു കടന്നുപോകുന്ന ഒരു കപ്പൽ കണ്ടെത്തിയശേഷം ഞങ്ങൾ അതിൽ കയറി പുറപ്പെട്ടു.[a]
