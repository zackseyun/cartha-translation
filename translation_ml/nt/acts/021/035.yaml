translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സൈനികർ’, ‘ജനക്കൂട്ടം’, ‘അക്രമം’ എന്നീ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന ഘടകങ്ങളോടു ചേർത്തിരിക്കുന്നു.
