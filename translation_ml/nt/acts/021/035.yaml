id: ACT.21.35
reference: Acts 21:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: ml
  text: അവൻ പടിക്കെട്ടിലെത്തിയപ്പോൾ[b], ജനക്കൂട്ടത്തിന്റെ അക്രമം നിമിത്തം സൈനികർ അവനെ ചുമന്നുകൊണ്ടുപോകുകയായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനക്കൂട്ടത്തിന്റെ അക്രമം കാരണം സൈനികർക്ക് അവനെ ചുമന്നുകൊണ്ടുപോകേണ്ടിവന്നു.’ ഗ്രീക്ക് പ്രയോഗം അവർ അവനെ ചുമന്നുകൊണ്ടുപോകുന്ന പ്രവൃത്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; സന്ദർഭം അതിന്റെ ആവശ്യകത വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പടിക്കെട്ട്’ എന്നു പറയുന്നത് റോമൻ സൈനികത്താവളത്തിലേക്കു കയറുന്ന പടവുകളെയായിരിക്കാം സൂചിപ്പിക്കുന്നത് (പ്രവൃത്തികൾ 21:34, 37 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: അവൻ … എത്തിയപ്പോൾ
  rationale: ὅτε സമയബന്ധം സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ സ്വാഭാവികമായ സമയവാക്യത്തിൽ ഉൾപ്പെടുത്തി.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: പടിക്കെട്ടിനടുത്ത് എത്തിയപ്പോൾ
  rationale: γίνομαι + ἐπί എന്ന പ്രയോഗം ഇവിടെ ഒരു സ്ഥലത്ത് എത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ മുകളിലേക്കുള്ള പടവുകളുടെ നിരയെ ‘പടിക്കെട്ട്’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: συνέβη βαστάζεσθαι αὐτόν
  choice: സൈനികർക്ക് അവനെ ചുമന്നുകൊണ്ടുപോകേണ്ടിവന്നു
  rationale: συνέβη ഫലമായി ഉണ്ടായ സാഹചര്യം അവതരിപ്പിക്കുന്നു; വർത്തമാനകാല നിഷ്ക്രിയ അനന്തക്രിയയായ βαστάζεσθαι ചുമന്നുകൊണ്ടുപോകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ജനക്കൂട്ടത്തിന്റെ അക്രമം സൃഷ്ടിച്ച നിർബന്ധിത സാഹചര്യം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘വേണ്ടിവന്നു’ ഉപയോഗിച്ചു; കൂടുതൽ രൂപസമാനമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: സൈനികർക്ക്
  rationale: നിഷ്ക്രിയവാക്യത്തിലെ പ്രവർത്തകരാണ് στρατιῶται. മലയാളത്തിലെ ‘വേണ്ടിവന്നു’ ഘടനയിൽ പ്രവർത്തകരെ ‘സൈനികർക്ക്’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: ജനക്കൂട്ടത്തിന്റെ അക്രമം നിമിത്തം
  rationale: διά + accusative കാരണം സൂചിപ്പിക്കുന്നു. βία ഇവിടെ ബലപ്രയോഗവും ആക്രമണോത്സുകതയും ഉൾക്കൊള്ളുന്നതിനാൽ ‘അക്രമം’ അനുയോജ്യം; ὄχλος എന്നതിന് നിഷ്പക്ഷമായ ‘ജനക്കൂട്ടം’ നിലനിർത്തി.
