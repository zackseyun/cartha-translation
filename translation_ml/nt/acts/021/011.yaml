id: ACT.21.11
reference: Acts 21:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: ml
  text: 'അവൻ ഞങ്ങളുടെ അടുക്കൽ വന്ന് പൗലോസിന്റെ അരപ്പട്ട എടുത്ത് സ്വന്തം കാലുകളും കൈകളും കെട്ടിയശേഷം പറഞ്ഞു: “പരിശുദ്ധാത്മാവ് ഇപ്രകാരം പറയുന്നു:[a] ‘ഈ അരപ്പട്ട ആരുടേതാണോ,[b] ആ മനുഷ്യനെ യെരൂശലേമിൽ യെഹൂദർ ഇങ്ങനെ കെട്ടി വിജാതീയരുടെ കൈകളിൽ ഏൽപ്പിക്കും.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരിശുദ്ധാത്മാവ് പറയുന്നത് ഇതാണ്.”
    reason: പ്രവാചകസൂത്രത്തിന്റെ കൂടുതൽ സംഭാഷണാത്മകമായ മറ്റൊരു സ്വാഭാവിക വിവർത്തനം.
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഈ അരപ്പട്ട ആരുടേതോ.”
    reason: ഗ്രീക്കിലെ ഉടമസ്ഥബന്ധത്തിന്റെ സംക്ഷിപ്ത ഘടന കാണിക്കുന്ന മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: ζώνην
  choice: അരപ്പട്ട
  rationale: അരയിൽ ധരിക്കുന്ന പട്ടയെയോ കച്ചയെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പദമാണ് ‘അരപ്പട്ട’.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: സ്വന്തം കാലുകളും കൈകളും കെട്ടിയശേഷം
  rationale: ἑαυτοῦ കർത്താവിലേക്കു മടങ്ങുന്ന ആത്മവാചക സർവനാമമായതിനാൽ അഗബൊസ് സ്വന്തം കാലുകളും കൈകളും കെട്ടിയെന്നാണ് അർഥം. δέω എന്ന ക്രിയയുടെ ‘കെട്ടുക’ എന്ന അർഥവും തുടർന്നുള്ള δήσουσιν എന്ന ക്രിയയുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: Τάδε λέγει
  choice: ഇപ്രകാരം പറയുന്നു
  rationale: പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട്, ഇന്നത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം ഉപയോഗിക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: മലയാളത്തിലെ സ്ഥിരവും സമകാലികവുമായ ബൈബിൾ പ്രയോഗം.
- source_word: Τὸν ἄνδρα
  choice: ആ മനുഷ്യനെ
  rationale: ἀνήρ ഇവിടെ പൗലോസെന്ന പ്രായപൂർത്തിയായ പുരുഷനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ നിർദിഷ്ടത മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: ഈ അരപ്പട്ട ആരുടേതാണോ
  rationale: ഉടമസ്ഥബന്ധം നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ പ്രവാചകശൈലിയും നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: അഗബൊസ് ചെയ്ത പ്രതീകാത്മക പ്രവൃത്തിയെയും വരാനിരിക്കുന്ന സംഭവത്തെയും നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദർ
  rationale: മൂലപാഠത്തിൽ കൂടുതൽ പരിമിതീകരണമില്ലാത്തതിനാൽ ‘യെഹൂദനേതാക്കൾ’ എന്ന അധികവിവരം ചേർക്കാതെ പൊതുവായ പദം നിലനിർത്തുന്നു.
- source_word: παραδώσουσιν
  choice: ഏൽപ്പിക്കും
  rationale: ഒരാളെ മറ്റൊരു വിഭാഗത്തിന്റെ അധികാരത്തിലേക്കു കൈമാറുക എന്ന സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: വിജാതീയരുടെ കൈകളിൽ
  rationale: യെഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന ἐθνῶν എന്ന പദവും മറ്റൊരാളുടെ അധികാരത്തിലാകുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘കൈകളിൽ’ എന്ന ദൃശ്യപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിന്റെ നേരിട്ടുള്ള പ്രവാചകപ്രഖ്യാപനമായി Τάδε λέγει അവതരിപ്പിക്കൽ
  choice: പരിശുദ്ധാത്മാവ് ഇപ്രകാരം പറയുന്നു
  alternative: പരിശുദ്ധാത്മാവ് പറയുന്നത് ഇതാണ്
  rationale: മൂലപാഠത്തിലെ പരമ്പരാഗത പ്രവാചകസൂത്രത്തിന്റെ അധികാരഭാവം നിലനിർത്തുന്നു; അതിനപ്പുറം ഒരു ദൈവശാസ്ത്രവ്യാഖ്യാനവും ചേർക്കുന്നില്ല.
- issue: ἑαυτοῦ എന്ന ആത്മവാചക സർവനാമത്തിന്റെ സൂചന
  choice: അഗബൊസ് സ്വന്തം കാലുകളും കൈകളും കെട്ടി
  alternative: അഗബൊസ് പൗലോസിന്റെ കാലുകളും കൈകളും കെട്ടി
  rationale: ആത്മവാചക സർവനാമം പങ്കുപദപ്രയോഗത്തിന്റെ കർത്താവായ അഗബൊസിലേക്കാണ് സ്വാഭാവികമായി മടങ്ങുന്നത്; അതിനാൽ ഇത് സ്വയം കെട്ടിയുള്ള പ്രതീകാത്മക പ്രവൃത്തിയാണ്.
- issue: οἱ Ἰουδαῖοι എന്ന പരാമർശത്തിന്റെ വ്യാപ്തി
  choice: യെഹൂദർ
  alternative: യെഹൂദനേതാക്കൾ
  rationale: ഗ്രീക്ക് പാഠം നേതാക്കൾ എന്ന പരിധി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം അത്തരം പ്രത്യേകീകരണം ചേർക്കാതെ മൂലത്തിലെ വ്യാപ്തിയും സാധ്യതയുള്ള സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഇപ്രകാരം പറയുന്നു’ എന്നത് പ്രവാചകപ്രഖ്യാപനത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; എന്നാൽ അനാവശ്യമായി പുരാതനമോ വിഭാഗീയമോ ആയ പദപ്രയോഗം ഒഴിവാക്കുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ [a] അടയാളം ഉറവിടവുമായി പൊരുത്തപ്പെടുന്ന ഉടമസ്ഥവാക്യത്തിനരികിലേക്കും പ്രവാചകസൂത്രത്തിന്റെ വ്യത്യസ്ത വിവർത്തനം [a] ആയി അതത് വാക്യത്തിനരികിലേക്കും അർഥാനുസൃതമായി ക്രമപ്പെടുത്തി.
