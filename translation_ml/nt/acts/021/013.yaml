id: ACT.21.13
reference: Acts 21:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: ml
  text: 'അപ്പോൾ പൗലോസ് മറുപടി പറഞ്ഞു: “നിങ്ങൾ എന്താണ് ചെയ്യുന്നത്—കരഞ്ഞ് എന്റെ ഹൃദയം തകർക്കുകയോ?[a] കർത്താവായ യേശുവിന്റെ നാമത്തിനായി[b] യെരൂശലേമിൽ ബന്ധിക്കപ്പെടാൻ മാത്രമല്ല, മരിക്കാനും ഞാൻ തയ്യാറാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ ഹൃദയം ഞെരിച്ചുടയ്ക്കുകയോ?” ഗ്രീക്ക് ക്രിയ സാധാരണ ദുഃഖത്തെക്കാൾ ശക്തമാണ്; ഉള്ളിൽ തകർന്നുപോകുന്നതിന്റെ ചിത്രം അതിലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കർത്താവായ യേശുവിന്റെ നാമത്തെപ്രതി.” “നാമം” എന്നത് യേശുവിനെയും അവന്റെ അധികാരത്തെയും അവനോടു ബന്ധപ്പെട്ട ദൗത്യത്തെയും സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: അപ്പോൾ പൗലോസ് മറുപടി പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ ക്രമവും സാധാരണമായ മറുപടി-ക്രിയയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Τί ποιεῖτε
  choice: നിങ്ങൾ എന്താണ് ചെയ്യുന്നത്
  rationale: പൗലോസിന്റെ വികാരതീവ്രമായ നേരിട്ടുള്ള ചോദ്യം ‘എന്തിന്’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: κλαίοντες
  choice: കരഞ്ഞ്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: എന്റെ ഹൃദയം തകർക്കുകയോ
  rationale: ശക്തമായ ഗ്രീക്ക് ക്രിയയിലെ ഉള്ളന്തരമായ തകർച്ചയുടെ രൂപകം മലയാളത്തിലെ പരിചിതമായ ‘ഹൃദയം തകർക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: δεθῆναι
  choice: ബന്ധിക്കപ്പെടാൻ
  rationale: പരോക്ഷമായി ‘തടവിലാക്കപ്പെടുക’ എന്നു വികസിപ്പിക്കാതെ ഗ്രീക്കിലെ കെട്ടപ്പെടുക/ബന്ധിക്കപ്പെടുക എന്ന നിഷ്ക്രിയ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀποθανεῖν
  choice: മരിക്കാനും
  rationale: സ്രോതസ്സിലെ ലളിതവും ശക്തവുമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: ബന്ധിക്കപ്പെടലും മരണവും സംഭവിക്കാവുന്ന സ്ഥലത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἑτοίμως ἔχω
  choice: ഞാൻ തയ്യാറാണ്
  rationale: സന്നദ്ധാവസ്ഥ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: നാമത്തിനായി
  rationale: യേശുവിന്റെ വ്യക്തിത്വം, അധികാരം, അവനോടു ബന്ധപ്പെട്ട ദൗത്യം എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾപരമായ ‘നാമം’ എന്ന പ്രയോഗം വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിനെ ദുർബലപ്പെടുത്താതെ മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന സ്ഥാനപ്പേര്
  choice: കർത്താവായ യേശു
  alternative: യജമാനനായ യേശു
  rationale: ഇവിടെ κύριος യേശുവിന്റെ അധികാരവും സ്ഥാനവും സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരായതിനാൽ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- issue: ‘നാമം’ എന്ന ബൈബിൾപരമായ പ്രയോഗം
  choice: കർത്താവായ യേശുവിന്റെ നാമത്തിനായി
  alternative: കർത്താവായ യേശുവിനുവേണ്ടി
  rationale: ‘നാമം’ എന്നത് യേശുവിനെയും അവന്റെ അധികാരത്തെയും അവനോടു ചേർന്ന ദൗത്യത്തെയും സൂചിപ്പിക്കുന്ന ദൈവശാസ്ത്രഭാരമുള്ള പ്രയോഗമാണ്; അതിനെ വെറും വ്യക്തിസൂചനയായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ വികാരതീവ്രമായ പ്രതിഷേധം നിലനിർത്താൻ നേരിട്ടുള്ള ചോദ്യവും ഡാഷും ഉപയോഗിച്ചു; ‘നാമം’ എന്ന ബൈബിൾപ്രയോഗവും ‘ബന്ധിക്കപ്പെടുക’ എന്ന മൂലാർഥവും സംരക്ഷിച്ചു.
