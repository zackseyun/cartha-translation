id: ACT.21.12
reference: Acts 21:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἠκούσαμεν ταῦτα, παρεκαλοῦμεν ἡμεῖς τε καὶ οἱ ἐντόπιοι τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: ml
  text: ഇവ കേട്ടപ്പോൾ, അവൻ യെരൂശലേമിലേക്കു കയറിപ്പോകരുതെന്ന് ഞങ്ങളും അവിടത്തുകാരും അവനോട് അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനോട് ശക്തമായി അപേക്ഷിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയയ്ക്ക് ആത്മാർഥമായി അപേക്ഷിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: ഇവ കേട്ടപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചന സ്വാഭാവികമായി നൽകുകയും ταῦτα എന്ന ബഹുവചനത്തെ ‘ഇവ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു; δέ ഇവിടെ പ്രത്യേകം വിവർത്തനം ചെയ്യാതെ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: παρεκαλοῦμεν
  choice: അഭ്യർഥിച്ചു
  rationale: സന്ദർഭത്തിലെ ഗൗരവമുള്ള പ്രേരണയും അപേക്ഷയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം. അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ച ഇവിടെ കൃത്രിമമായി വിശദീകരിക്കാതെ സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: ഞങ്ങളും അവിടത്തുകാരും
  rationale: വിവരണകർത്താവിന്റെ സംഘവും ആ സ്ഥലത്തെ ആളുകളും എന്ന രണ്ടു കൂട്ടരെയും τε καὶ ഘടനയ്ക്കനുസരിച്ച് വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: കയറിപ്പോകരുതെന്ന് അവനോട്
  rationale: അവൻ പോകരുതെന്ന അഭ്യർഥനയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു; ἀναβαίνειν എന്ന ദിശാസൂചന ‘കയറിപ്പോകുക’ എന്നു സംരക്ഷിക്കുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിലേക്കുള്ള യാത്രയുടെ ദിശാസൂചക പ്രയോഗം
  choice: യെരൂശലേമിലേക്കു കയറിപ്പോകുക
  alternative: യെരൂശലേമിലേക്കു പോകുക
  rationale: ഗ്രീക്കിലെ ἀναβαίνειν എന്ന ‘കയറിപ്പോകുക’ എന്ന പ്രയോഗം യെരൂശലേമിലേക്കുള്ള യാത്രയെക്കുറിച്ചുള്ള പതിവ് ദിശാസൂചനയാണ്. അതിനെ നിലനിർത്തുന്നത് അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ മൂലപാഠത്തോട് അടുത്തുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘അവിടത്തുകാർ’ പ്രാദേശികരെന്ന അർഥം ലളിതമായി നൽകുന്നു; ‘കയറിപ്പോകുക’ മൂലപാഠത്തിലെ യെരൂശലേം-ദിശാസൂചന നിലനിർത്തുന്നു.
