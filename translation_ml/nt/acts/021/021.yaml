id: ACT.21.21
reference: Acts 21:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: ml
  text: എന്നാൽ, ജനതകളുടെ ഇടയിൽ കഴിയുന്ന എല്ലാ യെഹൂദരെയും മോശെയെ[b] ഉപേക്ഷിക്കാൻ നീ പഠിപ്പിക്കുന്നുവെന്നും, അവരുടെ മക്കളെ പരിച്ഛേദനം ചെയ്യരുതെന്നും ആചാരങ്ങൾ അനുസരിച്ച് ജീവിക്കരുതെന്നും അവരോടു പറഞ്ഞും നീ പഠിപ്പിക്കുന്നുവെന്നും അവർ നിന്നെക്കുറിച്ച് കേട്ടിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മോശെയിൽനിന്ന് വിട്ടുമാറാൻ നീ പഠിപ്പിക്കുന്നു.’ ഗ്രീക്കിൽ ഉപേക്ഷിക്കൽ അഥവാ വിട്ടുമാറൽ എന്നർഥമുള്ള ἀποστασία എന്ന നാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മോശെ’ ഇവിടെ മോശെയുടെ ന്യായപ്രമാണത്തെയും പാരമ്പര്യമായ യെഹൂദ ആചാരങ്ങളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: κατηχήθησαν
  choice: കേട്ടിരിക്കുന്നു
  rationale: ഇവിടെ കർത്തരിപ്രയോഗമല്ലാത്ത രൂപം പൗലോസിനെക്കുറിച്ചുള്ള വിവരം വാമൊഴിയായി ലഭിച്ചിരിക്കുന്നു എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘കേട്ടിരിക്കുന്നു’ സ്വാഭാവികമായി ആ റിപ്പോർട്ടിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്നു.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: മോശെയെ ഉപേക്ഷിക്കാൻ
  rationale: ἀποστασία എന്ന നാമം ഉപേക്ഷിക്കൽ അഥവാ വിട്ടുമാറൽ എന്നതാണ്. ‘മോശെയിൽനിന്നുള്ള വിശ്വാസത്യാഗം’ എന്ന കൃത്രിമമായ നാമരൂപത്തേക്കാൾ ആരോപണത്തിന്റെ ശക്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘മോശെ’ എന്ന മൂലപദപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: ജനതകളുടെ ഇടയിൽ കഴിയുന്ന എല്ലാ യെഹൂദരോടും
  rationale: ജാതീയ ജനവിഭാഗങ്ങളുടെ ഇടയിൽ ചിതറിപ്പാർത്തിരുന്ന യെഹൂദരെ സൂചിപ്പിക്കുന്നു. ‘ജനതകളുടെ ഇടയിൽ കഴിയുന്ന’ എന്നത് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: λέγων
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: ഈ കൃതന്തം ആരോപിക്കപ്പെട്ട പഠിപ്പിക്കലിന്റെ ഉള്ളടക്കവും രീതിയും വിശദീകരിക്കുന്നു.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: അവരുടെ മക്കളെ പരിച്ഛേദനം ചെയ്യരുതെന്നും
  rationale: മൂലപാഠത്തിലെ τέκνα ‘മക്കൾ’ എന്നാണ്; പരിച്ഛേദനം ആൺകുട്ടികൾക്കാണെങ്കിലും ‘പുത്രന്മാർ’ എന്നു ചുരുക്കാതെ മൂലത്തിന്റെ വിശാലമായ പദം നിലനിർത്തുന്നു.
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: ആചാരങ്ങൾ അനുസരിച്ച് നടക്കരുതെന്നും
  rationale: περιπατεῖν എന്ന ‘നടക്കുക’ എന്ന രൂപകം ജീവിതനടത്തത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾഭാഷയിൽ ഇത് മനസ്സിലാകുന്നതും മൂലരൂപകം സംരക്ഷിക്കുന്നതുമാണ്; ἔθεσιν പാരമ്പര്യമായി ലഭിച്ച യെഹൂദ ആചാരങ്ങളാണ്.
theological_decisions:
- issue: മോശെയുടെ ന്യായപ്രമാണത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ നിലപാടായി റിപ്പോർട്ട് ചെയ്യപ്പെട്ട ആരോപണം
  choice: ‘മോശെയെ ഉപേക്ഷിക്കാൻ നീ പഠിപ്പിക്കുന്നു’ എന്ന ആരോപണമായി മാത്രം അവതരിപ്പിച്ചു.
  alternative: ‘മോശെയിൽനിന്ന് വിശ്വാസത്യാഗം ചെയ്യാൻ നീ പഠിപ്പിക്കുന്നു’ / ‘മോശെയുടെ ന്യായപ്രമാണം ഉപേക്ഷിക്കാൻ നീ പഠിപ്പിക്കുന്നു.’
  rationale: ഇത് പൗലോസിനെക്കുറിച്ച് മറ്റുള്ളവർ കേട്ട ആരോപണമാണ്; ലൂക്കോസിന്റെ ഉപദേശപരമായ വിധിനിർണയമല്ല. അതിനാൽ ആരോപണത്തിന്റെ ശക്തി നിലനിർത്തുകയും അതിന്റെ സത്യാവസ്ഥ അംഗീകരിക്കുന്ന തരത്തിലുള്ള വിപുലീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘പരിച്ഛേദനം’, ‘മോശെ’, ‘യെഹൂദർ’ തുടങ്ങിയ സ്ഥിരപ്പെട്ട ബൈബിൾപദങ്ങൾ നിലനിർത്തി. περιπατεῖν എന്ന ജീവിതനടത്തത്തിന്റെ രൂപകം ‘നടക്കുക’ എന്നു സംരക്ഷിച്ചു; എന്നാൽ വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
