base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: ml
  text: അവരെ അഭിവാദ്യം ചെയ്തശേഷം, തന്റെ ശുശ്രൂഷയിലൂടെ യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ[a] ദൈവം ചെയ്ത കാര്യങ്ങൾ അവൻ ഒന്നൊന്നായി വിവരിച്ചുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനതകളുടെ ഇടയിൽ.’ ഈ സന്ദർഭത്തിൽ ഇത് യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശദീകരിച്ചു’ അല്ലെങ്കിൽ ‘വിശദമായി റിപ്പോർട്ട് ചെയ്തു.’ ഗ്രീക്ക് ക്രിയ വിശദമായും കാര്യങ്ങൾ ഒന്നൊന്നായി എടുത്തുപറഞ്ഞും നടത്തുന്ന വിവരണത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: അഭിവാദ്യം ചെയ്തശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξηγεῖτο
  choice: വിശദമായി വിവരിച്ചു
  rationale: തുടർച്ചയായും വിശദമായും വിവരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന imperfect രൂപത്തിന്റെയും ക്രിയയുടെ അർഥപരിധിയുടെയും ഭാവം നൽകുന്നു; വാക്യത്തിലെ ‘ഓരോന്നായി’ എന്ന പ്രയോഗം റിപ്പോർട്ടിന്റെ ക്രമാനുസൃത സ്വഭാവം കൂടുതൽ വ്യക്തമാക്കുന്നു.
- source_word: καθ’ ἓν ἕκαστον
  choice: ഓരോന്നായി
  rationale: കാര്യങ്ങൾ ഒന്നൊന്നായി എടുത്തുപറഞ്ഞുവെന്ന distributive force സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: ദൈവം ചെയ്ത കാര്യങ്ങൾ
  rationale: ദൈവത്തെയാണ് പ്രവർത്തിയുടെ കർത്താവായി മൂലപാഠം അവതരിപ്പിക്കുന്നത്; അതു നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ
  rationale: ഈ സന്ദർഭത്തിൽ ἔθνη എന്നത് ഭൗമരാഷ്ട്രീയ ജനതകളെക്കാൾ യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് അർഥം ഉടൻ വ്യക്തമാകുന്ന രൂപമാണിത്.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: തന്റെ ശുശ്രൂഷയിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഉപാധിത്വം നിലനിർത്തുന്നു; διακονία ഇവിടെ പൗലോസിന്റെ സേവനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു, ഔദ്യോഗിക സഭാപദവി അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ ദൗത്യപ്രവർത്തനവിവരണത്തിലെ കർത്തൃത്വം
  choice: പ്രവർത്തിച്ചവൻ ദൈവം; പൗലോസിന്റെ ശുശ്രൂഷ അതിന്റെ ഉപാധി.
  alternative: യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ പൗലോസ് സ്വയം നേടിയ നേട്ടങ്ങളാണ് അവൻ വിവരിച്ചത്.
  rationale: ὁ θεὸς എന്നത് പ്രവർത്തിയുടെ കർത്താവിനെ വ്യക്തമായി നിർദേശിക്കുന്നു; διὰ τῆς διακονίας αὐτοῦ പൗലോസിന്റെ ശുശ്രൂഷയെ ഉപാധിയായി അവതരിപ്പിക്കുന്നു. വിവർത്തനം ദൈവിക കർത്തൃത്വവും മനുഷ്യസേവനത്തിന്റെ ഉപാധിത്വവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യഹൂദരല്ലാത്തവർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ശുശ്രൂഷ’ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായിരുന്നാലും ഇവിടെ പദവിയേക്കാൾ സേവനപ്രവർത്തനമാണ് സൂചിപ്പിക്കുന്നത്. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
