id: ACT.21.37
reference: Acts 21:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: ml
  text: 'പൗലോസിനെ സൈനികത്താവളത്തിലേക്ക്[a] കൊണ്ടുപോകാനിരിക്കെ, അദ്ദേഹം സൈനികമേധാവിയോടു[b] പറഞ്ഞു: “അങ്ങയോടു ഒരു കാര്യം പറയാൻ എനിക്ക് അനുവാദമുണ്ടോ?”[c] സൈനികമേധാവി പറഞ്ഞു: “നിനക്കു ഗ്രീക്ക് അറിയാമോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൈനികത്താവളം’ എന്നത് റോമൻ സൈനികരുടെ താമസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; അത് കോട്ടസമുച്ചയത്തിനുള്ളിലായിരുന്നിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: ഗ്രീക്ക് പദം ഒരു ഉന്നത റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; ‘ട്രിബ്യൂൺ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: cultural_note
  - marker: c
    text: 'കൂടുതൽ സംഭാഷണശൈലിയിൽ: “ഞാൻ അങ്ങയോട് ഒരു കാര്യം പറഞ്ഞോട്ടേ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: കൊണ്ടുപോകാനിരിക്കുമ്പോൾ
  rationale: μέλλω ആസന്നമായ പ്രവൃത്തിയെയും εἰσάγεσθαι കർമണിപ്രയോഗത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകി കർമണിയർഥം നിലനിർത്തുന്നു.
- source_word: παρεμβολή
  choice: സൈനികത്താവളം
  rationale: യെരൂശലേമിലെ ഈ സാഹചര്യത്തിൽ പദം സാധാരണ പാളയത്തേക്കാൾ റോമൻ സൈനികരുടെ താമസ-സുരക്ഷാകേന്ദ്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സൈനികത്താവളം’ ആധുനിക വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: χιλίαρχος
  choice: സൈനികമേധാവി
  rationale: ഏകദേശം ഒരു റോമൻ സൈനികദളത്തിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ചരിത്രപദമായ ‘ട്രിബ്യൂൺ’ എന്നതിനെക്കാൾ ‘സൈനികമേധാവി’ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകും; പദത്തിന്റെ പ്രത്യേക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: അങ്ങയോടു ഒരു കാര്യം പറയാൻ എനിക്ക് അനുവാദമുണ്ടോ?
  rationale: ἔξεστιν അനുമതിയെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ വിനയപൂർവമായ ചോദ്യത്തിന്റെ അർഥവും മാന്യമായ അഭിസംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τι
  choice: ഒരു കാര്യം
  rationale: സന്ദർഭത്തിൽ അനിശ്ചിത സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യപ്രയോഗമാണിത്.
- source_word: Ἑλληνιστί γινώσκεις
  choice: നിനക്കു ഗ്രീക്ക് അറിയാമോ?
  rationale: Ἑλληνιστί ‘ഗ്രീക്ക് ഭാഷയിൽ/ഗ്രീക്ക്’ എന്നും γινώσκεις ‘അറിയുക’ എന്നും അർഥമാക്കുന്നു. ഭാഷാപരിചയം ചോദിക്കുന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷ ഉപയോഗിച്ചു. പൗലോസ് ഉദ്യോഗസ്ഥനോട് പറയുന്ന വാക്കുകളിൽ ‘അങ്ങ്’ ഉപയോഗിച്ച് വിനയവും, ഉദ്യോഗസ്ഥന്റെ അപ്രതീക്ഷിത പ്രതികരണത്തിൽ ‘നീ’ ഉപയോഗിച്ച് സാമൂഹിക നിലയിലെ വ്യത്യാസവും സൂക്ഷിച്ചു. ഗ്രീക്കിലെ ചോദ്യം-മറുപടി പ്രവാഹം വ്യക്തമാക്കാൻ രണ്ട് പ്രസംഗക്രിയകളും ‘ചോദിച്ചു’ എന്ന് നൽകി.
