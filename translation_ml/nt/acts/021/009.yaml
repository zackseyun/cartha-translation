id: ACT.21.9
reference: Acts 21:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: ml
  text: അവന് കന്യകമാരായ[a] നാല് പുത്രിമാർ ഉണ്ടായിരുന്നു; അവർ പ്രവചിക്കുന്നവരായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിവാഹം കഴിക്കാത്തവരായ.”
    reason: παρθένοι എന്ന പദം കന്യകാത്വത്തെ നേരിട്ട് സൂചിപ്പിക്കാമെങ്കിലും, വിവാഹം കഴിക്കാത്ത യുവതികൾ എന്ന സാമൂഹിക നിലയെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: τούτῳ ... ἦσαν
  choice: അവന് ... ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്കിലെ ദത്തിവ്-അസ്തിത്വ ഘടന ഫിലിപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥഘടനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: θυγατέρες τέσσαρες
  choice: നാല് പുത്രിമാർ
  rationale: ബന്ധവും എണ്ണവും നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρθένοι
  choice: കന്യകമാരായ
  rationale: പദത്തിന്റെ പ്രാഥമികമായ ‘കന്യകകൾ’ എന്ന അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; വിവാഹം കഴിക്കാത്ത യുവതികൾ എന്ന സാമൂഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: προφητεύουσαι
  choice: അവർ പ്രവചിച്ചുപോന്നു
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായോ പതിവായോ ഉള്ള പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: —
  rationale: ഇവിടെ ഇത് മൃദുവായ തുടർച്ചാസൂചകമാണ്; മലയാള വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
theological_decisions:
- issue: സ്ത്രീകളുടെ പ്രവചനപ്രവർത്തനത്തോടൊപ്പം παρθένοι എന്ന പദം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: കന്യകമാരായ
  alternative: വിവാഹം കഴിക്കാത്തവരായ
  rationale: അവരുടെ കന്യകാത്വവും പ്രവചനപ്രവർത്തനവും വാക്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും ഇവ തമ്മിൽ ദൈവശാസ്ത്രപരമായ കാരണബന്ധമൊന്നും സ്ഥാപിക്കുന്നില്ല. അതിനാൽ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും മറ്റൊരു സാമൂഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രവചിച്ചുപോന്നു’ എന്നത് പ്രവർത്തനം തുടർന്നിരുന്നതോ പതിവായിരുന്നതോ എന്ന കൃദന്തരൂപത്തിന്റെ ഭാവം കൈമാറുന്നു; കന്യകാത്വത്തിനും പ്രവചനത്തിനും ഇടയിൽ വാക്യം പറയാത്ത ദൈവശാസ്ത്രബന്ധം ചേർത്തിട്ടില്ല.
