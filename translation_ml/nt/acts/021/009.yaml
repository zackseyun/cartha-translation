  naturalness: The draft is clear modern Malayalam. Recasting the final clause as ‘അവർ പ്രവചിക്കുന്നവരായിരുന്നു’ is more idiomatic for a continuing characteristic at the time in view and avoids suggesting only a completed or formerly repeated activity.
  terminology: ‘പുത്രിമാർ,’ ‘കന്യകമാരായ,’ and ‘പ്രവചിക്കുന്നവരായിരുന്നു’ are appropriate, respectful modern-standard Malayalam terms. The footnote preserves the semantic range without adding theological inference.
