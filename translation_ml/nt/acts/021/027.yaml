id: ACT.21.27
reference: Acts 21:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: ml
  text: ഏഴു ദിവസം തികയാറായപ്പോൾ, ഏഷ്യാ പ്രവിശ്യയിൽനിന്നുള്ള യെഹൂദന്മാർ അവനെ ദേവാലയത്തിൽ[c] കണ്ടു. അവർ ജനക്കൂട്ടത്തെയാകെ ഇളക്കിമറിച്ച്[a] അവനെ പിടികൂടി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനക്കൂട്ടത്തെയാകെ ആശയക്കുഴപ്പത്തിലാക്കി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ജനത്തെ ഇളക്കിവിടുക എന്നും ആശയക്കുഴപ്പത്തിലാക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെമേൽ കൈകൾ വെച്ചു’; ഇവിടെ ബലമായി പിടികൂടുക എന്നാണ് അർഥം.
    reason: idiom_explanation
  - marker: c
    text: ഇവിടെ ‘ദേവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ അങ്കണങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: ഏഴു ദിവസം തികയാറായപ്പോൾ
  rationale: μέλλωയും συντελεῖσθαιയും ചേർന്ന് കാലയളവ് പൂർത്തിയാകാൻ അടുത്തിരുന്നുവെന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആസന്നതയും പൂർത്തീകരണവും ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: ഏഷ്യാ പ്രവിശ്യയിൽനിന്നുള്ള യെഹൂദന്മാർ
  rationale: ഇവിടത്തെ Ἀσία ആധുനിക ഏഷ്യാ ഭൂഖണ്ഡമല്ല, റോമൻ പ്രവിശ്യയാണ്. ‘പ്രവിശ്യ’ എന്നു ചേർക്കുന്നത് ചരിത്രപരമായ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ
  choice: അവനെ ദേവാലയത്തിൽ കണ്ടു
  rationale: θεάομαι ഇവിടെ നേരിൽ കാണുന്നതിനെ സൂചിപ്പിക്കുന്നു. ἱερόν മുഴുവൻ ദേവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കാമെന്ന കൃത്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെയാകെ ഇളക്കിമറിച്ച്
  rationale: συγχέωയ്ക്ക് കലഹിപ്പിക്കുക, ഇളക്കിമറിക്കുക, ആശയക്കുഴപ്പത്തിലാക്കുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥങ്ങളുണ്ട്. ജനക്കൂട്ടത്തിന്റെ പ്രക്ഷുബ്ധതയും ക്രമക്കേടും സ്വാഭാവികമായി പകർന്നുനൽകുന്ന പ്രയോഗമാണിത്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: അവനെ പിടികൂടി
  rationale: ‘കൈകൾ അവന്റെമേൽ വെച്ചു’ എന്ന ഗ്രീക്ക് ശൈലിയുടെ സന്ദർഭോചിതമായ അർഥം ബലമായി പിടികൂടുക എന്നതാണ്. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കി പ്രവർത്തിയുടെ ബലം വ്യക്തമാക്കുന്നു; പദശൈലി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ സ്വാഭാവിക വായനയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; പ്രവർത്തനങ്ങളുടെ ക്രമവും ബന്ധവും നിലനിർത്തിയിട്ടുണ്ട്.
