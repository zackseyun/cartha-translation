id: ACT.21.32
reference: Acts 21:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: ml
  text: അദ്ദേഹം ഉടൻതന്നെ പടയാളികളെയും ശതാധിപന്മാരെയും കൂട്ടിക്കൊണ്ട് അവരുടെ അടുത്തേക്ക് ഓടിയിറങ്ങി. സൈനികാധിപനെയും[a] പടയാളികളെയും കണ്ടപ്പോൾ അവർ പൗലോസിനെ അടിക്കുന്നത് നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: റോമൻ χιλίαρχος എന്ന പദവിയെ ‘സൈനിക ട്രിബ്യൂൺ’ എന്നോ ‘സേനാനായകൻ’ എന്നോ വിവർത്തനം ചെയ്യാം; ഒരു കോഹോർട്ടിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനായിരുന്നു അദ്ദേഹം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: ഉടൻതന്നെ
  rationale: പ്രവർത്തനം ഒട്ടും വൈകാതെ നടന്നുവെന്ന അടിയന്തരത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παραλαβὼν
  choice: കൂട്ടിക്കൊണ്ട്
  rationale: സൈനികരെയും ശതാധിപന്മാരെയും കൂടെ കൊണ്ടുപോയി എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: στρατιώτας
  choice: പടയാളികൾ
  rationale: വ്യക്തിഗത സൈനികരെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘സൈന്യം’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: ἑκατοντάρχας
  choice: ശതാധിപന്മാർ
  rationale: റോമൻ centurion പദവിക്കുള്ള സ്ഥാപിതമായ മലയാള പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: അവരുടെ അടുത്തേക്ക് ഓടിയിറങ്ങി
  rationale: കോട്ടമേഖലയിലെ ഉയർന്ന സ്ഥാനത്തുനിന്ന് ജനക്കൂട്ടത്തിന്റെ അടുത്തേക്കുള്ള വേഗമുള്ള താഴോട്ടുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ശത്രുത അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: χιλίαρχον
  choice: സൈനികാധിപൻ
  rationale: റോമൻ കോഹോർട്ടിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; ചരിത്രപരമായ മറ്റു പദങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπαύσαντο
  choice: നിർത്തി
  rationale: അവർ ചെയ്തുകൊണ്ടിരുന്ന പ്രവൃത്തി അവസാനിപ്പിച്ചു എന്ന അർഥം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τύπτοντες
  choice: അടിക്കുന്നതു
  rationale: ആവർത്തിച്ചുള്ള ശാരീരിക പ്രഹരത്തെ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. റോമൻ സൈനിക പശ്ചാത്തലം നിലനിർത്താൻ ‘ശതാധിപന്മാർ’ ഉപയോഗിക്കുകയും, χιλίαρχος എന്ന പദത്തിന്റെ ചരിത്രപരമായ കൃത്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
