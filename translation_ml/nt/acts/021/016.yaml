source:
  edition: SBLGNT
  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: ml
  text: കൈസര്യയിൽനിന്നുള്ള ശിഷ്യന്മാരിൽ ചിലരും ഞങ്ങളോടൊപ്പം വന്നു. ഞങ്ങൾ താമസിക്കേണ്ടിയിരുന്ന സൈപ്രസുകാരനായ മ്നാസോൻ എന്ന ഒരാളുടെ അടുക്കലേക്ക് അവർ ഞങ്ങളെ കൂട്ടിക്കൊണ്ടുപോയി.[a] അദ്ദേഹം വളരെക്കാലമായി ശിഷ്യനായിരുന്നവനായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ താമസിക്കേണ്ടിയിരുന്ന മ്നാസോന്റെ അടുക്കലേക്ക് ഞങ്ങളെ നയിച്ചുകൊണ്ട്” എന്നും “മ്നാസോന്റെ വീട്ടിലേക്ക് ഞങ്ങളെ കൊണ്ടുപോയി” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ കൃദന്തരൂപവും താമസത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയും അടുത്ത ബന്ധമുള്ള, അല്പം വ്യത്യസ്തമായ രീതികളിൽ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഒരു ആദ്യകാല ശിഷ്യൻ.” ഈ പ്രയോഗം മ്നാസോൻ ഏറെക്കാലമായി ശിഷ്യനായിരുന്നുവെന്നോ, ഒരുപക്ഷേ ഈ പ്രസ്ഥാനത്തിന്റെ ആദ്യകാലംമുതൽ ശിഷ്യനായിരുന്നുവെന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν
  choice: കൈസര്യയിൽനിന്നുള്ള ശിഷ്യന്മാരിൽ ചിലരും ഞങ്ങളോടൊപ്പം വന്നു
  rationale: καίയും ഭാഗിക ജനിറ്റീവ് പ്രയോഗവും ചേർന്ന് ‘ശിഷ്യന്മാരിൽ ചിലരും’ എന്ന അർഥം നൽകുന്നു; συνῆλθον ... σὺν ἡμῖν യാത്രയിലെ അനുഗമനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄγοντες
  choice: അവർ ഞങ്ങളെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: യാത്രാസന്ദർഭത്തിൽ ἄγω എന്നതിന്റെ നയിക്കുക/കൊണ്ടുപോകുക എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കർത്താവിനെ വ്യക്തമായി കാണിക്കാൻ ‘അവർ’ ചേർത്തു.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: ഞങ്ങൾ താമസിക്കേണ്ടിയിരുന്ന ... അടുക്കലേക്ക്
  rationale: ξενίζωയിലെ അതിഥിയായി പാർപ്പിക്കുക/താമസിക്കുക എന്ന ആശയവും ഇവിടെ ഉദ്ദേശിക്കപ്പെട്ട താമസമെന്ന സബ്ജങ്ക്റ്റീവ് സൂചനയും നിലനിർത്തുന്നു.
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: സൈപ്രസുകാരനായ മ്നാസോൻ എന്ന ഒരു
  rationale: τινι പരിചയപ്പെടുത്തുന്ന അനിശ്ചിതത്വം ‘എന്ന ഒരു’ എന്നു സൂക്ഷിക്കുകയും Κυπρίῳ ജന്മദേശപരമായ വിശേഷണമായി നൽകുകയും ചെയ്തു.
- source_word: ἀρχαίῳ μαθητῇ
  choice: ആദ്യകാല ശിഷ്യൻ
  rationale: മ്നാസോൻ പ്രസ്ഥാനത്തിന്റെ ആദ്യകാലംമുതൽ ശിഷ്യനായിരുന്നുവെന്ന സാധ്യത പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ‘ആദ്യ ശിഷ്യന്മാരിൽ ഒരാൾ’ എന്നു അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ἀρχαίῳ μαθητῇ എന്നതിന്റെ കാലസൂചന
  choice: ആദ്യകാല ശിഷ്യൻ
  alternative: ദീർഘകാലമായി ശിഷ്യനായിരുന്ന ഒരാൾ
  rationale: ഗ്രീക്ക് പദത്തിന് പ്രസ്ഥാനത്തിന്റെ ആദ്യകാലവുമായി ബന്ധമുള്ളവൻ എന്നും ഏറെക്കാലമായി ശിഷ്യനായവൻ എന്നും മനസ്സിലാക്കാവുന്നതാണ്. മുഖ്യവാചകം ആദ്യ അർഥസാധ്യത നൽകുകയും അടിക്കുറിപ്പ് മറ്റേതിനെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി. ‘മ്നാസോൻ’ എന്ന ലിപ്യന്തരണം ഗ്രീക്ക് Μνάσων എന്ന പേരിനെ അനുസരിക്കുന്നു.
