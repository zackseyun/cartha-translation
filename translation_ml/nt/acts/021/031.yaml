id: ACT.21.31
reference: Acts 21:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζητούντων ⸀τε αὐτὸν ἀποκτεῖναι ἀνέβη φάσις τῷ χιλιάρχῳ τῆς σπείρης ὅτι ὅλη ⸀συγχύννεται Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: ml
  text: അവർ അവനെ കൊല്ലാൻ ശ്രമിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, യെരൂശലേം മുഴുവൻ കലക്കത്തിലാണ്[a] എന്ന വിവരം സൈനികദളത്തിന്റെ അധിപന്[b] ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആശയക്കുഴപ്പത്തിലാണ്’ അല്ലെങ്കിൽ ‘പ്രക്ഷുബ്ധമാണ്.’
    reason: lexical_alternative
  - marker: b
    text: ‘സൈനികദളത്തിന്റെ അധിപൻ’ എന്നത് അവിടെ നിലയുറപ്പിച്ചിരുന്ന റോമൻ സൈനികദളത്തിന്റെ ചുമതലയുള്ള ഉയർന്ന ഉദ്യോഗസ്ഥനെ (ട്രിബ്യൂണിനെ) സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: അവർ അവനെ കൊല്ലാൻ ശ്രമിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തത്തോടുകൂടിയ genitive absolute, മുഖ്യക്രിയയോടൊപ്പം തുടരുന്ന ശ്രമത്തെ സൂചിപ്പിക്കുന്നു. ‘കൊല്ലാൻ ശ്രമിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ ഈ കാലഭാവവും നേരിട്ടുള്ള അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνέβη φάσις
  choice: വിവരം ... ലഭിച്ചു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘വിവരം മുകളിലേക്കു ചെന്നു’ എന്നാണ്; കോട്ടയുടെ ഉയർന്ന സ്ഥാനത്തേക്കുള്ള ചലനത്തിന്റെ സൂചന അതിലുണ്ട്. എന്നാൽ മലയാളത്തിൽ ‘വിവരം അധിപന് ലഭിച്ചു’ എന്നത് സന്ദർഭം വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: സൈനികദളത്തിന്റെ അധിപന്
  rationale: χιλίαρχος ഒരു റോമൻ സൈനികാധികാരിയെയും σπεῖρα ഒരു cohort-നെയും സൂചിപ്പിക്കുന്നു. ‘സൈനികദളത്തിന്റെ അധിപൻ’ സാങ്കേതികമായ അന്യപദങ്ങൾ ഒഴിവാക്കി പദബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ചരിത്രവിശദീകരണം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: ὅτι ὅλη συγχύννεται Ἰερουσαλήμ
  choice: യെരൂശലേം മുഴുവൻ കലഹത്തിലായിരിക്കുന്നു
  rationale: നഗരത്തെയും അവിടത്തെ ജനങ്ങളെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന ‘യെരൂശലേം മുഴുവൻ’ എന്ന സംക്ഷിപ്ത രൂപം നിലനിർത്തുന്നു. συγχύννεται സൂചിപ്പിക്കുന്ന പൊതുകുഴപ്പവും പ്രക്ഷുബ്ധാവസ്ഥയും ‘കലഹത്തിലായിരിക്കുന്നു’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നെങ്കിലും ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘കൊല്ലാൻ’ എന്ന നേരിട്ടുള്ള പദവും ‘കലഹത്തിലായിരിക്കുന്നു’ എന്ന പൊതുഅശാന്തി സൂചിപ്പിക്കുന്ന പ്രയോഗവും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യവാക്യത്തിൽ നൽകിയിട്ടുണ്ട്.
