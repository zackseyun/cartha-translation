  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: ml
  text: അപ്പോൾ സൈനികാധിപൻ[a] അടുത്തുവന്ന് അവനെ പിടിച്ചെടുത്തു, അവനെ രണ്ടു ചങ്ങലകളാൽ[b] ബന്ധിക്കാൻ കൽപ്പിച്ചു; അവൻ ആരാണെന്നും എന്താണ് ചെയ്തതെന്നും ചോദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹസ്രാധിപൻ.’ ഗ്രീക്ക് χιλίαρχος ഒരു റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിൽ ‘ആയിരം പേരുടെ അധിപൻ.’
    reason: lexical_alternative
  - marker: b
    text: ‘രണ്ടു ചങ്ങലകൾ’ എന്നത് യെരൂശലേമിൽ പൗലോസ് ബന്ധിക്കപ്പെടുമെന്ന പ്രവൃത്തികൾ 21:11-ലെ പ്രവചനത്തെ അനുസ്മരിപ്പിച്ചേക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: ഒരു റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. പദവിയുടെ സൈനിക അധികാരം വ്യക്തമാക്കുന്നതിനൊപ്പം സാങ്കേതികമായ പദപ്രയോഗം ഒഴിവാക്കുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἐγγίσας
  choice: അടുത്തുവന്ന്
  rationale: മുഖ്യപ്രവൃത്തിക്കുമുമ്പുള്ള സമീപനത്തെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമവും ചലനവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπελάβετο αὐτοῦ
  choice: അവനെ പിടിച്ചു
  rationale: കസ്റ്റഡിയിലെടുക്കുന്ന സന്ദർഭത്തിലെ ശാരീരികമായി പിടിച്ചെടുക്കൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκέλευσε δεθῆναι
  choice: ബന്ധിക്കാൻ കല്പിച്ചു
  rationale: അധികാരപൂർവമായ കല്പനയും δεθῆναι എന്ന passive infinitive-ന്റെ ആശയവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἁλύσεσι δυσί
  choice: രണ്ടു ചങ്ങലകളാൽ
  rationale: ἅλυσις എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു; മുൻപ്രവചനവുമായുള്ള സാധ്യതയുള്ള പ്രതിധ്വനി മുഖ്യവാചകത്തിൽ വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐπυνθάνετο
  choice: ചോദിച്ചുകൊണ്ടിരുന്നു
  rationale: imperfect രൂപത്തിലുള്ള തുടർന്നുകൊണ്ടിരുന്ന അന്വേഷണത്തിന്റെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: τίς εἴη
  choice: അവൻ ആരാണെന്ന്
  rationale: ഭൂതകാല ക്രിയയെ തുടർന്നുള്ള പരോക്ഷചോദ്യത്തിലെ optative മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷചോദ്യമായി നൽകുന്നു.
- source_word: τί ἐστιν πεποιηκώς
  choice: എന്താണ് ചെയ്തതെന്ന്
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന periphrastic perfect-ന്റെ അർത്ഥം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
