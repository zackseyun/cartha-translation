  text: ἠκολούθει γὰρ τὸ πλῆθος τοῦ λαοῦ ⸀κράζοντες· Αἶρε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: ml
  text: കാരണം, ജനക്കൂട്ടം പിന്നാലെ വന്നുകൊണ്ട്, “അവനെ കൊണ്ടുപോകൂ!”[a] എന്ന് ആർത്തുവിളിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവനെ ഇല്ലാതാക്കൂ!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: പിന്നാലെ ചെന്നുകൊണ്ട് … ആയിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ സംഭവത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധകം നിലനിർത്തുന്നു.
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: ജനക്കൂട്ടം
  rationale: ജനങ്ങളുടെ വലിയ കൂട്ടം എന്ന അർഥം നിന്ദാസൂചന ചേർക്കാതെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: κράζοντες
  choice: ആർത്തുവിളിക്കുകയായിരുന്നു
  rationale: പിന്നാലെ ചെല്ലുന്നതിനോടൊപ്പം നടന്ന ശക്തമായ നിലവിളിയെ വ്യക്തമാക്കുന്നു; ബഹുവചന ആശയം മലയാളത്തിലെ കൂട്ടനാമത്തോട് സ്വാഭാവികമായി പൊരുത്തപ്പെടുത്തുന്നു.
- source_word: Αἶρε αὐτόν
  choice: അവനെ കൊണ്ടുപോകൂ!
  rationale: ഇവിടെ αἴρω ഒരാളെ അവിടെനിന്ന് നീക്കണമെന്ന ശത്രുതാപരമായ ആവശ്യം പ്രകടിപ്പിക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്ത വിധം വധാർഥം മാത്രം ഉറപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: Αἶρε αὐτόν എന്ന ആഹ്വാനത്തിന്റെ ശക്തി
  choice: അവനെ കൊണ്ടുപോകൂ!
  alternative: അവനെ ഇല്ലാതാക്കൂ!
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് നീക്കംചെയ്യുക എന്ന നേരാർഥവും ഇല്ലാതാക്കുക/കൊല്ലുക എന്ന ശക്തമായ സന്ദർഭാർഥവും ഉണ്ടാകാം. മുഖ്യപാഠം ആദ്യത്തേത് നിലനിർത്തുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ജനക്കൂട്ടത്തെ ‘കലാപക്കൂട്ടം’ എന്നു വിശേഷിപ്പിച്ച് ഗ്രീക്കിലില്ലാത്ത നിന്ദാസൂചന ചേർത്തിട്ടില്ല.
