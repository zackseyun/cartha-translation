translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പുറപ്പെട്ട് യാത്ര തുടർന്നു’ എന്ന പ്രയോഗം മൂലത്തിലെ രണ്ട് ചലനഘടകങ്ങളും നിലനിർത്തുന്നു. കുടുംബസന്ദർഭം വ്യക്തമാക്കാൻ ‘തങ്ങളുടെ’ ചേർത്തു; ഇത് ഗ്രീക്ക് വാക്യത്തിന്റെ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്ന ബന്ധം മാത്രമാണ് വ്യക്തമാക്കുന്നത്.
