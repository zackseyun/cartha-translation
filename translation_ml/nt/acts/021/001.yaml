revisions:
- from: അവരിൽനിന്ന് പിരിഞ്ഞുപോരേണ്ടിവന്ന് ഞങ്ങൾ കപ്പൽ പുറപ്പെട്ടശേഷം, നേരെ സഞ്ചരിച്ച് കോസിൽ എത്തി; പിറ്റേദിവസം റോഡോസിലും അവിടെനിന്ന് പത്തരയിലും എത്തി.
  to: അവരിൽനിന്ന് വിട്ടുപിരിഞ്ഞ് കടലിലേക്കു പുറപ്പെട്ടപ്പോൾ, ഞങ്ങൾ നേരെ സഞ്ചരിച്ച് കോസിലെത്തി; പിറ്റേന്ന് റോഡോസിലും, അവിടെനിന്ന് പത്തരയിലും എത്തി.
