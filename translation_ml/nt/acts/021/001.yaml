translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ആഖ്യാനശൈലി. വേർപാടിന്റെ വികാരതീവ്രത അമിതവ്യാഖ്യാനമില്ലാതെ സൂചിപ്പിച്ചിട്ടുണ്ട്; യാത്രാവിവരണം സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
