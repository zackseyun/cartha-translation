id: ACT.21.1
reference: Acts 21:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: ml
  text: അവരിൽനിന്ന് വിട്ടുപിരിഞ്ഞ് കടലിലേക്കു പുറപ്പെട്ടപ്പോൾ, ഞങ്ങൾ നേരെ സഞ്ചരിച്ച് കോസിലെത്തി; പിറ്റേന്ന് റോഡോസിലും, അവിടെനിന്ന് പത്തരയിലും എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: ശേഷം
  rationale: അടുത്ത സംഭവത്തെ കാലക്രമത്തിൽ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ആഖ്യാനശൈലി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന് പിരിഞ്ഞുപോരേണ്ടിവന്ന്
  rationale: വെറുമൊരു യാത്രപറച്ചിലിനേക്കാൾ ശക്തമായ ἀποσπάω എന്ന പദത്തിന്റെ, മനസ്സില്ലാതെ വേർപെടേണ്ടിവന്നതിന്റെ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀναχθῆναι
  choice: കപ്പൽ പുറപ്പെട്ടു
  rationale: നാവികസന്ദർഭത്തിൽ കടലിലേക്കു യാത്ര പുറപ്പെടുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: εὐθυδρομήσαντες
  choice: നേരെ സഞ്ചരിച്ച്
  rationale: കപ്പൽ നേരായ ഗതിയിൽ സഞ്ചരിച്ചതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Κῶ
  choice: കോസ്
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ ആധുനിക മലയാള ലിപ്യന്തരണം.
- source_word: τῇ δὲ ἑξῆς
  choice: പിറ്റേദിവസം
  rationale: ‘അടുത്ത ദിവസം’ എന്ന കാലസൂചനയ്ക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: Ῥόδον
  choice: റോഡോസ്
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: κἀκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: യാത്രയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള ബന്ധം കൃത്യമായി നൽകുന്നു.
- source_word: Πάταρα
  choice: പത്തര
  rationale: മലയാള ബൈബിൾപ്രയോഗത്തിൽ പരിചിതമായ സ്ഥലനാമരൂപം നിലനിർത്തുന്നു.
