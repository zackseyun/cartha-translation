id: ACT.21.14
reference: Acts 21:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: ml
  text: അവൻ വഴങ്ങാതിരുന്നതിനാൽ, ഞങ്ങൾ മിണ്ടാതെയായി[a]; “കർത്താവിന്റെ ഇഷ്ടം നിറവേറട്ടെ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ മൗനം പാലിച്ചു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: അവൻ സമ്മതിക്കാതിരുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ കാരണബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ പൗലോസ് അവരുടെ അഭ്യർഥനയ്ക്കു വഴങ്ങാതിരുന്നതാണ് സൂചന; ‘കേട്ടില്ല’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἡσυχάσαμεν
  choice: ഞങ്ങൾ മിണ്ടാതെയായി
  rationale: വിഷയം തുടർന്നു നിർബന്ധിക്കുന്നത് അവസാനിപ്പിച്ച് നിശ്ശബ്ദരായിത്തീർന്നതിനെ സൂചിപ്പിക്കുന്നു; എയോറിസ്റ്റിന്റെ ആരംഭഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰπόντες
  choice: എന്നു പറഞ്ഞു
  rationale: പ്രധാനക്രിയയോടു ചേർന്ന എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണിഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന് പതിവായും സന്ദർഭോചിതമായും ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു; ഗ്രീക്ക് വ്യക്തമാക്കാത്ത പരാമർശവിഷയത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: τὸ θέλημα
  choice: ഇഷ്ടം
  rationale: θέλημα ഇവിടെ കർത്താവ് ഉദ്ദേശിക്കുന്നതോ ആഗ്രഹിക്കുന്നതോ എന്ന അർഥത്തിലാണ്; മലയാളത്തിലെ പ്രാർഥനാസദൃശമായ ഈ പ്രയോഗത്തിൽ ‘ഇഷ്ടം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: γινέσθω
  choice: നിറവേറട്ടെ
  rationale: γίνομαι എന്ന ആജ്ഞാരൂപം കർത്താവിന്റെ ഇഷ്ടത്തിനു കീഴടങ്ങുന്ന ആശയം പ്രകടിപ്പിക്കുന്നു. ‘സംഭവിക്കട്ടെ’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ഈ സ്ഥിരപ്രയോഗം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: κύριος എന്നതിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: സന്ദർഭത്തിൽ ‘കർത്താവ്’ ഏറ്റവും സ്വാഭാവികമായ ദൈവശാസ്ത്രപരമായ സംബോധനയാണ്. ഇത് യേശുവിനെ സൂചിപ്പിക്കാനിടയുണ്ടെങ്കിലും ഗ്രീക്ക് വ്യക്തമാക്കുന്നതിലധികം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരിചിതമായ ബൈബിൾ പ്രയോഗഭംഗി നിലനിർത്തിക്കൊണ്ട് അതിപുരാതനമായ പദക്രമം ഒഴിവാക്കി.
