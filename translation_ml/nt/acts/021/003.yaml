translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സ്ഥലനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള ബൈബിൾരൂപങ്ങളായ ‘കുപ്രൊസ്’, ‘സുറിയ’, ‘സോർ’ എന്നിവയുടെ വിഭക്തിരൂപം ഉപയോഗിച്ചു. നാവികസാങ്കേതിക പദമായ ‘port’ ഒഴിവാക്കി ‘ഇടതുവശം’ എന്നു നേരിട്ട് പറഞ്ഞു.
