id: ACT.21.3
reference: Acts 21:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: ml
  text: കുപ്രൊസ് കാഴ്ചയിൽ വന്നശേഷം, അതിനെ ഞങ്ങളുടെ ഇടതുവശത്ത് വിട്ടുകൊണ്ട് ഞങ്ങൾ സുറിയയിലേക്കു കപ്പലോടിച്ചു; പിന്നെ സോരിൽ എത്തി[a]. അവിടെയായിരുന്നു കപ്പൽ ചരക്ക് ഇറക്കിക്കൊണ്ടിരുന്നത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘സോരിലേക്കു താഴേക്കു വന്നു’; ‘സോരിൽ എത്തിച്ചേർന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കപ്പലിൽനിന്ന് ചരക്ക് ഇറക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: കുപ്രൊസ് ദൃശ്യമായപ്പോൾ
  rationale: ദ്വീപ് യാത്രക്കാരുടെ കാഴ്ചയിൽ വന്നതിനെ സൂചിപ്പിക്കുന്ന നാവികയാത്രാസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; aorist participle-ന്റെ മുൻകാലബന്ധം ‘-പ്പോൾ’ എന്ന പ്രയോഗത്തിൽ വ്യക്തമാകുന്നു.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: അതിനെ ഞങ്ങളുടെ ഇടതുവശത്ത് വിട്ടുകൊണ്ട്
  rationale: εὐώνυμον എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഇടതുവശം’ നിലനിർത്തുകയും ദ്വീപ് കപ്പലിന്റെ ഇടതുവശത്തായിരുന്നുവെന്ന യാത്രാദിശ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: ഞങ്ങൾ സുറിയയിലേക്കു കപ്പലോടിച്ചു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന കടൽയാത്രയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κατήλθομεν εἰς Τύρον
  choice: സോരിൽ എത്തി
  rationale: κατέρχομαι-യുടെ അക്ഷരാർഥം ‘താഴേക്കു വന്നു’ എന്നാണെങ്കിലും, ഇവിടെ തുറമുഖത്ത് എത്തിച്ചേരുക എന്ന യാത്രാസന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκεῖσε
  choice: അവിടെ
  rationale: സോരിനെ തിരിച്ചുസൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളസമാനപദം.
- source_word: ἀποφορτιζόμενον
  choice: ചരക്ക് ഇറക്കിക്കൊണ്ടിരുന്നത്
  rationale: മധ്യ/കർമണി രൂപത്തിന്റെ സാധ്യത സംരക്ഷിക്കേണ്ടതിനാൽ കപ്പൽ ചരക്ക് ഇറക്കുന്ന പ്രവർത്തനം നടന്നുകൊണ്ടിരുന്നു എന്ന സ്വാഭാവിക രൂപം തിരഞ്ഞെടുത്തു; കർമണി വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τὸν γόμον
  choice: ചരക്ക്
  rationale: γόμος എന്ന കപ്പലിലെ freight/cargo-യ്ക്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളപദം.
