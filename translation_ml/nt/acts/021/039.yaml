id: ACT.21.39
reference: Acts 21:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് പറഞ്ഞു: “ഞാൻ കിലിക്യയിലെ തർസൊസ് സ്വദേശിയായ ഒരു യഹൂദനാണ്—ഒട്ടും അപ്രശസ്തമല്ലാത്ത ഒരു നഗരത്തിലെ പൗരൻ. ജനത്തോടു സംസാരിക്കാൻ എനിക്ക് അനുവാദം തരണമെന്നു ഞാൻ അങ്ങയോടു അപേക്ഷിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: ഞാൻ ... ഒരു യഹൂദനാണ്
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ സ്വത്വപ്രസ്താവനയായി വിവർത്തനം ചെയ്തു. ἄνθρωπος എന്നത് പ്രത്യേകം ‘മനുഷ്യൻ/പുരുഷൻ’ എന്നു ചേർക്കുന്നത് ഇവിടെ അനാവശ്യവും അസ്വാഭാവികവും ആകും; μέν നൽകുന്ന ഊന്നൽ വാക്യഘടനയിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: കിലിക്യയിലെ തർസൊസ് സ്വദേശി
  rationale: Ταρσεύς സൂചിപ്പിക്കുന്ന തർസൊസുമായുള്ള സ്വദേശബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള πολίτης എന്ന പൗരത്വപദവുമായി ഇതിനെ ലയിപ്പിക്കുന്നില്ല.
- source_word: οὐκ ἀσήμου πόλεως
  choice: ഒട്ടും അപ്രശസ്തമല്ലാത്ത ഒരു നഗരത്തിലെ
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക ഊന്നലായ litotes നിലനിർത്തുന്നു; ‘പ്രശസ്തമായ’ എന്ന ലളിത അനുകൂലപ്രയോഗത്തിലേക്ക് അതിനെ ചുരുക്കുന്നില്ല.
- source_word: πολίτης
  choice: പൗരൻ
  rationale: നഗരത്തോടുള്ള ഔപചാരിക പൗരബന്ധം വ്യക്തമാക്കുന്നു; വെറും താമസക്കാരൻ എന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: δέομαι δέ σου
  choice: ഞാൻ അങ്ങയോടു അപേക്ഷിക്കുന്നു
  rationale: അധികാരിയോടുള്ള ആദരപൂർവവും ഗൗരവമുള്ളതുമായ അഭ്യർഥന പ്രകടമാക്കുന്നു; അതിരുകടന്ന യാചനാഭാവം ഒഴിവാക്കുന്നു.
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: സംസാരിക്കാൻ എനിക്ക് അനുവാദം തരണമെന്നു
  rationale: അനുമതി ചോദിക്കുന്ന ആശയവും പൊതുപ്രസംഗത്തിന്റെ ഔപചാരിക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρὸς τὸν λαόν
  choice: ജനത്തോടു
  rationale: λαός എന്നതിന്റെ സമൂഹപരമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭാനുസൃതമായ ‘ജനക്കൂട്ടത്തോട്’ എന്ന സാധ്യതയിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: Ἰουδαῖος എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: യഹൂദൻ
  alternative: യെഹൂദ്യൻ
  rationale: പൗലോസ് തന്റെ വംശീയ-മതപരമായ സ്വത്വം വ്യക്തമാക്കുകയും ഭൂമിശാസ്ത്രപരമായ സ്വദേശമായി കിലിക്യയിലെ തർസൊസ് വേർതിരിച്ചു പറയുകയും ചെയ്യുന്നു. അതിനാൽ ‘യെഹൂദ്യൻ’ എന്ന പ്രാദേശിക അർഥത്തേക്കാൾ ‘യഹൂദൻ’ യോജിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. സൈനികാധികാരിയോടുള്ള ആദരസൂചനയായി ‘അങ്ങയോടു’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നഗരപരിചയത്തിന്റെ ക്രമവും ‘അപ്രശസ്തമല്ലാത്ത’ എന്ന litotes-ഉം കഴിയുന്നത്ര നിലനിർത്തി.
