source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: ml
  text: “അങ്ങനെയെങ്കിൽ, ഏതാനും ദിവസം മുമ്പ് കലാപമുണ്ടാക്കുകയും കൊലയാളികളായ ആ നാലായിരം പുരുഷന്മാരെ മരുഭൂമിയിലേക്കു നയിക്കുകയും ചെയ്ത ആ ഈജിപ്തുകാരൻ നീയല്ലേ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കഠാരധാരികളായവർ”; ഗ്രീക്കിൽ “സിക്കാരിയർ”—ഒളിപ്പിച്ച കഠാര ഉപയോഗിച്ചുള്ള ആക്രമണങ്ങൾക്ക് പേരുകേട്ട ഒരു സംഘം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: അങ്ങനെയെങ്കിൽ ... നീയല്ല, അല്ലേ?
  rationale: പൗലോസ് ഗ്രീക്കിൽ സംസാരിച്ചതിൽനിന്ന് സൈനികാധിപൻ എത്തിച്ചേരുന്ന നിഗമനം ചോദ്യംരൂപത്തിൽ അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്. സ്വാഭാവിക മലയാളത്തിൽ നിഗമനസ്വഭാവവും നിഷേധചോദ്യവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ὁ Αἰγύπτιος
  choice: ആ ഈജിപ്തുകാരൻ
  rationale: നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ, സംസാരിക്കുന്നവന് അറിയാവുന്ന കുപ്രസിദ്ധ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആ’ എന്നത് ഈ നിർദ്ദിഷ്ടത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: ഏതാനും ദിവസം മുമ്പ്
  rationale: സമീപകാലത്ത്, ഇപ്പോഴത്തെ ദിവസങ്ങൾക്ക് അൽപ്പം മുമ്പ് എന്ന കാലസൂചനയെ അമിതമായി കൃത്യമാക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀναστατώσας
  choice: കലാപം ഇളക്കിവിടുകയും
  rationale: രാഷ്ട്രീയ-ചരിത്ര പശ്ചാത്തലത്തിൽ വെറും ആശയക്കുഴപ്പമല്ല, ജനകീയ പ്രക്ഷോഭമോ കലാപമോ ഉണർത്തുക എന്ന അർഥമാണ് പ്രസക്തം.
- source_word: ἐξαγαγὼν
  choice: നയിക്കുകയും ചെയ്ത
  rationale: ഒരു നേതാവ് അനുയായികളെ ഒരു സ്ഥലത്തുനിന്ന് പുറത്തേക്ക് കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്ന കൃത്യവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: εἰς τὴν ἔρημον
  choice: മരുഭൂമിയിലേക്കു
  rationale: ἔρημος ജനവാസമില്ലാത്ത വരണ്ട പ്രദേശത്തെയും മരുഭൂമിയെയും സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ ‘മരുഭൂമി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഭൂമിശാസ്ത്രപരമായി യോജിച്ചതുമാണ്.
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: ആ നാലായിരം പേരെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ സംഖ്യ ഒരു നിർദ്ദിഷ്ട സംഘത്തെ സൂചിപ്പിക്കുന്നു. ‘ആ’ നിർദ്ദിഷ്ടത നിലനിർത്തുന്നു; ഇവിടെ ἄνδρας എന്നതിന് സംഘത്തിലെ പുരുഷന്മാരെ ഉദ്ദേശിക്കുന്ന ‘പേർ’ സ്വാഭാവികമാണ്.
- source_word: τῶν σικαρίων
  choice: കൊലയാളികളായ
  rationale: ഒളിപ്പിച്ച കഠാര ഉപയോഗിച്ചുള്ള വധങ്ങൾക്ക് പേരുകേട്ട സിക്കാരിയരെ ആധുനിക വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; ചരിത്രപരമായ പേരും കൂടുതൽ പദാനുപദമായ അർഥവും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
