translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സൈനികാധിപന്റെ അതിശയവും നിഗമനസ്വഭാവമുള്ള നിഷേധചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു. ചരിത്രസംഘത്തിന്റെ അപരിചിതമായ ഗ്രീക്ക് പേര് മുഖ്യവാക്യത്തെ ഭാരപ്പെടുത്താതെ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
