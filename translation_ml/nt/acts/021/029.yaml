source:
  edition: SBLGNT
  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: ml
  text: എന്തെന്നാൽ, എഫെസൊസുകാരനായ ത്രൊഫിമൊസിനെ പൗലോസിനോടൊപ്പം നഗരത്തിൽ അവർ നേരത്തേ കണ്ടിരുന്നു; പൗലോസ് അവനെ ദേവാലയത്തിലേക്ക്[a] കൊണ്ടുവന്നുവെന്ന് അവർ കരുതി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദേവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: നേരത്തേ കണ്ടിരുന്നു
  rationale: ഈ പരിഭാഷ ഗ്രീക്കിലെ പരിഭാഷാത്മക ഭൂതപൂർവകാലപ്രയോഗം സൂചിപ്പിക്കുന്ന മുൻകാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: എഫെസൊസുകാരനായ ത്രൊഫിമൊസിനെ
  rationale: അനുബന്ധമായി വരുന്ന Ἐφέσιον ത്രൊഫിമൊസിന്റെ സ്വദേശം തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിലെ വിശേഷണഘടന ഗ്രീക്ക് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τῇ πόλει
  choice: നഗരത്തിൽ
  rationale: πόλις ഇവിടെ ദേവാലയപരിസരത്തിൽനിന്നു വേർതിരിച്ചുള്ള യെരൂശലേം നഗരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: σὺν αὐτῷ
  choice: പൗലോസിനോടൊപ്പം
  rationale: ഗ്രീക്കിൽ സർവനാമമാണ് ഉപയോഗിച്ചിരിക്കുന്നതെങ്കിലും സന്ദർഭത്തിൽ അതിന്റെ സൂചിതവ്യക്തി പൗലോസാണ്; മലയാളത്തിൽ അനിശ്ചിതത്വവും തെറ്റായ ബന്ധവും ഒഴിവാക്കാൻ പേര് ആവർത്തിച്ചു.
- source_word: ἐνόμιζον
  choice: അവർ കരുതി
  rationale: കണ്ടതിൽനിന്ന് അവർ എത്തിച്ചേർന്ന നിഗമനമാണിത്, ഉറപ്പായ അറിവല്ല; ‘കരുതി’ ആ അനുമാനസ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ ἱερὸν
  choice: ദേവാലയത്തിലേക്ക്
  rationale: ἱερόν ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പരിസരങ്ങളെയോ സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിനായി മുഖ്യവാക്യത്തിൽ പൊതുവായ പദം ഉപയോഗിച്ച് അതിന്റെ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: εἰσήγαγεν
  choice: കൊണ്ടുവന്നു
  rationale: ആരെയെങ്കിലും ഒരു സ്ഥലത്തിനുള്ളിലേക്കു പ്രവേശിപ്പിക്കുന്ന പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘കരുതി’ എന്നതിനോടുള്ള മുൻകാലബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: പൗലോസിനെതിരായ ആരോപണത്തിൽ ἱερόν എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യവാക്യത്തിൽ ‘ദേവാലയം’ എന്നു നൽകി, ദേവാലയസമുച്ചയമോ പരിസരങ്ങളോ എന്ന വിശാലാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ദേവാലയവളപ്പ്; ദേവാലയപരിസരം
  rationale: ἱερόν എന്നത് ναός എന്നപോലെ അകത്തെ വിശുദ്ധമന്ദിരം മാത്രം നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല. ചരിത്രപരമായ ആരോപണത്തിന്റെ കൃത്യത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ഭാഷ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. γάρ എന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ കൊണ്ടും, അനുമാനത്തിന്റെ സ്വഭാവം ‘കരുതി’ കൊണ്ടും നിലനിർത്തി.
