id: ACT.21.34
reference: Acts 21:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: ml
  text: ജനക്കൂട്ടത്തിൽ ചിലർ ഒന്നും മറ്റു ചിലർ മറ്റൊന്നും വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു. ബഹളം കാരണം നിജസ്ഥിതി[a] മനസ്സിലാക്കാൻ അയാൾക്കു കഴിയാതിരുന്നതിനാൽ, അവനെ സൈനികത്താവളത്തിലേക്കു[b] കൊണ്ടുപോകാൻ അയാൾ ഉത്തരവിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സംഭവത്തിന്റെ സത്യം” അല്ലെങ്കിൽ “ഉറപ്പുള്ള വിവരം.”
    reason: lexical_alternative
  - marker: b
    text: “സൈനികത്താവളം” എന്നു പറയുന്നത് റോമൻ സൈനികരുടെ താമസ-കാവൽകേന്ദ്രത്തെയാണ്; ഇത് ക്ഷേത്രപ്രദേശത്തോടു ചേർന്ന കോട്ടസമുച്ചയത്തിനുള്ളിലായിരുന്നിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: ജനക്കൂട്ടത്തിൽ ചിലർ ഒന്നും മറ്റു ചിലർ മറ്റൊന്നും വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ἄλλοι…ἄλλο τι എന്ന വിതരണാത്മക വൈരുധ്യവും ἐπεφώνουν എന്ന അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ഉച്ചത്തിലുള്ള വിളിച്ചുപറച്ചിലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: അയാൾക്കു മനസ്സിലാക്കാൻ കഴിയാതിരുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന കാരണസാഹചര്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; γνῶναι ഇവിടെ വെറും അറിവിനേക്കാൾ സംഭവത്തിന്റെ യഥാർഥ വിവരം കണ്ടെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸ ἀσφαλές
  choice: നിജസ്ഥിതി
  rationale: ഉറപ്പുള്ളതോ വിശ്വസനീയമായതോ ആയ വിവരം എന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τὸν θόρυβον
  choice: ബഹളം കാരണം
  rationale: θόρυβος വെറും ശബ്ദമല്ല, കലുഷിതമായ പൊതുബഹളമാണെന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτόν
  choice: അവനെ കൊണ്ടുപോകാൻ അയാൾ ഉത്തരവിട്ടു
  rationale: നിഷ്ക്രിയ ഇൻഫിനിറ്റീവിന്റെ ശ്രദ്ധ ഉത്തരവിലും കൊണ്ടുപോകപ്പെടുന്ന വ്യക്തിയിലും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ പറയാത്ത നിർവാഹകരെ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν παρεμβολήν
  choice: സൈനികത്താവളത്തിലേക്ക്
  rationale: ഈ സന്ദർഭത്തിൽ ക്ഷേത്രപ്രദേശത്തോടു ചേർന്നിരുന്ന റോമൻ സൈനികകേന്ദ്രത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാളയം’ താൽക്കാലിക ക്യാമ്പെന്ന ധാരണ നൽകാനിടയുള്ളതിനാൽ ‘സൈനികത്താവളം’ തിരഞ്ഞെടുത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രംഗത്തിലെ തുടർച്ചയായ വിളിച്ചുപറച്ചിൽ ‘വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചു. ഗ്രീക്ക് വാചകത്തിലെ സർവനാമങ്ങൾ അനാവശ്യമായി വ്യക്തിനാമങ്ങളാക്കി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
