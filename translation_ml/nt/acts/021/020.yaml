id: ACT.21.20
reference: Acts 21:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: ml
  text: 'അവർ ഇതു കേട്ടപ്പോൾ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി. പിന്നെ അവർ അവനോടു പറഞ്ഞു: “സഹോദരാ, യെഹൂദന്മാരിൽ[b] വിശ്വസിച്ചവർ എത്ര പതിനായിരങ്ങളുണ്ടെന്ന്[a] നീ കാണുന്നുവല്ലോ. അവരെല്ലാവരും ന്യായപ്രമാണത്തോടു തീക്ഷ്ണതയുള്ളവരാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എത്രയോ ആയിരങ്ങൾ.” ഗ്രീക്കിലെ μυριάδες എന്ന പദം പതിനായിരങ്ങളുടെ ഘടകങ്ങളെയോ പൊതുവായി അതിവലിയ ഒരു സംഖ്യയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യെഹൂദ്യക്കാരിൽ,” ഇതിനെ വംശീയ-മതപരമായതിനു പകരം ഭൂമിശാസ്ത്രപരമായി എടുക്കുന്നുവെങ്കിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന മുൻവിവരണം ‘ഇതു’ എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുകയും aorist participle-ന്റെ കാലബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐδόξαζον τὸν θεόν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി
  rationale: ദൈവത്തിനു മഹത്ത്വം നൽകുക എന്ന δοξάζωയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: Θεωρεῖς, ἀδελφέ
  choice: സഹോദരാ, ... നീ കാണുന്നുവല്ലോ
  rationale: പൗലോസിന്റെ ശ്രദ്ധ വ്യക്തമായ സാഹചര്യത്തിലേക്കു തിരിക്കുന്ന വർത്തമാനകാല പ്രയോഗവും ഏകവചന സംബോധനയും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: πόσαι μυριάδες
  choice: എത്ര ആയിരങ്ങൾ
  rationale: μυριάδες കൃത്യമായി പതിനായിരങ്ങളുടെ ഘടകങ്ങളെയോ പൊതുവായി അതിവലിയ സംഖ്യയെയോ സൂചിപ്പിക്കാം; ‘ആയിരങ്ങൾ’ അനാവശ്യമായ കൃത്യത ചുമത്താതെ വലിയ സംഖ്യ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: യെഹൂദന്മാരിൽ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ യെഹൂദ്യനിവാസികളേക്കാൾ വംശീയ-മതസമൂഹമായ യെഹൂദന്മാരെയാണ് സന്ദർഭം മുൻനിർത്തുന്നത്.
- source_word: τῶν πεπιστευκότων
  choice: വിശ്വസിച്ചവർ
  rationale: വിശ്വാസത്തിലേക്കു വന്നതും ആ നില തുടരുന്നതുമായ ആളുകളെ സൂചിപ്പിക്കുന്ന perfect participle-ന്റെ ക്രിയാത്മക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: ന്യായപ്രമാണത്തിനുവേണ്ടി തീക്ഷ്ണതയുള്ളവരാണ്
  rationale: ζηλωταίയുടെ ശക്തമായ പ്രതിബദ്ധതയും ὑπάρχουσιν എന്ന copular ക്രിയയുടെ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἐν τοῖς Ἰουδαίοις എന്നതിന്റെ സൂചന
  choice: യെഹൂദന്മാരിൽ
  alternative: യെഹൂദ്യക്കാരിൽ
  rationale: മോശെയുടെ ന്യായപ്രമാണത്തോടുള്ള വിശ്വാസികളുടെ തീക്ഷ്ണതയാണ് സന്ദർഭം ചർച്ച ചെയ്യുന്നത്; അതിനാൽ ഭൂമിശാസ്ത്രത്തേക്കാൾ വംശീയ-മതപരമായ തിരിച്ചറിയൽ മുൻപന്തിയിലാണ്.
- issue: μυριάδες എന്നതിന്റെ സംഖ്യാബലം
  choice: ആയിരങ്ങൾ
  alternative: പതിനായിരങ്ങൾ
  rationale: ഈ ഗ്രീക്ക് പദത്തിന് കൃത്യമായ ‘പതിനായിരങ്ങൾ’ എന്ന അർഥവും പൊതുവായ അതിവലിയ സംഖ്യ എന്ന അർഥവും സാധ്യമാണ്. മുഖ്യപാഠം അനിശ്ചിതത്വം അമിതമായി തീർപ്പാക്കാതെ നൽകുന്നു; കൂടുതൽ കൃത്യമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: τοῦ νόμου എന്നതിന്റെ പരാമർശം
  choice: ന്യായപ്രമാണം
  alternative: തോറാ / മോശെയുടെ ന്യായപ്രമാണം
  rationale: സന്ദർഭത്തിൽ മോശെയുടെ ന്യായപ്രമാണമാണ് ഉദ്ദേശിക്കുന്നത്; ‘ന്യായപ്രമാണം’ പരിചിതവും മാന്യവുമായ മലയാള പദമാണ്, എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത ‘മോശെയുടെ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സഭാപരമായി പരിചിതമായ ‘യെഹൂദന്മാർ,’ ‘മഹത്ത്വപ്പെടുത്തി,’ ‘ന്യായപ്രമാണം’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും ഏതെങ്കിലും പ്രത്യേക സഭാവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചുമത്തിയിട്ടില്ല. ഗ്രീക്കിലെ ദീർഘമായ ഏകവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി.
