- from: 'അവർ ഇതു കേട്ടപ്പോൾ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി. പിന്നെ അവർ അവനോടു പറഞ്ഞു: “സഹോദരാ, യെഹൂദന്മാരിൽ വിശ്വസിച്ചവർ എത്ര ആയിരങ്ങളുണ്ടെന്നു നീ കാണുന്നുവല്ലോ[a]. അവരെല്ലാവരും ന്യായപ്രമാണത്തിനുവേണ്ടി തീക്ഷ്ണതയുള്ളവരാണ്.”'
  to: 'അവർ ഇതു കേട്ടപ്പോൾ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി. പിന്നെ അവർ അവനോടു പറഞ്ഞു: “സഹോദരാ, യെഹൂദന്മാരിൽ[b] വിശ്വസിച്ചവർ എത്ര പതിനായിരങ്ങളുണ്ടെന്ന്[a] നീ കാണുന്നുവല്ലോ. അവരെല്ലാവരും ന്യായപ്രമാണത്തോടു തീക്ഷ്ണതയുള്ളവരാണ്.”'
  rationale: μυριάδες-ന്റെ സംഖ്യാബലം മുഖ്യപാഠത്തിൽ പുനഃസ്ഥാപിച്ചു; അതിന്റെ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി. സംഖ്യാ-അടിക്കുറിപ്പിന്റെ ആങ്കർ അനുബന്ധ പദത്തിലേക്കു മാറ്റി. Ἰουδαίοις-ന്റെ ‘യെഹൂദ്യക്കാർ’ എന്ന ബദൽ അർഥവും ഇംഗ്ലീഷ് audit trail-നൊത്തു ഒരു അടിക്കുറിപ്പായി ചേർത്തു. കൂടാതെ, ζηλωταὶ τοῦ νόμου-ന്റെ നേരിട്ടുള്ള ബന്ധം വ്യക്തമാക്കാൻ ‘ന്യായപ്രമാണത്തോടു തീക്ഷ്ണതയുള്ളവർ’ എന്നു ക്രമീകരിച്ചു.
