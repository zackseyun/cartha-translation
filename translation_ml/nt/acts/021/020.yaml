  source_fidelity: മുഖ്യപാഠത്തിലെ ‘എത്ര ആയിരങ്ങൾ’ എന്നത് μυριάδες-ന്റെ സാധാരണമായ ‘പതിനായിരങ്ങൾ’ എന്ന സംഖ്യാബലത്തെ കുറച്ചുകാണിക്കുന്നു. ‘പതിനായിരങ്ങൾ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുകയും പൊതുവായ വലിയ സംഖ്യ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നതാണ് ഗ്രീക്കിനോടു കൂടുതൽ വിശ്വസ്തം. ἐν τοῖς Ἰουδαίοις-ന്റെ ‘യെഹൂദന്മാരിൽ’ എന്ന വിവർത്തനം യോജിച്ചതാണ്; ‘യെഹൂദ്യക്കാരിൽ’ എന്ന ഭൂമിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തണം.
  naturalness: പരിഷ്കരിച്ച പാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘ന്യായപ്രമാണത്തോടു തീക്ഷ്ണതയുള്ളവർ’ എന്ന പ്രയോഗം ζηλωταὶ τοῦ νόμου എന്നതിന്റെ ബന്ധം ‘ന്യായപ്രമാണത്തിനുവേണ്ടി’ എന്നതിനെക്കാൾ നേരിട്ട് പ്രകടമാക്കുന്നു.
  terminology: ‘ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി,’ ‘സഹോദരാ,’ ‘യെഹൂദന്മാർ,’ ‘ന്യായപ്രമാണം’ എന്നിവ സ്ഥിരതയുള്ളതും സന്ദർഭോചിതവുമായ പദങ്ങളാണ്. ‘വിശ്വസിച്ചവർ’ perfect participle-ന്റെ ഫലം നിലനിൽക്കുന്ന ആശയം സന്ദർഭത്തിൽ മതിയായ രീതിയിൽ നൽകുന്നു.
