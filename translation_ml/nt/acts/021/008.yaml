id: ACT.21.8
reference: Acts 21:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: ml
  text: പിറ്റേന്ന് ഞങ്ങൾ കൈസര്യയിൽ എത്തി. സുവിശേഷകനായ ഫിലിപ്പിന്റെ വീട്ടിൽ പ്രവേശിച്ച്, ഏഴുപേരിൽ ഒരാളായിരുന്ന അദ്ദേഹത്തോടുകൂടെ[a] ഞങ്ങൾ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, മുമ്പ് യെരൂശലേമിലെ ശുശ്രൂഷയ്ക്കായി നിയോഗിക്കപ്പെട്ട ഏഴുപേരിൽ ഒരാൾ (അപ്പൊസ്തലപ്രവൃത്തികൾ 6:3–6 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: കാലക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ ഇവിടെ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἐξελθόντες
  choice: അവിടെനിന്നു പുറപ്പെട്ട്
  rationale: മുൻ സ്ഥലത്തുനിന്നുള്ള യാത്രതിരിക്കൽ വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിൽ സ്ഥലം ആവർത്തിച്ചിട്ടില്ലെങ്കിലും മലയാളത്തിൽ ‘അവിടെനിന്നു’ ചേർക്കുന്നത് അർത്ഥം മാറ്റാതെ ചലനത്തിന്റെ ഉറവിടം സ്വാഭാവികമാക്കുന്നു.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: കൈസര്യയിൽ എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ യാത്രാവിവരണത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: വീട്ടിൽ ചെന്നു
  rationale: ‘വീട്ടിൽ പ്രവേശിച്ച്’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തേക്കാൾ സ്വാഭാവികമായി പ്രവർത്തനക്രമം നിലനിർത്തുന്നു.
- source_word: Φιλίππου
  choice: ഫിലിപ്പിന്റെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സാധാരണ ലിപ്യന്തരണം.
- source_word: τοῦ εὐαγγελιστοῦ
  choice: സുവിശേഷകനായ
  rationale: εὐαγγελιστής എന്ന ശുശ്രൂഷാവിവരണത്തിന്റെ സ്ഥാപിതവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: ഏഴുപേരിൽ ഒരാളായിരുന്ന
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 6-ലെ ഏഴുപേരോടുള്ള ചരിത്രപരമായ സൂചന നിലനിർത്തുന്നു; പ്രത്യേക സഭാപദവി പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: അദ്ദേഹത്തോടൊപ്പം ഞങ്ങൾ താമസിച്ചു
  rationale: അതിഥിസൽക്കാരത്തിന്റെയും യാത്രയുടെയും പശ്ചാത്തലത്തിൽ μένωയും παράയും ചേർന്നുള്ള അർത്ഥം ആദരസൂചകവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഫിലിപ്പിനെ ‘ഏഴുപേരിൽ ഒരാൾ’ എന്നു തിരിച്ചറിയിക്കൽ
  choice: ‘ഏഴുപേരിൽ ഒരാളായിരുന്ന’ എന്ന ചരിത്രപരമായ വിശേഷണം നിലനിർത്തി.
  alternative: ‘ഏഴ് ശുശ്രൂഷകരിൽ ഒരാൾ’ അല്ലെങ്കിൽ പ്രത്യേക സഭാപദവിയോടുകൂടിയ രൂപം.
  rationale: ഈ വാക്യം അപ്പൊസ്തലപ്രവൃത്തികൾ 6:3–6-ലേക്കു സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ആ ഏഴുപേരുടെ സ്ഥാനത്തെ പ്രത്യേകമായ പിൽക്കാല സഭാപദവിയായി നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പ്രവർത്തനക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ ദീർഘമായ കൃതന്തശൃംഖല ഒഴിവാക്കാൻ വാക്യം രണ്ടായി ക്രമപ്പെടുത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘ഏഴുപേർ’ എന്ന പരാമർശമുള്ള വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
