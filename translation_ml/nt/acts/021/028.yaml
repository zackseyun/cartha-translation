  choice: നിലവിളിച്ചുകൊണ്ട് പറഞ്ഞു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ആരോപണം ഉച്ചത്തിലും അടിയന്തരമായും വിളിച്ചുപറഞ്ഞ രീതിയെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിനായി സംസാരക്രിയ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ഇസ്രായേൽപുരുഷന്മാരേ
  rationale: പുരുഷന്മാരെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഗ്രീക്ക് സംബോധനയുടെ ലിംഗസൂചനയും അടിയന്തരഭാവവും നിലനിർത്തുന്നു.
- source_word: βοηθεῖτε
  choice: സഹായിക്കൂ!
  rationale: കർതൃവാചക ബഹുവചന ആജ്ഞയുടെ ചുരുക്കവും ശക്തവുമായ അഭ്യർഥന; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഞങ്ങളെ’ ചേർത്തിട്ടില്ല.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: ജനത്തിനും ന്യായപ്രമാണത്തിനും ഈ സ്ഥലത്തിനും എതിരായി
  rationale: κατά + ഷഷ്ഠി സൂചിപ്പിക്കുന്ന എതിർപ്പിനെ നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ νόμος മോശെയുടെ ന്യായപ്രമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πάντας πανταχῇ διδάσκων
  choice: എല്ലാവരെയും എല്ലായിടത്തും പഠിപ്പിക്കുന്ന
  rationale: πάντας, πανταχῇ എന്നീ സമഗ്രപദങ്ങളുടെ ആവർത്തിത ഊന്നൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἔτι τε καὶ
  choice: അതുമാത്രമല്ല
  rationale: മുമ്പത്തെ ആരോപണത്തോടു കൂടുതൽ ഗുരുതരമായ മറ്റൊരു കുറ്റം കൂട്ടിച്ചേർക്കുന്ന വാഗ്‌ബലം നൽകുന്നു.
- source_word: Ἕλληνας
  choice: ഗ്രീക്കുകാരെ
  rationale: വിശാലമായ ‘ജാതികൾ’ എന്നതിനു പകരം മൂലത്തിലെ നിർദിഷ്ട ജനവിഭാഗനാമം നിലനിർത്തുന്നു.
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: ദേവാലയത്തിലേക്കു കൊണ്ടുവന്ന്
  rationale: ἱερόν ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ വായനാസൗകര്യമുള്ള ‘ദേവാലയം’ ഉപയോഗിച്ച് കൃത്യമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κεκοίνωκεν
  choice: അശുദ്ധമാക്കിയിരിക്കുന്നു
  rationale: ആരാധനാപരമായ ശുദ്ധി-അശുദ്ധി സന്ദർഭത്തിൽ κοινόω എന്നതിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ നിലവിലുള്ള ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: ഈ വിശുദ്ധസ്ഥലത്തെ
  rationale: വിശുദ്ധതയും ‘ഈ’ എന്ന നിർദ്ദേശക ഊന്നലും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ νόμου എന്നതിന്റെ സൂചന
  choice: ന്യായപ്രമാണം
  alternative: നിയമം
  rationale: യെരൂശലേം ദേവാലയസന്ദർഭത്തിൽ ഇത് പൊതുവായ നിയമത്തേക്കാൾ മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ന്യായപ്രമാണം’ ആ സൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- issue: ἱερόν എന്നതിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘ദേവാലയം’, അടിക്കുറിപ്പിൽ ദേവാലയസമുച്ചയം/പ്രാകാരങ്ങൾ എന്ന വിശദീകരണം
  alternative: മുഖ്യപാഠത്തിൽ ‘ദേവാലയപ്രാകാരങ്ങൾ’
  rationale: വായനാസൗകര്യം നിലനിർത്തിക്കൊണ്ട് ἱερόν എന്നത് അകത്തെ ശ്രീകോവിലിനെയല്ല, വിശാലമായ ദേവാലയപരിസരത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ചരിത്രപരവും പദാർഥപരവുമായ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- issue: പൗലൊസ് സ്ഥലം അശുദ്ധമാക്കിയെന്ന ആരോപണം
  choice: ആരോപകരുടെ അവകാശവാദമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി
  alternative: ആരോപണം അസത്യമാണെന്ന സൂചന മുഖ്യപാഠത്തിൽ ചേർക്കുക
  rationale: വാക്യം ജനക്കൂട്ടത്തിന്റെ ആരോപണം രേഖപ്പെടുത്തുന്നു; അതിന്റെ സത്യാസത്യത്തെ പരിഭാഷകൻ ഇവിടെ തീർപ്പാക്കാതെ കഥയിലെ സംഘർഷം നിലനിർത്തണം.
