base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: ml
  text: 'നിലവിളിച്ച് അവർ പറഞ്ഞു: “ഇസ്രായേല്യരായ പുരുഷന്മാരേ, സഹായിക്കൂ! ജനത്തിനും ന്യായപ്രമാണത്തിനും ഈ സ്ഥലത്തിനും എതിരായി എല്ലാവരെയും എല്ലായിടത്തും പഠിപ്പിക്കുന്ന മനുഷ്യൻ ഇവനാണ്. അതുമാത്രമല്ല, ഇവൻ ഗ്രീക്കുകാരെ ദേവാലയത്തിലേക്കു[a] കൊണ്ടുവന്ന് ഈ വിശുദ്ധസ്ഥലത്തെ അശുദ്ധമാക്കിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദമായ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയോ അതിന്റെ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
