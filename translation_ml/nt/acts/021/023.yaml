id: ACT.21.23
reference: Acts 21:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: ml
  text: 'അതുകൊണ്ട്, ഞങ്ങൾ നിന്നോടു പറയുന്നതു ചെയ്യുക: സ്വന്തമായി ഒരു നേർച്ചയുള്ള നാലു പുരുഷന്മാർ ഞങ്ങൾക്കുണ്ട്[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു നേർച്ച എടുത്തിട്ടുള്ള.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഒരു നേർച്ചയുള്ള” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: വിശാലമായ സന്ദർഭം നാസീർവ്രതസദൃശമായ ഒരു നേർച്ചയെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ഈ വാക്യം പറയുന്നത് “ഒരു നേർച്ച” എന്നു മാത്രമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: അതുകൊണ്ട്
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനാത്മക ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; τοῦτο എന്നതിന്റെ ആശയം തുടർന്നുള്ള ‘ഞങ്ങൾ പറയുന്നതുപോലെ ചെയ്യുക’ എന്ന കല്പനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ποίησον ὅ σοι λέγομεν
  choice: ഞങ്ങൾ പറയുന്നതുപോലെ ചെയ്യുക
  rationale: കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവവും ബന്ധവാക്യത്തിന്റെ അർഥവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰσὶν ἡμῖν
  choice: ഞങ്ങളുടെ കൂട്ടത്തിലുണ്ട്
  rationale: ദാതിവോടുകൂടിയ അസ്തിത്വപ്രയോഗം ഇവിടെ വെറും ഉടമസ്ഥതയെക്കാൾ ‘ഞങ്ങളോടൊപ്പമുള്ളവർ/ഞങ്ങളുടെ ഇടയിലുള്ളവർ’ എന്ന ആശയം നൽകാൻ സാധ്യതയുള്ളതിനാൽ, സന്ദർഭോചിതവും സ്വാഭാവികവുമായ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: ἄνδρες τέσσαρες
  choice: നാലുപേർ
  rationale: സന്ദർഭത്തിൽ പ്രായപൂർത്തിയായ പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആളുകളെ എണ്ണുന്നതിനുള്ള സ്വാഭാവിക രൂപമായ ‘നാലുപേർ’ ഉപയോഗിച്ചു.
- source_word: εὐχὴν ἔχοντες
  choice: ഒരു നേർച്ചയുള്ള
  rationale: ‘ഒരു നേർച്ച ഉണ്ടായിരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തുടർച്ചയായ അവസ്ഥ നിലനിർത്തുന്നു; നേർച്ചയുടെ പ്രത്യേക തരം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἀφ’ ἑαυτῶν
  choice: സ്വന്തമായി
  rationale: നേർച്ച അവർക്കുതന്നെയുള്ളതാണെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘തങ്ങളുടെമേൽ’ എന്ന അക്ഷരാർഥരൂപത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: നേർച്ചയുടെ സ്വഭാവം
  choice: മുഖ്യപാഠത്തിൽ പൊതുവായി ‘ഒരു നേർച്ച’ എന്നു മാത്രം നൽകുക.
  alternative: ‘നാസീർവ്രതം’ അല്ലെങ്കിൽ ‘നാസീർ നേർച്ച’ എന്നു വ്യക്തമാക്കുക.
  rationale: വിശാലമായ സന്ദർഭം നാസീർവ്രതസദൃശമായ ഒരു നേർച്ചയെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ഈ വാക്യത്തിലെ εὐχή എന്ന പദം നേർച്ചയുടെ പ്രത്യേക തരം വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നേർച്ച’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദമാണ്; മൂലപാഠം വ്യക്തമാക്കാത്ത സാങ്കേതിക മതപരമായ നിർവചനം ഒഴിവാക്കി.
