id: ACT.21.10
reference: Acts 21:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιμενόντων ⸀δὲ ἡμέρας πλείους κατῆλθέν τις ἀπὸ τῆς Ἰουδαίας προφήτης ὀνόματι Ἅγαβος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/010.yaml
  text: While we were staying there for several days, a prophet named Agabus came down from Judea.
translation:
  language: ml
  text: ഞങ്ങൾ അവിടെ കുറെ ദിവസം താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, അഗബൊസ് എന്നു പേരുള്ള ഒരു പ്രവാചകൻ യെഹൂദ്യയിൽനിന്ന് ഇറങ്ങിവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: ഞങ്ങൾ അവിടെ … താമസിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയിൽ കാലസംബന്ധമായ അർഥം നൽകുന്നു. സന്ദർഭത്തിലെ യാത്രാവിവരണത്തിലെ ‘ഞങ്ങൾ’ എന്ന സംഘത്തെയാണ് കർത്താവായി വ്യക്തമാക്കുന്നത്; തുടർന്നുള്ള താമസവും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: …കൊണ്ടിരിക്കുമ്പോൾ
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലസംബന്ധമായ ആശയത്തോടൊപ്പം മലയാളത്തിലെ ‘കൊണ്ടിരിക്കുമ്പോൾ’ എന്ന ബന്ധകപ്രയോഗത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἡμέρας πλείους
  choice: കുറെ ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം. πλείους അക്ഷരാർഥത്തിൽ ‘കൂടുതൽ’ എന്നാണെങ്കിലും, ഇവിടെ മുമ്പത്തെ താമസത്തിനു പുറമേ ഏതാനും ദിവസങ്ങൾ എന്ന സന്ദർഭാർഥം ‘കുറെ ദിവസം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατῆλθέν
  choice: ഇറങ്ങിവന്നു
  rationale: κατέρχομαι എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തുന്നു; യെഹൂദ്യയിൽനിന്ന് തീരപ്രദേശത്തേക്കുള്ള യാത്രയും ആഖ്യാതാവിന്റെ സ്ഥാനവീക്ഷണവും ‘ഇറങ്ങിവന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: τις
  choice: ഒരു
  rationale: പുതിയ കഥാപാത്രത്തെ അനിശ്ചിതമായി പരിചയപ്പെടുത്തുന്ന സർവനാമം മലയാളത്തിൽ ‘ഒരു പ്രവാചകൻ’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽനിന്ന്
  rationale: ഉത്ഭവസ്ഥലം നേരിട്ട് സൂചിപ്പിക്കുന്നു; Ἰουδαίαയ്ക്ക് മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ ഭൂമിശാസ്ത്രനാമമായ ‘യെഹൂദ്യ’ ഉപയോഗിച്ചു.
- source_word: προφήτης
  choice: ഒരു പ്രവാചകൻ
  rationale: അംഗീകൃതമായ പ്രവാചകപങ്കിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: ὀνόματι Ἅγαβος
  choice: അഗബൊസ് എന്നു പേരുള്ള
  rationale: ὀνόματι എന്ന ദത്തിവിഭക്തി പ്രയോഗത്തിന്റെ ‘പേരുള്ള/എന്നു വിളിക്കപ്പെടുന്ന’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്ക് പേരിന്റെ രൂപം ‘അഗബൊസ്’ ആയി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ കാലബന്ധവും യാത്രയുടെ ദിശാസൂചനയും നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യ പദപ്രയോഗങ്ങൾ ചേർത്തിട്ടില്ല.
