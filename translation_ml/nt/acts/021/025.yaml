id: ACT.21.25
reference: Acts 21:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: ml
  text: എന്നാൽ വിശ്വസിച്ച വിജാതീയരെ സംബന്ധിച്ചാകട്ടെ, വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ചവയിൽനിന്നും രക്തത്തിൽനിന്നും ശ്വാസംമുട്ടിച്ചു കൊന്നവയിൽനിന്നും[b] ലൈംഗിക അധാർമികതയിൽനിന്നും അവർ തങ്ങളെത്തന്നെ കാത്തുകൊള്ളണമെന്ന്[c] തീരുമാനിച്ച് ഞങ്ങൾ സന്ദേശം അയച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ അയച്ചു.’ ഗ്രീക്ക് ക്രിയയിൽ അയച്ചതെന്തെന്ന കർമം വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭം അപ്പൊസ്തലപ്രവൃത്തികൾ 15-ൽ അയച്ച കത്തിനെയോ തീരുമാനത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, രക്തം വാർന്നുപോകാതെ ശ്വാസംമുട്ടിച്ചു കൊന്ന മൃഗത്തിൽനിന്നുള്ള ഭക്ഷണം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘അവർ വർജിക്കണമെന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ
  choice: എന്നാൽ ... സംബന്ധിച്ചാകട്ടെ
  rationale: περὶ എന്നതിന്റെ വിഷയാവതരണവും δέ സൂചിപ്പിക്കുന്ന നേരിയ മാറ്റമോ വൈരുധ്യമോ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: വിശ്വസിച്ച വിജാതീയർ
  rationale: ἐθνῶν ഇവിടെ യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; πεπιστευκότων അവർ വിശ്വാസത്തിലേക്കു വന്നവരാണെന്ന ആശയം നൽകുന്നു. ‘വിജാതീയർ’ സഭാപരമായ സന്ദർഭത്തിൽ കൃത്യവും സംക്ഷിപ്തവുമാണ്.
- source_word: ἡμεῖς ἀπεστείλαμεν
  choice: ഞങ്ങൾ സന്ദേശം അയച്ചു
  rationale: ഊന്നലുള്ള ἡμεῖς ‘ഞങ്ങൾ’ എന്നു നിലനിർത്തുന്നു. ഗ്രീക്കിൽ അയച്ചതിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ, സന്ദർഭോചിതമായ ‘സന്ദേശം’ ഉപയോഗിക്കുകയും അതു കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κρίναντες
  choice: തീരുമാനിച്ച്
  rationale: ഔപചാരികമായി ആലോചിച്ചു കൈക്കൊണ്ട തീരുമാനത്തെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: അവർ തങ്ങളെത്തന്നെ കാത്തുകൊള്ളണമെന്ന്
  rationale: മധ്യപ്രയോഗത്തിലെ സ്വയം സൂക്ഷിക്കുക എന്ന ഭാവം നിലനിർത്തുന്നു; ‘വർജിക്കണം’ എന്നത് സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
- source_word: τό τε εἰδωλόθυτον
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ചവ
  rationale: വിഗ്രഹബലിയുമായി ബന്ധപ്പെട്ട ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന പദത്തെ ‘മാംസം’ എന്നു അനാവശ്യമായി ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: αἷμα
  choice: രക്തം
  rationale: മൂലപാഠത്തിലെ സംക്ഷിപ്തവും നേരിട്ടുള്ളതുമായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു.
- source_word: πνικτόν
  choice: ശ്വാസംമുട്ടിച്ചു കൊന്നവ
  rationale: രക്തം വാർന്നുപോകാതെ ശ്വാസംമുട്ടിച്ചു കൊന്ന മൃഗത്തിൽനിന്നുള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: πορνείαν
  choice: ലൈംഗിക അധാർമികത
  rationale: പദം സൂചിപ്പിക്കുന്ന നിയമവിരുദ്ധമായ ലൈംഗിക പെരുമാറ്റങ്ങളുടെ വിശാല പരിധി നിലനിർത്തുന്നു; അതിനെ വിവാഹപൂർവ ലൈംഗികബന്ധത്തിൽ മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: അപ്പൊസ്തലിക തീരുമാനത്തിലെ വിലക്കുകളുടെ സ്വഭാവവും കാലാവധിയും
  choice: നാലു വിലക്കുകളും മൂലപാഠത്തിലുള്ളതുപോലെ നേരിട്ട് അവതരിപ്പിച്ചു; അവയുടെ കാലാവധിയോ ദൈവശാസ്ത്രപരമായ അടിസ്ഥാനമോ നിർവചിച്ചില്ല.
  alternative: ഭക്ഷണവുമായി ബന്ധപ്പെട്ട വിലക്കുകൾ താൽക്കാലികമായ സഹവാസക്രമമെന്നോ, എല്ലാക്കാലത്തേക്കുമുള്ള സാർവത്രിക നിയമമെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം മുൻപ് എടുത്ത തീരുമാനത്തിന്റെ ഉള്ളടക്കം ആവർത്തിക്കുന്നതേയുള്ളൂ; അതിന്റെ പൂർണമായ ലക്ഷ്യമോ പ്രാബല്യകാലമോ ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം ഏതെങ്കിലും സമുദായവിശേഷ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം ഉപയോഗിച്ചു. ‘വിജാതീയർ’ എന്നത് ഈ ചരിത്ര-സഭാപര സന്ദർഭത്തിലെ ἔθνη എന്ന പദത്തിന്റെ പരിചിതമായ കൃത്യരൂപമാണ്. പട്ടികയുടെ സമാന്തരഘടന വ്യക്തമാക്കാൻ ഓരോ ഇനത്തോടും ‘-യിൽനിന്നും’ ചേർത്തു.
