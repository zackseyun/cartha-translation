  source_fidelity: മൂലഗ്രീക്കിലെ വിഷയാന്തരം (περὶ δέ), വിശ്വസിച്ച വിജാതീയർ, ‘ഞങ്ങൾ’ എന്ന ഊന്നൽ, മുമ്പേ എടുത്ത തീരുമാനം, നാല് ഇനങ്ങളുള്ള വിലക്കുപട്ടിക എന്നിവ വിശ്വസ്തമായി കൈമാറിയിരിക്കുന്നു. ‘സന്ദേശം അയച്ചു’ എന്നത് ἀπεστείλαμεν-ന്റെ അവ്യക്തമായ കർമം സന്ദർഭാനുസൃതമായി നൽകുന്നു; കുറിപ്പ് അതിന്റെ പരിധി വ്യക്തമാക്കുന്നു.
  naturalness: വാക്യഘടന ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘അവർ തങ്ങളെത്തന്നെ കാത്തുകൊള്ളണമെന്ന്’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും വ്യക്തവും മൂലത്തിലെ reflexive/middle ഭാവത്തോട് ചേർന്നുനിൽക്കുന്നതുമാണ്. പട്ടികയിലെ സമാന്തരമായ ‘-യിൽനിന്നും’ ഘടന വായനാസൗകര്യം നൽകുന്നു.
