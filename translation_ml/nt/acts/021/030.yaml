translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ചെറുവാക്യഘടന സംഭവത്തിന്റെ പെട്ടെന്നുള്ള നീക്കവും ജനക്കൂട്ടത്തിന്റെ ബലപ്രയോഗവും നിലനിർത്തുന്നു.
