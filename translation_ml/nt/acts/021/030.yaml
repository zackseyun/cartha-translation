  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: ml
  text: നഗരം മുഴുവൻ ഇളകിമറിഞ്ഞു; ജനങ്ങൾ ഓടിക്കൂടി.[a] അവർ പൗലോസിനെ പിടിച്ച് ദൈവാലയവളപ്പിനു പുറത്തേക്ക് വലിച്ചിഴച്ചുകൊണ്ടിരുന്നു;[b] ഉടൻതന്നെ കവാടങ്ങൾ അടയ്ക്കപ്പെട്ടു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനക്കൂട്ടം ഒന്നിച്ചോടിയെത്തി.’ ഗ്രീക്ക് പദപ്രയോഗം ആളുകൾ പെട്ടെന്ന് ഒരിടത്തേക്ക് ഒഴുകിക്കൂടിയതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി അല്ല, ദൈവാലയസമുച്ചയത്തെയോ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘വാതിലുകൾ അടയ്ക്കപ്പെട്ടു.’ ഈ ദൈവാലയസന്ദർഭത്തിൽ പദം പ്രവേശനകവാടങ്ങളെയോ വാതിലുകളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη τε ἡ πόλις ὅλη
  choice: നഗരം മുഴുവൻ ഇളകിമറിഞ്ഞു
  rationale: κινέωയുടെ കർമ്മണിപ്രയോഗം ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ചലനമല്ല, നഗരമാകെ പടർന്ന കലക്കമാണ് സൂചിപ്പിക്കുന്നത്. ‘ഇളകിമറിഞ്ഞു’ ആ കൂട്ടായ പ്രക്ഷുബ്ധത സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: ജനങ്ങൾ ഓടിക്കൂടി
  rationale: συνδρομή പെട്ടെന്നുള്ള ഒത്തുചേരൽ അഥവാ ഒന്നിച്ചുള്ള ഓട്ടത്തെ സൂചിപ്പിക്കുന്നു. ക്രിയാരൂപത്തിലുള്ള ഈ പരിഭാഷ മലയാളത്തിൽ സ്വാഭാവികവും സംഭവത്തിന്റെ വേഗം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: അവർ പൗലോസിനെ പിടിച്ച്
  rationale: ἐπιλαμβάνομαι ഇവിടെ ഒരാളെ ബലമായി പിടികൂടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പിടിച്ച്’ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: εἷλκον αὐτὸν
  choice: അവനെ വലിച്ചിഴച്ചു
  rationale: εἷλκον അപൂർണ്ണ ഭൂതകാലരൂപമായതിനാൽ നടന്നുകൊണ്ടിരുന്ന ബലപ്രയോഗം സൂചിപ്പിക്കുന്നു. ‘വലിച്ചിഴച്ചു’ ആ ദൈർഘ്യവും ബലവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: ദൈവാലയവളപ്പിനു പുറത്തേക്ക്
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദൈവാലയ സമുച്ചയത്തെയോ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ദൈവാലയവളപ്പ്’ സ്ഥലപരമായ അർഥം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: εὐθέως
  choice: ഉടൻതന്നെ
  rationale: സംഭവം വൈകാതെ നടന്നുവെന്ന അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: കവാടങ്ങൾ അടയ്ക്കപ്പെട്ടു
  rationale: θύραι എന്നത് വാതിലുകൾ എന്നും പറയാമെങ്കിലും ദൈവാലയസമുച്ചയത്തിന്റെ പ്രവേശനസ്ഥാനങ്ങൾ എന്ന സന്ദർഭത്തിൽ ‘കവാടങ്ങൾ’ കൂടുതൽ സ്വാഭാവികമാണ്; കർമ്മണിരൂപവും സംരക്ഷിക്കുന്നു.
