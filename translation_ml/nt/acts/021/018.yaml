id: ACT.21.18
reference: Acts 21:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ δὲ ἐπιούσῃ εἰσῄει ὁ Παῦλος σὺν ἡμῖν πρὸς Ἰάκωβον, πάντες τε παρεγένοντο οἱ πρεσβύτεροι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: ml
  text: അടുത്ത ദിവസം[a] പൗലോസ് ഞങ്ങളോടൊപ്പം യാക്കോബിന്റെ അടുക്കൽ ചെന്നു; എല്ലാ മൂപ്പന്മാരും സന്നിഹിതരായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തുടർന്നുള്ള ദിവസം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എല്ലാ മൂപ്പന്മാരും വന്നു’ അല്ലെങ്കിൽ ‘എല്ലാ മൂപ്പന്മാരും എത്തിയിരുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് വരവിനെയോ സന്നിഹിതാവസ്ഥയെയോ ഊന്നിക്കാട്ടാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: അടുത്ത ദിവസം
  rationale: ഈ ദത്തിവ് പ്രയോഗം ‘അടുത്ത/തുടർന്നുള്ള ദിവസം’ എന്ന കാലസൂചന നൽകുന്നു. ‘അടുത്ത ദിവസം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: εἰσῄει
  choice: ചെന്നു
  rationale: ക്രിയ അകത്തേക്കുള്ള പ്രവേശനമോ ഒരാളുടെ അടുക്കലേക്കുള്ള ചെല്ലലോ സൂചിപ്പിക്കുന്നു. യാക്കോബിനെ സന്ദർശിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘അടുക്കൽ ചെന്നു’ മലയാളത്തിൽ സ്വാഭാവികമായി ദിശാഭാവം നൽകുന്നു.
- source_word: σὺν ἡμῖν
  choice: ഞങ്ങളോടൊപ്പം
  rationale: σύν + ദത്തിവ് സഹഗമനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘ഞങ്ങളോടൊപ്പം’ അതിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: πρὸς Ἰάκωβον
  choice: യാക്കോബിന്റെ അടുക്കൽ
  rationale: πρός + ആക്കൂസറ്റീവ് ഒരു വ്യക്തിയിലേക്കുള്ള ചലനമാണ് സൂചിപ്പിക്കുന്നത്. ‘യാക്കോബിന്റെ അടുക്കൽ’ സന്ദർശനസ്ഥലത്തെക്കുറിച്ചുള്ള അധികവിവരം ചേർക്കാതെ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: πάντες τε
  choice: മൂപ്പന്മാരെല്ലാവരും
  rationale: τέ ഇവിടെ ലഘുവായ ബന്ധകശക്തിയുള്ളതാണ്. മലയാളത്തിലെ വാക്യബന്ധവും ‘-എല്ലാവരും’ എന്ന പ്രയോഗവും കൂട്ടായ സമ്പൂർണത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: παρεγένοντο
  choice: അവിടെ എത്തിയിരുന്നു
  rationale: παραγίνομαι എന്നതിന് ‘എത്തി’ എന്നും ‘സന്നിഹിതരായി’ എന്നും അർഥമാകാം. ‘എത്തിയിരുന്നു’ വരവിനെയും അതിന്റെ ഫലമായ സാന്നിധ്യത്തെയും ഉൾക്കൊള്ളുന്നു; ഗ്രീക്കിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: യെരൂശലേം സഭയിലെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്ന പദമാണിത്. ‘മൂപ്പന്മാർ’ പദത്തിന്റെ അർഥം നിലനിർത്തുകയും പിൽക്കാല സഭാഭരണസംവിധാനങ്ങളുടെ പ്രത്യേക സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Ἰάκωβον എന്ന വ്യക്തിയുടെ തിരിച്ചറിയലും സ്ഥാനവും
  choice: വിശദീകരണമൊന്നും ചേർക്കാതെ ‘യാക്കോബ്’ എന്ന വ്യക്തിനാമം മാത്രം ഉപയോഗിച്ചു.
  alternative: ‘കർത്താവിന്റെ സഹോദരനായ യാക്കോബ്’ അല്ലെങ്കിൽ ‘യെരൂശലേം സഭയുടെ നേതാവായ യാക്കോബ്’
  rationale: ഈ വാക്യം യാക്കോബിനെ കൂടുതൽ തിരിച്ചറിയിക്കുന്നില്ല. സന്ദർഭത്തിൽ അദ്ദേഹം ആരാണെന്ന് വ്യക്തമാകാമെങ്കിലും, മുഖ്യപാഠത്തിൽ വിശദീകരണം ചേർക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത വിവരം ഇറക്കുമതി ചെയ്യുന്നതാകും.
- issue: οἱ πρεσβύτεροι എന്നതിന്റെ സഭാപരമായ അർഥം
  choice: ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ ഭരണക്രമം സൂചിപ്പിക്കാതെ ‘മൂപ്പന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രസ്ബിറ്റർമാർ’ അല്ലെങ്കിൽ ‘സഭാനേതാക്കൾ’
  rationale: ഈ പദം യെരൂശലേം സഭയിലെ അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്നു; ‘മൂപ്പന്മാർ’ എന്നത് പദസംബന്ധിയായ അർഥവും ദൈവശാസ്ത്രപരമായ നിഷ്പക്ഷതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘യാക്കോബിന്റെ അടുക്കൽ’, ‘മൂപ്പന്മാർ’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും മൂലപാഠത്തിന്റെ ദിശാഭാവവും സഭാപരമായ നിഷ്പക്ഷതയും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
