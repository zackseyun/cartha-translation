  to: അടുത്ത ദിവസം[a] പൗലോസ് ഞങ്ങളോടൊപ്പം യാക്കോബിന്റെ അടുക്കൽ ചെന്നു; എല്ലാ മൂപ്പന്മാരും സന്നിഹിതരായിരുന്നു.[b]
  rationale: The revision retains the straightforward modern Malayalam rendering of the time phrase, Paul’s accompaniment by ‘us,’ and his movement to James. It renders παραγίνομαι in its contextual ‘were present’ sense without adding a location or implying a prior completed arrival, while preserving the arrival sense in the footnote.
