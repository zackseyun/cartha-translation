id: ACT.21.17
reference: Acts 21:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: ml
  text: ഞങ്ങൾ യെരൂശലേമിൽ എത്തിയപ്പോൾ സഹോദരന്മാർ[a] ഞങ്ങളെ സന്തോഷത്തോടെ സ്വീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാർ.’ ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്; ഈ പദത്തിന് സഹവിശ്വാസികളെ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν
  choice: ഞങ്ങൾ ... എത്തിയപ്പോൾ
  rationale: ഈ genitive absolute പ്രയോഗം എത്തിച്ചേർന്ന സമയസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അതിനെ ‘ഞങ്ങൾ ... എത്തിയപ്പോൾ’ എന്നു നൽകുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിൽ
  rationale: εἰς ഇവിടെ ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; ‘എത്തിയപ്പോൾ’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ സ്ഥലനിർദ്ദേശകമായ ‘യെരൂശലേമിൽ’ സ്വാഭാവികവും അർഥകൃത്യവുമാണ്.
- source_word: ἀσμένως
  choice: സന്തോഷത്തോടെ
  rationale: ഈ ക്രിയാവിശേഷണം സന്തോഷപൂർവമായോ ആഗ്രഹപൂർവമായോ ഉള്ള സ്വീകരണത്തെ സൂചിപ്പിക്കുന്നു. ‘സന്തോഷത്തോടെ’ അതിന്റെ ഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀπεδέξαντο
  choice: സ്വീകരിച്ചു
  rationale: ഇവിടെ ആളുകളെ സൗഹൃദപൂർവം വരവേൽക്കുന്നതാണ് അർഥം. മലയാളത്തിൽ ‘സ്വീകരിച്ചു’ ഈ സന്ദർഭത്തിന് യോജിച്ച സാധാരണ പ്രയോഗമാണ്.
- source_word: οἱ ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ബഹുവചനമായ ἀδελφοί ആണ്. മൂലരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തെ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിലെ ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ἀδελφοί എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ പുരുഷലിംഗ ബഹുവചനരൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ ആദിമ ക്രൈസ്തവ പ്രയോഗത്തിൽ ഈ പദം സ്ത്രീകളുൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാം; ആ സാധ്യത വിവർത്തനത്തിൽ നിശ്ശബ്ദമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. വാക്യക്രമം സ്വാഭാവികമാക്കി; മൂലപാഠത്തിലെ സമയബന്ധവും സന്തോഷപൂർവമായ സ്വീകരണവും ലിംഗസൂചനയുള്ള പദരൂപവും സംരക്ഷിച്ചു.
