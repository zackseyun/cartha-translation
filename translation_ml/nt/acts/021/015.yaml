  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കയറിപ്പോയി’ എന്നത് യെരൂശലേമിലേക്കുള്ള ഉയർച്ചയുടെ ദിശാഭാവം സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് participle-ന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
