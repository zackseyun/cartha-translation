source:
  edition: SBLGNT
  text: Μετὰ δὲ τὰς ἡμέρας ταύτας ἐπισκευασάμενοι ἀνεβαίνομεν εἰς ⸀Ἱεροσόλυμα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/015.yaml
  text: After these days[a], having packed up, we went up to Jerusalem.
translation:
  language: ml
  text: ഈ ദിവസങ്ങൾക്കുശേഷം, ഞങ്ങൾ യാത്രയ്ക്കുള്ള ഒരുക്കങ്ങൾ നടത്തി[a] യെരൂശലേമിലേക്കു കയറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാധനങ്ങൾ കെട്ടിയൊരുക്കി” അല്ലെങ്കിൽ “തയ്യാറായി.” ഗ്രീക്ക് പദം യാത്രയ്ക്കായി പൊതുവായി ഒരുങ്ങുന്നതിനെയാകാം സൂചിപ്പിക്കുന്നത്; യാത്രാസാധനങ്ങൾ കെട്ടിയൊരുക്കുന്നതിനെ മാത്രം ആവണമെന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: ആ ദിവസങ്ങൾക്കുശേഷം
  rationale: μετά എന്ന പദം accusative-നോടൊപ്പം ഇവിടെ കാലക്രമത്തിൽ ‘ശേഷം’ എന്ന അർഥം നൽകുന്നു. ταύτας അടുത്തിടെ പറഞ്ഞ ദിവസങ്ങളിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ ദിവസങ്ങൾക്കുശേഷം’ സ്വാഭാവികമാണ്.
- source_word: ἐπισκευασάμενοι
  choice: യാത്രയ്ക്കുള്ള ഒരുക്കങ്ങൾ നടത്തി
  rationale: ഈ participle യാത്രയ്ക്കായി ഒരുങ്ങുക, സാധനങ്ങൾ ഒരുക്കുക, പൊതുവായി തയ്യാറാകുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളാം. ‘യാത്രയ്ക്കുള്ള ഒരുക്കങ്ങൾ നടത്തി’ എന്നത് സന്ദർഭം വ്യക്തമാക്കുകയും സാധനങ്ങൾ കെട്ടിയൊരുക്കുക എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνεβαίνομεν
  choice: ഞങ്ങൾ ... കയറിപ്പോയി
  rationale: imperfect രൂപം ഭൂതകാല യാത്രാവിവരണത്തിന്റെ ഭാഗമായി വരുന്നു. യെരൂശലേമിലേക്കുള്ള യാത്രയെ ‘കയറിപ്പോകുക’ എന്നു പറയുന്നത് ദിശാപരവും പരമ്പരാഗതവുമായ ഉയർച്ചയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്ക്
  rationale: εἰς നഗരത്തിലേക്കുള്ള ഗതി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യെരൂശലേമിലേക്ക്’ സ്വാഭാവികമായ പ്രയോഗമാണ്.
