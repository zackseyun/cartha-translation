id: ACT.4.27
reference: Acts 4:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: ml
  text: കാരണം, അങ്ങ് അഭിഷേകം ചെയ്ത അങ്ങയുടെ വിശുദ്ധ ദാസനായ[a] യേശുവിനെതിരെ ഹെരോദാവും പൊന്തിയൊസ് പീലാത്തോസും വിജാതീയരും[b] ഇസ്രായേൽ ജനതയും ഈ നഗരത്തിൽ സത്യമായും ഒന്നിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങയുടെ വിശുദ്ധ കുഞ്ഞായ യേശു.” ഗ്രീക്ക് παῖς എന്ന പദത്തിന് “ദാസൻ” എന്നും “കുഞ്ഞ്” എന്നും അർഥമാകാം. ഇവിടെ യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള ഭാഷയുടെ സാധ്യതയുള്ള പ്രതിധ്വനി കാരണം “ദാസൻ” എന്നത് സ്വീകരിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ജനതകൾ.” ഗ്രീക്കിലെ ἔθνη എന്ന പദത്തിന് “വിജാതീയർ” എന്നും “ജനതകൾ/രാജ്യങ്ങൾ” എന്നും അർഥമാകാം; ഇവിടെ ഇസ്രായേലുമായുള്ള വ്യത്യാസം കാരണം “വിജാതീയർ” എന്നത് സ്വീകരിച്ചിരിക്കുന്നു. തുടർന്ന് ഗ്രീക്കിൽ “ഇസ്രായേലിന്റെ ജനങ്ങൾ” എന്ന പ്രയോഗം ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: ഒന്നിച്ചുകൂടി
  rationale: പൂർത്തിയായ ഒരു കൂട്ടംചേരലിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കർമണിപ്രയോഗമാണെങ്കിലും, മലയാളത്തിൽ ‘ഒന്നിച്ചുകൂടി’ എന്ന സ്വാഭാവിക രൂപം കൂട്ടായ വിരോധപ്രവർത്തനത്തിന്റെ അർഥം അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ തിരുവെഴുത്ത് ഉദ്ധരണിയും ഇപ്പോഴത്തെ വിശദീകരണവും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ ἀληθείας
  choice: വാസ്തവമായും
  rationale: ‘സത്യമായും/യഥാർഥത്തിൽ’ എന്ന ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: ഈ നഗരത്തിൽ
  rationale: സന്ദർഭത്തിൽ യെരൂശലേമിനെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചകം; നഗരത്തിന്റെ പേര് വിവർത്തനത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സൂചന നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸν
  choice: യേശുവിനെതിരെ
  rationale: വിരോധത്തോടെ കൂട്ടംചേരുന്ന സന്ദർഭത്തിൽ ἐπί + accusative-ന്റെ പ്രതികൂല ദിശ വ്യക്തമാക്കുന്നു.
- source_word: ἅγιον
  choice: വിശുദ്ധ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവൻ എന്ന ആശയവും വിശുദ്ധി എന്ന സാധാരണ അർഥവും നിലനിർത്തുന്നു.
- source_word: παῖδά σου
  choice: അങ്ങയുടെ ... ദാസനായ
  rationale: παῖς എന്നതിന് ‘ദാസൻ’ എന്നും ‘കുഞ്ഞ്/മകൻ’ എന്നും അർഥമുണ്ടാകാം. പ്രവൃത്തികൾ 3–4 അധ്യായങ്ങളിലെ യെശയ്യാവിന്റെ ദാസപ്രതിധ്വനി കാരണം ‘ദാസൻ’ സന്ദർഭോചിതമാണ്; യേശുവിന്റെ പുത്രത്വം ഇവിടെ പദത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: ὃν ἔχρισας
  choice: അങ്ങ് അഭിഷേകം ചെയ്ത
  rationale: χρίω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും മശീഹാസംബന്ധമായ ധ്വനിയും ഒരുപോലെ സൂക്ഷിക്കുന്നു.
- source_word: Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος
  choice: ഹെരോദാവും പൊന്തിയൊസ് പീലാത്തോസും
  rationale: വ്യക്തിനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ച് τε καὶ എന്ന സമന്വയം ‘-ഉം ... -ഉം’ വഴി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔθνεσιν
  choice: വിജാതീയരും
  rationale: ഇസ്രായേൽ ജനസമൂഹങ്ങളോടുള്ള വിരുദ്ധസമാന്തര്യം കണക്കിലെടുത്ത്, ഇവിടെ രാഷ്ട്രീയ ‘രാജ്യങ്ങൾ’ എന്നതിലുപരി യഹൂദേതര ജനങ്ങളെ ഉദ്ദേശിക്കുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: λαοῖς Ἰσραήλ
  choice: ഇസ്രായേൽ ജനസമൂഹങ്ങളും
  rationale: λαοῖς എന്ന ബഹുവചനം പൂർണമായി ഏകവചനമാക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ വിവിധ ഇസ്രായേൽ ജനക്കൂട്ടങ്ങളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള παῖς എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ദാസൻ
  alternative: കുഞ്ഞ് / മകൻ
  rationale: യെശയ്യാവിലെ ദാസഭാഷയുമായുള്ള സാധ്യതയുള്ള ബന്ധവും പ്രവൃത്തികളിലെ സമീപപ്രയോഗങ്ങളും ‘ദാസൻ’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ പദത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; ‘പുത്രൻ’ എന്നു വിവർത്തനം ചെയ്ത് ഈ വാക്യത്തിൽ ഇല്ലാത്ത വ്യക്തത ചേർക്കുന്നില്ല.
- issue: ἔθνεσιν എന്ന പദവും ഇസ്രായേലുമായുള്ള വ്യത്യാസവും
  choice: വിജാതീയർ
  alternative: ജനതകൾ / രാജ്യങ്ങൾ
  rationale: ‘ഇസ്രായേൽ ജനസമൂഹങ്ങൾ’ എന്ന തുടർപ്രയോഗത്തോടൊപ്പം ഇത് യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. അതേസമയം ‘ജനതകൾ’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രാർഥനാസന്ദർഭത്തിന് യോജിച്ചതുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ സ്വീകരിച്ചു. വാക്യത്തിന്റെ ഗ്രീക്ക് ഘടന പൂർണമായി അനുകരിക്കാതെ മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി ഘടകങ്ങൾ ക്രമപ്പെടുത്തി; എന്നാൽ കാരണം, സ്ഥലം, വിരോധലക്ഷ്യം, പങ്കാളികൾ, അഭിഷേകം എന്നിവയെല്ലാം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് ചേർത്തിരിക്കുന്നത്.
