  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: ml
  text: അടുത്ത ദിവസം അവരുടെ ഭരണാധികാരികളും മൂപ്പന്മാരും ശാസ്ത്രിമാരും യെരൂശലേമിൽ ഒത്തുകൂടി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരുമിച്ചുകൂട്ടപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ രൂപത്തിൽ കർമണിപ്രയോഗമാണ്.
