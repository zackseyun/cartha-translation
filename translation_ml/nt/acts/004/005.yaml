lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: സംഭവസൂത്രം പ്രത്യേകമായി പദാനുപദമായി ചേർക്കാതെ വാക്യത്തിന്റെ സംഭവവിവരണത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി
  rationale: ἐγένετο δὲ കഥയെ മുന്നോട്ടു നയിക്കുന്ന സൂത്രപ്രയോഗമാണ്. മലയാളത്തിൽ ‘അങ്ങനെ സംഭവിച്ചു’ എന്നു വേർതിരിച്ചു ചേർത്താൽ അനാവശ്യമായ ഭാരവും കൃത്രിമത്വവും വരും; ‘അടുത്ത ദിവസം ... ഒരുമിച്ചുകൂട്ടപ്പെട്ടു’ എന്ന ഘടന അതിന്റെ വിവരണാത്മക പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐπὶ τὴν αὔριον
  choice: അടുത്ത ദിവസം
  rationale: തുടർന്നുള്ള ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: συναχθῆναι
  choice: ഒരുമിച്ചുകൂട്ടപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ എയോറിസ്റ്റ് പാസീവ് രൂപവും കൂട്ടമായി ചേരുന്ന അർഥവും നിലനിർത്തുന്നു; ‘ഒത്തുകൂടി’ എന്ന കർത്തൃപ്രയോഗത്തേക്കാൾ മൂലരൂപത്തോട് അടുത്തതാണ്.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: സർവനാമത്തിന്റെ ബന്ധസൂചന നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്ത പൂർവപദത്തെ ‘യഹൂദരുടെ’ എന്നിങ്ങനെ പരിമിതപ്പെടുത്തി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τοὺς ἄρχοντας
  choice: ഭരണാധികാരികൾ
  rationale: ഇവിടെ സമൂഹത്തിലെ അധികാരസ്ഥാനത്തുള്ള നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭരണാധികാരികൾ’ ഔദ്യോഗികമായ അധികാരഭാവം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς πρεσβυτέρους
  choice: മൂപ്പന്മാർ
  rationale: വെറും പ്രായമേറിയ പുരുഷന്മാരെയല്ല, അംഗീകൃത സമുദായനേതാക്കളെയാണ് ഈ സ്ഥാപനപരമായ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: τοὺς γραμματεῖς
  choice: ശാസ്ത്രിമാർ
  rationale: നിയമഗ്രന്ഥങ്ങളിൽ പ്രാവീണ്യമുള്ള അംഗീകൃത വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും സംക്ഷിപ്തവുമായ പദം.
- source_word: ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടുള്ള, സ്വാഭാവിക പരിഭാഷ.
theological_decisions:
- issue: αὐτῶν എന്ന സർവനാമത്തിന്റെ പൂർവപദം
  choice: ‘അവരുടെ’ എന്നു നിലനിർത്തി
  alternative: സർവനാമം ഒഴിവാക്കുക; അല്ലെങ്കിൽ ‘യഹൂദരുടെ’ എന്ന് കൂടുതൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ബന്ധസൂചന സംരക്ഷിക്കണം; അതേസമയം ഈ വാക്യം തന്നെ പൂർവപദത്തെ വ്യക്തമായി നിർണ്ണയിക്കാത്തതിനാൽ അതിനെ സങ്കുചിതമായി തിരിച്ചറിയരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശാസ്ത്രിമാർ’, ‘മൂപ്പന്മാർ’ എന്നീ പരിചിതമായ സ്ഥാപനപദങ്ങൾ നിലനിർത്തി; അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കി.
