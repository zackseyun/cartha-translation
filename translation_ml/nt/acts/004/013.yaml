id: ACT.4.13
reference: Acts 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: ml
  text: പത്രോസും യോഹന്നാനും കാണിച്ച ധൈര്യം കണ്ടും, അവർ ഔപചാരിക പണ്ഡിതപരിശീലനം ഇല്ലാത്ത സാധാരണക്കാരാണെന്ന് മനസ്സിലാക്കിയും അവർ ആശ്ചര്യപ്പെട്ടു. ഇവർ യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നവരാണെന്ന് അവർ തിരിച്ചറിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεωροῦντες
  choice: കാണുകയും
  rationale: നേതാക്കൾ പത്രോസിനെയും യോഹന്നാനെയും ശ്രദ്ധയോടെ നിരീക്ഷിച്ചതാണ് തുടർന്നുള്ള പ്രതികരണത്തിന് കാരണമാകുന്നത്. മലയാളത്തിൽ ‘കാണുകയും’ എന്നത് സന്ദർഭത്തോടൊപ്പം ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: ഇവിടെ പരസ്യമായി ഭയമില്ലാതെ സംസാരിക്കുന്ന ധീരതയും തുറന്ന നിലപാടുമാണ് സൂചിപ്പിക്കുന്നത്. ‘ധൈര്യം’ ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: καταλαβόμενοι
  choice: മനസ്സിലാക്കുകയും ചെയ്തപ്പോൾ
  rationale: പത്രോസിന്റെയും യോഹന്നാന്റെയും സാമൂഹിക-വിദ്യാഭ്യാസ പശ്ചാത്തലം സംബന്ധിച്ച് ഭരണാധികാരികൾ ഒരു നിഗമനത്തിലെത്തിയതിനെ ഇത് വ്യക്തമാക്കുന്നു.
- source_word: ἀγράμματοί
  choice: ഔപചാരിക പഠനം ലഭിക്കാത്ത
  rationale: ഈ പദം നിർബന്ധമായും നിരക്ഷരതയല്ല, ഔപചാരികമായ ശാസ്ത്രീയമോ മതപണ്ഡിതപരമോ ആയ പരിശീലനത്തിന്റെ അഭാവമാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘വിദ്യാഭ്യാസമില്ലാത്ത’ എന്നതിനെക്കാൾ ഈ വിവർത്തനം കൃത്യമാണ്.
- source_word: ἰδιῶται
  choice: സാധാരണ മനുഷ്യർ
  rationale: പരിശീലനം നേടിയ ഔദ്യോഗിക മതപണ്ഡിതരിൽപ്പെടാത്ത, പ്രത്യേക പദവിയില്ലാത്ത ആളുകൾ എന്ന സാമൂഹിക വ്യത്യാസം അപമാനാർഥമില്ലാതെ അറിയിക്കുന്നു.
- source_word: ἐθαύμαζον
  choice: അവർ ആശ്ചര്യപ്പെട്ടു
  rationale: അവരുടെ വിസ്മയപ്രതികരണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπεγίνωσκόν
  choice: അവർ തിരിച്ചറിഞ്ഞു
  rationale: അവരെ തിരിച്ചറിയുകയോ അവരെക്കുറിച്ചുള്ള ഒരു വസ്തുത ഗ്രഹിക്കുകയോ ചെയ്തതിനെ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: അവർ യേശുവിനോടുകൂടെ ഉണ്ടായിരുന്നവർ
  rationale: ഇപ്പോഴത്തെ ധൈര്യത്തിന് പശ്ചാത്തലമായിരുന്ന യേശുവുമായുള്ള അവരുടെ മുൻകാല സഹവാസം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെയും യോഹന്നാന്റെയും സാമൂഹികവും വിദ്യാഭ്യാസപരവുമായ വിശേഷണം
  choice: ‘ഔപചാരിക പഠനം ലഭിക്കാത്ത സാധാരണ മനുഷ്യർ’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘അക്ഷരാഭ്യാസമില്ലാത്തവരും പാമരരുമായ മനുഷ്യർ’ / ‘പഠിപ്പില്ലാത്ത സാധാരണക്കാർ’
  rationale: സൻഹെദ്രിൻ അംഗങ്ങൾ അവരെ ബുദ്ധിയില്ലാത്തവരോ വായിക്കാനറിയാത്തവരോ എന്നു നിർബന്ധമായും വിധിക്കുന്നില്ല; ഔപചാരിക പണ്ഡിതപരിശീലനവും ഔദ്യോഗിക വിദഗ്ധപദവിയും ഇല്ലാത്തവരായി കാണുകയാണ്. തിരഞ്ഞെടുത്ത ഭാഷ ഈ വ്യത്യാസം നിലനിർത്തുകയും അനാവശ്യമായ അവഹേളനാർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പങ്കാളിവാക്യങ്ങളുടെ സങ്കീർണത മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി ക്രമപ്പെടുത്തി. δὲ എന്നതിന് സ്രോതസ്സിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള പ്രത്യേക സമയസൂചകം ചേർത്തിട്ടില്ല.
