language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: ml
  text: 'പരിശുദ്ധാത്മാവിലൂടെ അങ്ങയുടെ ദാസനായ ദാവീദിന്റെ വായാൽ അരുളിച്ചെയ്തവനേ[a]:


    “ജനതകൾ എന്തിന് ഉഗ്രമായി കലഹിച്ചു[b]?


    ജനസമൂഹങ്ങൾ വ്യർഥകാര്യങ്ങൾ ആസൂത്രണം ചെയ്തതെന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഞങ്ങളുടെ പിതാവായ ദാവീദ്, അങ്ങയുടെ ദാസൻ, മുഖാന്തരം പരിശുദ്ധാത്മാവിലൂടെ അരുളിച്ചെയ്തവനേ” എന്നു വായിക്കാം.
    reason: textual_variant
  - marker: b
    text: അഥവാ, “ക്ഷോഭിച്ചു.” ഗ്രീക്ക് ക്രിയ പ്രക്ഷുബ്ധവും ധിക്കാരപരവുമായ എതിർപ്പിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: അരുളിച്ചെയ്തവനേ
  rationale: മുൻവാക്യത്തിൽ അഭിസംബോധന ചെയ്യപ്പെടുന്ന ദൈവത്തോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്നു. പാഠഭേദത്തിലുള്ള ‘ഞങ്ങളുടെ പിതാവായ’ എന്ന ഭാഗം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമമോ പ്രവർത്തകത്വമോ നിലനിർത്തുകയും ആത്മാവിനെ വ്യക്തമായി പരാമർശിക്കുകയും ചെയ്യുന്നു.
- source_word: στόματος Δαυὶδ
  choice: ദാവീദിന്റെ വായാൽ
  rationale: പ്രവാചകവചനത്തിന്റെ മനുഷ്യവാഹകനെ സൂചിപ്പിക്കുന്ന ബൈബിൾഭാഷാശൈലി മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παιδός σου
  choice: തന്റെ ദാസനായ
  rationale: ദാവീദിനെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ παῖς എന്നതിന് ‘ദാസൻ’ എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്. മൂന്നാംപുരുഷ പ്രത്യയമായ ‘തന്റെ’ മുൻപുള്ള ദൈവാഭിസംബോധനയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: εἰπών
  choice: അരുളിച്ചെയ്തവനേ
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന participle-നെ ദൈവത്തോടുള്ള പ്രാർഥനാഭിസംബോധനയ്ക്ക് യോജിച്ച ആദരപൂർവമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: Ἱνατί
  choice: എന്തിന്
  rationale: കാരണം ചോദിക്കുന്ന ഗ്രീക്ക് ചോദ്യപദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളസമാനപദം.
- source_word: ἐφρύαξαν
  choice: ക്ഷോഭിച്ചു
  rationale: പ്രക്ഷുബ്ധവും ധിക്കാരപരവുമായ ഇളക്കത്തെ സൂചിപ്പിക്കുന്നു; വെറും വികാരപരമായ കോപത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: സാമൂഹിക-മതപരമായ ‘വിജാതീയർ’ എന്ന പ്രത്യേക അർഥം ഇറക്കുമതി ചെയ്യാതെ, സങ്കീർത്തനത്തിലെ വിശാലമായ nations എന്ന അർഥവും ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: λαοὶ
  choice: ജനസമൂഹങ്ങൾ
  rationale: ἔθνη എന്നതിനോടുള്ള സമാന്തരതയും ഗ്രീക്കിലെ ബഹുവചനവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐμελέτησαν
  choice: ആലോചിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാനമായ ചിന്തിക്കുക/ധ്യാനിക്കുക എന്ന അർഥം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഗൂഢാലോചന നടത്തുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κενά
  choice: വ്യർഥകാര്യങ്ങൾ
  rationale: ശൂന്യതയും ഫലരാഹിത്യവും ഉൾക്കൊള്ളുന്ന κενά എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയുടെ ആമുഖത്തിലുള്ള പാഠരൂപം
  choice: മുഖ്യപാഠത്തിൽ ‘ഞങ്ങളുടെ പിതാവായ’ എന്നു ചേർക്കാതെ, ദൈവമാണ് പരിശുദ്ധാത്മാവിലൂടെയും ദാവീദിന്റെ വായിലൂടെയും സംസാരിച്ചതെന്ന വാക്യബന്ധം നൽകുന്നു.
  alternative: ചില കൈയെഴുത്തുപ്രതികൾ അനുസരിച്ച് ‘ഞങ്ങളുടെ പിതാവും തന്റെ ദാസനുമായ ദാവീദിന്റെ വായാൽ’ എന്നു വായിക്കുക.
  rationale: τοῦ πατρὸς ἡμῶν എന്ന ഭാഗം പാഠവിമർശനപരമായി അനിശ്ചിതവും നിലവിലുള്ള സ്ഥാനത്ത് ദുഷ്കരവുമാണ്. വിവാദമായ വിശദാംശത്തെ ഉറപ്പിച്ച് അവതരിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നത് മൂലപാഠസാക്ഷ്യവും വായനാസൗകര്യവും ഒരുമിച്ച് കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പ്രാർഥനാഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വായാൽ അരുളിച്ചെയ്തു’ എന്ന ബൈബിൾശൈലി നിലനിർത്തിയെങ്കിലും വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിലാണ്. കവിതാസമാന്തരതയ്ക്കായി ഉദ്ധരണി രണ്ടു വരികളാക്കി.
