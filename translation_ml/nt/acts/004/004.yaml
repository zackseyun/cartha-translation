id: ACT.4.4
reference: Acts 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: ml
  text: എന്നാൽ സന്ദേശം കേട്ടവരിൽ പലരും വിശ്വസിച്ചു; പുരുഷന്മാരുടെ എണ്ണം[b] ഏകദേശം അയ്യായിരമായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഗ്രീക്കിൽ ‘പുരുഷന്മാരുടെ എണ്ണം.’ സമ്മിശ്രമായ മുഴുവൻ ജനക്കൂട്ടത്തെയല്ല, പുരുഷന്മാരെ മാത്രം എണ്ണിയതാകാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: പലരും
  rationale: നാമപദം കൂട്ടിച്ചേർക്കാതെ ഗ്രീക്കിലെ അനിശ്ചിതമായ ബഹുത്വം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ എതിർപ്പിനോടും അറസ്റ്റിനോടുമുള്ള വൈരുധ്യം മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀκουσάντων τὸν λόγον
  choice: സന്ദേശം കേട്ടവരിൽ
  rationale: λόγος ഇവിടെ അപ്പൊസ്തലന്മാരുടെ പ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സന്ദേശം’ അർത്ഥം വ്യക്തമായി നൽകുന്നു; ‘വചനം’ എന്ന പദം സാധ്യമെങ്കിലും ഇവിടെ കുറച്ച് അവ്യക്തമാണ്.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύωയുടെ ലളിതമായ ക്രിയാരൂപം നിലനിർത്തുകയും കൂടുതൽ വികസിതമായ ദൈവശാസ്ത്രപ്രയോഗം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐγενήθη
  choice: ആയി
  rationale: എണ്ണത്തിന്റെ ഫലാവസ്ഥയെ ആധുനിക മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἀριθμὸς τῶν ἀνδρῶν
  choice: പുരുഷന്മാരുടെ എണ്ണം
  rationale: ἀνδρῶν എന്ന ലിംഗനിർദിഷ്ട പദത്തെ പൊതുവായ ‘ആളുകൾ’ എന്നു മാറ്റാതെ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὡς χιλιάδες πέντε
  choice: ഏകദേശം അയ്യായിരം
  rationale: സംഖ്യയ്ക്കുമുമ്പുള്ള ὡς സൂചിപ്പിക്കുന്ന ഏകദേശസ്വഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: τῶν ἀνδρῶν എന്നതിലെ ലിംഗനിർദിഷ്ടമായ എണ്ണൽ
  choice: ‘പുരുഷന്മാരുടെ എണ്ണം’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: ‘ആളുകളുടെ എണ്ണം’ അല്ലെങ്കിൽ ‘വിശ്വാസികളുടെ എണ്ണം’
  rationale: ഗ്രീക്കിലെ ἀνήρ സാധാരണയായി പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ വാക്യത്തിലെ എണ്ണൽ മുഴുവൻ സമ്മിശ്രസമൂഹത്തെയാണോ ഉൾക്കൊള്ളുന്നത് എന്നത് പരിഭാഷ സ്വയം തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ പുരുഷലിംഗരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. λόγος എന്നതിന് സന്ദർഭാനുസൃതമായി ‘സന്ദേശം’ തിരഞ്ഞെടുത്തു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a], [b] അടയാളങ്ങൾ സ്ഥാനം മാറിയതായി തോന്നുന്നതിനാൽ, യഥാർത്ഥത്തിൽ പ്രസക്തമായ സാംസ്കാരിക കുറിപ്പിന് മാത്രം [b] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
