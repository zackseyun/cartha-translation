id: ACT.4.10
reference: Acts 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: ml
  text: 'നിങ്ങളെല്ലാവരും ഇസ്രായേൽജനമൊക്കെയും അറിഞ്ഞുകൊള്ളട്ടെ: നിങ്ങൾ ക്രൂശിച്ചവനും ദൈവം മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചവനുമായ നസറായനായ യേശു മശീഹയുടെ നാമത്തിലാണ്[a] ഈ നാമത്താൽ[b] ഈ മനുഷ്യൻ സൗഖ്യമുള്ളവനായി നിങ്ങളുടെ മുമ്പിൽ നിൽക്കുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നസറായനായ യേശുക്രിസ്തുവിന്റെ നാമത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേരിന് “മശീഹ” എന്നും, പേരിനോടു ചേർന്ന പ്രയോഗത്തിൽ “ക്രിസ്തു” എന്നും നൽകാം.
    reason: alternative_reading
  - marker: b
    text: “ഇവനാൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἐν τούτῳ യേശുവിനെത്തന്നെയോ, തൊട്ടുമുമ്പ് പറഞ്ഞ അവന്റെ നാമത്തെയോ സൂചിപ്പിക്കാം. ὑγιής എന്നതിന് “സൗഖ്യമുള്ളവൻ,” “സുഖപ്പെട്ടവൻ,” “പൂർണാരോഗ്യമുള്ളവൻ” എന്നീ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: ഇത് അറിഞ്ഞുകൊള്ളട്ടെ
  rationale: പൊതുവായ ഔദ്യോഗിക പ്രഖ്യാപനത്തിന്റെ ആജ്ഞാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: നിങ്ങൾ എല്ലാവരും ഇസ്രായേൽജനമെല്ലാവരും
  rationale: സന്നിഹിതരായ ശ്രോതാക്കളെയും വിശാലമായ ഇസ്രായേൽജനത്തെയും വേർതിരിച്ചുള്ള ഇരട്ട അഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ ὀνόματι
  choice: നാമത്തിലാണ്
  rationale: ഗ്രീക്കിലെ നാമപ്രയോഗം നിലനിർത്തുന്നതിനൊപ്പം സൗഖ്യത്തിന്റെ ശക്തിയും ആധാരവും യേശുവിന്റെ നാമമാണെന്ന സന്ദർഭാർഥം പ്രകടമാക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ പേരിന്റെ ഭാഗം മാത്രമല്ല, അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നതിനാൽ 'മശീഹ' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τοῦ Ναζωραίου
  choice: നസറായനായ
  rationale: നസറത്തിൽനിന്നുള്ളവൻ എന്ന തിരിച്ചറിയൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: നിങ്ങൾ ക്രൂശിച്ചവൻ
  rationale: ശ്രോതാക്കളോടുള്ള പത്രോസിന്റെ നേരിട്ടുള്ള കുറ്റാരോപണം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: ദൈവം മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചവൻ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനവും യേശുവിന്റെ ഉയിർപ്പും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τούτῳ
  choice: ഇവന്റെ നാമത്തിലാണ്
  rationale: മുൻപറഞ്ഞ യേശുവിനെയോ അവന്റെ നാമത്തെയോ സൂചിപ്പിക്കാവുന്ന പ്രയോഗം; മലയാളവാക്യത്തിൽ ἐν τῷ ὀνόματι എന്ന മുൻപ്രയോഗവുമായി ബന്ധപ്പെടുത്തി അർഥം വ്യക്തമാക്കുന്നു.
- source_word: παρέστηκεν ἐνώπιον ὑμῶν
  choice: നിങ്ങളുടെ മുമ്പിൽ നിൽക്കുന്നത്
  rationale: മുൻസംഭവത്തിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന ദൃശ്യാവസ്ഥയെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑγιής
  choice: സൗഖ്യം പ്രാപിച്ച്
  rationale: രോഗശാന്തിയിലൂടെ ശരീരസൗഖ്യം വീണ്ടെടുത്ത അവസ്ഥയെ സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ സ്ഥിരഘടകമായോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇസ്രായേൽജനത്തിനുമുമ്പിലെ ഈ പ്രഖ്യാപനത്തിൽ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥബലം സജീവമാണ്; അതിനാൽ അതിനെ വിവർത്തനം ചെയ്യുന്നു, എന്നാൽ പകരം രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν τούτῳ എന്നതിന്റെ സൂചന
  choice: ഇവന്റെ നാമത്തിലാണ്
  alternative: ഇവനാലാണ്
  rationale: അടുത്തിടെ പറഞ്ഞ 'നാമത്തിൽ' എന്ന പ്രയോഗത്തിലേക്കുള്ള സൂചന സാധ്യമാണെങ്കിലും, ഗ്രീക്ക് യേശുവിനെത്തന്നെ ഉപകരണകാരണമായി സൂചിപ്പിക്കാനും ഇടയുണ്ട്; ഈ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഉയിർപ്പിന്റെ വാചകരൂപം
  choice: ദൈവം മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചവൻ
  alternative: ദൈവം മരിച്ചവരുടെ ഇടയിൽനിന്ന് എഴുന്നേല്പിച്ചവൻ
  rationale: ദൈവത്തിന്റെ വ്യക്തമായ പ്രവർത്തനവും മരിച്ചവരിൽനിന്നുള്ള യേശുവിന്റെ ഉയിർപ്പും അധിക വ്യാഖ്യാനം ചേർക്കാതെ പ്രസ്താവിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള പൊതുപ്രഖ്യാപനശൈലി സ്വീകരിച്ചു. അതിപുരാതനമായ വാക്യഘടന ഒഴിവാക്കിയെങ്കിലും, കുറ്റാരോപണം, ദൈവിക പ്രവർത്തനം, മശീഹാ-സ്ഥാനപ്പേര്, നാമത്തെക്കുറിച്ചുള്ള ഗ്രീക്ക് അവ്യക്തത എന്നിവ സംരക്ഷിച്ചു.
