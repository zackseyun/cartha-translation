translation:
  language: ml
  text: അങ്ങയുടെ കൈയും ഉദ്ദേശ്യവും മുൻകൂട്ടി സംഭവിക്കേണ്ടതെന്ന് നിർണയിച്ചിരുന്നതെല്ലാം ചെയ്യാൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുൻകൂട്ടി നിശ്ചയിച്ചിരുന്നതെല്ലാം’ അല്ലെങ്കിൽ ‘മുൻകൂട്ടി തീരുമാനിച്ചിരുന്നതെല്ലാം.’ ഗ്രീക്ക് ക്രിയ മുൻകൂട്ടിയുള്ള നിർണയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: ചെയ്യാൻ
  rationale: മുൻസന്ദർഭവുമായി ബന്ധപ്പെടുന്ന aorist infinitive-ന്റെ നേരിട്ടുള്ള അർഥവും ഉദ്ദേശ്യ/ഫലബന്ധവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ὅσα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചന സാപേക്ഷസർവനാമത്തിന്റെ സമഗ്രമായ വ്യാപ്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χείρ
  choice: കൈ
  rationale: ദൈവിക ശക്തിയെയോ പ്രവർത്തനാധികാരത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകമാണെങ്കിലും, മൂലപാഠത്തിലെ ദൃശ്യമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: βουλή
  choice: ഉദ്ദേശ്യം
  rationale: ആലോചിച്ചുറച്ച അഭിപ്രായമോ പദ്ധതിയോ എന്ന ആശയം വ്യക്തമാക്കുന്നു; ‘ആലോചന’ എന്നത് ഇവിടെ നൽകാവുന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: προώρισεν
  choice: മുൻനിർണയിച്ചിരുന്നത്
  rationale: മുൻകൂട്ടിയുള്ള നിർണയം എന്ന ക്രിയയുടെ ശക്തിയും സംഭവങ്ങൾക്ക് മുമ്പുള്ള കാലബന്ധവും നിലനിർത്തുന്നു.
- source_word: γενέσθαι
  choice: സംഭവിക്കണമെന്ന്
  rationale: സംഭവങ്ങൾ യാഥാർഥ്യമാകുന്നതിനെ സൂചിപ്പിക്കുന്ന γίνομαι-യുടെ eventive അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക പരമാധികാരത്തെയും മനുഷ്യരുടെ ഉത്തരവാദിത്വത്തെയും സ്പർശിക്കുന്ന സന്ദർഭത്തിൽ προώρισεν എന്നതിന്റെ പരിഭാഷ
  choice: മുൻനിർണയിച്ചിരുന്നത്
  alternative: മുൻകൂട്ടി നിശ്ചയിച്ചിരുന്നത്; മുൻകൂട്ടി തീരുമാനിച്ചിരുന്നത്
  rationale: ഗ്രീക്ക് ക്രിയ മുൻകൂട്ടിയുള്ള നിർണയത്തെ ശക്തമായി പ്രസ്താവിക്കുന്നു. യേശുവിന്റെ കഷ്ടാനുഭവവുമായി ബന്ധപ്പെട്ട സംഭവങ്ങളെക്കുറിച്ചുള്ള ദൈവത്തിന്റെ മുൻനിശ്ചയം പാഠം ഉറപ്പിക്കുമ്പോഴും വിശാലമായ ഏതെങ്കിലും ദൈവശാസ്ത്രസംവിധാനം അത് ഇവിടെ തീർപ്പാക്കുന്നില്ല; അതിനാൽ ശക്തമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് കൂടുതൽ വിവരണാത്മകമായ തുല്യപ്രയോഗങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പ്രാർഥനാഭാഷയായി ദൈവത്തെ ‘അങ്ങ്’ എന്നു അഭിസംബോധന ചെയ്യുന്നു. ‘കൈ’ എന്ന ബൈബിൾ രൂപകം വിശദീകരിച്ച് മാറ്റാതെ നിലനിർത്തിയിരിക്കുന്നു; വാക്യഭാഗത്തിന്റെ infinitival രൂപവും സംരക്ഷിച്ചിരിക്കുന്നു.
