  terminology: “നിലങ്ങൾ,” “വീടുകൾ,” “ഉടമകൾ,” and “വിലയായി ലഭിച്ച തുക” are accurate, accessible choices in a respectful narrative register. The footnote responsibly identifies the more literal wording and explains the contextual rendering without introducing interpretive doctrine.
