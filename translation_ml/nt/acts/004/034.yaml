  source_fidelity: The Malayalam accurately conveys the explanatory γάρ, the emphatic negation (οὐδέ), the existential statement, the class of owners of fields or houses, and the repeated/past-progressive force of ἔφερον. It does not add the unsupported claim that every believer sold all possessions. “വിറ്റവയുടെ വിലയായി ലഭിച്ച തുക” appropriately communicates τὰς τιμὰς τῶν πιπρασκομένων in context as sale proceeds while retaining the price/value concept.
