id: ACT.4.34
reference: Acts 4:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: ml
  text: അവരുടെ ഇടയിൽ ആവശ്യത്തിലായിരുന്ന ഒരാൾപോലും ഉണ്ടായിരുന്നില്ല. കാരണം, നിലങ്ങളുടെയോ വീടുകളുടെയോ ഉടമകളായിരുന്നവരെല്ലാം അവ വിറ്റ്, വിറ്റവയുടെ വിലയായി ലഭിച്ച തുക[a] കൊണ്ടുവന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘വിൽക്കപ്പെട്ടവയുടെ വിലകൾ.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് വിൽപ്പനയിലൂടെ ലഭിച്ച തുകയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδεής
  choice: ആവശ്യത്തിലായിരുന്ന
  rationale: കേവലം ദാരിദ്ര്യം എന്നതിലേക്കു ചുരുക്കാതെ, അഭാവമോ ആവശ്യമോ ഉള്ള അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐδὲ γὰρ
  choice: ഒരാൾപോലും ... ഉണ്ടായിരുന്നില്ല. കാരണം
  rationale: οὐδέയുടെ ഊന്നൽ ‘ഒരാൾപോലും’ എന്നതിലും γάρന്റെ വിശദീകരണബന്ധം ‘കാരണം’ എന്നതിലും നിലനിർത്തുന്നു.
- source_word: ὅσοι
  choice: '...വരെല്ലാം'
  rationale: പരാമർശിച്ച വിഭാഗത്തിൽ ഉൾപ്പെട്ട എല്ലാവരെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: κτήτορες χωρίων ἢ οἰκιῶν
  choice: നിലങ്ങളുടെയോ വീടുകളുടെയോ ഉടമകളായിരുന്നവർ
  rationale: സ്വത്തുടമസ്ഥതയെ വ്യക്തമായും χωρίων എന്നതിനെ സന്ദർഭോചിതമായി ‘നിലങ്ങൾ’ എന്നും അവതരിപ്പിക്കുന്നു.
- source_word: πωλοῦντες ἔφερον
  choice: വിറ്റ് ... കൊണ്ടുവന്നിരുന്നു
  rationale: വിൽപ്പനയും തുടർന്ന് പണം കൊണ്ടുവരുന്നതും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ἔφερον എന്ന imperfect രൂപത്തിലെ ആവർത്തിതമോ പതിവായതോ ആയ പ്രവൃത്തിയുടെ ഭാവം ‘കൊണ്ടുവന്നിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: വിറ്റവയുടെ വിലയായി ലഭിച്ച തുക
  rationale: τιμάς എന്നതിന്റെ അടിസ്ഥാനമായ ‘വില’ എന്ന ആശയവും സന്ദർഭത്തിലെ വിൽപ്പനത്തുക എന്ന അർത്ഥവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സ്വത്ത് വിറ്റവരുടെ വ്യാപ്തി
  choice: നിലങ്ങളുടെയോ വീടുകളുടെയോ ഉടമകളായിരുന്നവരെല്ലാം അവ വിറ്റ്
  alternative: എല്ലാ വിശ്വാസികളും തങ്ങളുടെ മുഴുവൻ സ്വത്തും വിറ്റ്
  rationale: ὅσοι κτήτορες എന്നത് പരാമർശിച്ച ഉടമകളുടെ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; എല്ലാ വിശ്വാസികളും നിർബന്ധമായി എല്ലാ സ്വത്തും വിറ്റുവെന്ന അധിക നിഗമനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ വിശദീകരണബന്ധം രണ്ടു വാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കി; ആവർത്തിത പ്രവർത്തിയുടെ ഭാവവും പാഠത്തിലെ വ്യാപ്തിയും സംരക്ഷിച്ചു.
