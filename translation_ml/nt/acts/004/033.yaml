  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: ml
  text: അപ്പൊസ്തലന്മാർ കർത്താവായ യേശുവിന്റെ പുനരുത്ഥാനത്തെക്കുറിച്ച് വലിയ ശക്തിയോടെ സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു; വലിയ കൃപ[a] അവരൊക്കെയുടെയുംമേൽ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലിയ അനുകൂലത അവരൊക്കെയുടെയുംമേൽ ഉണ്ടായിരുന്നു.” ഗ്രീക്കിലെ χάρις എന്ന പദത്തിന് ‘കൃപ’ എന്നും ‘അനുകൂലത’ എന്നും അർഥമാകാം; ഇവിടെ ദൈവത്തിന്റെ കൃപാപൂർണ സാന്നിധ്യവും വിശ്വാസികളോടു മറ്റുള്ളവർ കാണിച്ച അനുകൂല മനോഭാവവും ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: വലിയ ശക്തിയോടെ
  rationale: കരണാർഥക ദത്തിവ് സാക്ഷ്യത്തിന്റെ രീതിയോ പ്രാപ്തിയോ സൂചിപ്പിക്കുന്നു. ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ പശ്ചാത്തലത്തിൽ δύναμις എന്നതിന്റെ സ്വാഭാവിക അർഥം നിലനിർത്തുകയും അതിനെ അത്ഭുതപ്രവർത്തനങ്ങളിലേക്കു മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπεδίδουν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന അല്ലെങ്കിൽ ആവർത്തിച്ച പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. μαρτύριον-നോടൊപ്പമുള്ള പ്രയോഗത്തിൽ ‘സാക്ഷ്യം നൽകുക/പറയുക’ എന്നതാണ് അർഥം; മലയാളത്തിൽ ‘സാക്ഷ്യം പറഞ്ഞുകൊണ്ടിരുന്നു’ സ്വാഭാവികമായി ആ കാലഭാവം നൽകുന്നു.
- source_word: τὸ μαρτύριον
  choice: സാക്ഷ്യം
  rationale: μαρτύριον എന്നത് സാക്ഷ്യമോ സാക്ഷ്യപ്രസ്താവനയോ ആണ്. ‘സാക്ഷ്യം പറയുക’ സാധാരണ മലയാളപ്രയോഗമാണ്; ഗ്രീക്കിലെ നിർദ്ദേശകപദം പ്രത്യേകം പദാനുപദമായി പകർത്തേണ്ടതില്ല.
- source_word: τῆς ἀναστάσεως
  choice: പുനരുത്ഥാനത്തെക്കുറിച്ച്
  rationale: μαρτύριον-നെ തുടർന്നുള്ള ഷഷ്ഠീവിഭക്തി സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി മനസ്സിലാക്കാം. ‘പുനരുത്ഥാനത്തെക്കുറിച്ച്’ ആ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ എന്നും ഷഷ്ഠീവിഭക്തിക്ക് ‘യേശുവിന്റെ’ എന്നും നൽകി, പുനരുത്ഥാനം യേശുവിന്റേതാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു. ‘കർത്താവായ യേശു’ മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: χάρις
  choice: കൃപ
  rationale: χάρις എന്ന പദം കൃപയെയും അനുകൂലതയെയും സൂചിപ്പിക്കാം. മലയാള ബൈബിൾഭാഷയിൽ ‘കൃപ’ ദൈവിക ദയയെ മാത്രമല്ല, ലഭിക്കുന്ന പ്രസാദമോ അനുകൂലതയോ കൂടി ഉൾക്കൊള്ളാൻ കഴിയും; പദത്തിന്റെ ബഹുവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: τε
  choice: ;
  rationale: τε മുൻവാക്യത്തോടുള്ള മൃദുവായ ബന്ധം നൽകുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമം രണ്ടു സമാന്തര പ്രസ്താവനകളുടെ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ആവശ്യമില്ലാത്ത ആവർത്തിത സംയോജകം ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ πάντας αὐτούς
  choice: അവരുടെയെല്ലാംമേൽ
  rationale: ἐπί ഇവിടെ മുഴുവൻ സമൂഹത്തിന്മേൽ എന്തോ നിലനിൽക്കുന്നതോ വ്യാപിക്കുന്നതോ ആയ ദൃശ്യഭാവം നൽകുന്നു. ‘അവരുടെയെല്ലാംമേൽ’ ആ ദൃശ്യവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ χάρις എന്നതിന്റെ അർഥം
  choice: ‘കൃപ’ എന്ന വിശാല പദം, അടിക്കുറിപ്പിൽ ‘അനുകൂലത’ എന്ന സാധ്യതയോടുകൂടെ
  alternative: ‘വലിയ അനുകൂലത അവരുടെയെല്ലാംമേൽ ഉണ്ടായിരുന്നു’
  rationale: വാക്യം χάρις-ന്റെ ഉറവിടം വ്യക്തമാക്കുന്നില്ല. അത് ദൈവകൃപയെയോ മറ്റുള്ളവരുടെ അനുകൂലനിലപാടിനെയോ രണ്ടിന്റെയും സംയുക്തസൂചനയെയോ ഉൾക്കൊള്ളാം. പ്രധാനപാഠവും അടിക്കുറിപ്പും ചേർന്ന് ഈ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ച സംരക്ഷിക്കുന്നു. χάρις-ന്റെ യഥാർഥ അർഥവ്യാപ്തി പ്രധാനപാഠത്തിലെ ‘കൃപ’യും അടിക്കുറിപ്പിലെ ‘അനുകൂലത’യും ചേർന്ന് നിലനിർത്തുന്നു.
