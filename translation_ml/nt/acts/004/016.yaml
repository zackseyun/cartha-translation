id: ACT.4.16
reference: Acts 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ഈ മനുഷ്യരുടെ കാര്യത്തിൽ നാം എന്തു ചെയ്യണം? കാരണം, തീർച്ചയായും ഇവരിലൂടെ ഒരു പ്രസിദ്ധമായ അടയാളം സംഭവിച്ചിരിക്കുന്നു; അത് യെരൂശലേമിൽ താമസിക്കുന്ന എല്ലാവർക്കും വ്യക്തമാണ്, നമുക്ക് അത് നിഷേധിക്കാനും കഴിയില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: അവർ പറഞ്ഞു
  rationale: മുൻവാക്യത്തിലെ പ്രവർത്തനവുമായി ബന്ധിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപം. മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യമായി അവതരിപ്പിച്ചു.
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: ഈ മനുഷ്യരെ നാം എന്തു ചെയ്യണം?
  rationale: ആലോചന സൂചിപ്പിക്കുന്ന aorist subjunctive മലയാളത്തിലെ ‘എന്തു ചെയ്യണം?’ എന്ന സ്വാഭാവിക ചോദ്യരൂപത്തിൽ നൽകി; സന്ദർഭത്തിൽ പത്രോസിനെയും യോഹന്നാനെയും സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι μὲν γὰρ
  choice: എന്നത്
  rationale: തുടർന്നുള്ള പ്രസ്താവന അവരുടെ ആലോചനയ്ക്കുള്ള വിശദീകരണകാരണമാണെന്ന് മലയാള വാക്യഘടനയിലൂടെ വ്യക്തമാക്കി; ഗ്രീക്കിലെ ഊന്നൽ മുഴുവനായി പ്രത്യേക അവ്യയങ്ങളാൽ പകർത്തുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും.
- source_word: γνωστὸν σημεῖον
  choice: ശ്രദ്ധേയമായ ഒരു അടയാളം
  rationale: γνωστός ഇവിടെ പരസ്യമായി അറിയപ്പെട്ടതും അംഗീകരിക്കപ്പെട്ടതുമായ സംഭവത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘എല്ലാവർക്കും വ്യക്തമാണ്’ എന്ന ഭാഗം പൊതുവായ അറിവ് വ്യക്തമാക്കുന്നതിനാൽ, ആവർത്തനം ഒഴിവാക്കി ‘ശ്രദ്ധേയമായ’ എന്നു നൽകി.
- source_word: γέγονεν
  choice: സംഭവിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലത്തെ perfect രൂപം സൂചിപ്പിക്കുന്നു; ‘സംഭവിച്ചിരിക്കുന്നു’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δι’ αὐτῶν
  choice: ഇവരിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമത്വം നിലനിർത്തുന്നു; അടയാളത്തിന്റെ സ്വതന്ത്ര കർത്തൃത്വം ഇവർക്കു ചുമത്തുന്നില്ല.
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: യെരൂശലേമിൽ താമസിക്കുന്ന എല്ലാവർക്കും വ്യക്തമാണ്
  rationale: പൊതുവായി വെളിപ്പെട്ടതും സംശയാതീതവുമായ സ്വഭാവം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: അതു നിഷേധിക്കാൻ നമുക്കു കഴിയുകയുമില്ല
  rationale: ഗ്രീക്കിൽ പരോക്ഷമായി നിൽക്കുന്ന object മുൻപ്രസ്താവനയിലെ അടയാളത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ എന്ന സർവനാമത്താൽ മലയാളത്തിൽ വ്യക്തമാക്കി; καί-യുടെ കൂട്ടിച്ചേർക്കൽ ‘-ഉം’ വഴി നിലനിർത്തി.
theological_decisions:
- issue: പൊതു അത്ഭുതത്തിന്റെ സന്ദർഭത്തിലെ σημεῖον എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: അടയാളം
  alternative: അത്ഭുതം
  rationale: ലൂക്കൊസിന്റെ രചനയിൽ σημεῖον സംഭവത്തിനപ്പുറം ചൂണ്ടിക്കാണിക്കുന്ന ദൈവശാസ്ത്രപരമായ ഭാരം വഹിക്കുന്നു. ‘അടയാളം’ ആ ഭാരം നിലനിർത്തുന്നു; അത്ഭുതസ്വഭാവം സന്ദർഭത്തിൽ നിന്നു വ്യക്തമാകുന്നു.
- issue: δι’ αὐτῶν എന്നതിലെ പ്രവർത്തകത്വം
  choice: ഇവരിലൂടെ
  alternative: ഇവർ ചെയ്ത
  rationale: ‘ഇവരിലൂടെ’ എന്നത് മാധ്യമത്വം നിലനിർത്തുകയും അടയാളത്തിന്റെ അന്തിമ കർത്തൃത്വം ആരുടേതെന്നത് വിവർത്തനത്തിൽ അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാ-വായനാ ശൈലി. അനാവശ്യമായി പഴഞ്ചനായ രൂപങ്ങൾ ഒഴിവാക്കി; ‘അടയാളം’ എന്ന ലൂക്കോസീയ പദപ്രയോഗം സംരക്ഷിച്ചു.
