id: ACT.4.1
reference: Acts 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: ml
  text: അവർ ജനത്തോടു സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, പുരോഹിതന്മാരും ദേവാലയസേനാധിപനും[a] സദൂക്യരും അവരുടെ അടുത്തെത്തി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദേവാലയസേനാധിപൻ’ ദേവാലയപരിസരത്തിലെ ക്രമസമാധാനത്തിന്റെയും സുരക്ഷയുടെയും ചുമതലയുള്ള ഉദ്യോഗസ്ഥനായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘അടുത്തെത്തി’ എന്നതിന് ‘അവരുടെ അടുക്കൽ വന്നെത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ പെട്ടെന്നുള്ള വരവിനെയോ സമീപനത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ അധികാരികളുടെ ഔദ്യോഗിക ഇടപെടലാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: അവർ ... സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സ്വാഭാവികമായ മലയാളത്തിൽ സമകാലികത സൂചിപ്പിക്കുന്ന കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി. δέ-യുടെ നേരിയ ആഖ്യാനബന്ധം പ്രത്യേകം പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ നിലനിർത്തി.
- source_word: πρὸς τὸν λαὸν
  choice: ജനത്തോടു
  rationale: λαός ഇവിടെ ദേവാലയപരിസരത്തിൽ കൂടിയിരുന്ന ജനത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനം’ മൂലപദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുന്നു; ‘ജനക്കൂട്ടം’ എന്നു പറഞ്ഞാൽ സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനം കൂടുതലാകും.
- source_word: ἐπέστησαν αὐτοῖς
  choice: അവരുടെ അടുത്തെത്തി
  rationale: ക്രിയയ്ക്ക് അടുത്തുവരുക, പെട്ടെന്ന് വന്നെത്തുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഔദ്യോഗിക ഇടപെടലിന്റെ സന്ദർഭം സൂക്ഷിച്ചുകൊണ്ട്, മൂലക്രിയയിൽ നിർബന്ധമായില്ലാത്ത ശത്രുത ‘എതിർത്തു’ പോലുള്ള പദങ്ങളിലൂടെ ചേർക്കാതിരിക്കുന്നു.
- source_word: οἱ ἱερεῖς
  choice: പുരോഹിതന്മാർ
  rationale: മൂലത്തിൽ ἱερεῖς മാത്രമാണ്; ‘മുഖ്യപുരോഹിതന്മാർ’ എന്ന പദവിവ്യത്യാസം ഇവിടെ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: ദേവാലയസേനാധിപൻ
  rationale: στρατηγός ക്രമസമാധാനത്തിനും സുരക്ഷയ്ക്കും ചുമതലയുള്ള അധികാരിയെ സൂചിപ്പിക്കുന്നു. ‘ദേവാലയസേനാധിപൻ’ പദവിയെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: οἱ Σαδδουκαῖοι
  choice: സദൂക്യർ
  rationale: ഈ യഹൂദവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions:
- issue: അധികാരികളുടെ വരവിൽ ശത്രുതാഭാവം എത്രമാത്രം വ്യക്തമാക്കണം
  choice: ‘അവരുടെ അടുത്തെത്തി’ എന്ന താരതമ്യേന നിഷ്പക്ഷ പ്രയോഗം
  alternative: ‘അവരെ നേരിട്ടു’ അല്ലെങ്കിൽ ‘അവരുടെമേൽ പാഞ്ഞെത്തി’
  rationale: തുടർന്നുള്ള സന്ദർഭം എതിർപ്പ് വ്യക്തമാക്കുന്നുവെങ്കിലും ἐπέστησαν എന്ന ക്രിയ മാത്രം ശക്തമായ ഏറ്റുമുട്ടൽ നിർബന്ധമാക്കുന്നില്ല. അതിനാൽ ആഖ്യാനത്തിലെ സംഘർഷം മുൻകൂട്ടി അതിശക്തമാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ദേവാലയം’, ‘പുരോഹിതന്മാർ’, ‘സദൂക്യർ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
