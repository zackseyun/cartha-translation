reference: Acts 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: ml
  text: അവർ അവരെ വീണ്ടും ഭീഷണിപ്പെടുത്തിയശേഷം[a], ജനങ്ങളെ കണക്കിലെടുത്ത് അവരെ എങ്ങനെ ശിക്ഷിക്കാമെന്നതിന് ഒരു വഴിയും കണ്ടെത്താനാകാതെ വിട്ടയച്ചു; സംഭവിച്ചതിന്റെ പേരിൽ എല്ലാവരും ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ടിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കൂടുതൽ ഭീഷണിപ്പെടുത്തിയശേഷം’ അല്ലെങ്കിൽ ‘ഭീഷണികൾ കൂടി ചേർത്തശേഷം.’ προσαπειλησάμενοι എന്ന ഗ്രീക്ക് പദം മുമ്പുണ്ടായ ഭീഷണിക്കു പുറമേയുള്ളതോ കൂടുതൽ ശക്തമായതോ ആയ ഭീഷണിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: വീണ്ടും ഭീഷണിപ്പെടുത്തിയശേഷം
  rationale: πρός എന്ന ഉപസർഗം മുമ്പുണ്ടായ ഭീഷണിയോട് കൂടുതൽ ഭീഷണി ചേർത്തതോ അത് ആവർത്തിച്ചതോ സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘വീണ്ടും ഭീഷണിപ്പെടുത്തിയശേഷം’ ഈ അർഥം നൽകുന്നു; തീവ്രതയോ അധികതയോ ഉള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπέλυσαν
  choice: വിട്ടയച്ചു
  rationale: കസ്റ്റഡിയിൽനിന്നോ അധികാരികളുടെ നിയന്ത്രണത്തിൽനിന്നോ മോചിപ്പിക്കുക എന്ന സന്ദർഭാർഥം മലയാളത്തിലെ സ്വാഭാവികമായ ‘വിട്ടയച്ചു’ വ്യക്തമാക്കുന്നു.
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: അവരെ എങ്ങനെ ശിക്ഷിക്കണമെന്നു അവർക്ക് ഒരു വഴിയും കണ്ടെത്താനായില്ല
  rationale: അക്ഷരാർഥത്തിലെ ‘ഒന്നും കണ്ടെത്താതെ’ എന്നതിനെ തുടർന്ന് വരുന്ന τὸ πῶς വ്യക്തമാക്കുന്നത് ശിക്ഷിക്കാനുള്ള മാർഗം കണ്ടെത്താനായില്ല എന്നതാണ്. ചോദ്യാത്മകമായ ‘എങ്ങനെ’ എന്ന ഘടകം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: διὰ τὸν λαόν
  choice: ജനത്തെ ഭയന്ന്
  rationale: διά + accusative കാരണത്തെ സൂചിപ്പിക്കുന്നു. അധികാരികളെ തടഞ്ഞത് ജനങ്ങളുടെ പ്രതികരണത്തെക്കുറിച്ചുള്ള ഭയമാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ, ‘ജനത്തെ ഭയന്ന്’ സ്വാഭാവികവും അർഥസമ്പുഷ്ടവുമായ പരിഭാഷയാണ്.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സന്ദർഭത്തിലെ ജനസമൂഹത്തെ പൊതുവായി ഉൾക്കൊള്ളുന്ന πάντες എന്ന സർവവ്യാപക പ്രയോഗത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തുല്യം.
- source_word: ἐδόξαζον τὸν θεόν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തിക്കൊണ്ടിരുന്നതിനാൽ
  rationale: δοξάζω എന്നത് ദൈവത്തിന് മഹത്ത്വം നൽകുന്ന ആശയം നിലനിർത്തുന്നു; imperfect രൂപത്തിന്റെ തുടർച്ചയായ ഭാവം ‘-ക്കൊണ്ടിരുന്നതു’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ἐπὶ τῷ γεγονότι
  choice: സംഭവിച്ചതിനെച്ചൊല്ലി
  rationale: പൂർത്തിയായെങ്കിലും പ്രസക്തി തുടരുന്ന സംഭവത്തെ γεγονότι സൂചിപ്പിക്കുന്നു; ἐπί ഇവിടെ ദൈവത്തെ മഹത്ത്വപ്പെടുത്താനുള്ള അടിസ്ഥാനമോ കാരണമോ നൽകുന്നു.
