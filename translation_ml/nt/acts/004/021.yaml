translation_notes:
  register: ആധുനിക നിലവാരത്തിലുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ കാരണബന്ധവും imperfect ക്രിയയുടെ തുടർച്ചാഭാവവും സംരക്ഷിച്ചു; നീണ്ട ഗ്രീക്ക് ഘടന മലയാളത്തിലെ സ്വാഭാവിക വായനയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി.
