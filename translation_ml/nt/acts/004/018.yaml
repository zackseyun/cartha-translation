reference: Acts 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: ml
  text: അവരെ വിളിച്ചുവരുത്തിയ ശേഷം, യേശുവിന്റെ നാമത്തിൽ ഒട്ടും സംസാരിക്കുകയോ പഠിപ്പിക്കുകയോ ചെയ്യരുതെന്ന് അവർ കൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവിന്റെ നാമത്തിൽ ഒന്നുംതന്നെ പറയുകയോ പഠിപ്പിക്കുകയോ ചെയ്യരുതെന്ന്.”
    reason: φθέγγεσθαι എന്ന ക്രിയയെ ‘പറയുക’ എന്നു നൽകുകയും καθόλου-യുടെ സമ്പൂർണ ഊന്നൽ ‘ഒന്നുംതന്നെ’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക ബദൽ പദവിന്യാസം.
lexical_decisions:
- source_word: καλέσαντες αὐτούς
  choice: അവരെ വിളിച്ചുവരുത്തിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-ന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; സഭാമണ്ഡലത്തിന്റെ മുമ്പിലേക്കു വീണ്ടും കൊണ്ടുവരുന്ന സന്ദർഭത്തിനും ‘വിളിച്ചുവരുത്തുക’ യോജിക്കുന്നു.
- source_word: παρήγγειλαν
  choice: അവർ ആജ്ഞാപിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ക്രിയയുടെ ശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ καθόλου
  choice: ഒട്ടും അരുതെന്ന്
  rationale: നിരോധനത്തിന്റെ സമ്പൂർണവും ഊന്നലോടുകൂടിയതുമായ സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μὴ φθέγγεσθαι
  choice: സംസാരിക്കുകയോ
  rationale: φθέγγομαι എന്നതിന്റെ പൊതുവായ ‘സംസാരിക്കുക/ഉച്ചരിക്കുക’ എന്ന അർഥം ഇവിടെ അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ നൽകുന്നു.
- source_word: μηδὲ διδάσκειν
  choice: പഠിപ്പിക്കുകയോ
  rationale: ആദ്യ നിരോധനത്തോടു ചേർന്ന രണ്ടാമത്തെ നിരോധിത പ്രവർത്തനം മലയാളത്തിലെ നിഷേധസമുച്ചയരീതിയിൽ സ്വാഭാവികമായി ഏകോപിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ നാമത്തെ ആശ്രയിച്ചോ അതുമായി ബന്ധപ്പെട്ടോ സംസാരിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന, അപ്പൊസ്തലപ്രവൃത്തികളിലെ സന്ദർഭത്തിന് യോജിച്ച പരമ്പരാഗതവും വ്യക്തവുമായ പ്രയോഗം.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യത്തിന് ഏർപ്പെടുത്തിയ നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: യേശുവിന്റെ നാമവുമായി ബന്ധപ്പെട്ട സംസാരവും പഠിപ്പിക്കലും പൂർണമായി നിരോധിക്കുന്ന ആജ്ഞ
  alternative: പൊതുപ്രഘോഷണം മാത്രം നിരോധിക്കുന്ന ആജ്ഞ
  rationale: τὸ καθόλου എന്ന ഊന്നലും μὴ φθέγγεσθαι μηδὲ διδάσκειν എന്ന ഇരട്ടപ്രയോഗവും വിശാലമായ നിരോധനം സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് പറയുന്നതിനെ പൊതുപ്രഘോഷണം മാത്രമായി വിവർത്തനം ചുരുക്കുന്നില്ല.
- issue: ἐπὶ τῷ ὀνόματι എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ‘യേശുവിന്റെ നാമത്തിൽ’ എന്ന വിശാലവും സ്വാഭാവികവുമായ രൂപം
  alternative: ‘യേശുവിന്റെ നാമത്തെ ആധാരമാക്കി’ എന്ന കൂടുതൽ വിശദീകരണാത്മക രൂപം
  rationale: ഉറവിടത്തിലെ പ്രയോഗം ബന്ധം, അടിസ്ഥാനം, അധികാരം എന്നീ ആശയങ്ങൾക്ക് ഇടം നൽകുന്നു; പ്രധാനപാഠം അവയിൽ ഒന്ന് മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുക്കാതെ സാധാരണ മലയാള ബൈബിൾഭാഷയിൽ ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഒട്ടും അരുത്’ മൂലപാഠത്തിലെ ശക്തമായ സമഗ്രനിരോധനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘യേശുവിന്റെ നാമത്തിൽ’ എന്ന പ്രയോഗം ഉറവിടത്തിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
