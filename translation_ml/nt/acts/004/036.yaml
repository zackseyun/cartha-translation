source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: ml
  text: അപ്പൊസ്തലന്മാർ ബർന്നബാസ് എന്നു വിളിച്ച യോസേഫ്—വിവർത്തനം ചെയ്താൽ അതിന്റെ അർഥം ‘പ്രോത്സാഹനത്തിന്റെ പുത്രൻ’[a]—സൈപ്രസ് സ്വദേശിയായ ഒരു ലേവ്യനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉദ്ബോധനത്തിന്റെ പുത്രൻ,’ ‘സാന്ത്വനത്തിന്റെ പുത്രൻ,’ അല്ലെങ്കിൽ ‘ആശ്വാസത്തിന്റെ പുത്രൻ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് പ്രോത്സാഹിപ്പിക്കൽ, ഉദ്ബോധിപ്പിക്കൽ, ആശ്വസിപ്പിക്കൽ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: യോസേഫ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾരൂപം.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ഇത് മൃദുവായ ആഖ്യാനപരിവർത്തനം സൂചിപ്പിക്കുന്നു; മലയാള വാക്യക്രമത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെയും പ്രവാഹം സ്വാഭാവികമാണ്.
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാർ ബർന്നബാസ് എന്നു വിളിച്ച
  rationale: പേരിടലിന്റെ ഉറവിടം അപ്പൊസ്തലന്മാരാണെന്ന ἀπόയുടെ ആശയം സ്വാഭാവികമായ കർത്തൃപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘കൂടി’ ചേർത്തിട്ടില്ല.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: വിവർത്തനം ചെയ്താൽ അതിന് … എന്നർഥം
  rationale: പേരിന്റെ അർഥം വിശദീകരിക്കുന്ന ലൂക്കോസിന്റെ വ്യാഖ്യാനസ്വഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: υἱὸς παρακλήσεως
  choice: പ്രോത്സാഹനത്തിന്റെ പുത്രൻ
  rationale: παράκλησις എന്ന പദത്തിന്റെ പ്രോത്സാഹനം, ഉദ്ബോധനം, ആശ്വാസം എന്നീ അർഥവ്യാപ്തികളിൽ പൊതുവായതും വായനാസൗഹൃദവുമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Λευίτης
  choice: ഒരു ലേവ്യൻ
  rationale: ഗോത്ര-മതപരമായ തിരിച്ചറിയൽ നേരിട്ട് പകരുന്നു.
- source_word: Κύπριος τῷ γένει
  choice: സൈപ്രസ് സ്വദേശിയായ
  rationale: ജന്മദേശം അല്ലെങ്കിൽ ഉത്ഭവം സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വംശപരമ്പരയെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: παρακλήσεως എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രോത്സാഹനം’
  alternative: ‘ഉദ്ബോധനം,’ ‘സാന്ത്വനം,’ അല്ലെങ്കിൽ ‘ആശ്വാസം’
  rationale: മൂലപദത്തിന് പ്രേരിപ്പിക്കൽ മുതൽ ആശ്വസിപ്പിക്കൽ വരെയുള്ള അർഥവ്യാപ്തിയുണ്ട്. വാക്യം ഒരു പ്രത്യേക സൂക്ഷ്മാർഥം നിർബന്ധിക്കുന്നില്ലാത്തതിനാൽ വിശാലമായ അർഥം മുഖ്യപാഠത്തിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ അപൂർണ്ണമായി തുടരുന്ന വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ആയിരുന്നു’ ചേർത്തിരിക്കുന്നു; വാക്യത്തിന്റെ വിവരക്രമം പരമാവധി നിലനിർത്തി.
