id: ACT.4.11
reference: Acts 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: ml
  text: നിർമാതാക്കളായ നിങ്ങളാൽ തള്ളിക്കളയപ്പെട്ട കല്ല് ഇവനാണ്; അതു മൂലക്കല്ലായിത്തീർന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മേൽക്കല്ല്”; അക്ഷരാർഥത്തിൽ, “മൂലയുടെ തല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: ഇവനാണ്
  rationale: സമീപസന്ദർഭത്തിൽ യേശുവിനെ ഊന്നലോടെ ചൂണ്ടിക്കാണിക്കുന്നു; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: λίθος
  choice: കല്ല്
  rationale: സങ്കീർത്തനം 118:22-ലെ കല്ലിന്റെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐξουθενηθεὶς
  choice: തള്ളിക്കളഞ്ഞ
  rationale: നിസ്സാരമെന്നോ വിലയില്ലാത്തതെന്നോ കണ്ട് നിരസിച്ചതെന്ന അർഥം കെട്ടിടനിർമാണരൂപകത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: നിങ്ങൾ പണിയുന്നവർ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലെ നേരിട്ടുള്ള കുറ്റപ്പെടുത്തലും ‘പണിയുന്നവർ’ എന്ന തിരുവെഴുത്തുരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: ὁ γενόμενος
  choice: ആ കല്ലുതന്നെ ... ആയിത്തീർന്നു
  rationale: നിരസിക്കപ്പെട്ട അതേ കല്ലിന്റെ നിലമാറ്റവും ഇപ്പോഴുള്ള പ്രാധാന്യവും വ്യക്തമാക്കുന്നു.
- source_word: κεφαλὴν γωνίας
  choice: മൂലക്കല്ല്
  rationale: ‘മൂലയുടെ തല’ എന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; നിർണായകവും ആദരിക്കപ്പെട്ടതുമായ കല്ലിന്റെ രൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 118:22-ലെ κεφαλὴ γωνίας എന്ന വാസ്തുശില്പരൂപകം
  choice: മൂലക്കല്ല്
  alternative: മൂലയുടെ തലക്കല്ല്; മുകളിലെ മുഖ്യക്കല്ല്
  rationale: ‘മൂലക്കല്ല്’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും പരമ്പരാഗത രൂപകത്തോട് യോജിച്ചതുമാണ്. കൃത്യമായ വാസ്തുശില്പസൂചന വിവാദമായതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇവനാണ്’ എന്നത് യേശുവിലേക്കുള്ള നേരിട്ടുള്ള ചൂണ്ടിക്കാണിക്കൽ നിലനിർത്തുന്നു; ‘നിങ്ങൾ പണിയുന്നവർ’ എന്ന ഘടന കുറ്റപ്പെടുത്തലിന്റെ ഊന്നലും കെട്ടിടരൂപകവും സംരക്ഷിക്കുന്നു.
