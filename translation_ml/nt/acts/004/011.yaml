    issue: “നിങ്ങൾ പണിയുന്നവർ” is an unnatural and imprecise rendering of ὑφ’ ὑμῶν τῶν οἰκοδόμων.
    rationale: The Greek means “by you, the builders,” with “the builders” appositional to “you.” “നിർമാതാക്കളായ നിങ്ങളാൽ” clearly conveys both the passive agent and the metaphorical designation.
  - severity: low
