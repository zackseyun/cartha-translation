  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ കണ്ടതും കേട്ടതും പറയാതിരിക്കാൻ ഞങ്ങൾക്കു കഴിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘കാരണം, ഞങ്ങൾ കണ്ടതും കേട്ടതും പറയാതെ ഞങ്ങൾക്കിരിക്കാൻ കഴിയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα
  choice: ഞങ്ങൾക്കു കഴിയില്ല
  rationale: കഴിവില്ലായ്മയെ നേരിട്ട് അറിയിക്കുന്നു; വെറും മനസ്സില്ലായ്മയോ തീരുമാനമോ ആയി അർഥം ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: ഗ്രീക്കിലെ പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ മലയാളത്തിലും ‘ഞങ്ങൾ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἃ
  choice: കണ്ടതും കേട്ടതും
  rationale: ബന്ധസർവനാമത്തിന്റെ ആശയം മലയാളത്തിലെ സ്വാഭാവിക നാമീകരിച്ച ഏകോപനഘടനയിലൂടെ പകർന്നിരിക്കുന്നു.
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: ഞങ്ങൾ കണ്ടതും കേട്ടതും
  rationale: നേരിട്ടുള്ള സാക്ഷ്യത്തിന്റെ രണ്ടു വശങ്ങളും സമാന്തരമായി സംരക്ഷിക്കുന്നു; ഗ്രീക്ക് aorist രൂപങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ നൽകുന്നു.
- source_word: μὴ λαλεῖν
  choice: പറയാതിരിക്കാൻ
  rationale: δύναμαι-യോടൊപ്പമുള്ള μή + infinitive ഘടനയിലെ ‘സംസാരിക്കാതിരിക്കാൻ കഴിയില്ല’ എന്ന നിഷേധാത്മക ഘടന സംരക്ഷിക്കുന്നു.
- source_word: λαλεῖν
  choice: പറയുക
  rationale: സാക്ഷ്യം വാക്കുകളാൽ അറിയിക്കുന്നതിനെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലന്മാരുടെ സാക്ഷ്യം വെറും മനഃപൂർവമായ ദൃഢനിശ്ചയമാണോ, അതോ മിണ്ടാതിരിക്കാനുള്ള കഴിവില്ലായ്മയായാണോ വാക്യം അവതരിപ്പിക്കുന്നത്?
  choice: കണ്ടതും കേട്ടതും പറയാതിരിക്കാൻ അവർക്കു കഴിയില്ല എന്നാണ് വാക്യം പറയുന്നത്.
  alternative: ‘ഞങ്ങൾ പറയുന്നത് നിർത്തുകയില്ല’ എന്ന ശക്തമായ തീരുമാനമായി പരാവർത്തനം ചെയ്യുക.
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν എന്നത് ഏറ്റവും നേരിട്ട് സംസാരിക്കാതിരിക്കാനുള്ള കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. അതിനെ വെറും തീരുമാനമായി ദുർബലപ്പെടുത്താതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന നിഷേധഘടനയായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഇരട്ട നിഷേധസദൃശ ഘടന മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം സംരക്ഷിച്ചിരിക്കുന്നു; ‘കാരണം’ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
