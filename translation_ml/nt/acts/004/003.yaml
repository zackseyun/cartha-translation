translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. ഗ്രീക്ക് ഭാഷാശൈലി മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ആശയം മുഖ്യവാചകത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
