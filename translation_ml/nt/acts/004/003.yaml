  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: ml
  text: അവർ അവരെ പിടികൂടി[a], പിറ്റേന്ന് വരെ കാവലിൽ വെച്ചു[b]; കാരണം, അപ്പോഴേക്കും സന്ധ്യയായിക്കഴിഞ്ഞിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെമേൽ കൈകൾ വെച്ചു’; ഇവിടെ ശത്രുതാപരമായി പിടികൂടുക എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘തടങ്കലിൽ വെച്ചു’ അല്ലെങ്കിൽ ‘കാവലേർപ്പെടുത്തി’ എന്നും പരിഭാഷപ്പെടുത്താം. അവരെ സൂക്ഷിച്ചിരുന്ന കൃത്യമായ സ്ഥലം ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον ... τὰς χεῖρας
  choice: പിടികൂടി
  rationale: അക്ഷരാർഥത്തിൽ ‘അവരുടെമേൽ കൈകൾ വെച്ചു’ എന്ന ഗ്രീക്ക് പ്രയോഗം ഈ ശത്രുതാപരമായ നിയമസന്ദർഭത്തിൽ ബലമായി പിടികൂടുക എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘കൈവെച്ചു’ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതിനാൽ ‘പിടികൂടി’ സ്വാഭാവികവും വ്യക്തവുമാണ്; അടിക്കുറിപ്പിൽ മൂലപ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവരെ
  rationale: ബഹുവചന സർവനാമം പത്രോസിനെയും യോഹന്നാനെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള കർമരൂപമാണ് സ്വാഭാവികം.
- source_word: ἔθεντο εἰς τήρησιν
  choice: കാവലിൽ വെച്ചു
  rationale: τήρησις കാത്തുസൂക്ഷിക്കൽ, കാവൽ, തടങ്കൽ എന്നിവ സൂചിപ്പിക്കുന്നു. കൃത്യമായ തടവുസൗകര്യം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘കാവലിൽ വെച്ചു’ അനാവശ്യമായ വിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: εἰς τὴν αὔριον
  choice: പിറ്റേന്നുവരെ
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ ‘അടുത്ത ദിവസംവരെ’ എന്ന കാലപരിധി ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: കാരണം, നേരം സന്ധ്യയായിക്കഴിഞ്ഞിരുന്നു
  rationale: വിചാരണ നീട്ടിവെച്ചതിന്റെ കാരണം വ്യക്തമാക്കുന്ന വാക്യം. ‘സന്ധ്യ’ എന്നത് ἑσπέραയുടെ സമയസൂചന കൃത്യമായി നിലനിർത്തുന്നു; ‘ആയിക്കഴിഞ്ഞിരുന്നു’ ἤδηയുടെ ഭാവം നൽകുന്നു.
