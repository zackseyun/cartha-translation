translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘സ്വന്തക്കാർ’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ τοὺς ἰδίους എന്നതിന്റെ നിർദ്ദേശപൂർവം തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു; കുടുംബം, സഭ, അല്ലെങ്കിൽ ശിഷ്യസംഘം എന്നിങ്ങനെ പ്രത്യേകമായി ചുരുക്കുന്നില്ല.
