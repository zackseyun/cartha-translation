source:
  edition: SBLGNT
  text: Ἀπολυθέντες δὲ ἦλθον πρὸς τοὺς ἰδίους καὶ ἀπήγγειλαν ὅσα πρὸς αὐτοὺς οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/023.yaml
  text: After they were released[a], they went to their own people and reported all that the chief priests and the elders had said to them.
translation:
  language: ml
  text: അവരെ വിട്ടയച്ചശേഷം അവർ തങ്ങളുടെ ആളുകളുടെ[a] അടുക്കൽ ചെന്നു; മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും അവരോടു പറഞ്ഞതെല്ലാം അവരെ അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെയുള്ളവരുടെ’; ‘തങ്ങളുടെ കൂട്ടാളികളുടെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: അവരെ വിട്ടയച്ചശേഷം
  rationale: ἀπολύω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയ കൃദന്തരൂപം പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കാവൽ/നിയമനടപടി എന്ന സന്ദർഭത്തിൽ ‘വിട്ടയച്ചു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ മൃദുവായ ഒരു ബന്ധകമാണ്. മലയാളത്തിൽ ‘വിട്ടയച്ചശേഷം’ എന്ന കാലസൂചക ഘടന തന്നെ വാക്യബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ വേറൊരു ബന്ധകം ചേർത്തിട്ടില്ല.
- source_word: ἦλθον
  choice: ചെന്നു
  rationale: ἔρχομαι സന്ദർഭവും ദൃഷ്ടികോണവും അനുസരിച്ച് ‘വന്നു’ എന്നും ‘പോയി/ചെന്നു’ എന്നും അർഥമാക്കാം. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നീക്കം മലയാളത്തിൽ ‘അടുക്കൽ ചെന്നു’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
- source_word: πρὸς τοὺς ἰδίους
  choice: തങ്ങളുടെ സ്വന്തക്കാരുടെ അടുക്കൽ
  rationale: τοὺς ἰδίους അക്ഷരാർഥത്തിൽ ‘തങ്ങളുടേതായവർ’ എന്നാണ്; ഇവിടെ സ്വന്തം കൂട്ടത്തിലോ സഹവാസവൃത്തത്തിലോ ഉള്ളവരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സ്വന്തക്കാർ’ ഈ തുറന്ന അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: ἀπαγγέλλω ലഭിച്ച വിവരം അറിയിക്കുകയോ വിവരിച്ചു പറയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ‘അറിയിച്ചു’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ὅσα
  choice: പറഞ്ഞതെല്ലാം
  rationale: ὅσα റിപ്പോർട്ടിന്റെ മുഴുവൻ ഉള്ളടക്കവും ഉൾക്കൊള്ളുന്നു; ‘എല്ലാം’ അതിന്റെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτοὺς
  choice: തങ്ങളോടു
  rationale: λέγω-യോടൊപ്പം πρός + accusative സംസാരത്തിന്റെ അഭിസംബോധിതരെ സൂചിപ്പിക്കുന്നു. ഇവിടെ പത്രോസിനെയും യോഹന്നാനെയും പരാമർശിക്കുന്ന സർവനാമം മലയാളത്തിൽ ‘തങ്ങളോടു’ എന്ന് നൽകി.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ബഹുവചനത്തിലുള്ള ἀρχιερεῖς പ്രധാന പുരോഹിതാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; ഒരേസമയം പല മഹാപുരോഹിതന്മാർ എന്ന ധാരണ ഒഴിവാക്കാൻ പതിവായ ‘മുഖ്യപുരോഹിതന്മാർ’ ഉപയോഗിച്ചു.
- source_word: οἱ πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: സ്ഥാപനപരമായ ഈ സന്ദർഭത്തിൽ πρεσβύτεροι പ്രായമായ പുരുഷന്മാരെ പൊതുവായി അല്ല, അംഗീകൃത സമുദായനേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മൂപ്പന്മാർ’ അതിനുള്ള സ്ഥാപിതമായ മലയാള പദമാണ്.
- source_word: εἶπαν
  choice: പറഞ്ഞ
  rationale: അവരുടെ വാക്കുകൾ പിന്നീടാണ് അറിയിക്കപ്പെട്ടത് എന്ന ക്രമം മലയാളത്തിലെ കൃദന്തഘടന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നതിനാൽ പ്രത്യേക ഭൂതപൂർവരൂപം ആവശ്യമില്ല.
