id: ACT.4.7
reference: Acts 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: ml
  text: അവരെ നടുവിൽ നിർത്തിയശേഷം അവർ ചോദിച്ചുതുടങ്ങി:[a] “എന്തു ശക്തിയാലോ ഏതു നാമത്തിലോ നിങ്ങൾ ഇതു ചെയ്തു?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ചോദിച്ചുകൊണ്ടിരുന്നു” എന്നും “അവർ അന്വേഷിച്ചു” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ഇംപെർഫെക്റ്റ് ചോദ്യംചെയ്യൽ ആരംഭിച്ചതിനെക്കാൾ അതു തുടരുകയായിരുന്നുവെന്ന് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσαντες
  choice: നിർത്തിയശേഷം
  rationale: അവരെ നിർത്തിയ പ്രവൃത്തി ചോദ്യംചെയ്യലിനു മുമ്പുണ്ടായതാണെന്ന ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ μέσῳ
  choice: നടുവിൽ
  rationale: സഭയുടെ നടുവിലുള്ള ചോദ്യംചെയ്യൽസാഹചര്യം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്ഥാനാർഥം നിലനിർത്തുന്നു.
- source_word: ἐπυνθάνοντο
  choice: ചോദിച്ചുതുടങ്ങി
  rationale: ഇംപെർഫെക്റ്റിന്റെ ആരംഭസൂചന ഈ വിവരണസന്ദർഭത്തിൽ സാധ്യമായതിനാൽ മുഖ്യപാഠത്തിൽ അതു സ്വീകരിച്ചു; തുടരുന്ന ചോദ്യംചെയ്യൽ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Ἐν ποίᾳ δυνάμει
  choice: എന്തു ശക്തിയാൽ
  rationale: δύναμις എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘ശക്തി’ നിലനിർത്തുകയും ἐν എന്നതിന്റെ ഉപകരണാർഥം മലയാളത്തിലെ ‘-ആൽ’ വിഭക്തിയിലൂടെ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: അല്ലെങ്കിൽ ആരുടെ നാമത്തിൽ
  rationale: ഗ്രീക്കിൽ ചോദ്യംചെയ്യുന്ന പദം രൂപത്തിൽ ‘ഏത്’ എന്നതായിരിക്കുമ്പോഴും നാമം വ്യക്തിയെ പ്രതിനിധീകരിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘ആരുടെ നാമത്തിൽ’ എന്നത് സ്വാഭാവികവും ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുന്നതുമാണ്.
- source_word: ἐποιήσατε τοῦτο
  choice: നിങ്ങൾ ഇതു ചെയ്തു
  rationale: അയോറിസ്റ്റിനെ ലളിതമായ ഭൂതകാലത്തിൽ നൽകുന്നു; ‘ഇതു’ എന്നത് സൗഖ്യമാക്കലിനെയോ അടയാളത്തെയോ വിശദീകരണം ചേർക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: പ്രകടമായ സർവനാമം വിവർത്തനത്തിൽ ഉൾപ്പെടുത്തി ചോദ്യം ആരോടാണെന്നതും ഗ്രീക്കിലെ ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: δύναμις എന്നത് ‘ശക്തി’ എന്നോ ‘അധികാരം’ എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: ശക്തി
  alternative: അധികാരം
  rationale: മൂലപാഠം δύναμις ഉപയോഗിക്കുന്നു; ‘നാമത്തിൽ’ എന്ന സമാന്തരപ്രയോഗം പ്രതിനിധാനാധികാരത്തിന്റെ ആശയം ഇതിനകം വഹിക്കുന്നു. അതിനാൽ പ്രവർത്തിക്കുന്ന ശക്തിയും ആരുടെ നാമമെന്നതും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘നടുവിൽ,’ ‘ശക്തിയാൽ,’ ‘നാമത്തിൽ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ദൃശ്യവും ആശയപരവുമായ ഘടന നിലനിർത്തുന്നു.
