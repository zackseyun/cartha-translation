id: ACT.4.31
reference: Acts 4:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: ml
  text: അവർ പ്രാർഥിച്ചുകഴിഞ്ഞപ്പോൾ, അവർ കൂടിയിരുന്ന[a] സ്ഥലം കുലുങ്ങി. എല്ലാവരും പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞു; അവർ ദൈവവചനം ധൈര്യത്തോടെ[b] പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒന്നിച്ചുകൂടിയിരുന്ന.’ ഗ്രീക്ക് പ്രയോഗം അവർ ഒരുമിച്ചുകൂടിയ നിലയിലായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിർഭയമായി’ അല്ലെങ്കിൽ ‘തുറന്നുപറഞ്ഞുകൊണ്ട്.’ ഈ പദം തുറന്നതും ഭയമില്ലാത്തതുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: അവർ പ്രാർഥിച്ചുകഴിഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള എയോറിസ്റ്റ് പാർട്ടിസിപ്പിൾ മുഖ്യസംഭവത്തിന് മുമ്പുള്ള കൂട്ടായ പ്രാർഥനയെ കാലസൂചനയായി അവതരിപ്പിക്കുന്നു. ‘പ്രാർഥിച്ചുകഴിഞ്ഞപ്പോൾ’ എന്നത് ആ മുൻകാലബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐσαλεύθη
  choice: കുലുങ്ങി
  rationale: സ്ഥലത്തിന് സംഭവിച്ച ഭൗതികമായ ഇളക്കത്തെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് പാസീവിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ τόπος
  choice: സ്ഥലം
  rationale: വിശ്വാസികൾ കൂടിയിരുന്ന ഭൗതിക ഇടത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ പദം.
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: അവർ കൂടിയിരുന്ന
  rationale: ἦσαν എന്ന ക്രിയയും പെർഫെക്റ്റ് പാർട്ടിസിപ്പിളും ചേർന്ന് അവർ ഒന്നിച്ചുകൂടിയ നിലയിൽ അവിടെ ഉണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു. ‘കൂടിയിരുന്ന’ ആ നില സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπλήσθησαν
  choice: നിറഞ്ഞു
  rationale: ലൂക്കോസിന്റെ പരിശുദ്ധാത്മനിറവിന്റെ പ്രയോഗം സംരക്ഷിക്കുകയും പാസീവ് ആശയം മലയാളത്തിലെ സ്വാഭാവിക ഘടനയിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἅπαντες
  choice: എല്ലാവരും
  rationale: സംഘത്തിലെ ഒരാളും ഒഴിവാകാതെ മുഴുവൻ പേരെയും ഊന്നിപ്പറയുന്നു.
- source_word: τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: നിറവിന്റെ ഉറവിടവും പ്രവർത്തകനുമായ പരിശുദ്ധാത്മാവിനെ മലയാളത്തിലെ പതിവുള്ള ബൈബിൾപ്രയോഗത്തിൽ വ്യക്തമാക്കുന്നു; ഇതിലൂടെ പ്രത്യേക വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐλάλουν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയായ പ്രവർത്തനഭാവം ‘കൊണ്ടിരുന്നു’ എന്ന ഘടന നിലനിർത്തുന്നു; ‘പ്രസംഗിച്ചു’ എന്നതിലുപരി ഗ്രീക്കിലെ വിശാലമായ സംസാരാർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ലൂക്കോസിന്റെ ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ പ്രയോഗത്തിന്റെ അർഥവും ബൈബിൾപരമായ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: μετὰ παρρησίας
  choice: ധൈര്യത്തോടെ
  rationale: παρρησία സൂചിപ്പിക്കുന്ന തുറന്നതും ഭയരഹിതവുമായ സംസാരത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മനിറവിന്റെ ഭാഷ
  choice: എല്ലാവരും പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞു
  alternative: എല്ലാവരും പരിശുദ്ധാത്മാവുകൊണ്ട് നിറയ്ക്കപ്പെട്ടു
  rationale: ഈ വാക്യം കൂട്ടത്തിലെ എല്ലാവർക്കും ലഭിച്ച ദൈവിക ശക്തീകരണം പ്രസ്താവിക്കുന്നു. അതിനെ പ്രത്യേകമായ ‘രണ്ടാം അനുഭവം’ എന്നോ മറ്റേതെങ്കിലും വിഭാഗീയ ക്രമീകരണമെന്നോ നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ പ്രസ്താവന മാത്രം നിലനിർത്തുന്നു.
- issue: ἐλάλουν എന്ന ക്രിയയുടെ കാലഭാവം
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  alternative: പറഞ്ഞു / പറയാൻ തുടങ്ങി
  rationale: ഇംപെർഫെക്റ്റ് തുടരുന്ന സാക്ഷ്യപ്രവർത്തനത്തെ വരച്ചുകാട്ടുന്നു; ആരംഭഭാവമോ ഒരൊറ്റ സംഭവമോ പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചാഭാവം ‘പറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പുകളുടെ സ്ഥാനങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, ഗ്രീക്ക് പദങ്ങളോട് യഥാർത്ഥമായി ചേരുന്ന വിധത്തിൽ [a] ‘കൂടിയിരുന്ന’ എന്നതിനും [b] ‘ധൈര്യത്തോടെ’ എന്നതിനും ചേർത്തു.
