id: ACT.4.29
reference: Acts 4:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: ml
  text: ഇപ്പോൾ, കർത്താവേ, അവരുടെ ഭീഷണികളിലേക്കു നോക്കണമേ; അങ്ങയുടെ ദാസന്മാർക്ക് അങ്ങയുടെ വചനം പൂർണ ധൈര്യത്തോടെ സംസാരിക്കാനുള്ള ധൈര്യം നൽകണമേ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: ഇപ്പോൾ
  rationale: പ്രാർഥനയിൽ തിരുവെഴുത്ത് ഉദ്ധരിച്ചതിൽനിന്ന് നിലവിലെ അപേക്ഷയിലേക്കുള്ള സ്വാഭാവിക സംക്രമണം. ഗ്രീക്കിലെ പ്രയോഗം ‘ഇപ്പോൾ’ അഥവാ ‘ഇപ്പോഴത്തെ സാഹചര്യത്തിൽ’ എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ഇപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള പ്രാർഥനാസംബോധന. പുതിയനിയമ പ്രയോഗത്തോടും മലയാളത്തിലെ മാന്യമായ പ്രാർഥനാഭാഷയോടും യോജിക്കുന്നു.
- source_word: ἔπιδε ἐπὶ
  choice: ശ്രദ്ധിക്കണമേ
  rationale: കാണുക എന്ന ദൃശ്യരൂപകത്തിനൊപ്പം പരിഗണിക്കുക, ശ്രദ്ധ ചെലുത്തുക എന്ന അപേക്ഷാഭാവവും ഈ സന്ദർഭത്തിൽ ഉണ്ട്. ‘ശ്രദ്ധിക്കണമേ’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ ആ അഭ്യർഥന വ്യക്തമാക്കുന്നു.
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: അവരുടെ ഭീഷണികൾ
  rationale: ബഹുവചന നാമത്തിന്റെ നേരിട്ടും വ്യക്തവുമായ വിവർത്തനം.
- source_word: δὸς
  choice: കൃപ നൽകണമേ
  rationale: അക്ഷരാർഥത്തിൽ ‘നൽകുക’. ഇവിടെ സംസാരിക്കാനുള്ള കഴിവും അവസരവും നൽകണമെന്ന പ്രാർഥനയായതിനാൽ ‘കൃപ നൽകണമേ’ മാന്യവും സ്വാഭാവികവുമായ അപേക്ഷാരൂപമാണ്; ആവശ്യപ്പെടുന്നതിന്റെ ദൈവദത്ത സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῖς δούλοις σου
  choice: അങ്ങയുടെ ദാസന്മാർക്ക്
  rationale: δοῦλος യജമാനനു കീഴിലുള്ളവനെയും അവന്റെ ഉടമസ്ഥതയിലുള്ളവനെയും സൂചിപ്പിക്കാം. ദൈവത്തോടുള്ള വിനീതസേവനമാണ് ഇവിടെ മുൻനിൽക്കുന്നത്; അതിനാൽ പ്രധാനപാഠത്തിൽ ‘ദാസന്മാർ’ ഉപയോഗിച്ച് ശക്തമായ പദസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: μετὰ παρρησίας πάσης
  choice: പൂർണ ധൈര്യത്തോടെ
  rationale: ഭയമില്ലാത്ത തുറന്ന സംസാരമാണ് παρρησία ഇവിടെ സൂചിപ്പിക്കുന്നത്; πάσης നൽകുന്ന തീവ്രത ‘പൂർണ’ നിലനിർത്തുന്നു.
- source_word: λαλεῖν
  choice: പ്രസ്താവിക്കാൻ
  rationale: അടിസ്ഥാന അർഥം ‘സംസാരിക്കുക’ എന്നാണ്. ഇവിടെ ദൈവവചനം തുറന്നുപറയുന്ന പശ്ചാത്തലത്തിൽ ‘പ്രസ്താവിക്കാൻ’ സ്വാഭാവികമാണ്; ‘പ്രഘോഷിക്കാൻ’ എന്നതിലധികം വ്യാഖ്യാനഭാരം ചുമത്തുന്നില്ല.
- source_word: τὸν λόγον σου
  choice: അങ്ങയുടെ വചനം
  rationale: പ്രവൃത്തികളിൽ λόγος ദൈവത്തിന്റെ അറിയിക്കപ്പെടുന്ന സന്ദേശത്തെ സൂചിപ്പിക്കാറുണ്ട്. ‘വചനം’ ബൈബിൾപ്രയോഗവും ദൈവിക സന്ദേശത്തിന്റെ ധ്വനിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള ബന്ധത്തിൽ δοῦλος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അങ്ങയുടെ ദാസന്മാർ
  alternative: അങ്ങയുടെ അടിമകൾ
  rationale: ഈ പ്രാർഥനയിൽ ദൈവത്തിനു കീഴടങ്ങിയുള്ള വിനീതസേവനമാണ് മുഖ്യമായി മുൻനിൽക്കുന്നത്. അതിനാൽ വായനാസൗകര്യത്തിനും സന്ദർഭത്തിനും ‘ദാസന്മാർ’ തെരഞ്ഞെടുത്തു; എന്നാൽ പദത്തിൽ അടങ്ങിയ യജമാനന്റെ ഉടമസ്ഥതയുടെയും പൂർണ അധീനതയുടെയും ശക്തമായ ആശയം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ പ്രാർഥനാശൈലി ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്’ രൂപവും അപേക്ഷകളിൽ ‘-ണമേ’ രൂപവും സ്വീകരിച്ചു. ഭാഷ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും വാക്യത്തിന്റെ ഗൗരവവും തിരുവെഴുത്തുഭാവവും നിലനിർത്തുന്നു.
