id: ACT.4.9
reference: Acts 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: ml
  text: രോഗിയായ ഒരാളോടു ചെയ്ത ഉപകാരപ്രവൃത്തിയുടെ കാര്യത്തിൽ, ഈ മനുഷ്യൻ ഏത് മാർഗത്തിലൂടെ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നുവെന്ന് ഇന്ന് ഞങ്ങളെ ചോദ്യം ചെയ്യുകയാണെങ്കിൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: ഞങ്ങളെ … ചോദ്യംചെയ്യുകയാണെങ്കിൽ
  rationale: ക്രിയയുടെ ന്യായപരമോ അന്വേഷണപരമോ ആയ ചോദ്യംചെയ്യൽഭാവം നിലനിർത്തുന്നു; ഔപചാരികമായ വിചാരണയാണെന്ന് അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: ചെയ്ത ഒരു നന്മയെക്കുറിച്ച്
  rationale: ἐπί + ദത്തിവ് ഇവിടെ ചോദ്യംചെയ്യലിന്റെ വിഷയമോ അവസരമോ സൂചിപ്പിക്കുന്നു; εὐεργεσία ഒരു ഉപകാരപ്രവൃത്തിയെയാണ് കുറിക്കുന്നത്. ഈ പരിഭാഷ അതിലെ വൈരുധ്യഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: രോഗിയായ ഒരു മനുഷ്യനു
  rationale: സന്ദർഭത്തിൽ ἀσθενής ശാരീരിക ദൗർബല്യത്തെയോ അസ്വാസ്ഥ്യത്തെയോ സൂചിപ്പിക്കുന്നു. വ്യക്തിയുടെ അവസ്ഥയെ ഗ്രീക്ക് പാഠത്തേക്കാൾ കൃത്യമായി നിർവചിക്കാതെ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഭാഷയാണ് തിരഞ്ഞെടുത്തത്.
- source_word: ἐν τίνι
  choice: എന്തിനാൽ
  rationale: ഉപാധി, മാർഗം, അല്ലെങ്കിൽ പ്രവർത്തകശക്തി എന്നിവയെ തുറന്നുവയ്ക്കുന്ന പ്രയോഗമാണിത്. അടുത്ത വാക്യത്തിലെ ഉത്തരം മുൻകൂട്ടി ചേർത്ത് ‘ആരാൽ’ എന്ന് ചുരുക്കുന്നില്ല.
- source_word: σέσωσται
  choice: സൗഖ്യം പ്രാപിച്ചു
  rationale: σῴζω എന്ന ക്രിയയ്ക്ക് രക്ഷിക്കുക, വിടുവിക്കുക, സൗഖ്യമാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ശാരീരികമായി പുനഃസ്ഥാപിക്കപ്പെട്ട മനുഷ്യനാണ് ഉടനെയുള്ള വിഷയം; അതിനാൽ പ്രധാന പാഠത്തിൽ സൗഖ്യത്തിന്റെ അർഥം സ്വീകരിച്ച് വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യസന്ദർഭത്തിൽ σέσωσται (σῴζω) എന്നതിന്റെ പരിഭാഷ
  choice: സൗഖ്യം പ്രാപിച്ചു
  alternative: രക്ഷിക്കപ്പെട്ടു; സുഖം പ്രാപിച്ചു
  rationale: ഉടനെയുള്ള സന്ദർഭം മുമ്പ് നടക്കാൻ കഴിയാതിരുന്ന മനുഷ്യന്റെ ശാരീരിക പുനഃസ്ഥാപനമാണ്. എങ്കിലും പ്രവൃത്തികളുടെ പുസ്തകത്തിൽ σῴζω രക്ഷയുടെ അർഥവും വഹിക്കുന്നതിനാൽ, ആ ദൈവശാസ്ത്രപരമായ അർഥപാളി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ നിബന്ധന അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമമോ പൂർണവിരാമമോ നൽകാതെ കോമ ഉപയോഗിച്ചു. ഇടയ്ക്കുള്ള വിശദീകരണബന്ധം ദീർഘരേഖകൾകൊണ്ട് വ്യക്തമാക്കി.
