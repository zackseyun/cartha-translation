revisions:
- from: രോഗിയായ ഒരു മനുഷ്യനു ചെയ്ത ഒരു നന്മയെക്കുറിച്ച്—ഇയാൾ എന്തിനാൽ സൗഖ്യം പ്രാപിച്ചു[a] എന്നതിനെക്കുറിച്ച്—ഞങ്ങളെ ഇന്ന് ചോദ്യംചെയ്യുകയാണെങ്കിൽ,
  to: രോഗിയായ ഒരാളോടു ചെയ്ത ഉപകാരപ്രവൃത്തിയുടെ കാര്യത്തിൽ, ഈ മനുഷ്യൻ ഏത് മാർഗത്തിലൂടെ സൗഖ്യം പ്രാപിച്ചിരിക്കുന്നുവെന്ന് ഇന്ന് ഞങ്ങളെ ചോദ്യം ചെയ്യുകയാണെങ്കിൽ,
  rationale: The revision improves idiomatic Malayalam and makes the means-question explicit, while preserving the conditional, investigative tone and the Greek perfect. The lexical footnote continues to preserve the healing/salvation semantic overlap of σῴζω.
