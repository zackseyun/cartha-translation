id: ACT.4.14
reference: Acts 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: ml
  text: സൗഖ്യം പ്രാപിച്ച ആ മനുഷ്യൻ അവരോടൊപ്പം നിൽക്കുന്നതു കണ്ടപ്പോൾ, മറുപടിയായി ഒന്നും പറയാൻ അവർക്കുണ്ടായിരുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതിനെതിരെ ഒന്നും പറയാൻ അവർക്കു കഴിഞ്ഞില്ല”; അഥവാ, “ഖണ്ഡിക്കാൻ അവർക്കൊന്നുമുണ്ടായിരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τε
  choice: — (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഈ കണം മുൻവാക്യത്തിലെ സംഭവവികാസവുമായി വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ തുടർച്ച വാക്യഘടനയിലൂടെ തന്നെ വ്യക്തമാകുന്നതിനാൽ ‘കൂടാതെ’ എന്നോ ‘അപ്പോൾ’ എന്നോ ചേർത്ത് അർഥം അധികരിപ്പിച്ചില്ല.
- source_word: ἄνθρωπον
  choice: ആ മനുഷ്യൻ
  rationale: മുൻസന്ദർഭത്തിൽ സൗഖ്യം ലഭിച്ച നിർദിഷ്ട പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആ മനുഷ്യൻ’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: βλέποντες
  choice: കണ്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന ഗ്രഹണത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലസംബന്ധ ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: σὺν αὐτοῖς
  choice: അവരോടൊപ്പം
  rationale: σύν സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വത്തെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἑστῶτα
  choice: നിൽക്കുന്നതു
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണകാല കൃദന്തം തുടരുന്ന നിലയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിൽക്കുന്നതു’ ആ അവസ്ഥയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τεθεραπευμένον
  choice: സൗഖ്യം പ്രാപിച്ച
  rationale: പൂർത്തിയായ സൗഖ്യപ്പെടുത്തലിന്റെ തുടരുന്ന ഫലം വ്യക്തമാക്കുന്നു. കൃത്രിമമായി തോന്നാവുന്ന ‘സൗഖ്യമാക്കപ്പെട്ട’ എന്നതിനെക്കാൾ ഇത് സ്വാഭാവികമാണ്; അതേസമയം അത്ഭുതസൗഖ്യത്തിന്റെ സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: οὐδὲν
  choice: ഒന്നും
  rationale: പറയാനുള്ള യാതൊന്നുമില്ലെന്ന സമ്പൂർണ നിഷേധം മലയാളത്തിലെ നിഷേധക്രിയയോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἶχον ἀντειπεῖν
  choice: മറുപടിയായി ഒന്നും പറയാൻ അവർക്കുണ്ടായിരുന്നില്ല
  rationale: ἔχω + infinitive ഘടനയിലെ ‘പറയാൻ ഒന്നുമില്ല’ എന്ന ആശയവും ἀντειπεῖν എന്നതിലെ പ്രതികരണഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘എതിർത്തുപറയുക’ അല്ലെങ്കിൽ ‘ഖണ്ഡിക്കുക’ എന്ന കൂടുതൽ ശക്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് കൃദന്തങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യഘടനയാക്കി; ἀντειπεῖν എന്ന പദത്തിന്റെ പ്രതികരണം, എതിർപ്പ്, ഖണ്ഡനം എന്നീ അർഥസാധ്യതകൾ മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും ചേർന്ന് സംരക്ഷിച്ചു.
