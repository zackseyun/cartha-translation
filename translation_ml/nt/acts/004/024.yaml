id: ACT.4.24
reference: Acts 4:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: ml
  text: 'അവർ അതു കേട്ടപ്പോൾ, ഒരുമനസ്സോടെ ദൈവത്തോടു സ്വരമുയർത്തി പറഞ്ഞു: “അധിപതിയേ,[a] ആകാശവും ഭൂമിയും സമുദ്രവും അവയിലുള്ള സകലവും സൃഷ്ടിച്ചവൻ അങ്ങാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സർവാധികാരിയായ നാഥാ.” ഗ്രീക്കിലെ Δέσποτα എന്ന അഭിസംബോധന പരമാധികാരത്തെ ഊന്നിപ്പറയുന്നതും κύριος (“കർത്താവ്”) എന്നതിൽനിന്ന് വ്യത്യസ്തവുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: അവർ അതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ കാലസൂചന നൽകുന്ന aorist participle ആണ്. കേട്ട കാര്യത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിനായി ‘അതു’ ചേർത്തിരിക്കുന്നു.
- source_word: ὁμοθυμαδόν
  choice: ഒരുമനസ്സോടെ
  rationale: കൂട്ടായ പ്രവർത്തനത്തിലെ ഐക്യവും ഏകാഭിപ്രായവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἦραν φωνήν
  choice: സ്വരമുയർത്തി
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘സ്വരം’ നിലനിർത്തിക്കൊണ്ട് കൂട്ടായ പ്രാർഥനയുടെ ഏകീകൃത ശബ്ദത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πρὸς τὸν θεόν
  choice: ദൈവത്തോടു
  rationale: പ്രാർഥന ദൈവത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതാണെന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Δέσποτα
  choice: അധിപതിയേ
  rationale: ഉടമസ്ഥതയും പരമാധികാരവും സൂചിപ്പിക്കുന്ന δεσπότης എന്ന അഭിസംബോധനയെ κύριος എന്നതിനു സാധാരണ ഉപയോഗിക്കുന്ന ‘കർത്താവ്’ എന്ന പദത്തിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: σὺ ὁ ποιήσας
  choice: സൃഷ്ടിച്ചവൻ അങ്ങാണ്
  rationale: സർവനാമത്തോടുകൂടിയ articular participle ദൈവത്തെ സ്രഷ്ടാവായി ഊന്നിപ്പറയുന്നു; മലയാളത്തിലെ ആദരസൂചക അഭിസംബോധനയിൽ ആ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: ആകാശവും ഭൂമിയും സമുദ്രവും
  rationale: സൃഷ്ടിയെക്കുറിച്ചുള്ള പരിചിതമായ ത്രിഭാഗ സൂത്രവാക്യം ഓരോ ഘടകവും വ്യക്തമായി നിലനിർത്തി നൽകുന്നു.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: അവയിലുള്ള സകലവും
  rationale: ആകാശം, ഭൂമി, സമുദ്രം എന്നിവയിൽ ഉൾപ്പെടുന്ന സൃഷ്ടിയെയെല്ലാം സമഗ്രമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: Δέσποτα എന്ന ദൈവിക അഭിസംബോധനയുടെ വിവർത്തനം
  choice: അധിപതിയേ
  alternative: സർവാധികാരിയായ നാഥാ; യജമാനനേ; കർത്താവേ
  rationale: ‘അധിപതി’ പരമമായ അധികാരത്തിന്റെ ഭാവം നിലനിർത്തുകയും κύριος എന്ന പദവുമായി കലരാതിരിക്കുകയും ചെയ്യുന്നു. ‘സർവാധികാരിയായ നാഥാ’ അർഥം കൂടുതൽ വിശദീകരിക്കുന്നതെങ്കിലും ഗ്രീക്കിലെ ഏകപദ അഭിസംബോധനയെ വികസിപ്പിക്കുന്നു; ‘യജമാനൻ’ ഉടമസ്ഥതയുടെ ഭാവം ശക്തമാക്കുന്നുവെങ്കിലും ആധുനിക ദൈവിക അഭിസംബോധനയിൽ കുറച്ച് അസ്വാഭാവികമായി കേൾക്കാം.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപം ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ സ്വാഭാവികമാണ്. വാക്യത്തിലെ കൂട്ടായ ഐക്യം ‘ഒരുമനസ്സോടെ’ എന്നും ഗ്രീക്കിലെ ഏകവചന സ്വരഭാവം ‘സ്വരമുയർത്തി’ എന്നും നിലനിർത്തി.
