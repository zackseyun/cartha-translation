id: ACT.4.32
reference: Acts 4:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: ml
  text: വിശ്വസിച്ചവരുടെ സമൂഹത്തിന്റെ ഹൃദയവും ആത്മാവും ഒന്നായിരുന്നു.[a] തനിക്കുള്ളതിൽ ഒന്നും തന്റേതാണെന്ന് അവരിൽ ഒരാൾപോലും പറഞ്ഞില്ല;[b] എല്ലാം അവർക്ക് പൊതുവായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ ആശയാനുവാദമായി: “അവർ എല്ലാം പങ്കിട്ടു.”'
    reason: lexical_alternative
  - marker: b
    text: “തനിക്ക്” എന്ന ഏകവചനം ഗ്രീക്കിലെ വിതരണാത്മക ഏകവചനത്തെ പ്രതിഫലിപ്പിക്കുന്നു; അതായത് ഓരോ വ്യക്തിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθους
  choice: സമൂഹം
  rationale: വലിയൊരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന πλῆθος എന്ന പദത്തിന്റെ അർഥം സാഹചര്യത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും ‘കൂട്ടം’ എന്നതിനെക്കാൾ വിശ്വാസികളുടെ ഒരുമിച്ച സമൂഹം എന്ന ആശയം വ്യക്തമാകുന്നു.
- source_word: τῶν πιστευσάντων
  choice: വിശ്വസിച്ചവരുടെ
  rationale: ക്രിയാരൂപത്തിന്റെ അർഥം നിലനിർത്തി, ‘വിശ്വാസികൾ’ എന്ന നാമവൽക്കരണത്തേക്കാൾ മൂലപാഠത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: καρδία καὶ ψυχὴ μία
  choice: ഒരേ ഹൃദയവും ഒരേ മനസ്സും ഉള്ളവർ
  rationale: ആന്തരികജീവിതത്തിലും ലക്ഷ്യത്തിലും ഉണ്ടായിരുന്ന ആഴമുള്ള ഐക്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം. καρδίαയും ψυχήയും വേർതിരിച്ചു നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐδὲ εἷς
  choice: ഒരാൾപോലും ... ഇല്ല
  rationale: ‘ഒരാൾപോലും’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: തനിക്കുള്ളവയിൽ ഒന്നും
  rationale: ഓരോ വ്യക്തിക്കും ഉണ്ടായിരുന്ന സ്വത്തുക്കളെയോ വസ്തുവകകളെയോ സൂചിപ്പിക്കുന്നു; αὐτῷ എന്ന ഏകവചനത്തിന്റെ വിതരണാത്മക സ്വഭാവം ‘തനിക്ക്’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: സ്വന്തം മാത്രമാണെന്ന് ... പറഞ്ഞില്ല
  rationale: സ്വകാര്യമായതോ തനിക്കു മാത്രമുള്ളതോ എന്ന ἴδιον-ന്റെ ഊന്നൽ നൽകുന്നു; പങ്കുവെക്കലിന്റെ സ്വഭാവത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: πάντα κοινά
  choice: എല്ലാം അവർക്ക് പൊതുവായിരുന്നു
  rationale: ഗ്രീക്കിലെ ബന്ധകക്രിയയോടുകൂടിയ വിധേയഘടനയും κοινά എന്നതിന്റെ പൊതുവായ/shared എന്ന അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേം സഭയിലെ സ്വത്തുക്കളുടെ പൊതുവായ ഉപയോഗം
  choice: ഓരോരുത്തരും തങ്ങളുടെ വസ്തുക്കളെ സ്വന്തം മാത്രമായി കണക്കാക്കാതെ എല്ലാം പൊതുവായി കണ്ടുവെന്ന് വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവർ എല്ലാറ്റിന്റെയും കൂട്ടുടമകളായിരുന്നു’ എന്ന ശക്തമായ വ്യവസ്ഥാപരമായ വ്യാഖ്യാനം, അല്ലെങ്കിൽ പൊതുവായ പങ്കുവെക്കലിനെ ദുർബലപ്പെടുത്തുന്ന വ്യക്തിവാദപരമായ വ്യാഖ്യാനം.
  rationale: മൂലപാഠം സ്വകാര്യ ഉടമസ്ഥതയുടെ അവകാശവാദം നിരാകരിക്കുകയും എല്ലാം പൊതുവായിരുന്നുവെന്ന് പറയുകയും ചെയ്യുന്നു. എന്നാൽ ഇത് ഏതെങ്കിലും പിൽക്കാല രാഷ്ട്രീയ, സാമ്പത്തിക, സഭാപര വ്യവസ്ഥയെ നിർബന്ധമായി സ്ഥാപിക്കുന്നതായി പരിഭാഷ വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയം’ എന്ന പരമ്പരാഗത ബൈബിൾപദത്തോടൊപ്പം ψυχή ഇവിടെ സൂചിപ്പിക്കുന്ന ആന്തരിക മനോഭാവത്തിന് സ്വാഭാവികമായ ‘മനസ്സ്’ ഉപയോഗിച്ചു. ആദ്യത്തെ δέ-യെ പ്രസംഗസന്ദർഭത്തിലെ ബന്ധകമായി കണ്ട് പ്രത്യേകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
