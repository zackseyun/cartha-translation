  rationale: The revision retains the verse’s descriptive account of communal possession without imposing a later social or ecclesial system. It more closely represents καρδία, ψυχή, and μία as ‘ഹൃദയവും ആത്മാവും ഒന്നായിരുന്നു,’ avoids an added restrictive nuance in the private-possession clause, and brings footnote a into line with the English POB audit trail.
