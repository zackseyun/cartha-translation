- from: വിശ്വസിച്ചവരുടെ സമൂഹം ഒരേ ഹൃദയവും ഒരേ മനസ്സും ഉള്ളവരായിരുന്നു.[a] തനിക്കുള്ളവയിൽ ഒന്നും സ്വന്തം മാത്രമാണെന്ന് അവരിൽ ഒരാൾപോലും പറഞ്ഞില്ല;[b] എല്ലാം അവർക്ക് പൊതുവായിരുന്നു.
