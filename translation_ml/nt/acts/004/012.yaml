  rationale: അവസാന ഉപവാക്യം ‘നാം രക്ഷിക്കപ്പെടേണ്ട മറ്റൊരു നാമവും ഇല്ല’ എന്ന് പുനഃക്രമീകരിച്ചു. ഇതിലൂടെ ἐν ᾧ-യുടെ ‘നാമം’ എന്ന മുൻപദത്തോടുള്ള ബന്ധം, രക്ഷയുടെ മാർഗസൂചന, δεῖ-യുടെ അനിവാര്യത എന്നിവ കൂട്ടിച്ചേർക്കാതെയും നഷ്ടപ്പെടുത്താതെയും വ്യക്തമാകുന്നു. അടിക്കുറിപ്പ് നങ്കൂരംയും അതിലെ അംഗീകരിക്കാവുന്ന വ്യാകരണബദലും നിലനിർത്തി.
