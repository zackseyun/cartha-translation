id: ACT.4.12
reference: Acts 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: ml
  text: മറ്റാരിലും രക്ഷയില്ല; എന്തെന്നാൽ, ആകാശത്തിൻ കീഴിൽ മനുഷ്യർക്കിടയിൽ നൽകപ്പെട്ട, നാം രക്ഷിക്കപ്പെടേണ്ട മറ്റൊരു നാമവും ഇല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യർക്കു നൽകപ്പെട്ട.”
    reason: ἐν ἀνθρώποις എന്ന പ്രയോഗം ‘മനുഷ്യർക്കിടയിൽ’ എന്നും സന്ദർഭപരമായി ‘മനുഷ്യർക്കു’ എന്നും ഗ്രഹിക്കാവുന്ന വ്യാകരണസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: σωτηρία
  choice: രക്ഷ
  rationale: ഈ സന്ദർഭത്തിൽ യേശുവിലൂടെയുള്ള വിടുതലിനെയും ദൈവിക രക്ഷയെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: ἐν ἄλλῳ οὐδενί
  choice: മറ്റാരിലും
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സമ്പൂർണമായ ഒഴിവാക്കൽഭാവം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ὄνομα
  choice: നാമം
  rationale: ‘വ്യക്തി’ എന്നോ ‘അധികാരം’ എന്നോ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, വ്യക്തിത്വം, അധികാരം, വെളിപ്പെടുത്തപ്പെട്ട തിരിച്ചറിവ് എന്നിവ ഉൾക്കൊള്ളാവുന്ന ബൈബിൾപ്രയോഗം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: ὑπὸ τὸν οὐρανόν
  choice: ആകാശത്തിൻ കീഴിൽ
  rationale: ലോകവ്യാപകമായ മനുഷ്യപരിധിയെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള ബൈബിൾ ശൈലി നിലനിർത്തുന്നു.
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: മനുഷ്യർക്കിടയിൽ നൽകപ്പെട്ട
  rationale: ἐν എന്നതിന്റെ ‘ഇടയിൽ/മദ്ധ്യേ’ എന്ന അടിസ്ഥാനബോധവും ἀνθρώποις എന്നതിന്റെ സർവമനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന അർഥവും വ്യക്തമാക്കുന്നു; ‘മനുഷ്യർക്കു’ എന്ന ദാതൃവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν ᾧ
  choice: രക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: മലയാളത്തിൽ ‘ആ നാമത്തിൽ/അതിലൂടെ’ എന്ന ആവർത്തനം നിർബന്ധിക്കാതെ, നാമം രക്ഷയുടെ മാർഗമാണെന്ന ബന്ധം ഉദ്ദേശ്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δεῖ σωθῆναι ἡμᾶς
  choice: നാം രക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യതയും σωθῆναι എന്ന കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനോടു ബന്ധപ്പെട്ട രക്ഷയുടെ അനന്യത
  choice: “മറ്റാരിലും രക്ഷയില്ല” എന്ന നിരുപാധിക പ്രസ്താവന നിലനിർത്തി.
  alternative: “രക്ഷയ്ക്ക് മറ്റൊരു വഴിയില്ല” എന്ന മൃദുവാക്കിയ പരാവർത്തനം.
  rationale: ഗ്രീക്ക് പാഠം ഒരു മാർഗത്തിന്റെ മാത്രം അനന്യതയല്ല, മറ്റൊരു വ്യക്തിയിലും രക്ഷയില്ലെന്നതാണ് നേരിട്ട് പറയുന്നത്; അധികമായ സിദ്ധാന്തവിവരണം ചേർക്കാതെ ആ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν ᾧ എന്നതിന്റെ മാർഗസൂചന
  choice: “നാം രക്ഷിക്കപ്പെടേണ്ടതിന്” എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നാമത്തെ രക്ഷയുടെ ഏക അടിസ്ഥാനമായി ബന്ധിപ്പിച്ചു.
  alternative: “ആ നാമത്താൽ നാം രക്ഷിക്കപ്പെടണം” അല്ലെങ്കിൽ “അതിൽ നാം രക്ഷിക്കപ്പെടണം.”
  rationale: ഗ്രീക്കിലെ ബന്ധസർവനാമം ‘നാമം’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്. മലയാളത്തിൽ ആശയം വ്യക്തമായി നിലനിൽക്കുമ്പോൾ അസ്വാഭാവികമായ സ്ഥാനികപ്രയോഗം ഒഴിവാക്കി; രക്ഷയുടെ അനിവാര്യതയോ അനന്യതയോ ദുർബലപ്പെടുത്തിയിട്ടില്ല.
- issue: ἀνθρώποις എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: “മനുഷ്യർക്കിടയിൽ” എന്ന സർവലിംഗസമാവേശക പ്രയോഗം.
  alternative: “മനുഷ്യർക്കു” അല്ലെങ്കിൽ പഴയ ശൈലിയിലെ “മനുഷ്യരുടെ ഇടയിൽ.”
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെയാകെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാത്ത സമാവേശക രൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രഖ്യാപനശൈലി. ‘ആകാശത്തിൻ കീഴിൽ’, ‘നാമം’ എന്നീ ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയപ്പോൾ പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യ സംസ്കൃതഭാരവും ഒഴിവാക്കി.
