    rationale: ‘നാം രക്ഷിക്കപ്പെടേണ്ടതിന്’ എന്നത് പ്രധാനമായും ഉദ്ദേശ്യം (‘so that we may be saved’) സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ‘നാം രക്ഷിക്കപ്പെടേണ്ട [നാമം]’ എന്ന ബന്ധം, നാമത്തിലൂടെ/നാമത്തിൽ രക്ഷിക്കപ്പെടുന്ന മാർഗസൂചനയോടും δεῖ എന്ന അനിവാര്യതയോടും ചേർന്നതാണ്. തിരുത്തിയ ബന്ധരൂപം ഇത് മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃസ്ഥാപിക്കുന്നു.
  revised_text: മറ്റാരിലും രക്ഷയില്ല; എന്തെന്നാൽ, ആകാശത്തിൻ കീഴിൽ മനുഷ്യർക്കിടയിൽ നൽകപ്പെട്ട, നാം രക്ഷിക്കപ്പെടേണ്ട മറ്റൊരു നാമവും ഇല്ല.[a]
