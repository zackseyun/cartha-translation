id: ACT.4.6
reference: Acts 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: ml
  text: മഹാപുരോഹിതനായ ഹന്നാവും കയ്യഫാവും യോഹന്നാനും അലക്സന്തറും മഹാപുരോഹിതവംശത്തിൽപ്പെട്ട എല്ലാവരും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅννας
  choice: ഹന്നാവ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതനായ
  rationale: ഹന്നാവിനോടു ചേർന്നുള്ള ഏകവചന സ്ഥാനപ്പേര് നേരിട്ട് നിലനിർത്തുന്നു; ചരിത്രപരമായി അന്നത്തെ ഔദ്യോഗിക സ്ഥാനധാരി ആരായിരുന്നു എന്ന ചോദ്യം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: Καϊάφας
  choice: കയ്യഫാവ്
  rationale: മലയാള വായനക്കാർക്ക് പരിചിതമായ പരമ്പരാഗത നാമരൂപം.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: ഗ്രീക്ക് നാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സാധാരണ രൂപം.
- source_word: Ἀλέξανδρος
  choice: അലക്സന്തർ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: ὅσοι ἦσαν
  choice: എല്ലാവരും അവിടെ ഉണ്ടായിരുന്നു
  rationale: പട്ടികയുടെ വാക്യഘടനയിൽ സ്വാഭാവികമായ മലയാളം; മുൻവാക്യത്തിൽ നിന്നു മനസ്സിലാകുന്ന കൂടിവന്നിരിക്കുക എന്ന ആശയം അനാവശ്യമായി വികസിപ്പിക്കാതെ സാന്നിധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: മഹാപുരോഹിതകുടുംബത്തിൽപ്പെട്ട
  rationale: γένος എന്നതിലെ കുടുംബം/വംശബന്ധം വ്യക്തമാക്കുകയും ἀρχιερατικός എന്നതിനെ മഹാപുരോഹിതസ്ഥാനവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: കയ്യഫാവാണ് അന്നത്തെ ഔദ്യോഗിക മഹാപുരോഹിതൻ എന്ന ചരിത്രപശ്ചാത്തലത്തിനിടയിലും ഹന്നാവിനെ ὁ ἀρχιερεύς എന്നു വിളിക്കുന്നത്
  choice: “മഹാപുരോഹിതനായ ഹന്നാവ്” എന്ന് ഗ്രീക്ക് പാഠത്തിലെ സ്ഥാനപ്പേര് നേരിട്ട് നിലനിർത്തി.
  alternative: “മുൻ മഹാപുരോഹിതനായ ഹന്നാവ്” അല്ലെങ്കിൽ “മുഖ്യപുരോഹിതനായ ഹന്നാവ്”
  rationale: മൂലപാഠം ഹന്നാവിന് വ്യക്തമായി ὁ ἀρχιερεύς എന്ന സ്ഥാനപ്പേര് നൽകുന്നു. ‘മുൻ’ എന്നു ചേർക്കുന്നത് ചരിത്രപരമായ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യും; ‘മുഖ്യപുരോഹിതൻ’ എന്നു മാറ്റുന്നത് ഏകവചന സ്ഥാനപ്പേരിന്റെ സ്വാഭാവിക അർഥം ദുർബലമാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ ബൈബിൾ വായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതും ലളിതവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പട്ടികയുടെ തുടർച്ചയായതിനാൽ മലയാളത്തിൽ പൂർണ്ണവാക്യമായി സ്വാഭാവികമാക്കാൻ അവസാനം ‘അവിടെ ഉണ്ടായിരുന്നു’ എന്നു നൽകിയിരിക്കുന്നു.
