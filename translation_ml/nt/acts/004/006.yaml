- from: മഹാപുരോഹിതനായ ഹന്നാവും കയ്യഫാവും യോഹന്നാനും അലക്സന്തറും മഹാപുരോഹിതകുടുംബത്തിൽപ്പെട്ട എല്ലാവരും അവിടെ ഉണ്ടായിരുന്നു.
  to: മഹാപുരോഹിതനായ ഹന്നാവും കയ്യഫാവും യോഹന്നാനും അലക്സന്തറും മഹാപുരോഹിതവംശത്തിൽപ്പെട്ട എല്ലാവരും,
  rationale: Removed the unsupported locative and copular completion, retaining the source’s continuation syntax. Replaced “high-priestly family” with “high-priestly lineage” in Malayalam to represent the kinship/descent force of γένος without altering the meaning. No footnote is necessary because the revised wording states the lineage sense directly and no textual ambiguity requires annotation.
