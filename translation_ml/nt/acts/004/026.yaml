id: ACT.4.26
reference: Acts 4:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: ml
  text: ഭൂമിയിലെ രാജാക്കന്മാർ നിലയുറപ്പിച്ചു; ഭരണാധികാരികൾ കർത്താവിനും അവിടുത്തെ മശിഹായ്ക്കും[a] എതിരായി ഒന്നിച്ചുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ക്രിസ്തു”; ഗ്രീക്കുപദത്തിന്റെ അർഥം “അഭിഷിക്തൻ” എന്നാണ്.
    reason: «മശിഹാ» എന്ന പദവിക്കുള്ള പരിചിതമായ ബദൽ നൽകുകയും χριστός എന്ന ഗ്രീക്കുപദത്തിന്റെ അടിസ്ഥാന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യാൻ.
lexical_decisions:
- source_word: παρέστησαν
  choice: നിലയുറപ്പിച്ചു
  rationale: വെറും നിൽക്കുന്നതിനെക്കാൾ, സങ്കീർത്തനം 2:2-ലെ ഉദ്ധരണിക്കനുസരിച്ച് ബോധപൂർവമായ എതിർനിലപാട് സ്വീകരിക്കുന്ന ഭാവം നൽകുന്നു.
- source_word: βασιλεῖς
  choice: രാജാക്കന്മാർ
  rationale: പ്രത്യേകമായ ഭരണപദവിയെ കൃത്യമായി നിലനിർത്തുകയും സങ്കീർത്തനത്തിലെ സമാന്തരഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τῆς γῆς
  choice: ഭൂമിയിലെ
  rationale: ഇവിടെ പ്രാദേശികമായ ‘ദേശം’ എന്നതിനെക്കാൾ വിശാലമായ ലോകവ്യാപക അർഥമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- source_word: ἄρχοντες
  choice: ഭരണാധികാരികൾ
  rationale: രാജാക്കന്മാരോടു സമാന്തരമായി വരുന്ന അധികാരസ്ഥാനത്തുള്ളവരെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: συνήχθησαν
  choice: ഒന്നിച്ചുകൂടി
  rationale: ഗ്രീക്കിലെ കൂട്ടിച്ചേരലിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൃത്യമായ കർമണിപ്രയോഗം മലയാളത്തിൽ കൃത്രിമമായി കേൾക്കുന്നതിനാൽ അർഥസമത്വത്തിന് മുൻഗണന നൽകി.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒന്നിച്ച്
  rationale: ഒരേ സ്ഥലത്തോ ഒരേ ലക്ഷ്യത്തോടെയോ കൂടിച്ചേരുന്നതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατὰ
  choice: എതിരായി
  rationale: രണ്ടു പ്രയോഗങ്ങളിലും ശത്രുതാപരമായ എതിർപ്പിനെ നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണിയിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: χριστοῦ
  choice: മശിഹാ
  rationale: സങ്കീർത്തനം 2:2-ന്റെ പശ്ചാത്തലത്തിൽ ഇത് പേരുപോലെയല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: αὐτοῦ
  choice: അവിടുത്തെ
  rationale: സർവനാമം കർത്താവിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികവും ആദരസൂചകവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 2 ഉദ്ധരണിയിലെ Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശിഹാ
  alternative: ക്രിസ്തു; അഭിഷിക്തൻ
  rationale: ഇവിടെ പദം കർത്താവിനോടു ബന്ധപ്പെടുത്തി ഒരു പദവിയായി വരുന്നതിനാൽ പഴയനിയമത്തിലെ അഭിഷിക്തരാജാവിന്റെ പശ്ചാത്തലം ‘മശിഹാ’ കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു. പുതിയനിയമത്തിലെ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യാത്മക സമാന്തരത നിലനിർത്താൻ അർധവിരാമം ഉപയോഗിച്ചു; അതേസമയം അസ്വാഭാവികമായ കർമണിരൂപം ഒഴിവാക്കി.
