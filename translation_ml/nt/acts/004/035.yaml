- from: അവർ അവ അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ[a][b] വെച്ചുകൊണ്ടിരുന്നു; ഓരോരുത്തനും ആവശ്യമുള്ളതനുസരിച്ച് അത് വിതരണം ചെയ്യപ്പെട്ടുകൊണ്ടിരുന്നു.
