source:
  edition: SBLGNT
  text: καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων· διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: ml
  text: അവർ അവ അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ[a][b] വെച്ചുകൊണ്ടിരുന്നു; ഓരോരുത്തന്, ആർക്കെങ്കിലും ആവശ്യമുണ്ടായിരുന്നതനുസരിച്ച്, അത് വിതരണം ചെയ്യപ്പെട്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അപ്പൊസ്തലന്മാരുടെ മുമ്പിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ’ എന്നാണ്; വിറ്റതിൽനിന്നു ലഭിച്ച തുക അവരുടെ മേൽനോട്ടത്തിൽ ഏൽപ്പിക്കുന്ന ദൃശ്യം ഇതിൽ നിലനിൽക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: '‘വെച്ചുകൊണ്ടിരുന്നു’, ‘വിതരണം ചെയ്യപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്നീ ക്രിയകളുടെ കർമം മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാക്കണം: വിറ്റ വസ്തുക്കളിൽനിന്നു ലഭിച്ച തുക.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: വെച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയ തുടർന്നോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം ആ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ
  rationale: അപ്പൊസ്തലന്മാരുടെ മേൽനോട്ടത്തിൽ ഏൽപ്പിക്കുന്നതെന്ന ആശയം ഉൾക്കൊള്ളുമ്പോഴും, ഗ്രീക്കിലെ മൂർത്തമായ ദൃശ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: διεδίδετο
  choice: വിതരണം ചെയ്യപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല കർമണി രൂപം പതിവായോ തുടർച്ചയായോ നടന്ന വിതരണവും പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് ഘടനയും നിലനിർത്തുന്നു.
- source_word: ἑκάστῳ
  choice: ഓരോരുത്തനും
  rationale: വിതരണം വ്യക്തിവ്യക്തിയായി നടന്നുവെന്ന ഏകവചന വിതരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ഓരോരുത്തനും ആവശ്യമുള്ളതനുസരിച്ച്
  rationale: ആരുടെയെങ്കിലും ആവശ്യത്തിന്റെ അളവിനോ സാഹചര്യത്തിനോ അനുസരിച്ചുള്ള വിതരണം എന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τις
  choice: ഓരോരുത്തനും
  rationale: ഈ സാഹചര്യത്തിലെ അനിശ്ചിത സർവനാമം ലിംഗനിരപേക്ഷവും പൊതുവുമായ അർഥത്തിലാണ്; ἑκάστῳ-യോടൊത്ത് മലയാളത്തിൽ സ്വാഭാവികമായി ഏകീകരിച്ചു.
- source_word: χρείαν
  choice: ആവശ്യം
  rationale: സാധാരണ ജീവിതാവശ്യത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും ആധുനികവുമായ പദം.
theological_decisions:
- issue: വെക്കുകയും വിതരണം ചെയ്യപ്പെടുകയും ചെയ്ത വസ്തു വ്യക്തമാക്കണമോ
  choice: മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന വസ്തുവിനെ ‘അവ’/‘അത്’ എന്ന സർവനാമങ്ങൾകൊണ്ട് മാത്രം സൂചിപ്പിച്ചു.
  alternative: ‘പണം’ അല്ലെങ്കിൽ ‘വിറ്റുകിട്ടിയ തുക’ എന്നു വാചകത്തിൽ വ്യക്തമായി ചേർക്കുക.
  rationale: ഗ്രീക്ക് മൂലത്തിൽ കർമം പരാമർശിക്കപ്പെടാതെ മുൻസന്ദർഭത്തിൽ ആശ്രയിച്ചിരിക്കുന്നു. സർവനാമങ്ങൾ ഉപയോഗിക്കുന്നത് വായനാസൗകര്യം നൽകുകയും മൂലത്തിൽ ഇല്ലാത്ത അധിക നിർവചനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച/ആവർത്തനം ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങളിലൂടെ സംരക്ഷിച്ചു; കർമണി പ്രയോഗവും മൂർത്തമായ ‘കാൽക്കൽ’ എന്ന ദൃശ്യവും നിലനിർത്തി.
