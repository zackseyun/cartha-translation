  yaml_path: translation/nt/acts/004/002.yaml
  text: being greatly disturbed because they were teaching the people and proclaiming in Jesus the resurrection from the dead,[a]
translation:
  language: ml
  text: അവർ ജനത്തെ പഠിപ്പിക്കുകയും യേശുവിൽ മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം പ്രസംഗിക്കുകയും ചെയ്തതുകൊണ്ട് അധികാരികൾ അത്യന്തം അസ്വസ്ഥരായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘യേശുവിന്റെ കാര്യത്തിൽ മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം പ്രസംഗിക്കുകയും’; ‘യേശുവിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗം യേശുവിന്റെ സ്വന്തം ഉയിർപ്പിൽ പ്രകടമായ പുനരുത്ഥാനത്തെ പ്രത്യേകമായി സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: അത്യന്തം അസ്വസ്ഥരായിരുന്നു
  rationale: അധികാരികളുടെ ശക്തമായ അസ്വസ്ഥതയും നീരസവും സൂചിപ്പിക്കുന്നു; വെറും ‘അലോസരപ്പെട്ടു’ എന്നതിനെക്കാൾ തീവ്രത നിലനിർത്തുന്നു, എന്നാൽ അതിരുകടന്ന വികാരഭാവം ചേർക്കുന്നില്ല.
- source_word: διὰ τὸ διδάσκειν
  choice: പഠിപ്പിക്കുകയും … ചെയ്തതുകൊണ്ട്
  rationale: διάയോടുകൂടിയ articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാരണവാക്യമായി സ്വാഭാവികമായി നൽകി.
- source_word: αὐτοὺς
  choice: അവർ
  rationale: മുൻസന്ദർഭത്തിലെ പത്രോസിനെയും യോഹന്നാനെയും സൂചിപ്പിക്കുന്ന സർവനാമം അതേപടി നിലനിർത്തുന്നു; പേരുകളോ ‘അപ്പൊസ്തലന്മാർ’ എന്ന വിശേഷണമോ ചേർക്കുന്നില്ല.
- source_word: τὸν λαὸν
  choice: ജനത്തെ
  rationale: λαός ഒരു കൂട്ടായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ‘ജനത്തെ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καταγγέλλειν
  choice: പ്രസംഗിക്കുകയും
  rationale: പരസ്യമായി അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന അർത്ഥം നൽകുന്നു; ഈ സന്ദർഭത്തിൽ ‘പ്രസംഗിക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: ἐν τῷ Ἰησοῦ
  choice: യേശുവിൽ
  rationale: ἐν എന്നതിന്റെ രൂപപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു; ‘യേശുവിലൂടെ’ എന്ന കാരണോപാധി അർത്ഥത്തിലേക്കോ ‘യേശുവിന്റെ കാര്യത്തിൽ’ എന്ന പ്രത്യേക വ്യാഖ്യാനത്തിലേക്കോ മുഖ്യപാഠത്തെ ചുരുക്കുന്നില്ല.
- source_word: ἀνάστασιν
  choice: പുനരുത്ഥാനം
  rationale: ക്രിസ്തീയ പ്രയോഗത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം; ‘വീണ്ടും എഴുന്നേൽപ്പ്’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: τὴν ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുള്ള
  rationale: ἐκ νεκρῶν എന്നത് മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള ഉയിർപ്പിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായ രൂപം.
theological_decisions:
- issue: ἐν τῷ Ἰησοῦ എന്ന പ്രയോഗവും പുനരുത്ഥാനപ്രഖ്യാപനവും തമ്മിലുള്ള ബന്ധം
  choice: ‘യേശുവിൽ’ എന്ന് സുതാര്യമായി വിവർത്തനം ചെയ്തു; പുനരുത്ഥാനം യേശുവിൽ പ്രകടമായതോ അവനിൽ കേന്ദ്രീകൃതമായതോ എന്ന തുറന്ന അർത്ഥം നിലനിർത്തി.
  alternative: ‘യേശുവിലൂടെ’ (യേശു മുഖാന്തരം ലഭിക്കുന്ന പുനരുത്ഥാനം); ‘യേശുവിന്റെ കാര്യത്തിൽ’ (യേശുവിന്റെ സ്വന്തം പുനരുത്ഥാനം ഉദാഹരണമായി പ്രഖ്യാപിക്കുന്നത്).
  rationale: ἐν ഇവിടെ അടുത്ത ബന്ധമുള്ള ഒന്നിലധികം അർത്ഥസൂചനകൾ അനുവദിക്കുന്നു. മുഖ്യപാഠം ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ, കൂടുതൽ നിർദിഷ്ടമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം’ എന്നതിന്റെ വ്യാപ്തി
  choice: വാചകം യേശുവിന്റെ പുനരുത്ഥാനത്തെയും അവനിൽ തെളിയിക്കപ്പെട്ട പൊതുവായ പുനരുത്ഥാനപ്രത്യാശയെയും ഉൾക്കൊള്ളാൻ അനുവദിക്കുന്നു.
  alternative: യേശുവിന്റെ പുനരുത്ഥാനത്തെ മാത്രം സൂചിപ്പിക്കൽ; യേശുവിൽ അടിസ്ഥാനപ്പെട്ട അന്തിമ പുനരുത്ഥാനോപദേശത്തെ വിശാലമായി സൂചിപ്പിക്കൽ.
  rationale: ഗ്രീക്ക് വാചകം ഈ രണ്ടു ധ്വനികളും ഉണർത്താം; അതിനാൽ വിവർത്തനം അതിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുഖ്യപാഠത്തിൽ ഗ്രീക്കിന്റെ ഘടനയും അർത്ഥതുറപ്പും കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളവാക്യക്രമം ഉപയോഗിച്ചു. ‘അധികാരികൾ’ എന്ന വിഷയം ഗ്രീക്കിലെ participle-ന്റെ മുൻസന്ദർഭപരമായ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കാൻ ചേർത്തതാണ്.
