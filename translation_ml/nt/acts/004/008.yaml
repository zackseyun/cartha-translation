id: ACT.4.8
reference: Acts 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: ml
  text: 'അപ്പോൾ പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ പത്രോസ് അവരോടു പറഞ്ഞു: “ജനത്തിന്റെ ഭരണാധികാരികളേ, മൂപ്പന്മാരേ,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകമാണ്.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: πλησθεὶς πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ
  rationale: πίμπλημι എന്ന ക്രിയയുടെ അഓറിസ്റ്റ് നിഷ്ക്രിയ കൃദന്തരൂപവും πνεύματος ἁγίου എന്ന ജനിറ്റീവ് ഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ആത്മാവ് നിറയ്ക്കുന്ന പ്രവർത്തകനാണെന്ന സൂചന നിലനിർത്തുന്നു.
- source_word: εἶπεν πρὸς αὐτούς
  choice: അവരോടു പറഞ്ഞു
  rationale: നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ ആഖ്യാനപ്രയോഗം.
- source_word: Ἄρχοντες τοῦ λαοῦ
  choice: ജനത്തിന്റെ ഭരണാധികാരികളേ
  rationale: ജനത്തിന്മേൽ ഔദ്യോഗിക അധികാരമുള്ളവരോടുള്ള സംബോധനയെ കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാരേ
  rationale: വെറും പ്രായമേറിയ പുരുഷന്മാരെയല്ല, അംഗീകൃതമായ ഭരണ-സാമുദായിക സ്ഥാനമുള്ള മൂപ്പന്മാരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിന്റെ വിവർത്തനം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധമായ ആത്മാവ്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ ഈ സന്ദർഭത്തിൽ സാക്ഷ്യത്തിനും പ്രസംഗത്തിനും ശക്തി നൽകുന്ന ദൈവിക പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശ്യം; ‘പരിശുദ്ധാത്മാവ്’ എന്ന സ്ഥിരപ്പെട്ട മലയാളരൂപം അധിക ആശയം ചേർക്കാതെ ആ സൂചന വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഔദ്യോഗിക സംബോധന പ്രകടമാക്കാൻ ‘ഭരണാധികാരികളേ, മൂപ്പന്മാരേ’ എന്ന രൂപം ഉപയോഗിച്ചു.
