source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസും യോഹന്നാനും അവരോടു മറുപടി പറഞ്ഞു: “ദൈവത്തിന്റെ മുമ്പാകെ, ദൈവത്തെക്കാൾ നിങ്ങളെ കേൾക്കുന്നതു ശരിയാണോ? നിങ്ങൾതന്നെ വിധിക്കൂ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനപരമായി: “ദൈവത്തെക്കാൾ നിങ്ങളെ അനുസരിക്കുന്നതു.” ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “കേൾക്കുക/ശ്രദ്ധിക്കുക” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അധികാരത്തെ മാനിച്ച് പ്രവർത്തിക്കുക എന്ന ആശയവും അതിനുണ്ട്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: എന്നാൽ പത്രോസും യോഹന്നാനും
  rationale: δέ അധികാരികളുടെ കല്പനയോടുള്ള പ്രതികരണത്തിലെ മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: ἀποκριθέντες ... εἶπον πρὸς αὐτούς
  choice: അവരോടു മറുപടിയായി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും പ്രധാനക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഇരുഘടകങ്ങളും ഭാരമില്ലാത്ത സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δίκαιόν
  choice: ശരി
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിൽ ഉചിതവും നീതിയുക്തവും ആയതിനെ സൂചിപ്പിക്കാൻ നേരിട്ടുള്ള സംഭാഷണത്തിൽ ‘ശരി’ ഏറ്റവും സ്വാഭാവികമാണ്.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള വിലയിരുത്തൽ എന്ന അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀκούειν
  choice: അനുസരിച്ചുകേൾക്കുക
  rationale: ἀκούω എന്നതിന്റെ കേൾക്കുക/ശ്രദ്ധിക്കുക എന്ന പദരൂപവും സന്ദർഭത്തിലെ അധികാരത്തെ അനുസരിക്കുക എന്ന ആശയവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘അനുസരിക്കുക’ മാത്രം എന്നു വിവർത്തനം ചെയ്ത് മൂലത്തിലെ രൂപം മറയ്ക്കുന്നില്ല.
- source_word: μᾶλλον ἢ
  choice: -യെക്കാൾ
  rationale: രണ്ടു അധികാരങ്ങളെ താരതമ്യപ്പെടുത്തി മുൻഗണന വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളഘടനയാണ്.
- source_word: κρίνατε
  choice: നിങ്ങൾതന്നെ വിധിക്കൂ
  rationale: ബഹുവചന ആജ്ഞയും ശ്രോതാക്കൾ സ്വയം വിലയിരുത്തണമെന്ന വെല്ലുവിളിയും വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യാധികാരികളെയും ദൈവത്തെയും സംബന്ധിച്ച വൈരുധ്യത്തിൽ ἀκούειν എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: പ്രധാനപാഠത്തിൽ ‘അനുസരിച്ചുകേൾക്കുക’
  alternative: ‘അനുസരിക്കുക’ അല്ലെങ്കിൽ ‘കേൾക്കുക’
  rationale: സന്ദർഭം അനുസരണത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വ്യക്തമായ ‘അനുസരിക്കുക’ എന്ന ക്രിയയല്ല, ἀκούω ആണ് ഉപയോഗിക്കുന്നത്. സംയുക്തപ്രയോഗം പദത്തിന്റെ ശ്രവണാർഥവും സന്ദർഭത്തിലെ അനുസരണാർഥവും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ലളിതമായ വ്യാഖ്യാനപരമായ പകരം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അനുസരിച്ചുകേൾക്കുക’ സാധാരണ ‘കേൾക്കുക’ എന്നതിലുപരി അധികാരത്തിന് ചെവികൊടുക്കുന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘വിധിക്കൂ’ മൂലത്തിലെ ന്യായവിലയിരുത്തൽ ഭാവം നിലനിർത്തുന്നു.
