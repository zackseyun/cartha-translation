id: ACT.4.30
reference: Acts 4:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: ml
  text: രോഗശാന്തിക്കായി അങ്ങയുടെ കൈ നീട്ടുമ്പോൾ, അങ്ങയുടെ വിശുദ്ധ ദാസനായ[a] യേശുവിന്റെ നാമത്തിലൂടെ അടയാളങ്ങളും അത്ഭുതങ്ങളും സംഭവിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അങ്ങയുടെ വിശുദ്ധ ബാലനായ യേശു.’ ഗ്രീക്കിലെ παῖς (പൈസ്) എന്ന പദത്തിന് ‘കുട്ടി/ബാലൻ’ എന്നും ‘ദാസൻ’ എന്നും അർഥമാകാം. ഇവിടെ യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള ഭാഷയുടെ പ്രതിധ്വനി ഉള്ളതിനാൽ ‘ദാസൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: അങ്ങ് ... നീട്ടുമ്പോൾ
  rationale: ἐν τῷ + infinitive സമകാലിക സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; ‘നീട്ടുമ്പോൾ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നിലനിർത്തുന്നു.
- source_word: τὴν χεῖρά σου
  choice: അങ്ങ് കൈ
  rationale: ദൈവിക പ്രവർത്തനത്തെയും ശക്തിയെയും സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: εἰς ἴασιν
  choice: സൗഖ്യം നൽകാൻ
  rationale: εἰς + accusative ഇവിടെ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു; ἴασις എന്നതിന്റെ ‘സൗഖ്യം/രോഗശാന്തി’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σημεῖα καὶ τέρατα
  choice: അടയാളങ്ങളും അത്ഭുതങ്ങളും
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ സ്ഥിരമായ യുഗ്മപ്രയോഗം; അധിക വ്യാഖ്യാനം ചേർക്കാതെ രണ്ടു പദങ്ങളും വേർതിരിച്ച് നിലനിർത്തുന്നു.
- source_word: γίνεσθαι
  choice: സംഭവിക്കട്ടെ
  rationale: പ്രാർഥനയുടെ ആശ്രിതവാക്യഘടനയിൽ സംഭവങ്ങൾ ഉണ്ടാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രാർഥനാഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: διὰ τοῦ ὀνόματος
  choice: നാമത്തിലൂടെ
  rationale: διά + genitive-ന്റെ ഉപാധി/മാധ്യമ അർഥം നിലനിർത്തുകയും ‘നാമം’ എന്ന ബൈബിൾ ആശയം അധികമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: അങ്ങയുടെ വിശുദ്ധ ദാസനായ യേശു
  rationale: παῖς എന്നതിന് ‘കുട്ടി/പുത്രൻ’ എന്നും ‘ദാസൻ’ എന്നും അർഥമാകാം; അപ്പൊസ്തലപ്രവൃത്തികൾ 3–4-ലെ യെശയ്യാവിന്റെ ദാസപ്രതിധ്വനി കാരണം മുഖ്യപാഠത്തിൽ ‘ദാസൻ’ സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെ സംബന്ധിച്ച παῖς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദാസൻ
  alternative: കുട്ടി; പുത്രൻ
  rationale: പദത്തിന് യഥാർഥമായ അർഥദ്വയമുണ്ടെങ്കിലും, അപ്പൊസ്തലപ്രവൃത്തികൾ 3:13, 3:26, 4:27, 4:30 എന്നിവയിലെ യെശയ്യാവിന്റെ ദാസഭാഷ മുഖ്യപാഠത്തിൽ ‘ദാസൻ’ എന്ന വായനയെ അനുകൂലിക്കുന്നു. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പ്രാർഥനാഭാഷ. ദൈവത്തെ അഭിസംബോധന ചെയ്യാൻ ‘അങ്ങ്/അങ്ങയുടെ’ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിലെ അപേക്ഷ തുടരുന്നതിനാൽ ‘സംഭവിക്കട്ടെ’ എന്ന ആശംസാ-പ്രാർഥനാരൂപം സ്വീകരിച്ചു; മൂലത്തിലെ അർഥബന്ധങ്ങൾ അതേസമയം നിലനിർത്തി.
