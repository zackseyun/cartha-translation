  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ കഥനശൈലി. ‘സൻഹെദ്രിൻ’ എന്ന ലിപ്യന്തരണം ഒഴിവാക്കി പ്രവർത്തനപരമായ ‘ന്യായാധിപസഭ’ ഉപയോഗിച്ചു; എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ സമിതി/സമ്മേളനം എന്ന ഇരട്ടസാധ്യത വിവർത്തനം പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
