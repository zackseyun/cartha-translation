- from: എന്നാൽ അവരോട് ന്യായാധിപസഭയുടെ മുമ്പിൽനിന്ന് പുറത്തുപോകാൻ കല്പിച്ചശേഷം, അവർ പരസ്പരം ആലോചിച്ചുകൊണ്ടിരുന്നു,[a]
