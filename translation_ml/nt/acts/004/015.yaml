  text: But after ordering them to go outside the council[a], they began conferring with one another[b],
translation:
  language: ml
  text: എന്നാൽ അവരോട് ന്യായാധിപസഭയ്ക്കു പുറത്തേക്കു പോകാൻ കൽപ്പിച്ചശേഷം,[a] അവർ പരസ്പരം ആലോചിച്ചുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൻഹെദ്രിനിനു പുറത്തേക്കു.” ഗ്രീക്കിലെ συνέδριον യഹൂദ ഭരണസമിതിയെയോ അതിന്റെ സമ്മേളിച്ചിരിക്കുന്ന യോഗത്തെയോ സൂചിപ്പിക്കാം.
