id: ACT.4.22
reference: Acts 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: ml
  text: കാരണം, രോഗശാന്തിയുടെ ഈ അടയാളം[a] സംഭവിച്ച ആ മനുഷ്യന് നാല്പതിലേറെ വയസ്സുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഈ രോഗശാന്തിയുടെ അടയാളം’ അല്ലെങ്കിൽ ‘രോഗശാന്തിയാകുന്ന ഈ അത്ഭുതം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: നാല്പതിലേറെ വയസ്സുണ്ടായിരുന്നു
  rationale: താരതമ്യപദത്തോടുകൂടിയ ഗ്രീക്ക് പ്രയോഗം പ്രായത്തെ സൂചിപ്പിക്കുന്നു. ആ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണപരമായ അടിസ്ഥാനം നൽകുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ഇതിനകം അറിയപ്പെടുന്ന ഒരു നിർദിഷ്ട പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐφ’ ὃν
  choice: സംഭവിച്ച ആ മനുഷ്യന്
  rationale: സംഭവം ബാധിച്ച വ്യക്തിയുമായുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ദാതൃവിഭക്തിയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: γεγόνει
  choice: സംഭവിച്ച
  rationale: പൂർത്തിയായ മുൻസംഭവത്തെ സൂചിപ്പിക്കുകയും, ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത പ്രവർത്തകനെ പരിഭാഷയിൽ അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ σημεῖον τοῦτο
  choice: ഈ അടയാളം
  rationale: σημεῖον എന്ന പദത്തിന്റെ സാക്ഷ്യപരവും വെളിപ്പെടുത്തൽപരവുമായ ഭാവം നിലനിർത്തുന്നു; ‘അത്ഭുതം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: τῆς ἰάσεως
  choice: രോഗശാന്തിയുടെ
  rationale: ἴασις സൂചിപ്പിക്കുന്ന സൗഖ്യം അല്ലെങ്കിൽ രോഗമുക്തി ഇവിടെ വ്യക്തവും പതിവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: അത്ഭുതസംഭവത്തിന്റെ പശ്ചാത്തലത്തിൽ σημεῖον പരിഭാഷപ്പെടുത്തൽ
  choice: അടയാളം
  alternative: അത്ഭുതം
  rationale: സംഭവം വെറും വിസ്മയപ്രവൃത്തിയല്ല, അർഥസൂചകമായ സാക്ഷ്യവുമാണെന്ന ലൂക്കോസിന്റെ പദപ്രയോഗം ‘അടയാളം’ നിലനിർത്തുന്നു.
- issue: γεγόνει-ൽ പ്രവർത്തകത്വം സൂചിപ്പിക്കണമോ
  choice: സംഭവിച്ച
  alternative: നടത്തപ്പെട്ട
  rationale: ഗ്രീക്ക് വാക്യം സംഭവത്തെ മുൻനിർത്തുന്നു; പ്രവർത്തകനെ സ്പഷ്ടമായി പറയുന്നില്ല. അതിനാൽ പരിഭാഷയും പ്രവർത്തകത്വം കൂടുതലായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘നാല്പതിലേറെ’ എന്നത് പ്രായപ്രയോഗത്തിൽ സ്വാഭാവികമാണ്; ‘അടയാളം’ ലൂക്കോസിന്റെ θεολογിക സൂചന നിലനിർത്തുന്നു.
