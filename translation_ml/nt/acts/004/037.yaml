id: ACT.4.37
reference: Acts 4:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: ml
  text: അവനു സ്വന്തമായി ഒരു വയൽ ഉണ്ടായിരുന്നതിനാൽ[a], അവൻ അതു വിറ്റ് പണം[b] കൊണ്ടുവന്ന് അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന് ഒരു വയൽ ഉണ്ടായിരുന്നതിനാൽ’ അല്ലെങ്കിൽ ‘ഒരു വയൽ ഉണ്ടായിരുന്ന അവൻ.’ പശ്ചാത്തലസാഹചര്യം നൽകുന്ന ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയാണ് ഗ്രീക്കിലുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിൽപ്പനത്തുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: അവനു സ്വന്തമായി ഒരു വയൽ ഉണ്ടായിരുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ὑπάρχω ഇവിടെ അവനോടുള്ള ഉടമസ്ഥബന്ധം പ്രകടമാക്കുന്നതിനാൽ, ‘സ്വന്തമായി ... ഉണ്ടായിരുന്നതിനാൽ’ എന്നത് അർത്ഥവും സാഹചര്യബന്ധവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀγροῦ
  choice: ഒരു വയൽ
  rationale: ἀγρός സാധാരണയായി വയലിനെയോ ഒരു ഭൂപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘വയൽ’ നേരിട്ടും മതിയായ വിശാലതയോടെയും അർത്ഥം നൽകുന്നു.
- source_word: πωλήσας
  choice: അവൻ അതു വിറ്റ്
  rationale: അയോറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയകൾക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘അതു വിറ്റ്’ എന്ന രൂപം സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘അതു’ വയലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἤνεγκεν
  choice: കൊണ്ടുവന്ന്
  rationale: φέρω ഇവിടെ ഒരു വസ്തു ലക്ഷ്യസ്ഥാനത്തേക്ക് കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘വെച്ചു’ എന്ന ക്രിയയുമായി ‘കൊണ്ടുവന്ന്’ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: τὸ χρῆμα
  choice: പണം
  rationale: χρῆμα ഇവിടെ വയൽ വിറ്റുകിട്ടിയ പണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പണം’ നേരിട്ടുള്ള പരിഭാഷയാണ്; ‘വിൽപ്പനത്തുക’ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: ἔθηκεν
  choice: വെച്ചു
  rationale: τίθημι എന്നത് വെക്കുക, സ്ഥാപിക്കുക എന്നീ അർത്ഥങ്ങൾ നൽകുന്നു. ‘കാൽക്കൽ വെച്ചു’ എന്നത് മൂലപാഠത്തിലെ ദൃശ്യബിംബം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ
  rationale: ഈ പരിഭാഷ പണത്തെ അപ്പൊസ്തലന്മാരുടെ മുമ്പിൽ അവരുടെ മേൽനോട്ടത്തിനായി വെച്ച യഥാർഥ പ്രവൃത്തിയുടെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പണം അപ്പൊസ്തലന്മാരുടെ അധികാരപരിധിയിൽ സമർപ്പിച്ചതിന്റെ ഭൗതിക ദൃശ്യരൂപം നിലനിർത്തണമോ എന്നത്
  choice: ‘അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ വെച്ചു’ എന്ന മൂർത്തമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘അപ്പൊസ്തലന്മാർക്കു കൊടുത്തു’ എന്ന് അർത്ഥം മാത്രം നൽകുക.
  rationale: വാക്യം യഥാർഥമായ ഒരു സമർപ്പണപ്രവൃത്തി വിവരിക്കുന്നതോടൊപ്പം സമ്മാനം അപ്പൊസ്തലന്മാരുടെ മേൽനോട്ടത്തിനു വിട്ടുകൊടുത്തുവെന്ന സാമൂഹിക സൂചനയും വഹിക്കുന്നു. മൂലപ്രയോഗം നിലനിർത്തുന്നത് അധികമായ സഭാശാസ്ത്രപരമായ അവകാശവാദങ്ങൾ ചേർക്കാതെ ഇരു വശവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അവൻ’ മൂലപാഠത്തിലെ സർവനാമത്തെ അധിക ബഹുമാനസൂചന ചേർക്കാതെ പ്രതിനിധീകരിക്കുന്നു; ‘കാൽക്കൽ വെച്ചു’ എന്ന ദൃശ്യപ്രയോഗം അതേപടി സംരക്ഷിച്ചു.
