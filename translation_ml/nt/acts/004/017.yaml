source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα μὴ ἐπὶ πλεῖον διανεμηθῇ εἰς τὸν λαόν, ⸀ἀπειλησώμεθα αὐτοῖς μηκέτι λαλεῖν ἐπὶ τῷ ὀνόματι τούτῳ μηδενὶ ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: ml
  text: എന്നാൽ ഇത് ജനങ്ങളുടെ ഇടയിൽ കൂടുതൽ വ്യാപിക്കാതിരിക്കാൻ, ഈ നാമത്തിൽ ഇനി ആരോടും സംസാരിക്കരുതെന്ന് നമുക്ക് അവരെ ഭീഷണിപ്പെടുത്താം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭീഷണിപ്പെടുത്താം’ എന്നതിന് സന്ദർഭാനുസരിച്ച് ‘കർശനമായി താക്കീത് ചെയ്യാം’ എന്നും പറയാം. എന്നാൽ ഗ്രീക്ക് ക്രിയയ്ക്ക് അധികാരികൾ നടത്തുന്ന ഭീഷണിപ്പെടുത്തലിന്റെ ശക്തമായ ഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: വ്യാപിക്കാതിരിക്കാൻ
  rationale: സന്ദർഭത്തിൽ അപ്പൊസ്തലന്മാരുടെ പ്രവൃത്തിയെയും സന്ദേശത്തെയും കുറിച്ചുള്ള വാർത്ത ജനങ്ങളുടെ ഇടയിൽ പരക്കുന്നതാണ് ഉദ്ദേശ്യം; ‘വ്യാപിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἐπὶ πλεῖον
  choice: ഇനിയും കൂടുതൽ
  rationale: നിലവിലെ പരിധിക്കപ്പുറം വ്യാപിക്കുന്നതെന്ന താരതമ്യബലം നിലനിർത്തുന്നു.
- source_word: εἰς τὸν λαόν
  choice: ജനങ്ങളുടെ ഇടയിൽ
  rationale: പൊതുജനസമൂഹത്തിലേക്കുള്ള വ്യാപനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπειλησώμεθα
  choice: നമുക്ക് അവരെ ഭീഷണിപ്പെടുത്താം
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ അധികാരപരമായ ഭീഷണി നേരിട്ട് നിലനിർത്തുന്നു; ന്യായസഭയുടെ ബലപ്രയോഗസ്വഭാവമുള്ള നിലപാടിനും യോജിക്കുന്നു.
- source_word: μηκέτι λαλεῖν
  choice: ഇനി ... സംസാരിക്കരുതെന്ന്
  rationale: μηκέτιയുടെ ‘ഇനി മുതൽ അരുത്’ എന്ന കാലപരവും നിഷേധാത്മകവുമായ ബലം സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: ഈ നാമത്തിൽ
  rationale: ആ നാമത്തോടുള്ള ബന്ധത്തെയോ അതിന്റെ അധികാരത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സാധ്യതാപരിധിയും സംരക്ഷിക്കുന്നു.
- source_word: μηδενὶ ἀνθρώπων
  choice: ആരോടും
  rationale: വിലക്കപ്പെട്ട സംസാരത്തിന്റെ ശ്രോതാക്കളെ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സഭയുടെ പ്രതികരണത്തിൽ ἀπειλησώμεθα എന്ന ക്രിയയുടെ ബലം
  choice: പ്രധാനവാക്യത്തിൽ ‘ഭീഷണിപ്പെടുത്താം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർശനമായി താക്കീത് ചെയ്യാം’ അല്ലെങ്കിൽ ‘മുന്നറിയിപ്പ് നൽകാം’
  rationale: ഗ്രീക്ക് ക്രിയ വെറും സൗമ്യമായ മുന്നറിയിപ്പിനേക്കാൾ ശക്തമായ അധികാരപരമായ ഭീഷണിയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ അതിന്റെ ബലം മൃദൂകരിക്കാതെ പ്രധാനവാക്യത്തിൽ നിലനിർത്തി; മലയാളത്തിൽ സാധ്യതയുള്ള മൃദുവായ പദപ്രയോഗം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: ἐπὶ τῷ ὀνόματι τούτῳ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘ഈ നാമത്തിൽ’ എന്ന സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ഈ നാമത്തിന്റെ അധികാരത്തിൽ’ അല്ലെങ്കിൽ ‘ഈ നാമത്തെക്കുറിച്ച്’
  rationale: സന്ദർഭത്തിൽ അധികാരവും ബന്ധവും വിഷയവും ഉൾപ്പെടാവുന്നതിനാൽ ഒരൊറ്റ വ്യാഖ്യാനം വാചകത്തിൽ നിർബന്ധിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഈ നാമത്തിൽ’ എന്ന ബൈബിൾപ്രയോഗം അതിന്റെ യഥാർഥ അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
