id: ACT.26.21
reference: Acts 26:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕνεκα τούτων ⸂με Ἰουδαῖοι⸃ ⸀συλλαβόμενοι ἐν τῷ ἱερῷ ἐπειρῶντο διαχειρίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/021.yaml
  text: Because of these things the Jews seized me in the temple and were trying to kill me[a][b].
translation:
  language: ml
  text: ഇവ നിമിത്തം യെഹൂദന്മാർ ദൈവാലയത്തിൽവെച്ച് എന്നെ പിടികൂടി കൊല്ലാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇക്കാരണത്താൽ’ അല്ലെങ്കിൽ ‘ഈ കാര്യങ്ങൾ നിമിത്തം.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ദൈവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ പ്രത്യേകമായി അല്ല, ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἕνεκα τούτων
  choice: ഇവ നിമിത്തം
  rationale: ἕνεκα + genitive കാരണമോ നിമിത്തമോ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം പൗലോസ് മുമ്പ് വിവരിച്ച കാര്യങ്ങളിലേക്കു പിന്നോട്ടു ചൂണ്ടുന്ന കാരണബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: με
  choice: എന്നെ
  rationale: συλλαβόμενοι എന്ന participle-ന്റെ ഏകവചന പ്രഥമപുരുഷ കർമരൂപം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: സംഭവത്തിൽ പൗലോസിനെ പിടികൂടിയ യെഹൂദ എതിരാളികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മുഴുവൻ യെഹൂദജനതയെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്ന അർഥം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- source_word: συλλαβόμενοι
  choice: പിടികൂടി
  rationale: വൈരപരമായ സാഹചര്യത്തിൽ ഒരാളെ പിടിച്ചെടുക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഔദ്യോഗിക അറസ്റ്റിനെ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽവെച്ച്
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദൈവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ പൊതുപദം ഉപയോഗിച്ച് പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπειρῶντο
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: imperfect രൂപത്തിലെ തുടരുന്ന ശ്രമത്തിന്റെ ഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διαχειρίσασθαι
  choice: കൊല്ലാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ബലമായി ജീവനൊടുക്കുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തവും നേരിട്ടുമായ ഭാഷയിൽ നൽകുന്നു; ‘കൊലപ്പെടുത്താൻ’ എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത നിയമപരമോ നൈതികമോ ആയ അധികനിറം നൽകാം.
theological_decisions:
- issue: വിവാദസാധ്യതയുള്ള സന്ദർഭത്തിലെ Ἰουδαῖοι എന്ന പരാമർശം
  choice: സംഭവത്തിൽ പങ്കെടുത്ത നിർദിഷ്ട യെഹൂദ എതിരാളികളെ സന്ദർഭാനുസൃതമായി സൂചിപ്പിക്കുന്ന ‘യെഹൂദന്മാർ’
  alternative: ‘ചില യെഹൂദന്മാർ’ അല്ലെങ്കിൽ ‘ആ യെഹൂദന്മാർ’
  rationale: മൂലപാഠത്തിൽ ‘ചില’ ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല; അതേസമയം ഈ വാക്യം മുഴുവൻ യെഹൂദജനതയെക്കുറിച്ചുള്ള കുറ്റാരോപണമാണെന്ന വ്യാഖ്യാനവും വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. ‘ശ്രമിച്ചുകൊണ്ടിരുന്നു’ imperfect aspect നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
