revisions:
- from: ഇപ്പോൾ, ദൈവം നമ്മുടെ പിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദത്തത്തിലെ പ്രത്യാശ നിമിത്തമാണ് ഞാൻ വിചാരണ നേരിട്ടുകൊണ്ട് ഇവിടെ നിൽക്കുന്നത്.[a]
  to: ഇപ്പോൾ ഞാൻ വിചാരണ നേരിടുന്നത്, ദൈവം നമ്മുടെ പിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദത്തത്തെക്കുറിച്ചുള്ള പ്രത്യാശ നിമിത്തമാണ്.[a]
