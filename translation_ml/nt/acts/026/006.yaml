  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν ἐπ’ ἐλπίδι τῆς ⸀εἰς τοὺς πατέρας ⸀ἡμῶν ἐπαγγελίας γενομένης ὑπὸ τοῦ θεοῦ ἕστηκα κρινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/006.yaml
  text: And now I stand on trial because of the hope of the promise made by God to our fathers,[a]
translation:
  language: ml
  text: ഇപ്പോൾ ഞാൻ വിചാരണ നേരിടുന്നത്, ദൈവം നമ്മുടെ പിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദത്തത്തെക്കുറിച്ചുള്ള പ്രത്യാശ നിമിത്തമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ പൂർവികർക്ക്.’ ഗ്രീക്കിൽ ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നാണ്; ഇവിടെ ഇസ്രായേലിന്റെ പിതൃപുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: ഇപ്പോൾ
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട് പൗലൊസിന്റെ ഇപ്പോഴത്തെ ന്യായവിസ്താരസ്ഥിതിയിലേക്കുള്ള മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐπ’ ἐλπίδι
  choice: പ്രത്യാശ നിമിത്തമാണ്
  rationale: ἐπί + ദത്തിവ് ഇവിടെ അടിസ്ഥാനം അഥവാ കാരണം സൂചിപ്പിക്കുന്നു; പൗലൊസ് വിചാരണ നേരിടുന്നതിന്റെ കാരണം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπαγγελίας
  choice: വാഗ്ദത്തത്തിലെ
  rationale: പ്രത്യാശ ദൈവത്തിന്റെ വാഗ്ദത്തവുമായി അഭേദ്യമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. ഷഷ്ഠീബന്ധത്തിലെ അർത്ഥവ്യാപ്തി അനാവശ്യമായി തീർപ്പാക്കാതെ ‘വാഗ്ദത്തത്തിലെ പ്രത്യാശ’ എന്നു നിലനിർത്തുന്നു.
- source_word: τῆς εἰς τοὺς πατέρας ἡμῶν ἐπαγγελίας
  choice: നമ്മുടെ പിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദത്തം
  rationale: εἰς എന്നത് വാഗ്ദത്തത്തിന്റെ സ്വീകർത്താക്കളിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പിതാക്കന്മാർക്കു നൽകിയ’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: γενομένης ὑπὸ τοῦ θεοῦ
  choice: ദൈവം ... നൽകിയ
  rationale: ὑπὸ τοῦ θεοῦ വ്യക്തമാക്കുന്ന ദൈവിക പ്രവർത്തകത്വം സജീവവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; γενομένης ഇവിടെ വാഗ്ദത്തം നൽകപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πατέρας ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനവും ഇസ്രായേലിന്റെ ഉടമ്പടിചരിത്രപരമായ പശ്ചാത്തലവും സംരക്ഷിക്കുന്നു.
- source_word: ἕστηκα
  choice: ഇവിടെ നിൽക്കുന്നത്
  rationale: പൂർണ്ണകാലരൂപത്തിന് ഇപ്പോഴത്തെ നിലയെ സൂചിപ്പിക്കുന്ന stative force ഉണ്ട്; കോടതിസന്ദർഭത്തിൽ ‘നിൽക്കുന്നത്’ സ്വാഭാവികമാണ്. ‘ഇവിടെ’ മലയാളത്തിൽ സന്ദർഭം വ്യക്തമാക്കുന്ന സ്വാഭാവിക പൂരകമാണ്.
- source_word: κρινόμενος
  choice: വിചാരണ നേരിട്ടുകൊണ്ട്
  rationale: നിലവിലുള്ള ന്യായവിസ്താരസ്ഥിതി നിയമപരമായ അർത്ഥത്തോടെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നമ്മുടെ പിതാക്കന്മാർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഇസ്രായേലിന്റെ പിതാക്കന്മാർ/ഉടമ്പടിപൂർവികർ എന്ന പരമ്പരാഗത പ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘നമ്മുടെ പൂർവികർ’ എന്നു ലിംഗനിരപേക്ഷമായി പരിഭാഷപ്പെടുത്തുക
  rationale: πατέρας എന്നത് വ്യക്തമായി ‘പിതാക്കന്മാർ’ എന്നാണ്; അഗ്രിപ്പാവിന്റെ മുമ്പിലെ പൗലൊസിന്റെ പ്രസംഗത്തിൽ ഇത് ഇസ്രായേലിന്റെ വാഗ്ദത്തചരിത്രത്തെ ഉണർത്തുന്നു. കൂടുതൽ പൊതുവായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘വാഗ്ദത്തത്തിലെ പ്രത്യാശ’ എന്ന ഷഷ്ഠീബന്ധം
  choice: ബന്ധത്തിന്റെ യഥാർഥ വ്യാപ്തി നിലനിർത്തുന്ന ‘വാഗ്ദത്തത്തിലെ പ്രത്യാശ’
  alternative: ‘വാഗ്ദത്തത്തിൽ വെച്ചിരിക്കുന്ന പ്രത്യാശ’ അല്ലെങ്കിൽ ‘വാഗ്ദത്തം നിവൃത്തിയാകുമെന്ന പ്രത്യാശ’
  rationale: ഗ്രീക്ക് τῆς ... ἐπαγγελίας എന്ന ഷഷ്ഠീബന്ധത്തെ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ, പ്രത്യാശയും വാഗ്ദത്തവും തമ്മിലുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കോടതിപ്രയോഗം സ്വീകരിച്ചു. ‘വാഗ്ദത്തം,’ ‘പ്രത്യാശ,’ ‘പിതാക്കന്മാർ’ എന്നീ ബൈബിൾ-ദൈവശാസ്ത്രപര പദങ്ങൾ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തി; വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക ഊന്നലിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
