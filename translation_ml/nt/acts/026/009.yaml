id: ACT.26.9
reference: Acts 26:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν οὖν ἔδοξα ἐμαυτῷ πρὸς τὸ ὄνομα Ἰησοῦ τοῦ Ναζωραίου δεῖν πολλὰ ἐναντία πρᾶξαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/009.yaml
  text: So I myself indeed thought that I ought to do many things in opposition to the name of Jesus the Nazarene[a].
translation:
  language: ml
  text: അതുകൊണ്ട്, നസറായനായ യേശുവിന്റെ നാമത്തിനെതിരെ പലതും പ്രവർത്തിക്കേണ്ടതാണെന്ന് ഞാൻ തന്നെ കരുതിയിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നസറത്തിൽനിന്നുള്ള യേശുവിന്റെ നാമത്തിനെതിരെ.’
    reason: Ναζωραῖος എന്ന വിശേഷണം ‘നസറായൻ’ എന്നും ‘നസറത്തിൽനിന്നുള്ളവൻ’ എന്നും സ്വാഭാവികമായി അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: Ἐγὼ
  choice: ഞാൻതന്നെ
  rationale: ഗ്രീക്കിൽ വ്യക്തിപ്രത്യയം പ്രത്യേകം ചേർത്തിരിക്കുന്നത് ഊന്നലിനാണ്; ‘ഞാൻതന്നെ’ പൗലോസിന്റെ ആത്മസമ്മതത്തിലെ ആ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: μὲν οὖν
  choice: അതുകൊണ്ട്
  rationale: οὖν മുൻവിവരണത്തിൽനിന്നുള്ള തുടർച്ചയെയോ നിഗമനത്തെയോ സൂചിപ്പിക്കുന്നു. μέν നൽകുന്ന നേരിയ ഊന്നൽ മലയാളത്തിൽ വാക്യക്രമവും ‘ഞാൻതന്നെ’ എന്ന പ്രയോഗവും സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ വേറൊരു കണം ചേർത്ത് വാക്യം ഭാരപ്പെടുത്തുന്നില്ല.
- source_word: ἔδοξα ἐμαυτῷ
  choice: കരുതിയിരുന്നു
  rationale: ഈ പ്രയോഗം വ്യക്തിയുടെ സ്വന്തം വിലയിരുത്തലിനെയോ ധാരണയെയോ സൂചിപ്പിക്കുന്നു. മുൻകാല മനോഭാവം വ്യക്തമാക്കാൻ ‘കരുതിയിരുന്നു’ സ്വാഭാവികമാണ്; ἐμαυτῷയിലെ സ്വയംസംബന്ധമായ ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നും പ്രതിഫലിക്കുന്നു.
- source_word: πρὸς τὸ ὄνομα
  choice: നാമത്തിനെതിരെ
  rationale: ἐναντία πρᾶξαι എന്നതിനോടൊപ്പം πρός ഇവിടെ എതിർപ്പിന്റെ അർഥം നൽകുന്നു. ‘നാമത്തിനെതിരെ’ എന്നത് വ്യക്തി, പ്രസിദ്ധി, അധികാരം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ബൈബിൾപ്രയോഗത്തെ ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ τοῦ Ναζωραίου
  choice: നസറായനായ യേശു
  rationale: Ναζωραῖος യേശുവിന്റെ നസറത്തുമായുള്ള ബന്ധവും തിരിച്ചറിയൽവിശേഷണവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നസറായനായ യേശു’ സ്വാഭാവികവും പദവിസദൃശമായ ഭാവം നിലനിർത്തുന്നതുമാണ്.
- source_word: δεῖν
  choice: പ്രവർത്തിക്കേണ്ടതാണെന്ന്
  rationale: പൗലോസിന്റെ അന്നത്തെ ധാരണയിൽ അനുഭവപ്പെട്ട കടമയെയോ അനിവാര്യതയെയോ ഇത് സൂചിപ്പിക്കുന്നു; പുറത്തുനിന്നുള്ള നിർബന്ധമായി അതിനെ കടുപ്പിക്കാതെ ഈ രൂപം ബാധ്യതയുടെ ബോധം പ്രകടിപ്പിക്കുന്നു.
- source_word: πολλὰ ἐναντία πρᾶξαι
  choice: പലതും പ്രവർത്തിക്കുക
  rationale: πολλά പ്രവർത്തനങ്ങളുടെ ബഹുത്വത്തെയും ἐναντία അവയുടെ എതിർസ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു. ‘നാമത്തിനെതിരെ പലതും പ്രവർത്തിക്കുക’ എന്ന സമ്പൂർണ പ്രയോഗം പ്രവൃത്തികളെ അനാവശ്യമായി വിശദീകരിക്കാതെ രണ്ടും പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനോടു ബന്ധപ്പെട്ട ‘നാമം’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘നാമം’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
  alternative: ‘യേശുവിന്റെ അധികാരത്തിനെതിരെ’ അല്ലെങ്കിൽ ‘യേശുവിന്റെ പ്രസ്ഥാനത്തിനെതിരെ’
  rationale: ὄνομα ഇവിടെ യേശുവിന്റെ വ്യക്തിത്വം, പ്രസിദ്ധി, അധികാരം, പരസ്യമായ അംഗീകാരം എന്നിവയെ പ്രതിനിധീകരിക്കാം. അവയിൽ ഒറ്റ അർഥത്തിലേക്ക് വാക്യത്തെ ചുരുക്കാതിരിക്കാനാണ് ‘നാമം’ നിലനിർത്തിയത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നതിലൂടെ നിലനിർത്തുകയും ‘നാമം’ എന്ന ദൈവശാസ്ത്രപരമായി സമ്പന്നമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്തു.
