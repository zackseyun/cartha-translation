source:
  edition: SBLGNT
  text: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν, τοῦ ⸀ἐπιστρέψαι ἀπὸ σκότους εἰς φῶς καὶ τῆς ἐξουσίας τοῦ Σατανᾶ ἐπὶ τὸν θεόν, τοῦ λαβεῖν αὐτοὺς ἄφεσιν ἁμαρτιῶν καὶ κλῆρον ἐν τοῖς ἡγιασμένοις πίστει τῇ εἰς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/018.yaml
  text: to open their eyes[a], so that they may turn from darkness to light and from the authority of Satan to God[b], that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in me.
translation:
  language: ml
  text: അവരുടെ കണ്ണുകൾ തുറക്കാനും, അവർ ഇരുട്ടിൽനിന്ന് വെളിച്ചത്തിലേക്കും സാത്താന്റെ അധികാരത്തിൽനിന്ന്[a] ദൈവത്തിലേക്കും തിരിയാനും, അവർക്ക് പാപമോചനവും എന്നിലുള്ള വിശ്വാസത്താൽ വിശുദ്ധീകരിക്കപ്പെട്ടവരുടെ[b] ഇടയിൽ ഒരു അവകാശഭാഗവും ലഭിക്കാനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സാത്താന്റെ ശക്തിയിൽനിന്ന്’ അല്ലെങ്കിൽ ‘സാത്താന്റെ ആധിപത്യത്തിൽനിന്ന്.’ ഗ്രീക്കുപദത്തിന് അധികാരം, ഭരണശക്തി, അല്ലെങ്കിൽ അധീനമേഖല എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശുദ്ധരാക്കപ്പെട്ടവരുടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι ὀφθαλμοὺς αὐτῶν
  choice: അവരുടെ കണ്ണുകൾ തുറക്കാനും
  rationale: കണ്ണുകൾ തുറക്കുക എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുന്നു; അതിനെ ‘ഗ്രഹിപ്പിക്കുക’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τοῦ ἐπιστρέψαι
  choice: അവർ ... തിരിയാനും
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘മതപരിവർത്തനം ചെയ്യുക’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ἀπὸ σκότους εἰς φῶς
  choice: ഇരുട്ടിൽനിന്ന് വെളിച്ചത്തിലേക്ക്
  rationale: മൂലത്തിലെ സമ്പന്നമായ വിരുദ്ധരൂപകം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τῆς ἐξουσίας τοῦ Σατανᾶ
  choice: സാത്താന്റെ അധികാരത്തിൽനിന്ന്
  rationale: ἐξουσία എന്നത് അധികാരം, ഭരണശക്തി, അധീനമേഖല എന്നിവ സൂചിപ്പിക്കാം; ‘അധികാരം’ ഏറ്റവും നേരിട്ടുള്ള മുഖ്യപാഠ തിരഞ്ഞെടുപ്പാണ്.
- source_word: ἐπὶ τὸν θεόν
  choice: ദൈവത്തിലേക്ക്
  rationale: മുൻപുള്ള ‘നിന്ന് ... ലേക്ക്’ എന്ന ചലനഘടനയോട് ചേർന്ന് ദിശയുടെയും അധീനതാമാറ്റത്തിന്റെയും ആശയം പ്രകടമാക്കുന്നു.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനം
  rationale: ἄφεσις എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ വ്യക്തവും സ്ഥാപിതവും സമകാലികവുമായ മലയാളരൂപം.
- source_word: κλῆρον
  choice: ഒരു അവകാശം
  rationale: ദൈവജനത്തിന്റെ ഇടയിൽ ലഭിക്കുന്ന നിശ്ചിത പങ്ക് അഥവാ പാരമ്പര്യാവകാശം എന്ന നിയമപരവും രക്ഷാചരിത്രപരവുമായ അർഥം നൽകുന്നു.
- source_word: ἐν τοῖς ἡγιασμένοις
  choice: വിശുദ്ധീകരിക്കപ്പെട്ടവരുടെ ഇടയിൽ
  rationale: പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന അവസ്ഥയും സൂചിപ്പിക്കുന്ന perfect passive participle-ന്റെ ക്രിയാത്മകബലം നിലനിർത്തുന്നു.
- source_word: πίστει τῇ εἰς ἐμέ
  choice: എന്നിലുള്ള വിശ്വാസത്താൽ
  rationale: πίστις-നെ ‘വിശ്വാസം’ എന്നും εἰς ἐμέ-യെ അതിന്റെ വ്യക്തിപരമായ ലക്ഷ്യം വ്യക്തമാക്കുന്ന ‘എന്നിൽ’ എന്നും നൽകുന്നു; instrumental dative-നെ ‘-ത്താൽ’ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: πίστει τῇ εἰς ἐμέ എന്നതിന്റെ ബന്ധവും അർഥവും
  choice: എന്നിലുള്ള വിശ്വാസത്താൽ
  alternative: എന്നിലുള്ള ആശ്രയത്താൽ
  rationale: ഇത് വിവാദമായ pistis-Christou genitive ഘടനയല്ല; വിശ്വാസത്തിന്റെ ലക്ഷ്യം യേശുവാണെന്ന് εἰς ἐμέ നേരിട്ട് വ്യക്തമാക്കുന്നു. ‘വിശ്വാസം’ മൂലപദത്തിന്റെ മതശാസ്ത്രപരമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: ἐν τοῖς ἡγιασμένοις എന്നതിന്റെ രൂപം
  choice: വിശുദ്ധീകരിക്കപ്പെട്ടവരുടെ ഇടയിൽ
  alternative: വിശുദ്ധരാക്കപ്പെട്ടവരുടെ ഇടയിൽ
  rationale: ദൈവിക passive-നെ തുറന്നു നിർവചിക്കാതെ മൂലത്തിലെ passive രൂപവും ഫലമായി തുടരുന്ന അവസ്ഥയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ഉദ്ദേശ്യക്രമം ‘തുറക്കാനും ... തിരിയാനും ... ലഭിക്കാനും’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ അടിക്കുറിപ്പ് സൂചകങ്ങൾ അവയുടെ യഥാർത്ഥ വിഷയങ്ങളോടു പൊരുത്തപ്പെടുന്ന സ്ഥാനങ്ങളിൽ ചേർത്തു.
