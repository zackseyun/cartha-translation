  source_fidelity: 'The translation accurately conveys τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει: it retains the rhetorical question, the conditional εἰ clause, the assessment of the event as unbelievable, the addressees’ role in that assessment, and God’s raising of the dead. Rendering the Greek passive κρίνεται with the natural Malayalam active construction “നിങ്ങൾ വിധിക്കുന്നത്” does not alter the sense.'
