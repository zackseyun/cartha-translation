  terminology: “മരിച്ചവരെ ഉയിർപ്പിക്കുന്നു” is an appropriate and established Malayalam expression for resurrection. “വിശ്വസിക്കാനാവാത്തത്” faithfully represents ἄπιστον in accessible contemporary language. “വിധിക്കുന്നത്” is somewhat formal but fits the evaluative rhetorical register and adequately reflects κρίνεται.
