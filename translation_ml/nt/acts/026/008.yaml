id: ACT.26.8
reference: Acts 26:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί ἄπιστον κρίνεται παρ’ ὑμῖν εἰ ὁ θεὸς νεκροὺς ἐγείρει;
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/008.yaml
  text: Why is it judged unbelievable by you if God raises the dead?
translation:
  language: ml
  text: ദൈവം മരിച്ചവരെ ഉയിർപ്പിക്കുന്നുവെങ്കിൽ, അത് വിശ്വസിക്കാനാവാത്തതാണെന്ന് നിങ്ങൾ വിധിക്കുന്നത് എന്തുകൊണ്ട്?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί
  choice: എന്തുകൊണ്ട്
  rationale: ഈ സന്ദർഭത്തിൽ ചോദ്യം ഒരു കാര്യം അവിശ്വസനീയമെന്നു വിധിക്കുന്നതിന്റെ കാരണം ചോദിക്കുന്നു.
- source_word: ἄπιστον
  choice: വിശ്വസിക്കാനാവാത്തത്
  rationale: ‘അവിശ്വസനീയം/വിശ്വാസയോഗ്യമല്ലാത്തത്’ എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κρίνεται
  choice: വിധിക്കുന്നത്
  rationale: നിഷ്ക്രിയ ഗ്രീക്ക് രൂപത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ അഭിസംബോധനാത്മക ഘടനയിൽ അവതരിപ്പിക്കുന്നു; ‘എണ്ണുക’ എന്നതിനെക്കാൾ വിലയിരുത്തി നിഗമനത്തിലെത്തുന്ന ഭാവം സൂക്ഷിക്കുന്നു.
- source_word: παρ’ ὑμῖν
  choice: നിങ്ങൾ
  rationale: ഇവിടെ ‘നിങ്ങളുടെ കാഴ്ചയിൽ/നിങ്ങളാൽ’ എന്ന അർഥം; നേരിട്ടുള്ള ചോദ്യത്തിൽ ‘നിങ്ങൾ വിധിക്കുന്നത്’ എന്നത് വ്യക്തവും സ്വാഭാവികവും ആണ്.
- source_word: νεκροὺς ἐγείρει
  choice: മരിച്ചവരെ ഉയിർപ്പിക്കുന്നു
  rationale: ‘മരിച്ചവരെ എഴുന്നേൽപ്പിക്കുക/ഉയിർപ്പിക്കുക’ എന്ന പുനരുത്ഥാനഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വർത്തമാനകാല രൂപവും കാക്കുന്നു.
theological_decisions:
- issue: ദൈവം മരിച്ചവരെ ഉയിർപ്പിക്കുന്നതിനെക്കുറിച്ചുള്ള εἰ ഉപവാക്യത്തിന്റെ ഭാവം
  choice: ഉയിർപ്പിക്കുന്നുവെങ്കിൽ
  alternative: ഉയിർപ്പിക്കുന്നു എന്നത്
  rationale: εἰ എന്ന വ്യവസ്ഥാസൂചക രൂപം ഔപചാരികമായി നിലനിർത്തുന്നു; ചോദ്യം ദൈവത്തിന്റെ ശക്തിയെ നിഷേധിക്കുന്നില്ലെങ്കിലും വാക്യത്തിലെ തർക്കഘടനയെ ഉറപ്പുള്ള പ്രസ്താവനയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നേരിട്ടുള്ള അലങ്കാരപ്രശ്നമായി വിവർത്തനം ചെയ്തു.
