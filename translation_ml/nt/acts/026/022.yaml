reference: Acts 26:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπικουρίας οὖν τυχὼν τῆς ⸀ἀπὸ τοῦ θεοῦ ἄχρι τῆς ἡμέρας ταύτης ἕστηκα μαρτυρόμενος μικρῷ τε καὶ μεγάλῳ, οὐδὲν ἐκτὸς λέγων ὧν τε οἱ προφῆται ἐλάλησαν μελλόντων γίνεσθαι καὶ Μωϋσῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/022.yaml
  text: Therefore[a], having received the help that is from God, I stand to this day, testifying to both small and great, saying nothing except what both the prophets and Moses said was going to happen[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിൽനിന്നുള്ള സഹായം ലഭിച്ചതിനാൽ, ഇന്നുവരെ ഞാൻ നിലകൊള്ളുന്നു; ചെറിയവരോടും വലിയവരോടും[a] സാക്ഷ്യം വഹിച്ചുകൊണ്ട്, പ്രവാചകന്മാരും മോശയും സംഭവിക്കുമെന്ന് പറഞ്ഞ കാര്യങ്ങളല്ലാതെ മറ്റൊന്നും ഞാൻ പറയുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചെറിയവരും വലിയവരും’ എന്നത് എല്ലാ സാമൂഹിക നിലകളിലുമുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: ‘പ്രവാചകന്മാരും മോശയും സംഭവിക്കുമെന്ന് പറഞ്ഞ കാര്യങ്ങൾക്കപ്പുറം ഒന്നും ഞാൻ പറയുന്നില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικουρίας ... τῆς ἀπὸ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള സഹായം
  rationale: സഹായത്തിന്റെ ഉറവിടം ദൈവമാണെന്ന ഗ്രീക്ക് attributive ഘടന വ്യക്തമായി നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: τυχὼν
  choice: ലഭിച്ചതിനാൽ
  rationale: ഇവിടെ τυγχάνω എന്നതിന്റെ ‘ലഭിക്കുക/നേടുക’ എന്ന അർഥവും οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധവും സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ ചേർത്തു നൽകുന്നു.
- source_word: ἄχρι τῆς ἡμέρας ταύτης ἕστηκα
  choice: ഇന്നുവരെ ഞാൻ നിലനിൽക്കുന്നു
  rationale: perfect രൂപം സൂചിപ്പിക്കുന്ന, മുൻകാലംമുതൽ ഇപ്പോഴും തുടരുന്ന അവസ്ഥയെ ‘ഇന്നുവരെ ... നിലനിൽക്കുന്നു’ എന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μαρτυρόμενος
  choice: സാക്ഷ്യം പറഞ്ഞുകൊണ്ട്
  rationale: പൗലോസിന്റെ തുടരുന്ന സാക്ഷ്യപ്രവർത്തനവും സാക്ഷി/നിയമപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: μικρῷ τε καὶ μεγάλῳ
  choice: ചെറിയവരോടും വലിയവരോടും
  rationale: സാമൂഹിക നിലയിലെ എല്ലാ വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന മൂലഭാഷയിലെ തുലിതാളമുള്ള പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: οὐδὲν ἐκτὸς λέγων
  choice: കാര്യങ്ങളല്ലാതെ മറ്റൊന്നും ഞാൻ പറയുന്നില്ല
  rationale: ἐκτός എന്നതിലെ ‘ഒഴികെ/അപ്പുറം’ എന്ന പരിധി വ്യക്തമായി നൽകുന്നു.
- source_word: ὧν ... μελλόντων γίνεσθαι
  choice: സംഭവിക്കാനിരിക്കുന്നതായി ... പറഞ്ഞ കാര്യങ്ങൾ
  rationale: പ്രവാചകന്മാരുടെയും മോശയുടെയും വാക്കുകളോട് ബന്ധപ്പെട്ട ഭാവികാലാഭിമുഖ്യം നിലനിർത്തുന്നു; ഉടൻ സംഭവിക്കുമെന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: οἱ προφῆται ... καὶ Μωϋσῆς
  choice: പ്രവാചകന്മാരും മോശയും
  rationale: ഗ്രീക്കിലെ ക്രമവും ഇരുകൂട്ടരെയും ബന്ധിപ്പിക്കുന്ന τε ... καί ഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ തിരുവെഴുത്തുകളുമായുള്ള പൗലോസിന്റെ സന്ദേശത്തിന്റെ തുടർച്ച
  choice: പ്രവാചകന്മാരും മോശയും മുൻകൂട്ടി പറഞ്ഞ കാര്യങ്ങൾക്കപ്പുറം താൻ ഒന്നും പറയുന്നില്ലെന്ന ശക്തമായ അവകാശവാദമായി പരിഭാഷപ്പെടുത്തി.
  alternative: പൗലോസിന്റെ സന്ദേശം തിരുവെഴുത്തിനോട് പൊതുവായി യോജിക്കുന്നു എന്ന ദുർബലമായ അർഥം.
  rationale: οὐδὲν ἐκτὸς λέγων എന്ന പ്രയോഗം വെറും പൊതുവായ യോജിപ്പിനേക്കാൾ ശക്തമായ പരിധിയും തുടർച്ചയും സൂചിപ്പിക്കുന്നു.
- issue: μελλόντων γίνεσθαι എന്നതിലെ ഭാവികാലസൂചന
  choice: ‘സംഭവിക്കാനിരിക്കുന്നതായി’
  alternative: ‘സംഭവിക്കുമെന്ന്’ അല്ലെങ്കിൽ ‘ഉടൻ സംഭവിക്കുമെന്ന്’
  rationale: ഭാവികാലാഭിമുഖ്യം നിലനിർത്തുന്നു; എന്നാൽ നിർബന്ധിതത്വമോ തൽക്ഷണസമീപതയോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ സാക്ഷ്യഭാവം, തിരുവെഴുത്തുമായുള്ള തുടർച്ച, ഭാവികാലസൂചന എന്നിവ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
