  source_fidelity: ഗ്രീക്കിലെ ἐξαιρούμενός എന്ന വർത്തമാന മധ്യമകൃദ്‌ന്തരൂപത്തിന്റെ രക്ഷ/വിടുതൽ അർഥം ‘വിടുവിച്ചുകൊണ്ട്’ യോജ്യമായി നൽകുന്നു. τοῦ λαοῦ-τῶν ἐθνῶν എന്ന വ്യത്യാസം ‘ജനം—ജനതകൾ’ എന്നതിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു; സന്ദർഭത്തിൽ സൂചിതമായ യഹൂദർ—യഹൂദേതരർ എന്ന അർഥം പ്രധാനപാഠത്തിലേക്ക് അനാവശ്യമായി ചേർത്തിട്ടില്ല. εἰς οὓς, ἀποστέλλω എന്നിവയും ‘അവരുടെ അടുക്കലേക്കു ഞാൻ നിന്നെ അയക്കുന്നു’ എന്നതിൽ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു.
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘ജനത്തിൽനിന്നും ജനതകളിൽനിന്നും’ എന്ന അടുത്തടുത്ത പ്രയോഗം ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ വ്യത്യാസം നിലനിർത്തുന്നതിനാൽ സ്വീകാര്യമാണ്.
  terminology: ‘ജനം’ λαός-ന്റെ അനിർദിഷ്ടമായെങ്കിലും സന്ദർഭസൂചകമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; ‘ജനതകൾ’ ἔθνη-യുടെ അക്ഷരാർഥവും വ്യാപ്തിയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പിലെ ‘യഹൂദജനം/യഹൂദേതര ജനം’ സന്ദർഭവ്യക്തീകരണമായി യുക്തമാണ്; ‘രക്ഷിച്ചുകൊണ്ട്’ ἐξαιρούμενός-ന്റെ സാധുവായ പദാന്തരമാണ്.
