id: ACT.26.17
reference: Acts 26:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξαιρούμενός σε ἐκ τοῦ λαοῦ καὶ ⸀ἐκ τῶν ἐθνῶν, εἰς οὓς ἐγὼ ⸂ἀποστέλλω σε⸃
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/017.yaml
  text: delivering you from the people and from the Gentiles[a], to whom I am sending you
translation:
  language: ml
  text: ജനത്തിൽനിന്നും ജനതകളിൽനിന്നും[a] നിന്നെ വിടുവിച്ചുകൊണ്ട്, അവരുടെ അടുക്കലേക്കു ഞാൻ നിന്നെ അയക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യഹൂദജനത്തിൽനിന്നും യഹൂദേതര ജനങ്ങളിൽനിന്നും നിന്നെ രക്ഷിച്ചുകൊണ്ട്.’'
    reason: τοῦ λαοῦ, τῶν ἐθνῶν എന്നിവയുടെ സന്ദർഭപരമായ വ്യക്തീകരണവും ἐξαιρούμενός എന്നതിന്റെ ‘രക്ഷിച്ചുകൊണ്ട്’ എന്ന പദാന്തരവും നൽകുന്നു.
lexical_decisions:
- source_word: ἐξαιρούμενός
  choice: വിടുവിച്ചുകൊണ്ട്
  rationale: ἐξαιρέω എന്ന ക്രിയയുടെ വർത്തമാന മധ്യമകർത്തരി കൃദന്തരൂപം. ശത്രുതയുള്ളവരിൽനിന്നുള്ള രക്ഷയെയോ വിടുതലിനെയോ സൂചിപ്പിക്കുന്നതോടൊപ്പം, മുഖ്യക്രിയയോടുള്ള തുടർച്ചയായ ബന്ധവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τοῦ λαοῦ
  choice: ജനത്തിൽനിന്നും
  rationale: ജനതകളുമായുള്ള വിരുദ്ധജോടിയിൽ ഇത് സന്ദർഭപരമായി യഹൂദജനത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്കിൽ വിശേഷണം ചേർക്കാതെ ‘ജനം’ എന്നുമാത്രമായതിനാൽ അതേ സംക്ഷിപ്തത പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
- source_word: τῶν ἐθνῶν
  choice: ജനതകളിൽനിന്നും
  rationale: ἔθνη എന്ന ബഹുവചനം അക്ഷരാർഥത്തിൽ ‘ജനതകൾ’ എന്നാണ്; ഈ യഹൂദ-യഹൂദേതര വ്യത്യാസത്തിൽ അത് യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ മൂലപദത്തിന്റെ രൂപവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: εἰς οὓς
  choice: അവരുടെ അടുക്കലേക്കു
  rationale: അയയ്ക്കുക എന്ന ക്രിയയോടൊപ്പം εἰς οὓς ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തികളിലേക്കുള്ള നിയോഗം സ്വാഭാവികമായി അറിയിക്കാൻ ‘അവരുടെ അടുക്കലേക്കു’ എന്നു നൽകി.
- source_word: ἀποστέλλω
  choice: ഞാൻ നിന്നെ അയക്കുന്നു
  rationale: വർത്തമാനകാലരൂപവും നിയോഗത്തിന്റെ തൽക്ഷണസ്വഭാവവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ജനം’ എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘ജനം’ നിലനിർത്തി; അടിക്കുറിപ്പിൽ ‘യഹൂദജനം’ എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കി.
  alternative: പ്രധാനപാഠത്തിൽ നേരിട്ട് ‘യഹൂദജനം’ എന്നു നൽകുക.
  rationale: യഹൂദരെയും ജനതകളെയും തമ്മിൽ വേർതിരിക്കുന്ന സന്ദർഭം സൂചന വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, മൂലപാഠം λαός എന്ന പൊതുപദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ വ്യക്തീകരണം അടിക്കുറിപ്പിലാക്കി മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ജനവും ജനതകളും’ എന്ന പദജോടി മൂലഗ്രീക്കിന്റെ വ്യത്യാസം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
