id: ACT.26.29
reference: Acts 26:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Εὐξαίμην ἂν τῷ θεῷ καὶ ἐν ὀλίγῳ καὶ ἐν ⸀μεγάλῳ οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον γενέσθαι τοιούτους ὁποῖος καὶ ἐγώ εἰμι παρεκτὸς τῶν δεσμῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/029.yaml
  text: But Paul said[a], “I would pray to God that whether in a short time or in a long time, not only you but also all who hear me today might become such as I am—except for these chains.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് പറഞ്ഞു[a]: “കുറഞ്ഞ സമയത്തിനുള്ളിലായാലും ഏറെ സമയമെടുത്തായാലും, നീ മാത്രമല്ല, ഇന്ന് എന്നെ കേൾക്കുന്ന എല്ലാവരും ഈ ചങ്ങലകൾ ഒഴികെ എന്നെപ്പോലെ ആയിത്തീരണമെന്നു ഞാൻ ദൈവത്തോടു പ്രാർഥിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏതാണ്ട് ആയാലും പൂർണമായി ആയാലും”; ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്; അത് അളവിനെയോ ശ്രമത്തെയോ സമയദൈർഘ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐξαίμην ἂν τῷ θεῷ
  choice: ഞാൻ ദൈവത്തോടു പ്രാർഥിക്കുന്നു
  rationale: സാധ്യതാസൂചകമായ optative ആശംസയോ പ്രാർഥനാപൂർവമായ ആഗ്രഹമോ പ്രകടിപ്പിക്കുന്നു; τῷ θεῷ പ്രാർഥന ആരോടാണെന്നു വ്യക്തമാക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ദൈവത്തോടു പ്രാർഥിക്കുന്നു’ എന്നു നൽകി.
- source_word: ἐν ὀλίγῳ καὶ ἐν μεγάλῳ
  choice: കുറഞ്ഞ സമയത്തിനുള്ളിലായാലും ഏറെ സമയമെടുത്തായാലും
  rationale: ദുഷ്കരമായ ഈ സമാന്തരപ്രയോഗത്തിന് സമയം, അളവ്, ശ്രമം എന്നീ വ്യാഖ്യാനസാധ്യതകളുണ്ട്. മുഖ്യപാഠത്തിൽ സന്ദർഭോചിതമായ കാലദൈർഘ്യവായന നൽകി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: οὐ μόνον σὲ ἀλλὰ καὶ πάντας τοὺς ἀκούοντάς μου σήμερον
  choice: നീ മാത്രമല്ല, ഇന്ന് എന്റെ വാക്കു കേൾക്കുന്ന എല്ലാവരും
  rationale: οὐ μόνον…ἀλλὰ καί എന്ന ഊന്നൽവ്യത്യാസവും ഇപ്പോൾ കേൾക്കുന്നവരെ സൂചിപ്പിക്കുന്ന present participle-ന്റെ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γενέσθαι
  choice: ആയിത്തീരണമെന്നു
  rationale: ആഗ്രഹിക്കപ്പെടുന്ന ഫലാവസ്ഥയെ സൂചിപ്പിക്കുന്ന infinitive മലയാളത്തിൽ പ്രാർഥനയുടെ ആശയത്തോട് ചേർന്ന് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοιούτους ὁποῖος καὶ ἐγώ εἰμι
  choice: എന്നെപ്പോലെ
  rationale: പൗലോസിന്റെ സ്വയംസൂചന സംക്ഷിപ്തവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παρεκτὸς τῶν δεσμῶν τούτων
  choice: ഈ ചങ്ങലകൾ ഒഴികെ
  rationale: παρεκτός വ്യക്തമാക്കുന്ന ഒഴിവാക്കലും δεσμοί എന്നതിന്റെ തടവുസന്ദർഭത്തിലെ ദൃശ്യമായ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അഗ്രിപ്പാവിന്റെ മുൻവാക്കുമായി ബന്ധപ്പെട്ട് ἐν ὀλίγῳ καὶ ἐν μεγάλῳ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘കുറഞ്ഞ സമയത്തിനുള്ളിലായാലും ഏറെ സമയമെടുത്തായാലും’ എന്ന കാലദൈർഘ്യവായന
  alternative: ‘ഏതാണ്ട് ആയാലും പൂർണമായി ആയാലും’; ‘കുറഞ്ഞ ശ്രമത്താലായാലും ഏറെ ശ്രമത്താലായാലും’
  rationale: ഗ്രീക്ക് പ്രയോഗം യഥാർഥത്തിൽ ദുഷ്കരവും പലവിധത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്. സന്ദർഭത്തിന് യോജിക്കുന്ന ഒരു വായന മുഖ്യപാഠത്തിൽ നൽകിയെങ്കിലും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ച് വ്യാഖ്യാനപരമായ സംഘർഷം മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ പ്രസംഗഭാവം നിലനിർത്തിക്കൊണ്ട് ദുഷ്കരമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
