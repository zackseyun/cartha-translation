id: ACT.26.20
reference: Acts 26:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τοῖς ἐν Δαμασκῷ πρῶτόν ⸀τε καὶ Ἱεροσολύμοις, ⸀πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας, καὶ τοῖς ἔθνεσιν ⸀ἀπήγγελλον μετανοεῖν καὶ ἐπιστρέφειν ἐπὶ τὸν θεόν, ἄξια τῆς μετανοίας ἔργα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/020.yaml
  text: but first to those in Damascus[a], then also in Jerusalem, and throughout all the region of Judea, and to the Gentiles, I proclaimed that they should repent and turn to God[b], doing works worthy of repentance.
translation:
  language: ml
  text: എന്നാൽ, ആദ്യം ദമസ്കൊസിലുള്ളവരോടും, പിന്നെ യെരൂശലേമിലുള്ളവരോടും യെഹൂദ്യപ്രദേശം മുഴുവനിലുമുള്ളവരോടും, ജാതികളോടും[a], അവർ മാനസാന്തരപ്പെട്ട് ദൈവത്തിലേക്കു തിരിയണമെന്നും മാനസാന്തരത്തിനു യോജിച്ച പ്രവൃത്തികൾ[b] ചെയ്യണമെന്നും ഞാൻ പ്രഖ്യാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനതകളോടും.” ഇവിടെ ഇത് യെഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “മാനസാന്തരത്തിനു ചേർന്ന പ്രവൃത്തികൾ” അല്ലെങ്കിൽ “മാനസാന്തരത്തിന് ഒത്ത പ്രവൃത്തികൾ.” ഇവ മാനസാന്തരത്തോടു പൊരുത്തപ്പെടുന്ന പ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: τοῖς ἐν Δαμασκῷ
  choice: ദമസ്കൊസിലുള്ളവരോട്
  rationale: സ്ഥലത്തുള്ള ആളുകളെയാണ് ദത്തിവ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: πρῶτόν τε καὶ Ἱεροσολύμοις
  choice: ആദ്യം ദമസ്കൊസിലുള്ളവരോടും, പിന്നെ യെരൂശലേമിലും
  rationale: πρῶτον എന്ന ക്രമസൂചനയും തുടർന്നുള്ള കൂട്ടിച്ചേർക്കലും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: πᾶσάν τε τὴν χώραν τῆς Ἰουδαίας
  choice: യെഹൂദ്യപ്രദേശം മുഴുവനിലും
  rationale: χώραയുടെ വിശാലമായ ഭൂമിശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി ഗ്രാമപ്രദേശമായി പരിമിതപ്പെടുത്താതെ നൽകുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജാതികളോട്
  rationale: സന്ദർഭത്തിൽ യെഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിൽ 'ജാതികൾ' ഈ വ്യത്യാസം സംക്ഷിപ്തമായി വഹിക്കുന്നു.
- source_word: ἀπήγγελλον
  choice: ഞാൻ പ്രസംഗിച്ചു
  rationale: മിഷനറി സന്ദർഭത്തിലെ പരസ്യമായ അറിയിപ്പിനെയോ പ്രഖ്യാപനത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μετανοεῖν
  choice: മാനസാന്തരപ്പെടുക
  rationale: വെറും അഭിപ്രായമാറ്റമല്ല, ദൈവസന്നിധിയിലെ പശ്ചാത്താപപരമായ ആന്തരിക തിരിവ് ഉൾക്കൊള്ളുന്ന സ്ഥിരവും ബോധഗമ്യവുമായ പദം.
- source_word: ἐπιστρέφειν ἐπὶ τὸν θεόν
  choice: ദൈവത്തിലേക്കു തിരിയുക
  rationale: ദൈവത്തെ ലക്ഷ്യമാക്കിയുള്ള തിരിവ് കൃത്യമായി സൂചിപ്പിക്കുന്നു; 'മടങ്ങുക' എന്നു പറഞ്ഞാൽ എല്ലാവർക്കും മുൻബന്ധമുണ്ടായിരുന്നുവെന്ന അനാവശ്യ സൂചന വരാം.
- source_word: ἄξια τῆς μετανοίας ἔργα
  choice: മാനസാന്തരത്തിനു യോജിച്ച പ്രവൃത്തികൾ
  rationale: ἄξια എന്നത് ഇവിടെ പൊരുത്തപ്പെടുന്ന, അനുയോജ്യമായ എന്ന അർഥത്തിൽ; പ്രവൃത്തികൾ മാനസാന്തരത്തോടൊത്തവയാണെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: πράσσοντας
  choice: ചെയ്യുക
  rationale: മാനസാന്തരത്തോടൊപ്പം പ്രകടമാകേണ്ട പ്രായോഗിക പെരുമാറ്റത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: മാനസാന്തരം, ദൈവത്തിലേക്കുള്ള തിരിവ്, പ്രവൃത്തികൾ എന്നിവയുടെ ബന്ധം
  choice: പ്രവൃത്തികളെ മാനസാന്തരത്തിനു യോജിച്ച ജീവിതപ്രകടനമായി അവതരിപ്പിച്ചു.
  alternative: പ്രവൃത്തികളെ മാനസാന്തരത്തിന്റെ മുഴുവൻ ഉള്ളടക്കമായോ ദൈവസ്വീകാര്യത നേടുന്ന പുണ്യാധാരമായോ അവതരിപ്പിക്കുക.
  rationale: μετανοεῖν, ἐπιστρέφειν എന്നിവ പ്രഖ്യാപിക്കപ്പെട്ട പ്രതികരണങ്ങളാണ്; πράσσοντας എന്ന പങ്കുപദം അവയോടൊത്ത പ്രവൃത്തിയെ വിവരിക്കുന്നു. പാഠം പറയുന്നതിലധികം കാരണഫലബന്ധമോ പുണ്യസിദ്ധാന്തമോ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. 'മാനസാന്തരം' എന്ന പരിചിതമായ മതപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. ഈ കരടിൽ അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളില്ല.
