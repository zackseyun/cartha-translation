revisions:
- from: എന്നാൽ ആദ്യം ദമസ്കൊസിലുള്ളവരോടും, പിന്നെ യെരൂശലേമിലും യെഹൂദ്യപ്രദേശം മുഴുവനിലും, ജാതികളോടും, അവർ മാനസാന്തരപ്പെട്ട് ദൈവത്തിലേക്കു തിരിയണമെന്നും മാനസാന്തരത്തിനു യോജിച്ച പ്രവൃത്തികൾ ചെയ്യണമെന്നും ഞാൻ പ്രസംഗിച്ചു.
  to: എന്നാൽ, ആദ്യം ദമസ്കൊസിലുള്ളവരോടും, പിന്നെ യെരൂശലേമിലുള്ളവരോടും യെഹൂദ്യപ്രദേശം മുഴുവനിലുമുള്ളവരോടും, ജാതികളോടും[a], അവർ മാനസാന്തരപ്പെട്ട് ദൈവത്തിലേക്കു തിരിയണമെന്നും മാനസാന്തരത്തിനു യോജിച്ച പ്രവൃത്തികൾ[b] ചെയ്യണമെന്നും ഞാൻ പ്രഖ്യാപിച്ചു.
  rationale: The revision explicitly supplies the people implied for Jerusalem and all Judea, while preserving the sequence indicated by “ആദ്യം ... പിന്നെ.” It retains repentance and turning to God as the proclaimed response, and describes fitting works without making them a basis of acceptance. Footnote anchors are placed directly after the terms they explain.
