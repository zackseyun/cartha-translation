id: ACT.26.26
reference: Acts 26:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπίσταται γὰρ περὶ τούτων ὁ βασιλεύς, πρὸς ὃν ⸀καὶ παρρησιαζόμενος λαλῶ· λανθάνειν γὰρ ⸀αὐτὸν τούτων οὐ πείθομαι ⸀οὐθέν, οὐ γάρ ⸀ἐστιν ἐν γωνίᾳ πεπραγμένον τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/026.yaml
  text: For the king knows about these things[a], and I speak boldly to him. For I am persuaded that none of these things has escaped his notice[c][b], because this has not been done in a corner.
translation:
  language: ml
  text: രാജാവിന് ഈ കാര്യങ്ങളെക്കുറിച്ച് അറിയാം; അദ്ദേഹത്തോടാണ് ഞാൻ ധൈര്യത്തോടെ സംസാരിക്കുന്നത്.[a] ഇവയിൽ ഒന്നും അദ്ദേഹത്തിന്റെ ശ്രദ്ധയിൽപ്പെടാതെ പോയിട്ടില്ലെന്ന് എനിക്ക് ഉറപ്പുണ്ട്.[b] കാരണം, ഇത് ഒരു മൂലയിൽ നടന്നതല്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തുറന്നുപറയുന്നു’ അല്ലെങ്കിൽ ‘സ്വതന്ത്രമായി സംസാരിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം തുറന്നതും ഭയമില്ലാത്തതും ആത്മവിശ്വാസമുള്ളതുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇവയിൽ ഒന്നും അദ്ദേഹത്തിൽനിന്ന് മറഞ്ഞിട്ടില്ല’ അല്ലെങ്കിൽ ‘അദ്ദേഹം അറിയാതെ പോയിട്ടില്ല’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരു മൂലയിൽ നടന്നതല്ല’ എന്നത് ഇത് രഹസ്യമായോ പൊതുശ്രദ്ധയ്ക്ക് പുറത്തായോ നടന്നതല്ല എന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπίσταται
  choice: അറിയാം
  rationale: രാജാവിന് ഈ സംഭവങ്ങളെക്കുറിച്ചുള്ള അറിവും പരിചയവും ഉണ്ടെന്ന നേരിട്ടുള്ള പ്രസ്താവന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: περὶ τούτων
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന വിഷയബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; τούτων എന്നതിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: παρρησιαζόμενος λαλῶ
  choice: ധൈര്യത്തോടെ സംസാരിക്കുന്നു
  rationale: തുറന്നും ഭയമില്ലാതെയും ആത്മവിശ്വാസത്തോടെയും സംസാരിക്കുന്നതെന്ന ഗ്രീക്ക് പദത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς ὃν
  choice: അദ്ദേഹത്തോട്
  rationale: സംസാരം അഭിമുഖീകരിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λανθάνειν ... αὐτὸν
  choice: അദ്ദേഹത്തിന്റെ ശ്രദ്ധയിൽപ്പെടാതെ പോയിട്ടില്ല
  rationale: ഒരാളിൽനിന്ന് മറഞ്ഞിരിക്കുക അഥവാ ശ്രദ്ധിക്കപ്പെടാതെ പോകുക എന്ന λανθάνωയുടെ സന്ദർഭോചിതമായ അർഥം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: οὐ πείθομαι οὐθέν
  choice: ഇവയിൽ ഒന്നും ... പോയിട്ടില്ലെന്ന് എനിക്ക് ഉറപ്പുണ്ട്
  rationale: ഗ്രീക്കിലെ നിഷേധഘടനയെ മലയാളത്തിൽ വ്യക്തമായ ഉറച്ച ബോധ്യമായി അവതരിപ്പിക്കുമ്പോഴും ‘ഒന്നും’ എന്ന സമഗ്രവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: πεπραγμένον
  choice: നടന്നതല്ല
  rationale: പൂർത്തിയായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന perfect participle-ന്റെ ഫലം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘ചെയ്യപ്പെട്ടതല്ല’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: ἐν γωνίᾳ
  choice: ഒരു മൂലയിൽവെച്ച്
  rationale: ഗ്രീക്കിലെ ദൃശ്യരൂപം സംരക്ഷിക്കുകയും രഹസ്യമായോ പൊതുശ്രദ്ധയ്ക്ക് പുറത്തായോ അല്ല എന്ന ആശയം സന്ദർഭത്തിൽ ഗ്രഹിക്കാവുന്നവിധം നൽകുകയും ചെയ്യുന്നു.
- source_word: τοῦτο
  choice: ഇതൊന്നും
  rationale: ചർച്ചയിലുള്ള സംഭവങ്ങളിലേക്കുള്ള വിപുലമായ സൂചന നിലനിർത്തുന്നു; യേശുവിന്റെ മരണം-പുനരുത്ഥാനം മാത്രമായോ പൗലോസിന്റെ മുഴുവൻ കേസായോ പരിധി നിശ്ചയിക്കുന്നില്ല.
theological_decisions:
- issue: τοῦτο എന്നതിന്റെ പരിധിയും സംഭവങ്ങളുടെ പരസ്യസ്വഭാവവും
  choice: ‘ഇതൊന്നും’ എന്നു നിഷ്പക്ഷവും വിശാലവുമായ സൂചനയായി നൽകുന്നു.
  alternative: യേശുവിന്റെ മരണം-പുനരുത്ഥാനം മാത്രമെന്നോ മുഴുവൻ ക്രിസ്തീയ പ്രസ്ഥാനവും പൗലോസിന്റെ കേസും എന്നോ വ്യക്തമായി നിർവചിക്കുക.
  rationale: വാക്യം സൂചനയുടെ കൃത്യമായ പരിധി നിർവചിക്കുന്നില്ല. അതിനാൽ പൊതുവായി അറിയപ്പെട്ട സംഭവങ്ങളെന്ന ആശയം നിലനിർത്തി ദൈവശാസ്ത്രപരമായ പരിധി വിവർത്തനം തന്നെ തീരുമാനിക്കുന്നതു ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. രാജാവിനെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിൽ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിച്ച γάρ ബന്ധങ്ങളെ മലയാളത്തിലെ ‘അതുകൊണ്ട്’, ‘കാരണം’ എന്നിവകൊണ്ട് ആശയബന്ധം വ്യക്തമാകുന്നവിധം ക്രമപ്പെടുത്തി; വാചകത്തിന്റെ ദൃശ്യരൂപവും അർഥവ്യാപ്തിയും നിലനിർത്തി.
