  naturalness: ഭാഷ ആധുനികവും മാന്യവുമാണ്. ‘ഒരു മൂലയിൽവെച്ച്’ എന്ന രൂപത്തേക്കാൾ ‘ഒരു മൂലയിൽ’ സ്വാഭാവികമാണ്. ആദ്യ γάρ-ന്റെ ആശയബന്ധം ‘അതുകൊണ്ട്’ എന്നതിനു പകരം വാക്യക്രമത്തിലൂടെ നേരിട്ട് നൽകുന്നത് ഗ്രീക്കിനോടും മലയാളശൈലിയോടും കൂടുതൽ ചേർന്നിരിക്കും.
  terminology: ‘ധൈര്യത്തോടെ സംസാരിക്കുന്നു,’ ‘ശ്രദ്ധയിൽപ്പെടാതെ പോയിട്ടില്ല,’ ‘ഒരു മൂലയിൽ’ എന്നിവ സന്ദർഭത്തിന് യോജിച്ചവയാണ്. രാജാവിനെ സൂചിപ്പിക്കാൻ ‘അദ്ദേഹം’ എന്ന ആദരരൂപവും ഉചിതമാണ്.
