id: ACT.26.19
reference: Acts 26:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅθεν, βασιλεῦ Ἀγρίππα, οὐκ ἐγενόμην ἀπειθὴς τῇ οὐρανίῳ ὀπτασίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/019.yaml
  text: Therefore[a], King Agrippa, I was not disobedient to the heavenly vision,
translation:
  language: ml
  text: അതുകൊണ്ട്, അഗ്രിപ്പാ രാജാവേ, സ്വർഗീയ ദർശനത്തോട്[a] ഞാൻ അനുസരണക്കേട് കാണിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “സ്വർഗത്തിൽനിന്നുള്ള ദർശനത്തോട്.”
    reason: οὐρανίῳ എന്ന പദം ദർശനത്തിന്റെ സ്വർഗീയ സ്വഭാവത്തെയോ അതിന്റെ സ്വർഗീയ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: Ὅθεν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരിച്ച ദർശനത്തിൽനിന്നും നിയോഗത്തിൽനിന്നും പൗലോസ് നിഗമനത്തിലേക്കു കടക്കുന്നതു സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: βασιλεῦ Ἀγρίππα
  choice: അഗ്രിപ്പാ രാജാവേ
  rationale: നേരിട്ടുള്ള സംബോധനയും രാജപദവിയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐγενόμην ἀπειθὴς
  choice: ഞാൻ അനുസരണക്കേട് കാണിച്ചില്ല
  rationale: ദൈവിക നിയോഗം അനുസരിക്കാൻ വിസമ്മതിച്ചില്ല എന്ന പ്രവർത്തനപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; γίνομαι എന്നതിനെ അക്ഷരാർഥത്തിൽ ‘ആയിത്തീർന്നില്ല’ എന്നു വിവർത്തനം ചെയ്യുന്നതിലെ അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: τῇ οὐρανίῳ ὀπτασίᾳ
  choice: സ്വർഗീയ ദർശനത്തോട്
  rationale: ὀπτασία സൂചിപ്പിക്കുന്ന അതീന്ദ്രിയ ദർശനത്തെ കൃത്യമായി നൽകുന്നു; οὐράνιος ദർശനത്തിന്റെ സ്വർഗീയ സ്വഭാവത്തെയോ സ്വർഗത്തിൽനിന്നുള്ള ഉത്ഭവത്തെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദമസ്‌കൊസ് വഴിയിലെ പൗലോസിന്റെ അനുഭവത്തിന്റെ സ്വഭാവം
  choice: ദർശനം
  alternative: പ്രത്യക്ഷത; സ്വർഗത്തിൽനിന്നുള്ള വെളിപ്പാട്
  rationale: ὀπτασία എന്ന നാമത്തിന്റെ നേരിട്ടുള്ള അർഥം ‘ദർശനം/പ്രത്യക്ഷത’ എന്നാണ്. ‘ദർശനം’ മൂലപാഠത്തിന്റെ വിഭാഗീകരണം നിലനിർത്തുകയും കൂടുതൽ വികസിപ്പിച്ച ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാജാവിനോടുള്ള നേരിട്ടുള്ള സംബോധന ‘അഗ്രിപ്പാ രാജാവേ’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു; വാക്യത്തിന്റെ യുക്തിബന്ധം ‘അതുകൊണ്ട്’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു.
