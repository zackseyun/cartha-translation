id: ACT.26.16
reference: Acts 26:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ στῆθι ἐπὶ τοὺς πόδας σου· εἰς τοῦτο γὰρ ὤφθην σοι, προχειρίσασθαί σε ὑπηρέτην καὶ μάρτυρα ὧν τε εἶδές ⸀με ὧν τε ὀφθήσομαί σοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/016.yaml
  text: 'But rise and stand on your feet[a], for I have appeared to you for this purpose: to appoint you as a servant and witness both of the things in which you have seen me and of the things in which I will appear to you,'
translation:
  language: ml
  text: എന്നാൽ എഴുന്നേറ്റ് നിവർന്നുനിൽക്കുക; നിന്നെ ഒരു ശുശ്രൂഷകനായും സാക്ഷിയായും നിയമിക്കാനാണ് ഞാൻ നിനക്കു പ്രത്യക്ഷനായത്—നീ എന്നെ കണ്ടതിനെക്കുറിച്ചും ഞാൻ നിനക്കു പ്രത്യക്ഷനാകാനിരിക്കുന്നതിനെക്കുറിച്ചും സാക്ഷിയാകാൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “നീ എന്നെ കണ്ടതിലും ഞാൻ നിനക്കു പ്രത്യക്ഷനാകാനിരിക്കുന്നതിലും.” ഗ്രീക്ക് വാക്യഘടന ചുരുക്കിയതും അർഥബന്ധത്തിൽ അല്പം അസ്പഷ്ടതയുള്ളതുമാണ്; വ്യക്തതയ്ക്കായി മുഖ്യവാചകത്തിൽ “...യെക്കുറിച്ചും സാക്ഷിയാകാൻ” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστηθι
  choice: എഴുന്നേറ്റ്
  rationale: ഉടനടി പ്രവർത്തനം ആവശ്യപ്പെടുന്ന കല്പനയുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: στῆθι ἐπὶ τοὺς πόδας σου
  choice: നിന്റെ കാലുകളിൽ നിവർന്നുനിൽക്കുക
  rationale: വിളി-നിയോഗ സന്ദർഭത്തിലെ ദൃശ്യമായ ശരീരഭാവം നിലനിർത്തുന്നു; ‘നിൽക്കുക’ എന്നതിനെക്കാൾ ‘നിവർന്നുനിൽക്കുക’ പ്രയോഗത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τοῦτο γὰρ
  choice: ഇതിനാണ്
  rationale: പ്രത്യക്ഷതയുടെ ഉദ്ദേശ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὤφθην σοι
  choice: ഞാൻ നിനക്കു പ്രത്യക്ഷനായത്
  rationale: രൂപത്തിൽ നിഷ്ക്രിയമായിരുന്നാലും ഇവിടെ സ്വയം വെളിപ്പെടുത്തുന്ന പ്രത്യക്ഷതയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണ്; വെറും ‘കാണപ്പെട്ടു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികം.
- source_word: προχειρίσασθαί σε
  choice: നിന്നെ ... നിയമിക്കേണ്ടതിന്
  rationale: ഒരു ഔദ്യോഗിക ദൗത്യത്തിലേക്കുള്ള നിയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘തിരഞ്ഞെടുക്കുക’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: ὑπηρέτην
  choice: ശുശ്രൂഷകൻ
  rationale: കീഴിൽ സേവിക്കുന്ന നിയുക്ത സഹായിയുടെ ആശയം മാന്യവും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു; δοῦλος എന്ന പദത്തിന്റെ അടിമസൂചന ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: μάρτυρα
  choice: സാക്ഷി
  rationale: കണ്ടതും വെളിപ്പെട്ടതുമായ കാര്യങ്ങൾക്ക് സാക്ഷ്യം വഹിക്കുന്ന വ്യക്തിയെ കൃത്യമായി സൂചിപ്പിക്കുന്ന പതിവ് മലയാളപദം.
- source_word: ὧν τε εἶδές με
  choice: നീ എന്നെ കണ്ട കാര്യങ്ങളെക്കുറിച്ചും
  rationale: με ഉൾപ്പെടുന്ന സാക്ഷ്യത്തെ നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്കിലെ ചുരുക്കിയ ബന്ധവാക്യം വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὧν τε ὀφθήσομαί σοι
  choice: ഞാൻ നിനക്കു പ്രത്യക്ഷനാകാനിരിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ചും
  rationale: ഭാവിയിലെ വെളിപ്പാടുകളെ ‘കാണിച്ചുതരും’ എന്ന് വ്യാഖ്യാനിച്ച് മാറ്റാതെ, ὀφθήσομαι എന്ന പ്രത്യക്ഷതാഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὤφθην / ὀφθήσομαι എന്നീ ക്രിയകളിലെ വെളിപ്പാടിന്റെ സ്വഭാവം
  choice: രണ്ടിടത്തും ‘പ്രത്യക്ഷനാകുക’ എന്ന ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘കാണപ്പെട്ടു’ / ‘കാണപ്പെടും’ അല്ലെങ്കിൽ ‘എന്നെത്തന്നെ വെളിപ്പെടുത്തി’ / ‘വെളിപ്പെടുത്തും’.
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശു പൗലോസിന് വ്യക്തിപരമായി പ്രത്യക്ഷപ്പെട്ട് അവനെ നിയോഗിക്കുന്നു എന്ന വാക്യത്തിന്റെ ഭാവം ഇത് നിലനിർത്തുന്നു; അതേസമയം പ്രത്യക്ഷതയുടെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- issue: ὧν ... ὧν എന്ന ചുരുക്കിയ ബന്ധവാക്യത്തിന്റെ അർഥബന്ധം
  choice: ‘കാര്യങ്ങളെക്കുറിച്ചും’ എന്ന രൂപത്തിൽ സാക്ഷ്യത്തിന്റെ വിഷയമായി അവതരിപ്പിച്ചു.
  alternative: ‘നീ എന്നെ കണ്ടവയിലും ഞാൻ നിനക്കു പ്രത്യക്ഷനാകുന്നവയിലും’ എന്ന കൂടുതൽ പദാനുപദ രൂപം.
  rationale: ഗ്രീക്കിലെ യഥാർഥമായ ചുരുക്കവും ചെറിയ അസ്പഷ്ടതയും അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചുകൊണ്ട്, മുഖ്യവാചകം സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രാഹ്യമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശുശ്രൂഷകൻ’, ‘സാക്ഷി’, ‘പ്രത്യക്ഷനായത്’ എന്നീ പദങ്ങൾ ദൗത്യത്തിന്റെ ഗൗരവവും വെളിപ്പാടിന്റെ ഭാഷയും നിലനിർത്തുന്നു; വാക്യത്തിലെ ഗ്രീക്ക് ചുരുക്കം അടിക്കുറിപ്പിലൂടെ തുറന്നുകാട്ടുന്നു.
