revisions:
- from: എന്നാൽ എഴുന്നേറ്റ് നിന്റെ കാലുകളിൽ നിവർന്നുനിൽക്കുക. നിന്നെ ഒരു ശുശ്രൂഷകനും സാക്ഷിയുമായി നിയമിക്കേണ്ടതിനാണ് ഞാൻ നിനക്കു പ്രത്യക്ഷനായത്—നീ എന്നെ കണ്ട കാര്യങ്ങളെക്കുറിച്ചും ഞാൻ നിനക്കു പ്രത്യക്ഷനാകാനിരിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ചും സാക്ഷിയായിരിക്കാൻ.[a]
  to: എന്നാൽ എഴുന്നേറ്റ് നിവർന്നുനിൽക്കുക; നിന്നെ ഒരു ശുശ്രൂഷകനായും സാക്ഷിയായും നിയമിക്കാനാണ് ഞാൻ നിനക്കു പ്രത്യക്ഷനായത്—നീ എന്നെ കണ്ടതിനെക്കുറിച്ചും ഞാൻ നിനക്കു പ്രത്യക്ഷനാകാനിരിക്കുന്നതിനെക്കുറിച്ചും സാക്ഷിയാകാൻ.[a]
  rationale: The revision keeps the Greek’s commissioning purpose, the servant-and-witness pairing, and both past and future appearance verbs. It removes a Malayalam syntactic ambiguity that could make ‘things’ rather than Christ appear, while the footnote transparently preserves the compressed and somewhat disputed Greek construction.
