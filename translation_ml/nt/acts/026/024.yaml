id: ACT.26.24
reference: Acts 26:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτοῦ ἀπολογουμένου ὁ Φῆστος μεγάλῃ τῇ φωνῇ ⸀φησιν· Μαίνῃ, Παῦλε· τὰ πολλά σε γράμματα εἰς μανίαν περιτρέπει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/024.yaml
  text: As he was saying these things in his defense[a], Festus said with a loud voice, “You are out of your mind, Paul! Your great learning is driving you into madness.”
translation:
  language: ml
  text: 'അവൻ ഇങ്ങനെ തന്റെ പ്രതിരോധം അവതരിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഫെസ്തൊസ് ഉച്ചത്തിൽ പറഞ്ഞു: “പൗലൊസേ, നിനക്കു ഭ്രാന്താണ്! നിന്റെ വലിയ പാണ്ഡിത്യം[a] നിന്നെ ഭ്രാന്തിലേക്കു നയിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ അനേകം ഗ്രന്ഥങ്ങൾ.”
    reason: γράμματα എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘പഠനം/പാണ്ഡിത്യം’ എന്ന അർഥത്തിനുപുറമേ ‘ഗ്രന്ഥങ്ങൾ’ എന്ന അർഥസാധ്യതയും ഉണ്ട്.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: തന്റെ പ്രതിവാദം അവതരിപ്പിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ἀπολογέομαι ഇവിടെ നിയമപരവും വാചികവുമായ പ്രതിവാദം അവതരിപ്പിക്കുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ഈ പരിഭാഷ ആ അർഥവും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: ഉച്ചത്തിൽ
  rationale: ശബ്ദത്തിന്റെ ശക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രീതിപ്രയോഗം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകുന്നു.
- source_word: φησιν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലുള്ള ചരിത്രവർത്തമാനകാലം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കനുസരിച്ച് ഭൂതകാലത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: Μαίνῃ
  choice: നിനക്കു ഭ്രാന്താണ്
  rationale: μαίνομαι എന്നതിന്റെ ഭ്രാന്തായിരിക്കുക എന്ന ശക്തമായ ആരോപണം മയപ്പെടുത്താതെ, എന്നാൽ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὰ πολλά ... γράμματα
  choice: നിന്റെ വിപുലമായ പഠനം
  rationale: γράμματα എന്നതിന് അക്ഷരങ്ങൾ, ഗ്രന്ഥങ്ങൾ, പഠനം, വിദ്യാഭ്യാസം എന്നീ അർഥസാധ്യതകളുണ്ട്. ഈ സന്ദർഭത്തിൽ ഫെസ്തൊസ് പൗലൊസിന്റെ വ്യാപകമായ പഠനത്തെയോ പാണ്ഡിത്യത്തെയോ ഉദ്ദേശിക്കുന്നതിനാൽ പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ ഈ പ്രയോഗം സ്വീകരിച്ചു; ഗ്രന്ഥപഠനമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἰς μανίαν περιτρέπει
  choice: ഭ്രാന്തിലേക്കു നയിക്കുന്നു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഒരു അവസ്ഥയിലേക്കുള്ള നീക്കമോ ഫലമോ നിലനിർത്തുകയും περιτρέπωയുടെ കാരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഫെസ്തൊസിന്റെ ഇടപെടലിലെ കടുപ്പവും പൗലൊസിന്റെ പ്രസംഗത്തിന്റെ നിയമപരമായ പശ്ചാത്തലവും നിലനിർത്തി.
