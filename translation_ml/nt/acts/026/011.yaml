id: ACT.26.11
reference: Acts 26:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατὰ πάσας τὰς συναγωγὰς πολλάκις τιμωρῶν αὐτοὺς ἠνάγκαζον βλασφημεῖν, περισσῶς τε ἐμμαινόμενος αὐτοῖς ἐδίωκον ἕως καὶ εἰς τὰς ἔξω πόλεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/011.yaml
  text: And in all the synagogues[a], punishing them many times, I tried to force them to blaspheme; and being exceedingly enraged against them, I kept persecuting them even to the foreign cities.
translation:
  language: ml
  text: എല്ലാ സിനഗോഗുകളിലും അവരെ പലവട്ടം ശിക്ഷിച്ചുകൊണ്ട്, ദൈവദൂഷണം പറയാൻ അവരെ നിർബന്ധിക്കാൻ ഞാൻ ശ്രമിച്ചു; അവരോടു അത്യന്തം ഉഗ്രകോപം പൂണ്ട്, പുറത്തുള്ള നഗരങ്ങളിലേക്കുപോലും ഞാൻ അവരെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിദേശ നഗരങ്ങളിലേക്കുപോലും’; ഈ പ്രയോഗം യെഹൂദ്യയ്ക്കു പുറത്തുള്ള നഗരങ്ങളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάσας τὰς συναγωγάς
  choice: എല്ലാ സിനഗോഗുകളിലും
  rationale: κατά + accusative ഇവിടെ വിവിധ സിനഗോഗുകളിലായി ആവർത്തിച്ച പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി ആ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: πολλάκις τιμωρῶν
  choice: പലവട്ടം ശിക്ഷിച്ചുകൊണ്ട്
  rationale: πολλάκις ആവർത്തനവും വർത്തമാന കൃദന്തം മുഖ്യക്രിയയോടൊപ്പമുള്ള സാഹചര്യവും മാർഗവും സൂചിപ്പിക്കുന്നു.
- source_word: ἠνάγκαζον
  choice: നിർബന്ധിക്കാൻ ഞാൻ ശ്രമിച്ചു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ ആവർത്തിതമോ ശ്രമാത്മകമോ ആയ ഭാവം സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു; അവർ യഥാർത്ഥത്തിൽ ദൈവദൂഷണം പറഞ്ഞുവെന്ന് അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: βλασφημεῖν
  choice: ദൈവദൂഷണം പറയാൻ
  rationale: ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ യേശുവിനെയോ ക്രിസ്തീയ വിശ്വാസപ്രഖ്യാപനത്തെയോ പ്രത്യേകം ചേർക്കാതെ പൊതുവായ പദം നിലനിർത്തുന്നു.
- source_word: περισσῶς ἐμμαινόμενος αὐτοῖς
  choice: അവരോടു തീർത്തും ക്രോധോന്മത്തനായി
  rationale: περισσῶς തീവ്രതയും ἐμμαινόμενος നിയന്ത്രണംവിട്ട ക്രുദ്ധമായ ശത്രുതയും പ്രകടമാക്കുന്നു; മാനസികരോഗത്തെ സൂചിപ്പിക്കാതെ ഉഗ്രത അറിയിക്കുന്നു.
- source_word: ἐδίωκον
  choice: ഞാൻ അവരെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലം തുടർച്ചയായും ആവർത്തിച്ചും നടന്ന പീഡനത്തെ പ്രകടമാക്കുന്നു.
- source_word: ἕως καὶ εἰς τὰς ἔξω πόλεις
  choice: വിദേശനഗരങ്ങൾവരെപ്പോലും
  rationale: പീഡനം പ്രാദേശിക പരിധിക്കപ്പുറമുള്ള നഗരങ്ങളിലേക്കും വ്യാപിച്ചതെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: βλασφημεῖν എന്നതിന്റെ ലക്ഷ്യം
  choice: ദൈവദൂഷണം പറയാൻ; ദൂഷണത്തിന്റെ കർമം വ്യക്തമാക്കുന്നില്ല.
  alternative: യേശുവിനെ ദുഷിക്കാൻ / ക്രിസ്തീയ വിശ്വാസത്തെ ശപിക്കാൻ
  rationale: സന്ദർഭം യേശുവിനെയോ ക്രിസ്തീയ സാക്ഷ്യത്തെയോ ലക്ഷ്യമാക്കുന്നതായി സൂചിപ്പിച്ചാലും ഗ്രീക്ക് വാക്യം കർമം പറയുന്നില്ല; അതിനാൽ ആ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ἠνάγκαζον എന്ന അപൂർണഭൂതകാലത്തിന്റെ സ്വഭാവം
  choice: നിർബന്ധിക്കാൻ ശ്രമിച്ചു
  alternative: നിർബന്ധിച്ചുകൊണ്ടിരുന്നു
  rationale: സന്ദർഭത്തിൽ ആവർത്തിച്ച ബലപ്രയോഗശ്രമം പ്രകടമാക്കുകയും അതിന്റെ ഫലം വിജയിച്ചതായി ഉറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സിനഗോഗ്’, ‘ദൈവദൂഷണം’, ‘പീഡിപ്പിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ആവർത്തിത പ്രവർത്തനം ‘പലവട്ടം’, ‘ശ്രമിച്ചു’, ‘പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്നിവയിലൂടെ പ്രകടമാക്കി.
