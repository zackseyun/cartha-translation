  to: എല്ലാ സിനഗോഗുകളിലും അവരെ പലവട്ടം ശിക്ഷിച്ചുകൊണ്ട്, ദൈവദൂഷണം പറയാൻ അവരെ നിർബന്ധിക്കാൻ ഞാൻ ശ്രമിച്ചു; അവരോടു അത്യന്തം ഉഗ്രകോപം പൂണ്ട്, പുറത്തുള്ള നഗരങ്ങളിലേക്കുപോലും ഞാൻ അവരെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു.[a]
