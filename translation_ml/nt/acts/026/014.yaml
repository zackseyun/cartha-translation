  revised_text: 'ഞങ്ങളെല്ലാവരും നിലത്ത് വീണപ്പോൾ, എബ്രായ ഭാഷയിൽ[a] എന്നോടു ഇങ്ങനെ പറയുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു: “ശൗലേ, ശൗലേ, നീ എന്നെ പീഡിപ്പിക്കുന്നത് എന്തിന്? മുൾക്കോലുകൾക്കെതിരെ ചവിട്ടുന്നത്[b] നിനക്കു പ്രയാസമാണ്.”'
