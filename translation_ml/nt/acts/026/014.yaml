revisions:
- from: 'ഞങ്ങളെല്ലാവരും നിലത്തു വീണപ്പോൾ, എബ്രായഭാഷയിൽ[a] എന്നോടു പറയുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു: “ശൗലേ, ശൗലേ, നീ എന്നെ പീഡിപ്പിക്കുന്നത് എന്തിന്? കാലിത്തെളിക്കോലുകൾക്കെതിരെ തൊഴിക്കുന്നത് നിനക്കു പ്രയാസമാണ്.”[b]'
  to: 'ഞങ്ങളെല്ലാവരും നിലത്ത് വീണപ്പോൾ, എബ്രായ ഭാഷയിൽ[a] എന്നോടു ഇങ്ങനെ പറയുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു: “ശൗലേ, ശൗലേ, നീ എന്നെ പീഡിപ്പിക്കുന്നത് എന്തിന്? മുൾക്കോലുകൾക്കെതിരെ ചവിട്ടുന്നത്[b] നിനക്കു പ്രയാസമാണ്.”'
  rationale: വിവർത്തനം തിരുത്തിയത് മുഖ്യമായും സ്വാഭാവിക മലയാള പ്രയോഗത്തിനും κέντρα എന്ന രൂപകത്തിന്റെ വ്യക്തതയ്ക്കുമാണ്. മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനാർഥം ചേർത്തിട്ടില്ല. ‘എബ്രായ ഭാഷയിൽ’ എന്ന ഗ്രീക്ക് പദപ്രയോഗം അക്ഷരാർഥത്തിൽ നിലനിർത്തുകയും അരമായ എന്ന ചരിത്ര-ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു. പഴഞ്ചൊല്ലിന്റെ അടിക്കുറിപ്പ് അതു വിശദീകരിക്കുന്ന പദസമുച്ചയത്തോടുതന്നെ ബന്ധിപ്പിച്ചു.
