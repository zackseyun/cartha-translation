  source_fidelity: 'മുഖ്യ ആശയവും ക്രമവും ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: എല്ലാവരും നിലത്തു വീണശേഷം പൗലൊസ് ഒരു ശബ്ദം കേൾക്കുന്നു; ശബ്ദം എബ്രായ ഭാഷയിൽ അവനെ അഭിസംബോധന ചെയ്യുന്നു; ശൗലിന്റെ ആവർത്തനവും ചോദ്യംയും പഴഞ്ചൊല്ലും നിലനിൽക്കുന്നു. എന്നാൽ κέντραയ്ക്ക് നൽകിയ ‘കാലിത്തെളിക്കോലുകൾ’ എന്ന രൂപം ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികവും ഭാരമുള്ളതുമാണ്; ‘മുൾക്കോലുകൾ’ കൂടുതൽ കൃത്യവും സ്വാഭാവികവുമാണ്.'
  naturalness: ‘നിലത്തു’ എന്നതിനുപകരം നിലവാരമലയാളത്തിലെ ‘നിലത്ത്’ ഉപയോഗിച്ചു. ‘കാലിത്തെളിക്കോലുകൾക്കെതിരെ തൊഴിക്കുന്നത്’ എന്ന പ്രയോഗം പരിചയക്കുറവുള്ളതും ശൈലീപരമായി കനത്തതുമാണ്; ‘മുൾക്കോലുകൾക്കെതിരെ ചവിട്ടുന്നത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘ഇങ്ങനെ പറയുന്ന ഒരു ശബ്ദം’ എന്ന ക്രമം നേരിട്ടുള്ള ഉദ്ധരണിയിലേക്കുള്ള മലയാള കഥനപ്രവാഹം മെച്ചപ്പെടുത്തുന്നു.
  terminology: τῇ Ἑβραΐδι διαλέκτῳ മുഖ്യപാഠത്തിൽ ‘എബ്രായ ഭാഷയിൽ’ എന്നുതന്നെ നിലനിർത്തിയിരിക്കുന്നു; അരമായ സാധ്യത അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു. κέντραയ്ക്ക് ‘മുൾക്കോലുകൾ’ ഉപയോഗിക്കുന്നു; ഇത് മൃഗങ്ങളെ നയിക്കാൻ ഉപയോഗിക്കുന്ന കൂർത്ത പ്രേരകക്കോലിന്റെ രൂപകം സംരക്ഷിക്കുന്നു. διώκειςയ്ക്ക് ‘പീഡിപ്പിക്കുന്നു’ യോജിച്ചതാണ്.
