id: ACT.26.14
reference: Acts 26:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντων ⸀τε καταπεσόντων ἡμῶν εἰς τὴν γῆν ἤκουσα φωνὴν ⸀λέγουσαν πρός ⸀με τῇ Ἑβραΐδι διαλέκτῳ· Σαοὺλ Σαούλ, τί με διώκεις; σκληρόν σοι πρὸς κέντρα λακτίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/014.yaml
  text: And when we had all fallen to the ground[a], I heard a voice saying to me in the Hebrew language, ‘Saul, Saul[b], why are you persecuting me? It is hard for you to kick against the goads.’
translation:
  language: ml
  text: 'ഞങ്ങളെല്ലാവരും നിലത്ത് വീണപ്പോൾ, എബ്രായ ഭാഷയിൽ[a] എന്നോടു ഇങ്ങനെ പറയുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു: “ശൗലേ, ശൗലേ, നീ എന്നെ പീഡിപ്പിക്കുന്നത് എന്തിന്? മുൾക്കോലുകൾക്കെതിരെ ചവിട്ടുന്നത്[b] നിനക്കു പ്രയാസമാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അരമായ ഭാഷയിൽ” എന്നും മനസ്സിലാക്കാം; ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ “എബ്രായ ഭാഷയിൽ/ഭാഷാഭേദത്തിൽ” എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: 'ഇത് ഒരു പഴഞ്ചൊല്ലാണ്: മൃഗത്തെ നയിക്കാൻ ഉപയോഗിക്കുന്ന കൂർത്ത കോലിനെതിരെ ചവിട്ടുന്നത് അതിനുതന്നെ ദോഷം വരുത്തും; അതുപോലെ, സംസാരിക്കുന്നവനെ എതിർക്കുന്നത് എതിർക്കുന്നവനുതന്നെ ദോഷം വരുത്തും.'
    reason: cultural_note
lexical_decisions:
- source_word: πάντων τε καταπεσόντων ἡμῶν εἰς τὴν γῆν
  choice: ഞങ്ങളെല്ലാവരും നിലത്തു വീണപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകി; πάντων, ἡμῶν എന്നിവയുടെ ‘ഞങ്ങളെല്ലാവരും’ എന്ന അർഥവും, മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന വീഴ്ചയും നിലനിർത്തുന്നു.
- source_word: ἤκουσα φωνὴν λέγουσαν πρός με
  choice: എന്നോടു പറയുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു
  rationale: തുടർന്ന് വ്യക്തമായ വാക്കുകൾ വരുന്നതിനാൽ φωνήയെ ‘ശബ്ദം’ എന്നു നൽകി; λέγουσαν πρός με എന്നത് ശബ്ദം പൗലോസിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: എബ്രായഭാഷയിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു. ഇവിടെ അരമായഭാഷ ഉദ്ദേശിച്ചിരിക്കാമെന്ന ചരിത്രഭാഷാശാസ്ത്ര സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Σαοὺλ Σαούλ
  choice: ശൗലേ, ശൗലേ
  rationale: സെമിറ്റിക് നാമരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം സ്വീകരിക്കുകയും നേരിട്ടുള്ള സംബോധനവും ആവർത്തനത്തിന്റെ ഊന്നലും നിലനിർത്തുകയും ചെയ്തു.
- source_word: τί με διώκεις;
  choice: നീ എന്നെ പീഡിപ്പിക്കുന്നത് എന്തിന്?
  rationale: വർത്തമാനകാലത്തിലെ തുടർച്ചയായ വൈരപരമായ ഉപദ്രവത്തെ സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σκληρόν σοι
  choice: നിനക്കു പ്രയാസമാണ്
  rationale: σκληρόν എന്നതിന്റെ പ്രയോഗപരമായ ‘കഠിനം/പ്രയാസം’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; σοι എന്ന ദാതിവ് ‘നിനക്കു’ എന്നു നിലനിർത്തുന്നു.
- source_word: πρὸς κέντρα λακτίζειν
  choice: കാലിത്തെളിക്കോലുകൾക്കെതിരെ തൊഴിക്കുന്നത്
  rationale: κέντρα എന്നത് മൃഗങ്ങളെ തെളിക്കാൻ ഉപയോഗിച്ചിരുന്ന കൂർത്ത കോലുകളെയാണ് സൂചിപ്പിക്കുന്നത്; λακτίζειν എന്നത് ‘തൊഴിക്കുക’ എന്നു നൽകി ദൃശ്യരൂപവും പഴഞ്ചൊല്ലിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ എന്ന പ്രയോഗത്തിന്റെ ഭാഷാപരമായ തിരിച്ചറിയൽ
  choice: എബ്രായഭാഷയിൽ
  alternative: അരമായഭാഷയിൽ
  rationale: മൂലഗ്രീക്ക് പദപ്രയോഗം ‘എബ്രായ’ എന്നാണ് പറയുന്നത്. ഒന്നാം നൂറ്റാണ്ടിലെ ഉപയോഗത്തിൽ ഇത് അരമായഭാഷയെ സൂചിപ്പിച്ചിരിക്കാമെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിശ്ചയിച്ചുറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: σκληρόν σοι πρὸς κέντρα λακτίζειν എന്ന പഴഞ്ചൊല്ലിന്റെ അവതരണം
  choice: കാലിത്തെളിക്കോലുകൾക്കെതിരെ തൊഴിക്കുന്നത് നിനക്കു പ്രയാസമാണ്
  alternative: എതിർക്കുന്നതിലൂടെ നീ നിനക്കുതന്നെ ദോഷം വരുത്തുന്നു
  rationale: പ്രയോഗത്തിന്റെ വ്യാഖ്യാനാർഥം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ കൃഷിസംബന്ധമായ ദൃശ്യരൂപം നിലനിർത്തി; അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. അപരിചിതമായ കൃഷിദൃശ്യത്തെ കൃത്യതയോടെ സൂചിപ്പിക്കാൻ ‘കാലിത്തെളിക്കോൽ’ ഉപയോഗിച്ചു; അതിന്റെ പഴഞ്ചൊല്ലുസ്വഭാവം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
