id: ACT.26.2
reference: Acts 26:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ πάντων ὧν ἐγκαλοῦμαι ὑπὸ Ἰουδαίων, βασιλεῦ Ἀγρίππα, ἥγημαι ἐμαυτὸν μακάριον ἐπὶ σοῦ μέλλων ⸂σήμερον ἀπολογεῖσθαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/002.yaml
  text: Concerning all the things of which I am accused by the Jews[a], King Agrippa, I consider myself fortunate that I am about to make my defense before you today,
translation:
  language: ml
  text: അഗ്രിപ്പാ രാജാവേ, യെഹൂദന്മാർ എനിക്കെതിരെ ഉന്നയിക്കുന്ന സകല ആരോപണങ്ങളെക്കുറിച്ചും ഇന്ന് അങ്ങയുടെ മുമ്പാകെ എന്റെ പ്രതിവാദം അവതരിപ്പിക്കാൻ പോകുന്നതിനാൽ ഞാൻ എന്നെത്തന്നെ ഭാഗ്യവാനായി കരുതുന്നു,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ πάντων ὧν
  choice: എല്ലാ ആരോപണങ്ങളെയും സംബന്ധിച്ച്
  rationale: περί + genitive വിഷയത്തെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ἐγκαλοῦμαι എന്ന നിയമപരമായ ക്രിയയുടെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളാൻ ‘ആരോപണങ്ങൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: ἐγκαλοῦμαι ὑπὸ Ἰουδαίων
  choice: യെഹൂദന്മാർ എനിക്കെതിരെ ഉന്നയിക്കുന്ന ... ആരോപണങ്ങൾ
  rationale: ക്രിയയുടെ വർത്തമാനകാല നിയമപരമായ കുറ്റാരോപണഭാവവും ὑπό സൂചിപ്പിക്കുന്ന കർത്തൃത്വവും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് പൗലോസിന്റെ യെഹൂദ കുറ്റാരോപകരെയാണ് സൂചിപ്പിക്കുന്നത്; മുഴുവൻ ജനവിഭാഗത്തെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്നില്ല.
- source_word: βασιλεῦ Ἀγρίππα
  choice: അഗ്രിപ്പാ രാജാവേ
  rationale: സംബോധനാവിഭക്തി ആധുനികവും ആദരപൂർവവുമായ മലയാളത്തിൽ നേരിട്ടുള്ള അഭിസംബോധനയായി നൽകി.
- source_word: ἥγημαι ἐμαυτὸν μακάριον
  choice: ഞാൻ ഭാഗ്യവാനാണെന്ന് കരുതുന്നു
  rationale: ἡγέομαιയുടെ ‘കരുതുക/പരിഗണിക്കുക’ എന്ന അർഥവും reflexive ആശയവും സൂക്ഷിക്കുന്നു. കോടതിസന്ദർഭത്തിൽ μακάριον എന്നത് പ്രധാനമായി അനുകൂലമായ അവസരം ലഭിച്ചവൻ എന്ന അർഥത്തിലുള്ള ‘ഭാഗ്യവാൻ’ ആണ്.
- source_word: ἐπὶ σοῦ
  choice: അങ്ങയുടെ മുമ്പാകെ
  rationale: വിചാരണയുടെയോ ഔദ്യോഗിക കേൾവിയുടെയോ പശ്ചാത്തലത്തിലുള്ള ‘before you’ എന്ന അർഥം ആദരസൂചകമായി നൽകുന്നു; അഗ്രിപ്പാ ഔപചാരിക ന്യായാധിപനാണെന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: μέλλων σήμερον ἀπολογεῖσθαι
  choice: ഇന്ന് ... പ്രതിവാദം നടത്താൻ കഴിയുന്നതിൽ
  rationale: ἀπολογεῖσθαιയുടെ നിയമപരമായ സ്വയംപ്രതിരോധ പ്രസംഗം ‘പ്രതിവാദം നടത്തുക’ എന്നു നൽകി. μέλλων സൂചിപ്പിക്കുന്ന ഉടൻ സംഭവിക്കാനിരിക്കുന്ന അവസരം മലയാളത്തിലെ സ്വാഭാവിക ഘടനയിൽ ‘കഴിയുന്നതിൽ’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു; ‘ഇന്ന്’ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: μακάριον എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: ഭാഗ്യവാൻ
  alternative: അനുഗൃഹീതൻ / ധന്യൻ
  rationale: ഇവിടെ പൗലോസ് അഗ്രിപ്പാവിന്റെ മുമ്പിൽ പ്രതിവാദം നടത്താനുള്ള അനുകൂല അവസരത്തെക്കുറിച്ചാണ് പറയുന്നത്. അതിനാൽ വ്യക്തമായ ദൈവിക അനുഗ്രഹപ്രഖ്യാപനമായി മാറ്റാതെ കോടതിസന്ദർഭത്തിലെ അർഥം മുൻനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, dignified മലയാളം. രാജാവിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം കോമ നിലനിർത്തി. ഈ വാക്യത്തിന് നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പ് μακάριον എന്നതിനെക്കുറിച്ചാണെങ്കിലും അതിന്റെ [a] അടയാളം ഇംഗ്ലീഷ് പ്രധാനപാഠത്തിൽ അബദ്ധമായി ‘Jews’ എന്നതിന് ശേഷമാണുള്ളത്; മലയാള കരടിൽ തെറ്റായ ബന്ധം സൃഷ്ടിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
