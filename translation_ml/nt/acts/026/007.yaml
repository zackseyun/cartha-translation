id: ACT.26.7
reference: Acts 26:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ἣν τὸ δωδεκάφυλον ἡμῶν ἐν ἐκτενείᾳ νύκτα καὶ ἡμέραν λατρεῦον ἐλπίζει καταντῆσαι· περὶ ἧς ἐλπίδος ἐγκαλοῦμαι ⸂ὑπὸ Ἰουδαίων, βασιλεῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/007.yaml
  text: to which our twelve tribes hope to attain[a], as they earnestly serve God night and day. It is concerning this hope that I am accused by the Jews[c][b], O king.
translation:
  language: ml
  text: നമ്മുടെ പന്ത്രണ്ടുഗോത്രജനത[a] രാവും പകലും തീക്ഷ്ണതയോടെ ദൈവത്തെ സേവിച്ചുകൊണ്ട്[b] അതിലേക്കെത്തുമെന്ന് പ്രത്യാശിക്കുന്നു. രാജാവേ, ഈ പ്രത്യാശയെക്കുറിച്ചാണ് യെഹൂദന്മാർ[c] എന്നെ കുറ്റപ്പെടുത്തുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ പന്ത്രണ്ടു ഗോത്രങ്ങൾ.’ ഗ്രീക്കിൽ ഇസ്രായേലിനെ പന്ത്രണ്ടു ഗോത്രങ്ങൾ ചേർന്ന ഒരൊറ്റ ജനതയായി സൂചിപ്പിക്കുന്ന കൂട്ടായ ഏകവചനമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സേവിക്കുക’ എന്നതിന് ‘ആരാധിക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കുപദം ദൈവത്തിനു സമർപ്പിക്കുന്ന മതപരമായ സേവനത്തെയോ ആരാധനയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘യെഹൂദന്മാർ’ എന്നത് പൗലൊസിനെതിരെ നിയമപരമായി ആരോപണം ഉന്നയിച്ച യെഹൂദരെയാണ് സൂചിപ്പിക്കുന്നത്; എല്ലാ യെഹൂദരെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്ന പ്രസ്താവനയല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: അതിലേക്കു
  rationale: മുൻവാക്യത്തിലെ ദൈവിക വാഗ്ദാനത്തെ ലക്ഷ്യമായി ചൂണ്ടിക്കാണിക്കുന്ന εἰς എന്നതിന്റെ ദിശാസൂചകഭാവം നിലനിർത്തുന്നു.
- source_word: τὸ δωδεκάφυλον ἡμῶν
  choice: നമ്മുടെ പന്ത്രണ്ടുഗോത്രജനത
  rationale: കൂട്ടായ ഏകവചനമായ δωδεκάφυλον ഇസ്രായേലിനെ പന്ത്രണ്ടു ഗോത്രങ്ങൾ ചേർന്ന ഒരു ജനതയായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഈ കൂട്ടായ അർഥം നൽകുന്നു.
- source_word: ἐν ἐκτενείᾳ
  choice: തീക്ഷ്ണതയോടെ
  rationale: തീവ്രമായ അർപ്പണവും നിരന്തരമായ പരിശ്രമവും സൂചിപ്പിക്കുന്ന പ്രയോഗത്തെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: νύκτα καὶ ἡμέραν
  choice: രാവും പകലും
  rationale: ഗ്രീക്കിലെ ക്രമവും തുടർച്ചയായ പ്രവർത്തനമെന്ന ശൈലീഭാവവും നിലനിർത്തുന്നു.
- source_word: λατρεῦον
  choice: ദൈവത്തെ സേവിച്ചുകൊണ്ട്
  rationale: ദൈവത്തിനു സമർപ്പിക്കുന്ന മതപരമായ സേവനം/ആരാധന എന്ന വിശാലമായ അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായി മനസ്സിലാകുന്ന ദൈവത്തെ കർമമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐλπίζει καταντῆσαι
  choice: എത്തിച്ചേരാമെന്ന് പ്രത്യാശിക്കുന്നു
  rationale: പ്രതീക്ഷിക്കുന്ന ലക്ഷ്യത്തിൽ എത്തുക എന്ന καταντάωയുടെ ചലന-ലക്ഷ്യ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: περὶ ἧς ἐλπίδος
  choice: ഈ പ്രത്യാശയെക്കുറിച്ചാണ്
  rationale: περί + genitive എന്നതിന്റെ ‘സംബന്ധിച്ച്’ എന്ന അർഥം നിലനിർത്തുകയും മുൻപ് പറഞ്ഞ പ്രത്യാശയെ വ്യക്തമായി തിരിച്ചുചൂണ്ടുകയും ചെയ്യുന്നു.
- source_word: ἐγκαλοῦμαι
  choice: എന്നെ കുറ്റപ്പെടുത്തുന്നത്
  rationale: കോടതിസന്ദർഭത്തിലെ നിയമപരമായ ആരോപണത്തിന്റെ നിഷ്ക്രിയ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπὸ Ἰουδαίων
  choice: യെഹൂദന്മാർ
  rationale: ആരോപിക്കുന്ന കർത്താവിനെ മലയാളത്തിലെ കർത്തൃപ്രയോഗത്തിലൂടെ വ്യക്തമായി നൽകുന്നു; ഇവിടെ പ്രത്യേക ആരോപകരെയാണ് ഉദ്ദേശിക്കുന്നതെന്നും മുഴുവൻ ജനവിഭാഗത്തെയും അല്ലെന്നും അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: βασιλεῦ
  choice: രാജാവേ
  rationale: അഗ്രിപ്പാവിനോടുള്ള നേരിട്ടുള്ള സംബോധനയും ഔപചാരികമായ വാഗ്മിത്വഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: λατρεῦον എന്നതിന്റെ പരോക്ഷ കർമം
  choice: ദൈവത്തെ സേവിച്ചുകൊണ്ട്
  alternative: ആരാധിച്ചുകൊണ്ട്; സേവിച്ചുകൊണ്ട്
  rationale: ഗ്രീക്കിൽ ‘ദൈവം’ പ്രത്യേകം രേഖപ്പെടുത്തിയിട്ടില്ലെങ്കിലും, ഇസ്രായേലിന്റെ നിരന്തരമായ മതപരമായ ശുശ്രൂഷയാണ് സന്ദർഭം. ‘ദൈവത്തെ’ ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്ര അവകാശവാദം സൃഷ്ടിക്കാതെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; ‘സേവിക്കുക’ ആരാധനയുൾപ്പെടുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- issue: പ്രത്യാശയുടെ ഉള്ളടക്കം
  choice: മുൻവാക്യത്തിലെ വാഗ്ദാനത്തിലേക്കുള്ള സൂചന മാത്രം നിലനിർത്തുന്നു
  alternative: ഈ വാക്യത്തിൽ തന്നെ പുനരുത്ഥാനത്തെ വ്യക്തമാക്കുക; പൊതുവായ പ്രത്യാശയായി നൽകുക
  rationale: സമീപസന്ദർഭത്തിൽ പ്രത്യാശ പിതാക്കന്മാർക്കു ദൈവം നൽകിയ വാഗ്ദാനത്തോടും പൗലൊസിന്റെ പ്രതിരോധത്തിലെ പുനരുത്ഥാനവിഷയത്തോടും ബന്ധപ്പെട്ടിരിക്കുന്നു. എന്നാൽ ഈ വാക്യം അതിന്റെ ഉള്ളടക്കം വീണ്ടും തുറന്നു പറയാത്തതിനാൽ വിവർത്തനം അതു ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ‘പന്ത്രണ്ടുഗോത്രജനത’ കൂട്ടായ ഏകവചനത്തിന്റെ സ്രോതസ്സാർഥം കാത്തുസൂക്ഷിക്കുന്നു; ‘രാജാവേ’ ഔപചാരിക സംബോധന നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
