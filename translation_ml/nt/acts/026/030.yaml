  text: അപ്പോൾ രാജാവും ഗവർണറും ബെർനീക്കെയും[a] അവരോടൊപ്പം ഇരുന്നവരും എഴുന്നേറ്റു,
  philosophy: optimal-equivalence
  footnotes:
