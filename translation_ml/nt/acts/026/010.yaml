id: ACT.26.10
reference: Acts 26:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ καὶ ἐποίησα ἐν Ἱεροσολύμοις, καὶ πολλούς ⸀τε τῶν ἁγίων ἐγὼ ⸀ἐν φυλακαῖς κατέκλεισα τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών, ἀναιρουμένων τε αὐτῶν κατήνεγκα ψῆφον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/010.yaml
  text: 'And this is what I did in Jerusalem: I not only locked up many of the saints in prisons[a], having received authority from the chief priests, but also, when they were being put to death[b], I cast my vote against them.'
translation:
  language: ml
  text: 'ഞാൻ യെരൂശലേമിൽ ചെയ്തതും ഇതുതന്നെ: മഹാപുരോഹിതന്മാരിൽനിന്ന് അധികാരം ലഭിച്ച്, വിശുദ്ധരിൽ[a] പലരെയും ഞാൻ തടവറകളിൽ അടച്ചു; കൂടാതെ, അവരെ വധിക്കുമ്പോൾ, അവർക്കെതിരേ ഞാൻ വോട്ട് രേഖപ്പെടുത്തി.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധർ’ എന്നു പറയുന്നത് യേശുവിൽ വിശ്വസിക്കുന്ന ദൈവജനത്തെയാണ്; പിന്നീട് പ്രത്യേകമായി വിശുദ്ധപദവി ലഭിച്ചവരെ മാത്രമല്ല.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ ψῆφος എന്ന പദത്തിന് ആദ്യം ‘വോട്ടുകല്ല്’ എന്ന അർഥമുണ്ടെങ്കിലും ഇവിടെ അതിന് ‘വോട്ട്’ എന്നാണ് അർഥം. പൗലോസ് അവർക്കെതിരേ വോട്ട് രേഖപ്പെടുത്തിയെന്നു പ്രയോഗം സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ സ്ഥാപനപരമായ സാഹചര്യം വ്യക്തമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησα
  choice: ഞാൻ ... ചെയ്തതും അതുതന്നെയാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പീഡനനടപടിയിലേക്കുള്ള ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καί-യുടെ ‘അതും/തന്നെ’ എന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐν Ἱεροσολύμοις
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
- source_word: πολλούς τε τῶν ἁγίων
  choice: വിശുദ്ധരിൽ പലരെയും
  rationale: ἅγιοι ക്രിസ്തുവിൽ വിശ്വസിക്കുന്ന ദൈവജനത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധർ’ എന്നത് പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട വിശുദ്ധപദവി എന്ന ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: ἐν φυλακαῖς κατέκλεισα
  choice: തടവറകളിൽ അടച്ചു
  rationale: κατακλείωയുടെ അടച്ചുപൂട്ടി തടവിലാക്കുക എന്ന ശക്തിയും φυλακαῖς എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν παρὰ τῶν ἀρχιερέων ἐξουσίαν λαβών
  choice: മഹാപുരോഹിതന്മാരിൽനിന്ന് അധികാരം ലഭിച്ചശേഷം
  rationale: പൗലോസിന്റെ നടപടിക്കുള്ള അധികാരത്തിന്റെ ഉറവിടം വ്യക്തമാക്കുന്നു. മുൻകാല സംഭവവിവരണത്തിൽ പൂർത്തിയായ പ്രവൃത്തിയായി പങ്കുപദത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀναιρουμένων τε αὐτῶν
  choice: അവരെ വധിക്കുമ്പോൾ
  rationale: നിഷ്ക്രിയ പങ്കുപദത്തിന്റെ കാലസംബന്ധം നിലനിർത്തുകയും ἀναιρέωയുടെ ‘കൊല്ലുക/വധിക്കുക’ എന്ന ഗൗരവമുള്ള അർഥം നൽകുകയും ചെയ്യുന്നു; നിയമപരമായ വധശിക്ഷയാണെന്ന് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: κατήνεγκα ψῆφον
  choice: അവർക്കെതിരായി ഞാനും വോട്ട് രേഖപ്പെടുത്തി
  rationale: ψῆφος എന്നത് വോട്ടിനായി ഉപയോഗിച്ച കല്ലിനെയും അതുവഴി വോട്ടിനെയും സൂചിപ്പിക്കുന്നു. ‘വോട്ട് രേഖപ്പെടുത്തി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘അവർക്കെതിരായി’ എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായ ദിശ വ്യക്തമാക്കുന്നു. ഞാനും എന്ന രൂപം വാക്യത്തിലെ ആവർത്തിത καί/τε ഘടനയും ἐγώയുടെ ഊന്നലും പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: പ്രവൃത്തികളിലെ ἅγιοι എന്ന പദത്തിന്റെ അർഥം
  choice: ‘വിശുദ്ധർ’—യേശുവിൽ വിശ്വസിക്കുന്ന ദൈവജനത്തെ സൂചിപ്പിക്കുന്നു
  alternative: ‘വിശുദ്ധജനങ്ങൾ’ അല്ലെങ്കിൽ ‘ദൈവജനം’
  rationale: ഈ പദം വിശ്വാസിസമൂഹത്തിലെ ഒരു പ്രത്യേക ഉന്നതവിഭാഗത്തെ അല്ല, ക്രിസ്തീയ സമൂഹത്തിലെ അംഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠത്തിൽ പ്രധാന പുതിയനിയമ പദബന്ധം നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: κατήνεγκα ψῆφον ഔപചാരിക വോട്ടാണോ പൊതുവായ സമ്മതമാണോ
  choice: ‘വോട്ട് രേഖപ്പെടുത്തി’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തി
  alternative: ‘അവരുടെ വധത്തെ അംഗീകരിച്ചു’
  rationale: ഗ്രീക്ക് പ്രയോഗം വോട്ട് ഇടുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ സ്ഥാപനപരമായ പശ്ചാത്തലം വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പൊതുവായ അംഗീകാരമായി ലഘൂകരിക്കാതെയും ഒരു പ്രത്യേക സഭയിലെ അംഗത്വം അനുമാനിക്കാതെയും ഭാഷാപരമായ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും പൊതുവായ വായനാസൗകര്യവും ഉള്ള മലയാളം. ‘തടവറ’, ‘വധിക്കുക’, ‘വോട്ട് രേഖപ്പെടുത്തുക’ എന്നിവ മൂലപാഠത്തിന്റെ നിയമ-പീഡന പശ്ചാത്തലം വ്യക്തമായി നൽകുന്നു. വാക്യത്തിന്റെ രണ്ടു സമാന്തര നടപടികൾ അർദ്ധവിരാമം ഉപയോഗിച്ച് വേർതിരിച്ചു.
