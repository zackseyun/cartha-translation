source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Παῦλος· Οὐ μαίνομαι, φησίν, κράτιστε Φῆστε, ἀλλὰ ἀληθείας καὶ σωφροσύνης ῥήματα ἀποφθέγγομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/025.yaml
  text: But Paul said[a], “I am not out of my mind, most excellent Festus[c][b], but I am speaking words of truth and sound judgment.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് പറഞ്ഞു: “എനിക്കു ഭ്രാന്തില്ല[a], അത്യന്തം ബഹുമാന്യനായ ഫെസ്തൊസേ[b], മറിച്ച്, സത്യത്തിന്റെയും സുബോധത്തിന്റെയും വാക്കുകളാണ് ഞാൻ പറയുന്നത്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “എനിക്കു ഭ്രാന്തുപിടിച്ചിട്ടില്ല.”
    reason: lexical_alternative
  - marker: b
    text: “അത്യന്തം ബഹുമാന്യനായ” എന്നത് ഉന്നത ഉദ്യോഗസ്ഥനെ അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിച്ചിരുന്ന ഔപചാരിക ബഹുമാനപദമാണ്.
    reason: cultural_note
  - marker: c
    text: “സത്യത്തിന്റെയും മനസ്സിന്റെ സമനിലയുടെയും വാക്കുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ “സുബോധം” എന്നതിന് വിവേകം, ആത്മസംയമനം എന്നീ അർഥച്ചായകളും ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഫെസ്തൊസിന്റെ ആരോപണത്തോടുള്ള പൗലോസിന്റെ മറുപടിയിലെ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μαίνομαι
  choice: എനിക്കു ഭ്രാന്തില്ല
  rationale: ഭ്രാന്തനായിരിക്കുക, സമനില തെറ്റിയിരിക്കുക എന്ന ക്രിയയുടെ അർഥം ലളിതവും നേരിട്ടുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φησίν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κράτιστε
  choice: അത്യന്തം ബഹുമാന്യനായ
  rationale: ഉന്നത ഉദ്യോഗസ്ഥനെ ഔപചാരികമായി അഭിസംബോധന ചെയ്യുന്ന ബഹുമാനപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; പഴഞ്ചൻ രാജകീയ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἀληθείας
  choice: സത്യത്തിന്റെ
  rationale: ഗ്രീക്കിലെ നാമപദഘടന നിലനിർത്തി വാക്കുകളുടെ സത്യസ്വഭാവത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: σωφροσύνης
  choice: സുബോധത്തിന്റെ
  rationale: മാനസിക സമനില, വിവേകം, ആത്മനിയന്ത്രണം എന്നീ അർഥവ്യാപ്തികളെ ചുരുക്കാതെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ῥήματα
  choice: വാക്കുകൾ
  rationale: മൂലത്തിലെ ബഹുവചന നാമത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀποφθέγγομαι
  choice: ഞാൻ പറയുന്നത്
  rationale: വ്യക്തമായി ശബ്ദിച്ചു പ്രസ്താവിക്കുക എന്ന ആശയം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ഉച്ചരിക്കുന്നു’ എന്ന അനാവശ്യ ഔപചാരികത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: σωφροσύνης എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: സുബോധത്തിന്റെ
  alternative: വിവേകത്തിന്റെ; മനസ്സിന്റെ സമനിലയുടെ; ആത്മസംയമനത്തിന്റെ
  rationale: പൗലോസ് പറയുന്നത് യുക്തിസഹവും മാനസികസമനിലയുള്ളതുമാണെന്ന അർഥം നിലനിർത്തുന്നു; ഈ പദത്തെ ഒരു പ്രത്യേക സദാചാരമോ ദൈവശാസ്ത്രപരമായ ആശയമോ ആയി മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. ഫെസ്തൊസിനോടുള്ള ഔപചാരിക ബഹുമാനം നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ഭരണപദങ്ങൾ ഒഴിവാക്കി. പൗലോസിന്റെ മറുപടിയിലെ ഉറച്ച വൈരുധ്യം ‘എന്നാൽ’, ‘മറിച്ച്’ എന്നിവയിലൂടെ പ്രകടമാക്കി.
