id: ACT.26.23
reference: Acts 26:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ παθητὸς ὁ χριστός, εἰ πρῶτος ἐξ ἀναστάσεως νεκρῶν φῶς μέλλει καταγγέλλειν τῷ ⸀τε λαῷ καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/023.yaml
  text: that the Messiah would suffer[a], and that, as the first to rise from the dead[d][c][b], he would proclaim light both to the people and to the Gentiles.
translation:
  language: ml
  text: ക്രിസ്തു കഷ്ടം അനുഭവിക്കുമെന്നും[a], മരിച്ചവരിൽനിന്ന് ആദ്യം ഉയിർത്തെഴുന്നേറ്റ് അവൻ ജനത്തിനും[b] ജനതകൾക്കും[c] വെളിച്ചം പ്രഖ്യാപിക്കുമെന്നും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ക്രിസ്തു’ എന്നതിന് ‘മശീഹാ’ എന്നും പറയാം. ഗ്രീക്കിലെ Χριστός ഇവിടെ സ്ഥാനപ്പേരായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ജനം’ ഇവിടെ ‘ജനതകൾ’ എന്നതുമായുള്ള വൈരുധ്യത്തിൽ യഹൂദജനത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ജനതകൾ’ എന്നത് ഈ സന്ദർഭത്തിൽ സാധാരണയായി യഹൂദേതരരെ സൂചിപ്പിക്കുന്നു; ‘വിജാതീയർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്ക് ഘടനയെ ‘മരിച്ചവരിൽനിന്ന് ഉയിർത്തെഴുന്നേൽപ്പിൽ ആദ്യനായ അവൻ ജനത്തിനും ജനതകൾക്കും വെളിച്ചം പ്രഖ്യാപിക്കുമെന്നും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: παθητὸς
  choice: കഷ്ടം അനുഭവിക്കുമെന്നും
  rationale: പ്രവചനസംഗ്രഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘കഷ്ടം അനുഭവിക്കേണ്ടവൻ/കഷ്ടം അനുഭവിക്കും’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ദാർശനികമായ ‘കഷ്ടം അനുഭവിക്കാൻ ശേഷിയുള്ളവൻ’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ὁ χριστός
  choice: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്. മലയാള ബൈബിൾഭാഷയിൽ ‘ക്രിസ്തു’ ഈ സ്ഥാനപ്പേരായി സ്വാഭാവികവും വ്യാപകമായി ഗ്രഹിക്കപ്പെടുന്നതുമാണ്; ‘മശീഹാ’ എന്ന സാധ്യത കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πρῶτος ἐξ ἀναστάσεως νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനത്തിൽനിന്ന് ആദ്യനായിട്ട്
  rationale: ഗ്രീക്കിലെ സങ്കുചിതവും അല്പം ദ്വയാർഥവുമായ ഘടന അതിവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു; പുനരുത്ഥാനത്തിലെ മുൻഗണന വ്യക്തമാക്കുമ്പോഴും മുൻകാല ജീവിപ്പിക്കലുകളെക്കുറിച്ചുള്ള വിശദീകരണം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: വെളിപ്പാട്, രക്ഷ, പ്രത്യാശ എന്നിവ ഉൾക്കൊള്ളുന്ന ബൈബിൾ രൂപകം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μέλλει καταγγέλλειν
  choice: പ്രഖ്യാപിക്കുമെന്നും
  rationale: ഭാവിയെയോ നിയോഗിക്കപ്പെട്ട ഫലത്തെയോ സൂചിപ്പിക്കുന്ന μέλλωയും ‘പരസ്യമായി അറിയിക്കുക’ എന്ന καταγγέλλωയും ഈ പരോക്ഷവിവരണത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῷ τε λαῷ
  choice: ജനത്തിനും
  rationale: λαός എന്ന മൂലപദത്തിന്റെ പൊതുരൂപം നിലനിർത്തുന്നു; ἔθνηയുമായുള്ള വൈരുധ്യം ഇത് യഹൂദജനത്തെ സൂചിപ്പിക്കുന്നുവെന്ന് സൂചന നൽകുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകൾക്കും
  rationale: ἔθνηയുടെ അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുകയും യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τε ... καὶ
  choice: ജനത്തിനും ... ജനതകൾക്കും
  rationale: മലയാളത്തിലെ ആവർത്തിച്ചുള്ള ‘-ഉം ... -ഉം’ ഘടന ഗ്രീക്കിലെ സഹബന്ധകജോടിയെ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിലെ ‘ആദ്യൻ’ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവന
  choice: ‘മരിച്ചവരുടെ പുനരുത്ഥാനത്തിൽനിന്ന് ആദ്യനായിട്ട്’ എന്നു മൂലത്തിലെ മുൻഗണന നിലനിർത്തി.
  alternative: ‘വീണ്ടും മരിക്കാത്തവിധം ആദ്യം ഉയിർത്തെഴുന്നേറ്റവനായി’ അല്ലെങ്കിൽ ‘അന്ത്യപുനരുത്ഥാനത്തിന്റെ ആദ്യഫലമായി’.
  rationale: πρῶτος മുൻഗണന വ്യക്തമാക്കുന്നു; എന്നാൽ അതിന്റെ സമ്പൂർണ ദൈവശാസ്ത്രവിവരണം ഈ വാക്യം തന്നെ തുറന്നുപറയുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ‘ജനം’ എന്നതിന്റെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘ജനം’ എന്ന് നിലനിർത്തി; യഹൂദജനമാണ് സാധ്യതയെന്നു കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘യഹൂദജനം’ അല്ലെങ്കിൽ ‘ഇസ്രായേൽ’.
  rationale: λαός എന്ന മൂലപദം സംരക്ഷിക്കുമ്പോൾ, പിന്നാലെയുള്ള ἔθνηയുമായുള്ള വൈരുധ്യം യഹൂദസൂചന വായനക്കാരന് നൽകുന്നു.
- issue: εἰ ... εἰ എന്ന ഘടനയുടെ സ്വഭാവം
  choice: ‘...എന്നും ...എന്നും ആയിരുന്നു അത്’ എന്ന പരോക്ഷസംഗ്രഹമായി നൽകി.
  alternative: നിബന്ധനാസൂചകമായി ‘ക്രിസ്തു കഷ്ടം അനുഭവിക്കുമോ, ... പ്രഖ്യാപിക്കുമോ’ എന്നു നൽകുക.
  rationale: മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ εἰ ഘടകങ്ങൾ മോശെയും പ്രവാചകന്മാരും പറഞ്ഞ കാര്യങ്ങളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; യഥാർഥ സംശയമോ നിബന്ധനയോ മുഖ്യമായിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ബൈബിൾഭാഷ ഉപയോഗിച്ചു. ‘പുനരുത്ഥാനം’, ‘പ്രഖ്യാപിക്കുക’, ‘വെളിച്ചം’ എന്നീ പരിചിതമായ ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ സങ്കുചിത പുനരുത്ഥാനഘടന അമിതമായി വിശദീകരിച്ചില്ല.
