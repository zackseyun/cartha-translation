  to: ക്രിസ്തു കഷ്ടം അനുഭവിക്കുമെന്നും[a], മരിച്ചവരിൽനിന്ന് ആദ്യം ഉയിർത്തെഴുന്നേറ്റ് അവൻ ജനത്തിനും[b] ജനതകൾക്കും[c] വെളിച്ചം പ്രഖ്യാപിക്കുമെന്നും[d].
  rationale: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പ്രയോഗം ‘മരിച്ചവരിൽനിന്ന് ആദ്യം ഉയിർത്തെഴുന്നേറ്റ്’ എന്ന് തിരുത്തി, ഗ്രീക്കിലെ മുൻഗണനയും ഉയിർത്തെഴുന്നേൽപ്പുസൂചനയും വ്യക്തമായി നിലനിർത്തി. അനാവശ്യമായ വാക്യാന്ത്യവിശദീകരണം നീക്കി, ഈ വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്ന ഉള്ളടക്കവാക്യമാണെന്ന ഉറവിടഘടന സംരക്ഷിച്ചു. എല്ലാ നിലവിലെ കുറിപ്പുചിഹ്നങ്ങളും നിലനിർത്തി; d കുറിപ്പ് പുതുക്കിയ പ്രയോഗത്തോടു പൊരുത്തപ്പെടുത്തി.
