id: ACT.26.32
reference: Acts 26:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ τῷ Φήστῳ ἔφη· Ἀπολελύσθαι ἐδύνατο ὁ ἄνθρωπος οὗτος εἰ μὴ ἐπεκέκλητο Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/032.yaml
  text: Then Agrippa said to Festus[a], “This man could have been released if he had not appealed to Caesar.”
translation:
  language: ml
  text: 'അപ്പോൾ അഗ്രിപ്പാവ് ഫെസ്തൊസിനോടു പറഞ്ഞു: “ഈ മനുഷ്യൻ കൈസറോടു അപ്പീൽ ചെയ്തിരുന്നില്ലെങ്കിൽ മോചിതനാകാമായിരുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥാഗതിയിലെ മുന്നേറ്റവും അഗ്രിപ്പാവിന്റെ സമാപനപ്രസ്താവനയിലേക്കുള്ള മാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: ഇവിടെ അപൂർണഭൂതകാലരൂപം സാധാരണ വിവരണാത്മക സംഭാഷണ-ആമുഖമായി പ്രവർത്തിക്കുന്നതിനാൽ ലളിതമായ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: Ἀπολελύσθαι
  choice: മോചിപ്പിക്കാമായിരുന്നു
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ἀπολύω തടങ്കലിൽനിന്നുള്ള മോചനത്തെ സൂചിപ്പിക്കുന്നു; ഔപചാരിക കുറ്റവിമുക്തി എന്നതിനേക്കാൾ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐδύνατο
  choice: -ക്കാമായിരുന്നു
  rationale: നടപ്പാകാതെ പോയ ഭൂതകാലസാധ്യതയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: നിർദ്ദേശകത്തിന്റെ ഊന്നലും പൗലൊസ് എന്ന നിർദിഷ്ട പുരുഷനെക്കുറിച്ചുള്ള പരാമർശവും നിലനിർത്തുന്നു.
- source_word: εἰ μὴ
  choice: ചെയ്തിരുന്നില്ലെങ്കിൽ
  rationale: നടക്കാതെ പോയ മറ്റൊരു സാധ്യതയെ സൂചിപ്പിക്കുന്ന വ്യവസ്ഥ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπεκέκλητο
  choice: അപ്പീൽ ചെയ്തിരുന്നില്ലെങ്കിൽ
  rationale: റോമൻ നിയമസന്ദർഭത്തിൽ കൈസറിന്റെ വിധിന്യായം അഭ്യർഥിക്കുന്ന സാങ്കേതിക അർഥം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: Καίσαρα
  choice: കൈസറോടു
  rationale: ചരിത്രപരവും നിയമപരവുമായ പദവി നിലനിർത്തുന്നു; ‘ചക്രവർത്തി’ എന്ന വ്യാഖ്യാനപരമായ പകരം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ നിയമ-വിവരണ ശൈലി. ഗ്രീക്കിലെ വാക്യക്രമം യാന്ത്രികമായി പകർത്താതെ, ‘ഈ മനുഷ്യൻ’ എന്ന കർത്താവിനെയും ‘അവനെ’ എന്ന കർമത്തെയും വ്യക്തമാക്കി മലയാളത്തിലെ ആശയക്കുഴപ്പം ഒഴിവാക്കി.
