source:
  edition: SBLGNT
  text: ἐγὼ δὲ εἶπα· Τίς εἶ, κύριε; ὁ δὲ ⸀κύριος εἶπεν· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/015.yaml
  text: And I said[a], ‘Who are you, Lord?’ And the Lord said, ‘I am Jesus, whom you are persecuting.’
translation:
  language: ml
  text: 'ഞാൻ ചോദിച്ചു: “കർത്താവേ[a], അങ്ങ് ആരാണ്?” കർത്താവ് പറഞ്ഞു: “നീ പീഡിപ്പിക്കുന്ന യേശുവാണ് ഞാൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അയ്യാ.” ഗ്രീക്കിലെ κύριε ആദരസൂചകമായ ഒരു സംബോധനയായും ഉപയോഗിക്കാം. എന്നാൽ ഇവിടെ സ്വർഗീയ ദർശനത്തിൽ പ്രത്യക്ഷപ്പെട്ട സംസാരിക്കുന്നവൻ ഉടൻതന്നെ താൻ യേശുവാണെന്ന് അറിയിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “കർത്താവേ” എന്നാണ് നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ εἶπα
  choice: അപ്പോൾ ഞാൻ ചോദിച്ചു
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; അതിനാൽ ‘അപ്പോൾ’ സ്വാഭാവികമാണ്. ചോദ്യം ഉന്നയിക്കുന്ന സന്ദർഭത്തിൽ εἶπα എന്നതിനെ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നത് അർത്ഥം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: Τίς εἶ, κύριε;
  choice: കർത്താവേ, അങ്ങ് ആരാണ്?
  rationale: τίς εἶ എന്നത് ‘അങ്ങ് ആരാണ്?’ എന്നാണ്. κύριε എന്ന സംബോധനത്തിന് ഈ സ്വർഗീയ പ്രത്യക്ഷതയുടെ പശ്ചാത്തലത്തിൽ ‘കർത്താവേ’ നൽകിയിരിക്കുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: ὁ δὲ κύριος εἶπεν
  choice: കർത്താവ് പറഞ്ഞു
  rationale: ലേഖകന്റെ തിരിച്ചറിയിപ്പിൽ ὁ κύριος എന്നത് ‘കർത്താവ്’ എന്നാണ്. δέ മലയാളത്തിൽ വേറൊരു ബന്ധകമായി നിർബന്ധമായി പ്രകടിപ്പിക്കാതെ വാക്യക്രമത്തിലൂടെ കഥയുടെ ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: യേശുവാണ് ഞാൻ
  rationale: നേരിട്ടുള്ള സ്വയംതിരിച്ചറിയിപ്പാണ്. മലയാളത്തിലെ സ്വാഭാവികമായ വിധേയ-ഊന്നൽ ഘടന ഗ്രീക്കിലെ വ്യക്തമായ ἐγώയുടെ ഭാവം അതിശയോക്തിയില്ലാതെ കൈമാറുന്നു.
- source_word: ὃν σὺ διώκεις
  choice: നീ പീഡിപ്പിക്കുന്ന
  rationale: διώκω ഇവിടെ ശത്രുതാപരമായി ‘പീഡിപ്പിക്കുക’ എന്നാണ്. വർത്തമാനകാലത്തെ തുടരുന്ന പ്രവൃത്തി മലയാളത്തിലെ ബന്ധകക്രിയയായ ‘പീഡിപ്പിക്കുന്ന’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; σὺ ‘നീ’യായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ സംബോധനയിലും ലേഖകന്റെ തിരിച്ചറിയിപ്പിലും κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ് / കർത്താവേ
  alternative: പ്രഭോ; യജമാനനേ; അങ്ങേ
  rationale: κύριε ഒറ്റയ്ക്ക് ആദരസൂചക സംബോധനയായിരിക്കാമെങ്കിലും, സ്വർഗീയമായി പ്രത്യക്ഷപ്പെട്ട സംസാരിക്കുന്നവൻ ഉടൻ തന്നെ യേശുവാണെന്ന് വെളിപ്പെടുത്തുകയും ലേഖകൻ ὁ κύριος എന്നു പറയുകയും ചെയ്യുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘കർത്താവേ’ യോജിക്കുന്നു. എങ്കിലും സംബോധനത്തിലെ ശബ്ദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിൽ ആദരസൂചകമായി ‘അങ്ങ്’ ഉപയോഗിക്കുകയും യേശുവിന്റെ മറുപടിയിൽ മൂലത്തിലെ σὺ അനുസരിച്ച് ‘നീ’ നിലനിർത്തുകയും ചെയ്തു.
