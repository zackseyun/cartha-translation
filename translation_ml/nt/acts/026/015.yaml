  to: 'ഞാൻ ചോദിച്ചു: “കർത്താവേ[a], അങ്ങ് ആരാണ്?” കർത്താവ് പറഞ്ഞു: “നീ പീഡിപ്പിക്കുന്ന യേശുവാണ് ഞാൻ.”'
