  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμέρας μέσης κατὰ τὴν ὁδὸν εἶδον, βασιλεῦ, οὐρανόθεν ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου περιλάμψαν με φῶς καὶ τοὺς σὺν ἐμοὶ πορευομένους·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/013.yaml
  text: At midday[a], along the road, I saw, O king, a light from heaven, brighter than the sun, shining around me and those traveling with me.
translation:
  language: ml
  text: രാജാവേ, മധ്യാഹ്നത്തിൽ, വഴിയിൽവെച്ച്, സ്വർഗത്തിൽനിന്ന് സൂര്യന്റെ തേജസ്സിനെക്കാൾ ഉജ്ജ്വലമായ[a] ഒരു വെളിച്ചം എന്നെയും എന്നോടൊപ്പം യാത്രചെയ്യുന്നവരെയും ചുറ്റി പ്രകാശിച്ചത് ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൂര്യന്റെ തേജസ്സിനെ മറികടന്ന”; ആ വെളിച്ചം സൂര്യന്റെ തേജസ്സിനെ അതിക്രമിച്ചിരുന്നുവെന്ന് ഗ്രീക്ക് പ്രയോഗം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας μέσης
  choice: മധ്യാഹ്നത്തിൽ
  rationale: ദിവസത്തിന്റെ മധ്യത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗം; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: κατὰ τὴν ὁδὸν
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രയ്ക്കിടയിലെ സ്ഥലം സൂചിപ്പിക്കുന്നു; വിവരണത്തിന്റെ സഞ്ചാരസന്ദർഭം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: കാഴ്ചയിലൂടെ ഗ്രഹിച്ചതിനെ സൂചിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാലക്രിയ.
- source_word: βασιλεῦ
  choice: രാജാവേ
  rationale: അഗ്രിപ്പാവിനോടുള്ള നേരിട്ടുള്ള സംബോധന മലയാളത്തിലെ സംബോധനരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐρανόθεν
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: വെളിച്ചത്തിന്റെ സ്വർഗീയ ഉറവിടം സൂചിപ്പിക്കുന്നു; വെറും ആകാശമണ്ഡലത്തെ മാത്രം അർഥമാക്കാതെ ലൂക്കാ–പ്രവൃത്തികളിലെ ദൈവിക വെളിപ്പാടിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ὑπὲρ τὴν λαμπρότητα τοῦ ἡλίου
  choice: സൂര്യന്റെ തേജസ്സിനെക്കാൾ ഉജ്ജ്വലമായ
  rationale: ὑπέρ സൂചിപ്പിക്കുന്ന അതിക്രമത്തെയും λαμπρότης സൂചിപ്പിക്കുന്ന പ്രകാശതേജസ്സിനെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: φῶς
  choice: ഒരു വെളിച്ചം
  rationale: വിവരണത്തിൽ ആദ്യമായി അവതരിപ്പിക്കപ്പെടുന്ന ദൃശ്യപ്രതിഭാസത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: περιλάμψαν
  choice: ചുറ്റി പ്രകാശിക്കുന്നത്
  rationale: വെളിച്ചം പൗലോസിനെയും സഹയാത്രികരെയും ചുറ്റും പ്രകാശിപ്പിച്ചെന്ന സംയുക്തക്രിയയുടെ പരിവേഷാർഥം നിലനിർത്തുന്നു.
- source_word: τοὺς σὺν ἐμοὶ πορευομένους
  choice: എന്നോടൊപ്പം യാത്ര ചെയ്തിരുന്നവരെ
  rationale: പൗലോസിനൊപ്പം സഞ്ചരിച്ചിരുന്നവരെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദർശനസന്ദർഭത്തിലെ οὐρανόθεν എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സ്വർഗത്തിൽനിന്ന്
  alternative: ആകാശത്തുനിന്ന്
  rationale: വിവരണം ഒരു വെളിപ്പാടുസംഭവത്തെക്കുറിച്ചുള്ളതും ലൂക്കാ–പ്രവൃത്തികളിൽ സ്വർഗസംബന്ധമായ ഭാഷയ്ക്ക് ദൈവിക ഉറവിടത്തിന്റെ പ്രസക്തിയുള്ളതുമായതിനാൽ, മൂലപാഠത്തിന്റെ ശക്തി അമിതവ്യാഖ്യാനം കൂടാതെ ‘സ്വർഗത്തിൽനിന്ന്’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘രാജാവേ’ എന്ന സംബോധന ഔപചാരികത നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളവായനയ്ക്ക് അനുയോജ്യമാക്കിയിട്ടും സ്വർഗീയ ഉറവിടം, സൂര്യനെ അതിക്രമിക്കുന്ന തേജസ്സ്, എല്ലാവരെയും ചുറ്റിയ പ്രകാശം എന്നീ മൂലഘടകങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
