  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν ⸀οἷς πορευόμενος εἰς τὴν Δαμασκὸν μετ’ ἐξουσίας καὶ ἐπιτροπῆς ⸀τῆς τῶν ἀρχιερέων
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/012.yaml
  text: In this connection[a], as I was traveling to Damascus with authority and a commission from the chief priests,
translation:
  language: ml
  text: ഇക്കാര്യങ്ങളുടെ ഭാഗമായി[a], മുഖ്യപുരോഹിതന്മാരിൽനിന്നുള്ള അധികാരവും നിയോഗവുമായി ഞാൻ ദമസ്കൊസിലേക്കു യാത്രചെയ്യുമ്പോൾ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഈ കാര്യങ്ങളിൽ”; പൗലോസ് മുമ്പ് പറഞ്ഞ പ്രവൃത്തികളെയും ഉദ്ദേശ്യങ്ങളെയും ഇതു സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: ഇക്കാര്യങ്ങളുടെ ഭാഗമായി
  rationale: മുമ്പ് വിവരിച്ച പീഡനപ്രവർത്തനങ്ങളിലേക്കും ഉദ്ദേശ്യങ്ങളിലേക്കുമുള്ള സൂചന നിലനിർത്തുകയും, ‘ഇവയിൽ’ എന്ന അക്ഷരാർഥപരമായ പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: πορευόμενος
  choice: ഞാൻ ... യാത്രചെയ്യുമ്പോൾ
  rationale: വർത്തമാനകാല മധ്യവാചക കൃദന്തം തുടർന്നുവരുന്ന സംഭവത്തോടു സമകാലികമായ യാത്രയെ സൂചിപ്പിക്കുന്നു; ഉപവാക്യരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: εἰς τὴν Δαμασκὸν
  choice: ദമസ്കൊസിലേക്ക്
  rationale: നഗരത്തിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്ന εἰς എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളപരിഭാഷ.
- source_word: μετ’ ἐξουσίας
  choice: അധികാരവുമായി
  rationale: ഇവിടെ ἐξουσία അസംസ്കൃത ശക്തിയെയല്ല, ഏല്പിക്കപ്പെട്ട ഔദ്യോഗിക അധികാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπιτροπῆς
  choice: നിയോഗവുമായി
  rationale: ഔദ്യോഗികമായി ഏല്പിക്കപ്പെട്ട ദൗത്യമോ ചുമതലയോ എന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; ‘കല്പനകൾ’ എന്നത് മൂലപദത്തിൽ ഇല്ലാത്ത സൈനികഭാവം കൂട്ടിച്ചേർക്കാം.
- source_word: τῆς τῶν ἀρχιερέων
  choice: മഹാപുരോഹിതന്മാരിൽനിന്നുള്ള
  rationale: ഷഷ്ഠീവ്യാകരണബന്ധം ഇവിടെ അധികാരത്തിന്റെയും നിയോഗത്തിന്റെയും ഉറവിടമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀρχιερέων
  choice: മഹാപുരോഹിതന്മാർ
  rationale: ഒരേസമയം പല പ്രധാന മഹാപുരോഹിതന്മാർ ഉണ്ടായിരുന്നു എന്നല്ല, മഹാപുരോഹിതവർഗത്തിലെ യഹൂദനേതൃത്വത്തെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; സ്ഥാപിതവും മനസ്സിലാകുന്നതുമായ മലയാളപ്രയോഗമാണിത്.
