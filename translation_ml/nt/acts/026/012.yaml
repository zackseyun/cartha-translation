translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഉപവാക്യഘടന സൂചിപ്പിക്കാൻ അവസാനത്തിൽ അർധവിരാമമല്ല, കോമ നിലനിർത്തി; പാഠത്തിൽ എല്ലാ ആശയങ്ങളും ചേർത്തുവായിക്കാൻ എളുപ്പമുള്ള ക്രമത്തിൽ നൽകി.
