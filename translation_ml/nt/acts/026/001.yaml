  text: Ἀγρίππας δὲ πρὸς τὸν Παῦλον ἔφη· Ἐπιτρέπεταί σοι ⸀ὑπὲρ σεαυτοῦ λέγειν. τότε ὁ Παῦλος ⸂ἐκτείνας τὴν χεῖρα ἀπελογεῖτο⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/001.yaml
  text: 'Then Agrippa said to Paul[b][a], “You are permitted to speak on your own behalf.” Then Paul stretched out his hand and made his defense:'
translation:
  language: ml
  text: 'അപ്പോൾ അഗ്രിപ്പാ പൗലോസിനോട് പറഞ്ഞു: “സ്വന്തം പക്ഷത്തിനുവേണ്ടി സംസാരിക്കാൻ നിനക്ക് അനുവാദമുണ്ട്.”[a] അപ്പോൾ പൗലോസ് കൈ നീട്ടി തന്റെ പ്രതിരോധവാദം അവതരിപ്പിച്ചു:[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കുവേണ്ടി സംസാരിക്കാൻ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് ക്രിയ നിയമപരമായ പ്രതിരോധവാദം നടത്തുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: അഗ്രിപ്പാ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ രീതിയിൽ വ്യക്തിനാമം ലിപ്യന്തരിച്ചു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς τὸν Παῦλον ἔφη
  choice: പൗലോസിനോട് പറഞ്ഞു
  rationale: സംസാരക്രിയയോടൊപ്പമുള്ള πρὸς എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ἐπιτρέπεταί σοι
  choice: നിനക്ക് അനുവാദമുണ്ട്
  rationale: അനുവാദം നൽകപ്പെട്ടിരിക്കുന്നുവെന്ന വർത്തമാനകാല നിഷ്ക്രിയ ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὑπὲρ σεαυτοῦ λέγειν
  choice: നിനക്കുവേണ്ടിത്തന്നെ സംസാരിക്കാൻ
  rationale: നിയമപരമായ പശ്ചാത്തലത്തിലുള്ള ‘സ്വന്തം പക്ഷത്തിനുവേണ്ടി സംസാരിക്കുക’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; ‘സ്വയം സംസാരിക്കുക’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി അടയാളപ്പെടുത്തിയ കാലക്രമം സംരക്ഷിക്കുന്നു.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: കൈ നീട്ടി
  rationale: ശാരീരിക ആംഗ്യം അധികവ്യാഖ്യാനമില്ലാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ἀπελογεῖτο
  choice: തന്റെ പ്രതിവാദം അവതരിപ്പിച്ചു
  rationale: നിയമപരമായ പ്രതിരോധവാദം നടത്തുക എന്ന മദ്ധ്യമരൂപത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവം മലയാളത്തിൽ നിർബന്ധമായി അധികവാക്കുകൾ ചേർക്കാതെ സന്ദർഭം വഹിക്കുന്നു.
