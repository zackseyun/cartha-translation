base_translation:
  language: en
  yaml_path: translation/nt/acts/026/031.yaml
  text: And after they withdrew[a], they were speaking to one another, saying, “This man is doing nothing worthy of death or imprisonment.”
translation:
  language: ml
  text: 'അവർ മാറിപ്പോയശേഷം പരസ്പരം സംസാരിച്ചുകൊണ്ടിരുന്നു: “ഈ മനുഷ്യൻ വധശിക്ഷയോ തടവോ അർഹിക്കുന്നതൊന്നും ചെയ്യുന്നില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മരണത്തിനോ ചങ്ങലകൾക്കോ അർഹമായതൊന്നും.” ഗ്രീക്കിലെ δεσμῶν എന്ന പദത്തിന്റെ അക്ഷരാർഥം “ബന്ധനങ്ങൾ/ചങ്ങലകൾ” എന്നാണ്; ഇവിടെ അത് തടവിനെയോ കാവലിൽ പാർപ്പിക്കുന്നതിനെയോ സൂചിപ്പിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
