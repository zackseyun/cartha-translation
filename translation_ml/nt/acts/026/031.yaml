  rationale: സംഭാഷണത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മുൻപുള്ള തുടർച്ചാഭാവം ‘സംസാരിച്ചുകൊണ്ട്’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: Οὐδὲν θανάτου ἢ δεσμῶν ἄξιον
