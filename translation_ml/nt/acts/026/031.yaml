  rationale: നിയമപരമായ സന്ദർഭത്തിൽ θάνατος മരണശിക്ഷയെയും δεσμοί ബന്ധനം മുഖേനയുള്ള തടവിനെയും സൂചിപ്പിക്കുന്നു; ‘അർഹമായതൊന്നും’ മൂലത്തിലെ Οὐδὲν ... ἄξιον ഘടന സംരക്ഷിക്കുന്നു.
- source_word: τι πράσσει
  choice: ചെയ്യുന്നില്ല
  rationale: വർത്തമാനകാലത്തിലെ പൊതുവായ പ്രവൃത്തിസൂചന നിലനിർത്തുന്നു; ‘കുറ്റം ചെയ്യുക’ എന്നു വിവർത്തനം ചെയ്ത് മൂലത്തിൽ ഇല്ലാത്ത കുറ്റപരമായ അർഥം ചേർക്കുന്നില്ല.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: പൗലോസിനെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ഏകവചനപ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
