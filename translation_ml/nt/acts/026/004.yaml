translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ മുന്നോട്ടുകൊണ്ടുവന്ന object മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ വിശദീകരണഭാഗം ഇടയ്ക്കു ചേർത്തിരിക്കുന്നു; വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം അർധവിരാമസ്വഭാവമുള്ള ഘടന ഒഴിവാക്കി പ്രസിദ്ധീകരണത്തിനനുസരിച്ച് പൂർണ്ണവിരാമം നൽകി.
