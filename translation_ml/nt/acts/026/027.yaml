id: ACT.26.27
reference: Acts 26:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πιστεύεις, βασιλεῦ Ἀγρίππα, τοῖς προφήταις; οἶδα ὅτι πιστεύεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/026/027.yaml
  text: King Agrippa, do you believe the prophets? I know that you do believe.
translation:
  language: ml
  text: അഗ്രിപ്പാ രാജാവേ, അങ്ങ് പ്രവാചകന്മാരെ വിശ്വസിക്കുന്നുവോ?[a] അങ്ങ് വിശ്വസിക്കുന്നുവെന്ന് എനിക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രവാചകന്മാരെ അംഗീകരിക്കുന്നുവോ?’ അല്ലെങ്കിൽ ‘പ്രവാചകന്മാരിൽ വിശ്വാസമർപ്പിക്കുന്നുവോ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: വിശ്വസിക്കുന്നുവോ / വിശ്വസിക്കുന്നുവെന്ന്
  rationale: വർത്തമാനകാല സജീവരൂപം. ആദ്യത്തേത് നേരിട്ടുള്ള ചോദ്യമായും ആവർത്തനം സ്വാഭാവികമായ പ്രസ്താവനയായും പരിഭാഷപ്പെടുത്തി. പ്രവാചകന്മാരുടെ സാക്ഷ്യം സത്യമെന്ന് അംഗീകരിക്കുന്ന അർഥം ഇവിടെ യോജിക്കുന്നു.
- source_word: βασιλεῦ Ἀγρίππα
  choice: അഗ്രിപ്പാ രാജാവേ
  rationale: സംബോധനാവിഭക്തിയുടെ ശക്തി മലയാളത്തിലെ സ്വാഭാവികമായ ‘രാജാവേ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; വ്യക്തിനാമം പതിവനുസരിച്ച് ലിപ്യന്തരിച്ചു.
- source_word: τοῖς προφήταις
  choice: പ്രവാചകന്മാരെ
  rationale: πιστεύω എന്ന ക്രിയയോടുകൂടിയ ദാതിവ് പ്രവാചകന്മാരെയും അവരുടെ സാക്ഷ്യത്തെയും വിശ്വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ വ്യക്തിസൂചന നേരിട്ട് നിലനിർത്തി.
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും വർത്തമാന അർഥമുള്ള ഈ ക്രിയയുടെ നേരിട്ടുള്ള ഉറപ്പ് സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: പൗലൊസ് അറിയുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന സംയോജകം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്ന്’ ആയി നൽകി.
theological_decisions:
- issue: ‘പ്രവാചകന്മാരെ വിശ്വസിക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: പ്രവാചകന്മാരെയും അവരുടെ സാക്ഷ്യത്തെയും വിശ്വസിക്കുന്നതായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പ്രവാചകന്മാരെ അംഗീകരിക്കുക; പ്രവാചകന്മാരിൽ ആശ്രയിക്കുക
  rationale: ഇവിടെ πιστεύω + dative എന്ന പ്രയോഗം പ്രവാചകന്മാരുടെ സന്ദേശം സത്യമെന്ന് അംഗീകരിക്കുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. അനുസരണം, രക്ഷാകരവിശ്വാസം, അല്ലെങ്കിൽ പൊതുവായ മതഭക്തി എന്നിങ്ങനെ വാചകം പറയുന്നതിലധികം അർഥം ചേർത്തിട്ടില്ല.
- issue: ആവർത്തിച്ച πιστεύεις എന്ന ക്രിയയുടെ ഊന്നൽ
  choice: രണ്ടിടത്തും ‘വിശ്വസിക്കുക’ ആവർത്തിച്ചു; രണ്ടാമത്തെ വാക്യത്തിൽ കൃത്രിമമായ ഊന്നൽപദം ചേർത്തില്ല.
  alternative: ‘തീർച്ചയായും വിശ്വസിക്കുന്നു’ എന്ന് ഊന്നിപ്പറയുക
  rationale: ഗ്രീക്കിൽ പ്രത്യേക ഊന്നൽ അവ്യയം ഇല്ല. ആവർത്തനവും വാക്യക്രമവും നൽകുന്ന വാഗ്മിത്വശക്തി മലയാളത്തിലെ സ്വാഭാവിക ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. രാജാവിനോടുള്ള സംഭാഷണമായതിനാൽ ‘അങ്ങ്’ എന്ന ആദരസൂചക സർവനാമവും ‘രാജാവേ’ എന്ന സ്വാഭാവിക സംബോധനയും ഉപയോഗിച്ചു.
