  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: ml
  text: ഞാൻ യെരൂശലേമിൽ എത്തിയപ്പോൾ, യെഹൂദന്മാരുടെ മുഖ്യപുരോഹിതന്മാരും മൂപ്പന്മാരും അവനെക്കുറിച്ച് എന്നെ അറിയിച്ചു; അവനെ കുറ്റക്കാരനായി വിധിക്കണമെന്ന് അവർ അപേക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവനെതിരേ കുറ്റവിധി വേണമെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive പൗലോസിനെക്കുറിച്ചുള്ള വിഷയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയയോടു ചേർത്തു.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: ഞാൻ യെരൂശലേമിൽ എത്തിയപ്പോൾ
  rationale: genitive absolute-ന്റെ കാലസൂചനയും γίνομαι + εἰς എന്ന പ്രയോഗത്തിലെ ‘എത്തുക’ എന്ന അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: ἐνεφάνισαν
  choice: എന്നെ വിവരം അറിയിച്ചു
  rationale: അധികാരിയുടെ മുമ്പാകെ ഒരു കാര്യം ഔദ്യോഗികമായി അറിയിക്കുക എന്ന നിയമ-ഭരണപരമായ സന്ദർഭം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: പ്രധാന പുരോഹിത അധികാരികളെ സൂചിപ്പിക്കുന്ന ബഹുവചന പദവിക്ക് പതിവും കൃത്യവുമായ പരിഭാഷ.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ മൂപ്പന്മാർ
  rationale: ജനവിഭാഗവുമായി ബന്ധപ്പെട്ട മൂപ്പന്മാരെ സൂചിപ്പിക്കുന്ന genitive ബന്ധം നിലനിർത്തുന്നു.
- source_word: αἰτούμενοι
  choice: അവർ അപേക്ഷിച്ചു
  rationale: വിവരം അറിയിച്ചതിനോടൊപ്പം നടത്തിയ ഔദ്യോഗിക അഭ്യർഥനയെ വ്യക്തമാക്കുന്നു.
- source_word: κατ’ αὐτοῦ
  choice: അവനെതിരേ
  rationale: നിയമനടപടി പൗലോസിനെതിരായി ലക്ഷ്യമിട്ടതാണെന്ന adversative അർഥം സംരക്ഷിക്കുന്നു.
- source_word: καταδίκην
  choice: ശിക്ഷാവിധി
  rationale: ന്യായപരമായ കുറ്റവിധി/അപലപനവിധി എന്ന അർഥം ചുരുക്കവും സ്വാഭാവികവുമായ നിയമഭാഷയിൽ നൽകുന്നു; ശിക്ഷയുടെ പ്രത്യേക രൂപം നിർണ്ണയിക്കുന്നില്ല.
