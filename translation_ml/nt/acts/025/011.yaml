id: ACT.25.11
reference: Acts 25:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: ml
  text: അതിനാൽ, ഞാൻ അനീതി ചെയ്യുകയും മരണത്തിന് അർഹമായ എന്തെങ്കിലും ചെയ്തിട്ടുണ്ടെങ്കിൽ, മരിക്കാൻ ഞാൻ വിസമ്മതിക്കുന്നില്ല. എന്നാൽ ഇവർ എന്നെ കുറ്റപ്പെടുത്തുന്ന കാര്യങ്ങളിൽ ഒന്നിനും അടിസ്ഥാനമില്ലെങ്കിൽ, അവർക്കൊരു ഉപകാരമായി എന്നെ ഏൽപ്പിച്ചുകൊടുക്കാൻ ആർക്കും കഴിയില്ല.[a] ഞാൻ കൈസറോട് അപ്പീൽ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ പ്രസാദിപ്പിക്കാൻ എന്നെ അവർക്കു വിട്ടുകൊടുക്കാൻ.” ഒരാളെ വിട്ടുകൊടുക്കുന്നതും അങ്ങനെ മറ്റൊരാൾക്ക് ഉപകാരം ചെയ്യുന്നതും എന്ന ആശയം ഗ്രീക്ക് ക്രിയയിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: ഞാൻ തെറ്റു ചെയ്യുകയും
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രവൃത്തി/അവസ്ഥാഭാവം സൂക്ഷിക്കുമ്പോൾ, ധാർമികവും നിയമപരവുമായ അർഥം അതിവിശദീകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄξιον θανάτου πέπραχά τι
  choice: മരണത്തിന് അർഹമായ എന്തെങ്കിലും ചെയ്തിട്ടുണ്ടാകുകയും
  rationale: πέπραχα എന്ന പൂർണ്ണകാലത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും ഇപ്പോഴത്തെ പ്രസക്തിയും ‘ചെയ്തിട്ടുണ്ടാകുകയും’ എന്നതിൽ പ്രതിഫലിക്കുന്നു; τιയുടെ അനിശ്ചിതത്വം ‘എന്തെങ്കിലും’ സൂക്ഷിക്കുന്നു.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: മരിക്കാൻ ഞാൻ വിസമ്മതിക്കുന്നില്ല
  rationale: παραιτοῦμαι എന്നതിന്റെ ‘നിരസിക്കുക/വിസമ്മതിക്കുക’ എന്ന അർഥം നേരായും സ്വാഭാവികമായും നൽകുന്നു; കുറ്റക്കാരനാണെങ്കിൽ മരണം സ്വീകരിക്കുമെന്ന സോപാധിക നിലപാട് നിലനിർത്തുന്നു.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: ഇവർ എന്നെ കുറ്റപ്പെടുത്തുന്ന കാര്യങ്ങളിൽ ഒന്നിനും അടിസ്ഥാനമില്ലെങ്കിൽ
  rationale: ആരോപണങ്ങളിൽ യാതൊരു സാരമോ അടിസ്ഥാനമോ ഇല്ലെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവ സത്യമല്ല’ എന്ന് പ്രത്യേകം ചേർത്ത് വാദം കടുപ്പിക്കുന്നില്ല.
- source_word: χαρίσασθαι
  choice: അവർക്കൊരു ഉപകാരമായി എന്നെ ഏല്പിച്ചുകൊടുക്കാൻ
  rationale: ഒരാളെ മറ്റുള്ളവർക്ക് വിട്ടുകൊടുക്കുന്നതോടൊപ്പം, അവർക്കുവേണ്ടി ഒരു അനുഗ്രഹമോ ഉപകാരമോ ചെയ്യുന്നു എന്ന χαρίζομαιയുടെ ആശയവും നിയമപരമായ സന്ദർഭവും സംരക്ഷിക്കുന്നു.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: ഞാൻ കൈസറോട് അപ്പീൽ ചെയ്യുന്നു
  rationale: റോമൻ ചക്രവർത്തിയിലേക്കുള്ള സാങ്കേതിക നിയമ അപ്പീലിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്ന പ്രയോഗം.
- source_word: μὲν οὖν ... δὲ
  choice: അതുകൊണ്ട്, ... എന്നാൽ
  rationale: ആദ്യ സോപാധിക വാദത്തെയും അതിനോടു വിരുദ്ധമായ രണ്ടാമത്തെ സോപാധിക വാദത്തെയും വായനാസൗകര്യത്തോടെ ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: മരണത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ പ്രസ്താവനയുടെയും കൈസറിലേക്കുള്ള അപ്പീലിന്റെയും ന്യായവ്യവസ്ഥാപരമായ സൂക്ഷ്മത
  choice: താൻ യഥാർഥത്തിൽ മരണത്തിന് അർഹമായത് ചെയ്തിട്ടുണ്ടെങ്കിൽ മരിക്കാൻ വിസമ്മതിക്കില്ലെന്ന് പൗലോസ് സോപാധികമായി പറയുന്നു; അതേസമയം അടിസ്ഥാനമില്ലാത്ത കുറ്റാരോപണങ്ങളുടെ പേരിൽ തന്നെ വിട്ടുകൊടുക്കാൻ ആർക്കും അധികാരമില്ലെന്ന് വാദിക്കുന്നു.
  alternative: നിയമനടപടിയുടെ സാധുത ഏതെങ്കിലും വിധത്തിൽ അംഗീകരിക്കാതെ പൗലോസ് വെറും വാചാടോപപരമായി സംസാരിക്കുന്നു എന്നു വായിക്കാം.
  rationale: വാക്യം പ്രധാനമായും നിയമപരമാണ്. ‘മരിക്കാൻ ഞാൻ വിസമ്മതിക്കുന്നില്ല’ എന്ന സോപാധിക സമ്മതവും അന്യായമായി കൈമാറപ്പെടുന്നതിനെതിരായ അവകാശവാദവും പരിഭാഷ നിലനിർത്തുന്നു; മരണശിക്ഷയെക്കുറിച്ചുള്ള വിപുലമായ ദൈവശാസ്ത്രനിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമപരമായ ഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. ‘കൈസർ’, ‘അപ്പീൽ’ എന്നീ പൊതുവേ മനസ്സിലാകുന്ന പദങ്ങൾ സാങ്കേതിക നിയമസന്ദർഭം വ്യക്തമായി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന χαρίσασθαι എന്ന പദത്തിന്റെ പരിഭാഷയ്ക്കു പിന്നാലെ നൽകിയിരിക്കുന്നു.
