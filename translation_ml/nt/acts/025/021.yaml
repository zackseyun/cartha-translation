id: ACT.25.21
reference: Acts 25:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: ml
  text: എന്നാൽ, ചക്രവർത്തിയുടെ[a] തീർപ്പിനായി തന്നെ കാവലിൽ സൂക്ഷിക്കണമെന്ന് പൗലോസ് അപ്പീൽ നൽകിയപ്പോൾ, അവനെ കൈസറുടെ അടുക്കലേക്ക് അയയ്ക്കുന്നതുവരെ കാവലിൽ സൂക്ഷിക്കാൻ ഞാൻ കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘സെബസ്തോസ്’ (Σεβαστός), അതായത് ‘അഗസ്റ്റസ്’ എന്നതിന് തുല്യമായ ചക്രവർത്തിയുടെ ഔദ്യോഗിക ബിരുദം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: അപ്പീൽ നൽകിയപ്പോൾ
  rationale: റോമൻ നിയമസന്ദർഭത്തിൽ ഇത് മേലധികാരിയുടെ മുമ്പാകെയുള്ള ഔപചാരിക അപ്പീലിനെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘അപ്പീൽ നൽകുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: കാവലിൽ സൂക്ഷിക്കണമെന്ന് / കാവലിൽ സൂക്ഷിക്കാൻ
  rationale: ഇവിടെ τηρέω വെറും സംരക്ഷണമല്ല, ഔദ്യോഗിക തടങ്കലാണ് സൂചിപ്പിക്കുന്നത്. ആവർത്തിക്കുന്ന രണ്ടു രൂപങ്ങളിലും ഒരേ നിയമപരമായ അർഥം നിലനിർത്തി.
- source_word: διάγνωσιν
  choice: തീർപ്പ്
  rationale: നീതിന്യായപരമായ നിർണയത്തെ സൂചിപ്പിക്കുന്ന പദം. ‘വിചാരണ’ നടപടിക്രമത്തെ മാത്രം സൂചിപ്പിക്കാം; ‘വിധി’ അന്തിമ ശിക്ഷാവിധിയെന്ന ധ്വനി നൽകാം. ‘തീർപ്പ്’ ഈ അർഥപരിധി സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: Σεβαστοῦ
  choice: ചക്രവർത്തിയുടെ
  rationale: Σεβαστός ഇവിടെ വ്യക്തിനാമമല്ല, റോമൻ ചക്രവർത്തിയുടെ ‘Augustus’ എന്ന ഔദ്യോഗിക ബിരുദത്തിന്റെ ഗ്രീക്ക് രൂപമാണ്. മുഖ്യവാക്യത്തിൽ അർഥം വ്യക്തമായി നൽകി, മൂലത്തിലെ ബിരുദരൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἀναπέμψω
  choice: അയയ്ക്കുന്നതുവരെ
  rationale: ഉയർന്ന അധികാരിയുടെ അടുക്കലേക്ക് അയയ്ക്കുന്നതാണ് സന്ദർഭാർഥം. മലയാളത്തിൽ ‘അയയ്ക്കുക’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πρὸς Καίσαρα
  choice: കൈസറുടെ അടുക്കലേക്ക്
  rationale: Καίσαρ ഇവിടെ സാമ്രാജ്യത്വ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ചരിത്രപരമായ പ്രയോഗം നിലനിർത്താൻ ‘കൈസർ’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമഭാഷ ഉപയോഗിച്ചു. ‘അപ്പീൽ’, ‘കാവലിൽ സൂക്ഷിക്കുക’, ‘തീർപ്പ്’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും റോമൻ നീതിന്യായസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
