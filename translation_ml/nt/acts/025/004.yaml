  text: ὁ μὲν οὖν Φῆστος ἀπεκρίθη τηρεῖσθαι τὸν Παῦλον ⸂εἰς Καισάρειαν⸃, ἑαυτὸν δὲ μέλλειν ἐν τάχει ἐκπορεύεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/004.yaml
  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: ml
  text: അപ്പോൾ ഫെസ്തൊസ്, പൗലൊസിനെ കൈസര്യയിൽ കാവലിൽ പാർപ്പിച്ചിരിക്കുകയാണെന്നും താനോ ഉടൻ പുറപ്പെടാനിരിക്കുകയാണെന്നും മറുപടി പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: കാവലിൽ പാർപ്പിച്ചിരിക്കുകയാണ്
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ infinitive-ന്റെ തടങ്കൽസന്ദർഭത്തിലുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς Καισάρειαν
  choice: കൈസര്യയിൽ
  rationale: ഇവിടെ εἰς എന്നതിന്റെ പാഠരൂപം നിലനിൽക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന അസാധാരണ പ്രയോഗമായി മനസ്സിലാക്കുന്നു; സന്ദർഭവും ഇംഗ്ലീഷ് ഓഡിറ്റ് പാളിയും സ്ഥലവാചകമായ വിവർത്തനത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: ἐν τάχει ἐκπορεύεσθαι
  choice: ഉടൻ അവിടേക്കു പുറപ്പെടാനിരിക്കുകയാണ്
  rationale: μέλλειν സഹിതമുള്ള പ്രയോഗം അടുത്തുതന്നെ യാത്ര പുറപ്പെടാനുള്ള ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; 'അവിടേക്ക്' എന്നത് കൈസര്യയിലേക്കുള്ള ദിശ സന്ദർഭത്തിൽനിന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἑαυτὸν
  choice: താൻതന്നെ
  rationale: പ്രതിഫലന സർവനാമത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
