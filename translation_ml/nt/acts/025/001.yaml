translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ‘കയറിപ്പോയി’ എന്നത് യെരൂശലേമിലേക്കുള്ള യാത്രയുടെ ഗ്രീക്ക് ഭൂമിശാസ്ത്രപ്രയോഗം നിലനിർത്തുന്നു; മുഖ്യവാചകം ഭരണചുമതല ഏറ്റെടുത്തെന്ന വ്യാഖ്യാനം നിർബന്ധമാക്കാതെ മൂലത്തിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
