language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: ml
  text: അവരുടെ ഇടയിൽ എട്ടോ പത്തോ ദിവസത്തിൽ കൂടുതൽ താമസിക്കാതെ, അവൻ കൈസര്യയിലേക്കു ഇറങ്ങിച്ചെന്നു. പിറ്റേന്ന് ന്യായാസനത്തിൽ ഇരുന്നശേഷം പൗലോസിനെ കൊണ്ടുവരാൻ കല്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: അവരുടെ ഇടയിൽ ... താമസിക്കാതെ
  rationale: διατρίβω എന്നതിന്റെ താമസിക്കുക എന്ന കാലസംബന്ധിയായ അർഥവും ἐν αὐτοῖς എന്നതിന്റെ ‘അവരുടെ ഇടയിൽ’ എന്ന സാമൂഹിക-സ്ഥാനിക സൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: എട്ടോ പത്തോ ദിവസത്തിൽ കൂടുതൽ
  rationale: οὐ πλείους എന്ന പരമാവധി സൂചനയും ὀκτὼ ἢ δέκα എന്ന ഏകദേശ കാലപരിധിയും ഒരുമിച്ചു സംരക്ഷിക്കുന്നു.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: കൈസര്യയിലേക്കു ഇറങ്ങിച്ചെന്നു
  rationale: യെരൂശലേമിൽനിന്ന് കൈസര്യയിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന പുരാതന ദിശാപ്രയോഗമായ ‘ഇറങ്ങുക’ നിലനിർത്തുന്നു.
- source_word: τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത ദിവസം എന്ന അർഥം സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: ന്യായാസനത്തിൽ ഇരുന്നശേഷം
  rationale: βῆμα ഇവിടെ ഔദ്യോഗിക ന്യായവിധിയാസനത്തെ സൂചിപ്പിക്കുന്നു; ‘ന്യായാസനം’ നിയമപരമായ പശ്ചാത്തലം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: പൗലോസിനെ കൊണ്ടുവരാൻ കല്പിച്ചു
  rationale: ഔദ്യോഗിക കല്പനയും ἄγω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗത്തിൽ സൂചിപ്പിക്കുന്ന കോടതിയിലേക്കുള്ള കൊണ്ടുവരലും സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ ക്രമം മലയാളത്തിൽ വ്യക്തമായ കാലക്രമമായി അവതരിപ്പിച്ചു; നിയമപരമായ പശ്ചാത്തലത്തിന് ‘ന്യായാസനം’ ഉപയോഗിച്ചു.
