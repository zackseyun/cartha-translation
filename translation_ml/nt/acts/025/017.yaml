  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായാധികാരിയുടെ ഔദ്യോഗിക പീഠത്തിൽ ഇരുന്ന്.’ ഗ്രീക്കിലെ βῆμα എന്ന പദം ഔദ്യോഗിക ന്യായവിധിയാസനത്തെയോ ന്യായവിസ്താരത്തിനുള്ള പീഠത്തെയോ സൂചിപ്പിക്കുന്നു.
