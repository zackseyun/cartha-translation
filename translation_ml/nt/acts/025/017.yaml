- source_word: ἐκέλευσα
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ഔദ്യോഗിക നിർദേശം എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἀχθῆναι
  choice: കൊണ്ടുവരാൻ
  rationale: ἄγω എന്ന ക്രിയയുടെ പാസീവ് ഇൻഫിനിറ്റീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അകത്തേക്ക്’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τὸν ἄνδρα
