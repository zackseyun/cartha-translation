translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നീണ്ട പങ്കാളിത്തഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി, സംഭവക്രമവും ഔദ്യോഗിക സാഹചര്യവും വ്യക്തമായി സൂക്ഷിച്ചു.
