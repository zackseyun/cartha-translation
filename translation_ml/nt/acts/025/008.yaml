language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: ml
  text: 'പൗലോസ് തന്റെ പ്രതിവാദം നടത്തി: “യെഹൂദന്മാരുടെ ന്യായപ്രമാണത്തിനെതിരെയോ[a] ദേവാലയത്തിനെതിരെയോ കൈസർക്കെതിരെയോ ഞാൻ ഒരു കാര്യത്തിലും പാപം ചെയ്തിട്ടില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “യെഹൂദന്മാരുടെ ന്യായപ്രമാണത്തിനെതിരെയോ ദേവാലയത്തിനെതിരെയോ കൈസർക്കെതിരെയോ ഞാൻ യാതൊരു കുറ്റവും ചെയ്തിട്ടില്ല.”'
    reason: ἥμαρτον എന്നതിന് ഈ കോടതിസാഹചര്യത്തിൽ ‘കുറ്റം ചെയ്തു’ എന്ന നിയമപരമായ അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: തന്റെ പ്രതിവാദം നടത്തി
  rationale: കോടതിസാഹചര്യത്തിലുള്ള സ്വയംപ്രതിരോധത്തിന്റെ അർഥം നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികവും ഔപചാരികവുമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: നേരിട്ടുള്ള ഉദ്ധരണിയായി കോളൻ ഉപയോഗിച്ചു
  rationale: ὅτι പൗലോസിന്റെ പ്രതിവാദത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള ഉദ്ധരണി സ്വാഭാവികമാണ്.
- source_word: νόμον τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ ന്യായപ്രമാണം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന നിലനിർത്തുന്നു; മതപരമോ വംശീയമോ പ്രാദേശികമോ ആയ ഊന്നൽ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἱερόν
  choice: ദേവാലയം
  rationale: ഇവിടെ അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കാവുന്ന സാധാരണ പദമാണിത്.
- source_word: Καίσαρά
  choice: കൈസർ
  rationale: റോമൻ ഭരണാധികാരിയുടെ പേരും പദവിയും ഗ്രീക്കിലുള്ളതുപോലെ ലിപ്യന്തരണം ചെയ്ത് നിയമ-രാഷ്ട്രീയ പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: τι
  choice: ഒരു കാര്യത്തിലും
  rationale: നിഷേധത്തോടൊപ്പം വരുന്ന അനിശ്ചിത സർവനാമത്തിന്റെ സമഗ്രവും ഊന്നലുള്ളതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἥμαρτον
  choice: പാപം ചെയ്തിട്ടില്ല
  rationale: സന്ദർഭം നിയമപരമാണെങ്കിലും, സാധാരണയായി ‘പാപം ചെയ്യുക’ എന്നർഥമുള്ള ἁμαρτάνωയുടെ ധാർമിക-ആത്മീയ നിഴൽ മായ്ച്ചുകളയുന്നില്ല.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: -ത്തിനെതിരെയോ ... -ത്തിനെതിരെയോ ... -ക്ക/ക്കെതിരെയോ
  rationale: മൂന്നംഗ നിഷേധപരമ്പര മലയാളത്തിലെ ‘ഓ’ ഘടനയിലൂടെ വ്യക്തമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἥμαρτον എന്ന പദത്തിലെ നിയമപരവും ധാർമികവുമായ നിഴലുകൾ
  choice: പാപം ചെയ്തിട്ടില്ല
  alternative: കുറ്റം ചെയ്തിട്ടില്ല
  rationale: കോടതിസാഹചര്യത്തിൽ ‘കുറ്റം ചെയ്യുക’ എന്ന അർഥം സാധ്യമാണെങ്കിലും, ഗ്രീക്കിലെ സാധാരണ ‘പാപം ചെയ്യുക’ എന്ന പദബന്ധം നിലനിർത്തുന്നത് വാക്യത്തിലെ ധാർമിക നിഴൽ സംരക്ഷിക്കുന്നു; നിയമപരമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ കോടതി-ഭാഷാശൈലി. ‘പ്രതിവാദം’, ‘ന്യായപ്രമാണം’ എന്നീ പദങ്ങൾ ഔപചാരിക പശ്ചാത്തലം നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
