reference: Acts 25:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: ml
  text: അവനെക്കുറിച്ച് എന്റെ പ്രഭുവിന്[a] എഴുതാൻ നിശ്ചിതമായതൊന്നും എനിക്കില്ല. അതുകൊണ്ട്, നിയമപരമായ അന്വേഷണം കഴിഞ്ഞശേഷം എനിക്ക് എഴുതാൻ എന്തെങ്കിലും ഉണ്ടാകേണ്ടതിന്, ഞാൻ അവനെ നിങ്ങളുടെ എല്ലാവരുടെയും മുമ്പാകെയും, വിശേഷിച്ച് അഗ്രിപ്പാ രാജാവേ, അങ്ങയുടെ മുമ്പാകെയും ഹാജരാക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യക്തമായി പറഞ്ഞാൽ, ‘ചക്രവർത്തിക്ക്.’ ഗ്രീക്കിൽ ഔദ്യോഗിക സാമ്രാജ്യത്വസന്ദർഭത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘എന്റെ പ്രഭുവിന്’ എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: ഉറപ്പുള്ളതൊന്നും
  rationale: ഈ ഔദ്യോഗിക-നിയമപരമായ സന്ദർഭത്തിൽ ἀσφαλές എന്നത് ഉറപ്പുള്ളതോ നിശ്ചിതമോ ആയ വിവരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകാൻ ‘ഉറപ്പുള്ളതൊന്നും’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τῷ κυρίῳ
  choice: എന്റെ യജമാനന്
  rationale: κύριος എന്നതിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഇവിടെ ഔദ്യോഗിക സാമ്രാജ്യത്വസന്ദർഭത്തിൽ റോമൻ ചക്രവർത്തിയാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്. അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: προήγαγον αὐτόν
  choice: ഞാൻ അവനെ ... കൊണ്ടുവന്നിരിക്കുന്നു
  rationale: പ്രേക്ഷകരുടെ മുമ്പാകെ ഒരാളെ കൊണ്ടുവരുക/ഹാജരാക്കുക എന്ന ക്രിയയുടെ അർഥവും, ഇപ്പോഴത്തെ പ്രസംഗസാഹചര്യവുമായി പ്രവൃത്തിക്കുള്ള ബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ
  choice: നിങ്ങളുടെ എല്ലാവരുടെയും മുമ്പാകെ, വിശേഷിച്ച് ... അങ്ങയുടെ മുമ്പാകെ
  rationale: ὑμῶν എന്ന ബഹുവചനത്തെയും σοῦ എന്ന ഏകവചനത്തെയും വ്യക്തമായി വേർതിരിക്കുകയും അഗ്രിപ്പാവിനുള്ള പ്രത്യേക ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βασιλεῦ Ἀγρίππα
  choice: അഗ്രിപ്പാ രാജാവേ
  rationale: ഗ്രീക്കിലെ സംബോധനരൂപം സ്വാഭാവികമായ മലയാള സംബോധനയായി നൽകി.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: വിചാരണ കഴിഞ്ഞശേഷം
  rationale: ἀνάκρισις നിയമപരമായ പരിശോധന, വിചാരണ, അല്ലെങ്കിൽ അന്വേഷണത്തെ സൂചിപ്പിക്കുന്നു. Genitive absolute-ന്റെ കാലസംബന്ധമായ അർഥം ‘കഴിഞ്ഞശേഷം’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: σχῶ τί γράψω
  choice: എഴുതാൻ എനിക്ക് എന്തെങ്കിലും ലഭിക്കേണ്ടതിന്
  rationale: ഔദ്യോഗിക റിപ്പോർട്ടിൽ എഴുതാനുള്ള ഉള്ളടക്കം ലഭിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യാർഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവികമല്ലാത്ത സാമ്രാജ്യത്വസന്ദർഭത്തിലെ κύριος
  choice: എന്റെ യജമാനന്
  alternative: ചക്രവർത്തിക്ക്
  rationale: മൂലപദത്തിന്റെ ‘യജമാനൻ/പ്രഭു’ എന്ന രൂപം പ്രധാനവാക്യത്തിൽ സംരക്ഷിച്ചു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ചക്രവർത്തിയെയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ഇതിലൂടെ പദത്തിന്റെ രൂപവും ചരിത്രസന്ദർഭവും ഒരുപോലെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഔദ്യോഗികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ബഹുവചനമായ ‘നിങ്ങളുടെ എല്ലാവരുടെയും’ എന്നതും അഗ്രിപ്പാവിനോടുള്ള ആദരസൂചക ഏകവചനമായ ‘അങ്ങയുടെ’ എന്നതും വേർതിരിച്ചു. നിയമപരമായ ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ‘വിചാരണ’ എന്ന പദത്തിലൂടെ നൽകി.
