source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: ml
  text: മറിച്ച്, തങ്ങളുടെ സ്വന്തം മതത്തെക്കുറിച്ചും[a] മരിച്ചുപോയ യേശു എന്ന ഒരാളെക്കുറിച്ചും അവർക്കു പൗലൊസുമായി ചില തർക്കവിഷയങ്ങൾ ഉണ്ടായിരുന്നു. ആ യേശു ജീവിച്ചിരിക്കുന്നുവെന്ന് പൗലൊസ് അവകാശപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തങ്ങളുടെ സ്വന്തം അന്ധവിശ്വാസത്തെക്കുറിച്ച്” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് നിഷ്പക്ഷമായി ‘മതം’ എന്നും, പുറത്തുനിന്നുള്ള ഒരാളുടെ നിന്ദാസൂചക പ്രയോഗത്തിൽ ‘അന്ധവിശ്വാസം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: തർക്കങ്ങൾ
  rationale: നിഷ്പക്ഷമായ ചോദ്യങ്ങളെയല്ല, വാദവിഷയങ്ങളായ കാര്യങ്ങളെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിലെ പ്രതികൂല സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δέ
  choice: പകരം
  rationale: പ്രതീക്ഷിച്ച കുറ്റാരോപണങ്ങൾക്കു വിരുദ്ധമായി യഥാർഥത്തിൽ ഉണ്ടായിരുന്നത് എന്താണെന്ന് ഫെസ്തൊസ് വ്യക്തമാക്കുന്ന തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: τινα
  choice: ചില
  rationale: ζητήματα എന്ന പദത്തെ അനിശ്ചിതമായി വിശേഷിപ്പിക്കുന്ന ഗ്രീക്കിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: തങ്ങളുടെ സ്വന്തം മതത്തെക്കുറിച്ച്
  rationale: δεισιδαιμονία എന്നതിന് നിഷ്പക്ഷമായ ‘മതം’ മുതൽ നിന്ദാസൂചകമായ ‘അന്ധവിശ്വാസം’ വരെ അർഥവ്യാപ്തിയുണ്ട്. പ്രധാനപാഠത്തിൽ അമിതമായ നിന്ദാഭാവം ചേർക്കാതെ ‘മതം’ ഉപയോഗിക്കുകയും സാധ്യതയുള്ള മറ്റൊരു ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἶχον πρὸς αὐτόν
  choice: അവർക്കു പൗലൊസുമായി ... ഉണ്ടായിരുന്നു
  rationale: പൗലൊസിനോടുള്ള വാദവിഷയങ്ങൾ എന്ന ഗ്രീക്ക് പ്രയോഗം നിയമപരമായ അധികഭാരം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: യേശു എന്ന ഒരാളെക്കുറിച്ചും
  rationale: τινος നൽകുന്ന ഫെസ്തൊസിന്റെ അകൽച്ചയും പരിചയക്കുറവും ‘എന്ന ഒരാൾ’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τεθνηκότος
  choice: മരിച്ചുപോയ
  rationale: മരണത്തിന്റെ ഫലമായ നില സൂചിപ്പിക്കുന്ന പൂർണകാല കൃദന്തത്തെ തുടർന്നുള്ള ‘ജീവിച്ചിരിക്കുന്നു’ എന്ന അവകാശവാദത്തോട് വ്യക്തമായി വിരുദ്ധമാക്കുന്നു.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: ആ യേശു ജീവിച്ചിരിക്കുന്നുവെന്ന് പൗലൊസ് അവകാശപ്പെട്ടു
  rationale: ഫെസ്തൊസ് പൗലൊസിന്റെ പ്രസ്താവന റിപ്പോർട്ട് ചെയ്യുകയാണെന്നും ഈ ഉപവാക്യത്തിൽ സ്വയം അതിനെ സ്ഥിരീകരിക്കുന്നില്ലെന്നും φάσκω സൂചിപ്പിക്കുന്ന ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഫെസ്തൊസിന്റെ പ്രസംഗത്തിലെ δεισιδαιμονίαയുടെ വിവർത്തനം
  choice: മതം
  alternative: അന്ധവിശ്വാസം / മതാചാരം
  rationale: റോമൻ ഉദ്യോഗസ്ഥനായ ഫെസ്തൊസ് യെഹൂദരുടെ വിശ്വാസത്തെ പുറത്തുനിന്ന് വിശേഷിപ്പിക്കുകയാണ്. ആധുനിക മലയാളത്തിലെ ‘അന്ധവിശ്വാസം’ ഗ്രീക്ക് നിർബന്ധമായും വഹിക്കാത്ത ശക്തമായ നിന്ദാഭാവം ചേർക്കാം; അതിനാൽ ‘തങ്ങളുടെ സ്വന്തം’ എന്ന അകൽച്ചാഭാവത്തോടുകൂടെ ‘മതം’ പ്രധാനപാഠത്തിൽ നൽകി മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: പുനരുത്ഥാന അവകാശവാദത്തിന്റെ പ്രയോഗം
  choice: ജീവിച്ചിരിക്കുന്നുവെന്ന് പൗലൊസ് അവകാശപ്പെട്ടു
  alternative: ജീവിച്ചിരിക്കുന്നുവെന്ന് പൗലൊസ് പറഞ്ഞു
  rationale: ഇത് ആഖ്യാതാവിന്റെ നേരിട്ടുള്ള സ്ഥിരീകരണമല്ല, ഫെസ്തൊസിന്റെ റിപ്പോർട്ടാണെന്ന നില φάσκω അനുസരിച്ച് പ്രകടമാക്കുന്നു; അതേസമയം അവകാശവാദത്തിന്റെ സത്യത്തെ വിവർത്തനം നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഫെസ്തൊസിന്റെ അകൽച്ചാഭാവം ‘തങ്ങളുടെ സ്വന്തം’, ‘യേശു എന്ന ഒരാൾ’, ‘അവകാശപ്പെട്ടു’ എന്നീ പ്രയോഗങ്ങളിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
