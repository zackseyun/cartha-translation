id: ACT.25.24
reference: Acts 25:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: ml
  text: 'ഫെസ്തൊസ് പറയുന്നു: “അഗ്രിപ്പാ രാജാവേ, ഞങ്ങളോടൊപ്പം സന്നിഹിതരായിരിക്കുന്ന എല്ലാ പുരുഷന്മാരേ, നിങ്ങൾ ഈ മനുഷ്യനെ കാണുന്നുവല്ലോ. യെരൂശലേമിലും ഇവിടെയും, ഇയാൾ ഇനി ജീവിച്ചിരിക്കരുതെന്ന് നിലവിളിച്ചുകൊണ്ട്, യെഹൂദരുടെ മുഴുവൻ ജനക്കൂട്ടവും[a] ഇയാളെക്കുറിച്ച് എന്നോട് അപേക്ഷിച്ചു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദജനസമൂഹം മുഴുവനും.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദപ്രയോഗം ഒരു കൂട്ടത്തെ ഒന്നാകെ സൂചിപ്പിക്കുന്നതാണ്. ഇത് എതിർപ്പിനെക്കുറിച്ചുള്ള ഫെസ്തൊസിന്റെ സംഗ്രഹവിവരണമാണ്; ഓരോ യെഹൂദവ്യക്തിയും ഒഴിവില്ലാതെ ഇതിൽ ഉൾപ്പെട്ടിരുന്നു എന്ന് നിർബന്ധമായി അർഥമില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എനിക്കു നിവേദനം നൽകി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ സജീവത സംരക്ഷിക്കുന്നു; മലയാളത്തിലും ഈ പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: ഞങ്ങളോടൊപ്പം സന്നിഹിതരായിരിക്കുന്ന എല്ലാ പുരുഷന്മാരേ
  rationale: ഒരുമിച്ചു സന്നിഹിതരായിരുന്ന പുരുഷന്മാരോടുള്ള ഔപചാരിക സംബോധന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: θεωρεῖτε τοῦτον
  choice: നിങ്ങൾ ഈ മനുഷ്യനെ കാണുന്നുവല്ലോ
  rationale: സദസ്സിന്റെ ശ്രദ്ധ പൗലൊസിലേക്കു തിരിക്കുന്ന പ്രസ്താവനയായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; കല്പനാരൂപമാക്കി മാറ്റുന്നില്ല.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: യെഹൂദജനസമൂഹം മുഴുവനും
  rationale: πλῆθος എന്ന കൂട്ടായ പ്രയോഗവും ἅπαν എന്ന സമഗ്രതാവാദവും നിലനിർത്തുന്നു; ഓരോ യെഹൂദവ്യക്തിയെയും ഒഴിവില്ലാതെ സൂചിപ്പിക്കുന്നു എന്ന അനാവശ്യ നിഗമനം ഒഴിവാക്കുന്നു.
- source_word: ἐνέτυχόν μοι
  choice: എനിക്കു നിവേദനം നൽകി
  rationale: അധികാരിയോടു ഔപചാരികമായി അപേക്ഷിക്കുന്ന നിയമസന്ദർഭം പ്രകടമാക്കുന്നു.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: യെരൂശലേമിലും ഇവിടെയും
  rationale: രണ്ടു സ്ഥലങ്ങളെയും ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് സമുച്ചയഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: βοῶντες
  choice: നിലവിളിച്ചുകൊണ്ട്
  rationale: ഉച്ചത്തിലുള്ള ശക്തമായ ആവശ്യം എന്ന ക്രിയയുടെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: ഇയാൾ ഇനി ജീവിച്ചിരിക്കരുതെന്ന്
  rationale: അവൻ തുടർന്നും ജീവിക്കുന്നത് പാടില്ലെന്ന അവരുടെ ആവശ്യം കൃത്യമായി നൽകുന്നു; അതിനെ സാങ്കേതികമായ വധശിക്ഷാവിധിയായി അധികവ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: ശത്രുതാപരമായ നിയമസന്ദർഭത്തിലെ ‘യെഹൂദർ’ എന്ന പരാമർശം
  choice: ഗ്രീക്കിലെ τῶν Ἰουδαίων അനുസരിച്ച് യെഹൂദരെ കൂട്ടായ ജനസമൂഹമായി പരാമർശിക്കുന്നു; ഫെസ്തൊസിന്റെ സംഗ്രഹാത്മക വാചാടോപമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘യെഹൂദനേതാക്കൾ’ എന്നു ചുരുക്കുക, അല്ലെങ്കിൽ ‘എല്ലാ യെഹൂദരും’ എന്നു വ്യക്തിവ്യാപകമായി പറയുക.
  rationale: മൂലപാഠം നേതാക്കളെന്നു മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല; അതേസമയം കൂട്ടായ πλῆθος എന്ന പദം ഓരോ വ്യക്തിയെയും ഒഴിവില്ലാതെ കുറ്റപ്പെടുത്തുന്നു എന്നു നിർബന്ധിക്കുന്നതുമില്ല.
- issue: μὴ δεῖν αὐτὸν ζῆν μηκέτι എന്നതിലെ നിർബന്ധത്തിന്റെ സ്വഭാവം
  choice: ‘ഇയാൾ ഇനി ജീവിച്ചിരിക്കരുത്’
  alternative: ‘ഇയാളെ കൊല്ലണം’
  rationale: മൂലത്തിലെ ജീവിക്കാൻ പാടില്ലെന്ന ആവശ്യം നിലനിർത്തുന്നു; പരോക്ഷപ്രസ്താവനയെ കൂടുതൽ നിർദ്ദിഷ്ടമായ വധശിക്ഷാഭാഷയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും പൊതുവായ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. രാജസദസ്സിലെ പ്രസംഗമായതിനാൽ ‘സന്നിഹിതരായിരിക്കുന്ന’, ‘നിവേദനം നൽകി’ തുടങ്ങിയ മാന്യമായ പദങ്ങൾ ഉപയോഗിച്ചു; എന്നാൽ βοῶντες എന്നതിന്റെ ശക്തി ‘നിലവിളിച്ചുകൊണ്ട്’ എന്നതിലൂടെ നിലനിർത്തി.
