  revised_text: 'ഫെസ്തൊസ് പറയുന്നു: “അഗ്രിപ്പാ രാജാവേ, ഞങ്ങളോടൊപ്പം സന്നിഹിതരായിരിക്കുന്ന എല്ലാ പുരുഷന്മാരേ, നിങ്ങൾ ഈ മനുഷ്യനെ കാണുന്നുവല്ലോ. യെരൂശലേമിലും ഇവിടെയും, ഇയാൾ ഇനി ജീവിച്ചിരിക്കരുതെന്ന് നിലവിളിച്ചുകൊണ്ട്, യെഹൂദരുടെ മുഴുവൻ ജനക്കൂട്ടവും[a] ഇയാളെക്കുറിച്ച് എന്നോട് അപേക്ഷിച്ചു[b].”'
