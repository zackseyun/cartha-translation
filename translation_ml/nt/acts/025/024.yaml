revisions:
- from: 'ഫെസ്തൊസ് പറയുന്നു: “അഗ്രിപ്പാ രാജാവേ, ഞങ്ങളോടൊപ്പം സന്നിഹിതരായിരിക്കുന്ന എല്ലാ പുരുഷന്മാരേ, നിങ്ങൾ ഈ മനുഷ്യനെ കാണുന്നുവല്ലോ. ഇയാൾ ഇനി ജീവിച്ചിരിക്കരുതെന്ന് നിലവിളിച്ചുകൊണ്ട്, യെരൂശലേമിലും ഇവിടെയും യെഹൂദജനസമൂഹം മുഴുവനും[a] ഇയാളെക്കുറിച്ച് എനിക്കു നിവേദനം നൽകി[b].”'
  to: 'ഫെസ്തൊസ് പറയുന്നു: “അഗ്രിപ്പാ രാജാവേ, ഞങ്ങളോടൊപ്പം സന്നിഹിതരായിരിക്കുന്ന എല്ലാ പുരുഷന്മാരേ, നിങ്ങൾ ഈ മനുഷ്യനെ കാണുന്നുവല്ലോ. യെരൂശലേമിലും ഇവിടെയും, ഇയാൾ ഇനി ജീവിച്ചിരിക്കരുതെന്ന് നിലവിളിച്ചുകൊണ്ട്, യെഹൂദരുടെ മുഴുവൻ ജനക്കൂട്ടവും[a] ഇയാളെക്കുറിച്ച് എന്നോട് അപേക്ഷിച്ചു[b].”'
  rationale: മൂലവാക്യത്തിലെ അപേക്ഷ–സ്ഥലം–നിലവിളി എന്ന അർഥബന്ധം മലയാളത്തിൽ തെളിച്ചത്തോടെ നിലനിർത്താൻ വാക്യം പുനഃക്രമീകരിച്ചു. ἐνέτυχόν μοι-ക്കായി ആധുനികവും നേരിട്ടുമായ ‘എന്നോട് അപേക്ഷിച്ചു’ സ്വീകരിച്ചു; മുമ്പത്തെ ഔപചാരിക ബദൽ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു. πλῆθος-ന്റെ കൂട്ടായ സ്വരം ‘മുഴുവൻ ജനക്കൂട്ടം’ എന്നതിലൂടെ നൽകി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ സൂചിപ്പിക്കുന്ന പദങ്ങളോടു നേരിട്ട് ബന്ധിപ്പിച്ചിരിക്കുന്നു.
