id: ACT.25.22
reference: Acts 25:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: ml
  text: 'അപ്പോൾ അഗ്രിപ്പാ ഫെസ്തൊസിനോടു പറഞ്ഞു: “എനിക്കും ആ മനുഷ്യനെ കേൾക്കണമെന്നുണ്ടായിരുന്നു[a].” “നാളെ,” അദ്ദേഹം പറയുന്നു[b], “താങ്കൾ അവനെ കേൾക്കും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻതന്നെ ആ മനുഷ്യനെ കേൾക്കണമെന്നുണ്ടായിരുന്നു.” καὶ αὐτός എന്നതിന് ‘എനിക്കും’ എന്ന കൂട്ടിച്ചേർക്കൽഭാവമോ ‘ഞാൻതന്നെ’ എന്ന ഊന്നലോ ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ഇവിടെ ചരിത്രവർത്തമാനകാലമാണ്: “അദ്ദേഹം പറയുന്നു.” ചില പരിഭാഷകൾ ഇത് “അദ്ദേഹം പറഞ്ഞു” എന്നു നൽകുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “താങ്കൾ അവനിൽനിന്ന് കേൾക്കും.” ഗ്രീക്ക് പ്രയോഗത്തിന് ആ വ്യക്തി സംസാരിക്കുന്നത് കേൾക്കുക എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: അഗ്രിപ്പാവ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ സംയോജകത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ശക്തമായ വിരോധം ചുമത്തുന്നില്ല.
- source_word: πρὸς τὸν Φῆστον
  choice: ഫെസ്തൊസിനോട് പറഞ്ഞു
  rationale: സംസാരക്രിയയുടെ ദിശ സൂചിപ്പിക്കുന്ന πρός എന്ന പ്രയോഗത്തെ സ്വാഭാവിക മലയാള സംഭാഷണരീതിയിൽ വ്യക്തമാക്കി.
- source_word: Ἐβουλόμην
  choice: കേൾക്കണമെന്നുണ്ട്
  rationale: ഭൂതകാലരൂപം ഇവിടെ വിനീതമായി ഇപ്പോഴത്തെ ആഗ്രഹം പ്രകടിപ്പിക്കുന്നതായി മനസ്സിലാക്കി, മലയാളത്തിൽ സ്വാഭാവികമായ ആഗ്രഹപ്രകടനമായി നൽകി.
- source_word: καὶ αὐτὸς
  choice: എനിക്കും നേരിട്ട്
  rationale: καίയുടെ ‘കൂടി/വും’ എന്ന സാധ്യതയും αὐτός നൽകുന്ന വ്യക്തിപരമായ ഊന്നലും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: ആ മനുഷ്യൻ പറയുന്നത് … നേരിട്ട് കേൾക്കാൻ
  rationale: ἀκούω + ജനിറ്റീവ് ഇവിടെ ആ വ്യക്തി സംസാരിക്കുന്നത് നേരിട്ട് കേൾക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു; ‘മനുഷ്യനെ കേൾക്കുക’ എന്ന അസ്വാഭാവിക മലയാളം ഒഴിവാക്കി.
- source_word: Αὔριον
  choice: നാളെ
  rationale: കാലവാചകത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക തർജമ.
- source_word: φησίν
  choice: അദ്ദേഹം പറയുന്നു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലം നിലനിർത്തി; സന്ദർഭത്തിൽ ഫെസ്തൊസാണ് സംസാരിക്കുന്നതെന്ന് ആദരസൂചക സർവനാമം വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσῃ αὐτοῦ
  choice: താങ്കൾക്ക് അയാൾ പറയുന്നത് കേൾക്കാം
  rationale: ഭാവികാലത്തിന്റെ ഉറപ്പുള്ള അനുവാദം/ക്രമീകരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; ജനിറ്റീവ് പ്രയോഗം ആ വ്യക്തിയിൽനിന്നു നേരിട്ട് കേൾക്കുക എന്ന അർഥം വഹിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. രാജാവായ അഗ്രിപ്പാവിനെ അഭിസംബോധന ചെയ്യുന്ന മറുപടിയിൽ ‘താങ്കൾ’ ഉപയോഗിച്ചു. ചരിത്രവർത്തമാനകാലവും καὶ αὐτός എന്നതിലെ യഥാർഥ ദ്വയാർഥസാധ്യതയും അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
