  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. മുൻവാക്യത്തിൽനിന്നുള്ള കർത്താവിനെയും പൗലോസിനെയും സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കിയിരിക്കുന്നു; ഗ്രീക്കിലെ അനുബന്ധ ക്രിയാരൂപത്തിന്റെ സമകാലികത ‘ഒരുക്കുകയായിരുന്നു’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
