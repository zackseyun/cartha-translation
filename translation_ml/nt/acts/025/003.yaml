source:
  edition: SBLGNT
  text: αἰτούμενοι χάριν κατ’ αὐτοῦ ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ, ἐνέδραν ποιοῦντες ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/003.yaml
  text: asking a favor against him[a], that he would have him brought to Jerusalem, while setting an ambush to kill him on the way.
translation:
  language: ml
  text: പൗലോസിനെതിരായി തങ്ങൾക്ക് ഒരു ആനുകൂല്യം ചെയ്യണമെന്നും അവനെ യെരൂശലേമിലേക്കു വരുത്തണമെന്നും[a] അവർ അപേക്ഷിച്ചു; വഴിയിൽവെച്ച് അവനെ കൊന്നുകളയാൻ പതിയിരിപ്പ് ഒരുക്കിക്കൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ യെരൂശലേമിലേക്കു വിളിച്ചുവരുത്തണമെന്ന്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “ആളയച്ചു വിളിപ്പിക്കുക” എന്നും “വരുത്തുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: പൗലോസിനെതിരായി തങ്ങൾക്ക് ഒരു ആനുകൂല്യം ചെയ്യണമെന്ന് അവർ അപേക്ഷിച്ചു
  rationale: ‘ഒരു ആനുകൂല്യം അപേക്ഷിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവും പൗലോസിനെതിരായ അഭ്യർഥനയുടെ പ്രതികൂല സ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: അവനെ യെരൂശലേമിലേക്കു വരുത്തണമെന്ന്
  rationale: ഫെസ്തൊസ് പൗലോസിനെ യെരൂശലേമിലേക്കു കൊണ്ടുവരാനുള്ള ക്രമീകരണം ചെയ്യണമെന്ന അഭ്യർഥനയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ക്രിയയുടെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐνέδραν ποιοῦντες
  choice: പതിയിരിപ്പ് ഒരുക്കുകയായിരുന്നു
  rationale: പ്രധാന അഭ്യർഥന നടക്കുമ്പോൾതന്നെ അവർ രഹസ്യമായി പതിയാക്രമണം ആസൂത്രണം ചെയ്തുകൊണ്ടിരുന്നു എന്ന അനുബന്ധ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀνελεῖν αὐτὸν
  choice: അവനെ കൊന്നുകളയാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀναιρέω നേരിട്ട് കൊല്ലുക എന്നർഥത്തിലാണ്; ‘കൊന്നുകളയുക’ ഉദ്ദേശ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν ὁδόν
  choice: വഴിയിൽവെച്ച്
  rationale: യാത്രാമധ്യേ പതിയാക്രമണം നടത്തുക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
