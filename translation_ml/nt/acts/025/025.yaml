base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: ml
  text: എന്നാൽ മരണത്തിന് അർഹമായതൊന്നും അവൻ ചെയ്തിട്ടില്ലെന്ന് ഞാൻ കണ്ടെത്തി. അവൻ തന്നേ ചക്രവർത്തിയോട്[a] അപ്പീൽ ചെയ്തതിനാൽ, അവനെ അയയ്ക്കാൻ ഞാൻ തീരുമാനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അഗസ്റ്റസിനോട്.’ Σεβαστός എന്ന ഗ്രീക്ക് പദവി ഇവിടെ റോമൻ ചക്രവർത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: ഞാൻ കണ്ടെത്തി
  rationale: പരിശോധനയ്ക്കുശേഷമുള്ള ഫെസ്തൊസിന്റെ ന്യായപരമായ നിഗമനത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഔപചാരിക വിധിയെന്ന അർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: മരണത്തിന് അർഹമായ യാതൊന്നും
  rationale: വധശിക്ഷ അർഹിക്കുന്ന പ്രവൃത്തി ഒന്നുമില്ലെന്ന ആശയം ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: αὐτὸν θανάτου πεπραχέναι
  choice: അവൻ ചെയ്തിട്ടില്ലെന്ന്
  rationale: അക്കൂസറ്റീവ്-ഇൻഫിനിറ്റീവ് ഘടനയെ സ്വാഭാവികമായ മലയാള ഉള്ളടക്കവാക്യമായി നൽകുന്നു.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: അവൻതന്നെ ... അപ്പീൽ ചെയ്തതിനാൽ
  rationale: τούτου നൽകുന്ന ഊന്നൽ ‘അവൻതന്നെ’ എന്നതിലൂടെ സൂക്ഷിക്കുകയും, തീരുമാനത്തിലേക്കു നയിച്ച സാഹചര്യത്തിന്റെ കാരണസ്വഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν Σεβαστόν
  choice: ചക്രവർത്തിയോട്
  rationale: Σεβαστός ഇവിടെ ചരിത്രപുരുഷനായ അഗസ്റ്റസിനെക്കാൾ റോമൻ സാമ്രാജ്യാധിപന്റെ പദവിയെ സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്ക് ‘ചക്രവർത്തി’ വ്യക്തമാണ്.
- source_word: ἔκρινα πέμπειν
  choice: അവനെ അയയ്ക്കാൻ ഞാൻ തീരുമാനിച്ചു
  rationale: ഔദ്യോഗിക നടപടിസംബന്ധമായ തീരുമാനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽനിന്നുള്ള കർമം ‘അവനെ’ എന്നു വ്യക്തമാക്കുന്നു.
