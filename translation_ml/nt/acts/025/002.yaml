translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘യെഹൂദന്മാർ’ എന്ന പരമ്പരാഗതവും ഇപ്പോഴും മനസ്സിലാക്കാവുന്നതുമായ രൂപം ഉപയോഗിച്ചു.
