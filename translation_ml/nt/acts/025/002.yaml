  terminology: “മുഖ്യപുരോഹിതന്മാർ,” “യെഹൂദന്മാരിലെ പ്രമുഖർ,” and “പൗലോസിനെതിരെ” are appropriate. “പരാതി ... ബോധിപ്പിച്ചു” conveys the contextual forensic sense while the footnote retains the broader lexical possibilities.
