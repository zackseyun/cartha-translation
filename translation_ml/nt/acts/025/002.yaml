  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: ml
  text: അപ്പോൾ മുഖ്യപുരോഹിതന്മാരും യെഹൂദന്മാരിലെ പ്രമുഖരും പൗലോസിനെതിരെയുള്ള പരാതി ഫെസ്തൊസിനെ ബോധിപ്പിച്ചു[a]. അവർ അദ്ദേഹത്തോട് അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൗലോസിനെക്കുറിച്ച് അദ്ദേഹത്തെ അറിയിച്ചു” എന്നും “അദ്ദേഹത്തോട് പൗലോസിനെതിരെ ആരോപണങ്ങൾ ഉന്നയിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു കാര്യം അറിയിക്കുക എന്ന അർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ അതിന് നിയമപരമായ ഭാവവും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: മുമ്പാകെ തങ്ങളുടെ കേസ് അവതരിപ്പിച്ചു
  rationale: ഭരണാധികാരിയുടെ മുമ്പിൽ ഒരു കാര്യം അറിയിക്കുകയോ നിയമപരമായി ഉന്നയിക്കുകയോ ചെയ്യുന്നതാണ് സന്ദർഭം. ഔപചാരിക കുറ്റപത്രം എന്നതിലധികം പറയാതെ നിയമപരമായ ഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τέ
  choice: അപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ സംഭവവുമായി കഥാചരിത്രപരമായ ബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; കണികയ്ക്ക് പ്രത്യേക ഊന്നൽ നൽകുന്നില്ല.
- source_word: αὐτῷ / αὐτόν
  choice: ഫെസ്തൊസിന്റെ മുമ്പാകെ / അദ്ദേഹത്തോട്
  rationale: രണ്ട് സർവനാമങ്ങളും സന്ദർഭത്തിൽ ഫെസ്തൊസിനെയാണ് സൂചിപ്പിക്കുന്നത്. ആദ്യത്തേതിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് വ്യക്തമാക്കിയിരിക്കുന്നു; രണ്ടാമത്തേതിൽ സ്വാഭാവികമായ സർവനാമം ഉപയോഗിച്ചു.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: യെരൂശലേമിലെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന അംഗീകൃത കൂട്ടപ്പേരിന് യോജിച്ച മലയാളപ്രയോഗം.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരിലെ പ്രമുഖർ
  rationale: സാമൂഹികമായോ രാഷ്ട്രീയമായോ മുൻനിരയിലുള്ളവരെ സൂചിപ്പിക്കുന്ന πρῶτοι എന്നതിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ പുരുഷലിംഗരൂപം മലയാളത്തിൽ അനാവശ്യമായി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: κατὰ τοῦ Παύλου
  choice: പൗലോസിനെതിരെ
  rationale: κατά + genitive ഇവിടെ എതിർപ്പിന്റെയും ആരോപണത്തിന്റെയും നിലപാട് വ്യക്തമാക്കുന്നു.
- source_word: παρεκάλουν
  choice: അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: imperfect രൂപത്തിലെ തുടർച്ചയായോ ആവർത്തിച്ചോ ഉള്ള അഭ്യർഥനയെ പ്രതിഫലിപ്പിക്കുന്നു. 'യാചിച്ചു' എന്നതിനെക്കാൾ നിയമ-രാഷ്ട്രീയ സന്ദർഭത്തിന് യോജിച്ചതാണ്.
