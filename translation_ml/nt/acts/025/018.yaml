id: ACT.25.18
reference: Acts 25:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ οὗ σταθέντες οἱ κατήγοροι οὐδεμίαν αἰτίαν ⸀ἔφερον ὧν ⸂ἐγὼ ὑπενόουν⸃ ⸀πονηρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: ml
  text: അവനെക്കുറിച്ച് കുറ്റാരോപകർ എഴുന്നേറ്റുനിന്നപ്പോൾ, ഞാൻ സംശയിച്ചിരുന്ന തരത്തിലുള്ള ദുഷ്‌പ്രവൃത്തികളൊന്നും അവർ അവന്റെമേൽ കുറ്റമായി ചുമത്തിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ സംശയിച്ചിരുന്ന കുറ്റകൃത്യങ്ങളൊന്നും അവർ അവന്റെമേൽ ആരോപിച്ചില്ല.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ദുഷ്ടമായ കാര്യങ്ങൾ” എന്നാണ്; ഔപചാരികമായി നിർവചിക്കപ്പെട്ട കുറ്റകൃത്യങ്ങളെക്കാൾ പൊതുവായ തെറ്റായ പ്രവൃത്തികളെയും അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive ഇവിടെ പൗലോസിനെ സംബന്ധിച്ച വിഷയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: σταθέντες
  choice: എഴുന്നേറ്റുനിന്നപ്പോൾ
  rationale: Aorist participle കോടതി പശ്ചാത്തലത്തിൽ കുറ്റാരോപകർ വാദം ഉന്നയിക്കാൻ എഴുന്നേറ്റ സന്ദർഭത്തെ കാലസൂചനയായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ κατήγοροι
  choice: കുറ്റാരോപകർ
  rationale: നിയമപരമായ സാഹചര്യത്തിൽ ആരോപണം ഉന്നയിക്കുന്നവരെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; ഔപചാരികമായെങ്കിലും ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യമാണ്.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: കുറ്റമായി ചുമത്തിയില്ല
  rationale: φέρειν αἰτίαν എന്ന നിയമപ്രയോഗത്തിന്റെ അർഥം കുറ്റം കൊണ്ടുവരുക അഥവാ ചുമത്തുക എന്നതാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ കോടതി പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: ὧν
  choice: തരത്തിലുള്ള ... ഒന്നും
  rationale: Festus പ്രതീക്ഷിച്ചിരുന്ന ദുഷ്‌പ്രവൃത്തികളുടെ വിഭാഗവുമായി αἰτίαν ബന്ധിപ്പിക്കുന്ന relative construction മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγὼ ὑπενόουν
  choice: ഞാൻ സംശയിച്ചിരുന്ന
  rationale: Imperfect രൂപത്തിലെ മുൻകാലത്തുടർച്ചയുള്ള സംശയമോ അനുമാനമോ ‘സംശയിച്ചിരുന്ന’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: πονηρῶν
  choice: ദുഷ്‌പ്രവൃത്തികൾ
  rationale: Neuter plural ആയ πονηρῶν പൊതുവായ തിന്മകളെയോ തെറ്റായ പ്രവൃത്തികളെയോ സൂചിപ്പിക്കാം; ‘കുറ്റകൃത്യങ്ങൾ’ എന്നു നിയമപരമായി അതിരുകടന്ന് നിർവചിക്കാതെ പ്രവൃത്തിസൂചന നിലനിർത്തുന്നു.
