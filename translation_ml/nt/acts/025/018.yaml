translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ നിയമസന്ദർഭ ഭാഷ ഉപയോഗിച്ചു. ‘ദുഷ്‌പ്രവൃത്തികൾ’ എന്നത് ഗ്രീക്കിലെ പൊതുവായ അർഥവും കോടതി പശ്ചാത്തലവും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തുന്നു; കൂടുതൽ നിയമനിർദ്ദിഷ്ടമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
