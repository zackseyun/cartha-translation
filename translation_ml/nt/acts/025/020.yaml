id: ACT.25.20
reference: Acts 25:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: ml
  text: ഈ കാര്യങ്ങളെക്കുറിച്ചുള്ള അന്വേഷണത്തെപ്പറ്റി എനിക്ക് ആശയക്കുഴപ്പമുണ്ടായതിനാൽ[a], യെരൂശലേമിലേക്കു പോകാനും അവിടെവെച്ച് ഈ കാര്യങ്ങളെക്കുറിച്ച് വിചാരണ ചെയ്യപ്പെടാനും അവന് ആഗ്രഹമുണ്ടോ[b] എന്നു ഞാൻ ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ കാര്യങ്ങളെക്കുറിച്ചുള്ള തർക്കത്തെപ്പറ്റി ഞാൻ ആശയക്കുഴപ്പത്തിലായിരുന്നതിനാൽ.’
    reason: ζήτησις എന്ന പദത്തിന് ‘അന്വേഷണം,’ ‘ചോദ്യം,’ അല്ലെങ്കിൽ ‘തർക്കം’ എന്ന അർഥസാധ്യതകളുണ്ട്; ἀπορούμενος ആശയക്കുഴപ്പത്തിലാകുന്നതിനെയും വഴിയറ്റുപോകുന്നതിനെയും സൂചിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, ‘പോകാൻ അവന് സമ്മതമാണോ.’
    reason: βούλομαι ആഗ്രഹത്തെയോ സന്നദ്ധതയെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἀπορούμενος
  choice: എന്തു ചെയ്യണമെന്നറിയാതെ ഞാൻ കുഴങ്ങിയതിനാൽ
  rationale: ഈ കൃതന്തം അനിശ്ചിതത്വമോ വഴിയറിയാത്ത അവസ്ഥയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ കാരണാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ζήτησιν
  choice: അന്വേഷണത്തിൽ
  rationale: നിയമപരവും ഭരണപരവുമായ സന്ദർഭത്തിൽ പരിശോധിച്ചുകൊണ്ടിരിക്കുന്ന വിഷയത്തെ സൂചിപ്പിക്കാൻ ‘അന്വേഷണം’ യോജിക്കുന്നു; ‘തർക്കം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: περὶ τούτων
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ചുള്ള / ഈ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: ആരോപണങ്ങളും ചർച്ചാവിഷയങ്ങളും ഉൾപ്പെടുന്ന മുൻസന്ദർഭത്തെ സ്വാഭാവികമായ നിയമഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔλεγον
  choice: ഞാൻ ചോദിച്ചു
  rationale: പദശഃ ‘ഞാൻ പറഞ്ഞു’ എന്നാണെങ്കിലും, εἰ കൊണ്ടുവരുന്ന പരോക്ഷചോദ്യം കാരണം ഇവിടെ പ്രവർത്തനാർഥം ‘ചോദിച്ചു’ എന്നാണ്.
- source_word: εἰ βούλοιτο
  choice: അവന് ആഗ്രഹമുണ്ടോ
  rationale: ഫെസ്തൊസിന്റെ ചോദ്യത്തിലെ ആഗ്രഹം/മനസ്സ് എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘സമ്മതമാണോ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πορεύεσθαι
  choice: പോകാൻ
  rationale: സഞ്ചരിക്കുക എന്ന ക്രിയയുടെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: κἀκεῖ
  choice: അവിടെവെച്ച്
  rationale: καὶ ἐκεῖ എന്ന സംയുക്തത്തിന്റെ ‘അവിടെത്തന്നെ’ എന്ന സ്ഥലസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κρίνεσθαι
  choice: വിചാരണ ചെയ്യപ്പെടാൻ
  rationale: നിയമപരമായ തീർപ്പിനായി കേസ് പരിഗണിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു; ‘വിധിക്കപ്പെടുക’ എന്നതിനെക്കാൾ മലയാള നിയമസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-വിവരണ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ പരോക്ഷചോദ്യവും നിഷ്ക്രിയമായ നിയമനടപടിയും നിലനിർത്തി; യഥാർത്ഥ പദാർഥവൈകല്യങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
