  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാകുന്ന വിധത്തിൽ എഴുതിയെങ്കിലും, ഗ്രീക്കിലുള്ള വിശാലമായ അർഥം ചുരുക്കി നിർവചിച്ചിട്ടില്ല.
