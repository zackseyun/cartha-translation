source:
  edition: SBLGNT
  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: ml
  text: 'അവർ അവിടെ പല ദിവസം താമസിച്ചപ്പോൾ, ഫെസ്തൊസ് പൗലോസിനെ സംബന്ധിച്ച കാര്യങ്ങൾ[a] രാജാവിന്റെ പരിഗണനയ്ക്കായി അവതരിപ്പിച്ചു.[b] അദ്ദേഹം പറഞ്ഞു: “ഫേലിക്സ് തടവുകാരനായി വിട്ടിട്ടുള്ള ഒരാളുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “പൗലോസിന്റെ കേസ്.” ഈ പ്രയോഗം പൗലോസിന്റെ നിയമപരമായ സ്ഥിതിയെ കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “രാജാവിനെ അറിയിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം വെറും വിവരം നൽകുന്നതിലുപരി ഒരു വിഷയം പരിഗണനയ്ക്കായി സമർപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: ഏറെ ദിവസം
  rationale: കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗം സന്ദർഭത്തിൽ ‘പല/ഏറെ ദിവസം’ എന്ന അർഥം നൽകുന്നു; കർശനമായ താരതമ്യം ഇവിടെ ആവശ്യമായില്ല.
- source_word: διέτριβον
  choice: താമസിച്ചപ്പോൾ
  rationale: ഒരു സ്ഥലത്ത് സമയം ചെലവഴിക്കുക, അവിടെ തങ്ങുക എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνέθετο
  choice: പരിഗണനയ്ക്കായി അവതരിപ്പിച്ചുകൊണ്ട്
  rationale: വെറും വിവരം അറിയിക്കുന്നതിലുപരി ഒരു വിഷയം മറ്റൊരാളുടെ മുമ്പാകെ പരിഗണനയ്ക്കായി വെക്കുന്നതാണ് മധ്യമരൂപം സൂചിപ്പിക്കുന്നത്.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: പൗലോസിനെ സംബന്ധിച്ച കാര്യങ്ങൾ
  rationale: ഇത് പൗലോസുമായി ബന്ധപ്പെട്ട വിഷയങ്ങളെ, സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് അദ്ദേഹത്തിന്റെ നിയമപരമായ കേസിനെ, സൂചിപ്പിക്കുന്നു; ‘കാര്യങ്ങൾ’ ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: Ἀνήρ τίς
  choice: ഒരാൾ
  rationale: നിശ്ചിതനായെങ്കിലും ഇതുവരെ പരിചയപ്പെടുത്താത്ത ഒരാളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: καταλελειμμένος
  choice: വിട്ടുപോയ
  rationale: പിന്നിൽ വിട്ടതിന്റെ ഫലമായി ആ നിലയിൽ തുടരുന്നതിനെ പൂർണകാല കർമണി കൃദന്തം സൂചിപ്പിക്കുന്നു; ഉപേക്ഷിച്ചതെന്ന വൈകാരിക ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: δέσμιος
  choice: തടവുകാരനായി
  rationale: ഫേലിക്സ് ആ മനുഷ്യനെ വിട്ടുപോയപ്പോൾ അയാൾ തുടർന്നും തടവുകാരന്റെ നിലയിലായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: βασιλεῖ
  choice: രാജാവിന്റെ
  rationale: മൂലപാഠത്തിലെ ‘രാജാവിന്’ എന്ന പദവി മാത്രം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ രാജാവ് അഗ്രിപ്പാവാണെന്ന് വ്യക്തമാണ്.
