id: ACT.25.12
reference: Acts 25:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: ml
  text: 'അപ്പോൾ ഫെസ്തൊസ് ആലോചനാസമിതിയുമായി കൂടിയാലോചിച്ചശേഷം മറുപടി പറഞ്ഞു: “നീ കൈസറോട് അപ്പീൽ ചെയ്തിരിക്കുന്നു; കൈസറുടെ അടുക്കലേക്കുതന്നെ നീ പോകും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൈസറുടെ സന്നിധിയിലേക്കു നീ പോകും” എന്നും പരിഭാഷപ്പെടുത്താം. അപ്പീൽ ചെയ്തതിനാൽ ചക്രവർത്തിയുടെ ന്യായാസനത്തിനു മുമ്പാകെ ഹാജരാകുക എന്ന നിയമാർത്ഥം ഈ പ്രയോഗത്തിനുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: συλλαλήσας
  choice: കൂടിയാലോചിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ ചർച്ചയും ആലോചനയും അഒറിസ്റ്റ് കൃദന്തരൂപത്തിന്റെ കാലബന്ധത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: μετὰ τοῦ συμβουλίου
  choice: ആലോചനാസമിതിയുമായി
  rationale: നിയമ-ഭരണസന്ദർഭത്തിലെ ഉപദേശകസംഘത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘അവന്റെ’ എന്ന ഉടമസ്ഥത ചേർക്കുന്നില്ല.
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ഔപചാരികമായ നിയമസന്ദർഭത്തിനും മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കും യോജിക്കുന്നു.
- source_word: Καίσαρα
  choice: കൈസർ
  rationale: റോമൻ ചക്രവർത്തിയുടെ പദവി/നാമം ലിപ്യന്തരണം ചെയ്ത് നിയമസന്ദർഭം നിലനിർത്തുന്നു.
- source_word: ἐπικέκλησαι
  choice: അപ്പീൽ ചെയ്തിരിക്കുന്നു
  rationale: ἐπικαλέω എന്ന ക്രിയയുടെ ഇവിടെ പ്രസക്തമായ നിയമാർത്ഥമായ മേൽക്കോടതി അധികാരം അഭ്യർഥിക്കൽ വ്യക്തമാക്കുന്നു; പൂർണ്ണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും പ്രതിഫലിക്കുന്നു.
- source_word: ἐπὶ Καίσαρα
  choice: കൈസറുടെ അടുക്കലേക്ക്
  rationale: πορεύσῃയോടൊപ്പം കൈസറിലേക്കുള്ള ഗതിയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ന്യായാസനസന്നിധിയിൽ ഹാജരാകുക എന്ന നിയമസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πορεύσῃ
  choice: നീ പോകും
  rationale: ഭാവികാല മധ്യമരൂപത്തിന്റെ നേരിട്ടുള്ള ഗതിയർത്ഥം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘അയക്കപ്പെടും’ എന്ന കർമണാർത്ഥം ചേർക്കുന്നില്ല.
