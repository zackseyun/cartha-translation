revisions:
- from: 'എന്നാൽ യെഹൂദന്മാർക്ക് ഒരു ഉപകാരം ചെയ്യാൻ ആഗ്രഹിച്ച ഫെസ്തൊസ് പൗലൊസിനോട് മറുപടിയായി പറഞ്ഞു: “നീ യെരൂശലേമിലേക്കു പോയി, അവിടെ എന്റെ മുമ്പാകെ ഈ കാര്യങ്ങളെക്കുറിച്ച് വിചാരണ ചെയ്യപ്പെടാൻ ആഗ്രഹിക്കുന്നുവോ?”[a]'
  to: 'എന്നാൽ യെഹൂദന്മാർക്ക് ഒരു ഉപകാരം ചെയ്യാൻ ആഗ്രഹിച്ച ഫെസ്തൊസ് പൗലൊസിനോടു മറുപടി പറഞ്ഞു: “നീ യെരൂശലേമിലേക്കു പോയി, അവിടെ എന്റെ മുമ്പാകെ ഈ കാര്യങ്ങളെക്കുറിച്ചു നിന്റെ കേസ് വിചാരണ ചെയ്യപ്പെടാൻ ആഗ്രഹിക്കുന്നുവോ?”[a][b]'
  rationale: The revision retains the Greek's broad wording for τοῖς Ἰουδαίοις, Festus's motive to grant them a favor, and the judicial sense of κριθῆναι under Festus's authority. It improves Malayalam legal idiom by making explicit what is judicially tried—the case—without adding a substantive element absent from the context, and it separates the contextual and lexical footnotes under their proper anchors.
