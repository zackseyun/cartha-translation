id: ACT.25.9
reference: Acts 25:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: ml
  text: 'എന്നാൽ യെഹൂദന്മാർക്ക് ഒരു ഉപകാരം ചെയ്യാൻ ആഗ്രഹിച്ച ഫെസ്തൊസ് പൗലൊസിനോടു മറുപടി പറഞ്ഞു: “നീ യെരൂശലേമിലേക്കു പോയി, അവിടെ എന്റെ മുമ്പാകെ ഈ കാര്യങ്ങളെക്കുറിച്ചു നിന്റെ കേസ് വിചാരണ ചെയ്യപ്പെടാൻ ആഗ്രഹിക്കുന്നുവോ?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “യെഹൂദന്മാർ” എന്നത് എല്ലാ യെഹൂദരെയും വിവേചനമില്ലാതെ സൂചിപ്പിക്കുന്നതല്ല; സന്ദർഭത്തിൽ ഈ കേസുമായി ബന്ധപ്പെട്ട യെഹൂദ കുറ്റാരോപകരെയോ നേതാക്കളെയോ ആണ് ഉദ്ദേശിക്കുന്നത്.
    reason: സന്ദർഭവ്യക്തീകരണം
  - marker: b
    text: “നിന്റെ കേസ് വിചാരണ ചെയ്യപ്പെടാൻ” എന്നത് “നിന്റെ കേസ് എന്റെ മുമ്പാകെ കേൾക്കപ്പെടാൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: പദാർഥവികല്പം
lexical_decisions:
- source_word: θέλων
  choice: ആഗ്രഹിച്ച
  rationale: ഫെസ്തൊസിന്റെ അന്നത്തെ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദന്മാർക്ക്
  rationale: ഗ്രീക്കിലെ വിശാലമായ ജനവിഭാഗനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കേസുമായി ബന്ധപ്പെട്ട യെഹൂദ കുറ്റാരോപകരെയോ നേതാക്കളെയോ ആണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: χάριν καταθέσθαι
  choice: ഒരു ഉപകാരം ചെയ്യാൻ
  rationale: ആർക്കെങ്കിലും അനുകൂലമായി പ്രവർത്തിച്ച് അവരുടെ പ്രസാദം നേടുക എന്ന നിയമ-രാഷ്ട്രീയ സന്ദർഭത്തിലെ പ്രയോഗാർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘പ്രീതി പിടിച്ചുപറ്റാൻ’ എന്നത് ഗ്രീക്കിലുള്ളതിലധികം കൃത്രിമമായ ഉദ്ദേശ്യം ആരോപിച്ചേക്കാം.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപവും മുഖ്യക്രിയയും ആവർത്തനഭാരം കൂടാതെ സ്വാഭാവിക മലയാള ആഖ്യാനമായി അവതരിപ്പിക്കുന്നു.
- source_word: Θέλεις
  choice: ആഗ്രഹിക്കുന്നുവോ
  rationale: പൗലൊസിന്റെ സമ്മതമോ ഇച്ഛയോ നേരിട്ട് ചോദിക്കുന്ന രൂപം നിലനിർത്തുന്നു.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: യെരൂശലേമിലേക്കു പോയി
  rationale: മലയാളത്തിൽ ‘യെരൂശലേമിലേക്കു കയറിപ്പോയി’ എന്ന അക്ഷരാർഥം അസ്വാഭാവികമാകുന്നതിനാൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്ര സ്വാഭാവികമായി പറയുന്നു; ഗ്രീക്കിലെ ഭൂമിശാസ്ത്രപരമായ ‘മുകളിലേക്കു പോകുക’ എന്ന സൂചന മുഖ്യ അർഥമല്ല.
- source_word: περὶ τούτων
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: ‘കുറ്റാരോപണങ്ങൾ’ എന്ന് സന്ദർഭം മാത്രം ആശ്രയിച്ച് ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലമായ സൂചന നിലനിർത്തുന്നു.
- source_word: κριθῆναι
  choice: വിചാരണ ചെയ്യപ്പെടാൻ
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ κρίνωയുടെ കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന ‘കേസ് വിചാരണ ചെയ്യപ്പെടുക’ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπ’ ἐμοῦ
  choice: എന്റെ മുമ്പാകെ
  rationale: ഫെസ്തൊസിന്റെ സാന്നിധ്യത്തിലോ അധികാരത്തിൻ കീഴിലോ കേസ് പരിഗണിക്കപ്പെടുമെന്ന അർഥം, അവൻ മാത്രമാണ് വിധികർത്താവ് എന്ന് അതിനിർവചിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘യെഹൂദന്മാർ’ എന്നതിന്റെ യെഹൂദവിരുദ്ധമായ അതിവായനയ്ക്കുള്ള സാധ്യത
  choice: മൂലത്തിലെ τοῖς Ἰουδαίοις എന്ന വിശാല പദം പ്രധാനവാചകത്തിൽ ‘യെഹൂദന്മാർക്ക്’ എന്നു നിലനിർത്തി, ഇവിടെ ആരെയാണ് സന്ദർഭപരമായി ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘യെഹൂദ നേതാക്കൾക്ക്’ അല്ലെങ്കിൽ ‘യെഹൂദ കുറ്റാരോപകർക്ക്’ എന്നു പ്രധാനവാചകത്തിൽ ചുരുക്കുക.
  rationale: ചുരുക്കിയ പരിഭാഷ സന്ദർഭം വ്യക്തമാക്കുമെങ്കിലും മൂലപദത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ ചേർക്കും. അടിക്കുറിപ്പ് അനാവശ്യമായ സമസ്തജനവിഭാഗവൽക്കരണം തടയുമ്പോൾ മൂലത്തിലെ പദവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ആഖ്യാന ശൈലി. ഗ്രീക്കിലെ ചോദ്യം, കർമണിപ്രയോഗം, ഫെസ്തൊസിന്റെ രാഷ്ട്രീയ ഉദ്ദേശ്യം എന്നിവ നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
