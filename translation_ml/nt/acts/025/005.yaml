  terminology: ‘കഴിവുള്ളവർ’ is a defensible rendering of δυνατοί that preserves the source term’s range rather than asserting social rank. The footnote responsibly identifies ‘പ്രമുഖർ’ and ‘അധികാരമുള്ളവർ’ as contextual alternatives. ‘തെറ്റ്’ appropriately avoids overstating ἄτοπον as necessarily a crime.
