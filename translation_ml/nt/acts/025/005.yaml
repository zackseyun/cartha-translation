  source_fidelity: The Malayalam accurately represents the Greek's inferential οὖν, the substantival and semantically open δυνατοί, the joint descent expressed by συγκαταβάντες, the conditional εἴ τί ἐστιν, and the broad ἄτοπον. ‘ആ മനുഷ്യനിൽ’ properly retains the sense of ἐν τῷ ἀνδρί without prematurely turning it into a charge ‘against’ him. ‘അവന്റെമേൽ കുറ്റം ചുമത്തട്ടെ’ is an idiomatic legal rendering of κατηγορείτωσαν αὐτοῦ.
