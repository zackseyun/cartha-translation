id: ACT.25.5
reference: Acts 25:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: ml
  text: “അതുകൊണ്ട്, നിങ്ങളിൽ കഴിവുള്ളവർ[a] എന്നോടൊപ്പം ഇറങ്ങിവന്ന്, ആ മനുഷ്യനിൽ എന്തെങ്കിലും തെറ്റുണ്ടെങ്കിൽ അവന്റെമേൽ കുറ്റം ചുമത്തട്ടെ[b],” എന്ന് അദ്ദേഹം പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിങ്ങളിലെ പ്രമുഖർ,” “നിങ്ങളിൽ അധികാരമുള്ളവർ.” ഗ്രീക്കിലെ δυνατοί എന്ന പദത്തിന് കഴിവുള്ളവർ, പ്രബലർ, പ്രമുഖർ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവനെതിരെ ആരോപണം ഉന്നയിക്കട്ടെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: അതുകൊണ്ട്, ... അവർ ...ട്ടെ
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനപരമായ തുടർച്ച ‘അതുകൊണ്ട്’ എന്നു നൽകി; നാമവത്കരിച്ച വിശേഷണത്തോടുകൂടിയ Οἱ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചന ഘടനയായി അവതരിപ്പിച്ചു.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: നിങ്ങളിൽ കഴിവുള്ളവർ
  rationale: δυνατοί എന്നതിന് ‘കഴിവുള്ളവർ,’ ‘പ്രബലർ,’ ‘പ്രമുഖർ,’ ‘അധികാരമുള്ളവർ’ എന്നീ അർഥസാധ്യതകളുണ്ട്. സന്ദർഭത്തിൽ പ്രതിനിധികളായി പോകാൻ പ്രാപ്തരായവരെയാണ് ഉദ്ദേശിക്കുന്നതാകാം; എന്നാൽ സാമൂഹികപദവിയെ ഉറപ്പിച്ച് ചേർക്കാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്താൻ ‘കഴിവുള്ളവർ’ തെരഞ്ഞെടുത്തു.
- source_word: φησίν
  choice: എന്ന് അദ്ദേഹം പറഞ്ഞു
  rationale: പ്രസംഗം ആരുടേതാണെന്ന് അടയാളപ്പെടുത്തുന്ന parenthetical reporting expression മലയാളത്തിൽ സ്വാഭാവികമായി വാക്യാവസാനത്തിൽ വ്യക്തമാക്കി.
- source_word: συγκαταβάντες
  choice: എന്നോടൊപ്പം ഇറങ്ങിവന്ന്
  rationale: σύν എന്ന കൂട്ടായ്മയുടെ ആശയം ‘എന്നോടൊപ്പം’ എന്നും, യെരൂശലേമിൽനിന്ന് കൈസര്യയിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ഭൂമിശാസ്ത്രപ്രയോഗം ‘ഇറങ്ങിവന്ന്’ എന്നും നൽകി.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: ആ മനുഷ്യനിൽ എന്തെങ്കിലും തെറ്റുണ്ടെങ്കിൽ
  rationale: നിബന്ധനയും τίയുടെ അനിശ്ചിതത്വവും നിലനിർത്തി. ἄτοπον എന്നത് നിർബന്ധമായും കുറ്റകൃത്യം എന്നർഥമല്ലാത്തതിനാൽ വിശാലമായ ‘തെറ്റ്’ ഉപയോഗിച്ചു; ἐν എന്നത് ‘മനുഷ്യനിൽ’ എന്നു സംരക്ഷിച്ചു.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: അവന്റെമേൽ കുറ്റം ചുമത്തട്ടെ
  rationale: നിയമസന്ദർഭത്തിലെ κατηγορέωയെ സ്വാഭാവിക മലയാളത്തിൽ ‘കുറ്റം ചുമത്തുക’ എന്നു നൽകി; മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞാർത്ഥം ‘ചുമത്തട്ടെ’ എന്നതിൽ നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമപരവും ആഖ്യാനപരവുമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. മൂലത്തിലെ δυνατοί എന്ന പദത്തിന്റെ സാമൂഹികപദവിയോ കേവല പ്രാപ്തിയോ എന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
