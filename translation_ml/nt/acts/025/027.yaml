source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: ml
  text: കാരണം, ഒരു തടവുകാരനെ അയയ്ക്കുമ്പോൾ അയാൾക്കെതിരെയുള്ള കുറ്റാരോപണങ്ങൾ കൂടി വ്യക്തമാക്കാതിരിക്കുന്നത്[a] എനിക്കു യുക്തിയില്ലാത്തതായി തോന്നുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അയാൾക്കെതിരെയുള്ള കുറ്റാരോപണങ്ങൾ കൂടി സൂചിപ്പിക്കാതിരിക്കുന്നത്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογον
  choice: യുക്തിയില്ലാത്തതായി
  rationale: യുക്തിക്കോ സാമാന്യബോധത്തിനോ നിരക്കാത്തത് എന്ന അർഥം നൽകുന്നു; ഫെസ്തൊസിന്റെ ഭരണപരമായ വിലയിരുത്തലിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: δοκεῖ μοι
  choice: എനിക്കു തോന്നുന്നു
  rationale: വ്യക്തിപരവും അല്പം മിതവുമായ വിലയിരുത്തൽ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: πέμποντα
  choice: അയയ്ക്കുമ്പോൾ
  rationale: കർത്താവിനെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ സാഹചര്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δέσμιον
  choice: ഒരു തടവുകാരനെ
  rationale: നിയമപരമായ കസ്റ്റഡിയിലുള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിലെ വ്യക്തവും സാധാരണവുമായ പദം.
- source_word: μὴ καὶ
  choice: കൂടി ... വ്യക്തമാക്കാതിരിക്കുന്നത്
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘കൂടി’ എന്നതിലൂടെ നിലനിർത്തുകയും നിഷേധഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: അയാൾക്കെതിരെയുള്ള കുറ്റാരോപണങ്ങൾ
  rationale: ന്യായവ്യവഹാരസന്ദർഭത്തിലെ αἰτίαയുടെ ‘കുറ്റം ചുമത്തുന്ന ആരോപണങ്ങൾ’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: σημᾶναι
  choice: വ്യക്തമാക്കുക
  rationale: അറിയിക്കുക, സൂചിപ്പിക്കുക, വ്യക്തമാക്കുക എന്നീ സാധ്യതകളിൽ ഔദ്യോഗികമായി കുറ്റാരോപണങ്ങൾ രേഖപ്പെടുത്തി അറിയിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; എത്രമാത്രം വിശദീകരിക്കണമെന്നത് അമിതമായി നിർണയിക്കുന്നില്ല.
