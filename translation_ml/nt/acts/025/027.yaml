  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ഭരണപര ശൈലി. ‘അയാൾ’ എന്നത് സന്ദർഭത്തിലെ തടവുകാരനെ വ്യക്തമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു. മുഖ്യവാക്യത്തിലെ അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
