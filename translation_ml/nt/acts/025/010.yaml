translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ നിയമസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘കൈസർ’, ‘ന്യായാസനം’, ‘വിചാരണ’ എന്നിവ ചരിത്ര-നിയമ ഭാവം നിലനിർത്തുന്നു; ഫെസ്തൊസിനോടുള്ള അഭിസംബോധനയിൽ മാന്യമായ ‘താങ്കൾ’ ഉപയോഗിച്ചു.
