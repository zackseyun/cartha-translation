source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് പറഞ്ഞു: “കൈസറുടെ ന്യായാസനത്തിനുമുമ്പിൽ ഞാൻ നിൽക്കുകയാണ്[a]; അവിടെയാണ് എന്നെ വിചാരണ ചെയ്യേണ്ടത്. യെഹൂദന്മാരോട് ഞാൻ ഒരു അനീതിയും ചെയ്തിട്ടില്ല[b]—അത് താങ്കൾക്കും വളരെ നന്നായി അറിയാമല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ കൈസറുടെ ന്യായാസനത്തിനുമുമ്പിൽ നിൽക്കുന്നു.” ഗ്രീക്കിലെ പ്രയോഗം പൗലോസിന്റെ ഇപ്പോഴത്തെ നിയമപരമായ നിലയ്ക്ക് ഊന്നൽ നൽകുന്നു. ‘ന്യായാസനം’ ഔദ്യോഗിക ന്യായവിധി ഇരിപ്പിടത്തെയോ കോടതിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യെഹൂദന്മാർക്കെതിരെ ഞാൻ ഒരു കുറ്റവും ചെയ്തിട്ടില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: ന്യായാസനം
  rationale: റോമൻ അധികാരിയുടെ ഔദ്യോഗിക ന്യായവിധി ഇരിപ്പിടത്തെയും അതിനോടു ബന്ധപ്പെട്ട കോടതിയെയും സൂചിപ്പിക്കുന്നു. ‘ന്യായാസനം’ ചരിത്രപരവും നിയമപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: Καίσαρος
  choice: കൈസറുടെ
  rationale: ചക്രവർത്തിയുടെ റോമൻ സ്ഥാനപ്പേര് അതേപടി നിലനിർത്തി ചരിത്ര-നിയമ പശ്ചാത്തലം സംരക്ഷിക്കുന്നു.
- source_word: ἑστώς εἰμι
  choice: നിൽക്കുകയാണ്
  rationale: പൂർണകാല കൃതി-രൂപവും εἰμίയും ചേർന്ന പ്രയോഗം പൗലോസിന്റെ ഇപ്പോഴത്തെ നിയമപരമായ നിലയ്ക്ക് ഊന്നൽ നൽകുന്നു.
- source_word: οὗ
  choice: ഇവിടെവെച്ചാണ്
  rationale: ന്യായാസനത്തെ അവന്റെ കേസ് വിധിക്കപ്പെടേണ്ട ഉചിതമായ അധികാരസ്ഥാനമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥല-അധികാര ആശയം പ്രകടമാക്കുന്നു.
- source_word: δεῖ
  choice: ചെയ്യേണ്ടത്
  rationale: വ്യക്തിപരമായ നിർബന്ധത്തെക്കാൾ ശരിയായ നിയമാധികാരവും നടപടിക്രമപരമായ ആവശ്യകതയും ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: κρίνεσθαι
  choice: വിചാരണ ചെയ്യപ്പെടുക
  rationale: നിയമസന്ദർഭത്തിലെ passive ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἰουδαίους
  choice: യെഹൂദന്മാരോട്
  rationale: ഇവിടെ ആരോപണവുമായി ബന്ധപ്പെട്ട യെഹൂദജനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ഭൂമിശാസ്ത്രപരമായി ചുരുക്കുന്ന പദം ഒഴിവാക്കി.
- source_word: οὐδὲν ἠδίκησα
  choice: ഒരു അനീതിയും ചെയ്തിട്ടില്ല
  rationale: ἀδικέωയുടെ ധാർമികവും നിയമപരവുമായ ‘തെറ്റ്/അനീതി ചെയ്യുക’ എന്ന ശക്തി ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: അത് താങ്കൾക്കും വളരെ നന്നായി അറിയാമല്ലോ
  rationale: καὶ σὺയിലെ അഭിമുഖ ഊന്നലും κάλλιον ἐπιγινώσκεις എന്നതിലെ ഉറപ്പോടെയുള്ള അറിവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു; ‘താങ്കൾ’ ഭരണാധികാരിയോടുള്ള മാന്യമായ ഏകവചന അഭിസംബോധനയാണ്.
