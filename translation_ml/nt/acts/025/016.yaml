revisions:
- from: 'അവരോട് ഞാൻ മറുപടി പറഞ്ഞത്: കുറ്റാരോപിതന് തന്റെ കുറ്റാരോപകരെ മുഖാമുഖം കാണാനും ആരോപിക്കപ്പെട്ട കുറ്റത്തെക്കുറിച്ച് പ്രതിവാദം നടത്താൻ അവസരം ലഭിക്കാനും മുമ്പ് ഒരാളെ അവരുടെ ആവശ്യപ്രകാരം വിട്ടുകൊടുക്കുന്നത് റോമാക്കാരുടെ പതിവല്ല[a][b].'
  to: 'അവരോട് ഞാൻ മറുപടി പറഞ്ഞു: കുറ്റം ചുമത്തപ്പെട്ട വ്യക്തിക്ക് തന്റെ ആരോപകരെ നേരിട്ട് അഭിമുഖീകരിക്കാനും കുറ്റാരോപണത്തെക്കുറിച്ച് പ്രതിവാദം നടത്താൻ അവസരം ലഭിക്കാനും മുമ്പ്, ഏതെങ്കിലും വ്യക്തിയെ[b] വിട്ടുകൊടുക്കുന്നത്[a] റോമാക്കാരുടെ പതിവല്ല.'
