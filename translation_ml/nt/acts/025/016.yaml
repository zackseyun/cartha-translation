id: ACT.25.16
reference: Acts 25:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: ml
  text: 'അവരോട് ഞാൻ മറുപടി പറഞ്ഞു: കുറ്റം ചുമത്തപ്പെട്ട വ്യക്തിക്ക് തന്റെ ആരോപകരെ നേരിട്ട് അഭിമുഖീകരിക്കാനും കുറ്റാരോപണത്തെക്കുറിച്ച് പ്രതിവാദം നടത്താൻ അവസരം ലഭിക്കാനും മുമ്പ്, ഏതെങ്കിലും വ്യക്തിയെ[b] വിട്ടുകൊടുക്കുന്നത്[a] റോമാക്കാരുടെ പതിവല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാളെ അനുകൂല്യമായി വിട്ടുകൊടുക്കുന്നത്’; ഗ്രീക്ക് ക്രിയയ്ക്ക് ആരോപകരുടെ അഭ്യർഥന നിറവേറ്റാനായി ഒരാളെ വിട്ടുകൊടുക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഏതെങ്കിലും മനുഷ്യനെ’; ഈ നിയമസന്ദർഭത്തിൽ പ്രയോഗം പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: പതിവ്
  rationale: സ്ഥാപിതമായ ആചാരമോ നടപടിക്രമമോ സൂചിപ്പിക്കുന്നു; നിയമ-ഭരണസന്ദർഭത്തിൽ ‘പതിവ്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: Ῥωμαίοις
  choice: റോമാക്കാരുടെ
  rationale: ദാതൃവിഭക്തി ഇവിടെ റോമാക്കാരുടെ നിയമപരമായ പതിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഉടമസ്ഥരൂപം സ്വാഭാവികമാണ്.
- source_word: χαρίζεσθαί
  choice: അവരുടെ ആവശ്യപ്രകാരം വിട്ടുകൊടുക്കുന്നത്
  rationale: ആരോപകരുടെ അഭ്യർഥന നിറവേറ്റുന്ന അനുകൂല്യമായി ഒരാളെ ഏല്പിക്കുന്ന അർഥഭാവം ക്രിയയ്ക്കുണ്ട്; ‘വിട്ടുകൊടുക്കുക’ നിയമപരമായ കൈമാറ്റം വ്യക്തമാക്കുന്നു, ‘അവരുടെ ആവശ്യപ്രകാരം’ അനുകൂല്യഭാവം നിലനിർത്തുന്നു.
- source_word: τινα ἄνθρωπον
  choice: ഒരാളെ
  rationale: ഈ നിയമസന്ദർഭത്തിൽ പ്രയോഗം പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഒരാളെ’ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമാണ്.
- source_word: ὁ κατηγορούμενος
  choice: കുറ്റാരോപിതൻ
  rationale: കുറ്റം ആരോപിക്കപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമായ പദം.
- source_word: κατὰ πρόσωπον
  choice: മുഖാമുഖം
  rationale: നേരിട്ടുള്ള വ്യക്തിപരമായ അഭിമുഖീകരണം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τόπον ... ἀπολογίας
  choice: പ്രതിവാദം നടത്താൻ അവസരം
  rationale: τόπος ഇവിടെ ഭൗതികസ്ഥലമല്ല, അവസരമാണ്; ἀπολογία നിയമപരമായ പ്രതിരോധവാദത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγκλήματος
  choice: ആരോപിക്കപ്പെട്ട കുറ്റം
  rationale: നിയമപരമായ കുറ്റാരോപണം എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ‘കുറ്റം’ മാത്രം ഉപയോഗിക്കുന്നതിലൂടെ കുറ്റം തെളിഞ്ഞുവെന്ന ധ്വനി വരാതിരിക്കാൻ ‘ആരോപിക്കപ്പെട്ട’ ചേർത്തു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് നിയമവാക്യത്തിന്റെ ക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
