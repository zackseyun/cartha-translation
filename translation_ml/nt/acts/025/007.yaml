source:
  edition: SBLGNT
  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: ml
  text: അവൻ എത്തിയപ്പോൾ, യെരൂശലേമിൽനിന്ന് ഇറങ്ങിവന്ന യെഹൂദന്മാർ[b] അവനെ ചുറ്റിനിന്നു[a]; അവർ തെളിയിക്കാൻ കഴിയാത്ത അനേകം ഗുരുതരമായ കുറ്റാരോപണങ്ങൾ അവന്റെമേൽ ഉന്നയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവനെ വളഞ്ഞുനിന്നു.’ ഗ്രീക്ക് ക്രിയ ഒരാളുടെ ചുറ്റും നിൽക്കുന്നതിന് ഊന്നൽ നൽകാം; നിയമസന്ദർഭത്തിൽ ഈ നിലപാട് സമ്മർദം ചെലുത്തുന്നതിന്റെ സൂചനയും നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘യെരൂശലേമിൽനിന്ന് ഇറങ്ങിവന്ന യെഹൂദ്യർ.’ ഇവിടെ പരാമർശിക്കുന്നത് യെഹൂദ്യയിലെ നിവാസികളെ മാത്രമല്ല, യെരൂശലേമിൽനിന്നുള്ള യെഹൂദ കുറ്റാരോപകരെയാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘യെഹൂദന്മാർ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: അവൻ എത്തിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഇവിടെ സമയസാഹചര്യം സൂചിപ്പിക്കുന്നു. സംഭവക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιέστησαν αὐτὸν
  choice: അവനെ ചുറ്റിനിന്ന്
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ഒരാളെ ചുറ്റി നിൽക്കുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; സന്ദർഭം സൂചിപ്പിക്കുന്നതിലധികം ശത്രുത പദത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: യെരൂശലേമിൽനിന്ന് ഇറങ്ങിവന്ന യെഹൂദന്മാർ
  rationale: καταβεβηκότες എന്ന ഭൂമിശാസ്ത്രപരമായ ‘ഇറങ്ങിവരൽ’ നിലനിർത്തുന്നു. Ἰουδαῖοι ഇവിടെ യെരൂശലേമിൽനിന്നുള്ള യെഹൂദ കുറ്റാരോപകരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യെഹൂദന്മാർ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: ഗൗരവമേറിയ അനേകം കുറ്റങ്ങൾ
  rationale: αἰτιώματα ഔപചാരികമായ കുറ്റാരോപണങ്ങളെയും βαρέα അവയുടെ ഗൗരവത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ നിയമസന്ദർഭത്തിന് യോജിച്ച പ്രയോഗമാണിത്.
- source_word: καταφέροντες
  choice: അവന്റെമേൽ ചുമത്തി
  rationale: നിയമസന്ദർഭത്തിൽ ഒരാൾക്കെതിരെ കുറ്റങ്ങൾ ഉന്നയിക്കുക എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; ഗ്രീക്കിൽ സന്ദർഭത്തിൽ അന്തർലീനമായ ലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി വ്യക്തമാക്കുന്നു.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: തെളിയിക്കാൻ അവർക്കു കഴിയാത്ത
  rationale: ἰσχύωയും ഇൻഫിനിറ്റീവും കഴിവിനെ സൂചിപ്പിക്കുന്നു; ἀποδεῖξαι എന്നത് തെളിയിക്കുക എന്ന നിയമസന്ദർഭാർഥത്തിൽ നൽകി. ഇംപർഫെക്റ്റിലെ തുടർച്ചയായ അസമർഥത മലയാളത്തിൽ ലളിതവും വ്യക്തവുമായി അറിയിക്കുന്നു.
