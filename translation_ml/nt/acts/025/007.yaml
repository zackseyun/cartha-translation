translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമസന്ദർഭഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചയായ പ്രവൃത്തികൾ മലയാളത്തിൽ സുതാര്യമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു; യാതൊരു വിഭാഗീയ വ്യാഖ്യാനവും ചേർത്തിട്ടില്ല.
