id: ACT.5.3
reference: Acts 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് പറഞ്ഞു: “അനന്യാസേ, പരിശുദ്ധാത്മാവിനോടു കള്ളം പറയാനും[a] നിലത്തിന്റെ[c] വിലയിൽനിന്ന് ഒരു ഭാഗം ഒളിച്ചുവെക്കാനും[b] സാത്താൻ നിന്റെ ഹൃദയം നിറച്ചത് എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിനെ വഞ്ചിക്കാനും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളോടു കള്ളം പറയുക എന്ന അർഥം വരാം; ഈ സന്ദർഭത്തിൽ അതാണ് കൂടുതൽ നേരിട്ടുള്ള അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിൽപ്പനത്തുകയിൽനിന്ന് ഒരു ഭാഗം മാറ്റിവെക്കാനും.’
    reason: lexical_alternative
  - marker: c
    text: ‘നിലം’ എന്നത് ‘സ്വത്ത്’ എന്നോ ‘വയൽ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: എന്നാൽ പത്രോസ് പറഞ്ഞു
  rationale: δέ ഇവിടെ നേരിയ വിരുദ്ധമാറ്റം സൂചിപ്പിക്കുന്നു; അനന്യാസിന്റെ പ്രവൃത്തിയോടുള്ള പത്രോസിന്റെ നേരിട്ടുള്ള പ്രതികരണത്തിലേക്ക് സ്വാഭാവികമായി കടക്കാൻ ‘എന്നാൽ’ യോജിക്കുന്നു.
- source_word: διὰ τί
  choice: എന്തിന്
  rationale: കാരണത്തെ ചോദിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: സാത്താൻ നിന്റെ ഹൃദയം നിറച്ചത്
  rationale: മൂലത്തിലെ രൂപകവും സാത്താനെ ക്രിയയുടെ കർത്താവായി അവതരിപ്പിക്കുന്ന ഘടനയും നിലനിർത്തുന്നു; പൂർണമായ അധീനതയോ നിർബന്ധമോ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവിനോടു കള്ളം പറയാനും
  rationale: ψεύδομαι എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ നേരിട്ടുള്ള അർഥവും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കർമബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: νοσφίσασθαι
  choice: ഒരു ഭാഗം ഒളിച്ചുവെക്കാനും
  rationale: വിൽപ്പനവിലയുടെ ഒരു ഭാഗം രഹസ്യമായി തനിക്കായി പിടിച്ചുവെച്ച പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; ‘അപഹരിക്കുക’ പോലുള്ള കൂടുതൽ സാങ്കേതികമോ കടുപ്പമുള്ളതോ ആയ പദം ഒഴിവാക്കുന്നു.
- source_word: ἀπὸ τῆς τιμῆς
  choice: വിലയിൽനിന്ന് ഒരു ഭാഗം
  rationale: ἀπό സഹിതമുള്ള ഷഷ്ഠീവിഭക്തി ഒരു മുഴുവൻ തുകയിൽനിന്നുള്ള ഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘വില’ τιμήയുടെ അടുത്ത മലയാളസമാനമാണ്.
- source_word: τοῦ χωρίου
  choice: നിലത്തിന്റെ
  rationale: χωρίον ഇവിടെ സ്ഥലം, ഭൂമി, സ്വത്ത്, വയൽ എന്നിവ സൂചിപ്പിക്കാം; വിൽക്കപ്പെട്ട ഭൂവസ്തുവിന് ‘നിലം’ സ്വാഭാവികവും അതിയായി പരിമിതപ്പെടുത്താത്തതുമായ പദമാണ്.
theological_decisions:
- issue: അനന്യാസിന്റെ ഹൃദയം സാത്താൻ നിറച്ചതിലെ പ്രവർത്തകത്വം
  choice: ‘സാത്താൻ നിന്റെ ഹൃദയം നിറച്ചത്’ എന്ന മൂലരൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘സാത്താൻ നിന്നെ നിയന്ത്രിച്ചത്’ അല്ലെങ്കിൽ ‘സാത്താൻ നിന്റെ ഹൃദയം നിറയ്ക്കാൻ നീ അനുവദിച്ചത്’.
  rationale: ഗ്രീക്കിൽ സാത്താനാണ് ‘നിറച്ചു’ എന്ന ക്രിയയുടെ കർത്താവ്; അതേസമയം സന്ദർഭം അനന്യാസിന്റെ ധാർമിക ഉത്തരവാദിത്വവും നിലനിർത്തുന്നു. വിവർത്തനം ഭൂതാധീനതയോ നിർബന്ധമോ ചേർത്ത് ഈ സംഘർഷം പരിഹരിക്കുന്നില്ല.
- issue: പരിശുദ്ധാത്മാവിനോടു കള്ളം പറയുക എന്ന വ്യക്തിപരമായ പരാമർശം
  choice: ‘പരിശുദ്ധാത്മാവിനോടു കള്ളം പറയുക’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘പരിശുദ്ധാത്മാവിനെ വഞ്ചിക്കുക’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിന്റെ സന്നിധിയിൽ കള്ളം പറയുക’.
  rationale: മൂലത്തിലെ നേരിട്ടുള്ള വ്യക്തിപരമായ ബന്ധം നിലനിർത്തുകയും വ്യാഖ്യാനപരമായ ദൈവശാസ്ത്ര വിശദീകരണം വാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ‘ഹൃദയം നിറച്ചു’ എന്ന സെമിറ്റിക്-ഗ്രീക്ക് രൂപകം ആശയവ്യാഖ്യാനത്തിലൂടെ മാറ്റാതെ നിലനിർത്തി. ‘ഒളിച്ചുവെക്കുക’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ νοσφίζομαι എന്നതിലെ രഹസ്യമായി ഭാഗം പിടിച്ചുവെക്കൽ എന്ന ഭാവവും പകരുന്നു.
