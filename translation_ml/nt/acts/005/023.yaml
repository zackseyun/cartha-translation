id: ACT.5.23
reference: Acts 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸀Τὸ δεσμωτήριον εὕρομεν κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ καὶ τοὺς φύλακας ἑστῶτας ⸀ἐπὶ τῶν θυρῶν, ἀνοίξαντες δὲ ἔσω οὐδένα εὕρομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “കാരാഗൃഹം പൂർണസുരക്ഷയോടെ പൂട്ടിയിരിക്കുന്നതായും കാവൽക്കാർ വാതിലുകൾക്കരികെ നിൽക്കുന്നതായും ഞങ്ങൾ കണ്ടു; എന്നാൽ തുറന്നപ്പോൾ അകത്ത് ആരെയും കണ്ടില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμωτήριον
  choice: കാരാഗൃഹം
  rationale: തടവിൽ പാർപ്പിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: പൂർണസുരക്ഷയോടെ പൂട്ടിയിരിക്കുന്നതായി
  rationale: κεκλεισμένον സൂചിപ്പിക്കുന്ന പൂട്ടപ്പെട്ട നിലയും ἐν πάσῃ ἀσφαλείᾳ നൽകുന്ന പൂർണസുരക്ഷയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: φύλακας ἑστῶτας
  choice: കാവൽക്കാർ നിൽക്കുന്നതായി
  rationale: കാവൽക്കാരുടെ സ്ഥാനത്തുള്ള ദൃശ്യാവസ്ഥ നേരിട്ട് നിലനിർത്തുന്നു; ഔദ്യോഗികമായി നിയോഗിച്ചു എന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τῶν θυρῶν
  choice: വാതിലുകൾക്കരികെ
  rationale: വാതിലുകളുടെ സമീപസ്ഥാനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνοίξαντες
  choice: തുറന്നപ്പോൾ
  rationale: മുൻ ക്രിയയ്ക്കു ശേഷമുള്ള സമയബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമായ കർമം ഇല്ലാത്തതിനാൽ അത് അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἔσω
  choice: അകത്ത്
  rationale: കാരാഗൃഹത്തിന്റെ ഉൾഭാഗത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: οὐδένα
  choice: ആരെയും … ഇല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക അനിശ്ചിത സർവനാമത്തെ സ്വാഭാവിക മലയാള നിഷേധഘടനയിൽ നൽകുന്നു.
- source_word: λέγοντες ὅτι
  choice: 'അവർ പറഞ്ഞു:'
  rationale: മുൻ വാക്യത്തിലെ ഉദ്യോഗസ്ഥരുടെ റിപ്പോർട്ടുമായി ബന്ധം നിലനിർത്തിക്കൊണ്ട് നേരിട്ടുള്ള സംഭാഷണം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, കഥനത്തിന് യോജിച്ച മാന്യമായ മലയാളം. ഗ്രീക്കിലെ പൂർണസുരക്ഷയുടെ ഊന്നൽ മുഖ്യവാചകത്തിൽ തന്നെ നിലനിർത്തിയതിനാൽ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
