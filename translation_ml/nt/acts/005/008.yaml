  to: 'എന്നാൽ പത്രോസ് അവളോടു മറുപടി പറഞ്ഞു: “എന്നോടു പറയൂ, നീ ആ ഭൂമി[a] വിറ്റത് ഇത്രയ്ക്കാണോ?” അവൾ പറഞ്ഞു: “അതെ, ഇത്രയ്ക്കു.”'
