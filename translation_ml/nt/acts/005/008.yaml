id: ACT.5.8
reference: Acts 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂πρὸς αὐτὴν⸃ ⸀Πέτρος· Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν· Ναί, τοσούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് അവളോടു മറുപടി പറഞ്ഞു: “എന്നോടു പറയൂ, നീ ആ ഭൂമി[a] വിറ്റത് ഇത്രയ്ക്കാണോ?” അവൾ പറഞ്ഞു: “അതെ, ഇത്രയ്ക്കു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ സ്ഥലം,” “ആ വയൽ,” അല്ലെങ്കിൽ “ആ സ്വത്ത്.”
    reason: χωρίον എന്ന ഗ്രീക്ക് പദത്തിന്റെ പ്രസക്തമായ അർഥവികല്പങ്ങൾ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: എന്നാൽ പത്രോസ് അവളോടു ചോദിച്ചു
  rationale: δέ ആഖ്യാനത്തിലെ വഴിത്തിരിവ് സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. ἀπεκρίθη എന്നത് രൂപപരമായി ‘മറുപടി പറഞ്ഞു’ എന്നാണെങ്കിലും, ഇവിടെ പിന്നാലെ ഒരു ചോദ്യം വരുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു വിവർത്തനം ചെയ്തു; πρὸς αὐτήν ‘അവളോട്’ ആയി നിലനിർത്തി.
- source_word: Εἰπέ μοι
  choice: എന്നോടു പറയൂ
  rationale: λέγω എന്ന ക്രിയയുടെ ആജ്ഞാരൂപവും μοι എന്ന ദത്തിവിഭക്തി സർവനാമവും നേരിട്ട്, സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰ ... ἀπέδοσθε
  choice: വിറ്റത് ... ആണോ?
  rationale: εἰ ഇവിടെ ഉവ്വ്/ഇല്ല എന്ന ഉത്തരമാവശ്യപ്പെടുന്ന പരോക്ഷചോദ്യത്തെ അവതരിപ്പിക്കുന്നു. ἀποδίδωμι വാണിജ്യസന്ദർഭത്തിൽ ‘വിൽക്കുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: τοσούτου
  choice: ഇത്രയ്ക്കുതന്നെ
  rationale: മുമ്പ് പറഞ്ഞ തുകയിലേക്കുള്ള സൂചനയും ചോദ്യം ഉന്നയിക്കുന്ന കൃത്യമായ തുകയെന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മറുപടിയിലും അതേ പദപ്രയോഗം ആവർത്തിച്ചു.
- source_word: τὸ χωρίον
  choice: ആ സ്ഥലം
  rationale: χωρίον എന്നത് സ്ഥലം, ഭൂമി, വയൽ, സ്വത്ത് എന്നിങ്ങനെ അർഥമാക്കാം. സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച ഭൂസ്വത്തിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ സ്ഥലം’ സ്വാഭാവികവും അമിതവ്യക്തീകരണം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: Ναί
  choice: അതെ
  rationale: ലളിതമായ സമ്മതോത്തരം ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഏകവചനത്തിലുള്ള സഫീരയോടുള്ള സംഭാഷണമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആദരസൂചക പ്രയോഗമായി ‘നിങ്ങൾ’ ഉപയോഗിച്ചു. ചോദ്യത്തിലും മറുപടിയിലും τοσούτου എന്ന പദത്തിന്റെ ആവർത്തനം സൂക്ഷിച്ചു.
