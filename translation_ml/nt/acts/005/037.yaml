reference: Acts 5:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: ml
  text: ഇതിനുശേഷം, ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ കാലത്ത് ഗലീലക്കാരനായ യൂദാ രംഗത്തുവന്നു; ആളുകളെ തന്റെ പിന്നാലെ വരാൻ പ്രേരിപ്പിച്ചു.[a] അവനും നശിച്ചുപോയി; അവനാൽ ബോധ്യപ്പെട്ടവരെല്ലാം ചിതറിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആളുകളെ അവരുടെ മുൻകൂറോ ബന്ധമോ വിട്ട് തന്റെ പിന്നാലെ വരുത്തി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ആളുകളെ അകറ്റിക്കൊണ്ടുപോകുക, അല്ലെങ്കിൽ മുൻകൂറിൽനിന്ന് പിന്തിരിപ്പിക്കുക എന്ന അർഥവും ഉണ്ടാകാം. ‘ജനസംഖ്യാ കണക്കെടുപ്പ്’ എന്നതിനുള്ള ഗ്രീക്ക് പദത്തിന് ഔദ്യോഗിക രജിസ്ട്രേഷൻ എന്ന അർഥവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: ഇവനുശേഷം
  rationale: μετά + accusative ഇവിടെ മുൻപ് പരാമർശിച്ച വ്യക്തിക്കോ സംഭവത്തിനോ ശേഷമുള്ള കാലക്രമം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇവനുശേഷം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἀνέστη
  choice: എഴുന്നേറ്റ്
  rationale: ഇവിടെ പുനരുത്ഥാനമല്ല, ഒരു നേതാവ് രംഗത്തുവരുന്നതാണ് അർഥം. ‘എഴുന്നേറ്റ്’ ഗ്രീക്കിലെ സജീവമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: ഗലീലക്കാരനായ യൂദാ
  rationale: വ്യക്തിനാമത്തോടുകൂടിയ പ്രദേശിക വിശേഷണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: ജനസംഖ്യാ രജിസ്ട്രേഷന്റെ കാലത്ത്
  rationale: ἀπογραφή ഔദ്യോഗിക രജിസ്ട്രേഷനെയോ ജനസംഖ്യാ കണക്കെടുപ്പിനെയോ സൂചിപ്പിക്കാം. ഈ പ്രയോഗം രണ്ടിന്റെയും ആശയം ഉൾക്കൊള്ളുകയും ആധുനിക വായനക്കാർക്ക് വ്യക്തമാകുകയും ചെയ്യുന്നു.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: ആളുകളെ തന്നോടൊപ്പം ചേർത്തു
  rationale: ἀφίστημι ഇവിടെ മുൻബന്ധത്തിൽനിന്ന് ആളുകളെ അകറ്റി തന്റെ പക്ഷത്താക്കുക എന്ന കാരണാർഥം വഹിക്കുന്നു. ‘തന്നോടൊപ്പം ചേർത്തു’ അനുയായികളാക്കിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; കലാപമെന്ന അധിക രാഷ്ട്രീയ നിർവചനം ചേർക്കുന്നില്ല.
- source_word: λαὸν
  choice: ആളുകളെ
  rationale: നിശ്ചയാർഥക ഉപപദമില്ലാത്ത കൂട്ടവാചകമായ λαός മുഴുവൻ ജനതയെയല്ല, കുറെ ആളുകളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: κἀκεῖνος
  choice: അവനും
  rationale: ‘ആ വ്യക്തിയും’ എന്ന തുടർച്ചയും ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀπώλετο
  choice: നശിച്ചുപോയി
  rationale: മരണത്തിലോ നാശത്തിലോ എത്തി എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; എങ്ങനെ മരിച്ചു എന്ന് മൂലപാഠം പറയാത്തതിനാൽ ‘കൊല്ലപ്പെട്ടു’ എന്നു വ്യക്തമാക്കുന്നില്ല.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: അവന്റെ വാക്കു കേട്ട എല്ലാവരും
  rationale: πείθω ഇവിടെ അവനാൽ ബോധ്യപ്പെട്ടു അവനെ അംഗീകരിച്ചവരെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം കേവല ശ്രവണത്തേക്കാൾ അവന്റെ സ്വാധീനത്തിന് വഴങ്ങിയെന്ന ആശയം സന്ദർഭത്തിൽ നൽകുന്നു.
- source_word: διεσκορπίσθησαν
  choice: ചിതറിപ്പോയി
  rationale: διασκορπίζω എന്നതിന്റെ അക്രിയാത്മക ഫലം കൃത്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യൂദായുടെ പ്രസ്ഥാനത്തിന്റെ ചരിത്ര-രാഷ്ട്രീയ സ്വഭാവം
  choice: യൂദാ ആളുകളെ തന്റെ പക്ഷത്താക്കി എന്ന നിലയിൽ മാത്രം വിവരണം നൽകി.
  alternative: ‘കലാപം നയിച്ചു’ അല്ലെങ്കിൽ ‘ജനങ്ങളെ വിപ്ലവത്തിലേക്കു നയിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ചരിത്രപരമായി ഈ പ്രസ്ഥാനത്തിന് കലാപസ്വഭാവമുണ്ടായിരുന്നെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് കലാപത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തമായ നാമപദം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ മൂലപാഠം അനുവദിക്കുന്നതിലധികം രാഷ്ട്രീയ വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ജനസംഖ്യാ രജിസ്ട്രേഷൻ’ ഔദ്യോഗിക രജിസ്ട്രേഷനും സെൻസസും ഉൾക്കൊള്ളുന്ന വിധം തിരഞ്ഞെടുത്തു. കലാപമെന്ന ആശയം മൂലപാഠത്തേക്കാൾ ശക്തമായി ചേർത്തിട്ടില്ല.
