revisions:
- from: ഇവനുശേഷം, ജനസംഖ്യാ രജിസ്ട്രേഷന്റെ കാലത്ത് ഗലീലക്കാരനായ യൂദാ എഴുന്നേറ്റ് ആളുകളെ തന്നോടൊപ്പം ചേർത്തു.[a] അവനും നശിച്ചുപോയി; അവന്റെ വാക്കു കേട്ട എല്ലാവരും ചിതറിപ്പോയി.
  to: ഇതിനുശേഷം, ജനസംഖ്യാ കണക്കെടുപ്പിന്റെ കാലത്ത് ഗലീലക്കാരനായ യൂദാ രംഗത്തുവന്നു; ആളുകളെ തന്റെ പിന്നാലെ വരാൻ പ്രേരിപ്പിച്ചു.[a] അവനും നശിച്ചുപോയി; അവനാൽ ബോധ്യപ്പെട്ടവരെല്ലാം ചിതറിപ്പോയി.
