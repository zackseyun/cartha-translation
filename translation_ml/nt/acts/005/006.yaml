lexical_decisions:
- source_word: ἀναστάντες
  choice: എഴുന്നേറ്റ്
  rationale: പ്രവർത്തിക്കാൻ എഴുന്നേൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന participle; മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമം നിലനിർത്തുന്നു.
- source_word: δὲ
