- source_word: συνέστειλαν
  choice: അവനെ പൊതിഞ്ഞു
  rationale: ശരീരം പുറത്തേക്കു കൊണ്ടുപോകുന്നതിനും അടക്കുന്നതിനുമായി പൊതിഞ്ഞ പ്രവൃത്തിയെ ലളിതമായും സന്ദർഭോചിതമായും അവതരിപ്പിക്കുന്നു; ‘ശവസംസ്കാരത്തിനായി ഒരുക്കി’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: അനന്യാസിനെ സൂചിപ്പിക്കുന്ന കർമസർവനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἐξενέγκαντες
  choice: പുറത്തേക്കു കൊണ്ടുപോയി
  rationale: ἐκφέρω ഇവിടെ ശരീരം സ്ഥലത്തുനിന്ന് പുറത്തേക്കു കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἔθαψαν
  choice: അടക്കം ചെയ്തു
  rationale: θάπτω എന്നതിന്റെ വ്യക്തവും സാധാരണവുമായ മലയാള തുല്യപ്രയോഗം.
