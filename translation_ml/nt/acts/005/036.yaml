  to: കാരണം, ഈ കാലത്തിനുമുമ്പ് തേവുദാസ് രംഗത്തുവന്ന്, താൻ പ്രധാനപ്പെട്ട ഒരാളാണെന്ന് അവകാശപ്പെട്ടു[a]. ഏകദേശം നാനൂറു പുരുഷന്മാർ അവനോടു ചേർന്നു[b]. അവൻ കൊല്ലപ്പെട്ടു; അവനാൽ ബോധ്യപ്പെട്ട എല്ലാവരും[c] ചിതറിപ്പോവുകയും ഒന്നുമാകാതെ പോവുകയും ചെയ്തു.
  rationale: മൂലഗ്രീക്കിലെ സാധാരണ തുടർച്ചയായ καί നിലനിർത്താൻ ‘എന്നാൽ’ ഒഴിവാക്കി. സ്വയം പ്രാധാന്യവാദം, പുരുഷലിംഗസൂചന, കർമണിയിലെ കൊല്ലപ്പെടൽ, πείθωയുടെ persuasion-ഭാവം, പ്രസ്ഥാനത്തിന്റെ നിഷ്ഫലപര്യവസാനം എന്നിവ നിലനിർത്തിക്കൊണ്ട് വാചകം കൂടുതൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിലാക്കി. ചരിത്രപരമായ തേവുദാസ്-പരാമർശത്തെക്കുറിച്ച് വ്യാഖ്യാനമോ സമന്വയമോ ചേർത്തിട്ടില്ല.
