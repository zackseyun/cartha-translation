id: ACT.5.36
reference: Acts 5:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: ml
  text: കാരണം, ഈ കാലത്തിനുമുമ്പ് തേവുദാസ് രംഗത്തുവന്ന്, താൻ പ്രധാനപ്പെട്ട ഒരാളാണെന്ന് അവകാശപ്പെട്ടു[a]. ഏകദേശം നാനൂറു പുരുഷന്മാർ അവനോടു ചേർന്നു[b]. അവൻ കൊല്ലപ്പെട്ടു; അവനാൽ ബോധ്യപ്പെട്ട എല്ലാവരും[c] ചിതറിപ്പോവുകയും ഒന്നുമാകാതെ പോവുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘താൻ ആരോ ആണെന്ന് പറഞ്ഞു.’ സ്വയം പ്രാധാന്യമുള്ള ഒരാളായി അവതരിപ്പിച്ചു എന്നാണ് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘അവനോടു പറ്റിച്ചേർന്നു’; ‘അവന്റെ പക്ഷം ചേർന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘അവനെ പിന്തുടർന്ന എല്ലാവരും.’ കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവനാൽ ബോധ്യപ്പെട്ട എല്ലാവരും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: കാരണം, ഈ കാലത്തിനുമുമ്പ്
  rationale: πρό കാലപരമായ മുൻഗണനയും γάρ ഗമാലിയേലിന്റെ വിശദീകരണാത്മക വാദബന്ധവും സൂചിപ്പിക്കുന്നു. വാക്കുതോറുമുള്ള ‘ഈ ദിവസങ്ങൾക്കുമുമ്പ്’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ‘ഈ കാലത്തിനുമുമ്പ്’ സ്വാഭാവികമാണ്.
- source_word: ἀνέστη
  choice: രംഗത്തുവന്ന്
  rationale: ഇവിടെ ഒരു നേതാവായി പ്രത്യക്ഷപ്പെടുകയോ ഒരു പ്രസ്ഥാനം ആരംഭിക്കുകയോ ചെയ്യുന്നതാണ് അർഥം; ശാരീരികമായി എഴുന്നേൽക്കുന്നതോ പുനരുത്ഥാനമോ അല്ല.
- source_word: Θευδᾶς
  choice: തേവുദാസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: താൻ ഏതോ വലിയ ആളാണെന്ന് അവകാശപ്പെട്ടു
  rationale: τινα ἑαυτόν എന്ന പ്രയോഗം സ്വയം പ്രാധാന്യമുള്ള ഒരാളായി അവതരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വലിയ ആൾ’ എന്നത് ആ പ്രയോഗത്തിന്റെ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ᾧ προσεκλίθη
  choice: അവനോടു ചേർന്നു
  rationale: ആളുകൾ ഒരു നേതാവിന്റെ പക്ഷം ചേർന്ന് അവനുമായി ബന്ധപ്പെടുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം; ഈ അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: ഏകദേശം നാനൂറു പുരുഷന്മാർ
  rationale: ὡς ഏകദേശസംഖ്യ സൂചിപ്പിക്കുന്നു; ἀνδρῶν പുരുഷന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: ὃς ἀνῃρέθη
  choice: അവൻ കൊല്ലപ്പെട്ടു
  rationale: ἀναιρέω ഇവിടെ കൊല്ലുക എന്ന അർഥത്തിലാണ്; കർമണി പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: അവനാൽ സമ്മതിപ്പിക്കപ്പെട്ട എല്ലാവരും
  rationale: അവന്റെ വാക്കിനാൽ സ്വാധീനിക്കപ്പെട്ട് അവന്റെ പക്ഷത്തായവരെ πείθω സൂചിപ്പിക്കുന്നു. ‘പിന്തുടർന്നവർ’ എന്ന ലളിതീകരണത്തേക്കാൾ മൂലത്തിലെ persuasion ഭാവം ഇത് നിലനിർത്തുന്നു.
- source_word: διελύθησαν
  choice: ചിതറിപ്പോകുകയും
  rationale: പ്രസ്ഥാനം പിരിഞ്ഞുപോയതും അനുയായികൾ ചിതറിയതും സൂചിപ്പിക്കുന്നു.
- source_word: ἐγένοντο εἰς οὐδέν
  choice: ഒന്നുമല്ലാതായിത്തീരുകയും ചെയ്തു
  rationale: പരാജയപ്പെട്ട് ഫലമില്ലാതാകുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ രൂപകഭാവം നിലനിർത്തി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഗമാലിയേലിന്റെ പ്രസംഗത്തിലെ തേവുദാസിനെക്കുറിച്ചുള്ള ചരിത്രപരാമർശം
  choice: ഗമാലിയേലിന്റെ വാദത്തിന്റെ ഭാഗമായി പ്രസ്താവനയെ ഗ്രീക്കിലുള്ളതുപോലെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ചരിത്രപരമായ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന വാക്കുകൾ ചേർക്കുക, അല്ലെങ്കിൽ ബാഹ്യമായ ചരിത്രപുനർനിർമാണങ്ങളുമായി പൊരുത്തപ്പെടുത്താൻ വാചകം മാറ്റുക.
  rationale: വാക്യം ഗമാലിയേൽ ഉദ്ധരിക്കുന്ന ഉദാഹരണം രേഖപ്പെടുത്തുന്നു. പരിഭാഷയിൽ ചരിത്രവിധിയോ സമന്വയശ്രമമോ ചേർക്കാതെ മൂലപാഠത്തിന്റെ പ്രസ്താവനയും അതിലുള്ള സാധ്യതയുള്ള സംഘർഷവും നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘രംഗത്തുവന്ന്’ എന്നത് ἀνέστηയുടെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘വലിയ ആൾ’ എന്ന പ്രയോഗം സംസാരഭാഷയോട് അടുത്തതാണെങ്കിലും ഇവിടെ സ്വയം പ്രാധാന്യം അവകാശപ്പെടുന്നതിനെ വ്യക്തവും മാന്യവുമായി അറിയിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
