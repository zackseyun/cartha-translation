translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. സഭാസന്ദർഭത്തിലെ ഔപചാരിക സംബോധനയ്ക്കായി ‘ഇസ്രായേൽപുരുഷന്മാരേ’ എന്നും, മുന്നറിയിപ്പിന്റെ ഗൗരവം നിലനിർത്താൻ ‘സ്വയം സൂക്ഷിച്ചുകൊള്ളുവിൻ’ എന്നും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
