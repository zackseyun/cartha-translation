id: ACT.5.35
reference: Acts 5:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഇസ്രായേൽ പുരുഷന്മാരേ, ഈ മനുഷ്യരുടെ കാര്യത്തിൽ നിങ്ങൾ ചെയ്യാൻ പോകുന്നതിനെക്കുറിച്ച് ജാഗ്രത പാലിക്കുവിൻ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഈ മനുഷ്യരെക്കുറിച്ച് നിങ്ങൾ എന്തു ചെയ്യാൻ പോകുന്നു എന്നതിൽ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുവിൻ.”'
    reason: προσέχετε ἑαυτοῖς എന്ന ആത്മവാചക ജാഗ്രതാസൂചനയും ἐπὶ τοῖς ἀνθρώποις τούτοις എന്നതിന്റെ ‘ഈ മനുഷ്യരെക്കുറിച്ച്’ എന്ന ഔപചാരിക സാധ്യതയും പ്രതിഫലിപ്പിക്കുന്ന കൂടുതൽ അക്ഷരാനുസൃതമായ പകരം വിവർത്തനം.
lexical_decisions:
- source_word: εἶπέν τε
  choice: അവൻ ... പറഞ്ഞു
  rationale: τέ മുൻവിവരണത്തോടുള്ള ലഘുവായ ബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ തുടർച്ചയിൽ പ്രത്യേക നിഗമനമോ ശക്തമായ കാലക്രമമോ ചേർക്കാതെ ലളിതമായ ആഖ്യാനരൂപം സ്വാഭാവികമാണ്.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: λέγω-യോടുകൂടിയ πρός + accusative ആരോടാണ് സംസാരിച്ചതെന്ന് സൂചിപ്പിക്കുന്നു; ‘അവരോടു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ഇസ്രായേൽപുരുഷന്മാരേ
  rationale: പുരുഷലിംഗത്തിലുള്ള ഔപചാരിക സംബോധന നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ രൂപമാണിത്.
- source_word: προσέχετε ἑαυτοῖς
  choice: സ്വയം സൂക്ഷിച്ചുകൊള്ളുവിൻ
  rationale: ആജ്ഞയുടെ ജാഗ്രതാഭാവവും ἑαυτοῖς എന്ന ആത്മവാചക സൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: ഈ മനുഷ്യരോട്
  rationale: പരിഗണനയിലുള്ള ആളുകളോടുള്ള നടപടിയെയാണ് ഇവിടെ ἐπί സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഉള്ളതിലധികം ശത്രുത ‘എതിരായി’ എന്ന പദത്തിലൂടെ ചേർക്കാതെ പ്രായോഗിക ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: τί μέλλετε πράσσειν
  choice: നിങ്ങൾ ചെയ്യാൻ പോകുന്ന കാര്യത്തിൽ
  rationale: μέλλω + infinitive സമീപഭാവിയിലുള്ള ഉദ്ദേശിച്ച നടപടിയെ സൂചിപ്പിക്കുന്നു; ഈ വിവർത്തനം ഭാവിസൂചനയും മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
