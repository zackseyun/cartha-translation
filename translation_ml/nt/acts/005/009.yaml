id: ACT.5.9
reference: Acts 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് അവളോടു പറഞ്ഞു: “കർത്താവിന്റെ ആത്മാവിനെ പരീക്ഷിക്കാൻ നിങ്ങൾ തമ്മിൽ യോജിച്ചത് എന്തിന്? ഇതാ, നിന്റെ ഭർത്താവിനെ അടക്കംചെയ്തവരുടെ കാലുകൾ വാതിൽക്കലുണ്ട്; അവർ നിന്നെയും പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോകും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεφωνήθη ὑμῖν
  choice: നിങ്ങൾ രണ്ടുപേരും ഒരുമിച്ചു ധാരണയിലെത്തിയത്
  rationale: സന്ദർഭത്തിൽ സഫീറയും ഭർത്താവും തമ്മിലുള്ള പരസ്പരസമ്മതമാണ് സൂചിപ്പിക്കുന്നത്. ‘ഗൂഢാലോചന നടത്തി’ എന്നു പറയുന്നത് സന്ദർഭസാധ്യമായാലും ക്രിയയുടെ അടിസ്ഥാനാർഥത്തേക്കാൾ ശക്തമായ വ്യാഖ്യാനമാകും.
- source_word: πειράσαι
  choice: പരീക്ഷിക്കാൻ
  rationale: ഇവിടെ ‘പ്രലോഭിപ്പിക്കുക’ എന്നതിനെക്കാൾ ‘പരീക്ഷിക്കുക/പരീക്ഷണവിധേയമാക്കുക’ എന്ന അർഥമാണ് യോജിക്കുന്നത്.
- source_word: τὸ πνεῦμα κυρίου
  choice: കർത്താവിന്റെ ആത്മാവിനെ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക ഘടന നേരിട്ട് നിലനിർത്തുന്നു; ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വികസിപ്പിക്കാതെ അപ്പൊസ്തലപ്രവൃത്തികൾ 5:3-നോടുള്ള ബന്ധവും സാധ്യതയുള്ള സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും വാക്കുകളുടെ അടിയന്തരതയും ഗൗരവവും നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: അടക്കംചെയ്തവരുടെ കാലുകൾ
  rationale: ഗ്രീക്കിലെ ദൃശ്യവും ഉദ്ദേശപൂർവവുമായ ‘കാലുകൾ’ എന്ന രൂപകം നിലനിർത്തുന്നു; ‘കാലൊച്ച’ എന്ന് മാറ്റുന്നത് വാചകത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കും.
- source_word: τὸν ἄνδρα σου
  choice: നിന്റെ ഭർത്താവിനെ
  rationale: സഫീറയെയും അനന്യാസിനെയും സംബന്ധിച്ച സന്ദർഭത്തിൽ ἀνήρ എന്ന പദത്തിന്റെ വ്യക്തമായ അർഥം ‘ഭർത്താവ്’ എന്നതാണ്.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: വാതിൽക്കൽ എത്തിയിരിക്കുന്നു
  rationale: ‘വാതിൽക്കൽ’ സ്ഥാനം കൃത്യമായി നൽകുന്നു; മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി സന്ദർഭത്തിൽ വ്യക്തമായെത്തിയിരിക്കൽ സൂചന ക്രിയയായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξοίσουσίν σε
  choice: അവർ നിന്നെയും പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോകും
  rationale: ἐκφέρω എന്നതിന്റെ ‘പുറത്തേക്ക് ചുമന്നുകൊണ്ടുപോകുക’ എന്ന അർഥവും മരണത്തെക്കുറിച്ചുള്ള വാക്കുകളുടെ ominous നേരിട്ടത്വവും നിലനിർത്തുന്നു; ‘നിന്റെ മൃതദേഹം’ എന്ന് വ്യക്തമാക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണമാകും.
- source_word: Τί ὅτι
  choice: എന്തിന്?
  rationale: ശാസനയോടുകൂടിയ കാരണചോദ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘കർത്താവിന്റെ ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ഗ്രീക്കിലെ ‘കർത്താവിന്റെ ആത്മാവ്’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം, പ്രത്യേകിച്ച് 5:3, പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും മൂലപാഠത്തിന്റെ രൂപം വിപുലീകരിക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ബന്ധവും ഭാഷാപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: പത്രോസിന്റെ കുറ്റാരോപണത്തിന്റെ തീവ്രത
  choice: ‘ഒരുമിച്ചു ധാരണയിലെത്തിയത്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ഗൂഢാലോചന നടത്തിയത്’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭത്തിൽ കൂട്ടുകെട്ടിന്റെ നൈതികഗൗരവം വ്യക്തമാണ്; എന്നാൽ συμφωνέω എന്ന ക്രിയയുടെ അടിസ്ഥാനശക്തി പരസ്പരസമ്മതമാണ്. കൂടുതൽ ശക്തമായ കുറ്റപരിഭാഷ ക്രിയയിലേക്കുതന്നെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇതാ’യും ‘കാലുകൾ’യും മൂലവാക്യത്തിന്റെ ദൃശ്യതയും അടിയന്തരതയും നിലനിർത്തുന്നു. വ്യാകരണപരമായി ആവശ്യമില്ലാത്തതിനാൽ footnote marker-കൾ ചേർത്തിട്ടില്ല; നൽകിയ ഇംഗ്ലീഷ് footnote-കളുടെ ഉള്ളടക്കവും marker-കളുമായുള്ള പൊരുത്തവും ആശയക്കുഴപ്പമുള്ളതിനാൽ അവ മലയാള കരടിലേക്ക് മാറ്റിയിട്ടില്ല.
