revisions:
- from: 'എന്നാൽ പത്രോസ് അവളോടു പറഞ്ഞു: “കർത്താവിന്റെ ആത്മാവിനെ പരീക്ഷിക്കാൻ നിങ്ങൾ രണ്ടുപേരും ഒരുമിച്ചു ധാരണയിലെത്തിയത് എന്തിന്? ഇതാ, നിന്റെ ഭർത്താവിനെ അടക്കംചെയ്തവരുടെ കാലുകൾ വാതിൽക്കൽ എത്തിയിരിക്കുന്നു; അവർ നിന്നെയും പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോകും.”'
  to: 'എന്നാൽ പത്രോസ് അവളോടു പറഞ്ഞു: “കർത്താവിന്റെ ആത്മാവിനെ പരീക്ഷിക്കാൻ നിങ്ങൾ തമ്മിൽ യോജിച്ചത് എന്തിന്? ഇതാ, നിന്റെ ഭർത്താവിനെ അടക്കംചെയ്തവരുടെ കാലുകൾ വാതിൽക്കലുണ്ട്; അവർ നിന്നെയും പുറത്തേക്കു ചുമന്നുകൊണ്ടുപോകും.”'
  rationale: തിരുത്തൽ അർഥപരമായ മാറ്റമല്ല. συμφωνέωയുടെ പരസ്പരസമ്മതവും ἐπὶ τῇ θύρᾳയുടെ സ്ഥാനസൂചനയും ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായും മൂലപാഠത്തോടു കൂടുതൽ അടുത്തായും നൽകുന്നതിനാണ് വാചകം പരിഷ്കരിച്ചത്. ഇംഗ്ലീഷ് audit trail-ലെ footnote b അതിന്റെ നിലവിലെ anchor-നോട് പൊരുത്തപ്പെടുന്നില്ല; മലയാള പാഠത്തിൽ അതിന് marker ഇല്ലാത്തതിനാൽ തെറ്റായ anchor പുനരാവിഷ്കരിച്ചിട്ടില്ല.
