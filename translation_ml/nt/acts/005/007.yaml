id: ACT.5.7
reference: Acts 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: ml
  text: ഏകദേശം മൂന്നു മണിക്കൂർ കഴിഞ്ഞപ്പോൾ, സംഭവിച്ചത് അറിയാതെ അവന്റെ ഭാര്യ അകത്തുവന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: Ἐγένετο ഇവിടെ കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള സ്വാഭാവിക നീക്കമാണ്; δὲ ലഘുവായ ബന്ധകവുമാണ്. മലയാളത്തിൽ വേറിട്ട ഒരു ആമുഖപദം ചേർക്കാതെ കാലസൂചക ഉപവാക്യത്തിലൂടെ ഈ കഥാപുരോഗതി സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: ഏകദേശം മൂന്നു മണിക്കൂർ കഴിഞ്ഞപ്പോൾ
  rationale: διάστημα സമയത്തിന്റെ ഇടവേളയെയും ὡς അളവിലെ ഏകദേശതയെയും സൂചിപ്പിക്കുന്നു. ഈ രൂപം രണ്ടും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: അവന്റെ ഭാര്യ
  rationale: സന്ദർഭത്തിൽ γυνή അനന്യാസിന്റെ ഭാര്യയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ‘ഭാര്യ’ കൃത്യമാണ്.
- source_word: μὴ εἰδυῖα τὸ γεγονὸς
  choice: സംഭവിച്ചത് അറിയാതെ
  rationale: വരുന്നതിനോടൊപ്പം നിലനിന്നിരുന്ന അവളുടെ അറിവില്ലായ്മയും ഇതിനുമുമ്പ് നടന്ന സംഭവവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: εἰσῆλθεν
  choice: അകത്തുവന്നു
  rationale: εἰσέρχομαι എന്നതിന്റെ സ്ഥലത്തിനകത്തേക്കുള്ള ചലനം മലയാളകഥനത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ഏകദേശ സമയസൂചന നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായ വ്യാഖ്യാനമോ സഭാപാരമ്പര്യപരമായ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
