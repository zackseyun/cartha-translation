  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: ml
  text: 'ഇപ്പോഴാകട്ടെ, ഞാൻ നിങ്ങളോടു പറയുന്നു: ഈ മനുഷ്യരിൽനിന്ന് അകന്നുനിൽക്കുക; അവരെ വെറുതെ വിടുക. കാരണം, ഈ പദ്ധതിയോ ഈ പ്രവൃത്തിയോ മനുഷ്യരിൽനിന്നുള്ളതാണെങ്കിൽ[a], അത് തകർക്കപ്പെടും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാനുഷിക ഉത്ഭവമുള്ളതാണെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അത് നശിപ്പിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘അത് ഒന്നുമല്ലാതാക്കപ്പെടും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: ഇപ്പോഴാകട്ടെ
  rationale: വർത്തമാന സാഹചര്യത്തെക്കുറിച്ചുള്ള ഗമാലിയേലിന്റെ ഉപദേശം അവതരിപ്പിക്കുന്ന പ്രയോഗം. ‘ഇപ്പോഴാകട്ടെ’ എന്നത് സന്ദർഭമാറ്റത്തിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളവും നിലനിർത്തുന്നു.
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: ഈ മനുഷ്യരിൽനിന്ന് അകന്നുനിൽക്കുക
  rationale: ഇവരിൽനിന്ന് വേർപെട്ടുനിൽക്കാനും ഇവർക്കെതിരായ ഇടപെടലിൽനിന്ന് പിന്മാറാനും ആവശ്യപ്പെടുന്ന ആജ്ഞയുടെ പ്രായോഗിക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἄφετε αὐτούς
  choice: അവരെ വെറുതെ വിടുക
  rationale: അവരെ ഇനി തടയുകയോ ശിക്ഷിക്കാൻ ശ്രമിക്കുകയോ ചെയ്യാതെ വിട്ടേക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്നുള്ളതാണെങ്കിൽ
  rationale: അടുത്ത വാക്യത്തിലെ ദൈവിക ഉറവിടത്തോടുള്ള വൈരുധ്യം മുൻകൂട്ടി നിലനിർത്തിക്കൊണ്ട്, ἐξ സൂചിപ്പിക്കുന്ന ഉറവിടമോ ഉത്ഭവമോ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ βουλὴ αὕτη ἢ τὸ ἔργον τοῦτο
  choice: ഈ പദ്ധതിയോ ഈ പ്രവൃത്തിയോ
  rationale: βουλή എന്നതിലെ ആസൂത്രണം/ഉദ്ദേശ്യം എന്ന ആശയവും ἔργον എന്നതിലെ നടപ്പിലാകുന്ന പ്രവർത്തനം എന്ന ആശയവും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: καταλυθήσεται
  choice: അത് തകർക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും പദ്ധതി അല്ലെങ്കിൽ പ്രവൃത്തി പരാജയപ്പെടുത്തി ഇല്ലാതാക്കപ്പെടുമെന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐξ ἀνθρώπων എന്നതിലെ മനുഷ്യ ഉറവിടവും അടുത്ത വാക്യത്തിലെ ദൈവിക ഉറവിടവും തമ്മിലുള്ള വൈരുധ്യം
  choice: മനുഷ്യരിൽനിന്നുള്ളതാണെങ്കിൽ
  alternative: മാനുഷിക ഉത്ഭവമുള്ളതാണെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ഉറവിടസൂചന നേരിട്ട് നിലനിർത്തുകയും ‘മനുഷ്യർ’ എന്നത് പൊതുവായി മനുഷ്യരാശിയെ സൂചിപ്പിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു; ഇതിലൂടെ ദൈവത്തിൽനിന്നുള്ളത് എന്ന തുടർവാക്യത്തിലെ വൈരുധ്യം മുൻകൂട്ടി പരിഹരിക്കപ്പെടുന്നില്ല.
- issue: καταλυθήσεται എന്ന കർമണിപ്രയോഗത്തിലെ പ്രവർത്തകന്റെ അനിർണിതത്വം
  choice: അത് തകർക്കപ്പെടും
  alternative: അത് തകർന്നുപോകും
  rationale: ആരാണ് അതിനെ തകർക്കുന്നത് എന്നു മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പ്രവർത്തകനെ ചേർക്കാതെ കർമണിരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗമാലിയേലിന്റെ ഔപചാരിക ഉപദേശസ്വരം നിലനിർത്താൻ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദാവലി ഒഴിവാക്കി.
