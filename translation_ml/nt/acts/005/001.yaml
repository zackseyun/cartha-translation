id: ACT.5.1
reference: Acts 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις Ἁνανίας ὀνόματι σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ ἐπώλησεν κτῆμα
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: ml
  text: എന്നാൽ അനന്യാസ് എന്നു പേരുള്ള ഒരാൾ തന്റെ ഭാര്യ സഫീറയോടുകൂടെ ഒരു സ്വത്ത്[a] വിറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ഭൂസ്വത്ത്.” ഗ്രീക്ക് പദത്തിന് പൊതുവായി ഒരു കൈവശവസ്തുവിനെയോ സ്ഥാവരസ്വത്തിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ ... τις
  choice: ഒരാൾ
  rationale: നാമരഹിതനായ ഒരു വ്യക്തിയെ കഥയിൽ പരിചയപ്പെടുത്തുന്ന പ്രയോഗമായതിനാൽ, ‘ഒരു മനുഷ്യൻ’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘ഒരാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുമ്പ് വിവരിച്ച ബർന്നബാസിന്റെ പ്രവൃത്തിയോടുള്ള മൃദുവായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: Ἁνανίας ὀνόματι
  choice: അനന്യാസ് എന്നു പേരുള്ള
  rationale: ὀνόματι എന്ന പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്യുകയും ചെയ്തു.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: തന്റെ ഭാര്യ സഫീറയോടുകൂടെ
  rationale: σύν സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വവും γυνή എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ ‘ഭാര്യ’ എന്ന അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπώλησεν
  choice: വിറ്റു
  rationale: πωλέω എന്ന ക്രിയയുടെ ഭൂതകാല കഥനരൂപം നേരിട്ട് നൽകുന്നു.
- source_word: κτῆμα
  choice: ഒരു സ്വത്ത്
  rationale: വിൽക്കാവുന്ന ഒരു കൈവശവസ്തുവിനെയോ സ്ഥാവരസ്വത്തിനെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ‘നിലം’ എന്നു മാത്രം പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: മുമ്പുള്ള ബർന്നബാസിന്റെ ഉദാഹരണവുമായുള്ള കഥനവൈരുധ്യം
  choice: δέ എന്നത് ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇനി’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ എന്ന മൃദുവായ കഥനമാറ്റം.
  rationale: തുടർന്നുവരുന്ന വഞ്ചനാപരമായ പ്രവൃത്തിയും ബർന്നബാസിന്റെ പ്രവൃത്തിയും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; അതേസമയം മൂലപാഠത്തേക്കാൾ ശക്തമായ വിധിനിർണയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘യോടുകൂടെ’ എന്ന രൂപം σύν എന്നതിന്റെ സഹവർത്തിത്വഭാവം ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു.
