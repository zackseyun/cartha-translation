id: ACT.5.12
reference: Acts 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ δὲ τῶν χειρῶν τῶν ἀποστόλων ἐγίνετο σημεῖα καὶ τέρατα ⸂πολλὰ ἐν τῷ λαῷ⸃· καὶ ἦσαν ὁμοθυμαδὸν ⸀ἅπαντες ἐν τῇ Στοᾷ Σολομῶντος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: ml
  text: അപ്പൊസ്തലന്മാരുടെ കൈകളിലൂടെ ജനങ്ങളുടെ ഇടയിൽ അനേകം അടയാളങ്ങളും അത്ഭുതങ്ങളും നടന്നുകൊണ്ടിരുന്നു. അവർ എല്ലാവരും ശലോമോന്റെ മണ്ഡപത്തിൽ ഒരുമിച്ചായിരുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏകമനസ്സോടെ.’ ഗ്രീക്ക് പദം ഒരേ സ്ഥലത്തെ കൂടിച്ചേരലിനൊപ്പം പങ്കിട്ട ഐക്യവും ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശലോമോന്റെ തൂണുമണ്ഡപത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരുടെ കൈകളിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/കർതൃത്വം നിലനിർത്തുകയും ‘കൈകളിലൂടെ’ എന്ന ഗ്രീക്ക് ദൃശ്യപ്രയോഗം അനാവശ്യമായി ലഘൂകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ മുന്നേറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കുന്നത് അർത്ഥത്തിന് അധികഭാരം നൽകും.
- source_word: ἐγίνετο
  choice: നടന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർന്നോ ഉണ്ടായിരുന്ന പ്രവർത്തനം സൂചിപ്പിക്കുന്നു; ആ ദൈർഘ്യഭാവം ‘-കൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: σημεῖα καὶ τέρατα
  choice: അടയാളങ്ങളും അത്ഭുതങ്ങളും
  rationale: ലൂക്കോസിന്റെ രചനകളിലെ സ്ഥിരമായ പദജോടിയുടെ വ്യത്യസ്ത ഘടകങ്ങൾ നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അത്ഭുതകരമായ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: πολλὰ
  choice: അനേകം
  rationale: അടയാളങ്ങളെയും അത്ഭുതങ്ങളെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കുന്ന ബഹുത്വം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῷ λαῷ
  choice: ജനങ്ങളുടെ ഇടയിൽ
  rationale: പ്രവർത്തനം ജനങ്ങൾക്കിടയിൽ നടന്നുവെന്ന സ്ഥല/സാമൂഹിക പരിധി വ്യക്തമാക്കുന്നു; ‘ഇസ്രായേൽജനം’ എന്ന് മൂലത്തേക്കാൾ കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὁμοθυμαδὸν
  choice: ഒരുമിച്ച്
  rationale: പങ്കിട്ട ഐക്യവും ഒരേ സ്ഥലത്തെ കൂടിച്ചേരലും ഉൾക്കൊള്ളാവുന്ന ലളിതമായ ആധുനിക പദം. ‘ഏകമനസ്സോടെ’ എന്ന കൂടുതൽ വ്യക്തമായ ഐക്യഭാവം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἅπαντες
  choice: അവരെല്ലാവരും
  rationale: സമഗ്രത വ്യക്തമാക്കുന്നു; എന്നാൽ സർവനാമത്തിന്റെ മുൻപദം അപ്പൊസ്തലന്മാർ മാത്രമാണോ വിശ്വാസികളുടെ വിശാലസമൂഹമാണോ എന്ന് പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: Στοᾷ Σολομῶντος
  choice: ശലോമോന്റെ മണ്ഡപത്തിൽ
  rationale: στοά സൂചിപ്പിക്കുന്ന മേൽക്കൂരയുള്ള തൂണുനിരയോടുകൂടിയ പൊതുസ്ഥലം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു; കൂടുതൽ വാസ്തുശാസ്ത്രപരമായ പകരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘അവരെല്ലാവരും’ എന്നതിന്റെ സൂചിതസംഘം
  choice: മുൻപദം വ്യക്തമാക്കാതെ ‘അവരെല്ലാവരും’ എന്നു നിലനിർത്തി
  alternative: അപ്പൊസ്തലന്മാർ എല്ലാവരും / വിശ്വാസികൾ എല്ലാവരും
  rationale: ഗ്രീക്കിൽ കർത്താവിന്റെ മുൻപദം പരോക്ഷമാണ്. അത് അപ്പൊസ്തലന്മാർക്കു മാത്രമോ വിശ്വാസികളുടെ മുഴുവൻ സമൂഹത്തിനോ ബാധകമാണെന്ന് മുഖ്യപാഠം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ തുടർച്ചയായ അത്ഭുതപ്രവർത്തനവും പരോക്ഷമായ സർവനാമസൂചനയും സംരക്ഷിച്ചു; സാങ്കേതിക വാസ്തുപദം അടിക്കുറിപ്പിലേക്ക് മാറ്റി.
