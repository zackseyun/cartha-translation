id: ACT.5.22
reference: Acts 5:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ⸂παραγενόμενοι ὑπηρέται⸃ οὐχ εὗρον αὐτοὺς ἐν τῇ φυλακῇ, ἀναστρέψαντες δὲ ἀπήγγειλαν
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/022.yaml
  text: But when the officers arrived, they did not find them in the prison; so they returned and reported,
translation:
  language: ml
  text: എന്നാൽ ഉദ്യോഗസ്ഥർ എത്തിയപ്പോൾ, അവരെ തടവറയിൽ കണ്ടില്ല; പിന്നെ അവർ മടങ്ങിച്ചെന്ന് വിവരം അറിയിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: അവിടെ എത്തിയപ്പോൾ
  rationale: പങ്കാളിക്രിയയുടെ കാലസംബന്ധം സ്വാഭാവികമായ മലയാള ഉപവാക്യമായി നൽകുന്നു; ‘അവിടെ’ എന്നത് സന്ദർഭത്തിലെ തടവറയിലേക്കുള്ള എത്തിച്ചേരലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ὑπηρέται
  choice: ഉദ്യോഗസ്ഥർ
  rationale: ഇവിടെ യഹൂദനേതൃത്വത്തിന്റെ അധികാരത്തിൽ ഔദ്യോഗിക ചുമതല നിർവഹിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ സ്ഥാപനപരമായ സന്ദർഭത്തിന് യോജിക്കുന്നു, എന്നാൽ ‘ദേവാലയകാവൽക്കാർ’ എന്നതുപോലെ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: οὐχ εὗρον
  choice: കണ്ടില്ല
  rationale: കഥനസന്ദർഭത്തിൽ εὑρίσκω എന്നതിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: ἐν τῇ φυλακῇ
  choice: തടവറയിൽ
  rationale: മുൻസന്ദർഭത്തിൽ അറിയപ്പെടുന്ന നിർദിഷ്ട തടവറയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ വിഭക്തിപ്രയോഗം തന്നെ ആ സന്ദർഭനിർദിഷ്ടത സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἀναστρέψαντες
  choice: മടങ്ങിച്ചെന്ന്
  rationale: അവരെ അയച്ചവരുടെ അടുത്തേക്ക് തിരിച്ചുപോയെന്ന ഗതിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπήγγειλαν
  choice: വിവരം അറിയിച്ചു
  rationale: ഔദ്യോഗികമായി തിരികെ റിപ്പോർട്ട് ചെയ്യുന്നതിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δέ
  choice: എന്നാൽ / അതിനാൽ
  rationale: ആദ്യ δέ പ്രതീക്ഷയ്‌ക്കെതിരായ സംഭവത്തെ ‘എന്നാൽ’ എന്നു സൂചിപ്പിക്കുന്നു. രണ്ടാം δέ ലഘുവായ കഥനബന്ധമാണ്; സംഭവക്രമത്തിലെ ഫലബന്ധം മലയാളത്തിൽ ‘അതിനാൽ’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ഔദ്യോഗിക പശ്ചാത്തലം നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായ സ്ഥാപനവിശദീകരണം ഒഴിവാക്കി.
