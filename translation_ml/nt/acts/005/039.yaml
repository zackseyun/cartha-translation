source:
  edition: SBLGNT
  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: ml
  text: എന്നാൽ അത് ദൈവത്തിൽനിന്നുള്ളതാണെങ്കിൽ, അവരെ[c] തകർത്തുകളയാൻ[a] നിങ്ങൾക്കു കഴിയുകയില്ല. ഒരുപക്ഷേ, നിങ്ങൾ ദൈവത്തോടു പോരാടുന്നവരായിപ്പോലും കണ്ടെത്തപ്പെട്ടേക്കാം[b].” അങ്ങനെ അവർ അദ്ദേഹത്താൽ ബോധ്യപ്പെട്ടു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നശിപ്പിക്കാൻ’ അല്ലെങ്കിൽ ‘ഇല്ലാതാക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ ദൈവത്തിന്റെ എതിരാളികളാണെന്നുപോലും തെളിഞ്ഞേക്കാം’ എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥത്തിൽ, ‘ദൈവത്തോടു പോരാടുന്നവർ.’
    reason: lexical_alternative
  - marker: c
    text: ‘അവരെ’ എന്ന സർവനാമം ഏറ്റവും സ്വാഭാവികമായി അപ്പൊസ്തലന്മാരെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ചിലർ അതിനെ അവരുടെ പ്രസ്ഥാനത്തെയോ പ്രവർത്തനത്തെയോ ഉൾക്കൊള്ളുന്ന വിശാലമായ സൂചനയായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളത്
  rationale: ἐκ ഇവിടെ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു; ദൈവിക ഉത്ഭവം എന്ന ഗമാലിയേലിന്റെ മാനദണ്ഡം ഈ പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δυνήσεσθε
  choice: നിങ്ങൾക്കു കഴിയുകയില്ല
  rationale: δύναμαι എന്ന ക്രിയയുടെ ഭാവികാലശേഷിയെ മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: καταλῦσαι
  choice: തകർക്കാൻ
  rationale: ഇവിടെ ഒരു കൂട്ടത്തെയോ അതിന്റെ പ്രവർത്തനത്തെയോ പരാജയപ്പെടുത്തി ഇല്ലാതാക്കുക എന്ന ആശയമാണ്; ‘തകർക്കുക’ അതിനെ സംക്ഷിപ്തമായും സന്ദർഭോചിതമായും നൽകുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: ഗ്രീക്കിലെ പദം പുല്ലിംഗ ബഹുവചനമാണ്; ഏറ്റവും സ്വാഭാവികമായി അപ്പൊസ്തലന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സർവനാമം നിലനിർത്തി.
- source_word: μήποτε
  choice: കാണപ്പെട്ടേക്കാം
  rationale: μήποτε നൽകുന്ന അനഭിലഷണീയമായ സാധ്യതയെ മുന്നറിയിപ്പിന്റെ ഭാവത്തോടെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: θεομάχοι
  choice: ദൈവത്തോടു പോരാടുന്നവർ
  rationale: ‘ദൈവത്തോടു പോരാടുന്നവർ’ എന്ന അക്ഷരാർഥപരമായ ആശയം, അസ്വാഭാവികമായ സംയുക്തപദം സൃഷ്ടിക്കാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: εὑρεθῆτε
  choice: കാണപ്പെട്ടേക്കാം
  rationale: ഒടുവിൽ അങ്ങനെയുള്ളവരാണെന്നു തെളിയുകയോ തിരിച്ചറിയപ്പെടുകയോ ചെയ്യാനുള്ള സാധ്യത എന്ന നിഷ്ക്രിയഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: അങ്ങനെ അവർ അദ്ദേഹത്തിന്റെ വാക്കു സമ്മതിച്ചു
  rationale: സഭ ഗമാലിയേലിന്റെ ഉപദേശം അംഗീകരിച്ചു എന്ന πείθωയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; δέയുടെ ഫലസൂചന ‘അങ്ങനെ’ എന്നു പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: αὐτούς എന്ന സർവനാമം ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘അവരെ’ എന്നത് ഏറ്റവും സ്വാഭാവികമായി അപ്പൊസ്തലന്മാരെ സൂചിപ്പിക്കുന്നു.
  alternative: മുൻവാക്യത്തിലെ പദ്ധതിയെയോ പ്രവൃത്തിയെയോ അടിസ്ഥാനമാക്കി, അവരുടെ പ്രസ്ഥാനത്തെയോ പ്രവർത്തനത്തെയോ വിശാലമായി സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാം.
  rationale: ഗ്രീക്ക് സർവനാമം പുല്ലിംഗ ബഹുവചനമായതിനാൽ നേരിട്ടുള്ള വ്യക്തിപരമായ സൂചന നിലനിർത്തി. എന്നാൽ മുൻസന്ദർഭം മൂലം വിശാലമായ ധാരണയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, അതേസമയം ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ വ്യക്തിസൂചക ബഹുവചനവും ദൈവത്തോടു പോരാടുന്നവരായി തെളിയാനുള്ള മുന്നറിയിപ്പും നിലനിർത്തി. വാക്യാവസാനത്തിലെ കോമ അടുത്ത വാക്യത്തിലേക്കുള്ള മൂലപാഠത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു.
