id: ACT.5.29
reference: Acts 5:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസും അപ്പൊസ്തലന്മാരും മറുപടി പറഞ്ഞു: “ഞങ്ങൾ മനുഷ്യരെക്കാൾ ദൈവത്തെ അനുസരിക്കണം.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπαν
  choice: മറുപടി പറഞ്ഞു
  rationale: പങ്കാളിക്രിയയും മുഖ്യക്രിയയും ചേർന്നുള്ള ‘മറുപടി പറഞ്ഞ് പറഞ്ഞു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ ആവർത്തനമില്ലാത്ത സ്വാഭാവിക മലയാളത്തിൽ ഒറ്റ പ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുമ്പത്തെ അധികാരികളുടെ കല്പനയോടുള്ള മൃദുവായ വിരോധവും സംഭാഷണത്തിലെ വഴിത്തിരിവും വ്യക്തമാക്കുന്നു.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: പത്രോസും അപ്പൊസ്തലന്മാരും
  rationale: വ്യക്തിനാമത്തിന്റെയും സഭാപാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ട ἀπόστολος എന്ന പദത്തിന്റെയും സാധാരണ മലയാളരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: Πειθαρχεῖν
  choice: അനുസരിക്കണം
  rationale: അധികാരമുള്ള ഒരാളുടെ കല്പന അനുസരിക്കുക എന്ന πειθαρχέωയുടെ സന്ദർഭോചിതമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: δεῖ
  choice: ഞങ്ങൾ … വേണം എന്നതിനു പകരം ഞങ്ങൾ … അനുസരിക്കണം
  rationale: കടമയെയോ അനിവാര്യതയെയോ സൂചിപ്പിക്കുന്ന δεῖയുടെ ബലം മലയാളത്തിലെ ‘-ണം’ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ഗ്രീക്കിൽ അന്തർനിഹിതമായ കർത്താവിനെ ‘ഞങ്ങൾ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: θεῷ μᾶλλον ἢ ἀνθρώποις
  choice: മനുഷ്യരെക്കാൾ ദൈവത്തെ
  rationale: ദൈവത്തോടുള്ള അനുസരണത്തിനും മനുഷ്യരോടുള്ള അനുസരണത്തിനും ഇടയിലെ താരതമ്യവിരോധം നിലനിർത്തുന്നു. ἄνθρωποι ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി, സന്ദർഭത്തിൽ മനുഷ്യാധികാരികളെയും, സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെയും മനുഷ്യരെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്ന μᾶλλον ἢ എന്ന പ്രയോഗം
  choice: മനുഷ്യരെക്കാൾ ദൈവത്തെ അനുസരിക്കണം
  alternative: മനുഷ്യരെയല്ല, ദൈവത്തെയാണ് അനുസരിക്കേണ്ടത്
  rationale: തിരഞ്ഞെടുത്ത രൂപം ഗ്രീക്കിലെ താരതമ്യഘടന നേരിട്ട് നിലനിർത്തുന്നു. ബദൽ രൂപം കൂടുതൽ സമ്പൂർണമായ നിരാകരണം സൂചിപ്പിക്കാനിടയുള്ളതിനാൽ മൂലപാഠത്തിലുള്ള വാചകഘടനയെയും അതിന്റെ സംഘർഷത്തെയും അമിതമായി തീർപ്പാക്കാതെ വിടുന്നു.
- issue: ἀνθρώποις എന്ന പൊതുവാചകത്തിന്റെ ലിംഗവും പരിധിയും
  choice: മനുഷ്യരെ
  alternative: ആളുകളെ / മനുഷ്യാധികാരികളെ
  rationale: ‘മനുഷ്യരെ’ എന്നത് ദൈവം–മനുഷ്യർ എന്ന വിശാലമായ വിരോധം കാത്തുസൂക്ഷിക്കുകയും സ്ത്രീപുരുഷഭേദമില്ലാത്ത ഗ്രീക്ക് പൊതുവാചകത്തിന്റെ അർഥം നൽകുകയും ചെയ്യുന്നു. ‘മനുഷ്യാധികാരികളെ’ എന്നു പറഞ്ഞാൽ സന്ദർഭം വ്യക്തമാകുമെങ്കിലും മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം പ്രധാനവാചകത്തിലേക്ക് ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അപ്പൊസ്തലന്മാർ’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി; ശേഷിക്കുന്ന വാക്യം സ്വാഭാവികമായ സമകാലീന വാക്യക്രമത്തിലാണ്.
