id: ACT.5.4
reference: Acts 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: ml
  text: അത് വിൽക്കാതെ ഇരിക്കുമ്പോൾ നിന്റേതായിത്തന്നെ ഇരുന്നില്ലേ? വിറ്റശേഷവും അത് നിന്റെ അധികാരത്തിലായിരുന്നില്ലേ?[a] ഈ കാര്യം നിന്റെ ഹൃദയത്തിൽ വെച്ചത് എന്തിന്? നീ മനുഷ്യരോടല്ല,[b] ദൈവത്തോടാണ് കള്ളം പറഞ്ഞത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ നിയന്ത്രണത്തിലായിരുന്നില്ലേ?’ അല്ലെങ്കിൽ ‘നിന്റെ ഇഷ്ടപ്രകാരം വിനിയോഗിക്കാമായിരുന്നില്ലേ?’
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യർ’ എന്നത് ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μένον σοὶ ἔμενεν
  choice: വിൽക്കാതെ വെച്ചിരുന്നപ്പോൾ അത് നിന്റേതായിത്തന്നെ ഇരുന്നില്ലേ?
  rationale: വിൽപ്പനയ്ക്കുമുമ്പ് സ്വത്ത് അനന്യാസിന്റേതായി തുടർന്നിരുന്നു എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ μένω എന്ന ക്രിയയുടെ ആവർത്തനബലം ‘നിന്റേതായിത്തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: πραθὲν
  choice: വിറ്റശേഷം
  rationale: അയോറിസ്റ്റ് കർമണി പങ്കാളിക്രിയയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകുന്നു.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: ലഭിച്ച പണവും നിന്റെ അധികാരത്തിലായിരുന്നില്ലേ?
  rationale: ἐξουσία ഇവിടെ അവകാശം, നിയന്ത്രണം, തീരുമാനസ്വാതന്ത്ര്യം എന്നിവ സൂചിപ്പിക്കുന്നു. വിറ്റശേഷമുള്ളത് വിൽപ്പനത്തുകയാണെന്ന സന്ദർഭസൂചന ‘ലഭിച്ച പണം’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: τί ὅτι
  choice: എന്തിന്?
  rationale: ശാസനാത്മകമായ ചോദ്യം ലളിതവും ശക്തവുമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: ചെയ്യണമെന്നു നീ ഹൃദയത്തിൽ നിശ്ചയിച്ചത്
  rationale: അകത്തെ ഉദ്ദേശ്യവും ദൃഢനിശ്ചയവും വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്കിലെ ‘ഹൃദയം’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: τὸ πρᾶγμα τοῦτο
  choice: ഈ കാര്യം
  rationale: πρᾶγμα എന്ന വിശാലാർഥമുള്ള പദത്തിന്റെ നൈതിക ഭാരം സന്ദർഭം നിർണയിക്കാൻ അനുവദിക്കുന്ന നിഷ്പക്ഷ വിവർത്തനം.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: നീ കള്ളം പറഞ്ഞത് മനുഷ്യരോടല്ല, ദൈവത്തോടാണ്
  rationale: ψεύδομαι + ദത്തി എന്നത് ‘ആരോടെങ്കിലും കള്ളം പറയുക’ എന്നാണ്. ‘മനുഷ്യർ—ദൈവം’ എന്ന ശക്തമായ വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അടുത്ത സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിന്റെ ദൈവത്വത്തെക്കുറിച്ചുള്ള സൂചന (പ്രവൃത്തികൾ 5:3 കാണുക)
  choice: വാക്യം പറയുന്നതുപോലെ നേരിട്ട് ‘ദൈവത്തോടാണ്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ദൈവത്തോട്, അതായത് പരിശുദ്ധാത്മാവിനോട്’ എന്നു വിശദീകരിച്ചു ചേർക്കുക.
  rationale: ഈ വാക്യം തന്നെ ‘ദൈവത്തോട്’ എന്നാണ് പറയുന്നത്. മുൻവാക്യവുമായുള്ള ബന്ധം വ്യാഖ്യാനപരമായി പ്രധാനമാണെങ്കിലും ആ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കരുത്.
- issue: സ്വത്തിന്റെയും വിൽപ്പനത്തുകയുടെയും മേലുള്ള അവകാശവും തീരുമാനസ്വാതന്ത്ര്യവും
  choice: സ്വത്തും വിൽപ്പനത്തുകയും അനന്യാസിന്റെ യഥാർഥ അധികാരത്തിലായിരുന്നു എന്നു വ്യക്തമാക്കി.
  alternative: കൈവശമുണ്ടായിരുന്നു എന്നു മാത്രം ദുർബലമായി പറയുക.
  rationale: കുറ്റം സ്വത്ത് മുഴുവൻ നൽകാതിരുന്നതല്ല, വഞ്ചിച്ചതാണ് എന്ന പത്രോസിന്റെ വാദം ഈ വിവർത്തനം നിലനിർത്തുന്നു.
- issue: ἀνθρώποις എന്ന പദത്തിന്റെ ലിംഗവ്യാപ്തി
  choice: ‘മനുഷ്യരോട്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘പുരുഷന്മാരോട്’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഇവിടെ പദം പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സ്വത്തിനെക്കുറിച്ചുള്ള ചോദ്യങ്ങളുടെ ആവർത്തനബലവും അവസാനത്തെ ‘മനുഷ്യർ—ദൈവം’ വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു.
