  to: ദൈവം ഈ യേശുവിനെ നേതാവും രക്ഷകനുമായി തന്റെ വലതുഭാഗത്തേക്ക് ഉയർത്തി[a], ഇസ്രായേലിന് മാനസാന്തരവും പാപമോചനവും നൽകുന്നതിനായി.
