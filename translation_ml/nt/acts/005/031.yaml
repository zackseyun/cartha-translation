id: ACT.5.31
reference: Acts 5:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: ml
  text: ദൈവം ഈ യേശുവിനെ നേതാവും രക്ഷകനുമായി തന്റെ വലതുഭാഗത്തേക്ക് ഉയർത്തി[a], ഇസ്രായേലിന് മാനസാന്തരവും പാപമോചനവും നൽകുന്നതിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ വലങ്കൈയാൽ ഉയർത്തി.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഈ ഉപകരണാർഥവും സാധ്യമാണ്; എന്നാൽ ഇവിടെ ദൈവത്തിന്റെ വലതുഭാഗത്തെ പരമബഹുമാനത്തിന്റെ സ്ഥാനത്തേക്കുള്ള ഉയർത്തലായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: ഈ യേശുവിനെ
  rationale: ഊന്നലുള്ള നിർദേശക സർവനാമം മുമ്പ് പരാമർശിച്ച യേശുവിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിൽ ‘ഇവനെ’ എന്നതിനെക്കാൾ ‘ഈ യേശുവിനെ’ വ്യക്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἀρχηγὸν
  choice: നേതാവ്
  rationale: മുന്നിൽനിന്ന് നയിക്കുന്നവൻ, തലവൻ എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു; ഈ രാജകീയ ഉയർത്തൽസന്ദർഭത്തിൽ പഴഞ്ചനായോ അതിവ്യാഖ്യാനപരമായോ തോന്നാതെ അർഥം നൽകുന്നു.
- source_word: σωτῆρα
  choice: രക്ഷകൻ
  rationale: രക്ഷയും വിടുതലും ഉൾക്കൊള്ളുന്ന ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗത്തിന് മലയാളത്തിലെ സ്ഥാപിതവും വ്യക്തവുമായ പദം.
- source_word: ὕψωσεν
  choice: ഉയർത്തി
  rationale: ഇവിടെ ശാരീരികമായി ഉയർത്തുക എന്നതിലുപരി ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തേക്ക് ഉയർത്തുക എന്ന അർഥം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: തന്റെ വലത്തുഭാഗത്തേക്ക്
  rationale: ദൈവത്തിന്റെ വലത്തുഭാഗത്തെ പരമബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തേക്കുള്ള ഉയർത്തലായി വായിക്കുന്നു. ദാതൃവിഭക്തിക്ക് ഉപകരണാർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ δοῦναι
  choice: നൽകേണ്ടതിനായിരുന്നു
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετάνοιαν
  choice: മാനസാന്തരം
  rationale: വെറും അഭിപ്രായമാറ്റമല്ല, ദൈവത്തിലേക്കുള്ള ആന്തരിക തിരിഞ്ഞുവരവ് സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ബൈബിൾപദം.
- source_word: τῷ Ἰσραὴλ
  choice: ഇസ്രായേലിന്
  rationale: δοῦναι എന്ന ക്രിയയോടൊപ്പമുള്ള സ്വീകർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനം
  rationale: പാപങ്ങളുടെ ക്ഷമ/വിമോചനം സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്കുള്ള യേശുവിന്റെ ഉയർത്തൽ
  choice: പരമബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനമായ ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്ക് യേശുവിനെ ഉയർത്തിയതായി മുഖ്യപാഠം നൽകുന്നു.
  alternative: ദൈവം തന്റെ വലങ്കൈയാൽ യേശുവിനെ ഉയർത്തി എന്ന ഉപകരണാർഥ വായന.
  rationale: പുതിയനിയമത്തിലെ സിംഹാസനാരോഹണ ഭാഷയും സന്ദർഭവും സ്ഥാനാർഥ വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഗ്രീക്ക് ദാതൃവിഭക്തി ഉപകരണാർഥവും അനുവദിക്കുന്നതിനാൽ യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: μετάνοιαയുടെ സ്വഭാവം
  choice: മാനസാന്തരം
  alternative: മനസ്സുമാറ്റം; തിരിഞ്ഞുവരവ്
  rationale: ‘മാനസാന്തരം’ മാനസിക പുനർവിചാരം മാത്രമെന്ന ധാരണ ഒഴിവാക്കി ദൈവത്തിലേക്കുള്ള നിർണായക തിരിവ് ഉൾക്കൊള്ളുന്നു; അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക ക്രമമോ സിദ്ധാന്തപരമായ വിശദീകരണമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകാൻ ‘ഈ യേശുവിനെ’ ഉപയോഗിച്ചു. ‘മാനസാന്തരം’, ‘പാപമോചനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; സ്ഥാനാർഥവും ഉപകരണാർഥവും തമ്മിലുള്ള ഗ്രീക്ക് അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
