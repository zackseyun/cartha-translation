id: ACT.5.42
reference: Acts 5:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: ml
  text: അവർ ദിവസവും ദേവാലയത്തിലും വീടുതോറും പഠിപ്പിക്കുന്നതും യേശുവാണ് മശീഹാ എന്ന സുവാർത്ത അറിയിക്കുന്നതും നിർത്തിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു രീതിയിൽ: “യേശുവിനെ മശീഹായായി പ്രഖ്യാപിക്കുന്നതും.”'
    reason: τὸν χριστὸν Ἰησοῦν എന്ന കുറ്റാരോപിത പദസമുച്ചയത്തെ പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമായി മുഖ്യപാഠം അവതരിപ്പിക്കുന്നു; ഈ അടിക്കുറിപ്പ് അതിന്റെ വസ്തുകർമ്മസദൃശമായ മറ്റൊരു സ്വാഭാവിക അവതരണം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: ദിവസവും
  rationale: കാലവ്യാപ്തി സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ പതിവായും തുടർച്ചയായും നടന്ന പ്രവർത്തനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; τε മുൻവിവരണവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ വാക്യപ്രവാഹത്തിൽ വേറെ പദമായി നിർബന്ധിച്ച് പ്രകടിപ്പിച്ചിട്ടില്ല.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν വിശുദ്ധമന്ദിരം മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘ദേവാലയത്തിൽ’ ഈ വിശാലസ്ഥലസൂചന സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: κατ’ οἶκον
  choice: വീടുതോറും
  rationale: κατά + ഏകവചനമായ οἶκον എന്നതിന്റെ വിതരണാർഥം സംരക്ഷിച്ച് പല വീടുകളിലായി നടന്ന പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐπαύοντο
  choice: നിർത്തിയില്ല
  rationale: അപൂർണ്ണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനവും അവസാനിപ്പിക്കാതിരുന്നതും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διδάσκοντες
  choice: പഠിപ്പിക്കുന്നതും
  rationale: διδάσκωയുടെ സാധാരണ അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള സമാന്തര പങ്കാളിക്രിയയുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: εὐαγγελιζόμενοι
  choice: സുവാർത്ത അറിയിക്കുന്നതും
  rationale: നല്ല വാർത്ത പ്രഖ്യാപിക്കുക എന്ന ക്രിയാർഥം സാധാരണ വായനക്കാർക്ക് പരിചിതവും വ്യക്തവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: യേശുവാണ് മശീഹാ എന്ന്
  rationale: Χριστός ഇവിടെ പദവിനാമമായതിനാൽ അതിന്റെ അർഥം ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; കുറ്റാരോപിത പദസമുച്ചയത്തെ പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമസദൃശമല്ല, യേശുവിന്റെ അഭിഷിക്തനായ രാജാവെന്ന പദവിയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ശബ്ദലിപ്യന്തരണത്തേക്കാൾ അർഥപരിഭാഷ ഉചിതമാണ്.
- issue: εὐαγγελιζόμενοι എന്നതിനുശേഷമുള്ള τὸν χριστὸν Ἰησοῦν എന്ന ഘടന
  choice: 'പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കം: ‘യേശുവാണ് മശീഹാ’'
  alternative: 'വസ്തുകർമ്മസമുച്ചയം: ‘മശീഹായായ യേശുവിനെക്കുറിച്ചുള്ള സുവാർത്ത’ / ‘മശീഹാ യേശുവിനെ സുവാർത്തയായി അറിയിക്കുക’'
  rationale: ഗ്രീക്ക് ഘടന വസ്തുകർമ്മമായും പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കമായും വ്യാഖ്യാനിക്കാവുന്നതാണ്. മുഖ്യപാഠത്തിൽ മലയാളത്തിന് ഏറ്റവും വ്യക്തമായ ഉള്ളടക്കവായന സ്വീകരിച്ച്, യഥാർഥ ഘടനാപരമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വീടുതോറും’ വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു. ‘സുവാർത്ത അറിയിക്കുക’ സഭാപരമായ പരിചിതത്വവും പൊതുവായ ഗ്രാഹ്യതയും സമതുലിതമാക്കുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട വാക്യഘടനയുടെ അവസാനം നൽകിയിരിക്കുന്നു.
