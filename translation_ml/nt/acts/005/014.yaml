  source_fidelity: 'പ്രധാന അർഥം പൊതുവേ സംരക്ഷിച്ചിട്ടുണ്ട്: കർത്താവിൽ വിശ്വസിക്കുന്നവരുടെ എണ്ണം തുടർച്ചയായി വർധിച്ചതും പുരുഷന്മാരെയും സ്ത്രീകളെയും പ്രത്യേകം ഉൾക്കൊള്ളുന്നതും വ്യക്തമാണ്. എന്നാൽ ‘വിശ്വസിച്ച’ എന്ന ഭൂതകാലരൂപം ഗ്രീക്കിലെ വർത്തമാനകാല നാമവത്കൃത participle-ന്റെ സ്വഭാവസൂചനയെ ദുർബലമാക്കുന്നു; ‘വിശ്വസിക്കുന്ന’ ഉചിതമാണ്. കൂടാതെ ‘അവരോടു’ എന്നത് ഗ്രീക്കിൽ ഇല്ലാത്തതും അതിന്റെ സൂചിതപൂർവപദം അവ്യക്തവുമാണ്.'
  naturalness: ‘പുരുഷന്മാരും സ്ത്രീകളും വലിയ കൂട്ടങ്ങളായി ... അവരോടു ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്ന ക്രമം അല്പം കഠിനവും ‘അവരോടു’ ആരെയാണ് സൂചിപ്പിക്കുന്നത് എന്നതിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുന്നതുമാണ്. ‘പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെട്ട വലിയ കൂട്ടങ്ങൾ’ എന്ന പ്രയോഗം ആധുനിക സാധാരണ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘കർത്താവ്’ κύριος-ന് യോജിച്ചതാണ്. ‘ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു’ προσετίθεντο-യുടെ അപൂർണകാല കർമണിഭാവവും, ദൈവത്തെ സൂചിതകർതാവായി മനസ്സിലാക്കാവുന്ന സാധ്യതയും സംരക്ഷിക്കുന്നു. ‘വലിയ കൂട്ടങ്ങൾ’ πλήθη-യ്ക്ക് യോജിച്ച സാധാരണ പദപ്രയോഗമാണ്.
