  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: ml
  text: അതിലുമധികമായി, കർത്താവിൽ വിശ്വസിക്കുന്ന പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെട്ട വലിയ കൂട്ടങ്ങൾ ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചേർന്നുകൊണ്ടിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ തുടർന്നുകൊണ്ടിരുന്ന സംഖ്യാവർധനയെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കർമണിഭാവം അവരെ ചേർത്തത് ദൈവമാണെന്ന സൂചനയും നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: പിന്നെയും അധികമായി
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ്; μᾶλλον വർധിച്ചുകൊണ്ടിരിക്കുന്ന തോത് ഊന്നിപ്പറയുന്നു. മലയാളത്തിൽ രണ്ടിന്റെയും ഭാവം സ്വാഭാവികമായി ചേർത്ത് നൽകുന്നു.
- source_word: προσετίθεντο
  choice: അവരോടു ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന വർധനയെ സൂചിപ്പിക്കുന്നു; കർമണിപ്രയോഗം ചേർക്കുന്നത് ദൈവമാണെന്ന സൂചന വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു. സന്ദർഭം വ്യക്തമാക്കുന്ന സമൂഹത്തെ സൂചിപ്പിക്കാൻ ‘അവരോടു’ ചേർത്തിരിക്കുന്നു.
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: കർത്താവിൽ വിശ്വസിച്ച
  rationale: വിശ്വാസത്തിന്റെ ലക്ഷ്യം കർത്താവാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; substantival participle-ന്റെ അർഥം തുടർന്നുവരുന്ന പുരുഷന്മാരും സ്ത്രീകളും എന്ന നാമങ്ങളോടു ബന്ധിപ്പിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന ബഹുമാനപൂർവവും ക്രിസ്തുശാസ്ത്രപരവുമായ പദവി വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πλήθη
  choice: വലിയ കൂട്ടങ്ങളായി
  rationale: ഒട്ടേറെപ്പേർ എന്ന വ്യാപ്തി സാധാരണ വായനക്കാർക്കു സ്വാഭാവികമായി നൽകുന്നു; ‘ജനക്കൂട്ടങ്ങൾ’ എന്നത് ഒരിടത്തു കൂടിയിരിക്കുന്ന കൂട്ടമെന്ന തെറ്റായ ധ്വനി സൃഷ്ടിക്കാവുന്നതിനാൽ ഒഴിവാക്കി.
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: പുരുഷന്മാരും സ്ത്രീകളും
  rationale: τε καί എന്ന പരസ്പരബന്ധവും ഗ്രീക്കിലെ ലിംഗനിർദ്ദേശമുള്ള പദപ്രയോഗവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പദവി വിപുലീകരിക്കാതെ ‘കർത്താവ്’ എന്നു നിലനിർത്തി; സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കുക, അല്ലെങ്കിൽ പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ സുവിശേഷസംഗ്രഹങ്ങളിൽ κύριος സാധാരണയായി ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്നു; എങ്കിലും മൂലപാഠത്തിൽ ‘യേശു’ എന്നു ചേർത്തിട്ടില്ല.
- issue: προσετίθεντο എന്നതിന്റെ കർമണിപ്രയോഗവും കാലഭാവവും
  choice: ‘ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്ന തുടർച്ചയുള്ള കർമണിരൂപം.
  alternative: ‘ചേർന്നുകൊണ്ടിരുന്നു’ എന്ന മധ്യമ/അകർമക രൂപം.
  rationale: ഈ രൂപം കാലക്രമേണ നടന്നുകൊണ്ടിരുന്ന കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുകയും, ചേർക്കുന്നവൻ ദൈവമാണെന്ന സാധ്യത വ്യക്തമാക്കാതെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവരോടു’ എന്ന സന്ദർഭപൂരകപ്രയോഗം സമൂഹത്തിലേക്കുള്ള ചേർക്കലിനെ മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു; അടിക്കുറിപ്പ്-ചിഹ്നം മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
