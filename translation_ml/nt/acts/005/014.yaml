  to: അതിലുമധികമായി, കർത്താവിൽ വിശ്വസിക്കുന്ന പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെട്ട വലിയ കൂട്ടങ്ങൾ ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു.[a]
  rationale: ‘വിശ്വസിക്കുന്ന’ എന്ന രൂപം participle-ന്റെ സ്വഭാവസൂചന നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ വ്യക്തമാക്കാത്ത ‘അവരോടു’ ഒഴിവാക്കിയതിനാൽ ചേർക്കലിന്റെ ലക്ഷ്യസമൂഹം അനാവശ്യമായി നിർവചിക്കപ്പെടുന്നില്ല. ‘അതിലുമധികമായി’ μᾶλλον δέ-യുടെ വർധനാത്മകവും മൃദുവായ ബന്ധകവുമായ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; ‘ചേർക്കപ്പെട്ടുകൊണ്ടിരുന്നു’ അപൂർണകാല കർമണിഭാവം നിലനിർത്തുന്നു.
