source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: ml
  text: അവർ അപ്പൊസ്തലന്മാരെ വിളിച്ചുവരുത്തി അവരെ അടിച്ചശേഷം, യേശുവിന്റെ നാമത്തിൽ[a] സംസാരിക്കരുതെന്ന് കല്പിച്ച് അവരെ വിട്ടയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവിന്റെ നാമത്തെക്കുറിച്ച്” അല്ലെങ്കിൽ “യേശുവിന്റെ അധികാരത്തിൽ.” യേശുവിനെ പരാമർശിച്ചും അവന്റെ അധികാരത്തിൻകീഴിലും സംസാരിക്കുക എന്ന ആശയങ്ങൾ ഗ്രീക്ക് പ്രയോഗത്തിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: വിളിച്ചുവരുത്തി
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist middle participle ആണ്. ‘വിളിച്ചുവരുത്തി’ സ്വാഭാവികമായി ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ നിയോഗിക്കപ്പെട്ട സാക്ഷികളെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ സ്ഥാപിതമായ പദം.
- source_word: δείραντες
  choice: അടിപ്പിച്ചശേഷം
  rationale: δέρω എന്നത് അടിക്കുക/മർദിക്കുക എന്ന വിശാല അർഥം വഹിക്കുന്നു. സന്ദർഭത്തിൽ സഭാംഗങ്ങൾ നേരിട്ട് അടിച്ചതല്ല, അധികാരപ്രകാരം ശിക്ഷ നടപ്പാക്കിയതാണെന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ‘അടിപ്പിച്ചു’ വ്യക്തമാക്കുന്നു; പ്രത്യേകതരം ചാട്ടവാറടിയായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: παρήγγειλαν
  choice: കല്പിച്ച്
  rationale: പരസ്യാധികാരത്തോടെ നൽകിയ ശക്തമായ നിരോധനാജ്ഞയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: μὴ λαλεῖν
  choice: സംസാരിക്കരുതെന്ന്
  rationale: μή + infinitive നിരോധനത്തിന്റെ ഉള്ളടക്കം രേഖപ്പെടുത്തുന്നു. ഔപചാരിക സന്ദർഭത്തിന് ‘സംസാരിക്കുക’ യോജിക്കുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ നാമത്തിൽ
  rationale: യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യവും അവന്റെ അധികാരത്തെ ആധാരമാക്കിയുള്ള സംസാരവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പരിചിതമായ ബൈബിൾ ശൈലി; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: ἀπέλυσαν
  choice: വിട്ടയച്ചു
  rationale: തടങ്കലിൽനിന്നോ അധികാരപരമായ നിയന്ത്രണത്തിൽനിന്നോ മോചിപ്പിച്ചു എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: യേശുവിന്റെ നാമത്തിൽ
  alternative: യേശുവിന്റെ നാമത്തെക്കുറിച്ച്; യേശുവിന്റെ നാമത്തിന്റെ അധികാരത്തിൽ
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം യേശുവിനെ പരാമർശിച്ച് സംസാരിക്കുക, അവന്റെ നാമം പ്രഖ്യാപിക്കുക, അവന്റെ അധികാരത്തിൽ സംസാരിക്കുക എന്നീ പരസ്പരം ബന്ധപ്പെട്ട ആശയങ്ങൾ ഉൾക്കൊള്ളാം. മുഖ്യപാഠം പരിചിതമായ പ്രയോഗം നിലനിർത്തുകയും അടിക്കുറിപ്പ് അർഥവ്യാപ്തി അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ക്രിയകളുടെ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുന്നു; സ്ഥാപിതമായ ‘അപ്പൊസ്തലന്മാർ’, ‘നാമത്തിൽ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചിട്ടും പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കുന്നു.
