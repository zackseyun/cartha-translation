  text: Οἱ δὲ ⸀ἀκούσαντες διεπρίοντο καὶ ἐβούλοντο ἀνελεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/033.yaml
  text: But when they heard this, they were enraged and wanted to kill them.
translation:
  language: ml
  text: എന്നാൽ ഇതു കേട്ടപ്പോൾ അവർ ക്രോധാകുലരായി[a] അവരെ കൊല്ലാൻ ആഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “അവർ ഉള്ളിൽ അറുത്തുമുറിക്കപ്പെട്ടതുപോലെയായി”; അതായത്, കടുത്ത ശത്രുതാപൂർണമായ വികാരക്ഷോഭത്തിലായി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: എന്നാൽ ... അവർ
  rationale: δέ ഇവിടെ അപ്പൊസ്തലന്മാരുടെ വാക്കുകളിൽനിന്ന് ന്യായാധിപസഭയുടെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യപരമായ തിരിവ് സൂചിപ്പിക്കുന്നു; substantival article മുൻപ് പരാമർശിച്ച സംഘത്തെ ‘അവർ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: aorist participle കാലസംബന്ധമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു; കേട്ടതിന്റെ വിഷയം മുൻസന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ എന്നു പൂരിപ്പിക്കുന്നു.
- source_word: διεπρίοντο
  choice: ക്രോധാകുലരായി
  rationale: പദത്തിന്റെ അക്ഷരാർഥചിത്രം ‘അറുത്തുമുറിക്കപ്പെടുക/ഈർച്ചവാളാൽ കീറപ്പെടുക’ എന്നതാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അത് കൊലചെയ്യാനുള്ള മോഹത്തിലേക്കു നയിച്ച തീവ്രമായ ശത്രുതാപൂർണ വികാരക്ഷോഭത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ക്രോധാകുലരായി’ ആ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐβούλοντο
  choice: ആഗ്രഹിച്ചു
  rationale: imperfect രൂപം തുടർന്നുനിന്ന ഇച്ഛയെയോ ഉദ്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു; infinitive-നൊപ്പം ‘ആഗ്രഹിച്ചു’ സ്വാഭാവികവും അർഥപരമായി മതിയായതുമാണ്.
- source_word: ἀνελεῖν
  choice: കൊല്ലാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀναιρέω ജീവൻ അപഹരിക്കുന്നതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘കൊല്ലാൻ’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: αὐτούς
  choice: അവരെ
  rationale: സർവനാമം വിചാരണയ്ക്കു മുമ്പിലുള്ള അപ്പൊസ്തലന്മാരെ സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. διεπρίοντο എന്ന രൂപകത്തിന്റെ അക്ഷരാർഥം മുഖ്യവാക്യത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാതിരിക്കാൻ സന്ദർഭാർഥം നൽകിയിരിക്കുന്നു; മൂലത്തിലെ ശക്തമായ ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
