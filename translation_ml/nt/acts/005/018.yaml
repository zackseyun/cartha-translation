source:
  edition: SBLGNT
  text: καὶ ἐπέβαλον τὰς ⸀χεῖρας ἐπὶ τοὺς ἀποστόλους καὶ ἔθεντο αὐτοὺς ἐν τηρήσει δημοσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/018.yaml
  text: And they laid hands on the apostles and put them in public custody[a].
translation:
  language: ml
  text: അവർ അപ്പൊസ്തലന്മാരെ പിടികൂടി പൊതുതടങ്കലിലാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊതുജയിലിലാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം ഒരു ജയിൽകെട്ടിടത്തെ മാത്രമല്ല, പൊതുവായ കാവലിലോ തടങ്കലിലോ പാർപ്പിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: പിടികൂടി
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘മേൽ കൈവെച്ചു’ എന്നാണെങ്കിലും, ഇവിടെ അത് അനുഗ്രഹിക്കലിനെയോ നിയോഗിക്കലിനെയോ അല്ല, ശത്രുതാപൂർവം പിടികൂടുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന ‘പിടികൂടി’ തെരഞ്ഞെടുത്തു.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരെ
  rationale: പ്രവൃത്തികളിൽ ഇത് സാധാരണ ‘ദൂതന്മാർ’ എന്നതിലുപരി, യേശു നിയോഗിച്ച അംഗീകൃത പ്രതിനിധികളുടെ സ്ഥാനപ്പേരായി ഉപയോഗിക്കുന്നു; അതിനാൽ സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘അപ്പൊസ്തലന്മാർ’ നിലനിർത്തി.
- source_word: ἔθεντο
  choice: ആക്കി
  rationale: τίθημι ഇവിടെ ഒരിടത്തോ അവസ്ഥയിലോ ആക്കുക എന്ന അർഥത്തിലാണ്. ‘തടങ്കലിലാക്കി’ എന്ന സംയുക്തപ്രയോഗം ആ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τηρήσει
  choice: തടങ്കലിൽ
  rationale: τήρησις കാവൽ, തടങ്കൽ, അല്ലെങ്കിൽ തടവിൽ പാർപ്പിക്കൽ എന്ന അവസ്ഥയെ സൂചിപ്പിക്കാം; നിർബന്ധമായി ഒരു ജയിൽകെട്ടിടം മാത്രമെന്ന അർഥമില്ല. ‘തടങ്കൽ’ ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: δημοσίᾳ
  choice: പൊതു
  rationale: ഇത് τηρήσει-നെ വിശേഷിപ്പിച്ച് പൊതുവായതോ ഔദ്യോഗികമായതോ ആയ തടങ്കലിനെ സൂചിപ്പിക്കുന്നു. ‘പൊതു’ എന്നത് ‘സർക്കാർ’ എന്നു അമിതമായി വ്യാഖ്യാനിക്കാതെ വിശേഷണം സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘മേൽ കൈവെച്ചു’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ അനുഗ്രഹം അല്ലെങ്കിൽ നിയോഗം എന്ന തെറ്റായ ധാരണ സൃഷ്ടിക്കാമെന്നതിനാൽ സന്ദർഭാർഥമായ ‘പിടികൂടി’ ഉപയോഗിച്ചു; ‘പൊതുതടങ്കൽ’ എന്നത് ജയിൽകെട്ടിടമെന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
