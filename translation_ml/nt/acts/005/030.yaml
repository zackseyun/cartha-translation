source:
  edition: SBLGNT
  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: ml
  text: നമ്മുടെ പിതാക്കന്മാരുടെ ദൈവം യേശുവിനെ എഴുന്നേൽപ്പിച്ചു[a]. നിങ്ങൾ അവനെ ഒരു മരത്തിന്മേൽ[b] തൂക്കി കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉയിർപ്പിച്ചു.’ ഇവിടെ ഈ ക്രിയ പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കാം; എങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘മരിച്ചവരിൽനിന്ന്’ എന്നു വ്യക്തമായി പറയുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരു കുരിശിന്മേൽ.’ ഗ്രീക്കിൽ ‘ഒരു മരത്തിന്മേൽ’ എന്നാണ്; ഇത് ആവർത്തനം 21:23-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെയും ഉടമ്പടിപരമായ പ്രയോഗത്തെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദക്രമത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: ἤγειρεν
  choice: എഴുന്നേൽപ്പിച്ചു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ‘എഴുന്നേൽപ്പിക്കുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പുനരുത്ഥാനാർഥം കേൾക്കാവുന്നതാണ്, എന്നാൽ ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘മരിച്ചവരിൽനിന്ന്’ എന്ന വാക്കുകൾ ചേർക്കുന്നില്ല.
- source_word: Ἰησοῦν
  choice: യേശുവിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം; ഗ്രീക്കിലെ കർമവിഭക്തി മലയാളത്തിൽ ‘-നെ’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: διεχειρίσασθε
  choice: കൊന്നു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ഉദ്ദേശിക്കുന്ന മരണത്തിലേക്കു നയിച്ച ഹിംസാത്മക പ്രവൃത്തി നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: κρεμάσαντες
  choice: തൂക്കി
  rationale: പ്രധാനക്രിയയായ ‘കൊന്നു’ എന്നതിന്റെ മാർഗം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് കൃതന്തബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ ξύλου
  choice: ഒരു മരത്തിന്മേൽ
  rationale: ξύλον എന്ന പദത്തിന്റെ ‘മരം/തടി’ എന്ന ദൃശ്യരൂപവും ആവർത്തനം 21:23-ലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും നിലനിർത്തുന്നു; നേരിട്ട് ‘കുരിശ്’ എന്നു വ്യാഖ്യാനിച്ചുചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἤγειρεν എന്നത് പുനരുത്ഥാനത്തെ വ്യക്തമായി പറഞ്ഞതായി പരിഭാഷപ്പെടുത്തണമോ
  choice: എഴുന്നേൽപ്പിച്ചു
  alternative: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  rationale: സന്ദർഭം പുനരുത്ഥാനത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് ‘മരിച്ചവരിൽനിന്ന്’ എന്നു വ്യക്തമാക്കുന്നില്ല. തിരഞ്ഞെടുത്ത രൂപം ഈ അർഥം സാധ്യമാക്കിക്കൊണ്ട് മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
- issue: ξύλον എന്നത് നേരിട്ട് ‘കുരിശ്’ എന്നു പരിഭാഷപ്പെടുത്തണമോ
  choice: ഒരു മരത്തിന്മേൽ
  alternative: ഒരു കുരിശിന്മേൽ
  rationale: മൂലപാഠം σταυρός എന്നല്ല, ξύλον എന്നാണ് ഉപയോഗിക്കുന്നത്. ‘മരം’ എന്നു നിലനിർത്തുന്നത് ആവർത്തനം 21:23-ലെ ഭാഷയുമായുള്ള സാധ്യതയുള്ള പ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
