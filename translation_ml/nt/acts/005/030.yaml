  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പിതാക്കന്മാർ’ എന്ന ബൈബിൾപ്രയോഗം അന്തർപാഠബന്ധം നിലനിർത്താൻ ഉപയോഗിച്ചു; ‘എഴുന്നേൽപ്പിച്ചു,’ ‘മരം’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും അനാവശ്യമായി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
