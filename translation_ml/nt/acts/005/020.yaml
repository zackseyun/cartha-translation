id: ACT.5.20
reference: Acts 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: ml
  text: “നിങ്ങൾ പോയി ദേവാലയത്തിൽ[a] നിന്നുകൊണ്ട് ഈ ജീവന്റെ വചനങ്ങളെല്ലാം ജനത്തോടു പറയുക.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദേവാലയാങ്കണത്തിൽ” അല്ലെങ്കിൽ “ദേവാലയപരിസരത്തിൽ.” ഗ്രീക്കിലെ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, മുഴുവൻ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ഈ ജീവന്റെ വചനങ്ങൾ” എന്നത് “ഈ ജീവനെക്കുറിച്ചുള്ള വചനങ്ങൾ” എന്നോ “ഈ ജീവിതരീതിയെക്കുറിച്ചുള്ള വചനങ്ങൾ” എന്നോ മനസ്സിലാക്കാം; സുവിശേഷത്തിൽ പ്രഖ്യാപിക്കപ്പെടുന്ന ജീവനെ ഈ പ്രയോഗം സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: നിങ്ങൾ പോയി
  rationale: പ്രവർത്തനത്തിലേക്കു പുറപ്പെടാനുള്ള നേരിട്ടുള്ള ആജ്ഞയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σταθέντες
  choice: നിന്നുകൊണ്ട്
  rationale: പ്രധാന ആജ്ഞയായ ‘പറയുക’ എന്നതിനോടൊപ്പമുള്ള പ്രവർത്തനമായി കൃുദന്തരൂപത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു; ‘പോയി ... നിന്നുകൊണ്ട് ... പറയുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: λαλεῖτε
  choice: പറയുക
  rationale: λαλέω എന്നതിന്റെ പൊതുവായ ‘സംസാരിക്കുക/പറയുക’ എന്ന അർഥം നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘പ്രസംഗിക്കുക’ എന്ന ഔദ്യോഗിക ഭാവം ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സംഭവസന്ദർഭത്തിലെ പൊതുസ്ഥലം മലയാളവായനക്കാരന് വ്യക്തമാക്കാൻ ‘ദേവാലയാങ്കണം’ ഉപയോഗിച്ചു.
- source_word: τῷ λαῷ
  choice: ജനത്തോടു
  rationale: വാക്യത്തിൽ സന്നിഹിതരായ ജനത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതു ലളിതമായി നൽകുന്നു; ‘ഇസ്രായേൽജനം’ എന്ന മൂലത്തിൽ വ്യക്തമല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: πάντα τὰ ῥήματα
  choice: വചനങ്ങളെല്ലാം
  rationale: πᾶς എന്ന സമഗ്രതയും ῥήματα എന്ന ബഹുവചനവും നിലനിർത്തുന്നു; ‘മുഴുവൻ സന്ദേശം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: τῆς ζωῆς ταύτης
  choice: ഈ ജീവന്റെ
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും അർഥസമ്പന്നവുമായ ഷഷ്ഠീബന്ധം അതേപടി നിലനിർത്തുന്നു; സുവിശേഷത്തിൽ പ്രഖ്യാപിക്കപ്പെടുന്ന ജീവൻ, പുതിയ ജീവിതം, ജീവൻ നൽകുന്ന സന്ദേശം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: τῆς ζωῆς ταύτης എന്നതിന്റെ അർഥം
  choice: ഈ ജീവന്റെ
  alternative: ഈ ജീവിതത്തെക്കുറിച്ചുള്ള / ഈ ജീവിതരീതിയുടെ / ജീവൻ നൽകുന്ന
  rationale: ഈ പ്രയോഗം യേശുവിലുള്ള രക്ഷയോടും അപ്പൊസ്തലിക സന്ദേശത്തോടും ബന്ധപ്പെട്ട ജീവനെ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ഗ്രീക്ക് അതിനെ തുറന്നതും സാന്ദ്രവുമായ നിലയിൽ വയ്ക്കുന്നു. അതിനാൽ വ്യാഖ്യാനവികാസം കൂടാതെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം. ‘ദേവാലയാങ്കണം’ ἱερόν എന്നതിന്റെ സ്ഥലപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു. ‘ഈ ജീവന്റെ വചനങ്ങളെല്ലാം’ എന്ന രൂപം മൂലത്തിലെ അസ്പഷ്ടതയും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും സംരക്ഷിക്കുന്നു.
