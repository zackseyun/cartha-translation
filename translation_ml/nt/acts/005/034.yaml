source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: ml
  text: എന്നാൽ ന്യായാധിപസഭയിൽ[a] ഗമാലിയേൽ എന്നു പേരുള്ള ഒരു പരീശൻ എഴുന്നേറ്റു. ന്യായപ്രമാണത്തിന്റെ അധ്യാപകനായ അദ്ദേഹം എല്ലാ ജനങ്ങളാലും ആദരിക്കപ്പെട്ടവനായിരുന്നു. ആ പുരുഷന്മാരെ അല്പനേരത്തേക്ക് പുറത്തേക്കു മാറ്റിനിർത്താൻ[b] അദ്ദേഹം കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇത് യഹൂദരുടെ പരമോന്നത ഭരണ-ന്യായാധിപ സമിതിയായ സൻഹെദ്രിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ആ പുരുഷന്മാരെ അല്പനേരം പുറത്തിരിക്കുമാറാക്കുക’ എന്നാണ്. കുറച്ചുസമയത്തേക്ക് അവരെ പുറത്തേക്കു മാറ്റിനിർത്താൻ കല്പിച്ചു എന്നതാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റു
  rationale: സഭയിൽ പരസ്യമായി സംസാരിക്കാനായി എഴുന്നേറ്റ ശാരീരിക പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് ഗമാലിയേലിന്റെ ഇടപെടലിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും കഥാഗതിയിലെ തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: τις ... Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: ഗമാലിയേൽ എന്നു പേരുള്ള ഒരു പരീശൻ
  rationale: പുതിയ വ്യക്തിയെ അനിശ്ചിതമായി പരിചയപ്പെടുത്തുന്ന τις-ന്റെ ഭാവവും പേരിനെ സൂചിപ്പിക്കുന്ന ὀνόματι എന്ന പ്രയോഗവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: συνεδρίῳ
  choice: ന്യായാധിപസഭയിൽ
  rationale: വിധിനിർണയാധികാരമുള്ള യഹൂദ ഭരണസഭയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സൻഹെദ്രിൻ’ എന്ന സാങ്കേതിക നാമം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: νομοδιδάσκαλος
  choice: ന്യായപ്രമാണം പഠിപ്പിച്ചിരുന്ന
  rationale: ഇവിടെ νόμος മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക സിവിൽ നിയമത്തിന്റെ അധ്യാപകൻ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: ജനങ്ങൾക്കെല്ലാം ആദരണീയനായിരുന്നു
  rationale: സകല ജനങ്ങളുടെയും ഇടയിൽ അദ്ദേഹത്തിനുണ്ടായിരുന്ന പൊതുമാന്യതയെ നേരായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: ന്യായാധിപസഭയിലെ അധികാരപൂർവമായ നിർദേശം എന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: അല്പനേരത്തേക്കു പുറത്തേക്കു മാറ്റിനിർത്താൻ
  rationale: ‘പുറത്താക്കുക’ എന്ന സ്ഥിരമായ പുറത്താക്കലിന്റെ ധ്വനി ഒഴിവാക്കി, കുറച്ചുസമയത്തേക്ക് സഭാമുറിയിൽനിന്ന് മാറ്റാനുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർത്ഥം നൽകുന്നു.
- source_word: τοὺς ἀνθρώπους
  choice: ആ പുരുഷന്മാരെ
  rationale: സന്ദർഭത്തിലെ പുരുഷ അപ്പൊസ്തലന്മാരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; പൊതുവായ മനുഷ്യവർഗത്തെ അല്ല.
theological_decisions:
- issue: τοὺς ἀνθρώπους എന്നതിലെ ലിംഗസൂചന
  choice: ആ പുരുഷന്മാരെ
  alternative: ആളുകളെ / അവരെ
  rationale: ഈ സന്ദർഭത്തിൽ ന്യായാധിപസഭയ്ക്കു മുമ്പിൽ നിന്നിരുന്ന പുരുഷ അപ്പൊസ്തലന്മാരാണ് ഉദ്ദേശ്യം; അതിനാൽ മൂലപാഠത്തിലെ സന്ദർഭാനുസൃത ലിംഗസൂചന മായ്ച്ചുകളയുന്നില്ല.
- issue: συνέδριον എന്ന സ്ഥാപനനാമം
  choice: ന്യായാധിപസഭ
  alternative: സൻഹെദ്രിൻ
  rationale: മൂലപദത്തിന്റെ പൊതുവായ സ്ഥാപനാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ചരിത്രപരമായ പ്രത്യേക നാമം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ന്യായപ്രമാണം’ എന്ന പദം തോറാ/മോശെയുടെ നിയമം എന്ന ബൈബിൾസന്ദർഭം നിലനിർത്തുന്നു; ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി.
