id: ACT.5.19
reference: Acts 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: ml
  text: 'എന്നാൽ രാത്രിയിൽ കർത്താവിന്റെ ഒരു ദൂതൻ തടവറയുടെ വാതിലുകൾ തുറന്ന് അവരെ പുറത്തുകൊണ്ടുവന്ന് പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: ഒരു ദൂതൻ
  rationale: പദം അനിർദിഷ്ടമായതിനാൽ ‘ഒരു’ എന്നു നൽകി. തടവറ തുറന്ന് അപ്പൊസ്തലന്മാരെ പുറത്തുകൊണ്ടുവരുന്ന സന്ദർഭം മനുഷ്യസന്ദേശവാഹകനെയല്ല, സ്വർഗീയദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവിക ബൈബിൾപ്രയോഗം ‘ദൂതൻ’ ആണ്.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ ദൈവസംബന്ധിയായ പരിഭാഷ ‘കർത്താവ്’ ആണ്; ‘കർത്താവിന്റെ ദൂതൻ’ എന്ന സ്ഥാപിത പ്രയോഗവും ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: διὰ νυκτός
  choice: രാത്രിയിൽ
  rationale: διά + ജനിറ്റീവ് ഇവിടെ സമയസൂചനയാണ്. ‘രാത്രിയിൽ’ എന്നത് ‘രാത്രിയുടെ സമയത്ത്’ എന്ന അർത്ഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἤνοιξε
  choice: തുറന്ന്
  rationale: ἀνοίγω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർത്ഥം ‘തുറക്കുക’ എന്നാണ്. ‘പൂട്ടുതുറന്ന്’ എന്നു പറഞ്ഞാൽ മൂലത്തിൽ ഇല്ലാത്ത വിശദാംശം ചേർക്കും.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: തടവറയുടെ വാതിലുകൾ
  rationale: ബഹുവചനമായ θύρας ‘വാതിലുകൾ’ എന്നും φυλακή ഈ സന്ദർഭത്തിൽ ‘തടവറ’ എന്നും സുതാര്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐξαγαγών
  choice: അവരെ പുറത്തുകൊണ്ടുവന്ന്
  rationale: ἐξάγω അവരെ പുറത്തേക്കു വരുത്തിയ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. ‘പുറത്തുകൊണ്ടുവന്ന്’ എന്നത് പങ്കാളിക്രിയയുടെ മുൻകാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τε
  choice: ക്രിയാശൃംഖലയിലൂടെ സൂചിപ്പിച്ചു
  rationale: τέ നൽകുന്ന മൃദുവായ ബന്ധം മലയാളത്തിലെ ‘തുറന്ന് … പുറത്തുകൊണ്ടുവന്ന് പറഞ്ഞു’ എന്ന തുടർച്ചയായ ക്രിയാഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; വേറൊരു ‘കൂടാതെ’ ചേർക്കുന്നത് ഭാരമുള്ളതാകും.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ λέγω എന്ന ക്രിയയ്ക്ക് ‘പറഞ്ഞു’ എന്നതാണ് സ്വാഭാവിക പരിഭാഷ. തുടർന്നുള്ള വാക്യത്തിലെ നേരിട്ടുള്ള വാക്കുകളിലേക്കു നയിക്കാൻ ദ്വിബിന്ദു ചേർത്തു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ ἄγγελος എന്നതിന്റെ സ്വഭാവം
  choice: സ്വർഗീയദൂതനെ സൂചിപ്പിക്കുന്ന ‘ദൂതൻ’
  alternative: മനുഷ്യസന്ദേശവാഹകൻ
  rationale: തടവറയുടെ വാതിലുകൾ തുറന്ന് തടവുകാരെ പുറത്തുകൊണ്ടുവരുന്ന അത്ഭുതപരമായ സന്ദർഭം സ്വർഗീയദൂതനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും പരിഭാഷയിൽ മൂലപദത്തിന്റെ സാധാരണ രൂപമായ ‘ദൂതൻ’ തന്നെയാണ് ഉപയോഗിച്ചത്.
- issue: κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ‘കർത്താവിന്റെ ദൂതൻ’ എന്ന ദൈവസംബന്ധിയായ പ്രയോഗത്തിൽ ‘കർത്താവ്’ ആണ് ഭാഷാപരമായും വേദപാരമ്പര്യപരമായും യോജിച്ച പരിഭാഷ; ‘യജമാനൻ’ ഇവിടെ തെറ്റായ മാനുഷിക അർത്ഥസൂചന നൽകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും അതേസമയം മാന്യമായും ആഖ്യാനത്തിന്റെ ഒഴുക്ക് നിലനിർത്തി. ഗ്രീക്കിലെ ക്രിയാക്രമം മലയാളത്തിലെ തുടർച്ചയായ ‘-ന്ന്’ ഘടനകൊണ്ട് സ്വാഭാവികമാക്കി. ഈ വാക്യത്തിന് പാഠവ്യത്യാസമോ നിർബന്ധമായ വിശദീകരണക്കുറിപ്പോ ആവശ്യമില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകളില്ല.
