  source_fidelity: The draft accurately represents the emphatic command, the prohibition on teaching in 'this name,' the perfect-force accusation that Jerusalem has been filled, and the idiom of bringing this man's blood upon the speakers. A minor adjustment improves the temporal force of the aorist command and the construction governing 'filled.'
