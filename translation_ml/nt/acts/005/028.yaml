  terminology: '''നാമത്തിൽ,'' ''ഉപദേശം,'' and ''ഈ മനുഷ്യന്റെ രക്തം'' appropriately preserve the source wording and register. In the note, ''രക്തക്കുറ്റം'' is a more direct and natural equivalent for bloodguilt than ''രക്തപാതകക്കുറ്റം.'''
