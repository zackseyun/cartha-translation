  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: ml
  text: “ഈ നാമത്തിൽ പഠിപ്പിക്കരുതെന്ന് ഞങ്ങൾ നിങ്ങൾക്കു കർശനമായി കല്പിച്ചില്ലയോ? എന്നിട്ടും നോക്കൂ, നിങ്ങൾ നിങ്ങളുടെ ഉപദേശംകൊണ്ട് യെരൂശലേമിനെ നിറച്ചിരിക്കുന്നു; ഈ മനുഷ്യന്റെ രക്തം ഞങ്ങളുടെമേൽ വരുത്താനാണ് നിങ്ങൾ ഉദ്ദേശിക്കുന്നത്.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ വ്യക്തമായി: ‘ഈ മനുഷ്യന്റെ മരണത്തിന് ഞങ്ങളെ ഉത്തരവാദികളാക്കുക.’ ‘ഈ മനുഷ്യന്റെ രക്തം’ ഞങ്ങളുടെമേൽ വരുത്തുക എന്ന ഗ്രീക്ക് പ്രയോഗം അവന്റെ മരണത്തിനുള്ള ഉത്തരവാദിത്വമോ രക്തക്കുറ്റമോ ഞങ്ങൾക്കു ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: അവൻ പറഞ്ഞു
  rationale: പുരുഷ ഏകവചന വർത്തമാന കൃദന്തരൂപം മുൻവാക്യത്തിലെ സംസാരിക്കുന്ന വ്യക്തിയുടെ വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്ര ക്രിയാവാക്യമായി നൽകി.
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: ഞങ്ങൾ നിങ്ങൾക്കു കർശനമായി കല്പിച്ചിരുന്നല്ലോ
  rationale: നാമവും അതേ ധാതുവിലുള്ള ക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ ‘കർശനമായി’ വഴി സ്വാഭാവിക മലയാളത്തിൽ കൈമാറുന്നു; ‘-ല്ലോ’ മുൻകല്പനയെ ഓർമ്മിപ്പിക്കുന്ന കുറ്റപ്പെടുത്തൽഭാവം പ്രകടമാക്കുന്നു.
- source_word: μὴ διδάσκειν
  choice: പഠിപ്പിക്കരുതെന്ന്
  rationale: കല്പനയുടെ ഉള്ളടക്കമായ നിരോധനം നേരിട്ട് നൽകുന്നു; ‘പഠിപ്പിക്കുന്നത് നിർത്തുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: ഈ നാമത്തിൽ
  rationale: ആ നാമത്തോടു ബന്ധപ്പെട്ട അധികാരത്തിൽ സംസാരിക്കുകയോ പ്രവർത്തിക്കുകയോ ചെയ്യുന്ന ആശയം നിലനിർത്തുന്ന, അപ്പൊസ്തലപ്രവൃത്തികളിലെ പ്രയോഗവുമായി പൊരുത്തപ്പെടുന്ന രൂപം.
- source_word: ἰδοὺ
  choice: എന്നിട്ടും നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതോടൊപ്പം ഏറ്റുമുട്ടൽഭാവവും നൽകുന്നു; സന്ദർഭത്തിലെ വിരുദ്ധത സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘എന്നിട്ടും’ ചേർത്തു.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: നിങ്ങൾ ... യെരൂശലേമിനെ നിറച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണമായ പ്രവർത്തിയുടെ ഇപ്പോഴത്തെ ഫലം സൂചിപ്പിക്കുന്ന perfect രൂപവും ‘നിറയ്ക്കുക’ എന്ന മൂലരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: നിങ്ങളുടെ ഉപദേശത്താൽ
  rationale: ‘നിറച്ചിരിക്കുന്നു’ എന്ന ക്രിയയോടൊപ്പം ഉള്ളടക്കമോ മാർഗമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; διδαχήയുടെ പഠിപ്പിക്കൽ/ഉപദേശം എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: βούλεσθε
  choice: നിങ്ങൾ ഉദ്ദേശിക്കുന്നത്
  rationale: ഇവിടത്തെ ഇച്ഛയോ ലക്ഷ്യമോ കുറ്റപ്പെടുത്തൽഭാവത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ആഗ്രഹിക്കുന്നു’ എന്നതിനെക്കാൾ പദ്ധതിപൂർവമായ ഉദ്ദേശം വ്യക്തമാക്കുന്നു.
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെമേൽ വരുത്താൻ
  rationale: ഒരാളുടെമേൽ എന്തെങ്കിലും കൊണ്ടുവരുക എന്ന ഗ്രീക്ക് ദൃശ്യരൂപവും ഉത്തരവാദിത്വം ചുമത്തുന്ന സൂചനയും നിലനിർത്തുന്നു.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: ഈ മനുഷ്യന്റെ രക്തം
  rationale: മരണത്തിനുള്ള ഉത്തരവാദിത്വം/രക്തപാതകക്കുറ്റം സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുന്നു; ‘ഈ മനുഷ്യൻ’ എന്ന അകലംപാലിക്കുന്ന പരാമർശവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഈ മനുഷ്യന്റെ രക്തം ഞങ്ങളുടെമേൽ വരുത്തുക’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: രക്തം ഞങ്ങളുടെമേൽ വരുത്തുക എന്ന മൂലരൂപകം പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ഈ മനുഷ്യന്റെ മരണത്തിന് ഞങ്ങളെ ഉത്തരവാദികളാക്കുക’ എന്ന് വ്യാഖ്യാനാത്മകമായി നൽകുക.
  rationale: ഈ പ്രയോഗം യേശുവിന്റെ മരണത്തിനുള്ള ഉത്തരവാദിത്വമോ രക്തപാതകക്കുറ്റമോ ചുമത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അർഥം പൂർണമായി തുറന്നുപറഞ്ഞ് മൂലപാഠത്തിലെ ദൃശ്യവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം ഇല്ലാതാക്കാതെ, വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നതാണ് ഉചിതം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കുറ്റപ്പെടുത്തൽഭാവം ‘-ല്ലോ’, ‘എന്നിട്ടും നോക്കൂ’ എന്നിവയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു. ‘ഈ നാമത്തിൽ’, ‘രക്തം ഞങ്ങളുടെമേൽ വരുത്തുക’ എന്നീ മൂലഭാഷയിലെ പ്രധാന രൂപങ്ങൾ വ്യാഖ്യാനിച്ച് മായ്ച്ചുകളയാതെ നിലനിർത്തി.
