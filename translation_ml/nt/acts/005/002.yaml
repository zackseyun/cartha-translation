  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: ml
  text: വിലത്തുകയിൽനിന്ന് ഒരു ഭാഗം അയാൾ തനിക്കായി രഹസ്യമായി മാറ്റിവെച്ചു[a]; അയാളുടെ ഭാര്യയ്ക്കും ഇത് അറിയാമായിരുന്നു. പിന്നെ അയാൾ ഒരു ഭാഗം കൊണ്ടുവന്ന് അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ[b] വെച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിലത്തുകയിൽനിന്ന് തനിക്കായി ഒളിച്ചുവെച്ചു.’ ഗ്രീക്ക് ക്രിയയിൽ വഞ്ചനാപരമായി തനിക്കായി പിടിച്ചുവെക്കുക എന്ന ഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അപ്പൊസ്തലന്മാരുടെ മുമ്പിൽ വെച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം; മൂലപാഠത്തിൽ അക്ഷരാർഥത്തിൽ ‘അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: തനിക്കായി രഹസ്യമായി മാറ്റിവെച്ചു
  rationale: ക്രിയയിൽ തനിക്കായി ഒളിച്ചുവെക്കുകയോ കയ്യടക്കിവെക്കുകയോ ചെയ്യുന്ന വഞ്ചനാത്മക ഭാവമുണ്ട്. ‘രഹസ്യമായി’ ആ ഭാവം വ്യക്തമാക്കുന്നു; ‘മോഷ്ടിച്ചു’ എന്നു പറഞ്ഞ് നിയമപരമായ അർഥം അമിതമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἀπὸ τῆς τιμῆς
  choice: വിലത്തുകയിൽനിന്ന്
  rationale: ഇവിടെ τιμή വിറ്റുകിട്ടിയ തുകയെ സൂചിപ്പിക്കുന്നു. ‘വിലത്തുക’ മൂലപദത്തോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: അയാളുടെ ഭാര്യയ്ക്കും ഇത് അറിയാമായിരുന്നു
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് അനുബന്ധ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ഭാര്യ ഈ പ്രവൃത്തിയെക്കുറിച്ച് അറിഞ്ഞിരുന്നു എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; καί ‘-ക്കും’ എന്നതിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: ἐνέγκας μέρος τι
  choice: ഒരു ഭാഗം കൊണ്ടുവന്ന്
  rationale: അനിശ്ചിതമായ ഒരു വിഹിതത്തെയും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പങ്കാളിത്തക്രിയയെയും ചുരുക്കമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: അപ്പൊസ്തലന്മാരുടെ കാൽക്കൽ വെച്ചു
  rationale: പണത്തെ അപ്പൊസ്തലന്മാരുടെ മുമ്പിൽ സമർപ്പിക്കുന്ന പ്രവൃത്തിയുടെ ദൃശ്യരൂപം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷയാണിത്.
theological_decisions:
- issue: അനന്യാസിന്റെ പ്രവൃത്തിയുടെ ധാർമിക സ്വഭാവം
  choice: നിഷ്പക്ഷമായി ഒരു ഭാഗം കൈവശംവെച്ചു എന്നല്ല, തനിക്കായി രഹസ്യമായി മാറ്റിവെച്ചു എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: വിലത്തുകയിൽനിന്ന് ഒരു ഭാഗം സൂക്ഷിച്ചുവെച്ചു
  rationale: νοσφίζομαι എന്ന ക്രിയയും വിവരണസന്ദർഭവും വഞ്ചനാപരമായ ഒളിച്ചുവെക്കലിനെ സൂചിപ്പിക്കുന്നു. അതേസമയം ‘മോഷ്ടിച്ചു’ എന്ന ശക്തമായ നിയമപരമായ വ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; സംഭവക്രമവും അർഥബന്ധവും നിലനിർത്തി.
