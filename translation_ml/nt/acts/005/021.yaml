id: ACT.5.21
reference: Acts 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: ml
  text: അവർ അതു കേട്ടപ്പോൾ, പുലർച്ചെ ദേവാലയാങ്കണത്തിൽ പ്രവേശിച്ച് പഠിപ്പിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ മഹാപുരോഹിതനും അദ്ദേഹത്തോടൊപ്പമുള്ളവരും എത്തിയപ്പോൾ, അവർ സൻഹെദ്രിൻ സഭയെയും ഇസ്രായേൽമക്കളുടെ മൂപ്പന്മാരുടെ മുഴുവൻ സമിതിയെയും[a] വിളിച്ചുകൂട്ടി; അവരെ കൊണ്ടുവരാനായി കാരാഗൃഹത്തിലേക്ക് ആളുകളെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിന്റെ മുഴുവൻ സമിതിയെയും” അല്ലെങ്കിൽ “ഇസ്രായേലിലെ മൂപ്പന്മാരുടെ മുഴുവൻ സംഘത്തെയും.”
    reason: γερουσία എന്നതിന് ‘മൂപ്പന്മാരുടെ സമിതി/സംഘം’ എന്നും കൂടുതൽ പൊതുവായി ‘സമിതി’ എന്നും അർഥമാകാം; τῶν υἱῶν Ἰσραήλ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ‘ഇസ്രായേലിന്റെ’ എന്നും നൽകാം.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: അവർ അതു കേട്ടപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ ദൂതന്റെ കല്പനയിലേക്കു വിരൽചൂണ്ടുന്ന കാലസൂചകമായ ഭൂതകാല കൃദന്തരൂപം; സംഭവക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: പുലർച്ചെ
  rationale: പ്രഭാതാരംഭസമയത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: εἰς τὸ ἱερὸν
  choice: ദേവാലയാങ്കണത്തിൽ പ്രവേശിച്ച്
  rationale: ἱερόν വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേവാലയാങ്കണം’ സാധാരണ വായനക്കാർക്ക് ഈ വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: ἐδίδασκον
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: Παραγενόμενος
  choice: എത്തി
  rationale: അടുത്ത സംഭവത്തിലേക്കുള്ള കാലക്രമപരമായ നീക്കം ലളിതമായി നൽകുന്നു.
- source_word: οἱ σὺν αὐτῷ
  choice: അദ്ദേഹത്തോടൊപ്പമുള്ളവർ
  rationale: കൂടെ വന്നവരുടെ കൃത്യമായ തിരിച്ചറിയൽ ഗ്രീക്ക് പാഠം നൽകാത്തതിനാൽ അതിലധികം പ്രത്യേകത ചേർക്കുന്നില്ല.
- source_word: συνεκάλεσαν
  choice: വിളിച്ചുകൂട്ടി
  rationale: ഒരു ഔദ്യോഗിക സംഘത്തെ സമ്മേളിപ്പിക്കാൻ വിളിക്കുന്നതെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ συνέδριον
  choice: സൻഹെദ്രിൻ സഭ
  rationale: യഹൂദരുടെ ഭരണ-ന്യായാധികാര സമിതിയുടെ ചരിത്രപരമായ പേര് നിലനിർത്തുകയും ‘സഭ’ ചേർത്ത് വായനക്കാർക്ക് അതിന്റെ സ്വഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: ഇസ്രായേൽമക്കളുടെ മൂപ്പന്മാരുടെ മുഴുവൻ സമിതി
  rationale: γερουσία എന്ന മൂപ്പന്മാരുടെ ഔദ്യോഗിക സമിതിയെന്ന ആശയവും τῶν υἱῶν Ἰσραήλ എന്ന കുടുംബ-ദേശീയ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: δεσμωτήριον
  choice: കാരാഗൃഹം
  rationale: തടവിൽ പാർപ്പിക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള സാധാരണ മലയാളപദം.
- source_word: ἀχθῆναι αὐτούς
  choice: അവരെ കൊണ്ടുവരാൻ
  rationale: ‘അയച്ചു’ എന്ന ക്രിയയോടു ചേർന്ന നിഷ്ക്രിയ അനന്തക്രിയയുടെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഉദ്യോഗസ്ഥരെ അയച്ചുവെന്നത് ‘ആളയച്ചു’ എന്ന പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ എന്ന ദേശീയ-കുടുംബപരമായ പ്രയോഗം
  choice: ഇസ്രായേൽമക്കളുടെ
  alternative: ഇസ്രായേലിന്റെ / ഇസ്രായേല്യരുടെ
  rationale: ഗ്രീക്കിലെ ‘മക്കൾ’ എന്ന വ്യക്തമായ കുടുംബരൂപകം നിലനിർത്തുന്നു; ഇവിടെ അത് പരമ്പരാഗത ദേശീയസംജ്ഞയായി പ്രവർത്തിക്കുന്നുവെങ്കിലും അതിനെ പൂർണമായി സമതലപ്പെടുത്തുന്നില്ല.
- issue: συνέδριον, γερουσία എന്നീ രണ്ടു സമിതിപദങ്ങളുടെ ബന്ധം
  choice: സൻഹെദ്രിൻ സഭയെയും ... മൂപ്പന്മാരുടെ മുഴുവൻ സമിതിയെയും
  alternative: സൻഹെദ്രിൻ സഭയെ, അതായത് ഇസ്രായേലിന്റെ മുഴുവൻ മൂപ്പൻസമിതിയെ
  rationale: καί മൂലം പാഠത്തിൽ കാണുന്ന കൂട്ടിച്ചേർക്കൽ നിലനിർത്തുന്നു; രണ്ടാമത്തേത് ആദ്യത്തേതിന്റെ വിശദീകരണമാണെന്ന് നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചരിത്രപദമായ ‘സൻഹെദ്രിൻ’ വിശദീകരണസഹിതം നിലനിർത്തി; ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധം അർധവിരാമത്തിലൂടെ വ്യക്തമായി സൂക്ഷിച്ചു.
