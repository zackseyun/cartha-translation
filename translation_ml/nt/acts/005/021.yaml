revisions:
- from: അവർ അതു കേട്ടപ്പോൾ, പുലർച്ചെ ദേവാലയാങ്കണത്തിൽ പ്രവേശിച്ച് പഠിപ്പിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ മഹാപുരോഹിതനും അദ്ദേഹത്തോടൊപ്പമുള്ളവരും എത്തി, സൻഹെദ്രിൻ സഭയെയും ഇസ്രായേൽമക്കളുടെ മൂപ്പന്മാരുടെ മുഴുവൻ സമിതിയെയും[a] വിളിച്ചുകൂട്ടി; അവരെ കൊണ്ടുവരാൻ കാരാഗൃഹത്തിലേക്ക് ആളയച്ചു.
  to: അവർ അതു കേട്ടപ്പോൾ, പുലർച്ചെ ദേവാലയാങ്കണത്തിൽ പ്രവേശിച്ച് പഠിപ്പിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ മഹാപുരോഹിതനും അദ്ദേഹത്തോടൊപ്പമുള്ളവരും എത്തിയപ്പോൾ, അവർ സൻഹെദ്രിൻ സഭയെയും ഇസ്രായേൽമക്കളുടെ മൂപ്പന്മാരുടെ മുഴുവൻ സമിതിയെയും[a] വിളിച്ചുകൂട്ടി; അവരെ കൊണ്ടുവരാനായി കാരാഗൃഹത്തിലേക്ക് ആളുകളെ അയച്ചു.
