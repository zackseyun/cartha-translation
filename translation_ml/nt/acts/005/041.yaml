id: ACT.5.41
reference: Acts 5:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: ml
  text: അങ്ങനെ അവർ ന്യായസഭയുടെ സന്നിധിയിൽനിന്ന് പുറപ്പെട്ടുപോയി; നാമത്തിനുവേണ്ടി അപമാനിക്കപ്പെടാൻ തങ്ങൾ യോഗ്യരായി കണക്കാക്കപ്പെട്ടതിൽ സന്തോഷിച്ചുകൊണ്ട്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: പുറപ്പെട്ടുപോയി
  rationale: അപൂർണ ഭൂതകാലരൂപം സഭയുടെ സന്നിധിയിൽനിന്നുള്ള അവരുടെ നീക്കത്തെ കഥയുടെ ഒഴുക്കിൽ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പുറപ്പെട്ടുപോയി’ സ്വാഭാവികമായി അകന്നുപോകുന്ന ആശയം നൽകുന്നു.
- source_word: χαίροντες
  choice: അവർ ആനന്ദിച്ചു
  rationale: അവർ പോകുമ്പോഴുണ്ടായിരുന്ന സന്തോഷത്തെ സമകാലിക അനുബന്ധപ്രവൃത്തിയായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിനായി സ്വതന്ത്ര ക്രിയയായി നൽകിയിരിക്കുന്നു.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: ന്യായാധിപസഭയുടെ സന്നിധിയിൽനിന്ന്
  rationale: ‘മുഖം/സന്നിധി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഔപചാരിക ഭാവം ‘സന്നിധിയിൽനിന്ന്’ നിലനിർത്തുന്നു; συνέδριον എന്ന ഭരണ-ന്യായസഭയെ ‘ന്യായാധിപസഭ’ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: κατηξιώθησαν
  choice: യോഗ്യരായി കണക്കാക്കപ്പെട്ടതിൽ
  rationale: ദൈവിക കർത്താവിനെ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗവും യോഗ്യത വിലയിരുത്തപ്പെട്ടുവെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: ഇവിടെ നാമവുമായി ബന്ധപ്പെട്ട കാരണമോ അതിനുവേണ്ടിയുള്ള സഹനമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: τοῦ ὀνόματος
  choice: നാമം
  rationale: ഗ്രീക്കിലെ ആദരസൂചകമായ കേവലപ്രയോഗം നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ ‘യേശുവിന്റെ നാമം’ എന്നു പരസ്യമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: ἀτιμασθῆναι
  choice: അപമാനം ഏൽക്കാൻ
  rationale: മാനനഷ്ടത്തിന് വിധേയരാക്കപ്പെടുക എന്ന കർമണി ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘നാമം’ എന്നതിന്റെ കേവലപ്രയോഗം
  choice: മുഖ്യപാഠത്തിൽ ‘നാമം’ എന്നു മാത്രം നിലനിർത്തുക
  alternative: ‘യേശുവിന്റെ നാമം’ അല്ലെങ്കിൽ ‘അവന്റെ നാമം’
  rationale: τοῦ ὀνόματος എന്ന ഗ്രീക്ക് പദസമുച്ചയം ആദരസൂചകമായ സംക്ഷിപ്തപ്രയോഗമാണ്. സന്ദർഭത്തിൽ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം ആ പേര് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഉറവിടപാഠത്തിലെ സൂചനാത്മകതയും ദൈവശാസ്ത്രപരമായ ഭാവവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സന്നിധി,’ ‘നാമം’ എന്നീ പദങ്ങൾ ഉറവിടത്തിലെ ഔപചാരികവും ആദരസൂചകവുമായ ഭാവം നിലനിർത്തുന്നു; ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമീകരിച്ചിരിക്കുന്നു.
