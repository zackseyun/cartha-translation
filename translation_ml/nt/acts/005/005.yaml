    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അന്ത്യശ്വാസം വിട്ടു” അല്ലെങ്കിൽ “പ്രാണൻ വിട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούων
  choice: കേട്ടപ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ഇവിടെ സമയബന്ധം സൂചിപ്പിക്കുന്നു; സംഭവക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പത്രോസിന്റെ വാക്കുകൾക്കുശേഷമുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനത്തിലെ വഴിത്തിരിവും നിലനിർത്തുന്നു.
- source_word: λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: സന്ദർഭത്തിൽ പത്രോസ് പറഞ്ഞ വാക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലപദത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: πεσὼν
  choice: നിലത്തുവീണ്
  rationale: പ്രധാനക്രിയയ്ക്കു തൊട്ടുമുമ്പുള്ള ശാരീരിക പ്രവൃത്തി നേരിട്ട് ചിത്രീകരിക്കുന്നു; ‘കുഴഞ്ഞുവീണ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἐξέψυξεν
