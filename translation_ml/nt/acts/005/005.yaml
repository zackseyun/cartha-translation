  source_fidelity: The draft accurately conveys the temporal force of ἀκούων, the death denoted by ἐξέψυξεν, and the great fear coming upon all the hearers. However, «നിലത്തുവീണ്» explicitly adds ‘to the ground,’ whereas πεσών states only that Ananias fell. The addition is plausible in context but is not necessary and should be avoided for closer source fidelity.
