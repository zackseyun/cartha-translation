base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: ml
  text: എന്നാൽ ഈ വാക്കുകൾ കേട്ടപ്പോൾ അനന്യാസ് വീണു മരിച്ചു.[a] കേട്ട എല്ലാവരെയും വലിയ ഭയം പിടികൂടി.
  philosophy: optimal-equivalence
  footnotes:
