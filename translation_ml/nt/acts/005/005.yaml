  rationale: ആഖ്യാനസന്ദർഭത്തിലെ അർഥം വ്യക്തമായി നൽകുന്നു; ശ്വാസം വിടുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ ദൃശ്യഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐγένετο φόβος μέγας ἐπὶ πάντας
  choice: എല്ലാവരെയും വലിയ ഭയം പിടികൂടി
  rationale: ഭയം അവരെ ശക്തമായി ആവരണം ചെയ്തുവെന്ന ആശയം ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലിയിൽ നൽകുന്നു.
- source_word: τοὺς ἀκούοντας
  choice: കേട്ട എല്ലാവരെയും
  rationale: എന്താണ് അവർ കേട്ടതെന്ന് മൂലവാക്യം വീണ്ടും വ്യക്തമാക്കാത്തതിനാൽ മലയാളത്തിലും അനാവശ്യമായി കർമം ചേർക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: Ἁνανίας
  choice: അനന്യാസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: അനന്യാസിന്റെ മരണത്തിന്റെ സ്വഭാവവും കാരണവും
  choice: അവൻ നിലത്തുവീണ് മരിച്ചുവെന്ന് ആഖ്യാനം പറയുന്നതുപോലെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; മരണത്തിന്റെ പ്രവർത്തനരീതി വ്യക്തമാക്കുന്നില്ല.
  alternative: ദൈവം നേരിട്ട് അവനെ അടിച്ചുകൊന്നു എന്നോ ഞെട്ടലാൽ സ്വാഭാവികമായി മരിച്ചു എന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വീഴ്ചയും മരണവും പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും മൗനവും അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘നിലത്തുവീണ്’ എന്നത് ദൃശ്യഭാവവും ‘ഭയം പിടികൂടി’ എന്നത് സംഭവത്തിന്റെ ശക്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
