id: ACT.5.15
reference: Acts 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: ml
  text: അങ്ങനെ, പത്രോസ് കടന്നുപോകുമ്പോൾ അദ്ദേഹത്തിന്റെ നിഴലെങ്കിലും അവരിൽ ആരുടെയെങ്കിലും മേൽ വീഴുമാറ്, അവർ രോഗികളെ തെരുവുകളിലേക്കുപോലും പുറത്തുകൊണ്ടുവന്ന് കിടക്കകളിലും പായകളിലും[a] കിടത്തി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചെറിയ കിടക്കകളിലും കിടപ്പുപായകളിലും.’ ഇവിടെ ഗ്രീക്ക് പദങ്ങൾ രണ്ടുതരം കിടപ്പുപകരണങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഇവിടെ പറയുന്നത് ജനങ്ങളുടെ ഉദ്ദേശ്യമാണ്: പത്രോസ് കടന്നുപോകുമ്പോൾ അദ്ദേഹത്തിന്റെ നിഴലെങ്കിലും രോഗികളിൽ ആരുടെയെങ്കിലും മേൽ വീഴുമാറ് അവർ അവരെ കിടത്തി. നിഴൽ തന്നെയാണ് സൗഖ്യമാക്കിയതെന്ന് ഈ വാക്യം വ്യക്തമായി പറയുന്നില്ല.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച അപ്പൊസ്തലന്മാരുടെ വർധിച്ച സ്വാധീനത്തിന്റെ ഫലമാണ് തുടർന്നുള്ള പ്രവൃത്തി എന്നു സൂചിപ്പിക്കുന്ന consecutive force സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ εἰς τὰς πλατείας
  choice: തെരുവുകളിലേക്കുപോലും
  rationale: καί നൽകുന്ന ഊന്നൽ ‘പോലും’ കൊണ്ട് നിലനിർത്തുന്നു; πλατεῖαι വിശാലമായ തെരുവുകളെയോ പൊതുസ്ഥലങ്ങളെയോ സൂചിപ്പിക്കാം.
- source_word: ἐκφέρειν τοὺς ἀσθενεῖς
  choice: രോഗികളെ ... പുറത്തുകൊണ്ടുവന്ന്
  rationale: സൗഖ്യസന്ദർഭത്തിൽ ἀσθενεῖς രോഗികളെയാണ് സൂചിപ്പിക്കുന്നത്; ἐκφέρειν അവരെ വീടുകളിൽനിന്ന് പൊതുസ്ഥലത്തേക്ക് കൊണ്ടുവരുന്ന പ്രവൃത്തിയാണ്.
- source_word: τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων
  choice: കിടക്കകളിലും പായകളിലും കിടത്തി
  rationale: രണ്ടുതരം കിടപ്പുപകരണങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിലനിർത്തുന്നു; അവയുടെ കൃത്യമായ രൂപം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐρχομένου Πέτρου
  choice: പത്രോസ് അതുവഴി കടന്നുപോകുമ്പോൾ
  rationale: genitive absolute സൂചിപ്പിക്കുന്ന, സമീപത്തുകൂടി കടന്നുപോകുന്ന പുരോഗമനപ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: κἂν ἡ σκιὰ ἐπισκιάσῃ τινὶ αὐτῶν
  choice: അദ്ദേഹത്തിന്റെ നിഴലെങ്കിലും അവരിൽ ആരുടെയെങ്കിലും മേൽ വീഴേണ്ടതിന്
  rationale: κἄν-ന്റെ ‘നിഴലെങ്കിലും’ എന്ന കുറഞ്ഞ പ്രതീക്ഷയിലുള്ള ഊന്നലും, τινὶ αὐτῶν എന്ന ഏകവചന അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു. മലയാളത്തിൽ നിഴൽ ‘മേൽ വീഴുക’ എന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പത്രോസിന്റെ നിഴലിന് സ്വതവേ സൗഖ്യമാക്കുന്ന ശക്തിയുണ്ടായിരുന്നുവെന്ന് വാക്യം പ്രസ്താവിക്കുന്നുണ്ടോ
  choice: ജനങ്ങൾ രോഗികളെ അങ്ങനെ കിടത്തിയതിന്റെ ഉദ്ദേശ്യം മാത്രമായി വിവർത്തനം ചെയ്തു; നിഴൽ സൗഖ്യമാക്കിയെന്ന് വാക്യം തന്നെ പ്രസ്താവിക്കുന്നതായി എഴുതിയില്ല.
  alternative: പത്രോസിന്റെ നിഴൽ രോഗികളെ സൗഖ്യമാക്കുമെന്നോ സൗഖ്യമാക്കിയെന്നോ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഭാഷ.
  rationale: ἵνα + subjunctive ജനങ്ങളുടെ ഉദ്ദേശിച്ച ഫലത്തെ അവതരിപ്പിക്കുന്നു. വിശാലസന്ദർഭം അനേകം സൗഖ്യങ്ങൾ വിവരിച്ചാലും, ഈ വാക്യം നിഴൽ തന്നെയാണ് സൗഖ്യം വരുത്തിയതെന്ന് വ്യക്തമായി പറയുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവർത്തനം. ‘തെരുവുകളിലേക്കുപോലും’ ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘നിഴൽ മേൽ വീഴുക’ എന്ന പ്രയോഗം പദാനുപദമായ കൃത്രിമത്വം ഒഴിവാക്കി അർത്ഥം നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
