translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആഖ്യാനശൈലി. ‘ദൈവാലയസേനാധിപൻ’ ഔദ്യോഗിക പദവിയെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു; അത് ഫലത്തെ സൂചിപ്പിക്കുന്ന അവസാന പ്രയോഗത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്.
