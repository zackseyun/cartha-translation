base_translation:
  language: en
  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: ml
  text: 'ദൈവാലയത്തിന്റെ സേനാധിപനും മുഖ്യപുരോഹിതന്മാരും ഈ വാക്കുകൾ കേട്ടപ്പോൾ, അവയെക്കുറിച്ച് ആകെ ആശയക്കുഴപ്പത്തിലായിരുന്നു: ഇത് എന്തിലേക്കു നയിക്കുമെന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതിൽനിന്ന് എന്തു സംഭവിക്കുമെന്നു.” ഗ്രീക്ക് പ്രയോഗം ഈ സാഹചര്യത്തിന്റെ പരിണതിയെയോ ഫലത്തെയോ കുറിച്ചാണ് ചോദിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: കേട്ടപ്പോൾ
  rationale: ὡς എന്നതിന്റെ കാലസൂചന സ്വാഭാവികമായ മലയാള ഉപവാക്യത്തിൽ നൽകുന്നു; δέയുടെ ആഖ്യാനബന്ധം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ പ്രത്യേകം പദമാക്കുന്നില്ല.
- source_word: τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: മുമ്പ് ലഭിച്ച അറിയിപ്പിനെയാണ് λόγους സൂചിപ്പിക്കുന്നത്; മൂലരൂപത്തോട് അടുത്തതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: ദൈവാലയസേനാധിപൻ
  rationale: ദൈവാലയപരിസരത്തിലെ സുരക്ഷാസേനയുടെ ചുമതലയുള്ള ഔദ്യോഗിക കമാൻഡറെയാണ് στρατηγός സൂചിപ്പിക്കുന്നത്.
- source_word: οἱ ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: രണ്ടാം ദൈവാലയകാലത്തെ പുരോഹിതനേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചനം; ഒരേസമയം പല മഹാപുരോഹിതന്മാർ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: διηπόρουν
  choice: ആകെ ആശയക്കുഴപ്പത്തിലായി
  rationale: διαπορέω ശക്തമായ അനിശ്ചിതത്വവും പരിഭ്രമവും സൂചിപ്പിക്കുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ നിലനിൽക്കുന്ന അവസ്ഥ മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി പ്രകടമാക്കുന്നു.
- source_word: περὶ αὐτῶν
  choice: അവയെക്കുറിച്ച്
  rationale: സർവനാമത്തിന്റെ അനിശ്ചിത സൂചന നിലനിർത്തുന്നു; അത് വാക്കുകളെയോ അവയിൽ അറിയിച്ച സംഭവങ്ങളെയോ സൂചിപ്പിക്കാം.
- source_word: τί ἂν γένοιτο τοῦτο
  choice: ഇതെന്തിലേക്കു നയിക്കുമെന്നു
  rationale: ἄν സഹിതമുള്ള optative ഫലത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഭാവിഫലത്തെ സ്വാഭാവികമായി ചോദ്യം ചെയ്യുന്ന രൂപം.
