source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: ml
  text: എന്നാൽ മഹാപുരോഹിതനും അദ്ദേഹത്തോടൊപ്പമുണ്ടായിരുന്ന എല്ലാവരും—അതായത്, സദൂക്യരുടെ കക്ഷി[a]—എഴുന്നേറ്റ് അസൂയകൊണ്ട്[b] നിറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സദൂക്യരുടെ വിഭാഗം.’ ഗ്രീക്ക് പദം ഒരു കക്ഷിയെയോ മതവിഭാഗത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അസൂയ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ‘തീക്ഷ്ണത’ അല്ലെങ്കിൽ ‘ഉത്സാഹം’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ സന്ദർഭം ശത്രുതാപരമായ അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: ἀνίστημι എന്ന ക്രിയയുടെ ഈ കൃതന്തപ്രയോഗം നിർണായകമായ നടപടിയിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേറ്റ്’ എന്നത് അതിന്റെ ആഖ്യാനബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ജനങ്ങളുടെ അനുകൂല പ്രതികരണത്തോട് ഇവിടെ കാണുന്ന നേരിയ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഏകവചനത്തിലുള്ള ഈ ഔദ്യോഗിക പദവിക്ക് മലയാളത്തിൽ സ്ഥാപിതവും കൃത്യവുമായ തുല്യപദം.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: അദ്ദേഹത്തോടൊപ്പമുണ്ടായിരുന്ന എല്ലാവരും
  rationale: മഹാപുരോഹിതനോടു ചേർന്നുനിന്ന സംഘത്തെ അവരുടെ കൃത്യമായ ഔദ്യോഗിക നില അനുമാനിക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: അതായത്, സദൂക്യരുടെ കക്ഷിക്കാർ
  rationale: ഈ സമാനാധികരണപ്രയോഗം മുമ്പ് പറഞ്ഞവരെ സദൂക്യരുടെ വിഭാഗത്തിൽപ്പെട്ടവരായി തിരിച്ചറിയിക്കുന്നു. αἵρεσις ഇവിടെ പിൽക്കാലത്തെ ‘മതവിരുദ്ധോപദേശം’ എന്ന അർഥമല്ല; ഒരു മത-സാമൂഹിക കക്ഷിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπλήσθησαν
  choice: നിറഞ്ഞു
  rationale: πίμπλημι എന്ന ക്രിയയുടെ കർമണിപ്രയോഗവും ജനിറ്റീവ് പൂരകവും ചേർന്ന ‘കൊണ്ട് നിറയുക’ എന്ന പ്രയോഗരീതി നിലനിർത്തുന്നു.
- source_word: ζήλου
  choice: അസൂയകൊണ്ട്
  rationale: ζῆλος എന്ന പദത്തിന് ‘തീക്ഷ്ണത/ഉത്സാഹം’ എന്നും അർഥമുണ്ടെങ്കിലും, അപ്പൊസ്തലന്മാരോടുള്ള ശത്രുതാപരമായ പ്രതികരണമാണ് ഇവിടെ നിഷേധാത്മകമായ ‘അസൂയ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നത്.
theological_decisions:
- issue: αἵρεσις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കക്ഷി
  alternative: വിഭാഗം; മതവിഭാഗം
  rationale: രണ്ടാം ദേവാലയകാല യഹൂദമതത്തിനുള്ളിലെ തിരിച്ചറിയപ്പെട്ട ഒരു കൂട്ടായ്മയെയാണ് പദം സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സഭാപരമായ ‘മതവിരുദ്ധത’ എന്ന ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: ζῆλος എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: അസൂയ
  alternative: തീക്ഷ്ണത; ഉത്സാഹം; ഈർഷ്യ
  rationale: മൂലപദത്തിന് അനുകൂലമോ പ്രതികൂലമോ ആയ അർഥം വരാം. ഇവിടെ അപ്പൊസ്തലന്മാർക്കെതിരായ തുടർനടപടി പ്രതികൂലമായ വികാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അസൂയ’ തിരഞ്ഞെടുത്തു; അടിസ്ഥാനപദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും സമാനാധികരണ വിശദീകരണവും ‘നിറഞ്ഞു’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
