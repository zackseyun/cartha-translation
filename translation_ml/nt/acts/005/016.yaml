  to: യെരൂശലേമിനു ചുറ്റുമുള്ള പട്ടണങ്ങളിൽനിന്നുള്ള ജനക്കൂട്ടവും വന്നുകൂടിക്കൊണ്ടിരുന്നു[a], രോഗികളെയും അശുദ്ധാത്മാക്കളാൽ പീഡിപ്പിക്കപ്പെട്ടവരെയും[b] കൊണ്ടുവന്നുകൊണ്ട്; അവരെല്ലാവരും സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു.
  rationale: മുഖ്യവാക്യത്തിലെ ‘ജനക്കൂട്ടവും’ καί-യുടെ ‘also/even’ എന്ന ചേർക്കൽഭാവം വ്യക്തമാക്കുന്നു. ‘കൊണ്ടുവന്നുകൊണ്ട്’ φέροντες എന്ന സമകാലിക പങ്കുപ്രയോഗത്തെ ‘വന്നുകൂടിക്കൊണ്ടിരുന്നു’ എന്ന അപൂർണ്ണഭൂതകാല ക്രിയയോടു ബന്ധിപ്പിക്കുന്നു. മറ്റെല്ലാ അർഥഘടകങ്ങളും അടിക്കുറിപ്പ് ആങ്കറുകളും നിലനിർത്തിയിരിക്കുന്നു.
