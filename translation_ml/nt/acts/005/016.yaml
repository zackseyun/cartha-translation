  source_fidelity: 'പ്രധാന അർഥഘടകങ്ങൾ ശരിയായി പ്രതിഫലിക്കുന്നു: യെരൂശലേമിനു ചുറ്റുമുള്ള പട്ടണങ്ങളിൽനിന്നുള്ള ജനക്കൂട്ടം, രോഗികൾ, അശുദ്ധാത്മാക്കളാൽ ബാധിക്കപ്പെട്ടവർ, എല്ലാവരുടെയും സൗഖ്യം എന്നിവയെല്ലാം ഉൾപ്പെട്ടിരിക്കുന്നു. എന്നാൽ φέροντες മുഖ്യക്രിയയായ συνήρχετο-യോടു ചേർന്ന വർത്തമാനകാല പങ്കുപ്രയോഗമാണ്; അതിനെ പുതിയ വാക്യത്തിൽ ലളിതഭൂതകാലമായ ‘അവർ ... കൊണ്ടുവന്നു’ എന്നു വേർതിരിക്കുന്നത് ബന്ധവും അപൂർണ്ണഭൂതകാലത്തിന്റെ ദൃശ്യഭാവവും അല്പം മങ്ങിക്കുന്നു.'
  naturalness: നിലവിലെ മലയാളം പൊതുവേ സ്വാഭാവികമാണ്. എന്നിരുന്നാലും ‘ജനക്കൂട്ടവും വന്നുകൂടിക്കൊണ്ടിരുന്നു, രോഗികളെയും ... കൊണ്ടുവന്നുകൊണ്ട്’ എന്ന ഘടന ഗ്രീക്ക് വാക്യഘടനയെയും ആധുനിക മാന്യമായ ആഖ്യാനശൈലിയെയും കൂടുതൽ സ്വാഭാവികമായി പിന്തുടരുന്നു. ‘പീഡിപ്പിക്കപ്പെട്ടവർ’ എന്നതും സ്വീകര്യമാണ്.
