id: ACT.5.16
reference: Acts 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: ml
  text: യെരൂശലേമിനു ചുറ്റുമുള്ള പട്ടണങ്ങളിൽനിന്നുള്ള ജനക്കൂട്ടവും വന്നുകൂടിക്കൊണ്ടിരുന്നു[a], രോഗികളെയും അശുദ്ധാത്മാക്കളാൽ പീഡിപ്പിക്കപ്പെട്ടവരെയും[b] കൊണ്ടുവന്നുകൊണ്ട്; അവരെല്ലാവരും സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെരൂശലേമിനു ചുറ്റുമുള്ള പട്ടണങ്ങളിൽനിന്നുള്ള ജനക്കൂട്ടവും ഒത്തുകൂടിക്കൊണ്ടിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അശുദ്ധാത്മാക്കളാൽ ബുദ്ധിമുട്ടിക്കപ്പെട്ടവരെയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: വന്നുകൂടിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായോ ആവർത്തിച്ചോ നടന്ന പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ πλῆθος
  choice: ജനക്കൂട്ടം
  rationale: വലിയൊരു ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടവാചകത്തിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പദം.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: യെരൂശലേമിനു ചുറ്റുമുള്ള പട്ടണങ്ങളിൽനിന്നും
  rationale: യെരൂശലേമിന്റെ സമീപപ്രദേശങ്ങളിലെ ജനവാസകേന്ദ്രങ്ങളിൽനിന്നുള്ള വരവ് എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: φέροντες
  choice: കൊണ്ടുവന്നു
  rationale: ബാധിതരായ ആളുകളെ അപ്പൊസ്തലന്മാരുടെ അടുക്കൽ എത്തിച്ചതിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀσθενεῖς
  choice: രോഗികളെ
  rationale: രോഗശാന്തിയുടെ സന്ദർഭത്തിൽ ശാരീരികമായി രോഗബാധിതരായവരെ സൂചിപ്പിക്കുന്നു.
- source_word: ὀχλουμένους
  choice: പീഡിപ്പിക്കപ്പെട്ടവരെയും
  rationale: ബാധിക്കപ്പെടുക, ഉപദ്രവിക്കപ്പെടുക എന്ന ശക്തമായ സന്ദർഭാർഥം നൽകുന്നു; ‘ബുദ്ധിമുട്ടിക്കപ്പെട്ടവർ’ എന്ന മൃദുവായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: അശുദ്ധാത്മാക്കളാൽ
  rationale: വ്യക്തിത്വമുള്ള ദുഷ്ടാത്മാക്കളെ സൂചിപ്പിക്കുന്ന പുതിയനിയമത്തിലെ സ്ഥിരമായ പ്രയോഗത്തിന്റെ ധാർമിക-ആചാരപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: οἵτινες
  choice: അവരെല്ലാവരും
  rationale: മുമ്പ് പറഞ്ഞ രോഗികളെയും അശുദ്ധാത്മാക്കളാൽ പീഡിപ്പിക്കപ്പെട്ടവരെയും ഒരുമിച്ച് തിരിച്ചെടുത്തു ἅπαντες എന്ന സമഗ്രതയും വ്യക്തമാക്കുന്നു.
- source_word: ἐθεραπεύοντο
  choice: സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ തുടർച്ചയോ ആവർത്തനമോ മലയാളത്തിൽ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: ἅπαντες
  choice: എല്ലാവരും
  rationale: കൊണ്ടുവന്നവരിൽ ഒരാളും ഒഴിവാകാത്ത സമഗ്രത നേരിട്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων എന്നതിന്റെ പരിഭാഷ
  choice: അശുദ്ധാത്മാക്കൾ
  alternative: അശുദ്ധമായ ആത്മാക്കൾ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിൽ വ്യക്തിത്വമുള്ള ദുഷ്ടാത്മാക്കളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിത ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; അതിനെ വെറും മാനസികാവസ്ഥയാക്കി ചുരുക്കുന്നില്ല.
- issue: ἅπαντες എന്നതിന്റെ വ്യാപ്തി
  choice: അവരെല്ലാവരും സൗഖ്യം പ്രാപിച്ചുകൊണ്ടിരുന്നു
  alternative: അവരെല്ലാവരും സൗഖ്യം പ്രാപിച്ചു
  rationale: ഈ സംഭവത്തിൽ കൊണ്ടുവന്ന രണ്ടു വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന സമഗ്ര പ്രസ്താവനയും അപൂർണ്ണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവവും സംരക്ഷിക്കുന്നു.
- issue: ὀχλουμένους എന്ന പദത്തിന്റെ തീവ്രത
  choice: പീഡിപ്പിക്കപ്പെട്ടവർ
  alternative: ബുദ്ധിമുട്ടിക്കപ്പെട്ടവർ
  rationale: അശുദ്ധാത്മാക്കളുടെ സജീവമായ ഉപദ്രവം പ്രകടമാക്കുന്നു; എന്നാൽ സാധ്യതയുള്ള മൃദുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ച/ആവർത്തനം ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. ‘അശുദ്ധാത്മാക്കൾ’ എന്ന സ്ഥാപിത ബൈബിൾ പ്രയോഗം സംരക്ഷിച്ചു; അടിക്കുറിപ്പുകൾ മുഖ്യവാചകത്തിൽ [a], [b] ആയി രേഖപ്പെടുത്തി.
