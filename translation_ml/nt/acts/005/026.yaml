  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യം അർഥബന്ധം നിലനിർത്തിക്കൊണ്ട് രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ഭയത്തിന്റെ കാരണം വ്യക്തമാക്കാൻ സർവനാമബന്ധം സ്വാഭാവികമാക്കി.
