  text: τότε ἀπελθὼν ὁ στρατηγὸς σὺν τοῖς ὑπηρέταις ⸀ἤγαγεν αὐτούς, οὐ μετὰ βίας, ἐφοβοῦντο γὰρ τὸν λαόν, ⸀μὴ λιθασθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: ml
  text: അപ്പോൾ ദേവാലയകാവൽത്തലവൻ[a] കാവൽക്കാരോടൊപ്പം ചെന്ന് അവരെ കൂട്ടിക്കൊണ്ടുവന്നു. ബലം പ്രയോഗിക്കാതെയായിരുന്നു അത്; ജനം തങ്ങൾ കല്ലെറിയപ്പെടുമോ എന്നു അവർ ഭയപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേവാലയത്തിന്റെ ക്രമസമാധാനച്ചുമതലയുള്ള ഉദ്യോഗസ്ഥൻ.’ ഗ്രീക്കിലെ στρατηγός ഇവിടെ ദേവാലയത്തിലെ ക്രമസമാധാനത്തിന്റെ മേൽനോട്ടം വഹിച്ചിരുന്ന ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: ദേവാലയസേനാധിപൻ
  rationale: പ്രവൃത്തികളുടെ ഈ സന്ദർഭത്തിൽ ദേവാലയത്തിലെ ക്രമസമാധാനത്തിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്; റോമൻ സൈനിക മേധാവിയെയല്ല. സന്ദർഭം വ്യക്തമായി നൽകുന്നതിനായി ‘ദേവാലയസേനാധിപൻ’ ഉപയോഗിച്ചു.
- source_word: ὑπηρέταις
  choice: ഉദ്യോഗസ്ഥർ
  rationale: സേനാധിപനോടൊപ്പം പ്രവർത്തിച്ച കീഴുദ്യോഗസ്ഥരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ദാസന്മാർ’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ നിയമപാലനസന്ദർഭത്തിന് ‘ഉദ്യോഗസ്ഥർ’ യോജിക്കുന്നു.
- source_word: ἤγαγεν αὐτούς
  choice: അവരെ കൂട്ടിക്കൊണ്ടുവന്നു
  rationale: ἄγω എന്നതിന് ‘നയിക്കുക/കൊണ്ടുവരുക’ എന്ന അർഥമുണ്ട്. അപ്പൊസ്തലന്മാരെ ന്യായാധിപസഭയുടെ മുമ്പിലേക്ക് കൊണ്ടുവരുന്ന സന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അകത്തേക്ക്’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: οὐ μετὰ βίας
  choice: ബലം പ്രയോഗിച്ചില്ല
  rationale: അവരെ കൊണ്ടുവന്ന രീതി ബലപ്രയോഗമില്ലാത്തതായിരുന്നുവെന്ന് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: ἐφοβοῦντο
  choice: അവർ ഭയപ്പെട്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിലെ സാഹചര്യപരവും തുടർന്നുനിന്നതുമായ ഭയം സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὸν λαόν
  choice: ജനം
  rationale: അവിടെ കൂടിയിരുന്ന പൊതുജനത്തെയാണ് λαός സൂചിപ്പിക്കുന്നത്; ‘ജനം’ സംക്ഷിപ്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: μὴ λιθασθῶσιν
  choice: തങ്ങളെ കല്ലെറിയുമെന്നു
  rationale: ഭയപ്പെട്ട ഫലത്തെ സൂചിപ്പിക്കുന്ന μή + സബ്ജങ്ക്റ്റീവ് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. കല്ലെറിയുന്നവർ ആരെന്നത് വാക്യസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുമ്പോഴും ക്രിയയുടെ ആശയം മാറ്റുന്നില്ല.
- source_word: τότε ἀπελθὼν
  choice: അപ്പോൾ ... ചെന്ന്
  rationale: പങ്കാളിക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമമായ ‘അപ്പോൾ ... ചെന്ന്’ എന്നു നൽകി.
