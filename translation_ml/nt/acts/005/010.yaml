id: ACT.5.10
reference: Acts 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔπεσεν δὲ παραχρῆμα ⸀πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: ml
  text: അപ്പോൾത്തന്നെ അവൾ അവന്റെ പാദങ്ങൾക്കരികെ വീണ് അന്ത്യശ്വാസം വിട്ടു. യുവാക്കൾ അകത്തുവന്നപ്പോൾ അവൾ മരിച്ചുകിടക്കുന്നതായി കണ്ടു; അവർ അവളെ പുറത്തുകൊണ്ടുപോയി ഭർത്താവിന്റെ അരികിൽ അടക്കം ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: അപ്പോൾത്തന്നെ
  rationale: സംഭവം ഉടനടി നടന്നുവെന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξέψυξεν
  choice: അന്ത്യശ്വാസം വിട്ടു
  rationale: പദത്തിന്റെ അക്ഷരാർഥമായ ‘ശ്വാസം/ജീവൻ പുറത്തുപോയി’ എന്ന ഭാവവും ‘മരിച്ചു’ എന്ന സന്ദർഭാർഥവും മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: οἱ νεανίσκοι
  choice: യുവാക്കൾ
  rationale: പ്രായസൂചനയുള്ള സാധാരണ ബഹുവചന നാമത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ തത്തുല്യം.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: ഭർത്താവിന്റെ അരികിൽ
  rationale: ഇവിടെ ἀνήρ എന്നത് വിവാഹബന്ധത്തിന്റെ സന്ദർഭത്തിൽ ‘ഭർത്താവ്’ എന്നും πρός എന്നത് അടക്കസ്ഥലത്തിന്റെ സമീപ്യം സൂചിപ്പിക്കുന്ന ‘അരികിൽ’ എന്നും വിവർത്തനം ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ സംഭവക്രമവും ഉടനടിത്തവും സംരക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനമോ സഭാവിഭാഗപരമായ പദപ്രയോഗമോ ചേർത്തിട്ടില്ല.
