    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: സാക്ഷികൾ
  rationale: അപ്പൊസ്തലന്മാർ നേരിട്ട് അറിഞ്ഞ കാര്യങ്ങളെക്കുറിച്ചു സാക്ഷ്യം വഹിക്കുന്നവരാണെന്ന നിയമപരവും സാക്ഷ്യപരവുമായ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ῥημάτων
  choice: കാര്യങ്ങൾ
  rationale: ῥῆμα എന്ന പദത്തിന് ‘വാക്കുകൾ’, ‘പ്രസ്താവനകൾ’, ‘കാര്യങ്ങൾ’ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ അപ്പൊസ്തലന്മാർ സാക്ഷ്യം വഹിക്കുന്ന സംഭവങ്ങളെയും സന്ദേശത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ ‘കാര്യങ്ങൾ’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ലൂക്കാ–പ്രവൃത്തികളിലെ ഈ ദൈവിക പരാമർശത്തിനുള്ള നിലവാരമുള്ള, ആധുനിക മലയാള പ്രയോഗമാണിത്.
- source_word: ἔδωκεν
  choice: നൽകിയ
  rationale: ഗ്രീക്ക് aorist ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല വിശേഷണരൂപത്തിൽ നൽകുന്നു; ദൈവം നൽകിയ ആത്മാവെന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πειθαρχοῦσιν
  choice: അനുസരിക്കുന്നവർ
  rationale: അധികാരമുള്ള ഒരാളെ അനുസരിക്കുക എന്ന πειθαρχέωയുടെ ഭാവം നേരിട്ട് പ്രകടമാക്കുന്നു; 5:29-ലെ ദൈവത്തെ അനുസരിക്കണമെന്ന അടുത്ത സന്ദർഭവുമായും പൊരുത്തപ്പെടുന്നു.
- source_word: αὐτῷ
  choice: തന്നെ
  rationale: സർവനാമം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ദൈവം തന്നെ അനുസരിക്കുന്നവർ’ എന്ന പ്രയോഗം മലയാളത്തിൽ ആ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിനെ അപ്പൊസ്തലന്മാരോടൊപ്പം സഹസാക്ഷിയായി അവതരിപ്പിക്കുന്നുണ്ടോ
  choice: ‘പരിശുദ്ധാത്മാവും സാക്ഷിയാണ്’ എന്നു നൽകി ആദ്യ ഉപവാക്യത്തിലെ വിധേയം രണ്ടാമത്തേതിലും ബാധകമാണെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: ‘പരിശുദ്ധാത്മാവും’ എന്നുമാത്രം നൽകി ‘സാക്ഷിയാണ്’ എന്ന് അധ്യാഹരിക്കുക.
  rationale: രണ്ടാം ഗ്രീക്ക് ഉപവാക്യത്തിൽ ക്രിയ ഇല്ലെങ്കിലും ആദ്യ ഉപവാക്യത്തിലെ ‘ഞങ്ങൾ സാക്ഷികളാണ്’ എന്ന വിധേയം സ്വാഭാവികമായി അവിടെയും തുടരുന്നു. മലയാളത്തിൽ അത് തുറന്നുപറയുന്നത് അർഥം കൂട്ടിച്ചേർക്കാതെ വാക്യബന്ധം വ്യക്തമാക്കുന്നു.
- issue: പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധസർവനാമത്തിന്റെ രൂപം
  choice: മലയാളത്തിൽ പ്രത്യേകം ലിംഗസൂചനയുള്ള ബന്ധസർവനാമം ഉപയോഗിക്കാതെ ‘ദൈവം ... നൽകിയ പരിശുദ്ധാത്മാവ്’ എന്ന സ്വാഭാവിക ഘടന സ്വീകരിക്കുന്നു.
  alternative: ഗ്രീക്കിലെ നപുംസകരൂപത്തെ രൂപപരമായി അനുകരിക്കുന്ന നിർജീവസൂചന ഉപയോഗിക്കുക.
  rationale: ὃ എന്നത് πνεῦμα എന്ന നപുംസകലിംഗ നാമത്തോടുള്ള വ്യാകരണപ്പൊരുത്തം മൂലമാണ് നപുംസകരൂപത്തിലുള്ളത്. മലയാളത്തിൽ കൃത്രിമമായ നിർജീവസൂചന ഏർപ്പെടുത്താതെ വ്യക്തിപരമായ ദൈവിക പരാമർശവും മൂലാർഥവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാപരമായ ഗൗരവം നിലനിർത്തുന്നുവെങ്കിലും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മലയാളം. ‘സാക്ഷികളാണ്’, ‘അനുസരിക്കുന്നവർ’ എന്നീ നേരിട്ടുള്ള പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ഉപവാക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആവർത്തിച്ച വിധേയം വ്യക്തമാക്കി.
