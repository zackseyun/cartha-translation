id: ACT.5.27
reference: Acts 5:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: ml
  text: അവരെ കൊണ്ടുവന്നശേഷം ന്യായസഭയുടെ[a] മുമ്പിൽ നിർത്തി. മഹാപുരോഹിതൻ അവരെ ചോദ്യം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൻഹെദ്രിന്റെ മുമ്പിൽ.’ συνέδριον എന്ന ഗ്രീക്ക് പദം യഹൂദരുടെ ഭരണ-ന്യായസമിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: കൊണ്ടുവന്നശേഷം
  rationale: ἄγω എന്ന ക്രിയയുടെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കൊണ്ടുവന്നശേഷം’ ആ സമയക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ വേറൊരു പദം ചേർക്കേണ്ടതില്ല.
- source_word: ἔστησαν
  choice: നിർത്തി
  rationale: ἵστημι ഇവിടെ ‘നിൽക്കുമാറാക്കുക, മുമ്പിൽ നിർത്തുക’ എന്ന സകർമക അർഥത്തിലാണ്. ന്യായവിചാരണാസന്ദർഭത്തിലെ ദൃശ്യതയും കൃത്യതയും ‘നിർത്തി’ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ συνεδρίῳ
  choice: ന്യായസഭയുടെ മുമ്പിൽ
  rationale: συνέδριον യഹൂദരുടെ ഭരണ-ന്യായസമിതിയെ സൂചിപ്പിക്കുന്നു. ‘ന്യായസഭ’ പൊതുനാമത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ἔστησαν എന്നതിനോടൊപ്പം ‘മുമ്പിൽ’ സ്വാഭാവികമാണ്.
- source_word: ἐπηρώτησεν
  choice: ചോദ്യംചെയ്തു
  rationale: ἐπερωτάω എന്നത് ചോദിക്കുക അഥവാ ഔപചാരികമായി ചോദ്യംചെയ്യുക എന്നർഥം നൽകുന്നു. ന്യായസഭാസന്ദർഭം കണക്കിലെടുക്കുമ്പോൾ ‘ചോദ്യംചെയ്തു’ യോജിച്ചതാണ്; ‘വിചാരണചെയ്തു’ എന്നതിലേതുപോലെ അതിശക്തമായ അർഥം ഇതിൽ വരില്ല.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഈ സന്ദർഭത്തിലെ ἀρχιερεύς എന്ന പദത്തിന്റെ സ്ഥാപിതവും കൃത്യവുമായ മലയാളരൂപമാണ് ‘മഹാപുരോഹിതൻ’.
theological_decisions:
- issue: συνέδριον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ന്യായസഭ
  alternative: സൻഹെദ്രിൻ
  rationale: ഗ്രീക്ക് പൊതുനാമത്തിന്റെ അർഥം മുഖ്യവാചകത്തിൽ സുതാര്യമായി നൽകുന്നു. ഇവിടെ ഉദ്ദേശിക്കുന്നത് സൻഹെദ്രിൻ തന്നെയാണെങ്കിലും ആ പരമ്പരാഗത നാമരൂപം അടിക്കുറിപ്പിൽ പകരവായനയായി നൽകുന്നത് മൂലപദത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ participle സൂചിപ്പിക്കുന്ന സമയക്രമം വ്യക്തമാക്കി; കർത്താവ് മുൻസന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിച്ചിട്ടില്ല.
