id: ACT.5.11
reference: Acts 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: ml
  text: അപ്പോൾ, മുഴുവൻ സഭയുടെ മേലും ഈ കാര്യങ്ങൾ കേട്ട എല്ലാവരുടെയും മേലും വലിയ ഭയം വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഭ” (ἐκκλησία) എന്നതിന് “കൂട്ടായ്മ” എന്നോ “സമൂഹം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: വന്നു
  rationale: φόβος എന്ന കർത്താവിനോടും ἐπί + accusative ഘടനയോടും ചേർന്നപ്പോൾ, ഭയം ആളുകളുടെമേൽ ‘വന്നു’ എന്ന പ്രയോഗം സംഭവത്തിന്റെ ശക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: φόβος μέγας
  choice: വലിയ ഭയം
  rationale: അനന്യാസിന്റെയും സഫീറയുടെയും മേലുണ്ടായ ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ φόβος ഇവിടെ പ്രധാനമായും ഭയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; μέγας അതിന്റെ തീവ്രത വ്യക്തമാക്കുന്നു.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: സഭ മുഴുവന്മേലും
  rationale: ἐκκλησία ഇവിടെ വിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ὅλην എന്ന സമഗ്രതയും ἐπί എന്നതിന്റെ ‘മേൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: ഈ കാര്യങ്ങൾ കേട്ട എല്ലാവരുടെയുംമേലും
  rationale: ταῦτα എന്ന ബഹുവചന സൂചന ‘ഈ കാര്യങ്ങൾ’ എന്നു നിലനിർത്തുന്നു; വർത്തമാനകൃദ്‌രൂപമായ ἀκούοντας പ്രധാന ഭൂതകാലക്രിയയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘കേട്ട’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ἐκκλησία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഭ
  alternative: കൂടിവരവ് / സമൂഹം
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പദം ക്രിസ്തുവിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സഭ’ എന്നത് ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു; പദത്തിന്റെ പൊതുവായ ‘കൂടിവരവ്’ അല്ലെങ്കിൽ ‘സമൂഹം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ആവർത്തിതമായ ἐπί ഘടന ‘മേലും … മേലും’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
