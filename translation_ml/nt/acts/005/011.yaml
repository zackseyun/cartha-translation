    rationale: Modern Malayalam normally writes and phrases these expressions more naturally as 'സഭയുടെ മേലും' and 'എല്ലാവരുടെയും മേലും' rather than the fused forms in the draft.
  - severity: low
    issue: Footnote alternative 'കൂടിവരവ്' is unnatural here
    rationale: For ἐκκλησία as a body of people, 'കൂട്ടായ്മ' or 'സമൂഹം' is a clearer lexical alternative. This preserves the alternative sense without implying a different ecclesiology.
  revised_text: അപ്പോൾ, മുഴുവൻ സഭയുടെ മേലും ഈ കാര്യങ്ങൾ കേട്ട എല്ലാവരുടെയും മേലും വലിയ ഭയം വന്നു.[a]
