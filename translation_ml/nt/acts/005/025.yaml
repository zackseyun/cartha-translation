id: ACT.5.25
reference: Acts 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παραγενόμενος δέ τις ἀπήγγειλεν αὐτοῖς ὅτι Ἰδοὺ οἱ ἄνδρες οὓς ἔθεσθε ἐν τῇ φυλακῇ εἰσὶν ἐν τῷ ἱερῷ ἑστῶτες καὶ διδάσκοντες τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: ml
  text: 'എന്നാൽ ഒരാൾ വന്ന് അവരോട് അറിയിച്ചു: “നോക്കൂ, നിങ്ങൾ തടവിലാക്കിയ ആ മനുഷ്യർ ദൈവാലയാങ്കണത്തിൽ[a] നിന്നുകൊണ്ട് ജനത്തെ പഠിപ്പിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവാലയത്തിൽ”; ഗ്രീക്കിലെ ἱερόν എന്ന പദം അകത്തെ വിശുദ്ധസ്ഥലത്തെ മാത്രം സൂചിപ്പിക്കാതെ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: വന്ന്
  rationale: സന്ദേശവാഹകൻ എത്തിച്ചേർന്നത് മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സംഭവമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിനു ശേഷമുള്ള അപ്രതീക്ഷിത വഴിത്തിരിവും നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: ആളെ തിരിച്ചറിയിക്കാത്ത ഗ്രീക്ക് അനിശ്ചിതപ്രയോഗം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: അവരോട് അറിയിച്ചു
  rationale: അധികാരികൾക്ക് വിവരം ഔപചാരികമായി എത്തിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച പ്രയോഗം; αὐτοῖς എന്ന സർവനാമവും നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: നോക്കൂ
  rationale: ആശ്ചര്യകരമായ വാർത്തയിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന നിർദേശം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: οἱ ἄνδρες
  choice: ആ മനുഷ്യർ
  rationale: മുമ്പ് തടവിലാക്കിയ നിർദിഷ്ട വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; സന്ദർഭത്തിൽ സ്വാഭാവികമായ നിർദിഷ്ടത നൽകുന്നു.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: നിങ്ങൾ കാരാഗൃഹത്തിലാക്കിയ
  rationale: അവരെ തടവറയിൽ പാർപ്പിച്ച പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുമായ രീതിയിൽ പറയുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സ്ഥലം തെറ്റിദ്ധരിക്കാതിരിക്കാൻ 'ദൈവാലയാങ്കണം' തിരഞ്ഞെടുത്തു.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: നിന്നുകൊണ്ട് ജനത്തെ പഠിപ്പിക്കുന്നു
  rationale: നിൽക്കുന്നതും പഠിപ്പിക്കുന്നതും ഒരേസമയം തുടരുന്ന പ്രവൃത്തികളാണെന്ന ഗ്രീക്ക് ഘടന വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സംഭാഷണത്തിൽ ശ്രദ്ധ ക്ഷണിക്കാൻ ‘നോക്കൂ’ ഉപയോഗിച്ചു; സ്ഥലസൂചനയിൽ മൂലഭാഷയുടെ കൃത്യതയ്ക്കായി ‘ദൈവാലയാങ്കണത്തിൽ’ സ്വീകരിച്ചു.
