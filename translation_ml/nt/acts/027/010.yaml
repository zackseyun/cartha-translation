id: ACT.27.10
reference: Acts 27:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: ml
  text: 'അവരോടു പറഞ്ഞു: “പുരുഷന്മാരേ, ഈ കപ്പൽയാത്ര ദുരന്തവും വലിയ നഷ്ടവും[a] വരുത്തിവെക്കാനിരിക്കുന്നു എന്നു ഞാൻ മനസ്സിലാക്കുന്നു. ചരക്കും കപ്പലും മാത്രമല്ല, നമ്മുടെ ജീവനും[b] നഷ്ടപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “കഠിനമായ ദുരിതവും ഏറെ നാശനഷ്ടവും.” ഈ ഗ്രീക്ക് പ്രയോഗം യാത്രയോടൊപ്പമുണ്ടാകുന്ന രൂക്ഷമായ ദുരിതത്തിനോ നാശത്തിനോ ഊന്നൽ നൽകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ: “നമ്മുടെ ആത്മാക്കളുടെ.” എന്നാൽ കപ്പൽച്ചേതവും മരണവും സംഭവിക്കാവുന്ന ഈ സന്ദർഭത്തിൽ അർഥം “നമ്മുടെ ജീവനും” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: അവരോടു പറഞ്ഞു
  rationale: വർത്തമാന കൃ分ന്തത്തിന്റെ അനുബന്ധസാഹചര്യഭാവം മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനശൈലിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἄνδρες
  choice: പുരുഷന്മാരേ
  rationale: ἀνήρ എന്ന ലിംഗസൂചകമായ സംബോധനയെ നേരിട്ട് നിലനിർത്തുന്നു; ‘മാന്യരേ’ എന്നതിലുണ്ടാകാവുന്ന അധിക ബഹുമാനസൂചന ചേർക്കുന്നില്ല.
- source_word: θεωρῶ
  choice: ഞാൻ മനസ്സിലാക്കുന്നു
  rationale: കേവലമായ കാഴ്ചയല്ല, നിരീക്ഷണത്തിൽനിന്നുള്ള വിലയിരുത്തലും ബോധ്യവും ഇവിടെ ഉദ്ദേശിക്കുന്നു.
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: ദുരന്തത്തോടും വലിയ നഷ്ടത്തോടും കൂടി
  rationale: കടൽയാത്രയോടൊപ്പമുണ്ടാകുന്ന കഠിനമായ അപകടവും നാശനഷ്ടവും സൂചിപ്പിക്കുന്നു; ὕβρις എന്നതിനെ ഇവിടെ ധാർമ്മികമായ ‘ധിക്കാരം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് സന്ദർഭോചിതമല്ല.
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: ചരക്കിനും കപ്പലിനും മാത്രമല്ല ... നഷ്ടമുണ്ടാകും
  rationale: ζημίαയോടു ബന്ധപ്പെടുന്ന ഷഷ്ഠീവിഭക്തികളെ മലയാളത്തിൽ നഷ്ടം ബാധിക്കുന്ന വസ്തുക്കളായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: നമ്മുടെ ജീവനും
  rationale: കപ്പൽച്ചേതവും മരണഭീഷണിയും സംബന്ധിച്ച സന്ദർഭത്തിൽ ψυχή ഭൗതികജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാവ്’ ഇവിടെ തെറ്റായ ധാർമ്മിക അർഥസൂചന നൽകാം.
- source_word: μέλλειν ἔσεσθαι
  choice: കൂടിയതായിരിക്കുമെന്ന്
  rationale: വരാനിരിക്കുന്ന യാത്രയെക്കുറിച്ചുള്ള ശക്തമായ പ്രതീക്ഷ/മുന്നറിയിപ്പ് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തൊട്ടടുത്ത നിമിഷത്തെ മാത്രം സൂചിപ്പിക്കുന്ന അതിരുകടന്ന അടിയന്തരത ചേർക്കുന്നില്ല.
- source_word: τὸν πλοῦν
  choice: ഈ കപ്പൽയാത്ര
  rationale: πλοῦς എന്ന കടൽയാത്രയെ സന്ദർഭസഹിതവും സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നതുമായ രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ അർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ഇവിടെ ഭീഷണി കപ്പൽച്ചേതത്തിലൂടെയുള്ള ശാരീരിക മരണമാണ്; മനുഷ്യന്റെ അഭൗതിക ഘടകത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ സന്ദർഭാർഥം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള സംബോധനയും പൗലൊസിന്റെ മുന്നറിയിപ്പിലെ ഗൗരവവും നിലനിർത്തി; കടൽയാത്രാസന്ദർഭത്തിലെ സാങ്കേതിക അർഥങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അവതരിപ്പിച്ചു.
