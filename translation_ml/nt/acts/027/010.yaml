revisions:
- from: 'അവരോടു പറഞ്ഞു: “പുരുഷന്മാരേ, ഈ കപ്പൽയാത്ര ദുരന്തത്തോടും വലിയ നഷ്ടത്തോടും[a] കൂടിയതായിരിക്കുമെന്ന് ഞാൻ മനസ്സിലാക്കുന്നു. ചരക്കിനും കപ്പലിനും മാത്രമല്ല, നമ്മുടെ ജീവനും[b] നഷ്ടമുണ്ടാകും.”'
  to: 'അവരോടു പറഞ്ഞു: “പുരുഷന്മാരേ, ഈ കപ്പൽയാത്ര ദുരന്തവും വലിയ നഷ്ടവും[a] വരുത്തിവെക്കാനിരിക്കുന്നു എന്നു ഞാൻ മനസ്സിലാക്കുന്നു. ചരക്കും കപ്പലും മാത്രമല്ല, നമ്മുടെ ജീവനും[b] നഷ്ടപ്പെടും.”'
  rationale: പരിഷ്കാരം മൂലപാഠത്തിലെ μέλλωയുടെ ആസന്നമായ മുന്നറിയിപ്പ് കൂടുതൽ വ്യക്തമായി നൽകുകയും വാക്യത്തെ സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു. ചരക്ക്, കപ്പൽ, മനുഷ്യജീവൻ എന്നിവയെ ബാധിക്കുന്ന നഷ്ടത്തിന്റെ വ്യാപ്തി നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ യഥാക്രമം ദുരന്തം/നഷ്ടം എന്നും ജീവൻ എന്നും വരുന്ന പദങ്ങളോട് ചേർന്നിരിക്കുന്നു.
