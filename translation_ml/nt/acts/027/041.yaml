translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. അപരിചിതമായ നാവിക സാങ്കേതികപദങ്ങൾക്കു പകരം ‘മുൻഭാഗം,’ ‘പിൻഭാഗം’ എന്നീ വ്യക്തമായ പദങ്ങൾ ഉപയോഗിച്ചു; അപൂർവമായ διθάλασσος എന്ന പദത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
