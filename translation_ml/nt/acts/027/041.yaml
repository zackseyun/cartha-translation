source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: ml
  text: എന്നാൽ, രണ്ടു കടലുകൾ കൂടിച്ചേരുന്ന ഒരു സ്ഥലത്ത്[a] അകപ്പെട്ടപ്പോൾ അവർ കപ്പൽ ആഴംകുറഞ്ഞിടത്ത് കയറ്റി; കപ്പലിന്റെ മുൻഭാഗം ഉറച്ചുപതിഞ്ഞ് ഇളകാതെ നിന്നു, പിൻഭാഗമാകട്ടെ ആ ശക്തിയാൽ തകർന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രണ്ടു കടലുകൾക്കിടയിലുള്ള ഒരു സ്ഥലം.’ ഗ്രീക്കിലെ ഈ പ്രയോഗം അപൂർവമാണ്; ഇത് ഒരു ജലപാതയെയോ മണൽത്തിട്ടയെയോ രണ്ടു ജലഭാഗങ്ങളോ ജലപ്രവാഹങ്ങളോ കൂടിച്ചേരുന്ന സ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: അകപ്പെട്ടപ്പോൾ
  rationale: കപ്പൽ പെട്ടെന്നുണ്ടായ പ്രതികൂല സാഹചര്യത്തിൽ എത്തിപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; സംഭവത്തിന്റെ ആകസ്മികതയും പ്രതികൂലഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τόπον διθάλασσον
  choice: രണ്ടു കടലുകൾ കൂടിച്ചേരുന്ന ഒരു സ്ഥലം
  rationale: അപൂർവമായ διθάλασσος എന്ന പദത്തിന്റെ ‘രണ്ടു ജലഭാഗങ്ങളുമായി ബന്ധപ്പെട്ട സ്ഥലം’ എന്ന അടിസ്ഥാനചിത്രം നിലനിർത്തുന്നു; മണൽത്തിട്ടയോ ജലപാതയോ എന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: കപ്പൽ കരയ്ക്കടുപ്പിച്ചു
  rationale: ἐπικέλλω എന്ന നാവികപദം കപ്പൽ കരയിലോ ആഴം കുറഞ്ഞിടത്തോ കയറ്റി നിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: πρῷρα
  choice: കപ്പലിന്റെ മുൻഭാഗം
  rationale: ‘അണിയം’ പോലുള്ള അപരിചിത നാവികപദത്തെക്കാൾ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന കൃത്യമായ വിവരണം.
- source_word: ἐρείσασα
  choice: ഉറച്ചുപതിഞ്ഞ്
  rationale: മുൻഭാഗം അടിത്തട്ടിൽ ദൃഢമായി കുടുങ്ങിയ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: ἔμεινεν ἀσάλευτος
  choice: ഇളകാതെ നിന്നു
  rationale: കപ്പലിന്റെ മുൻഭാഗം ചലിക്കാതെ ഉറച്ചുനിന്നുവെന്ന ഭൗതിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρύμνα
  choice: പിൻഭാഗം
  rationale: കപ്പലിന്റെ പിന്നറ്റത്തെ സാധാരണവും വ്യക്തവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλύετο
  choice: തകർന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാല കർമണിപ്രയോഗത്തിലെ തുടർന്നുകൊണ്ടിരുന്ന വിഘടനപ്രക്രിയ പ്രകടമാക്കുന്നു.
- source_word: ὑπὸ τῆς βίας
  choice: ശക്തിയാൽ
  rationale: ഗ്രീക്കിൽ ശക്തിയുടെ ഉറവിടം വ്യക്തമായി പറയാത്തതിനാൽ ‘തിരമാലകളുടെ’ എന്നു ചേർക്കാതെ യഥാർഥ അസ്പഷ്ടത നിലനിർത്തുന്നു.
