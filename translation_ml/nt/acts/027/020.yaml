    text: അഥവാ, ‘ഞങ്ങൾ രക്ഷിക്കപ്പെടുമെന്നുള്ള.’ ഇവിടെ ഗ്രീക്ക് ക്രിയ കൊടുങ്കാറ്റിൽനിന്നുള്ള ശാരീരിക രക്ഷയെ സൂചിപ്പിക്കുന്നു.
