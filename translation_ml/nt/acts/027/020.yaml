id: ACT.27.20
reference: Acts 27:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: ml
  text: അനേകം ദിവസങ്ങളോളം സൂര്യനോ നക്ഷത്രങ്ങളോ പ്രത്യക്ഷപ്പെടാതിരിക്കുകയും, കഠിനമായ കൊടുങ്കാറ്റ് ഞങ്ങളുടെമേൽ ആഞ്ഞടിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തപ്പോൾ, അതിനുശേഷം ഞങ്ങൾ രക്ഷപ്പെടുമെന്നുള്ള എല്ലാ പ്രത്യാശയും ക്രമേണ അറ്റുപോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιφαινόντων
  choice: കാണാതിരിക്കുകയും
  rationale: സൂര്യനും നക്ഷത്രങ്ങളും ദൃശ്യമാകാതിരുന്നതാണ് സന്ദർഭത്തിലെ ആശയം. മലയാളത്തിൽ ‘കാണാതിരിക്കുക’ സ്വാഭാവികമാണ്; പ്രകാശിക്കുന്നതെന്ന ആശയം അനാവശ്യമായി ഊന്നിപ്പറയുന്നില്ല.
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: അനേകം ദിവസങ്ങളോളം
  rationale: ദീർഘമായ കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: χειμῶνός
  choice: കൊടുങ്കാറ്റ്
  rationale: കടൽയാത്രയുടെ ഈ സന്ദർഭത്തിൽ പദം ശീതകാലത്തെയല്ല, പ്രക്ഷുബ്ധമായ കാലാവസ്ഥയെയും കൊടുങ്കാറ്റിനെയുമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οὐκ ὀλίγου
  choice: ശക്തമായ
  rationale: ഗ്രീക്കിലെ ‘ചെറുതല്ലാത്ത’ എന്ന നിഷേധോക്തിയുടെ ഊന്നൽ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπικειμένου
  choice: ഞങ്ങളുടെമേൽ ആഞ്ഞടിച്ചുകൊണ്ടിരിക്കുകയും
  rationale: കൊടുങ്കാറ്റ് തുടർച്ചയായി അവരെ ഞെരുക്കിയതും ബാധിച്ചതും പുരോഗമനക്രിയയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: λοιπὸν
  choice: അന്നുമുതൽ
  rationale: ആ സാഹചര്യത്തിന്റെ ഫലമായി ആരംഭിച്ച തുടർന്നുള്ള ഘട്ടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: περιῃρεῖτο
  choice: ക്രമേണ ഇല്ലാതായിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ സ്വഭാവം നിലനിർത്തി, പ്രത്യാശ ഒറ്റയടിക്ക് അല്ലാതെ നഷ്ടപ്പെട്ടുകൊണ്ടിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐλπὶς πᾶσα
  choice: സകല പ്രത്യാശയും
  rationale: പ്രത്യാശയുടെ സമ്പൂർണ നഷ്ടം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: ഞങ്ങൾ രക്ഷപ്പെടുമെന്നുള്ള
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് പ്രത്യാശയുടെ ഉള്ളടക്കം പറയുന്നു. കടലിലെ മരണത്തിൽനിന്നുള്ള ശാരീരിക രക്ഷയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: കടൽയാത്രാ വിവരണത്തിൽ σῴζεσθαι എന്നതിന്റെ അർഥം
  choice: കടലിലെ അപകടത്തിൽനിന്ന് ‘രക്ഷപ്പെടുക’
  alternative: ‘രക്ഷിക്കപ്പെടുക’
  rationale: പ്രവൃത്തികൾ 27-ന്റെ സന്ദർഭം കപ്പൽച്ചേതവും ജീവരക്ഷയുമാണ്; അതിനാൽ ഇവിടെ ആത്മീയ രക്ഷയെക്കാൾ ശാരീരിക വിടുതലാണ് ഉദ്ദേശിക്കുന്നത്. ‘രക്ഷപ്പെടുക’ സാധാരണ മലയാളത്തിൽ ഈ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള വിവരണശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ തുടർച്ചയായ ക്രിയാഭാവം ‘ആഞ്ഞടിച്ചുകൊണ്ടിരിക്കുകയും’, ‘ഇല്ലാതായിക്കൊണ്ടിരുന്നു’ എന്നിവയിലൂടെ നിലനിർത്തി.
