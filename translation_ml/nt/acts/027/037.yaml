id: ACT.27.37
reference: Acts 27:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤμεθα δὲ ⸂αἱ πᾶσαι ψυχαὶ ἐν τῷ πλοίῳ⸃ ⸀διακόσιαι ἑβδομήκοντα ἕξ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/037.yaml
  text: There were 276 persons in the ship in all[a].
translation:
  language: ml
  text: കപ്പലിൽ ഞങ്ങൾ ആകെ 276 പേരുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “കപ്പലിൽ ഞങ്ങൾ ആകെ 276 ആത്മാക്കൾ ആയിരുന്നു.” ഇവിടെ “ആത്മാക്കൾ” എന്നത് വ്യക്തികൾ അഥവാ ആളുകൾ എന്നാണ് അർഥം; ശരീരരഹിത ആത്മാക്കളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμεθα
  choice: ഞങ്ങൾ … ഉണ്ടായിരുന്നു
  rationale: ഒന്നാംപുരുഷ ബഹുവചനമായ ഗ്രീക്ക് ക്രിയയുടെ ‘ഞങ്ങൾ ആയിരുന്നു’ എന്ന അർഥം മലയാളത്തിൽ ആളുകളുടെ ആകെ എണ്ണം പറയുന്ന സ്വാഭാവിക ഘടനയായി നൽകി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിൽ പ്രത്യേകം ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: αἱ πᾶσαι ψυχαὶ
  choice: ആകെ … പേർ
  rationale: ഇവിടെ ψυχαί ശരീരരഹിത ആത്മാക്കളെയല്ല, കപ്പലിലുണ്ടായിരുന്ന വ്യക്തികളെയാണ് സൂചിപ്പിക്കുന്നത്; πᾶσαι എന്ന സമഗ്രത ‘ആകെ’ എന്നതിലൂടെ പ്രതിഫലിപ്പിച്ചു.
- source_word: ἐν τῷ πλοίῳ
  choice: കപ്പലിൽ
  rationale: ഗ്രീക്ക് സ്ഥാനസൂചനയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: διακόσιαι ἑβδομήκοντα ἕξ
  choice: '276'
  rationale: കൃത്യമായ സംഖ്യ വായനാസൗകര്യത്തിനായി അക്കങ്ങളിൽ നൽകി.
theological_decisions:
- issue: ψυχαί എന്ന പദത്തിന്റെ അർഥം
  choice: പേർ
  alternative: ആത്മാക്കൾ
  rationale: ഈ കപ്പൽയാത്രാസന്ദർഭത്തിൽ പദം മനുഷ്യരുടെ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന സമ്പ്രദായപ്രയോഗമാണ്; മനുഷ്യന്റെ ഘടനയെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്രവാദം ഇതിലൂടെ ഉന്നയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഒന്നാംപുരുഷ ബഹുവചനം നിലനിർത്തിയതോടൊപ്പം, ആളുകളുടെ എണ്ണം പറയാൻ സ്വാഭാവികമായ ‘പേരുണ്ടായിരുന്നു’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു.
