  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τῇ τρίτῃ αὐτόχειρες τὴν σκευὴν τοῦ πλοίου ⸀ἔρριψαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/019.yaml
  text: And on the third day they threw the ship’s gear overboard with their own hands[a].
translation:
  language: ml
  text: മൂന്നാം ദിവസം അവർ സ്വന്തം കൈകൊണ്ടുതന്നെ കപ്പലിലെ സാമഗ്രികൾ കടലിലേക്ക് എറിഞ്ഞുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർതന്നെ കപ്പലിലെ ഉപകരണങ്ങൾ പുറത്തേക്ക് എറിഞ്ഞു.”
    reason: αὐτόχειρες എന്ന പദത്തിന്റെ ‘സ്വന്തം കൈകൊണ്ട്’ എന്ന അക്ഷരാർഥത്തിനുപകരം, പ്രവൃത്തി അവർതന്നെ ചെയ്തുവെന്ന ഊന്നലോടെ വിവർത്തനം ചെയ്യാവുന്നതും σκευήയെ ‘ഉപകരണങ്ങൾ’ എന്നു പറയാവുന്നതുമാണ്.
lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: മൂന്നാം ദിവസം
  rationale: ക്രമസംഖ്യയോടുകൂടിയ ദത്തിവ് ഇവിടെ സമയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മൂന്നാം ദിവസം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: αὐτόχειρες
  choice: സ്വന്തം കൈകൊണ്ടുതന്നെ
  rationale: കപ്പലിലുണ്ടായിരുന്നവർ ഈ പ്രവൃത്തി നേരിട്ട് സ്വന്തം കൈകളാൽ ചെയ്തുവെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: കപ്പലിലെ സാമഗ്രികൾ
  rationale: നാവികസന്ദർഭത്തിൽ σκευή കപ്പലിന്റെ ഉപകരണങ്ങളും മറ്റു ഉപയോഗസാമഗ്രികളും ഉൾക്കൊള്ളുന്ന പൊതുപദമാണ്; ‘സാമഗ്രികൾ’ അതിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἔρριψαν
  choice: കടലിലേക്ക് എറിഞ്ഞുകളഞ്ഞു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘എറിഞ്ഞു’ എന്നാണ്; കൊടുങ്കാറ്റിൽ കപ്പലിന്റെ ഭാരം കുറയ്ക്കുന്ന സന്ദർഭം ദിശ കടലിലേക്കാണെന്ന് വ്യക്തമാക്കുന്നതിനാൽ അത് സ്വാഭാവികമായി പ്രത്യക്ഷമാക്കി.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ആഖ്യാനശൈലി. ‘സ്വന്തം കൈകൊണ്ടുതന്നെ’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; ‘കടലിലേക്ക്’ എന്നത് നാവികസന്ദർഭത്തിൽ അന്തർലീനമായ ദിശ വ്യക്തമാക്കുന്നു.
