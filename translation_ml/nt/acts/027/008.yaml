  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങളായ ‘നല്ല തുറമുഖങ്ങൾ’, ‘ലസയ്യ’ എന്നിവ വ്യക്തമായി അവതരിപ്പിച്ചിരിക്കുന്നു; മൂലപാഠത്തിലെ യാത്രയുടെ പ്രയാസവും തീരത്തോടു ചേർന്നുള്ള നാവികസഞ്ചാരവും സംരക്ഷിച്ചിട്ടുണ്ട്.
