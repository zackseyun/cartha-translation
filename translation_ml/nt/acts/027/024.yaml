id: ACT.27.24
reference: Acts 27:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “പൗലൊസേ, ഭയപ്പെടേണ്ടാ. നീ കൈസറുടെ മുമ്പാകെ നിൽക്കേണ്ടതുണ്ട്. ഇതാ, നിന്നോടൊപ്പം കപ്പൽയാത്ര ചെയ്യുന്ന എല്ലാവരെയും ദൈവം നിനക്കു ദാനമായി നൽകിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ടാ
  rationale: നിഷേധത്തോടുകൂടിയ വർത്തമാന ആജ്ഞയുടെ ആശ്വാസകരവും സ്വാഭാവികവുമായ മലയാള രൂപം.
- source_word: Καίσαρί
  choice: കൈസറുടെ മുമ്പാകെ
  rationale: റോമൻ ചക്രവർത്തിയുടെ പദവിനാമം ലിപ്യന്തരണം ചെയ്തു; παραστῆναι-യോടുള്ള ദത്തിവ് ബന്ധം മലയാളത്തിൽ ‘മുമ്പാകെ’ എന്നു വ്യക്തമാക്കി.
- source_word: δεῖ
  choice: നിൽക്കേണ്ടതുണ്ട്
  rationale: ദൈവിക പദ്ധതിയിലോ അനിവാര്യതയിലോ ഉള്ള ശക്തി നിലനിർത്തുന്ന പ്രയോഗം.
- source_word: παραστῆναι
  choice: നിൽക്കുക
  rationale: അധികാരിയുടെ മുമ്പിൽ ഹാജരാകുക എന്ന സന്ദർഭാർഥം ‘മുമ്പാകെ നിൽക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ സംരക്ഷിച്ചു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് സൂചകത്തിന്റെ dignified, സാധാരണ മലയാള സമാനരൂപം.
- source_word: κεχάρισταί σοι
  choice: നിനക്കു ദാനമായി നൽകിയിരിക്കുന്നു
  rationale: χαρίζομαι എന്ന ക്രിയയിലെ കൃപാപൂർവം നൽകുക/ദാനമായി അനുവദിക്കുക എന്ന ഭാവവും perfect രൂപത്തിലെ പൂർത്തിയായ ഫലവും നിലനിർത്തുന്നു.
- source_word: πάντας τοὺς πλέοντας μετὰ σοῦ
  choice: നിന്നോടൊപ്പം കപ്പൽയാത്ര ചെയ്യുന്ന എല്ലാവരെയും
  rationale: കൂടെ സഞ്ചരിക്കുന്നവരെന്നതിലുപരി കടൽയാത്രയുടെ വ്യക്തമായ ആശയം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κεχάρισταί σοι എന്നതിന്റെ അർഥം
  choice: ദൈവം എല്ലാവരെയും പൗലൊസിനു ‘ദാനമായി നൽകിയിരിക്കുന്നു’
  alternative: ദൈവം എല്ലാവരുടെയും ജീവൻ രക്ഷിക്കുമെന്ന് പൗലൊസിനോട് വാഗ്ദാനം ചെയ്തിരിക്കുന്നു
  rationale: മൂലപാഠത്തിലെ രൂപകം നേരിട്ട് നിലനിർത്തി; രക്ഷയുടെ ഫലം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും അത് വാക്യത്തിൽ വിശദീകരിച്ച് ചേർത്തില്ല.
- issue: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത
  choice: ‘വേണ്ടതുണ്ട്’ എന്ന ശക്തമായ അനിവാര്യത
  alternative: ‘നിൽക്കും’ എന്ന ലളിത ഭാവികാലം
  rationale: ലൂക്കോസിന്റെ രചനയിൽ δεῖ പലപ്പോഴും ദൈവിക പദ്ധതിയുടെ അനിവാര്യത വഹിക്കുന്നു; എന്നാൽ ‘ദൈവം നിർദേശിച്ചിരിക്കുന്നു’ എന്നു വ്യാഖ്യാനപരമായി വികസിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പൗലൊസേ’ എന്ന സംബോധനവും ‘കൈസർ’ എന്ന ചരിത്രപദവിയും ഉപയോഗിച്ചു. മൂലത്തിലെ ശ്രദ്ധാകർഷകമായ ἰδοὺ ‘ഇതാ’ എന്നു തുറന്നുവെച്ചു.
