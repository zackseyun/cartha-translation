  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന ഭൂമിശാസ്ത്രപരിധിയുടെ അനിശ്ചിതത്വവും കര അടുത്തുവരുന്നു എന്ന മൂലപാഠത്തിന്റെ ദൃശ്യവീക്ഷണവും നിലനിർത്തിയിരിക്കുന്നു.
