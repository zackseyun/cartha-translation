id: ACT.27.27
reference: Acts 27:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ τεσσαρεσκαιδεκάτη νὺξ ἐγένετο διαφερομένων ἡμῶν ἐν τῷ Ἀδρίᾳ, κατὰ μέσον τῆς νυκτὸς ὑπενόουν οἱ ναῦται προσάγειν τινὰ αὐτοῖς χώραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: ml
  text: പതിനാലാം രാത്രി വന്നപ്പോൾ, ഞങ്ങൾ അദ്രിയാ കടലിൽ[a] കൊണ്ടുപോകപ്പെട്ടുകൊണ്ടിരിക്കെ, ഏകദേശം അർധരാത്രിയോടെ ഏതോ കരപ്രദേശം തങ്ങളോട് അടുത്തുവരുന്നതായി[b] നാവികർ സംശയിച്ചുതുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുരാതനകാലത്തെ ‘അദ്രിയാ’ എന്ന പേര് ഇന്നത്തെ അഡ്രിയാറ്റിക് കടലിനെ മാത്രമല്ല, ഈ പ്രദേശത്തെ മധ്യധരണ്യക്കടലിലെ വിശാലമായ ജലമേഖലയെയും സൂചിപ്പിക്കാമായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘ഏതോ കരപ്രദേശം തങ്ങളോട് അടുത്തുവരുന്നതായി.’ അർഥം: തങ്ങൾ ഏതോ കരയോട് അടുക്കുകയാണെന്ന്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: പതിനാലാം രാത്രി ആയപ്പോൾ
  rationale: സമയഘട്ടം വന്നെത്തിയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: διαφερομένων ἡμῶν
  choice: ഞങ്ങൾ ... അലയിച്ചുകൊണ്ടിരിക്കെ
  rationale: യാത്രക്കാരുടെ നിയന്ത്രണത്തിലല്ലാത്ത, തുടർന്നുകൊണ്ടിരുന്ന ചലനം പ്രതിഫലിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത കാറ്റോ ഒഴുക്കോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: അദ്രിയാ കടലിൽ
  rationale: പുരാതന ഭൂമിശാസ്ത്രനാമം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു; ഇന്നത്തെ അഡ്രിയാറ്റിക് കടൽ മാത്രമാണെന്ന തെറ്റായ കൃത്യത ഒഴിവാക്കുന്നു.
- source_word: κατὰ μέσον τῆς νυκτός
  choice: അർധരാത്രിയോടടുത്ത്
  rationale: രാത്രിയുടെ മധ്യത്തോടടുത്ത സമയമെന്ന ഏകദേശഭാവം നിലനിർത്തുന്നു.
- source_word: ὑπενόουν
  choice: സംശയിച്ചുതുടങ്ങി
  rationale: ക്രിയയുടെ അപൂർണകാലഭാവവും നാവികർ ക്രമേണ ഒരു നിഗമനത്തിലെത്തിയെന്ന അനിശ്ചിതത്വവും പ്രകടമാക്കുന്നു.
- source_word: τινὰ ... χώραν
  choice: ഏതോ കരപ്രദേശം
  rationale: ഏത് കരയാണെന്ന് അറിയാത്ത അനിശ്ചിതത്വം τινά അനുസരിച്ച് നിലനിർത്തുന്നു.
- source_word: προσάγειν ... αὐτοῖς
  choice: തങ്ങളോട് അടുത്തുവരുന്നതായി
  rationale: നാവികർ കരയോട് അടുക്കുന്നു എന്നു പുനർഘടിപ്പിക്കാതെ, കര അവരോട് അടുക്കുന്നതായുള്ള ഗ്രീക്ക് വീക്ഷണം നിലനിർത്തുന്നു.
