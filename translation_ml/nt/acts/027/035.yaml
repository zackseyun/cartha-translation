id: ACT.27.35
reference: Acts 27:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: ml
  text: 'ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം, അവൻ അപ്പം എടുത്ത് എല്ലാവരുടെയും സാന്നിധ്യത്തിൽ[a] ദൈവത്തിന് നന്ദി പറഞ്ഞു; പിന്നെ അത് നുറുക്കി ഭക്ഷിക്കാൻ തുടങ്ങി.


    [a] അഥവാ, “എല്ലാവരുടെയും മുമ്പാകെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാവരുടെയും മുമ്പാകെ.”
    reason: ἐνώπιον πάντων എന്ന പ്രയോഗത്തിന്റെ അടുത്തതും സ്വാഭാവികവുമായ മറ്റൊരു മലയാള പരിഭാഷ.
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: ഇക്കാര്യങ്ങൾ പറഞ്ഞശേഷം
  rationale: Aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദമായി നിർബന്ധിച്ച് ചേർക്കാതെ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കി. ταῦτα മുൻപ് പറഞ്ഞ കാര്യങ്ങളിലേക്കാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λαβὼν ἄρτον
  choice: അപ്പം എടുത്ത്
  rationale: ἄρτον എന്നതിന് ഇവിടെ നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ ഇല്ല; ‘ഒരു മുഴുവൻ അപ്പം’ എന്നോ ‘കുറച്ച് അപ്പം’ എന്നോ അമിതമായി നിർണ്ണയിക്കാതെ ലളിതമായ പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: ദൈവത്തിന് നന്ദി പറഞ്ഞു
  rationale: εὐχαριστέωയുടെ സാധാരണ അർഥമായ ‘നന്ദി പറയുക’ എന്നും ദാതിവിലുള്ള ദൈവത്തെ ലക്ഷ്യമായി വ്യക്തമാക്കിയും സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: ἐνώπιον πάντων
  choice: എല്ലാവരുടെയും സാന്നിധ്യത്തിൽ
  rationale: പ്രവൃത്തി പരസ്യമായി എല്ലാവരുടെയും മുമ്പിൽ നടന്നുവെന്ന ആശയം മാന്യവും സ്വാഭാവികവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു; അടുത്ത പദസാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: κλάσας
  choice: പിന്നെ അത് മുറിച്ച്
  rationale: Aorist participle തുടർന്നുള്ള പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയാണ്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അത്’ എന്ന സർവനാമം മുമ്പുള്ള അപ്പിനെ സൂചിപ്പിക്കുന്നവിധം ചേർത്തു.
- source_word: ἤρξατο ἐσθίειν
  choice: ഭക്ഷിക്കാൻ തുടങ്ങി
  rationale: ἄρχομαι + infinitive എന്ന പ്രയോഗത്തിന്റെ ആരംഭസൂചന നേരിട്ട് നിലനിർത്തുന്നു; ആധുനിക മാനകമലയാളത്തിൽ dignified ആയ ‘ഭക്ഷിക്കാൻ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘അപ്പം എടുത്തു—നന്ദി പറഞ്ഞു—മുറിച്ചു—ഭക്ഷിച്ചു’ എന്ന ക്രമത്തിലെ കർത്തൃഭോജനസാദൃശ്യം
  choice: പ്രവൃത്തികളെ സാധാരണ ആഖ്യാനഭാഷയിൽ അവതരിപ്പിച്ചു; കൂദാശാപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
  alternative: പരമ്പരാഗത കർത്തൃഭോജനഭാഷയോടു കൂടുതൽ ചേർന്ന പദാവലി ഉപയോഗിക്കുക.
  rationale: ഈ ക്രമം കർത്തൃഭോജനവിവരണങ്ങളെ ഓർമിപ്പിക്കാമെങ്കിലും, കപ്പലിൽ പൗലോസ് പരസ്യമായി ഭക്ഷണം കഴിച്ചതാണ് ഈ വാക്യം നേരിട്ട് വിവരിക്കുന്നത്. അതിനെ കർത്തൃഭോജനമെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത്തരമൊരു സിദ്ധാന്തപരമായ നിഗമനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് participle-കളുടെ ക്രമം ‘പറഞ്ഞശേഷം,’ ‘എടുത്ത്,’ ‘പിന്നെ ... മുറിച്ച്’ എന്നീ സ്വാഭാവിക ഘടനകളിലൂടെ സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘bread’ എന്നതിനുശേഷം പ്രത്യക്ഷപ്പെടുന്നുണ്ടെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ἐνώπιον πάντων എന്ന പ്രയോഗത്തിനുള്ള പദഭേദമായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ചിഹ്നം അതത് പ്രയോഗത്തിനുശേഷം സ്ഥാപിച്ചു.
