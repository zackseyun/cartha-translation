translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആഞ്ഞുലച്ചുകൊണ്ടിരുന്നതിനാൽ’ കൊടുങ്കാറ്റിന്റെ ശക്തിയും തുടരുന്ന പ്രഹരവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു. പ്രധാനവാചകത്തിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘ചരക്ക്’ ചേർത്തതിന്റെ അടിസ്ഥാനമായ നാവികപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
