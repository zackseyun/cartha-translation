  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σφοδρῶς δὲ χειμαζομένων ἡμῶν τῇ ἑξῆς ἐκβολὴν ἐποιοῦντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/018.yaml
  text: As we were being violently storm-tossed[a], on the next day they began to throw the cargo overboard.
translation:
  language: ml
  text: കൊടുങ്കാറ്റ് ഞങ്ങളെ അതിശക്തമായി ആഞ്ഞുലച്ചുകൊണ്ടിരുന്നതിനാൽ, പിറ്റേന്ന് അവർ ചരക്ക് കടലിലേക്കു വലിച്ചെറിയാൻ തുടങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവർ സാധനങ്ങൾ പുറത്തേക്കെറിയൽ നടത്തി.” കപ്പലിന്റെ ഭാരം കുറയ്ക്കാൻ ചരക്ക് പുറത്തേക്കെറിയുന്നതിനെ സൂചിപ്പിക്കുന്ന നാവികപ്രയോഗമാണ് ഗ്രീക്കിലുള്ളത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφοδρῶς
  choice: അതിശക്തമായി
  rationale: കൊടുങ്കാറ്റിന്റെ പ്രഹരത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന ക്രിയാവിശേഷണം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമായ പ്രയോഗം.
- source_word: χειμαζομένων
  choice: കൊടുങ്കാറ്റ് ഞങ്ങളെ ... ആഞ്ഞുലച്ചുകൊണ്ടിരുന്നതിനാൽ
  rationale: കൊടുങ്കാറ്റിൽ അകപ്പെട്ട് അതിന്റെ പ്രഹരം ഏൽക്കുന്നതെന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളവാക്യത്തിൽ പ്രകടമാക്കുന്നു; തുടരുന്ന പ്രവർത്തിയും നിലനിർത്തുന്നു.
- source_word: ἡμῶν
  choice: ഞങ്ങളെ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ മലയാളത്തിൽ കാരണസൂചക ഉപവാക്യമായി മാറ്റുമ്പോൾ, കൊടുങ്കാറ്റിന്റെ പ്രഹരം ഏറ്റവരെന്ന നിലയിൽ 'ഞങ്ങളെ' എന്നു നൽകുന്നത് സ്വാഭാവികം.
- source_word: τῇ ἑξῆς
  choice: പിറ്റേന്ന്
  rationale: ‘അടുത്ത ദിവസം’ എന്ന കാലസൂചനയുടെ സംക്ഷിപ്തവും സാധാരണവുമായ ആധുനിക മലയാളരൂപം.
- source_word: ἐκβολὴν
  choice: ചരക്ക് കടലിലേക്കു വലിച്ചെറിയാൻ
  rationale: കപ്പലിന്റെ ഭാരം കുറയ്ക്കാൻ സാധനങ്ങൾ പുറത്തേക്കെറിയുന്ന നാവികപ്രയോഗമാണ്; സന്ദർഭത്തിൽ സൂചിതമായ ചരക്ക് വ്യക്തമാക്കുന്നു.
- source_word: ἐποιοῦντο
  choice: തുടങ്ങി
  rationale: അപൂർണ്ണകാലരൂപത്തിന്റെ പുരോഗമന/ആരംഭഭാവം കഥാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘എറിഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതും വ്യാകരണപരമായി സാധ്യമാണ്.
