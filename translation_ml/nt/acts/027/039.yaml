translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ ആഖ്യാനശൈലി. നാവികപ്രവർത്തനം വ്യക്തമാക്കാൻ സ്വാഭാവികമായ മലയാളപ്രയോഗം ഉപയോഗിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത ‘മണൽ’ പോലുള്ള വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുസൂചിക അതുമായി ബന്ധപ്പെട്ട ക്രിയാഭാഗത്തിനരികിൽ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
