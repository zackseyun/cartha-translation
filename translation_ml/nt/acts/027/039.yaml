reference: Acts 27:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ അവർക്ക് ആ ദേശം തിരിച്ചറിയാനായില്ല. എന്നാൽ, കടൽത്തീരമുള്ള ഒരു ഉൾക്കടൽ അവർ കണ്ടു. കഴിയുമെങ്കിൽ ആ ഉൾക്കടലിലേക്കു കപ്പൽ ഓടിച്ചുകയറ്റി കരയ്ക്കടുപ്പിക്കാൻ അവർ ആലോചിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “കപ്പൽ തീരത്തടിപ്പിക്കാൻ.” ഗ്രീക്ക് ക്രിയ കപ്പലിനെ ബലമായി കരയിലേക്കു നീക്കി കയറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: പകൽ വെളിച്ചമായപ്പോൾ
  rationale: പകൽ വന്നെത്തിയെന്ന ഗ്രീക്ക് കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: അവർക്ക് ആ ദേശം തിരിച്ചറിയാനായില്ല
  rationale: ἐπιγινώσκωയുടെ ‘തിരിച്ചറിയുക/തിരിച്ചറിഞ്ഞ് മനസ്സിലാക്കുക’ എന്ന അർഥവും γῆയുടെ പൊതുവായ ‘ദേശം/കര’ എന്ന അർഥവും സന്ദർഭോചിതമായി നൽകുന്നു. ഇവിടെ സ്ഥലം ഏതാണെന്ന് തിരിച്ചറിയാതിരുന്നതാണ് ഉദ്ദേശ്യം.
- source_word: κόλπον δέ τινα κατενόουν
  choice: എന്നാൽ ... ഒരു ഉൾക്കടൽ അവർ കണ്ടു
  rationale: κόλπος എന്നത് ഈ നാവികസന്ദർഭത്തിൽ ഉൾക്കടലിനെയോ കടലിടുക്കിനെയോ സൂചിപ്പിക്കുന്നു; τιναയുടെ അനിശ്ചിതത്വം ‘ഒരു’ നിലനിർത്തുന്നു. κατενόουν വെറും കാഴ്ചയല്ല, ശ്രദ്ധയിൽപ്പെടലാണ്; മലയാളത്തിൽ ‘കണ്ടു’ സ്വാഭാവികമായി അത് വഹിക്കുന്നു.
- source_word: ἔχοντα αἰγιαλὸν
  choice: കടൽത്തീരമുള്ള
  rationale: αἰγιαλός തീരത്തെയോ കടൽത്തീരത്തെയോ സൂചിപ്പിക്കുന്നു. മണൽത്തീരം എന്ന് മൂലപാഠത്തിലില്ലാത്ത വിശദാംശം ചേർക്കുന്നില്ല.
- source_word: εἰς ὃν
  choice: അതിലേക്കു
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചന നിലനിർത്തി, മുൻപറഞ്ഞ ഉൾക്കടലിലേക്കാണ് കപ്പൽ നീക്കാൻ ഉദ്ദേശിച്ചതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐβουλεύοντο
  choice: അവർ ആലോചിച്ചു
  rationale: βουλεύομαιയിൽ ആലോചന, പദ്ധതി, തീരുമാനം എന്നീ ഭാവങ്ങൾ ഉൾപ്പെടുന്നു. ‘ആലോചിച്ചു’ പ്രവർത്തനം വിജയിക്കുമോ എന്ന അനിശ്ചിതത്വമുള്ള സാഹചര്യത്തെ അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല.
- source_word: εἰ δύναιντο
  choice: കഴിയുമെങ്കിൽ
  rationale: εἰയോടുകൂടിയ optative സൂചിപ്പിക്കുന്ന സാധ്യതയും നിബന്ധനയും ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: കപ്പൽ ... ഓടിച്ചുകയറ്റി കരയ്ക്കു കയറ്റാൻ
  rationale: ἐξωθέωയുടെ തള്ളുകയോ ബലമായി നീക്കുകയോ ചെയ്യുന്ന ഭാവം നാവികസന്ദർഭത്തിൽ കപ്പൽ തീരത്തേക്കു കയറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു. വിവർത്തനം ആ ഉദ്ദേശിച്ച നീക്കവും ഫലവും വ്യക്തമാക്കുന്നു.
