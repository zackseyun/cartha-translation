translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ധൈര്യം പ്രാപിച്ച്’ എന്ന പ്രയോഗം കടൽദുരന്തത്തിന്റെ പശ്ചാത്തലത്തിലെ മനോവീര്യത്തിലെ മാറ്റം വ്യക്തമാക്കുന്നു; ‘അവരും’ καὶ αὐτοὶയുടെ അനുഗമന-ഊന്നൽ സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു.
