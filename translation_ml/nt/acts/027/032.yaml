translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കടൽയാത്രാസന്ദർഭം വായനക്കാരന് വ്യക്തമായി ലഭിക്കാൻ ‘ചെറുവള്ളം’, ‘ഒഴുകിപ്പോകാൻ’ എന്നീ സ്വാഭാവിക പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ വ്യത്യസ്ത അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
