source:
  edition: SBLGNT
  text: τότε ⸂ἀπέκοψαν οἱ στρατιῶται⸃ τὰ σχοινία τῆς σκάφης καὶ εἴασαν αὐτὴν ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/032.yaml
  text: Then the soldiers cut away the ropes of the skiff and let it fall off[a][b].
translation:
  language: ml
  text: അപ്പോൾ സൈനികർ ചെറുവള്ളത്തിന്റെ[a] കയറുകൾ മുറിച്ചുകളഞ്ഞ് അതിനെ അകന്നുപോകാൻ[b] വിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ചെറുവള്ളം’ എന്നതിന് ‘വള്ളം’ അല്ലെങ്കിൽ ‘കപ്പലിലെ വള്ളം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ സ്കാഫേ (skaphē) പ്രധാന കപ്പലിനോടു ബന്ധിപ്പിച്ചിരുന്ന ചെറിയ വള്ളത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുക്രിയയ്ക്ക് അക്ഷരാർഥത്തിൽ ‘വീണുപോകാൻ’ എന്ന അർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ ‘ഒഴുകിയകന്നുപോകാൻ’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലക്രമപ്രയോഗം.
- source_word: ἀπέκοψαν
  choice: മുറിച്ചുകളഞ്ഞ്
  rationale: കയറുകൾ അറുത്ത് വേർപെടുത്തിയ ഭൗതികപ്രവൃത്തി വ്യക്തമായി നൽകുന്നു.
- source_word: οἱ στρατιῶται
  choice: പടയാളികൾ
  rationale: സൈനികരെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളപദം.
- source_word: τὰ σχοινία
  choice: കയറുകൾ
  rationale: ഈ കപ്പൽസന്ദർഭത്തിലെ കയറുകളെയോ ബന്ധനക്കയറുകളെയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῆς σκάφης
  choice: ചെറുവള്ളത്തിന്റെ
  rationale: പ്രധാന കപ്പലിനോടു ബന്ധിച്ചിരുന്ന ചെറിയ സഹായവള്ളമാണ് ഉദ്ദേശിക്കുന്നത്; പ്രധാന കപ്പലിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: εἴασαν
  choice: വിട്ടു
  rationale: ἐάω എന്ന ക്രിയയുടെ ‘അനുവദിക്കുക/വിടുക’ എന്ന അർത്ഥം അനുബന്ധ ക്രിയയോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτὴν
  choice: അതിനെ
  rationale: മുൻപറഞ്ഞ ചെറുവള്ളത്തിലേക്കുള്ള സർവനാമസൂചന വ്യക്തമാക്കുന്നു.
- source_word: ἐκπεσεῖν
  choice: ഒഴുകിപ്പോകാൻ
  rationale: കപ്പൽസന്ദർഭത്തിൽ കയറുകൾ മുറിച്ചശേഷം വള്ളം അകന്നുപോകുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘വീണുപോകുക’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
