source:
  edition: SBLGNT
  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: ml
  text: 'ഗണ്യമായ സമയം കടന്നുപോയിരുന്നു; ഉപവാസദിനം പോലും ഇതിനകം കഴിഞ്ഞിരുന്നതിനാൽ കടൽയാത്ര അപ്പോഴേക്കും അപകടകരമായിരുന്നു. അതിനാൽ പൗലോസ് അവർക്കു ഉപദേശം നൽകിക്കൊണ്ടിരുന്നു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: ഗണ്യമായ സമയം കഴിഞ്ഞിരുന്നു
  rationale: സമയത്തിന്റെ ശ്രദ്ധേയമായ ദൈർഘ്യവും അത് ഇതിനകം കടന്നുപോയെന്ന ആശയവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: കടൽയാത്ര അപ്പോഴേക്കും അപകടകരമായിരുന്നു
  rationale: πλοῦς ഇവിടെ കപ്പലിനെയല്ല, കടൽമാർഗമുള്ള യാത്രയെയാണ് സൂചിപ്പിക്കുന്നത്; ἐπισφαλής യാത്രയുടെ അപകടസാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: ‘ഉപവാസം’ പോലും ഇതിനകം കഴിഞ്ഞുപോയിരുന്നതിനാൽ
  rationale: διάയോടുകൂടിയ articular infinitive കാരണബന്ധം നൽകുന്നു; καίയുടെ ‘പോലും’ എന്ന ഊന്നലും perfect infinitive സൂചിപ്പിക്കുന്ന പൂർത്തിയായ അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: τὴν νηστείαν
  choice: ‘ഉപവാസം’
  rationale: നിശ്ചിത ആർട്ടിക്കിളോടെയുള്ള ഏകവചനം പ്രസിദ്ധമായ യഹൂദ ഉപവാസത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. പ്രധാന പാഠത്തിൽ ഉറവിടത്തിലെ സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തി സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παρῄνει
  choice: ഉപദേശിച്ചുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം പ്രകടമാക്കുകയും ‘മുന്നറിയിപ്പ് നൽകി’ എന്ന കൂടുതൽ ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
