revisions:
- from: 'ഗണ്യമായ സമയം കഴിഞ്ഞിരുന്നു. ‘ഉപവാസം’[a] പോലും ഇതിനകം കഴിഞ്ഞുപോയിരുന്നതിനാൽ കടൽയാത്ര അപ്പോഴേക്കും അപകടകരമായിരുന്നു[b]. അതുകൊണ്ട് പൗലോസ് അവരെ ഉപദേശിച്ചുകൊണ്ടിരുന്നു:'
  to: 'ഗണ്യമായ സമയം കടന്നുപോയിരുന്നു; ഉപവാസദിനം പോലും ഇതിനകം കഴിഞ്ഞിരുന്നതിനാൽ കടൽയാത്ര അപ്പോഴേക്കും അപകടകരമായിരുന്നു. അതിനാൽ പൗലോസ് അവർക്കു ഉപദേശം നൽകിക്കൊണ്ടിരുന്നു:'
