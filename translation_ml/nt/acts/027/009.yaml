translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വാക്യത്തിന്റെ അവസാനം വരുന്ന ദ്വിബിന്ദു അടുത്ത വാക്യത്തിൽ പൗലോസിന്റെ ഉപദേശം തുടരുന്നതായി സൂചിപ്പിക്കുന്നു. സാംസ്കാരിക തിരിച്ചറിവ് പ്രധാന പാഠത്തിൽ നിർബന്ധിതമാക്കാതെ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
