translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. നാവികസന്ദർഭം വ്യക്തമാക്കാൻ ‘കപ്പൽ അടുപ്പിച്ചു’ എന്നും, നിയമപരമായ അനുമതിയുടെ ഭാവത്തിന് ‘അനുവാദം നൽകി’ എന്നും തെരഞ്ഞെടുത്തു. മൂലത്തിലെ ഏക ദീർഘവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് സ്വാഭാവിക ഘടകങ്ങളായി വിരാമചിഹ്നങ്ങളാൽ ക്രമപ്പെടുത്തി.
