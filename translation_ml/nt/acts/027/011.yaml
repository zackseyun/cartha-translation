id: ACT.27.11
reference: Acts 27:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἑκατοντάρχης τῷ κυβερνήτῃ καὶ τῷ ναυκλήρῳ ⸂μᾶλλον ἐπείθετο⸃ ἢ τοῖς ⸀ὑπὸ Παύλου λεγομένοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/011.yaml
  text: But the centurion paid more attention to the pilot and the shipowner than to what was being said by Paul[a].
translation:
  language: ml
  text: എന്നാൽ ശതാധിപൻ പൗലോസ് പറഞ്ഞതിനെക്കാൾ കപ്പൽ നിയന്ത്രിക്കുന്നവന്റെയും കപ്പലുടമയുടെയും വാക്കുകൾക്ക് കൂടുതൽ ചെവികൊടുത്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശതാധിപൻ പൗലോസ് പറഞ്ഞ കാര്യങ്ങളേക്കാൾ കപ്പൽ നിയന്ത്രിക്കുന്നവന്റെയും കപ്പലുടമയുടെയും വാക്കുകളാൽ കൂടുതൽ ബോധ്യപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: ഒരു റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന ചരിത്രപരവും മലയാള ബൈബിൾ വായനയിൽ പരിചിതവുമായ പദം.
- source_word: κυβερνήτῃ
  choice: കപ്പൽ നിയന്ത്രിക്കുന്നവൻ
  rationale: കപ്പൽ ഓടിക്കുകയും ദിശ നിയന്ത്രിക്കുകയും ചെയ്യുന്ന വ്യക്തിയെയാണ് ഈ സമുദ്രയാത്രാ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ναύκληρος എന്ന വേറിട്ട ചുമതലയിൽനിന്ന് ഇതിനെ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: ναυκλήρῳ
  choice: കപ്പലുടമ
  rationale: കപ്പലിന്റെ ഉടമയെയോ അതിന്റെ പ്രധാന നടത്തിപ്പുകാരനെയോ സൂചിപ്പിക്കുന്ന പദം; κυβερνήτης-ൽനിന്നുള്ള സാധ്യതയുള്ള ചുമതലാവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: μᾶλλον ἐπείθετο
  choice: കൂടുതൽ ചെവികൊടുത്തത്
  rationale: തീരുമാനമെടുക്കുന്ന ഈ സന്ദർഭത്തിൽ അവരുടെ വാക്കുകൾക്ക് കൂടുതൽ പ്രാധാന്യം നൽകുകയും അവയാൽ സ്വാധീനിക്കപ്പെടുകയും ചെയ്തുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കൂടുതൽ’ താരതമ്യബലം നിലനിർത്തുന്നു.
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: പൗലോസ് പറഞ്ഞത്
  rationale: പൗലോസിന്റെ വാക്കുകളെയോ ഉപദേശത്തെയോ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പൗലോസിന്റെ മുന്നറിയിപ്പിനോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἢ
  choice: -നെക്കാൾ
  rationale: μᾶλλον-നോടുചേർന്നുള്ള താരതമ്യം മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
