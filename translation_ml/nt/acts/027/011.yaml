translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, ചരിത്രപരമായ ‘ശതാധിപൻ’ നിലനിർത്തിക്കൊണ്ട്, നാവികചുമതലകൾ സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന വിധത്തിൽ വിവരിച്ചു. ἐπείθετο എന്നതിലെ ‘ബോധ്യപ്പെടുക/വിശ്വസിക്കുക/ചെവികൊടുക്കുക’ എന്ന അർഥവ്യാപ്തി മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
