  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ആഖ്യാനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. നാവികപ്രയോഗങ്ങൾ സാങ്കേതികഭാരം കൂടാതെ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
