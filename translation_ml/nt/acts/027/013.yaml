source:
  edition: SBLGNT
  text: Ὑποπνεύσαντος δὲ νότου δόξαντες τῆς προθέσεως κεκρατηκέναι ἄραντες ἆσσον παρελέγοντο τὴν Κρήτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/013.yaml
  text: And when a south wind began to blow gently[a], thinking that they had obtained their purpose, they weighed anchor and sailed along Crete[c][b], close inshore.
translation:
  language: ml
  text: തെക്കൻ കാറ്റ് മൃദുവായി വീശിത്തുടങ്ങിയപ്പോൾ, തങ്ങളുടെ ലക്ഷ്യം കൈവരിച്ചുവെന്ന് വിചാരിച്ച് അവർ നങ്കൂരം ഉയർത്തി[a], തീരത്തോടു കൂടുതൽ ചേർന്ന് ക്രേത്തയുടെ തീരത്തുകൂടെ കപ്പലോടിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഉയർത്തി’; നാവികസന്ദർഭത്തിൽ നങ്കൂരം ഉയർത്തി പുറപ്പെടുക എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ക്രേത്തയ്ക്കരികിലൂടെ, തീരത്തോടു കൂടുതൽ ചേർന്ന് കപ്പലോടിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποπνεύσαντος
  choice: മൃദുവായി വീശിത്തുടങ്ങിയപ്പോൾ
  rationale: കാറ്റ് മൃദുവായി വീശുന്നതിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥവും സന്ദർഭത്തിലെ തുടക്കഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: νότου
  choice: തെക്കൻ കാറ്റ്
  rationale: νότος ഇവിടെ തെക്കുനിന്നുള്ള കാറ്റിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: δόξαντες
  choice: കരുതി
  rationale: യാത്രക്കാരുടെ സ്വന്തം വിലയിരുത്തലിനെയോ ധാരണയെയോ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς προθέσεως κεκρατηκέναι
  choice: തങ്ങളുടെ ഉദ്ദേശ്യം സാധിച്ചുവെന്ന്
  rationale: ആസൂത്രണം ചെയ്ത യാത്രാലക്ഷ്യം കൈവന്നുവെന്ന് അവർ ധരിച്ചതാണ് ഈ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർഥം.
- source_word: ἄραντες
  choice: നങ്കൂരം ഉയർത്തി
  rationale: മൂലപദം അക്ഷരാർഥത്തിൽ ‘ഉയർത്തുക’ എന്നാണ്; നാവികസന്ദർഭത്തിൽ സൂചിതമായ നങ്കൂരം വ്യക്തമാക്കി മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
- source_word: ἆσσον
  choice: കരയോടു ചേർന്ന്
  rationale: ‘കൂടുതൽ അടുത്ത്’ എന്ന താരതമ്യഭാവം തീരദേശ നാവികസന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: παρελέγοντο τὴν Κρήτην
  choice: ക്രേത്തയുടെ തീരത്തുകൂടെ കപ്പലോടിച്ചു
  rationale: παραλέγομαι എന്ന നാവികക്രിയ ദ്വീപിന്റെ തീരത്തോടു ചേർന്ന് സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തീരം’ ചേർക്കുന്നത് അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
