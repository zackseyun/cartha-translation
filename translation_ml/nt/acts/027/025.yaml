source:
  edition: SBLGNT
  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], പുരുഷന്മാരേ, ധൈര്യത്തോടെ ഇരിക്കൂ. എന്നോടു പറഞ്ഞതുപോലെതന്നെ അങ്ങനെ സംഭവിക്കുമെന്ന് ഞാൻ ദൈവത്തെ വിശ്വസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഞാൻ ദൈവത്തിൽ ആശ്രയിക്കുന്നു” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം ദൈവത്തിൽ ആശ്രയിക്കുന്നതിനെയോ ദൈവം പറഞ്ഞത് വിശ്വസ Jennings?
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ദൈവിക ഉറപ്പിൽനിന്ന് ഈ പ്രോത്സാഹനം നിഗമനം ചെയ്യുന്നതായി വ്യക്തമാക്കുന്നു.
- source_word: εὐθυμεῖτε
  choice: ധൈര്യമായിരിക്കൂ
  rationale: അപകടസാഹചര്യത്തിൽ മനോധൈര്യം കൈവിടാതിരിക്കാനുള്ള ആഹ്വാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄνδρες
  choice: പുരുഷന്മാരേ
  rationale: ἀνήρ എന്ന പദത്തിന്റെ പുല്ലിംഗ ബഹുവചന സംബോധന കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: πιστεύω τῷ θεῷ
  choice: ഞാൻ ദൈവത്തെ വിശ്വസിക്കുന്നു
  rationale: ദൈവം പറഞ്ഞത് സത്യമെന്നു സ്വീകരിക്കുന്നതിനെയും ദൈവത്തിൽ ആശ്രയിക്കുന്നതിനെയും ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് ദത്തിവ് ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὅτι
  choice: എന്ന്
  rationale: വിശ്വാസത്തിന്റെ ഉള്ളടക്കമാണ് അവതരിപ്പിക്കുന്നത്; കാരണം അല്ല.
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: പറഞ്ഞിരിക്കുന്നതുപോലെതന്നെ സംഭവിക്കും
  rationale: ദൈവിക സന്ദേശവും ഭാവിയിൽ നടക്കാനുള്ളതും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λελάληταί μοι
  choice: എന്നോടു പറഞ്ഞിരിക്കുന്നു
  rationale: പെർഫെക്റ്റ് പാസീവിന്റെ മുൻപ് അരുളപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ സന്ദേശഭാവവും പരോക്ഷ കർമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: πιστεύω τῷ θεῷ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ഞാൻ ദൈവത്തെ വിശ്വസിക്കുന്നു
  alternative: ഞാൻ ദൈവത്തിൽ ആശ്രയിക്കുന്നു
  rationale: ദൈവത്തെ വിശ്വസിക്കുക, അഥവാ ദൈവത്തിന്റെ വാക്ക് സത്യമെന്നു സ്വീകരിക്കുക എന്ന നേരിട്ടുള്ള ബലം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; ആശ്രയത്തിന്റെ സൂക്ഷ്മഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കപ്പൽയാത്രയിലെ പ്രതിസന്ധിസാഹചര്യത്തിന് അനുയോജ്യമായി നേരിട്ടുള്ള സംബോധനയും പ്രോത്സാഹനവും നിലനിർത്തി.
