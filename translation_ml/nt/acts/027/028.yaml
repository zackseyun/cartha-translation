  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ βολίσαντες εὗρον ὀργυιὰς εἴκοσι, βραχὺ δὲ διαστήσαντες καὶ πάλιν βολίσαντες εὗρον ὀργυιὰς δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/028.yaml
  text: And after taking soundings[a], they found twenty fathoms; then after going a little farther and taking soundings again, they found fifteen fathoms.
translation:
  language: ml
  text: അവർ ആഴം അളന്ന് ഇരുപത് ഫാദം[a] ആഴമുണ്ടെന്ന് കണ്ടെത്തി; കുറച്ചുദൂരം മുന്നോട്ടുപോയശേഷം വീണ്ടും ആഴം അളന്ന് പതിനഞ്ച് ഫാദം ആഴമുണ്ടെന്ന് കണ്ടെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഒരു ഫാദം ഏകദേശം ആറടി (1.8 മീറ്റർ) ആണ്. ഭാരക്കട്ടി ഘടിപ്പിച്ച അളവുകയർ കടലിലേക്കിറക്കിയാണ് അവർ ആഴം അളന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: ആഴം അളന്നപ്പോൾ
  rationale: ഈ നാവികസന്ദർഭത്തിൽ ഭാരക്കട്ടിയോടുകൂടിയ അളവുകയർ ഇറക്കി കടലിന്റെ ആഴം നിർണയിക്കുന്ന പ്രവൃത്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ഉപകരണം മാത്രം പറഞ്ഞ് അർഥം അവ്യക്തമാക്കാതെ, പ്രവൃത്തിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εὗρον
  choice: എന്നു കണ്ടു
  rationale: അളവെടുപ്പിലൂടെ ലഭിച്ച ഫലം റിപ്പോർട്ട് ചെയ്യുന്ന ഗ്രീക്ക് ക്രിയയുടെ ലളിതവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: ὀργυιὰς
  choice: ഫാദം
  rationale: ഏകദേശം ആറടി നീളമുള്ള പുരാതന നാവിക അളവിന് തുല്യമായ fathom എന്ന അളവിന്റെ മലയാള ലിപ്യന്തരണം. കൃത്യമായ സംഖ്യാത്മക വിവരണത്തെ നിലനിർത്തുന്നു; അർഥവിവരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἴκοσι
  choice: ഇരുപത്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: βραχὺ διαστήσαντες
  choice: കുറച്ചുകൂടി മുന്നോട്ടുപോയശേഷം
  rationale: കുറച്ചുദൂരം നീങ്ങിയശേഷം എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; മൂലത്തിൽ സൂചിതമായ ചലനം അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആഴം അളക്കുന്ന പ്രവൃത്തി ആവർത്തിച്ചതിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: δεκαπέντε
  choice: പതിനഞ്ച്
  rationale: സംഖ്യയുടെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: καὶ ... δὲ ... καὶ
  choice: …; …ശേഷം വീണ്ടും…
  rationale: ഇവിടെ ബന്ധകങ്ങൾ പ്രധാനമായും സംഭവങ്ങളുടെ ക്രമം അവതരിപ്പിക്കുന്നു. ശക്തമായ വൈരുധ്യം ചുമത്താതെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ആ ബന്ധം നിലനിർത്തുന്നു.
