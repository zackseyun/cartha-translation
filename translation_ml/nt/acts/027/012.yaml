  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. നാവികപ്രയോഗം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകാൻ ‘കപ്പൽ പുറപ്പെടുക’ എന്നു വ്യക്തമാക്കി. ഗ്രീക്ക് വാക്യത്തിലെ അനിശ്ചിതമായ ദിശാസൂചന അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
