id: ACT.27.12
reference: Acts 27:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνευθέτου δὲ τοῦ λιμένος ὑπάρχοντος πρὸς παραχειμασίαν οἱ πλείονες ἔθεντο βουλὴν ἀναχθῆναι ⸀ἐκεῖθεν, εἴ πως δύναιντο καταντήσαντες εἰς Φοίνικα παραχειμάσαι, λιμένα τῆς Κρήτης βλέποντα κατὰ λίβα καὶ κατὰ χῶρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/012.yaml
  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: ml
  text: ആ തുറമുഖം ശീതകാലം ചെലവഴിക്കാൻ അനുയോജ്യമല്ലാതിരുന്നതിനാൽ, അവിടെനിന്ന് കടലിലേക്കു പുറപ്പെടാൻ ഭൂരിപക്ഷം തീരുമാനിച്ചു; എങ്ങനെയെങ്കിലും ഫൊയ്നീക്സിലെത്തി അവിടെ ശീതകാലം ചെലവഴിക്കാൻ കഴിയുമെങ്കിൽ എന്നാശിച്ചാണ് അവർ അങ്ങനെ തീരുമാനിച്ചത്. തെക്കുപടിഞ്ഞാറോട്ടും വടക്കുപടിഞ്ഞാറോട്ടും അഭിമുഖമായുള്ള[a] ക്രേത്തിലെ ഒരു തുറമുഖമായിരുന്നു ഫൊയ്നീക്സ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ ദിശാസൂചന ഗ്രീക്കിൽ ദുഷ്കരമാണ്. പരമ്പരാഗതമായി ഇത് ‘തെക്കുപടിഞ്ഞാറോട്ടും വടക്കുപടിഞ്ഞാറോട്ടും അഭിമുഖമായുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; രണ്ടാമത്തെ ദിശയെ ചിലർ കൂടുതൽ കൃത്യമായി ‘പടിഞ്ഞാറ്-വടക്കുപടിഞ്ഞാറ്’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഫൊയ്നീക്സ് ക്രേത്തിലെ ഒരു തുറമുഖമായിരുന്നു. ചില പഴയ പരിഭാഷകളിൽ ഈ പേര് ‘ഫെനീസ്’ എന്ന രൂപത്തിൽ കാണാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνευθέτου
  choice: അനുയോജ്യമല്ലാതിരുന്നതിനാൽ
  rationale: തുറമുഖം ശീതകാലതാമസത്തിന് യോജിച്ചതല്ലെന്ന പ്രായോഗിക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: λιμένος
  choice: തുറമുഖം
  rationale: നാവികസന്ദർഭത്തിലെ λιμήν എന്ന പദത്തിന് സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: πρὸς παραχειμασίαν
  choice: ശീതകാലം കഴിച്ചുകൂട്ടാൻ
  rationale: ശീതകാലം മുഴുവൻ അവിടെ താമസിക്കുക എന്ന ഉദ്ദേശ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ πλείονες
  choice: ഭൂരിപക്ഷം
  rationale: സംഘത്തിലെ കൂടുതൽ പേർ എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἔθεντο βουλήν
  choice: തീരുമാനിച്ചു
  rationale: കൂട്ടായ ആലോചനയിലൂടെ എടുത്ത നിശ്ചയം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀναχθῆναι ἐκεῖθεν
  choice: അവിടെനിന്ന് കപ്പൽ പുറപ്പെടാൻ
  rationale: ἀνάγω എന്ന നാവികപദത്തിന്റെ ‘കടലിലേക്കു പുറപ്പെടുക’ എന്ന അർഥം സന്ദർഭസഹിതം വ്യക്തമാക്കുന്നു.
- source_word: εἴ πως δύναιντο
  choice: എങ്ങനെയെങ്കിലും ... എത്തി ... കഴിച്ചുകൂട്ടാൻ
  rationale: വിജയം ഉറപ്പില്ലാത്ത പ്രതീക്ഷയും സാധ്യതയും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καταντήσαντες εἰς Φοίνικα
  choice: ഫൊയ്നീക്സിൽ എത്തി
  rationale: നിശ്ചിത ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുക എന്ന അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: Φοίνικα
  choice: ഫൊയ്നീക്സ്
  rationale: ഗ്രീക്ക് Φοῖνιξ എന്ന ക്രേത്തൻ തുറമുഖനാമത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം.
- source_word: παραχειμάσαι
  choice: അവിടെ ശീതകാലം കഴിച്ചുകൂട്ടാൻ
  rationale: ലക്ഷ്യസ്ഥാനത്ത് ശീതകാലം മുഴുവൻ താമസിക്കുക എന്ന ഉദ്ദേശ്യം നിലനിർത്തുന്നു.
- source_word: βλέποντα κατὰ λίβα καὶ κατὰ χῶρον
  choice: തെക്കുപടിഞ്ഞാറോട്ടും വടക്കുപടിഞ്ഞാറോട്ടും അഭിമുഖമായുള്ള
  rationale: പരമ്പരാഗതമായി സ്വീകരിക്കപ്പെടുന്ന ദിശാവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നൽകുന്നു; രണ്ടാം ദിശാപദത്തിന്റെ കൃത്യാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
