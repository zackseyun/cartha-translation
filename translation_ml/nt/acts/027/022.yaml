id: ACT.27.22
reference: Acts 27:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, ധൈര്യം കൈവിടാതിരിക്കാൻ ഞാൻ നിങ്ങളെ പ്രേരിപ്പിക്കുന്നു[a]; നിങ്ങളിൽ ആരുടെയും ജീവൻ നഷ്ടപ്പെടുകയില്ല[b]; കപ്പൽ മാത്രമേ നഷ്ടപ്പെടുകയുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നല്ല മനസ്സോടെ ഇരിക്കാൻ” അല്ലെങ്കിൽ “ധൈര്യത്തോടെ ഇരിക്കാൻ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: “ജീവന്റെ യാതൊരു നഷ്ടവും.” ഇവിടെ ψυχή എന്നത് പ്രത്യേകമായി ‘ആത്മാവ്’ എന്നല്ല, ശാരീരിക ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: ഇപ്പോഴാകട്ടെ
  rationale: പൗലൊസിന്റെ ഇപ്പോഴത്തെ പ്രബോധനത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ പ്രയോഗം.
- source_word: παραινῶ
  choice: ഞാൻ നിങ്ങളെ പ്രേരിപ്പിക്കുന്നു
  rationale: ഉപദേശവും ശക്തമായ പ്രോത്സാഹനവും ഉൾക്കൊള്ളുന്ന ക്രിയയുടെ ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐθυμεῖν
  choice: ധൈര്യമായിരിക്കാൻ
  rationale: പ്രതിസന്ധിയിലും മനോധൈര്യം നിലനിർത്തുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; പദത്തിന്റെ 'ഉത്സാഹത്തോടിരിക്കുക' എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀποβολὴ ψυχῆς
  choice: ജീവൻ നഷ്ടപ്പെടുക
  rationale: ഇവിടെ ψυχή ശരീരജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; 'ആത്മാവ്' എന്ന് പരിഭാഷപ്പെടുത്തിയാൽ സന്ദർഭത്തിൽ ഇല്ലാത്ത ശരീരം–ആത്മാവ് വേർതിരിവ് വരാം.
- source_word: οὐδεμία ἔσται ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ആരുടെയും ... നഷ്ടപ്പെടുകയില്ല
  rationale: സംഘത്തിൽ ഒരാളുടെയും ജീവൻ നഷ്ടമാകില്ലെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλὴν τοῦ πλοίου
  choice: കപ്പൽ മാത്രമേ നഷ്ടപ്പെടുകയുള്ളൂ
  rationale: മനുഷ്യജീവൻ നഷ്ടമാകാത്തതിനോടു വിപരീതമായി കപ്പൽ നഷ്ടമാകുമെന്ന ഒഴിവാക്കൽപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: കടൽദുരന്തത്തിൽ മരണപ്പെടുന്നതിനെക്കുറിച്ചാണ് വാക്യം പറയുന്നത്; അതിനാൽ ഭൗതികജീവൻ എന്ന അർഥം യോജിക്കുന്നു, ആത്മാവിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക ഉപദേശം ഇതിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പ്രബോധനഭാവവും മനുഷ്യജീവനും കപ്പലും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
