revisions:
- from: ശേഷിച്ചവർ[a] ചിലർ പലകകളിന്മേലും മറ്റു ചിലർ കപ്പലിൽനിന്നുള്ള ഏതാനും വസ്തുക്കളിന്മേലും കരയിലെത്തി. ഇങ്ങനെ എല്ലാവരും സുരക്ഷിതരായി കരയിലെത്താൻ ഇടയായി.
  to: ശേഷിച്ചവരിൽ ചിലർ പലകകളിന്മേലും മറ്റു ചിലർ കപ്പലിൽനിന്നുള്ള ചില വസ്തുക്കളിന്മേലും. ഇങ്ങനെ എല്ലാവരും സുരക്ഷിതമായി കരയിലെത്തി.
  rationale: The revision removes the premature assertion of arrival from the first clause and lets the final clause express the outcome for everyone, including those mentioned in the preceding verse. It retains the source's concise, somewhat elliptical listing of the remaining persons and their supports, while using clear modern Malayalam.
