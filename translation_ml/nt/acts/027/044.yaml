id: ACT.27.44
reference: Acts 27:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τοὺς λοιποὺς οὓς μὲν ἐπὶ σανίσιν οὓς δὲ ἐπί τινων τῶν ἀπὸ τοῦ πλοίου· καὶ οὕτως ἐγένετο πάντας διασωθῆναι ἐπὶ τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: ml
  text: ശേഷിച്ചവരിൽ ചിലർ പലകകളിന്മേലും മറ്റു ചിലർ കപ്പലിൽനിന്നുള്ള ചില വസ്തുക്കളിന്മേലും. ഇങ്ങനെ എല്ലാവരും സുരക്ഷിതമായി കരയിലെത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: ശേഷിച്ചവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞവരല്ലാത്ത ശേഷിച്ച ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ചിലർ ... മറ്റു ചിലർ
  rationale: ശേഷിച്ചവരെ രണ്ടു വിഭാഗങ്ങളായി തിരിക്കുന്ന ഗ്രീക്ക് സഹബന്ധഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ σανίσιν
  choice: പലകകളിന്മേൽ
  rationale: σανίς എന്നത് പലകയെയോ വീതിയുള്ള മരക്കഷണത്തെയോ സൂചിപ്പിക്കുന്നു; കപ്പൽച്ചേതത്തിന്റെ സന്ദർഭത്തിന് 'പലകകൾ' യോജിക്കുന്നു.
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: കപ്പലിൽനിന്നുള്ള ഏതാനും വസ്തുക്കളിന്മേൽ
  rationale: τινων എന്ന അനിശ്ചിതപ്രയോഗം കപ്പലിൽനിന്നുള്ള പലതരം വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; മൂലപാഠം പറയാത്ത വിധത്തിൽ അവയെ 'തുണ്ടുകൾ' എന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുമ്പ് വിവരിച്ച മാർഗത്തെയാണ് ചുരുക്കി സൂചിപ്പിക്കുന്നത്.
- source_word: ἐγένετο
  choice: ഇടയായി
  rationale: ഇവിടെ സംഭവിച്ച ഫലത്തെ അവതരിപ്പിക്കുന്ന γίνομαι-യുടെ പ്രയോഗം സ്വാഭാവികമായ മലയാള കഥനത്തിൽ അറിയിക്കുന്നു.
- source_word: πάντας διασωθῆναι
  choice: എല്ലാവരും സുരക്ഷിതരായി ... എത്താൻ
  rationale: διασῴζω ഇവിടെ കപ്പൽച്ചേതത്തിൽനിന്നുള്ള ശാരീരിക രക്ഷയെയും സുരക്ഷിതമായ എത്തിച്ചേരലിനെയും സൂചിപ്പിക്കുന്നു; ആത്മീയ രക്ഷയെന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τὴν γῆν
  choice: കരയിലെത്താൻ
  rationale: സമുദ്രയാത്രയുടെ പശ്ചാത്തലത്തിൽ γῆ കടലിന് വിപരീതമായ കരയാണ്; മലയാളത്തിൽ 'കരയിലെത്തുക' സ്വാഭാവികമാണ്.
theological_decisions:
- issue: διασωθῆναι എന്ന പദത്തിന് ഉണ്ടാകാവുന്ന രക്ഷാശാസ്ത്രപരമായ ധ്വനി
  choice: സുരക്ഷിതരായി കരയിലെത്താൻ
  alternative: കരയിലേക്കു രക്ഷിക്കപ്പെടാൻ / സുരക്ഷിതമായി കരപറ്റാൻ
  rationale: സന്ദർഭം കപ്പൽച്ചേതത്തിൽനിന്നുള്ള ശാരീരിക രക്ഷയാണ്. തെരഞ്ഞെടുത്ത ഭാഷ ആ അർഥം വ്യക്തമാക്കുകയും മൂലപാഠം ഉന്നയിക്കാത്ത ആത്മീയ രക്ഷ എന്ന അവകാശവാദം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. 'പലകകളിന്മേൽ', 'വസ്തുക്കളിന്മേൽ' എന്നീ രൂപങ്ങൾ ആശ്രയിച്ച് ഒഴുകുകയോ കരയിലെത്തുകയോ ചെയ്ത രീതി വ്യക്തമാക്കുന്നു; രണ്ടാം വാക്യം ഗ്രീക്കിലെ ഫലഘടന നിലനിർത്തുന്നു.
