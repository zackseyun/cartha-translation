- from: അത് കപ്പലിലേക്കു വലിച്ചുകയറ്റിയശേഷം, അവർ കപ്പലിന്റെ അടിയിലൂടെ ബലപ്പെടുത്തുന്ന കയറുകൾ ചുറ്റി അതിനെ ഉറപ്പിച്ചു. സിർട്ടിസ് മണൽത്തിട്ടയിൽ[a] ചെന്നിടിക്കുമോ എന്നു ഭയന്ന്, അവർ കപ്പൽസാമഗ്രി താഴ്ത്തി[b]; അങ്ങനെ കാറ്റിൽ ഒഴുകിപ്പോയി.
  to: അത് കപ്പലിലേക്കു വലിച്ചുകയറ്റിയശേഷം, അവർ ബലപ്പെടുത്തുന്ന കയറുകൾകൊണ്ട് കപ്പൽ ചുറ്റിക്കെട്ടി. സിർട്ടിസിൽ[a] ചെന്നുപെടുമോ എന്നു ഭയന്ന്, അവർ ഉപകരണം താഴ്ത്തി[b]; അങ്ങനെ അവർ തള്ളപ്പെട്ടുനീങ്ങി.
  rationale: പരിഷ്കാരം Σύρτις എന്ന സ്ഥലനാമത്തിന്റെ വിശാലമായ കടൽഭീഷണിസൂചനയും ἐκπέσωσιν, σκεῦος എന്നീ പദങ്ങളിലെ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു. കപ്പൽ ബലപ്പെടുത്തുന്ന കയറുകെട്ടൽ കൂടുതൽ സ്വാഭാവികമായ മലയാളത്തിൽ പുനർരചിച്ചു; അവസാന പാസീവ് ക്രിയയിൽ സന്ദർഭത്തിൽ നിന്നുള്ള ‘കാറ്റിൽ’ എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കി.
