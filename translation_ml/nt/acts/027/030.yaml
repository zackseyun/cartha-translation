id: ACT.27.30
reference: Acts 27:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: ml
  text: എന്നാൽ നാവികർ കപ്പലിൽനിന്ന് രക്ഷപ്പെടാൻ ശ്രമിച്ചു. കപ്പലിന്റെ മുൻഭാഗത്തുനിന്ന് നങ്കൂരങ്ങൾ ഇറക്കാൻ പോകുന്നതായി നടിച്ചുകൊണ്ട് അവർ ചെറുവള്ളം[a] കടലിലേക്ക് താഴ്ത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, കപ്പലിനോടൊപ്പമുണ്ടായിരുന്ന ചെറിയ വള്ളം.
    reason: lexical_clarification
lexical_decisions:
- source_word: ναυτῶν
  choice: നാവികർ
  rationale: കപ്പൽ ജീവനക്കാരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ആധുനികവുമായ മലയാളപദം.
- source_word: ζητούντων φυγεῖν
  choice: രക്ഷപ്പെടാൻ ശ്രമിച്ചു
  rationale: ζητέω + infinitive ഇവിടെ ശ്രമമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; കപ്പൽ ഉപേക്ഷിച്ചു രക്ഷപ്പെടാനുള്ള ശ്രമം സന്ദർഭത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ τοῦ πλοίου
  choice: കപ്പലിൽനിന്ന്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: χαλασάντων τὴν σκάφην
  choice: ചെറുവള്ളം കടലിലേക്ക് താഴ്ത്തി
  rationale: σκάφη കപ്പലിനോടൊപ്പമുള്ള ചെറിയ വള്ളമാണ്; ‘ചെറുവള്ളം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: εἰς τὴν θάλασσαν
  choice: കടലിലേക്ക്
  rationale: നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: προφάσει ὡς
  choice: പോകുന്നതായി നടിച്ചുകൊണ്ട്
  rationale: യഥാർഥ ഉദ്ദേശ്യം മറച്ചുവെക്കുന്ന വ്യാജകാരണം πρόφασις സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐκ πρῴρης
  choice: കപ്പലിന്റെ മുൻഭാഗത്തുനിന്ന്
  rationale: നാവികസാങ്കേതിക പദം മാത്രം ആശ്രയിക്കാതെ πρῷραയുടെ സ്ഥാനം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀγκύρας
  choice: നങ്കൂരങ്ങൾ
  rationale: ബഹുവചനത്തെ കൃത്യമായി നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: μελλόντων ἐκτείνειν
  choice: ഇറക്കാൻ പോകുന്നതായി
  rationale: μέλλωയിലെ സമീപ ഉദ്ദേശ്യവും ἐκτείνωയുടെ ഈ നാവികസന്ദർഭത്തിലുള്ള നങ്കൂരം പുറത്തേക്കിടുക/ഇറക്കുക എന്ന അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള വിവരണശൈലി. ദീർഘമായ ഗ്രീക്ക് പങ്കുപദഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; സംഭവക്രമവും വഞ്ചനയുടെ ആശയവും നിലനിർത്തി.
