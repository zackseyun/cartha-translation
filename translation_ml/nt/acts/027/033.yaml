translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഉപവസിക്കുക’ എന്ന മതപരമായ ധ്വനിയുള്ള പദം ഒഴിവാക്കി. ആവർത്തനമായി തോന്നുന്ന അവസാന രണ്ടു പ്രയോഗങ്ങളും ഗ്രീക്ക് വാക്യത്തിലെ ഊന്നൽ സംരക്ഷിക്കാൻ നിലനിർത്തി.
