  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: ml
  text: 'നേരം പുലരാറാകുന്നതുവരെ പൗലോസ് എല്ലാവരെയും അല്പം ഭക്ഷണം കഴിക്കാൻ പ്രേരിപ്പിച്ചുകൊണ്ടിരുന്നു. അദ്ദേഹം പറഞ്ഞു: “ഇന്ന് പതിനാലാം ദിവസമാണ് നിങ്ങൾ കാത്തിരിക്കുകയാണ്[a]; ഒന്നും കഴിക്കാതെ തുടരുന്നു; ഒന്നും ഭക്ഷിച്ചിട്ടുമില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഉറ്റുനോക്കിക്കൊണ്ട്” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പിനെ സൂചിപ്പിക്കാം; ഈ കൊടുങ്കാറ്റിന്റെ സാഹചര്യത്തിൽ അതിന് ഉത്കണ്ഠയോടെയുള്ള കാത്തിരിപ്പ് എന്ന ഭാവവും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ
  choice: നേരം ... വരെ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയുടെ സമയപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡμέρα ἤμελλεν γίνεσθαι
  choice: പുലരാറാകുന്നതു
  rationale: അക്ഷരാർഥത്തിൽ ‘പകൽ ആകാനിരിക്കുക’; ഇവിടെ അടുത്തെത്തിയ പ്രഭാതത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: παρεκάλει
  choice: അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയായതോ ആവർത്തിച്ചതോ ആയ അഭ്യർഥന സംരക്ഷിക്കുന്നു.
- source_word: ἅπαντας
  choice: എല്ലാവരോടും
  rationale: കപ്പലിലുണ്ടായിരുന്ന എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സമഗ്രത നിലനിർത്തുന്നു.
- source_word: μεταλαβεῖν τροφῆς
  choice: അല്പം ഭക്ഷണം കഴിക്കാൻ
  rationale: ഭക്ഷണത്തിൽനിന്ന് പങ്കെടുത്ത് പോഷണം സ്വീകരിക്കുക എന്ന ആശയവും വിഭക്തിയുടെ ഭാഗികഭാവവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: ഇന്നേക്ക് പതിനാലാം ദിവസമായി
  rationale: ഇപ്പോഴത്തെ ദിവസം പതിനാലാമത്തേതാണെന്ന ഗ്രീക്ക് ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: προσδοκῶντες
  choice: കാത്തിരിപ്പിൽ
  rationale: പ്രതീക്ഷയോടെ കാത്തിരിക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും കൊടുങ്കാറ്റിന്റെ സാഹചര്യത്തിൽ ഉണ്ടായിരുന്ന ഉത്കണ്ഠ വായനക്കാരൻ ഗ്രഹിക്കാൻ ഇടനൽകുകയും ചെയ്യുന്നു.
- source_word: ἄσιτοι διατελεῖτε
  choice: ഒന്നും കഴിക്കാതെ തുടരുന്നു
  rationale: സ്വമേധയാ അനുഷ്ഠിക്കുന്ന മതപരമായ ഉപവാസം എന്ന ധ്വനി ഒഴിവാക്കി, ഭക്ഷണം കഴിക്കാത്ത നില തുടർന്നുവെന്ന ആശയം നൽകുന്നു.
- source_word: μηθὲν προσλαβόμενοι
  choice: നിങ്ങൾ ഒന്നും ഭക്ഷിച്ചിട്ടില്ല
  rationale: സ്വന്തമായി ഒന്നും സ്വീകരിച്ചിട്ടില്ല എന്ന പങ്കാളിക്രിയയുടെ ആശയം ഈ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
