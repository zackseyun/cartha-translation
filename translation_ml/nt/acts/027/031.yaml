id: ACT.27.31
reference: Acts 27:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: ml
  text: 'പൗലോസ് ശതാധിപനോടും പടയാളികളോടും പറഞ്ഞു: “ഇവർ കപ്പലിൽത്തന്നെ തുടരുന്നില്ലെങ്കിൽ, നിങ്ങൾക്കു രക്ഷപ്പെടാൻ[a] കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രക്ഷിക്കപ്പെടാൻ.” ഇവിടെ ഗ്രീക്കുപദം ശാരീരികമായി ജീവനോടെ രക്ഷപ്പെടുന്നതിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ ഈ പദവിക്കുള്ള പ്രചാരമുള്ളതും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: οὗτοι
  choice: ഇവർ
  rationale: സന്ദർഭത്തിൽ കപ്പൽ വിട്ടുപോകാൻ ശ്രമിച്ച നാവികരെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ബഹുവചന സർവനാമം സ്വാഭാവികമായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു.
- source_word: μείνωσιν
  choice: തുടരുക
  rationale: കപ്പലിനുള്ളിൽത്തന്നെ ഉണ്ടായിരിക്കണം എന്ന വ്യവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ πλοίῳ
  choice: കപ്പലിൽത്തന്നെ
  rationale: ἐν എന്നതിന്റെ സ്ഥാനാർഥവും മുന്നറിയിപ്പിലെ ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു; πλοῖον ഇവിടെ കടൽയാത്രയ്ക്കുള്ള വലിയ കപ്പലാണ്.
- source_word: σωθῆναι
  choice: രക്ഷപ്പെടുക
  rationale: σῴζω എന്നതിന്റെ രക്ഷ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട്, കപ്പൽച്ചേതത്തിൽനിന്നുള്ള ശാരീരിക അതിജീവനമാണ് ഇവിടെ ഉദ്ദേശ്യമെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐ δύνασθε
  choice: നിങ്ങൾക്കു കഴിയില്ല
  rationale: കഴിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നിഷേധം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: σωθῆναι എന്നത് വിശാലമായ ‘രക്ഷിക്കപ്പെടുക’ എന്ന ഭാഷയിലോ വ്യക്തമായ ശാരീരിക രക്ഷയുടെ ഭാഷയിലോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്.
  choice: രക്ഷപ്പെടാൻ
  alternative: രക്ഷിക്കപ്പെടാൻ
  rationale: തൽസന്ദർഭം കൊടുങ്കാറ്റിലും കപ്പൽച്ചേതത്തിലുംനിന്നുള്ള ശാരീരിക അതിജീവനമാണ്. ‘രക്ഷപ്പെടുക’ എന്നത് ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു; അടിക്കുറിപ്പിൽ ഗ്രീക്കിലെ വിശാലമായ ‘രക്ഷിക്കപ്പെടുക’ എന്ന രൂപം രേഖപ്പെടുത്തി യഥാർഥ പദവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ വിവരണശൈലി. ‘ശതാധിപൻ’ ചരിത്രപരമായ റോമൻ സൈനികപദവി കൃത്യമായി നിലനിർത്തുന്നു; ‘കപ്പലിൽത്തന്നെ’ വ്യവസ്ഥയിലെ ഊന്നൽ വ്യക്തമാക്കുന്നു.
