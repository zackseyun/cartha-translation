  text: παρέστη γάρ μοι ταύτῃ τῇ ⸀νυκτὶ τοῦ θεοῦ, οὗ ⸀εἰμι, ᾧ καὶ λατρεύω, ⸀ἄγγελος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/023.yaml
  text: For this very night an angel of the God to whom I belong and whom I also worship stood by me[b][a],
translation:
  language: ml
  text: കാരണം, ഞാൻ ആർക്കു സ്വന്തമാണോ, ആരെ ഞാൻ ആരാധിക്കുന്നുവോ, ആ ദൈവത്തിന്റെ ഒരു ദൂതൻ ഈ രാത്രിയിൽ എന്റെ അരികിൽ വന്നുനിന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ഞാൻ ആരുടേതാണോ.’'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഞാൻ ആരെക്കൂടി സേവിക്കുന്നുവോ’; ഗ്രീക്കിലെ ക്രിയയ്ക്ക് ദൈവത്തിനർപ്പിക്കുന്ന വിശുദ്ധസേവനത്തെയോ ആരാധനയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: എന്റെ അരികിൽ വന്നുനിന്നു
  rationale: പൗലോസിന്റെ അരികിലുള്ള പെട്ടെന്നുള്ള സാന്നിധ്യം സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘എനിക്കു പ്രത്യക്ഷപ്പെട്ടു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: ചുറ്റുപാടിലുള്ള വാക്യങ്ങളിൽ പൗലോസിന്റെ ആത്മവിശ്വാസത്തിനുള്ള വിശദീകരണമാണ് γάρ അവതരിപ്പിക്കുന്നത്.
- source_word: ταύτῃ τῇ νυκτί
  choice: ഈ രാത്രിയിൽ
  rationale: സംഭവം അതേ രാത്രിയിലാണെന്ന ഉടനടിത്തം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ θεοῦ
  choice: ആ ദൈവത്തിന്റെ
  rationale: ജനിറ്റീവ് ἄγγελος എന്ന പദത്തെ വിശേഷിപ്പിച്ച് ദൂതൻ ആരുടേതാണെന്ന് വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള ബന്ധവാക്യങ്ങളുമായി ബന്ധവും സൂക്ഷിക്കുന്നു.
- source_word: οὗ εἰμι
  choice: ഞാൻ ആരുടേതാണോ
  rationale: ‘ഞാൻ ആരുടേതാണോ’ എന്നത് ഗ്രീക്കിലെ അക്ഷരാർഥഘടനയും ദൈവത്തോടുള്ള പൗലോസിന്റെ സ്വന്തബന്ധവും നിലനിർത്തുന്നു; മലയാളത്തിൽ ഗൗരവമുള്ളതും ഗ്രഹിക്കാവുന്നതുമാണ്.
- source_word: ᾧ καὶ λατρεύω
  choice: ഞാൻ ആരെ ആരാധിക്കുന്നുവോ
  rationale: λατρεύω ദൈവത്തോടു ബന്ധപ്പെട്ട വിശുദ്ധ സേവനത്തെയോ ആരാധനയെയോ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ ‘ആരാധിക്കുക’ അതിന്റെ മതപരമായ ബലം വ്യക്തമായി നൽകുന്നു.
- source_word: ἄγγελος
  choice: ഒരു ദൂതൻ
  rationale: ദൈവിക ആശ്വാസം നൽകുന്ന ഈ സന്ദർഭത്തിൽ മനുഷ്യസന്ദേശവാഹകനല്ല, അതീന്ദ്രിയ ദൂതനാണ് ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: οὗ εἰμι എന്ന പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഞാൻ ആരുടേതാണോ
  alternative: ഞാൻ ആരുടേതായി ഇരിക്കുന്നുവോ / ഞാൻ ആർക്കു സ്വന്തമാണോ
  rationale: ഈ രൂപം ദൈവത്തോടുള്ള സ്വന്തബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ യഥാർഥ പദപ്രയോഗം സംരക്ഷിക്കുന്നു; അതിലുപരി പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: λατρεύω എന്നതിന്റെ പരിഭാഷ
  choice: ആരാധിക്കുന്നു
  alternative: സേവിക്കുന്നു
  rationale: ദൈവത്തെ സംബന്ധിക്കുമ്പോൾ ഈ ക്രിയ വിശുദ്ധസേവനത്തിന്റെയും ആരാധനയുടെയും അർഥം വഹിക്കുന്നു. ‘ആരാധിക്കുന്നു’ മതപരമായ ശക്തി വ്യക്തമാക്കുന്നു; ‘സേവിക്കുന്നു’ എന്ന സാധുവായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ബന്ധവാക്യങ്ങളുടെ ക്രമവും ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്ന ബന്ധവും കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ ക്രമം മുഖ്യവാചകത്തിൽ [a][b] ആയി ക്രമപ്പെടുത്തി.
