id: ACT.27.42
reference: Acts 27:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῶν δὲ στρατιωτῶν βουλὴ ἐγένετο ἵνα τοὺς δεσμώτας ἀποκτείνωσιν, μή τις ἐκκολυμβήσας διαφύγῃ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/042.yaml
  text: The soldiers’ plan was to kill the prisoners, so that no one might swim away and escape.
translation:
  language: ml
  text: തടവുകാരിൽ ആരും നീന്തിപ്പോയി രക്ഷപ്പെടാതിരിക്കാൻ അവരെ കൊന്നുകളയണമെന്നായിരുന്നു സൈനികരുടെ ആലോചന.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ ἐγένετο
  choice: ആലോചന ... എന്നായിരുന്നു
  rationale: സൈനികർക്കിടയിൽ രൂപപ്പെട്ട പദ്ധതി/തീരുമാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ആലോചന’ എന്നത് നടപ്പാക്കുന്നതിന് മുമ്പുള്ള പദ്ധതിയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: τοὺς δεσμώτας
  choice: തടവുകാരെ
  rationale: ബന്ധനത്തിലായിരുന്നവരെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: ἀποκτείνωσιν
  choice: കൊന്നുകളയണം
  rationale: കൊല്ലുക എന്ന ശക്തവും നേരിട്ടുള്ള അർഥം മൃദൂകരിക്കാതെ നൽകുന്നു.
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: നീന്തിപ്പോയി രക്ഷപ്പെടുക
  rationale: കപ്പലിൽനിന്ന് നീന്തി അകന്നുപോയി രക്ഷപ്പെടുക എന്ന രണ്ടു ഘടകങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സ്വാഭാവികവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ δὲയെ നിർബന്ധിതമായ ‘എന്നാൽ/അപ്പോൾ’ എന്ന പദം ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ കൈകാര്യം ചെയ്തു. μή τις എന്ന ഉദ്ദേശ്യപ്രയോഗം ‘ആരും ... രക്ഷപ്പെടാതിരിക്കാൻ’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
