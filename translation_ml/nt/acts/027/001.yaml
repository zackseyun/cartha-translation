  to: ഞങ്ങൾ ഇറ്റലിയിലേക്കു കപ്പലിൽ യാത്രതിരിക്കണമെന്ന് തീരുമാനിക്കപ്പെട്ടപ്പോൾ, പൗലോസിനെയും മറ്റു ചില തടവുകാരെയും ഔഗുസ്തൻ പടവിഭാഗത്തിലെ യൂലിയൊസ് എന്നു പേരുള്ള ഒരു ശതാധിപന് ഏൽപ്പിച്ചു.[a]
