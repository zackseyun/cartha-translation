id: ACT.27.1
reference: Acts 27:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: ml
  text: ഞങ്ങൾ ഇറ്റലിയിലേക്കു കപ്പലിൽ യാത്രതിരിക്കണമെന്ന് തീരുമാനിക്കപ്പെട്ടപ്പോൾ, പൗലോസിനെയും മറ്റു ചില തടവുകാരെയും ഔഗുസ്തൻ പടവിഭാഗത്തിലെ യൂലിയൊസ് എന്നു പേരുള്ള ഒരു ശതാധിപന് ഏൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാമ്രാജ്യ പടവിഭാഗത്തിലെ”; ഒരുപക്ഷേ, “സെബസ്തേ പടവിഭാഗത്തിലെ.” ഗ്രീക്കിലെ Σεβαστῆς എന്ന പദം ഔഗുസ്തൊസ്/ചക്രവർത്തി എന്ന പദവിയുമായി ബന്ധപ്പെട്ടതാണ്; എന്നാൽ ഉദ്ദേശിക്കുന്ന കൃത്യമായ സൈനികവിഭാഗം ഏതെന്ന് ഉറപ്പില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: തീരുമാനിക്കപ്പെട്ടപ്പോൾ
  rationale: അനൗദ്യോഗികമായി ആരാണ് തീരുമാനിച്ചതെന്ന് വ്യക്തമാക്കാതെ നിൽക്കുന്ന ഗ്രീക്ക് കർമണിപ്രയോഗവും ഔദ്യോഗിക തീരുമാനത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῦ ἀποπλεῖν ἡμᾶς
  choice: ഞങ്ങൾ ഇറ്റലിയിലേക്കു കപ്പൽ കയറിപ്പോകണമെന്ന്
  rationale: ആദ്യപുരുഷ ബഹുവചനം നിലനിർത്തുകയും ἀποπλεῖν എന്നതിലെ കടൽയാത്രയുടെ പ്രത്യേകത സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: παρεδίδουν
  choice: ഏല്പിച്ചു
  rationale: തടവുകാരുടെ കാവൽ ഔദ്യോഗികമായി കൈമാറുന്നതിനെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് അപൂർണ്ണഭൂതത്തിന്റെ കഥനപ്രയോഗത്തിന് മലയാളത്തിലെ സാധാരണ ഭൂതകാലം സ്വാഭാവികമാണ്.
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: പൗലോസിനെയും മറ്റു ചില തടവുകാരെയും
  rationale: τε…καί എന്ന സംയോജിത ഘടനയും ἑτέρους എന്ന ‘മറ്റു’ എന്ന അർത്ഥവും ലളിതമായി പകർന്നിരിക്കുന്നു.
- source_word: ἑκατοντάρχῃ
  choice: ഒരു ശതാധിപന്
  rationale: റോമൻ സൈനികസ്ഥാനമായ centurion-നുള്ള പരിചിതമായ മലയാള ബൈബിൾപദം; ഇവിടെ ആദ്യമായി പരിചയപ്പെടുത്തുന്നതിനാൽ ‘ഒരു’ ചേർത്തു.
- source_word: ὀνόματι Ἰουλίῳ
  choice: യൂലിയൊസ് എന്നു പേരുള്ള
  rationale: ഗ്രീക്ക് നാമപരിചയ സൂത്രത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; Ἰούλιος എന്ന ഗ്രീക്ക് രൂപത്തോട് അടുത്ത ലിപ്യന്തരണം.
- source_word: σπείρης Σεβαστῆς
  choice: ഔഗുസ്ത്യ പടവിഭാഗത്തിലെ
  rationale: Σεβαστή എന്ന സാമ്രാജ്യപദവിയുമായി ബന്ധപ്പെട്ട വിശേഷണം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; σπεῖρα എന്ന റോമൻ സൈനികഘടകത്തിന് വായനാസൗകര്യമുള്ള ‘പടവിഭാഗം’ ഉപയോഗിച്ചു. ചരിത്രപരമായ കൃത്യമായ യൂണിറ്റ് അനിശ്ചിതമായതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: σπείρης Σεβαστῆς എന്ന ചരിത്രപരമായി അനിശ്ചിതമായ സൈനികനാമത്തിന്റെ വിവർത്തനം
  choice: ഔഗുസ്ത്യ പടവിഭാഗത്തിലെ
  alternative: സാമ്രാജ്യ പടവിഭാഗത്തിലെ; സെബസ്തേ പടവിഭാഗത്തിലെ
  rationale: ഇത് ഉപദേശപരമായ പദമല്ലെങ്കിലും ചരിത്രപരമായ വ്യാഖ്യാനതിരഞ്ഞെടുപ്പാണ്. ‘ഔഗുസ്ത്യ’ മൂലത്തിലെ ഔദ്യോഗിക ബഹുമാനപ്പേരുമായുള്ള ബന്ധം നിലനിർത്തുന്നു; കൃത്യമായ ചരിത്രപരമായ തിരിച്ചറിയൽ ഉറപ്പില്ലെന്നത് അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ‘ഞങ്ങൾ’ എന്ന യാത്രാവിവരണവും സംരക്ഷിച്ചു. ഔഗുസ്ത്യ എന്ന കുറച്ച് അപരിചിതമായ ചരിത്രവിശേഷണം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
