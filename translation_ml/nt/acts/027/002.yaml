id: ACT.27.2
reference: Acts 27:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: ml
  text: അങ്ങനെ, ഏഷ്യയുടെ[a] തീരപ്രദേശങ്ങളിലെ സ്ഥലങ്ങളിലേക്കു[b] പോകാനിരുന്ന അദ്രമുത്ത്യയിൽനിന്നുള്ള ഒരു കപ്പലിൽ കയറി ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു. മക്കദോന്യക്കാരനും തെസ്സലോനിക്കക്കാരനുമായ അരിസ്താർക്കൊസും ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നു പറയുന്നത് ആധുനിക ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറുഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ഏഷ്യയുടെ തീരത്തുള്ള തുറമുഖങ്ങളിലേക്ക്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: കപ്പലിൽ കയറി
  rationale: നാവികസന്ദർഭത്തിൽ കപ്പലിൽ കയറുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാപദരൂപം; മലയാളത്തിൽ സ്വാഭാവികമായി പ്രവർത്തനക്രമവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: അദ്രമുത്ത്യയിൽനിന്നുള്ള ഒരു കപ്പൽ
  rationale: വിശേഷണം കപ്പലിന്റെ സ്വദേശത്തെയോ രജിസ്ട്രേഷൻ തുറമുഖത്തെയോ സൂചിപ്പിക്കുന്നു; അപരിചിതമായ മലയാള വിശേഷണരൂപത്തേക്കാൾ ഈ പ്രയോഗം വ്യക്തമാണ്.
- source_word: μέλλοντι πλεῖν
  choice: പോകാനിരുന്ന
  rationale: കപ്പലിന്റെ ഉദ്ദേശിച്ച അടുത്ത യാത്രയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; കപ്പൽയാത്ര എന്ന സന്ദർഭം വാക്യത്തിൽ വ്യക്തമാണ്.
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: ഏഷ്യയുടെ തീരത്തുള്ള സ്ഥലങ്ങളിലേക്ക്
  rationale: κατάയുടെ ഭൂമിശാസ്ത്രപരമായ അർത്ഥം തീരത്തുടനീളമുള്ള സ്ഥലങ്ങളെ സൂചിപ്പിക്കുന്നു; 'തുറമുഖങ്ങൾ' എന്ന് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ പൊതുവായ τόπους നിലനിർത്തുന്നു.
- source_word: Ἀσίαν
  choice: ഏഷ്യ
  rationale: പരിചിതമായ സ്ഥലനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ പുരാതന റോമൻ പ്രവിശ്യാ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνήχθημεν
  choice: ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു
  rationale: തുറമുഖത്തുനിന്ന് കപ്പലിൽ പുറപ്പെടുക എന്ന സ്ഥിരമായ നാവികാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὄντος σὺν ἡμῖν
  choice: ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: അനുബന്ധ സാഹചര്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായ സ്വതന്ത്ര വാക്യമായി നൽകുന്നു.
- source_word: Ἀριστάρχου
  choice: അരിസ്തർഹൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: Μακεδόνος
  choice: മക്കദോന്യൻ
  rationale: അരിസ്തർഹൊസിന്റെ പ്രദേശിക തിരിച്ചറിയൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Θεσσαλονικέως
  choice: തെസ്സലോനിക്കക്കാരനായ
  rationale: അദ്ദേഹത്തിന്റെ നഗരബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ചരിത്രസ്ഥലനാമങ്ങൾ ഗ്രീക്ക് രൂപത്തോട് ചേർന്ന് ലിപ്യന്തരിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത ‘തുറമുഖങ്ങൾ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിലല്ല, അടിക്കുറിപ്പിലാണ് നൽകിയിരിക്കുന്നത്.
