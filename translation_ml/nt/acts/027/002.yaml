- from: അങ്ങനെ, ഏഷ്യയുടെ[a] തീരത്തുള്ള സ്ഥലങ്ങളിലേക്കു[b] പോകാനിരുന്ന അദ്രമുത്ത്യയിൽനിന്നുള്ള ഒരു കപ്പലിൽ കയറി ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു. തെസ്സലോനിക്കക്കാരനായ മക്കദോന്യൻ അരിസ്തർഹൊസും ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നു.
  to: അങ്ങനെ, ഏഷ്യയുടെ[a] തീരപ്രദേശങ്ങളിലെ സ്ഥലങ്ങളിലേക്കു[b] പോകാനിരുന്ന അദ്രമുത്ത്യയിൽനിന്നുള്ള ഒരു കപ്പലിൽ കയറി ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു. മക്കദോന്യക്കാരനും തെസ്സലോനിക്കക്കാരനുമായ അരിസ്താർക്കൊസും ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നു.
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം ശരിയായി ലിപ്യന്തരിച്ചു. കൂടാതെ, യാത്രാസന്ദർഭം സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രസൂചന നിലനിർത്തിക്കൊണ്ട് τόπους (‘സ്ഥലങ്ങൾ’) എന്ന പദത്തിന്റെ പൊതുവായ അർഥം സംരക്ഷിക്കാൻ ‘തീരപ്രദേശങ്ങളിലെ സ്ഥലങ്ങൾ’ എന്ന രൂപം സ്വീകരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും അവയുടെ അടിക്കുറിപ്പുകളും നിലനിർത്തിയിട്ടുണ്ട്.
