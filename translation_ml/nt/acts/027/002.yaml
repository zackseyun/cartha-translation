    rationale: κατὰ τὴν Ἀσίαν τόπους നാവികയാത്രയുടെ സാഹചര്യത്തിൽ തീരപ്രദേശങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും τόπους എന്ന പൊതുപദം ‘സ്ഥലങ്ങൾ’ ആണ്. ‘തീരപ്രദേശങ്ങളിലെ സ്ഥലങ്ങൾ’ എന്നത് ഈ സൂചന നിലനിർത്തിക്കൊണ്ട് അനാവശ്യമായി ‘തുറമുഖങ്ങൾ’ ആക്കുന്നില്ല.
  revised_text: അങ്ങനെ, ഏഷ്യയുടെ[a] തീരപ്രദേശങ്ങളിലെ സ്ഥലങ്ങളിലേക്കു[b] പോകാനിരുന്ന അദ്രമുത്ത്യയിൽനിന്നുള്ള ഒരു കപ്പലിൽ കയറി ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു. മക്കദോന്യക്കാരനും തെസ്സലോനിക്കക്കാരനുമായ അരിസ്താർക്കൊസും ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നു.
