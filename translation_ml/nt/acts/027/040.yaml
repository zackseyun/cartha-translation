translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. പുരാതന നാവികസാങ്കേതിക പദങ്ങൾ അതിരുകടന്ന് സാങ്കേതികമാക്കാതെ വിവർത്തനം ചെയ്തിരിക്കുന്നു; യഥാർഥമായ പദാർഥാനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടയാളത്തിന്റെ സ്ഥാനവും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കവും തമ്മിലുള്ള പൊരുത്തക്കേട് മൂലം, ഗ്രീക്ക് ζευκτηρίας-നോട് യോജിക്കുന്നവിധം [a] ‘കെട്ടുകയറുകൾ’ എന്നതോടു ചേർത്തിരിക്കുന്നു.
