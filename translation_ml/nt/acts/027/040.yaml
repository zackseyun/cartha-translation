reference: Acts 27:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: ml
  text: അവർ നങ്കൂരങ്ങൾ അഴിച്ചുവിട്ട് കടലിൽ ഉപേക്ഷിച്ചു; അതോടൊപ്പം ചുക്കാനുകളുടെ കെട്ടുകയറുകൾ[a] അഴിച്ച്, മുൻപായ[b] വീശുന്ന കാറ്റിലേക്കു ഉയർത്തി, അവർ കടൽത്തീരത്തേക്കു കപ്പൽ നയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ചുക്കാനുകളുടെ കെട്ടുകൾ” അഥവാ “ബന്ധനങ്ങൾ”; ചുക്കാൻ സംവിധാനത്തെ ഉറപ്പിച്ചിരുന്നതിനെ സൂചിപ്പിക്കുന്ന അപൂർവമായ ഒരു ഗ്രീക്ക് നാവികപദമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “മേൽപ്പായ” അഥവാ “കപ്പലിന്റെ മുൻഭാഗത്തെ പായ”; ഈ ഗ്രീക്ക് നാവികപദം കൃത്യമായി ഏതു പായയെ സൂചിപ്പിക്കുന്നു എന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες
  choice: അഴിച്ചുവിട്ട്
  rationale: നങ്കൂരങ്ങളെ കപ്പലിൽനിന്ന് വേർപെടുത്തി വിട്ടുകളഞ്ഞ കപ്പൽയാത്രാസന്ദർഭത്തിലെ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀγκύρας
  choice: നങ്കൂരങ്ങൾ
  rationale: അക്കൂസറ്റീവ് ബഹുവചനത്തിലുള്ള സാധാരണ നാവികപദത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: കടലിൽത്തന്നെ ഉപേക്ഷിച്ചു
  rationale: നങ്കൂരങ്ങൾ തിരിച്ചെടുക്കാതെ കടലിൽ വിട്ടുകളഞ്ഞുവെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἅμα
  choice: അതോടൊപ്പം
  rationale: തുടർന്നുപറയുന്ന പ്രവർത്തനങ്ങൾ ഒരേ സമയത്താണ് നടന്നതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: ἀνέντες
  choice: അഴിച്ചശേഷം
  rationale: കെട്ടിയിരുന്നത് വിടുവിച്ച പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ മുൻകാല പങ്കാളിക്രിയയുടെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ζευκτηρίας
  choice: കെട്ടുകയറുകൾ
  rationale: ചുക്കാനുകളെ ഉറപ്പിച്ചിരുന്ന ബന്ധനങ്ങളെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; അപൂർവമായ നാവികപദമായതിനാൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῶν πηδαλίων
  choice: ചുക്കാനുകളുടെ
  rationale: പുരാതന കപ്പലിലെ ബഹുവചനത്തിലുള്ള ദിശനിയന്ത്രണ ഉപകരണങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പരിചിതമായ നാവികപദം ഉപയോഗിക്കുന്നു.
- source_word: ἐπάραντες
  choice: ഉയർത്തി
  rationale: പായ ഉയർത്തുന്ന പ്രവർത്തനത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: ἀρτέμωνα
  choice: മുൻപായ
  rationale: കപ്പലിന്റെ മുൻഭാഗത്തെ പായ എന്ന പൊതുവേ അംഗീകരിക്കപ്പെടുന്ന സാധ്യത വായനാസൗകര്യത്തോടെ നൽകുന്നു; കൃത്യമായ നാവികസാങ്കേതിക സൂചന അനിശ്ചിതമായതിനാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: τῇ πνεούσῃ
  choice: കാറ്റുപിടിക്കത്തക്കവിധം
  rationale: പായ വീശുന്ന കാറ്റിലേക്കു ഉയർത്തിയതിന്റെ ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കാറ്റിന്റെ ദിശയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: കടൽത്തീരത്തേക്കു കപ്പൽ നീക്കി
  rationale: കടൽത്തീരം ലക്ഷ്യമാക്കി കപ്പൽ നിയന്ത്രിച്ചു നീക്കിയ നാവികാർഥം വ്യക്തമായി നൽകുന്നു.
