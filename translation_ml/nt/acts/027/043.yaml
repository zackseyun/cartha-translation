translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. റോമൻ ഉദ്യോഗപദവിക്ക് സ്ഥാപിതമായ ‘ശതാധിപൻ’ നിലനിർത്തി; വാക്യഘടന സ്വാഭാവികതയ്ക്കായി രണ്ടായി വിഭജിച്ചു. എല്ലാ അടിക്കുറിപ്പുചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
