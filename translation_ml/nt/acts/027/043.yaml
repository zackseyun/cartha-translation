source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἑκατοντάρχης βουλόμενος διασῶσαι τὸν Παῦλον ἐκώλυσεν αὐτοὺς τοῦ βουλήματος, ἐκέλευσέν τε τοὺς δυναμένους κολυμβᾶν ἀπορίψαντας πρώτους ἐπὶ τὴν γῆν ἐξιέναι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/043.yaml
  text: But the centurion[a], wanting to save Paul, kept them from their plan, and ordered those who were able to swim to jump overboard first and get to land[b],
translation:
  language: ml
  text: എന്നാൽ ശതാധിപൻ പൗലോസിനെ രക്ഷിക്കാൻ ആഗ്രഹിച്ചതുകൊണ്ട് അവരുടെ പദ്ധതി നടപ്പാക്കാൻ അവരെ അനുവദിച്ചില്ല.[a] നീന്താൻ കഴിയുന്നവർ ആദ്യം കപ്പലിൽനിന്ന് ചാടി കരയിലേക്കു ചെല്ലണമെന്ന് അയാൾ ആജ്ഞാപിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ ഉദ്ദേശ്യം നടപ്പാക്കുന്നതിൽനിന്ന് അവരെ തടഞ്ഞു.” ഇവിടെ പറയുന്നത് മുൻവാക്യത്തിൽ പരാമർശിച്ച സൈനികരുടെ ഉദ്ദേശ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “ആദ്യം സ്വയം എറിഞ്ഞ് കരയിലേക്കു പോകാൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ ഈ ഉദ്യോഗപദവിക്ക് മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതവും സംക്ഷിപ്തവുമായ തത്തുല്യപദം.
- source_word: βουλόμενος διασῶσαι τὸν Παῦλον
  choice: പൗലോസിനെ രക്ഷിക്കാൻ ആഗ്രഹിച്ചതുകൊണ്ട്
  rationale: βουλόμενος എന്നത് ശതാധിപന്റെ ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; διασῶσαι ഇവിടെ പൗലോസിന്റെ ജീവൻ സംരക്ഷിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: അവരുടെ പദ്ധതി നടപ്പാക്കാൻ അവരെ അനുവദിച്ചില്ല
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ തടവുകാരെ കൊല്ലാനുള്ള സൈനികരുടെ ഉദ്ദേശ്യം നടപ്പാകുന്നത് ശതാധിപൻ തടഞ്ഞുവെന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκέλευσέν τε
  choice: ആജ്ഞാപിച്ചു
  rationale: κελεύω എന്ന ക്രിയയുടെ അധികാരപൂർവമായ കല്പന എന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: നീന്താൻ കഴിയുന്നവർ
  rationale: കപ്പലിലുള്ളവരിൽ നീന്താൻ കഴിവുള്ള ഒരു വിഭാഗത്തെ ലളിതവും സ്വാഭാവികവുമായി തിരിച്ചറിയിക്കുന്നു.
- source_word: ἀπορίψαντας
  choice: കപ്പലിൽനിന്ന് ചാടി
  rationale: അക്ഷരാർഥത്തിൽ ‘തങ്ങളെത്തന്നെ താഴേക്കെറിഞ്ഞ്’ എന്നാണെങ്കിലും, ഈ സമുദ്രസന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്ന പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: πρώτους
  choice: ആദ്യം
  rationale: നീന്താൻ കഴിയുന്നവർ മറ്റുള്ളവർക്കു മുമ്പായി പോകണമെന്ന ക്രമം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: കരയിലേക്കു ചെല്ലുക
  rationale: വെള്ളത്തിൽനിന്ന് കരയിലേക്കുള്ള ദിശയും ചലനവും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
