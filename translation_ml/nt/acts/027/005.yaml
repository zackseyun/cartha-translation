source:
  edition: SBLGNT
  text: τό τε πέλαγος τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν διαπλεύσαντες κατήλθομεν εἰς Μύρα τῆς Λυκίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/005.yaml
  text: After sailing across the open sea along Cilicia and Pamphylia[b][a], we came down to Myra in Lycia.
translation:
  language: ml
  text: കിലിക്കിയയുടെയും പംഫില്യയുടെയും തീരത്തുകൂടെയുള്ള തുറന്ന കടൽ കടന്നശേഷം[a], ഞങ്ങൾ ലുക്കിയയിലെ മുറായിൽ എത്തി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കിലിക്കിയയുടെയും പംഫില്യയുടെയും തീരത്തിനു പുറത്തുകൂടെയുള്ള തുറന്ന കടൽ കടന്നശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘താഴേക്കു വന്നു’ എന്നാണ്; യാത്രാവിവരണത്തിൽ ഇത് ‘എത്തി’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: തുറന്ന കടൽ
  rationale: പൊതുവായി കടൽ എന്നതിലുപരി കരയിൽനിന്ന് അകലെയുള്ള തുറന്ന കടൽ എന്ന സമുദ്രയാത്രാസൂചന നിലനിർത്തുന്നു.
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: കിലിക്യയ്ക്കും പംഫുല്യയ്ക്കും സമീപമുള്ള
  rationale: κατάയും ദ്വിതീയാവിഭക്തിയും ചേർന്ന ഭൂമിശാസ്ത്രപ്രയോഗം ആ പ്രദേശങ്ങളുടെ തീരത്തോടു ചേർന്നോ തീരത്തിനു പുറത്തുകൂടിയോ ഉള്ള യാത്രാമാർഗം സൂചിപ്പിക്കുന്നു; 'സമീപമുള്ള' ഈ പരിധി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διαπλεύσαντες
  choice: കപ്പലോടിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ കടൽയാത്രയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃതന്തത്തിന്റെ കാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: κατήλθομεν
  choice: ഞങ്ങൾ ഇറങ്ങിച്ചെന്നു
  rationale: κατέρχομαι എന്ന ക്രിയയുടെ 'താഴേക്കു/ഇറങ്ങി ചെല്ലുക' എന്ന ദിശാസൂചന നിലനിർത്തുന്നു; യാത്രാവിവരണത്തിൽ ഇത് സ്ഥലത്തെത്തുക എന്നും ഗ്രഹിക്കാം.
- source_word: Μύρα τῆς Λυκίας
  choice: ലുക്കിയയിലെ മുറാ
  rationale: ഷഷ്ഠീവിഭക്തി മുറാ എന്ന പട്ടണത്തിന്റെ പ്രദേശിക സ്ഥാനം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ '-യിലെ' സ്വാഭാവികമാണ്.
- source_word: τε
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവിവരണവുമായി ലഘുവായി ബന്ധിപ്പിക്കുന്ന ഇതിന്റെ ശക്തി മലയാളവാക്യത്തിന്റെ തുടർച്ചയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
