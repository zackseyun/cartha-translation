- from: കിലിക്യയ്ക്കും പംഫുല്യയ്ക്കും സമീപമുള്ള തുറന്ന കടലിലൂടെ കപ്പലോടിച്ചശേഷം[a], ഞങ്ങൾ ലുക്കിയയിലെ മുറായിലേക്കു ഇറങ്ങിച്ചെന്നു[b].
  to: കിലിക്കിയയുടെയും പംഫില്യയുടെയും തീരത്തുകൂടെയുള്ള തുറന്ന കടൽ കടന്നശേഷം[a], ഞങ്ങൾ ലുക്കിയയിലെ മുറായിൽ എത്തി[b].
