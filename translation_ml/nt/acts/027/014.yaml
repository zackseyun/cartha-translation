  source_fidelity: The principal issue is κατ’ αὐτῆς. With κατά plus genitive in this nautical/narrative setting, the wind is described as rushing down from the island (Crete in the context), not as striking against it. The draft’s “അതിനുനേരെ” follows the English audit trail but does not best represent the Greek construction.
