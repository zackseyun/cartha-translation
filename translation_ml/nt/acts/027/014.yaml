  text: μετ’ οὐ πολὺ δὲ ἔβαλεν κατ’ αὐτῆς ἄνεμος τυφωνικὸς ὁ καλούμενος ⸀Εὐρακύλων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/014.yaml
  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: ml
  text: എന്നാൽ അധികം താമസിയാതെ, ‘യൂറക്വിലോ’ എന്നു വിളിക്കപ്പെടുന്ന ചുഴലിക്കാറ്റുപോലെയുള്ള ഒരു കാറ്റ് അതിൽനിന്ന് ആഞ്ഞുവീശി[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യൂറക്വിലോ’ എന്നതിനുപകരം ‘യൂറോക്ലീഡോൻ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ ‘വടക്കുകിഴക്കുനിന്നുള്ള പ്രചണ്ഡകാറ്റ്’; ഈ പേര് വടക്കുകിഴക്കുനിന്നുള്ള കൊടുങ്കാറ്റിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം. എന്നാൽ ഗ്രീക്ക് പാഠം അതിനെ ഒരു പേരായാണ് അവതരിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: അധികം താമസിയാതെ
  rationale: അല്പസമയത്തിനുശേഷം എന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കഥാഗതിയിൽ പെട്ടെന്നുണ്ടാകുന്ന പ്രതികൂല വഴിത്തിരിവിന്റെ മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἔβαλεν
  choice: ആഞ്ഞടിച്ചു
  rationale: കാറ്റ് ശക്തിയായി വന്നുവീണു എന്ന സന്ദർഭാർഥം സ്വാഭാവികവും ഊർജസ്വലവുമായി നൽകുന്നു; ‘എറിഞ്ഞു’ എന്ന അക്ഷരാർഥം ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: κατ’ αὐτῆς
  choice: അതിനുനേരെ
  rationale: സ്ത്രീലിംഗ സർവനാമത്തിന്റെ കൃത്യമായ പൂർവപദം തുറന്നുവെച്ചുകൊണ്ട്, κατά സൂചിപ്പിക്കുന്ന പ്രതികൂല ദിശ നിലനിർത്തുന്നു.
- source_word: ἄνεμος τυφωνικὸς
  choice: ചുഴലിക്കാറ്റുപോലെയുള്ള ഒരു കാറ്റ്
  rationale: ἄνεμος എന്ന പൊതുപദത്തെയും τυφωνικός സൂചിപ്പിക്കുന്ന ചുഴലിക്കാറ്റുസദൃശമായ പ്രചണ്ഡതയെയും ആധുനിക കാലാവസ്ഥാശാസ്ത്ര വിഭാഗം അനാവശ്യമായി ചുമത്താതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ καλούμενος
  choice: എന്നു വിളിക്കപ്പെടുന്ന
  rationale: ഒരു പേരോ വിശേഷണമോ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു.
- source_word: Εὐρακύλων
  choice: യൂറക്വിലോ
  rationale: SBLGNT-യിലെ നാമരൂപം വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
