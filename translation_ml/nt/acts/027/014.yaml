translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. കാറ്റിന്റെ പ്രചണ്ഡത വ്യക്തമായി നൽകുമ്പോഴും ആധുനിക സാങ്കേതിക കാലാവസ്ഥാപദം നിർബന്ധിച്ച് ചേർത്തിട്ടില്ല. κατ’ αὐτῆς എന്നതിലെ സർവനാമസംബന്ധമായ അവ്യക്തത ‘അതിനുനേരെ’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
