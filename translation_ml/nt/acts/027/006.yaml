id: ACT.27.6
reference: Acts 27:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖ εὑρὼν ὁ ⸀ἑκατοντάρχης πλοῖον Ἀλεξανδρῖνον πλέον εἰς τὴν Ἰταλίαν ἐνεβίβασεν ἡμᾶς εἰς αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: ml
  text: അവിടെ ശതാധിപൻ ഇറ്റലിയിലേക്കു പോകുന്ന ഒരു അലക്സാണ്ട്രിയൻ കപ്പൽ കണ്ടെത്തി ഞങ്ങളെ അതിൽ കയറ്റി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: അവിടെ
  rationale: καί എന്ന ആഖ്യാനബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നതിനാൽ, സ്ഥലസൂചന വ്യക്തമാക്കുന്ന ‘അവിടെ’ ഉപയോഗിച്ചു.
- source_word: εὑρὼν
  choice: കണ്ടെത്തി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന ക്രമാനുസൃത പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ സമനില ക്രിയയായി നൽകി.
- source_word: ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ centurion എന്ന പദവിക്കുള്ള കൃത്യവും മലയാള ബൈബിൾ വായനക്കാർക്കു പരിചിതവുമായ പദം.
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: ഒരു അലക്സാണ്ട്രിയൻ കപ്പൽ
  rationale: വിശേഷണം കപ്പലിന്റെ അലക്സാണ്ട്രിയൻ ബന്ധം—ഉത്ഭവമോ രജിസ്ട്രേഷനോ—വ്യക്തമാക്കുന്നു; അതിനെ കൂടുതൽ നിർണയിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: ഇറ്റലിയിലേക്കു പോകുന്ന
  rationale: വർത്തമാന കൃദന്തവും ലക്ഷ്യസ്ഥാനവും ചേർന്ന് കപ്പലിന്റെ യാത്രാദിശയെയോ ഉദ്ദേശിച്ച ലക്ഷ്യസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പോകുന്ന’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: ഞങ്ങളെ അതിൽ കയറ്റി
  rationale: മറ്റൊരാളെ കപ്പലിൽ കയറ്റുക എന്ന causative അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
