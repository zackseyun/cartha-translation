translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സംഭവക്രമവും കപ്പലിന്റെ ലക്ഷ്യസ്ഥാനവും വ്യക്തമായി നിലനിർത്തി; അനാവശ്യ സാങ്കേതിക നാവികപദങ്ങൾ ഒഴിവാക്കി.
