reference: Acts 27:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: ml
  text: അനേകം ദിവസങ്ങളായി ഞങ്ങൾ മെല്ലെ കപ്പലോടിച്ച്, ഏറെ പ്രയാസപ്പെട്ട് ക്നീദൊസിന് എതിർവശത്ത് എത്തി. കാറ്റ് ഞങ്ങളെ മുന്നോട്ടുപോകാൻ അനുവദിക്കാതിരുന്നതിനാൽ, സൽമോനെയുടെ സമീപത്തുകൂടി ക്രേത്തയുടെ കാറ്റിൽനിന്ന് അഭയം ലഭിക്കുന്ന വശം ചേർന്ന് ഞങ്ങൾ കപ്പലോടിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ക്രേത്തയുടെ കീഴിലൂടെ ഞങ്ങൾ കപ്പലോടിച്ചു”; അതായത്, ദ്വീപ് കാറ്റിൽനിന്ന് മറ നൽകുന്ന വശത്തുകൂടി.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: അനേകം ദിവസങ്ങൾ
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: βραδυπλοοῦντες
  choice: മെല്ലെ കപ്പലോടിച്ച്
  rationale: കപ്പലിന്റെ മന്ദഗതിയിലുള്ള സഞ്ചാരം എന്ന സമുദ്രയാത്രാ ദൃശ്യം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള μόλις-നോട് ഇത് കലർത്തുന്നില്ല.
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: ഏറെ പ്രയാസപ്പെട്ട് ക്നീദൊസിന് എതിർവശത്ത് എത്തി
  rationale: μόλις സൂചിപ്പിക്കുന്ന പ്രയാസവും κατά സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ എതിർ/സമീപ സ്ഥാനവും സംരക്ഷിക്കുന്നു.
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: കാറ്റ് ഞങ്ങളെ മുന്നോട്ടുപോകാൻ അനുവദിക്കാത്തതിനാൽ
  rationale: ഗതിമാറ്റത്തിന്റെ കാരണം പറയുന്ന genitive absolute സ്വാഭാവികമായ കാരണവാക്യമായി നൽകുന്നു; προσεάωയിലെ മുന്നോട്ടോ സമീപത്തേക്കോ പോകാൻ അനുവദിക്കാത്ത അർഥം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: ക്രേത്തയുടെ മറുകാറ്റേൽക്കാത്ത വശം ചേർന്ന് ഞങ്ങൾ കപ്പലോടിച്ചു
  rationale: ദ്വീപിന്റെ കാറ്റിൽനിന്ന് അഭയം ലഭിക്കുന്ന leeward വശത്തുകൂടിയുള്ള യാത്രയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: κατὰ Σαλμώνην
  choice: സൽമോനെയുടെ സമീപത്തുകൂടി
  rationale: തീരദേശ അടയാളസ്ഥാനത്തിന് അരികിലൂടെയുള്ള കപ്പൽപ്പാതയെ സൂചിപ്പിക്കുന്നു; 'കടന്ന്' എന്ന് നിർബന്ധിച്ച് മൂലത്തിലെ സ്ഥാനബന്ധം അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: ക്നീദൊസ് / ക്രേത്ത / സൽമോനെ
  rationale: ഗ്രീക്ക് സ്ഥലനാമങ്ങൾ മലയാളലിപിയിൽ മൂലോച്ചാരണത്തോട് അടുത്തായി ലിപ്യന്തരം ചെയ്യുന്നു.
