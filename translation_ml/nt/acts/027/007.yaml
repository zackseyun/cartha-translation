translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ വിവരണശൈലി. കപ്പൽയാത്രയുടെ സാങ്കേതിക ആശയം അപരിചിതമായ ഇംഗ്ലീഷ് നാവികപദം കടമെടുക്കാതെ മലയാളത്തിൽ വിശദമാക്കി. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
