  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: ml
  text: അവിടെനിന്ന് കടലിലേക്കു പുറപ്പെട്ടശേഷം, കാറ്റുകൾ പ്രതികൂലമായിരുന്നതിനാൽ ഞങ്ങൾ സൈപ്രസിന്റെ കാറ്റുമറയുള്ള വശത്തുകൂടി[a] സഞ്ചരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൈപ്രസിന്റെ കാറ്റിൽനിന്നു സംരക്ഷിതമായ വശത്തുകൂടി.’ ഗ്രീക്കിലെ നാവികപദം ഒരു ദ്വീപിന്റെ കാറ്റുമറയുള്ള വശത്തുകൂടി സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
