- source_word: ὑπεπλεύσαμεν
  choice: കാറ്റുമറയുള്ള വശത്തുകൂടി കപ്പലോടിച്ചു
  rationale: ὑποπλέω ഇവിടെ ഒരു ദ്വീപിന്റെ കാറ്റിൽനിന്നു സംരക്ഷിതമായ, അതായത് lee side-ലൂടെ സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന നാവികപദമാണ്; സാധാരണ വായനക്കാർക്കും അർഥമാകുന്ന വിധത്തിൽ കൃത്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὴν Κύπρον
  choice: സൈപ്രസ് ദ്വീപ്
  rationale: Κύπρος എന്ന സ്ഥലനാമത്തിന്റെ നിലവിലെ മലയാളരൂപം ‘സൈപ്രസ്’ ആണ്; ഭൂമിശാസ്ത്രപരമായ സൂചന വ്യക്തമാക്കാൻ ‘ദ്വീപ്’ ചേർത്തിരിക്കുന്നു.
- source_word: διὰ τὸ ... εἶναι
  choice: ആയിരുന്നതിനാൽ
  rationale: διά ചേർന്ന articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാരണബന്ധം നൽകുന്നു.
- source_word: τοὺς ἀνέμους
  choice: കാറ്റുകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനത്തെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐναντίους
  choice: പ്രതികൂലമായിരുന്നു
  rationale: കാറ്റുകൾ യാത്രയുടെ ദിശയ്ക്ക് എതിരായിരുന്നുവെന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കർമം ചേർക്കുന്നില്ല.
