lexical_decisions:
- source_word: κἀκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: καί ചേർന്ന ἐκεῖθεν എന്ന പദത്തിന്റെ കഥാഗതിക്ക് യോജിച്ച സ്വാഭാവിക മലയാളരൂപം; വാക്യബന്ധം മലയാളത്തിലെ ഘടനയിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἀναχθέντες
  choice: കടലിലേക്കു പുറപ്പെട്ടശേഷം
