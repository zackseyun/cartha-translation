translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന dignified narrative register. ‘കപ്പലിനെ ലഘൂകരിച്ചു’ എന്ന അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ രൂപത്തിനു പകരം ‘കപ്പലിന്റെ ഭാരം കുറയ്ക്കുക’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
