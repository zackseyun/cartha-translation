id: ACT.27.38
reference: Acts 27:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κορεσθέντες ⸀δὲ τροφῆς ἐκούφιζον τὸ πλοῖον ἐκβαλλόμενοι τὸν σῖτον εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/038.yaml
  text: And when they had eaten enough[c][b][a], they began to lighten the ship by throwing the wheat into the sea.
translation:
  language: ml
  text: അവർ മതിയാകുവോളം ഭക്ഷണം കഴിച്ചശേഷം[a], ഗോതമ്പ്[c] കടലിലേക്കു വലിച്ചെറിഞ്ഞ് കപ്പലിന്റെ ഭാരം കുറയ്ക്കാൻ തുടങ്ങി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണം കഴിച്ച് തൃപ്തരായശേഷം” അല്ലെങ്കിൽ “ഭക്ഷണംകൊണ്ട് നിറഞ്ഞശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കപ്പലിന്റെ ഭാരം കുറച്ചുകൊണ്ടിരുന്നു” അല്ലെങ്കിൽ ലളിതമായി “കപ്പലിന്റെ ഭാരം കുറച്ചു”; ഗ്രീക്കിലെ അപൂർണഭൂതകാലം പ്രവൃത്തി നടന്നുകൊണ്ടിരുന്നതിനെയോ അതിന്റെ ആരംഭത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ധാന്യം.” ഗ്രീക്ക് പദത്തിന് വിശാലമായ അർഥമുണ്ടെങ്കിലും ഇവിടെ പ്രത്യേകിച്ച് ഗോതമ്പിനെയാണ് സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κορεσθέντες … τροφῆς
  choice: മതിയാകുവോളം ഭക്ഷണം കഴിച്ചശേഷം
  rationale: ഭക്ഷണംകൊണ്ട് നിറയുക/തൃപ്തരാകുക എന്ന അർഥവും വാക്യത്തിലെ കാലസംബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമത്തിൽ പ്രത്യേകം ‘അപ്പോൾ’ ചേർക്കാതെ തന്നെ ബന്ധം സ്വാഭാവികമാണ്.
- source_word: ἐκούφιζον τὸ πλοῖον
  choice: കപ്പലിന്റെ ഭാരം കുറയ്ക്കാൻ തുടങ്ങി
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ പുരോഗമനപരമോ ആരംഭസൂചകമോ ആയ ഭാവം ഇവിടെ സ്വാഭാവികമായി അറിയിക്കുകയും കപ്പൽ ലഘൂകരിക്കുക എന്ന ആശയം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐκβαλλόμενοι
  choice: വലിച്ചെറിഞ്ഞ്
  rationale: കപ്പലിന്റെ ഭാരം എങ്ങനെ കുറച്ചുവെന്ന് വ്യക്തമാക്കുന്ന മാർഗസൂചക കൃതന്തത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τὸν σῖτον
  choice: ഗോതമ്പ്
  rationale: σῖτος എന്നതിന് ധാന്യം എന്ന വിശാലാർഥം ഉണ്ടെങ്കിലും ഈ ചരക്കുകപ്പൽസന്ദർഭത്തിൽ ഗോതമ്പ് എന്ന നിർദിഷ്ടാർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
- source_word: εἰς τὴν θάλασσαν
  choice: കടലിലേക്കു
  rationale: ദിശ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
