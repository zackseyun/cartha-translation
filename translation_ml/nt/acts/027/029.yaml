source:
  edition: SBLGNT
  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: ml
  text: പാറക്കെട്ടുകളുള്ള ഇടങ്ങളിൽ ചെന്നു തട്ടുമോ എന്നു ഭയന്ന്, അവർ കപ്പലിന്റെ പിൻഭാഗത്തുനിന്ന് നാല് നങ്കൂരങ്ങൾ എറിഞ്ഞിട്ട് നേരം പുലരാൻ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നേരം പുലരാൻ ആഗ്രഹിച്ചുകൊണ്ടിരുന്നു.” ഗ്രീക്കുപദത്തിന് ‘പ്രാർഥിക്കുക’ എന്നും ‘ആഗ്രഹിക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί τε μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: പാറക്കെട്ടുകളുള്ള സ്ഥലങ്ങളിലേക്ക് കപ്പൽ ചെന്നിടിക്കുമോ എന്നു ഭയന്ന്
  rationale: ഭയത്തെ തുടർന്നുള്ള പ്രവർത്തനങ്ങളുടെ കാരണമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കൃതന്തഘടന നിലനിർത്തുന്നു. സമുദ്രയാത്രാസന്ദർഭത്തിലെ ἐκπίπτω കപ്പൽ അപകടകരമായ കരയിലോ പാറപ്രദേശത്തോ ചെന്നിടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; τραχεῖς τόπους എന്നതിനെ അതിരുകടന്ന് നിർവചിക്കാതെ ‘പാറക്കെട്ടുകളുള്ള സ്ഥലങ്ങൾ’ എന്നു സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: ἐκ πρύμνης
  choice: കപ്പലിന്റെ അമരത്തുനിന്ന്
  rationale: πρύμνα കപ്പലിന്റെ പിൻഭാഗമായ stern-നെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ കൃത്യമായ നാവികപദമായ ‘അമരം’ ഉപയോഗിക്കുകയും വ്യക്തതയ്ക്കായി ‘കപ്പലിന്റെ’ ചേർക്കുകയും ചെയ്തു.
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: നാല് നങ്കൂരങ്ങൾ ഇട്ടശേഷം
  rationale: നാല് നങ്കൂരങ്ങൾ താഴെയിടുന്ന പ്രവൃത്തി മുഖ്യക്രിയയ്ക്കു മുമ്പുണ്ടായെന്ന് aorist participle വ്യക്തമാക്കുന്നു; ‘ഇട്ടശേഷം’ ആ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ηὔχοντο
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: സന്ദർഭത്തിൽ εὔχομαι വെറും ആഗ്രഹത്തേക്കാൾ പ്രാർഥനയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. imperfect രൂപത്തിന്റെ തുടർച്ചയായ ഭാവം ‘കൊണ്ടിരുന്നു’ വഴി നിലനിർത്തുന്നു.
- source_word: ἡμέραν γενέσθαι
  choice: നേരം പുലരാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘പകൽ ഉണ്ടാകാൻ’ എന്ന ആശയം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നേരം പുലരാൻ’ എന്നു പറയുന്നു; ഉദ്ദേശ്യം വെളിച്ചം വരുന്നതാണ്.
theological_decisions:
- issue: ηὔχοντο എന്നത് പ്രാർഥനയോ ആഗ്രഹമോ
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  alternative: നേരം പുലരാൻ ആഗ്രഹിച്ചുകൊണ്ടിരുന്നു
  rationale: εὔχομαι-ക്ക് രണ്ടർഥസാധ്യതയുണ്ടെങ്കിലും ഇവിടെ ‘പ്രാർഥിക്കുക’ എന്ന അർഥം നിഘണ്ടുവ്യവഹാരത്തോടും പ്രതിസന്ധിസന്ദർഭത്തോടും യോജിക്കുന്നു. മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. നാവികസന്ദർഭത്തിലെ കൃത്യതയ്ക്കായി ‘അമരം’, ‘നങ്കൂരം’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ കൃതന്തങ്ങളുടെ പ്രവർത്തനക്രമവും imperfect ക്രിയയുടെ തുടർച്ചാഭാവവും വ്യക്തമായി നിലനിർത്തി.
