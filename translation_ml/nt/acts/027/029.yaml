- from: പാറക്കെട്ടുകളുള്ള സ്ഥലങ്ങളിലേക്ക് കപ്പൽ ചെന്നിടിക്കുമോ എന്നു ഭയന്ന് അവർ കപ്പലിന്റെ അമരത്തുനിന്ന് നാല് നങ്കൂരങ്ങൾ ഇട്ടശേഷം, നേരം പുലരാൻ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.[a]
  to: പാറക്കെട്ടുകളുള്ള ഇടങ്ങളിൽ ചെന്നു തട്ടുമോ എന്നു ഭയന്ന്, അവർ കപ്പലിന്റെ പിൻഭാഗത്തുനിന്ന് നാല് നങ്കൂരങ്ങൾ എറിഞ്ഞിട്ട് നേരം പുലരാൻ പ്രാർഥിച്ചുകൊണ്ടിരുന്നു.[a]
