lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: മിലേത്തൊസിൽനിന്ന്
  rationale: ἀπό + genitive പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു. δέ മൃദുവായ വ്യവഹാരബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിലൂടെ സൂചിപ്പിച്ചു.
- source_word: πέμψας εἰς Ἔφεσον
  choice: എഫെസൊസിലേക്ക് ആളയച്ച്
  rationale: പൗലോസ് നേരിട്ട് പോയെന്നല്ല, സന്ദേശമോ ദൂതന്മാരെയോ അയച്ചെന്ന ആശയം അക്ഷരാർഥത്തിലെ അസ്വാഭാവികത ഒഴിവാക്കി വ്യക്തമായി നൽകുന്നു.
- source_word: μετεκαλέσατο
  choice: തന്റെ അടുക്കൽ വിളിപ്പിച്ചു
  rationale: മധ്യപ്രയോഗം അവരെ തന്റെ അടുക്കലേക്കു വരുത്താൻ വിളിച്ചുവരുത്തിയെന്ന ആശയം നൽകുന്നു. ‘വിളിപ്പിച്ചു’ അഭ്യർഥനയെയും വിളിച്ചുവരുത്തലിനെയും സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘തന്റെ അടുക്കൽ’ മധ്യപ്രയോഗത്തിലെ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς πρεσβυτέρους
  choice: മൂപ്പന്മാരെ
  rationale: ഇവിടെ പ്രായം ചെന്ന പുരുഷന്മാരെ പൊതുവായി അല്ല, സഭയിലെ അംഗീകൃത നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മൂപ്പന്മാർ’ പിൽക്കാല സഭാഭരണരീതി ചുമത്താതെ ആ അർഥം നിലനിർത്തുന്നു.
- source_word: τῆς ἐκκλησίας
  choice: സഭയിലെ
  rationale: ἐκκλησία ഇവിടെ ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭയിലെ മൂപ്പന്മാർ’ എന്നത് ആ സമൂഹത്തിൽപ്പെട്ട നേതാക്കൾ എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിൽ πρεσβυτέρους എന്നതിന്റെ അർഥം
  choice: സഭയിലെ നേതാക്കളെ സൂചിപ്പിക്കുന്ന ‘മൂപ്പന്മാർ’
  alternative: സഭയിലെ പ്രായം ചെന്ന പുരുഷന്മാർ; സാങ്കേതിക ലിപ്യന്തരണമായ ‘പ്രെസ്ബിറ്റർമാർ’
  rationale: പ്രവൃത്തികളുടെ വിവരണസന്ദർഭത്തിൽ ഇവർ എഫെസൊസിലെ അംഗീകൃത സഭാനേതാക്കളാണ്. ‘മൂപ്പന്മാർ’ എന്ന പരിഭാഷ മൂലപദത്തിന്റെ ആശയം കാത്തുസൂക്ഷിക്കുകയും പിൽക്കാലത്തെ ഏതെങ്കിലും പ്രത്യേക സഭാഭരണസംവിധാനം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആളയച്ച്’ എന്ന പ്രയോഗം ദൂതനെയോ സന്ദേശവാഹകനെയോ അയച്ച നടപടി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ‘മിലേത്തൊസ്’, ‘എഫെസൊസ്’ എന്നീ രൂപങ്ങളിൽ നൽകി.
