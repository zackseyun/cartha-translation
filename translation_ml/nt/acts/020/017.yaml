  yaml_path: translation/nt/acts/020/017.yaml
  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: ml
  text: മിലേത്തൊസിൽനിന്ന് അദ്ദേഹം എഫെസൊസിലേക്ക് ആളയച്ച് സഭയിലെ മൂപ്പന്മാരെ തന്റെ അടുക്കൽ വിളിപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഭയിലെ മൂപ്പന്മാരെ വരുത്താൻ ആളയച്ചു.” ഗ്രീക്കിൽ ‘എഫെസൊസിലേക്ക് അയച്ചു’ എന്നും ‘തന്റെ അടുക്കൽ വിളിച്ചു’ എന്നും ചേർന്നുവരുന്നു; അവരുടെ സാന്നിധ്യം ആവശ്യപ്പെട്ട് അദ്ദേഹം സന്ദേശമോ ദൂതന്മാരെയോ അയച്ചു എന്നതാണ് ആശയം.
