id: ACT.20.12
reference: Acts 20:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤγαγον δὲ τὸν παῖδα ζῶντα, καὶ παρεκλήθησαν οὐ μετρίως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/012.yaml
  text: And they took the boy away alive[a], and were not a little comforted.
translation:
  language: ml
  text: അവർ ആ ബാലനെ ജീവനോടെ കൂട്ടിക്കൊണ്ടുപോയി; അവർ അത്യന്തം ആശ്വസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥം, ‘മിതമായി അല്ല’; അതായത്, അവർ വളരെ അധികം ആശ്വസിച്ചു.
    reason: οὐ μετρίως എന്ന ഗ്രീക്ക് നിഷേധപ്രയോഗത്തിന്റെ ഊന്നൽ വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പിന്റെ അടയാളം അതു സംബന്ധിക്കുന്ന വാക്കിനോടാണ് ചേർത്തിരിക്കുന്നത്.
lexical_decisions:
- source_word: ἤγαγον
  choice: കൊണ്ടുവന്നു
  rationale: ἄγω എന്ന ക്രിയയ്ക്ക് ‘കൊണ്ടുവരുക/നയിക്കുക’ എന്നർഥമുണ്ട്. ഗ്രീക്ക് വാക്യം ദിശ വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഇംഗ്ലീഷ് consultation layer-ലെ ‘away’ മലയാളത്തിലേക്ക് നിർബന്ധിച്ച് ചേർക്കാതെ ‘കൊണ്ടുവന്നു’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: παῖδα
  choice: ബാലനെ
  rationale: παῖς ഇവിടെ മുമ്പ് ‘യുവാവ്’ എന്നു വിശേഷിപ്പിക്കപ്പെട്ട യൂത്തിക്കൊസിനെയാണ് സൂചിപ്പിക്കുന്നത്. ദാസൻ എന്ന അർഥം പ്രസക്തമല്ല; ‘ബാലൻ’ മൂലപദത്തിന്റെ പ്രായസൂചന നിലനിർത്തുന്നു.
- source_word: ζῶντα
  choice: ജീവനോടെ
  rationale: ഈ വർത്തമാന കൃദന്തം ബാലനെ ഏത് അവസ്ഥയിൽ കൊണ്ടുവന്നു എന്നു സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ജീവനോടെ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: παρεκλήθησαν
  choice: ആശ്വാസം ലഭിച്ചു
  rationale: παρακαλέω എന്നതിന്റെ ആശ്വസിപ്പിക്കുക, ധൈര്യപ്പെടുത്തുക തുടങ്ങിയ അർഥങ്ങളിൽ, മരണമായി തോന്നിയ സംഭവത്തിനു ശേഷമുള്ള സാഹചര്യത്തിൽ ‘ആശ്വാസം ലഭിച്ചു’ യോജിക്കുന്നു.
- source_word: οὐ μετρίως
  choice: അളവറ്റ
  rationale: അക്ഷരാർഥത്തിൽ ‘മിതമായല്ല’ എന്ന നിഷേധപ്രയോഗം അതിയായ അളവിനെ സൂചിപ്പിക്കുന്നു. ‘അളവറ്റ’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ജീവനിലേക്കുള്ള മടക്കത്തിന്റെ സ്വഭാവം
  choice: വാക്യം പറയുന്നതുപോലെ ബാലനെ ‘ജീവനോടെ’ കൊണ്ടുവന്നു എന്നു മാത്രം രേഖപ്പെടുത്തി
  alternative: സംഭവത്തെ വ്യക്തമായി ‘പുനരുത്ഥാനം’ അല്ലെങ്കിൽ ‘ബോധം വീണ്ടെടുക്കൽ’ എന്നു വിശേഷിപ്പിക്കുക
  rationale: ζῶντα ബാലന്റെ ജീവനുള്ള അവസ്ഥ ഉറപ്പാക്കുന്നു; എന്നാൽ ഈ വാക്യം മാത്രം ആ അവസ്ഥ എങ്ങനെ ഉണ്ടായെന്നതിന്റെ ദൈവശാസ്ത്രപരമോ വൈദ്യശാസ്ത്രപരമോ ആയ വർഗീകരണം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ δέ ഇവിടെ മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേകം പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല; καί-ന്റെ ഫലബന്ധം സന്ദർഭാനുസൃതമായി ‘അതുകൊണ്ട്’ എന്നു നൽകി.
