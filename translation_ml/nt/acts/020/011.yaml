id: ACT.20.11
reference: Acts 20:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: ml
  text: പിന്നെ അദ്ദേഹം മുകളിലേക്കു കയറിച്ചെന്ന് അപ്പം നുറുക്കി[a] ഭക്ഷിച്ചു. അതിനുശേഷം പുലരുവോളം ദീർഘനേരം സംസാരിച്ചിട്ട് അദ്ദേഹം അവിടെനിന്നു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പം നുറുക്കി’ എന്ന പ്രയോഗം ഒരുമിച്ചുള്ള സാധാരണ ഭക്ഷണത്തെ സൂചിപ്പിക്കാം; ഇവിടെ കർത്താവിന്റെ അത്താഴവും ഉൾപ്പെടുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναβὰς
  choice: മുകളിലേക്കു കയറിച്ചെന്ന്
  rationale: സന്ദർഭത്തിൽ പൗലോസ് താഴേക്കു പോയശേഷം മുകളിലെ മുറിയിലേക്കു മടങ്ങുന്നതാണ് സൂചിപ്പിക്കുന്നത്. മൂലപദത്തിലെ മേലോട്ടുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κλάσας τὸν ἄρτον
  choice: അപ്പം നുറുക്കി
  rationale: നിശ്ചിത ഉപപദത്തോടുകൂടിയ മൂർത്തമായ പ്രവൃത്തി നിലനിർത്തുന്നു; ഇത് സാധാരണ ഭക്ഷണമാണോ കർത്താവിന്റെ അത്താഴവും ഉൾപ്പെടുന്നുവോ എന്നു പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: γευσάμενος
  choice: ഭക്ഷിച്ചു
  rationale: γεύομαι എന്നതിന് അക്ഷരാർഥത്തിൽ ‘രുചിച്ചു’ എന്നു വരാമെങ്കിലും ഭക്ഷണസന്ദർഭത്തിൽ അത് ആഹാരം കഴിക്കുക എന്ന വിപുലമായ അർഥം വഹിക്കുന്നു. ‘ഭക്ഷിച്ചു’ എന്നത് ചെറിയൊരു രുചിനോക്കൽ മാത്രമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐφ’ ἱκανόν
  choice: ദീർഘനേരം
  rationale: ഗണ്യമായ കാലയളവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: ὁμιλήσας
  choice: സംസാരിച്ചിട്ട്
  rationale: ὁμιλέω ഇവിടെ നീണ്ടുനിന്ന സംസാരത്തെയോ സംഭാഷണത്തെയോ സൂചിപ്പിക്കുന്നു. പ്രസംഗം എന്നു സാങ്കേതികമായി പരിമിതപ്പെടുത്താതെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: ἄχρι αὐγῆς
  choice: പുലരുവോളം
  rationale: αὐγή സൂചിപ്പിക്കുന്ന പുലരി/പ്രഭാതോദയം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: οὕτως ἐξῆλθεν
  choice: അദ്ദേഹം അവിടെനിന്നു പോയി
  rationale: ἐξέρχομαι എന്നതിലെ പുറത്തേക്കുള്ള/അവിടെനിന്നുള്ള പുറപ്പാട് വ്യക്തമാക്കുന്നു. οὕτως മുൻവിവരിച്ച സംഭവക്രമവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ അതിന്റെ ആശയം സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: κλάσας τὸν ἄρτον കർത്താവിന്റെ അത്താഴത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘അപ്പം നുറുക്കി’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അപ്പം നുറുക്കി പങ്കിട്ടു’ എന്ന സാധാരണ കൂട്ടുഭക്ഷണവായന, അല്ലെങ്കിൽ കർത്താവിന്റെ അത്താഴമെന്ന വ്യക്തമായ വ്യാഖ്യാനം.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പ്രയോഗത്തിന് കർത്താവിന്റെ അത്താഴവുമായി ബന്ധമുണ്ടാകാമെങ്കിലും ഈ വാക്യം മാത്രം അതിനെ നിർബന്ധിതമാക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അദ്ദേഹം’ എന്നത് പൗലോസിനെ മാന്യമായി സൂചിപ്പിക്കുന്നു. ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളിൽ അടയാളങ്ങളും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായതിനാൽ, ഗ്രീക്ക് പാഠത്തിലെ യഥാർഥ വ്യാഖ്യാനസന്ദിഗ്ധതയായ κλάσας τὸν ἄρτον എന്ന പ്രയോഗത്തിനുമാത്രം [a] ചേർത്തു; ‘പുലരുവോളം’ എന്നതിന് അടിക്കുറിപ്പ് ആവശ്യമില്ല.
