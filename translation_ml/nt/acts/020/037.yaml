lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: അവരെല്ലാവരും വളരെ കരഞ്ഞു
  rationale: എല്ലാവരും ഗണ്യമായി കരഞ്ഞുവെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; δέ ഇവിടെ മുൻസന്ദർഭത്തോടുള്ള തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ല.
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: പൗലോസിന്റെ കഴുത്തിൽ കെട്ടിപ്പിടിച്ച്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ കഴുത്തിനെക്കുറിച്ചുള്ള വ്യക്തമായ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് സ്നേഹപൂർവമായ ആലിംഗനം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κατεφίλουν αὐτόν
  choice: അദ്ദേഹത്തെ വീണ്ടുംവീണ്ടും ചുംബിച്ചു
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന ആവർത്തിതമോ തുടർച്ചയായതോ ആയ ചുംബനം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
