translation:
  language: ml
  text: അവരെല്ലാവരും വളരെ കരഞ്ഞു; പൗലോസിന്റെ കഴുത്തിൽ വീണു കെട്ടിപ്പിടിച്ച് അദ്ദേഹത്തെ വീണ്ടുംവീണ്ടും ചുംബിച്ചു.
