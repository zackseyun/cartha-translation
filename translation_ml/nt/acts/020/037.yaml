translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ വികാരതീവ്രത, കഴുത്തിൽ കെട്ടിപ്പിടിക്കുന്ന ദൃശ്യഭാവം, ആവർത്തിച്ചുള്ള ചുംബനം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
