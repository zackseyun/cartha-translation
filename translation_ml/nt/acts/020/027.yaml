id: ACT.20.27
reference: Acts 20:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ മുഴുവൻ ആലോചനയും[a] നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നതിൽനിന്ന് ഞാൻ പിന്മാറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ മുഴുവൻ ഉദ്ദേശ്യവും,’ ‘ദൈവത്തിന്റെ മുഴുവൻ പദ്ധതിയും,’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ മുഴുവൻ ഹിതവും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് അടിസ്ഥാനം നൽകുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ വിശദീകരണസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπεστειλάμην
  choice: ഞാൻ പിന്മാറിയില്ല
  rationale: പ്രവർത്തനത്തിൽനിന്ന് പിൻവാങ്ങുകയോ മടിച്ചുനിൽക്കുകയോ ചെയ്യുന്ന രൂപകം നിലനിർത്തുന്നു; അപ്പൊ. 20:20-ലെ സമീപപ്രയോഗത്തോടും യോജിക്കുന്നു.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: പ്രഖ്യാപിക്കുന്നതിൽനിന്ന്
  rationale: ὑποστέλλωയുടെ പൂരകമായ ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ἀναγγέλλωയുടെ അറിയിക്കുക/പ്രഖ്യാപിക്കുക എന്ന ഗൗരവമുള്ള ആശയം നൽകുന്നു.
- source_word: πᾶσαν
  choice: മുഴുവൻ
  rationale: ഏകവചനമായ βουλήν-നോടൊപ്പം സമഗ്രത ഊന്നിപ്പറയുന്നു.
- source_word: βουλήν
  choice: ആലോചന
  rationale: ദൈവത്തിന്റെ ഉദ്ദേശ്യം, പദ്ധതി, ഹിതം എന്നിവ ഉൾക്കൊള്ളാവുന്ന വിശാലത മലയാളത്തിൽ സൂക്ഷിക്കുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ദൈവത്തിൽനിന്നുള്ളതോ ദൈവത്തിന്റേതോ ആയ ആലോചനയെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: പ്രഖ്യാപനത്തിന്റെ നേരിട്ടുള്ള ശ്രോതാക്കളായ എഫെസൊസിലെ മൂപ്പന്മാരെ സൂചിപ്പിക്കുന്ന ഡേറ്റീവ് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: βουλή τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദൈവത്തിന്റെ മുഴുവൻ ആലോചന
  alternative: ദൈവത്തിന്റെ മുഴുവൻ ഉദ്ദേശ്യം / മുഴുവൻ പദ്ധതി / മുഴുവൻ ഹിതം
  rationale: βουλή ദൈവിക ഉദ്ദേശ്യം, പദ്ധതി, ഹിതം എന്നീ ആശയങ്ങൾ വഹിക്കാം. ‘ആലോചന’ ഈ അർഥവ്യാപ്തി തുറന്നുവെക്കുകയും ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ വായന മാത്രം നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പിന്മാറിയില്ല’ മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു; ‘ആലോചന’ എന്നത് βουλήയുടെ യഥാർഥ അർഥവ്യാപ്തി അടച്ചുപൂട്ടാതെ വായനാസൗകര്യം നൽകുന്നു.
