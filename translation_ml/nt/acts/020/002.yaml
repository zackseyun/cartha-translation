id: ACT.20.2
reference: Acts 20:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διελθὼν δὲ τὰ μέρη ἐκεῖνα καὶ παρακαλέσας αὐτοὺς λόγῳ πολλῷ ἦλθεν εἰς τὴν Ἑλλάδα
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/002.yaml
  text: After passing through those regions and encouraging them with many words[a], he came into Greece.
translation:
  language: ml
  text: ആ പ്രദേശങ്ങളിലൂടെ കടന്നുപോയി, അനേകം വാക്കുകളാൽ അവരെ പ്രോത്സാഹിപ്പിച്ചശേഷം[a] അദ്ദേഹം ഗ്രീസിലെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദീർഘമായി അവരോടു സംസാരിച്ച്’ അല്ലെങ്കിൽ ‘വളരെയധികം ഉദ്ബോധിപ്പിച്ച്’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അനേകം വാക്കുകളാൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθὼν
  choice: കടന്നുപോയി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തിന്റെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὰ μέρη ἐκεῖνα
  choice: ആ പ്രദേശങ്ങൾ
  rationale: μέρη എന്നതിന്റെ ഭൂമിശാസ്ത്രപരമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρακαλέσας
  choice: പ്രോത്സാഹിപ്പിച്ചശേഷം
  rationale: παρακαλέω എന്നതിന് പ്രോത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക, ആശ്വസിപ്പിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്; സന്ദർഭത്തിലെ വിശ്വാസികളെ ശക്തിപ്പെടുത്തുന്ന വിശാലമായ അർഥം ‘പ്രോത്സാഹിപ്പിക്കുക’ നിലനിർത്തുന്നു.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: മുമ്പ് പരാമർശിക്കപ്പെട്ട പ്രദേശങ്ങളിലെ വിശ്വാസികളെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: λόγῳ πολλῷ
  choice: അനേകം വാക്കുകളാൽ
  rationale: ‘വളരെയധികം വാക്ക്/സംസാരംകൊണ്ട്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; ദീർഘമായ പ്രസംഗമോ വിപുലമായ ഉദ്ബോധനമോ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἦλθεν εἰς τὴν Ἑλλάδα
  choice: അദ്ദേഹം ഗ്രീസിലെത്തി
  rationale: ഗ്രീസിലേക്കുള്ള സഞ്ചാരത്തിന്റെ പൂർത്തീകരണം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മൃദുവായ സംയോജകത്തിന്റെ ആഖ്യാനപരമായ തുടർച്ച മലയാള വാക്യഘടനയിലും കൃദന്തക്രമത്തിലും ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘അദ്ദേഹം’ എന്ന രൂപം ആഖ്യാനത്തിലെ വ്യക്തിയെ ആദരസൂചകമായി പരാമർശിക്കുന്നു; λόγῳ πολλῷ എന്ന പ്രയോഗത്തിന്റെ അസാധാരണമായ മൂലരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി അതിന്റെ സ്വാഭാവിക അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
