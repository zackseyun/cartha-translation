  source_fidelity: 'The Malayalam accurately represents the two aorist participles as actions preceding the main arrival: Paul went through the specified regions, encouraged the people there, and then arrived in Greece. “ആ പ്രദേശങ്ങളിലൂടെ” faithfully conveys τὰ μέρη ἐκεῖνα, and “ഗ്രീസിലെത്തി” is a natural, source-faithful rendering of ἦλθεν εἰς τὴν Ἑλλάδα.'
