translation:
  language: ml
  text: ആരുടെയും വെള്ളിയോ സ്വർണമോ വസ്ത്രമോ ഞാൻ മോഹിച്ചിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആരുടെയും വെള്ളിയോ സ്വർണമോ വസ്ത്രമോ ഞാൻ ആഗ്രഹിച്ചിട്ടില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  choice: വെള്ളി
  rationale: χρυσίου, ἱματισμοῦ എന്നിവയോടൊപ്പം വിലപിടിപ്പുള്ള വസ്തുക്കളുടെ പട്ടികയിൽ വരുന്നതിനാൽ, പണം എന്ന പൊതുവായ അർഥത്തേക്കാൾ മൂലപദത്തിന്റെ മൂർത്തമായ അർഥമായ ‘വെള്ളി’ നിലനിർത്തുന്നു.
- source_word: χρυσίου
  choice: സ്വർണം
  rationale: വെള്ളി, വസ്ത്രം എന്നിവയോടു ചേർന്നുള്ള വിലപിടിപ്പുള്ള വസ്തുവിനെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: ἱματισμοῦ
  choice: വസ്ത്രം
  rationale: വസ്ത്രങ്ങളെയോ ഉടുപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ആധുനിക സാധാരണ മലയാളത്തിൽ ‘വസ്ത്രം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: οὐδενὸς
  choice: ആരുടെയും
  rationale: തുടർന്നുള്ള വസ്തുക്കൾ ഏതെങ്കിലും വ്യക്തിയുടേതാണെന്ന ഉടമസ്ഥബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπεθύμησα
  choice: മോഹിച്ചിട്ടില്ല
  rationale: സന്ദർഭത്തിൽ മറ്റുള്ളവരുടെ സമ്പത്തിനോടുള്ള തെറ്റായ ആഗ്രഹമാണ് ഉദ്ദേശിക്കുന്നത്. ‘മോഹിക്കുക’ ആ ധാർമിക ഭാവം നൽകുന്നു; അതേസമയം ‘ആഗ്രഹിക്കുക’ എന്ന നിഷ്പക്ഷ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἢ ... ἢ ... ἢ
  choice: -യോ ... -മോ ... -മോ
  rationale: നിഷേധവാക്യത്തിനുള്ളിലെ ആവർത്തിത വികൽപ്പബന്ധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യോ/-മോ’ ഘടനയിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഭൗതികസ്വത്തുകളോടുള്ള ἐπιθυμέω എന്ന ക്രിയയുടെ ധാർമിക ഭാവം
  choice: ‘മോഹിച്ചിട്ടില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആഗ്രഹിച്ചിട്ടില്ല’
  rationale: പൗലോസ് തന്റെ ലാഭലോഭമില്ലായ്മയും സത്യസന്ധതയും വ്യക്തമാക്കുന്ന സന്ദർഭമായതിനാൽ ധാർമികമായി പ്രതികൂലമായ ഭാവം പ്രധാനപാഠത്തിൽ നൽകുന്നു. എങ്കിലും ഗ്രീക്ക് ക്രിയയ്ക്ക് കൂടുതൽ നിഷ്പക്ഷമായ ‘ആഗ്രഹിക്കുക’ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘വെള്ളി—സ്വർണം—വസ്ത്രം’ എന്ന മൂർത്തമായ പട്ടികയും മൂലത്തിലെ ആവർത്തിത വികൽപ്പഘടനയും നിലനിർത്തിയിരിക്കുന്നു.
