id: ACT.20.35
reference: Acts 20:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: ml
  text: 'എല്ലാ കാര്യങ്ങളിലും ഞാൻ നിങ്ങൾക്കു മാതൃക കാണിച്ചുതന്നു: ഇങ്ങനെ അധ്വാനിച്ചുകൊണ്ട് ബലഹീനരെ സഹായിക്കേണ്ടതും[a], ‘സ്വീകരിക്കുന്നതിനെക്കാൾ കൊടുക്കുന്നതാണ് കൂടുതൽ ഭാഗ്യകരം’ എന്ന് കർത്താവായ യേശു തന്നെ പറഞ്ഞ വാക്കുകൾ ഓർക്കേണ്ടതുമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ബലഹീനർക്കു താങ്ങായിരിക്കേണ്ടതും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ക്ഷണികമായ സഹായം മാത്രമല്ല, തുടർച്ചയായി താങ്ങിനിർത്തുക എന്ന ആശയവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: ὑπέδειξα എന്ന ക്രിയയോടു ക്രിയാവിശേഷണപരമായി ചേർന്ന് പൗലൊസിന്റെ സമഗ്രമായ മാതൃകയെ സൂചിപ്പിക്കുന്നു.
- source_word: ὑπέδειξα
  choice: മാതൃക കാണിച്ചുതന്നു
  rationale: വെറും പറഞ്ഞറിയിക്കൽ മാത്രമല്ല, സ്വന്തം പ്രവൃത്തിയിലൂടെ കാണിച്ചുകൊടുക്കൽ എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὕτως κοπιῶντας
  choice: ഇങ്ങനെ അധ്വാനിച്ചുകൊണ്ട്
  rationale: οὕτως എന്ന പിന്നോട്ടുള്ള സൂചനയും κοπιάω-യിലെ കഠിനപ്രയത്നത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: δεῖ
  choice: സഹായിക്കേണ്ടതും … ഓർക്കേണ്ടതുമാണ്
  rationale: ഗ്രീക്കിലെ അനിവാര്യതയോ കടമയോ മലയാളത്തിലെ ‘-േണ്ടതാണ്’ എന്ന ഘടനയിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἀντιλαμβάνεσθαι
  choice: സഹായിക്കുക
  rationale: സഹായത്തിന് എത്തുക, താങ്ങുക എന്നീ അർഥപരിധികൾ ഉൾക്കൊള്ളുന്ന ലളിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τῶν ἀσθενούντων
  choice: ബലഹീനരെ
  rationale: ശാരീരികമോ സാമ്പത്തികമോ സാമൂഹികമോ ആത്മീയമോ ആയ ഒരു പ്രത്യേക ബലഹീനതയായി ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്നു.
- source_word: μνημονεύειν
  choice: ഓർക്കുക
  rationale: ഓർമ്മയിൽ സൂക്ഷിക്കുകയും മനസ്സിൽ കരുതുകയും ചെയ്യുക എന്ന അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശു … പറഞ്ഞ വാക്കുകൾ
  rationale: λόγοι എന്നതിനെ ‘വാക്കുകൾ’ എന്നും κύριος എന്ന പദവിയെ ‘കർത്താവ്’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτὸς εἶπεν
  choice: യേശു തന്നേ പറഞ്ഞ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നേ’ വഴി നിലനിർത്തുന്നു.
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: സ്വീകരിക്കുന്നതിനെക്കാൾ കൊടുക്കുന്നതാണ് കൂടുതൽ അനുഗ്രഹകരം
  rationale: താരതമ്യഘടനയും μακάριον എന്ന അനുഗ്രഹീതാവസ്ഥയുടെ അർഥവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ബലഹീനർ’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ബലഹീനരെ’ എന്ന് വിശാലമായി വിവർത്തനം ചെയ്തു.
  alternative: ദരിദ്രർ / രോഗികൾ / വിശ്വാസത്തിൽ ബലഹീനർ
  rationale: ἀσθενούντων എന്ന പദം സന്ദർഭത്തിൽ ആരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് വ്യക്തമായി പരിമിതപ്പെടുത്തിയിട്ടില്ല; അതിനാൽ ഒരു പ്രത്യേക വിഭാഗമായി ചുരുക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പൗലൊസിന്റെ മാതൃക, അധ്വാനത്തിന്റെ തീവ്രത, കടമയുടെ ഭാവം, യേശുവിന്റെ വാക്കുകളിലെ ഊന്നൽ എന്നിവ നിലനിർത്തി.
