language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: ml
  text: ബെരോയായിൽനിന്നുള്ള പിറോസിന്റെ മകൻ സോപത്രോസും, തെസ്സലോനിക്കയിൽനിന്നുള്ള അരിസ്തർഹോസും സെക്കുന്തോസും, ദെർബെയിൽനിന്നുള്ള ഗായൊസും തിമൊഥെയൊസും, ഏഷ്യയിൽനിന്നുള്ള[a] തിഹിക്കൊസും ത്രൊഫിമൊസും അവനോടൊപ്പം യാത്രചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നു പറയുന്നത് ആധുനിക ഏഷ്യാഭൂഖണ്ഡത്തെയല്ല, റോമൻ പ്രവിശ്യയായ ഏഷ്യയെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: അവനോടൊപ്പം യാത്രചെയ്തു
  rationale: സυνέπομαι എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം ഒരാളോടൊപ്പം സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; പട്ടികയുടെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും അർത്ഥവ്യക്തവുമാണ്.
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: ബെരോയക്കാരനും പിറോസിന്റെ മകനുമായ സോപത്രോസ്
  rationale: Πύρρου പിതൃനാമസൂചകമായ ഷഷ്ഠീവിഭക്തിയായി ‘പിറോസിന്റെ മകൻ’ എന്നും Βεροιαῖος ബെരോയയിൽനിന്നുള്ളവൻ എന്നും എടുത്തിരിക്കുന്നു.
- source_word: Θεσσαλονικέων
  choice: തെസ്സലോനിക്യരിൽനിന്ന്
  rationale: ഷഷ്ഠീ ബഹുവചനം അടുത്ത രണ്ടു പേരെയും തെസ്സലോനിക്യരുടെ കൂട്ടത്തിൽപ്പെട്ടവരായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കൂട്ടസൂചന സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: Ἀρίσταρχος καὶ Σεκοῦνδος
  choice: അരിസ്തർഹോസും സെക്കുന്തോസും
  rationale: വ്യക്തിനാമങ്ങൾ ഗ്രീക്ക് ഉച്ചാരണത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: Γάϊος Δερβαῖος
  choice: ദെർബെക്കാരനായ ഗായൊസ്
  rationale: Δερβαῖος ദെർബെയുമായുള്ള ഭൂമിശാസ്ത്രപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു; ‘ദെർബെക്കാരൻ’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: Τιμόθεος
  choice: തിമൊഥെയൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: Ἀσιανοὶ
  choice: ഏഷ്യയിൽനിന്ന്
  rationale: ഇവിടെ ആധുനിക ഭൂഖണ്ഡമല്ല, റോമൻ പ്രവിശ്യയായ ഏഷ്യയാണ് ഉദ്ദേശിക്കുന്നത്; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: Τυχικὸς καὶ Τρόφιμος
  choice: തിഹിക്കൊസും ത്രൊഫിമൊസും
  rationale: വ്യക്തിനാമങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
- source_word: δέ ... δέ ... δέ
  choice: പട്ടികയിലെ തുടർച്ചയായ കൂട്ടിച്ചേർക്കലുകളായി
  rationale: ആവർത്തിക്കുന്ന δέ പട്ടികയിലെ ഓരോ വിഭാഗത്തെയും ചേർക്കുന്നു; മലയാളത്തിൽ വിഭക്തിസമുച്ചയങ്ങളും അർധവിരാമങ്ങളും ഉപയോഗിച്ച് അതിന്റെ ഘടന സ്വാഭാവികമായി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പേരുകൾ മൂലഗ്രീക്കിനോട് ചേർന്ന് ലിപ്യന്തരണം ചെയ്തു; ഭൂമിശാസ്ത്രപരമായ വിശേഷണങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപത്തിൽ നൽകി.
