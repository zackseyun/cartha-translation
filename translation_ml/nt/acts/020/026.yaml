source:
  edition: SBLGNT
  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: ml
  text: അതുകൊണ്ട്, എല്ലാവരുടെയും രക്തത്തെ സംബന്ധിച്ച് ഞാൻ കുറ്റമില്ലാത്തവനാണെന്ന് ഈ ദിവസം നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്തുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാവരുടെയും രക്തത്തിൽനിന്ന് ഞാൻ ശുദ്ധനാണ്”; മറ്റുള്ളവരെ സംബന്ധിച്ച കുറ്റത്തിൽനിന്നോ ഉത്തരവാദിത്വത്തിൽനിന്നോ സ്വതന്ത്രനായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: രക്തക്കുറ്റത്തെക്കുറിച്ചുള്ള യെഹെസ്കേലിലെ കാവൽക്കാരന്റെ ദൃശ്യഭാഷ ഇവിടെ പ്രതിധ്വനിക്കുന്നുണ്ടാകാം (യെഹെസ്കേൽ 3:18–19; 33:6–9).
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്നുള്ള നിഗമനമാണ് ഇവിടെ അവതരിപ്പിക്കുന്നത്; അതിനാൽ അനുമാനാത്മകമായ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μαρτύρομαι
  choice: സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: ക്രിയയുടെ ഗൗരവമുള്ള വ്യക്തിപരമായ സാക്ഷ്യപ്രഖ്യാപനഭാവം നിലനിർത്തുന്നു; വെറും ‘പറയുന്നു’ എന്നതിനെക്കാൾ ശക്തമാണ്.
- source_word: ὑμῖν
  choice: നിങ്ങളോടു
  rationale: ദത്തിവിന്റെ ലളിതമായ പരോക്ഷ കർമാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘നിങ്ങളുടെ മുമ്പാകെ’ എന്ന നീതിന്യായസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: ഈ ദിവസം
  rationale: മൂലത്തിലെ സെമിറ്റിക് സ്വഭാവമുള്ള ഗൗരവഭാവം ‘ഇന്ന്’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: പൗലൊസ് സാക്ഷ്യപ്പെടുത്തുന്നതിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καθαρός
  choice: കുറ്റമില്ലാത്തവൻ
  rationale: ഇവിടെ ശാരീരിക ശുദ്ധിയല്ല, മറ്റുള്ളവരുടെ രക്തത്തെക്കുറിച്ചുള്ള കുറ്റബാധ്യതയിൽനിന്നുള്ള വിമുക്തിയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἀπὸ τοῦ αἵματος
  choice: രക്തത്തെ സംബന്ധിച്ച്
  rationale: ἀπό എന്ന ബന്ധവും രക്തക്കുറ്റത്തിന്റെ ഭാഷാശൈലിയും ഉൾക്കൊള്ളുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന പ്രയോഗം; അർഥം പൂർണമായി പരാവർത്തനം ചെയ്യാതെ ഇടിയം നിലനിർത്തുന്നു.
- source_word: πάντων
  choice: എല്ലാവരുടെയും
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വിശാലമായ ബഹുവചനാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എല്ലാവരുടെയും രക്തത്തെ സംബന്ധിച്ച് കുറ്റമില്ലാത്തവൻ’ എന്നതിന്റെ അർഥം
  choice: തന്റെ മുന്നറിയിപ്പിന്റെയും പഠിപ്പിക്കലിന്റെയും ഉത്തരവാദിത്വം വിശ്വസ്തമായി നിറവേറ്റിയതിനാൽ മറ്റുള്ളവരുടെ നാശത്തെക്കുറിച്ചുള്ള കുറ്റത്തിൽനിന്നോ ഉത്തരവാദിത്വത്തിൽനിന്നോ സ്വതന്ത്രൻ എന്ന ഇടിയം നിലനിർത്തി.
  alternative: ആരുടെയെങ്കിലും ശാരീരിക മരണത്തിൽ നേരിട്ടുള്ള പങ്കാളിത്തമില്ലെന്ന ചുരുങ്ങിയ അർഥം.
  rationale: അടുത്ത സന്ദർഭം ദൈവത്തിന്റെ ആലോചന മുഴുവൻ അറിയിച്ചതിനെക്കുറിച്ചാണ്; യെഹെസ്കേലിലെ കാവൽക്കാരന്റെ രക്തക്കുറ്റഭാഷയും പശ്ചാത്തലമാകാൻ സാധ്യതയുണ്ട്. പരിഭാഷ ഇടിയത്തെ നിലനിർത്തുകയും അടിക്കുറിപ്പ് അതിന്റെ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ വായനാശൈലി. ‘ഈ ദിവസം’ എന്ന ഔപചാരിക ഘടനയും ‘സാക്ഷ്യപ്പെടുത്തുന്നു’ എന്ന ക്രിയയും വാക്യത്തിന്റെ സാക്ഷ്യപ്രഖ്യാപനഭാവം നിലനിർത്തുന്നു; രക്തക്കുറ്റത്തിന്റെ ബൈബിൾ ഇടിയം അടിക്കുറിപ്പിലൂടെ വിശദീകരിക്കുന്നു.
