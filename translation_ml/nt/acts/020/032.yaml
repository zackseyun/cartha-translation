id: ACT.20.32
reference: Acts 20:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: ml
  text: ഇപ്പോൾ ഞാൻ നിങ്ങളെ ദൈവത്തിനും അവിടുത്തെ കൃപയുടെ വചനത്തിനും ഏൽപ്പിക്കുന്നു. ആ വചനത്തിന്[a] വളർത്തിയുറപ്പിക്കാനും വിശുദ്ധീകരിക്കപ്പെട്ട എല്ലാവരുടെയും ഇടയിൽ അനന്തരാവകാശം നൽകാനും കഴിവുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ദൈവത്തിനാണ് വളർത്തിയുറപ്പിക്കാനും ... അനന്തരാവകാശം നൽകാനും കഴിവുള്ളത്’; ഈ പ്രയോഗം ‘കൃപയുടെ വചനം’ എന്നതിനേക്കാൾ മുഖ്യമായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി എടുക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρατίθεμαι
  choice: ഏൽപ്പിക്കുന്നു
  rationale: ശ്രോതാക്കളെ ദൈവത്തിന്റെ സംരക്ഷണത്തിനും പരിപാലനത്തിനുമായി ഭരമേൽപ്പിക്കുന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിന്
  rationale: παρατίθεμαι എന്ന ക്രിയയോടു ചേർന്ന ദത്തിവ്, ആരുടെ പക്കലാണ് അവരെ ഏൽപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: അവിടുത്തെ കൃപയുടെ വചനത്തിന്
  rationale: λόγος എന്നതിന്റെ വേദപുസ്തകപരമായ ഗൗരവവും ഗ്രീക്കിലെ ഷഷ്ഠീബന്ധവും നിലനിർത്തുന്നു; ഇവിടെ ‘വചനം’ പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെയും സൂചിപ്പിക്കാം.
- source_word: τῷ δυναμένῳ
  choice: ആ വചനത്തിന് ... കഴിവുണ്ട്
  rationale: ഏറ്റവും അടുത്ത മുൻപദമായ ‘കൃപയുടെ വചനം’ എന്നതിനോടാണ് മുഖ്യവാചകം ബന്ധിപ്പിക്കുന്നത്. എന്നാൽ ഇത് ദൈവത്തെ സൂചിപ്പിക്കാനുള്ള യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οἰκοδομῆσαι
  choice: നിങ്ങളെ ആത്മീയമായി വളർത്താനും
  rationale: രൂപകാലങ്കാരമായി ആത്മീയ പണിതുയർത്തലാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ വെറും ‘പണിയാനും’ എന്നത് അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കുന്നതുമായതിനാൽ അർഥം വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന കർമം ‘നിങ്ങളെ’ എന്നും ചേർക്കുന്നു.
- source_word: δοῦναι τὴν κληρονομίαν
  choice: അവകാശം നൽകാനും
  rationale: ‘അവകാശം നൽകുക’ എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: κληρονομίαν
  choice: അവകാശം
  rationale: ദൈവം തന്റെ ജനത്തിന് നൽകുന്ന അന്തിമ പങ്ക് എന്ന വേദപുസ്തകപരമായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: വിശുദ്ധീകരിക്കപ്പെട്ട എല്ലാവരുടെയും ഇടയിൽ
  rationale: ἁγιάζω എന്ന സമ്പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനപരവും നിലനിൽക്കുന്ന ഫലസൂചകവുമായ ഭാവം സംരക്ഷിക്കുകയും ἐν എന്നതിന്റെ സമൂഹപരമായ അർഥം ‘ഇടയിൽ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τῷ δυναμένῳ എന്നതിന്റെ സൂചിതപദം
  choice: മുഖ്യവാചകത്തിൽ ‘കൃപയുടെ വചനം’ എന്നതിനോടു ബന്ധപ്പെടുത്തി ‘ആ വചനത്തിന് ... കഴിവുണ്ട്’ എന്നു നൽകി.
  alternative: ഇത് മുഖ്യമായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി ‘അവിടുത്തേക്ക് ... കഴിവുണ്ട്’ എന്നു വായിക്കാം.
  rationale: കൃദന്തം ദത്തിവ് ഏകവചനമായതിനാൽ ദൈവത്തെയോ ഏറ്റവും അടുത്തുള്ള ‘കൃപയുടെ വചനം’ എന്നതിനെയോ സൂചിപ്പിക്കാം. അടുത്ത മുൻപദത്തെ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചെങ്കിലും യഥാർഥമായ ദൈവശാസ്ത്ര-വ്യാകരണ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അവിടുത്തെ’ എന്ന ആദരസൂചക സർവനാമം ദൈവത്തെ സൂചിപ്പിക്കുന്നു. രൂപകാലങ്കാരമായ ‘പണിതുയർത്തുക’ എന്നതിനു പകരം അർഥവ്യക്തതയ്ക്കായി ‘ആത്മീയമായി വളർത്തുക’ ഉപയോഗിച്ചു.
