source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: ml
  text: അവിടെനിന്ന് കപ്പൽ പുറപ്പെട്ട്, ഞങ്ങൾ പിറ്റേദിവസം ഖിയൊസിന് എതിർവശത്ത് എത്തി[a]. അടുത്ത ദിവസം സാമൊസിൽ കപ്പൽ അടുപ്പിച്ചു[b]; അതിന്റെ പിറ്റേദിവസം മിലേത്തൊസിൽ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഖിയൊസിന് എതിർവശത്ത്” അല്ലെങ്കിൽ “ഖിയൊസിന്റെ നേർക്ക് കടലിൽ.” ഗ്രീക്ക് പ്രയോഗം ദ്വീപിന് എതിർവശത്തുള്ള ഒരു സ്ഥാനം സൂചിപ്പിക്കുന്നു; അവിടെ കരയ്ക്കിറങ്ങിയെന്ന് നിർബന്ധമായും അർഥമില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സാമൊസിൽ കപ്പൽ നിർത്തി” അല്ലെങ്കിൽ “സാമൊസിൽ കപ്പൽ അടുപ്പിച്ചു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ കപ്പൽ കരയോടോ തുറമുഖത്തോടോ ചേർത്തുനിർത്തുന്നതിനെയോ അവിടെ ഇടത്താവളമാക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്ന നാവികപദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: καί + ἐκεῖθεν എന്ന സങ്കുചിതരൂപത്തിലെ പുറപ്പെടൽസ്ഥാനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമത്തിൽ തുടർച്ചയും വ്യക്തമാണ്.
- source_word: ἀποπλεύσαντες
  choice: കപ്പൽ പുറപ്പെട്ട
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle-ന്റെ കാലബന്ധവും നാവികസന്ദർഭവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῇ ἐπιούσῃ
  choice: പിറ്റേദിവസം
  rationale: അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന കാലപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: κατηντήσαμεν
  choice: എത്തി
  rationale: യാത്രാവിവരണത്തിൽ ഒരു സ്ഥാനത്തെത്തുക എന്ന അർഥം നൽകുന്നു.
- source_word: ἄντικρυς Χίου
  choice: ഖിയൊസിന് അഭിമുഖമായി
  rationale: ദ്വീപിന് എതിർവശത്തോ അതിന്റെ നേരെയോ ഉള്ള നാവികസ്ഥാനം സൂചിപ്പിക്കുന്നു; അവിടെ കരയ്ക്കിറങ്ങിയെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τῇ δὲ ἑτέρᾳ
  choice: അടുത്ത ദിവസം
  rationale: ദിവസങ്ങളുടെ തുടർച്ചയിലെ അടുത്ത ഘട്ടം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: παρεβάλομεν εἰς Σάμον
  choice: സാമൊസിൽ കപ്പലടുപ്പിച്ചു
  rationale: παραβάλλω എന്ന നാവികപദത്തിന്റെ കപ്പൽ അടുത്തുകൊണ്ടുവരുക അഥവാ ഇടത്താവളമാക്കുക എന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τῇ δὲ ἐχομένῃ
  choice: അതിന്റെ പിറ്റേദിവസം
  rationale: മുമ്പു പറഞ്ഞ ദിവസത്തിനു തൊട്ടടുത്ത ദിവസം എന്ന ക്രമാനുഗത അർഥം അസന്ദിഗ്ധമായി നൽകുന്നു.
- source_word: ἤλθομεν εἰς Μίλητον
  choice: മിലേത്തൊസിൽ എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്തെത്തിയെന്ന ലളിതമായ യാത്രാവിവരണഭാവം നൽകുന്നു.
- source_word: Χίου / Σάμον / Μίλητον
  choice: ഖിയൊസ് / സാമൊസ് / മിലേത്തൊസ്
  rationale: ഗ്രീക്ക് സ്ഥലനാമങ്ങളുടെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
