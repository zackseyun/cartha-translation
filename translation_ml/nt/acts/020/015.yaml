  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. നാവികസന്ദർഭം വ്യക്തമാക്കാൻ ‘കപ്പൽ പുറപ്പെട്ട’, ‘കപ്പലടുപ്പിച്ചു’ എന്നീ സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു; സ്ഥലനാമങ്ങൾ ഗ്രീക്ക് ശബ്ദരൂപത്തോട് ചേർത്ത് ലിപ്യന്തരിച്ചു.
