  rationale: പരിഷ്കാരം അർഥം മാറ്റുന്നില്ല. παραπλεῦσαι എന്ന കടൽമാർഗം എഫെസൊസിനെ മറികടക്കുക എന്ന ആശയം മലയാളത്തിൽ കൂടുതൽ നേരിട്ടാക്കി; κεκρίκει-യുടെ മുൻകാല, ഉറപ്പിച്ച തീരുമാനഭാവം ‘മുൻകൂട്ടി തീരുമാനിച്ചിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി. മുഖ്യപാഠത്തിലെ സാന്നിധ്യ/എത്തിച്ചേരൽ അവ്യക്തതയും അടിക്കുറിപ്പ് b-യും സംരക്ഷിച്ചിട്ടുണ്ട്.
