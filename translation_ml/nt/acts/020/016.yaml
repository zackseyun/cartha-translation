  source_fidelity: 'പ്രധാന ആശയം കൃത്യമാണ്: പൗലോസ് എഫെസൊസിനെ കടൽമാർഗം കടന്നുപോകാൻ മുൻകൂട്ടി തീരുമാനിച്ചു; ഏഷ്യയിൽ താമസം വരാതിരിക്കാനായിരുന്നു അത്; പെന്തെക്കൊസ്ത് ദിവസം യെരൂശലേമിൽ ഉണ്ടാകാൻ അദ്ദേഹം വേഗപ്പെട്ടു. എന്നാൽ ആദ്യവാക്യത്തിൽ ഗ്രീക്കിലെ ‘എഫെസൊസിനെ കടന്നുപോകുക’ എന്ന ക്രിയയോടും ‘ഏഷ്യയിൽ താമസിക്കുക’ എന്ന ലക്ഷ്യകാരണത്തോടും ഉള്ള ബന്ധം കൂടുതൽ നേരിട്ടും വ്യക്തമായും നൽകേണ്ടതാണ്.'
  naturalness: ‘എഫെസൊസിനെ കടന്ന് കപ്പലിൽ പോകാൻ’ സ്വാഭാവികമെങ്കിലും അല്പം ഭാരമുള്ള ക്രമമാണ്. ‘എഫെസൊസിലൂടെ കപ്പൽ കടന്നുപോകാൻ’ എന്നത് എഫെസൊസ് വഴി കടന്നുപോകുന്നതെന്ന തെറ്റായ ഭാവം നൽകാം; അതിനാൽ ‘എഫെസൊസിനെ കപ്പലിൽ കടന്നുപോകാൻ’ എന്ന രൂപം വ്യക്തമാണ്. ‘തിടുക്കപ്പെടുകയായിരുന്നു’ ശരിയാണ്; യാത്രാസന്ദർഭത്തിൽ ‘വേഗത്തിൽ പോകുകയായിരുന്നു’ എന്നും സ്വാഭാവികമാണ്, എന്നാൽ ‘തിടുക്കപ്പെടുകയായിരുന്നു’ നിലനിർത്താം.
  terminology: ‘ഏഷ്യ,’ ‘എഫെസൊസ്,’ ‘യെരൂശലേം,’ ‘പെന്തെക്കൊസ്ത്’ എന്നിവ അംഗീകരിക്കാവുന്ന ആധുനിക ബൈബിൾപരിചിത രൂപങ്ങളാണ്. അടിക്കുറിപ്പ് a-യിൽ ‘ഏഷ്യാമൈനർ’ എന്നതിനേക്കാൾ ‘ചെറേഷ്യ’/‘Asia Minor’ വ്യാഖ്യാനം ആവശ്യമില്ല; ‘പടിഞ്ഞാറൻ ഏഷ്യാമൈനറിലെ റോമൻ പ്രവിശ്യ’ എന്ന നിലവിലെ വിശദീകരണം മതിയാകുന്നു. എന്നാൽ ‘ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡം’ എന്നതിലെ ദീർഘ ‘ഏഷ്യാ’ ഒഴിവാക്കി ‘ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡം’ എന്ന പ്രയോഗം സാധാരണമാണെങ്കിലും ‘ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡം’ തന്നെയാണ് സ്വീകാര്യമായത്.
