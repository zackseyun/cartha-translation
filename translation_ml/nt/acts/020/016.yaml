id: ACT.20.16
reference: Acts 20:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: ml
  text: പൗലോസ് ഏഷ്യയിൽ സമയം ചെലവഴിക്കേണ്ടിവരാതിരിക്കാൻ എഫെസൊസിനെ കപ്പലിൽ കടന്നുപോകാൻ മുൻകൂട്ടി തീരുമാനിച്ചിരുന്നു[a]. സാധ്യമെങ്കിൽ[b] പെന്തെക്കൊസ്ത് ദിവസം യെരൂശലേമിൽ ഉണ്ടായിരിക്കാൻ അദ്ദേഹം തിടുക്കപ്പെടുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നു പറയുന്നത് ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ്.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പെന്തെക്കൊസ്ത് ദിവസം യെരൂശലേമിൽ എത്തിച്ചേരാൻ.’ ആ ദിവസത്തോടെ അവിടെ ഉണ്ടായിരിക്കുക എന്നതിനോ അന്നുതന്നെ അവിടെ എത്തുക എന്നതിനോ ഗ്രീക്ക് പ്രയോഗം ഊന്നൽ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κεκρίκει
  choice: നേരത്തേ തീരുമാനിച്ചിരുന്നു
  rationale: പൂർവകാലത്തിൽ ഇതിനകം ഉറപ്പിച്ച തീരുമാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അതീതപൂർവകാലത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: എഫെസൊസിനെ കടന്ന് കപ്പലിൽ പോകാൻ
  rationale: എഫെസൊസിൽ നിൽക്കാതെ കടൽമാർഗം അതിനെ കടന്നുപോകുക എന്ന പ്രത്യേക നാവികാർഥം നിലനിർത്തുന്നു.
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: സമയം ചെലവഴിക്കേണ്ടിവരാതിരിക്കാൻ
  rationale: അവിടെ സമയം പോകുന്നതോ താമസം നേരിടുന്നതോ ഒഴിവാക്കുക എന്ന പ്രായോഗിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ഏഷ്യയിൽ
  rationale: മൂലപാഠത്തിലെ സ്ഥലനാമം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് റോമൻ പ്രവിശ്യയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔσπευδεν
  choice: തിടുക്കപ്പെടുകയായിരുന്നു
  rationale: യാത്രാസന്ദർഭത്തിലെ തുടർച്ചയായ വ്യഗ്രതയും വേഗപ്പെടലും ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന് അനുസൃതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: സാധ്യമെങ്കിൽ
  rationale: സാധ്യതയെ സംബന്ധിച്ച നിബന്ധന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: പെന്തെക്കൊസ്ത് ദിവസം
  rationale: പുതിയനിയമകാലത്ത് ഉറച്ച ഉത്സവനാമമായ πεντηκοστήയ്ക്ക് മലയാളത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിൽ ഉണ്ടായിരിക്കാൻ
  rationale: ആ ദിവസത്തോടെ അവിടെ സന്നിഹിതനായിരിക്കുക എന്ന ലക്ഷ്യം നൽകുന്നു; ‘എത്തുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി തിരിച്ചറിയപ്പെടുന്ന സ്ഥലനാമരൂപം.
theological_decisions:
- issue: γενέσθαι εἰς Ἱεροσόλυμα എന്ന പ്രയോഗത്തിന്റെ സമയപരമായ ഊന്നൽ
  choice: പെന്തെക്കൊസ്ത് ദിവസം യെരൂശലേമിൽ ഉണ്ടായിരിക്കാൻ
  alternative: പെന്തെക്കൊസ്ത് ദിവസം യെരൂശലേമിൽ എത്തിച്ചേരാൻ
  rationale: ഗ്രീക്ക് പ്രയോഗം അന്നേ ദിവസം അവിടെ സന്നിഹിതനായിരിക്കുകയോ അന്ന് അവിടെ എത്തുകയോ എന്ന രണ്ടുവശത്തേക്കും ചായാം; മുഖ്യപാഠത്തിൽ സന്നിധിയുടെ ഫലം കൊടുത്ത് മറ്റേ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഗദ്യരീതി. വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ കാരണവാക്യങ്ങളെ രണ്ട് വാക്യങ്ങളാക്കി; മൂലപാഠത്തിലെ കാരണം-ലക്ഷ്യബന്ധവും സമയസൂചനയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
