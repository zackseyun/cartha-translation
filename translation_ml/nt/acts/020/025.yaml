  to: ഇപ്പോൾ, ഇതാ, രാജ്യം പ്രസംഗിച്ചുകൊണ്ട് നിങ്ങളുടെ ഇടയിൽ സഞ്ചരിച്ച ഞാൻ, നിങ്ങളിൽ ഒരാളും ഇനി എന്റെ മുഖം കാണുകയില്ലെന്ന് അറിയുന്നു.
