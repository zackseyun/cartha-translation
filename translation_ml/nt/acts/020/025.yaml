id: ACT.20.25
reference: Acts 20:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: ml
  text: ഇപ്പോൾ, ഇതാ, രാജ്യം പ്രസംഗിച്ചുകൊണ്ട് നിങ്ങളുടെ ഇടയിൽ സഞ്ചരിച്ച ഞാൻ, നിങ്ങളിൽ ഒരാളും ഇനി എന്റെ മുഖം കാണുകയില്ലെന്ന് അറിയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ νῦν ἰδοὺ
  choice: ഇപ്പോൾ ഇതാ
  rationale: വാക്യത്തിന്റെ പുതിയ ഘട്ടത്തിലേക്കുള്ള മാറ്റവും ἰδού നൽകുന്ന ശ്രദ്ധാക്ഷണവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν οἷς διῆλθον
  choice: ഞാൻ സഞ്ചരിച്ച നിങ്ങളുടെ ഇടയിലുള്ള
  rationale: διέρχομαι എന്ന ക്രിയയുടെ വിവിധ ഇടങ്ങളിലൂടെ സഞ്ചരിക്കുക എന്ന ഭാവം സൂക്ഷിക്കുകയും അതിനെ അഭിസംബോധിതരായ ആളുകളുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: κηρύσσων
  choice: പ്രസംഗിച്ചുകൊണ്ട്
  rationale: അധികാരപൂർവം പരസ്യമായി പ്രഖ്യാപിക്കുക എന്ന ക്രിയാഭാവം സഭാപരമായ ഭാരമില്ലാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν βασιλείαν
  choice: രാജ്യം
  rationale: ഗ്രീക്കിൽ വിശേഷണമില്ലാതെ വരുന്ന ‘രാജ്യം’ അതേ സംക്ഷിപ്തതയോടെ നിലനിർത്തുന്നു; വ്യാഖ്യാനമായി ‘ദൈവരാജ്യം’ ചേർക്കുന്നില്ല.
- source_word: οὐκέτι ὄψεσθε τὸ πρόσωπόν μου
  choice: ഇനി എന്റെ മുഖം കാണുകയില്ല
  rationale: ‘എന്റെ മുഖം കാണുക’ എന്ന സേമിറ്റിക് സ്വഭാവമുള്ള പ്രയോഗം മലയാളത്തിലും സ്വാഭാവികവും വ്യക്തിപരമായ വീണ്ടും കണ്ടുമുട്ടലിനെ സൂചിപ്പിക്കുന്നതുമാണ്.
theological_decisions:
- issue: ‘രാജ്യം’ ആരുടേതാണെന്ന വ്യക്തീകരണം
  choice: രാജ്യം
  alternative: ദൈവരാജ്യം
  rationale: ലഭ്യമായ SBLGNT പാഠത്തിൽ τὴν βασιλείαν മാത്രമാണുള്ളത്. സന്ദർഭം ദൈവരാജ്യത്തെ സൂചിപ്പിച്ചാലും വിവർത്തനത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത സംരക്ഷിക്കുന്നു.
- issue: οὐκέτι എന്നതിന്റെ വ്യാപ്തി
  choice: ആരും ഇനി എന്റെ മുഖം കാണുകയില്ല
  alternative: നിങ്ങളിൽ ആരും വീണ്ടും എന്നെ കാണുകയില്ല
  rationale: οὐκέτι എന്നത് തുടർന്നുള്ള കാണലിന്റെ അഭാവം സൂചിപ്പിക്കുന്നു. ‘ഇനി’ അതിനെ നേരിട്ട് നൽകുന്നു; ‘വീണ്ടും’ എന്നതും സാധ്യമെങ്കിലും ‘മുഖം’ എന്ന മൂലപാഠരൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇതാ’ എന്നത് ശ്രദ്ധാക്ഷണം നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമീകരിച്ചിട്ടുണ്ട്.
