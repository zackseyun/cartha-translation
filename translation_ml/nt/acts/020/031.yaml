id: ACT.20.31
reference: Acts 20:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: ml
  text: അതുകൊണ്ട് ജാഗ്രത പാലിക്കുക; മൂന്നു വർഷം രാവും പകലും കണ്ണീരോടെ ഓരോരുത്തരെയും ബുദ്ധിയുപദേശിക്കുന്നത് ഞാൻ നിർത്തിയില്ലെന്ന് ഓർക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോരുത്തർക്കും മുന്നറിയിപ്പ് നൽകിക്കൊണ്ട്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഉപദേശത്തോടൊപ്പം തിരുത്തുന്ന മുന്നറിയിപ്പിനും ഊന്നൽ നൽകാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ മുന്നറിയിപ്പിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γρηγορεῖτε
  choice: ജാഗരൂകരായിരിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ജാഗ്രതാഭാവം ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μνημονεύοντες
  choice: ഓർക്കുക
  rationale: ഗ്രീക്കിൽ കൃദന്തരൂപമാണെങ്കിലും മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ആജ്ഞാരൂപം ഉപയോഗിക്കുന്നു; ജാഗ്രത പാലിക്കുന്നതിനോടൊപ്പമുള്ള ഓർമപ്പെടുത്തൽ എന്ന ബന്ധം നിലനിൽക്കുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: ഓർക്കേണ്ട കാര്യത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക പൂർത്തീകരണചിഹ്നമാണ്.
- source_word: τριετίαν
  choice: മൂന്നു വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ദ്വിതീയാവിഭക്തിയുടെ അർഥം ചുരുക്കവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: νύκτα καὶ ἡμέραν
  choice: രാവും പകലും
  rationale: മൂലപാഠത്തിലെ ക്രമവും നിരന്തരമായ പ്രവർത്തനത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἐπαυσάμην
  choice: ഞാൻ നിർത്തിയില്ല
  rationale: പ്രവർത്തനം തുടർച്ചയായി നടത്തിയെന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ പറയുന്നു.
- source_word: μετὰ δακρύων
  choice: കണ്ണീരോടെ
  rationale: കണ്ണീർ പ്രവർത്തനത്തോടൊപ്പമുണ്ടായിരുന്നുവെന്ന വികാരതീവ്രത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: νουθετῶν
  choice: പ്രബോധിപ്പിക്കുന്നത്
  rationale: νουθετέω എന്നതിലെ ഉപദേശം, തിരുത്തൽ, മുന്നറിയിപ്പ് എന്നീ ഘടകങ്ങളെ ഒരളവുവരെ ഉൾക്കൊള്ളുന്ന ഗൗരവമുള്ള മലയാളപദം; മുന്നറിയിപ്പിന്റെ പ്രത്യേക ഊന്നൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἕνα ἕκαστον
  choice: ഓരോരുത്തരെയും
  rationale: വ്യക്തിവ്യക്തിയായി നൽകിയ ശ്രദ്ധയെ വിതരണാർഥത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നിങ്ങളിൽ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: νουθετῶν എന്ന പദത്തിന്റെ ഇടയപരിപാലനപരവും തിരുത്തൽപരവുമായ ശക്തി
  choice: പ്രബോധിപ്പിക്കുന്നത്
  alternative: ഓരോരുത്തർക്കും മുന്നറിയിപ്പ് നൽകുന്നത്
  rationale: ‘പ്രബോധിപ്പിക്കുക’ ധാർമിക ഉപദേശം, തിരുത്തൽ, ഉണർത്തൽ എന്നിവ ഉൾക്കൊള്ളുന്നു; എന്നാൽ ഗ്രീക്ക് ക്രിയയിലെ മുന്നറിയിപ്പിന്റെ ഊന്നൽ സാധുവായ മറ്റൊരു വായനയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ മുഖ്യ ആജ്ഞയും ഓർമപ്പെടുത്തലും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
