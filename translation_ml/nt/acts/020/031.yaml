  naturalness: ‘ജാഗരൂകരായിരിക്കുക’ വ്യാകരണപരമായി ശരിയാണെങ്കിലും ആധുനിക മാനക മലയാളത്തിൽ ‘ജാഗ്രത പാലിക്കുക’ കൂടുതൽ സ്വാഭാവികവും തുടർച്ചയായ ജാഗ്രതയുടെ ആശയം വ്യക്തവുമാണ്. അർദ്ധവിരാമം ഉപയോഗിച്ച് ആജ്ഞയും അതിന്റെ ഓർമപ്പെടുത്തൽ-അടിസ്ഥാനവും ബന്ധിപ്പിക്കുന്നത് വാക്യപ്രവാഹം മെച്ചപ്പെടുത്തുന്നു.
