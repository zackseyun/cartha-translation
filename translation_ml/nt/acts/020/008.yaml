id: ACT.20.8
reference: Acts 20:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δὲ λαμπάδες ἱκαναὶ ἐν τῷ ὑπερῴῳ οὗ ἦμεν συνηγμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/008.yaml
  text: There were many lamps in the upper room where we were gathered[a].
translation:
  language: ml
  text: ഞങ്ങൾ ഒരുമിച്ചുകൂടിയിരുന്ന മുകളിലത്തെ മുറിയിൽ അനേകം വിളക്കുകൾ ഉണ്ടായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പന്തങ്ങൾ.’ ഗ്രീക്ക് പദത്തിന് പൊതുവേ കൊണ്ടുനടക്കാവുന്ന പ്രകാശോപകരണങ്ങളെയും സൂചിപ്പിക്കാം; എന്നാൽ ഈ മുറിക്കുള്ളിലെ സാഹചര്യത്തിൽ ‘വിളക്കുകൾ’ എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള ശക്തമായ വൈരുധ്യസൂചകം ചേർത്തില്ല.
- source_word: λαμπάδες
  choice: വിളക്കുകൾ
  rationale: λαμπάς എന്നതിന് വിളക്ക് എന്നും പന്തം എന്നും അർഥമാകാം. വീടിന്റെ മുകളിലത്തെ മുറിയെന്ന ഉൾമുറിസന്ദർഭത്തിൽ ‘വിളക്കുകൾ’ ആണ് കൂടുതൽ സാധ്യതയുള്ളതും സ്വാഭാവികവുമായ അർഥം.
- source_word: ἱκαναὶ
  choice: അനേകം
  rationale: ഇവിടെ ἱκανός വിളക്കുകളുടെ ഗണ്യമായ എണ്ണത്തെ സൂചിപ്പിക്കുന്നു; ‘അനേകം’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑπερῴῳ
  choice: മുകളിലത്തെ മുറി
  rationale: ὑπερῷον വീടിന്റെ മുകൾനിലയിലുള്ള മുറിയെ സൂചിപ്പിക്കുന്നു. ‘മുകളിലത്തെ മുറി’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οὗ
  choice: -യിൽ
  rationale: സ്ഥാനസൂചകമായ οὗയുടെ അർഥം മലയാളത്തിൽ ‘മുറിയിൽ’ എന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: συνηγμένοι
  choice: ഒരുമിച്ചുകൂടിയിരുന്ന
  rationale: συνάγωയുടെ perfect passive participle സംഘം നേരത്തേ കൂടിവന്ന് അങ്ങനെ ഒന്നിച്ചുണ്ടായിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഒരുമിച്ചുകൂടിയിരുന്ന’ കൂട്ടായ്മയും നിലനിന്ന അവസ്ഥയും നിലനിർത്തുന്നു.
- source_word: ἦσαν ... ἦμεν
  choice: ഉണ്ടായിരുന്നു ... കൂടിയിരുന്നു
  rationale: ഇരുവരും εἰμίയുടെ imperfect രൂപങ്ങളാണ്. മലയാളത്തിലെ ഭൂതകാലസ്ഥിതിവിവരണം ആഖ്യാനത്തിന്റെ പശ്ചാത്തലസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുകളിലത്തെ മുറി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഒരുമിച്ചുകൂടിയിരുന്ന’ എന്ന രൂപം കൂട്ടായ്മയുടെ അർഥവും തുടർന്നുനിന്ന അവസ്ഥയും സ്വാഭാവികമായി നൽകുന്നു.
