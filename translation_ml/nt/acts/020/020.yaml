    reason: ὑπεστειλάμην എന്നതിന് സന്ദർഭത്തിൽ ‘പിന്മാറുക/ഒഴിഞ്ഞുമാറുക’ എന്നതിനോടൊപ്പം ‘പിടിച്ചുവെക്കുക’ എന്ന ഭാവവും സാധ്യമാണ്; «പ്രയോജനകരമായ» എന്നതിന് ‘ഗുണകരമായ’ ഒരു സ്വാഭാവിക പകരമാണ്.
