id: ACT.20.20
reference: Acts 20:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: ml
  text: നിങ്ങൾക്കു പ്രയോജനകരമായ യാതൊന്നും നിങ്ങളോടു അറിയിക്കുന്നതിൽനിന്നും, പരസ്യമായും വീടുതോറും നിങ്ങളെ പഠിപ്പിക്കുന്നതിൽനിന്നും ഞാൻ പിന്മാറിയില്ലെന്ന്,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങൾക്കു ഗുണകരമായ യാതൊന്നും അറിയിക്കാതിരിക്കുകയോ നിങ്ങളെ പഠിപ്പിക്കാതിരിക്കുകയോ ചെയ്യുന്നതിൽനിന്ന് ഞാൻ ഒഴിഞ്ഞുമാറിയില്ല.’
    reason: ὑπεστειλάμην എന്നതിന് സന്ദർഭത്തിൽ ‘പിന്മാറുക/ഒഴിഞ്ഞുമാറുക’ എന്നതിനോടൊപ്പം ‘പിടിച്ചുവെക്കുക’ എന്ന ഭാവവും സാധ്യമാണ്; «പ്രയോജനകരമായ» എന്നതിന് ‘ഗുണകരമായ’ ഒരു സ്വാഭാവിക പകരമാണ്.
lexical_decisions:
- source_word: ὡς
  choice: എന്നും നിങ്ങൾക്കറിയാം
  rationale: മുൻസന്ദർഭത്തിലെ ഓർമപ്പെടുത്തലിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ὡς-ന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘നിങ്ങൾക്കറിയാം’ എന്നത് മുൻവാക്യത്തിൽനിന്ന് പൂർത്തിയാകുന്ന ആശയമാണ്.
- source_word: οὐδὲν ὑπεστειλάμην
  choice: ഒന്നും ... ഞാൻ പിന്മാറിയില്ല
  rationale: ὑποστέλλω എന്ന മധ്യമപ്രയോഗത്തിലെ ‘ഭയന്നോ മടിച്ചോ പിൻവാങ്ങുക/ഒഴിഞ്ഞുമാറുക’ എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: τῶν συμφερόντων
  choice: നിങ്ങൾക്കു പ്രയോജനകരമായത്
  rationale: സാമ്പത്തിക ലാഭമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, συμφέρω സൂചിപ്പിക്കുന്ന പൊതുവായ ഗുണകരത നിലനിർത്തുന്നു; ആത്മീയമെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: അറിയിക്കുന്നതിൽനിന്ന്
  rationale: നിയന്ത്രകക്രിയയോടു ചേർന്ന നിഷേധാർഥക infinitive-ന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἀναγγεῖλαι
  choice: അറിയിക്കുക
  rationale: ‘അറിയിക്കുക, പ്രഖ്യാപിക്കുക, വെളിപ്പെടുത്തുക’ എന്ന അർഥപരിധിയിൽ സന്ദർഭത്തിന് യോജിച്ച, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പദം.
- source_word: διδάξαι
  choice: പഠിപ്പിക്കുക
  rationale: διδάσκω എന്നതിന്റെ നേരായതും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
- source_word: δημοσίᾳ
  choice: പരസ്യമായി
  rationale: തുറന്ന പൊതുസാഹചര്യങ്ങളിലെ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്ന adverbial dative കൃത്യമായി നൽകുന്നു.
- source_word: κατ’ οἴκους
  choice: വീടുതോറും
  rationale: κατά + ബഹുവചനത്തിന്റെ വിതരണാർഥം നിലനിർത്തുകയും ഓരോ വീടുകളിലായുള്ള പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘പ്രയോജനകരമായത്’ എന്നതിന്റെ വ്യാപ്തി
  choice: പൊതുവായ ‘നിങ്ങൾക്കു പ്രയോജനകരമായത്’
  alternative: ‘നിങ്ങളുടെ ആത്മീയനന്മയ്ക്കു ഉപകരിക്കുന്നതെല്ലാം’
  rationale: സന്ദർഭം ആത്മീയ-ഇടയശുശ്രൂഷാപരമാണെങ്കിലും ഗ്രീക്ക് പദം തന്നിൽ ‘ആത്മീയ’ എന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠം അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: രണ്ട് infinitive-കളുടെ വ്യാകരണബന്ധം
  choice: അറിയിക്കുന്നതിലും പഠിപ്പിക്കുന്നതിലും പൗലോസ് പിന്മാറിയില്ലെന്ന ഏകീകൃത നിർമാണം
  alternative: ആദ്യപ്രവർത്തനത്തോടു മാത്രം ‘പിന്മാറിയില്ല’ ബന്ധിപ്പിക്കൽ
  rationale: ἀναγγεῖλαι, διδάξαι എന്നീ രണ്ടും ὑπεστειλάμην-ന്റെ കീഴിലുള്ള സമാന്തര പ്രവർത്തനങ്ങളായി വായിക്കപ്പെടുന്നു; മലയാളത്തിലെ ആവർത്തിച്ച ‘-തിൽനിന്നോ’ ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ‘വീടുതോറും’ വിതരണാർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ഈ വാക്യം മുൻസന്ദർഭത്തിൽ ആരംഭിച്ച ദീർഘവാക്യത്തിന്റെ ഭാഗമായതിനാൽ ‘എന്നും നിങ്ങൾക്കറിയാം’ ചേർത്ത് മലയാളത്തിൽ ബന്ധം പൂർണമാക്കി.
