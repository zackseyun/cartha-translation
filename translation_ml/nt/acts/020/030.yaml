source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: ml
  text: നിങ്ങളിൽനിന്നുതന്നെ പുരുഷന്മാർ ഉയർന്നുവരും; ശിഷ്യന്മാരെ തങ്ങളുടെ പിന്നാലെ വലിച്ചിഴയ്ക്കുന്നതിനായി അവർ വളച്ചൊടിച്ച കാര്യങ്ങൾ സംസാരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വികൃതമായ കാര്യങ്ങൾ” അല്ലെങ്കിൽ “വികലമായ കാര്യങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: നിങ്ങളുടെ ഇടയിൽനിന്നുതന്നെ
  rationale: ἐξ + genitive, emphatic αὐτῶν എന്നിവ ഭീഷണി സമൂഹത്തിനുള്ളിൽനിന്നുതന്നെ ഉയരുമെന്ന ഊന്നൽ നൽകുന്നു; ‘-തന്നെ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀναστήσονται
  choice: എഴുന്നേറ്റ്
  rationale: ഭാവികാലത്തിലുള്ള ἀνίστημι ഇവിടെ അത്തരം ആളുകൾ ഉയർന്നുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള finite verb-നോടു ചേർത്ത് മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ἀνήρ വ്യക്തമായി പുല്ലിംഗപദമായതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തി.
- source_word: λαλοῦντες
  choice: സംസാരിക്കും
  rationale: അവരുടെ വാക്കുകളിലൂടെയുള്ള പ്രവർത്തനത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: διεστραμμένα
  choice: വളച്ചൊടിച്ച കാര്യങ്ങൾ
  rationale: സത്യത്തിൽനിന്ന് വളച്ചോ വികലമാക്കിയോ ഉള്ള കാര്യങ്ങൾ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ഒരു പ്രത്യേക ദുർമ്മതത്തിലേക്കോ ഉപദേശത്തിലേക്കോ ചുരുക്കുന്നില്ല.
- source_word: τοῦ ἀποσπᾶν
  choice: വലിച്ചുകൊണ്ടുപോകാൻ
  rationale: τοῦ + infinitive ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; ἀποσπάωയിലെ വേർപെടുത്തി വലിച്ചുകൊണ്ടുപോകുന്ന ദൃശ്യബോധം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοὺς μαθητὰς
  choice: ശിഷ്യന്മാരെ
  rationale: പ്രവൃത്തികളിൽ μαθηταί എന്നതിന് സ്ഥിരവും കാനോനികവുമായ മലയാള പദം.
- source_word: ὀπίσω ἑαυτῶν
  choice: തങ്ങളുടെ പിന്നാലെ
  rationale: സ്വന്തം അനുയായികളാക്കുക എന്ന അനുസരണബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
theological_decisions:
- issue: വ്യാജോപദേശകരുടെ വാക്കുകളുടെ സ്വഭാവം
  choice: വളച്ചൊടിച്ച കാര്യങ്ങൾ
  alternative: വികലമായ കാര്യങ്ങൾ / വഴിതെറ്റിക്കുന്ന കാര്യങ്ങൾ
  rationale: വാക്യം നിർദിഷ്ടമായ ഒരു മതവിരുദ്ധ ഉപദേശത്തെ പറയുന്നില്ല; ഉപദേശപരമോ ധാർമികമോ ആയ വ്യതിചലനം ഉൾക്കൊള്ളാവുന്ന വിശാലമായ മുന്നറിയിപ്പ് സംരക്ഷിച്ചു.
- issue: ἄνδρες എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ / വ്യക്തികൾ
  rationale: മൂലപദം വ്യക്തമായി പുല്ലിംഗമായതിനാൽ അതിന്റെ ലിംഗസൂചന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘നിങ്ങളുടെ ഇടയിൽനിന്നുതന്നെ’ എന്നത് ആന്തരിക ഭീഷണിയുടെ ഊന്നൽ നിലനിർത്തുന്നു; ‘തങ്ങളുടെ പിന്നാലെ’ വ്യക്തിപരമായ അനുയായിത്വത്തിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
