    rationale: In this warning context, ἀνίστημι means ‘arise/emerge,’ not merely ‘get up.’ ‘ഉയർന്നുവരും’ communicates the intended emergence and retains the future force.
  - severity: low
    issue: Footnote alternative ‘വഴിതെറ്റിക്കുന്ന കാര്യങ്ങൾ’
    rationale: This wording means ‘misleading things’ and emphasizes effect rather than the source sense of things made crooked/distorted. A closer alternative should be supplied.
