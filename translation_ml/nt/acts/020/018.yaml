translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ ഊന്നൽ ‘നിങ്ങൾക്കുതന്നെ’ എന്നതിലൂടെ സംരക്ഷിച്ചു. ‘കാലുകുത്തി’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ സജീവ ദൃശ്യഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
