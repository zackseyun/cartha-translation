id: ACT.20.9
reference: Acts 20:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: ml
  text: യൂത്തിക്കൊസ് എന്നു പേരുള്ള ഒരു യുവാവ് ജനൽപ്പടിയിൽ ഇരിക്കുകയായിരുന്നു. പൗലോസ് ഏറെനേരം സംസാരിച്ചുകൊണ്ടിരിക്കെ, അവൻ ഗാഢനിദ്രയിലേക്കു വഴുതിക്കൊണ്ടിരുന്നു. ഉറക്കം അവനെ കീഴടക്കിയപ്പോൾ, അവൻ മൂന്നാം നിലയിൽനിന്നു താഴെ വീണു; അവനെ മരിച്ച നിലയിൽ എടുത്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനെ മരിച്ച നിലയിൽ എടുത്തുകൊണ്ടുപോയി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് “എടുത്തു” എന്നും “എടുത്തുകൊണ്ടുപോയി” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന ഇരിപ്പിന്റെ അവസ്ഥ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τις νεανίας
  choice: ഒരു യുവാവ്
  rationale: τις നൽകുന്ന അനിശ്ചിതത്വം ‘ഒരു’ എന്നതിലൂടെ നിലനിർത്തുന്നു; νεανίας എന്നതിന് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ‘യുവാവ്’ ഉപയോഗിക്കുന്നു.
- source_word: ὀνόματι Εὔτυχος
  choice: യൂത്തിക്കൊസ് എന്നു പേരുള്ള
  rationale: പേരിനെ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐπὶ τῆς θυρίδος
  choice: ജനൽപ്പടിയിൽ
  rationale: θυρίς ജനൽത്തുറവിനെ സൂചിപ്പിക്കുന്നു; വീഴ്ചയുടെ പശ്ചാത്തലത്തിൽ അവൻ ജനലിന്റെ അരികിലോ പടിയിലോ ഇരുന്നതിനെ ‘ജനൽപ്പടിയിൽ’ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: ഗാഢനിദ്രയിലേക്കു വഴുതിവീണു
  rationale: ഉറക്കത്തിന്റെ പിടിയിലേക്കുള്ള ക്രമാനുഗതമായ താഴ്ന്നുപോകൽ എന്ന ദൃശ്യബോധം മലയാളത്തിൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: പൗലോസ് ഏറെനേരം സംസാരിച്ചുകൊണ്ടിരിക്കെ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയും ദീർഘമായി തുടർന്ന സംസാരവും വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: ഉറക്കം അവനെ കീഴടക്കിയപ്പോൾ
  rationale: മുൻപത്തെ ക്രമാനുഗത മയക്കത്തിൽനിന്ന് ഉറക്കം നിർണായകമായി അവനെ കീഴടക്കിയ നിമിഷത്തിലേക്കുള്ള മാറ്റം നിലനിർത്തുന്നു.
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: അവൻ മൂന്നാം നിലയിൽനിന്നു താഴെ വീണു
  rationale: τρίστεγον എന്നത് മൂന്നാം നിലയെന്നും κάτω താഴോട്ടുള്ള വീഴ്ചയെന്നും നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἤρθη νεκρός
  choice: അവനെ മരിച്ച നിലയിൽ എടുത്തു
  rationale: αἴρω എന്ന ക്രിയയുടെ ‘എടുക്കുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് νεκρός പറയുന്ന മരണാവസ്ഥയെ മൃദൂകരിക്കാതെ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: νεκρός എന്നത് ‘മരിച്ചവൻ’ എന്നോ ‘മരിച്ചതുപോലെ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മരിച്ച നിലയിൽ
  alternative: മരിച്ചതുപോലെ / മരിച്ചെന്നു തോന്നുന്ന നിലയിൽ
  rationale: ഗ്രീക്കിൽ സംശയമോ പ്രത്യക്ഷതയോ സൂചിപ്പിക്കുന്ന പദമില്ല; അതിനാൽ ലൂക്കോസിന്റെ നേരിട്ടുള്ള പ്രസ്താവന മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἤρθη എന്ന കർമണിപ്രയോഗത്തിന്റെ മലയാളാവിഷ്കാരം
  choice: അവനെ ... എടുത്തു
  alternative: അവനെ എടുത്തുകൊണ്ടുപോയി
  rationale: ക്രിയയ്ക്ക് ‘എടുത്തു’ എന്നും ‘എടുത്തുകൊണ്ടുപോയി’ എന്നും അർഥസാധ്യതയുണ്ട്. സന്ദർഭം നിർബന്ധിക്കാത്ത നീക്കിക്കൊണ്ടുപോകൽ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, വിശാലമായ ‘എടുത്തു’ സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗാഢനിദ്ര’, ‘കീഴടക്കുക’ എന്നിവ ദൃശ്യതയും ഗൗരവവും നിലനിർത്തുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കാൻ വിഭജിച്ചിരിക്കുന്നു.
