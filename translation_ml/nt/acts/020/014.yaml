id: ACT.20.14
reference: Acts 20:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: ml
  text: അസ്സോസിൽവെച്ച് അദ്ദേഹം ഞങ്ങളെ കണ്ടുമുട്ടിയപ്പോൾ[a], ഞങ്ങൾ അദ്ദേഹത്തെ കപ്പലിൽ കയറ്റി മിതുലേനെയിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അസ്സോസിൽവെച്ച് ഞങ്ങളോടു ചേർന്നപ്പോൾ’ അല്ലെങ്കിൽ ‘അസ്സോസിൽവെച്ച് ഞങ്ങളുമായി കൂടിച്ചേർന്നപ്പോൾ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് കണ്ടുമുട്ടുക, കൂടിച്ചേരുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ പൗലോസ് ആ യാത്രാസംഘത്തോടു വീണ്ടും ചേർന്നതാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: കണ്ടുമുട്ടിയപ്പോൾ
  rationale: യാത്രാവിവരണത്തിന്റെ പശ്ചാത്തലത്തിൽ പൗലോസ് അസ്സോസിൽ കപ്പൽയാത്രാസംഘവുമായി വീണ്ടും കൂടിച്ചേർന്ന സംഭവമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘കണ്ടുമുട്ടി’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങളെ
  rationale: കപ്പലിൽ യാത്രചെയ്യുന്ന സംഘത്തെ സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം; മലയാളത്തിലെ ‘കണ്ടുമുട്ടുക’ എന്ന പ്രയോഗത്തിന് യോജിച്ച കർമരൂപം.
- source_word: εἰς τὴν Ἆσσον
  choice: അസ്സോസിൽവെച്ച്
  rationale: εἰς എന്നത് സാധാരണയായി ദിശ സൂചിപ്പിക്കുമെങ്കിലും, കൂടിച്ചേരൽ നടന്ന സ്ഥലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ സ്ഥാനസൂചക രൂപം ഉപയോഗിച്ചു.
- source_word: ἀναλαβόντες
  choice: കപ്പലിൽ കയറ്റി
  rationale: നാവികയാത്രയുടെ സന്ദർഭത്തിൽ പൗലോസിനെ കപ്പലിൽ സ്വീകരിച്ചു കൂടെ കൊണ്ടുപോയതാണു സൂചന. മൂലപാഠത്തിൽ ‘കപ്പൽ’ വ്യക്തമല്ലെങ്കിലും സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ സ്വാഭാവിക മലയാളത്തിനായി വ്യക്തമാക്കി.
- source_word: αὐτόν
  choice: അദ്ദേഹത്തെ
  rationale: മുൻസന്ദർഭത്തിലെ പൗലോസിനെ സൂചിപ്പിക്കുന്നു. മാന്യവും സ്വാഭാവികവുമായ മലയാള സർവനാമം ഉപയോഗിച്ചു.
- source_word: ἤλθομεν
  choice: പോയി
  rationale: വിവരണസംഘം അസ്സോസിൽനിന്ന് മിതുലേനെയിലേക്കു സഞ്ചരിച്ചതിനാൽ മലയാള യാത്രാവിവരണത്തിൽ ‘പോയി’ സ്വാഭാവികമാണ്; ഗ്രീക്ക് ആഓറിസ്റ്റിന്റെ ലളിതമായ സംഭവവിവരണം നിലനിർത്തുന്നു.
- source_word: εἰς Μιτυλήνην
  choice: മിതുലേനെയിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ദിശയെ സ്വാഭാവിക മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു; ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത ലിപ്യന്തരണം സ്വീകരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യാത്രാവിവരണശൈലി. സ്ഥലനാമങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളോട് അടുത്തായി ‘അസ്സോസ്’, ‘മിതുലേനെ’ എന്നു ലിപ്യന്തരിച്ചു. ക്രിയയുടെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
