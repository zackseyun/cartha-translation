id: ACT.20.22
reference: Acts 20:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: ml
  text: ഇപ്പോൾ ഇതാ, ആത്മാവിൽ ബന്ധിതനായി[a] ഞാൻ യെരൂശലേമിലേക്കു പോകുന്നു. അവിടെ എനിക്ക് എന്തെല്ലാം സംഭവിക്കുമെന്ന് എനിക്കറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സ്വന്തം ആത്മാവിൽ ബന്ധിതനായി.” ഗ്രീക്ക് പ്രയോഗം പൗലോസിന്റെ സ്വന്തം ആത്മാവിനെയോ പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കാം. “ആത്മാവിനാൽ നിർബന്ധിതനായി” എന്നും ഇതിനെ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പ്രസംഗത്തിലെ ഊന്നലോടെയുള്ള മാറ്റവും ഗൗരവവും നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ സൂചനാപദം.
- source_word: δεδεμένος
  choice: ബന്ധിതനായി
  rationale: ‘ബന്ധിക്കപ്പെട്ടവൻ’ എന്ന പൂർണകൃത്യ പങ്കാളിപദത്തിന്റെ രൂപകശക്തി നിലനിർത്തുന്നു; ആന്തരിക നിർബന്ധമോ ആത്മാവിന്റെ നടത്തിപ്പോ എന്ന് മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: τῷ πνεύματι
  choice: ആത്മാവിൽ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെ സാധ്യതയേറിയ സൂചനയാക്കുന്നു. അതേസമയം, ദാതൃവിഭക്തിയിലുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അവ്യക്തത ‘ആത്മാവിൽ’ എന്ന അടുത്ത വിവർത്തനം നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- source_word: πορεύομαι
  choice: ഞാൻ ... പോകുന്നു
  rationale: നടന്നുകൊണ്ടിരിക്കുന്നതോ ഉടൻ സംഭവിക്കുന്നതോ ആയ യാത്രയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: അവിടെ എനിക്ക് എന്തെല്ലാം സംഭവിക്കുമെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവിടെ എന്നെ നേരിടാനിരിക്കുന്ന കാര്യങ്ങൾ’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ബഹുവചനത്തിന്റെ ഭാവം ‘എന്തെല്ലാം’ നിലനിർത്തുന്നു.
- source_word: μὴ εἰδώς
  choice: എനിക്കറിയില്ല
  rationale: പൗലോസിന്റെ അറിവില്ലായ്മ വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു; മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിനായി സ്വതന്ത്ര വാക്യരൂപം ഉപയോഗിച്ചു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ സ്ഥലനാമരൂപം.
theological_decisions:
- issue: τῷ πνεύματι എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവ് സാധ്യതയേറിയ സൂചനയായി ‘ആത്മാവിൽ’
  alternative: പൗലോസിന്റെ സ്വന്തം ആത്മാവ്; അല്ലെങ്കിൽ ‘ആത്മാവിനാൽ നിർബന്ധിതനായി’ എന്ന കർത്തൃകാരണ അർഥം
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ πνεῦμα പലപ്പോഴും പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള വാക്യങ്ങളും അതിനെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് ദാതൃപ്രയോഗം ഒറ്റ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം അടുത്ത രൂപം സ്വീകരിക്കുകയും യഥാർഥ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘ഇതാ’ എന്ന പദം മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. നീണ്ട പങ്കാളിപദഘടന ഒഴിവാക്കി അവസാന ആശയം രണ്ടാമത്തെ വാക്യമായി നൽകിയത് വായനാസൗകര്യത്തിനാണ്.
