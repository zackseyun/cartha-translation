translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണശൈലി. മൂലത്തിലെ ‘ഞങ്ങൾ’ എന്ന ഒന്നാംപുരുഷ ബഹുവചനവും സംഭവക്രമവും നിലനിർത്തി.
