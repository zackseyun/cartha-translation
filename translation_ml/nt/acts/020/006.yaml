id: ACT.20.6
reference: Acts 20:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: ml
  text: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങൾ കഴിഞ്ഞശേഷം ഞങ്ങൾ ഫിലിപ്പിയിൽനിന്ന് കപ്പൽ കയറി പുറപ്പെട്ടു. അഞ്ചു ദിവസംകൊണ്ട് ത്രോവാസിൽ അവരുടെ അടുക്കൽ എത്തി; അവിടെ ഏഴു ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: കപ്പൽ കയറി പുറപ്പെട്ടു
  rationale: ἐκπλέω കപ്പലിലുള്ള പുറപ്പാടിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അതു വ്യക്തമാക്കുന്ന പ്രയോഗമാണിത്.
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങൾ കഴിഞ്ഞശേഷം
  rationale: മൂലത്തിലെ ‘പുളിപ്പില്ലാത്തവയുടെ ദിവസങ്ങൾ’ എന്ന ഉത്സവകാലസൂചന നിലനിർത്തുന്നു; ‘പെരുന്നാൾ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർക്കുന്നില്ല.
- source_word: ἀπὸ Φιλίππων
  choice: ഫിലിപ്പിയിൽനിന്ന്
  rationale: പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ἀπόയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: അവരുടെ അടുക്കൽ എത്തി
  rationale: πρός വ്യക്തികളിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു. ‘അവരോടു ചേർന്നു’ എന്ന സന്ദർഭസൂചന അധികമായി ചേർക്കാതെ അർഥം നൽകുന്നു.
- source_word: εἰς τὴν Τρῳάδα
  choice: ത്രോവാസിൽ
  rationale: ‘അവരുടെ അടുക്കൽ എത്തി’ എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യസ്ഥലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄχρι ἡμερῶν πέντε
  choice: അഞ്ചു ദിവസംകൊണ്ട്
  rationale: യാത്ര ആരംഭിച്ചതുമുതൽ എത്തിച്ചേരുന്നതുവരെയുള്ള അഞ്ചുദിവസത്തെ കാലദൈർഘ്യം വ്യക്തമാക്കുന്നു; ‘അഞ്ചു ദിവസത്തിനുള്ളിൽ’ എന്നത് അഞ്ചാം ദിവസത്തിനു മുമ്പാകാമെന്ന അനാവശ്യ അർഥം നൽകാം.
- source_word: οὗ
  choice: അവിടെ
  rationale: ത്രോവാസിലേക്കു തിരിച്ചുസൂചിപ്പിക്കുന്ന സ്ഥലക്രിയാവിശേഷണത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: ഏഴു ദിവസം താമസിച്ചു
  rationale: യാത്രാവിവരണത്തിൽ διατρίβω ഒരു സ്ഥലത്ത് സമയം ചെലവഴിച്ച് തങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു.
