id: ACT.20.3
reference: Acts 20:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: ml
  text: അവിടെ മൂന്നു മാസം ചെലവഴിച്ചശേഷം, സിറിയയിലേക്കു കപ്പലിൽ പുറപ്പെടാനിരിക്കെ യഹൂദർ[a] അദ്ദേഹത്തിനെതിരെ ഗൂഢാലോചന നടത്തിയപ്പോൾ, അദ്ദേഹം മക്കെദോന്യവഴി മടങ്ങാൻ തീരുമാനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘യഹൂദർ’ എന്നു പറയുന്നത് പൗലോസിനെ എതിർത്തിരുന്ന സന്ദർഭത്തിലെ ഒരു പ്രത്യേക കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വ്യത്യാസമില്ലാതെ എല്ലാ യഹൂദരെയും അല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: അവിടെ മൂന്നു മാസം ചെലവഴിച്ചശേഷം
  rationale: ποιέω എന്ന ക്രിയ കാലയളവിനോടൊപ്പം വരുമ്പോൾ ‘കാലം ചെലവഴിക്കുക’ എന്ന അർഥമാണ്. മുൻവാക്യത്തിലെ ഗ്രീസിനെ സൂചിപ്പിക്കാൻ സന്ദർഭത്തിൽനിന്ന് ‘അവിടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: അദ്ദേഹത്തിനെതിരെ ഗൂഢാലോചന നടത്തിയതുകൊണ്ട്
  rationale: ἐπιβουλή ശത്രുതാപരമായ രഹസ്യപദ്ധതിയെയോ ഗൂഢാലോചനയെയോ സൂചിപ്പിക്കുന്നു. ഈ genitive absolute ഇവിടെ സാഹചര്യവും തുടർന്നുള്ള തീരുമാനത്തിന്റെ കാരണവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: യഹൂദർ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ ജനവിഭാഗസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് എല്ലാ യഹൂദരെയും പൊതുവായി ഉദ്ദേശിക്കുന്നില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: കപ്പൽമാർഗം സിറിയയിലേക്കു പോകാനിരിക്കെ
  rationale: μέλλω ആസന്നമായ ഉദ്ദേശം സൂചിപ്പിക്കുന്നു; യാത്രാസന്ദർഭത്തിലെ ἀνάγομαι കടൽയാത്ര പുറപ്പെടുക എന്ന അർഥം നൽകുന്നു.
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: മടങ്ങാൻ അദ്ദേഹം തീരുമാനിച്ചു
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം ഒരു തീരുമാനത്തിലെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപമാണിത്.
- source_word: διὰ Μακεδονίας
  choice: മക്കെദോന്യവഴി
  rationale: διά + genitive ഇവിടെ യാത്രാമാർഗം സൂചിപ്പിക്കുന്നു; ‘മക്കെദോന്യവഴി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: സംഘർഷവിവരണത്തിലെ ‘യഹൂദർ’ എന്ന പരാമർശത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘യഹൂദർ’ എന്ന മൂലപാഠസമീപമായ രൂപം നിലനിർത്തി, സന്ദർഭപരമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘യഹൂദരിൽ ചിലർ’ അല്ലെങ്കിൽ ‘യഹൂദ എതിരാളികൾ’ എന്നു പ്രധാനപാഠത്തിൽ വിവർത്തനം ചെയ്യുക.
  rationale: τῶν Ἰουδαίων എന്ന മൂലപ്രയോഗത്തിൽ ‘ചിലർ’ അല്ലെങ്കിൽ ‘എതിരാളികൾ’ എന്ന വിശേഷണം നേരിട്ട് ഇല്ല. എന്നാൽ ഈ സന്ദർഭം മുഴുവൻ യഹൂദജനതയെ കുറ്റപ്പെടുത്തുന്നില്ല; തെറ്റായ പൊതുവൽക്കരണം ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും തിരുവെഴുത്തുവിവരണത്തിന് യോജിച്ച മാന്യമായ ശൈലി പാലിച്ചു. ‘അദ്ദേഹം’ എന്ന സർവനാമം മുൻസന്ദർഭത്തിലെ പൗലോസിനെ സൂചിപ്പിക്കുന്നു.
