revisions:
- from: അവിടെ മൂന്നു മാസം ചെലവഴിച്ചശേഷം, കപ്പൽമാർഗം സിറിയയിലേക്കു പോകാനിരിക്കെ യഹൂദർ[a] അദ്ദേഹത്തിനെതിരെ ഗൂഢാലോചന നടത്തിയതുകൊണ്ട്, മക്കെദോന്യവഴി മടങ്ങാൻ അദ്ദേഹം തീരുമാനിച്ചു.
