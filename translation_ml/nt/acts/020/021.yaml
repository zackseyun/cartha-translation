id: ACT.20.21
reference: Acts 20:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: ml
  text: ദൈവത്തോടുള്ള മാനസാന്തരത്തെക്കുറിച്ചും നമ്മുടെ കർത്താവായ യേശുവിലുള്ള വിശ്വാസത്തെക്കുറിച്ചും[a] യെഹൂദന്മാരോടും ഗ്രീക്കുകാരോടും ഒരുപോലെ ഗൗരവപൂർവം സാക്ഷ്യം പറഞ്ഞുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നമ്മുടെ കർത്താവായ യേശുവിലുള്ള ആശ്രയം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: ഗൗരവപൂർവം സാക്ഷ്യം പറഞ്ഞുകൊണ്ട്
  rationale: ക്രിയയുടെ ശക്തമായ, ഗൗരവമേറിയ സാക്ഷ്യത്തിന്റെ ഭാവവും വാക്യത്തിലെ കൃതന്തഘടനയും നിലനിർത്തുന്നു.
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: യെഹൂദന്മാരോടും ഗ്രീക്കുകാരോടും ഒരുപോലെ
  rationale: ഇരുകൂട്ടരെയും ഉൾക്കൊള്ളുന്ന τε καὶ ഘടന വ്യക്തമാക്കുകയും Ἕλλησιν എന്നത് പൊതുവായ ‘ജാതികൾ’ എന്നു വിപുലീകരിക്കാതെ ‘ഗ്രീക്കുകാർ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μετάνοιαν
  choice: മാനസാന്തരം
  rationale: വെറും അഭിപ്രായമാറ്റമല്ല, ദൈവത്തിലേക്കുള്ള ധാർമികവും ആത്മീയവുമായ തിരിഞ്ഞുവരവ് സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: εἰς θεόν
  choice: ദൈവത്തോടുള്ള
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയും അഭിമുഖതയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: യേശുവാണ് വിശ്വാസത്തിന്റെ വ്യക്തമായ ലക്ഷ്യം; അതിനാൽ πίστις എന്നതിന്റെ സാധാരണയും പ്രസക്തവുമായ പരിഭാഷ ‘വിശ്വാസം’ ആണ്. ‘ആശ്രയം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: നമ്മുടെ കർത്താവായ യേശുവിലുള്ള
  rationale: വിശ്വാസം യേശുവിൽ അർപ്പിക്കപ്പെടുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; κύριος എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം ‘കർത്താവ്’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πίστις എന്ന ദൈവശാസ്ത്രഭാരമുള്ള പദത്തിന്റെ പരിഭാഷ
  choice: നമ്മുടെ കർത്താവായ യേശുവിലുള്ള വിശ്വാസം
  alternative: നമ്മുടെ കർത്താവായ യേശുവിലുള്ള ആശ്രയം
  rationale: ഇവിടെ യേശു വിശ്വാസത്തിന്റെ വ്യക്തമായ ലക്ഷ്യമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ ഏറ്റവും നേരിട്ടുള്ള പരിഭാഷയാണ്; വ്യക്തിപരമായ ആശ്രയത്തിന്റെ അർത്ഥനിറം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഇത് മുൻവാക്യത്തിലെ ക്രിയയെ ആശ്രയിക്കുന്ന കൃതന്തവാക്യമായതിനാൽ ‘സാക്ഷ്യം പറഞ്ഞുകൊണ്ട്’ എന്ന ബന്ധഘടന നിലനിർത്തിയിരിക്കുന്നു.
