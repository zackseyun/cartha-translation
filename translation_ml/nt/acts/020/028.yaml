    rationale: ‘തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ അവൻ’ എന്ന സമീപസ്ഥിതി കാരണം ‘അവൻ’ ദൈവത്തെയല്ല, ‘സ്വന്തമായവൻ’ എന്ന അവസാനമായി പറഞ്ഞ വ്യക്തിയെയാണെന്നു വായനക്കാരൻ ആദ്യം ഗ്രഹിക്കാൻ ഇടയുണ്ട്. ഗ്രീക്കിലെ τοῦ θεοῦ-നോട് ബന്ധപ്പെട്ട സഭയെ ദൈവം സമ്പാദിച്ചു എന്ന ബന്ധം വ്യക്തമായി പ്രകടമാക്കണം.
  revised_text: നിങ്ങളെത്തന്നെയും മുഴുവൻ ആട്ടിൻകൂട്ടത്തെയും ജാഗ്രതയോടെ ശ്രദ്ധിച്ചുകൊള്ളുവിൻ. ആ കൂട്ടത്തിനുള്ളിൽ പരിശുദ്ധാത്മാവ് നിങ്ങളെ മേൽനോട്ടക്കാരായി നിയമിച്ചിരിക്കുന്നു—ദൈവം തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ തനിക്കായി സമ്പാദിച്ച സഭയെ[a] മേയിക്കേണ്ടതിന്.[b]
