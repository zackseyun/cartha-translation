id: ACT.20.28
reference: Acts 20:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: ml
  text: നിങ്ങളെത്തന്നെയും മുഴുവൻ ആട്ടിൻകൂട്ടത്തെയും ജാഗ്രതയോടെ ശ്രദ്ധിച്ചുകൊള്ളുവിൻ. ആ കൂട്ടത്തിനുള്ളിൽ പരിശുദ്ധാത്മാവ് നിങ്ങളെ മേൽനോട്ടക്കാരായി നിയമിച്ചിരിക്കുന്നു—ദൈവം തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ തനിക്കായി സമ്പാദിച്ച സഭയെ[a] മേയിക്കേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ദൈവത്തിന്റെ സഭ” എന്നതിനു പകരം “കർത്താവിന്റെ സഭ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: “തന്റെ സ്വന്തപുത്രന്റെ രക്തത്തിലൂടെ” എന്നും മനസ്സിലാക്കാം; പരമ്പരാഗതമായി “സ്വന്തം രക്തത്താൽ” എന്നും വിവർത്തനം ചെയ്തിട്ടുണ്ട്. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: ജാഗ്രതയോടെ ശ്രദ്ധിച്ചുകൊള്ളുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ ജാഗ്രതയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; സൈനികഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: παντὶ τῷ ποιμνίῳ
  choice: മുഴുവൻ ആട്ടിൻകൂട്ടത്തെയും
  rationale: ποιμνίον എന്ന ഇടയരൂപകം നിലനിർത്തുകയും παντί എന്നതിന്റെ സമഗ്രത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ᾧ
  choice: ആ കൂട്ടത്തിനുള്ളിൽ
  rationale: നേതാക്കൾ ആട്ടിൻകൂട്ടത്തിനു പുറത്തല്ല, അതിനുള്ളിൽ തന്നെയാണ് നിയമിക്കപ്പെട്ടതെന്ന ഗ്രീക്ക് ആശയം നിലനിർത്തുന്നു.
- source_word: ἔθετο
  choice: നിയമിച്ചിരിക്കുന്നു
  rationale: ഇവിടെ τίθημι ഒരു ചുമതലയിലേക്കുള്ള നിയോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπισκόπους
  choice: മേൽനോട്ടക്കാരായി
  rationale: പിന്നീടുണ്ടായ പ്രത്യേക സഭാപദവികളുടെ അർഥം മുൻകൂട്ടി ചുമത്താതെ മേൽനോട്ടം വഹിക്കുന്നവരെന്ന പദാർഥം നൽകുന്നു.
- source_word: ποιμαίνειν
  choice: മേയിക്കേണ്ടതിന്
  rationale: ഇടയൻ ആട്ടിൻകൂട്ടത്തെ മേയിക്കുന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἐκκλησίαν
  choice: സഭയെ
  rationale: ഇവിടെ ക്രിസ്തീയ വിശ്വാസികളുടെ സമൂഹമാണ് ഉദ്ദേശ്യം; ആധുനിക മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മുഖ്യപാഠത്തിലെ θεοῦ നേരിട്ട് പിന്തുടരുന്നു; ‘കർത്താവിന്റെ’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: περιεποιήσατο
  choice: തനിക്കായി സമ്പാദിച്ചു
  rationale: മധ്യമപ്രയോഗത്തിൽ അടങ്ങിയിരിക്കുന്ന ‘സ്വന്തമാക്കുക/തനിക്കായി നേടുക’ എന്ന ഭാവം നിലനിർത്തുന്നു; വാണിജ്യപരമായ ‘വിലയ്ക്കു വാങ്ങി’ എന്ന ആശയം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: διὰ τοῦ αἵματος
  choice: രക്തത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗമോ ഉപാധിയോ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῦ ἰδίου
  choice: തനിക്കു സ്വന്തമായവന്റെ
  rationale: ഗ്രീക്കിലെ substantival ἴδιος എന്ന സംക്ഷിപ്ത പ്രയോഗം ‘പുത്രൻ’ എന്ന് മുഖ്യപാഠത്തിൽ ചേർത്ത് തീർപ്പാക്കാതെ, മലയാളത്തിൽ സാധ്യമായത്ര വായനാസൗകര്യത്തോടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ αἵματος τοῦ ἰδίου എന്നതിന്റെ സൂചനയും ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം
  choice: ‘തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ’ എന്ന തുറന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ
  alternative: ‘തന്റെ സ്വന്തപുത്രന്റെ രക്തത്തിലൂടെ’ അല്ലെങ്കിൽ ‘സ്വന്തം രക്തത്താൽ’
  rationale: ἰδίου എന്നത് നാമവൽക്കരിച്ച വിശേഷണമായി ‘തനിക്കു സ്വന്തമായവൻ’ എന്നു ഗ്രഹിക്കാം; പലരും അതിൽ പുത്രനെ സൂചിപ്പിച്ചതായി കാണുന്നു. എന്നാൽ ‘പുത്രൻ’ ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ല. ‘ദൈവത്തിന്റെ സഭ’യോടു ചേർത്ത് ‘സ്വന്തം രക്തത്താൽ’ എന്നും പരമ്പരാഗതമായി വിവർത്തനം ചെയ്യുന്നു. മുഖ്യപാഠം ഈ യഥാർഥ വ്യാഖ്യാനസമ്മർദം തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: ἐκκλησίαν τοῦ θεοῦ എന്ന പാഠഭേദം
  choice: SBLGNT അനുസരിച്ച് ‘ദൈവത്തിന്റെ സഭ’
  alternative: ‘കർത്താവിന്റെ സഭ’
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠത്തെ മുഖ്യപാഠത്തിൽ പിന്തുടരുകയും ശ്രദ്ധേയമായ കൈയെഴുത്തുപ്രതി ഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആട്ടിൻകൂട്ടം/മേയിക്കുക’ എന്ന ബന്ധിത ഇടയരൂപകം നിലനിർത്തി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം ഡാഷും ആവർത്തിച്ച ‘ആ സഭയെ’ എന്ന പ്രയോഗവുംകൊണ്ട് വ്യക്തമാക്കി.
