  revision_rationale: ദൈവം സഭയെ സമ്പാദിച്ചവനാണെന്ന ഗ്രീക്ക് വ്യാകരണബന്ധം വ്യക്തമായി കാണിക്കുന്നതിനായി അവസാന ഉപവാക്യത്തിന്റെ വാക്കുകളുടെ ക്രമം പരിഷ്കരിച്ചു. ‘തനിക്കു സ്വന്തമായവൻ’ എന്ന അസ്പഷ്ടമായെങ്കിലും സാധ്യമായ മുഖ്യവായന നിലനിർത്തി; ‘പുത്രൻ’ എന്നും ‘സ്വന്തം രക്തം’ എന്നും മുഖ്യപാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനതീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ മാത്രം നൽകി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ക്രമവും പാഠഭേദത്തിനും വ്യാഖ്യാനബദലിനും യോജിപ്പിച്ചു.
