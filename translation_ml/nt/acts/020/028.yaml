  source_fidelity: 'മുഖ്യാർഥം പൊതുവേ കൃത്യമാണ്: തുടർച്ചയായ ജാഗ്രത, മുഴുവൻ ആട്ടിൻകൂട്ടം, പരിശുദ്ധാത്മാവിന്റെ നിയമനം, മേൽനോട്ടച്ചുമതല, സഭയെ മേയിക്കൽ, ‘ദൈവത്തിന്റെ സഭ’ എന്ന SBLGNT വായന, സമ്പാദിക്കുക എന്ന മധ്യമപ്രയോഗഭാവം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ നിലവിലെ അവസാനവാക്യത്തിലെ ‘തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ … അവൻ’ എന്ന ക്രമം ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ മുൻസൂചനയെ അവ്യക്തമാക്കുന്നു; അത് തൊട്ടുമുമ്പുള്ള ‘സ്വന്തമായവൻ’ എന്നതിലേക്കു തെറ്റായി ചൂണ്ടുന്നതുപോലെ വായിക്കാം. ഗ്രീക്കിൽ സഭയെ സമ്പാദിച്ചവൻ ‘ദൈവം’ ആണെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കേണ്ടതാണ്.'
  naturalness: ‘ജാഗ്രതയോടെ ശ്രദ്ധിച്ചുകൊള്ളുവിൻ,’ ‘മുഴുവൻ ആട്ടിൻകൂട്ടം,’ ‘മേൽനോട്ടക്കാർ,’ ‘സഭയെ മേയിക്കുക’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ‘തനിക്കു സ്വന്തമായവന്റെ’ ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നുവെങ്കിലും സ്വതന്ത്രമായി അല്പം ഭാരമുള്ള പ്രയോഗമാണ്; അടിക്കുറിപ്പോടുകൂടി അത് സ്വീകരിക്കാം. വാക്യക്രമം മാറ്റി ‘ദൈവം’ വ്യക്തമായ കർത്താവാക്കുന്നത് വായനാസൗകര്യവും വ്യാകരണബന്ധവും മെച്ചപ്പെടുത്തും.
  terminology: ‘പരിശുദ്ധാത്മാവ്,’ ‘മേൽനോട്ടക്കാർ,’ ‘ദൈവത്തിന്റെ സഭ,’ ‘മേയിക്കുക,’ ‘രക്തത്തിലൂടെ’ എന്നിവ യോജിച്ചതാണ്. ‘കർത്താവിന്റെ സഭ’ എന്ന പാഠഭേദവും ‘സ്വന്തപുത്രൻ’/‘സ്വന്തം രക്തം’ എന്ന വ്യാഖ്യാനസാദ്ധ്യതകളും അടിക്കുറിപ്പുകളിൽ നിഷ്പക്ഷമായി സൂക്ഷിച്ചിരിക്കുന്നു. ‘തനിക്കായി സമ്പാദിച്ചു’ περιεποιήσατο എന്ന മധ്യമപ്രയോഗത്തിന്റെ സ്വയം-സമ്പാദനഭാവം നന്നായി അറിയിക്കുന്നു.
