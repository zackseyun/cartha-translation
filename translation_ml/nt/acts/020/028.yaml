revisions:
- from: നിങ്ങളെത്തന്നെയും മുഴുവൻ ആട്ടിൻകൂട്ടത്തെയും ജാഗ്രതയോടെ ശ്രദ്ധിച്ചുകൊള്ളുവിൻ. ആ കൂട്ടത്തിനുള്ളിൽ പരിശുദ്ധാത്മാവ് നിങ്ങളെ മേൽനോട്ടക്കാരായി നിയമിച്ചിരിക്കുന്നു—ദൈവത്തിന്റെ സഭയെ[a] മേയിക്കേണ്ടതിന്. തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ[b] അവൻ ആ സഭയെ തനിക്കായി സമ്പാദിച്ചു.
  to: നിങ്ങളെത്തന്നെയും മുഴുവൻ ആട്ടിൻകൂട്ടത്തെയും ജാഗ്രതയോടെ ശ്രദ്ധിച്ചുകൊള്ളുവിൻ. ആ കൂട്ടത്തിനുള്ളിൽ പരിശുദ്ധാത്മാവ് നിങ്ങളെ മേൽനോട്ടക്കാരായി നിയമിച്ചിരിക്കുന്നു—ദൈവം തനിക്കു സ്വന്തമായവന്റെ രക്തത്തിലൂടെ തനിക്കായി സമ്പാദിച്ച സഭയെ[a] മേയിക്കേണ്ടതിന്.[b]
  rationale: ദൈവം സഭയെ സമ്പാദിച്ചവനാണെന്ന ഗ്രീക്ക് വ്യാകരണബന്ധം വ്യക്തമായി കാണിക്കുന്നതിനായി അവസാന ഉപവാക്യത്തിന്റെ വാക്കുകളുടെ ക്രമം പരിഷ്കരിച്ചു. ‘തനിക്കു സ്വന്തമായവൻ’ എന്ന അസ്പഷ്ടമായെങ്കിലും സാധ്യമായ മുഖ്യവായന നിലനിർത്തി; ‘പുത്രൻ’ എന്നും ‘സ്വന്തം രക്തം’ എന്നും മുഖ്യപാഠത്തിൽ ചേർത്ത് വ്യാഖ്യാനതീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ മാത്രം നൽകി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ ക്രമവും പാഠഭേദത്തിനും വ്യാഖ്യാനബദലിനും യോജിപ്പിച്ചു.
