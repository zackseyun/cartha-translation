  terminology: «മുട്ടുകുത്തി» is an apt idiomatic rendering of θεὶς τὰ γόνατα αὐτοῦ, and «പ്രാർഥിച്ചു» is standard, natural terminology for προσηύξατο. No doctrinally loaded wording is introduced.
