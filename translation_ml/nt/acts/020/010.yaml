reference: Acts 20:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് താഴേക്കിറങ്ങി, അവന്റെമേൽ വീണു അവനെ ചേർത്തുപിടിച്ച് പറഞ്ഞു: “പരിഭ്രമിക്കരുത്; അവന്റെ ജീവൻ[a] അവനിലുണ്ട്.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ആത്മാവ്.’ ഗ്രീക്ക് ψυχή എന്ന പദത്തിന് ‘ജീവൻ,’ ‘സ്വയം,’ ‘ആത്മാവ്’ എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അവൻ മരിച്ചോ ജീവനോടെയുണ്ടോ എന്ന സന്ദർഭത്തിന് ‘ജീവൻ’ ഏറ്റവും യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: യുവാവ് മരിച്ചിരുന്നില്ലെന്നാണ് പൗലോസ് പറഞ്ഞതെന്നോ, അവന്റെ ജീവൻ പുനഃസ്ഥാപിക്കപ്പെട്ടുവെന്നാണ് പറഞ്ഞതെന്നോ ഈ വാക്കുകൾ മനസ്സിലാക്കാം; ഗ്രീക്ക് വാചകം തന്നെ ഈ കാര്യം വ്യക്തമായി തീർപ്പാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: താഴേക്കിറങ്ങി
  rationale: καταβαίνω എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തുന്നു; മുകളിലെ മുറിയിൽനിന്ന് പൗലോസ് ഇറങ്ങിച്ചെന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വീഴ്ചയുടെയും മരണപ്രഖ്യാപനത്തിന്റെയും പിന്നാലെയുള്ള പൗലോസിന്റെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന മൃദുവായ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ἐπέπεσεν αὐτῷ
  choice: അവന്റെമേൽ കമിഴ്ന്നുവീണ്
  rationale: ശരീരം അവന്റെമേൽ ചായിച്ചുവീഴുന്ന പ്രവൃത്തി വ്യക്തമായി നൽകുകയും ഏലിയാവിന്റെയും എലീശായുടെയും സമാന പ്രവൃത്തികളെ ഓർമിപ്പിക്കാവുന്ന ഭാഷാപ്രതിധ്വനി അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: συμπεριλαβὼν
  choice: അവനെ ചേർത്തുപിടിച്ചുകൊണ്ട്
  rationale: ചുറ്റിപ്പിടിക്കുക, ആലിംഗനം ചെയ്യുക എന്ന ശാരീരികവും കരുതലോടുകൂടിയതുമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Μὴ θορυβεῖσθε
  choice: പരിഭ്രമിക്കേണ്ട
  rationale: θορυβέω സൂചിപ്പിക്കുന്ന അസ്വസ്ഥത, ഉത്കണ്ഠ, കലക്കം എന്നിവ സന്ദർഭോചിതമായി ഉൾക്കൊള്ളുന്നു; ‘ബഹളം വെക്കരുത്’ എന്നത് പുറമേയുള്ള ശബ്ദത്തിൽ മാത്രം അർഥം ചുരുക്കാനിടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: അവന്റെ ജീവൻ
  rationale: ψυχή എന്നതിന് ജീവൻ, സ്വയം, ആത്മാവ് എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ഇവിടെ യുവാവ് മരിച്ചോ ജീവനോടെയുണ്ടോ എന്നതാണ് ഉടനെയുള്ള വിഷയം; അതിനാൽ ‘ജീവൻ’ യോജിക്കുന്നു, എന്നാൽ ‘ആത്മാവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ ἐστιν
  choice: അവനിലുണ്ട്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലാളിത്യവും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു. ജീവൻ തുടർന്നും അവനിൽ ഉണ്ടായിരുന്നുവെന്നോ തിരികെ ലഭിച്ചുവെന്നോ വിവർത്തനം സ്വയം തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: ജീവൻ/മരണം എന്ന സന്ദർഭത്തിൽ ψυχή എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാക്യത്തിൽ ‘ജീവൻ’ എന്നു നൽകി.
  alternative: ‘ആത്മാവ്’ എന്നു നൽകുക.
  rationale: സന്ദർഭം യൂത്തിക്കൊസിന്റെ ശാരീരിക ജീവാവസ്ഥയെക്കുറിച്ചാണ്. ‘ജീവൻ’ സാധാരണ ഗ്രീക്ക് പ്രയോഗത്തോട് യോജിക്കുകയും ഈ വാക്യം മുൻനിർത്താത്ത ആത്മാവ്-ശരീരം സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: യൂത്തിക്കൊസ് യഥാർഥത്തിൽ മരിച്ചിരുന്നോ, ജീവൻ പുനഃസ്ഥാപിക്കപ്പെട്ടതാണോ
  choice: ‘അവന്റെ ജീവൻ അവനിലുണ്ട്’ എന്ന നിഷ്പക്ഷ രൂപം നിലനിർത്തി.
  alternative: ‘അവൻ മരിച്ചിട്ടില്ല’ അല്ലെങ്കിൽ ‘അവന് ജീവൻ തിരികെ ലഭിച്ചു’ എന്ന വ്യാഖ്യാനാത്മക രൂപം.
  rationale: ഗ്രീക്ക് വാചകം ജീവൻ അവനിലുണ്ടെന്ന് പറയുന്നു; അത് തുടർന്നും ഉണ്ടായിരുന്നതാണോ പുനഃസ്ഥാപിക്കപ്പെട്ടതാണോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘കമിഴ്ന്നുവീണ്’ ശാരീരിക പ്രവൃത്തി വ്യക്തമായി സൂചിപ്പിക്കുമ്പോഴും പ്രവാചകകഥകളുമായുള്ള സാധ്യതയുള്ള പ്രതിധ്വനി നിലനിർത്തുന്നു. ‘ജീവൻ അവനിലുണ്ട്’ എന്ന നേരിട്ടുള്ള രൂപം മൂലപാഠത്തിലെ അർഥതുറപ്പ് സംരക്ഷിക്കുന്നു.
