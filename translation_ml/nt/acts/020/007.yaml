  source_fidelity: 'മുഖ്യഅർഥം കൃത്യമാണ്: ഒന്നാംപുരുഷ ബഹുവചനമായ കൂടിവരവ്, അപ്പം നുറുക്കാനുള്ള ഉദ്ദേശ്യം, പൗലോസിന്റെ തുടർച്ചയായ സംസാരിക്കൽ, പിറ്റേന്നത്തെ പുറപ്പാട്, അർധരാത്രിവരെയുള്ള ദൈർഘ്യം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ κλάσαι ἄρτον എന്ന സ്ഥിരബൈബിൾപ്രയോഗത്തിന് മലയാളത്തിൽ ‘അപ്പം നുറുക്കുക’ എന്നത് ‘അപ്പം മുറിക്കുക’ എന്നതിനെക്കാൾ യോജിച്ചതാണ്.'
  naturalness: വാക്യഘടന സ്വാഭാവികവും മാന്യവുമാണ്. ‘ആഴ്ചയുടെ ആദ്യദിവസം’ എന്ന രൂപം ആധുനിക മലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതാണ്. അടിക്കുറിപ്പിലെ ‘ധ്വനി’ എന്നതിനുപകരം ‘സൂചന’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
  terminology: ‘അപ്പം നുറുക്കുക’ മൂലഭാഷയിലെ പ്രയോഗാത്മകതയും മലയാള ബൈബിൾവായനയിലെ സ്ഥിരപ്രയോഗവും സംരക്ഷിക്കുന്നു; അതിനെ കർത്താവിന്റെ അത്താഴമെന്നു നിർണയിക്കുന്നില്ല. ‘അവരുമായി സംസാരിച്ചുകൊണ്ടിരുന്നു’ διαλέγετοയുടെ തുടർച്ചാഭാവവും സംവാദസാധ്യതയും ഉചിതമായി നൽകുന്നു.
