id: ACT.20.7
reference: Acts 20:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: ml
  text: ആഴ്ചയുടെ ആദ്യദിവസം, അപ്പം നുറുക്കാനായി[a] ഞങ്ങൾ ഒരുമിച്ചുകൂടിയപ്പോൾ, പിറ്റേന്ന് പുറപ്പെടാനിരുന്ന പൗലോസ് അവരുമായി സംസാരിച്ചുകൊണ്ടിരുന്നു[b]; അദ്ദേഹം ആ സംസാരം അർധരാത്രിവരെ നീട്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അപ്പം നുറുക്കുക’ എന്ന പ്രയോഗം ഒരുമിച്ചുള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കാം; അതോടൊപ്പം കർത്താവിന്റെ അത്താഴത്തെ സൂചിപ്പിക്കുന്ന ഭാവവും ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പിറ്റേന്ന് പുറപ്പെടേണ്ടിയിരുന്നതിനാൽ പൗലോസ് അവരുമായി സംസാരിച്ചുകൊണ്ടിരുന്നു; അദ്ദേഹം ആ സംസാരം അർധരാത്രിവരെ നീട്ടി.’
    reason: syntactical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: ആഴ്ചയുടെ ഒന്നാം ദിവസം
  rationale: കൊയ്നേ ഗ്രീക്കിലെ പതിവുശൈലിയനുസരിച്ച് ഇത് ആഴ്ചയുടെ ആദ്യദിവസത്തെ സൂചിപ്പിക്കുന്നു; ‘ശബ്ബത്തുകളിൽ ഒന്ന്’ എന്ന അക്ഷരാർഥ പരിഭാഷ ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും. δέയുടെ മൃദുവായ ബന്ധകഭാവം മലയാളത്തിൽ നിർബന്ധമായി പ്രത്യേക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: συνηγμένων ἡμῶν
  choice: ഞങ്ങൾ ഒരുമിച്ചുകൂടിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് മുഖ്യസംഭവത്തിന്റെ സാഹചര്യവും ഒന്നാംപുരുഷ ബഹുവചന ആഖ്യാനവീക്ഷണവും നൽകുന്നു.
- source_word: κλάσαι ἄρτον
  choice: അപ്പം മുറിക്കാനായി
  rationale: ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യഭാവം നിലനിർത്തുകയും, കൂട്ടായ ഭക്ഷണത്തെയും കർത്താവിന്റെ അത്താഴത്തെയും ഓർമിപ്പിക്കാവുന്ന മൂലഭാഷയിലെ പ്രയോഗം കൂടുതൽ ചുരുക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: διελέγετο αὐτοῖς
  choice: അവരുമായി സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചാഭാവവും διαλέγομαι എന്ന ക്രിയയ്ക്കുള്ള പരസ്പരസംഭാഷണസാധ്യതയും നിലനിർത്തുന്നു; ‘പ്രസംഗിച്ചു’ എന്ന ഏകപക്ഷീയ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: പിറ്റേന്ന് പുറപ്പെടാനിരുന്ന
  rationale: μέλλωയുടെ സമീപഭാവി/ഉദ്ദേശ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. പാർട്ടിസിപ്പിളിന്റെ ബന്ധം മുഖ്യവാചകത്തിൽ കാരണമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου
  choice: അദ്ദേഹം ആ സംസാരം അർധരാത്രിവരെ നീട്ടി
  rationale: παρατείνωയുടെ ‘നീട്ടുക’ എന്ന അർഥവും സമയപരിധിയും വ്യക്തമായി നൽകുന്നു. λόγος ഇവിടെ നടന്നുകൊണ്ടിരുന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ സംസാരം’ സന്ദർഭോചിതമാണ്.
theological_decisions:
- issue: ആദ്യകാല ക്രൈസ്തവ കൂടിവരവിലെ κλάσαι ἄρτον എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘അപ്പം മുറിക്കാനായി’ എന്ന് മൂലപ്രയോഗം സംരക്ഷിച്ചു
  alternative: ‘കർത്താവിന്റെ അത്താഴം ആചരിക്കാനായി’ അല്ലെങ്കിൽ ‘ഒരുമിച്ച് ഭക്ഷണം കഴിക്കാനായി’
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പ്രയോഗം കൂട്ടായ ഭക്ഷണത്തെയും കർത്താവിന്റെ അത്താഴത്തെയും സൂചിപ്പിക്കാവുന്നതാണ്. മൂലപാഠം ഒന്നിനെ മാത്രം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയും ആ അർഥവ്യാപ്തി തുറന്നുവെക്കുന്നു.
- issue: μέλλων എന്ന പാർട്ടിസിപ്പിളും പൗലോസിന്റെ സംസാരവും തമ്മിലുള്ള ബന്ധം
  choice: ‘പിറ്റേന്ന് പുറപ്പെടാനിരുന്ന പൗലോസ്’ എന്ന ബന്ധകപ്രയോഗം
  alternative: ‘പിറ്റേന്ന് പുറപ്പെടേണ്ടിയിരുന്നതിനാൽ പൗലോസ്’ എന്ന കാരണാർഥ പ്രയോഗം
  rationale: സന്ദർഭം കാരണബന്ധം സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് പാർട്ടിസിപ്പിൾ അത് വ്യാകരണപരമായി നിർബന്ധിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം കാരണാർഥം അന്തിമമായി നിശ്ചയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അപ്പം മുറിക്കുക’ എന്ന ബൈബിൾപ്രയോഗം അതിന്റെ അർഥവ്യാപ്തി നിലനിർത്താൻ സൂക്ഷിച്ചു; ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ എന്നത് സംവാദസാധ്യതയും പ്രവൃത്തിയുടെ തുടർച്ചയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
