  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: ml
  text: ഞാൻ പോയശേഷം[b] ക്രൂരരായ ചെന്നായ്ക്കൾ[a] നിങ്ങളുടെ ഇടയിലേക്കു കടന്നുവന്ന് ആട്ടിൻകൂട്ടത്തോട് കരുണ കാണിക്കുകയില്ലെന്ന് എനിക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉഗ്രരായ ചെന്നായ്ക്കൾ.” ഗ്രീക്ക് വിശേഷണപദം കഠിനവും പീഡനപരവും അക്രമാസക്തവുമായ രൂക്ഷതയെ സൂചിപ്പിക്കാം.
