theological_decisions:
- issue: ‘ചെന്നായ്ക്കൾ’ എന്ന രൂപകത്തിന്റെ തിരിച്ചറിയൽ
  choice: ‘ക്രൂരരായ ചെന്നായ്ക്കൾ’ എന്ന രൂപകം അതേപടി നിലനിർത്തുക
  alternative: വ്യാജോപദേഷ്ടാക്കൾ / പീഡകർ / വിനാശകാരികളായ മനുഷ്യർ
  rationale: ഈ വാക്യം ചെന്നായ്ക്കൾ ആരെ സൂചിപ്പിക്കുന്നു എന്നു നേരിട്ട് വ്യക്തമാക്കുന്നില്ല. രൂപകം നിലനിർത്തുന്നത് അതിന്റെ വാഗ്മിത്വശക്തിയും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
- issue: ἄφιξις എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ‘ഞാൻ പോയശേഷം’
  alternative: ‘എന്റെ വരവിനുശേഷം’ / ‘ഞാൻ എത്തിയശേഷം’
  rationale: പദത്തിന് ‘വരവ്’ എന്ന സാധാരണ അർഥമുണ്ടെങ്കിലും, പൗലോസ് ഇനി അവരോടൊപ്പം ഇല്ലാത്ത കാലത്ത് സംഭവിക്കാനിരിക്കുന്നതിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥത്തിലെ അസാധാരണത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ചെന്നായ്ക്കൾ’–‘ആട്ടിൻകൂട്ടം’ എന്ന ഏകീകൃത ഇടയരൂപകം നിലനിർത്തി. മുഖ്യവാചകത്തിൽ സന്ദർഭാർഥം വ്യക്തമാക്കിയിട്ടും ἄφιξις എന്ന പദത്തിന്റെ യഥാർഥ ഭാഷാപരമായ അസാധാരണത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
