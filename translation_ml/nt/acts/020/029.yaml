  rationale: βαρεῖς എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഭാരമുള്ള’ എന്നതിനു പകരം ഇവിടെ ഉദ്ദേശിക്കുന്ന കഠിനവും വിനാശകരവുമായ സ്വഭാവം വ്യക്തമാക്കുന്നു; ചെന്നായ്ക്കളുടെ രൂപകം നിലനിർത്തുന്നു.
- source_word: εἰς ὑμᾶς
