- from: അവൻ പറഞ്ഞ വാക്കിനെക്കുറിച്ചായിരുന്നു അവർ ഏറ്റവും ദുഃഖിച്ചത്[a]—ഇനി അവർ അവന്റെ മുഖം കാണുകയില്ല എന്ന വാക്കിനെക്കുറിച്ച്[b]. പിന്നെ അവർ അവനെ കപ്പൽവരെ അനുഗമിച്ചു[c].
  to: ഇനിമേൽ അവർ അവന്റെ മുഖം കാണുകയില്ലെന്ന് അവൻ പറഞ്ഞ വാക്കിനെക്കുറിച്ചാണ് അവർ ഏറ്റവും ദുഃഖിച്ചത്[a][b]. പിന്നെ അവർ അവനെ കപ്പൽവരെ കൂടെപ്പോയി[c].
  rationale: The revision removes an unnatural repetition while preserving the single Greek λόγος and its content clause. It retains the explicit “മുഖം” and renders οὐκέτι μέλλουσιν with a natural future-from-the-past expression. The closing verb is made more idiomatic for an escorting farewell, without suggesting that they boarded the ship.
