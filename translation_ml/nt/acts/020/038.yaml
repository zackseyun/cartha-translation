source:
  edition: SBLGNT
  text: ὀδυνώμενοι μάλιστα ἐπὶ τῷ λόγῳ ᾧ εἰρήκει ὅτι οὐκέτι μέλλουσιν τὸ πρόσωπον αὐτοῦ θεωρεῖν. προέπεμπον δὲ αὐτὸν εἰς τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/038.yaml
  text: grieving especially over the word that he had spoken[a], that they would no longer see his face[d][c][b]. And they were accompanying him to the ship.
translation:
  language: ml
  text: ഇനിമേൽ അവർ അവന്റെ മുഖം കാണുകയില്ലെന്ന് അവൻ പറഞ്ഞ വാക്കിനെക്കുറിച്ചാണ് അവർ ഏറ്റവും ദുഃഖിച്ചത്[a][b]. പിന്നെ അവർ അവനെ കപ്പൽവരെ കൂടെപ്പോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവൻ പറഞ്ഞ വാക്കിന്മേൽ.’ ‘അവൻ പറഞ്ഞതിനെക്കുറിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ഇനിമേൽ അവന്റെ മുഖം കാണുകയില്ല.’ ഇത് അവനെ വീണ്ടും കാണുകയില്ല എന്നതിന്റെ വ്യക്തിപരമായ പ്രയോഗമാണ്. ഗ്രീക്കിലെ μέλλω എന്ന ക്രിയ ഇവിടെ പ്രതീക്ഷിത ഭാവിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അവനെ യാത്രയയയ്ക്കാൻ കപ്പൽവരെ കൂടെപ്പോയി’ അല്ലെങ്കിൽ ‘അവനെ കപ്പൽവരെ അകമ്പടി ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδυνώμενοι
  choice: ദുഃഖിച്ചത്
  rationale: വിടവാങ്ങലിന്റെ പശ്ചാത്തലത്തിൽ ഉള്ളിലെ വേദനയും ദുഃഖവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: μάλιστα
  choice: ഏറ്റവും
  rationale: അവരുടെ ദുഃഖത്തിന്റെ മുഖ്യകാരണം ഇതായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: അവൻ പറഞ്ഞ വാക്കിനെക്കുറിച്ച്
  rationale: λόγος എന്ന നാമവും മുൻപ് പറഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന εἰρήκει എന്ന ക്രിയാരൂപവും നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: οὐκέτι μέλλουσιν
  choice: ഇനി ... കാണുകയില്ല
  rationale: ഭൂതകാലനിലയിൽനിന്നുള്ള പ്രതീക്ഷിത ഭാവിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; οὐκέτιയുടെ ‘ഇനി ഇല്ല’ എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: അവന്റെ മുഖം കാണുക
  rationale: ‘അവന്റെ മുഖം’ എന്ന വ്യക്തിപരവും സജീവവുമായ ഗ്രീക്ക് പ്രയോഗം ചുരുക്കി ‘അവനെ കാണുക’ എന്നാക്കാതെ നിലനിർത്തുന്നു.
- source_word: προέπεμπον
  choice: അനുഗമിച്ചു
  rationale: വിടപറഞ്ഞയയ്ക്കുന്നതിനായി കൂടെ പോകുക എന്ന സന്ദർഭാർഥം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്ക് അപൂർണ്ണഭൂതത്തിന്റെ ദൈർഘ്യം ഇവിടെ പ്രത്യേകമായി അടയാളപ്പെടുത്തേണ്ടതില്ല.
- source_word: εἰς τὸ πλοῖον
  choice: കപ്പൽവരെ
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള അനുഗമനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
