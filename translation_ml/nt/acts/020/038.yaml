translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ‘വാക്ക്,’ ‘അവന്റെ മുഖം’ എന്നീ ദൃശ്യവും വ്യക്തിപരവുമായ പ്രയോഗങ്ങൾ നിലനിർത്തി; ആവർത്തനം മലയാളത്തിൽ അല്പം ഭാരമുള്ളതാണെങ്കിലും λόγος-ബന്ധം വ്യക്തമാക്കാൻ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
