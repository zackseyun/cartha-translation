revisions:
- from: എന്നാൽ എന്റെ ജീവൻ[a] എനിക്കുതന്നെ വിലപ്പെട്ടതായി ഞാൻ കണക്കാക്കുന്നില്ല; എന്റെ ഓട്ടം[b] പൂർത്തിയാക്കാനും കർത്താവായ യേശുവിൽനിന്ന് എനിക്കു ലഭിച്ച ശുശ്രൂഷ—ദൈവകൃപയുടെ സുവിശേഷത്തിനു സാക്ഷ്യം വഹിക്കുക[c] എന്ന ശുശ്രൂഷ—നിറവേറ്റാനും കഴിഞ്ഞാൽ മാത്രം മതി.
  to: എന്നാൽ എന്റെ ജീവൻ[a] എനിക്കു വിലപ്പെട്ടതായി ഞാൻ കണക്കാക്കുന്നില്ല; എന്റെ ഓട്ടം[b] പൂർത്തിയാക്കാനും, കർത്താവായ യേശുവിൽനിന്ന് എനിക്കു ലഭിച്ച, ദൈവത്തിന്റെ കൃപയുടെ സുവിശേഷത്തിനു സാക്ഷ്യം വഹിക്കുന്ന[c] ശുശ്രൂഷ നിറവേറ്റാനും കഴിഞ്ഞാൽ മാത്രം മതി.
  rationale: The revision preserves the draft’s sound lexical choices and its rendering of Paul’s overriding aim (‘കഴിഞ്ഞാൽ മാത്രം മതി’), while eliminating unnecessary repetition. It more closely links ‘bearing witness to the gospel of God’s grace’ with the ministry received from the Lord Jesus. Footnote c is adjusted to agree grammatically with the participial main-text rendering.
