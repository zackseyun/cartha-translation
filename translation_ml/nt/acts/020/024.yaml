id: ACT.20.24
reference: Acts 20:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: ml
  text: എന്നാൽ എന്റെ ജീവൻ[a] എനിക്കു വിലപ്പെട്ടതായി ഞാൻ കണക്കാക്കുന്നില്ല; എന്റെ ഓട്ടം[b] പൂർത്തിയാക്കാനും, കർത്താവായ യേശുവിൽനിന്ന് എനിക്കു ലഭിച്ച, ദൈവത്തിന്റെ കൃപയുടെ സുവിശേഷത്തിനു സാക്ഷ്യം വഹിക്കുന്ന[c] ശുശ്രൂഷ നിറവേറ്റാനും കഴിഞ്ഞാൽ മാത്രം മതി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ പ്രാണൻ എനിക്കു വിലപ്പെട്ടതാണെന്ന്.’ തന്റെ ദൗത്യം പൂർത്തിയാക്കാൻ മരണം നേരിടാനുള്ള പൗലോസിന്റെ സന്നദ്ധതയാണ് സന്ദർഭം എന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘ജീവൻ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ പന്തയപ്പാത.’ ഗ്രീക്കിലെ δρόμος പൂർത്തിയാക്കേണ്ട ഓട്ടത്തെയോ അതിന്റെ പാതയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സാക്ഷ്യപ്പെടുത്തുന്ന’ അല്ലെങ്കിൽ ‘ഗൗരവപൂർവം സാക്ഷ്യപ്പെടുത്തുന്ന.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: എനിക്കുതന്നെ വിലപ്പെട്ടതായി ഞാൻ കണക്കാക്കുന്നില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ വ്യക്തിപരമായ മൂല്യനിർണയവും τιμίαν എന്നതിലെ ‘വിലപ്പെട്ട’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ψυχήν
  choice: ജീവൻ
  rationale: ഇവിടെ പൗലോസ് കഷ്ടതയെയും മരണത്തെയും നേരിടാൻ സന്നദ്ധനാകുന്നതാണ് സന്ദർഭം; അതിനാൽ ഭൗമികജീവനെ സൂചിപ്പിക്കുന്ന ‘ജീവൻ’ യോജിക്കുന്നു.
- source_word: ὡς τελειῶσαι
  choice: പൂർത്തിയാക്കാനും ... നിറവേറ്റാനും കഴിഞ്ഞാൽ മാത്രം മതി
  rationale: തന്റെ നിയോഗം പൂർത്തിയാക്കുക എന്നതാണ് പൗലോസിന്റെ പരമമായ പരിഗണനയെന്ന ചുരുക്കമുള്ള ഗ്രീക്ക് ഘടനയുടെ ശക്തി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δρόμον
  choice: ഓട്ടം
  rationale: പൂർത്തിയാക്കേണ്ട പന്തയപ്പാതയുടെയോ ജീവിതഗതിയുടെയോ രൂപകം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: διακονίαν
  choice: ശുശ്രൂഷ
  rationale: കർത്താവായ യേശുവിൽനിന്നു ലഭിച്ച നിയോഗിത സേവനത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിൽനിന്ന്
  rationale: παρά + genitive സൂചിപ്പിക്കുന്ന ഉറവിടം വ്യക്തമാക്കുകയും κύριος എന്ന സ്ഥാനപ്പേര് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διαμαρτύρασθαι
  choice: സാക്ഷ്യം വഹിക്കുക
  rationale: ഗൗരവത്തോടെയും ഉറപ്പോടെയും സാക്ഷ്യപ്പെടുത്തുക എന്ന ക്രിയയുടെ മുഖ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: ദൈവകൃപയുടെ സുവിശേഷം
  rationale: ഗ്രീക്കിലെ genitive ബന്ധം നിലനിർത്തുന്നതിനാൽ, സുവിശേഷം ദൈവകൃപയെക്കുറിച്ചുള്ളതാണോ അതിനാൽ സവിശേഷമാക്കപ്പെട്ടതാണോ എന്ന അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ψυχή എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: ദൗത്യം പൂർത്തിയാക്കേണ്ടതിനായി മരണം നേരിടാനുള്ള പൗലോസിന്റെ സന്നദ്ധതയാണ് സന്ദർഭം; ഇവിടെ മുൻനിർത്താത്ത ശരീരം–ആത്മാവ് വേർതിരിവ് വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരാതിരിക്കാൻ ‘ജീവൻ’ ഉപയോഗിച്ചു.
- issue: ὡς τελειῶσαι എന്ന ഘടനയുടെ ഭാവം
  choice: പൂർത്തിയാക്കാനും ... നിറവേറ്റാനും കഴിഞ്ഞാൽ മാത്രം മതി
  alternative: പൂർത്തിയാക്കേണ്ടതിന് / പൂർത്തിയാക്കുന്നതിനായി
  rationale: ഇത് കേവലം ഒരു ഉദ്ദേശ്യവാക്യമായി ചുരുക്കാതെ പൗലോസിന്റെ മുഖ്യവും ഏകാഗ്രവുമായ ലക്ഷ്യത്തിന്റെ ശക്തി പ്രകടമാക്കുന്നു.
- issue: τῆς χάριτος τοῦ θεοῦ എന്ന genitive ബന്ധം
  choice: ദൈവകൃപയുടെ സുവിശേഷം
  alternative: ദൈവകൃപയെക്കുറിച്ചുള്ള സുവിശേഷം
  rationale: സുവിശേഷവും ദൈവകൃപയും തമ്മിലുള്ള ബന്ധത്തെ ‘കുറിച്ചുള്ളത്’ എന്നു മാത്രം നിർവചിക്കാതെ മൂലഭാഷയിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ദീർഘവാക്യത്തിലെ ആശയബന്ധം വ്യക്തമാക്കാൻ അർധവിരാമവും em dash-ഉം ഉപയോഗിച്ചിരിക്കുന്നു; ‘ശുശ്രൂഷ’ എന്ന പദത്തിന്റെ ആവർത്തനം διαμαρτύρασθαι മുൻവരുന്ന διακονίαν-നെ വിശദീകരിക്കുന്നതാണെന്ന് സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
