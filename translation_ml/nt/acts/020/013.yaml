  to: എന്നാൽ ഞങ്ങൾ മുമ്പേ കപ്പലിൽ കയറി അസ്സൊസിലേക്കു പുറപ്പെട്ടു. അവിടെനിന്ന് പൗലോസിനെ കപ്പലിൽ കയറ്റാനായിരുന്നു ഞങ്ങളുടെ ഉദ്ദേശ്യം. അദ്ദേഹംതന്നെ കാൽനടയായി പോകാൻ ഉദ്ദേശിച്ചിരുന്നതിനാൽ അങ്ങനെ ക്രമീകരിച്ചിരുന്നു.[a]
