id: ACT.20.13
reference: Acts 20:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: ml
  text: എന്നാൽ ഞങ്ങൾ മുമ്പേ കപ്പലിൽ കയറി അസ്സൊസിലേക്കു പുറപ്പെട്ടു. അവിടെനിന്ന് പൗലോസിനെ കപ്പലിൽ കയറ്റാനായിരുന്നു ഞങ്ങളുടെ ഉദ്ദേശ്യം. അദ്ദേഹംതന്നെ കാൽനടയായി പോകാൻ ഉദ്ദേശിച്ചിരുന്നതിനാൽ അങ്ങനെ ക്രമീകരിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അദ്ദേഹംതന്നെ കരമാർഗം യാത്രചെയ്യാൻ ഉദ്ദേശിച്ചിരുന്നതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘അങ്ങനെ ക്രമീകരിക്കപ്പെട്ടിരുന്നു’ എന്നതും സാധ്യമാണ്; ഗ്രീക്കിലെ διατεταγμένος ἦν ഔപചാരികമായി കർമണിരൂപമാണ്, എങ്കിലും സന്ദർഭത്തിൽ ക്രമീകരണം പൗലോസ് നടത്തിയതായാണ് കൂടുതൽ സ്വാഭാവികമായി മനസ്സിലാകുന്നത്.
    reason: πεζεύειν കാൽനടയായുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു; എന്നാൽ കപ്പൽയാത്രയ്ക്കു വിരുദ്ധമായ കരയാത്ര എന്ന വിശാലസൂചനയും സന്ദർഭത്തിലുണ്ട്. διατεταγμένος ἦν എന്ന കർമണിരൂപത്തിന്റെ വ്യാകരണപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: προελθόντες
  choice: മുമ്പേ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് വിവരണകർത്താവിന്റെ സംഘം മുന്നോട്ടുപോയെന്ന കാലക്രമവും പൗലോസിനെക്കാൾ അവർ മുമ്പേ പോയെന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ τὸ πλοῖον
  choice: കപ്പലിൽ കയറി
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന ἐπί ഇവിടെ കപ്പലിൽ കയറുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലക്ഷ്യം വ്യക്തമാക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: ἀνήχθημεν
  choice: കപ്പൽ പുറപ്പെട്ടു
  rationale: നാവികസന്ദർഭത്തിൽ ക്രിയയുടെ അർഥം കടലിലേക്കു പുറപ്പെടുക എന്നതാണ്. കർത്തൃപ്രയോഗത്തിലേക്ക് മാറ്റിയെങ്കിലും ‘ഞങ്ങൾ’ ഉൾപ്പെട്ട യാത്രാസംഭവം വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: ἐπὶ τὴν Ἆσσον
  choice: അസ്സൊസിലേക്കു
  rationale: കപ്പൽയാത്രയുടെ ലക്ഷ്യസ്ഥാനം നേരിട്ട് വ്യക്തമാക്കുന്നു; Ἆσσος എന്ന സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം ‘അസ്സൊസ്’ എന്നാണ്.
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: കപ്പലിൽ കയറ്റാനായിരുന്നു ഞങ്ങളുടെ ഉദ്ദേശ്യം
  rationale: μέλλω ഇവിടെ ഉടൻ സംഭവിക്കാനിരിക്കുന്നതിനേക്കാൾ പദ്ധതിയെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ἀναλαμβάνω എന്നത് ഈ സന്ദർഭത്തിൽ ഒരാളെ കപ്പലിൽ സ്വീകരിച്ചുകയറ്റുക എന്നാണ്.
- source_word: ἐκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: പൗലോസിനെ കപ്പലിൽ കയറ്റേണ്ടിയിരുന്ന സ്ഥലത്തുനിന്നുള്ള ഗതിയെ സൂചിപ്പിക്കുന്ന അപാദാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: διατεταγμένος ἦν
  choice: അങ്ങനെയാണ് അദ്ദേഹം ക്രമീകരിച്ചിരുന്നത്
  rationale: മുൻകൂട്ടിയുള്ള ക്രമീകരണം സൂചിപ്പിക്കുന്ന പര്യായ പൂർവകാലരൂപത്തിന്റെ ആശയം നൽകുന്നു. സന്ദർഭത്തിൽ കർത്താവ് പൗലോസ് ആണെന്ന സാധ്യത മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു; ഔപചാരിക കർമണിരൂപത്തിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: അദ്ദേഹം കരമാർഗം പോകാൻ ഉദ്ദേശിച്ചിരുന്നതിനാൽ
  rationale: πεζεύειν കപ്പൽയാത്രയ്ക്കു വിപരീതമായി കരയിലൂടെയുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു. അത് പ്രത്യേകിച്ച് കാൽനടയാത്രയാകാമെന്ന കൂടുതൽ നിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു; αὐτός നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ വ്യക്തമായ സർവനാമപ്രയോഗത്തിലൂടെ ഭാഗികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: വിവരണകർത്താവിന്റെ സംഘവും പൗലോസും സ്വീകരിച്ച വ്യത്യസ്ത യാത്രാമാർഗങ്ങൾ തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
