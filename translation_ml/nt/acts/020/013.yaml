translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; കടൽയാത്രയും കരയാത്രയും തമ്മിലുള്ള വൈരുധ്യവും മൂലത്തിലെ അനിശ്ചിതത്വങ്ങളും സംരക്ഷിച്ചു.
