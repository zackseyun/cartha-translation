  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: ml
  text: 'ഇതൊന്നു മാത്രമൊഴികെ: പരിശുദ്ധാത്മാവ് നഗരംതോറും[a] എനിക്കു സാക്ഷ്യം പറഞ്ഞുകൊണ്ട്, ‘ചങ്ങലകളും[b] കഷ്ടതകളും എന്നെ[c] കാത്തിരിക്കുന്നു’ എന്നു പറയുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നഗരങ്ങൾതോറും’ എന്നോ ‘ഓരോ നഗരത്തിലും’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം, തുടർച്ചയായി വിവിധ നഗരങ്ങളിൽ സാക്ഷ്യം ആവർത്തിച്ചുവെന്ന വിതരണാത്മക അർഥം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ബന്ധനങ്ങളും കഷ്ടതകളും’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ചങ്ങലകൾ’ ഗ്രീക്കിലെ മൂർത്തമായ ദൃശ്യം നിലനിർത്തുന്നു; ‘ബന്ധനങ്ങൾ’ കൂടുതൽ പരമ്പരാഗതമായ പരിഭാഷയാണ്.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘എന്നെ’ എന്ന പദത്തിന്റെ സ്ഥാനത്തിലോ സാന്നിധ്യത്തിലോ ചെറിയ വ്യത്യാസമുണ്ട്. എന്നാൽ ചങ്ങലകളും കഷ്ടതകളും പൗലോസിനെ കാത്തിരിക്കുന്നു എന്ന അർഥത്തിൽ മാറ്റമില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: 'എന്നാൽ ഒന്നുമാത്രം:'
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് ഏക അപവാദമോ പരിമിതിയോ അവതരിപ്പിക്കുന്ന പ്രയോഗം. മലയാളത്തിൽ സ്വാഭാവികമായി തുടരുന്ന രീതിയിൽ അതിന്റെ exceptive force നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ദൈവിക ആത്മാവിനെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സമകാലികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: κατὰ πόλιν
  choice: നഗരങ്ങൾതോറും
  rationale: κατά + ഏകവചന നാമത്തിന്റെ വിതരണാത്മക അർഥം—തുടർച്ചയായ പല നഗരങ്ങളിലും ആവർത്തിക്കുന്ന സാക്ഷ്യം—സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; എല്ലാ നഗരവും എന്ന സമ്പൂർണത നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: διαμαρτύρεταί μοι
  choice: എനിക്കു സാക്ഷ്യം നൽകി
  rationale: ക്രിയയിലെ ഗൗരവമുള്ള സാക്ഷ്യപ്പെടുത്തൽ നിലനിർത്തുന്നു. ‘മുന്നറിയിപ്പു നൽകുന്നു’ എന്നത് പ്രവചനാത്മക ഉള്ളടക്കത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുമായിരുന്നു.
- source_word: λέγον
  choice: പറയുന്നത്
  rationale: ആത്മാവിന്റെ സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കം നേരിട്ട് അവതരിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: δεσμὰ
  choice: ചങ്ങലകൾ
  rationale: തടവിനെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ബന്ധനദൃശ്യം നിലനിർത്തുന്നു; ‘തടവ്’ എന്നു ഫലത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: θλίψεις
  choice: കഷ്ടതകൾ
  rationale: സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ പദം.
- source_word: με
  choice: എന്നെ
  rationale: അച്ചടിച്ച SBLGNT പാഠത്തിലെ കർമസർവനാമം വ്യക്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: μένουσιν
  choice: കാത്തിരിക്കുന്നു
  rationale: ഇവ പൗലോസിനു മുന്നിൽ സംഭവിക്കാനിരിക്കുന്നവയാണ് എന്ന prospective force സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘പരിശുദ്ധാത്മാവ്’ എന്നതിന്റെ പരാമർശവും പ്രവർത്തനവും
  choice: പൗലോസിനോട് സാക്ഷ്യം നൽകി സംസാരിക്കുന്ന വ്യക്തിപരമായ ദൈവിക പ്രവർത്തകൻ
  alternative: വ്യക്തിത്വമില്ലാത്ത ആത്മീയ സ്വാധീനം
  rationale: സാക്ഷ്യം നൽകുകയും പറയുകയും ചെയ്യുന്നതായി വാക്യം ആത്മാവിനെ അവതരിപ്പിക്കുന്നു. അതിനാൽ വ്യക്തിപരമായ പ്രവർത്തനം ഭാഷയിൽ നിലനിർത്തുന്നു; എന്നാൽ ഈ വാക്യം പറയുന്നതിലപ്പുറം വിശദമായ സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളം; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അതേസമയം ഗൗരവവും തിരുവെഴുത്തിന് യോജിച്ച മാന്യതയും പുലർത്തുന്നതുമായ ശൈലി. മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന πλὴν ὅτι എന്ന പ്രയോഗത്തിന്റെ അപവാദാത്മക ഭാവം ‘എന്നാൽ ഒന്നുമാത്രം’ എന്ന രൂപത്തിൽ നിലനിർത്തി. പദക്രമം മലയാളത്തിലെ സ്വാഭാവിക വിവരക്രമത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
