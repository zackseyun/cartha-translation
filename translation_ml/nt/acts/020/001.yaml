source:
  edition: SBLGNT
  text: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον ⸀μεταπεμψάμενος ὁ Παῦλος τοὺς μαθητὰς καὶ ⸀παρακαλέσας, ἀσπασάμενος ἐξῆλθεν ⸀πορεύεσθαι ⸀εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: ml
  text: കലഹം ശമിച്ചശേഷം, പൗലോസ് ശിഷ്യന്മാരെ ആളയച്ചു വരുത്തി. അവരെ പ്രോത്സാഹിപ്പിക്കുകയും അവരോടു യാത്രപറയുകയും ചെയ്തിട്ട്[a], അദ്ദേഹം മക്കെദോന്യയിലേക്കു പോകാൻ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ അഭിവാദ്യം ചെയ്തിട്ട്.” ഗ്രീക്ക് പദത്തിന് അഭിവാദ്യം ചെയ്യുക എന്നും, വിടവാങ്ങുന്ന സന്ദർഭത്തിൽ യാത്രപറയുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι τὸν θόρυβον
  choice: കലഹം ശമിച്ചശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive മുൻസംഭവം അവസാനിച്ചതിനു ശേഷമുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു. എഫെസൊസിലെ ജനക്ഷോഭത്തിന്റെ പശ്ചാത്തലത്തിൽ θόρυβος എന്നതിന് ‘കലഹം’ സ്വാഭാവികവും ശക്തവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: μεταπεμψάμενος
  choice: ആളയച്ചു വരുത്തി
  rationale: ഈ middle participle, ഒരാളെ തന്റെ അടുക്കലേക്കു വിളിച്ചുവരുത്താൻ ആളയയ്ക്കുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ ‘ആളയച്ചു വരുത്തി’ ആ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοὺς μαθητὰς
  choice: ശിഷ്യന്മാരെ
  rationale: പ്രവൃത്തികളിൽ μαθηταί യേശുവിന്റെ അനുയായികളെ സൂചിപ്പിക്കുന്ന ലൂക്കോസിന്റെ പതിവുപദമാണ്; ‘ശിഷ്യന്മാർ’ അതിന്റെ പ്രത്യേകത കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: παρακαλέσας
  choice: പ്രോത്സാഹിപ്പിക്കുകയും
  rationale: παρακαλέω എന്നതിന് പ്രബോധിപ്പിക്കുക, ആശ്വസിപ്പിക്കുക, ധൈര്യപ്പെടുത്തുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്. കലഹത്തിനുശേഷമുള്ള വിടവാങ്ങൽസന്ദർഭത്തിൽ ‘പ്രോത്സാഹിപ്പിക്കുക’ ഈ വ്യാപ്തിയെ അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀσπασάμενος
  choice: അവരോടു യാത്രപറയുകയും ചെയ്തിട്ട്
  rationale: ἀσπάζομαι സാധാരണയായി അഭിവാദ്യം ചെയ്യുക എന്നാണെങ്കിലും, പുറപ്പെടുന്ന സന്ദർഭത്തിൽ വിടവാങ്ങുക എന്ന ഭാവവും വഹിക്കാം. ഇവിടെ യാത്രയുടെ തൊട്ടുമുമ്പുള്ള പ്രവൃത്തിയായതിനാൽ ‘യാത്രപറയുക’ സന്ദർഭോചിതമാണ്; മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν πορεύεσθαι εἰς Μακεδονίαν
  choice: മക്കെദോന്യയിലേക്കു പോകാൻ പുറപ്പെട്ടു
  rationale: ἐξῆλθεν യാത്രാവിവരണത്തിൽ പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള infinitive യാത്രയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ഈ ഘടന ലളിതവും കൃത്യവുമാണ്.
