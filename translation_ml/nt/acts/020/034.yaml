  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοὶ γινώσκετε ὅτι ταῖς χρείαις μου καὶ τοῖς οὖσι μετ’ ἐμοῦ ὑπηρέτησαν αἱ χεῖρες αὗται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/034.yaml
  text: You yourselves know that these hands served my needs and the needs of those who were with me[a].
translation:
  language: ml
  text: എന്റെ ആവശ്യങ്ങളും എന്നോടുകൂടെ ഉണ്ടായിരുന്നവരുടെയും ആവശ്യങ്ങളും നിറവേറ്റിയത് ഈ കൈകൾതന്നെയാണെന്ന് നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ കൈകൾതന്നെ എന്റെ ആവശ്യങ്ങൾക്കും എന്നോടുകൂടെ ഉണ്ടായിരുന്നവരുടെയും ആവശ്യങ്ങൾക്കും വേണ്ടതു നൽകി.’ ഗ്രീക്ക് ക്രിയ പ്രായോഗിക സേവനത്തിലൂടെ ഭൗതിക ആവശ്യങ്ങൾക്കുള്ള സഹായമോ പിന്തുണയോ നൽകുന്നതിനെ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: നിങ്ങൾതന്നെ
  rationale: ക്രിയയോടൊപ്പം വന്നിരിക്കുന്ന സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: γινώσκετε
  choice: അറിയുന്നുവല്ലോ
  rationale: ശ്രോതാക്കൾക്ക് പൗലോസിന്റെ പ്രവർത്തനരീതി നേരിട്ട് അറിയാമെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ταῖς χρείαις μου
  choice: എന്റെ ആവശ്യങ്ങൾക്കും
  rationale: χρεία ഇവിടെ പ്രായോഗികവും ഭൗതികവുമായ ആവശ്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῖς οὖσι μετ’ ἐμοῦ
  choice: എന്നോടുകൂടെ ഉണ്ടായിരുന്നവരുടെ ആവശ്യങ്ങൾക്കും
  rationale: കൂടെ ഉണ്ടായിരുന്നവരെ ബന്ധത്തിന്റെ സ്വഭാവം അധികമായി നിർവചിക്കാതെ സൂചിപ്പിക്കുകയും, സമാന്തര ദത്തിവ് പ്രയോഗം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπηρέτησαν
  choice: അധ്വാനിച്ചു
  rationale: ‘ഈ കൈകൾ’ എന്ന കർത്താവിനോടൊപ്പം, ആവശ്യങ്ങൾ നിറവേറ്റിയ പ്രായോഗിക സേവനത്തെയും കൈവേലയെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥത്തിലുള്ള ‘സേവിച്ചു’ മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമാണ്.
- source_word: αἱ χεῖρες αὗται
  choice: ഈ കൈകൾതന്നെ
  rationale: ചൂണ്ടിക്കാണിക്കുന്നതിലെ ഊന്നൽ നിലനിർത്തുകയും പൗലോസ് തന്റെ കൈകളെ കാണിച്ചുകൊണ്ടുള്ള സജീവമായ പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
