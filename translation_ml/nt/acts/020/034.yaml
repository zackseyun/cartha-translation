  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അധ്വാനിച്ചു’ എന്നത് കൈവേലയുടെ സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും, ‘വേണ്ടതു നൽകി’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
