translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രപദവിയുടെ കൃത്യതയും വായനാസൗകര്യവും ഒരുമിച്ച് നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘സൈനികാധിപൻ’ ഉപയോഗിച്ച് കൂടുതൽ വിശദാംശം അടിക്കുറിപ്പിൽ നൽകി. മൂലത്തിലെ ‘റോമക്കാരൻ’ എന്ന സംക്ഷിപ്തത നിലനിർത്തി അതിന്റെ നിയമപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
