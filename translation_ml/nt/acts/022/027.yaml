source:
  edition: SBLGNT
  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: ml
  text: 'അപ്പോൾ സൈനികാധിപൻ[a] അടുത്തുവന്ന് അവനോടു ചോദിച്ചു: “എന്നോടു പറയൂ, നീ റോമക്കാരനാണോ[b]?” അവൻ പറഞ്ഞു: “അതെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സൈനിക കമാൻഡർ.” χιλίαρχος എന്ന ഗ്രീക്കുപദം ഒരു റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ—സാധാരണയായി ഒരു കോഹോർട്ടിന്റെ ചുമതലയുള്ള ട്രിബ്യൂണിനെ—സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “റോമക്കാരൻ” എന്നത് ചുറ്റുമുള്ള സന്ദർഭം വ്യക്തമാക്കുന്നതുപോലെ, നിയമപരമായി റോമൻ പൗരത്വമുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: അടുത്തുവന്ന്
  rationale: προσέρχομαι എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം സംസാരിക്കുന്നതിനുമുമ്പ് ഉദ്യോഗസ്ഥൻ പൗലോസിന്റെ അടുത്തേക്കു വന്നതായി സൂചിപ്പിക്കുന്നു; ‘അടുത്തുവന്ന്’ ഈ ചലനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്. ‘അപ്പോൾ’ ആ കഥാഗതിയെ സ്വാഭാവികമായി നൽകുന്നു; രണ്ടാമത്തെ δέ വാക്യപ്രവാഹത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ ഒരു കോഹോർട്ടിന്റെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെയാണ് ഈ പദം ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സൈനികാധിപൻ’ ചരിത്രപരമായ പദവിയുടെ സൈനികസ്വഭാവം വ്യക്തമാക്കുകയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു ചോദിച്ചു
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അവനോടു പറഞ്ഞു’ എന്നാണെങ്കിലും ഉടൻ ഒരു ചോദ്യം വരുന്നതിനാൽ മലയാളത്തിൽ ‘അവനോടു ചോദിച്ചു’ എന്നത് സ്വാഭാവികമായ സംഭാഷണരൂപമാണ്; αὐτῷ എന്ന പരോക്ഷ കർമവും നിലനിർത്തുന്നു.
- source_word: Λέγε μοι
  choice: എന്നോടു പറയൂ
  rationale: ആജ്ഞാരൂപവും ദത്തിവിലുള്ള സർവനാമവും മലയാളത്തിൽ നേരിട്ട്, സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: σὺ
  choice: നീ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം പ്രത്യേകം ചേർത്തിരിക്കുന്നത് നേരിയ ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ ‘നീ’ തുറന്നുപറയുന്നത് ആ ഊന്നൽ അനാവശ്യമായി വർധിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ῥωμαῖος
  choice: റോമക്കാരൻ
  rationale: വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു; അതിനാൽ ‘റോമക്കാരൻ’ രൂപപരമായി അടുത്തതാണ്. സന്ദർഭത്തിൽ ഇത് നിയമപരമായ റോമൻ പൗരത്വത്തെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ναί
  choice: അതെ
  rationale: ലളിതമായ സമ്മതവാക്കിന് ഏറ്റവും നേരിട്ടും സ്വാഭാവികവുമായ മലയാള സമാനപദമാണിത്; മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
