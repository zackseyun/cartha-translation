id: ACT.22.7
reference: Acts 22:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔπεσά τε εἰς τὸ ἔδαφος καὶ ἤκουσα φωνῆς λεγούσης μοι· Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: ml
  text: 'ഞാൻ നിലത്തേക്കു വീണു; എന്നോടു ഇങ്ങനെ പറയുന്ന ഒരു ശബ്ദം ഞാൻ കേട്ടു: ‘ശൗലേ, ശൗലേ, നീ എന്തിന് എന്നെ പീഡിപ്പിക്കുന്നു?’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: ഞാൻ ... വീണു
  rationale: πίπτω എന്ന ക്രിയയുടെ aorist active indicative ഒന്നാംപുരുഷ ഏകവചനരൂപം; പൂർത്തിയായ ഭൂതകാലപ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τε
  choice: '[പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: ഈ enclitic മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യക്രമവും തുടർന്നുള്ള ‘അപ്പോൾ’ എന്ന സ്വാഭാവിക ബന്ധകവും അതിന്റെ പ്രവാഹം മതിയായവിധം നൽകുന്നു.
- source_word: εἰς τὸ ἔδαφος
  choice: നിലത്തേക്കു
  rationale: വീഴ്ചയുടെ ദിശയും ലക്ഷ്യവും വ്യക്തമാക്കുന്ന εἰς എന്നതിനെ സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἤκουσα
  choice: ഞാൻ കേട്ടു
  rationale: ἀκούω എന്ന ക്രിയയുടെ aorist active indicative ഒന്നാംപുരുഷ ഏകവചനരൂപം; ലളിതമായ ഭൂതകാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: φωνῆς
  choice: ഒരു ശബ്ദം
  rationale: ἀκούω-വിനോടൊപ്പമുള്ള genitive രൂപം മലയാളത്തിൽ സ്വാഭാവികമായ കർമമായി നൽകുന്നു; തുടർന്ന് വാക്കുകൾ ഉച്ചരിക്കുന്നതിനാൽ ‘ശബ്ദം’ യോജിക്കുന്നു.
- source_word: λεγούσης μοι
  choice: എന്നോട് ഇങ്ങനെ പറയുന്ന
  rationale: φωνῆς-നെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന participle-ന്റെ സമകാലിക പ്രവർത്തനവും μοι എന്ന ദത്തിവിന്റെ വ്യക്തിപരമായ അഭിസംബോധനയും നിലനിർത്തുന്നു; ‘ഇങ്ങനെ’ തുടർന്ന് വരുന്ന നേരിട്ടുള്ള വാക്കുകളിലേക്കു സ്വാഭാവികമായി നയിക്കുന്നു.
- source_word: Σαοὺλ Σαούλ
  choice: ശൗലേ, ശൗലേ
  rationale: പേരിന്റെ അഭിസംബോധനാരൂപവും ഊന്നൽ നൽകുന്ന ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: τί
  choice: എന്തിന്
  rationale: പ്രവൃത്തിയുടെ കാരണം ചോദിക്കുന്ന τί-യുടെ സന്ദർഭോചിതവും സാധാരണവുമായ മലയാളരൂപം.
- source_word: με
  choice: എന്നെ
  rationale: സംസാരിക്കുന്നയാളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: διώκεις
  choice: നീ ... പീഡിപ്പിക്കുന്നു
  rationale: διώκω എന്ന വർത്തമാന active indicative രണ്ടാംപുരുഷ ഏകവചനരൂപം; ഈ സന്ദർഭത്തിലെ ശത്രുതാപരമായ തുടർച്ചയായ പ്രവർത്തനത്തിന് ‘പീഡിപ്പിക്കുന്നു’ കൃത്യമാണ്.
theological_decisions:
- issue: വിശ്വാസികൾക്കെതിരായ ശൗലിന്റെ പ്രവൃത്തികളോടുള്ള സംസാരിക്കുന്നയാളുടെ ബന്ധം
  choice: ‘എന്നെ’ എന്ന നേരിട്ടുള്ള ഒന്നാംപുരുഷ പരാമർശം വിശദീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ‘എന്റെ ജനത്തെ’ അല്ലെങ്കിൽ ‘എന്റെ അനുയായികളെ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം.
  rationale: ശൗൽ വിശ്വാസികളെ പീഡിപ്പിക്കുന്നതിനെ സംസാരിക്കുന്നയാൾ തന്നെ പീഡിപ്പിക്കുന്നതായി തിരിച്ചറിയുന്നതിലാണ് വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തി; അതിനെ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ ഉള്ളതുപോലെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. നേരിട്ടുള്ള അഭിസംബോധനയും ആവർത്തനവും മൂലപാഠത്തോടനുസരിച്ച് നിലനിർത്തി; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
