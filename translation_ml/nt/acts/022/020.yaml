id: ACT.22.20
reference: Acts 22:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: ml
  text: നിന്റെ സാക്ഷിയായ സ്തെഫാനൊസിന്റെ രക്തം ചൊരിയപ്പെട്ടുകൊണ്ടിരുന്നപ്പോൾ,[a] ഞാൻതന്നെ അവിടെ നിന്നുകൊണ്ട് സമ്മതം പ്രകടിപ്പിക്കുകയും അവനെ കൊന്നവരുടെ മേലങ്കികൾ കാത്തുസൂക്ഷിക്കുകയും ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “രക്തസാക്ഷിയായ.” ഗ്രീക്ക് പദത്തിന് “സാക്ഷി” എന്ന് അർഥമുണ്ട്; ക്രൈസ്തവപ്രയോഗത്തിൽ, തന്റെ സാക്ഷ്യം നിമിത്തം മരിക്കുന്ന ഒരാളെ പ്രത്യേകം സൂചിപ്പിക്കാനും ഈ പദം പിന്നീട് ഉപയോഗിക്കപ്പെട്ടു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: ചൊരിയപ്പെട്ടുകൊണ്ടിരുന്നപ്പോൾ
  rationale: അപൂർണ ഭൂതകാല കർമണിപ്രയോഗത്തിന്റെ തുടർച്ചയായ ഭാവവും രക്തം ഒഴുക്കപ്പെടുന്നതെന്ന സജീവ രൂപകവും നിലനിർത്തുന്നു.
- source_word: αἷμα
  choice: രക്തം
  rationale: നേരിട്ടും സ്വാഭാവികവുമായ തത്തുല്യപദം.
- source_word: μάρτυρός
  choice: സാക്ഷി
  rationale: ഇവിടെ ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘സാക്ഷി’ നിലനിർത്തുന്നു; പിൽക്കാല ക്രൈസ്തവപ്രയോഗത്തിലെ ‘രക്തസാക്ഷി’ എന്ന അർഥബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐφεστὼς
  choice: അവിടെ നിന്നുകൊണ്ട്
  rationale: സംഭവസ്ഥലത്ത് സമീപം സന്നിഹിതനായി നിന്നിരുന്നുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: συνευδοκῶν
  choice: അതിന് സമ്മതം നൽകുകയും
  rationale: വെറും സാന്നിധ്യമല്ല, കൊലപാതകത്തോടുള്ള സജീവ സമ്മതം/അംഗീകാരം വ്യക്തമാക്കുന്നു.
- source_word: φυλάσσων
  choice: കാത്തുകൊണ്ടിരിക്കുകയും
  rationale: വസ്ത്രങ്ങൾ കാവൽ നോക്കുക/സൂക്ഷിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: ἱμάτια
  choice: മേലങ്കികൾ
  rationale: കല്ലെറിയുന്നതിനായി മാറ്റിവെച്ച പുറംവസ്ത്രങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന സന്ദർഭത്തിന് യോജിച്ച പ്രത്യേക പദം.
- source_word: ἀναιρούντων
  choice: കൊന്നവരുടെ
  rationale: ഈ സന്ദർഭത്തിലെ ‘കൊല്ലുക, വധിക്കുക’ എന്ന അർഥം അനാവശ്യമായ അധിക ധാർമിക വിലയിരുത്തലില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτὸς
  choice: ഞാനും
  rationale: καὶ αὐτός ചേർന്ന് പൗലൊസും വ്യക്തിപരമായി അവിടെ പങ്കാളിയായിരുന്നുവെന്ന ഊന്നൽ നൽകുന്നു; മലയാളത്തിൽ ‘ഞാനും’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സ്തെഫാനൊസിനെ സൂചിപ്പിക്കുന്ന μάρτυς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സാക്ഷി
  alternative: രക്തസാക്ഷി
  rationale: മൂലപദത്തിന്റെ പ്രാഥമിക അർഥം ‘സാക്ഷി’ എന്നാണ്. സ്തെഫാനൊസിന്റെ മരണസന്ദർഭം കാരണം ‘രക്തസാക്ഷി’ എന്ന പിൽക്കാല ക്രൈസ്തവ അർഥബന്ധം പ്രസക്തമാണെങ്കിലും, അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർച്ചയായ പ്രവൃത്തികളെ ‘-കൊണ്ടിരുന്ന’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. ‘മേലങ്കികൾ’ എന്നത് പൊതുവായ ‘വസ്ത്രങ്ങൾ’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
