translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്ക് വാക്യഘടനയുടെ ക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ കൃത്രിമമായ കൃദന്തഭാരം ഒഴിവാക്കി. ഒരേ മൂലക്രിയയുടെ രണ്ടു പ്രയോഗങ്ങളിലും ‘വീണ്ടും കാഴ്ച ലഭിക്കുക’ എന്ന ആവർത്തനം ബോധപൂർവം സൂക്ഷിച്ചു.
