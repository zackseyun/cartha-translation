source:
  edition: SBLGNT
  text: ἐλθὼν πρὸς ⸀ἐμὲ καὶ ἐπιστὰς εἶπέν μοι· Σαοὺλ ἀδελφέ, ἀνάβλεψον· κἀγὼ αὐτῇ τῇ ὥρᾳ ἀνέβλεψα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: ml
  text: 'അവൻ എന്റെ അടുക്കൽ വന്ന് അരികിൽ നിന്നുകൊണ്ട് എന്നോട് പറഞ്ഞു: “സഹോദരനായ ശൗലേ, നിനക്കു വീണ്ടും കാഴ്ച ലഭിക്കട്ടെ[a].” ആ നാഴികയിൽത്തന്നെ എനിക്കു വീണ്ടും കാഴ്ച ലഭിച്ചു; ഞാൻ അവനെ നോക്കി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ രണ്ടുതവണ വരുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വീണ്ടും കാണുക’ അല്ലെങ്കിൽ ‘കാഴ്ച തിരിച്ചുകിട്ടുക’ എന്നും, മറ്റു സന്ദർഭങ്ങളിൽ ‘മേലോട്ടു നോക്കുക’ എന്നും അർഥമാകാം. ഇവിടെ അന്ധത മാറി കാഴ്ച പുനഃസ്ഥാപിക്കപ്പെടുന്നതാണ് സന്ദർഭം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: അവൻ എന്റെ അടുക്കൽ വന്ന്
  rationale: പ്രός സഹിതമുള്ള ചലനത്തിന്റെ ദിശ നിലനിർത്തിക്കൊണ്ട്, ഗ്രീക്ക് ഭൂതകാല കൃദന്തത്തെ സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιστάς
  choice: അരികിൽ നിന്നുകൊണ്ട്
  rationale: അവൻ ശൗലിന്റെ സമീപത്ത് നിലകൊണ്ടുവെന്ന സ്ഥലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Σαοὺλ ἀδελφέ
  choice: സഹോദരനായ ശൗലേ
  rationale: സംബോധനരൂപവും വിശ്വാസ/ജനസമൂഹബന്ധം സൂചിപ്പിക്കുന്ന ἀδελφέ എന്ന പദവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘സഹോദരാ, ശൗലേ’ എന്നതിനെക്കാൾ ഒഴുക്കുള്ള പ്രയോഗം.
- source_word: ἀνάβλεψον
  choice: നിനക്കു വീണ്ടും കാഴ്ച ലഭിക്കട്ടെ
  rationale: അന്ധതയും സൗഖ്യവും സംബന്ധിച്ച സന്ദർഭത്തിൽ ‘മേലോട്ടു നോക്കുക’ എന്നതല്ല, കാഴ്ച പുനഃസ്ഥാപിക്കപ്പെടുക എന്ന അർഥമാണ് യോജിച്ചത്. ആജ്ഞാരൂപത്തിന്റെ പ്രവർത്തകശക്തി മലയാളത്തിലെ ആശംസാത്മക ആജ്ഞാപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ആ നാഴികയിൽത്തന്നെ
  rationale: സംഭവം അതേ സമയത്തുതന്നെ നടന്നുവെന്ന ഗ്രീക്കിലെ കൃത്യമായ കാലഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: κἀγὼ ... ἀνέβλεψα
  choice: എനിക്കു വീണ്ടും കാഴ്ച ലഭിച്ചു
  rationale: ആദ്യ ἀναβλέπω രൂപത്തോടുള്ള പദാർഥബന്ധം നിലനിർത്തുകയും സൗഖ്യസന്ദർഭത്തിലെ കാഴ്ചയുടെ പുനഃസ്ഥാപനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς αὐτόν
  choice: ഞാൻ അവനെ നോക്കി
  rationale: കാഴ്ച ലഭിച്ചതിന് പിന്നാലെ ദൃഷ്ടി അനന്യാസിലേക്കു തിരിച്ചതെന്ന ദിശാസൂചന വ്യക്തമാക്കുന്നു.
