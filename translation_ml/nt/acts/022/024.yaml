translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടായി വിഭജിച്ചു. രണ്ടാം വാക്യത്തിലെ ആവർത്തിച്ചുള്ള ‘പൗലോസ്’ സർവനാമസംബന്ധമായ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു; ‘ചാട്ടവാറുകൊണ്ട് അടിച്ച് ചോദ്യംചെയ്യുക’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ ചോദ്യംചെയ്യലും പീഡനരീതിയും മറച്ചുവയ്ക്കുന്നില്ല.
