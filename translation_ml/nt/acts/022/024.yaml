id: ACT.22.24
reference: Acts 22:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: ml
  text: സൈനികമേധാവി പൗലോസിനെ സൈനികപ്പാളയത്തിലേക്ക്[a] കൊണ്ടുപോകാൻ കൽപ്പിച്ചു; ജനങ്ങൾ പൗലോസിനെതിരെ ഇങ്ങനെ ആർത്തുവിളിച്ചതിന്റെ കാരണം കണ്ടെത്തേണ്ടതിന്, ചാട്ടവാറടികളാൽ അവനെ ചോദ്യംചെയ്യാനും[b] അദ്ദേഹം നിർദേശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൈനികകേന്ദ്രത്തിലേക്ക്,’ ‘പാളയത്തിലേക്ക്,’ അല്ലെങ്കിൽ ‘കോട്ടയിലേക്ക്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഈ പദം യെരൂശലേമിലെ റോമൻ സൈനികരുടെ താമസവും കാവലും ഉണ്ടായിരുന്ന സൈനികകേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ചാട്ടവാറടികളാൽ അവനെ പരിശോധിക്കണം.’ ഗ്രീക്കിൽ ചോദ്യംചെയ്യൽ/പരിശോധനയ്ക്കുള്ള പദത്തോടൊപ്പം അതിന്റെ മാർഗമായി ചാട്ടവാറടിയും വ്യക്തമായി പറഞ്ഞിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: സൈനികമേധാവി
  rationale: റോമൻ സൈന്യത്തിലെ ഉയർന്ന ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്. ചരിത്രപരമായ പദവിയുടെ കൃത്യമായ മലയാള സമാനപദം സാധാരണ വായനക്കാർക്ക് അപരിചിതമായതിനാൽ, സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: παρεμβολή
  choice: സൈനികപ്പാളയം
  rationale: യെരൂശലേമിലെ റോമൻ സൈനികരുടെ താമസ-കാവൽകേന്ദ്രമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘പാളയം’ എന്ന അടിസ്ഥാന അർഥം നിലനിർത്തിക്കൊണ്ട് സൈനികസന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: εἰσάγεσθαι
  choice: കൊണ്ടുപോകാൻ
  rationale: മറ്റുള്ളവർ പൗലോസിനെ അകത്തേക്കു കൊണ്ടുപോകണമെന്ന കർമണി ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: μάστιξιν ἀνετάζεσθαι
  choice: ചാട്ടവാറുകൊണ്ട് അടിച്ച് ... ചോദ്യംചെയ്യണം
  rationale: ἀνετάζω എന്ന ചോദ്യംചെയ്യൽ ആശയവും μάστιξιν സൂചിപ്പിക്കുന്ന അതിന്റെ ക്രൂരമായ മാർഗവും ഒരുമിച്ച് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιγνῷ
  choice: കണ്ടെത്താൻ
  rationale: സൈനികമേധാവി കാരണമന്വേഷിച്ചു മനസ്സിലാക്കുക എന്ന ഉദ്ദേശ്യത്തെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δι’ ἣν αἰτίαν
  choice: എന്തുകൊണ്ടാണ്
  rationale: കാരണമോ അടിസ്ഥാനമോ അന്വേഷിക്കുന്ന പ്രയോഗം; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഔപചാരിക കുറ്റാരോപണം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπεφώνουν αὐτῷ
  choice: പൗലോസിനെതിരെ ... ആർത്തുവിളിച്ചത്
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ഉച്ചത്തിലുള്ള ശത്രുതാപരമായ വിളി എന്ന അപൂർണഭൂതകാല ക്രിയയുടെ ഭാവം നൽകുന്നു.
