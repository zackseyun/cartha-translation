id: ACT.22.9
reference: Acts 22:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: ml
  text: എന്നോടുകൂടെ ഉണ്ടായിരുന്നവർ വെളിച്ചം കണ്ടു; എന്നാൽ എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവന്റെ ശബ്ദം അവർ കേട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ശബ്ദം അവർ മനസ്സിലാക്കിയില്ല.” പ്രവൃത്തികൾ 9:7 താരതമ്യം ചെയ്യുക; അവിടെ പൗലോസിനൊപ്പമുണ്ടായിരുന്നവർ ശബ്ദം കേട്ടതായി പറയുന്നു. അവർ ഒരു ശബ്ദം കേട്ടെങ്കിലും സംസാരിച്ചവന്റെ വാക്കുകൾ മനസ്സിലാക്കിയില്ല എന്നായിരിക്കാം ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: എന്നോടുകൂടെ ഉണ്ടായിരുന്നവർ
  rationale: ആർട്ടിക്കിൾ ചേർന്ന കൃദന്തരൂപത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘പുരുഷന്മാർ’ എന്നത് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: τὸ μὲν φῶς
  choice: വെളിച്ചം
  rationale: φῶς എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു. μέν...δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ വഴി പ്രകടമാക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘തിളക്കമുള്ള’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: ἐθεάσαντο
  choice: കണ്ടു
  rationale: θεάομαι എന്നതിന്റെ സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ അർത്ഥം.
- source_word: τὴν δὲ φωνὴν
  choice: ശബ്ദം
  rationale: φωνή ശബ്ദത്തെയോ ശബ്ദസ്വരത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ സംസാരിക്കുന്ന വ്യക്തിയുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നതിനാൽ ‘ശബ്ദം’ വ്യക്തിയുടെ ശബ്ദം എന്ന സ്വാഭാവിക അർത്ഥം നൽകുകയും മൂലത്തിലെ അർത്ഥവ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἤκουσαν
  choice: കേട്ടില്ല
  rationale: ἀκούω എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം. ‘മനസ്സിലാക്കിയില്ല’ എന്ന വ്യാഖ്യാനസാധ്യത മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ λαλοῦντός μοι
  choice: എന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്നവന്റെ
  rationale: വർത്തമാന കൃദന്തം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തി ‘സംസാരിച്ചുകൊണ്ടിരുന്ന’ എന്ന് നിലനിർത്തുന്നു; ‘ശബ്ദം’ എന്നതിനോടുള്ള ജനിറ്റീവ് ബന്ധവും വ്യക്തമാണ്.
theological_decisions:
- issue: പൗലോസിനൊപ്പമുണ്ടായിരുന്നവർ ശബ്ദം കേട്ടോ എന്ന കാര്യത്തിൽ പ്രവൃത്തികൾ 9:7-നോടു തോന്നാവുന്ന സംഘർഷം
  choice: മുഖ്യവാചകത്തിൽ ‘ശബ്ദം അവർ കേട്ടില്ല’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി, വ്യത്യസ്ത അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ‘ശബ്ദം അവർ മനസ്സിലാക്കിയില്ല’ അല്ലെങ്കിൽ ‘വാക്കുകൾ അവർ ഗ്രഹിച്ചില്ല.’
  rationale: ഇവിടെ ἀκούω എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം ‘കേൾക്കുക’ എന്നതാണ്; എന്നാൽ അതിന് സന്ദർഭത്തിൽ ‘ഗ്രഹിക്കുക’ എന്ന അർത്ഥഛായയും ഉണ്ടാകാം. പ്രവൃത്തികൾ 9:7-ലെ വിവരണവുമായി യോജിപ്പിക്കാൻ മുഖ്യവാചകം വ്യാഖ്യാനപരമായി മാറ്റാതെ, യഥാർഥമായ പാഠസംഘർഷവും അർത്ഥസാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. അനാവശ്യമായ കാലസൂചകമോ ‘പുരുഷന്മാർ’ എന്ന കൂട്ടിച്ചേർക്കലോ ഒഴിവാക്കി. വൈരുധ്യം വ്യക്തമാക്കാൻ അർധവിരാമവും ‘എന്നാൽ’ എന്ന ബന്ധകവും ഉപയോഗിച്ചു.
