id: ACT.22.2
reference: Acts 22:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: ml
  text: 'എന്നാൽ, അവൻ അവരോടു എബ്രായ ഭാഷയിൽ[a] സംസാരിക്കുന്നതു കേട്ടപ്പോൾ, അവർ കൂടുതൽ നിശ്ശബ്ദത പാലിച്ചു. അവൻ പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അരമായ ഭാഷയിൽ’ ആയിരിക്കാം; ഗ്രീക്കിൽ ‘എബ്രായ ഭാഷയിൽ’ എന്നാണ്. ഈ സന്ദർഭത്തിൽ അത് യെഹൂദ്യയിലെ പ്രാദേശിക സെമിറ്റിക് സംസാരഭാഷയെ സൂചിപ്പിച്ചിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയുടെ സാഹചര്യം സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള ലഘുവായ വഴിത്തിരിവും ജനക്കൂട്ടത്തിന്റെ പ്രതികരണത്തിലെ മാറ്റവും അടയാളപ്പെടുത്തുന്നു.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: എബ്രായഭാഷയിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് ‘എബ്രായ ഭാഷ/ഭാഷാഭേദം’ എന്നു പറയുന്നു; അരമായയായിരിക്കാമെന്ന ചരിത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: προσεφώνει αὐτοῖς
  choice: താൻ അവരോടു ... സംസാരിക്കുന്നതു
  rationale: ജനക്കൂട്ടത്തോടു നേരിട്ട് തുടർന്നുകൊണ്ടിരുന്ന സംസാരത്തെ imperfect ക്രിയയ്ക്കനുസരിച്ച് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: അവർ കൂടുതൽ നിശ്ശബ്ദരായി
  rationale: അക്ഷരാർഥത്തിൽ ‘കൂടുതൽ നിശ്ശബ്ദത നൽകി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; താരതമ്യബലം സംരക്ഷിക്കുന്നു.
- source_word: καὶ φησίν
  choice: 'അവൻ പറഞ്ഞു:'
  rationale: ചരിത്രവർത്തമാനത്തെ മലയാള ആഖ്യാനശൈലിക്ക് യോജിച്ച ഭൂതകാലത്തിൽ നൽകുന്നു; തുടർന്നുവരുന്ന പ്രസംഗത്തെ ദ്വിബിന്ദു സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘എബ്രായഭാഷ’ എന്നതിന്റെ സൂചിതഭാഷ
  choice: മുഖ്യപാഠത്തിൽ ‘എബ്രായഭാഷ’ നിലനിർത്തി
  alternative: യൂദായിലെ പ്രാദേശിക സെമിറ്റിക് സംസാരഭാഷയായ അരമായയെ ഉദ്ദേശിച്ചതായി നേരിട്ട് വിവർത്തനം ചെയ്യുക
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘എബ്രായ’ എന്നു പറയുന്നതിനാൽ മൂലഭാഷയ്ക്ക് മുൻഗണന നൽകി അതു മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ അരമായയായിരിക്കാമെന്ന യഥാർഥ ഭാഷാചരിത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സംസാരിക്കുന്നതു’ എന്ന രൂപം ongoing imperfect-ന്റെ ഭാവം നിലനിർത്തുന്നു; ‘നിശ്ശബ്ദരായി’ എന്നത് ഗ്രീക്ക് idiom ലളിതമായി പകരുന്നു.
