id: ACT.22.16
reference: Acts 22:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: ml
  text: ഇനി നീ എന്തിനാണ് താമസിക്കുന്നത്?[a] എഴുന്നേറ്റ് സ്നാനം ഏൽക്കുക; അവന്റെ നാമം വിളിച്ചപേക്ഷിച്ച്[b] നിന്റെ പാപങ്ങൾ കഴുകിക്കളയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘ഇനി നീ എന്തിനാണ് വൈകിക്കുന്നത്?’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് കൃതന്തരൂപം ‘അവന്റെ നാമം വിളിച്ചപേക്ഷിച്ചുകൊണ്ട്’ എന്നോ ‘അവന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്നതിലൂടെ’ എന്നോ കൂടുതൽ വ്യക്തമായി മനസ്സിലാക്കാം; മുഖ്യപരിഭാഷ ഈ ബന്ധത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: ഇനി നീ എന്തിനാണ് താമസിക്കുന്നത്?
  rationale: ചോദ്യത്തോടുകൂടിയ μέλλω ഇവിടെ ഭാവി ഉദ്ദേശ്യം ചോദിക്കുന്നതിനെക്കാൾ താമസിക്കരുതെന്ന അടിയന്തരമായ ശാസനയാണ് സൂചിപ്പിക്കുന്നത്. ഈ പരിഭാഷ ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: ഈ ഭൂതകാല കൃതന്തം തുടർന്നുവരുന്ന ആജ്ഞകളോടൊപ്പമുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘എഴുന്നേറ്റ്’ എന്നത് ഗ്രീക്ക് ഘടനയും അടിയന്തരതയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: βάπτισαι
  choice: സ്നാനം ഏൽക്കുക
  rationale: βαπτίζω എന്ന ക്രിയയുടെ മധ്യമപ്രയോഗത്തിലുള്ള ആജ്ഞാരൂപം ഇവിടെ ഒരാൾ സ്നാനം സ്വീകരിക്കണമെന്ന കല്പനയാണ്. ‘സ്നാനം ഏൽക്കുക’ സഭാപാരമ്പര്യവിശേഷം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἀπόλουσαι
  choice: കഴുകിക്കളയുക
  rationale: ἀπολούομαι കഴുകി നീക്കുക, ശുദ്ധീകരിക്കുക എന്ന അർഥം വഹിക്കുന്നു. ‘പാപങ്ങൾ’ എന്ന കർമത്തോടൊപ്പം ‘കഴുകിക്കളയുക’ ഉറവിടത്തിലെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὰς ἁμαρτίας σου
  choice: നിന്റെ പാപങ്ങൾ
  rationale: ἁμαρτίαയുടെ സാധാരണ പുതിയനിയമ അർഥം വ്യാഖ്യാനവികാസമില്ലാതെ നേരിട്ട് നൽകുന്നു.
- source_word: ἐπικαλεσάμενος
  choice: വിളിച്ചപേക്ഷിച്ച്
  rationale: ഈ മധ്യമപ്രയോഗത്തിലുള്ള കൃതന്തം നാമം വിളിച്ച് സഹായം അഭ്യർഥിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിളിച്ചപേക്ഷിച്ച്’ എന്ന രൂപം അത് ഒപ്പമുള്ള സാഹചര്യമാണോ മാർഗമാണോ എന്ന് നിർബന്ധമായി തീർപ്പാക്കാതെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ നാമം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ സ്ഥാനപ്പേരല്ല, αὐτοῦ എന്ന സർവനാമമാണ് ഉള്ളത്. അതിനാൽ സന്ദർഭത്തിലെ സൂചിതവ്യക്തിയെ വ്യാഖ്യാനിച്ച് പേരിടാതെ ‘അവന്റെ നാമം’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: സ്നാനം, പാപങ്ങൾ കഴുകിക്കളയൽ, അവന്റെ നാമം വിളിച്ചപേക്ഷിക്കൽ എന്നിവ തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്കിലെ ആജ്ഞകളുടെ ക്രമവും കൃതന്തരൂപത്തിന്റെ തുറന്ന ബന്ധവും നിലനിർത്തി; അവന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്നത് ഒപ്പമുള്ള പ്രവൃത്തിയാണോ ഉപാധിയാണോ എന്ന് മുഖ്യവാക്യത്തിൽ തീർപ്പാക്കിയില്ല.
  alternative: സ്നാനം തന്നെയാണ് പാപങ്ങൾ കഴുകിക്കളയുന്നതിനുള്ള ഉപാധിയെന്ന് വ്യക്തമാക്കുക; അല്ലെങ്കിൽ നാമം വിളിച്ചപേക്ഷിക്കൽ മാത്രമാണ് അതിന്റെ ഉപാധിയെന്ന് വ്യക്തമാക്കുക; അല്ലെങ്കിൽ മുഴുവൻ പ്രയോഗത്തെയും ഏകീകൃതമായ പരിവർത്തന-പ്രവേശനക്രമമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ രണ്ട് ആജ്ഞകളും ഒരു കൃതന്തവും ഉണ്ട്; എന്നാൽ അവയുടെ കൃത്യമായ ദൈവശാസ്ത്രബന്ധം പരിഭാഷകൻ നിർബന്ധമായി നിർണയിക്കേണ്ടവിധം വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ സഭാവിഭാഗപരമായ നിഗമനം ചേർക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്ര പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘സ്നാനം ഏൽക്കുക’, ‘വിളിച്ചപേക്ഷിക്കുക’, ‘പാപങ്ങൾ കഴുകിക്കളയുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്. അർദ്ധവിരാമം ഗ്രീക്കിലെ ഏകോപിത ആജ്ഞകളെ വ്യക്തമായി വേർതിരിക്കുമ്പോഴും അവയുടെ ബന്ധം വിച്ഛേദിക്കുന്നില്ല.
