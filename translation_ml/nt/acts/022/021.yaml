id: ACT.22.21
reference: Acts 22:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρός με· Πορεύου, ὅτι ἐγὼ εἰς ἔθνη μακρὰν ἐξαποστελῶ σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞു: “പോകുക; കാരണം ഞാൻ നിന്നെ ദൂരെയുള്ള വിജാതീയരുടെ അടുക്കലേക്ക് അയയ്ക്കും.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൂരെയുള്ള ജനതകളുടെ അടുക്കലേക്ക്.”
    reason: ἔθνη പൊതുവേ ‘ജനതകൾ’ എന്നും, ഈ യഹൂദ-വിജാതീയ ദൗത്യസന്ദർഭത്തിൽ ‘വിജാതീയർ’ എന്നും അർഥമാക്കാം.
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: അവൻ എന്നോടു പറഞ്ഞു
  rationale: πρός + accusative സഹിതമുള്ള λέγω അഭിസംബോധന ചെയ്തുള്ള നേരിട്ടുള്ള വാക്കുകളെ അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനരൂപമാണിത്.
- source_word: Πορεύου
  choice: പോകുക
  rationale: πορεύομαι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ പോകാനോ പുറപ്പെടാനോ ഉള്ള കല്പനയാണ്; ‘പോകുക’ ലളിതവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ὅτι
  choice: കാരണം എന്ന അർഥം അർധവിരാമത്തിലൂടെ പ്രകടമാക്കി
  rationale: ὅτι കല്പനയുടെ കാരണം അവതരിപ്പിക്കുന്നു. ഉദ്ധരണിക്കുള്ളിലെ ‘പോകുക; ഞാൻ...’ എന്ന ഘടന മലയാളത്തിൽ കാരണബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എങ്കിലും ‘കാരണം’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം കർത്താവിന് ഊന്നൽ നൽകുന്നു; ‘ഞാൻ’ നിലനിർത്തുന്നത് അതു സംരക്ഷിക്കുന്നു.
- source_word: εἰς ἔθνη
  choice: ജനതകളുടെ അടുക്കലേക്ക്
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാന ബഹുവചന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ അത് യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ആ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μακρὰν
  choice: ദൂരെയുള്ള
  rationale: അയയ്ക്കപ്പെടുന്ന ജനതകളുടെ ഭൂമിശാസ്ത്രപരമായ അകലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐξαποστελῶ
  choice: അയയ്ക്കും
  rationale: ഭാവികാലത്തിലുള്ള ἐξαποστέλλω അയച്ചുവിടുന്നതിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ നിയോഗത്തിന്റെ ഭാവം നിലനിൽക്കുന്നതിനാൽ ‘അയയ്ക്കും’ മതിയാകുന്നു.
- source_word: σε
  choice: നിന്നെ
  rationale: ഏകവചന രണ്ടാംപുരുഷ കർമരൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തോലിക ദൗത്യസന്ദർഭത്തിലെ ἔθνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജനതകൾ
  alternative: വിജാതീയർ / യഹൂദരല്ലാത്തവർ
  rationale: ‘ജനതകൾ’ മൂലപദത്തിന്റെ വിശാലതയും ബഹുവചനരൂപവും സംരക്ഷിക്കുന്നു; പ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് യഹൂദരല്ലാത്ത ജനങ്ങളാണെന്ന ചരിത്ര-ദൈവശാസ്ത്രപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു, അതുവഴി അസലിലെ പദപരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ലാളിത്യവും മൂലത്തിലെ ഭാവികാലവും നിലനിർത്തി.
