  source_fidelity: പ്രധാനവാക്യം ഗ്രീക്ക് വാക്യഘടനയെയും അർഥത്തെയും പൊതുവേ വിശ്വസ്തമായി കൈമാറുന്നു. എന്നിരുന്നാലും, ἄχρι τούτου τοῦ λόγου എന്നതിലെ λόγος ഒരു ഒറ്റ ‘വാക്ക്’ അല്ല, പ്രസംഗത്തിലെ ഒരു നിർണായക പ്രസ്താവന/കാര്യമാണ്; അതിനാൽ ‘ഈ പ്രസ്താവന വരെ’ കൂടുതൽ കൃത്യമാണ്. οὐ γὰρ καθῆκεν αὐτὸν ζῆν എന്നതിലെ ഭൂതകാലസൂചനയും ‘ഉചിതമല്ല’ എന്ന യോജ്യതാഭാവവും ‘അവൻ ജീവിക്കുന്നത് ഉചിതമല്ലായിരുന്നു’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
  naturalness: ‘ഈ വാക്കുവരെ’ എന്ന പ്രയോഗം ഇവിടെ അൽപം അസ്വാഭാവികവും അർഥത്തിൽ ഇടുങ്ങിയതുമാണ്. ‘ഈ പ്രസ്താവന വരെ’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘അവൻ ജീവിച്ചിരിക്കുന്നത് ഉചിതമായിരുന്നില്ല’ എന്നതിനു പകരം ‘അവൻ ജീവിക്കുന്നത് ഉചിതമല്ലായിരുന്നു’ കൂടുതൽ ഒഴുക്കുള്ളതാണ്.
