  to: 'ഈ പ്രസ്താവന വരെ അവർ അവനെ കേട്ടുകൊണ്ടിരുന്നു. പിന്നെ അവർ ശബ്ദമുയർത്തി പറഞ്ഞു: “ഇങ്ങനെയുള്ള ഒരുവനെ ഭൂമിയിൽനിന്ന് നീക്കിക്കളയൂ[a]; അവൻ ജീവിക്കുന്നത് ഉചിതമല്ലായിരുന്നു[b].”'
