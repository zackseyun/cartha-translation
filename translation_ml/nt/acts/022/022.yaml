id: ACT.22.22
reference: Acts 22:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤκουον δὲ αὐτοῦ ἄχρι τούτου τοῦ λόγου καὶ ἐπῆραν τὴν φωνὴν αὐτῶν λέγοντες· Αἶρε ἀπὸ τῆς γῆς τὸν τοιοῦτον, οὐ γὰρ καθῆκεν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/022.yaml
  text: They were listening to him up to this statement, and they raised their voices, saying, “Take such a man away from the earth, for it was not fitting for him to live.”
translation:
  language: ml
  text: 'ഈ പ്രസ്താവന വരെ അവർ അവനെ കേട്ടുകൊണ്ടിരുന്നു. പിന്നെ അവർ ശബ്ദമുയർത്തി പറഞ്ഞു: “ഇങ്ങനെയുള്ള ഒരുവനെ ഭൂമിയിൽനിന്ന് നീക്കിക്കളയൂ[a]; അവൻ ജീവിക്കുന്നത് ഉചിതമല്ലായിരുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവാർഥപരമായി: “ഇങ്ങനെയുള്ള ഒരുവനെ ഭൂമുഖത്തുനിന്ന് ഇല്ലാതാക്കൂ.”'
    reason: lexical_alternative
  - marker: b
    text: 'അതായത്, അവർ അവന്റെ മരണം ആവശ്യപ്പെടുകയായിരുന്നു; മറ്റൊരു പരിഭാഷ: “അവൻ ജീവിക്കാൻ പാടില്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: കേട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാല ക്രിയ സൂചിപ്പിക്കുന്ന, കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന കേൾവിയെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: ഈ വാക്കുവരെ
  rationale: λόγος ഇവിടെ ഒരു ഒറ്റ പദത്തേക്കാൾ പൗലൊസിന്റെ പ്രസംഗത്തിലെ ഈ നിർണായകമായ വാക്കിനെയോ പ്രസ്താവനയെയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘ഈ വാക്കുവരെ’ സ്വാഭാവികവും അർഥവ്യക്തവുമാണ്.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: അവർ ശബ്ദമുയർത്തി
  rationale: ഉച്ചത്തിലുള്ള കൂട്ടനിലവിളിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലി അതിന്റെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Αἶρε
  choice: നീക്കിക്കളയൂ
  rationale: ശത്രുതാപൂർണമായ ഈ ആജ്ഞയിൽ αἴρω എന്നത് എടുത്തുമാറ്റുക അഥവാ ഇല്ലാതാക്കുക എന്ന അർഥത്തിലാണ്; ‘നീക്കിക്കളയൂ’ ആ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς γῆς
  choice: ഭൂമിയിൽനിന്ന്
  rationale: γῆ എന്നതിന്റെ ‘ഭൂമി/ദേശം’ എന്ന സാധ്യതകളിൽ, ഇവിടെ ജീവിച്ചിരിക്കുന്നവരുടെ ഇടയിൽനിന്ന് പൂർണമായി നീക്കണമെന്ന ജനക്കൂട്ടത്തിന്റെ ആവശ്യം ‘ഭൂമിയിൽനിന്ന്’ വ്യക്തമാക്കുന്നു.
- source_word: τὸν τοιοῦτον
  choice: ഇങ്ങനെയുള്ള ഒരുവനെ
  rationale: അവജ്ഞ നിറഞ്ഞ ‘ഇത്തരത്തിലുള്ള ഒരാൾ’ എന്ന സൂചന, അതിരുകടന്ന നാട്ടുഭാഷ ഒഴിവാക്കി നിലനിർത്തുന്നു.
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: അവൻ ജീവിച്ചിരിക്കുന്നത് ഉചിതമായിരുന്നില്ല
  rationale: καθῆκεν എന്നതിലെ ‘ഉചിതം/യോഗ്യം ആയിരിക്കുക’ എന്ന ആശയവും ഗ്രീക്കിലെ കഴിഞ്ഞകാലരൂപവും കാത്തുസൂക്ഷിക്കുന്നു; ജനക്കൂട്ടത്തിന്റെ മരണാവശ്യത്തിന്റെ കൂടുതൽ നേരിട്ടുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തിന്റെ വാക്കുകൾ മരണാവശ്യമാണെന്ന സൂചന
  choice: മുഖ്യവാചകത്തിൽ ‘ഭൂമിയിൽനിന്ന് നീക്കിക്കളയൂ’ എന്നും ‘ജീവിച്ചിരിക്കുന്നത് ഉചിതമായിരുന്നില്ല’ എന്നും നൽകി ഗ്രീക്ക് രൂപകവും ധാർമ്മിക-യോഗ്യതാഭാഷയും നിലനിർത്തി.
  alternative: ‘അവനെ കൊന്നുകളയൂ; അവൻ ജീവിക്കാൻ പാടില്ല’ എന്ന് ഉദ്ദേശ്യം നേരിട്ട് വ്യക്തമാക്കുക.
  rationale: മരണാവശ്യം സന്ദർഭത്തിൽ വ്യക്തമാണ്; എന്നാൽ മൂലത്തിലെ പരോക്ഷവും ശക്തവുമായ പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് മാറ്റാതെ, അതിന്റെ ഉദ്ദേശ്യം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ജനക്കൂട്ടത്തിന്റെ അവജ്ഞയും നിലവിളിയുടെ ശക്തിയും നിലനിർത്തിയിട്ടുണ്ട്; അതേസമയം അനാവശ്യമായി നാട്ടുഭാഷാപരമോ സഭാവിഭാഗസവിശേഷമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
