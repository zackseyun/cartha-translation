source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ περὶ μεσημβρίαν ἐξαίφνης ἐκ τοῦ οὐρανοῦ περιαστράψαι φῶς ἱκανὸν περὶ ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: ml
  text: ഞാൻ യാത്രചെയ്ത് ദമസ്കൊസിനോടു സമീപിച്ചുകൊണ്ടിരിക്കെ, ഏകദേശം ഉച്ചസമയത്ത്, പെട്ടെന്ന് സ്വർഗത്തിൽനിന്ന് ഉജ്ജ്വലമായ ഒരു വെളിച്ചം[a] എനിക്കു ചുറ്റും മിന്നിത്തെളിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വലിയൊരു വെളിച്ചം.’ ഗ്രീക്ക് പ്രയോഗം വെളിച്ചത്തിന്റെ വലിപ്പത്തെയോ തീവ്രതയെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: ഞാൻ … ആയിരിക്കുമ്പോൾ … മിന്നിപ്പരന്നു
  rationale: സംഭവം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ മലയാളത്തിൽ കൃത്രിമമായ ‘എനിക്കു സംഭവിച്ചു’ എന്ന രൂപത്തിലാക്കാതെ, ഒന്നാംപുരുഷ അനുഭവവും ലഘുവായ ആഖ്യാനബന്ധവും മുഴുവൻ വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: യാത്രചെയ്ത് ദമസ്കൊസിനോട് അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: രണ്ട് വർത്തമാനകാല കൃദന്തരൂപങ്ങളിലുമുള്ള തുടർന്നുകൊണ്ടിരിക്കുന്ന യാത്രയും സമീപിക്കലും വ്യക്തമാക്കുന്നു.
- source_word: περὶ μεσημβρίαν
  choice: ഏകദേശം ഉച്ചസമയത്ത്
  rationale: περί സൂചിപ്പിക്കുന്ന ഏകദേശ സമയവും μεσημβρίαയുടെ ഉച്ചസമയാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξαίφνης
  choice: പെട്ടെന്ന്
  rationale: സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: വെറും അന്തരീക്ഷസൂചനയിലൊതുക്കാതെ, ഈ വെളിപ്പാടനുഭവത്തിന്റെ പശ്ചാത്തലത്തിൽ οὐρανός വഹിക്കുന്ന അതീതമായ ഉറവിടസൂചന സംരക്ഷിക്കുന്നു.
- source_word: περιαστράψαι
  choice: എനിക്കു ചുറ്റും മിന്നിപ്പരന്നു
  rationale: περί എന്ന ചുറ്റുമുള്ള ദിശാസൂചനയും ἀστράπτω എന്ന മിന്നൽപോലുള്ള പെട്ടെന്നുള്ള പ്രകാശവും ചേർത്ത് നൽകുന്നു.
- source_word: φῶς ἱκανὸν
  choice: ഉജ്ജ്വലമായ ഒരു വെളിച്ചം
  rationale: ἱκανός ഇവിടെ സൂചിപ്പിക്കാവുന്ന ശ്രദ്ധേയമായ തീവ്രതയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വലിയ’ എന്ന അളവുസൂചനയും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: περὶ ἐμέ
  choice: എനിക്കു ചുറ്റും
  rationale: സ്ഥലപരമായ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦ എന്നതിലെ οὐρανός
  choice: സ്വർഗത്തിൽനിന്ന്
  alternative: ആകാശത്തുനിന്ന്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ പ്രയോഗവും പൗലോസിന്റെ വെളിപ്പാടനുഭവമെന്ന സന്ദർഭവും കണക്കിലെടുത്ത് ദൈവിക/അതീത ഉറവിടസൂചന സംരക്ഷിക്കുന്നു; ഇതിലൂടെ വാചകത്തിൽ ഇല്ലാത്ത പ്രത്യേക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സാക്ഷ്യവിവരണത്തിന്റെ നേരിട്ടുള്ള ശൈലി നിലനിർത്തി; കൃത്രിമമായ പദാനുപദ ഘടന ഒഴിവാക്കി. അടിക്കുറിപ്പിന്റെ സൂചിക അത് വിശദീകരിക്കുന്ന ‘ഉജ്ജ്വലമായ ഒരു വെളിച്ചം’ എന്ന പ്രയോഗത്തോടു ചേർത്തിരിക്കുന്നു.
