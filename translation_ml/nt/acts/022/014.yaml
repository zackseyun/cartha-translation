id: ACT.22.14
reference: Acts 22:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: ml
  text: 'അപ്പോൾ അവൻ പറഞ്ഞു: “നമ്മുടെ പിതാക്കന്മാരുടെ ദൈവം തന്റെ ഇഷ്ടം അറിയാനും നീതിമാനായവനെ[a] കാണാനും അവന്റെ വായിൽനിന്ന് ഒരു ശബ്ദം കേൾക്കാനും നിന്നെ തിരഞ്ഞെടുത്തിരിക്കുന്നു[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതിമാനായവൻ’ ഇവിടെ യേശുവിനെ സൂചിപ്പിക്കുന്ന ഒരു സ്ഥാനപ്പേരാണ്; ‘ന്യായവാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘നിയമിച്ചിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ ഒരു ദൗത്യത്തിനായി തിരഞ്ഞെടുക്കുന്നതിനെയോ നിയോഗിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προεχειρίσατό
  choice: തിരഞ്ഞെടുത്തിരിക്കുന്നു
  rationale: ഈ ക്രിയ ഒരു പ്രത്യേക ദൗത്യത്തിനായി ഒരാളെ തിരഞ്ഞെടുക്കുകയോ നിയോഗിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന മൂന്ന് അനന്തക്രിയകൾ ആ തിരഞ്ഞെടുപ്പിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. ‘തിരഞ്ഞെടുത്തിരിക്കുന്നു’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘നിയമിച്ചിരിക്കുന്നു’ എന്നതും സാധ്യമാണ്.
- source_word: γνῶναι
  choice: അറിയാൻ
  rationale: ദൈവത്തിന്റെ ഇഷ്ടം ഗ്രഹിക്കുകയോ അറിയുകയോ ചെയ്യുക എന്ന അടിസ്ഥാന അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: θέλημα
  choice: ഇഷ്ടം
  rationale: ദൈവത്തിന്റെ will എന്ന വിശാലമായ ആശയം മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ പ്രയോഗത്തിലും സ്വാഭാവികമായി നൽകുന്നു; ‘ഹിതം’ കൂടുതൽ പഴയ ശൈലിയായിരിക്കും, ‘ഉദ്ദേശ്യം’ അർഥത്തെ ചുരുക്കും.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം ആധുനികവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὸν δίκαιον
  choice: നീതിമാനായവനെ
  rationale: δίκαιος എന്നതിന്റെ നീതി/നീതിമാൻ എന്ന അർഥം സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്ന വിശേഷണാത്മക സ്ഥാനപ്പേരാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ രൂപം ഉപയോഗിച്ചു.
- source_word: ἀκοῦσαι φωνὴν
  choice: ഒരു ശബ്ദം കേൾക്കാൻ
  rationale: φωνή നിർദേശകപദമില്ലാതെ വന്നതിനാൽ ‘ഒരു ശബ്ദം’ എന്നു നൽകി. വായിൽനിന്നുള്ളതെന്ന തുടർവാക്യം സംസാരശബ്ദത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: അവന്റെ വായിൽനിന്ന്
  rationale: മൂലത്തിലെ ദൃശ്യവും നേരിട്ടുള്ളതുമായ പ്രയോഗം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: ഇസ്രായേലിന്റെ പാരമ്പര്യത്തെയും ഉടമ്പടിബന്ധത്തെയും സൂചിപ്പിക്കുന്ന മൂലത്തിലെ πατέρων എന്ന പുരുഷലിംഗ ബഹുവചനവും പതിവ് ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὸν δίκαιον എന്നത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായോ പൊതുവായ വിവരണമായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ‘നീതിമാനായവൻ’ എന്ന സ്ഥാനപ്പേരായി നൽകി
  alternative: ‘നീതിയുള്ളവൻ’ അല്ലെങ്കിൽ ‘ന്യായവാൻ’
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 3:14; 7:52 എന്നിവയിലെ സമാന പ്രയോഗം ഇതിന് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരിന്റെ സ്വഭാവമുണ്ടെന്ന് കാണിക്കുന്നു. എന്നിരുന്നാലും മൂലത്തിലെ വിശേഷണാർഥം നഷ്ടപ്പെടാത്ത രൂപമാണ് ഉപയോഗിച്ചത്.
- issue: πατέρων എന്നത് ലിംഗനിഷ്പക്ഷമായി ‘പൂർവികർ’ എന്നു നൽകണമോ
  choice: ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നു നിലനിർത്തി
  alternative: ‘നമ്മുടെ പൂർവികർ’
  rationale: മൂലപദം വ്യക്തമായി ‘പിതാക്കന്മാർ’ എന്നാണ്; കൂടാതെ ഇത് ഇസ്രായേലിന്റെ ഉടമ്പടിപാരമ്പര്യവുമായി ബന്ധപ്പെട്ട പതിവ് പ്രയോഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ മൂന്ന് സമാന്തര ഉദ്ദേശ്യങ്ങൾ—അറിയാൻ, കാണാൻ, കേൾക്കാൻ—ക്രമത്തോടെയും തുല്യതയോടെയും നിലനിർത്തി. നേരിട്ടുള്ള വാക്കിന്റെ ഘടനയും ‘അവന്റെ വായിൽനിന്ന്’ എന്ന ദൃശ്യപ്രയോഗവും സംരക്ഷിച്ചു.
