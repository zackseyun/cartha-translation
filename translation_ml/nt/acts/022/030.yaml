id: ACT.22.30
reference: Acts 22:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: ml
  text: എന്നാൽ പിറ്റേന്ന്, യഹൂദർ[a] പൗലൊസിനെ എന്തിന്റെ പേരിലാണ് കുറ്റപ്പെടുത്തുന്നതെന്ന് നിശ്ചയമായി അറിയാൻ ആഗ്രഹിച്ച പടത്തലവൻ അവന്റെ ബന്ധനങ്ങൾ അഴിച്ചു. തുടർന്ന്, മുഖ്യപുരോഹിതന്മാരും മഹാസഭ[b] മുഴുവനും കൂടിവരണമെന്ന് അയാൾ കല്പിച്ചു; പൗലൊസിനെ താഴേക്കു കൊണ്ടുവന്ന് അവരുടെ മുമ്പിൽ നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ.’ ഗ്രീക്കിൽ ‘യഹൂദർ’ എന്നാണ്. ഇവിടെ അത് എല്ലാ യഹൂദരെയും വിവേചനമില്ലാതെ സൂചിപ്പിക്കുന്നതല്ല; പൗലൊസിനെ കുറ്റപ്പെടുത്തിയവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘മഹാസഭ’ എന്നത് യെരൂശലേമിലെ യഹൂദ ഭരണസമിതിയായ സൻഹെദ്രിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: എന്നാൽ പിറ്റേന്ന്
  rationale: കാലസൂചകമായ ദത്തിവ് പ്രയോഗം ‘പിറ്റേന്ന്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; δέ സൂചിപ്പിക്കുന്ന നേരിയ ആഖ്യാനമാറ്റം ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: ഉറപ്പായി അറിയാൻ ആഗ്രഹിച്ച
  rationale: βουλόμενος ഉദ്ദേശമോ ആഗ്രഹമോ സൂചിപ്പിക്കുന്നു; τὸ ἀσφαλές വിശ്വസനീയമായ ഉറപ്പോ കൃത്യമായ വസ്തുതയോ അറിയുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: യഹൂദർ പൗലൊസിനെ എന്തിന്റെ പേരിലാണ് കുറ്റപ്പെടുത്തുന്നതെന്ന്
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാള ചോദ്യഘടനയിൽ നൽകി. Ἰουδαίων എന്ന പദത്തിന്റെ വിശാലത മുഖ്യപാഠത്തിൽ ചുരുക്കാതെ ‘യഹൂദർ’ എന്നു നിലനിർത്തി.
- source_word: ἔλυσεν αὐτόν
  choice: അവന്റെ കെട്ടുകൾ അഴിച്ചു
  rationale: λύω എന്നതിന് അഴിക്കുക, ബന്ധനം നീക്കുക, മോചിപ്പിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. സന്ദർഭത്തിൽ പൗലൊസിന്റെ ബന്ധനം അഴിച്ചതാണ് പ്രധാനം; റോമൻ കാവലിൽനിന്ന് പൂർണമായി മോചിപ്പിച്ചു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാനും ഈ രൂപം സഹായിക്കുന്നു.
- source_word: ἐκέλευσεν συνελθεῖν
  choice: കൂടിവരണമെന്ന് ... കല്പിച്ചു
  rationale: κελεύω + infinitive അധികാരപൂർവമായ കല്പനയാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ ഔദ്യോഗിക ശൈലി ഉപയോഗിച്ചു.
- source_word: τοὺς ἀρχιερεῖς
  choice: മുഖ്യപുരോഹിതന്മാർ
  rationale: ഇത് ഒരേസമയം പല മഹാപുരോഹിതന്മാർ എന്നതിലുപരി പ്രമുഖ പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന പതിവ് ബഹുവചന പദവിയാണ്.
- source_word: πᾶν τὸ συνέδριον
  choice: സഭ മുഴുവനും
  rationale: συνέδριον യെരൂശലേമിലെ യഹൂദ ഭരണസഭയെ സൂചിപ്പിക്കുന്നു. വായനാസൗകര്യത്തിനായി പദം ലിപ്യന്തരണം ചെയ്യാതെ ‘സഭ’ എന്നു പരിഭാഷപ്പെടുത്തി; πᾶν ‘മുഴുവനും’ എന്നു നിലനിർത്തി.
- source_word: καταγαγὼν τὸν Παῦλον
  choice: പൗലൊസിനെ താഴേക്കു കൊണ്ടുവന്ന്
  rationale: κατά എന്ന ദിശാസൂചന ഉൾക്കൊള്ളുന്ന καταγαγών പൗലൊസിനെ ഉയർന്ന സ്ഥലത്തുനിന്ന് താഴേക്കു കൊണ്ടുവന്ന ആഖ്യാനചലനം സൂക്ഷിക്കുന്നു.
- source_word: ἔστησεν εἰς αὐτούς
  choice: അവരുടെ മുമ്പിൽ നിർത്തി
  rationale: ഔദ്യോഗിക വിചാരണാസന്ദർഭത്തിൽ ഒരാളെ സഭയുടെ സന്നിധിയിൽ ഹാജരാക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
theological_decisions:
- issue: അപ്പൊസ്തലപ്രവൃത്തികളിലെ Ἰουδαίων എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: യഹൂദർ
  alternative: യഹൂദനേതാക്കൾ; യെഹൂദ്യർ
  rationale: ഗ്രീക്ക് പാഠം Ἰουδαίων എന്നു പറയുന്നു. സന്ദർഭത്തിൽ ഇത് പൗലൊസിന്റെ കുറ്റാരോപകരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മുഖ്യപാഠത്തിൽ ‘നേതാക്കൾ’ എന്നു ചേർത്ത് അർഥം അനാവശ്യമായി ചുരുക്കിയില്ല; എല്ലാ യഹൂദരെയും വിവേചനമില്ലാതെ കുറ്റപ്പെടുത്തുന്നതല്ലെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: ἔλυσεν αὐτόν സൂചിപ്പിക്കുന്ന മോചനത്തിന്റെ സ്വഭാവം
  choice: അവന്റെ കെട്ടുകൾ അഴിച്ചു
  alternative: അവനെ വിട്ടയച്ചു
  rationale: പൗലൊസ് തുടർന്നും റോമൻ അധികാരിയുടെ നിയന്ത്രണത്തിൽ ഹാജരാക്കപ്പെടുന്നതിനാൽ ‘വിട്ടയച്ചു’ എന്നത് പൂർണ മോചനം സൂചിപ്പിക്കാം. ഗ്രീക്കിലുള്ള അഴിക്കുക/മോചിപ്പിക്കുക എന്ന അർഥവ്യാപ്തിയിൽ സന്ദർഭത്തിന് യോജിച്ച രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘പടത്തലവൻ’ എന്ന കർത്താവ് ഗ്രീക്ക് വാക്യത്തിൽ പരോക്ഷമാണെങ്കിലും മുൻസന്ദർഭത്തിലെ റോമൻ സൈനികാധികാരിയെ സാധാരണ വായനക്കാരന് വ്യക്തമായി തിരിച്ചറിയാൻ ചേർത്തു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘യഹൂദർ’, ‘സഭ’ എന്നീ പദങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
