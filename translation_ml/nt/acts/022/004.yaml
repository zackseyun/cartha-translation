id: ACT.22.4
reference: Acts 22:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ταύτην τὴν ὁδὸν ἐδίωξα ἄχρι θανάτου, δεσμεύων καὶ παραδιδοὺς εἰς φυλακὰς ἄνδρας τε καὶ γυναῖκας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/004.yaml
  text: I persecuted this Way to the death[a], binding and delivering both men and women into prisons[b],
translation:
  language: ml
  text: പുരുഷന്മാരെയും സ്ത്രീകളെയും ബന്ധിച്ച് ജയിലുകളിലേക്കു കൈമാറിക്കൊണ്ട്, ഞാൻ ഈ മാർഗത്തെ[a] മരണത്തോളം[b] പീഡിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഈ വഴി’ അല്ലെങ്കിൽ ‘ഈ പ്രസ്ഥാനം.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഈ വഴി’ എന്നാണ്; എന്നാൽ അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഇത് പലപ്പോഴും ക്രിസ്തീയ പ്രസ്ഥാനത്തിന്റെ പേരായി ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മരണംവരെ.’ ഈ പ്രയോഗം പീഡനത്തിന്റെ മാരകമായ വ്യാപ്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: ഈ മാർഗത്തെ
  rationale: ὁδός എന്നതിന്റെ ‘വഴി/മാർഗം’ എന്ന അടിസ്ഥാനരൂപകം നിലനിർത്തുന്നു; അതേസമയം അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഇത് ക്രിസ്തീയ വിശ്വാസപ്രസ്ഥാനത്തിന്റെ അംഗീകൃത നാമമായി പ്രവർത്തിക്കുന്നതും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἐδίωξα
  choice: ഞാൻ ... പീഡിപ്പിച്ചു
  rationale: ഇവിടെ διώκω നിഷ്പക്ഷമായ പിന്തുടരലല്ല, വിശ്വാസികൾക്കെതിരായ ശത്രുതാപരമായ വേട്ടയും ഉപദ്രവവുമാണ് സൂചിപ്പിക്കുന്നത്; ‘പീഡിപ്പിച്ചു’ അതിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄχρι θανάτου
  choice: മരണത്തോളം
  rationale: പീഡനത്തിന്റെ മാരകമായ പരമാവധി വ്യക്തമാക്കുന്നു; പൗലൊസ് തന്നെ ആളുകളെ കൊന്നു എന്നതിലേക്കു വാചകത്തെ അനാവശ്യമായി ചുരുക്കാതെ ഗ്രീക്കിലെ വ്യാപ്തിയും സാധ്യതയുള്ള അർഥതുറപ്പും നിലനിർത്തുന്നു.
- source_word: δεσμεύων
  choice: ബന്ധിച്ച്
  rationale: പിടികൂടുന്നതിലുപരി കെട്ടിയിടുന്നതിന്റെ മൂർത്തമായ ദൃശ്യം ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിൽ ഉണ്ട്; ‘ബന്ധിച്ച്’ അത് നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: παραδιδοὺς
  choice: കൈമാറിക്കൊണ്ട്
  rationale: അധികാരികളുടെ കാവലിലേക്കു ആളുകളെ ഏൽപ്പിക്കുന്ന നിയമപരമായ ഭാവം ഈ പദത്തിൽ ഉണ്ട്; ‘കൈമാറിക്കൊണ്ട്’ ആ പ്രവർത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς φυλακὰς
  choice: ജയിലുകളിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയും φυλακάς എന്ന ബഹുവചനവും നിലനിർത്തുന്നു; ‘ജയിൽ’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: പുരുഷന്മാരെയും സ്ത്രീകളെയും
  rationale: പീഡനം രണ്ടു വിഭാഗങ്ങളിലേക്കും വ്യാപിച്ചതെന്ന ഗ്രീക്ക് ഘടനയുടെ ഊന്നൽ കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἡ ὁδός ഒരു സാധാരണ നാമമായി വേണമോ, ക്രിസ്തീയ പ്രസ്ഥാനത്തിന്റെ അർധ-ശീർഷകമായി വേണമോ പരിഭാഷപ്പെടുത്താൻ
  choice: ഈ മാർഗത്തെ
  alternative: ഈ വഴിയെ; ഈ പ്രസ്ഥാനത്തെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ἡ ὁδός ക്രിസ്തീയ വിശ്വാസത്തെയും സമൂഹത്തെയും സൂചിപ്പിക്കുന്ന അംഗീകൃത പ്രയോഗമാണ്. ‘മാർഗം’ മൂലരൂപകം നിലനിർത്തുകയും ‘പ്രസ്ഥാനം’ എന്ന വിശദീകരണം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു; മലയാളലിപിയിൽ ഇംഗ്ലീഷിലേതുപോലെ capitalization വഴി ശീർഷകഭാവം അടയാളപ്പെടുത്താനാകാത്തതിനാൽ കുറിപ്പ് അത് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം സൂക്ഷിച്ചുകൊണ്ട് മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി ക്രിയാവിശേഷണഘടകം ആദ്യം വച്ചു. ‘മാർഗം’ എന്ന പദത്തിന്റെ പ്രത്യേക നാമസൂചന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
