id: ACT.22.10
reference: Acts 22:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ ചോദിച്ചു[a]: “കർത്താവേ, ഞാൻ എന്തു ചെയ്യണം?” കർത്താവ് എന്നോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ദമസ്കൊസിലേക്കു പോകുക. നിനക്കു ചെയ്യാൻ നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്ന[b] സകല കാര്യങ്ങളെക്കുറിച്ചും അവിടെവെച്ച് നിന്നോടു പറയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവേ, ഞാൻ എന്തു ചെയ്യേണ്ടതാണ്?”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിനക്കു ചെയ്യാനായി ഏൽപ്പിക്കപ്പെട്ടിരിക്കുന്ന.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: ഞാൻ എന്തു ചെയ്യണം?
  rationale: ആലോചനാത്മകമായ aorist subjunctive അടുത്തതായി താൻ എന്തു ചെയ്യണമെന്ന മാർഗനിർദേശം ചോദിക്കുന്നു. ‘എന്തു ചെയ്യണം?’ എന്നത് ബാധ്യതയും നിർദേശത്തിനായുള്ള അഭ്യർഥനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κύριε / ὁ ... κύριος
  choice: കർത്താവേ / കർത്താവ്
  rationale: ദമസ്കൊസ് വഴിയിലെ ഈ സന്ദർഭത്തിൽ അഭിസംബോധനയും യേശുവിനെക്കുറിച്ചുള്ള തിരിച്ചറിയലും ഒരേ κύριος എന്ന പദത്തിലൂടെയാണ് വരുന്നത്. ‘കർത്താവ്’ അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം കുറയ്ക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: ഈ participle തുടർന്ന് വരുന്ന πορεύου എന്ന കല്പനയോടു ചേർന്ന് ക്രമാനുസൃതമായ കല്പനയായി പ്രവർത്തിക്കുന്നു. ‘എഴുന്നേറ്റ്’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: πορεύου εἰς Δαμασκόν
  choice: ദമസ്കൊസിലേക്കു പോകുക
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദമസ്കൊസിലേക്കു പോകുക’ നഗരത്തിലേക്കുള്ള യാത്ര സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κἀκεῖ
  choice: അവിടെവെച്ച്
  rationale: καὶ ἐκεῖ എന്ന സംക്ഷിപ്തരൂപത്തിന്റെ സ്ഥലസൂചനയും സംഭവക്രമവും ‘അവിടെവെച്ച്’ വ്യക്തമായി പകർന്നു നൽകുന്നു.
- source_word: λαληθήσεται
  choice: നിന്നോടു പറയും
  rationale: λαλέωയുടെ future passive രൂപവും σοι എന്ന dative-ഉം മലയാളത്തിൽ സ്വാഭാവികമായ അനിശ്ചിതകർതൃപ്രയോഗമായ ‘നിന്നോടു പറയും’ എന്നാക്കി. ആരാണ് പറയുന്നതെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തത് ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: περὶ πάντων
  choice: സകല കാര്യങ്ങളെക്കുറിച്ചും
  rationale: περί + genitive അറിയിക്കപ്പെടുന്ന കാര്യങ്ങളുടെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. ‘സകല കാര്യങ്ങളെക്കുറിച്ചും’ അതിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὧν τέτακταί σοι ποιῆσαι
  choice: നീ ചെയ്യേണ്ടതെന്നു നിശ്ചയിക്കപ്പെട്ടിട്ടുള്ള
  rationale: τάσσωയുടെ perfect passive രൂപം മുമ്പേ നിശ്ചയിക്കപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ക്രമീകരണം സൂചിപ്പിക്കുന്നു. ‘നിശ്ചയിക്കപ്പെട്ടിട്ടുള്ള’ ദൈവിക ക്രമീകരണത്തിന്റെ ആശയം നിലനിർത്തുമ്പോഴും അതിലധികമായ സിദ്ധാന്തപരമായ അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: τέτακταί എന്നതിൽ ദൈവിക നിർദേശവും പൗലോസിന്റെ ദൗത്യവും തമ്മിലുള്ള ബന്ധം
  choice: നീ ചെയ്യേണ്ടതെന്നു നിശ്ചയിക്കപ്പെട്ടിട്ടുള്ള
  alternative: നിനക്കു ചെയ്യാനായി ഏൽപ്പിക്കപ്പെട്ടിട്ടുള്ള
  rationale: പ്രവൃത്തികൾ പൗലോസിനായി മുമ്പേ ക്രമീകരിക്കപ്പെട്ടിരിക്കുന്നു എന്ന അർഥം ഈ പരിഭാഷ നിലനിർത്തുന്നു; എന്നാൽ അതിനെ ഒരു പ്രത്യേക മുൻനിശ്ചയസിദ്ധാന്തമായി വിശദീകരിക്കുന്നില്ല. passive രൂപത്തിലെ പറയാത്ത കർത്താവിനെയും അതേപടി തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ‘കർത്താവ്,’ ‘സകല കാര്യങ്ങൾ’ എന്നിവ വചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാണ്. ഉദ്ധരണിക്കുള്ളിലെ കല്പനകൾ നേരിട്ടും വ്യക്തമായും നൽകിയിരിക്കുന്നു.
