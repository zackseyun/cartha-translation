revisions:
- from: 'അപ്പോൾ ഞാൻ ചോദിച്ചു[a]: “കർത്താവേ, ഞാൻ എന്തു ചെയ്യണം?” കർത്താവ് എന്നോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ദമസ്കൊസിലേക്കു പോകുക. നീ ചെയ്യേണ്ടതെന്നു നിശ്ചയിക്കപ്പെട്ടിട്ടുള്ള[b] സകല കാര്യങ്ങളെക്കുറിച്ചും അവിടെവെച്ച് നിന്നോടു പറയും.”'
  to: 'അപ്പോൾ ഞാൻ ചോദിച്ചു[a]: “കർത്താവേ, ഞാൻ എന്തു ചെയ്യണം?” കർത്താവ് എന്നോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ദമസ്കൊസിലേക്കു പോകുക. നിനക്കു ചെയ്യാൻ നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്ന[b] സകല കാര്യങ്ങളെക്കുറിച്ചും അവിടെവെച്ച് നിന്നോടു പറയും.”'
  rationale: The revision only clarifies the syntax of τέτακταί σοι ποιῆσαι. It preserves the Greek perfect passive’s sense that the matters have already been set/appointed, keeps the agent unstated, and avoids stronger doctrinal specification. Footnote b is correspondingly updated to agree with the revised aspectual wording.
