translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, മാന്യവും സ്വാഭാവികവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ചരിത്രപദവിയായ χιλίαρχος-ന് അത്യന്തം സാങ്കേതികമായ കടംപദത്തിനു പകരം ‘സൈനികാധിപൻ’ നൽകി. പൗലോസിന്റെ ചുരുക്കവും ഊന്നലുമുള്ള മറുപടി നിലനിർത്തി.
