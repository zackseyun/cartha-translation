  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: ml
  text: 'അപ്പോൾ സൈനികാധിപൻ മറുപടി പറഞ്ഞു: “വലിയൊരു തുക കൊടുത്താണ് ഞാൻ ഈ പൗരത്വം നേടിയത്.” എന്നാൽ പൗലോസ് പറഞ്ഞു: “ഞാനാകട്ടെ ജന്മനാ പൗരനാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഞാനാകട്ടെ ജനിച്ചിരിക്കുന്നു”; പൗരത്വം എന്ന ആശയം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കണം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: റോമൻ സൈന്യത്തിൽ ഏകദേശം ആയിരം പേരുടെ മേൽ അധികാരമുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ചരിത്രപരമായ പദവി മലയാളത്തിൽ അപരിചിതമായതിനാൽ, പദവിയുടെ സൈനിക സ്വഭാവവും അധികാരവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന പൊതുപദം തിരഞ്ഞെടുത്തു.
- source_word: πολλοῦ κεφαλαίου
  choice: വലിയൊരു തുക കൊടുത്താണ്
  rationale: വലിയ അളവിലുള്ള പണച്ചെലവിനെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുന്നതിനായി പണം വ്യക്തമായി പറയാതെ ‘വലിയൊരു തുക’ എന്നു നൽകി; കൊടുത്താണ് എന്നത് ചെലവിന്റെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: τὴν πολιτείαν ταύτην
  choice: ഈ പൗരത്വം
  rationale: സന്ദർഭത്തിൽ റോമൻ പൗരത്വമെന്ന നിയമപരമായ പദവിയാണ് ഉദ്ദേശ്യം. ‘ഈ’ എന്നത് ഗ്രീക്കിലെ ταύτην-നെ നിലനിർത്തുകയും മുൻവാക്യത്തിലെ റോമൻ പൗരത്വത്തെ ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκτησάμην
  choice: നേടിയത്
  rationale: തനിക്കായി കൈവശമാക്കുക അഥവാ സമ്പാദിക്കുക എന്ന വിശാല അർഥം നിലനിർത്തുന്നു. ‘വാങ്ങിയത്’ എന്നു പറഞ്ഞാൽ ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത വാങ്ങൽരീതി കൂടുതൽ കൃത്യമായി നിർണ്ണയിച്ചുപോകും.
- source_word: καὶ γεγέννημαι
  choice: ഞാനാകട്ടെ ജന്മനാ പൗരനാണ്
  rationale: ‘ഞാൻ ജനിച്ചിരിക്കുന്നു’ എന്ന മൂലരൂപത്തിൽ പൗരത്വം സന്ദർഭത്തിൽ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു. സാധാരണ മലയാളത്തിൽ അതിന്റെ അർഥം വ്യക്തമായി നൽകുകയും καί സൂചിപ്പിക്കുന്ന ഊന്നിയ വൈരുധ്യം ‘ഞാനാകട്ടെ’ എന്നതിലൂടെ പ്രകടമാക്കുകയും ചെയ്തു.
- source_word: δέ
  choice: അപ്പോൾ / എന്നാൽ
  rationale: ആദ്യത്തേത് സംഭാഷണത്തിന്റെ തുടർച്ചയും രണ്ടാമത്തേത് സൈനികാധിപന്റെ നേടിയ പൗരത്വവും പൗലോസിന്റെ ജന്മസിദ്ധ പൗരത്വവും തമ്മിലുള്ള വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: അധികമായ വാഗ്‌ശക്തി ചേർക്കാതെ സാധാരണ സംസാരക്രിയയെ നേരിട്ട് നൽകുന്നു.
