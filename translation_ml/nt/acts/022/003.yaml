- from: “ഞാൻ ഒരു യഹൂദപുരുഷനാണ്. കിലിക്ക്യയിലെ തർസൊസിൽ ജനിച്ചെങ്കിലും ഈ നഗരത്തിൽ ഗമാലിയേലിന്റെ കാൽക്കൽ[a] വളർന്നവനും, നമ്മുടെ പിതാക്കന്മാരുടെ നിയമത്തിന്റെ[b] കർശനതയനുസരിച്ച് വിദ്യാഭ്യാസം നേടിയവനും, ഇന്ന് നിങ്ങളെല്ലാവരും ആയിരിക്കുന്നതുപോലെ ദൈവത്തിനുവേണ്ടി തീക്ഷ്ണതയുള്ളവനുമാണ് ഞാൻ.”
  to: “ഞാൻ യഹൂദനായ ഒരു പുരുഷനാണ്. കിലിക്ക്യയിലെ തർസൊസിൽ ജനിച്ചെങ്കിലും, ഈ നഗരത്തിൽ ഗമാലിയേലിന്റെ കാൽക്കൽ[a] വളർത്തപ്പെട്ടവനും, നമ്മുടെ പിതാക്കന്മാരുടെ നിയമത്തിന്റെ[b] കർശനതയനുസരിച്ച് വിദ്യാഭ്യാസം നേടിയവനും, ഇന്ന് നിങ്ങളെല്ലാവരും ആയിരിക്കുന്നതുപോലെ ദൈവത്തോടുള്ള തീക്ഷ്ണതയുള്ളവനുമാണ് ഞാൻ.”
  rationale: ചെറിയ ശൈലിപരിഷ്കാരങ്ങൾ മാത്രം വരുത്തി. ‘യഹൂദനായ ഒരു പുരുഷൻ’ ἀνὴρ Ἰουδαῖος-ലെ രണ്ട് ഘടകങ്ങളും സ്വാഭാവികമായി നിലനിർത്തുന്നു. ‘വളർത്തപ്പെട്ടവൻ’ ἀνατεθραμμένος-ലെ വളർത്തൽ/രൂപീകരണഭാവം വ്യക്തമാക്കുന്നു; ‘കാൽക്കൽ’ എന്ന ശിഷ്യത്വദൃശ്യം അടിക്കുറിപ്പോടെ സംരക്ഷിക്കുന്നു. ‘ദൈവത്തോടുള്ള തീക്ഷ്ണത’ ζηλωτὴς τοῦ θεοῦ-യുടെ ബന്ധം കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു. രണ്ട് വാക്യങ്ങളാക്കിയ രൂപം മൂലവാക്യത്തിന്റെ സ്വപരിചയഘടനയെയോ അർഥത്തെയോ മാറ്റുന്നില്ല.
