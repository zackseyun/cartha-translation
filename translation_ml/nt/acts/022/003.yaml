id: ACT.22.3
reference: Acts 22:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: ml
  text: “ഞാൻ യഹൂദനായ ഒരു പുരുഷനാണ്. കിലിക്ക്യയിലെ തർസൊസിൽ ജനിച്ചെങ്കിലും, ഈ നഗരത്തിൽ ഗമാലിയേലിന്റെ കാൽക്കൽ[a] വളർത്തപ്പെട്ടവനും, നമ്മുടെ പിതാക്കന്മാരുടെ നിയമത്തിന്റെ[b] കർശനതയനുസരിച്ച് വിദ്യാഭ്യാസം നേടിയവനും, ഇന്ന് നിങ്ങളെല്ലാവരും ആയിരിക്കുന്നതുപോലെ ദൈവത്തോടുള്ള തീക്ഷ്ണതയുള്ളവനുമാണ് ഞാൻ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗമാലിയേലിന്റെ കാൽക്കൽ” എന്നത് ഒരു ഗുരുവിന്റെ കീഴിൽ ശിഷ്യനായി പഠിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അഥവാ “പൈതൃകനിയമത്തിന്റെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: ഒരു യഹൂദപുരുഷൻ
  rationale: ἀνήρ സൂചിപ്പിക്കുന്ന പ്രായപൂർത്തിയായ പുരുഷൻ എന്ന അർഥവും Ἰουδαῖος സൂചിപ്പിക്കുന്ന യഹൂദ സ്വത്വവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: കിലിക്ക്യയിലെ തർസൊസിൽ ജനിച്ച
  rationale: സ്ഥലബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ കൃതന്തപ്രയോഗം സംക്ഷിപ്തമായി പുനരാവിഷ്കരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: എന്നാൽ ഈ നഗരത്തിൽ … വളർന്നവൻ
  rationale: ἀνατρέφω ഇവിടെ ശാരീരിക പോഷണത്തേക്കാൾ വളർത്തലിനെയും ബാല്യകാല രൂപീകരണത്തെയും സൂചിപ്പിക്കുന്നു; δέ ജന്മസ്ഥലവും വളർന്ന സ്ഥലവും തമ്മിലുള്ള വ്യത്യാസം അടയാളപ്പെടുത്തുന്നു.
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: ഗമാലിയേലിന്റെ കാൽക്കൽ
  rationale: ഗുരുവിന്റെ കീഴിൽ ശിഷ്യനായി പഠിച്ചതിനെ സൂചിപ്പിക്കുന്ന സജീവമായ മൂലഭാഷാ പ്രയോഗം നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: കർശനതയനുസരിച്ച് വിദ്യാഭ്യാസം നേടിയ
  rationale: ഔപചാരിക പരിശീലനവും സൂക്ഷ്മവും കർശനവുമായ അനുസരണവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: τοῦ πατρῴου νόμου
  choice: നമ്മുടെ പിതാക്കന്മാരുടെ നിയമം
  rationale: പൈതൃകമായി ലഭിച്ച നിയമം എന്ന അർഥത്തോടൊപ്പം പൗലോസ് തന്റെ യഹൂദ ശ്രോതാക്കളുമായി പ്രകടിപ്പിക്കുന്ന പൊതുപാരമ്പര്യബോധവും വ്യക്തമാക്കുന്നു.
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: ദൈവത്തിനുവേണ്ടി തീക്ഷ്ണതയുള്ളവൻ
  rationale: ζηλωτής എന്നതിലെ ശക്തമായ മതതീക്ഷ്ണത നിലനിർത്തുമ്പോൾ ഒരു പ്രത്യേക രാഷ്ട്രീയകക്ഷിയായ ‘സീലോത്തുകളെ’ അനാവശ്യമായി സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: ഇന്ന് നിങ്ങളെല്ലാവരും ആയിരിക്കുന്നതുപോലെ
  rationale: പൗലോസ് അന്നത്തെ ശ്രോതാക്കളുടെ ഇപ്പോഴത്തെ തീക്ഷ്ണതയുമായി തന്നെ താരതമ്യം ചെയ്യുന്ന വാക്ചാതുര്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: πατρῴου νόμου എന്ന പ്രയോഗത്തിൽ പൗലോസും യഹൂദ ശ്രോതാക്കളും പങ്കിടുന്ന പാരമ്പര്യം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: നമ്മുടെ പിതാക്കന്മാരുടെ നിയമം
  alternative: പൈതൃകനിയമം
  rationale: ഗ്രീക്ക് പദം അടിസ്ഥാനപരമായി ‘പൈതൃകമായത്’ എന്നാണ് സൂചിപ്പിക്കുന്നത്. പ്രസംഗസന്ദർഭത്തിൽ പൗലോസ് ശ്രോതാക്കളോടുള്ള ഐക്യബോധം ഊന്നുന്നതിനാൽ ‘നമ്മുടെ പിതാക്കന്മാരുടെ’ എന്നത് ആ വാക്ചാതുര്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ഒരു സമുദായവിശേഷ വ്യാഖ്യാനം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: παρὰ τοὺς πόδας Γαμαλιήλ എന്ന ദൃശ്യാത്മക ശിഷ്യത്വപ്രയോഗം നിലനിർത്തണമോ
  choice: ഗമാലിയേലിന്റെ കാൽക്കൽ
  alternative: ഗമാലിയേലിന്റെ കീഴിൽ പഠിച്ച്
  rationale: മൂലത്തിലെ ഗുരു–ശിഷ്യ ദൃശ്യം സംരക്ഷിക്കാനായി അക്ഷരാർഥപ്രയോഗം നിലനിർത്തി, തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രസംഗശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ നീണ്ട സ്വപരിചയവാക്യത്തിന്റെ ഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യത്തിൽ ആവർത്തിക്കുന്ന ‘ഞാൻ’ പ്രസംഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു. ദൈവത്തോടുള്ള തീക്ഷ്ണതയെ സൂചിപ്പിക്കുന്ന ഭാഷ ശക്തമായി സൂക്ഷിച്ചെങ്കിലും രാഷ്ട്രീയ അർഥമുള്ള സാങ്കേതിക സംജ്ഞ ഒഴിവാക്കി.
