translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സൈനികപദവികൾക്ക് കൃത്യതയും വായനാസൗകര്യവും തുല്യമായി പരിഗണിച്ചു. മുഖ്യവാക്യത്തിലെ രണ്ട് അടിക്കുറിപ്പ് സൂചകങ്ങളും അനുബന്ധ പദപ്രയോഗങ്ങളോടു ചേർത്തിരിക്കുന്നു.
