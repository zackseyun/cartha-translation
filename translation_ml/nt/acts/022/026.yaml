id: ACT.22.26
reference: Acts 22:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: ml
  text: 'ശതാധിപൻ ഇതു കേട്ടപ്പോൾ സേനാധിപന്റെ അടുത്തുചെന്ന് ഇങ്ങനെ അറിയിച്ചു: “അങ്ങ് എന്താണ് ചെയ്യാൻ പോകുന്നത്?[a] ഈ മനുഷ്യൻ റോമൻ പൗരനാണല്ലോ.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് എന്താണ് ചെയ്യാനൊരുങ്ങുന്നത്?” ഗ്രീക്ക് പ്രയോഗം ഉടൻ നടക്കാനിരിക്കുന്ന പ്രവൃത്തിയെയോ ഉദ്ദേശിച്ചിരിക്കുന്ന പ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഈ മനുഷ്യൻ ഒരു റോമക്കാരനാണ്.” ഇവിടെ അർഥം, അയാൾക്ക് റോമൻ പൗരത്വമുണ്ട് എന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ സാഹചര്യം സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃതന്തത്തിന്റെ കാലസംബന്ധമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: നൂറോളം സൈനികരുടെ ചുമതലയുള്ള റോമൻ സൈനികപദവിക്കുള്ള കൃത്യവും മലയാള ബൈബിൾ വായനയിൽ പരിചിതവുമായ പദം.
- source_word: προσελθὼν
  choice: അടുത്തുചെന്ന്
  rationale: മേലുദ്യോഗസ്ഥന്റെ അടുക്കലേക്കുള്ള നീക്കം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χιλιάρχῳ
  choice: സേനാധിപന്റെ
  rationale: റോമൻ സൈന്യത്തിലെ ഉന്നത കമാൻഡറെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
- source_word: ἀπήγγειλεν
  choice: അറിയിച്ചു
  rationale: വിവരം മേലുദ്യോഗസ്ഥനു റിപ്പോർട്ട് ചെയ്യുന്നതെന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: λέγων
  choice: ഇങ്ങനെ
  rationale: അറിയിപ്പിന്റെ ഉള്ളടക്കത്തിലേക്കുള്ള സ്വാഭാവിക മലയാള ബന്ധം നൽകുന്നു; ഗ്രീക്കിലെ കൃതന്തരൂപം കൃത്രിമമായി പകർത്തുന്നില്ല.
- source_word: Τί μέλλεις ποιεῖν;
  choice: അങ്ങ് എന്താണ് ചെയ്യാൻ പോകുന്നത്?
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന അടുത്തോ ഉദ്ദേശിച്ചോ ഉള്ള പ്രവൃത്തിയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ആദരസൂചകമായ ‘അങ്ങ്’ കീഴുദ്യോഗസ്ഥൻ മേലുദ്യോഗസ്ഥനോടു സംസാരിക്കുന്ന സാഹചര്യത്തിന് യോജിക്കുന്നു.
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: ഈ മനുഷ്യൻ ... ആണല്ലോ
  rationale: γάρ നൽകുന്ന വിശദീകരണകാരണം മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആണല്ലോ’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: Ῥωμαῖός ἐστιν
  choice: റോമൻ പൗരനാണ്
  rationale: നിയമപരമായ സന്ദർഭത്തിൽ Ῥωμαῖος എന്നത് റോമൻ പൗരത്വമാണ് സൂചിപ്പിക്കുന്നത്; വെറും വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ തിരിച്ചറിയലായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ ‘പൗരൻ’ വ്യക്തമാക്കുന്നു.
