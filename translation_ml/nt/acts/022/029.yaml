translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ഗദ്യശൈലി. റോമൻ നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘റോമൻ പൗരൻ’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
