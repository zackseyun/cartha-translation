id: ACT.22.29
reference: Acts 22:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവനെ ചോദ്യംചെയ്യാൻ പോകുകയായിരുന്നവർ ഉടനെ അവന്റെ അടുത്തുനിന്ന് പിന്മാറി.[a] അവൻ ഒരു റോമൻ പൗരനാണെന്നും താൻ അവനെ ബന്ധിച്ചിട്ടുണ്ടെന്നും മനസ്സിലാക്കിയപ്പോൾ സൈനികാധിപനും[b] ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി, “ചാട്ടവാറുകൊണ്ട് ചോദ്യംചെയ്യാൻ.” ഗ്രീക്ക് ക്രിയ ഔദ്യോഗികമായ പരിശോധനയെ സൂചിപ്പിക്കാം; അതിന്റെ രീതി മുൻവാക്യത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദം പദവിപ്രകാരം ഏകദേശം ആയിരം സൈനികരുടെ മേൽ അധികാരമുള്ള ഒരു റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു; യഥാർഥ സൈനികസംഖ്യ വ്യത്യാസപ്പെട്ടിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: അതുകൊണ്ട് ... ഉടനെ
  rationale: οὖν മുൻവാക്യത്തിൽ പൗലോസ് തന്റെ റോമൻ പൗരത്വം വെളിപ്പെടുത്തിയതിൽനിന്നുള്ള ഫലബന്ധവും εὐθέως പ്രതികരണത്തിന്റെ ഉടനടിത്തവും സൂചിപ്പിക്കുന്നു.
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: അവന്റെ അടുത്തുനിന്ന് പിന്മാറി
  rationale: അവർ പൗലോസിനെ പരിശോധിക്കാനുള്ള നടപടിയിൽനിന്ന് ഉടൻ വിട്ടുമാറിയതും ശാരീരികമായി പിന്നോട്ടുമാറിയതുമായ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: അവനെ ചോദ്യംചെയ്യാൻ പോകുകയായിരുന്നവർ
  rationale: μέλλω + infinitive സമീപഭാവിയിലെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. ἀνετάζω ഔദ്യോഗിക ചോദ്യംചെയ്യലിനെ സൂചിപ്പിക്കുന്നു; ചാട്ടവാറുകൊണ്ടുള്ള രീതി മുൻസന്ദർഭത്തിൽ വ്യക്തമാകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: റോമൻ സൈനിക ഉദ്യോഗസ്ഥന്റെ പദവിയെ സാധാരണ മലയാളവായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു; ചരിത്രപരമായ വിശദീകരണം അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: ἐφοβήθη
  choice: ഭയപ്പെട്ടു
  rationale: സ്ഥിതി മനസ്സിലാക്കിയതിനെത്തുടർന്നുണ്ടായ ഉദ്യോഗസ്ഥന്റെ പ്രതികരണം ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιγνοὺς
  choice: മനസ്സിലാക്കിയപ്പോൾ
  rationale: പുതുതായി വ്യക്തമായ അറിവിലെത്തിയ കാരണ-കാലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ῥωμαῖός ἐστιν
  choice: അവൻ ഒരു റോമൻ പൗരനാണെന്ന്
  rationale: ഇവിടെ വംശീയതയല്ല, നിയമപരമായ പൗരപദവിയാണ് പ്രസക്തം. ഗ്രീക്കിലെ വർത്തമാനകാലം പരോക്ഷവാക്യത്തിലും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: αὐτὸν ἦν δεδεκώς
  choice: താൻ അവനെ ബന്ധിച്ചിട്ടുണ്ടെന്ന്
  rationale: perfect participle പൂർത്തിയായ പ്രവൃത്തിയുടെ നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു. ‘താൻ’ എന്നത് ബന്ധിച്ചതിന്റെ കർത്താവ് സൈനികാധിപനാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സ്വയം ചെയ്തതോ ചെയ്യിച്ചതോ എന്ന causative വ്യത്യാസം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
