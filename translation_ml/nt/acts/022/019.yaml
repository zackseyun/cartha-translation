  source_fidelity: 'The main sense is accurately represented: Paul addresses the Lord, emphasizes that the hearers themselves know his former conduct, and describes his repeated imprisoning and beating of believers across synagogues. However, “അപ്പോൾ” (“then”) adds a temporal nuance not expressed by κἀγώ (“and I”); it is best omitted. The imperfect-periphrastic force is adequately conveyed by “ചെയ്തിരുന്നു.”'
