  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: ml
  text: 'ഞാൻ പറഞ്ഞു: “കർത്താവേ, നിന്നിൽ വിശ്വസിക്കുന്നവരെ[b] ഞാൻ ഓരോ സിനഗോഗിലും[a] തടവിലിടുകയും മർദിക്കുകയും ചെയ്തിരുന്നെന്ന് അവർതന്നെ അറിയുന്നുവല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സിനഗോഗുതോറും” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പ്രയോഗം പല സിനഗോഗുകളിലായി ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “നിന്നിൽ ആശ്രയിക്കുന്നവരെ” അല്ലെങ്കിൽ “നിന്നിൽ വിശ്വാസം അർപ്പിക്കുന്നവരെ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: അപ്പോൾ ഞാൻ പറഞ്ഞു
  rationale: καὶ ἐγώ എന്ന സങ്കുചിതരൂപവും εἶπον എന്ന ഭൂതകാലക്രിയയും സംഭാഷണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. ἐγώയുടെ ഊന്നൽ സന്ദർഭത്തിലും ‘ഞാൻ’ എന്ന പ്രയോഗത്തിലും നിലനിൽക്കുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ സംബോധനരൂപം. ഇവിടെ പൗലോസ് യേശുവിനെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരവും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഭാരവും നിലനിർത്തുന്ന പതിവായ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: αὐτοὶ ἐπίστανται
  choice: അവർതന്നെ അറിയുന്നുവല്ലോ
  rationale: αὐτοὶയിലെ ഊന്നൽ ‘അവർതന്നെ’ എന്നു നിലനിർത്തുന്നു. തന്റെ മുൻകാല പ്രവൃത്തികൾ അവർക്കു നേരിട്ടറിയാം എന്ന പൗലോസിന്റെ വാദസ്വരം ‘അറിയുന്നുവല്ലോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: ഞാൻ ... തടവിലിടുകയും മർദിക്കുകയും ചെയ്തിരുന്നു
  rationale: ἤμην എന്ന അപൂർണഭൂതകാലത്തോടുകൂടിയ വർത്തമാന കൃദന്തരൂപങ്ങൾ മുൻകാലത്ത് ആവർത്തിച്ചോ പതിവായോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ചെയ്തിരുന്നു’ ആ തുടർച്ചയായ/പതിവായ ഭാവം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὰς συναγωγάς
  choice: ഓരോ സിനഗോഗിലും
  rationale: κατά + ബഹുവചന കർമവിഭക്തിയുടെ വിതരണാർഥം പല സിനഗോഗുകളിലായി ആവർത്തിച്ച പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ഓരോ സിനഗോഗിലും’ ഇത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: നിന്നിൽ വിശ്വസിക്കുന്നവരെ
  rationale: πιστεύω ἐπί ഇവിടെ യേശുവിലേക്കു directed ആയ വിശ്വാസത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നിന്നിൽ വിശ്വസിക്കുന്നവർ’ സാധാരണവും ദൈവശാസ്ത്രപരമായി അമിതവ്യാഖ്യാനം ചേർക്കാത്തതുമായ രൂപമാണ്.
theological_decisions:
- issue: യേശുവിനെ അഭിസംബോധന ചെയ്യുന്ന κύριος
  choice: കർത്താവേ
  alternative: ഗുരുവേ / യജമാനനേ
  rationale: ‘കർത്താവേ’ ആദരസംബോധനയും സന്ദർഭത്തിലെ ക്രിസ്തുസംബന്ധിയായ ഭാരവും സംരക്ഷിക്കുന്നു; അതേസമയം പാഠം പറയുന്നതിലപ്പുറം പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: πιστεύοντας ἐπὶ σέ എന്നതിലെ വിശ്വാസത്തിന്റെ സ്വഭാവം
  choice: നിന്നിൽ വിശ്വസിക്കുന്നവരെ
  alternative: നിന്നിൽ ആശ്രയിക്കുന്നവരെ / നിന്നിൽ വിശ്വാസം അർപ്പിക്കുന്നവരെ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ വിശ്വാസവും ആശ്രയവും ഉൾക്കൊള്ളാനാകുന്നു. മുഖ്യപാഠത്തിൽ ഏറ്റവും സ്വാഭാവികമായ ‘വിശ്വസിക്കുന്നവർ’ സ്വീകരിക്കുകയും അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുകയും ചെയ്തു.
- issue: പൗലോസിന്റെ മുൻകാല പീഡനത്തിന്റെ ക്രിയാഭാവം
  choice: തടവിലിടുകയും മർദിക്കുകയും ചെയ്തിരുന്നു
  alternative: തടവിലിട്ടു മർദിക്കുമായിരുന്നു
  rationale: ഗ്രീക്കിലെ അപൂർണഭൂതകാല-കൃദന്ത ഘടന തുടരുന്നോ ആവർത്തിക്കുന്നോ ആയ മുൻകാല പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം പതിവായ പ്രവർത്തനത്തെ നിലനിർത്തുന്നു; ബദൽരൂപം ആവർത്തനത്തെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി വ്യക്തമാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി സ്വീകരിച്ചു. യഹൂദ ആരാധനാസ്ഥലത്തെ വ്യക്തമായി തിരിച്ചറിയാൻ ‘സിനഗോഗ്’ ഉപയോഗിച്ചു. ‘അവർതന്നെ’ മൂലപാഠത്തിലെ ഊന്നലും ‘ചെയ്തിരുന്നു’ ആവർത്തിച്ച മുൻകാല പ്രവൃത്തിയുടെ ഭാവവും നിലനിർത്തുന്നു.
