id: ACT.22.1
reference: Acts 22:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατέ μου τῆς πρὸς ὑμᾶς νυνὶ ἀπολογίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: ml
  text: “പുരുഷന്മാരേ, സഹോദരന്മാരേ, പിതാക്കന്മാരേ, ഞാൻ ഇപ്പോൾ നിങ്ങളോടു നടത്തുന്ന എന്റെ പ്രതിവാദം കേൾക്കുവിൻ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ അഭിസംബോധനയിൽ ἄνδρες എന്ന പദം ἀδελφοίയെ ശക്തിപ്പെടുത്തുന്ന ഘടകമായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ ‘പുരുഷന്മാരേ, സഹോദരന്മാരേ’ എന്നു രണ്ടായി വിവർത്തനം ചെയ്യുന്നത് അസ്വാഭാവികമായതിനാൽ, പുരുഷശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന ‘സഹോദരന്മാരേ’ എന്ന രൂപം സ്വാഭാവികമായി ആശയം നൽകുന്നു.
- source_word: πατέρες
  choice: പിതാക്കന്മാരേ
  rationale: പ്രായത്തിലും സ്ഥാനത്തിലും ആദരണീയരായ പുരുഷന്മാരോടുള്ള ബഹുമാനപൂർവമായ അഭിസംബോധനയാണ്; ഔദ്യോഗിക പദവിയായ ‘മൂപ്പന്മാർ’ എന്ന് വ്യാഖ്യാനിക്കാതെ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: ἀκούσατέ
  choice: കേൾക്കുവിൻ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ ഗൗരവവും പൊതുപ്രസംഗത്തിന്റെ ഔപചാരിക ഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: νυνὶ
  choice: ഇപ്പോൾ
  rationale: അഭ്യർഥനയുടെ തത്സമയസ്വഭാവം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀπολογίας
  choice: പ്രതിവാദം
  rationale: ഇവിടെ പദം ഖേദപ്രകടനമല്ല, ആരോപണങ്ങൾക്കുള്ള ഔപചാരികമായ ആത്മപ്രതിരോധ പ്രസംഗമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളോടു നടത്തുന്ന
  rationale: പ്രതിവാദം ശ്രോതാക്കളെ അഭിമുഖീകരിച്ചുള്ളതാണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നിങ്ങളുടെ മുമ്പാകെയുള്ള’ എന്ന നിയമവേദിസൂചന മൂലത്തിൽ ആവശ്യത്തിലധികം ചേർക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ പൊതുസഭയിലെ ആദരപൂർവമായ അഭിസംബോധനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘കേൾക്കുവിൻ’ എന്ന രൂപം ഉദ്ദേശപൂർവം ഔപചാരികമായി നിലനിർത്തി.
