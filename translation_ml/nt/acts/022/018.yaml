id: ACT.22.18
reference: Acts 22:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: ml
  text: '‘അവൻ എന്നോടു പറയുന്നതായി ഞാൻ കണ്ടു: “തിടുക്കപ്പെടുക; യെരൂശലേമിൽനിന്ന് ഉടൻ പുറത്തുകടക്കുക; കാരണം എന്നെക്കുറിച്ചുള്ള നിന്റെ സാക്ഷ്യം അവർ സ്വീകരിക്കുകയില്ല.”’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: ഞാൻ കണ്ടു
  rationale: രൂപത്തിൽ അനന്തക്രിയയാണെങ്കിലും, ദർശനത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ വിവരണം തുടരുന്ന ഈ ഘടനയിൽ മലയാളത്തിൽ സമാപികാക്രിയ സ്വാഭാവികമാണ്.
- source_word: αὐτὸν λέγοντά μοι
  choice: അദ്ദേഹം എന്നോടു പറയുന്നതായി
  rationale: സന്ദർഭത്തിലെ കർത്താവിനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്. മൂലപാഠത്തിലെ സർവനാമം നിലനിർത്തുകയും വർത്തമാനകൃദന്തരൂപത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പകരുകയും ചെയ്യുന്നു.
- source_word: Σπεῦσον καὶ ἔξελθε ἐν τάχει
  choice: വേഗം, ഉടൻതന്നെ ... പുറത്തുപോകുക
  rationale: Σπεῦσον എന്ന അടിയന്തര ആജ്ഞയും ἐν τάχει എന്ന അധിക ഊന്നലും രണ്ടും നിലനിർത്താൻ ‘വേഗം’ എന്നും ‘ഉടൻതന്നെ’ എന്നും ഉപയോഗിച്ചു.
- source_word: ἐξ Ἰερουσαλήμ
  choice: യെരൂശലേമിൽനിന്ന് പുറത്തുപോകുക
  rationale: ἐξ സൂചിപ്പിക്കുന്ന നഗരത്തിന് പുറത്തേക്കുള്ള ചലനം വ്യക്തമായി പകരുന്നു.
- source_word: διότι
  choice: കാരണം
  rationale: ആജ്ഞയ്ക്കുള്ള കാരണം വ്യക്തമാക്കുന്ന സ്വാഭാവിക ആധുനിക ബന്ധപദം.
- source_word: οὐ παραδέξονταί
  choice: അവർ സ്വീകരിക്കുകയില്ല
  rationale: παραδέχομαι ഇവിടെ അനുകൂലമായി അംഗീകരിക്കുക അഥവാ സ്വീകരിക്കുക എന്നർഥം നൽകുന്നു; ‘സാക്ഷ്യം’ എന്ന കർമത്തോടൊപ്പം ‘സ്വീകരിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: σου μαρτυρίαν περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ചുള്ള നിന്റെ സാക്ഷ്യം
  rationale: μαρτυρίαയുടെ സാക്ഷ്യ/സാക്ഷിമൊഴി എന്ന അർഥവും περίയുടെ ‘കുറിച്ച്’ എന്ന ബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദർശനത്തിൽ സംസാരിക്കുന്ന αὐτόν എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘അദ്ദേഹം’ എന്ന സർവനാമം നിലനിർത്തി.
  alternative: മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ അല്ലെങ്കിൽ ‘യേശു’ എന്ന് വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം സംസാരിക്കുന്നയാളെ തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം സർവനാമമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ നാമം ചേർക്കാതെ സർവനാമം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വേഗം, ഉടൻതന്നെ’ എന്ന ഇരട്ട പ്രയോഗം മൂലപാഠത്തിലെ ഇരട്ട അടിയന്തരത സംരക്ഷിക്കുന്നു. ഇംഗ്ലീഷ് കരടിലെ [a] കുറിപ്പ് ‘accept/receive’ എന്ന ഇംഗ്ലീഷ് പദവ്യത്യാസത്തെക്കുറിച്ചുള്ളതാണ്; മലയാളത്തിൽ രണ്ടിനും ഇവിടെ ഏറ്റവും സ്വാഭാവികമായ തുല്യം ‘സ്വീകരിക്കുക’ ആയതിനാൽ കൃത്രിമമായ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
