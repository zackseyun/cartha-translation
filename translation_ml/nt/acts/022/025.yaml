id: ACT.22.25
reference: Acts 22:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: ml
  text: 'എന്നാൽ അവർ തോൽവാറുകൾകൊണ്ട് അവനെ നീട്ടിക്കെട്ടിയപ്പോൾ, പൗലോസ് അടുത്തുനിന്നിരുന്ന ശതാധിപനോടു പറഞ്ഞു: “കുറ്റം വിധിക്കപ്പെട്ടിട്ടില്ലാത്ത ഒരു റോമൻ പൗരനെ ചാട്ടവാറടിക്കാൻ നിങ്ങൾക്കു നിയമപരമായി അനുവാദമുണ്ടോ?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: തോൽവാറുകൾകൊണ്ട് അവനെ വലിച്ചുകെട്ടിയപ്പോൾ
  rationale: പ്രഹരത്തിനായി പൗലോസിനെ തോൽവാറുകൾ ഉപയോഗിച്ച് നീട്ടിക്കെട്ടിയ ശാരീരിക നടപടിയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑστῶτα
  choice: അടുത്തുനിന്നിരുന്ന
  rationale: ശതാധിപൻ സമീപത്ത് സന്നിഹിതനായി നിന്നിരുന്നുവെന്ന ദൃശ്യസന്ദർഭം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἑκατόνταρχον
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈനികപദവിക്കുള്ള അംഗീകൃതവും കൃത്യവുമായ മലയാള പദം.
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: ഒരു റോമൻ പൗരനെ
  rationale: അക്ഷരാർഥത്തിൽ ‘റോമൻ മനുഷ്യൻ’ എന്നാണെങ്കിലും, നിയമപരമായ ഈ സന്ദർഭത്തിൽ റോമൻ പൗരത്വം നൽകുന്ന സംരക്ഷിത പദവിയാണ് പ്രധാനം; ‘റോമൻ പൗരൻ’ അത് സ്വാഭാവികമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: ἀκατάκριτον
  choice: കുറ്റം വിധിക്കപ്പെട്ടിട്ടില്ലാത്ത
  rationale: ന്യായവിധിയിലൂടെ കുറ്റക്കാരനായി വിധിക്കപ്പെട്ടിട്ടില്ലെന്ന നിയമപരമായ ആശയം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔξεστιν
  choice: നിയമപരമായി അനുവാദമുണ്ടോ
  rationale: വെറും പൊതുവായ അനുമതിയല്ല, നിയമം അനുവദിക്കുന്നുണ്ടോ എന്ന പൗലോസിന്റെ ചോദ്യം വ്യക്തമാക്കുന്നു.
- source_word: μαστίζειν
  choice: ചാട്ടവാറുകൊണ്ട് അടിക്കാൻ
  rationale: കഠിനമായ ചാട്ടവാറടി എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ ചോദ്യത്തിന്റെ മൂർച്ചയും സംഭവത്തിന്റെ ശാരീരികതയും നിലനിർത്തി; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
