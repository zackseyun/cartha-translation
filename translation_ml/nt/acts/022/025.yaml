  to: 'എന്നാൽ അവർ തോൽവാറുകൾകൊണ്ട് അവനെ നീട്ടിക്കെട്ടിയപ്പോൾ, പൗലോസ് അടുത്തുനിന്നിരുന്ന ശതാധിപനോടു പറഞ്ഞു: “കുറ്റം വിധിക്കപ്പെട്ടിട്ടില്ലാത്ത ഒരു റോമൻ പൗരനെ ചാട്ടവാറടിക്കാൻ നിങ്ങൾക്കു നിയമപരമായി അനുവാദമുണ്ടോ?”'
  rationale: ‘വലിച്ചുകെട്ടിയപ്പോൾ’ എന്നതിനു പകരം ‘നീട്ടിക്കെട്ടിയപ്പോൾ’ ഉപയോഗിച്ച് പ്രഹരത്തിനായി പൗലോസിനെ നീട്ടിയിടുന്ന προέτειναν എന്ന ക്രിയയുടെ അർഥം കൂടുതൽ കൃത്യമായി നിലനിർത്തി. മറ്റ് പദങ്ങൾ ഉറവിടവാചകത്തിനും ആധുനിക നിലവാരമുള്ള മലയാളത്തിനും യോജിച്ചതാണ്.
