revisions:
- from: മഹാപുരോഹിതനും മൂപ്പന്മാരുടെ സഭ മുഴുവനും എനിക്കുവേണ്ടി സാക്ഷ്യം പറയാൻ കഴിയും. അവരിൽനിന്ന് ദമസ്കൊസിലെ സഹോദരന്മാർക്കുള്ള കത്തുകളും വാങ്ങി, അവിടെയുള്ളവരെയും ബന്ധിച്ച് ശിക്ഷിക്കപ്പെടേണ്ടതിന് യെരൂശലേമിലേക്കു കൊണ്ടുവരാൻ ഞാൻ അങ്ങോട്ടു യാത്ര ചെയ്യുകയായിരുന്നു.[a]
  to: ഇതിന് മഹാപുരോഹിതനും മൂപ്പന്മാരുടെ സമിതി മുഴുവനും എനിക്കുവേണ്ടി സാക്ഷ്യം പറയാൻ കഴിയും. അവരിൽനിന്ന് ദമസ്കൊസിലെ സഹോദരന്മാർക്കുള്ള കത്തുകളും വാങ്ങി, അവിടെ ഉണ്ടായിരുന്ന ബന്ധിക്കപ്പെട്ടവരെയും യെരൂശലേമിലേക്കു കൊണ്ടുവരാൻ, അവർ ശിക്ഷിക്കപ്പെടേണ്ടതിനായി ഞാൻ അങ്ങോട്ടു യാത്ര ചെയ്യുകയായിരുന്നു.[a]
  rationale: The revision explicitly marks the high priest and elders as corroborating Paul’s preceding statement, uses “സമിതി” for the council of elders, and changes “ബന്ധിച്ച്” to “ബന്ധിക്കപ്പെട്ട” so that the Greek perfect passive participle is represented as the condition of the persons Paul intended to take to Jerusalem. The footnote is retained with its original anchor and scope.
