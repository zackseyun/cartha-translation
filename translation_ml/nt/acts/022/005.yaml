id: ACT.22.5
reference: Acts 22:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: ml
  text: ഇതിന് മഹാപുരോഹിതനും മൂപ്പന്മാരുടെ സമിതി മുഴുവനും എനിക്കുവേണ്ടി സാക്ഷ്യം പറയാൻ കഴിയും. അവരിൽനിന്ന് ദമസ്കൊസിലെ സഹോദരന്മാർക്കുള്ള കത്തുകളും വാങ്ങി, അവിടെ ഉണ്ടായിരുന്ന ബന്ധിക്കപ്പെട്ടവരെയും യെരൂശലേമിലേക്കു കൊണ്ടുവരാൻ, അവർ ശിക്ഷിക്കപ്പെടേണ്ടതിനായി ഞാൻ അങ്ങോട്ടു യാത്ര ചെയ്യുകയായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാർക്ക്.” ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ ചില സന്ദർഭങ്ങളിൽ ഈ പദം വിശാലമായ ഒരു സമൂഹത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: -ഉം ... -ഉം
  rationale: പൗലൊസിന്റെ മുൻപ്രസ്താവനയെ സ്ഥിരീകരിക്കുന്ന സാക്ഷികളായി മഹാപുരോഹിതനെയും മൂപ്പന്മാരുടെ സഭയെയും അവതരിപ്പിക്കുന്ന താരതമ്യ-സ്ഥിരീകരണ ഭാവം മലയാളത്തിലെ സംയോജകപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി അറിയിച്ചു.
- source_word: ὁ ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഈ ചരിത്രസന്ദർഭത്തിലെ മുഖ്യ പുരോഹിതാധികാരിക്കുള്ള സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: μαρτυρεῖ μοι
  choice: എനിക്കുവേണ്ടി സാക്ഷ്യം പറയാൻ കഴിയും
  rationale: പൗലൊസിന്റെ അവകാശവാദത്തെ അവർക്ക് സ്ഥിരീകരിക്കാനാകുമെന്ന സന്ദർഭാർഥം വ്യക്തമായി അറിയിക്കുന്നു; μοι എന്ന ദത്തിവിന്റെ പിന്തുണാസൂചനയും നിലനിർത്തുന്നു.
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: മൂപ്പന്മാരുടെ സഭ മുഴുവനും
  rationale: വെറും പ്രായമുള്ള ആളുകളെയല്ല, മൂപ്പന്മാരുടെ സംഘടിത സമിതിയെയാണ് πρεσβυτέριον സൂചിപ്പിക്കുന്നത്; സാങ്കേതികവും അപരിചിതവുമായ പദം ഒഴിവാക്കി.
- source_word: ἐπιστολάς
  choice: കത്തുകൾ
  rationale: അടിസ്ഥാന ലെക്സിക്കൽ അർഥം നിലനിർത്തുന്നു; അവ അധികാരപത്രങ്ങളായിരുന്നുവെന്നത് സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാം.
- source_word: πρὸς τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാർക്കുള്ള
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; വിശാലമായ സമൂഹത്തെയും ഉൾക്കൊള്ളാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπορευόμην
  choice: ഞാൻ അങ്ങോട്ടു യാത്ര ചെയ്യുകയായിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ നടന്നുകൊണ്ടിരുന്ന യാത്രാഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄξων
  choice: കൊണ്ടുവരാൻ
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള ഭാവികാല പങ്കാളിക്രിയയുടെ ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἐκεῖσε ὄντας δεδεμένους
  choice: അവിടെയുള്ളവരെയും ബന്ധിച്ച്
  rationale: ദമസ്കൊസിൽ ഉണ്ടായിരുന്നവരെ തടവുകാരാക്കി കൊണ്ടുവരാനുള്ള ഉദ്ദേശ്യം സ്വാഭാവികമായി നൽകുന്നു; ബന്ധനത്തിന്റെ പ്രത്യേക രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἵνα τιμωρηθῶσιν
  choice: ശിക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: ശിക്ഷ ലക്ഷ്യമാക്കിയ നിയമപരമായ വൈരുദ്ധ്യാഭിപ്രായം നിലനിർത്തുന്നു; ഗ്രീക്ക് പറയാത്ത പ്രത്യേക ശിക്ഷ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἀδελφοί എന്ന പുല്ലിംഗ ബഹുവചനം വിശാലമായ ഒരു സമൂഹത്തെയും സൂചിപ്പിക്കാവുന്നത്
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹയഹൂദർ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി. സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന സമൂഹപരമായ പ്രയോഗസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു; 'സഹയഹൂദർ' എന്ന സന്ദർഭവ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തില്ല.
- issue: καὶ τοὺς ἐκεῖσε ὄντας എന്നതിലെ καί
  choice: അവിടെയുള്ളവരെയും
  alternative: അവിടെയുള്ളവരെ
  rationale: καί നൽകുന്ന 'കൂടി/യും' എന്ന ഉൾപ്പെടുത്തൽഭാവം '-യും' വഴി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. സഭ, മഹാപുരോഹിതൻ, ശിക്ഷിക്കപ്പെടുക തുടങ്ങിയ പരിചിതമായ ബൈബിൾ-നിയമ പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ പഴമൊഴിശൈലിയും വിഭാഗീയ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
