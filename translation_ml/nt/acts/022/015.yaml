id: ACT.22.15
reference: Acts 22:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, നീ കണ്ടതും കേട്ടതുമായ കാര്യങ്ങളെക്കുറിച്ച് എല്ലാവരോടും അവനുവേണ്ടി[b] സാക്ഷിയായിരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എല്ലാ മനുഷ്യരോടും.’ ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അവനോട്.’ ഇവിടെ ഗ്രീക്കിലെ ദത്തിവ് അടുത്ത ബന്ധമുള്ള ഈ രണ്ടുവിധത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക നിയമനത്തിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
- source_word: ἔσῃ
  choice: ആയിരിക്കും
  rationale: εἰμί എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ആധുനിക മലയാളത്തിൽ ലളിതമായ ഭാവികാലമായി നൽകുന്നു.
- source_word: μάρτυς
  choice: സാക്ഷി
  rationale: കണ്ടതും കേട്ടതും സാക്ഷ്യപ്പെടുത്തുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും പരിചിതവുമായ പദം.
- source_word: αὐτῷ
  choice: അവനുവേണ്ടി
  rationale: ആ വ്യക്തിയെ പ്രതിനിധീകരിച്ചോ അവന്റെ പക്ഷത്തുനിന്നോ സാക്ഷ്യം വഹിക്കുന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ദത്തിവിന്റെ അടുത്ത ബന്ധമുള്ള മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: എല്ലാ മനുഷ്യരോടും
  rationale: πρός സൂചിപ്പിക്കുന്ന സാക്ഷ്യത്തിന്റെ ശ്രോതാക്കളിലേക്കുള്ള ദിശയും ἀνθρώπους എന്ന പദത്തിന്റെ പൊതുവായ മാനവസൂചനയും നിലനിർത്തുന്നു.
- source_word: ὧν
  choice: സംബന്ധിച്ച്
  rationale: തുടർന്നുള്ള ‘കണ്ടതും കേട്ടതും’ സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑώρακας
  choice: നീ കണ്ടതും
  rationale: പൗലൊസിന്റെ നേരിട്ടുള്ള അനുഭവത്തെ സാക്ഷ്യത്തിന്റെ അടിസ്ഥാനമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ സന്ദർഭസഹജമായ ഭൂതകാലരൂപം ഉപയോഗിക്കുന്നു.
- source_word: καὶ ἤκουσας
  choice: കേട്ടതും
  rationale: കാണുകയും കേൾക്കുകയും ചെയ്ത അനുഭവങ്ങളെ സമാന്തരമായി ചേർത്ത് മൂലപാഠത്തിന്റെ ഏകോപനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ നിയോഗത്തിലെ αὐτῷ എന്ന സർവനാമത്തിന്റെ ബന്ധം
  choice: ‘അവനുവേണ്ടി’—കർത്താവായ യേശുവിനുവേണ്ടി പൗലൊസ് സാക്ഷ്യം വഹിക്കും.
  alternative: ‘അവനോട്’—ദത്തിവിനെ കൂടുതൽ നേരിട്ടും വ്യാഖ്യാനപരമായി കുറച്ചും നൽകാം.
  rationale: സന്ദർഭത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെക്കുറിച്ചുള്ള സാക്ഷ്യനിയോഗമാണ് ഉദ്ദേശിക്കുന്നത്. ‘അവനുവേണ്ടി’ എന്നത് പ്രതിനിധിത്വപരമായ സാക്ഷ്യത്തെ സ്വാഭാവികമായി അറിയിക്കുമ്പോൾ, ദത്തിവിന്റെ യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം ‘എന്തെന്നാൽ’ എന്നതിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ ബന്ധപ്പെട്ടിരിക്കുന്ന പദസമുച്ചയങ്ങൾക്ക് തൊട്ടുപിന്നാലെ ചേർത്തിരിക്കുന്നു.
