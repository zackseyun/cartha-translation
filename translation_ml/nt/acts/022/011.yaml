id: ACT.22.11
reference: Acts 22:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: ml
  text: ആ വെളിച്ചത്തിന്റെ തേജസ്സുനിമിത്തം എനിക്ക് കാണാൻ കഴിയാതിരുന്നതിനാൽ, എന്നോടുകൂടെ ഉണ്ടായിരുന്നവരാൽ കൈപിടിച്ചു നടത്തപ്പെട്ട് ഞാൻ ദമസ്കൊസിൽ എത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ആ വെളിച്ചത്തിന്റെ മഹത്ത്വം നിമിത്തം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: കാണാൻ കഴിയാതിരുന്നു
  rationale: സന്ദർഭത്തിൽ ഇത് വെളിച്ചത്തെ നോക്കാനാകാത്തതിനെക്കാൾ, ആ പ്രകാശം മൂലം കാഴ്ച നഷ്ടപ്പെട്ട പ്രായോഗിക ഫലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: ആ വെളിച്ചത്തിന്റെ തേജസ്സുനിമിത്തം
  rationale: δόξα ഇവിടെ അന്ധത വരുത്തിയ ദൃശ്യപ്രഭയെ സൂചിപ്പിക്കുന്നു. ‘തേജസ്സ്’ എന്നത് ‘മഹത്ത്വം’ എന്ന അർഥസാധ്യത പൂർണമായി ഇല്ലാതാക്കാതെ പ്രകാശത്തിന്റെ ഉജ്ജ്വലത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: χειραγωγούμενος
  choice: എന്നെ കൈപിടിച്ചു നടത്തി
  rationale: കൈപിടിച്ച് നയിക്കുക എന്ന പങ്കാളിത്തരൂപത്തിലെ വ്യക്തമായ ദൃശ്യവിശദാംശം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: എന്നോടുകൂടെ ഉണ്ടായിരുന്നവർ
  rationale: സύνειμι എന്നതിലെ ‘കൂടെ ഉണ്ടായിരിക്കുക/അനുഗമിക്കുക’ എന്ന അർഥം, അവരെ ഔപചാരികമായ ഒരു സംഘമായി വ്യാഖ്യാനിക്കാതെ നേരിട്ട് പകരുന്നു.
- source_word: ἦλθον εἰς Δαμασκόν
  choice: ദമസ്കൊസിൽ എത്തി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ ‘എത്തി’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ὡς δὲ
  choice: കഴിയാതിരുന്നതിനാൽ … അങ്ങനെ
  rationale: വിവരണത്തിന്റെ തുടർച്ചയും കാഴ്ചയില്ലായ്മയും കൈപിടിച്ചു നടത്തപ്പെട്ടതും തമ്മിലുള്ള സന്ദർഭജന്യ കാരണബന്ധവും മലയാളവാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിലെ δόξα
  choice: തേജസ്സ്
  alternative: മഹത്ത്വം; ഉജ്ജ്വലത
  rationale: ഇവിടെ δόξα അന്ധത വരുത്തുന്ന വെളിച്ചത്തിന്റെ ദൃശ്യപ്രഭയായി പ്രവർത്തിക്കുന്നു. ‘തേജസ്സ്’ ഭൗതിക ഉജ്ജ്വലതയും അസാധാരണമായ മഹിമയും ഒരുമിച്ച് സൂചിപ്പിക്കുമ്പോൾ, കൂടുതൽ പദാനുപദമായ ‘മഹത്ത്വം’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കൈപിടിച്ചു നടത്തി’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ സജീവ ദൃശ്യവിശദാംശം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
