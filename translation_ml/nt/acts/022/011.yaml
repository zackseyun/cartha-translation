    reason: lexical_alternative
  revision_rationale: The revision preserves the causal sense of ὡς δέ and ἀπό, renders ἐνέβλεπον as practical inability to see, and makes χειραγωγούμενος syntactically dependent on the arrival in Damascus, as in the Greek. It retains the draft’s sound contextual rendering of δόξα as “തേജസ്സ്” and the alternative “മഹത്ത്വം” in the footnote.
