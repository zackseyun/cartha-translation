id: ACT.22.12
reference: Acts 22:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἁνανίας δέ τις ἀνὴρ ⸀εὐλαβὴς κατὰ τὸν νόμον μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: ml
  text: ന്യായപ്രമാണപ്രകാരം ഭക്തനും അവിടെ താമസിക്കുന്ന എല്ലാ യെഹൂദന്മാരാലും നല്ല സാക്ഷ്യം ലഭിച്ചവനുമായ അനന്യാസ് എന്നൊരാൾ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁνανίας
  choice: അനന്യാസ്
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം അതിന്റെ ധർമ്മം നിർവഹിക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ പോലുള്ള സമയസൂചകപദം ചേർത്തില്ല.
- source_word: τις ἀνὴρ
  choice: എന്നൊരാൾ
  rationale: മുമ്പ് പരിചയപ്പെടുത്തിയിട്ടില്ലാത്ത, എന്നാൽ നിർദിഷ്ടനായ ഒരു പുരുഷനെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὐλαβής
  choice: ഭക്തൻ
  rationale: ദൈവഭയവും ശ്രദ്ധാപൂർവമായ മതാനുഷ്ഠാനവും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പദം.
- source_word: κατὰ τὸν νόμον
  choice: ന്യായപ്രമാണപ്രകാരം
  rationale: മോശെയുടെ ന്യായപ്രമാണത്തോടനുസരിച്ചുള്ള ഭക്തിയെയാണ് ഈ പ്രയോഗം വ്യക്തമാക്കുന്നത്.
- source_word: μαρτυρούμενος
  choice: നല്ല പേരുള്ളവൻ
  rationale: മറ്റുള്ളവർ അനന്യാസിനെക്കുറിച്ച് അനുകൂല സാക്ഷ്യം നൽകിയിരുന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പൊതുസമ്മതമായ നല്ല കീർത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑπὸ πάντων
  choice: എല്ലാവരുടെയും ഇടയിൽ
  rationale: ഗ്രീക്കിലെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് ‘നല്ല പേരുള്ളവൻ’ എന്ന മലയാള പ്രയോഗത്തിന് യോജിച്ച ബന്ധരൂപം ഉപയോഗിച്ചു.
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: അവിടെ താമസിച്ചിരുന്ന യെഹൂദന്മാർ
  rationale: κατοικούντων സ്ഥിരതാമസത്തെ സൂചിപ്പിക്കുന്നു; സ്ഥലം സന്ദർഭത്തിൽ ദമസ്കൊസ് ആയതിനാൽ അതിനെ അനാവശ്യമായി ആവർത്തിക്കാതെ ‘അവിടെ’ എന്നു നൽകി. Ἰουδαίων ഇവിടെ പ്രധാനമായി മതസാമുദായിക തിരിച്ചറിയലാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: Ἰουδαίων എന്നതിന്റെ അർഥം
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യദേശക്കാർ
  rationale: ദമസ്കൊസിൽ താമസിക്കുന്ന യെഹൂദസമൂഹത്തിനിടയിലെ അനന്യാസിന്റെ കീർത്തിയാണ് സന്ദർഭവിഷയം; യെഹൂദ്യയിൽനിന്നുള്ള ഭൗഗോളിക ഉത്ഭവമല്ല പ്രധാന ഊന്നൽ. എങ്കിലും വംശീയ-ഭൗഗോളിക വായനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഗ്രീക്ക് വാക്യഘടന നിലനിർത്താൻ അവസാനം അൽപവിരാമം ഉപയോഗിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത സ്വതന്ത്ര ക്രിയ ചേർത്തിട്ടില്ല.
