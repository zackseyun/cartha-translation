translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂന്നു സമകാലിക പ്രവൃത്തികളെയും ‘-കയും’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി; വാക്യം അടുത്ത വാക്യവുമായി ചേരുന്ന ആശ്രിതഘടനയായതിനാൽ അവസാനത്തിൽ കോമയും അടിക്കുറിപ്പ് ചിഹ്നവും സംരക്ഷിച്ചു.
