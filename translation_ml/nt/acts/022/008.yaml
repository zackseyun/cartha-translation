  to: 'ഞാൻ മറുപടി പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് ആരാണ്?” അവൻ എന്നോടു പറഞ്ഞു: “നീ പീഡിപ്പിക്കുന്ന നസറായനായ[b] യേശു ഞാനാണ്.”'
