id: ACT.22.8
reference: Acts 22:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: ml
  text: 'ഞാൻ മറുപടി പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് ആരാണ്?” അവൻ എന്നോടു പറഞ്ഞു: “നീ പീഡിപ്പിക്കുന്ന നസറായനായ[b] യേശു ഞാനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അയ്യാ” എന്ന ആദരസംബോധന. ഗ്രീക്കിലെ κύριε എന്ന പദത്തിന് “കർത്താവേ” എന്നും ആദരപൂർവമായ സംബോധന എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “നസറെത്തിലെ യേശു” അല്ലെങ്കിൽ “നസറായൻ യേശു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: ചോദിച്ചു
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘മറുപടി പറഞ്ഞു’ എന്നാണെങ്കിലും, ഇവിടെ നേരിട്ടുള്ള മറുപടി ഒരു ചോദ്യമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നു.
- source_word: Τίς εἶ
  choice: അങ്ങ് ആരാണ്?
  rationale: നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവിക മലയാളക്രമത്തിൽ അവതരിപ്പിക്കുന്നു; κύριε എന്ന ആദരസംബോധനത്തോടു പൊരുത്തപ്പെടാൻ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവ് ദൈവശാസ്ത്രപരമായ വിവർത്തനം നിലനിർത്തുന്നു; ശൗൽ സംസാരിക്കുന്നവന്റെ വ്യക്തിത്വം ഇനിയും തിരിച്ചറിഞ്ഞിട്ടില്ലാത്തതിനാൽ ആദരസൂചകമായ മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: അവൻ എന്നോടു പറഞ്ഞു
  rationale: λέγω πρὸς എന്ന പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം; τεയുടെ ബന്ധകബലം വാക്യപ്രവാഹത്തിൽ പ്രകടമാകുന്നു.
- source_word: Ἐγώ εἰμι
  choice: ഞാനാണ്
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ ഊന്നലോടെയുള്ള സ്വയംതിരിച്ചറിയിക്കൽ; ഗ്രീക്കിലെ ἐγώ എന്ന പ്രത്യക്ഷ സർവനാമത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: മലയാളത്തിലെ സ്ഥിരപ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം.
- source_word: ὁ Ναζωραῖος
  choice: നസറായനായ
  rationale: സ്ഥലബന്ധം സൂചിപ്പിക്കുന്ന വിശേഷണരൂപമായ Ναζωραῖος-നെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മറ്റ് സാധുവായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὃν σὺ διώκεις
  choice: നീ പീഡിപ്പിക്കുന്ന
  rationale: ഇവിടെ διώκω ശത്രുതാപരമായ പീഡനം എന്ന അർഥത്തിലാണ്; വർത്തമാനകാലത്തിന്റെ തുടരുന്ന പ്രവൃത്തി മലയാള ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശൗൽ ഉപയോഗിക്കുന്ന κύριε എന്ന സംബോധനയുടെ അർഥം
  choice: കർത്താവേ
  alternative: യജമാനനേ / പ്രഭോ എന്ന ആദരസംബോധന
  rationale: ‘കർത്താവ്’ എന്ന പതിവ് വിവർത്തനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. എന്നാൽ ഈ ഘട്ടത്തിൽ സംസാരിക്കുന്നവൻ ആരെന്നു ശൗലിന് വ്യക്തമായിട്ടില്ലാത്തതിനാൽ, വെറും ആദരസംബോധനയായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘അങ്ങ്’ ആദരസംബോധനയുടെ സ്വാഭാവികത നിലനിർത്തുന്നു; ‘നീ’ യേശുവിന്റെ നേരിട്ടുള്ള ഏകവചന അഭിസംബോധന വ്യക്തമാക്കുന്നു.
