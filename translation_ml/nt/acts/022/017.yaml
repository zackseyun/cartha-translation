revisions:
- from: ഞാൻ യെരൂശലേമിലേക്കു മടങ്ങിവന്നശേഷം ദൈവാലയത്തിൽ[a] പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, എനിക്ക് ഒരു ദർശനാവസ്ഥ ഉണ്ടായി[b].
  to: 'ഞാൻ യെരൂശലേമിലേക്കു മടങ്ങിവന്നശേഷം ദൈവാലയത്തിൽ[a] പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, എനിക്കിങ്ങനെ സംഭവിച്ചു: ഞാൻ ഒരു പരവശാവസ്ഥയിലായി[b].'
  rationale: The revision retains the antecedent return, the simultaneous prayer, and the temple-precinct sense. It restores the narrative event formula in idiomatic Malayalam («എനിക്കിങ്ങനെ സംഭവിച്ചു») and renders ἐκστάσει with the less interpretive «പരവശാവസ്ഥ», while the footnote records a natural alternative and explains the Greek state-entry idiom without asserting more than the text does.
