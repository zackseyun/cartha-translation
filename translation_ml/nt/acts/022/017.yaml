id: ACT.22.17
reference: Acts 22:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: ml
  text: 'ഞാൻ യെരൂശലേമിലേക്കു മടങ്ങിവന്നശേഷം ദൈവാലയത്തിൽ[a] പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, എനിക്കിങ്ങനെ സംഭവിച്ചു: ഞാൻ ഒരു പരവശാവസ്ഥയിലായി[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദം ആലയത്തിന്റെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ആലയസമുച്ചയത്തെയോ അതിന്റെ പ്രാകാരങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘ഞാൻ ഒരു മയക്കാവസ്ഥയിലായി.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പരവശാവസ്ഥയിൽ ആകുക’ എന്നാണ്; ഒരു അസാധാരണ ബോധാവസ്ഥയിലേക്കു പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: എനിക്ക് … ഉണ്ടായി
  rationale: സംഭവത്തിന്റെ അനുഭവകർത്താവായി പൗലോസിനെ സൂചിപ്പിക്കുന്ന μοι എന്ന ദത്തിവും സംഭവത്തെ അവതരിപ്പിക്കുന്ന ἐγένετο δέ എന്ന പ്രയോഗവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒന്നിച്ചുപ്രകടിപ്പിക്കുന്നു.
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: ഞാൻ യെരൂശലേമിലേക്കു മടങ്ങിവന്നശേഷം
  rationale: അയോറിസ്റ്റ് കൃദന്തം മുഖ്യസംഭവത്തിനു മുമ്പു നടന്ന മടങ്ങിവരവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മടങ്ങിവന്നശേഷം’ കാലക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: καὶ προσευχομένου μου
  choice: പ്രാർഥിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജെനിറ്റീവ് അബ്സല്യൂട്ട് മുഖ്യസംഭവത്തോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം അതിന്റെ തുടർച്ചയും സമകാലികതയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദൈവാലയത്തിൽ
  rationale: ἱερόν ആലയത്തിന്റെ അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ആലയസമുച്ചയത്തെയാകെ സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിനായി പൊതുവായ പദം മുഖ്യവാചകത്തിൽ നൽകി കൃത്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: എനിക്ക് ഒരു ദർശനാവസ്ഥ ഉണ്ടായി
  rationale: γίνομαι + ἐν ἐκστάσει ഒരു പ്രത്യേക ബോധാവസ്ഥയിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ദർശനാവസ്ഥ’ സന്ദർഭത്തിലെ ദർശനസ്വഭാവം അറിയിക്കുമ്പോഴും അതിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ἐκστάσει സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ അനുഭവത്തിന്റെ സ്വഭാവം
  choice: ദർശനാവസ്ഥ
  alternative: പരവശാവസ്ഥ / മയക്കം
  rationale: വാക്യം പ്രാർഥനയ്ക്കിടയിലെ അസാധാരണ ദർശനാനുഭവം റിപ്പോർട്ട് ചെയ്യുന്നു; എന്നാൽ അതിന്റെ മാനസികമോ ശാരീരികമോ ആയ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ അനുഭവം നിഷേധിക്കാതെയും അതിനപ്പുറം സിദ്ധാന്തവൽക്കരിക്കാതെയും നിഷ്പക്ഷമായ പദം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘യെരൂശലേം,’ ‘ദൈവാലയം,’ ‘പ്രാർഥിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപരിചിതമോ അത്യന്തം പഴക്കമുള്ളതോ ആയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി.
