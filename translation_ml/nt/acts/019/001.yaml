source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: ml
  text: അപ്പൊല്ലോസ് കൊരിന്തിൽ ആയിരിക്കുമ്പോൾ, പൗലോസ് ഉൾനാടൻ പ്രദേശങ്ങളിലൂടെ കടന്ന് എഫെസൊസിൽ എത്തുകയും അവിടെ ചില ശിഷ്യന്മാരെ[a] കണ്ടെത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ശിഷ്യന്മാർ’ ആരുടെ ശിഷ്യന്മാരാണെന്ന് വ്യക്തമാക്കിയിട്ടില്ല; തുടർന്നുള്ള വാക്യങ്ങൾ അവർ യോഹന്നാന്റെ സ്നാനവുമായി ബന്ധപ്പെട്ടവരായിരുന്നെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: സംഭവവിവരണം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ഇത് ലൂക്കോസിന്റെ ആഖ്യാനപരമായ സംക്രമണപ്രയോഗമാണ്. മലയാളത്തിൽ ‘സംഭവിച്ചതെന്തെന്നാൽ’ എന്നു യാന്ത്രികമായി ചേർക്കുന്നത് ഭാരമുള്ളതിനാൽ, തുടർന്നുള്ള സംഭവവിവരണത്തിന്റെ ഘടനയിൽ അതിന്റെ പ്രവർത്തനം ഉൾപ്പെടുത്തി.
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: അപ്പൊല്ലോസ് കൊരിന്തിൽ ആയിരിക്കുമ്പോൾ
  rationale: ἐν τῷ സഹിതമുള്ള articular infinitive ഒരേ സമയത്ത് നടക്കുന്ന കാര്യം സൂചിപ്പിക്കുന്നു; ‘ആയിരിക്കുമ്പോൾ’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: ഉൾനാടൻ പ്രദേശങ്ങളിലൂടെ കടന്ന്
  rationale: ἀνωτερικά എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മുകളിലുള്ള’ എന്നർഥമുണ്ടെങ്കിലും, ഇവിടെ തീരദേശപാതയ്ക്കു പകരമുള്ള ഉൾനാടൻ/ഉയർന്ന പ്രദേശങ്ങളിലൂടെയുള്ള യാത്രയാണ് സാധ്യതയേറിയ ഭൂമിശാസ്ത്രസൂചന.
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: എഫെസൊസിൽ എത്തുകയും
  rationale: നഗരത്തിലേക്കുള്ള ചലനത്തിന്റെ പൂർത്തീകരണം മലയാളത്തിൽ ‘എത്തി’ എന്നതിലൂടെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ εὑρεῖν
  choice: കണ്ടെത്തുകയും ചെയ്തു
  rationale: മുൻ ക്രിയയോട് ഏകോപിതമായ infinitive-നെ മലയാളത്തിലെ സ്വാഭാവികമായ ക്രമബദ്ധ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τινας μαθητάς
  choice: ചില ശിഷ്യന്മാരെ
  rationale: τινας അനിശ്ചിതമായ ‘ചില’ എന്നും μαθητάς ‘ശിഷ്യന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്തി; ആരുടെ ശിഷ്യന്മാരാണെന്ന് മൂലവാക്യം വ്യക്തമാക്കാത്തതിനാൽ കൂടുതൽ നിർവചിച്ചില്ല.
theological_decisions:
- issue: μαθητάς എന്നവരുടെ തിരിച്ചറിയൽ
  choice: പ്രധാനപാഠത്തിൽ ‘ചില ശിഷ്യന്മാർ’ എന്നു മാത്രം നൽകി
  alternative: ‘യോഹന്നാന്റെ ചില ശിഷ്യന്മാർ’ അല്ലെങ്കിൽ ‘യേശുവിന്റെ ചില ശിഷ്യന്മാർ’
  rationale: ഗ്രീക്ക് വാക്യം അവരുടെ ബന്ധം വ്യക്തമാക്കുന്നില്ല. തുടർന്നുള്ള വാക്യങ്ങൾ യോഹന്നാന്റെ സ്നാനവുമായി അവരുടെ ബന്ധം വെളിപ്പെടുത്തുന്നതിനാൽ, ഈ വാക്യത്തിൽ തന്നെ അത് മുൻകൂട്ടി നിർണ്ണയിക്കുന്നത് ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘ഉൾനാടൻ പ്രദേശങ്ങൾ’ ഭൂമിശാസ്ത്രപരമായ സാധ്യത വ്യക്തമാക്കുന്നു. ഇംഗ്ലീഷ് കരടിലെ [a] അടിക്കുറിപ്പ് തെറ്റായ സ്ഥാനത്ത്—‘കൊരിന്തിൽ’ എന്നതിനുശേഷം—വന്നതായി തോന്നുന്നതിനാൽ അത് പുനരുത്പാദിപ്പിച്ചില്ല; അതിലെ വിവരമനുസരിച്ചുള്ള പ്രത്യേക കുറിപ്പും ആവശ്യമില്ലെന്ന് വിലയിരുത്തി. നിലനിർത്തിയ ഏക അടിക്കുറിപ്പ് പ്രധാനപാഠത്തിൽ [a] ആയി അടയാളപ്പെടുത്തി.
