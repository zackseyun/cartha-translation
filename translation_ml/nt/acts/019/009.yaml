id: ACT.19.9
reference: Acts 19:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: ml
  text: എന്നാൽ ചിലർ കഠിനഹൃദയരായിത്തീരുകയും അനുസരിക്കാൻ വിസമ്മതിക്കുകയും[a], ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ മാർഗത്തെ[b] ദുഷിച്ചു സംസാരിക്കുകയും ചെയ്തപ്പോൾ, പൗലോസ് അവരിൽനിന്ന് പിന്മാറി ശിഷ്യന്മാരെ വേർതിരിച്ചു; തുരന്നൊസിന്റെ പ്രഭാഷണശാലയിൽ[c] ദിവസവും സംവദിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിശ്വസിക്കാതിരിക്കുകയും” അല്ലെങ്കിൽ “സമ്മതിക്കാൻ വിസമ്മതിക്കുകയും.”
    reason: lexical_alternative
  - marker: b
    text: “മാർഗം” എന്നത് അപ്പൊസ്തലപ്രവൃത്തികളിൽ ആദിമ ക്രിസ്തീയ പ്രസ്ഥാനത്തെ സൂചിപ്പിച്ചിരുന്ന ഒരു പേരാണ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ “തുരന്നൊസിന്റെ പാഠശാലയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: ഹൃദയം കഠിനപ്പെട്ടവരായി
  rationale: അപൂർണ്ണകാലരൂപം തുടരുന്നോ വളർന്നുവരുന്നോ ആയ കടുത്ത പ്രതിരോധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ബൈബിൾപ്രയോഗമായി ഇത് ആ ആശയം നൽകുന്നു; കർത്തൃത്വം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἠπείθουν
  choice: അനുസരിക്കാതിരിക്കുകയും
  rationale: ἀπειθέω എന്ന പദത്തിലുള്ള അവിശ്വാസത്തിന്റെയും അനുസരണക്കേടിന്റെയും അർത്ഥവ്യാപ്തിയിൽ, സന്ദേശത്തോടുള്ള മനഃപൂർവമായ എതിർപ്പ് ഇവിടെ മുൻനിർത്തുന്നു. മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κακολογοῦντες
  choice: ദുഷിച്ചു സംസാരിക്കുകയും
  rationale: പരസ്യമായ ശത്രുതാപരമായ അധിക്ഷേപസംസാരത്തെ സൂചിപ്പിക്കുന്ന വിശാലവും സ്വാഭാവികവുമായ പ്രയോഗം; നിയമപരമായ അപവാദം എന്ന ഇടുങ്ങിയ അർത്ഥം ചുമത്തുന്നില്ല.
- source_word: τὴν ὁδὸν
  choice: മാർഗത്തെക്കുറിച്ച്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ യേശുവിനെ അനുഗമിച്ച പ്രസ്ഥാനത്തിന്റെ തിരിച്ചറിയൽപേരായി ഉപയോഗിക്കുന്ന ലൂക്കോസിന്റെ സവിശേഷ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἐνώπιον τοῦ πλήθους
  choice: ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ
  rationale: എതിർപ്പ് പരസ്യമായിരുന്നുവെന്ന അർത്ഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന് പിന്മാറി
  rationale: വിരോധികളിൽനിന്നുള്ള പൗലോസിന്റെ നിർണായകമായ വേർപാടിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: ശിഷ്യന്മാരെ വേർതിരിച്ചു
  rationale: ἀφορίζω എന്നതിലെ ഉദ്ദേശ്യപൂർവമായ വേർതിരിക്കൽ നിലനിർത്തുന്നു; ശിഷ്യന്മാർ എന്നത് μαθηταίയുടെ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പരിഭാഷയാണ്.
- source_word: καθ’ ἡμέραν
  choice: ദിവസവും
  rationale: ക്രമമായി എല്ലാ ദിവസവും നടന്ന പ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: διαλεγόμενος
  choice: അവരുമായി സംവദിച്ചുകൊണ്ടിരുന്നു
  rationale: വെറും ഏകപക്ഷീയ പ്രസംഗമല്ല, യുക്തിപൂർവമായ ചർച്ചയും വിശദീകരണവും ഉൾപ്പെടുന്ന διαλέγομαιയുടെ ആശയം നൽകുന്നു.
- source_word: ἐν τῇ σχολῇ Τυράννου
  choice: തുറന്നൊസിന്റെ പ്രഭാഷണശാലയിൽ
  rationale: σχολήയെ ആധുനിക വിദ്യാലയമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ പഠിപ്പിക്കലിനും സംവാദത്തിനുമുള്ള ഹാൾ എന്ന സന്ദർഭാർഥം സ്വീകരിച്ചു; Τύραννος എന്ന പേര് മലയാളത്തിൽ തുറന്നൊസ് എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: ‘മാർഗം’ എന്നത് പ്രസ്ഥാനത്തിന്റെ തിരിച്ചറിയൽപേരായി വിവർത്തനം ചെയ്യൽ
  choice: മാർഗം
  alternative: ഒരു പൊതുവായ വഴി അഥവാ ഉപദേശം
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പദം യേശുവിനെ അനുഗമിച്ച ആദിമ പ്രസ്ഥാനത്തിന്റെ തിരിച്ചറിയാവുന്ന പേരായി പ്രവർത്തിക്കുന്നു. മലയാളത്തിൽ വലിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ ചരിത്രപരമായ ഈ അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: ἀπειθέωയിലെ അവിശ്വാസം–അനുസരണക്കേട് അർത്ഥവ്യാപ്തി
  choice: അനുസരിക്കാതിരിക്കുക
  alternative: വിശ്വസിക്കാതിരിക്കുക / സമ്മതിക്കാൻ വിസമ്മതിക്കുക
  rationale: സന്ദേശത്തെ പരസ്യമായി എതിർക്കുന്ന സാഹചര്യത്തിൽ മനഃപൂർവമായ അനുസരണക്കേടിന്റെ ഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; യഥാർഥമായ മറ്റു അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ എതിർപ്പും വേർതിരിക്കലും ദൈനംദിന യുക്തിപൂർവ സംവാദവും വ്യക്തമായി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടു ചേർത്തിരിക്കുന്നു.
