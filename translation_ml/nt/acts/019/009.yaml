- from: എന്നാൽ ചിലർ ഹൃദയം കഠിനപ്പെട്ടവരായി അനുസരിക്കാതിരിക്കുകയും[a] ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ മാർഗത്തെക്കുറിച്ച് ദുഷിച്ചു സംസാരിക്കുകയും ചെയ്തപ്പോൾ, പൗലോസ് അവരിൽനിന്ന് പിന്മാറി ശിഷ്യന്മാരെ വേർതിരിച്ചു; തുറന്നൊസിന്റെ പ്രഭാഷണശാലയിൽ[c] ദിവസവും അവരുമായി സംവദിച്ചുകൊണ്ടിരുന്നു.[b]
  to: എന്നാൽ ചിലർ കഠിനഹൃദയരായിത്തീരുകയും അനുസരിക്കാൻ വിസമ്മതിക്കുകയും[a], ജനക്കൂട്ടത്തിന്റെ മുമ്പിൽ മാർഗത്തെ[b] ദുഷിച്ചു സംസാരിക്കുകയും ചെയ്തപ്പോൾ, പൗലോസ് അവരിൽനിന്ന് പിന്മാറി ശിഷ്യന്മാരെ വേർതിരിച്ചു; തുരന്നൊസിന്റെ പ്രഭാഷണശാലയിൽ[c] ദിവസവും സംവദിച്ചുകൊണ്ടിരുന്നു.
