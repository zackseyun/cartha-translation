  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Παύλου δὲ⸃ βουλομένου εἰσελθεῖν εἰς τὸν δῆμον οὐκ εἴων αὐτὸν οἱ μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/030.yaml
  text: But when Paul wanted to go in among the assembly[a], the disciples would not let him.
translation:
  language: ml
  text: എന്നാൽ പൗലോസ് ജനസമ്മേളനത്തിലേക്കു[a] കടന്നുചെല്ലാൻ ആഗ്രഹിച്ചപ്പോൾ, ശിഷ്യന്മാർ അദ്ദേഹത്തെ അകത്തേക്കു പോകാൻ അനുവദിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനക്കൂട്ടത്തിലേക്ക്” അല്ലെങ്കിൽ “ജനസമ്മേളനത്തിന്റെ ഇടയിലേക്ക്.” ഈ പൗരസന്ദർഭത്തിൽ ഗ്രീക്ക് പദമായ δῆμος കൂടിവന്ന പൊതുജനസമൂഹത്തെയോ പൗരസമ്മേളനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παύλου δὲ
  choice: എന്നാൽ പൗലോസ്
  rationale: δέ മുൻവാക്യത്തിലെ സംഭവത്തിൽനിന്ന് പൗലോസിന്റെ ഉദ്ദേശ്യത്തിലേക്കുള്ള നേരിയ വൈരുധ്യപരമായ മാറ്റം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: βουλομένου
  choice: ആഗ്രഹിച്ചപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പൗലോസിന്റെ ആ സമയത്തെ ആഗ്രഹമോ ഉദ്ദേശ്യമോ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ‘ആഗ്രഹിച്ചപ്പോൾ’ സ്വാഭാവികവും അർത്ഥസമൃദ്ധവുമാണ്.
- source_word: εἰσελθεῖν
  choice: കടന്നുചെല്ലാൻ
  rationale: കൂടിയിരുന്ന ആളുകളുടെ ഇടയിലേക്കുള്ള പ്രവേശനമാണ് εἰσέρχομαι ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘കടന്നുചെല്ലാൻ’ ആ ചലനം വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς τὸν δῆμον
  choice: ജനസമ്മേളനത്തിലേക്ക്
  rationale: എഫെസൊസിലെ നാടകശാലയിൽ കൂടിയ പൊതുജനസമൂഹത്തെ δῆμος സൂചിപ്പിക്കാം. ‘ജനസമ്മേളനം’ ഔപചാരിക പൗരസഭയെയും സാധാരണ ജനക്കൂട്ടത്തെയും മുൻകൂട്ടി തീർപ്പാക്കാതെ പൊതുവായി ഉൾക്കൊള്ളുന്നു.
- source_word: οὐκ εἴων αὐτὸν
  choice: അദ്ദേഹത്തെ അനുവദിച്ചില്ല
  rationale: ἐάωയുടെ ഇംപെർഫെക്റ്റ് രൂപം തുടർന്നുള്ള തടയലോ സമ്മതിക്കാതിരിക്കലോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അനുവദിച്ചില്ല’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: οἱ μαθηταί
  choice: ശിഷ്യന്മാർ
  rationale: μαθηταί എന്നതിന്റെ പഠിതാക്കൾ/അനുയായികൾ എന്ന സ്വഭാവം ‘ശിഷ്യന്മാർ’ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥത ചേർത്തിട്ടില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. δῆμος എന്ന പദത്തിലെ ജനക്കൂട്ടം/പൗരസമ്മേളനം എന്ന അർത്ഥവ്യാപ്തി മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
