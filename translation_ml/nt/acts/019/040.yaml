translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. നിയമപരമായ മുന്നറിയിപ്പിന്റെ ഭാവം ‘കുറ്റം ചുമത്തപ്പെടുക’, ‘ന്യായമായ കാരണം’, ‘വിശദീകരണം നൽകുക’ എന്നിവയിലൂടെ നിലനിർത്തി; συστροφήയും ἐκκλησίαയും ഒരേ പദത്തിൽ ലയിപ്പിക്കാതെ യഥാക്രമം ‘ബഹളം’, ‘യോഗം’ എന്നു വേർതിരിച്ചു.
