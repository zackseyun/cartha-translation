id: ACT.19.40
reference: Acts 19:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇന്നത്തെ സംഭവത്തിന്റെ പേരിൽ കലാപക്കുറ്റം ചുമത്തപ്പെടാനുള്ള അപകടത്തിലാണ് നാം[a]; ഇതിന് ഒരു കാരണവുമില്ലാത്തതിനാൽ, ഈ ബഹളത്തെക്കുറിച്ച്[b] വിശദീകരണം നൽകാൻ നമുക്കു കഴിയുകയുമില്ല. ഇതു പറഞ്ഞശേഷം അദ്ദേഹം യോഗത്തെ[c] പിരിച്ചുവിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കലാപം’ എന്നതിന് ‘ലഹള’ എന്നോ, കൂടുതൽ രാഷ്ട്രീയഭാവത്തിൽ ‘വിപ്ലവം’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ഗുരുതരമായ പൗരപ്രക്ഷോഭത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ പൊതുജനബഹളമാണ് ഉടനെയുള്ള സന്ദർഭം.
    reason: lexical_alternative
  - marker: b
    text: ‘ബഹളം’ എന്നതിന് ‘ക്രമരഹിതമായ ഒത്തുചേരൽ’ എന്നോ ‘ജനക്കൂട്ടം’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ബഹളപൂർവം കൂടിയ സംഘത്തെ സൂചിപ്പിക്കുന്നു; പിന്നീട് വരുന്ന കൂടുതൽ ഔപചാരികമായ ‘യോഗം’ എന്ന പദത്തിൽനിന്ന് ഇത് വ്യത്യസ്തമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘യോഗം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദമാണ് മറ്റു പല സ്ഥലങ്ങളിലും ‘സഭ’ അഥവാ ‘സഭാസമൂഹം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത്. എന്നാൽ ഇവിടെ അത് എഫെസൊസിലെ പൗരയോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: κινδυνεύομεν
  choice: അപകടത്തിലാണ് നാം
  rationale: വർത്തമാനകാലത്തിലുള്ള യഥാർഥവും അടിയന്തരവുമായ അപകടസാധ്യത സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐγκαλεῖσθαι
  choice: കുറ്റം ചുമത്തപ്പെടാൻ
  rationale: നഗരാധികാരിയുടെയും റോമൻ ഭരണകൂടത്തിന്റെയും പശ്ചാത്തലത്തിൽ ക്രിയയ്ക്കുള്ള നിയമപരമായ കുറ്റാരോപണഭാവം നിലനിർത്തുന്നു.
- source_word: στάσεως
  choice: കലാപക്കുറ്റം
  rationale: പൊതുസമാധാനം തകർക്കുന്ന ഗുരുതരമായ കൂട്ടലഹള എന്ന അർഥം നൽകുന്നു; അതിനെ നിർബന്ധമായി രാഷ്ട്രീയ വിപ്ലവമെന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: περὶ τῆς σήμερον
  choice: ഇന്നത്തെ സംഭവത്തിന്റെ പേരിൽ
  rationale: അക്ഷരാർഥത്തിലെ അപൂർണത ഒഴിവാക്കി, ഇന്നുണ്ടായ സംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: ഇതിന് ന്യായമായ കാരണമൊന്നുമില്ല
  rationale: സംഭവത്തിന് സാധുവായ അടിസ്ഥാനമില്ലെന്ന genitive absolute-ന്റെ നിയമപരവും കാരണപരവുമായ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἀποδοῦναι λόγον
  choice: വിശദീകരണം നൽകാൻ
  rationale: അധികാരികളുടെ മുമ്പിൽ സംഭവത്തെക്കുറിച്ച് കണക്കു ബോധിപ്പിക്കുകയോ കാരണം വിശദീകരിക്കുകയോ ചെയ്യുക എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: συστροφῆς
  choice: ബഹളം
  rationale: ക്രമരഹിതമായി കൂടിയ ജനക്കൂട്ടം സൃഷ്ടിച്ച സംഘർഷഭരിതമായ ഒത്തുചേരലിനെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ഔപചാരികമായ ἐκκλησίαയിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: ἐκκλησίαν
  choice: യോഗം
  rationale: ഇവിടെ സഭ/ചർച്ച് എന്ന മതപരമായ അർഥമല്ല, എഫെസൊസിലെ പൊതുയോഗമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ‘യോഗം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἀπέλυσεν
  choice: പിരിച്ചുവിട്ടു
  rationale: ഒരു പൊതുയോഗം ഔപചാരികമായി അവസാനിപ്പിച്ച് ആളുകളെ വിട്ടയച്ചു എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: καὶ γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന് കാരണം നൽകുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
