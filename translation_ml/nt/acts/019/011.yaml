id: ACT.19.11
reference: Acts 19:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δυνάμεις τε οὐ τὰς τυχούσας ⸂ὁ θεὸς ἐποίει⸃ διὰ τῶν χειρῶν Παύλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/011.yaml
  text: And God was doing extraordinary miracles through the hands of Paul,[a]
translation:
  language: ml
  text: ദൈവം പൗലൊസിന്റെ കൈകളിലൂടെ അസാധാരണമായ അത്ഭുതങ്ങൾ ചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘സാധാരണമായവയല്ലാത്ത ശക്തിപ്രവൃത്തികൾ.’'
    reason: Δυνάμεις എന്ന പദത്തിന്റെ ‘ശക്തിപ്രവൃത്തികൾ’ എന്ന അക്ഷരാർഥഭാവവും οὐ τὰς τυχούσας എന്ന പ്രയോഗത്തിന്റെ ‘സാധാരണമല്ലാത്ത’ ഊന്നലും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: Δυνάμεις
  choice: അത്ഭുതപ്രവൃത്തികൾ
  rationale: ബഹുവചനമായ δύναμις ഇവിടെ അമൂർത്തമായ ശക്തികളെയല്ല, ദൈവശക്തി പ്രകടമാകുന്ന അത്ഭുതപ്രവൃത്തികളെയാണ് സൂചിപ്പിക്കുന്നത്. ആ സംഭവാത്മക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τε
  choice: വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: τε മുൻവിവരണത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യത്തിന്റെ സ്വാഭാവിക തുടർച്ചയിലൂടെ ആ ബന്ധം പ്രകടമാകുന്നതിനാൽ പ്രത്യേകമായി ‘കൂടാതെ’ എന്നു ചേർത്തില്ല.
- source_word: οὐ τὰς τυχούσας
  choice: അസാധാരണമായ
  rationale: ‘സാധാരണ തരത്തിലുള്ളവയല്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: പ്രവൃത്തിയുടെ വ്യക്തമായ കർത്താവ് ദൈവമാണെന്ന് ഗ്രീക്ക് വാക്യം വ്യക്തമാക്കുന്നു.
- source_word: ἐποίει
  choice: ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്തിലെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τῶν χειρῶν Παύλου
  choice: പൗലൊസിന്റെ കൈകളിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന ഉപകരണപരമായ മധ്യസ്ഥതയും ‘കൈകൾ’ എന്ന മൂർത്തമായ ഗ്രീക്ക് പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: Παύλου
  choice: പൗലൊസ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതവും ഗ്രീക്ക് Παῦλος എന്ന പേരിനോട് ചേർന്നുനിൽക്കുന്നതുമായ രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: അത്ഭുതപ്രവൃത്തികളിലെ കർത്തൃത്വം
  choice: അത്ഭുതപ്രവൃത്തികൾ ചെയ്യുന്നവനായി ദൈവത്തെയും അവ നടക്കുന്നതിനുള്ള മനുഷ്യോപകരണമായി പൗലൊസിനെയും അവതരിപ്പിച്ചു.
  alternative: പൗലൊസ് അത്ഭുതങ്ങൾ ചെയ്തു.
  rationale: ὁ θεὸς എന്നത് ἐποίει എന്ന ക്രിയയുടെ വ്യാകരണകർത്താവാണ്; διὰ τῶν χειρῶν Παύλου പൗലൊസിലൂടെയുള്ള മധ്യസ്ഥ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ പൗലൊസിന് സ്വതന്ത്രമായ അത്ഭുതശക്തി ആരോപിക്കാതെ മൂലപാഠത്തിലെ വ്യത്യാസം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അത്ഭുതപ്രവൃത്തികൾ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകുമ്പോൾ ‘പൗലൊസിന്റെ കൈകളിലൂടെ’ എന്ന രൂപം മൂലപാഠത്തിലെ ദൃശ്യപ്രയോഗവും ദൈവിക കർത്തൃത്വവും നിലനിർത്തുന്നു.
