id: ACT.19.10
reference: Acts 19:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: ml
  text: ഇത് രണ്ടു വർഷം തുടർന്നു. അങ്ങനെ ഏഷ്യയിൽ[a] താമസിച്ചിരുന്ന എല്ലാവരും—യെഹൂദന്മാരും ഗ്രീക്കുകാരും—കർത്താവിന്റെ വചനം[b] കേട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നത് ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡമല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയാണ്.
    reason: cultural_note
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ദൈവത്തിന്റെ വചനം’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: ഇത് ... തുടർന്നു
  rationale: ἐγένετο എന്നതിന് അക്ഷരാർഥത്തിൽ ‘സംഭവിച്ചു’ എന്നാകാമെങ്കിലും, മുൻവാക്യത്തിലെ പഠിപ്പിക്കൽ ക്രമീകരണം രണ്ടു വർഷം നീണ്ടുനിന്നുവെന്നാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. അതിനാൽ ‘തുടർന്നു’ സ്വാഭാവികവും സന്ദർഭനിഷ്ഠവുമാണ്.
- source_word: ἐπὶ ἔτη δύο
  choice: രണ്ടു വർഷം
  rationale: ἐπίയും കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ദ്വിതീയാവിഭക്തിയും ചേർന്ന് പ്രവർത്തനം എത്രകാലം നീണ്ടുവെന്നു പറയുന്നു; മലയാളത്തിൽ ‘രണ്ടു വർഷം തുടർന്നു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻപറഞ്ഞ പ്രവർത്തനത്തിന്റെ ഫലമാണ് തുടർന്ന് വരുന്നതെന്ന് ὥστε സൂചിപ്പിക്കുന്നു. ‘അങ്ങനെ’ ഈ ഫലബന്ധം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: ഏഷ്യയിൽ താമസിച്ചിരുന്ന എല്ലാവരും
  rationale: κατοικοῦντας എന്ന നാമവാചകസമാനമായ കൃദന്തത്തിന്റെ ‘അവിടെ വസിച്ചിരുന്നവർ’ എന്ന അർഥവും πάντας എന്ന സമഗ്രവ്യാപ്തിയും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀκοῦσαι
  choice: കേട്ടു
  rationale: ὥστε-യ്ക്ക് പിന്നാലെയുള്ള aorist infinitive ഫലത്തെ അറിയിക്കുന്നു; ‘കേട്ടു’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട സുവിശേഷസന്ദേശത്തെ സൂചിപ്പിക്കാൻ പ്രവൃത്തികളിൽ λόγος ആവർത്തിച്ചു വരുന്ന പദമാണ്. ‘വചനം’ ആ ലൂക്കൊസീയ പദപ്രയോഗവും ദൈവശാസ്ത്രപരമായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος ഇവിടെ λόγος-നെ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് രൂപമാണ്; ‘കർത്താവിന്റെ വചനം’ എന്നത് അർഥവും ബൈബിൾപരമായ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: യെഹൂദന്മാരും ഗ്രീക്കുകാരും
  rationale: τε καὶ രണ്ടു വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്നു. ഈ പരിഭാഷ പ്രവൃത്തികളിലെ യെഹൂദ-ഗ്രീക്ക് വ്യാപ്തി കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഏഷ്യ’ എന്ന സ്ഥലനാമത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ഏഷ്യ’ എന്ന് നിലനിർത്തി, അത് റോമൻ പ്രവിശ്യയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡം എന്ന അർഥത്തിൽ വായിക്കുക.
  rationale: പ്രവൃത്തികളിലെ Ἀσία സാധാരണയായി പടിഞ്ഞാറൻ ഏഷ്യാമൈനറിലെ റോമൻ പ്രവിശ്യയെ സൂചിപ്പിക്കുന്നു. സ്ഥലനാമം വികസിപ്പിക്കാതെ നിലനിർത്തുകയും അനാകാലികമായ തെറ്റിദ്ധാരണ അടിക്കുറിപ്പിലൂടെ തടയുകയും ചെയ്യുന്നു.
- issue: ‘കർത്താവിന്റെ വചനം’ എന്നതിലെ പാഠഭേദം
  choice: SBLGNT മുഖ്യപാഠത്തെ പിന്തുടർന്ന് ‘കർത്താവിന്റെ വചനം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിലെ ‘ദൈവത്തിന്റെ വചനം’.
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മുഖ്യപാഠത്തിൽ τοῦ κυρίου എന്നാണ്. സാക്ഷ്യപ്പെടുത്തിയിരിക്കുന്ന മറ്റൊരു വായനയെ മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘വചനം’, ‘കർത്താവ്’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ശേഷിക്കുന്ന ഭാഷ സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന രീതിയിലാക്കി. രണ്ടു ഉൾപ്പെടുത്തിയ വിഭാഗങ്ങളെ വ്യക്തമായി കാണിക്കാൻ ദീർഘവിരാമചിഹ്നങ്ങൾ ഉപയോഗിച്ചു.
