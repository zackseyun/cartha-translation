language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “നിങ്ങൾ വിശ്വസിച്ചപ്പോൾ പരിശുദ്ധാത്മാവിനെ പ്രാപിച്ചോ?[a]” അവർ അവനോടു പറഞ്ഞു: “ഇല്ല; പരിശുദ്ധാത്മാവ് ഉണ്ടെന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ വിശ്വസിച്ചതിനുശേഷം പരിശുദ്ധാത്മാവിനെ പ്രാപിച്ചോ?” ഗ്രീക്ക് പങ്കുപദത്തിന്റെ കാലസൂചന അല്പം വ്യത്യസ്തമായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പരിശുദ്ധാത്മാവ് ഉണ്ടോ എന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല”; കൂടുതൽ വ്യാഖ്യാനപരമായി, “പരിശുദ്ധാത്മാവ് നൽകപ്പെട്ടിരിക്കുന്നുവെന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: അവൻ അവരോടു ചോദിച്ചു
  rationale: λέγω അടിസ്ഥാനമായി ‘പറയുക’ എന്നാണെങ്കിലും തുടർന്ന് നേരിട്ടുള്ള ചോദ്യം വരുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നു നൽകുന്നു; τέയുടെ ലഘുവായ ബന്ധകശക്തി പ്രത്യേകം ഭാരപ്പെടുത്തുന്നില്ല.
- source_word: Εἰ ... ἐλάβετε πιστεύσαντες
  choice: നിങ്ങൾ വിശ്വസിച്ചപ്പോൾ ... പ്രാപിച്ചോ?
  rationale: πιστεύσαντες എന്ന aorist participle-ഉം ἐλάβετε എന്ന മുഖ്യക്രിയയും തമ്മിലുള്ള കാലബന്ധം ‘വിശ്വസിച്ചപ്പോൾ’ എന്നു നൽകുന്നത് സ്വാഭാവികമാണ്; ‘വിശ്വസിച്ചതിനുശേഷം’ എന്ന കർശനമായ ക്രമമോ ‘വിശ്വസിച്ച ഉടനെ’ എന്ന തൽക്ഷണതയോ നിർബന്ധിക്കുന്നില്ല.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ വ്യക്തിപരമായ ഈ പരാമർശത്തിന് ‘പരിശുദ്ധാത്മാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: അവർ അവനോടു പറഞ്ഞു
  rationale: δέ ഇവിടെ ലഘുവായ സംഭാഷണതുടർച്ചയാണ്; മലയാളത്തിൽ പ്രത്യേക വിരോധസൂചകം ചേർക്കാതെ ലളിതമായി നൽകുന്നത് സ്വാഭാവികമാണ്.
- source_word: Ἀλλ’ οὐδ’
  choice: ഇല്ല; ... എന്നുപോലും ... ഇല്ല
  rationale: ഉത്തരത്തിലെ ശക്തമായ നിഷേധം മലയാളത്തിൽ ആദ്യം ‘ഇല്ല’ എന്നും തുടർന്ന് ‘എന്നുപോലും ... ഇല്ല’ എന്നും നൽകി നിലനിർത്തുന്നു.
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: പരിശുദ്ധാത്മാവ് ഉണ്ടെന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല
  rationale: οὐδὲ εἰ എന്നത് ‘ഉണ്ടെന്ന് പോലും’ അല്ലെങ്കിൽ ‘ഉണ്ടോ എന്നു പോലും’ എന്നിങ്ങനെ ഗ്രഹിക്കാം. മുഖ്യവാചകത്തിൽ നേരിട്ടുള്ള അർത്ഥം നൽകുകയും ‘നൽകപ്പെട്ടിരിക്കുന്നു’ എന്ന ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വിശ്വാസവും പരിശുദ്ധാത്മാവിനെ പ്രാപിക്കുന്നതും തമ്മിലുള്ള കാലബന്ധം
  choice: ‘വിശ്വസിച്ചപ്പോൾ’
  alternative: ‘വിശ്വസിച്ചതിനുശേഷം’ / ‘വിശ്വസിച്ച ഉടനെ’
  rationale: ഗ്രീക്ക് participle കാലബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും കർശനമായ പിൻക്രമമോ തൽക്ഷണസമകാലികതയോ തനിയെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ തർക്കം വിവർത്തനംകൊണ്ട് പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: പരിശുദ്ധാത്മാവിനെക്കുറിച്ചുള്ള ശിഷ്യന്മാരുടെ അറിവില്ലായ്മയുടെ അർത്ഥം
  choice: ‘പരിശുദ്ധാത്മാവ് ഉണ്ടെന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല’
  alternative: ‘പരിശുദ്ധാത്മാവ് ഉണ്ടോ എന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല’ / ‘പരിശുദ്ധാത്മാവ് നൽകപ്പെട്ടിരിക്കുന്നുവെന്നുപോലും ഞങ്ങൾ കേട്ടിട്ടില്ല’
  rationale: ഗ്രീക്ക് വാക്യം സംക്ഷിപ്തവും അർത്ഥസാധ്യതകളുള്ളതുമാണ്. മുഖ്യവാചകം നേരിട്ടുള്ള അർത്ഥം പിന്തുടരുന്നു; ‘നൽകപ്പെട്ടിരിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രാപിച്ചോ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വചനഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്ന പ്രയോഗമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
