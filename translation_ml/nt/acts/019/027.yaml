id: ACT.19.27
reference: Acts 19:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: ml
  text: നമ്മുടെ ഈ തൊഴിൽ അപകീർത്തിയിലാകാനുള്ള അപകടം മാത്രമല്ല ഉള്ളത്; മഹാദേവിയായ അർത്തെമിസിന്റെ ക്ഷേത്രം ഒന്നുമല്ലാത്തതായി കണക്കാക്കപ്പെടാനും, ഏഷ്യ മുഴുവനും ലോകവും[a] ആരാധിക്കുന്ന അവളുടെ മഹിമപോലും[b] താഴ്ത്തപ്പെടാനും ഇടയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനവാസമുള്ള ലോകം.” ഗ്രീക്ക് പദം സാധാരണയായി ജനവാസമുള്ള ലോകത്തെ, പ്രത്യേകിച്ച് വിശാലമായ റോമൻ ലോകത്തെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “മഹിമ” എന്നതിന് “മഹത്വം,” “പ്രൗഢി,” അല്ലെങ്കിൽ “മാഹാത്മ്യം” എന്നും വിവർത്തനം ചെയ്യാം. അർത്തെമിസിന്റെ ഉന്നത പദവിയോ തേജസ്സോ താഴ്ത്തപ്പെടുന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: അപകടം ... നമുക്കുള്ളത് / ഇടയുണ്ട്
  rationale: വർത്തമാനകാലത്തിലുള്ള അപകടസാധ്യതയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യത്തിലെ ഏക ക്രിയയുടെ പ്രഭാവം തുടർന്നുള്ള ആശങ്കകളിലേക്കും വ്യാപിപ്പിക്കുന്നു.
- source_word: τὸ μέρος
  choice: ഈ തൊഴിൽ
  rationale: സന്ദർഭത്തിൽ ശില്പികളുടെ തൊഴിൽമേഖലയെയോ ഉപജീവനവൃത്തിയെയോ സൂചിപ്പിക്കുന്നു; അമൂർത്തമായ ‘പങ്ക്’ എന്ന അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: അപകീർത്തിയിലാകുക
  rationale: നിന്ദയ്ക്കും മാനനഷ്ടത്തിനും വിധേയമാകുന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἱερὸν
  choice: ക്ഷേത്രം
  rationale: എഫെസൊസിലെ അർത്തെമിസ് ആരാധനയുടെ വിശുദ്ധ ക്ഷേത്രസമുച്ചയത്തെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: ഒന്നുമല്ലാത്തതായി കണക്കാക്കപ്പെടുക
  rationale: ‘ഒരു വിലയുമില്ലാത്തതായി ഗണിക്കപ്പെടുക’ എന്ന മൂലഭാഷയിലെ വിലയിരുത്തൽഭാവം അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: അവളുടെ മഹിമതന്നെ താഴ്ത്തപ്പെടുക
  rationale: ദുഷ്കരവും ചുരുക്കപ്പെട്ടതുമായ ഗ്രീക്ക് ഘടനയിലെ വരാനിരിക്കുന്ന മഹത്വനഷ്ടത്തിന്റെ ആശയം നിലനിർത്തുന്നു. ‘തന്നെ’ എന്നത് καὶ-യുടെ ശക്തിപ്പെടുത്തൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὅλη ἡ Ἀσία
  choice: ഏഷ്യ മുഴുവനും
  rationale: റോമൻ പ്രവിശ്യയായ ഏഷ്യയെയാണ് സൂചിപ്പിക്കുന്നത്; വാചകത്തിന്റെ വിപുലമായ ആലങ്കാരിക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἡ οἰκουμένη
  choice: ജനവാസമുള്ള ലോകം
  rationale: οἰκουμένηയുടെ അടിസ്ഥാന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സാധാരണയായി വിശാലമായ റോമൻ ലോകത്തെ ഉദ്ദേശിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: σέβεται
  choice: ആരാധിക്കുന്നു
  rationale: അർത്തെമിസ് ആരാധനയുടെ മതപരമായ പശ്ചാത്തലത്തിൽ വെറും ബഹുമാനത്തേക്കാൾ ആരാധനയാണ് യോജിച്ച അർഥം.
theological_decisions:
- issue: വിജാതീയ മതഭാഷയെ മൃദൂകരിക്കാതെയും അംഗീകരിക്കുന്നതായി തോന്നിക്കാതെയും അവതരിപ്പിക്കൽ
  choice: മഹാദേവിയായ അർത്തെമിസ് ... ആരാധിക്കുന്ന
  alternative: ‘മഹാദേവി എന്നു വിളിക്കപ്പെടുന്ന അർത്തെമിസ്’ അല്ലെങ്കിൽ ‘ആദരിക്കുന്ന’
  rationale: ഇത് ദെമേത്രിയൊസിന്റെ റിപ്പോർട്ട് ചെയ്ത പ്രസംഗമാണ്. ഗ്രീക്കിൽ ഇല്ലാത്ത അകലം സൂചിപ്പിക്കുന്ന പദങ്ങൾ ചേർക്കാതെ അവന്റെ അവകാശവാദം അതേപടി നൽകുന്നു; വിവരണം അതിനെ വിവർത്തകന്റെ അംഗീകാരമാക്കുന്നില്ല.
- issue: τῆς μεγαλειότητος αὐτῆς എന്ന ദുഷ്കരമായ ഷഷ്ഠീവ്യാകരണബന്ധം
  choice: അവളുടെ മഹിമതന്നെ താഴ്ത്തപ്പെടുക
  alternative: അവൾ തന്റെ മഹിമയിൽനിന്ന് നീക്കപ്പെടുക / അവളുടെ മഹത്വം ഇല്ലാതാക്കപ്പെടുക
  rationale: അർത്തെമിസിന്റെ ഉന്നത പദവിയോ പ്രൗഢിയോ നഷ്ടപ്പെടുമെന്ന ഭീഷണി നിലനിർത്തുന്നു; വ്യക്തമായ ഒരു വ്യാകരണപരിഹാരം മൂലപാഠത്തിൽക്കാൾ കർശനമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ദെമേത്രിയൊസിന്റെ വാണിജ്യപരവും മതപരവുമായ ഇരട്ട ആശങ്ക നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
