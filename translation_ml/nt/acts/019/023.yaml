id: ACT.19.23
reference: Acts 19:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/023.yaml
  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: ml
  text: ആ കാലത്ത് മാർഗത്തെ[a] സംബന്ധിച്ച് വലിയൊരു കലക്കം ഉണ്ടായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വഴിയെ.” ഇവിടെ ഇത് ക്രിസ്തീയ പ്രസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; പ്രവൃത്തികളിൽ ആവർത്തിച്ചുവരുന്ന ഒരു പേരുപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: ഉണ്ടായി
  rationale: ഒരു സംഭവം ഉണ്ടായതിനെ സൂചിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ സംഭവാത്മക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആഖ്യാനത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: ആ കാലത്ത്
  rationale: പ്രസ്തുത കാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τάραχος
  choice: കലഹം
  rationale: τάραχος സൂചിപ്പിക്കുന്ന അസ്വസ്ഥതയും പൊതുക്രമഭംഗവും ഉൾക്കൊള്ളുന്നു; തുടർന്നുള്ള വിവരണം മുൻകൂട്ടി 'ലഹള'യോ 'കലാപം'യോ എന്ന് അതിനിശ്ചയിക്കുന്നില്ല.
- source_word: οὐκ ὀλίγος
  choice: വലിയൊരു
  rationale: ഗ്രീക്കിലെ വ്യാജസ്തുതിപ്രയോഗമായ 'ചെറുതല്ലാത്ത' എന്ന രൂപം അർത്ഥസമമായ, സാധാരണ മലയാളത്തിലെ 'വലിയൊരു' എന്നു നൽകുന്നു; അക്ഷരാർഥമായ രൂപം മലയാളത്തിൽ കൃത്രിമമായി തോന്നും.
- source_word: περὶ
  choice: സംബന്ധിച്ച്
  rationale: ജനിറ്റീവിനോടുകൂടിയ περί കലഹത്തിന്റെ വിഷയമോ കാരണമോ സൂചിപ്പിക്കുന്നു; 'സംബന്ധിച്ച്' ആ ബന്ധം കൃത്യമായി നൽകുന്നു.
- source_word: τῆς ὁδοῦ
  choice: മാർഗത്തെ
  rationale: പ്രവൃത്തികളിൽ ക്രിസ്തീയ പ്രസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ആവർത്തിത നാമപ്രയോഗമാണ്; മലയാളത്തിൽ ആദരപൂർവവും വ്യക്തവുമായ 'മാർഗം' അതിന്റെ രൂപകസ്വഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῆς ὁδοῦ എന്നത് പ്രസ്ഥാനത്തിന്റെ നാമമായി നൽകുന്നത്
  choice: മാർഗം
  alternative: വഴി
  rationale: പ്രവൃത്തികളിൽ ഈ പ്രയോഗം ക്രിസ്തീയ പ്രസ്ഥാനത്തിന്റെ അറിയപ്പെടുന്ന വിശേഷണമാണ്. 'മാർഗം' അതിന്റെ നാമസദൃശ പ്രയോഗവും ആശയഗൗരവവും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സാധാരണ അർത്ഥമായ 'വഴി'യും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ litotes അക്ഷരാർഥമായി കട്ടിയുള്ള രൂപത്തിൽ നൽകാതെ സ്വാഭാവികമായ അർത്ഥസമത്വം സ്വീകരിച്ചു; പ്രസ്ഥാനനാമത്തിന്റെ സൂചന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
