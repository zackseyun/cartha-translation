    issue: The footnote calls the expression ‘ഒരു വിശേഷണം’ (‘an adjective’).
    rationale: This is grammatically and descriptively inaccurate. In Acts, ἡ ὁδός is a recurring designation for the Christian movement, not an adjective. The note should say ‘പേരുപ്രയോഗം’ or ‘വിളിപ്പേര്.’
  - severity: low
    issue: ‘കലഹം’ can suggest a quarrel or conflict.
    rationale: τάραχος more broadly denotes a disturbance, commotion, or public turmoil. ‘കലക്കം’ is more idiomatic and semantically closer in this narrative context without prematurely specifying a riot.
  revised_text: ആ കാലത്ത് മാർഗത്തെ[a] സംബന്ധിച്ച് വലിയൊരു കലക്കം ഉണ്ടായി.
