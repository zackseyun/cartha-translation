revisions:
- from: പിന്നെ അദ്ദേഹം സിനഗോഗിൽ പ്രവേശിച്ച് മൂന്നു മാസത്തോളം ധൈര്യത്തോടെ സംസാരിച്ചു; ദൈവരാജ്യത്തെക്കുറിച്ച് അവരുമായി സംവദിക്കുകയും അവരെ ബോധ്യപ്പെടുത്താൻ ശ്രമിക്കുകയും ചെയ്തു.[a]
  to: അദ്ദേഹം സിനഗോഗിൽ പ്രവേശിച്ച് മൂന്നു മാസം ധൈര്യത്തോടെ സംസാരിച്ചു; ദൈവരാജ്യത്തെക്കുറിച്ച് അവരുമായി സംവദിക്കുകയും അവരെ അതിനെക്കുറിച്ച് ബോധ്യപ്പെടുത്തുകയും ചെയ്തു.
  rationale: The revised text retains the Greek narrative progression and participial structure in natural Malayalam, gives the exact stated duration, and renders πείθων as ongoing persuasive activity without importing an explicit attempt/success distinction. ‘അതിനെക്കുറിച്ച്’ clarifies that both the discussion and persuasion concern the kingdom of God.
