id: ACT.19.8
reference: Acts 19:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: ml
  text: അദ്ദേഹം സിനഗോഗിൽ പ്രവേശിച്ച് മൂന്നു മാസം ധൈര്യത്തോടെ സംസാരിച്ചു; ദൈവരാജ്യത്തെക്കുറിച്ച് അവരുമായി സംവദിക്കുകയും അവരെ അതിനെക്കുറിച്ച് ബോധ്യപ്പെടുത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ
  choice: പിന്നെ അദ്ദേഹം ... പ്രവേശിച്ച്
  rationale: δέ കഥയുടെ പുരോഗതി സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമാണ്; aorist participle ആയ Εἰσελθών മുഖ്യപ്രവർത്തനത്തിനു പശ്ചാത്തലം ഒരുക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ രണ്ടും ചേർത്ത് ഇങ്ങനെ നൽകി.
- source_word: τὴν συναγωγήν
  choice: സിനഗോഗിൽ
  rationale: യഹൂദരുടെ പ്രത്യേക ആരാധനാ-സമ്മേളനസ്ഥലത്തെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; സ്ഥാപിതമായ വായ്പാപദം കൃത്യത നിലനിർത്തുന്നു.
- source_word: ἐπαρρησιάζετο
  choice: ധൈര്യത്തോടെ സംസാരിച്ചു
  rationale: imperfect രൂപം തുടർന്നുനിന്ന തുറന്നതും നിർഭയവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു; കാലദൈർഘ്യം അടുത്ത വാക്യഘടകം വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: മൂന്നു മാസത്തോളം
  rationale: ἐπί + accusative ഇവിടെ കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ദൈർഘ്യം അറിയിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: διαλεγόμενος
  choice: അവരുമായി സംവദിക്കുകയും
  rationale: വിവരണം, വാദനിരൂപണം, ആശയവിനിമയം എന്നിവ ഉൾക്കൊള്ളുന്ന സംഭാഷണാത്മക പ്രവർത്തനമാണ്; ‘സംവദിക്കുക’ അതിന്റെ പരസ്പരസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: πείθων
  choice: അവരെ ബോധ്യപ്പെടുത്താൻ ശ്രമിക്കുകയും
  rationale: പദം പ്രേരിപ്പിക്കുകയോ ബോധ്യപ്പെടുത്തുകയോ ചെയ്യുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ഫലം നിർബന്ധമായി കൈവന്നുവെന്ന് പ്രസ്താവിക്കാതെ പ്രവർത്തനത്തിന്റെ ശ്രമാത്മക ദിശ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെക്കുറിച്ച്
  rationale: περί + genitive എന്നത് ‘കുറിച്ച്’ എന്നാണ്; βασιλεία τοῦ θεοῦ എന്ന പ്രധാന പുതിയനിയമ പദസമുച്ചയം പരിചിതവും കൃത്യവുമായ ‘ദൈവരാജ്യം’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: πείθων എന്നതിന്റെ കർമം ഗ്രീക്കിൽ പരോക്ഷമാണ്
  choice: ‘അവരെ’ എന്ന് പ്രധാന പാഠത്തിൽ വ്യക്തമാക്കി
  alternative: കർമം പറയാതെ ‘ബോധ്യപ്പെടുത്താൻ ശ്രമിച്ചു’
  rationale: സിനഗോഗിലെ ശ്രോതാക്കളാണ് സന്ദർഭത്തിൽ വ്യക്തമായി ഉദ്ദേശിക്കപ്പെടുന്നത്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി കർമം ചേർക്കുന്നത് പുതിയ ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: πείθων വിജയഫലമോ ശ്രമമോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘ബോധ്യപ്പെടുത്താൻ ശ്രമിച്ചു’
  alternative: ‘ബോധ്യപ്പെടുത്തി’
  rationale: ഗ്രീക്ക് participle സജീവമായ പ്രേരണാപ്രവർത്തനത്തെ പറയുന്നു; എല്ലാ ശ്രോതാക്കളും യഥാർത്ഥത്തിൽ ബോധ്യപ്പെട്ടു എന്ന ഫലനിഗമനം ഒഴിവാക്കി അന്തർലീനമായ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
- issue: βασιλεία τοῦ θεοῦ എന്നതിന്റെ അർത്ഥപരിധി
  choice: ‘ദൈവരാജ്യം’
  alternative: ‘ദൈവത്തിന്റെ ഭരണം’
  rationale: βασιλεία രാജത്വത്തെയും ഭരണത്തെയും ഉൾക്കൊള്ളാം; എന്നാൽ ‘ദൈവരാജ്യം’ പുതിയനിയമത്തിലെ പ്രധാന പദസമുച്ചയത്തെ തിരിച്ചറിയാവുന്ന രീതിയിൽ നിലനിർത്തുകയും അർത്ഥപരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സിനഗോഗ്’, ‘ദൈവരാജ്യം’ എന്നീ സ്ഥാപിത പദങ്ങൾ നിലനിർത്തി; ദൈർഘ്യമേറിയ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
