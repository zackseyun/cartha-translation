source:
  edition: SBLGNT
  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഇവിടെ കൊണ്ടുവന്നിരിക്കുന്ന ഈ മനുഷ്യർ ക്ഷേത്രക്കൊള്ളക്കാരോ നമ്മുടെ ദേവിയെ[a] നിന്ദിക്കുന്നവരോ അല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘നമ്മുടെ ദേവി’ എന്നതിന് τὴν θεὸν ἡμῶν എന്നാണ്; τὴν സ്ത്രീലിംഗ ആർട്ടിക്കിളാണ്, എന്നാൽ θεόν സാധാരണ പുംലിംഗ രൂപമാണ്. സന്ദർഭത്തിൽ പരാമർശം എഫെസൊസിലെ അർത്തെമിസിനെയാണ്; അതിനാൽ ‘ദേവി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: നിങ്ങൾ ഇവിടെ കൊണ്ടുവന്നിരിക്കുന്ന
  rationale: അയയ്ക്കുകയോ വെറും നയിക്കുകയോ എന്നതിലുപരി, ഈ പൊതുസമ്മേളനത്തിലേക്ക് ഇവരെ കൊണ്ടുവന്ന പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ പിന്തുണയ്ക്കുന്ന വിശദീകരണകാരണം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς ἄνδρας τούτους
  choice: ഈ മനുഷ്യർ
  rationale: ἄνδρας എന്നത് ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യഘടനയിൽ ‘ഈ മനുഷ്യർ’ സ്വാഭാവികമാണ്. ‘ഇവിടെ’ എന്നത് കൊണ്ടുവരുന്ന ക്രിയയോടു ചേർത്തിരിക്കുന്നു.
- source_word: οὔτε ... οὔτε
  choice: -വരോ ... -വരോ അല്ല
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള നിഷേധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἱεροσύλους
  choice: ക്ഷേത്രങ്ങൾ കൊള്ളയടിക്കുന്നവർ
  rationale: വിശുദ്ധസ്ഥലങ്ങളിലെ സ്വത്ത് കവർന്നെടുക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ വ്യക്തവും മൂർത്തവുമായ അർഥം നൽകുന്നു; ‘ദൈവദൂഷകർ’ പോലുള്ള വിശാലമായ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: βλασφημοῦντας
  choice: നിന്ദിക്കുന്നവർ
  rationale: ഒരു ദേവതയെക്കുറിച്ച് അപകീർത്തികരമായോ അധിക്ഷേപകരമായോ സംസാരിക്കുന്നതിനെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τὴν θεὸν ἡμῶν
  choice: നമ്മുടെ ദേവിയെ
  rationale: സ്ത്രീലിംഗ നിർദേശകത്തോടുകൂടിയ θεός ഇവിടെ എഫെസൊസിലെ അർത്തെമിസിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘ദേവി’ എന്നത് സന്ദർഭത്തോടും മലയാളത്തിലെ സ്വാഭാവിക ലിംഗവ്യത്യാസത്തോടും യോജിക്കുന്നു.
theological_decisions:
- issue: അർത്തെമിസിനെ സൂചിപ്പിക്കുന്ന τὴν θεὸν ἡμῶν എന്ന പ്രയോഗം
  choice: നമ്മുടെ ദേവിയെ
  alternative: നമ്മുടെ ദൈവത്തെ
  rationale: പ്രസംഗിക്കുന്നത് ഒരു എഫെസൊസ് നഗരാധികാരിയാണ്; പരാമർശം അർത്തെമിസിനെക്കുറിച്ചാണ്. ‘ദേവി’ എന്നു പറയുന്നത് സന്ദർഭം കൃത്യമായി നൽകുകയും സത്യദൈവത്തെക്കുറിച്ചുള്ള പരാമർശമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു; ഇത് ആരാധനാപരമായ അംഗീകാരമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ പൊതുഭാഷയാണ് ഉപയോഗിച്ചത്. പൊതുസമ്മേളനത്തിലെ ന്യായവാദത്തിന്റെ ശൈലി നിലനിർത്തിക്കൊണ്ട് കൃത്രിമമായ പദാനുപദക്രമം ഒഴിവാക്കി.
