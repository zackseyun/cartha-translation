reference: Acts 19:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: ml
  text: ഈ കാര്യം എഫെസൊസിൽ താമസിച്ചിരുന്ന എല്ലാ യെഹൂദന്മാരും ഗ്രീക്കുകാരും അറിഞ്ഞു. അവരെയെല്ലാം ഭയം പിടികൂടി[a]; കർത്താവായ യേശുവിന്റെ നാമം മഹത്ത്വീകരിക്കപ്പെട്ടുകൊണ്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെയെല്ലാംമേൽ ഭയം വന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കർത്താവായ യേശുവിന്റെ നാമം ഉയർത്തപ്പെട്ടു’ അല്ലെങ്കിൽ ‘വളരെ ആദരിക്കപ്പെട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ഈ കാര്യം
  rationale: മുമ്പ് വിവരിച്ച സംഭവത്തെയാണ് ഏകവചന നിർദേശകസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം വ്യക്തമായി ബന്ധിപ്പിക്കാൻ ‘ഈ കാര്യം’ സ്വാഭാവികമാണ്.
- source_word: ἐγένετο γνωστὸν
  choice: അറിഞ്ഞു
  rationale: ‘അറിയപ്പെടാനിടയായി’ എന്ന പദാനുപദ രൂപത്തെക്കാൾ, ആ കാര്യം എല്ലാവരുടെയും അറിവിലെത്തി എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: എല്ലാ യെഹൂദന്മാരും ഗ്രീക്കുകാരും
  rationale: γνωστόν എന്നതിനോടു ചേരുന്ന ദത്തിവ് ഈ വിവരം അറിഞ്ഞ ഇരുകൂട്ടരെയും സൂചിപ്പിക്കുന്നു; πᾶσιν എന്ന സമഗ്രത ‘എല്ലാ’ നിലനിർത്തുന്നു.
- source_word: τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: എഫെസൊസിൽ താമസിച്ചിരുന്ന
  rationale: κατοικέω ഒരു സ്ഥലത്ത് വസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇരുകൂട്ടരെയും വിശേഷിപ്പിക്കുന്ന പങ്കുപദം മലയാളത്തിൽ സ്വാഭാവികമായി മുൻനിർത്തി.
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: അവരെയെല്ലാം ഭയം പിടികൂടി
  rationale: ἐπιπίπτωയുടെ പെട്ടെന്നുള്ള ശക്തമായ അനുഭവം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഭയം പിടികൂടി’ എന്ന പ്രയോഗം നൽകുന്നു; πάντας αὐτούς എന്ന സമഗ്രതയും നിലനിൽക്കുന്നു.
- source_word: φόβος
  choice: ഭയം
  rationale: ഈ പദത്തിന് ഭയം, ഭക്ത്യാദരം, ഭീതി എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ ഏറ്റവും വിശാലവും കുറഞ്ഞ വ്യാഖ്യാനഭാരമുള്ളതുമായ പദം ‘ഭയം’ ആണ്.
- source_word: ἐμεγαλύνετο
  choice: മഹത്ത്വപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാല കർമണിപ്രയോഗം തുടർന്നുകൊണ്ടിരുന്ന പൊതുവായ മഹത്വപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം അതിന്റെ ദൈർഘ്യവും ദൃശ്യരൂപകവും നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομα
  choice: നാമം
  rationale: ‘നാമം’ ഇവിടെ പ്രശസ്തി, അധികാരം, ബഹുമാനം എന്നിവ ഉൾക്കൊള്ളാമെങ്കിലും മൂലപാഠത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര പ്രതിധ്വനി നിലനിർത്താൻ നേരിട്ടുള്ള പദം ഉപയോഗിച്ചു.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ
  rationale: κύριος യേശുവിനെക്കുറിച്ചുള്ള സ്ഥാനനാമമായതിനാൽ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിലെ സ്വാഭാവിക ബന്ധരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഈ സന്ദർഭത്തിൽ κύριος ക്രിസ്തുവിനെക്കുറിച്ചുള്ള സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നു; ‘കർത്താവ്’ അതിന്റെ ബൈബിൾപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- issue: τὸ ὄνομα എന്നത് ‘പ്രശസ്തി’ എന്നു ആശയാനുവാദം ചെയ്യണമോ ‘നാമം’ എന്നു നിലനിർത്തണമോ
  choice: കർത്താവായ യേശുവിന്റെ നാമം മഹത്ത്വപ്പെട്ടുകൊണ്ടിരുന്നു
  alternative: കർത്താവായ യേശുവിന്റെ പ്രശസ്തി ഉയർന്നുകൊണ്ടിരുന്നു
  rationale: ‘നാമം’ എന്ന മൂലപ്രയോഗം യേശുവിന്റെ വ്യക്തി, അധികാരം, ബഹുമാനം എന്നിവയെ ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയുന്നതിനാൽ അതിനെ ചുരുക്കി ‘പ്രശസ്തി’ എന്നു മാത്രം വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ഭയം പിടികൂടി’ എന്നത് ഗ്രീക്കിലെ സജീവ രൂപകത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘മഹത്ത്വപ്പെട്ടുകൊണ്ടിരുന്നു’ അപൂർണകാലത്തിന്റെ തുടരുന്ന സ്വഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്യഭാഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
