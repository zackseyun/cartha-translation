id: ACT.19.19
reference: Acts 19:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: ml
  text: മന്ത്രവാദത്തിൽ ഏർപ്പെട്ടിരുന്നവരിൽ പലരും തങ്ങളുടെ ഗ്രന്ഥങ്ങൾ ഒരുമിച്ചുകൊണ്ടുവന്ന് എല്ലാവരുടെയും മുമ്പിൽവെച്ച് കത്തിച്ചുകൊണ്ടിരുന്നു. അവയുടെ വില അവർ കൂട്ടിക്കണക്കാക്കി, ആകെ അമ്പതിനായിരം വെള്ളിനാണയങ്ങൾ എന്ന് കണ്ടെത്തി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വെള്ളിയുടെ അഞ്ച് പതിനായിരങ്ങൾ,’ അതായത് അമ്പതിനായിരം. ഏത് നാണയമാണ് ഉദ്ദേശിച്ചതെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: പലരും
  rationale: ഇവിടെ പദം മതിയായ എണ്ണം എന്നതിലുപരി ഗണ്യമായ ആളുകളെ സൂചിപ്പിക്കുന്നു; ‘പലരും’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὰ περίεργα πραξάντων
  choice: മന്ത്രവാദത്തിൽ ഏർപ്പെട്ടിരുന്നവരിൽ
  rationale: എഫെസൊസിലെ പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം വെറും കൗതുകകരമായ പ്രവൃത്തികളെയല്ല, മന്ത്രവാദപരമായ ആചാരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: συνενέγκαντες τὰς βίβλους
  choice: തങ്ങളുടെ ഗ്രന്ഥങ്ങൾ ഒരുമിച്ചുകൊണ്ടുവന്ന്
  rationale: ഗ്രന്ഥങ്ങൾ ഒരിടത്തേക്ക് കൊണ്ടുവന്നതെന്ന മൂർത്തമായ പ്രവർത്തനം നിലനിർത്തുന്നു; ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ‘തങ്ങളുടെ’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: κατέκαιον
  choice: കത്തിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം പ്രവർത്തനം നടന്നുകൊണ്ടിരുന്നതായി ചിത്രീകരിക്കുന്നതിനാൽ മലയാളത്തിലെ പുരോഗമനരൂപം ഉപയോഗിച്ചു.
- source_word: ἐνώπιον πάντων
  choice: എല്ലാവരുടെയും മുമ്പിൽവെച്ച്
  rationale: പ്രവൃത്തി പരസ്യമായി എല്ലാവരുടെയും സാന്നിധ്യത്തിൽ നടന്നുവെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: അവയുടെ വില അവർ കൂട്ടിക്കണക്കാക്കിയപ്പോൾ
  rationale: വിലകൾ ചേർത്ത് മൊത്തം കണക്കാക്കിയെന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀργυρίου μυριάδας πέντε
  choice: അമ്പതിനായിരം വെള്ളിനാണയങ്ങൾ
  rationale: ‘അഞ്ച് പതിനായിരങ്ങൾ’ എന്ന സംഖ്യ അമ്പതിനായിരമാണ്; വെള്ളിയുടെ കൃത്യമായ നാണയമൂല്യം മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പ്രത്യേക നാണയനാമം ഒഴിവാക്കി.
theological_decisions:
- issue: τὰ περίεργα എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: മന്ത്രവാദം
  alternative: നിഗൂഢാചാരങ്ങൾ; കൗതുകകരമായ പ്രവൃത്തികൾ
  rationale: ദുരാത്മാക്കൾ, ഭൂതോച്ചാടകർ, മന്ത്രഗ്രന്ഥങ്ങൾ എന്നിവ ഉൾപ്പെടുന്ന സമീപസന്ദർഭം മന്ത്രവാദപരമായ പ്രവർത്തനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സാങ്കേതിക മതപദങ്ങൾ ഇതിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഗ്രന്ഥങ്ങൾ’ എഴുത്തുരേഖകളുടെ സ്വഭാവം നിലനിർത്തുന്നു; ‘കത്തിച്ചുകൊണ്ടിരുന്നു’ ഗ്രീക്ക് അപൂർണ ഭൂതകാലത്തിന്റെ പുരോഗമനഭാവം പ്രകടിപ്പിക്കുന്നു. അടിക്കുറിപ്പുകൾ യഥാക്രമം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനും മൂല്യത്തിനും പിന്നാലെ നൽകിയിരിക്കുന്നു.
