id: ACT.19.35
reference: Acts 19:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: ml
  text: 'എന്നാൽ നഗരകാര്യദർശി ജനക്കൂട്ടത്തെ ശാന്തമാക്കിയശേഷം പറഞ്ഞു: “എഫെസൊസുകാരായ പുരുഷന്മാരേ, മഹതിയായ അർത്തെമിസിന്റെയും ആകാശത്തുനിന്നു വീണ വിഗ്രഹത്തിന്റെയും[b] ക്ഷേത്രപരിപാലക[a]യാണ് എഫെസൊസുകാരുടെ നഗരം എന്ന് അറിയാത്ത മനുഷ്യൻ ആരുണ്ട്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹതിയായ അർത്തെമിസിന്റെ ക്ഷേത്രത്തിന്റെ കാവൽനഗരം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം ഒരു ക്ഷേത്രത്തിന്റെയോ ആരാധനാക്രമത്തിന്റെയോ ഔദ്യോഗിക പരിപാലകയായി അംഗീകരിക്കപ്പെട്ട നഗരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ആകാശത്തുനിന്നു വീണ വസ്തുവിന്റെയും.’ ഗ്രീക്കുപദം ആകാശത്തുനിന്നു വീണതായി വിശ്വസിക്കപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് അർത്തെമിസുമായി ബന്ധപ്പെട്ട ആരാധനാവിഗ്രഹമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: ശാന്തരാക്കിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ γραμματεὺς
  choice: നഗരകാര്യദർശി
  rationale: ഇവിടെ യെഹൂദ ലേഖകനെയല്ല, എഫെസൊസിലെ ഉന്നത നഗരഭരണ ഉദ്യോഗസ്ഥനെയാണ് സൂചിപ്പിക്കുന്നത്; ആ ഭരണപരമായ പങ്ക് വ്യക്തമാക്കുന്ന പദം.
- source_word: τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തെ
  rationale: കലഹാവസ്ഥയിലുള്ള പൊതുജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപ്രയോഗം.
- source_word: Ἄνδρες Ἐφέσιοι
  choice: എഫെസൊസുകാരേ
  rationale: ഔപചാരിക സംബോധന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പുരുഷന്മാരെ വേർതിരിച്ച് പറയുന്നത് ഈ പൊതുസമ്മേളനസന്ദർഭത്തിൽ അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: τίς γάρ ἐστιν ἀνθρώπων ὃς οὐ γινώσκει
  choice: അറിയാത്ത മനുഷ്യൻ ആരുണ്ട്?
  rationale: ഗ്രീക്കിലെ വാഗ്വൈഭവമുള്ള നിഷേധാത്മക ചോദ്യത്തിന്റെ ഏകവചനശക്തിയും പൊതുവായ മനുഷ്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: τὴν Ἐφεσίων πόλιν
  choice: എഫെസൊസുകാരുടെ നഗരം
  rationale: ഗ്രീക്കിലെ genitive ഘടന സുതാര്യമായി സംരക്ഷിക്കുന്നു.
- source_word: νεωκόρον
  choice: ക്ഷേത്രപരിപാലക
  rationale: ഒരു ദേവാലയത്തിന്റെയോ ആരാധനാക്രമത്തിന്റെയോ ഔദ്യോഗിക സംരക്ഷകയായി അംഗീകരിക്കപ്പെട്ട നഗരത്തെ സൂചിപ്പിക്കുന്ന cultic-civic അർഥം നൽകുന്നു.
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: മഹതിയായ അർത്തെമിസിന്റെ
  rationale: ദേവതയ്ക്കു നൽകിയിരുന്ന ബഹുമാനപദവിയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τοῦ διοπετοῦς
  choice: ആകാശത്തുനിന്നു വീണ വിഗ്രഹത്തിന്റെ
  rationale: പദം അക്ഷരാർഥത്തിൽ ആകാശത്തുനിന്നു വീണ വസ്തുവിനെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അർത്തെമിസുമായി ബന്ധപ്പെട്ട ആരാധനാവിഗ്രഹമാണ് സാധ്യതയുള്ള സൂചന. ഈ വ്യാഖ്യാനവ്യക്തീകരണം അടിക്കുറിപ്പിലൂടെ തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: അർത്തെമിസിനെയും διοπετές വസ്തുവിനെയും കുറിച്ചുള്ള അന്യമതപരമായ അവകാശവാദം
  choice: പ്രസംഗകന്റെ അവകാശവാദമായി ‘മഹതിയായ അർത്തെമിസിന്റെയും ആകാശത്തുനിന്നു വീണ വിഗ്രഹത്തിന്റെയും’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മഹതിയായ അർത്തെമിസിന്റെ ക്ഷേത്രത്തിന്റെയും ആകാശത്തുനിന്നു വീണ വസ്തുവിന്റെയും കാവൽനഗരം’
  rationale: വാക്യം നഗരകാര്യദർശിയുടെ മതപരമായ പ്രസ്താവന റിപ്പോർട്ട് ചെയ്യുന്നതാണ്, അതിന്റെ സത്യത തിരുവെഴുത്ത് അംഗീകരിക്കുന്നതല്ല. ‘വിഗ്രഹം’ സന്ദർഭസാദ്ധ്യത വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്കിലെ കൂടുതൽ അനിശ്ചിതമായ ‘വസ്തു’ എന്ന സാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഔപചാരികവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. നഗരഭരണ-ആരാധനാപര പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തുകയും പ്രസംഗകന്റെ അന്യമതാവകാശവാദത്തെ പരിഭാഷകന്റെ അംഗീകാരമായി തോന്നാതിരിക്കാൻ റിപ്പോർട്ടുശൈലി സംരക്ഷിക്കുകയും ചെയ്തു.
