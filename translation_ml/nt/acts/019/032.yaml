source:
  edition: SBLGNT
  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: ml
  text: അങ്ങനെ, ചിലർ ഒരു കാര്യം, മറ്റു ചിലർ വേറൊരു കാര്യം വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു. കാരണം, ആ സമ്മേളനം[a] ആകെ ആശയക്കുഴപ്പത്തിലായിരുന്നു; തങ്ങൾ എന്തിനാണ് ഒരുമിച്ചുകൂടിയതെന്ന് അവരിൽ മിക്കവർക്കും അറിയില്ലായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കൂടിവന്ന ജനസമൂഹം” അല്ലെങ്കിൽ “ജനക്കൂട്ടം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം ἐκκλησία ആണ്; ഈ സന്ദർഭത്തിൽ അത് ക്രൈസ്തവസഭയെയല്ല, ഒരു പൗരസമ്മേളനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: അങ്ങനെ, ചിലർ ഒന്നും മറ്റു ചിലർ മറ്റൊന്നും വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: ἄλλοι ... ἄλλο τι എന്ന വിതരണാത്മക വൈരുധ്യം ‘ചിലർ ... മറ്റു ചിലർ ...’ എന്ന് സ്വാഭാവികമായി നൽകി. അപൂർണഭൂതകാലമായ ἔκραζον സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ബഹളപ്രവർത്തനം ‘വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി; μὲν οὖν സന്ദർഭോചിതമായി ‘അങ്ങനെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκκλησία
  choice: സഭ
  rationale: ഈ പൗരസമ്മേളനസന്ദർഭത്തിൽ ἐκκλησία ക്രൈസ്തവസഭയെയല്ല, കൂടിയിരിക്കുന്ന പൊതുസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭ’ മൂലപദത്തിന്റെ ഔപചാരിക സമ്മേളനഭാവം നിലനിർത്തുന്നു; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
- source_word: συγκεχυμένη
  choice: ആകെ ആശയക്കുഴപ്പത്തിലായിരുന്നു
  rationale: συγχέω എന്നതിന്റെ perfect participle ഉണ്ടായിത്തീർന്ന കലക്കത്തിന്റെ നിലയെ സൂചിപ്പിക്കുന്നു. ‘ആകെ ആശയക്കുഴപ്പത്തിലായിരുന്നു’ ആ ഫലാവസ്ഥയും ജനക്കൂട്ടത്തിലെ കുഴപ്പവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ πλείους
  choice: അവരിൽ മിക്കവർക്കും
  rationale: Substantival comparative ആയ οἱ πλείους ഇവിടെ ‘ഭൂരിപക്ഷം/മിക്കവരും’ എന്നാണ്. ‘അവരിൽ മിക്കവർക്കും’ എന്നത് കൂടിയിരുന്നവരിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: τίνος ἕνεκα
  choice: എന്തിനാണ്
  rationale: ‘എന്ത് കാരണത്താൽ/എന്ത് ഉദ്ദേശ്യത്തോടെ’ എന്ന അർഥപരിധി മലയാളത്തിലെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ‘എന്തിനാണ്’ നിലനിർത്തുന്നു; കാരണം-ഉദ്ദേശ്യം എന്ന യഥാർഥ ലഘു അവ്യക്തത നിർബന്ധമായി പരിഹരിക്കുന്നില്ല.
- source_word: συνεληλύθεισαν
  choice: ഒരുമിച്ചുകൂടിയതെന്ന്
  rationale: συνέρχομαι എന്നതിന്റെ pluperfect കഥയിലെ ആ സമയത്തിനു മുമ്പേ അവർ കൂടിയെത്തിയിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഒരുമിച്ചുകൂടിയതെന്ന്’ ആ മുൻകാല സംഭവത്തെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐκκλησία എന്ന പദത്തിന്റെ സഭാസംബന്ധമായോ പൗരസമ്മേളനസംബന്ധമായോ ഉള്ള അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘സഭ’; അടിക്കുറിപ്പിൽ ഇവിടെ പൗരസമ്മേളനമാണെന്ന് വ്യക്തമാക്കി
  alternative: ‘കൂടിവന്ന ജനസമൂഹം’ അല്ലെങ്കിൽ ‘ജനക്കൂട്ടം’
  rationale: മൂലഗ്രീക്കിലെ പദബന്ധം നിലനിർത്തിക്കൊണ്ട് ഈ സന്ദർഭത്തിൽ അതിനെ ക്രൈസ്തവസഭയായി തെറ്റായി വായിക്കാതിരിക്കാനാണ് അടിക്കുറിപ്പ്. ‘ജനക്കൂട്ടം’ മാത്രം ഉപയോഗിച്ചാൽ ἐκκλησίαയുടെ സമ്മേളനഭാവം ക്ഷയിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ബഹളത്തിന്റെ തുടർച്ച ‘വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നും, കൂട്ടത്തിന്റെ അവസ്ഥ ‘ആകെ ആശയക്കുഴപ്പത്തിലായിരുന്നു’ എന്നും നൽകി. ‘സഭ’ എന്ന പദത്തിന്റെ സന്ദർഭാർത്ഥം അടിക്കുറിപ്പിലൂടെ നിയന്ത്രിച്ചു.
