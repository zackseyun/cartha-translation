id: ACT.19.5
reference: Acts 19:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/005.yaml
  text: And when they heard this[a], they were baptized in the name of the Lord Jesus.
translation:
  language: ml
  text: ഇതു കേട്ടപ്പോൾ അവർ കർത്താവായ യേശുവിന്റെ നാമത്തിലേക്കു സ്നാനം ഏറ്റു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പരമ്പരാഗതമായി: “കർത്താവായ യേശുവിന്റെ നാമത്തിൽ സ്നാനം ഏറ്റു.”'
    reason: εἰς τὸ ὄνομα എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് കൂടുതൽ പരിചിതവും പരമ്പരാഗതവുമായ മലയാള പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ കാലസൂചകമായി പ്രവർത്തിക്കുന്ന aorist participle ആണ്. ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത കർമം മുൻസംഭാഷണത്തിൽനിന്ന് വ്യക്തമായതിനാൽ, സ്വാഭാവിക മലയാളത്തിനായി ‘ഇതു’ എന്നു വ്യക്തമാക്കി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് നേരിയ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും ‘കേട്ടപ്പോൾ’ എന്ന ഘടനയും തുടർച്ച സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാൽ വേറൊരു ബന്ധകപദം ചേർത്തില്ല.
- source_word: ἐβαπτίσθησαν
  choice: സ്നാനം ഏറ്റു
  rationale: ഗ്രീക്കിലെ passive അർഥം, സ്നാനം ലഭിച്ചവരെന്ന സ്വീകർത്തൃഭാവം നിലനിർത്തിക്കൊണ്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘സ്നാനം ചെയ്യപ്പെട്ടു’ എന്നത് യാന്ത്രികവും അസ്വാഭാവികവുമാകും.
- source_word: εἰς τὸ ὄνομα
  choice: നാമത്തിലേക്കു
  rationale: εἰς എന്നതിന്റെ ദിശാത്മകവും ബന്ധത്തിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കാവുന്നതുമായ ശക്തി സംരക്ഷിക്കുന്നു. കൂടുതൽ പരിചിതമായ ‘നാമത്തിൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവായ
  rationale: ഈ ക്രിസ്തുസംബന്ധിയായ സന്ദർഭത്തിൽ κύριος യേശുവിന്റെ സ്ഥാനനാമമാണ്. മലയാളത്തിലെ സ്വാഭാവിക നാമസംയോജനത്തിനായി ‘കർത്താവായ യേശു’ എന്നു നൽകി.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: Ἰησοῦς എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
theological_decisions:
- issue: സ്നാനവുമായി ബന്ധപ്പെട്ട εἰς τὸ ὄνομα എന്ന പ്രയോഗം
  choice: കർത്താവായ യേശുവിന്റെ നാമത്തിലേക്കു
  alternative: കർത്താവായ യേശുവിന്റെ നാമത്തിൽ
  rationale: മൂലപാഠത്തിലെ εἰς എന്ന ഉപസർഗത്തിന്റെ ദിശാത്മക/ബന്ധാത്മക സൂചന നഷ്ടപ്പെടുത്താതിരിക്കാൻ ‘നാമത്തിലേക്കു’ സ്വീകരിച്ചു. എന്നാൽ ആരാധനാഭാഷയിലും പരമ്പരാഗത വിവർത്തനങ്ങളിലും പരിചിതമായ ‘നാമത്തിൽ’ എന്ന വായനയും ഭാഷാപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി; പിന്നീട് രൂപപ്പെട്ട ആചാരപരമായ സൂത്രവാക്യങ്ങളുമായി പാഠത്തെ നിർബന്ധമായി ഒത്തുചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നാമത്തിലേക്കു’ ഉദ്ദേശപൂർവം മൂലഭാഷയോട് അടുത്ത രൂപമാണ്; അതിന്റെ അപരിചിതത്വം അടിക്കുറിപ്പിലെ സ്വാഭാവിക പരമ്പരാഗത രൂപം സമതുലിതമാക്കുന്നു.
