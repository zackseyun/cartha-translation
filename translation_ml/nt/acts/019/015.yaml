id: ACT.19.15
reference: Acts 19:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: ml
  text: 'എന്നാൽ ദുരാത്മാവ് അവരോടു മറുപടി പറഞ്ഞു: “യേശുവിനെ എനിക്ക് അറിയാം; പൗലോസിനെയും എനിക്ക് പരിചയമുണ്ട്[a]. എന്നാൽ നിങ്ങൾ ആരാണ്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “യേശുവിനെ എനിക്ക് അറിയാം; പൗലോസിനെക്കുറിച്ചും എനിക്ക് അറിയാം.” ഗ്രീക്കിൽ ഇവിടെ രണ്ട് വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: γινώσκω (“അറിയുക”), ἐπίσταμαι (“അറിയുക,” “പരിചയമുണ്ടായിരിക്കുക”). ഇവ അർഥസൂക്ഷ്മതയിലെ ഒരു വ്യത്യാസം സൂചിപ്പിച്ചേക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: അവരോടു മറുപടി പറഞ്ഞു
  rationale: കൃദന്തരൂപവും മുഖ്യക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാള വാക്യമായി അവതരിപ്പിക്കുന്നു; മറുപടിയുടെ ഭാവവും അഭിസംബോധിതരെയും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കഥയിലെ വിരുദ്ധമായ വഴിത്തിരിവ് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ദുരാത്മാവ്
  rationale: ദുഷ്ടമായ വ്യക്തിസ്വഭാവമുള്ള ആത്മീയ സത്തയെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ പൊതുവായി മനസ്സിലാകുന്ന സംക്ഷിപ്ത പദം.
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: യേശുവിനെ എനിക്ക് അറിയാം
  rationale: γινώσκω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുകയും യേശു എന്ന പേരിന് ഗ്രീക്കിലുള്ള മുൻനിലയുടെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: പൗലോസിനെയും എനിക്ക് പരിചയമുണ്ട്
  rationale: γινώσκω, ἐπίσταμαι എന്നീ വ്യത്യസ്ത ക്രിയകളുടെ സൂക്ഷ്മ വ്യത്യാസം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: എന്നാൽ നിങ്ങൾ ആരാണ്?
  rationale: ὑμεῖς എന്ന ഊന്നലും δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘നിങ്ങൾ’ ബഹുവചനമാണെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
theological_decisions:
- issue: γινώσκω, ἐπίσταμαι എന്നീ രണ്ടു അറിവുക്രിയകൾ തമ്മിലുള്ള വ്യത്യാസം
  choice: “യേശുവിനെ എനിക്ക് അറിയാം; പൗലോസിനെയും എനിക്ക് പരിചയമുണ്ട്”
  alternative: “യേശുവിനെ എനിക്ക് അറിയാം; പൗലോസിനെക്കുറിച്ചും എനിക്ക് അറിയാം” അല്ലെങ്കിൽ രണ്ടിടത്തും “അറിയാം”
  rationale: മൂലപാഠത്തിലെ വ്യത്യസ്ത ക്രിയകൾക്ക് വ്യത്യസ്ത മലയാള പ്രയോഗങ്ങൾ നൽകി വാചകത്തിന്റെ അലങ്കാരപരമായ വ്യത്യാസം സംരക്ഷിക്കുന്നു. അതേസമയം ദുരാത്മാവിന്റെ അറിവിന്റെ അളവിനെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ മലയാളം. ‘ദുരാത്മാവ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. ഉദ്ധരണിയിലെ സമാന്തരഘടനയും അവസാനത്തെ ശക്തമായ വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
