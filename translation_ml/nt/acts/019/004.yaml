id: ACT.19.4
reference: Acts 19:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: ml
  text: 'പൗലോസ് പറഞ്ഞു: “യോഹന്നാൻ മാനസാന്തരത്തിന്റെ സ്നാനം നൽകി[a]. തന്റെ പിന്നാലെ വരുന്നവനിൽ—അതായത്, യേശുവിൽ—വിശ്വസിക്കണമെന്ന് യോഹന്നാൻ ജനങ്ങളോടു പറഞ്ഞു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ‘സ്നാനപ്പെടുത്തി’ എന്ന ക്രിയയും ‘സ്നാനം’ എന്ന നാമവും ഒരേ ധാതിയിൽനിന്നുള്ള സമാനധാതുപ്രയോഗമായിട്ടുണ്ട്; അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്നാൽ: “യോഹന്നാൻ മാനസാന്തരത്തിന്റെ ഒരു സ്നാനം നടത്തി.”'
    reason: ഗ്രീക്കിലെ ἐβάπτισεν βάπτισμα എന്ന സമാനധാതുഘടന സൂചിപ്പിക്കുമ്പോൾ മലയാളത്തിൽ അസ്വാഭാവികമായ ‘സ്നാനം സ്നാനപ്പെടുത്തി’ എന്ന രൂപം ഒഴിവാക്കുന്നു.
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: മാനസാന്തരത്തിന്റെ സ്നാനം നൽകി
  rationale: ഗ്രീക്കിലെ സമാനധാതുപ്രയോഗം അക്ഷരാർഥത്തിൽ ആവർത്തിക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാണ്. ‘സ്നാനം നൽകി’ എന്നത് പ്രവൃത്തിയെ സ്വാഭാവികമായി അറിയിക്കുകയും ‘മാനസാന്തരത്തിന്റെ’ എന്നത് സ്നാനത്തിന്റെ സ്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῷ λαῷ
  choice: ജനത്തോടു
  rationale: λαός എന്ന പൊതുവായ സമൂഹസൂചനയെ നിലനിർത്തുന്നു; ‘ഇസ്രായേൽജനം’ എന്നു ചേർത്ത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: സ്നാനം നൽകുന്നതിനോടൊപ്പം നടന്ന യോഹന്നാന്റെ പ്രഖ്യാപനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: തന്റെ പിന്നാലെ വരുന്നവനിൽ
  rationale: πιστεύω സഹിതമുള്ള εἰς വിശ്വാസത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-യിൽ വിശ്വസിക്കുക’ യോജിക്കുന്നു; μετ’ αὐτόν ഇവിടെ കാലക്രമത്തിലും ശുശ്രൂഷാക്രമത്തിലും പിന്നാലെ വരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα πιστεύσωσιν
  choice: വിശ്വസിക്കണമെന്ന്
  rationale: പറച്ചിലിന്റെ ഉദ്ദേശ്യവും ഉള്ളടക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ ഉദ്ദേശ്യനിറം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: മുമ്പ് പറഞ്ഞ ‘വരുന്നവൻ’ ആരെന്നു വിശദീകരിക്കുന്ന സൂത്രവാക്യത്തിന് നേരായ മലയാളരൂപം.
- source_word: εἰς τὸν Ἰησοῦν
  choice: യേശുവിൽ
  rationale: മുൻവാക്യത്തിലെ ‘വിശ്വസിക്കുക’ ഇവിടെ അധ്യാഹരിക്കപ്പെടുന്നു. മൂലപാഠത്തിൽ Χριστός ഇല്ലാത്തതിനാൽ ‘ക്രിസ്തുവായ യേശു’ എന്നു ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യോഹന്നാന്റെ സ്നാനവും യേശുവിലുള്ള വിശ്വാസവും തമ്മിലുള്ള ബന്ധം
  choice: യോഹന്നാന്റെ സ്നാനം മാനസാന്തരവുമായി ബന്ധപ്പെട്ട സ്നാനമായും, അതോടൊപ്പം തന്റെ പിന്നാലെ വരുന്ന യേശുവിൽ വിശ്വസിക്കാനുള്ള ആഹ്വാനം ഉണ്ടായിരുന്നതായും വിവർത്തനം ചെയ്യുന്നു.
  alternative: യോഹന്നാന്റെ സ്നാനം തന്നെയാണ് ക്രിസ്തീയ വിശ്വാസം ഫലിപ്പിച്ചതെന്നോ, പിന്നാലെ വരുന്നവൻ ആരെന്നത് വ്യക്തമല്ലെന്നോ അവതരിപ്പിക്കുക.
  rationale: വാക്യഘടന സ്നാനത്തെയും അതോടൊപ്പമുള്ള സന്ദേശത്തെയും ബന്ധിപ്പിച്ചെങ്കിലും വേർതിരിച്ചാണ് അവതരിപ്പിക്കുന്നത്; ‘അതായത്, യേശുവിൽ’ എന്ന വിശദീകരണം വരാനിരിക്കുന്നവനെ വ്യക്തമായി തിരിച്ചറിയുന്നു. സ്നാനത്തിന്റെ ഫലത്തെക്കുറിച്ച് പാഠം പറയാത്ത ഒരു സിദ്ധാന്തനിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പശ്ചാത്താപം’ എന്നതിനേക്കാൾ ജീവിതദിശയിലെ മാറ്റം ഉൾക്കൊള്ളുന്ന പരമ്പരാഗതവും വ്യാപകമായി ഗ്രഹിക്കപ്പെടുന്നതുമായ ‘മാനസാന്തരം’ തിരഞ്ഞെടുത്തു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വ്യക്തതയ്ക്കായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി.
