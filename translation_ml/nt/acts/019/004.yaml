  to: 'പൗലോസ് പറഞ്ഞു: “യോഹന്നാൻ മാനസാന്തരത്തിന്റെ സ്നാനം നൽകി[a]. തന്റെ പിന്നാലെ വരുന്നവനിൽ—അതായത്, യേശുവിൽ—വിശ്വസിക്കണമെന്ന് യോഹന്നാൻ ജനങ്ങളോടു പറഞ്ഞു.”'
