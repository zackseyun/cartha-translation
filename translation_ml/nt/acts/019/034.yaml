  text: ἐπιγνόντες δὲ ὅτι Ἰουδαῖός ἐστιν φωνὴ ἐγένετο μία ἐκ πάντων ⸀ὡς ἐπὶ ὥρας δύο κραζόντων· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: ml
  text: 'എന്നാൽ, അവൻ യഹൂദനാണെന്ന്[a] അവർ തിരിച്ചറിഞ്ഞപ്പോൾ, എല്ലാവരിൽനിന്നും ഒറ്റ സ്വരം ഉയർന്നു. ഏകദേശം രണ്ടു മണിക്കൂർ അവർ ഇങ്ങനെ ആർത്തുവിളിച്ചു: “എഫെസ്യരുടെ അർത്തെമിസ് മഹത്തിയാണ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യയിൽനിന്നുള്ള ഒരാൾ.” ഗ്രീക്ക് പദത്തിന് യഹൂദനെയോ യെഹൂദ്യയിൽനിന്നുള്ള ഒരാളെയോ സൂചിപ്പിക്കാം; ഇവിടെ വിശാലമായ വംശീയ-മതപരമായ അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: അവർ തിരിച്ചറിഞ്ഞപ്പോൾ
  rationale: മുൻകൂട്ടി സംഭവിച്ച സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലബന്ധം സ്വാഭാവികമായി നൽകുകയും, ജനക്കൂട്ടം അലക്സാണ്ടറുടെ യഹൂദസ്വത്വം തിരിച്ചറിഞ്ഞതിനെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംസാരശ്രമത്തിന് വിരുദ്ധമായ സംഭവവികാസം സൂചിപ്പിക്കുന്നു.
- source_word: Ἰουδαῖός
  choice: ഒരു യഹൂദൻ
  rationale: എഫെസൊസെന്ന പ്രവാസപശ്ചാത്തലത്തിൽ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യൻ’ എന്നതിനെക്കാൾ വംശീയ-മതപരമായ ‘യഹൂദൻ’ ആണ് കൂടുതൽ സാധ്യതയുള്ള അർഥം.
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: എല്ലാവരിൽനിന്നും ഒരേ സ്വരം ഉയർന്നു
  rationale: ജനക്കൂട്ടത്തിന്റെ ഏകകണ്ഠമായ ആർപ്പുവിളി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: ഏകദേശം രണ്ടു മണിക്കൂറോളം
  rationale: അളവിനോടൊപ്പമുള്ള ὡς സൂചിപ്പിക്കുന്ന ഏകദേശത സംരക്ഷിക്കുന്നു.
- source_word: κραζόντων
  choice: അവർ ഇങ്ങനെ ആർത്തുവിളിച്ചു
  rationale: വർത്തമാന participle സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ഉച്ചത്തിലുള്ള വിളി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: എഫെസ്യരുടെ അർത്തെമിസ് മഹതിയാകുന്നു!
  rationale: ആരാധനാപരമായ ഉദ്‌ഘോഷത്തിന്റെ സ്വഭാവവും Ἐφεσίων എന്ന genitive-ന്റെ ബന്ധാർഥവും നിലനിർത്തുന്നു; ‘മഹതി’ ദേവിയുടെ സ്ത്രീലിംഗവും മഹത്ത്വപ്രഖ്യാപനവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Ἰουδαῖος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഒരു യഹൂദൻ
  alternative: ഒരു യെഹൂദ്യൻ
  rationale: ഇവിടെ ജനക്കൂട്ടം പ്രതികരിക്കുന്നത് അലക്സാണ്ടറുടെ ഭൂമിശാസ്ത്രപരമായ ജന്മദേശത്തേക്കാൾ അവന്റെ വംശീയ-മതപരമായ തിരിച്ചറിയലിനോടാണ്. എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഏകസ്വരത്തിന്റെ ദൃശ്യരൂപവും ഏകദേശ സമയസൂചനയും നിലനിർത്തിയപ്പോൾ, ദീർഘമായ ആർപ്പുവിളി മലയാളത്തിൽ വ്യക്തമായ രണ്ടു വാക്യങ്ങളാക്കി.
