    issue: The rendering of ἴσχυσεν κατ’ αὐτῶν is aspectually and semantically imprecise.
    rationale: “അവരെക്കാൾ ശക്തനായിത്തീർന്നു” suggests a change into a stronger state, whereas the Greek states that he prevailed against them. “അവർക്കെതിരെ ജയിച്ചു” conveys the completed hostile dominance more directly.
