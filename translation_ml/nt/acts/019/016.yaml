id: ACT.19.16
reference: Acts 19:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: ml
  text: ദുരാത്മാവ് ഉണ്ടായിരുന്ന ആ മനുഷ്യൻ അവരുടെമേൽ ചാടിവീണ്, ഇരുവരെയും കീഴടക്കി അവർക്കെതിരെ ജയിച്ചു[a]; അങ്ങനെ അവർ നഗ്നരും മുറിവേറ്റവരുമായി ആ വീട്ടിൽനിന്ന് ഓടിരക്ഷപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെമേൽ കുതിച്ചുചാടി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: അവരുടെമേൽ ചാടിവീണു
  rationale: പെട്ടെന്നുള്ള ശാരീരികാക്രമണം സൂചിപ്പിക്കുന്ന ക്രിയയുടെ സജീവതയും തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἄνθρωπος
  choice: ആ മനുഷ്യൻ
  rationale: സന്ദർഭത്തിലെ പുരുഷനായ വ്യക്തിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: ദുരാത്മാവ് ഉള്ളിലുണ്ടായിരുന്ന
  rationale: ആത്മാവ് മനുഷ്യനിൽ ഉണ്ടായിരുന്നുവെന്ന ഗ്രീക്ക് ഘടനയോട് അടുത്തുനിൽക്കുന്നു; സാങ്കേതികമായ പിൽക്കാല പദപ്രയോഗം ചേർക്കുന്നില്ല.
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: ദുരാത്മാവ്
  rationale: ദുഷ്ടമായ ആത്മാവിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തവും പതിവുമായ പ്രയോഗമാണ്.
- source_word: κατακυριεύσας
  choice: കീഴടക്കി
  rationale: ബലപ്രയോഗത്തിലൂടെ മേൽക്കൈ നേടുന്നതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἀμφοτέρων
  choice: ആ ഇരുവരെയും
  rationale: ഗ്രീക്കിലെ ‘ഇരുവരും’ എന്ന വ്യക്തമായ സംഖ്യാവിവരം നിലനിർത്തുകയും വിശാലസന്ദർഭത്തിലെ സംഘർഷം പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: അവരെക്കാൾ ശക്തനായിത്തീർന്നു
  rationale: മുൻപുള്ള ‘കീഴടക്കി’ എന്ന ആശയം വെറുതെ ആവർത്തിക്കാതെ, അവർക്കെതിരെ കൂടുതൽ ശക്തി തെളിയിച്ചു എന്ന സ്വതന്ത്ര ആശയം സംരക്ഷിക്കുന്നു.
- source_word: γυμνούς
  choice: നഗ്നരായി
  rationale: വസ്ത്രം എങ്ങനെ നഷ്ടപ്പെട്ടു എന്ന് അനുമാനിക്കാതെ ഗ്രീക്ക് പറയുന്ന അവസ്ഥ നേരിട്ട് നൽകുന്നു.
- source_word: τετραυματισμένους
  choice: മുറിവേറ്റവരായി
  rationale: മുറിവേൽപ്പിക്കപ്പെട്ടതിന്റെ ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത തീവ്രത ചേർക്കുന്നില്ല.
- source_word: ἐκφυγεῖν
  choice: ഓടിരക്ഷപ്പെട്ടു
  rationale: അപകടത്തിൽനിന്നുള്ള രക്ഷപ്പെടലും സ്ഥലത്തുനിന്നുള്ള വേഗത്തിലുള്ള പുറപ്പെടലും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് അറിയിക്കുന്നു.
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: ആ വീട്ടിൽനിന്ന്
  rationale: പരാമർശിച്ച പ്രത്യേക വീട്ടിൽനിന്നുള്ള പുറപ്പെടൽ നേരിട്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദുരാത്മാവ് മനുഷ്യനിൽ ഉണ്ടായിരുന്നതിന്റെ വിവരണം
  choice: ദുരാത്മാവ് ഉള്ളിലുണ്ടായിരുന്ന ആ മനുഷ്യൻ
  alternative: ദുരാത്മാവ് ബാധിച്ചിരുന്ന ആ മനുഷ്യൻ
  rationale: ഗ്രീക്ക് ആത്മാവ് അവനിൽ ഉണ്ടായിരുന്നു എന്ന് പറയുന്നു. തിരഞ്ഞെടുത്ത രൂപം ആ സ്ഥലബന്ധം നിലനിർത്തുകയും ‘ബാധിച്ച’ എന്ന വ്യാഖ്യാനപരമായ പദം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: വിശാലസന്ദർഭത്തോടുള്ള ἀμφοτέρων എന്ന പദത്തിന്റെ ബന്ധം
  choice: ആ ഇരുവരെയും
  alternative: അവരെയെല്ലാം
  rationale: മുൻസന്ദർഭത്തിൽ കൂടുതൽ ആളുകളെ പരാമർശിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് വ്യക്തമായി ‘ഇരുവരും’ എന്നു പറയുന്നു. ആ വാചകസംഘർഷം തിരുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പ്രവർത്തനക്രമം വ്യക്തമായി നൽകാൻ നീണ്ട വാക്യം രണ്ടായി തിരിച്ചു; ‘ഇരുവരെയും’ എന്ന അസൗകര്യമുള്ളെങ്കിലും പ്രധാനപ്പെട്ട മൂലപാഠവിശദാംശം മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
