  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: ml
  text: ഇങ്ങനെ കർത്താവിന്റെ വചനം ശക്തിയോടെ വളരുകയും പ്രബലപ്പെടുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശക്തമായി വളരുകയും പ്രബലപ്പെടുകയും ചെയ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. κατὰ κράτος എന്ന പ്രയോഗം ‘ശക്തിയോടെ’, ‘ശക്തമായി’ എന്നീ അർഥങ്ങളിൽ ക്രിയാവിശേഷണപരമായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മുൻവിവരിച്ച സംഭവങ്ങളുടെ ഫലത്തെയും അവ നടന്ന രീതിയെയും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: κατὰ κράτος
  choice: ശക്തിയോടെ
  rationale: ശക്തി, പ്രാബല്യം, ഫലപ്രാപ്തി എന്നിവ സൂചിപ്പിക്കുന്ന പ്രയോഗം; രണ്ടു ക്രിയകളോടും സ്വാഭാവികമായി ചേർത്തുവായിക്കാം.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഗ്രീക്കിലെ പദവി അതേപടി നിലനിർത്തുന്നു; പ്രധാനപാഠത്തിൽ അതിന്റെ സൂചിതവ്യക്തിയെ ‘യേശു’ എന്നു വ്യക്തമാക്കുന്നില്ല.
- source_word: ὁ λόγος
  choice: വചനം
  rationale: പ്രഘോഷിക്കപ്പെട്ട സന്ദേശത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; അപ്പൊസ്തലപ്രവൃത്തികളിലെ ആവർത്തിത പ്രയോഗവും സഭാപരമായ പരിചിതത്വവും നിലനിർത്തുന്നു.
- source_word: ηὔξανεν
  choice: വളരുകയും
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ പുരോഗതി സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἴσχυεν
  choice: പ്രബലപ്പെടുകയും ചെയ്തു
  rationale: ശക്തി കൈവരിച്ച് ഫലപ്രദമായി മുന്നേറുന്ന ആശയം നൽകുന്നു; ‘വളരുക’ എന്നതിനോട് ചേർന്നിട്ടും രണ്ടാമത്തെ ക്രിയയുടെ പ്രത്യേക അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοῦ κυρίου എന്നതിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവായ യേശു’
  rationale: സന്ദർഭം യേശുവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പാഠം ‘കർത്താവ്’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ സൂചിതവ്യക്തിയെ പരിഭാഷയിൽ അധികമായി വ്യക്തമാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
