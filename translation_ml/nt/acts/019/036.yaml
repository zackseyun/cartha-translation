id: ACT.19.36
reference: Acts 19:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναντιρρήτων οὖν ὄντων τούτων δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν καὶ μηδὲν προπετὲς πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: ml
  text: അതിനാൽ, ഈ കാര്യങ്ങൾ നിഷേധിക്കാനാവാത്തവയായിരിക്കെ[a], നിങ്ങൾ ശാന്തരായിരിക്കുകയും എടുത്തുചാടി ഒന്നും ചെയ്യാതിരിക്കുകയും വേണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തർക്കിക്കാനാവാത്തവയായിരിക്കെ” അല്ലെങ്കിൽ “എതിർത്തുപറയാനാവാത്തവയായിരിക്കെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ധൃതിപിടിച്ച് ഒന്നും ചെയ്യാതിരിക്കുകയും വേണം” അല്ലെങ്കിൽ “വിവേകമില്ലാതെ ഒന്നും ചെയ്യാതിരിക്കുകയും വേണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: നിഷേധിക്കാനാവാത്തവ
  rationale: എതിർത്തുപറയാനോ തർക്കിക്കാനോ കഴിയാത്തത് എന്ന അർഥബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὄντων τούτων
  choice: ഈ കാര്യങ്ങൾ ... ആയിരിക്കെ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ സാഹചര്യപരവും കാരണപരവുമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δέον ἐστίν
  choice: വേണം
  rationale: ആവശ്യകതയും ബാധ്യതയും ലളിതവും വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κατεσταλμένους ὑπάρχειν
  choice: ശാന്തരായിരിക്കുക
  rationale: വെറും മൗനം പാലിക്കുക എന്നതിലുപരി, അടങ്ങിയതും സംയമിതവുമായ നിലയിൽ തുടരുക എന്ന ആശയം നൽകുന്നു.
- source_word: μηδὲν προπετὲς πράσσειν
  choice: എടുത്തുചാടി ഒന്നും ചെയ്യാതിരിക്കുക
  rationale: ആലോചനയില്ലാതെ ധൃതിപിടിച്ച് പ്രവർത്തിക്കുന്നതിനെതിരായ മുന്നറിയിപ്പ് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ ശൈലി. നഗരകാര്യദർശിയുടെ ഔപചാരികമായ ന്യായവാദഭാവം നിലനിർത്തിയിട്ടുണ്ട്; ‘എടുത്തുചാടി’ എന്ന പ്രയോഗം പ്രോπετές എന്ന പദത്തിന്റെ ധൃതിപിടിച്ച, അവിവേകിയായ പ്രവർത്തനഭാവം സ്വാഭാവികമായി നൽകുന്നു.
