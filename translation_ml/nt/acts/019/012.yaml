    issue: The phrase ‘അദ്ദേഹത്തിന്റെ തൊലിയിൽ തൊട്ട തൂവാലകളോ ... അരക്കച്ചകളോ’ does not represent ‘ἀπὸ τοῦ χρωτὸς αὐτοῦ ... ἀποφέρεσθαι.’
    rationale: The Greek says that cloths were carried from Paul’s skin/body surface to the sick. Describing them merely as cloths that touched his skin recasts the syntactic relationship and leaves the ‘from’ movement untranslated.
  - severity: low
    issue: Both footnote anchors occur at the end of the sentence rather than beside the expressions they explain.
    rationale: Footnote a concerns ‘from his body/skin,’ and footnote b concerns the work aprons. Placing each marker directly after its relevant expression makes the lexical notes unambiguous.
