id: ACT.19.12
reference: Acts 19:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: ml
  text: അങ്ങനെ, അദ്ദേഹത്തിന്റെ ശരീരത്തിൽനിന്ന്[a] തൂവാലകളും പണിക്കുള്ള ഏപ്രണുകളും[b] രോഗികളുടെ അടുക്കലേക്ക് കൊണ്ടുപോയിരുന്നു; രോഗങ്ങൾ അവരെ വിട്ടുമാറുകയും ദുരാത്മാക്കൾ പുറത്തുപോകുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അദ്ദേഹത്തിന്റെ തൊലിയിൽനിന്ന്’; ഗ്രീക്കിലെ പദം ശരീരത്തിന്റെ പുറംഭാഗത്തെ, അഥവാ തൊലിയെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ പദം കൈത്തൊഴിലിനിടെ ഉപയോഗിച്ചിരുന്ന ഏപ്രണുകളെയോ പണിവസ്ത്രങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ അസാധാരണ അത്ഭുതങ്ങളുടെ ഫലം പരിചയപ്പെടുത്തുന്ന തുടർച്ചാസൂചക പ്രയോഗം.
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: രോഗികളുടെ അടുക്കൽ
  rationale: രോഗികളിലേക്കുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποφέρεσθαι
  choice: കൊണ്ടുപോകുമ്പോൾ
  rationale: വസ്തുക്കൾ പൗലോസിൽനിന്ന് രോഗികളുടെ അടുക്കലേക്ക് കൊണ്ടുപോയെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ ആവർത്തിത/സാധാരണ സംഭവവിവരണത്തിനും യോജിക്കുന്നു.
- source_word: ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ തൊലിയിൽ തൊട്ട
  rationale: χρώς എന്നതിന്റെ അക്ഷരാർഥമായ ‘തൊലി’ നിലനിർത്തിക്കൊണ്ട്, തുണികൾ ശരീരസമ്പർക്കത്തിലായിരുന്നുവെന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σουδάρια
  choice: തൂവാലകൾ
  rationale: വിയർപ്പോ മുഖമോ തുടയ്ക്കാൻ ഉപയോഗിക്കുന്ന തുണികളെ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ മലയാളത്തിലെ വ്യക്തമായ തുല്യം.
- source_word: σιμικίνθια
  choice: പണിക്കുള്ള അരക്കച്ചകൾ
  rationale: കൈത്തൊഴിലിനിടെ ധരിച്ചിരുന്ന apron/work garment എന്ന ചരിത്രപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἀπαλλάσσεσθαι
  choice: വിട്ടുമാറുകയും
  rationale: രോഗങ്ങൾ ആളുകളിൽനിന്ന് നീങ്ങിപ്പോയി എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: νόσους
  choice: രോഗങ്ങൾ
  rationale: ബഹുവചനത്തിലുള്ള νόσους എന്നതിന് നേരിട്ടും പൊതുവായും മനസ്സിലാകുന്ന തുല്യം.
- source_word: πνεύματα τὰ πονηρά
  choice: ദുരാത്മാക്കൾ
  rationale: ദോഷകരമായ ആത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്ന പതിവും സംക്ഷിപ്തവുമായ മലയാള ബൈബിൾപ്രയോഗം.
- source_word: ἐκπορεύεσθαι
  choice: പുറത്തുപോകുകയും ചെയ്തു
  rationale: ആത്മാക്കൾ ബാധിതരിൽനിന്ന് പുറപ്പെട്ടുവെന്ന വിവരണം വ്യാഖ്യാനഭാരം ചേർക്കാതെ നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ശരീരവുമായി സമ്പർക്കത്തിലായിരുന്ന തുണികൾ മുഖേന സംഭവിച്ച സൗഖ്യവും ദുരാത്മാക്കളുടെ പുറപ്പെടലും
  choice: സംഭവത്തെ ലൂക്കോസ് വിവരിക്കുന്നതുപോലെ നേരിട്ട് അവതരിപ്പിച്ചു; അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിച്ചില്ല.
  alternative: തിരുശേഷിപ്പുവണക്കം, കൂദാശാപരമായ പ്രവർത്തനം, അന്ധവിശ്വാസം, അല്ലെങ്കിൽ വെറും പ്രതീകാത്മക സംഭവം എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് വിവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം അത്ഭുതസംഭവം സുതാര്യമായി വിവരിക്കുന്നു; പിൽക്കാല സിദ്ധാന്തങ്ങൾ ചേർക്കുകയോ അത്ഭുതസ്വഭാവം ലഘൂകരിക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ വിവരണം. ‘അദ്ദേഹത്തിന്റെ’ എന്ന സർവനാമം പൗലോസിനെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് ഉടൻ പിന്നാലെ വെക്കുന്നത് കൂടുതൽ കൃത്യമായിരിക്കുമെങ്കിലും, നൽകിയ വാചകത്തിൽ രണ്ടും വാക്യാവസാനത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
