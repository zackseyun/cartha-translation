  yaml_path: translation/nt/acts/019/007.yaml
  text: There were about twelve men in all.
translation:
  language: ml
  text: ആകെ ഏകദേശം പന്ത്രണ്ട് പുരുഷന്മാർ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: ആയിരുന്നു
  rationale: ഗ്രീക്കിലെ ബഹുവചന ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ സംഖ്യാവിവരണമായി നൽകുന്നു; കർത്തൃസംഘത്തെ ‘അവർ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: —
  rationale: ഇവിടെ δέ മൃദുവായ ബന്ധകമാണ്; വ്യക്തമായ വിരോധമോ നിർബന്ധമായ തുടർച്ചയോ സൂചിപ്പിക്കാത്തതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: οἱ πάντες
  choice: ആകെ
  rationale: സംഘത്തിന്റെ മൊത്തം എണ്ണത്തെ സംഗ്രഹിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ആകെ’ എന്നു നൽകുന്നു.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ἀνήρ ഇവിടെ പൊതുവായ ‘ആളുകൾ’ എന്നതിലുപരി പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: ὡσεὶ
  choice: ഏകദേശം
  rationale: സംഖ്യ കൃത്യമല്ലെന്നും ഏകദേശമാണെന്നും വ്യക്തമാക്കുന്ന മാന്യവും സാധാരണവുമായ മലയാളപ്രയോഗം.
- source_word: δώδεκα
  choice: പന്ത്രണ്ടു
  rationale: മൂലത്തിലെ സംഖ്യയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യം. മൂലത്തിലെ ഏകദേശസംഖ്യയും പുരുഷലിംഗസൂചനയും സംരക്ഷിച്ചിട്ടുണ്ട്; അനാവശ്യമായ വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
