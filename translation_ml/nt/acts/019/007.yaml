    issue: Awkward word order and less idiomatic copular phrasing
    rationale: For a numerical total, Malayalam naturally uses 'ആകെ ... പുരുഷന്മാർ ഉണ്ടായിരുന്നു' rather than placing 'ആകെ ഏകദേശം' between 'അവർ' and the predicate.
  - severity: low
