id: ACT.19.25
reference: Acts 19:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: ml
  text: 'അവരെയും ഇത്തരം കാര്യങ്ങളിൽ ഏർപ്പെട്ടിരുന്ന തൊഴിലാളികളെയും ഒരുമിച്ചുകൂട്ടി അയാൾ പറഞ്ഞു: “പുരുഷന്മാരേ, ഈ തൊഴിലിൽനിന്നാണ് നമുക്കു സമൃദ്ധി ലഭിക്കുന്നതെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വ്യാപാരത്തിൽനിന്നാണ് നമുക്കു സമ്പത്ത് ലഭിക്കുന്നത്.”
    reason: ἐργασία എന്നതിന് ‘വ്യാപാരം’ എന്നും εὐπορία എന്നതിന് ‘സമ്പത്ത്’ എന്നും ഇവിടെ പരിഭാഷപ്പെടുത്താം; വാണിജ്യപരമായ അർഥം കൂടുതൽ നേരിട്ട് നൽകുന്ന പകരവായനയാണിത്.
lexical_decisions:
- source_word: οὓς συναθροίσας
  choice: അവരെയും ... ഒരുമിച്ചുകൂട്ടി
  rationale: ആപേക്ഷിക സർവനാമമായ οὓς മുൻവാക്യത്തിൽ പറഞ്ഞവരെ സൂചിപ്പിക്കുന്നു; aorist participle ആയ συναθροίσας പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: ഇത്തരം കാര്യങ്ങളിൽ ഏർപ്പെട്ടിരുന്ന തൊഴിലാളികളെയും
  rationale: ἐργάτας എന്നത് പൊതുവായി ‘തൊഴിലാളികൾ’ എന്നാണ്; περὶ τὰ τοιαῦτα അവരുടെ ബന്ധപ്പെട്ട പ്രവർത്തനമേഖലയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം കരകൗശലത്തെ സൂചിപ്പിച്ചാലും ഗ്രീക്കിലുള്ളതിലധികം പ്രത്യേകമാക്കുന്നില്ല.
- source_word: Ἄνδρες
  choice: പുരുഷന്മാരേ
  rationale: ἀνήρ എന്ന പദത്തിന്റെ പുരുഷലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπίστασθε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: ഇതിനകം അവർക്കുള്ള അറിവിനെയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്; പ്രസംഗസന്ദർഭത്തിലെ ഓർമ്മിപ്പിക്കൽഭാവം ‘അറിയാമല്ലോ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: ഈ തൊഴിലിൽനിന്നാണ്
  rationale: ἐργασίαയ്ക്ക് ജോലി, തൊഴിൽ, വ്യാപാരം എന്നീ അർഥസാധ്യതകളുണ്ട്. കരകൗശലത്തിലൂടെ ഉപജീവനം ലഭിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘തൊഴിൽ’ സ്വാഭാവികവും അർഥവ്യാപ്തി ചുരുക്കാത്തതുമാണ്.
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: നമുക്കു സമൃദ്ധി ലഭിക്കുന്നത്
  rationale: εὐπορία സാമ്പത്തിക അഭിവൃദ്ധി, സമ്പന്നത, സൗകര്യം എന്നിവയെ സൂചിപ്പിക്കുന്നു. ‘സമൃദ്ധി’ അതിനെ വെറും ദിവസവരുമാനമായി ചുരുക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘പുരുഷന്മാരേ’ എന്ന സംബോധന മൂലപാഠത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു. അടിക്കുറിപ്പിന്റെ ചിഹ്നം അതുമായി അർഥപരമായി ബന്ധപ്പെട്ട സമൃദ്ധി/തൊഴിൽ വാക്യഭാഗത്തിനുശേഷമാണ് നൽകിയിരിക്കുന്നത്.
