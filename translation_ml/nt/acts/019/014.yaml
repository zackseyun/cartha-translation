id: ACT.19.14
reference: Acts 19:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δέ ⸀τινος Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ ⸀υἱοὶ τοῦτο ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: ml
  text: സ്കേവാ എന്നു പേരുള്ള ഒരു യഹൂദ പ്രധാനപുരോഹിതന്റെ ഏഴ് പുത്രന്മാർ ഇങ്ങനെ ചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മഹാപുരോഹിതൻ.’ ഗ്രീക്ക് പദം മഹാപുരോഹിതനെയോ, കൂടുതൽ വിശാലമായ അർഥത്തിൽ ഒരു പ്രധാനപുരോഹിതനെയോ ഉന്നത പുരോഹിതവർഗത്തിൽപ്പെട്ട ഒരാളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: … ഉണ്ടായിരുന്നു / ചെയ്തുകൊണ്ടിരുന്നു
  rationale: δέയുടെ നേരിയ ആഖ്യാനത്തുടർച്ച മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ സൂചിപ്പിക്കുന്നു; ἦσαν എന്ന അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാഭാവം അവസാനത്തെ ‘ചെയ്തുകൊണ്ടിരുന്നു’യിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τινος Σκευᾶ
  choice: സ്കേവാ എന്നു പേരുള്ള ഒരു
  rationale: τινος നൽകുന്ന അനിശ്ചിതത്വവും പേരിന്റെ പരിചയപ്പെടുത്തലും സ്വാഭാവിക ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰουδαίου
  choice: യഹൂദ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യൻ’ എന്നതിനെക്കാൾ വംശീയ-മതപരമായ തിരിച്ചറിയലാണ് സന്ദർഭോചിതം.
- source_word: ἀρχιερέως
  choice: മുഖ്യപുരോഹിതൻ
  rationale: ഏക ഔദ്യോഗിക മഹാപുരോഹിതൻ എന്ന അവകാശവാദം അനാവശ്യമായി സൂചിപ്പിക്കാതെ, ഉന്നത പുരോഹിതവർഗത്തിലെ ഒരാളെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർഥം നൽകുന്നു.
- source_word: ἑπτὰ υἱοὶ
  choice: ഏഴ് പുത്രന്മാർ
  rationale: സംഖ്യയും കുടുംബബന്ധവും വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: τοῦτο ποιοῦντες
  choice: ഇങ്ങനെ ചെയ്തുകൊണ്ടിരുന്നു
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പ്രവൃത്തിയിലേക്കുള്ള τοῦτοയുടെ സൂചനയും വർത്തമാന കൃദന്തത്തിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്കേവായെ വിശേഷിപ്പിക്കുന്ന ἀρχιερεύς എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപുരോഹിതൻ
  alternative: മഹാപുരോഹിതൻ
  rationale: ἀρχιερεύς ഏക മഹാപുരോഹിതനെയോ വിശാലമായി മുഖ്യപുരോഹിതൻ/ഉന്നത പുരോഹിതവർഗാംഗത്തെയോ സൂചിപ്പിക്കാം. സ്കേവാ യെരൂശലേമിലെ ഏക ഔദ്യോഗിക മഹാപുരോഹിതനായിരുന്നു എന്ന് മറ്റൊരിടത്തും സാക്ഷ്യപ്പെടുത്തിയിട്ടില്ലാത്തതിനാൽ പ്രധാന പാഠത്തിൽ ‘മുഖ്യപുരോഹിതൻ’ നൽകി യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പുത്രന്മാർ’ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ‘ഇങ്ങനെ’ മുൻവാക്യത്തിലെ പ്രവൃത്തിയിലേക്ക് സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നു.
