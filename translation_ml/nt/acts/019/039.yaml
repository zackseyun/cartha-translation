id: ACT.19.39
reference: Acts 19:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ മറ്റെന്തെങ്കിലും കാര്യം ഉന്നയിക്കുന്നെങ്കിൽ, അത് നിയമാനുസൃതമായ പൊതുസഭയിൽ[a] തീർപ്പാക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിയമപ്രകാരമുള്ള സഭയിൽ’ അല്ലെങ്കിൽ ‘പതിവായി ചേരുന്ന പൊതുസഭയിൽ.’ ഗ്രീക്കുപദം ഇവിടെ നിയമാനുസൃതമായി രൂപീകരിച്ച പൗരസമ്മേളനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ക്രൈസ്തവസഭയെയല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: മറ്റെന്തെങ്കിലും
  rationale: നിലവിലുള്ള വിഷയത്തിനു പുറമേയുള്ള അധികകാര്യത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; താരതമ്യാർഥം അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: ἐπιζητεῖτε
  choice: കാര്യം ഉന്നയിക്കുന്നെങ്കിൽ
  rationale: തേടുക, അന്വേഷിക്കുക, പിന്തുടരുക എന്നീ അർഥസാധ്യതകളുള്ള ക്രിയയെ ഈ പൗര-നിയമപരമായ സന്ദർഭത്തിൽ അധികവിഷയം പരിഗണനയ്ക്കായി കൊണ്ടുവരുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐννόμῳ
  choice: നിയമാനുസൃതമായ
  rationale: നിയമത്തിനു ചേർന്നും അംഗീകൃത നടപടിക്രമപ്രകാരവും ഉള്ളത് എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἐκκλησίᾳ
  choice: പൊതുസഭയിൽ
  rationale: ഇവിടെ ക്രൈസ്തവസഭയല്ല, എഫെസൊസിലെ നിയമാനുസൃതമായി വിളിച്ചുചേർക്കുന്ന പൗരസമ്മേളനമാണ് ഉദ്ദേശ്യം. ‘പൊതുസഭ’ ആ പൊതുപൗര അർഥം വ്യക്തമാക്കുന്നു; ‘കോടതി’ എന്നു പറയുന്നത് മൂലപദത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: ἐπιλυθήσεται
  choice: തീർപ്പാക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും വിഷയം അംഗീകൃത നടപടിയിലൂടെ പരിഹരിക്കപ്പെടുമെന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും കാര്യം
  rationale: സോപാധിക വാക്യത്തിലെ അനിശ്ചിത സർവനാമത്തിന്റെ തുറന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ക്രൈസ്തവേതര പൗരസന്ദർഭത്തിലെ ἐκκλησία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പൊതുസഭ
  alternative: സഭ; യോഗം
  rationale: സന്ദർഭത്തിൽ ഇത് എഫെസൊസിലെ നിയമാനുസൃത പൗരസമ്മേളനത്തെയാണ് സൂചിപ്പിക്കുന്നത്, ക്രൈസ്തവ സമൂഹത്തെയല്ല. അതിനാൽ സഭാസംബന്ധിയായ തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് ഒത്തുകൂടിയ ജനസമിതിയെന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ പൗര-നിയമപരമായ ശൈലി. കർമണിപ്രയോഗവും മൂലവാക്യത്തിലെ നിബന്ധനാസ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
