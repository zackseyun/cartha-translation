id: ACT.19.6
reference: Acts 19:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐπιθέντος αὐτοῖς τοῦ ⸀Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: ml
  text: പൗലോസ് അവരുടെമേൽ കൈകൾ വെച്ചപ്പോൾ പരിശുദ്ധാത്മാവ് അവരുടെമേൽ വന്നു; അവർ നാവുകളിൽ[a] സംസാരിക്കുകയും പ്രവചിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭാഷകളിൽ.’ ഗ്രീക്ക് പദത്തിന് ‘നാവുകൾ’ എന്നും ‘ഭാഷകൾ’ എന്നും അർഥമാകാം; ഇവിടെ ഏതു തരത്തിലുള്ള സംസാരമാണെന്ന് വാക്യം തന്നെ നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: പൗലോസ് അവരുടെമേൽ കൈകൾ വെച്ചപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലുള്ള എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിനെ സ്വാഭാവികമായ ഒരു കാലസൂചക ഉപവാക്യമായി വിവർത്തനം ചെയ്യുന്നു; ‘കൈകൾ വെക്കുക’ എന്ന മൂലപാഠത്തിലെ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: പരിശുദ്ധാത്മാവ് അവരുടെമേൽ വന്നു
  rationale: ἔρχομαι + ἐπί എന്ന പ്രയോഗത്തിന്റെ ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട് ലൂക്കോസ്–പ്രവൃത്തികൾ ശൈലിയോട് യോജിക്കുന്ന സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: ἐλάλουν τε γλώσσαις
  choice: അവർ അന്യഭാഷകളിൽ സംസാരിക്കുകയും
  rationale: ഇവിടെ γλώσσαις എന്നതിന് നാവുകൾ/ഭാഷകൾ എന്നീ അർഥസാധ്യതകളുണ്ട്. മലയാളത്തിലെ സ്ഥാപിതവും സാധാരണക്കാർക്ക് ഗ്രാഹ്യവുമായ ‘അന്യഭാഷകൾ’ എന്ന പ്രയോഗം പ്രതിഭാസത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കാതെ നിലനിർത്തുന്നു. ഇംപർഫെക്റ്റിന്റെ തുടരുന്ന പ്രവർത്തനഭാവം ‘സംസാരിക്കുകയും’ എന്ന ഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: ἐπροφήτευον
  choice: പ്രവചിക്കുകയും ചെയ്തു
  rationale: പ്രവാചകമായി സംസാരിക്കുന്ന പ്രവർത്തനത്തെ നേരിട്ടും സ്ഥാപിതവുമായ മലയാള ക്രിയയാൽ അവതരിപ്പിക്കുന്നു; ചേർന്നുനിൽക്കുന്ന രണ്ട് ഇംപർഫെക്റ്റ് ക്രിയകളെയും ഒരേ സമാന്തര ഘടനയിൽ നൽകുന്നു.
theological_decisions:
- issue: Acts 19:6-ലെ γλώσσαις എന്നതിന്റെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘അന്യഭാഷകളിൽ’ എന്നു നൽകി, അവ അറിയപ്പെടുന്ന മനുഷ്യഭാഷകളായിരുന്നോ മറ്റൊരു വിധത്തിലുള്ള ആത്മപ്രേരിത സംസാരമായിരുന്നോ എന്ന് നിർണയിക്കാതിരിക്കുന്നു.
  alternative: ‘മറ്റു മനുഷ്യഭാഷകളിൽ’ എന്നു നൽകി അറിയപ്പെടുന്ന ഭാഷകൾ എന്ന വ്യാഖ്യാനം വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ‘നാവുകളിൽ’ എന്ന് അക്ഷരാർഥത്തിൽ നൽകുക.
  rationale: γλώσσαις എന്ന ഗ്രീക്ക് പദം ‘നാവുകൾ’ എന്നും ‘ഭാഷകൾ’ എന്നും അർഥമാക്കാം. ഈ വാക്യം മാത്രം വിശാലമായ വ്യാഖ്യാനവിവാദം തീർപ്പാക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
- issue: പരിശുദ്ധാത്മാവ് അവരുടെമേൽ വന്നതിന്റെ അവതരണം
  choice: ‘പരിശുദ്ധാത്മാവ് അവരുടെമേൽ വന്നു’ എന്ന സംഭവവിവരണം മാത്രം നൽകുന്നു.
  alternative: പിന്നീടുള്ള ഏതെങ്കിലും ഉപദേശചട്ടക്കൂടിന്റെ അടിസ്ഥാനത്തിൽ ഇതിനെ പ്രത്യേകമായി വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠം ആത്മാവിന്റെ വരവ് വിവരിക്കുന്നു; എന്നാൽ അതിന്റെ പൂർണമായ ദൈവശാസ്ത്രപരമായ ക്രമമോ കർമകാരണബന്ധമോ ഇവിടെ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘അന്യഭാഷകൾ,’ ‘പരിശുദ്ധാത്മാവ്,’ ‘പ്രവചിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ വ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പദത്തിനരികെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
