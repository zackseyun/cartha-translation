id: ACT.19.13
reference: Acts 19:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: ml
  text: 'എന്നാൽ ചുറ്റിസഞ്ചരിച്ചിരുന്ന യഹൂദ ഭൂതോച്ചാടകരിൽ ചിലരും[a] ദുരാത്മാക്കളുള്ളവരുടെ മേൽ[b] കർത്താവായ യേശുവിന്റെ നാമം വിളിച്ചുപറയാൻ ശ്രമിച്ചു. അവർ പറഞ്ഞു: “പൗലോസ് പ്രസംഗിക്കുന്ന യേശുവിനെക്കൊണ്ട് ഞാൻ നിങ്ങളെ ശപഥംചെയ്തു കല്പിക്കുന്നു.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ചുറ്റിസഞ്ചരിച്ചിരുന്ന യഹൂദ ഭൂതോച്ചാടകരിൽ ചിലർപോലും.”'
    reason: καί എന്ന പദത്തിന് ഇവിടെ ‘കൂടാതെ’ എന്നോ ഊന്നലോടെ ‘പോലും’ എന്നോ ഉള്ള ഭാവം ഉണ്ടായേക്കാം.
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ദുരാത്മാക്കളുള്ളവരുടെ മേൽ.”'
    reason: മൂലവാചകം ‘ദുരാത്മാക്കൾ ആവേശിച്ചവർ’ എന്ന് നേരിട്ട് പറയുന്നില്ല.
  - marker: c
    text: “ഞാൻ നിങ്ങളെ ശപഥംചെയ്തു കല്പിക്കുന്നു” എന്നതിന് “ഞാൻ നിങ്ങളെ യേശുവിനെക്കൊണ്ട് ആണയിടുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ὁρκίζω എന്ന പദം ശപഥത്താൽ ബന്ധിക്കുന്നതോ ഗൗരവമായി ചുമതലപ്പെടുത്തുന്നതോ സൂചിപ്പിക്കുന്നു.
  - marker: d
    text: “പ്രസംഗിക്കുന്ന” എന്നതിന് “പരസ്യമായി പ്രഖ്യാപിക്കുന്ന” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: κηρύσσει എന്ന പദം പരസ്യപ്രഖ്യാപനത്തെയും പ്രസംഗത്തെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: ശ്രമിച്ചു
  rationale: പ്രവൃത്തി ഏറ്റെടുത്ത് ചെയ്യാൻ തുനിഞ്ഞു എന്ന അർഥം നൽകുമ്പോഴും അതു വിജയിച്ചു എന്നു സൂചിപ്പിക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: ചുറ്റിനടന്നിരുന്ന യഹൂദ ഭൂതോച്ചാടകരിൽ ചിലരും
  rationale: τινες എന്നതിന്റെ അനിശ്ചിതമായ ‘ചിലർ’ എന്ന അർഥവും καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും περιερχομένων എന്ന സ്ഥലസ്ഥലമായി സഞ്ചരിക്കുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: '...മേൽ ... നാമം ചൊല്ലാൻ'
  rationale: ഭൂതോച്ചാടനസന്ദർഭത്തിലെ നാമാഹ്വാനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ἐπί സൂചിപ്പിക്കുന്ന ‘മേൽ’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: ദുരാത്മാക്കളുള്ളവർ
  rationale: ‘ദുരാത്മാക്കളെ ഉള്ളവരായി ഉണ്ടായിരുന്നവർ’ എന്ന ഗ്രീക്കിന്റെ നേരിട്ടുള്ള ആശയം സംരക്ഷിക്കുന്നു; ‘ബാധിച്ചവർ’ അല്ലെങ്കിൽ ‘ആവേശിച്ചവർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ നാമം
  rationale: κύριος എന്ന ബഹുമാനപരവും ദൈവശാസ്ത്രപരവുമായ പദം ‘കർത്താവ്’ എന്നു നൽകുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം സൃഷ്ടിക്കുകയും ചെയ്യുന്നു.
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: യേശുവിനെക്കൊണ്ട് നിങ്ങളോട് ഞാൻ ആണയിടുന്നു
  rationale: ὁρκίζωയുടെ ശപഥബന്ധിതമായ ഗൗരവമുള്ള കല്പനാഭാവം സൂക്ഷിക്കുന്നു; ὑμᾶς എന്ന ബഹുവചനം ‘നിങ്ങളോട്’ എന്നു നിലനിർത്തുന്നു.
- source_word: ὃν Παῦλος κηρύσσει
  choice: പൗലോസ് പ്രസംഗിക്കുന്ന
  rationale: κηρύσσει എന്ന പരസ്യമായി പ്രഖ്യാപിക്കുക/പ്രസംഗിക്കുക എന്ന ആശയം സന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τοῦ κυρίου Ἰησοῦ എന്ന ക്രിസ്തുസംബന്ധിയായ പ്രയോഗത്തിലെ κύριος
  choice: കർത്താവായ യേശു
  alternative: യജമാനനായ യേശു
  rationale: ‘കർത്താവ്’ എന്നത് ഇവിടെ ബഹുമാനപദവിയും ക്രിസ്തുസംബന്ധിയായ ദൈവശാസ്ത്രഭാരവും നിലനിർത്തുന്നു; ‘യജമാനൻ’ ഈ സന്ദർഭത്തിൽ അനാവശ്യമായി പരിമിതമാണ്.
- issue: ദുരാത്മബാധയെ എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ദുരാത്മാക്കളുള്ളവർ
  alternative: ദുരാത്മാക്കൾ ആവേശിച്ചവർ
  rationale: ഗ്രീക്ക് വാചകം അക്ഷരാർഥത്തിൽ ‘ദുരാത്മാക്കളുള്ളവർ’ എന്നാണ്; ‘ആവേശിച്ചവർ’ എന്നത് സാധ്യതയുള്ള സന്ദർഭാർഥമാണെങ്കിലും മൂലത്തേക്കാൾ ശക്തമായ വ്യാഖ്യാനമാണ്.
- issue: Ὁρκίζω എന്നതിന്റെ ഭൂതോച്ചാടനപരമായ ശക്തി
  choice: നിങ്ങളോട് ഞാൻ ആണയിടുന്നു
  alternative: ഞാൻ നിങ്ങളോട് കർശനമായി കല്പിക്കുന്നു
  rationale: മൂലത്തിലെ ശപഥത്തിന്റെ ആശയം നിലനിർത്തുന്നു; വെറും അധികാരപരമായ കല്പനയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ഭൂതോച്ചാടകർ’, ‘ആണയിടുന്നു’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിന്റെ ഔപചാരിക സ്വരം നിലനിർത്തുന്നു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ക്രമീകരിച്ചിട്ടുണ്ടെങ്കിലും ഗ്രീക്കിലെ അനിശ്ചിതത്വങ്ങളും ബഹുവചന അഭിസംബോധനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
