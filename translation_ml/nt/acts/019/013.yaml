revisions:
- from: 'എന്നാൽ ചുറ്റിനടന്നിരുന്ന യഹൂദ ഭൂതോച്ചാടകരിൽ ചിലരും[a] ദുരാത്മാക്കളുള്ളവരുടെമേൽ[b] കർത്താവായ യേശുവിന്റെ നാമം ചൊല്ലാൻ ശ്രമിച്ചു. അവർ പറഞ്ഞു: “പൗലോസ് പ്രസംഗിക്കുന്ന യേശുവിനെക്കൊണ്ട് നിങ്ങളോട് ഞാൻ ആണയിടുന്നു.”[c][d]'
  to: 'എന്നാൽ ചുറ്റിസഞ്ചരിച്ചിരുന്ന യഹൂദ ഭൂതോച്ചാടകരിൽ ചിലരും[a] ദുരാത്മാക്കളുള്ളവരുടെ മേൽ[b] കർത്താവായ യേശുവിന്റെ നാമം വിളിച്ചുപറയാൻ ശ്രമിച്ചു. അവർ പറഞ്ഞു: “പൗലോസ് പ്രസംഗിക്കുന്ന യേശുവിനെക്കൊണ്ട് ഞാൻ നിങ്ങളെ ശപഥംചെയ്തു കല്പിക്കുന്നു.”[c][d]'
  rationale: The revision corrects the direction and force of the adjuration, improves the idiom for itinerant travel, and repairs footnote b’s Malayalam grammar. ‘വിളിച്ചുപറയാൻ’ retains the contextual sense of invoking the name rather than merely uttering it. No disputed textual or doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
