id: ACT.19.21
reference: Acts 19:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: ml
  text: 'ഇക്കാര്യങ്ങൾ പൂർത്തിയായപ്പോൾ, മക്കെദോന്യയിലൂടെയും അഖായയിലൂടെയും കടന്നുപോയശേഷം യെരൂശലേമിലേക്കു പോകാൻ പൗലോസ് ആത്മാവിൽ[a] നിശ്ചയിച്ചു. അവൻ പറഞ്ഞു: “ഞാൻ അവിടെ ചെന്നശേഷം റോമും കാണേണ്ടതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്റെ ആത്മാവിൽ.” ഇവിടെ ഗ്രീക്ക് പ്രയോഗം പൗലോസിന്റെ ആന്തരിക നിശ്ചയത്തെയോ പരിശുദ്ധാത്മാവിന്റെ നടത്തിപ്പിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπληρώθη
  choice: പൂർത്തിയായപ്പോൾ
  rationale: ഇവിടെ πληρόω മുൻവിവരിച്ച സംഭവങ്ങൾ പൂർത്തിയാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രവചനനിവൃത്തിയെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἔθετο
  choice: നിശ്ചയിച്ചു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള τίθημι സ്വന്തം മനസ്സിൽ ഉറച്ച തീരുമാനം എടുക്കുക എന്ന അർഥം നൽകുന്നു; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘നിശ്ചയിച്ചു’ അത് വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ πνεύματι
  choice: ആത്മാവിൽ
  rationale: പൗലോസിന്റെ സ്വന്തം ആത്മാവിനെയോ പരിശുദ്ധാത്മാവിന്റെ നടത്തിപ്പിനെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അവ്യക്തത മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: διελθὼν
  choice: കടന്നുപോയശേഷം
  rationale: പ്രധാന യാത്രയ്ക്കു മുമ്പായി മക്കെദോന്യയും അഖായയും വഴി കടന്നുപോകുന്ന ക്രമം aorist participle സൂചിപ്പിക്കുന്നു.
- source_word: πορεύεσθαι
  choice: പോകാൻ
  rationale: പൊതുവായ സഞ്ചാരക്രിയയ്ക്ക് ലളിതവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ സ്ഥലനാമരൂപം.
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: ഞാൻ അവിടെ ചെന്നശേഷം
  rationale: അവിടെ എത്തി സന്നിഹിതനായതിനുശേഷം എന്ന സമയക്രമം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δεῖ
  choice: കാണേണ്ടതാണ്
  rationale: ലൂക്കാ–പ്രവൃത്തികളിൽ പലപ്പോഴും ദൈവിക ലക്ഷ്യത്തിന്റെ ഭാവമുള്ള നിർബന്ധം/ആവശ്യകത സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἰδεῖν
  choice: കാണുക
  rationale: യാത്രാസന്ദർഭത്തിൽ സന്ദർശിക്കുക എന്ന അർഥസൂചന ഉണ്ടായാലും ഗ്രീക്കിലെ ‘കാണുക’ എന്ന രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν τῷ πνεύματι എന്നതിലെ πνεῦμα ആരെ സൂചിപ്പിക്കുന്നു
  choice: ആത്മാവിൽ
  alternative: തന്റെ ആത്മാവിൽ / മനസ്സിൽ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ല. അതിനാൽ പരിശുദ്ധാത്മാവിന്റെ നടത്തിപ്പും പൗലോസിന്റെ ആന്തരിക നിശ്ചയവും സാധ്യമാണ്; പ്രധാന പാഠത്തിൽ ‘ആത്മാവിൽ’ എന്നു നൽകി അവ്യക്തത നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ രണ്ടു സാധ്യതകളും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; ആശയക്രമവും ദൈവശാസ്ത്രപരമായ അവ്യക്തതയും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [b] അടിക്കുറിപ്പ് അതിന്റെ പുതുക്കലുമായി പൊരുത്തമില്ലാത്തതായി തോന്നുന്നതിനാൽ മലയാള കരടിൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
