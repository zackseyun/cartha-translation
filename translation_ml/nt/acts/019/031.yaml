source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: ml
  text: ഏഷ്യാർക്കുമാരിൽ[a] ചിലർപോലും, അദ്ദേഹത്തിന്റെ സുഹൃത്തുക്കളായിരുന്നതിനാൽ, അദ്ദേഹത്തിന് സന്ദേശമയച്ച്[b] നാടകശാലയിലേക്കു പോകരുതെന്ന്[c] അദ്ദേഹത്തോട് അഭ്യർഥിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഏഷ്യാർക്കുമാർ” റോമൻ ഏഷ്യാ പ്രവിശ്യയുമായി ബന്ധപ്പെട്ടിരുന്ന പ്രമുഖ വ്യക്തികളായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, “അദ്ദേഹത്തിന് ആളയച്ച്.”
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “നാടകശാലയിലേക്ക് സ്വയം കൊടുക്കരുതെന്ന്”; അഥവാ, “നാടകശാലയിൽ സ്വയം പ്രത്യക്ഷപ്പെടരുതെന്ന്” അല്ലെങ്കിൽ “നാടകശാലയ്ക്കുള്ളിൽ പോകരുതെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: ചിലർപോലും
  rationale: അനിശ്ചിതമായ ഒരു വിഭാഗത്തെ ‘ചിലർ’ സൂചിപ്പിക്കുന്നു; καί നൽകുന്ന ആശ്ചര്യാത്മക ഊന്നൽ ‘പോലും’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. δέയുടെ ലഘുവായ തുടർച്ച പ്രത്യേകം ബന്ധകപദം ചേർക്കാതെയും മലയാളവാക്യക്രമത്തിൽ വ്യക്തമാകുന്നു.
- source_word: τῶν Ἀσιαρχῶν
  choice: ഏഷ്യാർക്കുമാരിൽ
  rationale: റോമൻ ഏഷ്യാ പ്രവിശ്യയുമായി ബന്ധപ്പെട്ടിരുന്ന പ്രമുഖ പദവിയുടെ സാങ്കേതിക നാമം ലിപ്യന്തരണം ചെയ്ത് നിലനിർത്തുന്നു; അതിന്റെ ചരിത്രപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄντες αὐτῷ φίλοι
  choice: അദ്ദേഹത്തിന്റെ സുഹൃത്തുക്കളായിരുന്നു
  rationale: പശ്ചാത്തലവിവരം നൽകുന്ന പങ്കാളിക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായ ഒരു പൂർണവാക്യമായി അവതരിപ്പിക്കുന്നു; φίλοι എന്നതിന്റെ വ്യക്തിബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: അദ്ദേഹത്തിന് ആളയച്ച്
  rationale: എന്താണ് അയച്ചതെന്നു ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല. സന്ദേശം എത്തിക്കാൻ ആളെ അയയ്ക്കുക എന്ന സന്ദർഭോചിതമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παρεκάλουν
  choice: അഭ്യർഥിച്ചു
  rationale: ഇവിടെ παρακαλέω ഗൗരവമുള്ള അപേക്ഷയെയോ പ്രേരണയെയോ സൂചിപ്പിക്കുന്നു. അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാസൂചന മലയാളത്തിൽ നിർബന്ധമായി അതിരുകടന്ന് വ്യക്തമാക്കാതെ ലളിതമായ ഭൂതകാലം ഉപയോഗിക്കുന്നു.
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: നാടകശാലയിലേക്കു ചെല്ലരുതെന്ന്
  rationale: അക്ഷരാർഥത്തിൽ ‘സ്വയം കൊടുക്കരുത്’ എന്ന ഗ്രീക്ക് പ്രയോഗം ഈ സന്ദർഭത്തിൽ അപകടകരമായ ജനക്കൂട്ടത്തിനുമുന്നിൽ സ്വയം ചെന്നുനിൽക്കാതിരിക്കുക എന്നതാണ് സൂചിപ്പിക്കുന്നത്. വ്യാഖ്യാനം അമിതമായി ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ ചലനപ്രയോഗം തിരഞ്ഞെടുത്തു; കൂടുതൽ അക്ഷരസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
