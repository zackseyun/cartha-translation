  terminology: «ഏഷ്യാർക്കുമാർ» appropriately preserves the technical title. The note should describe them cautiously as prominent persons associated with the Roman province of Asia, without defining them as provincial officials or leaders. «നാടകശാല» is an acceptable rendering of θέατρον in this narrative setting.
