translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. സാങ്കേതിക ചരിത്രപദമായ ‘ഏഷ്യാർക്ക്’ നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി രണ്ട് വാക്യങ്ങളാക്കി.
