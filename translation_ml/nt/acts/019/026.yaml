  rationale: The revision restores the Greek content-clause force of ‘you see and hear that,’ represents the breadth of ‘almost all Asia’ more precisely, and makes minor idiomatic and footnote-wording improvements. It preserves the source's ambiguity about precisely what the crowd has turned away from and does not introduce doctrinal interpretation into the main text.
