id: ACT.19.26
reference: Acts 19:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: ml
  text: 'നിങ്ങൾ കാണുകയും കേൾക്കുകയും ചെയ്യുന്നുണ്ടല്ലോ: എഫെസൊസിൽ മാത്രമല്ല, ഏതാണ്ട് ഏഷ്യ മുഴുവനിലും[a] ഈ പൗലോസ് ഗണ്യമായ ഒരു ജനക്കൂട്ടത്തെ പറഞ്ഞ് ബോധ്യപ്പെടുത്തി വഴിതിരിച്ചിരിക്കുന്നു. ‘കൈകളാൽ ഉണ്ടാക്കപ്പെടുന്നവ ദേവന്മാരല്ല’[b] എന്നാണ് അവൻ പറയുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നത് ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡമല്ല; എഫെസൊസ് ഉൾപ്പെട്ടിരുന്ന റോമൻ പ്രവിശ്യയായ ഏഷ്യയാണ്.
    reason: historical_geography
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘കൈകളാൽ ഉണ്ടാക്കപ്പെടുന്നവ’; മനുഷ്യരുടെ കരകൗശലത്താൽ നിർമിച്ച വിഗ്രഹങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: നിങ്ങൾ കാണുകയും കേൾക്കുകയും ചെയ്യുന്നതുപോലെ
  rationale: വർത്തമാനകാലത്തിലുള്ള ഇരട്ട ആഹ്വാനം പൊതുവായി അറിയാവുന്ന തെളിവിലേക്കാണ് ശ്രോതാക്കളുടെ ശ്രദ്ധ തിരിക്കുന്നത്. സ്വാഭാവികമായ മലയാളത്തിനായി ‘ചെയ്യുന്നതുപോലെ’ എന്ന ബന്ധരൂപം ഉപയോഗിച്ചു.
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: എഫെസൊസിൽ മാത്രമല്ല, ഏഷ്യയിൽ ഏതാണ്ട് എല്ലായിടത്തും
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവ്യാകരണരൂപങ്ങളുടെ ഇവിടെ ഉദ്ദേശിച്ചിരിക്കുന്ന സ്ഥലസൂചന മലയാളത്തിൽ വ്യക്തമാക്കി. σχεδόν എന്നതിന്റെ ഏകദേശവ്യാപ്തി ‘ഏതാണ്ട്’ നിലനിർത്തുന്നു.
- source_word: ὁ Παῦλος οὗτος
  choice: ഈ പൗലോസ്
  rationale: പ്രസംഗകന്റെ അവജ്ഞ കലർന്ന ചൂണ്ടിക്കാട്ടൽ അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: πείσας μετέστησεν
  choice: പറഞ്ഞുബോധ്യപ്പെടുത്തി വഴിതിരിച്ചിരിക്കുന്നു
  rationale: πείσας സൂചിപ്പിക്കുന്ന സമ്മതിപ്പിക്കൽ/ബോധ്യപ്പെടുത്തലും μετέστησεν സൂചിപ്പിക്കുന്ന മുൻനിലപാടിൽനിന്നുള്ള മാറ്റവും രണ്ടും നിലനിർത്തുന്നു; ‘വഴിതെറ്റിച്ചു’ എന്ന കൂടുതൽ വിധിപരമായ അർഥം ചേർത്തിട്ടില്ല.
- source_word: ἱκανὸν ὄχλον
  choice: ഗണ്യമായ ഒരു ജനക്കൂട്ടം
  rationale: ἱκανός ഇവിടെ എണ്ണത്തിലും സ്വാധീനത്തിലും അവഗണിക്കാനാവാത്ത അളവിനെ സൂചിപ്പിക്കുന്നു; ‘ഗണ്യമായ’ അതിനെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: കൈകളാൽ ഉണ്ടാക്കപ്പെടുന്നവ ദേവന്മാരല്ല
  rationale: മനുഷ്യനിർമിത ആരാധനാവസ്തുക്കളുടെ ദൈവികപദവിയെ നിഷേധിക്കുന്ന മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു. ‘വിഗ്രഹങ്ങൾ’ എന്ന് മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: മനുഷ്യകൈകളാൽ നിർമിക്കപ്പെട്ടവയെക്കുറിച്ചുള്ള പൗലോസിന്റെ പ്രസ്താവനയുടെ പരിധി
  choice: ‘കൈകളാൽ ഉണ്ടാക്കപ്പെടുന്നവ ദേവന്മാരല്ല’ എന്ന നേരിട്ടുള്ള നിഷേധം
  alternative: ‘മനുഷ്യകൈകൾ നിർമിച്ച വിഗ്രഹങ്ങൾ യഥാർഥ ദേവന്മാരല്ല’
  rationale: മൂലപാഠം നിർമിതവസ്തുക്കളുടെ ദൈവികപദവിയെ നിഷേധിക്കുന്നു. ‘യഥാർഥ’ എന്ന വിശദീകരണമോ ‘വിഗ്രഹങ്ങൾ’ എന്ന വ്യാഖ്യാനപദമോ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ പ്രസ്താവനയുടെ ദൈവശാസ്ത്രപരമായ മൂർച്ചയും പരിധിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ദെമത്രിയൊസിന്റെ കുറ്റാരോപണസ്വരം ‘ഈ പൗലോസ്’ എന്നതിലൂടെ മിതമായി നിലനിർത്തി; അനാവശ്യമായ സഭാവിഭാഗപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
