id: ACT.19.38
reference: Acts 19:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദെമേത്രിയൊസിനും അവനോടൊപ്പമുള്ള കൈത്തൊഴിലാളികൾക്കും ആരുടെയെങ്കിലും നേരെ പരാതിയുണ്ടെങ്കിൽ, ന്യായവിചാരണാസമ്മേളനങ്ങൾ നടക്കുന്നുണ്ട്[a], പ്രോകോൺസൽമാരുമുണ്ട്[b]; അവർ പരസ്പരം കുറ്റം ചുമത്തട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കോടതികൾ വിചാരണയ്ക്കായി ചേരുന്നുണ്ട്.” ἀγοραῖοι ἄγονται എന്ന ഗ്രീക്ക് പ്രയോഗം ഔദ്യോഗികമായി നിശ്ചയിച്ച ന്യായവിചാരണാസമ്മേളനങ്ങളെയോ കോടതി ദിവസങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പ്രോകോൺസൽമാർ സന്നിഹിതരാണ്/ലഭ്യരാണ്.” ബഹുവചനം പൊതുവായ ഭരണപരമായ അർഥത്തിൽ പ്രോകോൺസലിന്റെ ഔദ്യോഗിക പദവിയെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: അതുകൊണ്ട് ... ഉണ്ടെങ്കിൽ
  rationale: οὖν എന്നതിന്റെ നിഗമനാത്മക-സംക്രമണബലം ‘അതുകൊണ്ട്’ എന്നും εἰ എന്ന വ്യവസ്ഥ ‘ഉണ്ടെങ്കിൽ’ എന്നും സ്വാഭാവികമായി നൽകുന്നു; μέν മലയാളവാക്യത്തിന്റെ ഒഴുക്കിൽ പ്രത്യേകം പദമാക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: Δημήτριος
  choice: ദെമേത്രിയോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം അതിന്റെ മൂലരൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: കൂടെയുള്ള കൈത്തൊഴിലാളികൾ
  rationale: τεχνῖται വിദഗ്ധരായ കരകൗശല/കൈത്തൊഴിൽ പ്രവർത്തകരെ സൂചിപ്പിക്കുന്നു; σὺν αὐτῷ ബന്ധത്തെ കൂടുതൽ നിർവചിക്കാതെ ‘കൂടെയുള്ള’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἔχουσιν πρός τινα λόγον
  choice: ആരുടെയെങ്കിലും നേരെ പരാതിയുണ്ടെങ്കിൽ
  rationale: നിയമപരമായ പരാതിയോ കേസോ ഉള്ളതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ആ സന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀγοραῖοι ἄγονται
  choice: കോടതികൾ സമ്മേളിക്കുന്നുണ്ട്
  rationale: ഔദ്യോഗികമായി വിളിച്ചുകൂട്ടുന്ന ന്യായവിചാരണാ സമ്മേളനങ്ങളെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ സ്ഥാപനപരവും നടപടിക്രമപരവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνθύπατοί εἰσιν
  choice: പ്രവിശ്യാധിപന്മാരുമുണ്ട്
  rationale: റോമൻ പ്രവിശ്യയുടെ ഔദ്യോഗിക ഭരണാധികാരിയായ proconsul-നെ ‘പ്രവിശ്യാധിപൻ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി; ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: അവർ പരസ്പരം കുറ്റം ചുമത്തിക്കൊള്ളട്ടെ
  rationale: നിയമനടപടിയിൽ ഔദ്യോഗിക ആരോപണം ഉന്നയിക്കുക എന്ന forensic അർഥവും ἀλλήλοις എന്ന പരസ്പരതയും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-ഭരണഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ബഹുവചനവും പരസ്പര നിയമനടപടിയുടെ ഭാവവും നിലനിർത്തി; സാങ്കേതിക പദങ്ങൾക്ക് അടിക്കുറിപ്പുകളിൽ വ്യത്യസ്ത വായനകൾ നൽകി.
