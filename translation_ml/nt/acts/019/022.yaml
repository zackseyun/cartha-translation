id: ACT.19.22
reference: Acts 19:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: ml
  text: അങ്ങനെ, തനിക്കു ശുശ്രൂഷ ചെയ്തിരുന്നവരിൽ രണ്ടുപേരെ—തിമൊഥെയൊസിനെയും എരസ്തൊസിനെയും—മക്കെദോന്യയിലേക്ക് അയച്ചശേഷം, അദ്ദേഹം തന്നെ കുറച്ചുകാലം ഏഷ്യയിൽ[a] തങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നു പറയുന്നത് ആധുനിക ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: അയച്ചശേഷം
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല പങ്കാളിക്രിയയുടെ കാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: ശക്തമായ വിരോധമല്ല, ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; സന്ദർഭത്തിലെ ഫലസൂചനയും പ്രവാഹവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὴν Μακεδονίαν
  choice: മക്കെദോന്യയിലേക്ക്
  rationale: ഒരു പ്രദേശത്തെ ലക്ഷ്യമാക്കിയുള്ള ദിശയെ മലയാളത്തിലെ സ്വാഭാവിക ലക്ഷ്യവിഭക്തിയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: തനിക്കു ശുശ്രൂഷ ചെയ്തിരുന്നവരിൽ രണ്ടുപേരായ
  rationale: διακονέω എന്ന ക്രിയയുടെ സേവന/ശുശ്രൂഷാ ആശയം നിലനിർത്തുന്നു; ഔദ്യോഗിക പദവിയെയോ വെറും സഹായികളെന്ന വ്യാഖ്യാനത്തെയോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: തിമൊഥെയൊസിനെയും എരസ്തൊസിനെയും
  rationale: ഗ്രീക്ക് പേരുകളുടെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: αὐτὸς
  choice: അദ്ദേഹംതന്നെ
  rationale: അയയ്ക്കപ്പെട്ട രണ്ടുപേരിൽനിന്ന് പൗലൊസിനെ വേർതിരിച്ചുകാട്ടുന്ന മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἐπέσχεν χρόνον
  choice: കുറച്ചുകാലം ... തങ്ങി
  rationale: ഒരു കാലയളവോളം ഒരു സ്ഥലത്ത് തുടരുക എന്ന ഇടിയത്തിന്റെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὴν Ἀσίαν
  choice: ഏഷ്യയിൽ
  rationale: ἐπέσχεν χρόνον എന്ന പ്രയോഗത്തോടൊപ്പം εἰς ഇവിടെ സ്ഥലസൂചനയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ മലയാളത്തിൽ സ്ഥലാധികരണം സ്വാഭാവികമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശുശ്രൂഷ ചെയ്തിരുന്നവർ’ എന്നത് സേവനത്തിന്റെ അർഥം കാത്തുസൂക്ഷിക്കുമ്പോൾ പ്രത്യേക സഭാപദവി സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു. പ്രധാനവാക്യത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
