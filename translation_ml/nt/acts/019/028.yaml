reference: Acts 19:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ ἔκραζον λέγοντες· Μεγάλη ἡ Ἄρτεμις Ἐφεσίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: ml
  text: 'ഇതു കേട്ടപ്പോൾ അവർ കോപംകൊണ്ടു നിറഞ്ഞവരായി[a] ഇങ്ങനെ വിളിച്ചുകൊണ്ടിരുന്നു: “എഫെസ്യരുടെ ആർത്തെമിസ് മഹതിയാണ്!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ കടുത്ത കോപംകൊണ്ടു നിറഞ്ഞവരായി,” “അവർ ക്രോധാകുലരായി.” ഗ്രീക്കിലെ പ്രയോഗം അക്ഷരാർഥത്തിൽ “θυμόςകൊണ്ടു നിറഞ്ഞവരായി” എന്നാണ്; θυμός തീവ്രമായ കോപത്തെയോ ക്രോധത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ വാക്കുകളെയാണ് കേട്ടതെന്ന് സൂചിപ്പിക്കുന്ന വിധത്തിൽ, മുഖ്യപ്രവൃത്തിക്കു മുമ്പുള്ള സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ബന്ധമാണ് δέ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ അതിന് പ്രത്യേക പദം ചേർക്കേണ്ടതില്ല.
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: കോപംകൊണ്ടു നിറഞ്ഞവരായി
  rationale: ‘θυμόςകൊണ്ടു നിറഞ്ഞവരായി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നിറവ് എന്ന രൂപകവും തീവ്രമായ വികാരവും നിലനിർത്തുന്നു.
- source_word: ἔκραζον
  choice: വിളിച്ചുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയെ ‘-കൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: λέγοντες
  choice: ഇങ്ങനെ
  rationale: വിളിയുടെ ഉള്ളടക്കം പിന്നാലെ നേരിട്ടുള്ള ഉദ്ധരണിയായി വരുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായി അതിനെ അവതരിപ്പിക്കുന്നു.
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: എഫെസ്യരുടെ അർത്തെമിസ് മഹതിയാകുന്നു!
  rationale: ആരാധനാപരമായ മുദ്രാവാക്യത്തിന്റെ ഊന്നലും Ἐφεσίων എന്ന ജനവിഭാഗസൂചകമായ ബഹുവചന ഷഷ്ഠിയും സംരക്ഷിക്കുന്നു.
- source_word: Ἄρτεμις
  choice: അർത്തെമിസ്
  rationale: ഗ്രീക്ക് ദേവതയുടെ പേര് വിവർത്തനം ചെയ്യാതെ മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: ഒരു പുറജാതീയ ദേവതയെ പുകഴ്ത്തുന്ന മുദ്രാവാക്യം ദൈവശാസ്ത്രപരമായ അംഗീകാരം ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: “എഫെസ്യരുടെ അർത്തെമിസ് മഹതിയാകുന്നു!”
  alternative: “എഫെസ്യരുടെ അർത്തെമിസ് വലിയവളാണ്!”
  rationale: ഇത് ജനക്കൂട്ടത്തിന്റെ നേരിട്ടുള്ള മുദ്രാവാക്യമെന്ന നിലയിൽ മാത്രം റിപ്പോർട്ട് ചെയ്യുന്നു; വിവർത്തകന്റെ അംഗീകാരമോ അപലപനമോ വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല. ‘മഹതിയാകുന്നു’ മുദ്രാവാക്യത്തിന്റെ ഉയർന്ന, ആരാധനാപരമായ സ്വരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. തുടർച്ചയായ ജനക്കൂട്ടവിളി ക്രിയാരൂപത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്; മുദ്രാവാക്യത്തിന് ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ ശൈലി നൽകിയിരിക്കുന്നു.
