source:
  edition: SBLGNT
  text: πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: ml
  text: വിശ്വസിച്ചവരിൽ പലരും വന്ന് തങ്ങളുടെ പ്രവൃത്തികൾ[a] ഏറ്റുപറയുകയും വെളിപ്പെടുത്തുകയും ചെയ്യുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തങ്ങളുടെ അഭ്യാസങ്ങൾ” അല്ലെങ്കിൽ “തങ്ങൾ ചെയ്ത കാര്യങ്ങൾ.”
    reason: πράξεις എന്ന പദത്തിന് പ്രവൃത്തികൾ, അഭ്യാസങ്ങൾ, ചെയ്ത കാര്യങ്ങൾ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: πολλοί τε
  choice: പലരും
  rationale: πολλοί എന്നതിന്റെ സ്വാഭാവികമായ അളവുസൂചക അർഥം നൽകുന്നു; τέ മുൻവിവരണത്തോടുള്ള മൃദുവായ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിൽ പ്രത്യേകം പദമായി നൽകേണ്ടതില്ല.
- source_word: τῶν πεπιστευκότων
  choice: വിശ്വസിച്ചവരിൽ
  rationale: പൂർണകാല കൃദന്തം മുൻപ് ഉണ്ടായ വിശ്വാസത്തെയും അതിന്റെ തുടരുന്ന പ്രസക്തിയെയും സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായ ഒരു സഭാപദവി ചുമത്താതെ ഈ അർഥം നിലനിർത്തുന്നു.
- source_word: ἤρχοντο
  choice: വന്ന് … ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലത്തിന്റെ നടന്നുകൊണ്ടിരുന്നോ ആവർത്തിച്ചോ ഉള്ള ഭാവം മലയാളത്തിൽ സംയുക്ത ക്രിയാരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξομολογούμενοι
  choice: ഏറ്റുപറയുകയും
  rationale: തുറന്ന് സമ്മതിക്കുക അഥവാ ഏറ്റുപറയുക എന്ന അർഥം നൽകുന്നു; അവർ പാപങ്ങളാണോ പ്രവൃത്തികളാണോ ഏറ്റുപറഞ്ഞത് എന്നത് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀναγγέλλοντες
  choice: വെളിപ്പെടുത്തുകയും
  rationale: അറിയിക്കുക, തുറന്നുപറയുക എന്ന അർഥം സന്ദർഭാനുസൃതമായി നൽകുകയും ‘ഏറ്റുപറയുക’ എന്നതുമായ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τὰς πράξεις αὐτῶν
  choice: തങ്ങളുടെ പ്രവൃത്തികൾ
  rationale: πρᾶξις എന്ന പദത്തിന്റെ ‘പ്രവൃത്തികൾ/ചെയ്ത കാര്യങ്ങൾ/അഭ്യാസങ്ങൾ’ എന്ന അർഥവ്യാപ്തി നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളപ്രയോഗം; മന്ത്രവാദപ്രവൃത്തികളിലേക്കോ പാപങ്ങളിലേക്കോ മാത്രം പദത്തെ ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: πεπιστευκότων എന്നത് സ്ഥിരമായ ഒരു സംഘനാമമായോ മുൻകാല വിശ്വാസപ്രവൃത്തിയായി തുടരുന്ന നിലയായോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: വിശ്വസിച്ചവരിൽ
  alternative: വിശ്വാസികളിൽ
  rationale: ഗ്രീക്കിലെ പൂർണകാല കൃദന്തം മുൻപ് വിശ്വസിച്ചവരെ വിവരിക്കുന്നു; ‘വിശ്വാസികൾ’ എന്ന സാങ്കേതിക സംഘനാമം നിർബന്ധമായി ഇറക്കുമതി ചെയ്യാതെ കാലഭാവം സൂക്ഷിക്കുന്നു.
- issue: τὰς πράξεις αὐτῶν പൊതുവായ പ്രവൃത്തികളെയോ പ്രത്യേകിച്ച് മന്ത്രവാദ അഭ്യാസങ്ങളെയോ പാപങ്ങളെയോ സൂചിപ്പിക്കുന്നുവോ എന്നത്
  choice: തങ്ങളുടെ പ്രവൃത്തികൾ
  alternative: തങ്ങളുടെ അഭ്യാസങ്ങൾ / തങ്ങളുടെ പാപങ്ങൾ
  rationale: സന്ദർഭം മന്ത്രവാദവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും മൂലപദം അതിലും വിശാലമാണ്. ‘പ്രവൃത്തികൾ’ ആ സന്ദർഭസാധ്യത തുറന്നുവെച്ചുകൊണ്ട് പദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. അപൂർണകാലഭാവം ‘ചെയ്തുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു; ‘പ്രവൃത്തികൾ’ എന്ന പദത്തിലെ സന്ദർഭപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പോടെ നിലനിർത്തി.
