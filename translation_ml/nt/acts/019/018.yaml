  verdict: revise
  source_fidelity: The draft accurately renders the participants, the two accompanying actions, and the broad sense of πράξεις. However, the imperfect ἤρχοντο ('were coming' / 'kept coming') is not adequately represented by the perfective converb വന്ന്; the progressive ചെയ്തുകൊണ്ടിരുന്നു is instead attached primarily to the confessing and disclosing.
  naturalness: The current wording is understandable and generally idiomatic, but it shifts the ongoing or repeated force from 'coming' to the participial actions. A habitual construction is more natural Malayalam and better reflects the Greek narrative imperfect.
  terminology: വിശ്വസിച്ചവരിൽ, ഏറ്റുപറയുക, വെളിപ്പെടുത്തുക, and പ്രവൃത്തികൾ are appropriate modern-standard Malayalam choices. The note appropriately retains the lexical breadth of πράξεις without making it mean only sins or magical practices.
  issues:
