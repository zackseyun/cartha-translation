    issue: Imperfect aspect of ἤρχοντο is displaced
    rationale: In 'വന്ന് … ചെയ്തുകൊണ്ടിരുന്നു,' വന്ന് presents the coming as completed, while ചെയ്തുകൊണ്ടിരുന്നു makes the subsequent actions progressive. Greek ἤρχοντο is the imperfect verb, with ἐξομολογούμενοι and ἀναγγέλλοντες as accompanying participles. 'വന്ന് … ചെയ്യുമായിരുന്നു' naturally expresses repeated/ongoing coming together with the accompanying actions.
