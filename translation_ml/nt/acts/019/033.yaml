  to: ജനക്കൂട്ടത്തിൽനിന്ന് അവർ അലക്സാണ്ടറെ മുന്നിലേക്കു കൊണ്ടുവന്നു[a], യെഹൂദന്മാർ അവനെ മുന്നോട്ടു കൊണ്ടുവന്നതിനാൽ. അലക്സാണ്ടർ കൈകൊണ്ട് ആംഗ്യം കാട്ടി ജനസമൂഹത്തോടു[b] പ്രതിരോധവാദം നടത്താൻ ആഗ്രഹിച്ചു.
