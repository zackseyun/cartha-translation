translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ὄχλος, δῆμος എന്നീ പദങ്ങളുടെ വ്യത്യാസം ‘ജനക്കൂട്ടം’, ‘പൊതുയോഗം’ എന്നിങ്ങനെ നിലനിർത്തി. രണ്ടു ബന്ധമുള്ള മുന്നോട്ടുകൊണ്ടുവരൽ ക്രിയകളുടെ ആവർത്തനവും കൈയാംഗ്യത്തിന്റെ വ്യക്തമാക്കാത്ത ലക്ഷ്യവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
