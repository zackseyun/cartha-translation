revisions:
- from: അങ്ങനെ നഗരം മുഴുവൻ ആശയക്കുഴപ്പംകൊണ്ട് നിറഞ്ഞു. അവർ പൗലോസിന്റെ യാത്രാസഹചാരികളായ മക്കെദോന്യർ ഗായൊസിനെയും അരിസ്താർക്കൊസിനെയും ബലമായി പിടിച്ചുകൊണ്ടുപോയി[a], ഒരുമിച്ച് നാടകശാലയിലേക്ക് പാഞ്ഞുകയറി.
  to: നഗരം ആശയക്കുഴപ്പത്താൽ നിറഞ്ഞു; അവർ പൗലോസിന്റെ യാത്രാസഹചാരികളായ മക്കെദോന്യരായ ഗായൊസിനെയും അരിസ്തർഹൊസിനെയും ബലമായി പിടിച്ചുകൊണ്ട് ഒരുമിച്ച് നാടകശാലയിലേക്കു പാഞ്ഞുകയറി[a].
  rationale: പങ്കുപറ്റുന്ന ക്രിയയായ συναρπάσαντες-നെ ‘ബലമായി പിടിച്ചുകൊണ്ട്’ എന്നു വിവർത്തനം ചെയ്ത്, അതിനെ മുഖ്യക്രിയയായ ‘പാഞ്ഞുകയറി’യോടു നേരിട്ട് ബന്ധിപ്പിച്ചു. ഇതിലൂടെ ബലപ്രയോഗവും ജനക്കൂട്ടത്തിന്റെ കൂട്ടമായ ചലനവും നിലനിൽക്കുന്നു; അനാവശ്യമായി വേറൊരു ‘കൊണ്ടുപോകൽ’ പ്രവൃത്തി ചേർക്കുന്നില്ല. അടിക്കുറിപ്പും പൂർണവും വ്യാകരണപരവുമായ ബദലുകളായി തിരുത്തി.
