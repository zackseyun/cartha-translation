    rationale: ഇത് ‘ബലമായി പിടിക്കപ്പെട്ട ആളുകളെ’ എന്നപോലുള്ള അർഥത്തിലേക്കു വഴുതുന്നു; ഗ്രീക്ക് ക്രിയയുടെ ബദലായി ഗായൊസിനെയും അരിസ്തർഹൊസിനെയും കർമങ്ങളാക്കി വ്യക്തമായി നൽകണം.
  - severity: low
    issue: ‘അങ്ങനെ’ καί-യെ ഫലസൂചകമായി വായിക്കാനിടയാക്കാം.
    rationale: ഇവിടെ ബന്ധകം പ്രധാനമായും ആഖ്യാനത്തെ തുടരുന്നതാണ്; ഒഴിവാക്കുകയോ ‘അപ്പോൾ’ ഉപയോഗിക്കുകയോ ചെയ്യുന്നത് സുരക്ഷിതമാണ്.
