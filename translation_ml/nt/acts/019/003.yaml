id: ACT.19.3
reference: Acts 19:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: ml
  text: 'അദ്ദേഹം പറഞ്ഞു: “പിന്നെ നിങ്ങൾ എന്തിലേക്കാണ് സ്നാനം ഏറ്റത്?” അവർ പറഞ്ഞു: “യോഹന്നാന്റെ സ്നാനത്തിലേക്ക്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: അപ്പോൾ അദ്ദേഹം ചോദിച്ചു
  rationale: λέγω അടിസ്ഥാനമായി ‘പറയുക’ എന്നാണെങ്കിലും നേരിട്ടുള്ള ചോദ്യത്തിന് ആമുഖമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്. τε നൽകുന്ന നേരിയ ആഖ്യാനബന്ധം ‘അപ്പോൾ’ പ്രകടമാക്കുന്നു.
- source_word: Εἰς τί οὖν
  choice: പിന്നെ ... എന്തിലേക്കാണ്
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനാത്മക തുടർച്ച ‘പിന്നെ’ നിലനിർത്തുന്നു. εἰς എന്നതിന്റെ ദിശാത്മക രൂപം ‘എന്തിലേക്കാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി മറുപടിയിലെ ആവർത്തനവുമായി സമാന്തരത കാത്തു.
- source_word: ἐβαπτίσθητε
  choice: നിങ്ങൾ ... സ്നാനം ഏറ്റത്
  rationale: ഗ്രീക്കിലെ aorist passive മലയാളത്തിൽ സ്വാഭാവികമായി ‘സ്നാനം ഏറ്റു’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു; കർമസ്വഭാവം അമിതമായി കൃത്രിമമാക്കാതെ സംഭവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: യോഹന്നാന്റെ സ്നാനത്തിലേക്ക്
  rationale: Ἰωάννου എന്ന genitive ‘യോഹന്നാന്റെ’ എന്നും βάπτισμα ‘സ്നാനം’ എന്നും നൽകി, ആവർത്തിച്ച εἰς-നെ ‘-ലേക്ക്’ ആയി നിലനിർത്തുന്നു.
- source_word: βάπτισμα
  choice: സ്നാനം
  rationale: യോഹന്നാനുമായി ബന്ധപ്പെട്ട ആചാരത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ-മതഭാഷയിൽ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദമാണിത്.
theological_decisions:
- issue: ചോദ്യത്തിലും മറുപടിയിലും ആവർത്തിക്കുന്ന εἰς നിലനിർത്തണമോ
  choice: ‘എന്തിലേക്കാണ്’ / ‘സ്നാനത്തിലേക്ക്’ എന്നു രണ്ടിടത്തും ദിശാത്മക ഘടന നിലനിർത്തി
  alternative: ‘ഏത് സ്നാനമാണ് നിങ്ങൾ ഏറ്റത്?’ / ‘യോഹന്നാന്റെ സ്നാനം’ എന്ന സ്വാഭാവിക പരാവർത്തനം
  rationale: ഗ്രീക്കിലെ വാക്യസമാന്തരതയും സ്നാനത്തിലൂടെയുള്ള ബന്ധപ്പെടുത്തൽ അല്ലെങ്കിൽ മേഖലയെന്ന ആശയസാധ്യതയും സംരക്ഷിക്കുന്നു; അതേസമയം പ്രത്യേകമായ ഒരു സഭാവിഭാഗത്തിന്റെ സ്നാനസിദ്ധാന്തം വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി. മൂലത്തിലെ εἰς ആവർത്തനം അല്പം അസാധാരണമായ മലയാളഘടനയിലൂടെയും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു.
