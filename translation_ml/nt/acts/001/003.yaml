id: ACT.1.3
reference: Acts 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: ml
  text: കഷ്ടം അനുഭവിച്ചതിനുശേഷം, അവൻ അനേകം തെളിവുകളാൽ[a] താൻ ജീവനോടെയുണ്ടെന്ന് അവർക്കും കാണിച്ചുകൊടുത്തു. നാല്പതു ദിവസങ്ങളിലായി[b] അവർക്കു പ്രത്യക്ഷനാകുകയും ദൈവരാജ്യത്തെക്കുറിച്ച് സംസാരിക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉറപ്പേകുന്ന അനേകം തെളിവുകളാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ഉറപ്പു സ്ഥാപിക്കുന്ന തെളിവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നാല്പതു ദിവസക്കാലത്ത്’ അല്ലെങ്കിൽ ‘നാല്പതു ദിവസത്തോളം’ എന്നും പരിഭാഷപ്പെടുത്താം. ആ കാലയളവിലെ വിവിധ അവസരങ്ങളിൽ ഉണ്ടായ പ്രത്യക്ഷതകളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: അവർക്കു
  rationale: മുൻവാക്യത്തിലെ അപ്പൊസ്തലന്മാരെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പുരുഷന്മാർ’ എന്ന പദം ചേർക്കാതെ സന്ദർഭത്തിലെ സൂചന നിലനിർത്തുന്നു.
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: താൻ ജീവനോടിരിക്കുന്നുവെന്ന് അവർക്കു കാണിച്ചുകൊടുത്തു
  rationale: സ്വയം ജീവനുള്ളവനായി അവരുടെ മുമ്പിൽ വെളിപ്പെടുത്തി എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: കഷ്ടം അനുഭവിച്ചതിനുശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive മുൻപ് പൂർത്തിയായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന കാലികപ്രയോഗമാണ്.
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: അനേകം തെളിവുകളാൽ
  rationale: τεκμήριον ഉറപ്പുനൽകുന്ന തെളിവിനെ സൂചിപ്പിക്കുന്നു; ἐν ഇവിടെ ഉപാധി അഥവാ മാർഗം വ്യക്തമാക്കുന്നു. മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനാത്മക വിശേഷണം ചേർക്കാതെ ശക്തമായ ‘തെളിവുകൾ’ എന്ന പദം ഉപയോഗിച്ചു.
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: നാല്പതു ദിവസങ്ങളിലായി
  rationale: διά + genitive നാല്പതു ദിവസത്തെ കാലയളവിലുടനീളം വിവിധ അവസരങ്ങളിൽ പ്രത്യക്ഷപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; തുടർച്ചയായി നാല്പതു ദിവസം ദൃശ്യനായിരുന്നുവെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ὀπτανόμενος αὐτοῖς
  choice: അവർക്കു പ്രത്യക്ഷനാകുകയും
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ ὀπτάνομαι എന്നതിന്റെ സ്വാഭാവിക അർഥമായ ‘പ്രത്യക്ഷനാകുക’ നിലനിർത്തുന്നു.
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെക്കുറിച്ച് സംസാരിക്കുകയും ചെയ്തു
  rationale: τὰ περὶ എന്ന പ്രയോഗം ‘സംബന്ധിച്ച കാര്യങ്ങൾ’ എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ‘കുറിച്ച് സംസാരിക്കുക’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: βασιλείαയ്ക്ക് രാജഭരണത്തെയും രാജ്യത്തെയും സൂചിപ്പിക്കാനാകുന്നു. ‘ദൈവരാജ്യം’ പരിചിതമായ പ്രയോഗമായിരിക്കെ ഈ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനഭാഷയും തെളിവുകളുടെ പ്രാബല്യവും
  choice: കഷ്ടാനുഭവത്തിനുശേഷം യേശു ജീവനോടിരിക്കുന്നതായി അനേകം തെളിവുകളാൽ കാണിച്ചുകൊടുത്തുവെന്ന് നേരിട്ട് പ്രസ്താവിക്കുന്നു.
  alternative: ‘തന്റെ പീഡാനുഭവത്തിനുശേഷം തെറ്റില്ലാത്ത അനേകം തെളിവുകളാൽ സ്വയം ജീവനുള്ളവനായി വെളിപ്പെടുത്തി.’
  rationale: ഗ്രീക്ക് പാഠം കഷ്ടാനുഭവത്തിനുശേഷമുള്ള ജീവനും അതിനു തെളിവായ പ്രത്യക്ഷതകളും ഉറപ്പിക്കുന്നു. എന്നാൽ ‘തെറ്റില്ലാത്ത’ പോലുള്ള അധിക വ്യാഖ്യാനവിശേഷണം ചേർക്കുന്നില്ല.
- issue: οἷς എന്നതിന്റെ ലിംഗസൂചന
  choice: അവർക്കു
  alternative: ഈ പുരുഷന്മാർക്ക്
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽ അപ്പൊസ്തലന്മാരാണ് സൂചിതർ; എന്നാൽ οἷς എന്ന പദം സ്വതന്ത്രമായി ‘പുരുഷന്മാർ’ എന്നു പറയാത്തതിനാൽ മലയാളത്തിൽ അധിക നാമം ചേർക്കാതെ സർവനാമം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്കിന്റെ ദീർഘഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും സംഭവക്രമവും പങ്കാളിത്തബന്ധവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ അവയുടെ യഥാർഥ വിഷയങ്ങളോട് പൊരുത്തപ്പെടാത്തതിനാൽ, തെളിവുകൾക്ക് [a]യും നാല്പതു ദിവസങ്ങൾക്ക് [b]യും ചേർത്തു.
