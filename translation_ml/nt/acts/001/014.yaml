id: ACT.1.14
reference: Acts 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: ml
  text: ഇവരെല്ലാവരും സ്ത്രീകളോടും യേശുവിന്റെ അമ്മയായ മറിയത്തോടും അവന്റെ സഹോദരന്മാരോടും ചേർന്ന് ഏകമനസ്സോടെ[a] പ്രാർഥനയിൽ തുടർച്ചയായി ഏർപ്പെട്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരേ മനസ്സോടെ’ അല്ലെങ്കിൽ ‘ഐക്യത്തോടെ’; ഗ്രീക്ക് പദം ഒരേ ലക്ഷ്യത്തോടെയുള്ള ഐക്യത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം adelphoi ആണ്. ചിലർ ഇതിനെ അടുത്ത ബന്ധുക്കളെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ ബന്ധുത്വാർഥത്തിൽ മനസ്സിലാക്കുന്നു; ഈ വാക്യം അതിനെക്കുറിച്ച് കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: ഇവരെല്ലാവരും
  rationale: οὗτοι എന്ന സൂചനയും πάντες എന്ന സമഗ്രതയും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἦσαν προσκαρτεροῦντες
  choice: നിരന്തരം ... മുഴുകിയിരുന്നു
  rationale: πεരിഫ്രാസ്റ്റിക് അപൂർണകാലം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവർത്തനവും προσκαρτερέωയിലെ സ്ഥിരോത്സാഹപൂർവമായ അർപ്പണവും പ്രകടമാക്കുന്നു.
- source_word: ὁμοθυμαδόν
  choice: ഏകമനസ്സോടെ
  rationale: വെറും ഒരുമിച്ചുകൂടൽ മാത്രമല്ല, പങ്കിട്ട ലക്ഷ്യവും മനസ്സിന്റെ ഐക്യവും സൂചിപ്പിക്കുന്നു.
- source_word: τῇ προσευχῇ
  choice: പ്രാർഥനയിൽ
  rationale: προσκαρτερέωയോടൊപ്പമുള്ള ദത്തിവ് ഇവിടെ അവർ സ്ഥിരമായി ഏർപ്പെട്ടിരുന്ന കാര്യത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പ്രാർഥനയിൽ മുഴുകുക’ സ്വാഭാവികമാണ്.
- source_word: σὺν γυναιξίν
  choice: സ്ത്രീകളോടും ... കൂടെ
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലാത്തതിനാൽ ‘സ്ത്രീകൾ’ എന്ന് നിലനിർത്തുന്നു; σύν സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം ‘കൂടെ’ വ്യക്തമാക്കുന്നു.
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ അമ്മയായ മറിയ
  rationale: വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: അവന്റെ സഹോദരന്മാരോടും
  rationale: ἀδελφοί പുരുഷലിംഗ ബഹുവചനമായതിനാൽ അതിന്റെ സാധാരണ അർഥം സംരക്ഷിക്കുന്നു; ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം മുഖ്യവാചകത്തിൽ നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിന്റെ ἀδελφοί ആരെ സൂചിപ്പിക്കുന്നു
  choice: അവന്റെ സഹോദരന്മാർ
  alternative: അവന്റെ അടുത്ത ബന്ധുക്കൾ / ചാർച്ചക്കാർ
  rationale: ἀδελφοίയുടെ സാധാരണ അർഥം ‘സഹോദരന്മാർ’ എന്നാണ്. ഇവരുടെ കൃത്യമായ കുടുംബബന്ധത്തെക്കുറിച്ചുള്ള പാരമ്പര്യവ്യത്യാസങ്ങൾ വാക്യം തന്നെ തീർപ്പാക്കാത്തതിനാൽ പരിഭാഷയും അത് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: 'ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ കൂട്ടായ്മയും തുടർച്ചയായ പ്രാർഥനയും മുൻനിരയിൽ വരാൻ മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് കരടിലെ സ്ത്രീകളെക്കുറിച്ചുള്ള അടിക്കുറിപ്പ് ഗ്രീക്ക് വാചകവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയില്ല: σὺν γυναιξίν എന്നതിൽ നിർദേശക ഉപപദം ഇല്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ ‘സ്ത്രീകളോടും’ എന്നാണ്.'
