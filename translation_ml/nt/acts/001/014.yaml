revisions:
- from: ഇവരെല്ലാവരും സ്ത്രീകളോടും യേശുവിന്റെ അമ്മയായ മറിയയോടും അവന്റെ സഹോദരന്മാരോടുംകൂടെ ഏകമനസ്സോടെ[a] നിരന്തരം പ്രാർഥനയിൽ മുഴുകിയിരുന്നു.[b]
  to: ഇവരെല്ലാവരും സ്ത്രീകളോടും യേശുവിന്റെ അമ്മയായ മറിയത്തോടും അവന്റെ സഹോദരന്മാരോടും ചേർന്ന് ഏകമനസ്സോടെ[a] പ്രാർഥനയിൽ തുടർച്ചയായി ഏർപ്പെട്ടിരുന്നു.[b]
