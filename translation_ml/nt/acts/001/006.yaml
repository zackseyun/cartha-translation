reference: Acts 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: ml
  text: 'അങ്ങനെ, അവർ ഒരുമിച്ചുകൂടിയപ്പോൾ അവനോടു ചോദിച്ചു: “കർത്താവേ, ഈ സമയത്താണോ അങ്ങ് ഇസ്രായേലിന്[a] രാജ്യം പുനഃസ്ഥാപിക്കുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇസ്രായേലിനുവേണ്ടി.” ഗ്രീക്ക് ദത്തിവിഭക്തിയെ ഗുണഭോക്തൃ അർഥത്തിൽ (“ഇസ്രായേലിനുവേണ്ടി”) അല്ലെങ്കിൽ രാജ്യം നേരിട്ട് “ഇസ്രായേലിന്” പുനഃസ്ഥാപിക്കുന്നതായും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: അങ്ങനെ, അവർ ഒരുമിച്ചുകൂടിയപ്പോൾ
  rationale: സυνελθόντες എന്ന പങ്കാളിക്രിയയെ സാഹചര്യകാലം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; μὲν οὖν എന്ന വ്യവഹാരബന്ധത്തെ ‘അങ്ങനെ’ എന്ന പദം അതിവിവർത്തനം ചെയ്യാതെ കൈമാറുന്നു.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: അവനോടു ചോദിച്ചു
  rationale: അപൂർണഭൂതകാലമായ ἠρώτων ഇവിടെ നീണ്ടുനിന്ന പ്രവർത്തിയായി നിർബന്ധമായി വായിക്കേണ്ടതില്ല; മലയാള ആഖ്യാനത്തിൽ ‘ചോദിച്ചു’ സ്വാഭാവികമാണ്. λέγοντες ഉദ്ധരണിയുടെ ഉള്ളടക്കത്തിലൂടെ തന്നെ പ്രകടമാകുന്നതിനാൽ വേറിട്ട് ‘പറഞ്ഞുകൊണ്ട്’ എന്നു ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: യേശുവിനോടുള്ള നേരിട്ടുള്ള സംബോധനത്തിൽ ബഹുമാനവും സ്ഥാനപ്പേരിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: εἰ ἐν τῷ χρόνῳ τούτῳ
  choice: ഈ സമയത്താണോ
  rationale: εἰ ഇവിടെ ഉവ്വ്/ഇല്ല ചോദ്യത്തെ അവതരിപ്പിക്കുന്നു; χρόνος ഒരു കാലയളവിനെയോ അവസരത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἀποκαθιστάνεις
  choice: പുനഃസ്ഥാപിക്കുന്നത്
  rationale: മുൻസ്ഥിതിയിലേക്കുള്ള പുനഃസ്ഥാപനം എന്ന അർഥം സംരക്ഷിക്കുകയും വർത്തമാനകാല ചോദ്യത്തിന്റെ പുരോഗമനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: τὴν βασιλείαν
  choice: രാജ്യം
  rationale: βασιλείαയ്ക്ക് ‘ഭരണം’ എന്ന അർഥവും സാധ്യമാണെങ്കിലും, ഇസ്രായേലിനുള്ള പുനഃസ്ഥാപനത്തെക്കുറിച്ചുള്ള ശിഷ്യരുടെ പ്രതീക്ഷ ഇവിടെ മുൻനിൽക്കുന്നതിനാൽ ‘രാജ്യം’ ആ ചരിത്രപരമായ ഭാവം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τῷ Ἰσραήλ
  choice: ഇസ്രായേലിന്
  rationale: ഗ്രീക്ക് ദത്തിവിഭക്തിയുടെ സ്വീകർത്തൃഭാവവും ഗുണഭോക്തൃഭാവവും മലയാളത്തിലെ ‘ഇസ്രായേലിന്’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി തുറന്നുവെക്കാം.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ രാജ്യത്തെക്കുറിച്ചുള്ള ശിഷ്യരുടെ പ്രതീക്ഷയുടെ സ്വഭാവം
  choice: ‘ഇസ്രായേലിന് രാജ്യം പുനഃസ്ഥാപിക്കുന്നത്’ എന്ന് ചോദ്യത്തെ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ‘ഇസ്രായേലിന്റെ രാഷ്ട്രീയരാജ്യം പുനഃസ്ഥാപിക്കുന്നത്’ എന്നോ ‘ഇസ്രായേലിൽ ദൈവത്തിന്റെ ആത്മീയഭരണം സ്ഥാപിക്കുന്നത്’ എന്നോ വ്യാഖ്യാനപരമായി വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം ശിഷ്യരുടെ ചോദ്യം രേഖപ്പെടുത്തുന്നതാണ്; അവരുടെ പ്രതീക്ഷയെ യേശു പൂർണമായി അംഗീകരിച്ചോ തിരുത്തിയോ എന്നത് ഇവിടെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ രാഷ്ട്രീയമെന്നോ ആത്മീയമെന്നോ മുൻകൂട്ടി നിർണയിക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. യേശുവിനോടുള്ള ബഹുമാനസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ പങ്കാളിക്രിയാഘടന മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ഉദ്ധരണി നേരിട്ട് അവതരിപ്പിച്ചു.
