source:
  edition: SBLGNT
  text: Καὶ ἐν ταῖς ἡμέραις ταύταις ἀναστὰς Πέτρος ἐν μέσῳ τῶν ⸀ἀδελφῶν εἶπεν (ἦν τε ὄχλος ὀνομάτων ἐπὶ τὸ αὐτὸ ⸀ὡς ἑκατὸν εἴκοσι)·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/015.yaml
  text: And in those days Peter stood up in the midst of the brothers and said (the number of names together was about one hundred twenty),[a]
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ പത്രോസ് സഹോദരന്മാരുടെ നടുവിൽ എഴുന്നേറ്റു പറഞ്ഞു (ഒരുമിച്ചുകൂടിയവരുടെ എണ്ണം ഏകദേശം നൂറ്റിയിരുപതായിരുന്നു):[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരന്മാരും സഹോദരിമാരും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്. എന്നാൽ ഇവിടെ കൂടിവന്ന വിശ്വാസസമൂഹത്തിൽ സ്ത്രീകൾ ഉൾപ്പെടെ എല്ലാ സഹവിശ്വാസികളെയും ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: സംസാരിക്കാൻ തുടങ്ങുന്നതിനു മുമ്പ് പത്രോസ് എഴുന്നേറ്റുനിന്ന വ്യക്തമായ പ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν μέσῳ
  choice: നടുവിൽ
  rationale: കൂടിവന്ന സമൂഹത്തിനുള്ളിലെ പത്രോസിന്റെ സ്ഥാനം എന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: ἀδελφῶν
  choice: സഹോദരന്മാരുടെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄχλος ὀνομάτων
  choice: വരുടെ എണ്ണം
  rationale: അക്ഷരാർഥത്തിൽ ‘പേരുകളുടെ കൂട്ടം’ എന്ന ഗ്രീക്ക് പ്രയോഗം ആളുകളുടെ എണ്ണത്തെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗശൈലിയാണ്; ‘ഒരുമിച്ചുകൂടിയിരുന്നവരുടെ എണ്ണം’ എന്നത് അതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒരുമിച്ചുകൂടിയിരുന്ന
  rationale: സംഘം ഒരുമിച്ചു കൂടിയിരുന്നു എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: ഏകദേശം നൂറ്റിയിരുപത്
  rationale: സംഖ്യ ഏകദേശമാണെന്ന് സൂചിപ്പിക്കുന്ന ὡς എന്ന പദത്തിന്റെ ഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൂടിവന്ന വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ἀδελφῶν എന്ന പദത്തിന്റെ ലിംഗപരമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’ എന്ന പുല്ലിംഗരൂപം നിലനിർത്തി, സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുക.
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘വിശ്വാസികൾ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും, ഈ സമൂഹത്തിൽ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാമെന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പ് മറച്ചുവയ്ക്കാതെ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ വാക്യഘടനയിലുള്ള പരാന്തരവിവരം പരാൻതീസിസിൽ നിലനിർത്തി; ‘പേരുകളുടെ കൂട്ടം’ എന്ന അക്ഷരാർഥപരവും അസ്വാഭാവികവുമായ രൂപത്തിനു പകരം അതിന്റെ വ്യക്തികളെ എണ്ണുന്ന പ്രയോഗാർഥം നൽകി.
