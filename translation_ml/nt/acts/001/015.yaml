    rationale: ‘എഴുന്നേറ്റുനിന്ന്’ can suggest both getting up and remaining standing; the Greek aorist participle simply introduces Peter's action of standing up before speaking. ‘എഴുന്നേറ്റു’ is more idiomatic and sufficiently precise.
  - severity: low
    issue: Footnote alternative wording
    rationale: The compound ‘സഹോദരീസഹോദരന്മാർ’ is less natural in modern standard Malayalam. ‘സഹോദരന്മാരും സഹോദരിമാരും’ clearly expresses the proposed inclusive alternative.
