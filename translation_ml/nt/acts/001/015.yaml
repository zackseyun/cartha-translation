  terminology: ‘സഹോദരന്മാർ’ correctly retains the masculine plural ἀδελφοί in the main text. The footnote responsibly notes the possible inclusive communal reference without replacing the source term in the text. ‘സഹോദരന്മാരും സഹോദരിമാരും’ is a clearer modern Malayalam alternative than the compounded form ‘സഹോദരീസഹോദരന്മാർ.’
  issues:
