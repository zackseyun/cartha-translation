id: ACT.1.20
reference: Acts 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: ml
  text: 'കാരണം, സങ്കീർത്തനങ്ങളുടെ പുസ്തകത്തിൽ ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “അവന്റെ വാസസ്ഥലം[a] ശൂന്യമായിത്തീരട്ടെ; അതിൽ ആരും താമസിക്കാതിരിക്കട്ടെ,”[b] എന്നും, “അവന്റെ മേൽനോട്ടച്ചുമതല[c] മറ്റൊരാൾ ഏറ്റെടുക്കട്ടെ,” എന്നും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വാസസ്ഥലം” എന്നതിന് “പാർപ്പിടം” എന്നോ “താമസസ്ഥലം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: “അതിൽ താമസിക്കുന്നവൻ ആരും ഉണ്ടാകാതിരിക്കട്ടെ.”'
    reason: lexical_alternative
  - marker: c
    text: “മേൽനോട്ടച്ചുമതല” എന്നതിന് “ചുമതല” എന്നോ “മേൽനോട്ടസ്ഥാനം” എന്നോ പരിഭാഷപ്പെടുത്താം. പിൽക്കാലത്തെ ഒരു സാങ്കേതിക സഭാപദവി ഇവിടെ നിർബന്ധമായി ഉദ്ദേശിക്കപ്പെടുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്നതിനുള്ള ഗ്രീക്ക് പൂർണകാല കർമണി പ്രയോഗത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: βίβλῳ ψαλμῶν
  choice: സങ്കീർത്തനങ്ങളുടെ പുസ്തകത്തിൽ
  rationale: ഉദ്ധരണിയുടെ തിരുവെഴുത്ത് ഉറവിടത്തെ വ്യക്തമായും സ്വാഭാവികമായും തിരിച്ചറിയിക്കുന്നു.
- source_word: Γενηθήτω
  choice: ആയിത്തീരട്ടെ
  rationale: ഉദ്ധരണിയിലെ ആജ്ഞാർഥകമായ ആശംസയുടെയോ ന്യായവിധിപ്രഖ്യാപനത്തിന്റെയോ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἔπαυλις
  choice: വാസസ്ഥലം
  rationale: വീട്, പാർപ്പിടം, താമസസ്ഥലം എന്നീ ആശയങ്ങളെ ഉൾക്കൊള്ളുന്ന വിശാലവും സന്ദർഭോചിതവുമായ പദം.
- source_word: ἔρημος
  choice: ശൂന്യമായ
  rationale: ആൾപ്പാർപ്പില്ലാതെ ഉപേക്ഷിക്കപ്പെട്ട അവസ്ഥയെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: അതിൽ ആരും താമസിക്കാതിരിക്കട്ടെ
  rationale: നിവാസി ആരും അവിടെ ഉണ്ടാകരുതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπισκοπή
  choice: മേൽനോട്ടച്ചുമതല
  rationale: യൂദാസ് വഹിച്ചിരുന്ന ചുമതലയെയും മേൽനോട്ടസ്വഭാവത്തെയും അറിയിക്കുമ്പോൾ പിൽക്കാലത്തെ സാങ്കേതിക സഭാപദവി അനാവശ്യമായി പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: λαβέτω ἕτερος
  choice: മറ്റൊരാൾ ഏറ്റെടുക്കട്ടെ
  rationale: മറ്റൊരാൾ ആ ചുമതല സ്വീകരിക്കണമെന്ന ആജ്ഞാർഥക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക ചുമതലയുടെ സന്ദർഭത്തിൽ ἐπισκοπή എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മേൽനോട്ടച്ചുമതല
  alternative: ചുമതല; മേൽനോട്ടസ്ഥാനം; അധ്യക്ഷസ്ഥാനം
  rationale: ഈ പദം യൂദാസ് ഒഴിഞ്ഞുപോയ ഉത്തരവാദിത്വത്തെയോ ചുമതലയെയോ സൂചിപ്പിക്കുന്നു. ‘മേൽനോട്ടച്ചുമതല’ എന്നത് മൂലപദത്തിന്റെ മേൽനോട്ടഭാവം നിലനിർത്തുകയും പിൽക്കാലത്തെ ഏതെങ്കിലും പ്രത്യേക സഭാഭരണരീതി പാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, തിരുവെഴുത്ത് ഉദ്ധരണിക്കു യോജിച്ച ഗൗരവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപം. ‘കാരണം’ γάρ-ന്റെ ബന്ധം തുറന്നുകാട്ടുന്നു; ഉദ്ധരണികളുടെ സമാന്തര ഘടന ‘എന്നും ... എന്നും’ ഉപയോഗിച്ച് സൂക്ഷിച്ചിട്ടുണ്ട്.
