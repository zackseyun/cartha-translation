reference: Acts 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: ml
  text: തെയോഫിലോസേ, യേശു ചെയ്യാനും പഠിപ്പിക്കാനും തുടങ്ങിയ എല്ലാറ്റിനെയും കുറിച്ച് ഞാൻ ആദ്യത്തെ വിവരണം[a] എഴുതി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മുമ്പത്തെ വിവരണം’ അല്ലെങ്കിൽ ‘ആദ്യ പുസ്തകം.’
    reason: λόγος എന്ന പദം ഇവിടെ മുൻരചനയെ സൂചിപ്പിക്കുന്നു; πρῶτος എന്നത് ക്രമത്തിലെ ആദ്യത്തേതെന്നോ മുമ്പത്തേതെന്നോ ഗ്രഹിക്കാം, കൂടാതെ സന്ദർഭത്തിൽ ഒരു പുസ്തകത്തെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: ആദ്യത്തെ വിവരണത്തിൽ
  rationale: λόγος ഇവിടെ ഒരു വാക്കിനെയല്ല, മുമ്പ് രചിച്ച എഴുത്തുരൂപത്തിലുള്ള വിവരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. πρῶτον എന്നതിന്റെ ക്രമസൂചന നിലനിർത്താൻ ‘ആദ്യത്തെ’ എന്നു പരിഭാഷപ്പെടുത്തി; μέν സൃഷ്ടിക്കുന്ന തുടർവിവരണത്തിലേക്കുള്ള സംഭാഷണചട്ടക്കൂട് മലയാളവാക്യത്തിന്റെ ഘടനയിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: ἐποιησάμην
  choice: എഴുതി
  rationale: λόγος എന്ന നാമത്തോടൊപ്പമുള്ള പ്രയോഗത്തിൽ ποιέω ഒരു രചന തയ്യാറാക്കുക എന്ന അർഥമാണ് നൽകുന്നത്. ആ സന്ദർഭത്തിൽ ‘എഴുതി’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: περὶ πάντων
  choice: എല്ലാറ്റിനെയും കുറിച്ച്
  rationale: ജനിറ്റീവോടുകൂടിയ περί വിഷയമോ പരാമർശമോ സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന ബന്ധവാക്യവുമായി ചേർന്ന് ‘എല്ലാറ്റിനെയും കുറിച്ച്’ എന്ന രൂപം ഗ്രീക്കിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὦ Θεόφιλε
  choice: തെയോഫിലോസേ
  rationale: ὦ നേരിട്ടുള്ള സംബോധനയെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിലെ സംബോധനപ്രത്യയം ചേർത്ത ‘തെയോഫിലോസേ’ എന്ന രൂപം മൂലപാഠത്തിൽ ഇല്ലാത്ത സ്നേഹവിശേഷണം ചേർക്കാതെ ആ ശക്തി നിലനിർത്തുന്നു.
- source_word: ὧν
  choice: യേശു ... തുടങ്ങിയ എല്ലാറ്റിനെയും
  rationale: ജനിറ്റീവ് ബന്ധസർവനാമമായ ὧν πάντων-ലേക്ക് തിരിച്ചുചേരുന്നു. മലയാളത്തിൽ ബന്ധവാക്യം നാമത്തിനു മുമ്പിൽ വെച്ച് ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിച്ചു.
- source_word: ἤρξατο
  choice: തുടങ്ങിയ
  rationale: ക്രിയയുടെ ‘ആരംഭിച്ചു’ എന്ന അർഥം ഒഴിവാക്കാതെ നിലനിർത്തുന്നു. യേശുവിന്റെ പ്രവൃത്തി അപ്പൊസ്തലപ്രവൃത്തികളിൽ തുടരുന്നു എന്ന സാധ്യത സൂചിപ്പിക്കാമെങ്കിലും പരിഭാഷ അതിനെ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: ὁ Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: ചെയ്യാനും പഠിപ്പിക്കാനും
  rationale: τε καί ബന്ധിപ്പിക്കുന്ന രണ്ടു സമാന്തര പ്രവർത്തനങ്ങളും ‘-ആനും ... -ആനും’ എന്ന മലയാളഘടനയിൽ നിലനിർത്തി. ποιεῖν എന്നതിന്റെ വിശാലമായ അർഥം ചുരുക്കാതിരിക്കാൻ ‘ചെയ്യുക’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ἤρξατο (‘തുടങ്ങി’) എന്നതിൽ യേശുവിന്റെ പ്രവൃത്തി അപ്പൊസ്തലപ്രവൃത്തികളിൽ തുടരുന്നു എന്ന സൂചന
  choice: പ്രധാനപാഠത്തിൽ ‘തുടങ്ങിയ’ എന്ന് നിലനിർത്തി; തുടർച്ചയെ വിശദീകരിച്ചില്ല.
  alternative: ‘യേശു ചെയ്തതും പഠിപ്പിച്ചതുമായ എല്ലാം’ എന്ന് വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ യേശു അപ്പൊസ്തലന്മാരിലൂടെ പ്രവർത്തനം തുടർന്നുവെന്ന് പരാവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം ആരംഭത്തെ വ്യക്തമായി പറയുന്നു. അതിൽ തുടർച്ചയുടെ ദൈവശാസ്ത്രപരമായ സൂചന ഉണ്ടായിരിക്കാമെങ്കിലും, പരിഭാഷ അതിനെ ഇല്ലാതാക്കുകയോ വ്യാഖ്യാനമായി വികസിപ്പിക്കുകയോ ചെയ്യാതെ പാഠത്തിലെ ഉത്കണ്ഠ നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി ഉപയോഗിച്ചു. ‘ഓ തെയോഫിലോസ്’ എന്ന കൃത്രിമമായ രൂപത്തിനു പകരം മലയാളത്തിലെ സ്വാഭാവിക സംബോധനമായ ‘തെയോഫിലോസേ’ സ്വീകരിച്ചു. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ബന്ധവാക്യഘടനയ്ക്കനുസരിച്ച് ക്രമീകരിച്ചെങ്കിലും മൂലപാഠത്തിലെ ‘തുടങ്ങിയ’ എന്ന നിർണായക ആശയം നിലനിർത്തി.
