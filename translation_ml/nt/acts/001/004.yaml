  terminology: ‘കല്പിച്ചു,’ ‘യെരൂശലേം,’ ‘പിതാവിന്റെ വാഗ്ദാനം,’ and ‘കാത്തിരിക്കുക’ are suitable, dignified, and faithful terms. The lexical-alternative footnote appropriately preserves the disputed nuance of συναλιζόμενος without forcing a specific interpretation into the main text.
