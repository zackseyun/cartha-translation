  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: ml
  text: 'അവരോടൊപ്പം ഉണ്ടായിരിക്കെ[a], അദ്ദേഹം അവരോട് ഇങ്ങനെ കല്പിച്ചു: “യെരൂശലേം വിട്ടുപോകരുത്; പകരം, നിങ്ങൾ എന്നിൽനിന്നു കേട്ട പിതാവിന്റെ വാഗ്ദാനത്തിനായി കാത്തിരിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരോടൊപ്പം കൂടിയിരിക്കുമ്പോൾ”; ചിലർ ഈ പ്രയോഗത്തെ “അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുമ്പോൾ” എന്നും മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναλιζόμενος
  choice: അവരോടൊപ്പം കഴിയുമ്പോൾ
  rationale: പദത്തിന്റെ കൃത്യമായ അർഥം വിവാദവിധേയമാണെങ്കിലും, യേശു അപ്പൊസ്തലന്മാരോടൊപ്പം ഉണ്ടായിരുന്നുവെന്ന സന്ദർഭസാരം ഈ സ്വാഭാവിക പ്രയോഗം വ്യക്തമാക്കുന്നു. കൂടിവരികയോ ഭക്ഷണം കഴിക്കുകയോ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρήγγειλεν
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ഗ്രീക്ക് ക്രിയയുടെ ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: യെരൂശലേം വിട്ടുപോകരുത്
  rationale: നഗരത്തിൽനിന്നു പുറപ്പെടരുത് എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: περιμένειν
  choice: കാത്തിരിക്കുക
  rationale: പ്രതീക്ഷയോടെ കാത്തിരിക്കുക എന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: പിതാവിന്റെ വാഗ്ദാനം
  rationale: ജനിറ്റീവ് ഘടന നേരിട്ട് നിലനിർത്തുകയും വാഗ്ദാനം ചെയ്തതു പിതാവാണോ, അത് പിതാവിന്റെ പദ്ധതിയിലുള്ളതാണോ എന്ന വ്യാകരണപരമായ വിശാലത അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἣν ἠκούσατέ μου
  choice: നിങ്ങൾ എന്നിൽനിന്നു കേട്ട
  rationale: ἀκούω-യോടൊപ്പമുള്ള ജനിറ്റീവ് സർവനാമത്തെ ‘എന്നിൽനിന്നു കേട്ട’ എന്നു സംക്ഷിപ്തമായും വിശ്വസ്തമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റശേഷമുള്ള യേശുവിന്റെ പ്രവർത്തനവുമായി ബന്ധപ്പെട്ട συναλιζόμενος എന്ന പദത്തിന്റെ അർഥം
  choice: യേശു ശിഷ്യന്മാരോടൊപ്പം ഉണ്ടായിരുന്നതിനെ പൊതുവായി സൂചിപ്പിക്കുന്ന ‘അവരോടൊപ്പം കഴിയുമ്പോൾ’
  alternative: ‘അവരോടൊപ്പം കൂടിയിരിക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘അവരോടൊപ്പം ഭക്ഷണം കഴിക്കുമ്പോൾ’
  rationale: മൂലപദം ഒരു പ്രത്യേക പ്രവർത്തനത്തെ സംശയാതീതമായി നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വിവാദമുള്ള സൂക്ഷ്മാർഥത്തെ മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കാതെ, പാഠസന്ദർഭത്തിലെ ഉറപ്പായ ആശയം നൽകുകയും മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷയാണ് ഉപയോഗിച്ചത്. അധികാരപൂർവമായ കല്പനയുടെ ശക്തി നിലനിർത്തിയിട്ടുണ്ട്; വിവാദമുള്ള പദാർഥം മുഖ്യവാചകത്തിൽ അമിതമായി നിർണയിക്കാതെ അടിക്കുറിപ്പിലൂടെ സുതാര്യമാക്കി.
