id: ACT.1.13
reference: Acts 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: ml
  text: 'അവർ അകത്തു കടന്നപ്പോൾ, താമസിച്ചിരുന്ന മുകളിലത്തെ നിലയിലെ മുറിയിലേക്കു കയറിച്ചെന്നു. അവർ ഇവരായിരുന്നു: പത്രോസ്, യോഹന്നാൻ, യാക്കോബ്, അന്ത്രെയോസ്; ഫിലിപ്പോസ്, തോമസ്; ബർത്തലോമായി, മത്തായി; അൽഫായോസിന്റെ മകനായ യാക്കോബ്; സെലോട്ടനായ ശിമോൻ; യാക്കോബിന്റെ മകനായ യൂദാ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാക്കോബിന്റെ സഹോദരനായ യൂദാ.’ ഗ്രീക്കിൽ ‘യാക്കോബിന്റെ യൂദാ’ എന്ന ബന്ധസൂചന മാത്രമാണുള്ളത്; കൃത്യമായ ബന്ധം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: അവർ അകത്തു കടന്നപ്പോൾ
  rationale: ക്രിയയ്ക്ക് ഗ്രീക്കിൽ വ്യക്തമായ കർമമില്ലാത്തതിനാൽ ഒരു സ്ഥലനാമം ചേർക്കാതെ, മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവേശനം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: മുകളിലത്തെ നിലയിലെ മുറിയിലേക്കു കയറിച്ചെന്നു
  rationale: ἀνέβησαν സൂചിപ്പിക്കുന്ന മുകളിലേക്കുള്ള ചലനവും ὑπερῷον സൂചിപ്പിക്കുന്ന മുകളിലത്തെ നിലയിലെ മുറിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: οὗ ἦσαν καταμένοντες
  choice: താമസിച്ചിരുന്ന
  rationale: തുടർന്നുള്ള താമസത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰάκωβος Ἁλφαίου
  choice: അൽഫായോസിന്റെ മകനായ യാക്കോബ്
  rationale: പട്ടികയിലെ തിരിച്ചറിയൽരീതിയനുസരിച്ച് ബന്ധസൂചക ഷഷ്ഠിയെ സാധ്യതയേറിയ പിതൃനാമമായി വ്യക്തമാക്കുന്നു.
- source_word: Σίμων ὁ ζηλωτὴς
  choice: തീക്ഷ്ണവാദിയായ ശിമോൻ
  rationale: ζηλωτής എന്ന തിരിച്ചറിയൽവിശേഷണം ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; മറ്റൊരു സുവിശേഷത്തിലെ വ്യത്യസ്ത വിശേഷണം ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: Ἰούδας Ἰακώβου
  choice: യാക്കോബിന്റെ മകനായ യൂദാ
  rationale: പുരുഷന്മാരുടെ പേരുപട്ടികയിൽ ഈ ഷഷ്ഠി പിതൃനാമം സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യത; എന്നാൽ ഗ്രീക്ക് ബന്ധം വ്യക്തമായി പറയാത്തതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἰούδας Ἰακώβου എന്നതിലെ ബന്ധം
  choice: യാക്കോബിന്റെ മകനായ യൂദാ
  alternative: യാക്കോബിന്റെ സഹോദരനായ യൂദാ
  rationale: ഗ്രീക്ക് മൂലത്തിൽ ‘മകൻ’ എന്നോ ‘സഹോദരൻ’ എന്നോ വ്യക്തമാക്കിയിട്ടില്ല. പട്ടികയുടെ സന്ദർഭത്തിൽ പിതൃനാമമാണ് കൂടുതൽ സാധ്യതയുള്ളത്; യഥാർഥമായ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായെങ്കിലും ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. പേരുകളുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ബന്ധകങ്ങളുടെ ആവർത്തനം അസ്വാഭാവികമായി പകർത്താതെ പട്ടികയുടെ ഘടന അർധവിരാമങ്ങളിലൂടെ നിലനിർത്തി.
