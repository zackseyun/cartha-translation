id: ACT.1.24
reference: Acts 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: ml
  text: 'അവർ പ്രാർഥിച്ചശേഷം പറഞ്ഞു: “എല്ലാവരുടെയും ഹൃദയങ്ങൾ അറിയുന്ന കർത്താവേ[b], ഈ രണ്ടുപേരിൽ അങ്ങ് തിരഞ്ഞെടുത്ത ഒരാളെ കാണിച്ചുതരണമേ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാണിച്ചുതരണമേ” എന്നതിന് “നിയമിക്കണമേ” എന്നോ “സൂചിപ്പിക്കണമേ” എന്നോ പരിഭാഷപ്പെടുത്താം; ഈ ക്രിയയ്ക്ക് വെളിപ്പെടുത്തുക എന്നും പരസ്യമായി നിയോഗിക്കുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “കർത്താവേ” എന്ന സംബോധന പൊതുവായി ദൈവത്തെയോ പ്രത്യേകിച്ച് യേശുവിനെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം; ഗ്രീക്ക് പാഠം ആരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: പ്രാർഥിച്ചശേഷം
  rationale: പ്രധാന ക്രിയയ്ക്കുമുമ്പുള്ള aorist participle മുൻകൃത്യത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രാർഥിച്ചശേഷം’ ആ ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Σὺ κύριε
  choice: കർത്താവേ … അങ്ങ്
  rationale: κύριε എന്ന സംബോധനയ്ക്ക് ‘കർത്താവേ’ എന്നും ഊന്നലുള്ള Σὺയ്ക്ക് ആദരസൂചകമായ ‘അങ്ങ്’ എന്നും നൽകി; മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ സർവനാമം പിന്നീട് വരുന്നു.
- source_word: καρδιογνῶστα πάντων
  choice: എല്ലാവരുടെയും ഹൃദയം അറിയുന്ന
  rationale: καρδιογνώστης എന്ന ഏകവചന സംബോധനപ്പദത്തിന്റെ അർഥവും πάντων എന്നതിന്റെ വ്യാപ്തിയും വ്യക്തവും സ്വാഭാവികവുമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀνάδειξον
  choice: കാണിച്ചുതരണമേ
  rationale: ദൈവം മുമ്പേ തിരഞ്ഞെടുത്തത് ആരെന്നു വെളിപ്പെടുത്തണമെന്ന അപേക്ഷയാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്; ഔപചാരിക നിയമനം എന്ന അർഥം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὃν ἐξελέξω
  choice: അങ്ങ് തിരഞ്ഞെടുത്ത ഒരാളെ
  rationale: കർത്താവിന്റെ തിരഞ്ഞെടുപ്പ് അപേക്ഷയ്ക്കുമുമ്പേ നടന്നതായി വാക്യം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: ഈ രണ്ടുപേരിൽ … ഒരാളെ
  rationale: രണ്ടു വ്യക്തികളിൽനിന്നുള്ള ഒരാളെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച വ്യക്തിവാചക മലയാളം ഉപയോഗിച്ചെങ്കിലും ‘പുരുഷന്മാർ’ എന്ന അധികവിവരം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: പ്രാർഥനയിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിഭാഷയിൽ ‘കർത്താവേ’ എന്നു മാത്രം നിലനിർത്തി, പരാമർശം ആരിലേക്കാണെന്ന് നിർണ്ണയിക്കാതിരിക്കുന്നു.
  alternative: പൊതുവായി ദൈവത്തോടുള്ള സംബോധനമെന്നോ പ്രത്യേകിച്ച് ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടുള്ള സംബോധനമെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം κύριε എന്നു മാത്രമാണ് പറയുന്നത്; പിതാവിനെയോ യേശുവിനെയോ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ യഥാർഥ വ്യാഖ്യാനസാധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും പൊതുവായ വായനക്കാർക്ക് സുഗമവുമായ മലയാളം. പ്രാർഥനാസംബോധനയിൽ ‘അങ്ങ്’ ഉപയോഗിച്ചു; അമിതമായ പുരാതന ശൈലിയും വിഭാഗീയ പദപ്രയോഗവും ഒഴിവാക്കി. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
