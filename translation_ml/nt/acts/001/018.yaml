id: ACT.1.18
reference: Acts 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: ml
  text: അങ്ങനെ, ഈ മനുഷ്യൻ അനീതിയുടെ കൂലികൊണ്ട്[a] ഒരു വയൽ സ്വന്തമാക്കി[c]. തലകുത്തി വീണപ്പോൾ[b] അവൻ നടുവേ പിളർന്നുപോയി; അവന്റെ കുടലെല്ലാം പുറത്തേക്ക് ചിതറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദുഷ്ടതയുടെ പ്രതിഫലംകൊണ്ട്.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അനീതിയുടെ കൂലിയിൽനിന്ന്’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കമിഴ്ന്ന നിലയിലായപ്പോൾ’ / ‘മുഖംകുത്തി വീണപ്പോൾ.’ ഈ പ്രയോഗം തലമുൻപായുള്ള വീഴ്ചയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘സ്വന്തമാക്കി’ എന്നാണ്. യൂദാസ് നേരിട്ട് വയൽ വാങ്ങിയെന്നു നിർബന്ധമില്ല; അവനുമായി ബന്ധപ്പെട്ട പണംമൂലം അത് അവന്റെതായി കണക്കാക്കപ്പെട്ടതും ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: അങ്ങനെ, ഈ മനുഷ്യൻ
  rationale: Οὗτος യൂദാസിനെ സൂചിപ്പിക്കുന്നു; μέν οὖν മുൻവിവരണത്തിന്റെ തുടർച്ചയും നിഗമനസ്വഭാവവും അടയാളപ്പെടുത്തുന്നു. ‘അങ്ങനെ’ ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκτήσατο
  choice: സ്വന്തമാക്കി
  rationale: κτάομαι എന്നത് നേടുക, കൈവശമാക്കുക എന്ന വിശാല അർഥമുള്ളതാണ്. ‘വാങ്ങി’ എന്നു പറഞ്ഞ് നേരിട്ടുള്ള ഇടപാട് നിർബന്ധമാക്കാതെ, വയൽ അവനുമായി ബന്ധപ്പെട്ട പണംമൂലം അവന്റെതായി കണക്കാക്കപ്പെട്ടിരിക്കാമെന്ന സാധ്യത നിലനിർത്തുന്നു.
- source_word: χωρίον
  choice: ഒരു വയൽ
  rationale: χωρίον ഇവിടെ വയൽ അഥവാ ഭൂമിയുടെ ഒരു ഭാഗം എന്നർഥം നൽകുന്നു; സന്ദർഭത്തിൽ ‘വയൽ’ ലളിതവും വ്യക്തവുമാണ്.
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: അനീതിയുടെ കൂലികൊണ്ട്
  rationale: μισθός കൂലി/പ്രതിഫലം എന്നും ἀδικία അനീതി/ദുഷ്പ്രവൃത്തി എന്നും അർഥപ്പെടുന്നു. മലയാളത്തിൽ ഉപാധി വ്യക്തമാക്കാൻ ‘കൊണ്ട്’ സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ ധാർമികമായി ശക്തമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: πρηνὴς γενόμενος
  choice: തലകുത്തി വീണപ്പോൾ
  rationale: πρηνής തലമുൻപായി അഥവാ കമിഴ്ന്ന നിലയെ സൂചിപ്പിക്കുന്നു. ‘തലകുത്തി വീണപ്പോൾ’ സാധ്യതയേറിയ സംഭവാർഥം സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐλάκησεν μέσος
  choice: അവൻ നടുവേ പിളർന്നുപോയി
  rationale: λακάω പൊട്ടിത്തുറക്കുക/പിളരുക എന്നും μέσος ഇവിടെ നടുവിൽ എന്നും സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ സംഭവത്തിന്റെ തീവ്രതയും ശരീരത്തിന്റെ നടുഭാഗത്തെ സൂചനയും വ്യക്തമാക്കുന്നു.
- source_word: ἐξεχύθη
  choice: പുറത്തേക്ക് ചിതറി
  rationale: ἐκχέω പുറത്തേക്ക് ഒഴുകുക അഥവാ ചൊരിയപ്പെടുക എന്നർഥം നൽകുന്നു. ആന്തരാവയവങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘പുറത്തേക്ക് ചിതറി’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πάντα τὰ σπλάγχνα αὐτοῦ
  choice: അവന്റെ കുടലെല്ലാം
  rationale: σπλάγχνα ഉള്ളവയവങ്ങൾ/കുടൽഭാഗങ്ങൾ എന്നർഥമുള്ളതാണ്. ‘കുടലെല്ലാം’ സാധാരണ വായനക്കാർക്ക് ദൃശ്യവും നേരിട്ടുമുള്ള ആധുനിക മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: വയൽ സ്വന്തമാക്കിയതിൽ യൂദാസിന്റെ പങ്ക്
  choice: ἐκτήσατο എന്നത് ‘സ്വന്തമാക്കി’ എന്നു പരിഭാഷപ്പെടുത്തി; നേരിട്ട് ‘വാങ്ങി’ എന്ന് പറഞ്ഞില്ല.
  alternative: യൂദാസ് തന്നെ വയൽ വാങ്ങി; അല്ലെങ്കിൽ അവന്റെ പണംകൊണ്ട്/അവന്റെ പേരിൽ വയൽ വാങ്ങപ്പെട്ടു.
  rationale: ഗ്രീക്ക് പദം കൈവശമാക്കൽ വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ നടപടിക്രമം നിർണ്ണയിക്കുന്നില്ല. മത്തായി 27:5–8-നോടുള്ള ബന്ധം പരിഭാഷയിൽ തന്നെ ഒത്തുതീർക്കാതെ മൂലപാഠത്തിലെ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. അതിപുരാതന പദങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിന്റെ ദൃശ്യതയും അവ്യക്തതയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
