id: ACT.1.12
reference: Acts 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ὑπέστρεψαν εἰς Ἰερουσαλὴμ ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος, ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ σαββάτου ἔχον ὁδόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: ml
  text: അപ്പോൾ അവർ ഒലിവുമല എന്നു വിളിക്കപ്പെടുന്ന മലയിൽനിന്ന്[a] യെരൂശലേമിലേക്കു മടങ്ങി. അത് യെരൂശലേമിനു സമീപത്തുള്ളതും ഒരു ശബ്ബത്ത് ദിവസയാത്രയുടെ ദൂരത്തിലുള്ളതുമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “ഒലിവുകളുടെ മല” എന്നും.
    reason: lexical_alternative
  - marker: b
    text: “ശബ്ബത്ത് ദിവസയാത്ര” എന്നത് യഹൂദ ആചാരത്തിൽ ശബ്ബത്തിൽ യാത്ര ചെയ്യാൻ അനുവദിക്കപ്പെട്ടിരുന്ന പതിവു ദൂരമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടാകുന്ന സംഭവത്തെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകമാണ്.
- source_word: ὑπέστρεψαν
  choice: അവർ മടങ്ങി
  rationale: സംഭവവിവരണത്തിൽ ὑποστρέφω എന്ന ക്രിയയുടെ അർഥം ലളിതമായും കൃത്യമായും നൽകുന്നു.
- source_word: εἰς Ἰερουσαλὴμ
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς ഇവിടെ ഒരു സ്ഥലത്തേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ ὄρους
  choice: മലയിൽനിന്ന്
  rationale: ἀπό പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്നു; ὄρος എന്നതിന് സന്ദർഭോചിതമായ സാധാരണ മലയാളപദം ‘മല’ ആണ്.
- source_word: τοῦ καλουμένου Ἐλαιῶνος
  choice: ഒലിവുമല എന്നു വിളിക്കപ്പെടുന്ന
  rationale: സ്ഥലപ്പേരിന്റെ പരിചിതമായ മലയാളരൂപം ഉപയോഗിച്ചുകൊണ്ട് ‘വിളിക്കപ്പെടുന്ന’ എന്ന മൂലപാഠഘടകം നിലനിർത്തുന്നു; ഒലിവുകളുമായി ബന്ധപ്പെട്ട പേരിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: ആ മല യെരൂശലേമിന് അടുത്ത്
  rationale: ബന്ധവാക്യത്തെ സ്വാഭാവികമായ മലയാളവാക്യമായി വിഭജിച്ചിട്ടും സ്ഥലത്തിന്റെ സമീപ്യം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: σαββάτου ἔχον ὁδόν
  choice: ഒരു ശബ്ബത്ത് ദിവസത്തെ യാത്രാദൂരത്തിലായിരുന്നു
  rationale: യഹൂദസാംസ്കാരികമായ ദൂരപ്രയോഗം വിശദീകരിച്ചു മാറ്റാതെ, മലയാളത്തിൽ വായിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: σαββάτου ἔχον ὁδόν എന്ന യഹൂദ ദൂരപ്രയോഗം
  choice: ഒരു ശബ്ബത്ത് ദിവസത്തെ യാത്രാദൂരത്തിലായിരുന്നു
  alternative: ഒരു ശബ്ബത്ത് ദിവസത്തെ യാത്ര ഉള്ളതായിരുന്നു
  rationale: ഇത് പ്രധാനമായും സാംസ്കാരിക-ശാബ്ദിക പ്രയോഗമാണ്. തിരഞ്ഞെടുത്ത രൂപം യഹൂദ പശ്ചാത്തലം നിലനിർത്തുകയും അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. നീണ്ട ഗ്രീക്ക് ബന്ധവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; അർഥബന്ധം ‘ആ മല’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി.
