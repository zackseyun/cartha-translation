  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: ml
  text: ഈ ശുശ്രൂഷയുടെയും അപ്പൊസ്തലസ്ഥാനത്തിന്റെയും സ്ഥാനം ഏറ്റെടുക്കാൻ—അതിൽനിന്ന് യൂദാസ് വഴിമാറി[a] സ്വന്തം സ്ഥലത്തേക്കു പോകാൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിട്ടുപോയി’ അല്ലെങ്കിൽ ‘വീണുപോയി.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ശുശ്രൂഷയിലും അപ്പൊസ്തലസ്ഥാനത്തിലുംനിന്നുള്ള വ്യതിചലനമോ പിന്മാറ്റമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വന്തം സ്ഥലം’ എന്നത് യൂദാസിനുള്ള സ്ഥലത്തെ പൊതുവായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ അവനു യോജിച്ച ന്യായവിധിയുടെ സ്ഥലത്തെ കൂടുതൽ ശക്തമായി സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν
  choice: ഏറ്റെടുക്കാൻ
  rationale: ഒഴിഞ്ഞുകിടക്കുന്ന ചുമതല വഹിക്കുന്നതിനെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘സ്വീകരിക്കുക’ എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു.
- source_word: τὸν τόπον
  choice: സ്ഥാനം
  rationale: ഇവിടെ τόπος ഒരു ചുമതലയെയോ പദവിയെയോ സൂചിപ്പിക്കുന്ന രൂപകാലങ്കാരപ്രയോഗമാണ്. മലയാളത്തിൽ ‘സ്ഥാനം ഏറ്റെടുക്കുക’ സ്വാഭാവികമാണ്; വാക്യാവസാനത്തിലെ ‘സ്ഥലം’ എന്ന ഭൗതികമോ വിധിസൂചകമോ ആയ പ്രയോഗവുമായി ആശയപരമായ വൈരുധ്യവും നിലനിൽക്കുന്നു.
- source_word: τῆς διακονίας ταύτης
  choice: ഈ ശുശ്രൂഷയുടെ
  rationale: διακονία ഏൽപ്പിക്കപ്പെട്ട സേവനത്തെ സൂചിപ്പിക്കുന്നു; സഭാപരമായ ഈ സന്ദർഭത്തിൽ ‘ശുശ്രൂഷ’ കൃത്യവും പരിചിതവുമാണ്.
- source_word: ἀποστολῆς
  choice: അപ്പൊസ്തലസ്ഥാനം
  rationale: ഇവിടെ പൊതുവായ ദൗത്യമല്ല, അപ്പൊസ്തലനായുള്ള നിയോഗവും സ്ഥാനവുമാണ് ഉദ്ദേശിക്കുന്നത്. ‘അപ്പൊസ്തലസ്ഥാനം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: ἀφ’ ἧς
  choice: അതിൽനിന്ന്
  rationale: ബന്ധസർവനാമം മുമ്പുള്ള ശുശ്രൂഷയെയും അപ്പൊസ്തലസ്ഥാനത്തെയും സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വേർപാടിന്റെ ആശയം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παρέβη
  choice: വഴിമാറി
  rationale: നിയോഗിക്കപ്പെട്ട ശുശ്രൂഷയിൽനിന്നുള്ള വ്യതിചലനമോ പിന്മാറ്റമോ അറിയിക്കുന്നു; ‘ലംഘിച്ചു’ എന്ന കൂടുതൽ നിയമപരമായ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: πορευθῆναι
  choice: പോയി
  rationale: πορεύομαι എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള ചലനാർഥം നൽകുന്നു.
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: സ്വന്തമായ സ്ഥലത്തേക്കു
  rationale: ഗ്രീക്കിലെ ഹ്രസ്വവും സൂചനാഭരിതവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു; അത് കല്ലറയെയോ ന്യായവിധിയുടെ സ്ഥലത്തെയോ മറ്റൊരു യോജിച്ച ലക്ഷ്യത്തെയോ നിർബന്ധമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: യൂദാസിന്റെ ‘സ്വന്തമായ സ്ഥലം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘സ്വന്തമായ സ്ഥലം’ എന്ന അവ്യക്തത നിലനിർത്തി.
  alternative: മരണം/കല്ലറ, നരകം/ന്യായവിധിയുടെ സ്ഥലം, അല്ലെങ്കിൽ യൂദാസിനു യോജിച്ച സ്ഥലം എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: εἰς τὸν τόπον τὸν ἴδιον ലക്ഷ്യസ്ഥാനം വിശദീകരിക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും പരിഭാഷയിൽ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: παρέβη എന്നത് കുറ്റലംഘനമോ പിന്മാറ്റമോ
  choice: ശുശ്രൂഷയിൽനിന്ന് ‘വഴിമാറി’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ലംഘിച്ചു,’ ‘വിട്ടുപോയി,’ അല്ലെങ്കിൽ ‘വീണുപോയി.’
  rationale: സന്ദർഭം അപ്പൊസ്തലശുശ്രൂഷയിൽനിന്നുള്ള വ്യതിചലനത്തെ മുൻനിർത്തുന്നു. ‘വഴിമാറി’ കുറ്റത്തിന്റെ ഗൗരവം ഇല്ലാതാക്കാതെയും ഒരു പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രപദം ചുമത്താതെയും ഈ അർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷ,’ ‘അപ്പൊസ്തലസ്ഥാനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. മൂലപാഠത്തിലെ രണ്ട് ‘സ്ഥലം/സ്ഥാനം’ പ്രയോഗങ്ങളുടെ ബന്ധം മലയാളത്തിലെ അർഥവ്യത്യാസം മാനിച്ചുകൊണ്ട് പരമാവധി സംരക്ഷിച്ചു.
