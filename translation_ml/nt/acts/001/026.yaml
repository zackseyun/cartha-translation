source:
  edition: SBLGNT
  text: καὶ ἔδωκαν κλήρους ⸀αὐτοῖς, καὶ ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν, καὶ συγκατεψηφίσθη μετὰ τῶν ἕνδεκα ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/026.yaml
  text: And they cast lots for them[a], and the lot fell to Matthias[b], and he was counted with the eleven apostles.
translation:
  language: ml
  text: അവർ അവർക്കായി നറുക്കിട്ടു[a]; നറുക്ക് മത്തിയാസിനു വീണു. അദ്ദേഹം പതിനൊന്ന് അപ്പൊസ്തലന്മാരോടൊപ്പം എണ്ണപ്പെടുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവർ അവർക്കു നറുക്കുകൾ നൽകി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അദ്ദേഹം പതിനൊന്ന് അപ്പൊസ്തലന്മാരോടൊപ്പം കണക്കാക്കപ്പെട്ടു”; അല്ലെങ്കിൽ, “പതിനൊന്ന് അപ്പൊസ്തലന്മാരോടൊപ്പം ചേർക്കപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: അവർ അവർക്കുവേണ്ടി നറുക്കിട്ടു
  rationale: പദാനുപദമായി ‘അവർ അവർക്കു നറുക്കുകൾ നൽകി’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ സ്ഥാനാർഥികൾക്കിടയിൽ നറുക്കിലൂടെ തിരഞ്ഞെടുപ്പ് നടത്തിയതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗമാണിത്. ‘നറുക്കിട്ടു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും നടപടിയുടെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
- source_word: κλήρους / ὁ κλῆρος
  choice: നറുക്ക് / നറുക്കുകൾ
  rationale: ഇവിടെ κλῆρος ഓഹരിയെയോ അവകാശവിഹിതത്തെയോ അല്ല, തിരഞ്ഞെടുപ്പിനായി ഉപയോഗിച്ച നറുക്കിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: നറുക്ക് മത്തിയാസിനുവീണു
  rationale: ഗ്രീക്കിലെ ‘നറുക്ക് വീണു’ എന്ന ദൃശ്യപ്രയോഗം നിലനിർത്തിക്കൊണ്ട്, നറുക്കിന്റെ ഫലം മത്തിയാസിനെ തിരഞ്ഞെടുത്തുവെന്ന് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: Μαθθίαν
  choice: മത്തിയാസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: συγκατεψηφίσθη
  choice: എണ്ണപ്പെടുകയും ചെയ്തു
  rationale: ഒരു സംഘത്തോടൊപ്പം കണക്കാക്കപ്പെട്ടു എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു. ‘ചേർക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറവാണ്.
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: പതിനൊന്ന് അപ്പൊസ്തലന്മാരോടൊപ്പം
  rationale: μετά + genitive എന്നതിന്റെ ‘ഒപ്പം/കൂടെ’ എന്ന അർഥം നേരിട്ട് നൽകുകയും നിലവിലുണ്ടായിരുന്ന പതിനൊന്നുപേരോടൊപ്പം മത്തിയാസ് കണക്കാക്കപ്പെട്ടുവെന്ന വിവരണം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: συγκατεψηφίσθη എന്ന പദം ദൈവിക നിയമനത്തെക്കുറിച്ച് വിവരണത്തിൽ പറയുന്നതിലധികം സൂചിപ്പിക്കുന്നവിധം പരിഭാഷപ്പെടുത്തണമോ എന്നത്
  choice: പതിനൊന്ന് അപ്പൊസ്തലന്മാരോടൊപ്പം എണ്ണപ്പെടുകയും ചെയ്തു
  alternative: പതിനൊന്ന് അപ്പൊസ്തലന്മാരോടൊപ്പം ചേർക്കപ്പെടുകയും ചെയ്തു
  rationale: നറുക്ക് മത്തിയാസിനുവീണശേഷം അദ്ദേഹം ആ സംഘത്തോടൊപ്പം കണക്കാക്കപ്പെട്ടുവെന്നാണ് വാക്യം പറയുന്നത്. ‘എണ്ണപ്പെട്ടു’ എന്ന പരിഭാഷ സഭാശാസ്ത്രപരമോ കൂദാശാപരമോ ആയ അധിക അവകാശവാദം ചേർക്കാതെ ഗ്രീക്ക് പദത്തിന്റെ പരിധി കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘നറുക്കിട്ടു’ എന്ന പൊതുവായി മനസ്സിലാകുന്ന പ്രയോഗവും, വ്യാഖ്യാനഭാരം കുറഞ്ഞ ‘എണ്ണപ്പെട്ടു’ എന്ന രൂപവും ഉപയോഗിച്ചു; ഗ്രീക്കിലെ വാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി മൂന്നു ഹ്രസ്വ ഘടകങ്ങളാക്കി.
