revisions:
- from: ഇതു പറഞ്ഞശേഷം, അവർ നോക്കിക്കൊണ്ടിരിക്കെ, അവൻ ഉയർത്തപ്പെട്ടു[a]; ഒരു മേഘം[b] അവനെ അവരുടെ കാഴ്ചയിൽനിന്ന് എടുത്തുകൊണ്ടുപോയി[c].
  to: ഇവ പറഞ്ഞശേഷം, അവർ നോക്കിക്കൊണ്ടിരിക്കെ, അവൻ ഉയർത്തപ്പെട്ടു[a]; ഒരു മേഘം[b] അവനെ അവരുടെ കാഴ്ചയിൽനിന്ന് എടുത്തുകൊണ്ടുപോയി[c].
