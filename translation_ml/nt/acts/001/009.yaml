id: ACT.1.9
reference: Acts 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: ml
  text: ഇവ പറഞ്ഞശേഷം, അവർ നോക്കിക്കൊണ്ടിരിക്കെ, അവൻ ഉയർത്തപ്പെട്ടു[a]; ഒരു മേഘം[b] അവനെ അവരുടെ കാഴ്ചയിൽനിന്ന് എടുത്തുകൊണ്ടുപോയി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവൻ എടുത്തുയർത്തപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: വേദപുസ്തകത്തിലെ ചില സന്ദർഭങ്ങളിൽ മേഘം ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു. ഇവിടെ അത്തരം ഒരു അനുരണനം ഉണ്ടായേക്കാമെങ്കിലും ഈ വാക്യം അത് വ്യക്തമായി പറയുന്നില്ല.
    reason: cross_reference
  - marker: c
    text: അഥവാ, ‘ഒരു മേഘം അവനെ അവരുടെ കാഴ്ചയിൽനിന്ന് ഏറ്റുവാങ്ങി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: ഇതു പറഞ്ഞശേഷം
  rationale: അയോറിസ്റ്റ് കൃതന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ക്രമം വ്യക്തമാക്കുന്നു; καὶ-യുടെ ലളിതമായ ആഖ്യാനബന്ധം പ്രത്യേകം ‘പിന്നെ’ എന്നു ശക്തിപ്പെടുത്തേണ്ടതില്ല.
- source_word: βλεπόντων αὐτῶν
  choice: അവർ നോക്കിക്കൊണ്ടിരിക്കെ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ദൃക്സാക്ഷിത്വത്തെ സൂചിപ്പിക്കുന്ന genitive absolute-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐπήρθη
  choice: അവൻ ഉയർത്തപ്പെട്ടു
  rationale: പ്രവൃത്തികർത്താവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് കർമണിപ്രയോഗവും ദൃശ്യമായ മേലോട്ടുള്ള ചലനവും സംരക്ഷിക്കുന്നു.
- source_word: νεφέλη
  choice: ഒരു മേഘം
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ഏകവചന നാമത്തിന് നേരിട്ടുള്ള പരിഭാഷ; മുഖ്യവാക്യത്തിൽ ദൈവസാന്നിധ്യമെന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ὑπέλαβεν αὐτὸν
  choice: അവനെ … എടുത്തുകൊണ്ടുപോയി
  rationale: ὑπολαμβάνω എന്ന ക്രിയയ്ക്ക് ഇവിടെ ‘ഏറ്റുവാങ്ങുക/എടുത്തുകൊള്ളുക’ എന്ന അർഥസാധ്യതയുണ്ട്. മേഘം അവനെ കാഴ്ചയിൽനിന്ന് നീക്കിയെന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: അവരുടെ കാഴ്ചയിൽനിന്ന്
  rationale: ‘അവരുടെ കണ്ണുകളിൽനിന്ന്’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ ദൃശ്യപരിധിയിൽനിന്ന് മറഞ്ഞുപോയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἐπήρθη എന്നതിന് പരമ്പരാഗതമായ സ്വർഗാരോഹണ പദപ്രയോഗം ഉപയോഗിക്കണമോ
  choice: അവൻ ഉയർത്തപ്പെട്ടു
  alternative: അവൻ എടുത്തുകൊള്ളപ്പെട്ടു
  rationale: ഗ്രീക്ക് പദത്തിന്റെ കർമണിരൂപവും മേലോട്ടുള്ള ചലനവും നിലനിർത്തുന്നു; വാക്യം നേരിട്ട് പറയുന്നതിലധികം സിദ്ധാന്തപരമായ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: νεφέλη ദൈവസാന്നിധ്യത്തിന്റെ മേഘമാണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: ഒരു മേഘം
  alternative: ദൈവസാന്നിധ്യത്തിന്റെ മേഘം
  rationale: വേദപുസ്തകത്തിലെ മറ്റു സന്ദർഭങ്ങൾ അത്തരം അനുരണനം നൽകാമെങ്കിലും ഈ വാക്യം അത് തുറന്നുപറയുന്നില്ല. അതിനാൽ സാധ്യത അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
- issue: ὑπέλαβεν എന്ന ക്രിയയിലെ ‘എടുത്തുകൊള്ളുക’ എന്നും ‘ഏറ്റുവാങ്ങുക’ എന്നും ഉള്ള അർഥസാധ്യത
  choice: എടുത്തുകൊണ്ടുപോയി
  alternative: ഏറ്റുവാങ്ങി
  rationale: സംഭവഫലം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു; അതേസമയം ‘ഏറ്റുവാങ്ങി’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ഉയർത്തപ്പെട്ടു’ എന്ന കർമണിരൂപം മൂലപാഠത്തിന്റെ തുറന്ന നിലപാട് സംരക്ഷിക്കുന്നു. ‘എടുത്തുകൊണ്ടുപോയി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; അതിലെ അർഥവൈവിധ്യം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
