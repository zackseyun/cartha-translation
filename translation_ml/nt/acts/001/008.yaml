id: ACT.1.8
reference: Acts 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: ml
  text: എന്നാൽ പരിശുദ്ധാത്മാവ് നിങ്ങളുടെമേൽ വരുമ്പോൾ നിങ്ങൾ ശക്തി പ്രാപിക്കും; യെരൂശലേമിലും യെഹൂദ്യ മുഴുവനിലും ശമര്യയിലും ഭൂമിയുടെ അറ്റംവരെയും[a] നിങ്ങൾ എന്റെ സാക്ഷികളായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭൂമിയുടെ അറ്റങ്ങൾവരെയും.” ഗ്രീക്ക് പ്രയോഗം ഏകവചനത്തിലാണ് (“ഭൂമിയുടെ അറ്റംവരെയും”); എന്നാൽ ഭൂമിയുടെ ഏറ്റവും വിദൂരമായ പരിധിയെ സൂചിപ്പിക്കുന്ന ഒരു ശൈലീപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിഷയത്തോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: λήμψεσθε δύναμιν
  choice: നിങ്ങൾ ശക്തി പ്രാപിക്കും
  rationale: ലഭിക്കുന്ന ദൈവിക പ്രാപ്തിയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘പ്രാപിക്കും’ എന്നത് അത് സ്വന്തമായി കൈക്കലാക്കുന്നതാണെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: പരിശുദ്ധാത്മാവ് നിങ്ങളുടെമേൽ വരുമ്പോൾ
  rationale: ഗ്രീക്കിലെ genitive absolute-നെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി പരിഭാഷപ്പെടുത്തി; ἐπί സൂചിപ്പിക്കുന്ന ‘മേൽ വരുക’ എന്ന ചലനഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവ്
  rationale: വ്യക്തിപരമായ ദൈവിക പരാമർശത്തിന് മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ വ്യാപകവും സമകാലികവുമായ രൂപം.
- source_word: ἔσεσθέ μου μάρτυρες
  choice: നിങ്ങൾ ... എന്റെ സാക്ഷികളായിരിക്കും
  rationale: μου എന്ന ബന്ധസൂചക സർവനാമവും μάρτυρες എന്നതിന്റെ സാക്ഷ്യം വഹിക്കുന്നവർ എന്ന പ്രാഥമിക അർത്ഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ
  choice: യെരൂശലേമിലും യെഹൂദ്യയിൽ എല്ലായിടത്തും ശമര്യയിലും
  rationale: സ്ഥലങ്ങളുടെ ക്രമവും വ്യാപ്തിയും നിലനിർത്തുന്നു; πάσῃ എന്നത് ‘എല്ലായിടത്തും’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: ഭൂമിയുടെ അറ്റംവരെയും
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപം അടുത്തായി നിലനിർത്തിക്കൊണ്ട് ഭൂമിയുടെ ഏറ്റവും വിദൂരമായ പരിധിവരെയുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിലെ വ്യക്തിപരമായ ദൈവിക പരാമർശം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധമായ ആത്മാവ്
  rationale: നിശ്ചയാർഥക ഘടനയും സന്ദർഭവും വ്യക്തിപരമായ ദൈവിക പരാമർശത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലുപരി ത്രിത്വശാസ്ത്ര വിശദീകരണം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: സാക്ഷ്യദൗത്യത്തിന്റെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി
  choice: യെരൂശലേമിൽനിന്ന് യെഹൂദ്യയും ശമര്യയും കടന്ന് ഭൂമിയുടെ അറ്റംവരെ വ്യാപിക്കുന്ന യഥാർഥ സ്ഥലക്രമം
  alternative: പൂർണമായും പ്രതീകാത്മകമായ ആത്മീയ ഭൂമിശാസ്ത്രം
  rationale: മൂലവാക്യം വ്യക്തമായ സ്ഥലനാമങ്ങളും ക്രമേണ വിശാലമാകുന്ന പരിധിയും നൽകുന്നു; അതിനപ്പുറമുള്ള സഭാശാസ്ത്ര പദ്ധതി പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പ്രാപിക്കും’, ‘സാക്ഷികളായിരിക്കും’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന്റെ ഔന്നത്യം നിലനിർത്തുന്നതുമാണ്. സ്ഥലപ്പേരുകൾ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള രൂപങ്ങളിൽ നൽകി.
