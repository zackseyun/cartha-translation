  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: ml
  text: 'അവർ രണ്ടുപേരെ മുന്നോട്ടുവച്ചു: ബർസബ്ബാസ്[a] എന്നു വിളിക്കപ്പെട്ടിരുന്ന, യൂസ്തൊസ് എന്നും വിളിക്കപ്പെട്ടിരുന്ന യോസേഫിനെയും മത്ഥിയാസിനെയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘രണ്ടുപേരെ നിർത്തി’ എന്നോ ‘രണ്ടുപേരെ അവതരിപ്പിച്ചു’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ആളുകളെ ഒരു കൂട്ടത്തിന്റെ മുമ്പിൽ നിർത്തുക എന്ന അർഥമുണ്ടാകാം; ഈ സന്ദർഭത്തിൽ അവരെ സ്ഥാനാർഥികളായി നിർദേശിച്ചതിനെയാണ് സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: മുന്നോട്ടുവച്ചു
  rationale: തിരഞ്ഞെടുപ്പിന്റെ ഈ സന്ദർഭത്തിൽ, രണ്ടുപേരെയും സ്ഥാനാർഥികളായി സമൂഹത്തിന്റെ മുമ്പാകെ നിർദേശിച്ചതാണ് അർഥം; വെറുതെ അവരെ നിർത്തിയെന്നോ ഇതിനകം നിയമിച്ചെന്നോ വ്യക്തമാക്കുന്നില്ല.
- source_word: δύο
  choice: രണ്ടുപേരെ
  rationale: നിർദേശിക്കപ്പെട്ട രണ്ടു വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സംഖ്യ; മലയാളത്തിൽ വ്യക്തികൾക്കനുസരിച്ചുള്ള രൂപം സ്വാഭാവികമാണ്.
- source_word: τὸν καλούμενον
  choice: എന്നു വിളിക്കപ്പെട്ടിരുന്ന
  rationale: യോസേഫിന്റെ മറ്റൊരു പേരോ തിരിച്ചറിയൽപ്പേരോ അവതരിപ്പിക്കുന്നു.
- source_word: Βαρσαββᾶν
  choice: ബർസബ്ബാസ്
  rationale: വ്യക്തിനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: ἐπεκλήθη
  choice: എന്നും പേരുണ്ടായിരുന്ന
  rationale: യോസേഫിന് യൂസ്തൊസ് എന്ന മറ്റൊരു പേരുകൂടി ഉണ്ടായിരുന്നുവെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἰοῦστος
  choice: യൂസ്തൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമമായ Ἰοῦστος മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: Μαθθίαν
  choice: മത്ഥിയാസ്
  rationale: വ്യക്തിനാമം ഗ്രീക്ക് രൂപത്തോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: καὶ ... καὶ
  choice: അവർ ... യോസേഫിനെയും മത്ഥിയാസിനെയും
  rationale: ആദ്യ καί മുൻവാക്യത്തോടുള്ള ലളിതമായ ആഖ്യാനബന്ധമായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു; രണ്ടാമത്തേത് മലയാളത്തിലെ ‘-നെയും ... -നെയും’ ഘടനയിലൂടെ രണ്ടു പേരെയും ഏകോപിപ്പിക്കുന്നു.
