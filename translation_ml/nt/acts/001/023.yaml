translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ‘മുന്നോട്ടുവച്ചു’ എന്ന പ്രയോഗം നടപടിക്രമപരമായ നിർദേശത്തിന്റെ അർഥം നൽകുന്നു; ഔപചാരിക നിയമനം നടന്നുവെന്ന അധിക അർഥം ഒഴിവാക്കുന്നു. എല്ലാ പേരുകളും ഗ്രീക്ക് പാഠത്തിൽ നിന്നു മലയാളലിപിയിലേക്ക് ശബ്ദാനുസൃതമായി രൂപപ്പെടുത്തി.
