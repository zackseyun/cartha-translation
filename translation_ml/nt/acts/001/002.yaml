  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: ml
  text: താൻ തിരഞ്ഞെടുത്ത അപ്പൊസ്തലന്മാർക്ക് പരിശുദ്ധാത്മാവിലൂടെ[a] കല്പനകൾ നൽകിയശേഷം അവൻ എടുക്കപ്പെട്ട ദിവസംവരെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിനാൽ കല്പനകൾ നൽകിയശേഷം.’ ഗ്രീക്കുപ്രയോഗം മാർഗമോ പ്രവർത്തകത്വമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘പരിശുദ്ധാത്മാവിലൂടെ’ എന്നും ‘പരിശുദ്ധാത്മാവിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: അവൻ ഉയർത്തപ്പെട്ട ദിവസംവരെ
  rationale: ഈ പ്രയോഗം മുൻവാക്യത്തിൽ ആരംഭിച്ച വിവരണത്തിന്റെ കാലപരിധി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യക്രമത്തിൽ മുഖ്യക്രിയയോടു ചേർത്താണ് ഇത് നൽകിയിരിക്കുന്നത്.
- source_word: ἐντειλάμενος
  choice: കല്പനകൾ നൽകിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയാണെന്ന് aorist participle സൂചിപ്പിക്കുന്നു. ‘കല്പനകൾ’ എന്നത് ക്രിയയുടെ ആജ്ഞാപരമായ ശക്തി നിലനിർത്തുന്നു; ‘നിർദേശങ്ങൾ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: τοῖς ἀποστόλοις
  choice: അപ്പൊസ്തലന്മാർക്ക്
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിൽ യേശു നിയോഗിച്ച അംഗീകൃത സംഘത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വായനക്കാർക്ക് പരിചിതവുമായ പദമാണ് ‘അപ്പൊസ്തലന്മാർ’.
- source_word: διὰ πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിലൂടെ
  rationale: Genitive-നോടുകൂടിയ διά ഇവിടെ മാർഗമോ പ്രവർത്തകത്വമോ സൂചിപ്പിക്കാം. ‘പരിശുദ്ധാത്മാവിലൂടെ’ എന്നത് ഗ്രീക്കിന്റെ രൂപം അടുത്തായി നിലനിർത്തുകയും ആശയം അനാവശ്യമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὓς ἐξελέξατο
  choice: താൻ തിരഞ്ഞെടുത്ത
  rationale: ബന്ധവാക്യം അപ്പൊസ്തലന്മാരെ യേശു മുമ്പേ തിരഞ്ഞെടുത്തവരായി തിരിച്ചറിയിക്കുന്നു. ‘താൻ’ എന്നത് subject-reference സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; middle voice-ന് അതിലധികം പ്രത്യേക അർഥം ചുമത്തുന്നില്ല.
- source_word: ἀνελήμφθη
  choice: അവൻ ഉയർത്തപ്പെട്ടു
  rationale: Passive രൂപം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷയാണിത്. ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘സ്വർഗത്തിലേക്ക്’ എന്ന ലക്ഷ്യസ്ഥാനം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യേശുവിന്റെ കല്പനകളും പരിശുദ്ധാത്മാവും തമ്മിലുള്ള ബന്ധം
  choice: യേശു പരിശുദ്ധാത്മാവിലൂടെ അപ്പൊസ്തലന്മാർക്ക് കല്പനകൾ നൽകി.
  alternative: യേശു പരിശുദ്ധാത്മാവിനാൽ അപ്പൊസ്തലന്മാർക്ക് കല്പനകൾ നൽകി.
  rationale: διὰ πνεύματος ἁγίου എന്നത് ഏറ്റവും സ്വാഭാവികമായി ἐντειλάμενος എന്നതോടു ചേരുന്നു; എന്നാൽ διά ഇവിടെ മാർഗവും പ്രവർത്തകത്വവും തമ്മിലുള്ള സൂക്ഷ്മഭേദം പൂർണമായി നിശ്ചയിക്കുന്നില്ല. മുഖ്യപാഠവും അടിക്കുറിപ്പും ഈ സാധ്യതകൾ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം 1:1-ൽ ആരംഭിക്കുന്ന വാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ fragment സ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു. സഭാപരമായി സുപരിചിതമായ ‘അപ്പൊസ്തലന്മാർ’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനപരമായ വിശദീകരണങ്ങൾ ചേർത്തിട്ടില്ല.
