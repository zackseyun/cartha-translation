id: ACT.1.7
reference: Acts 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: ml
  text: 'എന്നാൽ അവൻ അവരോടു പറഞ്ഞു: “പിതാവ് സ്വന്തം അധികാരത്തിൽ[b] നിശ്ചയിച്ചിരിക്കുന്ന കാലങ്ങളോ നിശ്ചിത സമയങ്ങളോ[a] അറിയുക നിങ്ങൾക്കുള്ളതല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കാലങ്ങളോ അവസരങ്ങളോ” അല്ലെങ്കിൽ “കാലഘട്ടങ്ങളോ നിശ്ചിത സമയങ്ങളോ.” ഗ്രീക്കിൽ χρόνους, καιρούς എന്നീ പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ രണ്ടു കാലസംബന്ധിയായ പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “സ്വന്തം അധികാരത്തിൽ.” ഈ കാലങ്ങളും സമയങ്ങളും പിതാവിന്റെ സ്വന്തം അധികാരത്തിൽ നിശ്ചയിക്കപ്പെട്ടിരിക്കുന്നു എന്നതാണ് പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ശിഷ്യന്മാരുടെ ചോദ്യത്തിൽനിന്ന് യേശുവിന്റെ തിരുത്തുന്ന മറുപടിയിലേക്കുള്ള മൃദുവായ വൈരുധ്യപരമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: അറിയുക നിങ്ങൾക്കുള്ളതല്ല
  rationale: ഈ അറിവ് ശിഷ്യന്മാരുടെ അവകാശത്തിലോ ചുമതലയിലോ ഉൾപ്പെടുന്നതല്ലെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: χρόνους
  choice: കാലങ്ങൾ
  rationale: ദൈർഘ്യമുള്ള കാലയളവുകളെയോ സമയപ്രവാഹത്തിലെ ഘട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്ന പൊതുവായ പദമായി ഉപയോഗിച്ചു.
- source_word: καιρούς
  choice: നിർണായക സമയങ്ങൾ
  rationale: അനുയോജ്യമായതോ നിശ്ചിതമായതോ നിർണായകമായതോ ആയ അവസരകാലം എന്ന καιρός എന്ന പദത്തിന്റെ ഭാവം വ്യക്തമാക്കുകയും χρόνους എന്നതിൽനിന്നുള്ള വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ πατὴρ
  choice: പിതാവ്
  rationale: ഗ്രീക്കിലുള്ള ദൈവത്തെ സൂചിപ്പിക്കുന്ന ശീർഷകം തന്നെയാണ്; ‘എന്റെ പിതാവ്’ എന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἔθετο
  choice: നിശ്ചയിച്ചിരിക്കുന്ന
  rationale: സ്ഥാപിക്കുക, നിശ്ചയിക്കുക, നിയമിക്കുക എന്നീ അർഥങ്ങളിൽ ഇവിടെ ‘നിശ്ചയിക്കുക’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; പൂർത്തിയായ തീരുമാനത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ഈ രൂപം അറിയിക്കുന്നു.
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: സ്വന്തം അധികാരത്താൽ
  rationale: പിതാവിന്റെ സ്വന്തം അധികാരവും നിർണയാവകാശവും വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ἐν എന്നതിന്റെ അക്ഷരാർഥപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: χρόνοι / καιροί എന്ന കാലസംബന്ധിയായ ഇരട്ടപ്പദത്തിന്റെ വിവർത്തനം
  choice: കാലങ്ങളോ നിർണായക സമയങ്ങളോ
  alternative: കാലങ്ങളോ സമയങ്ങളോ; കാലഘട്ടങ്ങളോ നിശ്ചിത സമയങ്ങളോ
  rationale: പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും പൂർണമായി ഒരേ അർഥമല്ലാത്ത രണ്ടു പദങ്ങളെയും വേർതിരിച്ചു കാണിക്കുന്നു; അതേസമയം അവയെ അടിസ്ഥാനമാക്കി മൂലപാഠം നൽകാത്ത കർശനമായ കാലക്രമവ്യവസ്ഥ സൃഷ്ടിക്കുന്നില്ല.
- issue: പിതാവിനോടു ബന്ധപ്പെട്ട ἐξουσία എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സ്വന്തം അധികാരത്താൽ
  alternative: സ്വന്തം അധികാരത്തിൽ
  rationale: കാലങ്ങളെ നിശ്ചയിക്കുന്നതു പിതാവിന്റെ സ്വന്തം അധികാരത്തിലും നിർണയാവകാശത്തിലുമാണെന്ന ആശയം വ്യക്തമാക്കുന്നു; പിന്നീടുള്ള പ്രത്യേക സിദ്ധാന്തരൂപീകരണങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ നേരിട്ടുള്ള വാക്യഘടന ഉപയോഗിച്ചു. ‘നിർണായക സമയങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കെ καιρός എന്ന പദത്തിന്റെ പ്രത്യേക ഭാവവും സൂക്ഷിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘പിതാവ്’ ശീർഷകമായി നിലനിർത്തി.
