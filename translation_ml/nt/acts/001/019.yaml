source:
  edition: SBLGNT
  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: ml
  text: ഈ കാര്യം യെരൂശലേമിൽ താമസിക്കുന്ന എല്ലാവർക്കും അറിയപ്പെട്ടു; അങ്ങനെ ആ സ്ഥലം അവരുടെ സ്വന്തം ഭാഷയിൽ[b] ‘അകെൽദാമാഖ്’[a] എന്നു വിളിക്കപ്പെട്ടു; അതായത്, ‘രക്തത്തിന്റെ വയൽ.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അകെൽദാമാഖ്’ എന്നത് ഗ്രീക്കിലെ Ἁκελδαμάχ എന്ന രൂപത്തിന്റെ ലിപ്യന്തരണമാണ്. പല വിവർത്തനങ്ങളിലും ഇതിനെ ‘അക്കെൽദാമ’ എന്നും കാണാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അവരുടെ സ്വന്തം ഭാഷാഭേദത്തിൽ.’ ഗ്രീക്കിലെ διάλεκτος എന്ന പദം ഒരു ഭാഷയെയോ പ്രാദേശിക ഭാഷാഭേദത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: അറിയപ്പെട്ടു
  rationale: കാര്യത്തിന് പൊതുവായ അറിവ് ലഭിച്ചു എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ താമസിക്കുന്ന എല്ലാവർക്കും
  rationale: κατοικοῦσιν എന്ന വാസസ്ഥലസൂചകമായ കൃതന്തത്തിന്റെ അർഥവും πᾶσι എന്ന സമഗ്രതയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὥστε
  choice: അതിന്റെ ഫലമായി
  rationale: ഇവിടെ ὥστε നിഗമനത്തേക്കാൾ ഫലത്തെ അവതരിപ്പിക്കുന്നതിനാൽ കാരണഫലബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κληθῆναι
  choice: പേരുണ്ടായി
  rationale: ആ സ്ഥലം അങ്ങനെ വിളിക്കപ്പെടാൻ ഇടയായി എന്ന ഫലാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും ഔദ്യോഗിക നാമകരണമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: τὸ χωρίον ἐκεῖνο
  choice: ആ നിലത്തിന്
  rationale: χωρίον എന്നത് ഇവിടെ നിലം അഥവാ ഭൂവിഭാഗം എന്നാണ്; തുടർന്നുള്ള Χωρίον Αἵματος എന്ന വിശദീകരണവുമായി പദസാമ്യം നിലനിർത്തുന്നു.
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: അവരുടെ സ്വന്തം ഭാഷയിൽ
  rationale: διάλεκτος ഭാഷയെയോ പ്രാദേശിക ഭാഷാഭേദത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘ഭാഷ’ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: Ἁκελδαμάχ
  choice: അക്കേൽദാമാക്ക്
  rationale: SBLGNTയിലെ Ἁκελδαμάχ എന്ന ഗ്രീക്ക് രൂപത്തിന്റെ അവസാന വ്യഞ്ജനശബ്ദം ഉൾപ്പെടെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: തുടർന്നുവരുന്ന പേരിന്റെ അർഥവിശദീകരണം സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: Χωρίον Αἵματος
  choice: രക്തനിലം
  rationale: ഗ്രീക്ക് പാഠം തന്നെ നൽകുന്ന പേരിന്റെ വിശദീകരണം മലയാളത്തിൽ സംയുക്ത സ്ഥലനാമരൂപമായി നൽകുന്നു.
