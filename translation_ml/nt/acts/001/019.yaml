translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഫലബന്ധം ‘അതിന്റെ ഫലമായി’ എന്നു വ്യക്തമാക്കുന്നു. ‘അക്കേൽദാമാക്ക്’ എന്നത് സ്രോതസ്സിലെ ഗ്രീക്ക് രൂപത്തെ പിന്തുടരുന്നു; മലയാളത്തിൽ പരിചിതമല്ലാത്ത ഇംഗ്ലീഷ് രൂപഭേദം സംബന്ധിച്ച അടിക്കുറിപ്പ് ഒഴിവാക്കി, പ്രസക്തമായ ഗ്രീക്ക് പദാർഥദ്വയാർഥത മാത്രം രേഖപ്പെടുത്തി.
