- from: എന്തെന്നാൽ, യോഹന്നാൻ വെള്ളത്താൽ സ്നാനം കഴിപ്പിച്ചു; എന്നാൽ ഇനി അധികം ദിവസം കഴിയുന്നതിനുമുമ്പ് നിങ്ങൾ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനം കഴിപ്പിക്കപ്പെടും.
  to: എന്തെന്നാൽ യോഹന്നാൻ വെള്ളത്താൽ സ്നാനം നൽകി; എന്നാൽ ഇനി വളരെ ദിവസങ്ങൾ കഴിയുന്നതിനുമുമ്പ് നിങ്ങൾ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനം ഏൽക്കും.
