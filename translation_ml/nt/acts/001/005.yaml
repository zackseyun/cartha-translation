id: ACT.1.5
reference: Acts 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: ml
  text: എന്തെന്നാൽ യോഹന്നാൻ വെള്ളത്താൽ സ്നാനം നൽകി; എന്നാൽ ഇനി വളരെ ദിവസങ്ങൾ കഴിയുന്നതിനുമുമ്പ് നിങ്ങൾ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനം ഏൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധാത്മാവിനാൽ.’ ἐν എന്ന ഗ്രീക്ക് മുൻനിപാതത്തിന് ഇവിടെ ‘പരിശുദ്ധാത്മാവിൽ’ എന്നോ ‘പരിശുദ്ധാത്മാവിനാൽ’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യേശുവിന്റെ നിർദേശത്തിന് വിശദീകരണമോ കാരണമോ നൽകുന്ന ബന്ധപദമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുന്നു.
- source_word: ἐβάπτισεν
  choice: സ്നാനം കഴിപ്പിച്ചു
  rationale: യോഹന്നാൻ മറ്റുള്ളവരെ സ്നാനപ്പെടുത്തിയെന്ന സകർമക അർഥം വ്യക്തമാക്കുന്നു; സ്നാനത്തിന്റെ രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ὕδατι
  choice: വെള്ളത്താൽ
  rationale: ദത്തിവിന്റെ ഉപകരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും തുടർന്നുള്ള ἐν πνεύματι എന്ന പ്രയോഗവുമായി ഉള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാന സ്ഥാന/മണ്ഡലാർഥം സുതാര്യമായി നിലനിർത്തുന്നു; ഉപകരണമെന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: βαπτισθήσεσθε
  choice: നിങ്ങൾ സ്നാനം കഴിപ്പിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും പ്രവർത്തകനെ മൂലപാഠംപോലെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: ഇനി അധികം ദിവസം കഴിയുന്നതിനുമുമ്പ്
  rationale: സമീപഭാവിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ എന്ന സ്നാനപ്രയോഗത്തിലെ ἐν-ന്റെ അർഥം
  choice: പരിശുദ്ധാത്മാവിൽ
  alternative: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ἐν മണ്ഡലത്തെയോ ഉപാധി/കരണത്തെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠത്തിലെ ‘പരിശുദ്ധാത്മാവിൽ’ ഗ്രീക്ക് രൂപം കൂടുതൽ സുതാര്യമായി സംരക്ഷിക്കുന്നു; ഉപകരണാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നതിലൂടെ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനവ്യത്യാസം തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്ഥാപിതമായ ‘സ്നാനം’ എന്ന പദം ഉപയോഗിച്ച് സ്നാനരീതിയെക്കുറിച്ചുള്ള അനാവശ്യ പ്രത്യേകീകരണം ഒഴിവാക്കി. മുഖ്യപാഠത്തിലെ കർമണിരൂപം അല്പം ഔപചാരികമാണെങ്കിലും മൂലപാഠത്തിന്റെ ഘടനയും പ്രവർത്തകന്റെ അപ്രകടതയും സംരക്ഷിക്കുന്നു.
