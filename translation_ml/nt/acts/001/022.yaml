id: ACT.1.22
reference: Acts 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: ml
  text: യോഹന്നാന്റെ സ്നാനം[a] മുതൽ അവൻ നമ്മിൽനിന്ന് ഉയർത്തപ്പെട്ട ദിവസംവരെ, ഇവരിൽ ഒരാൾ നമ്മോടൊപ്പം അവന്റെ പുനരുത്ഥാനത്തിന്റെ[b] സാക്ഷിയായിത്തീരണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യോഹന്നാൻ നൽകിയ സ്നാനം.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘അവന്റെ പുനരുത്ഥാനത്തിനു സാക്ഷി.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: യോഹന്നാന്റെ സ്നാനം മുതൽ
  rationale: കാലപരിധിയുടെ തുടക്കം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃന്ദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ‘മുതൽ ... വരെ’ ഘടനയിൽ അറിയിച്ചു. ‘യോഹന്നാന്റെ സ്നാനം’ ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധം നിലനിർത്തുന്നു.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: ദിവസംവരെ
  rationale: ബന്ധവാക്യത്തോടുകൂടിയ കാലപരിധിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: അവൻ നമ്മിൽനിന്ന് ഉയർത്തപ്പെട്ട
  rationale: കർമണിപ്രയോഗവും മുകളിലേക്കുള്ള എടുക്കലിന്റെ സൂചനയും നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സ്വർഗത്തിലേക്ക്’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: അവന്റെ പുനരുത്ഥാനത്തിന്റെ സാക്ഷി
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധം അടുത്തായി നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ ഗ്രാഹ്യമാണ്. ‘പുനരുത്ഥാനത്തിനു സാക്ഷി’ എന്ന സ്വാഭാവിക പകരം കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: σὺν ἡμῖν γενέσθαι
  choice: നമ്മോടൊപ്പം ... സാക്ഷിയായിത്തീരണം
  rationale: തിരഞ്ഞെടുക്കപ്പെടുന്നയാൾ നിലവിലുള്ള അപ്പൊസ്തലന്മാരോടൊപ്പം സാക്ഷിയാകണമെന്ന ആശയം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἕνα τούτων
  choice: ഇവരിൽ ഒരാൾ
  rationale: മൂലത്തിലെ ‘ഇവരിൽ ഒരാൾ’ എന്ന പ്രയോഗം നിലനിർത്തി, ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘പുരുഷന്മാർ’ എന്ന പദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: മുൻവാക്യത്തിലെ ആവശ്യകതാബോധം ഈ വാക്യത്തിൽ വ്യക്തമാക്കൽ
  choice: ‘സാക്ഷിയായിത്തീരണം’ എന്ന നിർബന്ധസൂചക രൂപം ഉപയോഗിച്ചു
  alternative: ‘സാക്ഷിയായിത്തീരാൻ’ എന്നു മാത്രം നൽകി വാക്യം മുൻവാക്യത്തിൽ വ്യാകരണപരമായി ആശ്രയിപ്പിക്കുക
  rationale: ഈ വാക്യത്തിലെ γενέσθαι എന്ന അനന്തരൂപത്തെ മുൻവാക്യത്തിലെ δεῖ നിയന്ത്രിക്കുന്നു. മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ആ ആവശ്യകതാബോധം വ്യക്തമാക്കുന്നു.
- issue: യേശുവിന്റെ ഉയർത്തപ്പെടലിനെ വിവർത്തനം ചെയ്യൽ
  choice: ‘അവൻ നമ്മിൽനിന്ന് ഉയർത്തപ്പെട്ട’
  alternative: ‘അവൻ സ്വർഗത്തിലേക്ക് ആരോഹണം ചെയ്ത’ അല്ലെങ്കിൽ ‘അവൻ നമ്മിൽനിന്ന് എടുക്കപ്പെട്ട’
  rationale: കർമണിപ്രയോഗവും ഉയർത്തപ്പെടലിന്റെ ദിശാസൂചനയും സംരക്ഷിക്കുന്നു; മൂലവാക്യത്തിൽ ഇല്ലാത്ത ‘സ്വർഗത്തിലേക്ക്’ എന്ന വിശദീകരണം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘മുതൽ ... വരെ’ എന്ന ഘടന കാലപരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. ‘പുനരുത്ഥാനം’, ‘സാക്ഷി’ എന്നീ പൊതുവായി ഗ്രാഹ്യമായ ക്രൈസ്തവ പദങ്ങൾ നിലനിർത്തി; വിഭാഗീയമായ വ്യാഖ്യാനം ഒഴിവാക്കി.
