  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: ml
  text: 'അതിനാൽ, കർത്താവായ യേശു ഞങ്ങളുടെ ഇടയിൽ വരികയും പോകുകയും ചെയ്ത മുഴുവൻ കാലത്തും ഞങ്ങളോടൊപ്പം ഉണ്ടായിരുന്ന പുരുഷന്മാരിൽ ഒരാൾ ഉണ്ടായിരിക്കേണ്ടത് അനിവാര്യമാണ്:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: ഉണ്ടായിരിക്കേണ്ടത് അനിവാര്യമാണ്
  rationale: ഈ അവ്യക്തിപരമായ ക്രിയ അനിവാര്യതയെ സൂചിപ്പിക്കുന്നു. അതിന്റെ പൂർത്തീകരണം അടുത്ത വാക്യത്തിലേക്കു നീളുന്നതിനാൽ, മലയാളത്തിൽ സ്വാഭാവികമായ മുൻകൂർ ഘടന ഉപയോഗിച്ചു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള പത്രോസിന്റെ നിഗമനം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: συνελθόντων ἡμῖν ἀνδρῶν
  choice: ഞങ്ങളോടൊപ്പം കൂടിയിരുന്ന പുരുഷന്മാരിൽ
  rationale: συνέρχομαι എന്നതിന്റെ ‘ഒരുമിച്ചുകൂടുക’ എന്ന ദൃശ്യവും ദീർഘകാല സഹവാസമെന്ന സന്ദർഭാർഥവും നിലനിർത്തുന്നു; ἀνήρ പ്രത്യേകമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗനിഷ്കർഷവും സംരക്ഷിച്ചു.
- source_word: ἐν παντὶ χρόνῳ
  choice: കാലമൊക്കെയും
  rationale: ഓരോ പ്രത്യേക അവസരത്തെയും അല്ല, യേശു ശിഷ്യരോടൊപ്പം പ്രവർത്തിച്ച മുഴുവൻ കാലയളവിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെ ഇടയിൽ വരികയും പോകുകയും ചെയ്ത
  rationale: ശിഷ്യരുടെ കൂട്ടത്തിലുള്ള യേശുവിന്റെ തുടർച്ചയായ ജീവിതത്തെയും പ്രവർത്തനത്തെയും സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ചലനരൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ κύριος Ἰησοῦς
  choice: കർത്താവായ യേശു
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ ബഹുമാനപദത്തിന്റെ ഭാരവും മലയാളത്തിലെ സ്ഥാപിതമായ പുതിയനിയമ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ പരിഭാഷ
  choice: കർത്താവായ യേശു
  alternative: ഗുരുവായ യേശു
  rationale: ‘കർത്താവ്’ എന്നത് ബഹുമാനപദവും ദൈവശാസ്ത്രപരമായ ഭാരവും സംരക്ഷിക്കുന്നു; ‘ഗുരു’ മൂലപദത്തിന്റെ വ്യാപ്തി ചുരുക്കും.
- issue: ἀνδρῶν എന്ന പദത്തിലെ ലിംഗനിഷ്കർഷം
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ
  rationale: ἀνήρ ഇവിടെ വ്യക്തമായി പുരുഷന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്; ലിംഗനിരപേക്ഷമായ പരിഭാഷ മൂലപാഠത്തിലെ ഈ നിർണ്ണയം മറച്ചുകളയും.
- issue: δεῖ എന്ന അനിവാര്യതയും അടുത്ത വാക്യത്തിലേക്കുള്ള വാക്യഘടനയും
  choice: ഇങ്ങനെയുള്ള ഒരാൾ ഉണ്ടായിരിക്കേണ്ടത് അനിവാര്യമാണ്
  alternative: ഒരാളെ തിരഞ്ഞെടുക്കണം
  rationale: ‘തിരഞ്ഞെടുക്കുക’ എന്ന ആശയം ഈ വാക്യത്തിൽ നേരിട്ട് ഇല്ല. തിരഞ്ഞെടുത്ത വ്യക്തി എന്തായിത്തീരണമെന്ന പൂർത്തീകരണം അടുത്ത വാക്യത്തിലാണ്; അതിനാൽ അനിവാര്യത നിലനിർത്തുകയും തിരഞ്ഞെടുപ്പെന്ന ആശയം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലവാക്യം 22-ാം വാക്യത്തിലേക്കു വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തെ കോമ നിലനിർത്തി. ‘ഇങ്ങനെയുള്ള ഒരാൾ’ എന്ന മുൻകൂർ ഘടന മലയാളത്തിൽ അനിവാര്യത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും അടുത്ത വാക്യത്തിലെ യോഗ്യതകളിലേക്കുള്ള തുറന്ന നില സംരക്ഷിക്കുന്നു.
