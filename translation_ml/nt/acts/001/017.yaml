id: ACT.1.17
reference: Acts 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: ml
  text: കാരണം, അവൻ ഞങ്ങളുടെ കൂട്ടത്തിൽ എണ്ണപ്പെട്ടവനായിരുന്നു; ഈ ശുശ്രൂഷയിലെ ഓഹരി അവന് ലഭിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ശുശ്രൂഷയുടെ നറുക്ക്’ അല്ലെങ്കിൽ ‘ഈ ശുശ്രൂഷയിൽ നിയോഗിക്കപ്പെട്ട ഓഹരി.’ ഇവിടെ ‘ഓഹരി’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് ‘നറുക്ക്’ എന്നും അതിലൂടെ ലഭിക്കുന്ന ‘ഓഹരി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തിൽ പത്രോസ് യൂദാസിനെ സംബന്ധിച്ച കാര്യം വിശദീകരിക്കുന്നതിനാൽ കാരണസൂചകമായ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κατηριθμημένος ἦν
  choice: എണ്ണപ്പെട്ടവനായിരുന്നു
  rationale: അപ്പോസ്തലസംഘത്തിൽ ഉൾപ്പെട്ടവൻ എന്ന നിലയിൽ തുടർന്നിരുന്നുവെന്ന പൂർണകാല നിഷ്ക്രിയ ഭാവം ഔപചാരികത നഷ്ടപ്പെടാതെ നിലനിർത്തുന്നു.
- source_word: ἐν ἡμῖν
  choice: ഞങ്ങളുടെ കൂട്ടത്തിൽ
  rationale: വെറും സമീപസ്ഥതയല്ല, സംഘത്തിലെ യഥാർഥ അംഗത്വമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: ἔλαχεν
  choice: ലഭിച്ചിരുന്നു
  rationale: λαγχάνω എന്ന ക്രിയയിലെ ലഭിക്കൽ/നിയോഗിക്കപ്പെട്ട ഓഹരി കൈവരിക്കൽ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; നറുക്കിന്റെ സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸν κλῆρον
  choice: ഒരു പങ്ക്
  rationale: κλῆρος എന്നത് ‘നറുക്ക്’ എന്നും അതിലൂടെ ലഭിച്ച ‘ഓഹരി/പങ്ക്’ എന്നും അർഥമാക്കാം. ഇവിടെ ശുശ്രൂഷയിലെ പങ്കാളിത്തം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τῆς διακονίας ταύτης
  choice: ഈ ശുശ്രൂഷയിൽ
  rationale: അപ്പോസ്തലിക സേവനത്തെ സൂചിപ്പിക്കുന്ന διακονίαയ്ക്ക് മലയാള ബൈബിൾഭാഷയിലും സാധാരണ ക്രൈസ്തവ പ്രയോഗത്തിലും മനസ്സിലാകുന്ന ‘ശുശ്രൂഷ’ യോജിക്കുന്നു.
theological_decisions:
- issue: അപ്പോസ്തലിക സ്ഥാനത്തോടുള്ള യൂദാസിന്റെ ബന്ധം
  choice: യൂദാസ് അവരുടെ കൂട്ടത്തിൽ യഥാർഥമായി ഉൾപ്പെട്ടിരുന്നുവെന്നും ഈ ശുശ്രൂഷയിൽ അവന് ഒരു പങ്ക് ലഭിച്ചിരുന്നുവെന്നും വാക്യം പ്രസ്താവിക്കുന്നതായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: അവൻ സംഘവുമായി വെറും സഹവാസത്തിലായിരുന്നുവെന്ന ദുർബലമായ വായന.
  rationale: ‘ഞങ്ങളുടെ കൂട്ടത്തിൽ എണ്ണപ്പെട്ടവൻ’, ‘ഒരു പങ്ക് ലഭിച്ചു’ എന്നീ ഗ്രീക്ക് പ്രയോഗങ്ങൾ ഉൾപ്പെടുത്തലും പങ്കാളിത്തവും ഉറപ്പിക്കുന്നു; എന്നാൽ അവന്റെ അംഗീകാരമോ അന്തിമസ്ഥിരതയോ സംബന്ധിച്ച പിൽക്കാല ദൈവശാസ്ത്രനിഗമനങ്ങൾ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾശൈലി. ‘ശുശ്രൂഷ’ എന്ന പരിചിതപദം നിലനിർത്തിയപ്പോൾ, κλῆρος എന്ന പദത്തിന്റെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. മുഖ്യവാക്യത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
