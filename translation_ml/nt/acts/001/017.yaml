revisions:
- from: കാരണം, അവൻ ഞങ്ങളുടെ കൂട്ടത്തിൽ എണ്ണപ്പെട്ടവനായിരുന്നു; ഈ ശുശ്രൂഷയിൽ അവന് ഒരു പങ്കും ലഭിച്ചിരുന്നു[a].
  to: കാരണം, അവൻ ഞങ്ങളുടെ കൂട്ടത്തിൽ എണ്ണപ്പെട്ടവനായിരുന്നു; ഈ ശുശ്രൂഷയിലെ ഓഹരി അവന് ലഭിച്ചു[a].
  rationale: The revision preserves the causal connection, Judas's genuine inclusion in the group, and his receipt of the ministry's allotted share. It removes an unwarranted pluperfect nuance, represents the definite κλῆρος more precisely, and clarifies its lexical ambiguity in the footnote without drawing theological conclusions beyond the verse.
