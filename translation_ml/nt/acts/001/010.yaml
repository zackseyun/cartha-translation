id: ACT.1.10
reference: Acts 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ⸂ἐσθήσεσι λευκαῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/010.yaml
  text: And as they were gazing intently into heaven while he was going[a], behold, two men stood by them in white clothing[b],
translation:
  language: ml
  text: അവൻ പോകുമ്പോൾ അവർ സ്വർഗത്തിലേക്ക് ഉറ്റുനോക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു[a]. അപ്പോൾ ഇതാ, വെള്ള വസ്ത്രങ്ങൾ[b] ധരിച്ച രണ്ടു പുരുഷന്മാർ അവരുടെ അരികിൽ നിന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആകാശത്തിലേക്ക്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് “സ്വർഗം” എന്നും “ആകാശം” എന്നും അർഥമാകാം; സ്വർഗാരോഹണത്തിന്റെ ഈ സന്ദർഭത്തിൽ “സ്വർഗം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വെള്ള ഉടുപ്പുകൾ” അല്ലെങ്കിൽ “വെള്ള അങ്കികൾ.” ഗ്രീക്ക് പദം പൊതുവായി വസ്ത്രത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίζοντες
  choice: ഉറ്റുനോക്കിക്കൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: The expression conveys sustained, intent looking; this Malayalam wording preserves both focus and duration naturally.
- source_word: οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: In the ascension setting, ‘സ്വർഗം’ appropriately expresses the theological horizon, while the lexical alternative ‘ആകാശം’ is preserved in a footnote.
- source_word: πορευομένου αὐτοῦ
  choice: അവൻ പോകുമ്പോൾ
  rationale: This naturally represents the contemporaneous action expressed by the genitive absolute without adding the idea of disappearance or arrival.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ‘ഇതാ’ retains the attention-directing and marked narrative force of ἰδού in dignified, current Malayalam.
- source_word: ἄνδρες δύο
  choice: രണ്ടു പുരുഷന്മാർ
  rationale: The Greek explicitly says ‘two men’; this rendering preserves that wording rather than identifying them as angels within the translation.
- source_word: παρειστήκεισαν
  choice: അവരുടെ അരികിൽ നിന്നു
  rationale: This gives the idiomatic sense that the two men were standing beside them and avoids over-interpreting the verb as ‘appeared.’
- source_word: ἐσθήσεσι λευκαῖς
  choice: വെള്ളവസ്ത്രം ധരിച്ച
  rationale: The Greek broadly denotes white clothing. This natural Malayalam phrasing does not specify robes more narrowly than the source.
theological_decisions:
- issue: Rendering οὐρανός in the ascension context
  choice: സ്വർഗം
  alternative: ആകാശം
  rationale: The context supports ‘heaven,’ but the Greek can also denote the sky; the main text follows the ascension context and the footnote preserves the genuine lexical ambiguity.
- issue: Identity of the two men
  choice: രണ്ടു പുരുഷന്മാർ
  alternative: രണ്ടു ദൂതന്മാർ
  rationale: This verse calls them men rather than angels. The translation leaves their possible angelic identity to the wider context instead of importing it into the wording.
translation_notes:
  register: Modern standard Malayalam with a dignified narrative register. The progressive construction conveys sustained gazing, ‘ഇതാ’ retains the source’s attention marker, and no explicit angelic identification has been added.
