  to: “പുരുഷന്മാരേ, സഹോദരന്മാരേ, യേശുവിനെ പിടികൂടിയവർക്ക്[c] വഴികാട്ടിയായിത്തീർന്ന യൂദാസിനെക്കുറിച്ച് പരിശുദ്ധാത്മാവ് ദാവീദിന്റെ വായിലൂടെ[b] മുൻകൂട്ടി പറഞ്ഞ[a] തിരുവെഴുത്ത് നിവൃത്തിയാകേണ്ടതായിരുന്നു.”
