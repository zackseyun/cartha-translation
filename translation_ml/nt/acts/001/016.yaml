source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: ml
  text: “പുരുഷന്മാരേ, സഹോദരന്മാരേ, യേശുവിനെ പിടികൂടിയവർക്ക്[c] വഴികാട്ടിയായിത്തീർന്ന യൂദാസിനെക്കുറിച്ച് പരിശുദ്ധാത്മാവ് ദാവീദിന്റെ വായിലൂടെ[b] മുൻകൂട്ടി പറഞ്ഞ[a] തിരുവെഴുത്ത് നിവൃത്തിയാകേണ്ടതായിരുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രവചിച്ച.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “ദാവീദിന്റെ വായിലൂടെ”; ഒരു മനുഷ്യ മാധ്യമത്തിലൂടെ പറയപ്പെട്ട വാക്കിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “യേശുവിനെ പിടിച്ചവർക്ക്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരായ പുരുഷന്മാരേ
  rationale: രണ്ട് പദങ്ങളുടെയും പുരുഷലിംഗ ബഹുവചന സംബോധന നിലനിർത്തുന്നു; അതേസമയം ആധുനിക മലയാളത്തിൽ ഒറ്റ സ്വാഭാവിക സംബോധനയായി വായിക്കാം.
- source_word: ἔδει
  choice: അനിവാര്യമായിരുന്നു
  rationale: ἔδει സൂചിപ്പിക്കുന്ന ആവശ്യകത വ്യക്തമാക്കുന്നു; ആ ആവശ്യകതയുടെ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതി വാക്യത്തിൽ ചേർത്തുപറയുന്നില്ല.
- source_word: πληρωθῆναι
  choice: നിവൃത്തിയാകേണ്ടത്
  rationale: തിരുവെഴുത്തിന്റെ പൂർത്തീകരണത്തെ സൂചിപ്പിക്കുന്ന ലൂക്കോസ്–പ്രവൃത്തികൾ ശൈലി നിലനിർത്തുകയും കർമണി ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: τὴν γραφὴν
  choice: തിരുവെഴുത്ത്
  rationale: ഇവിടെ γραφή സാധാരണ എഴുത്തിനെയല്ല, വിശുദ്ധ തിരുവെഴുത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: προεῖπε
  choice: മുൻകൂട്ടി പറഞ്ഞ
  rationale: ‘മുമ്പേ പറഞ്ഞു’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘പ്രവചിച്ചു’ എന്ന കൂടുതൽ സാങ്കേതികമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ പ്രചാരമുള്ള മാന്യമായ രൂപം.
- source_word: διὰ στόματος Δαυὶδ
  choice: ദാവീദിന്റെ വായിലൂടെ
  rationale: പരിശുദ്ധാത്മാവിനെ സംസാരിക്കുന്നവനായും ദാവീദിനെ മനുഷ്യ മാധ്യമമായും അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: περὶ Ἰούδα
  choice: യൂദാസിനെക്കുറിച്ച്
  rationale: περί + genitive ഇവിടെ പ്രസ്താവനയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: വഴികാട്ടിയായിത്തീർന്ന
  rationale: γενομένου എന്ന ‘ആയിത്തീർന്നു’ എന്ന ആശയം കൃത്യമായി നിലനിർത്തുന്നു; ὁδηγός എന്നതിന് സന്ദർഭോചിതമായ ‘വഴികാട്ടി’ ഉപയോഗിക്കുന്നു.
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: യേശുവിനെ പിടികൂടിയവർക്ക്
  rationale: അറസ്റ്റിന്റെ സന്ദർഭത്തിലുള്ള συλλαμβάνωയുടെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: തിരുവെഴുത്തിന്റെ നിവൃത്തിയിലെ ആവശ്യകത
  choice: ‘നിവൃത്തിയാകേണ്ടത് അനിവാര്യമായിരുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദൈവിക മുൻനിർണയംമൂലം സംഭവിക്കേണ്ടിയിരുന്നു’ അല്ലെങ്കിൽ ‘ഉചിതമായിരുന്നു’
  rationale: വാക്യം ആവശ്യകത വ്യക്തമാക്കുന്നുവെങ്കിലും അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. ദൈവിക ഉദ്ദേശ്യവും മനുഷ്യപ്രവൃത്തിയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചുകാട്ടാതെ നിലനിർത്തുന്നു.
- issue: പ്രചോദനത്തിലെ ദൈവികവും മാനുഷികവുമായ കർത്തൃത്വം
  choice: ‘പരിശുദ്ധാത്മാവ് ദാവീദിന്റെ വായിലൂടെ മുൻകൂട്ടി പറഞ്ഞ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദാവീദ് പരിശുദ്ധാത്മാവിനാൽ പറഞ്ഞു’ അല്ലെങ്കിൽ ‘ദാവീദിനെക്കൊണ്ട് എഴുതിച്ചു’
  rationale: ഗ്രീക്കിൽ പരിശുദ്ധാത്മാവാണ് സംസാരിക്കുന്ന കർത്താവ്; ദാവീദ് മനുഷ്യ മാധ്യമമാണ്. ഈ രണ്ടു തലത്തിലുള്ള കർത്തൃത്വവും മൂലപാഠത്തിന്റെ വ്യാകരണക്രമത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഔപചാരിക സംബോധനയും തിരുവെഴുത്തുനിവൃത്തിയുടെ ഗൗരവവും സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളുടെ പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
