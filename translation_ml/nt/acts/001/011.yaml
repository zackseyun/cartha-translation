id: ACT.1.11
reference: Acts 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: ml
  text: 'അവർ ഇങ്ങനെ പറഞ്ഞു: “ഗലീലക്കാരായ പുരുഷന്മാരേ, നിങ്ങൾ സ്വർഗത്തിലേക്കു നോക്കിക്കൊണ്ട് നിൽക്കുന്നത് എന്തിന്? നിങ്ങളിൽനിന്ന് സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ട ഈ യേശു[a], നിങ്ങൾ അവനെ സ്വർഗത്തിലേക്ക് പോകുന്നതായി കണ്ട അതേ വിധത്തിൽത്തന്നെ വരും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ പരമ്പരാഗതമായി, “ഈ അതേ യേശു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഈ യേശു” എന്നാണ്; വ്യക്തിയുടെ അതേ സ്വത്വം ഊന്നിക്കാട്ടുന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണമാണ് “അതേ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: ഗലീലക്കാരായ പുരുഷന്മാരേ
  rationale: ἄνδρες എന്ന പുല്ലിംഗ ബഹുവചനവും Γαλιλαῖοι എന്ന ജനവിഭാഗസൂചനയും നേരിട്ടുള്ള സംബോധനയായി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τί ἑστήκατε βλέποντες
  choice: നിങ്ങൾ സ്വർഗത്തിലേക്കു നോക്കിക്കൊണ്ട് നിൽക്കുന്നത് എന്തിന്?
  rationale: ἑστήκατε എന്നതിന്റെ ഇപ്പോഴത്തെ നിലയും βλέποντες സൂചിപ്പിക്കുന്ന അനുബന്ധ പ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു പകർന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: οὐρανός എന്നതിന് ‘ആകാശം’ എന്നും അർഥമുണ്ടാകാമെങ്കിലും, യേശുവിന്റെ ആരോഹണവും മടങ്ങിവരവും വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സ്വർഗം’ ആണ് യോജിച്ചത്; εἰς എന്ന ദിശാസൂചനയും നിലനിർത്തുന്നു.
- source_word: οὗτος ὁ Ἰησοῦς
  choice: ഈ യേശു
  rationale: ഗ്രീക്കിലെ οὗτος എന്ന ചൂണ്ടുപദത്തെ നേരിട്ട് പകർത്തുന്നു; മൂലത്തിൽ പ്രത്യേകം ‘അതേ’ എന്ന പദമില്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന് സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ട
  rationale: ἀναλημφθείς എന്ന നിഷ്ക്രിയരൂപത്തിന്റെ ‘എടുക്കപ്പെട്ടു’ എന്ന ആശയവും ἀφ’ ὑμῶν എന്ന വേർപാടിന്റെ സൂചനയും സംരക്ഷിക്കുന്നു; ലക്ഷ്യസ്ഥാനം സന്ദർഭത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὕτως ... ὃν τρόπον
  choice: കണ്ട അതേ വിധത്തിൽത്തന്നെ
  rationale: വരവിന്റെ രീതി, അവർ കണ്ടുപോയ രീതിയോടു താരതമ്യപ്പെടുത്തുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളത്തിൽ പകർന്നു.
- source_word: ἐθεάσασθε
  choice: കണ്ട
  rationale: ശ്രദ്ധാപൂർവമായ ദർശനം സൂചിപ്പിക്കാവുന്ന ക്രിയയെ ഇവിടെ അതിരുകടന്ന ശക്തി ചേർക്കാതെ സാധാരണവും വ്യക്തവുമായ രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: πορευόμενον
  choice: പോകുന്നതായി
  rationale: യേശുവിന്റെ മുകളിലേക്കുള്ള നീക്കത്തെ ലളിതമായി വിവരിക്കുന്നു; ‘യാത്രചെയ്യുക’ പോലുള്ള അനാവശ്യമായ അധിക സൂക്ഷ്മത ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ആരോഹണത്തിന്റെയും മടങ്ങിവരവിന്റെയും സന്ദർഭത്തിൽ οὐρανός എന്നതിന്റെ അർഥം
  choice: സ്വർഗം
  alternative: ആകാശം
  rationale: οὐρανός ദൃശ്യമായ ആകാശത്തെയും സൂചിപ്പിക്കാമെങ്കിലും, യേശു എടുക്കപ്പെടുന്നതും വീണ്ടും വരുന്നതും പറയുന്ന സന്ദർഭം ‘സ്വർഗം’ എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; പാഠത്തിനപ്പുറമുള്ള വിശദീകരണം ചേർത്തിട്ടില്ല.
- issue: οὗτος ὁ Ἰησοῦς എന്നത് എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ഈ യേശു
  alternative: ഈ അതേ യേശു
  rationale: ഗ്രീക്കിൽ ‘ഈ’ എന്ന ചൂണ്ടുപദം വ്യക്തമാണ്, എന്നാൽ ‘അതേ’ എന്നതിന് പ്രത്യേക പദമില്ല. അതിനാൽ കൂടുതൽ നേരിട്ടുള്ള രൂപം മുഖ്യപാഠത്തിലും പരമ്പരാഗത വിപുലീകരണം അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. നേരിട്ടുള്ള സംബോധനയുടെ പുരുഷലിംഗസൂചന നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ ആശയം അധികമായി വിശദീകരിക്കാതെ മൂലപാഠത്തിന്റെ താരതമ്യവും ഊന്നലും സംരക്ഷിച്ചു.
