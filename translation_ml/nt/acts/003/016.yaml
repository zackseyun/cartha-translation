  source_fidelity: ആദ്യത്തെ ‘അവന്റെ നാമത്തിലുള്ള വിശ്വാസം’ വിശ്വാസത്തിന്റെ മനുഷ്യവിഷയം നിർണയിക്കാതെ πίστις τοῦ ὀνόματος αὐτοῦ എന്ന പ്രയോഗം നന്നായി നൽകുന്നു. ‘അവന്റെ നാമംതന്നെ’ എന്ന ആവർത്തന-ഊന്നലും ἐστερέωσεν, θεωρεῖτε καὶ οἴδατε, ὁλοκληρία, ἀπέναντι πάντων ὑμῶν എന്നിവയുടെ ആശയവും സംരക്ഷിക്കപ്പെടുന്നു. എന്നാൽ ‘അവനിലൂടെ ഉണ്ടാകുന്ന വിശ്വാസം’ എന്നത് ἡ πίστις ἡ δι’ αὐτοῦ-നെ യേശു ഉളവാക്കുന്ന വിശ്വാസം എന്നു ചായ്ക്കുന്നു; മൂലത്തിലെ ‘അവനിലൂടെ’ എന്ന തുറന്ന മാധ്യമാർഥം അതിലൂടെ അനാവശ്യമായി ഇടുങ്ങുന്നു.
  naturalness: മലയാളം പൊതുവേ ആധുനികവും വ്യക്തവുമാണ്. ‘അവനിലൂടെയുള്ള വിശ്വാസം’ സ്വാഭാവികമായും കൂടുതൽ സംക്ഷിപ്തമായും ഉപയോഗിക്കാം; ഇത് വാക്യത്തിന്റെ ഉദ്ദേശ്യമായ വ്യാഖ്യാനതുറന്ന നിലയും നിലനിർത്തും.
