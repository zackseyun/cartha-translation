id: ACT.3.16
reference: Acts 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: ml
  text: അവന്റെ നാമത്തിലുള്ള വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ[a], നിങ്ങൾ കാണുകയും അറിയുകയും ചെയ്യുന്ന ഈ മനുഷ്യനെ അവന്റെ നാമംതന്നെ ശക്തനാക്കിയിരിക്കുന്നു; അവനിലൂടെയുള്ള വിശ്വാസമാണ് നിങ്ങൾ എല്ലാവരുടെയും മുമ്പിൽ ഇവന് ഈ പൂർണ സൗഖ്യം നൽകിയിരിക്കുന്നത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ നാമത്തിലുള്ള ആശ്രയത്തിന്റെ അടിസ്ഥാനത്തിൽ.’ ഇവിടെ ‘വിശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ‘ആശ്രയം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പൂർണ സൗഖ്യം’ എന്നതിന് ‘സമ്പൂർണ ആരോഗ്യാവസ്ഥ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ
  choice: അവന്റെ നാമത്തിലുള്ള വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ
  rationale: ἐπί + ദത്തിവ് സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം നിലനിർത്തുന്നു. പίστις ആരുടേതാണെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തുപറയുന്നില്ല.
- source_word: ἐστερέωσεν
  choice: ശക്തനാക്കിയിരിക്കുന്നു
  rationale: മനുഷ്യന്റെ ശരീരത്തിൽ സംഭവിച്ച ദൃശ്യമായ ബലപ്പെടുത്തലിനെയും ഇപ്പോഴുള്ള ഫലത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: അവന്റെ നാമംതന്നെ
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും ഊന്നലും നിലനിർത്തുകയും ‘നാമം’ എന്നതിനെ യേശുവിന്റെ വ്യക്തിയുടെയും അധികാരത്തിന്റെയും സൂചനയായി പരിഭാഷയിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: നിങ്ങൾ കാണുകയും അറിയുകയും ചെയ്യുന്ന
  rationale: ജനങ്ങളുടെ നേരിട്ടുള്ള കാഴ്ചയും മുൻപരിചയവും എന്ന രണ്ടു ആശയങ്ങളും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: അവനിലൂടെ ഉണ്ടാകുന്ന വിശ്വാസം
  rationale: διά + ജനിറ്റീവിന്റെ മാധ്യമാർഥം വ്യക്തമാക്കുന്നു; ഈ വിശ്വാസം യേശുവിലൂടെ ലഭിക്കുന്നതോ പ്രവർത്തിക്കുന്നതോ എന്ന സൂക്ഷ്മ വ്യത്യാസം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ὁλοκληρίαν
  choice: പൂർണ സൗഖ്യം
  rationale: ശരീരത്തിന്റെ സമ്പൂർണ ആരോഗ്യപുനഃസ്ഥാപനം എന്ന സന്ദർഭാർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: നിങ്ങൾ എല്ലാവരുടെയും മുമ്പിൽ
  rationale: സൗഖ്യത്തിന്റെ പരസ്യവും സാക്ഷ്യപ്പെടുത്താവുന്നതുമായ സ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസം ആരുടേതാണെന്ന ചോദ്യം
  choice: വിശ്വാസത്തിന്റെ മനുഷ്യവിഷയം വ്യക്തമാക്കാതെ വാക്യത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തി.
  alternative: സൗഖ്യം ലഭിച്ച മനുഷ്യന്റെ വിശ്വാസം; അപ്പൊസ്തലന്മാരുടെ വിശ്വാസം; യേശു ജനിപ്പിക്കുന്ന വിശ്വാസം.
  rationale: ഗ്രീക്ക് പാഠം വിശ്വാസത്തെ നാമത്തോടും യേശുവിലൂടെയുള്ള മാധ്യമത്തോടും ബന്ധിപ്പിക്കുന്നുവെങ്കിലും അത് ആരുടെ വിശ്വാസമാണെന്ന് നേരിട്ട് പറയുന്നില്ല.
- issue: ‘നാമം’ സൗഖ്യത്തിന്റെ പ്രവർത്തകമായി പറയുന്നത്
  choice: ‘അവന്റെ നാമംതന്നെ’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘യേശുതന്നെ’ അല്ലെങ്കിൽ ‘അവന്റെ നാമത്തിന്റെ ശക്തി’.
  rationale: ലൂക്കോസിന്റെ ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള ആവർത്തനം പരാവർത്തനം ചെയ്ത് ഇല്ലാതാക്കാതെ, യേശുവിന്റെ വ്യക്തിയെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാമംതന്നെ’ എന്ന ഊന്നൽ ഗ്രീക്ക് പാഠത്തിലെ ആവർത്തനം സൂക്ഷിക്കുന്നു; വിശ്വാസത്തിന്റെ കർത്താവിനെ വ്യക്തമാക്കാത്ത മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും നിലനിർത്തുന്നു.
