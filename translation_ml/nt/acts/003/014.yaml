id: ACT.3.14
reference: Acts 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ പരിശുദ്ധനും നീതിമാനുമായവനെ തള്ളിപ്പറഞ്ഞു; ഒരു കൊലയാളിയെ നിങ്ങൾക്കു വിട്ടുതരണമെന്ന്[a] അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ പദാനുസൃതമായി: “നിങ്ങൾക്ക് അനുവദിച്ചുതരണമെന്ന്.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് തടവുകാരനെ മോചിപ്പിച്ചുകൊടുക്കുക എന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: എന്നാൽ നിങ്ങൾ
  rationale: δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; വ്യക്തമാക്കിയ ὑμεῖς നേരിട്ടുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: പരിശുദ്ധനും നീതിമാനുമായവനെ
  rationale: ഒരേ നിർദ്ദേശകപദത്തോടുകൂടിയ രണ്ടു വിശേഷണങ്ങളും നാമവൽക്കരിക്കപ്പെട്ട് യേശുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ ഏകവ്യക്തിസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἠρνήσασθε
  choice: തള്ളിപ്പറഞ്ഞു
  rationale: ἀρνέομαι ഇവിടെ നിഷേധിക്കുക, നിരാകരിക്കുക, തള്ളിപ്പറയുക എന്ന ബന്ധപരവും പരസ്യവുമായ അർഥം വഹിക്കുന്നു; ‘തള്ളിപ്പറഞ്ഞു’ സാധാരണ മലയാളത്തിൽ ആ ശക്തി നൽകുന്നു.
- source_word: ᾐτήσασθε
  choice: അപേക്ഷിച്ചു
  rationale: αἰτέω അധികാരിയോട് ആവശ്യപ്പെടുകയോ അപേക്ഷിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ന്യായവിധിസന്ദർഭത്തിന് ‘അപേക്ഷിച്ചു’ യോജിക്കുന്നു.
- source_word: ἄνδρα φονέα
  choice: ഒരു കൊലയാളിയെ
  rationale: ἄνδρα φονέα എന്നത് കൊലയാളിയായ ഒരു പുരുഷനെ സൂചിപ്പിക്കുന്നു. ‘ഒരു കൊലയാളിയെ’ എന്ന മലയാളപ്രയോഗം ഇരുപദങ്ങളുടെയും ആശയം സ്വാഭാവികമായും പൂർണമായും നൽകുന്നു.
- source_word: χαρισθῆναι ὑμῖν
  choice: നിങ്ങൾക്കു വിട്ടുതരണമെന്ന്
  rationale: χαρίζομαι അനുഗ്രഹമായോ ഇളവായോ അനുവദിക്കുക എന്ന വിശാലാർഥമുള്ളതാണെങ്കിലും, ഈ ന്യായവിധിസന്ദർഭത്തിൽ തടവുകാരനെ വിട്ടുകൊടുക്കുക എന്നതാണ് ഉദ്ദേശ്യം. ‘വിട്ടുതരുക’ ദാനസ്വഭാവവും മോചനസന്ദർഭവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: τὸν ἅγιον καὶ δίκαιον എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ബലം
  choice: യേശുവിനെ സൂചിപ്പിക്കുന്ന ഏകീകൃത ബഹുമാനവിശേഷണമായി ‘പരിശുദ്ധനും നീതിമാനുമായവൻ’
  alternative: വെറും വിവരണാത്മക വിശേഷണങ്ങളായി ‘പരിശുദ്ധനും നീതിമാനുമായ ഒരാൾ’
  rationale: ഗ്രീക്കിലെ നിർദ്ദേശകപദവും നാമവൽക്കരിക്കപ്പെട്ട വിശേഷണങ്ങളും ഒരു പ്രത്യേക വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വലിയക്ഷരഭേദമില്ലാത്തതിനാൽ ‘-യായവൻ’ ഘടന ഈ ശീർഷകസദൃശ ബലം അറിയിക്കുന്നു; അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: χαρισθῆναι എന്നതിലെ അനുവദിക്കൽ-മോചിപ്പിക്കൽ സൂക്ഷ്മത
  choice: പ്രധാനവാക്യത്തിൽ ‘വിട്ടുതരണമെന്ന്’; വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ
  alternative: ‘നിങ്ങൾക്ക് അനുവദിച്ചുതരണമെന്ന്’
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം അനുഗ്രഹമായി അനുവദിക്കുക എന്നതാണെങ്കിലും, സന്ദർഭത്തിൽ ബറബ്ബാസിനെ മോചിപ്പിക്കുന്നതാണ്. മലയാളത്തിൽ ‘വിട്ടുതരുക’ ഇരു ഘടകങ്ങളും സംക്ഷിപ്തമായി നൽകുന്നു; അടിക്കുറിപ്പ് യഥാർഥ പദവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള കുറ്റാരോപണഭാവവും പരിശുദ്ധനായ യേശുവിനും കൊലയാളിക്കും ഇടയിലെ ശക്തമായ വൈരുധ്യവും നിലനിർത്തി.
