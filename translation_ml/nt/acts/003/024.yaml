id: ACT.3.24
reference: Acts 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ προφῆται ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς ὅσοι ἐλάλησαν καὶ κατήγγειλαν τὰς ἡμέρας ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: ml
  text: ശമൂവേൽ മുതൽ അദ്ദേഹത്തിനുശേഷം വന്നവർവരെ[a], സംസാരിച്ച എല്ലാ പ്രവാചകന്മാരും ഈ നാളുകളെക്കുറിച്ച്[c] പ്രഖ്യാപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ക്രമത്തിൽ തുടർന്നുവന്നവർ’ അല്ലെങ്കിൽ ‘അദ്ദേഹത്തെ പിന്തുടർന്നവർ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പരസ്യമായി അറിയിച്ചു’; കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, ‘മുൻകൂട്ടി പ്രവചിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: ‘ഈ നാളുകൾ’ എന്നത് ‘ഈ കാലം’ എന്നും പരിഭാഷപ്പെടുത്താം. പത്രോസിന്റെ പ്രസംഗത്തിൽ ഇപ്പോൾ നിവൃത്തിയാകുന്ന കാലഘട്ടത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: പ്രവാചകന്മാരും … എല്ലാവരും
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, നേരിയ ബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവികമായ മലയാളത്തിൽ ‘-ഉം’ ഉപയോഗിച്ച് ബന്ധം നിലനിർത്തുന്നു. πάντες എന്ന സമഗ്രത ‘എല്ലാവരും’ വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ Σαμουὴλ
  choice: ശമൂവേൽമുതലുള്ള
  rationale: ἀπό ഒരു പരമ്പരയുടെ ആരംഭബിന്ദു സൂചിപ്പിക്കുന്നു; ‘മുതലുള്ള’ എന്നത് സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τῶν καθεξῆς
  choice: അദ്ദേഹത്തിനുശേഷം വന്നവർ
  rationale: καθεξῆς ക്രമത്തെയോ തുടർച്ചയെയോ സൂചിപ്പിക്കുന്നു. ആർട്ടിക്കിളോടുകൂടിയ പ്രയോഗത്തെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ വിവർത്തനം ചെയ്യുന്നു.
- source_word: ὅσοι ἐλάλησαν
  choice: സംസാരിച്ച എല്ലാവരും
  rationale: ὅσοι-യുടെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും ἐλάλησαν എന്ന ലളിതമായ ‘സംസാരിച്ചു’ എന്ന അർത്ഥവും സംരക്ഷിക്കുന്നു.
- source_word: καὶ κατήγγειλαν
  choice: പ്രഖ്യാപിച്ചു
  rationale: καταγγέλλω പരസ്യമായി അറിയിക്കുക അഥവാ പ്രഖ്യാപിക്കുക എന്നാണ്. പ്രവചനസന്ദർഭം കണക്കിലെടുത്ത് ‘മുൻകൂട്ടി പ്രവചിച്ചു’ എന്ന് വ്യാഖ്യാനാത്മകമായി ചുരുക്കുന്നില്ല; καί ‘-ഉം’ വഴി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὰς ἡμέρας ταύτας
  choice: ഈ നാളുകളെക്കുറിച്ച്
  rationale: ‘ഈ നാളുകൾ’ ഗ്രീക്കിലെ കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു. മലയാളത്തിലെ ‘പ്രഖ്യാപിക്കുക’ എന്ന ക്രിയയോടൊപ്പം വിഷയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘-യെക്കുറിച്ച്’ ചേർക്കുന്നു.
theological_decisions:
- issue: പ്രവാചകന്മാർ ഇപ്പോഴത്തെ രക്ഷാചരിത്രപരമായ കാലഘട്ടത്തെ സൂചിപ്പിക്കുന്നത്
  choice: ഈ നാളുകൾ
  alternative: ഈ കാലം
  rationale: പത്രോസ് പ്രസംഗിക്കുന്ന മിശിഹാസംബന്ധമായ നിവൃത്തിയുടെ കാലത്തെയാണ് ഈ വാക്യം സൂചിപ്പിക്കാൻ സാധ്യത. എന്നാൽ ആ അന്ത്യകാലപരമായ അർത്ഥം വിവർത്തനത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കാതെ ഗ്രീക്കിലെ കാലപരമായ ഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് ഘടനയുടെ പരിധി വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു; ‘അരുളിച്ചെയ്തു’ പോലുള്ള പുരാതന സഭാഭാഷ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
