id: ACT.3.23
reference: Acts 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: ml
  text: എന്നാൽ ആ പ്രവാചകന്റെ വാക്കു കേൾക്കാത്ത ഓരോരുത്തനും ജനത്തിന്റെ ഇടയിൽനിന്ന് പൂർണമായും നശിപ്പിക്കപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനത്തിന്റെ ഇടയിൽനിന്ന് ഛേദിക്കപ്പെടും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: ഏതൊരാളും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോ ആത്മാവും’ എന്നാണെങ്കിലും, ഇവിടെ ψυχή ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘ഏതൊരാളും’ എന്നത് അനാവശ്യമായ ശരീരം–ആത്മാവ് ദ്വൈതസൂചന വരുത്താതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അർഥം നൽകുന്നു.
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: വാക്കു കേൾക്കാത്ത
  rationale: ἥτις ἂν കൂടിയുള്ള ഉപവാക്യം ‘ആരായാലും/ഏതൊരാളും’ എന്ന അനിശ്ചിത പൊതുവ്യവസ്ഥ പ്രകടിപ്പിക്കുന്നു. ἀκούω ഇവിടെ വെറും ശബ്ദം കേൾക്കുന്നതിനെക്കാൾ ശ്രദ്ധയോടെ കേൾക്കുക, ചെവികൊടുക്കുക എന്ന പ്രതികരണാത്മക അർഥം വഹിക്കുന്നു. മലയാളത്തിൽ വ്യക്തിയെ നേരിട്ട് ‘കേൾക്കുക’ എന്നു പറയുന്നതിനെക്കാൾ ‘വാക്കു കേൾക്കുക’ സ്വാഭാവികമാണ്; ‘വാക്ക്’ അർഥവ്യക്തതയ്ക്കായി പരോക്ഷമായി ചേർത്തിരിക്കുന്നു.
- source_word: τοῦ προφήτου ἐκείνου
  choice: ആ പ്രവാചകന്റെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ മോശെയെപ്പോലെയുള്ള നിർദിഷ്ട പ്രവാചകനിലേക്കാണ് ഈ പ്രയോഗം വിരൽചൂണ്ടുന്നത്. ഗ്രീക്കിൽ ഇത് ഔപചാരിക സ്ഥാനനാമമായി അടയാളപ്പെടുത്തിയിട്ടില്ലാത്തതിനാൽ മലയാളത്തിലും സാധാരണ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: ἐξολεθρευθήσεται
  choice: പൂർണമായി നശിപ്പിക്കപ്പെടും
  rationale: ἐξολεθρεύω കേവലം നീക്കംചെയ്യൽ മാത്രമല്ല, സമ്പൂർണമായ നാശം അല്ലെങ്കിൽ ഉന്മൂലനം എന്ന ശക്തമായ ആശയം നൽകുന്നു. ‘പൂർണമായി നശിപ്പിക്കപ്പെടും’ ആ ശക്തി വ്യക്തമായും വായനാസൗകര്യത്തോടെയും നിലനിർത്തുന്നു; ‘ഛേദിക്കപ്പെടും’ എന്ന ഉടമ്പടിസമൂഹപരമായ പശ്ചാത്തലസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τοῦ λαοῦ
  choice: ജനത്തിന്റെ ഇടയിൽനിന്ന്
  rationale: ἐκ എന്ന പദം ജനസമൂഹത്തിന്റെ ഉള്ളിൽനിന്നുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർക്കാതെ ‘ജനത്തിന്റെ ഇടയിൽനിന്ന്’ ഈ സമൂഹപരമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രവാചകന്റെ വാക്കു കേൾക്കാത്തവർക്കുള്ള ന്യായവിധിയുടെ സ്വഭാവം
  choice: നാശത്തെയും ജനത്തിന്റെ ഇടയിൽനിന്നുള്ള നീക്കത്തെയും സൂചിപ്പിക്കുന്ന ഭാഷ ഉപയോഗിച്ചു; അതിന്റെ കാലമോ കൃത്യമായ രീതിയോ നിർവചിച്ചില്ല.
  alternative: ഇത് ഉടമ്പടിസമൂഹത്തിൽനിന്നുള്ള പുറത്താക്കലായി മാത്രം, അല്ലെങ്കിൽ അന്തിമ ദൈവിക ന്യായവിധിയായി മാത്രം വ്യക്തമാക്കുക.
  rationale: വാക്യം കഠിനമായ ദൈവിക ന്യായവിധി പ്രഖ്യാപിക്കുന്നുവെങ്കിലും അത് താൽക്കാലികമാണോ, സമൂഹപരമാണോ, അന്ത്യകാലപരമാണോ എന്ന് സ്വതന്ത്രമായി നിർവചിക്കുന്നില്ല. അതിനാൽ ἐξολεθρευθήσεται എന്നതിന്റെ ശക്തിയും ἐκ τοῦ λαοῦ എന്നതിന്റെ സമൂഹപരമായ അർഥവും നിലനിർത്തിക്കൊണ്ട് ഒരു പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ആത്മാവ്’ എന്ന അക്ഷരാർഥരൂപത്തിന് പകരം വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗവും, കേൾവിയുടെ പ്രതികരണാത്മക അർഥം വ്യക്തമാക്കാൻ ‘വാക്കു കേൾക്കുക’ എന്ന പ്രയോഗവും തെരഞ്ഞെടുത്തു.
