id: ACT.3.19
reference: Acts 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ പാപങ്ങൾ തുടച്ചുനീക്കപ്പെടേണ്ടതിന്[a] മാനസാന്തരപ്പെട്ട് മടങ്ങിവരുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മായിച്ചുകളയപ്പെടേണ്ടതിന്.’
    reason: ἐξαλείφω എന്ന പദത്തിന്റെ എഴുത്ത് മായിച്ചുകളയുന്ന ദൃശ്യരൂപം വ്യക്തമാക്കുന്ന പദപരമായ മറ്റൊരു സാധ്യത.
lexical_decisions:
- source_word: μετανοήσατε
  choice: മാനസാന്തരപ്പെടുക
  rationale: തീരുമാനാത്മകമായ പശ്ചാത്താപത്തിനും ജീവിതദിശയിലെ മാറ്റത്തിനുമുള്ള ആഹ്വാനം പ്രകടമാക്കുന്നു; തുടർന്നുള്ള ἐπιστρέψατε എന്ന പദത്തിന്റെ അർഥം ഇതിൽ അനാവശ്യമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιστρέψατε
  choice: മടങ്ങിവരുക
  rationale: സജീവമായ ആജ്ഞാരൂപവും തിരിച്ചുവരവിന്റെ ദിശാബോധവും നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത കർമപൂരകം ചേർക്കുന്നില്ല.
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: തുടച്ചുനീക്കപ്പെടേണ്ടതിന്
  rationale: πρὸς τό കൂടിയ infinitive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധം നിലനിർത്തുന്നു; മലയാളത്തിൽ വായിക്കാവുന്ന ഉദ്ദേശ്യഘടനയാണ്.
- source_word: ἐξαλειφθῆναι
  choice: തുടച്ചുനീക്കപ്പെടുക
  rationale: ἐξαλείφω എന്ന പദത്തിലെ പൂർണമായി നീക്കംചെയ്യുന്ന ദൃശ്യരൂപവും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപങ്ങൾ
  rationale: ബഹുവചനരൂപത്തെ നേരിട്ടും വ്യാപകമായ അർഥപരിധിയോടെയും നൽകുന്നു.
theological_decisions:
- issue: മാനസാന്തരവും മടങ്ങിവരവും പാപനീക്കവുമായി പുലർത്തുന്ന ബന്ധം
  choice: “പാപങ്ങൾ തുടച്ചുനീക്കപ്പെടേണ്ടതിന്” എന്ന ഉദ്ദേശ്യം/ഫലം തുറന്നുവയ്ക്കുന്ന ഘടന
  alternative: “പാപങ്ങൾ തുടച്ചുനീക്കപ്പെടുന്നതിനാൽ” എന്ന കൂടുതൽ കാരണാത്മകമായോ, ഒരു പ്രത്യേക രക്ഷാക്രമം വ്യക്തമാക്കുന്ന തരത്തിലോ പരിഭാഷപ്പെടുത്തുക
  rationale: വാക്യം ആജ്ഞാപിക്കപ്പെട്ട പ്രതികരണത്തെയും പാപനീക്കത്തെയും ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ആ ബന്ധത്തിന്റെ സമ്പൂർണ സിദ്ധാന്തപരമായ ക്രമം ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾ പദമായ ‘മാനസാന്തരപ്പെടുക’ സാധാരണ വായനക്കാർക്ക് പരിചിതവും മൂലത്തിലെ നൈതിക-ഉടമ്പടിപരമായ ശക്തി വഹിക്കുന്നതുമാണ്; ‘ദൈവത്തിലേക്ക്’ എന്ന മൂലത്തിൽ ഇല്ലാത്ത കർമപൂരകം ചേർത്തിട്ടില്ല.
