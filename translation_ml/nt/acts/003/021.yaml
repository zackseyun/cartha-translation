id: ACT.3.21
reference: Acts 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν ἐλάλησεν ὁ θεὸς διὰ ⸀στόματος τῶν ἁγίων ⸂ἀπ’ αἰῶνος αὐτοῦ προφητῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/021.yaml
  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: ml
  text: ദൈവം പണ്ടുമുതലേ തന്റെ വിശുദ്ധ പ്രവാചകന്മാരുടെ വായിലൂടെ അരുളിച്ചെയ്ത സകലത്തിന്റെയും പുനഃസ്ഥാപനത്തിന്റെ കാലങ്ങൾ വരെ സ്വർഗം അവനെ സ്വീകരിക്കേണ്ടതാകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ ... δέξασθαι
  choice: സ്വീകരിക്കേണ്ടതാകുന്നു
  rationale: ദൈവിക അനിവാര്യത സൂചിപ്പിക്കുന്ന δεῖയും ‘സ്വീകരിക്കുക’ എന്ന δέχομαιയുടെ അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു.
- source_word: ἄχρι χρόνων
  choice: കാലങ്ങൾവരെ
  rationale: χρόνων എന്ന ബഹുവചനം സംരക്ഷിച്ച് സമയപരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀποκαταστάσεως πάντων
  choice: സകലത്തിന്റെയും പുനഃസ്ഥാപനം
  rationale: ἀποκατάστασις എന്നതിലെ തിരികെ സ്ഥാപിക്കൽ/പുനഃസ്ഥാപിക്കൽ എന്ന ആശയം സൂക്ഷിക്കുന്നു; πάντωνന്റെ വ്യാപ്തി വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἐλάλησεν
  choice: അരുളിച്ചെയ്ത
  rationale: ദൈവത്തിന്റെ പ്രവാചകവചനം എന്ന സന്ദർഭത്തിൽ മാന്യവും സ്വാഭാവികവുമായ പ്രയോഗം; ‘പറഞ്ഞു’ എന്ന അടിസ്ഥാന ആശയം നിലനിർത്തുന്നു.
- source_word: διὰ στόματος
  choice: വായിലൂടെ
  rationale: ഗ്രീക്കിലെ ഉപകരണസൂചക രൂപകത്തെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀπ’ αἰῶνος
  choice: പണ്ടുമുതലേ
  rationale: പുരാതനകാലം മുതൽ എന്ന കാലസൂചന ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἀποκαταστάσεως πάντων എന്നതിന്റെ വ്യാപ്തി
  choice: സകലത്തിന്റെയും പുനഃസ്ഥാപനം
  alternative: എല്ലാ കാര്യങ്ങളുടെയും പുനഃസ്ഥാപനം
  rationale: വാക്യം തന്നെ നിർവചിക്കാത്ത അന്തിമ പുനഃസ്ഥാപനത്തിന്റെ കൃത്യമായ വ്യാപ്തിയെ ചുരുക്കുകയോ സാർവത്രിക രക്ഷ എന്ന പ്രത്യേക നിഗമനം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
- issue: ὧν എന്ന ബന്ധസർവനാമത്തിന്റെ ബന്ധം
  choice: ദൈവം ... അരുളിച്ചെയ്ത സകലത്തിന്റെയും
  alternative: സകലത്തിന്റെയും പുനഃസ്ഥാപനത്തെക്കുറിച്ച് ദൈവം ... അരുളിച്ചെയ്ത
  rationale: ὧν എന്നത് πάντωνനോട് ആകർഷിക്കപ്പെട്ട ബന്ധസർവനാമമായി വായിക്കാവുന്നതിനാൽ ‘ദൈവം അരുളിച്ചെയ്ത സകലവും’ എന്ന വ്യാകരണബന്ധം സംരക്ഷിക്കുന്നു; ‘അതിനെക്കുറിച്ച്’ എന്ന് ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
- issue: സ്വർഗത്തിന്റെ വ്യക്തിവൽക്കരിച്ച കർത്തൃത്വം
  choice: സ്വർഗം അവനെ സ്വീകരിക്കേണ്ടതാകുന്നു
  alternative: അവൻ സ്വർഗത്തിൽ സ്വീകരിക്കപ്പെടേണ്ടതാകുന്നു
  rationale: οὐρανὸν എന്ന കർത്തൃപ്രയോഗമുള്ള സജീവഘടനയും മൂലവാക്യത്തിന്റെ രൂപകാത്മക ശക്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ തിരുവെഴുത്തുശൈലി. ‘പുനഃസ്ഥാപനം’, ‘പ്രവാചകന്മാർ’, ‘അരുളിച്ചെയ്ത’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ദിഗ്നിഫൈഡ് പദങ്ങളാണ്; അനാവശ്യമായ സമുദായവിശേഷ പദാവലി ഒഴിവാക്കി.
