id: ACT.3.7
reference: Acts 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: ml
  text: അവന്റെ വലതുകൈ പിടിച്ച് അവനെ എഴുന്നേല്പിച്ചു; ഉടനെ അവന്റെ പാദങ്ങളും കണങ്കാലുകളും[a] ബലപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കണങ്കാലിലെ അസ്ഥികൾ.”
    reason: σφυδρά എന്ന പദത്തിന് സാധ്യമായ കൂടുതൽ ശരീരഘടനാപരമായ അർഥം.
lexical_decisions:
- source_word: πιάσας
  choice: പിടിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള ശാരീരിക പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിന് ചേരാത്ത കടുപ്പമുള്ള ‘പിടിച്ചുവലിച്ച്’ പോലുള്ള പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: τῆς δεξιᾶς χειρός
  choice: വലതുകൈക്കു
  rationale: πιάσας എന്ന ക്രിയയോടൊപ്പമുള്ള ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണപ്രയോഗത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക തുല്യം; കൈ ആരുടേതാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ഗ്രീക്കിൽ ഇല്ലാത്ത ഉടമസ്ഥസർവനാമം ചേർത്തിട്ടില്ല.
- source_word: ἤγειρεν αὐτόν
  choice: അവനെ ... എഴുന്നേല്പിച്ചു
  rationale: ἐγείρωയുടെ ശാരീരികമായി എഴുന്നേല്പിക്കുക എന്ന അർഥം നിലനിർത്തുന്നു; ‘സഹായിച്ചു’ എന്നതിലുപരി മൂലപാഠത്തിലെ നേരിട്ടുള്ള പ്രവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: സൗഖ്യത്തിന്റെ തൽക്ഷണസ്വഭാവം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐστερεώθησαν
  choice: ബലപ്പെട്ടു
  rationale: ശരീരഭാഗങ്ങൾക്ക് ശക്തി ലഭിച്ച ഫലാവസ്ഥ വ്യക്തമാക്കുന്നു; പ്രവർത്തകനെ വാക്യത്തിൽ കൂട്ടിച്ചേർക്കാതെ ഗ്രീക്കിലെ ദൈവിക കർമണിയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αἱ βάσεις αὐτοῦ
  choice: അവന്റെ പാദങ്ങൾ
  rationale: നിൽക്കുന്നതിനുള്ള ശരീരത്തിന്റെ അടിത്തറകളെ സൂചിപ്പിക്കുന്ന βάσεις എന്ന പദത്തിന് ഈ ശരീരസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം; ‘പാദതലങ്ങൾ’ എന്നു പറഞ്ഞ് അനാവശ്യമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: τὰ σφυδρά
  choice: കണങ്കാലുകൾ
  rationale: കണങ്കാൽ പ്രദേശത്തെയോ സന്ധികളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ തുല്യം; ‘കണങ്കാലിലെ അസ്ഥികൾ’ എന്ന കൂടുതൽ പ്രത്യേകമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സൗഖ്യത്തിന്റെ സ്വഭാവവിവരണം
  choice: ശരീരഭാഗങ്ങൾ ഉടനെ ബലപ്പെട്ടുവെന്ന നേരിട്ടുള്ള വിവരണം
  alternative: ‘സൗഖ്യം പ്രാപിച്ചു’ എന്നു വിപുലീകരിക്കുകയോ ഈ ഉപവാക്യത്തിൽ ദൈവിക പ്രവർത്തകനെ വ്യക്തമായി ചേർക്കുകയോ ചെയ്യുക
  rationale: മൂലപാഠം സൗഖ്യത്തെ ശരീരത്തിന്റെ ബലപ്പെടലിലൂടെ മൂർത്തമായി വിവരിക്കുന്നു. അത്ഭുതത്തിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കാതെയും പാഠത്തിൽ വ്യക്തമാക്കാത്ത പ്രവർത്തകനെ ചേർക്കാതെയും ആ വിവരണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘എഴുന്നേല്പിച്ചു,’ ‘ബലപ്പെട്ടു’ എന്നീ രൂപങ്ങൾ മൂലപാഠത്തിന്റെ പ്രവർത്തനക്രമവും തൽക്ഷണഫലവും വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പിന്റെ സൂചിക അതുമായി ബന്ധപ്പെട്ട ‘കണങ്കാലുകൾ’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
