id: ACT.3.11
reference: Acts 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: ml
  text: അവൻ പത്രോസിനെയും യോഹന്നാനെയും മുറുകെ പിടിച്ചുകൊണ്ടിരിക്കുമ്പോൾ[a], അത്യന്തം വിസ്മയിച്ച ജനമെല്ലാം ശലോമോന്റെ മണ്ഡപം എന്നു വിളിക്കപ്പെടുന്ന തൂണുമണ്ഡപത്തിൽ[b] അവരുടെ അടുക്കലേക്ക് ഓടിക്കൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൻ പത്രോസിനെയും യോഹന്നാനെയും പറ്റിപ്പിടിച്ചുകൊണ്ടിരിക്കുമ്പോൾ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് മുറുകെ പിടിക്കുക, പറ്റിപ്പിടിക്കുക എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘തൂണുമണ്ഡപം’ എന്നു പരിഭാഷപ്പെടുത്തിയ പദം ക്ഷേത്രപരിസരത്തിലെ മേൽക്കൂരയുള്ള തൂൺനിരയോടുകൂടിയ നടപ്പുരയെ സൂചിപ്പിക്കുന്നു. അത് പരമ്പരാഗതമായി ‘ശലോമോന്റെ മണ്ഡപം’ എന്ന് അറിയപ്പെട്ടിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: അവൻ ... മുറുകെ പിടിച്ചുനിൽക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. κρατέω ഇവിടെ പിടിച്ചുനിൽക്കുക/മുറുകെ പിടിക്കുക എന്ന ശക്തമായ ശാരീരിക അർത്ഥം നൽകുന്നു; വികാരപരമായ ഉദ്ദേശ്യം അധികമായി ചേർക്കാതെ അത് നിലനിർത്തുന്നു.
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: പത്രോസിനെയും യോഹന്നാനെയും
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: συνέδραμεν
  choice: ഓടിക്കൂടി
  rationale: ഒരുമിച്ച് ഓടിവന്ന് ഒരു സ്ഥലത്ത് കൂടിച്ചേരുക എന്ന συντρέχω എന്ന ക്രിയയുടെ ചലനവും കൂട്ടായ അർത്ഥവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πᾶς ὁ λαὸς
  choice: ജനമെല്ലാം
  rationale: ക്ഷേത്രപരിസരത്തുണ്ടായിരുന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സമഗ്രത നിലനിർത്തുന്നു; ‘പുരുഷാരം’ എന്ന കൂടുതൽ ഇടുങ്ങിയ വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരുടെ അടുക്കലേക്ക്
  rationale: വ്യക്തികളിലേക്കുള്ള ദിശയും ചലനവും സൂചിപ്പിക്കുന്ന πρός + accusative സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τῇ στοᾷ
  choice: മണ്ഡപത്തിൽ
  rationale: στοά ക്ഷേത്രപരിസരത്തിലെ മേൽക്കൂരയുള്ള തൂൺനിരയോടുകൂടിയ നടപ്പുരയെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ വായനാസൗകര്യമുള്ള ‘മണ്ഡപം’ ഉപയോഗിച്ച് കൃത്യമായ സാംസ്കാരിക വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: ശലോമോന്റേത് എന്നു വിളിക്കപ്പെടുന്ന
  rationale: καλουμένῃ എന്നതിലെ ‘വിളിക്കപ്പെടുന്ന/അറിയപ്പെടുന്ന’ അർത്ഥവും സ്ഥലനാമത്തിലെ ഉടമസ്ഥരൂപവും നിലനിർത്തുന്നു; അത് യഥാർത്ഥ ഉടമസ്ഥതയാണെന്ന് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἔκθαμβοι
  choice: അത്യന്തം വിസ്മയിച്ച
  rationale: ἔκθαμβος സൂചിപ്പിക്കുന്ന ശക്തമായ അമ്പരപ്പിന്റെ തീവ്രത ‘അത്യന്തം’ എന്ന പദത്തിലൂടെ സംരക്ഷിക്കുന്നു.
