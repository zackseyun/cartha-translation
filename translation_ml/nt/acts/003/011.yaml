translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഓടിക്കൂടി’ എന്ന സ്വാഭാവിക ക്രിയ ഗ്രീക്കിലെ വേഗത്തിലുള്ള കൂട്ടായ ചലനം സംരക്ഷിക്കുന്നു. പ്രധാനവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട അടിക്കുറിപ്പുകളുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
