source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: ml
  text: അമ്മയുടെ ഗർഭംമുതൽ മുടന്തനായ ഒരു മനുഷ്യനെ ചുമന്നുകൊണ്ടുവരുമായിരുന്നു. ദേവാലയത്തിലേക്കു പ്രവേശിക്കുന്നവരിൽനിന്ന് ദാനധർമ്മം ചോദിക്കാൻ, “സുന്ദരം” എന്നു വിളിക്കപ്പെട്ടിരുന്ന ദേവാലയകവാടത്തിൽ അവർ അവനെ ദിവസവും വയ്ക്കുമായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ദേവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, ദേവാലയസമുച്ചയത്തെയോ പരിസരത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: “അമ്മയുടെ ഗർഭംമുതൽ” എന്നതിന് പകരം “ജനനംമുതൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: ഒരു മനുഷ്യൻ
  rationale: τις ഒരു നിർദിഷ്ടനാണെങ്കിലും ഇതുവരെ പരിചയപ്പെടുത്താത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων
  choice: അമ്മയുടെ ഗർഭംമുതൽ മുടന്തനായിരുന്ന
  rationale: ജനനംമുതലുള്ള തുടർച്ചയായ അവസ്ഥയും മൂലഭാഷയിലെ ഗർഭരൂപകവും നിലനിർത്തുന്നു; ὑπάρχων എന്നതിന്റെ നിലാവസ്ഥ ‘ആയിരുന്ന’ എന്നതിൽ സ്വാഭാവികമായി ഉൾപ്പെടുന്നു.
- source_word: ἐβαστάζετο
  choice: ചുമന്നുകൊണ്ടുവരുമായിരുന്നു
  rationale: അപൂർണ ഭൂതകാലത്തിന്റെ ആവർത്തിത/പതിവായ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സന്ദർഭം അനുസരിച്ച് കവാടത്തിലേക്കുള്ള കൊണ്ടുവരലും വ്യക്തമാക്കുന്നു.
- source_word: ἐτίθουν καθ’ ἡμέραν
  choice: അവർ അവനെ ദിവസവും ഇരുത്തുമായിരുന്നു
  rationale: ἐτίθουν എന്ന അപൂർണ ഭൂതകാലത്തിന്റെ പതിവായ പ്രവർത്തനം നിലനിർത്തുന്നു. ഭിക്ഷ ചോദിക്കുന്ന വ്യക്തിയെ കവാടത്തിനരികെ ‘വയ്ക്കുക’ എന്നതിനേക്കാൾ ‘ഇരുത്തുക’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: θύραν τοῦ ἱεροῦ
  choice: ദേവാലയകവാടം
  rationale: പൊതു വാസ്തുവിദ്യാസന്ദർഭത്തിൽ θύρα ‘കവാടം’ എന്നാണ്; ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, മുഴുവൻ ദേവാലയപരിസരത്തെയും സൂചിപ്പിക്കാം.
- source_word: τὴν λεγομένην Ὡραίαν
  choice: “സുന്ദരം” എന്നു വിളിക്കപ്പെടുന്ന
  rationale: Ὡραίαν എന്ന കവാടനാമത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുകയും അത് ഒരു പേരാണെന്ന് ഉദ്ധരണിചിഹ്നങ്ങളിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: ഭിക്ഷ ചോദിക്കേണ്ടതിന്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യാർഥം ‘ചോദിക്കേണ്ടതിന്’ വ്യക്തമാക്കുന്നു; ἐλεημοσύνη ഈ സാഹചര്യത്തിൽ ദരിദ്രർക്കു നൽകുന്ന സഹായമായ ‘ഭിക്ഷ’യെ സൂചിപ്പിക്കുന്നു.
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: ദേവാലയത്തിലേക്കു പ്രവേശിക്കുന്നവരോടു
  rationale: അകത്തേക്കു പ്രവേശിക്കുന്ന ആളുകളിൽനിന്നാണ് അഭ്യർഥന എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘അവരോടു ചോദിക്കുക’ എന്നു നൽകുന്നു.
