revisions:
- from: അമ്മയുടെ ഗർഭംമുതൽ മുടന്തനായിരുന്ന ഒരു മനുഷ്യനെ ചിലർ ചുമന്നുകൊണ്ടുവരുമായിരുന്നു. ദേവാലയത്തിലേക്കു പ്രവേശിക്കുന്നവരോടു ഭിക്ഷ ചോദിക്കേണ്ടതിന്, “സുന്ദരം” എന്നു വിളിക്കപ്പെടുന്ന ദേവാലയകവാടത്തിനരികെ അവർ അവനെ ദിവസവും ഇരുത്തുമായിരുന്നു.[a][b]
  to: അമ്മയുടെ ഗർഭംമുതൽ മുടന്തനായ ഒരു മനുഷ്യനെ ചുമന്നുകൊണ്ടുവരുമായിരുന്നു. ദേവാലയത്തിലേക്കു പ്രവേശിക്കുന്നവരിൽനിന്ന് ദാനധർമ്മം ചോദിക്കാൻ, “സുന്ദരം” എന്നു വിളിക്കപ്പെട്ടിരുന്ന ദേവാലയകവാടത്തിൽ അവർ അവനെ ദിവസവും വയ്ക്കുമായിരുന്നു.[a][b]
  rationale: The revision removes the added specification ‘ചിലർ,’ restores the exact placement ‘at the gate,’ and uses ‘ദാനധർമ്മം’ for the alms requested. It retains the imperfect habitual sense in both actions, the literal gate designation, and the temple-precinct distinction in the footnote. Footnote b is recast as a genuine lexical alternative.
