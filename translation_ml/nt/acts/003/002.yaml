  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ആവർത്തിത ഭൂതകാലപ്രവർത്തനങ്ങൾക്ക് ‘-മുമായിരുന്നു’ പ്രയോഗിച്ചു. ‘സുന്ദരം’ എന്ന കവാടനാമം മൂലഭാഷയോട് ചേർന്ന് നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
