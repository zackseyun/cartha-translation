id: ACT.3.15
reference: Acts 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: ml
  text: എന്നാൽ ജീവന്റെ ഉറവിടമായവനെ[a] നിങ്ങൾ കൊന്നു, ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു; ഇതിന്[b] ഞങ്ങൾ സാക്ഷികളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജീവന്റെ നായകനെ,’ ‘ജീവന്റെ ആദികർത്താവിനെ,’ അല്ലെങ്കിൽ ‘ജീവന്റെ അധിപനെ.’ ἀρχηγός എന്ന ഗ്രീക്ക് പദത്തിന് ഉത്ഭവം, നേതൃത്വം, പ്രാമുഖ്യം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അവനെക്കുറിച്ച് ഞങ്ങൾ സാക്ഷികളാണ്.’ ഗ്രീക്ക് പ്രയോഗം ഉയിർത്തെഴുന്നേറ്റവനെത്തന്നെയോ അവന്റെ പുനരുത്ഥാനമെന്ന വസ്തുതയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കുറ്റാരോപണവുമായി ബന്ധിപ്പിക്കുമ്പോൾ ഇവിടെ നേരിയ വൈരുധ്യവും ഊന്നലും ഉണ്ട്; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀρχηγὸν τῆς ζωῆς
  choice: ജീവന്റെ ഉറവിടമായവനെ
  rationale: ἀρχηγός എന്ന പദത്തിൽ ആരംഭം, ഉത്ഭവം, നേതൃത്വം, പ്രാമുഖ്യം എന്നീ അർഥസാധ്യതകളുണ്ട്. ജീവൻ നൽകുന്നവനെത്തന്നെ അവർ കൊന്നു എന്ന വാക്യത്തിലെ വൈരുധ്യം ‘ജീവന്റെ ഉറവിടമായവൻ’ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; നേതൃത്വസംബന്ധമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπεκτείνατε
  choice: നിങ്ങൾ കൊന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കുറ്റാരോപണം ലളിതവും ശക്തവുമായി പകർന്നിരിക്കുന്നു; ‘വധിച്ചു’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  rationale: ἐκ νεκρῶν എന്ന പ്രയോഗത്തിലെ ‘മരിച്ചവരുടെ ഇടയിൽനിന്ന്’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് പുനരുത്ഥാനത്തെ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: οὗ
  choice: ഇതിന്
  rationale: സമീപമുള്ള പുനരുത്ഥാനസംഭവത്തെയാണ് സാക്ഷ്യം സൂചിപ്പിക്കുന്നതെന്ന വായന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. ഉയിർത്തെഴുന്നേറ്റ വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: μάρτυρές ἐσμεν
  choice: ഞങ്ങൾ സാക്ഷികളാണ്
  rationale: ഗ്രീക്കിലെ നാമപദപ്രയോഗം നിലനിർത്തി അപ്പൊസ്തലന്മാരുടെ സാക്ഷിസ്ഥാനം ഊന്നിപ്പറയുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ἀρχηγός എന്ന വിശേഷണം
  choice: ജീവന്റെ ഉറവിടമായവൻ
  alternative: ജീവന്റെ നായകൻ; ജീവന്റെ ആദികർത്താവ്; ജീവന്റെ അധിപൻ
  rationale: മൂലപദത്തിന്റെ ഉത്ഭവവും നേതൃത്വവും ഉൾപ്പെടുന്ന വിശാലമായ അർഥപരിധിയിൽ, ഈ സന്ദർഭത്തിലെ ജീവനും മരണവും തമ്മിലുള്ള വൈരുധ്യം മുഖ്യപാഠത്തിൽ വ്യക്തമായി വരുത്തുന്നു. മറ്റു സാധുവായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നതിലൂടെ ഒരു പ്രത്യേക ക്രിസ്തുശാസ്ത്ര വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: οὗ എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചന
  choice: പുനരുത്ഥാനസംഭവം—‘ഇതിന്’
  alternative: ഉയിർത്തെഴുന്നേറ്റ യേശു—‘അവന്/അവനെക്കുറിച്ച്’
  rationale: ഗ്രീക്ക് രൂപം ഉയിർത്തെഴുന്നേറ്റ വ്യക്തിയെയോ അവന്റെ പുനരുത്ഥാനമെന്ന വസ്തുതയെയോ സൂചിപ്പിക്കാൻ ഇടയുണ്ട്. സന്ദർഭത്തിലെ പ്രഖ്യാപനത്തിന്റെ കേന്ദ്രമായ പുനരുത്ഥാനവസ്തുത മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നേരിട്ടുള്ള കുറ്റാരോപണവും പുനരുത്ഥാനപ്രഖ്യാപനവും വ്യക്തമായി നിലനിർത്തി; അപരിചിതമായ പദാവലിക്കുപകരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു.
