id: ACT.3.5
reference: Acts 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπεῖχεν αὐτοῖς προσδοκῶν τι παρ’ αὐτῶν λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/005.yaml
  text: So he fixed his attention on them[a], expecting to receive something from them.
translation:
  language: ml
  text: അവരിൽനിന്ന് എന്തെങ്കിലും ലഭിക്കുമെന്നു പ്രതീക്ഷിച്ചുകൊണ്ട് അവൻ അവരെ ശ്രദ്ധിച്ചുനോക്കിക്കൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർക്ക് ശ്രദ്ധ നൽകി’ / ‘അവരിലേക്കു ശ്രദ്ധ തിരിച്ചു.’
    reason: ἐπεῖχεν എന്നതിന് ഇവിടെ അവരുടെമേൽ ശ്രദ്ധ പതിപ്പിക്കുകയോ ശ്രദ്ധ നൽകുകയോ ചെയ്തു എന്ന അർഥമാണ്.
lexical_decisions:
- source_word: ὁ δὲ
  choice: അയാൾ
  rationale: ὁ മുമ്പ് പരാമർശിച്ച നടക്കാൻ കഴിയാത്ത മനുഷ്യനെ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ കഥയുടെ സ്വാഭാവിക പുരോഗതി അടയാളപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: ἐπεῖχεν
  choice: ശ്രദ്ധ കേന്ദ്രീകരിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ἐπέχω ഒരാളുടെ നേരെ ശ്രദ്ധ തിരിച്ച് നിലനിർത്തുക എന്ന അർഥത്തിലാണ്; അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാഭാവം ഈ പ്രയോഗം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: αὐτοῖς
  choice: അവരുടെ നേരെ
  rationale: പ്രയോഗസന്ദർഭത്തിൽ പത്രോസിനെയും യോഹന്നാനെയും സൂചിപ്പിക്കുന്നു; ‘ശ്രദ്ധ കേന്ദ്രീകരിച്ചു’ എന്നതിനോടൊപ്പം ‘അവരുടെ നേരെ’ സ്വാഭാവികമാണ്.
- source_word: προσδοκῶν
  choice: പ്രതീക്ഷിച്ച്
  rationale: അയാളുടെ ശ്രദ്ധയോടൊപ്പം നടന്ന പ്രതീക്ഷാഭാവം വർത്തമാനകാല പങ്കുപദം പ്രകടിപ്പിക്കുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: ലഭിക്കുമെന്ന് കരുതിയ വസ്തു വ്യക്തമാക്കാത്ത അനിശ്ചിത സർവനാമത്തിന്റെ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ദാനമായിരിക്കാമെങ്കിലും മൂലവാക്യം അത് തുറന്നുപറയുന്നില്ല.
- source_word: παρ’ αὐτῶν
  choice: അവരിൽനിന്ന്
  rationale: ജനിറ്റീവിനോടുകൂടിയ παρά ഇവിടെ ലഭിക്കുന്നതിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നു.
- source_word: λαβεῖν
  choice: ലഭിക്കുമെന്നു
  rationale: ദാനം സ്വീകരിക്കുന്ന സന്ദർഭത്തിന് അനുയോജ്യമായി ‘ലഭിക്കുക’ ഉപയോഗിച്ചു; പ്രതീക്ഷയുടെ ഉള്ളടക്കമായി മലയാളത്തിൽ സ്വാഭാവികമായ ആശ്രിതരൂപം നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ദാനത്തെക്കുറിച്ചുള്ള സൂചനയെ ‘ഭിക്ഷ’ എന്നു തുറന്നുപറഞ്ഞ് പരിമിതപ്പെടുത്തിയിട്ടില്ല; ‘എന്തെങ്കിലും’ എന്ന അനിശ്ചിതത്വം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
