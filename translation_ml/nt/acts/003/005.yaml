  to: അവരിൽനിന്ന് എന്തെങ്കിലും ലഭിക്കുമെന്നു പ്രതീക്ഷിച്ചുകൊണ്ട് അവൻ അവരെ ശ്രദ്ധിച്ചുനോക്കിക്കൊണ്ടിരുന്നു.[a]
