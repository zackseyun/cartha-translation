id: ACT.3.18
reference: Acts 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: ml
  text: എന്നാൽ, തന്റെ മശീഹ കഷ്ടം അനുഭവിക്കുമെന്ന് എല്ലാ പ്രവാചകരുടെയും വായിലൂടെ മുൻകൂട്ടി അറിയിച്ചിരുന്നതു ദൈവം ഇങ്ങനെ നിറവേറ്റി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ ജനങ്ങൾ ചെയ്തതിനോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προκατήγγειλεν
  choice: മുൻകൂട്ടി അറിയിച്ചിരുന്നത്
  rationale: ക്രിയയിലെ മുൻകാല പ്രഖ്യാപനത്തിന്റെ ആശയവും, പിന്നീട് നടന്ന നിറവേറ്റലിനോടുള്ള കാലബന്ധവും നിലനിർത്തുന്നു.
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: എല്ലാ പ്രവാചകരുടെയും വായിലൂടെ
  rationale: ‘വായിലൂടെ’ എന്ന മൂലപാഠത്തിലെ സാക്ഷാൽ ബൈബിൾ പ്രയോഗവും πάντων എന്നതിലെ ‘എല്ലാ’ എന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: παθεῖν
  choice: കഷ്ടം അനുഭവിക്കുമെന്ന്
  rationale: പ്രവചനത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ വ്യക്തമായി ഇല്ലാത്ത നിർബന്ധത്തിന്റെ ആശയം ചേർക്കുന്നില്ല.
- source_word: τὸν χριστὸν αὐτοῦ
  choice: തന്റെ മശീഹ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; αὐτοῦ ദൈവം നിയോഗിച്ച അവന്റെ മശീഹയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπλήρωσεν
  choice: നിറവേറ്റി
  rationale: പ്രവചനനിവൃത്തിയുടെ സന്ദർഭത്തിൽ πληρόω എന്നതിന്റെ വ്യക്തവും പതിവുമായ മലയാള പരിഭാഷയാണ്.
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: മശീഹയുടെ കഷ്ടാനുഭവത്തിലൂടെ ദൈവം മുൻപ്രഖ്യാപനം ഏതു വിധത്തിൽ നിറവേറ്റിയെന്നത് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ഈ പദം വ്യക്തിനാമത്തേക്കാൾ പദവിനാമമായി പ്രവർത്തിക്കുന്നു; പത്രോസിന്റെ യഹൂദ മശീഹാപരമായ പ്രസംഗസന്ദർഭം ‘മശീഹ’ കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: παθεῖν എന്നതിലെ ഭാവാർഥം
  choice: കഷ്ടം അനുഭവിക്കുമെന്ന്
  alternative: കഷ്ടം അനുഭവിക്കേണ്ടതാണെന്ന്
  rationale: പ്രവാചകർ മുൻകൂട്ടി അറിയിച്ച ഉള്ളടക്കം വ്യക്തമാക്കുന്നു; എന്നാൽ ഈ അനന്തക്രിയാരൂപം തനിയെ പ്രസ്താവിക്കാത്ത നിർബന്ധം പരിഭാഷയിൽ അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘വായിലൂടെ’ എന്ന ബൈബിൾ പ്രയോഗം മൂലപാഠസാന്നിധ്യം നിലനിർത്താൻ സൂക്ഷിച്ചു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
