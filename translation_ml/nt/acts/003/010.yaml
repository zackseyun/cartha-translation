  to: 'അവർ അവനെ തിരിച്ചറിഞ്ഞു: ദൈവാലയത്തിന്റെ[b] സുന്ദരകവാടത്തിൽ ഭിക്ഷയ്ക്കായി ഇരിക്കാറുണ്ടായിരുന്നത് ഇയാൾ തന്നെയാണെന്ന്.[a] അവന് സംഭവിച്ചതിനെക്കുറിച്ച് അവർ അത്ഭുതവും അമ്പരപ്പുംകൊണ്ട് നിറഞ്ഞു.'
