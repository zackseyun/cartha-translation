id: ACT.3.10
reference: Acts 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: ml
  text: 'അവർ അവനെ തിരിച്ചറിഞ്ഞു: ദൈവാലയത്തിന്റെ[b] സുന്ദരകവാടത്തിൽ ഭിക്ഷയ്ക്കായി ഇരിക്കാറുണ്ടായിരുന്നത് ഇയാൾ തന്നെയാണെന്ന്.[a] അവന് സംഭവിച്ചതിനെക്കുറിച്ച് അവർ അത്ഭുതവും അമ്പരപ്പുംകൊണ്ട് നിറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: ‘ഭിക്ഷയ്ക്കായി ഇരിക്കുന്നയാൾ.’ ഇവിടെ മുമ്പ് പതിവായി അവിടെ ഇരുന്നിരുന്നുവെന്ന വിവരണാർഥമാണ് ‘ഇരിക്കാറുണ്ടായിരുന്നത്’ വ്യക്തമാക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവാലയം’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം (ἱερόν) അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, പൊതുവെ മുഴുവൻ ദൈവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: തിരിച്ചറിഞ്ഞ
  rationale: ആൾക്കൂട്ടം അവനെ മുമ്പ് പരിചയമുള്ള ഭിക്ഷക്കാരനായി തിരിച്ചറിഞ്ഞുവെന്ന ആശയം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δὲ
  choice: അവർ
  rationale: δέ നേരിയ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ കർത്താവിലൂടെ തുടർച്ച വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: οὗτος ἦν
  choice: ഇയാൾതന്നെയാണെന്ന്
  rationale: സൗഖ്യം പ്രാപിച്ച വ്യക്തി മുമ്പ് അറിയപ്പെട്ടിരുന്ന അതേ മനുഷ്യനാണെന്ന ഊന്നൽ ‘തന്നെ’ നിലനിർത്തുന്നു.
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: ഭിക്ഷയ്ക്കായി ഇരിക്കാറുണ്ടായിരുന്നത്
  rationale: നാമവൽക്കരിച്ച വർത്തമാനകൃത്ത് സന്ദർഭത്തിൽ പതിവായി ചെയ്തിരുന്ന പ്രവൃത്തിയെ വിവരിക്കുന്നു; ‘ഇരിക്കാറുണ്ടായിരുന്നത്’ ആ പതിവുസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἐλεημοσύνην
  choice: ഭിക്ഷ
  rationale: ദരിദ്രന് നൽകുന്ന ധനസഹായത്തെ ഈ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്ന മലയാളപദമാണ്.
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: സുന്ദരകവാടത്തിൽ
  rationale: Ὡραία കവാടത്തിന്റെ പേരായി പ്രവർത്തിക്കുന്നു; മലയാള ബൈബിൾ ശൈലിയിൽ ഒറ്റപ്പദമായ ‘സുന്ദരകവാടം’ സ്വാഭാവികമാണ്.
- source_word: τοῦ ἱεροῦ
  choice: ദൈവാലയത്തിന്റെ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദൈവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ ‘ദൈവാലയം’ വായനാസൗകര്യമുള്ള പ്രമാണപദമാണ്.
- source_word: ἐπλήσθησαν
  choice: നിറഞ്ഞു
  rationale: വികാരങ്ങളെ സൂചിപ്പിക്കുന്ന ഷഷ്ഠിവിഭക്തി നാമങ്ങളോടുള്ള ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: θάμβους
  choice: അത്ഭുതം
  rationale: സ്തംഭിപ്പിക്കുന്ന വിസ്മയത്തെ സൂചിപ്പിക്കുകയും പിന്നാലെയുള്ള ἔκστασις എന്ന പദത്തിൽനിന്ന് അർത്ഥവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκστάσεως
  choice: അമ്പരപ്പ്
  rationale: ഈ സന്ദർഭത്തിൽ മിസ്റ്റിക്കൽ പരവശതയല്ല, സ്വയംമറക്കുന്ന തരത്തിലുള്ള ആശ്ചര്യാവസ്ഥയാണ്; ‘അമ്പരപ്പ്’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: അവന് സംഭവിച്ചതിനെക്കുറിച്ച്
  rationale: സംഭവിച്ച കാര്യം ഇപ്പോഴും പ്രസക്തമാണെന്ന perfect participle-ന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് വികാരങ്ങളുടെ കാരണവിഷയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
