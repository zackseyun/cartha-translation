translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പതിവുപ്രവൃത്തിയും തിരിച്ചറിയലിലെ ഊന്നലും വ്യക്തമാക്കാൻ ‘ഇരിക്കാറുണ്ടായിരുന്നത്’, ‘ഇയാൾതന്നെ’ എന്നിവ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
