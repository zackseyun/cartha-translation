id: ACT.3.1
reference: Acts 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: ml
  text: പ്രാർത്ഥനയുടെ സമയമായ ഒമ്പതാം മണിക്കൂറിൽ[a] പത്രോസും യോഹന്നാനും ദേവാലയത്തിലേക്കു കയറിപ്പോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഇന്നത്തെ സമയഗണനപ്രകാരം ഏകദേശം ഉച്ചകഴിഞ്ഞ് മൂന്നുമണി.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക തുടർച്ചയിൽ അതിന്റെ ധർമ്മം വ്യക്തമായതിനാൽ ‘എന്നാൽ’ എന്നോ കാലസൂചകമായ ‘അപ്പോൾ’ എന്നോ ചേർത്തിട്ടില്ല.
- source_word: ἀνέβαινον
  choice: കയറിപ്പോകുകയായിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെന്ന ഭാവം സംരക്ഷിക്കുന്നു; യെരൂശലേമിലേക്കും ദേവാലയത്തിലേക്കും ‘കയറിപ്പോകുക’ എന്ന ഉറവിടഭാഷയിലെ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ἱερόν
  choice: ദേവാലയം
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, വിശാലമായ ദേവാലയപരിസരത്തെയും സൂചിപ്പിക്കാം. സാധാരണ വായനയിൽ സ്വാഭാവികമായ ‘ദേവാലയം’ ഈ അർഥവ്യാപ്തി അനാവശ്യ വിശദീകരണമില്ലാതെ നൽകുന്നു.
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: പ്രാർഥനാസമയമായ
  rationale: നിശ്ചിത പ്രാർഥനാസമയത്തോടനുബന്ധിച്ചുള്ള യാത്രയാണെന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν ἐνάτην
  choice: ഒമ്പതാം മണിക്കൂറിൽ
  rationale: പുരാതന യഹൂദ സമയഗണന പാഠത്തിൽ തന്നെ നിലനിർത്തുന്നു; ഇന്നത്തെ സമയത്തിന് തുല്യമായ ഏകദേശ സമയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കയറിപ്പോകുകയായിരുന്നു’ എന്ന രൂപം മൂലത്തിലെ അപൂർണഭൂതകാലഭാവം നിലനിർത്തുന്നു; സമയക്രമം വായനാസൗകര്യത്തിനായി വാക്യത്തിന്റെ തുടക്കത്തിൽ വെച്ചിരിക്കുന്നു.
