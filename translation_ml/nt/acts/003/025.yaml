id: ACT.3.25
reference: Acts 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: ml
  text: 'നിങ്ങൾ പ്രവാചകന്മാരുടെ പുത്രന്മാരും ദൈവം നിങ്ങളുടെ പിതാക്കന്മാരുമായി ചെയ്ത ഉടമ്പടിയുടെ അവകാശികളുമാണ്[a]. ദൈവം അബ്രാഹാമിനോട് ഇങ്ങനെ പറഞ്ഞു: “നിന്റെ സന്തതിയിൽ[b] ഭൂമിയിലെ സകല കുടുംബങ്ങളും അനുഗ്രഹിക്കപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഉടമ്പടിയുടെ പുത്രന്മാർ.” ഇവിടെ “പുത്രന്മാർ” എന്നത് ഉടമ്പടിയിലെ അവകാശികളും പങ്കാളികളും എന്ന അർഥമുള്ള പ്രതിനിധിപ്രയോഗമാണ്; “മക്കൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “വിത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പദത്തിന് അബ്രാഹാമിന്റെ സന്തതിയെ സമൂഹമായി സൂചിപ്പിക്കാനും, ബൈബിൾ-ദൈവശാസ്ത്രപരമായ സന്ദർഭത്തിൽ ഏക പ്രതിനിധിയെ സൂചിപ്പിക്കാനും കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ജൈവബന്ധത്തേക്കാൾ പ്രവാചകവാഗ്ദാനങ്ങളുടെ പാരമ്പര്യത്തിലും അവകാശത്തിലും പങ്കുള്ളവരെന്ന ഉടമ്പടിസംബന്ധമായ പ്രയോഗമാണ്.
- source_word: προφητῶν
  choice: പ്രവാചകന്മാരുടെ
  rationale: ഷഷ്ഠിവിഭക്തിയുടെ ബന്ധം നേരിട്ട് പകരുന്നു; ഓരോ പ്രവാചകന്റെയും ജൈവസന്തതി എന്നല്ല, അവരുടെ വാഗ്ദാനപാരമ്പര്യത്തിൽ നിൽക്കുന്നവർ എന്നാണ് സന്ദർഭാർഥം.
- source_word: διαθήκης
  choice: ഉടമ്പടി
  rationale: അബ്രാഹാമിനോടും പിതാക്കന്മാരോടുമുള്ള ദൈവിക ബന്ധക്രമത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിലെ പതിവും കൃത്യവുമായ ബൈബിൾപദം.
- source_word: διέθετο
  choice: ചെയ്ത
  rationale: ഉടമ്പടി സ്ഥാപിച്ചു എന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉടമ്പടി ചെയ്തു’ എന്നു പകരുന്നു.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാരുമായി
  rationale: πρός എന്നതിന്റെ അടിസ്ഥാനബന്ധം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിലെ ‘ഉടമ്പടി ചെയ്യുക’ എന്ന പ്രയോഗത്തിന് ‘മായി’ സ്വാഭാവികമാണ്.
- source_word: λέγων πρὸς Ἀβραάμ
  choice: ദൈവം അബ്രാഹാമിനോട് ഇങ്ങനെ പറഞ്ഞു
  rationale: ഗ്രീക്ക് കൃുദന്തരൂപത്തെ വ്യക്തമായ മലയാളവാക്യമായി പകരുന്നു; സംസാരിക്കുന്നയാൾ ദൈവമാണെന്ന ബന്ധം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: σπέρματί
  choice: സന്തതിയിൽ
  rationale: σπέρμα എന്ന പദത്തിന്റെ സമൂഹവാചകമായ അബ്രാഹാമിക സന്തതി എന്ന അർഥവും ഏകവചന പ്രതിനിധിസാധ്യതയും ഒരുപോലെ തുറന്നുവെക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ἐνευλογηθήσονται
  choice: അനുഗ്രഹിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πατριαὶ
  choice: കുടുംബങ്ങൾ
  rationale: കുടുംബഗണങ്ങളെയോ വംശകൂട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് വിശാലവും സ്വാഭാവികവുമായ തർജമ.
- source_word: γῆς
  choice: ഭൂമിയിലെ
  rationale: അബ്രാഹാമിക വാഗ്ദാനത്തിന്റെ സാർവലൗകിക വ്യാപ്തി ഇവിടെ ‘ദേശം’ എന്നതിനെക്കാൾ ‘ഭൂമി’ വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: υἱοὶ എന്ന പ്രതിനിധിപരമായ പുല്ലിംഗപ്രയോഗം
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗവും ഉടമ്പടിയിലെ അവകാശിപ്രയോഗവും പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; സ്ത്രീകളെ ഒഴിവാക്കുന്നതല്ലെന്ന വിശാലപ്രതിനിധ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ‘പ്രവാചകന്മാരുടെ പുത്രന്മാരും ഉടമ്പടിയുടെയും’ എന്ന ഗ്രീക്ക് സമാന്തരഘടനയുടെ മലയാളവത്കരണം
  choice: പ്രവാചകന്മാരുടെ പുത്രന്മാരും ... ഉടമ്പടിയുടെ അവകാശികളുമാണ്
  alternative: പ്രവാചകന്മാരുടെയും ... ഉടമ്പടിയുടെയും പുത്രന്മാരാണ്
  rationale: ‘ഉടമ്പടിയുടെ പുത്രന്മാർ’ എന്ന ശബ്ദാനുവാദം മലയാളത്തിൽ അസ്വാഭാവികവും അവ്യക്തവുമാകുന്നതിനാൽ അതിന്റെ പങ്കാളിത്ത-അവകാശി അർഥം തുറന്നുപറയുന്നു; എന്നാൽ പ്രവാചകന്മാരോടുള്ള ‘പുത്രന്മാർ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- issue: σπέρμα എന്ന അബ്രാഹാമിക വാഗ്ദാനപദത്തിന്റെ സംഖ്യാർഥം
  choice: സന്തതി
  alternative: വിത്ത് / സന്തതികൾ / ഒരു സന്തതി
  rationale: സമൂഹവാചകവും ഏക പ്രതിനിധിയെ സൂചിപ്പിക്കാവുന്നതുമായ അർഥസാധ്യത നിർബന്ധമായി ഒന്നിലേക്കു ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ മലയാളം. ‘ഉടമ്പടി’, ‘സന്തതി’, ‘അനുഗ്രഹിക്കപ്പെടും’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അസ്വാഭാവികമായ ‘ഉടമ്പടിയുടെ പുത്രന്മാർ’ എന്ന രൂപം അർഥവ്യക്തതയ്ക്കായി പ്രധാനവാചകത്തിൽ ‘ഉടമ്പടിയുടെ അവകാശികൾ’ എന്നു പകർന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകി.
