  terminology: ‘പ്രവാചകന്മാർ,’ ‘ഉടമ്പടി,’ ‘പിതാക്കന്മാർ,’ ‘സന്തതി,’ ‘അനുഗ്രഹിക്കപ്പെടും’ എന്നിവ സ്ഥിരതയുള്ളതും ബൈബിൾസന്ദർഭത്തിന് അനുയോജ്യവുമാണ്. ‘ഭൂമിയിലെ സകല കുടുംബങ്ങളും’ πατριαὶ τῆς γῆς എന്നതിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു. അടിക്കുറിപ്പുകൾ ശരിയായ ആങ്കറുകളിൽ ചേർത്തിരിക്കുന്നു.
