  text: Καὶ νῦν, ἀδελφοί, οἶδα ὅτι κατὰ ἄγνοιαν ἐπράξατε, ὥσπερ καὶ οἱ ἄρχοντες ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: ml
  text: ഇപ്പോഴാകട്ടെ, സഹോദരന്മാരേ[a], നിങ്ങൾ അറിവില്ലായ്മയിൽ പ്രവർത്തിച്ചുവെന്ന് എനിക്കറിയാം; നിങ്ങളുടെ ഭരണാധികാരികളും അങ്ങനെതന്നെ പ്രവർത്തിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘സഹോദരന്മാരേ’ എന്നാണ്, എന്നാൽ ഈ പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട വിശാലമായ സമൂഹത്തെ പ്രതിനിധാനപരമായി അഭിസംബോധന ചെയ്തിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ കുറ്റാരോപണത്തിൽനിന്ന് ഇപ്പോഴത്തെ അഭിസംബോധനയിലേക്കുള്ള സ്വാഭാവിക സംക്രമണം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ καί ഇവിടെ വ്യവഹാരബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം ‘കൂടാതെ’ എന്നു ചേർക്കുന്നത് അസ്വാഭാവികമാകും.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: സംബോധനാരൂപത്തിലുള്ള ഗ്രീക്ക് ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള, ഗൗരവമുള്ള മലയാള തുല്യം. വിശാലമായ സമ്മിശ്രസമൂഹത്തെ പ്രതിനിധാനപരമായി ഉൾക്കൊള്ളാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: പത്രോസ് ഉറപ്പോടെ അറിവ് പ്രസ്താവിക്കുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: κατὰ ἄγνοιαν
  choice: അറിവില്ലായ്മയിൽ
  rationale: അറിവിന്റെ അഭാവത്താൽ സ്വഭാവീകരിക്കപ്പെട്ട പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; കുറ്റത്തിൽനിന്ന് പൂർണമായി ഒഴിവാക്കുന്നതായോ മനഃപൂർവമായ കുറ്റം ഊന്നുന്നതായോ വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐπράξατε
  choice: നിങ്ങൾ ... പ്രവർത്തിച്ചു
  rationale: ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്ത കർമം ചേർക്കാതെ πράσσω എന്ന ക്രിയയുടെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: ὥσπερ καὶ
  choice: അങ്ങനെതന്നെ ... -ഉം
  rationale: ജനങ്ങളുടെ പ്രവൃത്തിയോടുള്ള താരതമ്യവും ഭരണാധികാരികളുടെ സമാന പങ്കും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: നിങ്ങളുടെ ഭരണാധികാരികൾ
  rationale: യെരൂശലേമിലെ രാഷ്ട്രീയ-മത അധികാരമുള്ള നേതാക്കളെ സൂചിപ്പിക്കുന്ന ἄρχοντες എന്ന പദത്തിന്റെ അധികാരഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അറിവില്ലായ്മയെക്കുറിച്ചുള്ള പ്രസ്താവന കുറ്റബോധത്തെ ഇല്ലാതാക്കുന്നുണ്ടോ
  choice: ‘അറിവില്ലായ്മയിൽ പ്രവർത്തിച്ചു’ എന്ന് പറഞ്ഞ് മൂലപാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
  alternative: ‘അറിയാതെ ചെയ്തു’ അല്ലെങ്കിൽ ‘അറിയാത്തതിനാൽ ചെയ്തു’
  rationale: അറിവില്ലായ്മ അവരുടെ പ്രവൃത്തിയിലെ ഒരു ഘടകമാണെന്ന് വാക്യം അംഗീകരിക്കുന്നു; എന്നാൽ തുടർന്നുള്ള മാനസാന്തരാഹ്വാനം കുറ്റത്തിൽനിന്നുള്ള പൂർണ ഒഴിവാക്കൽ അനുവദിക്കുന്നില്ല. വിവർത്തനം ഇവയിൽ ഒന്നിനെ അതിരുകടന്ന് ഉറപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാവായനാശൈലി. ‘അറിവില്ലായ്മയിൽ’ എന്ന പ്രയോഗം ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത കർമം ചേർത്തിട്ടില്ല.
