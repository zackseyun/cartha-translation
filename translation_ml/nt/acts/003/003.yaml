  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായി മനസ്സിലാകുന്ന ‘ഭിക്ഷ’, ‘ദേവാലയം’ എന്നീ പദങ്ങൾ നിലനിർത്തി; സാങ്കേതിക വ്യത്യാസം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
