source:
  edition: SBLGNT
  text: ὃς ἰδὼν Πέτρον καὶ Ἰωάννην μέλλοντας εἰσιέναι εἰς τὸ ἱερὸν ἠρώτα ἐλεημοσύνην ⸀λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/003.yaml
  text: When he saw Peter and John about to go into the temple, he began asking to receive alms.
translation:
  language: ml
  text: ദേവാലയത്തിലേക്ക്[a] കടക്കാനൊരുങ്ങിയ പത്രോസിനെയും യോഹന്നാനെയും കണ്ടപ്പോൾ, ഭിക്ഷ ലഭിക്കാനായി അവൻ അവരോടു യാചിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെയുള്ള ഗ്രീക്ക് പദമായ ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; ദേവാലയാങ്കണങ്ങളും കെട്ടിടസമുച്ചയവും ഉൾപ്പെടുന്ന മുഴുവൻ ദേവാലയപരിസരത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: അവൻ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ മുടന്തനായ മനുഷ്യനെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കാലസൂചക ഉപവാക്യത്തോടൊപ്പം ‘അവൻ’ എന്നു പറയുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: അയാൾ പത്രോസിനെയും യോഹന്നാനെയും കണ്ടതിനെ തുടർന്നാണ് യാചിച്ചതെന്ന കാലബന്ധം ഈ ഭൂതകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്നു; ‘കണ്ടപ്പോൾ’ അതിനെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: പത്രോസിനെയും യോഹന്നാനെയും
  rationale: വ്യക്തിനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: μέλλοντας εἰσιέναι
  choice: കടക്കാനൊരുങ്ങിയ
  rationale: μέλλω + infinitive ഇവിടെ ഉടൻ സംഭവിക്കാനിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കടക്കാനൊരുങ്ങിയ’ ആ ആസന്നത നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ἱερὸν
  choice: ദേവാലയത്തിലേക്ക്
  rationale: വായനാസൗകര്യത്തിനായി പൊതുവായ ‘ദേവാലയം’ ഉപയോഗിച്ചു; ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയപരിസരം മുഴുവനെയും സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: ἠρώτα
  choice: യാചിച്ചു
  rationale: സന്ദർഭത്തിൽ ഭിക്ഷ അഭ്യർഥിക്കുന്ന പ്രവൃത്തിക്ക് ‘യാചിച്ചു’ സ്വാഭാവികവും മാന്യവുമാണ്. ഗ്രീക്ക് അപൂർണഭൂതകാലം തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ പ്രവൃത്തിക്ക് ഇടനൽകുന്നുവെങ്കിലും, മലയാളത്തിൽ ‘യാചിച്ചുകൊണ്ടിരുന്നു’ എന്നു നിർബന്ധമായി പറയുന്നത് അനാവശ്യമായി ദൈർഘ്യം ഊന്നാം.
- source_word: ἐλεημοσύνην
  choice: ഭിക്ഷ
  rationale: ഇവിടെ ദരിദ്രനു നൽകുന്ന ധനസഹായമാണ് അർഥം; ‘ഭിക്ഷ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: λαβεῖν
  choice: തനിക്കു … നൽകണമെന്ന്
  rationale: ഗ്രീക്കിൽ അയാൾ ഭിക്ഷ ലഭിക്കാനായി അഭ്യർഥിച്ചതാണ്. മലയാളത്തിൽ സ്വീകരിക്കുന്നവന്റെ കാഴ്ചപ്പാടിലുള്ള ‘ലഭിക്കാൻ’ എന്നതിനെക്കാൾ, അഭ്യർഥനയുടെ സ്വാഭാവിക രൂപമായ ‘തനിക്കു നൽകണമെന്ന്’ കൂടുതൽ സുതാര്യമാണ്; ലഭിക്കണമെന്ന ആശയം അതിൽ നിലനിൽക്കുന്നു.
