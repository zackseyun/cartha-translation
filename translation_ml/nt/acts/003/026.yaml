id: ACT.3.26
reference: Acts 3:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: ml
  text: നിങ്ങൾക്കാണ് ആദ്യം, ദൈവം തന്റെ ദാസനെ[b] ഉയർത്തി[a] നിങ്ങളിൽ ഓരോരുത്തരെയും നിങ്ങളുടെ ദുഷ്ടവഴികളിൽനിന്നു പിന്തിരിപ്പിച്ചുകൊണ്ട് നിങ്ങളെ അനുഗ്രഹിക്കാൻ അവനെ അയച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉയർത്തി’ എന്നത് ഇവിടെ ‘മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു’ എന്നതിനു പകരം തന്റെ ദാസനെ ‘മുന്നോട്ടുകൊണ്ടുവന്നു/നിയോഗിച്ചു’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘തന്റെ കുട്ടിയെ’; παῖς എന്ന ഗ്രീക്ക് പദത്തിന് ‘ദാസൻ’ എന്നും ‘കുട്ടി’ എന്നും അർഥമാകാം. ഇവിടെ യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള പശ്ചാത്തലം ഉള്ളതിനാൽ ‘ദാസൻ’ എന്നതാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: നിങ്ങൾക്കാണ് ആദ്യം
  rationale: യഹൂദരായ ശ്രോതാക്കൾക്കു ലഭിച്ച മുൻഗണനയും ദാതിവിന്റെ ദിശാബോധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀναστήσας
  choice: ഉയർത്തി
  rationale: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിനെയോ ഒരു ദാസനെ മുന്നോട്ടുകൊണ്ടുവന്ന് നിയോഗിച്ചതിനെയോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്കിലെ അർഥവ്യാപ്തി പൂർണമായി തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸν παῖδα αὐτοῦ
  choice: തന്റെ ദാസനെ
  rationale: യെശയ്യാവിലെ ദാസൻ എന്ന പശ്ചാത്തലത്തോടു യോജിക്കുകയും, ഇവിടെ ഇല്ലാത്ത വ്യക്തമായ പുത്രസൂചന ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചത്
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ദൗത്യഭാവവും അധിക വ്യാഖ്യാനമില്ലാതെ നൽകുന്നു.
- source_word: εὐλογοῦντα ὑμᾶς
  choice: നിങ്ങളെ അനുഗ്രഹിക്കാൻ
  rationale: അയച്ചതിന്റെ ഉദ്ദേശ്യമോ ഫലമോ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: നിങ്ങളിൽ ഓരോരുത്തരെയും ... പിന്തിരിപ്പിച്ചുകൊണ്ട്
  rationale: അനുഗ്രഹം നടപ്പാകുന്ന മാർഗവും ἕκαστον എന്ന പദത്തിന്റെ വ്യക്തിവിതരണ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: നിങ്ങളുടെ ദുഷ്ടവഴികളിൽനിന്നു
  rationale: തിന്മയുടെ വിവിധ പ്രവൃത്തികളെയും ജീവിതരീതികളെയും ഉൾക്കൊള്ളുന്ന ബഹുവചനത്തിന്റെ പ്രായോഗിക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള ἀναστήσας എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാന വാക്യത്തിൽ ‘ഉയർത്തി’ എന്നു നൽകി അർഥവ്യാപ്തി നിലനിർത്തി.
  alternative: ‘മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച്’ അല്ലെങ്കിൽ ‘മുന്നോട്ടുകൊണ്ടുവന്ന്/നിയോഗിച്ച്’
  rationale: ഈ സന്ദർഭത്തിൽ പുനരുത്ഥാനസൂചനയും ദൈവം പ്രവാചകനെയോ ദാസനെയോ എഴുന്നേല്പിക്കുന്നതിന്റെ പ്രതിധ്വനിയും കേൾക്കാവുന്നതിനാൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ചിട്ടില്ല.
- issue: παῖς എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ സൂക്ഷ്മത
  choice: ദാസൻ
  alternative: കുട്ടി; പുത്രൻ
  rationale: യെശയ്യാവിലെ ദാസപശ്ചാത്തലം നിലനിർത്തുകയും ഗ്രീക്ക് ഈ വാക്യത്തിൽ വ്യക്തമായി പറയാത്ത ‘പുത്രൻ’ എന്ന അർഥം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
