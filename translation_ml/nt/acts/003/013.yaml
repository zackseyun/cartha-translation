id: ACT.3.13
reference: Acts 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: ml
  text: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം, നമ്മുടെ പിതാക്കന്മാരുടെ ദൈവം, തന്റെ ദാസനായ യേശുവിനെ[a] മഹത്വപ്പെടുത്തി. നിങ്ങൾ അവനെ ഏല്പിച്ചുകൊടുക്കുകയും പീലാത്തോസിന്റെ മുമ്പിൽവെച്ച് തള്ളിപ്പറയുകയും ചെയ്തു—പീലാത്തോസാകട്ടെ അവനെ വിട്ടയയ്ക്കാൻ തീരുമാനിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്റെ കുട്ടിയായ യേശുവിനെ.” παῖς എന്ന ഗ്രീക്കുപദത്തിന് “കുട്ടി” എന്നും “ദാസൻ” എന്നും അർഥമാകാം. ഇവിടെ യെശയ്യാവിലെ ദാസനെക്കുറിച്ചുള്ള ഭാഷയുടെ പ്രതിധ്വനി ഉണ്ടായിരിക്കാമെന്നതിനാൽ “ദാസൻ” എന്നത് മുഖ്യവായനയായി സ്വീകരിച്ചിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: അബ്രാഹാമിന്റെയും യിസ്ഹാക്കിന്റെയും യാക്കോബിന്റെയും ദൈവം
  rationale: പുറപ്പാട് 3:6-നെ അനുസ്മരിപ്പിക്കുന്ന ഉടമ്പടിസൂത്രവും ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള καί-യുടെ ഘടനയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരുടെ ദൈവം
  rationale: πατέρων എന്നതിന്റെ പിതൃപാരമ്പര്യപരവും തിരുവെഴുത്തുസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ ‘പൂർവികർ’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ἐδόξασεν
  choice: മഹത്ത്വപ്പെടുത്തി
  rationale: δοξάζω എന്ന ക്രിയയുടെ ദൈവശാസ്ത്രപരമായ ഭാരവും യേശുവിനോടുള്ള ദൈവത്തിന്റെ പ്രവൃത്തിയും വ്യക്തമാക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: തന്റെ ദാസനായ യേശുവിനെ
  rationale: παῖς എന്നതിന് ‘കുട്ടി’ എന്നും ‘ദാസൻ/സേവകൻ’ എന്നും അർഥമാകാം. ഇവിടെ യെശയ്യാവിലെ യഹോവയുടെ ദാസനെ അനുസ്മരിപ്പിക്കുന്ന സാധ്യത കാരണം ‘ദാസൻ’ മുഖ്യവായനയായി സ്വീകരിക്കുന്നു; യഥാർഥമായ പദാർഥദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: παρεδώκατε
  choice: നിങ്ങൾ അവനെ ഏല്പിച്ചുകൊടുക്കുകയും
  rationale: അധികാരികളുടെ കൈയിൽ ഏല്പിക്കുന്ന പ്രവൃത്തിയെ നേരിട്ട് വ്യക്തമാക്കുന്നു; ‘ഒറ്റിക്കൊടുത്തു’ എന്നത് ഈ സന്ദർഭത്തിൽ ആവശ്യത്തിലധികം വ്യാഖ്യാനാത്മകമാകും.
- source_word: ἠρνήσασθε
  choice: തള്ളിപ്പറയുകയും ചെയ്തു
  rationale: ἀρνέομαι എന്നതിന്റെ പരസ്യമായ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും ‘നിഷേധിച്ചു’ എന്നതിനെക്കാൾ വ്യക്തിയെ നിരാകരിക്കുന്ന ഭാവം നൽകുന്നു.
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: പീലാത്തോസിന്റെ മുമ്പിൽവെച്ച്
  rationale: ‘പീലാത്തോസിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്ന അക്ഷരാർഥത്തെ അസ്വാഭാവികമാക്കാതെ, അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ നടന്ന പരസ്യനിഷേധം വ്യക്തമാക്കുന്നു.
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: പീലാത്തോസാകട്ടെ അവനെ വിട്ടയയ്ക്കാൻ തീരുമാനിച്ചിരുന്നു
  rationale: കർത്താവിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുകയും κρίναντος-ന്റെ ന്യായവിധി/തീരുമാനം എന്ന അർഥവും മുൻകാലനിലയും അറിയിക്കുകയും ചെയ്യുന്നു. ഡാഷും ‘ആകട്ടെ’യും സാഹചര്യത്തിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യേശുവിനെക്കുറിച്ചുള്ള παῖς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദാസൻ
  alternative: കുട്ടി
  rationale: യെശയ്യാവിലെ ദാസഭാഷയുടെ സാദ്ധ്യമായ പ്രതിധ്വനി നിലനിർത്താൻ ‘ദാസൻ’ അനുയോജ്യമാണ്. എന്നാൽ പദത്തിന് ‘കുട്ടി’ എന്ന യഥാർഥ അർഥവും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു; ‘മകൻ’ എന്നു പരിഭാഷപ്പെടുത്തി മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക പുത്രത്വഭാഷ ചേർക്കുന്നില്ല.
- issue: ἐδόξασεν എന്ന ക്രിയയുടെ അവതരണം
  choice: മഹത്ത്വപ്പെടുത്തി
  alternative: ബഹുമാനിച്ചു
  rationale: ദൈവം യേശുവിനെ ഉയർത്തി മഹത്ത്വപ്പെടുത്തിയെന്ന പ്രസംഗസന്ദർഭത്തിലെ ശക്തമായ അർഥം നിലനിർത്തുന്നു; ‘ബഹുമാനിച്ചു’ അതിനെ അനാവശ്യമായി ദുർബലമാക്കും.
- issue: κρίναντος എന്ന പങ്കുപദത്തിന്റെ ബന്ധം
  choice: വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വതന്ത്ര ഉപവാക്യം
  alternative: ‘വിട്ടയയ്ക്കാൻ തീരുമാനിച്ചപ്പോൾ’ എന്ന കാലസൂചക ഉപവാക്യം
  rationale: ഗ്രീക്ക് വ്യാകരണം അടിസ്ഥാനത്തിൽ സാഹചര്യബന്ധം മാത്രം നൽകുന്നതിനാൽ കർശനമായ concessive പദം ചേർക്കുന്നില്ല. എങ്കിലും പീലാത്തോസിന്റെ തീരുമാനവും ജനത്തിന്റെ നിഷേധവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം ‘ആകട്ടെ’യിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി ഉപയോഗിച്ചു. ഉടമ്പടിസൂത്രത്തിന്റെ ആവർത്തനഘടന സംരക്ഷിച്ചു; അനാവശ്യമായ പഴഞ്ചൊല്ലുകളും വിഭാഗീയ ദൈവശാസ്ത്രപദങ്ങളും ഒഴിവാക്കി.
