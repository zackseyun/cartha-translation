- from: 'മോശെ ഇപ്രകാരം പറഞ്ഞിട്ടുണ്ട്: “നിങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന് എന്നെപ്പോലെ ഒരു പ്രവാചകനെ കർത്താവായ ദൈവം നിങ്ങൾക്കായി എഴുന്നേൽപ്പിക്കും. അവൻ നിങ്ങളോടു പറയുന്ന സകലത്തിലും നിങ്ങൾ അവന്റെ വാക്കു കേട്ടനുസരിക്കണം.[a]”[b]'
  to: 'മോശെ ഇപ്രകാരം പറഞ്ഞു: “നിങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്[a] എന്നെപ്പോലെ ഒരു പ്രവാചകനെ കർത്താവായ ദൈവം[b] നിങ്ങൾക്കായി എഴുന്നേൽപ്പിക്കും. അവൻ നിങ്ങളോടു പറയുന്നതെല്ലാം നിങ്ങൾ അവനെ കേട്ട് അനുസരിക്കണം.”'
  rationale: പരിഷ്കരണം ഗ്രീക്ക് അഒറിസ്റ്റിന്റെ ലളിതഭൂതകാലം പുനഃസ്ഥാപിക്കുന്നു; ἀκούσεσθε-യുടെ അനുസരണസൂചനയെ മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഇംഗ്ലീഷ് POB പരിശോധനപ്പാതയിലെ രണ്ടു അടിക്കുറിപ്പുകളും അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു കൃത്യമായി ബന്ധിപ്പിക്കുന്നു. ‘ഒരു പ്രവാചകൻ’ എന്ന അനിശ്ചിത രൂപവും ‘കർത്താവായ ദൈവം’ എന്ന, ‘നിങ്ങളുടെ’ ഇല്ലാത്ത, പ്രവൃത്തികളുടെ പാഠവും മാറ്റമില്ലാതെ സൂക്ഷിച്ചിരിക്കുന്നു.
