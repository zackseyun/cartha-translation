source:
  edition: SBLGNT
  text: Μωϋσῆς ⸀μὲν εἶπεν ὅτι Προφήτην ὑμῖν ἀναστήσει κύριος ὁ ⸀θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: ml
  text: 'മോശെ ഇപ്രകാരം പറഞ്ഞു: “നിങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്[a] എന്നെപ്പോലെ ഒരു പ്രവാചകനെ കർത്താവായ ദൈവം[b] നിങ്ങൾക്കായി എഴുന്നേൽപ്പിക്കും. അവൻ നിങ്ങളോടു പറയുന്നതെല്ലാം നിങ്ങൾ അവനെ കേട്ട് അനുസരിക്കണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ സഹഇസ്രായേല്യരുടെ ഇടയിൽനിന്ന്.’ ഗ്രീക്കിൽ ‘നിങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്’ എന്നാണ്; പുരുഷലിംഗ ബന്ധുപദം ഇവിടെ ഉടമ്പടിജനത്തിലെ അംഗങ്ങളെ പ്രതിനിധാനമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പ്രവൃത്തികൾ 3:22 ഇവിടെ നിയമാവർത്തനം 18:15 ചെറിയ പദവ്യത്യാസത്തോടെ ഉദ്ധരിക്കുന്നു. പ്രവൃത്തികളുടെ ഗ്രീക്ക് പാഠത്തിൽ ‘കർത്താവായ ദൈവം’ എന്നാണ്; നിയമാവർത്തനത്തിലെ ‘നിങ്ങളുടെ ദൈവമായ കർത്താവ്’ എന്ന പദക്രമം ഇവിടെയില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς μὲν εἶπεν ὅτι
  choice: 'മോശെ ഇപ്രകാരം പറഞ്ഞിട്ടുണ്ട്:'
  rationale: μέν നൽകുന്ന ഊന്നലും തുടർന്നുള്ള ഉദ്ധരണിയിലേക്കുള്ള നീക്കവും സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇപ്രകാരം’ കൊണ്ടു സൂചിപ്പിക്കുന്നു; εἶπεν എന്ന ഭൂതകാലത്തെ നിലവിലെ പ്രസംഗത്തിൽ ഉദ്ധരണിക്ക് പ്രസക്തിയുള്ളതായി ‘പറഞ്ഞിട്ടുണ്ട്’ അവതരിപ്പിക്കുന്നു.
- source_word: Προφήτην
  choice: ഒരു പ്രവാചകനെ
  rationale: നിർദേശക ഉപപദമില്ലാത്ത നാമത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; ‘ആ പ്രവാചകൻ’ എന്ന വ്യാഖ്യാനപരമായ നിർണ്ണയം ചേർക്കുന്നില്ല.
- source_word: ἀναστήσει
  choice: എഴുന്നേൽപ്പിക്കും
  rationale: ദൈവം ജനത്തിനിടയിൽനിന്ന് പ്രവാചകനെ ഉയർത്തിക്കൊണ്ടുവരും എന്ന അർഥവും ആവർത്തിക്കുന്ന നിയമാവർത്തന ഉദ്ധരണിയുടെ പദബന്ധവും നിലനിർത്തുന്നു; ഇവിടെ പുനരുത്ഥാനം പ്രാഥമിക അർഥമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: κύριος ὁ θεὸς
  choice: കർത്താവായ ദൈവം
  rationale: ഗ്രീക്കിലെ ‘കർത്താവ് ദൈവം’ എന്ന ദൈവനാമസംബന്ധിയായ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘നിങ്ങളുടെ’ ചേർക്കുന്നില്ല.
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: നിങ്ങളുടെ സഹോദരന്മാരുടെ ഇടയിൽനിന്ന്
  rationale: ἀδελφῶν എന്ന പുരുഷലിംഗ ബഹുവചന ബന്ധുപദവും ἐκ എന്നതിന്റെ ‘ഇടയിൽനിന്ന്’ എന്ന ശക്തിയും സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഉടമ്പടിജനത്തിലെ സഹ ഇസ്രായേല്യരെ പ്രതിനിധിയായി സൂചിപ്പിക്കുന്നു.
- source_word: ὡς ἐμέ
  choice: എന്നെപ്പോലെ
  rationale: മോശെയോടുള്ള നേരിട്ടുള്ള താരതമ്യം ലളിതമായും കൃത്യമായും നൽകുന്നു.
- source_word: αὐτοῦ ἀκούσεσθε
  choice: നിങ്ങൾ അവന്റെ വാക്കു കേട്ടനുസരിക്കണം
  rationale: ഭാവികാലരൂപത്തിന്റെ ആജ്ഞാത്മക/ഉടമ്പടിപരമായ ബലവും ἀκούω എന്നതിന്റെ അനുസരണയോടുകൂടിയ ശ്രദ്ധയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: അവൻ നിങ്ങളോടു പറയുന്ന സകലത്തിലും
  rationale: അവൻ പറയുന്നതെല്ലാം സമഗ്രമായി അനുസരിക്കണമെന്ന വിതരണാത്മകവും സർവഗ്രാഹിയുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: നിയമാവർത്തനം 18-ലെ ഉദ്ധരണിയും മശീഹാപരമായ തിരിച്ചറിയലും
  choice: ‘ഒരു പ്രവാചകൻ’ എന്നു തന്നെ വിവർത്തനം ചെയ്തു; മുഖ്യപാഠത്തിൽ ‘മശീഹ’യെന്നോ ‘ആ പ്രവാചകൻ’ എന്നോ ചേർത്തില്ല.
  alternative: ‘ആ പ്രവാചകൻ’ എന്നു നൽകുകയോ യേശുവാണെന്ന് ഉദ്ധരണിക്കുള്ളിൽ നേരിട്ട് വ്യക്തമാക്കുകയോ ചെയ്യുക.
  rationale: പ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ പത്രോസ് ഈ വചനം യേശുവിനോടു ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം Προφήτην, ‘ഒരു പ്രവാചകൻ,’ എന്നാണ് പറയുന്നത്. അതിനാൽ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പ്രയോഗം ഇല്ലാതാക്കാതെയും ഉദ്ധരണിയിൽ ഇല്ലാത്ത തിരിച്ചറിയൽ ചേർക്കാതെയും പാഠത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ἀδελφῶν എന്ന ബന്ധുപദത്തിന്റെ പരിധി
  choice: ‘സഹോദരന്മാർ’ എന്ന പുരുഷലിംഗ ബന്ധുപദം ഉപയോഗിച്ചു; അതിന്റെ ഉടമ്പടിജനപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘സഹ ഇസ്രായേല്യർ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ലിംഗരൂപം സംരക്ഷിക്കുമ്പോഴും ഇവിടെ ജൈവസഹോദരന്മാർ മാത്രമല്ല, ഇസ്രായേൽജനത്തിലെ അംഗങ്ങളാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാവായനയ്ക്കും സാധാരണ വായനക്കാർക്കും യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘എഴുന്നേൽപ്പിക്കും’ എന്ന ബൈബിൾപരമായി പരിചിതമായ പ്രയോഗം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
