id: ACT.3.20
reference: Acts 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: ml
  text: അങ്ങനെ, കർത്താവിന്റെ സന്നിധിയിൽനിന്ന് ഉന്മേഷത്തിന്റെ കാലങ്ങൾ വരാനും നിങ്ങൾക്കായി നിയമിക്കപ്പെട്ട[a] മശീഹയായ യേശുവിനെ അവിടന്ന് അയയ്ക്കാനും ഇടയാകേണ്ടതിന്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങൾക്ക് നിയമിക്കപ്പെട്ട”; “നിങ്ങൾക്കായി മുൻകൂട്ടി നിയമിക്കപ്പെട്ട” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: προκεχειρισμένον എന്ന പദത്തിലെ മുൻനിയമനസൂചനയും ὑμῖν എന്ന dative-ന്റെ ‘നിങ്ങൾക്കായി/നിങ്ങൾക്ക്’ എന്ന രണ്ടു സ്വാഭാവിക വായനകളും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὅπως ἂν
  choice: അങ്ങനെ … ഇടയാകട്ടെ
  rationale: മുൻവാക്യത്തിലെ മാനസാന്തരത്തിനുള്ള ആഹ്വാനത്തോടു ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യവും പ്രതീക്ഷിത ഫലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ἄν സഹിതമുള്ള സാധ്യതാഭാവവും പൂർണനിശ്ചയമായി മാറ്റുന്നില്ല.
- source_word: ἔλθωσιν
  choice: വരാനും
  rationale: ഉദ്ദേശ്യഘടനയ്ക്കുള്ളിലെ aorist subjunctive-ന്റെ ആശ്രിതഭാവം മലയാളത്തിലെ infinitive ഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: καιροὶ
  choice: കാലങ്ങൾ
  rationale: അവസരങ്ങൾ, കാലഘട്ടങ്ങൾ, അനുയോജ്യസമയങ്ങൾ എന്നിവ ഉൾക്കൊള്ളാൻ കഴിയുന്ന καιρός എന്ന പദത്തിന്റെ വിശാലത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀναψύξεως
  choice: ഉന്മേഷത്തിന്റെ
  rationale: ആശ്വാസം, പുതുജീവൻ, ശീതളീകരണം എന്നീ അർത്ഥഛായകൾ ഉൾക്കൊള്ളുന്ന രൂപകം സ്വാഭാവികവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: കർത്താവിന്റെ സന്നിധിയിൽനിന്ന്
  rationale: πρόσωπον എന്നതിന്റെ അക്ഷരാർഥം ‘മുഖം’ ആണെങ്കിലും, ഈ പ്രയോഗത്തിൽ ഉദ്ദേശിക്കുന്ന സാന്നിധ്യം സ്വാഭാവിക മലയാളത്തിൽ ‘സന്നിധി’ എന്നു നൽകുന്നു.
- source_word: ἀποστείλῃ
  choice: അവിടന്ന് അയയ്ക്കാനും
  rationale: മുൻപത്തെ subjunctive ക്രിയയോടു സമാന്തരമായ ആശ്രിതഘടന നിലനിർത്തുന്നു; കർത്താവിനെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമം മലയാള രജിസ്റ്ററിന് യോജിക്കുന്നു.
- source_word: προκεχειρισμένον
  choice: നിയമിക്കപ്പെട്ട
  rationale: മുൻകൂട്ടിയുള്ള നിയമനം എന്ന perfect participle-ന്റെ സൂചന പ്രധാനപാഠത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിസ്ഥാന അർത്ഥം നൽകുന്നു; കാലസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കായി
  rationale: dative ഇവിടെ പ്രേക്ഷകർക്കുവേണ്ടിയുള്ള നിയമനം എന്ന അർത്ഥത്തിൽ സ്വാഭാവികമായി വായിക്കാം; ‘നിങ്ങൾക്ക്’ എന്നതും സാധ്യമായ വ്യാഖ്യാനമാണ്.
- source_word: χριστὸν
  choice: മശീഹ
  rationale: ഇവിടെ വ്യക്തിനാമത്തിന്റെ ഭാഗമെന്നതിലുപരി യേശുവിനോടു ചേർന്ന യഹൂദ മശീഹാപദവിയായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം.
theological_decisions:
- issue: χριστὸν ഒരു പദവിയായി വിവർത്തനം ചെയ്യണോ, പരമ്പരാഗത രൂപമായ ‘ക്രിസ്തു’ നിലനിർത്തണോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ χριστός യേശുവിനെ തിരിച്ചറിയിക്കുന്ന മശീഹാപദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ പദവിയുടെ അർത്ഥം തുറന്നുകാട്ടുന്ന ‘മശീഹ’ അനുയോജ്യം.
- issue: προκεχειρισμένον ὑμῖν എന്നതിലെ മുൻനിയമനവും dative-ന്റെ ബന്ധവും
  choice: നിങ്ങൾക്കായി നിയമിക്കപ്പെട്ട
  alternative: നിങ്ങൾക്ക് നിയമിക്കപ്പെട്ട; നിങ്ങൾക്കായി മുൻകൂട്ടി നിയമിക്കപ്പെട്ട
  rationale: പ്രധാനപാഠം ഗുണഭോക്തൃബന്ധം സ്വാഭാവികമായി നൽകുന്നു. perfect participle-ൽ ഉൾപ്പെട്ട മുൻനിയമനസൂചനയും dative-ന്റെ മറ്റൊരു സാധ്യതയും അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു; ഒരു പ്രത്യേക മുൻനിശ്ചയസിദ്ധാന്തം ഇതിൽ കയറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘ഉന്മേഷത്തിന്റെ കാലങ്ങൾ’ എന്ന പ്രയോഗം രൂപകവും ബഹുവചനവും സംരക്ഷിക്കുന്നു.
