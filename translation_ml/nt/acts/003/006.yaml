id: ACT.3.6
reference: Acts 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് പറഞ്ഞു: “വെള്ളിയോ പൊന്നോ എനിക്കില്ല. എന്നാൽ എനിക്കുള്ളത്—അത് ഞാൻ നിനക്കു തരുന്നു: നസറായനായ[b] യേശു മശീഹയുടെ[a] നാമത്തിൽ നടക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹ’ എന്നതിനുപകരം “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദവി ഇവിടെ അതിന്റെ അർഥം നിലനിർത്താൻ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ “നസറായൻ”; അഥവാ “നസറെത്തിൽനിന്നുള്ള.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: വെള്ളിയോ പൊന്നോ
  rationale: ഗ്രീക്കിലെ രണ്ടു ലോഹങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു; അവ ചേർന്ന് ധനസമ്പത്തിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും പൊതുവായ ‘പണം’ എന്നു ചുരുക്കിയിട്ടില്ല.
- source_word: οὐχ ὑπάρχει μοι
  choice: എനിക്കില്ല
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: എന്നാൽ എനിക്കുള്ളത്—അത് ഞാൻ നിനക്കു തരുന്നു
  rationale: ὃ ... τοῦτο എന്ന ഊന്നിയ ആവർത്തനവും മുമ്പത്തെ അഭാവവുമായുള്ള വൈരുധ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματι
  choice: നാമത്തിൽ
  rationale: അധികാരമോ പ്രവർത്തനാധാരമോ സൂചിപ്പിക്കാവുന്ന ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കാതെ ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയുടെ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ Ναζωραίου
  choice: നസറായനായ
  rationale: നസറെത്തുമായുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ വിശേഷണാത്മക/പദവിസദൃശ രൂപത്തിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: περιπάτει
  choice: നടക്കുക
  rationale: വർ‍ത്തമാനകാല ആജ്ഞാരൂപത്തെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമായ കല്പനയായി നൽകുന്നു; ‘എഴുന്നേൽക്കുക’ എന്നത് ഈ SBLGNT പാഠത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: നാമസൂത്രത്തിൽ Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സൗഖ്യപ്രഖ്യാപനത്തിലെ ഈ സന്ദർഭത്തിൽ Χριστός പദവിയുടെ അർഥം സജീവമാണ്. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘മശീഹ’ ഉപയോഗിക്കുകയും പരിചിതമായ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: ἐν τῷ ὀνόματι എന്നതിലെ അധികാരസൂചന
  choice: നാമത്തിൽ
  alternative: അധികാരത്താൽ
  rationale: ‘നാമത്തിൽ’ എന്ന രൂപം ഗ്രീക്കിന്റെ ഭാഷയും അതിലെ പ്രവർത്തനാധാരം, പ്രതിനിധിത്വം, അധികാരം എന്നിവയുടെ സാധ്യതകളും തുറന്നുവയ്ക്കുന്നു; ‘അധികാരത്താൽ’ എന്നു മാത്രം പറഞ്ഞ് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വെള്ളിയോ പൊന്നോ’ എന്ന പരിചിതമായ ജോടിയും ‘എനിക്കുള്ളത്—അത്’ എന്ന ഊന്നലും നിലനിർത്തി. ഗ്രീക്ക് പാഠത്തിൽ ഇല്ലാത്ത ‘എഴുന്നേൽക്കുക’ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ പ്രധാനപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
