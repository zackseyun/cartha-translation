translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ശ്രദ്ധാപൂർവമായ നോട്ടവും യോഹന്നാന്റെ സഹവർത്തിത്വവും നിലനിർത്തി. ഇംഗ്ലീഷ് consultation layer-ലെ [a] അടയാളം അതിന്റെ സ്ഥാനത്തോടും വിശദീകരണത്തോടും പൊരുത്തപ്പെടാത്തതിനാലും മലയാളവാചകം അർത്ഥം നേരിട്ട് വ്യക്തമാക്കുന്നതിനാലും അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
