source:
  edition: SBLGNT
  text: ἀτενίσας δὲ Πέτρος εἰς αὐτὸν σὺν τῷ Ἰωάννῃ εἶπεν· Βλέψον εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: ml
  text: പത്രോസ് യോഹന്നാനോടൊപ്പം അയാളെ ഉറ്റുനോക്കി, “ഞങ്ങളെ നോക്കൂ” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας (ἀτενίζω)
  choice: ഉറ്റുനോക്കിക്കൊണ്ട്
  rationale: കേവലമായ ഒരു നോട്ടമല്ല, ശ്രദ്ധ കേന്ദ്രീകരിച്ചുള്ള തീവ്രമായ നോട്ടമാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്. ‘ഉറ്റുനോക്കിക്കൊണ്ട്’ ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. ‘അപ്പോൾ’ സന്ദർഭത്തിന്റെ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σὺν τῷ Ἰωάννῃ
  choice: യോഹന്നാനോടൊപ്പം
  rationale: σύν + ദത്തിവ് സഹവർത്തിത്വം സൂചിപ്പിക്കുന്നു. പത്രോസ് യോഹന്നാനോടൊപ്പമാണ് ഈ പ്രവൃത്തി ചെയ്യുന്നതെന്ന് ഈ രൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: ഈ സന്ദർഭത്തിൽ λέγω സാധാരണ സംസാരക്രിയയാണ്; ‘പറഞ്ഞു’ അതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
- source_word: Βλέψον
  choice: നോക്കൂ
  rationale: ഏകവചനത്തിലുള്ള ഈ ആജ്ഞ ശ്രദ്ധ അവരിലേക്കു തിരിക്കാൻ ആവശ്യപ്പെടുന്നു. ‘നോക്കൂ’ ആ നേരിട്ടുള്ള കല്പനയെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς ἡμᾶς
  choice: ഞങ്ങളെ
  rationale: നോക്കുക എന്ന ക്രിയയോടൊപ്പം εἰς നോട്ടത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഞങ്ങളെ നോക്കൂ’ എന്നതാണ് സ്വാഭാവിക പ്രയോഗം.
- source_word: εἰς αὐτόν
  choice: അയാളെ
  rationale: ἀτενίζωയോടൊപ്പം εἰς കേന്ദ്രീകൃത നോട്ടത്തിന്റെ ലക്ഷ്യത്തെ അടയാളപ്പെടുത്തുന്നു. ‘അയാളെ ഉറ്റുനോക്കുക’ ഈ ബന്ധം വ്യക്തമായി പകരുന്നു.
