id: ACT.3.12
reference: Acts 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: ml
  text: 'എന്നാൽ ഇതു കണ്ടപ്പോൾ പത്രോസ് ജനത്തോടു മറുപടി പറഞ്ഞു: “ഇസ്രായേൽ പുരുഷന്മാരേ, നിങ്ങൾ ഇതിൽ ആശ്ചര്യപ്പെടുന്നത് എന്തിന്? ഞങ്ങളുടെ സ്വന്തം ശക്തികൊണ്ടോ ദൈവഭക്തികൊണ്ടോ[b] ഞങ്ങൾ ഇവനെ നടക്കുമാറാക്കിയെന്നപോലെ ഞങ്ങളെ ഉറ്റുനോക്കുന്നത്[a] എന്തിന്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞങ്ങളെ സൂക്ഷിച്ചുനോക്കുന്നത്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയ തുടർച്ചയായി ദൃഷ്ടി പതിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ദൈവഭക്തി” എന്നതിന് “ഭക്തിനിഷ്ഠ” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ സൗഖ്യം അപ്പൊസ്തലന്മാരുടെ സ്വന്തം മതഭക്തിയോ ആത്മീയഗുണമോ മൂലം ഉണ്ടായതല്ലെന്ന് പത്രോസ് വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: എന്നാൽ ഇതു കണ്ടപ്പോൾ പത്രോസ്
  rationale: Aorist participle ἰδών is rendered temporally; “ഇതു” supplies the contextually implied object, namely the crowd’s reaction. δέ marks the transition to Peter’s response.
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: ജനത്തോടു പറഞ്ഞു
  rationale: Although ἀποκρίνομαι literally has the sense of responding, no spoken question precedes it; Malayalam naturally expresses Peter’s response to the situation with “പറഞ്ഞു.”
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ഇസ്രായേൽ പുരുഷന്മാരേ
  rationale: Preserves the explicitly masculine vocative ἄνδρες while remaining intelligible as a conventional public address.
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: നിങ്ങൾ ഇതിൽ ആശ്ചര്യപ്പെടുന്നത് എന്തിന്?
  rationale: θαυμάζω denotes amazement or wonder, and ἐπὶ τούτῳ points to the healing event.
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: ഞങ്ങളെ തുറിച്ചുനോക്കുന്നത് എന്തിന്?
  rationale: ἀτενίζω describes an intent, sustained gaze; “തുറിച്ചുനോക്കുക” conveys that force naturally in Malayalam.
- source_word: ἰδίᾳ δυνάμει
  choice: ഞങ്ങളുടെ സ്വന്തം ശക്തികൊണ്ട്
  rationale: ἰδίᾳ emphasizes power belonging to the apostles themselves, which Peter explicitly denies as the cause.
- source_word: εὐσεβείᾳ
  choice: ദൈവഭക്തികൊണ്ട്
  rationale: The word denotes reverence, piety, or devoutness. “ദൈവഭക്തി” clearly retains its religious sense in ordinary modern Malayalam.
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: ഞങ്ങൾ ഇവനെ നടക്കുമാറാക്കിയ
  rationale: The perfect participle presents the supposed completed result attributed to the apostles; the Malayalam causative construction naturally expresses making the man walk.
theological_decisions:
- issue: Whether εὐσεβείᾳ should suggest that apostolic religious merit caused the healing
  choice: ദൈവഭക്തി
  alternative: ഭക്തിനിഷ്ഠ / ഭക്തി
  rationale: Peter denies that either the apostles’ own power or their spiritual quality caused the man to walk. The wording preserves that denial without introducing a later doctrine of merit.
- issue: How to represent the masculine vocative Ἄνδρες Ἰσραηλῖται
  choice: ഇസ്രായേൽ പുരുഷന്മാരേ
  alternative: ഇസ്രായേൽജനമേ
  rationale: The chosen form preserves the source text’s masculine address rather than silently neutralizing it, while functioning as a conventional address to those present.
translation_notes:
  register: Modern standard Malayalam with a dignified public-speech cadence. Familiar vocabulary and natural Malayalam syntax are used, while the source text’s rhetorical questions, masculine vocative, causal contrast, and denial of apostolic agency are retained.
