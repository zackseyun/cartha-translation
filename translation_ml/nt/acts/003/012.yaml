  to: 'എന്നാൽ ഇതു കണ്ടപ്പോൾ പത്രോസ് ജനത്തോടു മറുപടി പറഞ്ഞു: “ഇസ്രായേൽ പുരുഷന്മാരേ, നിങ്ങൾ ഇതിൽ ആശ്ചര്യപ്പെടുന്നത് എന്തിന്? ഞങ്ങളുടെ സ്വന്തം ശക്തികൊണ്ടോ ദൈവഭക്തികൊണ്ടോ[b] ഞങ്ങൾ ഇവനെ നടക്കുമാറാക്കിയെന്നപോലെ ഞങ്ങളെ ഉറ്റുനോക്കുന്നത്[a] എന്തിന്?”'
  rationale: 'Two small lexical and syntactic refinements improve fidelity and naturalness: ''മറുപടി പറഞ്ഞു'' reflects ἀπεκρίνατο, and ''ഉറ്റുനോക്കുന്നത്'' renders ἀτενίζετε without the potentially negative pragmatic coloring of ''തുറിച്ചുനോക്കുന്നത്.'' The verse''s ambiguity concerning what Peter saw remains intact through contextually supplied ''ഇതു.'' Footnote markers remain correctly attached to their respective terms.'
