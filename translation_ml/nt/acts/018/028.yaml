  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: ml
  text: കാരണം, യേശുവാണ് മശീഹ[b]യെന്ന്[a] തിരുവെഴുത്തുകളിലൂടെ തെളിയിച്ചുകൊണ്ട്, അവൻ യഹൂദന്മാരെ പരസ്യമായി ശക്തമായി ഖണ്ഡിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹ യേശുവാണെന്ന്.” ഗ്രീക്ക് വാക്യഘടന ഇരു വാക്കുക്രമങ്ങളിലും അവതരിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “ക്രിസ്തു”; ഇവിടെ ഈ പദം ഒരു പദവിയായി വരുന്നതിനാൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: ശക്തമായി
  rationale: പ്രവർത്തനത്തിന്റെ തീവ്രതയും വാദത്തിന്റെ പ്രഭാവവും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: διακατηλέγχετο
  choice: ഖണ്ഡിച്ചു
  rationale: എതിരാളികളുടെ നിലപാട് തെളിവോടെ പൂർണമായി തെറ്റാണെന്നു കാണിക്കുന്ന വാദാത്മക അർഥം നൽകുന്നു; ഗ്രീക്ക് imperfect സന്ദർഭത്തിലെ തുടർച്ചയായ പ്രവർത്തനമായി മനസ്സിലാക്കാം, എന്നാൽ മലയാളത്തിൽ നിർബന്ധിതമായ ദീർഘരൂപം ഒഴിവാക്കി.
- source_word: τοῖς Ἰουδαίοις
  choice: യഹൂദന്മാരെ
  rationale: ഇവിടെ സംവാദത്തിലുണ്ടായിരുന്ന യഹൂദ എതിരാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; മൂലപാഠത്തിലെ കൂട്ടനാമം അനാവശ്യമായി വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: δημοσίᾳ
  choice: പരസ്യമായി
  rationale: പ്രവർത്തനം പൊതുജനസമക്ഷം നടന്നുവെന്ന അർഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐπιδεικνὺς
  choice: തെളിയിച്ചുകൊണ്ട്
  rationale: തിരുവെഴുത്തുകളിൽനിന്നുള്ള തെളിവുകളിലൂടെ വാദം സ്ഥാപിച്ചതെന്ന പങ്കാളിത്തക്രിയയുടെ ഉപാധിസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῶν γραφῶν
  choice: തിരുവെഴുത്തുകളിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ ഉപാധി നിലനിർത്തുന്നു.
- source_word: τὸν χριστὸν
  choice: മശീഹ
  rationale: ഇവിടെ χριστός വ്യക്തിനാമസദൃശമല്ല, വാഗ്ദത്ത അഭിഷിക്തന്റെ പദവിയായാണ് പ്രവർത്തിക്കുന്നത്; യഹൂദ തിരുവെഴുത്തുകളുടെ പശ്ചാത്തലവും ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: Ἰησοῦν
  choice: യേശു
  rationale: പേരിന്റെ നിലവാരമുള്ള മലയാളരൂപം.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: യേശുവാണ് മശീഹ എന്ന്
  rationale: ഗ്രീക്ക് infinitive clause-ന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരം; വ്യാകരണപരമായി സാധ്യമായ മറിച്ചുള്ള ഊന്നൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പദം യേശുവിന്റെ പേരിന്റെ ഭാഗമായി അല്ല, തിരുവെഴുത്തുകളിൽ വാഗ്ദാനം ചെയ്ത അഭിഷിക്തന്റെ പദവിയായി വരുന്നു. അതിനാൽ ‘മശീഹ’ എന്നത് യഹൂദ-തിരുവെഴുത്തു പശ്ചാത്തലം കൂടുതൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- issue: εἶναι τὸν χριστὸν Ἰησοῦν എന്ന വാക്യഘടകത്തിലെ ഊന്നൽ
  choice: യേശുവാണ് മശീഹ
  alternative: മശീഹ യേശുവാണ്
  rationale: ആദ്യരൂപം ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികവും സുവിശേഷപ്രഖ്യാപനത്തിന്റെ ആശയം വ്യക്തവുമാണ്; എന്നാൽ ഗ്രീക്ക് ഘടന മറിച്ചുള്ള അവതരണവും അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
