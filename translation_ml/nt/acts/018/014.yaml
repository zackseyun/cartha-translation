  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് വായ്തുറക്കാൻ പോകുമ്പോൾ[a], ഗല്ലിയോ യെഹൂദന്മാരോടു പറഞ്ഞു: “യെഹൂദന്മാരേ, എന്തെങ്കിലും അന്യായമോ ദുഷ്ടമായ കുറ്റകൃത്യമോ[b] ആയിരുന്നെങ്കിൽ, ഞാൻ നിങ്ങളെ ന്യായമായും സഹിച്ചേനെ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൗലോസ് സംസാരിക്കാൻ പോകുമ്പോൾ.” “വായ് തുറക്കുക” എന്നത് സംസാരിക്കാൻ തുടങ്ങുക എന്നർഥമുള്ള ഗ്രീക്ക് ശൈലിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ദുഷ്ടമായ ക്രിമിനൽ പ്രവൃത്തി” അല്ലെങ്കിൽ “ദുരുദ്ദേശ്യത്തോടെയുള്ള കുറ്റം.” ഗ്രീക്ക് പ്രയോഗം കുറ്റകരമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന പദത്തോടൊപ്പം “ദുഷ്ടമായ” എന്ന വിശേഷണവും ചേർക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാൻ നിങ്ങളെ ന്യായമായും സഹിച്ചേനെ.” യഥാർഥമായ ഒരു നിയമലംഘനമോ കുറ്റകൃത്യമോ ആയിരുന്നെങ്കിൽ അവരുടെ പരാതി സഹിച്ചുകേൾക്കാൻ ഗല്ലിയോയ്ക്ക് ന്യായമുണ്ടാകുമായിരുന്നു എന്നാണ് സന്ദർഭത്തിലെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: പൗലോസ് വായ് തുറക്കാൻ ഒരുങ്ങുമ്പോൾ
  rationale: μέλλω + infinitive സൂചിപ്പിക്കുന്ന ആസന്നതയും ‘വായ് തുറക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗവും നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് സംസാരിക്കാൻ തുടങ്ങുക എന്ന അർഥത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: പൗലോസ് മറുപടി പറയാൻ തുടങ്ങുന്നതിനു മുമ്പേ ഗല്ലിയോ സംസാരിക്കുന്ന ആഖ്യാനപരമായ നേരിയ വൈരുധ്യം പ്രകടമാക്കുന്നു.
- source_word: Γαλλίων
  choice: ഗല്ലിയോ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: യെഹൂദന്മാരോടു
  rationale: മൂലത്തിലെ പൊതുവായ സംബോധിത വിഭാഗം നിലനിർത്തുന്നു; ‘പരാതിക്കാരായ യെഹൂദന്മാർ’ എന്ന സന്ദർഭവ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἀδίκημά τι
  choice: എന്തെങ്കിലും അന്യായം
  rationale: നിയമപരമായ തെറ്റ്, കുറ്റം, അനീതി എന്നിവ ഉൾക്കൊള്ളാവുന്ന ἀδίκημα എന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ῥᾳδιούργημα πονηρόν
  choice: ദുഷ്ടമായ കുറ്റകൃത്യം
  rationale: ῥᾳδιούργημα എന്ന കുറ്റകരമായ പ്രവൃത്തിയും πονηρόν എന്ന ധാർമികമായി ദുഷ്ടമായ വിശേഷണവും രണ്ടും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὦ Ἰουδαῖοι
  choice: യെഹൂദന്മാരേ
  rationale: ὦ സഹിതമുള്ള നേരിട്ടുള്ള സംബോധന മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപത്തിൽ നൽകുന്നു.
- source_word: κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν
  choice: നിങ്ങളുടെ വാദം കേൾക്കാൻ എനിക്ക് ന്യായമായ കാരണമുണ്ടാകുമായിരുന്നു
  rationale: κατὰ λόγον എന്നതിലെ ‘ന്യായമായ അടിസ്ഥാനത്തോടെ’ എന്ന ആശയവും ἀνέχομαι എന്നതിന്റെ സഹിക്കുക/ക്ഷമയോടെ കേൾക്കുക എന്ന സന്ദർഭാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗല്ലിയോ കേസ് പരിഗണിക്കുമായിരുന്നുവെന്ന ന്യായാധിപസന്ദർഭം വ്യക്തമാക്കുന്നു.
