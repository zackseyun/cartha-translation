  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗല്ലിയോയുടെ നിയമപരമായ ഭാഷയും നേരിയ അവഗണനാഭാവവും നിലനിർത്തിയിട്ടുണ്ട്; പഴഞ്ചൻ സംബോധനരൂപങ്ങളും അനാവശ്യമായ സഭാപര പദാവലിയും ഒഴിവാക്കി.
