id: ACT.18.22
reference: Acts 18:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: ml
  text: അവൻ കൈസര്യയിലേക്കു ഇറങ്ങിച്ചെന്നശേഷം, മുകളിലേക്കു കയറി സഭയെ[a] അഭിവാദ്യം ചെയ്തു; പിന്നെ അന്ത്യോഖ്യയിലേക്കു ഇറങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത് യെരൂശലേമിലെ സഭയായിരിക്കാനാണ് സാധ്യത. പല പരിഭാഷകളും ‘യെരൂശലേം’ എന്നു വാചകത്തിൽ വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് മൂലപാഠത്തിൽ ആ പേര് ഇല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελθὼν
  choice: ഇറങ്ങിച്ചെന്നശേഷം
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഭൂതകാല ക്രിയാവിശേഷണത്തിന്റെ അർഥവും ലൂക്കോസിന്റെ ദിശാസൂചകമായ യാത്രാഭാഷയും നിലനിർത്തുന്നു.
- source_word: Καισάρειαν
  choice: കൈസര്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം; സന്ദർഭത്തിൽ തീരദേശ കൈസര്യയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἀναβὰς
  choice: മുകളിലേക്കു ചെന്ന്
  rationale: ഗ്രീക്കിലെ ദിശാസൂചന നിലനിർത്തുന്നു; ലക്ഷ്യസ്ഥാനം യെരൂശലേം എന്നു മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἀσπασάμενος
  choice: അഭിവാദ്യം ചെയ്തു
  rationale: സന്ദർശിച്ചു എന്ന വ്യാഖ്യാനപരമായ വികസനത്തേക്കാൾ, അഭിവാദ്യം ചെയ്യുക എന്ന നേരിട്ടുള്ള അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: τὴν ἐκκλησίαν
  choice: സഭയെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ ക്രിസ്തീയ സമൂഹത്തെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപ്രയോഗം.
- source_word: κατέβη
  choice: ഇറങ്ങിപ്പോയി
  rationale: ഗ്രീക്കിലെ ദിശാസൂചക അർഥവും യാത്രാവിവരണത്തിന്റെ ചലനഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: Ἀντιόχειαν
  choice: അന്ത്യോഖ്യ
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള സ്ഥലനാമരൂപം; ഇവിടെ സിറിയയിലെ അന്ത്യോഖ്യയാണ് സന്ദർഭപരമായി ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: “മുകളിലേക്കു ചെന്ന്” എന്നതിന്റെ സൂചിത ലക്ഷ്യസ്ഥാനം യെരൂശലേം എന്നു വ്യക്തമാക്കണമോ
  choice: പ്രധാനവാചകത്തിൽ ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കാതെ വിടുക
  alternative: “യെരൂശലേമിലേക്കു കയറിച്ചെന്ന്” എന്നു പരിഭാഷപ്പെടുത്തുക
  rationale: കൈസര്യയിൽനിന്ന് മുകളിലേക്കു ചെന്നു ‘സഭയെ’ അഭിവാദ്യം ചെയ്തതും തുടർന്ന് അന്ത്യോഖ്യയിലേക്കു ഇറങ്ങിപ്പോയതും യെരൂശലേമിലേക്കുള്ള സന്ദർശനം ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് മൂലപാഠം യെരൂശലേമിനെ പേരെടുത്ത് പറയുന്നില്ല; അതിനാൽ സൂചനയെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ച് മൂലപാഠത്തിലെ അവ്യക്തത പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ‘ഇറങ്ങിച്ചെന്നശേഷം / മുകളിലേക്കു ചെന്ന് / ഇറങ്ങിപ്പോയി’ എന്ന ദിശാസൂചക പരമ്പര മൂലപാഠത്തിന്റെ ഭൂപ്രകൃതിസംബന്ധമായ ഭാഷ നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട മുഴുവൻ യാത്രാക്രമത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
