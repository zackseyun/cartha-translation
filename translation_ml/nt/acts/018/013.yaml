id: ACT.18.13
reference: Acts 18:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: ml
  text: “ഈ മനുഷ്യൻ നിയമത്തിനു[b] വിരുദ്ധമായി[a] ദൈവത്തെ ആരാധിക്കാൻ ആളുകളെ പ്രേരിപ്പിക്കുന്നു,” എന്ന് അവർ പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിയമത്തിനെതിരായി” അല്ലെങ്കിൽ “നിയമം ലംഘിച്ചുകൊണ്ട്.”
    reason: lexical_alternative
  - marker: b
    text: ആരോപകർ ഉദ്ദേശിക്കുന്നത് യഹൂദനിയമമായിരിക്കാം; എന്നാൽ ഗ്രീക്കിൽ “നിയമം” എന്നു മാത്രമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: എന്ന് അവർ പറഞ്ഞു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ആരോപണത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിച്ചു.
- source_word: Παρὰ τὸν νόμον
  choice: നിയമത്തിനു വിരുദ്ധമായി
  rationale: Accusative-നോടുകൂടിയ παρά ഇവിടെ നിയമത്തോടുള്ള വിരുദ്ധതയെയോ നിയമലംഘനത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നിയമത്തിനു വിരുദ്ധമായി’ ആരോപണത്തിന്റെ നിയമപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀναπείθει
  choice: പ്രേരിപ്പിക്കുന്നു
  rationale: മറ്റുള്ളവരെ ഒരു പ്രവൃത്തിയിലേക്കോ നിലപാടിലേക്കോ കൊണ്ടുവരുന്ന സ്വാധീനത്തെ ഈ പദം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ നിർബന്ധമല്ലാത്ത ‘വഴിതെറ്റിക്കുന്നു’ എന്ന പ്രതികൂല അർഥം ചേർക്കാതെ വർത്തമാനകാല പ്രവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: ആരോപണത്തിൽ ചൂണ്ടിക്കാണിക്കുന്ന demonstrative-ന്റെ ഊന്നൽ നിലനിർത്തുന്നു; അനാവശ്യമായ നിന്ദാഭാവം ചേർക്കുന്നില്ല.
- source_word: τοὺς ἀνθρώπους
  choice: ആളുകളെ
  rationale: ഇവിടെ ἄνθρωποι പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, പൊതുവായി മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്. ആ ഉൾക്കൊള്ളുന്ന അർഥം ‘ആളുകളെ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σέβεσθαι τὸν θεόν
  choice: ദൈവത്തെ ആരാധിക്കാൻ
  rationale: ഈ സന്ദർഭത്തിൽ σέβομαι മതപരമായ ഭക്തിയും ആരാധനയും സൂചിപ്പിക്കുന്നു; ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: τὸν νόμον
  choice: നിയമം
  rationale: മൂലപാഠം ‘നിയമം’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. സന്ദർഭത്തിൽ യഹൂദനിയമമാണ് ഉദ്ദേശിക്കപ്പെടുന്നതെങ്കിലും അത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചു ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ആരോപണത്തിലെ ‘നിയമം’ എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘നിയമം’ എന്ന പൊതുവായ രൂപം നിലനിർത്തി.
  alternative: ‘യഹൂദനിയമം’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ നിയമം’
  rationale: ആരോപകർ യഹൂദനിയമത്തെ ഉദ്ദേശിച്ചിരിക്കാനാണ് സാധ്യത. എങ്കിലും ഗ്രീക്ക് പാഠം τὸν νόμον എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ സന്ദർഭവിവരം അടിക്കുറിപ്പിൽ നൽകി, മുഖ്യപാഠത്തിലെ യഥാർഥ പരിമിതി സംരക്ഷിച്ചു.
- issue: ἀνθρώπους എന്ന പൊതുവായ പുരുഷലിംഗ ബഹുവചനം
  choice: ആളുകളെ
  alternative: പുരുഷന്മാരെ
  rationale: ഈ പ്രയോഗം പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതമല്ല; പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ നിയമ-മതപരമായ ആരോപണശൈലി ഉപയോഗിച്ചു. നേരിട്ടുള്ള ഉദ്ധരണി മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിൽ നൽകി; മൂലത്തിലെ അർഥപരമായ നിയന്ത്രണവും ‘നിയമം’ എന്ന പദത്തിന്റെ സന്ദർഭപരമായ അവ്യക്തതയും സംരക്ഷിച്ചു.
