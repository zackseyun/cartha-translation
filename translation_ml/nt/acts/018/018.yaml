id: ACT.18.18
reference: Acts 18:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: ml
  text: പൗലോസ് പിന്നെയും കുറേ ദിവസം അവിടെ കഴിഞ്ഞശേഷം സഹോദരങ്ങളോട്[a] യാത്രപറഞ്ഞ് സിറിയയിലേക്കു കപ്പൽ കയറി. പ്രിസ്കില്ലയും അക്വിലാസും അദ്ദേഹത്തോടൊപ്പം ഉണ്ടായിരുന്നു. ഒരു നേർച്ച ഉണ്ടായിരുന്നതിനാൽ അദ്ദേഹം കെൻക്രെയയിൽവെച്ച് തലമുടി മുറിച്ചു[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘സഹോദരങ്ങൾ’ എന്നു പറയുന്നത് സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട വിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘തല മുണ്ഡനം ചെയ്തു’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്കുപദം മുടി മുറിക്കുകയോ കത്രിക്കുകയോ ചെയ്യുന്നതിനെ കൂടുതൽ പൊതുവായും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: തലമുടി മുറിച്ചതും നേർച്ച ഉണ്ടായിരുന്നതും പൗലോസിനെക്കുറിച്ചാണെന്ന് ഗ്രീക്ക് വ്യാകരണം ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ ചിലർ ഇവ അക്വിലാസിനെക്കുറിച്ചാണെന്ന് കരുതുന്നു.
    reason: alternative_reading
  - marker: d
    text: മൂലപാഠം ‘ഒരു നേർച്ച’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. പലരും ഇതിനെ നാസീർവ്രതസദൃശമായ നേർച്ചയുമായി ബന്ധിപ്പിക്കുന്നുണ്ടെങ്കിലും അങ്ങനെ പ്രത്യേകം വ്യക്തമാക്കിയിട്ടില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: പിന്നെയും കുറേ ദിവസം അവിടെ കഴിഞ്ഞശേഷം
  rationale: ἔτι സഹിതമുള്ള പ്രയോഗം തുടർന്നുള്ള ഗണ്യമായ കാലയളവിനെ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ പറഞ്ഞ സ്ഥലത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവിടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: τοῖς ἀδελφοῖς
  choice: സഹോദരങ്ങളോട്
  rationale: വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന കുടുംബബന്ധപദത്തിന്റെ ഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ സമൂഹത്തെ പൊതുവായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀποταξάμενος
  choice: യാത്രപറഞ്ഞ്
  rationale: ആളുകളോട് വിടപറയുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: സിറിയയിലേക്കു കപ്പൽ കയറി
  rationale: ἐκπλέω സൂചിപ്പിക്കുന്ന കപ്പൽമാർഗമുള്ള പുറപ്പെടൽ ലക്ഷ്യസ്ഥാനത്തോടുകൂടെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: പ്രിസ്കില്ലയും അക്വിലാസും അദ്ദേഹത്തോടൊപ്പം ഉണ്ടായിരുന്നു
  rationale: ഗ്രീക്കിലെ അനുഗമനഘടകം പ്രത്യേക വാക്യമായി നൽകി കൂട്ടാളികൾ ഇരുവരെയും വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: κειράμενος … τὴν κεφαλήν
  choice: തലമുടി മുറിച്ചു
  rationale: κείρω മുടി മുറിക്കുകയോ കത്രിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം; പൂർണമായി മുണ്ഡനം ചെയ്തുവെന്ന് നിർബന്ധിക്കാതെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν Κεγχρεαῖς
  choice: കെൻക്രെയയിൽവെച്ച്
  rationale: സ്ഥലനാമം ഗ്രീക്കിനോട് ചേർന്ന രീതിയിൽ ലിപ്യന്തരണം ചെയ്ത് പ്രവൃത്തിയുടെ സ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: εἶχεν γὰρ εὐχήν
  choice: ഒരു നേർച്ച ഉണ്ടായിരുന്നതിനാൽ
  rationale: ഒരു വ്രതവിഭാഗം പ്രത്യേകം നിർണ്ണയിക്കാതെ εὐχήയുടെ പൊതുവായ അർഥം നിലനിർത്തുകയും γάρ നൽകുന്ന കാരണബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κειράμενος എന്ന കർത്തൃവാചക വിശേഷണത്തിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനവാക്യത്തിൽ ഇത് പൗലോസിനെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ചിലർ ഇത് അക്വിലാസിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
  rationale: പുരുഷലിംഗ ഏകവചനമായ κειράμενος വാക്യത്തിന്റെ നിയന്ത്രക കർത്താവായ Παῦλος-നോടാണ് ഏറ്റവും സ്വാഭാവികമായി യോജിക്കുന്നത്. എന്നാൽ വ്യാഖ്യാനചരിത്രത്തിലെ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: εὐχήയുടെ സ്വഭാവം
  choice: പൊതുവായി ‘ഒരു നേർച്ച’ എന്നു നൽകി.
  alternative: നാസീർവ്രതസദൃശമായ ഒരു നേർച്ച എന്നു പ്രത്യേകീകരിക്കുക.
  rationale: മൂലവാക്യം നേർച്ചയുടെ തരം പറയുന്നില്ല; അതിനാൽ പ്രത്യേക ആചാരവിഭാഗം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; സംഭവക്രമവും കർത്തൃബന്ധവും നിലനിർത്തി. ‘തലമുടി മുറിച്ചു’ എന്നത് ‘മുണ്ഡനം ചെയ്തു’ എന്നതിനെക്കാൾ കുറഞ്ഞ വ്യാഖ്യാനഭാരം ഉള്ള തിരഞ്ഞെടുപ്പാണ്.
