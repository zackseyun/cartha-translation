id: ACT.18.10
reference: Acts 18:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: ml
  text: കാരണം, ഞാൻ നിന്നോടുകൂടെയുണ്ട്; നിന്നെ ഉപദ്രവിക്കാൻ ആരും നിന്നെ ആക്രമിക്കുകയില്ല[a]. കാരണം, ഈ നഗരത്തിൽ എനിക്ക് അനേകം പേർ ഉണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്നെ ഉപദ്രവിക്കാൻ ആരും നിന്റെമേൽ കൈവെക്കുകയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ നഗരത്തിൽ എനിക്ക് അനേകം പേർ ഉണ്ട്’ എന്നത് കൊരിന്തിൽ കർത്താവിനുള്ളവരെയും ഇനിയും വിശ്വസിക്കാനിരിക്കുന്നവരെയും ഉൾപ്പെടുത്തി സൂചിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ കല്പനയ്ക്കുള്ള കാരണവും വാക്യത്തിന്റെ അവസാനഭാഗത്ത് വാഗ്ദാനത്തിനുള്ള കാരണവും അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് കാരണസൂചകത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: ഞാൻ നിന്നോടുകൂടെയുണ്ട്
  rationale: ദൈവിക സാന്നിധ്യത്തിന്റെ ഉറപ്പ് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ἐγώ എന്ന പ്രകടമായ സർവനാമത്തിന്റെ ഊന്നൽ ‘ഞാൻ’ നിലനിർത്തുന്നു.
- source_word: οὐδεὶς
  choice: ആരും … ഇല്ല
  rationale: ഗ്രീക്കിലെ സമ്പൂർണ നിഷേധം മലയാളത്തിലെ സ്വാഭാവികമായ നിഷേധഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιθήσεταί σοι
  choice: നിന്നെ ആക്രമിക്കുകയില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ സൂചിപ്പിക്കുന്ന ശത്രുതാപരമായ നീക്കം നേരിട്ട് വ്യക്തമാക്കുന്നു. ‘നിന്റെമേൽ കൈവെക്കുകയില്ല’ എന്ന കൂടുതൽ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τοῦ κακῶσαί σε
  choice: നിന്നെ ഉപദ്രവിക്കാൻ
  rationale: ആക്രമണത്തിന്റെ ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന articular infinitive-ന്റെ വ്യാപകമായ അർഥം നിലനിർത്തുന്നു; ശാരീരിക പരിക്ക് മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: λαός
  choice: പേർ
  rationale: ഇവിടെ കൂട്ടമായി കർത്താവിനോടു ബന്ധപ്പെട്ട മനുഷ്യരെ സൂചിപ്പിക്കുന്നു. ‘അനേകം പേർ’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘ഒരു ജനം’ എന്ന രൂപം ഈ വാക്യത്തിൽ അസ്വാഭാവികമായിരിക്കും.
- source_word: ἐστί μοι
  choice: എനിക്ക് … ഉണ്ട്
  rationale: εἰμί + dative എന്ന ഉടമസ്ഥതാസൂചക ഗ്രീക്ക് ഘടനയുടെ സ്വാഭാവികമായ മലയാള തുല്യരൂപം.
- source_word: πολὺς
  choice: അനേകം
  rationale: അളവിനെ നേരിട്ട് സൂചിപ്പിക്കുകയും ഗൗരവമുള്ള ആധുനിക മലയാള ശൈലിക്ക് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: ഈ നഗരത്തിൽ
  rationale: കൊരിന്തുപോലുള്ള നഗരകേന്ദ്രത്തിന് πόλις എന്നതിന്റെ യോജിച്ച മലയാളരൂപം; demonstrative-ന്റെ സമീപസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഈ നഗരത്തിൽ എനിക്ക് അനേകം പേർ ഉണ്ട്’ എന്നതിന്റെ അർഥം
  choice: വാചകം കർത്താവിനോടു ബന്ധപ്പെട്ട അനേകം പേർ നഗരത്തിലുണ്ടെന്ന് പറയുന്നു; ഇനിയും വിശ്വസിക്കാനിരിക്കുന്നവരും ഇതിൽ ഉൾപ്പെടാം എന്ന സാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ഇതിനകം പൗലോസിനോട് അനുകൂലമായി നിൽക്കുന്ന അനേകം ആളുകളെ മാത്രം സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: പ്രധാനവാചകം ഗ്രീക്കിലെ ഉടമസ്ഥതാഭാഷ അതേപടി നിലനിർത്തി, ദൈവിക മുൻജ്ഞാനം, തിരഞ്ഞെടുപ്പ്, ഭാവിയിലെ വിശ്വാസം എന്നിവയിൽ ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല. പ്രസംഗം തുടരാനുള്ള പൗലോസിന്റെ ധൈര്യത്തിന് ഈ പ്രസ്താവന അടിസ്ഥാനം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ദൈവിക പ്രസംഗത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് കാരണവാക്യങ്ങളും ‘കാരണം’ എന്നു തുറന്നുപറഞ്ഞ് നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ സ്ഥാപിച്ചിരിക്കുന്നു.
