id: ACT.18.27
reference: Acts 18:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: ml
  text: അവൻ അക്കായയിലേക്കു കടന്നുപോകാൻ ആഗ്രഹിച്ചപ്പോൾ, സഹോദരന്മാർ[a] അവനെ പ്രോത്സാഹിപ്പിച്ച്, അവനെ സ്വീകരിക്കണമെന്ന് ശിഷ്യന്മാർക്ക് എഴുതി. അവിടെ എത്തിയ അവൻ, കൃപയാൽ വിശ്വസിച്ചവരെ[b] വളരെ സഹായിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്നത് സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാം; ഗ്രീക്കിൽ പുല്ലിംഗരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ, ‘കൃപയാൽ’ എന്ന പദസമുച്ചയം ‘വളരെ സഹായിച്ചു’ എന്നതോടു ബന്ധിപ്പിക്കാം: ‘അവിടെ എത്തിയ അവൻ, വിശ്വസിച്ചവരെ കൃപയാൽ വളരെ സഹായിച്ചു.’'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: അവൻ ... ആഗ്രഹിച്ചപ്പോൾ
  rationale: അപ്പോല്ലോസിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന genitive absolute സ്വാഭാവികമായ കാലസാഹചര്യവാക്യമായി പരിഭാഷപ്പെടുത്തി; അവന്റെ സ്വമേധയുള്ള ആഗ്രഹം നിലനിർത്തുന്നു.
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: അക്കായയിലേക്കു കടന്നുപോകാൻ
  rationale: എഫെസൊസിൽനിന്ന് അക്കായ പ്രദേശത്തേക്കുള്ള യാത്രയിലെ കടന്നുപോകൽ/കടക്കൽ ഭാവം സംരക്ഷിക്കുന്നു; വെറും ‘പോകാൻ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രിയയുടെ യാത്രാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: προτρεψάμενοι
  choice: പ്രോത്സാഹിപ്പിക്കുകയും
  rationale: പിന്തുണയോടെയുള്ള പ്രേരണയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘നിർബന്ധിച്ചു’ എന്ന അതിശക്തമായ ഭാവം ഒഴിവാക്കുന്നു.
- source_word: οἱ ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; ആദിമക്രൈസ്തവ പ്രയോഗത്തിൽ ഇത് സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാർക്ക് എഴുതുകയും ചെയ്തു
  rationale: γράφω + dative എന്ന ലളിതഘടനയും μαθηταί എന്ന അപ്പൊസ്തലപ്രവൃത്തികളിലെ പതിവുപദവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀποδέξασθαι αὐτόν
  choice: അവനെ സ്വാഗതം ചെയ്യണമെന്ന്
  rationale: അപ്പോല്ലോസിനെ അനുകൂലമായും അതിഥിസൽക്കാരത്തോടെയും സ്വീകരിക്കണമെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὃς παραγενόμενος
  choice: അവിടെ എത്തിയ അവൻ
  rationale: ബന്ധസർവ്വനാമവും participle-ഉം ചേർന്ന ഘടന അപ്പോല്ലോസിനെ വീണ്ടും വിഷയമാക്കി അവന്റെ വരവിനുശേഷമുള്ള പ്രവൃത്തി അവതരിപ്പിക്കുന്നു.
- source_word: συνεβάλετο πολὺ
  choice: വളരെ സഹായിച്ചു
  rationale: സന്ദർഭത്തിൽ മദ്ധ്യമപ്രയോഗത്തിലുള്ള συμβάλλω ഗണ്യമായ സഹായം നൽകുക എന്ന അർഥത്തിലാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ തിരഞ്ഞെടുത്തു.
- source_word: τοῖς πεπιστευκόσιν
  choice: വിശ്വസിച്ചവരെ
  rationale: perfect participle മുൻപ് വിശ്വാസത്തിലേക്കു വന്നവരെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘വിശ്വസിച്ചവർ’ എന്നു നൽകി.
- source_word: διὰ τῆς χάριτος
  choice: കൃപയാൽ
  rationale: διά + genitive എന്ന മാർഗം/മാധ്യമം സൂചിപ്പിക്കുന്ന പ്രയോഗം സംക്ഷിപ്തമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന പദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: διὰ τῆς χάριτος എന്ന പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: ‘കൃപയാൽ വിശ്വസിച്ചവർ’—ഇത് വിശ്വസിച്ചതിനോടു ബന്ധിപ്പിച്ചു.
  alternative: ‘കൃപയാൽ അവൻ വിശ്വസിച്ചവരെ വളരെ സഹായിച്ചു’—ഇത് അപ്പോല്ലോസിന്റെ സഹായത്തോടു ബന്ധിപ്പിക്കാം.
  rationale: വാക്യഘടനയിലും സന്ദർഭത്തിലും ഈ പദസമുച്ചയം വിശ്വസിച്ചവരോടു ചേർക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം. എങ്കിലും ഗ്രീക്ക് വാക്യത്തിൽ യഥാർഥമായ ബന്ധദ്വയാർഥത ഉള്ളതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അക്കായ’ എന്ന ചരിത്രപ്രദേശനാമവും ‘ശിഷ്യന്മാർ’, ‘കൃപ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങളും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
