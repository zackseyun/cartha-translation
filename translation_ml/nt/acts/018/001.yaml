translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘അദ്ദേഹം’ എന്ന സർവനാമം ഗ്രീക്കിൽ പരാമർശിക്കപ്പെടാതെ മനസ്സിലാക്കപ്പെടുന്ന പൗലോസിനെ സൂചിപ്പിക്കുന്നു. സ്ഥലനാമങ്ങൾക്ക് മലയാളത്തിൽ പരിചിതമായ ‘അഥേന’, ‘കൊരിന്ത്’ രൂപങ്ങൾ ഉപയോഗിച്ചു.
