  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: ml
  text: ഇതിനുശേഷം[a] അദ്ദേഹം അഥേന വിട്ട് കൊരിന്തിലേക്കു പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഈ കാര്യങ്ങൾക്കുശേഷം, അഥേനയിൽനിന്ന് പുറപ്പെട്ട്, അദ്ദേഹം കൊരിന്തിലേക്കു വന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇതിനുശേഷം
  rationale: ആഖ്യാനത്തിലെ സംഭവക്രമം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ കാലസൂചക പ്രയോഗം; ഗ്രീക്കിലെ അക്ഷരാർഥമായ ‘ഈ കാര്യങ്ങൾക്കുശേഷം’ എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: χωρισθεὶς
  choice: വിട്ട്
  rationale: χωρίζω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗത്തിലുള്ള ഭൂതകാല കൃദന്തരൂപം ഇവിടെ ഒരു സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വിട്ട്’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: അഥേന
  rationale: ἐκ പുറപ്പെടുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു. ‘വിട്ട്’ എന്ന ക്രിയയോടൊപ്പം മലയാളത്തിൽ നഗരനാമം നേരിട്ട് ചേർക്കുന്നത് ‘അഥേനയിൽനിന്ന്’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: ἦλθεν
  choice: പോയി
  rationale: ἔρχομαι അടിസ്ഥാനമായി ‘വന്നു’ എന്നു വരാമെങ്കിലും, അഥേനയിൽനിന്ന് മറ്റൊരു നഗരത്തിലേക്കുള്ള ആഖ്യാനചലനം മലയാളത്തിൽ സാധാരണയായി ‘പോയി’ എന്നാണ് പറയുന്നത്.
- source_word: εἰς Κόρινθον
  choice: കൊരിന്തിലേക്കു
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘കൊരിന്തിലേക്കു’ ആ ദിശയും ലക്ഷ്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
