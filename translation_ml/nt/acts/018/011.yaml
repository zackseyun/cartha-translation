  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: ml
  text: അങ്ങനെ അവൻ അവിടെ ഒരു വർഷവും ആറു മാസവും താമസിച്ചു; അവരുടെ ഇടയിൽ ദൈവത്തിന്റെ വചനം പഠിപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: അവിടെ താമസിച്ച്
  rationale: അക്ഷരാർഥത്തിൽ ‘ഇരുന്നു’ എന്നാണെങ്കിലും, ഒരു നിശ്ചിത കാലയളവ് ഒരിടത്ത് തുടർന്നുകഴിഞ്ഞു എന്ന ആഖ്യാനപരമായ പ്രയോഗമാണ് ഇവിടെ. ‘അവിടെ താമസിച്ച്’ എന്നത് ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ ദൈവിക പ്രോത്സാഹനത്തോടുള്ള മൃദുവായ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്നു; ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കാതെ തുടർഫലം പ്രകടമാക്കുന്നു.
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: ഒരു വർഷവും ആറു മാസവും
  rationale: കാലദൈർഘ്യം നേരായും സ്വാഭാവികമായും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διδάσκων
  choice: പഠിപ്പിച്ചു
  rationale: താമസിച്ചിരുന്ന കാലയളവിൽ തുടർന്നുനിന്ന അനുബന്ധപ്രവർത്തനമാണ് കർത്തൃവാചകത്തിലെ വർത്തമാന പങ്കുപദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ക്രിയാശൃംഖലയിൽ ‘താമസിച്ച് ... പഠിപ്പിച്ചു’ എന്ന രൂപം ഈ സമകാലികത സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവരുടെ ഇടയിൽ
  rationale: സമൂഹത്തിന്റെ മധ്യേ നടന്ന ശുശ്രൂഷ എന്ന സ്ഥല-സാമൂഹിക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: പ്രവൃത്തികളിൽ ദൈവത്തിൽനിന്നുള്ള പ്രഖ്യാപിത സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ബൈബിൾ പ്രയോഗം സംരക്ഷിക്കുന്നു; സാധാരണ വായനക്കാർക്കും മനസ്സിലാകുന്ന രൂപമാണിത്.
