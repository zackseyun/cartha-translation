id: ACT.18.7
reference: Acts 18:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: ml
  text: അവിടെനിന്ന് മാറി, ദൈവത്തെ ആരാധിക്കുന്ന[a] തീത്തിയൊസ് യൂസ്തൊസ് എന്നൊരാളുടെ വീട്ടിൽ അവൻ ചെന്നു. അയാളുടെ വീട് സിനഗോഗിനോടു തൊട്ടുചേർന്നതായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തെ ഭയപ്പെടുന്ന’ അല്ലെങ്കിൽ ‘ദൈവഭക്തൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ ഗ്രീക്ക് പ്രയോഗം ഇസ്രായേലിന്റെ ദൈവത്തോടുള്ള ഭക്തിയെയോ ആരാധനയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സിനഗോഗിനോടു ചേർന്നതായിരുന്നു’ അല്ലെങ്കിൽ ‘സിനഗോഗുമായി അതിർത്തി പങ്കിട്ടിരുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: അവിടെനിന്ന് മാറി
  rationale: മുമ്പുണ്ടായിരുന്ന സ്ഥലത്തുനിന്നുള്ള നീക്കവും മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തനക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: എന്നൊരാളുടെ വീട്ടിൽ അവൻ ചെന്നു
  rationale: ഗ്രീക്കിലെ ‘പ്രവേശിച്ചു’ എന്ന ആശയം മലയാളത്തിലെ കഥനശൈലിയിൽ സ്വാഭാവികമായി നൽകുന്നു; ഉടമയെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത സർവനാമവും നിലനിർത്തുന്നു.
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: തീത്തിയോസ് യൂസ്തോസ് എന്ന
  rationale: ഗ്രീക്ക് വ്യക്തിനാമങ്ങളെ അവയുടെ നാമരൂപം അനുസരിച്ച് മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: σεβομένου τὸν θεόν
  choice: ദൈവത്തെ ആരാധിച്ചിരുന്ന
  rationale: σέβομαι എന്ന പദത്തിന്റെ ഭക്തിപൂർവമായ ആരാധന എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; സാങ്കേതികമായ ഒരു സാമൂഹിക വിഭാഗപ്പേര് പ്രധാന വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οὗ ἡ οἰκία
  choice: അയാളുടെ വീട്
  rationale: ബന്ധസർവനാമത്തിന്റെ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ വ്യക്തതയോടെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: സിനഗോഗിനോടു തൊട്ടുചേർന്നതായിരുന്നു
  rationale: സിനഗോഗിനോടു ചേർന്നോ അതുമായി അതിർത്തി പങ്കിട്ടോ ഉണ്ടായിരുന്നതെന്ന സ്ഥലബന്ധം കൃത്യമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: തീത്തിയോസ് യൂസ്തോസിനെ σεβόμενος τὸν θεόν എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: ദൈവത്തെ ആരാധിച്ചിരുന്ന
  alternative: ദൈവത്തെ ഭയപ്പെട്ടിരുന്ന; ദൈവഭക്തനായിരുന്ന
  rationale: ഈ പ്രയോഗം ഇസ്രായേലിന്റെ ദൈവത്തോടു ഭക്തിയുണ്ടായിരുന്ന ഒരു യഹൂദേതരനെ സൂചിപ്പിക്കാം. എന്നാൽ ഗ്രീക്ക് വാചകം നിർബന്ധിക്കാത്ത ഒരു സാങ്കേതിക വിഭാഗപ്പേര് പ്രധാന പാഠത്തിൽ ഏർപ്പെടുത്താതെ വിവരണാത്മകമായി വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ പദം സ്ഥാപനത്തിന്റെ പ്രത്യേക യഹൂദസ്വഭാവം നിലനിർത്തുന്നു; വാക്യം മലയാളത്തിൽ ഭാരമാകാതിരിക്കാൻ ഗ്രീക്കിലെ ബന്ധവാക്യം രണ്ടാമത്തെ വാക്യമായി നൽകിയിരിക്കുന്നു.
