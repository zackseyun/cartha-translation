  naturalness: വാക്യവിഭജനം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ആരാധിച്ചിരുന്ന’ സാധുവാണെങ്കിലും, ഗ്രീക്കിലെ വർത്തമാനകാല വിശേഷണപ്രയോഗത്തിന് ‘ആരാധിക്കുന്ന’ കൂടുതൽ നേരിട്ടുള്ള സമാനതയാണ്. പേരുകളുടെ അവസാനത്തിലുള്ള ‘-യൊസ്’, ‘-യുസ്തൊസ്’ രൂപങ്ങൾ ഗ്രീക്ക് നാമരൂപത്തോടും മലയാളത്തിലെ സാധാരണ ബൈബിൾ-നാമലിപ്യന്തരത്തോടും കൂടുതൽ യോജിക്കുന്നു.
  terminology: ‘ദൈവത്തെ ആരാധിക്കുന്ന’ എന്ന വിവരണാത്മക പ്രയോഗം σέβομαι-യുടെ അർഥം നിലനിർത്തുന്നു; സാങ്കേതിക സാമൂഹികവിഭാഗപ്പേര് മുഖ്യപാഠത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല. ‘സിനഗോഗ്’ ഉചിതമാണ്. അടിക്കുറിപ്പിൽ ‘ദൈവഭക്തൻ’ എന്ന ബദൽ നൽകാം, പക്ഷേ അത് നിർബന്ധമായ സാങ്കേതിക പദവിയെന്നോ യഹൂദേതര പദവിയെന്നോ അവതരിപ്പിക്കരുത്.
