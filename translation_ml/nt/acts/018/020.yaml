id: ACT.18.20
reference: Acts 18:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐρωτώντων δὲ αὐτῶν ἐπὶ πλείονα χρόνον ⸀μεῖναι οὐκ ἐπένευσεν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/020.yaml
  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: ml
  text: എന്നാൽ, കൂടുതൽ കാലം അവിടെ താമസിക്കണമെന്ന് അവർ അപേക്ഷിച്ചപ്പോൾ, അദ്ദേഹം അതിന് സമ്മതിച്ചില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അദ്ദേഹം അതിനോട് യോജിച്ചില്ല’ അല്ലെങ്കിൽ ‘അദ്ദേഹം ആ അപേക്ഷ സ്വീകരിച്ചില്ല.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു അഭ്യർഥനയ്ക്ക് സമ്മതം നൽകുക എന്ന അർഥമാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων
  choice: അവർ അപേക്ഷിച്ചപ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തോടുകൂടിയ genitive absolute ഇവിടെ കാലസൂചക ഉപവാക്യമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം. സന്ദർഭത്തിൽ ഇത് വെറും ചോദ്യം അല്ല, താമസിക്കാനുള്ള അഭ്യർഥനയായതിനാൽ ‘അപേക്ഷിച്ചപ്പോൾ’ യോജിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ നിന്നുള്ള മൃദുവായ വൈരുധ്യവും ആഖ്യാനത്തിലെ വഴിത്തിരിവും പ്രകടമാക്കുന്നു.
- source_word: αὐτῶν
  choice: അവർ
  rationale: സന്ദർഭത്തിൽ എഫെസൊസിലുള്ള അഭ്യർഥകരെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ കർത്താവ് തുറന്നുപറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἐπὶ πλείονα χρόνον
  choice: കൂടുതൽ കാലം
  rationale: πλείονα എന്ന താരതമ്യഭാവവും ദീർഘിപ്പിച്ച സമയമെന്ന അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μεῖναι
  choice: അവിടെ താമസിക്കണമെന്ന്
  rationale: യാത്രാവിവരണത്തിന്റെ സന്ദർഭത്തിൽ ‘താമസിക്കുക’ സ്വാഭാവികമാണ്. ലക്ഷ്യസ്ഥലം സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ മലയാളപ്രവാഹത്തിനായി ‘അവിടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: οὐκ ἐπένευσεν
  choice: അദ്ദേഹം അതിന് സമ്മതിച്ചില്ല
  rationale: ἐπινεύω അഭ്യർഥനയ്ക്ക് അനുമതി നൽകുക അഥവാ സമ്മതിക്കുക എന്നർഥം നൽകുന്നു. ‘സമ്മതിച്ചില്ല’ മൂലത്തിലെ നിഷേധരൂപം കാത്തുസൂക്ഷിക്കുകയും ‘നിരസിച്ചു’ എന്നതിലെ ശക്തമായ ഭാവം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അദ്ദേഹം’ എന്ന ആദരസൂചക സർവനാമം സാധാരണ മലയാള ബൈബിൾ വായനാശീലത്തോട് ഒത്തുപോകുന്നു; പദപ്രയോഗം അനാവശ്യമായി സഭാപരമോ അതിപുരാതനമോ ആക്കിയിട്ടില്ല.
