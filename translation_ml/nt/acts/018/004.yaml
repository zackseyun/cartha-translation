  to: അവൻ ഓരോ ശബ്ബത്തിലും സിനഗോഗിൽ സംവാദം നടത്തുകയും[a] യെഹൂദന്മാരെയും ഗ്രീക്കുകാരെയും[c] ബോധ്യപ്പെടുത്തുകയും[b] ചെയ്തിരുന്നു.
  rationale: പ്രധാന തിരുത്തൽ ἔπειθεν-നെ ‘ബോധ്യപ്പെടുത്തുകയും’ എന്നു നൽകുന്നതാണ്. ഇതു പ്രേരണാപ്രവർത്തനത്തെ വിവർത്തനം ചെയ്യുമ്പോൾ വിജയഫലമോ വെറും ശ്രമമോ എന്നതിൽ മൂലം വ്യക്തമാക്കാത്ത പരിധി കാത്തുസൂക്ഷിക്കുന്നു. ‘സമ്മതിപ്പിക്കാൻ ശ്രമിക്കുകയും’ എന്ന വ്യാഖ്യാനസാദ്ധ്യത പാദക്കുറിപ്പിൽ നിലനിർത്തി. പാദക്കുറിപ്പ് c-യുടെ ആങ്കർ അതു വിശദീകരിക്കുന്ന ‘ഗ്രീക്കുകാരെ’ എന്ന പദത്തിലേക്കു മാറ്റുകയും ചെയ്തു.
