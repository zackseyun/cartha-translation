  naturalness: പരിഷ്കരിച്ച വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ‘ഓരോ ശബ്ബത്തിലും’ വിതരണാർഥം വ്യക്തമായി നൽകുന്നു; ‘ചെയ്തിരുന്നു’ രണ്ടു അപൂർണഭൂതകാല ക്രിയകളുടെയും ആവർത്തിത സ്വഭാവം വഹിക്കുന്നു.
