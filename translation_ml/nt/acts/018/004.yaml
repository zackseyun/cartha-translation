id: ACT.18.4
reference: Acts 18:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: ml
  text: അവൻ ഓരോ ശബ്ബത്തിലും സിനഗോഗിൽ സംവാദം നടത്തുകയും[a] യെഹൂദന്മാരെയും ഗ്രീക്കുകാരെയും[c] ബോധ്യപ്പെടുത്തുകയും[b] ചെയ്തിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ചർച്ച ചെയ്യുകയായിരുന്നു’ അല്ലെങ്കിൽ ‘വാദിക്കുകയായിരുന്നു.’ ഗ്രീക്ക് ക്രിയ യുക്തിപൂർവമായ സംഭാഷണത്തെയോ വാദത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘സമ്മതിപ്പിക്കാൻ ശ്രമിക്കുകയും.’ ഗ്രീക്ക് ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം തുടർന്നോ ആവർത്തിച്ചോ നടന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; അതു വിജയകരമായ ഫലം നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, സിനഗോഗുമായി ബന്ധമുണ്ടായിരുന്ന ഗ്രീക്കുകാർ ആയിരിക്കാം; ചിലർ ഇതിനെ കൂടുതൽ പൊതുവായി ‘വിജാതീയർ’ എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: സംവാദത്തിലേർപ്പെടുകയും
  rationale: ക്രിയയുടെ അപൂർണ്ണ ഭൂതകാലരൂപം ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ യുക്തിപൂർവമായ ചർച്ചയോ വാദമോ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ഇത് ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വാക്യപ്രവാഹം അതിനെ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐν τῇ συναγωγῇ
  choice: സിനഗോഗിൽ
  rationale: ἐν എന്ന സ്ഥലസൂചക പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം; യെഹൂദരുടെ ആരാധനാസമ്മേളനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന പരിചിതമായ പദം.
- source_word: κατὰ πᾶν σάββατον
  choice: എല്ലാ ശബ്ബത്തിലും
  rationale: κατάയുടെ വിതരണാർഥവും പ്രവൃത്തിയുടെ പതിവായ ആവർത്തനവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἔπειθέν
  choice: സമ്മതിപ്പിക്കാൻ ശ്രമിക്കുകയും
  rationale: അപൂർണ്ണ ഭൂതകാലം തുടരുന്ന പ്രേരണാപ്രവർത്തനത്തെ ചിത്രീകരിക്കുന്നു; എല്ലാവരെയും യഥാർത്ഥത്തിൽ സമ്മതിപ്പിച്ചു എന്ന ഫലാർഥം അനാവശ്യമായി ഉറപ്പിക്കാതിരിക്കാൻ ‘ശ്രമിക്കുകയും’ ചേർത്തു, എന്നാൽ ഗ്രീക്ക് രൂപത്തിന് ‘സമ്മതിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്നും ഗ്രഹിക്കാം.
- source_word: τε
  choice: -ഉം / ചെയ്യുകയും
  rationale: മുൻപ്രവർത്തനത്തോട് രണ്ടാമത്തേതിനെ ബന്ധിപ്പിക്കുന്ന ലഘു സംയോജകശക്തി മലയാളത്തിലെ സമുച്ചയഘടനയിലൂടെ പ്രകടമാക്കി.
- source_word: Ἰουδαίους
  choice: യെഹൂദന്മാരെ
  rationale: ഇവിടെ യെഹൂദ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: Ἕλληνας
  choice: ഗ്രീക്കുകാരെ
  rationale: മൂലപദത്തിന്റെ പ്രത്യേക അർഥം നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്ന് പൊതുവാക്കുകയോ ‘ദൈവഭക്തരായ ഗ്രീക്കുകാർ’ എന്ന് വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: സിനഗോഗ് സന്ദർഭത്തിലെ Ἕλληνας എന്നവരുടെ തിരിച്ചറിയൽ
  choice: ഗ്രീക്കുകാർ
  alternative: വിജാതീയർ; ദൈവഭക്തരായ ഗ്രീക്കുകാർ
  rationale: വാക്യം അവരെ Ἕλληνες എന്നു മാത്രമാണ് വിളിക്കുന്നത്. അവർ സിനഗോഗുമായി ബന്ധപ്പെട്ട വിജാതീയരായിരിക്കാം, എന്നാൽ ‘ദൈവഭക്തർ’ എന്ന പ്രത്യേക വിഭാഗനിർണയം വാക്യത്തിൽ പ്രകടമല്ല.
- issue: ἔπειθέν വിജയഫലമോ തുടരുന്ന ശ്രമമോ സൂചിപ്പിക്കുന്നുവോ
  choice: സമ്മതിപ്പിക്കാൻ ശ്രമിച്ചുകൊണ്ടിരുന്നു എന്ന ആശയം
  alternative: സമ്മതിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലം തുടരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; വിജയകരമായ ഫലം നിർബന്ധമായി പ്രസ്താവിക്കാതെ പ്രവർത്തനലക്ഷ്യം പ്രകടമാക്കുന്നു. എങ്കിലും ‘ശ്രമിച്ചു’ എന്ന ഘടകം ക്രിയയിൽ പരസ്യമായി ഇല്ലാത്തതിനാൽ പാദക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആവർത്തിച്ച പ്രവർത്തനം ‘എല്ലാ ശബ്ബത്തിലും’ എന്നും ‘ചെയ്തിരുന്നു’ എന്നും പ്രകടമാക്കി. ‘സിനഗോഗ്’ എന്ന ചരിത്രപരമായ പദം നിലനിർത്തി; മൂലത്തിലെ അർഥസന്ദിഗ്ധതകൾ പാദക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
