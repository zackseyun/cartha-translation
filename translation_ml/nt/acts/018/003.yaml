translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ ‘അവൻ’ ആരെന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം ഉണ്ടാക്കാമെന്നതിനാൽ മുൻസന്ദർഭത്തിലെ കർത്താവായ പൗലോസിന്റെ പേര് വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
