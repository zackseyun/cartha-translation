    rationale: τῇ τέχνῃ means “by trade/craft.” In modern Malayalam, «അവർ തൊഴിൽയായി കൂടാരനിർമാതാക്കളായിരുന്നു» expresses this more idiomatically than «തൊഴിൽകൊണ്ട് അവർ കൂടാരനിർമാതാക്കളായിരുന്നു».
