  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: ml
  text: 'രാത്രിയിൽ ഒരു ദർശനത്തിലൂടെ[a] കർത്താവ് പൗലോസിനോട് പറഞ്ഞു: “ഭയപ്പെടേണ്ട; സംസാരിച്ചുകൊണ്ടിരിക്കുക, മൗനം പാലിക്കരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു ദർശനത്തിൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഒരു ദർശനത്തിലൂടെ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ വെളിപ്പെടുത്തൽസന്ദർഭത്തിൽ ഈ പദം ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. എങ്കിലും മൂലപാഠത്തിലുള്ള സ്ഥാനപ്പേര് വികസിപ്പിക്കാതെ ‘കർത്താവ്’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἐν νυκτὶ
  choice: രാത്രിയിൽ
  rationale: കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δι’ ὁράματος
  choice: ഒരു ദർശനത്തിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മാധ്യമമോ മാർഗമോ സൂചിപ്പിക്കുന്നു; ‘ദർശനത്തിലൂടെ’ എന്നത് ആ ഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Μὴ φοβοῦ
  choice: ഭയപ്പെടേണ്ട
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞയുടെ നിരോധനഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀλλὰ λάλει
  choice: സംസാരിച്ചുകൊണ്ടിരിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയിലെ തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവം ‘സംസാരിച്ചുകൊണ്ടിരിക്കുക’ വ്യക്തമായി പകർത്തുന്നു.
- source_word: καὶ μὴ σιωπήσῃς
  choice: മൗനം പാലിക്കരുത്
  rationale: നിരോധനത്തിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുകയും മുൻപത്തെ തുടർന്നു സംസാരിക്കാനുള്ള ആജ്ഞയോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: വക്താവിനെ ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവായ യേശു’
  rationale: ഗ്രീക്ക് പാഠം ὁ κύριος എന്നാണ് പറയുന്നത്. സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാമെങ്കിലും, പാഠത്തിൽ ഇല്ലാത്ത വ്യക്തീകരണം ചേർക്കാതെ സ്ഥാനപ്പേരും അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മാന്യമായ മലയാളം. മൂലത്തിലെ മാധ്യമസൂചനയും ആജ്ഞകളുടെ ക്രിയാഭാവവ്യത്യാസവും കഴിയുന്നത്ര സ്വാഭാവികമായി സംരക്ഷിച്ചു.
