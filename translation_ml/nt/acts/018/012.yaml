source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: ml
  text: എന്നാൽ ഗല്ലിയോൻ അഖായയുടെ പ്രോകോൺസൽ ആയിരുന്നപ്പോൾ, യഹൂദന്മാർ[a] ഒറ്റക്കെട്ടായി പൗലോസിനെതിരെ എഴുന്നേറ്റ് അവനെ ന്യായപീഠത്തിന്റെ മുമ്പിൽ[b] കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘യഹൂദന്മാർ.’ ഇവിടെ പൗലോസിനെതിരെ പ്രവർത്തിച്ച പ്രാദേശിക യഹൂദസംഘത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്; എല്ലാ യഹൂദരെയും പൊതുവായി ഉദ്ദേശിക്കുന്നില്ല.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘ന്യായാസനത്തിന്റെ മുമ്പിൽ.’ ഗ്രീക്ക് പദം ഔദ്യോഗികമായ ന്യായവിധിപീഠത്തെയോ കോടതിയിലെ ന്യായാധികാരിയുടെ ഇരിപ്പിടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: പുതിയ സാഹചര്യത്തിലേക്കുള്ള ആഖ്യാനപരമായ മാറ്റവും തുടർന്നുള്ള എതിർപ്പുമായുള്ള നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു.
- source_word: Γαλλίωνος
  choice: ഗല്ലിയോ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണം.
- source_word: ἀνθυπάτου ὄντος
  choice: പ്രോകോൺസൽ ആയിരുന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന കാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ἀνθύπατος എന്ന പ്രത്യേക റോമൻ പദവി പൊതുവായ ‘ഭരണാധികാരി’ എന്നു മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: Ἀχαΐας
  choice: അഖായയുടെ
  rationale: റോമൻ പ്രവിശ്യയുടെ പേരായ Ἀχαΐα മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
- source_word: κατεπέστησαν
  choice: എതിരെ എഴുന്നേറ്റ്
  rationale: പൗലോസിനെതിരായ ശത്രുതാപരമായ കൂട്ടനടപടി വ്യക്തമാക്കുന്നു; മൂലപാഠം നിർബന്ധിക്കാത്ത ശാരീരിക ആക്രമണത്തിന്റെ അർഥം ചേർക്കുന്നില്ല.
- source_word: ὁμοθυμαδὸν
  choice: ഒറ്റക്കെട്ടായി
  rationale: ഒരുമിച്ചും ഏകമനസ്സോടെയും നടത്തിയ സംഘടിത നടപടിയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള വർഗനാമം നിലനിർത്തുന്നു; ‘നേതാക്കൾ’ എന്ന് മൂലപാഠത്തിൽ ഇല്ലാത്ത പരിമിതി ചേർക്കുന്നില്ല.
- source_word: τῷ Παύλῳ
  choice: പൗലോസിനെതിരെ
  rationale: κατεπέστησαν എന്ന ക്രിയയോടൊപ്പമുള്ള ദത്തിവ് ഇവിടെ ശത്രുതാപരമായ നടപടിയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἤγαγον αὐτὸν
  choice: അവനെ ... കൊണ്ടുവന്നു
  rationale: നിയമപരമായ സാഹചര്യത്തിൽ ἄγω എന്നതിന്റെ നിഷ്പക്ഷമായ അർഥം നൽകുന്നു; ‘വലിച്ചിഴച്ചു’ എന്ന അതിശക്തമായ ഭാവം ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τὸ βῆμα
  choice: ന്യായപീഠത്തിന്റെ മുമ്പിൽ
  rationale: ഔദ്യോഗിക ന്യായവിധിസ്ഥലത്തേക്കോ അവിടെയുള്ള ന്യായാധികാരിയുടെ ഇരിപ്പിടത്തിലേക്കോ കൊണ്ടുവന്നതാണെന്ന നിയമപരമായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സംഘർഷവിവരണത്തിൽ οἱ Ἰουδαῖοι എന്നതിന്റെ അർഥപരിധി
  choice: യഹൂദന്മാർ
  alternative: യഹൂദനേതാക്കൾ; യെഹൂദ്യർ
  rationale: മൂലപാഠം പൊതുവായി ‘യഹൂദന്മാർ’ എന്നാണ് പറയുന്നത്; ‘നേതാക്കൾ’ എന്ന പരിമിതി അതിൽ ഇല്ല. എന്നാൽ ഈ സന്ദർഭത്തിലെ പ്രാദേശിക സംഘത്തെ എല്ലാ കാലത്തെയും എല്ലാ യഹൂദരിലേക്കും പൊതുവാക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. റോമൻ ഭരണപദവിയുടെ ചരിത്രപരമായ കൃത്യതയ്ക്കായി ‘പ്രോകോൺസൽ’ നിലനിർത്തി. ഇംഗ്ലീഷ് മാതൃകയിൽ [a] അഖായയ്ക്ക് ശേഷം നൽകിയിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് οἱ Ἰουδαῖοι എന്നതിനെക്കുറിച്ചായതിനാൽ, മലയാളത്തിൽ പ്രസക്തമായ ‘യഹൂദന്മാർ’ എന്നതിനു പിന്നാലെ marker സ്ഥാപിച്ചു.
