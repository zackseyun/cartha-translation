source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: ml
  text: അപ്പോൾ എല്ലാവരും സിനഗോഗിന്റെ നേതാവായ സൊസ്തനേസിനെ[a] പിടികൂടി ന്യായാസനത്തിനു മുന്നിൽവെച്ച് അടിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ ഗല്ലിയോ ഇതൊന്നും കാര്യമാക്കിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘എല്ലാവരും’ എന്നതിനുപകരം ‘എല്ലാ ഗ്രീക്കുകാരും’ എന്നു കാണുന്നു. ലഭ്യമായ ഏറ്റവും പുരാതന പാഠം ഹ്രസ്വമാണ്; ആ കൂട്ടം ആരായിരുന്നുവെന്ന് അത് വ്യക്തമാക്കുന്നില്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: പിടികൂടി
  rationale: ശത്രുതാപരമായി ഒരാളെ പിടിച്ചെടുക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: ഗ്രീക്കിലെ സമഗ്രത സൂചിപ്പിക്കുന്ന അർഥം നിലനിർത്തുകയും കൂട്ടം ആരാണെന്ന് വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀρχισυνάγωγον
  choice: സിനഗോഗിന്റെ നേതാവ്
  rationale: സിനഗോഗിലെ മുഖ്യ ചുമതലക്കാരനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി മനസ്സിലാകുന്ന വിധം സൂചിപ്പിക്കുന്നു.
- source_word: ἔτυπτον
  choice: അടിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപർഫെക്റ്റ് ക്രിയയുടെ തുടരുന്ന അഥവാ ആവർത്തിതമായ പ്രവൃത്തിഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: ന്യായാസനത്തിന്റെ മുമ്പിൽവെച്ച്
  rationale: βῆμα എന്ന ഔദ്യോഗിക ന്യായവിധിവേദിയുടെ നിയമപരമായ പശ്ചാത്തലം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: ഇതൊന്നും കാര്യമാക്കിയില്ല
  rationale: ഒന്നും ഗല്ലിയോയുടെ പരിഗണനാവിഷയമായില്ല എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: δέ
  choice: അപ്പോൾ
  rationale: ഇവിടെ കഥയുടെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: καί
  choice: എന്നാൽ
  rationale: കൂട്ടത്തിന്റെ അക്രമവും ഗല്ലിയോയുടെ അനാസ്ഥയും തമ്മിലുള്ള സന്ദർഭോചിതമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πάντες (‘എല്ലാവരും’) ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനവാക്യത്തിൽ ‘അവരെല്ലാവരും’ എന്നു നൽകി കൂട്ടത്തിന്റെ തിരിച്ചറിയൽ വ്യക്തമാക്കാതെ വിട്ടു.
  alternative: എല്ലാ ഗ്രീക്കുകാരും; എല്ലാ യെഹൂദന്മാരും
  rationale: SBLGNT പാഠത്തിൽ വ്യക്തമായ നാമവിഷയം ഇല്ല. കൂട്ടത്തെ ഗ്രീക്കുകാരോ യെഹൂദന്മാരോ ആയി നിർണയിക്കുന്നത് മൂലപാഠത്തിലെ അവ്യക്തതയെ അനാവശ്യമായി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സിനഗോഗ്’ ചരിത്രപരമായ സ്ഥാപനനാമമായി നിലനിർത്തി; ‘ന്യായാസനം’ നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിലെ വിഷയാവ്യക്തത സംരക്ഷിച്ചിട്ടുണ്ട്.
