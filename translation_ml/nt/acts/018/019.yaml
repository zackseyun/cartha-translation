translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘അവൻതന്നെ’ എന്ന രൂപം മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു. ‘സംവദിച്ചു’ എന്നത് സംഭാഷണാത്മകമായ അർഥം സംരക്ഷിക്കുകയും അനാവശ്യമായി സംഘർഷഭാവം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
