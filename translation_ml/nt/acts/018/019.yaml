base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: ml
  text: അവർ എഫെസൊസിൽ എത്തി[a]; അവൻ അവരെ അവിടെ വിട്ടു[b]. എന്നാൽ, അവൻ തന്നെ സിനഗോഗിൽ പ്രവേശിച്ച് യെഹൂദന്മാരുമായി യുക്തിപൂർവം സംവദിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘എഫെസൊസിൽ വന്നെത്തി.’
    reason: lexical_alternative
  - marker: b
    text: അതായത്, മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രിസ്കില്ലയെയും അക്വിലാവിനെയും അവിടെ വിട്ടു.
    reason: cross_reference
  - marker: c
    text: അല്ലെങ്കിൽ, ‘ചർച്ച നടത്തി’ അഥവാ ‘യുക്തിപൂർവം സംസാരിച്ചു.’ ഗ്രീക്ക് പദം പരസ്പരമുള്ള യുക്തിപൂർവമായ സംഭാഷണത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: δὲ … δὲ
  choice: ആദ്യത്തേത് പ്രസംഗസന്ദർഭത്തിൽ പ്രത്യേകം വിവർത്തനം ചെയ്തില്ല; രണ്ടാമത്തേത് ‘എന്നാൽ’
  rationale: ആദ്യ δέ കഥയുടെ മൃദുവായ തുടർച്ച മാത്രമായതിനാൽ മലയാളത്തിലെ വാക്യക്രമം അത് വഹിക്കുന്നു; രണ്ടാമത്തേത് മറ്റുള്ളവരെ അവിടെ വിട്ടതും അവൻതന്നെ അകത്തു കടന്നതും തമ്മിലുള്ള വ്യത്യാസം സൂചിപ്പിക്കുന്നു.
- source_word: κἀκείνους
  choice: അവരെ
  rationale: മുൻവാക്യത്തിലെ അക്വിലാവിനെയും പ്രിസ്കില്ലയെയും സൂചിപ്പിക്കുന്ന സർവനാമരൂപം നിലനിർത്തുന്നു; പേരുകൾ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: κατέλιπεν … αὐτοῦ
  choice: അവിടെ വിട്ടു
  rationale: ആളുകളെ ആ സ്ഥലത്ത് നിർത്തിപ്പോയി എന്ന ക്രിയയുടെയും സ്ഥലസൂചകമായ αὐτοῦയുടെയും അർഥം സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു.
- source_word: αὐτὸς
  choice: അവൻതന്നെ
  rationale: കൂടെ വന്നവരിൽനിന്ന് അവന്റെ പ്രവൃത്തിയെ വേർതിരിച്ചുകാട്ടുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰσελθὼν
  choice: കടന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു പശ്ചാത്തലമാകുന്ന മുൻപ്രവൃത്തിയെ മലയാളത്തിലെ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: συναγωγήν
  choice: സിനഗോഗിൽ
  rationale: ഇവിടെയുള്ള യെഹൂദ ആരാധനാ-സമൂഹസ്ഥലത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന നിലവിലെ പദം ഉപയോഗിക്കുന്നു.
- source_word: διελέξατο
  choice: സംവദിച്ചു
  rationale: വാദപ്രതിവാദമെന്ന കടുത്ത ഭാവം നിർബന്ധിക്കാതെ, യുക്തിപൂർവമായ പരസ്പരസംഭാഷണം എന്ന ഗ്രീക്ക് ക്രിയയുടെ ആശയം നൽകുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദന്മാരുമായി
  rationale: സംഭാഷണത്തിലെ പങ്കാളികളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; നേതാക്കൾ മാത്രമാണെന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
