translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്ക് ക്രിയയുടെ ശക്തി ‘ഓടിച്ചുകളഞ്ഞു’ എന്നതിലൂടെ സൂക്ഷിക്കുകയും βῆμα എന്ന ന്യായിക പദത്തിന്റെ സ്ഥലപരമായ അർഥം പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും വ്യക്തമാക്കുകയും ചെയ്തു.
