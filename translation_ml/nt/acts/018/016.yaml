  edition: SBLGNT
  text: καὶ ἀπήλασεν αὐτοὺς ἀπὸ τοῦ βήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/016.yaml
  text: And he drove them away from the judgment seat[a].
translation:
  language: ml
  text: അപ്പോൾ അവൻ അവരെ ന്യായാസനത്തിന്റെ സമീപത്തുനിന്ന് ഓടിച്ചുകളഞ്ഞു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായവിധിപീഠം’ അല്ലെങ്കിൽ ‘കോടതിവേദി’; ഗ്രീക്കിലെ βῆμα ഔദ്യോഗിക ന്യായാധിപാസനത്തെയോ കോടതി വേദിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: അവൻ
  rationale: മുൻവാക്യത്തിലെ കർത്താവായ ഗല്ലിയോയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; καί എന്ന ലളിതമായ ആഖ്യാനബന്ധകം ഇവിടെ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ വാക്യബന്ധത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἀπήλασεν
  choice: ഓടിച്ചുകളഞ്ഞു
  rationale: അധികാരപൂർവവും ശക്തവുമായ അകറ്റലിനെ സൂചിപ്പിക്കുന്ന ἀπελαύνω എന്ന ക്രിയയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘പിരിച്ചുവിട്ടു’ എന്നതിനെക്കാൾ ശക്തമാണ്.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിക്കപ്പെട്ട കുറ്റാരോപകരെ അധികമായി വ്യക്തമാക്കാതെ ഗ്രീക്ക് സർവനാമത്തെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: ἀπὸ τοῦ βήματος
  choice: ന്യായാസനത്തിന്റെ അടുത്തുനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന അകറ്റലും βῆμα സൂചിപ്പിക്കുന്ന ഔദ്യോഗിക ന്യായവിധിസ്ഥലവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; ആളുകളെ ഇരിപ്പിടത്തിന്മേൽനിന്നല്ല, അതിന്റെ സന്നിധിയിൽനിന്നോ കോടതി പ്രദേശത്തുനിന്നോ നീക്കിയെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: βήματος
  choice: ന്യായാസനം
  rationale: ഈ ന്യായിക സന്ദർഭത്തിൽ ഭരണാധികാരിയുടെ ഔദ്യോഗിക വിധിപീഠത്തെയോ കോടതി വേദിയെയോ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ മലയാളപദമാണ്.
