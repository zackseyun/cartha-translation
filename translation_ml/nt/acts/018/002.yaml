  source_fidelity: 'മൂലഗ്രീക്കിലെ പ്രധാന ബന്ധങ്ങൾ ശരിയായി പ്രതിഫലിക്കുന്നു: അക്വിലാ പൊന്തൊസുകാരനാണ്; അവനും ഭാര്യ പ്രിസ്കില്ലയും ഇറ്റലിയിൽനിന്ന് അടുത്തിടെ വന്നവരാണ്; ക്ലൗദ്യോസിന്റെ ഉത്തരവാണ് അതിന്റെ കാരണം; തുടർന്ന് പൗലോസ് അവരുടെ അടുക്കൽ പോകുന്നു. എന്നാൽ ‘വന്നതായിരുന്നു’ എന്ന രൂപം ഇവിടെ അനാവശ്യമായി ദൂരഭൂതകാലത്തിന്റെ ഭാവം നൽകുന്നു. πρόσφατως ἐληλυθότα എന്ന പൂർണകൃദന്തത്തിന്റെ സമീപകാല-മുൻകാല അർഥത്തിന് ‘അടുത്തിടെ ... വന്നിരുന്നു’ കൂടുതൽ യോജിക്കുന്നു.'
  naturalness: നിലവിലെ വാചകം മനസ്സിലാക്കാവുന്നതാണ്. എന്നിരുന്നാലും ‘അടുത്തകാലത്ത് ... വന്നതായിരുന്നു’ എന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ കുറച്ച് കൃത്രിമമാണ്. ‘അടുത്തിടെ ... വന്നിരുന്നു’ സ്വാഭാവികവും ആഖ്യാനശൈലിക്ക് യോജിച്ചതുമാണ്. ‘അവരുടെ അടുക്കലേക്കു’ എന്നത് ദിശാസൂചന കൂടുതൽ വ്യക്തമാക്കുന്നു.
  terminology: ‘യെഹൂദൻ/യെഹൂദർ,’ ‘പൊന്തൊസ്,’ ‘ഇറ്റലി,’ ‘റോം,’ ‘ക്ലൗദ്യോസ്,’ ‘പ്രിസ്കില്ല’ എന്നിവ യോജിച്ചിരിക്കുന്നു. ‘വിട്ടുപോകണം’ χωρίζεσθαι ... ἀπὸ τῆς Ῥώμης എന്നതിന്റെ സ്വാഭാവികവും അമിതവ്യാഖ്യാനമില്ലാത്തതുമായ വിവർത്തനമാണ്. പാദക്കുറിപ്പിലെ ‘പുറത്താക്കപ്പെടണം’ സാധുവായ വ്യാഖ്യാനപരമായ ബദലായി നിലനിൽക്കുന്നു.
