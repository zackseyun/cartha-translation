source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: ml
  text: പൊന്തൊസ് സ്വദേശിയായ അക്വിലാസ് എന്നു പേരുള്ള ഒരു യെഹൂദനെ അവൻ കണ്ടെത്തി. ക്ലൗദ്യോസ് എല്ലാ യെഹൂദരും റോമിൽനിന്ന് വിട്ടുപോകണമെന്ന്[a] കല്പിച്ചതിനാൽ, അക്വിലാസ് തന്റെ ഭാര്യ പ്രിസ്കില്ലയോടൊപ്പം അടുത്തിടെ ഇറ്റലിയിൽനിന്ന് വന്നിരുന്നു. അവൻ അവരുടെ അടുക്കലേക്കു ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ യെഹൂദരും റോമിൽനിന്ന് പുറത്താക്കപ്പെടണമെന്ന്.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി റോമിൽനിന്ന് വേർപെടുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്; മുഖ്യപാഠം അത് സ്വാഭാവിക മലയാളത്തിൽ “വിട്ടുപോകുക” എന്നു നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: കണ്ടെത്തി
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃ.dantaരൂപം. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനക്രമത്തിൽ സ്വതന്ത്ര ക്രിയയായി അവതരിപ്പിച്ചു.
- source_word: τινα Ἰουδαῖον
  choice: ഒരു യെഹൂദനെ
  rationale: τις നൽകുന്ന അനിശ്ചിതത്വവും Ἰουδαῖος നൽകുന്ന ജന-മതപരമായ തിരിച്ചറിയലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὀνόματι Ἀκύλαν
  choice: അക്വിലാസ് എന്നു പേരുള്ള
  rationale: പേര് പരിചയപ്പെടുത്തുന്നതിനുള്ള സ്വാഭാവിക ആധുനിക മലയാള പ്രയോഗം.
- source_word: Ποντικὸν τῷ γένει
  choice: പൊന്തൊസ് സ്വദേശിയായ
  rationale: ജന്മസ്ഥലമോ വംശപരമായ ഭൂമിശാസ്ത്ര ഉത്ഭവമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: അടുത്തകാലത്ത് ഇറ്റലിയിൽനിന്ന് വന്നതായിരുന്നു
  rationale: പ്രധാന ആഖ്യാനസംഭവത്തിനു മുമ്പ് നടന്നതും അന്നത്തെ സാഹചര്യവുമായി പ്രസക്തിയുള്ളതുമായ സമീപകാല വരവ് പൂർണകാല ഭാവത്തോടെ സൂചിപ്പിക്കുന്നു.
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: തന്റെ ഭാര്യ പ്രിസ്കില്ലയോടൊപ്പം
  rationale: പ്രിസ്കില്ല അക്വിലാസിനൊപ്പം ഇറ്റലിയിൽനിന്ന് വന്നുവെന്ന വാക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: ക്ലൗദ്യോസ് ... കല്പിച്ചതിനാൽ
  rationale: διά സഹിതമുള്ള articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; διατάσσω എന്നത് ഇവിടെ ഔദ്യോഗിക കല്പനയാണ്.
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: എല്ലാ യെഹൂദരും റോമിൽനിന്ന് വിട്ടുപോകണമെന്ന്
  rationale: χωρίζεσθαι എന്നതിലെ ‘വേർപെടുക/അകന്നുപോകുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; ബലമായി പുറത്താക്കൽ എന്ന് മുഖ്യപാഠത്തിൽ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: προσῆλθεν αὐτοῖς
  choice: അവൻ അവരുടെ അടുക്കൽ ചെന്നു
  rationale: അവരുടെ അടുത്തേക്കുള്ള ആഖ്യാനചലനം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: Ἰουδαῖον / Ἰουδαίους എന്നതിന്റെ പരിഭാഷ
  choice: യെഹൂദൻ / യെഹൂദർ
  alternative: യെഹൂദ്യൻ / യെഹൂദ്യർ
  rationale: ഇവിടെ ക്ലൗദ്യോസിന്റെ കല്പനയ്ക്ക് വിധേയരായ റോമിലെ യെഹൂദജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; യെഹൂദ്യദേശവാസികളെ മാത്രം അല്ല. അതിനാൽ ജന-മതപരമായ അർഥമുള്ള ‘യെഹൂദർ’ യോജിക്കുന്നു.
- issue: χωρίζεσθαι എന്നതിലെ നിർബന്ധത്തിന്റെ ശക്തി
  choice: വിട്ടുപോകണമെന്ന്
  alternative: പുറത്താക്കപ്പെടണമെന്ന്
  rationale: ഗ്രീക്ക് പദം നേരിട്ട് ‘പുറത്താക്കുക’ എന്നു പറയാതെ റോമിൽനിന്നുള്ള വേർപാടിനെയാണ് സൂചിപ്പിക്കുന്നത്. ഔദ്യോഗിക കല്പന നിർബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും, അതിന്റെ നടപ്പാക്കൽരീതിയെ മുഖ്യപാഠം അധികമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ഗ്രീക്ക് participial ഘടന മലയാളത്തിൽ വ്യക്തമായ വാക്യങ്ങളാക്കി; സർവനാമമായ ‘അവൻ’ മൂലപാഠത്തിന് അനുസൃതമായി നിലനിർത്തി, സന്ദർഭത്തിൽ അത് പൗലോസിനെ സൂചിപ്പിക്കുന്നു.
