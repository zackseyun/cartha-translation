id: ACT.18.21
reference: Acts 18:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: ml
  text: 'എന്നാൽ അവരോടു യാത്രപറഞ്ഞ് പറഞ്ഞു[a]: “ദൈവം ഇച്ഛിച്ചാൽ[b] ഞാൻ വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരും.” പിന്നെ അദ്ദേഹം എഫെസൊസിൽനിന്ന് കപ്പൽ കയറി പുറപ്പെട്ടു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“പറഞ്ഞു: ‘ദൈവം ഇച്ഛിച്ചാൽ ഞാൻ വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരും’” എന്ന ഭാഗം ചില കൈയെഴുത്തുപ്രതികളിൽ ഇല്ല.'
    reason: textual_variant
  - marker: b
    text: അഥവാ, “ദൈവഹിതമെങ്കിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: കൂടുതൽ കാലം താമസിക്കണമെന്ന മുൻ അഭ്യർഥനയോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποταξάμενος
  choice: യാത്രപറഞ്ഞിട്ട്
  rationale: വിടവാങ്ങൽ സൂചിപ്പിക്കുന്ന മധ്യപ്രയോഗത്തെ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καὶ εἰπών
  choice: ഇങ്ങനെ പറഞ്ഞു
  rationale: രണ്ടാമത്തെ കൃദന്തരൂപത്തിന്റെ തുടർച്ച വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: Πάλιν ἀνακάμψω πρὸς ὑμᾶς
  choice: ഞാൻ വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരും
  rationale: വീണ്ടും മടങ്ങിവരുന്നതും ശ്രോതാക്കളിലേക്കുള്ള ദിശയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: τοῦ θεοῦ θέλοντος
  choice: ദൈവം ഇച്ഛിച്ചാൽ
  rationale: ദൈവഹിതത്തിനധീനമായ വ്യവസ്ഥയെ വ്യക്തമായ ഉപാധിവാക്യമായി നിലനിർത്തുന്നു.
- source_word: ἀνήχθη
  choice: കപ്പൽ കയറി യാത്രയായി
  rationale: യാത്രാവിവരണത്തിലെ നാവികാർഥമായ ‘കടലിലേക്ക് പുറപ്പെടുക’ എന്നത് സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: എഫെസൊസിൽനിന്ന്
  rationale: പുറപ്പെടുന്ന സ്ഥലത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിലെ പരിചിതരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ യാത്രാപദ്ധതിയും ദൈവഹിതവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവം ഇച്ഛിച്ചാൽ
  alternative: ദൈവഹിതമെങ്കിൽ
  rationale: τοῦ θεοῦ θέλοντος എന്ന മൂലപാഠത്തിലെ ‘ദൈവം’ എന്ന വ്യക്തമായ പരാമർശവും വ്യവസ്ഥാസ്വഭാവവും സംരക്ഷിക്കുന്നു; ‘കർത്താവ്’ എന്ന പാഠഭേദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യാത്രപറഞ്ഞിട്ട്’ വിടവാങ്ങലിനെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ‘കപ്പൽ കയറി യാത്രയായി’ നാവികസന്ദർഭം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
