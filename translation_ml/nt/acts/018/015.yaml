source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: ml
  text: എന്നാൽ ഒരു വാക്ക്[a], പേരുകൾ, നിങ്ങളുടേതായ നിയമം എന്നിവയെക്കുറിച്ചുള്ള തർക്കവിഷയങ്ങളാണെങ്കിൽ, നിങ്ങൾതന്നെ അവ കൈകാര്യം ചെയ്യുക; ഈ കാര്യങ്ങളുടെ ന്യായാധിപനാകാൻ എനിക്കു മനസ്സില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒരു സന്ദേശം,” “ഉപദേശം,” അല്ലെങ്കിൽ “സിദ്ധാന്തം” എന്നും പരിഭാഷപ്പെടുത്താം. λόγος എന്ന ഗ്രീക്കുപദത്തിന് വിശാലമായ അർഥവ്യാപ്തിയുണ്ട്; ഇവിടെ തർക്കവിധേയമായ പഠിപ്പിക്കലിനെയോ പദപ്രയോഗത്തെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: തർക്കവിഷയങ്ങൾ
  rationale: അന്വേഷണത്തിനോ തർക്കത്തിനോ വിധേയമായ വിഷയങ്ങളെ സൂചിപ്പിക്കുന്ന പദമാണിത്. സന്ദർഭത്തിലെ ന്യായവ്യവഹാരഭാവം നിലനിർത്തിക്കൊണ്ട് വെറും ചോദ്യങ്ങൾ എന്നതിലധികം സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: περὶ λόγου
  choice: ഒരു വാക്കിനെക്കുറിച്ചുള്ള
  rationale: λόγος എന്ന പദത്തിന്റെ വിശാലതയും അവ്യക്തതയും സംരക്ഷിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷയാണിത്; സന്ദേശം, ഉപദേശം, സിദ്ധാന്തം എന്നിവയിൽ ഒന്നായി മാത്രം അതിനെ ചുരുക്കുന്നില്ല.
- source_word: ὀνομάτων
  choice: പേരുകളെക്കുറിച്ചുള്ള
  rationale: മൂലത്തിലെ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; പേരുകളോ സ്ഥാനനാമങ്ങളോ എന്ന നിർദിഷ്ട വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: നിങ്ങളുടെ സ്വന്തം നിയമത്തെക്കുറിച്ചുള്ള
  rationale: റോമൻ നിയമപരിധിയിൽനിന്ന് ഗല്ലിയോ ഈ നിയമത്തെ അകറ്റിനിർത്തുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὄψεσθε αὐτοί
  choice: നിങ്ങൾതന്നെ അവ കൈകാര്യം ചെയ്യുക
  rationale: ഭാവികാലരൂപം ഇവിടെ 'സ്വയം നോക്കിക്കൊള്ളുക/കൈകാര്യം ചെയ്യുക' എന്ന നിർദേശാത്മക പ്രയോഗമാണ്. αὐτοί എന്ന ഊന്നൽ 'നിങ്ങൾതന്നെ' എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: κριτής
  choice: ന്യായാധിപൻ
  rationale: നിയമപരവും ന്യായവ്യവഹാരപരവുമായ സന്ദർഭത്തിന് യോജിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: τούτων
  choice: ഇത്തരം കാര്യങ്ങൾക്ക്
  rationale: മുമ്പ് പറഞ്ഞ തർക്കവിഷയങ്ങളിലേക്കു പൊതുവായി തിരിച്ചുചൂണ്ടുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം നൽകുന്നു.
- source_word: οὐ βούλομαι εἶναι
  choice: ആകാൻ എനിക്കു മനസ്സില്ല
  rationale: വ്യക്തിപരമായ ഇച്ഛയില്ലായ്മയെയോ സന്നദ്ധതയില്ലായ്മയെയോ പ്രകടിപ്പിക്കുന്നു; ഔപചാരികമായ നിയമനിഷേധം എന്ന് അതിശയിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ഗല്ലിയോയുടെ നിരാകരണത്തിൽ λόγος എന്നതിന്റെ വ്യാപ്തി
  choice: ഒരു വാക്ക്
  alternative: ഒരു സന്ദേശം; ഉപദേശം; സിദ്ധാന്തം
  rationale: വാക്യം λόγος എന്തിനെ സൂചിപ്പിക്കുന്നു എന്ന് കൃത്യമായി നിർവചിക്കുന്നില്ല. അതിനാൽ അന്തർയഹൂദ തർക്കത്തിന്റെ ഉള്ളടക്കം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവിഷയമായി നിശ്ചയിക്കാതെ മൂലത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ന്യായവ്യവഹാരശൈലി. ഗല്ലിയോയുടെ അകലംപാലിക്കുന്ന ഭാവവും emphatic ആയ 'നിങ്ങൾതന്നെ' എന്ന പ്രയോഗവും നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചകം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
