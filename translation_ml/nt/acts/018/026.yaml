id: ACT.18.26
reference: Acts 18:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: ml
  text: അവൻ സിനഗോഗിൽ ധൈര്യത്തോടെ സംസാരിക്കാൻ തുടങ്ങി. എന്നാൽ പ്രിസ്കില്ലയും അക്വിലാസും അവന്റെ വാക്കുകൾ കേട്ടപ്പോൾ, അവനെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോയി[a] ദൈവത്തിന്റെ വഴി അവന് കൂടുതൽ കൃത്യമായി വിശദീകരിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ മാറ്റിനിർത്തി’ എന്നും ‘അവനെ സ്വീകരിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം. ഒരാളെ തങ്ങളോടൊപ്പം ചേർക്കുക, സ്വീകരിക്കുക എന്നീ അർഥങ്ങളും ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε ἤρξατο
  choice: അവൻ ... തുടങ്ങി
  rationale: οὗτος മുൻസന്ദർഭത്തിലെ അപ്പൊല്ലോസിനെ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ സർവനാമം യോജിക്കുന്നു. τέയുടെ മൃദുവായ ബന്ധകശക്തി വാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: παρρησιάζεσθαι
  choice: ധൈര്യത്തോടെ സംസാരിക്കാൻ
  rationale: തുറന്നും ആത്മവിശ്വാസത്തോടെയും ധീരമായും സംസാരിക്കുന്നതെന്ന ഗ്രീക്ക് അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν τῇ συναγωγῇ
  choice: സിനഗോഗിൽ
  rationale: യഹൂദരുടെ ആരാധനാസമ്മേളനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും കൃത്യവുമായ പദം.
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: എന്നാൽ ... അവന്റെ വാക്കുകൾ കേട്ടപ്പോൾ
  rationale: കേൾവിയുടെ കാലസംബന്ധം ‘കേട്ടപ്പോൾ’ നൽകുന്നു; δέയുടെ മൃദുവായ വഴിത്തിരിവ് ‘എന്നാൽ’ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അവനെ കേട്ടപ്പോൾ’ എന്നതിനെക്കാൾ ‘അവന്റെ വാക്കുകൾ കേട്ടപ്പോൾ’ സ്വാഭാവികമാണ്.
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: പ്രിസ്കില്ലയും അക്വിലാസും
  rationale: ഗ്രീക്ക് നാമരൂപങ്ങളുടെ മലയാള ലിപ്യന്തരണം; മൂലത്തിലെ ക്രമവും നിലനിർത്തുന്നു.
- source_word: προσελάβοντο αὐτὸν
  choice: അവനെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോയി
  rationale: προσλαμβάνομαι എന്ന പദത്തിന് ഒരാളെ തങ്ങളോടൊപ്പം സ്വീകരിക്കുക, കൂട്ടിക്കൊണ്ടുപോകുക, ചേർത്തുകൊള്ളുക എന്നീ അർഥസാധ്യതകളുണ്ട്. തുടർന്നുള്ള വിശദീകരണത്തിന് അനുയോജ്യമായി ഈ രൂപം തെരഞ്ഞെടുത്തു; സ്വകാര്യമായി മാറ്റിനിർത്തി എന്ന ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἀκριβέστερον
  choice: കൂടുതൽ കൃത്യമായി
  rationale: താരതമ്യരൂപത്തിന്റെ ‘മുമ്പിലേതിനെക്കാൾ കൂടുതൽ കൃത്യതയോടെ’ എന്ന ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐξέθεντο
  choice: വിശദീകരിച്ചുകൊടുത്തു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ἐκτίθημι ഇവിടെ ഒരു കാര്യം തുറന്നുവിവരിക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ദത്തിവ് ബന്ധത്തോടൊപ്പം ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വഴി
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ഘടനയും ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു; അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ നിർവചനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: αὐτῷ
  choice: അവന്
  rationale: ἐξέθεντο എന്ന ക്രിയയുടെ പരോക്ഷ കർമത്തെ സ്വാഭാവിക മലയാള ദത്തിവ് രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പ്രിസ്കില്ലയും അക്വിലാസും അപ്പൊല്ലോസിനോടു ചെയ്ത പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: അവനെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോയി
  alternative: അവനെ മാറ്റിനിർത്തി; അവനെ സ്വീകരിച്ചു; അവനെ തങ്ങളോടു ചേർത്തു
  rationale: പ്രസ്തുത ക്രിയയ്ക്ക് സ്വീകരിക്കൽ, കൂടെ കൂട്ടൽ, തനിക്കരികിലാക്കൽ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. തുടർന്നുള്ള കൂടുതൽ കൃത്യമായ വിശദീകരണം സ്വകാര്യ സംഭാഷണത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ക്രിയ മാത്രം ‘മാറ്റിനിർത്തി’ എന്ന് നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠവും അടിക്കുറിപ്പും ചേർന്ന് യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: ‘ദൈവത്തിന്റെ വഴി’ എന്നതിന്റെ വ്യാപ്തി
  choice: മൂലത്തിലെ വിശാലമായ പ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: ദൈവത്തിന്റെ രക്ഷാമാർഗം; സമ്പൂർണ ക്രൈസ്തവവിശ്വാസം; ദൈവത്തിന്റെ ധാർമികപാത
  rationale: സന്ദർഭത്തിൽ ഇത് ക്രൈസ്തവ സന്ദേശത്തെയോ ജീവിതപാതയെയോ സൂചിപ്പിച്ചേക്കാം; എന്നാൽ പാഠം തന്നെ അതിന്റെ ഉള്ളടക്കം ഇവിടെ വിശദമായി നിർവചിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ധൈര്യത്തോടെ’, ‘കൂടുതൽ കൃത്യമായി’ എന്നീ രൂപങ്ങൾ മൂലത്തിന്റെ ഭാവവും താരതമ്യശക്തിയും നിലനിർത്തുന്നു. പേരുകളുടെ ക്രമം മൂലപാഠപ്രകാരം സൂക്ഷിച്ചു; അനാവശ്യ സഭാപരമോ അധികാരഘടനാപരമോ ആയ സൂചനകൾ ഒഴിവാക്കി.
