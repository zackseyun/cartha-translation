  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: ml
  text: അവിടെ കുറച്ചുകാലം ചെലവഴിച്ചശേഷം അദ്ദേഹം പുറപ്പെട്ടു; ഗലാത്യദേശത്തുകൂടിയും ഫ്രുഗ്യയിലൂടെയും തുടർച്ചയായി കടന്നുപോയി, എല്ലാ ശിഷ്യന്മാരെയും ശക്തിപ്പെടുത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രമത്തിൽ” അല്ലെങ്കിൽ “ഒന്നിനുപിന്നാലെ ഒന്നായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: അവിടെ കുറച്ചുകാലം ചെലവഴിച്ചശേഷം
  rationale: ποιέω + χρόνον എന്ന പ്രയോഗം ‘കാലം ചെലവഴിക്കുക’ എന്നാണ്. മുമ്പ് പരാമർശിച്ച സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നതിനാൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘അവിടെ’ ചേർത്തു.
- source_word: ἐξῆλθεν
  choice: അദ്ദേഹം പുറപ്പെട്ടു
  rationale: യാത്രാവിവരണത്തിൽ ഈ പദം ഒരു സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലിനെ സൂചിപ്പിക്കുന്നു; ‘പുറപ്പെട്ടു’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: διερχόμενος
  choice: സഞ്ചരിച്ചുകൊണ്ട്
  rationale: പ്രദേശങ്ങളിലൂടെയുള്ള തുടർച്ചയായ യാത്രയെ വർത്തമാനകാലസഹഭാവത്തോടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: καθεξῆς
  choice: ക്രമമായി
  rationale: യാത്രയുടെ തുടർച്ചയായ, അനുക്രമമായ പുരോഗതി സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; കൃത്യമായി ഏതു ക്രമമാണെന്നു വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതിനെ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: τὴν Γαλατικὴν χώραν
  choice: ഗലാത്യപ്രദേശത്ത്
  rationale: χώρα ഒരു വിശാല പ്രദേശത്തെയോ ഭൂപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; സാങ്കേതികമായി റോമൻ പ്രവിശ്യ മാത്രമെന്ന അർഥം ചുമത്താതെ ‘ഗലാത്യപ്രദേശം’ അത് നിലനിർത്തുന്നു.
- source_word: καὶ Φρυγίαν
  choice: ഫ്രുഗ്യയിലും
  rationale: സ്ഥലനാമം മലയാളത്തിൽ ലിപ്യന്തരിച്ചു; മുൻപുള്ള പ്രദേശസൂചനയുമായി ചേർത്ത് സ്വാഭാവികമായ സമാന്തര ഘടന നൽകി.
- source_word: στηρίζων
  choice: ശക്തിപ്പെടുത്തി
  rationale: στηρίζω എന്നത് ഉറപ്പിക്കുക, ദൃഢമാക്കുക, ശക്തിപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. ശിഷ്യരെ പിന്തുണച്ച് ദൃഢരാക്കുന്നതെന്ന ആശയം ‘ശക്തിപ്പെടുത്തി’ നിഷ്പക്ഷമായി നൽകുന്നു.
- source_word: πάντας τοὺς μαθητάς
  choice: ശിഷ്യന്മാരെയെല്ലാം
  rationale: മത്തായി-പ്രവൃത്തികൾ പാരമ്പര്യത്തിലെ μαθηταί എന്ന പദത്തിന് ‘ശിഷ്യന്മാർ’ സ്ഥിരവും വ്യക്തവുമായ മലയാളരൂപമാണ്; πάντας എന്നത് ‘എല്ലാം’ കൊണ്ട് പൂർണമായി നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് പ്രധാന പ്രവർത്തനങ്ങൾ—പുറപ്പെടലും യാത്രചെയ്ത് ശിഷ്യരെ ശക്തിപ്പെടുത്തലും—വ്യക്തമാക്കാൻ വാക്യം രണ്ടായി വിഭജിച്ചു. καθεξῆς എന്ന പദത്തിന്റെ യഥാർഥ അനുക്രമഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും അതിന്റെ സാധ്യതയുള്ള വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
