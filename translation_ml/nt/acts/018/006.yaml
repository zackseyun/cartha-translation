id: ACT.18.6
reference: Acts 18:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ എതിർക്കുകയും ദൂഷണം പറയുകയും ചെയ്തപ്പോൾ, അവൻ തന്റെ വസ്ത്രങ്ങൾ കുടഞ്ഞിട്ട് അവരോടു പറഞ്ഞു: “നിങ്ങളുടെ രക്തം നിങ്ങളുടെ തലമേൽ തന്നെയിരിക്കട്ടെ.[a] ഞാൻ കുറ്റമില്ലാത്തവൻ. ഇനിമുതൽ ഞാൻ യഹൂദരല്ലാത്തവരുടെ അടുക്കലേക്കു പോകും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ രക്തം നിങ്ങളുടെ തലമേൽ തന്നെയിരിക്കട്ടെ” എന്നത്, ഉണ്ടാകുന്ന പരിണതഫലങ്ങളുടെ ഉത്തരവാദിത്വം അവർക്കുതന്നെയാണെന്നർഥമുള്ള പ്രയോഗമാണ്.
    reason: cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “ജനതകളുടെ അടുക്കലേക്ക്”; ഇവിടെ യഹൂദരല്ലാത്തവരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: എതിർക്കുകയും
  rationale: പൗലോസിന്റെ സന്ദേശത്തോടുള്ള സജീവമായ എതിർപ്പിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: βλασφημούντων
  choice: ദൂഷണം പറയുകയും
  rationale: ക്രിയയുടെ കർത്തവ്യം വ്യക്തമല്ലാത്തതിനാൽ ‘അവനെ’ എന്നു ചേർക്കാതെ, ദൈവദൂഷണത്തിന്റെയും അധിക്ഷേപത്തിന്റെയും അർത്ഥസാധ്യത നിലനിർത്തുന്നു.
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: തന്റെ വസ്ത്രങ്ങൾ കുടഞ്ഞിട്ട്
  rationale: ബന്ധവും ഉത്തരവാദിത്വവും നിരസിക്കുന്ന പ്രതീകാത്മക പ്രവൃത്തിയെ ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: നിങ്ങളുടെ രക്തം നിങ്ങളുടെ തലമേൽ തന്നെയിരിക്കട്ടെ
  rationale: പരിണതഫലങ്ങളുടെ ഉത്തരവാദിത്വം കേൾവിക്കാർക്കാണെന്ന ഗൗരവമുള്ള ശൈലി വ്യാഖ്യാനിച്ച് പരത്താതെ നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ഏകവചന ‘തല’ കൂട്ടത്തെ വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലും ഏകവചനം സ്വാഭാവികമാണ്.
- source_word: καθαρὸς ἐγώ
  choice: ഞാൻ കുറ്റമില്ലാത്തവൻ
  rationale: ‘ശുദ്ധൻ’ എന്ന അക്ഷരാർഥം ഉണ്ടാക്കാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കി, ഉത്തരവാദിത്വത്തിൽനിന്നുള്ള നിരപരാധിത്വം വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇനിമുതൽ
  rationale: നിർണായകമായ സമയമാറ്റത്തെ ചുരുക്കവും ആധുനികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἰς τὰ ἔθνη
  choice: യഹൂദരല്ലാത്തവരുടെ അടുക്കലേക്കു
  rationale: ഈ സന്ദർഭത്തിൽ ἔθνη സൂചിപ്പിക്കുന്നത് യഹൂദരല്ലാത്ത ജനങ്ങളെയാണെന്ന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘ജാതികൾ’ എന്നതിലെ ആധുനിക ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: πορεύσομαι
  choice: ഞാൻ ... പോകും
  rationale: ഭാവിയിലെ ഉദ്ദേശ്യപൂർവമായ നീക്കത്തെ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: “നിങ്ങളുടെ രക്തം നിങ്ങളുടെ തലമേൽ” എന്ന ഉത്തരവാദിത്വസൂത്രം
  choice: സന്ദേശം നിരസിക്കുന്നതിന്റെ പരിണതഫലങ്ങൾക്ക് ഉത്തരവാദിത്വം കേൾവിക്കാർക്കാണെന്നും പൗലോസിനല്ലെന്നും പ്രഖ്യാപിക്കുന്നതായി ശൈലി നിലനിർത്തി.
  alternative: ഇതിനെ കൂടുതൽ ശക്തമായ ശാപവാക്യമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം ബൈബിളിലെ കാവൽക്കാരൻ/ഉത്തരവാദിത്വ ഭാഷയെ അനുസ്മരിപ്പിക്കുന്നു; മൂലപാഠം ആവശ്യപ്പെടുന്നതിലും ശക്തമായ ശാപാർഥം ചേർക്കാതെ അതിന്റെ ഗൗരവവും സംഘർഷവും സൂക്ഷിക്കുന്നു.
- issue: βλασφημούντων എന്ന ക്രിയയുടെ ലക്ഷ്യം
  choice: ലക്ഷ്യം വ്യക്തമാക്കാതെ ‘ദൂഷണം പറയുകയും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവനെ അധിക്ഷേപിക്കുകയും’ അല്ലെങ്കിൽ ‘ദൈവദൂഷണം പറയുകയും’.
  rationale: ഗ്രീക്കിൽ പ്രത്യക്ഷ കർമം ഇല്ല; അതിനാൽ പൗലോസിനെയോ ദൈവത്തെയോ സന്ദേശത്തെയോ മാത്രം ലക്ഷ്യമായി നിശ്ചയിക്കാതെ യഥാർത്ഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾഭാഷയുടെ ഭാരം അനാവശ്യമായി കൂട്ടാതെ, ഉത്തരവാദിത്വപ്രഖ്യാപനത്തിന്റെ ഔപചാരികതയും പ്രതീകാത്മക പ്രവൃത്തിയുടെ ദൃശ്യതയും നിലനിർത്തി.
