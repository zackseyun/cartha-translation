id: ACT.18.24
reference: Acts 18:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: ml
  text: അപ്പോല്ലോസ് എന്നു പേരുള്ള ഒരു യഹൂദൻ എഫെസോസിൽ എത്തി; അദ്ദേഹം ജന്മനാ അലക്സാണ്ട്രിയക്കാരനും വാഗ്മിയും[a] തിരുവെഴുത്തുകളിൽ വളരെ പ്രാവീണ്യമുള്ളവനും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പണ്ഡിതൻ’; λόγιος എന്ന ഗ്രീക്ക് പദത്തിന് ‘വാഗ്മി’ എന്നോ ‘പണ്ഡിതൻ’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: യഹൂദൻ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യക്കാരൻ’ എന്നതിലുപരി അപ്പോല്ലോസിന്റെ ജന-മതപരമായ തിരിച്ചറിയലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് ശക്തമായ വിരോധമല്ല, പുതിയ കഥാപാത്രത്തെ പരിചയപ്പെടുത്തുന്ന ലഘുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിൽ വാക്യക്രമം തന്നെയാണ് ആ മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നത്.
- source_word: τις
  choice: ഒരു
  rationale: പുതിയ വ്യക്തിയെ അനിശ്ചിതമായി പരിചയപ്പെടുത്തുന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഒരു’ നിലനിർത്തുന്നു.
- source_word: Ἀπολλῶς ὀνόματι
  choice: അപ്പോല്ലോസ് എന്നു പേരുള്ള
  rationale: പേര് പറഞ്ഞ് ഒരാളെ പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: ജന്മനാ അലക്സാണ്ട്രിയക്കാരൻ
  rationale: വംശീയ ‘ജാതി’ എന്ന ആധുനിക തെറ്റിദ്ധാരണ ഒഴിവാക്കി ജന്മദേശമോ ഉത്ഭവമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀνὴρ λόγιος
  choice: അദ്ദേഹം വാഗ്മി
  rationale: λόγιος എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ ‘വാഗ്മി’ എന്ന അർഥം സ്വീകരിക്കുന്നു; ἀνήρ സൂചിപ്പിക്കുന്ന പുരുഷവ്യക്തിയെ ‘അദ്ദേഹം’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: എഫെസോസിൽ എത്തി
  rationale: ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുക എന്ന ക്രിയാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: തിരുവെഴുത്തുകളിൽ അതിസമർഥൻ ആയിരുന്നു
  rationale: δυνατός എന്നതിന്റെ ശക്തമായ ശേഷിഭാവവും γραφαί ഇവിടെ വിശുദ്ധ തിരുവെഴുത്തുകളെ സൂചിപ്പിക്കുന്നതും നിലനിർത്തുന്നു.
theological_decisions:
- issue: γραφαί എന്നതിന്റെ സൂചന
  choice: തിരുവെഴുത്തുകൾ
  alternative: എഴുത്തുകൾ
  rationale: യഹൂദ പശ്ചാത്തലത്തിൽ ബഹുവചനമായ γραφαί പൊതുവായ രചനകളെയല്ല, അംഗീകരിക്കപ്പെട്ട വിശുദ്ധ ഗ്രന്ഥങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിലെ അനുബന്ധ വിവരണങ്ങൾ അർധവിരാമംകൊണ്ട് വ്യക്തമായി ക്രമപ്പെടുത്തി; പദത്തിന്റെ യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
