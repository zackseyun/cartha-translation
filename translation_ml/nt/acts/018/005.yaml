id: ACT.18.5
reference: Acts 18:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: ml
  text: എന്നാൽ ശീലാസും തിമൊഥെയൊസും മക്കെദോന്യയിൽനിന്ന് ഇറങ്ങിവന്നപ്പോൾ, പൗലോസ് വചനത്തിൽ മുഴുകിയിരുന്നു[a]; യേശുവാണ് മശീഹാ[b] എന്ന് യെഹൂദരോടു ദൃഢമായി സാക്ഷ്യപ്പെടുത്തിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വചനത്താൽ നിർബന്ധിതനായി’ എന്നോ ‘സന്ദേശത്തിൽ മുഴുകി’ എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒന്നിനാൽ പിടിക്കപ്പെടുക, സമ്മർദത്തിലാകുക, അല്ലെങ്കിൽ അതിൽ പൂർണമായി വ്യാപൃതനാകുക എന്നീ അർഥഭാവങ്ങൾ നൽകാൻ കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു.’ ഇവിടെ ഈ പദം ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം നിലനിർത്താൻ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: എന്നാൽ ... വന്നപ്പോൾ
  rationale: δέയുടെ ബന്ധകസ്വഭാവവും ὡς നൽകുന്ന കാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: മക്കെദോന്യയിൽനിന്ന് ഇറങ്ങിവന്നപ്പോൾ
  rationale: κατέρχομαι എന്നതിലെ ‘ഇറങ്ങിവരുക’ എന്ന യാത്രാപ്രയോഗം പരിരക്ഷിക്കുന്നു; കേവലം ‘വന്നപ്പോൾ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: ശീലാസും തിമൊഥെയൊസും
  rationale: τε ... καί സൂചിപ്പിക്കുന്ന സംയുക്ത കർത്താവിനെ മലയാളത്തിലെ ‘-ഉം ... -ഉം’ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: συνείχετο
  choice: മുഴുകി
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ‘ഒന്നിൽ പൂർണമായി വ്യാപൃതനായിരിക്കുക/അതിൽ പിടിക്കപ്പെട്ടിരിക്കുക’ എന്ന അർഥവ്യാപ്തിയുണ്ട്. ‘മുഴുകി’ എന്നത് കാരണത്തെ അനാവശ്യമായി ആത്മീയവത്കരിക്കാതെ പ്രവർത്തനത്തിലെ തീവ്രമായ വ്യാപൃതാവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: τῷ λόγῳ
  choice: വചനത്തിൽ
  rationale: ദാതൃവിഭക്തി പൗലോസ് വ്യാപൃതനായിരുന്ന മേഖലയെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. ‘വചനം’ λόγος എന്ന പദം സുതാര്യമായി നിലനിർത്തുകയും സുവിശേഷസന്ദേശത്തെ സൂചിപ്പിക്കുന്ന ലൂക്കോസിന്റെ പ്രയോഗവുമായി യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: διαμαρτυρόμενος
  choice: ദൃഢമായി സാക്ഷ്യപ്പെടുത്തിക്കൊണ്ടിരുന്നു
  rationale: διαμαρτύρομαι എന്നതിലെ ശക്തമായ, ഗൗരവമുള്ള സാക്ഷ്യത്തിന്റെ ഭാവവും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയും ഈ പ്രയോഗം നൽകുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യെഹൂദരോട്
  rationale: സന്ദർഭത്തിൽ Ἰουδαῖοι ഒരു വംശീയ-മതസമൂഹമായ യെഹൂദരെ സൂചിപ്പിക്കുന്നു; ‘യെഹൂദ്യർ’ എന്ന ഭൂമിശാസ്ത്രപരമായ അർഥം ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: യേശുവാണ് മശീഹാ
  rationale: വാക്യഘടന യേശുവിനെ വാഗ്ദത്ത മശീഹാവായി തിരിച്ചറിയുന്നു. മലയാളത്തിലെ ഊന്നൽഘടനയായ ‘യേശുവാണ്’ ഈ തിരിച്ചറിയൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗമായോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: യെഹൂദരോടുള്ള പ്രഖ്യാപനത്തിൽ Χριστός നിർദ്ദേശകോപപദത്തോടുകൂടിയ വിധേയസ്ഥാനപ്പേരാണ്. അതിനാൽ അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം തുറന്നുകാട്ടാൻ ‘മശീഹാ’ ഉപയോഗിച്ചു; പേരുപോലെ തോന്നാവുന്ന ‘ക്രിസ്തു’ പ്രധാന പാഠത്തിൽ ഉപയോഗിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘വചനം,’ ‘സാക്ഷ്യപ്പെടുത്തുക,’ ‘മശീഹാ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമാറാക്കി. ഉറവിടത്തിലെ συνείχετο എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി പ്രധാന പാഠത്തിൽ ഒറ്റവിധമായി കടുപ്പിക്കാതെ അടിക്കുറിപ്പിൽ പരിരക്ഷിച്ചു.
