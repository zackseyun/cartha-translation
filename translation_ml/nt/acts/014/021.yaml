id: ACT.14.21
reference: Acts 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: ml
  text: അവർ ആ നഗരത്തിൽ സുവാർത്ത അറിയിക്കുകയും അനേകരെ ശിഷ്യരാക്കുകയും ചെയ്തശേഷം ലുസ്ത്രയിലേക്കും ഇക്കോന്യയിലേക്കും അന്ത്യൊക്ക്യയിലേക്കും മടങ്ങി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: സുവാർത്ത അറിയിക്കുകയും
  rationale: εὐαγγελίζω എന്ന ക്രിയയുടെ സുവാർത്ത പ്രഖ്യാപിക്കുക എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; മലയാളത്തിൽ ഭാരമുള്ള മതസാങ്കേതിക പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: τε
  choice: -ഉം
  rationale: പങ്കാളിക്രിയാഭാഗത്തെ തുടർന്നുള്ള καί ഘടനയുമായി ലഘുവായി ബന്ധിപ്പിക്കുന്ന τε-യുടെ പ്രവർത്തനം മലയാളത്തിലെ സമുച്ചയപ്രത്യയമായ -ഉം സ്വാഭാവികമായി നിർവഹിക്കുന്നു.
- source_word: τὴν πόλιν ἐκείνην
  choice: ആ നഗരത്തിൽ
  rationale: സന്ദർഭത്തിലെ ദെർബെയെ സൂചിപ്പിക്കുന്ന നിർദ്ദേശകപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; εὐαγγελίζομαι എന്ന ക്രിയയോടൊപ്പമുള്ള accusative സ്ഥലം മലയാളത്തിൽ സ്വാഭാവികമായി അധികരണരൂപത്തിൽ വരുന്നു.
- source_word: μαθητεύσαντες
  choice: ശിഷ്യരാക്കുകയും
  rationale: ആളുകളെ ശിഷ്യന്മാരാക്കുക എന്ന സകർമകവും ഫലസൂചകവുമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἱκανοὺς
  choice: അനേകരെ
  rationale: ഈ സന്ദർഭത്തിൽ ἱκανός ഗണ്യമായ ഒരു സംഖ്യയെ സൂചിപ്പിക്കുന്നു; ‘അനേകർ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑπέστρεψαν
  choice: മടങ്ങി
  rationale: യാത്രാമാർഗത്തിൽ മുമ്പ് സന്ദർശിച്ച സ്ഥലങ്ങളിലേക്കു തിരിച്ചുപോയതിനെ സൂചിപ്പിക്കുന്ന പ്രധാന ക്രിയയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: εἰς τὴν Λύστραν
  choice: ലുസ്ത്രയിലേക്ക്
  rationale: ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന εἰς മലയാളത്തിലെ -യിലേക്ക് എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: εἰς Ἰκόνιον
  choice: ഇക്കോന്യയിലേക്ക്
  rationale: ആവർത്തിച്ച εἰς-ന്റെ ലക്ഷ്യസ്ഥാനാർഥം നിലനിർത്താൻ -യിലേക്ക് ആവർത്തിക്കുന്നു.
- source_word: εἰς Ἀντιόχειαν
  choice: അന്ത്യൊക്ക്യയിലേക്ക്
  rationale: യാത്രാക്രമവും ഗ്രീക്കിലെ ആവർത്തനവും വ്യക്തമായി നിലനിർത്താൻ -യിലേക്ക് ആവർത്തിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ട് മുൻപ്രവൃത്തികളും പ്രധാന മടങ്ങിവരവ് ക്രിയയും തമ്മിലുള്ള സമയബന്ധം ‘ചെയ്തശേഷം’ എന്ന ഘടനയിൽ വ്യക്തമാക്കിയിരിക്കുന്നു. സ്ഥലനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള മലയാള ബൈബിൾരൂപങ്ങൾ ഉപയോഗിച്ചു.
