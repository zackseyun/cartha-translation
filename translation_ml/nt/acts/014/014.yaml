  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: ml
  text: എന്നാൽ അപ്പൊസ്തലന്മാരായ ബർന്നബാസും പൗലോസും കേട്ടപ്പോൾ, തങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി[a] ജനക്കൂട്ടത്തിലേക്ക് കുതിച്ചുചെന്ന്[b] ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: വസ്ത്രങ്ങൾ കീറുന്നത് ദുഃഖം, ഭീതി, അല്ലെങ്കിൽ ദൈവദൂഷണമായി കണക്കാക്കപ്പെട്ട ബഹുമതിക്കെതിരായ പ്രതിഷേധം പ്രകടിപ്പിക്കുന്ന പതിവായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ ‘ജനക്കൂട്ടത്തിലേക്ക് ചാടിച്ചെന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: അതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ കാലസൂചന നൽകുന്ന aorist participle ആണ്; മുൻവാക്യത്തിലെ യാഗാർപ്പണശ്രമത്തെ സൂചിപ്പിക്കുന്ന ‘അതു’ മലയാളത്തിൽ സ്വാഭാവികമായി ആവശ്യമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ജനക്കൂട്ടത്തിന്റെ പ്രവൃത്തിയിൽനിന്ന് അപ്പൊസ്തലന്മാരുടെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാരായ
  rationale: ബർന്നബാസിനെയും പൗലോസിനെയും ഈ സന്ദർഭത്തിൽ അപ്പൊസ്തലന്മാർ എന്നു വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് വാക്യഘടന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Βαρναβᾶς καὶ Παῦλος
  choice: ബർന്നബാസും പൗലോസും
  rationale: മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിക്കുന്നു.
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: തങ്ങളുടെ വസ്ത്രങ്ങൾ കീറി
  rationale: ദുഃഖം, ഭയം, അല്ലെങ്കിൽ ശക്തമായ പ്രതിഷേധം പ്രകടിപ്പിക്കുന്ന സാംസ്കാരിക പ്രവൃത്തി ഔപചാരികത നഷ്ടപ്പെടാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐξεπήδησαν
  choice: കുതിച്ചുചെന്ന്
  rationale: പെട്ടെന്നുള്ളതും ശക്തവുമായ ചലനം സൂചിപ്പിക്കുന്നു; ലക്ഷ്യസ്ഥാനം അടുത്ത വാക്യഘടകമായ ‘ജനക്കൂട്ടത്തിലേക്ക്’ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸν ὄχλον
  choice: ജനക്കൂട്ടത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ജനക്കൂട്ടത്തിനുള്ളിലേക്കുള്ള ദിശാഗത ചലനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κράζοντες
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: തുടർന്നുള്ള വാക്കുകൾ ഉച്ചത്തിൽ വിളിച്ചുപറയുന്ന അനുബന്ധപ്രവൃത്തി സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘അപ്പൊസ്തലന്മാർ’ എന്ന വിശേഷണം ബർന്നബാസിനും പൗലോസിനും ബാധകമാകുന്നത്
  choice: ‘അപ്പൊസ്തലന്മാരായ ബർന്നബാസും പൗലോസും’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ബർന്നബാസും പൗലോസും എന്ന അപ്പൊസ്തലന്മാർ’ എന്നോ, അപ്പൊസ്തലത്വത്തിന്റെ വ്യാപ്തി വിശദീകരിച്ചുകൊണ്ടോ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം ഈ സന്ദർഭത്തിൽ ഇരുവരെയും അപ്പൊസ്തലന്മാർ എന്നു വ്യക്തമായി തിരിച്ചറിയുന്നു; പദത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രപരമായ നിർവചനങ്ങൾ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ആ പ്രസ്താവന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പെട്ടെന്നുള്ള ചലനവും ഉച്ചത്തിലുള്ള വിളിയും നിലനിർത്തി; വാക്യം അടുത്ത വാക്യത്തിലെ നേരിട്ടുള്ള പ്രസംഗത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ ഉപയോഗിച്ചു.
