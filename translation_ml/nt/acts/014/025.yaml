translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ ‘പെർഗ’, ‘അത്താലിയ’ എന്നിങ്ങനെ ലിപ്യന്തരിച്ചു. ‘വചനം പ്രസംഗിക്കുക’ എന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തിയെങ്കിലും ഗ്രീക്കിൽ ഇല്ലാത്ത വിശദീകരണം ചേർത്തിട്ടില്ല.
