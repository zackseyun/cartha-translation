id: ACT.14.16
reference: Acts 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: ml
  text: കഴിഞ്ഞുപോയ തലമുറകളിൽ അവിടുന്ന് എല്ലാ ജനതകളെയും അവരുടെ സ്വന്തം വഴികളിൽ നടക്കാൻ അനുവദിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എല്ലാ വിജാതീയരെയും അവരുടെ വഴികളിൽ പോകാൻ അനുവദിച്ചു.”'
    reason: ἔθνη എന്നതിന് സന്ദർഭാനുസരിച്ച് ‘വിജാതീയർ’ എന്നും, πορεύεσθαι എന്നതിന് ‘പോകുക’ എന്നും പരിഭാഷ നൽകാം.
lexical_decisions:
- source_word: ὃς
  choice: അവിടുന്നാണ്
  rationale: ബന്ധസർവനാമത്തിന്റെ സൂചന മുൻവാക്യത്തിലെ ദൈവത്തെയാണ്. മലയാളത്തിൽ വാക്യം സ്വാഭാവികമായി തുടരാനും ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കാനും ‘അവിടുന്നാണ്’ ഉപയോഗിച്ചു.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: കഴിഞ്ഞുപോയ തലമുറകളിൽ
  rationale: കടന്നുപോയ മുൻതലമുറകളെന്ന കാലസൂചന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἴασεν
  choice: അനുവദിച്ചത്
  rationale: ദൈവം ആ വഴികളെ അംഗീകരിച്ചുവെന്നോ നിർണയിച്ചുവെന്നോ പറയാതെ, അനുവദിക്കൽ അഥവാ തടയാതിരിക്കൽ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: എല്ലാ ജനതകളെയും
  rationale: ἔθνη എന്നതിന്റെ കൂട്ടായ ജനവിഭാഗസൂചന നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്ന സാധ്യതയെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πορεύεσθαι
  choice: നടക്കാൻ
  rationale: ὁδοῖς എന്ന ‘വഴികൾ’ എന്ന പദത്തോടൊപ്പമുള്ള ജീവിതഗതിയുടെ രൂപകം നിലനിർത്തുന്നു; വെറും ‘പോകാൻ’ എന്നതിനെക്കാൾ ഉറവിടഭാഷയുടെ ദൃശ്യഭാവത്തോട് അടുത്തതാണ്.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: അവരവരുടെ വഴികളിലൂടെ
  rationale: ഓരോ ജനതയും സ്വന്തം വഴിയിൽ നടന്നുവെന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; αὐτῶν എന്ന ഉടമസ്ഥസൂചനയും ബഹുവചനമായ ‘വഴികൾ’ എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക അനുമതിയും അംഗീകാരവും തമ്മിലുള്ള വ്യത്യാസം
  choice: ജനതകളെ അവരുടെ വഴികളിൽ നടക്കാൻ ദൈവം അനുവദിച്ചു
  alternative: ദൈവം അവരുടെ വഴികളെ അംഗീകരിച്ചു, അല്ലെങ്കിൽ അവ നിർണയിച്ചു
  rationale: εἴασεν അനുമതിയെയാണ് സൂചിപ്പിക്കുന്നത്; ധാർമിക അംഗീകാരമോ കാരണനിർണയമോ അല്ല. ദൈവത്തിന്റെ പരമാധികാരവും മനുഷ്യരുടെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള വചനത്തിലെ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവിടുന്ന്’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്നു; ‘വഴികളിലൂടെ നടക്കുക’ എന്ന വേദപുസ്തകീയ രൂപകം സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
