id: ACT.14.4
reference: Acts 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: ml
  text: എന്നാൽ നഗരത്തിലെ ജനങ്ങൾ ഭിന്നിച്ചു[a]; ചിലർ യെഹൂദന്മാരുടെ പക്ഷത്തും മറ്റു ചിലർ അപ്പൊസ്തലന്മാരുടെ പക്ഷത്തും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഗരത്തിലെ ജനസമൂഹം പിളർന്നു.’
    reason: ἐσχίσθη എന്ന പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ പരിഭാഷയും τὸ πλῆθος എന്നതിന്റെ സമഷ്ടിപ്രയോഗവും കാണിക്കുന്നു.
lexical_decisions:
- source_word: ἐσχίσθη
  choice: ഭിന്നിച്ചു
  rationale: σχίζω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ഇവിടെ സമൂഹം രണ്ടു പക്ഷങ്ങളായി പിരിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഭിന്നിച്ചു’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: നഗരത്തിലെ ജനങ്ങൾ
  rationale: πλῆθος ഇവിടെ ഒരേസമയം കൂടിയ ഒരു ജനക്കൂട്ടത്തേക്കാൾ നഗരത്തിലെ ജനസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അതിനാൽ ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സംഭവവികാസത്തോടുള്ള നേരിയ വൈരുധ്യവും തുടർഫലവും δέ അടയാളപ്പെടുത്തുന്നു.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: ചിലർ ... മറ്റു ചിലർ
  rationale: രണ്ടു വിരുദ്ധ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പരസ്പരബന്ധിത ഘടന മലയാളത്തിൽ വ്യക്തമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: σὺν
  choice: പക്ഷത്ത്
  rationale: σύν അടിസ്ഥാനമായി സഹവർത്തിത്വം സൂചിപ്പിച്ചാലും, ഇവിടെ രണ്ടു വിഭാഗങ്ങളോടുള്ള സാമൂഹിക പിന്തുണയും ചേരിതിരിവുമാണ് സന്ദർഭം വ്യക്തമാക്കുന്നത്; ‘പക്ഷത്ത്’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Ἰουδαίοις
  choice: യെഹൂദന്മാർ
  rationale: ഈ വാക്യം പരാമർശത്തെ നേതാക്കളിൽ മാത്രമായി ചുരുക്കുന്നില്ല; അതിനാൽ പൊതുവായ ജനവിഭാഗനാമം നിലനിർത്തുന്നു.
- source_word: ἀποστόλοις
  choice: അപ്പൊസ്തലന്മാർ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ സ്ഥാപിതമായ പദമാണ്; ഇവിടെ പൗലോസിനെയും ബർന്നബാസിനെയും വിവരിക്കുന്ന ലൂക്കോസിന്റെ ആഖ്യാനപദവി അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അപ്പൊസ്തലന്മാർ’ എന്നതിന്റെ പരാമർശം
  choice: പൗലോസിനും ബർന്നബാസിനും ലൂക്കോസ് നൽകുന്ന ആഖ്യാനപദവിയായി ‘അപ്പൊസ്തലന്മാർ’ നിലനിർത്തി.
  alternative: ‘ദൂതന്മാർ’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തുക.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 14:14-ൽ ബർന്നബാസിനെയും പൗലോസിനെയും വ്യക്തമായി ἀπόστολοι എന്നു വിളിക്കുന്നു. പദം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നത് അതിനപ്പുറമുള്ള സിദ്ധാന്തപരമായ നിർവചനം അടിച്ചേൽപ്പിക്കാതെ മൂലപാഠം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഭിന്നിച്ചു’ മുഖ്യവാചകത്തിൽ സാമൂഹിക ചേരിതിരിവ് ലളിതമായി അറിയിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ ‘പിളർന്നു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
