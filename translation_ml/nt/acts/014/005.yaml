translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും മാന്യമായും വായിക്കാവുന്ന ശൈലി. വാക്യം അടുത്ത വാക്യഭാഗത്തിൽ തുടരുന്നതിനാൽ അവസാനം അർധവിരാമമല്ല, കോമയാണ് നൽകിയിരിക്കുന്നത്. ‘ജാതികൾ’ എന്ന സഭാപരമായി പരിചിതമായെങ്കിലും സാധാരണ വായനയിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കാവുന്ന പദത്തിന് പകരം ‘യെഹൂദരല്ലാത്തവർ’ ഉപയോഗിച്ചു.
