translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി പിന്തുടർന്നു. ‘പലായനം ചെയ്തു’ എന്ന കൂടുതൽ ഔപചാരിക രൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘ഓടിപ്പോയി’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഘടകത്തിന് പിന്നാലെ നൽകിയിരിക്കുന്നു.
