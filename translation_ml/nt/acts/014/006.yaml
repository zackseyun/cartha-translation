  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: ml
  text: അവർ അതു മനസ്സിലാക്കിയപ്പോൾ[a], ലുക്കവോന്യയിലെ ലുസ്ത്ര, ദെർബെ എന്നീ പട്ടണങ്ങളിലേക്കും ചുറ്റുമുള്ള പ്രദേശത്തേക്കും പലായനം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ ഇതു തിരിച്ചറിഞ്ഞപ്പോൾ’ അല്ലെങ്കിൽ ‘അവർ ഇതിനെക്കുറിച്ച് അറിഞ്ഞപ്പോൾ.’ മുൻവാക്യത്തിൽ വിവരിച്ച അപകടത്തെ അവർ മനസ്സിലാക്കിയതാണു ഗ്രീക്ക് കൃദന്തം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: അവർ ഇതു മനസ്സിലാക്കിയപ്പോൾ
  rationale: സυνιδόντες എന്ന ഭൂതകാല കൃദന്തം മുൻവാക്യത്തിൽ വിവരിച്ച അപകടകരമായ സാഹചര്യം തിരിച്ചറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽനിന്ന് ആവശ്യമായ ‘ഇതു’ ചേർത്തത് മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: κατέφυγον
  choice: ഓടിപ്പോയി
  rationale: καταφεύγω അപകടത്തിൽനിന്ന് അഭയം തേടി പലായനം ചെയ്യുക എന്ന ആശയം വഹിക്കുന്നു. ഇവിടെ അടിയന്തരമായി സ്ഥലംവിട്ടതിലാണ് ഊന്നൽ; ‘ഓടിപ്പോയി’ അത് സാധാരണ ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς
  choice: -ലേക്കും / -ത്തേക്കും
  rationale: ചലനത്തിന്റെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്ന εἰς മലയാളത്തിലെ ദിശാസൂചക പ്രത്യയങ്ങളാൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: ലുക്കവോന്യയിലെ പട്ടണങ്ങളായ
  rationale: പ്രദേശബന്ധിയായ ജനിറ്റീവ് മലയാളത്തിൽ ‘ലുക്കവോന്യയിലെ’ എന്നു സ്വാഭാവികമായി നൽകി; തുടർന്ന് വരുന്ന ലുസ്ത്രയും ദെർബെയും ആ പട്ടണങ്ങളെ തിരിച്ചറിയുന്ന സമാനാധികരണ ഘടകമാണെന്ന് ‘പട്ടണങ്ങളായ’ വ്യക്തമാക്കുന്നു.
- source_word: Λύστραν καὶ Δέρβην
  choice: ലുസ്ത്രയിലേക്കും ദെർബെയിലേക്കും
  rationale: സ്ഥലനാമങ്ങളുടെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പരിചിത രൂപങ്ങൾ ഉപയോഗിച്ചു; εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനം ഓരോ പേരിലും ദിശാസൂചകമായി പ്രകടമാക്കി.
- source_word: τὴν περίχωρον
  choice: ചുറ്റുമുള്ള പ്രദേശത്തേക്കും
  rationale: περίχωρος പേരുവാചകമായി ലുസ്ത്രയുടെയും ദെർബെയുടെയും ചുറ്റുപാടിനെ സൂചിപ്പിക്കുന്നു. നഗര-ഗ്രാമ മേഖലകളെ ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പദപ്രയോഗമാണിത്.
- source_word: καὶ ... καὶ
  choice: -ലേക്കും ... -ലേക്കും ... -ത്തേക്കും
  rationale: ആവർത്തിക്കുന്ന καίയുടെ ഏകോപനബന്ധം മലയാളത്തിലെ ‘-ഉം’ ചേർക്കലുകളാൽ സ്വാഭാവികമായി നിലനിർത്തി.
