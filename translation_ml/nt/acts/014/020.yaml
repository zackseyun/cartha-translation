  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: ml
  text: എന്നാൽ ശിഷ്യന്മാർ അവനെ ചുറ്റിനിന്നപ്പോൾ[a], അവൻ എഴുന്നേറ്റ്[b] നഗരത്തിൽ പ്രവേശിച്ചു. പിറ്റേന്ന് അവൻ ബർന്നബാസിനോടൊപ്പം ദെർബെയിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ വളഞ്ഞുനിന്നപ്പോൾ’ അല്ലെങ്കിൽ ‘അവനെ വലയംചെയ്തപ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവൻ ഉയിർത്തെഴുന്നേറ്റു.’ ഗ്രീക്ക് പദം അങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ പുനരുത്ഥാനത്തെ വ്യക്തമായി വിവരിക്കുന്നതിനെക്കാൾ, പൗലോസ് ശരീരമായി എഴുന്നേറ്റതിനെ സൂചിപ്പിക്കാനാണ് സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: ചുറ്റിനിന്നപ്പോൾ
  rationale: ക്രിയയുടെ അടിസ്ഥാനമായ ‘ചുറ്റുക/വലയംചെയ്യുക’ എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, ശിഷ്യന്മാരുടെ പ്രവൃത്തി ശത്രുതാപരമായിരുന്നുവെന്ന ധ്വനി വരാതിരിക്കാൻ സ്വാഭാവികമായ മലയാളപ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പൗലോസിനെ കല്ലെറിഞ്ഞ് നഗരത്തിനു പുറത്തേക്ക് വലിച്ചിഴച്ച സംഭവത്തിനുശേഷമുള്ള അപ്രതീക്ഷിത വഴിത്തിരിവ് മിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῶν μαθητῶν
  choice: ശിഷ്യന്മാർ
  rationale: പ്രവൃത്തികളുടെ പുസ്തകത്തിലുടനീളം μαθητής എന്ന പദത്തിന് സ്ഥിരവും പരിചിതവുമായ മലയാളസമാനപദം.
- source_word: ἀναστὰς
  choice: അവൻ എഴുന്നേറ്റ്
  rationale: ഇവിടെ പൗലോസ് ശരീരമായി എഴുന്നേൽക്കുന്നതാണ് നേരിട്ട് പറയുന്നത്; പുനരുത്ഥാനം സംഭവിച്ചുവെന്ന് വാചകം വ്യക്തമാക്കാത്തതിനാൽ അതു സൂചിപ്പിക്കുന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം ഒഴിവാക്കി.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: നഗരത്തിലേക്കു ചെന്നു
  rationale: നഗരത്തിന്റെ അകത്തേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῇ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: ‘അടുത്ത ദിവസം’ എന്ന കാലസൂചനയുടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളരൂപം.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ദെർബെ എന്ന ലക്ഷ്യസ്ഥാനം പിന്നാലെ വരുന്നതിനാൽ, പുറപ്പെട്ടുപോയി എന്ന ദിശാസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: ബർന്നബാസിനോടൊപ്പം
  rationale: സഹയാത്ര എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: Δέρβην
  choice: ദെർബെ
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: ἀναστὰς എന്നത് പുനരുത്ഥാനമോ അത്ഭുതകരമായ പുനർജീവനമോ സൂചിപ്പിക്കുന്നവിധം പരിഭാഷപ്പെടുത്തണമോ
  choice: സാധാരണ ശാരീരിക പ്രവൃത്തിയായി ‘അവൻ എഴുന്നേറ്റ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ ഉയിർത്തെഴുന്നേറ്റു’ അല്ലെങ്കിൽ ‘അവൻ എഴുന്നേല്പിക്കപ്പെട്ടു’
  rationale: ἀναστὰς എന്ന പദം സ്വതവേ എഴുന്നേൽക്കുക എന്ന സാധാരണ അർഥത്തിൽ ഉപയോഗിക്കാം. കല്ലേറിനുശേഷമുള്ള അവന്റെ സുഖപ്രാപ്തി അസാധാരണമായിരിക്കാമെങ്കിലും, ഈ വാക്യം പുനരുത്ഥാനമോ ദൈവികമായി എഴുന്നേല്പിക്കപ്പെടലോ വ്യക്തമായി പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ചുറ്റിനിന്നപ്പോൾ’, ‘എഴുന്നേറ്റ്’, ‘പിറ്റേന്ന്’, ‘പുറപ്പെട്ടു’ എന്നീ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ചലനക്രമവും ദൈവശാസ്ത്രപരമായ സംയമനവും നിലനിർത്തി.
