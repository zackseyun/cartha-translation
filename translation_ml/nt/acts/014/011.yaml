id: ACT.14.11
reference: Acts 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: ml
  text: 'ജനക്കൂട്ടങ്ങൾ പൗലോസ് ചെയ്തതു കണ്ടപ്പോൾ, ലുക്കവോന്യഭാഷയിൽ ശബ്ദമുയർത്തി പറഞ്ഞു: “ദേവന്മാർ മനുഷ്യരോടു സദൃശരായി നമ്മുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: ജനക്കൂട്ടങ്ങൾ ... കണ്ടപ്പോൾ
  rationale: τέ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; aorist participle ആയ ἰδόντες പ്രധാനക്രിയയുടെ കാലസാഹചര്യം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘കണ്ടപ്പോൾ’ സ്വാഭാവികമായി ഈ ബന്ധം നൽകുന്നു.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: പൗലോസ് ചെയ്തതു
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച അത്ഭുതപ്രവൃത്തിയെയാണ് relative clause സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ലളിതമായ ഭൂതകാലരൂപം സംഭവക്രമത്തിൽ വ്യക്തമാണ്.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ശബ്ദമുയർത്തി
  rationale: ഉച്ചത്തിൽ വിളിച്ചുപറയുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Λυκαονιστί
  choice: ലുക്കവോന്യഭാഷയിൽ
  rationale: ഈ ക്രിയാവിശേഷണം ലുക്കവോന്യരുടെ ഭാഷയിൽ സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; ‘ഭാഷയിൽ’ എന്നു വ്യക്തമാക്കുന്നത് ആധുനിക വായനക്കാർക്ക് അർത്ഥം നേരെയാക്കുന്നു.
- source_word: Οἱ θεοὶ
  choice: ദേവന്മാർ
  rationale: ബഹുവചനമായ θεοί ജനക്കൂട്ടത്തിന്റെ ബഹുദൈവവിശ്വാസത്തിലുള്ള ദേവതകളെയാണ് സൂചിപ്പിക്കുന്നത്; ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘ദൈവം’ എന്ന പദത്തിൽനിന്ന് ഇത് വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: മനുഷ്യരോടു സദൃശരായി
  rationale: ὁμοιόω എന്ന ക്രിയയുടെ aorist passive participle മനുഷ്യരോടുള്ള സാദൃശ്യം പ്രകടിപ്പിക്കുന്നു. ഈ പരിഭാഷ ആ രൂപം നിലനിർത്തുകയും ‘മനുഷ്യരായി മാറി’ എന്നതുപോലെ സ്വഭാവപരിവർത്തനം അമിതമായി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: നമ്മുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു
  rationale: καταβαίνω എന്നതിന്റെ താഴേക്കുള്ള ചലനം ‘ഇറങ്ങിവന്നു’ നിലനിർത്തുന്നു; ജനക്കൂട്ടത്തിന്റെ ആവേശകരമായ ഇപ്പോഴത്തെ തിരിച്ചറിവ് ‘വന്നിരിക്കുന്നു’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ജനക്കൂട്ടത്തിന്റെ ബഹുദൈവവിശ്വാസപരമായ വ്യാഖ്യാനം ക്രിസ്തീയ അവതാരസിദ്ധാന്തമായി കേൾപ്പിക്കാതിരിക്കുക
  choice: ദേവന്മാർ മനുഷ്യരോടു സദൃശരായി നമ്മുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു
  alternative: ദേവന്മാർ മനുഷ്യരെപ്പോലെയായി നമ്മുടെ അടുക്കൽ ഇറങ്ങിവന്നിരിക്കുന്നു
  rationale: വാക്യം ലുസ്ത്രയിലെ ജനക്കൂട്ടത്തിന്റെ തെറ്റായ മതവ്യാഖ്യാനമാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. ‘സദൃശരായി’ എന്നത് ὁμοιωθέντες എന്നതിലെ സാദൃശ്യത്തെ സംരക്ഷിക്കുകയും പാഠത്തിൽ ഇല്ലാത്ത ക്രിസ്തുശാസ്ത്രപരമായ അർത്ഥം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ലുക്കവോന്യഭാഷ’ എന്ന രൂപം പ്രദേശനാമവുമായി തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരിച്ചു. മൂലപാഠത്തിൽ നിർണായകമായ പാഠഭേദമോ നിർബന്ധമായ വിശദീകരണാവശ്യമോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ നൽകിയിട്ടില്ല.
