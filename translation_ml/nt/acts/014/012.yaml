id: ACT.14.12
reference: Acts 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: ml
  text: അവർ ബർന്നബാസിനെ സ്യൂസ് എന്നും പൗലോസിനെ ഹെർമീസ് എന്നും വിളിച്ചുകൊണ്ടിരുന്നു; കാരണം, സംസാരത്തിൽ നേതൃത്വം വഹിച്ചിരുന്നത് പൗലോസായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സംസാരത്തിന്റെ നേതാവായിരുന്നത് അവനായിരുന്നു’; അഥവാ, ‘അവനായിരുന്നു മുഖ്യപ്രഭാഷകൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: വിളിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലക്രിയയായതിനാൽ ജനക്കൂട്ടത്തിന്റെ തുടരുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Δία
  choice: സ്യൂസ്
  rationale: ഗ്രീക്ക് പാഠത്തിലുള്ള ദേവനാമം നേരിട്ട് നിലനിർത്തുന്നു; റോമൻ സമാനനാമമായ ‘ജൂപ്പിറ്റർ’ ഉപയോഗിക്കുന്നില്ല.
- source_word: Ἑρμῆν
  choice: ഹെർമീസ്
  rationale: ഗ്രീക്ക് പാഠത്തിലുള്ള ദേവനാമം നേരിട്ട് നിലനിർത്തുന്നു; റോമൻ സമാനനാമമായ ‘മെർക്കുറി’ ഉപയോഗിക്കുന്നില്ല.
- source_word: ἐπειδὴ
  choice: കാരണം
  rationale: പൗലോസിനെ ഹെർമീസ് എന്നു വിളിച്ചതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: സംസാരത്തിനു നേതൃത്വം നൽകിയിരുന്നത്
  rationale: ‘സംസാരത്തെ നയിക്കുന്നവൻ/മുഖ്യപ്രഭാഷകൻ’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; λόγος എന്നത് ഇവിടെ ദൈവശാസ്ത്രപരമായ ‘വചനം’ എന്നല്ല, സംസാരമോ പ്രസംഗമോ എന്ന നിലയിലാണ്.
- source_word: αὐτὸς
  choice: പൗലോസായിരുന്നു
  rationale: സർവനാമത്തിന്റെ ഊന്നലും ബർന്നബാസിൽനിന്നുള്ള വേർതിരിവും മലയാളത്തിൽ സംശയരഹിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിജാതീയ ദേവന്മാരുടെ പേരുകളുടെ പരിഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘സ്യൂസ്’, ‘ഹെർമീസ്’ എന്നീ ഗ്രീക്ക് പേരുകൾ ഉപയോഗിച്ചു
  alternative: ‘ജൂപ്പിറ്റർ’, ‘മെർക്കുറി’ എന്നീ റോമൻ പേരുകൾ
  rationale: മൂലഗ്രീക്ക് പാഠം സ്യൂസിനെയും ഹെർമീസിനെയും നേരിട്ട് പേരെടുത്തുപറയുന്നതിനാൽ പരിഭാഷാപാരമ്പര്യത്തിൽ വന്ന റോമൻ സമാനനാമങ്ങൾ പകരംവെച്ചില്ല.
- issue: ὁ ἡγούμενος τοῦ λόγου എന്ന പ്രയോഗം
  choice: സംസാരത്തിനു നേതൃത്വം നൽകിയിരുന്നത്
  alternative: മുഖ്യപ്രഭാഷകൻ / വചനത്തെ നയിച്ചവൻ
  rationale: പൗലോസിന്റെ മുഖ്യ സംസാരപങ്ക് വ്യക്തമാക്കുകയും λόγος-ന് ഇവിടെ അനാവശ്യമായ ദൈവശാസ്ത്ര സാങ്കേതികാർഥം നൽകാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് ദേവനാമങ്ങൾ മലയാള ലിപിയിൽ നേരിട്ട് നൽകി. പൗലോസിനെ സൂചിപ്പിക്കുന്ന αὐτός മലയാളത്തിൽ അവ്യക്തമാകാതിരിക്കാൻ പേര് ആവർത്തിച്ചു.
