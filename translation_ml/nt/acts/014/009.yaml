revisions:
- from: ഈ മനുഷ്യൻ പൗലോസ് സംസാരിക്കുന്നത് ശ്രദ്ധിച്ചുകേട്ടുകൊണ്ടിരുന്നു. പൗലോസ് അവനെ സൂക്ഷിച്ചുനോക്കി, സൗഖ്യം പ്രാപിക്കാനുള്ള വിശ്വാസം അവനുണ്ടെന്നു കണ്ടു.[a]
