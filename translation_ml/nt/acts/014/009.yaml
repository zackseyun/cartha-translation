source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: ml
  text: ഈ മനുഷ്യൻ പൗലോസ് സംസാരിക്കുന്നത് ശ്രദ്ധിച്ചു കേട്ടു. പൗലോസ് അവനെ ഉറ്റുനോക്കി, സൗഖ്യം[a] പ്രാപിക്കാനുള്ള വിശ്വാസം അവനുണ്ടെന്ന് കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, കൂടുതൽ വിശാലമായി, “രക്ഷ പ്രാപിക്കാനുള്ള വിശ്വാസം.” ഗ്രീക്ക് പദത്തിന് “രക്ഷിക്കുക” എന്നും “സൗഖ്യമാക്കുക” എന്നും അർഥമാകാം; ഇവിടെ സന്ദർഭം പ്രധാനമായും ശാരീരിക സൗഖ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: മുൻവാക്യത്തിലെ ജന്മനാ മുടന്തനായ മനുഷ്യനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἤκουσεν
  choice: ശ്രദ്ധിച്ചുകേട്ടുകൊണ്ടിരുന്നു
  rationale: ἤκουσεν എന്നത് അടിസ്ഥാനമായി ‘കേട്ടു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ പൗലോസിന്റെ പ്രസംഗം ശ്രദ്ധയോടെ കേൾക്കുന്നതാണ് ഉദ്ദേശ്യം. λαλοῦντος എന്ന വർത്തമാനകൃത്തെച്ചവുമായി ചേർന്നുള്ള തുടരുന്ന ദൃശ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λαλοῦντος
  choice: സംസാരിക്കുന്നത്
  rationale: പൗലോസിന്റെ വാക്കാലുള്ള പ്രസംഗത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ ആധുനിക പ്രയോഗം.
- source_word: ἀτενίσας
  choice: സൂക്ഷിച്ചുനോക്കി
  rationale: ഏകാഗ്രമായി ദൃഷ്ടി പതിപ്പിക്കുന്നതിന്റെ ശക്തി നിലനിർത്തുകയും അസ്വാഭാവികമായ പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ἰδὼν
  choice: കണ്ടു
  rationale: മൂലത്തിലെ ദർശനക്രിയ നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ തിരിച്ചറിവ് എന്ന ആശയവും സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἔχει πίστιν
  choice: വിശ്വാസം അവനുണ്ടെന്ന്
  rationale: πίστις ഇവിടെ ആ മനുഷ്യന്റെ വിശ്വസിക്കുന്ന പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘വിശ്വാസം’ സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ മലയാളപദമാണ്.
- source_word: τοῦ σωθῆναι
  choice: സൗഖ്യം പ്രാപിക്കാനുള്ള
  rationale: σῴζω എന്ന ക്രിയയ്ക്ക് ‘രക്ഷിക്കുക’ എന്നും ‘സൗഖ്യമാക്കുക’ എന്നും അർഥമാകാം. ഉടൻ പിന്നാലെ നടക്കുന്ന ശാരീരിക സൗഖ്യമാണ് ഈ സന്ദർഭത്തിലെ പ്രധാന അർഥം; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘സൗഖ്യം പ്രാപിക്കുക’ ഉപയോഗിക്കുന്നു, വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സൗഖ്യവിവരണത്തിൽ σωθῆναι എന്നതിന്റെ അർഥം
  choice: ശാരീരികമായി സൗഖ്യം പ്രാപിക്കുക
  alternative: രക്ഷ പ്രാപിക്കുക
  rationale: അടുത്ത വാക്യത്തിലെ അത്ഭുതസൗഖ്യം ശാരീരിക അർഥത്തെ ഉറപ്പിക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്കുപദത്തിന്റെ വിശാലമായ രക്ഷാർഥം ഇല്ലാതാക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ അത് സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ നീണ്ട ഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി, സംഭവക്രമവും പൗലോസാണ് നോക്കിയതെന്ന സൂചനയും വ്യക്തമായി നിലനിർത്തി.
