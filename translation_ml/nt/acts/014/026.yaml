revisions:
- from: അവിടെനിന്ന് അവർ കപ്പൽ കയറി അന്ത്യോക്യയിലേക്കു മടങ്ങി. അവർ പൂർത്തിയാക്കിയ പ്രവർത്തനത്തിനായി ദൈവകൃപയ്ക്ക് അവരെ ഏൽപ്പിച്ചിരുന്നത് അവിടെവെച്ചായിരുന്നു.[a]
  to: അവിടെനിന്ന് അവർ കപ്പലിൽ അന്ത്യോക്യയിലേക്കു യാത്രയായി. അവിടെനിന്നാണ് അവർ പൂർത്തിയാക്കിയ പ്രവൃത്തിക്കായി ദൈവകൃപയ്ക്ക് ഏൽപ്പിക്കപ്പെട്ടിരുന്നത്.[a]
  rationale: The revision removes the added ‘returned’ sense, explicitly retains the origin force of ὅθεν, and recasts the clause into fluent modern standard Malayalam. It maintains the Greek passive and the theological restraint of entrusting them to God’s grace.
