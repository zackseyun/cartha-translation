id: ACT.14.26
reference: Acts 14:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: ml
  text: അവിടെനിന്ന് അവർ കപ്പലിൽ അന്ത്യോക്യയിലേക്കു യാത്രയായി. അവിടെനിന്നാണ് അവർ പൂർത്തിയാക്കിയ പ്രവൃത്തിക്കായി ദൈവകൃപയ്ക്ക് ഏൽപ്പിക്കപ്പെട്ടിരുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ പൂർത്തിയാക്കിയ പ്രവൃത്തിക്കായി ദൈവകൃപയ്ക്ക് ഭരമേൽപ്പിക്കപ്പെട്ടിരുന്നത് എവിടെനിന്നാണോ അവിടെനിന്ന്.” “പൂർത്തിയാക്കിയ” എന്നതിന് “നിറവേറ്റിയ” എന്നും പറയാം.
    reason: ὅθεν-ന്റെ ‘എവിടെനിന്ന്’ എന്ന ഉറവിടാർഥവും παραδεδομένοι, ἐπλήρωσαν എന്നിവയ്ക്കുള്ള അടുത്ത പദാനുപദമായ ബദലുകളും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: മുൻവിവരണത്തോടുള്ള ബന്ധവും പുറപ്പെട്ട സ്ഥലവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വാക്യാരംഭത്തിലെ ബന്ധകശക്തി മലയാളത്തിലെ വിവരണത്തുടർച്ചയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἀπέπλευσαν
  choice: കപ്പൽ കയറി ... മടങ്ങി
  rationale: കടൽമാർഗമുള്ള പുറപ്പെടൽ വ്യക്തമാക്കുകയും, മുമ്പ് പുറപ്പെട്ട അന്ത്യോക്യയിലേക്കുള്ള മടക്കം സന്ദർഭാനുസൃതമായി സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς Ἀντιόχειαν
  choice: അന്ത്യോക്യയിലേക്ക്
  rationale: ചലനത്തെ സൂചിപ്പിക്കുന്ന εἰς-ന്റെ ലക്ഷ്യാർഥം നേരിട്ട് നൽകുന്നു; സ്ഥലനാമം പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ὅθεν
  choice: അവിടെവെച്ചായിരുന്നു
  rationale: അന്ത്യോക്യ തന്നെയാണ് മുൻപ് അവരെ ഏൽപ്പിച്ച സ്ഥലം എന്ന ഉറവിടാർഥം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἦσαν παραδεδομένοι
  choice: അവരെ ഏൽപ്പിച്ചിരുന്നത്
  rationale: മുൻകാലത്ത് നടന്നതും ഇപ്പോഴത്തെ മടക്കവുമായി പ്രസക്തിയുള്ളതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കർത്തൃവാചകത്തിലെ അജ്ഞാത പ്രവർത്തകനെ കൂട്ടിച്ചേർക്കാതെ ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: ദൈവകൃപയ്ക്ക്
  rationale: അവർ ഏൽപ്പിക്കപ്പെട്ടത് ദൈവത്തിന്റെ കൃപയ്ക്കാണെന്ന ദത്തിവ് ബന്ധം ചുരുക്കവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸ ἔργον
  choice: പ്രവർത്തനത്തിനായി
  rationale: ἔργον എന്നതിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ദൗത്യം’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: ὃ ἐπλήρωσαν
  choice: അവർ പൂർത്തിയാക്കിയ
  rationale: ഇവിടെ πληρόω സൂചിപ്പിക്കുന്ന നിറവേറ്റി തീർക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പൗലൊസിനെയും ബർന്നബാസിനെയും സംബന്ധിച്ച സഭയുടെ മുൻപ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ദൈവകൃപയ്ക്ക് അവരെ ഏൽപ്പിച്ചിരുന്നത്
  alternative: ദൈവകൃപയിലേക്കു അവരെ ഭരമേൽപ്പിച്ചിരുന്നത്
  rationale: ദൈവത്തിന്റെ കൃപാപരമായ സംരക്ഷണത്തിൽ അവരെ ഏൽപ്പിച്ച ആശയം നൽകുന്നു; പ്രത്യേക സഭാപരമായ നിയമനസിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ὅθεν എന്നതിലെ ഉറവിടാർഥം
  choice: അവിടെവെച്ചായിരുന്നു
  alternative: എവിടെനിന്നാണോ
  rationale: അന്ത്യോക്യയാണ് അവരുടെ മുൻപത്തെ പുറപ്പെടൽസ്ഥലം എന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അസ്വാഭാവികമായ ബന്ധവാക്യം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘അന്ത്യോക്യ’, ‘ദൈവകൃപ’ എന്നീ പരിചിത ബൈബിൾരൂപങ്ങൾ നിലനിർത്തി; അതേസമയം പഴഞ്ചൻ വാക്യഘടന ഒഴിവാക്കി.
