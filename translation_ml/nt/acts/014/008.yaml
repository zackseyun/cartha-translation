  text: Καί τις ἀνὴρ ⸂ἀδύνατος ἐν Λύστροις⸃ τοῖς ποσὶν ἐκάθητο, χωλὸς ἐκ κοιλίας μητρὸς ⸀αὐτοῦ, ὃς οὐδέποτε ⸀περιεπάτησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: ml
  text: ലുസ്ത്രയിൽ കാലുകൾക്ക് ശക്തിയില്ലാത്ത[a] ഒരു മനുഷ്യൻ ഇരിക്കുകയായിരുന്നു. അവൻ അമ്മയുടെ ഗർഭം മുതൽ മുടന്തനായിരുന്നു; ഒരിക്കലും നടന്നിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാലുകൾക്ക് ബലമില്ലാത്ത.” അവൻ മുടന്തനായിരുന്നു എന്നു വ്യക്തമായി പറയുന്നതിനുമുമ്പ് ഗ്രീക്ക് വാചകം കാലുകളിലെ ശക്തിയില്ലായ്മയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: മലയാളത്തിലെ സ്വാഭാവികമായ ആഖ്യാനത്തുടർച്ചയ്ക്കായി വാക്യം നേരിട്ട് ആരംഭിച്ചു; ഗ്രീക്കിലെ ലളിതമായ ബന്ധകത്തിന്റെ പ്രവർത്തനം സന്ദർഭംതന്നെ നൽകുന്നു.
- source_word: τις ἀνὴρ
  choice: ഒരു മനുഷ്യൻ
  rationale: പേരുപറയാത്തെങ്കിലും പ്രത്യേകമായ ഒരാളെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ നൽകി.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: കാലുകൾക്കു ശക്തിയില്ലാത്ത
  rationale: ἀδύνατος എന്ന പദത്തിലെ ശക്തിയില്ലായ്മയുടെ അർഥം നിലനിർത്തുകയും പിന്നാലെയുള്ള χωλός എന്ന വിവരണത്തിൽ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്തു.
- source_word: ἐν Λύστροις
  choice: ലുസ്ത്രയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണവും സ്ഥാനസൂചകപ്രത്യയവും ഉപയോഗിച്ചു.
- source_word: ἐκάθητο
  choice: ഇരിക്കുകയായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന അവസ്ഥയെ മലയാളത്തിലെ പുരോഗമന ഭൂതകാലരൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: χωλός
  choice: മുടന്തനായിരുന്നു
  rationale: നടക്കാനുള്ള ശാരീരിക വൈകല്യം വ്യക്തമായി സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ പദം; മുൻപുള്ള ‘ശക്തിയില്ലാത്ത’ എന്ന വിവരണത്തിന്റെ പുനരുക്തി ഒഴിവാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: അമ്മയുടെ ഗർഭംമുതൽ
  rationale: ‘ജനനംമുതൽ’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കത്തിന് പകരം മൂലഭാഷയിലെ സജീവമായ ഗർഭപ്രയോഗം സംരക്ഷിച്ചു.
- source_word: οὐδέποτε περιεπάτησεν
  choice: ഒരിക്കലും നടന്നിട്ടുമില്ല
  rationale: ജീവിതത്തിൽ അതുവരെ ഒരിക്കലും നടന്നിട്ടില്ലെന്ന സമ്പൂർണ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘-ഉം’ മുൻവിവരണത്തോടുള്ള ഊന്നിയ ബന്ധം നൽകുന്നു.
