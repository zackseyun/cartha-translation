id: ACT.14.13
reference: Acts 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅ ⸀τε ἱερεὺς τοῦ Διὸς τοῦ ὄντος πρὸ τῆς ⸀πόλεως ταύρους καὶ στέμματα ἐπὶ τοὺς πυλῶνας ἐνέγκας σὺν τοῖς ὄχλοις ἤθελεν θύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: ml
  text: നഗരത്തിനു പുറത്തുണ്ടായിരുന്ന സ്യൂസിന്റെ ക്ഷേത്രത്തിലെ പുരോഹിതൻ[a] കാളകളെയും മാലകളെയും കവാടങ്ങളിലേക്കു കൊണ്ടുവന്ന്, ജനക്കൂട്ടങ്ങളോടൊപ്പം ബലിയർപ്പിക്കാൻ അയാൾ ആഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘നഗരത്തിനു മുമ്പിലുള്ള സ്യൂസിന്റെ പുരോഹിതൻ.’ ‘നഗരത്തിനു മുമ്പിലുള്ള’ എന്ന വിശേഷണം വ്യാകരണപരമായി സ്യൂസിനോടാണ് ചേരുന്നത്; സന്ദർഭത്തിൽ ഇത് നഗരത്തിനു പുറത്തോ മുമ്പിലോ ഉണ്ടായിരുന്ന സ്യൂസിന്റെ ക്ഷേത്രത്തെയോ ആരാധനാലയത്തെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τε
  choice: — (മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർത്തില്ല)
  rationale: മുൻവിവരണത്തിന്റെ തുടർച്ച ഗ്രീക്കിൽ τε സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ ‘അപ്പോൾ’ എന്ന അധിക കാലസൂചന ചേർക്കാതെ സ്വാഭാവികമായ തുടക്കം മതിയാകുന്നു.
- source_word: ἱερεὺς τοῦ Διὸς
  choice: സ്യൂസിന്റെ ക്ഷേത്രത്തിലെ പുരോഹിതൻ
  rationale: Ζεύς എന്ന ഗ്രീക്ക് ദേവനാമം ‘സ്യൂസ്’ എന്നു നിലനിർത്തുന്നു; ‘ക്ഷേത്രത്തിലെ’ എന്നത് പിന്നാലെയുള്ള സ്ഥാനസൂചനയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: നഗരത്തിനു പുറത്തുണ്ടായിരുന്ന സ്യൂസിന്റെ ക്ഷേത്രത്തിലെ
  rationale: വാക്യഘടനയിൽ ഈ വിശേഷണം നേരിട്ട് സ്യൂസിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഉദ്ദേശ്യം നഗരത്തിനു മുമ്പിൽ/പുറത്ത് സ്ഥിതിചെയ്തിരുന്ന അവന്റെ ആരാധനാലയമാണെന്നതാണ് സാധ്യത. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘ക്ഷേത്രം’ പൂരിപ്പിച്ചു; മൂലത്തിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ταύρους
  choice: കാളകളെ
  rationale: യാഗസന്ദർഭത്തിൽ ταῦρος എന്നതിന്റെ നേരിട്ടുള്ള ആധുനിക മലയാള പരിഭാഷ ‘കാള’ ആണ്.
- source_word: στέμματα
  choice: പുഷ്പമാലകളെ
  rationale: യാഗഘോഷയാത്രയിൽ ഉപയോഗിച്ചിരുന്ന അലങ്കാരമാലകളെയാണ് στέμματα സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘പുഷ്പമാലകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: നഗരകവാടങ്ങളിലേക്കു
  rationale: ചലനസൂചകമായ ἐπίയും ബഹുവചനമായ πυλῶνας-ഉം നിലനിർത്തി. സന്ദർഭവ്യക്തതയ്ക്കായി ‘നഗര-’ ചേർത്തു.
- source_word: ἐνέγκας
  choice: കൊണ്ടുവന്നു
  rationale: അഓറിസ്റ്റ് കൃദന്തത്തിന്റെ പശ്ചാത്തലപ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ സമാപിക ക്രിയയായി അവതരിപ്പിച്ചു.
- source_word: σὺν τοῖς ὄχλοις
  choice: ജനക്കൂട്ടങ്ങളോടൊപ്പം
  rationale: ὄχλοις എന്ന ബഹുവചനം നിലനിർത്തുകയും പുരോഹിതൻ ജനങ്ങളുമായി ചേർന്നാണ് പ്രവർത്തിച്ചതെന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἤθελεν θύειν
  choice: ബലിയർപ്പിക്കാൻ അയാൾ ആഗ്രഹിച്ചു
  rationale: θέλω + ധാതുരൂപം ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു; θύω ആരാധനാസന്ദർഭത്തിൽ ‘ബലിയർപ്പിക്കുക’ എന്നാണ്.
theological_decisions:
- issue: τοῦ ὄντος πρὸ τῆς πόλεως എന്നതിലെ സൂചിതബന്ധം
  choice: നഗരത്തിനു പുറത്തുണ്ടായിരുന്ന സ്യൂസിന്റെ ക്ഷേത്രം
  alternative: ‘നഗരത്തിനു മുമ്പിലുണ്ടായിരുന്ന സ്യൂസ്’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വായന
  rationale: ഗ്രീക്ക് വ്യാകരണത്തിൽ പ്രയോഗം സ്യൂസിനെ വിശേഷിപ്പിക്കുന്നുവെങ്കിലും, പുരോഹിതനെയും ബലിയെയും കുറിച്ചുള്ള സന്ദർഭവും പുരാതന സ്ഥാനനാമരീതിയും സ്യൂസിന്റെ ക്ഷേത്രം/ആരാധനാലയം നഗരത്തിനു മുമ്പിലോ പുറത്തോ സ്ഥിതിചെയ്തിരുന്നതായി മനസ്സിലാക്കാൻ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മൂലത്തിലെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അവ്യക്തതയും അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘സ്യൂസ്’, ‘പുരോഹിതൻ’, ‘ബലിയർപ്പിക്കുക’ എന്നീ പദങ്ങൾ മൂലത്തിലെ ഗ്രീക്ക്-ആരാധനാസന്ദർഭം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
