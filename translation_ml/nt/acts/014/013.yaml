  source_fidelity: 'പ്രധാനപാഠം മൊത്തത്തിൽ ഗ്രീക്കിന്റെ അർഥം നന്നായി കൈമാറുന്നു: സ്യൂസ്, പുരോഹിതൻ, കാളകൾ, മാലകൾ, ബലിയർപ്പിക്കാനുള്ള ഉദ്ദേശ്യം എന്നിവ യഥാക്രമം വ്യക്തമാണ്. എന്നാൽ πυλῶνας എന്നതിൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നഗര-’ ചേർക്കുന്നത് ഒഴിവാക്കുന്നതാണ് ഉചിതം. നിലവിലെ അടിക്കുറിപ്പിലെ ‘അക്ഷരാർഥം’ ഗ്രീക്ക് വിശേഷണം സ്യൂസിനെയാണ് സൂചിപ്പിക്കുന്നതെന്നതിനു പകരം പുരോഹിതനെയാണ് സൂചിപ്പിക്കുന്നതുപോലെ തെറ്റായി അവതരിപ്പിക്കുന്നു.'
  naturalness: ‘സ്യൂസിന്റെ ക്ഷേത്രത്തിലെ പുരോഹിതൻ’ എന്നും ‘ബലിയർപ്പിക്കാൻ അയാൾ ആഗ്രഹിച്ചു’ എന്നും ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘കൊണ്ടുവന്ന്’ എന്ന കൃദന്തരൂപം ഗ്രീക്കിലെ ἐνέγκας-ന്റെ പശ്ചാത്തല/മുൻപ്രവർത്തനബന്ധം കൂടുതൽ സുഗമമായി പ്രതിഫലിപ്പിക്കുന്നു.
