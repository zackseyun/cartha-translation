  source_fidelity: 'മുഖ്യഅർഥം കൃത്യമായി കൈമാറുന്നു: അവർ ഗണ്യമായ കാലം അവിടെ തുടർന്നു, കർത്താവിനോടുള്ള ബന്ധത്തിൽ ധൈര്യത്തോടെ സംസാരിച്ചു; കർത്താവ് തന്റെ കൃപയുടെ വചനത്തിന് സാക്ഷ്യം നൽകി, അവരുടെ കൈകളിലൂടെ അടയാളങ്ങളും അത്ഭുതങ്ങളും നടക്കാൻ അനുവദിച്ചു. എന്നിരുന്നാലും, ‘സാക്ഷ്യം വഹിച്ചിരുന്നു’ എന്ന രൂപം ഗ്രീക്കിലെ വർത്തമാനകാല പങ്കുപ്രയോഗത്തിന്റെ സമകാലിക/തുടർച്ചയായ ഭാവത്തേക്കാൾ മുൻകാല-പൂർണതയുടെ സൂചന നൽകാം.'
  naturalness: വാക്യം പൊതുവേ സ്വാഭാവികമാണ്. ‘അങ്ങനെ’ എന്നത് μὲν οὖν എന്ന സംക്രമണപ്രയോഗത്തിന് ‘അതിനാൽ’ എന്നതിനെക്കാൾ കുറവ് കാരണാർഥം ചുമത്തി സ്വാഭാവികമായി ചേരുന്നു. ‘സാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നു’ ഇവിടെ കഥാപശ്ചാത്തലത്തിൽ സമകാലികമായി തുടരുന്ന സാക്ഷ്യത്തെ വ്യക്തമായി അറിയിക്കുന്നു.
  terminology: ‘കർത്താവ്,’ ‘കൃപ,’ ‘വചനം,’ ‘അടയാളങ്ങളും അത്ഭുതങ്ങളും’ എന്നിവ ഉചിതവും സ്ഥിരതയുള്ളതുമാണ്. ‘കർത്താവിനുവേണ്ടി’ ἐπὶ τῷ κυρίῳ എന്നതിന്റെ സാധ്യമായ ഒരു വ്യാഖ്യാനമാണ്; ‘കർത്താവിൽ’ എന്ന ബദൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നത് ആവശ്യമാണ്.
