    rationale: τῷ μαρτυροῦντι വർത്തമാനകാല പങ്കുപ്രയോഗമാണ്; അവർ സംസാരിച്ചിരുന്ന കാലയളവിൽ കർത്താവ് സാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നതാണ് ആശയം. ‘വഹിച്ചിരുന്നു’ ചില വായനക്കാർക്ക് അതിനുമുമ്പേ പൂർത്തിയായ പ്രവൃത്തിയായി കേൾക്കാം.
