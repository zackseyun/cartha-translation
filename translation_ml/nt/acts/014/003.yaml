id: ACT.14.3
reference: Acts 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: ml
  text: അങ്ങനെ അവർ അവിടെ ഗണ്യമായ ഒരു കാലം താമസിച്ച്, കർത്താവിനുവേണ്ടി ധൈര്യത്തോടെ സംസാരിച്ചു.[a] കർത്താവ് അവരുടെ കൈകളിലൂടെ അടയാളങ്ങളും അത്ഭുതങ്ങളും സംഭവിക്കാൻ അനുവദിച്ചുകൊണ്ട് തന്റെ കൃപയുടെ വചനത്തിനു സാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവിൽ ധൈര്യത്തോടെ സംസാരിച്ചു” അല്ലെങ്കിൽ “കർത്താവിനെ ആശ്രയിച്ച് ധൈര്യത്തോടെ സംസാരിച്ചു.” ഗ്രീക്ക് പ്രയോഗം അവരുടെ ധൈര്യം കർത്താവിൽ അടിസ്ഥാനപ്പെട്ടതോ അവനോടുള്ള ബന്ധത്തിൽ പ്രകടമായതോ ആണെന്ന് സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: ഗണ്യമായ കാലം
  rationale: ഈ പ്രയോഗം ശ്രദ്ധേയമായ ദൈർഘ്യമുള്ള കാലയളവിനെ സൂചിപ്പിക്കുന്നു; ‘ഗണ്യമായ കാലം’ അതിനെ അതിശയോക്തിയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: διέτριψαν
  choice: അവർ അവിടെ ... താമസിച്ച്
  rationale: സന്ദർഭത്തിൽ ഒരു സ്ഥലത്ത് കാലം ചെലവഴിക്കുക, അവിടെ തുടരുക എന്ന അർഥമാണ്; ‘അവിടെ താമസിച്ച്’ സ്ഥലവും ദൈർഘ്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρρησιαζόμενοι
  choice: ധൈര്യത്തോടെ സംസാരിച്ചു
  rationale: ഭയമില്ലാതെ തുറന്നു സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: കർത്താവിനുവേണ്ടി
  rationale: മുഖ്യപാഠത്തിൽ അവരുടെ ധീരസംസാരം കർത്താവിന്റെ സേവനത്തിലും കാര്യത്തിനുമായിരുന്നുവെന്ന ബന്ധം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അടിസ്ഥാനം, ആശ്രയം, മണ്ഡലം എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തെ അധികമായ വ്യക്തിവിശദീകരണം ചേർക്കാതെ പതിവായ ബഹുമാനപദമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: τῷ μαρτυροῦντι
  choice: സാക്ഷ്യം വഹിച്ചിരുന്നു
  rationale: അവരുടെ ശുശ്രൂഷയ്ക്കിടയിൽ കർത്താവ് തുടർച്ചയായി നൽകിയ ദൈവിക സാക്ഷ്യപ്പെടുത്തലിനെ ഭൂതകാലത്തിലെ നീണ്ടുനിന്ന പ്രവൃത്തിയായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: തന്റെ കൃപയുടെ വചനത്തിനു
  rationale: λόγος എന്നതിന്റെ ‘വചനം/സന്ദേശം’ എന്ന അർഥവും കൃപയുമായുള്ള ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: χάριτος
  choice: കൃപ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിലെ ദൈവിക കൃപ എന്ന ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
- source_word: διδόντι
  choice: ഇടനൽകിക്കൊണ്ട്
  rationale: കർത്താവാണ് അത്ഭുതപ്രവൃത്തികൾ സംഭവിക്കാൻ സാധ്യമാക്കുന്നതെന്ന ദൈവിക പ്രദാനവും പ്രവർത്തനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും മനുഷ്യപ്രവർത്തനമായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: σημεῖα καὶ τέρατα
  choice: അടയാളങ്ങളും അത്ഭുതങ്ങളും
  rationale: തെളിവുനൽകുന്ന സ്വഭാവവും വിസ്മയജനകതയും ഉൾക്കൊള്ളുന്ന സ്ഥിരമായ ബൈബിൾ പദജോടി സംരക്ഷിക്കുന്നു.
- source_word: γίνεσθαι
  choice: സംഭവിക്കാൻ
  rationale: അടയാളങ്ങളും അത്ഭുതങ്ങളും ഉണ്ടാകുകയോ സംഭവിക്കുകയോ ചെയ്യുന്നതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: അവരുടെ കൈകളിലൂടെ
  rationale: അപ്പൊസ്തലന്മാർ ദൈവിക പ്രവർത്തനത്തിന്റെ ഉപകരണങ്ങളാണെന്ന ആശയവും മൂലപാഠത്തിലെ സാക്ഷാൽ ദൃശ്യപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ഗ്രീക്കിലുള്ള പദത്തേക്കാൾ അധികമായി ‘യേശു’ എന്നു ചേർക്കാതെ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി.
  alternative: ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിക്കുക.
  rationale: മൂലപാഠത്തിൽ τῷ κυρίῳ എന്നു മാത്രമാണ്. വിവരണസന്ദർഭം ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ടെങ്കിലും, ഇല്ലാത്ത വ്യക്തിവിശദീകരണം ചേർക്കാതെ മൂലപാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: ἐπὶ τῷ κυρίῳ എന്നതിന്റെ ബന്ധാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവിനുവേണ്ടി’ എന്നു നൽകി.
  alternative: ‘കർത്താവിൽ ധൈര്യപ്പെട്ട്’ അല്ലെങ്കിൽ ‘കർത്താവിനെ ആശ്രയിച്ച്’.
  rationale: ἐπί + ദത്തിവ് അടിസ്ഥാനം, ആശ്രയം, ബന്ധമണ്ഡലം, അല്ലെങ്കിൽ ഒരാളുടെ കാര്യത്തിനുവേണ്ടിയുള്ള പ്രവർത്തനം എന്നിവ സൂചിപ്പിക്കാം. മുഖ്യപാഠം സ്വാഭാവികമായ സേവനബന്ധം നൽകുമ്പോൾ, മറ്റൊരു യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ഭാഷ ഉപയോഗിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; കർത്താവിന്റെ സാക്ഷ്യപ്പെടുത്തലും അത്ഭുതങ്ങൾ സാധ്യമാക്കുന്നതും തമ്മിലുള്ള ബന്ധം നിലനിർത്തി.
