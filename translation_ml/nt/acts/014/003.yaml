  revised_text: അങ്ങനെ അവർ അവിടെ ഗണ്യമായ ഒരു കാലം താമസിച്ച്, കർത്താവിനുവേണ്ടി ധൈര്യത്തോടെ സംസാരിച്ചു.[a] കർത്താവ് അവരുടെ കൈകളിലൂടെ അടയാളങ്ങളും അത്ഭുതങ്ങളും സംഭവിക്കാൻ അനുവദിച്ചുകൊണ്ട് തന്റെ കൃപയുടെ വചനത്തിനു സാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നു.
