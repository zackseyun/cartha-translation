  to: അങ്ങനെ അവർ അവിടെ ഗണ്യമായ ഒരു കാലം താമസിച്ച്, കർത്താവിനുവേണ്ടി ധൈര്യത്തോടെ സംസാരിച്ചു.[a] കർത്താവ് അവരുടെ കൈകളിലൂടെ അടയാളങ്ങളും അത്ഭുതങ്ങളും സംഭവിക്കാൻ അനുവദിച്ചുകൊണ്ട് തന്റെ കൃപയുടെ വചനത്തിനു സാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നു.
  rationale: തിരുത്തൽ അർഥം മാറ്റുന്നില്ല. ഗ്രീക്കിലെ τῷ μαρτυροῦντι, διδόντι എന്നീ സമകാലിക പങ്കുപ്രയോഗങ്ങളുടെ തുടർച്ചയായ ബന്ധം മലയാളത്തിൽ ‘സാക്ഷ്യം വഹിച്ചുകൊണ്ടിരുന്നു,’ ‘അനുവദിച്ചുകൊണ്ട്’ എന്നിവയിലൂടെ വ്യക്തമായി നിലനിർത്തി. μὲν οὖν-ന്റെ തുറന്ന സംക്രമണബലം സംരക്ഷിക്കാൻ ‘അതിനാൽ’ എന്നതിനുപകരം ‘അങ്ങനെ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പിലെ ആദ്യ ബദൽപ്രയോഗം കൂടുതൽ സ്വാഭാവികമാക്കി.
