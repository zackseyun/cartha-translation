id: ACT.14.23
reference: Acts 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: ml
  text: ഓരോ സഭയിലും അവർക്കുവേണ്ടി മൂപ്പന്മാരെ നിയമിച്ചശേഷം[a], ഉപവാസത്തോടെ പ്രാർഥിച്ച്, അവർ വിശ്വസിച്ചിരുന്ന കർത്താവിന് അവരെ ഭരമേൽപ്പിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഓരോ സഭയിലും അവർക്കുവേണ്ടി മൂപ്പന്മാരെ തിരഞ്ഞെടുത്തശേഷം.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ചില സന്ദർഭങ്ങളിൽ കൈ ഉയർത്തിയുള്ള വോട്ടെടുപ്പിലൂടെ തിരഞ്ഞെടുക്കുക എന്ന അർഥമുണ്ടാകാം; എന്നാൽ ഇവിടെ അത് പൊതുവായി നിയമിക്കുക എന്നായിരിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “അവരെ” എന്നത് വിശ്വാസിസമൂഹത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നതിനുപകരം, പുതുതായി നിയമിക്കപ്പെട്ട മൂപ്പന്മാരെ പ്രത്യേകമായി സൂചിപ്പിക്കാനും സാധ്യതയുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: നിയമിച്ചശേഷം
  rationale: ക്രിയ ഇവിടെ തിരഞ്ഞെടുക്കുകയും ചുമതല ഏല്പിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൈ ഉയർത്തിയുള്ള വോട്ടെടുപ്പ് എന്ന പഴയ അർഥസാധ്യത വാക്യം നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ, സഭാഭരണരീതിയൊന്നും ഇറക്കുമതി ചെയ്യാത്ത ‘നിയമിച്ചു’ എന്ന പദം സ്വീകരിച്ചു.
- source_word: κατ’ ἐκκλησίαν
  choice: ഓരോ സഭയിലും
  rationale: κατά ഏകവചന നാമത്തോടുകൂടെ വിതരണാർഥത്തിൽ വരുന്നതിനാൽ, ഓരോ പ്രാദേശിക സഭയിലും എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρεσβυτέρους
  choice: മൂപ്പന്മാരെ
  rationale: ഇവിടെ പ്രായമേറിയ പുരുഷന്മാരെ പൊതുവായി അല്ല, സഭയിലെ അംഗീകൃത നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ-സഭാ പ്രയോഗത്തിൽ ‘മൂപ്പന്മാർ’ വ്യക്തവും പരിചിതവുമാണ്.
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: ഉപവാസത്തോടെ പ്രാർഥിച്ച്
  rationale: പ്രാർഥനയോടൊപ്പമുള്ള ഉപവാസത്തെ സ്വാഭാവിക മലയാളത്തിൽ രേഖപ്പെടുത്തുന്നു; ബഹുവചനമായ νηστειῶν ഇവിടെ ഉപവാസാചരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: παρέθεντο
  choice: സംരക്ഷണത്തിൽ ... ഏല്പിച്ചു
  rationale: ആളുകളെ മറ്റൊരാളുടെ കരുതലിന് ഭരമേല്പിക്കുക എന്ന മധ്യപ്രയോഗത്തിന്റെ വ്യക്തിപരവും ബന്ധപരവുമായ അർഥം നൽകുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിന്റെ സംരക്ഷണത്തിൽ
  rationale: παρατίθημι എന്ന ക്രിയയോടുള്ള ദത്തിവ് അവർ ആരുടെ കരുതലിൽ ഏല്പിക്കപ്പെട്ടുവെന്ന് കാണിക്കുന്നു; ‘കർത്താവ്’ κύριος എന്നതിന്റെ സ്ഥിരവും മാന്യവുമായ പരിഭാഷയാണ്.
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: അവർ വിശ്വസിച്ചിരുന്ന
  rationale: പൂർവപൂർണകാലം മുൻപ് ആരംഭിച്ച് നിലനിന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വിശ്വസിച്ചിരുന്ന’ ഈ കാലബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ബന്ധസർവനാമത്തിന്റെ പൂർവപദം കർത്താവാണ്.
- source_word: αὐτοῖς ... αὐτοὺς
  choice: അവർക്കുവേണ്ടി ... അവരെ
  rationale: ആദ്യ സർവനാമം സഭകളിലെ വിശ്വാസികളെ സൂചിപ്പിക്കുന്നു. രണ്ടാമത്തേതിന്റെ പൂർവപദം സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹമാകുന്നതാണ് കൂടുതൽ സ്വാഭാവികം; എങ്കിലും പുതുതായി നിയമിച്ച മൂപ്പന്മാർ എന്ന സാധ്യത നിലനിൽക്കുന്നതിനാൽ സർവനാമം തന്നെയും അടിക്കുറിപ്പും ഉപയോഗിച്ചു.
theological_decisions:
- issue: χειροτονήσαντες എന്ന പദവും സഭാഭരണക്രമവും
  choice: മൂപ്പന്മാരെ നിയമിച്ചു
  alternative: മൂപ്പന്മാരെ തിരഞ്ഞെടുത്തു / കൈ ഉയർത്തിയുള്ള വോട്ടിലൂടെ തിരഞ്ഞെടുത്തു
  rationale: പദത്തിന് കൈ ഉയർത്തിയുള്ള തിരഞ്ഞെടുപ്പുമായി ചരിത്രപരമായ ബന്ധമുണ്ടെങ്കിലും, ഈ സന്ദർഭം ഒരു നിർദിഷ്ട വോട്ടെടുപ്പ് രീതി ഉറപ്പിക്കുന്നില്ല. ‘നിയമിച്ചു’ തിരഞ്ഞെടുക്കലിന്റെ അടിസ്ഥാന ആശയം നൽകുകയും പ്രത്യേക സഭാഭരണ മാതൃക ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- issue: παρέθεντο αὐτοὺς എന്നതിലെ αὐτούς ആരെ സൂചിപ്പിക്കുന്നു
  choice: വിശ്വാസികളെയോ സഭാസമൂഹങ്ങളെയോ കർത്താവിന്റെ സംരക്ഷണത്തിൽ ഏല്പിച്ചു
  alternative: പുതുതായി നിയമിക്കപ്പെട്ട മൂപ്പന്മാരെ കർത്താവിന്റെ സംരക്ഷണത്തിൽ ഏല്പിച്ചു
  rationale: വിപുലമായ സന്ദർഭം ശിഷ്യന്മാരെയും സഭകളെയും ശക്തിപ്പെടുത്തുന്നതിനെക്കുറിച്ചാണ്; മുമ്പുള്ള αὐτοῖς വിശ്വാസിസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും വ്യാകരണപരവും സന്ദർഭപരവുമായി മൂപ്പന്മാർ എന്ന വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മൂപ്പന്മാർ’, ‘കർത്താവ്’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. ഗ്രീക്കിലെ രണ്ടു മുൻപ്രവർത്തനങ്ങളായ നിയമിക്കലും ഉപവാസത്തോടെയുള്ള പ്രാർഥനയും ക്രമമായി അവതരിപ്പിച്ചു; സഭാഭരണരീതിയെയും ‘അവരെ’ എന്ന സർവനാമത്തിന്റെ പൂർവപദത്തെയും കുറിച്ചുള്ള യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
