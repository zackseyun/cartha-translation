id: ACT.14.19
reference: Acts 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: ml
  text: എന്നാൽ അന്ത്യോഖ്യയിൽനിന്നും ഇക്കോന്യയിൽനിന്നും യഹൂദർ അവിടെയെത്തി. അവർ ജനക്കൂട്ടങ്ങളെ സമ്മതിപ്പിച്ച് പൗലോസിനെ കല്ലെറിഞ്ഞശേഷം, അദ്ദേഹം മരിച്ചുപോയെന്ന് കരുതി നഗരത്തിനു പുറത്തേക്കു വലിച്ചിഴച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അദ്ദേഹം മരിച്ചുകഴിഞ്ഞെന്ന് കരുതി.’ പൗലോസ് യഥാർഥത്തിൽ മരിച്ചുവെന്ന് ഗ്രീക്ക് പാഠം വ്യക്തമായി പറയുന്നില്ല; ആക്രമികൾ അങ്ങനെ കരുതിയെന്നാണ് അത് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: എന്നാൽ ... അവിടെയെത്തി
  rationale: δέ മുൻസന്ദർഭത്തിലെ അനുകൂല പ്രതികരണത്തിൽനിന്നുള്ള മൃദുവായ വിരുദ്ധ വഴിത്തിരിവ് സൂചിപ്പിക്കുന്നു; ἐπῆλθαν ശത്രുതയോടെ വന്നവരുടെ എത്തിച്ചേരലാണ് ഇവിടെ വിവരിക്കുന്നത്.
- source_word: ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι
  choice: അന്ത്യോഖ്യയിൽനിന്നും ഇക്കോന്യയിൽനിന്നും ചില യഹൂദർ
  rationale: സ്ഥലനാമങ്ങളും ജനവിഭാഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി അനിശ്ചിത ബഹുവചനത്തെ ‘ചില’ എന്നു പ്രകടമാക്കി; ഇത് എല്ലാവരെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്ന വായനയും ഒഴിവാക്കുന്നു.
- source_word: πείσαντες τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ വശത്താക്കി
  rationale: πείθω ഇവിടെ ജനക്കൂട്ടങ്ങളുടെ നിലപാട് തങ്ങളുടെ പക്ഷത്തേക്കു തിരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘വശത്താക്കി’ എന്നത് സന്ദർഭത്തിലെ പ്രതികൂല സ്വാധീനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ὄχλους എന്ന ബഹുവചനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: λιθάσαντες τὸν Παῦλον
  choice: പൗലോസിനെ കല്ലെറിഞ്ഞശേഷം
  rationale: കല്ലെറിഞ്ഞ പ്രവൃത്തി വലിച്ചിഴയ്ക്കലിനു മുമ്പാണെന്ന പങ്കുപദക്രമം വ്യക്തമായി നൽകുന്നു; മരണശിക്ഷ ഔപചാരികമായി നടപ്പാക്കിയെന്ന അധിക സൂചന ചേർക്കുന്നില്ല.
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: നഗരത്തിനു പുറത്തേക്കു വലിച്ചിഴച്ചു
  rationale: σύρω സൂചിപ്പിക്കുന്ന ബലപ്രയോഗവും അപമാനകരമായ വലിച്ചുകൊണ്ടുപോകലും ‘വലിച്ചിഴച്ചു’ വ്യക്തമായി നൽകുന്നു; ലക്ഷ്യസ്ഥാനം ‘പുറത്തേക്കു’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: അദ്ദേഹം മരിച്ചുപോയെന്ന് കരുതി
  rationale: νομίζοντες ആക്രമികളുടെ അനുമാനമാണ് രേഖപ്പെടുത്തുന്നത്; τεθνηκέναι മരണം സംഭവിച്ചുകഴിഞ്ഞതിന്റെ ഫലാവസ്ഥ സൂചിപ്പിക്കുന്നു. ‘മരിച്ചുപോയെന്ന് കരുതി’ യഥാർത്ഥത്തിൽ അദ്ദേഹം മരിച്ചുവെന്ന് വാക്യം ഉറപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസ് യഥാർത്ഥത്തിൽ മരിച്ചുവോ, ആക്രമികൾ അങ്ങനെ കരുതുക മാത്രമായിരുന്നോ
  choice: 'പ്രധാനപാഠം ആക്രമികളുടെ ധാരണ മാത്രം പറയുന്നു: ‘അദ്ദേഹം മരിച്ചുപോയെന്ന് കരുതി.’'
  alternative: പൗലോസ് യഥാർത്ഥത്തിൽ മരിക്കുകയും പിന്നീട് ജീവൻ പ്രാപിക്കുകയും ചെയ്തുവെന്ന് ചിലർ അനുമാനിക്കുന്നു.
  rationale: νομίζοντες എന്ന ഗ്രീക്ക് പദം അവരുടെ അനുമാനത്തെ മാത്രമാണ് വ്യക്തമാക്കുന്നത്; പൗലോസിന്റെ യഥാർത്ഥ മരണം ഈ വാക്യം നേരിട്ട് പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലുള്ള ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘ജനക്കൂട്ടങ്ങൾ’ എന്ന ബഹുവചനവും സംഭവക്രമവും മൂലപാഠത്തെ അനുസരിച്ച് നിലനിർത്തി. ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചെങ്കിലും പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ ചേർത്തിട്ടില്ല.
