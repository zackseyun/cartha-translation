revisions:
- from: 'എന്നിട്ടും, നന്മ ചെയ്തുകൊണ്ട് അവൻ തന്നെക്കുറിച്ച് സാക്ഷ്യമില്ലാത്തവനായി തന്നെ വിട്ടില്ല[a]: ആകാശത്തുനിന്ന് നിങ്ങൾക്കു മഴയും ഫലസമൃദ്ധമായ കാലങ്ങളും നൽകി, ആഹാരവും ആനന്ദവുംകൊണ്ട് നിങ്ങളുടെ ഹൃദയങ്ങളെ നിറച്ചു[b].'
  to: 'എന്നിരുന്നാലും, നന്മ ചെയ്തുകൊണ്ട്, അവൻ തന്നെക്കുറിച്ചുള്ള സാക്ഷ്യമില്ലാതെ തന്നെ വിട്ടില്ല[a]: സ്വർഗത്തിൽനിന്ന് നിങ്ങൾക്കു മഴയും ഫലസമൃദ്ധമായ കാലങ്ങളും നൽകി, ആഹാരവും സന്തോഷവുംകൊണ്ട് നിങ്ങളുടെ ഹൃദയങ്ങളെ നിറച്ചു[b].'
  rationale: 'തിരുത്തൽ രണ്ട് കാര്യങ്ങൾ പരിഹരിക്കുന്നു: ഗ്രീക്കിലെ പ്രത്യാവർത്തക “തന്നെത്തന്നെ” ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി ആക്കുന്നു; οὐρανόθεν-ന്റെ “from heaven” എന്ന മൂലപാഠഭാവം “സ്വർഗത്തിൽനിന്ന്” എന്നതിലൂടെ നിലനിർത്തുന്നു. പാഠഭേദക്കുറിപ്പിന്റെ ആങ്കറും SBLGNT വായനയും മാറ്റമില്ലാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.'
