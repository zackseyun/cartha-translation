id: ACT.14.17
reference: Acts 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: ml
  text: 'എന്നിരുന്നാലും, നന്മ ചെയ്തുകൊണ്ട്, അവൻ തന്നെക്കുറിച്ചുള്ള സാക്ഷ്യമില്ലാതെ തന്നെ വിട്ടില്ല[a]: സ്വർഗത്തിൽനിന്ന് നിങ്ങൾക്കു മഴയും ഫലസമൃദ്ധമായ കാലങ്ങളും നൽകി, ആഹാരവും സന്തോഷവുംകൊണ്ട് നിങ്ങളുടെ ഹൃദയങ്ങളെ നിറച്ചു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തന്നെക്കുറിച്ച് സാക്ഷ്യമില്ലാതെ ഇരുന്നില്ല.”
    reason: ഗ്രീക്കിലെ “തന്നെ സാക്ഷ്യമില്ലാതെ വിട്ടില്ല” എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള പകരം നൽകുന്നു.
  - marker: b
    text: ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ “നമ്മുടെ ഹൃദയങ്ങളെ” എന്നാണ്; SBLGNT-യിൽ “നിങ്ങളുടെ ഹൃദയങ്ങളെ” എന്നാണ്.
    reason: ὑμῶν/ἡμῶν എന്ന സർവനാമത്തിലെ പ്രസക്തമായ പാഠഭേദം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: καίτοι
  choice: എന്നിട്ടും
  rationale: മുൻവാക്യത്തോടുള്ള വിട്ടുവീഴ്ചാസൂചകമായ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀμάρτυρον
  choice: സാക്ഷ്യമില്ലാത്തവനായി
  rationale: ദൈവം തന്നെക്കുറിച്ച് സാക്ഷ്യം നൽകാതെ ഇരുന്നില്ല എന്ന സാക്ഷ്യ/സാക്ഷീകരണ ഭാവം നിലനിർത്തുന്നു; ‘തെളിവ്’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: αὑτὸν
  choice: തന്നെക്കുറിച്ച് … തന്നെ
  rationale: ഗ്രീക്കിലെ പ്രത്യാവർത്തക ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും സാക്ഷ്യം ദൈവത്തെക്കുറിച്ചാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀφῆκεν
  choice: വിട്ടില്ല
  rationale: ഒരു അവസ്ഥയിൽ വിട്ടുകളയുക എന്ന ഇവിടത്തെ അർഥം സംക്ഷിപ്തമായും കൃത്യമായും നൽകുന്നു.
- source_word: ἀγαθουργῶν
  choice: നന്മ ചെയ്തുകൊണ്ട്
  rationale: ദൈവത്തിന്റെ സജീവമായ ഉപകാരം സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: οὐρανόθεν
  choice: ആകാശത്തുനിന്ന്
  rationale: മഴയുടെ ദൃശ്യമായ ഉറവിടം സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; ‘സ്വർഗത്തിൽനിന്ന്’ എന്നും വിവർത്തനം സാധ്യമെങ്കിലും മലയാളത്തിൽ അത് പരലോകത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം.
- source_word: ὑετοὺς
  choice: മഴ
  rationale: ഗ്രീക്കിൽ ബഹുവചനമാണെങ്കിലും മലയാളത്തിൽ എണ്ണാനാവാത്ത പൊതുനാമമായ ‘മഴ’ ഈ സന്ദർഭത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്; ആവർത്തിച്ചുള്ള മഴകളുടെ ആശയം ഉൾക്കൊള്ളുന്നു.
- source_word: καιροὺς καρποφόρους
  choice: ഫലസമൃദ്ധമായ കാലങ്ങൾ
  rationale: καιροί എന്നതിന്റെ കാലഘട്ടഭാവവും καρποφόρους എന്നതിന്റെ വിളവേകുന്ന സമൃദ്ധിയും സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: ἐμπιπλῶν
  choice: നിറച്ചു
  rationale: ആഹാരവും ആനന്ദവും സമൃദ്ധമായി നൽകുന്ന പ്രവൃത്തിയെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: τροφῆς
  choice: ആഹാരം
  rationale: സന്ദർഭത്തിലെ പോഷണവും ഭക്ഷണവും വ്യക്തമാക്കുന്ന dignified, പൊതുവായ മലയാളപദം.
- source_word: εὐφροσύνης
  choice: ആനന്ദം
  rationale: സന്തോഷപൂർണമായ ആഹ്ലാദം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: SBLGNT-യിലെ രണ്ടാംപുരുഷ ബഹുവചന വായന നേരിട്ട് പിന്തുടരുന്നു; ഹൃദയം എന്ന ബൈബിൾസങ്കൽപ്പത്തിന്റെ സമഗ്ര അന്തർജീവിതഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിയിലൂടെയും പരിപാലനത്തിലൂടെയും ദൈവം നൽകുന്ന സാക്ഷ്യം
  choice: മഴ, ഫലസമൃദ്ധമായ കാലങ്ങൾ, ആഹാരം, ആനന്ദം എന്നീ നന്മകളിലൂടെ ദൈവം തന്നെക്കുറിച്ച് സാക്ഷ്യം നൽകിയതായി വിവർത്തനം ചെയ്യുന്നു.
  alternative: ഇവയെ ദൈവശാസ്ത്രപരമായ സൂചനയില്ലാത്ത പ്രകൃതിപ്രക്രിയകളായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: αὑτὸν, ἀμάρτυρον എന്നീ പദങ്ങളും ദൈവത്തിന്റെ പ്രവൃത്തികളെ വിവരിക്കുന്ന കൃദന്തരൂപങ്ങളും ഈ നന്മകളെ ദൈവം തന്നെക്കുറിച്ച് നൽകുന്ന സാക്ഷ്യമായി അവതരിപ്പിക്കുന്നു; അതിലപ്പുറം ഒരു സമ്പൂർണ സിദ്ധാന്തസംവിധാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ നീണ്ട ഗ്രീക്ക് ഘടന വായനാസൗകര്യത്തിനായി ദ്വിബിന്ദുവിലൂടെ ക്രമപ്പെടുത്തി. കാർഷികസന്ദർഭത്തിലെ സമൃദ്ധിയും ദൈവത്തിന്റെ പരിപാലനസാക്ഷ്യവും നിലനിർത്തി; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദാവലി ഒഴിവാക്കി.
