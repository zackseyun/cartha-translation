  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: ml
  text: എന്നാൽ വിശ്വസിക്കാൻ വിസമ്മതിച്ച യെഹൂദന്മാർ യെഹൂദേതരരെ ഇളക്കിവിടുകയും സഹോദരന്മാർക്കെതിരെ യെഹൂദേതരരുടെ മനസ്സുകളെ വിഷലിപ്തമാക്കുകയും ചെയ്തു[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അനുസരിക്കാതിരുന്ന.’ സുവിശേഷസന്ദേശം വിശ്വസിക്കാൻ വിസമ്മതിക്കുന്നതും അതിനോട് അനുസരിക്കാതിരിക്കുന്നതും ഈ ഗ്രീക്ക് പദത്തിന് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം, ‘അവരുടെ ആത്മാക്കളെ’; ഇവിടെ അവരുടെ ആന്തരിക മനോഭാവമോ സമീപനമോ ആണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നത് സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: വിശ്വസിക്കാൻ വിസമ്മതിച്ച
  rationale: സുവിശേഷസന്ദർഭത്തിൽ ഈ പദം പൊതുവായ അനുസരണക്കേടിനെക്കാൾ സന്ദേശം വിശ്വസിക്കാൻ മനപ്പൂർവം വിസമ്മതിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ; ഇവിടെ സന്ദർഭം സൂചിപ്പിക്കുന്നത് സ്ഥലത്തെ എതിർത്ത ഒരു വിഭാഗത്തെയാണ്, എല്ലാ യെഹൂദരെയുമല്ല.
- source_word: ἐπήγειραν
  choice: ഇളക്കിവിട്ട്
  rationale: മറ്റുള്ളവരിൽ ശത്രുത ഉണർത്തി പ്രേരിപ്പിച്ചു എന്ന കാരകഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκάκωσαν
  choice: വിഷം കലർത്തി
  rationale: ψυχάς എന്ന കർമപദത്തോടും κατὰ എന്ന വിരുദ്ധദിശയോടും ചേർന്ന് ഉള്ളിലെ മനോഭാവം ദുഷിപ്പിച്ചു എന്ന രൂപകാർഥം വ്യക്തമാക്കുന്നു.
- source_word: τὰς ψυχὰς
  choice: അവരുടെ മനസ്സുകളിൽ
  rationale: അക്ഷരാർഥം ‘ആത്മാക്കൾ’ എന്നാണെങ്കിലും ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആന്തരിക മനോഭാവവും സമീപനവുമാണ്.
- source_word: τῶν ἐθνῶν
  choice: യെഹൂദേതരരെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ യെഹൂദർ–ജാതികൾ എന്ന വ്യത്യാസത്തിൽ, യെഹൂദരല്ലാത്ത ആളുകളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഇത് വ്യക്തമാണ്.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: സഹോദരന്മാർക്കെതിരെ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനരൂപം നിലനിർത്തുന്നു; ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിൽ ഇത് വിശ്വാസിസമൂഹത്തെ പൊതുവായി ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφῶν എന്ന പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാവുന്നത്
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: മുഖ്യവാചകത്തിൽ ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനരൂപം സംരക്ഷിക്കുകയും, അതിന്റെ സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന സമൂഹാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനസ്സുകളിൽ വിഷം കലർത്തി’ എന്ന പ്രയോഗം മൂലത്തിലെ ആന്തരിക മനോഭാവം ദുഷിപ്പിക്കൽ എന്ന ശക്തമായ രൂപകാർഥം നിലനിർത്തുന്നു.
