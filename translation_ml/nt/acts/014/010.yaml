source:
  edition: SBLGNT
  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: ml
  text: 'അവൻ ഉച്ചത്തിൽ പറഞ്ഞു: “നിന്റെ കാലുകളിൽ നിവർന്നു നിൽക്കുക.” അപ്പോൾ അയാൾ ചാടിയെഴുന്നേറ്റ് നടക്കാൻ തുടങ്ങി.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചാടിയെഴുന്നേറ്റ് നടന്നുകൊണ്ടിരുന്നു.” അവസാനത്തെ ക്രിയ അപൂർണഭൂതകാലത്തിലാണ്; അത് തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെയോ നടക്കാൻ തുടങ്ങിയതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: ഉച്ചത്തിൽ
  rationale: രീതിയെ സൂചിപ്പിക്കുന്ന ദത്തിവ് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἀνάστηθι
  choice: നിൽക്കുക
  rationale: തുടർന്നുവരുന്ന ‘നിന്റെ കാലുകളിൽ’ എന്നും ὀρθός എന്നും ഉള്ള ഘടകങ്ങളോടൊപ്പം, എഴുന്നേറ്റ് നേരെ നിൽക്കാനുള്ള കല്പനയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐπὶ τοὺς πόδας σου
  choice: നിന്റെ കാലുകളിൽ
  rationale: ശരീരഭാരം സ്വന്തം കാലുകളിൽ താങ്ങി നിൽക്കുന്നതിനെ നേരിട്ടും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: ὀρθός
  choice: നിവർന്നു
  rationale: നേരായ, കുത്തനെയുള്ള ശരീരനിലയെ സാധാരണ മലയാളത്തിൽ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἥλατο
  choice: ചാടിയെഴുന്നേറ്റ്
  rationale: ἅλλομαι എന്ന ക്രിയയിലെ പെട്ടെന്നുള്ള ചാട്ടത്തിന്റെ ദൃശ്യവൈഭവവും സന്ദർഭത്തിലെ എഴുന്നേൽപ്പും ഒരുമിച്ച് പകർത്തുന്നു.
- source_word: περιεπάτει
  choice: നടക്കാൻ തുടങ്ങി
  rationale: അപൂർണഭൂതകാലരൂപത്തെ സന്ദർഭത്തിൽ ആരംഭാർഥകമായി അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള പ്രവർത്തനത്തിന്റെ തുടക്കം ഇതിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: അത്ഭുതവും ശരീരനിലയ്ക്കുള്ള കല്പനയും
  choice: കല്പനയും അതിനെത്തുടർന്നുള്ള ശാരീരിക പ്രതികരണവും തൽക്ഷണ സംഭവങ്ങളായി നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  alternative: രോഗശാന്തിയുടെ ദൈവശാസ്ത്രപരമായ അർഥം വിശദീകരിക്കുന്ന വാക്കുകൾ ചേർക്കുക.
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായ കല്പനയും ഉടനെയുള്ള ദൃശ്യപ്രതികരണവും മാത്രം വിവരിക്കുന്നു; അതിലപ്പുറമുള്ള വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘നിവർന്നു നിൽക്കുക’ കല്പനയുടെ ഭൗതിക വ്യക്തത നിലനിർത്തുന്നു; അപൂർണഭൂതകാലത്തിന്റെ യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
