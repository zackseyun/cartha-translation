id: ACT.14.1
reference: Acts 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: ml
  text: ഇക്കോന്യയിൽ അവർ ഒരുമിച്ച് യെഹൂദന്മാരുടെ സിനഗോഗിൽ പ്രവേശിച്ച് അങ്ങനെ സംസാരിച്ചു; അതിന്റെ ഫലമായി യെഹൂദന്മാരിലും ഗ്രീക്കുകാരിലും പെട്ട വലിയൊരു ജനക്കൂട്ടം വിശ്വസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദ സിനഗോഗിൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘യെഹൂദന്മാരുടെ സിനഗോഗിൽ’ എന്നാണ്.
    reason: ‘യെഹൂദന്മാരുടെ സിനഗോഗ്’ എന്ന ഗ്രീക്ക് ബന്ധപ്രയോഗത്തിന് സ്വാഭാവികമായ മറ്റൊരു മലയാള രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവികമായ ആഖ്യാനവാക്യം
  rationale: ഇത് ഇവിടെ സംഭവത്തെ ഊന്നുന്ന പ്രയോഗത്തേക്കാൾ ആഖ്യാനത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ഘടനയാണ്. മൂലത്തിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചന ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: ἐν Ἰκονίῳ
  choice: ഇക്കോന്യയിൽ
  rationale: സ്ഥലനാമം മലയാളലിപിയിൽ സ്വാഭാവികമായി ലിപ്യന്തരിച്ചു; ἐν എന്ന സ്ഥലസൂചന ‘-യിൽ’കൊണ്ട് വ്യക്തമാക്കി.
- source_word: κατὰ τὸ αὐτό
  choice: ഒരുമിച്ച്
  rationale: പൗലോസിന്റെയും ബർന്നബാസിന്റെയും സംയുക്തപ്രവർത്തനമാണ് ഈ പ്രയോഗം സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: εἰσελθεῖν αὐτοὺς
  choice: അവർ ... പ്രവേശിച്ച്
  rationale: ἐγένετο എന്ന ആഖ്യാനഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃവാക്യമായി മാറ്റി; തുടർന്നുള്ള λαλῆσαιയുമായി ബന്ധിപ്പിച്ചു.
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ സിനഗോഗിൽ
  rationale: τῶν Ἰουδαίων എന്ന ബന്ധത്തെ വ്യക്തമായി നിലനിർത്തി. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ പദം യെഹൂദ ആരാധനാസ്ഥലത്തിന്റെ ചരിത്രപരമായ പ്രത്യേകത സംരക്ഷിക്കുന്നു.
- source_word: λαλῆσαι
  choice: സംസാരിച്ചു
  rationale: പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കം മൂലവാക്യത്തിൽ വ്യക്തമാക്കാത്തതിനാൽ ‘പ്രസംഗിച്ചു’ അല്ലെങ്കിൽ ‘സന്ദേശം അറിയിച്ചു’ എന്ന അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- source_word: οὕτως ὥστε
  choice: അതിന്റെ ഫലമായി
  rationale: ഇവിടെ സംസാരിച്ച രീതിയെയും അതിൽനിന്നുണ്ടായ ഫലത്തെയും ബന്ധിപ്പിക്കുന്ന ഘടനയാണ്. മലയാളത്തിൽ ഫലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിച്ചു; സംസാരത്തിന്റെ ഗുണത്തെ അനാവശ്യമായി വിശദീകരിച്ചിട്ടില്ല.
- source_word: πιστεῦσαι
  choice: വിശ്വസിച്ചു
  rationale: πιστ- പദകുടുംബത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; വിശ്വാസത്തിന്റെ പരോക്ഷ കർമം മൂലത്തിൽ പറയാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: യെഹൂദന്മാരിലും ഗ്രീക്കുകാരിലുംപെട്ട
  rationale: τε καὶ ഉൾക്കൊള്ളുന്ന ഇരുകൂട്ടരെയും വ്യക്തമായി സൂചിപ്പിക്കുകയും πολὺ πλῆθος എന്ന ഏക കൂട്ടനാമവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πολὺ πλῆθος
  choice: ഒരു വലിയ ജനക്കൂട്ടം
  rationale: വലിയ എണ്ണത്തെയും കൂട്ടത്തെയും സൂചിപ്പിക്കുന്ന മൂലപ്രയോഗത്തിന്റെ ഭാരം സാധാരണ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആഖ്യാനപരമായ മാനസാന്തരസന്ദർഭത്തിൽ πιστεῦσαι എന്നതിന്റെ അർഥം
  choice: വിശ്വസിച്ചു
  alternative: വിശ്വാസത്തിലേക്കു വന്നു; സന്ദേശം വിശ്വസിച്ചു
  rationale: ക്രിയ ഇവിടെ അപ്പൊസ്തലന്മാരുടെ സംസാരത്തോടുള്ള പ്രതികരണം റിപ്പോർട്ട് ചെയ്യുന്നു. എന്നാൽ വിശ്വാസത്തിന്റെ കർമം മൂലത്തിൽ പ്രകടമല്ല; അതിനാൽ ‘സന്ദേശം’ എന്നത് ചേർക്കാതെയും ‘വിശ്വാസത്തിലേക്കു വന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം സ്വീകരിക്കാതെയും അടിസ്ഥാന അർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ ആഖ്യാനഗതി സ്വാഭാവികമാക്കിക്കൊണ്ട് മൂലത്തിലെ സംയുക്തപ്രവർത്തനം, ഫലബന്ധം, ഇരുകൂട്ടരുടെയും ഉൾപ്പെടുത്തൽ എന്നിവ സംരക്ഷിച്ചു. ‘സിനഗോഗ്’ ചരിത്രപരമായ സ്ഥാപനപദമായി നിലനിർത്തി.
