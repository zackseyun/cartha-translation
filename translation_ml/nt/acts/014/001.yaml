revisions:
- from: ഇക്കോന്യയിൽ അവർ ഒരുമിച്ച് യെഹൂദന്മാരുടെ സിനഗോഗിൽ പ്രവേശിച്ച് സംസാരിച്ചു; അതിന്റെ ഫലമായി യെഹൂദന്മാരിലും ഗ്രീക്കുകാരിലുംപെട്ട ഒരു വലിയ ജനക്കൂട്ടം വിശ്വസിച്ചു.[a]
  to: ഇക്കോന്യയിൽ അവർ ഒരുമിച്ച് യെഹൂദന്മാരുടെ സിനഗോഗിൽ പ്രവേശിച്ച് അങ്ങനെ സംസാരിച്ചു; അതിന്റെ ഫലമായി യെഹൂദന്മാരിലും ഗ്രീക്കുകാരിലും പെട്ട വലിയൊരു ജനക്കൂട്ടം വിശ്വസിച്ചു.[a]
  rationale: The revision explicitly renders οὕτως with ‘അങ്ങനെ’ while retaining the result relation with ‘അതിന്റെ ഫലമായി.’ It also makes the group expression more readable through standard word spacing. No theological or interpretive expansion has been introduced.
