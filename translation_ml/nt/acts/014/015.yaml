id: ACT.14.15
reference: Acts 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: ml
  text: 'ഇങ്ങനെ പറഞ്ഞുകൊണ്ട്: “പുരുഷന്മാരേ, നിങ്ങൾ എന്തിനാണ് ഈ കാര്യങ്ങൾ ചെയ്യുന്നത്? ഞങ്ങളും നിങ്ങളെപ്പോലെ മനുഷ്യരാണ്[a]. ഈ വ്യർഥകാര്യങ്ങളിൽനിന്ന് ജീവനുള്ള ദൈവത്തിലേക്കു നിങ്ങൾ തിരിയേണ്ടതിന് ഞങ്ങൾ നിങ്ങളോടു സുവാർത്ത അറിയിക്കുകയാണ്. അവിടുന്ന് സ്വർഗവും[c] ഭൂമിയും സമുദ്രവും അവയിലുള്ള സകലവും ഉണ്ടാക്കിയവനാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടേതുപോലെയുള്ള മനുഷ്യാവസ്ഥ പങ്കിടുന്ന മനുഷ്യർ.” പൗലോസും ബർന്നബാസും ശ്രോതാക്കളെപ്പോലെതന്നെ മനുഷ്യരാണെന്നാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ആകാശം.” ഗ്രീക്കിൽ ഏകവചനമാണ്; തിരുവെഴുത്തിലെ പരിചിതമായ സൃഷ്ടിവിവരണ ശൈലിയാണ് ഇവിടെ പ്രതിധ്വനിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: പുരുഷന്മാരേ
  rationale: ആൺജനക്കൂട്ടത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ἀνήρ എന്ന പദത്തിന്റെ സംബോധന ബഹുവചനം ലിംഗസൂചന നഷ്ടപ്പെടുത്താതെ നൽകുന്നു.
- source_word: ὁμοιοπαθεῖς … ἄνθρωποι
  choice: നിങ്ങളെപ്പോലെതന്നെയുള്ള മനുഷ്യർ
  rationale: പൗലോസും ബർന്നബാസും ദൈവികരല്ലെന്നും ശ്രോതാക്കളുടേതുപോലെയുള്ള മനുഷ്യാവസ്ഥ പങ്കിടുന്നവരാണെന്നും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐαγγελιζόμενοι
  choice: സുവാർത്തയാണ് ഞങ്ങൾ നിങ്ങളോട് അറിയിക്കുന്നത്
  rationale: പിന്നാലെയുള്ള ἐπιστρέφειν എന്ന ക്രിയയുടെ ആഹ്വാനാത്മക ഉള്ളടക്കത്തോടൊപ്പം സുവാർത്ത അറിയിക്കുന്ന പ്രവൃത്തിയെ സുതാര്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ματαίων
  choice: വ്യർഥകാര്യങ്ങൾ
  rationale: വിഗ്രഹങ്ങൾ എന്നു പരിമിതപ്പെടുത്താതെ, ഫലശൂന്യവും മൂല്യമില്ലാത്തതുമായ പുറജാതീയ ആരാധനയും അനുബന്ധ പ്രവൃത്തികളും ഉൾക്കൊള്ളുന്ന വിശാലമായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: ജീവനുള്ള ദൈവത്തിലേക്കു നിങ്ങൾ തിരിയണം
  rationale: ἐπί സഹിതമുള്ള ദിശയും നിർജീവമായ ആരാധനാവസ്തുക്കളോടുള്ള ‘ജീവനുള്ള ദൈവം’ എന്ന വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἐποίησεν
  choice: ഉണ്ടാക്കിയ
  rationale: സൃഷ്ടികർമ്മത്തെ സൂചിപ്പിക്കുന്ന ποιέωയുടെ നേരായ അർഥം നൽകുകയും വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν οὐρανὸν
  choice: ആകാശം
  rationale: സൃഷ്ടിപ്പട്ടികയിലെ ഏകവചന οὐρανός എന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളസമാനം; ‘സ്വർഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: അവയിലുള്ള സകലവും
  rationale: ആകാശം, ഭൂമി, സമുദ്രം എന്നിവയിൽ ഉള്ള എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെയും ബർന്നബാസിന്റെയും മാനുഷിക നില
  choice: ഞങ്ങളും നിങ്ങളെപ്പോലെതന്നെയുള്ള മനുഷ്യരാണ്
  alternative: ഞങ്ങളും നിങ്ങളുടേതുപോലെയുള്ള സ്വഭാവമുള്ള മനുഷ്യരാണ്
  rationale: അപ്പൊസ്തലന്മാർ ദൈവികരാണെന്ന ധാരണ നിരസിക്കുന്ന ഊന്നൽ നിലനിർത്തുന്നു; അതേസമയം ὁμοιοπαθεῖς എന്നത് വികാരസാമ്യം മാത്രമാണെന്ന് ചുരുക്കുന്നില്ല.
- issue: ‘വ്യർഥകാര്യങ്ങൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: വിഗ്രഹങ്ങൾ എന്നു വ്യക്തമാക്കാതെ വിശാലമായ പ്രയോഗം പ്രധാനപാഠത്തിൽ നിലനിർത്തുക
  alternative: വിഗ്രഹങ്ങൾ
  rationale: സന്ദർഭത്തിൽ വിഗ്രഹാരാധനയാണ് മുഖ്യം; എങ്കിലും ഗ്രീക്കിൽ വിഗ്രഹം എന്ന പ്രത്യേക നാമമല്ല, വിശാലമായ മൂല്യനിർണയ പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
- issue: സൃഷ്ടികർത്താവിനെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ വ്യാപ്തി
  choice: ആകാശവും ഭൂമിയും സമുദ്രവും അവയിലുള്ള സകലവും ഉണ്ടാക്കിയവൻ
  alternative: ആകാശങ്ങളെയും ഭൂമിയെയും സൃഷ്ടിച്ചവൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും മൂന്നു മേഖലകളടങ്ങിയ സമ്പൂർണ പട്ടികയും ആവർത്തിച്ച καί ബന്ധകങ്ങളും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സംബോധനയിലെ ലിംഗസൂചനയും സൃഷ്ടിപ്പട്ടികയിലെ ആവർത്തിച്ച ബന്ധകങ്ങളും നിലനിർത്തി; സാങ്കേതിക സഭാപദങ്ങൾ പരമാവധി ഒഴിവാക്കി.
