  text: καὶ διελθόντες τὴν Πισιδίαν ἦλθον εἰς ⸀τὴν Παμφυλίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: ml
  text: അവർ പിസിദ്യയിലൂടെ കടന്നുപോയശേഷം പംഫുല്യയിൽ എത്തി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελθόντες
  choice: കടന്നുപോയശേഷം
  rationale: διέρχομαι എന്ന ക്രിയയുടെ aorist active participle മുഖ്യക്രിയയായ ἦλθον-നു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കടന്നുപോയശേഷം’ ഈ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν Πισιδίαν
  choice: പിസിദ്യയിലൂടെ
  rationale: പ്രദേശനാമം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു; διέρχομαι-യുടെ സഞ്ചാരപഥം സൂചിപ്പിക്കാൻ ‘-യിലൂടെ’ ചേർത്തു.
- source_word: ἦλθον
  choice: എത്തി
  rationale: ἔρχομαι ഇവിടെ യാത്രയുടെ ലക്ഷ്യസ്ഥാനത്തെത്തുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ‘എത്തി’ മലയാള യാത്രാവിവരണത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: εἰς τὴν Παμφυλίαν
  choice: പംഫുല്യയിൽ
  rationale: εἰς ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്നു. ‘പംഫുല്യയിൽ എത്തി’ എന്ന പ്രയോഗം ആ ദിശാഗത അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: καὶ യാത്രാവിവരണം തുടരുന്ന ലളിതമായ സംയോജകമാണ്. ഒറ്റ വാക്യമായി ഉദ്ധരിക്കുമ്പോൾ തുടക്കത്തിലെ ‘കൂടാതെ/പിന്നെ’ അസ്വാഭാവികമാകുന്നതിനാൽ മലയാളത്തിലെ വാക്യക്രമത്തിലൂടെ തുടർച്ചാഭാവം നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ യാത്രാവിവരണ ശൈലി. സ്ഥലനാമങ്ങൾ മൂലഗ്രീക്കിനോട് ചേർന്ന് മലയാളലിപിയിൽ നൽകിയിരിക്കുന്നു.
