id: ACT.14.22
reference: Acts 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: ml
  text: ശിഷ്യരുടെ മനസ്സുകളെ ഉറപ്പിക്കുകയും വിശ്വാസത്തിൽ നിലനിൽക്കാൻ അവരെ പ്രോത്സാഹിപ്പിക്കുകയും, “അനേകം കഷ്ടതകളിലൂടെ നാം ദൈവരാജ്യത്തിൽ പ്രവേശിക്കേണ്ടതാണ്” എന്നു പറയുകയും ചെയ്തു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: ഉറപ്പിക്കുകയും
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ശക്തിപ്പെടുത്തൽ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഔപചാരിക സ്ഥാപനമെന്ന അധിക അർഥം ചേർക്കുന്നില്ല.
- source_word: τὰς ψυχὰς
  choice: മനസ്സുകളെ
  rationale: ഇവിടെ ശിഷ്യരുടെ ആന്തരികജീവിതത്തെയും വ്യക്തിത്വത്തെയും സൂചിപ്പിക്കുന്നു. ‘ആത്മാക്കളെ’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായ ശരീരം–ആത്മാവ് ദ്വൈതവായനയ്ക്ക് ഇടയാക്കാം; ‘മനസ്സുകളെ’ സന്ദർഭത്തിലെ ആന്തരിക ദൃഢീകരണം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τῶν μαθητῶν
  choice: ശിഷ്യരുടെ
  rationale: യേശുവിനെ അനുഗമിക്കുന്ന പ്രതിബദ്ധരായ അനുയായികൾക്കുള്ള സ്ഥാപിതവും വ്യക്തവുമായ പുതിയനിയമ പദം.
- source_word: παρακαλοῦντες
  choice: പ്രോത്സാഹിപ്പിക്കുകയും
  rationale: ആശ്വസിപ്പിക്കൽ മുതൽ ആഹ്വാനംവരെ ഉൾക്കൊള്ളുന്ന പദമാണിത്; ഇവിടെ നിലനിൽക്കാനുള്ള പിന്തുണയോടുകൂടിയ ആഹ്വാനം ‘പ്രോത്സാഹിപ്പിക്കുക’ നന്നായി നൽകുന്നു.
- source_word: ἐμμένειν
  choice: നിലനിൽക്കാൻ
  rationale: ഒരു നിലപാടിലോ ബന്ധത്തിലോ തുടർന്നുനിൽക്കുക എന്ന അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: ഗ്രീക്കിലെ നിർദേശക ലേഖനം സന്ദർഭത്തിൽ ക്രിസ്തീയ വിശ്വാസത്തെ നിർദിഷ്ടമായി സൂചിപ്പിക്കാമെങ്കിലും, മലയാളത്തിൽ ‘വിശ്വാസത്തിൽ’ എന്ന പ്രയോഗം തന്നെ ആ സന്ദർഭനിർദിഷ്ടത സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: διὰ πολλῶν θλίψεων
  choice: അനേകം കഷ്ടതകളിലൂടെ
  rationale: സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളുന്ന θλῖψις എന്ന പദത്തിന്റെ ഗൗരവം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δεῖ ἡμᾶς
  choice: നാം ... പ്രവേശിക്കേണ്ടതാണ്
  rationale: അവശ്യകതയുടെ ശക്തി നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ കാരണം പാഠത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിക്കുന്നില്ല.
- source_word: εἰσελθεῖν εἰς
  choice: പ്രവേശിക്കുക
  rationale: ലക്ഷ്യസ്ഥാനത്തിലേക്കുള്ള പ്രവേശനം മലയാളത്തിലെ സകർമക പ്രയോഗത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: βασιλείαയുടെ രാജ്യം/ഭരണം എന്നീ മാനങ്ങൾ തുറന്നുവെക്കുന്ന, സ്ഥാപിതവും സാധാരണക്കാർക്ക് വ്യക്തവുമായ പ്രയോഗം.
theological_decisions:
- issue: τῇ πίστει എന്നതിന്റെ നിർദിഷ്ടത
  choice: വിശ്വാസത്തിൽ
  alternative: ആ വിശ്വാസത്തിൽ
  rationale: ലേഖനം നിർദിഷ്ടമായ ക്രിസ്തീയ വിശ്വാസത്തെ സൂചിപ്പിക്കാമെങ്കിലും മലയാളത്തിൽ ‘ആ’ ചേർക്കുന്നത് മുൻപ് പരാമർശിച്ച ഒരു പ്രത്യേക വിശ്വാസത്തെ അനാവശ്യമായി സൂചിപ്പിക്കും. സന്ദർഭം നിർദിഷ്ടത നൽകുന്നതിനാൽ ലളിതരൂപം അർഥസമ്മർദം സംരക്ഷിക്കുന്നു.
- issue: δεῖ സൂചിപ്പിക്കുന്ന അവശ്യകത
  choice: നാം ... പ്രവേശിക്കേണ്ടതാണ്
  alternative: നാം ... പ്രവേശിക്കണം
  rationale: അവശ്യകത വ്യക്തമായി നിലനിർത്തുന്നു; കഷ്ടതകൾ രക്ഷയുടെ പുണ്യകാരണമാണെന്നോ അവയുടെ കൃത്യമായ ദൈവശാസ്ത്രയന്ത്രണം എന്തെന്നോ പാഠത്തിന് അപ്പുറം നിർണയിക്കുന്നില്ല.
- issue: കഷ്ടതകളും ദൈവരാജ്യപ്രവേശവും തമ്മിലുള്ള ബന്ധം
  choice: അനേകം കഷ്ടതകളിലൂടെ നാം ദൈവരാജ്യത്തിൽ പ്രവേശിക്കേണ്ടതാണ്
  alternative: ദൈവരാജ്യത്തിൽ പ്രവേശിക്കാൻ നാം അനേകം കഷ്ടതകൾ അനുഭവിക്കണം
  rationale: διάയുടെ ‘വഴിയായി/കടന്നുകൊണ്ട്’ എന്ന ബന്ധം നിലനിർത്തുന്നു; കഷ്ടതയെ പ്രവേശനത്തിനുള്ള സമ്പാദ്യയോഗ്യതയായി പുനർവ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പങ്കാളിവാക്യങ്ങളുടെ തുടർച്ച മലയാളത്തിൽ ഏകോപിത ക്രിയകളായി നൽകിയിരിക്കുന്നു. ഉദ്ധരിച്ച സന്ദേശം വ്യക്തതയ്ക്കായി ഉദ്ധരണിചിഹ്നങ്ങളിൽ ചേർത്തു; പുതിയ ആശയം കൂട്ടിച്ചേർത്തിട്ടില്ല.
