  source_fidelity: ഗ്രീക്കിലെ മൂന്ന് present participles (ἐπιστηρίζοντες, παρακαλοῦντες, [λέγοντες implied with] ὅτι) മലയാളത്തിലെ ഏകോപിത ക്രിയാപ്രയോഗങ്ങളിലൂടെ വിശ്വസ്തമായി കൈമാറിയിരിക്കുന്നു. ‘ശിഷ്യരുടെ മനസ്സുകളെ ഉറപ്പിക്കുകയും’ ψυχάς എന്നതിന്റെ സന്ദർഭോചിതമായ, ബൈബിൾ-മലയാളത്തിൽ സ്ഥാപിതമായ പ്രയോഗമാണ്; അത് ദ്വൈതവാദപരമായ ‘ആത്മാക്കൾ’ എന്ന വായന നിർബന്ധിക്കുന്നില്ല. ‘അനേകം കഷ്ടതകളിലൂടെ’ διά πολλῶν θλίψεων-ന്റെ വഴിയിലൂടെയുള്ള ബന്ധവും, ‘പ്രവേശിക്കേണ്ടതാണ്’ δεῖയുടെ അനിവാര്യതയും സംരക്ഷിക്കുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വായനാസൗകര്യമുള്ളതുമാണ്. ഉദ്ധരണിചിഹ്നങ്ങൾ ὅτι-വാക്യത്തിന്റെ ഉള്ളടക്കം വ്യക്തമായി വേർതിരിക്കുന്നു. ‘വിശ്വാസത്തിൽ നിലനിൽക്കാൻ’ എന്നത് സന്ദർഭത്തിൽ സുതാര്യമാണ്.
  terminology: ‘ശിഷ്യർ,’ ‘വിശ്വാസം,’ ‘കഷ്ടതകൾ,’ ‘ദൈവരാജ്യം’ എന്നിവ സ്ഥിരതയുള്ളതും അനുയോജ്യവുമായ പദങ്ങളാണ്. τῇ πίστει-യ്ക്ക് ‘വിശ്വാസത്തിൽ’ എന്ന തിരഞ്ഞെടുപ്പ് ഗ്രീക്കിലെ നിർദിഷ്ടതയെ അനാവശ്യമായി വിപുലീകരിക്കാതെയും മലയാളത്തിന്റെ സ്വാഭാവിക പ്രയോഗം നിലനിർത്തിയും ചെയ്യുന്നു.
