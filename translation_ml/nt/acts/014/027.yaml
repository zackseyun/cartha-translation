id: ACT.14.27
reference: Acts 14:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: ml
  text: അവർ എത്തിയശേഷം സഭയെ ഒരുമിച്ചുകൂട്ടി, ദൈവം തങ്ങളോടുകൂടെ ചെയ്തതെല്ലാം[a]യും യഹൂദേതരർക്കു വിശ്വാസത്തിന്റെ ഒരു വാതിൽ തുറന്നതും[b] അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവം തങ്ങളിലൂടെ ചെയ്തതെല്ലാം.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘തങ്ങളോടുകൂടെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘യഹൂദേതര ജനതകൾക്കു വിശ്വാസത്തിന്റെ ഒരു വാതിൽ തുറന്നു.’ ‘വിശ്വാസത്തിന്റെ ഒരു വാതിൽ’ എന്നത് ‘വിശ്വാസത്തിലേക്കുള്ള ഒരു വാതിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: അവർ അവിടെ എത്തിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്നെത്തിയതിനെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള കാലബന്ധത്തോടെ നൽകുന്നു.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: സഭയെ ഒരുമിച്ചുകൂട്ടി
  rationale: പ്രാദേശിക ക്രൈസ്തവസമൂഹത്തെ യോഗത്തിനായി കൂട്ടിച്ചേർത്തതാണെന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἀνήγγελλον
  choice: വിവരിച്ചു ... അറിയിച്ചു
  rationale: Imperfect രൂപത്തിലെ വിശദമായ റിപ്പോർട്ടിന്റെ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ ഏക ഗ്രീക്ക് ക്രിയയുടെ ഉള്ളടക്കം രണ്ടു സമന്വിത ഘടകങ്ങളായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: ദൈവം തങ്ങളോടുകൂടെ ചെയ്തതെല്ലാം
  rationale: μετά എന്നതിന്റെ നേരിട്ടുള്ള ‘കൂടെ’ എന്ന ആശയം സംരക്ഷിച്ച്, അപ്പൊസ്തലന്മാരെ ഉപകരണകാരണം മാത്രമായി വ്യാഖ്യാനിച്ചുറപ്പിക്കാതെ ദൈവത്തെ പ്രവർത്തകനായി നിലനിർത്തുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകൾക്കായി
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് യഹൂദേതരരെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: θύραν πίστεως
  choice: വിശ്വാസത്തിന്റെ ഒരു വാതിൽ
  rationale: വാതിൽ എന്ന രൂപകം നിലനിർത്തുകയും ഗ്രീക്കിലെ genitive ബന്ധം അനാവശ്യമായി വിശദീകരിച്ചുറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ഇവിടെ πίστις വിശ്വാസം/ദൈവത്തിലുള്ള ആശ്രയം എന്ന സാധാരണ അർഥത്തിലാണ്; ‘വിശ്വാസം’ ആ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ പ്രവർത്തനത്തെ വിവരിക്കുന്ന μετ’ αὐτῶν എന്നതിന്റെ അർഥം
  choice: ദൈവം തങ്ങളോടുകൂടെ ചെയ്തത്
  alternative: ദൈവം തങ്ങളിലൂടെ ചെയ്തത്; ദൈവം അവരുടെ ഇടയിൽ ചെയ്തത്
  rationale: ‘തങ്ങളോടുകൂടെ’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിലെ കൂട്ടായ്മ നിലനിർത്തുന്നു; ദൈവത്തിന്റെ പ്രവർത്തനത്തിൽ പൗലൊസിന്റെയും ബർന്നബാസിന്റെയും പങ്ക് എങ്ങനെയായിരുന്നുവെന്ന് അതിലധികം നിർണയിക്കുന്നില്ല.
- issue: ἔθνεσιν എന്ന പദത്തിന്റെ അവതരണം
  choice: ജനതകൾ
  alternative: വിജാതീയർ; യഹൂദേതരർ
  rationale: പ്രധാനപാഠത്തിൽ ഗ്രീക്ക് പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; അപ്പൊസ്തലപ്രവൃത്തികളുടെ ഈ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് യഹൂദേതര ജനങ്ങളാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: θύραν πίστεως എന്ന രൂപകത്തിന്റെ ബന്ധം
  choice: വിശ്വാസത്തിന്റെ ഒരു വാതിൽ
  alternative: വിശ്വാസത്തിലേക്കുള്ള ഒരു വാതിൽ; വിശ്വസിക്കാനുള്ള ഒരു വഴി
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ genitive രൂപകം സംരക്ഷിച്ച്, അത് വിശ്വാസത്തിലേക്കുള്ള പ്രവേശനമാണോ വിശ്വസിക്കാനുള്ള അവസരമാണോ എന്ന് പാഠം പറയുന്നതിലധികം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘സഭ’, ‘വിശ്വാസം’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അപൂർവമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
