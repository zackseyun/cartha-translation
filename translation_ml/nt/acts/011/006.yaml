  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. ജീവിവർഗങ്ങളുടെ പട്ടികയ്ക്ക് തിരുവെഴുത്തിലെ വർഗീകരണഭാവം നിലനിർത്തിയിരിക്കുന്നു; സാങ്കേതികമായ ‘ചതുർപ്പാദികൾ’ പോലുള്ള പദങ്ങൾ ഒഴിവാക്കി.
