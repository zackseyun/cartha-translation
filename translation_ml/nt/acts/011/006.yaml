source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: ml
  text: അതിലേക്കു ഉറ്റുനോക്കി ശ്രദ്ധാപൂർവം നിരീക്ഷിച്ചുകൊണ്ടിരിക്കെ, ഭൂമിയിലെ നാലുകാലി ജീവികളെയും കാട്ടുമൃഗങ്ങളെയും ഇഴജന്തുക്കളെയും[a] ആകാശത്തിലെ പക്ഷികളെയും ഞാൻ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇഴയുന്ന ജീവികളെയും.’ സൃഷ്ടിവിവരണത്തിലും ശുദ്ധി സംബന്ധമായ നിയമങ്ങളിലും കാണുന്ന വിശാലമായ വർഗനാമം ഈ പരിഭാഷ കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: അതിലേക്കു
  rationale: മുൻവാക്യത്തിലെ വിരിപ്പുപോലുള്ള വസ്തുവിലേക്കുള്ള ദൃഷ്ടിയുടെ ദിശ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ εἰς എന്നതിന്റെ ദിശാസൂചന നിലനിർത്തുന്നു.
- source_word: ἀτενίσας
  choice: സൂക്ഷിച്ചുനോക്കി
  rationale: ഏകാഗ്രമായി ഉറ്റുനോക്കുന്നതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κατενόουν
  choice: പരിശോധിച്ചപ്പോൾ
  rationale: തുടർച്ചയായ ശ്രദ്ധാപൂർവമായ നിരീക്ഷണത്തെ സൂചിപ്പിക്കുകയും മുമ്പുള്ള ‘സൂക്ഷിച്ചുനോക്കി’ എന്നതിൽനിന്ന് അർഥപരമായി വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἶδον
  choice: ഞാൻ കണ്ടു
  rationale: ലളിതമായ ദർശനക്രിയയെ നേരിട്ട് അവതരിപ്പിച്ച് മുൻപുള്ള ശ്രദ്ധാപൂർവമായ പരിശോധനയിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: ഭൂമിയിലെ നാലുകാലികളെ
  rationale: സൃഷ്ടിജാലത്തിന്റെ വർഗീകരണശൈലി നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം നൽകുന്നു.
- source_word: τὰ θηρία
  choice: കാട്ടുമൃഗങ്ങളെ
  rationale: പൊതുവായ നാലുകാലികളിൽനിന്ന് വ്യത്യസ്തമായ വന്യമൃഗവിഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: τὰ ἑρπετά
  choice: ഇഴജന്തുക്കളെ
  rationale: ഇഴയുകയോ നിലത്തോടു ചേർന്ന് സഞ്ചരിക്കുകയോ ചെയ്യുന്ന ജീവികളുടെ വിശാല വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉരഗങ്ങൾ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ വ്യാപ്തി നന്നായി നിലനിർത്തുന്നു.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികളെ
  rationale: കോൺക്രീറ്റ് ജന്തുവർഗസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം; ‘ആകാശം’ എന്നത് അനാവശ്യമായ സ്വർഗീയ അർഥസന്ദിഗ്ധത ഒഴിവാക്കുന്നു.
