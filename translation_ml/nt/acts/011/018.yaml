reference: Acts 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: ml
  text: 'അവർ ഈ കാര്യങ്ങൾ കേട്ടപ്പോൾ നിശ്ശബ്ദരായി ദൈവത്തെ മഹത്വപ്പെടുത്തി ഇങ്ങനെ പറഞ്ഞു: “അങ്ങനെയെങ്കിൽ, യഹൂദരല്ലാത്തവർക്കും[a] ജീവനിലേക്കുള്ള മാനസാന്തരം[b] ദൈവം നൽകിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജനതകൾക്കും.’ ഇവിടെ ഈ പദം യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ജീവനിലേക്ക് നയിക്കുന്ന മാനസാന്തരം’ അല്ലെങ്കിൽ ‘ജീവനുവേണ്ടിയുള്ള മാനസാന്തരം.’ ഗ്രീക്ക് പ്രയോഗം ജീവനെ ലക്ഷ്യമോ ഫലമോ ആയി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: അവർ ഇതു കേട്ടപ്പോൾ
  rationale: സന്ദർഭത്തിൽ പത്രോസിന്റെ മുൻവിവരണത്തെ സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ കൃതന്തപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; δέ എന്ന മൃദുവായ ബന്ധകം വാക്യത്തിന്റെ ഒഴുക്കിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἡσύχασαν
  choice: നിശ്ശബ്ദരായി
  rationale: അവർ എതിർപ്പ് അവസാനിപ്പിച്ച് മൗനമായെന്ന ആശയം നൽകുന്നു; ‘ശാന്തരായി’ എന്നു പറഞ്ഞാൽ വികാരപരമായ ശാന്തത മാത്രം സൂചിപ്പിക്കാനിടയുള്ളതിനാൽ അത് ഒഴിവാക്കി.
- source_word: ἐδόξασαν τὸν θεόν
  choice: ദൈവത്തെ മഹത്ത്വപ്പെടുത്തി
  rationale: ലൂക്കോസ്–പ്രവൃത്തികൾ ഗ്രന്ഥങ്ങളിലെ δοξάζω എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും ക്രിയാസാമ്യവും നിലനിർത്തുന്നു.
- source_word: Ἄρα καὶ
  choice: അങ്ങനെയെങ്കിൽ, …ക്കും
  rationale: പത്രോസിന്റെ വിവരണത്തിൽനിന്ന് അവർ എത്തിച്ചേരുന്ന നിഗമനവും ദൈവത്തിന്റെ പ്രവൃത്തി യഹൂദരല്ലാത്തവരിലേക്കും വ്യാപിച്ചതും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: യഹൂദരല്ലാത്തവർക്കും
  rationale: ഇവിടെ ἔθνη എന്നത് ഭൗമരാഷ്ട്രീയ ജനതകളെയല്ല, യഹൂദരല്ലാത്തവരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജാതികൾ’ എന്ന മലയാളപദം വർഗം/കാസ്റ്റ് എന്ന തെറ്റായ അർഥം ഉണർത്താനിടയുള്ളതിനാൽ സന്ദർഭാർഥം വ്യക്തമായി നൽകി.
- source_word: τὴν μετάνοιαν
  choice: മാനസാന്തരം
  rationale: μετάνοιαയെ വെറും അഭിപ്രായമാറ്റമായി ചുരുക്കാതെ, ദൈവത്തിലേക്കുള്ള ആന്തരിക തിരിഞ്ഞുവരവ് ഉൾക്കൊള്ളുന്ന പൊതുവായി ഗ്രഹിക്കാവുന്ന ബൈബിൾപദം ഉപയോഗിക്കുന്നു.
- source_word: εἰς ζωὴν
  choice: ജീവനിലേക്കുള്ള
  rationale: εἰς എന്നതിലെ ലക്ഷ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ദിശാബോധം നിലനിർത്തുന്നു; ‘ജീവൻ പ്രാപിക്കുന്നതിലേക്കുള്ള’ എന്ന നീണ്ട പ്രയോഗത്തേക്കാൾ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
- source_word: ἔδωκεν
  choice: നൽകിയിരിക്കുന്നു
  rationale: ദൈവം മാനസാന്തരം നൽകിയെന്ന മൂലപാഠത്തിലെ ദാനസ്വഭാവം നിലനിർത്തുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണകാലരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: മാനസാന്തരം ദൈവം നൽകുന്നതായി അവതരിപ്പിക്കുന്നത്
  choice: ‘മാനസാന്തരം ദൈവം നൽകിയിരിക്കുന്നു’ എന്ന് മൂലപാഠത്തിലെ ദൈവദാനസ്വഭാവം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘മാനസാന്തരപ്പെടാൻ ദൈവം അവസരം നൽകി’ എന്നിങ്ങനെ മനുഷ്യപ്രതികരണത്തെ മുൻനിർത്തി വിപുലീകരിക്കുക.
  rationale: ἔδωκεν എന്ന ക്രിയ മാനസാന്തരത്തെ ദൈവം നൽകിയതായി വ്യക്തമായി പറയുന്നു. എന്നാൽ ദൈവത്തിന്റെ പ്രവർത്തനവും മനുഷ്യന്റെ പ്രതികരണവും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ച് ഈ വാക്യം പറയുന്നതിലധികം ഒരു പ്രത്യേക സിദ്ധാന്തം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: μετάνοια εἰς ζωήν എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: ‘ജീവനിലേക്കുള്ള മാനസാന്തരം’
  alternative: ‘ജീവൻ നൽകുന്ന മാനസാന്തരം’ അല്ലെങ്കിൽ ‘ജീവനുവേണ്ടിയുള്ള മാനസാന്തരം’
  rationale: εἰς എന്നതിലെ ലക്ഷ്യം/ഫലം എന്ന തുറന്ന അർഥപരിധി സംരക്ഷിക്കുന്നു; മാനസാന്തരം തന്നെയാണ് ജീവന്റെ കാര്യകാരണകാരണമെന്ന് വിവർത്തനം അധികമായി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ‘യഹൂദരല്ലാത്തവർ’ എന്ന വ്യക്തമായ പ്രയോഗം ഉപയോഗിച്ച് ‘ജാതികൾ’ എന്ന പദത്തിന്റെ ആധുനിക മലയാളത്തിലെ സാമൂഹികവർഗാർഥം ഒഴിവാക്കി; ‘മാനസാന്തരം’ എന്ന പരിചിതവും അർഥസമ്പന്നവുമായ പദം നിലനിർത്തി.
