id: ACT.11.21
reference: Acts 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: ml
  text: കർത്താവിന്റെ കൈ അവരോടുകൂടെ ഉണ്ടായിരുന്നു[a]. വിശ്വസിച്ച വലിയൊരു കൂട്ടം കർത്താവിലേക്കു തിരിഞ്ഞു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ ശക്തി അവരോടുകൂടെ ഉണ്ടായിരുന്നു’; ‘കർത്താവിന്റെ കൈ’ എന്നത് കർത്താവിന്റെ സജീവശക്തിയെയോ അനുഗ്രഹപൂർണമായ പിന്തുണയെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾ ശൈലിയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശ്വസിച്ച് കർത്താവിലേക്കു തിരിഞ്ഞു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: കർത്താവിന്റെ കൈ
  rationale: കർത്താവിന്റെ സജീവമായ ശക്തിയെയോ അനുകൂലസാന്നിധ്യത്തെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾ ശൈലിയാണിത്. രൂപകം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പ്രമാണപാഠത്തിലെ സ്ഥാനപ്പേര് അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യേശുവിനെയോ ദൈവത്തെയോ സൂചിപ്പിക്കുന്നതാണെന്ന് വിവർത്തനത്തിൽ പ്രത്യേകം നിർണയിക്കുന്നില്ല.
- source_word: μετ’ αὐτῶν
  choice: അവരോടുകൂടെ
  rationale: μετά + genitive എന്നതിന്റെ സ്വാഭാവിക അർഥമായ 'അവരോടൊപ്പം' എന്ന ആശയം നൽകുകയും ദൈവിക സാന്നിധ്യവും പിന്തുണയും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: πολύς τε ἀριθμός
  choice: വലിയൊരു കൂട്ടം
  rationale: അനേകം ആളുകളെ സൂചിപ്പിക്കുന്ന നാമപദഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ πιστεύσας
  choice: വിശ്വസിച്ച
  rationale: ആർട്ടിക്കുലർ aorist participle കൂട്ടമായി എടുത്ത് 'വിശ്വസിച്ചവർ' എന്ന അർഥം നൽകുന്നു; വിശ്വാസവും തിരിയലും തമ്മിലുള്ള കൃത്യമായ കാലബന്ധം ഗ്രീക്കിൽ വ്യാഖ്യാനസാധ്യതയുള്ളതിനാൽ അടിക്കുറിപ്പിൽ മറ്റൊരു രൂപം നൽകുന്നു.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: കർത്താവിലേക്കു തിരിഞ്ഞു
  rationale: കർത്താവിലേക്കുള്ള തിരിയൽ/മാനസാന്തരപരമായ പരിവർത്തനം സൂചിപ്പിക്കുന്നു; 'മാനസാന്തരപ്പെട്ടു' എന്ന അധിക വ്യാഖ്യാനം ചേർക്കുകയോ 'മടങ്ങിവന്നു' എന്നു പറഞ്ഞ് മുൻബന്ധം സൂചിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: '''കർത്താവ്'' എന്നതിന്റെ സന്ദർഭപരമായ സൂചിതവ്യക്തി'
  choice: രണ്ടിടത്തും κύριος എന്നത് 'കർത്താവ്' എന്നു മാത്രം വിവർത്തനം ചെയ്തു.
  alternative: യേശു എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ദൈവം എന്നു വ്യക്തമാക്കുക.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പദം സന്ദർഭാനുസാരം യേശുവിനെ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് പാഠം ഇവിടെ 'കർത്താവ്' എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: വിശ്വാസവും കർത്താവിലേക്കുള്ള തിരിയലും തമ്മിലുള്ള ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ 'വിശ്വസിച്ച വലിയൊരു കൂട്ടം ... തിരിഞ്ഞു' എന്നു നൽകി.
  alternative: '''വിശ്വസിച്ച് ... തിരിഞ്ഞു'' അല്ലെങ്കിൽ ''വിശ്വസിച്ചുകൊണ്ട് ... തിരിഞ്ഞു.'''
  rationale: Aorist participle-ന്റെ കൃത്യമായ സാഹചര്യബന്ധം നിർബന്ധമായി ക്രമാനുസൃതമെന്നു തീർപ്പാക്കാതെ, ഗ്രീക്ക് ഘടനയോട് അടുത്ത ഒരു സ്വാഭാവിക മലയാളരൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. 'കർത്താവിന്റെ കൈ' എന്ന ബൈബിൾ രൂപകവും 'കർത്താവിലേക്കു തിരിഞ്ഞു' എന്ന പരിവർത്തനഭാഷയും നിലനിർത്തി; അനാവശ്യമായ സഭാപാരമ്പര്യപരമായ വിശദീകരണം ഒഴിവാക്കി.
