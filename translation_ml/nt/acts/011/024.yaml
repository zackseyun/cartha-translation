revisions:
- from: കാരണം, അവൻ നല്ലൊരു മനുഷ്യനായിരുന്നു—പരിശുദ്ധാത്മാവിനാലും വിശ്വാസത്താലും[a] നിറഞ്ഞവൻ. വലിയൊരു ജനക്കൂട്ടം കർത്താവിനോടു ചേർക്കപ്പെടുകയും ചെയ്തു.
