id: ACT.11.24
reference: Acts 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: ml
  text: കാരണം, അവൻ പരിശുദ്ധാത്മാവും വിശ്വാസവും[a] നിറഞ്ഞ ഒരു നല്ല മനുഷ്യനായിരുന്നു. ഗണ്യമായ ഒരു ജനക്കൂട്ടം കർത്താവിനോടു ചേർക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തത.” ഗ്രീക്കിലെ പിസ്റ്റിസ് എന്ന പദത്തിന് “വിശ്വസ്തത” എന്നും അർഥമാകാം; ഇവിടെ മുഖ്യപാഠം സാധാരണ പരിഭാഷയായ “വിശ്വാസം” സ്വീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ ബർന്നബാസിനെക്കുറിച്ചു പറഞ്ഞതിന്റെ വിശദീകരണം അവതരിപ്പിക്കുന്നതിനാൽ ഗ്രീക്കിലെ കാരണസൂചകബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνὴρ ἀγαθὸς
  choice: നല്ലൊരു മനുഷ്യൻ
  rationale: ബർന്നബാസ് എന്ന പുരുഷനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതോടൊപ്പം ἀγαθός എന്ന പദത്തിന്റെ പൊതുവായ ധാർമികഗുണാർത്ഥം അമിതമായി വിശദീകരിക്കാതെ നൽകുന്നു.
- source_word: πλήρης πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞവൻ
  rationale: ലൂക്കോസ്–പ്രവൃത്തികൾ പശ്ചാത്തലത്തിൽ ദൈവിക വ്യക്തിയായ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണ അർത്ഥമായ ‘വിശ്വാസം’ മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ഈ സ്വഭാവവിവരണത്തിൽ സാധ്യമായ ‘വിശ്വസ്തത’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: προσετέθη
  choice: ചേർക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ആളുകൾ കർത്താവിനോടു ചേർക്കപ്പെട്ടു എന്ന പ്രവൃത്തികളുടെ സവിശേഷ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ὄχλος ἱκανὸς
  choice: വലിയൊരു ജനക്കൂട്ടം
  rationale: ἱκανός ഇവിടെ ഗണ്യമായ സംഖ്യയെ സൂചിപ്പിക്കുന്നതിനാൽ ലളിതവും സമകാലികവുമായ ഈ പ്രയോഗം തെരഞ്ഞെടുത്തു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനോട്
  rationale: ഗ്രീക്ക് പാഠം പറഞ്ഞിരിക്കുന്ന ലക്ഷ്യം സഭയെന്ന വ്യാഖ്യാനപരമായ പദംകൊണ്ട് മാറ്റാതെ ‘കർത്താവിനോട്’ എന്നുതന്നെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിന്റെ സൂചന
  choice: ദൈവിക വ്യക്തിയായ പരിശുദ്ധാത്മാവ്
  alternative: വിശുദ്ധമായ ഒരു മാനുഷിക മനോഭാവം
  rationale: ലൂക്കോസ്–പ്രവൃത്തികളിലെ സ്ഥിരമായ ഉപയോഗവും ബർന്നബാസിന്റെ ആത്മനിറവുള്ള ശിഷ്യത്വത്തെക്കുറിച്ചുള്ള സന്ദർഭവും പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: πίστεως എന്നതിന്റെ അർത്ഥനിറം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: ഇരുവിധ അർത്ഥവും സന്ദർഭത്തിൽ സാധ്യമാണ്. സാധാരണ പരിഭാഷയായ ‘വിശ്വാസം’ മുഖ്യപാഠത്തിൽ കൊടുത്ത് യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: προσετέθη ... τῷ κυρίῳ എന്നതിൽ ചേർക്കപ്പെടുന്നതിന്റെ ലക്ഷ്യം
  choice: ജനങ്ങൾ കർത്താവിനോടു ചേർക്കപ്പെട്ടു
  alternative: ജനങ്ങൾ സഭയിലേക്കോ സമൂഹത്തിലേക്കോ ചേർക്കപ്പെട്ടു
  rationale: സഭാസമൂഹത്തിൽ ഉൾപ്പെടൽ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘കർത്താവിനോട്’ എന്നു പറയുന്നതിനാൽ അതിനെ വ്യാഖ്യാനപരമായി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യവാക്യത്തിലെ ദീർഘമായ സമന്വയം സ്വാഭാവികമാക്കാൻ ദീർഘവിരാമം ഉപയോഗിച്ചു; രണ്ടാം വാക്യത്തിൽ ഗ്രീക്കിലെ കർമണിരൂപവും ‘കർത്താവിനോട്’ എന്ന വ്യക്തമായ ലക്ഷ്യവും നിലനിർത്തി.
