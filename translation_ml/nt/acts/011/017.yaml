id: ACT.11.17
reference: Acts 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, കർത്താവായ യേശു മശീഹയിൽ[a] വിശ്വസിച്ച നമുക്കും[b] നൽകിയ അതേ ദാനം ദൈവം അവർക്കും നൽകിയെങ്കിൽ, ദൈവത്തെ തടയാൻ കഴിയുന്നവനായി ഞാൻ ആരായിരുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ക്രിസ്തു’: ഗ്രീക്ക് Χριστόν. ഇവിടെ പദവിയുടെ അർഥം സജീവമായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘നാം കർത്താവായ യേശു മശീഹയിൽ വിശ്വസിച്ചപ്പോൾ നമുക്കു നൽകിയതുപോലെ.’ ഗ്രീക്ക് കൃദന്തത്തെ കാലസൂചനയായി മനസ്സിലാക്കാനും കഴിയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: അതേ ദാനം
  rationale: ἴσην ഇവിടെ തുല്യതയെയും ഒരേ സ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു. യഹൂദവിശ്വാസികൾക്കും ജനതകളിൽനിന്നുള്ള വിശ്വാസികൾക്കും ദൈവം നൽകിയ ദാനം തമ്മിലുള്ള സമത്വം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: കർത്താവായ യേശുമശീഹയിൽ വിശ്വസിച്ച നമുക്ക്
  rationale: ദാതൃവിഭക്തിയിലുള്ള πιστεύσασιν, ἡμῖν എന്നതോടു യോജിക്കുന്നതിനാൽ ‘വിശ്വസിച്ച നമുക്ക്’ എന്ന് വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി. ἐπὶ കൂടിയ ദ്വിതീയാവിഭക്തി വിശ്വാസത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘-യിൽ വിശ്വസിക്കുക’ എന്നു നൽകി.
- source_word: κύριον
  choice: കർത്താവായ
  rationale: യേശുവിന്റെ പദവിയായി κύριος എന്നതിന്റെ അർഥം നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ചേരാൻ ‘കർത്താവായ’ എന്നു രൂപപ്പെടുത്തി.
- source_word: Χριστόν
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός അർഥസമ്പന്നമായ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകി; പേരിന്റെ ഭാഗംപോലെ മാത്രം അവതരിപ്പിച്ചില്ല.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: കഴിവുള്ളവനായി ഞാൻ ആരായിരുന്നു?
  rationale: ദൈവത്തിന്റെ പ്രവൃത്തിക്കുമുമ്പിലുള്ള പത്രോസിന്റെ സ്വയംതാഴ്ത്തുന്ന ആലങ്കാരികചോദ്യം സംരക്ഷിക്കുന്നു; emphatic ἐγώ-യുടെ ഊന്നലും δυνατός-ന്റെ കഴിവെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: κωλῦσαι τὸν θεόν
  choice: ദൈവത്തെ തടയാൻ
  rationale: ദൈവത്തിന്റെ പ്രവൃത്തിയെ എതിർക്കുന്നത് ദൈവത്തെത്തന്നെ തടയുന്നതിനു തുല്യമാണെന്ന ഗ്രീക്കിലെ ശക്തമായ നേരിട്ടുള്ള പ്രയോഗം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριον Ἰησοῦν Χριστόν എന്ന ക്രിസ്തുസംബന്ധിയായ പദവിയിൽ Χριστόν എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός ഒരു അർഥസമ്പന്നമായ പദവിയായി സജീവമാണ്. ‘മശീഹ’ എന്നത് യഹൂദ മശീഹാപ്രതീക്ഷയുമായുള്ള ബന്ധം നിലനിർത്തുന്നു; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πιστεύσασιν എന്ന ഭൂതകാലകൃദന്തവും ἡμῖν എന്ന സർവനാമവും തമ്മിലുള്ള ബന്ധം
  choice: വിവരണാത്മകമായി ‘വിശ്വസിച്ച നമുക്ക്’
  alternative: കാലസൂചനയായി ‘നാം വിശ്വസിച്ചപ്പോൾ’
  rationale: കൃദന്തം വ്യാകരണപരമായി ἡμῖν-നോട് യോജിക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ അതിന്റെ വിവരണാത്മകബന്ധം നേരിട്ട് സംരക്ഷിച്ചു. കാലസൂചനയായി ഗ്രഹിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി; രക്ഷാക്രമത്തെക്കുറിച്ചുള്ള അധിക ദൈവശാസ്ത്രനിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘യേശുമശീഹ’ എന്ന സംയുക്തരൂപം മലയാളത്തിലെ വിഭക്തിബന്ധം സ്വാഭാവികമാക്കുകയും Χριστός എന്ന പദവിയുടെ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു. വാക്യാന്തത്തിലെ ആലങ്കാരികചോദ്യം ഉറവിടത്തിലെ ദൈവികപ്രവൃത്തിയെ എതിർക്കാനാവാത്തതിന്റെ ശക്തി സംരക്ഷിക്കുന്നു.
