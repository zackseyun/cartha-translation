- from: അങ്ങനെ, കർത്താവായ യേശുമശീഹയിൽ[a] വിശ്വസിച്ച നമുക്കും[b] നൽകിയ അതേ ദാനം ദൈവം അവർക്കും നൽകിയെങ്കിൽ, ദൈവത്തെ തടയാൻ കഴിവുള്ളവനായി ഞാൻ ആരായിരുന്നു?
  to: അങ്ങനെയെങ്കിൽ, കർത്താവായ യേശു മശീഹയിൽ[a] വിശ്വസിച്ച നമുക്കും[b] നൽകിയ അതേ ദാനം ദൈവം അവർക്കും നൽകിയെങ്കിൽ, ദൈവത്തെ തടയാൻ കഴിയുന്നവനായി ഞാൻ ആരായിരുന്നു?
