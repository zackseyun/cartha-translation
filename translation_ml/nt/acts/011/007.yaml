  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: ml
  text: 'ഞാൻ എന്നോടു പറയുന്ന ഒരു ശബ്ദം കൂടി കേട്ടു: ‘പത്രോസേ, എഴുന്നേൽക്കുക; കൊന്ന് തിന്നുക.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα δὲ καὶ
  choice: അപ്പോൾ ... ഒരു ശബ്ദവും ഞാൻ കേട്ടു
  rationale: καίയുടെ ‘കൂടി/വും’ എന്ന അർഥം ‘ശബ്ദവും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; δέ ഇവിടെ വിവരണത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘അപ്പോൾ’ എന്നു നൽകി.
- source_word: φωνῆς λεγούσης μοι
  choice: എന്നോടു പറയുന്ന ഒരു ശബ്ദം
  rationale: ജനിറ്റീവ് ഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു; ശബ്ദം പത്രോസിനോടാണ് സംസാരിച്ചതെന്നത് വ്യക്തമാക്കുന്നു.
- source_word: Ἀναστάς
  choice: എഴുന്നേൽക്കുക
  rationale: ആജ്ഞയുടെ ബലം നിലനിർത്തുന്ന സാധാരണവും മാന്യവുമായ പ്രയോഗം.
- source_word: θῦσον
  choice: കൊന്ന്
  rationale: ഇവിടെ ഭക്ഷണത്തിനായി ജീവിയെ കൊല്ലുക എന്ന സന്ദർഭാർഥം; ‘ബലിയർപ്പിക്കുക’ എന്ന അനാവശ്യ ആരാധനാകർമസൂചന ഒഴിവാക്കുന്നു.
- source_word: φάγε
  choice: തിന്നുക
  rationale: നേരിട്ടുള്ള ആജ്ഞയും സാധാരണ പ്രവർത്തിയും ലളിതമായി നൽകുന്നു.
theological_decisions:
- issue: θῦσον എന്ന ക്രിയയ്ക്ക് ‘ബലിയർപ്പിക്കുക’ എന്നും ‘കൊല്ലുക’ എന്നും അർഥസാധ്യതയുണ്ട്
  choice: കൊന്ന്
  alternative: ബലിയർപ്പിച്ച്
  rationale: ദർശനത്തിലെ മൃഗങ്ങളെ ഭക്ഷിക്കാനായി കൊല്ലാനുള്ള ആജ്ഞയാണ് സന്ദർഭം; ആരാധനാബലി എന്ന പ്രത്യേക ദൈവശാസ്ത്രാർഥം ഇവിടെ ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ നേരിട്ടുള്ള ആജ്ഞയും ‘കൂടി’ എന്ന ആശയവും നിലനിർത്തി.
