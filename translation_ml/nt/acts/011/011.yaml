  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; വിവരബന്ധം മാറ്റിയിട്ടില്ല.
