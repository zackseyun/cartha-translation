id: ACT.11.11
reference: Acts 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: ml
  text: ഇതാ, അപ്പോൾത്തന്നെ മൂന്നു പുരുഷന്മാർ ഞങ്ങൾ ഉണ്ടായിരുന്ന വീട്ടിലെത്തി. കൈസര്യയിൽനിന്ന് എന്റെ അടുക്കലേക്ക് അയയ്ക്കപ്പെട്ടവരായിരുന്നു അവർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുകയും സംഭവവികാസത്തിന് ആഖ്യാനപരമായ ഊന്നൽ നൽകുകയും ചെയ്യുന്ന പ്രയോഗം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξαυτῆς
  choice: അപ്പോൾത്തന്നെ
  rationale: മുൻസന്ദർഭത്തോടുള്ള അടുത്ത കാലബന്ധവും ഉടനടിത്വവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: τρεῖς ἄνδρες
  choice: മൂന്നു പുരുഷന്മാർ
  rationale: എണ്ണവും പുരുഷലിംഗസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: വീട്ടിലെത്തി
  rationale: വീടിനരികിൽ വന്നെത്തിയെന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ᾗ ἦμεν
  choice: ഞങ്ങൾ ഉണ്ടായിരുന്ന
  rationale: അവിടെ താമസിക്കുകയായിരുന്നു എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതെ സ്ഥലസൂചന മാത്രം സംരക്ഷിക്കുന്നു.
- source_word: ἀπεσταλμένοι
  choice: അയയ്ക്കപ്പെട്ടവരായിരുന്നു
  rationale: അവരുടെ വരവിനു മുമ്പേ അയയ്ക്കപ്പെട്ടിരുന്നു എന്ന പൂർണകാല കർമണി കൃദന്തരൂപത്തിന്റെ മുൻകാലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ Καισαρείας
  choice: കൈസര്യയിൽനിന്ന്
  rationale: പുറപ്പെട്ട സ്ഥലത്തെ സൂചിപ്പിക്കുന്ന ἀπόയുടെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: πρός με
  choice: എന്റെ അടുക്കലേക്ക്
  rationale: പത്രോസാണ് അയയ്ക്കപ്പെട്ടവരുടെ ലക്ഷ്യം എന്ന ദിശാസൂചന സംരക്ഷിക്കുന്നു.
