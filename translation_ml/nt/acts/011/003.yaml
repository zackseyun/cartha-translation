source:
  edition: SBLGNT
  text: λέγοντες ὅτι ⸂Εἰσῆλθες πρὸς ἄνδρας ἀκροβυστίαν ἔχοντας καὶ συνέφαγες⸃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/003.yaml
  text: saying[a], “You went in to uncircumcised men and ate with them.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “നീ പരിച്ഛേദനയില്ലാത്ത പുരുഷന്മാരുടെ[a] അടുക്കൽ ചെന്ന് അവരോടൊപ്പം ഭക്ഷണം കഴിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പരിച്ഛേദനയില്ലാത്ത പുരുഷന്മാരുടെ അടുക്കലേക്ക്.’ ‘പരിച്ഛേദനയില്ലാത്ത പുരുഷന്മാർ’ എന്ന പ്രയോഗം പരിച്ഛേദനം എന്ന യഹൂദ ഉടമ്പടി-അടയാളത്തിന് പുറത്തുള്ളവരെ, അതായത് ജാതികളെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'അവർ പറഞ്ഞു:'
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുൻസന്ദർഭത്തിലെ സംസാരിക്കുന്നവരോടു ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള ഉദ്ധരണിയായി അവതരിപ്പിച്ചു.
- source_word: Εἰσῆλθες πρὸς
  choice: നീ … അടുക്കൽ ചെന്ന്
  rationale: പ്രവേശനത്തെയോ വ്യക്തികളുടെ സന്നിധിയിലേക്കുള്ള നീക്കത്തെയോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; കുറ്റാരോപണത്തിന്റെ ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἄνδρας ἀκροβυστίαν ἔχοντας
  choice: പരിച്ഛേദനയില്ലാത്ത പുരുഷന്മാരുടെ
  rationale: ἄνδρας എന്നതിലെ പുരുഷലിംഗസൂചനയും പരിച്ഛേദനം എന്ന ഉടമ്പടി-അടയാളത്തിന്റെ അഭാവത്തെ മുൻനിർത്തുന്ന ഗ്രീക്ക് പ്രയോഗവും നിലനിർത്തുന്നു; ‘ജാതികൾ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റിയിട്ടില്ല.
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: അവരോടൊപ്പം ഭക്ഷണം കഴിച്ചല്ലോ
  rationale: സഹഭോജനത്തെ നേരിട്ട് വ്യക്തമാക്കുന്നു; ആരോപണസ്വരം മലയാളത്തിലെ ‘-ല്ലോ’ പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἀκροβυστίαν ἔχοντας എന്നത് ‘ജാതികൾ’ എന്നോ ‘പരിച്ഛേദനയില്ലാത്തവർ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: പരിച്ഛേദനയില്ലാത്ത പുരുഷന്മാർ
  alternative: ജാതികളായ പുരുഷന്മാർ / വിജാതീയർ
  rationale: വക്താക്കളുടെ എതിർപ്പ് വംശീയ തിരിച്ചറിയലിൽ മാത്രം അല്ല, പരിച്ഛേദനം എന്ന ഉടമ്പടി-അടയാളത്തിലും സാമൂഹിക-മതപരമായ അതിർത്തിയിലും കേന്ദ്രീകരിച്ചിരിക്കുന്നു. അതിനാൽ മൂലപാഠത്തിലെ തീവ്രതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. നേരിട്ടുള്ള ഉദ്ധരണിയും ആരോപണത്തിന്റെ ഭാവവും സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു; ‘പരിച്ഛേദനയില്ലാത്ത’ എന്ന പദം മൂലത്തിലെ ഉടമ്പടി-സാമൂഹിക സംഘർഷം സംരക്ഷിക്കുന്നു.
