id: ACT.11.9
reference: Acts 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ ⸂φωνὴ ἐκ δευτέρου⸃ ἐκ τοῦ οὐρανοῦ· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: ml
  text: 'എന്നാൽ സ്വർഗത്തിൽനിന്ന് ഒരു ശബ്ദം രണ്ടാമതും മറുപടി പറഞ്ഞു: “ദൈവം ശുദ്ധീകരിച്ചവയെ നീ സാധാരണമെന്നു വിളിക്കരുത്[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അശുദ്ധമെന്നു കണക്കാക്കരുത്” അല്ലെങ്കിൽ “അപവിത്രമെന്നു വിളിക്കരുത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന ക്രിയയുടെ സാധാരണ ആഖ്യാനാർഥമായ ‘മറുപടി പറയുക’ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: φωνὴ
  choice: ഒരു ശബ്ദം
  rationale: ഗ്രീക്കിൽ സംസാരിക്കുന്നയാളെ കൂടുതൽ നിർവചിക്കാതെ ശബ്ദത്തെ കർത്താവായി അവതരിപ്പിക്കുന്നതിനാൽ അതേ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἐκ δευτέρου
  choice: രണ്ടാം പ്രാവശ്യം
  rationale: ‘രണ്ടാമതൊരിക്കൽ’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ഈ ദർശനസന്ദർഭത്തിൽ οὐρανός വെറും ആകാശമല്ല, സ്വർഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: Ἃ
  choice: ദൈവം ശുദ്ധീകരിച്ചവയെ
  rationale: നപുംസക ബഹുവചന ബന്ധസർവനാമത്തിന്റെ പൊതുവായ വ്യാപ്തി മലയാളത്തിലെ ‘-വയെ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐκαθάρισεν
  choice: ശുദ്ധീകരിച്ച
  rationale: καθαρίζω എന്നതിന്റെ ‘ശുദ്ധമാക്കി’ എന്ന പൂർത്തിയായ പ്രവൃത്തിയെ ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σὺ
  choice: നീ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ, ഊന്നലുള്ള രണ്ടാംപുരുഷ സർവനാമം മലയാളത്തിലും തുറന്നുപറയുന്നു.
- source_word: μὴ κοίνου
  choice: അശുദ്ധമെന്നു കണക്കാക്കരുത്
  rationale: യഹൂദ ശുദ്ധി-അശുദ്ധി പശ്ചാത്തലത്തിൽ κοινόω നൽകുന്ന പ്രായോഗിക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി പറയുന്നു; ‘സാധാരണം/അപവിത്രം എന്നു വിളിക്കുക’ എന്ന കൂടുതൽ പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: κοινόω എന്ന പദത്തിലെ ശുദ്ധി-വിഭാഗ സൂക്ഷ്മത
  choice: അശുദ്ധമെന്നു കണക്കാക്കരുത്
  alternative: സാധാരണമെന്നോ അപവിത്രമെന്നോ വിളിക്കരുത്
  rationale: ‘സാധാരണം’ എന്ന പദം മലയാളത്തിൽ ഈ ശുദ്ധി-അശുദ്ധി അർഥം സ്വതവേ അറിയിക്കാത്തതിനാൽ മുഖ്യവാചകത്തിൽ സന്ദർഭാർഥം വ്യക്തമായി നൽകി. എന്നിരുന്നാലും ‘ശുദ്ധീകരിച്ചു’ എന്നതിനോടുള്ള ഗ്രീക്ക് പദത്തിന്റെ ‘common/profane’ വൈരുധ്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ദൈവിക ശബ്ദത്തിന്റെ കല്പന നേരിട്ടും ഗൗരവത്തോടെയും നൽകിയിരിക്കുന്നു; അപരിചിതമായ പദാനുപദ പ്രയോഗം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അതിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിട്ടുണ്ട്.
