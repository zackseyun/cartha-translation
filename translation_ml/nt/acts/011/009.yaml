  naturalness: The revised wording is natural modern standard Malayalam. “രണ്ടാമതും മറുപടി പറഞ്ഞു” is smoother than “രണ്ടാം പ്രാവശ്യം മറുപടി പറഞ്ഞു,” while retaining the sense of a second reply.
  terminology: “സാധാരണമെന്നു വിളിക്കരുത്” directly represents the common/profane category expressed by κοινόω. Since ‘സാധാരണം’ may not on its own convey the ritual-purity nuance to every reader, the footnote supplies ‘അശുദ്ധം’ and ‘അപവിത്രം’ as interpretive alternatives without replacing the source wording in the text.
