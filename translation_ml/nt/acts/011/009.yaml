    rationale: The Greek uses κοινόω, not a term for ‘make/call unclean.’ The immediate wider narrative can distinguish ‘common’ from ‘unclean’; therefore the main text should preserve the source category, with interpretive purity-language alternatives in a footnote.
  - severity: low
    issue: “രണ്ടാം പ്രാവശ്യം” is somewhat less idiomatic in this narrative clause.
    rationale: “രണ്ടാമതും” naturally conveys that the heavenly voice answered for a second time.
