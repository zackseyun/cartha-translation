id: ACT.11.23
reference: Acts 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: ml
  text: അവൻ അവിടെ എത്തി ദൈവകൃപ[a] കണ്ടപ്പോൾ സന്തോഷിച്ചു; ഹൃദയത്തിന്റെ ഉറച്ച തീരുമാനത്തോടെ കർത്താവിനോടു ചേർന്നുനിൽക്കാൻ[b] എല്ലാവരെയും നിരന്തരം പ്രോത്സാഹിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ കൃപ.’ ഈ പ്രയോഗം അവരുടെ ഇടയിൽ ദൃശ്യമായിരുന്ന ദൈവത്തിന്റെ കൃപാപൂർവ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘കർത്താവിനോടൊപ്പം തുടരാൻ’ അല്ലെങ്കിൽ ‘കർത്താവിനോടു വിശ്വസ്തരായി നിലനിൽക്കാൻ.’
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: അവിടെ എത്തി
  rationale: ബർന്നബാസ് സംഭവസ്ഥലത്ത് എത്തിയതിനെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തരൂപം; സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘അവിടെ’ ചേർത്തു.
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന സാധാരണ ദർശനക്രിയയെ നിലനിർത്തുന്നു; ദൈവത്തിന്റെ പ്രവൃത്തി തിരിച്ചറിഞ്ഞെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അധികമായി ചേർക്കുന്നില്ല.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: ദൈവകൃപ
  rationale: ദൈവത്തിന്റെ കൃപാപൂർവമായ പ്രവൃത്തിയെയും അനുഗ്രഹത്തെയും ഉൾക്കൊള്ളുന്ന ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐχάρη
  choice: സന്തോഷിച്ചു
  rationale: രൂപത്തിന്റെ സന്ദർഭോചിത അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παρεκάλει
  choice: നിരന്തരം പ്രോത്സാഹിപ്പിച്ചു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിലെ തുടർച്ചയോ ആവർത്തനമോ ‘നിരന്തരം’കൊണ്ട് പ്രകടമാക്കുന്നു; παρακαλέωയിലെ പ്രോത്സാഹനവും ആഹ്വാനവും ഈ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: πάντας
  choice: എല്ലാവരെയും
  rationale: ഗ്രീക്കിലെ സമഗ്രത നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: ഹൃദയത്തിന്റെ ഉറച്ച തീരുമാനത്തോടെ
  rationale: πρόθεσις എന്നതിലെ ലക്ഷ്യബോധവും ദൃഢനിശ്ചയവും, καρδία എന്നതിലെ ആന്തരിക ഇച്ഛയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσμένειν
  choice: ചേർന്നുനിൽക്കാൻ
  rationale: തുടർന്നുള്ള ബന്ധം, സ്ഥിരമായ അടുപ്പം, വിശ്വസ്തമായ നിലനിൽപ്പ് എന്നിവ സൂചിപ്പിക്കുന്നു; ‘ഭക്തിയുള്ളവരായിരിക്കുക’ എന്നതുപോലെ വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനോടു
  rationale: κύριος എന്ന അഭിധാനം പതിവായ ബൈബിൾ മലയാളത്തിൽ ‘കർത്താവ്’ എന്നു നൽകുന്നു; ദത്തിവ് ബന്ധം ‘-നോടു’കൊണ്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവകൃപ’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: അന്ത്യോക്യയിലെ വിശ്വാസികൾക്കിടയിൽ ദൃശ്യമായ ദൈവത്തിന്റെ കൃപാപൂർവ പ്രവൃത്തിയെ ഉൾക്കൊള്ളുന്ന പദപ്രയോഗം
  alternative: ദൈവം ചെയ്തതു; ദൈവത്തിന്റെ പ്രീതി; വിശ്വാസികളുടെ കൃപാഭാവം
  rationale: മുഖ്യവാചകം ഗ്രീക്കിലെ സമ്പന്നമായ പദപ്രയോഗം നിലനിർത്തുന്നു; അതിനെ ‘ദൈവം ചെയ്ത കാര്യം’ എന്നു മാത്രം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- issue: προσμένειν τῷ κυρίῳ എന്നതിന്റെ ശക്തി
  choice: കർത്താവിനോടുള്ള തുടർച്ചയായ ചേർച്ചയും സ്ഥിരതയും
  alternative: കർത്താവിനോടൊപ്പം തുടരുക; കർത്താവിനോടു വിശ്വസ്തരായി നിലനിൽക്കുക; കർത്താവിനോടു ഭക്തിയുള്ളവരായി തുടരുക
  rationale: ‘ചേർന്നുനിൽക്കുക’ ബന്ധപരമായ സ്ഥിരത വ്യക്തമാക്കുമ്പോഴും പിൽക്കാല വ്യവസ്ഥിത ദൈവശാസ്ത്രത്തിലെ പ്രത്യേക സാങ്കേതിക ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവകൃപ’, ‘കർത്താവ്’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ‘ഹൃദയത്തിന്റെ ഉറച്ച തീരുമാനത്തോടെ’ എന്നത് ഔപചാരികതയും പൊതുവായ വായനാസൗകര്യവും സമതുലിതമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
