id: ACT.11.13
reference: Acts 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: ml
  text: 'അവൻ തന്റെ വീട്ടിൽ ദൂതൻ നിൽക്കുന്നതും ഇങ്ങനെ പറയുന്നതും കണ്ടതെങ്ങനെയെന്ന് ഞങ്ങളോടു വിവരിച്ചു: “യോപ്പയിലേക്കു അയച്ച് പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെ വിളിച്ചുവരുത്തുക.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെ വരുത്തുക.”
    reason: μετάπεμψαι എന്ന ക്രിയയ്ക്ക് ഒരാളെ അയച്ചുവരുത്തുക, വിളിച്ചുവരുത്തുക, അല്ലെങ്കിൽ വരുത്തുക എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്താവുന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: വിവരിച്ചു
  rationale: അറിയിക്കുക, വിവരം നൽകുക എന്ന ἀπαγγέλλωയുടെ അർഥം ഇവിടെ ഒരനുഭവത്തിന്റെ വിവരണം അറിയിക്കുന്നതായതിനാൽ ‘വിവരിച്ചു’ സ്വാഭാവികമാണ്.
- source_word: πῶς εἶδεν
  choice: കണ്ടതെങ്ങനെയെന്ന്
  rationale: πῶς എന്നതിലെ ‘എങ്ങനെ’ എന്ന ഭാവം ലളിതമായ ‘കണ്ടുവെന്ന്’ എന്നാക്കി നിരപ്പാക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸν ἄγγελον
  choice: ദൂതൻ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടത സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിക്കപ്പെട്ട ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ വാക്യഘടനയിൽ പ്രത്യേകം നിർദേശപദം ചേർക്കാതെ തന്നെ അത് സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: തന്റെ വീട്ടിൽ
  rationale: അവന്റെ സ്വന്തം വാസസ്ഥലമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ പ്രതിഫലനരൂപമായ ‘തന്റെ’ കർത്താവുമായുള്ള ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: σταθέντα καὶ εἰπόντα
  choice: നിൽക്കുന്നതും ഇങ്ങനെ പറയുന്നതും
  rationale: പരസ്പരം ബന്ധിപ്പിച്ചിരിക്കുന്ന രണ്ട് ഗ്രീക്ക് കൃദന്തരൂപങ്ങളുടെ പ്രവാഹം മലയാളത്തിലെ സമാന്തര നാമക്രിയാരൂപങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: യോപ്പയിലേക്ക് ആളയച്ച്
  rationale: ἀπόστειλον എന്ന ക്രിയയുടെ കർമം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല. എന്നാൽ മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്ക് അയയ്ക്കുകയും ഒരാളെ വരുത്തുകയും ചെയ്യുന്ന നിർദേശം സ്വാഭാവികമാക്കാൻ പൊതുവായ ‘ആൾ’ ഉപയോഗിച്ചു; പ്രത്യേകമായി ‘പുരുഷന്മാരെ’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: μετάπεμψαι
  choice: വരുത്തുക
  rationale: μεταπέμπομαι എന്നത് ആളയച്ച് ഒരാളെ വിളിച്ചുവരുത്തുക എന്ന ഫലഭാവമുള്ളതാണ്; മുൻപുള്ള ‘ആളയച്ച്’ എന്നതിനൊപ്പം ‘വരുത്തുക’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെ
  rationale: ശിമോനെ പൊതുവേ ഉപയോഗിക്കുന്ന മറ്റൊരു പേരാൽ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് വിശേഷണഘടന നേരിട്ട് നിലനിർത്തുന്നു.
