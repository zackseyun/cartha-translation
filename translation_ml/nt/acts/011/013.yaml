translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യബന്ധം വായനാസൗകര്യത്തിനായി മലയാളത്തിൽ നേരിട്ട് ക്രമപ്പെടുത്തി; ‘ദൂതൻ’ എന്നത് സന്ദർഭത്തിലെ നിർദിഷ്ട ദൂതനെ സൂചിപ്പിക്കുന്നു.
