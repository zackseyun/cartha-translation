id: ACT.11.12
reference: Acts 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: ml
  text: ഒരു വേർതിരിവും കാണിക്കാതെ[a] അവരോടൊപ്പം പോകാൻ ആത്മാവ് എന്നോടു പറഞ്ഞു. ഈ ആറു സഹോദരന്മാരും എന്നോടൊപ്പം വന്നു; ഞങ്ങൾ ആ മനുഷ്യന്റെ വീട്ടിൽ പ്രവേശിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മടിക്കാതെ’ അല്ലെങ്കിൽ ‘സംശയിക്കാതെ.’ ഗ്രീക്ക് കൃതന്തത്തിന് വേർതിരിവു കാണിക്കാതിരിക്കുക എന്നും മടിക്കാതിരിക്കുക അഥവാ സംശയിക്കാതിരിക്കുക എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: ആത്മാവ്
  rationale: വെളിപ്പെടുത്തലിലൂടെയുള്ള മാർഗനിർദേശത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഇത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പാഠത്തിൽ ‘പരിശുദ്ധ’ എന്നു ചേർത്തിട്ടില്ലാത്തതിനാൽ ‘ആത്മാവ്’ എന്ന് തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
- source_word: εἶπεν ... μοι
  choice: എന്നോടു പറഞ്ഞു
  rationale: നിർദേശം അറിയിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; ഗ്രീക്കിലെ പരോക്ഷ കർമവും വാക്കിന്റെ നിർദേശസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: συνελθεῖν αὐτοῖς
  choice: അവരോടൊപ്പം പോകാൻ
  rationale: ഈ സന്ദർഭത്തിൽ συνέρχομαι ആ ആളുകളെ അനുഗമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘അവരോടൊപ്പം പോകാൻ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: μηδὲν διακρίναντα
  choice: ഒരു വേർതിരിവും കാണിക്കാതെ
  rationale: യഹൂദനും വിജാതീയനും തമ്മിൽ വിവേചനം കാണിക്കരുതെന്ന സന്ദർഭസൂചനയെ ഈ പരിഭാഷ മുന്നിൽ കൊണ്ടുവരുന്നു. അതേസമയം, ഗ്രീക്ക് പദത്തിനുള്ള ‘മടിക്കാതെ/സംശയിക്കാതെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: ഈ ആറു സഹോദരന്മാർ
  rationale: οὗτοι എന്ന സൂചനാപദവും ആറു പുരുഷസഹയാത്രികരെ സൂചിപ്പിക്കുന്ന ἀδελφοί എന്ന പദവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰσήλθομεν
  choice: ഞങ്ങൾ ... പ്രവേശിച്ചു
  rationale: അകത്തു കടന്ന പ്രവൃത്തിയെ മാന്യമായ ആഖ്യാനശൈലിയിൽ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: ആ മനുഷ്യന്റെ വീട്ടിൽ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ‘മനുഷ്യൻ/പുരുഷൻ’ എന്ന നാമം സർവനാമമാക്കി മാറ്റാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: μηδὲν διακρίναντα എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഒരു വേർതിരിവും കാണിക്കാതെ
  alternative: മടിക്കാതെ; സംശയിക്കാതെ
  rationale: പത്രോസ് ഒരു വിജാതീയന്റെ വീട്ടിൽ പ്രവേശിച്ചതിനെ ന്യായീകരിക്കുന്ന ഉടൻസന്ദർഭത്തിൽ യഹൂദനും വിജാതീയനും തമ്മിൽ വേർതിരിവു കാണിക്കാതിരിക്കുക എന്ന അർഥം ശക്തമാണ്. എന്നാൽ പ്രയോഗത്തിന് മടിക്കാതിരിക്കുക അഥവാ സംശയിക്കാതിരിക്കുക എന്ന അർഥവും സാധ്യമായതിനാൽ ആ അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല; വാദവിഷയമായ പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
