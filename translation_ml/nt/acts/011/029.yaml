  source_fidelity: മുഖ്യപാഠം ഗ്രീക്കിലെ വിതരണാർഥം (ἕκαστος), വ്യക്തിയുടെ വിഭവങ്ങൾ/സാധ്യതയ്ക്കനുസരിച്ചുള്ള അളവ് (καθὼς εὐπορεῖτό τις), തീരുമാനിക്കൽ (ὥρισαν), യെഹൂദ്യയിൽ വസിക്കുന്ന സഹോദരന്മാർ, സഹായം അയയ്ക്കൽ എന്നിവ കൃത്യമായി അറിയിക്കുന്നു. εἰς διακονίαν ഇവിടെ ക്ഷാമസന്ദർഭത്തിലെ പ്രായോഗിക സഹായമായി ‘സഹായം’ എന്ന് നൽകിയിരിക്കുന്നത് സുരക്ഷിതവും സന്ദർഭോചിതവുമാണ്.
  naturalness: ‘അതിനാൽ ശിഷ്യന്മാർ ഓരോരുത്തരും തങ്ങളുടെ സാമ്പത്തികശേഷിക്കനുസരിച്ച് ... സഹായം അയയ്ക്കാൻ തീരുമാനിച്ചു’ എന്ന വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘സാമ്പത്തികശേഷി’ സന്ദർഭത്തിന് യോജിച്ച പ്രായോഗിക വിശദീകരണമാണ്; അടിക്കുറിപ്പ് കൂടുതൽ വിശാലമായ ‘സാധിക്കുന്നതനുസരിച്ച്’ എന്ന സാധ്യതയും നൽകുന്നു.
