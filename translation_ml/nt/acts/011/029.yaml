id: ACT.11.29
reference: Acts 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: ml
  text: അതിനാൽ ശിഷ്യന്മാർ ഓരോരുത്തരും തങ്ങളുടെ സാമ്പത്തികശേഷിക്കനുസരിച്ച്[a] യെഹൂദ്യയിൽ താമസിക്കുന്ന സഹോദരന്മാർക്ക്[b] സഹായം അയയ്ക്കാൻ തീരുമാനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഓരോരുത്തർക്കും സാധിക്കുന്നതനുസരിച്ച്”; ഗ്രീക്ക് പ്രയോഗത്തിന് “ഓരോരുത്തൻ അഭിവൃദ്ധിപ്പെട്ടിരുന്നതനുസരിച്ച്” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ഇവിടെ യെഹൂദ്യയിലെ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള വിശാലമായ സഹവിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: ശിഷ്യന്മാർ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ യേശുവിന്റെ ശിഷ്യരെയും അനുയായികളെയും സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ പദം.
- source_word: καθὼς εὐπορεῖτό τις
  choice: തങ്ങളുടെ സാമ്പത്തികശേഷിക്കനുസരിച്ച്
  rationale: ഓരോ വ്യക്തിയുടെയും ലഭ്യമായ വിഭവങ്ങൾക്കും സാമ്പത്തികസാധ്യതയ്ക്കും ആനുപാതികമായി എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; εὐπορέω എന്നതിന്റെ സമൃദ്ധി/സാധ്യത എന്ന നിഴലർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὥρισαν
  choice: തീരുമാനിച്ചു
  rationale: ആലോചിച്ചെടുത്ത ഉറച്ച തീരുമാനം എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἕκαστος αὐτῶν
  choice: ഓരോരുത്തരും
  rationale: ഗ്രീക്കിലെ വിതരണാർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘അവരിൽ’ എന്നത് സന്ദർഭത്തിൽ വ്യക്തമായതിനാൽ വേർതിരിച്ച് ചേർക്കേണ്ടതില്ല.
- source_word: εἰς διακονίαν
  choice: സഹായം
  rationale: διακονίαയ്ക്ക് ശുശ്രൂഷ, സേവനം, സഹായം എന്നീ അർഥങ്ങളുണ്ട്; ക്ഷാമസന്ദർഭത്തിൽ യെഹൂദ്യയിലെ വിശ്വാസികൾക്കുള്ള പ്രായോഗിക സഹായമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: πέμψαι
  choice: അയയ്ക്കാൻ
  rationale: ഇൻഫിനിറ്റീവിന്റെ അടിസ്ഥാനാർഥം നേരിട്ട് നൽകുന്നു; അയയ്ക്കപ്പെടുന്നത് ‘സഹായം’ ആണെന്ന് εἰς διακονίανയും സന്ദർഭവും വ്യക്തമാക്കുന്നു.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: യെഹൂദ്യയിൽ താമസിക്കുന്ന
  rationale: പങ്കാളിവാക്യത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἀδελφοῖς
  choice: സഹോദരന്മാർക്ക്
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ആദിമ ക്രൈസ്തവപ്രയോഗത്തിൽ ഇത് വിശ്വാസിസമൂഹത്തെ ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφοῖς എന്ന കുടുംബബന്ധപദം യെഹൂദ്യയിലെ ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കുന്നത്
  choice: സഹോദരന്മാർക്ക്
  alternative: സഹോദരീസഹോദരന്മാർക്ക് / സഹവിശ്വാസികൾക്ക്
  rationale: സ്രോതസ്സിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; അതേസമയം പദം സ്ത്രീകൾ ഉൾപ്പെടുന്ന വിശ്വാസിസമൂഹത്തെയും സൂചിപ്പിക്കാനിടയുണ്ടെന്നത് അടിക്കുറിപ്പിൽ അറിയിച്ച് അർഥസാധ്യത അടച്ചുപൂട്ടുന്നില്ല.
- issue: εἰς διακονίαν എന്നതിന്റെ സന്ദർഭാർഥം
  choice: സഹായം
  alternative: ശുശ്രൂഷയ്ക്കായി / സേവനത്തിനായി
  rationale: മുൻവാക്യങ്ങളിലെ ക്ഷാമപ്രവചനത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇവിടെ പ്രായോഗിക ദുരിതാശ്വാസമാണ് പ്രധാന അർഥം. ‘ശുശ്രൂഷ’ എന്ന വിപുലമായ അർഥം നിർബന്ധിച്ച് ചേർക്കാതെ സന്ദർഭസൂചന നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യം. ‘സാമ്പത്തികശേഷി’ ക്ഷാമസഹായത്തിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു; ‘സഹോദരന്മാർ’ സ്രോതസ്സിന്റെ രൂപം നിലനിർത്തുമ്പോൾ ഉൾക്കൊള്ളുന്ന സമൂഹാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
