revisions:
- from: അവരിൽ അഗബൊസ് എന്നു പേരുള്ള ഒരാൾ എഴുന്നേറ്റുനിന്ന്, വലിയൊരു ക്ഷാമം ജനവാസമുള്ള ലോകം മുഴുവനും[a] വരാനിരിക്കുന്നുവെന്ന് ആത്മാവിലൂടെ അറിയിച്ചു. അത് ക്ലൗദ്യൊസിന്റെ കാലത്ത് സംഭവിച്ചു.
