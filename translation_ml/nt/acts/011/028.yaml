id: ACT.11.28
reference: Acts 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: ml
  text: അവരിൽ അഗബൊസ് എന്നു പേരുള്ള ഒരാൾ എഴുന്നേറ്റ്, വലിയൊരു ക്ഷാമം ജനവാസമുള്ള ലോകമെങ്ങും[a] സംഭവിക്കാനിരിക്കുന്നതായി ആത്മാവിനാൽ അറിയിച്ചു. അത് ക്ലൗദ്യസിന്റെ കാലത്ത് സംഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലോകം മുഴുവൻ.” ലൂക്കാ–പ്രവൃത്തികളിൽ “ജനവാസമുള്ള ലോകം” എന്നത് കൂടുതൽ പ്രത്യേകമായി റോമൻ ലോകത്തെയും സൂചിപ്പിക്കാം.
    reason: οἰκουμένη എന്ന പദത്തിന്റെ ശബ്ദാർഥവും സന്ദർഭത്തിൽ സാധ്യമായ സാമ്രാജ്യത്വപരമായ വ്യാപ്തിയും സംരക്ഷിക്കുന്ന പദവികൽപം.
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: യോഗത്തിനിടയിൽ അഗബൊസ് എഴുന്നേറ്റു സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാത്മക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐσήμανεν
  choice: അറിയിച്ചു
  rationale: σημαίνω എന്നതിന്റെ ‘സൂചിപ്പിക്കുക/അറിയിക്കുക’ എന്ന അർഥം നൽകുകയും, സന്ദർഭത്തിലെ പ്രവചനസ്വഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; എന്നാൽ ഒരു പ്രത്യേക പ്രവചനസൂത്രവാക്യം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: διὰ τοῦ πνεύματος
  choice: ആത്മാവിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമമോ പ്രവർത്തകത്വമോ നേരിട്ട് പ്രകടമാക്കുന്നു; പ്രവൃത്തികളുടെ പുസ്തകത്തിലെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λιμὸν μεγάλην
  choice: വലിയൊരു ക്ഷാമം
  rationale: λιμός എന്നതിന് ‘ക്ഷാമം’ എന്നും μεγάλην എന്നതിന് നേരിട്ട് ‘വലിയ’ എന്നും നൽകി ഗ്രീക്ക് പ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: μέλλειν ἔσεσθαι
  choice: വരാനിരിക്കുന്നുവെന്ന്
  rationale: സംഭവിക്കാനിരിക്കുന്ന ഭാവിയെയും പ്രതീക്ഷിതമായ സമീപഭാവിയെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: ജനവാസമുള്ള ലോകം മുഴുവനും
  rationale: οἰκουμένηയുടെ അടിസ്ഥാനാർഥമായ ‘ജനവാസമുള്ള ലോകം’ നിലനിർത്തുന്നു; അതിനെ മുഖ്യപാഠത്തിൽ ‘റോമൻ ലോകം’ എന്നു മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἥτις ἐγένετο
  choice: അത് ... സംഭവിച്ചു
  rationale: ക്ഷാമത്തെ തിരിച്ചുചൂണ്ടുന്ന ബന്ധവും അത് യഥാർഥത്തിൽ സംഭവിച്ചുവെന്ന പ്രസ്താവനയും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπὶ Κλαυδίου
  choice: ക്ലൗദ്യൊസിന്റെ കാലത്ത്
  rationale: ഭരണാധികാരിയോടു ബന്ധപ്പെട്ട കാലസൂചനയായ ἐπί + genitive എന്ന പ്രയോഗം, മൂലത്തിൽ ഇല്ലാത്ത ‘ഭരണം’ എന്ന പദം ചേർക്കാതെ, ലളിതമായി നൽകുന്നു.
theological_decisions:
- issue: διὰ τοῦ πνεύματος എന്നതിലെ ‘ആത്മാവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിശുദ്ധാത്മാവിനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതായി ‘ആത്മാവ്’ എന്നു വിവർത്തനം ചെയ്തു
  alternative: കുറച്ചുകൂടി അനിശ്ചിതമായ അർഥത്തിൽ ആത്മപ്രേരിതമായ ഒരു അരുളപ്പാട്
  rationale: പ്രവൃത്തികളുടെ പുസ്തകത്തിലെ പ്രവചനസന്ദർഭങ്ങളിൽ നിർദിഷ്ടമായ ‘ആത്മാവ്’ സാധാരണയായി പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ആദരസൂചകമായ ‘ആത്മാവ്’ ഈ സന്ദർഭവിധിയെ പ്രതിഫലിപ്പിക്കുന്നു.
- issue: οἰκουμένηയുടെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ജനവാസമുള്ള ലോകം മുഴുവനും’ എന്ന വിശാലമായ ശബ്ദാർഥം നിലനിർത്തി
  alternative: ‘ലോകം മുഴുവൻ’ അല്ലെങ്കിൽ കൂടുതൽ പരിമിതമായി ‘റോമൻ ലോകം മുഴുവൻ’
  rationale: ഈ പദത്തിന് പൊതുവായി ജനവാസമുള്ള ലോകം എന്നും ലൂക്കാ–പ്രവൃത്തികളിൽ സാമ്രാജ്യത്വലോകം എന്നും അർഥമാകാം. അവ്യക്തത അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കാൻ മുഖ്യപാഠം വിശാലമായ അർഥം സൂക്ഷിക്കുകയും സന്ദർഭപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി. പ്രവചനത്തിന്റെ ദൈവിക മാധ്യമം, വരാനിരിക്കുന്ന ക്ഷാമം, അതിന്റെ ചരിത്രപരമായ നിറവേറൽ എന്നിവ വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്. പേരുകൾ ഗ്രീക്ക് രൂപങ്ങളോട് ചേർന്ന് ‘അഗബൊസ്’, ‘ക്ലൗദ്യൊസ്’ എന്നു ലിപ്യന്തരിച്ചു.
