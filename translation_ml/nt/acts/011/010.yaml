id: ACT.11.10
reference: Acts 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: ml
  text: ഇത് മൂന്നുപ്രാവശ്യം സംഭവിച്ചു; പിന്നെ എല്ലാം വീണ്ടും സ്വർഗത്തിലേക്ക് വലിച്ചെടുക്കപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതെല്ലാം വീണ്ടും സ്വർഗത്തിലേക്ക് എടുക്കപ്പെട്ടു.”
    reason: ἀνεσπάσθη എന്നതിന് ‘വലിച്ചെടുക്കപ്പെട്ടു’ എന്ന ദൃശ്യബിംബം കുറച്ചുകൊണ്ട് ‘എടുക്കപ്പെട്ടു’ എന്നും, ἅπαντα എന്നതിന് ‘അതെല്ലാം’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: τοῦτο
  choice: ഇത്
  rationale: മുമ്പ് വിവരിച്ച സംഭവത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ ‘ദർശനം’ എന്ന് വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അത് കൂട്ടിച്ചേർത്തില്ല.
- source_word: δὲ
  choice: പിന്നെ
  rationale: ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്ന മൃദുവായ ബന്ധകമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: ἐγένετο
  choice: സംഭവിച്ചു
  rationale: ഒരു സംഭവം നടന്നുവെന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπὶ τρίς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: മൂന്നു തവണ ആവർത്തിച്ചുവെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക സമാനരൂപം.
- source_word: ἀνεσπάσθη
  choice: വലിച്ചെടുക്കപ്പെട്ടു
  rationale: പുറത്തുനിന്നുള്ള ശക്തിയാൽ മുകളിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗവും ദൃശ്യബിംബവും നിലനിർത്തുന്നു; പ്രവർത്തകനെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനമോ പഴയ സ്ഥാനത്തേക്കുള്ള മടക്കമോ സൂചിപ്പിക്കുന്ന അർഥം സന്ദർഭാനുസൃതമായി നൽകുന്നു.
- source_word: ἅπαντα
  choice: എല്ലാം
  rationale: എന്തൊക്കെയാണ് ഉൾപ്പെടുന്നതെന്ന് ചുരുക്കാതെ, ഗ്രീക്കിലെ സമഗ്രവും എന്നാൽ നിർവചിക്കപ്പെടാത്തതുമായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: സ്വർഗത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാബോധവും ദർശനസന്ദർഭത്തിൽ οὐρανός സൂചിപ്പിക്കുന്ന സ്വർഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ ദർശനവിവരണത്തിൽ ἅπαντα എന്നതിന്റെ സൂചിതവിഷയം
  choice: ‘എല്ലാം’ എന്ന വിശാലമായ പ്രയോഗം
  alternative: ‘അതെല്ലാം’, ‘മുഴുവനും’, അല്ലെങ്കിൽ ‘എല്ലാ മൃഗങ്ങളും’
  rationale: ഗ്രീക്ക് പദം സമഗ്രമാണെങ്കിലും ഈ വാക്യത്തിൽ കൃത്യമായ സൂചിതവിഷയം വ്യക്തമാക്കുന്നില്ല. ‘എല്ലാം’ എന്നത് പാത്രം, അതിലെ ജീവികൾ, അല്ലെങ്കിൽ ദർശനത്തിലെ മുഴുവൻ ഘടകങ്ങൾ എന്നിവയിൽ ഒന്നിനെ നിർബന്ധമായി തിരഞ്ഞെടുത്ത് വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കർമണിപ്രയോഗം ഗ്രീക്ക് രൂപത്തെയും പരാമർശിക്കപ്പെടാത്ത പ്രവർത്തകനെയും നിലനിർത്തുന്നു.
