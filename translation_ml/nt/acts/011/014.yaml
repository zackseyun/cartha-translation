revisions:
- from: അവൻ നിന്നോടു ചില വാക്കുകൾ പറയും; അവയിലൂടെ നീയും നിന്റെ കുടുംബത്തിലുള്ള എല്ലാവരും രക്ഷിക്കപ്പെടും[a].
  to: അവൻ നിന്നോടു വാക്കുകൾ പറയും; അവയിലൂടെ നീയും നിന്റെ വീട്ടുകാർ എല്ലാവരും രക്ഷിക്കപ്പെടും[a].
  rationale: Removed the unsupported modifier ‘ചില’ and replaced the potentially narrower family-oriented expression with ‘നിന്റെ വീട്ടുകാർ എല്ലാവരും,’ which more accurately preserves the scope of οἶκος. The instrumental nuance, future passive ‘രക്ഷിക്കപ്പെടും,’ and the verse’s theological restraint are retained.
