id: ACT.11.14
reference: Acts 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: ml
  text: അവൻ നിന്നോടു വാക്കുകൾ പറയും; അവയിലൂടെ നീയും നിന്റെ വീട്ടുകാർ എല്ലാവരും രക്ഷിക്കപ്പെടും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവയിൽ’ അല്ലെങ്കിൽ ‘അവ മുഖാന്തരം’; ഗ്രീക്ക് പ്രയോഗം ഈ വാക്കുകൾ രക്ഷ ലഭിക്കുന്നതിനുള്ള മാർഗമാണെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: അവൻ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ദൂതനെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമം. മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്ര വാക്യമായി ‘അവൻ’ എന്നു നൽകി.
- source_word: λαλήσει
  choice: പറയും
  rationale: ഭാവികാലത്തിലുള്ള λαλέω ഇവിടെ സന്ദേശം അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ ആധുനിക മലയാളത്തിൽ ‘പറയും’ സ്വാഭാവികമാണ്.
- source_word: ῥήματα
  choice: ചില വാക്കുകൾ
  rationale: ബഹുവചനമായ ῥήματαയുടെ വ്യക്തമായ ‘വാക്കുകൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; അനിശ്ചിതമായ വാക്കുകളാണെന്ന മലയാളപ്രയോഗം വ്യക്തമാക്കാൻ ‘ചില’ ചേർത്തു.
- source_word: πρὸς σὲ
  choice: നിന്നോടു
  rationale: സംസാരക്രിയയോടുകൂടിയ πρός + accusative കേൾവിക്കാരനിലേക്കുള്ള അഭിമുഖത സൂചിപ്പിക്കുന്നു; ‘നിന്നോടു’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: ἐν οἷς
  choice: അവയിലൂടെ
  rationale: രക്ഷ ലഭിക്കുന്നതിനുള്ള മാർഗമായി ആ വാക്കുകളെ സൂചിപ്പിക്കുന്ന ഉപകരണാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പദശഃ ‘അവയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: σωθήσῃ
  choice: രക്ഷിക്കപ്പെടും
  rationale: σῴζωയുടെ ഭാവികാല കർമണി രൂപവും ഈ സുവിശേഷസന്ദർഭത്തിലെ രക്ഷാസംബന്ധമായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: σὺ
  choice: നീയും
  rationale: ഗ്രീക്കിലെ വ്യക്തമായി നൽകിയ കർത്തൃസർവനാമം സംയുക്തവാക്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: πᾶς ὁ οἶκός σου
  choice: നിന്റെ കുടുംബത്തിലുള്ള എല്ലാവരും
  rationale: οἶκος ഇവിടെ കെട്ടിടമല്ല, വീട്ടുകാരുടെ സമൂഹമാണ്; ‘കുടുംബത്തിലുള്ള എല്ലാവരും’ അതിന്റെ സമഗ്രവും വ്യക്തികേന്ദ്രിതവുമായ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കൊർന്നേല്യൊസിന്റെ കുടുംബസന്ദർഭത്തിലെ രക്ഷയുടെ അർഥം
  choice: ‘രക്ഷിക്കപ്പെടും’ എന്നു പരിഭാഷപ്പെടുത്തി; പ്രഖ്യാപിക്കപ്പെടുന്ന വാക്കുകളിലൂടെ വരുന്ന രക്ഷയെ വാക്യം പറയുന്നതുപോലെ നിലനിർത്തി.
  alternative: ‘വിടുവിക്കപ്പെടും’
  rationale: സമീപസന്ദർഭം സുവിശേഷം കേൾക്കുന്നതും രക്ഷ പ്രാപിക്കുന്നതുമാണ്. രക്ഷയുടെ നടപടിക്രമത്തെക്കുറിച്ച് വാക്യം പറയാത്ത doctrinal വിശദാംശങ്ങൾ ചേർത്തിട്ടില്ല.
- issue: ‘നിന്റെ കുടുംബത്തിലുള്ള എല്ലാവരും’ എന്നതിന്റെ വ്യാപ്തി
  choice: കുടുംബത്തിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന കൂട്ടായ വ്യാപ്തി നിലനിർത്തി; പ്രതികരണമില്ലാതെ സ്വയമേവ രക്ഷ ലഭിക്കുന്നു എന്ന് സൂചിപ്പിച്ചില്ല.
  alternative: ‘നിന്റെ കുടുംബം മുഴുവനും’
  rationale: ഗ്രീക്ക് കുടുംബത്തിന്റെ മുഴുവൻ വ്യാപ്തി പറയുന്നു, എന്നാൽ ഓരോ അംഗത്തിന്റെ പങ്കാളിത്തത്തെക്കുറിച്ചുള്ള എല്ലാ വ്യവസ്ഥകളും ഈ വാക്യത്തിൽ വിശദീകരിക്കുന്നില്ല. അതിനാൽ സഭാവിഭാഗപരമായ നിഗമനം ചേർക്കാതെ ഭാഷാന്തരം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാക്കുകൾ’ എന്ന മൂർത്തമായ ബഹുവചനം നിലനിർത്തുകയും ‘കുടുംബത്തിലുള്ള എല്ലാവരും’ എന്ന് നൽകി οἶκος എന്നതിന്റെ വീട്ടുകാർ/കുടുംബം എന്ന അർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
