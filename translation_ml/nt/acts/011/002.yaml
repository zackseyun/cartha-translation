source:
  edition: SBLGNT
  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് യെരൂശലേമിലേക്കു കയറിച്ചെന്നപ്പോൾ, പരിച്ഛേദനയിൽപ്പെട്ടവർ[a] അദ്ദേഹത്തോടു തർക്കിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരിച്ഛേദനയോടു ബന്ധപ്പെട്ടവർ,” “പരിച്ഛേദനാവിഭാഗക്കാർ,” അല്ലെങ്കിൽ “പരിച്ഛേദനയേറ്റ വിശ്വാസികൾ.” ഗ്രീക്കിൽ പരിച്ഛേദനയുമായുള്ള ബന്ധംകൊണ്ട് ഒരു കൂട്ടത്തെ തിരിച്ചറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ …പ്പോൾ
  rationale: δέ ആഖ്യാനത്തിന്റെ മുന്നോട്ടുള്ള നീക്കത്തോടൊപ്പം നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ …പ്പോൾ’ ഈ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνέβη
  choice: കയറിച്ചെന്നു
  rationale: യെരൂശലേമിലേക്കു പോകുന്നതിനെ ‘മുകളിലേക്കു പോകുക’ എന്നു പറയുന്ന ഗ്രീക്ക് ഭൂമിശാസ്ത്രപരമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: διεκρίνοντο
  choice: തർക്കിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം തുടരുന്ന വാക്കുതർക്കത്തെയോ എതിർപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ വെറും സംശയമല്ല, പത്രോസിനോടുള്ള സജീവമായ വിയോജിപ്പാണ്.
- source_word: πρὸς αὐτόν
  choice: അദ്ദേഹത്തോടു
  rationale: തർക്കത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം πρός ഒരു വ്യക്തിയിലേക്കു തിരിഞ്ഞ വാക്കുതർക്കം വ്യക്തമാക്കുന്നു; ‘അദ്ദേഹത്തോടു’ അനാവശ്യമായി ശത്രുത വർധിപ്പിക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: οἱ ἐκ περιτομῆς
  choice: പരിച്ഛേദനക്കാരിൽപ്പെട്ടവർ
  rationale: അക്ഷരാർഥത്തിൽ പരിച്ഛേദനയുമായുള്ള ബന്ധംകൊണ്ട് തിരിച്ചറിയപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘വിഭാഗം’ അല്ലെങ്കിൽ ഔപചാരിക ‘കക്ഷി’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത ഘടന ചേർക്കാതെ, ഒരു തിരിച്ചറിയാവുന്ന കൂട്ടത്തെ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: οἱ ἐκ περιτομῆς ആരെ സൂചിപ്പിക്കുന്നു
  choice: പരിച്ഛേദനയാൽ തിരിച്ചറിയപ്പെട്ട, പത്രോസിനെ എതിർത്ത വിശ്വാസികളിലെ ആളുകൾ
  alternative: എല്ലാ യെഹൂദവിശ്വാസികളും പൊതുവേ; അല്ലെങ്കിൽ പിൽക്കാല അർഥത്തിലുള്ള ഒരു ഔപചാരിക ‘പരിച്ഛേദനകക്ഷി’
  rationale: വാക്യപ്രയോഗം പരിച്ഛേദനയുമായുള്ള ബന്ധത്താൽ ഒരു കൂട്ടത്തെ തിരിച്ചറിയിക്കുന്നു; എന്നാൽ അത് എല്ലാ യെഹൂദവിശ്വാസികളെയും ഉൾക്കൊള്ളുന്നുവെന്നോ ഔപചാരിക കക്ഷിയായിരുന്നെന്നോ വാചകം തീർച്ചപ്പെടുത്തുന്നില്ല. വിവർത്തനവും അടിക്കുറിപ്പും ഈ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തർക്കിച്ചുകൊണ്ടിരുന്നു’ അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം സൂക്ഷിക്കുന്നു. ‘പരിച്ഛേദനക്കാരിൽപ്പെട്ടവർ’ എന്നത് ഔപചാരിക കക്ഷിയെന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ കൂട്ടതിരിച്ചറിയൽ വ്യക്തമാക്കുന്നു.
