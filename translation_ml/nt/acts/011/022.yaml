id: ACT.11.22
reference: Acts 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: ml
  text: അവരെക്കുറിച്ചുള്ള വാർത്ത യെരൂശലേമിലെ സഭയുടെ ചെവികളിൽ എത്തി[a]. അവർ ബർന്നബാസിനെ അന്ത്യോക്യവരെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെരൂശലേമിലുള്ള സഭ അവരെക്കുറിച്ചുള്ള വാർത്ത കേട്ടു’; അക്ഷരാർഥത്തിൽ, ‘അവരെക്കുറിച്ചുള്ള വാർത്ത യെരൂശലേമിലുള്ള സഭയുടെ ചെവികളിൽ കേൾക്കപ്പെട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη ... εἰς τὰ ὦτα
  choice: ചെവിയിലെത്തി
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ചെവികളിലേക്കു കേൾക്കപ്പെട്ടു’ എന്ന ഗ്രീക്ക് പ്രയോഗം ഒരു വിവരം ശ്രദ്ധയിൽപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. ‘ചെവിയിലെത്തി’ എന്നത് ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു.
- source_word: ὁ λόγος
  choice: വാർത്ത
  rationale: ഇവിടെ λόγος പ്രസംഗമോ ദൈവശാസ്ത്രപരമായ ‘വചനമോ’ അല്ല, അന്ത്യോക്യയിലെ ആളുകളെയും സംഭവങ്ങളെയും സംബന്ധിച്ച വാർത്തയാണ്.
- source_word: τῆς ἐκκλησίας τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിലെ സഭ
  rationale: പങ്കാളിത്തപ്രയോഗത്തെ അർഥനഷ്ടമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ സ്ഥലസൂചക വിശേഷണമായി ചുരുക്കുന്നു.
- source_word: περὶ αὐτῶν
  choice: അവരെക്കുറിച്ചുള്ള
  rationale: ബഹുവചന സർവനാമത്തിന്റെ വ്യക്തിസൂചന നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിലെ ആളുകളെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്, എങ്കിലും അവരുമായി ബന്ധപ്പെട്ട സംഭവങ്ങളും പരിധിയിൽ വരാം.
- source_word: ἐξαπέστειλαν
  choice: അയച്ചു
  rationale: സംഘം ഒരാളെ ഒരു ലക്ഷ്യസ്ഥാനത്തേക്ക് നിയോഗിച്ച് അയച്ചുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘പുറത്തേക്ക് അയച്ചു’ എന്നത് മലയാളത്തിൽ അനാവശ്യമായി ഭാരമുള്ളതാണ്.
- source_word: Βαρναβᾶν
  choice: ബർന്നബാസിനെ
  rationale: വ്യക്തിനാമം മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; കർമവിഭക്തി ചേർക്കുന്നു.
- source_word: ἕως Ἀντιοχείας
  choice: അന്ത്യോക്യവരെ
  rationale: ἕως സൂചിപ്പിക്കുന്ന സ്ഥലപരമായ പരിധി/ലക്ഷ്യം ‘വരെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവർ അയച്ചു’ എന്നതിന്റെ കർത്താവ്
  choice: യെരൂശലേമിലെ സഭയെ കൂട്ടായ്മയായി സൂചിപ്പിക്കുന്ന ‘അവർ’
  alternative: സഭയിലെ അപ്പൊസ്തലന്മാരോ മൂപ്പന്മാരോ പോലുള്ള നിർദിഷ്ട നേതാക്കൾ
  rationale: ഏറ്റവും അടുത്ത വ്യക്തമായ മുൻപദം ‘യെരൂശലേമിലെ സഭ’യാണ്. വാക്യം ഒരു പ്രത്യേക ഭരണസംഘത്തെ പറയാത്തതിനാൽ അതു വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- issue: περὶ αὐτῶν എന്നതിന്റെ സൂചന
  choice: ‘അവരെക്കുറിച്ചുള്ള’ എന്ന് വ്യക്തിസൂചന നിലനിർത്തുന്നു
  alternative: ‘ഈ കാര്യങ്ങളെക്കുറിച്ചുള്ള’ എന്ന് സംഭവങ്ങളെ മാത്രം സൂചിപ്പിക്കുക
  rationale: αὐτῶν വ്യാകരണപരമായി ‘അവർ/അവ’ എന്ന ബഹുവചന സൂചനയാണ്; മുൻസന്ദർഭത്തിലെ വിശ്വാസികളെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. സംഭവങ്ങളിലേക്കുള്ള വിശാലമായ സൂചന പൂർണമായി അസാധ്യമല്ലാത്തതിനാൽ വ്യാഖ്യാനത്തിൽ അത് അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ചെവി-രൂപകം ‘ചെവിയിലെത്തി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിൽ നിലനിർത്തി. തുടക്കത്തിലെ δέ-യ്ക്ക് പ്രത്യേകം ‘ഇപ്പോൾ/എന്നാൽ’ ചേർത്തിട്ടില്ല; ഈ സന്ദർഭത്തിൽ അത് ലഘുവായ കഥനബന്ധമാണ്. ‘അവർ’ എന്ന കൂട്ടായ കർത്താവിനെ വ്യാഖ്യാനിച്ച് നേതാക്കളായി ചുരുക്കിയിട്ടില്ല.
