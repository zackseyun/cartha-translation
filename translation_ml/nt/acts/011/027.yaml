source:
  edition: SBLGNT
  text: Ἐν ταύταις δὲ ταῖς ἡμέραις κατῆλθον ἀπὸ Ἱεροσολύμων προφῆται εἰς Ἀντιόχειαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ പ്രവാചകന്മാർ യെരൂശലേമിൽനിന്ന് അന്ത്യോക്യയിലേക്കു ഇറങ്ങിവന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യെരൂശലേമിൽനിന്ന് അന്ത്യോക്യയിലേക്കു ഇറങ്ങിച്ചെന്നു.” ഗ്രീക്ക് ക്രിയയെ ‘ഇറങ്ങിവന്നു’ എന്നും ‘ഇറങ്ങിച്ചെന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; ലക്ഷ്യസ്ഥാനത്തെത്തുന്ന കാഴ്ചപ്പാടിൽ ‘ഇറങ്ങിവന്നു’ എന്നാണ് മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: കാലസൂചനയായ ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പുനരാവിഷ്കരിക്കുന്നു. δέ ഇവിടെ നേരിയ ആഖ്യാനബന്ധം മാത്രം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേക ബന്ധകപദം ചേർത്തിട്ടില്ല.
- source_word: κατῆλθον
  choice: വന്നിറങ്ങി
  rationale: κατέρχομαι എന്ന ക്രിയയിലെ ‘താഴേക്കു വരുക/പോകുക’ എന്ന ചലനാർഥം നിലനിർത്തുകയും ലക്ഷ്യസ്ഥാനത്തെത്തുന്ന കാഴ്ചപ്പാട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: യെരൂശലേമിൽനിന്ന്
  rationale: ἀπό ഉറവിടസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ രൂപപരമായി ബഹുവചനമായ സ്ഥലനാമം മലയാളത്തിലെ പതിവനുസരിച്ച് ഏകവചന സ്ഥലനാമമായി നൽകിയിരിക്കുന്നു.
- source_word: προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: ആദ്യകാല സഭയിലെ ഇവരുടെ ശുശ്രൂഷയുടെ കൃത്യമായ പരിധി വാക്യം നിർവചിക്കുന്നില്ല; അതിനാൽ പൊതുവായ പദം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: εἰς Ἀντιόχειαν
  choice: അന്ത്യോക്യയിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ചലനം നഗരനാമത്തോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേം–അന്ത്യോക്യ സഭാപശ്ചാത്തലത്തിലെ ‘പ്രവാചകന്മാർ’ എന്നവരുടെ സ്വഭാവം
  choice: προφῆται എന്നത് ‘പ്രവാചകന്മാർ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പ്രവചനവരം ലഭിച്ച ഉപദേഷ്ടാക്കൾ’ അല്ലെങ്കിൽ ‘ദൈവപ്രചോദിത സന്ദേശവാഹകർ’
  rationale: മൂലപദം ഇവരെ പഴയനിയമ മാതൃകയിലുള്ള അധികാരമുള്ള പ്രവാചകരായോ കേവലം പ്രസംഗകരായോ പരിമിതപ്പെടുത്തുന്നില്ല. വിശ്വാസവിഭാഗപരമായ നിർവചനം ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ വിശാലമായ പദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾക്ക് മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ ‘യെരൂശലേം’, ‘അന്ത്യോക്യ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ ലഘുവായ δέ അനാവശ്യമായി ശക്തിപ്പെടുത്തിയിട്ടില്ല.
