  to: 'എന്നാൽ ഞാൻ പറഞ്ഞു: ‘ഒരിക്കലും പാടില്ല, കർത്താവേ! കാരണം സാധാരണമായതോ[a] അശുദ്ധമായതോ ആയ യാതൊന്നും ഒരിക്കലും എന്റെ വായിൽ കടന്നിട്ടില്ല.’'
