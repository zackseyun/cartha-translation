review_pass:
  verdict: revise
  source_fidelity: The draft retains the emphatic refusal, the causal ὅτι clause, the distinct terms κοινόν and ἀκάθαρτον joined by ἤ, and the literal ‘entered my mouth’ expression. However, ‘പൊതുവായത്’ is not idiomatic Malayalam in this nominal use and does not naturally communicate the ritual sense of κοινόν without substantial reader difficulty.
  naturalness: ‘പൊതുവായത് അല്ലെങ്കിൽ അശുദ്ധമായത് ഒന്നും’ is grammatically understandable but unnatural in modern standard Malayalam. ‘സാധാരണമായതോ അശുദ്ധമായതോ ആയ യാതൊന്നും’ reads naturally while retaining the two distinct Greek descriptors. ‘ഒരിക്കലും പാടില്ല’ is a natural, forceful equivalent for Μηδαμῶς in Peter’s refusal.
  terminology: Retain ‘കർത്താവേ’ for κύριε and ‘അശുദ്ധമായത്’ for ἀκάθαρτον. Render κοινόν as ‘സാധാരണമായത്’ and explain in a footnote that it carries a ritual sense here; this avoids conflating it with ἀκάθαρτον while avoiding the unnatural ‘പൊതുവായത്.’
  issues:
  - severity: medium
    issue: ‘പൊതുവായത്’ is an unnatural rendering of κοινόν in this Malayalam sentence.
    rationale: Although formally related to ‘common,’ it is not the usual natural adjective here and can obscure the cultic/ritual distinction that the footnote seeks to preserve.
  - severity: low
    issue: The emphatic negative can be more idiomatically expressed.
    rationale: ‘ഒരിക്കലുമില്ല’ is intelligible, but ‘ഒരിക്കലും പാടില്ല’ better conveys Peter’s strong refusal in contemporary Malayalam without altering the sense.
