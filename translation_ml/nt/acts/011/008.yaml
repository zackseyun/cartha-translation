id: ACT.11.8
reference: Acts 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ പറഞ്ഞു: ‘ഒരിക്കലും പാടില്ല, കർത്താവേ! കാരണം സാധാരണമായതോ[a] അശുദ്ധമായതോ ആയ യാതൊന്നും ഒരിക്കലും എന്റെ വായിൽ കടന്നിട്ടില്ല.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സാധാരണമായത്’—ഗ്രീക്കിൽ ഇവിടെ ആചാരപരമായി പൊതുവായതോ അശുദ്ധമായതോ എന്നു കണക്കാക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്ന പദം; തുടർന്ന് വരുന്ന ‘അശുദ്ധമായത്’ എന്നതിൽനിന്ന് ഇതിനെ വേർതിരിച്ചിരിക്കുന്നു.
    reason: κοινόν എന്ന പദത്തിന്റെ സന്ദർഭാനുസൃതമായ ആചാരപരമായ സൂചന വ്യക്തമാക്കുകയും ἀκάθαρτον എന്ന വേറിട്ട പദവുമായി അതിനെ ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: Μηδαμῶς
  choice: ഒരിക്കലുമില്ല
  rationale: ശക്തമായ നിഷേധത്തെ സ്വാഭാവികവും ഊന്നലുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള സംബോധനരൂപം നിലനിർത്തുന്നു; ഇവിടെ അഭിസംബോധിതന്റെ തിരിച്ചറിയൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ὅτι
  choice: കാരണം
  rationale: പത്രൊസിന്റെ വിസമ്മതത്തിനുള്ള കാരണം വ്യക്തമാക്കുന്ന മൂലപാഠത്തിലെ causal ബന്ധം നിലനിർത്തുന്നു.
- source_word: κοινὸν
  choice: പൊതുവായത്
  rationale: κοινός എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുകയും ആചാരപരമായി അശുദ്ധമെന്ന് കണക്കാക്കപ്പെട്ടത് എന്ന സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀκάθαρτον
  choice: അശുദ്ധമായത്
  rationale: ആചാരശുദ്ധിയുമായി ബന്ധപ്പെട്ട ഉറവിടപദത്തിന്റെ സാധാരണവും പ്രസക്തവുമായ മലയാളരൂപം.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: എന്റെ വായിൽ കടന്നിട്ടില്ല
  rationale: മൂലപാഠത്തിലെ ദൃശ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ‘ഞാൻ ഭക്ഷിച്ചിട്ടില്ല’ എന്ന് വ്യാഖ്യാനാത്മകമായി മാറ്റുന്നില്ല.
theological_decisions:
- issue: κοινὸν, ἀκάθαρτον എന്നീ പദങ്ങളുടെ ബന്ധം
  choice: ‘പൊതുവായത് അല്ലെങ്കിൽ അശുദ്ധമായത്’ എന്ന് രണ്ടു പദങ്ങളും വേർതിരിച്ച് നിലനിർത്തി
  alternative: ‘ആചാരപരമായി അശുദ്ധമായ ഒന്നും’ എന്ന് ഏകീകരിക്കുക
  rationale: മൂലഗ്രീക്കിലെ രണ്ട് വിശേഷണങ്ങളും ἢ (‘അല്ലെങ്കിൽ’) എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു; അവയുടെ സൂക്ഷ്മമായ വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ ശക്തമായ നിഷേധം, കാരണബന്ധം, ‘വായിൽ കടക്കുക’ എന്ന രൂപകം എന്നിവ നിലനിർത്തി.
