review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s recollection, the Lord’s saying, John’s water baptism, and the future baptism in the Holy Spirit. The main-text rendering ‘പരിശുദ്ധാത്മാവിൽ’ rightly preserves the locative sense of ἐν, while the footnote retains the viable instrumental alternative.
  naturalness: ‘സ്നാനം കഴിക്കപ്പെടും’ is a mechanically passive construction and is not idiomatic modern standard Malayalam in this context. ‘സ്നാനം ഏൽക്കും’ is the natural formal Malayalam expression for receiving baptism and adequately conveys the Greek future passive.
  terminology: ‘കർത്താവ്,’ ‘വചനം,’ ‘യോഹന്നാൻ,’ and ‘പരിശുദ്ധാത്മാവ്’ are established, clear, and suitably formal Malayalam biblical terms. ‘വെള്ളംകൊണ്ട് സ്നാനം കഴിപ്പിച്ചു’ appropriately represents baptism with water.
  issues:
  - severity: medium
    issue: Unnatural passive in the final clause
    rationale: The Greek βαπτισθήσεσθε is future passive, but the Malayalam ‘സ്നാനം കഴിക്കപ്പെടും’ is awkward and can sound like an impersonal bureaucratic passive. ‘സ്നാനം ഏൽക്കും’ is idiomatic and preserves that the recipients receive, rather than administer, baptism.
  revised_text: 'അപ്പോൾ കർത്താവിന്റെ വചനം ഞാൻ ഓർത്തു; അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിരുന്നു: “യോഹന്നാൻ വെള്ളംകൊണ്ട് സ്നാനം കഴിപ്പിച്ചു; എന്നാൽ നിങ്ങൾ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനം ഏൽക്കും.”'
