id: ACT.11.16
reference: Acts 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: ml
  text: 'അപ്പോൾ കർത്താവിന്റെ വചനം ഞാൻ ഓർത്തു; അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിരുന്നു: “യോഹന്നാൻ വെള്ളംകൊണ്ട് സ്നാനം കഴിപ്പിച്ചു; എന്നാൽ നിങ്ങൾ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനം ഏൽക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരിശുദ്ധാത്മാവിനാൽ.” ഗ്രീക്കിലെ ἐν എന്ന പദം ഇവിടെ “-യിൽ” എന്നോ “-യാൽ” എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: ഞാൻ ഓർത്തു
  rationale: ക്രിയ രൂപത്തിൽ മധ്യ/നിഷ്ക്രിയ സ്വഭാവമുള്ളതായിരുന്നാലും ഇവിടെ സജീവ അർഥത്തിലാണ്; സ്വാഭാവികമായ മലയാളം പ്രയോഗം.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ശക്തമായ വിരോധമല്ല, വിവരണത്തിലെ അടുത്ത ഘട്ടമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: കർത്താവിന്റെ വചനം
  rationale: ῥῆμα ഇവിടെ ഓർക്കപ്പെടുന്ന ഉച്ചരിക്കപ്പെട്ട വാക്കിനെയോ അരുളപ്പാടിനെയോ സൂചിപ്പിക്കുന്നു; κύριος എന്നതിന്റെ അധികാരപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം ‘കർത്താവ്’ നിലനിർത്തുന്നു.
- source_word: ὡς ἔλεγεν
  choice: അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ പശ്ചാത്തലസ്വഭാവം ‘പറഞ്ഞിരുന്നു’ നിലനിർത്തുന്നു; ‘പതിവായി പറയുമായിരുന്നു’ എന്ന തെളിവില്ലാത്ത ആവർത്തനാർഥം ചേർക്കുന്നില്ല. കർത്താവിനെ മാന്യമായി പരാമർശിക്കാൻ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു.
- source_word: Ἰωάννης
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ നാമരൂപം.
- source_word: μὲν ... δὲ
  choice: …; എന്നാൽ …
  rationale: യോഹന്നാന്റെ ജലസ്നാനവും ശ്രോതാക്കൾക്കു ലഭിക്കാനിരിക്കുന്ന ആത്മസ്നാനവും തമ്മിലുള്ള വിരോധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐβάπτισεν ὕδατι
  choice: വെള്ളംകൊണ്ട് സ്നാനം കഴിപ്പിച്ചു
  rationale: സകർമകമായ ἐβάπτισεν-നെയും ὕδατι എന്ന ഉപകരണാർഥ ദത്തിയെയും വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന സർവനാമം യോഹന്നാനോടുള്ള വിരോധത്തിൽ ശ്രോതാക്കളെ മുൻനിർത്തുന്നു.
- source_word: βαπτισθήσεσθε
  choice: സ്നാനം കഴിക്കപ്പെടും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥാനപരമായ സാധ്യത പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു; ഉപകരണ/സഹചാരാർഥമായ മറ്റൊരു സാധുവായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ഇവിടെ യേശുവിന്റെ അധികാരമുള്ള അരുളപ്പാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കർത്താവ്’ സാധാരണവും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമായ രൂപമാണ്.
- issue: ἐν πνεύματι ἁγίῳ എന്നതിലെ ἐν
  choice: പരിശുദ്ധാത്മാവിൽ
  alternative: പരിശുദ്ധാത്മാവിനാൽ / പരിശുദ്ധാത്മാവുകൊണ്ട്
  rationale: ഗ്രീക്ക് ἐν ഇവിടെ സ്ഥാനപരമായോ ഉപകരണാർഥമായോ ഗ്രഹിക്കാം. പ്രധാന പാഠം ‘-യിൽ’ സ്വീകരിക്കുമ്പോൾ മറ്റൊരു യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഉദ്ധരണിയിലെ നിഷ്ക്രിയരൂപവും ἐν എന്നതിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യതയും നിലനിർത്തി.
