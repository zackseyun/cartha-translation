  to: 'അപ്പോൾ കർത്താവിന്റെ വചനം ഞാൻ ഓർത്തു; അവിടുന്ന് ഇങ്ങനെ പറഞ്ഞിരുന്നു: “യോഹന്നാൻ വെള്ളംകൊണ്ട് സ്നാനം കഴിപ്പിച്ചു; എന്നാൽ നിങ്ങൾ പരിശുദ്ധാത്മാവിൽ[a] സ്നാനം ഏൽക്കും.”'
  rationale: Only the Malayalam rendering of the future passive has been adjusted for idiomatic modern usage. The revised wording retains the source’s future orientation and recipient-focused passive sense, and it leaves the debated locative/instrumental force of ἐν unresolved through the existing footnote.
