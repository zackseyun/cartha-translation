  text: ἀρξάμενος ⸀δὲ Πέτρος ἐξετίθετο αὐτοῖς καθεξῆς λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/004.yaml
  text: But Peter began and explained it to them in order[a], saying,
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് തുടങ്ങി, അവർക്കു ക്രമമായി വിവരിച്ചുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞു:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξάμενος
  choice: വിശദീകരിച്ചുതുടങ്ങി
  rationale: പ്രധാന ക്രിയയോടു ചേർന്ന ക്രിയാവിശേഷണസ്വഭാവമുള്ള ഭൂതകാല മധ്യമ വർത്തമാനകൃത്ത് രൂപത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംയുക്തക്രിയയായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കുറ്റാരോപണത്തിൽനിന്ന് പത്രോസിന്റെ മറുപടിയിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും മാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപം.
- source_word: ἐξετίθετο
  choice: വിശദീകരിച്ചു
  rationale: ഒരു കാര്യം മുന്നോട്ടുവെച്ച് വിവരിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ἀρξάμενος-നോടു ചേർന്ന സംയുക്തപ്രയോഗത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: പത്രോസിനോടു സംസാരിച്ചവരെ സൂചിപ്പിക്കുന്ന ബഹുവചന ദത്തിവിഭക്തിയുടെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: καθεξῆς
  choice: കാര്യങ്ങൾ ക്രമമായി
  rationale: സംഭവങ്ങളെ ഒന്നിനു പിന്നാലെ ക്രമത്തിൽ വിവരിച്ചു എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ആരംഭബിന്ദുവിനെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: λέγων
  choice: ':'
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള പ്രസംഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പരിചയപ്പെടുത്താൻ ഉദ്ധരണിക്ക് മുൻപുള്ള ദ്വിബിന്ദു ഉപയോഗിക്കുന്നു; ‘പറഞ്ഞുകൊണ്ട്’ എന്ന കൃത്രിമ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ക്രമാനുസൃത വിവരണത്തിന്റെ ആശയം നിലനിർത്തുകയും ‘ആദിമുതൽ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം ഒഴിവാക്കുകയും ചെയ്തു.
