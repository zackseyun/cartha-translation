source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: ml
  text: അപ്പൊസ്തലന്മാരും യെഹൂദ്യയിലുടനീളമുള്ള സഹോദരന്മാരും വിജാതീയരും ദൈവവചനം സ്വീകരിച്ചിരുന്നെന്നു കേട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരും സഹോദരിമാരും’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ പദം സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: കേട്ടു
  rationale: വാർത്ത അറിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന ἀκούω എന്ന ക്രിയയുടെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷ.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, ആഖ്യാനത്തിലെ മൃദുവായ മാറ്റമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വാക്യക്രമം തന്നെയാണ് ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നത്.
- source_word: οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: യെഹൂദ്യയിലുടനീളം ഉണ്ടായിരുന്ന അപ്പൊസ്തലന്മാരും സഹോദരന്മാരും
  rationale: κατάയുടെ വിതരണാർഥം ‘യിലുടനീളം’ എന്നു നിലനിർത്തുന്നു; ‘അപ്പൊസ്തലന്മാർ’, ‘സഹോദരന്മാർ’ എന്നിവ സ്ഥാപിതമായ ബൈബിൾ പ്രയോഗങ്ങളാണ്.
- source_word: καὶ τὰ ἔθνη
  choice: ജനതകളും
  rationale: ἔθνη ഇവിടെ യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ മൂലപദത്തിന്റെ കൂട്ടായ-വംശീയ അർഥം നിലനിർത്തുന്നു; ചേർന്ന ‘-ഉം’ καίയുടെ ‘കൂടി/also’ ഊന്നൽ വഹിക്കുന്നു.
- source_word: ἐδέξαντο
  choice: സ്വീകരിച്ചു
  rationale: ദൈവത്തിന്റെ സന്ദേശത്തെ അനുകൂലമായി കൈക്കൊണ്ടുവെന്ന δέχομαιയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിൽനിന്നുള്ള പ്രസംഗിക്കപ്പെട്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സംക്ഷിപ്തവുമായ മലയാള ബൈബിൾ പ്രയോഗം.
theological_decisions:
- issue: ἀδελφοὶ എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ പ്രതിനിധിപരമായ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗരൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ ഇത് വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്നതാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: τὰ ἔθνηയുടെ സന്ദർഭാർഥം
  choice: ജനതകൾ
  alternative: വിജാതീയർ; യഹൂദരല്ലാത്തവർ
  rationale: യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് സന്ദർഭം ഉദ്ദേശിക്കുന്നത്; ‘ജനതകൾ’ മൂലത്തിലെ ബഹുവചനവും ഉൾപ്പെടുത്തലിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. δέയ്ക്ക് നിർബന്ധിതമായ ഒരു ആരംഭബന്ധകപദം ചേർത്തിട്ടില്ല. ‘യെഹൂദ്യയിലുടനീളം’ എന്ന പ്രയോഗം ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
