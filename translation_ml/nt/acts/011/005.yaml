revisions:
- from: '“ഞാൻ യോപ്പാ നഗരത്തിൽ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു. അപ്പോൾ ഒരു മയക്കാവസ്ഥയിൽ ഞാൻ ഒരു ദർശനം കണ്ടു: വലിയൊരു വിരിപ്പുപോലെയുള്ള ഏതോ ഒരു വസ്തു[a], അതിന്റെ നാലു കോണുകളിലായി സ്വർഗത്തിൽനിന്ന് താഴേക്കിറക്കപ്പെടുകയായിരുന്നു[b]. അത് എന്റെ അടുക്കൽവരെ വന്നു.”'
  to: '“ഞാൻ യോപ്പാ നഗരത്തിൽ പ്രാർഥിച്ചുകൊണ്ടിരിക്കെ, ഒരു മയക്കാവസ്ഥയിൽ ഒരു ദർശനം കണ്ടു: വലിയൊരു വിരിപ്പുപോലെയുള്ള ഏതോ ഒരു വസ്തു[a] നാലു കോണുകളിൽനിന്ന് പിടിച്ച് സ്വർഗത്തിൽനിന്ന് താഴേക്കിറക്കപ്പെടുകയായിരുന്നു[b]; അത് എന്റെ അടുക്കൽവരെ വന്നു.”'
  rationale: നാലു കോണുകളുടെ പങ്ക് വ്യാകരണപരമായും ദൃശ്യപരമായും വ്യക്തമായി നിലനിർത്താൻ പ്രധാനപാഠം തിരുത്തി. അതനുസരിച്ച് അടിക്കുറിപ്പും പൂർണവാക്യമായി പരിഷ്കരിച്ചു. മറ്റെല്ലാ തിരഞ്ഞെടുപ്പുകളും മൂലഗ്രീക്കിനോടും ആധുനിക മാന്യമായ മലയാളപ്രയോഗത്തോടും യോജിച്ചവയാണ്.
