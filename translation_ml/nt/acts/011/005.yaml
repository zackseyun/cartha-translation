id: ACT.11.5
reference: Acts 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: ml
  text: '“ഞാൻ യോപ്പാ നഗരത്തിൽ പ്രാർഥിച്ചുകൊണ്ടിരിക്കെ, ഒരു മയക്കാവസ്ഥയിൽ ഒരു ദർശനം കണ്ടു: വലിയൊരു വിരിപ്പുപോലെയുള്ള ഏതോ ഒരു വസ്തു[a] നാലു കോണുകളിൽനിന്ന് പിടിച്ച് സ്വർഗത്തിൽനിന്ന് താഴേക്കിറക്കപ്പെടുകയായിരുന്നു[b]; അത് എന്റെ അടുക്കൽവരെ വന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏതോ ഒരു പാത്രം.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് വസ്തു, ഉപകരണം, പാത്രം എന്നിങ്ങനെ വിശാലമായ അർഥങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നാലു കോണുകളാൽ സ്വർഗത്തിൽനിന്ന് താഴേക്കിറക്കപ്പെട്ടുകൊണ്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: ഞാൻ യോപ്പാ നഗരത്തിൽ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: πόλει എന്ന ‘നഗരം’ നിലനിർത്തുകയും, പ്രാർഥന തുടരുന്ന പ്രവൃത്തിയാണെന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ἐκστάσει
  choice: ഒരു മയക്കാവസ്ഥയിൽ
  rationale: സാധാരണ ബോധാവസ്ഥയിൽനിന്ന് മാറിയ ദർശനാനുഭവത്തെ സൂചിപ്പിക്കുന്നു; ‘പരമാനന്ദം’ പോലുള്ള വികാരപരമോ പിൽക്കാല മിസ്റ്റിക് അർഥമുള്ളതോ ആയ പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: ὅραμα
  choice: ഒരു ദർശനം
  rationale: ദൈവിക വെളിപ്പാടുമായി ബന്ധപ്പെട്ട കാഴ്ചയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിലും പൊതുവായ ആധുനിക ഉപയോഗത്തിലും വ്യക്തമായ പദമാണ്.
- source_word: σκεῦός τι
  choice: ഏതോ ഒരു വസ്തു
  rationale: σκεῦος പാത്രം, ഉപകരണം, വസ്തു എന്നിങ്ങനെ വിശാലമായി ഉപയോഗിക്കാവുന്നതിനാൽ അതിനെ അനാവശ്യമായി പ്രത്യേകതയുള്ള ‘പാത്രം’ എന്നു നിശ്ചയിക്കുന്നില്ല; തുടർന്നുള്ള ഉപമ അതിന്റെ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ὡς ὀθόνην μεγάλην
  choice: വലിയൊരു വിരിപ്പുപോലെയുള്ള
  rationale: ὀθόνη സൂചിപ്പിക്കുന്ന വലിയ തുണിവിരിപ്പിന്റെ ദൃശ്യരൂപം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ചണ’ അല്ലെങ്കിൽ ‘ലിനൻ’ എന്ന വസ്തുഗുണം ചേർക്കുന്നില്ല.
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: അതിന്റെ നാലു കോണുകളിലായി സ്വർഗത്തിൽനിന്ന് താഴേക്കിറക്കപ്പെടുകയായിരുന്നു
  rationale: നാല് അറ്റങ്ങൾ/കോണുകൾ, സ്വർഗത്തിൽനിന്നുള്ള ദിശ, നിഷ്ക്രിയമായി താഴെയിറക്കപ്പെടുന്ന പ്രവൃത്തി എന്നിവ നിലനിർത്തുന്നു. ‘അതിന്റെ’ എന്നത് മലയാളത്തിൽ ദൃശ്യബന്ധം വ്യക്തമാക്കാനുള്ള സ്വാഭാവിക ചേർക്കലാണ്.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: അത് എന്റെ അടുക്കൽവരെ വന്നു
  rationale: ἄχρι സൂചിപ്പിക്കുന്ന ‘എന്റെ സ്ഥാനംവരെ’ എന്ന പരിധി വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκστάσει, ὅραμα എന്നീ രണ്ടു ദർശനപദങ്ങളുടെ ബന്ധം
  choice: ഒരു മയക്കാവസ്ഥയിൽ ഞാൻ ഒരു ദർശനം കണ്ടു
  alternative: പരവശതയിൽ ഞാൻ ഒരു ദർശനം കണ്ടു
  rationale: പത്രോസിന്റെ മാറിയ ബോധാവസ്ഥയും അതിനുള്ളിൽ കണ്ട ദർശനവും രണ്ടു വ്യത്യസ്ത ഘടകങ്ങളായി നിലനിർത്തുന്നു; ‘പരവശത’ നൽകാവുന്ന വികാരപരമോ മിസ്റ്റിക് സ്വരമോ ഒഴിവാക്കുന്നു.
- issue: ἐκ τοῦ οὐρανοῦ എന്നതിന്റെ അർഥം
  choice: സ്വർഗത്തിൽനിന്ന്
  alternative: ആകാശത്തുനിന്ന്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ οὐρανός കേവലം ദൃശ്യമായ ആകാശത്തേക്കാൾ സ്വർഗീയ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; എങ്കിലും ആരാണ് വസ്തുവിനെ ഇറക്കുന്നതെന്ന് വാക്യം പറയാത്തതിനാൽ കർത്താവിനെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദർശനവിവരണത്തിന്റെ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം സംസ്കൃതാഭിമുഖമായ പദപ്രയോഗം ഒഴിവാക്കി. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
