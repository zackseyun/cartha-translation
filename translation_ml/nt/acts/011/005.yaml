  verdict: revise
  source_fidelity: 'പ്രധാന അർഥം നന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്: യോപ്പാ നഗരം, പ്രാർഥന, ἐκστάσει-ὅραμα എന്ന ഇരട്ട ദർശനഭാഷ, അവ്യക്തമായ σκεῦός τι, സ്വർഗത്തിൽനിന്നുള്ള ഇറക്കം, പത്രോസിന്റെ അടുക്കലേക്കുള്ള വരവ് എന്നിവയെല്ലാം ഉണ്ട്. എന്നാൽ ‘അതിന്റെ നാലു കോണുകളിലായി’ എന്നത് വസ്തുവിന്റെ കോണുകളിൽ സ്ഥാനം എന്ന അർഥത്തിലേക്കു മാറുന്നു; τέσσαρσιν ἀρχαῖς എന്നതിലെ ‘നാലു കോണുകളിൽനിന്ന്/നാലു കോണുകളാൽ പിടിച്ച്’ എന്ന ഇറക്കലിന്റെ രീതി വ്യക്തമാക്കണം.'
  naturalness: ‘പ്രാർഥിച്ചുകൊണ്ടിരിക്കെ’ എന്ന ബന്ധരൂപം മൂലത്തിലെ സമകാലിക പ്രവർത്തിയെ സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘ഒരു മയക്കാവസ്ഥയിൽ’ ആധുനിക മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതാണ്; ഇവിടെ അത് ലഹരിയെയല്ല, സാധാരണബോധത്തിൽനിന്നു വ്യത്യസ്തമായ ദർശനാവസ്ഥയെയാണു സൂചിപ്പിക്കുന്നത്. ‘വലിയൊരു വിരിപ്പുപോലെയുള്ള ഏതോ ഒരു വസ്തു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
