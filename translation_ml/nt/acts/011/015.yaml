revisions:
- from: ഞാൻ സംസാരിച്ചു തുടങ്ങുമ്പോൾ[a], ആദിയിൽ ഞങ്ങളുടെമേൽ വന്നതുപോലെതന്നെ പരിശുദ്ധാത്മാവ് അവരുടെമേലും വന്നു.
  to: ഞാൻ സംസാരിക്കാൻ തുടങ്ങുമ്പോൾ[a], പരിശുദ്ധാത്മാവ് ആദ്യത്തിൽ ഞങ്ങളുടെമേൽ വന്നതുപോലെതന്നെ അവരുടെമേലും വന്നു.
  rationale: ‘ആദിയിൽ’ എന്നത് ‘ആദ്യത്തിൽ’ എന്നാക്കി, സന്ദർഭത്തിലെ മുൻകാല ആരംഭത്തെ വ്യക്തമാക്കുകയും സൃഷ്ടിയുമായി ബന്ധപ്പെട്ട സാധാരണ അനുനാദം ഒഴിവാക്കുകയും ചെയ്തു. വാക്യക്രമം താരതമ്യത്തെ കൂടുതൽ സ്വാഭാവികമായി ഒഴുക്കുന്നു; അർഥത്തിൽ മാറ്റമില്ല. അടിക്കുറിപ്പ് മുഖ്യവാക്യത്തിലെ ‘as/when’ സമയസൂചനയ്ക്കുള്ള യഥാർഥ മലയാള വ്യത്യാസം നൽകുന്നവിധം തിരുത്തി.
