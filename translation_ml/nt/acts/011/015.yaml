source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: ml
  text: ഞാൻ സംസാരിക്കാൻ തുടങ്ങുമ്പോൾ[a], പരിശുദ്ധാത്മാവ് ആദ്യത്തിൽ ഞങ്ങളുടെമേൽ വന്നതുപോലെതന്നെ അവരുടെമേലും വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ സംസാരിക്കാൻ തുടങ്ങിയപ്പോൾ.’ ഗ്രീക്ക് ഘടനയെ ‘തുടങ്ങുമ്പോൾ’ എന്നും ‘തുടങ്ങിയപ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: ഞാൻ സംസാരിച്ചു തുടങ്ങുമ്പോൾ
  rationale: ἐν + articular infinitive ഇവിടെ സമകാലികമായ സമയം സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചു തുടങ്ങുമ്പോൾ’ എന്നത് പ്രവൃത്തി ആരംഭിച്ച വേളയിൽത്തന്നെ ആത്മാവ് വന്നുവെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λαλεῖν
  choice: സംസാരിച്ചു
  rationale: പത്രോസ് സദസ്സിനോട് സംസാരിക്കുന്ന പ്രവൃത്തിയെയാണ് λαλέω ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘സംസാരിക്കുക’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: ἐπέπεσεν
  choice: വന്നു
  rationale: ആത്മാവ് ആളുകളുടെമേൽ ശക്തമായി വന്നതിനെ സൂചിപ്പിക്കുന്ന ἐπιπίπτω എന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ ‘മേൽ വന്നു’ എന്ന് സ്വാഭാവികമായി പറയാം. ‘വീണു’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ അനാവശ്യമായ ഭൗതികഭാവം സൃഷ്ടിക്കാം.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ഗ്രീക്ക് പദവിയുടെ കൃത്യവും ആധുനിക മലയാളത്തിൽ വ്യാപകമായി മനസ്സിലാകുന്നതുമായ രൂപം.
- source_word: ἐπ’ αὐτούς
  choice: അവരുടെമേലും
  rationale: ἐπίയുടെ ദിശാസംബന്ധം നിലനിർത്തുന്നു; καί സൂചിപ്പിക്കുന്ന ഉൾപ്പെടുത്തൽ ‘ഉം’ മുഖേന പ്രകടമാക്കുന്നു.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: ഞങ്ങളുടെമേൽ വന്നതുപോലെതന്നെ
  rationale: ὥσπερ സൂചിപ്പിക്കുന്ന കൃത്യമായ താരതമ്യം ‘പോലെതന്നെ’ കൊണ്ട് നൽകുന്നു; മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘വന്നു’ ആവർത്തിക്കുന്നു.
- source_word: ἐν ἀρχῇ
  choice: ആദിയിൽ
  rationale: സൃഷ്ടിയുടെ ആരംഭം എന്ന നിർബന്ധിത അർഥം ചുമത്താതെ, ശിഷ്യന്മാരുടെ ആദ്യ ആത്മാനുഭവത്തിലേക്കുള്ള പൊതുവായ കാലസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν ἀρχῇ (‘ആദിയിൽ’) എന്നതിന്റെ സൂചിത സംഭവം
  choice: വിവർത്തനത്തിൽ പൊതുവായ കാലസൂചനയായി ‘ആദിയിൽ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ശിഷ്യന്മാരുടെമേലുള്ള ആത്മാവിന്റെ ആദ്യ പകർച്ചയെ, സാധ്യതയേറിയവിധം പെന്തെക്കൊസ്തിനെ, സൂചിപ്പിക്കുന്നു.
  alternative: ഒരു നിർദിഷ്ട സംഭവത്തെ ചൂണ്ടിക്കാണിക്കാതെ പൊതുവായി ‘ആദ്യത്തിൽ’ എന്നു മാത്രം ഗ്രഹിക്കുക.
  rationale: പത്രോസ് ‘അവരുടെമേൽ’ സംഭവിച്ചതിനെ ‘ഞങ്ങളുടെമേൽ’ ആദിയിൽ സംഭവിച്ചതുമായി താരതമ്യം ചെയ്യുന്നു. പെന്തെക്കൊസ്ത് സാധ്യതയേറിയ സൂചിതസംഭവമാണെങ്കിലും, മൂലപാഠം ഇവിടെ അതിന്റെ പേര് പറയാത്തതിനാൽ പ്രധാനവാചകം അതിനെ തുറന്ന നിലയിൽ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ താരതമ്യവും ‘അവരുടെമേലും/ഞങ്ങളുടെമേൽ’ എന്ന സമാന്തരതയും നിലനിർത്തിയിട്ടുണ്ട്; പദാനുപദമായ ‘വീണു’ എന്നതിനുപകരം മലയാളത്തിൽ സ്വാഭാവികമായ ആത്മാവിന്റെ വരവിനെ സൂചിപ്പിക്കുന്ന ‘വന്നു’ ഉപയോഗിച്ചു.
