id: ACT.11.19
reference: Acts 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: ml
  text: അങ്ങനെ, സ്തെഫാനൊസിനെച്ചൊല്ലി ഉണ്ടായ കഷ്ടത[a] നിമിത്തം ചിതറിപ്പോയവർ ഫൊയ്‌നിക്യ, സൈപ്രസ്, അന്ത്യോക്യ എന്നിവിടങ്ങൾവരെ ചെന്നു. അവർ യെഹൂദരോടു മാത്രമേ[c] വചനം[b] പറഞ്ഞുള്ളൂ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഷ്ടത’ എന്നതിന് ‘പീഡനം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ദുരിതം, ഞെരുക്കം, പീഡനം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘വചനം’ എന്നത് യേശുവിനെക്കുറിച്ച് പ്രസംഗിച്ച സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു; ‘സന്ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്കിൽ ശക്തമായ ഊന്നലുണ്ട്: ‘യെഹൂദരോടു മാത്രം’ അഥവാ ‘യെഹൂദരോടല്ലാതെ മറ്റാരോടും അല്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: ചിതറിപ്പോയവർ
  rationale: പീഡനസാഹചര്യത്തെത്തുടർന്ന് പല സ്ഥലങ്ങളിലേക്കായി ചിതറിപ്പോകേണ്ടിവന്നവരെ സൂചിപ്പിക്കുന്ന ഭൂതകാല നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θλίψεως
  choice: കഷ്ടത
  rationale: ദുരിതം, ഞെരുക്കം, പീഡനം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർഥപരിധി നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ പീഡനസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: സ്തെഫാനൊസിനെച്ചൊല്ലി ഉണ്ടായ
  rationale: സ്തെഫാനൊസിന്റെ സംഭവവുമായി ബന്ധപ്പെട്ട് പൊട്ടിപ്പുറപ്പെട്ട കഷ്ടത എന്ന ബന്ധാർഥം നിലനിർത്തുന്നു; അത് സ്തെഫാനൊസിന്റെ വ്യക്തിപരമായ കഷ്ടത മാത്രമാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: διῆλθον ἕως
  choice: എന്നിവിടങ്ങൾവരെ ചെന്നു
  rationale: യാത്രയുടെ ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: ഫൊയ്നീക്യ, കുപ്രൊസ്, അന്ത്യൊക്ക്യ
  rationale: പ്രദേശത്തിന്റെയും ദ്വീപിന്റെയും നഗരത്തിന്റെയും പേരുകൾ മലയാള ബൈബിൾ വായനയ്ക്ക് യോജിച്ച ലിപ്യന്തരണത്തിൽ നൽകുന്നു.
- source_word: μηδενὶ λαλοῦντες ... εἰ μὴ μόνον Ἰουδαίοις
  choice: യെഹൂദരോടു മാത്രമേ ... പറഞ്ഞുള്ളൂ
  rationale: ‘മറ്റാരോടുമല്ല, യെഹൂദരോടു മാത്രം’ എന്ന ഇരട്ട നിയന്ത്രണത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘മാത്രമേ’ എന്ന സ്വാഭാവിക ഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ആവർത്തിക്കുന്ന ലൂക്കോസിന്റെ പ്രമേയപരമായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; ഇവിടെ അതിന്റെ സന്ദേശാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്തെഫാനൊസിന്റെ സംഭവത്തെത്തുടർന്നുണ്ടായ വിരോധത്തിന്റെ സ്വഭാവം
  choice: പ്രധാന പാഠത്തിൽ വിശാലാർഥമുള്ള ‘കഷ്ടത’ ഉപയോഗിച്ചു.
  alternative: പീഡനം
  rationale: സന്ദർഭം പീഡനമാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും θλῖψις എന്ന പദം അതിലും വിശാലമാണ്; അതിനാൽ പ്രധാന പാഠം അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- issue: അപ്പൊസ്തലപ്രവൃത്തികളിലെ τὸν λόγον എന്ന പ്രയോഗം
  choice: പ്രധാന പാഠത്തിൽ ‘വചനം’ നിലനിർത്തി.
  alternative: സന്ദേശം; യേശുവിനെക്കുറിച്ചുള്ള സന്ദേശം
  rationale: ലൂക്കോസിന്റെ ആവർത്തിത പ്രമേയപദം സംരക്ഷിക്കുമ്പോൾ വ്യാഖ്യാനപരമായ വിപുലീകരണം പ്രധാന പാഠത്തിലേക്ക് ചേർക്കാതിരിക്കുന്നു.
- issue: εἰ μὴ μόνον എന്ന പ്രയോഗത്തിലെ നിയന്ത്രണത്തിന്റെ ഊന്നൽ
  choice: ‘യെഹൂദരോടു മാത്രമേ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: യെഹൂദരോടല്ലാതെ മറ്റാരോടും പറഞ്ഞില്ല
  rationale: ഗ്രീക്കിലെ ‘അല്ലാതെ—മാത്രം’ എന്ന ശക്തമായ നിയന്ത്രണം സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളവാക്യഘടനയിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. ‘ചിതറിപ്പോയവർ’, ‘എന്നിവിടങ്ങൾവരെ ചെന്നു’, ‘മാത്രമേ ... പറഞ്ഞുള്ളൂ’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് സുലഭമാണ്. അതേസമയം ‘വചനം’ എന്ന പദം ലൂക്കോസിന്റെ പ്രമേയപരമായ പദബന്ധം സംരക്ഷിക്കുന്നു.
