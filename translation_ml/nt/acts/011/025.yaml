lexical_decisions:
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: ἐξέρχομαι എന്ന ക്രിയയുടെ ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട്, യാത്രതിരിക്കുന്നതിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δὲ
  choice: പിന്നെ
  rationale: ഇവിടെ δέ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിലുപരി ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; ‘പിന്നെ’ ആ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς Ταρσόν
  choice: തർസൊസിലേക്കു
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള εἰς ലക്ഷ്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ദിശയും ലക്ഷ്യവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἀναζητῆσαι
  choice: അന്വേഷിക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive ആണ്. ‘അന്വേഷിക്കാൻ’ ഒരാളെ കണ്ടെത്താനായി തിരയുക എന്ന അർത്ഥം നൽകുന്നു; ക്രിയയിൽ ഉണ്ടാകാവുന്ന കൂടുതൽ ഉദ്ദേശ്യപൂർവമായ തിരച്ചിലിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: Σαῦλον
  choice: ശൗലിനെ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി, വിഭക്തിപ്രത്യയം ചേർത്തിരിക്കുന്നു.
