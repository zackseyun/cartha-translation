id: ACT.11.26
reference: Acts 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: ml
  text: അവനെ കണ്ടെത്തിയപ്പോൾ, അവൻ അവനെ അന്ത്യൊക്യയിലേക്കു കൊണ്ടുവന്നു. ഒരു വർഷം മുഴുവൻ അവർ സഭയോടൊപ്പം കൂടിവരുകയും ധാരാളം ആളുകളെ പഠിപ്പിക്കുകയും ചെയ്തു.[a] ശിഷ്യന്മാർ ആദ്യമായി ‘ക്രിസ്ത്യാനികൾ’ എന്നു വിളിക്കപ്പെട്ടത് അന്ത്യൊക്യയിൽവെച്ചായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സഭയിൽ ഒന്നിച്ചുകൂടുകയും.” ഇവിടെ “സഭ” എന്നത് ഒരു കെട്ടിടത്തെയല്ല, ക്രിസ്തീയ വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കുപാഠത്തിന്റെ അർഥം “ശിഷ്യന്മാർ ആദ്യമായി ക്രിസ്ത്യാനികൾ എന്നു വിളിക്കപ്പെട്ടു” എന്നാണ്. ഈ പേര് അന്ത്യൊക്യയിൽ പൊതുവായ ഒരു വിളിപ്പേരായി തുടങ്ങിയിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: കണ്ടെത്തിയപ്പോൾ
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയും സംഭവക്രമവും സ്വാഭാവികമായ മലയാള കാലവാക്യത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἤγαγεν
  choice: കൊണ്ടുവന്നു
  rationale: സന്ദർഭത്തിൽ ബർന്നബാസ് ശൗലിനെ അന്ത്യൊക്യയിലേക്കു കൊണ്ടുവരുന്നതാണ്; ‘നയിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികം.
- source_word: ἐνιαυτὸν ὅλον
  choice: ഒരു വർഷം മുഴുവൻ
  rationale: കാലദൈർഘ്യം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: സഭയോടൊപ്പം കൂടിവരുകയും
  rationale: ἐκκλησίαയെ കെട്ടിടമായി തെറ്റിദ്ധരിപ്പിക്കാതെ വിശ്വാസിസമൂഹത്തോടൊപ്പമുള്ള കൂടിവരവ് സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപം മലയാളത്തിൽ സ്വാഭാവിക സജീവപ്രയോഗമായി നൽകിയിരിക്കുന്നു.
- source_word: ἐκκλησίᾳ
  choice: സഭ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ ക്രിസ്തീയ വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും പരിചിതവുമായ മലയാള പദം.
- source_word: διδάξαι
  choice: പഠിപ്പിക്കുകയും ചെയ്തു
  rationale: മുൻ അനന്തക്രിയയോടു സമാന്തരമായ പ്രവൃത്തി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὄχλον ἱκανόν
  choice: വളരെ ആളുകളെ
  rationale: ഗണ്യമായ എണ്ണമുള്ള ജനത്തെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘വലിയ ജനക്കൂട്ടം’ എന്നത് ഒരൊറ്റ സമ്മേളനത്തെ അനാവശ്യമായി സൂചിപ്പിക്കാം.
- source_word: χρηματίσαι
  choice: വിളിക്കപ്പെട്ടത്
  rationale: ഒരു പൊതുനാമത്താൽ അറിയപ്പെടുകയോ വിശേഷിപ്പിക്കപ്പെടുകയോ ചെയ്തുവെന്ന നിഷ്ക്രിയ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: πρώτως
  choice: ആദ്യമായി
  rationale: ആ പേരിന്റെ ആദ്യ ഉപയോഗം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Χριστιανούς
  choice: ക്രിസ്ത്യാനികൾ
  rationale: ഇത് Χριστός എന്ന പദവിയുടെ നേരിട്ടുള്ള പ്രയോഗമല്ല, സ്ഥാപിതമായ ഒരു സമൂഹനാമമാണ്; മലയാളത്തിലെ അംഗീകൃതവും സ്വാഭാവികവുമായ തത്തുല്യം ഇതാണ്.
theological_decisions:
- issue: Χριστιανούς എന്ന സമൂഹനാമം എങ്ങനെ നൽകണം
  choice: ക്രിസ്ത്യാനികൾ
  alternative: ക്രിസ്തുവിന്റെ അനുയായികൾ / മശീഹാവാദികൾ
  rationale: ഗ്രീക്കിൽ ഇത് ശിഷ്യർക്കു ലഭിച്ച സ്ഥാപിതമായ പേരാണ്. വ്യുത്പത്തിയെ മുൻനിർത്തിയ പുതുപദം വിഭാഗീയമോ വിശദീകരണാത്മകമോ ആയ അധിക അർഥം സൃഷ്ടിക്കും.
- issue: ἐν τῇ ἐκκλησίᾳ എന്നത് സ്ഥലമോ സമൂഹബന്ധമോ
  choice: സഭയോടൊപ്പം
  alternative: സഭയിൽ
  rationale: ἐκκλησία ഇവിടെ കെട്ടിടത്തേക്കാൾ വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ പ്രധാന പാഠം കെട്ടിടാർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല; സ്ഥലാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സംഭവക്രമവും അവസാനവാക്യത്തിലെ അന്ത്യൊക്യയ്ക്കുള്ള ഊന്നലും നിലനിർത്തി. ‘സഭ’ കെട്ടിടമാണെന്ന ധാരണ ഒഴിവാക്കാൻ ‘സഭയോടൊപ്പം’ തെരഞ്ഞെടുത്തു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
