revisions:
- from: അവനെ കണ്ടെത്തിയപ്പോൾ, അവൻ അവനെ അന്ത്യൊക്യയിലേക്കു കൊണ്ടുവന്നു. ഒരു വർഷം മുഴുവൻ അവർ സഭയോടൊപ്പം കൂടിവരുകയും വളരെ ആളുകളെ പഠിപ്പിക്കുകയും ചെയ്തു.[a] ശിഷ്യന്മാർ ആദ്യമായി ‘ക്രിസ്ത്യാനികൾ’ എന്നു വിളിക്കപ്പെട്ടത് അന്ത്യൊക്യയിൽവെച്ചായിരുന്നു.[b]
  to: അവനെ കണ്ടെത്തിയപ്പോൾ, അവൻ അവനെ അന്ത്യൊക്യയിലേക്കു കൊണ്ടുവന്നു. ഒരു വർഷം മുഴുവൻ അവർ സഭയോടൊപ്പം കൂടിവരുകയും ധാരാളം ആളുകളെ പഠിപ്പിക്കുകയും ചെയ്തു.[a] ശിഷ്യന്മാർ ആദ്യമായി ‘ക്രിസ്ത്യാനികൾ’ എന്നു വിളിക്കപ്പെട്ടത് അന്ത്യൊക്യയിൽവെച്ചായിരുന്നു.[b]
  rationale: മുഖ്യവാക്യത്തിന്റെ ഘടനയും അർഥവും നിലനിർത്തി, ‘വളരെ ആളുകളെ’ എന്നത് ὄχλον ἱκανόν-നോടു കൂടുതൽ ചേർന്നുനിൽക്കുന്ന ‘ധാരാളം ആളുകളെ’ എന്നു പരിഷ്കരിച്ചു. അടിക്കുറിപ്പ് b-യിൽ നാമകരണം സൂചിപ്പിക്കേണ്ടിടത്ത് വ്യാകരണപരമായ ‘വിശേഷണം’ എന്ന ആശയസാധ്യത ഒഴിവാക്കാൻ ‘വിളിപ്പേര്’ എന്നു മാറ്റി. അടിക്കുറിപ്പ് a-യിലെ ബദൽവാചകം സ്വതന്ത്രമായി സ്വാഭാവികമായി വായിക്കാനാകുന്നവിധം ക്രമപ്പെടുത്തി.
