  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: ml
  text: എന്നാൽ, അവരിൽ ചിലർ സൈപ്രസിൽനിന്നും കുറേനേയിൽനിന്നുമുള്ള പുരുഷന്മാരായിരുന്നു; അവർ അന്ത്യോഖ്യയിൽ എത്തിയപ്പോൾ, ഗ്രീക്കുഭാഷക്കാരായ യഹൂദരോടും[a] സംസാരിക്കുകയും കർത്താവായ യേശുവിനെക്കുറിച്ചുള്ള സുവാർത്ത അറിയിക്കുകയും ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഗ്രീക്കുഭാഷക്കാരായ യഹൂദർ” എന്നതിനു പകരം “ഗ്രീക്കുകാർ” എന്നു കാണുന്നു. ആ പാഠമാണ് മൂലപാഠമെങ്കിൽ, അവർ ഗ്രീക്കുഭാഷക്കാരായ യഹൂദരോടു മാത്രമല്ല, യഹൂദരല്ലാത്തവരോടും സംസാരിച്ചുവെന്നാണ് അർഥം.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: ചിലർ
  rationale: മുമ്പ് പരാമർശിച്ച കൂട്ടത്തിലെ വ്യക്തമാക്കാത്ത ഒരു വിഭാഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: ഗ്രീക്ക് പദം പൊതുവായ ‘ആളുകൾ’ എന്നതിനു പകരം പ്രായപൂർത്തിയായ പുരുഷന്മാരെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: സൈപ്രസിൽനിന്നും കുറേനയിൽനിന്നുമുള്ള
  rationale: ഉത്ഭവസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന വിശേഷണങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ സ്ഥലപ്രയോഗമായി നൽകി.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: അന്ത്യോഖ്യയിൽ എത്തിയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ സന്ദർഭോചിതമായ കാലാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐλάλουν
  choice: സംസാരിച്ചുകൊണ്ട് ... അറിയിച്ചുപോന്നു
  rationale: ഇംപർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: καὶ πρὸς
  choice: '...രോടും'
  rationale: മുമ്പത്തെ ശ്രോതൃവൃന്ദത്തിനപ്പുറം ഇവരോടുകൂടി സംസാരിച്ചുവെന്ന അനുബന്ധാർഥം മലയാളത്തിലെ ‘-ഉം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοὺς Ἑλληνιστάς
  choice: ഗ്രീക്കുഭാഷക്കാരായ യഹൂദർ
  rationale: SBLGNTയിലെ Ἑλληνιστάς സാധാരണയായി ഗ്രീക്കുഭാഷ സംസാരിച്ചിരുന്ന യഹൂദരെ സൂചിപ്പിക്കുന്നു; അപരിചിതമായ ‘ഹെല്ലനിസ്റ്റുകൾ’ എന്ന ലിപ്യന്തരണത്തേക്കാൾ ഇത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: εὐαγγελιζόμενοι
  choice: സുവാർത്ത അറിയിച്ചുകൊണ്ട്
  rationale: സംസാരത്തിന്റെ സ്വഭാവവും ഉള്ളടക്കവും സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸν κύριον Ἰησοῦν
  choice: കർത്താവായ യേശു
  rationale: κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനനാമം ‘കർത്താവ്’ എന്നു നിലനിർത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: τοὺς Ἑλληνιστάς എന്ന പാഠവും Ἕλληνας എന്ന പാഠഭേദവും സൂചിപ്പിക്കുന്ന ശ്രോതാക്കളുടെ തിരിച്ചറിയൽ
  choice: പ്രധാന പാഠത്തിൽ SBLGNTയിലെ ‘ഗ്രീക്കുഭാഷക്കാരായ യഹൂദർ’ സ്വീകരിച്ചു; ‘ഗ്രീക്കുകാർ’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘ഗ്രീക്കുകാർ’; ഇത് യഹൂദരല്ലാത്ത ജനതകളെ സൂചിപ്പിക്കാം.
  rationale: ഇത് സുവാർത്ത യഹൂദരല്ലാത്തവരിലേക്കു വ്യാപിച്ചതിന്റെ ഈ ഘട്ടത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനത്തെ ബാധിക്കുന്ന പ്രധാന പാഠഭേദമാണ്. നൽകിയിരിക്കുന്ന മൂലപാഠം പിന്തുടരുകയും വ്യത്യസ്തമായ ദൈവശാസ്ത്ര-കഥനസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘ഹെല്ലനിസ്റ്റുകൾ’ എന്ന സാങ്കേതിക ലിപ്യന്തരണം ഒഴിവാക്കി അർഥം തുറന്നുപറഞ്ഞു; സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങളിൽ നൽകി.
