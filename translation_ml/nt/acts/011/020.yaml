  to: എന്നാൽ, അവരിൽ ചിലർ സൈപ്രസിൽനിന്നും കുറേനേയിൽനിന്നുമുള്ള പുരുഷന്മാരായിരുന്നു; അവർ അന്ത്യോഖ്യയിൽ എത്തിയപ്പോൾ, ഗ്രീക്കുഭാഷക്കാരായ യഹൂദരോടും[a] സംസാരിക്കുകയും കർത്താവായ യേശുവിനെക്കുറിച്ചുള്ള സുവാർത്ത അറിയിക്കുകയും ചെയ്തുപോന്നു.
  rationale: പാഠത്തിന്റെ അർഥത്തിൽ മാറ്റം വരുത്താതെ, കുറേനേ എന്ന സ്ഥലനാമരൂപം തിരുത്തുകയും ഗ്രീക്കിലെ അപൂർണഭൂതകാല ക്രിയയും വർത്തമാനകാല കൃതന്തവും സ്വാഭാവിക മലയാള സമാന്തരക്രിയകളായി അവതരിപ്പിക്കുകയും ചെയ്തു. SBLGNTയുടെ Ἑλληνιστάς വായന പ്രധാനപാഠത്തിൽ നിലനിർത്തി; പ്രസക്തമായ Ἕλληνας പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
