reference: Acts 28:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: ml
  text: മൂന്നു മാസം കഴിഞ്ഞ്, ആ ദ്വീപിൽ ശീതകാലം ചെലവഴിച്ചിരുന്ന, ദിയോസ്കൂരികളുടെ ചിഹ്നമുള്ള ഒരു അലക്സാണ്ട്രിയൻ കപ്പലിൽ ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ദിയോസ്കൂരികൾ’; ഗ്രീക്കോ-റോമൻ പുരാണത്തിൽ സ്യൂസിന്റെ ഇരട്ട പുത്രന്മാരായ കാസ്റ്ററും പോളക്സും.
    reason: അപരിചിതമായ പുരാണസംബന്ധിയായ പ്രത്യേക നാമത്തിന്റെ വിശദീകരണം.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: മൂന്നു മാസം കഴിഞ്ഞ്
  rationale: μετά + accusative കഴിഞ്ഞുപോയ സമയത്തെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἀνήχθημεν
  choice: ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു
  rationale: നാവികസന്ദർഭത്തിലെ ἀνάγω എന്നത് കപ്പലിൽ കടലിലേക്കു പുറപ്പെടുക എന്നർഥമാണ്; മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്ന പ്രയോഗമാണിത്.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: ഒരു അലക്സാണ്ട്രിയൻ കപ്പലിൽ
  rationale: πλοῖον ഇവിടെ വലിയ കടൽക്കപ്പലാണ്; Ἀλεξανδρίνῳ അതിന്റെ അലക്സാണ്ട്രിയൻ ഉത്ഭവമോ ബന്ധമോ സൂചിപ്പിക്കുന്നു.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: ആ ദ്വീപിൽ ശീതകാലം കഴിച്ചുകൂട്ടിയിരുന്ന
  rationale: പരിപൂർണകൃതന്തം, കപ്പൽ ശീതകാലം മുഴുവൻ അവിടെ തങ്ങിയശേഷമുള്ള അവസ്ഥ സൂചിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ പറഞ്ഞ ദ്വീപിനെയാണ് നിർദ്ദേശകം സൂചിപ്പിക്കുന്നത്.
- source_word: παρασήμῳ Διοσκούροις
  choice: ദിയോസ്കൂരികൾ ആയിരുന്നു ആ കപ്പലിന്റെ ചിഹ്നം
  rationale: παράσημος കപ്പലിന്റെ തിരിച്ചറിയൽചിഹ്നത്തെയോ പ്രതീകത്തെയോ സൂചിപ്പിക്കാം. ‘ചിഹ്നം’ എന്നത് ഉറപ്പില്ലാത്ത ‘മുഖപ്രതിമ’ എന്ന പ്രത്യേക വ്യാഖ്യാനം ഒഴിവാക്കി ഗ്രീക്കിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; Διόσκουροι എന്ന പേരും ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: പുറജാതീയ കപ്പൽചിഹ്നമായ Διοσκούροι എങ്ങനെ നൽകണം
  choice: ദിയോസ്കൂരികൾ
  alternative: ഇരട്ടദേവന്മാർ / കാസ്റ്ററും പോളക്സും
  rationale: മൂലപാഠത്തിലെ പ്രത്യേക നാമം നിലനിർത്തുന്നത് മതപരമായ പരാമർശത്തെ റിപ്പോർട്ടായി മാത്രം അവതരിപ്പിക്കുകയും ‘ഇരട്ടദേവന്മാർ’ എന്ന വ്യാഖ്യാനപരമായ പകരംവാക്ക് മുഖ്യപാഠത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു. വായനക്കാരനാവശ്യമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കടലിലേക്കു പുറപ്പെട്ടു’ നാവികാർഥം വ്യക്തമാക്കുന്നു. ഗ്രീക്കിൽ ഉറപ്പില്ലാത്ത ‘figurehead’ എന്ന പ്രത്യേക രൂപം ചുമത്താതെ ‘ചിഹ്നം’ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നപ്പെടുത്തിയ പദത്തിനുതന്നെ ചേർത്തിരിക്കുന്നു.
