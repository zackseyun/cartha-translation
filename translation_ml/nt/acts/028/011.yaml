revisions:
- from: മൂന്നു മാസം കഴിഞ്ഞ്, ആ ദ്വീപിൽ ശീതകാലം കഴിച്ചുകൂട്ടിയിരുന്ന ഒരു അലക്സാണ്ട്രിയൻ കപ്പലിൽ ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു. ദിയോസ്കൂരികൾ[a] ആയിരുന്നു ആ കപ്പലിന്റെ ചിഹ്നം.
  to: മൂന്നു മാസം കഴിഞ്ഞ്, ആ ദ്വീപിൽ ശീതകാലം ചെലവഴിച്ചിരുന്ന, ദിയോസ്കൂരികളുടെ ചിഹ്നമുള്ള ഒരു അലക്സാണ്ട്രിയൻ കപ്പലിൽ ഞങ്ങൾ കടലിലേക്കു പുറപ്പെട്ടു.[a]
