id: ACT.28.21
reference: Acts 28:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ അവനോടു പറഞ്ഞു: “ഞങ്ങൾക്ക് യെഹൂദ്യയിൽനിന്ന് നിന്നെക്കുറിച്ച് ഒരു കത്തും ലഭിച്ചിട്ടില്ല; സഹോദരന്മാരിൽ ആരും വന്ന് നിന്നെക്കുറിച്ച് മോശമായ യാതൊന്നും അറിയിക്കുകയോ പറയുകയോ ചെയ്തിട്ടില്ല.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാർ” എന്നത് സഹയഹൂദന്മാരെ സൂചിപ്പിക്കാം; അവർ ക്രിസ്തീയ വിശ്വാസികളാണെന്ന് മൂലപാഠം വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ... εἶπαν
  choice: അവർ ... പറഞ്ഞു
  rationale: δέ ഇവിടെ സംഭാഷണത്തിലെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അനാവശ്യമായ വിരോധഭാവം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: γράμματα
  choice: കത്തുകൾ
  rationale: ഈ സന്ദർഭത്തിൽ എഴുതിയ സന്ദേശങ്ങളെയോ കത്തുകളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽനിന്ന്
  rationale: ഭൂമിശാസ്ത്രപരമായ ഉറവിടം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: അവിടെനിന്നു വന്ന സഹോദരന്മാരിൽ ആരും
  rationale: വന്നെത്തിയ ഒരാളെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകി; 'അവിടെനിന്ന്' എന്നത് സന്ദർഭത്തിൽ യെഹൂദ്യയെ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν
  choice: അറിയിക്കുകയോ പറയുകയോ
  rationale: രണ്ടു വ്യത്യസ്ത ക്രിയകളായ 'വിവരം അറിയിക്കുക', 'പറയുക' എന്നിവയുടെ നേരിയ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: τι ... πονηρόν
  choice: ദോഷകരമായ യാതൊന്നും
  rationale: πονηρόν എന്നതിന്റെ 'തിന്മയായ/മോശമായ/ദോഷകരമായ' അർത്ഥപരിധിയിൽ, ഒരാളെക്കുറിച്ചുള്ള പ്രതികൂല വിവരത്തിന് അനുയോജ്യമായ പ്രയോഗം.
theological_decisions:
- issue: τῶν ἀδελφῶν എന്നതിന്റെ സൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹയഹൂദന്മാർ; ക്രിസ്തീയ വിശ്വാസികളായ സഹോദരന്മാർ
  rationale: സംസാരിക്കുന്നവർ റോമിലെ യഹൂദനേതാക്കളായതിനാൽ ഇത് സഹയഹൂദന്മാരെ സൂചിപ്പിക്കാം; എന്നാൽ മൂലപാഠം അവരെ ക്രിസ്തീയ വിശ്വാസികളെന്നോ സഹയഹൂദന്മാരെന്നോ വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ പദത്തിന്റെ തുറന്ന അർത്ഥം പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ οὔτε ... οὔτε എന്ന ഇരട്ട നിഷേധബന്ധം ‘ഒന്നും ... ഇല്ല; ... ആരും ... ചെയ്തിട്ടുമില്ല’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ നിലനിർത്തി.
