  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: ml
  text: സിറാക്കൂസിൽ കപ്പൽ അടുപ്പിച്ച ശേഷം,[a] ഞങ്ങൾ അവിടെ മൂന്നു ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിറാക്കൂസിൽ ഇറങ്ങിയ ശേഷം.’ ഗ്രീക്കിലെ ഈ പദപ്രയോഗത്തിന് ഇവിടെ കപ്പൽയാത്രയുമായി ബന്ധപ്പെട്ട അർഥമാണുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: കപ്പലടുപ്പിച്ചശേഷം
  rationale: κατάγω എന്ന ക്രിയയുടെ കപ്പൽയാത്രാസന്ദർഭത്തിലെ അർഥം തുറമുഖത്ത് കപ്പൽ അടുപ്പിക്കുക അഥവാ കരയ്ക്കടുക്കുക എന്നതാണ്. ‘കപ്പലടുപ്പിച്ചശേഷം’ എന്ന പ്രയോഗം ഈ നാവികസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰς Συρακούσας
  choice: സിറാക്കൂസിൽ
  rationale: εἰς ദിശയെയോ പ്രവേശനത്തെയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, തുറമുഖനഗരത്തിലെത്തുന്നതിനെ മലയാളത്തിൽ ‘സിറാക്കൂസിൽ കപ്പലടുപ്പിച്ചു’ എന്നു പറയുന്നതാണ് സ്വാഭാവികം.
- source_word: ἐπεμείναμεν
  choice: ഞങ്ങൾ അവിടെ ... താമസിച്ചു
  rationale: ക്രിയയ്ക്ക് തുടരുക, തങ്ങുക, താമസിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. സ്ഥലത്ത് മൂന്നു ദിവസം കഴിഞ്ഞതിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ ‘അവിടെ ... താമസിച്ചു’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἡμέρας τρεῖς
  choice: മൂന്നു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം; മലയാളത്തിൽ ‘മൂന്നു ദിവസം’ എന്നത് ആവശ്യമായ ദൈർഘ്യം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Συρακούσας
  choice: സിറാക്കൂസ്
  rationale: Συράκουσαι എന്ന സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം; വിഭക്തിയോടുകൂടെ മുഖ്യവാക്യത്തിൽ ‘സിറാക്കൂസിൽ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. കപ്പൽയാത്രാസന്ദർഭം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുകയും സാദ്ധ്യമായ മറ്റൊരു വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
