reference: Acts 28:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: ml
  text: 'പറഞ്ഞുകൊണ്ട്: “ഈ ജനത്തിന്റെ അടുക്കൽ ചെന്ന് പറയുക: ‘കേൾവിയാൽ നിങ്ങൾ തീർച്ചയായും കേൾക്കും, എന്നാൽ ഒരിക്കലും ഗ്രഹിക്കുകയില്ല; കണ്ടുകൊണ്ട് നിങ്ങൾ തീർച്ചയായും കാണും, എന്നാൽ ഒരിക്കലും തിരിച്ചറിയുകയില്ല.’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: “കേൾവിയാൽ നിങ്ങൾ കേൾക്കും, എന്നാൽ ഒരിക്കലും ഗ്രഹിക്കുകയില്ല; കണ്ടുകൊണ്ട് നിങ്ങൾ കാണും, എന്നാൽ ഒരിക്കലും കാണുകയില്ല.” യെശയ്യാവിൽനിന്നുള്ള ഈ ഗ്രീക്ക് ഉദ്ധരണിയിൽ ഊന്നലിനായി കേൾവി-കാഴ്ചാപദങ്ങൾ ആവർത്തിക്കുന്നു; അവസാനത്തെ “കാണുക” എന്നത് സന്ദർഭത്തിൽ ഉള്ളിലുള്ള തിരിച്ചറിവിനെയും സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: പറഞ്ഞുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് ഉദ്ധരണിയെ അവതരിപ്പിക്കുന്നു.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: ഈ ജനത്തിന്റെ അടുക്കൽ ചെന്ന്
  rationale: പ്രവാചകീയമായ കൂട്ടായ അഭിസംബോധന നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ചലനപ്രയോഗമാണ്.
- source_word: Ἀκοῇ ἀκούσετε
  choice: നിങ്ങൾ കേട്ടുകൊണ്ടേയിരിക്കും
  rationale: നാമവും സമാനധാതുവുള്ള ക്രിയയും ചേർന്ന ഗ്രീക്ക് ആവർത്തനത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ തുടർച്ചയും ഉറപ്പും സൂചിപ്പിക്കുന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: οὐ μὴ συνῆτε
  choice: ഒരിക്കലും ഗ്രഹിക്കുകയില്ല
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധവും συνίημι സൂചിപ്പിക്കുന്ന ആന്തരിക ഗ്രഹണവും വ്യക്തമാക്കുന്നു.
- source_word: βλέποντες βλέψετε
  choice: കണ്ടുകൊണ്ടേയിരിക്കും
  rationale: കാഴ്ചയെ സംബന്ധിച്ച ആവർത്തനവും ഊന്നലും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: οὐ μὴ ἴδητε
  choice: ഒരിക്കലും തിരിച്ചറിയുകയില്ല
  rationale: സന്ദർഭത്തിലെ വെറും ശാരീരിക കാഴ്ചയല്ലാത്ത ഉൾബോധത്തെ സൂചിപ്പിക്കുന്നു; അതേസമയം അക്ഷരാർഥമായ ‘കാണുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബാഹ്യമായ കേൾവിയും കാഴ്ചയും ആന്തരികമായ ഗ്രഹണവും തമ്മിലുള്ള പ്രവാചകീയ വിരോധം
  choice: അവസാന ക്രിയയെ ‘തിരിച്ചറിയുക’ എന്നു പരിഭാഷപ്പെടുത്തി ആന്തരിക ഗ്രഹണത്തിന്റെ ആശയം പ്രകടമാക്കുക
  alternative: അവസാന ക്രിയയും ‘കാണുക’ എന്നു പരിഭാഷപ്പെടുത്തി കാഴ്ചാസംബന്ധമായ പദാവർത്തനം പൂർണമായി നിലനിർത്തുക
  rationale: സന്ദർഭം ഇന്ദ്രിയാനുഭവവും ഉള്ളിലുള്ള തിരിച്ചറിവും തമ്മിൽ വേർതിരിക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ കാഴ്ചാപദങ്ങളുടെ ആവർത്തനവും സാധ്യമായ അക്ഷരാർഥവും അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പ്രവാചകീയ കൂട്ടായ അഭിസംബോധനയും ശക്തമായ നിഷേധവും സംരക്ഷിച്ചു; അസ്വാഭാവികമായ ധാതു-നാമ ആവർത്തനം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
