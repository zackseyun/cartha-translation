  revised_text: അവർ പൗലോസുമായി ഒരു ദിവസം നിശ്ചയിച്ചശേഷം, മുമ്പത്തേതിലും കൂടുതൽപേർ അദ്ദേഹത്തിന്റെ താമസസ്ഥലത്തേക്ക്[a] വന്നു. മോശെയുടെ ന്യായപ്രമാണത്തെയും പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളെയും ആധാരമാക്കി, ദൈവരാജ്യത്തെക്കുറിച്ച് ഗൗരവമായി സാക്ഷ്യം വഹിച്ചും യേശുവിനെക്കുറിച്ച് അവരെ ബോധ്യപ്പെടുത്തിക്കൊണ്ടും[b] അദ്ദേഹം രാവിലെ മുതൽ വൈകുന്നേരംവരെ അവർക്ക് വിശദീകരിച്ചുകൊണ്ടിരുന്നു.
