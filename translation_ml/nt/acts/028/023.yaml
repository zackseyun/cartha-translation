id: ACT.28.23
reference: Acts 28:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: ml
  text: അവർ പൗലോസുമായി ഒരു ദിവസം നിശ്ചയിച്ചശേഷം, മുമ്പത്തേതിലും കൂടുതൽപേർ അദ്ദേഹത്തിന്റെ താമസസ്ഥലത്തേക്ക്[a] വന്നു. മോശെയുടെ ന്യായപ്രമാണത്തെയും പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളെയും ആധാരമാക്കി, ദൈവരാജ്യത്തെക്കുറിച്ച് ഗൗരവമായി സാക്ഷ്യം വഹിച്ചും യേശുവിനെക്കുറിച്ച് അവരെ ബോധ്യപ്പെടുത്തിക്കൊണ്ടും[b] അദ്ദേഹം രാവിലെ മുതൽ വൈകുന്നേരംവരെ അവർക്ക് വിശദീകരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അദ്ദേഹത്തിന്റെ താമസസ്ഥലത്ത്’ അല്ലെങ്കിൽ ‘അദ്ദേഹം പാർത്തിരുന്ന ഇടത്ത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം താമസസ്ഥലത്തെയോ പാർപ്പിടസൗകര്യത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരെ ബോധ്യപ്പെടുത്താൻ ശ്രമിച്ചും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് രൂപം ബോധ്യപ്പെടുത്തുന്ന പ്രവർത്തനത്തെയോ അതിനുള്ള ശ്രമത്തെയോ ഊന്നാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: അവർ പൗലോസുമായി ഒരു ദിവസം നിശ്ചയിച്ചശേഷം
  rationale: കൂടിക്കാഴ്ചയ്ക്കായി ഒരു ദിവസം നിശ്ചയിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; αὐτῷ ആരെ സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കാൻ ‘പൗലോസുമായി’ എന്നു പറയുന്നു.
- source_word: ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν
  choice: അദ്ദേഹം താമസിച്ചിരുന്ന സ്ഥലത്ത് അദ്ദേഹത്തിന്റെ അടുക്കൽ വന്നു
  rationale: ξενία എന്നത് താമസസ്ഥലം അല്ലെങ്കിൽ പാർപ്പിടസൗകര്യം സൂചിപ്പിക്കുന്നു; ചലനവും കൂടിക്കാഴ്ചയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πλείονες
  choice: മുമ്പത്തേതിലും അധികംപേർ
  rationale: വെറും ‘അനേകർ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ താരതമ്യാർഥം വ്യക്തമാക്കുന്നു; മുൻസന്ദർഭത്തെ സൂചിപ്പിക്കുന്ന അർഥം വാചകത്തിൽ സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
- source_word: ἐξετίθετο
  choice: വിശദീകരിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയായ വിശദീകരണപ്രവർത്തനം പ്രകടമാക്കുന്നു.
- source_word: διαμαρτυρόμενος
  choice: ഗൗരവമായി സാക്ഷ്യം വഹിച്ചും
  rationale: സാധാരണ പ്രസ്താവനയെക്കാൾ ശക്തവും ഉത്തരവാദിത്വബോധമുള്ളതുമായ സാക്ഷ്യത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെക്കുറിച്ച്
  rationale: സ്ഥിരവും സുതാര്യവുമായ മലയാള ബൈബിൾ പ്രയോഗം.
- source_word: πείθων τε αὐτοὺς
  choice: അവരെ ബോധ്യപ്പെടുത്താൻ ശ്രമിച്ചും
  rationale: πείθων ബോധ്യപ്പെടുത്തുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; എല്ലാവരും യഥാർഥത്തിൽ ബോധ്യപ്പെട്ടു എന്ന ഫലം നിർബന്ധമാക്കാതെ തുടർച്ചയായ ശ്രമം പ്രകടിപ്പിക്കുന്നു.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: യേശുവിനെക്കുറിച്ച്
  rationale: വിഷയസൂചന സ്വാഭാവികവും കൃത്യവുമായി നൽകുന്നു.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: മോശെയുടെ ന്യായപ്രമാണത്തെയും പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളെയും ആധാരമാക്കി
  rationale: ἀπό ഇവിടെ വാദത്തിന്റെ ഉറവിടം/അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘പ്രവാചകന്മാർ’ എന്നത് ഗ്രന്ഥവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാള വായനക്കാർക്കായി ‘ഗ്രന്ഥങ്ങൾ’ ചേർത്തു വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: രാവിലെമുതൽ വൈകുന്നേരംവരെ
  rationale: സമയപരിധി അതിശയോക്തിയില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ദൈവരാജ്യവും യേശുവും തമ്മിലുള്ള വാക്യഘടനാപരമായ ബന്ധം
  choice: ഒരൊറ്റ നീണ്ട വിശദീകരണത്തിൽ ദൈവരാജ്യത്തെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുകയും യേശുവിനെക്കുറിച്ച് ബോധ്യപ്പെടുത്താൻ ശ്രമിക്കുകയും ചെയ്തതായി അവതരിപ്പിച്ചു.
  alternative: പരസ്പരബന്ധമില്ലാത്ത രണ്ടു സ്വതന്ത്ര വിഷയങ്ങളായി അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടന ഇവയെ ഒരേ തിരുവെഴുത്താധിഷ്ഠിത വിശദീകരണത്തിനുള്ളിൽ ബന്ധിപ്പിക്കുന്നു; അതിനപ്പുറം ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: πείθων വിജയകരമായ ബോധ്യപ്പെടുത്തലോ ശ്രമമോ
  choice: ‘ബോധ്യപ്പെടുത്താൻ ശ്രമിച്ചും’
  alternative: ‘അവരെ ബോധ്യപ്പെടുത്തിയും’
  rationale: പങ്കാളിക്രിയയുടെ പ്രവർത്തനഭാവം നിലനിർത്തുകയും കേട്ട എല്ലാവരും സമ്മതിച്ചു എന്ന നിഗമനം ഒഴിവാക്കുകയും ചെയ്യുന്നു; ഈ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ഏകത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിനായി തിരുവെഴുത്ത്-ആധാരം ആദ്യം കൊണ്ടുവന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
