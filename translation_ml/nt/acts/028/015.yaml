  verdict: revise
  source_fidelity: 'മുഖ്യാർഥം വിശ്വസ്തമാണ്: സഹോദരന്മാർ പൗലോസിന്റെ സംഘത്തെക്കുറിച്ച് കേട്ട് അവരെ കാണാൻ വന്നു; പൗലോസ് ദൈവത്തിനു നന്ദി പറഞ്ഞ് ധൈര്യം നേടി. എന്നിരുന്നാലും, Ἀππίου Φόρου, Τριῶν Ταβερνῶν എന്നിവ സ്ഥാപിത സ്ഥലനാമങ്ങളായതിനാൽ അവയുടെ ഘടകങ്ങളെ സാധാരണനാമങ്ങളായി വിവർത്തനം ചെയ്യുന്നത് പേരുകളുടെ സ്വഭാവവും ചരിത്രപരമായ തിരിച്ചറിയലും മങ്ങിക്കുന്നു. κἀκεῖθεν-ലെ തുടർച്ചാസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി അവ്യക്തമായി നിൽക്കാമെങ്കിലും വാക്യക്രമത്തിൽ സ്ഥലപരമായ തുടർച്ച നിലനിർത്തിയിട്ടുണ്ട്.'
  naturalness: ‘ഞങ്ങളെക്കുറിച്ച് കേട്ട സഹോദരന്മാർ’ എന്ന ക്രമം ആധുനിക മലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതാണ്. ‘ദൈവത്തോടു നന്ദി പറഞ്ഞു’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ധൈര്യം നേടി’ ἔλαβε θάρσος എന്ന പ്രയോഗത്തെ ലളിതമായി പ്രതിഫലിപ്പിക്കുന്നു.
  terminology: ‘സഹോദരന്മാർ’ മൂലഗ്രീക്കിലെ ἀδελφοί-യുടെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു. അടിക്കുറിപ്പിലെ ബദൽപ്രയോഗം കൂടുതൽ സ്വാഭാവികമായി ‘സഹോദരന്മാരും സഹോദരിമാരും’ എന്നു നൽകിയിരിക്കുന്നു. അപ്പിയൂസ് ഫോറം, ത്രീ ടവേൺസ് എന്നിവയെ അർഥവിവർത്തനം ചെയ്യാതെ സ്ഥലനാമങ്ങളായി ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു.
  issues:
