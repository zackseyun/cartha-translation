  to: അവിടെനിന്ന്, ഞങ്ങളെക്കുറിച്ച് കേട്ട സഹോദരന്മാർ[a] അപ്പിയൂസ് ഫോറം വരെയും ത്രീ ടവേൺസ് വരെയും ഞങ്ങളെ എതിരേൽക്കാൻ വന്നു. അവരെ കണ്ടപ്പോൾ പൗലോസ് ദൈവത്തോടു നന്ദി പറഞ്ഞു ധൈര്യം നേടി.
