id: ACT.28.15
reference: Acts 28:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: ml
  text: അവിടെനിന്ന്, ഞങ്ങളെക്കുറിച്ച് കേട്ട സഹോദരന്മാർ[a] അപ്പിയൂസ് ഫോറം വരെയും ത്രീ ടവേൺസ് വരെയും ഞങ്ങളെ എതിരേൽക്കാൻ വന്നു. അവരെ കണ്ടപ്പോൾ പൗലോസ് ദൈവത്തോടു നന്ദി പറഞ്ഞു ധൈര്യം നേടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരന്മാരും സഹോദരിമാരും.’ ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്; സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്ന ഈ സാധാരണ പ്രയോഗം സന്ദർഭത്തിൽ സ്ത്രീകളെയും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: അവിടെനിന്ന്
  rationale: καί + ἐκεῖθεν യാത്രാവിവരണത്തിലെ സ്ഥലമാറ്റം തുടരുന്നു. മലയാളത്തിൽ ‘അവിടെനിന്ന്’ സ്വാഭാവികമായി ഈ ബന്ധവും ദിശയും അറിയിക്കുന്നു.
- source_word: οἱ ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്ത്രീകളും ഉൾപ്പെടാവുന്ന സഹവിശ്വാസികളെയാണ് ഇതു സൂചിപ്പിക്കുന്നതെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: ഞങ്ങളെക്കുറിച്ചു കേട്ടപ്പോൾ
  rationale: പങ്കുപദത്തെ കാലസൂചക ഉപവാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; τὰ περὶ ἡμῶν എന്നതിന്റെ പൊതുവായ ‘ഞങ്ങളെ സംബന്ധിച്ച കാര്യങ്ങൾ’ എന്ന അർഥം അനാവശ്യമായി ‘വാർത്ത’ എന്നു വ്യക്തമാക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: ഞങ്ങളെ എതിരേൽക്കാൻ വന്നു
  rationale: വരുന്ന ഒരാളെ വഴിയിൽ ചെന്നു സ്വീകരിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: അപ്പിയൂസ് ചന്തവരെയും മൂന്നു സത്രങ്ങൾവരെയും
  rationale: ἄχρι സൂചിപ്പിക്കുന്ന എത്തിച്ചേർന്ന പരിധി ‘വരെ’കൊണ്ട് നിലനിർത്തുന്നു. Forum എന്ന സ്ഥലനാമഘടകത്തിന് ‘ചന്ത’യും Tres Tabernae-യ്ക്ക് അർഥപരമായ ‘മൂന്നു സത്രങ്ങൾ’ എന്ന രൂപവും ഉപയോഗിക്കുന്നു.
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: അവരെ കണ്ടപ്പോൾ പൗലോസ്
  rationale: ബന്ധസർവനാമവും പങ്കുപദവും സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി മാറ്റുന്നു; ‘അവർ’ മുൻപറഞ്ഞ സഹോദരന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: ദൈവത്തിനു നന്ദി പറഞ്ഞു
  rationale: ദൈവത്തോടുള്ള നന്ദിപ്രകടനം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔλαβε θάρσος
  choice: ധൈര്യം പ്രാപിച്ചു
  rationale: അക്ഷരാർഥത്തിലെ ‘ധൈര്യം ലഭിച്ചു/സ്വീകരിച്ചു’ എന്ന ആശയം നിലനിർത്തുകയും, വെറും ബാഹ്യ പ്രോത്സാഹനമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: സമ്മിശ്രമായിരിക്കാവുന്ന ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ἀδελφοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു. അതേസമയം, ഈ സാധാരണ അഭിസംബോധന സന്ദർഭത്തിൽ സ്ത്രീകളെയും ഉൾക്കൊള്ളാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു; മുഖ്യവാചകത്തിൽ അതിനെ നിശ്ശബ്ദമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. യാത്രാവിവരണത്തിന്റെ ഒഴുക്ക് ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തി; സ്ഥലനാമങ്ങളിൽ പരമ്പരാഗതവും അർഥസുതാര്യവുമായ രൂപങ്ങൾ ഉപയോഗിച്ചു.
