id: ACT.28.2
reference: Acts 28:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: ml
  text: തദ്ദേശവാസികൾ[a] ഞങ്ങളോട് അസാധാരണമായ ദയ[b] കാണിച്ചു. പെയ്തുകൊണ്ടിരുന്ന മഴയും തണുപ്പും കാരണം അവർ തീ കൊളുത്തി ഞങ്ങളെ എല്ലാവരെയും സ്വീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ βάρβαροι എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘ബർബരർ’ എന്നാണ്; അതായത്, ഗ്രീക്ക് സംസാരിക്കാത്തവർ. ഇവിടെ അത് കാട്ടാളരെന്ന അർഥം നിർബന്ധമായും നൽകാതെ ദ്വീപിലെ തദ്ദേശവാസികളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘സാധാരണമായ ദയയല്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: തദ്ദേശവാസികൾ
  rationale: ഇവിടെ ഈ പദം ഗ്രീക്ക് സംസാരിക്കാത്ത ദ്വീപിലെ പ്രദേശവാസികളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ അപമാനാർഥം തോന്നിക്കാവുന്ന ‘ബർബരർ’ എന്ന പദം ഒഴിവാക്കി മൂലപദത്തിന്റെ വംശഭാഷാപരമായ സന്ദർഭാർഥം നൽകുന്നു.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: അസാധാരണമായ ദയ
  rationale: ‘സാധാരണമായതല്ലാത്ത മനുഷ്യസ്നേഹം/ദയ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ പകരുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: παρεῖχον
  choice: കാണിച്ചു
  rationale: φιλανθρωπίαν എന്ന നാമത്തോടൊപ്പം ‘ദയ കാണിച്ചു’ എന്നത് സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἅψαντες πυρὰν
  choice: തീ കത്തിച്ച്
  rationale: തീ കൊളുത്തിയ പ്രവൃത്തിയെയും അതിനെത്തുടർന്നുള്ള സ്വീകരണത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: προσελάβοντο
  choice: സ്വീകരിച്ചു
  rationale: സന്ദർഭത്തിലെ ആതിഥ്യമര്യാദ ഉൾക്കൊള്ളുന്ന വിധത്തിൽ, താമസസൗകര്യം നൽകിയെന്ന അധികാർഥം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: πάντας ἡμᾶς
  choice: ഞങ്ങളെ എല്ലാവരെയും
  rationale: സ്വീകരണം എല്ലാവരെയും ഉൾപ്പെടുത്തിയെന്ന മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: മഴ തുടർന്നുകൊണ്ടിരുന്നതിനാൽ
  rationale: വന്നെത്തി അപ്പോൾ നിലനിന്നിരുന്ന മഴയെ സൂചിപ്പിക്കുന്ന ἐφεστῶτα എന്ന പദത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸ ψῦχος
  choice: തണുപ്പായിരുന്നതിനാൽ
  rationale: ψῦχος സൂചിപ്പിക്കുന്ന തണുത്ത കാലാവസ്ഥയെ ലളിതവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അപമാനാർഥസാധ്യതയുള്ള അക്ഷരാർഥപദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു; ഗ്രീക്ക് നിഷേധപ്രയോഗത്തിന്റെ രൂപഭേദം മറ്റൊരു സാധ്യതയായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
