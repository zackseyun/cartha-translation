source:
  edition: SBLGNT
  text: ⸀Ἐνέμεινεν ⸀δὲ διετίαν ὅλην ἐν ἰδίῳ μισθώματι, καὶ ἀπεδέχετο πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: ml
  text: അവൻ രണ്ടു വർഷം മുഴുവനും താൻ വാടകയ്ക്കെടുത്ത താമസസ്ഥലത്ത് പാർത്തു[a]; തന്റെ അടുക്കൽ വന്ന എല്ലാവരെയും അവൻ സ്വീകരിച്ചുപോന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ വാടകവീട്ടിൽ.’ ഗ്രീക്കിലെ μίσθωμα വാടകയ്ക്കെടുത്ത പാർപ്പിടത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവന്റെ അടുക്കലേക്ക് പ്രവേശിച്ച് വന്ന എല്ലാവരെയും’; സന്ദർശകർ അവന്റെ താമസസ്ഥലത്തേക്ക് പ്രവേശിച്ചതായിരിക്കാം ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: പാർത്തു
  rationale: ἐμμένω ഇവിടെ ഒരു സ്ഥലത്ത് തുടർന്നു താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനസംഗ്രഹത്തിൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ് ‘പാർത്തു’.
- source_word: δὲ
  choice: വാക്യത്തിന്റെ ഒഴുക്കിൽ പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അതിനെ നിർബന്ധമായി ‘എന്നാൽ’ എന്നോ ‘പിന്നെ’ എന്നോ നൽകുന്നത് അനാവശ്യമായ അർത്ഥഭാരം സൃഷ്ടിക്കും.
- source_word: διετίαν ὅλην
  choice: രണ്ടു വർഷം മുഴുവനും
  rationale: കാലദൈർഘ്യവും ὅλην നൽകുന്ന പൂർണതയുടെ ഊന്നലും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: താൻ വാടകയ്ക്കെടുത്ത താമസസ്ഥലത്ത്
  rationale: μίσθωμα വാടകയ്ക്കെടുത്ത പാർപ്പിടത്തെ സൂചിപ്പിക്കുന്നു. ἰδίῳ എന്നത് സ്വന്തം ഉടമസ്ഥതയിലുള്ള വീട് എന്നല്ല, അവൻ സ്വന്തമായി ഏർപ്പെടുത്തിയ വാടകത്താമസം എന്ന ആശയമാണ് ഇവിടെ നൽകുന്നത്.
- source_word: ἀπεδέχετο
  choice: സ്വാഗതം ചെയ്തു
  rationale: അപൂർണഭൂതകാലരൂപം ആവർത്തിച്ചോ തുടർച്ചയായോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘സ്വാഗതം ചെയ്തു’ സന്ദർശകരെ സ്വീകരിച്ച ആതിഥ്യമനോഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: തന്റെ അടുക്കൽ വന്ന എല്ലാവരെയും
  rationale: εἰσπορεύομαι എന്നതിലെ അകത്തേക്കു പ്രവേശിക്കുന്ന സ്ഥലസൂചന മലയാളത്തിൽ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; മുഖ്യവാചകത്തിലെ പ്രയോഗം സ്വാഭാവികവും അർത്ഥസമ്പൂർണവുമാണ്.
