  source_fidelity: 'The draft accurately represents the two coordinated present participles, the kingdom of God, the Lord Jesus the Messiah, boldness, and the concluding sense of being unhindered. However, the combined construction «പ്രസംഗിക്കുകയും … പഠിപ്പിക്കുകയും ചെയ്തുകൊണ്ട്» is grammatically and aspectually awkward in Malayalam: the finite-like coordination followed by «ചെയ്തുകൊണ്ട്» does not cleanly reproduce the Greek participial coordination.'
