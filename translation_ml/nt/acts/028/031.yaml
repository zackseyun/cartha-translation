  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: ml
  text: ദൈവരാജ്യം പ്രസംഗിച്ചും കർത്താവായ യേശു മശീഹയെക്കുറിച്ചുള്ള കാര്യങ്ങൾ പൂർണ ധൈര്യത്തോടെ[a], യാതൊരു തടസ്സവുമില്ലാതെ പഠിപ്പിച്ചും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കർത്താവായ യേശുക്രിസ്തുവിനെക്കുറിച്ചുള്ള കാര്യങ്ങൾ.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “മശീഹ” എന്ന സ്ഥാനപ്പേരായോ ചില സന്ദർഭങ്ങളിൽ “ക്രിസ്തു” എന്ന പേരുസദൃശമായ വിശേഷണമായോ പ്രവർത്തിക്കാം.'
