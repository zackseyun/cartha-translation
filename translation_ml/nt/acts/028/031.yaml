lexical_decisions:
- source_word: κηρύσσων
  choice: പ്രസംഗിക്കുകയും
  rationale: തുടർന്നുകൊണ്ടിരുന്ന പരസ്യമായ പ്രഖ്യാപനപ്രവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഔപചാരിക പ്രഭാഷണത്തിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: βασιλείαയുടെ രാജ്യം/ഭരണം എന്നീ അർഥവ്യാപ്തികൾ നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിലും പൊതുവായ പ്രയോഗത്തിലും സ്വാഭാവികമായ രൂപം.
- source_word: διδάσκων
  choice: പഠിപ്പിക്കുകയും
  rationale: κηρύσσων എന്നതിനോടു സമാന്തരമായി പൗലോസിന്റെ തുടർച്ചയായ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: τὰ περὶ
  choice: കുറിച്ചുള്ള കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: τοῦ κυρίου
  choice: കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിനെ നിലനിർത്തുകയും തുടർന്നുള്ള പേരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയെ
  rationale: Ἰησοῦ എന്ന പേര് ലിപ്യന്തരണം ചെയ്യുകയും Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ‘മശീഹ’ എന്നു പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: μετὰ πάσης παρρησίας
  choice: പൂർണ ധൈര്യത്തോടെ
  rationale: ഭയമില്ലാത്ത തുറന്ന സംസാരമെന്ന παρρησίαയുടെ ആശയവും πάσης എന്ന തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀκωλύτως
  choice: തടസ്സമില്ലാതെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളുടെ സമാപനത്തിൽ സുവിശേഷപ്രവർത്തനം തടയപ്പെടാതിരുന്നതിനെ ഊന്നിപ്പറയുന്ന ക്രിയാവിശേഷണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദം ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരുകളുടെ നിരയിൽ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός എന്നതിന്റെ സ്ഥാനപ്പേർസ്വഭാവം സജീവമാണ്; ‘മശീഹ’ അതിന്റെ അർഥം തുറന്നുകാട്ടുന്നു. പരിചിതമായ പേരുസദൃശ രൂപമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻസന്ദർഭത്തെ തുടർന്നുകൊണ്ടിരിക്കുന്നതിനാൽ ഗ്രീക്കിലെ വർത്തമാന കൃദന്തരൂപങ്ങൾ ‘ചെയ്തുകൊണ്ട്’ എന്ന തുടർച്ചാസൂചനയോടെ നൽകിയിരിക്കുന്നു; അവസാനത്തെ ἀκωλύτως ഊന്നൽ നിലനിർത്താൻ ‘തടസ്സമില്ലാതെ’ വാക്യാവസാനത്തോട് ചേർത്തിരിക്കുന്നു.
