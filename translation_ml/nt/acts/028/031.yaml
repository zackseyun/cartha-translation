  terminology: «ദൈവരാജ്യം», «കർത്താവായ», and «മശീഹ» are suitable. The footnote correctly identifies «ക്രിസ്തു» as the name-like alternative for Χριστός. The boldness anchor remains placed directly after the relevant phrase.
