translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ അസ്വാഭാവികമായി തോന്നാവുന്ന സമാനപദാവർത്തനം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. നാവികസന്ദർഭം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്നവിധം ‘കപ്പൽയാത്ര’, ‘കപ്പലിൽ കയറ്റിത്തന്നു’ എന്നീ പ്രയോഗങ്ങൾ ഉപയോഗിച്ചു.
