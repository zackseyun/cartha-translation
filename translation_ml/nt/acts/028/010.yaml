id: ACT.28.10
reference: Acts 28:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: ml
  text: അവർ ഞങ്ങളെ വളരെ ആദരിക്കുകയും[a], ഞങ്ങൾ കപ്പൽയാത്രയ്ക്കു പുറപ്പെടുമ്പോൾ[b] ഞങ്ങൾക്ക് ആവശ്യമായ സാധനങ്ങൾ കപ്പലിൽ കയറ്റിത്തരുകയും ചെയ്തു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അനേകം ആദരങ്ങളാൽ ഞങ്ങളെ ആദരിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഞങ്ങൾ കടലിലേക്കു പുറപ്പെടുമ്പോൾ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം കപ്പലിൽ യാത്ര ആരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന നാവികപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘ഞങ്ങൾക്ക് ആവശ്യമായവ അവർ ഒരുക്കിത്തന്നു.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, ‘ആവശ്യങ്ങൾക്കുള്ളവ അവർ വെച്ചു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: വളരെ ആദരിക്കുകയും
  rationale: ഗ്രീക്കിൽ ‘അനേകം ആദരങ്ങളാൽ ആദരിച്ചു’ എന്ന സമാനപദാവർത്തനം ഉണ്ട്. മലയാളത്തിൽ അതു പദാനുപദമായി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ, ആദരത്തിന്റെ സമൃദ്ധി നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗമായ ‘വളരെ ആദരിച്ചു’ തിരഞ്ഞെടുത്തു; അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἀναγομένοις
  choice: ഞങ്ങൾ കപ്പൽയാത്ര പുറപ്പെടുമ്പോൾ
  rationale: ἀνάγω എന്ന ക്രിയയുടെ ഈ നാവികപ്രയോഗം കപ്പലിൽ യാത്ര ആരംഭിക്കുന്നതിനെയോ കടലിലേക്കു പുറപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭവും നാവികഭാവവും വ്യക്തമായി നിലനിർത്താൻ ഈ രൂപം സ്വീകരിച്ചു.
- source_word: ἐπέθεντο
  choice: കപ്പലിൽ കയറ്റിത്തരുകയും ചെയ്തു
  rationale: ἐπιτίθημι എന്നതിന്റെ മധ്യരൂപം ഇവിടെ യാത്രക്കാർക്കുവേണ്ടി സാധനങ്ങൾ കപ്പലിൽ വെച്ചുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കപ്പൽ വ്യക്തമായി പറയാത്തെങ്കിലും നാവികസന്ദർഭത്തിൽ മലയാളത്തിൽ അത് വ്യക്തമാക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: τὰ πρὸς τὰς χρείας
  choice: ഞങ്ങൾക്ക് ആവശ്യമായ സാധനങ്ങൾ
  rationale: ‘ആവശ്യങ്ങൾക്കുള്ളവ’ എന്ന ആശയം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു. τὰ എന്ന ബഹുവചനസാരത്തെ ‘സാധനങ്ങൾ’ എന്ന പദം പ്രകടമാക്കുന്നു.
