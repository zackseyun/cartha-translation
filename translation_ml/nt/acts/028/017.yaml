  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: ml
  text: 'മൂന്നു ദിവസം കഴിഞ്ഞ് അദ്ദേഹം യെഹൂദന്മാരിലെ പ്രമുഖരെ[a] വിളിച്ചുകൂട്ടി. അവർ ഒന്നിച്ചുകൂടിയപ്പോൾ അദ്ദേഹം അവരോടു പറഞ്ഞു: “സഹോദരന്മാരേ,[b] ജനത്തിനോ പൂർവികരുടെ ആചാരങ്ങൾക്കോ[c] എതിരായി ഞാൻ ഒന്നും ചെയ്തിട്ടില്ലെങ്കിലും, യെരൂശലേമിൽനിന്ന് തടവുകാരനായി റോമാക്കാരുടെ കൈകളിൽ ഏൽപ്പിക്കപ്പെട്ടു.[d]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദന്മാരുടെ നേതാക്കളെ” അല്ലെങ്കിൽ “യെഹൂദന്മാരിൽ പ്രഥമസ്ഥാനത്തുള്ളവരെ.”
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാരേ” എന്നത് ഗ്രീക്കിലെ ἀδελφοί എന്ന അഭിസംബോധനയുടെ പരിഭാഷയാണ്. ഇവിടെ പൗലൊസ് താൻ വിളിച്ചുകൂട്ടിയ യെഹൂദപുരുഷനേതാക്കളോടാണ് സംസാരിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: അഥവാ “പൈതൃകാചാരങ്ങൾക്കോ.”
    reason: lexical_alternative
  - marker: d
    text: 'അഥവാ “റോമാക്കാർക്ക് ഏൽപ്പിക്കപ്പെട്ടു.” കൂടുതൽ അക്ഷരാർഥത്തിൽ: “റോമാക്കാരുടെ കൈകളിലേക്ക് ഏൽപ്പിക്കപ്പെട്ടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: മൂന്നു ദിവസം കഴിഞ്ഞപ്പോൾ
  rationale: ലൂക്കോസിന്റെ സംഭവാവതരണ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സമയവാക്യമായി നൽകി; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ ചേർത്തില്ല.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: അദ്ദേഹം ... വിളിച്ചുകൂട്ടി
  rationale: συν- സൂചിപ്പിക്കുന്ന ഒരുമിച്ചുകൂട്ടൽഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: യെഹൂദന്മാരിലെ പ്രമുഖരെ
  rationale: πρώτους ഇവിടെ ക്രമത്തെയല്ല, സാമൂഹിക പ്രാമുഖ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: അവർ ഒന്നിച്ചുകൂടിയപ്പോൾ
  rationale: ഗ്രീക്ക് genitive absolute സ്വാഭാവികമായ മലയാള സമയവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ, ... ഞാൻ
  rationale: പുരുഷന്മാരായ യെഹൂദനേതാക്കളോടുള്ള ആദരവും സമുദായ ഐക്യബോധവും സംരക്ഷിക്കുന്നു; ഊന്നൽ ലഭിക്കുന്ന ‘ഞാൻ’ പ്രസ്താവനയിൽ നിലനിർത്തുന്നു.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: എതിരായി ഞാൻ ഒന്നും ചെയ്തിട്ടില്ലെങ്കിലും
  rationale: പൗലൊസിന്റെ നിരപരാധിത്വവും എന്നിട്ടും കൈമാറപ്പെട്ടതുമായ വൈരുധ്യം വ്യക്തമാക്കുന്ന concessive ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τῷ λαῷ
  choice: നമ്മുടെ ജനത്തിന്
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലെങ്കിലും, യെഹൂദശ്രോതാക്കളോടുള്ള പൗലൊസിന്റെ ഐക്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: പൂർവികരിൽനിന്നു ലഭിച്ച ആചാരങ്ങൾ
  rationale: πατρῴοις എന്നതിലെ പാരമ്പര്യമായി ലഭിച്ചെന്ന ആശയം ആധുനികവും ഉൾക്കൊള്ളാവുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δέσμιος
  choice: തടവുകാരനായി
  rationale: പൗലൊസിന്റെ നിയമപരവും കാവൽബന്ധിതവുമായ സ്ഥിതി സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρεδόθην ... εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: റോമാക്കാരുടെ കൈകളിൽ ഏൽപ്പിച്ചു
  rationale: ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ചേർക്കാതെ നിയമപരമായി കൈമാറിയെന്ന അർഥവും ‘കൈകളിൽ’ എന്ന മൂലരൂപകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന അഭിസംബോധനയുടെ ലിംഗസൂചന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: സന്ദർഭത്തിൽ വിളിച്ചുകൂട്ടപ്പെട്ടവർ യെഹൂദന്മാരിലെ പുരുഷപ്രമുഖരാണ്; അതിനാൽ ഗ്രീക്കിലെ പുരുഷലിംഗ അഭിസംബോധനയും പൗലൊസിന്റെ ഐക്യബോധവും സംരക്ഷിച്ചു.
- issue: οὐδὲν ἐναντίον ποιήσας എന്ന participle-ന്റെ ബന്ധം
  choice: 'വഴങ്ങൽ/വൈരുധ്യാർഥം: ‘ഒന്നും ചെയ്തിട്ടില്ലെങ്കിലും’'
  alternative: 'സമകാലിക വിവരണം: ‘ഒന്നും ചെയ്യാതെ’'
  rationale: ഒന്നും വിരുദ്ധമായി ചെയ്തിട്ടില്ലെങ്കിലും തടവുകാരനായി കൈമാറപ്പെട്ടുവെന്ന വാചകത്തിലെ നീതിനിഷേധത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: παρεδόθην എന്ന ദൈവശാസ്ത്രപരമായി സാദ്ധ്യതയുള്ള passive
  choice: 'മാനുഷിക-നിയമപരമായ കൈമാറ്റം: ‘ഏൽപ്പിച്ചു’'
  alternative: ദൈവിക പ്രവർത്തനം സൂചിപ്പിക്കുന്ന ‘ഏൽപ്പിക്കപ്പെട്ടു’ എന്ന വ്യാഖ്യാനഭാരം
  rationale: ഈ സന്ദർഭം റോമൻ കസ്റ്റഡിയിലേക്കുള്ള കൈമാറ്റത്തെക്കുറിച്ചാണ്; മറഞ്ഞ ദൈവിക കർത്താവിനെ നിർബന്ധമായി ഇറക്കുമതി ചെയ്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കഥാഭാഗത്തിൽ ‘അദ്ദേഹം’ ഉപയോഗിച്ച് ഗൗരവം നിലനിർത്തി; നേരിട്ടുള്ള പ്രസംഗത്തിൽ പൗലൊസിന്റെ യെഹൂദ ഐക്യബോധവും നിയമപരമായ സാഹചര്യവും സ്വാഭാവികമായി പ്രകടമാക്കി.
