- from: അതുകൊണ്ട്, ദൈവത്തിന്റെ ഈ രക്ഷ ജനതകൾക്ക്[a] അയയ്ക്കപ്പെട്ടിരിക്കുന്നു എന്നു നിങ്ങൾ അറിഞ്ഞുകൊള്ളുക; അവർ അത് കേൾക്കുകയും ചെയ്യും.[b]
  to: അതുകൊണ്ട്, ദൈവത്തിന്റെ ഈ രക്ഷ യഹൂദേതര ജനതകൾക്ക്[a] അയയ്ക്കപ്പെട്ടിരിക്കുന്നു എന്നു നിങ്ങൾ അറിഞ്ഞുകൊള്ളുക; അവരും കേൾക്കും.[b]
  rationale: The revision removes the unsupported explicit object, restores the emphatic ‘also’ in αὐτοὶ καί, and clarifies the contextual Gentile sense of τοῖς ἔθνεσιν. It retains the draft’s appropriately non-interpretive rendering of σωτήριον and preserves the ambiguity of τοῦ θεοῦ in the footnote.
