  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിന്റെ ഈ രക്ഷ യഹൂദേതര ജനതകൾക്ക്[a] അയയ്ക്കപ്പെട്ടിരിക്കുന്നു എന്നു നിങ്ങൾ അറിഞ്ഞുകൊള്ളുക; അവരും കേൾക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജനതകൾക്ക്.’ ഇവിടെ ഗ്രീക്കിലെ പദം യഹൂദരിൽനിന്ന് വേർതിരിച്ചുകാണിക്കുന്ന യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിന്റെ ഈ രക്ഷ’ എന്നത് ‘ദൈവത്തിൽനിന്നുള്ള ഈ രക്ഷ’ എന്നും മനസ്സിലാക്കാം; ഗ്രീക്കിലെ ബന്ധപ്രയോഗം അടുത്ത ബന്ധമുള്ള ഒന്നിലധികം അർഥങ്ങൾക്ക് ഇടനൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവരും ശ്രദ്ധിച്ചു കേൾക്കും.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘കേൾക്കുക’ എന്നോ ശ്രദ്ധയോടെ കേൾക്കുക, അനുകൂലമായി പ്രതികരിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: അതുകൊണ്ട് ... എന്നു നിങ്ങൾ അറിഞ്ഞുകൊള്ളുക
  rationale: നിഗമനസൂചകമായ οὖν-നെയും പൊതുവായ പ്രഖ്യാപനത്തിന്റെ ഭാവമുള്ള γνωστὸν ... ἔστω ὑμῖν എന്ന പ്രയോഗത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς ἔθνεσιν
  choice: ജനതകൾക്ക്
  rationale: ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അത് യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ἀπεστάλη
  choice: അയയ്ക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കലിനെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്ന കർമണിപ്രയോഗം.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഈ രക്ഷ
  rationale: σωτήριον എന്നതിനെ വ്യാഖ്യാനാത്മകമായി ‘രക്ഷാസന്ദേശം’ എന്നു ചുരുക്കാതെ ‘രക്ഷ’ എന്നു നൽകുന്നു; τοῦ θεοῦ-യുടെ ബന്ധം ‘ദൈവത്തിന്റെ’ എന്ന രൂപത്തിൽ മനപ്പൂർവം തുറന്നുവെക്കുന്നു.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: അവർ അത് കേൾക്കുകയും ചെയ്യും
  rationale: ἀκούω എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കേൾക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘ശ്രദ്ധിച്ചു കേൾക്കുക/സ്വീകരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘അത്’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: σωτήριον എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘രക്ഷ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രക്ഷാസന്ദേശം’
  rationale: ഗ്രീക്ക് പദം രക്ഷയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ പ്രഖ്യാപനം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും അതിനെ ‘സന്ദേശം’ എന്നു മാത്രം വ്യാഖ്യാനിക്കുന്നത് പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കും.
- issue: τοῦ θεοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: ‘ദൈവത്തിന്റെ’ എന്ന തുറന്ന ബന്ധപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവത്തിൽനിന്നുള്ള’
  rationale: ഇത് ഉറവിടം, ഉടമസ്ഥത, സ്വഭാവബന്ധം എന്നിവയിൽ ഒന്നിലധികം അടുത്ത അർഥങ്ങൾ അനുവദിക്കുന്നു; പ്രധാനവാചകത്തിൽ ഒറ്റ വ്യാഖ്യാനം നിർബന്ധിച്ചിട്ടില്ല.
- issue: ἀκούσονται എന്നതിന്റെ ഭാവം
  choice: ‘കേൾക്കുകയും ചെയ്യും’
  alternative: ‘ശ്രദ്ധിച്ചു കേൾക്കുകയും ചെയ്യും’ / ‘സ്വീകരിക്കുകയും ചെയ്യും’
  rationale: സന്ദർഭം അനുകൂലമായ പ്രതികരണം സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ‘സ്വീകരിക്കും’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ ശക്തമാണ്. അടിസ്ഥാന അർഥം പ്രധാനവാചകത്തിൽ സൂക്ഷിച്ച് സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അറിഞ്ഞുകൊള്ളുക’ പ്രഖ്യാപനത്തിന്റെ ഔപചാരിക ഭാവം സൂക്ഷിക്കുന്നു. ‘ജനതകൾ’ മൂലപദത്തിന്റെ രൂപം നിലനിർത്തുമ്പോൾ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
