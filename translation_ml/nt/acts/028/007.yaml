id: ACT.28.7
reference: Acts 28:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: ml
  text: ആ സ്ഥലത്തിന്റെ ചുറ്റുപാടിൽ, പുബ്ലിയോസ് എന്നു പേരുള്ള ദ്വീപിലെ പ്രമുഖന്റെ[a] ഭൂസ്വത്തുക്കൾ[b] ഉണ്ടായിരുന്നു. അദ്ദേഹം ഞങ്ങളെ സ്വീകരിച്ച്, മൂന്നു ദിവസം സൗഹൃദപൂർവം ആതിഥ്യമരുളി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദ്വീപിലെ പ്രധാനി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ τῷ πρώτῳ τῆς νήσου ദ്വീപിലെ ഏറ്റവും പ്രമുഖനായോ ഉയർന്ന സ്ഥാനമുള്ളയാളായോ ഒരാളെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘ഭൂമികൾ’ അല്ലെങ്കിൽ ‘എസ്റ്റേറ്റുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. χωρία സമീപപ്രദേശത്തുള്ള ഭൂമിയുടമസ്ഥതകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: ആ സ്ഥലത്തിന്റെ ചുറ്റുപാടിൽ
  rationale: περὶ τὸν τόπον എന്നത് സമീപപ്രദേശത്തെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദമായി ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ὑπῆρχεν χωρία
  choice: ഭൂസ്വത്തുക്കൾ ഉണ്ടായിരുന്നു
  rationale: χωρία ഇവിടെ വയലുകൾ മാത്രം എന്നതിലുപരി സമീപത്തുള്ള ഭൂമിയുടമസ്ഥതകളെയോ എസ്റ്റേറ്റുകളെയോ സൂചിപ്പിക്കാം; ബഹുവചനം നിലനിർത്തി ‘ഭൂസ്വത്തുക്കൾ’ എന്നു നൽകി.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: ദ്വീപിലെ പ്രമുഖന്റെ
  rationale: πρῶτος ഇവിടെ കേവല ക്രമസംഖ്യയല്ല, പ്രമുഖത്വമോ ഉയർന്ന സ്ഥാനമോ സൂചിപ്പിക്കുന്ന പദവിപ്രയോഗമാണ്. ഔദ്യോഗിക പദവി നിർബന്ധിച്ച് നിശ്ചയിക്കാതെ ‘പ്രമുഖൻ’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὀνόματι Ποπλίῳ
  choice: പുബ്ലിയോസ് എന്നു പേരുള്ള
  rationale: ഗ്രീക്ക് Ποπλίῳ എന്ന പേരിന്റെ മലയാള ലിപ്യന്തരണം ‘പുബ്ലിയോസ്’ ആയി നൽകി.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: ഞങ്ങളെ സ്വീകരിച്ച്
  rationale: അതിഥികളെ ഏറ്റുവാങ്ങുക/സ്വാഗതം ചെയ്യുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τρεῖς ἡμέρας
  choice: മൂന്നു ദിവസം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന accusative പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി ‘മൂന്നു ദിവസം’ എന്നു നൽകുന്നു.
- source_word: φιλοφρόνως ἐξένισεν
  choice: സൗഹാർദപൂർവം അതിഥികളായി പാർപ്പിച്ചു
  rationale: φιλοφρόνως എന്നതിലെ ദയാപൂർവവും സൗഹൃദപരവുമായ പെരുമാറ്റവും ξενίζω എന്നതിലെ ആതിഥ്യം നൽകി പാർപ്പിക്കൽ എന്ന ആശയവും ഒരുമിച്ച് വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. സ്രോതസ്സിലെ പദവിയുടെ സാധ്യതാപരമായ അർഥം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ആതിഥ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്തു.
