  terminology: ‘ദ്വീപിലെ പ്രമുഖൻ’ appropriately preserves the nontechnical but status-bearing force of τῷ πρώτῳ τῆς νήσου. ‘ഭൂസ്വത്തുക്കൾ’ suitably represents χωρία without narrowing it to fields. ‘പുബ്ലിയോസ്’ is retained as the draft’s transliteration of Ποπλίῳ.
