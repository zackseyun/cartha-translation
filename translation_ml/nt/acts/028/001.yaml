source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: ml
  text: ഞങ്ങൾ സുരക്ഷിതമായി രക്ഷപ്പെട്ടശേഷം,[a] ആ ദ്വീപിന്റെ പേര് മാൾട്ട[b] എന്നാണ് അപ്പോൾ മനസ്സിലാക്കിയത്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ സുരക്ഷിതമായി കരകയറ്റപ്പെട്ടശേഷം” അല്ലെങ്കിൽ “ഞങ്ങൾ രക്ഷിക്കപ്പെട്ടശേഷം.” ഗ്രീക്ക് ക്രിയ അപകടത്തിലൂടെ സുരക്ഷിതമായി രക്ഷിക്കപ്പെട്ടതിനെ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: മെലിതേ; പരമ്പരാഗതമായി മാൾട്ട ദ്വീപായി തിരിച്ചറിയപ്പെടുന്നു.'
    reason: cultural_note
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “ആ ദ്വീപ് മാൾട്ട എന്നു വിളിക്കപ്പെടുന്നു.” ലഭിച്ച വിവരം വിവരിക്കുമ്പോൾ ഗ്രീക്ക് വർത്തമാനകാല കർമ്മണി രൂപം ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: സുരക്ഷിതരായി രക്ഷപ്പെട്ടശേഷം
  rationale: διασῴζω എന്ന ക്രിയയുടെ aorist passive participle അപകടത്തിലൂടെ സുരക്ഷിതമായി രക്ഷിക്കപ്പെടുകയോ രക്ഷപ്പെടുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഈ പ്രയോഗം വിജയകരമായ രക്ഷയെ മുൻനിറുത്തുന്നു; കർമ്മണിഭാവം നിർബന്ധമായി വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവങ്ങളുടെ കാലക്രമം സൂചിപ്പിക്കുന്ന ലളിതമായ കാലവാചകം; ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക സമാനപദം.
- source_word: ἐπέγνωμεν
  choice: മനസ്സിലാക്കി
  rationale: ഇവിടെ പേര് സംബന്ധിച്ച വിവരം അപ്പോൾ അറിഞ്ഞു എന്ന ആശയമാണ്. 'മനസ്സിലാക്കി' സാധാരണ മലയാളത്തിൽ ആ കണ്ടെത്തലിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Μελίτη
  choice: മാൾട്ടാ
  rationale: Μελίτη എന്ന ഗ്രീക്ക് നാമം പരമ്പരാഗതമായി തിരിച്ചറിയപ്പെടുന്ന Malta ദ്വീപിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപത്തിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἡ νῆσος
  choice: ആ ദ്വീപ്
  rationale: സന്ദർഭത്തിൽ അവർ കരകയറിയ ദ്വീപിനെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ 'ആ ദ്വീപ്' വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καλεῖται
  choice: പേര് ... ആണ്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കർമ്മണി രൂപമായ 'വിളിക്കപ്പെടുന്നു' എന്നതിന്റെ അർത്ഥം, ദ്വീപിന്റെ പേര് അറിയിക്കുന്ന സ്വാഭാവിക മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
