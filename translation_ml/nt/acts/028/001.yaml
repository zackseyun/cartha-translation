translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. 'സുരക്ഷിതരായി രക്ഷപ്പെട്ടശേഷം' എന്നത് കപ്പൽച്ചേതത്തിന്റെ പശ്ചാത്തലവും ഗ്രീക്ക് പദത്തിലെ രക്ഷയുടെ ഊന്നലും സംരക്ഷിക്കുന്നു. വാക്യത്തിലെ Καί മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ സ്വാഭാവിക തുടർച്ചയിലൂടെ സൂചിപ്പിച്ചിരിക്കുന്നു.
