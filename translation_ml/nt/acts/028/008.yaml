id: ACT.28.8
reference: Acts 28:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: ml
  text: പുബ്ലിയൊസിന്റെ പിതാവ് പനികളും അതിസാരവും ബാധിച്ച് കിടക്കുകയായിരുന്നു.[a] പൗലോസ് അദ്ദേഹത്തിന്റെ അടുക്കലേക്കു അകത്തു ചെന്നു പ്രാർഥിച്ചു; പിന്നെ അദ്ദേഹത്തിന്റെമേൽ കൈകൾ വെച്ച് അദ്ദേഹത്തെ സൗഖ്യമാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പനികളും അതിസാരവും പിടിമുറുക്കിയതിനാൽ കിടക്കുകയായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ഈ രോഗങ്ങൾ അയാളെ ബാധിച്ചോ പിടികൂടിയോ ഇരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: '[പ്രത്യേക പദമായി പ്രകടിപ്പിക്കാതെ വാക്യത്തിന്റെ ആഖ്യാനക്രമത്തിൽ ഉൾപ്പെടുത്തി]'
  rationale: ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ സാധാരണ സംഭവപരിചയപ്പെടുത്തൽ പ്രയോഗമാണിത്. മലയാളത്തിൽ ‘അപ്പോൾ സംഭവിച്ചത്’ എന്നു ചേർക്കുന്നത് അനാവശ്യമായി ഭാരമുള്ളതും മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തമായ കാലസൂചന നൽകുന്നതുമാകും.
- source_word: πατέρα τοῦ Ποπλίου
  choice: പുബ്ലിയൊസിന്റെ പിതാവ്
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: πυρετοῖς
  choice: പനികളും
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു; ആവർത്തിച്ചോ പലവിധത്തിലോ ഉണ്ടായ പനിബാധയെ അതിലധികം വിശദീകരിക്കാതെ സൂചിപ്പിക്കുന്നു.
- source_word: δυσεντερίῳ
  choice: അതിസാരവും
  rationale: ദഹനവ്യവസ്ഥയെ ബാധിക്കുന്ന ഈ രോഗത്തിനുള്ള വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാള പദം.
- source_word: συνεχόμενον
  choice: ബാധിച്ച്
  rationale: രോഗങ്ങൾ അയാളെ പിടികൂടി തുടർച്ചയായി ബാധിച്ചിരുന്ന അവസ്ഥയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; കൂടുതൽ ശക്തമായ ‘പിടിമുറുക്കി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατακεῖσθαι
  choice: കിടക്കുകയായിരുന്നു
  rationale: രോഗാവസ്ഥയിൽ കിടന്നിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; പൂർണമായി കിടപ്പിലായിരുന്നുവെന്ന് അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: പൗലോസ് അയാളുടെ അടുക്കൽ അകത്തു ചെന്ന്
  rationale: രോഗി ഉണ്ടായിരുന്ന ഇടത്തേക്ക് പൗലോസ് പ്രവേശിച്ചതും അയാളെ സമീപിച്ചതും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: προσευξάμενος
  choice: പ്രാർഥിച്ചു; പിന്നെ
  rationale: പ്രാർഥന കൈവെക്കലിനും സൗഖ്യമാക്കലിനും മുമ്പുണ്ടായതായി അഓറിസ്റ്റ് പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന ക്രമം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: അയാളുടെമേൽ കൈകൾ വെച്ച്
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ‘കൈകൾ’ നിലനിർത്തുകയും പ്രവൃത്തിയെ പരിചിതമായ ബൈബിൾ ഭാഷയിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἰάσατο αὐτόν
  choice: അയാളെ സൗഖ്യമാക്കി
  rationale: രോഗശാന്തിയെ നേരിട്ട് പ്രസ്താവിക്കുന്നു; അതിന്റെ രീതി സംബന്ധിച്ച അധിക വൈദ്യശാസ്ത്രപരമോ സാങ്കേതിക ദൈവശാസ്ത്രപരമോ ആയ നിർവചനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിലൂടെ നടന്ന രോഗശാന്തിയുടെ സ്വഭാവം
  choice: പ്രാർഥന, കൈവെക്കൽ, സൗഖ്യമാക്കൽ എന്നീ സംഭവക്രമം നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ഇത് ‘അത്ഭുതരോഗശാന്തി’യെന്നോ വൈദ്യപരമായ സുഖപ്രാപ്തിയെന്നോ പ്രത്യേകം വിശേഷിപ്പിക്കുക.
  rationale: വാക്യം പൗലോസിന്റെ പ്രാർഥനാപൂർവമായ പ്രവൃത്തിയിലൂടെ രോഗി സൗഖ്യം പ്രാപിച്ചതായി പറയുന്നു; എന്നാൽ രോഗശാന്തിയുടെ തൽക്ഷണതയെയോ സാങ്കേതിക സ്വഭാവത്തെയോ കൂദാശാപരമായ അർഥത്തെയോ പ്രത്യേകം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അയാൾ’ എന്നത് പിതാവിനെ വ്യക്തമായി പരാമർശിക്കുകയും മൂലപാഠത്തിൽ ഇല്ലാത്ത ആദരസൂചക ഭാവം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു. രോഗനാമങ്ങളിലും രോഗശാന്തിയുടെ വിവരണത്തിലും മൂലത്തിലെ ബഹുവചനവും ക്രമവും പരമാവധി സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
