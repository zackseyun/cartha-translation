  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: ml
  text: 'അവർ പരസ്പരം വിയോജിച്ചിരുന്നതിനാൽ, പൗലോസ് അവസാനമായി ഒരു വാക്ക്[a] പറഞ്ഞശേഷം അവർ പിരിഞ്ഞുപോകുകയായിരുന്നു: “പരിശുദ്ധാത്മാവ് യെശയ്യാ പ്രവാചകനിലൂടെ നിങ്ങളുടെ പിതാക്കന്മാരോട്[b] പറഞ്ഞത് ശരിയായിരുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരു വാക്ക്” അല്ലെങ്കിൽ “ഒരു പ്രസ്താവന.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഒരു വാക്ക്”; ഇവിടെ അത് സമാപനപരാമർശമായി പ്രവർത്തിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിങ്ങളുടെ പൂർവികരോട്.” ഗ്രീക്കിൽ “നിങ്ങളുടെ പിതാക്കന്മാരോട്”; ഇത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι ... ὄντες πρὸς ἀλλήλους
  choice: അവർ പരസ്പരം യോജിക്കാതിരുന്നതിനാൽ
  rationale: പരസ്പരമുള്ള വിയോജിപ്പിന്റെ അവസ്ഥ വ്യക്തമാക്കുകയും ഗ്രീക്ക് കൃദ്യന്തപ്രയോഗം സ്വാഭാവികമായ മലയാള കാരണവാക്യമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἀπελύοντο
  choice: അവർ പിരിഞ്ഞുപോകാൻ തുടങ്ങി
  rationale: അപൂർണഭൂതകാലരൂപം സംഘം പിരിഞ്ഞ് പോകുന്ന പ്രക്രിയയെയോ അതിന്റെ ആരംഭത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പിരിഞ്ഞുപോകാൻ തുടങ്ങി’ ആ ഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: εἰπόντος τοῦ Παύλου
  choice: പൗലോസ് ... പറഞ്ഞശേഷം
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഘടനയെ സംഭവക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ῥῆμα ἓν
  choice: അവസാനമായി ഒരു വാക്ക്
  rationale: അക്ഷരാർഥം ‘ഒരു വാക്ക്’ എന്നാണെങ്കിലും ഇവിടെ പിരിയുന്നതിന് മുമ്പുള്ള സമാപനപരാമർശമാണ്; രണ്ടും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Καλῶς
  choice: ശരിയായിരുന്നു
  rationale: പരിശുദ്ധാത്മാവ് പറഞ്ഞതിന്റെ യാഥാർഥ്യത്തെയോ യുക്തിയെയോ അംഗീകരിക്കുന്ന മൂല്യനിർണയഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: വ്യക്തമായ ദൈവിക പരാമർശത്തിനുള്ള നിലവാരമുള്ള മലയാള ബൈബിൾ പദപ്രയോഗം.
- source_word: ἐλάλησεν
  choice: പറഞ്ഞത്
  rationale: പ്രവാചകനിലൂടെ അറിയിച്ച വാക്കിനെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; സംസാരപ്രവർത്തിയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: യെശയ്യാ പ്രവാചകനിലൂടെ
  rationale: διά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന മധ്യസ്ഥത/കരണത്വം ‘-ലൂടെ’ കൃത്യമായി പകരുന്നു.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോട്
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചനമായ ‘പിതാക്കന്മാർ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഇസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ പിതാക്കന്മാർ’ എന്നതിന്റെ സൂചന
  choice: നിങ്ങളുടെ പിതാക്കന്മാരോട്
  alternative: നിങ്ങളുടെ പൂർവികരോട്
  rationale: ഗ്രീക്ക് πατέρας എന്ന പുരുഷലിംഗ കുടുംബപദം നേരിട്ട് നിലനിർത്തുന്നു; അതിന്റെ സന്ദർഭാർഥം ഇസ്രായേലിന്റെ പൂർവികർ എന്നതാണ്.
- issue: പ്രവാചകവചനത്തിൽ പരിശുദ്ധാത്മാവിന്റെ കർത്തൃത്വം
  choice: പരിശുദ്ധാത്മാവ് യെശയ്യാ പ്രവാചകനിലൂടെ ... പറഞ്ഞത്
  alternative: യെശയ്യാ പ്രവാചകൻ മുഖാന്തരം പരിശുദ്ധാത്മാവ് ... അരുളിച്ചെയ്തത്
  rationale: വചനം പരിശുദ്ധാത്മാവിനാണ് ആപാദിക്കുന്നതെന്നും യെശയ്യാവ് അതിന്റെ മധ്യസ്ഥനാണെന്നും മൂലപാഠം പറയുന്നതുപോലെ സംരക്ഷിക്കുന്നു; അനാവശ്യമായ സഭാപരമായ ശൈലി ചേർക്കുന്നില്ല.
- issue: καλῶς എന്ന വിലയിരുത്തൽ
  choice: പറഞ്ഞത് ശരിയായിരുന്നു
  alternative: നന്നായി സംസാരിച്ചു
  rationale: ഇവിടെ സംസാരശൈലിയുടെ മികവിനേക്കാൾ പറഞ്ഞ വചനത്തിന്റെ ശരിതനിമയാണ് പ്രധാനമായി വിലയിരുത്തപ്പെടുന്നത്; അതിനാൽ ‘ശരി’ എന്ന ആശയം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തുടർന്നുവരുന്ന ഉദ്ധരണിയിലേക്ക് നയിക്കുന്നതിനാൽ വാക്യം ദ്വിബിന്ദുവിൽ അവസാനിപ്പിച്ചിരിക്കുന്നു. ‘യെശയ്യാ’ എന്ന പരിചിതമായ മലയാള ബൈബിൾ നാമരൂപം ഉപയോഗിച്ചു.
