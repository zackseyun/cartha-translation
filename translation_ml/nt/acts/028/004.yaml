id: ACT.28.4
reference: Acts 28:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: ml
  text: 'ആ ജീവി അവന്റെ കൈയിൽനിന്ന് തൂങ്ങിക്കിടക്കുന്നത് ദ്വീപുവാസികൾ[a] കണ്ടപ്പോൾ, അവർ പരസ്പരം പറഞ്ഞു: “ഈ മനുഷ്യൻ തീർച്ചയായും ഒരു കൊലപാതകിയാണ്. കടലിൽനിന്ന് സുരക്ഷിതമായി രക്ഷപ്പെട്ടിട്ടും നീതി[b] അവനെ ജീവിച്ചിരിക്കാൻ അനുവദിച്ചില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തദ്ദേശവാസികൾ’; അക്ഷരാർഥത്തിൽ ‘ബർബരർ’—അതായത്, ഗ്രീക്ക് സംസാരിക്കാത്ത പ്രദേശവാസികൾ.
    reason: lexical_alternative
  - marker: b
    text: ‘നീതി’ എന്നത് ഇവിടെ കുറ്റത്തിന് ശിക്ഷ നൽകുന്ന ശക്തിയായി വ്യക്തിവൽക്കരിച്ചിരിക്കാം; ദ്വീപുവാസികളുടെ മതധാരണയിൽ ഒരു ദേവതാസങ്കൽപ്പത്തെയും സൂചിപ്പിച്ചേക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: ദ്വീപുവാസികൾ
  rationale: ഗ്രീക്ക് സംസാരിക്കാത്ത മാൾട്ടയിലെ തദ്ദേശവാസികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന ‘ബർബരർ’ എന്ന ധാർമ്മിക വിലയിരുത്തൽ ഒഴിവാക്കുന്നു.
- source_word: κρεμάμενον
  choice: തൂങ്ങിക്കിടക്കുന്നതു
  rationale: ജീവി പൗലോസിന്റെ കൈയിൽനിന്ന് തൂങ്ങുന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ നില അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τὸ θηρίον
  choice: ആ ജീവി
  rationale: θηρίον പൊതുവായി ജീവി/മൃഗം എന്നാണ്; സന്ദർഭം പാമ്പിനെ സൂചിപ്പിച്ചാലും ഈ വാക്യത്തിൽ മൂലപദം അത്ര പ്രത്യേകമല്ല.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: അവർ പരസ്പരം പറഞ്ഞു
  rationale: പരസ്പരസംഭാഷണം വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിർബന്ധമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: Πάντως
  choice: തീർച്ചയായും
  rationale: ദ്വീപുവാസികളുടെ ശക്തമായ നിഗമനവും ഉറപ്പും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: φονεύς
  choice: ഒരു കൊലപാതകി
  rationale: മനുഷ്യഹത്യ ചെയ്തവൻ എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും വ്യക്തവുമായ മലയാളസമം.
- source_word: διασωθέντα
  choice: സുരക്ഷിതനായി രക്ഷപ്പെട്ടെങ്കിലും
  rationale: കടൽദുരന്തത്തിൽനിന്ന് ജീവനോടെ കരകയറിയതിന്റെ ആശയം നൽകുന്നു; ഇവിടെ ആത്മീയ രക്ഷ എന്ന അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἡ δίκη
  choice: നീതി
  rationale: പ്രതികാരപരമായ നീതിയെ വ്യക്തിവൽക്കരിച്ചുള്ള ദ്വീപുവാസികളുടെ ധാരണയാണ്; മലയാളത്തിൽ അടിക്കുറിപ്പോടെ ഈ സാംസ്കാരിക ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ζῆν οὐκ εἴασεν
  choice: ജീവിക്കാൻ അനുവദിച്ചില്ല
  rationale: തുടർന്ന് ജീവനോടെ ഇരിക്കാൻ അനുവദിച്ചില്ല എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: ἐκ τῆς θαλάσσης
  choice: കടലിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ സ്ഥലസംബന്ധമായ അർഥം ലളിതമായി നൽകുന്നു; διασῴζωയിലെ അപകടത്തിൽനിന്നുള്ള രക്ഷാഭാവം ആവർത്തിക്കുന്നില്ല.
theological_decisions:
- issue: ἡ δίκη എന്നതിന്റെ വ്യക്തിവൽക്കരണം
  choice: മുഖ്യപാഠത്തിൽ ‘നീതി’ എന്നു നൽകി, അടിക്കുറിപ്പിൽ പ്രതികാരനീതി വ്യക്തിവൽക്കരിക്കപ്പെട്ടിരിക്കാമെന്ന് വ്യക്തമാക്കുക.
  alternative: ‘നീതിദേവി’ അല്ലെങ്കിൽ ‘പ്രതികാരം’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: ദ്വീപുവാസികളുടെ പുറജാതീയ ലോകവീക്ഷണം റിപ്പോർട്ട് ചെയ്യുന്നതാണ് പാഠം; കഥാകൃത്ത് അതിനെ അംഗീകരിക്കുന്നു എന്ന ധാരണ വരുത്താതെയും പ്രത്യേക ദേവതയാണെന്ന് അതിനിശ്ചയിക്കാതെയും മൂലത്തിലെ സാദ്ധ്യത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ദ്വീപുവാസികൾ’ എന്നത് സന്ദർഭസൂചന നൽകുകയും ‘ബർബരർ’ എന്ന പദത്തിന്റെ ഇന്നത്തെ നിന്ദാർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു. ഉദ്ധരണിയിലെ ഉറച്ച നിഗമനഭാവം ‘തീർച്ചയായും’ വഴി സൂക്ഷിച്ചു.
