  to: 'ആ ജീവി അവന്റെ കൈയിൽനിന്ന് തൂങ്ങിക്കിടക്കുന്നത് ദ്വീപുവാസികൾ[a] കണ്ടപ്പോൾ, അവർ പരസ്പരം പറഞ്ഞു: “ഈ മനുഷ്യൻ തീർച്ചയായും ഒരു കൊലപാതകിയാണ്. കടലിൽനിന്ന് സുരക്ഷിതമായി രക്ഷപ്പെട്ടിട്ടും നീതി[b] അവനെ ജീവിച്ചിരിക്കാൻ അനുവദിച്ചില്ല.”'
