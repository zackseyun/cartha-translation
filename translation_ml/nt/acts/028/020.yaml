id: ACT.28.20
reference: Acts 28:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഈ കാരണത്താലാണ് നിങ്ങളെ കാണാനും നിങ്ങളോടു സംസാരിക്കാനും ഞാൻ അഭ്യർഥിച്ചത്; ഇസ്രായേലിന്റെ പ്രത്യാശ[a] നിമിത്തമാണ് ഈ ചങ്ങല എന്നെ ചുറ്റിയിരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിനുള്ള പ്രത്യാശ.’ ഇത് ഒരുപക്ഷേ പൗലോസ് പ്രഖ്യാപിക്കുന്ന ഉടമ്പടിയുടെയും പുനരുത്ഥാനത്തിന്റെയും പ്രത്യാശയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: അതുകൊണ്ട്, ഈ കാരണത്താലാണ്
  rationale: οὖν എന്ന നിഗമനസൂചക കണികയും διὰ…τὴν αἰτίαν എന്ന കാരണപ്രയോഗവും രണ്ടും നിലനിർത്തുന്നു. മലയാളത്തിൽ ചെറിയ ആവർത്തനം തോന്നാമെങ്കിലും പൗലോസിന്റെ വ്യക്തമായ യുക്തിബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: παρεκάλεσα
  choice: ഞാൻ അഭ്യർഥിച്ചത്
  rationale: ഇവിടെ പ്രാദേശിക യെഹൂദനേതാക്കളുമായി കൂടിക്കാഴ്ച നടത്താനുള്ള അഭ്യർഥനയാണ് ഉദ്ദേശ്യം. ‘അപേക്ഷിച്ചു’ എന്നതിനെക്കാൾ ‘അഭ്യർഥിച്ചു’ മാന്യവും സ്വാഭാവികവുമാണ്; നിയമപരമായ അപ്പീൽ എന്ന അർഥം അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: ἰδεῖν
  choice: നിങ്ങളെ കാണാൻ
  rationale: ‘കാണുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും കൂടിക്കാഴ്ചയുടെ സന്ദർഭത്തിൽ സ്വാഭാവിക മലയാളമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: προσλαλῆσαι
  choice: നിങ്ങളോടു സംസാരിക്കാൻ
  rationale: ഏകപക്ഷീയമായ പ്രസംഗമെന്നതിലുപരി നേരിട്ടുള്ള സംഭാഷണത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: ἕνεκεν γὰρ
  choice: നിമിത്തമാണ്
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം അർധവിരാമത്തിനു ശേഷമുള്ള വാക്യക്രമത്തിലൂടെയും ‘നിമിത്തമാണ്’ എന്ന ഊന്നലിലൂടെയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന്റെ പ്രത്യാശ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഷഷ്ഠീവ്യാകരണബന്ധം വിപുലീകരിക്കാതെ നിലനിർത്തുന്നു; പ്രത്യാശ ഇസ്രായേലിന്റേതോ ഇസ്രായേലിനു നൽകപ്പെട്ടതോ എന്ന സൂക്ഷ്മമായ അർഥവ്യാപ്തി പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: ἅλυσιν
  choice: ചങ്ങല
  rationale: ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തുന്ന നേരിട്ടും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: περίκειμαι
  choice: ഞാൻ … അണിഞ്ഞിരിക്കുന്നത്
  rationale: ഒരാളുടെ ചുറ്റും അല്ലെങ്കിൽ മേൽ കിടക്കുക എന്ന ക്രിയയുടെ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു. ‘ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു പറഞ്ഞ് ഭൗതികചിത്രം പരത്തിക്കളയുന്നില്ല.
theological_decisions:
- issue: ‘ഇസ്രായേലിന്റെ പ്രത്യാശ’ എന്നതിന്റെ അർഥം
  choice: വാചകത്തിൽ ‘ഇസ്രായേലിന്റെ പ്രത്യാശ’ എന്ന് വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ‘ഇസ്രായേലിനു വാഗ്ദാനം ചെയ്യപ്പെട്ട പ്രത്യാശ’ അല്ലെങ്കിൽ ‘ഇസ്രായേലിന്റെ പുനരുത്ഥാനപ്രത്യാശ’
  rationale: ഈ പ്രയോഗം ഉടമ്പടി, മശീഹ, പുനരുത്ഥാനം എന്നിവയുമായി ബന്ധപ്പെട്ട ഇസ്രായേലിന്റെ പ്രത്യാശയെ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് വാചകം കൃത്യമായി ഏതിനെയെന്ന് ഇവിടെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘അതുകൊണ്ട്, ഈ കാരണത്താലാണ്’ എന്ന ചെറിയ ആവർത്തനം മൂലവാചകത്തിലെ οὖν-ഉം കാരണപ്രയോഗവും സംരക്ഷിക്കാനായി ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് സൂചിക അതിന്റെ യഥാർഥ ഭാഷാപരമായ വിഷയമായ ‘ഇസ്രായേലിന്റെ പ്രത്യാശ’ എന്ന പ്രയോഗത്തിനു പിന്നാലെയാണ് നൽകിയിരിക്കുന്നത്.
