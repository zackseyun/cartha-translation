source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: ml
  text: അവിടെ ഞങ്ങൾ സഹോദരന്മാരെ[a] കണ്ടെത്തി; അവരോടൊപ്പം ഏഴു ദിവസം താമസിക്കാൻ അവർ ഞങ്ങളെ ക്ഷണിച്ചു. അങ്ങനെ ഞങ്ങൾ റോമിലെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരന്മാരെയും സഹോദരിമാരെയും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ സന്ദർഭത്തിൽ പൊതുവായി സഹവിശ്വാസികളെയാണ് ഉദ്ദേശിക്കുന്നതെന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: അവിടെ
  rationale: മുമ്പ് പറഞ്ഞ പുത്യൊലിയെ സൂചിപ്പിക്കുന്ന സ്ഥലവാചക ക്രിയാവിശേഷണം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ തുടക്കം.
- source_word: εὑρόντες
  choice: ഞങ്ങൾ ... കണ്ടെത്തി
  rationale: പ്രധാനക്രിയയുടെ അതേ കർത്താവുള്ള aorist participle; പ്രവൃത്തികളുടെ ക്രമം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ പൂർണക്രിയയായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ഔപചാരികമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാനിടയുള്ളത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρεκλήθημεν
  choice: ഞങ്ങളോട് അഭ്യർഥിച്ചു
  rationale: παρακαλέω-യുടെ passive രൂപം ഇവിടെ താമസിക്കാനുള്ള അഭ്യർഥന സ്വീകരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ പറയുന്ന ഈ രൂപം സ്വാഭാവികവും passive അർഥസംബന്ധം നിലനിർത്തുന്നതുമാണ്.
- source_word: παρ’ αὐτοῖς
  choice: അവരോടൊപ്പം
  rationale: παρά + dative ഇവിടെ അവരുടെ സാന്നിധ്യത്തിലും കൂട്ടായ്മയിലും പാർക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιμεῖναι
  choice: താമസിക്കാൻ
  rationale: യാത്രയുടെയും ആതിഥ്യത്തിന്റെയും സന്ദർഭത്തിൽ ‘താമസിക്കുക’ എന്നതാണ് സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ἡμέρας ἑπτά
  choice: ഏഴു ദിവസം
  rationale: കാലദൈർഘ്യത്തെ സൂചിപ്പിക്കുന്ന accusative; ‘താമസിക്കാൻ’ എന്നതിനോടൊപ്പം ദൈർഘ്യം വ്യക്തമാണ്.
- source_word: καὶ οὕτως
  choice: അങ്ങനെ
  rationale: യാത്രാവിവരണത്തിലെ രീതിയെയോ തുടർച്ചയെയോ സൂചിപ്പിക്കുന്ന ബന്ധം ചുരുക്കവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: ഞങ്ങൾ റോമിലെത്തി
  rationale: εἰς സഹിതമുള്ള ἔρχομαι ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘റോമിലെത്തി’ ഏറ്റവും സ്വാഭാവികം.
theological_decisions:
- issue: ἀδελφοὺς എന്നതിന്റെ സൂചിതർ
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാർ’; സന്ദർഭത്തിൽ പ്രാദേശിക ക്രിസ്തീയ സഹവിശ്വാസികൾ
  alternative: ജൈവസഹോദരന്മാർ; പൊതുവായ യഹൂദ സ്വജാതിക്കാർ; ‘സഹോദരീസഹോദരന്മാർ’
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ ഇത്തരം യാത്രാ-ആതിഥ്യസന്ദർഭത്തിൽ ഈ പദം സാധാരണയായി സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്കിലെ രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തി അതിന്റെ ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിലെ പ്രവൃത്തിക്രമവും ഒന്നാംപുരുഷ ബഹുവചന യാത്രാവിവരണവും നിലനിർത്തി; അതേസമയം അസ്വാഭാവികമായ participial ഘടന ഒഴിവാക്കി.
