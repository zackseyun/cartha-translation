source:
  edition: SBLGNT
  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: ml
  text: അവർ എന്നെ വിചാരണ ചെയ്തശേഷം, എനിക്കെതിരെ മരണശിക്ഷയ്ക്ക് അർഹമായ യാതൊരു കുറ്റവും ഇല്ലായിരുന്നതിനാൽ എന്നെ വിട്ടയയ്ക്കാൻ ആഗ്രഹിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “എന്റെ കാര്യത്തിൽ മരണശിക്ഷയ്ക്ക് നിയമപരമായ അടിസ്ഥാനമൊന്നും ഇല്ലായിരുന്നതിനാൽ.”'
    reason: αἰτία θανάτου എന്ന നീതിന്യായപ്രയോഗം ‘മരണശിക്ഷ അർഹിക്കുന്ന കുറ്റം/കുറ്റാരോപണം’ എന്നും ‘മരണശിക്ഷയ്ക്ക് നിയമപരമായ അടിസ്ഥാനം’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിലെ റോമൻ അധികാരികളെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമം മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ ‘അവർ’ എന്നു പുനരാരംഭിച്ചു.
- source_word: ἀνακρίναντές με
  choice: എന്നെ വിചാരണ ചെയ്തശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള നിയമപരമായ പരിശോധനയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലക്രമവും നീതിന്യായസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: ἐβούλοντο
  choice: ആഗ്രഹിച്ചു
  rationale: ഭൂതകാലത്തിലെ അവരുടെ ഉദ്ദേശം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἀπολῦσαι
  choice: വിട്ടയയ്ക്കാൻ
  rationale: തടങ്കലിൽനിന്നുള്ള നിയമപരമായ മോചനത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: '... ഇല്ലായിരുന്നതിനാൽ'
  rationale: Articular infinitive construction-ന്റെ കാരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: മരണശിക്ഷയ്ക്ക് അർഹമായ ഒരു കുറ്റവും
  rationale: αἰτίαയുടെ ‘കുറ്റം/കുറ്റാരോപണം/നിയമാധാരം’ എന്ന നീതിന്യായപരമായ അർഥവും θανάτου നൽകുന്ന വധാർഹതയും സംയോജിപ്പിക്കുന്നു; മൂലത്തിലെ അർഥപരിധി അതിയായി ചുരുക്കുന്നില്ല.
- source_word: ἐν ἐμοί
  choice: എന്നിൽ
  rationale: മൂലത്തിലെ രൂപകൽപ്പന സംരക്ഷിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘എനിക്കെതിരെ’ എന്ന നിയമപരമായ അർഥം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
