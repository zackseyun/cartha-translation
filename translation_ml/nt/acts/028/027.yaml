id: ACT.28.27
reference: Acts 28:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: ml
  text: ഈ ജനത്തിന്റെ ഹൃദയം മരവിച്ചുപോയിരിക്കുന്നു; അവർ ചെവികളാൽ മന്ദമായി കേട്ടു; അവരുടെ കണ്ണുകൾ അടച്ചുകളഞ്ഞു. അല്ലായിരുന്നെങ്കിൽ അവർ കണ്ണുകളാൽ കാണുകയും ചെവികളാൽ കേൾക്കുകയും ഹൃദയംകൊണ്ട് ഗ്രഹിക്കുകയും തിരിഞ്ഞുവരുകയും[b] ചെയ്യുമായിരുന്നു; ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യുമായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ കണ്ണുകളാൽ കാണുകയും … തിരിഞ്ഞുവരുകയും, ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യാതിരിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം. യെശയ്യാവിൽനിന്നുള്ള ഈ ഉദ്ധരണിയിൽ ഗ്രീക്ക് സംയോജകപദത്തിന് ‘അങ്ങനെ സംഭവിക്കാതിരിക്കേണ്ടതിന്’ എന്ന ശക്തമായ അർഥസൂചന ഉണ്ടാകാം.
    reason: alternative_reading
  - marker: b
    text: ‘തിരിഞ്ഞുവരുക’ എന്നത് ‘തിരിയുക,’ ‘മടങ്ങിവരുക,’ അല്ലെങ്കിൽ സന്ദർഭത്തിൽ ‘മാനസാന്തരപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: മന്ദീഭവിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘തടിച്ചുപോയി’ എന്ന രൂപകം ആത്മീയമായ ഗ്രഹണശേഷിക്കുറവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം പകരുന്നതിനൊപ്പം രൂപകത്തിന്റെ മന്ദത നിലനിർത്തുന്നു.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: ബൈബിളിലെ മനുഷ്യാന്തരംഗത്തെ സൂചിപ്പിക്കുന്ന പദം സംരക്ഷിക്കുകയും തുടർന്നുള്ള ‘ഹൃദയംകൊണ്ട് ഗ്രഹിക്കുക’ എന്ന ആശയബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βαρέως ἤκουσαν
  choice: പ്രയാസത്തോടെ കേട്ടു
  rationale: ‘ഭാരമായി കേട്ടു’ എന്ന അസ്വാഭാവിക മലയാളത്തിനുപകരം കേൾവിയിലെ മന്ദതയും ബുദ്ധിമുട്ടും വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ഭൂതകാലരൂപവും നിലനിർത്തുന്നു.
- source_word: ἐκάμμυσαν
  choice: അടച്ചുകളഞ്ഞു
  rationale: കണ്ണുകൾ മനഃപൂർവം അടയ്ക്കുന്നതിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μήποτε
  choice: അല്ലായിരുന്നെങ്കിൽ
  rationale: വായനാസൗകര്യത്തോടെ നിഷേധാത്മക ഫലം/ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്നു; ‘കാണാതിരിക്കേണ്ടതിന്’ എന്ന ശക്തമായ ഉദ്ദേശ്യസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: συνῶσιν
  choice: ഗ്രഹിക്കുകയും
  rationale: ഹൃദയത്തിന്റെ ആന്തരിക തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: ἐπιστρέψωσιν
  choice: തിരിഞ്ഞുവരുകയും
  rationale: ദിശാമാറ്റത്തിന്റെയും മടങ്ങിവരവിന്റെയും രൂപകം നിലനിർത്തുന്നു; ‘മാനസാന്തരപ്പെടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം വാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἰάσομαι
  choice: ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യുമായിരുന്നു
  rationale: μήποτε-വാക്യവുമായി ബന്ധപ്പെട്ട സാധ്യതാപരമായ ഫലം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സൗഖ്യമാക്കൽ എന്ന മുഖ്യരൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിലെ ദൈവിക ഉദ്ദേശ്യവും ന്യായവിധിയും
  choice: പ്രധാനവാചകത്തിൽ ‘അല്ലായിരുന്നെങ്കിൽ’ എന്ന് നൽകി, മനുഷ്യരുടെ അടച്ചുപൂട്ടലും അതിന്റെ ഫലവും മുൻനിർത്തുന്നു.
  alternative: ‘അവർ കാണാതിരിക്കേണ്ടതിന് …’ എന്ന് പരിഭാഷപ്പെടുത്തി ശക്തമായ ഉദ്ദേശ്യ/തടയൽഭാവം മുൻനിർത്താം.
  rationale: μήποτε ഇവിടെ ഉദ്ദേശ്യമോ ഭയപ്പെട്ട ഫലമോ സൂചിപ്പിക്കാം. പ്രധാനവാചകം വിവാദം തീർപ്പാക്കാതെ വായനാസൗകര്യം നൽകുന്നു; ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἐπιστρέψωσιν എന്നതിന്റെ പരിവർത്തനസൂചന
  choice: തിരിഞ്ഞുവരുക
  alternative: തിരിയുക; മടങ്ങിവരുക; മാനസാന്തരപ്പെടുക
  rationale: പരിവർത്തനസന്ദർഭം തുറന്നുവെച്ചുകൊണ്ട് മൂലത്തിലെ ദിശാമാറ്റരൂപകം സംരക്ഷിക്കുന്നു; പ്രത്യേക സിദ്ധാന്തപരമായ പദം അനാവശ്യമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘കണ്ണ്—ചെവി—ഹൃദയം’ ഘടനയും വചനത്തിന്റെ പ്രവാചകഭാവവും നിലനിർത്തി. പ്രധാനവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും [a], [b] രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
