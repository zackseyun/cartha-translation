  source_fidelity: 'പ്രധാന ഘടനയും ആശയക്രമവും ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: ഹൃദയത്തിന്റെ മന്ദത, ചെവി–കണ്ണ്–ഹൃദയം എന്ന ആവർത്തനം, തിരിയൽ, സൗഖ്യമാക്കൽ എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ βαρέως ἤκουσαν എന്നത് ‘പ്രയാസത്തോടെ കേട്ടു’ എന്നു പറയുമ്പോൾ കേൾവിയുടെ ശാരീരിക ബുദ്ധിമുട്ടാണ് പ്രധാനമായി സൂചിപ്പിക്കപ്പെടുന്നത്; ഇവിടെ ഉദ്ദേശിക്കുന്ന മന്ദ/മരവിച്ച കേൾവിയുടെ രൂപകം അതിലൂടെ ക്ഷയിക്കുന്നു.'
  naturalness: ‘ഹൃദയം മരവിച്ചുപോയിരിക്കുന്നു,’ ‘അവരുടെ കണ്ണുകൾ അടച്ചുകളഞ്ഞു,’ ‘ചെവികളാൽ മന്ദമായി കേട്ടു’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. വാക്യത്തിന്റെ ഗൗരവമുള്ള പ്രവാചക-ഉദ്ധരണിശൈലി നിലനിൽക്കുന്നു.
