revisions:
- from: ഈ ജനത്തിന്റെ ഹൃദയം മന്ദീഭവിച്ചിരിക്കുന്നു; അവർ ചെവികൊണ്ട് പ്രയാസത്തോടെ കേട്ടു; അവർ കണ്ണുകൾ അടച്ചുകളഞ്ഞു. അല്ലായിരുന്നെങ്കിൽ അവർ കണ്ണുകൊണ്ട് കാണുകയും ചെവികൊണ്ട് കേൾക്കുകയും ഹൃദയംകൊണ്ട് ഗ്രഹിക്കുകയും തിരിഞ്ഞുവരുകയും[b] ചെയ്യുമായിരുന്നു; ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യുമായിരുന്നു.[a]
  to: ഈ ജനത്തിന്റെ ഹൃദയം മരവിച്ചുപോയിരിക്കുന്നു; അവർ ചെവികളാൽ മന്ദമായി കേട്ടു; അവരുടെ കണ്ണുകൾ അടച്ചുകളഞ്ഞു. അല്ലായിരുന്നെങ്കിൽ അവർ കണ്ണുകളാൽ കാണുകയും ചെവികളാൽ കേൾക്കുകയും ഹൃദയംകൊണ്ട് ഗ്രഹിക്കുകയും തിരിഞ്ഞുവരുകയും[b] ചെയ്യുമായിരുന്നു; ഞാൻ അവരെ സൗഖ്യമാക്കുകയും ചെയ്യുമായിരുന്നു.[a]
  rationale: ‘മരവിച്ചുപോയിരിക്കുന്നു’ ഹൃദയത്തിന്റെ രൂപകപരമായ മന്ദതയെ മലയാളത്തിൽ കൂടുതൽ നേരിട്ട് അറിയിക്കുന്നു. ‘ചെവികളാൽ മന്ദമായി കേട്ടു’ βαρέως എന്ന രൂപകഭാവം സംരക്ഷിക്കുമ്പോൾ ‘പ്രയാസത്തോടെ’ ഉണ്ടാക്കുന്ന ശാരീരിക-ബുദ്ധിമുട്ട് അർഥം ഒഴിവാക്കുന്നു. അടിക്കുറിപ്പ് [a]യിലെ ഉദ്ധരണി വ്യാകരണപരമായി പൂർത്തിയാക്കി; മുഖ്യവാചകം നിലനിർത്തുന്ന ‘അല്ലായിരുന്നെങ്കിൽ’ എന്ന വായനയും അടിക്കുറിപ്പ് നിലനിർത്തുന്ന ശക്തമായ ‘ചെയ്യാതിരിക്കേണ്ടതിന്’ എന്ന വായനയും രണ്ടും സംരക്ഷിച്ചിട്ടുണ്ട്.
