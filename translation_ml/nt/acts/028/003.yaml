id: ACT.28.3
reference: Acts 28:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: ml
  text: പൗലോസ് കുറെ ഉണക്കച്ചുള്ളികൾ പെറുക്കിക്കൂട്ടി തീയിൽ ഇട്ടപ്പോൾ, ചൂടുനിമിത്തം[a] ഒരു അണലി പുറത്തുവന്ന് അദ്ദേഹത്തിന്റെ കൈയിൽ പറ്റിപ്പിടിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചൂടിൽനിന്ന്.” ഗ്രീക്ക് പദപ്രയോഗം അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ തീയുടെ ചൂട് കാരണമായെന്നാണ് സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അദ്ദേഹത്തിന്റെ കൈയിൽ കടിച്ചു” അല്ലെങ്കിൽ “അദ്ദേഹത്തിന്റെ കൈയെ പിടിച്ചു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് പൊതുവേ ‘പറ്റിപ്പിടിക്കുക’ അഥവാ ‘പിടിക്കുക’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: പെറുക്കിക്കൂട്ടി
  rationale: വിറകിനുള്ള ഉണക്കച്ചുള്ളികൾ ഒരുമിച്ചു ശേഖരിക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; ‘പെറുക്കിക്കൂട്ടി’ എന്നത് മുൻകൃത്യത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φρυγάνων τι πλῆθος
  choice: കുറെ ഉണക്കച്ചുള്ളികൾ
  rationale: φρύγανα തീ കത്തിക്കാൻ ഉപയോഗിക്കുന്ന ഉണങ്ങിയ ചെറുകൊമ്പുകളെയോ ചുള്ളികളെയോ സൂചിപ്പിക്കുന്നു; τι πλῆθος അനിശ്ചിതമായ ഒരു അളവാണ്. ഈ പരിഭാഷ രണ്ടും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: തീയിൽ ഇട്ടപ്പോൾ
  rationale: തീയുടെമേൽ ഇന്ധനം ഇടുന്ന പ്രവൃത്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു; ഗ്രീക്കിലെ പങ്കാളിക്രിയകളുടെ കാലക്രമബന്ധം ‘ഇട്ടപ്പോൾ’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: ἔχιδνα
  choice: ഒരു അണലി
  rationale: ἔχιδνα ഒരു പൊതുവായ പാമ്പിനെയല്ല, വിഷമുള്ള വൈപ്പർ വർഗത്തിലെ പാമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ‘അണലി’ ആ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς θέρμης
  choice: ചൂടുനിമിത്തം
  rationale: ἀπό അക്ഷരാർഥത്തിൽ ‘ചൂടിൽനിന്ന്’ എന്നു വരാമെങ്കിലും ഇവിടെ തീയുടെ ചൂടാണ് പാമ്പ് പുറത്തുവരാനുള്ള കാരണമെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.
- source_word: ἐξελθοῦσα
  choice: പുറത്തുവന്ന്
  rationale: പാമ്പ് ഒളിച്ചിരുന്നിടത്തുനിന്ന് പുറത്തുവന്നതും തുടർന്ന് കൈയിൽ പറ്റിപ്പിടിച്ചതും സ്വാഭാവികമായ ക്രമത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ കൈയിൽ പറ്റിപ്പിടിച്ചു
  rationale: καθάπτω എന്ന ക്രിയയ്ക്ക് ‘പിടിക്കുക/പറ്റിപ്പിടിക്കുക’ എന്ന വിശാല അർഥമുണ്ട്. ‘കടിച്ചു’ എന്നു മാത്രം പറയുന്നത് മൂലപദത്തേക്കാൾ കൂടുതൽ നിർദിഷ്ടമാകുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ഒഴിവാക്കി.
theological_decisions: []
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. വിവരണം ലളിതവും ഗൗരവമുള്ളതുമായി നിലനിർത്തി; മൂലത്തിലെ കാരണബന്ധവും καθάπτω എന്ന ക്രിയയുടെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
