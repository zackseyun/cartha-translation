id: ACT.28.16
reference: Acts 28:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: ml
  text: ഞങ്ങൾ റോമിൽ പ്രവേശിച്ചപ്പോൾ, പൗലോസിന് അവനെ കാവൽ ചെയ്തിരുന്ന പടയാളിയോടൊപ്പം പ്രത്യേകം താമസിക്കാൻ[a] അനുവാദം ലഭിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പ്രത്യേകം കഴിയാൻ.”
    reason: μένειν എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘താമസിക്കുക’ എന്നും ‘കഴിയുക/തങ്ങുക’ എന്നും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: പ്രവേശിച്ചപ്പോൾ
  rationale: Ὅτε എന്ന കാലസൂചകബന്ധത്തെ സ്വാഭാവികമായി ‘-പ്പോൾ’ എന്നു നൽകി; δέ ഇവിടെയുള്ള മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്തില്ല.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: ഞങ്ങൾ റോമിൽ പ്രവേശിച്ചപ്പോൾ
  rationale: εἰσέρχομαι എന്ന ക്രിയയിലെ അകത്തേക്കുള്ള ചലനഭാവം ‘പ്രവേശിച്ചു’ വ്യക്തമായി നിലനിർത്തുന്നു; ഒന്നാംപുരുഷ ബഹുവചനം ‘ഞങ്ങൾ’ എന്നതിലൂടെ പ്രകടമാക്കി.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: പൗലോസിന് അനുവാദം ലഭിച്ചു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ‘അനുവാദം ലഭിച്ചു’ എന്ന രൂപത്തിൽ നൽകി.
- source_word: μένειν
  choice: താമസിക്കാൻ
  rationale: ഇവിടെ തങ്ങുക/വസിക്കുക എന്ന സാഹചര്യാർത്ഥം ഉണ്ട്; വീട്ടുതടങ്കലിന്റെ താമസസന്ദർഭത്തിൽ ‘താമസിക്കാൻ’ സ്വാഭാവികമാണ്.
- source_word: καθ’ ἑαυτόν
  choice: പ്രത്യേകം
  rationale: പടയാളി കൂടെയുണ്ടെന്ന തുടർവാക്യവുമായി വിരോധമുണ്ടാക്കാതെ, മറ്റുള്ളവരിൽനിന്ന് വേറിട്ടുള്ള താമസം എന്ന ആശയം നൽകുന്നു; ‘തനിച്ച്’ എന്നു പറഞ്ഞാൽ പൂർണ ഏകാന്തത തെറ്റായി സൂചിപ്പിക്കാം.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: തന്നെ കാവൽ ചെയ്തിരുന്ന പടയാളിയോടൊപ്പം
  rationale: σύν എന്നതിന്റെ സഹവാസഭാവവും φυλάσσοντι എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർച്ചയായ കാവൽഭാവവും നിലനിർത്തുന്നു. നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ സാഹചര്യത്തിൽ നിയോഗിക്കപ്പെട്ട കാവൽക്കാരനെ സൂചിപ്പിക്കുന്നതിനാൽ അനിശ്ചിതമായ ‘ഒരു പടയാളി’ ഒഴിവാക്കി.
