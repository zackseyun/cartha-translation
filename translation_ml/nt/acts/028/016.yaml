revisions:
- from: ഞങ്ങൾ റോമിൽ പ്രവേശിച്ചപ്പോൾ, തന്നെ കാവൽ ചെയ്തിരുന്ന പടയാളിയോടൊപ്പം പ്രത്യേകം താമസിക്കാൻ[a] പൗലോസിന് അനുവാദം ലഭിച്ചു.
  to: ഞങ്ങൾ റോമിൽ പ്രവേശിച്ചപ്പോൾ, പൗലോസിന് അവനെ കാവൽ ചെയ്തിരുന്ന പടയാളിയോടൊപ്പം പ്രത്യേകം താമസിക്കാൻ[a] അനുവാദം ലഭിച്ചു.
  rationale: The sole substantive revision replaces the reflexive pronoun with a non-reflexive pronoun so that the soldier is explicitly identified as guarding Paul, as required by αὐτόν. The separate-lodging sense of καθ’ ἑαυτόν and the accompanying guard expressed by σύν are retained.
