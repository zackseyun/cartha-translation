translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘പ്രത്യേകം’ എന്നത് പൗലോസിന് ലഭിച്ച വേറിട്ട താമസാനുമതിയും കൂടെയുണ്ടായിരുന്ന കാവൽക്കാരനും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
