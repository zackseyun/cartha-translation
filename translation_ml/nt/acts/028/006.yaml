id: ACT.28.6
reference: Acts 28:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: ml
  text: എന്നാൽ അവൻ വീർത്തുപോകുകയോ പെട്ടെന്ന് വീണു മരിക്കുകയോ ചെയ്യുമെന്ന് അവർ പ്രതീക്ഷിച്ചുകൊണ്ടിരുന്നു. ഏറെ നേരം കാത്തുനോക്കിയശേഷം, അസാധാരണമായതൊന്നും അവനു സംഭവിക്കുന്നില്ലെന്ന് കണ്ടപ്പോൾ[a], അവർ അഭിപ്രായം മാറ്റി അവൻ ഒരു ദേവനാണെന്ന് പറയാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പതിവിനു വിരുദ്ധമായതൊന്നും” അല്ലെങ്കിൽ “കുഴപ്പമൊന്നും” അവനു സംഭവിക്കുന്നില്ലെന്ന്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: പ്രതീക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചയായ പ്രതീക്ഷയെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πίμπρασθαι
  choice: വീർത്തുപോകുക
  rationale: പാമ്പുകടിയെത്തുടർന്നുള്ള ശരീരവീക്കമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; അക്ഷരാർഥമായ ‘കത്തുക’ ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: പെട്ടെന്ന് വീണു മരിക്കുക
  rationale: പെട്ടെന്നുള്ള വീഴ്ചയും മരണഫലവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ πολὺ ... προσδοκώντων καὶ θεωρούντων
  choice: ഏറെ നേരം കാത്തുനോക്കിയിട്ടും ... കണ്ടപ്പോൾ
  rationale: നീണ്ടുനിന്ന കാത്തിരിപ്പും സൂക്ഷ്മനിരീക്ഷണവും സ്വാഭാവികമായ കാലവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: μηδὲν ἄτοπον
  choice: അസാധാരണമായതൊന്നും
  rationale: ἄτοπος എന്ന പദത്തിന്റെ ‘വിചിത്രം/പതിവിന് വിരുദ്ധം/കുഴപ്പമുള്ളത്’ എന്ന വിശാലത അനാവശ്യമായി ‘ഹാനികരം’ എന്നു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: μεταβαλόμενοι
  choice: അഭിപ്രായം മാറ്റി
  rationale: അവരുടെ നിഗമനത്തിലുണ്ടായ മറിച്ചിലിനെ വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἔλεγον
  choice: പറയാൻ തുടങ്ങി
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിലെ ആരംഭപരമായോ തുടർച്ചയായോ ഉള്ള ഭാവം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: θεόν
  choice: ഒരു ദേവൻ
  rationale: ബഹുദൈവവിശ്വാസ പശ്ചാത്തലത്തിലെ അനിശ്ചിത ഏകവചന അർഥം നൽകുകയും ‘ദൈവം’ എന്ന ഏകദൈവപരമായ തിരിച്ചറിയൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: αὐτὸν εἶναι θεόν എന്ന വാക്കുകൾ പൗലൊസിനെക്കുറിച്ചുള്ള പിൽക്കാല ക്രിസ്തീയ അവകാശവാദമായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കുക
  choice: അവൻ ഒരു ദേവനാണെന്ന്
  alternative: അവൻ ദൈവമാണെന്ന് / അവൻ ദിവ്യനാണെന്ന്
  rationale: ഇത് ദ്വീപുവാസികളുടെ തെറ്റായ ബഹുദൈവവിശ്വാസപരമായ നിഗമനമാണ്. ആർട്ടിക്കിൾ ഇല്ലാത്ത θεόν എന്ന പദവും സന്ദർഭവും ‘ഒരു ദേവൻ’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ dignified ആയ മലയാളം. ‘കാത്തുനോക്കിയിട്ടും’ എന്ന പ്രയോഗം നീണ്ട കാത്തിരിപ്പിനെയും നിരീക്ഷണത്തെയും സ്വാഭാവികമായി കൂട്ടിച്ചേർക്കുന്നു; മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം നിലനിർത്തിയിരിക്കുന്നു.
