  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: ml
  text: അവിടെനിന്ന് നങ്കൂരം ഉയർത്തിയശേഷം[a] ഞങ്ങൾ രേഗ്യോനിൽ എത്തി. ഒരു ദിവസം കഴിഞ്ഞ് തെക്കൻ കാറ്റ് വീശിത്തുടങ്ങിയപ്പോൾ, രണ്ടാം ദിവസം ഞങ്ങൾ പുത്തെയൊലിയിൽ എത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കപ്പൽ യാത്ര തിരിച്ചശേഷം.” περιελόντες എന്ന ഗ്രീക്ക് ക്രിയാരൂപം നാവികപ്രയോഗമാണ്; അത് പ്രത്യേകമായി നങ്കൂരം ഉയർത്തുന്നതെയോ, കൂടുതൽ പൊതുവായി കടലിലേക്കു യാത്ര തിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: അവിടെനിന്ന്
  rationale: സ്ഥലമാറ്റം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം; ഗ്രീക്കിലെ സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: περιελόντες
