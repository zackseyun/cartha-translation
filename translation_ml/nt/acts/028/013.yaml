  rationale: നാവികസന്ദർഭത്തിൽ കപ്പലിനെ പിടിച്ചുനിർത്തിയിരുന്നത് നീക്കി യാത്ര തുടങ്ങുന്നതിനെ സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായ നാവികാർത്ഥം മുഖ്യപാഠത്തിൽ നൽകിയെങ്കിലും വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατηντήσαμεν
  choice: ഞങ്ങൾ ... എത്തി
  rationale: ഒരു ലക്ഷ്യസ്ഥാനത്ത് എത്തിച്ചേരുക എന്ന അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ῥήγιον
  choice: രേഗ്യോൻ
  rationale: പുരാതന ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: μετὰ μίαν ἡμέραν
  choice: ഒരു ദിവസം കഴിഞ്ഞ്
  rationale: ഗ്രീക്ക് കാലസൂചനയുടെ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπιγενομένου νότου
  choice: തെക്കൻ കാറ്റ് വീശിത്തുടങ്ങിയപ്പോൾ
  rationale: തെക്കൻ കാറ്റ് ഉയർന്നുവന്ന attendant circumstance സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δευτεραῖοι
  choice: രണ്ടാം ദിവസം
  rationale: യാത്രയുടെ രണ്ടാം ദിവസത്തെ വരവ് എന്ന ഗ്രീക്ക് കാലസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἤλθομεν
  choice: ഞങ്ങൾ ... എത്തി
  rationale: ലക്ഷ്യസ്ഥാനം ചേർന്ന ചലനക്രിയയെ സന്ദർഭാനുസൃതമായി ‘എത്തി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: Ποτιόλους
  choice: പൊതിയൊലി
  rationale: ഗ്രീക്ക് സ്ഥലനാമമായ Ποτίολοι എന്നതിന്റെ മലയാള ലിപ്യന്തരണം.
