revisions:
- from: അവൻ ഈ കാര്യങ്ങൾ പറഞ്ഞുകഴിഞ്ഞപ്പോൾ,[a] യെഹൂദന്മാർ തങ്ങൾക്കിടയിൽ വലിയ തർക്കം നടത്തിക്കൊണ്ട് അവിടെനിന്ന് പോയി.
  to: അവൻ ഇതു പറഞ്ഞശേഷം, യെഹൂദന്മാർ തങ്ങൾക്കിടയിൽ വലിയ വാദപ്രതിവാദം നടത്തി പോയി.[a]
  rationale: The revision removes an unstated locative detail, uses an idiomatic equivalent for the internal debate, retains the narrative register, and corrects the footnote’s unsupported reference to leaders. The end-of-verse marker accurately signals that the textual-critical note applies to the whole verse.
