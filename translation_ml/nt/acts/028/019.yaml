id: ACT.28.19
reference: Acts 28:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: ml
  text: എന്നാൽ യെഹൂദന്മാർ എതിർത്തതിനാൽ[a][b], കൈസറോടു അപ്പീൽ ചെയ്യാൻ ഞാൻ നിർബന്ധിതനായി. എന്റെ ജനതയ്ക്കെതിരെ എന്തെങ്കിലും കുറ്റം ചുമത്താനുണ്ടായിരുന്നതുകൊണ്ടല്ല ഞാൻ അങ്ങനെ ചെയ്തത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘യെഹൂദന്മാർ എന്നെ എതിർത്തുകൊണ്ടിരിക്കെ’; അല്ലെങ്കിൽ ‘യെഹൂദന്മാർ എന്നെ എതിർത്ത് സംസാരിച്ചതിനാൽ.’'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘യെഹൂദന്മാർ’ എന്നത് ഈ നിയമനടപടിയിൽ പൗലോസിനെ എതിർത്ത യെഹൂദ കുറ്റാരോപകരെയാണ് സൂചിപ്പിക്കുന്നത്; എല്ലാ യെഹൂദരെയും പൊതുവായി ഉദ്ദേശിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: എതിർത്തതിനാൽ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃതന്തത്തോടുകൂടിയ genitive absolute, പൗലോസ് അപ്പീൽ ചെയ്യേണ്ടിവന്ന സാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘എതിർത്തതിനാൽ’ എന്നത് നിയമസന്ദർഭത്തിലെ എതിർപ്പും കാരണബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വെറും വാക്കുതർക്കമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യമോ തുടർവികാസമോ സൂചിപ്പിക്കുന്നു.
- source_word: τῶν Ἰουδαίων
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലുള്ള പൊതുപദപ്രയോഗം നിലനിർത്തുന്നു; ‘യെഹൂദനേതാക്കൾ’ എന്നു ചേർത്ത് മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേകത വരുത്തുന്നില്ല. സന്ദർഭപരമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἠναγκάσθην
  choice: ഞാൻ നിർബന്ധിതനായി
  rationale: ബാഹ്യസമ്മർദമോ അനിവാര്യതയോ സൂചിപ്പിക്കുന്ന passive രൂപം ഔപചാരികമായ നിയമസന്ദർഭത്തിന് യോജിച്ചവിധം നിലനിർത്തുന്നു.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: കൈസറോടു അപ്പീൽ ചെയ്യാൻ
  rationale: ചക്രവർത്തിയുടെ ന്യായാസനത്തിലേക്കുള്ള നിയമപരമായ അപ്പീലിനെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പ്രയോഗമാണിത്. ഗ്രീക്കിലെ Καίσαρα അനുസരിച്ച് ‘കൈസർ’ നിലനിർത്തുന്നു.
- source_word: οὐχ ὡς
  choice: '...കൊണ്ടല്ല'
  rationale: പൗലോസിന്റെ പ്രവൃത്തിക്കു തെറ്റായൊരു പ്രേരണയുണ്ടായിരുന്നുവെന്ന ധാരണ നിഷേധിക്കുന്ന വിശദീകരണം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ἔθνους μου
  choice: എന്റെ ജനതയ്ക്കെതിരെ
  rationale: പൗലോസിന്റെ സ്വന്തം ദേശീയ-വംശീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന കൂട്ടായ അർഥം ‘ജനത’ സംരക്ഷിക്കുന്നു.
- source_word: ἔχων τι κατηγορεῖν
  choice: എന്തെങ്കിലും കുറ്റം ചുമത്താനുണ്ടായിരുന്നത്
  rationale: κατηγορεῖν എന്നതിന്റെ നിയമപരമായ കുറ്റാരോപണഭാവം വ്യക്തമായി നൽകുകയും ἔχων τι എന്ന ഘടനയിലെ ‘എന്തെങ്കിലും ആധാരം/കാര്യം ഉണ്ടായിരിക്കുക’ എന്ന ആശയം സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘യെഹൂദന്മാർ’ എന്ന വംശീയ-മതപരമായ പ്രയോഗത്തിന്റെ സന്ദർഭസൂചിത പരിധി
  choice: τῶν Ἰουδαίων എന്നതിന്റെ നേരിട്ടുള്ള വിവർത്തനമായി ‘യെഹൂദന്മാർ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി; ഈ നിയമസന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്ന വിഭാഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘യെഹൂദനേതാക്കൾ’ അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’
  rationale: മൂലപാഠം പറയുന്നതിലപ്പുറം പരാമർശത്തെ ചുരുക്കുകയോ പുനർനിർവചിക്കുകയോ ചെയ്യരുത്. ഇവിടെ എല്ലാ യെഹൂദരെയും പൊതുവായി ഉദ്ദേശിക്കുന്നില്ല; പൗലോസിനെ എതിർത്ത യെഹൂദ കുറ്റാരോപകരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നിയമ-വിവരണ ശൈലി. ‘അപ്പീൽ’, ‘നിർബന്ധിതനായി’, ‘കുറ്റം ചുമത്തുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ഔപചാരിക/ന്യായിക ഭാവം സംരക്ഷിക്കുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
