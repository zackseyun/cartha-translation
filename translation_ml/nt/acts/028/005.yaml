  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: ml
  text: അങ്ങനെ അവൻ ആ ജീവിയെ[a] തീയിലേക്കു കുടഞ്ഞുകളഞ്ഞ ശേഷം ഒരു ദോഷവും അനുഭവിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആ മൃഗത്തെ’ അല്ലെങ്കിൽ ‘ആ ജന്തുവിനെ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം പൊതുവായതാണ്; എങ്കിലും സന്ദർഭത്തിൽ അത് പാമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: അങ്ങനെ അവൻ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന ആർട്ടിക്കിൾ പൗലോസിനെ സൂചിപ്പിക്കുന്നു; μέν οὖν നൽകുന്ന മൃദുവായ ആഖ്യാനത്തുടർച്ച സ്വാഭാവികമായി ‘അങ്ങനെ’ എന്നു നൽകി.
- source_word: ἀποτινάξας
  choice: കുടഞ്ഞുകളഞ്ഞിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τὸ θηρίον
  choice: ആ ജീവിയെ
  rationale: θηρίον പൊതുവായി ഒരു മൃഗത്തെയോ ജീവിയെയോ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് പാമ്പാണെങ്കിലും ഇവിടെ മൂലപദത്തിനുള്ള പൊതുത്വം ‘ജീവി’ നിലനിർത്തുന്നു.
- source_word: εἰς τὸ πῦρ
  choice: തീയിൽ
  rationale: ചലനത്തിന്റെ ലക്ഷ്യമായ തീയെ മലയാളത്തിലെ സ്വാഭാവികമായ ദിശാസൂചനയോടെ അവതരിപ്പിക്കുന്നു; അർത്ഥം ‘തീയിലേക്കു/തീക്കുള്ളിലേക്ക്’ എന്നതാണ്.
- source_word: ἔπαθεν
  choice: അനുഭവിച്ചില്ല
  rationale: πάσχω എന്ന പദത്തിന്റെ ‘അനുഭവിക്കുക/സഹിക്കുക’ എന്ന അർത്ഥം οὐδὲν κακόν എന്ന പ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὐδὲν κακόν
  choice: ഒരു ദോഷവും
  rationale: പരിക്കോ ദുഷ്ഫലമോ ഒന്നും ഉണ്ടായില്ലെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
