  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: ml
  text: എന്നാൽ, നീ ചിന്തിക്കുന്നത് എന്താണെന്ന് നിന്നിൽനിന്നുതന്നെ കേൾക്കുന്നത് ഉചിതമാണെന്ന് ഞങ്ങൾ കരുതുന്നു. കാരണം, ഈ വിഭാഗത്തിനെതിരെ[a] എല്ലായിടത്തും സംസാരിക്കപ്പെടുന്നുവെന്ന് ഞങ്ങൾക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഭാഗം” എന്നതിന് “കക്ഷി” എന്നോ “പ്രസ്ഥാനം” എന്നോ പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് αἵρεσις എന്ന പദത്തിന് ഇവിടെ പിൽക്കാലത്തെ സാങ്കേതിക അർഥമായ “മതവിരുദ്ധോപദേശം” എന്ന അർഥം നിർബന്ധമായില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: ഉചിതമാണെന്ന് ഞങ്ങൾ കരുതുന്നു
  rationale: ആവശ്യപ്പെടുക എന്ന ശക്തമായ അർഥത്തേക്കാൾ, കേൾക്കുന്നത് യുക്തവും ഉചിതവുമാണെന്ന വിനയപൂർവമായ ഔപചാരിക വിലയിരുത്തലാണ് സന്ദർഭത്തിൽ പ്രകടമാകുന്നത്.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: നിന്നിൽനിന്നുതന്നെ കേൾക്കുന്നത്
  rationale: പൗലോസിൽനിന്ന് നേരിട്ടു കേൾക്കണമെന്ന παρά + genitive പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἃ φρονεῖς
  choice: നീ ചിന്തിക്കുന്നത് എന്താണെന്ന്
  rationale: φρονέω ഇവിടെ ഒരാളുടെ നിലപാടിനെയോ വീക്ഷണത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ പരിഭാഷ ഗ്രീക്കിന്റെ തുറന്ന സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: αἱρέσεως
  choice: വിഭാഗം
  rationale: ഇവിടെ പിൽക്കാല സാങ്കേതിക അർഥത്തിലുള്ള 'മതവിരുദ്ധോപദേശം' അല്ല, ഒരു മതസാമൂഹിക കൂട്ടത്തെയോ പ്രസ്ഥാനത്തെയോ ആണ് സൂചിപ്പിക്കുന്നത്. 'വിഭാഗം' ആ അർഥം മതവിഭാഗീയ നിറം അമിതമായി ചേർക്കാതെ നൽകുന്നു.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: ഞങ്ങൾക്ക് അറിയാം
  rationale: ഗ്രീക്കിലെ ഔപചാരിക പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πανταχοῦ
  choice: എല്ലായിടത്തും
  rationale: പദത്തിന്റെ വ്യാപകമായ സ്ഥലസൂചന നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀντιλέγεται
  choice: എതിർത്തു സംസാരിക്കപ്പെടുന്നു
  rationale: വെറും പൊതുവായ എതിർപ്പിനെക്കാൾ, ഈ കൂട്ടത്തെക്കുറിച്ച് പ്രതികൂലമായി സംസാരിക്കുന്നു എന്ന ക്രിയാത്മകവും കർമണിപ്രയോഗപരവുമായ ഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: αἵρεσις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിഭാഗം
  alternative: മതവിരുദ്ധവിഭാഗം / പാഷണ്ഡത
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിസ്തീയ പ്രസ്ഥാനത്തെ പുറത്തുള്ളവർ ഒരു തിരിച്ചറിയാവുന്ന കൂട്ടമായി പരാമർശിക്കുകയാണ്. പിൽക്കാല സഭാചരിത്രത്തിലെ സാങ്കേതികമായ 'heresy' എന്ന അർഥം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നത് അനാവശ്യമായ ദൈവശാസ്ത്രവിധി ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. സംഭാഷണത്തിലെ ഔപചാരിക വിനയം നിലനിർത്തിയിരിക്കുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട പദമായ “വിഭാഗം” വരുന്ന വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
