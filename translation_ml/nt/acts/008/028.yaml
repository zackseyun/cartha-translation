translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കുമ്പോഴും ആഖ്യാനത്തിന് യോജിച്ച മാന്യമായ ശൈലി പാലിച്ചു. തുടർന്നുകൊണ്ടിരുന്ന രണ്ട് പ്രവൃത്തികളുടെയും ഭാവം ‘മടങ്ങിപ്പോകുകയായിരുന്നു’, ‘വായിച്ചുകൊണ്ടുമിരുന്നു’ എന്നീ രൂപങ്ങളിലൂടെ സംരക്ഷിച്ചു.
