id: ACT.8.28
reference: Acts 8:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: ml
  text: അയാൾ മടങ്ങിപ്പോകുകയായിരുന്നു; തന്റെ രഥത്തിൽ ഇരുന്ന് യെശയ്യാ പ്രവാചകനെ വായിച്ചുകൊണ്ടുമിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉറക്കെ വായിച്ചുകൊണ്ടുമിരുന്നു’ എന്നും മനസ്സിലാക്കാം. പുരാതനകാലത്ത് വായന പലപ്പോഴും ശബ്ദത്തോടെയായിരുന്നു; എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയതന്നെ ‘ഉറക്കെ’ എന്ന് വ്യക്തമായി പറയുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: അയാൾ മടങ്ങിപ്പോകുകയായിരുന്നു
  rationale: ἦν എന്ന ഭൂതകാല ക്രിയയോടുകൂടിയ വർത്തമാനകാല കൃദന്തം, ഭൂതകാലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ലക്ഷ്യസ്ഥാനം മനസ്സിലാകുന്നുണ്ടെങ്കിലും മൂലപാഠത്തിൽ ‘വീട്ടിലേക്ക്’ എന്നു വ്യക്തമല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല; τέ-യുടെ ലഘുവായ ബന്ധകസ്വഭാവം വാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
- source_word: καθήμενος
  choice: ഇരുന്ന്
  rationale: യാത്രയ്ക്കിടയിലെ അയാളുടെ ശരീരനില ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: തന്റെ രഥത്തിൽ
  rationale: ἐπί + genitive അക്ഷരാർഥത്തിൽ ‘മേൽ’ എന്നാകാമെങ്കിലും, വാഹനത്തിൽ യാത്ര ചെയ്യുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘രഥത്തിൽ’ എന്നു പറയുന്നു. αὐτοῦ ബന്ധം ‘തന്റെ’ എന്ന പദം സംരക്ഷിക്കുന്നു.
- source_word: ἀνεγίνωσκεν
  choice: വായിച്ചുകൊണ്ടുമിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പുരാതനകാലത്ത് ഉറക്കെ വായിക്കൽ സാധാരണമായിരുന്നെങ്കിലും ക്രിയ ഇവിടെ അതു നിർബന്ധമായി വ്യക്തമാക്കാത്തതിനാൽ പ്രധാനപാഠത്തിൽ ‘ഉറക്കെ’ ചേർത്തിട്ടില്ല.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: പ്രവാചകനായ യെശയ്യാവിന്റെ ഗ്രന്ഥം
  rationale: ഗ്രീക്കിൽ വ്യക്തിയായ ‘യെശയ്യാ പ്രവാചകൻ’ തന്നെയാണ് വായനയുടെ കർമമായി വരുന്നത്; ഇവിടെ അദ്ദേഹത്തിന്റെ രചനയെ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക പ്രയോഗമാണത്. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കി സ്വാഭാവികമാക്കാൻ ‘ഗ്രന്ഥം’ എന്നു വ്യക്തമാക്കിയിരിക്കുന്നു; ‘പ്രവാചകൻ’ എന്ന തിരിച്ചറിയൽ നിലനിർത്തിയിട്ടുണ്ട്.
