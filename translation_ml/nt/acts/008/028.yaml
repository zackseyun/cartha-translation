  to: അയാൾ മടങ്ങിപ്പോകുകയായിരുന്നു; തന്റെ രഥത്തിൽ ഇരുന്ന് യെശയ്യാ പ്രവാചകനെ വായിച്ചുകൊണ്ടുമിരുന്നു[a].
  rationale: The revision removes the added “ഗ്രന്ഥം” so that the translation preserves the Greek’s direct, metonymic expression, “Isaiah the prophet,” while remaining natural in Malayalam. The existing cultural footnote is accurate and its anchor remains appropriately placed after the reading verb.
