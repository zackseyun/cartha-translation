id: ACT.8.33
reference: Acts 8:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: ml
  text: അവന്റെ അപമാനാവസ്ഥയിൽ അവനു നീതി നിഷേധിക്കപ്പെട്ടു.[b] അവന്റെ തലമുറയെക്കുറിച്ച്[a] ആർ വിവരിക്കും? എന്തെന്നാൽ, അവന്റെ ജീവൻ ഭൂമിയിൽനിന്ന് എടുത്തുകളയപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവന്റെ സന്തതിയെക്കുറിച്ച്’ അല്ലെങ്കിൽ ‘അവന്റെ സമകാലികരെക്കുറിച്ച്’; യെശയ്യാവ് 53-ലെ ഉദ്ധരണിയിലുള്ള ‘തലമുറ’ എന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥസന്ദിഗ്ധത ഇവിടെ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘അവന്റെ വിധി എടുത്തുകളയപ്പെട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: അപമാനാവസ്ഥയിൽ
  rationale: താഴ്ത്തപ്പെടുകയും അപമാനിക്കപ്പെടുകയും ചെയ്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അന്യായമായ പീഡനത്തിന്റെ സന്ദർഭത്തിന് യോജിക്കുന്നതും അമിതവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമായ പ്രയോഗം.
- source_word: κρίσις
  choice: നീതി
  rationale: ഇവിടെ ന്യായമായ പരിഗണന നിഷേധിക്കപ്പെട്ടതെന്ന നിയമപരവും ധാർമികവുമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘വിധി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἤρθη
  choice: നിഷേധിക്കപ്പെട്ടു
  rationale: നീതി എടുത്തുകളയപ്പെട്ടു അഥവാ ലഭിക്കാതെപോയി എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γενεὰν
  choice: തലമുറ
  rationale: ഗ്രീക്ക് പദത്തിനുള്ള സന്തതി, സമകാലികർ എന്നീ വ്യത്യസ്ത സാധ്യതകൾക്കിടയിലെ അർഥസന്ദിഗ്ധത നിലനിർത്തുന്നു.
- source_word: διηγήσεται
  choice: വിവരിക്കും
  rationale: വിശദമായി പറഞ്ഞറിയിക്കുക എന്ന ക്രിയയുടെ അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: αἴρεται
  choice: എടുത്തുകളയപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ സജീവത നിലനിർത്തിക്കൊണ്ട് നീക്കം ചെയ്യപ്പെടുന്നതിനെ വ്യക്തമാക്കുന്നു.
- source_word: γῆς
  choice: ഭൂമി
  rationale: ഭൗമികജീവിതത്തിൽനിന്നുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിൽ ‘ഭൂമി’ സ്വാഭാവികമാണ്.
- source_word: ζωὴ
  choice: ജീവൻ
  rationale: യെശയ്യാവിലെ ദാസന്റെ മരണസന്ദർഭത്തിന് യോജിച്ചവിധം ശാരീരികജീവനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവന്റെ തലമുറ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രധാനപാഠത്തിൽ അർഥസന്ദിഗ്ധമായ ‘അവന്റെ തലമുറ’ നിലനിർത്തി.
  alternative: ‘അവന്റെ സന്തതി’ അല്ലെങ്കിൽ ‘അവന്റെ സമകാലികർ’.
  rationale: യെശയ്യാവ് 53-ലെ ഉദ്ധരണിയിലുള്ള ഈ ദുഷ്കരപ്രയോഗം സന്തതിയെയോ സമകാലികരെയോ സൂചിപ്പിക്കാം; ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കാതെ അർഥസമ്മർദം സംരക്ഷിക്കുന്നു.
- issue: κρίσις എന്ന പദത്തിന്റെ അർഥം
  choice: ‘നീതി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വിധി’.
  rationale: ഈ സന്ദർഭത്തിൽ ന്യായമായ നിയമനടപടിയോ നീതിയോ നിഷേധിക്കപ്പെട്ടതാണ് ഊന്നൽ; ‘വിധി’ എന്ന ശാബ്ദികസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, ഗൗരവമുള്ള ശൈലി. ‘അപമാനാവസ്ഥ’ മൂലപാഠത്തിലെ താഴ്ത്തപ്പെട്ട നിലയെ വ്യക്തമാക്കുന്നു; ‘തലമുറ’ വ്യാഖ്യാനപരമായ അർഥസന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
