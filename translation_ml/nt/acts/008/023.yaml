  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ നീ കയ്പിന്റെ പിത്തത്തിലും അനീതിയുടെ ബന്ധനത്തിലും ഉള്ളതായി ഞാൻ കാണുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അനീതിയുടെ ചങ്ങലയിൽ’ അല്ലെങ്കിൽ ‘ദുഷ്ടതയുടെ വിലങ്ങിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ‘കയ്പിന്റെ പിത്തം’ ശക്തമായ ഒരു രൂപകമാണ്; വിഷമയമായ കയ്പിനെക്കുറിച്ചുള്ള പഴയനിയമ ഭാഷ ഇതിൽ പ്രതിധ്വനിക്കുന്നുണ്ടാകാം (ആവർത്തനം 29:18-ന്റെ സെപ്റ്റുവജിന്റ് പരിഭാഷ താരതമ്യം ചെയ്യുക).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: അകപ്പെട്ടിരിക്കുന്നതായി
  rationale: ὁρῶ σε ὄντα എന്ന ഘടനയിൽ εἰς ശിമോന്റെ നിലവിലെ അവസ്ഥയെയോ സ്ഥിതിയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അകപ്പെട്ടിരിക്കുന്നു’ എന്ന പ്രയോഗം ബന്ധനത്തിന്റെ ആശയത്തോടു സ്വാഭാവികമായി ചേരുകയും രൂപകത്തിന്റെ ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള ശാസനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ വിശദീകരണശക്തി നിലനിർത്തുന്നു.
- source_word: χολὴν πικρίας
  choice: കയ്പിന്റെ പിത്തം
  rationale: χολή എന്നത് പിത്തത്തെയും രൂപകമായി വിഷത്തെയും സൂചിപ്പിക്കാം. വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ, പഴയനിയമ ഭാഷയെ ഓർമിപ്പിക്കുന്ന ശക്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: σύνδεσμον ἀδικίας
  choice: അനീതിയുടെ ബന്ധനം
  rationale: σύνδεσμος എന്നതിന്റെ കെട്ടിപ്പിടിക്കുന്ന ബന്ധനം എന്ന അർഥവും ἀδικία എന്നതിന്റെ അനീതി/ദുഷ്ടത എന്ന വിശാല അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ὁρῶ
  choice: ഞാൻ കാണുന്നു
  rationale: നേരിട്ടുള്ള ‘കാണുന്നു’ എന്ന അർഥത്തോടൊപ്പം തിരിച്ചറിയുന്നു എന്ന സന്ദർഭാർഥവും മലയാളത്തിൽ വഹിക്കാനാകുന്നു.
- source_word: σε ὄντα
  choice: നീ ... അകപ്പെട്ടിരിക്കുന്നതായി
  rationale: കർമവിഭക്തിയോടുകൂടിയ വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ഉള്ളടക്കവാക്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശിമോന്റെ ആത്മീയവും ധാർമികവുമായ അവസ്ഥയെ വിവരിക്കുന്ന രൂപകങ്ങൾ
  choice: ‘കയ്പിന്റെ പിത്തം’, ‘അനീതിയുടെ ബന്ധനം’ എന്നീ രൂപകങ്ങൾ നിലനിർത്തി.
  alternative: ‘കയ്പേറിയ വിഷം നിറഞ്ഞവൻ’, ‘പാപത്തിന് അടിമ’ എന്നിങ്ങനെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം സാന്ദ്രമായ രൂപകങ്ങളാണ് ഉപയോഗിക്കുന്നത്; വ്യക്തമായ സിദ്ധാന്തവിശദീകരണം നൽകുന്നില്ല. അതിനാൽ അതിന്റെ തീവ്രതയും അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ സാന്ദ്രമായ രൂപകങ്ങൾ വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
