  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: ml
  text: 'അപ്പോൾ ഷണ്ഡൻ ഫിലിപ്പൊസിനോടു മറുപടിയായി പറഞ്ഞു: “ഞാൻ അങ്ങയോടു അപേക്ഷിക്കുന്നു[a], പ്രവാചകൻ ഇത് ആരെക്കുറിച്ചാണ് പറയുന്നത്—തന്നെക്കുറിച്ചോ മറ്റൊരാളെക്കുറിച്ചോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ അങ്ങയോടു യാചിക്കുന്നു.” ഗ്രീക്ക് പ്രയോഗം ആദരവോടെയുള്ള അപേക്ഷയെ സൂചിപ്പിക്കുന്നു; കൂടുതൽ തീവ്രതയുള്ള രീതിയിലും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: അപ്പോൾ ... ചോദിച്ചു
  rationale: ἀποκριθείς എന്ന പങ്കാളിക്രിയയും εἶπεν എന്ന മുഖ്യക്രിയയും ചേർന്നുള്ള ഗ്രീക്ക് പ്രയോഗം സംഭാഷണത്തിലെ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി, ചോദ്യം അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ ‘ചോദിച്ചു’ ഉപയോഗിച്ചു; δέയുടെ ആഖ്യാനപുരോഗതി ‘അപ്പോൾ’ പ്രകടമാക്കുന്നു.
- source_word: ὁ εὐνοῦχος
  choice: ഷണ്ഡൻ
  rationale: εὐνοῦχος എന്ന പദത്തിന്റെ നിർദിഷ്ട അർഥം നിലനിർത്തുന്നു; പൊതുവായ ‘ഉദ്യോഗസ്ഥൻ’ എന്നാക്കി മാറ്റുന്നില്ല.
- source_word: τῷ Φιλίππῳ
  choice: ഫിലിപ്പൊസിനോടു
  rationale: സംസാരത്തിന്റെ അഭിസംബോധിതനെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിൽ സ്വാഭാവികമായി ‘-നോടു’ ഉപയോഗിച്ച് നൽകി.
- source_word: Δέομαί σου
  choice: ഞാൻ അങ്ങയോടു അപേക്ഷിക്കുന്നു
  rationale: δέομαι ആദരവോടുകൂടിയ അപേക്ഷയെയോ അഭ്യർഥനയെയോ സൂചിപ്പിക്കുന്നു. ‘അങ്ങയോടു’ വിനയഭാവവും ‘അപേക്ഷിക്കുന്നു’ അഭ്യർഥനയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: περὶ τίνος
  choice: ആരെക്കുറിച്ചാണ്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന വിഷയബന്ധം സ്വാഭാവിക മലയാളചോദ്യരൂപത്തിൽ നൽകി.
- source_word: ὁ προφήτης λέγει τοῦτο
  choice: പ്രവാചകൻ ഇത് ... പറയുന്നത്
  rationale: തൊട്ടുമുമ്പ് വായിച്ച ഉദ്ധരണിയെയാണ് τοῦτο സൂചിപ്പിക്കുന്നത്; ഏകവചനമായ ‘ഇത്’ അതിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: തന്നെക്കുറിച്ചോ മറ്റാരെയെങ്കിലും കുറിച്ചോ
  rationale: പ്രവാചകൻ തന്നെയാണോ അതോ വേറൊരാളാണോ പരാമർശവിഷയം എന്ന വ്യക്തമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി സ്വീകരിച്ചു. ‘അങ്ങ്’ എന്ന ആദരസൂചക രൂപം അപേക്ഷയുടെ വിനയഭാവം വ്യക്തമാക്കുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാക്കി.
