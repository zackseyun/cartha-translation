id: ACT.8.12
reference: Acts 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: ml
  text: 'എന്നാൽ ദൈവരാജ്യത്തെക്കുറിച്ചും മശീഹയായ യേശുവിന്റെ നാമത്തെക്കുറിച്ചും സുവാർത്ത അറിയിച്ചുകൊണ്ടിരുന്ന ഫിലിപ്പോസിനെ അവർ വിശ്വസിച്ചപ്പോൾ, പുരുഷന്മാരും സ്ത്രീകളും സ്നാനം സ്വീകരിച്ചുകൊണ്ടിരുന്നു.


    [a] അഥവാ, “യേശുക്രിസ്തുവിന്റെ നാമത്തെക്കുറിച്ചും.” ഇവിടെ ഗ്രീക്കിലെ Χριστός (ക്രിസ്റ്റോസ്) ഒരു സ്ഥാനപ്പേരായതിനാൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുക്രിസ്തുവിന്റെ നാമത്തെക്കുറിച്ചും.” ഇവിടെ ഗ്രീക്കിലെ Χριστός (ക്രിസ്റ്റോസ്) ഒരു സ്ഥാനപ്പേരായതിനാൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ …പ്പോൾ
  rationale: ὅτε സൂചിപ്പിക്കുന്ന കാലബന്ധം ‘…പ്പോൾ’ എന്നും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യം അഥവാ ആഖ്യാനമാറ്റം ‘എന്നാൽ’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: ഫിലിപ്പോസിനെ അവർ വിശ്വസിച്ചു
  rationale: ദാതിവോടുകൂടിയ πιστεύω ഇവിടെ ഫിലിപ്പോസിൽ രക്ഷാകരമായ വിശ്വാസം അർപ്പിച്ചു എന്നല്ല, സുവാർത്ത അറിയിക്കുന്ന സാക്ഷിയെന്ന നിലയിൽ അദ്ദേഹത്തെ വിശ്വസിച്ചു എന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εὐαγγελιζομένῳ
  choice: സുവാർത്ത അറിയിച്ച
  rationale: വർത്തമാനകാല കൃദന്തം ഫിലിപ്പോസ് സുവാർത്ത അറിയിച്ചുകൊണ്ടിരുന്ന സാഹചര്യത്തിലാണ് അവർ അദ്ദേഹത്തെ വിശ്വസിച്ചതെന്ന് വ്യക്തമാക്കുന്നു; മലയാള വാക്യഘടനയിൽ ‘സുവാർത്ത അറിയിച്ച ഫിലിപ്പോസ്’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തെക്കുറിച്ചുള്ള
  rationale: περί വിഷയത്തെ അവതരിപ്പിക്കുന്നു; ‘ദൈവരാജ്യം’ എന്നത് βασιλεία τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ സുതാര്യവും പരിചിതവുമായ പരിഭാഷയാണ്.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ നാമത്തെക്കുറിച്ചുള്ള
  rationale: ὄνομα എന്ന ‘നാമം’ നിലനിർത്തുന്നത് ആ വ്യക്തിയെയും അധികാരത്തെയും വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും ഉൾക്കൊള്ളുന്ന മൂലപ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു. Χριστός ഇവിടെ സ്ഥാനപ്പേരായി ഗ്രഹിച്ച് ‘മശീഹ’ എന്നു നൽകി.
- source_word: ἐβαπτίζοντο
  choice: സ്നാനം സ്വീകരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാല കർമണിപ്രയോഗം കഴിഞ്ഞകാലത്ത് നടന്നുകൊണ്ടിരുന്ന അഥവാ ആവർത്തിച്ച പ്രതികരണത്തെ സൂചിപ്പിക്കുന്നു; ‘സ്വീകരിച്ചുകൊണ്ടിരുന്നു’ ആ അപൂർണതാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: പുരുഷന്മാരും സ്ത്രീകളും
  rationale: τε … καὶ രണ്ടു വിഭാഗങ്ങളെയും ചേർത്തുപറയുന്നു; ഈ ലളിതമായ മലയാളപ്രയോഗം ഇരുകൂട്ടരെയും വ്യക്തമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: യേശുക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός വെറും പേരിന്റെ ഭാഗംപോലെ മാത്രമല്ല, അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു. അതിനാൽ ആ സ്ഥാനപ്പേരിന്റെ അർത്ഥം തെളിയിക്കാൻ ‘മശീഹയായ യേശു’ എന്നു നൽകി; സഭാപരമായി പരിചിതമായ ‘യേശുക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ഫിലിപ്പോസിനെ ‘വിശ്വസിച്ചു’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: സന്ദേശം അറിയിക്കുന്ന സാക്ഷിയെന്ന നിലയിൽ ഫിലിപ്പോസിനെ വിശ്വസിച്ചു
  alternative: ഫിലിപ്പോസിൽ വിശ്വസിച്ചു
  rationale: ഗ്രീക്ക് ദാതിവ് ഫിലിപ്പോസിനെ വിശ്വാസത്തിന്റെ അന്തിമ വിഷയമാക്കണമെന്നില്ല. തുടർന്നുള്ള കൃദന്തവാക്യം അവർ അദ്ദേഹത്തിന്റെ സുവാർത്താപ്രഘോഷണം വിശ്വസിച്ചതാണെന്ന് നിർണ്ണയിക്കുന്നു; അതിനാൽ ദൈവത്തിനോ യേശുവിനോ അർഹമായ രക്ഷാകര വിശ്വാസം ഫിലിപ്പോസിലേക്കു മാറ്റുന്ന വ്യാഖ്യാനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘സുവാർത്ത’, ‘ദൈവരാജ്യം’, ‘സ്നാനം’ തുടങ്ങിയ വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്ന ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. വാക്യത്തിന്റെ ഗ്രീക്ക് കാലബന്ധവും അപൂർണ ഭൂതകാലത്തിന്റെ നടന്നുകൊണ്ടിരിക്കുന്ന സ്വഭാവവും കഴിയുന്നത്ര വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ചു.
