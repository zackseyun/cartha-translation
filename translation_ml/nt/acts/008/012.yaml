  terminology: ‘ദൈവരാജ്യം,’ ‘സുവാർത്ത,’ ‘മശീഹ,’ and ‘സ്നാനം’ are appropriate. ‘മശീഹയായ യേശു’ naturally conveys the titular force of Χριστός without making a doctrinal claim beyond the Greek.
