    rationale: ഗ്രീക്കിൽ δυναίμην-ന് വ്യക്തമായ കർമമില്ല; സന്ദർഭം ഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിച്ചാലും, ὁδηγέωയുടെ വിശാലമായ ‘വഴികാട്ടുക/നയിക്കുക’ എന്ന അർഥസാധ്യതയെ പ്രധാനപാഠത്തിൽ ‘മനസ്സിലാക്കുക’ എന്നു പരിമിതപ്പെടുത്തേണ്ടതില്ല.
