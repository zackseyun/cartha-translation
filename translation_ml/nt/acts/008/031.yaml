- from: 'അദ്ദേഹം പറഞ്ഞു: “ആരെങ്കിലും എനിക്കു വഴികാട്ടിയില്ലെങ്കിൽ എനിക്ക് എങ്ങനെ മനസ്സിലാക്കാൻ കഴിയും?[a]” പിന്നെ അദ്ദേഹം ഫിലിപ്പോസിനോട് രഥത്തിൽ കയറി തന്നോടൊപ്പം ഇരിക്കാൻ അഭ്യർഥിച്ചു.[b]'
  to: 'അദ്ദേഹം പറഞ്ഞു: “ആരെങ്കിലും എനിക്കു വഴികാട്ടിയില്ലെങ്കിൽ എനിക്ക് എങ്ങനെ കഴിയൂ?[a]” പിന്നെ ഫിലിപ്പോസ് രഥത്തിലേക്കു കയറി തന്നോടൊപ്പം ഇരിക്കണമെന്ന് അദ്ദേഹം അഭ്യർഥിച്ചു.[b]'
