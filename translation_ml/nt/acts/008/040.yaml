id: ACT.8.40
reference: Acts 8:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: ml
  text: എന്നാൽ ഫിലിപ്പോസ് അസോത്തോസിൽ കാണപ്പെട്ടു[a]. അവൻ കടന്നുപോകുന്നതിനിടെ, കൈസര്യയിൽ എത്തുന്നതുവരെ എല്ലാ പട്ടണങ്ങളിലും സുവാർത്ത അറിയിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അസോത്തോസിൽ പ്രത്യക്ഷപ്പെട്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അസോത്തോസിൽ കാണപ്പെട്ടു’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് ദൈവികമായി സംഭവിച്ച പെട്ടെന്നുള്ള സ്ഥലമാറ്റത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഗ്രീക്ക് വാചകം അത് തുറന്നുപറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആത്മാവ് ഫിലിപ്പോസിനെ എടുത്തുകൊണ്ടുപോയ സംഭവത്തിൽനിന്നുള്ള മൃദുവായ ആഖ്യാനമാറ്റവും വൈരുധ്യവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εὑρέθη
  choice: കാണപ്പെട്ടു
  rationale: എὑρίσκωയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുകയും, അത്ഭുതകരമായ സ്ഥലമാറ്റം സന്ദർഭം സൂചിപ്പിക്കാൻ അനുവദിക്കുമ്പോൾ അതിനെ മുഖ്യവാചകത്തിൽ തുറന്ന് വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς Ἄζωτον
  choice: അസോത്തോസിൽ
  rationale: കണ്ടെത്തപ്പെടുക/കാണപ്പെടുക എന്ന ക്രിയയോടൊപ്പം εἰς ഫലമായുള്ള സ്ഥാനം സൂചിപ്പിക്കുന്നു; Ἄζωτος എന്ന ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ രൂപവും നിലനിർത്തുന്നു.
- source_word: διερχόμενος
  choice: കടന്നുപോകുന്നതിനിടെ
  rationale: മുഖ്യക്രിയയോടൊപ്പം നടന്ന യാത്രയെ സൂചിപ്പിക്കുന്ന സമകാലിക കൃദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: εὐηγγελίζετο
  choice: സുവാർത്ത അറിയിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപത്തിലെ തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ പ്രവർത്തനം നിലനിർത്തുകയും സഭാസാങ്കേതിക പദപ്രയോഗം ഒഴിവാക്കി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰς πόλεις πάσας
  choice: എല്ലാ പട്ടണങ്ങളിലും
  rationale: യാത്രാമാർഗത്തിലെ പട്ടണങ്ങളെ ഒന്നാകെ ഉൾക്കൊള്ളുന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: എത്തുന്നതുവരെ
  rationale: ἕως സഹിതമുള്ള ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനത്തിന്റെ അന്ത്യബിന്ദു സൂചിപ്പിക്കുന്നു.
- source_word: εἰς Καισάρειαν
  choice: കൈസര്യയിൽ
  rationale: ἔρχομαιയോടൊപ്പമുള്ള εἰς ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൈസര്യയിൽ എത്തുക’ എന്നത് സ്വാഭാവികമാണ്.
theological_decisions:
- issue: εὑρέθη എന്ന പദം ഫിലിപ്പോസിന്റെ അത്ഭുതകരമായ സ്ഥലമാറ്റത്തെ ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നു വ്യക്തമായി വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: മുഖ്യവാചകത്തിൽ നിഷ്പക്ഷമായ ‘കാണപ്പെട്ടു’ നിലനിർത്തി
  alternative: ‘അസോത്തോസിൽ പ്രത്യക്ഷപ്പെട്ടു’
  rationale: സന്ദർഭം ദൈവിക പ്രവർത്തനത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് പദം അതിനെ ‘പ്രത്യക്ഷപ്പെട്ടു’ എന്നു തുറന്നുപറയുന്നില്ല. അതിനാൽ ആഖ്യാനത്തിലെ യഥാർഥ പദപ്രയോഗവും അതിലെ വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സുവാർത്ത അറിയിച്ചുകൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം ക്രിയയുടെ തുടർച്ചാഭാവം വ്യക്തമാക്കുന്നു; സ്ഥലനാമങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളോട് ചേർന്ന മലയാളലിപ്യന്തരണത്തിൽ നൽകി.
