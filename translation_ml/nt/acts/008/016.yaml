id: ACT.8.16
reference: Acts 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: ml
  text: എന്തെന്നാൽ, പരിശുദ്ധാത്മാവ് അവരിൽ ഒരാളുടെമേലും അതുവരെ വന്നിരുന്നില്ല[a]; അവർ കർത്താവായ യേശുവിന്റെ നാമത്തിൽ മാത്രമേ സ്നാനം ഏറ്റിരുന്നുള്ളൂ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “അവരിൽ ഒരാളുടെമേലും അതുവരെ പതിച്ചിരുന്നില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: “കർത്താവായ യേശുവിന്റെ നാമത്തിലേക്ക് മാത്രമേ സ്നാനം ഏറ്റിരുന്നുള്ളൂ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: അതുവരെ ... ഇല്ല
  rationale: ആ സമയബിന്ദുവുവരെ സംഭവം നടന്നിട്ടില്ലെന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: അവരിൽ ആരുടെയുംമേൽ
  rationale: ἐπίയുടെ വ്യക്തികളിലേക്കുള്ള ദിശയും മൂലപാഠത്തിലെ സ്ഥലരൂപകവും നിലനിർത്തുന്നു.
- source_word: ἐπιπεπτωκός
  choice: വന്നിരുന്നില്ല
  rationale: പരിശുദ്ധാത്മാവ് ആളുകളുടെമേൽ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രവൃത്തികളുടെ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പതിക്കുക’ എന്ന കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μόνον
  choice: മാത്രമേ
  rationale: ആത്മാവിന്റെ വരവും ഇതിനുമുമ്പ് നടന്ന സ്നാനവും തമ്മിലുള്ള പരിമിതിയും വൈരുധ്യവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: സ്നാനം ഏറ്റിരുന്നുള്ളൂ
  rationale: മുമ്പ് നടന്ന സ്നാനത്തിന്റെ ഫലമായി നിലനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പരിഭാഷാപരമായ ക്രിയാരൂപത്തിന്റെ കാലഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὸ ὄνομα
  choice: നാമത്തിൽ
  rationale: സ്നാനവുമായി ബന്ധപ്പെട്ട പ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ രൂപം; εἰς എന്നതിന്റെ കൂടുതൽ പദാനുപദമായ ‘നാമത്തിലേക്ക്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശു
  rationale: κύριος എന്ന പദത്തെ ‘കർത്താവ്’ എന്നു നൽകുകയും യേശുവിനോടുള്ള പദവിസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘വന്നിരുന്നില്ല’ എന്നതിന്റെ വ്യാകരണപരമായി അപ്രകടമായ കർത്താവ്
  choice: മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പരിശുദ്ധാത്മാവ്’ എന്നു വ്യക്തമാക്കി
  alternative: കർത്താവിനെ വ്യക്തമാക്കാതെ വാക്യം രൂപപ്പെടുത്തുക
  rationale: ഗ്രീക്കിൽ കർത്താവ് പറയാത്തതെങ്കിലും തൊട്ടുമുൻപുള്ള വാക്യത്തിൽ പരിശുദ്ധാത്മാവ് വ്യക്തമായി പരാമർശിക്കപ്പെടുന്നു. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ആ പരാമർശം ആവർത്തിക്കുന്നു; ഇതിലൂടെ പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
- issue: സ്നാനവും ‘നാമം’ എന്നതും തമ്മിലുള്ള εἰς ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ ‘നാമത്തിൽ’
  alternative: ‘നാമത്തിലേക്ക്’
  rationale: ഈ വാക്യം സ്നാനക്രമത്തെയോ സാക്രമെന്റൽ ദൈവശാസ്ത്രത്തെയോ കുറിച്ചുള്ള പിന്നീടുള്ള തർക്കങ്ങൾ തീർപ്പാക്കുന്നില്ല. സ്വാഭാവികമായ പ്രയോഗം മുഖ്യപാഠത്തിലും പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പരിശുദ്ധാത്മാവ്’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു. ‘വന്നിരുന്നു’ മുഖ്യപാഠത്തിൽ സ്വാഭാവികത നൽകുമ്പോൾ, മൂലത്തിലെ ‘വീഴുക/പതിക്കുക’ എന്ന രൂപകവും εἰς എന്നതിന്റെ ദിശാഭാവവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
