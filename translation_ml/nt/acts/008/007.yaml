id: ACT.8.7
reference: Acts 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: ml
  text: കാരണം, അശുദ്ധാത്മാക്കൾ ഉണ്ടായിരുന്ന അനേകരിൽനിന്ന് അവ ഉച്ചത്തിൽ നിലവിളിച്ചുകൊണ്ട് പുറത്തുവന്നു; പക്ഷാഘാതം ബാധിച്ചവരും മുടന്തരും ആയ അനേകർ സൗഖ്യം പ്രാപിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: അശുദ്ധാത്മാക്കൾ ബാധിച്ചിരുന്ന അനേകരിൽനിന്ന്
  rationale: വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിൽ നിലനിർത്തിക്കൊണ്ട്, ആത്മാക്കൾ ആളുകളിൽനിന്ന് പുറത്തുവന്നുവെന്ന ബന്ധം വ്യക്തമാക്കുന്നു. γάρ പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്താതെ സന്ദർഭബന്ധത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: πνεύματα ἀκάθαρτα
  choice: അശുദ്ധാത്മാക്കൾ
  rationale: ലൂക്കോസ്–പ്രവൃത്തികൾ ഗ്രന്ഥങ്ങളിലെ ദുഷ്ടാത്മാക്കളെ സൂചിപ്പിക്കുന്ന പതിവായ ബൈബിൾപ്രയോഗം; ഉറവിടത്തിലെ ശുദ്ധി–അശുദ്ധി ആശയം സംരക്ഷിക്കുന്നു.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ നിലവിളിച്ചുകൊണ്ട്
  rationale: ഉച്ചത്തിലുള്ള ശബ്ദത്തെയും തുടർന്നുകൊണ്ടിരുന്ന നിലവിളിയെയും സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξήρχοντο
  choice: പുറത്തുവന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ ആവർത്തിതമോ പുരോഗമനപരമോ ആയ ഭാവം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക കഥനരൂപം; കർത്താവ് അശുദ്ധാത്മാക്കളാണെന്ന് വ്യക്തമാക്കാൻ 'അവ' ചേർത്തു.
- source_word: παραλελυμένοι
  choice: പക്ഷാഘാതം ബാധിച്ചവർ
  rationale: ഫലമായി നിലനിൽക്കുന്ന ശരീരാവസ്ഥയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: χωλοὶ
  choice: മുടന്തർ
  rationale: നടക്കാനുള്ള ശാരീരിക വൈകല്യത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളപദം.
- source_word: ἐθεραπεύθησαν
  choice: സൗഖ്യം പ്രാപിച്ചു
  rationale: കർമ്മണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ഈ ഉപവാക്യത്തിൽ സൗഖ്യമാക്കിയ വ്യക്തിയെ പ്രത്യേകം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: നിലവിളിക്കുകയും പുറത്തുവരുകയും ചെയ്തവയുടെ സൂചിതകർത്താവ്
  choice: അശുദ്ധാത്മാക്കളാണ് ഉച്ചത്തിൽ നിലവിളിച്ചുകൊണ്ട് ബാധിതരിൽനിന്ന് പുറത്തുവന്നത്.
  alternative: ബാധിതരായ ആളുകൾ നിലവിളിക്കുമ്പോൾ ആത്മാക്കൾ പുറത്തുവന്നു.
  rationale: നപുംസകലിംഗ ബഹുവചന കൃദന്തരൂപമായ βοῶντα, πνεύματα ἀκάθαρτα എന്നതിനോടാണ് സ്വാഭാവികമായി യോജിക്കുന്നത്. അതിനാൽ മലയാളത്തിൽ 'അവ' ചേർത്ത് ഈ വ്യാകരണബന്ധം വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള dignified കഥനശൈലി. ഉറവിടത്തിലെ അർഥബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ തൂങ്ങിനിൽക്കുന്ന ഘടന ഒഴിവാക്കി. അടിക്കുറിപ്പുകൾ ആവശ്യമില്ല; നിലവിളിയുടെ കർത്താവ് മുഖ്യവാചകത്തിൽ വ്യക്തമാണ്.
