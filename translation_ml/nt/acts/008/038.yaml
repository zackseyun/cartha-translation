revisions:
- from: അവൻ രഥം നിർത്താൻ കല്പിച്ചു. ഫിലിപ്പോസും ഷണ്ഡനും ഇരുവരും വെള്ളത്തിലേക്ക്[a] ഇറങ്ങി; ഫിലിപ്പോസ് അയാളെ സ്നാനപ്പെടുത്തി.
  to: അവൻ രഥം നിർത്താൻ ഉത്തരവിട്ടു. ഫിലിപ്പൊസും ഷണ്ഡനും ഇരുവരും വെള്ളത്തിലിറങ്ങി[a]; ഫിലിപ്പൊസ് അയാളെ സ്നാനപ്പെടുത്തി.
  rationale: The revision strengthens the directional force of εἰς without turning βαπτίζω into an interpretation of baptismal mode. It also improves modern idiom and corrects the grammatical description in the footnote, while preserving the source's emphatic reference to both participants.
