  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: ml
  text: അവൻ രഥം നിർത്താൻ ഉത്തരവിട്ടു. ഫിലിപ്പൊസും ഷണ്ഡനും ഇരുവരും വെള്ളത്തിലിറങ്ങി[a]; ഫിലിപ്പൊസ് അയാളെ സ്നാനപ്പെടുത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വെള്ളത്തിനരികിലേക്ക്’; എങ്കിലും ഗ്രീക്കിലെ εἰς സാധാരണയായി വെള്ളത്തിനുള്ളിലേക്കുള്ള ചലനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: κέλευω എന്ന പദത്തിന്റെ ആജ്ഞാപനഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: στῆναι τὸ ἅρμα
  choice: രഥം നിർത്താൻ
  rationale: വാഹനം ചലനം അവസാനിപ്പിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘നിർത്തുക’ എന്നു പറയുന്നു.
- source_word: ἅρμα
  choice: രഥം
  rationale: ἅρμαയുടെ നേരിട്ടുള്ളതും പരമ്പരാഗതവുമായ മലയാള തുല്യപദമാണിത്; സന്ദർഭത്തെ അനാവശ്യമായി ‘വണ്ടി’യെന്നോ ‘കുതിരവണ്ടി’യെന്നോ നിർവചിക്കുന്നില്ല.
- source_word: κατέβησαν
  choice: ഇറങ്ങി
  rationale: καταβαίνω സൂചിപ്പിക്കുന്ന താഴേക്കുള്ള ചലനം ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀμφότεροι
  choice: ഇരുവരും
  rationale: രണ്ടുപേരും ഒരുമിച്ച് ഈ പ്രവൃത്തി ചെയ്തുവെന്ന മൂലപാഠത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ὕδωρ
  choice: വെള്ളത്തിലേക്ക്
  rationale: εἰς സാധാരണയായി അകത്തേക്കുള്ള ദിശാബോധം നൽകുന്നു; അതിനാൽ ‘വെള്ളത്തിലേക്ക്’ മൂലപാഠത്തിന്റെ ചലനദിശ ഏറ്റവും നന്നായി സംരക്ഷിക്കുന്നു.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: ഫിലിപ്പോസും ഷണ്ഡനും
  rationale: τε ... καί എന്ന പരസ്പരബന്ധിത ഘടനയിൽ വ്യക്തമായി പറയുന്ന രണ്ടു പങ്കാളികളെയും തിരിച്ചറിയിക്കുന്നു.
- source_word: εὐνοῦχος
  choice: ഷണ്ഡൻ
  rationale: εὐνοῦχος എന്ന പദത്തിന്റെ പ്രാഥമിക അർഥവും ഈ വിവരണത്തിലെ പദതുടർച്ചയും സംരക്ഷിക്കുന്നു; ‘കൊട്ടാര ഉദ്യോഗസ്ഥൻ’ എന്നു മാത്രം വിവർത്തനം ചെയ്താൽ സാധ്യതയുള്ള ശാരീരിക അർഥം നഷ്ടപ്പെടും.
- source_word: ἐβάπτισεν
  choice: സ്നാനപ്പെടുത്തി
  rationale: ക്രിസ്തീയ സ്നാനപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള പ്രയോഗമാണിത്; ‘മുക്കി’ എന്ന വിവർത്തനം സ്വീകരിച്ച് സ്നാനരീതിയെ പാഠം പറയുന്നതിലധികം നിർണയിക്കുന്നതു ഒഴിവാക്കുന്നു.
- source_word: αὐτόν
  choice: അയാളെ
  rationale: സ്നാനം സ്വീകരിച്ച ഷണ്ഡനെ നേരിട്ടുള്ള കർമമായി വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ഫിലിപ്പോസിനെയും മറ്റൊരു പുരുഷനെയും ഒരേ വാക്യത്തിൽ പരാമർശിക്കുന്നതിനാൽ വെറും ‘അവനെ’ എന്നതിലേക്കാൾ വ്യക്തമാണ്.
theological_decisions:
- issue: വിവർത്തനത്തിലൂടെ സ്നാനത്തിന്റെ രീതി നിർണയിക്കണമോ എന്ന ചോദ്യം
  choice: ഇരുവരും ‘വെള്ളത്തിലേക്ക് ഇറങ്ങി’ എന്നും ഫിലിപ്പോസ് അയാളെ ‘സ്നാനപ്പെടുത്തി’ എന്നും വിവർത്തനം ചെയ്തു.
  alternative: βαπτίζωയെ ‘മുക്കി’ എന്നു വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ εἰς എന്നതിന്റെ ദിശാബോധം മയപ്പെടുത്തി ‘വെള്ളത്തിനരികിലേക്ക്’ എന്നു നൽകുക.
  rationale: ഇരുവരും വെള്ളത്തിലേക്ക് ഇറങ്ങിയെന്നും ഫിലിപ്പോസ് അയാളെ സ്നാനപ്പെടുത്തിയെന്നും ഗ്രീക്ക് പാഠം പറയുന്നു. ഈ വിവരങ്ങൾ അതേപടി നിലനിർത്തുമ്പോഴും മുക്കൽ, തളിക്കൽ തുടങ്ങിയ പിൽക്കാല സഭാവിഭാഗപരമായ നിഗമനങ്ങൾ വിവർത്തനം സ്വയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘രഥം’, ‘ഷണ്ഡൻ’, ‘സ്നാനപ്പെടുത്തി’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിലെ കൃത്യതയും പദതുടർച്ചയും നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ‘ഇരുവരും ... ഫിലിപ്പോസും ഷണ്ഡനും’ എന്ന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമത്തിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
