id: ACT.8.10
reference: Acts 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: ml
  text: 'ചെറിയവർ മുതൽ വലിയവർ വരെ എല്ലാവരും അവനെ ശ്രദ്ധിച്ചു. അവർ പറഞ്ഞു: “മഹത്തായത് എന്നു വിളിക്കപ്പെടുന്ന ദൈവത്തിന്റെ ശക്തി ഇയാളാണ്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇയാൾ ‘ദൈവത്തിന്റെ മഹാശക്തി’ എന്നു വിളിക്കപ്പെടുന്നതാണ്.” ഗ്രീക്ക് വാചകം കൂടുതൽ ചുരുക്കമുള്ള, പദവിസദൃശമായ പ്രയോഗമായും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: അവനെ ശ്രദ്ധിച്ചു
  rationale: προσέχω ഇവിടെ ഒരാളിലേക്കു ശ്രദ്ധ തിരിച്ച് അയാൾ പറയുന്നതിനു ചെവികൊടുക്കുക എന്ന അർഥത്തിലാണ്. ‘അവനെ ശ്രദ്ധിച്ചു’ എന്നത് ആ ദിശാബോധം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഭക്തിയോ സമർപ്പണമോ അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ജനക്കൂട്ടത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: ചെറിയവൻമുതൽ വലിയവൻവരെ
  rationale: സമൂഹത്തിലെ എല്ലാ നിലകളിലുള്ളവരെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ദ്വന്ദ്വപ്രയോഗത്തിന്റെ രൂപവും വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന സംസാരത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഏകോപിതക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: Οὗτός
  choice: ഇയാൾ
  rationale: ശിമോൻ എന്ന വ്യക്തിയിലേക്കു വിരൽചൂണ്ടുന്ന demonstrative-ന്റെ ശക്തി ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: ദൈവശക്തി
  rationale: ‘ദൈവത്തിന്റെ ശക്തി’ എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപത്തിൽ നൽകുന്നു; ഉദ്ധരിച്ചിരിക്കുന്ന ജനങ്ങളുടെ അവകാശവാദമായിത്തന്നെ നിലനിർത്തുന്നു.
- source_word: ἡ καλουμένη Μεγάλη
  choice: മഹത്തെന്നു വിളിക്കപ്പെടുന്ന
  rationale: καλουμένη എന്ന നാമകരണഭാവവും Μεγάλη എന്ന വിശേഷണത്തിന്റെ പദവിസദൃശ ഉപയോഗവും നിലനിർത്തുന്നു. ‘മഹത്’ ശക്തിയെ വിശേഷിപ്പിക്കുന്ന പേരായി വായിക്കാം.
theological_decisions:
- issue: ജനക്കൂട്ടത്തിന്റെ വാക്കുകൾ ഔപചാരികമായ ദൈവിക പദവിയായോ ശിമോനെക്കുറിച്ചുള്ള വിവരണാത്മക അവകാശവാദമായോ പരിഭാഷപ്പെടുത്തണോ
  choice: “മഹത്തെന്നു വിളിക്കപ്പെടുന്ന ദൈവശക്തി ഇയാളാണ്” എന്ന ജനക്കൂട്ടത്തിന്റെ അവകാശവാദമായി നൽകുക
  alternative: “ഇയാൾ ദൈവത്തിന്റെ മഹാശക്തിയാണ്” / “ദൈവത്തിന്റെ മഹാശക്തി എന്നു വിളിക്കപ്പെടുന്നത് ഇയാളാണ്”
  rationale: വാക്യം ശിമോനെക്കുറിച്ച് ജനങ്ങൾ പറഞ്ഞത് റിപ്പോർട്ട് ചെയ്യുന്നു; ആ അവകാശവാദത്തെ ആഖ്യാതാവ് അംഗീകരിക്കുന്നതായി തോന്നിക്കരുത്. തിരഞ്ഞെടുത്ത രൂപം ‘വിളിക്കപ്പെടുന്ന’ എന്ന നാമകരണഭാവവും ‘മഹത്’ എന്ന പദവിസദൃശ വിശേഷണവും സംരക്ഷിക്കുന്നു; ഗ്രീക്കിലെ ഘടനാസംബന്ധിയായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ജനക്കൂട്ടത്തിന്റെ ഉദ്ധരണി വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. ‘മഹത്’ എന്നത് ഇവിടെ സാധാരണ വിവരണത്തേക്കാൾ പദവിസദൃശ നാമമായി കേൾക്കുന്നതിനാൽ ‘മഹത്തെന്നു വിളിക്കപ്പെടുന്ന’ എന്നു നൽകി; മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പ്-marker ബന്ധപ്പെട്ട പകരവായന ചൂണ്ടിക്കാണിക്കുന്നു.
