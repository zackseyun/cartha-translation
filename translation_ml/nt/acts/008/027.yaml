  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: ml
  text: അങ്ങനെ അവൻ എഴുന്നേറ്റ് പുറപ്പെട്ടു. അപ്പോൾ ഇതാ, ഒരു എത്യോപ്യക്കാരൻ—ഒരു ഷണ്ഡൻ[a]—എത്യോപ്യക്കാരുടെ രാജ്ഞിയായ കന്ദാക്കെയുടെ[b] ഉന്നത ഉദ്യോഗസ്ഥനും അവളുടെ സകല ഭണ്ഡാരത്തിന്റെയും ചുമതലക്കാരനുമായിരുന്നു. ആരാധിക്കാനായി അയാൾ യെരൂശലേമിലേക്കു വന്നിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൊട്ടാര ഉദ്യോഗസ്ഥൻ’. ‘ഷണ്ഡൻ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദം ചില സന്ദർഭങ്ങളിൽ രാജകൊട്ടാരത്തിലെ ഉദ്യോഗസ്ഥനെയും സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അക്ഷരാർഥം ഉദ്ദേശിച്ചിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ‘കന്ദാക്കെ’ എന്നത് വ്യക്തിപേര് എന്നതിലുപരി രാജ്ഞിമാർക്കുള്ള ഒരു വംശപരമ്പരാഗത സ്ഥാനപ്പേര് ആയിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: എഴുന്നേറ്റ് പുറപ്പെട്ടു
  rationale: മുൻകൃത്യവും തുടർന്നുള്ള യാത്രയും സ്വാഭാവികമായ മലയാളത്തിൽ ക്രമാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἰδοὺ
  choice: അപ്പോൾ ഇതാ
  rationale: ലൂക്കോസിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ആഖ്യാനസൂചകം ഒഴിവാക്കാതെ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀνὴρ Αἰθίοψ
  choice: എത്യോപ്യക്കാരനായ ഒരു മനുഷ്യൻ
  rationale: ἀνήρ എന്ന പദത്തിലെ പുരുഷലിംഗസൂചനയും Αἰθίοψ എന്ന ജനവിഭാഗസൂചനയും രണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: εὐνοῦχος
  choice: ഷണ്ഡൻ
  rationale: പദത്തിന്റെ പ്രാഥമികവും ഈ സന്ദർഭത്തിൽ സാധ്യതയേറിയതുമായ അക്ഷരാർഥം സ്വീകരിക്കുന്നു; ‘കൊട്ടാര ഉദ്യോഗസ്ഥൻ’ എന്ന വിശാലാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δυνάστης
  choice: ഉന്നത ഉദ്യോഗസ്ഥൻ
  rationale: അധികാരവും ഉയർന്ന പദവിയും സൂചിപ്പിക്കുമ്പോഴും സ്വതന്ത്ര ഭരണാധികാരിയെന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: എത്യോപ്യക്കാരുടെ രാജ്ഞിയായ കന്ദക്കെയുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചന ജനനാമവും പേരിന്റെ/പദവിയുടെ ലിപ്യന്തരണവും സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: അവളുടെ സകല ഭണ്ഡാരത്തിന്റെയും ചുമതലക്കാരൻ
  rationale: ἐπί സൂചിപ്പിക്കുന്ന ഭരണച്ചുമതലയും γάζα സൂചിപ്പിക്കുന്ന രാജഭണ്ഡാരവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: ആരാധിക്കാനായി അയാൾ യെരൂശലേമിൽ വന്നിരുന്നു
  rationale: പൂർവകാലസമ്പൂർണ ക്രിയയുടെ മുൻകാലബന്ധവും ഭാവികൃദന്തത്തിന്റെ ഉദ്ദേശ്യാർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: εὐνοῦχος എന്നത് ശരീരാവസ്ഥയെ സൂചിപ്പിക്കുന്ന ‘ഷണ്ഡൻ’ എന്നോ പൊതുവായ ‘കൊട്ടാര ഉദ്യോഗസ്ഥൻ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: പ്രധാനപാഠത്തിൽ ‘ഷണ്ഡൻ’
  alternative: കൊട്ടാര ഉദ്യോഗസ്ഥൻ
  rationale: അക്ഷരാർഥമാണ് പദത്തിന്റെ പ്രാഥമിക അർഥം; കൂടാതെ δυνάστης ഇതിനകം അയാളുടെ ഔദ്യോഗിക പദവി വ്യക്തമാക്കുന്നു. അതിനാൽ εὐνοῦχος കൂടി പൊതുവായ ഉദ്യോഗസ്ഥപദമായി മാറ്റുന്നത് ഉറവിടത്തിലെ സാമൂഹികവും ശാരീരികവുമായ സൂചന നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യം വ്യക്തതയ്ക്കായി മൂന്ന് മലയാള വാക്യങ്ങളാക്കി; ‘ഇതാ’ എന്ന ആഖ്യാനശൈലിയും മുഖ്യമായ ഉറവിടസൂചനകളും നിലനിർത്തി.
