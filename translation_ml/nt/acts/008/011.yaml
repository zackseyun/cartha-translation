revisions:
- from: അവർ വളരെക്കാലമായി അവന്റെ മാന്ത്രികവിദ്യകളാൽ വിസ്മയിച്ചുപോയിരുന്നതിനാൽ അവനെ ശ്രദ്ധിച്ചുപോന്നു.[a][b]
  to: അവൻ ഗണ്യമായ കാലമായി തന്റെ മാന്ത്രികവിദ്യകളാൽ അവരെ വിസ്മയിപ്പിച്ചിരുന്നതിനാൽ, അവർ അവനെ ശ്രദ്ധിച്ചുപോന്നു.[a][b]
