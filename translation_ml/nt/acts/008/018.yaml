  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: ml
  text: എന്നാൽ അപ്പൊസ്തലന്മാരുടെ കൈവെക്കലിലൂടെ ആത്മാവ്[a] നൽകപ്പെടുന്നതു ശിമോൻ കണ്ടപ്പോൾ, അവൻ അവർക്കു പണം വാഗ്ദാനം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “പരിശുദ്ധാത്മാവ്.” ഗ്രീക്ക് പാഠത്തിൽ “ആത്മാവ്” എന്നു മാത്രമാണുള്ളത്; എന്നാൽ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് പരിശുദ്ധാത്മാവിനെയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: കണ്ടപ്പോൾ
  rationale: ὁράω എന്ന ക്രിയയുടെ aorist participle ഇവിടെ കാലസംബന്ധമായി പ്രവർത്തിക്കുന്നു; ശിമോൻ കണ്ടതിനു പിന്നാലെ നടത്തിയ പ്രവൃത്തിയുടെ ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് ശിമോന്റെ പ്രതികരണത്തിലേക്കുള്ള നേരിയ മാറ്റമോ വൈരുധ്യമോ δέ സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν
  choice: കൈകൾ വെച്ചതിലൂടെ
  rationale: Genitive-നോടുകൂടിയ διά മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദപ്രയോഗത്തോട് അടുത്തതുമായ രൂപമാണിത്.
- source_word: τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാർ
  rationale: കൈകൾ വെക്കുന്നവർ അപ്പൊസ്തലന്മാരാണെന്ന genitive ബന്ധം മലയാളവാക്യഘടനയിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: δίδοται
  choice: നൽകപ്പെടുന്നതു
  rationale: വർത്തമാനകാല passive രൂപത്തിന്റെ പ്രവർത്തനവിധി നിലനിർത്തുന്നു; ‘കണ്ടപ്പോൾ’ എന്ന narrative ഘടനയിൽ മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: ഗ്രീക്കിൽ ഉള്ള ചുരുക്കരൂപം അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശ്യമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: προσήνεγκεν
  choice: വാഗ്ദാനം ചെയ്തു
  rationale: ഈ സന്ദർഭത്തിൽ προσφέρω പണം നൽകാമെന്ന് മുന്നോട്ടുവയ്ക്കുക എന്ന അർഥത്തിലാണ്; ‘വാഗ്ദാനം ചെയ്തു’ ശിമോന്റെ നിർദേശത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: പണം ആരോടാണ് വാഗ്ദാനം ചെയ്തതെന്ന് പരോക്ഷകർമമായി വ്യക്തമായി രേഖപ്പെടുത്തുന്നു.
- source_word: χρήματα
  choice: പണം
  rationale: χρήματα എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ നേരിട്ടും സാധാരണവുമായ മലയാളപരിഭാഷ.
theological_decisions:
- issue: τὸ πνεῦμα എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ആത്മാവ്’; സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവ്
  alternative: ‘പരിശുദ്ധാത്മാവ്’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: മൂലപാഠം ‘ആത്മാവ്’ എന്നു മാത്രമാണ് പറയുന്നത്; എന്നാൽ തൊട്ടുമുമ്പുള്ള സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യപാഠം മൂലരൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ആത്മാവിനെ നൽകുന്നതിലെ പ്രവർത്തകത്വം
  choice: ‘അപ്പൊസ്തലന്മാർ കൈകൾ വെച്ചതിലൂടെ ആത്മാവ് നൽകപ്പെടുന്നു’ എന്ന passive-ഉം മാർഗസൂചനയും നിലനിർത്തുക
  alternative: അപ്പൊസ്തലന്മാർ ആത്മാവിനെ നൽകി എന്ന സജീവരൂപം
  rationale: വാക്യം കൈവെക്കലിനെ മാർഗമായി അവതരിപ്പിക്കുന്നു; അപ്പൊസ്തലന്മാരെ ആത്മാവിന്റെ അന്തിമ ഉറവിടമായി നിർവചിക്കുന്നില്ല. അതിനാൽ വാക്യത്തിനപ്പുറമുള്ള കൂദാശാപരമോ കൂദാശാവിരുദ്ധമോ ആയ നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘കൈവെക്കൽ’ എന്ന നാമരൂപത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന ‘കൈകൾ വെച്ചതിലൂടെ’ തിരഞ്ഞെടുത്തു; ഗ്രീക്കിലെ passive രൂപവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
