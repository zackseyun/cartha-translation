  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: ml
  text: അവർ ഇറങ്ങിച്ചെന്ന്, അവർക്ക് പരിശുദ്ധാത്മാവ് ലഭിക്കേണ്ടതിന് അവർക്കുവേണ്ടി പ്രാർഥിച്ചു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇറങ്ങിച്ചെന്നശേഷം’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർ ഇറങ്ങിച്ചെന്നശേഷം അവർക്കുവേണ്ടി പ്രാർഥിച്ചു’.
    reason: previous_rendering
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിലെ പത്രോസിനെയും യോഹന്നാനെയും സൂചിപ്പിക്കുന്ന ബന്ധവാക്യമാണ്; മലയാളത്തിൽ സ്വതന്ത്ര വാക്യമായി ‘അവർ’ എന്നു തുടങ്ങുന്നത് സ്വാഭാവികമാണ്.
- source_word: καταβάντες
  choice: അവിടെ ഇറങ്ങിച്ചെന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ ചലനത്തെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. സന്ദർഭത്തിൽ സമര്യയിലേക്കുള്ള യാത്രയാണെന്നതിനാൽ ‘അവിടെ’ സ്വാഭാവികമായ സന്ദർഭസൂചന നൽകുന്നു; ‘ഇറങ്ങിച്ചെന്ന്’ ഭൂമിശാസ്ത്രപരമായ ഇറക്കവും തുടർന്നുള്ള പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: προσηύξαντο
  choice: പ്രാർഥിച്ചു
  rationale: പ്രσεύχομαι എന്ന ക്രിയയുടെ സാധാരണ അർഥം നേരിട്ട്, സ്വാഭാവികമായി നൽകുന്നു.
- source_word: περὶ αὐτῶν
  choice: അവർക്കുവേണ്ടി
  rationale: പ്രാർഥനയുടെ പശ്ചാത്തലത്തിൽ περί + genitive അവരുടെ നന്മയ്ക്കായുള്ള മധ്യസ്ഥപ്രാർഥനയെ സൂചിപ്പിക്കുന്നു.
- source_word: ὅπως
  choice: ലഭിക്കേണ്ടതിന്
  rationale: പ്രാർഥനയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ὅπως-ന്റെ purposive force മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λάβωσιν
  choice: ലഭിക്കേണ്ടതിന്
  rationale: ὅπως-നോടു ചേർന്ന aorist subjunctive-ന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിലെ infinitival purpose construction വഴി നൽകുന്നു; അനാവശ്യമായ അനിശ്ചിതത്വം ചേർക്കുന്നില്ല.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളുടെ ഈ സന്ദർഭത്തിൽ ദൈവിക പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശ്യം. മലയാളത്തിലെ നിർണിത വ്യക്തിപരമായ പരാമർശത്തിന് ഈ രൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: πνεῦμα ἅγιον എന്നത് പൊതുവായ ഒരു ‘വിശുദ്ധ ആത്മാവ്’ എന്നോ ദൈവിക പരിശുദ്ധാത്മാവ് എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: പരിശുദ്ധാത്മാവിനെ
  alternative: ഒരു വിശുദ്ധാത്മാവിനെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ അടുത്ത സന്ദർഭം വിശ്വാസികൾക്ക് നൽകപ്പെടുന്ന ദൈവിക ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ വ്യക്തിപരമായ ദൈവിക സൂചന നിലനിർത്തുന്നു; വാക്യത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇറങ്ങിച്ചെന്ന്’ എന്ന പ്രയോഗം participle-നെയും പ്രധാനക്രിയയെയും ഒഴുക്കോടെ ബന്ധിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
