source:
  edition: SBLGNT
  text: συνεκόμισαν δὲ τὸν Στέφανον ἄνδρες εὐλαβεῖς καὶ ⸀ἐποίησαν κοπετὸν μέγαν ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: ml
  text: എന്നാൽ ഭക്തരായ പുരുഷന്മാർ സ്തെഫാനൊസിനെ സംസ്കരിച്ചു[a]; അവനെച്ചൊല്ലി അവർ വലിയ വിലാപം നടത്തി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്തെഫാനൊസിന്റെ മൃതദേഹം സംസ്കാരത്തിനായി ഒരുക്കി’ അല്ലെങ്കിൽ ‘സംസ്കരിക്കാനായി സ്തെഫാനൊസിന്റെ മൃതദേഹം എടുത്തുകൊണ്ടുപോയി’; ഗ്രീക്ക് ക്രിയയ്ക്ക് സംസ്കാരത്തോടൊപ്പം മൃതദേഹം കൈകാര്യം ചെയ്തതിനും ഊന്നൽ നൽകാനാകും.
    reason: lexical_alternative
  - marker: b
    text: ‘വലിയ വിലാപം’ എന്നത് ഉള്ളിലെ ദുഃഖം മാത്രമല്ല, ശബ്ദത്തോടെയും പരസ്യമായും പ്രകടിപ്പിച്ച ദുഃഖാചരണവും ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: സംസ്കരിച്ചു
  rationale: സന്ദർഭത്തിൽ ഈ ക്രിയ സ്തെഫാനൊസിന്റെ മൃതദേഹം കൈകാര്യം ചെയ്ത് സംസ്കരിച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സംസ്കരിച്ചു’ സ്വാഭാവികമായി പ്രവർത്തിയുടെ അന്തിമഫലം വ്യക്തമാക്കുന്നു; മൃതദേഹം ഒരുക്കുകയോ എടുത്തുകൊണ്ടുപോകുകയോ ചെയ്തെന്ന ക്രിയയുടെ സാധ്യതാപരമായ ഊന്നൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ലഘുവായ വൈരുധ്യവും ആഖ്യാനമാറ്റവും സൂചിപ്പിക്കാൻ ‘എന്നാൽ’ അനുയോജ്യമാണ്.
- source_word: ἄνδρες εὐλαβεῖς
  choice: ഭക്തരായ പുരുഷന്മാർ
  rationale: ἄνδρες എന്ന പദത്തിന്റെ പുരുഷലിംഗസൂചന ‘പുരുഷന്മാർ’ നിലനിർത്തുന്നു; εὐλαβεῖς എന്നത് ദൈവഭക്തിയും ആദരഭാവവും സൂചിപ്പിക്കുന്നതിനാൽ ‘ഭക്തരായ’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ἐποίησαν
  choice: അവർ ... വിലപിച്ചു
  rationale: കൊπετόν എന്ന നാമത്തോടൊപ്പം ഇത് ഒരു ലഘുക്രിയാപ്രയോഗമാണ്. മലയാളത്തിൽ നാമപ്രയോഗം അക്ഷരാർഥത്തിൽ പകർത്തുന്നതിനെക്കാൾ ‘വിലപിച്ചു’ എന്ന ക്രിയാരൂപം സ്വാഭാവികമാണ്.
- source_word: κοπετὸν μέγαν
  choice: അത്യന്തം വിലപിച്ചു
  rationale: കൊπετός പൊതുവേ പുറമേ പ്രകടമാകുന്ന വിലാപത്തെയും ദുഃഖാചരണത്തെയും സൂചിപ്പിക്കുന്നു; μέγαν നൽകുന്ന തീവ്രത ‘അത്യന്തം’ വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ αὐτῷ
  choice: അവനെച്ചൊല്ലി
  rationale: വിലാപഭാഷയിൽ ἐπί കൂടെ ദത്തിവ് ആ വ്യക്തിയെക്കുറിച്ചോ അയാളെപ്രതിയോ ഉള്ള വിലാപത്തെ സൂചിപ്പിക്കുന്നു. ‘അവനെച്ചൊല്ലി’ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഉറവിടത്തിലെ പുരുഷലിംഗസൂചനയും വിലാപത്തിന്റെ ബാഹ്യപ്രകടനസാധ്യതയും നിലനിർത്തിയിരിക്കുന്നു.
