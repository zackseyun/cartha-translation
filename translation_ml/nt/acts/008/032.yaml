id: ACT.8.32
reference: Acts 8:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: ml
  text: 'അവൻ വായിച്ചുകൊണ്ടിരുന്ന തിരുവെഴുത്തിലെ ഭാഗം ഇതായിരുന്നു: “അറുക്കപ്പെടാൻ ഒരു ചെമ്മരിയാടിനെപ്പോലെ അവൻ നയിക്കപ്പെട്ടു[a]; രോമം കത്രിക്കുന്നവന്റെ മുമ്പിൽ മിണ്ടാതിരിക്കുന്ന കുഞ്ഞാടിനെപ്പോലെ[b], അവൻ തന്റെ വായ് തുറക്കുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അറവിലേക്കു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “കത്രിക്കുന്നവന്റെ മുമ്പിൽ”; ഗ്രീക്കിൽ അക്ഷരാർഥം “അതിനെ കത്രിക്കുന്നവന്റെ മുമ്പിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: തിരുവെഴുത്തിലെ ഭാഗം
  rationale: ഇവിടെ περιοχή എന്നത് വായിച്ചുകൊണ്ടിരുന്ന തിരുവെഴുത്തിന്റെ ഒരു നിർദിഷ്ട ഭാഗത്തെ സൂചിപ്പിക്കുന്നു. ‘തിരുവെഴുത്തിലെ ഭാഗം’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνεγίνωσκεν
  choice: വായിച്ചുകൊണ്ടിരുന്ന
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തി ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: Ὡς πρόβατον
  choice: ഒരു ചെമ്മരിയാടിനെപ്പോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന ഉപമ നിലനിർത്തുന്നു; πρόβατον എന്ന പൊതുവായ ‘sheep’ എന്ന അർഥം കുഞ്ഞാടിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ σφαγὴν
  choice: അറുക്കപ്പെടാൻ
  rationale: അറവിലേക്കുള്ള നീക്കവും ഉദ്ദേശ്യവും സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; ‘അറവിലേക്കു’ എന്ന സ്ഥലദിശാസൂചക രൂപവും സാധ്യമാണ്.
- source_word: ἤχθη
  choice: നയിക്കപ്പെട്ടു
  rationale: ἄγω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തി, ബലിമൃഗത്തെ കൊണ്ടുപോകുന്ന ദൃശ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἀμνὸς
  choice: കുഞ്ഞാട്
  rationale: ἀμνός പ്രത്യേകമായി കുഞ്ഞാടിനെ സൂചിപ്പിക്കുന്നു; πρόβατον എന്ന പദവുമായുള്ള മൂലപാഠത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു.
- source_word: κείραντος
  choice: രോമം കത്രിക്കുന്നവൻ
  rationale: പങ്കെടുക്കുന്ന വ്യക്തിയെ മാത്രം ‘കത്രിക്കുന്നവൻ’ എന്നു പറയുന്നതിനെക്കാൾ, സന്ദർഭത്തിലെ ആടിന്റെ രോമം കത്രിക്കുന്ന പ്രവൃത്തി മലയാളവായനക്കാരന് വ്യക്തമായി നൽകുന്നു.
- source_word: ἄφωνος
  choice: മിണ്ടാതിരിക്കുന്ന
  rationale: അക്ഷരാർഥത്തിലെ ‘ശബ്ദമില്ലാത്ത’ എന്ന ആശയം ഉപമയുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: അവൻ തന്റെ വായ് തുറക്കുന്നില്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം നിലനിർത്തി, ഉദ്ധരണിയിലെ സജീവമായ തിരുവെഴുത്തുശൈലി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാവ് 53-ലെ ഉദ്ധരണിയുടെ ക്രിസ്തുസംബന്ധമായ പ്രയോഗം
  choice: വാക്യത്തിലെ ഉപമ അതേ രൂപത്തിൽ നിലനിർത്തി; ഇവിടെ തന്നെ യേശുവിനെ പേരെടുത്ത് തിരിച്ചറിയുന്ന വ്യാഖ്യാനം ചേർത്തില്ല.
  alternative: ‘യേശു’ അല്ലെങ്കിൽ ‘കഷ്ടം അനുഭവിക്കുന്ന ദാസൻ’ എന്ന് വാക്യത്തിനുള്ളിൽ വ്യക്തമാക്കുക.
  rationale: തുടർന്നുള്ള സന്ദർഭം ഈ വചനത്തെ യേശുവിനോട് ബന്ധിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം ഉദ്ധരണി മാത്രമാണ് അവതരിപ്പിക്കുന്നത്. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പുരോഗതിയും കഥാസന്ദർഭത്തിലെ തിരിച്ചറിയലും മുൻകൂട്ടി പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ഉദ്ധരണിയുടെ കാവ്യാത്മക സമാന്തരഘടനയും ‘ചെമ്മരിയാട്/കുഞ്ഞാട്’ എന്ന പദവ്യത്യാസവും നിലനിർത്തി. മൂലപാഠത്തിൽ ഇല്ലാത്ത ആരംഭകാലസൂചകമോ വ്യാഖ്യാനപരമായ ബന്ധകമോ ചേർത്തിട്ടില്ല.
