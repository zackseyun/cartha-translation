  terminology: “ആത്മാവ്” properly preserves the Greek’s lack of the adjective “holy,” while remaining contextually appropriate in Acts. “രഥം” is an established and natural rendering of ἅρμα. The name form “ഫിലിപ്പോസ്” is intelligible and acceptable.
