id: ACT.8.29
reference: Acts 8:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ· Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: ml
  text: 'അപ്പോൾ ആത്മാവ് ഫിലിപ്പോസിനോടു പറഞ്ഞു: “ഈ രഥത്തെ സമീപിച്ച് അതിനോടു ചേർന്നുനിൽക്കുക[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അതിനോടു ചേർന്നുനിൽക്കുക” എന്നത് “അതിന്റെ തൊട്ടടുത്തുതന്നെ നിൽക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: κολλήθητι എന്ന പദത്തിന് ചേർന്നിരിക്കുക, അടുത്തുതന്നെ നിൽക്കുക എന്നീ അർത്ഥനിറങ്ങളുണ്ട്.
lexical_decisions:
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകൾ അവതരിപ്പിക്കുന്ന ആഖ്യാനത്തിൽ λέγω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപത്തിന് സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, സംഭവപരമ്പരയിലെ അടുത്ത ഘട്ടമാണ് δέ സൂചിപ്പിക്കുന്നത്.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: ഗ്രീക്കിൽ ἅγιον ഇല്ലാത്തതിനാൽ ‘പരിശുദ്ധാത്മാവ്’ എന്നു വികസിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; പ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ ദൈവാത്മാവാണ് ഉദ്ദേശിക്കപ്പെടുന്നത്.
- source_word: τῷ Φιλίππῳ
  choice: ഫിലിപ്പോസിനോടു
  rationale: ആരോടാണ് പറഞ്ഞതെന്ന ദത്തിവ് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; Φίλιππος എന്ന പേരിന്റെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: Πρόσελθε
  choice: സമീപിച്ച്
  rationale: രഥത്തിന്റെ അടുത്തേക്കു നീങ്ങാനുള്ള കൽപ്പനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κολλήθητι
  choice: ചേർന്നുനിൽക്കുക
  rationale: κολλάομαι സൂചിപ്പിക്കുന്ന അടുത്തു ചേർന്നിരിക്കൽ ഇവിടെ ചലിച്ചുകൊണ്ടിരിക്കുന്ന രഥത്തോടൊപ്പം അടുത്തായി നിൽക്കുകയോ നീങ്ങുകയോ ചെയ്യുന്ന ആശയം ഉൾക്കൊള്ളുന്നു.
- source_word: τῷ ἅρματι τούτῳ
  choice: ഈ രഥത്തെ / അതിനോടു
  rationale: ἅρμα എന്നത് സന്ദർഭോചിതമായി ‘രഥം’ എന്നും τούτῳ എന്ന സമീപസൂചക സർവനാമം ‘ഈ’ എന്നും പരിഭാഷപ്പെടുത്തി; ആവർത്തനം ഒഴിവാക്കാൻ രണ്ടാം പരാമർശത്തിൽ ‘അതിനോടു’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: τὸ πνεῦμα എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ‘ആത്മാവ്’ ദൈവത്തിന്റെ ആത്മാവിനെ, അഥവാ പരിശുദ്ധാത്മാവിനെ, സൂചിപ്പിക്കുന്നു
  alternative: വ്യക്തമായി നിർവചിക്കാത്ത ഒരു ആത്മീയ പ്രേരണ
  rationale: പ്രവൃത്തികളുടെ പുസ്തകത്തിൽ വിശ്വാസികൾക്ക് ദൈവിക നിർദേശം നൽകുന്ന ‘ആത്മാവ്’ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ആവർത്തിത പ്രയോഗമാണ്. എന്നാൽ മൂലപാഠത്തിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ പരിഭാഷ അതു ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘സമീപിച്ച്’ എന്നത് മാന്യമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു; ‘ചേർന്നുനിൽക്കുക’ മൂലപദത്തിന്റെ അടുത്ത ബന്ധവും തുടർച്ചയായ സമീപത്വവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
