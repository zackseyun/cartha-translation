  source_fidelity: 'The Malayalam accurately reflects the narrative progression (δέ), the unexpanded "the Spirit" (τὸ πνεῦμα), Philip as the recipient, and the two imperatives: approaching and maintaining close association with the chariot. “ചേർന്നുനിൽക്കുക” appropriately conveys the contextual sense of κολλήθητι without implying that Philip must enter the vehicle.'
