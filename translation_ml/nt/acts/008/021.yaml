id: ACT.8.21
reference: Acts 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: ml
  text: ഈ കാര്യത്തിൽ നിനക്കു പങ്കോ അവകാശമോ ഇല്ല; കാരണം നിന്റെ ഹൃദയം ദൈവത്തിന്റെ മുമ്പാകെ നേരുള്ളതല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς
  choice: പങ്ക്
  rationale: ഒരു കാര്യത്തിലുള്ള പങ്കാളിത്തം എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κλῆρος
  choice: അവകാശം
  rationale: ‘നറുക്ക്/ഓഹരി’ എന്ന മൂലചിത്രം ഇവിടെ ലഭിക്കുന്ന വിഹിതമോ അവകാശമോ സൂചിപ്പിക്കുന്നു; ‘അവകാശം’ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: ഈ കാര്യത്തിൽ
  rationale: λόγος ഇവിടെ വെറും ‘വാക്ക്’ എന്നതിലുപരി ചർച്ചയിലുള്ള കാര്യം അഥവാ വിഷയം സൂചിപ്പിക്കുന്നു.
- source_word: εὐθεῖα
  choice: നേരുള്ളത്
  rationale: ദൈവത്തിന്റെ മുമ്പിലെ ഹൃദയത്തിന്റെ സത്യസന്ധവും ശരിയായതുമായ നിലയെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: ἔναντι τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മുമ്പാകെ
  rationale: ദൈവത്തിന്റെ ദൃഷ്ടിയിലും സന്നിധിയിലും എന്ന ആശയം ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
theological_decisions:
- issue: ‘പങ്കും അവകാശവും ഇല്ല’ എന്ന പ്രസ്താവനയുടെ പരിധി
  choice: ‘ഈ കാര്യത്തിൽ’ എന്നു പരിമിതപ്പെടുത്തി
  alternative: രക്ഷയിലോ സഭയിലോ യാതൊരു പങ്കുമില്ലെന്ന് വിപുലീകരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ἐν τῷ λόγῳ τούτῳ എന്നു പറഞ്ഞ് നിഷേധത്തെ ഈ വിഷയത്തോട് ബന്ധിപ്പിക്കുന്നു; അതിനപ്പുറമുള്ള സിദ്ധാന്തപരമായ നിഗമനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ഹൃദയത്തിന്റെ അവസ്ഥ
  choice: ‘നേരുള്ളതല്ല’ എന്ന രൂപകഭാഷ നിലനിർത്തി
  alternative: ‘ശരിയല്ല’ അല്ലെങ്കിൽ ‘നിഷ്കളങ്കമല്ല’ എന്നു വ്യാഖ്യാനിക്കുക
  rationale: εὐθεῖα എന്ന പദത്തിലെ ‘നേര്’ എന്ന രൂപകം സംരക്ഷിക്കുകയും അതിന്റെ നൈതിക-ആത്മീയ തീവ്രത വായനക്കാരൻ ഗ്രഹിക്കാൻ വിടുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പങ്കോ അവകാശമോ’ എന്ന ദ്വയം ഗ്രീക്കിലെ μερὶς / κλῆρος വ്യത്യാസം അമിതമായി മിനുക്കാതെ നിലനിർത്തുന്നു.
