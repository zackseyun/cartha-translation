  naturalness: ‘വീടുതോറും കയറി’ സ്വാഭാവികമാണ്. ഒറ്റ വാക്യമായി അർധവിരാമവും ‘വലിച്ചിഴച്ച്’ എന്ന രൂപവും ഉപയോഗിക്കുന്നത് ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ ഒഴുക്കുള്ളതും ഗ്രീക്കിലെ പ്രവർത്തനബന്ധം കൂടുതൽ വ്യക്തവുമാക്കുന്നു.
