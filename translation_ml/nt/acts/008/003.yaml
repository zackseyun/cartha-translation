  to: എന്നാൽ ശൗൽ സഭയെ തകർത്തുകൊണ്ടിരുന്നു[a]; അവൻ വീടുതോറും കയറി[b], പുരുഷന്മാരെയും സ്ത്രീകളെയും വലിച്ചിഴച്ച് തടവിലേൽപ്പിച്ചുകൊണ്ടിരുന്നു.
