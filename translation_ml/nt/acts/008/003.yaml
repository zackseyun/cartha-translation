id: ACT.8.3
reference: Acts 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: ml
  text: എന്നാൽ ശൗൽ സഭയെ തകർത്തുകൊണ്ടിരുന്നു[a]; അവൻ വീടുതോറും കയറി[b], പുരുഷന്മാരെയും സ്ത്രീകളെയും വലിച്ചിഴച്ച് തടവിലേൽപ്പിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘സഭയെ നശിപ്പിച്ചുകൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘സഭയെ പാഴാക്കിക്കൊണ്ടിരുന്നു.’ മൂലപദം സാധാരണ ‘പീഡിപ്പിക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ, വിനാശകരമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഒരു വീട്ടിൽനിന്ന് മറ്റൊരു വീട്ടിലേക്കു കയറി.’ ഗ്രീക്കുപ്രയോഗത്തിന് വിതരണാർഥമുണ്ട്; ‘വീടുതോറും’ എന്നത് പല വീടുകളിലേക്കുള്ള ആവർത്തിച്ചുള്ള പ്രവേശനത്തിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: തകർത്തുകൊണ്ടിരുന്നു
  rationale: ഈ ക്രിയ സാധാരണ ‘പീഡിപ്പിക്കുക’ എന്നതിനെക്കാൾ ശക്തമായി, ക്രൂരമായി നാശം വരുത്തുന്നതിനെയോ തകർത്തുകളയുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. അപൂർണഭൂതകാലരൂപത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനവും മലയാളത്തിലെ ‘-കൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: ἐκκλησίαν
  choice: സഭയെ
  rationale: ഇവിടെ പൗരസമിതിയെയല്ല, യേശുവിൽ വിശ്വസിക്കുന്നവരുടെ സമൂഹത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘സഭ’ അതിന്റെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപമാണ്.
- source_word: κατὰ τοὺς οἴκους
  choice: വീടുതോറും
  rationale: κατάയും ബഹുവചനവും ചേർന്നുള്ള വിതരണാർഥം, പല വീടുകളിലും ആവർത്തിച്ച് കയറിയെന്ന ആശയം, ‘വീടുതോറും’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: εἰσπορευόμενος
  choice: കയറി
  rationale: ശൗൽ സഭയെ തകർത്തിരുന്ന രീതി വിവരിക്കുന്ന പങ്കാളിക്രിയയാണ്; വീടുകളിൽ അകത്തേക്കു പ്രവേശിച്ചതിനെ ‘കയറി’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σύρων
  choice: വലിച്ചിഴച്ചുകൊണ്ടുപോയി
  rationale: σύρω ബലമായി വലിച്ചുകൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. വീടുകളിൽനിന്ന് ആളുകളെ ബലമായി നീക്കിയതെന്ന സന്ദർഭാർഥം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: പുരുഷന്മാരെയും സ്ത്രീകളെയും
  rationale: ലിംഗഭേദമില്ലാതെ ഇരുകൂട്ടരെയും പിടികൂടിയെന്ന ഊന്നൽ ‘-യും … -യും’ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρεδίδου
  choice: തടവിലേൽപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: ഔദ്യോഗിക കാവലിലേക്കോ തടവിലേക്കോ ഏൽപ്പിക്കുന്നതാണിവിടെ ഉദ്ദേശ്യം. ആവർത്തിച്ചുകൊണ്ടിരുന്ന പ്രവർത്തനം ‘-കൊണ്ടിരുന്നു’ നിലനിർത്തുന്നു.
- source_word: εἰς φυλακήν
  choice: തടവിൽ
  rationale: φυλακή ഇവിടെ കാവൽസ്ഥലത്തെയോ തടവിനെയോ സൂചിപ്പിക്കുന്നു; ‘തടവിലേൽപ്പിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: ശൗലിന്റെ സഭാവിരുദ്ധ പ്രവർത്തനത്തിന്റെ തീവ്രത
  choice: ‘സഭയെ തകർത്തുകൊണ്ടിരുന്നു’ എന്ന ശക്തമായ പ്രയോഗം
  alternative: ‘സഭയെ പീഡിപ്പിച്ചുകൊണ്ടിരുന്നു’
  rationale: മൂലത്തിലെ λυμαίνομαι വെറും പൊതുവായ പീഡനത്തേക്കാൾ ശക്തമായ, വിനാശകരമായ ക്രൂരപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. അതേസമയം സഭ പൂർണമായി ഇല്ലാതായെന്ന അർഥം നിർബന്ധമാക്കാതെ അപൂർണഭൂതകാലത്തിലെ തുടർച്ചയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ/ആവർത്തിച്ച പ്രവർത്തനങ്ങളെ ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങൾകൊണ്ട് സൂക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുകളുടെ സ്ഥാനവും ഉള്ളടക്കവും തമ്മിൽ പൊരുത്തക്കേടുണ്ടായിരുന്നതിനാൽ, മൂലഗ്രീക്കിന്റെ അടിസ്ഥാനത്തിൽ [a] λυμαίνομαι-യോടും [b] κατὰ τοὺς οἴκους-യോടും ചേർത്തു.
