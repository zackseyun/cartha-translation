id: ACT.8.36
reference: Acts 8:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: ml
  text: 'അവർ വഴിയിലൂടെ യാത്രചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ, അവർ കുറച്ച് വെള്ളത്തിനരികിലെത്തി. അപ്പോൾ ഷണ്ഡൻ പറയുന്നു: “ഇതാ വെള്ളം! ഞാൻ സ്നാനമേൽക്കുന്നതിന് എന്താണ് തടസ്സം?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: ഷണ്ഡൻ
  rationale: ഉദ്യോഗസ്ഥൻ എന്ന പൊതുവായ പദത്തിലേക്ക് അർഥം ചുരുക്കാതെ, മൂലപദത്തിന്റെ വ്യക്തമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπί τι ὕδωρ
  choice: വെള്ളമുള്ള ഒരു സ്ഥലത്തെത്തി
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘കുറച്ച് വെള്ളത്തിനരികിലെത്തി’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളം; അനിശ്ചിതമായ τιയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: φησιν
  choice: പറയുന്നു
  rationale: മുൻകാല ക്രിയകൾക്കിടയിലെ ഗ്രീക്ക് ചരിത്രവർത്തമാനത്തിന്റെ സജീവമായ കാലമാറ്റം സംരക്ഷിക്കുന്നു.
- source_word: βαπτισθῆναι
  choice: സ്നാനം സ്വീകരിക്കാൻ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സ്നാനത്തിന് തടസ്സമാകുന്ന കാര്യം
  choice: “ഞാൻ സ്നാനം സ്വീകരിക്കാൻ എന്താണ് തടസ്സം?” എന്ന തുറന്ന ചോദ്യം നിലനിർത്തി.
  alternative: തടസ്സമൊന്നുമില്ലെന്നോ വിശ്വാസപ്രഖ്യാപനമാണ് ഏക വ്യവസ്ഥയെന്നോ വിശദീകരിച്ച് ചേർക്കുക.
  rationale: വാക്യം ചോദ്യം മാത്രമാണ് ഉന്നയിക്കുന്നത്; കൈയെഴുത്തുപ്രതികളിൽ പിന്നീട് ചേർന്നതായി കരുതപ്പെടുന്ന 8:37-ലെ ഉള്ളടക്കമോ ഏതെങ്കിലും സഭാപാരമ്പര്യത്തിന്റെ നിബന്ധനയോ ഇവിടെ ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ ചരിത്രവർത്തമാനം ഉദ്ദേശപൂർവം ‘പറയുന്നു’ എന്നു നിലനിർത്തിയിരിക്കുന്നു; ഉദ്ധരണി ലളിതവും നേരിട്ടുമാണ്.
