revisions:
- from: 'അവർ വഴിയിലൂടെ യാത്രചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ വെള്ളമുള്ള ഒരു സ്ഥലത്തെത്തി. അപ്പോൾ ഷണ്ഡൻ പറയുന്നു: “ഇതാ വെള്ളം! ഞാൻ സ്നാനം സ്വീകരിക്കാൻ എന്താണ് തടസ്സം?”'
  to: 'അവർ വഴിയിലൂടെ യാത്രചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ, അവർ കുറച്ച് വെള്ളത്തിനരികിലെത്തി. അപ്പോൾ ഷണ്ഡൻ പറയുന്നു: “ഇതാ വെള്ളം! ഞാൻ സ്നാനമേൽക്കുന്നതിന് എന്താണ് തടസ്സം?”'
  rationale: The revision restores the Greek focus on reaching some water rather than merely a watery location and improves the idiom of the final question. It retains the historical present ('പറയുന്നു'), the explicit designation 'ഷണ്ഡൻ,' and the source’s unanswered, non-doctrinally-expanded question.
