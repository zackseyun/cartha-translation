id: ACT.8.30
reference: Acts 8:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος ⸂Ἠσαΐαν τὸν προφήτην⸃ καὶ εἶπεν· Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: ml
  text: 'അപ്പോൾ ഫിലിപ്പോസ് ഓടിച്ചെന്ന്, അദ്ദേഹം യെശയ്യാ പ്രവാചകന്റെ പുസ്തകം വായിക്കുന്നതു കേട്ടു. ഫിലിപ്പോസ് ചോദിച്ചു: “താങ്കൾ വായിക്കുന്നത് ശരിക്കും മനസ്സിലാകുന്നുണ്ടോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “താങ്കൾ വായിക്കുന്നത് വാസ്തവത്തിൽ മനസ്സിലാകുന്നുണ്ടോ?” ഗ്രീക്കിലെ ചോദ്യകണങ്ങൾ ഫിലിപ്പോസിന്റെ ചോദ്യത്തിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: ഓടിച്ചെന്ന്
  rationale: ഫിലിപ്പോസ് രഥത്തിന്റെ അടുത്തേക്ക് വേഗത്തിൽ നീങ്ങിയെന്ന προστρέχω എന്ന ക്രിയയുടെ സജീവത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ ആഖ്യാനപുരോഗതി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: അദ്ദേഹം ... വായിക്കുന്നതു കേട്ടു
  rationale: ἀκούω + ജനിറ്റീവ് കർത്താവ് + വർത്തമാന കൃദന്തം എന്ന ഘടന, വായിച്ചുകൊണ്ടിരുന്ന ആളെ ഫിലിപ്പോസ് കേട്ടുവെന്ന ആശയം നൽകുന്നു. ശബ്ദിച്ചാണ് വായിച്ചതെന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും മൂലപാഠത്തിൽ പ്രത്യേകം പറഞ്ഞിട്ടില്ല.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: യെശയ്യാ പ്രവാചകന്റെ പുസ്തകം
  rationale: ഗ്രീക്കിൽ ‘യെശയ്യാ പ്രവാചകനെ വായിക്കുന്നു’ എന്നത് പ്രവാചകന്റെ രചന വായിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ലഘുപ്രയോഗമാണ്; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘പുസ്തകം’ വ്യക്തമാക്കി ചേർത്തു.
- source_word: εἶπεν
  choice: ചോദിച്ചു
  rationale: λέγω അടിസ്ഥാനമായി ‘പറഞ്ഞു’ എന്നാണെങ്കിലും തുടർന്നുള്ള നേരിട്ടുള്ള ചോദ്യം കണക്കിലെടുത്ത് മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സംഭാഷണപ്രവർത്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Ἆρά γε
  choice: ശരിക്കും ... ഉണ്ടോ
  rationale: ἆρα γε ചോദ്യത്തിന് നൽകുന്ന ഊന്നലും അന്വേഷണാത്മക ഭാവവും ആധുനിക മലയാളത്തിൽ ‘ശരിക്കും’ എന്ന പദം പ്രകടമാക്കുന്നു.
- source_word: γινώσκεις
  choice: മനസ്സിലാകുന്നുണ്ടോ
  rationale: ഇവിടെ γινώσκω വായിക്കുന്നതിന്റെ അർഥം ഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; വെറും അറിയുക എന്നതിലുപരി ‘മനസ്സിലാകുക’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἃ ἀναγινώσκεις
  choice: താങ്കൾ വായിക്കുന്നത്
  rationale: ἃ വായിക്കപ്പെടുന്ന ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വർത്തമാനകാല പ്രവർത്തനം മലയാളത്തിലെ ഈ രൂപം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
