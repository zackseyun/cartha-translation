translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. എത്യോപ്യക്കാരനെ പരാമർശിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം/താങ്കൾ’ ഉപയോഗിച്ചു. മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്ന ‘പുസ്തകം’ ഗ്രീക്കിലെ സ്വാഭാവിക ലഘുപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
