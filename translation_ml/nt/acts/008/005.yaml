source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: ml
  text: ഫിലിപ്പോസ് ശമര്യയിലെ പട്ടണത്തിലേക്ക്[a][b] ഇറങ്ങിച്ചെന്ന് മശീഹാവിനെ അവരോടു പ്രഖ്യാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ശമര്യയിലെ ഒരു പട്ടണത്തിലേക്ക്.’ ഗ്രീക്ക് പ്രയോഗം ശമര്യാ പ്രദേശത്തെ ഒരു പ്രത്യേക പട്ടണത്തെയോ, പൊതുവേ ആ പ്രദേശത്തിലെ ഒരു പട്ടണത്തെയോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ശമര്യാ പട്ടണത്തിലേക്ക്.’
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് വിവരണത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: κατελθὼν
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ദിശാസൂചന നിലനിർത്തിക്കൊണ്ട്, പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധ പ്രവർത്തനമായി aorist participle-നെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: ശമര്യയിലെ പട്ടണത്തിലേക്ക്
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടതയും ‘ശമര്യയുടെ/ശമര്യയിലെ’ എന്ന genitive ബന്ധവും പിന്തുടരുന്നു. ഇത് ശമര്യാ പ്രദേശത്തെ ഒരു പ്രത്യേക പട്ടണമാണോ ‘ശമര്യാ പട്ടണം’ തന്നെയാണോ എന്ന സാദ്ധ്യമായ അർത്ഥവ്യത്യാസം അടിക്കുറിപ്പുകളിൽ തുറന്നുവെക്കുന്നു.
- source_word: ἐκήρυσσεν
  choice: പ്രസംഗിച്ചു
  rationale: പരസ്യമായി പ്രഖ്യാപിക്കുക എന്ന κηρύσσωയുടെ ആശയം സാധാരണ വായനക്കാർക്കു സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരോട്
  rationale: ഫിലിപ്പോസിന്റെ പ്രഖ്യാപനം ആരോടായിരുന്നു എന്നു സൂചിപ്പിക്കുന്ന dative pronoun-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: τὸν χριστόν
  choice: മശീഹായെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമംപോലെയല്ല, അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ യഹൂദ മശീഹാ പശ്ചാത്തലം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു / ക്രിസ്തുവിനെ
  rationale: പ്രഖ്യാപനസന്ദർഭത്തിലും നിർദിഷ്ട article-നോടുകൂടിയും ഈ പദം സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതുകൊണ്ട് പാരമ്പര്യ ലിപ്യന്തരണത്തേക്കാൾ ‘മശീഹാ’ എന്നത് മൂലപദത്തിന്റെ യഹൂദ പ്രതീക്ഷാഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വിവരണശൈലി. ‘ഇറങ്ങിച്ചെന്ന്’ ദിശയും സംഭവക്രമവും സ്വാഭാവികമായി നൽകുന്നു; ‘മശീഹാ’ സ്ഥാനപ്പേരായി നിലനിർത്തിയിരിക്കുന്നു. പട്ടണത്തിന്റെ തിരിച്ചറിയലിലുള്ള യഥാർത്ഥ അനിശ്ചിതത്വം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
