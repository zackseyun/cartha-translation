source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: ml
  text: ശിമോൻ എന്നു പേരുള്ള ഒരു മനുഷ്യൻ അതിനു മുമ്പേ ആ നഗരത്തിൽ മന്ത്രവിദ്യ പ്രയോഗിച്ചും[a] ശമര്യയിലെ ജനങ്ങളെ വിസ്മയിപ്പിച്ചും, താൻ മഹാനായ ഒരാളാണെന്ന് പറഞ്ഞും[b] അവിടെ ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാന്ത്രികവിദ്യ അഭ്യസിച്ചും.’ ഗ്രീക്ക് ക്രിയ മാന്ത്രികകലകളിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘താൻ വലിയ ആരോ ആണെന്ന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: എന്നാൽ ... ഒരു മനുഷ്യൻ
  rationale: Ἀνήρ എന്നതിന്റെ പുരുഷലിംഗസൂചന നിലനിർത്താൻ ‘മനുഷ്യൻ’ ഉപയോഗിച്ചു; τις അനിശ്ചിതത്വം നൽകുന്നു. δέ-യുടെ മൃദുവായ സന്ദർഭമാറ്റം ‘എന്നാൽ’കൊണ്ട് സൂചിപ്പിച്ചു, സമയാർഥമുള്ള ‘ഇപ്പോൾ’ ചേർത്തില്ല.
- source_word: ὀνόματι Σίμων
  choice: ശിമോൻ എന്നു പേരുള്ള
  rationale: പേരിനെ വിവർത്തനം ചെയ്യാതെ മലയാളത്തിലെ പതിവായ ബൈബിൾ ലിപ്യന്തരണം ഉപയോഗിച്ചു; ദത്തിവ് പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: προϋπῆρχεν
  choice: അതിനുമുമ്പേ ... പറഞ്ഞുവന്നിരുന്നു
  rationale: തൊട്ടുമുമ്പ് വിവരിച്ച സംഭവങ്ങൾക്കു മുൻപേ തുടങ്ങിയ നിലയെയും അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയെയും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ πόλει
  choice: ആ നഗരത്തിൽ
  rationale: നിശ്ചയാർഥക ലേഖനം സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച നഗരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആ നഗരം’ സ്വാഭാവികമാണ്.
- source_word: μαγεύων
  choice: മന്ത്രവിദ്യ പ്രയോഗിച്ചും
  rationale: μαγεύω മാന്ത്രികകലകളിൽ ഏർപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘മന്ത്രവിദ്യ’ അർഥം വ്യക്തമാക്കുന്നു; വാക്യം പറയാത്ത അതിഭൗതിക ഉറവിടമോ വഞ്ചനയോ ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: ἐξιστάνων
  choice: വിസ്മയിപ്പിച്ചുംകൊണ്ട്
  rationale: ക്രിയയുടെ കാരകാർഥമായ ‘അതിശയിപ്പിക്കുക/വിസ്മയിപ്പിക്കുക’യും പങ്കാളിക്രിയയുടെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: ശമര്യയിലെ ജനങ്ങളെ
  rationale: ഇവിടെ ἔθνος രാഷ്ട്രീയമായ ‘രാഷ്ട്രം’ എന്നതിലുപരി ഒരു പ്രദേശത്തെ ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λέγων
  choice: പറഞ്ഞുവന്നിരുന്നു
  rationale: പതിവായോ തുടർച്ചയായോ നടന്ന സ്വയംപ്രഖ്യാപനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവകാശപ്പെട്ടു’ എന്ന വ്യാഖ്യാനാത്മക ശക്തി ചേർത്തിട്ടില്ല.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: താൻ ഒരു മഹാൻ ആണെന്ന്
  rationale: ἑαυτόν എന്ന സ്വയംസൂചന ‘താൻ’കൊണ്ട് നിലനിർത്തുന്നു; τινα ... μέγαν എന്നത് പദവിയോ സ്വഭാവമോ നിർണ്ണയിക്കാതെ ‘ഒരു മഹാൻ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ശിമോന്റെ പ്രവർത്തനത്തിന്റെ സ്വഭാവനിർണ്ണയം
  choice: ‘മന്ത്രവിദ്യ പ്രയോഗിച്ചു’ എന്ന് വിവർത്തനം ചെയ്തു
  alternative: ‘ആഭിചാരം ചെയ്തു’ / ‘ദുഷ്ടാത്മശക്തിയാൽ പ്രവർത്തിച്ചു’
  rationale: വാക്യം മാന്ത്രികകലകളിലെ പ്രവർത്തനത്തെ മാത്രം വ്യക്തമാക്കുന്നു; അതിന്റെ അതിഭൗതിക ഉറവിടത്തെയോ അത് വെറും വഞ്ചനയായിരുന്നോയെന്നോ നിർണ്ണയിക്കുന്നില്ല.
- issue: ശിമോന്റെ സ്വയംപ്രഖ്യാപനം
  choice: ‘താൻ ഒരു മഹാൻ ആണെന്ന്’
  alternative: ‘താൻ മഹാശക്തിയുള്ളവനാണെന്ന്’
  rationale: μέγαν മഹത്ത്വമോ പ്രാധാന്യമോ സൂചിപ്പിക്കാം; ‘ശക്തിയുള്ളവൻ’ എന്നു പറയുന്നത് പിന്നാലെയുള്ള വാക്യത്തിലെ ആശയം ഇവിടെ മുൻകൂട്ടി ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ പങ്കാളിക്രിയകളുടെ തുടർച്ച ‘-ച്ചും ... -ച്ചുംകൊണ്ട്’ എന്ന ഘടനയിലും പ്രധാനക്രിയയുടെ അപൂർണ്ണഭൂതകാലഭാവം ‘പറഞ്ഞുവന്നിരുന്നു’ എന്നതിലും പ്രതിഫലിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
