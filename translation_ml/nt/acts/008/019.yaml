  source_fidelity: ‘അധികാരം’ correctly represents ἐξουσία, and ‘പരിശുദ്ധാത്മാവ്’ correctly identifies πνεῦμα ἅγιον in its contextual referent. The draft’s ‘ലഭിക്കട്ടെ’ can sound like a direct wish or command; the Greek ἵνα clause instead states the intended result/purpose of the requested authority.
  naturalness: The overall register is clear modern Malayalam. However, ‘അയാൾക്ക്’ introduces an unnecessarily masculine singular reference for the indefinite ᾧ ἐὰν (‘anyone on whom’). A plural-generic recipient is more natural and inclusive in Malayalam.
