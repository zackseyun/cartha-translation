source:
  edition: SBLGNT
  text: λέγων· Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/019.yaml
  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “ഈ അധികാരം എനിക്കും തരിക; അങ്ങനെ ഞാൻ ആരുടെമേൽ കൈകൾ വെച്ചാലും അവർക്ക് പരിശുദ്ധാത്മാവ് ലഭിക്കേണ്ടതിന്.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അധികാരം’ എന്നതിന് പകരം ‘ശക്തി’ എന്നും പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: ἐξουσία). പ്രവർത്തിക്കാനുള്ള ഏൽപ്പിക്കപ്പെട്ട അധികാരം, അവകാശം, അല്ലെങ്കിൽ ശക്തി എന്നിവ ഈ പദം സൂചിപ്പിക്കാം. ‘ശക്തി’യെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്ന മറ്റു ഗ്രീക്കുപദങ്ങളിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താനാണ് ഇവിടെ ‘അധികാരം’ എന്നു നൽകിയിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: അവൻ പറഞ്ഞു
  rationale: മുൻവാക്യത്തോടു ബന്ധിപ്പിക്കുന്ന വർത്തമാനകൃദന്തത്തെ മലയാള ആഖ്യാനത്തിൽ സ്വാഭാവികമായ സമാപികാക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: Δότε
  choice: തരിക
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ളതും മാന്യവുമായ മലയാളരൂപം.
- source_word: κἀμοί
  choice: എനിക്കും
  rationale: καί + ἐμοί എന്ന സംയുക്തരൂപത്തിലെ ‘എനിക്കും’ എന്ന ഉൾപ്പെടുത്തൽ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: പ്രവർത്തിക്കാനുള്ള അവകാശമോ ഏല്പിക്കപ്പെട്ട അധികാരമോ സൂചിപ്പിക്കുന്ന ἐξουσία എന്ന പദത്തെ ‘ശക്തി’യിൽനിന്ന് വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ശിമോൻ ആവശ്യപ്പെട്ട അധികാരത്തിന്റെ ഉദ്ദേശിച്ച ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ᾧ ἐὰν
  choice: ആരുടെമേൽ ... അയാൾക്ക്
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥയെ വ്യക്തമായ മലയാള ബന്ധവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: ഞാൻ ... കൈകൾ വെച്ചാലും
  rationale: കൈവെക്കൽ എന്ന ദൃശ്യപ്രവൃത്തിയെ നിലനിർത്തുകയും ἐάν സഹിതമുള്ള അനിശ്ചിത വ്യവസ്ഥ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: λαμβάνῃ
  choice: ലഭിക്കട്ടെ
  rationale: ἵναയോടു ചേർന്ന subjunctive രൂപത്തിലെ ഉദ്ദേശിച്ച ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: ഗ്രീക്കിൽ നിർദ്ദേശകപദമില്ലെങ്കിലും സന്ദർഭം ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ വ്യക്തിനാമസദൃശ ദൈവിക പരാമർശം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: അനിർദ്ദേശിതമായ πνεῦμα ἅγιον എന്നത് ‘ഒരു വിശുദ്ധാത്മാവ്’ എന്ന അനിശ്ചിത അർഥത്തിൽ വിവർത്തനം ചെയ്യണോ
  choice: പരിശുദ്ധാത്മാവിനെ
  alternative: ഒരു വിശുദ്ധാത്മാവിനെ; പരിശുദ്ധാത്മാവ്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളുടെ ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ആത്മാവാണ് ഉദ്ദേശ്യം. ‘ഒരു വിശുദ്ധാത്മാവ്’ എന്നു പറയുന്നത് സന്ദർഭം പിന്തുണയ്ക്കാത്ത അർഥം നൽകും.
- issue: ἐξουσία എന്നത് അധികാരമോ ശക്തിയോ
  choice: അധികാരം
  alternative: ശക്തി
  rationale: ഈ പദത്തിന് പ്രവർത്തിക്കാനുള്ള അവകാശം, ഏല്പിക്കപ്പെട്ട അധികാരം, പ്രവർത്തനശേഷി എന്നീ അർഥവ്യാപ്തിയുണ്ട്. ‘അധികാരം’ എന്നത് δύναμις പോലുള്ള നേരിട്ടുള്ള ‘ശക്തി’പദങ്ങളിൽനിന്നുള്ള നിഘണ്ടുപരമായ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു; ‘ശക്തി’ സാദ്ധ്യമായ മറ്റൊരു വിവർത്തനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൈകൾ വെക്കുക’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ പരിചിതമായ ബൈബിൾപ്രയോഗങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; അപൂർവമായ സഭാപദങ്ങൾ ഒഴിവാക്കി.
