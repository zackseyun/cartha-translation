    issue: ‘അയാൾക്ക്’ is masculine singular for an indefinite generic person.
    rationale: The Greek relative expression is indefinite and does not specify gender. ‘അവർക്ക്’ preserves this openness and is idiomatic Malayalam generic usage.
  - severity: medium
    issue: ‘ലഭിക്കട്ടെ’ may be heard as an imperative/optative rather than the purpose or intended result introduced by ἵνα.
    rationale: ‘ലഭിക്കേണ്ടതിന്’ more directly links receiving the Holy Spirit to the purpose of Simon’s request, without turning the clause into a command.
