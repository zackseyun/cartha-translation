  source_fidelity: മൂലഗ്രീക്കിനോട് വിശ്വസ്തമാണ്. Πέτρος δὲ εἶπεν πρὸς αὐτόν എന്ന ആമുഖവും, ἀργύριον എന്ന ‘വെള്ളി/വെള്ളിപ്പണം,’ σὺν σοὶ എന്ന ‘നിന്നോടൊപ്പം,’ εἴη εἰς ἀπώλειαν എന്ന ശാപാശംസാ-സ്വഭാവമുള്ള ‘നശിച്ചുപോകട്ടെ,’ καθώς και διὰ χρημάτων κτᾶσθαι എന്ന പണംമൂലം സ്വന്തമാക്കൽ എന്നിവ ശരിയായി പ്രതിഫലിക്കുന്നു. നിത്യശിക്ഷയെ വ്യക്തമായി ചേർക്കാതെ നാശത്തിന്റെ കടുത്ത ഉച്ചാരണം നിലനിർത്തിയിരിക്കുന്നു.
  naturalness: ‘വെള്ളിപ്പണം,’ ‘പണംകൊണ്ട് സ്വന്തമാക്കാമെന്ന്,’ ‘നീ കരുതിയല്ലോ’ എന്നിവ ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്. പത്രോസിന്റെ ശാസനയുടെ ഗൗരവവും വാക്യത്തിന്റെ വായനാസൗകര്യവും സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
  terminology: ‘ദൈവത്തിന്റെ ദാനം’ δωρεὰν τοῦ θεοῦ എന്നതിന് യോജിച്ചതാണ്; സൗജന്യതയുടെ ആശയം പണവുമായി ഉള്ള വ്യക്തമായ വിരോധത്തിലൂടെ ആവശ്യത്തിന് പ്രകടമാകുന്നു. ‘വെള്ളിപ്പണം’ അക്ഷരാർഥവും സന്ദർഭാർഥവും സന്തുലിതമാക്കുന്നു. ‘സ്വന്തമാക്കുക’ κτᾶσθαι-യുടെ ‘നേടുക/കൈവശമാക്കുക’ എന്ന വ്യാപ്തി നിലനിർത്തുന്നു; ‘വാങ്ങുക’ എന്നു പറഞ്ഞ് വാണിജ്യാർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
