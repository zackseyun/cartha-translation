id: ACT.8.20
reference: Acts 8:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് അവനോടു പറഞ്ഞു: “നിന്റെ വെള്ളിപ്പണം[a] നിന്നോടൊപ്പം നശിച്ചുപോകട്ടെ! ദൈവത്തിന്റെ ദാനം പണംകൊണ്ട് സ്വന്തമാക്കാമെന്ന്[b] നീ കരുതിയല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിന്റെ വെള്ളി.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ ‘വെള്ളി’ എന്നാണ്; പണത്തെ സൂചിപ്പിക്കാനും അത് സാധാരണയായി ഉപയോഗിച്ചിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘നേടാമെന്ന്’ അല്ലെങ്കിൽ ‘വാങ്ങാമെന്ന്.’ പണം നൽകുന്നതിലൂടെ ദൈവത്തിന്റെ ദാനം കൈവശപ്പെടുത്താമെന്ന് ശിമോൻ കരുതിയതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: വെള്ളിപ്പണം
  rationale: പദത്തിന്റെ മൂർത്തമായ ‘വെള്ളി/വെള്ളിനാണയം’ എന്ന അർഥവും സന്ദർഭത്തിലെ ‘പണം’ എന്ന പ്രയോഗവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള χρημάτων എന്ന പദത്തിന് ഉപയോഗിച്ച ‘പണം’ എന്നതുമായുള്ള അനാവശ്യ ആവർത്തനവും ഒഴിവാക്കുന്നു.
- source_word: σὺν σοὶ
  choice: നിന്നോടൊപ്പം
  rationale: ശിമോനും അവന്റെ പണവും ഒരുമിച്ച് നാശത്തിന് വിധേയമാകട്ടെ എന്ന കടുത്ത പ്രഖ്യാപനം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἴη εἰς ἀπώλειαν
  choice: നശിച്ചുപോകട്ടെ
  rationale: εἴη എന്ന optative രൂപത്തിലെ ആശംസാ/ശാപപ്രഖ്യാപന ഭാവവും ἀπώλεια എന്നതിലെ നാശത്തിന്റെ അർഥവും സംക്ഷിപ്തമായി നൽകുന്നു; നിത്യശിക്ഷയെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: δωρεὰν
  choice: ദാനം
  rationale: വിലകൊടുത്തു വാങ്ങുന്നതിന് വിപരീതമായി ദൈവം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: ἐνόμισας
  choice: നീ കരുതിയല്ലോ
  rationale: ‘ചിന്തിച്ചു/ധരിച്ചു’ എന്ന അർഥം നേരിട്ട് നൽകുകയും പത്രോസിന്റെ ശാസനയുടെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: διὰ χρημάτων
  choice: പണംകൊണ്ട്
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κτᾶσθαι
  choice: സ്വന്തമാക്കാമെന്ന്
  rationale: ‘നേടുക, കൈവശമാക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘വാങ്ങുക’ എന്നു പരിഭാഷപ്പെടുത്തി വാണിജ്യസൂചനയെ മൂലപാഠത്തേക്കാൾ ശക്തമാക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ശിമോന്റെ അഭ്യർഥനയ്ക്കുള്ള പത്രോസിന്റെ വിരുദ്ധമായ പ്രതികരണം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പത്രോസ് ശിമോനെയും അവന്റെ പണത്തെയും കുറിച്ച് പറഞ്ഞ വാക്കുകളുടെ ശക്തി
  choice: നാശം ആശംസിക്കുന്നതോ വിധിപ്രഖ്യാപനസ്വഭാവമുള്ളതോ ആയ ‘നിന്നോടൊപ്പം നശിച്ചുപോകട്ടെ’
  alternative: നാശത്തെക്കുറിച്ചുള്ള വെറും പ്രവചനം; അല്ലെങ്കിൽ നിത്യശിക്ഷ വ്യക്തമായി പ്രഖ്യാപിക്കുന്ന കൂടുതൽ ശക്തമായ പ്രയോഗം
  rationale: εἴη എന്ന optative രൂപത്തിന്റെ ആശംസാ/ശാപപ്രഖ്യാപന ഭാവം സംരക്ഷിക്കുന്നു. അതേസമയം, ഗ്രീക്ക് പാഠം വ്യക്തമായി പറയാത്ത അന്തിമ നിത്യശിക്ഷയെ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. പത്രോസിന്റെ ശാസനയുടെ കടുപ്പം ആശ്ചര്യചിഹ്നത്തിലൂടെയും ‘നശിച്ചുപോകട്ടെ’ എന്ന പ്രയോഗത്തിലൂടെയും സംരക്ഷിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത പ്രത്യേക സഭാപരമായോ സിദ്ധാന്തപരമായോ ഭാഷ ഒഴിവാക്കി.
