revisions:
- from: ജനക്കൂട്ടങ്ങൾ ഏകമനസ്സോടെ[b] ഫിലിപ്പോസ് പറഞ്ഞുകൊണ്ടിരുന്നത് ശ്രദ്ധിച്ചുകേട്ടു[a]; അവർ അതു കേൾക്കുകയും അദ്ദേഹം ചെയ്തുകൊണ്ടിരുന്ന അടയാളങ്ങൾ കാണുകയും ചെയ്തപ്പോഴായിരുന്നു ഇത്.
