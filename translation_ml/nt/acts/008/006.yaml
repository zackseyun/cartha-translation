translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘ഏകമനസ്സോടെ’ എന്നത് സഭാപരമായ പഴയ പ്രയോഗമാകാതെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ ഏകീകൃത പ്രതികരണം അറിയിക്കുന്നു. രണ്ടാം ഉപവാക്യം ആദ്യത്തേതിന്റെ കാലസാഹചര്യം വ്യക്തമാക്കുന്ന രീതിയിലാണ് ക്രമീകരിച്ചത്.
