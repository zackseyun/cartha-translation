id: ACT.8.22
reference: Acts 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിന്റെ ഈ ദുഷ്ടതയെക്കുറിച്ച് മാനസാന്തരപ്പെടുക; നിന്റെ ഹൃദയത്തിലെ ഉദ്ദേശ്യം ഒരുപക്ഷേ നിനക്കു ക്ഷമിക്കപ്പെട്ടേക്കാമെന്നു കർത്താവിനോടു പ്രാർഥിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിന്റെ ഹൃദയത്തിലെ ചിന്ത ഒരുപക്ഷേ നിനക്കു ക്ഷമിക്കപ്പെടും.”'
    reason: ἐπίνοια എന്നതിന് ‘ഉദ്ദേശ്യം’ എന്നതിനൊപ്പം ‘ചിന്ത’ എന്നും അർഥമാകാം; ഭാവികാല കർമണിരൂപം കൂടുതൽ അക്ഷരാർഥമായി നൽകുന്ന മറ്റൊരു വായനയും ഇവിടെ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: μετανόησον
  choice: മാനസാന്തരപ്പെടുക
  rationale: തീരുമാനാത്മകമായ ധാർമിക-ആത്മീയ തിരിഞ്ഞുവരവിനുള്ള ആജ്ഞയെ മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾപദം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള പത്രോസിന്റെ ശാസനയിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: നിന്റെ ഈ ദുഷ്ടതയെക്കുറിച്ച്
  rationale: κακία ഇവിടെ വെറും ദുഷ്ടചിന്തയല്ല, ധാർമികമായ തിന്മയാണ്. μετανόησον ἀπό എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘...യെക്കുറിച്ച് മാനസാന്തരപ്പെടുക’ എന്നു നൽകി; വ്യക്തിപരമായ ഉത്തരവാദിത്വം ‘നിന്റെ’ നിലനിർത്തുന്നു.
- source_word: δεήθητι
  choice: പ്രാർഥിക്കുക
  rationale: ഗൗരവപൂർവമായ അപേക്ഷയെ സൂചിപ്പിക്കുന്ന മതസന്ദർഭോചിതവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τοῦ κυρίου
  choice: കർത്താവിനോട്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവ് ദൈവശാസ്ത്രപരമായ വിവർത്തനം നിലനിർത്തുന്നു; ഇവിടെ യേശുവെയോ ദൈവത്തെയോ എന്നു അധികമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: εἰ ἄρα
  choice: ഒരുപക്ഷേ ... -പ്പെട്ടേക്കാം
  rationale: ക്ഷമയുടെ ഫലം ഉറപ്പാണെന്നോ അസാധ്യമാണെന്നോ പറയാതെ, ഗ്രീക്കിലെ സാധ്യതയും അനിശ്ചിതത്വവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφεθήσεταί σοι
  choice: ക്ഷമിക്കപ്പെട്ടേക്കാം
  rationale: ഭാവികാല കർമണിപ്രയോഗവും പ്രത്യാശാപൂർവമായ സാധ്യതയും സംരക്ഷിക്കുന്നു; ക്ഷമ നൽകുന്നവനെ വാചകത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἡ ἐπίνοια
  choice: ഉദ്ദേശ്യം
  rationale: ഒരു സാധാരണ ചിന്തയെക്കാൾ ശിമോന്റെ അഭ്യർഥനയ്ക്കു പിന്നിലെ ആന്തരിക ഉദ്ദേശത്തെ ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: τῆς καρδίας σου
  choice: നിന്റെ ഹൃദയത്തിലെ
  rationale: ഉദ്ദേശത്തിന്റെ ആന്തരിക ഉറവിടം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ബൈബിൾപരമായ ‘ഹൃദയം’ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ക്ഷമ ലഭിക്കാനുള്ള സാധ്യതയിലെ ഉറപ്പിന്റെ അളവ്
  choice: മാനസാന്തരപ്പെട്ട് പ്രാർഥിക്കാൻ പത്രോസ് കല്പിക്കുന്നു; ക്ഷമ ലഭിച്ചേക്കാമെന്ന് പ്രത്യാശ നൽകുന്നു, എന്നാൽ ഫലം ഉറപ്പുനൽകുന്നില്ല.
  alternative: മാനസാന്തരപ്പെട്ടാൽ ക്ഷമ ഉറപ്പാണെന്നോ ക്ഷമ അസാധ്യമോ അത്യന്തം അസാധ്യമായതോ ആണെന്നോ വ്യക്തമാക്കുക.
  rationale: εἰ ἄρα എന്ന പ്രയോഗം മനപ്പൂർവം സാധ്യത തുറന്നുവയ്ക്കുന്നു. ‘ഒരുപക്ഷേ ... ക്ഷമിക്കപ്പെട്ടേക്കാം’ എന്നത് ഉറപ്പിനും നിരാശയ്ക്കും ഇടയിലെ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: τοῦ κυρίου എന്നതിന്റെ വ്യക്തമായ സൂചിതൻ
  choice: ‘കർത്താവ്’ എന്നു മാത്രം വിവർത്തനം ചെയ്ത് സൂചിതനെ തുറന്നുവയ്ക്കുന്നു.
  alternative: ‘കർത്താവായ യേശു’ എന്നോ ‘ദൈവം’ എന്നോ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭത്തിൽ ക്രൈസ്തവ പ്രാർഥനയുടെ കർത്താവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഈ വാക്യം തന്നെ സൂചിതനെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സഭാപരിചയമുള്ള ‘മാനസാന്തരപ്പെടുക’, ‘കർത്താവ്’, ‘പ്രാർഥിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നിബന്ധനാപരമായ അനിശ്ചിതത്വം മിനുക്കി നീക്കിയിട്ടില്ല.
