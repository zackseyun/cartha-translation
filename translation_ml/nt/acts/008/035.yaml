id: ACT.8.35
reference: Acts 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: ml
  text: അപ്പോൾ ഫിലിപ്പോസ് വായ് തുറന്ന്[a], ഈ തിരുവെഴുത്തിൽനിന്ന് ആരംഭിച്ച്, അദ്ദേഹത്തോട് യേശുവിനെക്കുറിച്ചുള്ള സുവാർത്ത അറിയിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, സംസാരിച്ചു തുടങ്ങി.
    reason: idiom_explanation
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അദ്ദേഹത്തോട് യേശുവിനെ സുവാർത്തയായി അറിയിച്ചു’ അഥവാ ‘അദ്ദേഹത്തോട് യേശുവിനെ പ്രസംഗിച്ചു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: വായ് തുറന്ന്
  rationale: സംസാരിക്കാൻ തുടങ്ങുക എന്ന അർഥമുള്ള ഗ്രീക്ക് ശൈലിപ്രയോഗം അതിന്റെ ദൃശ്യഭാവവും ഗൗരവമുള്ള ആഖ്യാനശൈലിയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ ആഖ്യാനത്തിന്റെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു; ‘അപ്പോൾ’ അത് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: ഈ തിരുവെഴുത്തിൽനിന്ന് ആരംഭിച്ച്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ആരംഭബിന്ദു നിലനിർത്തുന്നു. γραφή ഇവിടെ വിശുദ്ധലിഖിതത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തിരുവെഴുത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εὐηγγελίσατο
  choice: സുവാർത്ത അറിയിച്ചു
  rationale: നല്ല വാർത്ത പ്രഖ്യാപിക്കുക എന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു; സ്ഥാപനപരമായ പ്രസംഗം എന്ന പരിമിതഭാവം ഒഴിവാക്കുന്നു.
- source_word: αὐτῷ
  choice: അദ്ദേഹത്തോട്
  rationale: സന്ദർഭത്തിലെ എത്യോപ്യൻ ഉദ്യോഗസ്ഥനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്. ആദരസൂചകമായ ഏകവചനരൂപം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെക്കുറിച്ചുള്ള
  rationale: εὐαγγελίζομαι എന്ന ക്രിയയോടൊപ്പമുള്ള ദ്വിതീയാവിഭക്തി പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കാം. യേശുവാണ് സുവാർത്തയുടെ വിഷയവും കേന്ദ്രവും എന്നു സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: അദ്ദേഹത്തോട് യേശുവിനെക്കുറിച്ചുള്ള സുവാർത്ത അറിയിച്ചു
  alternative: അദ്ദേഹത്തോട് യേശുവിനെ സുവാർത്തയായി അറിയിച്ചു / അദ്ദേഹത്തോട് യേശുവിനെ പ്രസംഗിച്ചു
  rationale: ഗ്രീക്ക് വാക്യഘടന യേശുവിനെ സുവാർത്ത അറിയിക്കുന്ന പ്രവൃത്തിയുടെ ഉള്ളടക്കവും കേന്ദ്രവുമായി അവതരിപ്പിക്കുന്നു. പ്രധാന പരിഭാഷ അത് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പദാനുപദഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വായ് തുറന്ന്’ എന്ന ഗ്രീക്ക് ശൈലിപ്രയോഗം നിലനിർത്തിയെങ്കിലും അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ‘തിരുവെഴുത്ത്’, ‘സുവാർത്ത’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചു; വാക്യഘടന അനാവശ്യമായി സഭാപരമോ പുരാതനമോ ആക്കിയിട്ടില്ല.
