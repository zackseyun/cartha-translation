id: ACT.8.4
reference: Acts 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες διῆλθον εὐαγγελιζόμενοι τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/004.yaml
  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: ml
  text: അങ്ങനെ, ചിതറിക്കപ്പെട്ടവർ പലയിടങ്ങളിലും സഞ്ചരിച്ച് വചനം[a] പ്രസംഗിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സന്ദേശം’; ഇവിടെ യേശുവിനെക്കുറിച്ചുള്ള സന്ദേശം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘നല്ലവാർത്ത അറിയിക്കുക’ എന്ന അർഥവുമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: അങ്ങനെ, …വർ
  rationale: οὖν മുൻവിവരണത്തിലെ പീഡനത്തോടും ചിതറിപ്പോകലോടും ഈ സംഭവത്തെ ബന്ധിപ്പിക്കുന്ന നിഗമനാത്മകമായ മാറ്റം സൂചിപ്പിക്കുന്നു. μέν ഇവിടെ പ്രത്യേകം വിവർത്തനം ചെയ്യേണ്ടതില്ലാത്ത വ്യവഹാരഘടകമാണ്.
- source_word: διασπαρέντες
  choice: ചിതറിപ്പോയവർ
  rationale: പീഡനത്തെത്തുടർന്ന് പല സ്ഥലങ്ങളിലേക്കായി ചിതറിക്കപ്പെട്ട വിശ്വാസികളെയാണ് ഈ aorist passive participle സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ചിതറിപ്പോയവർ’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: διῆλθον
  choice: പലയിടങ്ങളിലൂടെ സഞ്ചരിച്ച്
  rationale: διέρχομαι ഇവിടെ ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്ക് സഞ്ചരിക്കുന്ന ആശയം നൽകുന്നു. ‘പലയിടങ്ങളിലൂടെ’ എന്നത് ഗ്രീക്കിൽ പ്രത്യേകമായി ‘പ്രദേശം’ എന്ന നാമം ചേർക്കാതെ ആ സഞ്ചാരസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: εὐαγγελιζόμενοι
  choice: സുവിശേഷമായി അറിയിച്ചു
  rationale: ക്രിയയുടെ ‘നല്ല വാർത്ത അറിയിക്കുക’ എന്ന അർഥം നിലനിർത്തുകയും, സഭാപ്രസംഗത്തെ മാത്രം സൂചിപ്പിക്കാവുന്ന പരിമിതമായ പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: ലൂക്കോസിന്റെ സംക്ഷിപ്തമായ പ്രയോഗവും ക്രൈസ്തവസന്ദേശത്തെ സൂചിപ്പിക്കുന്ന λόγος എന്ന പദവും നിലനിർത്തുന്നു; ‘ദൈവവചനം’ എന്ന് എഴുതുന്നത് മൂലത്തിൽ ഇല്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന ഘടകം ചേർക്കും.
theological_decisions:
- issue: εὐαγγελιζόμενοι τὸν λόγον എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: വചനം സുവിശേഷമായി അറിയിച്ചു
  alternative: വചനം പ്രസംഗിച്ചു / സുവിശേഷസന്ദേശം അറിയിച്ചു
  rationale: ഗ്രീക്കിൽ τὸν λόγον ക്രിയയുടെ നേരിട്ടുള്ള കർമമാണ്; അതിനാൽ ‘വചനത്തിന്റെ സുവിശേഷം’ എന്ന ഉടമസ്ഥബന്ധം സൃഷ്ടിക്കാതെ, വചനം തന്നെയാണ് നല്ല വാർത്തയായി അറിയിക്കപ്പെട്ടത് എന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. അതോടൊപ്പം εὐαγγελίζομαι എന്ന ക്രിയയിലെ ‘സുവിശേഷം’ എന്ന ആശയവും നഷ്ടപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘വചനം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. Greek participle-ന്റെ അനുബന്ധപ്രവർത്തനം മലയാളത്തിലെ ‘സഞ്ചരിച്ച് … അറിയിച്ചു’ എന്ന ക്രമത്തിൽ അവതരിപ്പിച്ചു.
