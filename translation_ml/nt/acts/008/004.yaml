revisions:
- from: അങ്ങനെ, ചിതറിപ്പോയവർ പലയിടങ്ങളിലൂടെ സഞ്ചരിച്ച് വചനം[a] സുവിശേഷമായി അറിയിച്ചു.
  to: അങ്ങനെ, ചിതറിക്കപ്പെട്ടവർ പലയിടങ്ങളിലും സഞ്ചരിച്ച് വചനം[a] പ്രസംഗിച്ചുകൊണ്ടിരുന്നു.
  rationale: The revision preserves the Greek passive participle in “ചിതറിക്കപ്പെട്ടവർ,” retains the movement from place to place, and renders τὸν λόγον as the direct object, “വചനം.” “പ്രസംഗിച്ചുകൊണ്ടിരുന്നു” naturally conveys the accompanying, ongoing proclamation while they travelled. The footnote preserves both the possible sense of λόγος and the good-news nuance of εὐαγγελίζομαι without forcing an unnatural genitive or predicative construction into the text.
