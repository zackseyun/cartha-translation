  to: അവർ വെള്ളത്തിൽനിന്ന് കയറിവന്നപ്പോൾ, കർത്താവിന്റെ ആത്മാവ് ഫിലിപ്പൊസിനെ എടുത്തുകൊണ്ടുപോയി[a]. ഷണ്ഡൻ പിന്നെ ഫിലിപ്പൊസിനെ കണ്ടില്ല; കാരണം, അവൻ സന്തോഷിച്ചുകൊണ്ട് തന്റെ യാത്ര തുടർന്നു.
