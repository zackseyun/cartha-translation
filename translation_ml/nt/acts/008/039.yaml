  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: ml
  text: അവർ വെള്ളത്തിൽനിന്ന് കയറിവന്നപ്പോൾ, കർത്താവിന്റെ ആത്മാവ് ഫിലിപ്പൊസിനെ എടുത്തുകൊണ്ടുപോയി[a]. ഷണ്ഡൻ പിന്നെ ഫിലിപ്പൊസിനെ കണ്ടില്ല; കാരണം, അവൻ സന്തോഷിച്ചുകൊണ്ട് തന്റെ യാത്ര തുടർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഫിലിപ്പൊസിനെ പെട്ടെന്ന് പിടിച്ചുകൊണ്ടുപോയി.” ഗ്രീക്ക് ക്രിയ പെട്ടെന്നുള്ളതും ശക്തമായതുമായ നീക്കത്തിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: വെള്ളത്തിൽനിന്ന് കയറിവന്നപ്പോൾ
  rationale: ἀναβαίνω എന്ന ക്രിയയും ἐκ എന്ന ഉപസർഗവും വെള്ളത്തിനകത്തുനിന്നുള്ള മുകളിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ഈ രൂപം സ്ഥലപരമായ അർഥം നിലനിർത്തുന്നു; സ്നാനത്തിന്റെ രീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: πνεῦμα κυρίου
  choice: കർത്താവിന്റെ ആത്മാവ്
  rationale: ലൂക്കാ–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന പശ്ചാത്തലത്തിൽ ഈ പ്രയോഗം ദൈവികമായി പ്രവർത്തിക്കുന്ന കർത്താവിന്റെ ആത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἥρπασεν
  choice: എടുത്തുകൊണ്ടുപോയി
  rationale: ἁρπάζω പെട്ടെന്നുള്ളതും ശക്തിയോടുകൂടിയതുമായ നീക്കത്തെ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ പ്രയോഗം സ്വാഭാവികവും മാന്യവുമാണ്; അതിന്റെ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: പിന്നെ ഫിലിപ്പോസിനെ കണ്ടില്ല
  rationale: οὐκέτι സൂചിപ്പിക്കുന്ന ‘ഇനി കാണാതിരിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. സർവനാമത്തിന്റെ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ഫിലിപ്പോസിന്റെ പേര് ആവർത്തിച്ചു.
- source_word: ὁ εὐνοῦχος
  choice: ഷണ്ഡൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ നാമപദത്തിന് നേരിട്ടുള്ള മലയാള സമാനപദം ഉപയോഗിച്ച് മുൻവിവരണവുമായി തുടർച്ച നിലനിർത്തുന്നു.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: തന്റെ വഴിക്കു പോയി
  rationale: അവൻ യാത്ര തുടർന്നു എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ὁδός ഇവിടെ വെറും ഭൗതിക റോഡിനേക്കാൾ യാത്രാമാർഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: χαίρων
  choice: സന്തോഷിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തത്തിന്റെ അനുഗാമിയായ രീതിഭാവം നിലനിർത്തി, യാത്ര തുടരുമ്പോഴുള്ള സന്തോഷം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: πνεῦμα κυρίου പരിശുദ്ധാത്മാവിനെയാണോ, വ്യക്തിത്വമില്ലാത്ത ദൈവിക ശക്തിയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: വ്യക്തിപരമായ ദൈവിക പ്രവർത്തനം സൂചിപ്പിക്കുന്ന ‘കർത്താവിന്റെ ആത്മാവ്’
  alternative: കർത്താവിൽനിന്നുള്ള ഒരു ആത്മാവ് അഥവാ വ്യക്തിത്വമില്ലാത്ത ദൈവിക ശക്തി
  rationale: ലൂക്കാ–അപ്പൊസ്തലപ്രവൃത്തികളിലെ ഉപയോഗം സാധാരണയായി ദൈവത്തിന്റെ ആത്മാവിന്റെ സജീവമായ പ്രവർത്തനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വിവർത്തനം മൂലപാഠത്തിനപ്പുറം വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ἥρπασεν അത്ഭുതകരവും പെട്ടെന്നുമുള്ള നീക്കം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ദൈവിക ഇടപെടലിലൂടെ ഫിലിപ്പോസിനെ എടുത്തുകൊണ്ടുപോയതായി വിവർത്തനം ചെയ്തു
  alternative: പെട്ടെന്നുള്ള ശക്തമായ നീക്കത്തിന് കൂടുതൽ ഊന്നൽ നൽകി ‘പിടിച്ചുകൊണ്ടുപോയി’ എന്ന് വിവർത്തനം ചെയ്യുക
  rationale: കർത്താവിന്റെ ആത്മാവാണ് പ്രവർത്തിക്കുന്നതെന്ന് കഥ വ്യക്തമാക്കുന്നതിനാൽ ദൈവിക ഇടപെടൽ നിലനിർത്തുന്നു; ക്രിയയുടെ ശക്തിയുടെയും പെട്ടെന്നുള്ള നീക്കത്തിന്റെയും സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. വാക്യത്തിലെ സർവനാമങ്ങൾ മൂലമുണ്ടാകാവുന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ രണ്ടാം വാക്യത്തിൽ ‘ഫിലിപ്പോസിനെ’ ആവർത്തിച്ചു. മൂലപാഠത്തിലെ γάρ എന്ന ബന്ധം ‘കാരണം’ എന്നതിലൂടെ നിലനിർത്തി.
