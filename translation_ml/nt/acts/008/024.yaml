id: ACT.8.24
reference: Acts 8:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: ml
  text: 'എന്നാൽ ശിമോൻ മറുപടിയായി പറഞ്ഞു: “നിങ്ങൾതന്നെ എനിക്കുവേണ്ടി കർത്താവിനോടു പ്രാർഥിക്കണം; നിങ്ങൾ പറഞ്ഞവയിൽ ഒന്നും എന്റെമേൽ വന്നുചേരാതിരിക്കാൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപവും മുഖ്യക്രിയയും ചേർന്ന് സംസാരത്തെ പരിചയപ്പെടുത്തുന്ന പതിവുശൈലിയാണ്; ‘മറുപടിയായി പറഞ്ഞു’ പ്രതികരണത്തിന്റെ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: പത്രോസിന്റെ ശാസനയിൽനിന്ന് ശിമോന്റെ പ്രതികരണത്തിലേക്കുള്ള മൃദുവായ വൈരുധ്യവും സംഭാഷണത്തിലെ തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: Δεήθητε
  choice: പ്രാർഥിക്കണം
  rationale: ഇവിടെ കർത്താവിനോടുള്ള അപേക്ഷയും മറ്റുള്ളവർ തനിക്കുവേണ്ടി നടത്തുന്ന മധ്യസ്ഥപ്രാർഥനയുമാണ് ഉദ്ദേശ്യം. അഭ്യർഥനാഭാവമുള്ള ആജ്ഞയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: 'വ്യക്തമായി ചേർത്തിരിക്കുന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു: ശിമോൻ അവരോടുതന്നെയാണ് തനിക്കുവേണ്ടി പ്രാർഥിക്കാൻ ആവശ്യപ്പെടുന്നത്.'
- source_word: ὑπὲρ ἐμοῦ
  choice: എനിക്കുവേണ്ടി
  rationale: പ്രതിനിധാനത്തിന്റെയും മധ്യസ്ഥതയുടെയും അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρὸς τὸν κύριον
  choice: കർത്താവിനോട്
  rationale: പ്രാർഥന അഭിസംബോധന ചെയ്യപ്പെടുന്ന ദിശ/വ്യക്തി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ഒന്നും എനിക്കു സംഭവിക്കാതിരിക്കട്ടെ
  rationale: ആവശ്യപ്പെട്ട പ്രാർഥനയുടെ ഉദ്ദേശിച്ച ഫലം വ്യക്തമാക്കുന്നു. ἐπέρχομαι എന്നതിലെ പ്രതികൂലമായ കാര്യം ഒരാളുടെമേൽ വരുന്നതെന്ന ഭാവം സന്ദർഭത്തിൽ ‘സംഭവിക്കുക’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ പകരുന്നു.
- source_word: ὧν εἰρήκατε
  choice: നിങ്ങൾ പറഞ്ഞവയിൽ
  rationale: μηδέν-നോട് ബന്ധപ്പെടുന്ന വിഭക്തിസംബന്ധം നിലനിർത്തി, മുന്നറിയിപ്പായി പറഞ്ഞ കാര്യങ്ങളിൽ ഒന്നുപോലും എന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: τὸν κύριον (‘കർത്താവ്’) ആരെ സൂചിപ്പിക്കുന്നു
  choice: കർത്താവ്
  alternative: ദൈവം; കർത്താവായ യേശു
  rationale: ഗ്രീക്ക് പാഠം ‘കർത്താവ്’ എന്നുമാത്രമാണ് പറയുന്നത്. ദൈവത്തെയോ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെയോ എന്ന് വിവർത്തനത്തിൽ നിർബന്ധമായി തീരുമാനിക്കാതെ മൂലപാഠത്തിന്റെ വ്യക്തതാതലം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങൾതന്നെ’ മൂലപാഠത്തിലെ ഊന്നൽ പകരുന്നു; വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതാക്കി.
