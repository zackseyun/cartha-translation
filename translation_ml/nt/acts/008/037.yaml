id: ACT.8.37
reference: Acts 8:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἶπεν δὲ ὁ Φίλιππος, Εἰ πιστεύεις ἐξ ὅλης τῆς καρδίας, ἔξεστιν. Ἀποκριθεὶς δὲ εἶπεν, Πιστεύω τὸν υἱὸν τοῦ θεοῦ εἶναι τὸν Ἰησοῦν Χριστόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: ml
  text: 'ഫിലിപ്പോസ്[a] പറഞ്ഞു: “നീ പൂർണഹൃദയത്തോടെ വിശ്വസിക്കുന്നെങ്കിൽ, അതിന് അനുമതിയുണ്ട്.” അദ്ദേഹം മറുപടി പറഞ്ഞു: “യേശുക്രിസ്തു, ദൈവപുത്രനാണെന്ന് ഞാൻ വിശ്വസിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം ഏറ്റവും പഴക്കമുള്ള ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—മൂന്നാം നൂറ്റാണ്ടിലെ പാപ്പിറസ് പ്രതികളിലും നാലാം നൂറ്റാണ്ടിലെ സീനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നീ പ്രതികളിലും—ആദ്യകാല കോപ്റ്റിക് വിവർത്തനങ്ങളിലും ഇല്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാഠപാരമ്പര്യത്തിലും ലത്തീൻ പാരമ്പര്യത്തിലും ഇത് കാണപ്പെടുന്നു. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിൽ ഐറേനിയസും മൂന്നാം നൂറ്റാണ്ടിന്റെ മധ്യത്തിൽ സിപ്രിയനും ഇതിനെ ഉദ്ധരിച്ചിട്ടുണ്ട്. സ്നാനവേളയിൽ ഉപയോഗിച്ചിരുന്ന ഒരു ആദ്യകാല വിശ്വാസപ്രഖ്യാപനം പിന്നീട് അപ്പൊസ്തലപ്രവൃത്തികളുടെ വിവരണപാഠത്തിൽ ഉൾപ്പെട്ടതാകാമെന്ന് പണ്ഡിതർ പലപ്പോഴും വിലയിരുത്തുന്നു.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: ആകാം
  rationale: സ്നാനം ഏൽക്കാമെന്ന അനുമതി സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ അവ്യക്തിപരമായ പ്രയോഗത്തിന്റെ നിയമപരമായ ഭാവം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: പൂർണഹൃദയത്തോടെ
  rationale: സമ്പൂർണമായ ആത്മാർഥതയും സമർപ്പണവും സൂചിപ്പിക്കുന്ന ബൈബിൾഭാഷയിലെ ഹൃദയരൂപകം നിലനിർത്തുന്നു.
- source_word: Πιστεύω
  choice: ഞാൻ വിശ്വസിക്കുന്നു
  rationale: യേശുവിന്റെ വ്യക്തിത്വത്തെക്കുറിച്ചുള്ള ഏറ്റുപറച്ചിലിൽ ബൗദ്ധിക അംഗീകാരവും ആശ്രയവും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: യേശുക്രിസ്തു
  rationale: ഗ്രീക്കിൽ Χριστόν Ἰησοῦν എന്ന പേരിനോടു ചേർന്ന സ്ഥാനപ്പേരായി വായിക്കാവുന്നതിനാൽ മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്നതിന്റെ വിവർത്തനം
  choice: ക്രിസ്തു
  alternative: മശീഹ
  rationale: ഇവിടെ Ἰησοῦν Χριστόν സംയുക്തനാമംപോലെ പ്രവർത്തിക്കാവുന്നുവെന്ന യഥാർഥ ഭാഷാപരമായ സാധ്യത നിലനിർത്തുന്നു; ‘മശീഹ’ എന്നും അർഥമാക്കാം, എന്നാൽ അത് മാത്രം നിർബന്ധിച്ച് ദ്വയവിശേഷണ ഘടന സൃഷ്ടിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സംഭാഷണശൈലി. ‘അയാൾ’ സമീപസന്ദർഭത്തിലെ എത്യോപ്യൻ ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ‘സ്നാനം’ എന്ന ക്രിയ ആവർത്തിക്കാത്തതിനാൽ വിവർത്തനത്തിലും അത് ചേർത്തിട്ടില്ല.
