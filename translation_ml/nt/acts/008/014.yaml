id: ACT.8.14
reference: Acts 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: ml
  text: യെരൂശലേമിലുണ്ടായിരുന്ന അപ്പൊസ്തലന്മാർ ശമര്യ ദൈവവചനം സ്വീകരിച്ചുവെന്നു കേട്ടപ്പോൾ, പത്രോസിനെയും യോഹന്നാനെയും അവരുടെ അടുക്കലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സാഹചര്യം സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള കാലവാക്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാള വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: യെരൂശലേമിലുണ്ടായിരുന്ന അപ്പൊസ്തലന്മാർ
  rationale: അപ്പൊസ്തലന്മാർ യെരൂശലേമിൽ ഉണ്ടായിരുന്നുവെന്ന ഗ്രീക്ക് ഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δέδεκται
  choice: സ്വീകരിച്ചുവെന്ന്
  rationale: δέχομαι എന്നതിന്റെ സ്വീകരിക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; പൂർത്തിയായ സ്വീകരണം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἡ Σαμάρεια
  choice: ശമര്യ
  rationale: പ്രദേശനാമം അവിടത്തെ ജനങ്ങളെ കൂട്ടായി സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ metonymy നിലനിർത്തുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: പ്രഘോഷിക്കപ്പെട്ട ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും ഗൗരവമുള്ളതുമായ ബൈബിൾ പ്രയോഗം.
- source_word: ἀπέστειλαν
  choice: അയച്ചു
  rationale: ലളിതമായ aorist പ്രധാനക്രിയയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: πρὸς αὐτοὺς
  choice: അവരുടെ അടുക്കലേക്ക്
  rationale: മുമ്പ് പരാമർശിച്ച ശമര്യയിലെ ജനങ്ങളിലേക്കുള്ള ദിശ വ്യക്തമാക്കുന്നു.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: പത്രോസിനെയും യോഹന്നാനെയും
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സുപരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ‘ശമര്യ’ എന്ന സ്ഥലനാമത്തിന്റെ metonymic പ്രയോഗം
  choice: ശമര്യ ദൈവവചനം സ്വീകരിച്ചു
  alternative: ശമര്യക്കാർ ദൈവവചനം സ്വീകരിച്ചു
  rationale: ഗ്രീക്ക് പാഠം പ്രദേശനാമം കൂട്ടായ അർഥത്തിൽ ഉപയോഗിക്കുന്നു. അതു നിലനിർത്തുന്നത് മൂലരൂപത്തോടു കൂടുതൽ അടുത്തതും വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നതുമാണ്.
- issue: λόγος എന്നതിന്റെ പരിഭാഷ
  choice: ദൈവവചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: ‘വചനം’ എന്നത് മൂലപദത്തിന്റെ രൂപവും പരിചിതമായ തിരുവെഴുത്തുപരമായ ധ്വനിയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പ്രഘോഷിക്കപ്പെട്ട സന്ദേശമാണെന്ന് വ്യക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. അനാവശ്യമായ ആരംഭബന്ധകപദം ചേർത്തിട്ടില്ല; മൂലപാഠത്തിലെ സ്ഥലനാമ metonymy സംരക്ഷിച്ചിട്ടുണ്ട്.
