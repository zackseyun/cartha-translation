id: ACT.8.25
reference: Acts 8:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: ml
  text: അങ്ങനെ, അവർ കർത്താവിന്റെ വചനത്തെക്കുറിച്ച് ഗൗരവമായി സാക്ഷ്യം പറയുകയും കർത്താവിന്റെ വചനം പ്രഖ്യാപിക്കുകയും ചെയ്തശേഷം, യെരൂശലേമിലേക്കു മടങ്ങിക്കൊണ്ടിരുന്നു; ശമര്യരുടെ അനേകം ഗ്രാമങ്ങളിൽ സുവിശേഷം അറിയിച്ചുകൊണ്ടുമിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: ഗൗരവപൂർവം സാക്ഷ്യം പറയുകയും
  rationale: ക്രിയയുടെ ഊന്നലും ഗൗരവവും നിലനിർത്തുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത ‘മുന്നറിയിപ്പ്’ എന്ന ഇടുങ്ങിയ അർഥം ചേർക്കുന്നില്ല.
- source_word: λαλήσαντες τὸν λόγον τοῦ κυρίου
  choice: കർത്താവിന്റെ വചനത്തെക്കുറിച്ച് ... പ്രസംഗിക്കുകയും
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി ആശയവിനിമയം ചെയ്യുന്നതിനൊപ്പം ‘കർത്താവിന്റെ വചനം’ എന്ന പ്രമാണപരമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ὑπέστρεφον
  choice: മടങ്ങിപ്പോകുകയായിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലത്തിന്റെ പുരോഗമനസ്വഭാവം പ്രകടമാക്കുന്നു.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: ശമര്യരുടെ അനേകം ഗ്രാമങ്ങളിൽ
  rationale: ഗ്രാമങ്ങൾ ശമര്യരുടേതോ ശമര്യർ പാർക്കുന്നവയോ ആണെന്ന ജനവിഭാഗബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εὐηγγελίζοντο
  choice: സുവിശേഷം അറിയിച്ചുകൊണ്ടിരുന്നു
  rationale: പുരോഗമിച്ചുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും സഭാപരമായ ദുർഗ്രാഹ്യപദം ഒഴിവാക്കി ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ സ്ഥലനാമരൂപം.
theological_decisions:
- issue: മറഞ്ഞിരിക്കുന്ന ബഹുവചന കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: ‘അവർ’ എന്നു മാത്രം നിലനിർത്തി
  alternative: പത്രൊസും യോഹന്നാനും എന്നു പേരുകൾ ചേർക്കുക
  rationale: സമീപസന്ദർഭം പത്രൊസിനെയും യോഹന്നാനെയും സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പേരുകൾ പറയുന്നില്ല; അതിനാൽ മൂലപാഠത്തിന്റെ രൂപം നിലനിർത്തുന്നു.
- issue: രണ്ട് അപൂർണ്ണഭൂതകാല ക്രിയകളുടെ സമയബന്ധം
  choice: മടങ്ങിപ്പോകുന്ന യാത്രയ്ക്കിടെ സുവിശേഷം അറിയിച്ചുകൊണ്ടിരുന്ന സമകാലിക പ്രവർത്തനങ്ങളായി അവതരിപ്പിച്ചു
  alternative: ആദ്യം മടങ്ങി, പിന്നീട് സുവിശേഷം അറിയിച്ചു എന്ന ക്രമാനുക്രമ വായന
  rationale: ὑπέστρεφον, εὐηγγελίζοντο എന്നീ രണ്ട് imperfect രൂപങ്ങളും തുടരുന്ന പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്നു; യാത്രാമധ്യേ ഗ്രാമങ്ങളിൽ അറിയിച്ചെന്ന വായന സന്ദർഭത്തോടും വ്യാകരണത്തോടും യോജിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കർത്താവിന്റെ വചനം’, ‘സുവിശേഷം’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ പ്രവാഹം സ്വാഭാവികമാക്കാൻ ‘വഴിയിൽ’ ഉപയോഗിച്ചു.
