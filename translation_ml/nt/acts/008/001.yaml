id: ACT.8.1
reference: Acts 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: ml
  text: ശൗലോ, അവനെ കൊല്ലുന്നതിനെ അംഗീകരിച്ചിരുന്നു. അന്നേ ദിവസം യെരൂശലേമിലെ സഭയ്ക്കെതിരെ വലിയൊരു പീഡനം ഉണ്ടായി. അപ്പൊസ്തലന്മാർ ഒഴികെ എല്ലാവരും യെഹൂദ്യയുടെയും ശമര്യയുടെയും പ്രദേശങ്ങളിലാകെ ചിതറിപ്പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος δὲ
  choice: ശൗലാകട്ടെ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യുന്നു; δέയുടെ ബന്ധകവും നേരിയ വൈരുധ്യാത്മകവുമായ ഭാവം ‘-ആകട്ടെ’ സ്വാഭാവികമായി നൽകുന്നു, എന്നാൽ ഉറവിടത്തിലില്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: ἦν συνευδοκῶν
  choice: അംഗീകരിക്കുകയായിരുന്നു
  rationale: ἦν സഹിതമുള്ള വർത്തമാന കൃദന്തരൂപം അന്നത്തെ തുടർച്ചയായോ സമകാലികമായോ ഉണ്ടായിരുന്ന അനുകൂല സമ്മതത്തെ സൂചിപ്പിക്കുന്നു; നേരിട്ടുള്ള പങ്കാളിത്തം ഇതിലൂടെ അനാവശ്യമായി ആരോപിക്കുന്നില്ല.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: അവനെ കൊന്നതിനെ
  rationale: ἀναίρεσις ഇവിടെ ഒരാളെ കൊന്നുകളയുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വധശിക്ഷ’ നിയമസാധുതയുടെ സൂചന നൽകാമെന്നും ‘കൊലപാതകം’ മൂലപദത്തേക്കാൾ ശക്തമായ നിയമ-ധാർമ്മിക വിധി ചുമത്താമെന്നും ഉള്ളതിനാൽ സുതാര്യമായ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: Ἐγένετο
  choice: ഉണ്ടായി
  rationale: പീഡനം ആരംഭിച്ചു സംഭവിച്ചതിനെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: διωγμὸς μέγας
  choice: വലിയൊരു പീഡനം
  rationale: നാമവും μέγας നൽകുന്ന വ്യാപ്തിയുടെ ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: യെരൂശലേമിലെ സഭയ്ക്കെതിരെ
  rationale: ശത്രുതാപരമായ സാഹചര്യത്തിലെ ἐπίയെ ‘എതിരെ’ എന്നു നൽകുകയും സഭയുടെ സ്ഥാനം സ്വാഭാവികമായ വിശേഷണഘടനയിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πάντες δὲ διεσπάρησαν
  choice: എല്ലാവരും ... ചിതറിപ്പോയി
  rationale: നിർബന്ധിതമായ ചിതറിപ്പോക്കിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പിന്നാലെയുള്ള അപവാദം ‘എല്ലാവരും’ എന്നതിന്റെ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: യെഹൂദ്യയുടെയും ശമര്യയുടെയും പ്രദേശങ്ങളിലാകെ
  rationale: κατάയുടെ വിതരണാർഥവും χώραയുടെ ഭൂമിശാസ്ത്രപരമായ അർഥവും ‘പ്രദേശങ്ങളിലാകെ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: πλὴν τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാർ ഒഴികെ
  rationale: πλήν സൂചിപ്പിക്കുന്ന വ്യക്തമായ അപവാദം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്തെഫാനൊസിന്റെ മരണവുമായി ബന്ധപ്പെട്ട ἀναιρέσει αὐτοῦ എന്ന പ്രയോഗം
  choice: അവനെ കൊന്നതിനെ
  alternative: അവന്റെ വധശിക്ഷയെ; അവന്റെ കൊലപാതകത്തെ; അവന്റെ മരണത്തെ
  rationale: മരണം സംഭവിച്ചുവെന്ന വസ്തുത മാത്രം അല്ല, അവനെ കൊല്ലുന്ന പ്രവൃത്തിയാണ് ശൗൽ അംഗീകരിച്ചതെന്ന് വ്യക്തമാക്കുന്നു. അതേസമയം നിയമപരമായ സാധുതയോ ‘കൊലപാതകം’ എന്ന ശക്തമായ നിയമ-ധാർമ്മിക വിധിയോ മൂലപദത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: πάντες (‘എല്ലാവരും’) എന്നതിന്റെ പരിധി
  choice: അപ്പൊസ്തലന്മാർ ഒഴികെ എല്ലാവരും
  alternative: എല്ലാ വിശ്വാസികളും; ഓരോരുത്തരും
  rationale: വാക്യം തന്നെയാണ് അപ്പൊസ്തലന്മാരെ അപവാദമായി പറയുന്നത്. അതിനാൽ ‘എല്ലാവരും’ എന്ന സാഹിത്യബലം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ സന്ദർഭപരമായ പരിധി യെരൂശലേമിലെ സഭയാണെന്ന് വായനക്കാരന് ഗ്രഹിക്കാനാകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉറവിടത്തിലെ രണ്ടു പ്രസ്താവനകളും വ്യക്തമായ വാക്യങ്ങളാക്കി; ‘അന്നുതന്നെ’ ἐν ἐκείνῃ τῇ ἡμέρᾳ എന്ന സമയബന്ധം കൃത്യമായി നൽകുന്നു. വിശദീകരണം ആവശ്യമായ വിവർത്തനാന്തരം മുഖ്യപാഠത്തിൽ സുതാര്യമായി നൽകിയതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
