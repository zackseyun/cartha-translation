source:
  edition: SBLGNT
  text: τότε ⸀ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: ml
  text: അപ്പോൾ അവർ അവരുടെമേൽ കൈകൾ വെച്ചുകൊണ്ടിരുന്നു; അവർ പരിശുദ്ധാത്മാവിനെ പ്രാപിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ലളിതമായി: “അപ്പോൾ അവർ അവരുടെമേൽ കൈകൾ വെച്ചു; അവർ പരിശുദ്ധാത്മാവിനെ പ്രാപിച്ചു.” ഗ്രീക്കിൽ രണ്ടു ക്രിയകളും അപൂർണഭൂതകാലത്തിലാണ്.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: തുടർന്നുണ്ടായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പദം; ആഖ്യാനത്തിന്റെ ക്രമം നിലനിർത്തുന്നു.
- source_word: ἐπετίθεσαν
  choice: വെച്ചുകൊണ്ടിരുന്നു
  rationale: ἐπιτίθημι എന്ന ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന ആവർത്തിതമോ പുരോഗമിച്ചുകൊണ്ടിരുന്നതോ ആയ പ്രവർത്തനം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰς χεῖρας ἐπ’ αὐτούς
  choice: അവരുടെമേൽ കൈകൾ
  rationale: കൈകൾ വെക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; τὰς χεῖρας എന്നതിലെ നിർദ്ദിഷ്ടത മലയാളത്തിൽ സന്ദർഭംകൊണ്ട് വ്യക്തമാണ്.
- source_word: ἐλάμβανον
  choice: പ്രാപിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ പുരോഗമനസ്വഭാവം സംരക്ഷിക്കുന്നു; 'സ്വീകരിക്കുക' എന്നതിനെക്കാൾ ദൈവിക ദാനം ലഭിക്കുന്ന സന്ദർഭത്തിൽ 'പ്രാപിക്കുക' സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: πνεῦμα ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ എന്ന സന്ദർഭത്തിൽ വാഗ്ദത്തമായ ദൈവിക പരിശുദ്ധാത്മാവാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിലെ പതിവുപ്രയോഗം വിഭക്തിയിലൂടെ നിർദ്ദിഷ്ട വ്യക്തിസൂചന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πνεῦμα ἅγιον എന്നത് അനിർദ്ദിഷ്ടമായ ഒരു ആത്മാവിനെയോ ദൈവിക പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പരിശുദ്ധാത്മാവിനെ
  alternative: ഒരു വിശുദ്ധാത്മാവിനെ
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളുടെ തൊട്ടടുത്ത സന്ദർഭത്തിൽ വിശ്വാസികൾക്കു നൽകപ്പെടുന്ന ദൈവിക പരിശുദ്ധാത്മാവാണ് സൂചിതൻ. അനിർദ്ദിഷ്ടരൂപം സന്ദർഭത്തെ തെറ്റായി പ്രതിനിധീകരിക്കും.
- issue: രണ്ട് ഗ്രീക്ക് അപൂർണഭൂതകാല ക്രിയകളുടെയും ദൃശ്യഭാവം എങ്ങനെ പ്രതിഫലിപ്പിക്കണം
  choice: വെച്ചുകൊണ്ടിരുന്നു ... പ്രാപിച്ചുകൊണ്ടിരുന്നു
  alternative: കൈകൾ വെച്ചു ... പരിശുദ്ധാത്മാവിനെ പ്രാപിച്ചു
  rationale: രണ്ട് ക്രിയകളും imperfect ആയതിനാൽ, തുടർച്ചയായോ ഓരോരുത്തരിലായി നടന്നതോ ആയ പ്രവർത്തനസാധ്യത പരിഹരിക്കാതെ മലയാളത്തിലെ പുരോഗമനരൂപം നിലനിർത്തുന്നു. ലളിതഭൂതകാലം കൂടുതൽ സ്വാഭാവികമായ മറ്റൊരു വിവർത്തനസാധ്യതയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് ക്രിയാദൃശ്യഭാവം പ്രധാനവാചകത്തിൽ ഔപചാരികമായി സൂക്ഷിച്ചിട്ടുണ്ടെങ്കിലും, സ്വാഭാവികമായ ലളിതഭൂതകാല വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
