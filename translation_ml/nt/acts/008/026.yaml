id: ACT.8.26
reference: Acts 8:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: ml
  text: 'കർത്താവിന്റെ ഒരു ദൂതൻ ഫിലിപ്പോസിനോട് ഇങ്ങനെ പറഞ്ഞു: “എഴുന്നേറ്റ് തെക്കോട്ട്[a], യെരൂശലേമിൽനിന്ന് ഗസ്സയിലേക്കു ഇറങ്ങിച്ചെല്ലുന്ന വഴിയിലേക്കു പോകുക.” ഇത് വിജനമായ വഴിയാണ്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉച്ചയ്ക്ക്.” ഗ്രീക്ക് പ്രയോഗം “തെക്കോട്ട്” എന്ന ദിശയെയോ “ഉച്ചയ്ക്ക്” എന്ന സമയത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ഇത് മരുഭൂമിയാണ്.” വഴിതന്നെ വിജനമാണെന്നതിനുപകരം, ആ പാത ഒരു മരുഭൂമിപ്രദേശത്തിലൂടെ കടന്നുപോകുന്നു എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: Ἄγγελος എന്ന നിർദേശകപദമില്ലാത്ത ഏകവചന നാമത്തെ സ്വാഭാവികമായി ‘ഒരു ദൂതൻ’ എന്നു നൽകി; κύριος ഇവിടെ ദൈവിക അധികാരത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കർത്താവ്’ നിലനിർത്തി. δέയ്ക്ക് വേറൊരു കാലസൂചകപദം ചേർക്കാതെ മലയാളത്തിലെ വാക്യബന്ധംകൊണ്ട് അതിന്റെ ലഘു ബന്ധകസ്വഭാവം പ്രകടമാകുന്നു.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: ഫിലിപ്പോസിനോട് ഇങ്ങനെ പറഞ്ഞു
  rationale: അക്ഷരാർഥത്തിലുള്ള ആവർത്തനം ഒഴിവാക്കി, സംസാരിച്ചതും തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളും സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്ന മലയാളപ്രയോഗം.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: എഴുന്നേറ്റ് … പോകുക
  rationale: ഉടൻ പ്രവർത്തിക്കാനുള്ള രണ്ടു ആജ്ഞകളെയും ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατὰ μεσημβρίαν
  choice: തെക്കോട്ട്
  rationale: യാത്രാനിർദേശത്തിന്റെ പശ്ചാത്തലത്തിൽ ദിശാസൂചനയാണ് കൂടുതൽ സാധ്യതയുള്ളത്; ‘ഉച്ചയ്ക്ക്’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἐπὶ τὴν ὁδὸν
  choice: വഴിയിലേക്കു
  rationale: ഒരു നിർദിഷ്ട പാതയിലേക്കുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: യെരൂശലേമിൽനിന്ന് ഗസ്സയിലേക്കു താഴേക്കു പോകുന്ന
  rationale: യെരൂശലേമിൽനിന്നുള്ള ഭൗമശാസ്ത്രപരമായ ഇറക്കം സൂചിപ്പിക്കുന്ന καταβαίνω എന്ന പ്രയോഗം അമിതമായി ഔപചാരികമാക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: ഇത് വിജനമായ വഴിയാണ്
  rationale: സ്ത്രീലിംഗത്തിലുള്ള αὕτη മുൻപുള്ള ὁδός എന്നതിലേക്കു ചൂണ്ടുന്നതായി എടുത്ത് മലയാളത്തിൽ ‘വഴി’ വ്യക്തമാക്കിയിരിക്കുന്നു. ἔρημος എന്നതിന്റെ ‘മരുഭൂമി’ എന്ന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവിന്റെ ദൂതൻ’ എന്ന പ്രയോഗത്തിലെ കർത്താവിന്റെ സൂചനയും ദൂതന്റെ തിരിച്ചറിയലും
  choice: ദൈവിക അധികാരത്തിൽ വരുന്ന ഒരു ദൂതൻ എന്നതിലപ്പുറം വ്യക്തമായ തിരിച്ചറിയൽ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: ‘ദൈവം അയച്ച ഒരു ദൂതൻ’ എന്ന വ്യാഖ്യാനാത്മക രൂപം; അല്ലെങ്കിൽ ഒരു പ്രത്യേക വെളിപ്പാടുരൂപമായി ‘കർത്താവിന്റെ ദൂതൻ’.
  rationale: മൂലപാഠം ദൂതനെ ‘കർത്താവിന്റെ’ എന്നു വിശേഷിപ്പിക്കുന്നുവെങ്കിലും, അതിലപ്പുറം ദൂതന്റെ സ്വഭാവമോ വ്യക്തിത്വമോ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘യെരൂശലേം,’ ‘ഗസ്സ,’ ‘ഫിലിപ്പോസ്’ എന്നീ പരിചിത ബൈബിൾ നാമരൂപങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ ദിശ/സമയ ദ്വയാർഥവും ἔρημος എന്ന പദത്തിന്റെ ‘വിജനം/മരുഭൂമി’ ദ്വയാർഥവും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
