  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰούδας τε καὶ Σιλᾶς, καὶ αὐτοὶ προφῆται ὄντες, διὰ λόγου πολλοῦ παρεκάλεσαν τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: ml
  text: യൂദാസും ശീലാസും, സ്വയം പ്രവാചകന്മാരായിരുന്ന അവർ, ദീർഘമായി സംസാരിച്ച് സഹോദരന്മാരെ[a] പ്രോത്സാഹിപ്പിക്കുകയും അവരെ ശക്തിപ്പെടുത്തുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരന്മാരെയും സഹോദരിമാരെയും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ അത് വിശ്വാസികളുടെ മുഴുവൻ സമൂഹത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: യൂദാസും ശീലാസും
  rationale: പുതിയനിയമത്തിലെ ഈ വ്യക്തിനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ ഉപയോഗിക്കുന്നു; τε καὶ എന്ന അടുത്ത ഏകോപനം സ്വാഭാവികമായ ‘-ഉം ... -ഉം’ ഘടനയിൽ പകർത്തുന്നു.
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: സ്വയം പ്രവാചകന്മാരായിരുന്നതിനാൽ
  rationale: αὐτοὶ നൽകുന്ന ഊന്നൽ ‘സ്വയം’ സംരക്ഷിക്കുന്നു. സന്ദർഭത്തിൽ ഈ പങ്കാളിത്തഘടന തുടർന്നുള്ള പ്രവർത്തനങ്ങൾക്ക് വിശദീകരണപരമായ പശ്ചാത്തലം നൽകുന്നതിനാൽ ‘ആയിരുന്നതിനാൽ’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: διὰ λόγου πολλοῦ
  choice: ദീർഘമായി സംസാരിച്ച്
  rationale: അക്ഷരാർഥമായ ‘വളരെയധികം വാക്കിലൂടെ’ എന്നതിനു പകരം, നീണ്ടുനിന്ന വാചിക ശുശ്രൂഷ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: παρεκάλεσαν
  choice: പ്രോത്സാഹിപ്പിക്കുകയും
  rationale: παρακαλέω എന്ന പദത്തിന് പ്രോത്സാഹിപ്പിക്കുക, ഉദ്ബോധിപ്പിക്കുക, ആശ്വസിപ്പിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്; ഇവിടെ വിശ്വാസസമൂഹത്തെ ശക്തിപ്പെടുത്തുന്ന പ്രവാചകശുശ്രൂഷയുടെ പശ്ചാത്തലത്തിൽ ‘പ്രോത്സാഹിപ്പിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; മുഴുവൻ വിശ്വാസസമൂഹത്തെയും ഉൾക്കൊള്ളാനിടയുള്ള പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπεστήριξαν
  choice: അവരെ ശക്തിപ്പെടുത്തുകയും ചെയ്തു
  rationale: വിശ്വാസത്തിൽ ഉറപ്പിക്കുകയോ ദൃഢരാക്കുകയോ ചെയ്യുക എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി നൽകുകയും, മുൻ ക്രിയയിൽനിന്ന് വേറിട്ട രണ്ടാമത്തെ പ്രവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സമ്മിശ്ര വിശ്വാസസമൂഹത്തിന്റെ പശ്ചാത്തലത്തിൽ ἀδελφοὺς എന്നതിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാരെ
  alternative: സഹോദരീസഹോദരന്മാരെ; വിശ്വാസികളെ
  rationale: മൂലപദത്തിന്റെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു. എന്നാൽ ആദിമ ക്രൈസ്തവ പ്രയോഗത്തിൽ ഇത് സ്ത്രീകളെയും ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രവാചകന്മാർ’, ‘പ്രോത്സാഹിപ്പിക്കുക’, ‘ശക്തിപ്പെടുത്തുക’ എന്നീ നേരിട്ടുള്ള സഭാപരിചിത പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമായി സൂക്ഷിച്ചു.
