revisions:
- from: എന്നാൽ പൗലോസ് ശീലാസിനെ തിരഞ്ഞെടുത്ത്, സഹോദരന്മാരാൽ[b] കർത്താവിന്റെ കൃപയ്ക്ക് ഭരമേൽപ്പിക്കപ്പെട്ട്[a], യാത്ര തിരിച്ചു.
  to: എന്നാൽ പൗലോസ് ശീലാസിനെ തിരഞ്ഞെടുത്ത്, സഹോദരന്മാരാൽ[b] കർത്താവിന്റെ കൃപയ്ക്ക് ഏൽപ്പിക്കപ്പെട്ട്[a], യാത്ര തിരിച്ചു.
  rationale: The revision replaces a Malayalam expression that can imply burden-imposition with the natural passive expression ‘ഏൽപ്പിക്കപ്പെട്ട്,’ accurately conveying the community’s entrusting of Paul to the grace of the Lord. The order, passive relation, theological ambiguity of ‘the Lord,’ and existing footnote anchor placement are retained.
