id: ACT.15.40
reference: Acts 15:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: ml
  text: എന്നാൽ പൗലോസ് ശീലാസിനെ തിരഞ്ഞെടുത്ത്, സഹോദരന്മാരാൽ[b] കർത്താവിന്റെ കൃപയ്ക്ക് ഏൽപ്പിക്കപ്പെട്ട്[a], യാത്ര തിരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ കൃപയുടെ പരിപാലനത്തിന് സമർപ്പിക്കപ്പെട്ട്.’
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നത് സന്ദർഭമനുസരിച്ച് സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള വിശ്വാസിസമൂഹത്തെ വിശാലമായി സൂചിപ്പിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ ബർന്നബാസ് യാത്രതിരിച്ചതിനോടുള്ള മൃദുവായ വൈരുധ്യം സന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιλεξάμενος
  choice: തിരഞ്ഞെടുത്ത്
  rationale: ശീലാസിനെ പൗലോസ് വ്യക്തിപരമായി തിരഞ്ഞെടുത്ത ശേഷമാണ് പുറപ്പെട്ടതെന്ന ക്രമം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; മധ്യപ്രയോഗത്തെ അനാവശ്യമായി വിപുലീകരിക്കുന്നില്ല.
- source_word: Σιλᾶν
  choice: ശീലാസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἐξῆλθεν
  choice: യാത്ര തിരിച്ചു
  rationale: യാത്രാവിവരണത്തിൽ ‘പുറപ്പെട്ടു/യാത്ര തിരിച്ചു’ എന്ന അർഥമാണ്; മിഷൻയാത്രയുടെ സന്ദർഭത്തിൽ ‘യാത്ര തിരിച്ചു’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: παραδοθεὶς
  choice: ഭരമേൽപ്പിക്കപ്പെട്ട്
  rationale: സമൂഹം പൗലോസിനെ കർത്താവിന്റെ കൃപാപരിപാലനത്തിന് ഏൽപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ കൃദന്തരൂപം നിലനിർത്തുന്നു; ‘ഏൽപ്പിക്കപ്പെട്ട്’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῇ χάριτι
  choice: കൃപയ്ക്ക്
  rationale: χάρις എന്ന ദൈവശാസ്ത്രപരമായ നാമത്തെ പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുകയും παραδίδωμι എന്ന ക്രിയയോടുള്ള ദത്തിവ് ബന്ധം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ പുതിയനിയമ പ്രയോഗം; യേശുവാണോ പിതാവായ ദൈവമാണോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയും വ്യക്തമാക്കുന്നില്ല.
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: സഹോദരന്മാരാൽ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ പദത്തെ മുഖ്യപാഠത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: കർത്താവ് എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: കർത്താവായ യേശു; ദൈവം
  rationale: ഗ്രീക്കുപാഠം κύριος എന്ന വിശേഷണം മാത്രമേ ഉപയോഗിക്കുന്നുള്ളൂ. അതിനാൽ സൂചിതവ്യക്തിയെ അനാവശ്യമായി നിർണയിക്കാതെ മൂലപാഠത്തിന്റെ വ്യക്തതാതലം നിലനിർത്തുന്നു.
- issue: ‘സഹോദരന്മാർ’ എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’; വിശാലമായ സമൂഹാർഥം അടിക്കുറിപ്പിൽ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹവിശ്വാസികൾ
  rationale: ἀδελφῶν വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. എന്നാൽ ആദിമ ക്രൈസ്തവ സമൂഹപ്രയോഗത്തിൽ സ്ത്രീകൾ ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും സൂചിപ്പിക്കാം; ഈ സാധ്യത പരിഭാഷയിൽ ലഘൂകരിക്കാതെ അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. യാത്രാവിവരണത്തിന് ‘യാത്ര തിരിച്ചു’ എന്നും, സഭാസമൂഹത്തിന്റെ ദൈവപരിപാലനത്തിലേക്കുള്ള ഏൽപ്പിക്കലിന് ‘ഭരമേൽപ്പിക്കപ്പെട്ട്’ എന്നും ഉപയോഗിച്ചു. നിഷ്ക്രിയരൂപം മൂലഗ്രീക്കിന്റെ ഘടനയും പൗലോസ് ഏൽപ്പിക്കപ്പെട്ട വ്യക്തിയാണെന്ന ബന്ധവും നിലനിർത്തുന്നു.
