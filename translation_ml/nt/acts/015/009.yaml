source:
  edition: SBLGNT
  text: καὶ ⸀οὐθὲν διέκρινεν μεταξὺ ἡμῶν τε καὶ αὐτῶν, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: ml
  text: വിശ്വാസത്താൽ അവരുടെ ഹൃദയങ്ങളെ ശുദ്ധീകരിച്ച്, നമുക്കും അവർക്കും ഇടയിൽ അവൻ യാതൊരു വ്യത്യാസവും കാണിച്ചില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വാസത്തിലൂടെ.” ഗ്രീക്ക് ദത്തിവ് വിഭക്തി മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: യാതൊരു വ്യത്യാസവും കല്പിച്ചില്ല
  rationale: οὐθὲν എന്ന നിഷേധവും διέκρινεν എന്ന ക്രിയയും ചേർന്നുള്ള പ്രയോഗത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ദൈവം രണ്ടു കൂട്ടരെയും വേർതിരിച്ചു കണ്ടില്ല എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: നമുക്കും അവർക്കും ഇടയിൽ
  rationale: τε ... καὶ എന്ന ബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘നമുക്കും അവർക്കും’ എന്ന സമാന്തര ഘടനയിൽ പകരുന്നു.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ദത്തിവ് ഇവിടെ മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം. ‘വിശ്വാസത്താൽ’ എന്നത് ആ അർത്ഥം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: καθαρίσας
  choice: ശുദ്ധീകരിച്ച്
  rationale: ആഓറിസ്റ്റ് പങ്കാളിക്രിയയുടെ മുഖ്യക്രിയയോടുള്ള ബന്ധം കൃത്യമായി കാലക്രമത്തിലേക്ക് ചുരുക്കാതെ, ദൈവത്തിന്റെ ഹൃദയശുദ്ധീകരണ പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὰς καρδίας αὐτῶν
  choice: അവരുടെ ഹൃദയങ്ങളെ
  rationale: καρδία എന്നത് ഇവിടെ ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾ രൂപകമാണ്; അതിനാൽ ‘ഹൃദയങ്ങൾ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം / വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ πίστις എന്നത് വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നതാണ്; ‘വിശ്വസ്തത’ ആവശ്യപ്പെടുന്ന ഉടമസ്ഥബന്ധമുള്ള വിവാദഘടന ഇവിടെ ഇല്ല.
- issue: τῇ πίστει എന്ന ദത്തിവിന്റെ പ്രവർത്തനം
  choice: വിശ്വാസത്താൽ
  alternative: വിശ്വാസത്തിലൂടെ
  rationale: ദത്തിവ് മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ ‘വിശ്വാസത്താൽ’ സ്വീകരിച്ചെങ്കിലും ‘വിശ്വാസത്തിലൂടെ’ എന്ന സാധുവായ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവത്തോടെയും രചിച്ചു. മൂലവാക്യത്തിലെ പങ്കാളിക്രിയ ആദ്യം വെച്ചത് മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായാണ്; ദൈവത്തെ സൂചിപ്പിക്കുന്ന ‘അവൻ’ വ്യക്തമായി നിലനിർത്തി.
