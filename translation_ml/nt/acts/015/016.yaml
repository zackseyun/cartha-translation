source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: ml
  text: ഇവയ്ക്കുശേഷം ഞാൻ മടങ്ങിവരും; വീണുപോയ ദാവീദിന്റെ കൂടാരം[a] ഞാൻ വീണ്ടും പണിയും; അതിന്റെ ഇടിച്ചുതകർത്ത അവശിഷ്ടങ്ങൾ ഞാൻ വീണ്ടും പണിയും; അതിനെ ഞാൻ പുനഃസ്ഥാപിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദാവീദിന്റെ സമാഗമകൂടാരം’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് ‘കൂടാരം’ അല്ലെങ്കിൽ ‘സമാഗമകൂടാരം’ എന്ന അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദാവീദിന്റെ കൂടാരം’ എന്നത് ദാവീദിന്റെ വംശത്തോടോ രാജ്യത്തോടോ ബന്ധപ്പെട്ട പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്ന പ്രവാചകീയ രൂപകമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: ബഹുവചനമായ ταῦτα എന്നതും ഉദ്ധരണിയിലെ കാലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀναστρέψω
  choice: ഞാൻ മടങ്ങിവരും
  rationale: ഈ സന്ദർഭത്തിൽ ‘തിരിയുക’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ തിരിച്ചുവരുക എന്ന അർഥമാണ് യോജിച്ചത്; ദൈവത്തിന്റെ ഒന്നാംപുരുഷ വാഗ്ദാനവും നിലനിർത്തുന്നു.
- source_word: ἀνοικοδομήσω
  choice: ഞാൻ വീണ്ടും പണിയും
  rationale: വീണ്ടും പണിയുക എന്ന ക്രിയയുടെ പുനർനിർമാണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σκηνὴν Δαυὶδ
  choice: ദാവീദിന്റെ കൂടാരം
  rationale: σκηνή എന്നതിന്റെ അടിസ്ഥാനമായ ‘കൂടാരം’ എന്ന രൂപകം നിലനിർത്തുന്നു; ‘ദാവീദിന്റെ ഭവനം’ എന്ന വ്യാഖ്യാനാത്മക വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: τὴν πεπτωκυῖαν
  choice: വീണുപോയ
  rationale: വീണതിന്റെ ഫലമായി ഇപ്പോഴും അങ്ങനെ കിടക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകൃതന്തത്തിന്റെ ഭാവം പകരുന്നു.
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: അതിന്റെ ഇടിച്ചുതകർക്കപ്പെട്ട ഭാഗങ്ങൾ
  rationale: ഇടിച്ചുനശിപ്പിക്കപ്പെട്ടവയെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം വ്യക്തമായി പകരുന്നു; ‘അവശിഷ്ടങ്ങൾ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു.
- source_word: ἀνορθώσω
  choice: പുനഃസ്ഥാപിക്കും
  rationale: നിവർത്തിനിർത്തുക, വീണ്ടും ഉറപ്പിക്കുക എന്ന ദൃശ്യഭാവം ഈ പുനർനിർമാണസന്ദർഭത്തിൽ സ്വാഭാവികമായി സംഗ്രഹിക്കുന്നു.
- source_word: αὐτήν
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗത്തിലുള്ള σκηνήയെ സൂചിപ്പിക്കുന്ന സർവനാമം മലയാളത്തിൽ അചേതനവസ്തുവിനുള്ള സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ദാവീദിന്റെ കൂടാരം’ എന്ന പ്രയോഗത്തിന്റെ രൂപകാർഥം
  choice: രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ ‘ദാവീദിന്റെ കൂടാരം’ എന്നു നിലനിർത്തി.
  alternative: ദാവീദിന്റെ ഭവനം; ദാവീദിന്റെ വീണുപോയ രാജവംശം
  rationale: ഈ പ്രവാചകീയ രൂപകം ദാവീദിന്റെ വംശത്തോടോ രാജ്യത്തോടോ ബന്ധപ്പെട്ട പുനഃസ്ഥാപനത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഗ്രീക്ക് പാഠം അതിനെ നേരിട്ട് വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. പുനർനിർമാണത്തെ ഊന്നുന്ന ആവർത്തനം നിലനിർത്തി; രൂപകത്തെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കിയില്ല.
