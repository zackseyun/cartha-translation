revisions:
- from: ഇവയ്ക്കുശേഷം ഞാൻ മടങ്ങിവരും; വീണുപോയ ദാവീദിന്റെ കൂടാരം[a] ഞാൻ വീണ്ടും പണിയും; അതിന്റെ ഇടിച്ചുതകർക്കപ്പെട്ട ഭാഗങ്ങൾ ഞാൻ വീണ്ടും പണിത് അതിനെ പുനഃസ്ഥാപിക്കും.[b]
  to: ഇവയ്ക്കുശേഷം ഞാൻ മടങ്ങിവരും; വീണുപോയ ദാവീദിന്റെ കൂടാരം[a] ഞാൻ വീണ്ടും പണിയും; അതിന്റെ ഇടിച്ചുതകർത്ത അവശിഷ്ടങ്ങൾ ഞാൻ വീണ്ടും പണിയും; അതിനെ ഞാൻ പുനഃസ്ഥാപിക്കും.[b]
