  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ പദക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക വാക്യക്രമത്തിലാക്കി; പേരുകളും തിരിച്ചറിയൽപ്രയോഗവും വ്യക്തമായി സൂക്ഷിച്ചു.
