lexical_decisions:
- source_word: γνωστὰ
  choice: അറിയപ്പെട്ടവ
  rationale: ക്രിയയില്ലാത്ത ഈ സംക്ഷിപ്ത വാക്യത്തിൽ വിശേഷണം ആഖ്യാതമായി പ്രവർത്തിക്കുന്നു. ‘അറിയപ്പെട്ടവ’ എന്നത് ‘അറിയിച്ചതായവ’ എന്ന അധിക ക്രിയാഭാവം ചേർക്കാതെ ഗ്രീക്കിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἀπ’
  choice: മുതൽ
  rationale: കാലത്തിന്റെ ആരംഭബിന്ദു സൂചിപ്പിക്കുന്ന ἀπό എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ് ‘മുതൽ’.
- source_word: αἰῶνος
  choice: പുരാതനകാലം
  rationale: ഇവിടെ αἰών ദീർഘമായ ഭൂതകാലത്തെയോ പണ്ടുമുതലുള്ള കാലത്തെയോ സൂചിപ്പിക്കാം. ‘പുരാതനകാലം’ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും കാലപരമായ അർഥവും സംരക്ഷിക്കുന്നു; ‘നിത്യത’ എന്ന ശക്തമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ സംക്ഷിപ്ത വാക്യത്തിലെ ദൈവിക അറിവിന്റെ കാലപരിധി
  choice: കാര്യങ്ങൾ പുരാതനകാലംമുതൽ അറിയപ്പെട്ടവയാണെന്ന പ്രസ്താവനയായി സംക്ഷിപ്തമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘നിത്യതമുതൽ അറിയപ്പെട്ടവ’ അല്ലെങ്കിൽ ‘പുരാതനകാലംമുതൽ ഇവ അറിയിക്കുന്നവൻ’
  rationale: SBLGNT പാഠമായ γνωστὰ ἀπ’ αἰῶνος അത്യന്തം സംക്ഷിപ്തമാണ്. അതിനാൽ നിത്യമായ മുൻഅറിവിനെക്കുറിച്ചുള്ള ശക്തമായ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനമോ ദീർഘമായ പാഠഭേദത്തിലെ അധിക വാക്കുകളോ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല; അവ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സംക്ഷിപ്തവുമായ മലയാളം. ഇത് മുൻവാക്യത്തിന്റെ അവസാനത്തോട് ചേരുന്ന ശകലമായതിനാൽ അവസാനത്തെ ഉദ്ധരണിചിഹ്നം നിലനിർത്തിയിരിക്കുന്നു; ‘അറിയപ്പെട്ടവ’ എന്ന ബഹുവചന നപുംസകരൂപം γνωστά എന്നതിന്റെ രൂപവും മുൻസന്ദർഭത്തിലെ ‘ഇവ’ എന്ന ആശയവും പ്രതിഫലിപ്പിക്കുന്നു.
