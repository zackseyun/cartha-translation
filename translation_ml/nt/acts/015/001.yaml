id: ACT.15.1
reference: Acts 15:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: ml
  text: 'യെഹൂദ്യയിൽനിന്ന് ഇറങ്ങിവന്ന ചിലർ സഹോദരന്മാരെ[a] ഇങ്ങനെ പഠിപ്പിച്ചുകൊണ്ടിരുന്നു: “മോശയുടെ ആചാരമനുസരിച്ച് നിങ്ങൾ പരിച്ഛേദനം ഏൽക്കാത്തപക്ഷം നിങ്ങൾക്കു രക്ഷിക്കപ്പെടാൻ കഴിയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരെ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാരെ’ എന്നാണ്. ഇവിടെ ഈ പദം വിശ്വാസിസമൂഹത്തെ ഉൾക്കൊള്ളുന്ന അർഥത്തിൽ ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: മലയാള ആഖ്യാനത്തിൽ ഈ സംഭവത്തെ നേരിട്ട് ആരംഭിക്കുന്നത് സ്വാഭാവികമാണ്; നിർബന്ധമായി ‘പിന്നെ’ ചേർത്താൽ ഗ്രീക്കിലുള്ള സാധാരണ സംയോജകത്തിന് അധികമായ കാലക്രമസൂചന ലഭിച്ചേക്കാം.
- source_word: τινες
  choice: ചിലർ
  rationale: അനിശ്ചിത ബഹുവചനത്തെ സ്വാഭാവികമായി നൽകുന്നു. ഗ്രീക്കിൽ ‘പുരുഷന്മാർ’ എന്ന നാമം പ്രത്യേകം ഇല്ലാത്തതിനാൽ ‘ചില പുരുഷന്മാർ’ എന്ന് വിപുലീകരിച്ചില്ല.
- source_word: κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽനിന്ന് ഇറങ്ങിവന്ന
  rationale: ഭൂമിശാസ്ത്രപരമായ ദിശാസൂചന നിലനിർത്തുകയും മുൻകാല പങ്കാളിക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി മുഖ്യക്രിയയോടു ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐδίδασκον
  choice: പഠിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാല ക്രിയയുടെ തുടരുന്നതോ ആവർത്തിക്കുന്നതോ ആയ സ്വഭാവം പ്രകടമാക്കുന്നു.
- source_word: τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പ്രയോഗമായിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: നിങ്ങൾ പരിച്ഛേദനം ഏൽക്കാത്തപക്ഷം
  rationale: നിഷേധാത്മക നിബന്ധനയും ക്രിയയുടെ കർമണിപ്രയോഗവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: മോശയുടെ ആചാരമനുസരിച്ച്
  rationale: ἔθος എന്ന പദത്തിന്റെ സ്ഥാപിത ആചാരം എന്ന അർഥവും ദാതൃവിഭക്തിയുടെ മാനദണ്ഡസൂചനയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: οὐ δύνασθε σωθῆναι
  choice: നിങ്ങൾക്കു രക്ഷിക്കപ്പെടാൻ കഴിയില്ല
  rationale: കഴിവില്ലായ്മയും σωθῆναι എന്ന കർമണി രൂപത്തിന്റെ രക്ഷാസംബന്ധമായ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യെരൂശലേം സഭാസമ്മേളനവുമായി ബന്ധപ്പെട്ട തർക്കത്തിൽ σωθῆναι എന്നതിന്റെ അർഥം
  choice: രക്ഷിക്കപ്പെടാൻ
  alternative: വിടുവിക്കപ്പെടാൻ
  rationale: സന്ദർഭം പരിച്ഛേദനം രക്ഷയ്ക്ക് അനിവാര്യമാണോ എന്ന തർക്കമാണ്; ‘രക്ഷിക്കപ്പെടാൻ’ എന്നത് പ്രത്യേക വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കാതെ അതിന്റെ രക്ഷാശാസ്ത്രപരമായ ശക്തി സംരക്ഷിക്കുന്നു.
- issue: ἀδελφοὺς എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാരെ
  alternative: സഹോദരീസഹോദരന്മാരെ / വിശ്വാസികളെ
  rationale: മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ വ്യാകരണരൂപം നിലനിർത്തുകയും, ഈ പദം വിശ്വാസിസമൂഹത്തെ ഉൾക്കൊള്ളുന്നതായി ഉപയോഗിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പഠിപ്പിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു; ‘പരിച്ഛേദനം ഏൽക്കുക’ എന്നത് കർമണിഭാവം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന പ്രയോഗമാണ്.
