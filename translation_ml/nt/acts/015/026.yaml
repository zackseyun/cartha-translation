id: ACT.15.26
reference: Acts 15:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνθρώποις παραδεδωκόσι τὰς ψυχὰς αὐτῶν ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/026.yaml
  text: men who have given up their lives for the name of our Lord Jesus the Messiah[a][b].
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[b] നാമത്തിനുവേണ്ടി തങ്ങളുടെ ജീവൻ പണയപ്പെടുത്തിയ[a] പുരുഷന്മാർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “തങ്ങളുടെ ജീവൻ ഏൽപ്പിച്ചുകൊടുത്ത.” ഇവിടെ ഉദ്ദേശിക്കുന്നത് മാരകമായ അപകടത്തിന് സ്വയം വിധേയരാക്കി എന്നതാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “യേശു ക്രിസ്തോസ്”; ക്രിസ്തോസ് എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം “മശീഹ” അഥവാ “അഭിഷിക്തൻ” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθρώποις
  choice: പുരുഷന്മാർ
  rationale: ἄνθρωπος പൊതുവായി ‘മനുഷ്യർ’ എന്നു വരാമെങ്കിലും ഇവിടെ നേരിട്ടുള്ള പരാമർശം ബർന്നബാസിനെയും പൗലോസിനെയും കുറിച്ചാണ്; അതിനാൽ ലിംഗവും വ്യക്തമായ സൂചനയും നിലനിർത്താൻ ‘പുരുഷന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: παραδεδωκόσι τὰς ψυχὰς αὐτῶν
  choice: തങ്ങളുടെ ജീവൻ പണയപ്പെടുത്തിയ
  rationale: പരാദിദോമി എന്ന ക്രിയയുടെ അക്ഷരാർഥം ‘ഏൽപ്പിച്ചുകൊടുക്കുക’ എന്നാണ്. എന്നാൽ ‘ജീവൻ’ എന്നതോടൊപ്പം ഇവിടെ അതിന്റെ പ്രയോഗാർഥം മാരകമായ അപകടത്തിന് സ്വയം വിധേയരാകുക എന്നതാണ്. അവർ യഥാർഥത്തിൽ മരിച്ചുവെന്ന് സൂചിപ്പിക്കാതെ ആ ശക്തി സ്വാഭാവികമായി നൽകാൻ ‘ജീവൻ പണയപ്പെടുത്തിയ’ എന്നു തെരഞ്ഞെടുത്തു.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: നാമത്തിനുവേണ്ടി
  rationale: ὑπέρ ഇവിടെ കാരണമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു. ‘നാമം’ എന്ന ബൈബിൾപ്രയോഗം വ്യക്തി, അധികാരം, ബഹുമാനം എന്നിവയുടെ വിശാലമായ ധ്വനി നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേരിന്റെ ഭാരം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ നാമവിശേഷണബന്ധമായി നൽകി.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുമശീഹയുടെ
  rationale: Ἰησοῦ ഒരു വ്യക്തിനാമവും Χριστός ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരുമാണ്. മലയാളത്തിലെ സ്വാഭാവിക സംയുക്തപ്രയോഗമായി ‘യേശുമശീഹ’ എന്നു നൽകി.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ വെറും പേരിന്റെ സ്ഥിരഘടകമെന്നതിലുപരി യേശുവിന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിന്റെ അർഥം പ്രകടമാക്കാൻ ‘മശീഹ’ എന്നു നൽകി; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: παραδεδωκόσι എന്നതിന്റെ ത്യാഗധ്വനി
  choice: ജീവൻ പണയപ്പെടുത്തിയ
  alternative: ജീവൻ ഏൽപ്പിച്ചുകൊടുത്ത
  rationale: വാചകം അവരുടെ മരണത്തെ പ്രസ്താവിക്കുന്നില്ല; കർത്താവിന്റെ നാമത്തിനുവേണ്ടി അവർ മാരകമായ അപകടം ഏറ്റെടുത്തതിനെ സൂചിപ്പിക്കുന്നു. അതിനാൽ മരണപ്പെട്ടുവെന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലവാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന നാമപദഘടകമായതിനാൽ അതേ അപൂർണവാക്യഘടന നിലനിർത്തി; വിശദീകരണാർഥം പുതിയ ക്രിയ ചേർത്തിട്ടില്ല.
