id: ACT.15.4
reference: Acts 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: ml
  text: അവർ യെരൂശലേമിൽ എത്തിയപ്പോൾ, സഭയും അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും അവരെ സ്വാഗതം ചെയ്തു. ദൈവം തങ്ങളോടൊപ്പം ചെയ്തതെല്ലാം[a] അവർ വിവരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം അവരിലൂടെ ചെയ്തതെല്ലാം” എന്നോ “ദൈവം അവരുടെ ഇടയിൽ ചെയ്തതെല്ലാം” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം “അവരോടൊപ്പം” എന്നാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: അവർ യെരൂശലേമിൽ എത്തിയപ്പോൾ
  rationale: മുൻപുണ്ടായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി. δέയുടെ മൃദുവായ ബന്ധകധർമ്മം ഈ ഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: παρεδέχθησαν
  choice: അവരെ സ്വാഗതം ചെയ്തു
  rationale: സഭയും നേതാക്കളും അവരെ അനുകൂലമായും ആതിഥ്യപൂർവമായും സ്വീകരിച്ചതാണ് സന്ദർഭം; മലയാളത്തിലെ സജീവവാക്യം സ്വാഭാവികമാണ്, ഗ്രീക്കിലെ passive അർഥവും നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: സഭയും അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും
  rationale: Passive ക്രിയയോടൊപ്പമുള്ള ἀπό സ്വീകരിച്ചവരെ സൂചിപ്പിക്കുന്നു. ἐκκλησίαയ്ക്ക് സന്ദർഭോചിതമായി ‘സഭ’യും, അംഗീകൃത നേതാക്കളെ സൂചിപ്പിക്കുന്ന πρεσβύτεροιയ്ക്ക് ‘മൂപ്പന്മാർ’ എന്നും നൽകി.
- source_word: ἀνήγγειλάν τε ὅσα
  choice: ചെയ്തതെല്ലാം അവർ വിവരിച്ചു
  rationale: ἀναγγέλλω ഇവിടെ സംഭവിച്ച കാര്യങ്ങൾ അറിയിക്കുകയോ വിവരിക്കുകയോ ചെയ്യുന്നതാണ്; ‘വിവരിച്ചു’ ഔപചാരികതയും സ്വാഭാവികതയും ഒരുമിച്ച് നൽകുന്നു. ὅσαയുടെ സമഗ്രത ‘എല്ലാം’ നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς ἐποίησεν
  choice: ദൈവം ... ചെയ്തതെല്ലാം
  rationale: ποιέωയുടെ വിശാലമായ അർഥം ‘ചെയ്തു’ നിലനിർത്തുന്നു; റിപ്പോർട്ടിന് മുമ്പ് നടന്ന പ്രവൃത്തികളാണെന്ന് മലയാളത്തിലെ സന്ദർഭക്രമം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: μετ’ αὐτῶν
  choice: തങ്ങളോടൊപ്പം
  rationale: Genitive-നോടുള്ള μετάയുടെ നേരിട്ടുള്ള അർഥമായ ‘കൂടെ/ഒപ്പം’ നിലനിർത്തുന്നു. ‘തങ്ങൾ’ റിപ്പോർട്ട് ചെയ്ത പൗലോസിനെയും ബർന്നബാസിനെയും സ്വാഭാവികമായി തിരിച്ചുസൂചിപ്പിക്കുന്നു; ‘അവരിലൂടെ’ എന്ന ഉപകരണാർഥമോ ‘അവരുടെ ഇടയിൽ’ എന്ന സ്ഥലാർഥമോ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: μετ’ αὐτῶν എന്ന പ്രയോഗത്തിൽ ദൈവപ്രവൃത്തിയോടുള്ള മനുഷ്യരുടെ ബന്ധം
  choice: ദൈവം തങ്ങളോടൊപ്പം ചെയ്തതെല്ലാം
  alternative: ദൈവം അവരിലൂടെ ചെയ്തതെല്ലാം / ദൈവം അവരുടെ ഇടയിൽ ചെയ്തതെല്ലാം
  rationale: ദൈവമാണ് പ്രധാന പ്രവർത്തകൻ എന്ന് വാക്യം വ്യക്തമാക്കുമ്പോഴും പൗലോസും ബർന്നബാസും അവന്റെ പ്രവർത്തനവുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്നത് ഗ്രീക്ക് പ്രയോഗം തുറന്ന നിലയിൽ വയ്ക്കുന്നു. ‘തങ്ങളോടൊപ്പം’ ഈ ദൈവശാസ്ത്രപരമായ സംയമനവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ശൈലി സ്വീകരിച്ചു. ‘സഭ’, ‘അപ്പൊസ്തലന്മാർ’, ‘മൂപ്പന്മാർ’ എന്നീ പരിചിതവും വിഭാഗീയ പ്രത്യേകതകൾ ചുമത്താത്തതുമായ പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചെങ്കിലും ആശയബന്ധം നിലനിർത്തി.
