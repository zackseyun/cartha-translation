id: ACT.15.38
reference: Acts 15:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: ml
  text: എന്നാൽ പംഫുല്യയിൽവെച്ച് തങ്ങളെ വിട്ടുപിരിയുകയും ആ വേലയ്ക്ക് തങ്ങളോടൊപ്പം പോകാതിരിക്കുകയും ചെയ്ത ഇയാളെ കൂടെക്കൊണ്ടുപോകരുതെന്ന് പൗലോസ് ഉറച്ചുനിന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പംഫുല്യയിൽവെച്ച് തങ്ങളെ ഉപേക്ഷിച്ച.” ഗ്രീക്ക് കൃദ്‌രൂപം കൂടുതൽ ശക്തമായി പരിഭാഷപ്പെടുത്താവുന്നതാണ്; എന്നാൽ മുഖ്യപാഠം വ്യാഖ്യാനഭാരം കുറഞ്ഞ “വിട്ടുപിരിഞ്ഞ” എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: നിർബന്ധിച്ചു
  rationale: തർക്കത്തിന്റെ പശ്ചാത്തലത്തിൽ അപൂർണഭൂതകാലരൂപം പൗലോസിന്റെ ഉറച്ച നിലപാടിനെ സൂചിപ്പിക്കുന്നു; വെറും അഭിപ്രായമെന്നതിലധികമുള്ള ശക്തി ഈ പദം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀποστάντα
  choice: വിട്ടുപിരിയുകയും
  rationale: ἀφίσταμαι എന്ന ക്രിയയുടെ ‘വിട്ടുപോകുക/പിന്മാറുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ ‘ഉപേക്ഷിച്ച’ എന്ന ശക്തമായ കുറ്റാരോപണം ചേർക്കുന്നില്ല.
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: പംഫുല്യയിൽവെച്ച് തങ്ങളെ വിട്ടുപിരിയുകയും
  rationale: ആവർത്തിച്ചുള്ള ἀπό പ്രയോഗങ്ങൾ സംഘത്തിൽനിന്നുള്ള വേർപാടും അതു പംഫുല്യയിൽ സംഭവിച്ചതുമാണ് സാഹചര്യത്തിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായി സ്ഥലം വ്യക്തമാക്കുന്നു.
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: തങ്ങളോടൊപ്പം പോകാതിരിക്കുകയും
  rationale: യാത്രയുടെയും ശുശ്രൂഷയുടെയും പശ്ചാത്തലത്തിൽ ‘അവരോടൊപ്പം പോകാതിരിക്കുക’ എന്നത് συνέρχομαιയുടെ സഹയാത്രാഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: εἰς τὸ ἔργον
  choice: വേലയ്ക്കായി
  rationale: ‘വേല’ എന്നത് നിർദ്ദിഷ്ട ശുശ്രൂഷാദൗത്യം സൂചിപ്പിക്കുമ്പോഴും ‘ദൗത്യം’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: ഇയാളെ കൂടെക്കൊണ്ടുപോകരുതെന്ന്
  rationale: συμπαραλαμβάνωയുടെ ‘കൂടെ കൊണ്ടുപോകുക’ എന്ന അർഥവും τοῦτον എന്ന നിർദ്ദേശസർവനാമത്തിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വ്യക്തതയോടെ പുനഃക്രമീകരിച്ചിട്ടുണ്ടെങ്കിലും പങ്കാളിക്രിയകളുടെ ബന്ധവും പൗലോസിന്റെ ഉറച്ച നിലപാടും സംരക്ഷിച്ചിട്ടുണ്ട്.
