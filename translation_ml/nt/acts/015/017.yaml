  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: ml
  text: മനുഷ്യരിൽ ശേഷിക്കുന്നവരും എന്റെ നാമം വിളിക്കപ്പെട്ടിട്ടുള്ള എല്ലാ യഹൂദേതരരും കർത്താവിനെ അന്വേഷിക്കേണ്ടതിന്—ഇവ ചെയ്യുന്ന കർത്താവ് അരുളിച്ചെയ്യുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ഈ വാക്കുകൾ ആമോസ് 9:12-നെ ഗ്രീക്ക് തിരുവെഴുത്തുകളിൽ കാണുന്ന രൂപത്തിൽ പ്രതിധ്വനിപ്പിക്കുന്നു; അവിടെ കർത്താവിന്റെ നാമം വഹിക്കുന്ന ജനതകൾക്ക് ഊന്നൽ ലഭിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: അന്വേഷിക്കേണ്ടതിന്
  rationale: ὅπως ἂν എന്നത് മുൻവാക്യത്തോടു ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യ/ഫലസൂചക പ്രയോഗമാണ്. മലയാളത്തിൽ ‘-േണ്ടതിന്’ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκζητήσωσιν
  choice: അന്വേഷിക്കേണ്ടതിന്
  rationale: ἐκζητέω എന്നതിന്റെ അന്വേഷിക്കുക/തേടുക എന്ന അർഥം നിലനിർത്തുന്നു; ഉപസർഗത്തിന്റെ ശക്തി അമിതമായി വിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: മനുഷ്യരിൽ ശേഷിച്ചവർ
  rationale: κατάλοιποι എന്നതിലെ ‘ശേഷിച്ചവർ’ എന്ന പ്രവാചകീയ ഭാവവും ἀνθρώπων എന്നതിലെ പൊതുവായ മനുഷ്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: κύριος എന്നതിനുള്ള സ്വാഭാവികവും സഭാപാരമ്പര്യങ്ങൾക്കതീതമായി പൊതുവേ മനസ്സിലാകുന്നതുമായ മലയാളരൂപം.
- source_word: πάντα τὰ ἔθνη
  choice: യഹൂദേതരരെല്ലാവരും
  rationale: യെരൂശലേം സഭായോഗത്തിന്റെ തൽസന്ദർഭത്തിൽ ἔθνη യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു. ‘സകല ജനതകളും’ എന്ന വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: എന്റെ നാമം വിളിക്കപ്പെട്ടിട്ടുള്ള
  rationale: ദൈവനാമത്താൽ അടയാളപ്പെടുത്തപ്പെട്ട ഉടമസ്ഥത/ബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപം കഴിയുന്നത്ര നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ മലയാളം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: λέγει κύριος
  choice: കർത്താവ് അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകവചനത്തിലെ ദൈവിക പ്രഖ്യാപനസൂത്രം dignified modern Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ποιῶν ταῦτα
  choice: ഇവ ചെയ്യുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: യെരൂശലേം സഭായോഗത്തിലെ ἔθνη എന്ന പദത്തിന്റെ അർഥം
  choice: യഹൂദേതരർ
  alternative: സകല ജനതകളും
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 15-ന്റെ തൽസന്ദർഭം യഹൂദേതരരുടെ ഉൾപ്പെടുത്തലാണ്. എന്നാൽ ആമോസ് ഉദ്ധരണിയിലെ വിശാലമായ ‘ജനതകൾ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ദൈവനാമം ‘വിളിക്കപ്പെടുക’ എന്ന ഉടമസ്ഥതാസൂചക പ്രയോഗം
  choice: എന്റെ നാമം വിളിക്കപ്പെട്ടിട്ടുള്ള
  alternative: എന്റെ നാമത്തിൽ അറിയപ്പെടുന്ന
  rationale: ഗ്രീക്കിലെ അസാധാരണവും ദൈവത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നതുമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ അർഥവിവരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. വാക്യം മുൻവാക്യത്തിലെ ഉദ്ദേശ്യഘടന തുടരുന്നതിനാൽ ‘അന്വേഷിക്കേണ്ടതിന്’ എന്ന ബന്ധിതരൂപം നിലനിർത്തി. ‘വിജാതീയർ’ എന്നതിനുപകരം കൂടുതൽ വ്യക്തവും നിഷ്പക്ഷവുമായ ‘യഹൂദേതരർ’ ഉപയോഗിച്ചു.
