reference: Acts 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς ἀπεκρίθη Ἰάκωβος λέγων· Ἄνδρες ἀδελφοί, ἀκούσατέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: ml
  text: 'അവർ നിശ്ശബ്ദരായശേഷം[a], യാക്കോബ് മറുപടിയായി പറഞ്ഞു: “സഹോദരന്മാരേ[b], എന്റെ വാക്കു കേൾക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ സംസാരിക്കുന്നത് അവസാനിപ്പിച്ചശേഷം.” മുൻപ് സംസാരിച്ചവർ നിശ്ശബ്ദരായ ശേഷമുള്ള സമയത്തെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, “പുരുഷന്മാരേ, സഹോദരന്മാരേ.” ഇത് ഔപചാരികമായ പുരുഷലിംഗസംബോധനമാണ്. സന്ദർഭത്തിൽ കൂടിവന്നിരുന്ന സഹോദരന്മാരെയാണ് നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നത്; എന്നാൽ വിശാലമായ ആ കൂട്ടത്തിൽ മറ്റുള്ളവരും ഉണ്ടായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: അവർ സംസാരിച്ചുതീർന്ന് നിശ്ശബ്ദരായശേഷം
  rationale: μετά + articular infinitive തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു. σιγάω ഇവിടെ മുൻപ്രഭാഷകർ സംസാരിക്കുന്നത് അവസാനിപ്പിച്ച് നിശ്ശബ്ദരായതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഈ രണ്ടു ഭാവങ്ങളും വ്യക്തമാക്കുന്നു.
- source_word: ἀπεκρίθη
  choice: മറുപടിയായി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്ന പദത്തിന്റെ ‘മറുപടി പറയുക/പ്രതികരിക്കുക’ എന്ന അർത്ഥം, മുമ്പത്തെ പ്രസംഗങ്ങൾക്കുശേഷമുള്ള യാക്കോബിന്റെ പ്രതികരണമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἰάκωβος
  choice: യാക്കോബ്
  rationale: ഗ്രീക്ക് Ἰάκωβος എന്ന പേരിന്റെ മൂലരൂപത്തോടും മലയാള ബൈബിൾനാമപരമ്പരയോടും യോജിക്കുന്ന രൂപം.
- source_word: λέγων
  choice: പറഞ്ഞു
  rationale: നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്ന participle മലയാളത്തിലെ സ്വാഭാവിക finite ക്രിയയായി ചേർത്തിരിക്കുന്നു.
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഇരട്ട പുരുഷലിംഗസംബോധനത്തിന്റെ ഔപചാരിക ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായ പുരുഷബഹുവചനമായ ‘സഹോദരന്മാരേ’ എന്നതിലൂടെ നൽകുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἀκούσατέ μου
  choice: ഞാൻ പറയുന്നത് കേൾക്കുക
  rationale: ശ്രദ്ധയോടെ കേൾക്കാനുള്ള imperative ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘എന്നെ കേൾക്കുക’ എന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പൊതുയോഗത്തിലെ പുരുഷലിംഗസംബോധന
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നൽകി പുരുഷലിംഗരൂപം നിലനിർത്തുക
  alternative: സഹോദരീസഹോദരന്മാരേ / സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിൽ ἄνδρες, ἀδελφοί എന്നീ രണ്ടു പുരുഷലിംഗ vocative-കൾ ഉണ്ട്. അതിനാൽ ലിംഗസൂചനയെ നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തുന്നു; സമ്പൂർണ പദശഃ രൂപവും സന്ദർഭവിവരവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പൊതുപ്രസംഗശൈലി. ഗ്രീക്കിലെ സമയക്രമവും ഔപചാരിക പുരുഷലിംഗസംബോധനവും സംരക്ഷിച്ചുകൊണ്ട്, കൃത്രിമമായ പദാനുപദരൂപങ്ങൾ അടിക്കുറിപ്പിലേക്ക് മാറ്റിയിരിക്കുന്നു.
