lexical_decisions:
- source_word: ἀναγνόντες
  choice: അവർ അതു വായിച്ചപ്പോൾ
  rationale: ἀναγινώσκω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ കത്താണ് വായിച്ചതെന്നു സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘അതു’ ചേർത്തു.
- source_word: δὲ
  choice: വാക്യഘടനയിലൂടെ മൃദുവായ തുടർച്ച
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനത്തുടർച്ചയാണ്. മലയാളത്തിലെ ‘വായിച്ചപ്പോൾ’ എന്ന ഘടനയിൽ ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേക സംയോജകപദം ചേർത്തില്ല.
- source_word: ἐχάρησαν
  choice: സന്തോഷിച്ചു
  rationale: χαίρω എന്ന ക്രിയയുടെ സജീവ അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ ‘സന്തോഷിച്ചു’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: ἐπὶ
  choice: നിമിത്തം
  rationale: ദത്തിവോടുകൂടിയ ἐπί ഇവിടെ സന്തോഷത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ഈ കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῇ παρακλήσει
  choice: അതിലെ പ്രോത്സാഹനം
  rationale: παράκλησις എന്നതിന് പ്രോത്സാഹനം, ഉദ്ബോധനം, ആശ്വാസം എന്നീ അർഥസാധ്യതകളുണ്ട്. വിവാദത്തിനു ശേഷമുള്ള കത്തിന്റെ ശക്തിപ്പെടുത്തുന്ന ഫലം സന്ദർഭത്തിൽ മുൻപന്തിയിലായതിനാൽ ‘പ്രോത്സാഹനം’ തിരഞ്ഞെടുത്തു; ‘അതിലെ’ എന്നത് ആ പ്രോത്സാഹനം കത്തിന്റെ ഉള്ളടക്കത്തിൽ നിന്നാണെന്നു വ്യക്തമാക്കുന്നു.
