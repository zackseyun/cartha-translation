  register: സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, ആധുനികവും മാന്യവുമായ മലയാളം. മൂലത്തിലെ സംക്ഷിപ്തതയും παράκλησις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
