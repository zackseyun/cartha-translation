  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: ml
  text: എന്നാൽ പൗലോസും ബർന്നബാസും അന്ത്യോക്യയിൽ കുറെക്കാലം താമസിച്ചു[a]. അവിടെ അവർ മറ്റു പലരോടൊപ്പം കർത്താവിന്റെ വചനം പഠിപ്പിക്കുകയും സുവാർത്ത പ്രഖ്യാപിക്കുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അന്ത്യോക്യയിൽ താമസിച്ചു.’ ഗ്രീക്ക് ക്രിയ അവിടെ ഒരു കാലയളവ് ചെലവഴിച്ചതിനെയോ അവിടെ തുടർന്നിരുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സുവിശേഷം പ്രസംഗിക്കുകയും.’ ഗ്രീക്ക് ക്രിയ നല്ല വാർത്ത അറിയിക്കുകയെയോ പ്രഖ്യാപിക്കുകയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: കുറെക്കാലം താമസിച്ച്
  rationale: ഈ അപൂർണഭൂതകാല ക്രിയ ഒരു സ്ഥലത്ത് ഒരു കാലയളവ് തുടർന്നിരുന്നുവെന്ന ആശയം നൽകുന്നു. ‘കുറെക്കാലം താമസിച്ച്’ എന്നത് ആ ദൈർഘ്യസൂചന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διδάσκοντες
  choice: പഠിപ്പിക്കുകയും
  rationale: താമസിച്ചിരുന്ന കാലത്ത് തുടർന്നുനടന്ന പഠിപ്പിക്കൽ പ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: εὐαγγελιζόμενοι
  choice: സുവാർത്തയായി അറിയിക്കുകയും
  rationale: നല്ല വാർത്ത അറിയിക്കുക എന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുകയും, അതിന്റെ കർമ്മമായ ‘കർത്താവിന്റെ വചനം’ വാക്യത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: മറ്റു പലരോടുമൊപ്പം
  rationale: പൗലോസും ബർന്നബാസും മാത്രമല്ല, വേറെ അനേകരും ഈ ശുശ്രൂഷയിൽ പങ്കാളികളായിരുന്നുവെന്ന ചേർക്കൽഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: λόγον
  choice: വചനം
  rationale: ‘സന്ദേശം’ എന്ന അർഥവും സാധ്യമാണെങ്കിലും, അപ്പൊസ്തലപ്രവൃത്തികളിലെ പരിചിതമായ ‘കർത്താവിന്റെ വചനം’ എന്ന പ്രയോഗത്തിന്റെ സാഹിത്യ-ദൈവശാസ്ത്ര തുടർച്ചയ്ക്കായി ‘വചനം’ നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദവിയെ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി, ഗ്രീക്കിലെ ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കർത്താവിന്റെ വചനം’ എന്നതിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ഗ്രീക്കിലുള്ളതുപോലെ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി സൂചന തുറന്നുവെച്ചു.
  alternative: ‘കർത്താവായ യേശുവിന്റെ വചനം’ എന്നോ ദൈവത്തിൽനിന്നുള്ള സന്ദേശം എന്നോ കൂടുതൽ വ്യക്തമാക്കുക.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ‘കർത്താവ്’ പ്രത്യേകിച്ച് യേശുവിനെ സൂചിപ്പിക്കാവുന്നതാണെങ്കിലും, ഇവിടെ ഗ്രീക്ക് പാഠം κύριος എന്ന പദവിക്ക് അപ്പുറം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വിവർത്തനം സൂചനയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വചനം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. ഗ്രീക്കിലെ രണ്ട് സമകാലിക പ്രവർത്തനങ്ങളും ‘പഠിപ്പിക്കുകയും … അറിയിക്കുകയും’ എന്ന സമാന്തരരൂപത്തിൽ അവതരിപ്പിച്ചു.
