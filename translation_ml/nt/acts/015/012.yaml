source:
  edition: SBLGNT
  text: Ἐσίγησεν δὲ πᾶν τὸ πλῆθος, καὶ ἤκουον Βαρναβᾶ καὶ Παύλου ἐξηγουμένων ὅσα ἐποίησεν ὁ θεὸς σημεῖα καὶ τέρατα ἐν τοῖς ἔθνεσιν δι’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/012.yaml
  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: ml
  text: അവിടെ കൂടിയിരുന്നവരെല്ലാം നിശ്ശബ്ദരായി. ബർന്നബാസും പൗലോസും അവരിലൂടെ ദൈവം ജനതകളുടെ ഇടയിൽ[a] ചെയ്ത എല്ലാ അടയാളങ്ങളെയും അത്ഭുതങ്ങളെയും കുറിച്ച് വിവരിക്കുമ്പോൾ, അവർ ശ്രദ്ധയോടെ കേട്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹൂദേതരരുടെ ഇടയിൽ.” ഈ സന്ദർഭത്തിൽ “ജനതകൾ” എന്നത് പ്രത്യേകിച്ച് യഹൂദേതരരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: നിശ്ശബ്ദരായി
  rationale: ആഖ്യാനത്തിലെ അവസ്ഥാമാറ്റം സൂചിപ്പിക്കുന്ന aorist രൂപത്തിന്റെ സംഭവസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πᾶν τὸ πλῆθος
  choice: കൂടിവന്നവരെല്ലാം
  rationale: യെരൂശലേമിലെ ആലോചനയ്ക്കായി ഒരുമിച്ചുകൂടിയ മുഴുവൻ സമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἤκουον
  choice: ശ്രദ്ധിച്ചു കേട്ടു
  rationale: Imperfect രൂപത്തിലെ തുടർച്ചയായ ശ്രദ്ധാപൂർവമായ കേൾവിയെ വെറും ‘കേട്ടു’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: ബർന്നബാസും പൗലോസും
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ വ്യക്തിനാമരൂപങ്ങൾ സ്വീകരിച്ചു.
- source_word: ἐξηγουμένων
  choice: വിവരിച്ചപ്പോൾ
  rationale: സംഭവങ്ങൾ വിശദമായി പറഞ്ഞറിയിക്കുക അഥവാ വിവരിക്കുക എന്ന പങ്കാളിത്തക്രിയയുടെ അർഥം നൽകുന്നു; വ്യാഖ്യാനിച്ചു എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: ὅσα ... σημεῖα καὶ τέρατα
  choice: ചെയ്ത അടയാളങ്ങളെയും അത്ഭുതങ്ങളെയും കുറിച്ചു
  rationale: ὅσα എന്നത് പിന്നാലെയുള്ള ‘അടയാളങ്ങളും അത്ഭുതങ്ങളും’ എന്ന നാമപദങ്ങളോടു ചേർന്ന ചോദനാത്മകമല്ലാത്ത ബന്ധപ്രയോഗമായി എടുത്തു; മലയാളത്തിൽ സ്വാഭാവികമായി ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: ἐποίησεν ὁ θεὸς
  choice: ദൈവം ... ചെയ്ത
  rationale: വാക്യത്തിലെ കർത്താവ് ദൈവമാണെന്ന മൂലഭാഷയിലെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: σημεῖα καὶ τέρατα
  choice: അടയാളങ്ങളെയും അത്ഭുതങ്ങളെയും
  rationale: ലൂക്കോസിന്റെ രചനകളിൽ ആവർത്തിക്കുന്ന പദജോടിയെ കൃത്യവും സഭാപാരമ്പര്യത്തിൽ പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ യഹൂദേതരരെ സൂചിപ്പിക്കുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δι’ αὐτῶν
  choice: തങ്ങളിലൂടെ
  rationale: ദൈവത്തെ പ്രധാന പ്രവർത്തകനായും ബർന്നബാസിനെയും പൗലോസിനെയും അവന്റെ പ്രവർത്തനമാധ്യമങ്ങളായും കാണിക്കുന്ന διά + genitive എന്ന പ്രയോഗത്തിന്റെ ഉപകരണാർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തോലിക ദൗത്യത്തിലെ ദൈവിക പ്രവർത്തകത്വം
  choice: അടയാളങ്ങളും അത്ഭുതങ്ങളും ചെയ്തവൻ ദൈവമാണ്; അവൻ ബർന്നബാസിലൂടെയും പൗലോസിലൂടെയും പ്രവർത്തിച്ചു.
  alternative: ബർന്നബാസും പൗലോസും തന്നെയാണ് പ്രാഥമിക അർഥത്തിൽ അവ ചെയ്തതെന്ന വായന.
  rationale: ἐποίησεν എന്ന ക്രിയയുടെ കർത്താവ് ὁ θεὸς ആണ്; δι’ αὐτῶν അവരെ പ്രവർത്തനമാധ്യമങ്ങളായി അടയാളപ്പെടുത്തുന്നു. ‘ദൈവം ... തങ്ങളിലൂടെ ചെയ്ത’ എന്ന ക്രമം ഈ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കൂടിവന്നവരെല്ലാം’ deliberative assembly-യുടെ സമൂഹസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു. മൂലത്തിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു വാക്യങ്ങളാക്കി; ആശയബന്ധവും അപൂർണ്ണകാലത്തിന്റെ തുടർച്ചാസ്വഭാവവും ‘വിവരിച്ചപ്പോൾ അവർ ശ്രദ്ധിച്ചു കേട്ടു’ എന്ന ഘടനയിൽ സംരക്ഷിച്ചു.
