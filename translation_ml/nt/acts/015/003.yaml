id: ACT.15.3
reference: Acts 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: ml
  text: അങ്ങനെ, സഭ അവരെ യാത്രയയച്ചശേഷം, അവർ ഫൊയ്നീക്യയിലൂടെയും ശമര്യയിലൂടെയും കടന്നുപോയി; യഹൂദേതരരുടെ മാനസാന്തരത്തെക്കുറിച്ച്[a] അവർ വിശദമായി വിവരിക്കുകയും സഹോദരന്മാർക്കെല്ലാം[b] വലിയ സന്തോഷം ഉളവാക്കുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യഹൂദേതരർ തിരിഞ്ഞതിനെക്കുറിച്ച്.’
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്നത് ഇവിടെ സ്ത്രീകളുൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: സഭ അവരെ യാത്രയയച്ചശേഷം
  rationale: പ്രയാണത്തിനായി വെറുതെ അയയ്ക്കുക എന്നതിലുപരി, യാത്രയ്ക്കാവശ്യമായ സഹായത്തോടെ മുന്നോട്ടയയ്ക്കുക എന്ന προπέμπω എന്ന ക്രിയയുടെ യാത്രാസന്ദർഭപരമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκκλησίας
  choice: സഭ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പദം സാധാരണയായി ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ആ അർഥത്തിൽ ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പദമാണ് ‘സഭ’.
- source_word: διήρχοντο
  choice: കടന്നുപോയി
  rationale: പ്രദേശങ്ങളിലൂടെ തുടർച്ചയായി സഞ്ചരിച്ചെന്ന അപൂർണകാല ക്രിയയുടെ ഭാവം കഥാഖ്യാനത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τήν τε Φοινίκην καὶ Σαμάρειαν
  choice: ഫൊയ്നീക്യയിലൂടെയും ശമര്യയിലൂടെയും
  rationale: τε ... καί രണ്ടു പ്രദേശങ്ങളെയും ചേർത്തുപറയുന്ന ഘടനയായതിനാൽ ‘-യിലൂടെയും ... -യിലൂടെയും’ എന്ന സമാന്തരരൂപം ഉപയോഗിച്ചു.
- source_word: ἐκδιηγούμενοι
  choice: വിശദമായി വിവരിച്ചു
  rationale: സംഭവം പൂർണമായോ വിശദമായോ പറഞ്ഞറിയിക്കുക എന്ന സംയുക്തക്രിയയുടെ ശക്തി വെറും ‘പറഞ്ഞു’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιστροφὴν
  choice: മാനസാന്തരം
  rationale: ഈ സന്ദർഭത്തിൽ യഹൂദേതരർ ദൈവത്തിലേക്കു തിരിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന മതപരമായ പരിവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു; കൂടുതൽ പദാനുസൃതമായ ‘തിരിഞ്ഞുവരവ്’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῶν ἐθνῶν
  choice: യഹൂദേതരരുടെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 15-ലെ പശ്ചാത്തലത്തിൽ ἔθνη യഹൂദന്മാരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘ജനതകൾ’ എന്നതിനെക്കാൾ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: വലിയ സന്തോഷം ഉളവാക്കി
  rationale: ποιέω + നാമം എന്ന കാരകപ്രയോഗത്തെ അർഥനിഷ്ഠമായും സ്വാഭാവികമായും മലയാളത്തിലാക്കുന്നു.
- source_word: ἀδελφοῖς
  choice: സഹോദരന്മാർക്കെല്ലാം
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ സ്ത്രീകളുൾപ്പെടുന്ന വിശ്വാസസമൂഹം ഉദ്ദേശിക്കപ്പെടാമെന്ന ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: യഹൂദേതരരുടെ ഉൾപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട ἐπιστροφήയുടെ പരിഭാഷ
  choice: മാനസാന്തരം
  alternative: തിരിഞ്ഞുവരവ്
  rationale: സുവിശേഷത്തോടുള്ള പ്രതികരണമായി യഹൂദേതരർ ദൈവത്തിലേക്കു തിരിയുന്നതിന്റെ മതപരവും സമൂഹപരവുമായ പ്രാധാന്യം ‘മാനസാന്തരം’ വ്യക്തമാക്കുന്നു; പിന്നീട് രൂപപ്പെട്ട സങ്കീർണ സിദ്ധാന്തവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ കൂടുതൽ പദാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: സമ്മിശ്ര വിശ്വാസസമൂഹത്തിൽ ἀδελφοίയുടെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു. എന്നാൽ ആദിമക്രിസ്തീയ പ്രയോഗത്തിൽ ഇത് സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന സമൂഹത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥാഖ്യാനശൈലി ഉപയോഗിച്ചു. പ്രദേശനാമങ്ങൾക്ക് പ്രചാരത്തിലുള്ള മലയാളരൂപങ്ങൾ സ്വീകരിച്ചു. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്കു തൊട്ടുപിന്നാലെ സ്ഥാപിച്ചു; നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിലെ അടയാളസ്ഥാനങ്ങളിലെ പ്രത്യക്ഷമായ പൊരുത്തക്കേട് തിരുത്തിയിരിക്കുന്നു.
