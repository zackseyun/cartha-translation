  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിലേക്കു തിരിയുന്ന യഹൂദേതര ജനതകളിൽനിന്നുള്ളവരെ[a] നാം ബുദ്ധിമുട്ടിക്കരുതെന്നാണ് എന്റെ വിധി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനതകളിൽനിന്നുള്ളവരെ.” ഇവിടെ “ജനതകൾ” എന്ന ഗ്രീക്കുപദം യഹൂദരല്ലാത്ത ജനതകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവരെ ബുദ്ധിമുട്ടിക്കാതിരിക്കണമെന്നാണ് ഞാൻ വിധിക്കുന്നത്” അല്ലെങ്കിൽ “അവരെ ബുദ്ധിമുട്ടിക്കരുതെന്നാണ് എന്റെ തീരുമാനം.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: യാക്കോബിന്റെ മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐγὼ κρίνω
  choice: എന്റെ വിധി
  rationale: ഒന്നാംപുരുഷ ഏകവചനത്തിലുള്ള യാക്കോബിന്റെ പരിഗണിച്ച തീരുമാനത്തെ നിലനിർത്തുന്നു; വാക്യാവസാനത്തെ ഈ ഘടന മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: μὴ παρενοχλεῖν
  choice: നാം ബുദ്ധിമുട്ടിക്കരുത്
  rationale: παρενοχλέω സൂചിപ്പിക്കുന്ന പ്രയാസമോ തടസ്സമോ ഉണ്ടാക്കൽ വ്യക്തമാക്കുന്നു; സഭയോടുള്ള നിർദേശത്തിന്റെ കൂട്ടായ പ്രായോഗിക ശക്തിയും പ്രകടമാക്കുന്നു.
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: ജനതകളിൽനിന്നുള്ളവരെ
  rationale: വിവിധ ജനതകളിൽനിന്നു വരുന്ന വ്യക്തികളെയാണ് വാചകം സൂചിപ്പിക്കുന്നത് എന്ന ഘടന സംരക്ഷിക്കുന്നു.
- source_word: ἐθνῶν
  choice: ജനതകൾ
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ἐπιστρέφουσιν
  choice: തിരിയുന്ന
  rationale: ദൈവത്തിലേക്കുള്ള ഇപ്പോൾ നടന്നുകൊണ്ടിരിക്കുന്ന തിരിവിന്റെ ദൃശ്യഭാവം സംരക്ഷിക്കുന്നു; സാങ്കേതിക മതപരിവർത്തനപദം ഒഴിവാക്കുന്നു.
- source_word: ἐπὶ τὸν θεόν
  choice: ദൈവത്തിലേക്ക്
  rationale: തിരിവിന്റെ ലക്ഷ്യവും ദിശയും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഇത് യാക്കോബിന്റെ വ്യക്തിപരമായ അഭിപ്രായമാത്രമാണോ, സഭയ്ക്കുള്ള കൂട്ടായ നിർദേശമാണോ
  choice: “നാം ബുദ്ധിമുട്ടിക്കരുതെന്നാണ് എന്റെ വിധി”
  alternative: “അവരെ ബുദ്ധിമുട്ടിക്കാതിരിക്കണമെന്നാണ് ഞാൻ വിധിക്കുന്നത്”
  rationale: κρίνω എന്ന ഒന്നാംപുരുഷ ഏകവചനം യാക്കോബിന്റെ വ്യക്തിപരമായ വിധിയെ സൂചിപ്പിക്കുന്നു; അതിനെ ആശ്രയിക്കുന്ന infinitive സഭയുടെ കൂട്ടായ നടപടിയെ സംബന്ധിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം ഈ രണ്ടു വശങ്ങളും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നിഗമനക്രമവും ദൈവത്തിലേക്കുള്ള ‘തിരിവ്’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു; ‘ജനതകൾ/ജാതികൾ’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
