id: ACT.15.21
reference: Acts 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ ἐκ γενεῶν ἀρχαίων κατὰ πόλιν τοὺς κηρύσσοντας αὐτὸν ἔχει ἐν ταῖς συναγωγαῖς κατὰ πᾶν σάββατον ἀναγινωσκόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: ml
  text: കാരണം, പുരാതന തലമുറകൾ മുതൽ ഓരോ പട്ടണത്തിലും മോശെയെ പ്രഖ്യാപിക്കുന്നവർ ഉണ്ട്; എല്ലാ ശബ്ബത്തിലും സിനഗോഗുകളിൽ അദ്ദേഹം വായിക്കപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘മോശെ … അദ്ദേഹത്തെ പ്രഖ്യാപിക്കുന്നവർ … അദ്ദേഹം വായിക്കപ്പെടുന്നു.’ ഇവിടെ ‘മോശെ’ എന്നത് അദ്ദേഹവുമായി ബന്ധപ്പെട്ട രചനകളെയോ ന്യായപ്രമാണത്തെയോ സൂചിപ്പിക്കുന്ന പ്രതിനിധിപദമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം; മൂലത്തിലെ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: —വല്ലോ
  rationale: മുൻവിധിക്കുള്ള വിശദീകരണകാരണം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വാക്യാന്ത്യത്തിലെ ഈ പ്രയോഗം γάρ-ന്റെ explanatory force നൽകുന്നു.
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: പുരാതന തലമുറകൾമുതൽ
  rationale: കാലപരമായ ദീർഘതയും γενεῶν എന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: κατὰ πόλιν
  choice: എല്ലാ പട്ടണങ്ങളിലും
  rationale: κατά + ഏകവചന നാമത്തിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: മോശെയെ പ്രസംഗിക്കുന്നവർ
  rationale: κηρύσσω എന്ന പരസ്യപ്രഖ്യാപനാർഥവും αὐτόν എന്ന വ്യക്തിപരമായ സർവനാമത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു; ഇവിടെ മോശെ അദ്ദേഹവുമായി ബന്ധപ്പെട്ട രചനകൾക്കുള്ള പ്രതിനിധിപദമാണ്.
- source_word: ἔχει
  choice: ഉണ്ടായിട്ടുണ്ട്
  rationale: പുരാതനകാലംമുതൽ വർത്തമാനംവരെ തുടരുന്ന അവസ്ഥ മലയാളത്തിലെ present-perfect സ്വഭാവമുള്ള പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: വായന നടക്കുന്ന പതിവുസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ പരിചിതമായ പദരൂപം ഉപയോഗിക്കുന്നു.
- source_word: κατὰ πᾶν σάββατον
  choice: എല്ലാ ശബ്ബത്തിലും
  rationale: ക്രമമായി ആവർത്തിക്കുന്ന ഓരോ ശബ്ബത്തിന്റെയും അർഥം നിലനിർത്തുന്നു.
- source_word: ἀναγινωσκόμενος
  choice: അദ്ദേഹം വായിക്കപ്പെടുന്നുവല്ലോ
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉപവാക്യമായി നൽകുന്നു; ‘മോശെ വായിക്കപ്പെടുന്നു’ എന്ന മൂലത്തിലെ metonymy സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മോശെ എന്ന പേരിന്റെ metonymic പ്രയോഗം
  choice: ‘മോശെ’/‘അദ്ദേഹം’ എന്ന വ്യക്തിപരമായ പരാമർശം നിലനിർത്തി.
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണം’ അല്ലെങ്കിൽ ‘മോശെയുടെ രചനകൾ’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം മോശെയെയും അദ്ദേഹത്തെയും നേരിട്ട് പറയുന്നു; അദ്ദേഹവുമായി ബന്ധപ്പെട്ട രചനകൾ/ന്യായപ്രമാണം ഉദ്ദേശിക്കുന്ന metonymy വിശദീകരണക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നതാണ് മൂലത്തോട് കൂടുതൽ വിശ്വസ്തം.
- issue: ἀναγινωσκόμενος എന്ന കൃദന്തരൂപത്തിന്റെ ബന്ധം
  choice: വിശദീകരണസ്വഭാവം ‘—വല്ലോ’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ നൽകി; കർശനമായ കാരണബന്ധം നിർബന്ധിച്ചില്ല.
  alternative: ‘അദ്ദേഹം വായിക്കപ്പെടുന്നതിനാൽ’ എന്ന് വ്യക്തമായ കാരണവാക്യമായി നൽകുക.
  rationale: കൃദന്തരൂപം പശ്ചാത്തലമോ വിശദീകരണമോ നൽകുന്നു; കാരണം എന്ന വ്യാഖ്യാനം സാധ്യമെങ്കിലും അത് വ്യാകരണത്തിൽ നിർബന്ധിതമല്ല. അതിനാൽ അവ്യക്തത പൂർണമായി ഇല്ലാതാക്കാതെ സ്വാഭാവിക മലയാളം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം. ‘പ്രസംഗിക്കുന്നവർ’ പ്രഖ്യാപനാർഥമുള്ള കൃത്യമായ സഭാപരിചിത പദമാണ്. ‘അദ്ദേഹം വായിക്കപ്പെടുന്നു’ അല്പം അസാധാരണമായി തോന്നാമെങ്കിലും മൂലത്തിലെ ഉദ്ദേശ്യപൂർവമായ metonymy നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതു വ്യക്തമാക്കുന്നു.
