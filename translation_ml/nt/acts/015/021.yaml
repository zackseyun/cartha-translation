revisions:
- from: പുരാതന തലമുറകൾമുതൽ എല്ലാ പട്ടണങ്ങളിലും മോശെയെ പ്രസംഗിക്കുന്നവർ ഉണ്ടായിട്ടുണ്ട്; എല്ലാ ശബ്ബത്തിലും സിനഗോഗുകളിൽ അദ്ദേഹം വായിക്കപ്പെടുന്നുവല്ലോ.[a]
  to: കാരണം, പുരാതന തലമുറകൾ മുതൽ ഓരോ പട്ടണത്തിലും മോശെയെ പ്രഖ്യാപിക്കുന്നവർ ഉണ്ട്; എല്ലാ ശബ്ബത്തിലും സിനഗോഗുകളിൽ അദ്ദേഹം വായിക്കപ്പെടുന്നു.[a]
  rationale: ‘കാരണം’ verse-initially renders γάρ as the explanation for the preceding judgment, rather than attaching that force solely to the final reading statement. ‘ഓരോ പട്ടണത്തിലും’ expresses the distributive κατά construction. The metonymic ‘മോശെ’/‘അദ്ദേഹം’ is retained in the main text, with the footnote clarifying its reference. The second clause remains explanatory/attendant in sense without adding an explicit causal conjunction.
