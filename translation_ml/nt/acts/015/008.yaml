revisions:
- from: ഹൃദയങ്ങളെ അറിയുന്ന ദൈവം[a] നമുക്കു തന്നതുപോലെ അവർക്കും പരിശുദ്ധാത്മാവിനെ നൽകി അവർക്കുവേണ്ടി സാക്ഷ്യം നൽകി.
  to: ഹൃദയങ്ങളെ അറിയുന്ന ദൈവം[a], നമുക്കു തന്നതുപോലെ അവർക്കും പരിശുദ്ധാത്മാവിനെ നൽകിക്കൊണ്ട്, അവർക്കു സാക്ഷ്യം നൽകി.
  rationale: 'The revision preserves the source’s sequence and syntax: God bore witness to them by giving them the Holy Spirit just as he gave it to us. It avoids adding the more interpretive “on their behalf” while retaining the contextual force of God’s testimony through the gift.'
  reviewer_model: gpt-5.6-terra
