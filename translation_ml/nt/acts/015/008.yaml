id: ACT.15.8
reference: Acts 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: ml
  text: ഹൃദയങ്ങളെ അറിയുന്ന ദൈവം[a], നമുക്കു തന്നതുപോലെ അവർക്കും പരിശുദ്ധാത്മാവിനെ നൽകിക്കൊണ്ട്, അവർക്കു സാക്ഷ്യം നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഹൃദയജ്ഞനായ ദൈവം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδιογνώστης
  choice: ഹൃദയങ്ങളെ അറിയുന്ന
  rationale: അപൂർവമായ ഈ സംയുക്തപദം മനുഷ്യരുടെ അന്തരംഗം അറിയുന്നവൻ എന്ന ദൈവിക വിശേഷണം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ബന്ധവാക്യമായി പരിഭാഷപ്പെടുത്തി; ബഹുവചനമായ ‘ഹൃദയങ്ങളെ’ മൂലപദത്തിന്റെ പൊതുവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: θεὸς
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ സാധാരണ മലയാള പരിഭാഷ. καρδιογνώστης ഇതിനെ വിശേഷിപ്പിക്കുന്നു.
- source_word: ἐμαρτύρησεν
  choice: സാക്ഷ്യം നൽകി
  rationale: ദൈവം അവരെ അംഗീകരിച്ചതിന് തെളിവ് നൽകിയെന്ന ന്യായവാദപരമായ അർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: αὐτοῖς
  choice: അവർക്കുവേണ്ടി
  rationale: സന്ദർഭത്തിൽ വിജാതീയരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സർവനാമം. μαρτυρέω എന്ന ക്രിയയോടൊപ്പം ദൈവം അവരുടെ പക്ഷത്ത് സാക്ഷ്യം നൽകി എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δοὺς
  choice: നൽകി
  rationale: ദൈവം എങ്ങനെ സാക്ഷ്യം നൽകി എന്നു വ്യക്തമാക്കുന്ന മാർഗസൂചക ക്രിയാവിശേഷണരൂപമായി അവതരിപ്പിച്ചു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: ഈ സ്ഥിരമായ ദൈവിക നാമത്തിന്റെ ആധുനിക മാനക മലയാള രൂപം.
- source_word: καθὼς καὶ ἡμῖν
  choice: നമുക്കു തന്നതുപോലെ അവർക്കും
  rationale: ഗ്രീക്കിൽ മുൻപുള്ള ‘നൽകി’ എന്ന ക്രിയ ഇവിടെ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നു. മലയാളത്തിൽ താരതമ്യം സ്വാഭാവികമാക്കുകയും καίയുടെ ‘അവർക്കും’ എന്ന ഉൾക്കൊള്ളുന്ന ഊന്നൽ നിലനിർത്തുകയും ചെയ്തു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിന്റെ ദാനത്താൽ തെളിയിക്കപ്പെട്ട ദൈവിക അംഗീകാരം
  choice: ‘അവർ’ എന്ന സർവനാമം നിലനിർത്തി, അവർക്കു പരിശുദ്ധാത്മാവിനെ നൽകിയതാണ് ദൈവത്തിന്റെ സാക്ഷ്യം എന്നു വാക്യം വ്യക്തമാക്കുന്നു.
  alternative: ‘അവർ’ എന്നതിനു പകരം ‘വിജാതീയർ’ എന്നു സന്ദർഭവിവരം വാക്യത്തിൽ നേരിട്ട് ചേർക്കുക.
  rationale: αὐτοῖς എന്നത് സർവനാമം മാത്രമാണ്; അത് വിജാതീയരെ സൂചിപ്പിക്കുന്നു എന്ന വിവരം സമീപസന്ദർഭത്തിൽനിന്നാണ് ലഭിക്കുന്നത്. അതിനാൽ മൂലവാക്യത്തിൽ ഇല്ലാത്ത തിരിച്ചറിയൽ നേരിട്ട് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ഗൗരവവും സ്വാഭാവികതയും സംരക്ഷിച്ചു. ‘ഹൃദയങ്ങളെ അറിയുന്ന’ എന്നത് ദൈവത്തിന്റെ അന്തരംഗജ്ഞാനം വ്യക്തമായി അറിയിക്കുന്നു; അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദമായ ബദൽ നൽകി.
