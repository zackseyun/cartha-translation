  rationale: ‘രക്ഷിക്കപ്പെടുമെന്ന്’ എന്ന രൂപം രക്ഷയുടെ പ്രതീക്ഷിത പൂർത്തീകരണത്തെ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു. ‘അവരും അതേവിധത്തിൽ രക്ഷിക്കപ്പെടും’ ഗ്രീക്കിൽ സംക്ഷിപ്തമായി വിടപ്പെട്ട ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയാക്കുന്നു; ഇതിലൂടെ യഹൂദരായ ‘നാം’ ജാതികളായ ‘അവർ’ രക്ഷിക്കപ്പെടുന്ന അതേവിധത്തിൽ രക്ഷിക്കപ്പെടുമെന്ന താരതമ്യദിശയും നിലനിൽക്കുന്നു.
