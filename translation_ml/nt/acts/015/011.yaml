id: ACT.15.11
reference: Acts 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: ml
  text: എന്നാൽ കർത്താവായ യേശുവിന്റെ കൃപയിലൂടെ നാം രക്ഷിക്കപ്പെടുമെന്ന് വിശ്വസിക്കുന്നു; അവരും അതേവിധത്തിൽ രക്ഷിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കർത്താവായ യേശുവിന്റെ കൃപയിലൂടെ നാം രക്ഷിക്കപ്പെടുമെന്ന് വിശ്വസിക്കുന്നു; അവരും അതേവിധത്തിൽ.” അവസാനഭാഗത്തിൽ ഗ്രീക്കിൽ ‘രക്ഷിക്കപ്പെടും’ എന്ന ക്രിയ വിടപ്പെട്ടിരിക്കുന്നു.'
    reason: ഗ്രീക്കിലെ ഇൻഫിനിറ്റീവ് ഘടനയും അവസാനത്തിലെ സംക്ഷിപ്ത താരതമ്യവും കാണിക്കുന്ന പകരം പരിഭാഷ.
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുമ്പ് പറഞ്ഞ, വഹിക്കാനാവാത്ത നുകത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയോട് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: διὰ τῆς χάριτος
  choice: കൃപയിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മാർഗമോ മാധ്യമമോ സൂചിപ്പിക്കുന്നു; സ്വാഭാവിക മലയാളത്തിൽ ‘കൃപയിലൂടെ’ അത് നിലനിർത്തുന്നു.
- source_word: χάριτος
  choice: കൃപ
  rationale: രക്ഷയുടെ മാർഗമായി ദൈവിക കൃപയെ സൂചിപ്പിക്കുന്ന, മലയാള ക്രൈസ്തവ ഭാഷയിൽ സുപരിചിതവും കൃത്യവുമായ പദം.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ
  rationale: ജനിറ്റീവ് ‘കൃപ’യെ വിശേഷിപ്പിക്കുന്നു; ‘കർത്താവായ യേശു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
- source_word: πιστεύομεν
  choice: നാം ... വിശ്വസിക്കുന്നു
  rationale: വക്താക്കളായ യഹൂദവിശ്വാസികളെ ഉൾക്കൊള്ളുന്ന ഒന്നാംപുരുഷ ബഹുവചനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σωθῆναι
  choice: രക്ഷിക്കപ്പെടുന്നതെന്ന്
  rationale: എയോറിസ്റ്റ് പാസീവ് ഇൻഫിനിറ്റീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉള്ളടക്കവാക്യമായി നൽകുന്നു; കാലസൂചനയെ അനാവശ്യമായി അതിനിർണ്ണയിക്കുന്നില്ല.
- source_word: καθ’ ὃν τρόπον
  choice: അതേവിധത്തിലാണ്
  rationale: രീതിയിലുള്ള താരതമ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κἀκεῖνοι
  choice: അവരും
  rationale: καὶ ἐκεῖνοι എന്ന സംയുക്തരൂപത്തിലെ ‘അവരും’ എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ജാതികളെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: പത്രോസിന്റെ താരതമ്യത്തിന്റെ ദിശ
  choice: ‘നാം’ രക്ഷിക്കപ്പെടുന്നതിനെ ‘അവരും’ രക്ഷിക്കപ്പെടുന്ന അതേവിധത്തോട് താരതമ്യം ചെയ്യുന്നു.
  alternative: അവർ നമ്മെപ്പോലെ രക്ഷിക്കപ്പെടും.
  rationale: ഗ്രീക്ക് വാക്യക്രമവും ആശയഗതിയും യഹൂദരായ ‘നാം’ എന്ന വിഭാഗത്തിന്റെ രക്ഷയെ ജാതികളായ ‘അവർ’ എന്ന വിഭാഗത്തിന്റെ രക്ഷയോട് താരതമ്യം ചെയ്യുന്നു. ജാതികൾ യഹൂദരാകണമെന്ന ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: കൃപയിലൂടെയുള്ള രക്ഷയുടെ സ്വഭാവം
  choice: രക്ഷ കർത്താവായ യേശുവിന്റെ കൃപയിലൂടെയാണെന്ന് മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: വിശ്വാസം, പ്രവൃത്തികൾ, രക്ഷാക്രമം എന്നിവയെക്കുറിച്ചുള്ള പിന്നീടുള്ള സമ്പ്രദായസൂത്രങ്ങൾ ചേർക്കുക.
  rationale: മൂലവാക്യം പറയുന്നതിലപ്പുറം ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ സിദ്ധാന്തഭാഷ വിവർത്തനത്തിൽ ഇറക്കുമതി ചെയ്യാതിരിക്കാൻ.
- issue: σωθῆναι എന്നതിന്റെ കാലപരമായ അർത്ഥം
  choice: പ്രധാനപാഠത്തിൽ ‘രക്ഷിക്കപ്പെടുന്നു’ എന്ന മലയാള ഉള്ളടക്കവാക്യം ഉപയോഗിച്ച് കാലസൂചന തുറന്നുവയ്ക്കുന്നു.
  alternative: ‘രക്ഷിക്കപ്പെടും’ എന്ന് വ്യക്തമായ ഭാവികാലമായി നൽകുക.
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റ് ഇൻഫിനിറ്റീവ് സ്വതവേ ഭാവികാലരൂപമല്ല; സന്ദർഭം ഭാവിപൂർണത ഉൾക്കൊള്ളാമെങ്കിലും അതിനെ മാത്രം നിർബന്ധിക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർത്താവ്’, ‘കൃപ’, ‘രക്ഷിക്കപ്പെടുക’ എന്നീ സുപരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ താരതമ്യദിശ വ്യക്തമാക്കാൻ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
