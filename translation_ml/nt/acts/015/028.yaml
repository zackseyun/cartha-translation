lexical_decisions:
- source_word: ἔδοξεν
  choice: ഉചിതമായി തോന്നി
  rationale: ഗ്രീക്കിലെ ആലോചനാപൂർവമായ തീരുമാനശൈലി നിലനിർത്തുന്നു; വെറും വ്യക്തിപരമായ അഭിപ്രായമെന്നോ അതേസമയം മൂലപാഠത്തേക്കാൾ കർശനമായ ഔദ്യോഗിക വിധിയെന്നോ ആക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിനും
  rationale: ἔδοξεν എന്ന പ്രയോഗത്തോടു ചേരുന്ന ദത്തിവ് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുകയും പരിശുദ്ധാത്മാവിന്റെ വ്യക്തിപരമായ പ്രവർത്തനശേഷി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καὶ ἡμῖν
  choice: ഞങ്ങൾക്കും
  rationale: പരിശുദ്ധാത്മാവിനോടൊപ്പം സഭാനേതാക്കളും ഈ തീരുമാനത്തെ അംഗീകരിച്ചതെന്ന സമാന്തരഘടന വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: μηδὲν πλέον ... βάρος
  choice: മറ്റൊരു ഭാരവും
  rationale: നിർദേശിക്കപ്പെട്ട കാര്യങ്ങൾക്കപ്പുറം അധികബാധ്യത ചുമത്തുകയില്ലെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπιτίθεσθαι ὑμῖν
  choice: നിങ്ങളുടെമേൽ ചുമത്തരുതെന്ന്
  rationale: ഭാരം ഒരാളുടെമേൽ വെക്കുക എന്ന മൂലപാഠത്തിലെ രൂപകം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: πλὴν τούτων τῶν ἐπάναγκες
  choice: അത്യാവശ്യമായ ഈ കാര്യങ്ങളല്ലാതെ
  rationale: അടുത്ത വാക്യത്തിൽ പറയുന്ന നിർദേശങ്ങളിലേക്കുള്ള സൂചന നിലനിർത്തുന്നു; അവയുടെ ദൈവശാസ്ത്രപരമായ സ്വഭാവം മുൻകൂട്ടി നിർവചിക്കുന്നില്ല.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ പ്രസ്താവനയ്ക്ക് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവും സഭാസമ്മേളനവും തമ്മിലുള്ള തീരുമാനബന്ധം
  choice: “പരിശുദ്ധാത്മാവിനും ഞങ്ങൾക്കും ഉചിതമായി തോന്നി” എന്ന ഏകോപിത അംഗീകാരഭാഷ നിലനിർത്തി.
  alternative: ഇത് മനുഷ്യരുടെ സമവായം മാത്രമായിരുന്നുവെന്നോ, പരിശുദ്ധാത്മാവ് വ്യക്തിത്വമില്ലാത്ത ഒരു സ്വാധീനം മാത്രമായിരുന്നുവെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്കിൽ പരിശുദ്ധാത്മാവും “ഞങ്ങളും” ഒരേ ἔδοξεν എന്ന ക്രിയയോടു ദത്തിവിൽ ഏകോപിപ്പിച്ചിരിക്കുന്നു. പരിഭാഷ ഈ ഘടന സംരക്ഷിക്കുന്നു; അതിന്റെ പ്രവർത്തനരീതി അതിലധികം വിശദീകരിക്കുന്നില്ല.
- issue: ജാതികളിൽനിന്നുള്ള വിശ്വാസികൾക്കു നൽകിയ നിർദേശങ്ങളുടെ ബാധ്യത
  choice: പറയപ്പെടുന്ന അത്യാവശ്യകാര്യങ്ങൾക്കപ്പുറം മറ്റൊരു ഭാരവും ചുമത്താതിരിക്കുക എന്ന പരിമിതമായ പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാ ബാധ്യതകളുടെയും സമ്പൂർണ നിരാകരണമെന്നോ മോശൈകന്യായപ്രമാണം മുഴുവൻ ചുമത്തുന്നതെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: μηδὲν πλέον ... πλὴν എന്ന ഘടന നിർദേശങ്ങളുടെ പരിധി വ്യക്തമാക്കുന്നു; എന്നാൽ ന്യായപ്രമാണവും കൃപയും സംബന്ധിച്ച പിൽക്കാല വ്യവസ്ഥകൾ മൂലപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. “നിങ്ങളുടെമേൽ ചുമത്തുക” എന്നത് ഭാരത്തിന്റെ രൂപകം നിലനിർത്തുന്നു. വാക്യം അടുത്ത വാക്യത്തിലെ പട്ടികയിലേക്ക് നയിക്കുന്നതിനാൽ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
