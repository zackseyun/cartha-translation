  text: എന്തെന്നാൽ, ഈ ആവശ്യമായ കാര്യങ്ങളല്ലാതെ യാതൊരു അധികഭാരവും നിങ്ങളുടെമേൽ ചുമത്തരുതെന്ന് പരിശുദ്ധാത്മാവിനും ഞങ്ങൾക്കും ഉചിതമായി തോന്നി:[a][b]
