reference: Acts 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: ml
  text: പകരം, വിഗ്രഹങ്ങളോടു ബന്ധപ്പെട്ട മലിനതകളിൽനിന്നും[a] ലൈംഗിക അധാർമികതയിൽനിന്നും[b] ശ്വാസംമുട്ടിച്ചു കൊന്നതിൽനിന്നും[c] രക്തത്തിൽനിന്നും വിട്ടുനിൽക്കണമെന്ന് അവർക്കു എഴുതണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘വിഗ്രഹങ്ങളാൽ മലിനമായവയിൽനിന്നും.’ ചില പരിഭാഷകൾ ഇതിനെ ‘വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം’ എന്നു ചുരുക്കുന്നു; എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് അതിലും വിശാലമായ അർഥമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വ്യഭിചാരത്തിൽനിന്നും.’ ഗ്രീക്ക് പദത്തിന് ലൈംഗിക അധാർമികതയെ വിശാലമായി സൂചിപ്പിക്കാം; ഇവിടെ അത് പ്രത്യേകമായി നിരോധിത ലൈംഗികബന്ധങ്ങളെ ഉദ്ദേശിക്കുന്നുവെന്നും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ശ്വാസംമുട്ടിച്ചു കൊന്നത്’; രക്തം ശരിയായി വാർന്നുപോകാത്തവിധം കൊന്ന മൃഗത്തിന്റെ മാംസത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: അവർക്കു എഴുതണം
  rationale: യെരൂശലേം സഭയുടെ കത്തിന്റെ പശ്ചാത്തലത്തിൽ, എഴുത്തിലൂടെ നിർദേശം അറിയിക്കുന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπέχεσθαι
  choice: വിട്ടുനിൽക്കണമെന്ന്
  rationale: ഒരു കാര്യത്തിൽനിന്ന് സ്വയം ഒഴിഞ്ഞുനിൽക്കുക എന്ന മധ്യമപ്രയോഗത്തിന്റെ ധാർമികവും നിർദേശാത്മകവുമായ അർഥം നൽകുന്നു.
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: വിഗ്രഹങ്ങളോടു ബന്ധപ്പെട്ട മലിനതകളിൽനിന്നും
  rationale: വിഗ്രഹാർപ്പിത ഭക്ഷണം എന്നു മാത്രം ചുരുക്കാതെ, വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട ആചാരപരമായ മലിനത എന്ന വിശാലമായ ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: πορνείας
  choice: ലൈംഗിക അധാർമികതയിൽനിന്നും
  rationale: വിവാഹത്തിനു മുമ്പുള്ള ലൈംഗികബന്ധം എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ, ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ ലൈംഗിക അനാചാരസൂചന സംരക്ഷിക്കുന്നു.
- source_word: τοῦ πνικτοῦ
  choice: ശ്വാസംമുട്ടിച്ചു കൊന്നവയിൽനിന്നും
  rationale: ‘മാംസം’ എന്നു മൂലപാഠത്തിൽ ഇല്ലാത്തത് പ്രധാനവാചകത്തിൽ ചേർക്കാതെ, രക്തം വാർന്നുപോകാത്തവിധം കൊന്ന മൃഗത്തെ സൂചിപ്പിക്കുന്ന നാമവിശേഷണപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τοῦ αἵματος
  choice: രക്തത്തിൽനിന്നും
  rationale: ഗ്രീക്ക് പാഠത്തിന്റെ സംക്ഷിപ്തത പാലിക്കുന്നു; ഭക്ഷണമെന്നോ ഉപയോഗമെന്നോ പ്രധാനവാചകത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: വിഗ്രഹങ്ങളുമായി ബന്ധപ്പെട്ട വിലക്കിന്റെ വ്യാപ്തി
  choice: വിഗ്രഹങ്ങളോടു ബന്ധപ്പെട്ട മലിനതകൾ
  alternative: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം
  rationale: ἀλισγημάτων എന്ന പദം εἰδωλόθυτα എന്നതിനെക്കാൾ വിശാലമാണ്; അതിനാൽ വിലക്കിനെ ഭക്ഷണത്തിലേക്കു മാത്രം ചുരുക്കിയിട്ടില്ല.
- issue: അപ്പൊസ്തലിക നിർദേശത്തിലെ πορνεία എന്ന പദത്തിന്റെ അർഥം
  choice: ലൈംഗിക അധാർമികത
  alternative: വ്യഭിചാരം; നിരോധിത ലൈംഗികബന്ധങ്ങൾ
  rationale: പൊതുവായ ലൈംഗികപാപമാണോ ചില പ്രത്യേക നിരോധിത ബന്ധങ്ങളാണോ എന്ന വ്യാഖ്യാനവ്യത്യാസം പ്രധാനവാചകത്തിൽ തീർപ്പാക്കാതെ പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- issue: പട്ടികപ്പെടുത്തിയ വിലക്കുകളുടെ കാലാവധിയും ദൈവശാസ്ത്രപരമായ നിലയും
  choice: വിട്ടുനിൽക്കേണ്ട കാര്യങ്ങളുടെ പട്ടികയായി മാത്രം അവതരിപ്പിച്ചു
  alternative: യഹൂദ-ജാതി കൂട്ടായ്മയ്ക്കുള്ള താൽക്കാലിക ക്രമീകരണം; എല്ലാ വിശ്വാസികൾക്കും സ്ഥിരമായ കല്പന
  rationale: ഈ വാക്യം വിലക്കുകൾ പ്രസ്താവിക്കുന്നുവെങ്കിലും അവയുടെ കാലാവധിയോ സമ്പൂർണ ദൈവശാസ്ത്രപരമായ ഉദ്ദേശ്യമോ വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ സമാന്തര പട്ടികാസംവിധാനം ‘-യിൽനിന്നും’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി; വ്യാഖ്യാനപരമായ ചുരുക്കലുകൾ പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി.
