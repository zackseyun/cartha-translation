revisions:
- from: എന്നാൽ പൗലോസും ബർന്നബാസും അവരുമായി കടുത്ത ഭിന്നതയിലും വലിയ വാദപ്രതിവാദത്തിലും ഏർപ്പെട്ടപ്പോൾ,[a] ഈ പ്രശ്നത്തെക്കുറിച്ച് അപ്പൊസ്തലന്മാരെയും മൂപ്പന്മാരെയും കാണാൻ പൗലോസും ബർന്നബാസും അവരുടെ കൂട്ടത്തിൽനിന്ന് മറ്റു ചിലരും യെരൂശലേമിലേക്കു കയറിപ്പോകണമെന്ന്[b] അവർ നിശ്ചയിച്ചു.[c]
  to: എന്നാൽ, പൗലോസിനും ബർന്നബാസിനും അവരോടു ഗണ്യമായ ഭിന്നതയും വാദപ്രതിവാദവും ഉണ്ടായപ്പോൾ,[a] ഈ വിഷയത്തെക്കുറിച്ച് യെരൂശലേമിലെ അപ്പൊസ്തലന്മാരുടെയും മൂപ്പന്മാരുടെയും അടുക്കലേക്കു പൗലോസും ബർന്നബാസും അവരുടെ കൂട്ടത്തിൽനിന്നുള്ള മറ്റു ചിലരും കയറിപ്പോകാൻ[b] അവർ നിശ്ചയിച്ചു.[c]
  rationale: The revision removes the interpretive addition ‘കാണാൻ’ and directly renders the movement toward the apostles and elders. It also gives the Greek litotes a unified, natural Malayalam equivalent while retaining its literal form and rhetorical force in the footnote. No doctrinal or polity-specific interpretation has been added.
