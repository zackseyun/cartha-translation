id: ACT.15.2
reference: Acts 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: ml
  text: എന്നാൽ, പൗലോസിനും ബർന്നബാസിനും അവരോടു ഗണ്യമായ ഭിന്നതയും വാദപ്രതിവാദവും ഉണ്ടായപ്പോൾ,[a] ഈ വിഷയത്തെക്കുറിച്ച് യെരൂശലേമിലെ അപ്പൊസ്തലന്മാരുടെയും മൂപ്പന്മാരുടെയും അടുക്കലേക്കു പൗലോസും ബർന്നബാസും അവരുടെ കൂട്ടത്തിൽനിന്നുള്ള മറ്റു ചിലരും കയറിപ്പോകാൻ[b] അവർ നിശ്ചയിച്ചു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ചെറിയതല്ലാത്ത ഭിന്നതയും വാദപ്രതിവാദവും.’ തർക്കത്തിന്റെ ഗൗരവം ഊന്നിപ്പറയാൻ ഗ്രീക്കിൽ നിഷേധരൂപത്തിലുള്ള പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: യെരൂശലേമിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കാൻ ഗ്രീക്കിൽ പതിവായി ഉപയോഗിക്കുന്ന പ്രയോഗമാണ് ‘കയറിപ്പോകുക.’
    reason: cultural_note
  - marker: c
    text: ‘അവർ തീരുമാനിച്ചു’ അല്ലെങ്കിൽ ‘അവർ ക്രമീകരിച്ചു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης δὲ
  choice: എന്നാൽ ... ഏർപ്പെട്ടപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പ്രധാന പ്രവൃത്തിയുടെ പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്നു. δέയുടെ ബന്ധക-വൈരുധ്യഭാവം ‘എന്നാൽ’ നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാലസംബന്ധം ‘ഏർപ്പെട്ടപ്പോൾ’ നൽകുന്നു.
- source_word: στάσεως καὶ ζητήσεως
  choice: കടുത്ത ഭിന്നതയിലും വലിയ വാദപ്രതിവാദത്തിലും
  rationale: στάσις ഗൗരവമുള്ള എതിർപ്പിനെയും ഭിന്നതയെയും, ζήτησις സജീവമായ വാദപ്രതിവാദത്തെയും സൂചിപ്പിക്കുന്നു. രണ്ടിന്റെയും വ്യത്യാസം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ὀλίγης
  choice: കടുത്ത ... വലിയ
  rationale: ഗ്രീക്കിലെ litotes അർത്ഥപരമായി ശക്തമായി നൽകുന്നു. പദാനുപദമായി ‘ചെറിയതല്ലാത്ത’ എന്നു പറഞ്ഞാൽ മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ അതിന്റെ ഊന്നൽ നേരിട്ട് പ്രകടിപ്പിച്ചു; അടിക്കുറിപ്പിൽ മൂലരൂപം സൂചിപ്പിക്കുന്നു.
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: പൗലോസും ബർന്നബാസും അവരുമായി
  rationale: തർക്കത്തിൽ ഉൾപ്പെട്ട ഇരുപക്ഷങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘അവർ’ മുൻവാക്യത്തിലെ യെഹൂദ്യയിൽനിന്നു വന്നവരെ സൂചിപ്പിക്കുന്നു; അതിലധികം വൈരഭാവം ചേർക്കുന്നില്ല.
- source_word: ἔταξαν
  choice: അവർ നിശ്ചയിച്ചു
  rationale: പ്രതിനിധികൾ പോകാനുള്ള ക്രമീകരിച്ച സമൂഹതീരുമാനമാണ് സന്ദർഭം. ‘നിയമിച്ചു’ എന്നത് വ്യക്തികളെ ഒരു പദവിയിൽ നിയമിച്ചതായി തെറ്റിദ്ധരിപ്പിക്കാവുന്നതിനാൽ ‘നിശ്ചയിച്ചു’ യോജിക്കുന്നു.
- source_word: ἀναβαίνειν
  choice: കയറിപ്പോകണമെന്ന്
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയെ ‘കയറിപ്പോകുക’ എന്നു പറയുന്ന ഗ്രീക്ക് ഭൂമിശാസ്ത്ര-സാംസ്കാരിക പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: അവരുടെ കൂട്ടത്തിൽനിന്ന് മറ്റു ചിലരും
  rationale: പ്രാദേശിക സമൂഹത്തിൽനിന്ന് തിരഞ്ഞെടുത്ത അധിക പ്രതിനിധികളാണെന്ന ἐξ αὐτῶν എന്ന പ്രയോഗത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു; ലിംഗമോ പദവിയോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: അപ്പൊസ്തലന്മാരെയും മൂപ്പന്മാരെയും
  rationale: അപ്പൊസ്തലന്മാർ എന്ന അംഗീകൃത പദവിയും πρεσβύτεροι സൂചിപ്പിക്കുന്ന അംഗീകൃത നേതാക്കളായ മൂപ്പന്മാരും പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: ഈ പ്രശ്നത്തെക്കുറിച്ച്
  rationale: ζήτημα ഇവിടെ ചർച്ചയ്ക്കും തർക്കത്തിനും വിധേയമായ വിഷയമാണ്. ആ സജീവ വിവാദഭാവം ‘പ്രശ്നം’ സ്വാഭാവികമായി നൽകുന്നു; ‘കാര്യം’ എന്നതും സാധ്യമാണ്.
theological_decisions:
- issue: തർക്കത്തിൽ ഉൾപ്പെട്ട കക്ഷികളുടെ തിരിച്ചറിയൽ
  choice: പൗലോസും ബർന്നബാസും ‘അവരുമായി’ ഭിന്നതയിലും വാദപ്രതിവാദത്തിലും ഏർപ്പെട്ടു; ‘അവർ’ മുൻവാക്യത്തിലെ യെഹൂദ്യയിൽനിന്നു വന്നവരാണ്.
  alternative: ‘പൗലോസിനും ബർന്നബാസിനും അവരോടു കടുത്ത ഭിന്നതയും വാദപ്രതിവാദവും ഉണ്ടായപ്പോൾ’ എന്ന ഘടന.
  rationale: ഇത് പ്രധാനമായും വാക്യഘടനാപരമായ തീരുമാനമാണ്. ഉടനെയുള്ള ആഖ്യാനസൂചന മാത്രം പിന്തുടരുന്നു; ഏതെങ്കിലും സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἔταξαν എന്നതിന്റെ സ്ഥാപനപരമായ ഭാവം
  choice: ‘അവർ നിശ്ചയിച്ചു’ എന്നു നൽകി, സമൂഹം പ്രതിനിധികളുടെ യാത്ര സംബന്ധിച്ച് എടുത്ത ക്രമബദ്ധമായ തീരുമാനം സൂചിപ്പിക്കുന്നു.
  alternative: ‘അവർ നിയമിച്ചു’ അല്ലെങ്കിൽ ‘അവർ ക്രമീകരിച്ചു.’
  rationale: സഭാസമൂഹത്തിന്റെ ഔദ്യോഗികസ്വഭാവമുള്ള തീരുമാനം അംഗീകരിക്കുമ്പോഴും, ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നതിലധികം പ്രത്യേക സഭാഭരണരീതി വിവർത്തനത്തിൽ ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘അപ്പൊസ്തലന്മാർ,’ ‘മൂപ്പന്മാർ,’ ‘യെരൂശലേം’ എന്നീ പരിചിത ബൈബിൾ പദരൂപങ്ങൾ നിലനിർത്തി. ഗ്രീക്കിലെ litotes മുഖ്യവാചകത്തിൽ സ്വാഭാവിക അർത്ഥമായി നൽകി, അതിന്റെ വാചകരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
