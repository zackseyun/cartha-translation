  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: ml
  text: 'എന്നാൽ പരീശന്മാരുടെ വിഭാഗത്തിൽപ്പെട്ട[a], വിശ്വസിച്ചിരുന്ന ചിലർ എഴുന്നേറ്റു പറഞ്ഞു: “അവരെ പരിച്ഛേദനം ചെയ്യുകയും മോശെയുടെ ന്യായപ്രമാണം പാലിക്കാൻ അവരോടു കല്പിക്കുകയും വേണം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പരീശന്മാരുടെ മതവിഭാഗത്തിൽപ്പെട്ട.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം അംഗീകൃതമായ ഒരു വിഭാഗത്തെയോ ചിന്താപക്ഷത്തെയോ സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്തെ സാങ്കേതിക അർഥത്തിൽ ‘വേദവിപരീതമായ ഉപദേശം’ എന്നത് നിർബന്ധമായും അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: എഴുന്നേറ്റു
  rationale: യോഗത്തിൽ സംസാരിക്കാനോ നിലപാട് അറിയിക്കാനോ എഴുന്നേൽക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അതിലധികമായ ഉദ്ദേശ്യം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τινες
  choice: ചിലർ
  rationale: ലിംഗം പ്രത്യേകം ചേർക്കാതെ അനിശ്ചിത ബഹുവചനത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: പരീശന്മാരുടെ വിഭാഗത്തിൽപ്പെട്ട
  rationale: αἵρεσις ഇവിടെ അംഗീകൃതമായ ഒരു കൂട്ടത്തെയോ ചിന്താപക്ഷത്തെയോ സൂചിപ്പിക്കുന്നു. പിൽക്കാല സാങ്കേതിക അർഥമായ ‘വേദവിപരീതവിഭാഗം’ എന്ന ധ്വനി ഒഴിവാക്കാൻ ‘വിഭാഗം’ ഉപയോഗിച്ചു.
- source_word: πεπιστευκότες
  choice: വിശ്വസിച്ചിരുന്ന
  rationale: മുൻപ് വിശ്വസിച്ചതും ആ വിശ്വാസാവസ്ഥ തുടരുന്നതുമായ പൂർണകാല കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ഇവരുടെ തുടർന്നുള്ള ആവശ്യം സൃഷ്ടിക്കുന്ന ചരിത്രപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം മായ്ക്കുന്നില്ല.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: അവരുടെ വാക്കുകളുടെ ഉള്ളടക്കം നിഷ്പക്ഷമായി അവതരിപ്പിക്കുന്നു; ‘ശഠിച്ചു’ പോലുള്ള അധികമായ ഭാവം ചേർക്കുന്നില്ല.
- source_word: δεῖ
  choice: വേണം
  rationale: ആവശ്യകതയോ നിർബന്ധമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അവ്യക്തക്രിയയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആ നിർബന്ധത്തിന്റെ ഉറവിടം വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: περιτέμνειν αὐτούς
  choice: അവരെ പരിച്ഛേദനം ചെയ്യുക
  rationale: മൂലത്തിലെ സകർമക അനന്തരൂപവും ‘അവരെ’ എന്ന കർമവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παραγγέλλειν
  choice: കല്പിക്കുക
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ക്രിയയുടെ ശക്തി സംരക്ഷിക്കുന്നു; ‘ഉപദേശിക്കുക’ എന്നതുപോലെ അതിനെ മൃദുവാക്കുന്നില്ല.
- source_word: τε τηρεῖν
  choice: പാലിക്കാൻ
  rationale: നിയമം അനുസരിച്ചുനടക്കുകയോ ആചരിക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν νόμον Μωϋσέως
  choice: മോശെയുടെ ന്യായപ്രമാണം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യഹൂദമതത്തിനുള്ളിലെ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന αἵρεσις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിഭാഗം
  alternative: മതവിഭാഗം
  rationale: ഇവിടെ പരീശന്മാർ യഹൂദമതത്തിനുള്ളിലെ തിരിച്ചറിയപ്പെട്ട ഒരു പക്ഷമോ കൂട്ടമോ ആണ്; പിൽക്കാലത്തെ ‘heresy’ എന്ന സാങ്കേതികവും അപലപനാത്മകവുമായ അർഥം പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- issue: πεπιστευκότες എന്ന പൂർണകാല കൃദന്തത്തിന്റെ ശക്തി
  choice: വിശ്വസിച്ചിരുന്ന
  alternative: വിശ്വാസികളായിരുന്ന
  rationale: വിശ്വസിച്ച സംഭവം മുൻപ് നടന്നതും അതിന്റെ ഫലം തുടരുന്നതുമായ ഭാവം ക്രിയാരൂപത്തിൽ സൂക്ഷിക്കുന്നു. വിശ്വസിച്ചിട്ടും ജാതികൾക്കായി പരിച്ഛേദനവും ന്യായപ്രമാണപാലനവും ആവശ്യപ്പെടുന്നവരെന്ന പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം’, ‘പരിച്ഛേദനം’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ കൃത്യതയ്ക്കായി നിലനിർത്തി; വാക്യഘടന സംസാരയോഗ്യവും വ്യക്തവുമാക്കി.
