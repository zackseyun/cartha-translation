id: ACT.15.22
reference: Acts 15:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: ml
  text: 'അപ്പോൾ അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും സഭ മുഴുവനും ചേർന്ന്, അവരിൽനിന്ന് പുരുഷന്മാരെ തിരഞ്ഞെടുത്ത് പൗലൊസിനോടും ബർന്നബാസിനോടുംകൂടെ അന്ത്യൊക്യയിലേക്ക് അയയ്ക്കുന്നതു നല്ലതെന്നു കണ്ടു: സഹോദരന്മാരുടെ[b] ഇടയിൽ നേതൃത്വം വഹിച്ചിരുന്ന[a] ബർശബ്ബാസ് എന്നു വിളിക്കപ്പെട്ട യൂദയെയും ശീലാസിനെയും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരന്മാരുടെ ഇടയിലെ നേതാക്കളായിരുന്ന.”
    reason: ἡγουμένους എന്നതിന് പ്രവർത്തനപരമായ ‘നേതൃത്വം വഹിച്ചിരുന്ന’ എന്നും നാമപരമായ ‘നേതാക്കളായിരുന്ന’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം.
  - marker: b
    text: ഇവിടെ “സഹോദരന്മാർ” എന്നത് സ്ത്രീകളെയും ഉൾപ്പെടുത്തി വിശ്വാസിസമൂഹത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം.
    reason: ἀδελφοῖς വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും ആദിമക്രൈസ്തവ സമൂഹഭാഷയിൽ ഉൾക്കൊള്ളുന്ന പ്രതിനിധിപ്രയോഗമായി വരാം.
lexical_decisions:
- source_word: ἔδοξε
  choice: നല്ലതെന്നു കണ്ടു
  rationale: കൂട്ടായ ആലോചനയിലൂടെ ഉചിതമെന്നു വിലയിരുത്തിയതിനെ സൂചിപ്പിക്കുന്നു; ഔപചാരിക ഉത്തരവെന്ന അർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: πρεσβυτέροις
  choice: മൂപ്പന്മാർ
  rationale: ആദിമസഭയിലെ അംഗീകൃത നേതൃത്വത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: സഭ മുഴുവനും ചേർന്ന്
  rationale: അപ്പൊസ്തലന്മാരോടും മൂപ്പന്മാരോടും കൂടെ മുഴുവൻ സഭയും ഈ നടപടിയിൽ പങ്കെടുത്തതായി σύν സൂചിപ്പിക്കുന്ന കൂട്ടുപങ്കാളിത്തം നിലനിർത്തുന്നു.
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: തങ്ങളുടെ ഇടയിൽനിന്ന് ചില പുരുഷന്മാരെ തിരഞ്ഞെടുത്ത്
  rationale: പ്രതിനിധികൾ യെരൂശലേം സമൂഹത്തിൽനിന്നുതന്നെ തിരഞ്ഞെടുക്കപ്പെട്ടുവെന്നും ἄνδρας വ്യക്തമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നുവെന്നും സംരക്ഷിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘ചില’ ചേർത്തിരിക്കുന്നു.
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: അന്ത്യൊക്യയിലേക്ക് അയയ്ക്കുന്നത്
  rationale: ലക്ഷ്യസ്ഥാനവും അയയ്ക്കുന്ന പ്രവൃത്തിയും നേരായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καλούμενον Βαρσαββᾶν
  choice: ബർശബ്ബാസ് എന്നു വിളിക്കപ്പെട്ട
  rationale: യൂദയുടെ മറ്റൊരു പേരിനെ വിവരിക്കുന്ന ഗ്രീക്ക് കൃതന്തത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: സഹോദരന്മാരുടെ ഇടയിൽ നേതൃത്വം വഹിച്ചിരുന്ന
  rationale: ἡγουμένους അംഗീകൃത നേതൃത്വപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; നിർബന്ധമായും ഔദ്യോഗിക പദവിയെന്ന നിലയിൽ കട്ടികൂട്ടാതെ കൃതന്തരൂപത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἀδελφοῖς
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തെ വിപുലമായി സൂചിപ്പിക്കാവുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: തീരുമാനത്തിൽ മുഴുവൻ സഭയുടെ പങ്കാളിത്തത്തിന്റെ വ്യാപ്തി
  choice: അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും സഭ മുഴുവനും ചേർന്നാണ് നടപടി ഉചിതമെന്നു കണ്ടത്
  alternative: അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും മാത്രം തീരുമാനിച്ചു; സഭ സന്നിഹിതമായിരുന്നു
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ എന്നത് മുഴുവൻ സഭയെയും ἔδοξε എന്ന കൂട്ടായ വിലയിരുത്തലിലും തുടർന്നുള്ള തിരഞ്ഞെടുപ്പിലും അയയ്ക്കലിലും സ്വാഭാവികമായി ഉൾപ്പെടുത്തുന്നു; പ്രത്യേക സഭാഭരണരീതി ഇതിൽനിന്ന് നിർബന്ധിച്ച് സ്ഥാപിക്കുന്നില്ല.
- issue: ἀδελφοῖς എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’; സമൂഹത്തെ വിപുലമായി സൂചിപ്പിക്കാമെന്നു അടിക്കുറിപ്പിൽ
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘വിശ്വാസികൾ’
  rationale: മൂലത്തിലെ പുല്ലിംഗരൂപം സംരക്ഷിക്കുമ്പോഴും ആദിമക്രൈസ്തവ പ്രയോഗത്തിൽ മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാനുള്ള സാധ്യത മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ വാക്യഘടന. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; രണ്ടാമത്തെ വാക്യത്തിലെ ‘അവർ തിരഞ്ഞെടുത്തത്’ ആദ്യവാക്യത്തിലെ തിരഞ്ഞെടുപ്പിനെ വ്യക്തമായി പുനരുചരിക്കുന്നു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുയോജ്യമായി പൗലൊസ്, ബർന്നബാസ്, അന്ത്യൊക്യ, ബർശബ്ബാസ്, യൂദ, ശീലാസ് എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു.
