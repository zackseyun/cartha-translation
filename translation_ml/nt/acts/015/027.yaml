translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ കൃദന്തരൂപം മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി നൽകിയിരിക്കുന്നത് വായനാസൗകര്യത്തിനും ‘അവർതന്നെ’ എന്ന ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നതിനുമാണ്.
