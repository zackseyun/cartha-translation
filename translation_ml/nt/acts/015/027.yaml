source:
  edition: SBLGNT
  text: ἀπεστάλκαμεν οὖν Ἰούδαν καὶ Σιλᾶν, καὶ αὐτοὺς διὰ λόγου ἀπαγγέλλοντας τὰ αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/027.yaml
  text: Therefore we have sent Judas and Silas[b][a], who themselves will report the same things by word of mouth.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞങ്ങൾ യൂദാസിനെയും ശീലാസിനെയും അയച്ചിരിക്കുന്നു[a]. അവർതന്നെ ഇതേ കാര്യങ്ങൾ വാക്കാൽ അറിയിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങൾ യൂദാസിനെയും ശീലാസിനെയും അയച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഗ്രീക്കിലെ പൂർണകാലം ആ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വാക്കിലൂടെ’; അതായത്, കത്തിനുപുറമേ സംസാരത്തിലൂടെയും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλκαμεν
  choice: ഞങ്ങൾ ... അയച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലം അയച്ച പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘അയച്ചിരിക്കുന്നു’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പറഞ്ഞ സഭാതീരുമാനത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: Ἰούδαν καὶ Σιλᾶν
  choice: യൂദാസിനെയും ശീലാസിനെയും
  rationale: പുതിയനിയമത്തിലെ ഈ വ്യക്തിനാമങ്ങളുടെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: αὐτοὺς
  choice: അവർതന്നെ
  rationale: ദൂതന്മാർ കത്തിലെ കാര്യങ്ങൾ നേരിട്ട് സ്ഥിരീകരിക്കുമെന്ന മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ λόγου
  choice: വാക്കാൽ
  rationale: എഴുത്തുകത്തിനുപുറമേ സംസാരത്തിലൂടെയുള്ള അറിയിപ്പിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വാക്കാൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀπαγγέλλοντας
  choice: അറിയിക്കും
  rationale: വർത്തമാനകാല കൃദന്തം ഇവിടെ അയയ്ക്കപ്പെട്ടവർ ചെയ്യാനിരിക്കുന്ന കാര്യത്തെ വിവരിക്കുന്നു; മലയാളത്തിൽ ഭാവികാല ക്രിയാരൂപം അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὰ αὐτά
  choice: ഇതേ കാര്യങ്ങൾ
  rationale: കത്തിൽ ഉൾപ്പെടുത്തിയ അതേ ഉള്ളടക്കത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; ‘സന്ദേശം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അനാവശ്യമായ വ്യാഖ്യാനമാകും.
