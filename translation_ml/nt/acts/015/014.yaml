  terminology: ‘ശിമെയോൻ,’ ‘ജനതകൾ,’ ‘സന്ദർശിച്ചു,’ ‘ഒരു ജനത്തെ,’ and ‘തന്റെ നാമത്തിനായി’ are appropriate modern-standard Malayalam renderings. The notes retain ‘വിജാതീയർ’ as a contextual alternative rather than forcing that interpretive term into the main text.
