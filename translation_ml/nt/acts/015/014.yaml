language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: ml
  text: 'ശിമെയോൻ[a] വിവരിച്ചു: ദൈവം ആദ്യം ജനതകളെ സന്ദർശിച്ചതും അവരുടെ ഇടയിൽനിന്ന്[b] തന്റെ നാമത്തിനായി ഒരു ജനത്തെ എടുക്കാനായിരുന്നുവെന്നും[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശിമോൻ.’ ഇവിടെ യാക്കോബ് ‘ശിമെയോൻ’ എന്ന രൂപമാണ് ഉപയോഗിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ജനതകൾ’ എന്നു പറയുന്നത് യഹൂദരല്ലാത്ത ജനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിജാതീയരുടെ ഇടയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ദൈവത്തിന്റേതും അവന്റെ നാമവുമായി തിരിച്ചറിയപ്പെടുന്നതുമായ ഒരു ജനം.
    reason: cultural_note
lexical_decisions:
- source_word: Συμεὼν
  choice: ശിമെയോൻ
  rationale: സ്രോതസ്സിലുള്ള വ്യത്യസ്തമായ സെമിറ്റിക് രൂപം നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ ‘ശിമോൻ’ എന്ന രൂപത്തിലേക്ക് ഏകീകരിക്കുന്നില്ല.
- source_word: ἐξηγήσατο
  choice: വിവരിച്ചുകഴിഞ്ഞു
  rationale: സഭയ്ക്ക് മുമ്പിൽ ഇപ്പോൾ പറഞ്ഞുതീർത്ത വിവരണത്തെ സൂചിപ്പിക്കുന്നു; ‘വിശദീകരിച്ചു’ എന്നതിനെക്കാൾ സംഭവവിവരണം പറഞ്ഞതെന്ന ആശയം വ്യക്തമാണ്.
- source_word: καθὼς
  choice: എങ്ങനെ
  rationale: വിവരിച്ചതിന്റെ ഉള്ളടക്കവും ദൈവത്തിന്റെ പ്രവർത്തനരീതിയും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: ജനതകളോടുള്ള ദൈവിക ഇടപെടലിന്റെ ആരംഭഘട്ടം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπεσκέψατο
  choice: സന്ദർശിച്ചു
  rationale: കരുതലോടും ഉദ്ദേശ്യത്തോടും കൂടിയ ദൈവിക സന്ദർശനം എന്ന ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; അതിനെ ‘സഹായിച്ചു’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: λαβεῖν
  choice: എടുക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-ന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘കൂട്ടിച്ചേർക്കാൻ’ പോലുള്ള വ്യാഖ്യാനാത്മക ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: ἐξ ἐθνῶν
  choice: ജനതകളുടെ ഇടയിൽനിന്ന്
  rationale: ἔθνη എന്നതിന്റെ ‘ജനതകൾ’ എന്ന അടിസ്ഥാനാർഥവും അവരിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പ് എന്ന ἐξ-ന്റെ ആശയവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു.
- source_word: λαὸν
  choice: ഒരു ജനത്തെ
  rationale: വംശീയ വിഭാഗം മാത്രമല്ല, ദൈവവുമായി തിരിച്ചറിയപ്പെടുന്ന ഒരു സമൂഹം എന്ന ബൈബിൾ-ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: തന്റെ നാമത്തിനായി
  rationale: ‘തനിക്കായി’ എന്ന് പരത്താതെ സ്രോതസ്സിലെ ഉടമ്പടിസംബന്ധമായ നാമപ്രയോഗവും അതിന്റെ ദൈവശാസ്ത്രഭാരവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐξ ἐθνῶν എന്നത് ‘വിജാതീയരിൽനിന്ന്’ എന്നോ ‘ജനതകളുടെ ഇടയിൽനിന്ന്’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: ജനതകളുടെ ഇടയിൽനിന്ന്
  alternative: വിജാതീയരിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ‘ജനതകൾ’ എന്ന രൂപം വ്യക്തമായി നിലനിർത്തുന്നു; അതേസമയം സന്ദർഭത്തിൽ യഹൂദരല്ലാത്ത ജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: τῷ ὀνόματι αὐτοῦ എന്നത് ‘തനിക്കായി’ എന്ന് വ്യാഖ്യാനിക്കണമോ
  choice: തന്റെ നാമത്തിനായി
  alternative: തനിക്കായി
  rationale: സ്രോതസ്സിലെ ദൈവശാസ്ത്രപരമായി സമ്പന്നമായ പ്രയോഗം സംരക്ഷിക്കുകയും ഒരു ജനത ദൈവത്തിന്റേതും അവന്റെ നാമവുമായി തിരിച്ചറിയപ്പെടുന്നതുമാണെന്ന സൂചന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ἐπεσκέψατο എന്ന ദൈവിക പ്രവർത്തനത്തെ എത്രമാത്രം വ്യാഖ്യാനിക്കണം
  choice: സന്ദർശിച്ചു
  alternative: കരുണയോടെ ഇടപെട്ടു
  rationale: കരുതലോടെയുള്ള ദൈവിക ഇടപെടൽ എന്ന അന്തർധ്വനി നിലനിൽക്കുന്നുവെങ്കിലും, മൂലപദത്തിലുള്ള രൂപകം പരിഭാഷയിൽ തന്നെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സന്ദർശിച്ചു,’ ‘തന്റെ നാമത്തിനായി’ എന്നീ ബൈബിൾ പ്രയോഗങ്ങൾ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രത സംരക്ഷിക്കാൻ നിലനിർത്തി; അടിക്കുറിപ്പുകൾ അവയുടെ അർഥം ചുരുക്കാതെ വ്യക്തമാക്കുന്നു.
