id: ACT.15.36
reference: Acts 15:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: ml
  text: 'കുറെ ദിവസങ്ങൾക്കുശേഷം പൗലോസ് ബർന്നബാസിനോടു പറഞ്ഞു: “നാം കർത്താവിന്റെ വചനം പ്രസംഗിച്ച എല്ലാ പട്ടണങ്ങളിലേക്കും ഇപ്പോൾ മടങ്ങിച്ചെന്ന് സഹോദരന്മാരെ[a] സന്ദർശിച്ച് അവർ എങ്ങനെയിരിക്കുന്നുവെന്നു നോക്കാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാരെ”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്. വിശ്വാസികളുടെ മുഴുവൻ സമൂഹത്തെയും പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാൻ ഈ പുരുഷലിംഗപദം ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: കുറെ ദിവസങ്ങൾക്കുശേഷം
  rationale: μετά എന്ന പദവും കാലസൂചകമായ ദ്വിതീയാവിഭക്തി പ്രയോഗവും തുടർന്നുള്ള സമയത്തെ സൂചിപ്പിക്കുന്നു; ഇടവേളയുടെ ദൈർഘ്യം നിർണയിക്കാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: പൗലോസ് ബർന്നബാസിനോടു പറഞ്ഞു
  rationale: സംസാരിച്ചത് പൗലോസാണെന്നും അഭിസംബോധന ചെയ്യപ്പെട്ടത് ബർന്നബാസാണെന്നും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: ഇപ്പോൾ മടങ്ങിച്ചെന്ന് … സന്ദർശിച്ച് … നോക്കാം
  rationale: ആദ്യത്തെ കൃതന്തം പ്രധാന ആഹ്വാനത്തോടു ചേർത്ത്, δή നൽകുന്ന അടിയന്തരത ‘ഇപ്പോൾ’ എന്നും ἐπισκεψώμεθα ഉൾക്കൊള്ളുന്ന കരുതലോടെയുള്ള സന്ദർശനം ‘സന്ദർശിച്ച് … നോക്കാം’ എന്നും അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ കുടുംബപദത്തിന്റെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശ്വാസികളുടെ മിശ്രസമൂഹത്തെയും പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατὰ πόλιν πᾶσαν ἐν αἷς
  choice: എല്ലാ പട്ടണങ്ങളിലേക്കും
  rationale: ഓരോ പട്ടണത്തെയും ഉൾക്കൊള്ളുന്ന κατάയുടെ വിതരണാർഥവും മുൻപ് സന്ദേശം പ്രസംഗിച്ച സ്ഥലങ്ങളിലേക്കുള്ള മടക്കയാത്രയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατηγγείλαμεν
  choice: പ്രസംഗിച്ച
  rationale: καταγγέλλω പൊതുവായി പ്രഖ്യാപിക്കുക എന്ന ശക്തമായ അർഥമുള്ളതാണ്; സുവിശേഷസന്ദർഭത്തിൽ ‘പ്രസംഗിച്ച’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: കർത്താവിന്റെ വചനം
  rationale: λόγος ഇവിടെ പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു; κύριος ‘കർത്താവ്’ എന്നും ജനിറ്റീവ് ബന്ധം ‘കർത്താവിന്റെ’ എന്നും സംരക്ഷിക്കുന്നു.
- source_word: πῶς ἔχουσιν
  choice: അവർ എങ്ങനെയിരിക്കുന്നുവെന്നു
  rationale: അവരുടെ നിലവിലെ സ്ഥിതിയും ക്ഷേമവും അന്വേഷിക്കുന്ന ഗ്രീക്ക് ശൈലിയെ അധികവ്യാഖ്യാനം കൂടാതെ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പദം മിശ്രലിംഗ വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാനുള്ള സാധ്യത
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / വിശ്വാസികൾ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ കുടുംബപദം മുഖ്യപാഠത്തിൽ നിലനിർത്തുമ്പോഴും, അതിന്റെ പ്രതിനിധാനപരമായ ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പുതിയനിയമത്തിലെ ഈ സന്ദർഭത്തിൽ ‘കർത്താവ്’ ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവും മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ സ്ഥിരവുമായ പരിഭാഷയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആഹ്വാനഭാവവും പ്രവർത്തനക്രമവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖല ഉപയോഗിച്ചു.
