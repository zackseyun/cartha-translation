    rationale: εὖ πράξετε എന്ന പ്രയോഗത്തിന്റെ ‘നന്നായി/ശരിയായി പ്രവർത്തിക്കും’ എന്ന അർഥം കൂടുതൽ സ്വാഭാവികമായി വ്യക്തമാക്കേണ്ടതാണ്.
