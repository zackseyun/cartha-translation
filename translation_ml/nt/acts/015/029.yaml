  to: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം[a], രക്തം, കഴുത്തുഞെരിച്ച് കൊല്ലപ്പെട്ടവ[b], ലൈംഗിക അധാർമികത[c] എന്നിവയിൽനിന്ന് വിട്ടുനിൽക്കണം. ഇവയിൽനിന്ന് നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചാൽ നിങ്ങൾ നന്നായി പ്രവർത്തിക്കും. വിട[d].
  rationale: πνικτῶν-ന്റെ കർമാർഥം വ്യക്തമായി സംരക്ഷിക്കാൻ ‘കഴുത്തുഞെരിച്ച് കൊന്നവ’ എന്ന അവ്യക്തമായ രൂപം ‘കഴുത്തുഞെരിച്ച് കൊല്ലപ്പെട്ടവ’ എന്ന് മാറ്റി. εὖ πράξετε-യ്ക്ക് സ്വാഭാവികമായ മലയാളപ്രയോഗം നൽകി. ἔρρωσθε-യുടെ പതിവായ കത്തുസമാപനാർഥം മുഖ്യപാഠത്തിൽ ‘വിട’ എന്നതിലൂടെ നിലനിർത്തുകയും അടുത്ത അക്ഷരാർഥബദൽ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
