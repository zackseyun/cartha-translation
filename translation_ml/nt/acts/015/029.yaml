id: ACT.15.29
reference: Acts 15:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: ml
  text: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം[a], രക്തം, കഴുത്തുഞെരിച്ച് കൊല്ലപ്പെട്ടവ[b], ലൈംഗിക അധാർമികത[c] എന്നിവയിൽനിന്ന് വിട്ടുനിൽക്കണം. ഇവയിൽനിന്ന് നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചാൽ നിങ്ങൾ നന്നായി പ്രവർത്തിക്കും. വിട[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ചവ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘കഴുത്തുഞെരിച്ച് കൊന്ന മാംസം’ അഥവാ ‘കഴുത്തുഞെരിച്ച് കൊല്ലപ്പെട്ടവ.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ലൈംഗിക അധാർമികത’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് വിശാലമായ അർഥമുണ്ടാകാം. എന്നാൽ ഈ സന്ദർഭത്തിൽ ലേവ്യപുസ്തകത്തിലെ നിരോധനങ്ങളുടെ വെളിച്ചത്തിൽ അതിന് കൂടുതൽ സവിശേഷമായ അർഥമുണ്ടെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: d
    text: 'അല്ലെങ്കിൽ: ‘സുഖമായിരിക്കുവിൻ.’ കത്തുകളുടെ അവസാനത്തിൽ പതിവായി ഉപയോഗിച്ചിരുന്ന ഒരു ഗ്രീക്ക് ആശംസയാണിത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: വിട്ടുനിൽക്കണം
  rationale: നിർദേശത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്ന വർത്തമാനകാല മധ്യ അനന്തക്രിയയുടെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: εἰδωλοθύτων
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം
  rationale: വിഗ്രഹാരാധനയിൽ അർപ്പിച്ച വസ്തുക്കളെ, പ്രത്യേകിച്ച് ഭക്ഷണത്തെ, വ്യക്തമായി സൂചിപ്പിക്കുന്നു; വിശാലമായ പദാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αἵματος
  choice: രക്തം
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പ്രയോഗം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: πνικτῶν
  choice: കഴുത്തുഞെരിച്ച് കൊന്നവ
  rationale: രക്തം വാർന്നുപോകാതെ കഴുത്തുഞെരിച്ച് കൊല്ലപ്പെട്ട ജീവികളെ സൂചിപ്പിക്കുന്ന substantival adjective-ന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: πορνείας
  choice: ലൈംഗിക അധാർമികത
  rationale: ഒരു പ്രത്യേക ലൈംഗിക കുറ്റത്തിലേക്ക് അർഥം ചുരുക്കാതെ πορνείαയുടെ വിശാലമായ നൈതിക അർഥം നൽകുന്നു.
- source_word: ἐξ ὧν
  choice: ഇവയിൽനിന്ന്
  rationale: മുമ്പ് പട്ടികപ്പെടുത്തിയ കാര്യങ്ങളിലേക്കുള്ള ബന്ധം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: διατηροῦντες ἑαυτούς
  choice: നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചാൽ
  rationale: ഗ്രീക്കിലെ കർത്തൃവാചക പങ്കാളിത്തപ്രയോഗത്തിന്റെ സോപാധിക ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εὖ πράξετε
  choice: നിങ്ങൾ നന്നായി ചെയ്യും
  rationale: അനുസരിക്കുന്നത് ശരിയായതും പ്രശംസനീയവുമായ പ്രവൃത്തിയാണെന്ന ഗ്രീക്ക് ശൈലിയുടെ അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἔρρωσθε
  choice: സുഖമായിരിക്കട്ടെ
  rationale: അക്ഷരാർഥമായ ബലപ്പെടൽ എന്നതിലുപരി കത്തിന്റെ പതിവ് സമാപനാശംസ എന്ന പ്രയോഗപരമായ അർഥം നൽകുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക തീരുമാനത്തിലെ πορνείαയുടെ അർഥം
  choice: ലൈംഗിക അധാർമികത എന്ന വിശാലമായ പ്രയോഗം
  alternative: വ്യഭിചാരം, വിവാഹത്തിനു പുറത്തുള്ള ലൈംഗികബന്ധം, അല്ലെങ്കിൽ ലേവ്യപുസ്തകം 18-ലെ നിരോധിത ബന്ധങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ ചിലർ പദത്തെ പ്രത്യേക ലേവ്യ നിരോധനങ്ങളുമായി ബന്ധിപ്പിക്കുന്നുണ്ടെങ്കിലും വാക്യം തന്നെ അർഥം അങ്ങനെ ചുരുക്കുന്നില്ല; അതിനാൽ മുഖ്യപാഠം വിശാലമായ പദാർഥവും അടിക്കുറിപ്പ് വ്യാഖ്യാനസാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പട്ടികയുടെ സംക്ഷിപ്തതയും കത്തിന്റെ സമാപനഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു; വ്യാഖ്യാനപരമായ പ്രത്യേകതകൾ അടിക്കുറിപ്പുകളിലാക്കി.
