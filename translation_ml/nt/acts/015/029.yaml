  terminology: ‘വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം,’ ‘രക്തം,’ ‘ലൈംഗിക അധാർമികത’ എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. πορνείαയുടെ വിശാലത മുഖ്യപാഠത്തിലും വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിലും ശരിയായി നിലനിർത്തിയിരിക്കുന്നു.
