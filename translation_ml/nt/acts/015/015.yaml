id: ACT.15.15
reference: Acts 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: ml
  text: 'പ്രവാചകന്മാരുടെ വചനങ്ങളും ഇതിനോടു യോജിക്കുന്നു[a]. എഴുതിയിരിക്കുന്നതുപോലെ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവാചകന്മാരുടെ വചനങ്ങളും ഇതുമായി ഒത്തുപോകുന്നു.’
    reason: τούτῳ എന്ന ദത്തിവിഭക്തിയോടുകൂടിയ συμφωνέω എന്ന പ്രയോഗം മലയാളത്തിൽ ‘ഇതിനോടു യോജിക്കുന്നു’ എന്നും ‘ഇതുമായി ഒത്തുപോകുന്നു’ എന്നും സ്വാഭാവികമായി പ്രതിനിധീകരിക്കാം.
lexical_decisions:
- source_word: καὶ
  choice: -ഉം
  rationale: യാക്കോബ് തന്റെ വാദത്തിന് പ്രവാചകവചനങ്ങളുടെ പിന്തുണകൂടി ചേർക്കുന്നതിനെ സ്വാഭാവികമായ മലയാള സംയോജകപ്രത്യയം വ്യക്തമാക്കുന്നു.
- source_word: τούτῳ
  choice: ഇതിനോടു
  rationale: മുൻപു പറഞ്ഞ കാര്യത്തിലേക്കു പൊതുവായി വിരൽചൂണ്ടുന്ന നപുംസകലിംഗ ദർശകസർവനാമത്തിന്റെ വിശാലമായ സൂചന നിലനിർത്തുന്നു; അതിന്റെ ആശയപരമായ സൂചന കൃത്രിമമായി ചുരുക്കുന്നില്ല.
- source_word: συμφωνοῦσιν
  choice: യോജിക്കുന്നു
  rationale: ‘ഒത്തുപോകുന്നു/ഒരുമിക്കുന്നു’ എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്ന ആധുനിക മലയാളപ്രയോഗം.
- source_word: οἱ λόγοι
  choice: വചനങ്ങൾ
  rationale: എഴുത്തുരൂപത്തിൽ ഉദ്ധരിക്കപ്പെടുന്ന പ്രവാചകപ്രസ്താവനകളെ സൂചിപ്പിക്കാൻ ബൈബിൾസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ
  rationale: പ്രവാചകരുടേതായ വചനങ്ങൾ എന്ന ജനിറ്റീവ് ബന്ധം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: καθὼς
  choice: -തുപോലെ
  rationale: യാക്കോബിന്റെ പ്രസ്താവനയും തുടർന്ന് ഉദ്ധരിക്കുന്ന തിരുവെഴുത്തും തമ്മിലുള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്നതിനുള്ള ഗ്രീക്ക് പൂർണകാല കർമണിപ്രയോഗത്തെ മലയാളത്തിലെ പതിവും കൃത്യവുമായ ഉദ്ധരണിസൂത്രമായി നൽകുന്നു.
theological_decisions:
- issue: യാക്കോബിന്റെ പ്രസംഗത്തിലെ τούτῳ എന്നതിന്റെ സൂചിതവിഷയം
  choice: മുൻപു പറഞ്ഞ അവകാശവാദത്തെയോ സംഭവത്തെയോ പൊതുവായി സൂചിപ്പിക്കുന്ന ‘ഇത്’
  alternative: ജാതികളുടെ മാനസാന്തരം; പത്രോസിന്റെ പ്രസ്താവന; ദൈവത്തിന്റെ ഈ പദ്ധതി/ഉദ്ദേശ്യം
  rationale: ഗ്രീക്ക് പദം തൊട്ടുമുൻപുള്ള വിഷയത്തിലേക്കു വിരൽചൂണ്ടുന്നെങ്കിലും അതിനെ വ്യക്തമായി പേരിട്ടു ചുരുക്കുന്നില്ല. ‘ഇതിനോടു’ എന്ന പരിഭാഷ ആ വിശാലതയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച മാന്യമായ ശൈലി. ഗ്രീക്കിലെ മുൻനിരയിൽ വരുന്ന τούτῳ എന്നതിന്റെ ഊന്നൽ ‘ഇതിനോടു’ എന്നത് ക്രിയയ്ക്കു മുമ്പിൽ വെച്ച് നിലനിർത്തി; തുടർന്നുള്ള ഉദ്ധരണിക്കായി ദ്വിബിന്ദു ഉപയോഗിച്ചു.
