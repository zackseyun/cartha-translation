id: ACT.15.6
reference: Acts 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: ml
  text: അപ്പോൾ അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും ഈ വിഷയം പരിഗണിക്കാൻ ഒരുമിച്ചുകൂടി[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോഗംചേർന്നു’ അല്ലെങ്കിൽ ‘സമ്മേളിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയ രൂപപരമായി കർമണിപ്രയോഗത്തിലാണ് (‘ഒരുമിച്ചുകൂട്ടപ്പെട്ടു’); എന്നാൽ ഈ സന്ദർഭത്തിൽ സംഘം യോഗംചേർന്നു എന്ന അർഥത്തിലാണ് സാധാരണയായി ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഈ വാക്കിനെക്കുറിച്ച് കാണാൻ.’ ഇവിടെ ‘വാക്ക്’ എന്നത് ചർച്ചയിലുള്ള വിഷയത്തെയോ പ്രശ്നത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνήχθησάν
  choice: ഒരുമിച്ചുകൂടി
  rationale: ഗ്രീക്കിൽ രൂപപരമായി കർമണിപ്രയോഗമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഒരു സംഘം യോഗംചേർന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. ‘ഒരുമിച്ചുകൂടി’ എന്നത് കൂട്ടായ സമ്മേളനത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τε
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിലെ തർക്കത്തിൽനിന്ന് നേതാക്കൾ യോഗംചേരുന്നതിലേക്കുള്ള ലഘുവായ വിവരണബന്ധവും തുടർച്ചയും പ്രകടമാക്കുന്നു.
- source_word: ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ അംഗീകൃതമായ അപ്പൊസ്തലനേതാക്കളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്ഥാപിതമായ മലയാള ബൈബിൾ പദം നിലനിർത്തുന്നു.
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: വെറും പ്രായംചെന്ന പുരുഷന്മാരെയല്ല, സമൂഹത്തിലെ അംഗീകൃത നേതാക്കളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. പിൽക്കാല സഭാഭരണഘടനകളെ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ഈ അർഥം നൽകുന്നു.
- source_word: ἰδεῖν
  choice: പരിഗണിക്കാൻ
  rationale: അക്ഷരാർഥം ‘കാണാൻ’ എന്നാണെങ്കിലും ഇവിടെ വിഷയം പരിശോധിക്കുകയും ആലോചിക്കുകയും ചെയ്യുക എന്ന വിവേചനാത്മക അർഥമാണ്.
- source_word: περὶ τοῦ λόγου τούτου
  choice: ഈ വിഷയം
  rationale: λόγος എന്നതിന് ‘വാക്ക്’ എന്നും അർഥമുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ മുൻപുയർന്ന തർക്കവിഷയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘ഈ വിഷയം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: യെരൂശലേം യോഗത്തിലെ πρεσβύτεροι എന്ന പദത്തിന്റെ സ്ഥാപനപരമായ സൂചന
  choice: പിൽക്കാല സഭാപദവികളുടെ ഘടന ആരോപിക്കാതെ ‘മൂപ്പന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: പിൽക്കാലത്തെ സാങ്കേതിക സഭാപദവിയായി ‘പ്രെസ്ബിറ്റർമാർ’ എന്നു നൽകുക.
  rationale: വാക്യം യെരൂശലേം സഭയിലെ അംഗീകൃത നേതാക്കളെ തിരിച്ചറിയുന്നു; എന്നാൽ പിൽക്കാലത്തെ ഒരു പ്രത്യേക സഭാഭരണക്രമം ഇതിൽ നിർബന്ധിതമല്ല.
- issue: യോഗത്തിന്റെ ആലോചനാപരമായ ഉദ്ദേശ്യം
  choice: ‘ഈ വിഷയം പരിഗണിക്കാൻ’ എന്നു നൽകി; പരിശോധിച്ചാലോചിക്കുന്ന പ്രക്രിയയാണ് ഇതിലൂടെ വ്യക്തമാകുന്നത്.
  alternative: ‘ഈ വിഷയത്തിൽ തീരുമാനമെടുക്കാൻ’ എന്നു നൽകുക.
  rationale: ἰδεῖν ഈ പ്രശ്നം പരിഗണനയ്ക്കെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ ഘട്ടത്തിൽ ഫലം മുൻകൂട്ടി നിശ്ചയിച്ചിരുന്നതായി പരിഭാഷ അതിശയോക്തി വരുത്തരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സഭാപരമായി പരിചിതമായ ‘അപ്പൊസ്തലന്മാർ’, ‘മൂപ്പന്മാർ’ എന്നീ പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും പ്രത്യേക വിഭാഗീയ സഭാഭരണസങ്കൽപ്പങ്ങൾ ചേർത്തിട്ടില്ല. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
