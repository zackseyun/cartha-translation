id: ACT.15.7
reference: Acts 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: ml
  text: 'വളരെ വാദപ്രതിവാദം നടന്നശേഷം പത്രോസ് എഴുന്നേറ്റ് അവരോടു പറഞ്ഞു: “സഹോദരന്മാരേ,[a] പണ്ടുമുതൽതന്നെ നിങ്ങളുടെയിടയിൽ ദൈവം എന്നെ തിരഞ്ഞെടുത്തത്, എന്റെ വായിലൂടെ ജനതകൾ[b] സുവിശേഷത്തിന്റെ വചനം കേൾക്കാനും വിശ്വസിക്കാനുംവേണ്ടിയാണെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “പുരുഷന്മാരേ, സഹോദരന്മാരേ.” ഇത് പുരുഷലിംഗ ബഹുവചനത്തിലുള്ള ഒരു പതിവുസംബോധനയാണ്; ഈ സംബോധനയാൽ പ്രതിനിധീകരിക്കപ്പെട്ട വിശാലമായ സദസ്സും ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വിജാതീയർ.” ഇവിടെ യഹൂദരല്ലാത്ത ജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: വളരെ വാദപ്രതിവാദം നടന്നശേഷം
  rationale: ജനിതകസ്വതന്ത്രപ്രയോഗം മുമ്പുണ്ടായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. സഭായോഗത്തിലെ ഗൗരവമുള്ള ചർച്ചയും അഭിപ്രായഭിന്നതയും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; വെറും കലഹം എന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: പത്രോസ് സംസാരിക്കുന്നതിന് മുമ്പുള്ള ദൃശ്യമായ പ്രവൃത്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിലുള്ള പരമ്പരാഗത സംബോധനയും കുടുംബബന്ധത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഉൾക്കൊള്ളുന്ന വിപുലീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπίστασθε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: ശ്രോതാക്കൾക്ക് നേരത്തേ അറിയാവുന്ന കാര്യം ഓർമിപ്പിക്കുന്ന പ്രസംഗഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: പണ്ടുമുതൽതന്നെ
  rationale: മുമ്പത്തെ നാളുകളിലേക്കുള്ള പരാമർശം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് സഭയുടെ ആദ്യകാലത്തെ സൂചിപ്പിക്കാമെങ്കിലും അതിനെ വാചകത്തിൽ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεὸς
  choice: നിങ്ങളുടെയിടയിൽ ദൈവം എന്നെ തിരഞ്ഞെടുത്തത്
  rationale: ἐν ὑμῖν എന്നത് ‘നിങ്ങളുടെയിടയിൽ’ എന്നു നിലനിർത്തുന്നു. ഗ്രീക്ക് വാക്യത്തിൽ തിരഞ്ഞെടുക്കപ്പെട്ട വ്യക്തിയുടെ കർമം തുറന്നുപറയുന്നില്ലെങ്കിലും ‘എന്റെ വായിലൂടെ’ എന്ന തുടർപ്രയോഗം പത്രോസിനെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വാഭാവിക മലയാളത്തിന് ‘എന്നെ’ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦ στόματός μου
  choice: എന്റെ വായിലൂടെ
  rationale: പത്രോസിനെ ദൈവവചനത്തിന്റെ സംസാരോപാധിയായി അവതരിപ്പിക്കുന്ന മൂലഭാഷയിലെ സജീവ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ/ജാതികൾ’ എന്ന വ്യാപ്തി നിലനിർത്തുന്നു. ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: സുവിശേഷവചനം
  rationale: λόγος, εὐαγγέλιον എന്നീ ഘടകങ്ങളുടെ ഔപചാരിക ഭാവം സംക്ഷിപ്തവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: കേട്ടു വിശ്വസിക്കേണ്ടതിന്
  rationale: പരസ്പരം ബന്ധിപ്പിച്ചിരിക്കുന്ന രണ്ടു അനന്തക്രിയകളെയും അവയുടെ ഉദ്ദേശ്യബന്ധത്തെയും വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἄνδρες ἀδελφοί എന്ന ലിംഗസൂചക സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: പുരുഷന്മാരേ, സഹോദരന്മാരേ; സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ പുരുഷലിംഗ ബഹുവചനരൂപവും പതിവുസംബോധനയും മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു. സന്നിഹിതരായോ പ്രതിനിധീകരിക്കപ്പെട്ടവരായോ മറ്റുള്ളവർ ഉൾപ്പെട്ടിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത ‘സഹോദരിമാർ’ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: τὰ ἔθνη എന്നതിന്റെ രക്ഷാചരിത്രപരമായ സൂചന
  choice: ജനതകൾ
  alternative: വിജാതീയർ; യഹൂദരല്ലാത്തവർ
  rationale: മൂലപദത്തിന്റെ യഥാർഥമായ വിശാലത മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുമ്പോൾ, യെരൂശലേം സഭായോഗത്തിന്റെ സന്ദർഭത്തിൽ ഇത് യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: ἐν ὑμῖν ἐξελέξατο ὁ θεός എന്ന വാക്യഘടനയിലെ പരോക്ഷ കർമം
  choice: നിങ്ങളുടെയിടയിൽ ദൈവം എന്നെ തിരഞ്ഞെടുത്തത്
  alternative: നിങ്ങളുടെയിടയിൽ ദൈവം തിരഞ്ഞെടുത്തത്
  rationale: ഗ്രീക്കിൽ തിരഞ്ഞെടുപ്പിന്റെ കർമം പ്രകടമായി ഇല്ലെങ്കിലും ‘എന്റെ വായിലൂടെ’ എന്നത് പത്രോസിനെ വ്യക്തമായി തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിലെ അപൂർണ്ണത ഒഴിവാക്കാൻ ‘എന്നെ’ ചേർക്കുന്നു; തിരഞ്ഞെടുപ്പിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക സിദ്ധാന്തം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സഭാപ്രസംഗശൈലി. ‘എന്റെ വായിലൂടെ’, ‘സുവിശേഷവചനം’ എന്നീ രൂപങ്ങൾ ലൂക്കോസിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
