  to: 'വളരെ വാദപ്രതിവാദം നടന്നശേഷം പത്രോസ് എഴുന്നേറ്റ് അവരോടു പറഞ്ഞു: “സഹോദരന്മാരേ,[a] പണ്ടുമുതൽതന്നെ നിങ്ങളുടെയിടയിൽ ദൈവം എന്നെ തിരഞ്ഞെടുത്തത്, എന്റെ വായിലൂടെ ജനതകൾ[b] സുവിശേഷത്തിന്റെ വചനം കേൾക്കാനും വിശ്വസിക്കാനുംവേണ്ടിയാണെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.”'
