- from: അങ്ങനെ, യാത്രയാക്കി അയയ്ക്കപ്പെട്ട അവർ[a] അന്ത്യോക്യയിലേക്കു ഇറങ്ങിച്ചെന്നു[b]. അവിടെയുള്ള സമൂഹത്തെ[c] ഒരുമിച്ചുകൂട്ടിയശേഷം അവർ കത്ത് ഏൽപ്പിച്ചു.
