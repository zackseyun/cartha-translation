source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: ml
  text: അങ്ങനെ, പറഞ്ഞയക്കപ്പെട്ട അവർ[a] അന്ത്യോക്യയിലേക്കു ഇറങ്ങിച്ചെന്നു[b]; ജനസമൂഹത്തെ[c] ഒരുമിച്ചുകൂട്ടിയശേഷം അവർ കത്ത് കൈമാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിട്ടയക്കപ്പെട്ട അവർ’ അല്ലെങ്കിൽ ‘വിടപറഞ്ഞയക്കപ്പെട്ടവർ.’ ഗ്രീക്ക് പദത്തിന് ഔദ്യോഗികമായി പറഞ്ഞയയ്ക്കുക, വിട്ടയയ്ക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഇറങ്ങിച്ചെന്നു’ എന്നത് ഗ്രീക്ക് ക്രിയയിലെ ദിശാസൂചന പ്രതിഫലിപ്പിക്കുന്നു; യരൂശലേമിന്റെ ഉയർന്ന പ്രദേശത്തുനിന്ന് അന്ത്യോക്യയിലേക്കുള്ള യാത്രയെ ഇത് സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, ‘കൂടിവന്ന ജനക്കൂട്ടത്തെ,’ ‘സഭയെ,’ അല്ലെങ്കിൽ ‘സമൂഹത്തെ.’ ഈ പ്രയോഗം അന്ത്യോക്യയിൽ ഒരുമിച്ചുകൂട്ടപ്പെട്ട സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: യാത്രയാക്കി അയയ്ക്കപ്പെട്ട
  rationale: യരൂശലേമിലെ കൂടിവരവിൽനിന്ന് ഔദ്യോഗികമായി പറഞ്ഞയച്ചതും ദൗത്യത്തിനായി യാത്രയാക്കിയതുമായ ആശയം സന്ദർഭാനുസൃതമായി നൽകുന്നു; വെറും ‘വിട്ടയയ്ക്കപ്പെട്ട’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: κατῆλθον
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ഉയർന്ന പ്രദേശമായ യരൂശലേമിൽനിന്ന് അന്ത്യോക്യയിലേക്കുള്ള ഭൂമിശാസ്ത്രപരമായ ഇറക്കത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: συναγαγόντες
  choice: ഒരുമിച്ചുകൂട്ടിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവർത്തനം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഭൂതകാല കൃദന്തരൂപത്തിന്റെ ക്രമബോധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὸ πλῆθος
  choice: അവിടെയുള്ള സമൂഹത്തെ
  rationale: അന്ത്യോക്യയിലെ വിശ്വാസികളുടെ കൂടിവന്ന സമൂഹമാണ് ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നത്. ‘ജനക്കൂട്ടം’ എന്നത് ആകസ്മികമായ കൂട്ടത്തെ സൂചിപ്പിക്കാമെന്നതിനാൽ ‘സമൂഹം’ തിരഞ്ഞെടുത്തു; ഔപചാരിക സഭാസംഘടന എന്ന ആശയം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἐπέδωκαν
  choice: ഏൽപ്പിച്ചു
  rationale: കത്ത് ഔദ്യോഗികമായി ബന്ധപ്പെട്ട സമൂഹത്തിനു കൈമാറിയതെന്ന അർത്ഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιστολήν
  choice: കത്ത്
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മൂലപദത്തിന്റെ സാധാരണ അർത്ഥത്തിനു യോജിച്ചതുമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ പ്രവർത്തനക്രമവും ‘ഇറങ്ങിച്ചെന്നു’ എന്ന ദിശാസൂചനയും നിലനിർത്തി; സഭാസംബന്ധിയായ സാങ്കേതിക പദപ്രയോഗം അനാവശ്യമായി അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
