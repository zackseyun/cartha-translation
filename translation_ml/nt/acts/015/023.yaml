id: ACT.15.23
reference: Acts 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γράψαντες διὰ χειρὸς ⸀αὐτῶν· Οἱ ἀπόστολοι καὶ οἱ ⸀πρεσβύτεροι ἀδελφοὶ τοῖς κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν ἀδελφοῖς τοῖς ἐξ ἐθνῶν χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: ml
  text: 'അവർ മുഖാന്തരം[a] ഇങ്ങനെ എഴുതി അയച്ചു: “അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരായ സഹോദരന്മാരും[b], അന്ത്യോക്യയിലും സിറിയയിലും കിലിക്യയിലുമുള്ള ജനതകളിൽനിന്നുള്ള സഹോദരന്മാർക്ക്[c]: അഭിവാദ്യങ്ങൾ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവരുടെ കൈമുഖാന്തരം”; അർഥം “അവർ വഴി” അല്ലെങ്കിൽ “അവരുടെ കൈവശം കൊടുത്തയച്ചു” എന്നാകാം.
    reason: lexical_alternative
  - marker: b
    text: “അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും, സഹോദരന്മാരായ ഞങ്ങൾ” എന്നും ഗ്രീക്ക് പദബന്ധം മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: “സഹോദരന്മാർ” എന്നത് ഇവിടെ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസിസമൂഹത്തെ ഒന്നാകെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες
  choice: ഇങ്ങനെ എഴുതി അയച്ചു
  rationale: കത്ത് എഴുതി പ്രതിനിധികളുടെ കൈവശം കൊടുത്തയയ്ക്കുന്ന പ്രവൃത്തിയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം ഉപയോഗിക്കുമ്പോഴും എഴുത്തും അയക്കലും രണ്ടും നിലനിർത്തുന്നു.
- source_word: διὰ χειρὸς αὐτῶν
  choice: അവർ മുഖാന്തരം
  rationale: പ്രതിനിധികൾ വഴിയുള്ള കൈമാറ്റം അല്ലെങ്കിൽ ഏജൻസിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. ‘അവരുടെ കൈമുഖാന്തരം’ എന്ന അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: യെരൂശലേമിലെ അംഗീകൃത ദൂത-നേതാക്കളെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും പരിചിതവുമായ മലയാള ബൈബിൾപദം.
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: മൂപ്പന്മാരായ സഹോദരന്മാർ
  rationale: രണ്ടാമത്തെ നാമത്തിനു മുമ്പിൽ മറ്റൊരു നിർദേശകപദമില്ലാത്ത ഗ്രീക്ക് ഘടനയെ ഒരൊറ്റ വിശേഷിത കൂട്ടമായി അവതരിപ്പിക്കുന്നു. ‘മൂപ്പന്മാരും, സഹോദരന്മാരായ ഞങ്ങളും’ എന്ന വായനയും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἀδελφοῖς
  choice: സഹോദരന്മാർക്ക്
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹം മുഴുവനും, സ്ത്രീകൾ ഉൾപ്പെടെ, ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെന്ന ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἐξ ἐθνῶν
  choice: ജനതകളിൽനിന്നുള്ള
  rationale: ἐξ എന്നതിന്റെ ഉത്ഭവ/പശ്ചാത്തല അർഥവും ἔθνη എന്നതിന്റെ ‘ജനതകൾ’ എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യഹൂദേതര പശ്ചാത്തലമുള്ള വിശ്വാസികളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: χαίρειν
  choice: അഭിവാദ്യങ്ങൾ
  rationale: കത്തിന്റെ ആരംഭത്തിൽ ഇത് ‘സന്തോഷിക്കുവിൻ’ എന്ന കല്പനയല്ല, പതിവ് അഭിവാദനസൂത്രമാണ്.
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: അന്ത്യോക്യയിലും സിറിയയിലും കിലിക്യയിലുമുള്ള
  rationale: κατά ഇവിടെ പേരെടുത്ത സ്ഥലങ്ങളിലായി വസിക്കുന്ന സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥാനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πρεσβύτεροι ἀδελφοὶ എന്നതിലെ അയക്കുന്നവരുടെ തിരിച്ചറിയൽ
  choice: മൂപ്പന്മാരായ സഹോദരന്മാർ
  alternative: മൂപ്പന്മാരും, സഹോദരന്മാരായ ഞങ്ങളും
  rationale: ഗ്രീക്കിൽ ἀδελφοί എന്നതിന് മുമ്പ് വേറെ നിർദേശകപദമോ καί-യോ ഇല്ലാത്തതിനാൽ ‘സഹോദരന്മാരായ മൂപ്പന്മാർ’ എന്ന ബന്ധം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. എന്നാൽ ‘മൂപ്പന്മാർ, സഹോദരന്മാർ’ എന്ന സമാന്തരമോ അഭിസംബോധനാപരമോ ആയ വായന പൂർണമായി ഒഴിവാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: സമ്മിശ്ര വിശ്വാസിസമൂഹത്തോടുള്ള ἀδελφοῖς എന്ന അഭിസംബോധന
  choice: സഹോദരന്മാർക്ക്
  alternative: സഹോദരീസഹോദരന്മാർക്ക്
  rationale: മൂലത്തിലെ പുല്ലിംഗ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. അതേസമയം പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നു എന്ന് വിധിക്കാതെ, മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കത്തുശൈലി സ്വീകരിച്ചു. ‘അവർ മുഖാന്തരം’ എന്നത് ഗ്രീക്ക് കൈ-പ്രയോഗത്തെ മലയാളത്തിൽ ബലമായി അനുകരിക്കാതെ അതിന്റെ പ്രവർത്തനാർഥം നൽകുന്നു. ‘ജനതകളിൽനിന്നുള്ള’ എന്ന രൂപം ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാനചിത്രം നിലനിർത്തുകയും സന്ദർഭത്തിലെ യഹൂദേതര പശ്ചാത്തലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. പ്രധാന വ്യാകരണ-സമൂഹപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
