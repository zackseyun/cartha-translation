source:
  edition: SBLGNT
  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: ml
  text: അവർ പരസ്പരം വേർപിരിയുന്നത്ര രൂക്ഷമായ അഭിപ്രായഭിന്നത ഉണ്ടായി.[a] ബർന്നബാസ് മർക്കോസിനെ കൂടെക്കൂട്ടി കപ്പലിൽ സൈപ്രസിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കടുത്ത തർക്കം.” ഗ്രീക്ക് പദം ശക്തമായ പ്രകോപനത്തെയോ തീവ്രമായ ഏറ്റുമുട്ടലിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: അപ്പോൾ ... ഉണ്ടായി
  rationale: പുതിയ സംഭവവികാസം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ആഖ്യാനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; δέയെ ശക്തമായ വിരോധസൂചകമായി അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: παροξυσμὸς
  choice: രൂക്ഷമായ അഭിപ്രായഭിന്നത
  rationale: വെറും ഉള്ളിലെ അസ്വസ്ഥതയല്ല, പൗലോസും ബർന്നബാസും തമ്മിലുണ്ടായ തീവ്രമായ ഏറ്റുമുട്ടലാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ആ തീവ്രത നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: അതിനാൽ അവർ പരസ്പരം വേർപിരിഞ്ഞു
  rationale: ὥστεയോടുകൂടിയ infinitive ഫലത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ പൂർണവാക്യഘടനയിൽ ആ ഫലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τόν τε Βαρναβᾶν
  choice: ബർന്നബാസ്
  rationale: τε ഇവിടെ തുടർന്നുവരുന്ന വിഭജിത പ്രവർത്തനത്തിലെ ആദ്യ അംഗത്തെ അവതരിപ്പിക്കുന്നു; 40-ാം വാക്യത്തിലേക്കുള്ള ആഖ്യാനബന്ധം കാത്തുസൂക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ പ്രത്യേക സംയോജകം നിർബന്ധമല്ല.
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: മർക്കോസിനെ കൂടെക്കൂട്ടി
  rationale: παραλαμβάνωയുടെ ‘കൂടെ കൊണ്ടുപോകുക’ എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; ഗ്രീക്കിലുള്ളതുപോലെ പേര് ‘മർക്കോസ്’ എന്നു മാത്രം നിലനിർത്തുന്നു.
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: കപ്പലിൽ സൈപ്രസിലേക്കു പുറപ്പെട്ടു
  rationale: ἐκπλέωയിൽ ഉള്ള കടൽമാർഗമുള്ള പുറപ്പെടൽ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തോലിക സഹപ്രവർത്തകരുടെ സംഘർഷത്തിന്റെ ആഖ്യാനാവതരണം
  choice: സംഘർഷത്തെ ‘രൂക്ഷമായ അഭിപ്രായഭിന്നത’ എന്ന് നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: കടുത്ത തർക്കം; രൂക്ഷമായ ഏറ്റുമുട്ടൽ
  rationale: ഈ വാക്യം ബർന്നബാസും പൗലോസും തമ്മിലുള്ള യഥാർഥവും തീവ്രവുമായ സംഘർഷം രേഖപ്പെടുത്തുന്നു. അതിനെ മയപ്പെടുത്താതെയും പദത്തിന്റെ തെളിവിനെക്കാൾ ശക്തമാക്കാതെയും ധാർമ്മിക വിധിനിർണയം ചേർക്കാതെയും അവതരിപ്പിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘അഭിപ്രായഭിന്നത’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘രൂക്ഷമായ’ എന്ന വിശേഷണം മൂലപദത്തിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു. ‘കപ്പലിൽ ... പുറപ്പെട്ടു’ എന്നത് കടൽയാത്രയുടെ ആശയം അനായാസമായി വ്യക്തമാക്കുന്നു.
