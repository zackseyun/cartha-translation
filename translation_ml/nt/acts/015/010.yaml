  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ഇപ്പോൾ നിങ്ങൾ എന്തിന് ദൈവത്തെ പരീക്ഷിക്കുന്നു[a]—ശിഷ്യന്മാരുടെ കഴുത്തിൽ, ഞങ്ങളുടെ പിതാക്കന്മാർക്കോ[c] ഞങ്ങൾക്കോ വഹിക്കാൻ കഴിഞ്ഞിട്ടില്ലാത്ത ഒരു നുകം[b] വെച്ചുകൊണ്ട്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ എന്തിന് ദൈവത്തെ പരീക്ഷണത്തിന് വിധേയനാക്കുന്നു?”
    reason: lexical_alternative
  - marker: b
    text: “നുകം” ചുമത്തുന്ന ബാധ്യതയുടെ രൂപകമാണ്; സന്ദർഭത്തിൽ, ശിഷ്യന്മാരുടെമേൽ വെക്കുന്ന നിബന്ധനകളെയാണ് അത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: “ഞങ്ങളുടെ പിതാക്കന്മാർ” എന്നത് “ഞങ്ങളുടെ പൂർവികർ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: οὖν എന്നതിന്റെ നിഗമനാത്മക ബലവും νῦν എന്നതിന്റെ വർത്തമാനകാല ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τί πειράζετε τὸν θεόν
  choice: നിങ്ങൾ എന്തിന് ദൈവത്തെ പരീക്ഷിക്കുന്നു?
  rationale: τί ഇവിടെ അലങ്കാരപ്രശ്നത്തിലെ ‘എന്തിന്’ എന്ന അർഥം നൽകുന്നു; πειράζω ദൈവത്തെ പരീക്ഷിക്കുക/പരീക്ഷണത്തിന് വിധേയനാക്കുക എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιθεῖναι
  choice: വെച്ചുകൊണ്ട്
  rationale: ദൈവത്തെ പരീക്ഷിക്കുന്നതിന്റെ രീതിയോ ഉള്ളടക്കമോ വ്യക്തമാക്കുന്ന ഇൻഫിനിറ്റീവ് ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ζυγὸν
  choice: ഒരു നുകം
  rationale: ചുമത്തപ്പെടുന്ന ബാധ്യതയെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ചു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸν τράχηλον τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ കഴുത്തിൽ
  rationale: ഉജ്ജ്വലമായ നുകരൂപകം നേരിട്ടും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു; μαθητής എന്നതിന് അപ്പൊസ്തലപ്രവൃത്തികളിൽ പതിവായ ‘ശിഷ്യൻ’ ഉപയോഗിക്കുന്നു.
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: ഞങ്ങളുടെ പിതാക്കന്മാർക്കോ ഞങ്ങൾക്കോ
  rationale: οὔτε…οὔτε എന്ന ഇരട്ടനിഷേധം മലയാളത്തിലെ ‘-ക്കോ…-ക്കോ’ ഘടനയിലൂടെ നൽകുന്നു; πατέρες മുൻതലമുറയിലെ പിതാക്കന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: ἰσχύσαμεν βαστάσαι
  choice: വഹിക്കാൻ കഴിഞ്ഞിട്ടില്ലാത്ത
  rationale: കഴിവില്ലായ്മയും നുകം ചുമക്കുന്നതിന്റെ രൂപകവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇന്നുവരെ സാധിച്ചിട്ടില്ലെന്ന ഫലം മലയാളത്തിലെ പൂർണകാലരൂപം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘നുകം’ എന്ന രൂപകത്തിന്റെ കൃത്യമായ സൂചന
  choice: ശിഷ്യന്മാരുടെമേൽ ചുമത്തപ്പെടുന്ന ബാധ്യതയുടെ രൂപകമായി ‘നുകം’ നിലനിർത്തി; അതിന്റെ പരിധി മുഖ്യവാചകത്തിൽ കൂടുതൽ നിർവചിച്ചില്ല.
  alternative: മോശെയുടെ ന്യായപ്രമാണം മുഴുവനായോ, പരിച്ഛേദനയും അനുബന്ധ നിബന്ധനകളും മാത്രമായോ ഇതിനെ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: അടുത്ത സന്ദർഭം ജാതികളിൽനിന്നുള്ള വിശ്വാസികളിൽ ചുമത്തുന്ന ആവശ്യങ്ങളെക്കുറിച്ചാണെങ്കിലും, ഈ വാക്യം തന്നെ രൂപകാത്മകമായി സംസാരിക്കുന്നു. അതിനാൽ പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘നുകം’, ‘കഴുത്ത്’, ‘വഹിക്കുക’ എന്നീ പരസ്പരം ബന്ധമുള്ള രൂപകപദങ്ങൾ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
