    rationale: πρὸς τοὺς ἀποστείλαντας αὐτούς means ‘to those who had sent them’; it does not explicitly use a ‘return’ verb. In Malayalam, “അവരെ അയച്ചവരുടെ” clearly identifies the delegates as the ones sent.
