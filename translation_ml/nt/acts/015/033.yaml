  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: ml
  text: അവർ അവിടെ കുറച്ചുകാലം ചെലവഴിച്ചശേഷം, സഹോദരന്മാർ[a] അവരെ സമാധാനത്തോടെ അവരെ അയച്ചവരുടെ അടുക്കലേക്ക് പറഞ്ഞയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരന്മാരും സഹോദരിമാരും’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് വിശ്വാസിസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: അവർ അവിടെ കുറച്ചുകാലം ചെലവഴിച്ചശേഷം
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം ഒരു കാലയളവ് താമസിക്കുകയോ ചെലവഴിക്കുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭം അന്ത്യോക്യയിലെ താമസമായതിനാൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘അവിടെ’ ചേർത്തിരിക്കുന്നു; അത് ഗ്രീക്കിൽ നേരിട്ട് ഇല്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ആഖ്യാനം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിലെ വാക്യക്രമവും ‘ശേഷം’ എന്ന പ്രയോഗവും അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἀπελύθησαν
  choice: യാത്രയാക്കി
  rationale: പ്രതിനിധികളെ സമൂഹം സമാധാനപൂർവം പറഞ്ഞയയ്ക്കുന്ന സന്ദർഭത്തിൽ ‘യാത്രയാക്കി’ എന്നത് ‘വിട്ടയച്ചു’ അല്ലെങ്കിൽ ‘മോചിപ്പിച്ചു’ എന്നതിനെക്കാൾ സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: μετ’ εἰρήνης
  choice: സമാധാനത്തോടെ
  rationale: സൗഹാർദത്തോടെയും ക്ഷേമാശംസയോടെയും യാത്രയയച്ചതിനെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. എന്നാൽ ഈ സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പ്രയോഗമായിരിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: തങ്ങളെ അയച്ചവരുടെ അടുക്കലേക്ക് അവർ മടങ്ങി
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തം അവരെ മുമ്പ് നിയോഗിച്ചയച്ചവരെ സൂചിപ്പിക്കുന്നു. ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള മടക്കം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘മടങ്ങി’ ഉപയോഗിച്ചു; ‘തിരികെ’ എന്ന ആശയം സന്ദർഭസിദ്ധമാണ്.
theological_decisions:
- issue: ἀδελφοί എന്ന പദത്തിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാർ’
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘വിശ്വാസികൾ’
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ രൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം അത് മുഴുവൻ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുണ്ടെന്ന അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ഇവിടെ പ്രത്യേകമായ ഒരു സഭാവിഭാഗത്തിന്റെ ഉപദേശം ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ നിർജീവപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃപ്രയോഗമാക്കി; അർഥബന്ധം സംരക്ഷിച്ചിട്ടുണ്ട്.
