id: ACT.15.41
reference: Acts 15:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διήρχετο δὲ τὴν Συρίαν καὶ ⸀τὴν Κιλικίαν ἐπιστηρίζων τὰς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: ml
  text: അവൻ സിറിയയിലൂടെയും കിലിക്യയിലൂടെയും സഞ്ചരിച്ചുകൊണ്ട് സഭകളെ ശക്തിപ്പെടുത്തിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: സഞ്ചരിച്ച്
  rationale: അപൂർണ്ണ ഭൂതകാല ക്രിയ പ്രദേശങ്ങളിലൂടെ തുടർന്നുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനുബന്ധ കൃുദന്തരൂപം സ്വാഭാവികമായി മുഖ്യക്രിയയോടു ബന്ധിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മുൻവാക്യത്തിന്റെ തുടർച്ച മലയാളത്തിലെ വാക്യക്രമംകൊണ്ട് വ്യക്തമായതിനാൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതിരിക്കുന്നത് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: Συρίαν
  choice: സിറിയ
  rationale: പ്രദേശനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: Κιλικίαν
  choice: കിലിക്യ
  rationale: പ്രദേശനാമത്തിന്റെ മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: ἐπιστηρίζων
  choice: ശക്തിപ്പെടുത്തിക്കൊണ്ടിരുന്നു
  rationale: യാത്രയ്ക്കൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയായി സഭകളെ ഉറപ്പിക്കുകയും ബലപ്പെടുത്തുകയും ചെയ്തതിനെ ഈ രൂപം വ്യക്തമാക്കുന്നു; വെറും വൈകാരിക പ്രോത്സാഹനമായി അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: ἐκκλησίας
  choice: സഭകളെ
  rationale: ഇവിടെ പ്രാദേശിക ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ഏറ്റവും വ്യക്തവും പ്രചാരമുള്ളതുമായ പദം ‘സഭകൾ’ ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ‘ശക്തിപ്പെടുത്തിക്കൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; വാക്യം അനാവശ്യമായി ഭാരപ്പെടുത്താതെ സഞ്ചാരവും അനുബന്ധ ശുശ്രൂഷയും സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
