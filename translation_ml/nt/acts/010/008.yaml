  text: καὶ ἐξηγησάμενος ⸂ἅπαντα αὐτοῖς⸃ ἀπέστειλεν αὐτοὺς εἰς τὴν Ἰόππην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: ml
  text: എല്ലാം അവർക്കു വിശദീകരിച്ചശേഷം, അവൻ അവരെ യോപ്പയിലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: വിശദീകരിച്ചശേഷം
  rationale: ആഓറിസ്റ്റ് മധ്യവാചക കൃദന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. കാര്യങ്ങൾ പൂർണമായി വിവരിച്ചുകൊടുത്തു എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ ഇതു നൽകുന്നു.
- source_word: ἅπαντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനമായ ἅπαντα ഇവിടെ സമഗ്രമായി ‘എല്ലാം’ എന്നർഥം നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: ദത്തിവ് സർവനാമം വിശദീകരണം ലഭിച്ചവരെ പരോക്ഷ കർമമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπέστειλεν
  choice: അയച്ചു
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം ‘അയയ്ക്കുക’ എന്നാണ്; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത അടിയന്തരത ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν Ἰόππην
  choice: യോപ്പയിലേക്ക്
  rationale: εἰς സ്ഥലനാമത്തോടൊപ്പം ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള സഞ്ചാരം സൂചിപ്പിക്കുന്നു. Ἰόππη എന്ന സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ രൂപത്തിൽ ‘യോപ്പ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ കൃദന്തരൂപത്തിന്റെ മുൻകാലബന്ധം ‘-ശേഷം’ കൊണ്ട് വ്യക്തമായി നിലനിർത്തി.
