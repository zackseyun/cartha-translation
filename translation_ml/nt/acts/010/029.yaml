source:
  edition: SBLGNT
  text: διὸ καὶ ἀναντιρρήτως ἦλθον μεταπεμφθείς πυνθάνομαι οὖν τίνι λόγῳ μετεπέμψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: ml
  text: 'അതുകൊണ്ട്, എന്നെ വിളിച്ചുവരുത്തിയപ്പോൾ ഞാൻ എതിർപ്പൊന്നും കൂടാതെ വന്നു[a]. അതിനാൽ ഞാൻ ചോദിക്കുന്നു: എന്തു കാരണത്താലാണ് നിങ്ങൾ എന്നെ വിളിച്ചുവരുത്തിയത്?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മടികൂടാതെ.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘എതിർപ്പില്ലാതെ’ അഥവാ ‘തർക്കിക്കാതെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, ‘എന്തുകൊണ്ടാണ് നിങ്ങൾ എന്നെ വിളിച്ചുവരുത്തിയത്?’ അക്ഷരാർഥം: ‘എന്തു കാരണത്താലാണ് നിങ്ങൾ എന്നെ വിളിച്ചുവരുത്തിയത്?’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നു. καί നൽകുന്ന നേരിയ ഊന്നൽ മലയാളത്തിൽ പ്രത്യേകം ചേർത്താൽ കൃത്രിമമാകുന്നതിനാൽ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു.
- source_word: ἀναντιρρήτως
  choice: എതിർപ്പൊന്നും കൂടാതെ
  rationale: എതിർത്തുപറയാതെയും തർക്കിക്കാതെയും പ്രവർത്തിക്കുക എന്ന ഗ്രീക്ക് പദത്തിന്റെ മുഖ്യാർഥം സംരക്ഷിക്കുന്നു; ‘മടികൂടാതെ’ എന്നത് സാദ്ധ്യമായെങ്കിലും കുറച്ച് വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἦλθον
  choice: ഞാൻ ... വന്നു
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ലളിതവും നേരിട്ടുമുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μεταπεμφθείς
  choice: എന്നെ വിളിച്ചയച്ചപ്പോൾ
  rationale: ആളെ വരുത്താൻ സന്ദേശമയയ്ക്കുക അഥവാ വിളിച്ചുവരുത്തുക എന്ന passive participle-ന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: πυνθάνομαι οὖν
  choice: അതിനാൽ ഞാൻ ചോദിക്കട്ടെ
  rationale: ചോദിച്ചറിയുക എന്ന ക്രിയാർഥവും ചോദ്യത്തിലേക്കുള്ള οὖν എന്ന പരിവർത്തനബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τίνι λόγῳ
  choice: എന്തു കാരണത്താലാണ്
  rationale: ‘എന്തുകൊണ്ട്’ എന്ന ചുരുക്കരൂപത്തെക്കാൾ ഗ്രീക്കിലെ ‘എന്തു കാരണത്താൽ’ എന്ന ഘടനയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: μετεπέμψασθέ με
  choice: നിങ്ങൾ എന്നെ വിളിച്ചയച്ചത്
  rationale: മുമ്പത്തെ μεταπεμφθείς എന്ന അതേ പദമൂലവുമായുള്ള ആന്തരിക പദബന്ധം മലയാളത്തിലും സംരക്ഷിക്കുന്നു.
