translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംസാരശൈലി സ്വീകരിച്ചു. ‘വിളിച്ചയച്ചു’ എന്ന പ്രയോഗം രണ്ടു സ്ഥലത്തും ആവർത്തിച്ച് ഗ്രീക്കിലെ ഒരേ പദമൂലത്തിന്റെ ബന്ധം നിലനിർത്തി; യഥാർഥമായ പദാർഥവൈകല്പികങ്ങൾ അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചു.
