id: ACT.10.39
reference: Acts 10:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: ml
  text: അവൻ യെഹൂദന്മാരുടെ ദേശത്തും യെരൂശലേമിലും ചെയ്ത എല്ലാറ്റിന്റെയും ഞങ്ങൾ സാക്ഷികളാണ്. അവർ അവനെ മരത്തിൽ[a] തൂക്കിക്കൊന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരക്കഷണത്തിൽ’ എന്നും, വ്യാഖ്യാനപരമായി ‘ക്രൂശിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘മരം’ എന്നാണ്; ഇത് ആവർത്തനം 21:23-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: സാക്ഷികൾ
  rationale: നേരിട്ടറിഞ്ഞ കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രമാണപരവുമായ മലയാളപദം.
- source_word: πάντων ὧν ἐποίησεν
  choice: അവൻ ചെയ്ത എല്ലാറ്റിനും
  rationale: πάντων എന്ന പദത്തിന്റെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരുടെ ദേശത്തും
  rationale: χώρα എന്നതിന്റെ ദേശം/പ്രദേശം എന്ന അർഥം നിലനിർത്തുന്നു; റോമൻ പ്രവിശ്യയായ യെഹൂദ്യ എന്ന് അനാവശ്യമായി കൃത്യമാക്കുന്നില്ല.
- source_word: καὶ Ἰερουσαλήμ
  choice: യെരൂശലേമിലും
  rationale: ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത സ്ഥലസൂചകബന്ധം മലയാളത്തിലെ ‘-ഇലും’ വഴി വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνεῖλαν
  choice: കൊന്നു
  rationale: ഇവിടെ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘കൊല്ലുക’ എന്നതാണ്; സംക്ഷിപ്തവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: മരത്തിൽ തൂക്കിക്കൊന്നു
  rationale: തൂക്കിയത് മരണവിധിയുടെ മാർഗമായിരുന്നുവെന്ന ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ξύλον എന്ന പദത്തെ ‘ക്രൂശ്’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ക്രൂശീകരണസന്ദർഭത്തിൽ ξύλου എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മരത്തിൽ
  alternative: ക്രൂശിൽ / മരത്തടിയിൽ
  rationale: മൂലപാഠത്തിൽ σταυρός അല്ല, ξύλον ആണ്. ‘മരം’ എന്ന പരിഭാഷ ആവർത്തനം 21:23-ലേക്കുള്ള സാധ്യതയുള്ള പ്രതിധ്വനി നിലനിർത്തുകയും ‘ക്രൂശ്’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യെഹൂദന്മാരുടെ ദേശം’ എന്നത് ജനവിഭാഗപരവും ഭൗമികവുമായ മൂലപാഠത്തിന്റെ സാധ്യതകൾ അനാവശ്യമായി ചുരുക്കുന്നില്ല; ‘തൂക്കിക്കൊന്നു’ പ്രവർത്തിയും മരണവും തമ്മിലുള്ള ബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
