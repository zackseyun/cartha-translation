id: ACT.10.32
reference: Acts 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: ml
  text: അതുകൊണ്ട് യോപ്പയിലേക്ക് ആളയച്ച് പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെ വരുത്തുക.[a] അദ്ദേഹം കടൽത്തീരത്ത് തോൽപ്പണിക്കാരനായ ശിമോന്റെ വീട്ടിൽ അതിഥിയായി താമസിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശിമോനെ വിളിപ്പിക്കുക”; ഗ്രീക്ക് ക്രിയയുടെ അർഥം ഒരാളെ തന്റെ അടുക്കലേക്ക് വിളിച്ചുവരുത്തുക എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “അതിഥിയായി താമസിക്കുന്നു” എന്നത് പത്രോസ് ആ വീട്ടുകാരുടെ ആതിഥ്യം സ്വീകരിച്ചു പാർക്കുന്നു എന്നു സൂചിപ്പിക്കുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: അതുകൊണ്ട് യോപ്പയിലേക്ക് ആളയച്ച്
  rationale: πέμψον എന്ന ആജ്ഞയും οὖν സൂചിപ്പിക്കുന്ന മുൻവചനത്തോടുള്ള നിഗമനബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ദൂതന്മാരെ അയയ്ക്കുന്ന സന്ദർഭം ‘ആളയച്ച്’ വ്യക്തമാക്കുന്നു.
- source_word: μετακάλεσαι
  choice: വരുത്തുക
  rationale: ഒരാളെ തന്റെ അടുക്കലേക്ക് വിളിച്ചുവരുത്തുക എന്ന മധ്യമപ്രയോഗത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോനെ
  rationale: ശിമോൻ അറിയപ്പെടുന്ന മറ്റൊരു പേര് പത്രോസ് ആണെന്ന ഗ്രീക്ക് വാക്യഘടനയെ അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: ξενίζεται
  choice: അതിഥിയായി താമസിക്കുന്നു
  rationale: വെറും താമസമല്ല, മറ്റൊരാളുടെ ആതിഥ്യം സ്വീകരിച്ച് പാർക്കുന്നു എന്ന passive/middle ഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: തോൽപ്പണിക്കാരനായ ശിമോന്റെ വീട്ടിൽ
  rationale: οἰκία എന്ന ‘വീട്’ എന്ന പദവും βυρσεύς സൂചിപ്പിക്കുന്ന തോൽ സംസ്കരണത്തൊഴിലും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: παρὰ θάλασσαν
  choice: കടൽത്തീരത്ത്
  rationale: കടലിനരികെയുള്ള സ്ഥാനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തോൽപ്പണിക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് തൊഴിൽ വ്യക്തമായി മനസ്സിലാക്കാൻ സഹായിക്കുന്നു; ‘അതിഥിയായി താമസിക്കുന്നു’ ξενίζεται എന്ന പദത്തിന്റെ ആതിഥ്യഭാവം സംരക്ഷിക്കുന്നു.
