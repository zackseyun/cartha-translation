id: ACT.10.3
reference: Acts 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: ml
  text: 'അവൻ ഒരു ദർശനത്തിൽ വ്യക്തമായി കണ്ടു: പകൽ ഏകദേശം ഒൻപതാം മണിക്കൂറിൽ[b] ദൈവത്തിന്റെ ഒരു ദൂതൻ അവന്റെ അടുക്കലേക്കു കടന്നുവന്ന് അവനോട്, “കൊർന്നേല്യൊസേ!” എന്നു പറഞ്ഞു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ആധുനിക സമയക്കണക്കനുസരിച്ച് ഉച്ചകഴിഞ്ഞ് ഏകദേശം മൂന്നുമണി.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδεν ἐν ὁράματι
  choice: ഒരു ദർശനത്തിൽ … കണ്ടു
  rationale: ὅραμα ഒരു ദൈവിക ദർശനത്തെയോ അതീന്ദ്രിയ കാഴ്ചയെയോ സൂചിപ്പിക്കുന്നു; സംഭവത്തെ കൂടുതൽ വ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: φανερῶς
  choice: വ്യക്തമായി
  rationale: ദർശനം അവ്യക്തമല്ലാതെ തെളിമയോടെ അനുഭവപ്പെട്ടുവെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: പകൽ ഏകദേശം ഒൻപതാം മണിക്കൂറിൽ
  rationale: ὡσεὶ, περὶ എന്നിവ നൽകുന്ന ഏകദേശഭാവവും മൂലപാഠത്തിലെ മണിക്കൂർ കണക്കും നിലനിർത്തുന്നു; ആധുനിക സമയതുല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἄγγελον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഒരു ദൂതൻ
  rationale: ദർശനസന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പതിവും കൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: അവന്റെ അടുക്കൽ അകത്തേക്കു വന്ന്
  rationale: εἰσελθόντα സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള പ്രവേശനവും കൊർന്നേല്യൊസിന്റെ സന്നിധിയിലേക്കുള്ള ചലനവും നിലനിർത്തുന്നു.
- source_word: καὶ εἰπόντα αὐτῷ
  choice: അവനോട് … എന്നു പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ കൃതന്തഘടന മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ സ്വാഭാവികമായ ആഖ്യാനക്രിയയായി നൽകുന്നു.
- source_word: Κορνήλιε
  choice: കൊർന്നേല്യൊസേ
  rationale: Κορνήλιος എന്ന പേരിന്റെ സംബോധനരൂപമാണെന്ന് മലയാളത്തിലെ സംബോധനപ്രത്യയംകൊണ്ട് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἄγγελος എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: സ്വർഗീയ ദൂതൻ
  alternative: മനുഷ്യനായ സന്ദേശവാഹകൻ
  rationale: ദൈവിക ദർശനത്തിനുള്ളിൽ പ്രത്യക്ഷപ്പെടുകയും ‘ദൈവത്തിന്റെ’ എന്നു വിശേഷിപ്പിക്കപ്പെടുകയും ചെയ്യുന്നതിനാൽ ഇവിടെ സ്വർഗീയ ദൂതനാണ് സ്വാഭാവികമായ അർഥം; പാഠം പറയുന്നതിലപ്പുറം വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ സമയരീതി മുഖ്യപാഠത്തിൽ നിലനിർത്തി; വായനാസഹായത്തിനായി ആധുനിക തുല്യം അടിക്കുറിപ്പിൽ നൽകി. ഉദ്ധരണിയിലെ സംബോധനം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ആശ്ചര്യചിഹ്നം ഉപയോഗിച്ചു.
