  edition: SBLGNT
  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: ml
  text: അവർ വിളിച്ചിട്ട്, പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോൻ ഇവിടെ അതിഥിയായി താമസിക്കുന്നുണ്ടോ[a] എന്ന് ചോദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവിടെ പാർക്കുന്നുണ്ടോ?” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളുടെ അതിഥിയായി താമസിക്കുക എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: വിളിച്ചുചോദിച്ചു
  rationale: വീട്ടിലുള്ളവരോടു ശബ്ദമുയർത്തി വിളിച്ചതിനു പിന്നാലെ ചോദിച്ചതെന്ന ക്രിയാക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: ἐπυνθάνοντο
  choice: ചോദിച്ചു
  rationale: അപൂർണ്ണഭൂതകാലരൂപത്തിലെ അന്വേഷണഭാവം സന്ദർഭത്തിൽ വ്യക്തമാണ്; ‘അന്വേഷിച്ചു’ എന്നതിനെക്കാൾ സാധാരണവും സ്വാഭാവികവുമാണ്.
- source_word: εἰ
  choice: -ഉണ്ടോ
  rationale: പരോക്ഷചോദ്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ധൃത ചോദ്യമായി അവതരിപ്പിക്കുമ്പോൾ ‘ഉണ്ടോ’ അതിന്റെ സംശയാർഥം കൃത്യമായി വഹിക്കുന്നു.
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോൻ
  rationale: രണ്ടു പേരുകളും നിലനിർത്തുകയും ἐπικαλούμενος എന്ന വർത്തമാന നിഷ്ക്രിയ പങ്കാളിത്തരൂപത്തിന്റെ അർഥം നേരിട്ട് പകർന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐνθάδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചക ക്രിയാവിശേഷണത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളസമാനം.
- source_word: ξενίζεται
  choice: അതിഥിയായി താമസിക്കുന്നുണ്ടോ
  rationale: വെറും താമസത്തേക്കാൾ, മറ്റൊരാളുടെ ആതിഥ്യം സ്വീകരിച്ച് കഴിയുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ അതിഥിസൽക്കാരസൂചനയും ഉൾക്കൊള്ളുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ പങ്കാളിത്തക്രിയയും അപൂർണ്ണഭൂതകാല അന്വേഷണവും മലയാളത്തിൽ ഒഴുക്കുള്ള നേരിട്ടുള്ള ചോദ്യമായി പുനഃക്രമീകരിച്ചു; അതിഥിയായി കഴിയുന്നുവെന്ന സൂചന മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
