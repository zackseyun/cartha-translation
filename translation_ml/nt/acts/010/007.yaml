    issue: The phrase «തന്നെ പരിചരിച്ചിരുന്ന സൈനികരിൽ» makes all of the persons attending Cornelius into soldiers.
    rationale: Greek τῶν προσκαρτερούντων αὐτῷ is a plural substantive, 'those attending him,' and στρατιώτην is a singular person selected from among them. The source does not identify the entire attending group as soldiers.
  - severity: low
