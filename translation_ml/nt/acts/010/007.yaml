id: ACT.10.7
reference: Acts 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: ml
  text: തന്നോടു സംസാരിച്ചുകൊണ്ടിരുന്ന ദൂതൻ പോയശേഷം, കൊർന്നേല്യൊസ് തന്റെ വീട്ടിലെ ജോലിക്കാരിൽ രണ്ടുപേരെയും, തന്നെ പരിചരിച്ചുകൊണ്ടിരുന്നവരിൽപ്പെട്ട ഭക്തനായ ഒരു സൈനികനെയും വിളിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വീട്ടിലെ ജോലിക്കാർ” എന്നതിനുപകരം “വീട്ടിലെ അടിമകൾ” എന്നും പരിഭാഷപ്പെടുത്താം. οἰκέται എന്ന ഗ്രീക്ക് പദം വീട്ടിലെ അടിമസേവനത്തിൽ ഉണ്ടായിരുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: പോയശേഷം
  rationale: ദൂതൻ പോയത് വിളിക്കുന്ന പ്രവൃത്തിക്ക് മുമ്പാണെന്ന കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: തന്നോടു സംസാരിച്ച ദൂതൻ
  rationale: സന്ദർഭത്തിൽ ἄγγελος സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്. വർത്തമാന കൃദന്തരൂപം ദൂതനെ തിരിച്ചറിയിക്കുന്ന സ്വാഭാവികമായ ഉപവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: φωνήσας
  choice: വിളിച്ചു
  rationale: അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ഗ്രീക്ക് വാക്യഘടനയ്ക്കുള്ളിൽ, കൊർന്നേല്യൊസ് ആളുകളെ വിളിച്ചുകൂട്ടിയ പ്രവൃത്തി ലളിതമായി അറിയിക്കുന്നു.
- source_word: δύο τῶν οἰκετῶν
  choice: തന്റെ വീട്ടുജോലിക്കാരിൽ രണ്ടുപേരെ
  rationale: οἰκέτης വീട്ടിലെ അധീനസേവനത്തിലുള്ള ആളെ സൂചിപ്പിക്കുന്നു. 'വീട്ടുജോലിക്കാർ' ഗാർഹിക പശ്ചാത്തലം നിലനിർത്തുന്ന, ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായ പദമാണ്; ഉടമസ്ഥസർവനാമം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: στρατιώτην εὐσεβῆ
  choice: ഭക്തനായ ഒരു സൈനികനെ
  rationale: εὐσεβής ദൈവഭക്തിയോടെയുള്ള ഭക്തിനിഷ്ഠയെ സൂചിപ്പിക്കുന്നു; 'ദൈവഭയമുള്ള' എന്നു നൽകിയാൽ മൂലപദത്തിൽ ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകമായ വർഗീകരണം ചേർന്നേക്കാം.
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: തന്നെ പരിചരിച്ചിരുന്ന സൈനികരിൽ
  rationale: പ്രസ്തുത സൈനികൻ കൊർന്നേല്യൊസിന്റെ അടുത്ത് സ്ഥിരമായി സേവനമനുഷ്ഠിച്ചിരുന്ന സംഘത്തിൽപ്പെട്ടവനാണെന്ന ഭാഗികബന്ധം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ 'സൈനികരിൽ' എന്നു വ്യക്തമാക്കി.
theological_decisions:
- issue: ἄγγελος എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: സ്വർഗീയ ദൂതനെ സൂചിപ്പിക്കുന്ന “ദൂതൻ”
  alternative: സാധാരണ മനുഷ്യ സന്ദേശവാഹകൻ
  rationale: പ്രവൃത്തികൾ 10-ലെ ദർശനസന്ദർഭം ഇത് ദൈവികമായി അയയ്ക്കപ്പെട്ട സ്വർഗീയ ദൂതനാണെന്ന് വ്യക്തമാക്കുന്നു.
- issue: εὐσεβής എന്ന വിശേഷണത്തിന്റെ പരിധി
  choice: ഭക്തനായ
  alternative: ദൈവഭയമുള്ള
  rationale: ഭക്തിനിഷ്ഠ എന്ന പൊതുവായ അർഥം നിലനിർത്തുകയും, ഇവിടെ പദംതന്നെ നിർബന്ധിക്കാത്ത പ്രത്യേക മതപരമായ വർഗീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിൽ അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ഘടന നിലനിൽക്കുന്നതിനാൽ ഈ വാക്യം പൂർണവിരാമത്തോടെ അവസാനിപ്പിക്കാതെ തുടർച്ച സൂചിപ്പിക്കുന്ന രീതിയിലാക്കാവുന്നതാണ്; എന്നാൽ ഒറ്റവാക്യ പ്രസിദ്ധീകരണത്തിനായി വായനാസൗകര്യം മുൻനിർത്തി പൂർണവാക്യമായി നൽകിയിരിക്കുന്നു. 'കൊർന്നേല്യൊസ്' എന്ന കർത്താവ് ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്നതെങ്കിലും ഒറ്റവാക്യത്തിൽ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് ചേർത്തു.
