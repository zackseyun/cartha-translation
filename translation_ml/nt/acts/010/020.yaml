id: ACT.10.20
reference: Acts 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: ml
  text: എന്നാൽ എഴുന്നേറ്റ് താഴേക്കു ചെല്ലുക; ഒട്ടും സംശയിക്കാതെ[a] അവരോടൊപ്പം പോകുക. കാരണം, ഞാനാണ് അവരെ അയച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യാതൊരു വേർതിരിവും കാണിക്കാതെ.” ഗ്രീക്ക് പ്രയോഗത്തിന് സംശയിക്കാതിരിക്കുക/മടിക്കാതിരിക്കുക എന്നും വേർതിരിവ് കാണിക്കാതിരിക്കുക എന്നും അർഥമാകാം; രണ്ടാമത്തെ അർഥം ഈ അധ്യായത്തിലെ യെഹൂദൻ–വിജാതീയൻ പ്രമേയത്തെ പ്രതിധ്വനിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: പത്രോസിന്റെ ആശയക്കുഴപ്പത്തിൽനിന്ന് ദൈവാത്മാവ് കല്പിക്കുന്ന പ്രവർത്തനത്തിലേക്കുള്ള വൈരുധ്യവും വഴിത്തിരിവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: തുടർന്നുവരുന്ന കല്പനകളോടു ചേർന്ന് ഉടൻ പ്രവർത്തിക്കാനുള്ള ആഹ്വാനം നൽകുന്ന ക്രിയാവിശേഷണരൂപത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κατάβηθι
  choice: താഴേക്കു ചെല്ലുക
  rationale: പത്രോസ് ഉണ്ടായിരുന്ന മട്ടുപ്പാവിൽനിന്നുള്ള താഴോട്ടുള്ള ചലനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πορεύου σὺν αὐτοῖς
  choice: അവരോടൊപ്പം പോകുക
  rationale: യാത്രചെയ്യുക എന്ന ക്രിയയും കൂടെ പോകുക എന്ന ആശയവും ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: μηδὲν διακρινόμενος
  choice: ഒട്ടും സംശയിക്കാതെ
  rationale: ഈ സന്ദർഭത്തിൽ പത്രോസ് മടിക്കുകയോ സംശയിക്കുകയോ ചെയ്യരുതെന്ന ഉടനെയുള്ള അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ‘വേർതിരിവ് കാണിക്കാതെ’ എന്ന സാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുമ്പുള്ള കല്പന അനുസരിക്കേണ്ടതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐγὼ
  choice: ഞാനാണ്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ കർത്തൃസർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘ആണ്’ ഘടനയിലൂടെ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπέσταλκα αὐτούς
  choice: അവരെ അയച്ചത്
  rationale: അയയ്ക്കൽ പൂർത്തിയായതും അതിന്റെ ഫലം ഇപ്പോഴും പ്രസക്തമാണെന്നതും സന്ദർഭത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: μηδὲν διακρινόμενος എന്ന പ്രയോഗവും വിജാതീയരെ ഉൾക്കൊള്ളുന്ന പ്രമേയവും
  choice: മുഖ്യപാഠത്തിൽ ‘ഒട്ടും സംശയിക്കാതെ’ എന്നു നൽകി പത്രോസ് മടിക്കാതെ കൂടെ പോകണമെന്ന അടുത്ത സന്ദർഭത്തിലെ അർഥം മുൻനിർത്തി.
  alternative: ‘യാതൊരു വേർതിരിവും കാണിക്കാതെ’ എന്ന വായനയും സാധ്യമാണ്.
  rationale: διακρίνω എന്ന ക്രിയയ്ക്ക് സംശയിക്കുക/മടിക്കുക എന്നും വേർതിരിക്കുക എന്നും അർഥമാകാം. ദർശനത്തെക്കുറിച്ചുള്ള പത്രോസിന്റെ ആശയക്കുഴപ്പം ആദ്യത്തെ അർഥത്തെ പിന്തുണയ്ക്കുമ്പോൾ, യെഹൂദനും വിജാതീയനും തമ്മിൽ വേർതിരിവ് കാണിക്കാതിരിക്കുന്നതെന്ന അപ്പൊസ്തലപ്രവൃത്തികൾ 10-ലെ വിശാല പ്രമേയം രണ്ടാമത്തെ അർഥത്തെ പ്രസക്തമാക്കുന്നു. അതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാരൂപങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ തുടർച്ചയായ പ്രവർത്തനക്രമം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി അർധവിരാമവും പൂർണവിരാമവും പ്രയോഗിച്ചു; ἐγὼ എന്ന ഊന്നൽ ‘ഞാനാണ്’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
