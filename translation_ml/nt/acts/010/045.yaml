  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: ml
  text: പത്രോസിനോടൊപ്പം വന്ന, പരിച്ഛേദനം സ്വീകരിച്ച വിശ്വാസികളെല്ലാം[a], പരിശുദ്ധാത്മാവിന്റെ ദാനം യെഹൂദേതരരുടെ മേൽപോലും[b] പകർന്നിരിക്കുന്നതുകണ്ട്[c] വിസ്മയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘പരിച്ഛേദനത്തിൽനിന്നുള്ള വിശ്വാസികൾ’; അഥവാ, യഹൂദവിശ്വാസികൾ.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘യെഹൂദേതരരുടെ മേലും.’ ഗ്രീക്കിൽ കൂട്ടിച്ചേർക്കൽ സൂചിപ്പിക്കാം; ഇവിടെ ആശ്ചര്യത്തിന്റെ ഭാവം ഉള്ളതിനാൽ ‘മേൽപോലും’ എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘പകർന്നുകഴിഞ്ഞിരുന്നു.’ ഗ്രീക്ക് പൂർണ്ണകാലം പൂർത്തിയായ പ്രവൃത്തിയോടൊപ്പം അതിന്റെ തുടരുന്ന ഫലവും ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: വിസ്മയിച്ചു
  rationale: ഇവിടെ ക്രിയ ശക്തമായ ആശ്ചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘വിസ്മയിച്ചു’ എന്നത് അതിന്റെ തീവ്രത സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: പരിച്ഛേദനക്കാരായ വിശ്വാസികൾ
  rationale: യഹൂദവിശ്വാസികളെ പരിച്ഛേദനംകൊണ്ട് തിരിച്ചറിയുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംഘപരമായ അർഥം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: പത്രോസിനോടൊപ്പം വന്ന ... എല്ലാവരും
  rationale: പത്രോസിനെ അനുഗമിച്ച വിശ്വാസികളെയാണ് ഉപവാക്യം പരിമിതപ്പെടുത്തുന്നത്; ‘ഒപ്പം വന്ന’ എന്നത് συνέρχομαι ക്രിയയും ദത്തിവും നൽകുന്ന സഹഗമനത്തിന്റെ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: യെഹൂദേതരരുടെമേൽപോലും
  rationale: ഈ സന്ദർഭത്തിൽ ἔθνη യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു. ‘പോലും’ എന്നത് καί നൽകുന്ന കൂട്ടിച്ചേർക്കലിനോടൊപ്പം സംഭവത്തിലെ അപ്രതീക്ഷിതത്വവും പ്രകടമാക്കുന്നു.
- source_word: ἡ δωρεὰ
  choice: ദാനം
  rationale: δωρεά സൗജന്യമായി നൽകപ്പെടുന്ന സമ്മാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദാനം’ സംക്ഷിപ്തവും പ്രസക്തവുമാണ്.
- source_word: τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവിന്റെ
  rationale: ജനിതകബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന, സമകാലിക ക്രൈസ്തവ മലയാളത്തിൽ വ്യാപകവും സഭാഭേദാതീതവുമായ പ്രയോഗം.
- source_word: ἐκκέχυται
  choice: പകർന്നിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ തുടരുന്ന ഫലത്തെയും ഒരുമിച്ചു മുന്നോട്ടുവയ്ക്കുന്നു; ‘പകർന്നിരിക്കുന്നു’ ഈ ദ്വിത്വം മലയാളത്തിൽ നന്നായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: രക്ഷാചരിത്രപരമായ സന്ദർഭത്തിൽ ἔθνη എന്നതിന്റെ വിവർത്തനം
  choice: യെഹൂദേതരർ
  alternative: ജനതകൾ
  rationale: പ്രവൃത്തികൾ 10-ൽ യഹൂദവിശ്വാസികളും യഹൂദരല്ലാത്തവരും തമ്മിലുള്ള വ്യത്യാസമാണ് പ്രസക്തം. ‘യെഹൂദേതരർ’ ഉദ്ദേശിക്കുന്ന ജനവിഭാഗത്തെ ‘ജനതകൾ’ എന്നതിലധികം കൃത്യമായി വ്യക്തമാക്കുന്നു.
- issue: ἐκκέχυται എന്ന പൂർണ്ണകാലരൂപത്തിന്റെ കാല-ഭാവം
  choice: പകർന്നിരിക്കുന്നു
  alternative: പകർന്നുകഴിഞ്ഞിരുന്നു
  rationale: തിരഞ്ഞെടുത്ത രൂപം ആത്മാവിന്റെ ദാനം പകർന്ന സംഭവം പൂർത്തിയായെന്നും അതിന്റെ ഫലം അപ്പോൾ നിലനിന്നിരുന്നെന്നും സൂചിപ്പിക്കുന്നു; വെറും ഭൂതകാലമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പരിച്ഛേദനം,’ ‘പരിശുദ്ധാത്മാവ്’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ദീർഘവും കൃത്രിമവുമായ ഗ്രീക്ക് ഘടനകൾ മലയാള വാക്യക്രമത്തിന് അനുയോജ്യമായി ക്രമപ്പെടുത്തി.
