  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/027.yaml
  text: And talking with him[a], he entered and found many gathered together.
translation:
  language: ml
  text: അവനോടു സംസാരിച്ചുകൊണ്ട് അദ്ദേഹം അകത്തു കടന്നു; ഒരുമിച്ചുകൂടിയ അനേകരെ കണ്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ഇവിടെ ‘കാണുന്നു’ എന്ന ചരിത്രവർത്തമാനകാലമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. അതിനാൽ, ‘അവനോടു സംസാരിച്ചുകൊണ്ട് അദ്ദേഹം അകത്തു കടന്നു; ഒരുമിച്ചുകൂടിയ അനേകരെ കാണുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: സംസാരിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃതന്തം εἰσῆλθεν എന്ന ക്രിയയോടൊപ്പം നടക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചുകൊണ്ട്’ എന്നത് സംഭാഷണത്തിന്റെ തുടർച്ച സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: συνομιλέω എന്ന ക്രിയയോടുള്ള ചതുർത്ഥീവിഭക്തി സംഭാഷണം നടത്തുന്ന മറ്റേയാളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘അവനോട്’ സ്വാഭാവികമാണ്.
- source_word: εἰσῆλθεν
  choice: അകത്തു കടന്ന
  rationale: ഗ്രീക്കിൽ ഇത് അടുത്ത സംഭവത്തെ കുറിക്കുന്ന ഭൂതകാല മുഖ്യക്രിയയാണ്. മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി കൃതന്തരൂപത്തിൽ നൽകിയെങ്കിലും അകത്തേക്കുള്ള പ്രവേശനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εὑρίσκει
  choice: കണ്ടു
  rationale: ഗ്രീക്കിലെ ചരിത്രവർത്തമാനകാലത്തെ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാല ആഖ്യാനരീതിയിൽ നൽകിയിരിക്കുന്നു; മൂലത്തിലെ സജീവമായ ‘കാണുന്നു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: συνεληλυθότας
  choice: ഒരുമിച്ചുകൂടിയിരിക്കുന്നതു
  rationale: സമ്പൂർണകാല കൃതന്തം ആളുകൾ മുമ്പേ വന്നുകൂടി അപ്പോൾ ഒരുമിച്ചിരിക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ഈ പൂർത്തിയായ പ്രവൃത്തിയും അതിന്റെ നിലവിലുള്ള ഫലവും വിവർത്തനം നിലനിർത്തുന്നു.
- source_word: πολλούς
  choice: അനേകർ
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണം അനേകം ആളുകളെ സൂചിപ്പിക്കുന്നു; ‘അനേകർ’ മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ആഖ്യാനശൈലി. മൂലത്തിൽ കർത്താവിന്റെ പേര് ആവർത്തിക്കാത്തതിനാൽ ‘പത്രോസ്’ ചേർക്കാതെ, മലയാളത്തിൽ ആവശ്യമായ വ്യക്തതയ്ക്കായി ‘അദ്ദേഹം’ ഉപയോഗിച്ചു.
