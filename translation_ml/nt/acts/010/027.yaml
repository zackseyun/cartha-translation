  to: അവനോടു സംസാരിച്ചുകൊണ്ട് അദ്ദേഹം അകത്തു കടന്നു; ഒരുമിച്ചുകൂടിയ അനേകരെ കണ്ടു.[a]
  rationale: The revised rendering preserves the Greek participle’s contemporaneous force while restoring ‘he entered’ as a finite narrative verb. It also renders the assembled people directly as the object of ‘found/saw.’ The footnote accurately identifies the historical present only in ‘finds/sees’ and retains a viable Malayalam alternative.
