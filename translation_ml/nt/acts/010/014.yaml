revisions:
- from: 'എന്നാൽ പത്രോസ് പറഞ്ഞു: “ഒരിക്കലുമില്ല, കർത്താവേ! കാരണം പൊതുവായതും അശുദ്ധവുമായ യാതൊന്നും ഞാൻ ഒരിക്കലും ഭക്ഷിച്ചിട്ടില്ല.”'
  to: 'എന്നാൽ പത്രോസ് പറഞ്ഞു: “ഒരിക്കലുമില്ല, കർത്താവേ! കാരണം മലിനവും അശുദ്ധവുമായ യാതൊന്നും ഞാൻ ഒരിക്കലും ഭക്ഷിച്ചിട്ടില്ല.”'
  rationale: The revision changes only the rendering of κοινόν, from the unnatural ‘പൊതുവായത്’ to the contextually appropriate and established ‘മലിനം.’ The emphatic negation, causal relation, two coordinated purity descriptors, and repeated ‘never’ are retained.
