id: ACT.10.14
reference: Acts 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് പറഞ്ഞു: “ഒരിക്കലുമില്ല, കർത്താവേ! കാരണം മലിനവും അശുദ്ധവുമായ യാതൊന്നും ഞാൻ ഒരിക്കലും ഭക്ഷിച്ചിട്ടില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: ഒരിക്കലുമില്ല
  rationale: ശക്തമായ നിരാകരണം സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: നേരിട്ടുള്ള സംബോധന നിലനിർത്തുന്ന സാധാരണ പുതിയനിയമ പ്രയോഗം.
- source_word: κοινὸν
  choice: പൊതുവായത്
  rationale: ആചാരപരമായി വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കപ്പെടാത്തത് എന്ന ആശയം നിലനിർത്തുന്നു; ഇത് ἀκάθαρτον എന്നതുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: ἀκάθαρτον
  choice: അശുദ്ധമായത്
  rationale: ആചാരപരമായ അശുദ്ധി സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾപദം.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: SBLGNTയിലെ സംയോജകമായ ‘και’ അനുസരിച്ച് ‘പൊതുവായതും അശുദ്ധവുമായ’ എന്നു നൽകുന്നു; ‘അല്ലെങ്കിൽ’ എന്നു മാറ്റുന്നില്ല.
theological_decisions:
- issue: κοινὸν καὶ ἀκάθαρτον എന്ന പദബന്ധത്തിന്റെ ബന്ധം
  choice: പൊതുവായതും അശുദ്ധവുമായ
  alternative: പൊതുവായതോ അശുദ്ധമായതോ
  rationale: അടിസ്ഥാനപാഠത്തിലെ καὶ എന്ന സംയോജകം ഔപചാരികമായി നിലനിർത്തുകയും, രണ്ട് വിശേഷണങ്ങളും ഒരേ വസ്തുവിനെ വിശേഷിപ്പിക്കുന്ന സാധ്യത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: κύριε എന്ന സംബോധനയുടെ അർത്ഥപരിധി
  choice: കർത്താവേ
  alternative: പ്രഭോ
  rationale: ദർശനത്തിൽ സംസാരിക്കുന്നവന്റെ കൃത്യമായ തിരിച്ചറിയലിനെ അധികമായി വ്യാഖ്യാനിക്കാതെ ഉറവിടത്തിലെ ആദരസംബോധന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ‘കാരണം’ ഉപയോഗിച്ച് ὅτιയുടെ കാരണാർഥം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
