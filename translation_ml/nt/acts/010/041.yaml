  terminology: ‘സാക്ഷികൾ,’ ‘ദൈവം മുൻകൂട്ടി തിരഞ്ഞെടുത്ത,’ and ‘ഉയിർത്തെഴുന്നേറ്റശേഷം’ are suitable, accurate, and appropriately neutral. The lexical-alternative and resurrection footnotes remain correctly anchored and preserve the possible passive rendering without presenting it as the required sense.
  issues:
