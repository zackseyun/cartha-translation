id: ACT.10.41
reference: Acts 10:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: ml
  text: എല്ലാ ജനങ്ങൾക്കും അല്ല, മറിച്ച് ദൈവം മുൻകൂട്ടി തിരഞ്ഞെടുത്ത[a] സാക്ഷികൾക്ക്—അതായത്, മരിച്ചവരിൽനിന്ന് അവൻ ഉയിർത്തെഴുന്നേറ്റശേഷം[b] അവനോടൊപ്പം ഭക്ഷണം കഴിക്കുകയും പാനം ചെയ്യുകയും ചെയ്ത ഞങ്ങൾക്കാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവം മുൻകൂട്ടി നിയമിച്ച.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “മരിച്ചവരിൽനിന്ന് അവൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം.” ഇവിടെ ഗ്രീക്ക് സ്വാഭാവികമായി “അവൻ ഉയിർത്തെഴുന്നേറ്റശേഷം” എന്നു പരിഭാഷപ്പെടുത്താം; പുതിയനിയമത്തിലെ മറ്റിടങ്ങളിൽ നിഷ്ക്രിയപ്രയോഗവും കാണപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: ജനമെല്ലാവർക്കും അല്ല
  rationale: παντί ... λαῷ സൂചിപ്പിക്കുന്ന വ്യാപ്തിയും തുടർന്ന് വരുന്ന പരിമിത സാക്ഷിസംഘവുമായുള്ള വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μάρτυσι
  choice: സാക്ഷികൾക്ക്
  rationale: അവർ കണ്ട കാര്യങ്ങളെക്കുറിച്ച് സാക്ഷ്യം വഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന പ്രവൃത്തികളിലെ പതിവ് അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: ദൈവം മുൻകൂട്ടി തിരഞ്ഞെടുത്ത
  rationale: പൂർണ നിഷ്ക്രിയ കൃദന്തം സൂചിപ്പിക്കുന്ന മുൻകാല ദൈവിക തിരഞ്ഞെടുപ്പും അതിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; ‘മുൻകൂട്ടി നിയമിച്ച’ എന്നതും സാധ്യമാണ്.
- source_word: ἡμῖν
  choice: അതായത് ... ഞങ്ങൾക്കാണ്
  rationale: ‘സാക്ഷികൾക്ക്’ എന്നതിനോടുള്ള സമാനാധികരണ വിശദീകരണം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: അവനോടൊപ്പം ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്ത
  rationale: συν- ഘടകങ്ങൾ ഊന്നുന്ന പങ്കിട്ട മേശസഹവാസവും ഉയിർപ്പിനുശേഷമുള്ള അനുഭവത്തിന്റെ മൂർത്തസ്വഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന് അവൻ ഉയിർത്തെഴുന്നേറ്റശേഷം
  rationale: μετάയോടുകൂടിയ കൃത്യാന്തഘടനയുടെ കാലസൂചനയായ ‘ശേഷം’ എന്ന അർഥവും ἀναστῆναιയുടെ അകർമകമായ ‘ഉയിർത്തെഴുന്നേൽക്കുക’ എന്ന സ്വാഭാവിക അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀναστῆναι αὐτὸν ἐκ νεκρῶν എന്നതിലെ ഉയിർപ്പ്-പ്രയോഗം
  choice: മരിച്ചവരിൽനിന്ന് അവൻ ഉയിർത്തെഴുന്നേറ്റശേഷം
  alternative: മരിച്ചവരിൽനിന്ന് അവൻ ഉയിർപ്പിക്കപ്പെട്ടശേഷം
  rationale: ഈ ഗ്രീക്ക് രൂപം സ്വാഭാവികമായി ‘അവൻ ഉയിർത്തെഴുന്നേറ്റു’ എന്നു പരിഭാഷപ്പെടുത്താം. പുതിയനിയമത്തിലെ മറ്റിടങ്ങളിൽ കാണുന്ന ദൈവിക കർത്തൃത്വത്തെ ഇത് നിഷേധിക്കുന്നില്ല; ഈ വാക്യത്തിന്റെ രൂപം അനാവശ്യമായി മാറ്റാതെ പിന്തുടരുകയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മൂലവാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ അതിന്റെ ഖണ്ഡവാക്യസ്വഭാവം നിലനിർത്തി. ദീർഘരേഖയും ‘അതായത്’ എന്ന പ്രയോഗവും ἡμῖν എന്ന സമാനാധികരണ വിശദീകരണം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
