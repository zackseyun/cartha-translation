    rationale: ‘എല്ലാ ജനങ്ങൾക്കും’ reads more naturally than ‘ജനമെല്ലാവർക്കും,’ and ‘ഭക്ഷണം കഴിക്കുകയും പാനം ചെയ്യുകയും’ is the usual clear formal expression for eating and drinking with someone.
