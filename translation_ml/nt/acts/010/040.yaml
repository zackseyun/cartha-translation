id: ACT.10.40
reference: Acts 10:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἤγειρεν ⸀τῇ τρίτῃ ἡμέρᾳ καὶ ἔδωκεν αὐτὸν ἐμφανῆ γενέσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: ml
  text: ഇവനെ[a] ദൈവം മൂന്നാം ദിവസം ഉയിർപ്പിച്ചു; അവനെ പ്രത്യക്ഷനാകാൻ ഇട നൽകി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനെ’ അല്ലെങ്കിൽ ‘ഈ മനുഷ്യനെ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ ചൂണ്ടുപദത്തിന് ഇവിടെ ഊന്നലുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘അവനെ ദൃശ്യനാകാൻ നൽകി.’ ‘അവനെ പ്രത്യക്ഷനാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: ഇവനെ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്ന, വാക്യാരംഭത്തിൽ ഊന്നൽ ലഭിച്ച ഗ്രീക്ക് സർവനാമത്തിന്റെ ബലം സംരക്ഷിക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: നാമനിർദേശകർത്താവിനെ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് രേഖപ്പെടുത്തുന്നു.
- source_word: ἤγειρεν
  choice: ഉയിർപ്പിച്ചു
  rationale: മരണത്തിൽനിന്നുള്ള പുനരുത്ഥാനസന്ദർഭത്തിൽ ἐγείρω എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചകമായ ദത്തിവിനെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔδωκεν
  choice: ഇട നൽകുകയും ചെയ്തു
  rationale: ‘നൽകി’ എന്ന അടിസ്ഥാനഭാവം നിലനിർത്തിക്കൊണ്ട്, പൂരകക്രിയയോടുള്ള ഗ്രീക്ക് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വെറും അനുമതിയോ നിർബന്ധിത കാരണമോ എന്ന് അതിയായി നിശ്ചയിക്കുന്നില്ല.
- source_word: αὐτὸν
  choice: അവൻ
  rationale: മലയാളത്തിലെ ‘പ്രത്യക്ഷനാകുക’ എന്ന അകർമകഘടനയ്ക്ക് അനുസരിച്ച് ഗ്രീക്കിലെ കർമരൂപത്തെ ഉപവാക്യത്തിന്റെ കർത്താവായി സ്വാഭാവികമായി മാറ്റുന്നു; സൂചിപ്പിക്കുന്നത് യേശുവിനെയാണ്.
- source_word: ἐμφανῆ
  choice: പ്രത്യക്ഷനാകാൻ
  rationale: ഉയിർത്തെഴുന്നേറ്റ യേശു കാണപ്പെടുകയോ വെളിപ്പെടുകയോ ചെയ്തതെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γενέσθαι
  choice: -നാകാൻ
  rationale: γίνομαι എന്നതിലെ ‘ആയിത്തീരുക/ആകുക’ എന്ന ചലനാത്മക ഭാവം പ്രത്യയത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിലെ ദൈവിക പ്രവർത്തനം
  choice: ദൈവം മൂന്നാം ദിവസം ഉയിർപ്പിച്ചു
  alternative: മൂന്നാം ദിവസം ഉയിർത്തെഴുന്നേൽപ്പിച്ചു
  rationale: യേശുവിനെ ഉയിർപ്പിച്ചത് ദൈവമാണെന്ന ഗ്രീക്കിലെ വ്യക്തമായ പ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു; അധികമായ ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: പുനരുത്ഥാനശേഷമുള്ള പ്രത്യക്ഷത
  choice: അവൻ പ്രത്യക്ഷനാകാൻ ഇട നൽകുകയും ചെയ്തു
  alternative: അവനെ പ്രത്യക്ഷനാക്കി
  rationale: പുനരുത്ഥാനവും തുടർന്ന് ദൃശ്യമായി വെളിപ്പെടുന്നതും തമ്മിലുള്ള വാക്യത്തിലെ വ്യത്യാസം സംരക്ഷിക്കുന്നു. ‘ഇട നൽകി’ എന്നത് ἔδωκεν എന്നതിന്റെ നൽകൽഭാവം നിലനിർത്തുകയും, ‘പ്രത്യക്ഷനാക്കി’ എന്ന ശക്തമായ കാരകവായനയെ മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇവനെ’ എന്ന വാക്യാരംഭം മൂലപാഠത്തിലെ ചൂണ്ടിപ്പറയുന്ന ഊന്നൽ സൂക്ഷിക്കുന്നു; ‘പ്രത്യക്ഷനാകാൻ ഇട നൽകി’ എന്ന പ്രയോഗം ഗ്രീക്ക് ഘടനയുടെ അപൂർവത പൂർണമായി മായ്ക്കാതെ മലയാളത്തിൽ വായിക്കാവുന്ന രൂപം നൽകുന്നു.
