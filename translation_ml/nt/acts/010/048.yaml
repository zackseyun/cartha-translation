id: ACT.10.48
reference: Acts 10:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: ml
  text: തുടർന്ന്, മശീഹയായ യേശുവിന്റെ നാമത്തിൽ സ്നാനം സ്വീകരിക്കാൻ അവരോട് അവൻ കല്പിച്ചു.[a] പിന്നെ, ഏതാനും ദിവസങ്ങൾ താമസിക്കണമെന്ന് അവർ അവനോട് അപേക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പരമ്പരാഗതമായി, “യേശുക്രിസ്തുവിന്റെ നാമത്തിൽ.”
    reason: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത ലിപ്യന്തരണാധിഷ്ഠിത രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: προσέταξεν
  choice: കല്പിച്ചു
  rationale: പ്രാമാണികമായ നിർദേശം നൽകുക എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്ന, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
- source_word: δὲ
  choice: തുടർന്ന്
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν τῷ ὀνόματι
  choice: നാമത്തിൽ
  rationale: അധികാരം, ബന്ധം, ആഹ്വാനം എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മശീഹയായ യേശു’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: βαπτισθῆναι
  choice: സ്നാനം സ്വീകരിക്കാൻ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയ infinitive-ന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സ്നാനത്തിന്റെ രീതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: τότε
  choice: പിന്നെ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം ലളിതവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἠρώτησαν
  choice: അപേക്ഷിച്ചു
  rationale: ഇവിടെ സാധാരണ ചോദ്യം ചോദിക്കുന്നതല്ല, താമസിക്കണമെന്ന അഭ്യർഥനയാണ്; അതിനാൽ സന്ദർഭോചിതമായ മലയാളം.
- source_word: ἐπιμεῖναι
  choice: താമസിക്കാൻ
  rationale: കുറച്ചുകാലം അവിടെ തുടരുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡμέρας τινάς
  choice: ഏതാനും ദിവസം
  rationale: കാലദൈർഘ്യം കൃത്യമായി നിർണയിക്കാത്ത ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്നാനസൂത്രത്തിലെ Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός യേശുവിന്റെ സ്ഥാനപ്പേരായും വിശ്വാസപ്രഖ്യാപനപരമായും പ്രവർത്തിക്കുന്നു. അതിനാൽ അർഥപരിഭാഷയായ ‘മശീഹ’ മുഖ്യവാചകത്തിൽ നൽകി, പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. വാക്യക്രമം സ്വാഭാവികമാക്കിയിട്ടും ഗ്രീക്കിലെ പ്രാമാണിക കല്പന, നാമപ്രയോഗത്തിന്റെ വിശാലത, ദിവസങ്ങളുടെ അനിശ്ചിതത്വം എന്നിവ സംരക്ഷിച്ചു.
