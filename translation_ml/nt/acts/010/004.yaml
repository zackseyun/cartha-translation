id: ACT.10.4
reference: Acts 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: ml
  text: 'അവൻ ദൂതനെ ഉറ്റുനോക്കി ഭയപ്പെട്ട്, “കർത്താവേ, എന്താണ്?” എന്നു ചോദിച്ചു. ദൂതൻ അവനോട് പറഞ്ഞു: “നിന്റെ പ്രാർഥനകളും കാരുണ്യദാനങ്ങളും[a] ദൈവസന്നിധിയിൽ ഒരു സ്മരണയായി ഉയർന്നെത്തിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദരിദ്രർക്കുള്ള ദാനങ്ങൾ.” ഗ്രീക്ക് പദം പ്രത്യേകിച്ച് ആവശ്യത്തിലിരിക്കുന്നവർക്കു നൽകുന്ന കാരുണ്യസഹായത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: ഉറ്റുനോക്കി
  rationale: സ്ഥിരമായും ശ്രദ്ധയോടെയും നോക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔμφοβος γενόμενος
  choice: ഭയപ്പെട്ട്
  rationale: ഭയത്തിന്റെ അവസ്ഥയിലേക്കു പ്രവേശിച്ചതെന്ന ആശയം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘ഭീതിവിഹ്വലനായി’ എന്നതുപോലെ വികാരത്തിന്റെ തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കുന്നില്ല.
- source_word: Τί ἐστιν
  choice: എന്താണ്?
  rationale: എന്താണ് കാര്യം എന്നു ദൂതനോടു ചോദിക്കുന്ന നേരിട്ടുള്ള, സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: സ്വർഗീയദൂതനോടുള്ള ആദരപൂർവമായ സംബോധന സംരക്ഷിക്കുന്നു. ഇവിടെ ഇത് യേശുവിനെക്കുറിച്ചുള്ള പൂർണമായ വിശ്വാസപ്രഖ്യാപനമാണെന്ന് നിർബന്ധമായി അർഥമാക്കുന്നില്ല.
- source_word: προσευχαί
  choice: പ്രാർഥനകൾ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളപരിഭാഷ.
- source_word: ἐλεημοσύναι
  choice: കാരുണ്യദാനങ്ങൾ
  rationale: ആവശ്യത്തിലിരിക്കുന്നവർക്കു കരുണയോടെ നൽകുന്ന ദാനങ്ങളെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ‘കരുണ’യും ‘ദാനം’ എന്ന പ്രത്യേക ആശയവും ഒരുമിച്ചു നിലനിർത്തുന്നു.
- source_word: ἀνέβησαν
  choice: ഉയർന്നെത്തിയിരിക്കുന്നു
  rationale: പ്രാർഥനയും ദാനവും ദൈവസന്നിധിയിലേക്ക് ഉയരുന്നതായുള്ള രൂപകം നിലനിർത്തുകയും പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς μνημόσυνον
  choice: ഒരു സ്മരണയായി
  rationale: യാഗാർപ്പണഭാഷയെ ഓർമിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ രൂപകാത്മകത നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക ആരാധനാക്രമം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ അഥവാ സാന്നിധ്യത്തിൽ എന്ന ആശയം നിലവാരമുള്ള മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: സ്വർഗീയദൂതനോടുള്ള കൊർന്നേല്യൊസിന്റെ സംബോധനയിൽ κύριε എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: കർത്താവേ
  alternative: യജമാനനേ; പ്രഭോ
  rationale: ആദരവും സന്ദർഭത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്ന പതിവ് പരിഭാഷയാണ് ‘കർത്താവേ.’ എന്നാൽ ഈ സംബോധനമാത്രം യേശുവിനെക്കുറിച്ചുള്ള ക്രിസ്തുശാസ്ത്രപരമായ പ്രഖ്യാപനമായി വ്യാഖ്യാനിക്കേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ആവർത്തിച്ചുള്ള ‘അവൻ’ മൂലം ആശയക്കുഴപ്പം ഉണ്ടാകാതിരിക്കാൻ രണ്ടാം വാക്യത്തിൽ സ്വർഗീയപാത്രത്തെ ‘ദൂതൻ’ എന്നു വ്യക്തമാക്കി; മുൻസന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെട്ട വ്യക്തിയെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. ‘കാരുണ്യദാനങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് അർഥഗ്രാഹ്യമാകുകയും ഗ്രീക്ക് പദത്തിലെ കരുണയും ദാനവും സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
