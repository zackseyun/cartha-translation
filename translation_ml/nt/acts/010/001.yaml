id: ACT.10.1
reference: Acts 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ ⸀τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/001.yaml
  text: There was a man in Caesarea named Cornelius[a], a centurion from the cohort called the Italian Cohort[b],
translation:
  language: ml
  text: കൈസര്യയിൽ കൊർന്നേല്യൊസ് എന്നു പേരുള്ള ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു[a]. അദ്ദേഹം “ഇറ്റാലിയൻ ദളം” എന്നു വിളിക്കപ്പെട്ട സൈനികദളത്തിലെ ഒരു ശതാധിപനായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈസര്യയിൽ ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഒരു പുതിയ കഥാപാത്രത്തെ പരിചയപ്പെടുത്താൻ ഗ്രീക്കിൽ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘സൈനികദളം’ എന്നത് റോമൻ സൈന്യത്തിലെ ഒരു ഘടകമായിരുന്നു. ‘ഇറ്റാലിയൻ ദളം’ എന്ന പേര് ഇറ്റലിയുമായി ബന്ധമുള്ളതോ ഇറ്റാലിയൻ സൈനികർ ഉൾപ്പെട്ടതോ ആയ ഒരു ദളത്തെ സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു
  rationale: ἀνήρ പ്രായപൂർത്തിയായ പുരുഷനെ സൂചിപ്പിക്കുന്നു; τις ഒരു പുതിയ കഥാപാത്രത്തെ അനിശ്ചിതമായി പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ ഉണ്ടായിരുന്നു’ എന്നത് ഈ പരിചയപ്പെടുത്തൽ സ്വാഭാവികമായി നൽകുന്നു. δέ ഇവിടെയുള്ള മൃദുവായ ആഖ്യാനമാറ്റമായതിനാൽ പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: ἐν Καισαρείᾳ
  choice: കൈസര്യയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണത്തോടുകൂടിയ നേരിട്ടുള്ള സ്ഥലസൂചന.
- source_word: ὀνόματι Κορνήλιος
  choice: കൊർന്നേല്യോസ് എന്നു പേരുള്ള
  rationale: ὀνόματι എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ ഈ ഉദ്യോഗപദവിക്കുള്ള കൃത്യവും മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവുമായ ചരിത്രപദം.
- source_word: ἐκ σπείρης
  choice: ദളത്തിലെ
  rationale: ἐκ ഇവിടെ അംഗത്വബന്ധം സൂചിപ്പിക്കുന്നു; σπεῖρα എന്ന റോമൻ സൈനികഘടകത്തെ വായനാസൗകര്യത്തോടെ ‘ദളം’ എന്നു നൽകി.
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: “ഇറ്റാലിയൻ സൈനികദളം” എന്നു വിളിക്കപ്പെട്ട
  rationale: καλουμένης എന്നതിന്റെ അർഥം നേരിട്ട് നിലനിർത്തുന്നു. Ἰταλικῆς എന്ന വിശേഷണം ഏതു ഘടകത്തെ വിശേഷിപ്പിക്കുന്നു എന്ന് മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘സൈനികദളം’ ചേർത്തു.
