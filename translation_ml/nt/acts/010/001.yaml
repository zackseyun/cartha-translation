    issue: Redundant designation of the cohort
    rationale: The phrase “ഇറ്റാലിയൻ സൈനികദളം എന്നു വിളിക്കപ്പെട്ട ദളത്തിലെ” repeats “dalam” in the designation and again as the head noun. The Greek calls the unit “Italian”; it does not call it “Italian Cohort” as a separate phrase before again identifying it as a cohort.
  - severity: low
