translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ശതാധിപൻ’ എന്ന പരിചിതമായ ചരിത്രപദം നിലനിർത്തുകയും ‘സൈനികദളം’ എന്നത് സന്ദർഭം വ്യക്തമാക്കാൻ ഉപയോഗിക്കുകയും ചെയ്തു. ഗ്രീക്കിലെ മൃദുവായ δέ സ്വാഭാവിക മലയാള ആഖ്യാനത്തിൽ പ്രത്യേകം പദമാക്കാതെ വിട്ടു.
