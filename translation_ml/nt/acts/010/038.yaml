id: ACT.10.38
reference: Acts 10:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: ml
  text: 'നസറത്തിൽനിന്നുള്ള യേശുവിനെക്കുറിച്ച്: ദൈവം അവനെ പരിശുദ്ധാത്മാവിനാലും ശക്തിയാലും അഭിഷേകം ചെയ്തു. ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ, അവൻ നന്മ ചെയ്തുകൊണ്ടും പിശാചിനാൽ അടിച്ചമർത്തപ്പെട്ടിരുന്ന എല്ലാവരെയും സൗഖ്യമാക്കിക്കൊണ്ടും ചുറ്റിസഞ്ചരിച്ചു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: നസറത്തിൽനിന്നുള്ള യേശുവിനെക്കുറിച്ച്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന ഉത്ഭവസ്ഥലം ‘നസറത്തിൽനിന്നുള്ള’ എന്നു നേരിട്ട് നൽകുന്നു. മുൻവാക്യത്തിലെ ‘നിങ്ങൾ അറിയുന്നു’ എന്ന ആശയവുമായി ബന്ധപ്പെടുന്ന ദ്വിതീയാവിഭക്തി മലയാളത്തിൽ ഒറ്റവാക്യമായി സ്വാഭാവികമാക്കാൻ ‘യേശുവിനെക്കുറിച്ച്’ എന്നു നൽകി.
- source_word: ὡς
  choice: ':'
  rationale: യേശുവിനെക്കുറിച്ചുള്ള തുടർവിവരണം അവതരിപ്പിക്കുന്ന ὡς എന്നതിന്റെ പ്രവർത്തനം മലയാളത്തിൽ ദ്വിബിന്ദുവിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; താരതമ്യാർത്ഥം ചേർക്കുന്നില്ല.
- source_word: ἔχρισεν
  choice: അഭിഷേകം ചെയ്തു
  rationale: χρίωയുടെ അടിസ്ഥാന അർത്ഥവും മിശിഹാസംബന്ധിയായ അനുരണനവും നിലനിർത്തുന്നു; ‘നിയമിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: പരിശുദ്ധാത്മാവിനാലും ശക്തിയാലും
  rationale: ദ്വിതീയ ദത്തിവിന്റെ കരണാർത്ഥം മലയാളത്തിലെ ‘-ആൽ’ രൂപത്തിൽ നൽകുന്നു. പരിശുദ്ധാത്മാവിനെയും ശക്തിയെയും വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്നു.
- source_word: διῆλθεν
  choice: ചുറ്റിസഞ്ചരിച്ചു
  rationale: സ്ഥലങ്ങളിൽ സഞ്ചരിച്ചുകൊണ്ടുള്ള യേശുവിന്റെ ശുശ്രൂഷയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടമാക്കുന്നു.
- source_word: εὐεργετῶν
  choice: നന്മ ചെയ്തുകൊണ്ടും
  rationale: മറ്റുള്ളവർക്കു ഗുണം ചെയ്യുന്ന പ്രവൃത്തിയെ വിശാലമായ അർത്ഥത്തിൽ നിലനിർത്തുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἰώμενος
  choice: സൗഖ്യമാക്കിക്കൊണ്ടും
  rationale: ശാരീരികവും മറ്റ് ബാധകളിൽനിന്നുള്ളതുമായ രോഗശാന്തിയെ സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: പിശാചിനാൽ അടിച്ചമർത്തപ്പെട്ടിരുന്ന എല്ലാവരെയും
  rationale: καταδυναστεύωയിലെ ക്രൂരമായ അധീനതയുടെയും പീഡനത്തിന്റെയും ഭാവം ‘അടിച്ചമർത്തപ്പെട്ടിരുന്ന’ എന്നു നൽകുന്നു; διάβολος വ്യക്തിയായ ദുഷ്ടനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പിശാച്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ
  rationale: ὅτιയുടെ കാരണസൂചകശക്തി വ്യക്തമായി നിലനിർത്തുകയും ദൈവത്തിന്റെ സാന്നിധ്യത്തെ പാഠം പറയുന്ന പരിധിയിൽ മാത്രം അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവിന്റെ അഭിഷേകവും ദൗത്യവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അഭിഷേകം ചെയ്തു’ എന്ന ബൈബിൾപ്രയോഗം അതേപടി നിലനിർത്തി.
  alternative: ‘മിശിഹയായി നിയമിച്ചു’ അല്ലെങ്കിൽ ‘ശക്തിപ്പെടുത്തി’ എന്നു വിശദീകരിക്കുക.
  rationale: മൂലപാഠം χρίω എന്നു പറയുന്നതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനം സംരക്ഷിക്കുന്നു; എന്നാൽ വാക്യത്തിൽ നേരിട്ട് ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: πνεύματι ἁγίῳ എന്നതിന്റെ വ്യക്തിപരമായ പരാമർശം
  choice: ‘പരിശുദ്ധാത്മാവിനാൽ’ എന്നു നൽകി.
  alternative: വ്യക്തിത്വമില്ലാത്ത ‘വിശുദ്ധമായ ആത്മശക്തിയാൽ’ എന്നു നൽകുക.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ പ്രയോഗവും ‘ശക്തി’ എന്ന അടുത്ത പദത്തിൽനിന്നുള്ള വേർതിരിവും പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- issue: ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നതിനാൽ എന്ന കാരണവാക്യം
  choice: വ്യക്തമായ കാരണബന്ധമായി നിലനിർത്തി.
  alternative: ‘ദൈവം അവനോടുകൂടെ ഉണ്ടായിരുന്നു’ എന്നു കാരണബന്ധമില്ലാതെ വേർതിരിക്കുക.
  rationale: ὅτι ഇവിടെ യേശുവിന്റെ നന്മപ്രവൃത്തിക്കും സൗഖ്യമാക്കലിനും കാരണമോ അടിസ്ഥാനമോ നൽകുന്നു; ഇതിൽനിന്ന് പാഠം പറയാത്ത ക്രിസ്തുശാസ്ത്രപരമായ നിഗമനങ്ങൾ ചേർക്കുകയോ ഒഴിവാക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സങ്കുചിതമായ ദ്വിതീയാവിഭക്തി–ബന്ധവാക്യഘടന മലയാളവായനയിൽ വ്യക്തതയ്ക്കായി രണ്ട് പ്രസ്താവനകളാക്കി; ആശയക്രമവും കാരണബന്ധവും സംരക്ഷിച്ചു. ഈ വാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ ‘നസറത്തിൽനിന്നുള്ള യേശുവിനെക്കുറിച്ച്’ എന്ന തുടക്കം ഉപയോഗിച്ചു; മുൻവാക്യത്തിലെ വാക്കുകൾ ഇവിടെ ആവർത്തിച്ചുചേർത്തിട്ടില്ല.
