    issue: Pronoun reference may be momentarily ambiguous
    rationale: After both പത്രോസ് and കൊർന്നേല്യോസ് have been named, ‘അദ്ദേഹത്തിന്റെ കാൽക്കൽ’ could briefly be parsed as referring to the nearer subject, Cornelius. Repeating Peter’s name resolves this cleanly.
  - severity: low
    issue: Footnote specifies full prostration too strongly
    rationale: ‘സാഷ്ടാംഗം വീണ്’ can imply a more specific bodily posture than πεσὼν ἐπὶ τοὺς πόδας requires. A broader expression such as ‘ആദരസൂചകമായി കുമ്പിടൽ’ preserves the lexical ambiguity.
