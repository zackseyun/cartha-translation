id: ACT.10.25
reference: Acts 10:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: ml
  text: പത്രോസ് അകത്തു കടന്നപ്പോൾ, കൊർന്നേല്യോസ് അദ്ദേഹത്തെ കണ്ടുമുട്ടി; പത്രോസിന്റെ കാൽക്കൽ വീണ് അദ്ദേഹത്തെ വണങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അദ്ദേഹത്തെ ആരാധിച്ചു.” ഗ്രീക്ക് ക്രിയ സന്ദർഭമനുസരിച്ച് ആരാധനയെയോ ആദരസൂചകമായി കുമ്പിടുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: പത്രോസ് അകത്തു കടന്നപ്പോൾ
  rationale: ഗ്രീക്ക് ആഖ്യാനശൈലിയിലെ കാലസാഹചര്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ദൈർഘ്യമേറിയ പദാനുപദഘടന ഒഴിവാക്കുന്നു.
- source_word: συναντήσας αὐτῷ
  choice: അദ്ദേഹത്തെ എതിരേറ്റു
  rationale: കൊർന്നേല്യോസ് പത്രോസിനെ ചെന്നു കണ്ടുമുട്ടി സ്വീകരിക്കുന്ന പ്രവൃത്തിയെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: അദ്ദേഹത്തിന്റെ കാൽക്കൽ വീണ്
  rationale: ശാരീരികമായ വീഴ്ചയും വിനയാധീനതയുടെ ഭാവവും ഗ്രീക്ക് പ്രയോഗത്തിന് അടുത്തായി നിലനിർത്തുന്നു.
- source_word: προσεκύνησεν
  choice: നമസ്കരിച്ചു
  rationale: προσκυνέω എന്ന പദത്തിന്റെ കുമ്പിടൽ, ആദരാഞ്ജലി അർപ്പിക്കൽ, ആരാധിക്കൽ എന്നിവ ഉൾപ്പെടുന്ന അർത്ഥവ്യാപ്തി മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി തുറന്നുവെക്കുന്നു; ശക്തമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പത്രോസിനോടുള്ള προσκυνέω എന്ന പ്രവൃത്തിയുടെ വിവർത്തനം
  choice: അദ്ദേഹത്തെ നമസ്കരിച്ചു
  alternative: അദ്ദേഹത്തെ ആരാധിച്ചു
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ പത്രോസ് ഈ പ്രവൃത്തി നിരസിക്കുന്നുവെങ്കിലും, ഇവിടെ ഉപയോഗിച്ച ഗ്രീക്ക് ക്രിയ ആദരസൂചകമായ സാഷ്ടാംഗപ്രണാമത്തെയും ആരാധനയെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠം അതിനെ ദൈവാരാധനയായി മാത്രം നിർണയിക്കാതെ ഗൗരവമുള്ള കുമ്പിടൽ നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പത്രോസിനെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു; വാക്യം സ്വാഭാവികമായി ഒഴുകാൻ രണ്ട് ബന്ധപ്പെട്ട പ്രവൃത്തികൾ അർദ്ധവിരാമത്തോടെ ചേർത്തു.
