  verdict: revise
  source_fidelity: The draft accurately represents the temporal setting, Cornelius’s meeting Peter, his falling at Peter’s feet, and προσκυνέω. However, the repeated honorific pronoun after introducing two male persons can create a slight referential ambiguity in Malayalam. The footnote’s ‘സാഷ്ടാംഗം വീണ്’ is more specific than the Greek, which says only that he fell at Peter’s feet.
  naturalness: The sentence is generally fluent modern Malayalam. Repeating ‘പത്രോസിന്റെ’ at the gesture makes the referent unambiguous, and ‘കണ്ടുമുട്ടി’ is a neutral, natural rendering of συναντήσας.
  terminology: ‘വണങ്ങി’ naturally conveys the reverential bow/prostration without deciding that the act was divine worship. The footnote preserves ‘ആരാധിച്ചു’ as a viable alternative and describes the semantic range without overstating the physical posture.
  issues:
