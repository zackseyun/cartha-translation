  to: ഇത് മൂന്നുപ്രാവശ്യം സംഭവിച്ചു; ഉടനെ ആ വസ്തു[a] സ്വർഗത്തിലേക്ക്[b] എടുത്തുയർത്തപ്പെട്ടു.
  rationale: The revision retains the Greek passive construction, repeated action, and immediacy while using a broader Malayalam term for σκεῦος and the contextually preferred sense “സ്വർഗം” for οὐρανός. The footnotes preserve the legitimate lexical alternatives without resolving them beyond what the context supports.
