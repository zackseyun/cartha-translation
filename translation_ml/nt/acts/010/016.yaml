id: ACT.10.16
reference: Acts 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: ml
  text: ഇത് മൂന്നുപ്രാവശ്യം സംഭവിച്ചു; ഉടനെ ആ വസ്തു[a] സ്വർഗത്തിലേക്ക്[b] എടുത്തുയർത്തപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിരിപ്പ്.” ഗ്രീക്കുപദത്തിന് “പാത്രം,” “ധാരകം,” “ഉപകരണം,” അല്ലെങ്കിൽ പൊതുവേ “വസ്തു” എന്നൊക്കെ അർഥമാകാം; മുൻസന്ദർഭത്തിൽ ഇത് വലിയൊരു വിരിപ്പുപോലെയാണ് വിവരിക്കപ്പെടുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ആകാശത്തിലേക്ക്.” ഗ്രീക്കുപദത്തിന് “ആകാശം” എന്നും “സ്വർഗം” എന്നും അർഥമാകാം; ഈ ദർശനസന്ദർഭത്തിൽ “സ്വർഗം” ആണ് കൂടുതൽ യോജിച്ചത്.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: ഇത്
  rationale: മുമ്പ് വിവരിച്ച ദർശനസംഭവത്തെ സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ സർവനാമം; മലയാളത്തിൽ സ്വാഭാവികമായ അന്വയസൂചന.
- source_word: δὲ
  choice: ;
  rationale: ഇവിടെ നേരിയ ബന്ധകമാണ്; പ്രത്യേക പദമായി വിവർത്തനം ചെയ്യാതെ വാക്യത്തിന്റെ ഒഴുക്കിലും അർധവിരാമത്തിലും ഉൾപ്പെടുത്തി.
- source_word: ἐγένετο
  choice: സംഭവിച്ചു
  rationale: γίνομαι എന്നതിന്റെ സാധാരണ സംഭവസൂചക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπὶ τρίς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: ഒരേ സംഭവം മൂന്നു തവണ ആവർത്തിച്ചതെന്ന ആശയം വ്യക്തമായി നൽകുന്ന പ്രയോഗം.
- source_word: εὐθὺς
  choice: ഉടനെ
  rationale: പെട്ടെന്നുള്ള തുടർനടപടി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀνελήμφθη
  choice: എടുക്കപ്പെട്ടു
  rationale: ἀναλαμβάνω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗവും മുകളിലേക്കുള്ള നീക്കവും സന്ദർഭത്തോടൊപ്പം സംരക്ഷിക്കുന്നു.
- source_word: τὸ σκεῦος
  choice: ആ പാത്രം
  rationale: σκεῦος എന്ന വിശാലമായ ‘പാത്രം/ഉപകരണം/ധാരകം’ എന്ന അർഥം അമിതമായി നിർവചിക്കാതെ നിലനിർത്തുന്നു; മുൻസന്ദർഭത്തിലെ വിരിപ്പുപോലുള്ള രൂപത്തെ കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸν οὐρανόν
  choice: ആകാശത്തിലേക്ക്
  rationale: οὐρανός എന്ന പദത്തിന്റെ ആകാശം/സ്വർഗം എന്ന യഥാർഥ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ദൃശ്യമായ മുകളിലേക്കുള്ള ചലനത്തിന് മലയാളത്തിൽ ‘ആകാശത്തിലേക്ക്’ സ്വാഭാവികമാണ്, ദൈവികമണ്ഡലമായ ‘സ്വർഗത്തിലേക്ക്’ എന്ന സാധ്യത കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പത്രൊസിന്റെ ദർശനത്തിൽ οὐρανός എന്നതിന്റെ സൂചന
  choice: ആകാശം
  alternative: സ്വർഗം
  rationale: ഗ്രീക്ക് പദത്തിന് രണ്ടർഥങ്ങളും സാധ്യമാണ്. വസ്തു മുകളിലേക്ക് എടുക്കപ്പെടുന്നതിനെ ‘ആകാശത്തിലേക്ക്’ എന്ന് പറയുന്നത് ദൃശ്യചലനം സ്വാഭാവികമായി നൽകുന്നു; ദർശനത്തിന്റെ ദൈവിക പശ്ചാത്തലത്തിൽ ‘സ്വർഗത്തിലേക്ക്’ എന്ന വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും പദാർഥത്തിലെ ആകാശം/സ്വർഗം എന്ന അനിശ്ചിതത്വവും സംരക്ഷിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തു.
