    rationale: മുഖ്യവാചകത്തിലെ ‘എന്തായിരിക്കാം’ ഗ്രീക്കിന്റെ തുറന്ന രൂപം തന്നെയാണ്. വ്യാഖ്യാനാത്മകമായ ‘അർത്ഥമെന്തായിരിക്കാം’ ഒരു ബദൽ എന്ന നിലയിൽ നൽകുകയും സന്ദർഭപരമായ അർത്ഥസാധ്യതയായി വിശദീകരിക്കുകയും ചെയ്യുന്നതാണ് കൂടുതൽ കൃത്യം.
