id: ACT.10.17
reference: Acts 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: ml
  text: താൻ കണ്ട ദർശനം എന്തായിരിക്കാം എന്ന് പത്രോസ് ഉള്ളിൽ ആശയക്കുഴപ്പത്തിലായിരിക്കുമ്പോൾ[a], ഇതാ, കൊർന്നേല്യോസ് അയച്ച പുരുഷന്മാർ ശിമോന്റെ വീടിനെക്കുറിച്ച് തിരക്കിയശേഷം കവാടത്തിങ്കൽ വന്നുനിന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “താൻ കണ്ട ദർശനത്തിന്റെ അർത്ഥമെന്തായിരിക്കാം.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ “താൻ കണ്ട ദർശനം എന്തായിരിക്കാം” എന്നാണ്; സന്ദർഭത്തിൽ അതിന്റെ അർത്ഥമോ പ്രാധാന്യമോ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പ്രവേശനകവാടത്തിങ്കൽ.” ഗ്രീക്ക് പദം വീടിന്റെ കവാടത്തെയോ കവാടപ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ആയിരിക്കുമ്പോൾ
  rationale: തുടർന്നുകൊണ്ടിരുന്ന സംഭവത്തിന്റെ സമയപശ്ചാത്തലവും ലഘുവായ ആഖ്യാനപുരോഗതിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν ἑαυτῷ
  choice: ഉള്ളിൽ
  rationale: പത്രോസിന്റെ ആശയക്കുഴപ്പം ആന്തരികമായിരുന്നുവെന്നത് ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διηπόρει
  choice: ആശയക്കുഴപ്പത്തിലായിരിക്കുമ്പോൾ
  rationale: അപൂർണ്ണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർന്നുനിന്ന ശക്തമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: τί ἂν εἴη
  choice: എന്തായിരിക്കാം
  rationale: ‘അത് എന്തായിരിക്കാം’ എന്ന ഗ്രീക്കിലെ തുറന്നതും അർത്ഥസന്ദിഗ്ധവുമായ ചോദ്യരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ‘എന്താണ് അർത്ഥം’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: താൻ കണ്ട ദർശനം
  rationale: ബന്ധവാക്യം മലയാളത്തിൽ ചുരുക്കവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: പുതിയതും ശ്രദ്ധേയവുമായ സംഭവവികാസത്തിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ തിരിക്കുന്ന ആഖ്യാനസൂചകം നിലനിർത്തുന്നു.
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: കൊർന്നേല്യോസ് അയച്ച ആളുകൾ
  rationale: പ്രായപൂർത്തിയായ പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന സന്ദർഭമാണെങ്കിലും, ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക കൂട്ടനാമമായ ‘ആളുകൾ’ വ്യക്തവും അനാവശ്യ കാഠിന്യമില്ലാത്തതുമാണ്; അയച്ചത് കൊർന്നേല്യോസാണെന്ന കാരണകർത്തൃത്വവും വ്യക്തമാക്കുന്നു.
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: ശിമോന്റെ വീട് അന്വേഷിച്ചറിഞ്ഞശേഷം
  rationale: വീടിന്റെ സ്ഥാനം ചോദിച്ചറിഞ്ഞ മുൻപ്രവൃത്തിയും തുടർന്ന് അവിടെ എത്തിയ ക്രമവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: കവാടത്തിങ്കൽ വന്നു നിന്നു
  rationale: എത്തിച്ചേർന്ന് പ്രവേശനസ്ഥാനത്ത് നിലകൊണ്ടു എന്ന ക്രിയയുടെ സന്ദർഭാർഥം രണ്ടും മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: τί ἂν εἴη എന്നതിൽ ദർശനത്തിന്റെ സ്വഭാവമാണോ അർത്ഥമാണോ ഉദ്ദേശിക്കുന്നത്
  choice: എന്തായിരിക്കാം
  alternative: എന്താണ് അർത്ഥമാക്കുന്നത്
  rationale: മൂലഭാഷയിലെ വാചകം അക്ഷരാർഥത്തിൽ ‘എന്തായിരിക്കാം’ എന്നാണ്; സന്ദർഭം അർത്ഥമോ പ്രാധാന്യമോ അന്വേഷിക്കുന്നതാകാമെങ്കിലും വിവർത്തനം ആ വ്യാഖ്യാനം നിർബന്ധമാക്കാതെ യഥാർഥ അനിശ്ചിതത്വം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ഇതാ’ എന്ന ആഖ്യാനസൂചകം മൂലത്തിലെ സജീവത നിലനിർത്തുന്നു. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ പ്രയോഗത്തിന് അനുയോജ്യമായി ‘പത്രോസ്’, ‘കൊർന്നേല്യോസ്’, ‘ശിമോൻ’ എന്നു നൽകിയിരിക്കുന്നു.
