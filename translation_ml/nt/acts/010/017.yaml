revisions:
- from: താൻ കണ്ട ദർശനം എന്തായിരിക്കാം എന്നതിനെക്കുറിച്ച് പത്രോസ് ഉള്ളിൽ ആശയക്കുഴപ്പത്തിലായിരിക്കുമ്പോൾ[a], ഇതാ, കൊർന്നേല്യോസ് അയച്ച ആളുകൾ ശിമോന്റെ വീട് അന്വേഷിച്ചറിഞ്ഞശേഷം കവാടത്തിങ്കൽ വന്നു നിന്നു[b].
  to: താൻ കണ്ട ദർശനം എന്തായിരിക്കാം എന്ന് പത്രോസ് ഉള്ളിൽ ആശയക്കുഴപ്പത്തിലായിരിക്കുമ്പോൾ[a], ഇതാ, കൊർന്നേല്യോസ് അയച്ച പുരുഷന്മാർ ശിമോന്റെ വീടിനെക്കുറിച്ച് തിരക്കിയശേഷം കവാടത്തിങ്കൽ വന്നുനിന്നു[b].
  rationale: പരിഭാഷയുടെ അടിസ്ഥാന ഘടനയും ആഖ്യാനരീതിയും നിലനിർത്തി, ἄνδρες-ന്റെ പുരുഷസൂചന പുനഃസ്ഥാപിക്കുകയും διερωτήσαντες-ൽ ഇല്ലാത്ത ‘അറിഞ്ഞു’ എന്ന ഫലസൂചന ഒഴിവാക്കുകയും ചെയ്തു. അടിക്കുറിപ്പ് a മൂലത്തിലെ തുറന്ന പ്രയോഗവും സന്ദർഭത്തിൽ സാധ്യമായ അർത്ഥവ്യാഖ്യാനവും വ്യക്തമായി വേർതിരിച്ചുകാട്ടുന്നു.
