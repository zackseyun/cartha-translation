    rationale: 'μαρτυρούμενος കർമണിപ്രയോഗമാണ്: കൊർന്നേല്യൊസിനെക്കുറിച്ച് യെഹൂദജനത നല്ല സാക്ഷ്യം നൽകുന്നു/അദ്ദേഹത്തിന് നല്ല സാക്ഷ്യം ലഭിച്ചിട്ടുണ്ട് എന്നതാണ് അർഥം. നിലവിലെ മലയാളം അദ്ദേഹം മറ്റുള്ളവരെക്കുറിച്ച് സാക്ഷ്യം പറയുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു.'
  revised_text: 'അവർ പറഞ്ഞു: “ശതാധിപനായ കൊർന്നേല്യൊസ് നീതിമാനും ദൈവത്തെ ഭയപ്പെടുന്നവനും യെഹൂദജനത മുഴുവനാലും നല്ല സാക്ഷ്യം ലഭിച്ചവനുമാണ്.[a] നിന്നെ തന്റെ വീട്ടിലേക്കു വിളിച്ചുവരുത്തി നിന്റെ വാക്കുകൾ കേൾക്കണമെന്ന് ഒരു വിശുദ്ധദൂതൻ മുഖാന്തരം അദ്ദേഹത്തിന് ദൈവിക നിർദേശം ലഭിച്ചു.”[b]'
