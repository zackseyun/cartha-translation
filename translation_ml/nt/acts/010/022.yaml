id: ACT.10.22
reference: Acts 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “ശതാധിപനായ കൊർന്നേല്യൊസ് നീതിമാനും ദൈവത്തെ ഭയപ്പെടുന്നവനും യെഹൂദജനത മുഴുവനാലും നല്ല സാക്ഷ്യം ലഭിച്ചവനുമാണ്.[a] നിന്നെ തന്റെ വീട്ടിലേക്കു വിളിച്ചുവരുത്തി നിന്റെ വാക്കുകൾ കേൾക്കണമെന്ന് ഒരു വിശുദ്ധദൂതൻ മുഖാന്തരം അദ്ദേഹത്തിന് ദൈവിക നിർദേശം ലഭിച്ചു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദജനമെല്ലാം അദ്ദേഹത്തെക്കുറിച്ച് നല്ല സാക്ഷ്യം പറയുന്നു.” ഇവിടെ “ജനത” എന്നത് ഒരു ജനവിഭാഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്, ആധുനിക രാഷ്ട്രീയ രാഷ്ട്രത്തെയല്ല.
    reason: lexical_alternative
  - marker: b
    text: '“ദൈവിക നിർദേശം ലഭിച്ചു” എന്നതിന് “ദൈവത്തിൽനിന്ന് സന്ദേശം ലഭിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥത്തിൽ അവസാനഭാഗം: “നിന്നിൽനിന്ന് വാക്കുകൾ കേൾക്കാൻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: ശതാധിപൻ
  rationale: റോമൻ സൈന്യത്തിലെ ഏകദേശം നൂറു സൈനികരുടെ മേൽനോട്ടമുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ചരിത്രപദം.
- source_word: ἀνὴρ δίκαιος
  choice: നീതിമാൻ
  rationale: ധാർമികവും മതപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; കൊർന്നേല്യോസിനെക്കുറിച്ചുള്ള വാചകത്തിന്റെ പ്രശംസ അതിലപ്പുറം വികസിപ്പിക്കുന്നില്ല.
- source_word: φοβούμενος τὸν θεόν
  choice: ദൈവത്തെ ഭയപ്പെടുന്നവൻ
  rationale: ദൈവത്തോടുള്ള ഭക്തിപൂർവമായ ആദരത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ ശൈലി നിലനിർത്തുകയും പ്രത്യേക പിൽക്കാല സിദ്ധാന്തവിഭാഗം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μαρτυρούμενος
  choice: നല്ല സാക്ഷ്യം പറയുന്നവൻ
  rationale: അനുകൂലമായ പൊതുസാക്ഷ്യവും നല്ല പേരും ലഭിക്കുന്നുവെന്ന കർമണിപദത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: യെഹൂദജനത മുഴുവൻ
  rationale: ἔθνος എന്നത് ആധുനിക രാഷ്ട്രമല്ല, ഒരു ജനവിഭാഗമാണെന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐχρηματίσθη
  choice: ദൈവിക നിർദേശം ലഭിച്ചു
  rationale: ഇവിടെ ദൈവത്തിൽനിന്നുള്ള സന്ദേശമോ നിർദേശമോ ലഭിച്ചതാണ് സൂചന; വെറും മുന്നറിയിപ്പായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀγγέλου ἁγίου
  choice: ഒരു വിശുദ്ധദൂതൻ മുഖാന്തരം
  rationale: ἁγίου എന്ന വിശേഷണം വ്യക്തമായി നിലനിർത്തുകയും ദൂതൻ ദൈവിക സന്ദേശത്തിന്റെ മാധ്യമമാണെന്ന ഘടന പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: നിന്നെ തന്റെ വീട്ടിലേക്കു വിളിച്ചുവരുത്തി
  rationale: ആളയച്ച് വരുത്തുക/വിളിച്ചുവരുത്തുക എന്ന μεταπέμπομαιയുടെ അർഥവും വീട്ടിലേക്കുള്ള ലക്ഷ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: നിന്റെ വാക്കുകൾ കേൾക്കുക
  rationale: ῥήματα എന്നതിന്റെ 'വാക്കുകൾ' എന്ന തുറന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു; അതിനെ പ്രസംഗമെന്നോ ഔപചാരിക സന്ദേശമെന്നോ അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: കൊർന്നേല്യോസിന്റെ ഭക്തിയെ പിൽക്കാല സിദ്ധാന്തവിഭാഗങ്ങൾ ചേർക്കാതെ അവതരിപ്പിക്കൽ
  choice: നീതിമാനും ദൈവത്തെ ഭയപ്പെടുന്നവനും
  alternative: ഭക്തനായ നീതിമാൻ
  rationale: മൂലപാഠത്തിലെ രണ്ട് വ്യത്യസ്ത വിശേഷണങ്ങളും നിലനിർത്തുന്നു; അവന്റെ ഉടമ്പടിസ്ഥിതിയെയോ രക്ഷാസ്ഥിതിയെയോ കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിഗമനം ചേർക്കുന്നില്ല.
- issue: ἐχρηματίσθη എന്ന ദൈവിക ആശയവിനിമയത്തിന്റെ സ്വഭാവം
  choice: ദൈവിക നിർദേശം ലഭിച്ചു
  alternative: മുന്നറിയിപ്പ് ലഭിച്ചു
  rationale: സന്ദർഭത്തിൽ മുന്നറിയിപ്പിനേക്കാൾ വിളിച്ചുവരുത്താനുള്ള സ്വർഗീയ നിർദേശമാണ് ഉദ്ദേശ്യം; അതേസമയം ദൈവിക ഉറവിടം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രപദമായ “ശതാധിപൻ” നിലനിർത്തി; നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി ഉദ്ധരണിക്കുള്ളിൽ രണ്ടു വാക്യങ്ങളാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
