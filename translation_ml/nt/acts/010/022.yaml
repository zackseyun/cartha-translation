revisions:
- from: 'അവർ പറഞ്ഞു: “ശതാധിപനായ കൊർന്നേല്യോസ് നീതിമാനും ദൈവത്തെ ഭയപ്പെടുന്നവനും യെഹൂദജനത മുഴുവൻ നല്ല സാക്ഷ്യം പറയുന്നവനുമാണ്.[a] നിന്നെ തന്റെ വീട്ടിലേക്കു വിളിച്ചുവരുത്തി നിന്റെ വാക്കുകൾ കേൾക്കണമെന്ന് ഒരു വിശുദ്ധദൂതൻ മുഖാന്തരം അദ്ദേഹത്തിന് ദൈവിക നിർദേശം ലഭിച്ചു.”[b]'
  to: 'അവർ പറഞ്ഞു: “ശതാധിപനായ കൊർന്നേല്യൊസ് നീതിമാനും ദൈവത്തെ ഭയപ്പെടുന്നവനും യെഹൂദജനത മുഴുവനാലും നല്ല സാക്ഷ്യം ലഭിച്ചവനുമാണ്.[a] നിന്നെ തന്റെ വീട്ടിലേക്കു വിളിച്ചുവരുത്തി നിന്റെ വാക്കുകൾ കേൾക്കണമെന്ന് ഒരു വിശുദ്ധദൂതൻ മുഖാന്തരം അദ്ദേഹത്തിന് ദൈവിക നിർദേശം ലഭിച്ചു.”[b]'
  rationale: μαρτυρούμενος-ന്റെ കർമണി അർഥം പുനഃസ്ഥാപിക്കാനായി “നല്ല സാക്ഷ്യം പറയുന്നവൻ” എന്നത് “നല്ല സാക്ഷ്യം ലഭിച്ചവൻ” എന്നാക്കി മാറ്റി. ഗ്രീക്ക് വാക്യത്തിലെ യെഹൂദജനതയാണ് സാക്ഷ്യം നൽകുന്നവർ എന്ന ബന്ധം “യെഹൂദജനത മുഴുവനാലും” എന്നതിലൂടെ വ്യക്തമായി. കൊർന്നേല്യൊസ് എന്ന ലിപിരൂപം ഗ്രീക്ക് നാമത്തിന്റെ സ്വരക്രമത്തോടു കൂടുതൽ അടുത്തതാണ്. മറ്റൊരു അർഥവിപുലീകരണമോ സിദ്ധാന്തനിഗമനമോ ചേർത്തിട്ടില്ല.
