  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: ml
  text: അവൻ ഭക്തനും തന്റെ കുടുംബത്തിലുള്ള എല്ലാവരോടുമൊപ്പം ദൈവത്തെ ഭയപ്പെടുന്നവനും[a] ജനത്തിനു ധാരാളം ദാനധർമങ്ങൾ ചെയ്യുന്നവനും[b] എപ്പോഴും ദൈവത്തോടു പ്രാർഥിക്കുന്നവനും ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവഭയമുള്ളവൻ.’ ഇസ്രായേലിന്റെ ദൈവത്തെ ആരാധിച്ചിരുന്ന ഒരു യഹൂദേതരനെ തിരിച്ചറിയിക്കുന്ന പ്രയോഗമായും ഈ വാക്കുകൾ ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ധാരാളം ഭിക്ഷാദാനങ്ങൾ നൽകുന്നവൻ.’ ഗ്രീക്ക് പദം പലപ്പോഴും ആവശ്യക്കാർക്കു നൽകുന്ന ദാനത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: ഭക്തൻ
  rationale: മതജീവിതത്തിൽ പ്രകടമാകുന്ന ദൈവഭക്തിയെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദം.
- source_word: φοβούμενος τὸν θεὸν
  choice: ദൈവത്തെ ഭയപ്പെടുന്നവൻ
  rationale: ഗ്രീക്കിലെ ക്രിയാത്മക പ്രയോഗവും ബൈബിൾഭാഷയിലെ ‘ദൈവഭയം’ എന്ന ആശയവും നിലനിർത്തുന്നു; വെറും ‘ആദരിക്കുന്നവൻ’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: തന്റെ കുടുംബത്തിലുള്ള എല്ലാവരോടുമൊപ്പം
  rationale: οἶκος ഭൗതികമായ വീടിനെയല്ല, വീട്ടുകാരടങ്ങുന്ന കുടുംബസമൂഹത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: ധാരാളം ദാനധർമങ്ങൾ ചെയ്യുന്നവൻ
  rationale: പല ദാനപ്രവൃത്തികൾ, പ്രത്യേകിച്ച് ആവശ്യക്കാർക്കുള്ള സഹായം, എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ποιῶν എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ വിവരണാത്മക സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: τῷ λαῷ
  choice: ജനത്തിനു
  rationale: ദാനപ്രവൃത്തികളുടെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δεόμενος τοῦ θεοῦ
  choice: ദൈവത്തോടു പ്രാർഥിക്കുന്നവൻ
  rationale: δέομαι എന്നതിലെ അപേക്ഷയുടെയും പ്രാർഥനയുടെയും അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: διὰ παντός
  choice: എപ്പോഴും
  rationale: മുടങ്ങാതെയുള്ള പതിവിനെയും തുടർച്ചയെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഓരോ നിമിഷവും ഇടവിടാതെ എന്ന അമിതവ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: കൊർന്നേല്യൊസിനെക്കുറിച്ചുള്ള ‘ദൈവത്തെ ഭയപ്പെടുന്നവൻ’ എന്ന പ്രയോഗം
  choice: ദൈവത്തെ ഭയപ്പെടുന്നവൻ
  alternative: ദൈവഭക്തൻ / ദൈവത്തെ ആദരിക്കുന്നവൻ
  rationale: ഈ പദപ്രയോഗത്തിന് പൊതുവായ ദൈവഭക്തി എന്ന അർഥത്തോടൊപ്പം ഇസ്രായേലിന്റെ ദൈവത്തെ ആരാധിച്ചിരുന്ന യഹൂദേതരനെ തിരിച്ചറിയിക്കുന്ന ചരിത്രപരമായ പ്രയോഗമാകാനുള്ള സാധ്യതയുമുണ്ട്. മുഖ്യപാഠം ഗ്രീക്കിലെ രൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് രണ്ടാമത്തെ സാധ്യത അറിയിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. മുൻവാക്യത്തിൽ പരിചയപ്പെടുത്തിയ കൊർന്നേല്യൊസിനെ തുടർന്നുള്ള കർത്താവായി ‘അവൻ’ ചേർത്തിരിക്കുന്നു. ഗ്രീക്കിലെ സമാന്തര വിവരണഘടന ‘ഭക്തനും… ചെയ്യുന്നവനും… പ്രാർഥിക്കുന്നവനും’ എന്ന ക്രമത്തിൽ സംരക്ഷിച്ചു.
