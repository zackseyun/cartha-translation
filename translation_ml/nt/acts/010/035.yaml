source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: ml
  text: എന്നാൽ എല്ലാ ജനതകളിലും ദൈവത്തെ ഭയപ്പെടുകയും നീതി പ്രവർത്തിക്കുകയും ചെയ്യുന്നവൻ ദൈവത്തിനു സ്വീകാര്യനാണ്[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിയായതു പ്രവർത്തിക്കുന്നവൻ” അല്ലെങ്കിൽ “നീതി ആചരിക്കുന്നവൻ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ δικαιοσύνην; സാധാരണയായി “നീതി” അല്ലെങ്കിൽ “നീതിനിഷ്ഠ” എന്നു വിവർത്തനം ചെയ്യുന്നു; ചില സന്ദർഭങ്ങളിൽ “ന്യായം” എന്നും അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ദൈവം അവനെ സ്വീകരിക്കുന്നു.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ദൈവം മുഖപക്ഷം കാണിക്കുന്നില്ല എന്ന പ്രസ്താവനയോടുള്ള സ്വാഭാവികമായ വൈരുധ്യബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: ἐν παντὶ ἔθνει
  choice: ഏതു ജനതയിലും
  rationale: παντί എന്നതിന്റെ വിതരണാർഥവും ἔθνος എന്നതിന്റെ ജനത/ദേശജനവിഭാഗം എന്ന വിശാലാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ φοβούμενος αὐτὸν
  choice: ദൈവത്തെ ഭയപ്പെടുകയും … ചെയ്യുന്നവൻ
  rationale: ഗ്രീക്കിലെ αὐτόν സന്ദർഭത്തിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ നാമം ആവർത്തിച്ചു. ‘ഭയപ്പെടുക’ ഭക്ത്യാദരത്തോടുകൂടിയ ദൈവഭയം എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: നീതി പ്രവർത്തിക്കുകയും
  rationale: ἐργάζομαι എന്നതിന്റെ സജീവപ്രവർത്തനഭാവവും δικαιοσύνη എന്ന നാമത്തിന്റെ സാന്ദ്രതയും നിലനിർത്തുന്ന, മലയാള ബൈബിൾശൈലിയിൽ മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: അവിടത്തേക്കു സ്വീകാര്യനാണ്
  rationale: കർമ്മണിപ്രയോഗമാക്കാതെ ഗ്രീക്കിലെ predicate adjective ഘടന പിന്തുടരുന്നു; δεκτός എന്നതിലെ സ്വീകരിക്കപ്പെടാവുന്ന/അംഗീകാരയോഗ്യമായ എന്ന അർഥപരിധി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവഭയവും നീതിപ്രവൃത്തിയും ദൈവത്തിന്റെ സ്വീകാര്യതയും തമ്മിലുള്ള ബന്ധം
  choice: 'വാക്യം പ്രസ്താവിക്കുന്ന ബന്ധം വിശദീകരണമില്ലാതെ അതേപടി നിലനിർത്തി: അത്തരം വ്യക്തി ദൈവത്തിനു സ്വീകാര്യനാണ്.'
  alternative: ‘സ്വീകാര്യത സമ്പാദിക്കുന്നു’ എന്ന പുണ്യാധിഷ്ഠിത വ്യാഖ്യാനം, അല്ലെങ്കിൽ ‘രക്ഷിക്കുന്ന വിശ്വാസത്തിന്റെ തെളിവാണ്’ എന്ന വിശദീകരണാത്മക വ്യാഖ്യാനം.
  rationale: വംശീയ മുഖപക്ഷമില്ലായ്മയുടെ സന്ദർഭത്തിൽ ഗ്രീക്ക് പാഠം പറയുന്നതിലപ്പുറം രക്ഷാശാസ്ത്രപരമായ തർക്കം പരിഹരിക്കാതിരിക്കാൻ.
- issue: δεκτός എന്നതിന്റെ നിലയോ സംഭവമോ
  choice: ‘സ്വീകാര്യനാണ്’ എന്ന വിശേഷണാത്മക നില.
  alternative: ‘അവിടന്ന് സ്വീകരിക്കുന്നു/സ്വീകരിക്കപ്പെടുന്നു’ എന്ന സംഭവാത്മക വായന.
  rationale: δεκτὸς … ἐστιν എന്ന ഗ്രീക്ക് ഘടനയ്ക്ക് വിശേഷണാത്മക പരിഭാഷ കൂടുതൽ അടുത്തതാണ്; മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. ‘നീതി പ്രവർത്തിക്കുക’ എന്നത് അല്പം ഔപചാരികമാണെങ്കിലും δικαιοσύνη എന്ന മൂലപദവും അതിന്റെ പ്രവർത്തനാത്മക കൂട്ടുപ്രയോഗവും സംരക്ഷിക്കുന്നു. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടത്തേക്കു/അവിടന്ന്’ ഉപയോഗിച്ചു.
