revisions:
- from: എന്നാൽ ഏതു ജനതയിലും ദൈവത്തെ ഭയപ്പെടുകയും നീതി പ്രവർത്തിക്കുകയും ചെയ്യുന്നവൻ അവിടത്തേക്കു സ്വീകാര്യനാണ്[a][b].
