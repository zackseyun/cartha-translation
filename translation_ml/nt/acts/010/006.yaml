    rationale: It can imply co-residence rather than lodging with the named host. Recasting it as staying with Simon preserves the Greek relation and remains a genuine lexical alternative.
  revised_text: അവൻ തോൽ സംസ്‌കരിക്കുന്ന ശിമോൻ എന്ന ഒരാളുടെ അടുക്കൽ അതിഥിയായി താമസിക്കുന്നു[a]. അയാളുടെ വീട് കടലിനരികിലാണ്.
