id: ACT.10.6
reference: Acts 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὗτος ξενίζεται παρά τινι Σίμωνι βυρσεῖ, ᾧ ἐστιν οἰκία παρὰ θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: ml
  text: അവൻ തോൽ സംസ്‌കരിക്കുന്ന ശിമോൻ എന്ന ഒരാളുടെ അടുക്കൽ അതിഥിയായി താമസിക്കുന്നു[a]. അയാളുടെ വീട് കടലിനരികിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവൻ തോൽ സംസ്‌കരിക്കുന്ന ശിമോൻ എന്ന ഒരാളുടെ കൂടെ താമസിക്കുന്നു.”
    reason: ξενίζεται എന്ന പദത്തിന് ആതിഥ്യം സ്വീകരിച്ചുള്ള താമസം എന്ന പ്രത്യേക ഭാവവും പൊതുവായി ഒരാളുടെ കൂടെ താമസിക്കുക എന്ന അർഥവും ഈ സന്ദർഭത്തിൽ സാധ്യമാണ്.
lexical_decisions:
- source_word: οὗτος
  choice: അവൻ
  rationale: സന്ദർഭത്തിൽ ഇത് പത്രോസിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി പുരുഷ ഏകവചന സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: ξενίζεται
  choice: അതിഥിയായി താമസിക്കുന്നു
  rationale: വർത്തമാനകാല മധ്യ/കർമണി രൂപം മറ്റൊരാളുടെ ആതിഥ്യം സ്വീകരിച്ച് താമസിക്കുന്ന അർഥം നൽകുന്നു; ഈ പ്രയോഗം ആ അതിഥിതാമസത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: παρά τινι
  choice: എന്ന ഒരാളുടെ അടുക്കൽ
  rationale: παρά + ചതുർഥി ഒരാളോടൊപ്പമോ അയാളുടെ വസതിയിലോ ഉള്ള താമസം സൂചിപ്പിക്കുന്നു; τις നൽകുന്ന അനിശ്ചിതത്വം ‘ഒരാൾ’ നിലനിർത്തുന്നു.
- source_word: Σίμωνι
  choice: ശിമോൻ
  rationale: പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള പരിചിത ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: βυρσεῖ
  choice: തോൽ പതംവരുത്തുന്ന
  rationale: βυρσεύς മൃഗത്തോൽ സംസ്കരിച്ച് ഉപയോഗയോഗ്യമാക്കുന്ന ആളെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘തോൽപ്പണിക്കാരൻ’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം കൃത്യമാണ്.
- source_word: ᾧ ἐστιν οἰκία
  choice: അയാളുടെ വീട്
  rationale: ബന്ധസർവനാമമുള്ള ഗ്രീക്ക് പ്രയോഗം ശിമോനാണ് ആ വീടിന്റെ ഉടമയെന്ന് സൂചിപ്പിക്കുന്നു; രണ്ട് മലയാള വാക്യങ്ങളാക്കി നൽകുന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: παρὰ θάλασσαν
  choice: കടലിനരികിലാണ്
  rationale: παρά + ദ്വിതീയാവിഭക്തി ഇവിടെ സമീപസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘കടലിനരികിൽ’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
