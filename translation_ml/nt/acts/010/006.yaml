translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘തോൽ പതംവരുത്തുന്ന’ എന്നത് തൊഴിലെന്തെന്ന് കൃത്യമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി രണ്ടാമത്തെ വാക്യമായി നൽകിയിരിക്കുന്നു.
