source:
  edition: SBLGNT
  text: καταβὰς δὲ Πέτρος πρὸς τοὺς ἄνδρας εἶπεν· Ἰδοὺ ἐγώ εἰμι ὃν ζητεῖτε· τίς ἡ αἰτία δι’ ἣν πάρεστε;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് ആ പുരുഷന്മാരുടെ അടുത്തേക്ക് ഇറങ്ങിച്ചെന്ന് പറഞ്ഞു: “ഇതാ, നിങ്ങൾ അന്വേഷിക്കുന്ന ആൾ ഞാനാണ്. നിങ്ങൾ ഇവിടെ വന്നിരിക്കുന്നതിന്റെ കാരണം എന്താണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: പത്രോസ് മുകളിലിരുന്ന സ്ഥലത്തുനിന്ന് താഴെയുള്ള സന്ദർശകരുടെ അടുത്തേക്ക് ഇറങ്ങിയ ദിശയും തുടർന്ന് അവരെ സമീപിച്ചതും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ അടുത്ത ഘട്ടത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: πρὸς τοὺς ἄνδρας
  choice: ആ പുരുഷന്മാരുടെ അടുത്തേക്ക്
  rationale: πρός സഹിതമുള്ള ദിശാബോധം നിലനിർത്തുകയും മുമ്പ് പരാമർശിച്ച ആളുകളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് സംഭാഷണസൂചകത്തിന് ആധുനികവും മാന്യവുമായ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: നിങ്ങൾ അന്വേഷിക്കുന്ന ആൾ ഞാനാണ്
  rationale: ആപേക്ഷിക ഉപവാക്യവും പത്രോസിന്റെ സ്വയം തിരിച്ചറിയിക്കലിലുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: നിങ്ങൾ ഇവിടെ വന്നിരിക്കുന്നതിന്റെ കാരണം എന്താണ്?
  rationale: αἰτία എന്ന വ്യക്തമായ ‘കാരണം’ എന്ന നാമപദം സംരക്ഷിക്കുന്നു; πάρεστε സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ സാന്നിധ്യത്തെയും ഇവിടെ എത്തിച്ചേരലിനെയും ‘വന്നിരിക്കുന്നതിന്റെ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
