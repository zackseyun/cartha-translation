  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വ്യക്തമായ ‘കാരണം’ എന്ന ആശയം വെറും ‘എന്തിനാണ്?’ എന്നു ചുരുക്കാതെ നിലനിർത്തിയിട്ടുണ്ട്.
