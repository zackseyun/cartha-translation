id: ACT.10.9
reference: Acts 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: ml
  text: പിറ്റേന്ന്, യാത്രയിലായിരുന്ന അവർ പട്ടണത്തോടടുത്തുകൊണ്ടിരിക്കുമ്പോൾ, ഏകദേശം ആറാം മണിക്കൂറിൽ[a] പ്രാർഥിക്കാൻ പത്രോസ് വീടിന്റെ മട്ടുപ്പാവിലേക്കു കയറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യഹൂദരുടെ പകൽസമയ കണക്കനുസരിച്ച് ഏകദേശം ഉച്ചയ്ക്ക്.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: ദത്തിവിലുള്ള കാലസൂചക പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. δέയുടെ നേരിയ ആഖ്യാനബന്ധം പ്രത്യേകം ഒരു പദമായി ചേർക്കാതെ വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁδοιπορούντων ἐκείνων
  choice: അവർ യാത്രചെയ്ത്
  rationale: മുൻസന്ദർഭത്തിലെ കൊർന്നേല്യൊസ് അയച്ച ആളുകളെയാണ് ἐκείνων സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ സമകാലിക ഉപവാക്യത്തിന്റെ ഭാഗമായി ‘അവർ’ എന്നു നൽകി.
- source_word: τῇ πόλει ἐγγιζόντων
  choice: പട്ടണത്തിന് അടുത്തെത്തിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐγγίζωയുടെ അടുത്തുവരുന്ന പ്രവൃത്തിയും രണ്ടു പങ്കാളകക്രിയകളുടെ സമകാലികതയും നിലനിർത്തുന്നു.
- source_word: ἀνέβη
  choice: കയറി
  rationale: മട്ടുപ്പാവിലേക്കുള്ള മുകളോട്ടുള്ള ചലനത്തെ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τὸ δῶμα
  choice: വീടിന്റെ മട്ടുപ്പാവിലേക്കു
  rationale: δῶμα ഇവിടെ ഉപയോഗിക്കാവുന്ന പരന്ന വീടുമുകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘മട്ടുപ്പാവ്’ ആ വാസ്തുവിദ്യാസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: προσεύξασθαι
  choice: പ്രാർഥിക്കാൻ
  rationale: ἀνέβηയ്ക്ക് പിന്നാലെയുള്ള ഉദ്ദേശ്യാർഥക അനന്തക്രിയ സ്വാഭാവികമായ മലയാള ഉദ്ദേശ്യരൂപത്തിൽ നൽകുന്നു.
- source_word: περὶ ὥραν ἕκτην
  choice: ഏകദേശം ആറാം മണിക്കൂറിൽ
  rationale: περίയുടെ ഏകദേശാർഥവും മൂലപാഠത്തിലെ യഹൂദ സമയഗണനാപ്രയോഗവും പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
