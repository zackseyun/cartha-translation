translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ആറാം മണിക്കൂർ’ എന്ന സാംസ്കാരിക സമയപ്രയോഗം വാചകത്തിൽ നിലനിർത്തി വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി. അടിക്കുറിപ്പ് സൂചകം ഇംഗ്ലീഷ് മാതൃകയിലുള്ള സ്ഥാനത്ത് ‘പിറ്റേന്ന്’ എന്നതിനുശേഷം ചേർത്തിരിക്കുന്നു.
