id: ACT.10.5
reference: Acts 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: ml
  text: ഇപ്പോൾ യോപ്പയിലേക്ക് പുരുഷന്മാരെ അയയ്‌ക്കുക; പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോൻ എന്നൊരാളെ വിളിച്ചുവരുത്തുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശിമോൻ എന്നു പേരുള്ള, പത്രോസ് എന്ന് അറിയപ്പെടുന്ന ഒരാളെ ആളയച്ചു വരുത്തുക.’
    reason: ‘പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന’ എന്ന നാമപ്രയോഗത്തിനും μετάπεμψαι എന്നതിന് ‘ആളയച്ചു വരുത്തുക’ എന്ന കൂടുതൽ വ്യക്തമാക്കിയ പകരപ്രയോഗത്തിനും ഉള്ള പകരപരിഭാഷ.
lexical_decisions:
- source_word: καὶ νῦν
  choice: ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള തുടർച്ച മലയാളത്തിലെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നതിനാൽ, νῦν എന്ന കാലസൂചന ‘ഇപ്പോൾ’ എന്നു നേരിട്ട് നൽകി; καί പ്രത്യേകം ‘എന്നിട്ട്’ എന്നു ചേർത്താൽ ഇവിടെ അനാവശ്യമായ ഭാരം വരാം.
- source_word: πέμψον ἄνδρας εἰς Ἰόππην
  choice: യോപ്പയിലേക്ക് പുരുഷന്മാരെ അയച്ച്
  rationale: πέμψον എന്ന ആജ്ഞാരൂപത്തിന്റെ ബലം നിലനിർത്തുന്നു; ἄνδρας എന്ന പുരുഷലിംഗ ബഹുവചനം പൊതുവായ ‘ആളുകൾ’ എന്നു ലഘൂകരിക്കാതെ ‘പുരുഷന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി. εἰς Ἰόππην ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘യോപ്പയിലേക്ക്’ സ്വാഭാവികമാണ്.
- source_word: μετάπεμψαι
  choice: വിളിച്ചുവരുത്തുക
  rationale: ഒരാളെ ആളയച്ച് തന്റെ അടുക്കലേക്ക് വരുത്തുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; നിർബന്ധപൂർവം കൊണ്ടുവരിക എന്ന അതിശക്തമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: Σίμωνά τινα
  choice: ശിമോൻ എന്ന ഒരാളെ
  rationale: τινα പരിചയപ്പെടുത്തുന്നത് നിർദിഷ്ടനാണെങ്കിലും ഇതുവരെ ശ്രോതാവിന് തിരിച്ചറിയാത്ത ഒരാളെയാണ്. ‘ശിമോൻ എന്ന ഒരാൾ’ എന്ന പ്രയോഗം മലയാളത്തിൽ ഈ സ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന
  rationale: ശിമോന് ഉപയോഗിക്കപ്പെടുന്ന മറ്റൊരു പേര് എന്ന ആശയം നേരിട്ട് നൽകുന്നു; ‘അറിയപ്പെടുന്ന’ എന്നതും സാധുവായ, അല്പം സ്വതന്ത്രമായ പകരമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘പുരുഷന്മാരെ’ എന്നത് മൂലപാഠത്തിലെ ἄνδρας എന്ന പദത്തിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നു; ‘വിളിച്ചുവരുത്തുക’ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
