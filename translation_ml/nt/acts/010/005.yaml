  to: ഇപ്പോൾ യോപ്പയിലേക്ക് പുരുഷന്മാരെ അയയ്‌ക്കുക; പത്രോസ് എന്നു വിളിക്കപ്പെടുന്ന ശിമോൻ എന്നൊരാളെ വിളിച്ചുവരുത്തുക[a].
