id: ACT.10.33
reference: Acts 10:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: ml
  text: അതുകൊണ്ട് ഞാൻ ഉടൻതന്നെ[a] ആളയച്ച് അങ്ങയെ വിളിപ്പിച്ചു; അങ്ങ് വന്നത് നന്നായി. ഇപ്പോൾ ഞങ്ങൾ എല്ലാവരും ദൈവസന്നിധിയിൽ ഇവിടെ കൂടിയിരിക്കുന്നത്, കർത്താവ് അങ്ങയോടു കല്പിച്ചിട്ടുള്ളതെല്ലാം കേൾക്കാനാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒട്ടും താമസിക്കാതെ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘കർത്താവ്.’ സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കുന്നതാകാം; എന്നാൽ ചിലർ ഇത് ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: ഉടൻതന്നെ
  rationale: ഒട്ടും താമസിക്കാതെയുള്ള നടപടിയെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന് സ്വാഭാവികവും കൃത്യവുമായ ആധുനിക മലയാളം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു.
- source_word: ἔπεμψα πρὸς σέ
  choice: ആളയച്ച് അങ്ങയെ വിളിപ്പിച്ചു
  rationale: അക്ഷരാർഥം ‘അങ്ങയുടെ അടുക്കൽ അയച്ചു’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ കൊർന്നേല്യൊസ് ദൂതന്മാരെ അയച്ച് പത്രോസിനെ വരുത്തിയതാണ്; മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: അങ്ങ് വന്നത് നന്നായി
  rationale: ഗ്രീക്കിലെ അംഗീകാരപ്രയോഗത്തെയും പത്രോസിന്റെ വരവിനെയും ലളിതവും മാന്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: νῦν οὖν
  choice: ഇപ്പോൾ
  rationale: കൂടിവന്നതിന്റെ ഉദ്ദേശ്യത്തിലേക്കുള്ള സംഭാഷണപരമായ മാറ്റം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: πάντες ἡμεῖς
  choice: ഞങ്ങൾ എല്ലാവരും
  rationale: കൂടിയിരിക്കുന്ന മുഴുവൻ സംഘത്തെയും ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് ക്രമത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തെക്കുറിച്ചുള്ള ഗൗരവബോധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάρεσμεν
  choice: ഇവിടെ കൂടിയിരിക്കുന്നത്
  rationale: ‘സന്നിഹിതരായിരിക്കുന്നു’ എന്ന അർഥം ഈ കൂട്ടായ്മയുടെ സന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀκοῦσαι
  choice: കേൾക്കാനാണ്
  rationale: കൂടിവന്നതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഉദ്ദേശ്യാർഥക ക്രിയാരൂപം നിലനിർത്തുന്നു.
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: അങ്ങയോടു കല്പിച്ചിട്ടുള്ളതെല്ലാം
  rationale: സകലത്വവും അധികാരപൂർവമായ നിർദേശവും കൂടാതെ പരിപൂർണകാലത്തിന്റെ നിലവിലുള്ള ഫലവും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὑπὸ τοῦ κυρίου
  choice: കർത്താവ്
  rationale: കർതൃവാചക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചുകൊണ്ട് κύριος എന്ന പദം വ്യാഖ്യാനാത്മക വികസനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοῦ κυρίου എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി.
  alternative: ‘ദൈവം’ എന്നു മനസ്സിലാക്കുക, അല്ലെങ്കിൽ വ്യാഖ്യാനപരമായി ‘കർത്താവായ യേശു’ എന്നു വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രമാണുള്ളത്. സന്ദർഭത്തിൽ ഇത് യേശുവിനെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ടെങ്കിലും പേര് ചേർക്കുന്നത് മൂലപാഠത്തിലെ നിർവചിക്കാത്ത സൂക്ഷ്മത ഇല്ലാതാക്കും; അതിനാൽ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. പത്രോസിനോടുള്ള ആദരസൂചക അഭിസംബോധനയായി ‘അങ്ങ്/അങ്ങയെ/അങ്ങയോടു’ ഉപയോഗിച്ചു. ‘ദൈവസന്നിധിയിൽ’ എന്ന പ്രയോഗം വാക്യത്തിന്റെ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
