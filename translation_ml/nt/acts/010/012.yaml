translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ഗ്രീക്കിലെ ഏകവചനക്രിയയ്ക്ക് മലയാളത്തിലെ പട്ടികാകർത്താവിനനുസരിച്ച് സ്വാഭാവികമായ ബഹുവചന ക്രിയ ഉപയോഗിച്ചു. ‘ഇഴജന്തുക്കൾ’ മൂലപദത്തിന്റെ വിശാലത ‘ഉരഗങ്ങൾ’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
