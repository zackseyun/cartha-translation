source:
  edition: SBLGNT
  text: ἐν ᾧ ὑπῆρχεν πάντα τὰ τετράποδα ⸂καὶ ἑρπετὰ τῆς γῆς καὶ⸃ πετεινὰ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: ml
  text: അതിൽ എല്ലാ നാലുകാലി മൃഗങ്ങളും ഭൂമിയിലെ ഇഴജന്തുക്കളും ആകാശത്തിലെ പക്ഷികളും ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അതിൽ
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ വിരിപ്പുപോലെയുള്ള പാത്രത്തെ സൂചിപ്പിക്കുന്നു. സ്ഥാനാർഥം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണ് ‘അതിൽ’.
- source_word: ὑπῆρχεν
  choice: ഉണ്ടായിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം അതിനുള്ളിലെ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘അടങ്ങിയിരുന്നു’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: πάντα
  choice: എല്ലാ
  rationale: പട്ടികപ്പെടുത്തിയ ജീവിവർഗങ്ങളുടെ സമഗ്രത നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; ‘എല്ലാത്തരം’ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τὰ τετράποδα
  choice: നാലുകാലികൾ
  rationale: നാലു കാലുകളുള്ള മൃഗങ്ങളെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സംക്ഷിപ്തവുമായ മലയാളപദം.
- source_word: ἑρπετὰ τῆς γῆς
  choice: ഭൂമിയിലെ ... ഇഴജന്തുക്കൾ
  rationale: ἑρπετάയുടെ ‘ഇഴയുന്ന ജീവികൾ’ എന്ന വിശാലാർഥം ‘ഉരഗങ്ങൾ’ എന്ന ആധുനിക ജീവശാസ്ത്രവിഭാഗത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു; τῆς γῆς-ന്റെ ഭൂമിയോടുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ആകാശത്തിലെ പക്ഷികൾ
  rationale: ഈ പട്ടികയിൽ πετεινά സ്വാഭാവികമായി ‘പക്ഷികൾ’ എന്നും οὐρανός ഭൗതികമായ ആകാശത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആകാശത്തിലെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: καὶ ... καὶ
  choice: -കളും ... -കളും
  rationale: മലയാളത്തിലെ സ്വാഭാവിക പട്ടികാസംയോജനത്തിലൂടെ ആവർത്തിച്ച καί-യുടെ ഏകോപനബന്ധം പ്രകടമാക്കുന്നു.
