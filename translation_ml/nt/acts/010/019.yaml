revisions:
- from: 'പത്രോസ് ആ ദർശനത്തെക്കുറിച്ച് ആഴമായി ചിന്തിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ആത്മാവ് അവനോടു പറഞ്ഞു: “ഇതാ, ചില പുരുഷന്മാർ നിന്നെ അന്വേഷിക്കുന്നു[a].”'
