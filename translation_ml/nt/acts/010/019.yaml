id: ACT.10.19
reference: Acts 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: ml
  text: 'പത്രോസ് ആ ദർശനത്തെക്കുറിച്ച് ആഴമായി ചിന്തിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ആത്മാവ് അവനോടു പറഞ്ഞു: “ഇതാ, പുരുഷന്മാർ നിന്നെ അന്വേഷിക്കുന്നു[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിന്നെ തിരയുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διενθυμουμένου
  choice: ആഴമായി ചിന്തിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ഈ വർത്തമാനകാല കൃദന്തം തുടരുന്ന ആന്തരികവും ഗൗരവമുള്ളതുമായ വിചിന്തനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഭാവം പകരാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു; ഗ്രീക്കിൽ പ്രത്യേകം ഇല്ലാത്ത ‘ഇപ്പോഴും’ ചേർത്തിട്ടില്ല.
- source_word: περὶ τοῦ ὁράματος
  choice: ആ ദർശനത്തെക്കുറിച്ച്
  rationale: περί എന്ന ബന്ധസൂചകത്തിന്റെ അർത്ഥം വ്യക്തമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ നേരത്തേ പരാമർശിച്ച ദർശനമായതിനാൽ നിർദേശകമായ ‘ആ’ ഉപയോഗിച്ചു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവാത്മാവാണ് പത്രോസിനോട് സംസാരിക്കുന്നത്. എന്നാൽ ഗ്രീക്കിൽ ἅγιον ഇല്ലാത്തതിനാൽ ‘പരിശുദ്ധ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: εἶπεν αὐτῷ
  choice: അവനോടു പറഞ്ഞു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδού എന്ന സംവാദചിഹ്നത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἄνδρες
  choice: ചില പുരുഷന്മാർ
  rationale: ἀνήρ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അനിശ്ചിത ബഹുവചനത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘ചില’ ചേർത്തു; ലിംഗസൂചന നിലനിർത്തി.
- source_word: ζητοῦντές σε
  choice: നിന്നെ അന്വേഷിക്കുന്നു
  rationale: ζητέω എന്നതിന് ഇവിടെ ഒരാളെ കണ്ടെത്താൻ ശ്രമിക്കുക എന്ന അർത്ഥമാണ്. ‘അന്വേഷിക്കുന്നു’ ഗൗരവമുള്ള വിവരണശൈലിയോട് ചേരുകയും മൂലത്തിന്റെ വിശാലമായ അർത്ഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τὸ πνεῦμα എന്നതിന്റെ പരാമർശിതൻ
  choice: ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: വ്യക്തമായി നിർവചിക്കാത്ത ഒരു ആത്മാവ് അല്ലെങ്കിൽ ആത്മീയ പ്രേരണ
  rationale: പ്രവൃത്തികൾ 10-ന്റെ ആഖ്യാനസന്ദർഭത്തിൽ ജാതികളിലേക്കുള്ള ദൗത്യത്തിൽ പത്രോസിനെ നയിക്കുന്നത് ദൈവാത്മാവാണ്. എങ്കിലും മൂലപാഠത്തിൽ ‘പരിശുദ്ധ’ ഇല്ലാത്തതിനാൽ അത് പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: ἄνδρες എന്നതിലെ ലിംഗസൂചന
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ; സന്ദർശകർ
  rationale: ഗ്രീക്ക് പദം പൊതുവായ മനുഷ്യരെ അല്ല, പുരുഷന്മാരെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; അതിനാൽ ആ വിവരം നിഷ്പക്ഷമാക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ഇതാ’ എന്നത് Ἰδοὺയുടെ ശ്രദ്ധാകർഷക സ്വഭാവം നിലനിർത്തുന്നു; ‘ആഴമായി ചിന്തിച്ചുകൊണ്ടിരിക്കുമ്പോൾ’ തുടരുന്ന വിചിന്തനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
