  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: ml
  text: 'അപ്പോൾ അവനോട് ഒരു ശബ്ദം പറഞ്ഞു: “പത്രോസേ, എഴുന്നേറ്റ് അറുത്ത്[a] തിന്നുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബലിയർപ്പിച്ച്.” ഇവിടെ “അറുത്ത്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് “ബലിയർപ്പിക്കുക” എന്നും അർഥമാകാം. എന്നാൽ ഈ ദർശനത്തിൽ ഭക്ഷണത്തിനായി ഒരു മൃഗത്തെ അറുക്കുന്നതിനെയാണ് ഇത് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: അപ്പോൾ ... പറഞ്ഞു
  rationale: φωνήയോടൊപ്പം വന്നിരിക്കുന്ന γίνομαι ഒരു ശബ്ദം ഉണ്ടാകുകയോ കേൾക്കുകയോ ചെയ്ത സംഭവത്തെ അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരു ശബ്ദം പറഞ്ഞു’ എന്ന പ്രയോഗം ഈ സംഭവാത്മകത സ്വാഭാവികമായി നൽകുന്നു; ‘അപ്പോൾ’ ആഖ്യാനതുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: φωνὴ
  choice: ഒരു ശബ്ദം
  rationale: വെളിപ്പാടുസന്ദർഭത്തിൽ ഇത് വെറും ശബ്ദമല്ല, വ്യക്തമായി സംസാരിക്കുന്ന ശബ്ദമാണ്.
- source_word: πρὸς αὐτόν
  choice: അവനോട്
  rationale: സംസാരത്തിന്റെ ദിശയും അഭിസംബോധനയും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ἀναστάς
  choice: എഴുന്നേറ്റ്
  rationale: ഈ എയോറിസ്റ്റ് കൃതന്തം തുടർന്നുള്ള ആജ്ഞകളോടൊപ്പം ആജ്ഞാത്മക ക്രമം വഹിക്കുന്നു. ‘എഴുന്നേറ്റ്’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: Πέτρε
  choice: പത്രോസേ
  rationale: Πέτρος എന്ന പേരിന്റെ മലയാള ബൈബിൾപരമ്പരയിലെ സാധാരണ രൂപമായ ‘പത്രോസ്’ എന്നതിന്റെ സംബോധനരൂപം.
- source_word: θῦσον
  choice: അറുത്ത്
  rationale: ഇവിടെ മൃഗങ്ങളെ ഭക്ഷണത്തിനായി കൊല്ലുക എന്ന പ്രായോഗിക അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു. ‘അറുക്കുക’ മൃഗത്തെ ഭക്ഷണത്തിനായി കൊല്ലുന്നതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ബലിയർപ്പണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: φάγε
  choice: തിന്നുക
  rationale: നേരിട്ടുള്ള ആജ്ഞ. മൃഗമാംസം ഭക്ഷിക്കുന്ന സന്ദർഭത്തിൽ ‘തിന്നുക’ സാധാരണവും വ്യക്തവുമായ മലയാളമാണ്.
- source_word: καὶ
  choice: അപ്പോൾ / -റ്റ്
  rationale: ആദ്യ καί ആഖ്യാനതുടർച്ചയായി ‘അപ്പോൾ’ കൊണ്ട് സ്വാഭാവികമാക്കി; θῦσον καὶ φάγε എന്ന ആജ്ഞാക്രമം ‘അറുത്ത് തിന്നുക’ എന്ന മലയാള ക്രിയാശൃംഖലയിലൂടെ പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: θῦσον എന്ന ക്രിയയ്ക്ക് ബലിയർപ്പണഭാഷ നൽകണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘അറുത്ത്’
  alternative: ‘ബലിയർപ്പിച്ച്’
  rationale: ദർശനത്തിന്റെ ഉടൻസന്ദർഭം മൃഗങ്ങളെ ഭക്ഷിക്കാൻ തയ്യാറാക്കുന്നതാണ്; ആരാധനാപരമായ യാഗം നിർവഹിക്കാനുള്ള ആജ്ഞയല്ല. എങ്കിലും θύωയ്ക്ക് ‘ബലിയർപ്പിക്കുക’ എന്ന അർഥമുണ്ടാകുന്നതിനാൽ ആ യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘പത്രോസേ’ എന്ന സംബോധനരൂപവും ‘അറുത്ത് തിന്നുക’ എന്ന സ്വാഭാവിക ക്രിയാശൃംഖലയും ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് സൂചകം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
