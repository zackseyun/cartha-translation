source:
  edition: SBLGNT
  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: ml
  text: 'വീണ്ടും, രണ്ടാമതും, ഒരു ശബ്ദം അവനോടു പറഞ്ഞു: “ദൈവം ശുദ്ധമാക്കിയവയെ നീ സാധാരണമെന്ന് വിളിക്കരുത്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അപവിത്രമായി കരുതരുത്” അല്ലെങ്കിൽ “അശുദ്ധമെന്നു വിളിക്കരുത്.” ഇവിടെ “സാധാരണം” സാധാരണ അർഥത്തിലുള്ളതല്ല; ആചാരപരമായ ശുദ്ധി-അശുദ്ധി സംബന്ധിച്ച ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ഒരു ശബ്ദം
  rationale: ഗ്രീക്കിൽ അനാർത്രസ് ആയ നാമം; സംസാരിക്കുന്നയാളെ ഒരു പദവിയാൽ തിരിച്ചറിയുന്നതിലുപരി വീണ്ടും കേട്ട സ്വർഗീയ അരുളപ്പാടിലാണ് ഊന്നൽ.
- source_word: πάλιν ἐκ δευτέρου
  choice: വീണ്ടും, രണ്ടാം പ്രാവശ്യം
  rationale: ഗ്രീക്കിലെ ഭാഗികമായി ആവർത്തനാത്മകവും ഊന്നലുള്ളതുമായ രണ്ട് ഘടകങ്ങളും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς αὐτόν
  choice: അവനോടു പറഞ്ഞു
  rationale: പത്രോസിനെ അഭിസംബോധന ചെയ്ത വാക്ക് എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘പറഞ്ഞു’ എന്നത് സന്ദർഭത്തിൽ നിന്ന് പൂരിപ്പിക്കപ്പെടുന്നു.
- source_word: Ἃ
  choice: …വയെ
  rationale: നപുംസകലിംഗ ബഹുവചന സംബന്ധസർവനാമത്തിന്റെ പൊതുവായ, സമുച്ചയപരമായ അർഥം മലയാളത്തിലെ ബഹുവചന കർമപ്രത്യയംകൊണ്ട് കൈമാറുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: ഏകസത്യദൈവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἐκαθάρισεν
  choice: ശുദ്ധമാക്കിയ
  rationale: ദൈവത്തിന്റെ നിർണായകമായ പ്രവൃത്തിയും ആചാരശുദ്ധിയുടെ അനുരണനവും വ്യക്തവും സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: σὺ
  choice: നീ
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: μὴ κοίνου
  choice: അശുദ്ധമായി കണക്കാക്കരുത്
  rationale: κοινόω ഇവിടെ ശുദ്ധി-അശുദ്ധി വിഭാഗത്തിൽ ‘സാധാരണ/അപവിത്രം എന്നു വിധിക്കുക, അശുദ്ധമായി കരുതുക’ എന്ന അർഥത്തിലാണ്. അക്ഷരാർഥത്തിലുള്ള ‘സാധാരണമെന്നു വിളിക്കരുത്’ മലയാളത്തിൽ ആശയം തെറ്റിദ്ധരിപ്പിക്കാം; ഈ രൂപം വിലയിരുത്തലിനെ സൂചിപ്പിക്കുമ്പോൾ പദത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ ദർശനത്തിലെ ശുദ്ധി-ഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘അശുദ്ധമായി കണക്കാക്കരുത്’ എന്നു നൽകി, κοινόω-യുടെ ‘സാധാരണ/അപവിത്രം’ എന്ന പ്രത്യേക ശുദ്ധിവർഗ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
  alternative: ‘സാധാരണമെന്ന് വിളിക്കരുത്’ അല്ലെങ്കിൽ ‘അപവിത്രമായി കരുതരുത്.’
  rationale: καθαρίζω-യും κοινόω-യും തമ്മിലുള്ള വൈരുധ്യം മായ്ച്ചുകളയാതെ, ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ വാക്യത്തിന്റെ ഉദ്ദേശം കൈമാറുന്നു. ‘അശുദ്ധം’ ἀκάθαρτος-നോട് കൂടുതൽ നേരിട്ട് ഒത്തുപോകുന്നതിനാൽ അതിന്റെ വ്യാഖ്യാനാത്മക സ്വഭാവവും അടിക്കുറിപ്പിൽ വെളിപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തന ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു; ശുദ്ധി-അശുദ്ധി സംബന്ധമായ സാങ്കേതിക സൂക്ഷ്മത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
