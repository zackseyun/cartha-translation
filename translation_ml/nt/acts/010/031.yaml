id: ACT.10.31
reference: Acts 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “കൊർന്നേല്യൊസേ, നിന്റെ പ്രാർഥന കേൾക്കപ്പെട്ടിരിക്കുന്നു; നിന്റെ ദാനധർമങ്ങൾ ദൈവസന്നിധിയിൽ ഓർക്കപ്പെട്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησί
  choice: അവൻ പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ആഖ്യാനപരമായ വർത്തമാനകാലമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനശൈലിക്ക് ഭൂതകാലം യോജിക്കുന്നു.
- source_word: Κορνήλιε
  choice: കൊർന്നേല്യൊസേ
  rationale: വ്യക്തിനാമം ഗ്രീക്ക് ഉച്ചാരണത്തോട് ചേർന്ന് ലിപ്യന്തരം ചെയ്തു; സംബോധനരൂപം നിലനിർത്തി.
- source_word: εἰσηκούσθη
  choice: കേൾക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പ്രാർഥനയ്ക്ക് ദൈവസന്നിധിയിൽ ശ്രവണം ലഭിച്ചതെന്ന കർമണിപ്രയോഗവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും നിലനിർത്തുന്നു.
- source_word: προσευχὴ
  choice: പ്രാർഥന
  rationale: ഏകവചനം നിലനിർത്തുന്ന സാധാരണവും വ്യക്തവുമായ മലയാള പദം.
- source_word: ἐλεημοσύναι
  choice: ദാനധർമങ്ങൾ
  rationale: ആവശ്യത്തിലിരിക്കുന്നവരോടുള്ള കരുണാപൂർവമായ കൊടുക്കലുകളെയും സഹായപ്രവൃത്തികളെയും സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗം.
- source_word: ἐμνήσθησαν
  choice: ഓർക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ദൈവിക അംഗീകാരത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾസംബന്ധമായ ‘ഓർക്കുക’ എന്ന ഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും പരിഗണനയിലും എന്ന ആശയം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: കൊർന്നേല്യൊസിന്റെ കരുണാപൂർവമായ കൊടുക്കലുകളുടെ അർഥം
  choice: ἐλεημοσύναι എന്നത് ‘ദാനധർമങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ഭിക്ഷാദാനങ്ങൾ; കാരുണ്യപ്രവൃത്തികൾ; ധർമ്മദാനങ്ങൾ
  rationale: പദം ആവശ്യത്തിലിരിക്കുന്നവർക്കുള്ള യാഥാർഥ്യമായ സഹായവും കൊടുക്കലും സൂചിപ്പിക്കുന്നു. എന്നാൽ ഈ വാക്യം പ്രതിഫലാർഹമായ പുണ്യമോ രക്ഷയുടെ മാർഗമോ നിർവചിക്കുന്നില്ല; അതിനാൽ അത്തരം സിദ്ധാന്തനിഗമനങ്ങൾ ചേർത്തിട്ടില്ല.
- issue: ദൈവിക ഓർമയുടെ ഭാഷ
  choice: ‘ദൈവസന്നിധിയിൽ ഓർക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ബൈബിൾസംബന്ധമായ പ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവം ശ്രദ്ധിച്ചിരിക്കുന്നു; ദൈവം കണക്കിലെടുത്തിരിക്കുന്നു
  rationale: ‘ഓർക്കുക’ എന്ന മൂലഭാഷയിലെ ഗൗരവവും ബന്ധപരമായ അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു; അതിനെ വെറും ശ്രദ്ധിക്കൽ എന്നാക്കി ചുരുക്കുകയോ രക്ഷയുടെയും പുണ്യത്തിന്റെയും സംവിധാനം വിശദീകരിക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ രണ്ടു കർമണിപ്രയോഗങ്ങളും ഏകവചനമായ ‘പ്രാർഥന’യും ബഹുവചനമായ ‘ദാനധർമങ്ങൾ’ എന്നതും സംരക്ഷിച്ചു.
