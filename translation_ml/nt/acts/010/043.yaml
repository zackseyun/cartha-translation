id: ACT.10.43
reference: Acts 10:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: ml
  text: അവനിൽ വിശ്വസിക്കുന്ന ഏവനും അവന്റെ നാമത്തിലൂടെ പാപമോചനം പ്രാപിക്കുന്നു എന്ന് എല്ലാ പ്രവാചകന്മാരും അവനെക്കുറിച്ച് സാക്ഷ്യപ്പെടുത്തുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: അവനെക്കുറിച്ച്
  rationale: μαρτυροῦσιν എന്ന ക്രിയയോടു ചേർന്ന ദത്തിവ് ഇവിടെ യേശുവിനെ സംബന്ധിച്ചുള്ള സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘അവനെക്കുറിച്ച്’ എന്നത് സ്വാഭാവികവും സന്ദർഭസൂചകവുമാണ്.
- source_word: πάντες οἱ προφῆται
  choice: എല്ലാ പ്രവാചകന്മാരും
  rationale: പ്രവാചകസാക്ഷ്യത്തിന്റെ സമഗ്രത നേരിട്ട് നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: μαρτυροῦσιν
  choice: സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: തെളിവുനൽകുന്ന സാക്ഷ്യത്തിന്റെ ഭാവം നിലനിർത്തുകയും ആധുനിക മാനക മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: പാപമോചനം
  rationale: പുതിയനിയമത്തിലെ ഈ സ്ഥിരപ്രയോഗത്തിന്റെ ബന്ധപരവും ന്യായപരവുമായ അർഥം സംക്ഷിപ്തമായി അറിയിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: λαβεῖν
  choice: പ്രാപിക്കുന്നു
  rationale: പ്രവാചകന്മാരുടെ സാക്ഷ്യത്തിന്റെ ഉള്ളടക്കമായ infinitive മലയാളത്തിൽ പൊതുസത്യത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ക്രിയയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: അവന്റെ നാമത്തിലൂടെ
  rationale: യേശുവിന്റെ വ്യക്തിയെയും അധികാരത്തെയും ആധാരമാക്കിയ മാധ്യസ്ഥ്യം സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനവിസ്താരം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: πάντα τὸν πιστεύοντα
  choice: വിശ്വസിക്കുന്ന ഏവനും
  rationale: ഏകവചന പുംലിംഗ കൃദന്തത്തിന്റെ പൊതുവായതും വിതരണാത്മകവുമായ വ്യാപ്തി ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ കൃത്യമായി നൽകുന്നു.
- source_word: εἰς αὐτόν
  choice: അവനിൽ
  rationale: πιστεύω + εἰς വ്യക്തിയിലേക്കു നയിക്കപ്പെട്ട വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു; ‘അവനിൽ വിശ്വസിക്കുക’ മലയാളത്തിലെ സ്വാഭാവിക സമതുല്യമാണ്.
theological_decisions:
- issue: പാപമോചനത്തിന്റെ വ്യാപ്തിയും നിബന്ധനയും
  choice: അവനിൽ വിശ്വസിക്കുന്ന ഏവനും യേശുവിന്റെ നാമത്തിലൂടെ പാപമോചനം പ്രാപിക്കുന്നു എന്ന വാചകബന്ധം അതേപടി നിലനിർത്തി.
  alternative: രക്ഷയുടെ പ്രവർത്തനരീതിയെക്കുറിച്ചുള്ള കൂടുതൽ ശക്തമായ സിദ്ധാന്തപരമായ പരാവർത്തനം.
  rationale: യേശു, വിശ്വാസം, പാപമോചനം എന്നിവ തമ്മിലുള്ള ഗ്രീക്കുവാചകം വ്യക്തമാക്കുന്ന ബന്ധം മാത്രം പരിഭാഷപ്പെടുത്തുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: പൊതുവാചകമായ പുംലിംഗ കൃദന്തം
  choice: വിശ്വസിക്കുന്ന ഏവനും
  alternative: വിശ്വസിക്കുന്ന ഓരോ പുരുഷനും
  rationale: ഗ്രീക്കിലെ പുംലിംഗ ഏകവചന കൃദന്തം പുരുഷന്മാർക്കു മാത്രമല്ല, ഓരോ വിശ്വാസിയെയും പൊതുവായി സൂചിപ്പിക്കുന്നതാണ്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യക്രമം ഉപയോഗിച്ചു. ‘നാമത്തിലൂടെ’, ‘പാപമോചനം’, ‘സാക്ഷ്യപ്പെടുത്തുന്നു’ എന്നീ ബൈബിൾപരമായി പരിചിതമായ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രീതിയിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് കുറിപ്പിലെ ‘testify / bear witness’ എന്നത് യഥാർത്ഥത്തിൽ τούτῳ എന്ന പദത്തിന്റെ പകരംവായനയല്ലാത്തതിനാൽ തെറ്റിദ്ധരിപ്പിക്കുന്ന അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
