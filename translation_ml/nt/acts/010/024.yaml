- source_word: τῇ δὲ ἐπαύριον
  choice: അടുത്ത ദിവസം
  rationale: ലേഖനത്തോടുകൂടിയ ἐπαύριον അടുത്ത അഥവാ തുടർന്നുള്ള ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക കാലപ്രയോഗമാണ്; δέ ഇവിടെ കഥയുടെ തുടർച്ച മാത്രം അടയാളപ്പെടുത്തുന്നു.
- source_word: εἰσῆλθεν
  choice: അവൻ ... പ്രവേശിച്ചു
  rationale: ക്രിയ ഏകവചനത്തിലാണ്; അതിനാൽ പത്രോസിനെ മുഖ്യകഥാപാത്രമായി മുൻനിർത്തുന്ന ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു.
- source_word: Καισάρειαν
  choice: കൈസര്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള, ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്ത ലിപ്യന്തരണം.
- source_word: ὁ δὲ Κορνήλιος
  choice: കൊർന്നേല്യോസ്
  rationale: δέ ശ്രദ്ധ കൊർന്നേല്യോസിലേക്കു മാറ്റുന്ന മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമം തന്നെ ആ മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നതിനാൽ പ്രത്യേക വിരോധസൂചകം ചേർത്തിട്ടില്ല.
- source_word: ἦν προσδοκῶν αὐτούς
  choice: അവരെ പ്രതീക്ഷിച്ചുകൊണ്ട്
  rationale: പര്യസ്ത അപൂർണകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്നു; αὐτούς ബഹുവചനമായതിനാൽ ‘അവരെ’ എന്ന് നിലനിർത്തുന്നു.
- source_word: συγκαλεσάμενος
  choice: വിളിച്ചുകൂട്ടിയിരുന്നു
  rationale: പ്രധാന സാഹചര്യത്തിനു മുമ്പേ നടന്ന പ്രവർത്തനത്തെ മലയാളത്തിലെ പൂർവകാലസമ്പൂർണരൂപം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: തന്റെ ബന്ധുക്കളെ
