  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: ml
  text: അടുത്ത ദിവസം അവൻ കൈസര്യയിൽ പ്രവേശിച്ചു.[a] കൊർന്നേല്യോസ് അവരെ പ്രതീക്ഷിച്ചുകൊണ്ടിരുന്നു. തന്റെ ബന്ധുക്കളെയും അടുത്ത സുഹൃത്തുക്കളെയും അദ്ദേഹം വിളിച്ചുകൂട്ടിയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘പ്രവേശിച്ചു’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; എന്നാൽ തുടർന്ന് ‘അവരെ’ എന്ന ബഹുവചന സർവനാമം വരുന്നു. പത്രോസിനെ പ്രധാന വ്യക്തിയായി മുൻനിർത്തിക്കൊണ്ട്, കൊർന്നേല്യോസ് പ്രതീക്ഷിച്ചവരിൽ അദ്ദേഹത്തിന്റെ സഹയാത്രികരെയും ഉൾപ്പെടുത്തിയതാകാം ഇത്.
    reason: textual_variant
