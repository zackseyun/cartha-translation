  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: ml
  text: യോഹന്നാൻ പ്രസംഗിച്ച സ്നാനത്തിനുശേഷം ഗലീലയിൽ ആരംഭിച്ച്[b], യൂദ്യയിലുടനീളം നടന്ന കാര്യം[a] നിങ്ങൾ തന്നെ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നടന്ന കാര്യം’ എന്നതിന് ‘യൂദ്യയിലാകെ പരന്ന വാക്ക്’ അല്ലെങ്കിൽ ‘സന്ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം. ῥῆμα എന്ന ഗ്രീക്ക് പദത്തിന് ‘വാക്ക്,’ ‘സന്ദേശം,’ ‘കാര്യം’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ആരംഭിച്ച്’ എന്ന ഗ്രീക്ക് participle വ്യാകരണപരമായി അല്പം അയഞ്ഞതാണ്; എങ്കിലും ആ കാര്യം ഗലീലയിൽ ആരംഭിച്ചതാണ് ഉദ്ദേശ്യമെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ
  rationale: അനാവശ്യമായിട്ടും പ്രത്യേകം നൽകിയിരിക്കുന്ന ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; οἴδατε-യുടെ വർത്തമാനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ γενόμενον ῥῆμα
  choice: സംഭവിച്ച കാര്യം
  rationale: ῥῆμαയ്ക്ക് ‘വാക്ക്,’ ‘സന്ദേശം,’ ‘കാര്യം’ എന്നീ അർഥങ്ങൾ വരാം. γενόμενον-നോടും സന്ദർഭത്തോടും ചേർന്ന് ഇവിടെ യേശുവിനെക്കുറിച്ചുള്ള പരസ്യ സംഭവങ്ങളും അവയെക്കുറിച്ചുള്ള സന്ദേശവും ഉൾക്കൊള്ളുന്ന ‘കാര്യം’ സ്വാഭാവികമാണ്.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: യെഹൂദ്യയിൽ എല്ലായിടത്തും
  rationale: κατά + genitive പ്രദേശമാകെയുള്ള വ്യാപ്തി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ സമഗ്രത ഈ പ്രയോഗം നൽകുന്നു.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: ഗലീലയിൽ ആരംഭിച്ച്
  rationale: ἀπό ആരംഭസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഗലീലയിൽ ആരംഭിച്ച്’ എന്നത് അർഥം വ്യക്തമായി നൽകുകയും ഗ്രീക്കിലെ അയഞ്ഞ participial ഘടനയെ അമിതമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μετὰ τὸ βάπτισμα
  choice: സ്നാനത്തിനുശേഷം
  rationale: μετά + accusative ഇവിടെ കാലക്രമം സൂചിപ്പിക്കുന്നു. ‘സ്നാനം’ സഭാപരമായ പ്രചാരമുള്ളതും സന്ദർഭത്തിൽ വ്യക്തവുമായ പദമാണ്.
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: യോഹന്നാൻ പ്രസംഗിച്ച
  rationale: κηρύσσω-യുടെ പരസ്യ പ്രഖ്യാപനഭാവം ‘പ്രസംഗിച്ച’ സ്വാഭാവികമായി നൽകുന്നു; ὃ βάπτισμα-ത്തെ വിശേഷിപ്പിക്കുന്നതായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ സംഗ്രഹത്തിലെ ῥῆμα എന്ന പദത്തിന്റെ അർഥം
  choice: ‘കാര്യം’ എന്ന് പരിഭാഷപ്പെടുത്തി; യേശുവിനെക്കുറിച്ചുള്ള പ്രസിദ്ധമായ സംഭവ-സന്ദേശ സമുച്ചയം ഉൾക്കൊള്ളുന്നു.
  alternative: ‘വാക്ക്’ അല്ലെങ്കിൽ ‘സന്ദേശം’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തിയും സംഭവിക്കുക എന്ന ക്രിയയും ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തിയും കണക്കിലെടുക്കുമ്പോൾ ‘കാര്യം’ സന്ദർഭത്തിന് യോജിക്കുന്നു; എന്നാൽ മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἀρξάμενος എന്ന participle-ന്റെ ബന്ധം
  choice: മുമ്പുള്ള ‘കാര്യം’ ഗലീലയിൽ ആരംഭിച്ചതായി സ്വാഭാവിക മലയാളക്രമത്തിൽ നൽകി.
  alternative: ‘അത് ആരംഭിച്ചു’ എന്ന് വ്യക്തമായി ചേർക്കുക, അല്ലെങ്കിൽ participle-നെ മറ്റൊരു പരോക്ഷ കർത്താവിനോട് ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്കിൽ masculine participle-നും neuter ῥῆμα-ക്കും ഇടയിൽ വ്യാകരണപരമായ അയവ് ഉണ്ട്. അർഥം വ്യക്തമായതിനാൽ പുതിയ കർത്താവിനെ ചേർക്കാതെ കാല-സ്ഥലാരംഭം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ വിവരക്രമം മലയാളത്തിന് അനുയോജ്യമായി മാറ്റിയെങ്കിലും ഗ്രീക്കിലെ ഊന്നൽ, കാലക്രമം, ഭൂമിശാസ്ത്രപരമായ വ്യാപ്തി, വ്യാകരണപരമായ അയവ് എന്നിവ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
