  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: ml
  text: യേശു മശീഹായിലൂടെ[b] സമാധാനസുവാർത്ത അറിയിച്ചുകൊണ്ട് അവൻ ഇസ്രായേൽമക്കൾക്ക്[a] അയച്ച സന്ദേശം—ഈ യേശുവാണ്[c] എല്ലാവരുടെയും കർത്താവ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർക്ക്.’ ഈ പ്രയോഗം ഇസ്രായേൽജനത്തെ മൊത്തമായി സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ‘യേശു ക്രിസ്തുവിലൂടെ’; Χριστός ഇവിടെ ഒരു പദവിയായതിനാൽ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: c
    text: 'ഗ്രീക്കിൽ ഊന്നലുള്ള നിർദ്ദേശസർവനാമമാണ്: ‘ഇവനാണ് എല്ലാവരുടെയും കർത്താവ്’ എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: സന്ദേശം
  rationale: ഇവിടെ λόγος എന്നത് ഒറ്റ വാക്കിനെയല്ല, ദൈവം ഇസ്രായേലിന് അറിയിച്ച സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὃν ἀπέστειλεν
  choice: അവൻ … അയച്ച
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു; ചുറ്റുപാടനുസരിച്ച് കർത്താവ് ദൈവമാണ്.
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: ഇസ്രായേൽമക്കൾക്ക്
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സെമിറ്റിക് പ്രയോഗത്തെ അതിന്റെ സമൂഹപരമായ അർഥവും ബൈബിൾഭാഷയുടെ ഗൗരവവും നിലനിർത്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εὐαγγελιζόμενος εἰρήνην
  choice: സമാധാനത്തിന്റെ സുവിശേഷം അറിയിച്ചുകൊണ്ട്
  rationale: εὐαγγελίζομαι എന്ന ക്രിയയിലെ ‘സുവാർത്ത അറിയിക്കുക’ എന്ന ഭാവവും εἰρήνη എന്ന ഉള്ളടക്കവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായിലൂടെ
  rationale: διά ഏജൻസിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യിലൂടെ’ എന്നു നൽകി; Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായതിനാൽ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: οὗτός
  choice: ഈ യേശുവാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള നിർദ്ദേശസർവനാമത്തിന്റെ ബലം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുകയും അതിന്റെ പ്രതിപാദ്യം യേശുവാണെന്നത് ആശയക്കുഴപ്പമില്ലാതെ കാണിക്കുകയും ചെയ്യുന്നു.
- source_word: πάντων κύριος
  choice: എല്ലാവരുടെയും കർത്താവ്
  rationale: സാർവത്രികമായ കർത്തൃത്വം നേരിട്ട് പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമായ രൂപം.
theological_decisions:
- issue: Χριστοῦ എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός ഒരു പേരിന്റെ ഭാഗമായി മാത്രം അല്ല, അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അർഥം വിവർത്തനം ചെയ്തു.
- issue: κύριος എന്നതിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: യേശുവിന്റെ സാർവത്രിക അധികാരത്തെക്കുറിച്ചുള്ള ഈ പ്രസ്താവനയിൽ ‘കർത്താവ്’ മൂലപദത്തിന്റെ അധികാരവും ദൈവശാസ്ത്രപരമായ ഭാരവും കൂടുതൽ നന്നായി നിലനിർത്തുന്നു.
- issue: οὗτός എന്ന ഊന്നലിന്റെ സംരക്ഷണം
  choice: ഈ യേശുവാണ്
  alternative: അവൻ
  rationale: സാധാരണ സർവനാമം ഉപയോഗിച്ചാൽ ഗ്രീക്കിലെ ഊന്നൽ നഷ്ടപ്പെടും; ‘ഈ യേശുവാണ്’ എന്നത് പുതിയ ആശയം ചേർക്കാതെ പ്രതിപാദ്യത്തെയും ഊന്നലിനെയും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലവാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന ഒരു വാക്യഖണ്ഡമായതിനാൽ അതിന്റെ ഖണ്ഡസ്വഭാവം അനാവശ്യമായി പൂർണ്ണവാക്യമാക്കി മാറ്റിയിട്ടില്ല. ദീർഘമായ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി പദക്രമം മാറ്റിയെങ്കിലും സന്ദേശം, അയച്ചവൻ, സ്വീകർത്താക്കൾ, സമാധാനപ്രഖ്യാപനം, യേശുവിന്റെ സാർവത്രിക കർത്തൃത്വം എന്നീ ബന്ധങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
