id: ACT.10.42
reference: Acts 10:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: ml
  text: ജനത്തോടു പ്രസംഗിക്കാനും, ജീവനുള്ളവരുടെയും മരിച്ചവരുടെയും ന്യായാധിപനായി ദൈവം നിയമിച്ചിരിക്കുന്നത് ഇവനെയാണെന്ന് ഗൗരവപൂർവം സാക്ഷ്യം പറയാനും അവൻ ഞങ്ങളോടു കല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ജീവനുള്ളവരുടെയും മരിച്ചവരുടെയും ന്യായാധിപനായി ദൈവം നിശ്ചയിച്ചിരിക്കുന്നത് ഇവനെയാണ്.’
    reason: ὁρίζω എന്ന പദത്തിന് ‘നിയമിക്കുക’ എന്നും ‘നിശ്ചയിക്കുക’ എന്നും നൽകാവുന്ന അടുത്ത അർഥവികല്പം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: παρήγγειλεν
  choice: കല്പിച്ചു
  rationale: ആധികാരികമായ ചുമതല ഏൽപ്പിക്കുന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κηρύξαι
  choice: പ്രസംഗിക്കാൻ
  rationale: പൊതുവായി പ്രഖ്യാപിക്കുക എന്ന κηρύσσωയുടെ ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കേവലം സ്വകാര്യമായി അറിയിക്കുക എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τῷ λαῷ
  choice: ജനത്തോട്
  rationale: വാക്യത്തിൽ ഇസ്രായേൽ എന്ന് വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ സന്ദർഭപരമായ സൂചന വികസിപ്പിക്കാതെ മൂലത്തിലെ ‘ജനത്തിന്’ എന്ന രൂപം പാലിക്കുന്നു.
- source_word: διαμαρτύρασθαι
  choice: ഗൗരവപൂർവം സാക്ഷ്യം പറയാൻ
  rationale: സാക്ഷ്യത്തിന്റെ ഘടകവും ക്രിയ സൂചിപ്പിക്കുന്ന ശക്തമായ, ഗൗരവമേറിയ ഉറപ്പിച്ചുപറച്ചിലും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: οὗτός
  choice: ഇവനെയാണ്
  rationale: യേശുവിലേക്കു ഊന്നലോടെ വിരൽചൂണ്ടുന്ന നിർദേശകസർവനാമത്തിന്റെ ബലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὁ ὡρισμένος
  choice: നിയമിച്ചിരിക്കുന്നത്
  rationale: ὁρίζωയുടെ പൂർണ്ണ ഭൂതകാല കർമണി പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന ദൈവിക നിയമനവും അതിന്റെ തുടരുന്ന നിലയും ഈ രൂപം നൽകുന്നു.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: ദൈവം
  rationale: മലയാളത്തിലെ സ്വാഭാവിക കർത്തൃപ്രയോഗത്തിലൂടെ ദൈവമാണ് നിയമനത്തിന്റെ പ്രവർത്തകൻ എന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: κριτὴς
  choice: ന്യായാധിപനായി
  rationale: വിധി നിർവഹിക്കുന്ന അധികാരസ്ഥാനത്തെ കൃത്യവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ζώντων καὶ νεκρῶν
  choice: ജീവനുള്ളവരുടെയും മരിച്ചവരുടെയും
  rationale: രണ്ടു വിഭാഗങ്ങളുടെയും സമാന്തരതയും ന്യായവിധിയുടെ സർവവ്യാപക പരിധിയും മൂലപാഠത്തിന് അനുസൃതമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ന്യായവിധിക്കായി യേശുവിനെ ദൈവം നിയമിച്ചതിന്റെ സ്വഭാവം
  choice: ജീവനുള്ളവരുടെയും മരിച്ചവരുടെയും ന്യായാധിപനായി ദൈവം നിയമിച്ചിരിക്കുന്നത് ഇവനെയാണ്
  alternative: ജീവനുള്ളവരുടെയും മരിച്ചവരുടെയും ന്യായാധിപനായി ദൈവം നിശ്ചയിച്ചിരിക്കുന്നത് ഇവനെയാണ്
  rationale: ദൈവം യേശുവിനെ ന്യായാധിപനായി നിയമിച്ചുവെന്ന വാക്യത്തിന്റെ വ്യക്തമായ അവകാശവാദം സംരക്ഷിക്കുന്നു; പിന്നീടുള്ള സിദ്ധാന്തപരമായ വിശദീകരണങ്ങൾ ചേർക്കുന്നില്ല. ‘നിയമിച്ചിരിക്കുന്നത്’ എന്നത് പൂർത്തിയായ നിയമനവും തുടരുന്ന സ്ഥാനവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രസംഗിക്കുക’, ‘ഗൗരവപൂർവം സാക്ഷ്യം പറയുക’, ‘ന്യായാധിപൻ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ ഔദ്യോഗിക-സാക്ഷ്യഭാവം നിലനിർത്തുന്നതുമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
