  terminology: ‘പ്രസംഗിക്കുക,’ ‘ഗൗരവപൂർവം സാക്ഷ്യം പറയുക,’ ‘ന്യായാധിപൻ,’ ‘ദൈവം നിയമിച്ചിരിക്കുന്നത്’ എന്നിവ സന്ദർഭത്തിനും ഔപചാരിക സാക്ഷ്യ-രജിസ്റ്ററിനും യോജിക്കുന്നു. ‘നിയമിച്ചിരിക്കുന്നത്’ ὡρισμένος-ന്റെ നിയമനവും തുടരുന്ന പദവിയും അനുയോജ്യമായി അറിയിക്കുന്നു.
