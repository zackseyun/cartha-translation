  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: ml
  text: 'അവൻ അവരോടു പറഞ്ഞു: “ഒരു യെഹൂദപുരുഷൻ മറ്റൊരു ജനതയിൽപ്പെട്ട ഒരാളുമായി ഇടപഴകുകയോ അയാളെ സന്ദർശിക്കുകയോ ചെയ്യുന്നത് നിയമവിരുദ്ധമാണെന്ന് നിങ്ങൾക്കുതന്നെ അറിയാം. എന്നാൽ, ഒരു മനുഷ്യനെയും സാധാരണമെന്നോ[a] അശുദ്ധനെന്നോ വിളിക്കരുതെന്ന് ദൈവം എനിക്കു കാണിച്ചുതന്നിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സാധാരണം” എന്നത് κοινός എന്ന പദത്തിന്റെ പരിഭാഷയാണ്. ഇത് “അശുദ്ധം” (ἀκάθαρτος) എന്നതിൽനിന്ന് വ്യത്യസ്തമായ ശുദ്ധിചട്ടസംബന്ധമായ പദമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: അവൻ അവരോടു പറഞ്ഞു
  rationale: τέയുടെ ലഘുവായ ബന്ധകസ്വഭാവം മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകം പദമാക്കാതെ അവതരിപ്പിക്കുന്നു.
- source_word: Ὑμεῖς ἐπίστασθε
  choice: നിങ്ങൾക്കുതന്നെ അറിയാം
  rationale: പ്രകടമായ Ὑμεῖς നൽകുന്ന ഊന്നൽ ‘തന്നെ’കൊണ്ട് നിലനിർത്തുന്നു.
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: നിയമവിരുദ്ധമാണെന്ന്
  rationale: അനുവദനീയമല്ലാത്തതോ അംഗീകൃത നിയമത്തിനും ആചാരത്തിനും വിരുദ്ധമായതോ എന്ന ശക്തി നിലനിർത്തുന്നു; വെറും സാമൂഹിക അനൗചിത്യമാക്കി ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: ഒരു യെഹൂദപുരുഷൻ
  rationale: ഗ്രീക്കിലെ ഏകവചനവും വ്യക്തമായ പുല്ലിംഗരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: κολλᾶσθαι
  choice: സഹവസിക്കുക
  rationale: ചേർന്നുനിൽക്കുക, സമ്പർക്കം പുലർത്തുക എന്ന സാമൂഹിക അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἢ προσέρχεσθαι
  choice: അയാളുടെ അടുക്കൽ ചെല്ലുക
  rationale: ‘സമീപിക്കുക/അടുക്കൽ ചെല്ലുക’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുകയും സന്ദർഭത്തിലെ സന്ദർശനസൂചന ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: ἀλλοφύλῳ
  choice: മറ്റൊരു ജനതയിൽപ്പെട്ട ഒരാൾ
  rationale: ‘മറ്റൊരു ജനത്തിൽ/വംശത്തിൽപ്പെട്ടവൻ’ എന്ന നേരിട്ടുള്ള അർത്ഥം നൽകുന്നു; ‘വിജാതീയൻ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക മതപദം ഒഴിവാക്കുന്നു.
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: എന്നാൽ ... ദൈവം എനിക്കു കാണിച്ചുതന്നിരിക്കുന്നു
  rationale: κἀμοὶ അക്ഷരാർഥത്തിൽ ‘എനിക്കും/എനിക്കോ’ എന്നാണെങ്കിലും, മുൻധാരണയിൽനിന്നുള്ള വെളിപ്പാടിന്റെ വ്യത്യാസം മലയാളത്തിൽ ‘എന്നാൽ’കൊണ്ട് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വെളിപ്പാടിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പൂർത്തവർത്തമാനരൂപത്തിൽ നൽകുന്നു.
- source_word: μηδένα ... ἄνθρωπον
  choice: ഒരു മനുഷ്യനെയും
  rationale: ലിംഗപരമായി പൊതുവായ ἄνθρωπος ഇവിടെ ഏതൊരു മനുഷ്യവ്യക്തിയെയും സൂചിപ്പിക്കുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുന്നു.
- source_word: κοινὸν
  choice: സാധാരണം
  rationale: യഹൂദ ശുദ്ധി-അശുദ്ധി ഭാഷയിലെ ‘പൊതുവായത്/വിശുദ്ധ ഉപയോഗത്തിനായി വേർതിരിക്കാത്തത്’ എന്ന വിഭാഗം ἀκάθαρτος എന്നതിൽനിന്ന് വേർതിരിച്ചുനിർത്തുന്നു.
- source_word: ἢ ἀκάθαρτον
  choice: അശുദ്ധം
  rationale: ശുദ്ധി-അശുദ്ധി വിഭാഗത്തിലെ പതിവ് അർത്ഥം നൽകുകയും κοινός എന്ന പദവുമായി ലയിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യെഹൂദ അതിർത്തിനിയമഭാഷയും ദൈവിക വെളിപ്പാടും തമ്മിലുള്ള ബന്ധം
  choice: യെഹൂദപുരുഷന് ഈ സമ്പർക്കം നിയമവിരുദ്ധമായി കണക്കാക്കപ്പെട്ടിരുന്നുവെന്ന പത്രോസിന്റെ പ്രസ്താവനയും, ഒരു മനുഷ്യനെയും സാധാരണമെന്നോ അശുദ്ധനെന്നോ വിളിക്കരുതെന്ന ദൈവിക തിരുത്തലും അതേ ശക്തിയിൽ നിലനിർത്തി.
  alternative: ἀθέμιτον എന്നത് വെറും ‘അനുചിതം’ എന്നു ദുർബലപ്പെടുത്തുക, അല്ലെങ്കിൽ അവസാനത്തെ ശുദ്ധി-അശുദ്ധി വിഭാഗങ്ങളെ ഒരൊറ്റ പദത്തിൽ ലയിപ്പിക്കുക.
  rationale: വാക്യം ആദ്യം വേർതിരിവിനെക്കുറിച്ചുള്ള പത്രോസിന്റെ ധാരണ റിപ്പോർട്ട് ചെയ്യുകയും തുടർന്ന് ദൈവിക വെളിപ്പാട് അതിനെ മനുഷ്യരിലേക്കു ബാധകമായി തിരുത്തുകയും ചെയ്യുന്നു. വിവർത്തനം ആദ്യഭാഗത്തെ വെറും മര്യാദാപ്രശ്നമാക്കുകയോ ‘ഒരു മനുഷ്യനെയും’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി കുറയ്ക്കുകയോ ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘യെഹൂദപുരുഷൻ’ ഗ്രീക്കിലെ ലിംഗസൂചന നിലനിർത്തുന്നു; ‘മറ്റൊരു ജനതയിൽപ്പെട്ട ഒരാൾ’ ἀλλόφυλος എന്നതിന്റെ നേരിട്ടുള്ള അർത്ഥം നൽകുന്നു. പ്രധാനവാചകത്തിലെ [a] അടിക്കുറിപ്പ് ‘സാധാരണം/അശുദ്ധം’ എന്ന വ്യത്യാസം വിശദീകരിക്കുന്നു.
