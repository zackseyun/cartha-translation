    issue: “സഹവസിക്കുക” may suggest cohabitation.
    rationale: The Greek κολλᾶσθαι denotes associating or keeping company socially, not necessarily living together. “ഇടപഴകുക” avoids this unintended narrowing.
  - severity: low
    issue: Footnote marker is placed at the end of the sentence rather than on the term κοινός it explains.
    rationale: Placing the marker directly after “സാധാരണമെന്നോ” provides a clear lexical anchor.
