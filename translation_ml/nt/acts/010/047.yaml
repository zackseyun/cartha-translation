id: ACT.10.47
reference: Acts 10:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: ml
  text: “നമ്മെപ്പോലെ പരിശുദ്ധാത്മാവിനെ ലഭിച്ചിരിക്കുന്ന ഇവർ സ്നാനം ഏൽക്കാതിരിക്കേണ്ടതിന് വെള്ളം തടഞ്ഞുവെക്കാൻ ആർക്കെങ്കിലും കഴിയുമോ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നമ്മെപ്പോലെ പരിശുദ്ധാത്മാവിനെ ലഭിച്ചിരിക്കുന്ന ഇവർ സ്നാനം ഏൽക്കുന്നതു തടയാൻ ആർക്കെങ്കിലും കഴിയുമോ?”'
    reason: ‘വെള്ളം തടഞ്ഞുവെക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം, അതായത് ഇവർ സ്നാനം ഏൽക്കുന്നതു തടയുക, വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: Μήτι
  choice: ആർക്കെങ്കിലും കഴിയുമോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸ ὕδωρ
  choice: വെള്ളം
  rationale: സന്ദർഭത്തിൽ സ്നാനത്തിനുള്ള വെള്ളത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നിർദ്ദേശകത്വം പ്രത്യേക ഉപപദമില്ലാതെയും വ്യക്തമാണ്.
- source_word: δύναται κωλῦσαί τις
  choice: വിലക്കാൻ ആർക്കെങ്കിലും കഴിയുമോ
  rationale: κωλύω എന്നതിലെ ‘വിലക്കുക/തടയുക’ എന്ന അർഥവും δύναται ... τις എന്ന ചോദ്യഘടനയും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: ഇവർ സ്നാനം ഏൽക്കാതിരിക്കാൻ
  rationale: നിഷേധത്തോടുകൂടിയ articular infinitive ഇവിടെ സ്നാനം സംഭവിക്കുന്നത് തടയുന്നതിനെ സൂചിപ്പിക്കുന്നു; കർമണി ഭാവവും നിലനിർത്തുന്നു.
- source_word: οἵτινες
  choice: ഇവർ
  rationale: ബന്ധവാക്യം മലയാളത്തിലെ സ്വാഭാവിക മുൻവിശേഷണഘടനയിൽ അവതരിപ്പിക്കുന്നു; ഇവരെ തിരിച്ചറിയിക്കുന്നതോടൊപ്പം കാരണസൂചനയും സന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ആധുനിക മലയാളത്തിലെ മാന്യവും സ്ഥാപിതവുമായ ദൈവശാസ്ത്രപദം.
- source_word: ἔλαβον
  choice: ലഭിച്ചിരിക്കുന്ന
  rationale: ലഭിക്കൽ പൂർത്തിയായ സംഭവമാണെന്നും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി പത്രോസിന്റെ വാദത്തിൽ തുടരുന്നുവെന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς καὶ ἡμεῖς
  choice: നമ്മെപ്പോലെ
  rationale: അവർക്കും ‘നമുക്കും’ ഉണ്ടായ അനുഭവത്തെ തുലനാത്മകമായി സംക്ഷിപ്തവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവിനെ ലഭിച്ചതും ജലസ്നാനവും തമ്മിലുള്ള ബന്ധം
  choice: ഇവർ ഇതിനകം പരിശുദ്ധാത്മാവിനെ ലഭിച്ചിരിക്കുന്നതിനാൽ അവർക്കുള്ള ജലസ്നാനം തടയാനാകുമോ എന്നാണ് പത്രോസ് ചോദിക്കുന്നത്.
  alternative: ആത്മാവിനെ ലഭിച്ചതിന്റെ കാലക്രമപരമായ മുൻഗണന മങ്ങിക്കുന്ന വിവർത്തനം.
  rationale: ഗ്രീക്ക് വാക്യം ഈ വിവരണത്തിൽ ആത്മാവിനെ ലഭിച്ചത് ജലസ്നാനത്തിനു മുമ്പാണെന്ന് സൂചിപ്പിക്കുന്നു. ഏതെങ്കിലും സഭാപാരമ്പര്യത്തിന്റെ സക്രാമെന്റൽ വ്യാഖ്യാനം ചേർക്കാതെ ഈ വിവരണാത്മകവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളം; മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ ഏക അലങ്കാരചോദ്യഘടന സംരക്ഷിക്കുകയും വിശദീകരണബന്ധം വേറൊരു വാക്യമായി വിഭജിക്കാതിരിക്കുകയും ചെയ്തു.
