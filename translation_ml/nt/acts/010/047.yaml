revisions:
- from: “നമ്മെപ്പോലെ പരിശുദ്ധാത്മാവിനെ ലഭിച്ചിരിക്കുന്ന ഇവർ സ്നാനം ഏൽക്കാതിരിക്കാൻ വെള്ളം വിലക്കാൻ ആർക്കെങ്കിലും കഴിയുമോ?”[a]
  to: “നമ്മെപ്പോലെ പരിശുദ്ധാത്മാവിനെ ലഭിച്ചിരിക്കുന്ന ഇവർ സ്നാനം ഏൽക്കാതിരിക്കേണ്ടതിന് വെള്ളം തടഞ്ഞുവെക്കാൻ ആർക്കെങ്കിലും കഴിയുമോ?”[a]
