source:
  edition: SBLGNT
  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: ml
  text: 'അപ്പോൾ പത്രോസ് വായ് തുറന്ന് പറഞ്ഞു: “ദൈവം പക്ഷപാതം കാണിക്കുന്നവനല്ലെന്ന് ഞാൻ സത്യമായും[a] മനസ്സിലാക്കുന്നു.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സത്യമായും ഞാൻ ഗ്രഹിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “മുഖം നോക്കുന്നവനല്ല”; അതായത്, വ്യക്തിയുടെ നിലയോ പശ്ചാത്തലമോ നോക്കി അനുകൂലമോ പ്രതികൂലമോ ആയി പക്ഷപാതം കാണിക്കുന്നവനല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: വായ് തുറന്ന് പറഞ്ഞു
  rationale: ഔപചാരികവും ഗൗരവമുള്ളതുമായ പ്രസ്താവനയ്ക്ക് തുടക്കം കുറിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദൃശ്യഭാവവും വാചകശക്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ കഥയുടെ തുടർച്ചയും അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കവും സൂചിപ്പിക്കുന്നു.
- source_word: Ἐπ’ ἀληθείας
  choice: സത്യമായി
  rationale: പത്രോസിന്റെ തിരിച്ചറിവിന്റെ ആത്മാർഥതയും ഉറപ്പും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καταλαμβάνομαι
  choice: ഞാൻ ... മനസ്സിലാക്കുന്നു
  rationale: സന്ദർഭത്തിൽ പത്രോസ് ഇപ്പോൾ ഗ്രഹിച്ചുകൊണ്ടിരിക്കുന്ന യാഥാർഥ്യത്തെ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത ‘ഇപ്പോൾ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: προσωπολήμπτης
  choice: പക്ഷപാതം കാണിക്കുന്നവൻ
  rationale: വ്യക്തിയുടെ മുഖമോ നിലയോ നോക്കി അനുകൂലമായി പെരുമാറുന്നവൻ എന്ന നാമപദത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ പതിവും സ്വാഭാവികവുമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: ദൈവത്തിന്റെ നിഷ്പക്ഷതയെക്കുറിച്ചുള്ള പ്രസ്താവനയിൽ പിന്നീടുള്ള സിദ്ധാന്തപരമായ വിശദീകരണം ഇറക്കുമതി ചെയ്യാതിരിക്കുക
  choice: ദൈവം പക്ഷപാതം കാണിക്കുന്നവനല്ല
  alternative: ദൈവം ആരുടെയും മുഖം നോക്കുന്നവനല്ല / ദൈവം പക്ഷഭേദം കാണിക്കുന്നില്ല
  rationale: മൂലത്തിലെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമപദസ്വഭാവം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട്, ദൈവം ജനങ്ങളുടെ പശ്ചാത്തലമോ നിലയോ നോക്കി പക്ഷപാതം കാണിക്കുന്നില്ലെന്ന അവകാശവാദം വ്യക്തമായി പറയുന്നു; തുടർന്നുള്ള വാക്യങ്ങളുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വായ് തുറന്ന് പറഞ്ഞു’ എന്ന മൂലഭാഷാപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികമാകാതെ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കുശേഷം ക്രമത്തിൽ ചേർത്തിരിക്കുന്നു.
