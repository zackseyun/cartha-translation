source:
  edition: SBLGNT
  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: ml
  text: 'കാരണം, അവർ ഭാഷകളിൽ[a] സംസാരിക്കുകയും ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുകയും ചെയ്യുന്നത് അവർ കേട്ടുകൊണ്ടിരുന്നു. അപ്പോൾ പത്രോസ് മറുപടി പറഞ്ഞു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നാവുകളിൽ.” ഗ്രീക്ക് പദത്തിന് “നാവുകൾ” എന്നും “ഭാഷകൾ” എന്നും അർഥമാകാം; ഇവിടെ സംസാരത്തിന്റെ സ്വഭാവം തീർപ്പാക്കാതെ ഈ പ്രയോഗം വിശാലമായി നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: കേട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന ശ്രവണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കേട്ടുകൊണ്ടിരുന്നു’ ആ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: വാക്യസന്ദർഭത്തിലെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: γάρ മുൻവാക്യത്തിനുള്ള വിശദീകരണകാരണം നൽകുന്നു. എന്നാൽ ഒറ്റപ്പെട്ട ഈ വാക്യത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് മലയാളത്തിൽ കൃത്രിമമായി തോന്നുന്നതിനാൽ ബന്ധം വാക്യക്രമത്തിലൂടെ സൂക്ഷിച്ചു.
- source_word: αὐτῶν
  choice: അവർ … സംസാരിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ സർവനാമത്തിന്റെ മുൻസന്ദർഭപരമായ സൂചന നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്ന വ്യാഖ്യാനനാമം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- source_word: λαλούντων
  choice: സംസാരിക്കുകയും
  rationale: λαλέω എന്നതിന്റെ സാധാരണവും സ്വാഭാവികവുമായ മലയാളസമം; μεγαλυνόντων എന്ന സമാന്തര കൃതന്തവുമായി ഏകോപിപ്പിച്ചു.
- source_word: γλώσσαις
  choice: അന്യഭാഷകളിൽ
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ഈ വാക്യഘടനയുടെ പരിചിതമായ രൂപമാണിത്. γλῶσσα ‘നാവ്/ഭാഷ’ എന്നും ഈ സന്ദർഭത്തിൽ ‘ഭാഷകൾ’ എന്നും അർഥമാകാവുന്നതിനാൽ പ്രസംഗത്തിന്റെ സ്വഭാവം നിർണയിക്കാതെ പാദക്കുറിപ്പിൽ വ്യത്യസ്ത സാധ്യത വ്യക്തമാക്കി.
- source_word: μεγαλυνόντων
  choice: മഹത്ത്വപ്പെടുത്തുകയും
  rationale: μεγαλύνω എന്നതിലെ ‘മഹാനായി പ്രഖ്യാപിക്കുക/മഹത്ത്വപ്പെടുത്തുക’ എന്ന ആശയം അടുത്തായി സംരക്ഷിക്കുന്നു; വെറും ‘സ്തുതിക്കുക’ എന്ന പൊതുവാക്കിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള കർമം; സാധാരണ മലയാള പരിഭാഷ.
- source_word: τότε
  choice: അപ്പോൾ
  rationale: സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ἀπεκρίθη
  choice: മറുപടി പറഞ്ഞു
  rationale: ἀποκρίνομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മുൻപ് വ്യക്തമായ ചോദ്യം ഇല്ലെങ്കിലും ബൈബിൾ ആഖ്യാനശൈലിയിൽ സ്വാഭാവികമാണ്.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: മലയാളത്തിൽ സ്ഥാപിതമായ വ്യക്തിനാമരൂപം.
theological_decisions:
- issue: γλώσσαις എന്ന പദത്തിന്റെ അർഥവും ആത്മാവിനാൽ പ്രേരിതമായ സംസാരത്തിന്റെ സ്വഭാവവും
  choice: അന്യഭാഷകളിൽ
  alternative: ഭാഷകളിൽ; നാവുകളിൽ
  rationale: γλῶσσα എന്ന പദത്തിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമുണ്ട്. പ്രധാനപാഠം പരിചിതമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു; ഇത് അറിയപ്പെടുന്ന മനുഷ്യഭാഷകളെയോ മറ്റൊരു തരത്തിലുള്ള ആത്മപ്രേരിത സംസാരത്തെയോ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് തീർപ്പാക്കാതെ പാദക്കുറിപ്പ് പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് കൃതന്തങ്ങളുടെ സമാന്തരത ‘സംസാരിക്കുകയും … മഹത്ത്വപ്പെടുത്തുകയും’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു; തുടരുന്ന ശ്രവണഭാവം ‘കേട്ടുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ പ്രകടിപ്പിച്ചു.
