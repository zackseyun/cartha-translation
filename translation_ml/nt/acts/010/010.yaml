  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: ml
  text: അവന് വളരെ വിശന്നു; ഭക്ഷണം കഴിക്കാൻ അവൻ ആഗ്രഹിച്ചു.[a] എന്നാൽ അവർ ഭക്ഷണം ഒരുക്കിക്കൊണ്ടിരിക്കുമ്പോൾ, ഒരു മയക്കാവസ്ഥ അവന്റെമേൽ വന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രുചിച്ചുനോക്കാൻ’; ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘രുചിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ അത് ഭക്ഷണം കഴിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരു പരവശാവസ്ഥ അവന്റെമേൽ വന്നു’; ഇവിടെ ഗ്രീക്ക് പദം ദർശനത്തിലൂടെയുള്ള വെളിപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട അസാധാരണ ബോധാവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... πρόσπεινος
  choice: അവന് വളരെ വിശന്നു
  rationale: πρόσπεινος സാധാരണ വിശപ്പിനെക്കാൾ ശക്തമായ വിശപ്പിനെ സൂചിപ്പിക്കുന്നു; γίνομαι അവസ്ഥാമാറ്റം അവതരിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ രണ്ടും ചേർത്ത് ഇങ്ങനെ നൽകുന്നു.
- source_word: ἤθελεν γεύσασθαι
  choice: എന്തെങ്കിലും കഴിക്കാൻ അവൻ ആഗ്രഹിച്ചു
  rationale: γεύομαι അക്ഷരാർഥത്തിൽ ‘രുചിക്കുക’ എന്നാണെങ്കിലും ഇവിടെ ഭക്ഷണം കഴിക്കുക എന്ന സന്ദർഭാർഥമാണ്. നിർദ്ദിഷ്ട കർമം ഇല്ലാത്തതിനാൽ ‘എന്തെങ്കിലും’ ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: παρασκευαζόντων αὐτῶν
  choice: അവർ ഭക്ഷണം ഒരുക്കിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് ഒരേസമയം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ സൂചിതമായ കർമം ഭക്ഷണമാകയാൽ അത് വ്യക്തമായി പറയുന്നു.
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: അവൻ ഒരു ദർശനമയക്കത്തിലായി
  rationale: ἔκστασις ഇവിടെ തുടർന്നുവരുന്ന വെളിപ്പെടുത്തൽദർശനവുമായി ബന്ധപ്പെട്ട അസാധാരണ ബോധാവസ്ഥയാണ്. ‘ദർശനമയക്കം’ വെറും അതിശയമെന്ന അർഥം ഒഴിവാക്കി സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἔκστασις സൂചിപ്പിക്കുന്ന പത്രോസിന്റെ ദർശനാവസ്ഥയുടെ സ്വഭാവം
  choice: ഒരു ദർശനമയക്കത്തിലായി
  alternative: ഒരു സമാധിയവസ്ഥ അവന്റെമേൽ വന്നു; അവൻ പരവശനായി
  rationale: തുടർന്നുള്ള വിവരണം വെളിപ്പെടുത്തൽസ്വഭാവമുള്ള ദർശനം അവതരിപ്പിക്കുന്നതിനാൽ വെറും വിസ്മയമല്ല ഇവിടെ ഉദ്ദേശിക്കുന്നത്. അതേസമയം പിന്നീടുണ്ടായ മിസ്റ്റിക്കൽ സാങ്കേതിക അർഥങ്ങളോ പ്രത്യേക മതപാരമ്പര്യങ്ങളുടെ വ്യാഖ്യാനങ്ങളോ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘സമാധി’ എന്ന പദത്തിന് ചില മതപാരമ്പര്യങ്ങളിൽ ലഭിച്ച സാങ്കേതിക അർഥം ഒഴിവാക്കാൻ മുഖ്യപാഠത്തിൽ ‘ദർശനമയക്കം’ തിരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
