id: ACT.10.44
reference: Acts 10:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: ml
  text: പത്രോസ് ഈ വാക്കുകൾ പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ, പരിശുദ്ധാത്മാവ് വചനം കേൾക്കുന്ന എല്ലാവരുടെയും മേൽ ഇറങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വചനം കേട്ട എല്ലാവരുടെയും മേൽ പരിശുദ്ധാത്മാവ് വന്നു.’
    reason: ἐπέπεσε എന്ന ക്രിയ ഇവിടെ ‘ഇറങ്ങി’ എന്നും ‘വന്നു’ എന്നും സ്വാഭാവികമായി വിവർത്തനം ചെയ്യാം; τοὺς ἀκούοντας എന്ന വർത്തമാന കൃദന്തം സന്ദർഭാനുസൃതമായി ‘കേൾക്കുന്നവർ’ അല്ലെങ്കിൽ ‘കേട്ടവർ’ എന്നു നൽകാം.
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: പത്രോസ് ... പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിലെ വർത്തമാനകാല കൃദന്തരൂപം തുടരുന്ന പ്രവൃത്തിയെയും ἔτι അതിന്റെ നടുവിൽത്തന്നെ മുഖ്യസംഭവം നടന്നുവെന്നതിനെയും സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം ആ സമകാലികത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὰ ῥήματα ταῦτα
  choice: ഈ വാക്കുകൾ
  rationale: ῥήματα ഇവിടെ പത്രോസ് ഉച്ചരിച്ച വാക്കുകളെയാണ് സൂചിപ്പിക്കുന്നത്; നേരിട്ടും സ്വാഭാവികവുമായ തർജമയാണിത്.
- source_word: ἐπέπεσε
  choice: ഇറങ്ങി
  rationale: ἐπιπίπτω എന്ന ക്രിയയുടെ സജീവമായ ‘മേൽ വരുക/പതിക്കുക’ എന്ന ആശയം മലയാളത്തിലെ ആത്മാവിനെക്കുറിച്ചുള്ള സ്വാഭാവിക പ്രയോഗമായ ‘മേൽ ഇറങ്ങി’ എന്നതിലൂടെ നൽകുന്നു; സംഭവത്തിന് അപ്പുറമുള്ള സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും വ്യാപകമായി അംഗീകരിക്കപ്പെട്ടതുമായ തത്തുല്യപദം.
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: കേട്ടുകൊണ്ടിരുന്ന എല്ലാവരുടെയുംമേൽ
  rationale: വർത്തമാനകാല കൃദന്തം അന്നേരം കേൾക്കുന്ന പ്രവൃത്തിയിൽ ഏർപ്പെട്ടിരുന്നവരെ സൂചിപ്പിക്കുന്നു; ἐπί എന്നതിന്റെ ദിശാഭാവം ‘മേൽ’ നിലനിർത്തുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: λόγος എന്ന പദവുമായി അടുത്ത പദസാദൃശ്യം നിലനിർത്തുകയും ഇവിടെ പ്രസംഗിക്കപ്പെട്ട ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ‘സന്ദേശം’ എന്നതിനെക്കാൾ ഉറവിടപദത്തിന്റെ തുറന്ന അർത്ഥവ്യാപ്തി ഇത് മെച്ചമായി കാക്കുന്നു.
theological_decisions:
- issue: ἐπέπεσε എന്നതിലൂടെ ആത്മാവിന്റെ പ്രവർത്തനം അവതരിപ്പിക്കൽ
  choice: പരിശുദ്ധാത്മാവ് ... മേൽ ഇറങ്ങി
  alternative: പരിശുദ്ധാത്മാവ് ... മേൽ വന്നു
  rationale: ലൂക്കോസിന്റെ ദൃശ്യവും ശക്തവുമായ ക്രിയാപ്രയോഗം നിലനിർത്തുന്നു; ആത്മസ്നാനത്തെക്കുറിച്ചോ അനുഭവത്തിന്റെ ക്രമത്തെക്കുറിച്ചോ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: പ്രഖ്യാപനസന്ദർഭത്തിലെ λόγος
  choice: വചനം
  alternative: സന്ദേശം
  rationale: ‘വചനം’ ഉറവിടപദവുമായി അടുത്ത ബന്ധവും അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു; അതേസമയം സന്ദർഭത്തിൽ ഇത് പത്രോസിന്റെ പ്രഖ്യാപിത സന്ദേശമാണെന്ന് വായനക്കാരന് ഗ്രഹിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾത്തന്നെ’ എന്ന പ്രയോഗം സംഭവങ്ങളുടെ സമകാലികത ഊന്നുന്നു. മുഖ്യപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദാന്തരത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
