id: ACT.10.30
reference: Acts 10:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: ml
  text: 'കൊർന്നേല്യൊസ് പറഞ്ഞു: “നാലു ദിവസം മുമ്പ്, ഇതേ സമയത്ത്, ഒൻപതാം മണിക്കൂറിൽ[a] ഞാൻ എന്റെ വീട്ടിൽ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു. അപ്പോൾ ഇതാ, തിളങ്ങുന്ന വസ്ത്രം ധരിച്ച ഒരു മനുഷ്യൻ എന്റെ മുമ്പിൽ നിന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഉച്ചകഴിഞ്ഞ് ഏകദേശം മൂന്നുമണി.
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ ഭൂതകാല സംഭാഷണാരംഭം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: ഇന്നേക്ക് നാലു ദിവസം മുമ്പ് ... ഇതേ സമയത്ത്
  rationale: നാലു ദിവസം മുമ്പുള്ളതും ഇപ്പോഴത്തേതിന് തുല്യമായ സമയവുമെന്ന ഗ്രീക്ക് കാലസൂചനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤμην ... προσευχόμενος
  choice: ഞാൻ ... പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു
  rationale: ഭൂതകാലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ ഗ്രീക്കിലെ പര്യായ അപൂർണഭൂതകാല ഘടനയ്ക്കനുസരിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν ἐνάτην
  choice: ഒൻപതാം മണിക്കൂറായ
  rationale: മൂലപാഠത്തിലെ കാലഗണന പ്രധാനവാക്യത്തിൽ നിലനിർത്തുന്നു; ആധുനിക സമയതുല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῷ οἴκῳ μου
  choice: എന്റെ വീട്ടിൽ
  rationale: ഭൗതികസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന οἶκος എന്ന പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: വിവരണത്തിലെ പെട്ടെന്നുള്ള ദൃശ്യതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἀνὴρ
  choice: ഒരു പുരുഷൻ
  rationale: മനുഷ്യപുരുഷന്റെ രൂപത്തിൽ പ്രത്യക്ഷപ്പെട്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ലിംഗനിർദിഷ്ട അർഥം നിലനിർത്തുന്നു.
- source_word: ἔστη ἐνώπιόν μου
  choice: എന്റെ മുമ്പിൽ നിന്നു
  rationale: ആ വ്യക്തി കൊർന്നേല്യൊസിന്റെ മുമ്പിൽ നിലകൊണ്ടുവെന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: തിളങ്ങുന്ന വസ്ത്രം ധരിച്ച
  rationale: വസ്ത്രത്തിന്റെ പ്രകാശമോ ദീപ്തിയോ സൂചിപ്പിക്കുന്ന λαμπρός എന്ന പദത്തിന്റെ ദൃശ്യശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὴν ἐνάτην എന്ന സമയപ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ഒൻപതാം മണിക്കൂർ
  alternative: ഉച്ചകഴിഞ്ഞ് ഏകദേശം മൂന്നുമണി
  rationale: മൂലസംസ്കാരത്തിലെ സമയനിർദേശം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും ആധുനിക സമയതുല്യം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ഇന്നേക്ക് ... ഇതേ സമയത്ത്’ എന്ന പ്രയോഗം ഗ്രീക്ക് കാലബന്ധം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘ഇതാ’ മൂലത്തിലെ ആഖ്യാന ഊന്നൽ സംരക്ഷിക്കുന്നു.
