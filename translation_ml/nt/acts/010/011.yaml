source:
  edition: SBLGNT
  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: ml
  text: അവൻ സ്വർഗം തുറന്നിരിക്കുന്നതും, ഒരു വലിയ വിരിപ്പുപോലെ എന്തോ ഒന്ന് ഇറങ്ങിവരുന്നതും, അതിന്റെ നാലു കോണുകളിൽ പിടിച്ച് ഭൂമിയിലേക്കു താഴ്ത്തപ്പെടുന്നതും കാണുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആകാശം തുറന്നിരിക്കുന്നതും.” ഗ്രീക്ക് പദത്തിന് “ആകാശം” എന്നും “സ്വർഗം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: “എന്തോ ഒന്ന്” എന്നത് “ഏതോ വസ്തു” അല്ലെങ്കിൽ “ഒരു പാത്രം” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം വസ്തു എന്താണെന്ന് കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അതിന്റെ നാല് അറ്റങ്ങളിൽ പിടിച്ച് ഭൂമിയിലേക്കു താഴ്ത്തപ്പെടുന്നതും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: അവൻ കാണുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ആഖ്യാനക്രിയയുടെ സജീവത നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: ആകാശം തുറന്നിരിക്കുന്നതും
  rationale: οὐρανός എന്നതിന് ‘ആകാശം’ എന്നും ‘സ്വർഗം’ എന്നും അർഥമാകാം. ദൃശ്യമായി തുറക്കപ്പെടുന്ന മേൽവിസ്തൃതിയും അവിടെനിന്നുള്ള ഇറക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘ആകാശം’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; വെളിപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ‘സ്വർഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: καταβαῖνον
  choice: ഇറങ്ങിവരുന്നതും
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന താഴോട്ടുള്ള ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σκεῦός τι
  choice: എന്തോ ഒന്ന്
  rationale: σκεῦος എന്ന വിശാലാർഥമുള്ള നാമത്തിന്റെയും τι എന്ന അനിശ്ചിതത്വത്തിന്റെയും ബലം സംരക്ഷിക്കുന്നു; ‘പാത്രം’ എന്നു പറഞ്ഞ് രൂപമോ ഉപയോഗമോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὡς ὀθόνην μεγάλην
  choice: വലിയൊരു വിരിപ്പുപോലെയുള്ള
  rationale: ὡς എന്ന ഉപമയും ὀθόνηയുടെ വലിയ തുണിവിരിപ്പ്/ഷീറ്റ് എന്ന ദൃശ്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; തുണിയുടെ വസ്തു നിർണ്ണയിക്കുന്നില്ല.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: അതിന്റെ നാലു കോണുകളിലും പിടിച്ച്
  rationale: ഷീറ്റുപോലെയുള്ള വസ്തുവിന്റെ ἀρχαί എന്ന അറ്റങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘കോണുകൾ’ എന്നു പറയുന്നു. ‘പിടിച്ച്’ എന്നത് താഴ്ത്തുന്ന വിധം വ്യക്തമാക്കുന്ന സന്ദർഭോചിത പൂരകമാണ്.
- source_word: καθιέμενον
  choice: താഴ്ത്തപ്പെടുന്നതും
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയ വർത്തമാന കൃദന്തരൂപം നിലനിർത്തി, വസ്തു താഴേക്കു വിടപ്പെടുകയാണെന്ന അർഥം നൽകുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലേക്കു
  rationale: താഴോട്ടുള്ള ചലനത്തോടൊപ്പം ἐπί ലക്ഷ്യദിശയെ സൂചിപ്പിക്കുന്നു; ‘ഭൂമിയിലേക്ക്’ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദർശനസന്ദർഭത്തിലെ οὐρανός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ആകാശം
  alternative: സ്വർഗം
  rationale: ഗ്രീക്ക് പദം രണ്ടർഥവും അനുവദിക്കുന്നു. തുറക്കപ്പെടുന്നതും ഒരു വസ്തു അവിടെനിന്ന് ഇറങ്ങുന്നതുമായ ദൃശ്യവിവരണത്തിൽ ‘ആകാശം’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്; എന്നാൽ ദൈവിക വെളിപ്പാടിന്റെ അർഥസാധ്യത നഷ്ടപ്പെടാതിരിക്കാൻ ‘സ്വർഗം’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദർശനത്തിന്റെ സജീവതയ്ക്കായി വർത്തമാനകാലം നിലനിർത്തി. മൂലപാഠത്തിലെ അനിശ്ചിതത്വങ്ങൾ മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പുകളിലും സംരക്ഷിച്ചു.
