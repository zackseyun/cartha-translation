  terminology: “സഹോദരന്മാർ” appropriately retains the masculine plural ἀδελφῶν in the main text. The footnote should use the idiomatic inclusive expression “സഹോദരന്മാരും സഹോദരിമാരും,” rather than the compressed and less standard “സഹോദരീസഹോദരന്മാർ.”
