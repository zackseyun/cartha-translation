id: ACT.10.23
reference: Acts 10:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: ml
  text: അതിനാൽ അവൻ അവരെ അകത്തേക്കു ക്ഷണിച്ച് അവർക്കു താമസസൗകര്യം നൽകി[a]. പിറ്റേന്ന് അവൻ എഴുന്നേറ്റ് അവരോടൊപ്പം പുറപ്പെട്ടു; യോപ്പയിൽനിന്നുള്ള സഹോദരന്മാരിൽ[b] ചിലരും അവനോടൊപ്പം പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ അതിഥികളായി സ്വീകരിച്ചു”; ഗ്രീക്കുപദം അതിഥികൾക്കു താമസം നൽകിക്കൊണ്ടുള്ള ആതിഥ്യമര്യാദയെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരന്മാർ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനമായ ἀδελφῶν ആണ്. ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിൽ ഇത് ചിലപ്പോൾ സഹവിശ്വാസികളെ കൂടുതൽ വ്യാപകമായി, അതായത് “സഹോദരന്മാരും സഹോദരിമാരും” എന്ന അർഥത്തിൽ, ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: അകത്തേക്കു ക്ഷണിച്ച്
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ഈ കൃദന്തം അവരെ അകത്തു പ്രവേശിക്കാൻ പത്രോസ് ക്ഷണിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ സ്വാഭാവികമായി ആ ആതിഥ്യമര്യാദാപരമായ പ്രവൃത്തി വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുൻവിവരണത്തിന്റെ ഫലമായി നടന്ന അടുത്ത പ്രവൃത്തിയിലേക്കുള്ള ആഖ്യാനബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐξένισεν
  choice: അതിഥികളായി പാർപ്പിച്ചു
  rationale: ξενίζω ഇവിടെ അതിഥികൾക്ക് താമസം നൽകി ആതിഥ്യമരുളുന്നതിനെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത പ്രയോഗം സ്വീകരണവും താമസവും ഒരുമിച്ച് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Τῇ δὲ ἐπαύριον
  choice: പിറ്റേന്ന്
  rationale: അടുത്ത ദിവസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാള കാലപ്രയോഗം.
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: കൃദന്തത്തിന്റെ ലളിതമായ ചലനാർഥം നിലനിർത്തുന്നു; തുടർന്നുള്ള പുറപ്പെടലിന്റെ അർഥം ഇതിലേക്ക് അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടു
  rationale: യാത്രാസന്ദർഭത്തിൽ പുറത്തേക്കു പോയി എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σὺν αὐτοῖς
  choice: അവരോടൊപ്പം
  rationale: കൂടെപോകലിനെ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: അനിശ്ചിത ബഹുവചനത്തിന്റെ സാധാരണ മലയാള തുല്യപദം.
- source_word: ἀδελφῶν
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം പ്രധാനവാചകത്തിൽ നിലനിർത്തുന്നു; ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിൽ ഇതിന് വിശ്വാസിസമൂഹത്തെ കൂടുതൽ വ്യാപകമായി സൂചിപ്പിക്കാനാകുമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῶν ἀπὸ Ἰόππης
  choice: യോപ്പയിൽനിന്നുള്ള
  rationale: അവരുടെ സ്ഥലപരമായ ഉത്ഭവം സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: συνῆλθον αὐτῷ
  choice: അവനോടൊപ്പം പോയി
  rationale: ഈ സന്ദർഭത്തിൽ പത്രോസിനെ യാത്രയിൽ അനുഗമിച്ചതാണ് അർഥം; തിരഞ്ഞെടുത്ത പ്രയോഗം അത് വ്യക്തമായി പറയുന്നു.
theological_decisions:
- issue: സഭാസമൂഹത്തെ സൂചിപ്പിക്കാവുന്ന ἀδελφῶν എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹവിശ്വാസികൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ബഹുവചനം വ്യാഖ്യാനാത്മകമായി ലിംഗനിരപേക്ഷമാക്കാതെ പ്രധാനവാചകത്തിൽ നിലനിർത്തി. എന്നാൽ ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിൽ ഈ പദം സഹവിശ്വാസികളെ പൊതുവായി ഉൾക്കൊള്ളാൻ ഇടയുള്ളതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. “അതിഥികളായി പാർപ്പിച്ചു” എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ആതിഥ്യവും താമസവും ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു; “സഹോദരന്മാർ” മൂലപാഠത്തിന്റെ ലിംഗരൂപം നിലനിർത്തുന്നു.
