source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് അവനെ എഴുന്നേൽപ്പിച്ചു, “എഴുന്നേറ്റുനിൽക്കൂ[b]; ഞാനും ഒരു മനുഷ്യനാണ്[c]” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “എഴുന്നേൽക്കൂ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “ഞാൻ തന്നെയും ഒരു മനുഷ്യനാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: അവനെ എഴുന്നേൽപ്പിച്ചുകൊണ്ട്
  rationale: ἐγείρω ഇവിടെ കാൽക്കൽ വീണുകിടന്ന കൊർന്നേല്യൊസിനെ പത്രോസ് എഴുന്നേൽപ്പിക്കുന്ന ശാരീരിക പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പ്രവൃത്തിയുടെ രീതി അനാവശ്യമായി വിശദീകരിക്കാതെ ഗ്രീക്ക് ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: Ἀνάστηθι
  choice: എഴുന്നേറ്റുനിൽക്കൂ
  rationale: ἀνίστημι എന്ന ക്രിയയുടെ ആജ്ഞാരൂപം ഇവിടെ കാൽക്കൽ വീണ നിലയിൽനിന്ന് എഴുന്നേറ്റുനിൽക്കാനുള്ള നേരിട്ടുള്ള കല്പനയാണ്. ആധുനിക മലയാളത്തിൽ സന്ദർഭത്തിന് സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: καὶ ἐγὼ αὐτὸς
  choice: ഞാനും
  rationale: καί ഉൾപ്പെടുത്തലും αὐτός ഊന്നലും നൽകുന്നു. ‘ഞാനും’ എന്ന സ്വാഭാവിക മലയാളരൂപം പത്രോസും കൊർന്നേല്യൊസിനെപ്പോലെ മനുഷ്യനാണെന്ന ഊന്നൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ഞാൻ തന്നെയും’ എന്ന കൂടുതൽ അക്ഷരാർഥ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἄνθρωπός εἰμι
  choice: ഒരു മനുഷ്യനാണ്
  rationale: ἄνθρωπος പത്രോസിന്റെ സാധാരണ മനുഷ്യസ്വഭാവത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നു. ‘വെറും മനുഷ്യൻ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വെറും’ എന്ന വ്യാഖ്യാനം ചേർക്കും.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ കൊർന്നേല്യൊസ് പത്രോസിന്റെ കാൽക്കൽ വീണതും അതിനോടുള്ള പത്രോസിന്റെ തിരുത്തൽപ്രതികരണവും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം δέ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പത്രോസിന്റെ കാൽക്കൽ വീണ കൊർന്നേല്യൊസിനോടുള്ള പ്രതികരണം
  choice: പത്രോസ് ആ പ്രവൃത്തി സ്വീകരിക്കാതെ, താനും മനുഷ്യനാണെന്ന് പറഞ്ഞ് അവനെ എഴുന്നേൽപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് വിശാലമായ ആരാധനാസിദ്ധാന്തത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയെന്നതിലുപരി പത്രോസിന്റെ വിനയത്തിന്റെ ലളിതമായ പ്രകടനമായി മാത്രം വായിക്കാം.
  rationale: ‘എഴുന്നേറ്റുനിൽക്കൂ; ഞാനും ഒരു മനുഷ്യനാണ്’ എന്ന പാഠത്തിന്റെ നേരിട്ടുള്ള അർഥം സംരക്ഷിച്ചിരിക്കുന്നു. അതേസമയം, ഈ വാക്യം വ്യക്തമായി പറയാത്ത ഒരു സമ്പൂർണ ആരാധനാസിദ്ധാന്തം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. പത്രോസിന്റെ നേരിട്ടുള്ള കല്പനയ്ക്ക് ‘എഴുന്നേറ്റുനിൽക്കൂ’ എന്നും, പങ്കിട്ട മനുഷ്യസ്വഭാവത്തിന്റെ ഊന്നലിന് ‘ഞാനും’ എന്നും തിരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
