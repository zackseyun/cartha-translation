  terminology: «പത്രോസ്», «മനുഷ്യൻ», and the respectful direct imperative are appropriate for modern standard Malayalam. «ഞാനും ഒരു മനുഷ്യനാണ്» preserves the inclusive emphasis without adding «വെറും» (‘only’), which is not explicit in the Greek.
