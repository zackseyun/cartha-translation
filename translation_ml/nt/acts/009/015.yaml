id: ACT.9.15
reference: Acts 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ κύριος· Πορεύου, ὅτι σκεῦος ἐκλογῆς ⸂ἐστίν μοι⸃ οὗτος τοῦ βαστάσαι τὸ ὄνομά μου ἐνώπιον ⸀ἐθνῶν ⸀τε καὶ βασιλέων υἱῶν τε Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/015.yaml
  text: But the Lord said to him[a], “Go[b], because this man is a chosen instrument of mine to carry my name before the Gentiles and kings and the sons of Israel,”
translation:
  language: ml
  text: 'എന്നാൽ കർത്താവ് അവനോടു പറഞ്ഞു: “പോകുക; എന്തെന്നാൽ, എന്റെ നാമം വിജാതീയരുടെയും[a] രാജാക്കന്മാരുടെയും ഇസ്രായേൽമക്കളുടെയും[b] മുമ്പിൽ വഹിക്കാനുള്ള എന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട ഉപകരണമാണ് ഇവൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനതകളുടെയും.”
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേൽമക്കൾ” എന്നത് ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത ബൈബിൾപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഈ വിവരണസന്ദർഭത്തിൽ ദൈവിക അധികാരത്തോടെ സംസാരിക്കുന്ന ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്ന പതിവ് ബഹുമാനപദമായി നിലനിർത്തുന്നു.
- source_word: Πορεύου
  choice: പോകുക
  rationale: ആജ്ഞയുടെ ശക്തി സ്വാഭാവികവും നേരിട്ടുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σκεῦος
  choice: ഉപകരണം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘പാത്രം’ ആണെങ്കിലും, ഇവിടെ ഒരു പ്രത്യേക ഉദ്ദേശ്യത്തിനായി ഉപയോഗിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; ‘ഉപകരണം’ ആ രൂപകപ്രയോഗത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκλογῆς
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട
  rationale: ദൗത്യത്തിനായുള്ള ദൈവിക തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്നു; പിൽക്കാല സിദ്ധാന്തവ്യവസ്ഥകളെ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐστίν μοι
  choice: എന്റെ ... ആണ്
  rationale: μοι സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ ബന്ധവും അവകാശവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῦ βαστάσαι
  choice: വഹിക്കാനുള്ള
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന infinitive-നെയും βαστάζω എന്നതിന്റെ ‘വഹിക്കുക’ എന്ന അർഥത്തെയും സംരക്ഷിക്കുന്നു.
- source_word: τὸ ὄνομά μου
  choice: എന്റെ നാമം
  rationale: പ്രതിനിധിത്വം, അധികാരം, പരസ്യസാക്ഷ്യം എന്നിവയുടെ ബൈബിൾപരമായ അനുരണനം നിലനിർത്താൻ അക്ഷരാർഥത്തോട് ചേർന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: സാന്നിധ്യത്തിലും പൊതുസാക്ഷ്യത്തിന്റെ വേദിയിലും എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐθνῶν
  choice: വിജാതീയർ
  rationale: ഇസ്രായേൽമക്കളോടുള്ള വ്യത്യാസത്തിൽ ഇവിടെ യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; കൂടുതൽ അക്ഷരാർഥമായ ‘ജനതകൾ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: βασιλέων
  choice: രാജാക്കന്മാർ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം വ്യക്തവും പ്രസക്തവുമാണ്.
- source_word: υἱῶν Ἰσραήλ
  choice: ഇസ്രായേൽമക്കൾ
  rationale: പരമ്പരാഗത കുടുംബബന്ധപ്രയോഗം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു; ഇത് ഇസ്രായേൽജനത്തെ കൂട്ടമായി സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: τε ... καὶ ... τε
  choice: -ഉം ... -ഉം ... -ഉം
  rationale: മൂന്നു കൂട്ടങ്ങളെയും ഏകോപിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയപ്രത്യയങ്ങളിലൂടെ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἐκλογῆς എന്ന പദത്തെ സിദ്ധാന്തപരമായി അതിവ്യാഖ്യാനിക്കാനുള്ള സാധ്യത
  choice: “എന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട ഉപകരണം”
  alternative: “എന്റെ തിരഞ്ഞെടുപ്പിന്റെ പാത്രം”
  rationale: ഈ വാക്യം ദൗത്യത്തിനായുള്ള ദൈവിക തിരഞ്ഞെടുപ്പ് വ്യക്തമായി പ്രസ്താവിക്കുന്നു. എന്നാൽ വ്യക്തികളുടെ നിത്യതിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള പിൽക്കാല തർക്കങ്ങളിൽ ഏതെങ്കിലും ഒരു നിലപാട് പരിഭാഷ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നാമം വഹിക്കുക’, ‘മുമ്പിൽ’ തുടങ്ങിയ ബൈബിൾപ്രയോഗങ്ങളുടെ അർഥസാന്ദ്രത സംരക്ഷിച്ചുകൊണ്ട് വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
