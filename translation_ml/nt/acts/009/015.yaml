  source_fidelity: Greek meaning and syntax are accurately represented. «കർത്താവ് അവനോടു പറഞ്ഞു» corresponds to εἶπεν ... ὁ κύριος; «പോകുക» preserves the imperative; and «എന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട ഉപകരണമാണ് ഇവൻ» naturally conveys σκεῦος ἐκλογῆς ἐστίν μοι without importing a doctrinal sense beyond divine selection. «എന്റെ നാമം ... മുമ്പിൽ വഹിക്കാനുള്ള» correctly expresses the purpose infinitive τοῦ βαστάσαι and the public setting introduced by ἐνώπιον. The three recipient groups are retained, including the contextual sense of ἐθνῶν as non-Jewish peoples.
