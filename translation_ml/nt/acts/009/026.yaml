id: ACT.9.26
reference: Acts 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: ml
  text: അവൻ യെരൂശലേമിൽ എത്തിയപ്പോൾ, ശിഷ്യന്മാരോടു ചേരാൻ[a] ശ്രമിച്ചുകൊണ്ടിരുന്നു. എന്നാൽ, അവൻ ഒരു ശിഷ്യനാണെന്ന് വിശ്വസിക്കാതിരുന്നതിനാൽ എല്ലാവരും അവനെ ഭയപ്പെട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശിഷ്യന്മാരോടു പറ്റിച്ചേരാൻ.”
    reason: കൊλλᾶσθαι എന്നതിന് സ്വയം അടുത്തുചേരുക, പറ്റിച്ചേരുക എന്ന കൂടുതൽ ശക്തമായ ആശയവും ഉണ്ടാകാം.
lexical_decisions:
- source_word: Παραγενόμενος
  choice: എത്തിയപ്പോൾ
  rationale: Aorist participle marks the circumstance preceding the main action. The temporal clause is natural Malayalam and preserves that relationship.
- source_word: δὲ
  choice: അവൻ…എത്തിയപ്പോൾ
  rationale: The mild narrative connective is conveyed by the flow of the Malayalam sentence; an explicit initial conjunction would be less natural here.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: Although εἰς is directional, Malayalam idiom naturally uses the locative ending with എത്തുക to express arrival at a city.
- source_word: ἐπείραζεν
  choice: ശ്രമിച്ചുകൊണ്ടിരുന്നു
  rationale: This progressive past form reflects the imperfective force of an ongoing attempt and does not suggest temptation.
- source_word: κολλᾶσθαι
  choice: ചേരാൻ
  rationale: In this social context the middle infinitive denotes seeking attachment or association with the disciples. ചേരാൻ is clear and natural without implying formal institutional membership.
- source_word: τοῖς μαθηταῖς
  choice: ശിഷ്യന്മാരോട്
  rationale: The dative relation required by κολλᾶσθαι is naturally expressed with -ഓട് in Malayalam.
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: എന്നാൽ…എല്ലാവരും അവനെ ഭയപ്പെട്ടു
  rationale: എന്നാൽ makes the contextual contrast clear, while എല്ലാവരും preserves πάντες and refers to the disciple group.
- source_word: μὴ πιστεύοντες
  choice: വിശ്വസിക്കാതെ
  rationale: The negative participial construction compactly preserves the causal/circumstantial relation without forcing it into an explicit കാരണം clause.
- source_word: ὅτι ἐστὶν μαθητής
  choice: അവൻ ഒരു ശിഷ്യനാണെന്ന്
  rationale: Malayalam indirect discourse naturally retains the present-form copular sense of Greek ἐστίν; this avoids unnecessary tense backshift.
- source_word: μαθητής
  choice: ശിഷ്യൻ
  rationale: ശിഷ്യൻ is the established, precise Malayalam equivalent for a committed learner/follower in this context.
theological_decisions:
- issue: Nature of Saul's attempted relationship to the Jerusalem believers
  choice: ശിഷ്യന്മാരോടു ചേരാൻ
  alternative: ശിഷ്യന്മാരോടു പറ്റിച്ചേരാൻ / അവരുമായി അടുത്ത് സഹവസിക്കാൻ
  rationale: The wording conveys Saul’s effort to be accepted among and associate with the disciples without importing a later formal church-membership process or sacramental act.
translation_notes:
  register: Modern standard Malayalam in a dignified narrative register. The sentence is divided at the contrast for readability. The pronoun അവൻ remains context-dependent as in the source, while എല്ലാവരും naturally points back to the disciples. The footnote marker is placed after the expression it qualifies.
