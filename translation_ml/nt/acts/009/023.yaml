id: ACT.9.23
reference: Acts 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: ml
  text: അനേകം ദിവസങ്ങൾ കഴിഞ്ഞപ്പോൾ[b], യെഹൂദന്മാർ[a] അവനെ കൊല്ലാൻ ഗൂഢാലോചന നടത്തി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘യെഹൂദന്മാർ’; ഇവിടെ ശൗലിനെ എതിർത്ത ഒരു പ്രത്യേക കൂട്ടത്തെയാണ് ഉദ്ദേശിക്കുന്നത്, എല്ലാ യെഹൂദരെയും അല്ല.
    reason: cultural_note
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: ‘അനേകം ദിവസങ്ങൾ പൂർത്തിയായപ്പോൾ’ അഥവാ ‘നിറവേറിയപ്പോൾ.’'
    reason: lexical_alternative
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘ഒരുമിച്ച് പദ്ധതിയിട്ടു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: δέ പ്രത്യേകം പരിഭാഷപ്പെടുത്താതെ, ὡς സഹിതമുള്ള കാലസൂചന മലയാളത്തിലെ സ്വാഭാവിക ഉപവാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπληροῦντο
  choice: കഴിഞ്ഞപ്പോൾ
  rationale: ദിവസങ്ങളെ കർത്താവാക്കി ഉപയോഗിച്ചിരിക്കുന്ന πληρόωയുടെ അപൂർണ ഭൂതകാല കർമണിപ്രയോഗം ഇവിടെ കാലം നിറയുക അഥവാ കടന്നുപോകുക എന്ന ആശയമാണ് നൽകുന്നത്; ‘കഴിഞ്ഞപ്പോൾ’ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: ἡμέραι ἱκαναί
  choice: അനേകം ദിവസങ്ങൾ
  rationale: ἱκαναί ഇവിടെ ‘മതിയായ’ എന്നതിലുപരി ഗണ്യമായ കാലയളവ് സൂചിപ്പിക്കുന്നു; ‘അനേകം ദിവസങ്ങൾ’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: συνεβουλεύσαντο
  choice: ഗൂഢാലോചന നടത്തി
  rationale: കൂട്ടായി ആലോചിച്ചു എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം സന്ദർഭത്തിലെ ദുഷ്ടലക്ഷ്യവും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: മൂലപാഠത്തിലെ ജനവിഭാഗസൂചനയെ ‘നേതാക്കൾ’ എന്നു പരിമിതപ്പെടുത്താതെ നിലനിർത്തുന്നു; സന്ദർഭപരമായ പരിധി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνελεῖν
  choice: കൊല്ലാൻ
  rationale: ജീവൻ അപഹരിക്കുക എന്ന സന്ദർഭാർഥം നേരിട്ടും വ്യക്തമായും നൽകുന്നു; ‘വധിക്കാൻ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: αὐτόν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ ശൗലിനെ സൂചിപ്പിക്കുന്ന കർമസർവനാമത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions:
- issue: വിരോധപരമായ വിവരണത്തിൽ οἱ Ἰουδαῖοι എന്നതിന്റെ പരിഭാഷ
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദനേതാക്കൾ / യെഹൂദ്യർ
  rationale: വാക്യം തന്നെ നൽകാത്ത ‘നേതാക്കൾ’ എന്ന പരിമിതി മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല. അതേസമയം എല്ലാ യെഹൂദന്മാരെയും അപവാദപ്പെടുത്തുന്ന പൊതുവത്കരണം ഒഴിവാക്കാൻ സന്ദർഭപരമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിന്റെ വാക്യക്രമവും കാലബന്ധവും സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട്, അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
