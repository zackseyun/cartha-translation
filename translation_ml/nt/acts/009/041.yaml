id: ACT.9.41
reference: Acts 9:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: ml
  text: അവൾക്കു കൈ കൊടുത്ത് അവൻ അവളെ എഴുന്നേൽപ്പിച്ചു[a]. പിന്നെ വിശുദ്ധരെയും വിധവമാരെയും വിളിച്ച് അവളെ ജീവനോടെ അവരുടെ മുമ്പിൽ നിർത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവളെ എഴുന്നേറ്റുനിൽക്കാൻ സഹായിച്ചു” / “അവളെ നിർത്തി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ എഴുന്നേൽക്കുകയോ നിൽക്കുകയോ ചെയ്യിക്കുക എന്നർഥമുണ്ട്; ഈ സന്ദർഭത്തിൽ അത് ഉയിർത്തെഴുന്നേൽപ്പിന്റെ ഭാഷയെയും പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς ... χεῖρα
  choice: അവൾക്കു കൈ കൊടുത്ത്
  rationale: കൈ നീട്ടി എഴുന്നേൽക്കാൻ സഹായിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായും മൂലപാഠത്തോട് അടുത്തും അവതരിപ്പിക്കുന്നു.
- source_word: ἀνέστησεν
  choice: അവളെ എഴുന്നേൽപ്പിച്ചു
  rationale: ഒരാളെ എഴുന്നേൽക്കുകയോ നിൽക്കുകയോ ചെയ്യിക്കുക എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നതോടൊപ്പം, ഈ സന്ദർഭത്തിലെ ഉയിർത്തെഴുന്നേൽപ്പിന്റെ ഭാഷാപ്രതിധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: φωνήσας
  choice: വിളിച്ച്
  rationale: സംഘത്തെ അടുക്കൽ വിളിച്ചുകൂട്ടിയ മുൻപ്രവൃത്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἁγίους
  choice: വിശുദ്ധരെ
  rationale: പുതിയനിയമത്തിൽ ദൈവജനത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദത്തിന് നേരിട്ടുള്ള തുല്യപ്രയോഗം; ‘വിശ്വാസികൾ’ എന്ന വ്യാഖ്യാനപരമായ പദത്തെക്കാൾ മൂലപാഠത്തോട് അടുത്തതാണ്.
- source_word: τὰς χήρας
  choice: വിധവമാരെ
  rationale: മുൻസന്ദർഭത്തിൽ പ്രത്യേക പ്രാധാന്യമുള്ള കൂട്ടത്തെ വേർതിരിച്ചുതന്നെ നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: παρέστησεν
  choice: അവരുടെ മുമ്പിൽ നിർത്തി
  rationale: ഒരാളെ മറ്റുള്ളവരുടെ സന്നിധിയിൽ കൊണ്ടുവന്ന് നിർത്തുകയോ അവതരിപ്പിക്കുകയോ ചെയ്യുക എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ζῶσαν
  choice: ജീവനോടെ
  rationale: അവൾ ജീവിച്ചിരിക്കുന്ന നിലയിൽ അവരുടെ മുമ്പിൽ നിർത്തപ്പെട്ടു എന്ന വിധേയപ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: ἀνέστησεν എന്ന ഉയിർത്തെഴുന്നേൽപ്പുമായി ബന്ധമുള്ള ക്രിയയുടെ കഥാസന്ദർഭത്തിലെ പരിഭാഷ
  choice: അവളെ എഴുന്നേൽപ്പിച്ചു
  alternative: അവളെ എഴുന്നേറ്റുനിൽക്കാൻ സഹായിച്ചു / അവളെ നിർത്തി
  rationale: തബീഥാ ജീവൻ പ്രാപിച്ചതിന് പിന്നാലെയുള്ള ശാരീരിക പ്രവൃത്തിയെ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; അതേസമയം ഗ്രീക്കിലെ ഉയിർത്തെഴുന്നേൽപ്പുമായി ബന്ധപ്പെട്ട ഭാഷാപ്രതിധ്വനി മായ്ച്ചുകളയുന്നില്ല. ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ സഹായിച്ച് എഴുന്നേൽപ്പിക്കുക എന്ന അർഥവും ഉണ്ടാകാമെന്ന യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വിശുദ്ധർ’ എന്ന പുതിയനിയമപരമായ സംജ്ഞ നിലനിർത്തി; ‘അവതരിപ്പിച്ചു’ എന്ന ഔപചാരിക പദത്തിന് പകരം ‘അവരുടെ മുമ്പിൽ നിർത്തി’ എന്ന കൂടുതൽ സ്വാഭാവിക പ്രയോഗം ഉപയോഗിച്ചു.
