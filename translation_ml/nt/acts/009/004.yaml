id: ACT.9.4
reference: Acts 9:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πεσὼν ἐπὶ τὴν γῆν ἤκουσεν φωνὴν λέγουσαν αὐτῷ Σαοὺλ Σαούλ, τί με διώκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: ml
  text: 'അവൻ നിലത്തു വീണ്, അവനോടു: “ശൗലേ, ശൗലേ, നീ എന്നെ പീഡിപ്പിക്കുന്നത് എന്തിന്?” എന്നു പറയുന്ന ഒരു ശബ്ദം കേട്ടു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν ἐπὶ τὴν γῆν
  choice: നിലത്തു വീണപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ സാഹചര്യപരമായ കാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; γῆ ഇവിടെ വിശാലമായ ‘ഭൂമി’ എന്നതിലുപരി സംഭവസ്ഥലത്തെ ‘നിലം’ സൂചിപ്പിക്കുന്നു.
- source_word: ἤκουσεν φωνὴν
  choice: ഒരു ശബ്ദം കേട്ടു
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകൾ ഇത് സംസാരിക്കുന്ന ശബ്ദമാണെന്ന് വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘ശബ്ദം കേട്ടു’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: λέγουσαν αὐτῷ
  choice: തന്നോടു പറയുന്ന
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃതന്തഘടനയും αὐτῷ എന്ന പരോക്ഷകർമത്തിന്റെ വ്യക്തിപരമായ ദിശയും നിലനിർത്തുന്നു.
- source_word: Σαοὺλ Σαούλ
  choice: ശൗലേ, ശൗലേ
  rationale: സംബോധനരൂപം മലയാളത്തിലെ ‘-ഏ’ പ്രത്യയത്തിലൂടെ പ്രകടമാക്കുകയും ഊന്നൽ നൽകുന്ന ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τί
  choice: എന്തിന്
  rationale: ക്രിയയോടൊപ്പമുള്ള τί ഇവിടെ കാരണചോദ്യം, അതായത് ‘എന്തുകൊണ്ട്/എന്തിന്’, എന്ന അർഥത്തിലാണ്; ‘എന്തിന്’ സ്വാഭാവികമായ നേരിട്ടുള്ള ചോദ്യം നൽകുന്നു.
- source_word: με
  choice: എന്നെ
  rationale: പ്രത്യക്ഷ കർമസർവനാമം വിശദീകരണമോ പരാവർത്തനമോ കൂടാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: διώκεις
  choice: പീഡിപ്പിക്കുന്നത്
  rationale: പ്രസക്തസന്ദർഭത്തിൽ διώκω വിശ്വാസികൾക്കെതിരായ തുടർച്ചയായ ശത്രുതാപരമായ വേട്ടയാടലിനെയും പീഡനത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘പീഡിപ്പിക്കുക’ ഈ അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: സംസാരിക്കുന്നവൻ ശൗൽ ആക്രമിക്കുന്നവരുമായി സ്വയം താദാത്മ്യപ്പെടുന്നത്
  choice: ‘എന്നെ’ എന്ന നേരിട്ടുള്ള പ്രയോഗം വിശദീകരണവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ‘എന്റെ ജനത്തെ’ അല്ലെങ്കിൽ ‘എന്റെ അനുയായികളെ’ എന്ന വിശദീകരണപരമായ പരാവർത്തനം.
  rationale: മൂലവാക്യം പീഡിപ്പിക്കപ്പെടുന്ന സമൂഹത്തോടുള്ള സംസാരിക്കുന്നവന്റെ വ്യക്തിപരമായ താദാത്മ്യം നേരിട്ട് അവതരിപ്പിക്കുന്നു. വിവർത്തനം അതിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തി വ്യാഖ്യാനത്തിലൂടെ ലഘൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശൗലേ’ എന്ന സംബോധനരൂപവും ആവർത്തനവും വാക്യത്തിന്റെ വ്യക്തിപരമായ അടിയന്തരത നിലനിർത്തുന്നു; വിഭാഗീയ പദപ്രയോഗങ്ങളോ വ്യാഖ്യാനവികാസങ്ങളോ ഒഴിവാക്കി.
