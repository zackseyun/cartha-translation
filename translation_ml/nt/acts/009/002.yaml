  to: അദ്ദേഹത്തിൽനിന്ന് ദമസ്കൊസിലെ സിനഗോഗുകൾക്കുള്ള കത്തുകൾ ആവശ്യപ്പെട്ടു; ‘മാർഗ’ത്തിൽപ്പെട്ട ആരെയെങ്കിലും—പുരുഷന്മാരായാലും സ്ത്രീകളായാലും—കണ്ടെത്തിയാൽ, അവരെ ബന്ധിതരാക്കി യെരൂശലേമിലേക്കു കൊണ്ടുവരാനായി.
  rationale: The revision restores the continuous purpose relationship of ὅπως ἐάν, explicitly reflects the request being made from the referred-to person, and retains the historical designation “the Way” and the explicit reference to men and women. “ബന്ധിതരാക്കി” conveys that those found were to be brought in a bound condition without specifying chains.
