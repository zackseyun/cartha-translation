id: ACT.9.2
reference: Acts 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: ml
  text: അദ്ദേഹത്തിൽനിന്ന് ദമസ്കൊസിലെ സിനഗോഗുകൾക്കുള്ള കത്തുകൾ ആവശ്യപ്പെട്ടു; ‘മാർഗ’ത്തിൽപ്പെട്ട ആരെയെങ്കിലും—പുരുഷന്മാരായാലും സ്ത്രീകളായാലും—കണ്ടെത്തിയാൽ, അവരെ ബന്ധിതരാക്കി യെരൂശലേമിലേക്കു കൊണ്ടുവരാനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: അദ്ദേഹത്തോട് ആവശ്യപ്പെട്ടു
  rationale: αἰτέω-യോടുകൂടിയ παρά + genitive, ആരിൽനിന്നാണ് അഭ്യർഥന നടത്തിയത് എന്നു സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അദ്ദേഹത്തോട് ... ആവശ്യപ്പെട്ടു’ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιστολὰς
  choice: കത്തുകൾ
  rationale: ἐπιστολή എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘കത്ത്’ എന്നാണ്. സന്ദർഭത്തിൽ അവ അധികാരപ്പെടുത്തുന്ന കത്തുകളാണെങ്കിലും, മൂലപദത്തിൽ വ്യക്തമല്ലാത്ത ആ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: ദമസ്കൊസിലെ സിനഗോഗുകൾക്കുള്ള
  rationale: രണ്ട് പൂർവപ്രത്യയപ്രയോഗങ്ങളും ചേർന്ന് ദമസ്കൊസിലുള്ള സിനഗോഗുകളെ ലക്ഷ്യമാക്കിയ കത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ രൂപം അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὅπως ἐάν τινας εὕρῃ
  choice: ആരെയെങ്കിലും ... കണ്ടെത്തിയാൽ ... കൊണ്ടുവരുന്നതിനായിരുന്നു അത്
  rationale: ὅπως ഉദ്ദേശ്യവും ἐάν + subjunctive സാധ്യതാനിബന്ധനയും പ്രകടിപ്പിക്കുന്നു. മലയാളരൂപം രണ്ടും നിലനിർത്തുന്നു.
- source_word: τῆς ὁδοῦ ὄντας
  choice: ‘മാർഗത്തിൽ’പ്പെട്ട
  rationale: ഇത് ആദിമ ക്രിസ്തീയ പ്രസ്ഥാനത്തിന്റെ ഒരു ചരിത്രപരമായ നാമവിശേഷണമാണ്. ‘മാർഗം’ നിലനിർത്തുന്നത് അതിനെ വ്യാഖ്യാനാത്മകമായി ‘ക്രിസ്ത്യാനികൾ’ എന്നു മാറ്റുന്നത് ഒഴിവാക്കുന്നു; ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഇത് ഒരു അംഗീകൃത പ്രസ്ഥാനനാമമാണെന്നു വായനക്കാരനെ സഹായിക്കുന്നു.
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: പുരുഷന്മാരെയോ സ്ത്രീകളെയോ
  rationale: ഗ്രീക്ക് പുരുഷന്മാരെയും സ്ത്രീകളെയും വ്യക്തമായി ഉൾപ്പെടുത്തുന്നു. നിബന്ധനാപ്രയോഗത്തിനുള്ളിൽ മലയാളത്തിലെ ‘-ഓ ... -ഓ’ ആരായാലും എന്ന ഉൾക്കൊള്ളുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δεδεμένους
  choice: ബന്ധിച്ച്
  rationale: δέω-യുടെ perfect passive participle അവരെ ബന്ധിതരാക്കിയ നിലയിൽ കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ചങ്ങലയിൽ’ എന്ന കൂടുതൽ പ്രത്യേകമായ ആശയം ചേർക്കാതെ ‘ബന്ധിച്ച്’ നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: ἀγάγῃ εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു കൊണ്ടുവരുക
  rationale: ἄγω ഇവിടെ ലക്ഷ്യസ്ഥാനമായ യെരൂശലേമിലേക്കു ആളുകളെ കൊണ്ടുവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘കൊണ്ടുവരുക’ സന്ദർഭോചിതമാണ്.
theological_decisions:
- issue: τῆς ὁδοῦ എന്ന ആദിമ പ്രസ്ഥാനനാമത്തിന്റെ പരിഭാഷ
  choice: ‘മാർഗത്തിൽ’പ്പെട്ട
  alternative: ‘മാർഗത്തിന്റെ’ അനുയായികൾ / ക്രിസ്തുവിന്റെ അനുയായികൾ
  rationale: മൂലത്തിലെ genitive ബന്ധവും ചരിത്രപരമായ ‘മാർഗം’ എന്ന നാമവും നിലനിർത്തുന്നു. ‘അനുയായികൾ’ എന്നത് അർഥം വ്യക്തമാക്കുമെങ്കിലും മൂലത്തിലെ രൂപത്തെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കും; ‘ക്രിസ്തുവിന്റെ അനുയായികൾ’ എന്നത് ചരിത്രപരമായ പദപ്രയോഗം ഇല്ലാതാക്കും.
- issue: ἄνδρας τε καὶ γυναῖκας എന്നതിലെ ഇരുലിംഗങ്ങളുടെയും വ്യക്തമായ പരാമർശം
  choice: പുരുഷന്മാരെയോ സ്ത്രീകളെയോ
  alternative: ആളുകളെ
  rationale: ശൗലിന്റെ ഉദ്ദേശിച്ച അറസ്റ്റുകളുടെ വ്യാപ്തി ഊന്നിപ്പറയുന്ന മൂലപാഠത്തിന്റെ വ്യക്തത പൊതുവായ ഒരു പദത്തിലേക്ക് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സിനഗോഗ്’ ചരിത്രപരമായ യഹൂദ സ്ഥാപനത്തിന്റെ പരിചിതമായ പേരായി നിലനിർത്തി. വാക്യഭാഗം ഒറ്റയ്ക്ക് വായിക്കുമ്പോഴും വ്യക്തമാകാൻ അവസാനത്തെ ഉദ്ദേശ്യബന്ധം ‘അതിനായിരുന്നു അത്’ എന്ന ഘടനയിൽ അവതരിപ്പിച്ചു.
