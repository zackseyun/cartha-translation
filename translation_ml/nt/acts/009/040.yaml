id: ACT.9.40
reference: Acts 9:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് എല്ലാവരെയും പുറത്താക്കിയശേഷം മുട്ടുകുത്തി പ്രാർഥിച്ചു. പിന്നെ ശരീരത്തിലേക്കു തിരിഞ്ഞ്, “തബീഥാ, എഴുന്നേൽക്കൂ[a]” എന്നു പറഞ്ഞു. അവൾ കണ്ണുകൾ തുറന്നു; പത്രോസിനെ കണ്ടപ്പോൾ എഴുന്നേറ്റ് ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഴുന്നേറ്റുനിൽക്കുക.” ഗ്രീക്ക് കല്പനയ്ക്ക് സന്ദർഭമനുസരിച്ച് രണ്ടുവിധത്തിലും അർഥമാകാം; ഈ സംഭവത്തിന്റെ ഗൗരവം നിലനിർത്താൻ “എഴുന്നേൽക്കൂ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν δὲ ἔξω πάντας
  choice: എന്നാൽ പത്രോസ് എല്ലാവരെയും പുറത്താക്കിയശേഷം
  rationale: ἐκβάλλω എന്ന ക്രിയ ഇവിടെ സന്നിഹിതരായ എല്ലാവരെയും മുറിക്കു പുറത്താക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പുറത്താക്കി’ പ്രവർത്തനത്തിന്റെ ദൃഢത നിലനിർത്തുന്നു; അനാവശ്യമായ ബലപ്രയോഗധ്വനി ചേർക്കുന്നില്ല.
- source_word: θεὶς τὰ γόνατα
  choice: മുട്ടുകുത്തി
  rationale: പ്രാർഥനയ്ക്കായി മുട്ടുകുത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: προσηύξατο
  choice: പ്രാർഥിച്ചു
  rationale: προσεύχομαι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള സാധാരണ മലയാളപരിഭാഷ.
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: ശരീരത്തിന്റെ നേരെ തിരിഞ്ഞ്
  rationale: ἐπιστρέφω, πρός എന്നിവ സൂചിപ്പിക്കുന്ന ശാരീരിക ദിശാമാറ്റം നിലനിർത്തുന്നു. σῶμα എന്നതിന് ‘ശരീരം’ ഉപയോഗിക്കുന്നത് മൂലപദത്തോടു ചേർന്നുനിൽക്കുകയും തുടർന്നുള്ള ജീവപുനഃസ്ഥാപനവിവരണത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: Ταβιθά
  choice: തബീഥാ
  rationale: വ്യക്തിനാമത്തിന്റെ ഗ്രീക്ക് രൂപം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകിയിരിക്കുന്നു; സംബോധനസന്ദർഭത്തിനനുസരിച്ച് ദീർഘാന്ത്യം നിലനിർത്തുന്നു.
- source_word: ἀνάστηθι
  choice: എഴുന്നേൽക്കുക[a]
  rationale: അനിശ്ചിതമായ ‘എഴുന്നേൽക്കുക/എഴുന്നേറ്റുനിൽക്കുക’ അർഥപരിധിയിൽ, കിടക്കുന്ന നിലയിൽനിന്നുള്ള ഉയിർത്തെഴുന്നേൽപ്പും സന്ദർഭത്തിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: അവൾ കണ്ണുകൾ തുറന്നു
  rationale: ഗ്രീക്ക് വാക്യഘടനയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളാവിഷ്കാരം.
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: പത്രോസിനെ കണ്ടപ്പോൾ
  rationale: ഗ്രീക്ക് പങ്കാളിക്രിയയെ സംഭവക്രമം വ്യക്തമാക്കുന്ന സ്വാഭാവിക കാലവാക്യമായി നൽകിയിരിക്കുന്നു.
- source_word: ἀνεκάθισεν
  choice: എഴുന്നേറ്റിരുന്നു
  rationale: കിടന്ന നിലയിൽനിന്ന് മേൽഭാഗം ഉയർത്തി ഇരിക്കുന്ന പ്രവൃത്തിയാണ് ἀνακαθίζω ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘എഴുന്നേറ്റിരുന്നു’ എന്നത് ആ ചലനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ജീവനിലേക്കുള്ള പുനഃസ്ഥാപനസന്ദർഭത്തിലെ ἀνάστηθι എന്ന കല്പനയുടെ പരിഭാഷ
  choice: എഴുന്നേൽക്കുക
  alternative: എഴുന്നേറ്റുനിൽക്കുക
  rationale: ‘എഴുന്നേൽക്കുക’ എന്നത് ക്രിയയുടെ വിശാലമായ അർഥപരിധിയും ഉയിർത്തെഴുന്നേൽപ്പുസന്ദർഭത്തിലെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; ‘നിൽക്കുക’ എന്ന പ്രത്യേക ശരീരനില മൂലപാഠത്തിലേക്ക് അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അതിപുരാതനമായ പദപ്രയോഗങ്ങളും അനാവശ്യ വിശദീകരണവും ഒഴിവാക്കി; മൂലപാഠത്തിലെ സംഭവക്രമവും ഗൗരവവും സൂക്ഷിച്ചു.
