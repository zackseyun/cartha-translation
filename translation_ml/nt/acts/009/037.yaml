  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ അവൾ രോഗബാധിതയായി മരിച്ചു. അവളുടെ ശരീരം കഴുകിയശേഷം അവർ അത് മുകളിലത്തെ നിലയിലെ ഒരു മുറിയിൽ[a] കിടത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുകളിലത്തെ മുറിയിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം മുകളിലത്തെ നിലയിലുള്ള ഒരു മുറിയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: സംഭവസൂത്രം പ്രത്യേകം പദമായി ചേർക്കാതെ സ്വാഭാവികമായ ആഖ്യാനവാക്യമായി വിവർത്തനം ചെയ്തു
  rationale: ἐγένετο ഇവിടെ സംഭവത്തെ അവതരിപ്പിക്കുന്ന ആഖ്യാനപ്രയോഗമാണ്; ‘സംഭവിച്ചു’ എന്നു അക്ഷരാർഥത്തിൽ ചേർത്താൽ മലയാളത്തിൽ വാക്യം കൃത്രിമമാകും. δὲ ഒരു നേരിയ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേക പദമില്ലാതെയും പ്രവാഹം നിലനിൽക്കുന്നു.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: കാലസൂചന നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἀσθενήσασαν
  choice: രോഗബാധിതയായി
  rationale: സന്ദർഭത്തിൽ ഇത് ശാരീരിക രോഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്; തുടർന്നുള്ള മരണത്തിനു മുമ്പുള്ള അവസ്ഥയും വ്യക്തമാകുന്നു.
- source_word: ἀποθανεῖν
  choice: മരിച്ചു
  rationale: ἐγένετο എന്നതിനോടൊപ്പമുള്ള ഗ്രീക്ക് infinitive ഘടനയെ സ്വാഭാവികമായ മലയാള finite ക്രിയയായി നൽകുന്നു.
- source_word: λούσαντες
  choice: അവളുടെ ശരീരം കഴുകിയശേഷം
  rationale: aorist participle പ്രധാനക്രിയയ്ക്കുമുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മരണാനന്തരസന്ദർഭം കണക്കിലെടുത്ത് ‘ശരീരം’ എന്നു വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: ἔθηκαν αὐτὴν
  choice: അവർ അത് … കിടത്തി
  rationale: മരണപ്പെട്ട ശരീരത്തെ ഒരു സ്ഥലത്ത് വെച്ചതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കിടത്തി’ എന്നത് സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ്; ‘അത്’ എന്നത് മുമ്പ് പറഞ്ഞ ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν ὑπερῴῳ
  choice: മുകളിലത്തെ നിലയിലെ ഒരു മുറിയിൽ
  rationale: ὑπερῷον മുകളിലത്തെ നിലയിലുള്ള ഒരു മുറിയെ സൂചിപ്പിക്കുന്നു. അനിശ്ചിതമായ ഗ്രീക്ക് രൂപം ഒരു പ്രത്യേക പ്രസിദ്ധമായ ‘മാളികമുറി’യെ സൂചിപ്പിക്കുന്നതായി തോന്നാതിരിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: ὑπερῴῳ എന്നത് പരമ്പരാഗതമായ ‘മാളികമുറി/മുകളിലത്തെ മുറി’ എന്നോ പൊതുവായ സ്ഥലവിവരണമായോ നൽകുക
  choice: മുകളിലത്തെ നിലയിലെ ഒരു മുറിയിൽ
  alternative: മുകളിലത്തെ മുറിയിൽ
  rationale: ഇത് സിദ്ധാന്തപരമായി നിർണായകമായ പദമല്ലെങ്കിലും പരമ്പരാഗത പ്രയോഗം ഒരു പ്രത്യേകമായി അറിയപ്പെടുന്ന മുറിയെന്ന ധാരണ സൃഷ്ടിക്കാം. ഗ്രീക്ക് പദം പൊതുവായി മുകളിലത്തെ നിലയിലെ മുറിയെ മാത്രമാണ് സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. മരണാനന്തര ശരീരശുശ്രൂഷയുടെ സന്ദർഭം വ്യക്തമാക്കാൻ ‘അവളുടെ ശരീരം’ എന്നു നൽകിയിരിക്കുന്നു; ഗ്രീക്കിലെ ആഖ്യാനസൂത്രം മലയാളത്തിൽ കൃത്രിമമാകാതിരിക്കാൻ സ്വാഭാവിക വാക്യഘടന ഉപയോഗിച്ചു.
