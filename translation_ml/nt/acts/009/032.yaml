id: ACT.9.32
reference: Acts 9:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: ml
  text: പത്രോസ് എല്ലായിടങ്ങളിലൂടെയും[a] സഞ്ചരിച്ചുകൊണ്ടിരിക്കെ, ലുദ്ദയിൽ താമസിക്കുന്ന വിശുദ്ധരുടെ അടുക്കലും ഇറങ്ങിച്ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “എല്ലാവരിലൂടെയും” അഥവാ “എല്ലാറ്റിലൂടെയും”; ഇവിടെ വിവിധ പ്രദേശങ്ങളെയോ അവിടത്തെ വിശ്വാസിസമൂഹങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: διὰ πάντων എന്ന സംക്ഷിപ്ത ഗ്രീക്ക് പ്രയോഗം ആളുകളെയാണോ പ്രദേശങ്ങളെയാണോ സൂചിപ്പിക്കുന്നത് എന്നത് വ്യാകരണപരമായി പൂർണമായി വ്യക്തമല്ല; ആ അവ്യക്തത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: διὰ πάντων
  choice: എല്ലായിടങ്ങളിലൂടെയും
  rationale: സന്ദർഭത്തിൽ പത്രോസ് വിവിധ പ്രദേശങ്ങളിലോ അവിടത്തെ വിശ്വാസിസമൂഹങ്ങളിലോ സഞ്ചരിച്ചതിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ പരിധി അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: τοὺς ἁγίους
  choice: വിശുദ്ധർ
  rationale: യേശുവിൽ വിശ്വസിക്കുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ആദിമക്രൈസ്തവ പ്രയോഗം; ഉറവിടത്തിന്റെ മതശാസ്ത്രപരമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κατελθεῖν
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: ചലനത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Λύδδα
  choice: ലുദ്ദ
  rationale: സ്ഥലനാമത്തിന്റെ ഗ്രീക്ക് രൂപത്തോട് അടുത്തും മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവുമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘വിശുദ്ധർ’ എന്ന വിശേഷണം
  choice: വിശ്വാസിസമൂഹത്തിനുള്ള ഉറവിടപദം അതേപടി നിലനിർത്തി
  alternative: വിശ്വാസികൾ
  rationale: ‘വിശുദ്ധർ’ എന്നത് അവരുടെ ധാർമിക പൂർണതയെക്കുറിച്ചുള്ള അധികവ്യാഖ്യാനം നൽകാതെ, സമൂഹത്തിന്റെ ദൈവബന്ധിതമായ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന ἅγιοι എന്ന പദത്തിന്റെ നേരിട്ടുള്ള പ്രതിഫലനമാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവും എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ Ἐγένετο δὲ എന്ന കഥനസൂത്രം വേർതിരിച്ച് യാന്ത്രികമായി പരിഭാഷപ്പെടുത്താതെ മലയാളത്തിലെ കാലവാക്യഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
