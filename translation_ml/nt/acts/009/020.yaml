id: ACT.9.20
reference: Acts 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: ml
  text: 'അവൻ ഉടനെതന്നെ സിനഗോഗുകളിൽ യേശുവിനെക്കുറിച്ച് പ്രസംഗിച്ചുതുടങ്ങി[a]: “ഈ യേശു ദൈവപുത്രനാണ്[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവിനെ പ്രഖ്യാപിച്ചുകൊണ്ടിരുന്നു” അഥവാ “യേശുവിനെ പ്രഖ്യാപിച്ചു.” ഗ്രീക്കിൽ യേശു ക്രിയയുടെ നേരിട്ടുള്ള കർമമാണ്; ക്രിയയ്ക്ക് പൊതുവായ പ്രഖ്യാപനത്തിന്റെ ആശയമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ പുത്രനാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടനെതന്നെ
  rationale: പ്രവൃത്തിയുടെ തൽക്ഷണതയും ആഖ്യാനത്തിലെ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥലസൂചനയും ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്നു; യഹൂദരുടെ ആരാധനാസ്ഥലത്തെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ പരിചിതമായ പദമാണ്.
- source_word: ἐκήρυσσεν
  choice: പരസ്യമായി പ്രസംഗിച്ചുതുടങ്ങി
  rationale: κηρύσσω എന്ന ക്രിയയിലെ പൊതുഘോഷണത്തിന്റെ ആശയം ‘പരസ്യമായി’ വ്യക്തമാക്കുന്നു; ഉടനെയുള്ള പുതിയ പ്രവർത്തനത്തിന്റെ ആരംഭം സന്ദർഭാനുസൃതമായി ‘തുടങ്ങി’യിൽ പ്രതിഫലിക്കുന്നു.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെക്കുറിച്ച്
  rationale: ഗ്രീക്കിൽ യേശു നേരിട്ടുള്ള കർമമാണെങ്കിലും ‘യേശുവിനെ പ്രസംഗിച്ചു’ എന്നതിനേക്കാൾ ‘യേശുവിനെക്കുറിച്ച് പ്രസംഗിച്ചു’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὅτι οὗτός
  choice: “ഇവൻ
  rationale: ὅτι പ്രസംഗത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; ഉദ്ധരണിരൂപം മലയാളത്തിൽ സ്വാഭാവികമാണ്. οὗτός എന്ന നിർദ്ദേശകസർവനാമത്തിന്റെ ഊന്നൽ ‘ഇവൻ’ നിലനിർത്തുന്നു.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രനാണ്
  rationale: നിർദിഷ്ടവും ക്രിസ്തുശാസ്ത്രപരവുമായ ശീർഷകം വ്യാഖ്യാനവികാസമില്ലാതെ മലയാളത്തിലെ സ്ഥാപിതവും സുതാര്യവുമായ രൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ പ്രഖ്യാപനത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ശീർഷകം
  choice: ദൈവപുത്രനാണ്
  alternative: ദൈവത്തിന്റെ പുത്രനാണ്
  rationale: ὁ υἱὸς τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ പൂർണമായ ക്രിസ്തുശാസ്ത്രപരമായ അവകാശവാദം ചുരുക്കാതെയും അധിക വ്യാഖ്യാനം ചേർക്കാതെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സിനഗോഗ്’ എന്ന പരിചിതമായ പദം ബഹുവചനത്തിൽ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നേരിട്ടുള്ള കർമഘടന മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ‘യേശുവിനെക്കുറിച്ച്’ എന്നു നൽകി; പൊതുഘോഷണത്തിന്റെ ഭാവം ‘പരസ്യമായി പ്രസംഗിച്ചു’ എന്നതിലൂടെ സൂക്ഷിച്ചു.
