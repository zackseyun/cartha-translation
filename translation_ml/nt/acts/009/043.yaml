source:
  edition: SBLGNT
  text: ἐγένετο ⸀δὲ ἡμέρας ἱκανὰς ⸀μεῖναι ἐν Ἰόππῃ παρά τινι Σίμωνι βυρσεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: ml
  text: പത്രോസ് യോപ്പയിൽ തോൽ സംസ്കരിക്കുന്ന ശിമോൻ എന്ന ഒരാളോടൊപ്പം അനേകം ദിവസം താമസിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശിമോൻ എന്ന ഒരാളുടെ വീട്ടിൽ.’ ഗ്രീക്ക് മുൻപ്രത്യയം ഒരാളുടെ വീട്ടിൽ പാർക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: താമസിച്ചു
  rationale: ἐγένετο + infinitive എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ വാക്കിന് വാക്കായി ‘സംഭവിച്ചു’ എന്നു മാറ്റാതെ, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിയിൽ പ്രധാനക്രിയയായി അവതരിപ്പിക്കുന്നു. മുൻസന്ദർഭത്തിൽ കർത്താവ് പത്രോസ് ആണെന്നത് വ്യക്തമായതിനാൽ പേര് ചേർത്തു.
- source_word: δὲ
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഇവിടെ δέ ആഖ്യാനത്തെ മൃദുവായി മുന്നോട്ടു കൊണ്ടുപോകുന്ന ബന്ധകമാണ്. മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἡμέρας ἱκανὰς
  choice: കുറെനാൾ
  rationale: ദിവസങ്ങളുടെ ഗണ്യമായ ദൈർഘ്യം സൂചിപ്പിക്കുന്ന ἱκανὰς എന്നതിനെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ വിധത്തിൽ നൽകുന്നു.
- source_word: ἐν Ἰόππῃ
  choice: യോപ്പയിൽ
  rationale: Ἰόππη എന്ന സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: παρά τινι Σίμωνι
  choice: ശിമോൻ എന്നു പേരുള്ള ഒരാളോടൊപ്പം
  rationale: τινι സൂചിപ്പിക്കുന്ന അനിശ്ചിതത്വവും Σίμωνι എന്ന പേരും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. παρά + dative ഇവിടെ ഒരാളോടൊപ്പം, സാധ്യതയോടെ അയാളുടെ വീട്ടിൽ, താമസിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സ്ഥലാർഥസാധ്യത അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- source_word: βυρσεῖ
  choice: തോൽപ്പണിക്കാരനായ
  rationale: βυρσεύς മൃഗത്തോൽ സംസ്കരിക്കുന്ന തൊഴിൽ ചെയ്യുന്നയാളെ സൂചിപ്പിക്കുന്നു. ‘തോൽപ്പണിക്കാരൻ’ ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന, തൊഴിൽ വ്യക്തമാക്കുന്ന പദമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. കൃത്രിമമായ വാക്കിന്-വാക്കായ ഘടന ഒഴിവാക്കി, ഗ്രീക്കിലെ അനിശ്ചിതത്വവും പാർപ്പിടസംബന്ധമായ അർഥസാധ്യതയും സംരക്ഷിച്ചു.
