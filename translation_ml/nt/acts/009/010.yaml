id: ACT.9.10
reference: Acts 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: ml
  text: ദമസ്കൊസിൽ അനന്യാസ് എന്നു പേരുള്ള ഒരു ശിഷ്യൻ ഉണ്ടായിരുന്നു. കർത്താവ് ഒരു ദർശനത്തിൽ അവനോട്, “അനന്യാസേ!” എന്നു പറഞ്ഞു. അവൻ, “കർത്താവേ, ഇതാ ഞാൻ!” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: ഉണ്ടായിരുന്നു
  rationale: ἦν പുതിയ കഥാപാത്രത്തെ പരിചയപ്പെടുത്തുന്നു; δέ നേരിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കൃത്രിമമായ ഒരു ബന്ധകപദം ചേർക്കാതെ സ്വാഭാവികമായി രംഗം തുറക്കുന്നു.
- source_word: τις μαθητὴς
  choice: ഒരു ശിഷ്യൻ
  rationale: τις ഇവിടെ അനിശ്ചിതമായി ഒരാളെ പരിചയപ്പെടുത്തുന്നു; ‘ഒരു ശിഷ്യൻ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν Δαμασκῷ
  choice: ദമസ്കൊസിൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവിന്റെ സ്ഥലസൂചന നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: ὀνόματι Ἁνανίας
  choice: അനന്യാസ് എന്നു പേരുള്ള
  rationale: ὀνόματι എന്ന നാമകരണപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ὁράματι
  choice: ഒരു ദർശനത്തിൽ
  rationale: കർത്താവ് അനന്യാസിനോട് സംസാരിച്ച മാധ്യമമോ സാഹചര്യവുമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: നിശ്ചയോപപദത്തോടെയുള്ള κύριος ഇവിടെ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്നു; ‘കർത്താവ്’ അതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: εἶπεν πρὸς αὐτόν
  choice: അവനോട് … എന്നു പറഞ്ഞു
  rationale: λέγω + πρός എന്ന നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിലെ സാധാരണ ഉദ്ധരണിഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἁνανία
  choice: അനന്യാസേ
  rationale: വിളിവിഭക്തിയിലുള്ള പേരിന്റെ നേരിട്ടുള്ള അഭിസംബോധന മലയാള വിളിരൂപത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: Ἰδοὺ ἐγώ
  choice: ഇതാ ഞാൻ
  rationale: ശ്രദ്ധയോടെയും സന്നദ്ധതയോടെയും നൽകുന്ന പതിവ് മറുപടിയുടെ ഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: ദർശനത്തിൽ സംസാരിക്കുന്ന ὁ κύριος-നോടുള്ള വിളിവിഭക്തി; ‘കർത്താവേ’ സന്ദർഭത്തിനും ദൈവിക അഭിസംബോധനയ്ക്കും യോജിക്കുന്നു.
theological_decisions:
- issue: ദർശനത്തിലെ ὁ κύριος / κύριε ആരെ സൂചിപ്പിക്കുന്നു
  choice: രണ്ടും ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ കർത്താവായി സൂചിപ്പിക്കുന്നു
  alternative: പൊതുവായ ഒരു ദൈവിക അഭിസംബോധന
  rationale: പ്രവൃത്തികൾ 9-ലെ തുടർന്നുള്ള സംഭാഷണം സംസാരിക്കുന്നവനെ യേശുവായ കർത്താവായി തിരിച്ചറിയുന്നു. ‘കർത്താവ്/കർത്താവേ’ എന്നു വിവർത്തനം ചെയ്യുന്നത് വാചകത്തെ വിശദീകരിച്ച് വികസിപ്പിക്കാതെ ഈ ക്രിസ്തുശാസ്ത്രപരമായ സൂചന സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വാക്യഘടന ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ നേരിയ δέ-മാറ്റത്തിനായി അനാവശ്യമായ ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർത്തിട്ടില്ല. നേരിട്ടുള്ള അഭിസംബോധനകൾക്ക് മലയാള വിളിരൂപങ്ങൾ ഉപയോഗിച്ചു.
