  source_fidelity: 'ഗ്രീക്കിലെ സംഭവക്രമവും ബന്ധങ്ങളും വിശ്വസ്തമായി നിലനിർത്തിയിട്ടുണ്ട്: ബർന്നബാസ് ശൗലിനെ കൂട്ടിക്കൊണ്ടുപോയി അപ്പൊസ്തലന്മാരുടെ അടുക്കൽ എത്തിക്കുന്നു; വഴിയിൽ കർത്താവിനെ കണ്ടതും കർത്താവ് അവനോടു സംസാരിച്ചതും ദമസ്കൊസിൽ യേശുവിന്റെ നാമത്തിൽ ധൈര്യത്തോടെ സംസാരിച്ചതും അവരോടു വിവരിക്കുന്നു. ‘കർത്താവ് അവനോടു സംസാരിച്ചതും’ എന്ന വ്യക്തീകരണം സന്ദർഭത്തിനും ഗ്രീക്കിലെ സ്വാഭാവിക അന്വയത്തിനും യോജിച്ചതാണ്.'
  naturalness: വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികവും വായനാസുഖമുള്ളതുമാണ്. ഗ്രീക്കിലെ ദീർഘവാക്യം രണ്ടു വാക്യങ്ങളാക്കിയത് അർഥമോ ഊന്നലോ നഷ്ടപ്പെടുത്തുന്നില്ല. ‘അവനെ കൂടെക്കൂട്ടി’ ഇവിടെ പിന്തുണാപരമായി ഏറ്റെടുത്ത് കൊണ്ടുപോയി എന്ന അർഥം നന്നായി നൽകുന്നു.
  terminology: ‘കർത്താവ്,’ ‘യേശുവിന്റെ നാമത്തിൽ,’ ‘അപ്പൊസ്തലന്മാർ,’ ‘ധൈര്യത്തോടെ സംസാരിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ സ്രോതസ്സിനോടും മലയാള ക്രിസ്തീയ പ്രയോഗപാരമ്പര്യത്തോടും യോജിച്ചിരിക്കുന്നു. ‘പ്രസംഗിച്ചു’ എന്ന കൂടുതൽ ഇടുങ്ങിയ അർഥമുള്ള പദം ഒഴിവാക്കിയത് ἐπαρρησιάσατο-യുടെ വ്യാപകമായ ‘ധൈര്യത്തോടെ/തുറന്നുപറഞ്ഞു’ എന്ന ഭാവം സംരക്ഷിക്കുന്നു. പേരുകളുടെ രൂപങ്ങളും സ്വീകാര്യമാണ്.
