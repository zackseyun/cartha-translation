id: ACT.9.27
reference: Acts 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: ml
  text: എന്നാൽ ബർന്നബാസ് അവനെ കൂടെക്കൂട്ടി അപ്പൊസ്തലന്മാരുടെ അടുക്കൽ കൊണ്ടുചെന്നു. വഴിയിൽവെച്ച് അവൻ കർത്താവിനെ കണ്ടതും കർത്താവ് അവനോടു സംസാരിച്ചതും ദമസ്കൊസിൽ യേശുവിന്റെ നാമത്തിൽ അവൻ ധൈര്യത്തോടെ സംസാരിച്ചതും ബർന്നബാസ് അവരോടു വിവരിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτόν
  choice: അവനെ കൂടെക്കൂട്ടി
  rationale: ക്രിയയുടെ കൂടെ ഏറ്റെടുത്ത് കൊണ്ടുപോകുക എന്ന അർഥവും ഈ സന്ദർഭത്തിലെ ബർന്നബാസിന്റെ പിന്തുണാപരമായ നടപടിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ബലപ്രയോഗം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരുടെ അടുക്കൽ കൊണ്ടുചെന്നു
  rationale: ἄγω എന്നതിന്റെ ‘നയിക്കുക/കൊണ്ടുവരുക’ എന്ന അർഥം ഇവിടെ ശൗലിനെ അപ്പൊസ്തലന്മാരുടെ സന്നിധിയിൽ എത്തിച്ചതായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διηγήσατο
  choice: വിവരിച്ചു
  rationale: സംഭവങ്ങൾ ക്രമമായി വിവരിച്ചുപറയുക എന്ന ക്രിയയുടെ ഭാവം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: വഴിയിൽവെച്ച്
  rationale: ഇവിടെ ὁδός ഒരു പ്രസ്ഥാനത്തിന്റെ പേരല്ല, ദമസ്കൊസിലേക്കുള്ള യാത്രയിലെ വഴിയാണ്; ‘വഴിയിൽവെച്ച്’ സന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: εἶδεν τὸν κύριον
  choice: അവൻ കർത്താവിനെ കണ്ടതും
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് ‘കർത്താവ്’ എന്നു നിലനിർത്തുകയും ഗ്രീക്കിലെ ഭൂതകാലസംഭവം സ്വാഭാവികമായ റിപ്പോർട്ടുശൈലിയിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: കർത്താവ് അവനോടു സംസാരിച്ചതും
  rationale: മുൻവാക്യത്തിലെ ‘കർത്താവ്’ തന്നെയാണ് സംസാരിച്ചതെന്ന സന്ദർഭാർഥം മലയാളത്തിൽ സർവനാമക്കുഴപ്പം ഒഴിവാക്കി വ്യക്തമാക്കുന്നു.
- source_word: ἐπαρρησιάσατο
  choice: ധൈര്യത്തോടെ സംസാരിച്ചതും
  rationale: സ്വതന്ത്രമായും തുറന്നും ധൈര്യത്തോടെയും സംസാരിക്കുക എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകമായ ‘പ്രസംഗിച്ചു’ എന്ന പദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ നാമത്തിൽ
  rationale: യേശുവിന്റെ അധികാരത്തോടും സാക്ഷ്യത്തോടും ബന്ധപ്പെട്ട സ്ഥിരമായ ബൈബിൾ പ്രയോഗം അതിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനത്തോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വഴിയിൽ കണ്ട ‘കർത്താവ്’ ആരെന്നത്
  choice: ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കുന്ന ‘കർത്താവ്’
  alternative: പൊതുവായ ഒരു ദൈവിക പരാമർശം
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 9-ലെ ഉടൻസന്ദർഭത്തിൽ ശൗൽ കണ്ടത് യേശുവിനെയാണ്; വാക്യാവസാനത്തിലെ ‘യേശുവിന്റെ നാമത്തിൽ’ എന്ന പ്രയോഗവും ഈ തിരിച്ചറിവിനെ ശക്തിപ്പെടുത്തുന്നു. എങ്കിലും വിവർത്തനം സ്ഥാനപ്പേരായ ‘കർത്താവ്’ തന്നെയാണ് നിലനിർത്തുന്നത്.
- issue: ἐλάλησεν αὐτῷ എന്നതിലെ സംസാരിച്ച വ്യക്തി
  choice: കർത്താവ് ശൗലിനോടു സംസാരിച്ചു
  alternative: ശൗൽ കർത്താവിനോടു സംസാരിച്ചു
  rationale: ഗ്രീക്ക് രൂപം മാത്രം നോക്കുമ്പോൾ സർവനാമപരമായ ചെറിയ ആശയക്കുഴപ്പം സാധ്യമെങ്കിലും മുൻപുള്ള ‘കർത്താവ്’ എന്ന കർത്താവും ദമസ്കൊസ്-വഴി സംഭവത്തിന്റെ വിവരണവും കർത്താവാണ് അവനോടു സംസാരിച്ചതെന്ന് ശക്തമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പമുള്ള, എന്നാൽ മാന്യമായ മലയാളം. ഗ്രീക്കിലെ ദീർഘമായ ഏകവാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടുവാക്യങ്ങളാക്കി; വിവരങ്ങളുടെ ക്രമവും ആവർത്തിതമായ ഘടനയും നിലനിർത്തി. പേരുകൾ ‘ബർന്നബാസ്’, ‘ദമസ്കൊസ്’, ‘യേശു’ എന്ന സാധാരണ മലയാള ബൈബിൾ രൂപങ്ങളിൽ നൽകി.
