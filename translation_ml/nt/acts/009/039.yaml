language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: ml
  text: അപ്പോൾ പത്രോസ് എഴുന്നേറ്റ് അവരോടൊപ്പം പോയി. അദ്ദേഹം എത്തിയപ്പോൾ അവർ അദ്ദേഹത്തെ മുകളിലത്തെ മുറിയിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി. വിധവമാരെല്ലാവരും കരഞ്ഞുകൊണ്ട് അദ്ദേഹത്തിനരികെ നിന്നു[a]; ദൊർക്കാസ്[b] അവരോടൊപ്പം ഉണ്ടായിരുന്നപ്പോൾ ഉണ്ടാക്കിയിരുന്ന അങ്കികളും മേലങ്കികളും[c] അവർ അദ്ദേഹത്തിന് കാണിച്ചുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അദ്ദേഹത്തിന്റെ മുമ്പിൽ നിന്നു.” ഗ്രീക്ക് പ്രയോഗത്തിന് ഈ അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ദൊർക്കാസ് എന്നത് ഗ്രീക്ക് പേരാണ്; പ്രവൃത്തികൾ 9:36-ൽ അവളെ തബീഥാ എന്നും വിളിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: “അങ്കികളും മേലങ്കികളും” എന്നത് ഗ്രീക്കിലെ രണ്ടു വ്യത്യസ്ത വസ്ത്രപദങ്ങളെ പ്രതിഫലിപ്പിക്കുന്നു; അവ യഥാക്രമം അടിസ്ഥാനവസ്ത്രങ്ങളും പുറമേ ധരിച്ചിരുന്ന വസ്ത്രങ്ങളുമായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: പ്രതികരണമായി പത്രോസ് എഴുന്നേറ്റു പുറപ്പെടുന്നതിനെ സ്വാഭാവികമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: συνῆλθεν αὐτοῖς
  choice: അവരോടൊപ്പം പോയി
  rationale: സന്ദേശവാഹകരെ അനുഗമിച്ചുവെന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: παραγενόμενον
  choice: അദ്ദേഹം എത്തിയപ്പോൾ
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀνήγαγον
  choice: മുകളിലത്തെ മുറിയിലേക്കു കൂട്ടിക്കൊണ്ടുപോയി
  rationale: അദ്ദേഹത്തെ മുകളിലേക്കു നയിച്ചെന്ന ചലനവും കൂട്ടിക്കൊണ്ടുപോയെന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: ὑπερῷον
  choice: മുകളിലത്തെ മുറി
  rationale: മുകളിലെ നിലയിലുള്ള മുറിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρέστησαν αὐτῷ
  choice: അദ്ദേഹത്തിനരികെ നിന്നു
  rationale: വിധവമാർ പത്രോസിന്റെ സന്നിധിയിൽ നിന്ന ദൃശ്യത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘മുമ്പിൽ നിന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κλαίουσαι
  choice: കരഞ്ഞുകൊണ്ട്
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ദുഃഖപ്രകടനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπιδεικνύμεναι
  choice: അദ്ദേഹത്തെ കാണിച്ചു
  rationale: വസ്ത്രങ്ങൾ പത്രോസിനു കാണിച്ച പ്രകടനാത്മക പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: χιτῶνας
  choice: അടിയുടുപ്പുകൾ
  rationale: ശരീരത്തോട് ചേർന്ന് ധരിച്ചിരുന്ന അടിസ്ഥാന വസ്ത്രത്തെ സൂചിപ്പിക്കുകയും ἱμάτιαയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἱμάτια
  choice: മേലങ്കികൾ
  rationale: പുറമേ ധരിക്കുന്ന വസ്ത്രങ്ങളെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: ὅσα ἐποίει
  choice: ഉണ്ടാക്കിയിരുന്ന
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ ഭൂതകാലത്തിലെ തുടരുന്ന അല്ലെങ്കിൽ പതിവായ പ്രവർത്തനസാധ്യതയെ അമിതമായി നിർണയിക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
