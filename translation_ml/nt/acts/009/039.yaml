  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. പുരാതന വസ്ത്രവിഭാഗങ്ങളുടെ വ്യത്യാസം വായനാസൗകര്യത്തോടെ നിലനിർത്തി; ഗ്രീക്കിലെ സാധുവായ വ്യാഖ്യാനവൈകല്യം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
