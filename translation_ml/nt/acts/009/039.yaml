    issue: «അടിയുടുപ്പുകൾ» for χιτῶνας is overly specific in modern Malayalam.
    rationale: In ordinary modern usage it can denote underwear, whereas χιτών refers more broadly to a tunic or basic body garment. This may create an unintended and culturally inaccurate image. «അങ്കികൾ» preserves the clothing-category distinction without imposing that meaning.
