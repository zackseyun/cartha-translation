id: ACT.9.21
reference: Acts 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: ml
  text: 'അവൻ പറയുന്നതു കേട്ട എല്ലാവരും അത്ഭുതപ്പെട്ടു ഇങ്ങനെ ചോദിച്ചുകൊണ്ടിരുന്നു: “യെരൂശലേമിൽ ഈ നാമം വിളിച്ചപേക്ഷിക്കുന്നവരെ[a] നശിപ്പിച്ചവൻ ഇയാളല്ലേ? അവരെ ബന്ധിച്ച നിലയിൽ പ്രധാന പുരോഹിതന്മാരുടെ അടുക്കലേക്ക് കൊണ്ടുപോകുക എന്ന ഉദ്ദേശ്യത്തോടെ ഇയാൾ ഇവിടെ വന്നതല്ലേ? ഈ നാമം[b] യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ നാമത്തെ വിളിച്ചപേക്ഷിക്കുന്നവരെ.” ഈ പ്രയോഗം യേശുവിന്റെ നാമത്തോടുള്ള അപേക്ഷയെയോ വിശ്വാസപരമായ ഏറ്റുപറച്ചിലിനെയോ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഈ നാമം”; ഇതു യേശുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξίσταντο
  choice: അത്ഭുതപ്പെട്ടു
  rationale: തുടർന്നുനിന്ന വിസ്മയാവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντες οἱ ἀκούοντες
  choice: അവൻ പറയുന്നതു കേട്ട എല്ലാവരും
  rationale: ഗ്രീക്കിൽ സന്ദർഭത്തിൽ സൂചിതമായ ശൗലിന്റെ വാക്കുകളെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πορθήσας
  choice: നശിപ്പിച്ചുകൊണ്ടിരുന്നവൻ
  rationale: സാധാരണ ‘പീഡിപ്പിക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ, തകർത്തുകളയുന്ന ആക്രമണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; തുടർച്ചയായ മുൻപ്രവർത്തനവും മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: ഈ നാമം വിളിച്ചപേക്ഷിക്കുന്നവരെ
  rationale: ഒരു നാമത്തോട് സഹായത്തിനും ആരാധനാപരമായ ആശ്രയത്തിനുമായി അഭയം തേടുന്ന ബൈബിൾപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομα τοῦτο
  choice: ഈ നാമം
  rationale: യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നതെങ്കിലും മൂലപാഠത്തിലെ പരോക്ഷവും ആദരസൂചകവുമായ പ്രയോഗം വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰς τοῦτο
  choice: എന്ന ഉദ്ദേശ്യത്തോടെ
  rationale: ലക്ഷ്യത്തെയോ ഉദ്ദേശ്യത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐληλύθει
  choice: വന്നത്
  rationale: ചോദ്യത്തിന്റെ ഘടനയിൽ ഇതിനുമുമ്പ് ഇവിടെ എത്തിച്ചേർന്ന പ്രവൃത്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δεδεμένους
  choice: ബന്ധിതരായി
  rationale: ബന്ധിക്കപ്പെട്ട നില വ്യക്തമാക്കുന്നു; ചങ്ങല എന്ന ഉപാധി അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാരുടെ അടുക്കൽ കൊണ്ടുപോകുക
  rationale: അധികാരികളായ മഹാപുരോഹിതന്മാരുടെ സന്നിധിയിലേക്ക് തടവുകാരായി കൊണ്ടുപോകുന്ന ആശയം ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀρχιερεῖς
  choice: മഹാപുരോഹിതന്മാർ
  rationale: രണ്ടാം ദേവാലയകാലത്തെ മുഖ്യ പുരോഹിതാധികാരികളെ സൂചിപ്പിക്കുന്ന പതിവും ചരിത്രപരമായി യോജിച്ചതുമായ മലയാളപദം.
theological_decisions:
- issue: ‘ഈ നാമം’ എന്നത് മുഖ്യപാഠത്തിൽ ‘യേശുവിന്റെ നാമം’ എന്നു വികസിപ്പിക്കണമോ
  choice: ‘ഈ നാമം’ എന്നു തന്നെ നിലനിർത്തി
  alternative: ‘യേശുവിന്റെ നാമം’
  rationale: മൂലപാഠം സൂചകം പരോക്ഷമായി വിടുന്നു; സന്ദർഭം അർഥം വ്യക്തമാക്കുന്നതിനാൽ ആദരസൂചകവും വാചകശൈലീപരവുമായ ശക്തി സംരക്ഷിച്ചു.
- issue: πορθήσας എന്ന ക്രിയയുടെ ശക്തി
  choice: ‘നശിപ്പിച്ചുകൊണ്ടിരുന്നവൻ’
  alternative: ‘പീഡിപ്പിച്ചുകൊണ്ടിരുന്നവൻ’
  rationale: ഗ്രീക്ക് ക്രിയ സാധാരണ പീഡനത്തേക്കാൾ ശക്തമായ തകർക്കലും നാശവും സൂചിപ്പിക്കുന്നതിനാൽ അതിനെ മൃദൂകരിച്ചില്ല.
- issue: രണ്ടാം വാക്യഭാഗത്തിന്റെ ചോദ്യംസ്വഭാവം
  choice: ‘ഉദ്ദേശ്യത്തോടെയല്ലേ ... വന്നത്?’
  alternative: ‘ഈ ഉദ്ദേശ്യത്തോടെ വന്നിരുന്നു’ എന്ന പ്രസ്താവന
  rationale: മുഴുവൻ ഉദ്ധരണിയെയും നിയന്ത്രിക്കുന്ന ഗ്രീക്ക് ചോദ്യംചിഹ്നവും Οὐχ ആരംഭിക്കുന്ന പ്രതീക്ഷിത സമ്മതചോദ്യത്തിന്റെ ശക്തിയും മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ‘വിളിച്ചപേക്ഷിക്കുക’, ‘ബന്ധിതരായി’, ‘മഹാപുരോഹിതന്മാർ’ എന്നീ പദങ്ങൾ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
