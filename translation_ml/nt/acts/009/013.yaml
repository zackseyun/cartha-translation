id: ACT.9.13
reference: Acts 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: ml
  text: 'എന്നാൽ അനന്യാസ് മറുപടി പറഞ്ഞു: “കർത്താവേ, ഈ മനുഷ്യനെക്കുറിച്ച്, അവൻ യെരൂശലേമിൽ അങ്ങയുടെ വിശുദ്ധരോടു എത്രയേറെ ദോഷങ്ങൾ ചെയ്തിട്ടുണ്ടെന്ന് ഞാൻ പലരിൽനിന്ന് കേട്ടിട്ടുണ്ട്.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ യെരൂശലേമിൽ അങ്ങയുടെ വിശുദ്ധരോട് എന്തെല്ലാം തിന്മകൾ ചെയ്തുവെന്ന്.”
    reason: ὅσα κακά എന്ന ഗ്രീക്ക് പ്രയോഗം ദോഷത്തിന്റെ വ്യാപ്തിയായോ പല തിന്മപ്രവൃത്തികളായോ സ്വാഭാവികമായി ഗ്രഹിക്കാം; ഈ പദവിന്യാസപരമായ സാധ്യത നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: എന്നാൽ അനന്യാസ് മറുപടി പറഞ്ഞു
  rationale: δέ ഇവിടെ അനന്യാസിന്റെ മടിയോടുകൂടിയ പ്രതികരണത്തിലേക്കുള്ള നേരിയ വിരുദ്ധതിരിവ് സൂചിപ്പിക്കുന്നു; ἀπεκρίθη എന്നതിന് സ്വാഭാവികമായ മലയാളം ‘മറുപടി പറഞ്ഞു’ എന്നാണ്.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ദർശനത്തിൽ യേശുവിനോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയാണ്; ആദരവും സന്ദർഭത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: ഞാൻ പലരിൽനിന്നു കേട്ടിട്ടുണ്ട്
  rationale: വിവരം പലരിൽനിന്നു ലഭിച്ചുവെന്നും അത് ഇപ്പോഴത്തെ പ്രതികരണത്തിന് പ്രസക്തമാണെന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: ഈ മനുഷ്യനെക്കുറിച്ച്
  rationale: περί എന്നതിന്റെ വിഷയസൂചനയും τούτου എന്ന സമീപസൂചകത്തിന്റെ ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὅσα κακὰ
  choice: എത്രയേറെ ദോഷങ്ങൾ
  rationale: ὅσα എന്നതിലെ വ്യാപ്തിയുടെയും അളവിന്റെയും ഭാവവും κακά എന്നതിലെ ദോഷകരമായ പ്രവൃത്തികളുടെ അർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς ἁγίοις σου
  choice: അങ്ങയുടെ വിശുദ്ധരോട്
  rationale: ἅγιοι എന്ന സ്ഥാപിതമായ പുതിയനിയമ പ്രയോഗം ‘വിശുദ്ധർ’ എന്നു നിലനിർത്തുന്നു; σου എന്ന ഉടമസ്ഥബന്ധം ആദരസൂചകമായ ‘അങ്ങയുടെ’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: ἐποίησεν
  choice: ചെയ്തിട്ടുണ്ട്
  rationale: ποιέωയുടെ വിശാലമായ അർഥം അനാവശ്യമായി പ്രത്യേകീകരിക്കാതെ, മുൻപ്രവൃത്തികളുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടുള്ള വിവർത്തനം.
theological_decisions:
- issue: Κύριε എന്ന അഭിസംബോധനയുടെ സൂചനയും ശക്തിയും
  choice: യേശുവിനെ ‘കർത്താവേ’ എന്നു നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതായി വിവർത്തനം ചെയ്തു
  alternative: കേവലം ആദരസൂചകമായി ‘യജമാനനേ’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭത്തിൽ അനന്യാസ് ദർശനത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടാണ് പ്രതികരിക്കുന്നത്; അതിനാൽ ‘കർത്താവേ’ എന്നത് കഥാസന്ദർഭവും ദൈവശാസ്ത്രപരമായ ഭാരവും അതിരുകടക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: τοῖς ἁγίοις σου എന്നതിലെ ἅγιοι
  choice: അങ്ങയുടെ വിശുദ്ധർ
  alternative: അങ്ങയുടെ വിശുദ്ധജനങ്ങൾ / അങ്ങയുടെ ജനം
  rationale: ‘വിശുദ്ധർ’ എന്നത് വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന പുതിയനിയമത്തിലെ സാങ്കേതികവും സമൂഹപരവുമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘ജനം’ എന്നു പൊതുവാക്കുന്നത് വിശുദ്ധീകരിക്കപ്പെട്ടവർ എന്ന മൂലപദത്തിന്റെ ഭാവം കുറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ദൈവത്തെ അഭിസംബോധന ചെയ്യുമ്പോൾ ‘അങ്ങ്’ രൂപം സ്വീകരിച്ചു. ‘വിശുദ്ധർ’ എന്ന പുതിയനിയമ പദം പൊതുവായ ‘ജനം’ എന്നു ലഘൂകരിക്കാതെ നിലനിർത്തി.
