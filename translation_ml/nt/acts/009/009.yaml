  yaml_path: translation/nt/acts/009/009.yaml
  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: ml
  text: അവൻ മൂന്നു ദിവസം കാഴ്ചയില്ലാതെ ഇരുന്നു; ഭക്ഷിക്കുകയോ കുടിക്കുകയോ ചെയ്തില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: മൂന്നു ദിവസം ... കഴിഞ്ഞു
  rationale: ἡμέρας τρεῖς സമയദൈർഘ്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മൂന്നു ദിവസം ... കഴിഞ്ഞു’ എന്നത് ἦν എന്ന ക്രിയയുടെ നിലനിൽപ്പുസ്വഭാവവും കാലദൈർഘ്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μὴ βλέπων
  choice: കാണാൻ കഴിയാതെ
  rationale: വാച്യമായി ‘കാണാതെയിരുന്ന്’ എന്നാണ്; സന്ദർഭത്തിൽ ശൗലിന് കാഴ്ചശേഷി ഇല്ലായിരുന്നുവെന്ന അർഥം സ്വാഭാവികമായി നൽകാൻ ‘കാണാൻ കഴിയാതെ’ എന്നു പരിഭാഷപ്പെടുത്തി. മൂലത്തിൽ ഇല്ലാത്ത ‘അന്ധൻ’ എന്ന നാമവിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: οὐκ ἔφαγεν
  choice: ഭക്ഷിക്കുകയോ ... ചെയ്തില്ല
  rationale: ἔφαγεν എന്നത് ‘ഭക്ഷിച്ചു’ എന്നാണ്. തുടർന്നുള്ള നിഷേധക്രിയയോടു ചേർത്ത് മലയാളത്തിലെ ‘-യോ ... -യോ ചെയ്തില്ല’ എന്ന സമാന്തരഘടന ഉപയോഗിച്ചു.
- source_word: οὐδὲ ἔπιεν
  choice: കുടിക്കുകയോ ചെയ്തില്ല
  rationale: οὐδέ രണ്ടാമത്തെ നിഷേധക്രിയയെ ആദ്യത്തേതിനോട് ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഭക്ഷിക്കുകയോ കുടിക്കുകയോ ചെയ്തില്ല’ എന്നത് ഈ സംയുക്തനിഷേധം വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ഗദ്യം. മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട്, ‘അന്ധൻ’ എന്ന കൂടുതൽ ശക്തമായ വിശേഷണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ യഥാർഥ പ്രയോഗത്തിന്റെ സൂക്ഷ്മത സംരക്ഷിച്ചു.
