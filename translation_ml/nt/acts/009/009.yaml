- from: അവൻ മൂന്നു ദിവസം കാണാൻ കഴിയാതെ[a] കഴിഞ്ഞു; അവൻ ഭക്ഷിക്കുകയോ കുടിക്കുകയോ ചെയ്തില്ല.
  to: അവൻ മൂന്നു ദിവസം കാഴ്ചയില്ലാതെ ഇരുന്നു; ഭക്ഷിക്കുകയോ കുടിക്കുകയോ ചെയ്തില്ല.
