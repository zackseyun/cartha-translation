  terminology: ദർശനം, അനന്യാസ്, കൈകൾ വെക്കുക, and വീണ്ടും കാഴ്ച ലഭിക്കുക are suitable, non-sectarian renderings. The translation does not impose a theological interpretation on the hand-laying.
