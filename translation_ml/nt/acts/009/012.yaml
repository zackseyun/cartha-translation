source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂ἄνδρα ἐν ὁράματι Ἁνανίαν ὀνόματι⸃ εἰσελθόντα καὶ ἐπιθέντα αὐτῷ ⸀χεῖρας ὅπως ἀναβλέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: ml
  text: അവൻ ഒരു ദർശനത്തിൽ, അനന്യാസ് എന്നു പേരുള്ള ഒരാൾ അകത്തു വന്ന് ശൗലിന്റെമേൽ കൈകൾ വെക്കുന്നതും, അങ്ങനെ തനിക്കു വീണ്ടും കാഴ്ച ലഭിക്കുന്നതും കണ്ടിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കണ്ടു”; ഗ്രീക്ക് ക്രിയ ഏഒറിസ്റ്റ് രൂപത്തിലാണ്. എന്നാൽ സന്ദർഭത്തിൽ ദർശനത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി നിലനിൽക്കുന്നതിനാൽ “കണ്ടിരിക്കുന്നു” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വീണ്ടും കാണേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: കണ്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ ഭൂതകാലസംഭവത്തെ സൂചിപ്പിക്കുന്ന aorist രൂപത്തിലാണ്; എന്നാൽ ശൗൽ ഇതിനകം കണ്ട ദർശനത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സന്ദർഭത്തിൽ നിലനിൽക്കുന്നതിനാൽ മലയാളത്തിലെ ‘കണ്ടിരിക്കുന്നു’ സ്വാഭാവികമാണ്. ‘കണ്ടു’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ἐν ὁράματι
  choice: ഒരു ദർശനത്തിൽ
  rationale: ശൗൽ കണ്ടതിന്റെ മാധ്യമമോ അനുഭവമേഖലയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἄνδρα … Ἁνανίαν ὀνόματι
  choice: അനന്യാസ് എന്നു പേരുള്ള ഒരാൾ
  rationale: പുരുഷനെ പേരോടെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰσελθόντα
  choice: അകത്തു വന്ന്
  rationale: ദർശനത്തിനുള്ളിൽ അനന്യാസ് പ്രവേശിക്കുന്ന പ്രവൃത്തി ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; കൃത്യമായ കാലക്രമം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: തന്റെമേൽ കൈകൾ വെക്കുന്നതു
  rationale: അനന്യാസ് ശൗലിന്റെമേൽ കൈകൾ വെക്കുന്ന ശാരീരിക പ്രവൃത്തി സംരക്ഷിക്കുന്നു; അതിന് പ്രത്യേക കൂദാശാപരമോ കരിസ്മാറ്റിക് ആയോ അർഥം ചേർക്കുന്നില്ല.
- source_word: ὅπως
  choice: ലഭിക്കേണ്ടതിന്
  rationale: തുടർന്നുള്ള പ്രവൃത്തിയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: ἀναβλέψῃ
  choice: വീണ്ടും കാഴ്ച ലഭിക്കേണ്ടതിന്
  rationale: ഈ സൗഖ്യസന്ദർഭത്തിൽ ‘കാഴ്ച വീണ്ടെടുക്കുക/വീണ്ടും കാണുക’ എന്ന അർഥമാണ്; ‘മുകളിലേക്കു നോക്കുക’ എന്ന സാധ്യമായ മറ്റൊരു നിഘണ്ടു അർഥം ഇവിടെ യോജിക്കുന്നില്ല.
theological_decisions:
- issue: കൈവെക്കലിന് പ്രത്യേക ദൈവശാസ്ത്രപരമായ അർഥം നൽകണമോ എന്നത്
  choice: തന്റെമേൽ കൈകൾ വെക്കുന്നതു
  alternative: തന്റെമേൽ കൈകൾ വച്ച് സൗഖ്യമാക്കുന്നതു
  rationale: ഗ്രീക്ക് പാഠം ശാരീരിക പ്രവൃത്തി പറയുന്നുവെങ്കിലും അതിനെ കൂദാശ, സ്ഥാനാരോഹണം, പ്രത്യേക വരദാനം, അല്ലെങ്കിൽ സൗഖ്യത്തിന്റെ സ്വതന്ത്ര മാർഗം എന്നിങ്ങനെ നിർവചിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലുള്ള പ്രവൃത്തി മാത്രം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ കേന്ദ്രം ശൗലിന്റെ ദർശനമായതിനാൽ αὐτῷ എന്നത് സ്വാഭാവികമായി ‘തന്റെമേൽ’ എന്നു നൽകി; ‘കൈകൾ വെക്കുക’ എന്ന ബൈബിൾപ്രയോഗം വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കലുകളില്ലാതെ നിലനിർത്തി.
