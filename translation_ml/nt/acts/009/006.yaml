source:
  edition: SBLGNT
  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: ml
  text: എന്നാൽ എഴുന്നേറ്റ് നഗരത്തിൽ പ്രവേശിക്കുക; നീ എന്തു ചെയ്യേണ്ടതാണെന്ന് നിന്നോടു പറയപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നീ എന്തു ചെയ്യേണ്ടതാണോ അത് നിന്നോടു സംസാരിക്കപ്പെടും.’'
    reason: കർമണിപ്രയോഗമുള്ള ഗ്രീക്ക് വാക്യഘടനയുടെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: ശൗലിന്റെ ചോദ്യത്തിൽനിന്ന് യേശുവിന്റെ കല്പനയിലേക്കുള്ള തിരിവ് സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ വിരുദ്ധബന്ധകം.
- source_word: ἀνάστηθι
  choice: എഴുന്നേറ്റ്
  rationale: നിലത്തുവീണ ശൗലിനോടുള്ള കല്പനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: നഗരത്തിൽ പ്രവേശിക്കുക
  rationale: ചലനദിശ ഉൾക്കൊള്ളുന്ന εἰς സഹിതമുള്ള ക്രിയയെ സംക്ഷിപ്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: λαληθήσεταί σοι
  choice: നിന്നോടു പറയപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും ആരാണ് പറയുക എന്ന ഗ്രീക്കിലെ പരോക്ഷതയും നിലനിർത്തുന്നു.
- source_word: ὅ τί
  choice: എന്തു
  rationale: അറിയിക്കപ്പെടാനുള്ള കാര്യത്തിന്റെ ഉള്ളടക്കം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: σε δεῖ ποιεῖν
  choice: നീ എന്തു ചെയ്യേണ്ടതാണെന്ന്
  rationale: δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകതയുടെയും ബാധ്യതയുടെയും ശക്തി അമിതമായി വിശദീകരിക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക നിർദേശത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള δεῖയുടെ ശക്തി
  choice: ചെയ്യേണ്ടതാണ്
  alternative: ചെയ്യണം / ചെയ്യേണ്ടത് ആവശ്യമാണ്
  rationale: ശക്തമായ ആവശ്യകതയോ ബാധ്യതയോ സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ ഉറവിടത്തെ വാക്യത്തിൽ ഇല്ലാത്ത വിധത്തിൽ വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിർദേശത്തിന്റെ ശക്തിയും നിലനിർത്തിയിട്ടുണ്ട്; അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
