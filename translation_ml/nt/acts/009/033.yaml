id: ACT.9.33
reference: Acts 9:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: ml
  text: അവിടെ ഐനേയാസ് എന്നു പേരുള്ള ഒരു മനുഷ്യനെ അദ്ദേഹം കണ്ടു. എട്ടു വർഷമായി കിടപ്പിലായിരുന്ന[a] അയാൾ പക്ഷാഘാതം ബാധിച്ചവനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഒരു പായയിൽ” അല്ലെങ്കിൽ “ഒരു ലഘുകിടക്കയിൽ കിടന്നിരുന്ന.”
    reason: ‘കിടപ്പിലായിരുന്ന’ എന്ന സ്വാഭാവിക പരിഭാഷയിൽ κράβαττος സൂചിപ്പിക്കുന്ന പായയുടെയോ ലഘുകിടക്കയുടെയോ വ്യക്തമായ ചിത്രം മറയുന്നതിനാൽ.
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: അവിടെ ... അദ്ദേഹം കണ്ടു
  rationale: δέ കഥയുടെ തുടർച്ച സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാകുന്നു. ἐκεῖ എന്ന സ്ഥലസൂചന ‘അവിടെ’ എന്നും εὗρεν എന്നത് ‘കണ്ടു’ എന്നും നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ἄνθρωπόν τινα
  choice: ഒരു മനുഷ്യനെ
  rationale: τις മുമ്പ് പരിചയപ്പെടുത്തിയിട്ടില്ലാത്ത ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഒരു മനുഷ്യനെ’ ആ വ്യവഹാരധർമ്മം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘ഒരു പ്രത്യേക മനുഷ്യനെ’ എന്നു പറഞ്ഞാൽ ഗ്രീക്കിലുള്ളതിലധികം ഊന്നൽ വരാം.
- source_word: ὀνόματι Αἰνέαν
  choice: ഐനേയാസ് എന്നു പേരുള്ള
  rationale: ὀνόματι എന്ന ദത്തിവിഭക്തി പ്രയോഗം മലയാളത്തിൽ ‘എന്നു പേരുള്ള’ എന്ന സ്വാഭാവിക രൂപത്തിൽ നൽകി; Αἰνέας എന്ന പേര് ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്ത് ‘ഐനേയാസ്’ എന്നു ലിപ്യന്തരിച്ചു.
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: എട്ടു വർഷമായി
  rationale: തുടർന്നുകൊണ്ടിരുന്ന അവസ്ഥയുടെ ദൈർഘ്യം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: കിടപ്പിലായിരുന്ന[a]
  rationale: ദീർഘകാലമായി ഒരു പായയിലോ ലഘുകിടക്കയിലോ കിടന്നിരുന്ന അവസ്ഥയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക പ്രയോഗം. മൂലത്തിലെ ദൃശ്യമായ ‘പായ/ലഘുകിടക്ക’ എന്ന ഘടകം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ὃς ἦν παραλελυμένος
  choice: അയാൾ പക്ഷാഘാതം ബാധിച്ചവനായിരുന്നു
  rationale: പരിപൂർണ കർമണി കൃദന്തരൂപം തുടരുന്ന ശാരീരികാവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘പക്ഷാഘാതം ബാധിച്ചവൻ’ രോഗാവസ്ഥയെ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ഏക ദീർഘവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; വിവരക്രമവും അർഥബന്ധവും നിലനിർത്തി.
