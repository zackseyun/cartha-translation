id: ACT.9.38
reference: Acts 9:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ οἱ μαθηταὶ ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ ἀπέστειλαν ⸂δύο ἄνδρας⸃ πρὸς αὐτὸν παρακαλοῦντες· Μὴ ⸀ὀκνήσῃς διελθεῖν ἕως ⸀ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: ml
  text: 'ലുദ്ദ യോപ്പയ്ക്ക് സമീപമായിരുന്നതിനാൽ, പത്രോസ് അവിടെയുണ്ടെന്നു കേട്ട ശിഷ്യന്മാർ രണ്ട് പുരുഷന്മാരെ അദ്ദേഹത്തിന്റെ അടുക്കൽ അയച്ച് ഇങ്ങനെ അഭ്യർഥിച്ചു: “ഞങ്ങളുടെ അടുക്കൽ വരാൻ വൈകരുതേ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഞങ്ങളുടെ അടുക്കൽ വരാൻ മടിക്കരുതേ.” ഈ ക്രിയയ്ക്ക് മടിക്കുക എന്നോ വൈകുക എന്നോ അർഥമാകാം; അപേക്ഷയുടെ അടിയന്തരത പരിഗണിച്ച് മുഖ്യപാഠത്തിൽ “വൈകരുതേ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης
  choice: സമീപമായിരുന്നതിനാൽ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് നൽകുന്ന പശ്ചാത്തലസാഹചര്യവും ശിഷ്യന്മാരുടെ നടപടിയോടുള്ള സ്വാഭാവിക കാരണബന്ധവും മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ഒരു പ്രത്യേക കാലസൂചകം ചേർക്കുന്നില്ല.
- source_word: Λύδδας / Ἰόππῃ
  choice: ലുദ്ദ / യോപ്പ
  rationale: പുതിയനിയമസന്ദർഭത്തിൽ പ്രചാരമുള്ള ഗ്രീക്ക് സ്ഥലനാമങ്ങളുടെ മലയാള ലിപ്യന്തരണങ്ങൾ.
- source_word: οἱ μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: പ്രവൃത്തികളിൽ വിശ്വാസിസമൂഹത്തിലെ അംഗങ്ങളെ സൂചിപ്പിക്കുന്ന μαθηταί എന്ന പദത്തിന്റെ പതിവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: പത്രോസ് അവിടെയുണ്ടെന്നു കേട്ട
  rationale: അവിടെയെന്നത് ലുദ്ദയെ സൂചിപ്പിക്കുന്നു; എയോറിസ്റ്റ് പാർട്ടിസിപ്പിളിന്റെ മുൻസാഹചര്യം സ്വാഭാവിക മലയാള ഉപവാക്യമായി നൽകുന്നു.
- source_word: ἀπέστειλαν δύο ἄνδρας
  choice: രണ്ട് പുരുഷന്മാരെ ... അയച്ച്
  rationale: δύο ἄνδρας എന്നതിലെ എണ്ണവും പുരുഷലിംഗസൂചനയും നിലനിർത്തുന്നു.
- source_word: παρακαλοῦντες
  choice: അഭ്യർഥിച്ചു
  rationale: ഇവിടെ പദം പ്രകടിപ്പിക്കുന്ന ഗൗരവമുള്ള അപേക്ഷയെ അതിശയോക്തിയില്ലാതെ അറിയിക്കുന്നു.
- source_word: Μὴ ὀκνήσῃς
  choice: വൈകരുതേ
  rationale: ὀκνέω എന്നതിന് മടിക്കുക, താമസിക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്; അടിയന്തരമായ യാത്രാവിനീതിയിൽ വൈകാതിരിക്കുക എന്ന പ്രായോഗിക അർഥം സ്വാഭാവികമാണ്.
- source_word: διελθεῖν ἕως ἡμῶν
  choice: ഞങ്ങളുടെ അടുക്കൽ വരാൻ
  rationale: സംസാരിക്കുന്നവരുടെ സ്ഥാനത്തേക്കുള്ള പത്രോസിന്റെ യാത്രയെ മലയാളത്തിൽ സ്വാഭാവിക ദിശാബോധത്തോടെ അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിന്റെ പശ്ചാത്തലബന്ധം സംരക്ഷിച്ചുകൊണ്ട് മലയാളവാക്യക്രമം സ്വാഭാവികമാക്കി; അപേക്ഷയിലെ വിനയം “-രുതേ” എന്ന രൂപത്തിൽ നിലനിർത്തി.
