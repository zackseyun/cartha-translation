id: ACT.9.30
reference: Acts 9:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: ml
  text: സഹോദരന്മാർ ഇത് അറിഞ്ഞപ്പോൾ[a], അവർ അവനെ താഴേക്കു കൈസര്യയിലേക്കു കൊണ്ടുപോയി, തർസൊസിലേക്ക് അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാർ ഇത് അറിഞ്ഞപ്പോൾ.” ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് വിശ്വാസിസമൂഹത്തെ പൊതുവായി സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: ഇത് അറിഞ്ഞപ്പോൾ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന വിവരം അറിഞ്ഞതാണ് തുടർന്നുള്ള പ്രവർത്തനങ്ങൾക്ക് കാരണമെന്ന് ഭൂതകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഇത്’ ചേർത്തു.
- source_word: οἱ ἀδελφοὶ
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ വിശ്വാസിസമൂഹത്തെ വിശാലമായി സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατήγαγον
  choice: കൊണ്ടുപോയി
  rationale: κατάγω ഇവിടെ കൈസര്യയിലേക്കുള്ള, സാധ്യതയേറിയ വിധത്തിൽ തീരത്തേക്കുള്ള ഇറക്കയാത്രയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്; ലക്ഷ്യസ്ഥലദിശ ‘കൈസര്യയിലേക്ക്’ എന്നതിൽ വ്യക്തമാണ്.
- source_word: Καισάρειαν
  choice: കൈസര്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തോട് പൊരുത്തപ്പെടുന്ന ലിപ്യന്തരണം.
- source_word: ἐξαπέστειλαν
  choice: അവിടെനിന്ന് … അയച്ചു
  rationale: ἐξαποστέλλω എന്ന സംയുക്തക്രിയയിലെ പുറത്തേക്കോ തുടർന്നോ അയയ്ക്കുന്ന ഭാവം ‘അവിടെനിന്ന്’ എന്ന പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Ταρσόν
  choice: തർസൊസ്
  rationale: നഗരനാമത്തിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണം.
theological_decisions:
- issue: സമ്മിശ്ര വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാവുന്ന ἀδελφοί എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹവിശ്വാസികൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം വിശാലമായ വിശ്വാസിസമൂഹം ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘അവിടെനിന്ന്’ മൂലത്തിലെ സംയുക്തക്രിയയുടെ യാത്രാതുടർച്ച വ്യക്തമാക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം അതിലുപരി ചേർത്തിട്ടില്ല.
