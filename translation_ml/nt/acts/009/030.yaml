    issue: “അവിടെനിന്ന്” adds an explicit departure point.
    rationale: ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν means that they sent him to Tarsus. Although Caesarea is the immediately preceding destination and the inference is natural, the Greek does not say “from there,” so the addition should be removed for optimal equivalence.
  - severity: low
    issue: The downward/directional element of κατήγαγον is not represented.
    rationale: “കൊണ്ടുപോയി” is natural but flattens κατάγω. Adding “താഴേക്കു” preserves the source verb’s directional nuance without adding historical explanation.
