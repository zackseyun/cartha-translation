id: ACT.9.28
reference: Acts 9:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: ml
  text: അവൻ യെരൂശലേമിൽ അവരോടൊപ്പം ആയിരുന്നു; അവിടെ വരികയും പോകുകയും കർത്താവിന്റെ നാമത്തിൽ ധൈര്യത്തോടെ സംസാരിക്കുകയും ചെയ്തുപോന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: അവൻ അവരോടൊപ്പം ... ചെയ്തുകൊണ്ട്
  rationale: അപൂർണഭൂതകാല ക്രിയ ongoing association സൂചിപ്പിക്കുന്നു. ‘അവരോടൊപ്പം’ എന്നത് താമസിച്ചു എന്ന അധിക അർഥം ചേർക്കാതെ തുടർന്നുള്ള സഹവാസം നിലനിർത്തുന്നു.
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: വരികയും പോകുകയും ചെയ്തുകൊണ്ട്
  rationale: ഈ ഇരട്ട പ്രയോഗം സ്വതന്ത്രമായും പതിവായും ഇടപഴകിയുള്ള സഞ്ചാരത്തെ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘അകത്തു കടക്കുകയും പുറത്തു പോകുകയും’ എന്നതിനേക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായ ‘വരികയും പോകുകയും’ ആവർത്തിത ചലനത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ
  rationale: ഇവിടെ εἰς നഗരത്തിലേക്കുള്ള ആവർത്തിത പ്രവേശനത്തേക്കാൾ പ്രവർത്തനത്തിന്റെ സ്ഥലപരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ locative ആയ ‘യെരൂശലേമിൽ’ സ്വീകരിച്ചു.
- source_word: παρρησιαζόμενος
  choice: ധൈര്യത്തോടെ സംസാരിച്ചുപോന്നു
  rationale: ക്രിയ തുറന്നതും ഭയമില്ലാത്തതുമായ പ്രസംഗത്തെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചുപോന്നു’ അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയും ‘ധൈര്യത്തോടെ’ നിർഭയത്വവും വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ ὀνόματι
  choice: നാമത്തിൽ
  rationale: അധികാരം, പ്രതിനിധിത്വം, ഏറ്റുപറച്ചിൽ എന്നീ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന ബൈബിൾ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന്റെ പദവിനാമസ്വഭാവം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ യേശുവാണ് സൂചിതനെങ്കിലും പേര് പകരം ചേർത്ത് ഗ്രീക്ക് പാഠത്തെ വിശദീകരിച്ചിട്ടില്ല.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്ന പദവിയുടെ സൂചിതൻ
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ എന്ന പദവി നിലനിർത്തി.
  alternative: ‘യേശുവിന്റെ നാമത്തിൽ’ എന്ന് വ്യക്തമായി എഴുതുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ Ἰησοῦ എന്നല്ല κυρίου എന്നാണ്. സന്ദർഭത്തിൽ യേശുവിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ലൂക്കോസ്–പ്രവൃത്തികളിലെ പ്രധാനപ്പെട്ട പദവി വിവർത്തനത്തിൽ സംരക്ഷിക്കുന്നത് മൂലപാഠത്തോട് കൂടുതൽ വിശ്വസ്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വരികയും പോകുകയും’ സ്വാഭാവിക മലയാള ശൈലി നൽകുമ്പോൾ, ‘കർത്താവിന്റെ നാമത്തിൽ’ എന്ന ബൈബിൾ പ്രയോഗം അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയോടെ നിലനിർത്തുന്നു.
