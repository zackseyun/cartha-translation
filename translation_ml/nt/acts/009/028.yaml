revisions:
- from: അവൻ അവരോടൊപ്പം യെരൂശലേമിൽ വരികയും പോകുകയും ചെയ്തുകൊണ്ട്, കർത്താവിന്റെ നാമത്തിൽ ധൈര്യത്തോടെ സംസാരിച്ചുപോന്നു.
  to: അവൻ യെരൂശലേമിൽ അവരോടൊപ്പം ആയിരുന്നു; അവിടെ വരികയും പോകുകയും കർത്താവിന്റെ നാമത്തിൽ ധൈര്യത്തോടെ സംസാരിക്കുകയും ചെയ്തുപോന്നു.
