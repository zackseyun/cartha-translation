revisions:
- from: 'അങ്ങനെ അനന്യാസ് പോയി ആ വീട്ടിൽ പ്രവേശിച്ചു. അവൻ ശൗലിന്റെമേൽ കൈകൾ വെച്ചുകൊണ്ട് പറഞ്ഞു: “സഹോദരനായ ശൗലേ, നീ വന്നുകൊണ്ടിരുന്ന വഴിയിൽ നിനക്കു പ്രത്യക്ഷനായ യേശു എന്ന കർത്താവാണ് എന്നെ അയച്ചത്—നിനക്കു വീണ്ടും കാഴ്ച ലഭിക്കാനും നീ പരിശുദ്ധാത്മാവിനാൽ നിറയാനും വേണ്ടി.”'
  to: 'അങ്ങനെ അനന്യാസ് പോയി ആ വീട്ടിൽ പ്രവേശിച്ചു. അവൻ ശൗലിന്റെ മേൽ കൈകൾ വെച്ചുകൊണ്ട് പറഞ്ഞു: “സഹോദരനായ ശൗലേ, നീ വന്നുകൊണ്ടിരുന്ന വഴിയിൽ നിനക്കു പ്രത്യക്ഷനായ കർത്താവായ യേശു എന്നെ അയച്ചിരിക്കുന്നു—നിനക്കു വീണ്ടും കാഴ്ച ലഭിക്കേണ്ടതിനും നീ പരിശുദ്ധാത്മാവിനാൽ നിറയേണ്ടതിനുമായി.”'
  rationale: The revision preserves the source’s syntax and scope while improving idiomatic Malayalam. It renders the sender as ‘the Lord Jesus,’ retains the road-relative clause and both purpose results, and reflects the perfect verb ‘has sent.’ No footnote is needed because the retained readings do not present a material ambiguity in Malayalam.
