id: ACT.9.17
reference: Acts 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: ml
  text: 'അങ്ങനെ അനന്യാസ് പോയി ആ വീട്ടിൽ പ്രവേശിച്ചു. അവൻ ശൗലിന്റെ മേൽ കൈകൾ വെച്ചുകൊണ്ട് പറഞ്ഞു: “സഹോദരനായ ശൗലേ, നീ വന്നുകൊണ്ടിരുന്ന വഴിയിൽ നിനക്കു പ്രത്യക്ഷനായ കർത്താവായ യേശു എന്നെ അയച്ചിരിക്കുന്നു—നിനക്കു വീണ്ടും കാഴ്ച ലഭിക്കേണ്ടതിനും നീ പരിശുദ്ധാത്മാവിനാൽ നിറയേണ്ടതിനുമായി.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: അങ്ങനെ ... പോയി
  rationale: δέ ഇവിടെ ആഖ്യാനത്തിന്റെ തുടർച്ചയും മുൻകല്പനയോടുള്ള പ്രതികരണവും സൂചിപ്പിക്കുന്നു; ‘അങ്ങനെ’ സ്വാഭാവികമായി ആ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: ആ വീട്ടിൽ പ്രവേശിച്ചു
  rationale: ഗ്രീക്കിലെ ചലനവും നിർദിഷ്ടമായ വീടും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: അവൻ ശൗലിന്റെമേൽ കൈകൾ വെച്ചുകൊണ്ട്
  rationale: അനുബന്ധമായി നടക്കുന്ന ശാരീരിക പ്രവൃത്തി സംരക്ഷിക്കുന്നു; സർവനാമത്തിന്റെ സൂചന വ്യക്തമാക്കാൻ ‘ശൗലിന്റെമേൽ’ ഉപയോഗിച്ചു.
- source_word: Σαοὺλ ἀδελφέ
  choice: സഹോദരനായ ശൗലേ
  rationale: വിളിവിഭക്തിയും സ്നേഹപൂർവമായ സഹോദരസംബോധനയും ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ κύριος ἀπέσταλκέν με, Ἰησοῦς
  choice: യേശു എന്ന കർത്താവാണ് എന്നെ അയച്ചത്
  rationale: Ἰησοῦς എന്നത് ὁ κύριος എന്നതിനെ തിരിച്ചറിയിക്കുന്ന സമാനാധികരണമായി സ്വീകരിക്കുന്നു; ഗ്രീക്കിലെ വിച്ഛേദിത ഘടന മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁ ὀφθείς σοι
  choice: നിനക്കു പ്രത്യക്ഷനായ
  rationale: ദൈവിക പ്രത്യക്ഷതയുടെ സന്ദർഭത്തിൽ ‘പ്രത്യക്ഷനായ’ എന്നത് കർമ്മണിരൂപത്തിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: നീ വന്നുകൊണ്ടിരുന്ന വഴിയിൽ
  rationale: ἤρχου എന്ന അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടരുന്ന ചലനം ‘വന്നുകൊണ്ടിരുന്ന’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: ἀναβλέψῃς
  choice: നിനക്കു വീണ്ടും കാഴ്ച ലഭിക്കാനും
  rationale: ഈ സൗഖ്യസന്ദർഭത്തിൽ അർത്ഥം ‘കാഴ്ച വീണ്ടെടുക്കുക’ എന്നതാണ്; ‘വീണ്ടും കാഴ്ച ലഭിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: നീ പരിശുദ്ധാത്മാവിനാൽ നിറയാനും
  rationale: കർമ്മണിയായ ‘നിറയുക’ എന്ന രൂപവും ദൈവാത്മാവിലേക്കുള്ള നിർദിഷ്ട പരാമർശവും മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦς എന്നത് ὁ κύριος എന്നതോടുള്ള ബന്ധം
  choice: ‘യേശു എന്ന കർത്താവ്’ എന്നു യേശുവിനെ കർത്താവായി തിരിച്ചറിയിക്കുന്ന സമാനാധികരണം
  alternative: ‘കർത്താവ് എന്നെ അയച്ചു—യേശു, നിനക്കു പ്രത്യക്ഷനായവൻ—’ എന്ന ഗ്രീക്ക് പദക്രമത്തോട് ചേർന്ന വിച്ഛേദിത രൂപം
  rationale: ഗ്രീക്കിൽ Ἰησοῦς എന്നത് ‘കർത്താവ്’ ആരെന്നു വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ പദക്രമം മാറ്റുന്നത് ഈ തിരിച്ചറിയൽ വ്യക്തമായി നൽകുന്നു; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർക്കുന്നില്ല.
- issue: അനന്യാസ് ശൗലിനെ ἀδελφέ എന്നു വിളിക്കുന്നതിന്റെ സ്വഭാവം
  choice: സഹോദരനായ ശൗലേ
  alternative: ശൗലേ, സഹോദരാ
  rationale: ബന്ധവും സ്വീകരണവും ഉള്ള അഭിസംബോധന നിലനിർത്തുന്നു; അത് വംശീയമോ സഭാസംബന്ധമോ എന്ന് വാക്യം മാത്രം കൊണ്ട് അതിയായി നിർണ്ണയിക്കുന്നില്ല.
- issue: ലേഖനമില്ലാത്ത πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധ ആത്മാവ്
  rationale: പ്രവൃത്തികളുടെ സന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംയുക്തരൂപം വ്യക്തിപരമായ നിർദിഷ്ട പരാമർശം സ്വാഭാവികമായി അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ‘കർത്താവ്—യേശു’ എന്ന സമാനാധികരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പദക്രമം മാറ്റിയെങ്കിലും ഉദ്ദേശ്യവാക്യവും രണ്ടു ഫലങ്ങളും അതേ ക്രമത്തിൽ നിലനിർത്തി. പ്രസക്തമായ യഥാർത്ഥ അർത്ഥവ്യത്യാസം ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
