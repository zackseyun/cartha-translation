id: ACT.9.14
reference: Acts 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὧδε ἔχει ἐξουσίαν παρὰ τῶν ἀρχιερέων δῆσαι πάντας τοὺς ἐπικαλουμένους τὸ ὄνομά σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: ml
  text: ഇവിടെയും, നിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരെയും ബന്ധിക്കാൻ അവന് മുഖ്യപുരോഹിതന്മാരിൽനിന്ന് അധികാരമുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ നാമം ആഹ്വാനം ചെയ്യുന്ന എല്ലാവരെയും.’ ഒരാളുടെ നാമം വിളിച്ചപേക്ഷിക്കുക അഥവാ ആഹ്വാനം ചെയ്യുക എന്നത്, പലപ്പോഴും പ്രാർഥനയിൽ ആ വ്യക്തിയെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: ഇവിടെയും
  rationale: സ്ഥലസൂചകമായ ‘ഇവിടെ’ എന്ന അർഥം നൽകുന്നു; καίയോടൊപ്പം മുൻവിവരത്തോട് ബന്ധിപ്പിക്കുന്ന ‘-യും’ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: മുഖ്യപുരോഹിതന്മാരിൽനിന്ന് ലഭിച്ച ഔദ്യോഗിക അനുമതിയെയോ അധികാരത്തെയോ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρὰ τῶν ἀρχιερέων
  choice: മുഖ്യപുരോഹിതന്മാരിൽനിന്ന്
  rationale: ജനിറ്റീവോടുകൂടിയ παρά അധികാരത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നു; ἀρχιερεῖς യെരൂശലേമിലെ മുഖ്യപുരോഹിത നേതൃത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: δῆσαι
  choice: ബന്ധിക്കാൻ
  rationale: മൂലപദത്തിന്റെ ‘കെട്ടുക/ബന്ധിക്കുക’ എന്ന ദൃശ്യഭാവം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അറസ്റ്റുചെയ്യുക എന്ന പ്രായോഗിക അർഥവും വ്യക്തമാകുന്നു.
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരെയും
  rationale: നാമത്തെ വിളിച്ചപേക്ഷിക്കുക എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുകയും പ്രാർഥനാപരമായ ആഹ്വാനത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ ὄνομά σου
  choice: നിന്റെ നാമം
  rationale: മൂലവാചകത്തിന്റെ നേരിട്ടുള്ള രൂപം സംരക്ഷിക്കുന്നു; ‘നാമം’ വ്യക്തിയെയും അവന്റെ അധികാരത്തെയും പ്രതിനിധാനം ചെയ്യാമെങ്കിലും അത് വ്യാഖ്യാനമായി വികസിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: യേശുവിനോട് അഭിമുഖമായി പറയുന്ന ‘നിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്നവർ’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘നിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന’ എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തി.
  alternative: ‘നിന്നോടു പ്രാർഥിക്കുന്ന’ / ‘നിന്റെ അധികാരം അഭ്യർഥിക്കുന്ന’
  rationale: ἐπικαλεῖσθαι τὸ ὄνομα എന്ന പ്രയോഗം പ്രാർഥനാപരമായ ആഹ്വാനവും വിശ്വസ്തതയും ഉൾക്കൊള്ളാം. യേശുവിനോടുള്ള ഭക്തിയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുമ്പോഴും, മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ബന്ധിക്കാൻ’ മൂലത്തിലെ ദൃശ്യഭാവവും ‘വിളിച്ചപേക്ഷിക്കുന്ന’ പ്രാർഥനാപരമായ ബൈബിൾപ്രയോഗവും സംരക്ഷിക്കുന്നു.
