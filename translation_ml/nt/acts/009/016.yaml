id: ACT.9.16
reference: Acts 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ ὑποδείξω αὐτῷ ὅσα δεῖ αὐτὸν ὑπὲρ τοῦ ὀνόματός μου παθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: ml
  text: കാരണം, എന്റെ നാമത്തിനുവേണ്ടി അവൻ എത്രമാത്രം കഷ്ടം സഹിക്കേണ്ടിവരുമെന്ന് ഞാൻ അവനു കാണിച്ചുകൊടുക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ നാമം നിമിത്തം” അല്ലെങ്കിൽ “എന്റെ നാമത്തിനുവേണ്ടി.”
    reason: ὑπὲρ എന്ന പദത്തിന്റെ കാരണം/നിമിത്തം, ഒരാളുടെയോ കാര്യത്തിന്റെയോ വേണ്ടി എന്ന അർഥഛായകൾ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്ന പദവികൽപങ്ങൾ.
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: പ്രകടമായ ഒന്നാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിനുള്ള വിശദീകരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ὑποδείξω
  choice: കാണിച്ചുകൊടുക്കും
  rationale: കാണിക്കുക, ബോധ്യമാക്കുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: പരോക്ഷ കർമത്തെ ദത്തിവ് രൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὅσα
  choice: എത്രമാത്രം
  rationale: δεῖയും അനന്തക്രിയയും ചേർന്ന ഈ പ്രയോഗത്തിൽ അനുഭവിക്കേണ്ട കഷ്ടത്തിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്നു.
- source_word: δεῖ
  choice: സഹിക്കേണ്ടിവരും
  rationale: ആവശ്യകത വ്യക്തമാക്കുന്നു; അതിനെ വിധിനിർണയമെന്നോ മുൻനിയോഗമെന്നോ കൂടുതൽ ശക്തമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: കാരണം, നിമിത്തം, അല്ലെങ്കിൽ പക്ഷത്തായി എന്ന വിശാല അർഥസാധ്യത നിലനിർത്തുന്നു; കൂടുതൽ വ്യക്തമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ ὀνόματός μου
  choice: എന്റെ നാമം
  rationale: വ്യക്തി, അധികാരം, അവനോടുള്ള പരസ്യബന്ധം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ബൈബിൾപ്രയോഗം അക്ഷുണ്ണമായി സൂക്ഷിക്കുന്നു.
- source_word: παθεῖν
  choice: കഷ്ടം സഹിക്കുക
  rationale: πάσχωയുടെ കഷ്ടാനുഭവം എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകതയുടെ സ്വഭാവം
  choice: സഹിക്കേണ്ടിവരും
  alternative: സഹിക്കാൻ നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് വാക്യം ആവശ്യകത പ്രസ്താവിക്കുന്നുവെങ്കിലും അത് ദൈവപരിപാലനപരമോ നിർണയാത്മകമോ എന്നത് ഇവിടെ വ്യക്തമാക്കുന്നില്ല. തെരഞ്ഞെടുത്ത രൂപം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാമം’ എന്ന ബൈബിൾപരവും ദൈവശാസ്ത്രസമ്പന്നവുമായ പദം നിലനിർത്തി; വാക്യക്രമം മലയാളവായനയ്ക്ക് സ്വാഭാവികമാക്കി.
