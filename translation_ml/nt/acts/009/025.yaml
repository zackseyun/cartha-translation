  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: ml
  text: എന്നാൽ അവന്റെ ശിഷ്യന്മാർ രാത്രിയിൽ അവനെ ഒരു വലിയ കൂടയിൽ വെച്ച് മതിലിലൂടെ താഴേക്ക് ഇറക്കി[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മതിലിലെ ഒരു തുറവിലൂടെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മതിലിലൂടെ’ എന്നാണ്; നഗരമതിലിലെ ഒരു തുറവോ ജനലോ ആയിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ താഴേക്ക് ഇറക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഒരു പ്രധാനക്രിയയും അതിനോടു ചേർന്ന മറ്റൊരു ക്രിയാരൂപവും ഉണ്ട്. അവ ഒരേ പ്രവൃത്തിയെ—കൂടയിൽ വെച്ച് താഴേക്ക് ഇറക്കുന്നതിനെ—സജീവമായി ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: അവനെ എടുത്ത്
  rationale: ശിഷ്യന്മാർ രക്ഷപ്പെടാൻ അവനെ തങ്ങളുടെ കൈവശമാക്കി പ്രവർത്തിച്ചതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
