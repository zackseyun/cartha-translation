  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മതിലിലൂടെ’ എന്ന മൂലപാഠത്തിലെ അവ്യക്തത പ്രധാനവാചകത്തിൽ നിലനിർത്തി, സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ നൽകി. ഗ്രീക്കിലെ രണ്ട് lowering expressions മലയാളത്തിൽ ‘താഴ്ത്തി ... ഇറക്കിവിട്ടു’ എന്നായി സംരക്ഷിച്ചു.
