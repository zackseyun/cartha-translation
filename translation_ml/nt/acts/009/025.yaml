- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: അവന്റെ ശിഷ്യന്മാർ
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസർവനാമവും μαθηταί എന്ന പതിവ് പദവും നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: νυκτός
  choice: രാത്രിയിൽ
  rationale: കാലസൂചകമായ ജനിറ്റീവിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: διὰ τοῦ τείχους
  choice: മതിലിലൂടെ
  rationale: διά എന്ന പദത്തിന്റെ ‘വഴിയായി/കൂടി’ എന്ന അർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ‘ദ്വാരം’ എന്നോ ‘നഗരമതിൽ’ എന്നോ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: καθῆκαν αὐτόν
  choice: താഴ്ത്തി ... ഇറക്കിവിട്ടു
  rationale: ഉയരത്തിൽനിന്ന് താഴേക്ക് ഇറക്കിയ പ്രവർത്തനം വ്യക്തമായി പറയുന്നു; χαλάσαντες എന്ന അനുബന്ധപ്രയോഗത്തോടൊപ്പം ഗ്രീക്കിലെ ആവർത്തനാത്മക ദൃശ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: χαλάσαντες
  choice: താഴ്ത്തി
  rationale: കുട്ട ഉപയോഗിച്ച് കയറിലോ സമാനമായ രീതിയിലോ താഴേക്ക് വിട്ട മാർഗം സൂചിപ്പിക്കുകയും καθῆκαν എന്ന മറ്റൊരു ഇറക്കൽപ്രയോഗത്തോടുള്ള അർഥസാമീപ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν σπυρίδι
  choice: വലിയൊരു കുട്ടയിൽ വെച്ച്
  rationale: σπυρίς ഒരാളെ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വലുപ്പമുള്ള കുട്ടയെ സൂചിപ്പിക്കുന്നു; ‘വലിയ’ എന്നത് പ്രസക്തമായ വലുപ്പവ്യത്യാസം വ്യക്തമാക്കുന്നു.
