    rationale: ഗ്രീക്കിൽ തബീഥാ എന്ന പേരിന്റെ ഗ്രീക്ക് തത്തുല്യനാമം/പരിഭാഷയാണ് ദൊർക്കാസ്. അതു വ്യക്തമായി പറയുന്നതു കൂടുതൽ സ്വാഭാവികവും വിശ്വസ്തവുമാണ്.
