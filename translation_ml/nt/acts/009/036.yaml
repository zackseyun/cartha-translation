id: ACT.9.36
reference: Acts 9:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: ml
  text: യോപ്പയിൽ തബീഥാ[a] എന്നു പേരുള്ള ഒരു ശിഷ്യയുണ്ടായിരുന്നു. ആ പേരിന്റെ ഗ്രീക്ക് പരിഭാഷ ദൊർക്കാസ് എന്നാണ്. അവൾ ചെയ്തുപോന്ന സൽപ്രവൃത്തികളും കാരുണ്യദാനങ്ങളുംകൊണ്ട് നിറഞ്ഞവളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: തബീഥാ എന്ന പേരിനു തത്തുല്യമായ ഗ്രീക്ക് പേരാണ് ദൊർക്കാസ്; ഈ പേരിന്റെ അർഥം ‘ഗസൽ’ (ഒരിനം മാൻ) എന്നാണ്.
    reason: സെമിറ്റിക് പേരും അതിന്റെ ഗ്രീക്ക് തത്തുല്യനാമവും തമ്മിലുള്ള ബന്ധവും പേരിന്റെ കൃത്യമായ പദാർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: μαθήτρια
  choice: ശിഷ്യ
  rationale: ഗ്രീക്ക് നാമം സ്ത്രീലിംഗത്തിലുള്ളതാണ്. മലയാളത്തിലെ ‘ശിഷ്യ’ സ്ത്രീയെ വ്യക്തമായി സൂചിപ്പിക്കുകയും സന്ദർഭത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὀνόματι Ταβιθά
  choice: തബീഥാ എന്നു പേരുള്ള
  rationale: പേര് പരിചയപ്പെടുത്തുന്ന ഗ്രീക്ക് ദത്തിവ് പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപമാണിത്.
- source_word: διερμηνευομένη λέγεται Δορκάς
  choice: ആ പേര് പരിഭാഷപ്പെടുത്തിയാൽ ദൊർക്കാസ് എന്നാണ്
  rationale: സെമിറ്റിക് പേരിന് നൽകിയിരിക്കുന്ന ഗ്രീക്ക് തത്തുല്യനാമത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ദൊർക്കാസ് എന്ന വ്യക്തിനാമം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: സൽപ്രവൃത്തികൾകൊണ്ട് നിറഞ്ഞവൾ
  rationale: πλήρης എന്ന പദത്തിന്റെ ‘നിറഞ്ഞ’ എന്ന രൂപകവും ἔργων ἀγαθῶν എന്നതിന്റെ ധാർമിക അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐλεημοσυνῶν
  choice: കാരുണ്യദാനങ്ങൾ
  rationale: ആവശ്യത്തിലിരിക്കുന്നവരോടുള്ള കരുണയിൽനിന്നുള്ള സഹായദാനങ്ങളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘കാരുണ്യദാനങ്ങൾ’ കരുണയും ദാനവും ഒരുപോലെ പ്രകടമാക്കുന്നു; പണദാനത്തിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ὧν ἐποίει
  choice: അവൾ ചെയ്തുപോന്ന
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന പതിവായും തുടർച്ചയായും ചെയ്തിരുന്ന പ്രവൃത്തിയുടെ ഭാവം ‘ചെയ്തുപോന്ന’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ആഖ്യാനത്തിന്റെ പുരോഗതി അടയാളപ്പെടുത്തുന്ന ലഘുബന്ധകമാണ്. മലയാളത്തിൽ വാക്യാരംഭത്തിൽ അധികമായ ‘ഇപ്പോൾ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർക്കാതെ തന്നെ ഈ ബന്ധം സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: μαθήτρια എന്ന സ്ത്രീലിംഗ നാമത്തിന്റെ വിവർത്തനം
  choice: ശിഷ്യ
  alternative: സ്ത്രീശിഷ്യ
  rationale: മൂലപദത്തിലെ സ്ത്രീലിംഗസൂചന മലയാളത്തിലെ ‘ശിഷ്യ’ തന്നെ സ്വാഭാവികമായി വഹിക്കുന്നു. ‘സ്ത്രീശിഷ്യ’ അനാവശ്യമായി വിശദീകരണാത്മകവും കുറച്ച് അസ്വാഭാവികവുമാണ്.
- issue: ἐλεημοσυνῶν എന്നതിന്റെ അർഥപരിധി
  choice: കാരുണ്യദാനങ്ങൾ
  alternative: ഭിക്ഷാദാനം; ദാനധർമങ്ങൾ; കരുണാപ്രവൃത്തികൾ
  rationale: ഈ പദം ദരിദ്രർക്കോ ആവശ്യത്തിലിരിക്കുന്നവർക്കോ കരുണയോടെ നൽകുന്ന സഹായത്തെ സൂചിപ്പിക്കുന്നു. ‘കാരുണ്യദാനങ്ങൾ’ അതിന്റെ ദാനപരവും കരുണാപരവുമായ വശങ്ങൾ നിലനിർത്തുന്നു, എന്നാൽ ഒരു പ്രത്യേക മതസ്ഥാപനപരമായ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ശിഷ്യ’, ‘സൽപ്രവൃത്തികൾ’, ‘കാരുണ്യദാനങ്ങൾ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ആശയസാന്ദ്രത നിലനിർത്തുന്നതുമാണ്. ഗ്രീക്ക് വാക്യത്തിലെ രൂപകം സംരക്ഷിക്കാൻ ‘നിറഞ്ഞവളായിരുന്നു’ നിലനിർത്തി.
