  to: യോപ്പയിൽ തബീഥാ[a] എന്നു പേരുള്ള ഒരു ശിഷ്യയുണ്ടായിരുന്നു. ആ പേരിന്റെ ഗ്രീക്ക് പരിഭാഷ ദൊർക്കാസ് എന്നാണ്. അവൾ ചെയ്തുപോന്ന സൽപ്രവൃത്തികളും കാരുണ്യദാനങ്ങളുംകൊണ്ട് നിറഞ്ഞവളായിരുന്നു.
