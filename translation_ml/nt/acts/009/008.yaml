id: ACT.9.8
reference: Acts 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠγέρθη δὲ ⸀Σαῦλος ἀπὸ τῆς γῆς, ἀνεῳγμένων ⸀δὲ τῶν ὀφθαλμῶν αὐτοῦ ⸀οὐδὲν ἔβλεπεν· χειραγωγοῦντες δὲ αὐτὸν εἰσήγαγον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: ml
  text: എന്നാൽ ശൗൽ നിലത്തുനിന്ന് എഴുന്നേറ്റു. കണ്ണുകൾ തുറന്നിരുന്നെങ്കിലും അവൻ ഒന്നും കണ്ടില്ല.[a] അതുകൊണ്ട് അവർ അവനെ കൈപിടിച്ചു നടത്തി ദമസ്കൊസിൽ കൊണ്ടുചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവന്റെ കണ്ണുകൾ തുറക്കപ്പെട്ടിരിക്കെ, അവൻ ഒന്നും കണ്ടില്ല.” കണ്ണുകൾ തുറന്നിട്ടും കാണാൻ കഴിയാത്തതിലെ വൈരുധ്യത്തിന് ഗ്രീക്ക് ഘടന ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: എഴുന്നേറ്റു
  rationale: 'ἐγείρω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗരൂപം ഇവിടെ ആഖ്യാനസന്ദർഭത്തിൽ അകർമകമായ അർഥത്തിലാണ്: നിലത്തു വീണുകിടന്ന ശൗൽ എഴുന്നേറ്റു. ‘എഴുന്നേറ്റു’ എന്നത് സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളമാണ്.'
- source_word: ἀπὸ τῆς γῆς
  choice: നിലത്തുനിന്ന്
  rationale: ഇവിടെ γῆ ഭൂമിയെയോ ദേശത്തെയോ അല്ല, ശൗൽ വീണുകിടന്ന നിലത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: കണ്ണുകൾ തുറന്നിരുന്നെങ്കിലും
  rationale: ഈ genitive absolute അനുബന്ധ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; തുറന്ന കണ്ണുകളും കാണാനാകാത്ത അവസ്ഥയും തമ്മിലുള്ള സന്ദർഭജന്യമായ വൈരുധ്യം ‘-എങ്കിലും’ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു. ഗ്രീക്കിലെ കർമണിഛായ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐδὲν ἔβλεπεν
  choice: അവൻ ഒന്നും കണ്ടില്ല
  rationale: കാഴ്ച പൂർണമായി ഇല്ലാതിരുന്നതിനെ ഗ്രീക്കിനോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: χειραγωγοῦντες
  choice: അവനെ കൈപിടിച്ചു നടത്തി
  rationale: χειραγωγέω സഹായം ആവശ്യമുള്ള ഒരാളെ കൈപിടിച്ചു നയിക്കുന്നതിനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; വ്യക്തമായ ആ ദൃശ്യരൂപം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: ദമസ്കൊസിൽ കൊണ്ടുചെന്നു
  rationale: εἰσάγω ഒരിടത്തിനകത്തേക്കു കൊണ്ടുപോകുന്നതാണ്. മുൻപുള്ള participle നടത്തിനയിച്ച രീതിയെ വ്യക്തമാക്കുന്നതിനാൽ, ‘കൊണ്ടുചെന്നു’ നഗരത്തിലെത്തിച്ചതിനെ സ്വാഭാവികമായി പറയുന്നു.
- source_word: δὲ
  choice: എന്നാൽ / അതുകൊണ്ട്
  rationale: മൂന്നു δέ-കൾ ആഖ്യാനത്തിന്റെ പുരോഗതിയും നേരിയ വൈരുധ്യവും അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ ഓരോന്നും യാന്ത്രികമായി ഒരേ പദത്താൽ നൽകാതെ, ആദ്യത്തേത് ‘എന്നാൽ’ എന്നും അവസാനത്തെ ഫലബന്ധം ‘അതുകൊണ്ട്’ എന്നും പ്രകടമാക്കി; മധ്യത്തേതിന്റെ ബന്ധം ‘-എങ്കിലും’ എന്ന ഘടനയിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: Σαῦλος
  choice: ശൗൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: Δαμασκόν
  choice: ദമസ്കൊസ്
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പ്രചാരമുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
