translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘കണ്ണുകൾ തുറന്നിരുന്നെങ്കിലും’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ വൈരുധ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അതിന്റെ കൂടുതൽ രൂപപരമായ പരിഭാഷ അടിക്കുറിപ്പിൽ ചേർത്തു.
