  rationale: «യോപ്പായിലുടനീളം ഇത് പ്രസിദ്ധമായി» accurately and naturally renders γνωστὸν δὲ ἐγένετο καθ’ ὅλης τῆς Ἰόππης as a city-wide becoming-known, while retaining the concise narrative connection and the direct rendering of ἐπίστευσαν πολλοὶ ἐπὶ τὸν κύριον.
