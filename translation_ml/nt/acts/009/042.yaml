id: ACT.9.42
reference: Acts 9:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: ml
  text: ഇത് യോപ്പായിലുടനീളം പ്രസിദ്ധമായി; അനേകർ കർത്താവിൽ വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: ഈ സംഭവം ... അറിഞ്ഞു
  rationale: ഗ്രീക്കിലെ കർത്താവില്ലാത്ത പ്രയോഗത്തിന്റെ ഫലാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. മുൻവാക്യത്തിലെ സംഭവമാണ് അറിഞ്ഞതെന്ന് ‘ഈ സംഭവം’ വ്യക്തമാക്കുന്നു; ആരാണ് അറിയിച്ചതെന്ന് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: ;
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യങ്ങളുടെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്താൻ പ്രത്യേക ബന്ധകപദത്തിനു പകരം വിരാമചിഹ്നത്തിലൂടെ ബന്ധം പ്രകടമാക്കി.
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: യോപ്പാ മുഴുവനും
  rationale: κατά + genitive സൂചിപ്പിക്കുന്ന പ്രദേശവ്യാപകമായ വിതരണവും ὅλης എന്നതിന്റെ സമഗ്രതയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰόππης
  choice: യോപ്പാ
  rationale: പുതിയനിയമത്തിലെ സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύωയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാള തുല്യം; aorist സൂചിപ്പിക്കുന്ന വിശ്വാസത്തിലേക്കുള്ള സംഭവപരമായ പ്രതികരണം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: πολλοὶ
  choice: അനേകർ
  rationale: പദത്തിന്റെ substantive ഉപയോഗം ‘അനേകർ’ സ്വാഭാവികമായി നൽകുന്നു; ‘ആളുകൾ’ എന്ന് അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἐπὶ τὸν κύριον
  choice: കർത്താവിൽ
  rationale: πιστεύωയോടുകൂടിയ ἐπί + accusative വിശ്വാസത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘കർത്താവിൽ വിശ്വസിച്ചു’ സമകാലിക മലയാളത്തിൽ വ്യക്തിയും സ്വാഭാവികവുമാണ്.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: κύριος എന്ന ബഹുമാനപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ പദവി നിലനിർത്തുന്നു; ‘യജമാനൻ’ ഇവിടെ അർഥഭാരം കുറയ്ക്കും.
theological_decisions:
- issue: πιστεύω + ἐπὶ τὸν κύριον എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: കർത്താവിൽ വിശ്വസിച്ചു
  alternative: കർത്താവിൽ ആശ്രയിച്ചു
  rationale: ഈ പ്രയോഗം കർത്താവിനെ വിശ്വാസത്തിന്റെ ലക്ഷ്യമായി അവതരിപ്പിക്കുന്നു. ‘വിശ്വസിച്ചു’ മൂലപദത്തോടു ചേർന്നുനിൽക്കുകയും വിശ്വാസത്തിന്റെ സ്വഭാവത്തെ പാഠം പറയുന്നതിലപ്പുറം നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: പ്രവൃത്തികളിൽ യേശുവിനെ സൂചിപ്പിക്കുന്ന ഈ പദവിയുടെ ബഹുമാനപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം ‘കർത്താവ്’ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ കഥനശൈലി. മൂലത്തിലെ രണ്ടു ഘടകങ്ങളുടെ അടുത്ത ബന്ധം അർദ്ധവിരാമത്തിലൂടെ നിലനിർത്തി; മതവിഭാഗസവിശേഷമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
