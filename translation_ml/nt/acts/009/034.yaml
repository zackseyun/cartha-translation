revisions:
- from: 'പത്രോസ് അവനോടു പറഞ്ഞു: “ഐനെയാസ്, മശീഹായായ യേശു[a] നിന്നെ സൗഖ്യമാക്കുന്നു. എഴുന്നേറ്റ് നിന്റെ കിടക്ക നീതന്നെ ഒരുക്കുക[b].” ഉടനെ അവൻ എഴുന്നേറ്റു.'
