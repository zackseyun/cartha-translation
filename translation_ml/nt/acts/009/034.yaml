source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: ml
  text: 'പത്രോസ് അവനോടു പറഞ്ഞു: “ഐനെയാസ്, യേശുവായ മശീഹാ[a] നിന്നെ സൗഖ്യമാക്കുന്നു. എഴുന്നേറ്റ് നിനക്കായി കിടക്ക ഒരുക്കുക[b].” ഉടനെ അവൻ എഴുന്നേറ്റു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യേശുക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “ക്രിസ്തു” എന്നും “മശീഹാ” എന്നും വിവർത്തനം ചെയ്യാം; ഇവിടെ അത് യേശുവിന്റെ സ്ഥാനപ്പേരായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “നിന്റെ കിടക്ക നീതന്നെ ഒരുക്കുക.” ഗ്രീക്ക് പ്രയോഗം കിടക്കയോ കിടപ്പിടമോ വിരിച്ച് ഒരുക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_clarity
lexical_decisions:
- source_word: Αἰνέα
  choice: ഐനെയാസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: ἰᾶταί
  choice: സൗഖ്യമാക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ പ്രഖ്യാപനാത്മകമായ ശക്തി നിലനിർത്തുന്നു; പ്രവൃത്തി പുരോഗമിക്കുകയാണെന്നോ ഇതിനകം പൂർത്തിയായെന്നോ അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: Ἰησοῦς Χριστός
  choice: മശീഹായായ യേശു
  rationale: Χριστός ഇവിടെ യേശുവിനുള്ള അഭിഷിക്തൻ എന്ന പദവിയായി ഗ്രഹിക്കാവുന്നതിനാൽ അതിന്റെ പദവിസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνάστηθι
  choice: എഴുന്നേറ്റ്
  rationale: കിടപ്പിലായിരുന്ന ആളോടുള്ള ആജ്ഞയെ ആധുനിക മലയാളത്തിൽ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: στρῶσον σεαυτῷ
  choice: നിന്റെ കിടക്ക നീതന്നെ ഒരുക്കുക
  rationale: στρώννυμι എന്നതിലെ കിടക്കയോ കിടപ്പിടമോ ഒരുക്കുക എന്ന അർഥവും σεαυτῷ നൽകുന്ന സ്വയം ചെയ്യുക എന്ന ഊന്നലും നിലനിർത്തുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: പ്രതികരണത്തിന്റെ തൽക്ഷണത സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἀνέστη
  choice: അവൻ എഴുന്നേറ്റു
  rationale: മുമ്പത്തെ ആജ്ഞയോട് പദപരമായ ബന്ധം നിലനിർത്തിക്കൊണ്ട് അതിന്റെ ഉടനെയുള്ള ഫലം വിവരിക്കുന്നു.
theological_decisions:
- issue: Ἰησοῦς Χριστός എന്ന പ്രയോഗത്തിലെ Χριστός-ന്റെ പദവിസ്വഭാവം
  choice: മശീഹായായ യേശു
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός എന്നത് ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന പദവിയായി വായിക്കാവുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ആ അർഥം വ്യക്തമാക്കുന്നു. അതേസമയം ‘യേശുക്രിസ്തു’ എന്ന പരമ്പരാഗതവും ഗ്രീക്കിനോട് രൂപപരമായി അടുത്തതുമായ വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘നീതന്നെ’ എന്നത് സൗഖ്യം ലഭിച്ച വ്യക്തിയുടെ പുനഃസ്ഥാപിക്കപ്പെട്ട പ്രവർത്തനശേഷിയിലുള്ള ഗ്രീക്ക് ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
