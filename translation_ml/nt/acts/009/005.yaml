id: ACT.9.5
reference: Acts 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “കർത്താവേ[a], അങ്ങ് ആരാണ്?” അവൻ പറഞ്ഞു: “നീ പീഡിപ്പിക്കുന്ന യേശുവാണ് ഞാൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അയ്യാ.” ഗ്രീക്കിലെ κύριε എന്ന പദം ആദരസൂചകമായ അഭിസംബോധനയായും ഉപയോഗിക്കാം; വെളിപ്പാടിന്റെ ഈ സന്ദർഭത്തിൽ ഇവിടെ “കർത്താവേ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ചോദിച്ചു / പറഞ്ഞു
  rationale: λέγω എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘പറഞ്ഞു’ എന്നാണ്. ആദ്യ വാക്യം നേരിട്ടുള്ള ചോദ്യമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നും, മറുപടിയിൽ ‘പറഞ്ഞു’ എന്നും നൽകി.
- source_word: δέ
  choice: വാക്യഘടനയിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. ഓരോ തവണയും ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായ വൈരുധ്യമോ ഭാരമോ സൃഷ്ടിക്കുമെന്നതിനാൽ പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല.
- source_word: Τίς εἶ
  choice: അങ്ങ് ആരാണ്?
  rationale: വ്യക്തിയെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകി. ആദരസൂചകമായ അഭിസംബോധനയോടു യോജിക്കാൻ ‘അങ്ങ്’ ഉപയോഗിച്ചു.
- source_word: κύριε
  choice: കർത്താവേ
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണ തിരുവെഴുത്തുപരമായ പരിഭാഷ നിലനിർത്തുന്നു. അതേസമയം ഇവിടെ ഇത് ആദരസൂചകമായ അഭിസംബോധന മാത്രമായിരിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: Ἐγώ εἰμι
  choice: ഞാൻ
  rationale: ‘യേശുവാണ് ഞാൻ’ എന്ന മലയാള വാക്യക്രമം ഗ്രീക്കിലെ സ്വയംതിരിച്ചറിയിക്കലും ἐγώ എന്നതിന്റെ ഊന്നലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അധിക ദൈവശാസ്ത്രാർഥം ചേർക്കുന്നില്ല.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: പേരിന്റെ പ്രചാരത്തിലുള്ള മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: ὃν σὺ διώκεις
  choice: നീ പീഡിപ്പിക്കുന്ന
  rationale: ബന്ധസർവനാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. διώκω ഇവിടെ തുടരുന്ന ശത്രുതാപരമായ പീഡനത്തെ സൂചിപ്പിക്കുന്നു; വ്യക്തമായ σὺ ‘നീ’ എന്നായി നൽകി.
theological_decisions:
- issue: സംസാരിക്കുന്നത് ആരെന്നു പൂർണമായി വെളിപ്പെടുന്നതിനു മുമ്പുള്ള κύριε എന്ന അഭിസംബോധന
  choice: കർത്താവേ
  alternative: യജമാനനേ
  rationale: വെളിപ്പാടിന്റെ പശ്ചാത്തലത്തിൽ ‘കർത്താവേ’ എന്നത് ആഖ്യാനത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു. എങ്കിലും സൗലിന്റെ വാക്ക് ഈ നിമിഷത്തിൽ പൂർണമായ വിശ്വാസപ്രഖ്യാപനമാണെന്ന് നിർബന്ധമായി വ്യാഖ്യാനിക്കാതിരിക്കാൻ ആദരസൂചകമായ മറ്റൊരു അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ആദ്യത്തെ εἶπεν ചോദ്യത്തിന്റെ സ്വഭാവമനുസരിച്ച് ‘ചോദിച്ചു’ എന്നു നൽകി. മറുപടി പറയുന്നവനിലേക്കുള്ള കർത്തൃമാറ്റം വ്യക്തമാക്കാനും ആദരഭാവം നിലനിർത്താനും ‘അവിടുന്ന്’ ഉപയോഗിച്ചു; യേശുവിന്റെ നേരിട്ടുള്ള അഭിസംബോധനയിൽ ഗ്രീക്കിലെ വ്യക്തമായ σὺ അനുസരിച്ച് ‘നീ’ നിലനിർത്തി.
