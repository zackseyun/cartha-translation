id: ACT.9.18
reference: Acts 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: ml
  text: ഉടൻതന്നെ അവന്റെ കണ്ണുകളിൽനിന്ന് ചെതുമ്പലുകൾപോലെയുള്ള എന്തോ അടർന്നുവീണു[a]. അവന് വീണ്ടും കാഴ്ച ലഭിച്ചു; പിന്നെ അവൻ എഴുന്നേറ്റ് സ്നാനം ഏറ്റു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ കണ്ണുകളിൽനിന്ന് ചെതുമ്പലുകൾപോലെ അടർന്നുവീണു.” ഗ്രീക്കിൽ ഇത് ഒരു ഉപമയായാണ് പറഞ്ഞിരിക്കുന്നത്; അവ യഥാർഥ ചെതുമ്പലുകളായിരുന്നുവെന്ന് ഉറപ്പിച്ചു പറയുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: ഉടൻതന്നെ
  rationale: സംഭവത്തിന്റെ തൽക്ഷണസ്വഭാവം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: ἀπέπεσαν
  choice: അടർന്നുവീണു
  rationale: ἀποπίπτω സൂചിപ്പിക്കുന്ന, ഒരു ഉപരിതലത്തിൽനിന്ന് വേർപെട്ടു വീഴുന്ന ഭാവം കണ്ണുകളുടെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: അവന്റെ കണ്ണുകളിൽനിന്ന്
  rationale: ἀπό സഹിതമുള്ള വേർപാടിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὡς λεπίδες
  choice: ചെതുമ്പലുകൾപോലെ എന്തോ
  rationale: ὡς എന്ന ഉപമാസൂചകം നിലനിർത്തുകയും അവ യഥാർഥ ചെതുമ്പലുകളായിരുന്നുവെന്ന് ഉറപ്പിച്ചു പറയാതിരിക്കുകയും ചെയ്യുന്നു; λεπίδες എന്ന ദൃശ്യബിംബം ‘ചെതുമ്പലുകൾ’ സംരക്ഷിക്കുന്നു.
- source_word: ἀνέβλεψεν
  choice: അവന് വീണ്ടും കാഴ്ച ലഭിച്ചു
  rationale: രോഗശാന്തിയുടെ ഈ സന്ദർഭത്തിൽ ἀναβλέπω മുകളിലേക്കു നോക്കുക എന്നതിലുപരി കാഴ്ച വീണ്ടെടുക്കുക എന്നാണ് അർഥം.
- source_word: τε καὶ
  choice: ; പിന്നെ
  rationale: ബന്ധിതമായ തുടർപ്രവൃത്തികളുടെ ക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀναστάς
  choice: അവൻ എഴുന്നേറ്റ്
  rationale: അടുത്ത പ്രവൃത്തിയിലേക്കുള്ള ആഖ്യാനക്രമം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐβαπτίσθη
  choice: സ്നാനം ഏറ്റു
  rationale: ദൈവശാസ്ത്രപരമായി പരിചിതമായ മലയാളപ്രയോഗം ഉപയോഗിച്ച് ക്രിയയുടെ കർമണി അർഥം നിലനിർത്തുന്നു; സ്നാനത്തിന്റെ രീതി വാക്യം നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: βαπτίζω എന്ന ക്രിയയെ സഭാവിഭാഗപരമായ പ്രത്യേകത ചുമത്താതെ പരിഭാഷപ്പെടുത്തൽ
  choice: സ്നാനം ഏറ്റു
  alternative: മുക്കപ്പെട്ടു
  rationale: വാക്യം സ്നാനത്തിന്റെ രീതി വ്യക്തമാക്കുന്നില്ല. ‘സ്നാനം ഏറ്റു’ സ്ഥാപിതവും നിഷ്പക്ഷവുമായ മലയാളപ്രയോഗമാണ്; ‘മുക്കപ്പെട്ടു’ ഒരു പ്രത്യേക രീതിയെ അനാവശ്യമായി മുൻനിർത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ചെതുമ്പലുകൾപോലെ എന്തോ’ എന്ന പ്രയോഗം മൂലത്തിലെ ഉപമയും അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു; ‘സ്നാനം ഏറ്റു’ സഭാവിഭാഗപരമായ രീതിനിർണയം ഒഴിവാക്കുന്നു.
