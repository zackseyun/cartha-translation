id: ACT.9.1
reference: Acts 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: ml
  text: എന്നാൽ ശൗൽ അപ്പോഴും കർത്താവിന്റെ ശിഷ്യന്മാർക്കെതിരെ ഭീഷണിയും കൊലപാതകവും[a] ശ്വസിച്ചുകൊണ്ട് മഹാപുരോഹിതന്റെ അടുക്കൽ ചെന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വധവും.’ ഗ്രീക്ക് φόνος എന്ന പദത്തിന് കൊല, വധം എന്നീ അർഥങ്ങൾ വരാം. ‘കൊലപാതകം’ അതിന്റെ ധാർമിക ഗൗരവം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തിൽനിന്ന് ശൗലിലേക്കുള്ള മടക്കത്തിൽ കാണുന്ന നേരിയ വൈരുധ്യവും ആഖ്യാനമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: ἔτι
  choice: അപ്പോഴും
  rationale: ശൗലിന്റെ ശത്രുതാപരമായ നില മുൻസന്ദർഭത്തിൽനിന്ന് തുടർന്നുകൊണ്ടിരുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐμπνέων
  choice: ശ്വസിച്ചുകൊണ്ട്
  rationale: ശൗലിന്റെ ജീവിതശ്വാസംപോലും ഭീഷണിയും കൊലപാതകവും നിറഞ്ഞതായിരുന്നു എന്ന മൂലപാഠത്തിലെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: ἀπειλῆς
  choice: ഭീഷണി
  rationale: ശത്രുതാപരമായ ഭീഷണിപ്പെടുത്തലിനെ കൃത്യമായും സംക്ഷിപ്തമായും അറിയിക്കുന്നു.
- source_word: φόνου
  choice: കൊലപാതകം
  rationale: നിയമവിരുദ്ധവും ധാർമികമായി കുറ്റകരവുമായ മനുഷ്യവധത്തിന്റെ ഗൗരവം നൽകുന്നു; പദത്തിന് പൊതുവായ കൊല/വധം എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: εἰς τοὺς μαθητὰς
  choice: ശിഷ്യന്മാർക്കെതിരെ
  rationale: ശത്രുതയുടെ ദിശ സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സന്ദർഭോചിതമായ വിരുദ്ധാർഥബലം വ്യക്തമാക്കുന്നു.
- source_word: μαθητὰς
  choice: ശിഷ്യന്മാർ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ യേശുവിന്റെ പ്രതിബദ്ധരായ അനുയായികൾക്കുള്ള സ്ഥാപിതവും കൃത്യവുമായ മലയാളപദമാണ്.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ബന്ധസൂചകമായ ഗ്രീക്ക് രൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ശിഷ്യന്മാർ കർത്താവിനുള്ളവരാണെന്ന ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προσελθὼν
  choice: അടുക്കൽ ചെന്നു
  rationale: മഹാപുരോഹിതനെ സമീപിച്ച ചലനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; വാക്യത്തിന്റെ തുടർപ്രവർത്തനം അടുത്ത വാക്യത്തിലാണെന്ന മൂലഘടനയോടും യോജിക്കുന്നു.
- source_word: ἀρχιερεῖ
  choice: മഹാപുരോഹിതൻ
  rationale: ഏകവചനത്തിലുള്ള ἀρχιερεύς എന്ന പദത്തിന്റെ പതിവും വ്യക്തവുമായ മലയാളപരിഭാഷയാണ്.
theological_decisions:
- issue: τοῦ κυρίου എന്നതിലെ κύριος-ന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ഈ സന്ദർഭത്തിൽ ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ യേശുവിനെ സൂചിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന സ്ഥാനനാമമാണ്; മലയാള ക്രൈസ്തവ ഭാഷയിൽ ‘കർത്താവ്’ കൃത്യവും വിഭാഗാതീതവുമായ പതിവുപ്രയോഗമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ഭീഷണിയും കൊലപാതകവും ശ്വസിച്ചുകൊണ്ട്’ എന്ന അസാധാരണമായെങ്കിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗം മൂലഗ്രീക്കിലെ ഉജ്ജ്വലരൂപകം സംരക്ഷിക്കാൻ മനഃപൂർവം നിലനിർത്തി.
