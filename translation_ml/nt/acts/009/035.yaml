id: ACT.9.35
reference: Acts 9:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: ml
  text: ലുദ്ദയിലും ശാരോൻ പ്രദേശത്തും താമസിച്ചിരുന്ന എല്ലാവരും അവനെ കണ്ടു; അവർ കർത്താവിലേക്കു തിരിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδαν
  choice: കണ്ടു
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ഇവിടെ സുഖം പ്രാപിച്ച ഐനെയാസിനെ നേരിൽ കണ്ടതിനെ ലളിതമായി സൂചിപ്പിക്കുന്നു.
- source_word: πάντες οἱ κατοικοῦντες
  choice: താമസിച്ചിരുന്ന എല്ലാവരും
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Λύδδα
  choice: ലുദ്ദ
  rationale: ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: τὸν Σαρῶνα
  choice: ശാരോൻ പ്രദേശം
  rationale: Σαρών ഒരു വിശാലമായ ഭൂപ്രദേശത്തെയോ സമതലത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്ഥലപ്പേരെന്ന അർഥം വ്യക്തമാക്കാൻ ‘പ്രദേശം’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻപു പറഞ്ഞ ജനങ്ങളെ വീണ്ടും സൂചിപ്പിച്ച് തുടർന്നുണ്ടായ പ്രതികരണം മലയാളത്തിൽ സുഗമമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: കർത്താവിലേക്കു തിരിഞ്ഞു
  rationale: മാനസാന്തരത്തോടും വിശ്വാസത്തോടും കൂടിയ ദിശാമാറ്റത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ പ്രയോഗം നിലനിർത്തുന്നു; ‘മടങ്ങിവന്നു’ എന്ന മുൻബന്ധസൂചനയോ ‘മതം മാറി’ എന്ന അതിവ്യാഖ്യാനമോ ഒഴിവാക്കുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: പുതിയ നിയമത്തിലെ κύριος എന്ന പദവിക്കുള്ള പ്രചാരമുള്ളതും മാന്യവുമായ മലയാള പദം; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘യേശു’ ഇവിടെ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മൂലപാഠത്തെ പിന്തുടർന്ന് ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: കർത്താവായ യേശു
  rationale: സന്ദർഭം ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നതെങ്കിലും ഗ്രീക്കിൽ τὸν κύριον എന്നു മാത്രമേയുള്ളൂ; അതിനാൽ സൂചിതവ്യക്തിയെ വിശദീകരിച്ച് പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: ἐπέστρεψαν എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ‘തിരിഞ്ഞു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മടങ്ങിവന്നു’ / ‘മതം മാറി’
  rationale: ‘തിരിഞ്ഞു’ എന്നത് മാനസാന്തരത്തിന്റെയും വിശ്വാസത്തിന്റെയും ആശയം ഉൾക്കൊള്ളുമ്പോഴും മുൻകാല വിശ്വാസബന്ധമോ പ്രത്യേക സിദ്ധാന്തപരമായ പരിവർത്തനഭാഷയോ നിർബന്ധമായി ചുമത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സ്ഥലനാമവും പ്രദേശസൂചനയും സ്വാഭാവികമായി ചേർത്തു; വാക്യത്തിന്റെ രണ്ടു ഘട്ടങ്ങളായ കാണലും കർത്താവിലേക്കുള്ള തിരിവും അർധവിരാമംകൊണ്ട് വ്യക്തമാക്കി.
