id: ACT.9.31
reference: Acts 9:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: ml
  text: അങ്ങനെ, യെഹൂദ്യ, ഗലീല, ശമര്യ എന്നീ പ്രദേശങ്ങളിലെങ്ങുമുള്ള സഭയ്ക്ക് സമാധാനം ഉണ്ടായിരുന്നു; അത് പണിതുയർത്തപ്പെട്ടുകൊണ്ടിരുന്നു.[a] കർത്താവിനോടുള്ള ഭയത്തിലും പരിശുദ്ധാത്മാവിന്റെ പ്രോത്സാഹനത്തിലും[b] ജീവിച്ചുകൊണ്ട്, അത് പെരുകിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘സഭ’ എന്നതിനുപകരം ‘സഭകൾ’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: ‘പരിശുദ്ധാത്മാവിന്റെ ആശ്വാസത്തിൽ’ എന്നോ ‘പരിശുദ്ധാത്മാവിന്റെ ഉദ്ബോധനത്തിൽ’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: സഭ
  rationale: SBLGNT-യിലെ ഏകവചനത്തെ പിന്തുടർന്ന് വിവിധ പ്രദേശങ്ങളിലാകെ വ്യാപിച്ചിരിക്കുന്ന സഭയെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്നു; ബഹുവചന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: യെഹൂദ്യയിലും ഗലീലയിലും ശമര്യയിലും എല്ലായിടത്തുമുള്ള
  rationale: κατάയുടെ പ്രദേശവ്യാപക അർഥവും ὅλης എന്നതിന്റെ സമഗ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἶχεν εἰρήνην
  choice: സമാധാനം ഉണ്ടായിരുന്നു
  rationale: εἰρήνηയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും പീഡനത്തിൽനിന്നുള്ള ആശ്വാസവും സഭയിലെ സ്ഥിരതയും ഉൾക്കൊള്ളാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: οἰκοδομουμένη
  choice: പണിതുയർത്തപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃതന്തത്തിന്റെ തുടർച്ചയും സഭയെ കെട്ടിടമായി കാണുന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: πορευομένη
  choice: ജീവിച്ചുകൊണ്ട്
  rationale: ഇവിടെ പദാനുപദമായ ‘നടക്കുക’ എന്നതിലുപരി ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന ലൂക്കോസിന്റെ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: കർത്താവിനോടുള്ള ഭയത്തിൽ
  rationale: ഭീതിയായി മാത്രം ചുരുക്കാതെ ഭക്ത്യാദരവും അനുസരണവും ഉൾക്കൊള്ളുന്ന പരമ്പരാഗത ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണ ബൈബിൾ പരിഭാഷ; സന്ദർഭം അനുവദിക്കുന്നതിലധികം വ്യക്തമായി ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവിന്റെ പ്രോത്സാഹനത്തിൽ
  rationale: παράκλησις എന്നതിന്റെ പ്രോത്സാഹനം, ആശ്വാസം, ഉദ്ബോധനം എന്നീ അർഥവ്യാപ്തികളിൽ വളർച്ചയുടെ സന്ദർഭത്തിന് യോജിച്ച ‘പ്രോത്സാഹനം’ മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവിന്റെ
  rationale: ആധുനിക നിലവാരമലയാളത്തിലെ അംഗീകൃതവും മാന്യവുമായ പ്രയോഗം.
- source_word: ἐπληθύνετο
  choice: പെരുകിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ എണ്ണവർധനയും ഏകവചന സഭയോടുള്ള വ്യാകരണാനുരൂപതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκκλησίαയുടെ എണ്ണവും സൂചനയും
  choice: 'സമൂഹവാചിയായ ഏകവചനം: ‘സഭ’'
  alternative: 'ബഹുവചന പാഠഭേദം: ‘സഭകൾ’'
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ നാമവും അനുബന്ധ ക്രിയാരൂപങ്ങളും ഏകവചനത്തിലാണ്; അതിനാൽ വിവിധ പ്രദേശങ്ങളിലുള്ള ഏകസഭയാണ് മുഖ്യവാചകത്തിൽ. ശ്രദ്ധേയമായ ബഹുവചന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ‘കർത്താവിനോടുള്ള ഭയം’ എന്നതിന്റെ അർഥം
  choice: ഭക്ത്യാദരവും അനുസരണപൂർവമായ ഭയവും
  alternative: ഭീകരഭീതി; പൊതുവായ മതഭക്തി
  rationale: വേദപുസ്തകത്തിലെ സമ്പന്നമായ അർഥവ്യാപ്തി നിലനിർത്താൻ ‘ഭയം’ എന്ന പദം സംരക്ഷിക്കുന്നു; അത് വെറും ഭീകരഭീതിയായി വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: പരിശുദ്ധാത്മാവുമായി ബന്ധപ്പെട്ട παράκλησις എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രോത്സാഹനം
  alternative: ആശ്വാസം; ഉദ്ബോധനം
  rationale: സമാധാനം, പണിതുയർത്തപ്പെടൽ, വർധന എന്നിവയുടെ സന്ദർഭത്തിൽ ‘പ്രോത്സാഹനം’ സ്വാഭാവികമാണ്; എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ ബഹുവിധത്വം അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ ശൈലി. ഗ്രീക്കിലെ നിർമാണരൂപകം ‘പണിതുയർത്തപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്നതിലൂടെ നിലനിർത്തി; ജീവിതാചരണത്തെ സൂചിപ്പിക്കുന്ന πορευομένη സ്വാഭാവികതയ്ക്കായി ‘ജീവിച്ചുകൊണ്ട്’ എന്നു നൽകി. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
