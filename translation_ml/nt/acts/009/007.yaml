id: ACT.9.7
reference: Acts 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: ml
  text: അവനോടൊപ്പം യാത്രചെയ്തിരുന്ന പുരുഷന്മാർ സംസാരിക്കാനാകാതെ നിന്നു; അവർ ശബ്ദം[a] കേട്ടെങ്കിലും ആരെയും കണ്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വരം.” ഗ്രീക്ക് പദത്തിന് “സ്വരം” എന്നും “ശബ്ദം” എന്നും അർഥമാകാം; പ്രവൃത്തികൾ 22:9 താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: പുരുഷന്മാർ
  rationale: οἱ ἄνδρες എന്നതിന്റെ നേരായ അർഥം നിലനിർത്തുന്നു. δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യബന്ധത്തിലൂടെ അതിന്റെ സ്വാഭാവിക പ്രവാഹം പ്രകടമാക്കുന്നു.
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: അവനോടൊപ്പം യാത്രചെയ്തിരുന്ന
  rationale: συνοδεύω യാത്രയിൽ കൂടെയുണ്ടാകുക എന്ന ആശയം നൽകുന്നു; ആ സന്ദർഭം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἱστήκεισαν
  choice: നിന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഇവിടെ കാണുന്ന നിലാവസ്ഥാസൂചകമായ പ്രയോഗം സംക്ഷിപ്തമായി പകർത്തുന്നു; ‘നിന്നുപോയി’ എന്നു പറഞ്ഞ് നിൽക്കാൻ തുടങ്ങിയെന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐνεοί
  choice: വാക്കറ്റവരായി
  rationale: ഞെട്ടലോ വിസ്മയമോ മൂലം സംസാരിക്കാനാകാതെ നിൽക്കുന്ന അവസ്ഥയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; സ്ഥിരമായ മൂകത്വം ധ്വനിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: ശബ്ദം കേട്ടെങ്കിലും
  rationale: φωνήയ്ക്ക് ‘ശബ്ദം’ എന്നും ‘സ്വരം’ എന്നും അർഥമാകാം. ‘ശബ്ദം’ മൂലപദത്തിന്റെ വിശാലമായ അർഥപരിധി നിലനിർത്തുകയും പ്രവൃത്തികൾ 22:9-നോടുള്ള പാഠപരമായ പിരിമുറുക്കം നിർബന്ധമായി പരിഹരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μηδένα δὲ θεωροῦντες
  choice: ആരെയും കണ്ടില്ല
  rationale: θεωρέω എന്നതിന്റെ കാണുക/നിരീക്ഷിക്കുക എന്ന അടിസ്ഥാനാർഥവും μηδένα എന്നതിന്റെ വ്യക്തിസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശൗലിന്റെ സഹയാത്രികർ എന്താണ് കേട്ടത് എന്നതിനെക്കുറിച്ച് പ്രവൃത്തികൾ 9:7-നും 22:9-നും ഇടയിൽ തോന്നാവുന്ന പിരിമുറുക്ക്
  choice: φωνή എന്നത് മുഖ്യപാഠത്തിൽ ‘ശബ്ദം’ എന്നു പരിഭാഷപ്പെടുത്തി, ‘സ്വരം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുക
  alternative: മുഖ്യപാഠത്തിൽ ‘സ്വരം’ എന്നു നൽകി പിരിമുറുക്ക് പരിഹരിക്കാതെ വിടുക
  rationale: φωνή എന്ന ഗ്രീക്ക് പദത്തിന് ശബ്ദം, സ്വരം എന്നീ രണ്ടർഥങ്ങളും സാധ്യമാണ്. ‘ശബ്ദം’ എന്ന പരിഭാഷ അർഥപരിധിക്കുള്ളിൽ നിന്നുകൊണ്ട് ഒരു വ്യാഖ്യാനപരമായ സമന്വയം നിർബന്ധിക്കുന്നില്ല; അടിക്കുറിപ്പ് യഥാർഥമായ മറ്റൊരു സാധ്യത വായനക്കാരന് മുന്നിൽ വെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പങ്കാളിക്രിയാരൂപങ്ങൾ മലയാളത്തിലെ സ്വാഭാവിക സമാപിക ക്രിയകളായി നൽകിയിരിക്കുന്നു; അർഥവ്യക്തതയ്ക്കായി രണ്ടാം ഉപവാക്യത്തിൽ ‘അവർ’ ചേർത്തിരിക്കുന്നു.
