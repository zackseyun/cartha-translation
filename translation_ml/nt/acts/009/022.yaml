  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: ml
  text: എന്നാൽ ശൗൽ കൂടുതൽ ശക്തനായിക്കൊണ്ടിരുന്നു; യേശുതന്നെയാണ് മശീഹാ[a] എന്നു തെളിയിച്ചുകൊണ്ട്, ദമസ്‌കൊസിൽ താമസിച്ചിരുന്ന യഹൂദരെ അദ്ദേഹം ആശയക്കുഴപ്പത്തിലാക്കിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തു.’ ഗ്രീക്ക് പദമായ Χριστός ഇവിടെ അതിന്റെ യഹൂദ മശീഹാപരമായ അർഥം നിലനിർത്താൻ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον ἐνεδυναμοῦτο
  choice: കൂടുതൽ കൂടുതൽ ശക്തിപ്രാപിക്കുകയും ചെയ്തു
  rationale: μᾶλλον എന്ന തീവ്രതയും ἐνεδυναμοῦτο എന്ന അപൂർണ്ണകാല ക്രിയയുടെ തുടർച്ചയായ വളർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ശക്തിയുടെ ഉറവിടം ദൈവികമാണോ ആന്തരികമാണോ എന്നു വാചകം നിർണ്ണയിക്കുന്നില്ല.
- source_word: συνέχυννεν
  choice: ആശയക്കുഴപ്പത്തിലാക്കുകയും ചെയ്തു
  rationale: വാദത്തിലൂടെ എതിരാളികളെ കുഴപ്പത്തിലാക്കുക, അവരുടെ നിലപാട് താറുമാറാക്കുക എന്ന ശക്തമായ സന്ദർഭാർഥം നൽകുന്നു.
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: ദമസ്‌കൊസിൽ താമസിച്ചിരുന്ന യഹൂദരെ
  rationale: പരാമർശിക്കുന്നത് എല്ലാ യഹൂദരെയുമല്ല, ദമസ്‌കൊസിൽ താമസിച്ചിരുന്നവരെയാണെന്ന് വ്യക്തമായി പരിമിതപ്പെടുത്തുന്നു.
- source_word: συμβιβάζων
  choice: തെളിയിച്ചുകൊണ്ട്
  rationale: തെളിവുകളും വാദങ്ങളും കൂട്ടിച്ചേർത്ത് ഒരു നിഗമനം സ്ഥാപിക്കുന്ന ക്രിയാവിശേഷണ പങ്കിന്റെ യുക്തിപരമായ ബലം നിലനിർത്തുന്നു.
- source_word: οὗτός
  choice: യേശുതന്നെയാണ്
  rationale: ഗ്രീക്ക് നിർദ്ദേശകസർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെയാണ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു; മലയാളത്തിൽ അവ്യക്തമായ ‘ഇവൻ’ എന്നതിനുപകരം സന്ദർഭത്തിലെ വ്യക്തിയായ യേശുവിനെ തുറന്നുപറയുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമമല്ല, വാഗ്ദത്ത അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന യഹൂദ മശീഹാപദവിയാണ്.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ὁ χριστός ഇവിടെ യേശുവിനെ വാഗ്ദത്ത അഭിഷിക്തനായി തിരിച്ചറിയുന്ന പദവിയായതിനാൽ ‘മശീഹാ’ എന്ന് നൽകിയിരിക്കുന്നു; ‘ക്രിസ്തു’ എന്ന രൂപവും സാധ്യമാണ്.
- issue: οὗτός എന്ന നിർദ്ദേശകത്തിന്റെ സൂചന
  choice: യേശുതന്നെയാണ്
  alternative: ഇവൻ തന്നെയാണ്
  rationale: മുൻസന്ദർഭത്തിൽ പ്രസംഗിക്കപ്പെടുന്ന യേശുവാണ് സൂചിതൻ. പേര് ചേർക്കുന്നത് മലയാളത്തിൽ പരാമർശം വ്യക്തമാക്കുന്നു; ‘തന്നെയാണ്’ മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘ശക്തിപ്രാപിക്കുക,’ ‘തെളിയിക്കുക’ എന്നീ രൂപങ്ങൾ ഔപചാരികതയും സാധാരണ വായനാസൗകര്യവും സമതുലിതമാക്കുന്നു; വാക്യത്തിലെ തുടർച്ചയും കാരണരീതിയും മലയാളത്തിലെ ക്രിയാവിശേഷണ ഘടനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
