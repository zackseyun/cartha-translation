id: ACT.9.11
reference: Acts 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος πρὸς αὐτόν· ⸀Ἀναστὰς πορεύθητι ἐπὶ τὴν ῥύμην τὴν καλουμένην Εὐθεῖαν καὶ ζήτησον ἐν οἰκίᾳ Ἰούδα Σαῦλον ὀνόματι Ταρσέα, ἰδοὺ γὰρ προσεύχεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/011.yaml
  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: ml
  text: 'കർത്താവ് അവനോടു പറഞ്ഞു: “എഴുന്നേറ്റ് ‘നേർവീഥി’ എന്നു വിളിക്കപ്പെടുന്ന തെരുവിലേക്കു പോകുക; യൂദാസിന്റെ വീട്ടിൽ തർസൊസിൽനിന്നുള്ള ശൗൽ എന്ന ഒരാളെ അന്വേഷിക്കുക; കാരണം, ഇതാ, അവൻ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയ നിയമത്തിൽ κύριος എന്ന അധികാരസൂചക സ്ഥാനപ്പേരിന്റെ സ്വാഭാവികവും പതിവുമായ മലയാളരൂപം; ഈ വാക്യത്തിൽ ‘യേശു’ എന്ന് വികസിപ്പിക്കാതെ ഗ്രീക്ക് പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Ἀναστὰς πορεύθητι
  choice: എഴുന്നേറ്റ് ... പോകുക
  rationale: ആജ്ഞാർഥക ക്രിയയോടു ചേർന്ന ക്രിയാംശത്തിന്റെ പ്രവർത്തനക്രമവും നേരിട്ടുള്ള ആജ്ഞാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: ‘നേർവീഥി’ എന്നു വിളിക്കപ്പെടുന്ന തെരുവ്
  rationale: ῥύμη എന്നത് നഗരത്തിലെ തെരുവിനെയും Εὐθεῖαν അതിന്റെ പേരിനെയും സൂചിപ്പിക്കുന്നു; പേരിന്റെ അർഥവും നാമകരണഘടനയും വ്യക്തമാക്കുന്നു.
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: യൂദായുടെ വീട്ടിൽ
  rationale: ശൗലിനെ അന്വേഷിക്കേണ്ട സ്ഥലം സൂചിപ്പിക്കുന്ന ἐν-പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളം.
- source_word: ζήτησον
  choice: അന്വേഷിക്കുക
  rationale: ζητέω ഇവിടെ ഒരാളെ തേടുക/അന്വേഷിക്കുക എന്നർഥം; ‘കണ്ടെത്തുക’ എന്നു പറഞ്ഞ് ഫലം ഉറപ്പാക്കുന്നില്ല.
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: തർസൊസുകാരനായ ശൗൽ എന്നു പേരുള്ള ഒരാൾ
  rationale: ὀνόματι പേരിനെ സൂചിപ്പിക്കുകയും Ταρσέα തർസൊസിൽനിന്നുള്ള ഉത്ഭവത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമത്തിൽ രണ്ടും നിലനിർത്തുന്നു.
- source_word: ἰδοὺ γὰρ
  choice: ഇതാ
  rationale: ἰδούവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഭാവം ‘ഇതാ’ നിലനിർത്തുന്നു; മുൻ ആജ്ഞയുടെ കാരണബന്ധം സന്ദർഭത്തിലും വാക്യബന്ധത്തിലും വ്യക്തമായതിനാൽ γάρ പ്രത്യേകം യാന്ത്രികമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: προσεύχεται
  choice: പ്രാർഥിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിൽ അപ്പോൾ തുടരുന്ന പ്രവൃത്തിയെ മലയാളത്തിലെ പുരോഗമനരൂപം വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: കർത്താവ്
  alternative: കർത്താവായ യേശു
  rationale: സമീപസന്ദർഭം സംസാരിക്കുന്നവനെ തിരിച്ചറിയിക്കുന്നുണ്ടെങ്കിലും ഈ ഉപവാക്യത്തിൽ ഗ്രീക്ക് പാഠം κύριος എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യക്തീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. ‘കർത്താവ്’, ‘ഇതാ’ എന്നിവ മൂലപാഠത്തിന്റെ ഗൗരവവും ശ്രദ്ധാകർഷണവും നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്.
