    rationale: ἰδοὺ γὰρ introduces the reason or supporting basis for the instruction. “ഇതാ” represents ἰδού, but “കാരണം” (or an equivalent) is needed to preserve γάρ.
  - severity: medium
    issue: Ἰούδα is rendered “യൂദാ” rather than the standard Malayalam form for Judas.
    rationale: In this context Ἰούδας is the man Judas, owner of the house. “യൂദാസ്” distinguishes the personal name from Judah and follows standard Malayalam biblical naming.
