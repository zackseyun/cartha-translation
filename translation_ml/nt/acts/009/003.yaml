lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: അവൻ യാത്രചെയ്ത് ... അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive സമകാലികമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ‘...കൊണ്ടിരിക്കുമ്പോൾ’ ഘടന അതു വ്യക്തമാക്കുന്നു; δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേകം പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല.
- source_word: ἐγένετο αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: ദമസ്കൊസിനോട് അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: ഗ്രീക്കിലെ ἐγένετο + accusative-infinitive എന്ന ആഖ്യാനഘടന അക്ഷരാർഥത്തിൽ പകർത്തുന്നത് മലയാളത്തിൽ കൃത്രിമമാകും. present infinitive ആയ ἐγγίζειν സൂചിപ്പിക്കുന്ന പുരോഗമനഭാവം ‘അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ’ നിലനിർത്തുന്നു; dative നഗരത്തിലേക്കുള്ള സമീപനമാണ് സൂചിപ്പിക്കുന്നത്, നഗരപ്രവേശമല്ല.
- source_word: ἐξαίφνης τε
  choice: പെട്ടെന്ന്
  rationale: ἐξαίφνης സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വം നൽകുന്നു. τε ലഘുവായ ബന്ധകമാണ്; മലയാള വാക്യക്രമത്തിൽ അതിന് വേറെ ‘കൂടാതെ/ഉം’ ചേർക്കേണ്ടതില്ല.
- source_word: περιήστραψεν
  choice: അവന്റെ ചുറ്റും മിന്നി
  rationale: περι- എന്ന ഘടകം വെളിച്ചം അവനെ ചുറ്റിയെന്ന അർഥവും ക്രിയയുടെ സന്ദർഭം പെട്ടെന്നുള്ള പ്രകാശമിന്നലും നൽകുന്നു. ‘മിന്നി’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: φῶς
  choice: ഒരു വെളിച്ചം
  rationale: ഈ സന്ദർഭത്തിലെ അനിർദ്ദിഷ്ടമായ anarthrous നാമത്തെ മലയാളത്തിൽ ‘ഒരു വെളിച്ചം’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ആകാശത്തിൽനിന്ന്
  rationale: οὐρανός എന്നതിന് ‘ആകാശം’ എന്നും ‘സ്വർഗം’ എന്നും അർഥമാകാം. മലയാളത്തിൽ ദൃശ്യമായി മുകളിൽനിന്നുള്ള പ്രകാശത്തിന് ‘ആകാശം’ സ്വാഭാവികമാണ്; ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ‘സ്വർഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വെളിപ്പാടിന്റെ സന്ദർഭത്തിൽ οὐρανός എന്നതിന്റെ അർഥം
  choice: ആകാശത്തിൽനിന്ന്
  alternative: സ്വർഗത്തിൽനിന്ന്
  rationale: ഗ്രീക്ക് പദം ‘ആകാശം’, ‘സ്വർഗം’ എന്നീ രണ്ടർഥങ്ങളും അനുവദിക്കുന്നു. പ്രധാനപാഠത്തിലെ ‘ആകാശം’ സംഭവത്തിന്റെ ദൃശ്യദിശയെ സ്വാഭാവികമായി പറയുന്നു; ലൂക്കോസിന്റെ ആഖ്യാനത്തിലെ ദൈവിക ഉറവിടസൂചനയായ ‘സ്വർഗം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു, അങ്ങനെ യഥാർഥമായ പദാർഥവ്യാപ്തി മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്ക് വാക്യഘടന കൃത്രിമമായി പകർത്താതെ അതിലെ സമകാലികത, സമീപിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തി, പെട്ടെന്നുള്ള ചുറ്റുമുള്ള പ്രകാശം എന്നിവ സംരക്ഷിച്ചു. സ്ഥലനാമത്തിന് പ്രചാരത്തിലുള്ള ‘ദമസ്കൊസ്’ രൂപം ഉപയോഗിച്ചു.
