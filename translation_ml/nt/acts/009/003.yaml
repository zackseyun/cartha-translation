  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: ml
  text: അവൻ യാത്രചെയ്ത് ദമസ്കൊസിനോട് അടുത്തുകൊണ്ടിരിക്കുമ്പോൾ, പെട്ടെന്ന് സ്വർഗത്തിൽനിന്ന്[a] ഒരു വെളിച്ചം അവന്റെ ചുറ്റും മിന്നി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകാശത്തിൽനിന്ന്.’ ഗ്രീക്കിലെ οὐρανός എന്ന പദത്തിന് ‘സ്വർഗം’ എന്നും ‘ആകാശം’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ ‘സ്വർഗം’ വെളിച്ചത്തിന്റെ ദൈവിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
