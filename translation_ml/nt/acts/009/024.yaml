id: ACT.9.24
reference: Acts 9:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγνώσθη δὲ τῷ Σαύλῳ ἡ ἐπιβουλὴ αὐτῶν. ⸂παρετηροῦντο δὲ καὶ⸃ τὰς πύλας ἡμέρας τε καὶ νυκτὸς ὅπως αὐτὸν ἀνέλωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/024.yaml
  text: But their plot became known to Saul[a]. They were also watching the gates day and night so that they might kill him.
translation:
  language: ml
  text: എന്നാൽ അവരുടെ ഗൂഢാലോചന ശൗലിന് അറിവായി. അവനെ കൊല്ലാൻ അവർ രാവും പകലും കവാടങ്ങൾ[a] നിരീക്ഷിച്ചുകൊണ്ടുമിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഗരകവാടങ്ങൾ.’ ഗ്രീക്കിൽ ‘കവാടങ്ങൾ’ എന്നുമാത്രമാണ്; അവ നഗരകവാടങ്ങളാണെന്ന് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവർ രാവും പകലും കവാടങ്ങൾ നിരീക്ഷിച്ചുകൊണ്ടുമിരുന്നു’ എന്ന ഭാഗം ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη
  choice: അറിവായി
  rationale: ആരിലൂടെയാണ് വിവരം ലഭിച്ചതെന്ന് വ്യക്തമാക്കാതെ, ഗൂഢാലോചന ശൗലിന്റെ അറിവിൽപ്പെട്ടു എന്ന ഗ്രീക്ക് കർമണിപ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: ἐπιβουλή
  choice: ഗൂഢാലോചന
  rationale: ദോഷകരവും കൊലപാതക ലക്ഷ്യമുള്ളതുമായ രഹസ്യപദ്ധതിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρετηροῦντο
  choice: നിരീക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയായ നിരീക്ഷണഭാവം നിലനിർത്തുന്നു; വെറും കാവൽ എന്നതിലുപരി സൂക്ഷ്മമായി നോക്കിക്കൊണ്ടിരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πύλας
  choice: കവാടങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; നഗരത്തിന്റെ പശ്ചാത്തലം സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കാം.
- source_word: ἡμέρας τε καὶ νυκτός
  choice: രാവും പകലും
  rationale: നിരന്തരമായ ജാഗ്രതയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; മലയാളത്തിലെ പതിവ് ക്രമം സ്വീകരിക്കുന്നു.
- source_word: ὅπως
  choice: കൊല്ലാൻ
  rationale: മലയാളത്തിലെ ഉദ്ദേശ്യസൂചകമായ ക്രിയാരൂപം ഗ്രീക്കിലെ ലക്ഷ്യാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνέλωσιν
  choice: കൊല്ലാൻ
  rationale: ഈ സന്ദർഭത്തിൽ ἀναιρέω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: കൊലപാതകപദ്ധതിയിൽനിന്ന് അത് ശൗൽ അറിഞ്ഞതിലേക്കുള്ള നേരിയ വൈരുധ്യമാറ്റം പ്രകടമാക്കുന്നു.
- source_word: καὶ
  choice: -ങ്ങളും
  rationale: കവാടങ്ങൾ നിരീക്ഷിച്ചതെന്ന അധികവിവരം മലയാളത്തിൽ ചേർക്കൽ സൂചിപ്പിക്കുന്ന പ്രത്യയംകൊണ്ട് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. കർമണിപ്രയോഗത്തിന്റെ നിർവാഹകനെ അനാവശ്യമായി നിർണ്ണയിച്ചിട്ടില്ല; നിരീക്ഷണത്തിന്റെ തുടർച്ചയും കൊലപ്പെടുത്താനുള്ള ഉദ്ദേശ്യവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
