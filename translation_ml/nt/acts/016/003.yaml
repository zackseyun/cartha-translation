  source_fidelity: മുഖ്യമായ അർഥവും കാരണബന്ധവും കരടിൽ കൃത്യമായി സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ λαβών എന്ന മുൻകാല പങ്കുപ്രത്യയത്തിന് നൽകിയിരിക്കുന്ന ‘അവനെ കൂട്ടിക്കൊണ്ടുപോയി’ എന്ന പ്രയോഗം അവനെ ഏതെങ്കിലും സ്ഥലത്തേക്ക് കൊണ്ടുപോയി എന്ന അധിക ചലനാർഥം നൽകാം. ‘അവനെ കൂട്ടിക്കൊണ്ടശേഷം’ എന്നത് ‘taking him’ എന്നതോടും പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവർത്തിയോടും കൂടുതൽ അടുത്തതാണ്.
  naturalness: ‘അവനെ കൂട്ടിക്കൊണ്ടശേഷം’ ആധുനിക മാന്യമായ മലയാളത്തിൽ സ്വാഭാവികമാണ്; തുടർന്ന് വരുന്ന ‘അവനെ പരിച്ഛേദനം ചെയ്തു’ എന്ന നേരിട്ടുള്ള പ്രയോഗവും വ്യക്തമാണ്.
  terminology: ‘പൗലോസ്,’ ‘യെഹൂദന്മാർ,’ ‘പരിച്ഛേദനം,’ ‘ഗ്രീക്കുകാരൻ’ എന്നിവ സ്ഥാപിതവും യോജിച്ചതുമാണ്. ‘ഗ്രീക്കുകാരൻ’ എന്നത് Ἕλλην-ന്റെ നേരിട്ടുള്ള സൂചന നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സന്ദർഭാനുസൃതമായ യെഹൂദേതര സൂചനയെ അമിതമായി ഉറപ്പിക്കാതെ അറിയിക്കുന്നു.
