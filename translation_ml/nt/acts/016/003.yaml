id: ACT.16.3
reference: Acts 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: ml
  text: പൗലോസ് അവനെ തന്നോടൊപ്പം യാത്രയിൽ കൂട്ടാൻ ആഗ്രഹിച്ചു.[a] അവനെ കൂട്ടിക്കൊണ്ടശേഷം, ആ സ്ഥലങ്ങളിലുണ്ടായിരുന്ന യെഹൂദന്മാർ നിമിത്തം[b] അവനെ പരിച്ഛേദനം ചെയ്തു. കാരണം, അവന്റെ പിതാവ് ഒരു ഗ്രീക്കുകാരനായിരുന്നു[c] എന്ന് അവർക്കെല്ലാം അറിയാമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തന്നോടൊപ്പം പുറത്തേക്കു പോകാൻ’; ഇവിടെ യാത്ര പുറപ്പെടുക എന്നാണ് അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘യെഹൂദന്മാർ കാരണം’ അല്ലെങ്കിൽ ‘യെഹൂദന്മാരെ കരുതി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘ഒരു ഗ്രീക്കുകാരൻ’; ഈ സന്ദർഭത്തിൽ തിമൊഥെയൊസിന്റെ പിതാവ് യെഹൂദനല്ലായിരുന്നു എന്ന സൂചനയും ഇതിലുണ്ട്.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: അവനെ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച തിമൊഥെയൊസിനെയാണ് നിർദ്ദേശക സർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അനാവശ്യ ഊന്നൽ ചേർക്കാതെ തുടർച്ച വ്യക്തമാക്കാൻ ‘അവനെ’ സ്വാഭാവികമാണ്.
- source_word: ἠθέλησεν
  choice: ആഗ്രഹിച്ചു
  rationale: θέλω ഇവിടെ പൗലോസിന്റെ ആഗ്രഹമോ ഉദ്ദേശ്യമോ പ്രകടിപ്പിക്കുന്നു; അതിനെ അതിരുകടന്ന് ഉറച്ച തീരുമാനമായി ചിത്രീകരിക്കുന്നില്ല.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: തന്നോടൊപ്പം യാത്രയിൽ കൂട്ടാൻ
  rationale: അക്ഷരാർഥം ‘തന്നോടൊപ്പം പുറത്തേക്കു പോകാൻ’ എന്നാണ്; സന്ദർഭത്തിൽ യാത്ര പുറപ്പെടുന്നതാണ് ഉദ്ദേശ്യം. ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λαβὼν
  choice: അവനെ കൂട്ടിക്കൊണ്ടുപോയി
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. ‘കൂട്ടിക്കൊണ്ടുപോയി’ എന്നത് വ്യക്തിയെ കൂടെ സ്വീകരിച്ചുള്ള തുടർനടപടി സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: περιέτεμεν
  choice: അവനെ പരിച്ഛേദനം ചെയ്തു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; പൗലോസ് പ്രവർത്താവാണെന്ന വ്യാകരണരൂപവും മറയ്ക്കുന്നില്ല.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: യെഹൂദന്മാർ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണം അഥവാ പ്രേരകം സൂചിപ്പിക്കുന്നു. ‘നിമിത്തം’ ആ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: ആ സ്ഥലങ്ങളിലുണ്ടായിരുന്ന
  rationale: τόποις എന്നതിന്റെ ‘സ്ഥലങ്ങൾ’ എന്ന അർഥത്തോട് അടുത്തുനിൽക്കുകയും അവിടത്തെ യെഹൂദജനത്തെ നിർവചിക്കുകയും ചെയ്യുന്നു.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: കാരണം ... അവർക്കെല്ലാം അറിയാമായിരുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധവും ἅπαντες നൽകുന്ന സമഗ്രതയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: Ἕλλην
  choice: ഒരു ഗ്രീക്കുകാരൻ
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള ജനതാ-സാംസ്കാരിക സൂചന നിലനിർത്തുന്നു; ‘വിജാതീയൻ’ എന്ന വിശാല വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: അവന്റെ പിതാവ് ... ആയിരുന്നു
  rationale: ὑπάρχω ഇവിടെ ലളിതമായ നിലയെയോ തിരിച്ചറിയലെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ആയിരുന്നു’ സ്വാഭാവികവും ആവശ്യത്തിന് കൃത്യവുമാണ്.
theological_decisions:
- issue: തിമൊഥെയൊസിന്റെ പരിച്ഛേദനത്തിനുള്ള കാരണം
  choice: പ്രാദേശിക യെഹൂദന്മാർക്ക് അവന്റെ പിതൃപശ്ചാത്തലം അറിയാമായിരുന്നതിനാൽ പൗലോസ് ഈ നടപടി എടുത്തതായി മാത്രം പ്രസ്താവിക്കുന്നു.
  alternative: വിശ്വാസികൾക്ക് പരിച്ഛേദനം രക്ഷയ്ക്കോ ഉടമ്പടിസ്ഥാനത്തിനോ അനിവാര്യമാണെന്ന അംഗീകാരമായോ, മറുവശത്ത് ഇത് വെറും മിഷനറി തന്ത്രം മാത്രമായോ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം പറയുന്ന കാരണബന്ധം മാത്രം വിവർത്തനം ചെയ്യുന്നു. ഈ വാക്യം തന്നെ പറയാത്ത വിശാലമായ ഉപദേശനിഗമനം ചേർക്കാതെ പുതിയനിയമത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പരിച്ഛേദനം’ പോലുള്ള സ്ഥാപിത ബൈബിൾ പദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട ആശയത്തിന് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
