  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പ്രഹരങ്ങൾ’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘തള്ളിയിട്ടു’ βάλλωയുടെ ദൃശ്യമായ ശക്തി സംരക്ഷിക്കുന്നു. ‘കർശനമായി കാവൽചെയ്യുക’ എന്നത് രക്ഷപ്പെടാൻ ഇടനൽകാത്ത സുരക്ഷിത തടങ്കൽ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
