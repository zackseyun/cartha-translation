id: ACT.16.23
reference: Acts 16:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: ml
  text: അവർക്കു അനേകം പ്രഹരങ്ങൾ ഏൽപ്പിച്ചശേഷം[a] അവർ അവരെ തടവറയിലേക്കു തള്ളിയിട്ടു[b]; അവരെ സുരക്ഷിതമായി കാവലിൽ വെക്കണമെന്ന് തടവറയുടെ കാവൽക്കാരനോടു കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനേകം അടികൾ’ അല്ലെങ്കിൽ ‘അനേകം തല്ലുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം അനേകം പ്രഹരങ്ങൾ ഏൽപ്പിച്ചതായി പറയുന്നു; ഏത് ഉപകരണം ഉപയോഗിച്ചെന്നു വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘ജയിലിലേക്കു’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിനു പൊതുവായി തടവിലാക്കുന്ന സ്ഥലത്തെ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: അനേകം പ്രഹരങ്ങൾ
  rationale: πληγή ഇവിടെ അടിയോ പ്രഹരമോ അടിയേറ്റുണ്ടാകുന്ന മുറിവോ സൂചിപ്പിക്കാം. ശിക്ഷയ്ക്കുപയോഗിച്ച ഉപകരണം വ്യക്തമാക്കാതെ, πολλάς എന്നതിന്റെ ബഹുത്വവും അടികളുടെ സ്വഭാവവും ‘അനേകം പ്രഹരങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: τε
  choice: — (വാക്യഘടനയിലെ തുടർച്ചയിലൂടെ പ്രതിഫലിപ്പിച്ചു)
  rationale: τε മുൻവിവരണത്തോടുള്ള ബന്ധം കാണിക്കുന്ന സംയോജകകണമാണ്. മലയാളത്തിൽ ‘ശേഷം ... ചെയ്തു’ എന്ന തുടർച്ചയായ ഘടന ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ പ്രത്യേകം ‘കൂടാതെ’ ചേർത്തിട്ടില്ല.
- source_word: ἐπιθέντες
  choice: ഏൽപ്പിച്ചശേഷം
  rationale: ἐπιτίθημι + πληγάς എന്ന പ്രയോഗം ‘പ്രഹരങ്ങൾ ഏൽപ്പിക്കുക’ എന്നാണ്. ക്രിയാവിശേഷണരൂപത്തിന്റെ കാലബന്ധം ‘ശേഷം’ വ്യക്തമാക്കുന്നു.
- source_word: ἔβαλον εἰς φυλακήν
  choice: തടവറയിലേക്കു തള്ളിയിട്ടു
  rationale: βάλλωയുടെ ശക്തമായ, ബലപ്രയോഗം സൂചിപ്പിക്കുന്ന ഭാവം ‘തള്ളിയിട്ടു’ നിലനിർത്തുന്നു; φυλακήയെ തടവിടം എന്ന അർഥത്തിൽ ‘തടവറ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: φυλακήν
  choice: തടവറ
  rationale: φυλακή കാവൽ, തടവ്, തടവിടം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ δεσμοφύλαξ എന്ന ഉദ്യോഗസ്ഥനും അടച്ചിടലും ഉള്ളതിനാൽ ‘തടവറ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: παραγγείλαντες
  choice: കല്പിക്കുകയും ചെയ്തു
  rationale: παραγγέλλωയുടെ അധികാരപൂർവമായ നിർദേശം ‘കല്പിക്കുക’ കൃത്യമായി നൽകുന്നു. ഗ്രീക്കിലെ അനുബന്ധ കൃതന്തത്തെ മലയാളത്തിൽ ഏകോപിത ക്രിയയായി സ്വാഭാവികമാക്കി.
- source_word: δεσμοφύλακι
  choice: തടവറക്കാവൽക്കാരനോട്
  rationale: δεσμοφύλαξ തടവുകാരുടെ ചുമതലയുള്ള കാവൽക്കാരനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തടവറക്കാവൽക്കാരൻ’ ആ ഔദ്യോഗിക പങ്ക് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀσφαλῶς
  choice: കർശനമായി
  rationale: ഇവിടെ ἀσφαλῶς തടവുകാരുടെ ക്ഷേമത്തെയല്ല, അവർ രക്ഷപ്പെടാതിരിക്കാനുള്ള ഉറപ്പുള്ള കാവലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കർശനമായി’ ആ തടവുസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τηρεῖν
  choice: കാവൽചെയ്യണമെന്ന്
  rationale: τηρέω ഇവിടെ സൂക്ഷിക്കുക/കാക്കുക എന്ന തടവുസന്ദർഭാർഥത്തിലാണ്. ‘കാവൽചെയ്യുക’ മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി പറയുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: പൗലൊസിനെയും ശീലാസിനെയും സൂചിപ്പിക്കുന്ന ബഹുവചന സർവനാമം; തടവിലാക്കലിന്റെയും കാവലിന്റെയും കർമമായി നിലനിർത്തി.
