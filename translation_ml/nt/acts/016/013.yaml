id: ACT.16.13
reference: Acts 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: ml
  text: ശബ്ബത്ത് ദിവസം ഞങ്ങൾ കവാടത്തിനു പുറത്തുകടന്ന് നദിക്കരയിലേക്കു പോയി. അവിടെ ഒരു പ്രാർഥനാസ്ഥലം ഉണ്ടെന്നു ഞങ്ങൾ കരുതി.[a] ഇരുന്നശേഷം, അവിടെ കൂടിവന്ന സ്ത്രീകളോടു ഞങ്ങൾ സംസാരിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെ പ്രാർഥന ഉണ്ടെന്നു ഞങ്ങൾ കരുതി.” ഗ്രീക്ക് പദത്തിന് പ്രാർഥനയെയോ പ്രാർഥനയ്ക്കായി വേർതിരിച്ച സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; ഇവിടെ സന്ദർഭം “പ്രാർഥനാസ്ഥലം” എന്ന അർഥത്തിനാണ് കൂടുതൽ അനുകൂലം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: ശബ്ബത്തുദിവസം
  rationale: കൊയ്നേ ഗ്രീക്കിലെ ഈ പ്രയോഗം ശബ്ബത്ത് ദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്. പദാനുപദമായ ബഹുവചനരൂപം മലയാളത്തിൽ ആശയക്കുഴപ്പം സൃഷ്ടിക്കുമെന്നതിനാൽ സ്വാഭാവികമായ ഏകവചനപ്രയോഗം സ്വീകരിച്ചു.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: ഞങ്ങൾ കവാടത്തിനു പുറത്തേക്കു ... പോയി
  rationale: ക്രിയയും ἔξω എന്ന പദവും ചേർന്ന് പുറത്തേക്കുള്ള ചലനത്തിന് ഊന്നൽ നൽകുന്നു. മൂലപാഠത്തിൽ ‘നഗരം’ വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: παρὰ ποταμόν
  choice: നദിക്കരയിലേക്കു
  rationale: παρά + accusative ഇവിടെ നദിയുടെ അരികിലുള്ള സ്ഥലത്തേക്കുള്ള ചലനത്തെ സൂചിപ്പിക്കുന്നു; ‘നദിക്കരയിലേക്കു’ മലയാളത്തിൽ ഈ ദിശാബോധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: അവിടെ ഒരു പ്രാർഥനാസ്ഥലം ഉണ്ടെന്നു ഞങ്ങൾ കരുതി
  rationale: νομίζω എന്നത് ഇവിടെ ‘കരുതുക’ എന്നാണ്. പ്രσευχή പ്രാർഥനയെയോ പ്രാർഥനയ്ക്കായി വേർതിരിച്ച സ്ഥലത്തെയോ സൂചിപ്പിക്കാം; നദിക്കരയിലെ ഒത്തുചേരൽ എന്ന സന്ദർഭത്തിൽ ‘പ്രാർഥനാസ്ഥലം’ കൂടുതൽ സാധ്യതയുള്ള അർഥമാണ്. യഥാർഥ ദ്വയാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: καὶ καθίσαντες
  choice: ഇരുന്നശേഷം
  rationale: Aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ സംഭവക്രമം വ്യക്തമായി അവതരിപ്പിച്ചു.
- source_word: ἐλαλοῦμεν
  choice: ഞങ്ങൾ സംസാരിച്ചുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപത്തിന്റെ തുടരുന്ന പ്രവൃത്തിബോധം മലയാളത്തിലെ ‘സംസാരിച്ചുകൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: അവിടെ കൂടിവന്നിരുന്ന സ്ത്രീകളോടു
  rationale: സ്ത്രീകൾ മുമ്പേ ആ സ്ഥലത്ത് ഒരുമിച്ചുകൂടിയിരുന്നു എന്ന participial അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ προσευχή എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രാർഥനാസ്ഥലം
  alternative: പ്രാർഥന; സിനഗോഗ്
  rationale: നദിക്കരയിൽ ആളുകൾ കൂടിവന്നിരുന്ന ഒരു സ്ഥലം എന്ന സന്ദർഭത്തിൽ ‘പ്രാർഥനാസ്ഥലം’ സാധ്യതയേറിയ അർഥമാണ്. എന്നാൽ ‘പ്രാർഥന’ എന്ന അമൂർത്ത അർഥവും ഗ്രീക്കിൽ സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകി. ‘സിനഗോഗ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപദത്തേക്കാൾ സ്ഥാപനപരമായ അർഥം അധികമായി ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘ശബ്ബത്ത്’, ‘പ്രാർഥനാസ്ഥലം’ എന്നീ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നഗരം’, ‘സിനഗോഗ്’ തുടങ്ങിയ വിശദീകരണങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
