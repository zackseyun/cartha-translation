id: ACT.16.15
reference: Acts 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: ml
  text: 'അവളും അവളുടെ കുടുംബത്തിലുള്ളവരും സ്നാനം ഏറ്റപ്പോൾ, അവൾ ഞങ്ങളോട് അഭ്യർഥിച്ചു: “ഞാൻ കർത്താവിനോടു വിശ്വസ്തയായവളാണെന്ന്[a] നിങ്ങൾ വിലയിരുത്തിയിട്ടുണ്ടെങ്കിൽ, എന്റെ വീട്ടിൽ വന്നു താമസിക്കൂ.” അങ്ങനെ അവൾ തന്റെ ഉറച്ച നിർബന്ധത്താൽ ഞങ്ങളെ സമ്മതിപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ കർത്താവിൽ വിശ്വസിക്കുന്നവളാണെന്ന്.” ഗ്രീക്ക് വിശേഷണത്തിന് ‘വിശ്വസ്ത,’ ‘വിശ്വസനീയ,’ ‘വിശ്വസിക്കുന്ന’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: πιστή എന്ന പദത്തിന്റെ യഥാർഥമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്ന പദപരമായ മറ്റൊരു സാധ്യത.
lexical_decisions:
- source_word: ὡς δὲ
  choice: അപ്പോൾ
  rationale: സംഭവങ്ങളുടെ തുടർച്ചയും ὡς എന്നതിന്റെ കാലസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; δέയെ അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: അവളും അവളുടെ കുടുംബത്തിലുള്ളവരും സ്നാനം ഏറ്റപ്പോൾ
  rationale: ഏകവചന ക്രിയ ആദ്യം അവളെ സൂചിപ്പിച്ചാലും, തുടർന്നുള്ള καὶ ὁ οἶκος αὐτῆς അർഥപരമായി അവളുടെ കുടുംബത്തിലുള്ളവരെയും ഉൾക്കൊള്ളുന്നു. ഇവിടെ οἶκος കെട്ടിടമല്ല, കുടുംബഗണമാണ്.
- source_word: παρεκάλεσεν
  choice: അവൾ ഞങ്ങളോട് അഭ്യർഥിച്ചു
  rationale: παρακαλέω ഇവിടെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; വെറും ‘ചോദിച്ചു’ എന്നതിനെക്കാൾ ശക്തിയും ‘നിർബന്ധിച്ചു’ എന്നതിനെക്കാൾ മിതത്വവും ഇതിലുണ്ട്.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: ഞാൻ കർത്താവിനോടു വിശ്വസ്തയായവളാണെന്ന് നിങ്ങൾ വിലയിരുത്തിയിട്ടുണ്ടെങ്കിൽ
  rationale: κεκρίκατε എന്ന പൂർണകാലരൂപത്തിന്റെ സ്ഥിരപ്പെട്ട വിലയിരുത്തൽ എന്ന ഭാവം ‘വിലയിരുത്തിയിട്ടുണ്ടെങ്കിൽ’ നിലനിർത്തുന്നു. πιστήയുടെ വിശ്വസ്തത/വിശ്വാസം എന്ന അർഥവ്യാപ്തി മുഖ്യപാഠവും അടിക്കുറിപ്പും ചേർന്ന് സംരക്ഷിക്കുന്നു.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: എന്റെ വീട്ടിൽ വന്നു താമസിക്കൂ
  rationale: ഇവിടെ οἶκος ഭൗതികവാസസ്ഥലമാണ്. പങ്കാളിക്രിയയും ആജ്ഞാരൂപവും മലയാളത്തിൽ സ്വാഭാവികമായ ക്ഷണമായി അവതരിപ്പിക്കുന്നു.
- source_word: παρεβιάσατο ἡμᾶς
  choice: അവൾ നിർബന്ധിച്ച് ഞങ്ങളെ സമ്മതിപ്പിച്ചു
  rationale: παραβιάζομαι ശക്തമായ നിർബന്ധപൂർവമായ പ്രേരണയെ സൂചിപ്പിക്കുന്നു. ബലപ്രയോഗം എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കി, അവളുടെ ആവർത്തിച്ചുള്ള ഉറച്ച നിർബന്ധം ഫലിച്ചതായി പരിഭാഷ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അവളുടെ കുടുംബത്തിലുള്ളവരുടെ സ്നാനം സംബന്ധിച്ച പിൽക്കാല സഭാവിഭാഗീയ നിഗമനങ്ങൾ
  choice: അവളും അവളുടെ കുടുംബത്തിലുള്ളവരും സ്നാനം ഏറ്റിയെന്ന വിവരണം നേരിട്ട് പരിഭാഷപ്പെടുത്തി; അവരുടെ പ്രായമോ ഓരോരുത്തരുടെയും വിശ്വാസസ്ഥിതിയോ ചേർത്തിട്ടില്ല.
  alternative: കുടുംബത്തിൽ ശിശുക്കൾ ഉണ്ടായിരുന്നുവെന്നോ, എല്ലാവരും വ്യക്തിപരമായി വിശ്വാസം ഏറ്റുപറഞ്ഞവരായിരുന്നുവെന്നോ സൂചിപ്പിക്കുക.
  rationale: മൂലപാഠം കുടുംബത്തിന്റെ ഘടന വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ശിശുസ്നാനത്തെയോ വിശ്വാസികളുടെ സ്നാനത്തെയോ അനുകൂലിക്കുന്ന അധിക നിഗമനം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യരുത്.
- issue: πιστή എന്ന പദത്തിൽ വിശ്വാസവും വിശ്വസ്തതയും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവിനോടു വിശ്വസ്തയായവൾ’ എന്ന് നൽകി, ‘കർത്താവിൽ വിശ്വസിക്കുന്നവൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: മുഖ്യപാഠത്തിൽ ‘കർത്താവിൽ വിശ്വസിക്കുന്നവൾ’ അല്ലെങ്കിൽ ‘കർത്താവിന്റെ മുമ്പാകെ വിശ്വസനീയയായവൾ’ എന്നു മാത്രം നൽകുക.
  rationale: ഗ്രീക്ക് വിശേഷണം വിശ്വസ്ത, വിശ്വസനീയ, വിശ്വസിക്കുന്ന എന്നീ ബന്ധമുള്ള അർഥങ്ങൾ വഹിക്കാം. മുഖ്യപാഠം ബന്ധപരമായ വിശ്വസ്തത നിലനിർത്തുകയും അടിക്കുറിപ്പ് യഥാർഥമായ മറ്റൊരു സാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സ്നാനം ഏറ്റു,’ ‘അഭ്യർഥിച്ചു,’ ‘വിലയിരുത്തിയിട്ടുണ്ടെങ്കിൽ’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പ്രസിദ്ധീകരണയോഗ്യവുമായ പദപ്രയോഗങ്ങളാണ്. ആദ്യത്തെ οἶκος ‘കുടുംബത്തിലുള്ളവർ’ എന്നും രണ്ടാമത്തേത് ‘വീട്’ എന്നും സന്ദർഭാനുസൃതമായി വേർതിരിച്ചു.
