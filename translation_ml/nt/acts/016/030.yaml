id: ACT.16.30
reference: Acts 16:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: ml
  text: 'അവരെ പുറത്തേക്കു കൊണ്ടുവന്ന ശേഷം[a] അവൻ പറഞ്ഞു: “മാന്യരേ[b], രക്ഷിക്കപ്പെടാൻ ഞാൻ എന്താണ് ചെയ്യേണ്ടത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരെ പുറത്തേക്കു നയിച്ചശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: “മാന്യരേ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം ഇവിടെ ആദരപൂർവമായ സാമൂഹിക അഭിസംബോധനയാണ്; ദൈവിക സ്ഥാനപ്പേരായ “കർത്താവ്” എന്ന അർഥത്തിലല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: അവരെ പുറത്തേക്കു കൊണ്ടുവന്നശേഷം
  rationale: മൂലഭാഷയിലെ aorist participle മുഖ്യക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം സംഭവക്രമവും പുറത്തേക്കുള്ള ചലനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔφη
  choice: അവൻ പറഞ്ഞു
  rationale: ആഖ്യാനത്തിലെ സംഭാഷണാവതാരികയായി ഇവിടെ ലളിതമായ ഭൂതകാലപ്രയോഗം സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Κύριοι
  choice: മാന്യരേ
  rationale: κύριος എന്ന പദത്തിന്റെ vocative plural ഇവിടെ പൗലൊസിനെയും ശീലാസിനെയും ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നതാണ്; ദൈവികമായ ‘കർത്താവ്’ എന്ന സ്ഥാനപ്പേരല്ല. ‘മാന്യരേ’ എന്നത് ആ സാമൂഹിക ആദരഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τί με δεῖ ποιεῖν
  choice: ഞാൻ എന്താണ് ചെയ്യേണ്ടത്
  rationale: δεῖ സൂചിപ്പിക്കുന്ന അനിവാര്യത ‘ചെയ്യേണ്ടത്’ എന്ന പ്രയോഗം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα σωθῶ
  choice: രക്ഷിക്കപ്പെടാൻ
  rationale: ἵνα + passive subjunctive സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും passive ഭാവവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: σωθῶ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: രക്ഷിക്കപ്പെടാൻ
  alternative: വിടുവിക്കപ്പെടാൻ
  rationale: സന്ദർഭം, പ്രത്യേകിച്ച് തുടർന്നുള്ള 31-ാം വാക്യം, ആത്മീയ രക്ഷയെ ശക്തമായി സൂചിപ്പിക്കുന്നു. അതേസമയം passive രൂപം നിലനിർത്തുന്നതിലൂടെ രക്ഷയുടെ കർത്താവിനെ വാക്യത്തിൽ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല; പദത്തിനുള്ള വിടുതൽ/രക്ഷ എന്ന വിശാല അർഥവ്യാപ്തിയും പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: Κύριοι എന്ന അഭിസംബോധനയുടെ സ്വഭാവം
  choice: മാന്യരേ
  alternative: യജമാനന്മാരേ
  rationale: ഇവിടെ പദം ദൈവിക സ്ഥാനപ്പേരായി ഉപയോഗിച്ചിട്ടില്ല; രണ്ടു മനുഷ്യരോടുള്ള ആദരപൂർവമായ അഭിസംബോധനയാണ്. അതിനാൽ ‘കർത്താക്കന്മാരേ’ എന്ന ദൈവശാസ്ത്രപരമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന രൂപം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘സാറന്മാരേ’ പോലുള്ള അത്യന്തം സംസാരഭാഷാപരമായ രൂപവും ‘പ്രഭുക്കന്മാരേ’ പോലുള്ള പഴക്കമുള്ള രൂപവും ഒഴിവാക്കി. ചോദ്യം സ്വാഭാവികമാക്കിക്കൊണ്ടുതന്നെ അനിവാര്യതയും passive രക്ഷാഭാവവും സംരക്ഷിച്ചു.
