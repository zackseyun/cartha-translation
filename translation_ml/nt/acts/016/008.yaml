  terminology: «മിസ്യ» and «ത്രോവാസ്» are suitable Malayalam transliterations of the regional and city names. The footnote is retained, with «ക്രിയാവിശേഷണരൂപം» replacing the less natural grammatical label «പങ്കാളിത്തരൂപം».
  issues:
