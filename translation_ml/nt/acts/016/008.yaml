  source_fidelity: 'The draft accurately renders the principal movements: παρέλθοντες as passing Mysia and κατέβησαν as descending/going down to Troas. However, «അങ്ങനെ» can make the mild connective δέ sound more inferential or consequential than the Greek warrants. The revised wording retains the aorist-participial sequence and the directional force of κατέβησαν without adding that inference.'
