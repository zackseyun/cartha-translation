    rationale: δέ is a light connective in this context; «അങ്ങനെ» can imply a result or consequence not explicitly marked in the Greek.
  - severity: low
    issue: Destination-plus-motion phrasing can be smoother.
    rationale: «ത്രോവാസിലേക്കു ഇറങ്ങിച്ചെന്നു» naturally expresses travel down to and arrival at Troas, while retaining καταβαίνω's directional element.
