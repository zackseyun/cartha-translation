id: ACT.16.18
reference: Acts 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: ml
  text: 'അവൾ പല ദിവസങ്ങളോളം ഇങ്ങനെ ചെയ്തുകൊണ്ടിരുന്നു. എന്നാൽ പൗലോസ് അത്യന്തം അസ്വസ്ഥനായി തിരിഞ്ഞ് ആ ആത്മാവിനോട് പറഞ്ഞു: “യേശുവായ മശീഹയുടെ നാമത്തിൽ അവളിൽനിന്ന് പുറത്തുവരാൻ ഞാൻ നിന്നോടു കല്പിക്കുന്നു.” ആ നാഴികയിൽത്തന്നെ അത് പുറത്തുവന്നു.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: പല ദിവസങ്ങളോളം ഇങ്ങനെ ചെയ്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലക്രിയയായ ἐποίει ആവർത്തിച്ചോ തുടർന്നോ നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘ചെയ്തുകൊണ്ടിരുന്നു’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διαπονηθεὶς
  choice: അത്യന്തം അസ്വസ്ഥനായി
  rationale: ഈ കൃദന്തം വെറും ചെറിയ ശല്യമല്ല, ആഴത്തിലുള്ള മാനസിക അസ്വസ്ഥതയെയോ ക്ലേശത്തെയോ സൂചിപ്പിക്കുന്നു; കോപം അനാവശ്യമായി ചേർക്കാതെ അതിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: ἐπιστρέψας
  choice: തിരിഞ്ഞ്
  rationale: സംസാരിക്കുന്നതിനു മുമ്പ് പൗലോസ് ശാരീരികമായി തിരിഞ്ഞതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τῷ πνεύματι
  choice: ആ ആത്മാവിനോട്
  rationale: ഗ്രീക്കിൽ ‘ആത്മാവിനോട്’ എന്നു മാത്രമേയുള്ളൂ; ‘ദുരാത്മാവ്’ എന്ന വിശദീകരണം മൂലപാഠത്തിലേക്ക് ചേർക്കാതെ സന്ദർഭത്തിലെ നിർദിഷ്ട പരാമർശം മലയാളത്തിൽ ‘ആ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: Παραγγέλλω σοι
  choice: ഞാൻ നിന്നോടു കല്പിക്കുന്നു
  rationale: ആത്മാവിനോടുള്ള അധികാരപൂർവമായ നിർദേശം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയുടെ നാമത്തിൽ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ അഭിഷിക്തസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; അധികാരത്തിന്റെ അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ‘നാമത്തിൽ’ നിലനിർത്തി.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: അവളിൽനിന്ന് പുറത്തുവരാൻ
  rationale: ഒരു ആത്മാവിനെ പുറത്താക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ἀπό സൂചിപ്പിക്കുന്ന വേർപാടും നിലനിർത്തുന്നു.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: ആ നാഴികയിൽത്തന്നെ അത് പുറത്തുവന്നു
  rationale: ആത്മാവാണ് സൂചിത കർത്താവ്; αὐτῇ τῇ ὥρᾳ കല്പന ഉടൻ ഫലിച്ചതിനെ ഊന്നുന്നതിനാൽ ‘ആ നാഴികയിൽത്തന്നെ’ എന്ന മൂലരൂപത്തോട് ചേർന്ന പ്രയോഗം സ്വീകരിച്ചു.
theological_decisions:
- issue: ἐν ὀνόματι Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ ഒരു പേരിന്റെ സ്ഥിരഘടകമായി മാത്രം അല്ല, യേശുവിന്റെ മശീഹാപദവിയെ ഉൾക്കൊള്ളുന്ന അധികാരസൂത്രത്തിലാണ് വരുന്നത്; അതിനാൽ പദവിയുടെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു.
- issue: τῷ πνεύματι എന്ന ആത്മാവിനെ മുഖ്യപാഠത്തിൽ ദുഷ്ടാത്മാവായി വ്യക്തമാക്കണമോ
  choice: ആ ആത്മാവ്
  alternative: ദുരാത്മാവ് / ഭൂതം
  rationale: ഈ വാക്യത്തിൽ πνεῦμα എന്നതിന് ദോഷസൂചക വിശേഷണം ചേർത്തിട്ടില്ല. മുൻസന്ദർഭം അതിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിന്റെ കൃത്യമായ പദപ്രയോഗം സംരക്ഷിക്കാൻ ‘ആ ആത്മാവ്’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വേദപാരായണശൈലി. ആവർത്തനപ്രവൃത്തി, പൗലോസിന്റെ ആഴത്തിലുള്ള അസ്വസ്ഥത, ആത്മാവിനോടുള്ള നേരിട്ടുള്ള കല്പന, ഉടനെയുള്ള ഫലം എന്നിവ വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു. മലയാളത്തിൽ ‘യേശു മശീഹ’ എന്ന രൂപം പദവിയുടെ അർഥം നിലനിർത്തുന്നു.
