source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: ml
  text: വടികൾ വഹിക്കുന്നവർ ഈ വാക്കുകൾ നഗരാധികാരികളോടു അറിയിച്ചു.[b][c] അവർ റോമാക്കാരാണെന്ന്[a] കേട്ടപ്പോൾ നഗരാധികാരികൾ ഭയപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “റോമൻ പൗരന്മാർ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “റോമാക്കാർ” എന്നാണ്; എന്നാൽ ഈ നിയമസന്ദർഭത്തിൽ അവരുടെ സംരക്ഷിത പൗരപദവിയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “വടികൾ വഹിക്കുന്നവർ” നഗരാധികാരികളുടെ പരിചാരകരായിരുന്നു; പരമ്പരാഗതമായി ഇവരെ “ലിക്ടർമാർ” എന്നു വിളിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “നഗരാധികാരികൾ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന στρατηγοί ഫിലിപ്പിയിലെ പ്രമുഖ പൗരാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: അറിയിച്ചു
  rationale: ഔദ്യോഗികമായി ഒരു സന്ദേശം എത്തിച്ചുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: στρατηγοῖς
  choice: നഗരാധികാരികളെ
  rationale: ഫിലിപ്പിയിലെ പ്രമുഖ പൗരാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; സാങ്കേതിക പദത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: ῥαβδοῦχοι
  choice: വടിവാഹകർ
  rationale: അധികാരത്തിന്റെ ചിഹ്നമായ വടികൾ വഹിച്ചിരുന്ന ഉദ്യോഗസ്ഥസേവകരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
- source_word: τὰ ῥήματα ταῦτα
  choice: ഈ വാക്കുകൾ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും മുമ്പ് പറഞ്ഞ പ്രത്യേക സന്ദേശത്തിലേക്കുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: ἐφοβήθησαν
  choice: ഭയപ്പെട്ടു
  rationale: വിവരം കേട്ടതിനെത്തുടർന്നുണ്ടായ ഭയത്തെ ലളിതമായും നേരിട്ടും അവതരിപ്പിക്കുന്നു.
- source_word: ἀκούσαντες
  choice: കേട്ടപ്പോൾ
  rationale: കേൾവിയും ഭയവും തമ്മിലുള്ള കാലപരവും സന്ദർഭപരവുമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ῥωμαῖοί
  choice: റോമാക്കാർ
  rationale: ഗ്രീക്ക് മൂലത്തിലെ പദരൂപം നേരിട്ട് നിലനിർത്തുന്നു; നിയമപരമായ സന്ദർഭത്തിൽ റോമൻ പൗരന്മാർ എന്ന അർഥമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
