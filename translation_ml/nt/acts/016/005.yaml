id: ACT.16.5
reference: Acts 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: ml
  text: അങ്ങനെ സഭകൾ വിശ്വാസത്തിൽ ശക്തിപ്പെട്ടുകൊണ്ടിരുന്നു; അവയുടെ എണ്ണം അനുദിനം വർധിച്ചുകൊണ്ടുമിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശ്വാസത്തിൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം, ക്രൈസ്തവർ പങ്കിടുന്ന വിശ്വാസസത്യങ്ങളും അതനുസരിച്ചുള്ള ജീവിതവും ഉൾപ്പെടുന്ന ‘ക്രൈസ്തവവിശ്വാസത്തിൽ’ ശക്തിപ്പെട്ടു എന്നോ, കൂടുതൽ പൊതുവായി ‘വിശ്വാസത്തിൽ’ ശക്തിപ്പെട്ടു എന്നോ അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: അങ്ങനെ
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള ഫലമോ സംഗ്രഹമോ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ബന്ധപദം; μέν-ന് ഇവിടെ പ്രത്യേകം വിരുദ്ധപദം ചേർക്കേണ്ടതില്ല.
- source_word: ἐκκλησίαι
  choice: സഭകൾ
  rationale: പ്രാദേശിക ക്രൈസ്തവസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നതും ആധുനിക മലയാളത്തിൽ വ്യക്തവും പതിവുമായ പദം.
- source_word: ἐστερεοῦντο
  choice: ശക്തിപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിലെ തുടർന്നുകൊണ്ടിരുന്ന പ്രക്രിയ നിലനിർത്തുന്നു. ഗ്രീക്കിലെ കർമണപ്രയോഗത്തിന്റെ ആശയം മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ നൽകുന്നു.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: സഭകൾ ശക്തിപ്പെട്ട മേഖല എന്ന ദാതുവിഭക്തിയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ ആർട്ടിക്കിൾ മലയാളത്തിൽ നിർബന്ധമായി വേർതിരിച്ചുകാണിക്കാനാവാത്തതിനാൽ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπερίσσευον
  choice: വർധിച്ചുകൊണ്ടുമിരുന്നു
  rationale: തുടർച്ചയായ വളർച്ചയെ സൂചിപ്പിക്കുന്ന അപൂർണ്ണ ഭൂതകാലഭാവം നിലനിർത്തുകയും καί-യുടെ കൂട്ടിച്ചേർക്കൽ ‘-ഉം’ വഴി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ ἀριθμῷ
  choice: അവയുടെ എണ്ണം
  rationale: വർധിച്ചത് സഭകളുടെ എണ്ണമാണെന്ന് ഗ്രീക്ക് വാക്യത്തിലെ ബഹുവചന കർത്താവിനോടുള്ള ബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: καθ’ ἡμέραν
  choice: അനുദിനം
  rationale: ഓരോ ദിവസവും തുടർച്ചയായി സംഭവിച്ച വർധനയെ മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: τῇ πίστει എന്നതിലെ πίστις-ന്റെ അർഥം
  choice: ക്രൈസ്തവവിശ്വാസം എന്ന പങ്കിട്ട വിശ്വാസജീവിതത്തിൽ സഭകൾ ശക്തിപ്പെട്ടു
  alternative: വിശ്വാസികളുടെ ദൈവത്തിലുള്ള വ്യക്തിപരമായ വിശ്വാസത്തിൽ സഭകൾ ശക്തിപ്പെട്ടു
  rationale: ആർട്ടിക്കിളും സഭാസന്ദർഭവും പങ്കിട്ട ക്രൈസ്തവവിശ്വാസത്തെ അനുകൂലിക്കുന്നു. എന്നാൽ വ്യക്തിപരമായ വിശ്വാസം എന്ന അർഥസാധ്യതയും യഥാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ അത് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശക്തിപ്പെട്ടുകൊണ്ടിരുന്നു’, ‘വർധിച്ചുകൊണ്ടുമിരുന്നു’ എന്നീ സമാന്തര രൂപങ്ങൾ രണ്ട് ഗ്രീക്ക് അപൂർണ്ണ ഭൂതകാലക്രിയകളുടെയും തുടർച്ചാഭാവം നിലനിർത്തുന്നു.
