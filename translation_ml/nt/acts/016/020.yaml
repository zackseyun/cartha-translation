source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: ml
  text: 'അവരെ നഗരാധികാരികളുടെ[a] മുമ്പിൽ കൊണ്ടുവന്നശേഷം അവർ പറഞ്ഞു: “യഹൂദന്മാരായ[b] ഈ മനുഷ്യർ നമ്മുടെ നഗരത്തെ കലക്കിമറിക്കുകയാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രേറ്റർമാർ”; ഫിലിപ്പിപോലുള്ള ഒരു റോമൻ കോളനിയിലെ പൗരഭരണാധികാരികൾ.
    reason: cultural_note
  - marker: b
    text: അഥവാ “യെഹൂദ്യരായ.” ഗ്രീക്ക് പദത്തിന് പൊതുവേ യഹൂദന്മാരെയോ യെഹൂദ്യദേശത്തുനിന്നുള്ളവരെയോ സൂചിപ്പിക്കാം; ഇവിടെ വംശീയ-മതപരമായ ആരോപണത്തിന് “യഹൂദന്മാർ” എന്നതാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: കൊണ്ടുവന്നശേഷം
  rationale: പ്രധാനക്രിയയായ εἶπαν-നു മുമ്പ് നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: στρατηγοῖς
  choice: നഗരാധികാരികളുടെ
  rationale: റോമൻ കോളനിയായ ഫിലിപ്പിയിലെ പൗരഭരണാധികാരികളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. സാങ്കേതിക പദമായ ‘പ്രൈറ്റർമാർ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി, മുഖ്യവാചകത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം ഉപയോഗിച്ചു.
- source_word: ἐκταράσσουσιν
  choice: കലക്കിമറിക്കുകയാണ്
  rationale: നഗരത്തിൽ ഗുരുതരമായ അസ്വസ്ഥതയും കുഴപ്പവും സൃഷ്ടിക്കുന്നു എന്ന ശക്തമായ ആരോപണം വർത്തമാനകാല ഭാവത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: ἡμῶν τὴν πόλιν
  choice: നമ്മുടെ നഗരത്തെ
  rationale: ആരോപകരുടെ പൗരസ്വത്വബോധവും ‘നമ്മുടെ’ എന്ന ഊന്നലും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: Ἰουδαῖοι
  choice: യഹൂദന്മാരായ
  rationale: ഫിലിപ്പിയിലെ സാഹചര്യത്തിൽ ഭൂമിശാസ്ത്രപരമായ യെഹൂദ്യദേശക്കാരെന്നതിലുപരി വംശീയ-മതപരമായ തിരിച്ചറിയലാണ് ആരോപണത്തിൽ മുന്നിൽ വരുന്നത്.
- source_word: ὑπάρχοντες
  choice: -ആയ
  rationale: ‘യഹൂദന്മാരായ’ എന്ന participial രൂപം ഗ്രീക്കിലെ സംക്ഷിപ്ത ബന്ധം നിലനിർത്തുന്നു; ‘ആയതിനാൽ’ എന്നു പറഞ്ഞ് കാരണബന്ധം അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: ഈ മനുഷ്യർ
  rationale: പൗലൊസിനെയും ശീലാസിനെയും ചൂണ്ടിക്കാണിക്കുന്ന നിർദ്ദിഷ്ട ബഹുവചനപ്രയോഗം ഔപചാരികവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: Ἰουδαῖοι എന്ന പദം ശത്രുതാപരമായ വംശീയ-മത ആരോപണത്തിൽ വിവർത്തനം ചെയ്യുന്നത്
  choice: യഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: ഇത് ആരോപകരുടെ ശത്രുതാപരമായ ഭാഷയാണ്; യഹൂദന്മാരെക്കുറിച്ചുള്ള ആഖ്യാതാവിന്റെ പൊതുവായ വിധിയല്ല. പ്രവാസസമൂഹമായ ഫിലിപ്പിയിലെ സന്ദർഭത്തിൽ വംശീയ-മതപരമായ അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്. എന്നാൽ ഭൂമിശാസ്ത്രപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ὑπάρχοντες എന്ന participle ആരോപണത്തിന് കാരണം നൽകുന്നുവോ എന്നത്
  choice: യഹൂദന്മാരായ ഈ മനുഷ്യർ
  alternative: ഇവർ യഹൂദന്മാരായതിനാൽ
  rationale: ഗ്രീക്ക് ഘടന അവരുടെ യഹൂദതിരിച്ചറിയലിനെ ആരോപണത്തോട് ചേർക്കുന്നു; എന്നാൽ വ്യക്തമായ കാരണസൂചകം ഇല്ല. അതിനാൽ കാരണബന്ധം നിർബന്ധമായി ചേർക്കാതെ യഥാർഥമായ അസ്പഷ്ടത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കോടതിസദൃശമായ രംഗത്തിന് യോജിച്ച ഔപചാരികത നിലനിർത്തിയെങ്കിലും അനാവശ്യമായ നിയമസാങ്കേതിക ഭാഷ ഒഴിവാക്കി. ആരോപണത്തിന്റെ ശക്തി ‘കലക്കിമറിക്കുകയാണ്’ എന്ന പ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
