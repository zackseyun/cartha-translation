source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: ml
  text: അവർ മിസ്യയുടെ സമീപത്തെത്തിയപ്പോൾ[a] ബിഥുന്യയിലേക്കു പോകാൻ ശ്രമിച്ചു; എന്നാൽ യേശുവിന്റെ ആത്മാവ് അവരെ അനുവദിച്ചില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മിസ്യയുടെ അരികിലെത്തിയപ്പോൾ’ അല്ലെങ്കിൽ ‘മിസ്യയോടുചേർന്ന് എത്തിയപ്പോൾ.’ ഗ്രീക്ക് പ്രയോഗം മിസ്യയുടെ അതിർത്തിപ്രദേശത്ത് എത്തിയതിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: എത്തിയപ്പോൾ
  rationale: സന്ദർഭത്തിൽ കാലസൂചന നൽകുന്ന aorist participle; സംഭവങ്ങളുടെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യാത്രാവിവരണത്തിൽനിന്നുള്ള മൃദുവായ മാറ്റവും തുടർന്നുവരുന്ന തടസ്സവും സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὴν Μυσίαν
  choice: മിസ്യയുടെ അടുത്ത്
  rationale: ഭൂമിശാസ്ത്രപരമായ κατά + accusative ഇവിടെ മിസ്യയുടെ അതിർത്തിപ്രദേശത്തോ സമീപത്തോ എത്തുന്നതിനെ സൂചിപ്പിക്കാം; പ്രദേശത്തിനുള്ളിൽ പ്രവേശിച്ചുവെന്ന് അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ἐπείραζον
  choice: ശ്രമിച്ചു
  rationale: Imperfect രൂപം പുരോഗമിച്ചിരുന്ന ശ്രമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ഉദ്ദേശിച്ച യാത്രാശ്രമം അറിയിക്കുന്നു.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: ബിഥുന്യയിലേക്കു പോകാൻ
  rationale: εἰς ലക്ഷ്യപ്രദേശത്തേക്കുള്ള ചലനവും πορευθῆναι യാത്ര ചെയ്യാനുള്ള ഉദ്ദേശവും വ്യക്തമാക്കുന്നു.
- source_word: οὐκ εἴασεν
  choice: അനുവദിച്ചില്ല
  rationale: ἐάω എന്നതിന്റെ ‘അനുവദിക്കുക’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു; ‘വിലക്കി’ എന്നു പറഞ്ഞ് ഗ്രീക്കിലുള്ളതിലധികം ശക്തമാക്കുന്നില്ല.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: യേശുവിന്റെ ആത്മാവ്
  rationale: ഗ്രീക്കിലെ അപൂർവവും ക്രിസ്തുസംബന്ധവുമായ പ്രയോഗം അതേപടി നിലനിർത്തുന്നു; അതിനെ ‘പരിശുദ്ധാത്മാവ്’ എന്നു സമന്വയിപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ എന്ന ക്രിസ്തുസംബന്ധമായ പ്രയോഗം
  choice: യേശുവിന്റെ ആത്മാവ്
  alternative: പരിശുദ്ധാത്മാവ് / ആത്മാവ്
  rationale: മൂലപാഠത്തിൽ Ἰησοῦ വ്യക്തമായി ഉള്ളതിനാൽ അതു നിലനിർത്തുന്നു. വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സവിശേഷതയെ വിശദീകരിച്ചോ പരിചിതമായ മറ്റൊരു പ്രയോഗത്തോട് സമന്വയിപ്പിച്ചോ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. സ്ഥലനാമങ്ങൾ ‘മിസ്യ’, ‘ബിഥുന്യ’ എന്നു ലിപ്യന്തരിച്ചു. κατὰ τὴν Μυσίαν എന്നതിലെ യഥാർഥ ഭൂമിശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
