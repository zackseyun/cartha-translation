id: ACT.16.32
reference: Acts 16:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ ⸀κυρίου ⸀σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: ml
  text: അവർ അവനോട്[c], അവന്റെ വീട്ടിലുണ്ടായിരുന്ന എല്ലാവരോടൊപ്പം[b], കർത്താവിന്റെ വചനം[a] സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിനെക്കുറിച്ചുള്ള സന്ദേശം.’ ‘കർത്താവിന്റെ വചനം’ എന്ന ഗ്രീക്ക് പ്രയോഗം കർത്താവിനുള്ളതോ കർത്താവിൽനിന്നു വരുന്നതോ കർത്താവിനെക്കുറിച്ചുള്ളതോ ആയ സന്ദേശത്തെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അവന്റെ വീട്ടുകാരായ എല്ലാവരോടും.’
    reason: lexical_alternative
  - marker: c
    text: 'പദാനുപദക്രമത്തോട് അടുത്തതായി: ‘അവർ അവനോട്, അവന്റെ വീട്ടിലുണ്ടായിരുന്ന എല്ലാവരോടൊപ്പം, കർത്താവിന്റെ വചനം സംസാരിച്ചു.’'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλάλησαν
  choice: സംസാരിച്ചു
  rationale: λαλέω ഇവിടെ സുവിശേഷസന്ദേശം നേരിട്ട് അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സംസാരിച്ചു’ എന്നത് മൂലത്തിലെ സാധാരണ സംസാരക്രിയയുടെ ഭാവം നിലനിർത്തുന്നു; ‘പ്രസംഗിച്ചു’ എന്നു പറഞ്ഞാൽ പരസ്യപ്രഘോഷണത്തിന്റെ അർഥം അനാവശ്യമായി ശക്തമാകും.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: ഏകവചന ദത്തിവിഭക്തിയിലുള്ള സർവനാമം ജയിലധികാരിയെ സൂചിപ്പിക്കുന്നു. λαλέωയോടൊപ്പം ഇത് സന്ദേശം ലഭിച്ച വ്യക്തിയെ സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: λόγος ഇവിടെ സംസാരിച്ച ക്രിസ്തീയ സന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വചനം’ പുതിയനിയമത്തിലെ പതിവുപ്രയോഗം നിലനിർത്തുകയും തുടർന്നുള്ള ‘കർത്താവിന്റെ’ എന്ന ബന്ധത്തെ തുറന്ന നിലയിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്നതിന് പദ്ധതിയുടെ പതിവനുസരിച്ച് ‘കർത്താവ്’ ഉപയോഗിച്ചു. ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തി ഈ വചനം കർത്താവിൽനിന്നുള്ളതോ കർത്താവിനെക്കുറിച്ചുള്ളതോ അവനോടു ബന്ധപ്പെട്ടതോ ആകാമെന്ന അർഥവ്യാപ്തി അനുവദിക്കുന്നു.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: അവന്റെ വീട്ടിലുണ്ടായിരുന്ന എല്ലാവരോടും
  rationale: σύν എന്നതിന്റെ അടിസ്ഥാനഭാവം ‘കൂടെ/ഒപ്പം’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ വീട്ടിലുണ്ടായിരുന്ന എല്ലാവരും സന്ദേശത്തിന്റെ ശ്രോതാക്കളായിരുന്നുവെന്നത് സ്വാഭാവിക മലയാളത്തിൽ രണ്ടാമത്തെ പരോക്ഷകർമമായി വ്യക്തമാക്കി.
- source_word: οἰκίᾳ
  choice: വീട്ടിൽ
  rationale: οἰκία ഭൗതികമായ വീടിനെയോ വീട്ടുകാരെയോ സൂചിപ്പിക്കാം. ‘വീട്ടിലുണ്ടായിരുന്നവർ’ എന്നത് ഗ്രീക്കിലെ സ്ഥലസൂചന നിലനിർത്തുന്നു; ‘വീട്ടുകാർ’ സാധുവായ സന്ദർഭപരമായ മറ്റൊരു വിവർത്തനമാണ്.
theological_decisions:
- issue: ‘കർത്താവിന്റെ വചനം’ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ‘കർത്താവിന്റെ വചനം’ എന്നു വിവർത്തനം ചെയ്ത് ഷഷ്ഠിവിഭക്തി കർത്താവിൽനിന്നുള്ള സന്ദേശമാണോ കർത്താവിനെക്കുറിച്ചുള്ള സന്ദേശമാണോ എന്നു നിർണയിക്കാതെ വിട്ടു.
  alternative: ‘കർത്താവിനെക്കുറിച്ചുള്ള സന്ദേശം’ അല്ലെങ്കിൽ ‘കർത്താവിൽനിന്നുള്ള സന്ദേശം’.
  rationale: τοῦ κυρίου എന്ന ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ ഈ അർഥങ്ങളിൽ ഒന്നിനെയോ രണ്ടിനെയും ഉൾക്കൊള്ളാം. മുഖ്യപാഠം അതിനെ ചുരുക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കർത്താവ്’, ‘വചനം’ എന്നീ പരിചിതമായ പുതിയനിയമപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി ക്രമപ്പെടുത്തി. σὺν എന്നതിന്റെ പദാനുപദരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
