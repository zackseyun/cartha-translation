- from: ഞങ്ങൾ പ്രാർഥനാസ്ഥലത്തേക്കു പോകുമ്പോൾ, പൈത്തോൻ ആത്മാവുള്ള ഒരു അടിമപ്പെൺകുട്ടി ഞങ്ങളെ കണ്ടുമുട്ടി.[a] ഭാവി പറഞ്ഞുകൊണ്ട് അവൾ തന്റെ യജമാനന്മാർക്ക് വളരെ ലാഭം നേടിക്കൊടുത്തിരുന്നു.[b]
  to: 'അങ്ങനെ സംഭവിച്ചു: ഞങ്ങൾ പ്രാർഥനാസ്ഥലത്തേക്കു പോകുമ്പോൾ, പൈത്തോൻ ആത്മാവുള്ള[a] ഒരു അടിമപ്പെൺകുട്ടി ഞങ്ങളെ എതിരേറ്റു. അവൾ ഭാവി പറഞ്ഞുകൊണ്ട് തന്റെ യജമാനന്മാർക്ക് വളരെ ലാഭം നേടിക്കൊടുത്തിരുന്നു.[b]'
  rationale: മുഖ്യപാഠത്തിൽ സാംസ്കാരികമായി സവിശേഷമായ πνεῦμα πύθωνα ‘പൈത്തോൻ ആത്മാവ്’ എന്നുതന്നെ സംരക്ഷിച്ചു. വിശദീകരണ അടിക്കുറിപ്പിൽ തെറ്റിദ്ധരിപ്പിക്കുന്ന ‘ദിവ്യജ്ഞാനം’ നീക്കി ഭാവിപ്രവചനബന്ധം വ്യക്തമാക്കി. ആങ്കർ അതു സൂചിപ്പിക്കുന്ന പദത്തിനടുത്തേക്കു മാറ്റി; ലൂക്കായ ആഖ്യാനത്തിന്റെ സംഭവപരിചയപ്പെടുത്തൽ ‘അങ്ങനെ സംഭവിച്ചു’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ ഉൾപ്പെടുത്തി.
