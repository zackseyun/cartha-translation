  source_fidelity: ‘അടിമപ്പെൺകുട്ടി,’ ‘പ്രാർഥനാസ്ഥലം,’ ‘പൈത്തോൻ ആത്മാവ്,’ യജമാനന്മാർക്കുള്ള സാമ്പത്തികലാഭം, ഭാവിപറച്ചിൽ എന്നിവ മൂലഗ്രീക്കിനോട് പൊതുവേ വിശ്വസ്തമാണ്. എന്നിരുന്നാലും Ἐγένετο δὲ-യുടെ ആഖ്യാനാരംഭം പൂർണമായി പ്രതിഫലിക്കുന്നില്ല; കൂടാതെ πύθων-നെ വിശദീകരിക്കുന്ന അടിക്കുറിപ്പിൽ ‘ദിവ്യജ്ഞാനം’ എന്ന പ്രയോഗം മന്തിക/ഭാവിപ്രവചന അർഥത്തെ തെറ്റായി ദൈവികജ്ഞാനമായി മാറ്റുന്നു.
  naturalness: മുഖ്യവാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. ‘ഞങ്ങളെ എതിരേറ്റു’ എന്നത് ὑπαντῆσαι ἡμῖν-ന്റെ നേരിട്ടുള്ള കൂടിക്കാഴ്ച/എതിരേ വരൽ കൂടുതൽ വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പ് a അതു വിശദീകരിക്കുന്ന ‘പൈത്തോൻ ആത്മാവ്’ എന്ന പദസമുച്ചയത്തോടുതന്നെ ചേർക്കണം.
