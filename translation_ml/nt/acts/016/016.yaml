id: ACT.16.16
reference: Acts 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിച്ചു: ഞങ്ങൾ പ്രാർഥനാസ്ഥലത്തേക്കു പോകുമ്പോൾ, പൈത്തോൻ ആത്മാവുള്ള[a] ഒരു അടിമപ്പെൺകുട്ടി ഞങ്ങളെ എതിരേറ്റു. അവൾ ഭാവി പറഞ്ഞുകൊണ്ട് തന്റെ യജമാനന്മാർക്ക് വളരെ ലാഭം നേടിക്കൊടുത്തിരുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭവിഷ്യവാണിയുടെ ആത്മാവുള്ള.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പൈത്തോൻ ആത്മാവ്” എന്നാണ്; ഭാവിപ്രവചനവുമായി ബന്ധപ്പെട്ട ഒരു സാംസ്കാരിക പദപ്രയോഗമാണിത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ദിവിനേഷൻ നടത്തിക്കൊണ്ട്” അല്ലെങ്കിൽ “ഭാവിപ്രവചനം നടത്തിക്കൊണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: സംഭവവിവരണത്തിന്റെ സ്വാഭാവിക തുടക്കമായി പ്രത്യേക പദപ്രയോഗമില്ലാതെ വാക്യഘടനയിൽ ഉൾപ്പെടുത്തി
  rationale: ലൂക്കോസിന്റെ സാധാരണ ആഖ്യാനസംക്രമണം മലയാളത്തിൽ ‘അങ്ങനെ സംഭവിച്ചു’ എന്നു യാന്ത്രികമായി ചേർക്കാതെ പശ്ചാത്തല ഉപവാക്യവും മുഖ്യസംഭവവുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: πορευομένων ἡμῶν
  choice: ഞങ്ങൾ ... പോകുമ്പോൾ
  rationale: സമകാലികമായി നടന്നുകൊണ്ടിരുന്ന പശ്ചാത്തലപ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന genitive absolute-ന്റെ കാലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὴν προσευχὴν
  choice: പ്രാർഥനാസ്ഥലത്തേക്ക്
  rationale: ഇവിടെ προσευχή വെറും പ്രാർഥനാക്രിയയല്ല, പ്രാർഥനയ്ക്കായി അറിയപ്പെട്ടിരുന്ന സ്ഥലത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: παιδίσκην τινά
  choice: ഒരു അടിമപ്പെൺകുട്ടി
  rationale: പല യജമാനന്മാരും അവളിലൂടെ സാമ്പത്തികലാഭം നേടുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ അവളുടെ അടിമസ്ഥിതി മറയ്ക്കുന്നില്ല.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: പൈത്തോൻ ആത്മാവുള്ള
  rationale: ഗ്രീക്കിലെ സാംസ്കാരികമായി സവിശേഷമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ അർത്ഥസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: ഞങ്ങളെ കണ്ടുമുട്ടി
  rationale: സംഭവപരിചയപ്പെടുത്തലിനെത്തുടർന്നുള്ള infinitive മുഖ്യസംഭവമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: വളരെ ലാഭം നേടിക്കൊടുത്തിരുന്നു
  rationale: ഗണ്യമായ സാമ്പത്തികനേട്ടവും imperfect സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയും പ്രകടമാക്കുന്നു.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: തന്റെ യജമാനന്മാർക്ക്
  rationale: κύριοι ഇവിടെ ദൈവിക ബിരുദമല്ല; അടിമപ്പെൺകുട്ടിയുടെമേൽ ഉടമസ്ഥതയും നിയന്ത്രണവും പുലർത്തിയവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: μαντευομένη
  choice: ഭാവി പറഞ്ഞുകൊണ്ട്
  rationale: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രീതിയിൽ മന്തികമായ പ്രവചനപ്രവർത്തിയെ അവതരിപ്പിക്കുന്നു; കൂടുതൽ സാങ്കേതികമായ പര്യായം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: πνεῦμα πύθωνα എന്ന സാംസ്കാരികമായി സവിശേഷമായ പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: പൈത്തോൻ ആത്മാവ്
  alternative: ദിവ്യജ്ഞാനത്തിന്റെ ആത്മാവ് / ഭവിഷ്യജ്ഞാനത്തിന്റെ ആത്മാവ്
  rationale: മൂലപാഠത്തിന്റെ പ്രത്യേക പദപ്രയോഗം വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുകയും വായനാസഹായം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: παιδίσκη എന്ന പദത്തിൽ അടിമസ്ഥിതി വ്യക്തമാക്കണമോ
  choice: അടിമപ്പെൺകുട്ടി
  alternative: വേലക്കാരിപ്പെൺകുട്ടി
  rationale: അവളുടെ യജമാനന്മാർ അവളെ സാമ്പത്തികമായി ചൂഷണം ചെയ്യുന്ന സന്ദർഭത്തിൽ ബന്ധിതമായ സാമൂഹികസ്ഥിതി പ്രസക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. അടിമസ്ഥിതിയും സാമ്പത്തികചൂഷണവും വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘പൈത്തോൻ ആത്മാവ്’ എന്ന അപരിചിതമായ മൂലഭാഷാപ്രയോഗം വിശദീകരണ അടിക്കുറിപ്പോടുകൂടി സംരക്ഷിക്കുന്നു.
