  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: ml
  text: കൂടാതെ, റോമാക്കാരായ നമുക്ക്[a] സ്വീകരിക്കാനോ അനുഷ്ഠിക്കാനോ അനുവദനീയമല്ലാത്ത ആചാരങ്ങൾ ഇവർ പ്രഘോഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം റോമാക്കാരായതിനാൽ” അല്ലെങ്കിൽ “റോമാക്കാരെന്ന നിലയിൽ.” ഗ്രീക്കിലെ കൃദന്തരൂപത്തിലുള്ള പദസമുച്ചയം ഈ ആചാരങ്ങൾ നിരസിക്കുന്നതിന് കുറ്റാരോപകർ പറയുന്ന കാരണം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: പ്രഘോഷിക്കുന്നു
  rationale: പരസ്യമായി അറിയിക്കുക അഥവാ പ്രഘോഷിക്കുക എന്ന ക്രിയയുടെ അർഥവും ഇപ്പോൾ ഉന്നയിക്കുന്ന കുറ്റാരോപണത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു; ‘പ്രചരിപ്പിക്കുന്നു’ എന്നത് സാധ്യമെങ്കിലും അല്പം വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἔθη
  choice: ആചാരങ്ങൾ
  rationale: സ്ഥിരപ്പെട്ട സാമൂഹികമോ മതപരമോ ആയ പതിവുകളെ സൂചിപ്പിക്കുന്ന ἔθηയ്ക്ക് സ്വാഭാവികവും മാന്യവുമായ മലയാള തുല്യപദം.
- source_word: οὐκ ἔξεστιν
  choice: നിയമം അനുവദിക്കാത്ത
  rationale: നിയമപരമോ സാമൂഹികമോ ആയ അനുമതിയുടെ അഭാവം സൂചിപ്പിക്കുന്ന പ്രയോഗം; കുറ്റാരോപകർ ഉപയോഗിക്കുന്ന നിയമപരമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: παραδέχεσθαι
  choice: സ്വീകരിക്കാനോ
  rationale: ആചാരങ്ങളെ സാധുവായി കൈക്കൊള്ളുകയോ അംഗീകരിക്കുകയോ ചെയ്യുന്ന വിശാലമായ അർഥം നൽകുന്നു; ‘ഏറ്റെടുക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികം.
- source_word: οὐδὲ ποιεῖν
  choice: അനുഷ്ഠിക്കാനോ
  rationale: ആചാരങ്ങൾ ചെയ്യുക/പാലിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ῥωμαίοις οὖσιν
  choice: റോമാക്കാരായ നമുക്ക്
  rationale: ദാത്തീവ് കർത്തൃവാചക കൃദന്തരൂപം നൽകുന്ന കാരണാധിഷ്ഠിത പശ്ചാത്തലം ചുരുക്കവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ‘നാം റോമാക്കാരായതിനാൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള തുടർച്ച ഒറ്റവാക്യത്തിന്റെ തുടക്കത്തിൽ മലയാളത്തിൽ നിർബന്ധമായി പ്രകടിപ്പിക്കേണ്ടതില്ല; വാക്യത്തിന്റെ പ്രവാഹത്തിൽ ബന്ധം അന്തർലീനമാണ്.
theological_decisions:
- issue: കുറ്റാരോപണത്തിലെ വിലക്കിന്റെ സ്വഭാവം
  choice: ‘നിയമം അനുവദിക്കാത്ത’ എന്ന നിയമ-പൗര ഭാവത്തിൽ കുറ്റാരോപണം റിപ്പോർട്ട് ചെയ്യുന്നു; അതിന്റെ സത്യാവസ്ഥ വാക്യം അംഗീകരിക്കുന്നതായി സൂചിപ്പിക്കുന്നില്ല.
  alternative: ‘നമുക്ക് ശരിയല്ലാത്ത’ എന്ന കൂടുതൽ അയഞ്ഞ അവതരണം.
  rationale: ഇത് കുറ്റാരോപകരുടെ അവകാശവാദമാണ്; യഥാർഥ റോമൻ നിയമത്തെക്കുറിച്ചുള്ള ലൂക്കോസിന്റെ സ്ഥിരീകരണമല്ല. അതിനാൽ ഉറവിടത്തിലെ നിയമപരമായ ഭാഷ നിലനിർത്തുകയും അധിക വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരമായ കുറ്റാരോപണത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് അമിതമായ നിയമസാങ്കേതിക ഭാഷ ഒഴിവാക്കി. അടിക്കുറിപ്പിന്റെ [a] ചിഹ്നം മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തി.
