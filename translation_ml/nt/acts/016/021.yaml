  to: കൂടാതെ, റോമാക്കാരായ നമുക്ക്[a] സ്വീകരിക്കാനോ അനുഷ്ഠിക്കാനോ അനുവദനീയമല്ലാത്ത ആചാരങ്ങൾ ഇവർ പ്രഘോഷിക്കുന്നു.
