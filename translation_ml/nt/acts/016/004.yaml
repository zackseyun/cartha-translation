  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: ml
  text: അവർ പട്ടണങ്ങളിലൂടെ സഞ്ചരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, യെരൂശലേമിലെ അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും തീരുമാനിച്ചിരുന്ന നിർണയങ്ങൾ[a] പാലിക്കേണ്ടതിന് അവർക്കു കൈമാറിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീർപ്പുകൾ”; ഗ്രീക്കിലെ ഡോഗ്മാറ്റ എന്ന പദം യെരൂശലേമിലെ സഭായോഗം പുറപ്പെടുവിച്ച ഔദ്യോഗിക തീരുമാനങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: പട്ടണങ്ങളിലൂടെ സഞ്ചരിക്കുമ്പോൾ
  rationale: അപൂർണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന, പല പട്ടണങ്ങളിലൂടെയുള്ള തുടർച്ചയായ യാത്ര സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρεδίδοσαν
  choice: കൈമാറി
  rationale: അധികാരപൂർവമായ നിർണയങ്ങൾ മറ്റുള്ളവർക്ക് ഏല്പിച്ചുകൊടുക്കുക എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്ക്
  rationale: ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ സർവനാമരൂപം തന്നെയാണ് നിലനിർത്തിയത്.
- source_word: φυλάσσειν
  choice: പാലിക്കേണ്ടതിന്
  rationale: ശ്രദ്ധാപൂർവം അനുസരിക്കുകയും തുടർന്നും ആചരിക്കുകയും ചെയ്യുക എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δόγματα
  choice: നിർണയങ്ങൾ
  rationale: യെരൂശലേമിലെ സഭാനേതൃത്വം ഔദ്യോഗികമായി എടുത്ത തീരുമാനങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സാങ്കേതിക അർഥത്തിലുള്ള ‘വിശ്വാസപ്രമാണം’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: κεκριμένα
  choice: തീരുമാനിച്ച
  rationale: മുമ്പേ എടുത്തതും പ്രാബല്യത്തിൽ തുടരുന്നതുമായ തീരുമാനത്തെ perfect passive participle സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സന്ദർഭത്തിൽ കർത്താക്കളെ മുന്നിൽ കൊണ്ടുവന്ന് സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ അംഗീകൃതമായ ശുശ്രൂഷാ-നേതൃത്വ പദങ്ങൾക്ക് പ്രചാരത്തിലുള്ളതും വ്യക്തവുമായ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: യെരൂശലേമിലുള്ള
  rationale: ഈ സ്ഥലംസൂചകപ്രയോഗം അപ്പൊസ്തലന്മാരെയും മൂപ്പന്മാരെയും ഒരുപോലെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὡς δὲ
  choice: സഞ്ചരിക്കുമ്പോൾ
  rationale: കഥയുടെ പുരോഗതിയോടൊപ്പം നടക്കുന്ന പ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ കാലബന്ധമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേമിലെ സഭായോഗത്തിന്റെ നിർണയങ്ങളുടെ അധികാരം
  choice: δόγματα എന്നത് ‘നിർണയങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി; അവ ഔദ്യോഗികവും പാലിക്കേണ്ടതുമായിരുന്നുവെന്ന് ക്രിയാസന്ദർഭം വ്യക്തമാക്കുന്നു.
  alternative: ‘ഉത്തരവുകൾ’ അല്ലെങ്കിൽ ‘തീർപ്പുകൾ’
  rationale: ‘നിർണയങ്ങൾ’ എന്നത് അപ്പൊസ്തലന്മാരും മൂപ്പന്മാരും കൂട്ടായി എടുത്ത അധികാരപൂർവമായ തീരുമാനങ്ങളെ സൂചിപ്പിക്കുന്നു; അതേസമയം പിൽക്കാല സഭാപരമായ സാങ്കേതിക അർഥമോ അതിരുകടന്ന നിയമഭാഷയോ പാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ സർവനാമപരമായ അവ്യക്തത നിലനിർത്തിയിട്ടുണ്ട്; ഔദ്യോഗിക തീരുമാനങ്ങളുടെ സ്വഭാവം വ്യക്തമാക്കിയെങ്കിലും പിൽക്കാല സഭാസാങ്കേതിക പദാവലി ഒഴിവാക്കി.
