  source_fidelity: The draft accurately represents the principal participants, Jerusalem location, pronominal recipient, and the sense that authoritative rulings were to be observed. However, both διεπορεύοντο and παρεδίδοσαν are imperfects; the Malayalam finite form കൈമാറി presents the transmission as a simple completed event rather than an ongoing action accompanying their travel.
