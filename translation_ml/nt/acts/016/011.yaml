id: ACT.16.11
reference: Acts 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: ml
  text: അങ്ങനെ, ത്രോവാസിൽനിന്ന് പുറപ്പെട്ട് ഞങ്ങൾ നേരേ സമൊത്രാക്കെയിലേക്കു കപ്പലോടിച്ചു; പിറ്റേന്ന് നെപ്പോലിസിലേക്കും പോയി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: കപ്പൽ പുറപ്പെട്ട
  rationale: ἀνάγω എന്ന ക്രിയയുടെ നാവികസന്ദർഭത്തിലെ ‘കടലിലേക്കു പുറപ്പെടുക/കപ്പൽയാത്ര തുടങ്ങുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കർത്താവും തുടർന്നുള്ള മുഖ്യക്രിയയും ഒരേ ‘ഞങ്ങൾ’ ആയതിനാൽ കൃന്നന്തരൂപം ക്രമബന്ധം നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അങ്ങനെ
  rationale: യാത്രാവിവരണത്തിലെ തുടർച്ചയും മുൻസംഭവത്തിന്റെ ഫലമായ മുന്നേറ്റവും സൂചിപ്പിക്കുന്നു; ‘അതുകൊണ്ട്’ എന്ന ശക്തമായ നിഗമനഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἀπὸ Τρῳάδος
  choice: ത്രോവാസിൽനിന്ന്
  rationale: പുറപ്പെടുന്ന സ്ഥലം സൂചിപ്പിക്കുന്ന ἀπό സ്വാഭാവികമായ ‘-ൽനിന്ന്’ രൂപത്തിൽ നൽകി; Τρῳάς എന്ന സ്ഥലനാമം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: εὐθυδρομήσαμεν
  choice: നേരെ … യാത്ര ചെയ്തു
  rationale: നേരായ ഗതിയിൽ കപ്പലോടിക്കുക എന്ന പ്രത്യേക നാവികാർഥം ‘കപ്പൽ പുറപ്പെട്ട’ എന്ന മുൻപ്രയോഗത്തിന്റെ പശ്ചാത്തലത്തിൽ സ്വാഭാവികമായി വ്യക്തമാകുന്നു; ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള നേരിട്ടുള്ള യാത്ര എന്ന ദിശാബലം സംരക്ഷിക്കുന്നു.
- source_word: εἰς Σαμοθρᾴκην
  choice: സമൊത്രാക്കെയിലേക്ക്
  rationale: εἰς ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘-യിലേക്ക്’ ഉപയോഗിച്ചു; ഗ്രീക്ക് സ്ഥലനാമത്തിന്റെ ശബ്ദരൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം സ്വീകരിച്ചു.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: പിറ്റേന്ന്
  rationale: ‘തുടർന്ന ദിവസം’ എന്ന കാലസൂചന സാധാരണ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു; δέയുടെ തുടർച്ചാഭാവം തുടർന്നുള്ള ‘-ഉം’ വാക്യബന്ധം വഹിക്കുന്നു.
- source_word: εἰς Νέαν Πόλιν
  choice: നെപ്പോലിസിലേക്ക്
  rationale: ഇത് ഇവിടെ സ്ഥലനാമമായതിനാൽ ‘പുതിയ നഗരം’ എന്നു അർഥപരിഭാഷ ചെയ്യാതെ സ്ഥാപിതമായ നാമരൂപം ലിപ്യന്തരിച്ചു; εἰς ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യാത്രാവിവരണശൈലി. ‘ഞങ്ങൾ’ എന്ന ഒന്നാംപുരുഷ ബഹുവചനം വ്യക്തമായി നിലനിർത്തി. ഗ്രീക്ക് വാക്യത്തിന്റെ പങ്കുവാക്യക്രമവും രണ്ട് ദിവസങ്ങളിലായുള്ള യാത്രാനുക്രമവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പുനരാവിഷ്കരിച്ചു.
