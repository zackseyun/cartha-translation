id: ACT.16.2
reference: Acts 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐμαρτυρεῖτο ὑπὸ τῶν ἐν Λύστροις καὶ Ἰκονίῳ ἀδελφῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: ml
  text: ലുസ്ത്രയിലും ഇക്കോന്യയിലുമുള്ള സഹോദരന്മാർ അവനെക്കുറിച്ച് നല്ല സാക്ഷ്യം പറഞ്ഞിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരന്മാരും സഹോദരിമാരും”; ഇവിടെ ആ സ്ഥലങ്ങളിലെ സഹവിശ്വാസികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: അവനെക്കുറിച്ചു
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ തിമൊഥെയൊസിനെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യം രൂപപ്പെടുത്താൻ കർമസംബന്ധമായ ‘അവനെക്കുറിച്ചു’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: ἐμαρτυρεῖτο
  choice: നല്ല സാക്ഷ്യം പറഞ്ഞിരുന്നു
  rationale: μαρτυρέωയുടെ അപൂർണകാല കർമണിപ്രയോഗം ഇവിടെ മറ്റുള്ളവരിൽനിന്നു ലഭിച്ച അനുകൂല സാക്ഷ്യത്തെയോ നല്ല പേരിനെയോ സൂചിപ്പിക്കുന്നു. ‘നല്ല സാക്ഷ്യം പറഞ്ഞിരുന്നു’ മൂലത്തിലെ സാക്ഷ്യഭാവവും അനുകൂല അർഥവും നിലനിർത്തുന്നു.
- source_word: ὑπὸ
  choice: സഹോദരന്മാർ
  rationale: കർമണിവാക്യത്തിലെ വ്യക്തിപരമായ പ്രവർത്തകരെ ὑπό + ഷഷ്ഠി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി കർത്തൃപ്രയോഗത്തിലേക്ക് മാറ്റി, പ്രവർത്തകരെ ‘സഹോദരന്മാർ’ എന്ന കർത്താവായി നൽകി.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: ലുസ്ത്രയിലും ഇക്കോന്യയിലുമുള്ള
  rationale: നഗരങ്ങളിൽ ഉണ്ടായിരുന്ന വിശ്വാസിസമൂഹത്തെ വിശേഷിപ്പിക്കുന്ന സ്ഥാനസൂചക ഘടന മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἀδελφῶν
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ രൂപം പുല്ലിംഗ ബഹുവചനമാണ്. മുഖ്യപാഠത്തിൽ അതു നിലനിർത്തി; സന്ദർഭത്തിൽ സഹവിശ്വാസികളായ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന സമൂഹപ്രയോഗമാണെന്നു അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: ക്രിസ്തീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ἀδελφῶν എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹവിശ്വാസികൾ
  rationale: മൂലരൂപത്തിന്റെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; എന്നാൽ ആദിമ ക്രിസ്തീയ സമൂഹപ്രയോഗത്തിൽ ഇത് സ്ത്രീപുരുഷന്മാരായ സഹവിശ്വാസികളെ വിശാലമായി സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിഘടന മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായ കർത്തൃഘടനയാക്കി; അനുകൂല സാക്ഷ്യമെന്ന ആശയം വ്യക്തമായി സൂക്ഷിച്ചു.
