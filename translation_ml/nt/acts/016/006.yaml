id: ACT.16.6
reference: Acts 16:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: ml
  text: പരിശുദ്ധാത്മാവിനാൽ ഏഷ്യയിൽ[a] വചനം പ്രസംഗിക്കുന്നതിൽനിന്ന് തടയപ്പെട്ട അവർ ഫ്രുഗ്യയുടെയും ഗലാത്യയുടെയും പ്രദേശത്തുകൂടെ[b] കടന്നുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നു പറയുന്നത് ആധുനിക ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറുഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ്.
    reason: cultural_note
  - marker: b
    text: “ഫ്രുഗ്യ-ഗലാത്യ പ്രദേശത്തുകൂടെ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദഘടനയെ ഒരൊറ്റ പ്രാദേശിക നിർദേശമായി മനസ്സിലാക്കാൻ കഴിയും.
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: കടന്നുപോയി
  rationale: διέρχομαι എന്ന ക്രിയയുടെ ഒരു പ്രദേശത്തിലൂടെയുള്ള സഞ്ചാരാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; പ്രത്യേകമായി ‘എന്നാൽ’ എന്നു ചേർത്താൽ ഇല്ലാത്ത വൈരുധ്യം തോന്നാം.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: ഫ്രുഗ്യയിലൂടെയും ഗലാത്യപ്രദേശത്തിലൂടെയും
  rationale: χώραയുടെ ‘പ്രദേശം’ എന്ന അർഥം വ്യക്തമാക്കുകയും ഗ്രീക്ക് ഘടനയിൽ ഒന്നോ രണ്ടോ പ്രാദേശിക നിർദേശങ്ങൾ വായിക്കാവുന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: κωλυθέντες
  choice: വിലക്കിയിരുന്നു
  rationale: κωλύωയുടെ അഓറിസ്റ്റ് പാസീവ് കൃദന്തം സൂചിപ്പിക്കുന്ന മുൻകാലമോ അനുബന്ധമോ ആയ നിരോധനം സ്വാഭാവിക മലയാള വാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവ് അവരെ
  rationale: ഗ്രീക്കിലെ കർത്തൃകാരണത്തെ മലയാളത്തിൽ സജീവവാക്യമാക്കി സ്വാഭാവികമായി നൽകുന്നു; ദൈവിക പ്രവർത്തകനെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λαλῆσαι
  choice: പ്രസ്താവിക്കുന്നതിൽനിന്ന്
  rationale: λαλέωയുടെ അടിസ്ഥാനമായ ‘സംസാരിക്കുക/പറയുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പ്രസംഗിക്കുക’ എന്ന കൂടുതൽ സാങ്കേതിക അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: ലൂക്കോസ്–പ്രവൃത്തികളിലെ λόγος എന്ന പ്രയോഗത്തിന്റെ പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ തുല്യപദം; ‘സുവിശേഷം’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: ഏഷ്യയിൽ
  rationale: സ്ഥലനാമം മുഖ്യവാചകത്തിൽ നിലനിർത്തി അതിന്റെ പുരാതന റോമൻ പ്രവിശ്യാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: നിരോധനത്തിൽ ആത്മാവിന്റെ പ്രവർത്തകത്വവും വ്യക്തിത്വവും
  choice: പരിശുദ്ധാത്മാവ് അവരെ വിലക്കിയിരുന്നു
  alternative: ആത്മാവിനാൽ അവർ തടയപ്പെട്ടിരുന്നു
  rationale: τοῦ ἁγίου πνεύματος എന്ന പദസമുച്ചയവും ὑπό സഹിതമുള്ള കർത്തൃകാരണവും പരിശുദ്ധാത്മാവിനെ പ്രവർത്തകനായി സൂചിപ്പിക്കുന്നു. സജീവവാക്യം ഇത് വ്യക്തമായി നൽകുന്നു, എന്നാൽ സംഭവരീതി പാഠത്തിൽ ഇല്ലാത്തവിധം വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപത്തിൽ നൽകിയിരിക്കുന്നു. ഗ്രീക്കിലെ ദീർഘമായ കൃദന്തഘടന വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
