revisions:
- from: അവർ ഫ്രുഗ്യയിലൂടെയും ഗലാത്യപ്രദേശത്തിലൂടെയും[b] കടന്നുപോയി. ഏഷ്യയിൽ[a] വചനം പ്രസ്താവിക്കുന്നതിൽനിന്ന് പരിശുദ്ധാത്മാവ് അവരെ വിലക്കിയിരുന്നു.
