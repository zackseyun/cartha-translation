id: ACT.16.27
reference: Acts 16:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: ml
  text: തടവറയുടെ കാവൽക്കാരൻ ഉണർന്ന്, തടവറയുടെ വാതിലുകൾ തുറന്നുകിടക്കുന്നതു കണ്ടപ്പോൾ[a], തന്റെ വാൾ[b] ഊരി, തടവുകാർ രക്ഷപ്പെട്ടുപോയെന്ന് കരുതി, സ്വയം കൊല്ലാൻ പോകുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: ‘തടവറയുടെ വാതിലുകൾ തുറക്കപ്പെട്ട നിലയിൽ കണ്ടപ്പോൾ.’ ഗ്രീക്കിലെ പൂർണകാല പങ്കുപദം വാതിലുകൾ തുറക്കപ്പെട്ട നിലയിൽ ആയിരുന്നതിന് ഊന്നൽ നൽകുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: μάχαιρα എന്ന ഗ്രീക്കുപദം വാളിനെയോ കഠാരംപോലുള്ള നീളം കുറഞ്ഞ മൂർച്ചയുള്ള ആയുധത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിലെ പതിവ് പരിഭാഷയായി ‘വാൾ’ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: ഉണർന്ന്
  rationale: ഉറക്കത്തിൽനിന്ന് ഉണരുന്ന അവസ്ഥയിലേക്കുള്ള പ്രവേശനം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: δεσμοφύλαξ
  choice: തടവറക്കാവൽക്കാരൻ
  rationale: തടവുകാരുടെ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ കൃത്യമായി സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘കാവൽക്കാരൻ’ എന്നതിനെക്കാൾ സന്ദർഭനിർണിതമാണ്.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: തടവറയുടെ വാതിലുകൾ തുറന്നുകിടക്കുന്നതു കണ്ടപ്പോൾ
  rationale: പൂർണകാല നിഷ്ക്രിയ പങ്കുപദം സൂചിപ്പിക്കുന്ന, തുറക്കപ്പെട്ടതിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: തന്റെ വാൾ ഊരി
  rationale: ആയുധം ഉറയിൽനിന്ന് പുറത്തെടുക്കുന്ന പ്രവൃത്തി ‘ഊരി’ സ്വാഭാവികമായി നൽകുന്നു; μάχαιρα എന്നതിന് സന്ദർഭത്തിലെ പതിവ് പരിഭാഷയായി ‘വാൾ’ സ്വീകരിച്ചു.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: സ്വയം കൊല്ലാൻ ഒരുങ്ങി
  rationale: അടുത്തുതന്നെ ചെയ്യാനിരുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും ആത്മഹത്യ എന്ന ആശയം വ്യാഖ്യാനപരമായി അധികം വികസിപ്പിക്കാതെ മൂലവാക്യത്തിന്റെ രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: νομίζων
  choice: കരുതി
  rationale: തുറന്ന വാതിലുകൾ കണ്ടുണ്ടായ നിഗമനമാണ് പ്രവൃത്തിക്കു കാരണമെന്ന് വ്യക്തമാക്കുന്നു; ഉറപ്പിനെക്കാൾ ധാരണയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκπεφευγέναι
  choice: രക്ഷപ്പെട്ടുപോയെന്ന്
  rationale: പൂർണകാല അനന്തക്രിയ സൂചിപ്പിക്കുന്ന, ഇതിനകം പൂർത്തിയായ രക്ഷപ്പെടൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς δεσμίους
  choice: തടവുകാർ
  rationale: ഈ സന്ദർഭത്തിലെ തടവിലാക്കപ്പെട്ട ആളുകളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലത്തിലെ പങ്കുപദബന്ധങ്ങൾ മലയാളത്തിലെ കാലബന്ധിത ഉപവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
