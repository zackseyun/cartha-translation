id: ACT.16.31
reference: Acts 16:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: ml
  text: 'അവർ പറഞ്ഞു: “കർത്താവായ യേശുവിൽ വിശ്വസിക്കുക; നീയും നിന്റെ വീട്ടുകാരും[a] രക്ഷിക്കപ്പെടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വീട്ടുകാർ” എന്നത് അവന്റെ വീട്ടിലുള്ള ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; വീടെന്ന കെട്ടിടത്തെയല്ല.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: അവർ പറഞ്ഞു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിലുപരി ആഖ്യാനത്തെ ബന്ധിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്തു.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: …യിൽ വിശ്വസിക്കുക
  rationale: വിശ്വാസം ആരിലേക്കാണ് തിരിയേണ്ടതെന്ന് ἐπί + accusative സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികമായ പുതിയനിയമ പ്രയോഗം ‘…യിൽ വിശ്വസിക്കുക’ എന്നതാണ്; നിർണായക പ്രതികരണത്തിനുള്ള aorist imperative-ന്റെ ആഹ്വാനവും ഇത് നിലനിർത്തുന്നു.
- source_word: κύριον Ἰησοῦν
  choice: കർത്താവായ യേശു
  rationale: κύριος എന്ന പദത്തിന്റെ ബഹുമാനസൂചകവും ക്രിസ്തുസംബന്ധിയായ ദൈവശാസ്ത്രപരവുമായ ശക്തി ‘കർത്താവ്’ നിലനിർത്തുന്നു; ‘ആയ’ ചേർക്കുന്നത് മലയാളത്തിൽ പദബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: σωθήσῃ
  choice: രക്ഷിക്കപ്പെടും
  rationale: σῴζω എന്ന ക്രിയയുടെ future passive രൂപം നേരിട്ട് നിലനിർത്തുന്നു; താൽക്കാലിക വിടുതലിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ ഈ സുവിശേഷസന്ദർഭത്തിലെ സമഗ്രമായ രക്ഷാബോധം സംരക്ഷിക്കുന്നു.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: നീയും നിന്റെ വീട്ടുകാരും
  rationale: οἶκος ഇവിടെ കെട്ടിടമല്ല, തടവറക്കാരന്റെ ഭവനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വീട്ടുകാർ’ സാധാരണ ആധുനിക മലയാളത്തിൽ ഈ സാമൂഹിക അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ‘നീയും നിന്റെ വീട്ടുകാരും’ എന്ന വാഗ്ദാനത്തിന്റെ വ്യാപ്തി
  choice: തടവറക്കാരനെയും അവന്റെ വീട്ടുകാരെയും വാക്യത്തിൽ ഉൾപ്പെടുത്തി, അവരുടെ രക്ഷയുടെ രീതി വിശദീകരിക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: തടവറക്കാരന്റെ വിശ്വാസംകൊണ്ടുമാത്രം വീട്ടുകാർ സ്വയമേവ രക്ഷിക്കപ്പെടുമെന്നോ, മറുവശത്ത് വീട്ടുകാരെ സംബന്ധിച്ച വാഗ്ദാനം അപ്രധാനമാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം വ്യക്തിയെയും അവന്റെ οἶκος-നെയും ഉൾക്കൊള്ളുന്നു; എന്നാൽ ഈ വാക്യം മാത്രം ഓരോരുത്തരുടെ വിശ്വാസം, കുടുംബപരമായ ഉൾപ്പെടുത്തൽ, സ്നാനം എന്നിവയെക്കുറിച്ചുള്ള പിന്നീടുള്ള ദൈവശാസ്ത്രവിവാദങ്ങൾ തീർപ്പാക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ പാഠപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘വീട്ടുകാർ’ ഉപയോഗിച്ചു; സഭാപരമായ പ്രത്യേക സാങ്കേതികഭാഷയും ഏതെങ്കിലും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
