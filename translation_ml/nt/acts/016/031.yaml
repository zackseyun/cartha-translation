review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative to believe in the Lord Jesus, the future passive promise of salvation, and the inclusion of the jailer and his household. However, «അപ്പോൾ» introduces an explicit consequential/temporal nuance not expressed by the Greek connective καί, which is simply coordinative here.
  naturalness: The Malayalam is clear, modern, and appropriately dignified. «കർത്താവായ യേശുവിൽ വിശ്വസിക്കുക» and «വീട്ടുകാർ» are natural in this register.
  terminology: «കർത്താവായ യേശു» faithfully preserves κύριον Ἰησοῦν, and «രക്ഷിക്കപ്പെടും» appropriately preserves the future passive σωθήσῃ. «വീട്ടുകാർ» suitably communicates οἶκος as a household rather than a building.
  issues:
  - severity: low
    issue: «അപ്പോൾ» is added before the salvation promise.
    rationale: The Greek has καί (“and”), not an explicit “then” or “as a result.” Although the implication may be contextually reasonable, omitting «അപ്പോൾ» more closely preserves the wording and leaves the relationship unelaborated.
  revised_text: 'അവർ പറഞ്ഞു: “കർത്താവായ യേശുവിൽ വിശ്വസിക്കുക; നീയും നിന്റെ വീട്ടുകാരും[a] രക്ഷിക്കപ്പെടും.”'
