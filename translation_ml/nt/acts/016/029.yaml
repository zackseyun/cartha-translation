  terminology: «പൗലോസ്», «ശീലാസ്», «ഭയത്താൽ വിറച്ചുകൊണ്ട്», and «മുമ്പിൽ വീണു» are suitable. The revised footnote c avoids implying either a particular bodily posture or worship.
