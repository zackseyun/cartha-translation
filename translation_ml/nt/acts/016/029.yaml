  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: ml
  text: പിന്നെ, വെളിച്ചം ആവശ്യപ്പെട്ട് അയാൾ അകത്തേക്ക് പാഞ്ഞുകയറി[a]. ഭയത്താൽ വിറച്ചുകൊണ്ട്[b] അയാൾ പൗലോസിന്റെയും ശീലാസിന്റെയും മുമ്പിൽ വീണു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അയാൾ അകത്തേക്ക് ചാടിക്കയറി.’ പെട്ടെന്നുള്ളതും ശക്തവുമായ അകത്തേക്കുള്ള ചലനമാണ് ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിറച്ചുകൊണ്ട്.’ ഭയംകൊണ്ട് ശരീരം വിറയ്ക്കുന്ന അവസ്ഥയാണ് ഈ പ്രയോഗം വിവരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അയാൾ പൗലോസിന്റെയും ശീലാസിന്റെയും മുമ്പിൽ വീണു.’ ഈ വാക്കുകൾ ഭയത്തോടെയുള്ള അപേക്ഷയെയോ ആദരവിനെയോ സൂചിപ്പിക്കുന്നു; ആരാധനയെന്ന അർഥം നിർബന്ധമല്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: പിന്നെ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയിലെ അടുത്ത സംഭവത്തിലേക്കുള്ള നീക്കമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: αἰτήσας
  choice: ആവശ്യപ്പെട്ടിട്ട്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φῶτα
  choice: വിളക്കുകൾ
  rationale: പ്രകാശം നൽകുന്ന വസ്തുക്കളെ സൂചിപ്പിക്കുന്ന ബഹുവചനം. ‘വെളിച്ചങ്ങൾ’ എന്ന അക്ഷരാർഥപരമായ രൂപത്തേക്കാൾ സ്വാഭാവികമാണ്; വിളക്കിന്റെ കൃത്യമായ ഇനം നിർണയിക്കുന്നില്ല.
- source_word: εἰσεπήδησεν
  choice: അകത്തേക്ക് പാഞ്ഞുകയറി
  rationale: പെട്ടെന്നുള്ളതും ശക്തവുമായ അകത്തേക്കുള്ള ചലനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔντρομος γενόμενος
  choice: ഭയത്താൽ വിറച്ചുകൊണ്ട്
  rationale: ഭയവും അതുമൂലമുള്ള ശാരീരിക വിറയലും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προσέπεσεν
  choice: മുമ്പിൽ വീണു
  rationale: ഭയത്തോടെയുള്ള അപേക്ഷയെയോ ആദരവിനെയോ സൂചിപ്പിക്കാവുന്ന വീഴ്ചയെ നിലനിർത്തുന്നു; ‘ആരാധിച്ചു’ എന്ന അധിക ദൈവശാസ്ത്രാർഥം ചേർക്കുന്നില്ല.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: പൗലോസിന്റെയും ശീലാസിന്റെയും മുമ്പിൽ
  rationale: ഗ്രീക്ക് dative-നെ ഈ ക്രിയയോടൊപ്പം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘കാൽക്കൽ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത ശരീരസ്ഥാനവിശദാംശം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ജയിലധികാരി പൗലോസിന്റെയും ശീലാസിന്റെയും മുമ്പിൽ വീണ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: ഭയത്തോടെയോ അപേക്ഷാഭാവത്തോടെയോ അവരുടെ മുമ്പിൽ വീണതായി പരിഭാഷപ്പെടുത്തി.
  alternative: അവരെ ആരാധിച്ചു; അവരുടെ മുമ്പിൽ സാഷ്ടാംഗം വീണു.
  rationale: προσπίπτω എന്ന ക്രിയ ഒരാളുടെ മുമ്പിൽ വീഴുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ മതപരമായ ആരാധന നിർബന്ധമായും അർഥമാക്കുന്നില്ല. അതിനാൽ പ്രവൃത്തി വ്യക്തമാക്കുകയും അതിന്റെ ദൈവശാസ്ത്രസ്വഭാവം നിർണയിക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അയാൾ’ എന്ന രൂപം കഥയിലെ വ്യക്തിയെ വ്യക്തമായി പിന്തുടരുന്നു. വാക്യത്തിന്റെ നീളം നിയന്ത്രിക്കാനായി ഗ്രീക്കിലെ ഏകവാക്യം മലയാളത്തിൽ രണ്ടു വാക്യങ്ങളാക്കി; സംഭവക്രമം മാറ്റിയിട്ടില്ല.
