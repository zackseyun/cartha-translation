source:
  edition: SBLGNT
  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: ml
  text: എന്നാൽ, അവളുടെ യജമാനന്മാർ തങ്ങളുടെ ലാഭപ്രതീക്ഷ ഇല്ലാതായെന്നു കണ്ടപ്പോൾ[a], അവർ പൗലൊസിനെയും ശീലാസിനെയും പിടിച്ച് ചന്തസ്ഥലത്തേക്ക് ഭരണാധികാരികളുടെ മുമ്പാകെ വലിച്ചിഴച്ചുകൊണ്ടുപോയി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങളുടെ വരുമാനപ്രതീക്ഷ.’ ഗ്രീക്കുപ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘അവരുടെ സമ്പാദ്യത്തിന്റെ പ്രതീക്ഷ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘ഭരണാധികാരികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്കുപദം നഗരത്തിലെ അധികാരികളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അടുത്ത വാക്യത്തിൽ സാധാരണയായി ‘ന്യായാധിപന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്താവുന്ന കൂടുതൽ നിർദിഷ്ടമായ മറ്റൊരു പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: അവളുടെ യജമാനന്മാർ
  rationale: അടിമപ്പെൺകുട്ടിയുടെമേൽ ഉടമസ്ഥതയും നിയന്ത്രണവും പുലർത്തിയവരെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘യജമാനന്മാർ’ സാമൂഹിക ആധിപത്യവും സാമ്പത്തിക ചൂഷണവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐξῆλθεν
  choice: അസ്തമിച്ചുപോയി
  rationale: അക്ഷരാർഥത്തിലെ ‘പുറത്തുപോയി’ എന്ന ദൃശ്യരൂപം മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമാണ്. വരുമാനം ലഭിക്കുമെന്ന പ്രതീക്ഷ പൂർണമായി ഇല്ലാതായതിനെ ‘അസ്തമിച്ചുപോയി’ വ്യക്തമായും മാന്യമായും അറിയിക്കുന്നു.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: തങ്ങളുടെ വരുമാനപ്രതീക്ഷ
  rationale: ἐργασία ഇവിടെ പൊതുവായ അധ്വാനത്തെയല്ല, പെൺകുട്ടിയുടെ പ്രവചനത്തിലൂടെ ലഭിച്ചിരുന്ന സമ്പാദ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വരുമാനപ്രതീക്ഷ’ പ്രതീക്ഷയും സാമ്പത്തിക നേട്ടവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπιλαβόμενοι
  choice: പിടിച്ച്
  rationale: ബലമായി കൈവശപ്പെടുത്തുന്ന ശത്രുതാപരമായ പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἵλκυσαν
  choice: വലിച്ചിഴച്ചുകൊണ്ടുപോയി
  rationale: ബലപ്രയോഗത്തോടെ വലിച്ചുകൊണ്ടുപോയതെന്ന ἕλκωയുടെ അർഥം ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀγορὰν
  choice: ചന്തസ്ഥലം
  rationale: ἀγορά വ്യാപാരകേന്ദ്രവും പൊതുചത്വരവും ആയിരുന്നു. ‘ചന്തസ്ഥലം’ പ്രാഥമിക അർഥം നൽകുന്നു; അധികാരികളുടെ സാന്നിധ്യം അതിന്റെ പൊതുപൗരസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: ഭരണാധികാരികളുടെ മുമ്പാകെ
  rationale: ἄρχοντες പൊതുവായ പൗരാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; അടുത്ത വാക്യത്തിലെ കൂടുതൽ നിർദിഷ്ടമായ പദവിപ്പേരിനെ ഇതിലേക്കു കൊണ്ടുവരുന്നില്ല.
