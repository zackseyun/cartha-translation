translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ സാമ്പത്തിക ആശയവും ബലപ്രയോഗത്തിന്റെ തീവ്രതയും നിലനിർത്തി; ἄρχοντες എന്ന പൊതുപദത്തെ അടുത്ത വാക്യത്തിലെ നിർദിഷ്ട പദവിയുമായി കലർത്തിയിട്ടില്ല.
