id: ACT.16.37
reference: Acts 16:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് അവരോടു പറഞ്ഞു: “റോമൻ പൗരന്മാരായ ഞങ്ങളെ കുറ്റക്കാരെന്നു വിധിക്കാതെ[a] പരസ്യമായി അടിച്ച് അവർ തടവിലിട്ടു. ഇപ്പോഴോ ഞങ്ങളെ രഹസ്യമായി പുറത്താക്കുകയാണോ? ഒരിക്കലുമില്ല! അവർ തന്നെ വന്ന് ഞങ്ങളെ പുറത്തേക്കു കൂട്ടിക്കൊണ്ടുപോകട്ടെ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കുറ്റം വിധിക്കപ്പെടാത്തവരായിരിക്കെ.” സന്ദർഭത്തിൽ, “വിചാരണ കൂടാതെ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: ἀκατακρίτους എന്നത് നിയമപരമായി കുറ്റം വിധിക്കപ്പെട്ടിട്ടില്ലെന്ന അർഥമാണ് നൽകുന്നത്. ‘വിചാരണ കൂടാതെ’ എന്നത് സന്ദർഭോചിതമായ നടപടിക്രമപരമായ വിവർത്തനമാണ്; മുഖ്യപാഠം ഒരു വിചാരണ നടന്നുവെന്ന് സൂചിപ്പിക്കാതിരിക്കാൻ ഈ രൂപം ഉപയോഗിക്കുന്നു.
  - marker: b
    text: അഥവാ, “ഞങ്ങളെ പുറത്തേക്കു കൊണ്ടുപോകട്ടെ” അല്ലെങ്കിൽ “ഞങ്ങളെ അകമ്പടിയായി പുറത്തേക്കു കൊണ്ടുപോകട്ടെ.”
    reason: ἐξάγω എന്ന ക്രിയയ്ക്ക് ‘പുറത്തേക്കു നയിക്കുക/കൊണ്ടുപോകുക’ എന്നർഥമുണ്ട്. ഔദ്യോഗിക അകമ്പടിയുടെ ഭാവം സന്ദർഭസാധ്യമായ വ്യാഖ്യാനമാണ്.
lexical_decisions:
- source_word: Δείραντες
  choice: അടിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പു നടന്ന മർദനത്തെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ മലയാളത്തിൽ മുൻകാലപ്രവൃത്തിയായി നൽകി; ‘ചാട്ടവാറുകൊണ്ട് അടിച്ചു’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ അർഥം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
- source_word: δημοσίᾳ
  choice: പരസ്യമായി
  rationale: പൊതുജനസമക്ഷം നടന്ന പ്രവൃത്തിയെന്ന അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀκατακρίτους
  choice: വിചാരണചെയ്തു കുറ്റക്കാരെന്നു വിധിക്കാതെ
  rationale: വെറും വിചാരണയുടെ അഭാവം മാത്രമല്ല, നിയമപരമായ കുറ്റവിധി ഉണ്ടായിരുന്നില്ലെന്ന ഗ്രീക്കിന്റെ മുഖ്യബലം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: റോമൻ പൗരന്മാരായ ഞങ്ങളെ
  rationale: ‘റോമാക്കാർ’ എന്നതിലുപരി ഇവിടെ പ്രസക്തമായ പൗരത്വവും അതോടൊപ്പമുള്ള നിയമസംരക്ഷണവും വ്യക്തമാക്കുന്നു; ‘ഞങ്ങളെ’ എന്ന രൂപം മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമാക്കുന്നു.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: തടവിലിട്ടു
  rationale: ജയിലിലാക്കപ്പെട്ടതിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; βάλλωയുടെ കഠിനത മുൻപുള്ള അടിയുടെയും അന്യായ നടപടിയുടെയും പശ്ചാത്തലത്തിൽ നിലനിൽക്കുന്നു.
- source_word: λάθρᾳ
  choice: രഹസ്യമായി
  rationale: ഒളിച്ചും പൊതുജനമറിയാതെയും ചെയ്യുന്നതെന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു.
- source_word: ἐκβάλλουσιν
  choice: പുറത്താക്കുകയാണോ
  rationale: വർത്തമാനകാല വാചകചോദ്യവും അവരെ രഹസ്യമായി ഒഴിവാക്കാനുള്ള അധികാരികളുടെ ശ്രമത്തിലെ അവഗണനാഭാവവും നിലനിർത്തുന്നു.
- source_word: οὐ γάρ
  choice: ഒരിക്കലുമില്ല!
  rationale: പൗലോസിന്റെ ഊന്നലുള്ള തീർത്ത നിഷേധം ആധുനിക മലയാളത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐλθόντες αὐτοὶ
  choice: അവർതന്നെ വന്ന്
  rationale: അധികാരികൾ നേരിട്ടു വരണമെന്ന αὐτοὶയുടെ ഊന്നൽ ‘തന്നെ’ വഴി സംരക്ഷിക്കുന്നു.
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: ഞങ്ങളെ പുറത്തേക്കു കൂട്ടിക്കൊണ്ടുപോകട്ടെ
  rationale: ἐξάγωയുടെ ‘പുറത്തേക്കു നയിക്കുക/കൊണ്ടുപോകുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ഔദ്യോഗികമായി അകമ്പടി നൽകുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ റോമൻ പദവിയുടെ നിയമപരമായ പ്രസക്തി
  choice: ‘റോമൻ പൗരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘റോമാക്കാർ’ അല്ലെങ്കിൽ ‘റോമൻ പുരുഷന്മാർ’
  rationale: സന്ദർഭം വംശീയമോ ഭൂമിശാസ്ത്രപരമോ ആയ തിരിച്ചറിയലിനെക്കാൾ റോമൻ പൗരത്വം നൽകുന്ന നിയമസംരക്ഷണത്തെ കേന്ദ്രീകരിക്കുന്നു.
- issue: ἀκατακρίτους എന്ന പദത്തിന്റെ നിയമാർഥം
  choice: ‘വിചാരണചെയ്തു കുറ്റക്കാരെന്നു വിധിക്കാതെ’
  alternative: ‘വിചാരണ കൂടാതെ’ അല്ലെങ്കിൽ ‘കുറ്റം വിധിക്കപ്പെടാത്തവരായിരിക്കെ’
  rationale: പദം നേരിട്ട് കുറ്റവിധിയില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ നടപടിക്രമപരമായ അനീതിയും ഉൾക്കൊള്ളുന്നുവെങ്കിലും, ‘വിചാരണ കൂടാതെ’ മാത്രം എന്നു പറഞ്ഞ് അർഥം ചുരുക്കാതെ രണ്ടുവശവും പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവവും വായനാസൗകര്യവും പുലർത്തുന്ന മലയാളം. നിയമപരമായ പരാതി വ്യക്തമായി കേൾക്കുന്നതിന് വാക്യക്രമം സ്വാഭാവികമാക്കി; ഗ്രീക്കിലെ ഊന്നലും വാചകചോദ്യവും തീർത്ത നിഷേധവും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
