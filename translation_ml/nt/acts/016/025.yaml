id: ACT.16.25
reference: Acts 16:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: ml
  text: ഏകദേശം അർധരാത്രിയോടെ പൗലോസും ശീലാസും പ്രാർഥിക്കുകയും ദൈവത്തെ സ്തുതിച്ചുപാടുകയും ചെയ്യുകയായിരുന്നു; തടവുകാർ അവരെ ശ്രദ്ധയോടെ കേട്ടുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: അർധരാത്രിയോടടുത്തപ്പോൾ
  rationale: κατά + സമയസൂചക accusative ഇവിടെ കൃത്യമായ അർധരാത്രിയെന്നതിലുപരി ‘അർധരാത്രിയോടടുത്ത്/ഏകദേശം അർധരാത്രിയിൽ’ എന്ന അർഥം നൽകുന്നു. δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേകം പദം ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: പൗലോസും ശീലാസും
  rationale: വ്യക്തിനാമങ്ങളുടെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: προσευχόμενοι
  choice: പ്രാർഥിക്കുകയും
  rationale: വർത്തമാനകാല participle പ്രധാനക്രിയയോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സംയുക്തമായ മലയാള ക്രിയാരൂപം ഈ സമകാലികത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὕμνουν
  choice: സ്തുതിച്ചുപാടുകയും ചെയ്യുകയായിരുന്നു
  rationale: ὑμνέω ദൈവത്തെ സ്തുതിഗീതം പാടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്തുതിച്ചുപാടുക’ എന്നത് വെറും പാട്ടല്ല, പാടിയുള്ള സ്തുതിയാണെന്ന പ്രത്യേകതയും imperfect-ന്റെ തുടർച്ചയും നിലനിർത്തുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: ഗ്രീക്കിൽ ദൈവം ὑμνέωയുടെ നേരിട്ടുള്ള കർമമാണ്; ‘ദൈവത്തെ സ്തുതിച്ചുപാടുക’ മലയാളത്തിൽ സ്വാഭാവികവും ഉറവിടഘടനയോട് അടുത്തതുമാണ്.
- source_word: ἐπηκροῶντο
  choice: ശ്രദ്ധയോടെ കേട്ടുകൊണ്ടിരുന്നു
  rationale: ക്രിയയ്ക്ക് സാധാരണ കേൾവിയേക്കാൾ ശ്രദ്ധാപൂർവമായോ ആകാംക്ഷയോടെയോ കേൾക്കുന്നതിന്റെ സൂചനയുണ്ട്; imperfect തുടർന്നുകൊണ്ടിരുന്ന കേൾവിയെ സൂചിപ്പിക്കുന്നു.
- source_word: οἱ δέσμιοι
  choice: തടവുകാർ
  rationale: ബന്ധനത്തിലുള്ളവരെയോ തടവുകാരെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് ഈ ജയിൽസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. മൂലപാഠത്തിലെ തുടരുന്ന പ്രവർത്തികളും ἐπηκροῶντο എന്ന ക്രിയയിലെ ശ്രദ്ധാപൂർവമായ കേൾവിയുടെ സൂക്ഷ്മതയും മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
