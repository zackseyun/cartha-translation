  revised_text: ഏകദേശം അർധരാത്രിയോടെ പൗലോസും ശീലാസും പ്രാർഥിക്കുകയും ദൈവത്തെ സ്തുതിച്ചുപാടുകയും ചെയ്യുകയായിരുന്നു; തടവുകാർ അവരെ ശ്രദ്ധയോടെ കേട്ടുകൊണ്ടിരുന്നു.
