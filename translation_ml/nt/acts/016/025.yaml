  terminology: “പൗലോസ്,” “ശീലാസ്,” “പ്രാർഥിക്കുക,” “ദൈവത്തെ സ്തുതിച്ചുപാടുക,” and “തടവുകാർ” are suitable standard Malayalam choices. “ശ്രദ്ധയോടെ കേട്ടുകൊണ്ടിരുന്നു” appropriately represents the attentive nuance of ἐπηκροῶντο.
