id: ACT.16.36
reference: Acts 16:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: ml
  text: 'കാരാഗൃഹപാലകൻ ഈ വാക്കുകൾ പൗലൊസിനോടു അറിയിച്ചു: “നിങ്ങളെ വിട്ടയയ്ക്കാൻ നഗരാധികാരികൾ[b] സന്ദേശം അയച്ചിരിക്കുന്നു.[a] അതുകൊണ്ട് ഇപ്പോൾ പുറത്തുവന്ന് സമാധാനത്തോടെ പോകുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സന്ദേശം’ എന്ന പദം ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല; നഗരാധികാരികൾ വിട്ടയക്കണമെന്നുള്ള ഒരു അറിയിപ്പോ ഉത്തരവോ അയച്ചിരിക്കുന്നു എന്നതാണ് സന്ദർഭാർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘നഗരാധികാരികൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയ στρατηγοί ഫിലിപ്പിയിലെ പൗരാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; കൂടുതൽ സാങ്കേതികമായി, ‘പ്രൈറ്റർമാർ.’
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: അറിയിച്ചു
  rationale: വിവരം മറ്റൊരാളിലേക്കു കൈമാറുക എന്ന അർഥം സ്വാഭാവികവും കഥാസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ δεσμοφύλαξ
  choice: കാരാഗൃഹപാലകൻ
  rationale: തടവുകാരെ സൂക്ഷിക്കുന്ന ചുമതലയുള്ള വ്യക്തിയെ കൃത്യമായി സൂചിപ്പിക്കുന്ന, മാന്യവും സുതാര്യവുമായ പ്രയോഗം.
- source_word: τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുകയും സന്ദേശത്തിന്റെ ഉള്ളടക്കം മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἀπέσταλκαν
  choice: സന്ദേശം അയച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ അയച്ച വസ്തു വ്യക്തമാക്കിയിട്ടില്ല; സന്ദർഭം ഒരു ഔദ്യോഗിക അറിയിപ്പാണെന്ന് സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ വ്യക്തതയ്ക്കായി ‘സന്ദേശം’ ചേർത്തു. പൂർണ്ണകാലത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ‘അയച്ചിരിക്കുന്നു’ നിലനിർത്തുന്നു.
- source_word: οἱ στρατηγοὶ
  choice: നഗരാധികാരികൾ
  rationale: ഫിലിപ്പിയിലെ റോമൻ കോളനിയുടെ പൗരാധികാരികളെയാണ് സൂചിപ്പിക്കുന്നത്; സാങ്കേതികമായ പദവിനാമം ചുമത്താതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: ἵνα ἀπολυθῆτε
  choice: നിങ്ങളെ വിട്ടയയ്ക്കാൻ
  rationale: കസ്റ്റഡിയിൽനിന്നുള്ള മോചനം സൂചിപ്പിക്കുന്ന കർമണിയർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ബഹുവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: νῦν οὖν
  choice: അതുകൊണ്ട് ഇപ്പോൾ
  rationale: οὖν എന്ന നിഗമനബന്ധവും νῦν എന്ന കാലസൂചനയും രണ്ടും നിലനിർത്തുന്നു.
- source_word: ἐξελθόντες πορεύεσθε
  choice: പുറത്തുവന്ന് … പോകുവിൻ
  rationale: മുൻകാലിക ക്രിയാവിശേഷണരൂപവും തുടർന്നുള്ള ആജ്ഞയും മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν εἰρήνῃ
  choice: സമാധാനത്തോടെ
  rationale: കലഹമോ തടസ്സമോ കൂടാതെ പോകുക എന്ന സന്ദർഭാർഥവും സമാധാനം എന്ന അടിസ്ഥാനധാരണയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘പോകുവിൻ’ എന്ന ബഹുവചന ആജ്ഞ പൗലൊസിനോടൊപ്പം ശീലാസിനെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് രൂപം തെളിയിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
