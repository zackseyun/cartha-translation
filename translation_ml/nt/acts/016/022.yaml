translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ കൂട്ടായ ശത്രുത, പങ്കാളിക്രിയ സൂചിപ്പിക്കുന്ന പ്രവർത്തനക്രമം, അപൂർണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവം എന്നിവ കഴിയുന്നത്ര നിലനിർത്തി.
