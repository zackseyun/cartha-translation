revisions:
- from: ജനക്കൂട്ടവും അവർക്കെതിരെ ഒന്നിച്ചെഴുന്നേറ്റു[a]. ഭരണാധികാരികൾ അവരുടെ വസ്ത്രങ്ങൾ വലിച്ചുകീറി അഴിച്ചശേഷം അവരെ വടികൊണ്ട് അടിക്കാൻ കല്പിച്ചുകൊണ്ടിരുന്നു[b].
  to: ജനക്കൂട്ടവും അവർക്കെതിരെ ഒന്നിച്ചെഴുന്നേറ്റു[a]. നഗരഭരണാധികാരികൾ അവരുടെ വസ്ത്രങ്ങൾ വലിച്ചുകീറി മാറ്റിയശേഷം, അവരെ വടികൊണ്ട് അടിപ്പിക്കാൻ കൽപ്പിച്ചുകൊണ്ടിരുന്നു[b].
  rationale: The revision makes explicit that the magistrates removed Paul and Silas's garments, preserving the referent of the Greek pronoun and the prior sequence of the participle. It also uses idiomatic Malayalam for an order to have a judicial beating carried out, while retaining the imperfect sense of the command.
