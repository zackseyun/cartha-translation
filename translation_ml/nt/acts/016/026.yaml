  terminology: “തടവറ” is an appropriate standard rendering of δεσμωτήριον, and “ചങ്ങലകൾ” is within the contextual range of δεσμά. The footnote responsibly preserves “ബന്ധനങ്ങൾ” and “അയഞ്ഞു” as lexical alternatives. No theological terminology is introduced.
