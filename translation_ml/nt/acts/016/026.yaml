  source_fidelity: 'Greek sense is accurately represented: ἄφνω is conveyed by “പെട്ടെന്ന്”; a great earthquake occurs; the result is that the prison foundations shake; immediately all doors are opened; and the restraints of all are loosened. “ചങ്ങലകൾ അഴിഞ്ഞു” appropriately expresses ἀνέθη without adding that anyone escaped or was released.'
