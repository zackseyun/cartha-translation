id: ACT.16.26
reference: Acts 16:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄφνω δὲ σεισμὸς ἐγένετο μέγας ὥστε σαλευθῆναι τὰ θεμέλια τοῦ δεσμωτηρίου, ἠνεῴχθησαν ⸀δὲ παραχρῆμα αἱ θύραι πᾶσαι, καὶ πάντων τὰ δεσμὰ ἀνέθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: ml
  text: പെട്ടെന്ന് ഒരു വലിയ ഭൂകമ്പമുണ്ടായി. അതിന്റെ ഫലമായി തടവറയുടെ[a] അടിത്തറകൾ കുലുങ്ങി. ഉടൻതന്നെ വാതിലുകളെല്ലാം തുറക്കപ്പെട്ടു; എല്ലാവരുടെയും ചങ്ങലകൾ[b] അഴിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തടവറ’ എന്നതിനു പകരം ‘ജയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എല്ലാവരുടെയും ബന്ധനങ്ങൾ അയഞ്ഞു.’ δεσμά എന്ന ഗ്രീക്ക് പദത്തിന് ‘ബന്ധനങ്ങൾ’ എന്നോ ‘ചങ്ങലകൾ’ എന്നോ അർഥമാകാം; ἀνέθη എന്നത് ‘അയഞ്ഞു’ എന്നോ ‘അഴിഞ്ഞു’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: പെട്ടെന്ന്
  rationale: സംഭവത്തിന്റെ അപ്രതീക്ഷിതത്വവും ആഖ്യാനത്തിലെ പെട്ടെന്നുള്ള വഴിത്തിരിവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: ഒരു വലിയ ഭൂകമ്പമുണ്ടായി
  rationale: γίνομαι + നാമം എന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളവാക്യമായി അവതരിപ്പിക്കുകയും μέγας എന്നതിന്റെ അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘വലിയ’ എന്നു നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὥστε σαλευθῆναι
  choice: അതിന്റെ ഫലമായി ... കുലുങ്ങി
  rationale: ὥστε സൂചിപ്പിക്കുന്ന ഫലബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ അകർമകക്രിയയിലൂടെ നൽകുന്നു.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: തടവറയുടെ അടിത്തറകൾ
  rationale: θεμέλια കെട്ടിടത്തിന്റെ അടിസ്ഥാനഘടകങ്ങളെയും δεσμωτήριον തടവിലിടുന്ന സ്ഥലത്തെയും സൂചിപ്പിക്കുന്നു. ‘തടവറ’ മാന്യവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: παραχρῆμα
  choice: ഉടൻതന്നെ
  rationale: ഒട്ടും താമസമില്ലാതെ സംഭവിച്ചതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: വാതിലുകളെല്ലാം തുറക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിരൂപവും πᾶσαι നൽകുന്ന സമഗ്രതയും സംരക്ഷിക്കുന്നു.
- source_word: πάντων τὰ δεσμὰ
  choice: എല്ലാവരുടെയും ചങ്ങലകൾ
  rationale: πάντων എന്ന ബന്ധസൂചക ബഹുവചനത്തെ ‘എല്ലാവരുടെയും’ എന്നും തടവിന്റെ പശ്ചാത്തലത്തിലുള്ള δεσμάയെ ദൃശ്യവും സ്വാഭാവികവുമായ ‘ചങ്ങലകൾ’ എന്നും നൽകുന്നു.
- source_word: ἀνέθη
  choice: അഴിഞ്ഞു
  rationale: ἀνίημι ഇവിടെ ബന്ധനങ്ങൾ അയയുകയോ അഴിയുകയോ ചെയ്ത ഫലത്തെ സൂചിപ്പിക്കുന്നു. പ്രവർത്തകൻ ആരെന്നു ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ഫലം അറിയിക്കുന്നു.
