id: ACT.16.12
reference: Acts 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: ml
  text: അവിടെനിന്ന് ഞങ്ങൾ ഫിലിപ്പിയിലേക്കു പോയി. അത് മക്കെദോന്യയിലെ ഒരു പ്രദേശത്തിന്റെ പ്രമുഖ നഗരവും[a] റോമൻ കോളനിയും[b] ആയിരുന്നു. ഞങ്ങൾ ആ നഗരത്തിൽ ഏതാനും ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മക്കെദോന്യയിലെ ആ പ്രദേശത്തിന്റെ ആദ്യ നഗരം.” ഗ്രീക്ക് പ്രയോഗം ദുഷ്കരമാണ്; “ആദ്യ” എന്നത് പദവിയെയോ പ്രാധാന്യത്തെയോ യാത്രാക്രമത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: റോമൻ ഭരണത്തിൻ കീഴിൽ പ്രത്യേക പദവി ലഭിച്ചിരുന്ന നഗരമായിരുന്നു റോമൻ കോളനി.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: അവിടെനിന്ന് ഞങ്ങൾ ഫിലിപ്പിയിലേക്കു പോയി
  rationale: ഗ്രീക്കിൽ സഞ്ചാരക്രിയ ഈ ഖണ്ഡത്തിൽ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തിലെ ക്രിയയിൽനിന്ന് അത് സ്വാഭാവികമായി മനസ്സിലാകുന്നു. മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ‘പോയി’ ചേർത്തു; κἀκεῖθεν എന്നതിന്റെ ബന്ധകവും സ്ഥലസൂചനയും ‘അവിടെനിന്ന്’ നിലനിർത്തുന്നു.
- source_word: ἥτις
  choice: അത്
  rationale: ഫിലിപ്പിയെക്കുറിച്ചുള്ള വിശദീകരണം സ്വാഭാവികമായ മലയാളവാക്യമായി അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വിശദീകരണാത്മകമായ ബന്ധസർവനാമത്തിന്റെ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: മക്കെദോന്യയിലെ ആ പ്രദേശത്തെ ഒരു പ്രമുഖ നഗരം
  rationale: πρώτη എന്നത് ക്രമം, പദവി, പ്രാധാന്യം എന്നിവയിൽ ഏതിനെയാണ് സൂചിപ്പിക്കുന്നതെന്നു വ്യക്തമല്ല. ‘പ്രമുഖ’ എന്നത് വിവാദമായ ഭരണപദവി ഉറപ്പിച്ചുപറയാതെ പ്രാധാന്യത്തിന്റെ സാധ്യത പ്രകടിപ്പിക്കുന്നു; μερίς ‘പ്രദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: κολωνία
  choice: റോമൻ കോളനി
  rationale: റോമൻ ഭരണത്തിൻ കീഴിലെ ഔദ്യോഗിക കോളനി പദവിയാണ് ഉദ്ദേശിക്കുന്നത്. ‘റോമൻ’ എന്നു വ്യക്തമാക്കുന്നത് ആ ചരിത്രസൂചന ആധുനിക വായനക്കാരന് ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- source_word: ἦμεν ... διατρίβοντες
  choice: ഞങ്ങൾ ... താമസിച്ചു
  rationale: തുടർച്ചയായി അവിടെ കഴിഞ്ഞതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പര്യസ്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ ‘താമസിച്ചു’ എന്നു നൽകി.
- source_word: ἡμέρας τινάς
  choice: ഏതാനും ദിവസം
  rationale: നിശ്ചിതമല്ലാത്ത ഹ്രസ്വകാലയളവ് സൂചിപ്പിക്കുന്നു; ‘ഏതാനും’ അനാവശ്യ കൃത്യത ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഫിലിപ്പിയെ വിശേഷിപ്പിക്കുന്ന πρώτη എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ഒരു പ്രമുഖ നഗരം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ആ പ്രദേശത്തെ ആദ്യ നഗരം’
  rationale: ഇത് ഉപദേശപരമായതിലുപരി ചരിത്ര-വാക്യഘടനാപരമായ അനിശ്ചിതത്വമാണ്. ഫിലിപ്പിക്ക് തർക്കരഹിതമായ ഭരണപ്രഥമത്വമുണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കാതെ, πρώτη ഉൾക്കൊള്ളാവുന്ന പ്രാധാന്യബോധം മുഖ്യപാഠത്തിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. ‘മക്കെദോന്യ’, ‘ഫിലിപ്പി’ എന്നീ രൂപങ്ങൾ മൂലഭാഷയോടടുത്ത മലയാള ലിപ്യന്തരണങ്ങളാണ്. മുഖ്യപാഠത്തിലെ [a] അടിക്കുറിപ്പ് πρώτη എന്നതിലെ യഥാർഥ അനിശ്ചിതത്വവും ‘റോമൻ കോളനി’യുടെ സാംസ്കാരിക പശ്ചാത്തലവും ഒരുമിച്ച് വിശദീകരിക്കുന്നു.
