id: ACT.16.28
reference: Acts 16:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: ml
  text: 'എന്നാൽ പൗലോസ് ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “നിനക്കുതന്നെ ഒരു ദോഷവും വരുത്തരുത്; കാരണം, ഞങ്ങളെല്ലാവരും ഇവിടെ ഉണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν ... φωνῇ μεγάλῃ
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: അടിയന്തരസാഹചര്യത്തിലെ ശക്തമായ ശബ്ദപ്രകടനവും φωνῇ μεγάλῃ എന്ന രീതിസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കാരാഗൃഹാധികാരിയുടെ ഉദ്ദേശിച്ച പ്രവൃത്തിയെ പൗലോസിന്റെ ഇടപെടൽ തടയുന്ന മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: നിന്നെത്തന്നെ ഒരു ദോഷവും ചെയ്യരുത്
  rationale: പ്രതിഫലനാർഥവും κακόν എന്ന വിശാലമായ പ്രയോഗവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് സ്വയം പരിക്കേൽപ്പിക്കാനുള്ള ഉദ്ദേശത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἅπαντες
  choice: ഞങ്ങളെല്ലാവരും
  rationale: സംസാരിക്കുന്ന പൗലോസും മറ്റു തടവുകാരും ഉൾപ്പെടുന്ന മുഴുവൻ കൂട്ടത്തെയും മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: γάρ
  choice: ;
  rationale: തുടർന്നുള്ള വാക്കുകൾ വിലക്കിന്റെ കാരണം നൽകുന്നു. മലയാളത്തിൽ അർദ്ധവിരാമത്തിലൂടെയുള്ള ചേർപ്പ് ഈ വിശദീകരണബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; പ്രത്യേക ബന്ധപദം ചേർക്കേണ്ടതില്ല.
- source_word: ἐνθάδε
  choice: ഇവിടെ
  rationale: സ്ഥലസൂചനയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
- source_word: ὁ Παῦλος
  choice: പൗലോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള സംഭാഷണശൈലി. ഗ്രീക്കിലെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന പങ്കുപദഘടന മലയാളത്തിൽ അനാവശ്യമായി ആവർത്തിക്കാതെ ഉദ്ധരണി നേരിട്ട് ചേർത്തു. സന്ദർഭം സ്വയം പരിക്കേൽപ്പിക്കലാണെങ്കിലും മൂലത്തിലെ വിശാലമായ ‘ഒരു ദോഷവും’ എന്ന അർഥം ചുരുക്കിയിട്ടില്ല.
