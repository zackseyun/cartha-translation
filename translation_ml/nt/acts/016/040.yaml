source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: ml
  text: അവർ കാരാഗൃഹത്തിൽ നിന്ന് പുറത്തുവന്നശേഷം ലുദിയയുടെ അടുക്കൽ ചെന്നു. സഹോദരന്മാരെ[a] കണ്ടശേഷം അവരെ പ്രോത്സാഹിപ്പിച്ച് അവർ പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരന്മാരും സഹോദരിമാരും.” ഗ്രീക്കുപദം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും, സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട സഹവിശ്വാസികളുടെ ഒരു കൂട്ടത്തെ അതിന് സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες ἀπὸ τῆς φυλακῆς
  choice: കാരാഗൃഹത്തിൽനിന്ന് പുറത്തുവന്നശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന സമയക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നിർദിഷ്ടമായ തടവിടത്തെ ‘കാരാഗൃഹം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: ലുദിയയുടെ അടുക്കൽ ചെന്നു
  rationale: ഒരു വ്യക്തിയെ സന്ദർശിക്കാൻ അവിടേക്കു ചെല്ലുക എന്ന പ്രയോഗാർത്ഥം നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘വീട്’ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἰδόντες
  choice: കണ്ടപ്പോൾ
  rationale: തുടർന്നുള്ള പ്രധാനക്രിയയുമായി ബന്ധപ്പെടുന്ന കാലസൂചക participle സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: παρεκάλεσαν
  choice: പ്രോത്സാഹിപ്പിച്ചു
  rationale: παρακαλέω എന്ന പദത്തിന്റെ പ്രോത്സാഹനം, ധൈര്യപ്പെടുത്തൽ, ആശ്വസിപ്പിക്കൽ തുടങ്ങിയ വിശാലമായ അർത്ഥപരിധി അനാവശ്യമായി ചുരുക്കാതെ സന്ദർഭത്തിന് യോജിച്ച പൊതുവായ അർത്ഥം നൽകുന്നു.
- source_word: τοὺς ἀδελφούς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; വിശ്വാസികളായ സ്ത്രീകളും ഉൾപ്പെടാവുന്ന സമാവേശക പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξῆλθαν
  choice: അവിടെനിന്ന് യാത്രയായി
  rationale: അവർ ആ കൂടിക്കാഴ്ചയ്ക്കുശേഷം സ്ഥലം വിട്ടുപോയെന്ന ആഖ്യാനാർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും മുമ്പത്തെ ‘പുറത്തുവന്നു’ എന്നതിന്റെ അസ്വാഭാവിക ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: സമ്മിശ്ര ലിംഗവിഭാഗത്തിലുള്ള ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കാവുന്ന ἀδελφοί എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; വിശ്വാസികൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുമ്പോഴും അതിന് സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട സഹവിശ്വാസികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കാനാകുമെന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ലുദിയയുടെ അടുക്കൽ’ എന്ന പ്രയോഗം മൂലപാഠത്തോട് അടുത്തുനിൽക്കുകയും അവളുടെ വീട് എന്ന സന്ദർഭസൂചന അനാവശ്യമായി മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
