id: ACT.16.14
reference: Acts 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: ml
  text: ത്യത്തൈര പട്ടണത്തിൽനിന്നുള്ള, ധൂമ്രനിറമുള്ള തുണി വിൽക്കുന്ന ലുദിയ എന്നു പേരുള്ള ഒരു സ്ത്രീ, ദൈവത്തെ ആരാധിക്കുന്നവളായി, കേട്ടുകൊണ്ടിരുന്നു.[a] പൗലോസ് പറഞ്ഞുകൊണ്ടിരുന്ന കാര്യങ്ങൾ ശ്രദ്ധിക്കാൻ കർത്താവ് അവളുടെ ഹൃദയം തുറന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവാരാധകയായിരുന്നു.” ഈ പ്രയോഗം ഇസ്രായേലിന്റെ ദൈവത്തെ ആദരിച്ചിരുന്ന ഒരു വിജാതീയ അനുയായിയെ സൂചിപ്പിക്കാം.
    reason: σεβομένη τὸν θεόν എന്ന പ്രയോഗത്തിന്റെ പദപരമായ മറ്റൊരു പരിഭാഷയും സാധ്യതയുള്ള സാമൂഹിക-മതപരമായ അർഥവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: καί τις γυνὴ
  choice: ഒരു സ്ത്രീ
  rationale: τις നൽകുന്ന അനിശ്ചിതത്വം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഒരു സ്ത്രീ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘ഒരു പ്രത്യേക സ്ത്രീ’ എന്നു പറയുന്നത് അനാവശ്യമായി ഊന്നിപ്പറയും.
- source_word: ὀνόματι Λυδία
  choice: ലുദിയ എന്നു പേരുള്ള
  rationale: വ്യക്തിനാമത്തോടുകൂടിയ ὀνόματι എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികമായ മലയാള പരിഭാഷ.
- source_word: πορφυρόπωλις
  choice: ഊതനിറത്തിലുള്ള തുണി വിൽക്കുന്ന
  rationale: പർപ്പിൾ ചായം പൂശിയ തുണിയോ സമാന വസ്തുക്കളോ വിൽക്കുന്നവളെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സാധ്യതയേറിയ വ്യാപാരവസ്തു വ്യക്തമാക്കുന്നു; ആഡംബരവസ്ത്രമെന്ന് അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: πόλεως Θυατείρων
  choice: ത്യത്തൈര പട്ടണത്തിൽനിന്നുള്ള
  rationale: ലുദിയയുടെ സ്വദേശബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σεβομένη τὸν θεόν
  choice: അവൾ ദൈവത്തെ ആരാധിക്കുന്നവളായിരുന്നു
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെ ആദരിച്ച് ആരാധിച്ചിരുന്ന വിജാതീയ അനുയായിയെന്ന ആശയം വ്യക്തമാക്കുന്നു; ‘ദൈവഭക്ത’ എന്ന സാങ്കേതികമാകാവുന്ന വിശേഷണം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: ἤκουεν
  choice: കേട്ടുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് ക്രിയയുടെ തുടർച്ചയായ പ്രവൃത്തിഭാവം നിലനിർത്തുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ ബൈബിൾ-മലയാള പരിഭാഷ; വാചകം വ്യക്തമാക്കാത്തിടത്ത് ‘യേശു’ എന്നോ ‘ദൈവം’ എന്നോ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: അവളുടെ ഹൃദയം തുറന്നു
  rationale: ഉള്ളിലെ സ്വീകരണക്ഷമത സാധ്യമാക്കിയെന്ന ഗ്രീക്ക് ശൈലിയുടെ അർഥവും രൂപകവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προσέχειν
  choice: ശ്രദ്ധിക്കാൻ
  rationale: ശ്രദ്ധ കേന്ദ്രീകരിക്കുക എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു; ‘പ്രതികരിക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി ഫലത്തെ മുൻകൂട്ടി നിർണ്ണയിക്കുന്നില്ല.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: പൗലോസ് പറഞ്ഞുകൊണ്ടിരുന്ന കാര്യങ്ങൾ
  rationale: പാസീവ് പാർട്ടിസിപ്പിളിനെ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃപ്രയോഗമാക്കി മാറ്റുമ്പോഴും തുടരുന്ന സംസാരത്തിന്റെ ഭാവവും പൗലോസിന്റെ കർത്തൃത്വവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ κύριος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: കർത്താവ്
  alternative: കർത്താവായ യേശു; ദൈവം
  rationale: ഗ്രീക്ക് പാഠം ὁ κύριος എന്നു മാത്രമേ പറയുന്നുള്ളൂ. പ്രവൃത്തികളിൽ ഈ പദത്തിന് ക്രിസ്തുവിനെ സൂചിപ്പിക്കാനാകുമെങ്കിലും ഇവിടെ ദൈവിക പ്രവർത്തനമാണ് ഊന്നൽ; അതിനാൽ പരിഭാഷ മൂലപാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: σεβομένη τὸν θεόν ഒരു ഔപചാരിക വിഭാഗപ്പേരാണോ
  choice: ദൈവത്തെ ആരാധിക്കുന്നവൾ
  alternative: ദൈവഭക്ത; ദൈവഭയമുള്ളവൾ
  rationale: ഇത് ഇസ്രായേലിന്റെ ദൈവത്തോട് ചേർന്നുനിന്ന ഒരു വിജാതീയയെ സൂചിപ്പിക്കാമെങ്കിലും, ഒരു നിർദ്ദിഷ്ട ഔപചാരിക പദവിയായിരുന്നു എന്ന് മുഖ്യവാചകം തീർപ്പാക്കുന്നില്ല; സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാള വാക്യങ്ങളാക്കി. പരമ്പരാഗതമായി പരിചിതമായ ‘കർത്താവ്’, ‘പൗലോസ്’, ‘ലുദിയ’ എന്നീ രൂപങ്ങൾ നിലനിർത്തി; അപരിചിതമായ ‘രക്താംബരം/ധൂമ്രവസ്ത്രം’ എന്നിവയ്ക്കുപകരം വ്യക്തമായ ‘ഊതനിറത്തിലുള്ള തുണി’ തിരഞ്ഞെടുത്തു.
