    rationale: This can mean simply ‘devout woman’ and does not directly express the lexical alternative ‘worshiper of God.’ ‘ദൈവാരാധകയായിരുന്നു’ is closer while the explanatory sentence can preserve the possible Gentile-adherent sense.
