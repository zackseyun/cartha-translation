id: ACT.16.9
reference: Acts 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: ml
  text: 'രാത്രിയിൽ[a] പൗലോസിന് ഒരു ദർശനം പ്രത്യക്ഷപ്പെട്ടു: ഒരു മക്കെദോന്യക്കാരൻ[b] നിന്നുകൊണ്ട് അവനോട് ഇങ്ങനെ അപേക്ഷിക്കുകയായിരുന്നു: “മക്കെദോന്യയിലേക്കു കടന്നുവന്ന്[c] ഞങ്ങളെ സഹായിക്കണമേ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “രാത്രിക്കിടെ” അല്ലെങ്കിൽ “രാത്രിസമയത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മക്കെദോന്യക്കാരനായ ഒരു മനുഷ്യൻ.”
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മക്കെദോന്യയിലേക്കു കടന്ന്, ഞങ്ങളെ സഹായിക്കണമേ”; ആജ്ഞയോടുചേർന്ന കൃദന്തത്തിന്റെ സ്വാഭാവിക അർഥമാണ് “കടന്നുവന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: ദർശനം
  rationale: ദൈവിക വെളിപ്പെടുത്തലിന്റെ സ്വഭാവമുള്ള കാഴ്ചയെയോ അനുഭവത്തെയോ സൂചിപ്പിക്കുന്ന അപ്പൊസ്തലപ്രവൃത്തികളിലെ സാധാരണ പദപ്രയോഗത്തിന് യോജിച്ച, സ്വാഭാവികമായ മലയാളപദം.
- source_word: διὰ νυκτός
  choice: രാത്രിയിൽ
  rationale: ദർശനം ഉണ്ടായ സമയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘രാത്രിക്കിടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: τῷ Παύλῳ ὤφθη
  choice: പൗലോസിന് ... ഉണ്ടായി
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ദത്തിവും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ദർശനത്തിന്റെ കൃത്യമായ അനുഭവസ്വഭാവത്തെക്കുറിച്ച് അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἀνὴρ Μακεδών τις
  choice: ഒരു മക്കെദോന്യക്കാരൻ
  rationale: ἀνήρ സൂചിപ്പിക്കുന്ന പുരുഷനെയും τις നൽകുന്ന അനിശ്ചിതത്വത്തെയും ‘ഒരു’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἑστώς
  choice: നിന്നുകൊണ്ട്
  rationale: ദർശനത്തിൽ ആ മനുഷ്യൻ നിൽക്കുന്ന നിലയെ ദൃശ്യമായി നിലനിർത്തുന്നു.
- source_word: παρακαλῶν
  choice: അപേക്ഷിക്കുകയായിരുന്നു
  rationale: സഹായത്തിനായുള്ള ഗൗരവമുള്ള അഭ്യർഥനയെ വ്യക്തമാക്കുന്നു; ‘യാചിക്കുകയായിരുന്നു’ എന്നതിലുണ്ടാകാവുന്ന അതിതീവ്രമായ ഭാവം ഒഴിവാക്കുന്നു.
- source_word: λέγων
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള വാക്കുകളെ സ്വാഭാവിക മലയാളത്തിൽ പരിചയപ്പെടുത്തുന്നു.
- source_word: Διαβάς
  choice: കടന്നുവന്ന്
  rationale: ആജ്ഞയോടൊപ്പമുള്ള ഗ്രീക്ക് ഭൂതകാല കൃദന്തത്തിന്റെ ക്രമബോധവും മറുകരയിലേക്കുള്ള ചലനവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς Μακεδονίαν
  choice: മക്കെദോന്യയിലേക്ക്
  rationale: മക്കെദോന്യയുടെ ഉള്ളിലേക്കുള്ള ദിശയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: βοήθησον ἡμῖν
  choice: ഞങ്ങളെ സഹായിക്കണമേ
  rationale: നേരിട്ടുള്ള സഹായാഭ്യർഥനയെ മാന്യവും അടിയന്തരതയുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὅραμα, ὤφθη എന്നിവ വിവരിക്കുന്ന അനുഭവത്തിന്റെ സ്വഭാവം
  choice: പൗലോസിന് ഒരു ദർശനമുണ്ടായി എന്നു മാത്രം പറയുന്നു.
  alternative: സ്വപ്നം, ആന്തരിക തോന്നൽ, അല്ലെങ്കിൽ വസ്തുനിഷ്ഠമായ പ്രത്യക്ഷീകരണം എന്നു നിർവചിക്കുക.
  rationale: മൂലപാഠം ഇതിനെ ദർശനമായി വിശേഷിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ അനുഭവരീതി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ പരിഭാഷയും ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘മക്കെദോന്യ’ എന്ന പരിചിതമായ ബൈബിൾ ഭൂപേര് നിലനിർത്തി. ‘സഹായിക്കണമേ’ അഭ്യർഥനയുടെ ആദരവും അടിയന്തരതയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
