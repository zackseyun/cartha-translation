id: ACT.16.1
reference: Acts 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: ml
  text: അവൻ ദെർബെയിലും ലുസ്ത്രയിലും എത്തി. ഇതാ, തിമൊഥെയൊസ് എന്നു പേരുള്ള ഒരു ശിഷ്യൻ അവിടെ ഉണ്ടായിരുന്നു. വിശ്വാസിയായ[a] ഒരു യെഹൂദസ്ത്രീയുടെ മകനായിരുന്നു അവൻ; എന്നാൽ അവന്റെ പിതാവ് ഗ്രീക്കുകാരനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസിയായ’ എന്നതിന് ‘വിശ്വസ്തയായ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദത്തിന് രണ്ടു അർഥങ്ങളും വരാമെങ്കിലും, അപ്പൊസ്തലപ്രവൃത്തികളിലെ ഈ സന്ദർഭത്തിൽ ‘വിശ്വാസിയായ’ എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν δὲ καὶ
  choice: അവൻ ... എത്തി
  rationale: καταντάω സ്ഥലത്തെത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. δὲ καὶ മുൻവിവരണത്തിന്റെ തുടർച്ചയും ചേർക്കലും അടയാളപ്പെടുത്തുന്നുവെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനപ്രവാഹത്തിൽ പ്രത്യേകമായി ‘കൂടെയും’ ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് അതു വ്യക്തമാകുന്നു.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: ദെർബെയിലും ലുസ്ത്രയിലും
  rationale: ആവർത്തിക്കുന്ന εἰς യാത്രയുടെ ലക്ഷ്യസ്ഥാനങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-യിലും ... -യിലും എത്തി’ എന്നത് രണ്ടു സ്ഥലങ്ങളിലേക്കുള്ള യാത്രയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καὶ ἰδοὺ
  choice: ഇതാ
  rationale: ἰδού തുടർന്നുവരുന്ന പുതിയ വ്യക്തിയിലേക്ക് വായനക്കാരന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന അടയാളപ്പെടുത്തിയ ആഖ്യാനപ്രയോഗമാണ്; ‘ഇതാ’ അതിന്റെ സജീവത നിലനിർത്തുന്നു.
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: ഒരു ശിഷ്യൻ അവിടെ ഉണ്ടായിരുന്നു
  rationale: τις പുതുതായി പരിചയപ്പെടുത്തുന്ന നിർദിഷ്ടമെങ്കിലും ഇതുവരെ പരാമർശിക്കാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരു ശിഷ്യൻ’ സ്വാഭാവികമാണ്; ἐκεῖ ‘അവിടെ’ എന്നു വ്യക്തമായി നിലനിർത്തി.
- source_word: ὀνόματι Τιμόθεος
  choice: തിമൊഥെയൊസ് എന്നു പേരുള്ള
  rationale: ὀνόματι എന്ന ദത്തിവ് ഘടനയ്ക്ക് ആധുനിക മലയാളത്തിലെ സ്വാഭാവിക തത്തുല്യം ‘എന്നു പേരുള്ള’ എന്നതാണ്.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: വിശ്വാസിയായ ഒരു യെഹൂദസ്ത്രീയുടെ മകനായിരുന്നു അവൻ
  rationale: ഇവിടെ πιστή ലൂക്കോസിന്റെ പ്രയോഗത്തിൽ ക്രിസ്തുവിൽ വിശ്വസിക്കുന്നവളെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. ഘനമായ ഗ്രീക്ക് നാമപദശൃംഖല മലയാളത്തിൽ പൂർണ്ണവാക്യമായി മാറ്റിയത് വ്യക്തതയ്ക്കായാണ്.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: എന്നാൽ അവന്റെ പിതാവ് ഗ്രീക്കുകാരനായിരുന്നു
  rationale: ഗ്രീക്കിൽ ‘മകൻ’ എന്ന ആശയം ആശ്രയിക്കുന്ന സംക്ഷിപ്ത ജനിറ്റീവ് ഘടനയാണ്. മലയാളത്തിൽ പൂർണ്ണവാക്യം കൂടുതൽ സ്വാഭാവികം; δέയിലെ വൈരുധ്യം ‘എന്നാൽ’ നിലനിർത്തുന്നു. Ἕλλην എന്നത് വിശാലമായ ‘ജാതിക്കാരൻ’ എന്നതിനെക്കാൾ നേരിട്ട് ‘ഗ്രീക്കുകാരൻ’ എന്നാണ്.
theological_decisions:
- issue: തിമൊഥെയൊസിന്റെ അമ്മയെ വിശേഷിപ്പിക്കുന്ന πιστῆς എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസിയായ
  alternative: വിശ്വസ്തയായ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ സന്ദർഭവും ലൂക്കോസിന്റെ സാധാരണ പ്രയോഗവും കണക്കിലെടുക്കുമ്പോൾ πιστός ഇവിടെ പൊതുവായ സ്വഭാവവിശ്വസ്തതയെക്കാൾ ക്രിസ്തീയ വിശ്വാസിയെന്ന നിലയെയാണ് സൂചിപ്പിക്കാൻ കൂടുതൽ സാധ്യത. എങ്കിലും ‘വിശ്വസ്തയായ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇതാ’ എന്ന ശ്രദ്ധാകർഷക പ്രയോഗം മൂലപാഠത്തിന്റെ ആഖ്യാനസജീവത നിലനിർത്തുന്നു. വ്യക്തിനാമങ്ങൾ സാധാരണ മലയാള ബൈബിൾ ശൈലിയോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകിയിരിക്കുന്നു.
