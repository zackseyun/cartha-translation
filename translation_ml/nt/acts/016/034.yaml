id: ACT.16.34
reference: Acts 16:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: ml
  text: അവരെ മുകളിലുള്ള തന്റെ വീട്ടിലേക്ക് കൂട്ടിക്കൊണ്ടുപോയശേഷം, അവൻ അവരുടെ മുമ്പിൽ ഭക്ഷണം വിളമ്പി[a]. ദൈവത്തിൽ വിശ്വസിച്ചവനായി, അവൻ തന്റെ വീട്ടിലുള്ള എല്ലാവരോടുമൊപ്പം വളരെയധികം ആനന്ദിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അവരുടെ മുമ്പിൽ ഒരു മേശ വെച്ചു’; ഈ ഗ്രീക്ക് പ്രയോഗം അവർക്കു ഭക്ഷണം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഈ ആനന്ദത്തിൽ വീട്ടിലുള്ള എല്ലാവരും പങ്കുചേർന്നു എന്നതിന് ഗ്രീക്ക് ഊന്നൽ നൽകുന്നതായും മനസ്സിലാക്കാം; വീട്ടുകാരും വിശ്വസിച്ചു എന്ന ആശയം ഈ വാക്യഭാഗത്തിൽ ഉൾക്കൊള്ളുന്നതായി ചിലർ ഗ്രഹിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: വീട്ടിലേക്കു കയറ്റിക്കൊണ്ടുപോയശേഷം
  rationale: സ്ഥലപരമായി മുകളിലേക്കുള്ള നീക്കവും മുഖ്യക്രിയകൾക്കു മുമ്പുള്ള സംഭവക്രമവും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οἶκον
  choice: വീട്
  rationale: സന്ദർഭത്തിൽ ഇത് കാരാഗൃഹാധികാരിയുടെ വീടിനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ നിർദ്ദിഷ്ടപ്രയോഗം അനാവശ്യമായി ഉടമസ്ഥസർവനാമം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: παρέθηκεν τράπεζαν
  choice: അവരുടെ മുമ്പിൽ ഭക്ഷണം ഒരുക്കിവെച്ചു
  rationale: അക്ഷരാർഥത്തിൽ ‘മേശ ഒരുക്കിവെച്ചു’ എന്നാണെങ്കിലും, ഈ പ്രയോഗം ഭക്ഷണം നൽകി ആതിഥ്യമരുളുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἠγαλλιάσατο
  choice: അത്യന്തം ആനന്ദിച്ചു
  rationale: സാധാരണ സന്തോഷത്തെക്കാൾ തീവ്രവും ആഹ്ലാദപൂർണവുമായ സന്തോഷം സൂചിപ്പിക്കുന്നു.
- source_word: πανοικεὶ
  choice: തന്റെ വീട്ടിലുള്ള എല്ലാവരോടുമൊപ്പം
  rationale: മുഴുവൻ കുടുംബവും വീട്ടിലുള്ളവരും ഉൾപ്പെടുന്ന കൂട്ടായ വ്യാപ്തി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: ദൈവത്തിൽ വിശ്വസിച്ചവനായി
  rationale: ഏകവചനത്തിലുള്ള perfect participle-ന്റെ പൂർത്തിയായതും തുടരുന്ന ഫലമുള്ളതുമായ സ്വഭാവം സംരക്ഷിക്കുകയും, ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കാരണബന്ധം നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വീട്ടിലുള്ള എല്ലാവരുമായി ബന്ധപ്പെട്ട ആനന്ദത്തിന്റെയും വിശ്വാസത്തിന്റെയും വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ കാരാഗൃഹാധികാരിയാണ് ദൈവത്തിൽ വിശ്വസിച്ചവൻ; അവൻ വീട്ടിലുള്ള എല്ലാവരോടുമൊപ്പം ആനന്ദിച്ചു.
  alternative: വീട്ടിലുള്ള എല്ലാവരും വിശ്വസിക്കുകയും എല്ലാവരും ഒരുമിച്ച് ആനന്ദിക്കുകയും ചെയ്തു; അല്ലെങ്കിൽ, തന്റെ വീട്ടിലുള്ള എല്ലാവരും വിശ്വസിച്ചതിൽ അവൻ ആനന്ദിച്ചു.
  rationale: πεπιστευκώς ഏകവചനമായതിനാൽ അതിന്റെ ഏറ്റവും നേരിട്ടുള്ള കർത്താവ് കാരാഗൃഹാധികാരിയാണ്. എന്നാൽ πανοικεὶ എന്ന പദത്തിന്റെ ബന്ധം വീട്ടുകാരുടെ വിശ്വാസപങ്കാളിത്തവും സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവത്തിൽ വിശ്വസിച്ചവനായി’ അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്ക് participle-ന്റെ ഏകവചനവും കാരണബന്ധത്തെക്കുറിച്ചുള്ള യഥാർഥ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
