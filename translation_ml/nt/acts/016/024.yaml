id: ACT.16.24
reference: Acts 16:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: ml
  text: അത്തരമൊരു കല്പന ലഭിച്ച അയാൾ അവരെ അകത്തെ തടവറയിൽ[a] തള്ളിയിട്ട് അവരുടെ കാലുകൾ മരവിലങ്ങിൽ[b] ഉറപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഏറ്റവും അകത്തുള്ള തടവറയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മരത്തിലേക്ക്.’ ഇവിടെ കാലുകൾ അനങ്ങാതിരിക്കാൻ ഉപയോഗിച്ചിരുന്ന മരത്തിൽ നിർമിച്ച ബന്ധനോപകരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: അത്തരമൊരു കല്പന
  rationale: അധികാരസ്ഥാനത്തുനിന്നുള്ള നിർദേശം അഥവാ ആജ്ഞ എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ ‘കല്പന’ വ്യക്തമാക്കുന്നു.
- source_word: λαβὼν
  choice: ലഭിച്ച
  rationale: പ്രധാന ക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയെന്ന ഗ്രീക്ക് ഭൂതകാല കൃദന്തരൂപത്തിന്റെ ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἔβαλεν
  choice: തള്ളിയിട്ട്
  rationale: βάλλω എന്ന പദത്തിന്റെ ബലപ്രയോഗസൂചനയും തടവുകാരോടുള്ള പരുഷമായ പെരുമാറ്റവും ‘വെച്ചു’ എന്നതിനെക്കാൾ നന്നായി നിലനിർത്തുന്നു.
- source_word: ἐσωτέραν φυλακήν
  choice: അകത്തെ തടവറയിൽ
  rationale: തടവറയുടെ കൂടുതൽ സുരക്ഷിതമായ ഉൾഭാഗത്തെയാണ് താരതമ്യരൂപമായ ἐσωτέραν സൂചിപ്പിക്കുന്നത്; ‘അകത്തെ തടവറ’ സ്വാഭാവികമായ മലയാളമാണ്, ‘ഏറ്റവും അകത്തുള്ള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἠσφαλίσατο
  choice: ഉറപ്പിച്ചു
  rationale: സുരക്ഷിതമായി ബന്ധിക്കുക അഥവാ അനങ്ങാത്തവിധം ഉറപ്പിക്കുക എന്ന അർഥം സന്ദർഭത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: τοὺς πόδας αὐτῶν
  choice: അവരുടെ കാലുകൾ
  rationale: πούς എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കാൽ’ മലയാളത്തിൽ ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: εἰς τὸ ξύλον
  choice: മരവിലങ്ങിൽ
  rationale: ξύλον അക്ഷരാർഥത്തിൽ ‘മരം/മരവസ്തു’ ആണെങ്കിലും ഈ തടവറാസന്ദർഭത്തിൽ കാലുകൾ അനങ്ങാതിരിക്കാൻ ഉപയോഗിച്ചിരുന്ന മരത്തിൽ നിർമിച്ച ബന്ധനോപകരണമാണ്; ‘മരവിലങ്ങ്’ അർഥം വ്യക്തമായി നൽകുന്നു.
