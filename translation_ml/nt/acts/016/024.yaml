translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ഗ്രീക്കിലെ ബലപ്രയോഗസൂചന ‘തള്ളിയിട്ട്’ എന്നതിലൂടെ നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന വാക്കുകളോട് പൊരുത്തപ്പെട്ടിരുന്നില്ല; ഉറവിടവും അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും അനുസരിച്ച് [a] ‘അകത്തെ തടവറയിൽ’ എന്നതിനോടും [b] ‘മരവിലങ്ങിൽ’ എന്നതിനോടും ചേർത്തിരിക്കുന്നു.
