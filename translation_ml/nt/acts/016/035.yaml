id: ACT.16.35
reference: Acts 16:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡμέρας δὲ γενομένης ἀπέστειλαν οἱ στρατηγοὶ τοὺς ῥαβδούχους λέγοντες· Ἀπόλυσον τοὺς ἀνθρώπους ἐκείνους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ നഗരാധികാരികൾ ദണ്ഡവാഹകരെ[a] അയച്ച്, “ആ മനുഷ്യരെ വിട്ടയയ്ക്കുക” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ലിക്ടർമാർ’; അധികാരത്തിന്റെ ചിഹ്നമായി ദണ്ഡങ്ങൾ വഹിച്ചിരുന്ന റോമൻ ഭരണാധികാരികളുടെ ഔദ്യോഗിക പരിചാരകർ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: ഈ genitive absolute കാലപരമായ കഥാമാറ്റം സൂചിപ്പിക്കുന്നു. ‘നേരം പുലർന്നപ്പോൾ’ എന്നത് പ്രഭാതമായെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; δέ-യുടെ നേരിയ തുടർച്ച മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിൽ പ്രകടമാകുന്നു.
- source_word: ἀπέστειλαν
  choice: അയച്ച്
  rationale: ἀποστέλλω എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘അയയ്ക്കുക’ നിലനിർത്തുന്നു; തുടർന്നുള്ള λέγοντες-നോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: στρατηγοὶ
  choice: നഗരാധികാരികൾ
  rationale: ഫിലിപ്പിയിലെ റോമൻ കോളനിയുടെ പൗരഭരണ ഉദ്യോഗസ്ഥരെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്; സാധാരണ സൈനിക ‘സേനാധിപന്മാർ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി പദവിയുടെ പ്രവർത്തനം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ῥαβδούχους
  choice: ദണ്ഡവാഹകരെ
  rationale: അക്ഷരാർഥത്തിലെ ‘ദണ്ഡം വഹിക്കുന്നവർ’ എന്ന ദൃശ്യവും റോമൻ അധികാരികളുടെ ഔദ്യോഗിക പരിചാരകർ എന്ന ചരിത്രപരമായ ചുമതലയും സംരക്ഷിക്കുന്നു.
- source_word: λέγοντες
  choice: എന്നു പറഞ്ഞു
  rationale: സന്ദേശത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന participle മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണിഘടനയിലൂടെ നൽകുന്നു.
- source_word: Ἀπόλυσον
  choice: വിട്ടയയ്ക്കുക
  rationale: തടവിലുള്ളവരെ മോചിപ്പിക്കാനുള്ള നിയമപരമായ കല്പനയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ഏകവചന കല്പനയാണെങ്കിലും സന്ദേശത്തിലെ നേരിട്ടുള്ള കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: ആ മനുഷ്യരെ
  rationale: ἐκείνους എന്ന ദൂരസൂചനയും പൗലൊസിനെയും ശീലാസിനെയും സൂചിപ്പിക്കുന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. റോമൻ ഭരണപശ്ചാത്തലം വ്യക്തമാക്കാൻ στρατηγοί എന്നതിന് ‘നഗരാധികാരികൾ’ എന്നും, ῥαβδοῦχοι എന്ന അപരിചിതമായ ഔദ്യോഗിക പദത്തിന്റെ സാക്ഷാൽ ദൃശ്യം സംരക്ഷിക്കാൻ ‘ദണ്ഡവാഹകർ’ എന്നും നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം അത് വിശദീകരിക്കുന്ന പദത്തിനരികിൽ സ്ഥാപിച്ചു.
