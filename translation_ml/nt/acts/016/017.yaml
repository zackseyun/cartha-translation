id: ACT.16.17
reference: Acts 16:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: ml
  text: 'അവൾ പൗലോസിനെയും ഞങ്ങളെയും പിന്തുടർന്നുകൊണ്ട് ഇങ്ങനെ ഉറക്കെ വിളിച്ചുപറഞ്ഞിരുന്നു: “ഈ മനുഷ്യർ അത്യുന്നതനായ ദൈവത്തിന്റെ അടിമകളാണ്. ഇവർ നിങ്ങൾക്കു രക്ഷയുടെ ഒരു വഴി[a] പ്രഖ്യാപിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “രക്ഷയുടെ വഴി” എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ ‘വഴി’ എന്ന നാമപദത്തിനു നിർദേശകപദമില്ല; അതിനാൽ ഈ പ്രയോഗം ‘ഒരു വഴി’ എന്നോ സന്ദർഭാനുസരണം ‘രക്ഷയുടെ വഴി’ എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: പിന്തുടർന്നുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപവും അപൂർണഭൂതകാലത്തിലെ മുഖ്യക്രിയയും ചേർന്ന് തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം അതു സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔκραζεν
  choice: ഉറക്കെ വിളിച്ചുപറഞ്ഞിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടർന്നോ ആവർത്തിച്ചോ നടന്ന ഉച്ചത്തിലുള്ള വിളിച്ചുപറച്ചിലിനെ സൂചിപ്പിക്കുന്നു.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: ഇവിടെ ദൈവത്തിന്റേതായിരിക്കുക എന്ന ഉടമസ്ഥതാബന്ധം പ്രധാനമായതിനാൽ, പൊതുവായ ‘ശുശ്രൂഷകർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ ഗ്രീക്ക് പദത്തിന്റെ ശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: അത്യുന്നതനായ ദൈവത്തിന്റെ
  rationale: സ്ഥിരമായ ദൈവിക വിശേഷണത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: καταγγέλλουσιν
  choice: പ്രഖ്യാപിക്കുന്നു
  rationale: പരസ്യമായി അറിയിക്കുകയോ വിളംബരം ചെയ്യുകയോ ചെയ്യുന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: പ്രഖ്യാപനത്തിന്റെ ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ὁδὸν σωτηρίας
  choice: രക്ഷയുടെ ഒരു വഴി
  rationale: ὁδόν എന്ന പദത്തിന് നിർദേശകപദം ഇല്ലാത്തതിനാൽ ഗ്രീക്കിലുള്ള നിർദിഷ്ടതാസന്ദിഗ്ധതയെ പ്രധാന പാഠത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁδὸν σωτηρίας എന്ന പ്രയോഗത്തിന്റെ നിർദിഷ്ടത
  choice: രക്ഷയുടെ ഒരു വഴി
  alternative: രക്ഷയുടെ വഴി
  rationale: നാമപദത്തിനു മുമ്പിൽ ഗ്രീക്ക് നിർദേശകപദമില്ല. സന്ദർഭം നിർദിഷ്ടമായ അർഥം അനുവദിക്കുന്നുണ്ടെങ്കിലും, വാക്യത്തിന്റെ രൂപത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ നിർദിഷ്ടത വിവർത്തനം സ്വയം ചേർക്കാതിരിക്കാൻ ‘ഒരു വഴി’ പ്രധാന പാഠത്തിൽ സ്വീകരിക്കുകയും മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. തുടർന്നുള്ള പ്രവൃത്തിയെ ‘പിന്തുടർന്നുകൊണ്ട്’ എന്നും ആവർത്തിച്ച ഉച്ചത്തിലുള്ള പ്രസ്താവനയെ ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞിരുന്നു’ എന്നും അവതരിപ്പിച്ചു. ‘അടിമകൾ’ എന്നത് δοῦλοι എന്ന പദത്തിലെ ഉടമസ്ഥതാബന്ധം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
