  source_fidelity: 'പ്രധാന ആശയങ്ങളും ഗ്രീക്ക് പദപ്രയോഗങ്ങളുടെ സൂക്ഷ്മതകളും നന്നായി സംരക്ഷിച്ചിട്ടുണ്ട്: പൊതുവായ ‘മരിച്ചവരുടെ പുനരുത്ഥാനം,’ ഉച്ചത്തിൽ പറഞ്ഞ പ്രഖ്യാപനം, അവർക്കിടയിൽ നിന്ന സ്ഥാനം, ന്യായസന്ദർഭം എന്നിവ യോജിച്ചതാണ്. എന്നാൽ ‘...പ്രസ്താവനയെക്കുറിച്ചായിരിക്കാം’ എന്നത് ഗ്രീക്കിലെ മുൻവാക്യത്തിൽനിന്ന് പൂരിപ്പിക്കപ്പെടുന്ന എലിപ്സിസിനെ സ്വതന്ത്രമായ സാധ്യതാപ്രസ്താവനയാക്കുന്നു. അതിനാൽ പൗലോസിന്റെ വെല്ലുവിളി/ഒഴിവാക്കൽ സ്വരം അല്പം മങ്ങുന്നു.'
  naturalness: ‘അല്ലെങ്കിൽ’ എന്ന ബന്ധകത്തെ മുൻവാക്യത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘അതല്ലെങ്കിൽ’ എന്നും, എലിപ്റ്റിക്കൽ ഗ്രീക്ക് ഘടനയെ ആധുനിക മലയാളത്തിൽ വായിക്കാവുന്ന വിധം നൽകാൻ ‘...ആണ് അവർ ആരോപിക്കാവുന്ന തെറ്റ്’ എന്നും വ്യക്തമാക്കുന്നത് ഉചിതമാണ്. ഉദ്ധരണിക്കുള്ളിലെ ഭാഷ സ്വാഭാവികവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
