id: ACT.24.21
reference: Acts 24:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ περὶ μιᾶς ταύτης φωνῆς ἧς ἐκέκραξα ⸂ἐν αὐτοῖς ἑστὼς⸃ ὅτι Περὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι σήμερον ⸀ἐφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/021.yaml
  text: 'or about this one statement that I shouted while standing among them: ‘It is concerning the resurrection of the dead that I am being judged before you today.’[a][b]'
translation:
  language: ml
  text: 'അതല്ലെങ്കിൽ, അവരുടെ ഇടയിൽ നിന്നുകൊണ്ട് ഞാൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞ ഈ ഒരേയൊരു പ്രസ്താവനയാണ് അവർ ആരോപിക്കാവുന്ന തെറ്റ്: ‘മരിച്ചവരുടെ പുനരുത്ഥാനത്തെക്കുറിച്ചാണ് ഇന്ന് നിങ്ങളുടെ മുമ്പാകെ ഞാൻ വിചാരണ ചെയ്യപ്പെടുന്നത്.’[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രസ്താവന’ എന്നതിനുപകരം ‘വിളി’ എന്നോ ‘ശബ്ദം’ എന്നോ വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം ഉച്ചരിച്ച വാക്കിനെയോ അത് ഉച്ചരിച്ച ശബ്ദത്തെയോ വിളിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς
  choice: പ്രസ്താവന
  rationale: φωνή സാധാരണയായി ‘ശബ്ദം’ അല്ലെങ്കിൽ ‘സ്വരം’ എന്നു വരാമെങ്കിലും, ഇവിടെ περὶ എന്നതിനോടും തുടർന്നുവരുന്ന ഉദ്ധരണിയുടെ ഉള്ളടക്കത്തോടും ചേർന്ന് ഒരു നിർദിഷ്ട വാക്കാലുള്ള പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκέκραξα
  choice: ഞാൻ ഉറക്കെ വിളിച്ചുപറഞ്ഞ
  rationale: κράζω ഉച്ചത്തിലുള്ള പരസ്യമായ ഉച്ചാരണത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞ’ എന്നത് ശബ്ദത്തിന്റെ ശക്തിയും സംസാരപ്രവൃത്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν αὐτοῖς ἑστὼς
  choice: അവരുടെ ഇടയിൽ നിന്നുകൊണ്ട്
  rationale: പൗലോസ് സംസാരിച്ചപ്പോഴുള്ള സ്ഥാനവും സാഹചര്യവും ഈ പ്രയോഗം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀναστάσεως νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: ജനിറ്റീവ് ഘടനയെ നേരിട്ട് നിലനിർത്തുകയും തർക്കവിഷയമായ പൊതുവായ പുനരുത്ഥാനപ്രത്യാശയെ യേശുവിന്റെ പുനരുത്ഥാനത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κρίνομαι
  choice: ഞാൻ വിചാരണ ചെയ്യപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപവും ന്യായവ്യവഹാരസന്ദർഭവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐφ’ ὑμῶν
  choice: നിങ്ങളുടെ മുമ്പാകെ
  rationale: ന്യായാധികാരികളുടെ സന്നിധിയിൽ വിചാരണ നേരിടുന്നു എന്ന ആശയം നൽകുന്നു; അവരാണ് നേരിട്ട് വിധിക്കുന്ന ഏക കർത്താക്കൾ എന്ന അനാവശ്യ സൂചന ഒഴിവാക്കുന്നു.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ പ്രതിരോധവാദവുമായി ലളിതമായി ബന്ധിപ്പിച്ച്, വേറൊരു സാധ്യതയായി ഈ ഏക വിഷയത്തെ അവതരിപ്പിക്കുന്നു.
- source_word: μιᾶς ταύτης
  choice: ഈ ഒരേയൊരു
  rationale: പ്രസ്താവനയുടെ ഏകത്വത്തിനും നിർദിഷ്ടതയ്ക്കും ഗ്രീക്കിൽ നൽകിയ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: σήμερον
  choice: ഇന്ന്
  rationale: വർത്തമാനകാലസൂചന നൽകുന്ന സ്വാഭാവിക ആധുനിക മലയാളം.
theological_decisions:
- issue: തർക്കവിഷയമായ കുറ്റാരോപണത്തിന്റെ സ്വഭാവം
  choice: പ്രധാനവാക്യത്തിൽ വിഷയം പൊതുവായി ‘മരിച്ചവരുടെ പുനരുത്ഥാനം’ എന്നായി നിലനിർത്തി.
  alternative: ഇത് പ്രത്യേകമായി യേശുവിന്റെ പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്നു എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: περὶ ἀναστάσεως νεκρῶν എന്ന ഗ്രീക്ക് പ്രയോഗം പൊതുവായതാണ്. അപ്പൊസ്തലപ്രവൃത്തികളുടെ വിപുലമായ സന്ദർഭം യേശുവിന്റെ പുനരുത്ഥാനവുമായി ഇതിനെ ബന്ധിപ്പിക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത പ്രത്യേക ക്രിസ്തുശാസ്ത്രപരമായ അർഥം ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമസന്ദർഭത്തിന് ‘വിചാരണ ചെയ്യപ്പെടുന്നു’ എന്നും ഉച്ചത്തിലുള്ള പരസ്യപ്രഖ്യാപനത്തിന് ‘ഉറക്കെ വിളിച്ചുപറഞ്ഞ’ എന്നും ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
