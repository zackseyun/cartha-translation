source:
  edition: SBLGNT
  text: ⸂Ἀνεβάλετο δὲ αὐτοὺς ὁ Φῆλιξ⸃, ἀκριβέστερον εἰδὼς τὰ περὶ τῆς ὁδοῦ, ⸀εἴπας· Ὅταν Λυσίας ὁ χιλίαρχος καταβῇ διαγνώσομαι τὰ καθ’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/022.yaml
  text: But Felix, having a more accurate knowledge about the Way, put them off, saying, “When Lysias the commander comes down, I will decide your case.”
translation:
  language: ml
  text: 'എന്നാൽ മാർഗത്തെപ്പറ്റി കൂടുതൽ കൃത്യമായി അറിയാമായിരുന്നതിനാൽ, ഫെലിക്സ് അവരുടെ കാര്യം പിന്നത്തേക്കു മാറ്റിവെച്ചു[a]. അദ്ദേഹം പറഞ്ഞു: “സൈനികാധിപനായ ലിസിയാസ് ഇറങ്ങിവരുമ്പോൾ നിങ്ങളെ സംബന്ധിച്ച കാര്യങ്ങളിൽ ഞാൻ തീർപ്പുകൽപ്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നടപടികൾ നീട്ടിവെച്ചു”; ഗ്രീക്ക് ക്രിയയ്ക്ക് നിയമനടപടി പിന്നത്തേക്കു മാറ്റുക അഥവാ നിർത്തിവെക്കുക എന്നർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνεβάλετο
  choice: മാറ്റിവെച്ചുകൊണ്ട്
  rationale: ഇവിടെ മധ്യപ്രയോഗത്തിലുള്ള ക്രിയയ്ക്ക് നിയമനടപടിയോ തീരുമാനമോ നീട്ടിവെക്കുക എന്ന അർഥമാണ്. വ്യക്തികളെ സൂചിപ്പിക്കുന്ന αὐτούς നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ നിയമസന്ദർഭം നൽകുന്നു.
- source_word: αὐτούς
  choice: അവരെ
  rationale: പുരുഷലിംഗ ബഹുവചന സർവനാമം ഫെലിക്സിന്റെ മുമ്പിലുള്ള കക്ഷികളെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്; ‘കേസ്’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀκριβέστερον εἰδὼς
  choice: കൂടുതൽ കൃത്യമായി അറിവുണ്ടായിരുന്ന
  rationale: ἀκριβέστερον എന്ന താരതമ്യഭാവവും εἰδὼς എന്ന അറിവിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: τὰ περὶ τῆς ὁδοῦ
  choice: മാർഗത്തെക്കുറിച്ച്
  rationale: പ്രവൃത്തികളിൽ ആദിമ ക്രിസ്തീയ പ്രസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന അർധസാങ്കേതിക നാമമായ ‘മാർഗം’ അതേപടി നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഈ’ ചേർക്കുന്നില്ല.
- source_word: Ὅταν ... καταβῇ
  choice: ഇറങ്ങിവരുമ്പോൾ
  rationale: പ്രതീക്ഷിക്കപ്പെടുന്ന ഒരു ഭാവി വരവിനെ സൂചിപ്പിക്കുന്ന ὅταν സഹിതമുള്ള ഉപവാക്യം സ്വാഭാവികമായി നൽകുകയും καταβῇയിലെ ‘ഇറങ്ങിവരുക’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; വിശദീകരണം ആവശ്യമായ ലിപ്യന്തരണം ഒഴിവാക്കുന്നു.
- source_word: διαγνώσομαι
  choice: തീർപ്പാക്കാം
  rationale: നിയമസന്ദർഭത്തിൽ പരിശോധിച്ച് തീരുമാനിക്കുക എന്ന ക്രിയയുടെ ഫലം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ καθ’ ὑμᾶς
  choice: നിങ്ങളുടെ കേസ്
  rationale: നിങ്ങളെ സംബന്ധിച്ച കാര്യങ്ങൾ എന്ന ഗ്രീക്ക് പ്രയോഗം ഈ നിയമസന്ദർഭത്തിൽ ‘നിങ്ങളുടെ കേസ്’ എന്ന് സ്വാഭാവികവും വ്യക്തവുമായി വരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ‘മാർഗം’ എന്ന ആദിമ പ്രസ്ഥാനനാമം മൂലത്തിലെ സംക്ഷിപ്തതയോടെ നിലനിർത്തി; സാധാരണ വായനയിൽ അത് സ്വയം വ്യക്തമായില്ലെങ്കിലും വാക്യത്തിന്റെ പരിഭാഷയിൽ വ്യാഖ്യാനവികാസം ചേർത്തിട്ടില്ല. എല്ലാ നൽകിയ ഇംഗ്ലീഷ് അടിക്കുറിപ്പുകളും നിർബന്ധമായി പുനരാവർത്തിക്കാതെ, മലയാളവാചകത്തിൽ യഥാർഥത്തിൽ ആവശ്യമായ പദാർഥവൈകല്യം മാത്രം അടിക്കുറിപ്പാക്കി.
