id: ACT.24.16
reference: Acts 24:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀καὶ αὐτὸς ἀσκῶ ἀπρόσκοπον συνείδησιν ⸀ἔχειν πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους διὰ παντός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/016.yaml
  text: In view of this[a], I myself also strive always to have a blameless conscience before God and men.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ, ദൈവത്തിന്റെയും മനുഷ്യരുടെയും മുമ്പാകെ എപ്പോഴും കുറ്റമറ്റ മനസ്സാക്ഷി പുലർത്താൻ ഞാനും പരിശ്രമിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻവാക്യത്തിലെ പ്രത്യാശയെയും ഉയിർത്തെഴുന്നേൽപ്പിനെയും സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അനുമാനാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ αὐτὸς
  choice: ഞാനും
  rationale: καί-യുടെ കൂട്ടിച്ചേർക്കൽഭാവവും αὐτός നൽകുന്ന വ്യക്തിപരമായ ഊന്നലും മലയാളത്തിലെ സ്വാഭാവികമായ ‘ഞാനും’ എന്ന പ്രയോഗത്തിൽ സന്ദർഭാനുസൃതമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἀσκῶ
  choice: പരിശ്രമിക്കുന്നു
  rationale: തുടർച്ചയായ ധാർമിക പ്രയത്നത്തെ സൂചിപ്പിക്കുന്ന ἀσκέω എന്ന ക്രിയയ്ക്ക് വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: ἀπρόσκοπον
  choice: കുറ്റമറ്റ
  rationale: ഇവിടെ മനസ്സാക്ഷിയെ വിശേഷിപ്പിച്ച് ദൈവത്തോടും മനുഷ്യരോടുമുള്ള ബന്ധത്തിൽ അപവാദത്തിനോ ഇടർച്ചയ്ക്കോ ഇടനൽകാത്ത നിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: συνείδησιν
  choice: മനസ്സാക്ഷി
  rationale: ആന്തരിക ധാർമികബോധത്തെ സൂചിപ്പിക്കുന്ന συνείδησις എന്ന പദത്തിന്റെ പ്രചാരത്തിലുള്ള കൃത്യമായ മലയാളരൂപം.
- source_word: ἔχειν
  choice: പുലർത്താൻ
  rationale: ‘ഉണ്ടായിരിക്കാൻ’ എന്ന അക്ഷരാർഥത്തെക്കാൾ തുടർച്ചയായി നിലനിർത്തുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὸν θεὸν καὶ τοὺς ἀνθρώπους
  choice: ദൈവത്തിന്റെയും മനുഷ്യരുടെയും മുമ്പാകെ
  rationale: πρός ഇവിടെ ബന്ധത്തെയും ഉത്തരവാദിത്വത്തെയും സൂചിപ്പിക്കുന്നു; ‘മുമ്പാകെ’ ദൈവത്തോടും മനുഷ്യരോടുമുള്ള ഈ ഇരട്ട ഉത്തരവാദിത്വം സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: διὰ παντός
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ കാലദൈർഘ്യം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀνθρώπους എന്ന പദത്തിന്റെ പൊതുവായ പ്രതിനിധ്യാർഥം
  choice: മനുഷ്യർ
  alternative: ആളുകൾ / മറ്റുള്ളവർ
  rationale: ഗ്രീക്കിലെ ἀνθρώπους ഇവിടെ സ്ത്രീപുരുഷഭേദമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യർ’ ഈ പൊതുവായ അർഥം കൃത്യമായി നൽകുന്നതിനാൽ ലിംഗസൂചനയുള്ള വിശദീകരണ അടിക്കുറിപ്പ് ആവശ്യമില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ കാരണബന്ധം, പൗലോസിന്റെ വ്യക്തിപരമായ പങ്കാളിത്തം, തുടർച്ചയായ പരിശ്രമം, ദൈവത്തോടും മനുഷ്യരോടുമുള്ള ഉത്തരവാദിത്വം എന്നിവ സംക്ഷിപ്തമായി സംരക്ഷിച്ചിരിക്കുന്നു.
