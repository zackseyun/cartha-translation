  yaml_path: translation/nt/acts/024/020.yaml
  text: Or let these men themselves say what wrongdoing they found when I stood before the council,[a]
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഞാൻ ന്യായസമിതിയുടെ മുമ്പിൽ നിന്നപ്പോൾ അവർ എന്ത് കുറ്റം കണ്ടെത്തിയെന്ന് ഇവർതന്നെ പറയട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൻഹെദ്രിന്റെ മുമ്പിൽ.’ ഗ്രീക്കിലെ συνέδριον യഹൂദരുടെ ഭരണ-ന്യായ സമിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: പൗലോസിന്റെ പ്രതിവാദത്തിൽ മറ്റൊരു സാധ്യത മുന്നോട്ടുവയ്ക്കുന്ന ബന്ധകത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: αὐτοὶ οὗτοι
  choice: ഇവർതന്നെ
  rationale: ചൂണ്ടിക്കാട്ടലും ഊന്നലും ഒരുമിച്ച് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἰπάτωσαν
  choice: പറയട്ടെ
  rationale: നിയമവാദസന്ദർഭത്തിലെ മൂന്നാംപുരുഷ ആജ്ഞാർത്ഥം മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: τί εὗρον
  choice: എന്തു ... കണ്ടെത്തിയതെന്ന്
  rationale: അവർ കണ്ടെത്തിയതായി പറയാവുന്ന നിർദിഷ്ട കുറ്റം ചോദ്യം ചെയ്യുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀδίκημα
  choice: കുറ്റം
  rationale: തെറ്റായ പ്രവൃത്തിയെയോ നിയമലംഘനത്തെയോ സൂചിപ്പിക്കുന്ന പദം; ഇവിടെ കോടതിസന്ദർഭത്തിൽ ‘കുറ്റം’ സ്വാഭാവികമാണ്, എന്നാൽ ‘കുറ്റകൃത്യം’ എന്നതുപോലെ അനാവശ്യമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: στάντος μου
  choice: ഞാൻ നിന്നപ്പോൾ
  rationale: പൗലോസ് സഭയ്ക്കുമുമ്പാകെ ഹാജരായ സമയത്തെ സൂചിപ്പിക്കുന്ന കാലികബന്ധം ലളിതമായി പകർന്നിരിക്കുന്നു.
- source_word: ἐπὶ τοῦ συνεδρίου
  choice: ന്യായാധിപസഭയുടെ മുമ്പിൽ
  rationale: യഹൂദരുടെ ഭരണ-ന്യായ സമിതിയെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം സൂചിപ്പിക്കുന്നു; നിർദിഷ്ട നാമമായ ‘സൻഹെദ്രിൻ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
