  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കോടതിവാദത്തിന്റെ ഗൗരവവും പൗലോസിന്റെ വെല്ലുവിളിയുടെ ഊന്നലും നിലനിർത്തി. ‘ഇവർതന്നെ’ എന്ന രൂപം αὐτοὶ οὗτοι എന്നതിന്റെ ഊന്നൽ സ്വാഭാവികമായി പകരുന്നു.
