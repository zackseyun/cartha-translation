  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἅμα καὶ ἐλπίζων ὅτι χρήματα δοθήσεται αὐτῷ ὑπὸ τοῦ ⸀Παύλου· διὸ καὶ πυκνότερον αὐτὸν μεταπεμπόμενος ὡμίλει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/026.yaml
  text: At the same time he was hoping that money would be given to him by Paul[a]; therefore he also sent for him more often and talked with him.
translation:
  language: ml
  text: അതേസമയം, പൗലോസ് തനിക്കു പണം തരുമെന്ന് ഫെലിക്സ് പ്രതീക്ഷിച്ചിരുന്നു[a]. അതുകൊണ്ട്, അദ്ദേഹം പൗലോസിനെ കൂടുതൽ തവണ വിളിപ്പിക്കുകയും പൗലോസുമായി സംസാരിക്കുകയും ചെയ്യുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: “പൗലോസിൽനിന്ന് കൈക്കൂലി ലഭിക്കുമെന്ന്.” ഗ്രീക്കിൽ നേരിട്ട് പറയുന്നത് “പണം” എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα καὶ
  choice: അതേസമയം
  rationale: മുൻവിവരണത്തോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രതീക്ഷയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλπίζων
  choice: പ്രതീക്ഷിച്ചിരുന്നു
  rationale: പ്രധാനപ്രവർത്തനങ്ങളോടൊപ്പം തുടരുന്ന പ്രതീക്ഷയെ അപൂർണ്ണഭൂതകാലസ്വഭാവത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: χρήματα
  choice: പണം
  rationale: സന്ദർഭത്തിൽ കൈക്കൂലി സൂചിതമാണെങ്കിലും ഗ്രീക്ക് പദം പൊതുവായി ‘പണം’ എന്നാണ്; അതിനാൽ മുഖ്യവാചകത്തിൽ അതിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: δοθήσεται αὐτῷ ὑπὸ τοῦ Παύλου
  choice: പൗലോസ് തനിക്കു പണം തരുമെന്ന്
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിൽ അതേ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്ന കർത്തരിപ്രയോഗമായി മാറ്റി; പണത്തിന്റെ ഉറവിടം പൗലോസാണെന്നത് സംരക്ഷിക്കുന്നു.
- source_word: διὸ καὶ
  choice: അതുകൊണ്ട്
  rationale: ഫെലിക്സിന്റെ പ്രതീക്ഷയും തുടർന്നുള്ള പ്രവൃത്തിയും തമ്മിലുള്ള കാരണബന്ധം വ്യക്തമാക്കുന്നു; καίയുടെ കൂട്ടിച്ചേർക്കൽ ഇവിടെ മലയാളത്തിൽ പ്രത്യേകം ‘കൂടി’ ചേർക്കാതെ തന്നെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: πυκνότερον
  choice: കൂടുതൽ കൂടെക്കൂടെ
  rationale: താരതമ്യപരമായ ആവർത്തനസാന്ദ്രത, അതായത് മുമ്പിലേതിനെക്കാൾ അധികം തവണ എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: μεταπεμπόμενος
  choice: വിളിപ്പിച്ച്
  rationale: അധികാരമുള്ള ഒരാൾ മറ്റൊരാളെ ആളയച്ചു വരുത്തുന്ന അർഥം ചുരുക്കമായും സാഹചര്യോചിതമായും നൽകുന്നു.
- source_word: ὡμίλει αὐτῷ
  choice: അദ്ദേഹവുമായി സംസാരിക്കുമായിരുന്നു
  rationale: ഒറ്റത്തവണത്തെ ഔപചാരിക പ്രസംഗമല്ല, ആവർത്തിച്ചുള്ള സംഭാഷണമാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഫെലിക്സിന്റെ അഴിമതിപരമായ ഉദ്ദേശ്യം മുഖ്യവാചകത്തിൽ ‘കൈക്കൂലി’ എന്നു വ്യക്തമാക്കണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘പണം’ എന്നു നിലനിർത്തി, കൈക്കൂലി എന്ന സന്ദർഭോചിത അർഥം അടിക്കുറിപ്പിൽ നൽകുക
  alternative: ‘പൗലോസിൽനിന്ന് കൈക്കൂലി കിട്ടുമെന്ന്’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: സന്ദർഭം കൈക്കൂലിയെ ശക്തമായി സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും χρήματα എന്ന ഗ്രീക്ക് പദം നേരിട്ട് ‘പണം’ എന്നാണ്. അതിനാൽ ഉറവിടത്തിന്റെ പദപരമായ നിയന്ത്രണം പാലിച്ചുകൊണ്ട് സൂചന മറച്ചുവയ്ക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. ‘ഫെലിക്സ്’ എന്ന പേര് ചേർത്ത് ആദ്യ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി വ്യക്തമാക്കിയിരിക്കുന്നു; പൗലോസിനെ തുടർന്നുള്ള പരാമർശങ്ങളിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘അയാൾ’ എന്നും ‘അദ്ദേഹം’ എന്നും വ്യത്യസ്തമായി ഉപയോഗിച്ചു.
