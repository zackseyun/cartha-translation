translation_notes:
  register: ആധുനികവും ആദരപൂർവവുമായ കോടതിഭാഷയാണ് സ്വീകരിച്ചത്. ‘അങ്ങ്’, ‘ന്യായാധിപൻ’, ‘പ്രതിവാദം’ എന്നീ പദങ്ങൾ പ്രസംഗത്തിന്റെ ഔപചാരികത നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ സ്വാഭാവികമാക്കി.
