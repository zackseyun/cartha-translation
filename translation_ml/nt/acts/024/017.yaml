reference: Acts 24:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ ἐτῶν δὲ πλειόνων ⸂ἐλεημοσύνας ποιήσων εἰς τὸ ἔθνος μου παρεγενόμην⸃ καὶ προσφοράς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/017.yaml
  text: After several years I came to bring alms to my nation[a], and offerings.
translation:
  language: ml
  text: പല വർഷങ്ങൾക്കുശേഷം, എന്റെ ജനതയ്ക്കു ദാനധർമ്മങ്ങളും വഴിപാടുകളും കൊണ്ടുവരാൻ ഞാൻ വന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι’ ἐτῶν δὲ πλειόνων
  choice: പല വർഷങ്ങൾക്കുശേഷം
  rationale: διά + genitive ഇവിടെ കഴിഞ്ഞുപോയ ഒരു കാലയളവിനു ശേഷമെന്ന അർഥം നൽകുന്നു. δέ-യുടെ നേരിയ ബന്ധകശക്തി മലയാളത്തിൽ നിർബന്ധമായി വേറൊരു പദം ചേർക്കാതെ സ്വാഭാവികമായി വാക്യബന്ധത്തിൽ ഉൾക്കൊള്ളുന്നു; πλειόνων എന്നത് സന്ദർഭത്തിൽ ‘പല’ എന്ന ഇടിയോമാറ്റിക് അർഥത്തിലാണ്.
- source_word: ἐλεημοσύνας
  choice: ദരിദ്രർക്കുള്ള ദാനങ്ങൾ
  rationale: ഈ പദം ആവശ്യത്തിലിരിക്കുന്നവർക്കു നൽകുന്ന ദാനസഹായത്തെ സൂചിപ്പിക്കുന്നു. ‘ദാനങ്ങൾ’ എന്നു മാത്രം പറയുന്നതിലുപരി ഇതിന്റെ ജീവകാരുണ്യസ്വഭാവം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ποιήσων
  choice: കൊണ്ടുവരാൻ
  rationale: ποιέω അക്ഷരാർഥത്തിൽ ‘ചെയ്യുക’ എന്നാണെങ്കിലും ἐλεημοσύνας എന്നതോടൊപ്പം ദാനം നൽകുക/എത്തിക്കുക എന്ന ഇടിയോമാറ്റിക് അർഥമാണ്. പൗലോസ് യെരൂശലേമിലേക്കു വന്നതെന്ന സന്ദർഭത്തിൽ ‘കൊണ്ടുവരാൻ’ സ്വാഭാവികമാണ്.
- source_word: εἰς τὸ ἔθνος μου
  choice: എന്റെ ജനതയ്ക്കായി
  rationale: ἔθνος ഇവിടെ പൗലോസിന്റെ സ്വന്തം യഹൂദജനത്തെ സൂചിപ്പിക്കുന്നു. ‘ജനത’ ദേശീയ-സാമൂഹിക അർഥം നിലനിർത്തുന്നു; εἰς ദാനങ്ങളുടെ ലക്ഷ്യസ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘യ്ക്കായി’ സ്വാഭാവികമാണ്.
- source_word: παρεγενόμην
  choice: ഞാൻ വന്നു
  rationale: παραγίνομαι ഇവിടെ എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വന്നു’ ലളിതവും സ്വാഭാവികവുമാണ്.
- source_word: προσφοράς
  choice: വഴിപാടുകൾ
  rationale: προσφοράς ദൈവത്തിനു സമർപ്പിക്കുന്ന വഴിപാടുകളെ സൂചിപ്പിക്കാം. ഗ്രീക്ക് കൃത്യമായ തരം വ്യക്തമാക്കാത്തതിനാൽ പൊതുവായ ‘വഴിപാടുകൾ’ ആ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: യെരൂശലേമിൽ പൗലോസ് കൊണ്ടുവന്ന ദാനങ്ങളുടെ സ്വഭാവം
  choice: ἐλεημοσύνας എന്നത് ‘ദരിദ്രർക്കുള്ള ദാനങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ദാനധർമ്മങ്ങൾ; ഭിക്ഷാദാനങ്ങൾ
  rationale: ഇത് മുഖ്യമായി പദാർഥപരമായ തീരുമാനമാണ്. ആവശ്യത്തിലിരിക്കുന്നവർക്കുള്ള സഹായം എന്ന ആശയം വ്യക്തമാക്കുകയും സാങ്കേതികമോ പഴഞ്ചനായോ തോന്നാവുന്ന പദപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: ἔθνος എന്ന പദത്തിന്റെ അർഥം
  choice: ‘എന്റെ ജനത’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: എന്റെ ജനം; എന്റെ രാഷ്ട്രം
  rationale: ഇവിടെ പൗലോസ് സ്വന്തം യഹൂദജനത്തെ ഉദ്ദേശിക്കുന്നു. ‘ജനത’ മനുഷ്യസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക രാഷ്ട്രീയരാജ്യം എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- issue: προσφοράς എന്ന വഴിപാടുകളുടെ കൃത്യസ്വഭാവം
  choice: ‘വഴിപാടുകൾ’ എന്ന പൊതുവായ പദം നിലനിർത്തി.
  alternative: യാഗവഴിപാടുകൾ; ദൈവത്തിനുള്ള വഴിപാടുകൾ
  rationale: മൂലപാഠം അവയുടെ കൃത്യമായ രൂപമോ ഉദ്ദേശ്യമോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സന്ദർഭം അനുവദിക്കുന്ന ദൈവാരാധനാസംബന്ധമായ അർഥം നിലനിർത്തിക്കൊണ്ട് കൂടുതൽ വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭിക്ഷ’ പോലുള്ള തെറ്റിദ്ധാരണയ്ക്കിടയാക്കാവുന്ന പദം ഒഴിവാക്കി; ‘ദരിദ്രർക്കുള്ള ദാനങ്ങൾ’ സാധാരണ വായനക്കാർക്ക് അർഥം ഉടൻ വ്യക്തമാക്കുന്നു. വാക്യക്രമം ഗ്രീക്കിന്റെ ആശയക്രമം കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
