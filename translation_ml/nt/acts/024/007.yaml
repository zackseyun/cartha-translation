translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സൈനികാധിപൻ’ പദവിയുടെ സൈനികസ്വഭാവം വ്യക്തമാക്കുന്നു; ‘വളരെ ബലം പ്രയോഗിച്ച്’ എന്നത് ഗ്രീക്കിലെ ശക്തമായ നിർബന്ധം നിലനിർത്തുന്നു.
