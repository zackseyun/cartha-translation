source:
  edition: robinson-pierpont-2005-byzantine
  text: παρελθὼν δὲ Λυσίας ὁ χιλίαρχος μετὰ πολλῆς βίας ἐκ τῶν χειρῶν ἡμῶν ἀπήγαγεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/007.yaml
  text: But[a] Lysias the commander came and took him out of our hands with great force,
translation:
  language: ml
  text: എന്നാൽ[a] സൈനികാധിപനായ ലൂസിയാസ് വന്ന് വളരെ ബലം പ്രയോഗിച്ച് അവനെ ഞങ്ങളുടെ കൈകളിൽനിന്ന് കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യവും 6-ാം വാക്യത്തിന്റെ അവസാനഭാഗവും 8-ാം വാക്യത്തിന്റെ ആരംഭഭാഗവും ഏറ്റവും പഴക്കമുള്ള ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ—മൂന്നാം നൂറ്റാണ്ടിലെ പപ്പിറസ് 74, നാലാം നൂറ്റാണ്ടിലെ സിനായിറ്റിക്കസ്, വത്തിക്കാനസ് എന്നിവ ഉൾപ്പെടെ—ആദ്യകാല കോപ്റ്റിക് പരിഭാഷകളിലും കാണുന്നില്ല. എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാഠപരമ്പരയിലും ലത്തീൻ പാരമ്പര്യത്തിലും പിൽക്കാല ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലും ഇത് നിലനിൽക്കുന്നു. ഫെലിക്സിന്റെ മുമ്പാകെയുള്ള വിവരണത്തിൽ റോമൻ സൈനികാധിപന്റെ ഇടപെടൽ വിവരിക്കുന്ന ആദ്യകാല പാഠവികാസമായിരിക്കാം ഇത്.
    reason: textual_critical
lexical_decisions:
- source_word: παρελθών (παρέρχομαι)
  choice: വന്ന്
  rationale: സംഭവസ്ഥലത്തേക്ക് ലൂസിയാസ് വന്നതിനെ സൂചിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപം. മലയാളത്തിലെ സ്വാഭാവിക ആഖ്യാനശൈലിക്കായി തുടർന്നുള്ള ക്രിയയോട് ചേർത്ത് ‘വന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: അക്ഷരാർഥത്തിൽ ആയിരം സൈനികരുടെ അധിപൻ; ഇവിടെ റോമൻ സൈനിക ട്രിബ്യൂണിനെ സൂചിപ്പിക്കുന്നു. പ്രത്യേക റോമൻ പദവിപ്പേര് ഉപയോഗിക്കാതെ ഉയർന്ന സൈനികാധികാരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്ന പദം തിരഞ്ഞെടുത്തു.
- source_word: μετὰ πολλῆς βίας
  choice: വളരെ ബലം പ്രയോഗിച്ച്
  rationale: βία ഇവിടെ ശാരീരിക ബലപ്രയോഗത്തെ സൂചിപ്പിക്കുന്നു. ‘അക്രമം’ എന്നു പറഞ്ഞ് ദുഷ്ടലക്ഷ്യം അനാവശ്യമായി ആരോപിക്കാതെ, പ്രവർത്തനത്തിന്റെ ശക്തമായ നിർബന്ധസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἀπήγαγεν (ἀπάγω)
  choice: കൊണ്ടുപോയി
  rationale: ഒരാളെ ഒരു സ്ഥലത്തുനിന്ന് മാറ്റിക്കൊണ്ടുപോകുക എന്ന അർഥം. ἐκ τῶν χειρῶν ἡμῶν എന്ന പ്രയോഗത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ἐκ τῶν χειρῶν ἡμῶν
  choice: ഞങ്ങളുടെ കൈകളിൽനിന്ന്
  rationale: ഗ്രീക്കിലെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു; ഒരാളെ തങ്ങളുടെ പിടിയിലോ നിയന്ത്രണത്തിലോ വെച്ചിരുന്നതിന്റെ അർഥം മലയാളത്തിലും വ്യക്തമാണ്.
