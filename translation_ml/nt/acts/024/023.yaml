translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി സ്വീകരിച്ചു. നിയമപരമായ കാവലും അതിനുള്ളിലെ പരിമിതമായ ഇളവും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തി; ‘സ്വന്തക്കാർ’ എന്ന പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ വിശാലത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
