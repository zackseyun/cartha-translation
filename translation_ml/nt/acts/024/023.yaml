revisions:
- from: അവനെ കാവലിൽ പാർപ്പിക്കാനും, എന്നാൽ അവന് കുറച്ചു സ്വാതന്ത്ര്യം അനുവദിക്കാനും[a], അവന്റെ സ്വന്തക്കാരിൽ[b] ആരെയും അവന്റെ ആവശ്യങ്ങൾ നിറവേറ്റാൻ സഹായിക്കുന്നതിൽനിന്ന് തടയാതിരിക്കാനും ശതാധിപനോട് അദ്ദേഹം കല്പിച്ചു.
  to: അവനെ കാവലിൽ പാർപ്പിക്കാനും, അവന് ഇളവ് അനുവദിക്കാനും[a], അവന്റെ സ്വന്തം ആളുകളിൽ[b] ആരെയും അവന്നു സേവനം ചെയ്യുന്നതിൽനിന്ന് തടയാതിരിക്കാനും അദ്ദേഹം ശതാധിപനോടു കല്പിച്ചു.
  rationale: The revision removes an awkward, indirect expression for practical service, uses a more natural Malayalam expression for Paul's associates, and avoids adding an unnecessary adversative connector. It retains the source's custodial setting, the deliberately broad reference to ‘his own people,’ and the lexical ambiguity of ἄνεσις in the footnote.
  reviewer_model: gpt-5.6-terra
