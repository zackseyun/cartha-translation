id: ACT.24.23
reference: Acts 24:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀διαταξάμενος τῷ ἑκατοντάρχῃ τηρεῖσθαι ⸀αὐτὸν ἔχειν τε ἄνεσιν καὶ μηδένα κωλύειν τῶν ἰδίων αὐτοῦ ⸀ὑπηρετεῖν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/023.yaml
  text: And he ordered the centurion to keep him in custody[a], yet to let him have some freedom[b], and to prevent none of his own people from attending to his needs.
translation:
  language: ml
  text: അവനെ കാവലിൽ പാർപ്പിക്കാനും, അവന് ഇളവ് അനുവദിക്കാനും[a], അവന്റെ സ്വന്തം ആളുകളിൽ[b] ആരെയും അവന്നു സേവനം ചെയ്യുന്നതിൽനിന്ന് തടയാതിരിക്കാനും അദ്ദേഹം ശതാധിപനോടു കല്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന് ആശ്വാസം നൽകാനും’ അല്ലെങ്കിൽ ‘അവന് ഒരു പരിധിവരെ സ്വാതന്ത്ര്യം അനുവദിക്കാനും.’ ഗ്രീക്കുപദത്തിന് ആശ്വാസം, ഇളവ്, അല്ലെങ്കിൽ കർശനമായ തടങ്കലിൽനിന്നുള്ള പരിമിതമായ സ്വാതന്ത്ര്യം എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘അവന്റെ സ്വന്തം ആളുകളിൽ ആരെയും.’ ഇത് പൗലോസിന്റെ കൂട്ടാളികളെയോ പിന്തുണച്ചവരെയോ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαταξάμενος
  choice: കല്പിച്ചു
  rationale: ഗ്രീക്കിലെ aorist participle കഥനസന്ദർഭത്തിന് സ്വാഭാവികമായ സമാപകക്രിയയായി നൽകി; അധികാരപൂർവമായ നിർദേശം എന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: τῷ ἑκατοντάρχῃ
  choice: ശതാധിപനോട്
  rationale: റോമൻ സൈന്യത്തിലെ നൂറുപേർക്കു മേൽ ചുമതലയുള്ള ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന കൃത്യവും മലയാള ബൈബിൾവായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: τηρεῖσθαι αὐτόν
  choice: അവനെ കാവലിൽ പാർപ്പിക്കാനും
  rationale: ഇവിടെ τηρέω സാധാരണ സംരക്ഷണമല്ല, നിയമപരമായ കസ്റ്റഡിയിൽ സൂക്ഷിക്കലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔχειν τε ἄνεσιν
  choice: അവന് കുറച്ചു സ്വാതന്ത്ര്യം അനുവദിക്കാനും
  rationale: ἄνεσις ആശ്വാസം, ഇളവ്, നിയന്ത്രണത്തിൽനിന്നുള്ള ഒരു പരിധിവരെയുള്ള സ്വാതന്ത്ര്യം എന്നിവ സൂചിപ്പിക്കാം. തടവിൽനിന്നുള്ള പൂർണ മോചനമല്ലാത്ത നിയന്ത്രിത സ്വാതന്ത്ര്യം ഇവിടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τε ... καὶ
  choice: എന്നാൽ ... -ാനും
  rationale: രണ്ട് നിർദേശങ്ങളെയും ഏകോപിപ്പിക്കുമ്പോൾ കാവലും ഇളവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ബന്ധം പട്ടികാസ്വഭാവമുള്ള ക്രിയാരൂപങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: μηδένα κωλύειν
  choice: ആരെയും ... തടയാതിരിക്കാനും
  rationale: ഒരാളെയും തടസ്സപ്പെടുത്തരുത് എന്ന സാർവത്രിക നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τῶν ἰδίων αὐτοῦ
  choice: അവന്റെ സ്വന്തക്കാരിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ സ്വന്തം ആളുകൾ’ എന്നാണ്; കുടുംബാംഗങ്ങൾ എന്നു പരിമിതപ്പെടുത്താതെ പൗലോസിന്റെ കൂട്ടാളികളെയോ പിന്തുണച്ചവരെയോ ഉൾക്കൊള്ളാവുന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ὑπηρετεῖν αὐτῷ
  choice: അവന്റെ ആവശ്യങ്ങൾ നിറവേറ്റാൻ സഹായിക്കുന്നതിൽനിന്ന്
  rationale: പ്രായോഗിക സേവനവും സഹായവും നൽകുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; സഭാപരമായ പ്രത്യേക അർഥം തോന്നാവുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
