source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸀παραστῆσαι δύνανταί ⸀σοι περὶ ὧν ⸀νυνὶ κατηγοροῦσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/013.yaml
  text: Nor can they prove to you the things of which they are now accusing me[a].
translation:
  language: ml
  text: ഇപ്പോൾ അവർ എനിക്കെതിരെ ഉന്നയിക്കുന്ന ആരോപണങ്ങൾ താങ്കളുടെ മുമ്പാകെ തെളിയിക്കാനും അവർക്കു കഴിയില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘താങ്കളുടെ മുമ്പാകെ അവതരിപ്പിക്കാനോ’ ‘സ്ഥാപിക്കാനോ’; ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരു കാര്യം അവതരിപ്പിക്കുക, പ്രകടമാക്കുക, അല്ലെങ്കിൽ സ്ഥാപിക്കുക എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ നിയമപരമായ ആരോപണം തെളിവുകൊണ്ട് സാധൂകരിക്കുക എന്ന ആശയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: '...ഉം ... കഴിയില്ല'
  rationale: മുൻവാക്യത്തിലെ പ്രതിവാദം തുടരുന്ന നിഷേധബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παραστῆσαι
  choice: തെളിയിക്കാൻ
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ ആരോപണങ്ങളെ സാധൂകരിക്കുകയോ തെളിവുകൊണ്ട് സ്ഥാപിക്കുകയോ ചെയ്യുക എന്ന അർഥമാണ്; അടിസ്ഥാനത്തിലുള്ള ‘മുമ്പാകെ അവതരിപ്പിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δύνανταί
  choice: കഴിയില്ല
  rationale: കഴിവില്ലായ്മ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: σοι
  choice: താങ്കളുടെ മുമ്പാകെ
  rationale: ഫേലിക്സിനെ ആദരപൂർവം അഭിസംബോധന ചെയ്യുന്നതും ന്യായവിചാരണാസന്ദർഭവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: περὶ ὧν
  choice: ആരോപണങ്ങൾ
  rationale: ‘ഏതു കാര്യങ്ങളെക്കുറിച്ച്’ എന്ന ബന്ധവാക്യത്തിന്റെ ആശയം തുടർന്നുള്ള κατηγοροῦσιν സഹിതം മലയാളത്തിൽ സംക്ഷിപ്തമായും വ്യക്തമായും നൽകുന്നു.
- source_word: νυνὶ
  choice: ഇപ്പോൾ
  rationale: നിലവിലെ കുറ്റാരോപണത്തെ സൂചിപ്പിക്കുന്ന സമയക്രിയാവിശേഷണം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: κατηγοροῦσίν μου
  choice: അവർ എനിക്കെതിരെ ഉന്നയിക്കുന്ന ആരോപണങ്ങൾ
  rationale: നിയമപരമായ കുറ്റാരോപണത്തിന്റെ ഭാവം നിലനിർത്തിക്കൊണ്ട് വർത്തമാനകാല പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
