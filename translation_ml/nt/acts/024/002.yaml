id: ACT.24.2
reference: Acts 24:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κληθέντος δὲ αὐτοῦ ἤρξατο κατηγορεῖν ὁ Τέρτυλλος λέγων· Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ καὶ ⸀διορθωμάτων γινομένων τῷ ἔθνει τούτῳ διὰ τῆς σῆς προνοίας
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/002.yaml
  text: 'And when he had been summoned[a], Tertullus began to accuse him, saying: “Since through you we are enjoying much peace[b], and reforms are being brought to this nation through your foresight,”'
translation:
  language: ml
  text: 'അവനെ വിളിച്ചുവരുത്തിയപ്പോൾ തെർത്തുല്ലൊസ് അവനെതിരെ കുറ്റം ചുമത്തിത്തുടങ്ങി: “അങ്ങയിലൂടെ ഞങ്ങൾ ഏറെ സമാധാനം അനുഭവിക്കുകയും അങ്ങയുടെ ദീർഘവീക്ഷണത്താൽ[b] ഈ ജനതയ്ക്കായി പരിഷ്കാരങ്ങൾ[a] നടപ്പാകുകയും ചെയ്യുന്നതിനാൽ,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരിഷ്കാരങ്ങൾ’ എന്നതിന് ‘മെച്ചപ്പെടുത്തലുകൾ’ എന്നോ ‘തിരുത്തൽ നടപടികൾ’ എന്നോ പരിഭാഷപ്പെടുത്താം (διορθωμάτων).
    reason: lexical_alternative
  - marker: b
    text: ‘അങ്ങയുടെ ദീർഘവീക്ഷണത്താൽ’ എന്നതിന് ‘അങ്ങയുടെ മുൻകരുതലോടെയുള്ള പരിപാലനത്താൽ’ എന്നോ ‘അങ്ങയുടെ വിവേകപൂർവമായ ആസൂത്രണത്താൽ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് πρόνοια ഒരു ഭരണാധികാരിയുടെ മുൻകാഴ്ചയെയോ ഭരണനിർവഹണത്തെയോ സൂചിപ്പിക്കുന്നു; ദൈവിക പരിപാലനത്തെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθέντος δὲ αὐτοῦ
  choice: അവനെ വിളിച്ചുവരുത്തിയപ്പോൾ
  rationale: നിയമനടപടിയുടെ പശ്ചാത്തലത്തിൽ, പൗലൊസിനെ ന്യായാധിപന്റെ മുമ്പാകെ ഹാജരാക്കാൻ വിളിച്ചതാണെന്ന സാഹചര്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ genitive absolute-ന്റെ കാലസാഹചര്യവും നിലനിർത്തുന്നു.
- source_word: ἤρξατο κατηγορεῖν
  choice: കുറ്റം ചുമത്തിത്തുടങ്ങി
  rationale: ആരംഭത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയും നിയമപരമായ ആരോപണത്തിന്റെ ഭാവവും നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: ὁ Τέρτυλλος
  choice: തെർത്തുല്ലൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: Πολλῆς εἰρήνης τυγχάνοντες διὰ σοῦ
  choice: അങ്ങയിലൂടെ ഞങ്ങൾ ഏറെ സമാധാനം അനുഭവിക്കുകയും
  rationale: τυγχάνω + genitive ഇവിടെ ഒരു അവസ്ഥ അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അങ്ങ്’ തെർത്തുല്ലൊസിന്റെ ഔപചാരികവും മുഖസ്തുതിപരവുമായ അഭിസംബോധനയ്ക്ക് യോജിക്കുന്നു.
- source_word: διορθωμάτων γινομένων τῷ ἔθνει τούτῳ
  choice: ഈ ജനതയ്ക്കായി പരിഷ്കാരങ്ങൾ നടപ്പാകുകയും
  rationale: διόρθωμα എന്നത് തിരുത്തൽ നടപടികൾ, മെച്ചപ്പെടുത്തലുകൾ, പരിഷ്കാരങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാം. രാഷ്ട്രീയ-ഭരണപരമായ സന്ദർഭത്തിൽ ‘പരിഷ്കാരങ്ങൾ’ സ്വാഭാവികമാണ്; γινομένων എന്നതിന്റെ സംഭവിച്ചുകൊണ്ടിരിക്കുന്ന ഭാവം ‘നടപ്പാകുകയും’ നിലനിർത്തുന്നു.
- source_word: διὰ τῆς σῆς προνοίας
  choice: അങ്ങയുടെ ദീർഘവീക്ഷണത്താൽ
  rationale: πρόνοια ഇവിടെ ഒരു മനുഷ്യഭരണാധികാരിയുടെ മുൻകരുതലോടെയുള്ള ആസൂത്രണത്തെയും ഭരണപരമായ കരുതലിനെയും സൂചിപ്പിക്കുന്നു. ‘ദീർഘവീക്ഷണം’ ദൈവിക പരിപാലനം എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യഭരണാധികാരിയെക്കുറിച്ചുള്ള πρόνοια എന്ന പദത്തിന്റെ അർഥം
  choice: ദീർഘവീക്ഷണം
  alternative: പരിപാലനം; വിവേകപൂർവമായ മുൻകരുതൽ
  rationale: ഇവിടെ തെർത്തുല്ലൊസ് ഫെലിക്സിന്റെ ഭരണപരമായ മുൻകാഴ്ചയെ പ്രശംസിക്കുകയാണ്. ‘ദൈവപരിപാലനം’ എന്ന ദൈവശാസ്ത്രപരമായ ആശയം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ ഭരണസന്ദർഭം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഔപചാരികവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. തെർത്തുല്ലൊസിന്റെ ഭരണാധികാരിയോടുള്ള മുഖസ്തുതിപരമായ നിയമപ്രസംഗഭാവം ‘അങ്ങ്’ എന്ന ആദരസൂചക പ്രയോഗത്തിലൂടെ നിലനിർത്തി. ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ആശ്രിതവാക്യത്തിന്റെ അപൂർണത ഉദ്ദേശപൂർവം സൂക്ഷിച്ചു.
