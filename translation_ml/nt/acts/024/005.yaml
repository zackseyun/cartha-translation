id: ACT.24.5
reference: Acts 24:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα ⸀στάσεις πᾶσι τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε τῆς τῶν Ναζωραίων αἱρέσεως,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/005.yaml
  text: For we have found this man to be a plague, stirring up riots among all the Jews throughout the inhabited world, and also a ringleader of the sect of the Nazarenes,
translation:
  language: ml
  text: ഈ മനുഷ്യൻ ഒരു മഹാമാരിയാണെന്നും, ലോകമെമ്പാടുമുള്ള എല്ലാ യഹൂദന്മാരുടെയും ഇടയിൽ കലാപങ്ങൾ ഇളക്കിവിടുന്നവനാണെന്നും, നസറായരുടെ വിഭാഗത്തിന്റെ മുഖ്യനേതാവാണെന്നും ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιμόν
  choice: ഒരു മഹാമാരിപോലെ
  rationale: അക്ഷരാർഥത്തിൽ ‘മഹാമാരി/പകർച്ചവ്യാധി’; ഇവിടെ വ്യക്തിയെ സമൂഹത്തിന് അപകടകരമായ ശല്യമായി അധിക്ഷേപിക്കുന്ന രൂപകപ്രയോഗമായതിനാൽ അതിന്റെ ശക്തി നിലനിർത്തി.
- source_word: κινοῦντα στάσεις
  choice: കലാപങ്ങൾ ഇളക്കിവിടുന്നവൻ
  rationale: στάσεις എന്ന ബഹുവചനം രാഷ്ട്രീയ-സാമൂഹിക കലാപങ്ങളെയോ ലഹളകളെയോ സൂചിപ്പിക്കുന്നു; κινοῦντα പ്രേരിപ്പിക്കൽ/ഇളക്കിവിടൽ വ്യക്തമാക്കുന്നു.
- source_word: τῇ οἰκουμένῃ
  choice: ലോകമെങ്ങും
  rationale: റോമൻ അധീനതയിലുള്ള ‘വാസയോഗ്യലോകം’ എന്ന സമകാലീന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: πρωτοστάτην
  choice: ഒരു നേതാവ്
  rationale: മുൻനിരയിൽ നിൽക്കുന്നവൻ, മുഖ്യനേതാവ് എന്ന കുറ്റാരോപണത്തിന്റെ അർഥം നൽകുന്നു; അനിശ്ചിത ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ ‘ഒരു’ സ്വാഭാവികമായി ഉപയോഗിച്ചു.
- source_word: αἱρέσεως
  choice: വിഭാഗം
  rationale: ഇവിടെ ഒരു മതവിഭാഗം/കക്ഷി എന്ന നിഷ്പക്ഷ ചരിത്രാർഥം; പിൽക്കാലത്തെ ‘പാഷണ്ഡത’ എന്ന സാങ്കേതിക അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: Ναζωραίων
  choice: നസറായർ
  rationale: യേശുവിന്റെ അനുയായികളെ എതിരാളികൾ വിളിച്ചിരുന്ന കൂട്ടനാമം നിലനിർത്തുന്നു.
theological_decisions:
- issue: αἵρεσις എന്ന പദത്തിന്റെ മതശാസ്ത്രപരമായ നിറം
  choice: വിഭാഗം
  alternative: പാഷണ്ഡവിഭാഗം / മതഭേദം
  rationale: ഈ നിയമവാദത്തിലെ കുറ്റാരോപണം അവതരിപ്പിക്കുമ്പോൾ മൂലപദം നിർബന്ധമായി വ്യാജോപദേശത്തെ വിധിക്കുന്നില്ല; അതിനാൽ വിഭാഗീയമായ മുൻവിധി ഒഴിവാക്കി.
- issue: λοιμός എന്ന അധിക്ഷേപരൂപകം
  choice: മഹാമാരിപോലെ
  alternative: സമൂഹത്തിന് ഒരു ശല്യം
  rationale: മൂലത്തിലെ കടുത്ത രൂപകവും കുറ്റാരോപകന്റെ വാചാടോപവും മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കോടതിയിലെ ഔപചാരിക കുറ്റാരോപണത്തിന്റെ ഗൗരവം നിലനിർത്തിയ വിവർത്തനം. വാക്യാവസാനത്തിലെ കോമയ്ക്കു പകരം മലയാളത്തിൽ പൂർണ്ണവാക്യമായി അവസാനിപ്പിച്ചു; തുടർന്നുള്ള വാക്യബന്ധം സന്ദർഭത്തിൽ നിലനിൽക്കും.
