revisions:
- from: ഈ മനുഷ്യൻ ഒരു മഹാമാരിപോലെയാണെന്നും ലോകമെങ്ങുമുള്ള യഹൂദന്മാരുടെയിടയിൽ കലാപങ്ങൾ ഇളക്കിവിടുന്നവനാണെന്നും നസറായരുടെ വിഭാഗത്തിന്റെ ഒരു നേതാവാണെന്നും ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു.
  to: ഈ മനുഷ്യൻ ഒരു മഹാമാരിയാണെന്നും, ലോകമെമ്പാടുമുള്ള എല്ലാ യഹൂദന്മാരുടെയും ഇടയിൽ കലാപങ്ങൾ ഇളക്കിവിടുന്നവനാണെന്നും, നസറായരുടെ വിഭാഗത്തിന്റെ മുഖ്യനേതാവാണെന്നും ഞങ്ങൾ കണ്ടെത്തിയിരിക്കുന്നു.
  rationale: The revision explicitly includes ‘all,’ restores the force of the direct invective ‘a plague,’ and renders πρωτοστάτης as ‘chief leader.’ It retains the neutral historical sense of αἵρεσις as ‘group/sect’ and preserves the accusation’s formal courtroom register.
  reviewer_model: gpt-5.6-terra
