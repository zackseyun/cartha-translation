  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ ἡμέρας τινὰς παραγενόμενος ὁ Φῆλιξ σὺν Δρουσίλλῃ τῇ ⸀ἰδίᾳ γυναικὶ οὔσῃ Ἰουδαίᾳ μετεπέμψατο τὸν Παῦλον καὶ ἤκουσεν αὐτοῦ περὶ τῆς εἰς Χριστὸν ⸀Ἰησοῦν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/024.yaml
  text: After some days[a], Felix came with Drusilla, his own wife, who was Jewish[b], and sent for Paul and heard him concerning faith in Messiah Jesus.
translation:
  language: ml
  text: കുറെ ദിവസങ്ങൾക്കുശേഷം, ഫെലിക്സ് യഹൂദയായ തന്റെ ഭാര്യ ദ്രൂസില്ലയോടുകൂടെ വന്നു. അവൻ പൗലോസിനെ വിളിച്ചുവരുത്തി, മശീഹയായ യേശുവിലുള്ള വിശ്വാസത്തെക്കുറിച്ച് പൗലോസ് പറയുന്നതു കേട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശ്വാസം” എന്നതിന് “ആശ്രയം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ἡμέρας τινὰς
  choice: കുറെ ദിവസങ്ങൾക്കുശേഷം
  rationale: μετά + accusative എന്ന സമയപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. δέ ഇവിടെ ലഘുവായ ആഖ്യാനബന്ധകമായതിനാൽ പ്രത്യേക പദമായി ചേർത്തിട്ടില്ല.
- source_word: παραγενόμενος
  choice: വന്നു
  rationale: ഫെലിക്സിന്റെ വരവിനെ സൂചിപ്പിക്കുന്ന adverbial participle; സന്ദർഭത്തിൽ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: σὺν Δρουσίλλῃ τῇ ἰδίᾳ γυναικὶ
  choice: തന്റെ ഭാര്യ ദ്രൂസില്ലയോടുകൂടെ
  rationale: σύν accompaniment സൂചിപ്പിക്കുന്നു; ἰδίᾳയുടെ സ്വഭാവിക possessive ഊന്നൽ ‘തന്റെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: οὔσῃ Ἰουδαίᾳ
  choice: യഹൂദയായ
  rationale: ദ്രൂസില്ലയുടെ യഹൂദ തിരിച്ചറിയൽ സംക്ഷിപ്തവും ആധുനികവുമായ രീതിയിൽ വ്യക്തമാക്കുന്നു.
- source_word: μετεπέμψατο τὸν Παῦλον
  choice: പൗലോസിനെ വരുത്തി
  rationale: ആളയച്ച് വിളിപ്പിക്കുക എന്ന μεταπέμπομαιയുടെ സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἤκουσεν αὐτοῦ
  choice: അദ്ദേഹം പറയുന്നതു കേട്ടു
  rationale: ἀκούω + genitive ഇവിടെ പൗലോസിനെ കേൾക്കുക എന്നർഥം നൽകുന്നു; മലയാളത്തിൽ ആരാണ് സംസാരിച്ചതെന്ന ആശയക്കുഴപ്പം ഒഴിവാക്കുന്നു.
- source_word: περὶ τῆς εἰς Χριστὸν Ἰησοῦν πίστεως
  choice: മശീഹയായ യേശുവിലുള്ള വിശ്വാസത്തെക്കുറിച്ച്
  rationale: περί വിഷയം സൂചിപ്പിക്കുന്നു; πίστις + εἰς വിശ്വാസം യേശുവിലേക്കു ദിശാബദ്ധമാണെന്ന അർഥം നൽകുന്നു. Χριστός എന്ന പദത്തിന്റെ പദവിസ്വഭാവം ‘മശീഹയായ’ എന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστὸν Ἰησοῦν എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥം പരിഭാഷപ്പെടുത്തി; ‘മശീഹയായ യേശു’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ പദവിയും വ്യക്തിയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- issue: πίστις + εἰς എന്നതിന്റെ അർഥം
  choice: മശീഹയായ യേശുവിലുള്ള വിശ്വാസം
  alternative: മശീഹയായ യേശുവിലുള്ള ആശ്രയം
  rationale: εἰς + accusative വിശ്വാസം ആരിലേക്കാണ് ദിശാബദ്ധമെന്നു വ്യക്തമാക്കുന്നു. ‘വിശ്വാസം’ പ്രധാന പരിഭാഷയായി നിലനിർത്തി, πίστις എന്ന പദത്തിന്റെ ‘ആശ്രയം/വിശ്വാസംവെക്കൽ’ എന്ന സമീപ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി. ‘തന്റെ ഭാര്യ’ ἰδίᾳയുടെ ഊന്നൽ നിലനിർത്തുന്നു; ‘മശീഹയായ യേശു’ Χριστός എന്ന പദവിയുടെ അർഥം തുറന്നുകാട്ടുന്നു.
