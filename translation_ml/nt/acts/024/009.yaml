  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമസന്ദർഭം വ്യക്തമാക്കുന്നതിനൊപ്പം ഗ്രീക്കിലെ വാചികമായ എതിർനടപടിയുടെ ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു; ‘അവനോടൊപ്പം’ എന്നത് ഉടൻമുമ്പുള്ള തെർത്തുല്ലൊസിന്റെ ആരോപണവുമായി ബന്ധം സ്വാഭാവികമാക്കുന്നു.
