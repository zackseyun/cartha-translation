reference: Acts 24:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνεπέθεντο δὲ καὶ οἱ Ἰουδαῖοι φάσκοντες ταῦτα οὕτως ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/009.yaml
  text: And the Jews also joined in the charge[a], asserting that these things were so.
translation:
  language: ml
  text: യഹൂദന്മാരും കുറ്റാരോപണത്തിൽ പങ്കുചേർന്നു[a]; ഇവ അങ്ങനെയാണെന്ന് അവർ ഉറപ്പിച്ചുപറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഹൂദന്മാരും ആരോപണത്തെ പിന്തുണച്ചു; ഇവ അങ്ങനെയാണെന്ന് അവകാശപ്പെട്ടു.”
    reason: συνεπέθεντο എന്ന ക്രിയയ്ക്ക് എതിർവാദത്തിലോ ആരോപണത്തിലോ മറ്റുള്ളവരോടൊപ്പം ചേരുക, അതിനെ പിന്തുണയ്ക്കുക എന്ന അർഥമുണ്ട്. നിയമസന്ദർഭത്തിൽ ‘കുറ്റാരോപണത്തിൽ പങ്കുചേർന്നു’ എന്നതാണ് പ്രധാന പാഠത്തിലെ തിരഞ്ഞെടുപ്പ്.
lexical_decisions:
- source_word: συνεπέθεντο
  choice: അവനോടൊപ്പം കുറ്റാരോപണത്തിൽ ചേർന്നു
  rationale: συνεπιτίθεμαι എന്ന ക്രിയയ്ക്ക് മറ്റൊരാളോടൊപ്പം ആക്രമണത്തിലോ എതിർനടപടിയിലോ ചേരുക എന്ന ശക്തിയുണ്ട്. ഇവിടെ കോടതിസന്ദർഭമായതിനാൽ ശാരീരിക ആക്രമണം സൂചിപ്പിക്കാതെ തെർത്തുല്ലൊസിന്റെ കുറ്റാരോപണത്തെ പിന്തുണച്ച് അതിൽ പങ്കുചേർന്നതെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δὲ καὶ
  choice: -ഉം
  rationale: δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; καί യഹൂദന്മാരും ഇതിനകം നടന്നുകൊണ്ടിരുന്ന ആരോപണത്തിൽ പങ്കുചേർന്നുവെന്ന് സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഉം’ ഈ കൂട്ടിച്ചേർക്കൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യഹൂദന്മാർ
  rationale: ഇവിടെ വിചാരണയിൽ സന്നിഹിതരായി ആരോപണത്തെ പിന്തുണച്ച യഹൂദസംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്നതിനെക്കാൾ ‘യഹൂദന്മാർ’ സന്ദർഭോചിതമാണ്.
- source_word: φάσκοντες
  choice: ഉറപ്പിച്ചുപറഞ്ഞു
  rationale: φάσκω ഇവിടെ ആരോപണങ്ങൾ സത്യമാണെന്ന് ദൃഢമായി പ്രസ്താവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഉറപ്പിച്ചുപറഞ്ഞു’ നിയമസന്ദർഭത്തിലെ ശക്തി നിലനിർത്തുന്നു; അവരുടെ വാക്കുകളുടെ സത്യാസത്യത്തെ വിവർത്തനം തന്നെ വിധിക്കുന്നില്ല.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുമ്പ് ഉന്നയിച്ച എല്ലാ ആരോപണങ്ങളിലേക്കും വിശാലമായി തിരിച്ചുചൂണ്ടുന്നു. ‘ഈ കുറ്റങ്ങൾ’ എന്നത് സാധ്യമെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: οὕτως ἔχειν
  choice: അങ്ങനെതന്നെയാണെന്ന്
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം ‘കാര്യങ്ങൾ അങ്ങനെതന്നെയാണ്’ അഥവാ ‘അത് അങ്ങനെ തന്നെയാണ്’ എന്നതാണ്; അക്ഷരാർഥത്തിലുള്ള ‘ഉണ്ടായിരിക്കുക/കൈവശംവയ്ക്കുക’ ഇവിടെ തെറ്റിദ്ധരിപ്പിക്കും.
