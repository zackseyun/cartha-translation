id: ACT.24.1
reference: Acts 24:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μετὰ δὲ πέντε ἡμέρας κατέβη ὁ ἀρχιερεὺς Ἁνανίας μετὰ ⸂πρεσβυτέρων τινῶν⸃ καὶ ῥήτορος Τερτύλλου τινός, οἵτινες ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/001.yaml
  text: After five days[a], the high priest Ananias came down with some elders and a certain orator named Tertullus, and they brought charges against Paul before the governor.
translation:
  language: ml
  text: അഞ്ചു ദിവസം കഴിഞ്ഞ് മഹാപുരോഹിതനായ അനന്യാസ് ചില മൂപ്പന്മാരെയും തെർത്തുല്ലൊസ് എന്നു പേരുള്ള ഒരു വാഗ്മിയെയും[a] കൂട്ടിക്കൊണ്ട് ഇറങ്ങിവന്നു. അവർ ഗവർണറുടെ മുമ്പാകെ പൗലൊസിനെതിരെ കുറ്റങ്ങൾ ഉന്നയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “തെർത്തുല്ലൊസ് എന്നു പേരുള്ള ഒരു നിയമവക്താവ്” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കുപദം പൊതുപ്രസംഗകനെയോ നിയമപരമായി മറ്റൊരാളുടെ പക്ഷം അവതരിപ്പിക്കുന്ന വക്താവിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ πέντε ἡμέρας
  choice: അഞ്ചു ദിവസം കഴിഞ്ഞ്
  rationale: μετά + accusative കഴിഞ്ഞുപോയ സമയത്തെ സൂചിപ്പിക്കുന്നു. δέയുടെ ലഘുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ വാക്യക്രമത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατέβη
  choice: ഇറങ്ങിവന്നു
  rationale: യെരൂശലേമിൽനിന്ന് കൈസര്യയിലേക്കുള്ള യാത്രയുടെ ദിശാസൂചനയായ ‘താഴേക്ക് വരുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἀρχιερεὺς Ἁνανίας
  choice: മഹാപുരോഹിതനായ അനന്യാസ്
  rationale: യഹൂദ മഹാപുരോഹിതന്റെ ഔദ്യോഗിക പദവിയും വ്യക്തിനാമവും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: μετὰ πρεσβυτέρων τινῶν
  choice: ചില മൂപ്പന്മാരോടുംകൂടെ
  rationale: πρεσβύτεροι ഇവിടെ യഹൂദ നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; τινῶν എന്ന അനിശ്ചിതത്വം ‘ചില’ എന്നു നിലനിർത്തുന്നു.
- source_word: ῥήτορος Τερτύλλου τινός
  choice: തെർത്തുല്ലൊസ് എന്നു പേരുള്ള ഒരു വാഗ്മിയോടുംകൂടെ
  rationale: ῥήτωρ പൊതുപ്രസംഗകനെയോ നിയമപരമായ വക്താവിനെയോ സൂചിപ്പിക്കാം. ‘വാഗ്മി’ അടിസ്ഥാന പദാർഥം നിലനിർത്തുന്നു; നിയമസന്ദർഭത്തിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐνεφάνισαν τῷ ἡγεμόνι κατὰ τοῦ Παύλου
  choice: അവർ ഗവർണറുടെ മുമ്പാകെ പൗലൊസിനെതിരെ കുറ്റങ്ങൾ ഉന്നയിച്ചു
  rationale: ἐμφανίζωയുടെ ഔപചാരിക-നിയമപരമായ അർഥവും κατά + genitive ന്റെ വിരുദ്ധതയും സ്വാഭാവിക മലയാള നിയമപ്രയോഗത്തിൽ അവതരിപ്പിക്കുന്നു.
