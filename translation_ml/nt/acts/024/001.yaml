translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. യഹൂദ നേതൃത്വപദവിയും റോമൻ ഭരണപദവിയും വേർതിരിച്ച് വ്യക്തമാക്കുന്നു; നിയമസന്ദർഭത്തിലെ ῥήτωρ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
