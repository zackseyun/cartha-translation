  yaml_path: translation/nt/acts/024/015.yaml
  text: having hope in God—which these men themselves also accept—that there is going to be a resurrection of both the righteous and the unrighteous[a].
translation:
  language: ml
  text: ദൈവത്തിൽ പ്രത്യാശ വെച്ചുകൊണ്ട്—ഈ ആളുകൾതന്നെയും അതു പ്രതീക്ഷയോടെ കാത്തിരിക്കുന്നു[a]—നീതിമാന്മാരുടെയും അനീതിമാന്മാരുടെയും പുനരുത്ഥാനം ഉണ്ടാകാനിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ആളുകൾതന്നെയും അതു അംഗീകരിക്കുന്നു.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ക്രിയയ്ക്ക് ‘പ്രതീക്ഷയോടെ കാത്തിരിക്കുക’ എന്നും ‘അംഗീകരിക്കുക’ എന്നും അർഥമാകാം; ഈ സന്ദർഭത്തിൽ പങ്കിട്ട പ്രത്യാശയെ കാത്തിരിക്കുന്നതാണു കൂടുതൽ സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδα ἔχων εἰς τὸν θεόν
  choice: ദൈവത്തിൽ പ്രത്യാശ വെച്ചുകൊണ്ട്
  rationale: പ്രത്യാശയുടെ ദിശയും ആശ്രയവും ദൈവമാണെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നാമപദമായ ἐλπίς-ന്റെ ഭാവവും പങ്കാളിക്രിയയുടെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἣν καὶ αὐτοὶ οὗτοι προσδέχονται
  choice: ഈ മനുഷ്യരും അതേ പ്രത്യാശ അംഗീകരിക്കുന്നു
  rationale: ἣν എന്നത് മുൻപുള്ള ‘പ്രത്യാശ’യിലേക്കാണ് ചൂണ്ടുന്നത്. καὶ, αὐτοὶ, οὗτοι എന്നിവയിലെ പങ്കിട്ട നിലപാടും സന്നിഹിതരായ എതിരാളികളിലേക്കുള്ള സൂചനയും ‘ഈ മനുഷ്യരും’ എന്നതിലൂടെ കൈവരുന്നു. προσδέχονται എന്നതിലെ ‘കാത്തിരിക്കുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀνάστασιν μέλλειν ἔσεσθαι
  choice: ഒരു പുനരുത്ഥാനം ഉണ്ടാകാൻ പോകുന്നു
  rationale: μέλλειν ἔσεσθαι എന്ന ഭാവികാലാഭിമുഖ്യം ലളിതമായ ‘ഉണ്ടാകും’ എന്നതിലുപരി പ്രകടമാക്കുന്നു; അനാവശ്യമായ അടിയന്തരത സൂചിപ്പിക്കാതെ ഭാവിനിശ്ചയം അറിയിക്കുന്നു.
- source_word: δικαίων τε καὶ ἀδίκων
  choice: നീതിമാന്മാർക്കും അനീതിമാന്മാർക്കും
  rationale: τε καὶ സൂചിപ്പിക്കുന്ന ഇരുകൂട്ടരുടെയും ഉൾപ്പെടുത്തൽ സ്വാഭാവികമായ മലയാള സമുച്ചയഘടനയിൽ നിലനിർത്തുകയും ഗ്രീക്കിലെ ധാർമ്മിക വൈരുധ്യം കൃത്യമായി പകരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ പരിധി
  choice: നീതിമാന്മാരും അനീതിമാന്മാരും ഉൾപ്പെടുന്ന ഒരു പുനരുത്ഥാനം
  alternative: ധാർമ്മിക വേർതിരിവ് എടുത്തുകാട്ടാത്ത പൊതുപുനരുത്ഥാനം
  rationale: ഗ്രീക്ക് പാഠം നീതിമാന്മാരെയും അനീതിമാന്മാരെയും വ്യക്തമായി പരാമർശിക്കുന്നു. സമയക്രമം, ന്യായവിധിയുടെ ഘട്ടങ്ങൾ തുടങ്ങിയ പിന്നീടുള്ള വ്യവസ്ഥിത ദൈവശാസ്ത്ര വിശദീകരണങ്ങൾ ചേർക്കാതെ ഈ വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: പ്രത്യാശയുടെ ഉള്ളടക്കം സൂചിപ്പിക്കുന്ന ὅτι ആശയം മലയാളത്തിൽ വ്യക്തമാക്കൽ
  choice: ‘എന്നു ഞാൻ വിശ്വസിക്കുന്നു’ എന്നു ചേർത്ത് വാക്യബന്ധം സ്വാഭാവികമാക്കൽ
  alternative: ‘എന്ന പ്രത്യാശ’ എന്ന് നേരിട്ട് പുനരുക്തി ചെയ്യൽ
  rationale: മലയാളത്തിൽ വാക്യം സ്വതന്ത്രമായി വായിക്കുമ്പോൾ പ്രത്യാശയുടെ ഉള്ളടക്കം വ്യക്തമായി ബന്ധിപ്പിക്കാനാണ് ഈ രൂപം; എന്നാൽ ‘വിശ്വസിക്കുന്നു’ എന്ന ക്രിയ ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്തതിനാൽ കൂടുതൽ ഔപചാരികമായ രൂപമായി ‘എന്ന പ്രത്യാശ’ പരിഗണിക്കാവുന്നതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പുനരുത്ഥാനം’, ‘നീതിമാൻ’, ‘അനീതിമാൻ’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. ഇടയ്ക്കുള്ള ഡാഷ് ഘടന മൂലപാഠത്തിലെ ബന്ധവാക്യത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
