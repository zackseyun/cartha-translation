translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, കോടതിസന്ദർഭത്തിന് യോജിച്ച മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ ἔδει സൂചിപ്പിക്കുന്ന നിറവേറാത്ത ബാധ്യതയും ἔχοιεν എന്ന രൂപത്തിലെ സാദ്ധ്യതാഭാവവും ഭൂതകാല നിബന്ധനയായി നിലനിർത്തിയിരിക്കുന്നു.
