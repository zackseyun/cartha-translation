id: ACT.24.19
reference: Acts 24:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τινὲς δὲ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι, οὓς ⸀ἔδει ἐπὶ σοῦ παρεῖναι καὶ κατηγορεῖν εἴ τι ἔχοιεν πρὸς ⸀ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/019.yaml
  text: But there are some Jews from Asia who ought to have been present before you and to accuse me[b][a], if they had anything against me.
translation:
  language: ml
  text: എന്നാൽ ഏഷ്യയിൽനിന്നുള്ള[a] ചില യഹൂദന്മാർ ഉണ്ട്. എനിക്കെതിരെ എന്തെങ്കിലും ഉണ്ടായിരുന്നെങ്കിൽ, അവർ അങ്ങയുടെ മുമ്പാകെ ഹാജരായി എന്നെ കുറ്റപ്പെടുത്തേണ്ടതായിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ഏഷ്യ” എന്നു പറയുന്നത് ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിലെ റോമൻ പ്രവിശ്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “എനിക്കെതിരെ കുറ്റാരോപണം ഉന്നയിക്കേണ്ടതായിരുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: ചില
  rationale: വ്യക്തമായി തിരിച്ചറിയിക്കാത്ത ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἀπὸ τῆς Ἀσίας
  choice: ഏഷ്യയിൽനിന്നുള്ള
  rationale: മൂലത്തിലെ സ്ഥലനാമം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് റോമൻ പ്രവിശ്യയാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἰουδαῖοι
  choice: യഹൂദന്മാർ
  rationale: ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും മാന്യവുമായ മലയാളപദം.
- source_word: ἔδει
  choice: കുറ്റപ്പെടുത്തേണ്ടതായിരുന്നു
  rationale: നിയമപരമായ സാഹചര്യത്തിൽ ചെയ്യേണ്ടിയിരുന്നെങ്കിലും ചെയ്യപ്പെടാതെ പോയ കടമയെ അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്നതിനാൽ ‘വേണ്ടതായിരുന്നു’ എന്നു നൽകി.
- source_word: ἐπὶ σοῦ παρεῖναι
  choice: അങ്ങയുടെ മുമ്പാകെ ഹാജരായി
  rationale: ന്യായാധികാരിയുടെ സന്നിധിയിൽ ഔദ്യോഗികമായി ഹാജരാകുക എന്ന നിയമസന്ദർഭത്തിലെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατηγορεῖν
  choice: എന്നെ കുറ്റപ്പെടുത്തുക
  rationale: നിയമപരമായി കുറ്റം ആരോപിക്കുക എന്ന അർഥം നേരിട്ടും വായനാസൗകര്യത്തോടെയും നൽകുന്നു.
- source_word: εἴ τι ἔχοιεν πρὸς ἐμέ
  choice: എനിക്കെതിരെ എന്തെങ്കിലും ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: സാധ്യതയും നിബന്ധനാഭാവവും നിലനിർത്തുകയും ‘കുറ്റം’ എന്ന് അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
