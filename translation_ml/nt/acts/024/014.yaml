id: ACT.24.14
reference: Acts 24:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμολογῶ δὲ τοῦτό σοι ὅτι κατὰ τὴν ὁδὸν ἣν λέγουσιν αἵρεσιν οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ ⸂τοῖς ἐν⸃ τοῖς προφήταις γεγραμμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/014.yaml
  text: But I confess this to you[a], that according to the Way, which they call a sect, so I worship the God of our fathers, believing everything written in the Law and in the Prophets[b],
translation:
  language: ml
  text: 'എന്നാൽ ഒരു കാര്യം ഞാൻ അങ്ങയോടു തുറന്നു സമ്മതിക്കുന്നു: അവർ ഒരു മതവിഭാഗം[a] എന്നു വിളിക്കുന്ന മാർഗം അനുസരിച്ചാണ് ഞാൻ പിതാക്കന്മാരുടെ ദൈവത്തെ[b] ആരാധിക്കുന്നത്. ന്യായപ്രമാണത്തിലുള്ളതും പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളിൽ എഴുതിയിരിക്കുന്നതുമായ സകലവും ഞാൻ വിശ്വസിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കക്ഷി’. ഗ്രീക്ക് പദത്തിന് ഒരു വിഭാഗം, കക്ഷി എന്നീ അർഥങ്ങൾ വരാം; പിൽക്കാലത്തെ സാങ്കേതിക അർഥത്തിലുള്ള ‘വേദവിരുദ്ധമതം’ ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘പൈതൃകമായ ദൈവം’; ഇസ്രായേലിന്റെ പിതാക്കന്മാർ ആരാധിച്ച ദൈവമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογῶ
  choice: തുറന്നു സമ്മതിക്കുന്നു
  rationale: ഫേലിക്സിന്റെ മുമ്പിൽ പൗലോസ് പരസ്യമായി അംഗീകരിച്ചുപറയുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം. ‘തുറന്നു സമ്മതിക്കുന്നു’ എന്നത് കുറ്റസമ്മതം എന്ന അനാവശ്യ ധ്വനി കുറച്ചുകൊണ്ട് ഔപചാരികമായ പ്രസ്താവനയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν ὁδόν
  choice: മാർഗം അനുസരിച്ച്
  rationale: പ്രവൃത്തികളിൽ ആദിമ ക്രിസ്തീയ പ്രസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യേക നാമമാണ് ‘മാർഗം’. κατά ആ മാർഗത്തോടുള്ള അനുരൂപതയെയോ പിന്തുടർച്ചയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: αἵρεσιν
  choice: മതവിഭാഗം
  rationale: ഇവിടെ ഈ പദം ഒരു വിഭാഗത്തെയോ കക്ഷിയെയോ സൂചിപ്പിക്കുന്നു; പിൽക്കാലത്തെ സാങ്കേതിക അർഥത്തിലുള്ള ‘വേദവിരുദ്ധ ഉപദേശം’ എന്ന ആശയം നിർബന്ധിക്കുന്നില്ല.
- source_word: λατρεύω
  choice: ആരാധിക്കുന്നു
  rationale: ദൈവത്തിനു നൽകുന്ന മതപരമായ സേവനവും ആരാധനയും ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ πατρῴῳ θεῷ
  choice: പിതാക്കന്മാരുടെ ദൈവത്തെ
  rationale: ഇസ്രായേലിന്റെ പൂർവികർ ആരാധിച്ച ദൈവത്തോടുള്ള തുടർച്ച വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; ഗ്രീക്കിലെ വിശേഷണപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πᾶσι τοῖς ... γεγραμμένοις
  choice: എഴുതിയിരിക്കുന്നതുമായ സകലവും
  rationale: എഴുതപ്പെട്ട് നിലനിൽക്കുന്ന കാര്യങ്ങളുടെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις
  choice: ന്യായപ്രമാണത്തിലുള്ളതും പ്രവാചകന്മാരുടെ ഗ്രന്ഥങ്ങളിൽ എഴുതിയിരിക്കുന്നതുമായ
  rationale: യഹൂദ തിരുവെഴുത്തുകളുടെ ‘ന്യായപ്രമാണം’, ‘പ്രവാചകന്മാർ’ എന്നീ വിഭാഗങ്ങളെ നിലനിർത്തുകയും മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യഹൂദവിശ്വാസത്തോടും ‘മാർഗം’ എന്ന പ്രസ്ഥാനത്തോടുമുള്ള പൗലോസിന്റെ ബന്ധം
  choice: ‘മാർഗം’ അനുസരിച്ചുള്ള തന്റെ ആരാധന പിതാക്കന്മാരുടെ ദൈവത്തോടും ന്യായപ്രമാണത്തോടും പ്രവാചകന്മാരോടും തുടർച്ചയിലാണെന്ന് പൗലോസ് അവതരിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്തു.
  alternative: ‘മാർഗം’ യഹൂദമതത്തിൽനിന്ന് പൂർണമായി വേർപെട്ട മറ്റൊരു മതമാണെന്ന ആശയം വിവർത്തനത്തിൽ ചേർക്കുക.
  rationale: മൂലവാക്യം ഒരേസമയം എതിരാളികളുടെ ‘വിഭാഗം’ എന്ന വിശേഷണവും പൗലോസിന്റെ പൂർവികവിശ്വാസത്തോടുള്ള തുടർച്ചാവകാശവാദവും നിലനിർത്തുന്നു; ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം ഉപയോഗിച്ചു. ന്യായാധിപനായ ഫേലിക്സിനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങയോടു’ എന്ന ആദരരൂപം സ്വീകരിച്ചു. ‘മാർഗം’ പ്രത്യേക ചരിത്രനാമമാണെന്ന ഭാവം നിലനിർത്തി; വാക്യം മലയാളത്തിൽ ഭാരമേറാതിരിക്കാൻ രണ്ടു വാക്യങ്ങളാക്കി.
