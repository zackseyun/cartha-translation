id: ACT.24.25
reference: Acts 24:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διαλεγομένου δὲ αὐτοῦ περὶ δικαιοσύνης καὶ ἐγκρατείας καὶ τοῦ κρίματος τοῦ ⸀μέλλοντος ἔμφοβος γενόμενος ὁ Φῆλιξ ἀπεκρίθη· Τὸ νῦν ἔχον πορεύου, καιρὸν δὲ μεταλαβὼν μετακαλέσομαί σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/025.yaml
  text: But as he was discussing righteousness and self-control and the coming judgment, Felix became afraid and answered, “For now, go away. When I get an opportunity, I will summon you.”
translation:
  language: ml
  text: 'എന്നാൽ നീതിയെയും ആത്മനിയന്ത്രണത്തെയും വരാനിരിക്കുന്ന ന്യായവിധിയെയും കുറിച്ച് പൗലോസ് സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ, ഫെലിക്സ് ഭയപ്പെട്ട് മറുപടി പറഞ്ഞു: “ഇപ്പോൾ നീ പൊയ്ക്കൊള്ളുക. അവസരം ലഭിക്കുമ്പോൾ ഞാൻ നിന്നെ വിളിച്ചുവരുത്തും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαλεγομένου
  choice: സംസാരിച്ചുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: സംവാദം നടത്തുക, കാര്യങ്ങൾ വിശദമായി ചർച്ച ചെയ്യുക എന്ന ആശയം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: ധാർമികമായ ശരിത്വവും നീതിയും ഉൾക്കൊള്ളുന്ന സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ പദം.
- source_word: ἐγκρατείας
  choice: ആത്മനിയന്ത്രണം
  rationale: സ്വന്തം ആഗ്രഹങ്ങളെയും പ്രവൃത്തികളെയും നിയന്ത്രിക്കുന്നതെന്ന ഗ്രീക്ക് അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τοῦ κρίματος τοῦ μέλλοντος
  choice: വരാനിരിക്കുന്ന ന്യായവിധി
  rationale: μέλλοντος എന്ന ഭാവിസൂചനയും κρίμα എന്ന വിധിനിർണയ ആശയവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἔμφοβος γενόμενος
  choice: ഭയപ്പെട്ട്
  rationale: ഫേലിക്സ് ഭയഭീതനായിത്തീർന്നതിനെ ലളിതവും ശക്തവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Τὸ νῦν ἔχον
  choice: ഇപ്പോൾ
  rationale: ‘ഇപ്പോഴത്തെ സാഹചര്യത്തിൽ/തൽക്കാലത്തേക്ക്’ എന്ന ഇടിയത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καιρὸν ... μεταλαβὼν
  choice: അവസരം കിട്ടുമ്പോൾ
  rationale: അനുകൂലമായ സമയം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: μετακαλέσομαί
  choice: വീണ്ടും വിളിപ്പിക്കാം
  rationale: സ്വന്തം അടുക്കലേക്ക് പിന്നീടു വിളിച്ചുവരുത്തുമെന്ന അർത്ഥം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘നീതി’ എന്നതിന്റെ പരിധി
  choice: നീതി
  alternative: നീതീകരണം
  rationale: ഇവിടെ δικαιοσύνη ധാർമിക നീതിയെയോ ശരിയായ ജീവിതത്തെയോ സൂചിപ്പിക്കാം; ‘നീതീകരണം’ എന്ന് നൽകിയാൽ പൗലോസിന്റെ സാങ്കേതിക രക്ഷാശാസ്ത്രപരമായ അർത്ഥം അനാവശ്യമായി നിർബന്ധിതമാകും.
- issue: വരാനിരിക്കുന്ന വിധിയുടെ സ്വഭാവം
  choice: വരാനിരിക്കുന്ന ന്യായവിധി
  alternative: അന്ത്യന്യായവിധി
  rationale: മൂലപാഠം വിധി വരാനിരിക്കുന്നതാണെന്ന് പറയുന്നു; അതിനെ ‘അന്ത്യ’ എന്ന് കൂടുതൽ നിർവചിക്കാതെ യഥാർഥമായ തുറന്ന നില നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പൊയ്ക്കൊള്ളുക’ അധികം പ്രാചീനമാകാതെ അധികാരമുള്ള വിടവാങ്ങൽ നിർദേശം പ്രകടിപ്പിക്കുന്നു; വാക്യക്രമം ഗ്രീക്ക് ആശയക്രമം മിക്കവാറും നിലനിർത്തുന്നു.
