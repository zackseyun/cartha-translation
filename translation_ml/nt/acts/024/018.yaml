lexical_decisions:
- source_word: ἐν αἷς
  choice: ഈ കാര്യങ്ങൾക്കിടയിലാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സംഭവങ്ങളിലേക്കുള്ള സ്ത്രീലിംഗ ബഹുവചന ആപേക്ഷികപ്രയോഗത്തിന്റെ സൂചന നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം നൽകുന്നു; ‘അവയിൽ’ എന്ന കൂടുതൽ പദാനുപദ രൂപത്തേക്കാൾ സന്ദർഭബന്ധം വ്യക്തമാണ്.
- source_word: εὗρόν με
  choice: അവർ എന്നെ ... കണ്ടത്
  rationale: ഇവിടെ εὑρίσκω എന്നത് ദേവാലയത്തിൽ പൗലോസിനെ കണ്ടുമുട്ടിയതിനെ സൂചിപ്പിക്കുന്നു; ‘കണ്ടെത്തി’ എന്നത് അന്വേഷണത്തിനുശേഷമുള്ള കണ്ടെത്തൽ എന്ന അനാവശ്യ ധ്വനി നൽകാം.
- source_word: ἡγνισμένον
  choice: ആചാരപരമായി ശുദ്ധീകരിക്കപ്പെട്ട നിലയിൽ
  rationale: പൂർണ്ണ നിഷ്ക്രിയ കൃദന്തരൂപം പൂർത്തിയായ ശുദ്ധീകരണത്തിന്റെ തുടർന്നുനിൽക്കുന്ന അവസ്ഥയും യഹൂദ ആചാരശുദ്ധിയുടെ പശ്ചാത്തലവും പ്രകടമാക്കുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: ἱερόν ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സാധാരണ ബൈബിൾപ്രയോഗമായ ‘ദേവാലയം’ അനാവശ്യമായി അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: οὐ μετὰ ὄχλου
  choice: എന്നോടൊപ്പം ജനക്കൂട്ടമോ ... ഉണ്ടായിരുന്നില്ല
  rationale: μετάയുടെ സഹവർത്തിത്വാർഥവും ὄχλος എന്നതിന്റെ നിഷ്പക്ഷമായ ‘ജനക്കൂട്ടം’ എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘കലാപക്കൂട്ടം’ എന്ന് അതിശയിപ്പിക്കുന്നില്ല.
- source_word: οὐδὲ μετὰ θορύβου
  choice: ബഹളമോ ഉണ്ടായിരുന്നില്ല
  rationale: θόρυβος സൂചിപ്പിക്കുന്ന പൊതു കോലാഹലമോ ക്രമക്കേടോ ‘ബഹളം’ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἡγνισμένον എന്ന പദത്തിന്റെ ആചാരപരമായ അർഥം
  choice: ആചാരപരമായി ശുദ്ധീകരിക്കപ്പെട്ട നിലയിൽ
  alternative: ശുദ്ധീകരിക്കപ്പെട്ട നിലയിൽ
  rationale: സന്ദർഭം യഹൂദ ശുദ്ധീകരണാചാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആചാരപരമായി’ എന്നത് നൈതിക പാപരഹിതത്വമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ നിയമവാദശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ തുടർന്നുവരുന്ന വാക്യഘടന സൂചിപ്പിക്കാൻ അവസാനം പൂർണ്ണവിരാമത്തിന് പകരം വാക്യം സ്വതന്ത്രമായി വായിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി; ജനക്കൂട്ടവും ബഹളവും പൗലോസിനോടൊപ്പമില്ലായിരുന്നുവെന്ന നിഷേധം വ്യക്തമായി നിലനിർത്തി.
