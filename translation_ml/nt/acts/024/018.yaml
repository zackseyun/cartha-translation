revisions:
- from: ഈ കാര്യങ്ങൾക്കിടയിലാണ് അവർ എന്നെ ആചാരപരമായി ശുദ്ധീകരിക്കപ്പെട്ട നിലയിൽ ദേവാലയത്തിൽ കണ്ടത്[a]—എന്നോടൊപ്പം ജനക്കൂട്ടമോ ബഹളമോ ഉണ്ടായിരുന്നില്ല.
  to: ഈ കാര്യങ്ങളിലാണു അവർ എന്നെ ദേവാലയത്തിൽ ആചാരപരമായി ശുദ്ധീകരിക്കപ്പെട്ട നിലയിൽ, ജനക്കൂട്ടമോ ബഹളമോ കൂടാതെ, കണ്ടത്[a].
  rationale: The revision uses a more direct Malayalam equivalent for ἐν αἷς and places ‘ജനക്കൂട്ടമോ ബഹളമോ കൂടാതെ’ with the act of finding Paul, preserving both Greek negations naturally. The explicit ritual nuance of the perfect passive participle is retained. The sole footnote remains correctly anchored to the relative phrase and has been adjusted to match the revised word order.
