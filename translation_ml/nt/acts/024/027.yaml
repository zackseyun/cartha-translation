id: ACT.24.27
reference: Acts 24:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διετίας δὲ πληρωθείσης ἔλαβεν διάδοχον ὁ Φῆλιξ Πόρκιον Φῆστον· θέλων τε ⸀χάριτα καταθέσθαι τοῖς Ἰουδαίοις ὁ Φῆλιξ κατέλιπε τὸν Παῦλον δεδεμένον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/027.yaml
  text: But when two years had been completed[a], Felix was succeeded by Porcius Festus; and because Felix wanted to lay up favor with the Jews, he left Paul bound.
translation:
  language: ml
  text: എന്നാൽ രണ്ടു വർഷം തികഞ്ഞപ്പോൾ ഫെലിക്സിന്റെ പിൻഗാമിയായി പോർക്കിയോസ് ഫെസ്തോസ് വന്നു. യെഹൂദരുടെ പ്രീതി സമ്പാദിക്കാൻ[a] ആഗ്രഹിച്ച ഫെലിക്സ് പൗലോസിനെ ബന്ധിതനായിത്തന്നെ വിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദർക്ക് ഒരു ഉപകാരം ചെയ്യാൻ.” ഗ്രീക്ക് പ്രയോഗത്തിന് അവരുടെ പ്രീതി നേടുക എന്നും അവർക്കൊരു ഉപകാരം ചെയ്യുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διετίας δὲ πληρωθείσης
  choice: എന്നാൽ രണ്ടു വർഷം തികഞ്ഞപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. πληρωθείσης എന്നതിന്റെ ‘തികയുക’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔλαβεν διάδοχον
  choice: ഫെലിക്സിന്റെ പിൻഗാമിയായി ... വന്നു
  rationale: അക്ഷരാർഥത്തിൽ ‘പിൻഗാമിയെ ലഭിച്ചു’ എന്നാണെങ്കിലും, അധികാരമാറ്റം സ്വാഭാവികമായി വ്യക്തമാക്കുന്ന മലയാളപ്രയോഗമാണിത്.
- source_word: Πόρκιον Φῆστον
  choice: പോർക്കിയോസ് ഫെസ്തോസ്
  rationale: ഗ്രീക്ക് രൂപങ്ങളോട് ചേർന്നുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: θέλων
  choice: ആഗ്രഹിച്ച
  rationale: പ്രധാന പ്രവൃത്തിക്കു പിന്നിലെ ഫെലിക്സിന്റെ ഉദ്ദേശ്യം പങ്കാളിപദപ്രയോഗത്തിലൂടെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: χάριτα καταθέσθαι τοῖς Ἰουδαίοις
  choice: യെഹൂദരുടെ പ്രീതി സമ്പാദിക്കാൻ
  rationale: പ്രയോഗം യെഹൂദരുടെ അനുകൂല മനോഭാവം നേടുക എന്ന സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ‘അവർക്കൊരു ഉപകാരം ചെയ്യുക’ എന്ന സാദ്ധ്യമായ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κατέλιπε
  choice: വിട്ടു
  rationale: സ്ഥാനമൊഴിയുമ്പോൾ പൗലോസിനെ നിലവിലുണ്ടായിരുന്ന അവസ്ഥയിൽ തുടരാൻ വിട്ടുവെന്ന അർഥം ലളിതമായി നൽകുന്നു.
- source_word: δεδεμένον
  choice: ബന്ധിതനായിത്തന്നെ
  rationale: പെർഫെക്റ്റ് പാസീവ് പാർട്ടിസിപ്പിൾ സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന ബന്ധിതാവസ്ഥ നിലനിർത്തുന്നു; ‘ചങ്ങലയിൽ’ എന്നതിനെക്കാൾ കുറച്ച് നിർദിഷ്ടവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
theological_decisions:
- issue: χάριτα καταθέσθαι എന്ന പ്രയോഗത്തിലെ അർഥവ്യാപ്തി
  choice: യെഹൂദരുടെ പ്രീതി സമ്പാദിക്കാൻ
  alternative: യെഹൂദർക്ക് ഒരു ഉപകാരം ചെയ്യാൻ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് അവരുടെ സന്മനസ്സ് നേടുക എന്നും അവർക്കൊരു അനുകൂല പ്രവൃത്തി ചെയ്യുക എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ ആദ്യ അർഥം നൽകി മറ്റേത് അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘ബന്ധിതനായിത്തന്നെ’ എന്ന രൂപം പൗലോസിന്റെ അവസ്ഥ തുടർന്നുവെന്ന ഊന്നൽ സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചേരേണ്ട സ്ഥാനമായ χάριτα καταθέσθαι എന്ന പ്രയോഗത്തോടാണ് [a] അടയാളം ചേർത്തിരിക്കുന്നത്.
