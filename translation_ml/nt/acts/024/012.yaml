  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ കോടതിയിലെ പൗലോസിന്റെ പ്രതിവാദത്തിന് യോജിച്ച മാന്യമായ ഭാഷ. ആവർത്തിച്ച οὔτε ഘടന മലയാളത്തിൽ അർഥവ്യക്തതയ്ക്കായി അർദ്ധവിരാമവും ‘അങ്ങനെ കണ്ടിട്ടില്ല’ എന്ന പുനരുക്തിയും ഉപയോഗിച്ച് പുനഃസൃഷ്ടിച്ചു.
