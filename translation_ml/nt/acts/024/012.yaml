source:
  edition: SBLGNT
  text: καὶ οὔτε ἐν τῷ ἱερῷ εὗρόν με πρός τινα διαλεγόμενον ἢ ⸀ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/024/012.yaml
  text: And they found me neither in the temple arguing with anyone nor stirring up a crowd[b][a], neither in the synagogues nor throughout the city.
translation:
  language: ml
  text: അവർ എന്നെ ദേവാലയത്തിൽ ആരോടെങ്കിലും തർക്കിക്കുന്നതായോ[a] ജനക്കൂട്ടത്തെ ഇളക്കിവിടുന്നതായോ[b] കണ്ടിട്ടില്ല; സിനഗോഗുകളിലോ നഗരത്തിൽ എവിടെയെങ്കിലുമോ അങ്ങനെ കണ്ടിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആരോടെങ്കിലും വാദിക്കുന്നതായോ’ അല്ലെങ്കിൽ ‘ചർച്ച ചെയ്യുന്നതായോ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് യുക്തിവാദം നടത്തുക, സംവദിക്കുക, തർക്കിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ പൊതുകലഹം സൃഷ്ടിച്ചെന്ന ആരോപണം പൗലോസ് നിഷേധിക്കുന്നതിനാൽ ‘തർക്കിക്കുക’ എന്ന അർഥത്തിനാണ് സന്ദർഭത്തിൽ മുൻതൂക്കം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജനക്കൂട്ടം കൂടിവരാൻ ഇടയാക്കുന്നതായോ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം ജനക്കൂട്ടത്തെ കൂട്ടിച്ചേർക്കുകയോ പൊതുകലഹം ഉണ്ടാക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കാം; എന്നാൽ അത് നിർബന്ധമായും പൂർണമായ ഒരു കലാപത്തെ സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερῷ
  choice: ദേവാലയത്തിൽ
  rationale: പ്രവൃത്തികളിൽ ἱερόν സാധാരണയായി അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദേവാലയം’ സ്വാഭാവികവും സന്ദർഭത്തിൽ ആവശ്യമായ വിശാലാർഥം വഹിക്കുന്നതുമാണ്.
- source_word: εὗρόν με
  choice: അവർ എന്നെ ... കണ്ടിട്ടില്ല
  rationale: നിയമപരമായ പ്രതിവാദസന്ദർഭത്തിൽ പ്രതികൾ പൗലോസിനെ ആരോപിക്കപ്പെട്ട പ്രവൃത്തികളിൽ ഏർപ്പെട്ട നിലയിൽ കണ്ടില്ല എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πρός τινα διαλεγόμενον
  choice: ആരോടെങ്കിലും തർക്കിക്കുന്നതായോ
  rationale: διαλέγομαι എന്നതിന് സംവദിക്കുക, യുക്തിവാദം നടത്തുക, വാദിക്കുക എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. പൊതുകലഹം സൃഷ്ടിച്ചെന്ന ആരോപണം നിഷേധിക്കുന്ന സന്ദർഭത്തിൽ ‘തർക്കിക്കുക’ യോജിക്കുന്നു; എന്നാൽ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐπίστασιν ποιοῦντα ὄχλου
  choice: ജനക്കൂട്ടത്തെ ഇളക്കിവിടുന്നതായോ
  rationale: ജനക്കൂട്ടം കൂടിവരാനോ കലഹാവസ്ഥ ഉണ്ടാകാനോ ഇടയാക്കുക എന്ന ആശയം നൽകുന്നു; ഗ്രീക്കിലുള്ളതിനെക്കാൾ ശക്തമായ ‘കലാപം’ അല്ലെങ്കിൽ ‘ലഹള’ എന്ന അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὄχλου
  choice: ജനക്കൂട്ടത്തെ
  rationale: ὄχλος ഇവിടെ പൊതുവായ ഒരു ജനക്കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു. ‘അക്രമിക്കൂട്ടം’ എന്നത് മൂലപദത്തിൽ നിർബന്ധമല്ലാത്ത ഹിംസാത്മക ഭാവം ചേർക്കും.
- source_word: συναγωγαῖς
  choice: സിനഗോഗുകളിൽ
  rationale: യഹൂദരുടെ ആരാധന-സമ്മേളനസ്ഥലത്തെ സൂചിപ്പിക്കുന്ന συναγωγή എന്ന പദത്തിന്റെ ആധുനിക മലയാളത്തിലെ വ്യക്തമായ പതിവുരൂപം.
- source_word: κατὰ τὴν πόλιν
  choice: നഗരത്തിൽ എവിടെയെങ്കിലുമോ
  rationale: നഗരത്തിന്റെ വിവിധ ഭാഗങ്ങളിലുടനീളം എവിടെയും അവർ പൗലോസിനെ ഇങ്ങനെ കണ്ടില്ല എന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
