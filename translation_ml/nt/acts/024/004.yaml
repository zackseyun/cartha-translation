  text: എന്നാൽ, അങ്ങയുടെ സമയം ഇനിയും അധികം എടുക്കാതിരിക്കാൻ,[a] അങ്ങയുടെ ദയാപൂർവമായ പരിഗണനയാൽ[b] ഞങ്ങളെ ചുരുക്കത്തിൽ കേൾക്കണമെന്നു ഞാൻ അപേക്ഷിക്കുന്നു.
