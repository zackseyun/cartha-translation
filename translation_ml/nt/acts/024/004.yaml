    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അങ്ങയുടെ സൗമനസ്യത്താൽ’ / ‘അങ്ങയുടെ ദയയനുസരിച്ച്.’ ഗ്രീക്കുപദത്തിന് ന്യായമായ പരിഗണന, സൗമ്യത, അല്ലെങ്കിൽ വിധിനിർണയത്തിലെ ദയ എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
