  yaml_path: translation/nt/acts/024/011.yaml
  text: as you are able to ascertain[a], that it has been no more than twelve days since I went up to Jerusalem to worship,
translation:
  language: ml
  text: ഞാൻ ആരാധിക്കാനായി യെരൂശലേമിലേക്കു കയറിപ്പോയിട്ട് പന്ത്രണ്ടു ദിവസത്തിൽ കൂടുതലായിട്ടില്ലെന്നു താങ്കൾക്കു പരിശോധിച്ചുറപ്പാക്കാൻ കഴിയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഞാൻ ആരാധിക്കാനായി യെരൂശലേമിലേക്കു കയറിപ്പോയിട്ട് പന്ത്രണ്ടു ദിവസത്തിൽ കൂടുതലായിട്ടില്ലെന്നു താങ്കൾക്കു സ്ഥിരീകരിക്കാം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυναμένου σου ἐπιγνῶναι
  choice: താങ്കൾക്കുതന്നെ അന്വേഷിച്ചറിയാൻ കഴിയും
  rationale: കേസിന്റെ വസ്തുതകൾ ഫെലിക്സിനു പരിശോധിച്ച് ഉറപ്പാക്കാൻ കഴിയുമെന്ന നിയമസന്ദർഭത്തിലെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ സാഹചര്യബലവും നിലനിർത്തുന്നു.
- source_word: οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα
  choice: പന്ത്രണ്ടു ദിവസത്തിൽ അധികമായിട്ടില്ല
  rationale: അക്ഷരാർഥത്തിൽ ‘എനിക്ക് പന്ത്രണ്ടിൽ കൂടുതൽ ദിവസങ്ങളില്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗം കഴിഞ്ഞുപോയ സമയത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀφ’ ἧς
  choice: -ച്ചെന്നിട്ട്
  rationale: സമയപരിധിയുടെ ആരംഭബിന്ദുവായ ‘മുതൽ/ശേഷം’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക കാലപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἀνέβην
  choice: കയറിച്ചെന്നിട്ട്
  rationale: യെരൂശലേമിലേക്കു ‘കയറിപ്പോകുക’ എന്ന പരമ്പരാഗത ദിശാസൂചന സംരക്ഷിക്കുമ്പോൾ വാക്യത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: προσκυνήσων
  choice: ആരാധിക്കാനായി
  rationale: ഭാവികാല കൃദന്തത്തിന്റെ ഉദ്ദേശ്യാർഥം കൃത്യമായി നൽകുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമമായ ‘ദൈവത്തെ’ ചേർക്കുന്നില്ല.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു
  rationale: നഗരത്തെ ലക്ഷ്യസ്ഥാനമായി സൂചിപ്പിക്കുന്ന εἰς എന്നതിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
