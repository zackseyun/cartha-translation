  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും കോടതിസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളം. ഭരണാധികാരിയോടുള്ള അഭിസംബോധനയിൽ ‘താങ്കൾ’ ഉപയോഗിച്ചു; ‘കയറിച്ചെന്നു’ എന്നത് യെരൂശലേമിലേക്കുള്ള ദിശാസൂചന നിലനിർത്തുന്നു.
