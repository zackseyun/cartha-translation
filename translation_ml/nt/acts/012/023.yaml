revisions:
- from: അപ്പോൾത്തന്നെ കർത്താവിന്റെ ഒരു ദൂതൻ അവനെ പ്രഹരിച്ചു. കാരണം, അവൻ ദൈവത്തിനു മഹത്ത്വം നൽകിയില്ല. പുഴുക്കൾ തിന്നവനായി[a] അവൻ മരിച്ചു[b].
  to: അപ്പോൾത്തന്നെ, അവൻ ദൈവത്തിനു മഹത്ത്വം നൽകിയില്ലാത്തതുകൊണ്ട്, കർത്താവിന്റെ ഒരു ദൂതൻ അവനെ പ്രഹരിച്ചു; പുഴുക്കളാൽ തിന്നപ്പെട്ടവനായിത്തീർന്ന്[a] അവൻ മരിച്ചു[b].
  rationale: The revision joins the causal statement directly to the angel’s action and replaces the awkward worm-eaten phrase with an explicit, idiomatic passive construction. ‘ആയിത്തീർന്ന്’ retains the Greek participial aspect without asserting a more precise sequence than the text supplies. The existing lexical alternative for ἐξέψυξεν is retained.
