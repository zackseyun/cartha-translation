  text: παραχρῆμα δὲ ἐπάταξεν αὐτὸν ἄγγελος κυρίου ἀνθ’ ὧν οὐκ ἔδωκεν ⸀τὴν δόξαν τῷ θεῷ, καὶ γενόμενος σκωληκόβρωτος ἐξέψυξεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: ml
  text: അപ്പോൾത്തന്നെ, അവൻ ദൈവത്തിനു മഹത്ത്വം നൽകിയില്ലാത്തതുകൊണ്ട്, കർത്താവിന്റെ ഒരു ദൂതൻ അവനെ പ്രഹരിച്ചു; പുഴുക്കളാൽ തിന്നപ്പെട്ടവനായിത്തീർന്ന്[a] അവൻ മരിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുഴുക്കൾ തിന്നവനായി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അന്ത്യശ്വാസം വിട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: അപ്പോൾത്തന്നെ
  rationale: ഒട്ടും താമസമില്ലാതെ സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ പെട്ടെന്നുള്ള ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπάταξεν
  choice: പ്രഹരിച്ചു
  rationale: ദൂതൻ അവനെ അടിച്ചു അഥവാ പ്രഹരിച്ചു എന്ന അർഥം നൽകുന്നു; മരണം പിന്നീട് പ്രത്യേകം പറയുന്നതിനാൽ ‘കൊന്നുകളഞ്ഞു’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: ഗ്രീക്കിൽ ‘ദൂതൻ’ എന്ന നാമത്തിന് നിർദേശക ഉപപദമില്ലാത്തതിനാൽ അനിർദിഷ്ടമായ ‘ഒരു ദൂതൻ’ യോജിക്കുന്നു.
- source_word: ἀνθ’ ὧν
  choice: കാരണം
  rationale: തുടർന്നുള്ള ദൈവിക ന്യായവിധിയുടെ കാരണം നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: അവൻ ദൈവത്തിനു മഹത്ത്വം നൽകിയില്ല
  rationale: ദൈവത്തിന് അർഹമായ മഹത്ത്വം അവിടത്തേക്കു ചാർത്താതിരുന്നതാണ് വാക്യം പറയുന്നത്; മലയാളത്തിലെ പതിവായ ബൈബിൾപ്രയോഗവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമാണ്.
- source_word: γενόμενος σκωληκόβρωτος
  choice: പുഴുക്കൾ തിന്നവനായി
  rationale: പുഴുക്കളാൽ തിന്നപ്പെടുന്ന അവസ്ഥയിലായെന്ന ദൃശ്യശക്തി നിലനിർത്തുന്നു; അതിന്റെ വൈദ്യശാസ്ത്രപരമായ സ്വഭാവമോ കൃത്യമായ കാലക്രമമോ അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐξέψυξεν
  choice: മരിച്ചു
  rationale: ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥം ലളിതവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിവരിച്ചിരിക്കുന്ന ന്യായവിധിയുടെ സ്വഭാവവും കാലക്രമവും
  choice: ഹെരോദാവിന്റെ മരണത്തെ കർത്താവിന്റെ ഒരു ദൂതൻ മുഖാന്തരം നടപ്പായ ദൈവിക ന്യായവിധിയായി അവതരിപ്പിക്കുന്നു; പുഴുക്കൾ തിന്ന അവസ്ഥയിലായി അവൻ മരിച്ചുവെന്നതിലപ്പുറം കാലക്രമമോ വൈദ്യശാസ്ത്ര വിശദീകരണമോ ചേർക്കുന്നില്ല.
  alternative: ഇത് മതഭാഷയിൽ വിവരിച്ച തികച്ചും സ്വാഭാവികമരണം മാത്രമാണെന്നോ, ദൂതൻ പ്രഹരിച്ച അതേ നിമിഷം തന്നെ അവൻ മരിച്ചെന്നോ വ്യക്തമാക്കുക.
  rationale: ദൂതന്റെ പ്രഹരവും ദൈവത്തിനു മഹത്ത്വം നൽകാതിരുന്നതെന്ന കാരണവും മൂലപാഠം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു. എന്നാൽ ‘ആയി’ എന്ന പങ്കാളിക്രിയയ്ക്കു പിന്നാലെ ‘മരിച്ചു’ എന്നു പറയുന്ന ഘടന കൃത്യമായ വൈദ്യശാസ്ത്രപരമോ സമയപരമോ ആയ പുനർനിർമ്മാണത്തിന് മതിയായ വിശദാംശം നൽകുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രഹരിച്ചു’ എന്ന പദം ദൂതന്റെ പ്രവർത്തനത്തെ ശക്തമായി അറിയിക്കുമ്പോഴും ഉടൻ കൊല്ലപ്പെട്ടുവെന്ന് മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല. ചെറുവാക്യങ്ങൾ കാരണം-ഫലബന്ധവും സംഭവത്തിന്റെ പെട്ടെന്നുള്ള സ്വഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു.
