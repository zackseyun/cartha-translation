id: ACT.12.4
reference: Acts 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: ml
  text: അവനെ പിടികൂടിയശേഷം, അവൻ അവനെ തടവിലാക്കി; അവനെ കാവൽ ചെയ്യാൻ നാലു സൈനികസംഘങ്ങളുടെ[a] കാവലിൽ ഏൽപ്പിച്ചു. പെസഹയ്ക്കുശേഷം[b] അവനെ ജനത്തിന്റെ മുമ്പിൽ കൊണ്ടുവരാനായിരുന്നു അവന്റെ ഉദ്ദേശ്യം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സൈനികരുടെ നാലു നാലംഗസംഘങ്ങൾ’; അതായത്, നാലു സൈനികർ വീതമുള്ള നാലു സംഘങ്ങൾ.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് πάσχα എന്നതിന് ‘പെസഹ’ എന്നാണ് അർഥം; ചില പഴയ ഇംഗ്ലീഷ് പരിഭാഷകൾ ഇവിടെ ‘ഈസ്റ്റർ’ എന്നു നൽകിയിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: പിടികൂടിയശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന അറസ്റ്റിനെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ ക്രമവും കസ്റ്റഡിയിലെടുക്കുന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔθετο εἰς φυλακήν
  choice: തടവിലാക്കി
  rationale: കാരാഗൃഹത്തിൽ പാർപ്പിച്ചു എന്ന ആശയം സംക്ഷിപ്തവും ആഖ്യാനത്തിന് യോജിച്ചതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: παραδοὺς
  choice: ഏൽപ്പിച്ചു
  rationale: പത്രോസിന്റെ കാവൽച്ചുമതല സൈനികർക്കു കൈമാറിയെന്ന കസ്റ്റഡി അർഥം വ്യക്തമാക്കുന്നു.
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: നാലു സൈനികസംഘങ്ങളെ
  rationale: വായിക്കാൻ സ്വാഭാവികമായ പ്രയോഗം; ഓരോ സംഘത്തിലും നാലു സൈനികർ വീതമുണ്ടെന്ന കൃത്യവിവരം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: φυλάσσειν αὐτόν
  choice: അവനെ കാവൽ ചെയ്യാൻ
  rationale: παραδοὺς എന്നതോടു ചേർന്ന ഉദ്ദേശ്യാർഥക infinitive കൃത്യമായും ലളിതമായും നൽകുന്നു.
- source_word: βουλόμενος
  choice: ഉദ്ദേശ്യം
  rationale: ഹെരോദാവിന്റെ ആലോചിച്ചുറച്ച പദ്ധതിയെ സൂചിപ്പിക്കുന്നു; വികാരപരമായ ആഗ്രഹം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: μετὰ τὸ πάσχα
  choice: പെസഹയ്ക്കുശേഷം
  rationale: πάσχα എന്ന ഗ്രീക്ക് പദത്തിന്റെ യഹൂദ പെസഹാ ഉത്സവസംബന്ധിയായ നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: അവനെ ജനത്തിന്റെ മുമ്പിൽ കൊണ്ടുവരാൻ
  rationale: പൊതുജനസമക്ഷം ഹാജരാക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ഔപചാരിക വിചാരണയെ പ്രത്യേകം ചേർക്കുന്നില്ല.
- source_word: λαῷ
  choice: ജനത്തിന്റെ
  rationale: പൊതുസമൂഹമായ ജനത്തെ സൂചിപ്പിക്കുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: πάσχα എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പെസഹ
  alternative: ഈസ്റ്റർ
  rationale: ഗ്രീക്ക് πάσχα നേരിട്ട് പെസഹയെ സൂചിപ്പിക്കുന്നു. ചില പഴയ ഇംഗ്ലീഷ് പരിഭാഷകളിലെ ‘Easter’ എന്ന പാരമ്പര്യപ്രയോഗത്തെ മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരാതെ അടിക്കുറിപ്പിൽ മാത്രം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. മൂലപാഠത്തിലെ പങ്കാളിക്രിയകളുടെ ബന്ധം മലയാളത്തിൽ വ്യക്തമായ ക്രിയാക്രമമായി നൽകിയിരിക്കുന്നു. ആവർത്തിക്കുന്ന ‘അവൻ’ സന്ദർഭത്തിലെ ഹെരോദാവിനെയും ‘അവനെ’ പത്രോസിനെയും സൂചിപ്പിക്കുന്നു.
