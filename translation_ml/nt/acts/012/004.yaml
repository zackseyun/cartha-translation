  source_fidelity: 'മുഖ്യ ആശയം ശരിയായി കൈമാറിയിട്ടുണ്ട്: പിടികൂടൽ, തടവിലാക്കൽ, നാലു നാലംഗ സൈനികസംഘങ്ങളുടെ കാവലിൽ ഏൽപ്പിക്കൽ, പെസഹയ്ക്കുശേഷമുള്ള പൊതുഹാജരാക്കൽ എന്നിവയെല്ലാം മൂലപാഠത്തോടു പൊരുത്തപ്പെടുന്നു. എന്നാൽ നിലവിലെ ‘നാലു സൈനികസംഘങ്ങളെ ഏൽപ്പിച്ചു’ എന്ന ഘടനയിൽ പത്രോസിനെയല്ല, സൈനികസംഘങ്ങളെയാണു ഏൽപ്പിച്ചതെന്ന വ്യാകരണസാധ്യത ഉണ്ടാകുന്നു. അതുകൊണ്ട് കസ്റ്റഡിയിലേൽപ്പിച്ചതിന്റെ ബന്ധം വ്യക്തമായി പുനഃക്രമീകരിക്കുന്നു.'
  naturalness: പരിഷ്കരിച്ച വാചകം ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു. ‘നാലു സൈനികസംഘങ്ങളുടെ കാവലിൽ ഏൽപ്പിച്ചു’ എന്ന പ്രയോഗം സ്വാഭാവികവും അർഥനിർണായകവുമാണ്.
