  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: ml
  text: എന്നാൽ പത്രോസ് മുട്ടിക്കൊണ്ടേയിരുന്നു[a]. അവർ തുറന്നപ്പോൾ[b] അവനെ കണ്ടു വിസ്മയിച്ചുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തുടർച്ചയായി മുട്ടിക്കൊണ്ടിരുന്നു’ അല്ലെങ്കിൽ ‘മുട്ടുന്നതിൽ ഉറച്ചുനിന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘തുറന്നശേഷം അവർ അവനെ കണ്ടു വിസ്മയിച്ചു.’ എന്താണ് തുറന്നതെന്ന് മൂലപാഠം ഇവിടെ പ്രത്യേകം പറയുന്നില്ല; സന്ദർഭത്തിൽ അത് വാതിലോ പടിവാതിലോ ആണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν κρούων
  choice: മുട്ടിക്കൊണ്ടേയിരുന്നു
  rationale: അപൂർണ്ണകാല ക്രിയയും വർത്തമാനകാല കൃദന്തവും ചേർന്ന് തുടരുന്ന അഥവാ ആവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνοίξαντες
  choice: അവർ തുറന്നപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തത്തെ ഇവിടെ കാലസംബന്ധമായി പരിഭാഷപ്പെടുത്തി സംഭവക്രമം വ്യക്തമാക്കുന്നു. മൂലപാഠത്തിൽ തുറന്ന വസ്തു വ്യക്തമാക്കിയിട്ടില്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ ‘വാതിൽ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: εἶδαν αὐτόν
  choice: അവനെ കണ്ടു
  rationale: ആഖ്യാനസന്ദർഭത്തിലെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐξέστησαν
  choice: വിസ്മയിച്ചുപോയി
  rationale: ശക്തമായ അമ്പരപ്പിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ തീവ്രത സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആദ്യത്തെ δέ മുൻസാഹചര്യത്തോടുള്ള വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു; രണ്ടാമത്തേത് മലയാള വാക്യഘടനയിൽ പ്രത്യേകം പദമായി ആവർത്തിക്കേണ്ടതില്ല.
- source_word: Πέτρος
  choice: പത്രോസ്
  rationale: മലയാള ബൈബിൾ ഭാഷയിൽ വ്യാപകമായി അംഗീകരിച്ചിരിക്കുന്ന വ്യക്തിനാമരൂപം ഉപയോഗിച്ചു.
