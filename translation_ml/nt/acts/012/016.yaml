translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മുട്ടിക്കൊണ്ടേയിരുന്നു’ തുടരുന്ന പ്രവൃത്തിയെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വാതിൽ’ പ്രധാനപാഠത്തിൽ ചേർക്കാതെ സന്ദർഭവിവരം അടിക്കുറിപ്പിൽ നൽകി.
