  terminology: പത്രോസ് and സൈനികർ are appropriate. വലിയ ... കലക്കമുണ്ടായി is an idiomatic rendering of τάραχος οὐκ ὀλίγος and preserves its emphatic force without importing the narrower sense of panic.
  issues:
