id: ACT.12.18
reference: Acts 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἦν τάραχος οὐκ ὀλίγος ἐν τοῖς στρατιώταις, τί ἄρα ὁ Πέτρος ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/018.yaml
  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ, പത്രോസിന് എന്തു സംഭവിച്ചുവെന്നതിനെച്ചൊല്ലി സൈനികരുടെ ഇടയിൽ വലിയ കലക്കമുണ്ടായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് പ്രയോഗത്തിന്റെ കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. δέ ഇവിടെ കഥയിലെ മാറ്റം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകമായി ‘എന്നാൽ’ എന്നു ചേർക്കേണ്ടതില്ല.
- source_word: τάραχος οὐκ ὀλίγος
  choice: വലിയ പരിഭ്രാന്തി
  rationale: ‘ചെറുതല്ലാത്ത’ എന്ന ഗ്രീക്ക് ലിറ്റോട്ടീസിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ ‘വലിയ’ എന്നു പ്രകടിപ്പിക്കുന്നു; τάραχος സൂചിപ്പിക്കുന്ന കലക്കവും ആശങ്കയും ഈ സന്ദർഭത്തിൽ ‘പരിഭ്രാന്തി’ നന്നായി പകർത്തുന്നു.
- source_word: ἐν τοῖς στρατιώταις
  choice: സൈനികരുടെ ഇടയിൽ
  rationale: στρατιώταις എന്നതിന്റെ നേരായ അർഥം ‘സൈനികർ’ ആണ്; ἐν ഇവിടെ കലക്കം ഉണ്ടായ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τί ἄρα ὁ Πέτρος ἐγένετο
  choice: പത്രോസിന് എന്തു സംഭവിച്ചുവെന്നതിനെച്ചൊല്ലി
  rationale: ഒരു വ്യക്തിയെക്കുറിച്ചുള്ള τί ... ἐγένετο എന്ന പ്രയോഗം ‘എന്തു സംഭവിച്ചു/എന്തായി’ എന്ന അർഥത്തിലാണ്. ἄρα നൽകുന്ന അനുമാനാത്മകമായ അമ്പരപ്പ് വാക്യത്തിന്റെ സമഗ്രസന്ദർഭത്തിൽ നിലനിൽക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കഥനശൈലി. ഗ്രീക്കിലെ ലിറ്റോട്ടീസ് വാക്കുതോറും പകർത്താതെ അതിന്റെ ഊന്നൽ സ്വാഭാവികമായി നൽകി; പാഠത്തിൽ യഥാർത്ഥമായ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വമൊന്നുമില്ല.
