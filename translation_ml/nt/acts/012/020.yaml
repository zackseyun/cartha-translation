  revised_text: ഹെരോദാവിന് തുറൊസിലെയും സീദോനിലെയും ജനങ്ങളോട് കടുത്ത കോപമുണ്ടായിരുന്നു.[a] എന്നാൽ അവർ ഏകമനസ്സോടെ അദ്ദേഹത്തിന്റെ അടുക്കൽ ചെന്നു. രാജാവിന്റെ ശയനമുറിയുടെ ചുമതലയുള്ള ബ്ലാസ്തൊസിനെ തങ്ങളുടെ പക്ഷത്താക്കിയശേഷം[b] അവർ സമാധാനത്തിനായി അപേക്ഷിച്ചുകൊണ്ടിരുന്നു. കാരണം, രാജാവിന്റെ അധീനപ്രദേശത്തുനിന്ന് അവരുടെ പ്രദേശത്തിന് ഭക്ഷ്യവിതരണം ലഭിച്ചുകൊണ്ടിരുന്നതാണ്.[c]
