id: ACT.12.20
reference: Acts 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: ml
  text: ഹെരോദാവിന് തുറൊസിലെയും സീദോനിലെയും ജനങ്ങളോട് കടുത്ത കോപമുണ്ടായിരുന്നു.[a] എന്നാൽ അവർ ഏകമനസ്സോടെ അദ്ദേഹത്തിന്റെ അടുക്കൽ ചെന്നു. രാജാവിന്റെ ശയനമുറിയുടെ ചുമതലയുള്ള ബ്ലാസ്തൊസിനെ തങ്ങളുടെ പക്ഷത്താക്കിയശേഷം[b] അവർ സമാധാനത്തിനായി അപേക്ഷിച്ചുകൊണ്ടിരുന്നു. കാരണം, രാജാവിന്റെ അധീനപ്രദേശത്തുനിന്ന് അവരുടെ പ്രദേശത്തിന് ഭക്ഷ്യവിതരണം ലഭിച്ചുകൊണ്ടിരുന്നതാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തുറൊസിലെയും സീദോനിലെയും ജനങ്ങളോട് കടുത്ത ശത്രുത പുലർത്തിയിരുന്നു.” ഗ്രീക്ക് പദം തീവ്രമായ കോപമോ ശത്രുതയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “രാജാവിന്റെ ശയനമുറിയുടെ ചുമതലയുള്ളവൻ”; രാജാവിന്റെ സ്വകാര്യ മുറികളിലേക്ക് പ്രവേശനമുണ്ടായിരുന്ന ഒരു കൊട്ടാര ഉദ്യോഗസ്ഥനായിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “രാജാവിന്റെ അധീനപ്രദേശത്തുനിന്ന് അവരുടെ പ്രദേശത്തിന് ഭക്ഷ്യവിതരണം ലഭിച്ചുകൊണ്ടിരുന്നതുകൊണ്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμομαχῶν
  choice: കടുത്ത കോപമുണ്ടായിരുന്നു
  rationale: തീവ്രമായ കോപമോ ശത്രുതയോ സൂചിപ്പിക്കുന്ന പദം; സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ തീവ്രത നിലനിർത്തുന്നു.
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: തീരിലെയും സീദോനിലെയും ജനങ്ങളോട്
  rationale: നഗരവാസികളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ജനനാമങ്ങളെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁμοθυμαδόν
  choice: ഏകമനസ്സോടെ
  rationale: ഒരുമിച്ചുവരുന്നതിലുപരി ഒരേ ലക്ഷ്യവും ഉദ്ദേശ്യവും ഉണ്ടായിരുന്നുവെന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: παρῆσαν πρὸς αὐτόν
  choice: അദ്ദേഹത്തിന്റെ അടുക്കൽ ചെന്നു
  rationale: അദ്ദേഹത്തിന്റെ സന്നിധിയിൽ എത്തിയെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πείσαντες
  choice: തങ്ങളുടെ പക്ഷത്താക്കിയശേഷം
  rationale: ഇവിടെ അപേക്ഷകരുടെ അനുകൂലമായി രാജകീയ ഉദ്യോഗസ്ഥനെ സ്വാധീനിച്ചുവെന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; മുൻപ്രവൃത്തി എന്ന ക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: Βλάστον
  choice: ബ്ലാസ്തൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: രാജാവിന്റെ അന്തഃപുരച്ചുമതലക്കാരൻ
  rationale: രാജാവിന്റെ സ്വകാര്യ ശയനമുറിയുമായി ബന്ധപ്പെട്ട വിശ്വസ്ത കൊട്ടാര ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്ന സാംസ്കാരിക പ്രയോഗം വായനാസൗഹൃദമായി നൽകുന്നു.
- source_word: ᾐτοῦντο εἰρήνην
  choice: സമാധാനത്തിനായി അപേക്ഷിച്ചുകൊണ്ടിരുന്നു
  rationale: നയതന്ത്രപരമായ സമാധാനാവശ്യവും അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: διὰ τὸ τρέφεσθαι
  choice: ഭക്ഷണം ... ലഭിച്ചിരുന്നത് കാരണം
  rationale: διάയോടുകൂടിയ ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവ് നൽകുന്ന കാരണബന്ധവും ഭക്ഷ്യവിതരണത്തിന്റെ നിഷ്ക്രിയ ആശയവും വ്യക്തമാക്കുന്നു.
- source_word: αὐτῶν τὴν χώραν
  choice: അവരുടെ പ്രദേശം
  rationale: χώραയുടെ പ്രദേശം/ദേശം എന്ന ഭൂമിശാസ്ത്ര-രാഷ്ട്രീയ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: രാജാവിന്റെ അധീനപ്രദേശത്തുനിന്ന്
  rationale: നാമവൽക്കരിച്ച് ഉപയോഗിച്ച βασιλικῆς രാജാവിനുള്ള പ്രദേശമോ അധികാരപരിധിയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആവശ്യമായ നാമം പൂരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആദ്യത്തെ δέ സ്വതന്ത്രമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകമായി വിവർത്തനം ചെയ്തിട്ടില്ല; സന്ദർഭത്തിൽ നിന്ന് ഹെരോദാവാണ് കർത്താവെന്ന് വ്യക്തമായതിനാൽ പേര് ആവർത്തിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു. രണ്ടാമത്തെ δέയുടെ വിരുദ്ധബന്ധം ‘എന്നാൽ’ എന്നു നൽകിയിരിക്കുന്നു. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘അപേക്ഷിച്ചുകൊണ്ടിരുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
