translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ ദീർഘഘടന മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; അർഥബന്ധം നിലനിർത്തി.
