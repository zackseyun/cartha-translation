id: ACT.12.12
reference: Acts 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: ml
  text: ഇതു മനസ്സിലാക്കിയപ്പോൾ, മർക്കോസ് എന്നു വിളിക്കപ്പെട്ട യോഹന്നാന്റെ അമ്മയായ മറിയയുടെ വീട്ടിലേക്ക് അവൻ പോയി. അവിടെ അനേകർ ഒരുമിച്ചുകൂടിയിരുന്നു; അവർ പ്രാർഥിച്ചുകൊണ്ടിരിക്കുകയായിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: ഇതു മനസ്സിലാക്കിയപ്പോൾ
  rationale: മാലാഖ പോയശേഷം പത്രോസ് തന്റെ സ്ഥിതി പൂർണമായി ഗ്രഹിച്ചതിനെയാണ് സന്ദർഭത്തിൽ ഈ ഭൂതകാല കൃടങ്ങ് സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമം മുൻസന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ എന്നു സ്വാഭാവികമായി ചേർത്തിരിക്കുന്നു.
- source_word: τε
  choice: വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കി
  rationale: ഇത് നേരിയ ആഖ്യാനബന്ധം സൂചിപ്പിക്കുന്ന ഘടകമാണ്. മലയാളത്തിൽ പ്രത്യേകമായ ഒരു സംയോജകപദം ചേർക്കാതെ വാക്യക്രമംകൊണ്ട് ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: വീട്ടിലേക്ക് അവൻ പോയി
  rationale: ἐπί സഹിതമുള്ള പ്രയോഗം ഒരു സ്ഥലത്തേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. ആഖ്യാനത്തിന്റെ ദൃഷ്ടികോണത്തിൽ ‘പോയി’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: οἰκίαν
  choice: വീട്
  rationale: ഇവിടെ പത്രോസ് ചെന്നെത്തുകയും ആളുകൾ കൂടിയിരിക്കുകയും ചെയ്യുന്ന ഭൗതികസ്ഥലമാണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്.
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: യോഹന്നാന്റെ അമ്മയായ മറിയ
  rationale: ഏതു മറിയയാണെന്ന് തിരിച്ചറിയിക്കുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: മർക്കോസ് എന്നു വിളിക്കപ്പെട്ട
  rationale: യോഹന്നാനെ മറ്റൊരു പേരിലൂടെ തിരിച്ചറിയിക്കുന്ന വർത്തമാനകാല കർമണി കൃടങ്ങാണിത്. ഗ്രീക്ക് പാഠത്തിൽ ‘എന്നും/കൂടി’ എന്ന ക്രിയാവിശേഷണം നിർബന്ധിതമല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: οὗ
  choice: അവിടെ
  rationale: ബന്ധസൂചക ക്രിയാവിശേഷണം മറിയയുടെ വീടിനെ സ്ഥലമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പുതിയ വാക്യത്തിന്റെ തുടക്കത്തിലുള്ള ‘അവിടെ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἱκανοὶ
  choice: അനേകർ
  rationale: ബഹുവചനത്തിലെ ἱκανός ഗണ്യമായ ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; ‘അനേകർ’ അതിന്റെ സ്വാഭാവികവും മാന്യവുമായ തർജമയാണ്.
- source_word: ἦσαν … συνηθροισμένοι
  choice: ഒരുമിച്ചുകൂടി … കൊണ്ടിരുന്നു
  rationale: മുൻപ് ഒരുമിച്ചുകൂടിയതിന്റെ ഫലമായി അവർ അവിടെ നിലകൊണ്ടിരുന്ന അവസ്ഥയെ പരിപൂർണ കൃടങ്ങോടുകൂടിയ ഈ നിർമാണം സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സംയുക്ത ക്രിയാരൂപം ആ കൂട്ടായ അവസ്ഥ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ προσευχόμενοι
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: അവർ കൂടിയിരുന്ന സമയത്ത് തുടരുകയായിരുന്ന പ്രവൃത്തിയെ ഈ കൃടങ്ങ് സൂചിപ്പിക്കുന്നു; ‘കൊണ്ടിരുന്നു’ അതിന്റെ തുടർച്ചാഭാവം വ്യക്തമാക്കുന്നു.
