id: ACT.12.7
reference: Acts 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων· Ἀνάστα ἐν τάχει· καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: ml
  text: അപ്പോൾ ഇതാ, കർത്താവിന്റെ ഒരു ദൂതൻ അരികിൽ വന്നുനിന്നു[a]; തടവുമുറിയിൽ[b] ഒരു വെളിച്ചം തെളിഞ്ഞു. ദൂതൻ പത്രോസിന്റെ വശത്ത് തട്ടി അവനെ ഉണർത്തി, “വേഗം എഴുന്നേൽക്കൂ” എന്നു പറഞ്ഞു. അപ്പോൾ അവന്റെ ചങ്ങലകൾ കൈകളിൽനിന്ന് വീണുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അരികിൽ നിന്നു” അല്ലെങ്കിൽ “പെട്ടെന്ന് പ്രത്യക്ഷനായി.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അരികിൽ നിൽക്കുന്നതിനോടൊപ്പം പെട്ടെന്നുള്ള സാന്നിധ്യവും സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “മുറിയിൽ” അല്ലെങ്കിൽ “അറയിൽ.” ഗ്രീക്ക് പദം കൂടുതൽ പൊതുവായതാണ്; എന്നാൽ ജയിൽസന്ദർഭത്തിൽ “തടവുമുറി” യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: കഥയിലെ പെട്ടെന്നുള്ള സംഭവത്തിലേക്ക് ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരചിഹ്നത്തിന്റെ സജീവത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄγγελος κυρίου
  choice: കർത്താവിന്റെ ഒരു ദൂതൻ
  rationale: അനിർദിഷ്ടനായ ദൂതനെയാണ് പരാമർശിക്കുന്നത്; ജനിറ്റീവ് ബന്ധവും κύριος എന്ന പദത്തിന്റെ പതിവ് പുതിയനിയമ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἐπέστη
  choice: അരികിൽ വന്നുനിന്നു
  rationale: അരികിൽ നിൽക്കുക എന്ന ഭൗതികസമീപതയും അവിടെ എത്തിച്ചേരുന്നതിന്റെ സംഭവസ്വഭാവവും ചേർത്ത് നൽകുന്നു; പെട്ടെന്നുള്ള പ്രത്യക്ഷത എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: φῶς ἔλαμψεν
  choice: ഒരു വെളിച്ചം പ്രകാശിച്ചു
  rationale: നാമവും ക്രിയയും നേരിട്ട്, സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν τῷ οἰκήματι
  choice: തടവുമുറിയിൽ
  rationale: ഗ്രീക്ക് പദം പൊതുവായി മുറിയെയോ വാസസ്ഥലത്തെയോ സൂചിപ്പിക്കാമെങ്കിലും, ഉടനിലയിലെ ജയിൽസന്ദർഭം ഇവിടെ തടവുമുറി എന്ന വിവർത്തനത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: πατάξας τὴν πλευρὰν
  choice: പാർശ്വത്ത് തട്ടി
  rationale: ഉറക്കമുണർത്താൻ പത്രോസിന്റെ വശത്ത് ശാരീരികമായി തട്ടിയ പ്രവൃത്തി വ്യക്തമാക്കുന്നു; വെറും മൃദുസ്പർശമെന്നോ ക്രൂരമായ പ്രഹരമെന്നോ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἤγειρεν αὐτὸν
  choice: അവനെ ഉണർത്തി
  rationale: ഈ സന്ദർഭത്തിൽ ἐγείρω ഉറക്കത്തിൽനിന്ന് ഉണർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: Ἀνάστα ἐν τάχει
  choice: വേഗം എഴുന്നേൽക്കൂ
  rationale: ആജ്ഞയുടെ അടിയന്തരത വ്യക്തവും സമകാലികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: അവന്റെ ചങ്ങലകൾ കൈകളിൽനിന്ന് വീണുപോയി
  rationale: ചങ്ങലകൾ സ്വയം കൈകളിൽനിന്ന് വീണ സംഭവത്തെ ഗ്രീക്ക് വാക്യഘടനയോട് അടുത്തുനിന്ന് അവതരിപ്പിക്കുന്നു; ‘മണിക്കട്ടുകൾ’ എന്ന സന്ദർഭാനുമാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἄγγελος κυρίου എന്ന പ്രയോഗത്തിലെ κύριος
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: പുതിയനിയമത്തിലെ പതിവ് ദൈവപരമായ അഭിസംബോധനയ്ക്കൊത്ത വിവർത്തനം; അധികമായ വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. “ഇതാ” ലൂക്കോസിന്റെ സജീവമായ കഥനഭാവം നിലനിർത്തുന്നു; “പാർശ്വത്ത്” എന്നത് അത്യന്തം സംസാരഭാഷാപരമാകാതെ വ്യക്തത നൽകുന്നു. അടിക്കുറിപ്പ് [b] അതുമായി യഥാർത്ഥത്തിൽ ബന്ധപ്പെട്ട οἴκημα എന്ന പദത്തിന്റെ വിവർത്തനമായ “തടവുമുറിയിൽ” എന്നിടത്താണ് ചേർത്തിരിക്കുന്നത്.
