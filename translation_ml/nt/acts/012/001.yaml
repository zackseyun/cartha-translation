  terminology: ‘ഹെരോദാരാജാവ്,’ ‘സഭ,’ and ‘ഉപദ്രവിക്കാനായി’ are suitable modern-standard Malayalam choices. The footnote now accurately notes that the Greek has the plural ‘hands,’ while retaining the natural Malayalam singular idiom ‘കൈവെച്ചു.’
