id: ACT.12.1
reference: Acts 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: ml
  text: ഏതാണ്ട് ആ സമയത്ത്[a], ഹെരോദാരാജാവ് സഭയിൽപ്പെട്ട ചിലരുടെമേൽ ഉപദ്രവിക്കാനായി[c] കൈവെച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ കാലത്ത്” അല്ലെങ്കിൽ “ആ സമയത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: മൂലത്തിൽ “കൈകൾ വെച്ചു.” ഇവിടെ ഈ പ്രയോഗം സഭയിൽപ്പെട്ട ചിലർക്കെതിരായ ശത്രുതാപരമായ നടപടിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ദോഷം ചെയ്യാനായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: ആ കാലത്തോടടുത്ത്
  rationale: κατά ചേർന്ന ഈ കാലസൂചകപ്രയോഗം ‘ആ കാലത്ത്/ആ കാലത്തോടടുത്ത്’ എന്ന ഏകദേശ സമയത്തെ സൂചിപ്പിക്കുന്നു. δέ-യുടെ ലഘുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: ഹെരോദാരാജാവ്
  rationale: ഗ്രീക്കിലെ പേരും സ്ഥാനപ്പേരും ചേർന്ന പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: അവരുടെമേൽ കൈവച്ചു
  rationale: മൂലത്തിലെ ‘കൈകൾ വെച്ചു’ എന്ന ശൈലി സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് അനുഗ്രഹമല്ല, ശത്രുതാപരമായ നടപടിയാണ്. ‘അറസ്റ്റുചെയ്തു’ എന്നു മാത്രം പറയുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: κακῶσαί
  choice: ഉപദ്രവിക്കാനായി
  rationale: κακόω സൂചിപ്പിക്കുന്ന ദോഷം ചെയ്യലും മോശമായി പെരുമാറലും ഉൾക്കൊള്ളുന്നു; ‘പീഡിപ്പിക്കുക’ എന്ന കൂടുതൽ സാങ്കേതികമായ മതപരമായ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: സഭയിൽപ്പെട്ട ചിലരെ
  rationale: ക്രിസ്തീയ സമൂഹവുമായി ബന്ധപ്പെട്ട ചില വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
theological_decisions:
- issue: ἐκκλησία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഭ
  alternative: കൂട്ടായ്മ / സമൂഹം
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പദം സാധാരണയായി ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ മലയാളത്തിൽ സ്ഥിരപ്രയോഗവും സന്ദർഭോചിതവുമാണ്; ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ ഘടന ഇതിൽ ആരോപിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ആഖ്യാനശൈലി. മൂലത്തിലെ ശത്രുതാപരമായ ‘കൈവയ്ക്കുക’ എന്ന രൂപകം പ്രധാനവാചകത്തിൽ നിലനിർത്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
