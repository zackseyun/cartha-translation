  source_fidelity: The draft accurately represents the temporal approximation, Herod's royal title, the hostile ‘lay hands on’ idiom, the purpose expressed by κακῶσαι, and the reference to certain members of the church. The revised wording retains these elements and does not narrow the action to arrest or import ‘persecution.’
