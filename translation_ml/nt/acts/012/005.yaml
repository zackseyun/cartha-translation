id: ACT.12.5
reference: Acts 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: ml
  text: അങ്ങനെ പത്രോസിനെ തടവറയിൽ പാർപ്പിച്ചിരുന്നു; എന്നാൽ സഭ അദ്ദേഹത്തിനുവേണ്ടി ദൈവത്തോട് തീവ്രമായി[a] പ്രാർത്ഥിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിരന്തരം’; ഗ്രീക്ക് ക്രിയാവിശേഷണം പ്രാർത്ഥനയുടെ തീവ്രതയെയോ സ്ഥിരോത്സാഹത്തെയോ ഊന്നിക്കാട്ടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: കാവലിൽ പാർപ്പിച്ചിരുന്നു
  rationale: അപൂർണകാല കർമണി രൂപം തുടരുന്ന തടങ്കലിനെ സൂചിപ്പിക്കുന്നു. തടവറയുടെ സന്ദർഭത്തിൽ കാവലിന്റെ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുമ്പോഴും തുടർച്ചാഭാവം നിലനിർത്തുന്നു.
- source_word: φυλακῇ
  choice: തടവറയിൽ
  rationale: തടങ്കൽസ്ഥലത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആധുനിക മാനക മലയാളത്തിൽ ‘തടവറ’ ഗൗരവമുള്ളതും വ്യക്തവുമാണ്.
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: പ്രാർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: ἦν കൂടെയുള്ള വർത്തമാന കൃദന്തം തുടർച്ചയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. പദശഃ നാമവാക്യഘടന ആവർത്തിക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചാരൂപം ഉപയോഗിച്ചു.
- source_word: ἐκτενῶς
  choice: തീക്ഷ്ണമായി
  rationale: പ്രാർഥനയുടെ തീവ്രതയെ നേരിട്ട് അറിയിക്കുന്നു; ഈ ക്രിയാവിശേഷണം സ്ഥിരോത്സാഹത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: സഭ
  rationale: പത്രോസിനുവേണ്ടി പ്രാർഥിക്കുന്ന ക്രിസ്തീയ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭ’ മലയാളത്തിലെ സ്ഥാപിതവും മതവിഭാഗനിരപേക്ഷവുമായ പ്രയോഗമാണ്.
- source_word: πρὸς τὸν θεὸν
  choice: ദൈവത്തോട്
  rationale: പ്രാർഥന ആരിലേക്കാണ് അഭിമുഖീകരിക്കപ്പെടുന്നതെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: περὶ αὐτοῦ
  choice: അദ്ദേഹത്തിനുവേണ്ടി
  rationale: മധ്യസ്ഥപ്രാർഥനയുടെ സന്ദർഭത്തിൽ περί + genitive എന്നതിന്റെ ഉചിതമായ അർഥം നൽകുന്നു.
- source_word: μὲν οὖν ... δὲ
  choice: അങ്ങനെ ... എന്നാൽ
  rationale: കഥനത്തിന്റെ മുന്നോട്ടുള്ള നീക്കവും പത്രോസിന്റെ തടങ്കലിനും സഭയുടെ പ്രാർഥനയ്ക്കുമിടയിലെ മൃദുവായ വൈരുധ്യവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐκκλησία എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: സഭ
  alternative: കൂട്ടായ്മ / സമൂഹം
  rationale: ഇവിടെ പത്രോസിനുവേണ്ടി പ്രാർഥിക്കുന്ന ക്രിസ്തീയ സമൂഹമാണ് ഉദ്ദേശ്യം. ‘സഭ’ സ്ഥാപിതമായ മലയാളപ്രയോഗമാണെങ്കിലും പിൽക്കാല സ്ഥാപനഘടനയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ഗ്രീക്കിലെ തുടർച്ചാഭാവം ‘പാർപ്പിച്ചിരുന്നു’, ‘പ്രാർഥിച്ചുകൊണ്ടിരുന്നു’ എന്നിവയിലൂടെ നിലനിർത്തി; യഥാർഥമായ ശബ്ദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
