id: ACT.12.24
reference: Acts 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ δὲ λόγος τοῦ ⸀θεοῦ ηὔξανεν καὶ ἐπληθύνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/024.yaml
  text: But the word of God continued to grow and multiply[a].
translation:
  language: ml
  text: എന്നാൽ ദൈവവചനം വളരുകയും പെരുകുകയും ചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ സന്ദേശം വളരുകയും പെരുകുകയും ചെയ്തുകൊണ്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: വചനം
  rationale: ലൂക്കോസിന്റെ രചനകളിൽ ആവർത്തിക്കുന്ന ‘ദൈവവചനം’ എന്ന പ്രയോഗവും ദൈവത്തിൽനിന്നുള്ള പ്രസംഗിക്കപ്പെട്ട സന്ദേശം എന്ന വിശാല അർഥവും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘സന്ദേശം’ എന്നും വിവർത്തനം ചെയ്യാം.
- source_word: τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിന്റേതോ ദൈവത്തിൽനിന്നു വരുന്നതോ ആയ വചനം/സന്ദേശം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള സംയുക്തപ്രയോഗം.
- source_word: ηὔξανεν
  choice: വളർന്നുകൊണ്ടും ... ഇരുന്നു
  rationale: അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചയായ പ്രവർത്തനഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπληθύνετο
  choice: പെരുകിക്കൊണ്ടും ഇരുന്നു
  rationale: മുൻക്രിയയിൽനിന്ന് വ്യത്യസ്തമായ ‘പെരുകുക’ എന്ന ആശയം നിലനിർത്തുകയും വചനത്തിന്റെ വ്യാപനവും ഫലവും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ഹെരോദാവിന്റെ മരണവിവരണത്തോടുള്ള ആഖ്യാനപരമായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവവചനം’ എന്നത് കൂടുതൽ ചലനാത്മകമായി ‘ദൈവത്തിന്റെ സന്ദേശം’ എന്നു നൽകണമോ
  choice: ദൈവവചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: ലൂക്കോസിന്റെ ആവർത്തിത പ്രയോഗവും തിരുവെഴുത്തുപരവും പ്രഘോഷണപരവുമായ വിശാല അനുരണനവും നിലനിർത്തുന്നു; അതേസമയം മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘വളർന്നുകൊണ്ടും പെരുകിക്കൊണ്ടും ഇരുന്നു’ എന്ന സമാന്തരഘടന ഗ്രീക്കിലെ രണ്ട് അപൂർണഭൂതകാല ക്രിയകളുടെ തുടർച്ചാഭാവവും വ്യത്യസ്ത ഊന്നലുകളും സംരക്ഷിക്കുന്നു.
