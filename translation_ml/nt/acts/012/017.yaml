  to: 'എന്നാൽ കൈകൊണ്ട് ആംഗ്യം കാട്ടി അവരോട് മിണ്ടാതിരിക്കാൻ പറഞ്ഞശേഷം, കർത്താവ് തന്നെ എങ്ങനെ കാരാഗൃഹത്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നുവെന്ന് അവൻ അവരോടു വിവരിച്ചു. പിന്നെ അവൻ പറഞ്ഞു: “ഈ കാര്യങ്ങൾ യാക്കോബിനെയും സഹോദരന്മാരെയും[a] അറിയിക്കൂ.” തുടർന്ന് അവൻ അവിടെനിന്ന് പുറപ്പെട്ട് മറ്റൊരു സ്ഥലത്തേക്കു പോയി.'
  rationale: പരിഷ്കാരം അർഥത്തിൽ മാറ്റം വരുത്തുന്നില്ല. കൈകൊണ്ടുള്ള നിശ്ശബ്ദതാസൂചന കൂടുതൽ സ്വാഭാവികമായി പുനഃക്രമീകരിക്കുകയും, ഗ്രീക്കിലെ ബഹുവചന ആജ്ഞ നേരിട്ട് പ്രതിഫലിപ്പിക്കാൻ “അറിയിക്കൂ” ഉപയോഗിക്കുകയും ചെയ്തു. പേരുകൾ, കർത്താവിന്റെ അവ്യക്തമായ സൂചിതവ്യക്തി, സഹോദരന്മാർ എന്ന പദം, അടിക്കുറിപ്പിന്റെ നങ്കൂരം എന്നിവ സംരക്ഷിച്ചു.
