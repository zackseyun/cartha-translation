  source_fidelity: 'മൂലഗ്രീക്കിലെ പ്രവർത്തനക്രമവും മുഖ്യാർഥവും കരട് പൊതുവേ കൃത്യമായി നൽകുന്നു: കൈകൊണ്ടുള്ള നിശ്ശബ്ദതാസൂചന, കർത്താവിന്റെ വിടുതൽ, യാക്കോബിനോടും സഹോദരന്മാരോടുമുള്ള അറിയിപ്പ്, പിന്നീടുള്ള പുറപ്പാട് എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ Ἀπαγγείλατε എന്ന നേരിട്ടുള്ള ബഹുവചന ആജ്ഞയെ “അറിയിക്കണം” എന്ന അവ്യക്ത/വിധേയപ്രയോഗമായി മാറ്റുന്നത് അല്പം ദുർബലമാണ്; നേരിട്ടുള്ള ആജ്ഞ ഉപയോഗിക്കുന്നത് ഉചിതമാണ്.'
  naturalness: “മിണ്ടാതിരിക്കാൻ കൈകൊണ്ട് അവരോടു ആംഗ്യം കാട്ടിയശേഷം” എന്ന പദക്രമം സ്വാഭാവിക മലയാളത്തിൽ അല്പം ഭാരമുള്ളതാണ്. “കൈകൊണ്ട് ആംഗ്യം കാട്ടി അവരോട് മിണ്ടാതിരിക്കാൻ പറഞ്ഞശേഷം” എന്നത് അതേ അർഥം വ്യക്തമായും ഒഴുക്കോടെയും നൽകുന്നു. “അവരോട്” ആധുനിക സാധാരണ പ്രയോഗമാണ്.
  terminology: “കർത്താവ്,” “കാരാഗൃഹം,” “യാക്കോബ്,” “സഹോദരന്മാർ” എന്നിവ ബൈബിൾസന്ദർഭത്തിനും ആധുനിക മാന്യമായ രജിസ്റ്ററിനും യോജിക്കുന്നു. “കർത്താവ്” എന്നത് κύριος-ന്റെ സൂചിതവ്യക്തിയെ അനാവശ്യമായി നിർണയിക്കുന്നില്ല. “സഹോദരന്മാർ” എന്ന മുഖ്യവാചകവും വിശാലസമൂഹസൂചന വ്യക്തമാക്കുന്ന അടിക്കുറിപ്പും നിലനിർത്തണം.
