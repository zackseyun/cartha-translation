id: ACT.12.17
reference: Acts 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: ml
  text: 'എന്നാൽ കൈകൊണ്ട് ആംഗ്യം കാട്ടി അവരോട് മിണ്ടാതിരിക്കാൻ പറഞ്ഞശേഷം, കർത്താവ് തന്നെ എങ്ങനെ കാരാഗൃഹത്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നുവെന്ന് അവൻ അവരോടു വിവരിച്ചു. പിന്നെ അവൻ പറഞ്ഞു: “ഈ കാര്യങ്ങൾ യാക്കോബിനെയും സഹോദരന്മാരെയും[a] അറിയിക്കൂ.” തുടർന്ന് അവൻ അവിടെനിന്ന് പുറപ്പെട്ട് മറ്റൊരു സ്ഥലത്തേക്കു പോയി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാരെയും”; ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്. സന്ദർഭമനുസരിച്ച് ഇത് വിശ്വാസികളുടെ വിശാലമായ സമൂഹത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: മിണ്ടാതിരിക്കാൻ കൈകൊണ്ട് ... ആംഗ്യം കാട്ടിയശേഷം
  rationale: കൂട്ടത്തെ നിശ്ശബ്ദരാക്കാൻ ഉദ്ദേശിച്ചുള്ള കൈയാംഗ്യം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആംഗ്യത്തിന്റെ കൃത്യരൂപം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: διηγήσατο
  choice: വിവരിച്ചു
  rationale: സംഭവം ക്രമമായി പറഞ്ഞറിയിക്കുന്നതും വിശദീകരിക്കുന്നതുമായ ക്രിയയുടെ അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: പത്രോസ് വിവരിച്ച കാര്യത്തിന്റെ രീതിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ ബൈബിൾ മലയാള പരിഭാഷ; ഇവിടെ ആരെയാണ് പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നതെന്നത് കൂടുതൽ നിർണയിക്കുന്നില്ല.
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: കാരാഗൃഹത്തിൽനിന്ന് പുറത്തുകൊണ്ടുവന്നു
  rationale: തടവുസ്ഥലത്തിൽനിന്നുള്ള വിടുതലും പുറത്തേക്കുള്ള നീക്കവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἀπαγγείλατε
  choice: അറിയിക്കണം
  rationale: പ്രധാന വിവരം മറ്റുള്ളവർക്കു കൈമാറാനുള്ള നിർദേശം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ ബഹുവചന ആജ്ഞ സന്ദർഭത്തിൽ കൂട്ടത്തോടുള്ള നിർദേശമായി നിലനിൽക്കുന്നു.
- source_word: Ἰακώβῳ
  choice: യാക്കോബ്
  rationale: Ἰακώβ എന്ന പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിലുള്ള സാധാരണ രൂപം.
- source_word: τοῖς ἀδελφοῖς
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ബഹുവചനം പ്രധാന വാചകത്തിൽ നിലനിർത്തുന്നു; വിശ്വാസിസമൂഹത്തെ വിശാലമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ പറയുന്നു.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: അവിടെനിന്ന് പുറപ്പെട്ട് ... പോയി
  rationale: നിലവിലെ സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലും മറ്റൊരിടത്തേക്കുള്ള യാത്രയും ആവർത്തനമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: εἰς ἕτερον τόπον
  choice: മറ്റൊരു സ്ഥലത്തേക്ക്
  rationale: സ്ഥലം ഏതെന്ന് വ്യക്തമാക്കാത്ത ഗ്രീക്ക് വാചകത്തിന്റെ അനിശ്ചിതത്വം അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: “കർത്താവ്” എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി ദൈവിക വിടുതലിന്റെ പ്രവർത്തകനെ സൂചിപ്പിച്ചു.
  alternative: പ്രത്യേകമായി “കർത്താവായ യേശു” എന്നോ പൊതുവായി “ദൈവം” എന്നോ വ്യക്തമാക്കുക.
  rationale: മൂലപാഠം κύριος എന്നു മാത്രമേ പറയുന്നുള്ളൂ. അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഇത് ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ പരിഭാഷ ആ സൂചിതവ്യക്തിയെ പാഠത്തിനപ്പുറം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. “കാരാഗൃഹം,” “കർത്താവ്” തുടങ്ങിയ പദങ്ങൾ ബൈബിൾ വായനയ്ക്ക് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പത്തിൽ ഗ്രഹിക്കാവുന്നതാണ്.
