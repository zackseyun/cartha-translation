id: ACT.12.15
reference: Acts 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: ml
  text: 'എന്നാൽ അവർ അവളോട് പറഞ്ഞു: “നിനക്കു ഭ്രാന്താണ്.” അവളോ, താൻ പറഞ്ഞത് സത്യമാണെന്ന് ഉറപ്പിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു. അവർ, “അത് അവന്റെ ദൂതനാണ്[a],” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ കാവൽദൂതൻ,’ ‘അവനെ പ്രതിനിധീകരിക്കുന്ന ദൂതൻ’; ചില വ്യാഖ്യാതാക്കളുടെ അഭിപ്രായത്തിൽ, ‘അവന്റെ ആത്മാവ്/പ്രേതം.’ ഗ്രീക്കിൽ ‘അവന്റെ ദൂതൻ’ എന്നു മാത്രമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Μαίνῃ
  choice: നിനക്കു ഭ്രാന്താണ്
  rationale: മാനസികനിലയെക്കുറിച്ചുള്ള ശക്തമായ, സന്ദർഭോചിതമായ ആരോപണം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വൈദ്യശാസ്ത്രപരമായ നിർണയഭാവം ഒഴിവാക്കുന്നു.
- source_word: διϊσχυρίζετο
  choice: ഉറപ്പിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും ക്രിയയുടെ ശക്തമായ ഉറപ്പിക്കൽഭാവവും ഒരുമിച്ചു പ്രകടമാക്കുന്നു.
- source_word: οὕτως ἔχειν
  choice: താൻ പറഞ്ഞത് സത്യമാണെന്ന്
  rationale: ‘കാര്യം അങ്ങനെ തന്നെയായിരുന്നു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലം സൂചിപ്പിക്കുന്ന തുടർന്നുള്ളതോ ആവർത്തിച്ചുള്ളതോ ആയ സംസാരത്തെ നിലനിർത്തുന്നു.
- source_word: ἄγγελός
  choice: ദൂതൻ
  rationale: ἄγγελος എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും ഈ സന്ദർഭത്തിലെ അതീന്ദ്രിയ ദൂതനെ സൂചിപ്പിക്കാനുള്ള മലയാള ബൈബിൾ പ്രയോഗവുമായി യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഗ്രീക്കിലെ ബന്ധസൂചക സർവനാമത്തെ സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘അവന്റെ ദൂതൻ’ എന്നതിന്റെ അർഥം
  choice: വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ ‘അവന്റെ ദൂതൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: അവന്റെ കാവൽദൂതൻ; അവനെ പ്രതിനിധീകരിക്കുന്ന ദൂതൻ; അവന്റെ ആത്മാവ്/പ്രേതം
  rationale: ഗ്രീക്ക് മൂലപാഠം ‘അവന്റെ ദൂതൻ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. ഒരു പ്രത്യേക ദൂതശാസ്ത്രപരമായോ മറ്റു സിദ്ധാന്തപരമായോ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചുമത്താതെ യഥാർഥമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. തുടർച്ച സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അപൂർണ്ണ ഭൂതകാലരൂപങ്ങൾ ‘-കൊണ്ടിരുന്നു’ ഉപയോഗിച്ച് പ്രതിഫലിപ്പിച്ചു; ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
