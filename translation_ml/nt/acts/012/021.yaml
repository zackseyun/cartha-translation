source:
  edition: SBLGNT
  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: ml
  text: നിശ്ചിതമായ ഒരു ദിവസത്തിൽ ഹെരോദാവ് രാജകീയ വസ്ത്രം[a] ധരിച്ച് ന്യായാസനത്തിൽ[b] ഇരുന്ന് അവരോടു പൊതുപ്രസംഗം നടത്തിക്കൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാജകീയ ഉടയാട്.’ ഗ്രീക്ക് പദം പൊതുവേ വസ്ത്രത്തെയോ വിശിഷ്ടമായ വസ്ത്രധാരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അധികാരപീഠത്തിൽ’ അല്ലെങ്കിൽ ‘ഉയർന്ന വേദിയിൽ.’ ഗ്രീക്കിലെ βῆμα എന്ന പദം ഔദ്യോഗിക ഇരിപ്പിടത്തെയോ ഉയർന്ന പീഠത്തെയോ സൂചിപ്പിക്കാറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ δὲ ἡμέρᾳ
  choice: നിശ്ചയിച്ചിരുന്ന ഒരു ദിവസം
  rationale: τακτός എന്നത് മുൻകൂട്ടി നിശ്ചയിച്ച സമയത്തെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേക പദമായി ചേർക്കാതെ സ്വാഭാവികമായ വാക്യക്രമത്തിലൂടെ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: ἐνδυσάμενος
  choice: ധരിച്ച്
  rationale: അഒറിസ്റ്റ് മധ്യകൃ​​ദന്തം ഹെരോദാവ് വസ്ത്രം ധരിച്ചശേഷമുള്ള പ്രവർത്തനക്രമം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ധരിച്ച്’ അത് സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐσθῆτα βασιλικὴν
  choice: രാജകീയ വസ്ത്രം
  rationale: ἐσθής പൊതുവായി വസ്ത്രമോ വിശിഷ്ടമായ ഉടയാടയോ സൂചിപ്പിക്കാം; ‘രാജകീയ വസ്ത്രം’ അതിനെ അനാവശ്യമായി ബഹുവചന ‘അങ്കികൾ’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: ന്യായാസനത്തിൽ ഇരുന്ന്
  rationale: βῆμα അധികാരപരമായ ഇരിപ്പിടത്തെയോ ഉയർന്ന ഔദ്യോഗിക പീഠത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ന്യായാസനം’ അതിന്റെ ഔദ്യോഗിക-ന്യായാധികാര ഭാവം നിലനിർത്തുന്നു; വിശാലമായ അർത്ഥപരിധി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐδημηγόρει
  choice: പൊതുപ്രസംഗം നടത്തിക്കൊണ്ടിരുന്നു
  rationale: δημηγορέω ഒരു പൊതുസമ്മേളനത്തെ അഭിസംബോധന ചെയ്യുന്നതാണ്; ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന പ്രവൃത്തിഭാവം ‘നടത്തിക്കൊണ്ടിരുന്നു’ വ്യക്തമാക്കുന്നു.
- source_word: πρὸς αὐτούς
  choice: അവരോടു
  rationale: πρός കൂടിയ അക്ക്യൂസറ്റീവ് ഇവിടെ പ്രസംഗം ആരെ ലക്ഷ്യമിട്ടായിരുന്നു എന്നു നേരിട്ട് വ്യക്തമാക്കുന്നു.
