translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഗ്രീക്ക് കൃ​​ദന്തങ്ങളുടെ പ്രവർത്തനക്രമം ‘ധരിച്ച് … ഇരുന്ന്’ എന്ന ഘടനയിൽ നിലനിർത്തി; ഇംപെർഫെക്റ്റിന്റെ തുടരുന്ന ഭാവം വ്യക്തമായി പ്രകടിപ്പിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ [a] അടയാളം ‘appointed day’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് ἐσθῆτα βασιλικὴν എന്ന പദത്തെക്കുറിച്ചായതിനാൽ ഉറവിടസാക്ഷ്യത്തിന് അനുസരിച്ച് അടയാളം ‘രാജകീയ വസ്ത്രം’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
