id: ACT.12.2
reference: Acts 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνεῖλεν δὲ Ἰάκωβον τὸν ἀδελφὸν Ἰωάννου μαχαίρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: ml
  text: അവൻ യോഹന്നാന്റെ സഹോദരനായ യാക്കോബിനെ വാൾകൊണ്ട് കൊന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വധിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം യാക്കോബിനെ കൊന്നുവെന്നാണ് നേരിട്ട് പറയുന്നത്; വിശാലസന്ദർഭം ഇത് ഔദ്യോഗികമായ വധശിക്ഷയായിരുന്നിരിക്കാമെന്ന് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: കൊന്നു
  rationale: ഇവിടെ ἀναιρέω ഒരാളുടെ മരണത്തിന് കാരണമാകുക, കൊല്ലുക എന്ന അർഥത്തിലാണ്. നിയമപരമായ വധശിക്ഷയാണെന്ന് മുഖ്യവാചകത്തിൽ അധികമായി വ്യക്തമാക്കാതെ ഗ്രീക്കിന്റെ നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലഘു ബന്ധകമാണ്. മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിൽ ‘അവൻ’ എന്നു തുടങ്ങുന്നതിലൂടെ അതിന്റെ ബന്ധകപ്രവർത്തനം വ്യക്തമായി വരുന്നതിനാൽ ‘പിന്നെ’ അല്ലെങ്കിൽ ‘എന്നാൽ’ ചേർത്ത് അനാവശ്യമായ കാലക്രമമോ വൈരുധ്യമോ സൂചിപ്പിച്ചിട്ടില്ല.
- source_word: Ἰάκωβον
  choice: യാക്കോബിനെ
  rationale: Ἰάκωβος എന്ന പേരിന്റെ മൂലഭാഷാസമീപമായ, മലയാളത്തിൽ പരിചിതമായ രൂപം ഉപയോഗിച്ചു.
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: യോഹന്നാന്റെ സഹോദരനായ
  rationale: ഏത് യാക്കോബാണെന്ന് തിരിച്ചറിയിക്കുന്ന സമാനാധികരണ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: μαχαίρῃ
  choice: വാൾകൊണ്ട്
  rationale: μάχαιρα വാൾ അഥവാ ചെറുവാൾ സൂചിപ്പിക്കുന്നു; ഇവിടെ ദത്തിവ് കാരകോപകരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വാൾകൊണ്ട്’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഹെരോദാവിന്റെ പ്രവൃത്തിയുടെ സ്വഭാവം
  choice: നിയമപരമായ വധശിക്ഷയെന്ന് മുഖ്യവാചകത്തിൽ നിർണ്ണയിക്കാതെ ‘കൊന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വധിച്ചു’ അല്ലെങ്കിൽ ‘വധശിക്ഷയ്ക്ക് വിധേയനാക്കി’ എന്നു നൽകുക.
  rationale: ἀνεῖλεν യാക്കോബിന്റെ മരണത്തിന് അവൻ കാരണമായി എന്ന് പറയുന്നു; μαχαίρῃ അതിന്റെ ഉപാധിയും വ്യക്തമാക്കുന്നു. വിശാലസന്ദർഭം ഔദ്യോഗികമായ ഭരണകൂടപീഡനത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ വാക്യം മാത്രം നിയമനടപടിയെ വ്യക്തമായി മുൻനിർത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘യാക്കോബ്’, ‘യോഹന്നാൻ’ എന്നീ പരിചിത ബൈബിൾ നാമരൂപങ്ങൾ നിലനിർത്തി; നിയമപരമായ അർഥം മുഖ്യവാചകത്തിൽ അധികമായി ചേർത്തിട്ടില്ല.
