id: ACT.12.10
reference: Acts 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: ml
  text: അവർ ഒന്നാമത്തെയും രണ്ടാമത്തെയും കാവൽസ്ഥാനങ്ങൾ കടന്ന്, നഗരത്തിലേക്കു നയിക്കുന്ന ഇരുമ്പുവാതിലിനടുത്തെത്തി. അത് അവർക്കായി തനിയെ തുറന്നു[a]. അവർ പുറത്തുകടന്ന് ഒരു തെരുവുദൂരം മുന്നോട്ടുപോയി[b]; ഉടനെ ദൂതൻ അവനെ വിട്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അത് അവർക്കായി സ്വയം തുറന്നു.”
    reason: lexical_alternative
  - marker: b
    text: “ഒരു തെരുവുദൂരം” എന്നത്, ദൂതൻ അവനെ വിട്ടുപോകുന്നതിനുമുമ്പ് അവർ ഒരു തെരുവിന്റെ നീളത്തോളം പോയി എന്നായിരിക്കാം അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: കടന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: φυλακὴν ... πρώτην ... καὶ δευτέραν
  choice: ഒന്നാമത്തെയും രണ്ടാമത്തെയും കാവൽസ്ഥാനങ്ങൾ
  rationale: സന്ദർഭത്തിൽ ഇത് അമൂർത്തമായ ‘കാവൽ’ എന്നതിലുപരി തുടർച്ചയായ സുരക്ഷാ നിലയങ്ങളെയോ കാവൽപ്പാടുകളെയോ സൂചിപ്പിക്കുന്നു; ‘കാവൽസ്ഥാനങ്ങൾ’ ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: πύλην τὴν σιδηρᾶν
  choice: ഇരുമ്പുവാതിൽ
  rationale: വാതിലിന്റെ നിർമ്മാണവസ്തുവിനുള്ള മൂലപാഠത്തിലെ ഊന്നൽ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: നഗരത്തിലേക്കു നയിക്കുന്ന
  rationale: വാതിൽ നൽകുന്ന പ്രവേശനദിശയെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: αὐτομάτη
  choice: തനിയെ
  rationale: മനുഷ്യസഹായമില്ലാതെ വാതിൽ തുറന്നുവെന്ന അത്ഭുതസ്വഭാവം അറിയിക്കുമ്പോൾ ആധുനിക യന്ത്രസാങ്കേതിക അർഥമുള്ള ‘ഓട്ടോമാറ്റിക്കായി’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἠνοίγη αὐτοῖς
  choice: അവർക്കായി ... തുറന്നു
  rationale: നിഷ്ക്രിയ ക്രിയയോടുകൂടിയ ദത്തിവ് അവരുടെ പ്രയോജനത്തിനായി വാതിൽ തുറന്നുവെന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: ῥύμην μίαν
  choice: ഒരു തെരുവുദൂരം
  rationale: അക്കൂസറ്റീവ് ഇവിടെ സഞ്ചരിച്ച ദൂരം സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ, വെറും ‘ഒരു തെരുവ്’ എന്നതിനെക്കാൾ ‘ഒരു തെരുവുദൂരം’ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εὐθέως
  choice: ഉടനെ
  rationale: സംഭവങ്ങൾക്കിടയിലെ തത്സമയ തുടർച്ച ലൂക്കോസിന്റെ ആഖ്യാനശൈലിക്ക് യോജിച്ച ലളിതമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: ദൂതൻ അവനെ വിട്ടുപോയി
  rationale: ദൂതൻ പത്രോസിൽനിന്ന് അകന്നുപോയെന്ന മൂലപാഠത്തിന്റെ ലളിതമായ പ്രസ്താവന അധിക വ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാതിൽ തുറന്നതിന്റെ സ്വഭാവം
  choice: അത് അവർക്കായി തനിയെ തുറന്നു
  alternative: അത് അവർക്കായി സ്വയം തുറന്നു
  rationale: മൂലപാഠം സംഭവത്തെ അത്ഭുതകരമായി അവതരിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ യാന്ത്രിക വാതിലിന്റെ ആധുനിക ധ്വനി ഒഴിവാക്കി ആ തുറക്കൽ മനുഷ്യപ്രവർത്തനമില്ലാതെ സംഭവിച്ചതായി മാത്രം പറയുന്നു.
- issue: φυλακή എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: കാവൽസ്ഥാനങ്ങൾ
  alternative: കാവലുകൾ
  rationale: പത്രോസ് തുടർച്ചയായ സുരക്ഷാ നിലകൾ കടക്കുന്നതാണ് ആഖ്യാനസന്ദർഭം. ‘കാവൽസ്ഥാനങ്ങൾ’ സ്ഥലപരമായ അർഥം വ്യക്തമാക്കുന്നു; ഒന്നിലധികം തടവറകൾ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘കാവൽസ്ഥാനങ്ങൾ’, ‘ഒരു തെരുവുദൂരം’ എന്നീ പ്രയോഗങ്ങൾ മൂലപാഠത്തിന്റെ സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; അതേസമയം അടിക്കുറിപ്പുകൾ യഥാർത്ഥ ഭാഷാപരമായ സാധ്യതകൾ സംരക്ഷിക്കുന്നു.
