id: ACT.12.11
reference: Acts 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ⸂ἐν ἑαυτῷ γενόμενος⸃ εἶπεν· Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν ⸀ὁ κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: ml
  text: 'പത്രോസ് സ്വബോധം വീണ്ടെടുത്ത്[a] പറഞ്ഞു: “കർത്താവ് തന്റെ ദൂതനെ അയച്ച് എന്നെ ഹെരോദാവിന്റെ കൈയിൽനിന്നും[b] യഹൂദജനം പ്രതീക്ഷിച്ചിരുന്നതിൽനിന്നെല്ലാം[c] വിടുവിച്ചുവെന്ന് ഇപ്പോൾ എനിക്ക് തീർച്ചയായി അറിയാം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “തന്നിലേക്കു വന്നശേഷം”; അഥവാ “ബോധം തെളിഞ്ഞപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: “ഹെരോദാവിന്റെ കൈയിൽനിന്നും” എന്നത് ഹെരോദാവിന്റെ അധികാരത്തിൽനിന്നോ നിയന്ത്രണത്തിൽനിന്നോ എന്നാണ്.
    reason: cultural_note
  - marker: c
    text: 'അക്ഷരാർഥത്തിന് അടുത്ത രൂപം: “യഹൂദജനത്തിന്റെ സകല പ്രതീക്ഷയിൽനിന്നും.” അതായത്, പത്രോസിന് സംഭവിക്കുമെന്ന് അവർ പ്രതീക്ഷിച്ചിരുന്നതിൽനിന്നെല്ലാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: സ്വബോധം വീണ്ടെടുത്ത്
  rationale: പത്രോസ് ദർശനംപോലെയുള്ള അനുഭവത്തിനുശേഷം പൂർണബോധത്തിലേക്കു മടങ്ങിയതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിലെ രൂപകം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀληθῶς
  choice: തീർച്ചയായി
  rationale: പത്രോസിന് ഇപ്പോൾ ഉണ്ടായ ഉറച്ച ബോധ്യത്തിന്റെ ഊന്നൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐξαπέστειλεν
  choice: അയച്ച്
  rationale: ഈ സന്ദർഭത്തിൽ ‘അയച്ചു’ എന്ന ലളിതമായ പ്രയോഗം ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ഗ്രീക്കിൽ പരാമർശിക്കപ്പെടുന്ന വ്യക്തിയെ കൂടുതൽ വ്യക്തമാക്കാതെ, κύριος എന്ന പദത്തിന്റെ സാധാരണ ബൈബിൾപരമായ മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: ἄγγελον
  choice: ദൂതനെ
  rationale: കഥാസന്ദർഭം സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദൂതൻ’ മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐξείλατό με
  choice: എന്നെ ... വിടുവിച്ചു
  rationale: അപകടകരമായ അധികാരത്തിൽനിന്നും പ്രതീക്ഷിക്കപ്പെട്ട ദോഷഫലത്തിൽനിന്നുമുള്ള ദൈവിക രക്ഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: ഹെരോദാവിന്റെ കൈയിൽനിന്നും
  rationale: അധികാരമോ നിയന്ത്രണമോ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ ‘കൈ’ എന്ന രൂപകം മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതായതിനാൽ നിലനിർത്തുന്നു.
- source_word: πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων
  choice: യഹൂദജനം പ്രതീക്ഷിച്ചിരുന്നതിൽനിന്നെല്ലാം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന മലയാളത്തിൽ അതേപടി നൽകിയാൽ അസ്വാഭാവികമാകുന്നതിനാൽ, യഹൂദജനം പത്രോസിന് സംഭവിക്കുമെന്ന് പ്രതീക്ഷിച്ചിരുന്ന മുഴുവൻ ഫലത്തെയും വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്നതിന്റെ പരാമർശിതൻ
  choice: കർത്താവ്
  alternative: ദൈവം; ഉയിർത്തെഴുന്നേറ്റ യേശു
  rationale: വാക്യം κύριος എന്ന പദത്തിന്റെ പരാമർശിതനെ പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ‘ദൈവം’ എന്നോ ‘യേശു’ എന്നോ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കർത്താവ്’, ‘ദൂതൻ’, ‘വിടുവിച്ചു’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ദുഷ്കരമായ ഗ്രീക്ക് ജനിറ്റീവ് ഘടന വായനാസൗകര്യത്തിനായി സ്വാഭാവിക മലയാളമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
