- from: അത് യഹൂദർക്ക്[a] ഇഷ്ടമാണെന്നു കണ്ടപ്പോൾ, അവൻ പത്രോസിനെയും പിടികൂടാൻ മുതിർന്നു. (അന്ന് പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങളായിരുന്നു[b].)
