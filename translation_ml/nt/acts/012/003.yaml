id: ACT.12.3
reference: Acts 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἰδὼν δὲ⸃ ὅτι ἀρεστόν ἐστιν τοῖς Ἰουδαίοις προσέθετο συλλαβεῖν καὶ Πέτρον (ἦσαν ⸀δὲ ἡμέραι τῶν ἀζύμων),
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: ml
  text: യഹൂദർക്ക് അത് ഇഷ്ടമായെന്ന് കണ്ടപ്പോൾ, പത്രോസിനെയും പിടികൂടാൻ അവൻ നടപടി സ്വീകരിച്ചു. (അന്ന് പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങളായിരുന്നു[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: പെസഹയ്ക്കു പിന്നാലെ പുളിപ്പില്ലാത്ത അപ്പം ഭക്ഷിച്ചിരുന്ന ഉത്സവകാലത്തെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: കണ്ടപ്പോൾ
  rationale: വർത്തമാനത്തിലെ അടുത്ത നടപടിക്കു മുമ്പുള്ള ഹെരോദാവിന്റെ തിരിച്ചറിവിനെ കാലസൂചനയോടെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; δέ നൽകുന്ന കഥാഗതിമാറ്റം മലയാള വാക്യക്രമത്തിൽ പ്രകടമാകുന്നു.
- source_word: ἀρεστόν ἐστιν
  choice: ഇഷ്ടമാണ്
  rationale: ἀρεστόν എന്നതിന്റെ ‘പ്രസാദകരം/സ്വീകാര്യം’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῖς Ἰουδαίοις
  choice: യഹൂദർക്ക്
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ വംശീയ-മതപരമായ സൂചന നിലനിർത്തുന്നു; സന്ദർഭം മാത്രം ആശ്രയിച്ച് ‘നേതാക്കൾ’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: προσέθετο
  choice: മുതിർന്നു
  rationale: ക്രിയാനന്തര infinitive-നോടുകൂടിയ προστίθημι ഇവിടെ മറ്റൊരു നടപടി കൈക്കൊള്ളുക/തുടർന്നു ചെയ്യുക എന്നാണ്; അക്ഷരാർഥമായ ‘കൂട്ടിച്ചേർത്തു’ എന്നതിനേക്കാൾ ‘മുതിർന്നു’ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: συλλαβεῖν
  choice: പിടികൂടാൻ
  rationale: ഈ ഭരണ-നിയമപരമായ സന്ദർഭത്തിൽ ഒരാളെ കസ്റ്റഡിയിലെടുക്കുന്നതിനായി പിടിക്കുന്നതിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: καὶ Πέτρον
  choice: പത്രോസിനെയും
  rationale: യാക്കോബിനു പിന്നാലെ പത്രോസും മറ്റൊരു ലക്ഷ്യമായെന്ന καί-യുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-നെയും’ വഴി നിലനിർത്തുന്നു.
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: അന്ന് പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങളായിരുന്നു
  rationale: കാലസന്ദർഭം നൽകുന്ന ഇടക്കുറിപ്പ് നിലനിർത്തുകയും ‘പെസഹ’ എന്നു മാറ്റാതെ ഗ്രീക്കിലെ പ്രത്യേക ഉത്സവനാമപ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പ്രവൃത്തികളിൽ Ἰουδαίοις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: യഹൂദർ
  alternative: യെഹൂദ്യർ; യഹൂദനേതാക്കൾ
  rationale: മൂലപാഠം ഭൂമിശാസ്ത്രപരമായോ നേതൃത്വപരമായോ പരിധി വ്യക്തമായി നിശ്ചയിക്കുന്നില്ല. അതിനാൽ വിശാലമായ പദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- issue: τῶν ἀζύμων എന്ന ഉത്സവപ്രയോഗം
  choice: പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങൾ
  alternative: പെസഹാക്കാലം; പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ പെരുന്നാൾ
  rationale: ഗ്രീക്ക് പാഠം ‘പെസഹ’ എന്നല്ല, പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങൾ എന്നാണ് പറയുന്നത്. ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പേരുകൾ ഒന്നാക്കി മാറ്റാതിരിക്കാൻ മൂലപ്രയോഗം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. ‘യഹൂദർ’ എന്ന വിശാല പദവും ‘പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെ ദിവസങ്ങൾ’ എന്ന പ്രത്യേക ഉത്സവപ്രയോഗവും വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
