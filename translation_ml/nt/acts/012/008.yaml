id: ACT.12.8
reference: Acts 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: ml
  text: 'ദൂതൻ അവനോട് പറഞ്ഞു: “അരപ്പട്ട കെട്ടി ചെരിപ്പുകൾ ധരിക്കൂ.” അവൻ അങ്ങനെ ചെയ്തു. പിന്നെ ദൂതൻ അവനോട് പറയുന്നു:[a] “മേലങ്കി ചുറ്റിയിട്ട് എന്നെ അനുഗമിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ “പറയുന്നു”; ആഖ്യാനത്തിന് സജീവത നൽകുന്ന ചരിത്രവർത്തമാനകാലപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: തടവറയിൽ പ്രത്യക്ഷപ്പെട്ട സ്വർഗീയ സത്തയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിൽ ‘ദൂതൻ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: Ζῶσαι
  choice: അരപ്പട്ട കെട്ടി
  rationale: ζώννυμι എന്ന ക്രിയ വസ്ത്രം ഒതുക്കി അരപ്പട്ട മുറുക്കുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘അരപ്പട്ട കെട്ടി’ ആ നിർദേശം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: ചെരിപ്പുകൾ ധരിക്കൂ
  rationale: സന്ദർഭത്തിലെ σανδάλια പാദരക്ഷകളാണ്; ‘ചെരിപ്പുകൾ ധരിക്കൂ’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: ἐποίησεν δὲ οὕτως
  choice: അവൻ അങ്ങനെ ചെയ്തു
  rationale: മുൻപുള്ള നിർദേശങ്ങൾ പത്രോസ് അനുസരിച്ചതിനെ οὕτως സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലരൂപമായ λέγει ചരിത്രവർത്തമാനമായി ആഖ്യാനത്തിന് സജീവത നൽകുന്നു; അത് മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: മേലങ്കി ചുറ്റിയിട്ട്
  rationale: ἱμάτιον പുറമേ ധരിക്കുന്ന മേലങ്കിയെയും περιβάλλω അത് ശരീരത്തിനു ചുറ്റും ഇടുന്നതിനെയും സൂചിപ്പിക്കുന്നു; ഈ രൂപം രണ്ടും സംക്ഷിപ്തമായി പകർത്തുന്നു.
- source_word: ἀκολούθει μοι
  choice: എന്നെ അനുഗമിക്കൂ
  rationale: ἀκολουθέω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘പിന്തുടരുക/അനുഗമിക്കുക’ നിലനിർത്തുന്നു; ഇവിടെ ശാരീരികമായി പിന്നാലെ ചെല്ലാനുള്ള നിർദേശമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ഗ്രീക്കിലെ ക്രിയാകാലമാറ്റം അടിക്കുറിപ്പോടെ നിലനിർത്തി; പുരാതന വസ്ത്രധാരണപ്രവൃത്തികൾ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ വ്യക്തമാക്കി.
