  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ δῆμος ἐπεφώνει· ⸂Θεοῦ φωνὴ⸃ καὶ οὐκ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/022.yaml
  text: And the crowd kept shouting[a], “The voice of a god, and not of a man!”
translation:
  language: ml
  text: ജനക്കൂട്ടം, “ഒരു ദേവന്റെ[a] ശബ്ദം; മനുഷ്യന്റേതല്ല!” എന്നു വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ ശബ്ദം; മനുഷ്യന്റേതല്ല!” ഗ്രീക്ക് വാചകം ഇങ്ങനെയും വായിക്കാം; എന്നാൽ ഹെരോദാവിനെ ദൈവികനായി പുകഴ്ത്തുന്ന വിജാതീയ ജനക്കൂട്ടമാണ് സംസാരിക്കുന്നതെന്ന സന്ദർഭത്തിൽ “ഒരു ദേവന്റെ” എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: δῆμος
  choice: ജനക്കൂട്ടം
  rationale: ഇവിടെ ഔപചാരികമായ ഒരു രാഷ്ട്രീയസഭയെയല്ല, ഒത്തുകൂടിയ പൊതുജനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആ രംഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗമാണിത്.
- source_word: ἐπεφώνει
  choice: വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുകയോ ആവർത്തിക്കുകയോ ചെയ്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ഒറ്റത്തവണത്തെ ‘വിളിച്ചുപറഞ്ഞു’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: Θεοῦ
  choice: ഒരു ദേവന്റെ
  rationale: വിഗ്രഹാരാധക പശ്ചാത്തലത്തിൽ ഹെരോദാവിനെ ദൈവികനായി പുകഴ്ത്തുന്ന ജനക്കൂട്ടത്തിന്റെ പ്രഖ്യാപനമാണിത്. ആർട്ടിക്കിൾ ഇല്ലാത്ത θεοῦ ഇവിടെ പൊതുവായ അർഥത്തിൽ ‘ഒരു ദേവന്റെ’ എന്നു മനസ്സിലാക്കുന്നതാണ് സന്ദർഭോചിതം.
- source_word: φωνὴ
  choice: ശബ്ദം
  rationale: നാമരൂപത്തിലുള്ള ഹ്രസ്വവും ആവേശഭരിതവുമായ പ്രഖ്യാപനം നിലനിർത്തുന്നു; ഹെരോദാവിന്റെ സംസാരശബ്ദത്തെയാണ് നേരിട്ട് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνθρώπου
  choice: മനുഷ്യന്റേതല്ല
  rationale: ‘ഒരു ദേവന്റെ’ എന്നതിനോടുള്ള നേരിട്ടുള്ള ഏകവചനവിരുദ്ധത മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: θεοῦ എന്നത് ‘ദൈവത്തിന്റെ’ എന്നോ ‘ഒരു ദേവന്റെ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ഒരു ദേവന്റെ
  alternative: ദൈവത്തിന്റെ
  rationale: ജനക്കൂട്ടം ഹെരോദാവിന് ദൈവിക ബഹുമതി നൽകുന്ന വിജാതീയ പശ്ചാത്തലവും ഗ്രീക്കിൽ ആർട്ടിക്കിൾ ഇല്ലാത്തതും പരിഗണിക്കുമ്പോൾ ‘ഒരു ദേവന്റെ’ എന്നതാണ് കൂടുതൽ സാധ്യതയുള്ള അർഥം. എന്നാൽ ‘ദൈവത്തിന്റെ’ എന്ന വായനയ്ക്കുള്ള ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ ഹ്രസ്വമായ പ്രഖ്യാപനഭാവം അർധവിരാമത്തിലൂടെ നിലനിർത്തി; അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം ‘വിളിച്ചുപറഞ്ഞുകൊണ്ടിരുന്നു’ എന്നതിൽ പ്രകടമാക്കി.
