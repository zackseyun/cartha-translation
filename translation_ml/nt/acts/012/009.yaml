  source_fidelity: ഗ്രീക്കിലെ ക്രമം, പ്രധാന ആശയങ്ങൾ, കാലഭാവങ്ങൾ എന്നിവ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ἐξελθὼν ἠκολούθει എന്ന തുടർച്ചയായ ആഖ്യാനപ്രവർത്തനം ‘പുറത്തേക്കിറങ്ങി ദൂതന്റെ പിന്നാലെ ചെന്നു’ എന്നതിൽ സ്വാഭാവികമായി വരുന്നു. സന്ദർഭത്തിൽ വ്യക്തമായിരിക്കുന്ന ദൂതനെ അനുഗമിച്ചതാണെന്ന ആശയം ചേർത്തുപറയുന്നത് അർഥവർധനയല്ല. ‘ദൂതൻ മുഖാന്തരം സംഭവിച്ചുകൊണ്ടിരുന്നത് യാഥാർഥ്യമാണെന്ന്’ τὸ γινόμενον διὰ τοῦ ἀγγέλου ἀληθές എന്നതിന്റെ സംഭവിച്ചുകൊണ്ടിരിക്കുന്നതും യാഥാർഥ്യവുമായ സ്വഭാവം സൂക്ഷിക്കുന്നു. അവസാനഭാഗം പത്രോസിന്റെ തെറ്റായ ധാരണയായ ദർശനാനുഭവത്തെ കൃത്യമായി നൽകുന്നു.
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സുഗമവുമാണ്. ‘അവന് അറിയില്ലായിരുന്നു’ എന്നും ‘അവൻ കരുതിയത്’ എന്നും ആഖ്യാനശൈലിക്ക് യോജിക്കുന്നു. അർധവിരാമം രണ്ടു വിരുദ്ധ ധാരണകളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
  terminology: ‘ദൂതൻ,’ ‘യാഥാർഥ്യം,’ ‘ദർശനം’ എന്നിവ പ്രസക്തവും സ്ഥിരതയുള്ളതുമായ പദങ്ങളാണ്. ‘ദൂതൻ മുഖാന്തരം’ διά + genitive-ന്റെ മധ്യസ്ഥ/കാര്യകത്വസാധ്യത നിലനിർത്തുന്നു; പാദക്കുറിപ്പിലെ ‘ദൂതനാൽ’ എന്ന ബദൽ യുക്തമാണ്.
