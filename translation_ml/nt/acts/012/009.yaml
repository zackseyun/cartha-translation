  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: ml
  text: അവൻ പുറത്തേക്കിറങ്ങി ദൂതന്റെ പിന്നാലെ ചെന്നു. ദൂതൻ മുഖാന്തരം[a] സംഭവിച്ചുകൊണ്ടിരുന്നത് യാഥാർഥ്യമാണെന്ന് അവന് അറിയില്ലായിരുന്നു; താൻ ഒരു ദർശനം കാണുകയാണെന്നാണ് അവൻ കരുതിയത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൂതനാൽ.’ ഗ്രീക്കുപദപ്രയോഗത്തിന് പ്രവർത്തകനെ സൂചിപ്പിക്കാനും കഴിയും; ‘ദൂതൻ മുഖാന്തരം’ എന്ന പരിഭാഷ അതിലെ മധ്യസ്ഥഭാവം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: പുറത്തേക്കിറങ്ങി
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പുറപ്പെടൽ സ്വാഭാവികമായ മലയാള ആഖ്യാനക്രമത്തിൽ സംയോജക ക്രിയാരൂപമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἠκολούθει
  choice: ദൂതന്റെ പിന്നാലെ ചെന്നു
  rationale: അപൂർണഭൂതകാലം തുടർന്നുകൊണ്ടിരുന്ന അനുഗമനത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ആരെയാണ് അനുഗമിച്ചതെന്ന് വ്യക്തമാക്കാൻ ‘ദൂതന്റെ’ എന്നു ചേർത്തു, ‘പിന്നാലെ ചെന്നു’ എന്നത് സ്വാഭാവികമായ മലയാള പ്രയോഗമാണ്.
- source_word: οὐκ ᾔδει
  choice: അവന് അറിയില്ലായിരുന്നു
  rationale: അറിവില്ലായ്മയെയോ ബോധ്യമില്ലായ്മയെയോ നേരിട്ട്, സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀληθές
  choice: യാഥാർഥ്യം
  rationale: ദർശനമെന്ന ധാരണയോടുള്ള വൈരുധ്യത്തിൽ സംഭവത്തിന്റെ വാസ്തവികതയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘സത്യം’ എന്നതിനെക്കാൾ ‘യാഥാർഥ്യം’ കൃത്യമാണ്.
- source_word: τὸ γινόμενον
  choice: സംഭവിച്ചുകൊണ്ടിരുന്നത്
  rationale: ആ സമയത്ത് പുരോഗമിച്ചുകൊണ്ടിരുന്ന സംഭവത്തെ articular participle സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ ἀγγέλου
  choice: ദൂതൻ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥമായ പ്രവർത്തകത്വം നിലനിർത്തുന്നു; ദൂതൻ സ്വതന്ത്രമായി പ്രവർത്തിച്ചു എന്ന അധിക അവകാശവാദം ഒഴിവാക്കുന്നു.
- source_word: ἐδόκει
  choice: കരുതിയത്
  rationale: പത്രോസിന്റെ അന്നത്തെ ധാരണയെ ലളിതവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὅραμα
  choice: ഒരു ദർശനം
  rationale: വെളിപ്പാടുസ്വഭാവമുള്ളതോ അസാധാരണമായതോ ആയ കാഴ്ചയ്ക്കുള്ള പതിവ് പുതിയനിയമ പദപ്രയോഗം.
- source_word: βλέπειν
  choice: കാണുകയാണെന്ന്
  rationale: ἐδόκει-യോടൊപ്പമുള്ള infinitive പത്രോസ് താൻ അനുഭവിക്കുന്നതായി കരുതിയ ദൃശ്യാനുഭവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൂതന്റെ പ്രവർത്തനത്തിന്റെ സ്വഭാവം
  choice: ദൂതൻ മുഖാന്തരം
  alternative: ദൂതനാൽ
  rationale: ഗ്രീക്കിലെ διά + genitive പ്രവർത്തകത്വമോ മധ്യസ്ഥതയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ ‘മുഖാന്തരം’ ഉപയോഗിക്കുന്നത് മധ്യസ്ഥഭാവം നിലനിർത്തുകയും ദൂതന്റെ സ്വതന്ത്ര ശക്തിയെക്കുറിച്ച് വാചകത്തിനപ്പുറമുള്ള ദൈവശാസ്ത്ര നിഗമനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, ഗൗരവമുള്ള ആഖ്യാനശൈലി. ദർശനവും യഥാർഥ സംഭവവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
