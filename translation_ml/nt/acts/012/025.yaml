source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ καὶ Σαῦλος ὑπέστρεψαν, ⸀εἰς Ἰερουσαλὴμ πληρώσαντες τὴν διακονίαν, ⸀συμπαραλαβόντες Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/025.yaml
  text: But Barnabas and Saul returned to Jerusalem after completing the ministry, taking along John, who was called Mark.
translation:
  language: ml
  text: എന്നാൽ ബർന്നബാസും ശൗലും ആ ശുശ്രൂഷ പൂർത്തിയാക്കിയശേഷം യെരൂശലേമിലേക്കു മടങ്ങി[a]. മർക്കോസ് എന്നു വിളിക്കപ്പെട്ട യോഹന്നാനെയും അവർ കൂടെ കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യെരൂശലേമിലേക്ക്’ എന്നതിനുപകരം ‘യെരൂശലേമിൽനിന്ന്’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: മടങ്ങി
  rationale: ὑποστρέφω എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘തിരികെ പോകുക/മടങ്ങുക’ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ εἰς സാധാരണയായി ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നതിനാൽ ‘യെരൂശലേമിലേക്കു’ എന്നു പരിഭാഷപ്പെടുത്തി; വ്യത്യസ്ത കൈയെഴുത്തുപ്രതികളുടെ വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: πληρώσαντες τὴν διακονίαν
  choice: തങ്ങളുടെ ശുശ്രൂഷ പൂർത്തിയാക്കിയശേഷം
  rationale: πληρόω ഇവിടെ പൂർത്തിയാക്കുക എന്നും διακονία സേവനം/ശുശ്രൂഷ എന്നും അർഥമാക്കുന്നു. സന്ദർഭം സഹായവിതരണവുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും ഗ്രീക്കിലെ വിശാലമായ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: συμπαραλαβόντες
  choice: കൂടെ കൊണ്ടുപോയി
  rationale: ഒരാളെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊണ്ടുപോകുന്ന അനുബന്ധപ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: മർക്കോസ് എന്നു വിളിക്കപ്പെട്ട യോഹന്നാൻ
  rationale: ἐπικαλέω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ‘എന്നു വിളിക്കപ്പെട്ട’ എന്നു സുതാര്യമായി നൽകുന്നു; മൂലപാഠത്തിൽ ‘കൂടാതെ/also’ എന്ന പദമില്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: യെരൂശലേം ലക്ഷ്യസ്ഥാനമോ പുറപ്പെട്ട സ്ഥലമോ എന്ന പാഠഭേദം
  choice: യെരൂശലേമിലേക്കു
  alternative: യെരൂശലേമിൽനിന്ന്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം εἰς Ἰερουσαλήμ (‘യെരൂശലേമിലേക്ക്’) എന്നാണ്. സന്ദർഭത്തോട് കൂടുതൽ എളുപ്പം പൊരുത്തപ്പെടുന്ന ἐξ Ἰερουσαλήμ (‘യെരൂശലേമിൽനിന്ന്’) എന്ന കൈയെഴുത്തുപ്രതി വായന അർഥത്തെ ഗണ്യമായി ബാധിക്കുന്നതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷ’ സഭാപരമായ അർഥത്തിൽ മാത്രം ചുരുക്കാതെ സേവനം എന്ന വിശാലതയും വഹിക്കുന്നതിനായി ഉപയോഗിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി.
