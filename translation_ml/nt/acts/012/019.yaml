id: ACT.12.19
reference: Acts 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: ml
  text: എന്നാൽ ഹെരോദാവ് അവനെ അന്വേഷിച്ചെങ്കിലും കണ്ടെത്താതിരുന്നപ്പോൾ, കാവൽക്കാരെ ചോദ്യംചെയ്ത് അവരെ വധശിക്ഷയ്ക്കായി കൊണ്ടുപോകാൻ കല്പിച്ചു.[a] പിന്നെ അവൻ യെഹൂദ്യയിൽനിന്ന് കൈസര്യയിലേക്കു ഇറങ്ങിച്ചെന്ന് അവിടെ താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവരെ കൊണ്ടുപോകാൻ കല്പിച്ചു.” ഈ സന്ദർഭത്തിൽ ഇത് അവരെ വധശിക്ഷയ്ക്കായി കൊണ്ടുപോകാനുള്ള ഉത്തരവിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: ἀπαχθῆναι എന്ന ക്രിയയുടെ അക്ഷരാർഥവും സന്ദർഭത്തിൽ സൂചിപ്പിക്കപ്പെടുന്ന വധശിക്ഷയും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: അന്വേഷിച്ചിട്ടും
  rationale: പത്രോസിനെ കണ്ടെത്താനുള്ള ബോധപൂർവമായ ശ്രമത്തെയും തുടർന്നുണ്ടായ പരാജയത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: μὴ εὑρὼν
  choice: കണ്ടെത്താതിരുന്നതിനാൽ
  rationale: തിരച്ചിലിനു ശേഷമുള്ള പരാജയവും അതിനെത്തുടർന്നുള്ള കാവൽക്കാരുടെ ചോദ്യംചെയ്യലുമായുള്ള സന്ദർഭബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: ἀνακρίνας
  choice: ചോദ്യംചെയ്തശേഷം
  rationale: ഔദ്യോഗികമോ ന്യായപരമോ ആയ അന്വേഷണത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; വെറും സംഭാഷണമെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: φύλακας
  choice: കാവൽക്കാരെ
  rationale: പത്രോസിനെ കാക്കാൻ നിയോഗിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: അവരെ വധിക്കാൻ കൊണ്ടുപോകാൻ കല്പിച്ചു
  rationale: ἀπαχθῆναι എന്നതിന്റെ അടിസ്ഥാനമായ ‘കൊണ്ടുപോകുക’ എന്ന ചലനാർഥം നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിൽ ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്ന വധശിക്ഷയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: κατελθὼν
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: ഉൾനാടൻ യെഹൂദ്യയിൽനിന്ന് തീരപ്രദേശമായ കൈസര്യയിലേക്കുള്ള യാത്രയെ വിവരിക്കുന്ന ഗ്രീക്ക് ഭൂമിശാസ്ത്രപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: Ἰουδαίας
  choice: യെഹൂദ്യ
  rationale: പ്രദേശനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: Καισάρειαν
  choice: കൈസര്യ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: διέτριβεν
  choice: അവിടെ താമസിച്ചു
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയായ അവിടെ പാർക്കലിനെ ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀπαχθῆναι എന്നത് അക്ഷരാർഥത്തിൽ മാത്രം ‘കൊണ്ടുപോകുക’ എന്നു പരിഭാഷപ്പെടുത്തണമോ, സന്ദർഭം സൂചിപ്പിക്കുന്ന ശിക്ഷ വ്യക്തമാക്കണമോ
  choice: വധിക്കാൻ കൊണ്ടുപോകാൻ കല്പിച്ചു
  alternative: അവരെ കൊണ്ടുപോകാൻ കല്പിച്ചു
  rationale: ഗ്രീക്കിൽ ‘കൊല്ലുക’ എന്ന സാധാരണ ക്രിയ നേരിട്ട് ഉപയോഗിച്ചിട്ടില്ല. എങ്കിലും തടവുകാരനെ നഷ്ടപ്പെടുത്തിയ കാവൽക്കാരെക്കുറിച്ചുള്ള ഹെരോദാവിന്റെ ഉത്തരവ് ഈ സന്ദർഭത്തിൽ വധശിക്ഷയെ ശക്തമായി സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠം ആ അർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പ് അക്ഷരാർഥം രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ക്രിയകളുടെ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; ‘ഇറങ്ങിച്ചെന്ന്’ എന്ന രൂപം മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രഭാഷ സംരക്ഷിക്കുന്നു.
