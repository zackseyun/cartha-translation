  naturalness: പരിഷ്കരിച്ച പാഠം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമായ ആഖ്യാനശൈലി നിലനിർത്തുന്നു. “വധശിക്ഷയ്ക്കായി കൊണ്ടുപോകാൻ” എന്ന പ്രയോഗം മുഖ്യപാഠത്തിൽ സന്ദർഭസൂചന വ്യക്തമായി നൽകുമ്പോൾ “ചോദ്യംചെയ്ത്” എന്നത് ഔദ്യോഗിക പരിശോധനയുടെ ചുരുക്കവും സ്വാഭാവികവുമായ രൂപമാണ്.
  terminology: “ഹെരോദാവ്,” “യെഹൂദ്യ,” “കൈസര്യ,” “കാവൽക്കാർ” എന്നിവ യോജിച്ച പ്രചാരമുള്ള രൂപങ്ങളാണ്. വധശിക്ഷ ഗ്രീക്കിൽ നേരിട്ട് പറഞ്ഞിട്ടില്ലാത്തതിനാൽ അതിന്റെ വ്യാഖ്യാനപരമായ സ്വഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമായി അടയാളപ്പെടുത്തിയിരിക്കുന്നു.
