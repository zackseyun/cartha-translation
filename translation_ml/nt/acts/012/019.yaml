  to: എന്നാൽ ഹെരോദാവ് അവനെ അന്വേഷിച്ചെങ്കിലും കണ്ടെത്താതിരുന്നപ്പോൾ, കാവൽക്കാരെ ചോദ്യംചെയ്ത് അവരെ വധശിക്ഷയ്ക്കായി കൊണ്ടുപോകാൻ കല്പിച്ചു.[a] പിന്നെ അവൻ യെഹൂദ്യയിൽനിന്ന് കൈസര്യയിലേക്കു ഇറങ്ങിച്ചെന്ന് അവിടെ താമസിച്ചു.
