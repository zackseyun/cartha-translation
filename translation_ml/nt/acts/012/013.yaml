translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ വാതിൽ–കവാടം വ്യത്യാസവും παιδίσκηയുടെ സാമൂഹിക നിലയെക്കുറിച്ചുള്ള യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തി.
