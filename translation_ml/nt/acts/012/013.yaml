  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κρούσαντος δὲ ⸀αὐτοῦ τὴν θύραν τοῦ πυλῶνος προσῆλθε παιδίσκη ὑπακοῦσαι ὀνόματι Ῥόδη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/013.yaml
  text: When he knocked at the door of the gateway[a], a servant girl named Rhoda came to answer.
translation:
  language: ml
  text: അവൻ പ്രവേശനകവാടത്തിന്റെ വാതിലിൽ മുട്ടിയപ്പോൾ, റോദേ എന്നു പേരുള്ള ഒരു വേലക്കാരിയായ പെൺകുട്ടി[a] മറുപടി നൽകാൻ വന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമപ്പെൺകുട്ടി’ എന്നും പരിഭാഷപ്പെടുത്താം. παιδίσκη എന്ന ഗ്രീക്ക് പദം ഒരു വീട്ടുവേലക്കാരിയെയോ അടിമപ്പെൺകുട്ടിയെയോ സൂചിപ്പിക്കാം; ഇവിടെ അവളുടെ നിയമപരമായ നിലയെക്കാൾ വീട്ടിലെ അവളുടെ പങ്കിനാണ് ആഖ്യാനം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: അവൻ ... മുട്ടിയപ്പോൾ
  rationale: δέയോടുകൂടിയ aorist participle ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സമയബന്ധത്തോടെ അവതരിപ്പിക്കുന്നു. ‘മുട്ടിയപ്പോൾ’ എന്നത് ഈ കാലസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θύραν τοῦ πυλῶνος
  choice: പ്രവേശനകവാടത്തിന്റെ വാതിൽ
  rationale: θύρα എന്ന ‘വാതിൽ’ എന്ന നാമവും πυλών എന്ന കവാടം/പ്രവേശനമേഖല എന്ന ആശയവും രണ്ടും നിലനിർത്തുന്നു; ഇത് വീടിന്റെ പുറത്തെ പ്രവേശനകവാടത്തിലെ വാതിലായിരിക്കാം.
- source_word: προσῆλθε
  choice: വന്നു
  rationale: προσέρχομαι എന്നതിന് ‘അടുത്തുവന്നു/വന്നു’ എന്നർഥമുണ്ട്. ഗൃഹസന്ദർഭത്തിൽ ‘വന്നു’ സ്വാഭാവികമാണ്; തുടർന്നുള്ള infinitive അതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: παιδίσκη
  choice: വേലക്കാരിപ്പെൺകുട്ടി
  rationale: പദം ഒരു യുവ വീട്ടുവേലക്കാരിയെയോ അടിമപ്പെൺകുട്ടിയെയോ സൂചിപ്പിക്കാം. നിയമപരമായ നില നിർണയിക്കാതെ ഗൃഹത്തിലെ പങ്ക് വ്യക്തമാക്കാൻ ഈ പദം തെരഞ്ഞെടുത്തു; മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὑπακοῦσαι
  choice: മറുപടി പറയാൻ
  rationale: ὑπακούω സാധാരണയായി ‘കേൾക്കുക/അനുസരിക്കുക’ എന്നർഥമുള്ളതാണെങ്കിലും, വാതിലിൽ മുട്ടുന്ന സന്ദർഭത്തിൽ അതിന് മുട്ടിന് പ്രതികരിക്കുക എന്ന സാഹചര്യാർഥമാണ്.
- source_word: ὀνόματι Ῥόδη
  choice: റോദാ എന്നു പേരുള്ള
  rationale: ὀνόματι വ്യക്തിയുടെ പേര് അവതരിപ്പിക്കുന്നു. Ῥόδη എന്ന പേര് മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ‘റോദാ’ എന്നു ലിപ്യന്തരിച്ചു.
