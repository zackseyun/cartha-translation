id: ACT.12.6
reference: Acts 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: ml
  text: ഹെരോദാവ് അവനെ പുറത്തുകൊണ്ടുവരാനിരിക്കെ[a], ആ രാത്രിയിൽത്തന്നെ പത്രോസ് രണ്ടു പടയാളികളുടെ നടുവിൽ രണ്ടു ചങ്ങലകളാൽ ബന്ധിക്കപ്പെട്ട് ഉറങ്ങുകയായിരുന്നു. വാതിലിനു മുന്നിലുണ്ടായിരുന്ന കാവൽക്കാർ കാരാഗൃഹത്തിനു കാവൽ നിന്നുകൊണ്ടിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ മുന്നിലേക്കു കൊണ്ടുവരാനിരിക്കെ.’ പൊതുജനങ്ങളുടെ മുമ്പിലേക്കോ വിചാരണയ്ക്കായോ ഒരാളെ കൊണ്ടുവരുന്നതിനെ ഗ്രീക്ക് ക്രിയ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കാരാഗൃഹത്തെ കാത്തുസൂക്ഷിച്ചുകൊണ്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: പുറത്തുകൊണ്ടുവരാനിരിക്കെ
  rationale: μέλλω സൂചിപ്പിക്കുന്ന ആസന്നമായ പ്രവൃത്തി ‘-ാനിരിക്കെ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: προαγαγεῖν αὐτόν
  choice: അവനെ പുറത്തുകൊണ്ടുവരാൻ
  rationale: തടവിൽനിന്ന് പൊതുവിചാരണയ്ക്കോ ജനസന്നിധിയിലേക്കോ കൊണ്ടുവരുന്നതാണ് സന്ദർഭം; ചലനവും ഉദ്ദേശ്യവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: ആ രാത്രിയിൽത്തന്നെ
  rationale: ἐκείνῃ നൽകുന്ന നിർദിഷ്ടതയും ആഖ്യാനപരമായ ഊന്നലും ‘-ത്തന്നെ’ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: κοιμώμενος
  choice: ഉറങ്ങുകയായിരുന്നു
  rationale: തുടർന്നുകൊണ്ടിരുന്ന ഉറക്കാവസ്ഥ/പ്രവൃത്തി മലയാളത്തിലെ പുരോഗമനരൂപത്തിൽ വ്യക്തമാകുന്നു.
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: രണ്ടു പടയാളികളുടെ നടുവിൽ
  rationale: വ്യക്തമായ സ്ഥാനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: രണ്ടു ചങ്ങലകളാൽ ബന്ധിക്കപ്പെട്ട്
  rationale: പൂർണ്ണ കർമണി കൃദന്തം സൂചിപ്പിക്കുന്ന നിലവിലുള്ള ബന്ധിതാവസ്ഥയും ചങ്ങലകൾ ഉപകരണമായിരുന്നുവെന്നതും നിലനിർത്തുന്നു.
- source_word: φύλακες πρὸ τῆς θύρας
  choice: വാതിലിനു മുന്നിലുണ്ടായിരുന്ന കാവൽക്കാർ
  rationale: കാവൽക്കാരുടെ സ്ഥാനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐτήρουν τὴν φυλακήν
  choice: കാരാഗൃഹത്തിനു കാവൽ നിന്നു
  rationale: τηρέωയുടെ കാത്തുസൂക്ഷിക്കൽ/കാവൽ അർഥവും φυλακήയുടെ കാരാഗൃഹസൂചനയും സംക്ഷിപ്തമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘പടയാളി’, ‘കാരാഗൃഹം’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഔപചാരിക പദങ്ങളായി ഉപയോഗിച്ചു; ഗ്രീക്ക് വാക്യത്തിലെ ആസന്നത, ഊന്നൽ, ബന്ധിതാവസ്ഥ എന്നിവ സംരക്ഷിച്ചു.
