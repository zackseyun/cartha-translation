  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤρεσεν ὁ λόγος ἐνώπιον παντὸς τοῦ πλήθους, καὶ ἐξελέξαντο Στέφανον, ἄνδρα ⸀πλήρης πίστεως καὶ πνεύματος ἁγίου, καὶ Φίλιππον καὶ Πρόχορον καὶ Νικάνορα καὶ Τίμωνα καὶ Παρμενᾶν καὶ Νικόλαον προσήλυτον Ἀντιοχέα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/005.yaml
  text: And the proposal pleased the whole multitude[a], and they chose Stephen, a man full of faith and of the Holy Spirit, Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolaus[c][b], a proselyte of Antioch.
translation:
  language: ml
  text: ആ നിർദേശം മുഴുവൻ ജനസമൂഹത്തിനും സ്വീകാര്യമായി. അവർ വിശ്വാസവും[a] പരിശുദ്ധാത്മാവും നിറഞ്ഞവനായ സ്തെഫാനോസ്, ഫിലിപ്പോസ്, പ്രൊഖൊറോസ്, നിക്കാനോർ, തിമോൻ, പർമെനാസ്, അന്ത്യോക്യക്കാരനും യഹൂദമതം സ്വീകരിച്ചവനുമായ[b] നിക്കൊലാവോസ് എന്നിവരെ തിരഞ്ഞെടുത്തു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസ്തത.” ഗ്രീക്ക് പദത്തിന് വിശ്വാസം, ആശ്രയം, വിശ്വസ്തത എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “യഹൂദമതം സ്വീകരിച്ചവൻ” എന്നു പറയുന്നത് യഹൂദനല്ലാതിരുന്നിട്ടും യഹൂദമതത്തിൽ ചേർന്ന ഒരാളെയാണ്.
    reason: cultural_note
  - marker: c
    text: ഗ്രീക്കിൽ ഓരോ പേരിനോടും “മറ്റും” എന്ന സംയോജകം ആവർത്തിച്ചിരിക്കുന്നു; സ്വാഭാവികമായ മലയാളത്തിനായി ഇവിടെ അവ പട്ടികയായി നൽകിയിരിക്കുന്നു.
    reason: source_style_note
lexical_decisions:
- source_word: ὁ λόγος
  choice: ആ നിർദേശം
  rationale: മുൻവാക്യത്തിൽ അപ്പൊസ്തലന്മാർ മുന്നോട്ടുവച്ച കാര്യത്തെയാണ് ഇവിടെ λόγος സൂചിപ്പിക്കുന്നത്. അതിനാൽ അക്ഷരാർഥമായ ‘വചനം’ എന്നതിനെക്കാൾ സന്ദർഭോചിതവും സ്വാഭാവികവുമാണ് ‘ആ നിർദേശം’.
- source_word: ἤρεσεν ἐνώπιον παντὸς τοῦ πλήθους
  choice: സമൂഹം മുഴുവനും അംഗീകരിച്ചു
  rationale: നിർദേശം കൂടിവന്ന എല്ലാവരുടെയും അംഗീകാരം നേടി എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘സഭ’ എന്ന പിൽക്കാല സാങ്കേതിക പദം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐξελέξαντο
  choice: അവർ ... തിരഞ്ഞെടുത്തു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πλήρης πίστεως καὶ πνεύματος ἁγίου
  choice: വിശ്വാസംകൊണ്ടും പരിശുദ്ധാത്മാവുകൊണ്ടും നിറഞ്ഞവനായ
  rationale: πίστις എന്നതിന് ഇവിടെ ‘വിശ്വാസം’ എന്ന മുഖ്യവായന നിലനിർത്തുകയും πνεῦμα ἅγιον ദൈവിക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: προσήλυτον
  choice: യഹൂദമതം സ്വീകരിച്ചവൻ
  rationale: യഹൂദനല്ലാത്ത ഒരാൾ യഹൂദമതം സ്വീകരിച്ചതിനെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: Ἀντιοχέα
  choice: അന്ത്യോക്യക്കാരൻ
  rationale: നിക്കൊലാവോസിന്റെ അന്ത്യോക്യയുമായുള്ള ദേശബന്ധം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: Στέφανον, Φίλιππον, Πρόχορον, Νικάνορα, Τίμωνα, Παρμενᾶν, Νικόλαον
  choice: സ്തെഫാനോസ്, ഫിലിപ്പോസ്, പ്രൊഖൊറോസ്, നിക്കാനോർ, തിമോൻ, പർമെനാസ്, നിക്കൊലാവോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമങ്ങളെ ആധുനിക മലയാളത്തിൽ ഉച്ചാരണസൗകര്യത്തോടെ ലിപ്യന്തരം ചെയ്യുന്നു.
theological_decisions:
- issue: സ്തെഫാനോസിനെ വിവരിക്കുന്ന πίστεως എന്ന പദം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള വിശ്വാസമാണ് സാധ്യതയേറിയ മുഖ്യാർഥം; എങ്കിലും സ്വഭാവഗുണമായ ‘വിശ്വസ്തത’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘വചനം’, ‘പുരുഷാരം’, ‘മതപരിവർത്തിതൻ’ തുടങ്ങിയ സന്ദർഭത്തിൽ അസ്വാഭാവികമോ സാങ്കേതികമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. സ്തെഫാനോസിന്റെ വിശേഷണം അദ്ദേഹത്തോടുതന്നെ വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ഏഴുപേരെയും ഒരൊറ്റ പട്ടികയായി അവതരിപ്പിക്കുകയും ചെയ്തു.
