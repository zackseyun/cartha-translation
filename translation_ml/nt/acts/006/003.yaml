id: ACT.6.3
reference: Acts 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπισκέψασθε ⸀δέ, ἀδελφοί, ἄνδρας ἐξ ὑμῶν μαρτυρουμένους ἑπτὰ πλήρεις ⸀πνεύματος καὶ σοφίας, οὓς ⸀καταστήσομεν ἐπὶ τῆς χρείας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/003.yaml
  text: But brothers[a], select from among yourselves seven men who are well attested, full of the Spirit and wisdom[d][c][b], whom we will appoint over this duty.
translation:
  language: ml
  text: എന്നാൽ, സഹോദരന്മാരേ[a], നിങ്ങളിൽനിന്ന് നല്ല സാക്ഷ്യമുള്ള[b] ആത്മാവും ജ്ഞാനവും നിറഞ്ഞ[c] ഏഴു പുരുഷന്മാരെ[d] തിരഞ്ഞെടുക്കുക; ഈ ചുമതല കൈകാര്യം ചെയ്യാൻ അവരെ ഞങ്ങൾ നിയമിക്കും[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദം പുരുഷലിംഗരൂപത്തിലാണ്; എന്നാൽ ഈ സംബോധന വിശ്വാസിസമൂഹത്തെ വിശാലമായി ഉൾക്കൊള്ളാനിടയുണ്ട്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘നല്ല പേരുള്ള.’
    reason: lexical_alternative
  - marker: c
    text: ‘ആത്മാവ്’ ഇവിടെ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആത്മാവും ജ്ഞാനവും നിറഞ്ഞ’ എന്നാണ്; ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ല.
    reason: alternative_reading
  - marker: d
    text: ഇവിടെ ‘പുരുഷന്മാർ’ എന്നത് പ്രായപൂർത്തിയായ ആണുങ്ങളെ സൂചിപ്പിക്കുന്ന പ്രത്യേക ഗ്രീക്കുപദത്തിന്റെ പരിഭാഷയാണ്.
    reason: lexical_note
  - marker: e
    text: ‘ഈ ചുമതല’ എന്നത് സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ പ്രതിദിന വിതരണവുമായി ബന്ധപ്പെട്ട പ്രായോഗിക ഉത്തരവാദിത്വത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέψασθε
  choice: തിരഞ്ഞെടുത്തുകൊള്ളുക
  rationale: സമൂഹം തങ്ങളുടെ ഇടയിൽനിന്ന് യോഗ്യരായവരെ കണ്ടെത്തി തിരഞ്ഞെടുക്കണമെന്ന മധ്യമപ്രയോഗത്തിലുള്ള ആജ്ഞയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δέ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ അപ്പൊസ്തലന്മാരുടെ നിർദേശത്തിൽനിന്ന് സമൂഹം ചെയ്യേണ്ട കാര്യത്തിലേക്കുള്ള സന്ദർഭോചിതമായ നിഗമനബന്ധം വ്യക്തമാക്കുന്നു; ‘എന്നാൽ’ എന്ന വിരുദ്ധഭാവം ഇവിടെ നിർബന്ധമല്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; ഇതു വിശ്വാസിസമൂഹത്തെ വിശാലമായി ഉൾക്കൊള്ളാനിടയുണ്ടെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἄνδρας
  choice: പുരുഷന്മാരെ
  rationale: ἀνήρ ഇവിടെ പ്രായപൂർത്തിയായ പുരുഷന്മാരെ പ്രത്യേകം സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗസൂചന സംരക്ഷിക്കുന്നു.
- source_word: ἐξ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന്
  rationale: തിരഞ്ഞെടുപ്പ് സമൂഹത്തിനുള്ളിൽനിന്നുതന്നെയാണെന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: μαρτυρουμένους
  choice: നല്ല സാക്ഷ്യമുള്ള
  rationale: മറ്റുള്ളവർ അനുകൂലമായി സാക്ഷ്യപ്പെടുത്തുന്നവർ എന്ന കർത്തരിപ്രയോഗത്തിന്റെ സാക്ഷ്യസംബന്ധിയായ അർഥം നിലനിർത്തുന്നു; ‘നല്ല പേരുള്ള’ എന്നത് സ്വാഭാവികമായ മറ്റൊരു സാധ്യതയാണ്.
- source_word: ἑπτὰ
  choice: ഏഴു
  rationale: സംഖ്യ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: πλήρεις πνεύματος καὶ σοφίας
  choice: ആത്മാവും ജ്ഞാനവും നിറഞ്ഞ
  rationale: പദപ്രയോഗത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുന്നു. ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികൾ പശ്ചാത്തലത്തിൽ ‘ആത്മാവ്’ ദൈവാത്മാവിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത; എന്നാൽ ഗ്രീക്കിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: καταστήσομεν
  choice: ഞങ്ങൾ നിയമിക്കും
  rationale: ഒരു ചുമതലയിലേക്ക് ഔപചാരികമായി നിയോഗിക്കുന്നതിന്റെ ഭാവം നൽകുന്നു.
- source_word: ἐπὶ τῆς χρείας ταύτης
  choice: ഈ ചുമതലയുടെ മേൽ
  rationale: καθίστημι + ἐπί എന്ന ഘടനയിലെ ചുമതല ഏൽപ്പിക്കൽ എന്ന ആശയം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ഇത് പ്രതിദിന വിതരണവുമായി ബന്ധപ്പെട്ട പ്രായോഗിക ഉത്തരവാദിത്വമാണ്.
theological_decisions:
- issue: πνεύματος എന്നത് പൊതുവായ ‘ആത്മാവ്’ ആണോ പരിശുദ്ധാത്മാവാണോ
  choice: ആത്മാവ്
  alternative: പരിശുദ്ധാത്മാവ്; അല്ലെങ്കിൽ മനുഷ്യന്റെ ആത്മഭാവം
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിലെ ഉപയോഗവും ശുശ്രൂഷയ്ക്കുള്ള യോഗ്യതയായി ജ്ഞാനത്തോടൊപ്പം വരുന്നതും ദൈവാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എന്നാൽ മൂലത്തിൽ ἁγίου ഇല്ലാത്തതിനാൽ ‘പരിശുദ്ധ’ എന്നു ചേർക്കാതെ യഥാർഥ പദരൂപവും ശേഷിക്കുന്ന അർഥസാധ്യതയും സംരക്ഷിക്കുന്നു.
- issue: ἀδελφοί എന്ന സംബോധനയുടെ പരിധി
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ; സഹവിശ്വാസികളേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുരുഷലിംഗമായ രൂപം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സഭയിലെ വിശാലമായ വിശ്വാസിസമൂഹം ഉൾപ്പെട്ടിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സഭാവായനയ്ക്ക് യോജിച്ച മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നല്ല സാക്ഷ്യമുള്ള’ എന്നത് അല്പം ഔപചാരികമായെങ്കിലും മൂലത്തിലെ μαρτυρέω-സാക്ഷ്യഭാവം സംരക്ഷിക്കുന്നു. വാക്യഘടന ഗ്രീക്കിലെ നിർദേശം–യോഗ്യതകൾ–നിയമനം എന്ന ക്രമം പിന്തുടരുന്നു.
