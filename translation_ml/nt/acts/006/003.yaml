revisions:
- from: അതുകൊണ്ട്, സഹോദരന്മാരേ[a], നിങ്ങളിൽനിന്ന് നല്ല സാക്ഷ്യമുള്ള[b], ആത്മാവും ജ്ഞാനവും നിറഞ്ഞ ഏഴു പുരുഷന്മാരെ[c] തിരഞ്ഞെടുത്തുകൊള്ളുക; അവരെ ഞങ്ങൾ ഈ ചുമതലയുടെ മേൽ നിയമിക്കും[d].
  to: എന്നാൽ, സഹോദരന്മാരേ[a], നിങ്ങളിൽനിന്ന് നല്ല സാക്ഷ്യമുള്ള[b] ആത്മാവും ജ്ഞാനവും നിറഞ്ഞ[c] ഏഴു പുരുഷന്മാരെ[d] തിരഞ്ഞെടുക്കുക; ഈ ചുമതല കൈകാര്യം ചെയ്യാൻ അവരെ ഞങ്ങൾ നിയമിക്കും[e].
  rationale: 'The revision changes only what is needed for closer source fidelity and natural Malayalam: «എന്നാൽ» reflects δέ without adding an inferential force, and «ഈ ചുമതല കൈകാര്യം ചെയ്യാൻ ... നിയമിക്കും» naturally conveys formal appointment over the stated practical responsibility. Footnotes have been separated and anchored to their respective expressions.'
