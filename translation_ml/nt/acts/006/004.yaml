id: ACT.6.4
reference: Acts 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ τῇ προσευχῇ καὶ τῇ διακονίᾳ τοῦ λόγου προσκαρτερήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/004.yaml
  text: But we will devote ourselves to prayer and to the ministry of the word[a].
translation:
  language: ml
  text: എന്നാൽ ഞങ്ങളോ പ്രാർഥനയിലും വചനശുശ്രൂഷയിലും[a] നിരന്തരം മുഴുകിയിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വചനസേവനം.’ ഗ്രീക്ക് പദത്തിന് ‘സേവനം’ എന്നും ‘ശുശ്രൂഷ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: ഞങ്ങളോ
  rationale: ഗ്രീക്കിൽ കർത്തൃസർവനാമം വ്യക്തമായി ചേർത്തിരിക്കുന്നത് ഊന്നലും മുൻസന്ദർഭത്തോടുള്ള വ്യത്യാസവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ഞങ്ങളോ’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളിൽ മറ്റുള്ളവർക്ക് മേശശുശ്രൂഷ ഏൽപ്പിക്കുന്നതുമായി ഇവിടെ കാണുന്ന വ്യത്യാസം വ്യക്തമാക്കുന്നു.
- source_word: τῇ προσευχῇ
  choice: പ്രാർഥനയിൽ
  rationale: προσκαρτερέω എന്ന ക്രിയയോടുകൂടിയ ദാതിവ്, സ്ഥിരമായി മുഴുകിനിൽക്കുന്ന പ്രവർത്തനമേഖലയെ സൂചിപ്പിക്കുന്നു.
- source_word: διακονίᾳ
  choice: ശുശ്രൂഷ
  rationale: διακονίαയ്ക്ക് ‘സേവനം’ എന്നും ‘ശുശ്രൂഷ’ എന്നും അർഥമാകാം. ഇവിടെ വചനം അറിയിക്കുന്ന ചുമതലയെ സൂചിപ്പിക്കാൻ ‘ശുശ്രൂഷ’ സ്വാഭാവികമാണ്; അതേസമയം സേവനമെന്ന അടിസ്ഥാന ആശയം നഷ്ടപ്പെടുന്നില്ല.
- source_word: τοῦ λόγου
  choice: വചന
  rationale: ഇവിടെ λόγος ദൈവത്തിന്റെ അറിയിക്കപ്പെടുന്ന വചനത്തെയോ സന്ദേശത്തെയോ സൂചിപ്പിക്കുന്നു. ‘വചനം’ ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തെ നിലനിർത്തുകയും മലയാളത്തിൽ വ്യക്തമായി മനസ്സിലാകുകയും ചെയ്യുന്നു.
- source_word: προσκαρτερήσομεν
  choice: നിരന്തരം മുഴുകിയിരിക്കും
  rationale: ഭാവികാല ക്രിയ സ്ഥിരതയോടെയുള്ള തുടർച്ചയും സമർപ്പണവും സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം വെറും തുടരലിനേക്കാൾ ആ അർഥവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: മേശസേവനത്തോടുള്ള താരതമ്യത്തിൽ διακονία എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വചനശുശ്രൂഷ
  alternative: വചനസേവനം
  rationale: ഇരുവിധ ജോലികളും സേവനത്തിന്റെ അർഥമേഖലയിൽപ്പെടുന്നു. ‘വചനശുശ്രൂഷ’ ഇവിടെ അപ്പൊസ്തലന്മാരുടെ പ്രത്യേക ചുമതലയെ മുൻസന്ദർഭത്തിലെ മേശസേവനത്തിൽനിന്ന് വേർതിരിച്ചുകാട്ടുന്നു; എന്നാൽ പാഠത്തിൽ ഇല്ലാത്ത കർശനമായ പുരോഹിത-സാധാരണജന വിഭജനം ഇതിലൂടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഞങ്ങളോ’ എന്നത് ഗ്രീക്കിലെ വ്യക്തമായ കർത്തൃസർവനാമത്തിന്റെയും δὲ എന്നതിന്റെ വൈരുധ്യത്തിന്റെയും സംയുക്തബലം പ്രകടിപ്പിക്കുന്നു; ‘നിരന്തരം മുഴുകിയിരിക്കും’ സ്ഥിരമായ സമർപ്പണം സ്വാഭാവികമായി അറിയിക്കുന്നു.
