  source_fidelity: SBLGNT വായനയായ «χάριτος καὶ δυνάμεως» കൃത്യമായി «കൃപയും ശക്തിയും» എന്നു നൽകുന്നു. «ചെയ്തുകൊണ്ടിരുന്നു» ἐποίει എന്ന അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു. «മഹത്തായ» അത്ഭുതങ്ങളെയും അടയാളങ്ങളെയും ഒരുപോലെ വിശേഷിപ്പിക്കുന്നതായി വായിക്കാം; «ജനത്തിനിടയിൽ» ἐν τῷ λαῷ-യ്ക്ക് യോജിച്ചതാണ്.
