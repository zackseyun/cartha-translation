id: ACT.6.14
reference: Acts 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/014.yaml
  text: For we heard him saying that this Jesus the Nazarene will destroy this place and will change the customs that Moses handed down to us[a][b][c].
translation:
  language: ml
  text: കാരണം, നസറായനായ ഈ യേശു ഈ സ്ഥലം നശിപ്പിക്കുകയും മോശെ നമുക്കു കൈമാറിയ ആചാരങ്ങൾ മാറ്റുകയും ചെയ്യുമെന്ന് അവൻ പറയുന്നതു ഞങ്ങൾ കേട്ടിട്ടുണ്ട്[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നസറത്തിലെ ഈ യേശു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ സ്ഥലം’ എന്നത് ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘മോശെ നമുക്ക് ഏൽപ്പിച്ച പാരമ്പര്യങ്ങൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκόαμεν
  choice: ഞങ്ങൾ കേട്ടിട്ടുണ്ട്
  rationale: പൂർണകാലരൂപത്തിന്റെ ഇപ്പോഴുള്ള പ്രസക്തി നിലനിർത്തുന്നു; സാക്ഷികൾ ഉന്നയിക്കുന്ന നേരിട്ടുള്ള കേൾവിയുടെ അവകാശവാദവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആരോപണത്തെ വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: αὐτοῦ λέγοντος
  choice: അവൻ പറയുന്നതു
  rationale: ἀκούω-യോടൊപ്പമുള്ള കർത്താവും പങ്കാളിക്രിയയും ചേർന്ന ഘടനയെ, നേരിട്ടു പറഞ്ഞതു കേട്ടുവെന്ന അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰησοῦς ὁ Ναζωραῖος οὗτος
  choice: നസറായനായ ഈ യേശു
  rationale: Ναζωραῖος എന്ന വിശേഷണവും οὗτος എന്ന ഊന്നലുള്ള ചൂണ്ടുപദവും നിലനിർത്തുന്നു; കുറ്റാരോപകരുടെ അകൽച്ചയുള്ള സ്വരവും മായ്ച്ചുകളയുന്നില്ല.
- source_word: καταλύσει
  choice: നശിപ്പിക്കുകയും
  rationale: ദേവാലയത്തെ സൂചിപ്പിക്കുന്ന ‘ഈ സ്ഥലം’ എന്ന സന്ദർഭത്തിൽ പൊളിച്ചുകളയുക അഥവാ നശിപ്പിക്കുക എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്.
- source_word: τὸν τόπον τοῦτον
  choice: ഈ സ്ഥലം
  rationale: ഗ്രീക്കിലെ പൊതുവായ ‘സ്ഥലം’ എന്ന പദം അതേപടി നിലനിർത്തുന്നു; ദേവാലയം എന്ന സന്ദർഭസൂചന മുഖ്യവാക്യത്തിൽ വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἀλλάξει
  choice: മാറ്റുകയും ചെയ്യും
  rationale: ഭാവികാലത്തിലുള്ള ‘മാറ്റുക’ എന്ന നേരിട്ടുള്ള അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὰ ἔθη
  choice: ആചാരങ്ങൾ
  rationale: സമൂഹത്തിൽ പാരമ്പര്യമായി അനുഷ്ഠിക്കപ്പെടുന്ന രീതികളെയും പതിവുകളെയും സൂചിപ്പിക്കാൻ ആധുനിക മലയാളത്തിൽ യോജിച്ച പദം.
- source_word: ἃ παρέδωκεν ἡμῖν Μωϋσῆς
  choice: മോശെ നമുക്കു കൈമാറിയ
  rationale: παραδίδωμι സൂചിപ്പിക്കുന്ന തലമുറകളിലേക്കുള്ള ഏൽപ്പിക്കലും കൈമാറ്റവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഈ സ്ഥലം’ എന്നതിന്റെ സൂചന
  choice: മുഖ്യവാക്യത്തിൽ ‘ഈ സ്ഥലം’ എന്നു നിലനിർത്തി; അടിക്കുറിപ്പിൽ ദേവാലയമാണെന്ന് വ്യക്തമാക്കി.
  alternative: ‘ഈ ദേവാലയം’ അല്ലെങ്കിൽ ‘ഈ വിശുദ്ധസ്ഥലം’
  rationale: ഗ്രീക്കിൽ τόπος എന്നത് ‘സ്ഥലം’ എന്നാണ്. സന്ദർഭത്തിൽ ദേവാലയമാണെങ്കിലും, കുറ്റാരോപകരുടെ കൃത്യമായ വാക്കുകൾ വിവർത്തനത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: യേശുവിനെക്കുറിച്ചുള്ള കുറ്റാരോപകരുടെ സ്വരം
  choice: ‘നസറായനായ ഈ യേശു’ എന്ന ചൂണ്ടിക്കാട്ടുന്ന രൂപം നിലനിർത്തി.
  alternative: ‘നസറത്തിലെ യേശു’
  rationale: οὗτος നൽകുന്ന ഊന്നലും അകൽച്ചയോ നിന്ദാസൂചനയോ ഉള്ള ആഖ്യാനസ്വരവും അമിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. കുറ്റാരോപണത്തിന്റെ റിപ്പോർട്ടുഭാവം, ഭാവികാലത്തിലെ രണ്ടു സമാന്തര ക്രിയകൾ, മൂലപാഠത്തിലെ സൂചനാത്മകമായ ‘ഈ സ്ഥലം’ എന്നിവ സംരക്ഷിച്ചു.
