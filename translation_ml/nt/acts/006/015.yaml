id: ACT.6.15
reference: Acts 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἀτενίσαντες εἰς αὐτὸν ⸀πάντες οἱ καθεζόμενοι ἐν τῷ συνεδρίῳ εἶδον τὸ πρόσωπον αὐτοῦ ὡσεὶ πρόσωπον ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/015.yaml
  text: And all who were sitting in the council[a], fixing their eyes on him, saw his face like the face of an angel.
translation:
  language: ml
  text: ന്യായസമിതിയിൽ[a] ഇരുന്നിരുന്ന എല്ലാവരും അവനെ ഉറ്റുനോക്കി; അവന്റെ മുഖം ഒരു ദൂതന്റെ മുഖംപോലെ കണ്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സൻഹെദ്രിൻ.’ ഗ്രീക്ക് പദം യെഹൂദരുടെ ഭരണ-ന്യായസമിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀτενίσαντες
  choice: ഉറ്റുനോക്കി
  rationale: ക്ഷണികമായ ഒരു നോട്ടമല്ല, ശ്രദ്ധയോടെയും ഏകാഗ്രതയോടെയും നോക്കുന്നതാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘ഉറ്റുനോക്കി’ ആ തീവ്രത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντες οἱ καθεζόμενοι
  choice: ഇരുന്നിരുന്ന എല്ലാവരും
  rationale: πάντες എന്നതിലെ സമഗ്രതയും καθεζόμενοι എന്ന ഇരിപ്പിന്റെ വിവരണവും വ്യക്തമായി പകരുന്നു.
- source_word: συνεδρίῳ
  choice: സഭയിൽ
  rationale: ഇവിടെ യെഹൂദരുടെ ഭരണ-ന്യായസമിതിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. മുഖ്യവാക്യത്തിൽ സ്വാഭാവികമായ ‘സഭ’ ഉപയോഗിച്ച് സാംസ്കാരികമായ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πρόσωπον
  choice: മുഖം
  rationale: സ്തെഫാനൊസിന്റെ ദൃശ്യമായ മുഖത്തെയാണ് ഈ സന്ദർഭത്തിൽ നേരിട്ട് സൂചിപ്പിക്കുന്നത്; ‘മുഖം’ വ്യക്തവും ആധുനികവുമായ മലയാളമാണ്.
- source_word: ὡσεὶ
  choice: പോലെ
  rationale: സാദൃശ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ ചുരുക്കമായും സ്വാഭാവികമായും പകരുന്നു.
- source_word: ἀγγέλου
  choice: ഒരു ദൂതന്റെ
  rationale: ഈ ആഖ്യാനസന്ദർഭത്തിൽ ἄγγελος സാധാരണ മനുഷ്യസന്ദേശവാഹകനെയല്ല, സ്വർഗീയ ദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ‘ഒരു ദൂതന്റെ മുഖംപോലെ’ എന്ന താരതമ്യത്തിന്റെ സ്വഭാവം
  choice: സ്തെഫാനൊസിന്റെ മുഖം ഒരു ദൂതന്റെ മുഖത്തോടു സാദൃശ്യമുള്ളതായി പറയുന്ന ഉപമ; സാദൃശ്യത്തിന്റെ കൃത്യമായ ഗുണം നിർവചിക്കുന്നില്ല.
  alternative: ഇത് പ്രത്യേകമായി തേജസ്സിനെയോ ശാന്തമായ നിർദോഷതയെയോ സ്വർഗീയ അധികാരത്തെയോ സൂചിപ്പിക്കുന്നു എന്ന വ്യാഖ്യാനം.
  rationale: ഗ്രീക്ക് പാഠം സാദൃശ്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും അത് പ്രകാശമാണോ, ശാന്തതയാണോ, മഹത്വമാണോ എന്നു വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പരിഭാഷ ആ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സഭ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; അതിന്റെ ചരിത്രപരമായ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
