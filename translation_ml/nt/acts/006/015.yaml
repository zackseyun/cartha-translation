revisions:
- from: സഭയിൽ[a] ഇരുന്നിരുന്ന എല്ലാവരും അവനെ ഉറ്റുനോക്കി; അവന്റെ മുഖം ഒരു ദൂതന്റെ മുഖംപോലെ അവർ കണ്ടു.
  to: ന്യായസമിതിയിൽ[a] ഇരുന്നിരുന്ന എല്ലാവരും അവനെ ഉറ്റുനോക്കി; അവന്റെ മുഖം ഒരു ദൂതന്റെ മുഖംപോലെ കണ്ടു.
  rationale: 'The revision replaces the potentially misleading generic «സഭ» with «ന്യായസമിതി», accurately identifying the συνέδριον as a ruling/judicial council. It also smooths the final clause while maintaining the simile''s intended ambiguity: the text says only that Stephen''s face resembled an angel''s face, not what quality occasioned the resemblance.'
