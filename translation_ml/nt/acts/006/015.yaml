    text: അഥവാ, ‘സൻഹെദ്രിൻ.’ ഗ്രീക്ക് പദം യെഹൂദരുടെ ഭരണ-ന്യായസമിതിയെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  revision_rationale: 'The revision replaces the potentially misleading generic «സഭ» with «ന്യായസമിതി», accurately identifying the συνέδριον as a ruling/judicial council. It also smooths the final clause while maintaining the simile''s intended ambiguity: the text says only that Stephen''s face resembled an angel''s face, not what quality occasioned the resemblance.'
