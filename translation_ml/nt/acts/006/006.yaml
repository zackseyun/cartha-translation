id: ACT.6.6
reference: Acts 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι ἐπέθηκαν αὐτοῖς τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/006.yaml
  text: These they set before the apostles[a], and after praying[b], they laid their hands on them.
translation:
  language: ml
  text: അവരെ അപ്പൊസ്തലന്മാരുടെ മുമ്പിൽ കൊണ്ടുനിർത്തി[a]. പ്രാർഥിച്ചശേഷം അവർ അവരുടെമേൽ കൈവെച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അവരെ അപ്പൊസ്തലന്മാരുടെ സന്നിധിയിൽ അവതരിപ്പിച്ചു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെമേൽ കൈവെച്ചു’ എന്ന പ്രയോഗം പരസ്യമായ നിയോഗത്തെയോ അനുഗ്രഹത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ ഗ്രീക്ക് ഇവിടെ പ്രവൃത്തിയെ മാത്രമാണ് പറയുന്നത്, അതിന്റെ സഭാപരമായ അർത്ഥം കൂടുതൽ നിർവചിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: οὓς
  choice: അവരെ
  rationale: മുൻവാക്യത്തിൽ തിരഞ്ഞെടുത്ത ഏഴുപേരെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. ‘അവരെ’ എന്നത് ലിംഗം അനാവശ്യമായി കൂട്ടിച്ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἔστησαν
  choice: കൊണ്ടുനിർത്തി
  rationale: ἵστημι ഇവിടെ കാരണാർത്ഥത്തിൽ, ഒരാളെ മറ്റുള്ളവരുടെ മുമ്പിൽ നിർത്തുക/ഹാജരാക്കുക എന്ന അർത്ഥത്തിലാണ്. ‘കൊണ്ടുനിർത്തി’ ആ പ്രവർത്തിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐνώπιον τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരുടെ മുമ്പിൽ
  rationale: ἐνώπιον സാന്നിധ്യത്തെയോ മുമ്പാകെയുള്ള നിലയെയോ സൂചിപ്പിക്കുന്നു. ‘മുമ്പിൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; ἀπόστολοι ഇവിടെ അപ്പൊസ്തലിക സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: προσευξάμενοι
  choice: പ്രാർഥിച്ചശേഷം
  rationale: അയോറിസ്റ്റ് കൃതന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. ‘പ്രാർഥിച്ചശേഷം’ സംഭവക്രമം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐπέθηκαν αὐτοῖς τὰς χεῖρας
  choice: അവർ അവരുടെമേൽ കൈവെച്ചു
  rationale: ഗ്രീക്കിലെ കൈകൾ വെക്കുക എന്ന ദൃശ്യപ്രവൃത്തി മലയാളത്തിലെ സ്വാഭാവികമായ ‘മേൽ കൈവെക്കുക’ എന്ന പ്രയോഗത്തിൽ നിലനിർത്തുന്നു. അതിനെ ‘നിയമിച്ചു’ എന്നോ ‘അഭിഷേകം ചെയ്തു’ എന്നോ വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: കൈവെക്കലിന്റെ സഭാപരമായ അർത്ഥം
  choice: ‘അവരുടെമേൽ കൈവെച്ചു’ എന്ന് പ്രവർത്തിയെ മാത്രം വിവരിക്കുന്നു.
  alternative: ‘അവരെ ശുശ്രൂഷയ്ക്കായി നിയമിച്ചു’ / ‘അവരെ അഭിഷേകം ചെയ്തു’
  rationale: ഗ്രീക്ക് വാചകം ആചാരപരമായ ദൃശ്യപ്രവൃത്തി പറയുന്നു; എന്നാൽ ഇവിടെത്തന്നെ അതിന്റെ പൂർണ സഭാപരമായ അർത്ഥം നിർവചിക്കുന്നില്ല. അതിനാൽ ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- issue: ബഹുവചന ക്രിയകളുടെ കർത്താവ്
  choice: ഗ്രീക്കിലുള്ളതുപോലെ ‘അവർ’ എന്ന പരാമർശം നിലനിർത്തുന്നു.
  alternative: ‘അപ്പൊസ്തലന്മാർ പ്രാർഥിച്ച് അവരുടെമേൽ കൈവെച്ചു’ എന്ന് കർത്താവിനെ വ്യക്തമായി ചേർക്കുക
  rationale: സന്ദർഭം കൈവെക്കുന്നവരെ അപ്പൊസ്തലന്മാരായി മനസ്സിലാക്കാൻ വഴിയൊരുക്കുന്നുവെങ്കിലും, ഗ്രീക്കിൽ രണ്ടാമത്തെ ക്രിയാഭാഗത്തിന് ‘അപ്പൊസ്തലന്മാർ’ എന്ന നാമം വീണ്ടും പ്രത്യക്ഷമായി നൽകിയിട്ടില്ല. വിവർത്തനം ആ സൂക്ഷ്മത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അപ്പൊസ്തലന്മാർ’, ‘പ്രാർഥിച്ചു’, ‘കൈവെച്ചു’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
