id: ACT.6.11
reference: Acts 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ὑπέβαλον ἄνδρας λέγοντας ὅτι Ἀκηκόαμεν αὐτοῦ λαλοῦντος ῥήματα βλάσφημα εἰς Μωϋσῆν καὶ τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/011.yaml
  text: Then they secretly induced men to say[a], “We have heard him speaking blasphemous words against Moses and God.”
translation:
  language: ml
  text: 'അപ്പോൾ അവർ പുരുഷന്മാരെ രഹസ്യമായി പ്രേരിപ്പിച്ച് ഇങ്ങനെ പറയിച്ചു[a]: “ഇവൻ മോശയ്ക്കും ദൈവത്തിനും എതിരായി ദൂഷണവാക്കുകൾ സംസാരിക്കുന്നത് ഞങ്ങൾ കേട്ടിട്ടുണ്ട്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുരുഷന്മാരെ രഹസ്യമായി പറഞ്ഞൊപ്പിച്ചു” അല്ലെങ്കിൽ “പുരുഷന്മാരെ ഇളക്കിവിട്ടു.” ഗ്രീക്ക് ക്രിയയിൽ മറഞ്ഞുനിന്ന് പ്രേരിപ്പിക്കുന്നതിന്റെ ഭാവമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത നടപടിയെ പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികമായ കാലസൂചകബന്ധപദം.
- source_word: ὑπέβαλον
  choice: രഹസ്യമായി പ്രേരിപ്പിച്ച് ... പറയിച്ചു
  rationale: മറഞ്ഞുനിന്നുള്ള പ്രേരണയോ ഒത്താശയോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അധമമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἄνδρας
  choice: ചില പുരുഷന്മാരെ
  rationale: ἀνήρ പുരുഷന്മാരെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്; അനിശ്ചിതമായ ബഹുവചനത്തെ സ്വാഭാവികമാക്കാൻ ‘ചില’ ചേർത്തു.
- source_word: Ἀκηκόαμεν
  choice: ഞങ്ങൾ കേട്ടിട്ടുണ്ട്
  rationale: കേട്ടതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന പൂർണകാലഭാവം സംരക്ഷിക്കുന്നു.
- source_word: αὐτοῦ λαλοῦντος
  choice: ഇവൻ ... സംസാരിക്കുന്നത്
  rationale: കുറ്റാരോപണത്തിലെ വ്യക്തിയെ ചൂണ്ടിക്കാട്ടുന്ന നേരിട്ടുള്ള മലയാളപ്രയോഗവും തുടരുന്ന സംസാരപ്രവൃത്തിയും വ്യക്തമാക്കുന്നു.
- source_word: ῥήματα βλάσφημα
  choice: ദൈവദൂഷണവാക്കുകൾ
  rationale: നിയമപരവും മതപരവുമായ കുറ്റാരോപണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ആരോപണം സത്യമാണെന്ന് പരിഭാഷ അംഗീകരിക്കുന്നില്ല.
- source_word: εἰς Μωϋσῆν καὶ τὸν θεόν
  choice: മോശയ്ക്കും ദൈവത്തിനും എതിരായി
  rationale: ഈ വൈരപരമായ ആരോപണസന്ദർഭത്തിൽ εἰς സൂചിപ്പിക്കുന്ന വിരുദ്ധദിശ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: സ്തെഫാനൊസിനെതിരായ ആരോപണത്തിന്റെ സ്വഭാവം
  choice: ‘മോശയ്ക്കും ദൈവത്തിനും എതിരായി ദൈവദൂഷണവാക്കുകൾ’ എന്നു കുറ്റാരോപണമായി തന്നെ അവതരിപ്പിച്ചു.
  alternative: ‘മോശയെയും ദൈവത്തെയും അപകീർത്തിപ്പെടുത്തുന്ന വാക്കുകൾ’
  rationale: βλάσφημα എന്ന പദത്തിന്റെ മത-നിയമപരമായ ശക്തി സംരക്ഷിക്കുമ്പോഴും, ഇത് പ്രേരിപ്പിക്കപ്പെട്ട ആളുകളുടെ മൊഴിയാണെന്ന ആഖ്യാനചട്ടക്കൂട് ആരോപണത്തെ പരിഭാഷയുടെ വിധിയായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദൈവദൂഷണവാക്കുകൾ’ എന്നത് ഉറവിടത്തിലെ മത-നിയമപരമായ കുറ്റാരോപണം സംരക്ഷിക്കുന്നു; ‘പറയിച്ചു’ എന്ന പ്രയോഗം വാക്യഘടന സ്വാഭാവികമാക്കുന്നു.
