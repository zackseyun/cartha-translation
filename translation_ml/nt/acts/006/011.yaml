revisions:
- from: 'അപ്പോൾ അവർ ചില പുരുഷന്മാരെ രഹസ്യമായി പ്രേരിപ്പിച്ച് ഇങ്ങനെ പറയിച്ചു[a]: “ഇവൻ മോശയ്ക്കും ദൈവത്തിനും എതിരായി ദൈവദൂഷണവാക്കുകൾ സംസാരിക്കുന്നത് ഞങ്ങൾ കേട്ടിട്ടുണ്ട്.”'
  to: 'അപ്പോൾ അവർ പുരുഷന്മാരെ രഹസ്യമായി പ്രേരിപ്പിച്ച് ഇങ്ങനെ പറയിച്ചു[a]: “ഇവൻ മോശയ്ക്കും ദൈവത്തിനും എതിരായി ദൂഷണവാക്കുകൾ സംസാരിക്കുന്നത് ഞങ്ങൾ കേട്ടിട്ടുണ്ട്.”'
  rationale: The revision removes an unsupported ‘some’ and uses ‘ദൂഷണവാക്കുകൾ’ so that the severe alleged speech is naturally understood as being directed against both Moses and God. The reported and unendorsed character of the accusation, along with the covert causative force of ὑπέβαλον, remains intact.
