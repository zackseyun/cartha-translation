reference: Acts 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος τοῦ θεοῦ ηὔξανεν, καὶ ἐπληθύνετο ὁ ἀριθμὸς τῶν μαθητῶν ἐν Ἰερουσαλὴμ σφόδρα, πολύς τε ὄχλος τῶν ἱερέων ὑπήκουον τῇ πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/007.yaml
  text: And the word of God kept increasing[a], and the number of the disciples in Jerusalem kept multiplying greatly, and a large crowd of the priests were becoming obedient to the faith.
translation:
  language: ml
  text: ദൈവവചനം വളർന്നുകൊണ്ടിരുന്നു; യെരൂശലേമിൽ ശിഷ്യന്മാരുടെ എണ്ണം അത്യന്തം പെരുകിക്കൊണ്ടിരുന്നു. പുരോഹിതന്മാരിൽ വലിയൊരു കൂട്ടവും വിശ്വാസത്തെ അനുസരിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വാസത്തോട് അനുസരണയുള്ളവരായിക്കൊണ്ടിരുന്നു.” ഈ ഗ്രീക്ക് പ്രയോഗം ഉള്ളിലുള്ള ആശ്രയവിശ്വാസത്തെ മാത്രമല്ല, ക്രൈസ്തവസന്ദേശത്തോടുള്ള അനുസരണത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: പ്രഘോഷിക്കപ്പെട്ട ദൈവിക സന്ദേശത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്ന് മാത്രം വ്യക്തമാക്കി അർഥപരിധി ചുരുക്കുന്നില്ല.
- source_word: ηὔξανεν
  choice: വളർന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലത്തിന്റെ തുടർച്ചയായ പുരോഗതി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐπληθύνετο
  choice: പെരുകിക്കൊണ്ടിരുന്നു
  rationale: തുടർച്ചയായ വർധന സൂചിപ്പിക്കുകയും ηὔξανεν എന്ന മുൻക്രിയയിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὁ ἀριθμὸς τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ എണ്ണം
  rationale: ലൂക്കോസിന്റെ പ്രധാന പദമായ μαθηταί എന്നതിനെ ‘ശിഷ്യന്മാർ’ എന്നു കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν Ἰερουσαλὴμ
  choice: യെരൂശലേമിൽ
  rationale: സ്ഥലസൂചനയുടെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: σφόδρα
  choice: അത്യന്തം
  rationale: വർധനയുടെ ശക്തമായ തീവ്രത മാന്യവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: πολύς τε ὄχλος
  choice: വലിയൊരു കൂട്ടവും
  rationale: ὄχλος എന്നതിന്റെ കൂട്ടായ അർഥം നിലനിർത്തുന്നു; τε എന്ന ബന്ധകത്തിന്റെ തുടർച്ച ‘-വും’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: τῶν ἱερέων
  choice: പുരോഹിതന്മാരിൽ
  rationale: യെഹൂദ ദേവാലയപുരോഹിതന്മാരെ സൂചിപ്പിക്കുന്നു; മലയാളവാക്യത്തിൽ കൂട്ടത്തിനുള്ള വിഭാഗബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπήκουον
  choice: അനുസരണമുള്ളവരായിത്തീർന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലത്തിലെ തുടരുന്ന പ്രക്രിയയും അനുസരണത്തിലേക്കുള്ള വരവും പ്രകടമാക്കുന്നു; വെറും ബാഹ്യമായ അനുസരണം മാത്രമെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്തിന്
  rationale: πίστις എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപം നിലനിർത്തുകയും ഇവിടെ ക്രൈസ്തവസന്ദേശം/വിശ്വാസവിഷയം എന്ന വസ്തുനിഷ്ഠ അർഥം സാധ്യമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τῇ πίστει എന്ന പ്രയോഗത്തിലെ πίστις-ന്റെ അർഥം
  choice: വിശ്വാസത്തിന്
  alternative: വിശ്വാസസന്ദേശത്തിന്; വിശ്വാസം അനുസരിച്ചുകൊണ്ട്
  rationale: ഗ്രീക്കിലെ നിർദേശകപ്രത്യയം ഉൾപ്പെട്ട പ്രയോഗം വിശ്വസിക്കപ്പെടുന്ന സന്ദേശത്തെയോ വിശ്വാസസമുച്ചയത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ വ്യക്തിയുടെ ഉള്ളിലുള്ള ആശ്രയവിശ്വാസം മാത്രമെന്ന സാധ്യത പൂർണമായി ഇല്ലാതാക്കാതെ ‘വിശ്വാസം’ എന്ന സുതാര്യപദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂന്ന് അപൂർണകാല ക്രിയകളുടെയും തുടരുന്ന സ്വഭാവം ‘-കൊണ്ടിരുന്നു’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. പദശഃ അനുകരണം മൂലമുള്ള അസ്വാഭാവികത ഒഴിവാക്കിയെങ്കിലും ദൈവവചനം, ശിഷ്യന്മാർ, വിശ്വാസം എന്നീ പ്രധാന ബൈബിൾ പദങ്ങൾ സംരക്ഷിച്ചു.
