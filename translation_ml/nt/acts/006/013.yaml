id: ACT.6.13
reference: Acts 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας· Ὁ ἄνθρωπος οὗτος οὐ παύεται ⸂λαλῶν ῥήματα⸃ κατὰ τοῦ τόπου τοῦ ⸀ἁγίου καὶ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/013.yaml
  text: They also set up false witnesses who said[c][b][a], “This man does not stop speaking against this holy place and the law,”
translation:
  language: ml
  text: 'അവർ കള്ളസാക്ഷികളെയും ഹാജരാക്കി; ആ സാക്ഷികൾ പറഞ്ഞു: “ഈ മനുഷ്യൻ ഈ വിശുദ്ധസ്ഥലത്തിനും ന്യായപ്രമാണത്തിനും എതിരായി സംസാരിക്കുന്നത്[a] നിർത്തുന്നില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “ഈ വിശുദ്ധസ്ഥലത്തിനും ന്യായപ്രമാണത്തിനും എതിരായ വാക്കുകൾ സംസാരിക്കുന്നത്.” ഇവിടെ ‘വിശുദ്ധസ്ഥലം’ എന്നത് സന്ദർഭത്തിൽ ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: മൂലത്തിലെ λαλῶν ῥήματα എന്ന പ്രയോഗവും ‘വിശുദ്ധസ്ഥലം’ എന്നതിന്റെ സന്ദർഭസൂചനയും രേഖപ്പെടുത്താൻ.
lexical_decisions:
- source_word: ἔστησάν τε
  choice: അവർ ... ഹാജരാക്കി
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ സാക്ഷികളെ മുന്നോട്ടുകൊണ്ടുവരുകയോ ഹാജരാക്കുകയോ ചെയ്യുന്നതാണ് അർഥം. τέയുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-യും’ വഴി നിലനിർത്തി.
- source_word: μάρτυρας ψευδεῖς
  choice: കള്ളസാക്ഷികൾ
  rationale: തെറ്റായ സാക്ഷ്യം നൽകുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നിയമസന്ദർഭത്തിന് യോജിച്ചതുമായ മലയാളപ്രയോഗം.
- source_word: λέγοντας
  choice: അവർ പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്രവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: Ὁ ἄνθρωπος οὗτος
  choice: ഈ മനുഷ്യൻ
  rationale: ആക്ഷേപഭാവം കൂട്ടാതെ മൂലത്തിലെ നേരിട്ടുള്ള പരാമർശം നിലനിർത്തുന്നു.
- source_word: οὐ παύεται
  choice: നിർത്തുന്നില്ല
  rationale: തുടർച്ചയായി ചെയ്യുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലഭാവം വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: λαλῶν ῥήματα
  choice: സംസാരിക്കുന്നത്
  rationale: ‘വാക്കുകൾ സംസാരിക്കുക’ എന്ന അക്ഷരാർഥപ്രയോഗം മലയാളത്തിൽ കൃത്രിമമാണ്; ക്രിയാപദം തന്നെ ῥήματαയുടെ ആശയം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: κατὰ
  choice: എതിരായി
  rationale: ശത്രുതാപരമായ നിയമാരോപണത്തിൽ κατάക്ക് ഇവിടെ ‘എതിരായി’ എന്ന അർഥമാണ്.
- source_word: τοῦ τόπου τοῦ ἁγίου
  choice: ഈ വിശുദ്ധസ്ഥലം
  rationale: സന്ദർഭത്തിൽ യെരൂശലേം ദേവാലയത്തെ സൂചിപ്പിക്കുന്നു; സമീപസ്ഥവും പ്രസക്തവുമായ സ്ഥലത്തെ ലക്ഷ്യമാക്കുന്ന ആക്ഷേപത്തിന്റെ ഭാവം ‘ഈ’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τοῦ νόμου
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ മോശെയുടെ നിയമമാണ് ഉദ്ദേശ്യം; മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും മാന്യവുമായ പദം.
theological_decisions:
- issue: ‘വിശുദ്ധസ്ഥലം’, ‘ന്യായപ്രമാണം’ എന്നിവയുടെ സൂചന
  choice: യെരൂശലേം ദേവാലയത്തെയും മോശെയുടെ ന്യായപ്രമാണത്തെയും ലക്ഷ്യമിടുന്ന ആരോപണമായി വിവർത്തനം ചെയ്തു.
  alternative: പൊതുവായ ഒരു വിശുദ്ധസ്ഥലത്തെയും നിയമപാരമ്പര്യത്തെയും സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 6-ലെ സമീപസന്ദർഭം ദേവാലയത്തെയും മോശെയെയും വ്യക്തമാക്കുന്നു; എന്നാൽ ആ വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ ആരോപണരൂപം നിലനിർത്തി.
- issue: ആരോപണത്തിന്റെ തീവ്രത
  choice: ‘എതിരായി സംസാരിക്കുന്നു’ എന്ന മൂലത്തിലെ നിലപാട് നിലനിർത്തി.
  alternative: ‘ദൂഷിക്കുന്നു’ അല്ലെങ്കിൽ ‘നിന്ദിക്കുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ഭാഷ ഉപയോഗിക്കുക.
  rationale: സാക്ഷികൾ കള്ളസാക്ഷികളാണെന്ന് കഥാകൃത്ത് പറയുന്നുവെങ്കിലും അവരുടെ ഉദ്ധരിച്ച വാക്കുകളിൽ ശക്തമായ മറ്റൊരു കുറ്റപദം ഇല്ല; അതിനാൽ ആരോപണം അനാവശ്യമായി തീവ്രമാക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ നിയമാരോപണഭാവം. ‘കള്ളസാക്ഷികൾ’, ‘ഹാജരാക്കി’, ‘ന്യായപ്രമാണം’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; കൃത്രിമമായ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
