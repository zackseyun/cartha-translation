id: ACT.6.1
reference: Acts 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ταύταις πληθυνόντων τῶν μαθητῶν ἐγένετο γογγυσμὸς τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους ὅτι παρεθεωροῦντο ἐν τῇ διακονίᾳ τῇ καθημερινῇ αἱ χῆραι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/001.yaml
  text: In those days[a], as the disciples were increasing in number, a complaint arose from the Hellenists against the Hebrews[b], because their widows were being overlooked in the daily distribution.
translation:
  language: ml
  text: ആ ദിവസങ്ങളിൽ, ശിഷ്യന്മാരുടെ എണ്ണം വർധിച്ചുകൊണ്ടിരിക്കെ, എബ്രായർക്കെതിരെ ഹെല്ലനിസ്റ്റുകളിൽനിന്ന്[a] ഒരു പരാതി ഉയർന്നു. കാരണം, ദിവസേനയുള്ള വിതരണത്തിൽ അവരുടെ വിധവകൾ അവഗണിക്കപ്പെട്ടിരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഹെല്ലനിസ്റ്റുകൾ’ എന്നു പറയുന്നത് ഗ്രീക്ക് സംസാരിച്ചിരുന്ന യെഹൂദരെയും ‘എബ്രായർ’ എന്നു പറയുന്നത് എബ്രായമോ അരമായമോ സംസാരിച്ചിരുന്ന യെഹൂദരെയും സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
  - marker: b
    text: ‘അവഗണിക്കപ്പെട്ടിരുന്നു’ എന്നതിന് ‘ശ്രദ്ധിക്കപ്പെടാതെ പോയിരുന്നു’ എന്നും, ‘ദിവസേനയുള്ള വിതരണത്തിൽ’ എന്നതിന് ‘ദിവസേനയുള്ള സേവനത്തിൽ/ശുശ്രൂഷയിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ταύταις
  choice: ആ ദിവസങ്ങളിൽ
  rationale: കാലസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു; δέയുടെ മൃദുവായ ആഖ്യാനബന്ധം മലയാളത്തിൽ കൃത്രിമമായ ഒരു അധിക പദം ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: πληθυνόντων τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ എണ്ണം വർധിച്ചുകൊണ്ടിരിക്കെ
  rationale: പശ്ചാത്തലസാഹചര്യം സൂചിപ്പിക്കുന്ന genitive absolute-നെയും തുടർന്നുകൊണ്ടിരുന്ന സംഖ്യാവർധനയെയും വ്യക്തമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐγένετο γογγυσμός
  choice: ഒരു പരാതി ഉയർന്നു
  rationale: γογγυσμός എന്നതിലെ പിറുപിറുപ്പിന്റെയും പരാതിയുടെയും ആശയം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക ഭാഷയിൽ നൽകുന്നു.
- source_word: τῶν Ἑλληνιστῶν πρὸς τοὺς Ἑβραίους
  choice: എബ്രായർക്കെതിരെ ഹെല്ലനിസ്റ്റുകൾക്കിടയിൽ
  rationale: ചരിത്രപരമായ രണ്ടു കൂട്ടപ്പേരുകളും നിലനിർത്തുകയും πρός സൂചിപ്പിക്കുന്ന പരാതിയുടെ ലക്ഷ്യം ‘എതിരെ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: παρεθεωροῦντο
  choice: അവഗണിക്കപ്പെട്ടിരുന്നു
  rationale: അപൂർണകാല കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന തുടർന്നിരുന്ന അവസ്ഥ നിലനിർത്തുന്നു; മനഃപൂർവമായ വിവേചനം നിർബന്ധമായി ആരോപിക്കാതെ ശ്രദ്ധിക്കപ്പെടാതിരുന്നതിന്റെ അർഥം നൽകുന്നു.
- source_word: ἐν τῇ διακονίᾳ τῇ καθημερινῇ
  choice: ദിവസേനയുള്ള വിതരണത്തിൽ
  rationale: διακονίαയ്ക്ക് വിശാലമായി സേവനം/ശുശ്രൂഷ എന്നർഥമുണ്ടെങ്കിലും, വിധവകൾക്കുള്ള ഭൗതിക കരുതലും തുടർന്നുള്ള വാക്യങ്ങളും ഇവിടെ വിതരണമാണ് ഉദ്ദേശ്യമെന്നതിനെ പിന്തുണയ്ക്കുന്നു; വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: αἱ χῆραι αὐτῶν
  choice: അവരുടെ വിധവകൾ
  rationale: αὐτῶν ഏറ്റവും സ്വാഭാവികമായി ഹെല്ലനിസ്റ്റുകളെ സൂചിപ്പിക്കുന്നതിനാൽ ഉറവിടത്തിലെ ഉടമസ്ഥബന്ധവും സാമൂഹിക പരാതിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἑλληνισταί, Ἑβραῖοι എന്നീ സാമൂഹിക-ഭാഷാപര കൂട്ടപ്പേരുകൾ
  choice: പ്രധാനപാഠത്തിൽ ‘ഹെല്ലനിസ്റ്റുകൾ’, ‘എബ്രായർ’ എന്നീ ചരിത്രപരമായ പേരുകൾ നിലനിർത്തി അടിക്കുറിപ്പിൽ സാധ്യതയുള്ള ഭാഷാ-സാംസ്കാരിക അർഥം വിശദീകരിച്ചു.
  alternative: ‘ഗ്രീക്ക് സംസാരിക്കുന്ന യെഹൂദർ’, ‘എബ്രായമോ അരമായമോ സംസാരിക്കുന്ന യെഹൂദർ’ എന്ന് പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനപരമായി എഴുതുക.
  rationale: ഉറവിടം ഉപയോഗിക്കുന്ന കൂട്ടപ്പേരുകളെ ഒരു വിശദീകരണത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു; അതേസമയം സാധാരണ വായനക്കാരന് ആവശ്യമായ പശ്ചാത്തലം നൽകുന്നു.
- issue: παρεθεωροῦντο എന്ന പദം മനഃപൂർവമായ വിവേചനം സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘അവഗണിക്കപ്പെട്ടിരുന്നു’ എന്ന് വിവർത്തനം ചെയ്തു; മനഃപൂർവമായിരുന്നുവെന്ന് പാഠത്തിൽ ചേർത്തിട്ടില്ല.
  alternative: ‘മനഃപൂർവം ഒഴിവാക്കപ്പെട്ടിരുന്നു’ എന്ന് ശക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പദം തുടർച്ചയായ അവഗണനയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ ഉദ്ദേശ്യപൂർവത ഉറപ്പിക്കുന്നില്ല; അതിനാൽ ഉറവിടത്തിലെ സംഘർഷവും അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. അപരിചിതമായ ചരിത്രപദമായ ‘ഹെല്ലനിസ്റ്റുകൾ’ പ്രധാനപാഠത്തിൽ നിലനിർത്തി ഉടൻ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു; സഭാപരമായ പ്രത്യേക സാങ്കേതികഭാഷ പ്രധാനപാഠത്തിൽ ഒഴിവാക്കി.
