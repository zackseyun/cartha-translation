reference: Acts 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσκαλεσάμενοι δὲ οἱ δώδεκα τὸ πλῆθος τῶν μαθητῶν εἶπαν· Οὐκ ἀρεστόν ἐστιν ἡμᾶς καταλείψαντας τὸν λόγον τοῦ θεοῦ διακονεῖν τραπέζαις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/002.yaml
  text: So the Twelve called together the whole group of the disciples and said[c][b][a], “It is not right for us to abandon the word of God to serve tables.”
translation:
  language: ml
  text: 'അതിനാൽ പന്ത്രണ്ടുപേർ ശിഷ്യന്മാരുടെ മുഴുവൻ കൂട്ടത്തെയും വിളിച്ചുകൂട്ടി പറഞ്ഞു: “ദൈവവചനം ഉപേക്ഷിച്ച് മേശകളിൽ സേവനം ചെയ്യുന്നത് ഞങ്ങൾക്ക് ഉചിതമല്ല.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉചിതമല്ല’ എന്നതിന് ‘സ്വീകാര്യമല്ല’ അല്ലെങ്കിൽ ‘അഭികാമ്യമല്ല’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘മേശകളിൽ സേവനം ചെയ്യുക’ എന്നത് സമൂഹത്തിന്റെ ഭക്ഷണവും വിഭവങ്ങളും പ്രായോഗികമായി വിതരണം ചെയ്യുന്നതുമായി ബന്ധപ്പെട്ട ചുമതല കൈകാര്യം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: വിളിച്ചുകൂട്ടി
  rationale: സഭയെ ഒരുമിച്ചുകൂട്ടിയെന്ന മധ്യപ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിലെ പരാതിയെത്തുടർന്നുള്ള അപ്പൊസ്തലന്മാരുടെ പ്രതികരണത്തിലേക്കുള്ള ആഖ്യാനപുരോഗതി സൂചിപ്പിക്കുന്നു; ശക്തമായ വൈരുധ്യം ചേർക്കുന്നില്ല.
- source_word: οἱ δώδεκα
  choice: പന്ത്രണ്ടുപേർ
  rationale: ഗ്രീക്കിലെ സ്ഥിരമായ സംഘനാമം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അപ്പൊസ്തലന്മാർ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: τὸ πλῆθος τῶν μαθητῶν
  choice: ശിഷ്യന്മാരുടെ മുഴുവൻ കൂട്ടം
  rationale: πλῆθος എന്നത് ഇവിടെ വലിയ സമൂഹത്തെയോ സമ്പൂർണ സമ്മേളനത്തെയോ സൂചിപ്പിക്കുന്നു; വായിക്കാൻ സ്വാഭാവികവും കൂട്ടായ അർഥം നിലനിർത്തുന്നതുമായ പ്രയോഗം.
- source_word: Οὐκ ἀρεστόν ἐστιν
  choice: ഉചിതമല്ല
  rationale: ἀρεστόν എന്നതിലെ സ്വീകാര്യത/ഔചിത്യം എന്ന ആശയം സാഹചര്യത്തിന് യോജിച്ചവിധം നൽകുന്നു; സേവനം തന്നെ തെറ്റാണെന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: ἡμᾶς καταλείψαντας
  choice: ഞങ്ങൾ ഉപേക്ഷിച്ച്
  rationale: καταλείπω എന്നതിലെ വിട്ടുകളയുക/പിന്നിൽ ഉപേക്ഷിക്കുക എന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: പ്രഖ്യാപിക്കപ്പെടുന്ന ദൈവിക സന്ദേശത്തെയും ‘വചനം’ എന്ന ദൈവശാസ്ത്രപരമായ മുഴക്കത്തെയും ഒരുപോലെ നിലനിർത്തുന്ന സുപരിചിതമായ മലയാളപ്രയോഗം.
- source_word: διακονεῖν
  choice: സേവനം ചെയ്യുക
  rationale: പ്രായോഗിക സേവനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു; പിൽക്കാല സഭാപദവിയുടെ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: τραπέζαις
  choice: മേശകളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ഭക്ഷണവും വിഭവങ്ങളും വിതരണം ചെയ്യുന്നതുമായി ബന്ധപ്പെട്ട പ്രായോഗിക പ്രവർത്തനം സന്ദർഭവും അടിക്കുറിപ്പും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പ്രായോഗിക സേവനവുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ അപ്പൊസ്തലന്മാരുടെ മുൻഗണന
  choice: ‘ദൈവവചനം ഉപേക്ഷിച്ച് ... ചെയ്യുന്നത് ഞങ്ങൾക്ക് ഉചിതമല്ല’ എന്നായി, ചുമതലകളുടെ ഔചിത്യവും വിളിയും സംബന്ധിച്ച പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഞങ്ങൾക്ക് പ്രസാദകരമല്ല’ അല്ലെങ്കിൽ ‘ഞങ്ങൾക്ക് സ്വീകാര്യമല്ല’.
  rationale: വാക്യം സേവനങ്ങളുടെ ആത്മീയമൂല്യം തരംതിരിക്കുന്നില്ല; ദൈവവചനസേവനം ഉപേക്ഷിക്കാതെ അപ്പൊസ്തലന്മാർ തങ്ങളുടെ പ്രത്യേക ഉത്തരവാദിത്വത്തിന് മുൻഗണന നൽകുന്നതാണ്. ഈ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവവചനം’, ‘ശിഷ്യന്മാർ’ എന്നീ സുപരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുഗമമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
