  source_fidelity: 'The core actions and sequence are conveyed accurately: they agitated the people, elders, and scribes; then abruptly approached Stephen, seized him, and brought him before the council. However, ‘ന്യായാധിപസഭ’ narrows συνέδριον into a generic court of judges, whereas the Jerusalem institution intended here is more specifically and transparently identified as the Sanhedrin.'
