id: ACT.6.12
reference: Acts 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνεκίνησάν τε τὸν λαὸν καὶ τοὺς πρεσβυτέρους καὶ τοὺς γραμματεῖς, καὶ ἐπιστάντες συνήρπασαν αὐτὸν καὶ ἤγαγον εἰς τὸ συνέδριον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/012.yaml
  text: So they stirred up the people and the elders and the scribes[a], and coming upon him, they seized him and brought him before the Sanhedrin,
translation:
  language: ml
  text: അങ്ങനെ അവർ ജനങ്ങളെയും മൂപ്പന്മാരെയും ശാസ്ത്രിമാരെയും ഇളക്കിവിട്ടു. പിന്നെ അവർ അവന്റെ അടുത്തേക്ക് പെട്ടെന്ന് ചെന്ന്, അവനെ പിടിച്ച് സൻഹെദ്രിന്റെ[a] മുമ്പിൽ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സമിതി.’ ഗ്രീക്ക് συνέδριον പൊതുവേ ഒരു സമിതിയെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ യെഹൂദരുടെ ഭരണ-ന്യായ സമിതിയായ സൻഹെദ്രിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκίνησάν
  choice: ഇളക്കിവിട്ടു
  rationale: ജനങ്ങളെ വൈകാരികമായും സാമൂഹികമായും പ്രക്ഷുബ്ധരാക്കി പ്രവർത്തനത്തിലേക്കു പ്രേരിപ്പിച്ചുവെന്ന കാരകഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; അക്രമത്തിന് നേരിട്ട് പ്രേരിപ്പിച്ചു എന്ന് അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
- source_word: τε
  choice: അങ്ങനെ
  rationale: മൃദുവായ ആഖ്യാനബന്ധവും മുൻസന്ദർഭത്തിന്റെ തുടർച്ച/ഫലഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸν λαὸν
  choice: ജനങ്ങളെ
  rationale: λαός എന്നതിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ജനക്കൂട്ടം’ എന്ന് സന്ദർഭത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: τοὺς πρεσβυτέρους
  choice: മൂപ്പന്മാരെ
  rationale: പ്രായംചെന്ന പുരുഷന്മാർ എന്നതിലുപരി അംഗീകൃത യെഹൂദ നേതാക്കളെ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ പദവി നിലനിർത്തുന്നു.
- source_word: τοὺς γραμματεῖς
  choice: ശാസ്ത്രിമാരെ
  rationale: തിരുവെഴുത്തിലും ന്യായപ്രമാണത്തിലും പ്രാവീണ്യമുള്ള അംഗീകൃത പണ്ഡിതന്മാരെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും ഗ്രഹിക്കാവുന്നതുമായ ചരിത്രപദം.
- source_word: ἐπιστάντες
  choice: പെട്ടെന്ന് സ്തെഫാനൊസിന്റെ നേരെ ചെന്ന്
  rationale: ἐφίστημι ഇവിടെ നൽകുന്ന അപ്രതീക്ഷിതമായി അടുത്തെത്തുന്ന ഭാവം വ്യക്തമാക്കുന്നു. ഗ്രീക്കിൽ സർവനാമം മാത്രമാണെങ്കിലും മലയാളത്തിൽ വ്യക്തതയ്ക്കായി മുൻസന്ദർഭത്തിലെ സ്തെഫാനൊസിന്റെ പേര് ഉപയോഗിക്കുന്നു.
- source_word: συνήρπασαν
  choice: പിടിച്ച്
  rationale: ബലമായി കൈവശപ്പെടുത്തുന്ന പ്രവൃത്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ‘വലിച്ചിഴച്ചു’ എന്ന് ചലനഘടകം അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἤγαγον
  choice: കൊണ്ടുവന്നു
  rationale: മുൻപുള്ള ബലപ്രയോഗത്തിന്റെ പശ്ചാത്തലത്തിൽ ἄγωയുടെ കൊണ്ടുപോകൽ/കൊണ്ടുവരൽ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ συνέδριον
  choice: ന്യായാധിപസഭ
  rationale: യെഹൂദരുടെ ഭരണ-ന്യായ സമിതിയെന്ന ചരിത്രസ്ഥാപനത്തെ സാധാരണ മലയാളവായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ പൊതുവായ ‘സഭ/സമിതി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: συνέδριον എന്ന സ്ഥാപനനാമത്തിന്റെ പരിഭാഷ
  choice: ന്യായാധിപസഭ
  alternative: സൻഹെദ്രിൻ; സഭ
  rationale: യെരൂശലേമിലെ മൂപ്പന്മാരും ശാസ്ത്രിമാരും ഉൾപ്പെട്ട യെഹൂദ ഭരണ-ന്യായ സമിതിയാണ് ഇവിടെ ഉദ്ദേശിക്കപ്പെടുന്നത്. മലയാളത്തിൽ പ്രവർത്തനപരമായി വ്യക്തമായ പദം മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ കൂടുതൽ പൊതുവായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥാപനത്തിന്റെ അർഥം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കാൻ ‘ന്യായാധിപസഭ’ ഉപയോഗിച്ചു; ചരിത്രനാമവും ഗ്രീക്കിലെ പൊതുവായ അർഥസാധ്യതയും അടിക്കുറിപ്പിൽ നൽകി. ഇംഗ്ലീഷ് പാഠത്തിലെ അടിക്കുറിപ്പുസ്ഥാനത്തിലെ പൊരുത്തക്കേട് ആവർത്തിക്കാതെ, συνέδριον പരിഭാഷയ്ക്കു പിന്നാലെ [a] ചേർത്തു.
