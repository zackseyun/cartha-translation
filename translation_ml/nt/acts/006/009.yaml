id: ACT.6.9
reference: Acts 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνέστησαν δέ τινες τῶν ἐκ τῆς συναγωγῆς τῆς λεγομένης Λιβερτίνων καὶ Κυρηναίων καὶ Ἀλεξανδρέων καὶ τῶν ἀπὸ Κιλικίας καὶ Ἀσίας συζητοῦντες τῷ Στεφάνῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/009.yaml
  text: But some of those from the synagogue called the Synagogue of the Freedmen[a], and of the Cyrenians and Alexandrians, and of those from Cilicia and Asia[b], stood up and began arguing with Stephen.
translation:
  language: ml
  text: എന്നാൽ, ‘സ്വതന്ത്രരാക്കപ്പെട്ടവരുടേത്’ എന്നു വിളിക്കപ്പെട്ട സിനഗോഗിൽ[a]നിന്നുള്ളവരിലും കുറേനക്കാരിലും അലക്സാന്ത്രിയക്കാരിലും കിലിക്യയിൽനിന്നും ഏഷ്യയിൽനിന്നും[b] വന്നവരിലും ചിലർ എഴുന്നേറ്റ് സ്തെഫാനൊസിനോടു തർക്കിക്കാൻ തുടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലിബെർത്തീനുകളുടെ സിനഗോഗ്.” ഗ്രീക്ക് പദം അടിമത്തത്തിൽനിന്ന് മോചിതരായവരെയാണു സൂചിപ്പിക്കുന്നത്; അവരുടെ സന്തതികളെയും ഇതിൽ ഉൾക്കൊള്ളിച്ചിരിക്കാം. ഈ പട്ടിക ഒരൊറ്റ സിനഗോഗിനെയാണോ ഒന്നിലധികം സിനഗോഗുകളെയാണോ സൂചിപ്പിക്കുന്നത് എന്നതിൽ വ്യാഖ്യാനഭേദമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഏഷ്യ” എന്നത് ആധുനിക ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστησαν
  choice: എഴുന്നേറ്റ്
  rationale: എതിർപ്പുമായി രംഗത്തുവരുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂർത്തമായ ദൃശ്യവും സന്ദർഭത്തിലെ വിരുദ്ധഭാവവും നിലനിർത്തുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: സ്തെഫാനൊസിന്റെ ശുശ്രൂഷയെക്കുറിച്ചുള്ള മുൻവിവരണത്തിൽനിന്ന് എതിർപ്പിലേക്കുള്ള നേരിയ വൈരുധ്യമുള്ള ആഖ്യാനമാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: τινες τῶν ἐκ τῆς συναγωγῆς
  choice: സിനഗോഗിൽപ്പെട്ട ചിലരും
  rationale: τινες-നോടു ചേർന്ന ഭാഗിക ഷഷ്ഠീവിഭക്തിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: συναγωγῆς
  choice: സിനഗോഗ്
  rationale: യഹൂദരുടെ സഭയെയോ യോഗസ്ഥലത്തെയോ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും വ്യക്തവുമായ പദം.
- source_word: τῆς λεγομένης
  choice: എന്നു വിളിക്കപ്പെട്ടിരുന്ന
  rationale: അത് ആ സിനഗോഗിന്റെ അറിയപ്പെട്ടിരുന്ന പേരാണെന്ന് വ്യക്തമാക്കുന്നു; അപഹാസ്യമായ 'എന്നു പറയപ്പെടുന്ന' എന്ന ഭാവം ഒഴിവാക്കുന്നു.
- source_word: Λιβερτίνων
  choice: സ്വതന്ത്രരാക്കപ്പെട്ടവരുടെ
  rationale: മുൻ അടിമകളായി മോചിപ്പിക്കപ്പെട്ടവരെയോ അവരുടെ സന്തതികളെയോ സൂചിപ്പിക്കുന്ന ചരിത്രപരമായ അർഥം നൽകുന്നു; ആധുനിക ഭാഷയിലെ തെറ്റിദ്ധരിപ്പിക്കുന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: Κυρηναίων
  choice: കുറേനക്കാർ
  rationale: കുറേനയിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ജനനാമം.
- source_word: Ἀλεξανδρέων
  choice: അലക്സാന്ത്രിയക്കാർ
  rationale: അലക്സാന്ത്രിയയിൽനിന്നുള്ളവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ജനനാമം.
- source_word: τῶν ἀπὸ Κιλικίας καὶ Ἀσίας
  choice: കിലിക്യയിൽനിന്നും ഏഷ്യയിൽനിന്നും വന്നവരിൽ ചിലരും
  rationale: ἀπό സൂചിപ്പിക്കുന്ന സ്ഥലമൂലവും ആവർത്തിച്ചുള്ള ഭാഗികബന്ധവും വ്യക്തമായി നൽകുന്നു; 'ഏഷ്യ'യുടെ പുരാതന പ്രാദേശിക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: συζητοῦντες
  choice: തർക്കിക്കാൻ തുടങ്ങി
  rationale: ഇവിടെ നിഷ്പക്ഷമായ സംഭാഷണമല്ല, സജീവമായ വാക്കുതർക്കമാണെന്ന സന്ദർഭാർഥം നൽകുന്നു; ἀνέστησαν-നോടൊപ്പം പ്രവർത്തനത്തിന്റെ ആരംഭം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τῷ Στεφάνῳ
  choice: സ്തെഫാനൊസിനോടു
  rationale: συζητέω-യോടു ചേർന്ന ദത്തിവിന്റെ 'ആരോടുകൂടെ/ആരോടു' എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സിനഗോഗുകളുടെ എണ്ണത്തെക്കുറിച്ചുള്ള വാക്യഘടനാപരമായ അനിശ്ചിതത്വം
  choice: ഒരൊറ്റ പേരുള്ള സിനഗോഗുമായി ബന്ധപ്പെട്ട വിവിധ കൂട്ടങ്ങളെന്ന വായന
  alternative: വ്യത്യസ്ത പ്രദേശക്കാരുടെ ഒന്നിലധികം സിനഗോഗുകൾ
  rationale: സിനഗോഗ് എന്ന ഏകവചനപദത്തെയും അതിനെ വിശേഷിപ്പിക്കുന്ന ഏകവചന കൃതന്തത്തെയും നേരിട്ട് പിന്തുടരുന്നു; എങ്കിലും ഗ്രീക്ക് പട്ടികയുടെ ഘടനയെ അടിസ്ഥാനമാക്കി ഒന്നിലധികം സിനഗോഗുകൾ ഉണ്ടായിരുന്നെന്ന വായന സാധ്യമാണെന്നത് അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്ഥലനാമങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളോട് ചേർന്ന് ‘കുറേന’, ‘അലക്സാന്ത്രിയ’, ‘കിലിക്യ’, ‘സ്തെഫാനൊസ്’ എന്നിങ്ങനെ നൽകിയിരിക്കുന്നു. ഗ്രീക്കിലെ നീണ്ട പട്ടികയുടെ ബന്ധങ്ങൾ വ്യക്തമാക്കാൻ ‘ചിലരും’ ആവർത്തിച്ചിട്ടുണ്ടെങ്കിലും വാക്യത്തിന്റെ ഏകത നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
