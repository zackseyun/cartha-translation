revisions:
- from: എന്നാൽ, സ്വതന്ത്രരാക്കപ്പെട്ടവരുടെ സിനഗോഗ്[a] എന്നു വിളിക്കപ്പെട്ടിരുന്ന സിനഗോഗിൽപ്പെട്ട ചിലരും, കുറേനക്കാരിലും അലക്സാന്ത്രിയക്കാരിലും ചിലരും, കിലിക്യയിൽനിന്നും ഏഷ്യയിൽനിന്നും[b] വന്നവരിൽ ചിലരും എഴുന്നേറ്റ് സ്തെഫാനൊസിനോടു തർക്കിക്കാൻ തുടങ്ങി.
  to: എന്നാൽ, ‘സ്വതന്ത്രരാക്കപ്പെട്ടവരുടേത്’ എന്നു വിളിക്കപ്പെട്ട സിനഗോഗിൽ[a]നിന്നുള്ളവരിലും കുറേനക്കാരിലും അലക്സാന്ത്രിയക്കാരിലും കിലിക്യയിൽനിന്നും ഏഷ്യയിൽനിന്നും[b] വന്നവരിലും ചിലർ എഴുന്നേറ്റ് സ്തെഫാനൊസിനോടു തർക്കിക്കാൻ തുടങ്ങി.
  rationale: The revision uses one final “ചിലർ” for the source's single τινες and retains the coordinated list without deciding the debated question of how many synagogue groups are intended. It also streamlines the designation of the Freedmen synagogue and places both footnote anchors directly in the corresponding phrases.
