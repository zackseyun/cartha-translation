revisions:
- from: എന്നാൽ അവൻ സംസാരിച്ചിരുന്ന ജ്ഞാനത്തെയും ആത്മാവിനെയും ചെറുത്തുനിൽക്കാൻ അവർക്കു കഴിഞ്ഞില്ല.[a]
  to: എന്നാൽ, അവൻ സംസാരിക്കുമ്പോൾ പ്രകടമായ ജ്ഞാനത്തെയും, അവനെ സംസാരിപ്പിച്ച ആത്മാവിനെയും ചെറുത്തുനിൽക്കാൻ അവർക്കു കഴിഞ്ഞില്ല.[a]
  rationale: The revision resolves the Malayalam attachment ambiguity by presenting the wisdom as evident in Stephen's speech and the spirit as that which enabled his speaking. It preserves the source-contextual reading without making a denominationally binding identification in the main text, and it retains the alternative reading in a focused footnote.
