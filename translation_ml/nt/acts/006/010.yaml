id: ACT.6.10
reference: Acts 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐκ ἴσχυον ἀντιστῆναι τῇ σοφίᾳ καὶ τῷ πνεύματι ᾧ ἐλάλει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/006/010.yaml
  text: And they were not able to withstand the wisdom and the Spirit by which he was speaking[a].
translation:
  language: ml
  text: എന്നാൽ, അവൻ സംസാരിക്കുമ്പോൾ പ്രകടമായ ജ്ഞാനത്തെയും, അവനെ സംസാരിപ്പിച്ച ആത്മാവിനെയും ചെറുത്തുനിൽക്കാൻ അവർക്കു കഴിഞ്ഞില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, «അവനെ സംസാരിപ്പിച്ച ആത്മാവ്» എന്നത് പരിശുദ്ധാത്മാവിനെയല്ല, സ്തെഫാനൊസിന്റെ സ്വന്തം ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്ന് എടുക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσχυον
  choice: അവർക്കു കഴിഞ്ഞില്ല
  rationale: ഇവിടെയുള്ള അപൂർണഭൂതകാലരൂപം അവരുടെ തുടർന്നുള്ള അശക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി അത് ‘കഴിഞ്ഞില്ല’ എന്നു നൽകുന്നു.
- source_word: ἀντιστῆναι
  choice: ചെറുത്തുനിൽക്കാൻ
  rationale: വിജയകരമായി എതിർത്തുനിൽക്കുക, മറുപടി നൽകി പിടിച്ചുനിൽക്കുക എന്ന സന്ദർഭാർഥം ഈ പ്രയോഗം നൽകുന്നു.
- source_word: σοφίᾳ
  choice: ജ്ഞാനത്തെ
  rationale: ഗ്രീക്കിലെ നിർദേശക ഉപപദം സ്തെഫാനൊസിന്റെ സംസാരത്തിൽ പ്രകടമായ പ്രത്യേക ജ്ഞാനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിനെ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 6:5-ലെ സമീപസന്ദർഭവും ജ്ഞാനത്തോടുള്ള കൂട്ടിച്ചേർക്കലും പരിശുദ്ധാത്മാവിനെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; എന്നാൽ സ്തെഫാനൊസിന്റെ സ്വന്തം ആത്മാവ് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ᾧ ἐλάλει
  choice: അവൻ സംസാരിച്ചിരുന്ന
  rationale: ബന്ധസർവനാമത്തിന്റെ ഉപകരണാർഥം മലയാളത്തിൽ ഈ ബന്ധവാക്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; അപൂർണഭൂതകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തിയും ‘സംസാരിച്ചിരുന്ന’ എന്നതിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: πνεύματι പരിശുദ്ധാത്മാവിനെയോ സ്തെഫാനൊസിന്റെ സ്വന്തം ആത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാനവാചകത്തിൽ ‘ആത്മാവ്’ എന്നത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി സ്വീകരിച്ചു
  alternative: സ്തെഫാനൊസിന്റെ സ്വന്തം ആത്മാവ് അഥവാ ആന്തരിക പ്രേരണ
  rationale: സ്തെഫാനൊസ് പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞവനാണെന്ന സമീപസന്ദർഭവും ‘ജ്ഞാനവും ആത്മാവും’ എന്ന കൂട്ടുപ്രയോഗവും പരിശുദ്ധാത്മാവിനെ അനുകൂലിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദം മാത്രം ഈ സാധ്യതയെ നിർബന്ധമാക്കാത്തതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദത്തിവിഭക്തി ആശ്രിതമായ ‘ജ്ഞാനത്തെയും ആത്മാവിനെയും ചെറുത്തുനിൽക്കുക’ എന്ന ബന്ധം മലയാളത്തിലെ കർമവിഭക്തിയിൽ നൽകി. ‘ആത്മാവ്’ എന്ന പദത്തിന്റെ ദൈവിക/മാനുഷിക സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
