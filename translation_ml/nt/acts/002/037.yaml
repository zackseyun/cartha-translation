id: ACT.2.37
reference: Acts 2:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: ml
  text: അവർ ഇതു കേട്ടപ്പോൾ, അവരുടെ ഹൃദയം കുത്തേറ്റതുപോലെ അവർ ആഴത്തിൽ വേദനിച്ചു[a]. അവർ പത്രോസിനോടും മറ്റു അപ്പൊസ്തലന്മാരോടും, “സഹോദരന്മാരേ, ഞങ്ങൾ എന്തു ചെയ്യണം[b]?” എന്നു പറഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർ ഹൃദയത്തിൽ കുത്തേറ്റു.” ഗ്രീക്ക് പ്രയോഗം കടുത്ത ആന്തരിക ബോധ്യമോ വ്യഥയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “പുരുഷന്മാരേ, സഹോദരന്മാരേ” എന്നാണ്. സന്ദർഭമനുസരിച്ച് ഈ പതിവ് അഭിസംബോധന “സഹോദരന്മാരേ” എന്നോ “സഹോദരീസഹോദരന്മാരേ” എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: അവർ ഇതു കേട്ടപ്പോൾ
  rationale: മുൻപ്രസംഗം കേട്ടതിനെത്തുടർന്നുള്ള പ്രതികരണമാണ് aorist participle സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ സ്വാഭാവികമായി വ്യക്തമാകുന്നു; δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, ആഖ്യാനത്തിന്റെ മുന്നേറ്റമാണ്.
- source_word: κατενύγησαν τὴν καρδίαν
  choice: ഹൃദയത്തിൽ ആഴമായി മുറിവേറ്റവരെപ്പോലെയായി
  rationale: പ്രയോഗത്തിലെ കുത്തുകയോ തുളയ്ക്കുകയോ ചെയ്യുന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, കടുത്ത ആന്തരിക ബോധ്യവും വ്യഥയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἶπόν τε
  choice: എന്നു ചോദിച്ചു
  rationale: λέγω അക്ഷരാർഥത്തിൽ ‘പറഞ്ഞു’ എന്നാണെങ്കിലും തുടർന്നുവരുന്നത് നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് സ്വാഭാവികവും ഉള്ളടക്കത്തോട് കൃത്യവുമാണ്.
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: പത്രോസിനോടും ശേഷിച്ച അപ്പൊസ്തലന്മാരോടും
  rationale: λοιπούς എന്നതിലെ ‘ശേഷിച്ചവർ’ എന്ന അർഥം നിലനിർത്തുകയും അഭിസംബോധിതരിൽ പത്രോസിനെ മറ്റുള്ള അപ്പൊസ്തലന്മാരിൽനിന്ന് വേർതിരിച്ചുകാട്ടുകയും ചെയ്യുന്നു.
- source_word: Τί ποιήσωμεν
  choice: ഞങ്ങൾ എന്തു ചെയ്യണം
  rationale: ആലോചനാത്മക aorist subjunctive ശരിയായ തുടർനടപടി എന്തെന്ന ചോദ്യമാണ്; ‘ചെയ്യണം’ സമകാലിക മലയാളത്തിൽ ഈ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പരമ്പരാഗത അഭിസംബോധനയിലെ കുടുംബബന്ധപദം നിലനിർത്തുന്നു. ἄνδρες പ്രത്യേകം ചേർത്ത് ‘പുരുഷന്മാരായ സഹോദരന്മാരേ’ എന്നു പറയുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനമാകും.
theological_decisions:
- issue: ലിംഗസൂചനയുള്ള അഭിസംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ; പുരുഷന്മാരേ, സഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് പ്രയോഗം വ്യാകരണപരമായി പുല്ലിംഗമാണ്; അതിനാൽ പ്രധാനപാഠത്തിൽ അതിനെ പൂർണമായി ലിംഗനിരപേക്ഷമാക്കിയിട്ടില്ല. എന്നാൽ സന്ദർഭാനുസരണം ഇത് മുഴുവൻ സമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന പതിവ് അഭിസംബോധനയായിരിക്കാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഹൃദയം മുറിയുന്ന മൂലഭാഷാരൂപകം നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ തെറ്റായ ശാരീരിക അർഥം ഒഴിവാക്കാൻ ഉപമാസൂചന ചേർത്തു. നേരിട്ടുള്ള അഭിസംബോധന മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ചോദ്യത്തിന്റെ തുടക്കത്തിലാക്കി.
