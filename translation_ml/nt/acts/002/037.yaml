revisions:
- from: അവർ ഇതു കേട്ടപ്പോൾ[a] ഹൃദയത്തിൽ ആഴമായി മുറിവേറ്റവരെപ്പോലെയായി. അവർ പത്രോസിനോടും ശേഷിച്ച അപ്പൊസ്തലന്മാരോടും, “സഹോദരന്മാരേ, ഞങ്ങൾ എന്തു ചെയ്യണം[b]?” എന്നു ചോദിച്ചു.
