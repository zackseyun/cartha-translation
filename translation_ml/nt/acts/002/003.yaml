  text: καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, ⸂καὶ ἐκάθισεν⸃ ἐφ’ ἕνα ἕκαστον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: ml
  text: തീ പോലെയുള്ള, വിഭജിക്കപ്പെട്ടുകൊണ്ടിരുന്ന നാവുകൾ അവർക്കു പ്രത്യക്ഷപ്പെട്ടു; അവരിൽ ഓരോരുത്തരുടെയുംമേൽ അതു വന്നു തങ്ങി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘വിഭജിക്കപ്പെട്ട, തീ പോലെയുള്ള നാവുകൾ’ അല്ലെങ്കിൽ ‘തീയുടെ നാവുകൾപോലെ.’ ഗ്രീക്ക് വാക്യഘടന നാവുകളുടെ ദൃശ്യപ്രത്യക്ഷതയെയും അവ അവരിലേക്കു വിതരണം ചെയ്യപ്പെട്ടതിനെയും ഒരുപോലെ എടുത്തുകാട്ടുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθησαν
  choice: പ്രത്യക്ഷപ്പെട്ടു
  rationale: അവർക്കു ദൃശ്യമായി എന്ന സംഭവാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; കൃത്രിമമായ കർമണിപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: പ്രത്യക്ഷീകരണം ആരുടെ മുമ്പാകെയാണുണ്ടായത് എന്നു സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διαμεριζόμεναι
  choice: അവ വിഭജിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: γλῶσσαι എന്ന ബഹുവചനത്തെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന മധ്യമ/കർമണി കൃദന്തരൂപത്തിന്റെ തുടരുന്ന ഭാവം നിലനിർത്തുന്നു; വിഭജനമോ വിതരണമോ എന്ന സൂക്ഷ്മമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: γλῶσσαι
  choice: നാവുകൾ
  rationale: നാവിന്റെ രൂപമുള്ള ദൃശ്യപ്രതിഭാസത്തെയും തുടർന്നുള്ള ഭാഷണവിഷയവുമായുള്ള പദബന്ധത്തെയും ഒരുപോലെ സംരക്ഷിക്കുന്നു; ‘ജ്വാലകൾ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ὡσεὶ πυρός
  choice: തീ പോലെയുള്ള
  rationale: ὡσεὶ സൂചിപ്പിക്കുന്ന ഉപമ വ്യക്തമായി നിലനിർത്തുന്നു; അത് അക്ഷരാർഥത്തിൽ തീയായിരുന്നു എന്നു പറയുന്നില്ല.
- source_word: ἐκάθισεν
  choice: അത് ... വന്നു നിലകൊണ്ടു
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തെ ‘അത്’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ദൃശ്യപ്രതിഭാസം ഓരോരുത്തരുടെയുംമേൽ വന്നു തങ്ങിയെന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: അവരിൽ ഓരോരുത്തരുടെയുംമേൽ
  rationale: സന്നിഹിതരായ ഓരോ വ്യക്തിയിലേക്കുമുള്ള വിതരണത്തിന്റെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പെന്തെക്കൊസ്തിലെ പ്രത്യക്ഷീകരണത്തിന്റെ സ്വഭാവം
  choice: ‘തീ പോലെയുള്ള നാവുകൾ’ എന്നു വിവർത്തനം ചെയ്തു; തീ തന്നെയെന്നോ സംസാരഭാഷകൾ മാത്രമെന്നോ നിർണയിച്ചില്ല.
  alternative: ‘തീജ്വാലകൾ’ അല്ലെങ്കിൽ ‘തീപോലെയുള്ള ഭാഷകൾ’
  rationale: γλῶσσαι എന്ന നാമവും ὡσεὶ എന്ന ഉപമാസൂചകവും ചേർന്ന് ദൃശ്യരൂപത്തെയും തുടർന്നുള്ള ഭാഷണബന്ധത്തെയും തുറന്നുവയ്ക്കുന്നു; വിവർത്തനം ഈ രണ്ടിനെയും ചുരുക്കരുത്.
- issue: ബഹുവചന നാവുകൾക്കുശേഷമുള്ള ഏകവചന ക്രിയ
  choice: ‘അത് ... വന്നു നിലകൊണ്ടു’ എന്ന് ഏകവചനത്തിന്റെ അസാധാരണത നിലനിർത്തി.
  alternative: ‘അവ ... വന്നു നിലകൊണ്ടു’
  rationale: ἐκάθισεν ഏകവചനമാണ്; പ്രതിഭാസത്തെ സമഗ്രമായി കാണുന്നതാകാം, എങ്കിലും മൂലപാഠത്തിലെ വ്യാകരണപരമായ സംഘർഷം ബഹുവചനമാക്കി നിശ്ശബ്ദമായി പരിഹരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നാവുകൾ’ എന്ന ബൈബിൾസന്ദർഭത്തിൽ പരിചിതമായ പദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. മൂലത്തിലെ ഏകവചന ἐκάθισεν ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
