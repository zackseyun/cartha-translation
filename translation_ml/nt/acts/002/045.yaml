  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ κτήματα καὶ τὰς ὑπάρξεις ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: ml
  text: അവർ തങ്ങളുടെ സ്വത്തുക്കളും വസ്തുവകകളും വിൽക്കുകയും, ആർക്കെങ്കിലും ആവശ്യമുണ്ടായിരുന്നതനുസരിച്ച് അവ എല്ലാവർക്കും വിതരണം ചെയ്യുകയും ചെയ്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂസ്വത്തുക്കളും വസ്തുവകകളും.’ κτήματα എന്നത് സ്വന്തമാക്കിയ സ്വത്തിനെയോ ഉടമസ്ഥാവകാശങ്ങളെയോ, പലപ്പോഴും ഭൂസ്വത്തിനെയോ, സൂചിപ്പിക്കാം; ὑπάρξεις എന്നത് ഒരാളുടെ ഉടമസ്ഥതയിലുള്ള വസ്തുവകകളെ കൂടുതൽ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: ഭൂസ്വത്തുക്കൾ
  rationale: ഈ പദം പൊതുവേ സ്വന്തമാക്കിയ സ്വത്തിനെ, പ്രത്യേകിച്ച് ഭൂമിയോ ഭൂമിയിലുള്ള ഉടമസ്ഥാവകാശങ്ങളെയോ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ὑπάρξεις എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താൻ ‘ഭൂസ്വത്തുക്കൾ’ ഉപയോഗിച്ചു.
- source_word: ὑπάρξεις
  choice: മറ്റു സമ്പാദ്യങ്ങൾ
  rationale: ഒരാളുടെ ഉടമസ്ഥതയിലുള്ള വസ്തുക്കളെയും ആസ്തികളെയും സൂചിപ്പിക്കുന്നു. κτήματα-യിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട്, ഭൂസ്വത്തല്ലാത്ത ഉടമസ്ഥവസ്തുക്കളും ഉൾപ്പെടാവുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമായി ഇത് തിരഞ്ഞെടുത്തു.
- source_word: ἐπίπρασκον
  choice: വിറ്റുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം ഭൂതകാലത്തിലെ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഒറ്റത്തവണ പൂർത്തിയായ വിൽപ്പനയെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: διεμέριζον
  choice: വീതിച്ചുകൊടുക്കുകയും ചെയ്തു
  rationale: സമൂഹത്തിലെ ആളുകൾക്കിടയിൽ ആവശ്യത്തിനനുസരിച്ച് പങ്കിട്ടുനൽകുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കൃത്യമായ വിതരണരീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: αὐτά
  choice: അവ
  rationale: ഗ്രീക്കിലെ സർവനാമത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തി, വിറ്റ സ്വത്തുക്കളെയോ അവയിൽനിന്ന് ലഭിച്ചതിനെയോ സൂചിപ്പിക്കാവുന്ന യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: πᾶσιν
  choice: എല്ലാവർക്കും
  rationale: സന്ദർഭത്തിലെ സമൂഹാംഗങ്ങളെ വിപുലമായി സ്വീകർത്താക്കളായി സൂചിപ്പിക്കുന്ന ദത്തിവ് ബഹുവചനത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക രൂപം.
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: ഓരോരുത്തർക്കും ആവശ്യമുണ്ടായിരുന്നതനുസരിച്ച്
  rationale: വ്യക്തികളുടെ ആവശ്യത്തിന് അനുപാതമായാണ് വിതരണം നടന്നതെന്ന അർഥവും ἄν τις എന്ന അനിശ്ചിത വ്യക്തിസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വാസികൾ സ്വത്തുക്കൾ പങ്കിട്ടതിന്റെ സ്വഭാവം
  choice: ആവശ്യാനുസരണം സ്വത്തുക്കൾ വിറ്റ് വിതരണം ചെയ്തുകൊണ്ടിരുന്ന ആവർത്തിതമായ പ്രവൃത്തിയായി വിവർത്തനം ചെയ്തു; സ്വകാര്യ ഉടമസ്ഥത പൂർണമായി ഇല്ലാതാക്കിയെന്ന് പ്രസ്താവിച്ചില്ല.
  alternative: ഇത് എല്ലാ ക്രിസ്ത്യാനികൾക്കും നിർബന്ധമായ സമ്പൂർണ പൊതുവുടമസ്ഥത സ്ഥാപിക്കുന്നതായി വ്യാഖ്യാനിക്കുക.
  rationale: അപൂർണ ഭൂതകാലക്രിയകൾ തുടർച്ചയായതോ ആവർത്തിച്ചിരുന്നതോ ആയ പ്രവർത്തനം വിവരിക്കുന്നു. എന്നാൽ എല്ലാ സ്വകാര്യ ഉടമസ്ഥതയും അവസാനിച്ചെന്നോ ഈ മാതൃക സാർവത്രിക കല്പനയാണെന്നോ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിവർത്തനം വിവരണാത്മകമായി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിറ്റുകൊണ്ടിരുന്നു’ എന്ന രൂപം ആവർത്തിത പ്രവർത്തനവും ‘ആവശ്യമുണ്ടായിരുന്നതനുസരിച്ച്’ എന്നത് ആവശ്യാധിഷ്ഠിത വിതരണവും വ്യക്തമാക്കുന്നു. ‘ഭൂസ്വത്തുക്കളും മറ്റു സമ്പാദ്യങ്ങളും’ എന്ന കൂട്ടുപ്രയോഗം രണ്ടു ഗ്രീക്ക് നാമങ്ങളുടെ സാധ്യതയുള്ള വ്യത്യാസം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
