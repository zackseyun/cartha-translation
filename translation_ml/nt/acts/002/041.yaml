id: ACT.2.41
reference: Acts 2:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: ml
  text: അങ്ങനെ, അവന്റെ വചനം സ്വീകരിച്ചവർ സ്നാനമേറ്റു; അന്ന് ഏകദേശം മൂവായിരം പേർ[a] ചേർക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ആത്മാക്കൾ.’ മനുഷ്യരെ എണ്ണിപ്പറയാൻ ഗ്രീക്കിൽ പതിവായി ഉപയോഗിച്ചിരുന്ന ഒരു പ്രയോഗമാണിത്; അതിനാൽ ‘ആളുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξάμενοι
  choice: സ്വീകരിച്ചവർ
  rationale: സന്ദേശത്തോടുള്ള അനുകൂലമായ പ്രതികരണം സൂചിപ്പിക്കുമ്പോഴും ‘അംഗീകരിച്ചു’ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: λόγον
  choice: വചനം
  rationale: ഇവിടെ പത്രോസിന്റെ പ്രസംഗസന്ദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വചനം’ മൂലപദത്തോട് അടുത്തതും മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: ἐβαπτίσθησαν
  choice: സ്നാനമേറ്റു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ സംഭവാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; സ്നാനത്തിന്റെ രീതിയോ ഫലപ്രാപ്തിയോ സംബന്ധിച്ച പ്രത്യേക സഭാപരമായ നിലപാട് ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: προσετέθησαν
  choice: ചേർക്കപ്പെട്ടു
  rationale: ഒരു സമൂഹത്തിലേക്കുള്ള ഉൾപ്പെടുത്തൽ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. ആരോടോ ഏതിനോടോ ചേർക്കപ്പെട്ടു എന്നത് വാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ കർമം പൂരിപ്പിച്ചിട്ടില്ല.
- source_word: ψυχαὶ
  choice: പേർ
  rationale: മനുഷ്യരെ എണ്ണുമ്പോൾ ψυχή എന്ന പദം വ്യക്തികളെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്ന സാധാരണ പ്രയോഗമാണ്. മലയാളത്തിൽ ‘ആത്മാക്കൾ’ എന്നു പ്രധാനവാചകത്തിൽ കൊടുത്താൽ ശരീരത്തിൽനിന്നു വേറിട്ട ആത്മാവിനെക്കുറിച്ചുള്ള സാങ്കേതിക പ്രസ്താവനയായി തെറ്റിദ്ധരിക്കപ്പെടാം; മൂലരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὡσεὶ τρισχίλιαι
  choice: ഏകദേശം മൂവായിരം
  rationale: ὡσεί സൂചിപ്പിക്കുന്ന ഏകദേശസംഖ്യ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ μὲν οὖν
  choice: അങ്ങനെ, ...വർ
  rationale: മുൻപ്രസംഗത്തിൽനിന്നുള്ള ഫലവും ആഖ്യാനത്തിന്റെ തുടർച്ചയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: അന്ന്
  rationale: ‘ആ ദിവസത്തിൽ’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള കാലപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ചേർക്കപ്പെട്ടു’ എന്നതിന്റെ ലക്ഷ്യം സഭയോ വിശ്വാസിസമൂഹമോ എന്നു വ്യക്തമാക്കണമോ
  choice: ‘ചേർക്കപ്പെട്ടു’ എന്നു മാത്രം നൽകി ലക്ഷ്യം വ്യക്തമാക്കാതെ വെച്ചു
  alternative: ‘അവരോടു ചേർക്കപ്പെട്ടു’ / ‘സഭയോടു ചേർക്കപ്പെട്ടു’
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ആരോടോ ഏതിനോടോ ചേർത്തു എന്നു തുറന്നു പറയുന്നില്ല. സന്ദർഭം വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തേക്കാൾ വിശദമായ സഭാശാസ്ത്ര പ്രസ്താവന പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: ψυχαί എന്ന പദത്തിന്റെ മനുഷ്യസ്വഭാവശാസ്ത്രപരമായ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘പേർ’; അടിക്കുറിപ്പിൽ അക്ഷരാർഥമായ ‘ആത്മാക്കൾ’
  alternative: പ്രധാനവാചകത്തിൽ ‘ആത്മാക്കൾ’
  rationale: ഇവിടെ പദം മനുഷ്യരെ എണ്ണുന്ന സാധാരണ ശൈലിയിലാണ്. ‘പേർ’ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു; അതേസമയം മൂലപദത്തിന്റെ രൂപവും അതിൽനിന്നുണ്ടാകാവുന്ന അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിലൂടെ മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. ‘വചനം,’ ‘സ്നാനമേറ്റു’ എന്നീ പരിചിതമായ ക്രൈസ്തവ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും പ്രത്യേക സഭാവിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല. ‘അന്ന്’ എന്നും ‘പേർ’ എന്നും ഉപയോഗിച്ച് വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
