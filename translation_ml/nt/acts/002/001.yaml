id: ACT.2.1
reference: Acts 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: ml
  text: പെന്തെക്കൊസ്ത് ദിവസം വന്നെത്തിയപ്പോൾ[a], അവരെല്ലാവരും ഒരേ സ്ഥലത്ത് ഒരുമിച്ച് ഉണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘പെന്തെക്കൊസ്ത് ദിവസം പൂർത്തിയാകുന്ന സമയത്ത്’ അഥവാ ‘നിറവേറുന്ന സമയത്ത്.’
    reason: συμπληροῦσθαι എന്ന പദത്തിലെ പൂർത്തീകരണ/നിറവേറ്റൽ രൂപകവും മുഖ്യവാചകത്തിലെ സന്ദർഭാനുസൃതമായ ‘ദിവസം വന്നെത്തുക’ എന്ന അർഥവും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: വന്നെത്തിയപ്പോൾ
  rationale: ἐν τῷ + വർത്തമാനകാല കർമണി അനന്തക്രിയ temporal construction ആണ്. ഗ്രീക്ക് പ്രയോഗത്തിൽ ദിവസം നിറവേറുക/പൂർത്തിയാകുക എന്ന ആശയത്തിലൂടെ നിശ്ചിത ദിവസം വന്നെത്തുന്നതാണ് സൂചിപ്പിക്കുന്നത്. ‘വന്നെത്തിയപ്പോൾ’ ആ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിലെ ‘നിറവേറുക/പൂർത്തിയാകുക’ എന്ന രൂപകം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πεντηκοστῆς
  choice: പെന്തെക്കൊസ്ത്
  rationale: പെസഹയ്ക്കുശേഷം അമ്പതാം ദിവസവുമായി ബന്ധപ്പെട്ട യഹൂദോത്സവത്തിന് പുതിയനിയമത്തിൽ ഉപയോഗിക്കുന്ന സ്ഥാപിത ഗ്രീക്ക് പേരിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്. ‘ആഴ്ചകളുടെ ഉത്സവം’ പശ്ചാത്തലം വ്യക്തമാക്കുമെങ്കിലും ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന പദത്തിന്റെ നേരിട്ടുള്ള രൂപമല്ല.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: മുൻസന്ദർഭത്തിൽ പരാമർശിച്ച മുഴുവൻ കൂട്ടത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സർവനാമവിഷയം വ്യക്തമാക്കിക്കൊണ്ട് സമഗ്രതയും ഈ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁμοῦ
  choice: ഒന്നിച്ച്
  rationale: കൂട്ടായ സാന്നിധ്യമാണ് പദത്തിന്റെ അടിസ്ഥാന അർഥം. ‘ഒന്നിച്ച്’ അത് ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒരേ സ്ഥലത്ത്
  rationale: ഈ പ്രയോഗത്തിന് ‘ഒരേ സ്ഥലത്ത്’ എന്നും ‘ഒരുമിച്ച്’ എന്നും അർഥമാകാം. ὁμοῦ ഇതിനകം കൂട്ടായ്മ സൂചിപ്പിക്കുന്നതിനാൽ ഇവിടെ സ്ഥലസൂചന നിലനിർത്തുന്നത് അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ἦσαν എന്ന ക്രിയയിൽ അന്തർലീനമായിരിക്കുന്ന കർത്താവിന്റെ തിരിച്ചറിയൽ
  choice: അവരെല്ലാവരും
  alternative: എല്ലാവരും
  rationale: ഗ്രീക്കിൽ കർത്താവ് വീണ്ടും വ്യക്തമായി പറയുന്നില്ല; മുൻസന്ദർഭത്തിൽനിന്നാണ് അത് മനസ്സിലാകുന്നത്. മലയാളത്തിൽ ‘അവർ’ ചേർക്കുന്നത് ആഖ്യാനത്തുടർച്ച വ്യക്തമാക്കുന്നു; ഏതെങ്കിലും പ്രത്യേക കൂട്ടത്തെ വിവർത്തനത്തിലൂടെ പുതുതായി നിർണയിക്കുന്നില്ല.
- issue: συμπληροῦσθαι എന്ന പ്രയോഗത്തിന്റെ കാലപരവും രൂപകപരവുമായ നിഗൂഢത
  choice: വന്നെത്തിയപ്പോൾ; അക്ഷരസമീപമായ രൂപം അടിക്കുറിപ്പിൽ
  alternative: പൂർത്തിയായിക്കൊണ്ടിരിക്കുമ്പോൾ
  rationale: അക്ഷരസമീപമായ പരിഭാഷ മലയാളത്തിൽ ദിവസം അവസാനിക്കുകയായിരുന്നുവെന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം. പ്രധാനവാചകം ഉത്സവദിവസം എത്തിയെന്ന സന്ദർഭാർഥം നൽകുന്നു; ഗ്രീക്കിലെ process/fulfillment രൂപം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘വന്നെത്തിയപ്പോൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; ‘ഒരേ സ്ഥലത്ത് ഒന്നിച്ചായിരുന്നു’ എന്നത് ὁμοῦ, ἐπὶ τὸ αὐτό എന്നീ രണ്ടു ഘടകങ്ങളും അനാവശ്യമായി ‘കൂടിച്ചേർന്നു’ എന്ന പ്രവർത്തി ചേർക്കാതെ നിലനിർത്തുന്നു.
