  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: ml
  text: 'അങ്ങനെ സംഭവിക്കും: കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന ഏവനും രക്ഷിക്കപ്പെടും[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്നവൻ ആരായാലും.’ ഈ പ്രയോഗം യോവേൽ 2:32-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; അവിടെ ‘കർത്താവ്’ എന്നത് യഹോവയെ സൂചിപ്പിക്കുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ പത്രോസ് ഈ ഉദ്ധരണി യേശുവിനെക്കുറിച്ചുള്ള തന്റെ പ്രഖ്യാപനത്തിൽ പ്രയോഗിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: അപ്പോൾ … രക്ഷിക്കപ്പെടും
  rationale: ഇവിടെ ἔσται തുടർന്നുള്ള ഭാവികാല പ്രസ്താവനയെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘അപ്പോൾ’ എന്ന ഘടന പ്രവചനത്തിന്റെ ഭാവിസൂചന സ്വാഭാവികമായി നൽകുന്നതിനാൽ ‘സംഭവിക്കും’ എന്ന കൃത്രിമമായ ആവർത്തനം ഒഴിവാക്കി.
- source_word: πᾶς ὃς ἐὰν
  choice: ഏവനും
  rationale: അനിശ്ചിതമായ സാർവത്രിക വ്യവസ്ഥയെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπικαλέσηται
  choice: വിളിച്ചപേക്ഷിക്കുന്ന
  rationale: ‘നാമം വിളിക്കുക’ എന്ന ബൈബിൾ പ്രയോഗത്തിലെ ആശ്രയപൂർവമായ അഭ്യർഥനയുടെയും ആരാധനാപരമായ ആഹ്വാനത്തിന്റെയും ഭാവം ‘വിളിച്ചപേക്ഷിക്കുക’ വ്യക്തമാക്കുന്നു.
- source_word: τὸ ὄνομα
  choice: നാമം
  rationale: ഉടമ്പടിപരവും ആരാധനാപരവുമായ അർഥസാന്ദ്രതയുള്ള സ്ഥിരമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണ ബൈബിൾ പരിഭാഷ നിലനിർത്തുകയും അത് ആരെ സൂചിപ്പിക്കുന്നു എന്ന് മുഖ്യവാചകത്തിൽ പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം കൃത്യമായി നിലനിർത്തുന്നു; വിടുതലിന്റെയും സമഗ്രമായ രക്ഷയുടെയും അർഥസാധ്യതകൾ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോവേൽ ഉദ്ധരണിയിൽ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു എന്നത്
  choice: മുഖ്യവാചകത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി സൂചിതനെ നിർണയിക്കാതിരിക്കുക.
  alternative: യോവേലിന്റെ മൂലസന്ദർഭം പരിഗണിച്ച് യഹോവ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ അപ്പൊസ്തലപ്രവൃത്തികളിലെ ക്രിസ്തുകേന്ദ്രിത സന്ദർഭം പരിഗണിച്ച് യേശു എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്നാണ് പറയുന്നത്. യോവേൽ 2:32-ൽ അത് യഹോവയെ സൂചിപ്പിക്കുമ്പോഴും, അപ്പൊസ്തലപ്രവൃത്തികളിൽ പത്രോസ് ഈ ഉദ്ധരണി യേശുവിനെക്കുറിച്ചുള്ള തന്റെ പ്രഖ്യാപനത്തിനുള്ളിൽ ഉപയോഗിക്കുന്നു. ‘കർത്താവ്’ എന്ന രൂപം ഈ വാചകവും അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുഭാഷ. ‘വിളിച്ചപേക്ഷിക്കുക’, ‘നാമം’, ‘കർത്താവ്’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ അർഥസാന്ദ്രത നിലനിർത്താൻ ഉപയോഗിച്ചു; സൂചിതനെ മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കിയിട്ടില്ല.
