id: ACT.2.27
reference: Acts 2:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: ml
  text: എന്തെന്നാൽ, നീ എന്റെ പ്രാണനെ ഹാദേസിലേക്കു[a] ഉപേക്ഷിക്കുകയില്ല; നിന്റെ പരിശുദ്ധനെ[b] അഴുകൽ[c] കാണാൻ അനുവദിക്കുകയുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഷെയോളിലേക്കു.’ ഈ ഉദ്ധരണിയുടെ പിന്നിലുള്ള എബ്രായ പാഠത്തിൽ ‘ഷെയോൽ’ എന്നാണ്; ഇവിടെ ഗ്രീക്ക് പാഠത്തിൽ ‘ഹാദേസ്’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘നിന്റെ വിശ്വസ്തനെ.’
    reason: lexical_alternative
  - marker: c
    text: അതായത്, ശരീരം അഴുകുകയോ ജീർണിക്കുകയോ ചെയ്യുന്നത്; പരമ്പരാഗത പരിഭാഷകളിൽ ‘ദ്രവത്വം’ അല്ലെങ്കിൽ ‘ക്ഷയം’ എന്നും കാണാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: ഉപേക്ഷിക്കുകയില്ല
  rationale: ഒരാളെ ഒരു സ്ഥലത്തോ അവസ്ഥയിലോ കൈവിട്ടുകളയുക എന്ന ക്രിയയുടെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ψυχήν
  choice: പ്രാണനെ
  rationale: ψυχή എന്ന പദത്തിലെ ‘ജീവൻ,’ ‘സ്വയം,’ ‘പ്രാണൻ’ എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ചുരുക്കാതെ സങ്കീർത്തന ഉദ്ധരണിയുടെ ഭാവം നിലനിർത്തുന്നു; ആത്മാവിന്റെ ഇടക്കാലാവസ്ഥയെക്കുറിച്ചുള്ള സാങ്കേതിക പ്രസ്താവനയായി ഇതിനെ മാറ്റുന്നില്ല.
- source_word: εἰς ᾅδην
  choice: ഹാദേസിൽ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ᾅδης എന്ന പദം ‘നരകം’ എന്നാക്കി പിന്നീടുള്ള സിദ്ധാന്തപരമായ അർഥങ്ങൾ കയറ്റാതെ ലിപ്യന്തരണം ചെയ്യുന്നു. ‘ഉപേക്ഷിക്കുക’ എന്ന മലയാള ക്രിയയോടൊപ്പം സ്ഥാനസൂചകമായ ‘ഹാദേസിൽ’ സ്വാഭാവികമാണ്; എബ്രായ പശ്ചാത്തലത്തിലെ ‘ഷെയോൽ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δώσεις
  choice: അനുവദിക്കുകയുമില്ല
  rationale: ഇൻഫിനിറ്റീവിനോടു ചേർന്ന δώσεις ഇവിടെ അക്ഷരാർഥമായ ‘കൊടുക്കുക’ എന്നതിലുപരി ‘അനുവദിക്കുക’ എന്ന പ്രയോഗാർഥത്തിലാണ്.
- source_word: τὸν ὅσιόν σου
  choice: നിന്റെ പരിശുദ്ധനെ
  rationale: ὅσιος ദൈവത്തോടുള്ള ബന്ധത്തിൽ പരിശുദ്ധൻ, ഭക്തൻ, വിശ്വസ്തൻ എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. പ്രവൃത്തികൾ 2-ലെ ക്രിസ്തുസംബന്ധമായ പ്രയോഗം നിലനിർത്തുന്നതിനൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ ‘പരിശുദ്ധൻ’ ഉപയോഗിക്കുന്നു.
- source_word: ἰδεῖν διαφθοράν
  choice: അഴുകൽ കാണാൻ
  rationale: ഗ്രീക്കിലെ ‘കാണുക’ എന്ന രൂപം നിലനിർത്തുകയും διαφθορά എന്നത് ഇവിടെ സൂചിപ്പിക്കുന്ന ദേഹത്തിന്റെ അഴുകൽ ആധുനിക വായനക്കാർക്ക് നേരിട്ട് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനസന്ദർഭത്തിലെ ᾅδης എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഹാദേസ്
  alternative: മരിച്ചവരുടെ ലോകം; ഷെയോൽ; കല്ലറ
  rationale: ‘നരകം’ എന്നു പരിഭാഷപ്പെടുത്തി പാഠത്തിൽ ഇല്ലാത്ത പിന്നീടുള്ള സിദ്ധാന്തബന്ധങ്ങൾ ചേർക്കാതെ ഗ്രീക്ക് പദം നിലനിർത്തുന്നു. സങ്കീർത്തനത്തിലെ എബ്രായ പശ്ചാത്തലമായ ‘ഷെയോൽ’ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τὸν ὅσιόν σου എന്നതിന്റെ ക്രിസ്തുസംബന്ധമായ തിരിച്ചറിവ്
  choice: നിന്റെ പരിശുദ്ധനെ
  alternative: നിന്റെ വിശ്വസ്തനെ; നിന്റെ ഭക്തനെ
  rationale: ഈ സങ്കീർത്തനവാക്യം യേശുവിന്റെ പുനരുത്ഥാനത്തോട് പത്രോസ് ബന്ധിപ്പിക്കുന്ന സന്ദർഭത്തിൽ, പദത്തിന്റെ അർഥപരിധിയും ക്രിസ്തുസംബന്ധമായ ശക്തിയും ‘പരിശുദ്ധൻ’ നിലനിർത്തുന്നു; മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യഭാവവും രണ്ടു സമാന്തര നിഷേധവാക്യങ്ങളും നിലനിർത്തി. ‘പ്രാണൻ’ ψυχή എന്നതിലെ ജീവൻ/സ്വയം എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘ഹാദേസ്’ ഗ്രീക്ക് പദത്തെ സിദ്ധാന്തപരമായി ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
