id: ACT.2.47
reference: Acts 2:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αἰνοῦντες τὸν θεὸν καὶ ἔχοντες χάριν πρὸς ὅλον τὸν λαόν. ὁ δὲ κύριος προσετίθει τοὺς σῳζομένους καθ’ ἡμέραν ⸂ἐπὶ τὸ αὐτό⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: ml
  text: അവർ ദൈവത്തെ സ്തുതിച്ചും എല്ലാ ജനങ്ങളുടെയും പ്രീതി നേടിയുമിരുന്നു. രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നവരെ കർത്താവ് അനുദിനം അവരുടെ കൂട്ടത്തിലേക്ക് ചേർത്തുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “ഒരുമിച്ച്” അല്ലെങ്കിൽ “ഒരേ സ്ഥലത്ത്” (ഗ്രീക്ക്: ἐπὶ τὸ αὐτό).'
    reason: ἐπὶ τὸ αὐτό എന്ന പ്രയോഗം ഇവിടെ നിലവിലുള്ള സമൂഹത്തിലേക്കുള്ള ചേർക്കലിനെ സൂചിപ്പിക്കാമെങ്കിലും, “ഒരുമിച്ച്” അല്ലെങ്കിൽ “ഒരേ സ്ഥലത്ത്” എന്ന അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: αἰνοῦντες
  choice: സ്തുതിച്ചുകൊണ്ടും
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സമൂഹത്തിന്റെ തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘സ്തുതിച്ചുകൊണ്ടും’ ആ ദൈർഘ്യഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: ജനമെല്ലാവരുടെയും പ്രീതി നേടിയുകൊണ്ടും
  rationale: ഈ പ്രയോഗം ജനങ്ങളോടു പ്രീതി കാണിച്ചു എന്നതിലുപരി അവരുടെ പ്രീതിയും സദ്ഭാവവും അനുഭവിച്ചു എന്ന അർഥത്തിലാണ് സ്വാഭാവികം; ‘ജനമെല്ലാവരും’ വിശാലമായ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ δὲ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; δέ മലയാള വാക്യപ്രവാഹത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: προσετίθει
  choice: ചേർത്തുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലം ആവർത്തിച്ചും തുടർന്നും നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: τοὺς σῳζομένους
  choice: രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നവരെ
  rationale: വർത്തമാനകാല കർമണി കൃദന്തത്തിലെ പ്രക്രിയാഭാവവും ദൈവിക പ്രവർത്തനത്തിന്റെ കർമണിരൂപവും നിലനിർത്തുന്നു; പൂർത്തിയായ സ്ഥിരാവസ്ഥയായി ചുരുക്കുന്നില്ല.
- source_word: καθ’ ἡμέραν
  choice: അനുദിനം
  rationale: ഓരോ ദിവസവും ആവർത്തിച്ചുണ്ടായ പ്രവർത്തനത്തെ ഗൗരവമുള്ളതും ആധുനികവുമായ ചുരുക്കരൂപത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸ αὐτό
  choice: അവരുടെ കൂട്ടത്തോടു
  rationale: προσετίθει-യോടൊപ്പം നിലവിലുള്ള വിശ്വാസിസമൂഹത്തിലേക്കുള്ള ചേർക്കലാണ് സന്ദർഭത്തിൽ ഏറ്റവും സാധ്യതയുള്ളത്. എന്നാൽ മൂലപ്രയോഗത്തിന്റെ ‘ഒരുമിച്ച്/ഒരേ സ്ഥലത്ത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοὺς σῳζομένους എന്നതിലെ രക്ഷയുടെ കാലഭാവം
  choice: രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരുന്നവർ
  alternative: രക്ഷിക്കപ്പെട്ടവർ
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കർമണി കൃദന്തം രക്ഷയെ ഇവിടെ നടന്നുകൊണ്ടിരിക്കുന്ന ദൈവിക പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു. വിശാലമായ രക്ഷാശാസ്ത്രവിവാദങ്ങൾ തീർപ്പാക്കാതെ ഈ വ്യാകരണഭാവം നിലനിർത്തി.
- issue: ἐπὶ τὸ αὐτό എന്നതിന്റെ ബന്ധവും അർഥവും
  choice: അവരുടെ കൂട്ടത്തോടു
  alternative: ഒരുമിച്ച് / ഒരേ സ്ഥലത്ത്
  rationale: ‘ചേർക്കുക’ എന്ന ക്രിയയോടൊപ്പം സമൂഹത്തിലേക്കുള്ള ചേർക്കൽ സന്ദർഭത്തിൽ യോജിക്കുന്നു. എങ്കിലും ഈ ഗ്രീക്ക് പ്രയോഗത്തിനുള്ള യഥാർഥ അർഥവൈവിധ്യം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. തുടർന്നുനിന്ന പ്രവൃത്തികളെ ‘-കൊണ്ടും’, ‘-കൊണ്ടിരുന്നു’ എന്നീ രൂപങ്ങളാൽ സൂചിപ്പിച്ചു. ‘പ്രീതി നേടി’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
