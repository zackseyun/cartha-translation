    rationale: ‘അവരുടെ കൂട്ടത്തോടു ചേർത്തു’ can suggest joining people alongside the group. ‘അവരുടെ കൂട്ടത്തിലേക്ക് ചേർത്തു’ clearly conveys the contextual sense of adding people into the group, while the note preserves the alternative force of ἐπὶ τὸ αὐτό.
