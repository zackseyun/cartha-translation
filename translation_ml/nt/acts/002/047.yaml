    issue: Awkward idiom in the first sentence
    rationale: ‘ജനമെല്ലാവരുടെയും പ്രീതി നേടിയുകൊണ്ടും അവർ കഴിഞ്ഞു’ is grammatically understandable, but it is not the most idiomatic modern Malayalam rendering of the two continuing participial descriptions. ‘എല്ലാ ജനങ്ങളുടെയും പ്രീതി നേടിയുമിരുന്നു’ is smoother.
  - severity: low
