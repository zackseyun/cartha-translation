id: ACT.2.38
reference: Acts 2:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: ml
  text: 'പത്രോസ് അവരോടു പറഞ്ഞു: “മാനസാന്തരപ്പെടുക; നിങ്ങളുടെ പാപങ്ങളുടെ ക്ഷമയ്ക്കായി[b] നിങ്ങളിൽ ഓരോരുത്തരും മശീഹയായ യേശുവിന്റെ[a] നാമത്തിൽ സ്നാനം ഏൽക്കട്ടെ; നിങ്ങൾക്ക് പരിശുദ്ധാത്മാവിന്റെ ദാനം ലഭിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യേശുക്രിസ്തുവിന്റെ.” ഗ്രീക്ക് Χριστός എന്ന സ്ഥാനപ്പേര് “മശീഹ” എന്നോ “ക്രിസ്തു” എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ പത്രോസിന്റെ പ്രഖ്യാപനത്തിലെ സ്ഥാനപ്പേരിന്റെ അർഥം പ്രകടമാക്കാൻ “മശീഹ” ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “പാപങ്ങളുടെ ക്ഷമയ്ക്കായി” എന്നത് ഗ്രീക്ക് പ്രയോഗത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു. ഇവിടെ സ്നാനം പാപക്ഷമയുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്നതിനെക്കുറിച്ച് വ്യാഖ്യാതാക്കൾക്കിടയിൽ വ്യത്യസ്ത അഭിപ്രായങ്ങളുണ്ട്; മൂലവാക്യം പറയുന്നതിലുപരി ആ തർക്കത്തിന് ഈ പരിഭാഷ തീർപ്പുകൽപ്പിക്കുന്നില്ല.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Μετανοήσατε
  choice: മാനസാന്തരപ്പെടുക
  rationale: ബഹുവചനത്തിലുള്ള ആജ്ഞയുടെ നിർണായക സ്വഭാവവും മനസ്സിലും ജീവിതദിശയിലും വരുന്ന മാറ്റവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തരും ... സ്നാനം ഏൽക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന കർമണി ആജ്ഞയെയും ἕκαστος എന്ന വിതരണാർഥത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῷ ὀνόματι
  choice: നാമത്തിൽ
  rationale: സ്നാനസന്ദർഭത്തിലെ ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ തുല്യപദം; അടിസ്ഥാനം, അധികാരം, ഏറ്റുപറച്ചിൽ എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് വ്യക്തമാക്കുന്നില്ല.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശു
  rationale: ഈ പ്രഖ്യാപനസന്ദർഭത്തിൽ Χριστός പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: നിങ്ങളുടെ പാപങ്ങളുടെ ക്ഷമയ്ക്കായി
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യ/ഫല ദിശയും ἄφεσις എന്നതിന്റെ ക്ഷമ എന്ന അർഥവും നേരിട്ട് നൽകുന്നു; സ്നാനവും ക്ഷമയും തമ്മിലുള്ള ബന്ധത്തെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: നിങ്ങൾക്ക് പരിശുദ്ധാത്മാവിന്റെ ദാനം ലഭിക്കും
  rationale: ഭാവികാല വാഗ്ദാനവും δωρεά എന്ന ദാനാർഥവും τοῦ ἁγίου πνεύματος എന്ന ജനിറ്റീവ് ഘടനയും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്നാനവും പാപക്ഷമയും തമ്മിലുള്ള ബന്ധം
  choice: “പാപങ്ങളുടെ ക്ഷമയ്ക്കായി” എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: “പാപങ്ങൾ ക്ഷമിക്കപ്പെടേണ്ടതിന്” അല്ലെങ്കിൽ “പാപങ്ങൾ ക്ഷമിക്കപ്പെട്ടതിനാൽ”
  rationale: ഗ്രീക്ക് εἰς ἄφεσιν എന്ന പ്രയോഗത്തിന്റെ ദിശാസൂചകത നിലനിർത്തുന്നു; കൂദാശാപരമായ ഫലപ്രാപ്തി, ക്രമം, പ്രതീകാത്മകത തുടങ്ങിയ സഭാപാരമ്പര്യ തർക്കങ്ങളിൽ പരിഭാഷ സ്വയം തീർപ്പുകൽപ്പിക്കുന്നില്ല.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേര്
  choice: “മശീഹയായ” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: “ക്രിസ്തുവായ” അല്ലെങ്കിൽ “യേശുക്രിസ്തു”
  rationale: പ്രവൃത്തികൾ 2-ലെ പത്രോസിന്റെ പ്രഖ്യാപനത്തിൽ മശീഹാ സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായതിനാൽ അതിനെ പ്രധാന വാചകത്തിൽ പ്രകടമാക്കുന്നു.
- issue: പരിശുദ്ധാത്മാവിന്റെ ദാനം എന്ന ജനിറ്റീവ് പ്രയോഗം
  choice: “പരിശുദ്ധാത്മാവിന്റെ ദാനം” എന്ന ഘടന നിലനിർത്തി.
  alternative: “പരിശുദ്ധാത്മാവ് എന്ന ദാനം”
  rationale: ഗ്രീക്ക് ജനിറ്റീവിനെ കൂടുതൽ വിശദീകരിച്ച് ദാനം പരിശുദ്ധാത്മാവ് തന്നെയാണെന്ന വായന മാത്രം നിർബന്ധിക്കാതെ മൂലവാക്യത്തിന്റെ രൂപവും സാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. “മാനസാന്തരപ്പെടുക,” “സ്നാനം ഏൽക്കട്ടെ,” “പരിശുദ്ധാത്മാവ്” എന്നിവയുടെ പരിചിതമായ ബൈബിൾ രജിസ്റ്റർ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. [a] ബന്ധപ്പെട്ട പദത്തിനുശേഷവും [b] വാക്യാവസാനത്തും നൽകിയിരിക്കുന്നു.
