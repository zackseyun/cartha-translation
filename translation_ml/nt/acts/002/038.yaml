revisions:
- from: 'പത്രോസ് അവരോടു പറഞ്ഞു: “മാനസാന്തരപ്പെടുക; നിങ്ങളുടെ പാപങ്ങളുടെ ക്ഷമയ്ക്കായി നിങ്ങളിൽ ഓരോരുത്തരും മശീഹയായ യേശുവിന്റെ[a] നാമത്തിൽ സ്നാനം ഏൽക്കട്ടെ. അപ്പോൾ നിങ്ങൾക്ക് പരിശുദ്ധാത്മാവിന്റെ ദാനം ലഭിക്കും.[b]”'
  to: 'പത്രോസ് അവരോടു പറഞ്ഞു: “മാനസാന്തരപ്പെടുക; നിങ്ങളുടെ പാപങ്ങളുടെ ക്ഷമയ്ക്കായി[b] നിങ്ങളിൽ ഓരോരുത്തരും മശീഹയായ യേശുവിന്റെ[a] നാമത്തിൽ സ്നാനം ഏൽക്കട്ടെ; നിങ്ങൾക്ക് പരിശുദ്ധാത്മാവിന്റെ ദാനം ലഭിക്കും.”'
  rationale: The revision removes the added temporal connective “അപ്പോൾ” and uses semicolon coordination to reflect the Greek καί without specifying a sequence or theological mechanism. It also moves footnote [b] to the forgiveness phrase that it explains. No other change is needed.
