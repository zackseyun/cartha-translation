id: ACT.2.25
reference: Acts 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: ml
  text: 'ദാവീദ് അവനെക്കുറിച്ച് ഇങ്ങനെ പറയുന്നു: “ഞാൻ കർത്താവിനെ[b] എപ്പോഴും എന്റെ മുമ്പിൽ കണ്ടുകൊണ്ടിരുന്നു[a]; അവിടുന്ന് എന്റെ വലത്തുഭാഗത്തുള്ളതിനാൽ ഞാൻ കുലുങ്ങുകയില്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ കർത്താവിനെ എപ്പോഴും എന്റെ മുമ്പിൽ മുൻകൂട്ടി കണ്ടു.” ചില സന്ദർഭങ്ങളിൽ ഈ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മുൻകൂട്ടിക്കാണുക’ എന്ന അർഥമുണ്ടാകാം; എന്നാൽ ഇവിടെ ചുറ്റുമുള്ള പ്രയോഗങ്ങൾ കർത്താവിനെ നിരന്തരം തന്റെ മുമ്പിൽ വെക്കുക/കാണുക എന്ന അർഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: പത്രോസ് ഇവിടെ സങ്കീർത്തനം 16:8 ഉദ്ധരിക്കുന്നു. അതിന്റെ എബ്രായ പാഠത്തിൽ ഇവിടെ വരുന്ന ദൈവികനാമം പല വിവർത്തനങ്ങളിലും “യഹോവ” അഥവാ “കർത്താവ്” എന്നു നൽകപ്പെടുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: അവനെക്കുറിച്ച് ഇങ്ങനെ പറയുന്നു
  rationale: ഈ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന പ്രയോഗത്തിൽ εἰς αὐτόν നേരിട്ടുള്ള അഭിസംബോധനയല്ല, ഒരാളെ സംബന്ധിച്ച് പറയുന്നതാണ്; മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Προορώμην
  choice: കണ്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. διὰ παντός എന്നതോടൊപ്പം ചേർന്ന്, മുൻകൂട്ടിക്കാണൽ എന്നതിലുപരി കർത്താവിനെ നിരന്തരം മുമ്പിൽ കാണുന്ന/നിർത്തുന്ന ആശയം നൽകുന്നു.
- source_word: κύριον
  choice: കർത്താവിനെ
  rationale: ഗ്രീക്കിലെ κύριον എന്ന പദത്തിന്റെ സാധാരണ മലയാള തുല്യപദം നിലനിർത്തുന്നു; ഉദ്ധരണിയിലെ സൂചന ആരെന്നത് വിവർത്തനം തന്നെ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: ἐνώπιόν μου διὰ παντός
  choice: എപ്പോഴും എന്റെ മുമ്പിൽ
  rationale: സങ്കീർത്തനത്തിലെ സ്ഥലബന്ധിയായ ദൃശ്യരൂപവും നിരന്തരതയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐκ δεξιῶν μού
  choice: എന്റെ വലത്തുഭാഗത്ത്
  rationale: ഒരാളുടെ വലതുവശത്തെ സ്ഥാനത്തെയും അതിലൂടെ സൂചിപ്പിക്കപ്പെടുന്ന പിന്തുണയെയും സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἵνα μὴ σαλευθῶ
  choice: ഞാൻ കുലുങ്ങിപ്പോകുകയില്ല
  rationale: സ്ഥിരതയിൽനിന്ന് ഇളകിപ്പോകുക എന്ന രൂപകത്തെ നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഗ്രീക്ക് ഉദ്ദേശ്യ/ഫല നിർമാണത്തിന്റെ സ്വാഭാവിക മലയാള ഫലപ്രകടനമാണിത്.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിൽ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വിവർത്തനത്തിൽ ‘കർത്താവ്’ എന്നു തന്നെ നിലനിർത്തുക
  alternative: ‘യഹോവ’ അല്ലെങ്കിൽ ‘മശീഹ’ എന്നു വ്യക്തമായി നിർവചിക്കുക
  rationale: പത്രോസ് ഈ സങ്കീർത്തനം ക്രിസ്തുവിനെ സംബന്ധിച്ച് പ്രയോഗിക്കുന്നുവെങ്കിലും ഉദ്ധരിച്ച ഗ്രീക്ക് പാഠത്തിൽ κύριον എന്നാണ്. അതിനാൽ സൂചനയെ വിവർത്തനത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കണ്ടുകൊണ്ടിരുന്നു’ അപൂർണ ഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം പ്രകടമാക്കുന്നു; ‘വലത്തുഭാഗത്ത്’, ‘കുലുങ്ങിപ്പോകുകയില്ല’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സങ്കീർത്തനാത്മക ദൃശ്യരൂപം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
