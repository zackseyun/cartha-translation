  text: പാർഥ്യരും മേദ്യരും ഏലാമ്യരും, മെസൊപ്പൊട്ടേമിയയിലും യെഹൂദ്യയിലും[b] കപ്പദോക്യയിലും പൊന്തൊസിലും ആസ്യയിലും[a] താമസിക്കുന്നവരും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘ആസ്യ’ എന്നു പറയുന്നത് ആധുനിക ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ്.
