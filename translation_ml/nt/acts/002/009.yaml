translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പട്ടികാശൈലി സ്വീകരിച്ചു. ജനനാമങ്ങൾ ബഹുവചനത്തിൽ നൽകി; തുടർന്നുള്ള സ്ഥലനാമങ്ങളെല്ലാം ‘താമസിക്കുന്നവർ’ എന്ന കൃദന്തരൂപവുമായി ബന്ധിപ്പിച്ചു. വാക്യം അടുത്ത വാക്യഭാഗത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമമല്ല, കോമ നിലനിർത്തി.
