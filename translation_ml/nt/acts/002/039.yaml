id: ACT.2.39
reference: Acts 2:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: ml
  text: എന്തെന്നാൽ, വാഗ്ദാനം നിങ്ങൾക്കും നിങ്ങളുടെ മക്കൾക്കും ദൂരെയുള്ള എല്ലാവർക്കും[a]—നമ്മുടെ ദൈവമായ കർത്താവ് വിളിക്കുന്ന ഏവർക്കും[b]—ഉള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അകലെ കഴിയുന്ന എല്ലാവർക്കും.’ ഈ പ്രയോഗം ഭൂമിശാസ്ത്രപരമായി അകലെയുള്ളവരെയോ ഉടമ്പടിയിൽനിന്ന് അകലെയുള്ളവരെയോ, അല്ലെങ്കിൽ ഇരുകൂട്ടരെയുമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നമ്മുടെ ദൈവമായ കർത്താവ് ആരെയെല്ലാം വിളിക്കുമോ, അവർക്കെല്ലാം.’ ഗ്രീക്കിൽ അനിശ്ചിതമായെങ്കിലും സമഗ്രമായ പരിധിയാണ് പ്രകടമാകുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് ഈ വാക്യം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπαγγελία
  choice: വാഗ്ദാനം
  rationale: സമീപസന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിന്റെ ദാനം ഉദ്ദേശിക്കപ്പെടുന്നുവെങ്കിലും, ഗ്രീക്ക് പദം നേരിട്ട് പറയുന്നത് ‘വാഗ്ദാനം’ തന്നെയാണ്.
- source_word: τέκνοις
  choice: മക്കൾ
  rationale: കുടുംബബന്ധം സ്വാഭാവികമായി നിലനിർത്തുകയും പ്രായമോ തലമുറയോ അനാവശ്യമായി പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: ദൂരെയുള്ള എല്ലാവർക്കും
  rationale: ഭൂമിശാസ്ത്രപരമായ അകലമോ ഉടമ്പടിസംബന്ധമായ അകലമോ രണ്ടും സൂചിപ്പിക്കാവുന്ന വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ὅσους ἂν προσκαλέσηται
  choice: വിളിക്കുന്ന ഏവർക്കും
  rationale: അനിശ്ചിതമായെങ്കിലും സമഗ്രമായ പരിധി നൽകുന്ന ὅσους ἂν എന്ന പ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നു; മദ്ധ്യപ്രയോഗത്തിൽ നിന്നുള്ള ‘തന്നിലേക്കു’ എന്ന ആശയം പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: നമ്മുടെ ദൈവമായ കർത്താവ്
  rationale: ‘കർത്താവ്’ എന്ന വിഷയത്തെയും ‘നമ്മുടെ ദൈവം’ എന്ന സമാനാധികരണ തിരിച്ചറിയലിനെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൂരെയുള്ളവർ’ എന്നതിന്റെ പരിധി
  choice: ‘ദൂരെയുള്ള എല്ലാവരും’ എന്ന് വിശാലമായി നിലനിർത്തി.
  alternative: ചിതറിപ്പാർക്കുന്ന യെഹൂദർ മാത്രം; ജാതികൾ മാത്രം; ഭൂമിശാസ്ത്രപരമായും ഉടമ്പടിസംബന്ധമായും അകലെയുള്ളവർ.
  rationale: വാക്യം തന്നെ ഒരു വിഭാഗത്തിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനസാധ്യത തുറന്നുവെക്കുന്നു.
- issue: ദൈവത്തിന്റെ വിളിയുടെ സ്വഭാവം
  choice: ‘കർത്താവ് വിളിക്കുന്ന ഏവർ’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ഫലപ്രദമായ രക്ഷാവിളി; പൊതുവായ ക്ഷണം.
  rationale: വിളിയുടെ പ്രവർത്തനരീതി ഈ വാക്യം നിർവചിക്കുന്നില്ല; അതിനാൽ ഏതെങ്കിലും പ്രത്യേക രക്ഷാശാസ്ത്ര വ്യവസ്ഥ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: ὅσους ἂν എന്ന പരിധിനിർണ്ണായക ഘടകത്തിന്റെ ബന്ധം
  choice: വിരാമരേഖകൾ ഉപയോഗിച്ച് ‘വിളിക്കുന്ന ഏവർക്കും’ എന്ന ഘടകം വാഗ്ദാനത്തിന്റെ മുഴുവൻ പരിധിയെയും നിർണ്ണയിക്കുന്നതായി വായിക്കാവുന്ന വിധത്തിൽ നൽകി.
  alternative: ‘ദൂരെയുള്ള എല്ലാവർക്കും’ എന്ന അവസാന വിഭാഗത്തെ മാത്രം നേരിട്ട് വിശേഷിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ബന്ധത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ച് ചില വ്യാഖ്യാനസാധ്യതയുണ്ട്; മലയാളം അതിനെ അനാവശ്യമായി കർശനമാക്കാതെ സമഗ്രമായ qualifying force പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ഗദ്യശൈലി. ‘വാഗ്ദാനം,’ ‘കർത്താവ്’ എന്നീ പരിചിത ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തി; എന്നാൽ വിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കി. പ്രധാനവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
