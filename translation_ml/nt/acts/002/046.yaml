revisions:
- from: അവർ അനുദിനം ഒരേ മനസ്സോടെ ദേവാലയാങ്കണത്തിൽ[a] സ്ഥിരമായി കൂടിവന്നു; വീടുതോറും അപ്പം നുറുക്കി[b], ആനന്ദത്തോടും ഹൃദയലാളിത്യത്തോടും[d]കൂടെ ഭക്ഷണം[c] പങ്കിട്ടു.
  to: അവർ അനുദിനം ഒരേ മനസ്സോടെ ദേവാലയാങ്കണത്തിൽ[a] ഒത്തുകൂടിക്കൊണ്ടിരുന്നു; വീടുതോറും അപ്പം നുറുക്കി[b], ആനന്ദത്തോടും ഹൃദയലാളിത്യത്തോടും[d]കൂടെ ഭക്ഷണം[c] കഴിച്ചുപോന്നു.
