id: ACT.2.46
reference: Acts 2:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: ml
  text: അവർ അനുദിനം ഒരേ മനസ്സോടെ ദേവാലയാങ്കണത്തിൽ[a] ഒത്തുകൂടിക്കൊണ്ടിരുന്നു; വീടുതോറും അപ്പം നുറുക്കി[b], ആനന്ദത്തോടും ഹൃദയലാളിത്യത്തോടും[d]കൂടെ ഭക്ഷണം[c] കഴിച്ചുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദേവാലയത്തിൽ.’ ഗ്രീക്ക് പദം അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെ മുഴുവനായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘അപ്പം നുറുക്കുക’ സാധാരണയായി ഒരുമിച്ചുള്ള ഭക്ഷണത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ചിലർ ഇതിൽ കർത്താവിന്റെ അത്താഴവും ഉൾപ്പെടുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘ആഹാരം.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘ഹൃദയത്തിന്റെ ആത്മാർഥതയോടെ’ അല്ലെങ്കിൽ ‘ഉദാരഹൃദയത്തോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: അനുദിനം
  rationale: κατά + accusative എന്ന വിതരണപ്രയോഗത്തിന്റെ ആവർത്തനാർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: προσκαρτεροῦντες
  choice: സ്ഥിരമായി കൂടിവന്നു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയും സ്ഥിരതയും നിലനിർത്തുന്നു; തുടർന്നുവരുന്ന സ്ഥലസൂചനയോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായി ചേരുന്നു.
- source_word: ὁμοθυμαδόν
  choice: ഒരേ മനസ്സോടെ
  rationale: ഒരുമയും പൊതുവായ ലക്ഷ്യബോധവും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഭാവം, പഴഞ്ചൻ ശൈലി ഒഴിവാക്കി, വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τῷ ἱερῷ
  choice: ദേവാലയാങ്കണത്തിൽ
  rationale: ἱερόν അകത്തെ വിശുദ്ധമന്ദിരത്തെ മാത്രം അല്ല, വിശാലമായ ദേവാലയസമുച്ചയത്തെ സൂചിപ്പിക്കുന്നു; ‘ദേവാലയാങ്കണം’ ഈ വ്യത്യാസം വായനക്കാരന് വ്യക്തമാക്കുന്നു.
- source_word: κλῶντές ... ἄρτον
  choice: അപ്പം നുറുക്കി
  rationale: ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിലെ സ്ഥിരപ്രയോഗം നിലനിർത്തുന്നു; സാധാരണ കൂട്ടഭക്ഷണത്തെയും കർത്താവിന്റെ അത്താഴസ്മരണയെയും സംബന്ധിച്ച സാധ്യതകൾ മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: κατ’ οἶκον
  choice: വീടുതോറും
  rationale: κατάയുടെ വിതരണാർഥം വ്യക്തമായി നൽകുന്നു; ഒരു വീട്ടിൽ മാത്രം എന്നതിനു പകരം വിവിധ വീടുകളിലെ ആവർത്തിത പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: μετελάμβανον τροφῆς
  choice: ഭക്ഷണം പങ്കിട്ടു
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയയുടെ തുടർച്ചാഭാവവും സന്ദർഭത്തിലെ സമൂഹഭക്ഷണസ്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τροφῆς
  choice: ഭക്ഷണം
  rationale: ഗ്രീക്കിലെ പൊതുവായ ‘food’ എന്ന അർഥത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ കൂട്ടഭക്ഷണസന്ദർഭത്തിന് സ്വാഭാവികമാവുകയും ചെയ്യുന്നു.
- source_word: ἐν ἀγαλλιάσει
  choice: ആനന്ദത്തോടെ
  rationale: അതിയായ സന്തോഷത്തിന്റെ ഭാവം അമിതഭാഷയില്ലാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: ἀφελότητι καρδίας
  choice: ഹൃദയലാളിത്യത്തോടെ
  rationale: കാപട്യമില്ലായ്മ, ഏകാഗ്രത, തുറന്ന മനസ്സ്, ലാളിത്യം എന്നിവ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തി പരമാവധി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അപ്പം നുറുക്കുക’ എന്നത് കർത്താവിന്റെ അത്താഴത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാനപാഠത്തിൽ വിശാലാർഥമുള്ള ‘അപ്പം നുറുക്കി’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ഇത് സാധാരണ കൂട്ടഭക്ഷണം മാത്രമായോ കർത്താവിന്റെ അത്താഴത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശമായോ വിവർത്തനം ചെയ്യുക.
  rationale: സമീപസന്ദർഭത്തിലെ τροφῆς സാധാരണ ഭക്ഷണത്തെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ലൂക്കോസ്–അപ്പൊസ്തലപ്രവൃത്തികളിലെ ഈ പ്രയോഗത്തിന് കർത്താവിന്റെ അത്താഴത്തിന്റെ അനുരണനവും ഉണ്ടാകാം. അതിനാൽ പ്രധാനപാഠം ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘ദേവാലയാങ്കണം,’ ‘വീടുതോറും,’ ‘അപ്പം നുറുക്കുക’ എന്നിവ സാംസ്കാരികവും പാഠപരവുമായ സൂക്ഷ്മതകൾ നിലനിർത്തുന്നു. വാക്യത്തിന്റെ പ്രവർത്തനക്രമം ഗ്രീക്ക് മൂലപാഠത്തോട് അടുത്തുവെച്ചുകൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി അർധവിരാമവും കോമകളും ഉപയോഗിച്ചു.
