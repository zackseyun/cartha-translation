  text: ἀλλὰ τοῦτό ἐστιν τὸ εἰρημένον διὰ τοῦ προφήτου Ἰωήλ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/016.yaml
  text: But this is what was spoken through the prophet Joel:[a]
translation:
  language: ml
  text: എന്നാൽ, യോവേൽ പ്രവാചകനിലൂടെ പറയപ്പെട്ടത് ഇതാണ്:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യോവേൽ പ്രവാചകനാൽ.” ഗ്രീക്കിൽ കർത്തൃസൂചന ഉണ്ടായേക്കാമെങ്കിലും, സന്ദേശത്തിന്റെ പ്രവാചകമധ്യസ്ഥനെന്ന യോവേലിന്റെ പങ്ക് “പ്രവാചകനിലൂടെ” കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽ ജനക്കൂട്ടത്തിനുണ്ടായ തെറ്റിദ്ധാരണ തിരുത്തുന്ന വൈരുധ്യസൂചക സംയോജകമായി സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: τοῦτό ἐστιν
  choice: ഇതാണ്
  rationale: പ്രകടമായിക്കൊണ്ടിരിക്കുന്ന സംഭവത്തെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമവും സാധാരണ സംയോജകക്രിയയും മലയാളത്തിൽ സ്വാഭാവികമായി ഒരുമിപ്പിക്കുന്നു; ‘അർഥമാക്കുന്നത്’ എന്ന വ്യാഖ്യാനാത്മക ആശയം ചേർക്കുന്നില്ല.
- source_word: τὸ εἰρημένον
  choice: അരുളിച്ചെയ്യപ്പെട്ടത്
  rationale: സാരവത്തായി ഉപയോഗിച്ചിരിക്കുന്ന കർമണിപൂർണകൃദന്തത്തിന്റെ അർഥം നിലനിർത്തുന്നു. പ്രവാചകവചനത്തിന്റെ ഗൗരവമുള്ള സന്ദർഭത്തിൽ ‘പറയപ്പെട്ടത്’ എന്നതിനെക്കാൾ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ മലയാളപ്രയോഗം.
- source_word: διὰ τοῦ προφήτου
  choice: പ്രവാചകനിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെയോ ഉപകരണഭാവത്തെയോ ‘മുഖാന്തരം’ എന്ന പഴയ പ്രയോഗത്തേക്കാൾ ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἰωήλ
  choice: യോവേൽ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം.
theological_decisions:
- issue: διὰ τοῦ προφήτου Ἰωήλ എന്നതിലെ പ്രവാചകമധ്യസ്ഥത
  choice: യോവേൽ പ്രവാചകനിലൂടെ
  alternative: യോവേൽ പ്രവാചകനാൽ
  rationale: ‘-ലൂടെ’ എന്ന രൂപം യോവേൽ സന്ദേശത്തിന്റെ മധ്യസ്ഥനായിരുന്നുവെന്ന ഗ്രീക്ക് പ്രയോഗത്തിലെ സൂക്ഷ്മത നിലനിർത്തുന്നു; അദ്ദേഹത്തെ സന്ദേശത്തിന്റെ അന്തിമ ഉറവിടമായി നിർണയിക്കുകയോ പ്രത്യേക പ്രചോദനസിദ്ധാന്തം വാക്യത്തിലേക്ക് ചേർക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘മുഖാന്തരം’ ഒഴിവാക്കി ‘-ലൂടെ’ ഉപയോഗിച്ചു. ‘അരുളിച്ചെയ്യപ്പെട്ടത്’ പ്രവാചകവചനത്തിന്റെ സന്ദർഭത്തിന് അനുയോജ്യമായ ഗൗരവം നൽകുമ്പോഴും വാക്യം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി നിലനിർത്തുന്നു.
