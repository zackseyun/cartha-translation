id: ACT.2.17
reference: Acts 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: ml
  text: “അന്ത്യനാളുകളിൽ, ദൈവം അരുളിച്ചെയ്യുന്നു, ഞാൻ എന്റെ ആത്മാവിൽനിന്ന് സകല ജഡത്തിന്മേലും പകരും[a]. നിങ്ങളുടെ പുത്രന്മാരും പുത്രിമാരും പ്രവചിക്കും; നിങ്ങളുടെ യുവാക്കൾ ദർശനങ്ങൾ കാണും; നിങ്ങളുടെ വൃദ്ധന്മാർ സ്വപ്നങ്ങൾ കാണും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകല മനുഷ്യരുടെയുംമേൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “സകല ജഡത്തിന്മേലും” എന്നാണ്; ഇത് മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രവാചകപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: അന്ത്യനാളുകളിൽ
  rationale: സ്ഥാപിതവും സ്വാഭാവികവുമായ യുഗാന്ത്യകാലപ്രയോഗം; കാലപരിധിയെ ഉറവിടം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: λέγει ὁ θεός
  choice: എന്നു ദൈവം അരുളിച്ചെയ്യുന്നു
  rationale: ഉദ്ധരണിസൂത്രത്തിലെ വർത്തമാനകാലവും പ്രവാചകവചനത്തിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκχεῶ
  choice: ഞാൻ ... പകരും
  rationale: ദ്രാവകം ഒഴിക്കുന്നതിന്റെ രൂപകം നിലനിർത്തുന്ന, ആത്മാവിന്റെ ദാനത്തെക്കുറിച്ച് മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: എന്റെ ആത്മാവിൽനിന്ന്
  rationale: ἀπό എന്ന ഉറവിടസൂചക ഉപസർഗം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആത്മാവ്’ ഉപയോഗിച്ചു.
- source_word: ἐπὶ πᾶσαν σάρκα
  choice: സകല ജഡത്തിന്മേലും
  rationale: യോവേൽ പ്രവചനത്തിലെ രൂപകവും അന്തർപാഠബന്ധവും കാത്തുസൂക്ഷിക്കുന്നു; അർഥവ്യക്തതയ്ക്കായി ‘സകല മനുഷ്യരുടെയുംമേൽ’ എന്ന വ്യാഖ്യാനപരമായ പകരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: προφητεύσουσιν
  choice: പ്രവചിക്കും
  rationale: പ്രവാചകമായി സംസാരിക്കുക എന്ന അർഥം നേരിട്ടും നിലവാരമുള്ള രീതിയിലും നൽകുന്നു.
- source_word: οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν
  choice: നിങ്ങളുടെ പുത്രന്മാരും പുത്രിമാരും
  rationale: രണ്ടു ലിംഗവിഭാഗങ്ങളെയും വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക ഏകീകരിച്ച ഉടമസ്ഥഘടന ഉപയോഗിക്കുന്നു.
- source_word: οἱ νεανίσκοι ὑμῶν
  choice: നിങ്ങളുടെ യുവാക്കൾ
  rationale: പുരുഷലിംഗ ബഹുവചനവും പ്രായാധിഷ്ഠിതമായ വിരുദ്ധസമാന്തരതയും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὁράσεις ὄψονται
  choice: ദർശനങ്ങൾ കാണും
  rationale: ഗ്രീക്കിലെ സമാനധാതുഘടനയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: οἱ πρεσβύτεροι ὑμῶν
  choice: നിങ്ങളുടെ വൃദ്ധന്മാർ
  rationale: ഇവിടെ ഔദ്യോഗിക ‘മൂപ്പൻ’ പദവിയല്ല, യുവാക്കളോടു വിപരീതമായ പ്രായവിഭാഗമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐνυπνίοις ἐνυπνιασθήσονται
  choice: സ്വപ്നങ്ങൾ കാണും
  rationale: സമാനപദ ആവർത്തനമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം; ദർശനങ്ങൾ കാണും എന്ന സമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സകല ജഡം’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തിയും പ്രവാചകശൈലിയും
  choice: പ്രധാനപാഠത്തിൽ ‘സകല ജഡത്തിന്മേലും’ നിലനിർത്തി, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: സകല മനുഷ്യരുടെയുംമേൽ
  rationale: ഉറവിടത്തിലെ σάρξ എന്ന ദൃശ്യരൂപവും യോവേൽ പ്രവചനവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നതിനൊപ്പം അതിന്റെ വിപുലമായ മാനവവ്യാപ്തി മറയ്ക്കുന്നില്ല.
- issue: ദൈവത്തിന്റെ πνεῦμα എന്ന പരാമർശം
  choice: ‘എന്റെ ആത്മാവ്’
  alternative: എന്റെ ജീവശ്വാസം / എന്റെ ആത്മചൈതന്യം
  rationale: സംസാരിക്കുന്ന ദൈവത്തിന്റേതായ ആത്മാവാണ് സന്ദർഭത്തിലെ സൂചന; വ്യക്തിത്വരഹിതമായ മനോഭാവമെന്നോ മനുഷ്യജീവശ്വാസമെന്നോ ചുരുക്കുന്നില്ല.
- issue: ἀπὸ τοῦ πνεύματός μου എന്ന ഭാഗികത സൂചിപ്പിക്കാവുന്ന രൂപം
  choice: ‘എന്റെ ആത്മാവിൽനിന്ന്’ എന്ന ഉറവിടസമീപ രൂപം നിലനിർത്തുക.
  alternative: എന്റെ ആത്മാവിനെ
  rationale: ഗ്രീക്കിലെ ἀπό സംരക്ഷിക്കുന്നു; അതേസമയം ദൈവാത്മാവ് വിഭജിക്കപ്പെടുന്നു എന്ന സിദ്ധാന്തനിഗമനം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള, പൊതുവായ വായനാശൈലി. പ്രവാചക ഉദ്ധരണിയുടെ കാവ്യസമാന്തരത നിലനിർത്തി. ‘അരുളിച്ചെയ്യുന്നു’ എന്നത് ദൈവവചനസൂത്രത്തിന് യോജിച്ച മാന്യപ്രയോഗമാണ്; മറ്റു ഭാഗങ്ങൾ അനാവശ്യ പുരാതനഭാഷ ഒഴിവാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം [a] പ്രധാനപാഠത്തിൽ ബന്ധപ്പെട്ട വാക്യഘടകത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
