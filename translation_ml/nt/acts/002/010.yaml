lexical_decisions:
- source_word: Φρυγίαν τε καὶ Παμφυλίαν
  choice: ഫ്രുഗ്യയും പംഫുല്യയും
  rationale: പ്രദേശനാമങ്ങൾ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ രൂപങ്ങളിൽ ലിപ്യന്തരണം ചെയ്തു; τε καὶ പട്ടികയിലെ ഘടകങ്ങളെ സ്വാഭാവികമായി ‘യും ... യും’ എന്നു ബന്ധിപ്പിക്കുന്നു.
- source_word: Αἴγυπτον
  choice: ഈജിപ്ത്
  rationale: രാജ്യത്തിന്റെ ആധുനിക മലയാളത്തിലെ സുപരിചിതമായ പേര് ഉപയോഗിച്ചു.
- source_word: τὰ μέρη τῆς Λιβύης τῆς κατὰ Κυρήνην
  choice: കുറേനെയോടു ചേർന്നുള്ള ലിബ്യയുടെ പ്രദേശങ്ങൾ
  rationale: μέρη എന്നതിനെ സ്വാഭാവികമായ ‘പ്രദേശങ്ങൾ’ എന്നും κατά Κυρήνην എന്ന സ്ഥലബന്ധത്തെ അതിരുകവിഞ്ഞ രാഷ്ട്രീയ കൃത്യത നൽകാതെ ‘കുറേനെയോടു ചേർന്നുള്ള’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: οἱ ἐπιδημοῦντες Ῥωμαῖοι
  choice: റോമിൽനിന്ന് ഇവിടെ താൽക്കാലികമായി താമസിക്കുന്നവർ
  rationale: ἐπιδημοῦντες സ്ഥിരതാമസക്കാരെക്കാൾ സന്ദർശകരെയോ താൽക്കാലികമായി കഴിയുന്നവരെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘സന്ദർശകരായ റോമാക്കാർ’ എന്നതിലുണ്ടാകാവുന്ന വംശീയ അസ്പഷ്ടത ഒഴിവാക്കി, റോമിൽനിന്നെത്തി ഇവിടെ കഴിയുന്നവർ എന്ന അർത്ഥം വ്യക്തമാക്കി.
