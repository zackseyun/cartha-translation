id: ACT.2.30
reference: Acts 2:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: ml
  text: അതുകൊണ്ട്, അവൻ ഒരു പ്രവാചകനായിരുന്നതിനാലും, അവന്റെ സന്തതികളിൽനിന്ന് ഒരാളെ[a] അവന്റെ സിംഹാസനത്തിൽ ഇരുത്തുമെന്ന് ദൈവം അവനോടു ശപഥം ചെയ്തതായി അറിഞ്ഞിരുന്നതിനാലും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “അവന്റെ അരക്കെട്ടിന്റെ ഫലത്തിൽനിന്ന് ഒരാളെ.” ഇത് അവന്റെ ശരീരവംശത്തിൽപ്പെട്ട ഒരു സന്തതിയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: മുഖ്യപാഠത്തിലെ സ്വാഭാവികമായ ‘സന്തതി’ എന്ന പ്രയോഗത്തിനു പിന്നിലെ ഗ്രീക്ക് ദൃശ്യഭാഷയും ശാരീരിക വംശപരമ്പരയുടെ ഊന്നലും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: προφήτης
  choice: പ്രവാചകൻ
  rationale: ദൈവിക വെളിപ്പാടനുസരിച്ച് സംസാരിക്കുന്നവനെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ദാവീദിനെക്കുറിച്ചുള്ള വാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὑπάρχων
  choice: ആയിരുന്നതിനാൽ
  rationale: സാഹചര്യത്തോടൊപ്പം കാരണഭാവവും നൽകുന്ന കൃദന്തരൂപം; മലയാളത്തിൽ സ്വാഭാവികമായി ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: εἰδὼς
  choice: അറിഞ്ഞിരുന്നതിനാലും
  rationale: ὑπάρχων എന്നതിനോട് സമാന്തരമായ കൃദന്തരൂപം നിലനിർത്തുകയും അറിവ് പശ്ചാത്തലകാരണമായിരുന്നുവെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅρκῳ ὤμοσεν
  choice: ശപഥംചെയ്ത് ഉറപ്പുനൽകിയതായി
  rationale: നാമവും ക്രിയയും ചേർന്ന ഗ്രീക്ക് പ്രയോഗത്തിലെ ഗൗരവവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: തന്റെ സന്തതികളിൽ ഒരാളെ
  rationale: ശാരീരിക വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥ ദൃശ്യഭാഷ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: καθίσαι
  choice: ഇരുത്തുമെന്ന്
  rationale: ദൈവം ആ സന്തതിയെ സിംഹാസനത്തിൽ സ്ഥാപിക്കുമെന്ന കാരകഭാവം നിലനിർത്തുന്നു; വെറും ‘ഇരിക്കും’ എന്നതിനെക്കാൾ കൃത്യം.
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: തന്റെ സിംഹാസനത്തിൽ
  rationale: രാജസ്ഥാനാരോഹണ ഭാഷ സ്വാഭാവികമായി നൽകുന്നു; അവസാന αὐτοῦ ദാവീദിനെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം പിന്തുണയ്ക്കുന്നു.
theological_decisions:
- issue: ദാവീദിനോടുള്ള രാജവംശീയ വാഗ്ദാനം
  choice: ദാവീദിന്റെ സന്തതിയെയും അവന്റെ സിംഹാസനത്തെയും കുറിച്ചുള്ള ഭാഷ അതേപടി നിലനിർത്തി; ‘മശീഹ’ എന്ന് വാക്യത്തിൽ ചേർത്തില്ല.
  alternative: ‘മശീഹയെ തന്റെ സിംഹാസനത്തിൽ ഇരുത്തും’ എന്ന് വ്യാഖ്യാനപരമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ചുറ്റുപാടിലുള്ള പ്രസംഗം ഈ വാഗ്ദാനം യേശുവിൽ പ്രയോഗിക്കുന്നുവെങ്കിലും, ഈ വാക്യം തന്നിൽ ദാവീദിന്റെ സന്തതിയെയും സിംഹാസനത്തെയും കുറിച്ചാണ് പറയുന്നത്. അതിനാൽ ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗം സന്ദർഭം വ്യക്തമാക്കാൻ വിട്ടിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിന് പകരം അർധവിരാമസ്വഭാവമുള്ള കോമ നിലനിർത്തി; കൃദന്തരൂപങ്ങളുടെ കാരണബന്ധം മലയാളത്തിലെ ‘-തിനാലും’ ഘടനയിലൂടെ പ്രകടമാക്കി.
