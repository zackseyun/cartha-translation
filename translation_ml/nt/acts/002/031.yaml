id: ACT.2.31
reference: Acts 2:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: ml
  text: 'ഇത് മുൻകൂട്ടി കണ്ട അദ്ദേഹം മശീഹയുടെ[b] പുനരുത്ഥാനത്തെക്കുറിച്ച് സംസാരിച്ചു: അവൻ പാതാളത്തിലേക്ക്[a][c] ഉപേക്ഷിക്കപ്പെട്ടതുമില്ല, അവന്റെ ജഡം അഴുകൽ[d] കണ്ടതുമില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാതാളത്തിൽ ഉപേക്ഷിക്കപ്പെട്ടില്ല.’ ഗ്രീക്ക് പദബന്ധം ഇവിടെ ‘പാതാളത്തിലേക്ക്’ എന്നും ‘പാതാളത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; മരിച്ചവരുടെ ലോകത്തിൽ അവൻ ഉപേക്ഷിക്കപ്പെട്ടില്ല എന്നതാണ് ആശയം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ക്രിസ്റ്റോസ്. ഇവിടെ തിരുവെഴുത്തിൽ വാഗ്ദത്തം ചെയ്യപ്പെട്ട അഭിഷിക്തന്റെ സ്ഥാനപ്പേര് മുൻനിൽക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി. പരമ്പരാഗതമായി, ‘ക്രിസ്തു.’'
    reason: alternative_reading
  - marker: c
    text: ‘പാതാളം’ ഇവിടെ മരിച്ചവരുടെ ലോകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അന്തിമ ന്യായവിധിയിലെ ശിക്ഷാസ്ഥലത്തെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘നാശം’ അല്ലെങ്കിൽ ‘ക്ഷയം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: ഇത് മുൻകൂട്ടി കണ്ടുകൊണ്ട്
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരുന്നത് നേരത്തേ ഗ്രഹിച്ചതിനുശേഷമാണ് ദാവീദ് സംസാരിച്ചതെന്ന കാലബന്ധം ക്രിയാവിശേഷണരൂപം നിലനിർത്തുന്നു. സ്വാഭാവികമായ മലയാളത്തിനായി സന്ദർഭത്തിൽനിന്ന് ‘ഇത്’ ചേർത്തിരിക്കുന്നു.
- source_word: ἐλάλησεν
  choice: അദ്ദേഹം ... സംസാരിച്ചു
  rationale: λαλέω എന്നതിന്റെ പൊതുവായ ‘സംസാരിക്കുക’ എന്ന അർഥവും തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: περὶ τῆς ἀναστάσεως
  choice: പുനരുത്ഥാനത്തെക്കുറിച്ച്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന ‘കുറിച്ച്/സംബന്ധിച്ച്’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമംപോലെ അല്ല, തിരുവെഴുത്തിൽ മുൻകൂട്ടി അറിയിക്കപ്പെട്ട അഭിഷിക്തന്റെ സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: οὔτε ἐγκατελείφθη
  choice: ഉപേക്ഷിക്കപ്പെട്ടില്ല
  rationale: ἐγκαταλείπω എന്ന ക്രിയയുടെ ‘കൈവിടുക, ഉപേക്ഷിക്കുക’ എന്ന ശക്തി കർമണിപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς ᾅδην
  choice: പാതാളത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാസൂചകത ‘-ലേക്ക്’ വഴി സംരക്ഷിക്കുന്നു. ᾅδης അന്തിമ ന്യായവിധിസ്ഥലത്തെക്കാൾ മരിച്ചവരുടെ ലോകത്തെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἡ σὰρξ αὐτοῦ
  choice: അവന്റെ ജഡം
  rationale: σάρξ ഇവിടെ പാപസ്വഭാവമല്ല, ശാരീരിക യാഥാർഥ്യമാണ്; ‘ജഡം’ സങ്കീർത്തന ഉദ്ധരണിയിലെ പദബന്ധവും ശരീരപരമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: εἶδεν διαφθοράν
  choice: ജീർണത കാണുകയും ചെയ്തില്ല
  rationale: ‘ജീർണത കാണുക’ എന്ന ഗ്രീക്ക് ശൈലി കഴിയുന്നത്ര നിലനിർത്തിക്കൊണ്ട് ശരീരം അഴുകുന്നതെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: പത്രോസിന്റെ തിരുവെഴുത്താധിഷ്ഠിത വാദത്തിൽ വാഗ്ദത്ത അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥമാണ് മുൻനിൽക്കുന്നത്.
- issue: ᾅδης എന്നതിന്റെ പരിഭാഷ
  choice: പാതാളം
  alternative: മരിച്ചവരുടെ ലോകം
  rationale: അന്തിമ ശിക്ഷാസ്ഥലം എന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ മരിച്ചവരുടെ ലോകം എന്ന അർഥം സൂചിപ്പിക്കുന്ന പരിചിതമായ മലയാളപദം തെരഞ്ഞെടുത്തു; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
- issue: σάρξ എന്നതിന്റെ പരിഭാഷ
  choice: ജഡം
  alternative: ശരീരം
  rationale: സന്ദർഭം രൂപകാത്മകമോ ധാർമികമോ അല്ല, ശാരീരികമാണ്. ‘ജഡം’ മൂലപദത്തോടുള്ള അടുപ്പവും പുനരുത്ഥാനത്തിന്റെ ശരീരപരമായ യാഥാർഥ്യവും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: εἰς ᾅδην എന്നതിലെ സ്ഥാനബന്ധം
  choice: പാതാളത്തിലേക്ക്
  alternative: പാതാളത്തിൽ
  rationale: εἰς എന്നതിന്റെ സാധാരണ ദിശാസൂചക അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഈ ഉദ്ധരണിയിൽ ‘പാതാളത്തിൽ ഉപേക്ഷിക്കപ്പെട്ടില്ല’ എന്നും അർഥമാക്കാൻ കഴിയുന്നതിനാൽ പകരം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘മശീഹ,’ ‘പാതാളം,’ ‘ജഡം,’ ‘പുനരുത്ഥാനം’ എന്നീ തിരുവെഴുത്തുപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; ആശയക്കുഴപ്പം ഉണ്ടാകാവുന്നിടങ്ങളിൽ അടിക്കുറിപ്പുകൾ ചേർത്തു. ഗ്രീക്കിലെ οὔτε ... οὔτε എന്ന ഇരട്ട നിഷേധത്തിന്റെ സംയുക്തബലം മലയാളത്തിലെ ‘... ഇല്ല; ... ചെയ്തില്ല’ എന്ന സമാന്തര ഘടനയിലൂടെ നൽകി.
