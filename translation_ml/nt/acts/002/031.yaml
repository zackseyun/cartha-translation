revisions:
- from: 'ഇത് മുൻകൂട്ടി കണ്ടുകൊണ്ട്, അദ്ദേഹം മശീഹയുടെ[b] പുനരുത്ഥാനത്തെക്കുറിച്ച് സംസാരിച്ചു: അവൻ പാതാളത്തിലേക്ക്[a][c] ഉപേക്ഷിക്കപ്പെട്ടില്ല; അവന്റെ ജഡം ജീർണത[d] കാണുകയും ചെയ്തില്ല.'
  to: 'ഇത് മുൻകൂട്ടി കണ്ട അദ്ദേഹം മശീഹയുടെ[b] പുനരുത്ഥാനത്തെക്കുറിച്ച് സംസാരിച്ചു: അവൻ പാതാളത്തിലേക്ക്[a][c] ഉപേക്ഷിക്കപ്പെട്ടതുമില്ല, അവന്റെ ജഡം അഴുകൽ[d] കണ്ടതുമില്ല.'
  rationale: The revision retains the draft’s faithful lexical choices but uses explicit Malayalam parallel negatives for οὔτε … οὔτε. It replaces the awkward ‘ജീർണത കാണുകയും ചെയ്തില്ല’ with the natural, bodily-contextual ‘അഴുകൽ കണ്ടതുമില്ല,’ and corrects the lexical-alternative note by removing ‘ദ്രവീകരണം.’
