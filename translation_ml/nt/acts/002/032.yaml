id: ACT.2.32
reference: Acts 2:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον τὸν Ἰησοῦν ἀνέστησεν ὁ θεός, οὗ πάντες ἡμεῖς ἐσμεν μάρτυρες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: ml
  text: ഈ യേശുവിനെ ദൈവം ഉയിർപ്പിച്ചു[a]; അവനെക്കുറിച്ച് ഞങ്ങൾ എല്ലാവരും സാക്ഷികളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ യേശുവിനെ ദൈവം ഉയർത്തി.” ഇവിടെ ഗ്രീക്ക് ക്രിയ പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: ἀνέστησεν എന്ന ക്രിയയുടെ അക്ഷരസമീപമായ മറ്റൊരു പരിഭാഷയും ഈ സന്ദർഭത്തിലെ പുനരുത്ഥാനാർഥവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ഈ യേശുവിനെ
  rationale: τοῦτον എന്ന സൂചകസർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും തൊട്ടുമുമ്പ് പരാമർശിച്ച യേശുവിലേക്കു വ്യക്തമായി ചൂണ്ടിക്കാണിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνέστησεν
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ യേശുവിന്റെ പുനരുത്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികവും സംശയരഹിതവുമായി അറിയിക്കാൻ ‘മരിച്ചവരിൽനിന്ന്’ വ്യക്തമാക്കി ചേർത്തിരിക്കുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ കർത്താവിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὗ
  choice: അതിന്
  rationale: ബന്ധസർവനാമത്തിന്റെ മുൻപദം രൂപത്തിൽ യേശുവാണെങ്കിലും, സന്ദർഭത്തിൽ സാക്ഷ്യം അവന്റെ ഉയിർപ്പിക്കപ്പെടലിനെക്കുറിച്ചാണ്. ‘അതിന്’ എന്നത് മലയാളത്തിൽ ഈ സംഭവസംബന്ധമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάντες ἡμεῖς
  choice: ഞങ്ങൾ എല്ലാവരും
  rationale: ഗ്രീക്കിലെ ഊന്നൽ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐσμεν μάρτυρες
  choice: സാക്ഷികളാണ്
  rationale: നാമപ്രയോഗമായ μάρτυρες എന്നതിന്റെ ഘടന നിലനിർത്തി, സാക്ഷ്യം വഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ പദപ്രയോഗം
  choice: ദൈവം മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  alternative: ദൈവം ഉയർത്തി
  rationale: വാക്യം യേശുവിന്റെ പുനരുത്ഥാനം ദൈവത്തിന്റെ പ്രവൃത്തിയായി നേരിട്ട് പ്രസ്താവിക്കുന്നു. ‘മരിച്ചവരിൽനിന്ന്’ എന്നത് ഈ സന്ദർഭത്തിലെ ἀνέστησεν എന്ന ക്രിയയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു; അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: സാക്ഷ്യത്തിന്റെ വിഷയം
  choice: അതിന് ഞങ്ങൾ എല്ലാവരും സാക്ഷികളാണ്
  alternative: അവന് ഞങ്ങൾ എല്ലാവരും സാക്ഷികളാണ്
  rationale: οὗ വ്യാകരണപരമായി യേശുവിനെ സൂചിപ്പിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ അപ്പൊസ്തലന്മാർ അവന്റെ പുനരുത്ഥാനത്തിന്റെ സാക്ഷികളാണെന്ന സംഭവകേന്ദ്രിത അർത്ഥമാണ് മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികം. അടിക്കുറിപ്പ് പദാനുപദ സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘ഈ യേശു’ എന്ന സൂചക ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു; പുനരുത്ഥാനസന്ദർഭം പ്രധാനവാചകത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കിയിരിക്കുന്നു.
