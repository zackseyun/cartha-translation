source:
  edition: SBLGNT
  text: ὁ ἥλιος μεταστραφήσεται εἰς σκότος καὶ ἡ σελήνη εἰς αἷμα πρὶν ⸀ἢ ⸀ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/020.yaml
  text: The sun will be turned into darkness[a], and the moon into blood, before the great and glorious day of the Lord comes.
translation:
  language: ml
  text: കർത്താവിന്റെ മഹത്തും ശ്രദ്ധേയവുമായ[a] ദിവസം വരുന്നതിനുമുമ്പ് സൂര്യൻ ഇരുളായും ചന്ദ്രൻ രക്തമായും മാറും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘പ്രകടമായ’ അല്ലെങ്കിൽ ‘മഹിമയേറിയ’ (ഗ്രീക്ക്: ἐπιφανῆ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστραφήσεται
  choice: മാറും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സൂര്യനും ചന്ദ്രനും സംബന്ധിച്ച പ്രവാചകദൃശ്യത്തിന്റെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: εἰς σκότος
  choice: ഇരുളായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς αἷμα
  choice: രക്തമായി
  rationale: ഗ്രീക്കിലെ ശക്തമായ പ്രവാചകബിംബം വ്യാഖ്യാനിച്ച് ‘രക്തവർണമായി’ എന്നു ചുരുക്കാതെ അക്ഷുണ്ണമായി നിലനിർത്തുന്നു.
- source_word: πρὶν ἢ ἐλθεῖν
  choice: വരുന്നതിനുമുമ്പ്
  rationale: ഒരു സംഭവത്തിനു മുമ്പ് മറ്റൊന്ന് നടക്കുന്നു എന്ന കാലബന്ധം ആധുനിക മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡμέραν κυρίου
  choice: കർത്താവിന്റെ ... ദിവസം
  rationale: പ്രവാചകസാഹിത്യത്തിലെ സ്ഥിരമായ പ്രയോഗം നിലനിർത്തുകയും മറ്റൊരു സാങ്കേതിക അർഥവുമായി കലരുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: μεγάλην
  choice: മഹത്തും
  rationale: μέγας എന്ന പദത്തിന്റെ ഉയർന്നതും നേരിട്ടുള്ളതുമായ അർഥം നൽകുന്നു.
- source_word: ἐπιφανῆ
  choice: മഹിമയേറിയതുമായ
  rationale: അന്ത്യകാലസന്ദർഭത്തിലെ ഉന്നതഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘പ്രകടമായ/ശ്രദ്ധേയമായ’ എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോവേൽ ഉദ്ധരണിയിലെ ἡμέραν κυρίου എന്ന പ്രവാചകപ്രയോഗം
  choice: കർത്താവിന്റെ ദിവസം
  alternative: കർത്താവിനുള്ള ദിവസം
  rationale: ദൈവിക ഇടപെടലിന്റെ നിർണായക ദിവസത്തെ സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തുപരമായ പ്രയോഗം നിലനിർത്തുന്നു; പിൽക്കാല സഭാപരമായ പ്രത്യേക അർഥം ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: അന്ത്യകാലസന്ദർഭത്തിലെ ἐπιφανῆ എന്ന വിശേഷണം
  choice: മഹിമയേറിയ
  alternative: പ്രകടമായ; ശ്രദ്ധേയമായ
  rationale: പദത്തിന് ദൃശ്യമായി പ്രകടമാകുന്നത്, ശ്രദ്ധേയമാകുന്നത്, തേജസ്സുള്ളത് എന്നീ അർഥഛായകളുണ്ട്. മുഖ്യപാഠത്തിൽ സ്വാഭാവികവും ഉന്നതവുമായ രൂപം സ്വീകരിച്ചെങ്കിലും മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രവാചകശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടന മലയാളത്തിൽ ‘ഇരുളായും ... രക്തമായും മാറും’ എന്ന രൂപത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
