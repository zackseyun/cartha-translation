id: ACT.2.26
reference: Acts 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ എന്റെ ഹൃദയം ആനന്ദിച്ചു, എന്റെ നാവ് ആഹ്ലാദിച്ചു; മാത്രമല്ല, എന്റെ ജഡംപോലും പ്രത്യാശയിൽ കുടികൊള്ളും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ശരീരം പ്രത്യാശയിൽ വിശ്രമിക്കും.’
    reason: ‘ജഡം’ എന്നതിനുപകരം ‘ശരീരം’ എന്നും, κατασκηνώσει എന്നതിന്റെ താമസരൂപകത്തിനുപകരം സന്ദർഭാനുസൃതമായി ‘വിശ്രമിക്കും’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതാണ്.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇതു നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണം അഥവാ അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. അതിനാൽ വെറും നിഗമനസൂചകമായ പദത്തേക്കാൾ വ്യക്തമായി കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: എന്റെ ഹൃദയം ആനന്ദിച്ചു
  rationale: ഗ്രീക്കിലെ ഹൃദയം എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുകയും, passive രൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ അവസ്ഥാപ്രയോഗമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: എന്റെ നാവ് ആഹ്ലാദിച്ചു
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ‘നാവ്’ എന്ന കാവ്യാത്മക രൂപം ‘വായ’ എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു; ക്രിയയുടെ ഉല്ലാസപൂർണമായ സന്തോഷവും ‘ആഹ്ലാദിച്ചു’ അറിയിക്കുന്നു.
- source_word: ἔτι δὲ καὶ
  choice: മാത്രമല്ല ... പോലും
  rationale: വാക്യത്തിന്റെ തുടർച്ചയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἡ σάρξ μου
  choice: എന്റെ ജഡം
  rationale: σάρξ ഇവിടെ പാപസ്വഭാവമെന്ന ധാർമ്മിക അർഥത്തിലല്ല, മനുഷ്യന്റെ ദേഹധാരിയായ നിലയെ സൂചിപ്പിക്കുന്ന അക്ഷരാർഥത്തിലാണ്. ‘ജഡം’ ആ വ്യത്യാസം നിലനിർത്തുന്നു; ‘ശരീരം’ കൂടുതൽ വ്യാഖ്യാനപരമായൊരു പകരമാണ്.
- source_word: κατασκηνώσει
  choice: കുടികൊള്ളും
  rationale: താമസിക്കുക, പാളയമടിക്കുക എന്ന മൂലദൃശ്യത്തെ മലയാളത്തിൽ നിലനിർത്തുന്നു. ‘വിശ്രമിക്കും’ എന്നത് സാദ്ധ്യമായെങ്കിലും അർഥത്തെ കൂടുതൽ ചുരുക്കുന്നു.
- source_word: ἐπ’ ἐλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: ἐπί + dative സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം അഥവാ സുരക്ഷിതമായ പ്രത്യാശയുടെ മേഖല സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; പുനരുത്ഥാനത്തെ വാക്യത്തിൽ നേരിട്ട് ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനസന്ദർഭത്തിലെ σάρξ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: എന്റെ ജഡം
  alternative: എന്റെ ശരീരം
  rationale: ഇവിടെ പദം ധാർമ്മികമായ ‘പാപസ്വഭാവം’ എന്ന അർഥത്തിലല്ല. സങ്കീർത്തന ഉദ്ധരണിയുടെ മനുഷ്യശാസ്ത്രപരവും ദേഹപരവുമായ ഭാഷ നിലനിർത്താൻ ‘ജഡം’ സ്വീകരിച്ചു; വായനാസൗകര്യത്തിനായി ‘ശരീരം’ അടിക്കുറിപ്പിൽ പകരമായി നൽകി.
- issue: κατασκηνώσει ἐπ’ ἐλπίδι എന്ന പ്രയോഗത്തിന്റെ സൂക്ഷ്മത
  choice: പ്രത്യാശയിൽ കുടികൊള്ളും
  alternative: പ്രത്യാശയിൽ വിശ്രമിക്കും
  rationale: സുരക്ഷിതമായ വാസത്തിന്റെ രൂപകം നിലനിർത്തുകയും പുനരുത്ഥാനസൂചനയെ സന്ദർഭം വിശദീകരിക്കാൻ വിടുകയും ചെയ്യുന്നു. ‘വിശ്രമിക്കും’ മരണവിശ്രമത്തിന്റെ ആശയം കൂടുതൽ മുൻനിരയിലാക്കുന്നതിനാൽ പകരവായനയായി മാത്രം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യസമാന്തരതയും ‘ഹൃദയം/നാവ്/ജഡം’ എന്ന ദേഹാത്മക ഭാഷയും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘was glad’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം σάρξ–κατασκηνώσει എന്ന അവസാന പ്രയോഗത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്; അതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ [a] പ്രസക്തമായ വാക്യാവസാനത്ത് ചേർത്തു.
