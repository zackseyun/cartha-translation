id: ACT.2.24
reference: Acts 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: ml
  text: അവനെ ദൈവം മരണത്തിന്റെ വേദനകൾ[a] അഴിച്ചുവിട്ട് ഉയിർപ്പിച്ചു; കാരണം, മരണത്തിന് അവനെ പിടിച്ചുവെക്കാൻ സാധ്യമല്ലായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രസവവേദനകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കുപദത്തിന് പ്രസവസമയത്തെ വേദനകളെയും പൊതുവായ കഠിനവേദനകളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'പദശഃ ‘അതാൽ’ അഥവാ ‘അതിന്റെ പിടിയാൽ’; ഈ സർവനാമം ഏറ്റവും സ്വാഭാവികമായി ‘മരണം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു: ‘മരണത്താൽ/മരണത്തിന്റെ പിടിയിൽ’.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: അവനെ
  rationale: മുൻവാക്യത്തിലെ യേശുവിനെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമം. മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്താൻ ‘അവനെ’ എന്നു നൽകി.
- source_word: ἀνέστησεν
  choice: ഉയിർപ്പിച്ചു
  rationale: ദൈവം യേശുവിനെ മരിച്ചവരിൽനിന്ന് എഴുന്നേല്പിച്ച പ്രവൃത്തിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: λύσας
  choice: അഴിച്ചുവിട്ട്
  rationale: ‘അഴിക്കുക, കെട്ടഴിച്ച് വിടുക, മോചിപ്പിക്കുക’ എന്ന മൂർത്തമായ ദൃശ്യഭാവം കഴിയുന്നത്ര നിലനിർത്തുന്നു; മുഖ്യക്രിയയോടൊപ്പമുള്ള പ്രവൃത്തിയെയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: മരണത്തിന്റെ വേദനകൾ
  rationale: ὠδίν എന്ന പദത്തിന് കഠിനവേദനകൾ എന്നും പ്രസവവേദനകൾ എന്നും അർഥമാകാം. സന്ദർഭത്തിൽ മരണവുമായി ബന്ധപ്പെട്ട വേദനകൾ എന്ന വായന സ്വാഭാവികമായതിനാൽ മുഖ്യപാഠത്തിൽ അതു സ്വീകരിച്ചു; പ്രസവവേദന എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: καθότι
  choice: കാരണം
  rationale: മുൻപറഞ്ഞ ദൈവിക പ്രവൃത്തിയുടെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐκ ἦν δυνατὸν
  choice: സാധ്യമല്ലായിരുന്നു
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക സാധ്യതാപ്രയോഗം അതിശയോക്തിയില്ലാതെ അടുത്തായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: κρατεῖσθαι
  choice: പിടിച്ചുവെക്കാൻ
  rationale: തന്റെ അധികാരത്തിലോ പിടിയിലോ തുടർന്നു നിർത്തുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. സജീവവാക്യഘടന മലയാളവായനയ്ക്ക് കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ὑπ’ αὐτοῦ
  choice: മരണത്തിന്
  rationale: സർവനാമത്തിന്റെ ഏറ്റവും അടുത്തതും സന്ദർഭോചിതവുമായ പൂർവപദം ‘മരണം’ ആണ്. മലയാളത്തിൽ അവ്യക്തമായ ‘അതിന്’ എന്നതിനു പകരം പൂർവപദം ആവർത്തിച്ച് അർഥം വ്യക്തമാക്കിയിരിക്കുന്നു; പദശഃ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: ὑπ’ αὐτοῦ എന്നതിന്റെ സൂചിതപദം
  choice: സർവനാമം മരണത്തെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിൽ ‘മരണത്തിന്’ എന്നു വ്യക്തമാക്കി.
  alternative: പദശഃ ‘അതാൽ/അതിനാൽ’; വ്യാകരണപരമായി ‘അവനാൽ’ എന്നും വായിക്കാവുന്ന രൂപമാണെങ്കിലും സന്ദർഭത്തിൽ അതിന് സാധ്യത കുറവാണ്.
  rationale: ഏറ്റവും അടുത്ത പൂർവപദം θανάτου (‘മരണം’) ആണ്; തുടർന്നുള്ള വാക്യം മരണത്തിന് യേശുവിനെ പിടിച്ചുവെക്കാൻ കഴിഞ്ഞില്ല എന്ന ആശയം യുക്തിപൂർവം നൽകുന്നു. പദശഃ സർവനാമരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: ὠδῖνας എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘വേദനകൾ’.
  alternative: ‘പ്രസവവേദനകൾ’ അല്ലെങ്കിൽ ‘അതിവേദനകൾ’.
  rationale: പദത്തിന് പ്രസവവേദന എന്ന പ്രത്യേക അർഥം ഉണ്ടെങ്കിലും, ഇവിടെ മരണത്തിന്റെ പിടിയെയും അതിൽനിന്നുള്ള മോചനത്തെയും കുറിച്ചുള്ള സന്ദർഭത്തിൽ പൊതുവായ ‘വേദനകൾ’ സ്വാഭാവികമാണ്. മൂലപദത്തിന്റെ ദൃശ്യസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അഴിച്ചുവിട്ട്’ എന്ന പ്രയോഗം മൂലത്തിലെ λύω എന്ന പദത്തിന്റെ കെട്ടഴിക്കുന്ന ദൃശ്യഭാവം സൂക്ഷിക്കുന്നു; അവസാന ഉപവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ സജീവഘടന ഉപയോഗിച്ചു.
