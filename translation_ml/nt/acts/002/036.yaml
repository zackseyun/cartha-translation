id: ACT.2.36
reference: Acts 2:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ ക്രൂശിച്ച ഈ യേശുവിനെ ദൈവം കർത്താവും മശീഹായും ആക്കിയിരിക്കുന്നു എന്ന് ഇസ്രായേൽഗൃഹം മുഴുവനും ഉറപ്പായി അറിഞ്ഞുകൊള്ളട്ടെ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός (ക്രിസ്റ്റോസ്) ഇവിടെ ഇസ്രായേലിനോടുള്ള പത്രോസിന്റെ പ്രസംഗത്തിൽ പദവിയർത്ഥം നിലനിർത്താൻ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “കർത്താവും മശീഹായും ആക്കിയിരിക്കുന്നു” എന്ന പ്രയോഗം ഈ പ്രസംഗത്തിന്റെ പുനരുത്ഥാന-ഉയർത്തൽ പശ്ചാത്തലത്തിൽ ദൈവം യേശുവിനെ ഉയർത്തിയതുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: ഉറപ്പായി
  rationale: പത്രോസിന്റെ പ്രഖ്യാപനത്തിലെ നിശ്ചയദാർഢ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള പുനരുത്ഥാന-ഉയർത്തൽ വാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: γινωσκέτω
  choice: അറിഞ്ഞുകൊള്ളട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞയുടെ കൂട്ടായ അഭിസംബോധനാഭാവം നിലനിർത്തുന്നു.
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: ഇസ്രായേൽഗൃഹം മുഴുവനും
  rationale: ഉടമ്പടിജനത്തെ ഒരു സമൂഹമായി സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: ഉയർന്ന അധികാരത്തെ സൂചിപ്പിക്കുന്ന പദവിനാമമായതിനാൽ ‘കർത്താവ്’ യോജിക്കുന്നു; മുൻ ഉദ്ധരണിയുമായുള്ള പ്രതിധ്വനിയും നിലനിൽക്കുന്നു.
- source_word: Χριστόν
  choice: മശീഹ
  rationale: ഇസ്രായേലിനോടുള്ള പത്രോസിന്റെ പ്രസംഗത്തിൽ അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവെന്ന പദവിയർത്ഥമാണ് മുൻനിൽക്കുന്നത്.
- source_word: ἐποίησεν
  choice: ആക്കിയിരിക്കുന്നു
  rationale: ക്രിയയുടെ നേരായ അർത്ഥവും പൂർത്തിയായ ദൈവിക പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു; ‘നിയമിച്ചു’ എന്നു വ്യാഖ്യാനിച്ച് മൂലപദത്തിന്റെ പരിധി ചുരുക്കുന്നില്ല.
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: ഈ യേശുവിനെ
  rationale: ചരിത്രത്തിലെ നിർദിഷ്ടനായ യേശുവിലേക്കു വിരൽചൂണ്ടുന്ന ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: നിങ്ങൾ ക്രൂശിച്ച
  rationale: ശ്രോതാക്കളുടെ ഉത്തരവാദിത്വത്തെക്കുറിച്ചുള്ള പത്രോസിന്റെ നേരിട്ടുള്ള കുറ്റാരോപണഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവം കർത്താവും മശീഹയും ആക്കി’ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അർത്ഥം
  choice: മൂലക്രിയയുടെ നേരായ ശക്തി നിലനിർത്തി ‘ആക്കിയിരിക്കുന്നു’ എന്നു വിവർത്തനം ചെയ്തു; അടിക്കുറിപ്പിൽ യേശുവിന്റെ ഉയർത്തലും ഈ സ്ഥാനങ്ങളിലെ പരസ്യസ്ഥാപനവും പശ്ചാത്തലമാണെന്ന് വ്യക്തമാക്കി.
  alternative: ‘നിയമിച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘സ്ഥാപിച്ചിരിക്കുന്നു’ എന്നു മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ യേശുവിന്റെ ദൈവിക സ്വഭാവത്തിൽ മാറ്റമുണ്ടായെന്നു വായിക്കുക.
  rationale: ἐποίησεν എന്നതിന്റെ സാധാരണ അർത്ഥം മറയ്ക്കാതെ നിലനിർത്തണം. അതേസമയം, സന്ദർഭം യേശുവിന്റെ പുനരുത്ഥാനത്തെയും ഉയർത്തലിനെയും കുറിച്ചാകയാൽ, ഈ പ്രയോഗം അവന്റെ ദൈവിക സ്വഭാവം മാറിയെന്ന ആശയം നിർബന്ധിക്കുന്നില്ല.
- issue: Χριστός എന്ന പദവിനാമത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ‘ഇസ്രായേൽഗൃഹം’ എന്ന അഭിസംബോധനയിൽ വാഗ്ദത്ത അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന പദവിയർത്ഥം വ്യക്തമായി മുൻനിൽക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഇസ്രായേൽഗൃഹം’ എന്ന ബൈബിൾസവിശേഷമായ കൂട്ടായ പ്രയോഗം നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം സ്വാഭാവികമായ മലയാളത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
