id: ACT.2.7
reference: Acts 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: ml
  text: 'അവർ അമ്പരന്നുപോവുകയും ആശ്ചര്യപ്പെടുകയും ചെയ്തു; അവർ ഇങ്ങനെ പറഞ്ഞു: “നോക്കൂ[a], സംസാരിക്കുന്ന ഇവരെല്ലാം ഗലീലക്കാരല്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതാ” അല്ലെങ്കിൽ “കാണൂ.”
    reason: ശ്രദ്ധ ക്ഷണിക്കുന്ന ἰδοὺ എന്ന പദത്തിന് സാധ്യമായ മറ്റു മലയാള തുല്യപ്രയോഗങ്ങൾ.
lexical_decisions:
- source_word: ἐξίσταντο
  choice: അമ്പരന്നുപോകുകയും
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ അത്യന്തം അമ്പരക്കുകയോ വിസ്മയിച്ചുപോകുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അമ്പരന്നുപോകുക’ അതിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: വാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിൽ പ്രത്യേകം പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ ‘അവർ’ എന്നു നേരിട്ട് തുടങ്ങുന്നത് സ്വാഭാവികമായതിനാൽ നിർബന്ധിതമായി ‘എന്നാൽ’ എന്നോ ‘അപ്പോൾ’ എന്നോ ചേർത്തിട്ടില്ല.
- source_word: καὶ
  choice: -കയും … -കയും
  rationale: രണ്ട് അപൂർണകാല ക്രിയകളെയും കൂട്ടിച്ചേർത്ത് അവരുടെ പ്രതികരണത്തിന്റെ സഞ്ചിതസ്വഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐθαύμαζον
  choice: ആശ്ചര്യപ്പെടുകയും
  rationale: ക്രിയയുടെ അത്ഭുതവും വിസ്മയവും സൂചിപ്പിക്കുന്ന അർഥം വ്യക്തവും സമകാലികവുമായ മലയാളത്തിൽ നൽകുന്നു; മുൻക്രിയയുമായുള്ള അർഥസാമീപ്യവും നിലനിർത്തുന്നു.
- source_word: λέγοντες
  choice: പറഞ്ഞു
  rationale: വർത്തമാനകാല കൃദന്തം അവരുടെ പ്രതികരണത്തോടൊപ്പം നടന്ന സംസാരത്തെ പരിചയപ്പെടുത്തുന്നു. മലയാളത്തിൽ ‘ചെയ്തുകൊണ്ട് പറഞ്ഞു’ എന്ന ഘടന ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Οὐχ
  choice: അല്ലേ?
  rationale: οὐχ ഉപയോഗിച്ചുള്ള ചോദ്യം സമ്മതാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു. മലയാളത്തിലെ ‘അല്ലേ?’ അതേ ചോദ്യഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἰδοὺ
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഈ അവ്യയത്തിന് ‘നോക്കൂ’ ആധുനികവും വ്യക്തവുമായ തുല്യപ്രയോഗമാണ്.
- source_word: πάντες οὗτοί
  choice: ഇവരെല്ലാം
  rationale: ചർച്ചയിലുള്ള മുഴുവൻ ആളുകളെയും സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം; മൂലത്തിൽ ഇല്ലാത്ത ‘പുരുഷന്മാർ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: οἱ λαλοῦντες
  choice: സംസാരിക്കുന്ന
  rationale: സംസാരിച്ചുകൊണ്ടിരിക്കുന്നവരെ തിരിച്ചറിയിക്കുന്ന substantival present participle-ന്റെ തുടരുന്ന പ്രവർത്തനം നിലനിർത്തുന്നു.
- source_word: Γαλιλαῖοι
  choice: ഗലീലക്കാർ
  rationale: പ്രദേശപരമായ തിരിച്ചറിയലിന്റെ നേരിട്ടുള്ള മലയാളരൂപം; അവരുടെ പശ്ചാത്തലത്തെക്കുറിച്ചുള്ള വിശദീകരണം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘ഗലീലക്കാർ’ എന്ന പ്രദേശനാമത്തിൽ സൂചിതമായ സാമൂഹികമോ പ്രദേശപരമോ ആയ ആശ്ചര്യം
  choice: കാരണവിവരണം ചേർക്കാതെ പ്രദേശനാമം മാത്രം നിലനിർത്തി
  alternative: വിദ്യാഭ്യാസമില്ലാത്ത ഗലീലക്കാർ / വടക്കുനിന്നുള്ള ഗലീലക്കാർ
  rationale: സംസാരിക്കുന്നവർ ഗലീലക്കാരാണെന്നതിൽ ജനക്കൂട്ടം ആശ്ചര്യപ്പെടുന്നതായി വാക്യം പറയുന്നു; എന്നാൽ അതിന്റെ കാരണം ഉച്ചാരണമോ വിദ്യാഭ്യാസമോ സാമൂഹികപദവിയോ ആണെന്ന് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനാത്മക നിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അമ്പരന്നുപോകുകയും ആശ്ചര്യപ്പെടുകയും’ എന്ന ഇരട്ടപ്രയോഗം മൂലത്തിലെ വ്യത്യസ്തമായെങ്കിലും അർഥസാമീപ്യമുള്ള രണ്ട് പ്രതികരണക്രിയകളെയും നിലനിർത്തുന്നു. ചോദ്യത്തിലെ സമ്മതം പ്രതീക്ഷിക്കുന്ന ഭാവം ‘അല്ലേ?’ എന്ന രൂപത്തിൽ പ്രകടിപ്പിച്ചിട്ടുണ്ട്.
