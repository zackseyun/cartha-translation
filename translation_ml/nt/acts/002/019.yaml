id: ACT.2.19
reference: Acts 2:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: ml
  text: 'മുകളിലെ ആകാശത്തിൽ ഞാൻ അത്ഭുതങ്ങളും താഴെയുള്ള ഭൂമിയിൽ അടയാളങ്ങളും നൽകും: രക്തവും തീയും പുകമേഘവും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “പുകയുടെ ആവി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: നൽകും
  rationale: δίδωμι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ദൈവം അടയാളങ്ങൾ ഏർപ്പെടുത്തുന്നു എന്ന പ്രവാചകഭാവത്തിനും യോജിക്കുന്നു.
- source_word: τέρατα
  choice: അത്ഭുതങ്ങൾ
  rationale: വിസ്മയം ജനിപ്പിക്കുന്ന അസാധാരണ പ്രതിഭാസങ്ങളെ സൂചിപ്പിക്കുകയും σημεῖα എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: മുകളിലെ ആകാശത്തിൽ
  rationale: ἄνω എന്ന ഉയരസൂചനയും താഴെയുള്ള ഭൂമിയുമായുള്ള ലംബവൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ οὐρανός ദൃശ്യമായ ആകാശമണ്ഡലത്തെയും ഉൾക്കൊള്ളുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: സംഭവങ്ങൾ വെറും അസാധാരണ കാഴ്ചകളല്ല, അർഥസൂചകങ്ങളാണെന്ന ആശയം വ്യക്തമാക്കുന്ന പതിവ് ബൈബിൾപദമാണ്.
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: താഴെയുള്ള ഭൂമിയിൽ
  rationale: മുകളിലെ ആകാശം എന്നതിനോടുള്ള പ്രപഞ്ചപരമായ വൈരുധ്യം നിലനിർത്തുന്നു; γῆയെ പ്രാദേശികമായ ‘ദേശം’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: αἷμα
  choice: രക്തം
  rationale: ദൃശ്യവും ശക്തവുമായ പ്രവാചകചിത്രണം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πῦρ
  choice: തീ
  rationale: മൂലപദത്തിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളസമാനപദം.
- source_word: ἀτμίδα καπνοῦ
  choice: പുകമേഘം
  rationale: പുകയുടെ ദൃശ്യമായ കട്ടിയുള്ള ഉയർച്ചയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘പുകയുടെ ആവി’ എന്ന കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യോവേൽ ഉദ്ധരണിയിലെ പ്രപഞ്ചസ്ഥാനങ്ങളുടെ വിവർത്തനം
  choice: മുകളിലെ ആകാശം ... താഴെയുള്ള ഭൂമി
  alternative: മുകളിലെ സ്വർഗം ... താഴെയുള്ള ദേശം
  rationale: οὐρανός–γῆ എന്ന പ്രപഞ്ചപരമായ വൈരുധ്യം സംരക്ഷിക്കുകയും ചിത്രണത്തെ കേവലം സ്വർഗീയലോകത്തിലേക്കോ ഒരു പ്രാദേശിക ദേശത്തിലേക്കോ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രവാചകശൈലി. ‘അത്ഭുതങ്ങൾ—അടയാളങ്ങൾ’, ‘മുകളിൽ—താഴെ’ എന്നീ മൂലപാഠത്തിലെ സമാന്തര ഘടനകൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
