  naturalness: The Malayalam is fluent modern standard Malayalam with an appropriately formal public-address register. “ശ്രദ്ധിച്ചുകേൾക്കുവിൻ” naturally conveys the attentive force of ἐνωτίσασθε. The vocatives and semicolon provide clear, natural speech cadence.
