id: ACT.2.14
reference: Acts 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: ml
  text: 'എന്നാൽ പത്രോസ് പതിനൊന്നുപേരോടൊപ്പം എഴുന്നേറ്റുനിന്ന് ശബ്ദമുയർത്തി അവരോടു പ്രഖ്യാപിച്ചു: “യെഹൂദ്യരായ പുരുഷന്മാരേ, യെരൂശലേമിൽ താമസിക്കുന്ന എല്ലാവരുമേ, ഇതു നിങ്ങൾ അറിഞ്ഞുകൊള്ളട്ടെ; എന്റെ വാക്കുകൾ ശ്രദ്ധിച്ചുകേൾക്കുവിൻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σταθεὶς
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം പ്രസംഗിക്കാൻ നിലകൊള്ളുന്ന രംഗം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എഴുന്നേറ്റുനിന്ന്’ സ്വാഭാവികവും പ്രവർത്തനത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പരിഹാസാരോപണത്തിൽനിന്നുള്ള വ്യത്യാസവും പ്രസംഗത്തിലെ വഴിത്തിരിവും അടയാളപ്പെടുത്തുന്നു.
- source_word: σὺν τοῖς ἕνδεκα
  choice: പതിനൊന്നുപേരോടൊപ്പം
  rationale: σύν സഹവർത്തിത്വത്തെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: ശബ്ദമുയർത്തി
  rationale: പൊതുജനങ്ങൾ കേൾക്കത്തക്കവിധം ഉറക്കെ സംസാരിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀπεφθέγξατο
  choice: പ്രഖ്യാപിച്ചു
  rationale: ഗൗരവമുള്ള പരസ്യപ്രസംഗത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ഭാരം നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തിൽ നേരിട്ട് പറയാത്ത ദൈവിക പ്രചോദനം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: യെഹൂദ്യരായ പുരുഷന്മാരേ
  rationale: ἄνδρες എന്ന പുല്ലിംഗ സംബോധനയും Ἰουδαῖοι എന്ന യെഹൂദ്യ/യഹൂദ തിരിച്ചറിയലും നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ യെഹൂദ്യയോടുള്ള ബന്ധവും ഉൾക്കൊള്ളുന്നു.
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: യെരൂശലേമിൽ താമസിക്കുന്ന എല്ലാവരുമേ
  rationale: വർത്തമാന കൃദന്തരൂപം അവിടെ പാർക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; πάντες എന്ന സമഗ്രതയും സംബോധനഭാവവും നിലനിർത്തുന്നു.
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: ഇതു നിങ്ങൾ അറിഞ്ഞുകൊള്ളട്ടെ
  rationale: ἔστωയുടെ ആജ്ഞാസൂചക ഔപചാരികതയും γνωστόν എന്ന അറിവിലാക്കൽഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐνωτίσασθε
  choice: ശ്രദ്ധിച്ചുകേൾക്കുവിൻ
  rationale: വെറും കേൾവിയേക്കാൾ ശ്രദ്ധാപൂർവം ചെവികൊടുക്കുക എന്ന ശക്തമായ ആജ്ഞയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ ῥήματά μου
  choice: എന്റെ വാക്കുകൾ
  rationale: സംസാരിക്കപ്പെടുന്ന വാക്കുകൾ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘സന്ദേശം’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: Ἄνδρες എന്നതിലെ ലിംഗവ്യക്തത
  choice: യെഹൂദ്യരായ പുരുഷന്മാരേ
  alternative: യെഹൂദ്യരേ / യഹൂദജനമേ
  rationale: ഗ്രീക്ക് പദം വ്യക്തമായി പുല്ലിംഗമാണ്; അതിനെ ലിംഗനിരപേക്ഷമാക്കി മാറ്റാതെ ഉറവിടത്തിന്റെ സംബോധനരൂപം നിലനിർത്തുന്നു.
- issue: ἀπεφθέγξατο ദൈവപ്രചോദിത പ്രസംഗമെന്നു പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: പ്രഖ്യാപിച്ചു
  alternative: ദൈവപ്രചോദിതനായി അരുളിച്ചെയ്തു / അവരെ അഭിസംബോധന ചെയ്തു
  rationale: ക്രിയയുടെ ഗൗരവമുള്ള പരസ്യപ്രസംഗഭാവം സംരക്ഷിക്കുമ്പോഴും ഈ ക്രിയ മാത്രം അടിസ്ഥാനമാക്കി ദൈവപ്രചോദനം പ്രധാനപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: Ἰουδαῖοι എന്നത് ഭൗമികമോ ജനതാത്മകമോ ആയി മാത്രം നിർണയിക്കണമോ
  choice: യെഹൂദ്യരായ
  alternative: യഹൂദരായ / യെഹൂദ്യദേശക്കാരായ
  rationale: രൂപത്തിന് യഹൂദ തിരിച്ചറിയലും യെഹൂദ്യബന്ധവും സൂചിപ്പിക്കാനാകുന്നതിനാൽ ഒരു വശം അമിതമായി നിർണയിക്കാതെ സന്ദർഭത്തിന് യോജിച്ച പരമ്പരാഗത ഭൗമിക രൂപം സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ള പൊതുപ്രസംഗശൈലി. ‘ശ്രദ്ധിച്ചുകേൾക്കുവിൻ’ പോലുള്ള രൂപങ്ങൾ ഔപചാരികത നിലനിർത്തുന്നു, എന്നാൽ പഴഞ്ചൻ അഥവാ അത്യന്തം ആരാധനാഭാഷാപരമായ പ്രയോഗങ്ങൾ ഒഴിവാക്കിയിരിക്കുന്നു. പ്രധാനപാഠത്തിൽ അടിക്കുറിപ്പുകളില്ല; അതിനാൽ മാർക്കറുകളും ആവശ്യമില്ല.
