  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ ⸀κοινωνίᾳ, τῇ κλάσει τοῦ ἄρτου καὶ ταῖς προσευχαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: ml
  text: അവർ അപ്പൊസ്തലന്മാരുടെ ഉപദേശത്തിലും കൂട്ടായ്മയിലും[a], അപ്പം നുറുക്കുന്നതിലും[b], പ്രാർത്ഥനകളിലും[c] നിഷ്ഠയോടെ തുടർന്നുപോന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പങ്കിടൽ,’ ‘പങ്കാളിത്തം,’ അല്ലെങ്കിൽ ‘സഹഭാഗിത്വം.’
    reason: lexical_alternative
  - marker: b
    text: ‘അപ്പം നുറുക്കുന്നത്’ പൊതുവായ കൂട്ടുഭക്ഷണങ്ങളെ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ കർത്താവിന്റെ അത്താഴവും ഉൾപ്പെടുന്നതായി പലരും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘നിശ്ചിത പ്രാർത്ഥനകൾ’; ഗ്രീക്കിലെ നിശ്ചയസൂചക ഉപപദം അംഗീകൃത പ്രാർത്ഥനാസമയങ്ങളെയോ രൂപങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: ദൃഢനിഷ്ഠയോടെ തുടർന്നുപോന്നു
  rationale: ἦσαν എന്ന അപൂർണഭൂതകാല ക്രിയയും προσκαρτεροῦντες എന്ന വർത്തമാനകർത്തൃവാചക രൂപവും ചേർന്ന് ഭൂതകാലത്തിലെ നിരന്തരവും പതിവായതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘ദൃഢനിഷ്ഠയോടെ തുടർന്നുപോന്നു’ എന്നത് ആ തുടർച്ചയും ഉറച്ച പ്രതിബദ്ധതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരുടെ ഉപദേശത്തിൽ
  rationale: διδαχή ഇവിടെ പഠിപ്പിക്കലിനെയും അതിന്റെ ഉള്ളടക്കത്തെയും സൂചിപ്പിക്കുന്നു. ‘ഉപദേശം’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ജനിറ്റീവ് അപ്പൊസ്തലന്മാർ നൽകിയ ഉപദേശമെന്ന സ്വാഭാവിക ബന്ധമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τῇ κοινωνίᾳ
  choice: കൂട്ടായ്മയിൽ
  rationale: κοινωνία പങ്കാളിത്തം, പങ്കുവെക്കൽ, പൊതുജീവിതം എന്നിവ ഉൾക്കൊള്ളുന്ന വിശാലമായ പദമാണ്. ‘കൂട്ടായ്മ’ അതിനെ സാമ്പത്തിക പങ്കിടലിലേക്കോ കൂദാശാപരമായ അർഥത്തിലേക്കോ മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: അപ്പം നുറുക്കുന്നതിൽ
  rationale: ലൂക്കാ–പ്രവൃത്തികളിൽ കാണുന്ന ഈ പ്രയോഗത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു. സാധാരണ കൂട്ടുഭക്ഷണമോ കർത്താവിന്റെ അത്താഴം ഉൾപ്പെട്ട ഭക്ഷണമോ എന്നത് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: ταῖς προσευχαῖς
  choice: പ്രാർഥനകളിൽ
  rationale: ബഹുവചനവും നിർദിഷ്ട ആർട്ടിക്കിളും പരിഗണിച്ച് ബഹുവചനരൂപം ഉപയോഗിച്ചു. സന്ദർഭം അംഗീകൃത പ്രാർഥനാസമയങ്ങളെയോ രൂപങ്ങളെയോ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: κλάσις τοῦ ἄρτου എന്നത് കർത്താവിന്റെ അത്താഴം എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: വിശാലമായ ‘അപ്പം നുറുക്കുന്നത്’ എന്ന പ്രയോഗം നിലനിർത്തി
  alternative: ‘കർത്താവിന്റെ അത്താഴം’, ‘യൂഖരിസ്തി’, അല്ലെങ്കിൽ കർത്താവിന്റെ അത്താഴം ഉൾപ്പെടുന്ന കൂട്ടുഭക്ഷണം
  rationale: ഗ്രീക്ക് പ്രയോഗം കൂട്ടുഭക്ഷണത്തെ സൂചിപ്പിക്കാം; ക്രൈസ്തവസന്ദർഭത്തിൽ അത് കർത്താവിന്റെ അത്താഴവും ഉൾക്കൊള്ളാം. എന്നാൽ ഈ വാക്യം മാത്രം സാങ്കേതികമായ കൂദാശാപരമായ അർഥം നിർബന്ധിക്കുന്നില്ല.
- issue: κοινωνία എന്നത് സാമ്പത്തിക പങ്കിടലിലേക്കോ കൂദാശാപരമായ സംസർഗത്തിലേക്കോ ചുരുക്കണമോ
  choice: വിശാലമായ ‘കൂട്ടായ്മ’ എന്ന പദം ഉപയോഗിച്ചു
  alternative: സ്വത്തുവകകളുടെ പങ്കിടൽ; സംസർഗം/കമ്മ്യൂണിയൻ
  rationale: ഈ പദത്തിൽ ഒരുമിച്ചുള്ള ജീവിതവും പങ്കാളിത്തവും ഭൗതികവും ആത്മീയവുമായ പങ്കുവെക്കലും ഉൾപ്പെടാം. ഒരു പ്രത്യേക അർഥത്തിലേക്കു ചുരുക്കുന്നത് മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി നേരത്തേ തീർപ്പാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. പട്ടികയിലെ സമാന്തര ഘടന നിലനിർത്താൻ ഓരോ ഘടകത്തോടും ‘-ത്തിൽ/-കളിൽ’ രൂപം ഉപയോഗിച്ചു. മൂലപാഠത്തിലെ തുടർച്ചയും ഉറച്ച പ്രതിബദ്ധതയും ‘ദൃഢനിഷ്ഠയോടെ തുടർന്നുപോന്നു’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കി.
