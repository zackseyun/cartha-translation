id: ACT.2.28
reference: Acts 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγνώρισάς μοι ὁδοὺς ζωῆς, πληρώσεις με εὐφροσύνης μετὰ τοῦ προσώπου σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: ml
  text: ജീവന്റെ പാതകൾ നീ എനിക്ക് അറിയിച്ചുതന്നു[a]; നിന്റെ സാന്നിധ്യത്തിൽ[b] നീ എന്നെ ആനന്ദംകൊണ്ടു നിറയ്ക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജീവന്റെ വഴികൾ.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ മുഖത്തോടൊപ്പം”; അതായത്, “നിന്റെ സാന്നിധ്യത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: നീ എനിക്ക് അറിയിച്ചുതന്നു
  rationale: ἐγνώρισάς എന്ന എയോറിസ്റ്റ് ക്രിയയുടെ ‘അറിയാൻ ഇടയാക്കി/അറിയിച്ചുകൊടുത്തു’ എന്ന കാരകഭാവവും μοι എന്ന പരോക്ഷകർമവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁδοὺς ζωῆς
  choice: ജീവന്റെ പാതകൾ
  rationale: ὁδούς എന്ന ബഹുവചനവും അതിന്റെ മൂർത്തമായ ‘പാതകൾ’ എന്ന അർഥവും നിലനിർത്തുന്നു. ζωῆς എന്ന ജനിറ്റീവ് ജീവൻകൊണ്ട് വിശേഷിപ്പിക്കപ്പെടുന്ന, അഥവാ ജീവനിലേക്കു നയിക്കുന്ന പാതകൾ എന്ന തുറന്ന അർഥം അനുവദിക്കുന്നു.
- source_word: πληρώσεις με
  choice: നീ എന്നെ … നിറയ്ക്കും
  rationale: ഭാവികാല സജീവ നിർദേശകത്തിന്റെ നേരായ അർഥവും με എന്ന പ്രത്യക്ഷകർമവും വ്യക്തമായി നൽകുന്നു.
- source_word: εὐφροσύνης
  choice: ആനന്ദംകൊണ്ടു
  rationale: πληρόω-യോടു ചേർന്ന ജനിറ്റീവ് നിറയ്ക്കപ്പെടുന്ന ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു. εὐφροσύνηയിലെ സന്തോഷപൂർണമായ ആഹ്ലാദഭാവം ‘ആനന്ദം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μετὰ τοῦ προσώπου σου
  choice: നിന്റെ സാന്നിധ്യത്തിൽ
  rationale: അക്ഷരാർഥത്തിൽ ‘നിന്റെ മുഖത്തോടൊപ്പം’ എന്നുള്ള സെമിറ്റിക്-ഗ്രീക്ക് പ്രയോഗം വ്യക്തിപരമായ സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നിന്റെ സാന്നിധ്യത്തിൽ’ അർഥം സ്വാഭാവികമായി പകർന്നു നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ ദൈവിക സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന ‘മുഖം’ എന്ന പ്രയോഗം
  choice: നിന്റെ സാന്നിധ്യത്തിൽ
  alternative: നിന്റെ മുഖത്തോടൊപ്പം
  rationale: ദൈവത്തിന്റെ നേരിട്ടുള്ള സാന്നിധ്യവുമായി ബന്ധപ്പെട്ട ആനന്ദം വ്യക്തമായി നിലനിർത്തുന്നു. അസ്വാഭാവികമായ അക്ഷരാർഥപ്രയോഗം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കിയെങ്കിലും അതിന്റെ രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി; പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ചാണ്; ‘പാതകൾ’ എന്ന മൂർത്തരൂപവും ‘സാന്നിധ്യം’ എന്ന അർഥസുതാര്യമായ പ്രയോഗവും ഉപയോഗിച്ചു.
