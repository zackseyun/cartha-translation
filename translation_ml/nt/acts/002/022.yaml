id: ACT.2.22
reference: Acts 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: ml
  text: 'ഇസ്രായേൽജനതയിലെ പുരുഷന്മാരേ, ഈ വാക്കുകൾ കേൾക്കുക: നസറായനായ യേശു—ദൈവം അവനിലൂടെ നിങ്ങളുടെ മധ്യത്തിൽ ചെയ്ത ശക്തിപ്രവൃത്തികളാലും അത്ഭുതങ്ങളാലും അടയാളങ്ങളാലും ദൈവം നിങ്ങൾക്കു സാക്ഷ്യപ്പെടുത്തിയ ഒരു മനുഷ്യൻ—നിങ്ങൾതന്നെ അറിയുന്നതുപോലെ—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ഇസ്രായേൽപുരുഷന്മാരേ
  rationale: ἄνδρες എന്ന വ്യക്തമായ പുല്ലിംഗസംബോധനയും Ἰσραηλῖται എന്ന ജനതാസൂചനയും നിലനിർത്തുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന നേരിട്ടുള്ള സംബോധന.
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: ഈ വാക്കുകൾ കേൾക്കുക
  rationale: ശ്രദ്ധിക്കാനുള്ള ആജ്ഞയായ ἀκούσατε-യും λόγους എന്ന ‘വാക്കുകൾ’ എന്ന അർഥവും വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: നസറായനായ യേശു
  rationale: Ναζωραῖος എന്ന തിരിച്ചറിയൽപദത്തിന്റെ വിശേഷണസ്വഭാവം നിലനിർത്തുകയും ആധുനിക മലയാള ബൈബിൾ ശൈലിയിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἄνδρα
  choice: ഒരു മനുഷ്യൻ
  rationale: യേശുവിനെക്കുറിച്ച് ഗ്രീക്ക് പാഠം ഉപയോഗിക്കുന്ന വ്യക്തമായ മനുഷ്യസൂചന മങ്ങിക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: ദൈവം നിങ്ങൾക്കു സാക്ഷ്യപ്പെടുത്തിയ
  rationale: ἀποδείκνυμι ഇവിടെ പരസ്യമായി തെളിയിക്കുക/സാക്ഷ്യപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു; ἀπὸ τοῦ θεοῦ ദൈവത്തെ ഉറവിടവും പ്രവർത്തകനുമായി, εἰς ὑμᾶς പ്രേക്ഷകരിലേക്കുള്ള ദിശയായി പ്രകടമാക്കുന്നു.
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: ശക്തിപ്രവൃത്തികളാലും അത്ഭുതങ്ങളാലും അടയാളങ്ങളാലും
  rationale: δύναμις എന്നതിലെ ശക്തിയുടെ ആശയം ‘ശക്തിപ്രവൃത്തികൾ’ എന്ന് വ്യക്തമാക്കുകയും മൂന്ന് പദങ്ങളുള്ള ഗ്രീക്ക് നിര സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: ദൈവം അവനിലൂടെ ... ചെയ്ത
  rationale: ὁ θεός എന്ന കർത്താവിനെയും δι’ αὐτοῦ എന്ന മധ്യസ്ഥപ്രവർത്തനത്തെയും ഗ്രീക്കിലെ ബന്ധംപോലെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν μέσῳ ὑμῶν
  choice: നിങ്ങളുടെ മധ്യത്തിൽ
  rationale: ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന അർഥമുള്ള പ്രയോഗത്തിന്റെ സ്ഥലപരമായ ദൃശ്യത നിലനിർത്തുന്നു.
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: ഇതു നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ
  rationale: αὐτοί നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്ന് നിലനിർത്തുന്നു; ‘അറിയുന്നുവല്ലോ’ പങ്കിട്ട അറിവിലേക്കുള്ള വാക്യത്തിന്റെ അഭ്യർഥന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἄνδρα എന്ന പദത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാഷ
  choice: ‘ഒരു മനുഷ്യൻ’ എന്ന് മുഖ്യപാഠത്തിൽ നിലനിർത്തുക
  alternative: ‘ഒരാൾ’ എന്നോ ‘ഒരു വ്യക്തി’ എന്നോ മൃദൂകരിക്കുക
  rationale: ഗ്രീക്ക് പാഠം യേശുവിനെ വ്യക്തമായി ἄνδρα എന്നു വിളിക്കുന്നു. അത് യേശുവിന്റെ യഥാർഥ മനുഷ്യത്വത്തെ പ്രസ്താവിക്കുന്നു; പദം മൃദൂകരിക്കുന്നത് മൂലപാഠത്തിന്റെ പ്രസ്താവനയെ അനാവശ്യമായി മങ്ങിക്കും.
- issue: അത്ഭുതപ്രവൃത്തികളിലെ പ്രവർത്തകത്വം
  choice: ദൈവത്തെ പ്രവർത്തകനായും യേശുവിനെ മധ്യസ്ഥനായും വ്യക്തമാക്കുക
  alternative: യേശു തന്നെയാണ് അവ ചെയ്തതെന്ന തരത്തിൽ കർത്താവിനെ മാറ്റുക
  rationale: ὁ θεός വ്യാകരണപരമായി കർത്താവും δι’ αὐτοῦ യേശുവിലൂടെയുള്ള പ്രവർത്തനവും ആണ്. പുതിയനിയമത്തിലെ വിശാലമായ ക്രിസ്തുശാസ്ത്രത്തെ ഇവിടെ ചേർത്ത് ഈ വാക്യത്തിന്റെ സ്വന്തം ഊന്നൽ മാറ്റുന്നില്ല.
- issue: ἀποδεδειγμένον എന്നതിന്റെ അർഥപരിധി
  choice: ‘സാക്ഷ്യപ്പെടുത്തിയ’
  alternative: ‘അംഗീകരിച്ച’ അല്ലെങ്കിൽ ‘തെളിയിച്ച’
  rationale: ഇവിടെ ദൈവം പ്രവൃത്തികളിലൂടെ യേശുവിന്റെ വ്യക്തിത്വത്തെയും ദൗത്യത്തെയും പരസ്യമായി സ്ഥിരീകരിക്കുന്ന ആശയം വരുന്നു. ‘അംഗീകരിച്ച’ എന്നത് വെറും അനുമോദനമായി തെറ്റിദ്ധരിക്കാം; ‘തെളിയിച്ച’ എന്നത് എന്താണ് തെളിയിച്ചതെന്നത് പാഠത്തേക്കാൾ നിർണ്ണയിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ള പൊതുവായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമം ഉപയോഗിച്ചു. ‘നിങ്ങൾക്കു’ എന്നും ‘നിങ്ങളുടെ മധ്യത്തിൽ’ എന്നും വേർതിരിച്ച് εἰς ὑμᾶς, ἐν μέσῳ ὑμῶν എന്നീ വ്യത്യസ്ത പ്രയോഗങ്ങൾ സംരക്ഷിച്ചു.
