- from: 'ഇസ്രായേൽപുരുഷന്മാരേ, ഈ വാക്കുകൾ കേൾക്കുക: നസറായനായ യേശു—ദൈവം അവനിലൂടെ നിങ്ങളുടെ മധ്യത്തിൽ ചെയ്ത ശക്തിപ്രവൃത്തികളാലും അത്ഭുതങ്ങളാലും അടയാളങ്ങളാലും ദൈവം നിങ്ങൾക്കു സാക്ഷ്യപ്പെടുത്തിയ ഒരു മനുഷ്യൻ; ഇതു നിങ്ങൾതന്നെ അറിയുന്നുവല്ലോ—'
  to: 'ഇസ്രായേൽജനതയിലെ പുരുഷന്മാരേ, ഈ വാക്കുകൾ കേൾക്കുക: നസറായനായ യേശു—ദൈവം അവനിലൂടെ നിങ്ങളുടെ മധ്യത്തിൽ ചെയ്ത ശക്തിപ്രവൃത്തികളാലും അത്ഭുതങ്ങളാലും അടയാളങ്ങളാലും ദൈവം നിങ്ങൾക്കു സാക്ഷ്യപ്പെടുത്തിയ ഒരു മനുഷ്യൻ—നിങ്ങൾതന്നെ അറിയുന്നതുപോലെ—'
