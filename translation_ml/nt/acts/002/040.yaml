revisions:
- from: 'മറ്റു പല വാക്കുകളാലും അവൻ അവരോടു ഗൗരവമായി സാക്ഷ്യം പറയുകയും വീണ്ടുംവീണ്ടും പ്രബോധിപ്പിക്കുകയും ചെയ്തു: “ഈ വക്രമായ തലമുറയിൽനിന്നു രക്ഷിക്കപ്പെടുവിൻ[a].”'
  to: മറ്റു പല വാക്കുകളാലും അവൻ അവരോടു ഗൗരവമായി സാക്ഷ്യപ്പെടുത്തുകയും, “ഈ വക്രമായ തലമുറയിൽനിന്ന് രക്ഷിക്കപ്പെടുവിൻ” എന്നു പറഞ്ഞ് അവരെ പ്രേരിപ്പിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തു.[a]
  rationale: The revision replaces an instructional verb with an ongoing exhortative expression that better represents παρεκάλει and its imperfect aspect. It retains the source’s passive imperative, its solemn testimony language, and its moral metaphor. The footnote continues to identify the alternative active/reflexive rendering without resolving the source text’s agency tension.
