id: ACT.2.40
reference: Acts 2:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: ml
  text: മറ്റു പല വാക്കുകളാലും അവൻ അവരോടു ഗൗരവമായി സാക്ഷ്യപ്പെടുത്തുകയും, “ഈ വക്രമായ തലമുറയിൽനിന്ന് രക്ഷിക്കപ്പെടുവിൻ” എന്നു പറഞ്ഞ് അവരെ പ്രേരിപ്പിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ വക്രമായ തലമുറയിൽനിന്ന് നിങ്ങളെത്തന്നെ രക്ഷിക്കുവിൻ.” ഗ്രീക്കിലെ ക്രിയ കർമണി രൂപത്തിലാണ് (“രക്ഷിക്കപ്പെടുവിൻ”); എന്നാൽ ശ്രോതാക്കൾ പ്രതികരിക്കേണ്ടതുണ്ടെന്ന ആശയം പ്രകടമാക്കാൻ ചില പരിഭാഷകൾ അതിനെ കൂടുതൽ കർത്തരിപ്രധാനമായി നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: മറ്റു പല വാക്കുകളാലും
  rationale: ἑτέροις എന്നതിലെ ‘മറ്റു’ എന്നും πλείοσιν എന്നതിലെ ‘പല’ എന്നും നിലനിർത്തി, ദത്തിവ് പ്രയോഗത്തിന്റെ ഉപകരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: διεμαρτύρατο
  choice: ഗൗരവമായി സാക്ഷ്യം പറയുകയും ചെയ്തു
  rationale: διαμαρτύρομαι എന്ന ക്രിയയുടെ ഊന്നലോടെയും ഗൗരവത്തോടെയുമുള്ള സാക്ഷ്യപ്പെടുത്തൽ എന്ന ഭാവം നിലനിർത്തുന്നു; അതിനെ വെറും മുന്നറിയിപ്പായി ചുരുക്കുന്നില്ല.
- source_word: παρεκάλει
  choice: വീണ്ടുംവീണ്ടും പ്രബോധിപ്പിക്കുകയും ചെയ്തു
  rationale: അപൂർണ ഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയോ ആവർത്തനമോ ‘വീണ്ടുംവീണ്ടും’ കൊണ്ട് വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിലെ അഭ്യർഥനാപൂർവമായ ശക്തി ‘പ്രബോധിപ്പിച്ചു’ നൽകുന്നു.
- source_word: αὐτοὺς
  choice: അവരോടു
  rationale: പത്രോസിന്റെ ശ്രോതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ ‘സാക്ഷ്യം പറയുക/പ്രബോധിപ്പിക്കുക’ എന്നീ പ്രയോഗങ്ങളോടു സ്വാഭാവികമായി ചേരാൻ കർമസംബന്ധം ‘അവരോടു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: Σώθητε
  choice: രക്ഷിക്കപ്പെടുവിൻ
  rationale: σῴζω എന്ന ക്രിയയുടെ ഏറിസ്റ്റ് കർമണി ആജ്ഞാരൂപം നിലനിർത്തുന്നു. ആഹ്വാനത്തിന്റെ ശക്തിയും രക്ഷയിൽ മനുഷ്യൻ സ്വതന്ത്ര കർത്താവാണെന്ന അധിക അർഥം വരാതിരിക്കുന്നതും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ
  choice: നിന്നു
  rationale: വേർപാടിനെ സൂചിപ്പിക്കുന്ന ἀπόയുടെ സ്വാഭാവിക മലയാള സമാനരൂപം.
- source_word: γενεᾶς
  choice: തലമുറ
  rationale: γενεάയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും സമകാലിക ജനസമൂഹത്തെ സൂചിപ്പിക്കാവുന്ന ബൈബിൾപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: σκολιᾶς
  choice: വക്രമായ
  rationale: σκολιός എന്ന പദത്തിന്റെ വളഞ്ഞത്/നേരല്ലാത്തത് എന്ന നൈതിക രൂപകം നിലനിർത്തുന്ന, dignified modern Malayalam rendering.
theological_decisions:
- issue: Σώθητε എന്നതിലെ കർമണിപ്രയോഗവും പ്രവർത്തകത്വവും
  choice: രക്ഷിക്കപ്പെടുവിൻ
  alternative: ഈ വക്രമായ തലമുറയിൽനിന്നു നിങ്ങളെത്തന്നെ രക്ഷിക്കുവിൻ
  rationale: ഗ്രീക്കിലെ കർമണി ആജ്ഞാരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു; അതേസമയം ആജ്ഞയായതിനാൽ ശ്രോതാക്കൾ പ്രതികരിക്കണമെന്ന യഥാർഥ ആഹ്വാനവും നിലനിൽക്കുന്നു. സ്വയംരക്ഷയെക്കുറിച്ചുള്ള ശക്തമായ നിഗമനം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘രക്ഷിക്കപ്പെടുവിൻ’ എന്നത് ഇന്നത്തെ സാധാരണ സംഭാഷണത്തേക്കാൾ ഉയർന്ന രജിസ്റ്ററിലുള്ളതാണെങ്കിലും തിരുവെഴുത്തിലെ ബഹുവചന ആജ്ഞയുടെ ഭാവവും കർമണിരൂപവും സംക്ഷിപ്തമായി സൂക്ഷിക്കുന്നു. ‘വീണ്ടുംവീണ്ടും’ അപൂർണ ഭൂതകാലത്തിന്റെ ആവർത്തനഭാവം വ്യക്തമാക്കുന്നു.
