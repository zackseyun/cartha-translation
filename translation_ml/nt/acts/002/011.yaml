source:
  edition: SBLGNT
  text: Ἰουδαῖοί τε καὶ προσήλυτοι, Κρῆτες καὶ Ἄραβες, ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις τὰ μεγαλεῖα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/011.yaml
  text: both Jews and proselytes[a], Cretans and Arabs—we hear them speaking in our own languages the mighty works of God.
translation:
  language: ml
  text: യെഹൂദന്മാരും യെഹൂദമതം സ്വീകരിച്ചവരും, ക്രേത്യരും അറബികളും—ദൈവത്തിന്റെ മഹത്തായ പ്രവൃത്തികൾ അവർ നമ്മുടെ സ്വന്തം ഭാഷകളിൽ[a] പറയുന്നതു നാം കേൾക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാവുകളിൽ.’ ഗ്രീക്ക് പദത്തിന് ‘നാവുകൾ’ എന്നും ‘ഭാഷകൾ’ എന്നും അർഥമാകാം; ഇവിടെ തിരിച്ചറിയാവുന്ന മനുഷ്യഭാഷകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: യെഹൂദന്മാർ
  rationale: ഇവിടെ യെഹൂദ്യദേശവാസികളെ മാത്രം അല്ല, ചിതറിപ്പാർക്കുന്ന യെഹൂദജനതയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τε καὶ
  choice: …ഉം …ഉം
  rationale: യെഹൂദന്മാരെയും യെഹൂദമതം സ്വീകരിച്ചവരെയും ഒരു ജോടിയായി ബന്ധിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പരസ്പരബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προσήλυτοι
  choice: യെഹൂദമതം സ്വീകരിച്ചവർ
  rationale: യെഹൂദരല്ലാത്തവരിൽനിന്ന് യെഹൂദമതത്തിലേക്കു ചേർന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പ്രയോഗമാണിത്.
- source_word: Κρῆτες
  choice: ക്രേത്യർ
  rationale: ക്രേത്ത് ദ്വീപിലെ ജനങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ മലയാള രൂപം.
- source_word: Ἄραβες
  choice: അറബികൾ
  rationale: ആധുനിക മലയാളത്തിൽ അറബ് ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: ἀκούομεν
  choice: നാം കേൾക്കുന്നു
  rationale: സംസാരിക്കുന്നവർ നേരിട്ട് അനുഭവിക്കുന്ന വർത്തമാനകാല സംഭവത്തെ ലളിതമായ വർത്തമാനകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: λαλούντων αὐτῶν
  choice: അവർ … സംസാരിക്കുന്നതു
  rationale: ἀκούομεν എന്ന ക്രിയയ്ക്കുശേഷമുള്ള ഗ്രീക്ക് കൃതന്തഘടനയെ സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ പുനരാവിഷ്കരിക്കുന്നു; λαλούντων എന്നതിന്റെ പൊതുവായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: നമ്മുടെ സ്വന്തം ഭാഷകളിൽ
  rationale: ἡμετέραις നൽകുന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ γλώσσαις ജനങ്ങൾ തിരിച്ചറിയുന്ന മനുഷ്യഭാഷകളെ സൂചിപ്പിക്കുന്നു.
- source_word: τὰ μεγαλεῖα
  choice: മഹാപ്രവൃത്തികൾ
  rationale: ദൈവത്തിന്റെ മഹത്തും ശക്തവുമായ പ്രവൃത്തികളെ ചുരുക്കമായും ഗൗരവത്തോടെയും സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഈ മഹാപ്രവൃത്തികൾ ദൈവത്തിന്റേതാണെന്നും ദൈവം ചെയ്തവയാണെന്നും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: പെന്തെക്കൊസ്ത് സന്ദർഭത്തിലെ γλώσσαις എന്ന പദത്തിന്റെ അർഥം
  choice: തിരിച്ചറിയാവുന്ന മനുഷ്യഭാഷകൾ
  alternative: മാനുഷികമല്ലാത്ത വിധത്തിലുള്ള ആത്മാവേശ ഉച്ചാരണങ്ങൾ അഥവാ ‘നാവുകൾ’
  rationale: പല ജനവിഭാഗങ്ങളിൽപ്പെട്ടവർ തങ്ങളുടെ സ്വന്തം ഭാഷകളിൽ കേൾക്കുന്നു എന്നതാണ് തൊട്ടടുത്ത സന്ദർഭത്തിന്റെ ഊന്നൽ. അതിനാൽ ‘ഭാഷകൾ’ എന്ന പരിഭാഷ ആഖ്യാനത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; അതേസമയം പദത്തിന്റെ അക്ഷരാർഥപരമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മതപരിവർത്തിതർ’ എന്ന സാങ്കേതിക പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘യെഹൂദമതം സ്വീകരിച്ചവർ’ ഉപയോഗിച്ചു. ഇംഗ്ലീഷ് മാതൃകയിൽ അടിക്കുറിപ്പ് ചിഹ്നം ‘proselytes’ എന്നതിനുശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ ഉള്ളടക്കം γλώσσαις എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ‘ഭാഷകളിൽ’ എന്നതിനുശേഷം ചേർത്തു.
