revisions:
- from: 'ദാവീദ് സ്വർഗങ്ങളിലേക്ക് കയറിപ്പോയിട്ടില്ലല്ലോ. എന്നാൽ അദ്ദേഹംതന്നെ പറയുന്നു: “കർത്താവ് എന്റെ കർത്താവിനോട് അരുളിച്ചെയ്തു: ‘ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദപീഠമാക്കുന്നതുവരെ എന്റെ വലതുഭാഗത്ത് ഇരിക്കുക.’”[a]'
