id: ACT.2.34
reference: Acts 2:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: ml
  text: 'ദാവീദ് സ്വർഗങ്ങളിലേക്കു കയറിച്ചെന്നിട്ടില്ല; എന്നാൽ അദ്ദേഹംതന്നെ പറയുന്നു: “കർത്താവ് എന്റെ കർത്താവിനോടു അരുളിച്ചെയ്തു: ‘എന്റെ വലതുഭാഗത്ത് ഇരിക്കുക.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സങ്കീർത്തനം 110:1. എബ്രായപാഠത്തിൽ ആദ്യത്തെ ‘കർത്താവ്’ ദൈവനാമമായ YHWH-നെ സൂചിപ്പിക്കുന്നു; ‘യഹോവ എന്റെ കർത്താവിനോടു അരുളിച്ചെയ്തു’ എന്ന രൂപവുമായി താരതമ്യം ചെയ്യുക.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: കയറിപ്പോയിട്ടില്ല
  rationale: സ്വർഗത്തിലേക്കുള്ള ആരോഹണം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിന് യോജിച്ച ഭൂതകാല നിഷേധവും നിലനിർത്തുന്നു.
- source_word: τοὺς οὐρανούς
  choice: സ്വർഗങ്ങളിലേക്ക്
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തുന്നു; തിരുവെഴുത്തിലെ ഭാഷാശൈലിയോടും യോജിക്കുന്നു.
- source_word: λέγει δὲ αὐτός
  choice: എന്നാൽ അദ്ദേഹംതന്നെ പറയുന്നു
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യം ‘എന്നാൽ’ എന്നും αὐτός നൽകുന്ന ഊന്നൽ ‘അദ്ദേഹംതന്നെ’ എന്നും പ്രകടമാക്കുന്നു; ഉദ്ധരണി അവതരിപ്പിക്കുന്ന വർത്തമാനകാലവും നിലനിർത്തുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ഗ്രീക്കിലെ κύριος എന്ന പദത്തെ പ്രധാന പാഠത്തിൽ പതിവായ മലയാള ബൈബിൾ പദമായ ‘കർത്താവ്’ എന്നു നൽകുന്നു; എബ്രായപശ്ചാത്തലത്തിലെ ദൈവനാമം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ κυρίῳ μου
  choice: എന്റെ കർത്താവിനോട്
  rationale: രണ്ടാമത്തെ κύριος-നെയും ഒരേ പദംകൊണ്ട് പരിഭാഷപ്പെടുത്തി ഗ്രീക്ക് പാഠത്തിലെ ആവർത്തനവും പത്രോസിന്റെ വാദത്തിലെ മിശിഹാസംബന്ധിയായ ഭാവവും നിലനിർത്തുന്നു.
- source_word: Κάθου
  choice: ഇരിക്കുക
  rationale: സിംഹാസനാരോഹണ കല്പനയുടെ നേരിട്ടുള്ള സ്വഭാവം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ δεξιῶν μου
  choice: എന്റെ വലതുഭാഗത്ത്
  rationale: ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള സമാനപദപ്രയോഗമാണിത്.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ലെ രണ്ട് κύριος പദങ്ങളുടെ പരിഭാഷ
  choice: 'പ്രധാന പാഠത്തിൽ രണ്ടിടത്തും ‘കർത്താവ്’: ‘കർത്താവ് എന്റെ കർത്താവിനോട്’'
  alternative: ആദ്യത്തേത് എബ്രായ ദൈവനാമത്തെ പ്രതിഫലിപ്പിച്ച് ‘യഹോവ എന്റെ കർത്താവിനോട്’ എന്നു നൽകുക
  rationale: ഇവിടെ നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മൂലപാഠം രണ്ടിടത്തും κύριος ഉപയോഗിക്കുന്നതിനാൽ പ്രധാന പാഠം ആ രൂപം പിന്തുടരുന്നു. എന്നാൽ സങ്കീർത്തനം 110:1-ന്റെ എബ്രായപാഠത്തിൽ ആദ്യത്തേത് YHWH ആണെന്ന പ്രധാന പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. ഗ്രീക്കിലെ ബഹുവചനമായ ‘സ്വർഗങ്ങൾ,’ αὐτός-ന്റെ ഊന്നൽ, κύριος എന്ന പദത്തിന്റെ ഇരട്ടപ്രയോഗം എന്നിവ നിലനിർത്തി.
