id: ACT.2.18
reference: Acts 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: ml
  text: ആ നാളുകളിൽ എന്റെ ആൺ അടിമകളുടെയും പെൺ അടിമകളുടെയും മേൽ പോലും ഞാൻ എന്റെ ആത്മാവിൽനിന്ന് ചൊരിയും; അവർ പ്രവചിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί γε
  choice: മേൽപോലും
  rationale: മുൻവാക്യത്തിലെ വാഗ്ദാനം സമൂഹത്തിൽ താഴ്ന്ന നിലയിലുള്ളവരിലേക്കുപോലും വ്യാപിക്കുന്നു എന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: എന്റെ ആൺ അടിമകളുടെയും പെൺ അടിമകളുടെയും മേൽ
  rationale: δοῦλος/δούλη എന്ന പദങ്ങളിലെ അടിമസ്ഥിതിയും ഗ്രീക്കിലുള്ള പുരുഷ-സ്ത്രീ വേർതിരിവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: ആ നാളുകളിൽ
  rationale: കാലസൂചനയും നിർദേശകത്തിന്റെ ഊന്നലും ലളിതവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: ἐκχεῶ
  choice: ചൊരിയും
  rationale: സമൃദ്ധമായി പകരുന്നതിന്റെ ദ്രവരൂപകം നിലനിർത്തുന്ന ഭാവികാലപ്രയോഗം.
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: എന്റെ ആത്മാവിൽനിന്ന്
  rationale: ἀπό എന്ന ഗ്രീക്ക് മുൻപ്രത്യയത്തിന്റെ ‘നിന്ന്’ എന്ന അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘എന്റെ ആത്മാവിനെ’ എന്ന് മാറ്റി മൂലപാഠത്തിലെ സൂക്ഷ്മത ഇല്ലാതാക്കുന്നില്ല.
- source_word: προφητεύσουσιν
  choice: അവർ പ്രവചിക്കും
  rationale: ക്രിയയുടെ ഭാവികാലവും പ്രവചനപ്രവർത്തനവും ചുരുക്കമായും വ്യക്തമായും പകരുന്നു.
theological_decisions:
- issue: δοῦλος/δούλη എന്നതിലെ സാമൂഹിക നില
  choice: ആൺ അടിമകൾ / പെൺ അടിമകൾ
  alternative: ദാസന്മാർ / ദാസികൾ; ആൺ വേലക്കാർ / പെൺ വേലക്കാർ
  rationale: ഇവിടെ ഇരുപാലിലുമുള്ള അടിമകളെ പ്രത്യേകം പറയുന്നത് ദൈവത്തിന്റെ ആത്മദാനം താഴ്ന്ന സാമൂഹിക നിലയിലുള്ളവരിലേക്കും വ്യാപിക്കുന്നു എന്ന ആശ്ചര്യകരമായ ഊന്നൽ നൽകുന്നു. ‘അടിമ’ ആ ശക്തി വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- issue: ἀπὸ τοῦ πνεύματός μου എന്ന ഭാഗികമോ ഉറവിടസൂചകമോ ആയ പ്രയോഗം
  choice: എന്റെ ആത്മാവിൽനിന്ന്
  alternative: എന്റെ ആത്മാവിനെ; എന്റെ ആത്മാവിൽ ഒരു ഭാഗം
  rationale: ‘നിന്ന്’ എന്ന മൂലപാഠരൂപം നിലനിർത്തി, ഇത് ആത്മാവിന്റെ ഒരു ഭാഗത്തെക്കുറിച്ചുള്ള സാങ്കേതിക ദൈവശാസ്ത്രപ്രസ്താവനയാണോ ഉറവിടം സൂചിപ്പിക്കുന്ന രൂപകമാണോ എന്നു നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആൺ അടിമകൾ / പെൺ അടിമകൾ’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്നതും ഗ്രീക്കിലെ ലിംഗവ്യത്യാസവും സാമൂഹിക ഊന്നലും ഒരുമിച്ച് സൂക്ഷിക്കുന്നതുമാണ്. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും ‘മേൽ’, ‘നിന്ന്’ എന്നീ ബന്ധങ്ങൾ മൂലപാഠാനുസൃതമായി നിലനിർത്തി.
