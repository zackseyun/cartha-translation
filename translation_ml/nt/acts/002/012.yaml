translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിസ്മയിച്ചും ആശയക്കുഴപ്പത്തിലായും’ എന്ന ഇരട്ടപ്രയോഗം മൂലത്തിലെ രണ്ട് വ്യത്യസ്ത പ്രതികരണങ്ങളും നിലനിർത്തുന്നു; ചോദ്യം സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകിയിരിക്കുന്നു.
