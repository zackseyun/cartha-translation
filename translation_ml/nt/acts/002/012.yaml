  terminology: “വിസ്മയം,” “ആശയക്കുഴപ്പം,” and “അർഥം” are clear, neutral modern Malayalam choices. The footnote’s closer rendering is adjusted so that it is grammatical Malayalam while explicitly identifying it as a more literal form.
