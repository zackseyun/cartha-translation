  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες καὶ ⸀διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες· Τί ⸀θέλει τοῦτο εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: ml
  text: 'അവരെല്ലാവരും വിസ്മയത്തിലും ആശയക്കുഴപ്പത്തിലും ആയിരുന്നു; അവർ പരസ്പരം ചോദിച്ചു: “ഇതിന്റെ അർഥം എന്താണ്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “ഇത് എന്തായിരിക്കാൻ ഉദ്ദേശിക്കുന്നത്?” ഈ പ്രയോഗം “ഇതിന്റെ അർഥം എന്താണ്?” അല്ലെങ്കിൽ “ഇതിന്റെ പ്രാധാന്യം എന്താണ്?” എന്ന അർഥത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: വിസ്മയിച്ചും
  rationale: തുടർന്നുനിന്ന അമ്പരപ്പിന്റെയും വിസ്മയത്തിന്റെയും അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ അത് അസംയോജകമായി സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: സന്ദർഭത്തിൽനിന്നുള്ള കർത്താവിനെ വ്യക്തമാക്കുകയും πάντες എന്ന പദത്തിന്റെ സമഗ്രത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διηπόρουν
  choice: ആശയക്കുഴപ്പത്തിലായും
  rationale: എന്തു മനസ്സിലാക്കണമെന്നറിയാതെ കുഴങ്ങിയ തുടർച്ചയായ അവസ്ഥയെ വ്യക്തമാക്കുന്നു.
- source_word: ἄλλος πρὸς ἄλλον
  choice: പരസ്പരം
  rationale: ഗ്രീക്കിലെ പരസ്പരപ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപമാണ്.
- source_word: λέγοντες
  choice: ചോദിച്ചു
  rationale: പങ്കുവെച്ച വാക്കുകൾ നേരിട്ടുള്ള ചോദ്യമായതിനാൽ മലയാളത്തിൽ ‘ചോദിച്ചു’ എന്നത് പ്രസംഗക്രിയയുടെ പ്രവർത്തനം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: ഇതിന്റെ അർഥം എന്താണ്?
  rationale: τί θέλει + infinitive എന്ന പ്രയോഗം സംഭവത്തിന്റെ അർഥമോ പ്രാധാന്യമോ അന്വേഷിക്കുന്ന ഇടിയമാണ്; പദാനുപദരൂപത്തേക്കാൾ ഈ വിവർത്തനം മലയാളത്തിൽ അർഥം കൃത്യമായി നൽകുന്നു.
