  source_fidelity: 'മൂലഗ്രീക്കിലെ പ്രധാന ഘടകങ്ങൾ കൃത്യമായി സംരക്ഷിച്ചിരിക്കുന്നു: യെരൂശലേമിൽ വസിച്ചിരുന്ന യെഹൂദന്മാർ, അവർ ഭക്തരായ പുരുഷന്മാർ, അവർ ആകാശത്തിൻ കീഴിലെ എല്ലാ ജനതകളിൽനിന്നുമുള്ളവർ എന്ന വിവരണം. δέ-യുടെ മൃദുവായ ആഖ്യാനബന്ധം അനാവശ്യമായ ഒരു മലയാള ബന്ധകമില്ലാതെ സ്വാഭാവികമായി കൈകാര്യം ചെയ്തിരിക്കുന്നു.'
