id: ACT.2.5
reference: Acts 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸀ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: ml
  text: യെരൂശലേമിൽ യെഹൂദന്മാർ[a] താമസിച്ചിരുന്നു—ആകാശത്തിൻ കീഴിലുള്ള[b] എല്ലാ ജനതകളിൽനിന്നുമുള്ള ഭക്തരായ പുരുഷന്മാർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘യെഹൂദ്യർ’; എന്നാൽ ഇവർ ആകാശത്തിൻ കീഴിലുള്ള എല്ലാ ജനതകളിൽനിന്നുമുള്ളവർ എന്നു പറയുന്നതിനാൽ ഇവിടെ വിശാലമായ വംശീയ-മതപരമായ അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘ആകാശത്തിൻ കീഴിലുള്ള’ എന്നത് ‘ലോകമെങ്ങുമുള്ള’ എന്നർഥം നൽകുന്ന ഒരു ബൈബിൾ ശൈലിപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: താമസിച്ചിരുന്നു
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അനാവശ്യമായ ‘എന്നാൽ’ അല്ലെങ്കിൽ കാലസൂചകമായ ‘അപ്പോൾ’ ചേർക്കാതെ വാക്യപ്രവാഹത്തിലൂടെ ആ ബന്ധം പ്രകടമാക്കുന്നു.
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: യെരൂശലേമിൽ … താമസിച്ചിരുന്നു
  rationale: κατοικοῦντες ഒരു സ്ഥലത്ത് വസിച്ചിരിക്കുക എന്ന നിലനിൽക്കുന്ന അർഥം നൽകുന്നു; താത്കാലികമായി തങ്ങുക എന്ന ധ്വനി ഒഴിവാക്കാൻ ‘താമസിച്ചിരുന്നു’ തെരഞ്ഞെടുത്തു.
- source_word: Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: എല്ലാ ജനതകളിൽനിന്നുമുള്ളവർ എന്നു തുടർന്നു പറയുന്നതിനാൽ, പ്രാദേശികമായ ‘യെഹൂദ്യർ’ എന്നതിനേക്കാൾ വിശാലമായ വംശീയ-മതപരമായ അർഥമാണ് സന്ദർഭത്തിന് യോജിക്കുന്നത്.
- source_word: ἄνδρες εὐλαβεῖς
  choice: ഭക്തരായ പുരുഷന്മാർ
  rationale: ἄνδρες എന്ന നിർദിഷ്ട പുരുഷലിംഗപദവും εὐλαβεῖς സൂചിപ്പിക്കുന്ന ദൈവഭക്തിയും ആദരപൂർവമായ ജീവിതവും നിലനിർത്തുന്നു.
- source_word: ἀπὸ παντὸς ἔθνους
  choice: എല്ലാ ജനതകളിൽനിന്നുമുള്ള
  rationale: ἔθνος ഇവിടെ ലോകത്തിലെ ജനതകളെ ഭൂമിശാസ്ത്രപരവും വംശീയവുമായ അർഥത്തിൽ സൂചിപ്പിക്കുന്നു; ‘ജനത’ ആ വ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: ആകാശത്തിൻ കീഴിലുള്ള
  rationale: ലോകമെങ്ങുമുള്ള എന്ന അർഥമുള്ള ബൈബിൾ ശൈലിപ്രയോഗം അതിന്റെ രൂപകഭാവത്തോടുകൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Ἰουδαῖοι എന്ന പദത്തിന്റെ അർഥം
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദ്യർ
  rationale: ഇവർ ‘എല്ലാ ജനതകളിൽനിന്നും’ വന്നവരാണെന്ന സന്ദർഭം യെഹൂദ്യ പ്രദേശവാസികൾ എന്ന ഇടുങ്ങിയ അർഥത്തേക്കാൾ പ്രവാസികളുൾപ്പെടുന്ന വംശീയ-മതപരമായ അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- issue: ἄνδρες എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ
  rationale: മൂലപദം പൊതുവായ മനുഷ്യരെ സൂചിപ്പിക്കുന്ന പദമല്ല, വ്യക്തമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നതിനാൽ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ അനുബന്ധവിവരണത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ദീർഘവിരാമം ഉപയോഗിച്ചിരിക്കുന്നു; അനാവശ്യമായ കാലസൂചകമോ ശക്തമായ വൈരുധ്യബന്ധകമോ ചേർത്തിട്ടില്ല.
