reference: Acts 2:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്ക് ഉയർത്തപ്പെട്ട്[a], പിതാവിൽനിന്ന് പരിശുദ്ധാത്മാവിന്റെ വാഗ്ദാനം[b] സ്വീകരിച്ച അവൻ, നിങ്ങൾതന്നെ കാണുകയും കേൾക്കുകയും ചെയ്യുന്ന ഇത് ചൊരിഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ വലങ്കൈയാൽ ഉയർത്തപ്പെട്ട്.’ ഗ്രീക്ക് ദത്തിവ് ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്കുള്ള ഉയർത്തലിനെയോ ദൈവത്തിന്റെ വലങ്കൈയാൽ സംഭവിച്ച ഉയർത്തലിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഇത് ‘വാഗ്ദാനം ചെയ്യപ്പെട്ട പരിശുദ്ധാത്മാവ്’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പ്രയോഗം ആത്മാവുതന്നെ വാഗ്ദാനം ചെയ്യപ്പെട്ട ദാനമാണെന്നോ ആത്മാവിനെക്കുറിച്ചുള്ള വാഗ്ദാനമാണെന്നോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്ക്
  rationale: ദത്തിവ് ഇവിടെ സ്ഥാനസൂചകമായോ കാരണോപാധിസൂചകമായോ ഗ്രഹിക്കാം. തുടർന്നുള്ള സങ്കീർത്തനം 110-ലെ സിംഹാസനാരോഹണ പശ്ചാത്തലത്തിൽ സ്ഥാനസൂചക അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ യേശുവിന്റെ പുനരുത്ഥാനവും ദാവീദിന്റെ പ്രവചനവും അടിസ്ഥാനമാക്കിയുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὑψωθεὶς
  choice: ഉയർത്തപ്പെട്ടിട്ട്
  rationale: ദൈവത്താൽ സംഭവിച്ച ഉയർത്തലിനെ സൂചിപ്പിക്കുന്ന ഏറിസ്റ്റ് കർമണിപ്രയോഗത്തിന്റെ മുൻകാലബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: പരിശുദ്ധാത്മാവിന്റെ വാഗ്ദാനം
  rationale: 'ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയുടെ യഥാർഥമായ അസന്ദിഗ്ധമല്ലാത്ത സ്വഭാവം നിലനിർത്തുന്നു: ഇത് ആത്മാവിനെ വാഗ്ദത്തദാനമായി സൂചിപ്പിക്കാമോ ആത്മാവിനെക്കുറിച്ചുള്ള വാഗ്ദാനമായി സൂചിപ്പിക്കാമോ എന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: പിതാവിൽനിന്ന് ... സ്വീകരിച്ച
  rationale: παρά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന ഉറവിടവും മുഖ്യക്രിയയ്ക്ക് മുമ്പുള്ള പ്രവൃത്തിയും നിലനിർത്തുന്നു.
- source_word: ἐξέχεεν
  choice: ചൊരിഞ്ഞിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോൾ ദൃശ്യവും ശ്രാവ്യവുമായ ഫലം മലയാളത്തിലെ പൂർത്തീകരണരൂപത്തിലൂടെ അറിയിക്കുന്നു.
- source_word: τοῦτο
  choice: ഇത്
  rationale: പ്രകടമായ ആത്മപകർച്ചയെ സന്ദർഭത്തിൽനിന്ന് തിരിച്ചറിയാൻ അനുവദിച്ചുകൊണ്ട് ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സൂചകസർവനാമം വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: നിങ്ങൾതന്നെ ഇപ്പോൾ കാണുകയും കേൾക്കുകയും ചെയ്യുന്ന
  rationale: പ്രകടമായ ὑμεῖς നൽകുന്ന ഊന്നൽ ‘നിങ്ങൾതന്നെ’ എന്നും, സന്ദർഭത്തിലെ തത്സമയ അനുഭവം ‘ഇപ്പോൾ’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τῇ δεξιᾷ τοῦ θεοῦ എന്നത് ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്കുള്ള ഉയർത്തലാണോ ദൈവത്തിന്റെ വലങ്കൈയാൽ സംഭവിച്ച ഉയർത്തലാണോ
  choice: ദൈവത്തിന്റെ വലത്തുഭാഗത്തേക്ക് ഉയർത്തപ്പെട്ടിട്ട്
  alternative: ദൈവത്തിന്റെ വലങ്കൈയാൽ ഉയർത്തപ്പെട്ടിട്ട്
  rationale: അടുത്ത സന്ദർഭത്തിലെ സങ്കീർത്തനം 110 ഉദ്ധരണിയും സിംഹാസനാരോഹണ ആശയവും സ്ഥാനസൂചക വായനയെ പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും ഗ്രീക്ക് ദത്തിവ് കാരണോപാധിസൂചക വായനയും അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου ആത്മാവുതന്നെ വാഗ്ദത്തദാനമാണെന്നോ ആത്മാവിനെക്കുറിച്ചുള്ള വാഗ്ദാനമെന്നോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: പരിശുദ്ധാത്മാവിന്റെ വാഗ്ദാനം
  alternative: വാഗ്ദാനം ചെയ്യപ്പെട്ട പരിശുദ്ധാത്മാവ്
  rationale: മൂലഭാഷയിലെ ജനിറ്റീവ് ഘടന ഇരു ബന്ധങ്ങളും അനുവദിക്കുന്നു. ‘ഇത് ചൊരിഞ്ഞിരിക്കുന്നു’ എന്ന തുടർവാക്യം ആത്മാവിനെ വാഗ്ദത്തദാനമായി ഗ്രഹിക്കാൻ ശക്തമായ പിന്തുണ നൽകുമ്പോഴും, മുഖ്യവാചകം രൂപപരമായ അനിശ്ചിതത്വം നിലനിർത്തുകയും അടിക്കുറിപ്പ് രണ്ടു സാധ്യതകളും വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വലത്തുഭാഗം’ സിംഹാസനാരോഹണത്തിന്റെ സ്ഥാനസൂചന സ്വാഭാവികമായി നൽകുന്നു; ‘ചൊരിഞ്ഞിരിക്കുന്നു’ പെന്തെക്കൊസ്തിലെ പ്രവൃത്തിയുടെയും ഇപ്പോഴുള്ള ഫലത്തിന്റെയും ബന്ധം നിലനിർത്തുന്നു.
