reference: Acts 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθε τὸ πλῆθος καὶ συνεχύθη, ὅτι ⸀ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: ml
  text: ഈ ശബ്ദം ഉണ്ടായപ്പോൾ ജനക്കൂട്ടം ഒരുമിച്ചുകൂടി; ഓരോരുത്തരും അവർ സംസാരിക്കുന്നത് അവരവരുടെ സ്വന്തം ഭാഷാഭേദത്തിൽ[a] കേട്ടുകൊണ്ടിരുന്നതിനാൽ ജനക്കൂട്ടം ആശയക്കുഴപ്പത്തിലായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവരവരുടെ സ്വന്തം ഭാഷയിൽ.’ ഗ്രീക്കിലെ പദത്തിന് വിശാലമായ അർഥത്തിൽ ‘ഭാഷ’ എന്നും അർഥമുണ്ടാകാം; എന്നാൽ ‘ഭാഷാഭേദം’ എന്നത് ലൂക്കോസ് ഉപയോഗിച്ച പദത്തിന്റെ പ്രത്യേകത കൂടുതൽ അടുത്തായി പകരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: ഈ ശബ്ദം ഉണ്ടായപ്പോൾ
  rationale: ജനനിർദ്ദേശക സമ്പൂർണപ്രയോഗം സമയസാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. φωνή ഇവിടെ പെന്തെക്കൊസ്തിലെ കേൾക്കാവുന്ന പ്രതിഭാസമായതിനാൽ, ‘ശബ്ദം’ എന്നത് ‘സ്വരം’ എന്നതിനെക്കാൾ സന്ദർഭോചിതവും അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമാണ്.
- source_word: δέ
  choice: വാക്യബന്ധത്തിലൂടെ പരോക്ഷമായി പ്രകടിപ്പിച്ചു
  rationale: δέ ഒരു മൃദുവായ ആഖ്യാനബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘അപ്പോൾ’ ചേർക്കാതെ തുടർച്ചയായ വാക്യക്രമം അതിന്റെ പ്രവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: συνῆλθε τὸ πλῆθος
  choice: ജനക്കൂട്ടം ഒരുമിച്ചുകൂടി
  rationale: συνέρχομαι ആളുകൾ ഒരിടത്തേക്ക് കൂടിവരുന്നതിനെ സൂചിപ്പിക്കുന്നു; πλῆθος വലിയൊരു ജനസമൂഹമാണ്. ഈ പ്രയോഗം ആ ചലനവും കൂട്ടായ്മയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνεχύθη
  choice: പരിഭ്രാന്തരായി
  rationale: നിഷ്ക്രിയരൂപത്തിലുള്ള συγχέω ആശയക്കുഴപ്പത്തിലാകുകയോ മനസ്സു കലങ്ങുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പരിഭ്രാന്തരായി’ അവരുടെ അമ്പരപ്പും ദിശാബോധക്കേടും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: ജനക്കൂട്ടം പരിഭ്രാന്തരായതിന്റെ കാരണം ഇതിന് പിന്നാലെ വരുന്നതാണെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἤκουον
  choice: കേട്ടുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം തുടരുന്ന കേൾവിപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കേട്ടു’ എന്നതിനെക്കാൾ ‘കേട്ടുകൊണ്ടിരുന്നു’ ആ ക്രിയാഭാവം കൃത്യമായി പകരുന്നു.
- source_word: εἷς ἕκαστος
  choice: ഓരോരുത്തരും
  rationale: ഓരോ വ്യക്തിയെയും വേർതിരിച്ചുകാട്ടുന്ന വിതരണാത്മക ഊന്നൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: അവരവരുടെ സ്വന്തം ഭാഷാഭേദത്തിൽ
  rationale: διάλεκτος ഒരു ഭാഷയെയോ പ്രാദേശിക ഭാഷാഭേദത്തെയോ സൂചിപ്പിക്കാം. ‘ഭാഷാഭേദം’ ലൂക്കോസിന്റെ പദതിരഞ്ഞെടുപ്പിലെ പ്രത്യേകത നിലനിർത്തുന്നു; ‘അവരവരുടെ സ്വന്തം’ എന്നത് ഏകവചന വിതരണാത്മക ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λαλούντων αὐτῶν
  choice: അവർ സംസാരിക്കുന്നത്
  rationale: മുൻസന്ദർഭത്തിലുള്ള സംസാരിക്കുന്നവരിലേക്കാണ് സർവനാമം വിരൽചൂണ്ടുന്നത്. ‘അവർ’ എന്ന് നിലനിർത്തുന്നത് ‘അപ്പൊസ്തലന്മാർ’ പോലുള്ള കൂടുതൽ പരിമിതമായ തിരിച്ചറിയൽ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: സംസാരിച്ചവരുടെ തിരിച്ചറിയൽ
  choice: അവർ സംസാരിക്കുന്നത്
  alternative: അപ്പൊസ്തലന്മാർ സംസാരിക്കുന്നത്
  rationale: αὐτῶν മുൻപ് പരാമർശിക്കപ്പെട്ടവരെ മാത്രം സൂചിപ്പിക്കുന്നു; ഈ വാക്യം തന്നിൽ അവരെ ‘അപ്പൊസ്തലന്മാർ’ എന്ന് ചുരുക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ സൂചനാത്മകത നിലനിർത്തി.
- issue: വിതരണാത്മക വ്യക്തിപ്രയോഗം
  choice: ഓരോരുത്തരും അവരവരുടെ സ്വന്തം ഭാഷാഭേദത്തിൽ
  alternative: ഓരോരുത്തരും സ്വന്തം ഭാഷാഭേദത്തിൽ
  rationale: ഗ്രീക്കിലെ εἷς ἕκαστος ... ἰδίᾳ എന്ന വ്യക്തിവിതരണ ഊന്നൽ മലയാളത്തിൽ വ്യക്തമായി പകരാൻ ‘അവരവരുടെ’ ഉപയോഗിച്ചു. മലയാളം ഇവിടെ ലിംഗം നിർബന്ധമായി അടയാളപ്പെടുത്താത്തതിനാൽ മൂലത്തിലെ വ്യാകരണലിംഗത്തെ അനാവശ്യമായി പുരുഷലിംഗമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി സ്വീകരിച്ചു. ‘കേട്ടുകൊണ്ടിരുന്നു’ എന്ന രൂപം ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം നിലനിർത്തുന്നു. ‘ജനക്കൂട്ടം ... പരിഭ്രാന്തരായി’ എന്ന അർഥസമ്മത ബഹുവചനപ്രയോഗം മലയാളത്തിൽ കൂട്ടത്തെ വ്യക്തികളുടെ സമൂഹമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
