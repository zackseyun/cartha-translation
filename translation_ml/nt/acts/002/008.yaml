  source_fidelity: The draft correctly conveys the astonished question, the distributive force of ἕκαστος with ἡμεῖς, and the sense of hearing the speakers. However, “ജനിച്ചുവളർന്ന നാട്ടിലെ” adds both upbringing and a geographic ‘land/place,’ neither of which is stated in ἐν ᾗ ἐγεννήθημεν. The source identifies the language/dialect by birth, not explicitly by the place where one grew up.
  naturalness: The revised wording is idiomatic modern standard Malayalam and retains the direct, astonished interrogative form. “ജന്മഭാഷ” naturally conveys the birth-associated language without introducing an unexpressed location.
  terminology: “സ്വന്തം ജന്മഭാഷ” appropriately represents τῇ ἰδίᾳ διαλέκτῳ ἡμῶν in the main text. The footnote preserves the viable lexical alternative “ഭാഷാഭേദം” and gives the relative clause more explicitly.
