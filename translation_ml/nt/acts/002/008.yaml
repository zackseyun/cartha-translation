reference: Acts 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/008.yaml
  text: And how is it that each of us hears in our own native language?[a]
translation:
  language: ml
  text: നാം ഓരോരുത്തരും നമ്മുടെ സ്വന്തം ജന്മഭാഷയിൽ ഇവർ സംസാരിക്കുന്നത് കേൾക്കുന്നതെങ്ങനെ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം ജനിച്ച നമ്മുടെ സ്വന്തം ഭാഷാഭേദത്തിൽ.”
    reason: διάλεκτος എന്ന പദത്തിന് ‘ഭാഷ’ എന്നും ‘ഭാഷാഭേദം’ എന്നും അർഥമാകാം; ഈ രൂപം ‘നാം ജനിച്ച’ എന്ന ബന്ധവാക്യം കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: πῶς
  choice: എങ്ങനെ?
  rationale: അതിശയത്തോടെയുള്ള ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἡμεῖς ... ἕκαστος
  choice: നാം ഓരോരുത്തരും
  rationale: ἡμεῖς എന്ന ഊന്നലും ἕκαστος എന്ന വ്യക്തിവിതരണ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἀκούομεν
  choice: കേൾക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ നേരിട്ടുള്ള അനുഭവം നിലനിർത്തുന്നു; മലയാളത്തിൽ സംസാരിക്കുന്നതു കേൾക്കുന്നു എന്ന ഘടന സന്ദർഭാർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: സ്വന്തം ഭാഷയിൽ
  rationale: ἰδίᾳയുടെ ‘സ്വന്തം’ എന്ന ഊന്നൽ സൂക്ഷിക്കുന്നു; διάλεκτος ഇവിടെ ഭാഷയെയോ പ്രാദേശിക ഭാഷാഭേദത്തെയോ സൂചിപ്പിക്കാം.
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: ജനിച്ചുവളർന്ന നാട്ടിലെ
  rationale: അക്ഷരാർഥം ‘അതിൽ നാം ജനിച്ചു’ എന്നാണ്; ഭാഷയോടുള്ള ജന്മദേശബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്ന optimal-equivalence പ്രയോഗമാണിത്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അതിശയചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; ‘ഭാഷ’/‘ഭാഷാഭേദം’ എന്ന യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
