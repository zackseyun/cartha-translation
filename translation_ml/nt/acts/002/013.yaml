id: ACT.2.13
reference: Acts 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕτεροι δὲ ⸀διαχλευάζοντες ἔλεγον ὅτι Γλεύκους μεμεστωμένοι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/013.yaml
  text: But others[a], mocking, were saying, “They are filled with sweet wine.”
translation:
  language: ml
  text: എന്നാൽ മറ്റു ചിലർ പരിഹസിച്ചുകൊണ്ട്, “ഇവർ മധുരവീഞ്ഞ്[a] കുടിച്ചു നിറഞ്ഞിരിക്കുന്നു” എന്നു പറഞ്ഞുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പുതുവീഞ്ഞ്.” ഗ്രീക്ക് പദം മധുരമുള്ള പുതിയ വീഞ്ഞിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: മറ്റു ചിലർ
  rationale: ജനക്കൂട്ടത്തിലെ വേറൊരു വിഭാഗത്തെയാണ് ഈ വിശേഷണം നാമമായി ഉപയോഗിച്ച് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘മറ്റു ചിലർ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിസ്മയത്തോടും ചോദ്യത്തോടും വിപരീതമായ പ്രതികരണമാണ് ഇവിടെ വരുന്നത്; അതിനാൽ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: διαχλευάζοντες
  choice: പരിഹസിച്ചുകൊണ്ട്
  rationale: അവഹേളനപരമായ പരിഹാസം സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ അർഥവും പ്രവർത്തനത്തിന്റെ പശ്ചാത്തലസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἔλεγον
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണഭൂതകാലരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ സംസാരത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: Γλεύκους
  choice: മധുരവീഞ്ഞ്
  rationale: γλεῦκος മധുരമുള്ള പുതിയ വീഞ്ഞിനെയോ മധുരവീഞ്ഞിനെയോ സൂചിപ്പിക്കുന്നു; വെറും കാലപ്പഴക്കമില്ലായ്മയെക്കാൾ അതിന്റെ മാധുര്യം വ്യക്തമാക്കുന്ന പരിഭാഷയാണിത്.
- source_word: μεμεστωμένοι εἰσίν
  choice: കുടിച്ചു നിറഞ്ഞിരിക്കുന്നു
  rationale: പാനീയംകൊണ്ട് നിറഞ്ഞ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൂർത്തികൃത കൃദന്തവും വർത്തമാന സഹായക്രിയയും ചേർന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘ലഹരിപിടിച്ചിരിക്കുന്നു’ എന്നു പറഞ്ഞ് ആരോപണത്തിന്റെ ഫലം അധികമായി വ്യാഖ്യാനിക്കുന്നതു ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പരിഹാസത്തിന്റെ സ്വരവും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാസ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു; പദശഃ അസ്വാഭാവികമായ ‘വീഞ്ഞുകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു’ എന്നതിനുപകരം മലയാളത്തിൽ ഗ്രാഹ്യമായ ‘കുടിച്ചു നിറഞ്ഞിരിക്കുന്നു’ ഉപയോഗിച്ചു.
