  text: οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/015.yaml
  text: For these are not drunk[a], as you suppose, for it is the third hour of the day.
translation:
  language: ml
  text: നിങ്ങൾ കരുതുന്നതുപോലെ ഇവർ മദ്യലഹരിയിലല്ല; കാരണം, ഇപ്പോൾ പകലിന്റെ മൂന്നാം മണിക്കൂറാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, യഹൂദരുടെ സമയഗണനപ്രകാരം രാവിലെ ഏകദേശം ഒൻപത് മണി.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ γὰρ
  choice: മദ്യപിച്ചിട്ടില്ല; കാരണം
  rationale: οὐ നിഷേധവും γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ ‘കാരണം’ രണ്ടാം ഉപവാക്യത്തിന്റെ യുക്തിപരമായ ബലം വ്യക്തമാക്കുന്നു.
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: നിങ്ങൾ കരുതുന്നതുപോലെ
  rationale: ὑπολαμβάνετε എന്നതിന്റെ ‘കരുതുക/ഊഹിക്കുക’ എന്ന അർഥവും ὑμεῖς സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὗτοι
  choice: ഇവർ
  rationale: വ്യക്തികളുടെ കൂട്ടത്തെ സൂചിപ്പിക്കുന്ന demonstrative സർവനാമത്തിന് നേരിട്ടുള്ള മലയാളരൂപം; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘പുരുഷന്മാർ’ തുടങ്ങിയ പദങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: μεθύουσιν
  choice: മദ്യപിച്ചിട്ടില്ല
  rationale: സന്ദർഭത്തിൽ ആരോപിക്കപ്പെടുന്ന മത്താവസ്ഥയെ സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നിഷേധം οὐ-യോടൊപ്പം ചേർത്തിരിക്കുന്നു.
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: കാരണം, ഇപ്പോൾ പകലിലെ മൂന്നാം മണിക്കൂറേ ആയിട്ടുള്ളൂ
  rationale: ആരോപണം തള്ളുന്നതിനുള്ള കാരണം നിലനിർത്തുന്നു. ‘മൂന്നാം മണിക്കൂർ’ എന്ന യഹൂദ സമയപ്രയോഗം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുകയും ‘ഏ’ ആരോപണത്തിന്റെ അസംഭാവ്യതയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὥρα τρίτη
  choice: മൂന്നാം മണിക്കൂർ
  rationale: മൂലത്തിലെ സമയഗണന ഔപചാരികമായി നിലനിർത്തുന്നു; ആധുനിക സമയതുല്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
