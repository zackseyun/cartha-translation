  text: ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/035.yaml
  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: ml
  text: ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്കു പാദപീഠമാക്കുന്നതുവരെ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഞാൻ നിന്റെ ശത്രുക്കളെ നിന്റെ പാദങ്ങൾക്കു പാദപീഠമായി വെക്കുന്നതുവരെ.’'
    reason: lexical_alternative
  - marker: b
    text: ഈ വരി രാജകീയവും മശീഹാപരവുമായ സിംഹാസനാരോഹണ സങ്കീർത്തനമായ സങ്കീർത്തനം 110:1-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: വരെ
  rationale: ഭാവിയിൽ സംഭവിക്കാനിരിക്കുന്ന ഒരു ഘട്ടംവരെയുള്ള കാലപരിധി സൂചിപ്പിക്കുന്നു; ‘ആക്കുന്നതുവരെ’ എന്ന ഘടന മലയാളത്തിൽ ഈ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θῶ
  choice: ആക്കുക
  rationale: τίθημι എന്നതിന് അക്ഷരാർഥത്തിൽ ‘വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും, ഇവിടെ predicate accusative-നോടൊപ്പം ‘പാദപീഠമാക്കുക’ എന്ന പ്രയോഗമാണ് മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവും.
- source_word: τοὺς ἐχθρούς σου
  choice: നിന്റെ ശത്രുക്കളെ
  rationale: വ്യക്തിപരവും രാജകീയ എതിർപ്പിനോടു ബന്ധപ്പെട്ടതുമായ അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ὑποπόδιον
  choice: പാദപീഠം
  rationale: കാലുകൾ വയ്ക്കുന്ന പീഠം എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തുകയും കീഴടക്കലിന്റെ രാജകീയ ദൃശ്യബിംബം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τῶν ποδῶν σου
  choice: നിന്റെ പാദങ്ങൾക്കുള്ള
  rationale: ഗ്രീക്കിലെ genitive ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘നിന്റെ പാദങ്ങൾക്കു കീഴിൽ’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായതിനാൽ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
theological_decisions:
- issue: സങ്കീർത്തനം 110:1-ലെ രാജകീയ കീഴടക്കൽരൂപകം
  choice: ‘നിന്റെ പാദങ്ങൾക്കുള്ള പാദപീഠം’ എന്ന മൂർത്തമായ രൂപകം നിലനിർത്തി.
  alternative: ‘നിന്റെ ശത്രുക്കളെ പൂർണമായി നിന്റെ കാൽക്കീഴിലാക്കുന്നതുവരെ.’
  rationale: ഇത് സങ്കീർത്തനം 110:1-ന്റെ ഉദ്ധരണിയായതിനാൽ മശീഹാപരവും സിംഹാസനാരോഹണപരവുമായ അന്തർപാഠബന്ധം വഹിക്കുന്നു. പരാജയം അല്ലെങ്കിൽ കീഴടക്കൽ എന്നു വിശദീകരിച്ച് രൂപകം അഴിച്ചെഴുതാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ ശക്തിയും തുറന്ന അർഥവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പാദങ്ങൾ’, ‘പാദപീഠം’ എന്നിവ ഉദ്ധരണിയുടെ രാജകീയ ഗൗരവവും മൂർത്തമായ ദൃശ്യബിംബവും നിലനിർത്തുന്നു; ‘കാൽക്കീഴിലാക്കുക’ എന്ന വ്യാഖ്യാനപരമായ ലഘൂകരണം ഒഴിവാക്കി.
