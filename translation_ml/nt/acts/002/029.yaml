id: ACT.2.29
reference: Acts 2:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: ml
  text: 'പുരുഷന്മാരേ, സഹോദരന്മാരേ, ഗോത്രപിതാവായ ദാവീദിനെക്കുറിച്ച് നിങ്ങളോടു തുറന്നുപറയാൻ എനിക്ക് സ്വാതന്ത്ര്യമുണ്ട്: അദ്ദേഹം മരിക്കുകയും അടക്കപ്പെടുകയും ചെയ്തു; അദ്ദേഹത്തിന്റെ കല്ലറ ഇന്നുവരെ നമ്മുടെ ഇടയിലുണ്ട്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ ഇരട്ട അഭിസംബോധന അക്ഷരാർഥത്തിൽ ‘പുരുഷന്മാരേ, സഹോദരന്മാരേ’ എന്നാണ്. എന്നാൽ ആ രൂപം ആധുനിക മലയാളത്തിൽ അസ്വാഭാവികമായതിനാൽ, സഹഇസ്രായേല്യരോടുള്ള ഔപചാരിക അഭിസംബോധനയെ സ്വാഭാവികമായി നൽകുന്ന ‘സഹോദരന്മാരേ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; ഇരട്ട രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἐξὸν εἰπεῖν
  choice: എനിക്ക് ... പറയാം
  rationale: ഇവിടെ വെറും കഴിവിനേക്കാൾ തുറന്നു പറയാനുള്ള സ്വാതന്ത്ര്യമോ അനുവാദമോ ആണ് സൂചിപ്പിക്കുന്നത്. ‘എനിക്ക് പറയാം’ മലയാളത്തിൽ ആ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: μετὰ παρρησίας
  choice: ധൈര്യമായി
  rationale: παρρησία തുറന്നും മടിയില്ലാതെയും ആത്മവിശ്വാസത്തോടെയും സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ വാഗ്മിത്വബലം ‘ധൈര്യമായി’ നിലനിർത്തുന്നു.
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: ഗോത്രപിതാവായ ദാവീദിനെക്കുറിച്ച്
  rationale: πατριάρχης എന്ന പദത്തിന്റെ പിതൃപുരുഷൻ/വംശപിതാവ് എന്ന സ്ഥാനാർഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘ഗോത്രപിതാവ്’ എന്നു നൽകി; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ ചേർത്തിട്ടില്ല.
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: അദ്ദേഹം മരിക്കുകയും അടക്കപ്പെടുകയും ചെയ്തു
  rationale: καί ... καί എന്ന സമാന്തര ഊന്നൽ ‘-കയും ... -കയും’ ഘടനയിൽ നിലനിർത്തി. മാന്യമായി പരാമർശിക്കാൻ ‘അദ്ദേഹം’ ഉപയോഗിച്ചു.
- source_word: τὸ μνῆμα αὐτοῦ
  choice: അദ്ദേഹത്തിന്റെ കല്ലറ
  rationale: μνῆμα ഇവിടെ അറിയപ്പെടുന്ന അടക്കസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘കല്ലറ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἔστιν ἐν ἡμῖν
  choice: നമ്മുടെ ഇടയിലുണ്ട്
  rationale: സംസാരിക്കുന്നവരുടെയും കേൾക്കുന്നവരുടെയും സമൂഹസ്ഥലത്ത് ആ കല്ലറ ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന പ്രാദേശിക-സാമൂഹിക അർഥം ഇത് നൽകുന്നു.
- source_word: ἄχρι τῆς ἡμέρας ταύτης
  choice: ഇന്നുവരെ
  rationale: പ്രസംഗസമയത്തോളം തുടർന്നിരുന്ന സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
theological_decisions:
- issue: ആരംഭത്തിലെ പുരുഷലിംഗ ഇരട്ട അഭിസംബോധന
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’, അടിക്കുറിപ്പിൽ അക്ഷരാർഥ ഇരട്ടരൂപം
  alternative: ‘പുരുഷന്മാരേ, സഹോദരന്മാരേ’ എന്ന അക്ഷരാർഥ രൂപം മുഖ്യപാഠത്തിൽ നൽകുക
  rationale: ἄνδρες ἀδελφοί എന്നത് രണ്ടു പുരുഷലിംഗ ബഹുവചന സംബോധനകളാണ്; അതിനാൽ അതിന്റെ രൂപവും സഹഇസ്രായേല്യരോടുള്ള ഔപചാരിക അഭിസംബോധനയും അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എന്നാൽ അക്ഷരാർഥ ഇരട്ടരൂപം ഇന്നത്തെ മലയാളത്തിൽ കൃത്രിമമായി കേൾക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ അത് ചുരുക്കി. ‘സഹോദരീസഹോദരന്മാരേ’ എന്നു വികസിപ്പിക്കുന്നത് മൂലപാഠത്തിലെ വ്യക്തമായ പുരുഷലിംഗരൂപത്തെ അതിവ്യാഖ്യാനിക്കുമെന്നതിനാൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ മലയാളം. ‘ഗോത്രപിതാവ്’, ‘കല്ലറ’ തുടങ്ങിയ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; പഴഞ്ചൻ വാക്യക്രമവും അനാവശ്യമായ സഭാപരമായ സാങ്കേതികഭാഷയും ഒഴിവാക്കി.
