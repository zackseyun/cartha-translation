revisions:
- from: 'സഹോദരന്മാരേ[a], ഗോത്രപിതാവായ ദാവീദിനെക്കുറിച്ച് എനിക്ക് നിങ്ങളോടു ധൈര്യമായി പറയാം: അദ്ദേഹം മരിക്കുകയും അടക്കപ്പെടുകയും ചെയ്തു; അദ്ദേഹത്തിന്റെ കല്ലറ ഇന്നുവരെ നമ്മുടെ ഇടയിലുണ്ട്.'
  to: 'പുരുഷന്മാരേ, സഹോദരന്മാരേ, ഗോത്രപിതാവായ ദാവീദിനെക്കുറിച്ച് നിങ്ങളോടു തുറന്നുപറയാൻ എനിക്ക് സ്വാതന്ത്ര്യമുണ്ട്: അദ്ദേഹം മരിക്കുകയും അടക്കപ്പെടുകയും ചെയ്തു; അദ്ദേഹത്തിന്റെ കല്ലറ ഇന്നുവരെ നമ്മുടെ ഇടയിലുണ്ട്.'
  rationale: The revision restores both elements of the Greek formal vocative in the main text and renders ἐξὸν εἰπεῖν μετὰ παρρησίας as freedom to speak openly. The remaining wording is retained because it faithfully and naturally communicates the patriarch David's death, burial, and tomb's continuing presence.
