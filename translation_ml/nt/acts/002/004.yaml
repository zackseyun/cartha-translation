- source_word: ἑτέραις γλώσσαις
  choice: മറ്റു നാവുകളിൽ
  rationale: γλῶσσα എന്ന പദത്തിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമാകാം. ‘നാവുകളിൽ’ എന്ന രൂപം മൂലപദത്തിന്റെ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു; തുടർന്നുള്ള സന്ദർഭം കേൾവിക്കാർ തിരിച്ചറിഞ്ഞ ഭാഷകളാണെന്ന് വ്യക്തമാക്കുന്നു. ‘മറ്റു’ എന്നത് ἑτέραις-നെ പ്രതിഫലിപ്പിക്കുന്നു.
