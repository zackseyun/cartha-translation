  choice: ഉച്ചരിച്ചുപറയാൻ കഴിവ്
  rationale: ഈ ധാതു വ്യക്തമായി, പരസ്യമായി സംസാരിച്ചുപറയുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഉച്ചരിച്ചുപറയാൻ കഴിവു നൽകുക’ എന്നത് ആത്മാവ് പ്രാപ്തരാക്കിയ സംസാരത്തെ അറിയിക്കുന്നു; അതിനെ പ്രവചനമായി മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: ദാതൃവിഭക്തിയുടെ പരോക്ഷ കർമം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവർക്കു’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നത് ദൈവിക വ്യക്തിയായ പരിശുദ്ധാത്മാവിനെയാണോ പൊതുവായ ഒരു ‘വിശുദ്ധ ആത്മാവിനെയാണോ’ സൂചിപ്പിക്കുന്നത്
  choice: പരിശുദ്ധാത്മാവ്
  alternative: വിശുദ്ധ ആത്മാവ്
  rationale: പ്രവൃത്തികൾ 2-ൽ യേശു വാഗ്ദാനം ചെയ്തതും സംസാരത്തിന് ശക്തി നൽകുന്ന കർത്താവായി അടുത്ത വാക്യഭാഗത്തിൽ പ്രവർത്തിക്കുന്നതും നിർദിഷ്ടമായ ദൈവിക ആത്മാവാണ്.
- issue: γλώσσαις എന്നത് ‘നാവുകൾ’ എന്നോ ‘ഭാഷകൾ’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: മറ്റു നാവുകളിൽ
  alternative: മറ്റു ഭാഷകളിൽ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ‘നാവ്/ഭാഷ’ ദ്വയാർഥസാധ്യത നിലനിർത്താൻ ‘നാവുകളിൽ’ സ്വീകരിച്ചു. പ്രവൃത്തികൾ 2:6–11 കേൾവിക്കാർ സ്വന്തം ഭാഷകൾ തിരിച്ചറിഞ്ഞതായി തുടർന്നു വ്യക്തമാക്കുന്നതിനാൽ, ഈ വാക്യത്തിൽത്തന്നെ വ്യാഖ്യാനം മുൻകൂട്ടി ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. ‘മറ്റു നാവുകളിൽ’ എന്ന ബോധപൂർവമായ മൂലരൂപസാന്നിധ്യം അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചിരിക്കുന്നു. തുടർച്ചയായ പ്രവർത്തനത്തെ അറിയിക്കാൻ ‘നൽകിക്കൊണ്ടിരുന്നതനുസരിച്ച്’ ഉപയോഗിച്ചു.
