  terminology: ‘വിശ്വസിച്ചവർ’ suitably identifies the believing community without importing denominational terminology. ‘സകലവും പൊതുവായിരുന്നു’ preserves the breadth of ‘all things in common’ and does not restrict the reference solely to formal property ownership.
