id: ACT.2.44
reference: Acts 2:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντες δὲ οἱ ⸀πιστεύοντες ⸂ἦσαν ἐπὶ τὸ αὐτὸ καὶ⸃ εἶχον ἅπαντα κοινά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/044.yaml
  text: And all the believers were together and had all things in common,[a]
translation:
  language: ml
  text: വിശ്വസിച്ചവരെല്ലാം ഒരുമിച്ചായിരുന്നു; അവർക്ക് സകലവും പൊതുവായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരേ സ്ഥലത്തായിരുന്നു.’ ഈ ഗ്രീക്ക് പ്രയോഗത്തിന് ഒരുമിച്ചുകൂടിയിരിക്കുക എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാം / എല്ലാവരും എന്ന അർഥത്തിൽ ‘വിശ്വസിച്ചവരെല്ലാം’
  rationale: സുബ്സ്റ്റാന്റീവ് പാർട്ടിസിപ്പിളിനെ വിശേഷിപ്പിക്കുന്ന πάντες എന്നതിന്റെ സമഗ്രതയും ഗ്രീക്ക് ഘടനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δὲ ശക്തമായ വൈരുധ്യമല്ല, ലളിതമായ ആഖ്യാനത്തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ അർധവിരാമത്തിലൂടെയും വാക്യക്രമത്തിലൂടെയും ആ തുടർച്ച സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: οἱ πιστεύοντες
  choice: വിശ്വസിച്ചവർ
  rationale: വിശ്വാസികളുടെ സമൂഹത്തെ സൂചിപ്പിക്കുന്ന സുബ്സ്റ്റാന്റീവ് വർത്തമാന പാർട്ടിസിപ്പിളിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: ഒരുമിച്ചായിരുന്നു
  rationale: ഒരുമിച്ചുകൂടിയിരിക്കുക എന്ന സമൂഹപരമായ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു; ഒരേ ഭൗതികസ്ഥലത്തായിരുന്നു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἶχον
  choice: അവർക്ക് ... ആയിരുന്നു
  rationale: ഗ്രീക്ക് ഇംപെർഫെക്റ്റിന്റെ തുടർച്ചയായ അവസ്ഥ മലയാളത്തിലെ സ്വാഭാവിക ഭൂതകാലപ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: ἅπαντα κοινά
  choice: സകലവും പൊതുവായിരുന്നു
  rationale: എല്ലാ വസ്തുക്കളും സമൂഹമായി പങ്കിട്ടിരുന്നുവെന്ന അർഥം നൽകുന്നു; ‘സ്വത്തുക്കൾ’ എന്ന് ചുരുക്കി മൂലപാഠത്തേക്കാൾ അർഥം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: സമൂഹത്തിന്റെ പങ്കിട്ട ജീവിതത്തിന്റെ സ്വഭാവം
  choice: വിശ്വാസികൾക്കു സകലവും പൊതുവായിരുന്നുവെന്ന വിവരണമായി പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാ ക്രൈസ്തവസമൂഹങ്ങൾക്കും ബാധകമായ ഒരു സാമ്പത്തികക്രമം ഈ വാക്യം കല്പിക്കുന്നു എന്ന വായന.
  rationale: ഗ്രീക്ക് പാഠം അവരുടെ പ്രവൃത്തിയെ വിവരിക്കുന്നു; സാർവത്രികമായ ഒരു കല്പന ഇവിടെ പ്രസ്താവിക്കുന്നില്ല. അതിനാൽ പരിഭാഷ വിവരണാത്മകമായി തുടരുകയും പാഠത്തിനപ്പുറമുള്ള മതശാസ്ത്രപരമോ രാഷ്ട്രീയമോ ആയ നിഗമനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സകലവും പൊതുവായിരുന്നു’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സ്ഥലപരവും സമൂഹപരവുമായ അർഥസാധ്യത സംരക്ഷിക്കുന്നു.
