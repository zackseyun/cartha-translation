  source_fidelity: The Malayalam accurately represents πάντες δὲ οἱ πιστεύοντες as ‘വിശ്വസിച്ചവരെല്ലാം,’ the communal/assembled sense of ἦσαν ἐπὶ τὸ αὐτό as ‘ഒരുമിച്ചായിരുന്നു,’ and ἅπαντα κοινά as ‘അവർക്ക് സകലവും പൊതുവായിരുന്നു.’ The descriptive rather than prescriptive force of the verse is retained. The imperfect εἶχον is naturally conveyed as a past communal state without adding an unwarranted temporal limitation.
