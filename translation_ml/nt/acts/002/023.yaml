id: ACT.2.23
reference: Acts 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: ml
  text: ദൈവത്തിന്റെ നിശ്ചിത പദ്ധതിക്കും മുൻകൂട്ടിയറിവിനും അനുസരിച്ച് ഏൽപ്പിക്കപ്പെട്ട ഈ മനുഷ്യനെ നിങ്ങൾ നിയമരഹിതരുടെ കൈവഴി[a] ക്രൂശിൽ ആണിയടിച്ച് കൊന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിയമരഹിതരായ മനുഷ്യരിലൂടെ.”
    reason: ‘കൈവഴി’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ‘കൈയിലൂടെ’ എന്ന ഇടനില കർത്തൃത്വസൂചനയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
  - marker: b
    text: അഥവാ, “വധിച്ചു.”
    reason: ἀναιρέω എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ മറ്റൊരു സ്വാഭാവിക പരിഭാഷ.
lexical_decisions:
- source_word: τοῦτον
  choice: ഈ മനുഷ്യനെ
  rationale: യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്ന കർമകാരക ഏകവചന സർവനാമം. ‘ഈ മനുഷ്യനെ’ എന്നത് അതിന്റെ ചൂണ്ടിക്കാട്ടുന്ന ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: നിശ്ചിത പദ്ധതിക്ക് അനുസരിച്ച്
  rationale: ὡρισμένῃ എന്നത് നിശ്ചയിക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു; βουλή ഇവിടെ ആലോചനയോ ഉദ്ദേശ്യമോ പദ്ധതിയോ ആണ്. ദൈവിക ഉദ്ദേശ്യം വ്യക്തമാക്കിക്കൊണ്ട് ദത്തിവിന്റെ അടിസ്ഥാനബന്ധം ‘അനുസരിച്ച്’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ προγνώσει
  choice: മുൻകൂട്ടിയുള്ള അറിവിനും
  rationale: πρόγνωσις മുൻകൂട്ടിയുള്ള അറിവിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഭാഷ ഉപയോഗിച്ച് ആശയം നിലനിർത്തുന്നു; അതിനെ മുൻനിശ്ചയം എന്നാക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ‘പദ്ധതി’, ‘മുൻകൂട്ടിയുള്ള അറിവ്’ എന്നീ രണ്ടിനെയും വിശേഷിപ്പിക്കുന്ന ഉടമസ്ഥതാസംബന്ധം നിലനിർത്തുന്നു.
- source_word: ἔκδοτον
  choice: ഏല്പിക്കപ്പെട്ട
  rationale: കൈമാറിക്കൊടുക്കപ്പെട്ട അവസ്ഥയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിൽ ഇവിടെ വ്യക്തമാക്കാത്ത ഏല്പിച്ച കർത്താവിനെ വിവർത്തനം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: διὰ χειρὸς ἀνόμων
  choice: നിയമരഹിതരുടെ കൈയാൽ
  rationale: διά + genitive ഇടനിലക്കാരായ കർത്തൃത്വത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ഏകവചനമായ ‘കൈ’ നിലനിർത്തുകയും ἀνόμων എന്നതിലെ നിയമത്തിന് പുറത്തുള്ളതോ വിരുദ്ധമായതോ ആയ ഭാവം ‘നിയമരഹിതർ’ എന്നതിലൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: προσπήξαντες
  choice: ക്രൂശിൽ തറച്ച്
  rationale: ക്രൂശുമരണത്തിന്റെ സന്ദർഭത്തിൽ ‘തറയ്ക്കുക/ആണിയടിച്ചുറപ്പിക്കുക’ എന്ന ക്രിയാഭാവം സംക്ഷിപ്തവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: ἀνείλατε
  choice: നിങ്ങൾ ... കൊന്നു
  rationale: ഇവിടെ ക്രിയയുടെ അർഥം കൊല്ലുക, വധിക്കുക എന്നതാണ്. പത്രോസിന്റെ നേരിട്ടുള്ള കുറ്റാരോപണത്തിന്റെ ശക്തി ‘കൊന്നു’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ നിശ്ചിത പദ്ധതിയും മനുഷ്യരുടെ ഉത്തരവാദിത്വവും തമ്മിലുള്ള ബന്ധം
  choice: യേശു ദൈവത്തിന്റെ നിശ്ചിത പദ്ധതിക്കും മുൻകൂട്ടിയുള്ള അറിവിനും അനുസരിച്ച് ഏല്പിക്കപ്പെട്ടുവെന്നും അതേസമയം ‘നിങ്ങൾ ... കൊന്നു’ എന്നും ഒരുപോലെ പ്രസ്താവിക്കുന്നു.
  alternative: ദൈവിക നിശ്ചയത്തെ മയപ്പെടുത്തുകയോ നിയമരഹിതരെ മാത്രം കർത്താക്കളാക്കി ശ്രോതാക്കളുടെ ഉത്തരവാദിത്വം കുറയ്ക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാക്യം ദൈവിക ഉദ്ദേശ്യവും മനുഷ്യരുടെ കുറ്റകരമായ പ്രവർത്തനവും ഒരുമിച്ച് ഉറപ്പിക്കുന്നു. ഒരു പ്രത്യേക ദൈവശാസ്ത്ര സമ്പ്രദായത്തിലേക്ക് ഈ സംഘർഷം പരിഹരിക്കാതെ രണ്ടും വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- issue: πρόγνωσις എന്നതിന്റെ വ്യാഖ്യാനം
  choice: മുൻകൂട്ടിയുള്ള അറിവ്
  alternative: മുൻനിശ്ചയം
  rationale: മൂലപദത്തിന്റെ അറിവ്-സംബന്ധിയായ അർഥം നേരിട്ട് നൽകുന്നു; ഈ സ്ഥലത്ത് തന്നെ അതിനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘മുൻനിശ്ചയം’ എന്നാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മുൻകൂട്ടിയുള്ള അറിവ്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായി തിരഞ്ഞെടുത്തു; ‘നിയമരഹിതർ’ മൂലപദത്തിലെ നിയമസംബന്ധിയായ ഭാവം സംരക്ഷിക്കുന്നു. വാക്യത്തിന്റെ കുറ്റാരോപണാത്മക ശക്തിയും ദൈവിക പദ്ധതി–മാനുഷിക ഉത്തരവാദിത്വം എന്ന സംഘർഷവും നിലനിർത്തിയിരിക്കുന്നു.
