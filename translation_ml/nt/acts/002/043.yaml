id: ACT.2.43
reference: Acts 2:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: ml
  text: എല്ലാവർക്കും ഭയം ഉണ്ടായി[a]. അപ്പൊസ്തലന്മാരിലൂടെ അനേകം അത്ഭുതങ്ങളും അടയാളങ്ങളും നടന്നുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാവരിലും വിസ്മയഭരിതമായ ഭയം ഉണ്ടായി.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഓരോ ആത്മാവിനും ഭയം ഉണ്ടായി” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: ഭയം ഉണ്ടായി
  rationale: γίνομαι എന്ന അപൂർണകാല ക്രിയയോടുകൂടിയ പ്രയോഗം ഭയം ഉദിച്ച് നിലനിന്നുവെന്ന ആശയം നൽകുന്നു. ‘ഭയം ഉണ്ടായി’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആശയം അറിയിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, വിവരണത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യക്രമംകൊണ്ടുതന്നെ ആ തുടർച്ച സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ നിർബന്ധിതമായ ഒരു ബന്ധപദം ചേർത്തില്ല.
- source_word: πάσῃ ψυχῇ
  choice: എല്ലാവർക്കും
  rationale: അക്ഷരാർഥം ‘ഓരോ ആത്മാവിനും’ എന്നാണെങ്കിലും, വ്യക്തികളെ ഒന്നാകെ സൂചിപ്പിക്കുന്ന ഈ ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ ആധുനിക മലയാളം ‘എല്ലാവർക്കും’ എന്നാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: φόβος
  choice: ഭയം
  rationale: φόβος ഭയത്തെയും ദൈവിക പ്രവർത്തനത്തോടുള്ള വിസ്മയഭരിതമായ ഭക്തിയെയും സൂചിപ്പിക്കാം. ‘ഭയം’ എന്ന നേരിട്ടുള്ള തത്തുല്യം ഈ അർഥവ്യാപ്തിയും പാഠത്തിലെ സംഘർഷവും നിലനിർത്തുന്നു.
- source_word: πολλά
  choice: അനേകം
  rationale: എണ്ണത്തിൽ വളരെയധികം എന്ന സാധാരണ അർഥം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τέρατα
  choice: അത്ഭുതങ്ങൾ
  rationale: τέρατα സംഭവങ്ങളുടെ വിസ്മയകരമായ സ്വഭാവത്തെ ഊന്നുന്നു. ‘അത്ഭുതങ്ങൾ’ എന്നത് σημεῖα എന്നതിൽനിന്നുള്ള വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: σημεῖα സംഭവങ്ങളുടെ സൂചനാത്മകവും സാക്ഷ്യപ്പെടുത്തുന്നതുമായ സ്വഭാവം പ്രകടിപ്പിക്കുന്നു; ‘അടയാളങ്ങൾ’ അതിന്റെ നേരിട്ടുള്ള തത്തുല്യമാണ്.
- source_word: διὰ τῶν ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരിലൂടെ
  rationale: ജനിതക വിഭക്തിയോടുകൂടിയ διά ഇടനിലക്കാരെയോ ഉപകരണത്തെയോ സൂചിപ്പിക്കുന്നു. ദൈവമാണ് പരോക്ഷമായ അന്തിമ പ്രവർത്തകൻ എന്നും അപ്പൊസ്തലന്മാർ മാധ്യമങ്ങളാണെന്നും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: ἐγίνετο
  choice: നടന്നുകൊണ്ടിരുന്നു
  rationale: അപൂർണകാലം ആവർത്തിച്ചോ തുടർന്നോ നടന്ന സംഭവങ്ങളെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ അനാവശ്യമായി വ്യക്തമാക്കാതെ ആ തുടർച്ച മലയാളത്തിൽ ഈ പ്രയോഗം നൽകുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക അടയാളങ്ങളോടുള്ള പ്രതികരണത്തിൽ φόβος എന്ന പദത്തിന്റെ ഭാവം
  choice: ഭയം
  alternative: ഭയഭക്തി / വിസ്മയം
  rationale: ‘ഭയം’ എന്ന പരിഭാഷ ഭീതിയും ദൈവിക പ്രവർത്തനത്തോടുള്ള വിസ്മയഭരിതമായ ആദരവും ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർഥസംഘർഷം നിലനിർത്തുന്നു; ഒരു വശത്തേക്ക് മാത്രം വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
