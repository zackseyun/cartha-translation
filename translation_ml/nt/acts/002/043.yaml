  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. ‘അത്ഭുതങ്ങളും അടയാളങ്ങളും’ എന്ന ഗൗരവമുള്ള ബൈബിൾപ്രയോഗം നിലനിർത്തിയപ്പോൾ, ‘എല്ലാവർക്കും’ എന്നും ‘നടന്നുകൊണ്ടിരുന്നു’ എന്നും സ്വാഭാവികമായ വാക്യഘടന തിരഞ്ഞെടുത്തു.
