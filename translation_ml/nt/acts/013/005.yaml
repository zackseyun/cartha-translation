translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവവചനം’, ‘യെഹൂദർ’, ‘സിനഗോഗ്’, ‘യോഹന്നാൻ’ എന്നീ പരിചിത ബൈബിൾ പദരൂപങ്ങൾ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
