language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: ml
  text: അവർ സലമീസിൽ എത്തിയപ്പോൾ[a], യെഹൂദരുടെ സിനഗോഗുകളിൽ ദൈവവചനം പ്രഖ്യാപിച്ചു; അവർക്കു സഹായിയായി യോഹന്നാനും ഉണ്ടായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സലമീസിൽ വന്നെത്തിയശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: ‘സഹായി’ എന്നതിന് ‘പരിചാരകൻ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: സലമീസിൽ എത്തിയപ്പോൾ
  rationale: സ്ഥലസൂചകമായ ἐν സഹിതമുള്ള γενόμενοι ഇവിടെ ഒരു സ്ഥലത്ത് എത്തിച്ചേരുന്നതിനെ സൂചിപ്പിക്കുന്നു. കാലസംബന്ധിയായ കൃതന്തത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ ‘എത്തിയപ്പോൾ’ എന്നു നൽകി.
- source_word: Σαλαμῖνι
  choice: സലമീസ്
  rationale: Σαλαμίς എന്ന സ്ഥലനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: κατήγγελλον
  choice: പ്രഖ്യാപിച്ചു
  rationale: പരസ്യമായി അറിയിക്കുക, വിളംബരം ചെയ്യുക എന്ന അർഥം നിലനിർത്തുന്നു; പ്രസംഗരീതിയിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിന്റെ വചനം/സന്ദേശം എന്ന മൂലപദഘടനയുടെ അർഥം മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: യെഹൂദരുടെ സിനഗോഗുകളിൽ
  rationale: സന്ദർഭം യെഹൂദരുടെ മതസമൂഹത്തെയും അവരുടെ ആരാധനാസ്ഥലങ്ങളെയും സൂചിപ്പിക്കുന്നതിനാൽ Ἰουδαίων എന്നത് ‘യെഹൂദർ’ എന്നും συναγωγαῖς എന്നത് കൃത്യമായി ‘സിനഗോഗുകൾ’ എന്നും നൽകി.
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: യോഹന്നാനും അവരുടെ … ഉണ്ടായിരുന്നു
  rationale: δέയുടെ മൃദുവായ തുടർച്ചയും καίയുടെ ‘കൂടി/യും’ എന്ന ചേർക്കൽഭാവവും സ്വാഭാവിക മലയാള വാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπηρέτην
  choice: സഹായി
  rationale: യാത്രാ-ശുശ്രൂഷാ സന്ദർഭത്തിൽ കീഴിൽ സഹായിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. അടിമത്തമോ ദാസ്യപദവിയോ അനാവശ്യമായി സൂചിപ്പിക്കാതെ പദത്തിന്റെ വിശാലമായ അർഥം നൽകുന്നു.
