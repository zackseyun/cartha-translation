source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: ml
  text: പിതാക്കന്മാരോടു ചെയ്ത വാഗ്ദാനത്തെ സുവാർത്തയായി ഞങ്ങൾതന്നെ നിങ്ങളോടു പ്രഖ്യാപിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പൂർവികരോടു.’ ഗ്രീക്കിൽ ‘പിതാക്കന്മാർ’ എന്നാണ്; ഇത് യിസ്രായേലിന്റെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്ന ഉടമ്പടി-ചരിത്രപരമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം / സന്ദർഭപ്രവാഹത്തിൽ പ്രത്യേക പദമില്ലാതെ
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; നിർബന്ധമായി ‘കൂടാതെ’ ചേർത്താൽ അനാവശ്യ ഊന്നൽ വരാം.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾതന്നെ
  rationale: ഗ്രീക്കിൽ പ്രകടമായി നൽകിയ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ കൊണ്ടു സൂചിപ്പിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളോടു
  rationale: εὐαγγελίζομαι എന്ന ക്രിയയോടുകൂടിയ അഭിസംബോധിതനെ മലയാളത്തിൽ സ്വാഭാവികമായി ദാതൃസമാന രൂപത്തിൽ പറയുന്നു.
- source_word: εὐαγγελιζόμεθα
  choice: സുവാർത്ത ... അറിയിക്കുന്നു
  rationale: നല്ല വാർത്ത പ്രഖ്യാപിക്കുന്നതെന്ന ക്രിയാർഥം സഭാപരമായ സാങ്കേതികഭാഷയിൽ ഒതുക്കാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν ... ἐπαγγελίαν
  choice: വാഗ്ദാനത്തെക്കുറിച്ചുള്ള
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ വാഗ്ദാനമാണ് εὐαγγελίζομαι എന്ന ക്രിയയുടെ കർമം; മലയാളത്തിൽ ‘വാഗ്ദാനത്തെ സുവാർത്തയായി അറിയിക്കുന്നു’ എന്നതിനെക്കാൾ ഈ രൂപം സ്വാഭാവികമാണ്, എന്നാൽ വാഗ്ദാനവും സുവാർത്തയും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: πρὸς τοὺς πατέρας
  choice: പിതാക്കന്മാരോടു
  rationale: πρός ഇവിടെ വാഗ്ദാനം ആരോടാണ് ചെയ്തതെന്ന് സൂചിപ്പിക്കുന്നു; ‘പിതാക്കന്മാർ’ എന്നത് യിസ്രായേലിന്റെ ഉടമ്പടി-ചരിത്രത്തിലെ പൂർവപിതാക്കളെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ പുരുഷലിംഗ കുടുംബപദം നിലനിർത്തുന്നു.
- source_word: γενομένην
  choice: ചെയ്ത
  rationale: വാഗ്ദാനം ‘ചെയ്യപ്പെട്ടു’ എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; അടുത്ത വാക്യത്തിലെ നിവൃത്തി എന്ന ആശയം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: πατέρες എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പിതാക്കന്മാർ
  alternative: പൂർവികർ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ കുടുംബപദവും യിസ്രായേലിന്റെ ഉടമ്പടി-ചരിത്രപരമായ സൂചനയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; കൂടുതൽ ഉൾക്കൊള്ളുന്ന പൊതുപദമായ ‘പൂർവികർ’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: വാഗ്ദാനം നിവൃത്തിയായതായി ഈ വാക്യത്തിൽ പറയണമോ
  choice: ‘ചെയ്ത വാഗ്ദാനം’ എന്നു മാത്രം
  alternative: ‘നിവർത്തിച്ച വാഗ്ദാനം’
  rationale: γενομένην എന്നത് ഇവിടെ വാഗ്ദാനം ഉണ്ടായത്/ചെയ്യപ്പെട്ടത് എന്നതിനെ സൂചിപ്പിക്കുന്നു; നിവൃത്തി അടുത്ത വാക്യത്തിന്റെ പ്രസ്താവനയാണ്, അതിനാൽ അത് ഇവിടെ മുൻകൂട്ടി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ഞങ്ങൾതന്നെ’ മൂലത്തിലെ പ്രകട സർവനാമത്തിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; ‘സുവാർത്ത അറിയിക്കുന്നു’ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണ്.
