- from: പിതാക്കന്മാരോടു ചെയ്ത വാഗ്ദാനത്തെക്കുറിച്ചുള്ള സുവാർത്ത ഞങ്ങൾതന്നെ നിങ്ങളോടു അറിയിക്കുന്നു.[a]
