  rationale: ‘വാഗ്ദാനത്തെ സുവാർത്തയായി ... പ്രഖ്യാപിക്കുന്നു’ എന്ന രൂപം വാഗ്ദാനമാണ് പ്രഖ്യാപിക്കപ്പെടുന്ന സുവാർത്തയുടെ ഉള്ളടക്കമെന്ന ഗ്രീക്ക് ബന്ധം വ്യക്തമാക്കുന്നു. ‘ഞങ്ങൾതന്നെ,’ ‘പിതാക്കന്മാർ,’ ‘ചെയ്ത വാഗ്ദാനം’ എന്നിവ മൂലത്തിലെ ഊന്നലും പദാർഥവും നിലനിർത്തുന്നു.
