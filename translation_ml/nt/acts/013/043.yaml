id: ACT.13.43
reference: Acts 13:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: ml
  text: സിനഗോഗിലെ കൂടിവരവ് പിരിഞ്ഞശേഷം[a], യെഹൂദന്മാരിലും ഭക്തരായ യെഹൂദമതപരിവർത്തിതരിലും പലർ പൗലോസിനെയും ബർണബാസിനെയും അനുഗമിച്ചു. അവർ അവരോടു സംസാരിച്ചുകൊണ്ട്[b], ദൈവത്തിന്റെ കൃപയിൽ തുടരാൻ അവരെ പ്രേരിപ്പിച്ചുകൊണ്ടിരുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സിനഗോഗിലെ യോഗം അവസാനിച്ചശേഷം.’ ഇവിടെ പരാമർശിക്കുന്നത് കെട്ടിടത്തെയല്ല, കൂടിവന്ന ജനസമൂഹത്തെയോ അവരുടെ യോഗത്തെയോ ആണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ’ എന്നത് പൗലോസിനെയും ബർണബാസിനെയും സൂചിപ്പിക്കുന്നു; ‘അവരോടു’ എന്നത് അവരെ അനുഗമിച്ചവരെയും.
    reason: referent_clarity
  - marker: c
    text: അഥവാ, ‘ദൈവത്തിന്റെ കൃപയിൽ തുടരാൻ അവരെ സമ്മതിപ്പിച്ചുകൊണ്ടിരുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: സഭായോഗം പിരിഞ്ഞശേഷം
  rationale: ജനക്കൂട്ടമായി ചേർന്നിരുന്ന സിനഗോഗ് യോഗം അവസാനിച്ചതിനെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കെട്ടിടം പിരിഞ്ഞുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, genitive absolute സൂചിപ്പിക്കുന്ന മുൻസാഹചര്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἠκολούθησαν
  choice: അനുഗമിച്ചു
  rationale: യോഗശേഷം അവർ പൗലോസിന്റെയും ബർണബാസിന്റെയും പിന്നാലെ പോയതിനെ നേരിട്ട് വ്യക്തമാക്കുന്നു; ഭൗതികവും ശിഷ്യത്വപരവുമായ സാധ്യത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: πολλοὶ τῶν Ἰουδαίων
  choice: യെഹൂദന്മാരിലും ... പലർ
  rationale: πολλοί-യോടൊപ്പമുള്ള partitive genitive മലയാളത്തിലെ സ്വാഭാവികമായ വിഭാഗസൂചക ഘടനയിൽ നൽകുന്നു.
- source_word: τῶν σεβομένων προσηλύτων
  choice: ഭക്തരായ യെഹൂദമതപരിവർത്തിതരിലും
  rationale: προσήλυτος യെഹൂദമതത്തിലേക്കു പൂർണമായി ചേർന്നവരെ സൂചിപ്പിക്കുന്നു; സാധാരണ ദൈവഭക്തരിൽനിന്ന് അവരെ വേർതിരിക്കാൻ ‘യെഹൂദമതപരിവർത്തിതർ’ ഉപയോഗിച്ചു. σεβομένων എന്ന വിശേഷണം ‘ഭക്തരായ’ എന്നു നിലനിർത്തി.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: അവരോടു സംസാരിച്ചുകൊണ്ട്
  rationale: അവരിലേക്കു തിരിഞ്ഞുള്ള തുടർസംഭാഷണത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു; participle മുഖ്യക്രിയയോടൊപ്പമുള്ള പ്രവർത്തനമായി നിലനിർത്തുന്നു.
- source_word: ἔπειθον
  choice: പ്രേരിപ്പിച്ചുകൊണ്ടിരുന്നു
  rationale: imperfect രൂപത്തിലെ തുടർച്ചയായ പ്രവർത്തനവും, πείθω എന്നതിലെ പ്രേരണ/സമ്മതിപ്പിക്കൽ ഭാവവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: αὐτοὺς προσμένειν
  choice: നിലനിൽക്കാൻ
  rationale: προσμένω സൂചിപ്പിക്കുന്ന തുടരുക, ഉറച്ചുനിൽക്കുക, അതിൽത്തന്നെ തുടരുക എന്നീ അർത്ഥങ്ങളെ സന്ദർഭോചിതമായി സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: ദൈവകൃപയിൽ
  rationale: ദൈവത്തിന്റെ കൃപയിലും അതു രൂപപ്പെടുത്തുന്ന ജീവിതമേഖലയിലും തുടരുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക പ്രബോധനത്തിലെ ‘ദൈവകൃപ’യുടെ അർത്ഥവ്യാപ്തി
  choice: ദൈവകൃപയിൽ നിലനിൽക്കാൻ
  alternative: ദൈവത്തിന്റെ പ്രീതിയിൽ തുടരാൻ / ദൈവകൃപയുടെ സന്ദേശത്തിൽ തുടരാൻ
  rationale: ഗ്രീക്ക് പ്രയോഗം ദൈവത്തിന്റെ കൃപാപ്രവൃത്തിയെയും ആ കൃപ നിർണയിക്കുന്ന ജീവിതമേഖലയെയും ഉൾക്കൊള്ളാം. അതിനെ വെറും ദൈവപ്രീതിയെന്നോ സുവിശേഷസന്ദേശമെന്നോ ചുരുക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായനാസൗകര്യമുള്ളതും മാന്യവുമായ മലയാളം. ‘സിനഗോഗ്’ എന്ന അപരിചിത പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി ‘സഭായോഗം’ ഉപയോഗിച്ചു; അടിക്കുറിപ്പിൽ സാംസ്കാരിക പദം വ്യക്തമാക്കി. വ്യക്തതയ്ക്കായി ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി; ബന്ധങ്ങളും തുടരുന്ന പ്രവർത്തനവും സംരക്ഷിച്ചു.
