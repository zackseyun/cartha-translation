  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ ഘടനയും അർത്ഥവും കരട് നന്നായി പ്രതിഫലിപ്പിക്കുന്നു: കൂടിവരവ് അവസാനിച്ചശേഷമുള്ള സാഹചര്യം, യെഹൂദന്മാരും ഭക്തരായ യെഹൂദമതപരിവർത്തിതരും പൗലോസിനെയും ബർണബാസിനെയും അനുഗമിച്ചത്, അവരോടുള്ള സംഭാഷണത്തോടൊപ്പം ദൈവകൃപയിൽ തുടരാൻ പ്രേരിപ്പിച്ചത് എന്നിവ സംരക്ഷിക്കപ്പെട്ടിട്ടുണ്ട്. എന്നാൽ ‘സഭായോഗം’ ആധുനിക മലയാളത്തിൽ ക്രൈസ്തവസഭയുടെ യോഗമെന്ന ധ്വനി സൃഷ്ടിക്കാം; συναγωγήയുടെ യെഹൂദസന്ദർഭം മുഖ്യവാചകത്തിൽതന്നെ വ്യക്തമാക്കുന്നതാണ് കൂടുതൽ കൃത്യം.'
  naturalness: ‘സിനഗോഗിലെ കൂടിവരവ് പിരിഞ്ഞശേഷം’ എന്നത് കെട്ടിടമല്ല, ഒത്തുകൂടിയ സഭ/യോഗമാണ് പിരിഞ്ഞതെന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു. ‘ദൈവത്തിന്റെ കൃപയിൽ തുടരാൻ’ എന്ന പ്രയോഗം ‘ദൈവകൃപയിൽ നിലനിൽക്കാൻ’ എന്നതിനെക്കാൾ προσμένειν-ന്റെ തുടർന്നുനിൽക്കുക എന്ന ഭാവം നേരിട്ട് വ്യക്തമാക്കുന്നു.
