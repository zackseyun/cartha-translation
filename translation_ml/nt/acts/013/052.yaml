  yaml_path: translation/nt/acts/013/052.yaml
  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: ml
  text: ശിഷ്യന്മാർ സന്തോഷവും പരിശുദ്ധാത്മാവുംകൊണ്ട് നിറഞ്ഞുകൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സന്തോഷവും പരിശുദ്ധാത്മാവുംകൊണ്ട് നിറഞ്ഞിരുന്നു.’ ഗ്രീക്കിലെ അപൂർണ്ണ ഭൂതകാല ക്രിയാരൂപം തുടർന്നുനിന്നതോ ആവർത്തിച്ചതോ ആയ നിറയലിനെ സൂചിപ്പിക്കാം; എന്നാൽ അതിനെ ലളിതമായി ‘നിറഞ്ഞിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε
  choice: ശിഷ്യന്മാരാകട്ടെ
  rationale: τε മുൻവിവരണത്തോടുള്ള തുടർച്ചയും പുതിയ കർത്താവിലേക്കുള്ള നീക്കവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘-ആകട്ടെ’ ഈ വിവരണബന്ധവും സന്ദർഭത്തിലെ നേരിയ വൈരുധ്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μαθηταὶ
  choice: ശിഷ്യന്മാർ
  rationale: യേശുവിൽ വിശ്വസിച്ച് അവനെ അനുഗമിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ പുതിയനിയമ പദമാണ്.
- source_word: ἐπληροῦντο
  choice: നിറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാല കർമണി രൂപം കഴിഞ്ഞകാലത്തെ തുടർന്നുനിന്നതോ ആവർത്തിച്ചതോ ആയ നിറയലിനെ സൂചിപ്പിക്കുന്നു; ‘നിറഞ്ഞുകൊണ്ടിരുന്നു’ ആ ഭാവവും കർമണിയർഥവും സംരക്ഷിക്കുന്നു.
- source_word: χαρᾶς
  choice: സന്തോഷത്താൽ
  rationale: χαράയുടെ നേരിട്ടുള്ള, സാധാരണ മലയാള തുല്യപദമാണ് ‘സന്തോഷം’; πληρόωയോടൊപ്പമുള്ള ഗ്രീക്ക് ഷഷ്ഠി മലയാളത്തിൽ ‘-ത്താൽ’ ഉപയോഗിച്ച് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പ്രയോഗം സഭയുടെ ദൗത്യത്തിൽ പ്രവർത്തിക്കുന്ന ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തമായ ഈ പരാമർശത്തിന് ‘പരിശുദ്ധാത്മാവ്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നത് വ്യക്തിയായ ദൈവിക ആത്മാവിനെയോ ഒരു ഗുണാത്മക ‘വിശുദ്ധ ആത്മാവിനെയോ’ സൂചിപ്പിക്കുന്നുവോ
  choice: പരിശുദ്ധാത്മാവ്
  alternative: വിശുദ്ധമായ ആത്മാവ്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളുടെ സമീപവും വിപുലവുമായ സന്ദർഭത്തിൽ πνεῦμα ἅγιον സഭയിലും ദൗത്യത്തിലും പ്രവർത്തിക്കുന്ന ദൈവിക ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ വ്യക്തിപരമായ പരാമർശം നിലനിർത്തുന്നു.
- issue: ἐπληροῦντοയുടെ അപൂർണ്ണകാല ഭാവം എത്രത്തോളം തുറന്നുകാട്ടണം
  choice: നിറഞ്ഞുകൊണ്ടിരുന്നു
  alternative: നിറഞ്ഞിരുന്നു
  rationale: പ്രവൃത്തി തുടർന്നുനിന്നതോ ആവർത്തിച്ചതോ ആകാമെന്ന ഗ്രീക്ക് അപൂർണ്ണകാലത്തിന്റെ ഭാവം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; ലളിതമായ അവസ്ഥാവിവരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിറഞ്ഞുകൊണ്ടിരുന്നു’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ തുടർച്ചാഭാവം വ്യക്തമാക്കുന്നു; ‘ശിഷ്യന്മാരാകട്ടെ’ മുൻവാക്യത്തോടുള്ള വിവരണബന്ധവും സന്ദർഭത്തിലെ മൃദുവായ വൈരുധ്യവും നിലനിർത്തുന്നു.
