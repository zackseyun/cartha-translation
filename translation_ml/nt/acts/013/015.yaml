id: ACT.13.15
reference: Acts 13:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: ml
  text: 'നിയമഗ്രന്ഥത്തിന്റെയും പ്രവാചകഗ്രന്ഥങ്ങളുടെയും വായനയ്ക്കുശേഷം, സിനഗോഗിന്റെ നേതാക്കന്മാർ അവർക്കു സന്ദേശം അയച്ചു പറഞ്ഞു: “സഹോദരന്മാരേ[a], ജനത്തിനുവേണ്ടി പ്രോത്സാഹനവചനം[b] നിങ്ങളിൽ ആർക്കെങ്കിലും ഉണ്ടെങ്കിൽ, സംസാരിക്കൂ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ പദശഃ “പുരുഷന്മാരേ, സഹോദരന്മാരേ”; ആദരവും കുടുംബബന്ധവും പ്രകടിപ്പിക്കുന്ന അഭിസംബോധന.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഉദ്ബോധനവചനം.” ഗ്രീക്ക് പ്രയോഗത്തിന് പ്രോത്സാഹനം, ഉദ്ബോധനം എന്നീ രണ്ടു ഭാവങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: വായിച്ചശേഷം
  rationale: സിനഗോഗിലെ തിരുവെഴുത്തുകളുടെ പരസ്യവായനയാണ് സന്ദർഭം. മലയാളത്തിൽ ‘വായിച്ചശേഷം’ സ്വാഭാവികമായി സമയബന്ധം വ്യക്തമാക്കുന്നു; ‘പരസ്യമായി’ എന്നത് മൂലത്തിൽ പ്രത്യേകം ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: നിയമഗ്രന്ഥവും പ്രവാചകഗ്രന്ഥങ്ങളും
  rationale: ഇവ സിനഗോഗിൽ വായിക്കപ്പെട്ട അംഗീകൃത തിരുവെഴുത്തുവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഗ്രന്ഥം’ ചേർക്കുന്നത് ആളുകളെയോ അമൂർത്തമായ നിയമത്തെയോ വായിച്ചു എന്ന അസ്വാഭാവികത ഒഴിവാക്കുന്നു.
- source_word: ἀρχισυνάγωγοι
  choice: സിനഗോഗിന്റെ നേതാക്കന്മാർ
  rationale: സിനഗോഗിലെ ശുശ്രൂഷയ്ക്ക് മേൽനോട്ടം വഹിച്ചവരെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭരണാധികാരികൾ’ എന്നത് പൗരഭരണത്തിന്റെ തെറ്റായ ധ്വനി നൽകാം.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς
  choice: അവരുടെ അടുക്കൽ ആളയച്ച്
  rationale: തുടർന്നുള്ള നേരിട്ടുള്ള വാക്കുകളോടൊപ്പം ഈ ക്രിയ സന്ദേശം എത്തിക്കാൻ ഒരാളെ അയച്ചതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികവും മൂലത്തിലെ ‘അയച്ചു’ എന്ന ആശയത്തോട് അടുത്തതുമാണ്.
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷന്മാരായ സന്ദർശകരോടുള്ള ആദരപൂർവവും കുടുംബബന്ധസൂചകവുമായ അഭിസംബോധന. പദശഃ ‘പുരുഷന്മാരേ, സഹോദരന്മാരേ’ എന്ന രൂപം മലയാളത്തിൽ ഭാരമുള്ളതിനാൽ പ്രധാന പാഠത്തിൽ സ്വാഭാവികരൂപവും അടിക്കുറിപ്പിൽ പദശഃ രൂപവും നൽകി.
- source_word: λόγος παρακλήσεως
  choice: പ്രോത്സാഹനവചനം
  rationale: παράκλησις എന്നതിന് പ്രോത്സാഹനവും ഉദ്ബോധനവും എന്ന രണ്ടു ഭാവങ്ങളും ഉണ്ടാകാം. പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ വിശാലപദം ഉപയോഗിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: πρὸς τὸν λαόν
  choice: ജനത്തിനുവേണ്ടി
  rationale: പ്രസംഗത്തിന്റെ ഉദ്ദേശിക്കപ്പെട്ട ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമായ രൂപം.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: എന്തെങ്കിലും ... നിങ്ങളിലാരുടെയെങ്കിലും പക്കൽ ഉണ്ടെങ്കിൽ
  rationale: ‘നിങ്ങളുടെ ഇടയിൽ എന്തെങ്കിലും വചനം ഉണ്ടെങ്കിൽ’ എന്ന ഗ്രീക്ക് ഘടനയുടെ അർത്ഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ ഉടമസ്ഥപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: λέγετε
  choice: സംസാരിക്കൂ
  rationale: സഭയെ അഭിസംബോധന ചെയ്യാനുള്ള ക്ഷണം നൽകുന്ന ബഹുവചന ആജ്ഞയാണ്; ലളിതവും ആദരസൂചകവുമായ മലയാളരൂപം.
theological_decisions:
- issue: സിനഗോഗിലെ ലിംഗസൂചക അഭിസംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: Ἄνδρες ἀδελφοί വ്യക്തമായി പുല്ലിംഗരൂപമാണ്; സംസാരിക്കാൻ ക്ഷണിക്കപ്പെടുന്ന പൗലൊസിനെയും കൂട്ടരെയും അഭിസംബോധന ചെയ്യുന്നു. അതിനാൽ ലിംഗനിരപേക്ഷമായി വിപുലീകരിച്ചിട്ടില്ല.
- issue: παράκλησις എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: പ്രോത്സാഹനവചനം
  alternative: ഉദ്ബോധനവചനം
  rationale: സിനഗോഗിലെ പ്രസംഗക്ഷണത്തിൽ പദത്തിന് ആശ്വസിപ്പിക്കുന്ന പ്രോത്സാഹനവും പ്രവർത്തിയിലേക്ക് വിളിക്കുന്ന ഉദ്ബോധനവും ഉൾക്കൊള്ളാനാകും. പ്രധാന പാഠം ഒന്നിനെ തിരഞ്ഞെടുത്തെങ്കിലും മറ്റേതിനെ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘സിനഗോഗ്’ എന്ന പദം യഹൂദ ആരാധനാസ്ഥലത്തെ ക്രൈസ്തവ ‘പള്ളി’യിൽനിന്ന് വ്യക്തമായി വേർതിരിക്കുന്നു. വാക്യാരംഭത്തിൽ മൂലത്തിൽ ഇല്ലാത്ത ‘ഇപ്പോൾ’ പോലുള്ള സംവാദചിഹ്നം ചേർത്തിട്ടില്ല.
