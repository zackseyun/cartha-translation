  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം ഉപയോഗിച്ചു. ‘ശബ്ബത്ത്’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തി. മുഖ്യപാഠത്തിലെ സർവനാമാനിശ്ചിതത്വവും imperfect ക്രിയയുടെ തുടരുന്ന ഭാവവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
