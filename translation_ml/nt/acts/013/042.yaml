id: ACT.13.42
reference: Acts 13:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: ml
  text: അവർ പുറത്തേക്കു പോകുമ്പോൾ[a][b], അടുത്ത ശബ്ബത്തിൽ ഈ വാക്കുകൾ അവരോടു പറയണമെന്ന് അവർ അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികൾ കൂടുതൽ വ്യക്തമായി ഇങ്ങനെ വായിക്കുന്നു: “പൗലൊസും ബർന്നബാസും പുറത്തേക്കു പോകുമ്പോൾ, അടുത്ത ശബ്ബത്തിൽ ഈ വാക്കുകൾ അവരോടു പറയണമെന്ന് ജനങ്ങൾ അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു.”'
    reason: textual_variant
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവർ അവിടെനിന്നു പോകുമ്പോൾ, വരാനിരിക്കുന്ന ശബ്ബത്തിൽ ഈ കാര്യങ്ങൾ അവരോടു പറയണമെന്ന് അവർ അപേക്ഷിച്ചുകൊണ്ടിരുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: പുറത്തേക്കു പോകുമ്പോൾ
  rationale: വർത്തമാനകർത്തൃവിശേഷണത്തോടുകൂടിയ genitive absolute കാലസാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘പുറത്തേക്കു പോകുമ്പോൾ’ ക്രിയയുടെ പുരോഗമനഭാവവും സ്ഥലത്തുനിന്നുള്ള പുറപ്പെടലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ കാലവാക്യഘടനയിൽ അതിന്റെ ബന്ധകപ്രവർത്തനം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: αὐτῶν
  choice: അവർ
  rationale: മൂലപാഠം സർവനാമം മാത്രമേ ഉപയോഗിക്കുന്നുള്ളൂ. ‘പൗലൊസും ബർന്നബാസും’ എന്നോ ‘ജനങ്ങൾ’ എന്നോ വ്യക്തമാക്കി പാഠത്തിലെ അനിശ്ചിതത്വം പരിഹരിക്കാതെ ‘അവർ’ എന്നു നിലനിർത്തുന്നു.
- source_word: παρεκάλουν
  choice: അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു
  rationale: Imperfect രൂപം തുടരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ παρακαλέω ആശ്വസിപ്പിക്കുക എന്നതിലുപരി ഗൗരവത്തോടെ അപേക്ഷിക്കുക എന്ന അർഥത്തിലാണ്. ‘അഭ്യർഥിച്ചുകൊണ്ടിരുന്നു’ അതിന്റെ ശക്തിയും തുടരുന്ന ഭാവവും നൽകുന്നു.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: അടുത്ത ശബ്ബത്തിൽ
  rationale: ഈ പ്രയോഗം ഇടയിൽ വരാനിരിക്കുന്ന, അഥവാ അടുത്ത, ശബ്ബത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അടുത്ത ശബ്ബത്തിൽ’ ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: λαληθῆναι
  choice: പറയണമെന്ന്
  rationale: λαλέωയുടെ aorist passive infinitive ആശയം മലയാളത്തിലെ പരോക്ഷ അഭ്യർഥനാഘടനയിൽ ‘പറയണമെന്ന്’ എന്നു സ്വാഭാവികമായി വരുന്നു; വാക്കുകളാൽ അറിയിക്കുന്നതെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: αὐτοῖς
  choice: തങ്ങളോടു
  rationale: അഭ്യർഥിക്കുന്നവർക്കുതന്നെ ഈ വാക്കുകൾ പറയപ്പെടണമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വ്യക്തികളുടെ പേര് ചേർത്ത് തിരിച്ചറിയുന്നില്ല.
- source_word: τὰ ῥήματα ταῦτα
  choice: ഈ വാക്കുകൾ
  rationale: ῥήματα പ്രസ്താവിക്കപ്പെട്ട വാക്കുകളെയോ വചനങ്ങളെയോ സൂചിപ്പിക്കുന്നു. ‘ഈ വാക്കുകൾ’ മൂലരൂപത്തോടു ചേർന്നുനിൽക്കുകയും മുൻപ്രസംഗത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ സർവനാമങ്ങൾ ആരെ സൂചിപ്പിക്കുന്നു എന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘അവർ’ എന്ന സർവനാമം നിലനിർത്തി, പുറത്തേക്കു പോകുന്നവർ ആരെന്നത് വ്യക്തമാക്കിയിട്ടില്ല.
  alternative: ‘പൗലൊസും ബർന്നബാസും പുറത്തേക്കു പോകുമ്പോൾ ജനങ്ങൾ…’ എന്നു വ്യക്തമായി പറയുക; അല്ലെങ്കിൽ വ്യത്യസ്ത പാഠവായനയെ അടിസ്ഥാനമാക്കി പങ്കാളികളെ മറ്റുവിധം തിരിച്ചറിയുക.
  rationale: SBLGNT പാഠം വ്യക്തികളുടെ പേര് നൽകാതെ സർവനാമം ഉപയോഗിക്കുന്നു; കൂടാതെ ഇവിടെ പാഠഭേദവും വ്യാഖ്യാനപ്രശ്നവും ഉണ്ട്. അതിനാൽ മൂലപാഠം തീർപ്പാക്കാത്ത കാര്യം പ്രധാനപാഠത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
