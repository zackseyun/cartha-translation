id: ACT.13.23
reference: Acts 13:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: ml
  text: ഇവന്റെ സന്തതിയിൽനിന്ന്[a], വാഗ്ദാനപ്രകാരം[b], ദൈവം ഇസ്രായേലിന് രക്ഷകനായ യേശുവിനെ കൊണ്ടുവന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഇവന്റെ വിത്തിൽനിന്ന്’; ഇവിടെ ദാവീദിന്റെ വംശപരമ്പരയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വാഗ്ദാനം ചെയ്തതുപോലെ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: ഇവന്റെ
  rationale: മുൻവാക്യത്തിലെ ദാവീദിനെ സൂചിപ്പിക്കുന്ന ഏകവചന ജനിറ്റീവ് സർവനാമത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു; മുഖ്യപാഠത്തിൽ പേര് വീണ്ടും ചേർക്കാതെ സന്ദർഭത്തിലെ സൂചന സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: സന്തതിയിൽനിന്ന്
  rationale: σπέρμα എന്നതിന്റെ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ആലങ്കാരിക അർഥം ഇവിടെ ഉദ്ദേശിക്കുന്നു. ‘വിത്തിൽനിന്ന്’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സ്വാഭാവികമായി ദാവീദീയ വംശബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: κατ’ ἐπαγγελίαν
  choice: വാഗ്ദാനപ്രകാരം
  rationale: മുൻപുണ്ടായ വാഗ്ദാനത്തോടുള്ള അനുരൂപത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമായും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു; വാഗ്ദാനം ആരോടുള്ളതെന്ന് മുഖ്യപാഠത്തിൽ അധികമായി നിർവചിക്കുന്നില്ല.
- source_word: ἤγαγεν
  choice: കൊണ്ടുവന്നു
  rationale: ἄγω എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘കൊണ്ടുവരുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു. ‘ഉയർത്തി’ എന്ന പരിഭാഷ സൃഷ്ടിക്കാവുന്ന പുനരുത്ഥാനസൂചന ഒഴിവാക്കുന്നു.
- source_word: τῷ Ἰσραήλ
  choice: ഇസ്രായേലിന്
  rationale: ദാതൃവിഭക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ഇസ്രായേലിനുവേണ്ടിയുള്ള അനുഗ്രഹാർഥവും ഉൾക്കൊള്ളാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: σωτῆρα
  choice: രക്ഷകനായ
  rationale: σωτήρ എന്ന ക്രിസ്തുസംബന്ധിയായ ബഹുമാനപദത്തിന്റെ രക്ഷ/വിമോചന അർഥം നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ‘യേശു’ എന്ന പേരുമായി സ്വാഭാവികമായ വിശേഷണബന്ധം സൃഷ്ടിക്കുന്നു.
- source_word: Ἰησοῦν
  choice: യേശുവിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ നിലവാരമുള്ള മലയാളരൂപം ഉപയോഗിക്കുകയും ഗ്രീക്കിലെ കർമവിഭക്തിബന്ധം മലയാളത്തിൽ അടയാളപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: യേശുവും ദാവീദീയ വാഗ്ദാനവും തമ്മിലുള്ള ബന്ധം
  choice: ദാവീദിനെ സൂചിപ്പിക്കുന്ന ‘ഇവന്റെ’ എന്ന പദത്തോടൊപ്പം, യേശു ആ സന്തതിയിൽനിന്ന് വാഗ്ദാനപ്രകാരം കൊണ്ടുവരപ്പെട്ടുവെന്ന് പറയുന്നു.
  alternative: ‘ദാവീദിനോടു ചെയ്ത വാഗ്ദാനം നിറവേറ്റിക്കൊണ്ട്’ എന്ന് വിശദീകരിച്ച് പറയുക.
  rationale: ഗ്രീക്ക് പാഠം വംശബന്ധത്തെയും വാഗ്ദാനത്തെയും ബന്ധിപ്പിക്കുന്നുവെങ്കിലും വാഗ്ദാനത്തിന്റെ സ്വീകർത്താവിനെയോ നിറവേറലിന്റെ സ്വഭാവത്തെയോ ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രബന്ധം വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- issue: σωτήρ എന്ന പദത്തിന്റെ അവതരണം
  choice: ‘രക്ഷകനായ യേശു’
  alternative: ‘വിമോചകനായ യേശു’
  rationale: ‘രക്ഷകൻ’ എന്നത് പദത്തിന്റെ വ്യാപകവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ അർഥം വഹിക്കുന്നു; രാഷ്ട്രീയമോ താൽക്കാലികമോ ആയ വിടുതലിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിന്റെ പദക്രമം അതേപടി അനുകരിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമം സ്വീകരിച്ചു; എന്നാൽ ദൈവം, ഇസ്രായേൽ, രക്ഷകനായ യേശു, വാഗ്ദാനം, ദാവീദീയ സന്തതി എന്നീ ബന്ധങ്ങൾ മാറ്റമില്ലാതെ സൂക്ഷിച്ചു.
