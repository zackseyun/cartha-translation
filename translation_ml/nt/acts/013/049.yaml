id: ACT.13.49
reference: Acts 13:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: ml
  text: കർത്താവിന്റെ വചനം ആ പ്രദേശത്തെങ്ങും പ്രചരിച്ചുകൊണ്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘കർത്താവിന്റെ സന്ദേശം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: പ്രചരിച്ചുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണകാല രൂപം ഭൂതകാലത്തിൽ തുടർന്നുകൊണ്ടിരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ രൂപം കർമണിപ്രയോഗമാണെങ്കിലും, മലയാളത്തിലെ സ്വാഭാവികമായ ഈ പ്രയോഗം സന്ദേശം വ്യാപകമായി പ്രചരിക്കപ്പെട്ടുകൊണ്ടിരുന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആഖ്യാനബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്ന വിരുദ്ധാർഥസൂചന ചേർക്കുന്നത് ഒഴിവാക്കി.
- source_word: ὁ λόγος
  choice: വചനം
  rationale: പ്രവൃത്തികളിൽ λόγος പ്രസംഗിക്കപ്പെടുന്ന സുവിശേഷസന്ദേശത്തെ സൂചിപ്പിക്കാറുണ്ട്. ‘വചനം’ ലൂക്കോസിന്റെ ആവർത്തിത പ്രയോഗവും ദൈവിക സന്ദേശമെന്ന ഭാവവും സംരക്ഷിക്കുന്നു; ‘സന്ദേശം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന പദത്തിന്റെ അംഗീകൃതവും സ്വാഭാവികവുമായ മലയാള സമാനപദം ‘കർത്താവ്’ ആണ്. ഇത് അധികാരവും ക്രിസ്തുശാസ്ത്രപരമായ പ്രതിധ്വനിയും അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: δι’ ὅλης τῆς χώρας
  choice: ആ പ്രദേശത്തെങ്ങും
  rationale: διά സഹിതമുള്ള ഈ പ്രയോഗം ഒരു ഭൂവിഭാഗത്തിലുടനീളമുള്ള വ്യാപ്തിയെ സൂചിപ്പിക്കുന്നു. χώρα ആധുനിക രാഷ്ട്രമല്ല, ചുറ്റുമുള്ള പ്രദേശമാണ്; ‘പ്രദേശത്തെങ്ങും’ സമഗ്രവ്യാപ്തി സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ‘കർത്താവ്’ എന്നത് മലയാള ബൈബിൾഭാഷയിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്; ഇവിടെ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനോടു ബന്ധപ്പെട്ട ക്രിസ്തുശാസ്ത്രപരമായ ഭാവവും വെറും അധികാരപദമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ὁ λόγος എന്നതിലെ അർഥവ്യാപ്തി
  choice: വചനം
  alternative: സന്ദേശം
  rationale: ‘വചനം’ മൂലപദത്തിന്റെ സാഹിത്യപരവും ദൈവശാസ്ത്രപരവുമായ പ്രതിധ്വനി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് പ്രസംഗിക്കപ്പെട്ട സന്ദേശമാണെന്ന അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പ്രദേശത്തെങ്ങും’ സമഗ്രവ്യാപ്തി സ്വാഭാവികമായി നൽകുന്നു; ‘പ്രചരിച്ചുകൊണ്ടിരുന്നു’ ഭൂതകാലത്തിലെ തുടർച്ചയായ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
