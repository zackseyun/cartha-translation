id: ACT.13.38
reference: Acts 13:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: ml
  text: 'അതിനാൽ, സഹോദരന്മാരേ[a], ഇതു നിങ്ങൾ അറിയട്ടെ: അവനിലൂടെ[b] നിങ്ങൾക്കു പാപമോചനം പ്രഖ്യാപിക്കപ്പെടുന്നു; മോശെയുടെ നിയമത്താൽ നിങ്ങൾക്കു നീതീകരിക്കപ്പെടാൻ[c] കഴിയാതിരുന്ന സകലത്തിൽനിന്നും—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സദസ്സിനെ ഉൾക്കൊള്ളുന്ന അഭിസംബോധനയായി മനസ്സിലാക്കിയാൽ, ‘സഹോദരീസഹോദരന്മാരേ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, തൊട്ടുമുമ്പ് പരാമർശിക്കപ്പെട്ട യേശുവിലൂടെ.
    reason: cross_reference
  - marker: c
    text: അഥവാ, ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: അതിനാൽ ... നിങ്ങൾ അറിഞ്ഞിരിക്കട്ടെ
  rationale: οὖν എന്ന നിഗമനബന്ധം ‘അതിനാൽ’ എന്നു വ്യക്തമാക്കുന്നു; γνωστὸν ... ἔστω എന്ന പരോക്ഷ ആജ്ഞയുടെ പ്രഖ്യാപനാത്മക ശക്തി സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും കുടുംബബന്ധസൂചകമായ ഭാവവും നിലനിർത്തുന്നു; സദസ്സിനെ ഉൾക്കൊള്ളുന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: διὰ τούτου
  choice: ഈ വ്യക്തിയിലൂടെ
  rationale: പുരുഷലിംഗ ഏകവചന സർവനാമം മുമ്പ് പരാമർശിച്ച യേശുവിലേക്കാണ് ചൂണ്ടുന്നത്. ‘ഈ വ്യക്തി’ എന്നത് ‘മനുഷ്യൻ’ എന്ന പദം അനാവശ്യമായി ചേർക്കാതെ വ്യക്തിപരമായ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: പാപങ്ങളുടെ മോചനം
  rationale: പാപങ്ങളിൽനിന്നുള്ള വിടുതൽ/ക്ഷമ എന്ന അർഥം വ്യക്തവും സഭാഭാഷയിൽ മാത്രം ഒതുങ്ങാത്തതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: καταγγέλλεται
  choice: പ്രഖ്യാപിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും പരസ്യമായ സുവിശേഷപ്രഖ്യാപനത്തിന്റെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ πάντων ὧν
  choice: സകലത്തിൽനിന്നും
  rationale: ആവർത്തനമുള്ള ഗ്രീക്ക് ഘടന മലയാളത്തിൽ അസ്വാഭാവികമാക്കാതെ സമഗ്രതയും തുടർന്നുവരുന്ന ബന്ധവാക്യത്തിന്റെ ആശയവും നൽകുന്നു.
- source_word: οὐκ ἠδυνήθητε
  choice: നിങ്ങൾക്കു ... കഴിയാതിരുന്ന
  rationale: കഴിവില്ലായ്മയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥവും ഭൂതകാലപരമായ ദൃഷ്ടിയും സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു നൽകുന്നു.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: മോശെയുടെ നിയമത്താൽ
  rationale: ἐν ഇവിടെ നിയമം മുഖേനയോ അതിന്റെ പരിധിയിലോ നീതീകരണം നേടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘നിയമത്താൽ’ ഉപകരണാർഥം സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: δικαιωθῆναι
  choice: നീതീകരിക്കപ്പെടാൻ
  rationale: നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന അംഗീകൃത പദം; ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുക’ എന്ന വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: മോശെയുടെ നിയമത്തോടുള്ള ബന്ധത്തിൽ δικαιωθῆναι എന്നതിന്റെ പരിഭാഷ
  choice: നീതീകരിക്കപ്പെടാൻ
  alternative: നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടാൻ
  rationale: നിയമപരമായ പ്രഖ്യാപനത്തിന്റെ ഭാവം ഉൾപ്പെടെ പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: ἄνδρες ἀδελφοί എന്ന ലിംഗസൂചക അഭിസംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുരുഷലിംഗരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സമ്മിശ്ര സദസ്സിനെ ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ഇംഗ്ലീഷ് ആലോചനാപാഠത്തിൽ ചേർത്തിരിക്കുന്ന ‘everyone who believes is justified’ എന്ന വാക്യഭാഗം
  choice: ഈ കരടിൽ ചേർത്തിട്ടില്ല
  alternative: ‘വിശ്വസിക്കുന്ന ഏവനും നീതീകരിക്കപ്പെടുന്നു’ എന്നു ചേർക്കുക
  rationale: നൽകിയ SBLGNT മൂലപാഠം δικαιωθῆναι എന്ന പദത്തിൽ അവസാനിക്കുന്നു; ചേർത്ത വാക്യഭാഗം തുടർന്നുള്ള ഗ്രീക്ക് സന്ദർഭത്തിൽ നിന്നുള്ളതാണ്. ഈ വാക്യത്തിന്റെ നൽകിയ മൂലസാക്ഷ്യത്തിന് മുൻഗണന നൽകി തുടർച്ച സൂചിപ്പിക്കാൻ ദീർഘരേഖ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിന്റെ വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനം ദീർഘരേഖ നൽകി അപൂർണത മറച്ചിട്ടില്ല; നൽകിയ ഗ്രീക്ക് പാഠത്തിൽ ഇല്ലാത്ത തുടർവാക്യം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
