id: ACT.13.11
reference: Acts 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: ml
  text: ഇപ്പോൾ ഇതാ, കർത്താവിന്റെ കൈ നിന്റെമേൽ ഉണ്ട്; നീ കുറച്ചുകാലത്തേക്ക് സൂര്യനെ കാണാതെ അന്ധനായിരിക്കും. ഉടനെ അവന്റെമേൽ കാഴ്ചമങ്ങലും ഇരുട്ടും വീണു; അവൻ അങ്ങുമിങ്ങും നടന്നുകൊണ്ട്, തന്നെ കൈപിടിച്ചു നയിക്കാൻ ആളുകളെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സജീവതയും ഗൗരവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: χεὶρ κυρίου
  choice: കർത്താവിന്റെ കൈ
  rationale: ദൈവിക പ്രവർത്തനത്തെയും ഇവിടെ ന്യായവിധിയെയും സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἔσῃ τυφλὸς
  choice: അന്ധനായിരിക്കും
  rationale: εἰμίയുടെ ഭാവികാലവും വിധേയവിശേഷണവും സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അന്ധത ആരംഭിക്കുമെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: സൂര്യനെ കാണാതെ
  rationale: ‘സൂര്യൻ’ എന്ന മൂർത്തമായ പരാമർശം പൊതുവായ ‘വെളിച്ചം’ എന്നാക്കി മാറ്റാതെ പങ്കാളിക്രിയയുടെ വിവരണാത്മക ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: ἄχρι καιροῦ
  choice: കുറച്ചുകാലത്തേക്ക്
  rationale: നിശ്ചയിക്കപ്പെടാത്ത ഒരു താൽക്കാലിക കാലയളവിനെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παραχρῆμα
  choice: ഉടനെ
  rationale: സംഭവത്തിന്റെ പെട്ടെന്നുള്ള നടപ്പാക്കൽ ചുരുക്കമായും വ്യക്തമായും അറിയിക്കുന്നു.
- source_word: ἀχλὺς καὶ σκότος
  choice: ഒരു മങ്ങലും ഇരുട്ടും
  rationale: കാഴ്ചയെ മൂടുന്ന ἀχλύς എന്ന ആശയത്തിന് ‘മങ്ങൽ’ യോജിക്കുന്നു; σκότος എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ഇരുട്ട്’ നിലനിർത്തുന്നു.
- source_word: περιάγων
  choice: ചുറ്റിനടന്ന്
  rationale: ‘അങ്ങിങ്ങായി സഞ്ചരിക്കുക’ എന്ന പങ്കാളിക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ‘തപ്പിത്തടഞ്ഞ്’ എന്ന സന്ദർഭാനുമാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐζήτει χειραγωγούς
  choice: തന്നെ കൈപിടിച്ചു നടത്താൻ ആളുകളെ അന്വേഷിച്ചുകൊണ്ടിരുന്നു
  rationale: χειραγωγός എന്നത് കൈപിടിച്ചു നയിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ, പൊതുവായ ‘വഴികാട്ടികൾ’ എന്നതിനെക്കാൾ മൂർത്തമായ അർഥം നൽകുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവിന്റെ കൈ’ എന്ന പ്രയോഗത്തിന്റെ സ്വഭാവം
  choice: 'രൂപകം നിലനിർത്തി: ‘കർത്താവിന്റെ കൈ നിന്റെമേൽ വന്നിരിക്കുന്നു’'
  alternative: ‘കർത്താവിന്റെ ന്യായവിധി നിന്റെമേൽ വന്നിരിക്കുന്നു’ / ‘കർത്താവ് നിന്നെ പ്രഹരിക്കുന്നു’
  rationale: സന്ദർഭത്തിൽ ഇത് ദൈവിക ന്യായവിധിയാണെങ്കിലും, മൂലവാചകം പ്രവർത്തനത്തെ ‘കൈ’ എന്ന ബൈബിൾ രൂപകത്തിലൂടെ അവതരിപ്പിക്കുന്നു. അതിനെ വ്യാഖ്യാനപരമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: ἄχρι καιροῦ സൂചിപ്പിക്കുന്ന കാലപരിധി
  choice: ‘കുറച്ചുകാലത്തേക്ക്’ എന്ന താൽക്കാലികവും അനിശ്ചിതവുമായ വായന
  alternative: ‘ഒരു നിശ്ചിത സമയംവരെ’
  rationale: καιρός ഇവിടെ കാലാവധിയുടെ കൃത്യമായ ദൈർഘ്യം പറയുന്നില്ല; ശിക്ഷ സ്ഥിരമല്ലെന്ന അർഥം മാത്രം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ രൂപകവും ‘സൂര്യൻ’ എന്ന ദൃശ്യബിംബവും സംരക്ഷിച്ചു; സന്ദർഭത്തിൽനിന്നുള്ള അനാവശ്യ വ്യാഖ്യാനങ്ങൾ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
