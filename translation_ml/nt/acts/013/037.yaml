id: ACT.13.37
reference: Acts 13:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: ml
  text: എന്നാൽ ദൈവം ഉയിർപ്പിച്ചവൻ അഴുകൽ കണ്ടില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ജീർണത.’ ഗ്രീക്ക് പദം ശരീരത്തിന്റെ അഴുകലിനെയോ ജീർണതയെയോ സൂചിപ്പിക്കാം; സങ്കീർത്തനം 16:10-ന്റെ ഗ്രീക്ക് പാഠത്തിലെ പദപ്രയോഗം ഇവിടെ പ്രതിധ്വനിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ദൈവം ഉയിർപ്പിച്ചവൻ
  rationale: ബന്ധസർവനാമം മുമ്പ് പരാമർശിക്കപ്പെട്ട യേശുവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദൈവം ഉയിർപ്പിച്ചവൻ’ എന്ന ബന്ധവാക്യരൂപം സ്വാഭാവികവും ഗ്രീക്കിലെ അർഥത്തോട് വിശ്വസ്തവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മരിച്ച് ജീർണത കണ്ട ദാവീദിനും ജീർണത കാണാത്ത യേശുവിനും ഇടയിലെ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: നിർദിഷ്ട ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἤγειρεν
  choice: ഉയിർപ്പിച്ച
  rationale: സന്ദർഭം മരിച്ചവരിൽനിന്നുള്ള ഉയിർപ്പിനെ നിർണ്ണായകമായി സൂചിപ്പിക്കുന്നു. ‘ഉയിർപ്പിച്ചു’ എന്നത് ആ അർഥം വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: οὐκ εἶδεν
  choice: കണ്ടില്ല
  rationale: സങ്കീർത്തനം 16:10-ന്റെ ഗ്രീക്ക് പാഠത്തോടുള്ള വാചികബന്ധം നിലനിർത്താൻ ‘കാണുക’ എന്ന പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: διαφθοράν
  choice: ജീർണത
  rationale: ശരീരത്തിന്റെ അഴുകലിനെയോ നാശാവസ്ഥയെയോ സൂചിപ്പിക്കുന്ന പദം. ‘ജീർണത’ ആ ആശയം dignified modern Malayalam-ൽ നൽകുകയും ‘അഴുകൽ’ എന്ന കൂടുതൽ ദൃശ്യമായ പര്യായത്തേക്കാൾ സങ്കീർത്തനപ്രതിധ്വനിക്ക് യോജിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἤγειρεν എന്നതിന്റെ ഉയിർപ്പ്-അർഥം
  choice: ദൈവം യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു എന്ന അർഥത്തിൽ ‘ഉയിർപ്പിച്ച’
  alternative: നിയോഗിച്ചു അഥവാ രംഗത്തേക്ക് കൊണ്ടുവന്നു എന്ന അർഥത്തിൽ ‘എഴുന്നേല്പിച്ച’
  rationale: മരിച്ച് ജീർണത കണ്ട ദാവീദിനോട്, ദൈവം ഉയിർപ്പിച്ചതിനാൽ ജീർണത കാണാത്ത യേശുവിനെ ഈ സന്ദർഭം വൈരുധ്യപ്പെടുത്തുന്നു; അതിനാൽ പുനരുത്ഥാനാർഥമാണ് ഇവിടെ നിർണ്ണായകം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘കണ്ടില്ല’ എന്ന അക്ഷരാർഥപ്രയോഗം തിരുവെഴുത്തിലെ അന്തർപാഠബന്ധം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് ശരീരജീർണതയുടെ അർഥം വ്യക്തമാക്കുന്നു.
