id: ACT.13.39
reference: Acts 13:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τούτῳ πᾶς ὁ πιστεύων δικαιοῦται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: ml
  text: അവനിൽ, വിശ്വസിക്കുന്ന ഏവനും നീതീകരിക്കപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇവനാൽ.” ഗ്രീക്കിലെ ἐν τούτῳ എന്ന പ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ “ഇവനിൽ” എന്നോ “ഇവനാൽ” എന്നോ വിവർത്തനം ചെയ്യാം; ഇവിടെ അത് യേശുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: അവനിൽ
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ പരാമർശിക്കപ്പെട്ട യേശുവിലേക്കാണ് സൂചകസർവനാമം വിരൽചൂണ്ടുന്നത്. ഗ്രീക്കിലെ ἐν എന്ന പൂർവപ്രത്യയത്തിന്റെ രൂപവും വ്യക്തിപരമായ പരാമർശവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πᾶς ὁ πιστεύων
  choice: വിശ്വസിക്കുന്ന ഏവനും
  rationale: നാമസമാനമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പൊതുവ്യാപക അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δικαιοῦται
  choice: നീതീകരിക്കപ്പെടുന്നു
  rationale: δικαιόω എന്ന പദത്തിന്റെ നിയമപരമായ അർഥവും പൗലൊസിന്റെ പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും അനാവശ്യ വ്യാഖ്യാനവികാസമില്ലാതെ സംരക്ഷിക്കുന്ന സ്ഥാപിത മലയാളപദമാണ്.
theological_decisions:
- issue: ἐν τούτῳ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: യേശുവിനെ വ്യക്തിപരമായി സൂചിപ്പിക്കുന്ന “അവനിൽ”
  alternative: “ഇവനാൽ” / “ഇവനിൽ”
  rationale: മുൻവാക്യത്തിൽ പാപമോചനം പ്രഖ്യാപിക്കപ്പെടുന്നത് യേശുവിലൂടെയാണെന്ന് പറഞ്ഞതിനാൽ, തുടർന്നുള്ള ഈ വാക്യഭാഗത്തിലും അവനെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നാൽ പൂർവപ്രത്യയത്തിന് ഉപകരണാർഥം ഗ്രഹിക്കാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: പൗലൊസിന്റെ സന്ദർഭത്തിൽ δικαιοῦται എന്നതിന്റെ വിവർത്തനം
  choice: “നീതീകരിക്കപ്പെടുന്നു”
  alternative: “നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുന്നു” / “കുറ്റവിമുക്തനാക്കപ്പെടുന്നു”
  rationale: നിയമവും നീതീകരണവും തമ്മിലുള്ള സമീപസന്ദർഭത്തിലെ ബന്ധം കണക്കിലെടുത്ത് നിയമപരമായ അർഥം സംരക്ഷിക്കുന്നു; അതിനെ ധാർമ്മിക പരിവർത്തനമായി ചുരുക്കുകയോ “കുറ്റവിമുക്തി” മാത്രമായി പരിമിതപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. “നീതീകരിക്കപ്പെടുന്നു” എന്ന സഭാപരിചിത പദം അതിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ കൃത്യത കാരണം നിലനിർത്തി; അടിക്കുറിപ്പ് വ്യാകരണപരമായ പര്യായവായന വ്യക്തമാക്കുന്നു.
