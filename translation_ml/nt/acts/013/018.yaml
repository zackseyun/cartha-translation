id: ACT.13.18
reference: Acts 13:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: ml
  text: ഏകദേശം നാൽപ്പത് വർഷം അവൻ മരുഭൂമിയിൽ അവരെ സഹിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവരെ സഹിച്ചു’ എന്നതിനുപകരം ‘അവരെ പരിപാലിച്ചു’ എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള ലളിതമായ ആഖ്യാനബന്ധമാണ്. ഒറ്റവാക്യമായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘പിന്നെ’ അല്ലെങ്കിൽ ‘കൂടാതെ’ ചേർക്കുന്നത് അനാവശ്യമായ അർത്ഥഭാരം സൃഷ്ടിക്കാം.
- source_word: ὡς
  choice: ഏകദേശം
  rationale: കാലയളവിനോടൊപ്പം ഏകദേശത സൂചിപ്പിക്കുന്നു; നാല്പതു വർഷം കൃത്യഗണനയായി അമർത്താതെ മൂലപാഠത്തിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: τεσσερακονταετῆ χρόνον
  choice: നാല്പതു വർഷത്തോളം
  rationale: നാല്പതു വർഷത്തെ കാലയളവ് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘ത്തോളം’ കാലദൈർഘ്യവും ὡς സൂചിപ്പിക്കുന്ന ഏകദേശതയും ചേർത്ത് അറിയിക്കുന്നു.
- source_word: ἐτροποφόρησεν
  choice: സഹിച്ചു
  rationale: SBLGNT-യിലെ വായനയ്ക്ക് അനുസരിച്ച് ‘ക്ഷമയോടെ സഹിക്കുക/പൊറുക്കുക’ എന്ന ആശയം സംക്ഷിപ്തവും മാന്യവുമായി നൽകുന്നു; പരിപാലിച്ചു എന്ന വ്യത്യസ്ത വായന പ്രധാനപാഠത്തിൽ കലർത്തുന്നില്ല.
- source_word: αὐτοὺς
  choice: അവരെ
  rationale: സന്ദർഭത്തിലെ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള കർമസർവനാമം.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: ഇസ്രായേലിന്റെ അലച്ചിൽ നടന്ന വനാന്തര/മരുപ്രദേശത്തെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: മരുഭൂമിയിൽ ഇസ്രായേലിനോടുള്ള ദൈവത്തിന്റെ പ്രവൃത്തിയുടെ അർത്ഥം
  choice: അവരെ സഹിച്ചു
  alternative: അവരെ പരിപാലിച്ചു
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ ἐτροποφόρησεν ‘സഹിക്കുക’ എന്ന അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു; അതിനാൽ ഇസ്രായേലിന്റെ പെരുമാറ്റത്തോടുള്ള ദൈവത്തിന്റെ ദീർഘക്ഷമയെ പ്രധാനപാഠത്തിൽ മൃദൂകരിച്ചിട്ടില്ല. എന്നാൽ ‘പരിപാലിച്ചു’ എന്നർത്ഥമുള്ള പ്രസിദ്ധമായ പാഠഭേദം അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘സഹിച്ചു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
