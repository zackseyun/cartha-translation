id: ACT.13.50
reference: Acts 13:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: ml
  text: എന്നാൽ യെഹൂദന്മാർ ദൈവഭക്തരായ, സമൂഹത്തിൽ മാന്യസ്ഥാനമുള്ള സ്ത്രീകളെ[a]യും നഗരത്തിലെ പ്രമുഖരായ പുരുഷന്മാരെയും പ്രേരിപ്പിച്ചു. അവർ പൗലോസിനും ബർന്നബാസിനും എതിരായി പീഡനം ഉണർത്തുകയും അവരെ അവരുടെ പ്രദേശത്തുനിന്ന് പുറത്താക്കുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവഭക്തരായ സ്ത്രീകൾ’ എന്നത് ‘ദൈവത്തെ ആരാധിച്ചിരുന്ന സ്ത്രീകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഇസ്രായേലിന്റെ ദൈവത്തെ ആരാധിക്കുകയും സിനഗോഗുമായി ബന്ധപ്പെടുകയും ചെയ്തിരുന്ന വിജാതീയ സ്ത്രീകളെ ഈ പ്രയോഗം സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ പ്രദേശത്തുനിന്ന്’ എന്നത് ‘അവരുടെ അതിർത്തികൾക്കപ്പുറത്തേക്ക്’ അല്ലെങ്കിൽ ‘അവരുടെ ദേശപരിധിയിൽനിന്ന്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം അതിർത്തികളെയോ അവയ്ക്കുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: എന്നാൽ യെഹൂദന്മാർ
  rationale: δέ മുൻവാക്യത്തിലെ അനുകൂല പ്രതികരണത്തിൽനിന്നുള്ള വൈരുധ്യപരമായ കഥാമാറ്റം സൂചിപ്പിക്കുന്നു; ‘എന്നാൽ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παρώτρυναν
  choice: ഇളക്കിവിട്ടു
  rationale: മറ്റുള്ളവരെ സജീവമായി പ്രേരിപ്പിച്ച് വിരോധത്തിലാക്കുന്ന അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായും ശക്തമായും നൽകുന്നു.
- source_word: σεβομένας γυναῖκας
  choice: ദൈവഭക്തരായ ... സ്ത്രീകൾ
  rationale: σέβομαι ഇവിടെ ഇസ്രായേലിന്റെ ദൈവത്തെ ആരാധിച്ചിരുന്ന സ്ത്രീകളെ സൂചിപ്പിക്കാം. ‘ദൈവഭക്തർ’ അവരുടെ മതപരമായ ഭക്തി വ്യക്തമാക്കുന്നു; സിനഗോഗുമായി ബന്ധപ്പെട്ട വിജാതീയ അനുയായികൾ എന്ന സാങ്കേതിക പദവി നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: εὐσχήμονας
  choice: സമൂഹത്തിൽ മാന്യസ്ഥാനമുള്ള
  rationale: സാമൂഹിക മാന്യതയും ഉയർന്ന നിലയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗം.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: നഗരത്തിലെ പ്രമുഖരായ പുരുഷന്മാർ
  rationale: നഗരത്തിലെ മുൻനിര പൗരപ്രമുഖരെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ വ്യക്തമായ പുരുഷലിംഗ സൂചന നിലനിർത്തുന്നു.
- source_word: ἐπήγειραν διωγμὸν
  choice: പീഡനം ഇളക്കിവിട്ടു
  rationale: പീഡനം ഉണ്ടാകാൻ കാരണമായ സജീവ പ്രേരണയെ പ്രകടമാക്കുന്നു; മുൻ ക്രിയയുമായുള്ള അർത്ഥസാമ്യവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: പൗലോസിനും ബർന്നബാസിനും എതിരായി
  rationale: പീഡനത്തിന്റെ ശത്രുതാപരമായ ലക്ഷ്യദിശ വ്യക്തമാക്കുന്നു.
- source_word: ἐξέβαλον
  choice: പുറത്താക്കി
  rationale: ബലപ്രയോഗത്തോടെയുള്ള പുറത്താക്കലിന്റെ അർത്ഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: തങ്ങളുടെ പ്രദേശത്തുനിന്ന്
  rationale: ὅρια അതിർത്തികളെയോ അവയ്ക്കുള്ളിലെ പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; ഈ പൗരസാഹചര്യത്തിൽ ‘പ്രദേശം’ സ്വാഭാവികമാണ്, എന്നാൽ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: σεβομένας എന്നതിന്റെ മതപരവും സാമൂഹികവുമായ സൂചന
  choice: ദൈവഭക്തരായ സ്ത്രീകൾ
  alternative: ദൈവത്തെ ആരാധിച്ചിരുന്ന സ്ത്രീകൾ; ഭക്തരായ സ്ത്രീകൾ
  rationale: ഇസ്രായേലിന്റെ ദൈവത്തെ ആരാധിച്ചിരുന്ന, ഒരുപക്ഷേ സിനഗോഗുമായി ബന്ധപ്പെട്ട വിജാതീയ സ്ത്രീകളാകാമെന്ന സാധ്യത തുറന്നുവെക്കുന്നു; അവരുടെ കൃത്യമായ ഔദ്യോഗിക പദവി നിർണയിക്കുന്നില്ല.
- issue: τοὺς πρώτους എന്ന സാമൂഹികമായി അടയാളപ്പെടുത്തിയ പുരുഷലിംഗ പ്രയോഗം
  choice: നഗരത്തിലെ പ്രമുഖരായ പുരുഷന്മാർ
  alternative: നഗരനേതാക്കൾ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ബഹുവചന സൂചനയെ ലിംഗനിരപേക്ഷമാക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: ὅρια എന്ന പദത്തിന്റെ സ്ഥലപരമായ വ്യാപ്തി
  choice: പ്രദേശം
  alternative: അതിർത്തികൾ; ദേശപരിധി
  rationale: സംഭവസന്ദർഭത്തിൽ നഗരാധികാരപരിധിക്കുള്ള പ്രദേശം ഉദ്ദേശിച്ചിരിക്കാം; പദത്തിന് അതിർത്തികളെന്ന നേരിട്ടുള്ള അർത്ഥവും ഉള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി. സാമൂഹിക പദവിയും വിരോധത്തിന്റെ ശക്തിയും വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; സാങ്കേതികമോ വിഭാഗീയമോ ആയ മതപദപ്രയോഗം ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങളിൽ ചേർത്തിട്ടുണ്ട്.
