  terminology: ‘ദൈവഭക്തരായ,’ ‘സമൂഹത്തിൽ മാന്യസ്ഥാനമുള്ള,’ and ‘നഗരത്തിലെ പ്രമുഖരായ പുരുഷന്മാർ’ appropriately preserve the religious, social, and masculine references without over-specifying the women’s status. ‘പ്രദേശം’ suitably renders the ambiguity of ὅρια, retained in the footnote.
  issues:
