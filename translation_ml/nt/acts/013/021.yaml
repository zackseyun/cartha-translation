id: ACT.13.21
reference: Acts 13:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: ml
  text: അതിനുശേഷം അവർ ഒരു രാജാവിനെ ആവശ്യപ്പെട്ടു[a]. ദൈവം അവർക്കു കീശിന്റെ മകനും ബെന്യാമീൻ ഗോത്രത്തിൽനിന്നുള്ള ഒരുവനുമായ ശൗലിനെ നാല്പത് വർഷത്തേക്ക് നൽകി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടെനിന്ന് അവർ ഒരു രാജാവിനെ ആവശ്യപ്പെട്ടു.” ആരംഭത്തിലെ പദം ചരിത്രസംഭവങ്ങളുടെ ക്രമത്തിലെ ഒരു സംക്രമണസൂചനയായും പ്രവർത്തിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: പഴയനിയമത്തിലെ വിവരങ്ങളുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ “നാല്പത് വർഷം” എന്നത് കാലഗണനാപരമായ ചോദ്യങ്ങൾ ഉയർത്താമെന്ന് ചില വായനക്കാർ ചൂണ്ടിക്കാണിക്കുന്നു; ലൂക്കൊസ് നൽകിയിരിക്കുന്ന വാക്കുകൾ പരിഭാഷ അതേപടി നിലനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: അതിനുശേഷം
  rationale: ചരിത്രസംഭവങ്ങളുടെ ക്രമത്തിലെ മാറ്റം സൂചിപ്പിക്കുന്ന സംക്രമണപ്രയോഗമായി ഇവിടെ സ്വാഭാവികമാണ്; അക്ഷരാർഥത്തിലുള്ള സ്ഥലസൂചനയായ ‘അവിടെനിന്ന്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ᾐτήσαντο
  choice: ആവശ്യപ്പെട്ടു
  rationale: ജനങ്ങൾ തങ്ങൾക്കായി ഒരു രാജാവിനെ ചോദിച്ചുവെന്ന മധ്യമരൂപത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘നിർബന്ധിച്ചു’ എന്നതുപോലെ ഭാവം കടുപ്പിക്കുന്നില്ല.
- source_word: βασιλέα
  choice: ഒരു രാജാവിനെ
  rationale: നിശ്ചിതനായ ഒരാളെക്കാൾ അവർ ആവശ്യപ്പെട്ട ഭരണാധികാരിയുടെ തരത്തെയാണ് അനാർത്രസ് നാമം സൂചിപ്പിക്കുന്നത്.
- source_word: ἔδωκεν
  choice: നൽകി
  rationale: പൊതുവായ ‘കൊടുക്കുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; ‘നിയമിച്ചു’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ കർത്താവിനെ അതേപടി നിലനിർത്തുന്നു.
- source_word: τὸν Σαοὺλ
  choice: ശൗലിനെ
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ പേരുരൂപം സ്വീകരിക്കുന്നു.
- source_word: υἱὸν Κίς
  choice: കീശിന്റെ മകനായ
  rationale: പിതൃനാമബന്ധം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ട
  rationale: ‘ബെന്യാമീൻ ഗോത്രത്തിൽനിന്നുള്ള ഒരു മനുഷ്യൻ’ എന്ന അർഥം ശൗലിനെ വിശേഷിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു; പുരുഷനായ വ്യക്തി എന്ന വിവരം പേരിലും പിതൃബന്ധത്തിലും സന്ദർഭത്തിലും വ്യക്തമാണ്.
- source_word: ἔτη τεσσεράκοντα
  choice: നാല്പതു വർഷത്തേക്ക്
  rationale: കാലദൈർഘ്യം വ്യക്തമാക്കുകയും അടുത്തുള്ള ദൈവം ശൗലിനെ നൽകിയെന്ന വാക്യഭാഗത്തോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἔτη τεσσεράκοντα എന്ന കാലദൈർഘ്യപ്രയോഗത്തിന്റെ ബന്ധം
  choice: ശൗലിനെ ദൈവം നൽകിയ കാലയളവായി ‘നാല്പതു വർഷത്തേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ചരിത്രസംക്ഷേപവുമായി കൂടുതൽ അയഞ്ഞ രീതിയിൽ ബന്ധിപ്പിക്കാം; പഴയനിയമത്തിലെ കാലഗണനയുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ ചോദ്യങ്ങൾ ഉയരുന്നതായും ചിലർ കാണുന്നു.
  rationale: ഗ്രീക്ക് വാക്യക്രമത്തിൽ ഇത് തൊട്ടുമുമ്പുള്ള ദൈവം ശൗലിനെ നൽകിയെന്ന വാക്യഭാഗത്തോടാണ് ഏറ്റവും സ്വാഭാവികമായി ചേരുന്നത്. കാലഗണനാപരമായ സംഘർഷം പരിഭാഷയിൽ പരിഹരിക്കാതെ പാഠത്തിന്റെ വാക്കുകൾ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ചരിത്രവിവരണശൈലി. ‘ആവശ്യപ്പെട്ടു’, ‘ഗോത്രത്തിൽപ്പെട്ട’, ‘നാല്പതു വർഷത്തേക്ക്’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; പാഠത്തിലെ സംക്രമണപരവും കാലഗണനാപരവുമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
