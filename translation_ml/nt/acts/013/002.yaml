id: ACT.13.2
reference: Acts 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: ml
  text: 'അവർ കർത്താവിനെ ശുശ്രൂഷിക്കുകയും ഉപവസിക്കുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ[a], പരിശുദ്ധാത്മാവ് പറഞ്ഞു: “ബർന്നബാസിനെയും ശൗലിനെയും ഞാൻ അവരെ വിളിച്ചിരിക്കുന്ന പ്രവൃത്തിക്കായി എനിക്കുവേണ്ടി വേർതിരിക്കുവിൻ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവിനെ ആരാധിക്കുകയും ഉപവസിക്കുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ആരാധനാത്മകമോ അനുഷ്ഠാനപരമോ ആയ ഭാവമുള്ള സേവനത്തെ സൂചിപ്പിക്കാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: ശുശ്രൂഷിക്കുകയും
  rationale: ഈ ക്രിയയ്ക്ക് ആരാധനാത്മകമോ അനുഷ്ഠാനപരമോ ആയ സൂചനകളോടുകൂടിയ സേവനം എന്ന അർഥമുണ്ട്. ‘ശുശ്രൂഷിക്കുക’ സേവനത്തിന്റെയും ആരാധനയുടെയും മാനങ്ങൾ നിലനിർത്തുന്നു; എന്നാൽ ആരാധന മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനെ
  rationale: മലയാളത്തിൽ ‘ശുശ്രൂഷിക്കുക’ എന്ന ക്രിയയോടൊപ്പം ലക്ഷ്യത്തെ സൂചിപ്പിക്കാൻ ‘കർത്താവിനെ’ എന്ന പ്രയോഗം സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ ദാതൃവിഭക്തി ശുശ്രൂഷ ആരിലേക്കാണ് ലക്ഷ്യമിടുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: νηστευόντων
  choice: ഉപവസിക്കുകയും ചെയ്തുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: രണ്ട് വർത്തമാനകൃदന്തരൂപങ്ങളും ഒരേ സമയത്ത് നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തികളാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ആധുനിക മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രൂപം; ഗ്രീക്കിലുള്ള സംസാരിക്കുന്ന വ്യക്തിപരമായ കർത്താവിനെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: Ἀφορίσατε δή
  choice: വേർതിരിക്കുവിൻ
  rationale: പ്രത്യേക ഉദ്ദേശ്യത്തിനായി മാറ്റിവയ്ക്കുക എന്ന ആജ്ഞയുടെ ഭാവം നൽകുന്നു. δή നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ നേരിട്ടുള്ള ആജ്ഞാശൈലിയിൽ ഉൾക്കൊള്ളുന്നു; പ്രത്യേക പദമായി ചേർത്താൽ ഉണ്ടാകാവുന്ന കൃത്രിമത്വം ഒഴിവാക്കുന്നു.
- source_word: μοι
  choice: എനിക്കുവേണ്ടി
  rationale: വേർതിരിക്കൽ ആരുടെ ഉദ്ദേശ്യത്തിനായാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: ബർന്നബാസിനെയും ശൗലിനെയും
  rationale: വ്യക്തിനാമങ്ങൾക്ക് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരൂപങ്ങൾ ഉപയോഗിക്കുന്നു; കർമവിഭക്തിയും സംയോജകഘടനയും വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: εἰς τὸ ἔργον
  choice: പ്രവൃത്തിക്കായി
  rationale: ἔργον എന്നതിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ശുശ്രൂഷ’ അല്ലെങ്കിൽ ഔദ്യോഗിക ‘ദൗത്യം’ എന്നു മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: ഞാൻ അവരെ വിളിച്ചിരിക്കുന്ന
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലരൂപത്തിലെ മുമ്പുണ്ടായ വിളിയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും ‘വിളിച്ചിരിക്കുന്ന’ എന്ന രൂപം സൂചിപ്പിക്കുന്നു. ‘അവരെ’ നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ ഘടനയോട് വിശ്വസ്തമാണ്.
theological_decisions:
- issue: സാമൂഹിക ഭക്തിയുടെയും ദൈവിക നിയോഗത്തിന്റെയും പശ്ചാത്തലത്തിൽ λειτουργούντων എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവിനെ ശുശ്രൂഷിക്കുകയും
  alternative: കർത്താവിനെ ആരാധിക്കുകയും / കർത്താവിനെ സേവിക്കുകയും
  rationale: പദത്തിന് ആരാധനാത്മക സേവനം എന്ന സൂചനയുണ്ടെങ്കിലും ഔപചാരിക ആരാധന മാത്രമാണ് ഉദ്ദേശ്യമെന്ന് വാക്യം നിർബന്ധിക്കുന്നില്ല. ‘ശുശ്രൂഷിക്കുക’ സേവനവും ഭക്തിയും ഒരുമിച്ച് ഉൾക്കൊള്ളുന്നു; ബദൽ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τὸ πνεῦμα τὸ ἅγιον എന്നതിന്റെ കർത്തൃത്വവും വ്യക്തിപരമായ പ്രവർത്തനവും
  choice: പരിശുദ്ധാത്മാവ് പറഞ്ഞു
  alternative: പരിശുദ്ധാത്മാവിലൂടെ അരുളപ്പെട്ടു
  rationale: ഗ്രീക്ക് വാക്യം പരിശുദ്ധാത്മാവിനെ നേരിട്ട് സംസാരിക്കുന്ന കർത്താവായി അവതരിപ്പിക്കുന്നു. കർമണിപ്രയോഗത്തിലൂടെ ആ വ്യക്തമായ കർത്തൃത്വം മങ്ങിപ്പോകാതിരിക്കാൻ നേരിട്ടുള്ള രൂപം നിലനിർത്തുന്നു.
- issue: ἀφορίσατε ... εἰς τὸ ἔργον എന്ന പ്രയോഗത്തിന്റെ സഭാഘടനാപരമായ വ്യാഖ്യാനം
  choice: പ്രവൃത്തിക്കായി ... വേർതിരിക്കുവിൻ
  alternative: ശുശ്രൂഷയ്ക്കായി നിയമിക്കുവിൻ / അഭിഷേകം ചെയ്യുവിൻ
  rationale: പ്രത്യേക ദൈവിക പ്രവർത്തനത്തിനുള്ള വേർതിരിക്കലും നിയോഗവും പാഠം വ്യക്തമാക്കുന്നു; എന്നാൽ സാങ്കേതിക പൗരോഹിത്യനിയമനമോ പ്രത്യേക സഭാപദവിയോ ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ പിന്നീട് രൂപപ്പെട്ട ഔദ്യോഗിക വിഭാഗങ്ങൾ പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ശൈലി പിന്തുടർന്നു. ‘ശുശ്രൂഷിക്കുക’, ‘പരിശുദ്ധാത്മാവ്’, ‘വേർതിരിക്കുവിൻ’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് പരിചിതമായിരിക്കെ മൂലപാഠത്തിലെ ആരാധന–സേവന ദ്വയാർഥവും ദൈവിക നിയോഗത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു. നേരിട്ടുള്ള ഉദ്ധരണിയിൽ മാന്യമായ ബഹുവചന ആജ്ഞാരൂപം ഉപയോഗിച്ചു.
