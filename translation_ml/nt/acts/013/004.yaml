source:
  edition: SBLGNT
  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: ml
  text: അങ്ങനെ, പരിശുദ്ധാത്മാവിനാൽ[a] അയയ്ക്കപ്പെട്ട അവർ സെലൂക്യയിലേക്കു ഇറങ്ങിച്ചെന്നു; അവിടെനിന്ന് കപ്പൽമാർഗം കുപ്രൊസിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരിശുദ്ധ ആത്മാവിനാൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘പരിശുദ്ധ ആത്മാവിനാൽ’ എന്നാണ്; എന്നാൽ അപ്പൊസ്തലപ്രവൃത്തികളിൽ ഈ പ്രയോഗം സാധാരണയായി ‘പരിശുദ്ധാത്മാവ്’ എന്നു വിവർത്തനം ചെയ്യുന്ന വ്യക്തിപരമായ ദൈവിക പ്രവർത്തകനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: അവർ
  rationale: പ്രകടമായ സർവനാമം നേരിയ ഊന്നൽ വഹിക്കുന്നു. മലയാളത്തിൽ വാക്യാരംഭത്തിലെ ‘അവർ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘അവർ തന്നേ’ എന്നു ചേർക്കുന്നത് സന്ദർഭത്തിൽ അമിതമായ ഊന്നലാകും.
- source_word: μὲν οὖν
  choice: അങ്ങനെ
  rationale: മുൻവാക്യത്തിലെ നിയോഗത്തിന്റെ ഫലമായി കഥ മുന്നോട്ടുപോകുന്നതും നിഗമനസ്വഭാവവും ഒരുമിച്ച് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκπεμφθέντες
  choice: അയയ്ക്കപ്പെട്ട
  rationale: അയച്ചത് പരിശുദ്ധാത്മാവാണെന്ന കർമണിപ്രയോഗവും മുഖ്യക്രിയകൾക്കു മുമ്പുണ്ടായ പ്രവൃത്തിയും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ὑπό + genitive സൂചിപ്പിക്കുന്ന പ്രവർത്തകനെ ‘-ിനാൽ’ വ്യക്തമാക്കുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിലെ വ്യക്തിപരമായ ദൈവിക പ്രവർത്തകനെ സൂചിപ്പിക്കാൻ പതിവായ ‘പരിശുദ്ധാത്മാവ്’ ഉപയോഗിക്കുന്നു.
- source_word: κατῆλθον
  choice: ഇറങ്ങിച്ചെന്നു
  rationale: താഴോട്ടോ തീരത്തേക്കോ ഉള്ള സഞ്ചാരത്തിന്റെ ദൃശ്യഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്ര സ്വാഭാവികമായി പറയുകയും ചെയ്യുന്നു.
- source_word: εἰς Σελεύκειαν
  choice: സെലൂക്യയിലേക്കു
  rationale: നഗരത്തെ ലക്ഷ്യസ്ഥാനമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് സ്ഥലനാമം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: ἐκεῖθεν τε
  choice: അവിടെനിന്ന്
  rationale: പുറപ്പെടുന്ന സ്ഥലം വ്യക്തമായി സൂചിപ്പിക്കുന്നു; τε-യുടെ ബന്ധകശക്തി അർദ്ധവിരാമത്തിനു ശേഷമുള്ള തുടർച്ചയിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἀπέπλευσαν
  choice: കപ്പൽ കയറി പുറപ്പെട്ടു
  rationale: കടൽമാർഗമുള്ള യാത്രയും ἀπο-യിലെ പുറപ്പെടൽഭാവവും സാധാരണ മലയാളത്തിൽ വ്യക്തമായി കൈമാറുന്നു.
- source_word: εἰς Κύπρον
  choice: കുപ്രൊസിലേക്കു
  rationale: ദ്വീപിനെ ലക്ഷ്യസ്ഥാനമായി സൂചിപ്പിക്കുന്നു; Κύπρος എന്ന ഗ്രീക്ക് രൂപത്തോട് അടുത്ത മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ἁγίου πνεύματος എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധ ആത്മാവ്
  rationale: ഇവിടെ ‘അയയ്ക്കുന്ന’ വ്യക്തിപരമായ ദൈവിക പ്രവർത്തകനെയാണ് അപ്പൊസ്തലപ്രവൃത്തികളുടെ സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ സ്ഥാപിത സംയുക്തരൂപം ഉപയോഗിച്ചിട്ടും പദസമുച്ചയത്തിന്റെ അക്ഷരാർഥപരമായ രൂപവ്യത്യാസം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾ SBLGNT ഗ്രീക്ക് രൂപങ്ങളോട് അടുത്തായി ‘സെലൂക്യ’, ‘കുപ്രൊസ്’ എന്ന് ലിപ്യന്തരിച്ചു. മൂലത്തിലെ കർമണിപ്രയോഗം, പ്രവർത്തകത്വം, യാത്രാക്രമം എന്നിവ സംരക്ഷിച്ചു.
