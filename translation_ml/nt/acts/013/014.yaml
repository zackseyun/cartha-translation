source:
  edition: SBLGNT
  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: ml
  text: എന്നാൽ അവർ പെർഗയിൽനിന്ന് മുന്നോട്ടു യാത്രചെയ്ത് പിസിദ്യയിലെ അന്ത്യോക്യയിൽ[a] എത്തി. ശബ്ബത്ത് ദിവസം അവർ സിനഗോഗിൽ പ്രവേശിച്ച് ഇരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പിസിദ്യൻ അന്ത്യോക്യ.” ഗ്രീക്കിൽ “പിസിദ്യയിലെ അന്ത്യോക്യ” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: എന്നാൽ അവർ
  rationale: δέ ആഖ്യാനം തുടരുന്നതിനൊപ്പം നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു; αὐτοί എന്ന വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘അവർ’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: പെർഗയിൽനിന്ന് യാത്ര തുടർന്ന്
  rationale: യാത്രാവിവരണത്തിൽ διέρχομαι ഇവിടെ ഒരു സ്ഥലത്തുനിന്ന് മുന്നോട്ടു സഞ്ചരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ തുടർച്ച സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρεγένοντο
  choice: എത്തി
  rationale: യാത്രാസന്ദർഭത്തിൽ παραγίνομαι ഒരു സ്ഥലത്ത് വന്നെത്തുക എന്നർഥം നൽകുന്നു.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: പിസിദ്യയിലെ അന്ത്യോക്യയിൽ
  rationale: ഗ്രീക്ക് പദഘടന അന്ത്യോക്യയെ പിസിദ്യ എന്ന പ്രദേശവുമായി ബന്ധപ്പെടുത്തി തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: സിനഗോഗിൽ പ്രവേശിച്ച്
  rationale: ഗ്രീക്ക് കൃതന്തത്തെ മലയാളത്തിലെ സ്വാഭാവിക മുൻകാലക്രിയാരൂപത്തിൽ നൽകി, εἰς സൂചിപ്പിക്കുന്ന അകത്തേക്കുള്ള പ്രവേശനം നിലനിർത്തുന്നു.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: ശബ്ബത്തുദിവസം
  rationale: σαββάτων ബഹുവചനരൂപത്തിലാണെങ്കിലും ഈ യഹൂദപ്രയോഗം ഏകവചനമായ ശബ്ബത്തുദിവസത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκάθισαν
  choice: ഇരുന്നു
  rationale: അവർ ഇരിപ്പിടം സ്വീകരിച്ച ലളിതമായ സംഭവത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
