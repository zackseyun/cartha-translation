  terminology: ‘മശീഹ’ അടിക്കുറിപ്പിൽ മാത്രം ഉപയോഗിച്ചിരിക്കുന്നത് ഉചിതമാണ്; മുഖ്യവാചകത്തിലെ ഗ്രീക്ക് അപൂർണനിഷേധം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല. ‘ചെരിപ്പുകൾ’ മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാണ്; വാചകത്തിൽ ഇല്ലാത്ത ‘വാറ്’ ചേർക്കുന്നില്ല. പാഠഭേദക്കുറിപ്പിന്റെ അടയാളം ബാധകമായ ‘ചെരിപ്പുകൾ’ക്കു തൊട്ടുപിന്നാലെ സ്ഥാപിക്കണം.
