id: ACT.13.25
reference: Acts 13:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: ml
  text: 'യോഹന്നാൻ തന്റെ ഓട്ടം പൂർത്തിയാക്കിക്കൊണ്ടിരിക്കെ ഇങ്ങനെ പറഞ്ഞുകൊണ്ടിരുന്നു: “ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ കരുതുന്നത്? ഞാനല്ല.[a] എന്നാൽ നോക്കൂ, എനിക്കു പിന്നാലെ ഒരാൾ വരുന്നു; അവന്റെ കാലുകളിലെ ചെരിപ്പുകൾ[b] അഴിക്കാൻ ഞാൻ യോഗ്യനല്ല.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമായി പറഞ്ഞാൽ: “ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ കരുതുന്നത്? ഞാൻ മശീഹയല്ല.” നിഷേധിക്കപ്പെടുന്ന വ്യക്തിത്വം ആരുടേതാണെന്ന് ഗ്രീക്ക് തുറന്നു പറയുന്നില്ലെങ്കിലും, സന്ദർഭം മശീഹയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.'
    reason: alternative_reading
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളും പരിഭാഷകളും ഇതിനെ കൂടുതൽ വ്യക്തമായി “അവന്റെ ചെരിപ്പുകളുടെ വാറ് അഴിക്കാൻ” എന്നു നൽകുന്നു. എന്നാൽ ഇവിടെ സ്വീകരിച്ചിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിൽ ലളിതമായി “അവന്റെ കാലുകളിലെ പാദരക്ഷ ... അഴിക്കാൻ” എന്നാണ്.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: തന്റെ ഓട്ടം പൂർത്തിയാക്കിക്കൊണ്ടിരിക്കെ
  rationale: πληρόωയുടെ പൂർത്തീകരണാർഥവും അപൂർണ്ണഭൂതകാലത്തിന്റെ പുരോഗമനഭാവവും നിലനിർത്തുന്നു. δρόμος എന്ന പദത്തിലെ ഓട്ടത്തിന്റെ രൂപകം ദൗത്യം എന്നു വ്യാഖ്യാനിച്ച് മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἔλεγεν
  choice: പറഞ്ഞുകൊണ്ടിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാലം സൂചിപ്പിക്കുന്ന തുടർച്ചയായതോ ആവർത്തിച്ചുള്ളതോ ആയ സാക്ഷ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: ഞാൻ ആരാണെന്നാണ് നിങ്ങൾ കരുതുന്നത്?
  rationale: τί അക്ഷരാർഥത്തിൽ ‘എന്ത്’ ആയിരുന്നാലും ഇവിടെ ചോദ്യം യോഹന്നാനു കൽപ്പിക്കപ്പെടുന്ന വ്യക്തിത്വത്തെക്കുറിച്ചാണ്; ‘ആരാണ്’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: ഞാനല്ല
  rationale: ഗ്രീക്കിലെ ഊന്നലും അപൂർണമായി വിട്ടിരിക്കുന്ന നിഷേധവും നിലനിർത്തുന്നു; ‘മശീഹ’ എന്ന് മുഖ്യവാചകത്തിൽ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
- source_word: ἀλλ’ ἰδοὺ
  choice: എന്നാൽ നോക്കൂ
  rationale: ἰδούവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ശക്തി പുരാതനഭാവമില്ലാത്ത, മാന്യമായ ആധുനിക പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: എനിക്കു പിന്നാലെ ഒരാൾ വരുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവവും സമീപവുമായ ഭാവം നിലനിർത്തുകയും ഗ്രീക്കിൽ സൂചിതമായ കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: അവന്റെ കാലിലെ ചെരിപ്പുകൾ അഴിക്കാൻപോലും
  rationale: ὑπόδημα ഏകവചനത്തിലുള്ള പൊതുവായ പാദരക്ഷാപദമായിരിക്കാമെങ്കിലും മലയാളത്തിൽ ഇരുകാലിലെയും പാദരക്ഷയെ സൂചിപ്പിക്കാൻ ബഹുവചനം സ്വാഭാവികമാണ്. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘വാറ്’ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἄξιος
  choice: യോഗ്യനല്ല
  rationale: ἄξιος സൂചിപ്പിക്കുന്ന യോഗ്യതയെയും അർഹതയെയും ഈ വിനയപ്രഖ്യാപനത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: οὐκ εἰμὶ ἐγώ എന്നതിൽ യോഹന്നാൻ നിഷേധിക്കുന്ന വ്യക്തിത്വം
  choice: മുഖ്യവാചകത്തിൽ ‘ഞാനല്ല’ എന്ന അപൂർണപ്രസ്താവം നിലനിർത്തി, സാധ്യതയുള്ള മശീഹാസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘ഞാൻ മശീഹയല്ല’ അല്ലെങ്കിൽ ‘ഞാൻ ആ വ്യക്തിയല്ല’
  rationale: സന്ദർഭം പ്രതീക്ഷിക്കപ്പെട്ട മശീഹയിലേക്കാണ് ശക്തമായി വിരൽചൂണ്ടുന്നത്; എങ്കിലും ഗ്രീക്ക് ആ പദം തുറന്നു പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സൂചനയും അപൂർണതയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം; അതേസമയം പ്രസംഗസന്ദർഭത്തിന് യോജിച്ച മാന്യത നിലനിർത്തുന്നു. ‘ഇതാ’ എന്നതിനെക്കാൾ സംഭാഷണസഹജമായ ‘നോക്കൂ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ഓട്ടരൂപകവും മശീഹയെക്കുറിച്ചുള്ള അപൂർണ നിഷേധവും വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ സൂക്ഷിച്ചു.
