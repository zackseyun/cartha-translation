id: ACT.13.3
reference: Acts 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε νηστεύσαντες καὶ προσευξάμενοι καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/003.yaml
  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: ml
  text: അപ്പോൾ[a] അവർ ഉപവസിച്ചു പ്രാർഥിച്ചശേഷം, അവരുടെമേൽ കൈകൾ വെച്ച് അവരെ യാത്രയാക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അന്നേരം.”
    reason: τότε എന്ന പദത്തിന്റെ സ്വാഭാവികമായ മറ്റൊരു കാലസൂചക പരിഭാഷ.
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: മുമ്പത്തെ പ്രവാചക നിർദേശത്തെത്തുടർന്നുള്ള സംഭവക്രമം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: νηστεύσαντες
  choice: ഉപവസിച്ചു ... ശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രവൃത്തിയാണെന്നത് ഗ്രീക്ക് ഭൂതകാല കൃദന്തരൂപത്തിനനുസരിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: προσευξάμενοι
  choice: പ്രാർഥിച്ച
  rationale: ഉപവാസത്തോടൊപ്പം പ്രധാനക്രിയയ്ക്കു മുമ്പ് നടന്ന പ്രാർഥനയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: അവരുടെമേൽ കൈകൾ വെച്ച്
  rationale: ഒരു പ്രത്യേക സഭാപരമോ കൂദാശാപരമോ ആയ വ്യാഖ്യാനം ചേർക്കാതെ, മൂലപാഠത്തിലെ ദൃശ്യമായ പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: ἀπέλυσαν
  choice: അവരെ യാത്രയാക്കി
  rationale: അവരെ പോകാൻ അനുവദിച്ചു വിടുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; 'വിട്ടയച്ചു' എന്നത് പിരിച്ചുവിടലോ മോചനമോ എന്ന തെറ്റായ ധ്വനി ഉണ്ടാക്കാം.
- source_word: αὐτοῖς
  choice: അവരുടെമേൽ / അവരെ
  rationale: കൈകൾ വെച്ചവരും യാത്രയാക്കപ്പെട്ടവരും ബർന്നബാസും ശൗലുമാണെന്ന് മലയാള വാക്യഘടനയിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കൈവെപ്പിന്റെ സ്വഭാവം
  choice: പ്രവൃത്തിയെ 'അവരുടെമേൽ കൈകൾ വെച്ച്' എന്നു വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
  alternative: സ്ഥാനാരോഹണം, അനുഗ്രഹം, ഔപചാരിക നിയോഗം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം കൈവെപ്പ് വിവരിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ സഭാപരമോ കൂദാശാപരമോ ആയ പദവി നിർവചിക്കുന്നില്ല; അതിനാൽ മതവിഭാഗപരമായ നിഗമനം പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് കൃദന്തങ്ങളുടെ ക്രമം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ പുനരാവിഷ്കരിച്ചു; കൈവെപ്പിന് മതവിഭാഗപരമായ സാങ്കേതിക പദം നൽകിയിട്ടില്ല.
