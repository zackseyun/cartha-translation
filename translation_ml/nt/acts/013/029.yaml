id: ACT.13.29
reference: Acts 13:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: ml
  text: അവനെക്കുറിച്ച് എഴുതപ്പെട്ടിരുന്നതെല്ലാം അവർ നിറവേറ്റിയശേഷം, അവനെ മരത്തിൽനിന്ന് ഇറക്കി ഒരു കല്ലറയിൽ വെച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രൂശിൽനിന്ന്”; ഗ്രീക്കിൽ “മരം” (ξύλον). ഈ പദം വധത്തിനുപയോഗിച്ചിരുന്ന മരനിർമിത ഉപകരണത്തെയും സൂചിപ്പിക്കാം; ആവർത്തനം 21:23-ന്റെ പ്രതിധ്വനിയും ഇവിടെ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: …ശേഷം
  rationale: സന്ദർഭത്തിലെ കാലക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ നൽകുന്ന ആഖ്യാനത്തുടർച്ച വാക്യപ്രവാഹത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐτέλεσαν
  choice: നിറവേറ്റി
  rationale: എഴുതപ്പെട്ട കാര്യങ്ങൾ അവരുടെ പ്രവൃത്തികളിലൂടെ പൂർത്തിയായി എന്ന τελέωയുടെ അർഥം നൽകുന്നു; തിരുവെഴുത്തുസംബന്ധിയായ സൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: അവനെക്കുറിച്ച് എഴുതപ്പെട്ടിരുന്നതെല്ലാം
  rationale: γεγραμμένα സൂചിപ്പിക്കുന്ന മുൻകൂട്ടി എഴുതപ്പെട്ട നിലയും πάντα എന്ന സമഗ്രതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: καθελόντες
  choice: അവനെ … ഇറക്കി
  rationale: പ്രധാനക്രിയയ്ക്ക് മുമ്പുള്ള aorist participle മലയാളത്തിൽ തുടർച്ചയായ സമാപ്തപ്രവൃത്തിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπὸ τοῦ ξύλου
  choice: മരത്തിൽനിന്ന്
  rationale: ξύλον എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘മരം’ സംരക്ഷിക്കുകയും ആവർത്തനം 21:23-ലേക്കുള്ള സാധ്യതയുള്ള പ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു; സന്ദർഭാനുസൃതമായ ‘ക്രൂശ്’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔθηκαν
  choice: വെച്ചു
  rationale: ശരീരം അടക്കസ്ഥലത്ത് സ്ഥാപിക്കുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς μνημεῖον
  choice: ഒരു കല്ലറയിൽ
  rationale: μνημεῖον ഇവിടെ ശവസംസ്കാരത്തിനുള്ള കല്ലറയെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ-ആഖ്യാന രജിസ്റ്ററിൽ വ്യക്തവും സാധാരണവുമായ പദം.
theological_decisions:
- issue: പീഡാനുഭവസന്ദർഭത്തിലെ ξύλον എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മരം
  alternative: ക്രൂശ്
  rationale: മൂലപാഠത്തിൽ σταυρός അല്ല, ξύλον ആണ്. ‘മരം’ എന്ന വിവർത്തനം മൂലപദത്തിന്റെ രൂപവും ശാപം/മരം സംബന്ധിച്ച തിരുവെഴുത്തുപ്രതിധ്വനിയും നിലനിർത്തുന്നു; സന്ദർഭപരമായി സാധ്യമായ ‘ക്രൂശ്’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മരം’ എന്ന മൂലഭാഷാസവിശേഷത പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ച്, കൂടുതൽ പരിചിതമായ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
