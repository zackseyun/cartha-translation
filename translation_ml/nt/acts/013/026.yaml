  terminology: ‘വംശത്തിലെ പുത്രന്മാർ’ υἱοὶ γένους എന്ന ഇരട്ട ആശയം സംരക്ഷിക്കുന്നു. ‘ദൈവത്തെ ഭയപ്പെടുന്നവർ’ സാങ്കേതിക സാമൂഹികവിഭാഗം നിർബന്ധമായി ചുമത്താതെ φοβούμενοι τὸν θεόν എന്ന പ്രയോഗത്തിന്റെ വിവരണാത്മകത നിലനിർത്തുന്നു. ‘രക്ഷ’യും ‘സന്ദേശം’യും സന്ദർഭോചിതവും സ്ഥാപിതവുമായ പദങ്ങളാണ്.
