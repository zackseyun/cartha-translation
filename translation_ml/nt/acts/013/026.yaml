id: ACT.13.26
reference: Acts 13:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], അബ്രാഹാമിന്റെ വംശത്തിലെ പുത്രന്മാരേ, നിങ്ങളിൽ ദൈവത്തെ ഭയപ്പെടുന്നവരേ[b], ഈ രക്ഷയുടെ സന്ദേശം[c] നമുക്കാണ് അയച്ചിരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുരുഷന്മാരേ, സഹോദരന്മാരേ.” ഗ്രീക്കിലെ സംബോധന അക്ഷരാർഥത്തിൽ പുരുഷലിംഗത്തിലാണ്; എന്നാൽ കൂടിവന്നിരുന്ന വിശാലമായ സദസ്സിനെയും അത് ഉൾക്കൊണ്ടിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിങ്ങളിലുള്ള ദൈവഭക്തരേ.” യിസ്രായേലിന്റെ ദൈവത്തെ ആരാധിച്ചിരുന്ന യെഹൂദേതര സിനഗോഗ് അനുയായികളെ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ “ഈ രക്ഷയുടെ വചനം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗത്തിലുള്ള ഗ്രീക്ക് സംബോധനയെ കൃത്യമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പൊതുസംബോധനയുമാണ്.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: അബ്രാഹാമിന്റെ വംശത്തിലെ പുത്രന്മാരേ
  rationale: υἱοί എന്നതിലെ ‘പുത്രന്മാർ’ എന്ന അർഥവും γένος എന്നതിലെ വംശപരമ്പരയുടെ ആശയവും ഒരുപോലെ സൂക്ഷിക്കുന്നു.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: നിങ്ങളിൽ ദൈവത്തെ ഭയപ്പെടുന്നവരേ
  rationale: ചരിത്രപരമായ ഒരു സാങ്കേതിക വിഭാഗനാമം നിർബന്ധമായി ചുമത്താതെ ഗ്രീക്കിലെ വിവരണാത്മക പ്രയോഗം നേരിട്ട് നൽകുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കാണ്
  rationale: അയയ്ക്കലിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തി നിലനിർത്തുന്നു; പ്രസംഗകനെയും ശ്രോതാക്കളെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: ὁ λόγος
  choice: സന്ദേശം
  rationale: പ്രഖ്യാപനസന്ദർഭത്തിൽ λόγος എന്നതിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τῆς σωτηρίας ταύτης
  choice: ഈ രക്ഷയുടെ
  rationale: λόγος-നോടുള്ള ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധം അതേപടി സൂക്ഷിക്കുകയും σωτηρία-യുടെ പതിവായ ദൈവശാസ്ത്രപരമായ അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐξαπεστάλη
  choice: അയച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ അയയ്ക്കലും പ്രസംഗസന്ദർഭത്തിലെ അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: φοβούμενοι τὸν θεόν എന്ന ശ്രോതൃവിഭാഗത്തിന്റെ സ്വഭാവം
  choice: ‘ദൈവത്തെ ഭയപ്പെടുന്നവർ’ എന്ന വിവരണാത്മക പരിഭാഷ
  alternative: ‘ദൈവഭക്തർ’ എന്ന അർധസാങ്കേതിക വിഭാഗനാമം
  rationale: ഇവർ യിസ്രായേലിന്റെ ദൈവത്തെ ആരാധിച്ചിരുന്ന യെഹൂദേതര സിനഗോഗ് അനുയായികളായിരിക്കാമെങ്കിലും, ഗ്രീക്ക് പ്രയോഗം വിവരണാത്മകമായും വായിക്കാം; അതിനാൽ പ്രധാനവാചകം ഈ തുറന്ന നിലപാട് കാത്തുസൂക്ഷിക്കുന്നു.
- issue: Ἄνδρες ἀδελφοί എന്ന സംബോധനയിലെ ലിംഗസൂചന
  choice: ‘സഹോദരന്മാരേ’ എന്ന് പുരുഷലിംഗരൂപം നിലനിർത്തുക
  alternative: ‘സഹോദരീ സഹോദരന്മാരേ’ എന്ന ഉൾക്കൊള്ളുന്ന വിപുലീകരണം
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി പുരുഷലിംഗത്തിലാണ്. വിശാലമായ സദസ്സിനെ ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും, മൂലത്തിൽ ഇല്ലാത്ത സ്ത്രീലിംഗപദം പ്രധാനവാചകത്തിൽ ചേർക്കാതെ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പൊതുവായ മലയാളം ഉപയോഗിച്ചു. പ്രസംഗത്തിന്റെ നേരിട്ടുള്ള സംബോധനഭാവം നിലനിർത്തി; ദൈവശാസ്ത്രപരമോ ചരിത്രപരമോ ആയ സാധ്യതകൾ പ്രധാനവാചകത്തിൽ അതിയായി നിർവചിക്കാതെ അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചു.
