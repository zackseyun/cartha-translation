id: ACT.13.45
reference: Acts 13:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: ml
  text: എന്നാൽ ജനക്കൂട്ടങ്ങളെ കണ്ടപ്പോൾ യെഹൂദന്മാർ[a] അസൂയകൊണ്ട് നിറഞ്ഞു[b]. അവർ പൗലോസ് പറഞ്ഞുകൊണ്ടിരുന്ന കാര്യങ്ങളെ[c] എതിർത്തു സംസാരിക്കുകയും ദൂഷണം പറയുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഈ സംഭവത്തിൽ പൗലോസിനെ എതിർത്ത പ്രാദേശിക യെഹൂദരുടെ ഒരു കൂട്ടമാണ്; യെഹൂദജനത മുഴുവനുമല്ല.
    reason: cultural_note
  - marker: b
    text: അല്ലെങ്കിൽ, “തീക്ഷ്ണതകൊണ്ട് നിറഞ്ഞു”; എന്നാൽ ഇവിടെ സന്ദർഭം പ്രതികൂലമായ “അസൂയ” എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “പൗലോസിനാൽ പറയപ്പെട്ടുകൊണ്ടിരുന്ന കാര്യങ്ങളെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: എന്നാൽ ... കണ്ടപ്പോൾ
  rationale: δέ മുൻസന്ദർഭത്തോടുള്ള നേരിയ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; aorist participle ആയ ἰδόντες-നെ മുഖ്യക്രിയയോടുള്ള കാലബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘കണ്ടപ്പോൾ’ എന്നു നൽകി.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: മൂലപാഠം നേതാക്കളെന്നോ മറ്റൊരു ഉപവിഭാഗമെന്നോ ചുരുക്കാതെ യെഹൂദന്മാർ എന്നു തന്നെയാണ് പറയുന്നത്. സന്ദർഭത്തിലെ പ്രാദേശിക എതിർപ്പുകാരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ὄχλους
  choice: ജനക്കൂട്ടങ്ങളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: ἐπλήσθησαν ζήλου
  choice: അസൂയകൊണ്ട് നിറഞ്ഞു
  rationale: ζῆλος എന്നതിന് തീക്ഷ്ണത എന്നും അസൂയ എന്നും അർഥമാകാം; ജനക്കൂട്ടങ്ങളെ കണ്ടതിനു പിന്നാലെയുള്ള എതിർപ്പും ദൂഷണവും ഇവിടെ പ്രതികൂലമായ ‘അസൂയ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. ‘നിറഞ്ഞു’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും നിലനിർത്തുന്നു.
- source_word: ἀντέλεγον
  choice: എതിർത്തു സംസാരിക്കുകയും
  rationale: imperfect രൂപം തുടരുന്ന എതിർസംസാരത്തെ സൂചിപ്പിക്കുന്നു. ‘എതിർത്തു സംസാരിച്ചു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: പൗലോസ് പറഞ്ഞുകൊണ്ടിരുന്ന കാര്യങ്ങളെ
  rationale: articular passive participle പൗലോസ് പറഞ്ഞ സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ കൃത്രിമമായ കർമണിപ്രയോഗം ഒഴിവാക്കി, imperfective force ‘പറഞ്ഞുകൊണ്ടിരുന്ന’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: βλασφημοῦντες
  choice: ദൂഷണം പറയുകയും ചെയ്തു
  rationale: participle മുഖ്യപ്രവർത്തനത്തോടൊപ്പം നടന്ന അധിക്ഷേപകരവും ദൈവനിന്ദാപരവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു. ആരെയോ എന്തിനെയോ ദൂഷിച്ചു എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ കർമം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: οἱ Ἰουδαῖοι എന്നതിനെ യെഹൂദജനത മുഴുവനെയും കുറ്റപ്പെടുത്തുന്നതായി വായിക്കാനുള്ള സാധ്യത
  choice: യെഹൂദന്മാർ
  alternative: യെഹൂദനേതാക്കൾ / യെഹൂദ്യർ
  rationale: മൂലപാഠത്തിലെ പൊതുവായ നാമം വ്യാഖ്യാനപരമായി ‘നേതാക്കൾ’ എന്നു ചുരുക്കിയിട്ടില്ല. അതേസമയം, ഇത് ഈ സംഭവത്തിൽ പൗലോസിനെ എതിർത്ത പ്രാദേശിക കൂട്ടത്തെക്കുറിച്ചാണെന്നും എല്ലാ യെഹൂദരെയും കുറിച്ചല്ലെന്നും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: ζῆλος എന്ന പദത്തിന്റെ ധാർമിക ഭാവം
  choice: അസൂയ
  alternative: തീക്ഷ്ണത / ഉത്സാഹം
  rationale: പദത്തിന് ഇരുവിധ അർഥസാധ്യതയുണ്ടെങ്കിലും, ജനക്കൂട്ടത്തെ കണ്ടതിനെ തുടർന്നുള്ള എതിർപ്പും ദൂഷണവും പ്രതികൂലമായ ‘അസൂയ’ എന്ന അർഥത്തെ സന്ദർഭപരമായി ശക്തമാക്കുന്നു; മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ വാക്യബന്ധവും ബഹുവചനവും അർഥസാധ്യതകളും പരമാവധി സൂക്ഷിച്ചുകൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ കർമണിഘടന ഒഴിവാക്കി.
