reference: Acts 13:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: ml
  text: ഇസ്രായേൽ എന്ന ഈ ജനത്തിന്റെ ദൈവം നമ്മുടെ പിതാക്കന്മാരെ[a] തിരഞ്ഞെടുത്തു. ഈജിപ്തുദേശത്ത് പരദേശവാസികളായിരുന്ന കാലത്ത് അവിടുന്ന് ജനത്തെ ഉയർത്തി[b]; ഉയർത്തിയ ഭുജത്താൽ[c] അവരെ അവിടെനിന്ന് പുറത്തേക്കു നയിച്ചു[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘നമ്മുടെ പൂർവികരെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘നമ്മുടെ പിതാക്കന്മാരെ.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ജനത്തെ മഹത്തരമാക്കി’ എന്നോ ‘ജനത്തെ വർധിപ്പിച്ചു’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘ഉയർന്ന ഭുജത്താൽ.’ ദൈവം തന്റെ ശക്തിയാൽ വിടുവിച്ചതിനെ സൂചിപ്പിക്കുന്ന പുറപ്പാട്-കാലത്തെ പ്രയോഗമാണിത്.'
    reason: cultural_note
  - marker: d
    text: അഥവാ, ‘അവരെ അവിടെനിന്ന് പുറത്തേക്കു കൊണ്ടുവന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: ഈ ജനമായ ഇസ്രായേലിന്റെ ദൈവം
  rationale: Ἰσραήλ എന്നത് ‘ഈ ജനം’ എന്നതിനെ വിശദീകരിക്കുന്ന പേരായി നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ബന്ധഘടനയും ഔപചാരികമായ ആരംഭവും സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐξελέξατο
  choice: തിരഞ്ഞെടുത്തു
  rationale: ദൈവത്തിന്റെ നിർണായകമായ തിരഞ്ഞെടുപ്പിനെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; മധ്യമപ്രയോഗത്തിന്റെ സൂക്ഷ്മത പ്രത്യേകം ചേർക്കേണ്ടതില്ല.
- source_word: τοὺς πατέρας ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാരെ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ കുടുംബപദം നേരിട്ട് നിലനിർത്തുന്നു; ഇവിടെ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸν λαὸν ὕψωσεν
  choice: ഈ ജനത്തെ ഉയർത്തി
  rationale: ὑψόω എന്ന പദത്തിൽ മഹത്താക്കുക, ഉയർത്തുക, വർധിപ്പിക്കുക എന്നീ സാധ്യതകൾ ഉള്ളതിനാൽ ‘ഉയർത്തി’ അതിന്റെ ഉദ്ദേശപൂർവമായ അർത്ഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: ഈജിപ്തുദേശത്ത് പരദേശവാസികളായി കഴിഞ്ഞിരുന്ന കാലത്ത്
  rationale: παροικία സൂചിപ്പിക്കുന്ന അന്യദേശവാസവും താമസകാലവും വ്യക്തമാക്കുന്നു; γῇ എന്നതിനെ ‘ദേശം’ എന്നു പ്രതിനിധീകരിക്കുന്നു.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: ഉയർത്തിയ ഭുജത്താൽ
  rationale: പുറപ്പാട് പാരമ്പര്യത്തിലെ ദൈവിക ശക്തിയുടെയും വിടുതലിന്റെയും ദൃശ്യരൂപകത്തെ വ്യാഖ്യാനിച്ചു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: അവരെ അവിടെനിന്ന് പുറത്തേക്കു നയിച്ചു
  rationale: ἐξάγω എന്ന ക്രിയയുടെ പുറത്തേക്കുള്ള ദിശാബോധം പ്രകടമാക്കുകയും αὐτῆς ഈജിപ്തിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ പൂർവികരെ വിശേഷിപ്പിക്കൽ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: πατέρας എന്ന മൂലപദത്തിന്റെ കുടുംബപരവും പുരുഷലിംഗപരവുമായ രൂപം നിലനിർത്തുന്നു; വിശാലമായ അർത്ഥമുള്ള മറ്റൊരു സ്വാഭാവിക വിവർത്തനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ഈജിപ്തിൽ ദൈവം ജനത്തോടു ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന ὕψωσεν
  choice: ഈ ജനത്തെ ഉയർത്തി
  alternative: ഈ ജനത്തെ മഹത്തരമാക്കി / വർധിപ്പിച്ചു
  rationale: സാമൂഹികമായ ഉയർച്ചയോ സംഖ്യാവർധനയോ മാത്രം എന്നു തീർപ്പാക്കാതെ ഗ്രീക്കിലെ അർത്ഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
- issue: μετὰ βραχίονος ὑψηλοῦ എന്ന പുറപ്പാട്-രൂപകം
  choice: ഉയർത്തിയ ഭുജത്താൽ
  alternative: ശക്തമായ ഭുജത്താൽ
  rationale: ദൈവത്തിന്റെ ശക്തമായ വിടുതൽ എന്ന ആശയം രൂപകത്തിലൂടെ തന്നെയാണ് മൂലപാഠം അറിയിക്കുന്നത്; അതിനാൽ രൂപകത്തെ നേരിട്ട് നിലനിർത്തി അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചരിത്രപ്രസംഗശൈലി. ‘അവിടുന്ന്’ ദൈവത്തെ മാന്യമായി സൂചിപ്പിക്കുന്നു. ‘പരദേശവാസികളായി കഴിഞ്ഞിരുന്ന കാലത്ത്’ എന്ന പ്രയോഗം പഴഞ്ചൻ ശൈലിയില്ലാതെ παροικίαയുടെ അന്യദേശതാമസഭാവം വ്യക്തമാക്കുന്നു; മുഖ്യപാഠത്തിലെ രൂപകങ്ങളും അർത്ഥസന്ദിഗ്ധതയും അടിക്കുറിപ്പുകളുടെ സഹായത്തോടെ നിലനിർത്തിയിരിക്കുന്നു.
