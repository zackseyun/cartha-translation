id: ACT.13.7
reference: Acts 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: ml
  text: അവൻ പ്രോകോൺസലായ സെർഗ്യോസ് പൗലോസിനോടൊപ്പമായിരുന്നു. പൗലോസ് വിവേകമുള്ള ഒരു മനുഷ്യനായിരുന്നു.[a] ഈ വ്യക്തി ബർന്നബാസിനെയും ശൗലിനെയും വിളിച്ചുവരുത്തി, ദൈവത്തിന്റെ വചനം[b] കേൾക്കാൻ ആഗ്രഹിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബുദ്ധിമാനായ മനുഷ്യൻ” എന്നോ “ഗ്രഹണശേഷിയുള്ള മനുഷ്യൻ” എന്നോ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ദൈവത്തിന്റെ സന്ദേശം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: പ്രോകോൺസലായ
  rationale: റോമൻ പ്രവിശ്യാഭരണത്തിലെ കൃത്യമായ ഔദ്യോഗിക പദവി നിലനിർത്തുന്നു; പൊതുവായ ‘ഭരണാധികാരി’ എന്നതിനെക്കാൾ ചരിത്രപരമായി സൂക്ഷ്മമാണ്.
- source_word: σὺν
  choice: ഒപ്പമായിരുന്നു
  rationale: ബന്ധത്തെയോ സഹവാസത്തെയോ സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀνδρὶ συνετῷ
  choice: വിവേകമുള്ള ഒരു മനുഷ്യൻ
  rationale: സാമർഥ്യമുള്ള ഗ്രഹണശേഷി, വിവേകം, പ്രായോഗിക ബുദ്ധി എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; നൈതിക പ്രശംസ അമിതമായി ചുമത്തുന്നില്ല.
- source_word: οὗτος
  choice: അദ്ദേഹം
  rationale: അടുത്ത പ്രവർത്തിയുടെ കർത്താവ് സെർഗ്യോസ് പൗലോസ് ആണെന്ന് മുൻവാക്യത്തിൽ പേര് ആവർത്തിച്ച് വ്യക്തമാക്കിയതിനാൽ ആദരസൂചക സർവനാമം സ്വാഭാവികമായി ആ പരാമർശം തുടരുന്നു.
- source_word: προσκαλεσάμενος
  choice: വിളിപ്പിച്ച്
  rationale: തന്റെ അടുക്കലേക്കു വരാൻ വിളിച്ച അധികാരിയുടെ മുൻകൈ വ്യക്തമാക്കുന്നു; നിർബന്ധത്തിന്റെ അർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: ἐπεζήτησεν
  choice: ആഗ്രഹിച്ചു
  rationale: തുടർന്നുള്ള അനന്തക്രിയയോടൊപ്പം ദൈവവചനം കേൾക്കാനുള്ള ശക്തമായ താത്പര്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀκοῦσαι
  choice: കേൾക്കാൻ
  rationale: സന്ദേശം ശ്രവിക്കുകയെന്ന അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: λόγον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ഗ്രീക്കിലെ ബന്ധവും പരമ്പരാഗത ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ദൈവത്തിൽനിന്നുള്ള പ്രസംഗസന്ദേശത്തെയും സൂചിപ്പിക്കാം.
- source_word: Σεργίῳ Παύλῳ
  choice: സെർഗ്യോസ് പൗലോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമങ്ങൾ മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി നൽകുന്നു.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: ബർന്നബാസിനെയും ശൗലിനെയും
  rationale: വ്യക്തിനാമങ്ങൾ മലയാളത്തിലെ പരിചിതമായ ബൈബിൾ രൂപങ്ങളിൽ ലിപ്യന്തരണം ചെയ്യുന്നു.
theological_decisions:
- issue: λόγον τοῦ θεοῦ എന്ന പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ദൈവത്തിന്റെ വചനം
  alternative: ദൈവത്തിന്റെ സന്ദേശം
  rationale: ‘വചനം’ മൂലപദത്തിന്റെ രൂപം കൂടുതൽ സുതാര്യമായി നിലനിർത്തുന്നു; അതേസമയം ഇത് പ്രസംഗിക്കപ്പെട്ട ദൈവസന്ദേശം എന്ന അർഥത്തിലാണെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: സെർഗ്യോസ് പൗലോസിനെ വിശേഷിപ്പിക്കുന്ന συνετῷ എന്ന പദത്തിന്റെ ഭാവം
  choice: വിവേകമുള്ള ഒരു മനുഷ്യൻ
  alternative: ബുദ്ധിമാനായ മനുഷ്യൻ; ഗ്രഹണശേഷിയുള്ള മനുഷ്യൻ
  rationale: ഈ പദം ബൗദ്ധിക ഗ്രഹണശേഷിയെയോ പ്രായോഗിക വിവേകത്തെയോ സൂചിപ്പിക്കാം; നിർബന്ധമായും പ്രത്യേക നൈതികമോ ആത്മീയമോ ആയ ഗുണം ആരോപിക്കാതെ ഈ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘പ്രോകോൺസൽ’ എന്ന സാങ്കേതിക റോമൻ പദവി ചരിത്രകൃത്യതയ്ക്കായി നിലനിർത്തി. മുൻവാക്യത്തിലെ ‘അവൻ’ ആരെന്നത് ഈ ഒറ്റവാക്യത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ, സെർഗ്യോസ് പൗലോസിനെ വീണ്ടും പേരെടുത്ത് പറഞ്ഞ് οὗτος-ന്റെ പരാമർശം അസന്ദിഗ്ധമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
