  source_fidelity: 'ഗ്രീക്കിലെ വാക്യക്രമവും അർഥവും വിശ്വസ്തമായി കൈമാറിയിരിക്കുന്നു: ശൗലിനെ നീക്കുക, ദാവീദിനെ അവർക്കുവേണ്ടി രാജാവായി ഉയർത്തുക, ദാവീദിനെക്കുറിച്ചുള്ള ദൈവസാക്ഷ്യം, യിശ്ശായിയുടെ മകൻ, ഹൃദയത്തിനൊത്തവൻ, ദൈവത്തിന്റെ എല്ലാ ഇഷ്ടങ്ങളും നിറവേറ്റുക എന്നിവയെല്ലാം സംരക്ഷിക്കപ്പെടുന്നു. θελήματά എന്ന ബഹുവചനം ‘ഇഷ്ടങ്ങളും’ എന്നതിലൂടെ യുക്തമായി നിലനിർത്തുന്നു.'
