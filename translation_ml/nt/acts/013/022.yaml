id: ACT.13.22
reference: Acts 13:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: ml
  text: 'അവനെ നീക്കിയശേഷം, അവർക്കുവേണ്ടി ദാവീദിനെ രാജാവായി ഉയർത്തി. അവനെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞുകൊണ്ട് ദൈവം ഇങ്ങനെ പറഞ്ഞു: “യിശ്ശായിയുടെ മകനായ ദാവീദിനെ ഞാൻ കണ്ടെത്തിയിരിക്കുന്നു; അവൻ എന്റെ ഹൃദയത്തിനൊത്ത മനുഷ്യനാണ്.[a] അവൻ എന്റെ എല്ലാ ഇഷ്ടങ്ങളും നിറവേറ്റും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്റെ ഹൃദയപ്രകാരമുള്ള മനുഷ്യൻ.”'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “ഇഷ്ടങ്ങൾ” എന്ന നാമം ബഹുവചനത്തിലാണ്; ദൈവത്തിന്റെ എല്ലാ ഉദ്ദേശ്യങ്ങളെയും ആഗ്രഹങ്ങളെയും ഇത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας
  choice: അവനെ നീക്കിയശേഷം
  rationale: ശൗലിനെ രാജസ്ഥാനത്തുനിന്ന് നീക്കിയതാണ് സന്ദർഭം; ‘സ്ഥാനഭ്രഷ്ടനാക്കിയശേഷം’ എന്നതിനെക്കാൾ ‘നീക്കിയശേഷം’ സ്വാഭാവികവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമാണ്.
- source_word: ἤγειρεν
  choice: ഉയർത്തി
  rationale: ഒരു നേതാവിനെ മുന്നോട്ടുകൊണ്ടുവന്ന് സ്ഥാപിക്കുക എന്ന ബൈബിൾ പ്രയോഗം നിലനിർത്തുന്നു; ‘രാജാവായി’ എന്നത് അർഥം വ്യക്തമാക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കുവേണ്ടി
  rationale: ഇസ്രായേലിനുവേണ്ടി അഥവാ അവരുടെ പ്രയോജനത്തിനായി എന്ന ദാതൃവിഭക്തിയുടെ സൂചന വ്യക്തമാക്കുന്നു.
- source_word: εἰς βασιλέα
  choice: രാജാവായി
  rationale: ഫലമോ ചുമതലയോ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളം.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: അവനെക്കുറിച്ച് സാക്ഷ്യം പറഞ്ഞുകൊണ്ട് ദൈവം ഇങ്ങനെ പറഞ്ഞു
  rationale: ഗ്രീക്കിലെ ദാതൃസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവനെക്കുറിച്ച്’ എന്നു നൽകുന്നു; μαρτυρήσας എന്നതിന്റെ സാക്ഷ്യാർഥവും നിലനിർത്തുന്നു. പ്രസംഗകർത്താവ് ദൈവമാണെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു.
- source_word: Εὗρον
  choice: ഞാൻ കണ്ടെത്തിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ കണ്ടെത്തലിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸν τοῦ Ἰεσσαί
  choice: യിശ്ശായിയുടെ മകനായ ദാവീദിനെ
  rationale: ഗ്രീക്കിലെ വംശബന്ധപ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: എന്റെ ഹൃദയത്തിനൊത്ത മനുഷ്യൻ
  rationale: κατά എന്ന അനുരൂപതയുടെ ആശയം നിലനിർത്തുകയും വെറും വൈകാരിക അടുപ്പം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: ποιήσει
  choice: നിറവേറ്റും
  rationale: ഇവിടെ ദൈവത്തിന്റെ ഉദ്ദേശ്യങ്ങൾ പ്രവർത്തിയിൽ നടപ്പാക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάντα τὰ θελήματά μου
  choice: എന്റെ എല്ലാ ഇഷ്ടങ്ങളും
  rationale: θελήματα എന്ന ബഹുവചനം മലയാളത്തിൽ നിലനിർത്തുന്നു; ദൈവത്തിന്റെ വിവിധ ഇഷ്ടങ്ങളെയും ഉദ്ദേശ്യങ്ങളെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദാവീദിനെക്കുറിച്ചുള്ള ‘κατὰ τὴν καρδίαν μου’ എന്ന വിശേഷണം
  choice: എന്റെ ഹൃദയത്തിനൊത്ത മനുഷ്യൻ
  alternative: എന്റെ ഹൃദയപ്രകാരമുള്ള മനുഷ്യൻ
  rationale: ഉറവിടത്തിലെ ‘എന്റെ ഹൃദയപ്രകാരം’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ദൈവവുമായി വൈകാരിക സാമ്യം മാത്രമാണെന്ന ധാരണ നിർബന്ധിക്കുന്നില്ല.
- issue: ദാവീദിനെ ‘ഉയർത്തി’ എന്ന പ്രയോഗം
  choice: ദാവീദിനെ രാജാവായി ഉയർത്തി
  alternative: ദാവീദിനെ രാജാവായി നിയമിച്ചു
  rationale: ἐγείρω എന്ന ക്രിയയുടെ ബൈബിൾപ്രയോഗവും വിശാലതയും നിലനിർത്തുന്നു; ‘രാജാവായി’ എന്ന സന്ദർഭം ഇത് പുനരുത്ഥാനമല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- issue: ദൈവത്തിന്റെ ഇഷ്ടങ്ങളുടെ ബഹുവചനം
  choice: എന്റെ എല്ലാ ഇഷ്ടങ്ങളും
  alternative: എന്റെ മുഴുവൻ ഇഷ്ടവും
  rationale: ഗ്രീക്കിലെ θελήματα എന്ന വ്യാകരണബഹുവചനം മറച്ചുവയ്ക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിയിൽ ഉറവിടത്തിന്റെ ബൈബിൾഭാവം നിലനിർത്തിയെങ്കിലും ദുർഗ്രഹമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
