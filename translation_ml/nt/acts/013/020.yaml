source:
  edition: SBLGNT
  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: ml
  text: ഏകദേശം നാനൂറ്റമ്പത് വർഷം.[a] ഇവയ്ക്കുശേഷം പ്രവാചകനായ ശമൂവേൽവരെ അവൻ ന്യായാധിപന്മാരെ നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ചില വിവർത്തനങ്ങളിൽ കാലസൂചനയെ വ്യത്യസ്തമായി ബന്ധിപ്പിക്കുന്നു: “പ്രവാചകനായ ശമൂവേൽവരെ ഏകദേശം നാനൂറ്റമ്പത് വർഷത്തേക്ക് അവൻ ന്യായാധിപന്മാരെ നൽകി.” ഇവിടത്തെ ഗ്രീക്ക് പദക്രമവും ചിഹ്നനവും സംബന്ധിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: ഏകദേശം
  rationale: സംഖ്യ കൃത്യമല്ലാതെ ഏകദേശമാണെന്ന് ὡς സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഏകദേശം’ അത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: നാനൂറ്റമ്പത് വർഷം
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ദത്തിവ് പ്രയോഗത്തിന്റെ ഉള്ളടക്കം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: καὶ μετὰ ταῦτα
  choice: ഇവയ്ക്കുശേഷം
  rationale: സംഭവക്രമം സൂചിപ്പിക്കുന്ന ബഹുവചന നിർദ്ദേശസർവനാമത്തിന്റെ ആശയം നിലനിർത്തുന്നു; വാക്യാരംഭത്തിലെ καί മലയാളത്തിൽ നിർബന്ധമായി വേറിട്ട് ‘കൂടാതെ’ എന്നു നൽകാതെ സ്വാഭാവികമായ തുടർച്ചയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἔδωκεν
  choice: അവൻ ... നൽകി
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘നൽകുക’ എന്ന അർഥവും ദൈവം ന്യായാധിപന്മാരെ നൽകുന്ന ബൈബിൾ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: κριτὰς
  choice: ന്യായാധിപന്മാരെ
  rationale: രാജത്വത്തിനു മുമ്പുള്ള ഇസ്രായേലിന്റെ ചരിത്രകാലഘട്ടത്തിലെ നേതാക്കളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ ബൈബിൾ പദമാണ്.
- source_word: ἕως
  choice: വരെ
  rationale: ന്യായാധിപന്മാരുടെ കാലഘട്ടത്തിന്റെ അന്ത്യപരിധി നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: പ്രവാചകനായ ശമൂവേൽ
  rationale: ശമൂവേലിനെ അദ്ദേഹത്തിന്റെ ദൗത്യപദവിയാൽ തിരിച്ചറിയിക്കുന്ന ജനിറ്റീവ് അപോസിഷൻ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ഏകദേശം നാനൂറ്റമ്പത് വർഷം’ എന്ന കാലസൂചനയുടെ വാക്യബന്ധം
  choice: നൽകിയിരിക്കുന്ന SBLGNT പാഠക്രമം അനുസരിച്ച് കാലദൈർഘ്യം സ്വതന്ത്ര വാക്യമായി നൽകി, തുടർന്ന് ‘ഇവയ്ക്കുശേഷം ... ന്യായാധിപന്മാരെ നൽകി’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘പ്രവാചകനായ ശമൂവേൽവരെ ഏകദേശം നാനൂറ്റമ്പത് വർഷത്തേക്ക് അവൻ ന്യായാധിപന്മാരെ നൽകി’ എന്നവിധം കാലസൂചനയെ ന്യായാധിപന്മാരുടെ കാലത്തോടു നേരിട്ട് ബന്ധിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിന്റെ വാക്യഘടനയും ചിഹ്നനവും സംബന്ധിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്. നൽകിയിരിക്കുന്ന ഉറവിടപാഠത്തിന്റെ ക്രമം മുഖ്യപാഠത്തിൽ പിന്തുടരുകയും മറ്റൊരു സാധ്യബന്ധം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ന്യായാധിപന്മാർ’, ‘പ്രവാചകൻ’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഉറവിടത്തിലെ യഥാർഥ വാക്യഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
