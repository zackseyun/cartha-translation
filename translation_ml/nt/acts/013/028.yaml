revisions:
- from: മരണശിക്ഷയ്ക്കു യോഗ്യമായ ഒരു കുറ്റവും അവർ കണ്ടെത്തിയില്ലെങ്കിലും[a], അവനെ വധിക്കണമെന്ന് അവർ പീലാത്തോസിനോട് ആവശ്യപ്പെട്ടു[b].
  to: അവർ മരണശിക്ഷ അർഹിക്കുന്ന യാതൊരു കുറ്റാരോപണവും കണ്ടെത്തിയില്ലെങ്കിലും[a], അവനെ വധിക്കണമെന്ന് അവർ പീലാത്തോസിനോട് ആവശ്യപ്പെട്ടു[b].
  rationale: The revision retains the explicit concessive relationship and the legal-execution sense, while replacing ‘കുറ്റം’ with ‘കുറ്റാരോപണം’ to represent αἰτία without implying that guilt or an actual offense had been established. Footnote a is correspondingly adjusted to preserve the source’s charge/grounds ambiguity.
