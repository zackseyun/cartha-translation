id: ACT.13.28
reference: Acts 13:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: ml
  text: അവർ മരണശിക്ഷ അർഹിക്കുന്ന യാതൊരു കുറ്റാരോപണവും കണ്ടെത്തിയില്ലെങ്കിലും[a], അവനെ വധിക്കണമെന്ന് അവർ പീലാത്തോസിനോട് ആവശ്യപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മരണശിക്ഷയ്ക്കു മതിയായ യാതൊരു അടിസ്ഥാനവും” അല്ലെങ്കിൽ “മരണശിക്ഷ അർഹിക്കുന്ന യാതൊരു കുറ്റാരോപണവും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവനെ കൊന്നുകളയണമെന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: മരണശിക്ഷയ്ക്കു യോഗ്യമായ ഒരു കുറ്റവും
  rationale: ന്യായവിചാരണയുടെ പശ്ചാത്തലത്തിൽ αἰτία എന്നത് കുറ്റം, ആരോപണം, നിയമപരമായ അടിസ്ഥാനം എന്നീ അർഥങ്ങൾ വഹിക്കാം; θανάτου ചേർന്നതിനാൽ മരണശിക്ഷ അർഹിക്കുന്ന കുറ്റം എന്ന ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εὑρόντες
  choice: അവർ കണ്ടെത്തിയില്ലെങ്കിലും
  rationale: അയോറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള സംഭവത്തെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ വൈരുധ്യം നിലനിർത്താൻ concessive ഭാവം ‘എങ്കിലും’ വഴി വ്യക്തമാക്കുന്നു.
- source_word: ᾐτήσαντο
  choice: അവർ ... ആവശ്യപ്പെട്ടു
  rationale: പീലാത്തോസിനോടുള്ള ഔദ്യോഗിക അഭ്യർഥനയുടെ പശ്ചാത്തലത്തിൽ ‘ആവശ്യപ്പെട്ടു’ എന്നത് αἰτέωയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Πιλᾶτον
  choice: പീലാത്തോസിനോട്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു; വിഭക്തി വാക്യഘടനയ്ക്കനുസരിച്ച് ചേർത്തിരിക്കുന്നു.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: അവനെ വധിക്കണമെന്ന്
  rationale: ഇവിടെ ἀναιρέω കൊല്ലുക/വധിക്കുക എന്ന അർഥത്തിലാണ്; നീതിന്യായപരമായ പശ്ചാത്തലത്തിന് ‘വധിക്കുക’ യോജിക്കുന്നു.
- source_word: καὶ
  choice: വാക്യത്തിന്റെ തുടർച്ചയിൽ അന്തർലീനമായി
  rationale: καί ആഖ്യാനത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി അവതരിപ്പിക്കുമ്പോൾ നിർബന്ധിതമായ ‘കൂടാതെ’ ഒഴിവാക്കി മലയാളത്തിലെ സ്വാഭാവിക തുടർച്ച നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൃദന്തവാക്യത്തിന്റെ concessive ഭാവം വ്യക്തമാക്കണമോ
  choice: ‘കണ്ടെത്തിയില്ലെങ്കിലും’ എന്ന് വൈരുധ്യം വ്യക്തമാക്കി
  alternative: ‘കണ്ടെത്താതെ’ അല്ലെങ്കിൽ ‘കണ്ടെത്തിയശേഷം’
  rationale: ഗ്രീക്ക് കൃദന്തം രൂപപരമായി സാഹചര്യപരമാണെങ്കിലും, മരണശിക്ഷയ്ക്കുള്ള കുറ്റം കണ്ടെത്താതിരുന്നിട്ടും വധം ആവശ്യപ്പെട്ടുവെന്ന ആഖ്യാനത്തിലെ ധാർമിക-ന്യായപരമായ പിരിമുറുക്കം ‘എങ്കിലും’ കൃത്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. നിയമപരമായ സന്ദർഭം വ്യക്തമാകാൻ ‘മരണശിക്ഷയ്ക്കു യോഗ്യമായ കുറ്റം’, ‘വധിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു; മൂലത്തിലെ വൈരുധ്യം ‘എങ്കിലും’ വഴി നിലനിർത്തി.
