id: ACT.13.35
reference: Acts 13:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: ml
  text: 'അതുകൊണ്ട് മറ്റൊരു സങ്കീർത്തനത്തിലും[a] ഇങ്ങനെ പറയുന്നു: “അങ്ങയുടെ പരിശുദ്ധനെ[b] അഴുകൽ കാണാൻ അങ്ങ് അനുവദിക്കുകയില്ല[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “മറ്റൊരിടത്തും” അഥവാ “മറ്റൊരു ഭാഗത്തും”; ഗ്രീക്കിൽ നാമം ചേർക്കാതെ “മറ്റൊന്നിലും” എന്നു മാത്രമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “അങ്ങയുടെ വിശ്വസ്തനെ.”
    reason: lexical_alternative
  - marker: c
    text: ‘അഴുകൽ’ എന്നതിന് “ക്ഷയം” അഥവാ “നാശം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വാദത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതിനാൽ കാരണാർഥമായ ‘എന്തെന്നാൽ’ എന്നതിനെക്കാൾ ‘അതുകൊണ്ട്’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: καὶ
  choice: -ത്തിലും
  rationale: മറ്റൊരു തിരുവെഴുത്തുസാക്ഷ്യം കൂടി ചേർക്കുന്ന അർഥം മലയാളത്തിലെ ഉൾച്ചേർക്കുന്ന ‘-ഉം’ പ്രത്യയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἑτέρῳ
  choice: മറ്റൊരു സങ്കീർത്തനത്തിൽ
  rationale: ഗ്രീക്കിൽ നാമം വ്യക്തമാക്കാതെ ‘മറ്റൊന്നിൽ’ എന്നാണ്. ഉദ്ധരണി സങ്കീർത്തനം 16-ൽ നിന്നായതിനാൽ സന്ദർഭത്തിൽ സൂചിതമായ ‘സങ്കീർത്തനം’ വായനാസൗകര്യത്തിനായി ചേർത്തു; മൂലത്തിലെ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുമ്പോൾ ഉപയോഗിക്കുന്ന വർത്തമാനകാലരൂപം നിലനിർത്തുന്നു. ഗ്രീക്കിൽ കർത്താവ് വ്യക്തമല്ലാത്തതിനാൽ ‘അവൻ’ എന്ന സർവനാമം ചേർക്കാതെ ആ അവ്യക്തത സംരക്ഷിച്ചു.
- source_word: Οὐ δώσεις
  choice: അനുവദിക്കുകയില്ല
  rationale: δίδωμι എന്ന ക്രിയയുടെ പദശഃ അർഥം ‘കൊടുക്കുക’ ആണെങ്കിലും, ഇവിടെ infinitive-നോടൊപ്പമുള്ള പ്രയോഗത്തിന് ‘അനുവദിക്കുക’ എന്നതാണ് സ്വാഭാവികമായ അർഥം.
- source_word: τὸν ὅσιόν σου
  choice: അങ്ങയുടെ പരിശുദ്ധനെ
  rationale: ὅσιος എന്നത് ദൈവത്തോടുള്ള ബന്ധത്തിൽ പരിശുദ്ധൻ, ഭക്തൻ, വിശ്വസ്തൻ എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഈ സന്ദർഭത്തിൽ പൗലോസ് ഉദ്ധരണി യേശുവിന്റെ പുനരുത്ഥാനത്തിന് ബാധകമാക്കുന്നതിനാൽ ‘പരിശുദ്ധൻ’ അനുയോജ്യം; ‘വിശ്വസ്തൻ’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: ὁράω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അനുഭവിക്കാൻ’ എന്നത് സാധ്യമായ വ്യാഖ്യാനപരമായ വിപുലീകരണമാണ്.
- source_word: διαφθοράν
  choice: അഴുകൽ
  rationale: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ ശരീരത്തിന്റെ ക്ഷയിച്ചഴുകലാണ് പ്രധാന ആശയം. ‘അഴുകൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്; വിശാലമായ ‘നാശം/ക്ഷയം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: സങ്കീർത്തനവാക്യത്തിലെ ὅσιος ആരെ സൂചിപ്പിക്കുന്നു എന്ന ക്രിസ്തുസംബന്ധിയായ വായന
  choice: ‘അങ്ങയുടെ പരിശുദ്ധനെ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘അങ്ങയുടെ വിശ്വസ്തനെ’ അല്ലെങ്കിൽ ‘അങ്ങയുടെ ഭക്തനെ’
  rationale: അപ്പൊസ്തലപ്രവൃത്തികൾ 13-ലെ പ്രസംഗത്തിൽ ഈ വാക്യം യേശുവിന്റെ പുനരുത്ഥാനത്തിന് വ്യക്തമായി ബാധകമാക്കുന്നു. എങ്കിലും ὅσιος എന്ന പദത്തിന്റെ ‘വിശ്വസ്തൻ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἐν ἑτέρῳ എന്നതിൽ സൂചിതമായ നാമം
  choice: പ്രധാനപാഠത്തിൽ ‘സങ്കീർത്തനം’ ചേർത്തു
  alternative: ‘മറ്റൊരിടത്ത്’ അല്ലെങ്കിൽ ‘മറ്റൊരു ഭാഗത്ത്’
  rationale: മൂലപാഠം ‘മറ്റൊന്നിൽ’ എന്നു മാത്രം പറയുന്നുവെങ്കിലും ഉദ്ധരണി സങ്കീർത്തനം 16-ൽ നിന്നുള്ളതാണ്. അതിനാൽ സൂചിതമായ നാമം വ്യക്തമാക്കുന്നത് വായനാസൗകര്യം നൽകുന്നു; മൂലത്തിലെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ അറിയിച്ചു.
- issue: λέγει എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: ‘ഇങ്ങനെ പറയുന്നു’ എന്നു കർത്താവിനെ വ്യക്തമാക്കാതെ പരിഭാഷപ്പെടുത്തി
  alternative: ‘അവൻ പറയുന്നു’ അല്ലെങ്കിൽ ‘തിരുവെഴുത്ത് പറയുന്നു’
  rationale: ഗ്രീക്ക് ക്രിയയുടെ കർത്താവ് പരസ്യമായി നൽകിയിട്ടില്ല; അത് ദൈവത്തെയോ തിരുവെഴുത്തിനെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ കർത്താവില്ലാത്ത പ്രയോഗം ഈ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ദൈവത്തോടുള്ള ഉദ്ധരണിയിലെ ഏകവചന അഭിസംബോധന ആദരപൂർവമായ ‘അങ്ങ്/അങ്ങയുടെ’ രൂപത്തിൽ നൽകി. ‘അഴുകൽ കാണുക’ എന്ന സെമിറ്റിക്-ഗ്രീക്ക് രൂപകം നേരിട്ട് നിലനിർത്തിയെങ്കിലും വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
