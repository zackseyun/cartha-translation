id: ACT.13.16
reference: Acts 13:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: ml
  text: 'പൗലോസ് എഴുന്നേറ്റ് കൈകൊണ്ട് ആംഗ്യം കാണിച്ച് പറഞ്ഞു: “ഇസ്രായേല്യരായ പുരുഷന്മാരേ, ദൈവത്തെ ഭയപ്പെടുന്നവരേ, ശ്രദ്ധിച്ചു കേൾക്കൂ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: എഴുന്നേറ്റ്
  rationale: സംസാരിക്കുന്നതിനുമുമ്പ് പൗലോസ് ചെയ്ത ശാരീരിക പ്രവൃത്തി സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്; ‘അപ്പോൾ’ ആ പ്രവാഹം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατασείσας τῇ χειρὶ
  choice: കൈകൊണ്ട് ആംഗ്യം കാണിച്ചുകൊണ്ട്
  rationale: ശ്രദ്ധ ക്ഷണിക്കാനോ നിശ്ശബ്ദത സൂചിപ്പിക്കാനോ ചെയ്ത കൈയാംഗ്യം വ്യക്തമാക്കുന്നു; ‘കൈവീശി’ എന്നതിലൂടെ ഉണ്ടാകാവുന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: εἶπεν
  choice: പറഞ്ഞു
  rationale: തുടർന്നുവരുന്ന നേരിട്ടുള്ള അഭിസംബോധനയ്ക്ക് യോജിച്ച സാധാരണ ആഖ്യാനക്രിയയാണ്.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: ഇസ്രായേൽജനത്തിലെ പുരുഷന്മാരേ
  rationale: ἄνδρες എന്ന പുല്ലിംഗ അഭിസംബോധനയും ഇസ്രായേല്യ തിരിച്ചറിയലും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: ദൈവത്തെ ഭയപ്പെടുന്നവരേ
  rationale: പങ്കാളിയുടെ ക്രിയാത്മക അർഥം നിലനിർത്തുകയും സാങ്കേതിക സംജ്ഞ പ്രധാനവാക്യത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀκούσατε
  choice: ശ്രദ്ധിച്ചു കേൾക്കൂ
  rationale: ശ്രദ്ധയോടെയുള്ള കേൾവിക്കായുള്ള ആജ്ഞയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സിനഗോഗിലെ അഭിസംബോധനയിൽ ഇസ്രായേല്യരെയും അവരോടു ബന്ധപ്പെട്ടിരുന്ന വിജാതീയ ആരാധകരെയും വേർതിരിച്ചു കാണിക്കൽ
  choice: “ഇസ്രായേൽജനത്തിലെ പുരുഷന്മാരേ, ദൈവത്തെ ഭയപ്പെടുന്നവരേ”
  alternative: “ഇസ്രായേല്യപുരുഷന്മാരേ, ദൈവഭക്തരേ”
  rationale: ഗ്രീക്ക് വാചകം വംശീയ ഇസ്രായേല്യരെയും ദൈവത്തെ ഭയപ്പെടുന്നവരായി വിവരിക്കപ്പെടുന്ന രണ്ടാമത്തെ കൂട്ടരെയും വേർതിരിക്കുന്നു. രണ്ടാമത്തെ കൂട്ടർ സിനഗോഗുമായി ബന്ധപ്പെട്ട വിജാതീയരായിരിക്കാം; എന്നാൽ പ്രധാനവാക്യം അതിനെ സാങ്കേതിക പദമാക്കി തീർക്കാതെ മൂലത്തിലെ വിവരണരൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ പൊതുവായ തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. നേരിട്ടുള്ള അഭിസംബോധനയിലെ പുല്ലിംഗ സൂചനയും രണ്ടു ശ്രോതൃവിഭാഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസവും നിലനിർത്തിയിരിക്കുന്നു.
