revisions:
- from: 'അപ്പോൾ പൗലോസ് എഴുന്നേറ്റ് കൈകൊണ്ട് ആംഗ്യം കാണിച്ചുകൊണ്ട് പറഞ്ഞു: “ഇസ്രായേൽജനത്തിലെ പുരുഷന്മാരേ, ദൈവത്തെ ഭയപ്പെടുന്നവരേ[a], ശ്രദ്ധിച്ചു കേൾക്കൂ.”'
  to: 'പൗലോസ് എഴുന്നേറ്റ് കൈകൊണ്ട് ആംഗ്യം കാണിച്ച് പറഞ്ഞു: “ഇസ്രായേല്യരായ പുരുഷന്മാരേ, ദൈവത്തെ ഭയപ്പെടുന്നവരേ, ശ്രദ്ധിച്ചു കേൾക്കൂ.”'
  rationale: The revision renders the ethnic vocative more directly, improves the natural flow of the narrative actions, and refines the lexical-alternative footnote. It preserves the source’s distinction between Israelites and those described as fearing God, while the footnote retains appropriate historical caution.
