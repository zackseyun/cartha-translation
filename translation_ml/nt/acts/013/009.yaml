  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: ml
  text: എന്നാൽ പൗലൊസ് എന്നും വിളിക്കപ്പെട്ടിരുന്ന ശൗൽ[a] പരിശുദ്ധാത്മാവിനാൽ നിറഞ്ഞ് അവനെ ഉറ്റുനോക്കി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പൗലൊസ് എന്നും അറിയപ്പെട്ടിരുന്ന ശൗൽ.”
    reason: ὁ καὶ Παῦλος എന്ന പ്രയോഗത്തിന് സ്വാഭാവികമായ ഒരു പകരം നൽകുന്നു.
lexical_decisions:
- source_word: Σαῦλος
  choice: ശൗൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ബൈബിൾ ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്ന് ശൗലിന്റെ പ്രതികരണത്തിലേക്കുള്ള മൃദുവായ വ്യത്യാസവും കഥാഗതിയിലെ തിരിവും സൂചിപ്പിക്കുന്നു.
- source_word: ὁ καὶ Παῦλος
  choice: പൗലൊസ് എന്നും അറിയപ്പെട്ടിരുന്ന
  rationale: ശൗലിന് പൗലൊസ് എന്ന മറ്റൊരു പേരുമുണ്ടെന്ന വിശദീകരണാത്മക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പേര് മാറിയതാണെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: πλησθεὶς
  choice: നിറഞ്ഞ്
  rationale: πίμπλημι എന്ന ക്രിയയുടെ എയോറിസ്റ്റ് പാസീവ് കൃദന്തരൂപത്തിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് തുടർന്നുള്ള മുഖ്യക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: നിറയുക എന്ന മലയാളപ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായ കാരകവിന്യാസം ഉപയോഗിക്കുകയും ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀτενίσας
  choice: സൂക്ഷിച്ചുനോക്കി
  rationale: സ്ഥിരമായും ഏകാഗ്രമായും നോക്കുക എന്ന ക്രിയയുടെ ശക്തി സാധാരണ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: εἰς αὐτόν
  choice: അവനെ
  rationale: ἀτενίζω-യോടൊപ്പമുള്ള εἰς αὐτόν ദൃഷ്ടിയുടെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ നേരിട്ടുള്ള കർമരൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിന്റെ വിവർത്തനം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: ഒരു പരിശുദ്ധ ആത്മാവ്
  rationale: അപ്പൊസ്തലപ്രവൃത്തികളിലെ പ്രയോഗവും ശക്തിപ്പെടുത്തലിന്റെ ഈ സന്ദർഭവും ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അനിശ്ചിതമായ ഒരു ആത്മാവിനെയല്ല.
- issue: ὁ καὶ Παῦλος എന്ന ഇരട്ടപ്പേരിന്റെ സ്വഭാവം
  choice: പൗലൊസ് എന്നും അറിയപ്പെട്ടിരുന്ന
  alternative: പൗലൊസ് ആയിരുന്നവൻ
  rationale: വാക്യം ശൗലിന് പൗലൊസ് എന്ന മറ്റൊരു പേരുണ്ടായിരുന്നുവെന്ന് തിരിച്ചറിയിക്കുന്നു; ദൈവികമായ പേരുമാറ്റമോ പേരിന്റെ ഉപേക്ഷണമോ ഇതിൽ നിന്നു നിർബന്ധമായി വായിച്ചെടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ കഥനശൈലി. ‘പരിശുദ്ധാത്മാവ്’ എന്ന വ്യാപകമായി മനസ്സിലാകുന്ന രൂപവും വ്യക്തിനാമങ്ങൾക്ക് ‘ശൗൽ’, ‘പൗലൊസ്’ എന്നീ പരിചിത ലിപ്യന്തരണങ്ങളും ഉപയോഗിച്ചു.
