id: ACT.13.6
reference: Acts 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: ml
  text: അവർ ദ്വീപിലുടനീളം സഞ്ചരിച്ച് പാഫോസ് വരെ എത്തിയപ്പോൾ, മന്ത്രവാദിയും കള്ളപ്രവാചകനുമായ ഒരു യഹൂദനെ കണ്ടു. അയാളുടെ പേര് ബർ-യേശു[a] എന്നായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ പേര് ‘ബർയേശു’ എന്നും എഴുതാം. ‘യേശുവിന്റെ മകൻ’ അല്ലെങ്കിൽ ‘യോശുവയുടെ മകൻ’ എന്നർഥമുള്ള ഒരു സെമിറ്റിക് പിതൃനാമമായിരിക്കാം ഇത്.
    reason: വ്യക്തിനാമത്തിന്റെ മറ്റൊരു എഴുത്തുരീതിയും സാധ്യതയുള്ള പദോത്പത്തിയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: διελθόντες
  choice: സഞ്ചരിച്ച് … എത്തിയപ്പോൾ
  rationale: പ്രധാന ക്രിയയായ εὗρον-നു മുമ്പുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന aorist participle ആണിത്. മലയാളത്തിൽ മുൻകാലപ്രവൃത്തിയും തുടർന്ന് ഉണ്ടായ കണ്ടുമുട്ടലും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ കഥ മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാള വാക്യക്രമം തന്നെ ആ ബന്ധം വ്യക്തമാക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലുള്ള വിരുദ്ധാർഥം ചേർത്തിട്ടില്ല.
- source_word: ὅλην τὴν νῆσον
  choice: ദ്വീപിലുടനീളം
  rationale: ദ്വീപ് മുഴുവൻ കുറുകെ സഞ്ചരിച്ചതെന്ന ഭൂമിശാസ്ത്രപരമായ ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἄχρι Πάφου
  choice: പാഫോസ് വരെ
  rationale: ἄχρι യാത്രയുടെ അന്തിമസ്ഥാനം സൂചിപ്പിക്കുന്നു; ‘വരെ’ അതിന്റെ നേരായ മലയാള പ്രയോഗമാണ്.
- source_word: εὗρον
  choice: കണ്ടു
  rationale: ലളിതമായ narrative aorist-ന്റെ കണ്ടെത്തൽ/കണ്ടുമുട്ടൽ എന്ന അർഥം അധിക വ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: ἄνδρα τινὰ
  choice: ഒരാളെ
  rationale: τινά നൽകുന്ന അനിശ്ചിതത്വം ‘ഒരാളെ’ എന്നതിൽ നിലനിൽക്കുന്നു. പിന്നാലെയുള്ള വിശേഷണങ്ങൾ ആ വ്യക്തിയെ തിരിച്ചറിയിക്കുന്നു.
- source_word: μάγον
  choice: മന്ത്രവാദി
  rationale: ഈ സന്ദർഭത്തിൽ μάγος മാന്ത്രികവിദ്യ അഭ്യസിക്കുന്ന ആളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘മന്ത്രവാദി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിലെ പ്രതികൂലഭാവത്തിന് യോജിച്ചതുമാണ്.
- source_word: ψευδοπροφήτην
  choice: കള്ളപ്രവാചകൻ
  rationale: പ്രവാചകനെന്ന അവകാശവാദവും അതിന്റെ വ്യാജസ്വഭാവവും ഒരുപോലെ നിലനിർത്തുന്ന പതിവും സുതാര്യവുമായ പ്രയോഗം.
- source_word: Ἰουδαῖον
  choice: യഹൂദൻ
  rationale: ഇവിടെ ഈ പദം ആ മനുഷ്യന്റെ ജനതാ-മതപരമായ തിരിച്ചറിയലാണ് നൽകുന്നത്; പ്രത്യേകമായി യെഹൂദ്യനിവാസി എന്ന ഭൂമിശാസ്ത്രാർഥം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: അയാളുടെ പേര് ബർ-യേശു എന്നായിരുന്നു
  rationale: ഗ്രീക്ക് നാമപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം. പേര് വിവർത്തനം ചെയ്യാതെ ലിപ്യന്തരണം ചെയ്തിരിക്കുന്നു; ഹൈഫൻ അതിന്റെ സെമിറ്റിക് ഘടന തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
theological_decisions:
- issue: Βαριησοῦ എന്ന വ്യക്തിനാമത്തിന്റെ അവതരണം
  choice: ബർ-യേശു
  alternative: ബർയേശു; ‘യേശുവിന്റെ മകൻ’
  rationale: പേരിന്റെ ഘടകങ്ങൾ അർഥപരമായി പരിഭാഷപ്പെടുത്താതെ വ്യക്തിനാമമായി ലിപ്യന്തരണം ചെയ്യുന്നു. ഹൈഫൻ ‘ബർ’ എന്ന പിതൃനാമഘടകത്തെ വായനക്കാർക്ക് തിരിച്ചറിയാൻ സഹായിക്കുന്നു; അതിന്റെ സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കഥനശൈലി ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാള വാക്യങ്ങളാക്കി; വിവരക്രമവും അർഥബന്ധവും നിലനിർത്തി.
