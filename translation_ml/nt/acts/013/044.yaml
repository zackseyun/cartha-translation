id: ACT.13.44
reference: Acts 13:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: ml
  text: വരുന്ന ശബ്ബത്തിൽ[a] ഏതാണ്ട് നഗരം മുഴുവൻ കർത്താവിന്റെ വചനം[b] കേൾക്കാൻ ഒത്തുകൂടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടുത്ത ശബ്ബത്തിൽ’ അല്ലെങ്കിൽ ‘തുടർന്നുള്ള ശബ്ബത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവിന്റെ വചനം’ എന്നത് ‘കർത്താവിന്റെ സന്ദേശം’ എന്നോ, സന്ദർഭാനുസരിച്ച് ‘കർത്താവിനെക്കുറിച്ചുള്ള സന്ദേശം’ എന്നോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: അടുത്തുവരുന്ന ശബ്ബത്തിൽ
  rationale: 'ἐρχομένῳ എന്ന വർത്തമാന കൃദന്തത്തോടുകൂടിയ ദത്തിവ് കാലസൂചനയാണ്: ‘വരുന്ന/അടുത്ത ശബ്ബത്തിൽ.’ മലയാളത്തിൽ ‘അടുത്തുവരുന്ന ശബ്ബത്തിൽ’ മൂലരൂപത്തോട് ചേർന്നുനിൽക്കുകയും സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.'
- source_word: σχεδὸν πᾶσα ἡ πόλις
  choice: പട്ടണം മുഴുവൻതന്നെ
  rationale: σχεδόν എന്ന ‘ഏതാണ്ട്/മിക്കവാറും’ എന്ന അർഥം ‘മുഴുവൻതന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ഇത് ഓരോ വ്യക്തിയും ഒഴിവില്ലാതെ എന്ന കർശന അവകാശവാദമാക്കാതെ നഗരജനതയുടെ അതിവിപുലമായ പങ്കാളിത്തം സൂചിപ്പിക്കുന്നു.
- source_word: συνήχθη
  choice: ഒന്നിച്ചുകൂടി
  rationale: συνάγω എന്ന ക്രിയയുടെ ഇവിടെ കാണുന്ന നിഷ്ക്രിയരൂപത്തിന് അകർമകമായ ‘കൂടിവന്നു/ഒത്തുകൂടി’ എന്ന അർഥമാണ്. ‘ഒന്നിച്ചുകൂടി’ സമൂഹമായി സമ്മേളിച്ചതിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἀκοῦσαι
  choice: കേൾക്കാൻ
  rationale: ഉദ്ദേശം സൂചിപ്പിക്കുന്ന അനന്തക്രിയാരൂപം നേരിട്ട് ‘കേൾക്കാൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὸν λόγον
  choice: വചനം
  rationale: λόγος ഇവിടെ പ്രസംഗിക്കപ്പെട്ട സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു. അപ്പൊസ്തലപ്രവൃത്തികളിൽ ആവർത്തിക്കുന്ന പ്രഖ്യാപനപരമായ പ്രയോഗം നിലനിർത്താൻ ‘വചനം’ തെരഞ്ഞെടുത്തു; ‘സന്ദേശം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്നതിന് സ്ഥിരവും മാന്യവുമായ ‘കർത്താവ്’ ഉപയോഗിച്ചു. ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘കർത്താവിന്റെ’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: ആദ്യകാല ക്രൈസ്തവ പ്രഖ്യാപനഭാഷയോടു ചേർന്നുനിൽക്കുന്ന പതിവായ മലയാളരൂപമാണ് ‘കർത്താവ്’; സന്ദർഭം വ്യക്തമാക്കുന്നതിലധികം അതിന്റെ വ്യക്തിസൂചന ചുരുക്കുന്നില്ല.
- issue: ‘കർത്താവിന്റെ വചനം’ എന്ന ജനിറ്റീവ് പ്രയോഗത്തിന്റെ അർഥം
  choice: പരമ്പരാഗതമായ ‘കർത്താവിന്റെ വചനം’ എന്ന രൂപം നിലനിർത്തി
  alternative: കർത്താവിൽനിന്നുള്ള സന്ദേശം / കർത്താവിനെക്കുറിച്ചുള്ള സന്ദേശം
  rationale: τοῦ κυρίου എന്ന ജനിറ്റീവ് ഉറവിടം, ഉടമസ്ഥബന്ധം, വിഷയം എന്നീ പരസ്പരം മുട്ടിനിൽക്കുന്ന സൂചനകൾ വഹിക്കാം. പ്രധാനവാക്യത്തിൽ അതിനെ ഒറ്റ വ്യാഖ്യാനമായി തീർപ്പാക്കാതെ യഥാർഥമായ അവ്യക്തത നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശബ്ബത്ത്,’ ‘കർത്താവ്,’ ‘വചനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി.
