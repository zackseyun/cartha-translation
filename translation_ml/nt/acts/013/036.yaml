  terminology: ‘നിദ്രപ്രാപിച്ചു’ മൂലത്തിലെ മരണസൗമ്യോക്തി നിലനിർത്തുന്നു. ‘പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു’ സെമിറ്റിക്-ബൈബിൾപ്രയോഗം യോജിച്ചതാണ്. ‘ജീർണത’ക്കു പകരം ‘അഴുകൽ’ διαφθοράയുടെ ഈ സന്ദർഭത്തിലെ ശരീരക്ഷയാർഥവും അടുത്ത വാക്യത്തിലെ വൈരുധ്യവും കൂടുതൽ സുതാര്യമാക്കുന്നു.
