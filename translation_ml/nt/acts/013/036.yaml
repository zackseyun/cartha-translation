  source_fidelity: ‘ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തിനായി സേവിച്ചശേഷം’ എന്നത് ദാവീദ് ഒരു ലക്ഷ്യത്തിനുവേണ്ടി സേവിച്ചു എന്ന ഭാവം നൽകുന്നു. ഗ്രീക്കിലെ τῇ ... βουλῇ, ὑπηρετήσας-നോടു ബന്ധപ്പെട്ട്, ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തെ/ഹിതത്തെ സേവിച്ചു എന്നതാണ് കൂടുതൽ നേരിട്ടുള്ളത്. διαφθοράയ്ക്ക് ‘അഴുകൽ’ ശരീരക്ഷയത്തെ കൂടുതൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
