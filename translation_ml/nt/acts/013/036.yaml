id: ACT.13.36
reference: Acts 13:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: ml
  text: ദാവീദ് തന്റെ തലമുറയിൽ ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തെ സേവിച്ചശേഷം[a] നിദ്രപ്രാപിച്ചു[b], തന്റെ പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു[c], അഴുകൽ കണ്ടു[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ദൈവത്തിന്റെ ഉദ്ദേശ്യമനുസരിച്ച് തന്റെ തലമുറയെ സേവിച്ചശേഷം.’
    reason: ദത്തിവ് പദസമുച്ചയങ്ങളുടെ മറ്റൊരു സാധ്യമായ വ്യാകരണബന്ധം സൂചിപ്പിക്കാൻ.
  - marker: b
    text: ‘നിദ്രപ്രാപിച്ചു’ എന്നത് മരണത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ സൗമ്യോക്തിയാണ്.
    reason: മരണത്തിനുള്ള മൂലപാഠത്തിലെ രൂപകം വ്യക്തമാക്കാൻ.
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘തന്റെ പിതാക്കന്മാരോടു കൂട്ടിച്ചേർക്കപ്പെട്ടു’; മരണത്തിൽ പൂർവികരോടു ചേർന്നു എന്നർഥമുള്ള എബ്രായശൈലിയാണിത്.
    reason: സെമിറ്റിക് പ്രയോഗത്തിന്റെ അക്ഷരരൂപവും ഉദ്ദേശ്യാർഥവും വ്യക്തമാക്കാൻ.
  - marker: d
    text: അതായത്, അവന്റെ ശരീരം അഴുകലിന് വിധേയമായി; അടുത്ത വാക്യത്തിലെ വിരോധം താരതമ്യം ചെയ്യുക.
    reason: ‘അഴുകൽ കണ്ടു’ എന്ന രൂപകത്തിന്റെ ശാരീരിക സൂചനയും സന്ദർഭബന്ധവും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: തന്റെ തലമുറയിൽ
  rationale: ദാവീദിന്റെ സേവനം നടന്ന കാലപരിധിയെയും ചരിത്രസാഹചര്യത്തെയും സൂചിപ്പിക്കുന്ന ദത്തിവ് പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു; ‘തന്റെ തലമുറയ്ക്കുവേണ്ടി’ എന്ന് ഗുണഭോക്തൃബന്ധം നിർബന്ധിക്കുന്നില്ല.
- source_word: ὑπηρετήσας
  choice: സേവിച്ചശേഷം
  rationale: പ്രധാന ക്രിയകൾക്കു മുമ്പുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന aorist participle ആണ്. ‘സേവിച്ചശേഷം’ ക്രമബന്ധം വ്യക്തമാക്കുകയും സഭാപരമായ അർഥത്തിലേക്കു ചുരുങ്ങാവുന്ന ‘ശുശ്രൂഷിച്ചശേഷം’ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തിനായി
  rationale: βουλή എന്നത് ഇവിടെ ഉദ്ദേശ്യം, പദ്ധതി, ആലോചന എന്നിവയുടെ അർഥവ്യാപ്തിയുള്ളതാണ്. ‘ഉദ്ദേശ്യം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൈവിക ലക്ഷ്യബോധം പ്രകടമാക്കുന്നതുമാണ്. വാക്യഘടനയിലെ മറ്റൊരു സാധ്യബന്ധം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐκοιμήθη
  choice: നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ സൗമ്യോക്തിയും ബൈബിൾപ്രതിധ്വനിയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സാധാരണ ഉറക്കമായി തെറ്റിദ്ധരിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: തന്റെ പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു
  rationale: മരണത്തിൽ പൂർവികരോടു ചേരുന്നതിനെ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലി മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, ‘കൂട്ടിച്ചേർക്കപ്പെട്ടു’ എന്ന അതികഠിനമായ പദാനുപദരൂപം ഒഴിവാക്കി നൽകുന്നു.
- source_word: εἶδεν διαφθοράν
  choice: ജീർണത കണ്ടു
  rationale: സങ്കീർത്തന ഉദ്ധരണിയുമായും അടുത്ത വാക്യത്തിലെ വിരോധവുമായും ബന്ധമുള്ള ‘കണ്ടു’ എന്ന രൂപകം നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശരീരത്തിന്റെ അഴുകലാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദാവീദിന്റെ സേവനത്തോടുള്ള ദത്തിവ് പദസമുച്ചയങ്ങളുടെ ബന്ധം
  choice: തന്റെ തലമുറയിൽ ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തിനായി സേവിച്ചശേഷം
  alternative: ദൈവത്തിന്റെ ഉദ്ദേശ്യമനുസരിച്ച് തന്റെ തലമുറയെ സേവിച്ചശേഷം
  rationale: ഗ്രീക്ക് പദക്രമവും ദത്തിവ് രൂപങ്ങളും രണ്ടുതരത്തിലുള്ള വ്യാകരണബന്ധങ്ങൾക്ക് ഇട നൽകുന്നു. മുഖ്യവാചകം ദാവീദ് തന്റെ കാലത്ത് ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തിനായി സേവിച്ചു എന്ന വായന സ്വീകരിക്കുന്നു; സ്വന്തം തലമുറയെ സേവിച്ചു എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ദാവീദിന്റെ മരണത്തെ സൂചിപ്പിക്കുന്ന സൗമ്യോക്തി
  choice: നിദ്രപ്രാപിച്ചു
  alternative: മരിച്ചു
  rationale: κοιμάομαι എന്ന മൂലക്രിയയിലെ ഉറക്കരൂപകം നിലനിർത്തുന്നു; അതിൽനിന്ന് പ്രത്യേകമായ മരണാനന്തരാവസ്ഥാസിദ്ധാന്തം നിർബന്ധിക്കുന്നില്ല.
- issue: διαφθορά എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ജീർണത കണ്ടു
  alternative: അഴുകലിന് വിധേയനായി
  rationale: നേരിട്ടുള്ള രൂപകവും തുടർന്നുള്ള വാക്യത്തിലെ ക്രിസ്തുവുമായുള്ള വിരോധവും നിലനിർത്തുന്നു; അർഥം ശരീരക്ഷയമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘നിദ്രപ്രാപിച്ചു’, ‘പിതാക്കന്മാരോടു ചേർക്കപ്പെട്ടു’, ‘ജീർണത കണ്ടു’ എന്നീ ബൈബിൾരൂപങ്ങൾ മൂലത്തിലെ പ്രതിധ്വനി നിലനിർത്തുന്നതിനായി സൂക്ഷിച്ചു; അവയുടെ അർഥം അടിക്കുറിപ്പുകളിൽ ലളിതമായി വിശദീകരിച്ചു.
