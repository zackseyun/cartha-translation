source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: ml
  text: വിജാതീയർ ഇതു കേട്ടപ്പോൾ[a] സന്തോഷിക്കാനും കർത്താവിന്റെ വചനത്തെ മഹത്വപ്പെടുത്താനും തുടങ്ങി. നിത്യജീവനായി നിയമിക്കപ്പെട്ടിരുന്നവരെല്ലാം വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിത്യജീവനിലേക്കു മനസ്സൊരുക്കപ്പെട്ടിരുന്നവർ.” ഗ്രീക്ക് കൃദന്തരൂപത്തെ വ്യാഖ്യാതാക്കൾ വ്യത്യസ്തമായി മനസ്സിലാക്കുന്നുണ്ടെങ്കിലും, “നിയമിക്കപ്പെട്ടിരുന്നവർ” എന്ന കർമണി അർഥമാണ് ഇവിടെ ഏറ്റവും നേരിട്ടുള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: ഇതു കേട്ടപ്പോൾ
  rationale: വർത്തമാന കൃദന്തത്തെ പ്രധാന ക്രിയകളുടെ സാഹചര്യം സൂചിപ്പിക്കുന്ന കാലവാക്യമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി; സന്ദർഭത്തിൽനിന്ന് ‘ഇതു’ വ്യക്തമാക്കി.
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘ജനതകൾ’ എന്നത് ഗ്രീക്കിലെ ബഹുവചനരൂപവും സാധാരണ വായനക്കാർക്കുള്ള സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: സന്തോഷിക്കാനും ... മഹത്ത്വപ്പെടുത്താനും തുടങ്ങി
  rationale: രണ്ട് അപൂർണഭൂതകാല ക്രിയകളുടെയും തുടരുന്നോ ആരംഭിക്കുന്നോ ആയ ആഖ്യാനഭാവം ഏകോപിതമായി പ്രകടിപ്പിക്കുന്നു; ‘തുടങ്ങി’ എന്നത് രണ്ടിനും ബാധകമാണ്.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: കർത്താവിന്റെ വചനം
  rationale: പ്രഘോഷിക്കപ്പെട്ട സന്ദേശമാണ് അർഥമെങ്കിലും, ‘വചനം’ ബൈബിൾഭാഷയിലെ പരിചിതമായ പ്രയോഗവും മൂലത്തിലെ λόγος എന്ന പദത്തിന്റെ അനുരണനവും നിലനിർത്തുന്നു.
- source_word: ἐπίστευσαν
  choice: വിശ്വസിച്ചു
  rationale: അയോറിസ്റ്റ് സൂചകക്രിയയെ വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ ലളിതഭൂതകാലത്തിൽ നൽകി.
- source_word: ὅσοι
  choice: വരെല്ലാം
  rationale: പരിമാണബോധമുള്ള ബന്ധസർവനാമത്തിന്റെ അർഥം ‘...വരെല്ലാം’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി.
- source_word: τεταγμένοι
  choice: നിയമിക്കപ്പെട്ടിരുന്നവർ
  rationale: τάσσωയുടെ പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തരൂപം മുൻകൂട്ടി ഉണ്ടായ നിയമനം/നിയോഗം സൂചിപ്പിക്കുന്നതായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി; നിഷ്ക്രിയഭാവം സംരക്ഷിച്ചു.
- source_word: εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനായി
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യസംബന്ധിയായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘-ആയി’ എന്ന രൂപത്തിൽ നൽകി.
theological_decisions:
- issue: τεταγμένοι എന്ന പദം ദൈവിക നിയമനത്തെയും മനുഷ്യപ്രതികരണത്തെയും എങ്ങനെ ബന്ധിപ്പിക്കുന്നു
  choice: നിത്യജീവനായി നിയമിക്കപ്പെട്ടിരുന്നവർ
  alternative: നിത്യജീവനിലേക്കു മനസ്സൊരുക്കപ്പെട്ടിരുന്നവർ
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തത്തിന്റെ ഏറ്റവും നേരിട്ടുള്ള അർഥം നിയമിക്കപ്പെട്ടവർ/നിയോഗിക്കപ്പെട്ടവർ എന്നാണ്. വാക്യം പറയുന്നതിലധികം മുൻനിർണ്ണയത്തെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തം ചേർക്കാതെ നിഷ്ക്രിയ വ്യാകരണരൂപം നിലനിർത്തി; വ്യത്യസ്ത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കർത്താവ്’, ‘വചനം’, ‘നിത്യജീവൻ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വിവാദമായ τεταγμένοιയുടെ വ്യാകരണ നിഷ്ക്രിയത മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച് മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
