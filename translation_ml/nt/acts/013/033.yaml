id: ACT.13.33
reference: Acts 13:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: ml
  text: 'ദൈവം നമ്മുടെ മക്കൾക്കു[a] ഇതു നിറവേറ്റിയിരിക്കുന്നു, യേശുവിനെ ഉയർത്തിയതിലൂടെ[b], രണ്ടാം സങ്കീർത്തനത്തിൽ എഴുതിയിരിക്കുന്നതുപോലെ:


    “നീ എന്റെ പുത്രൻ;

    ഇന്നു ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മെ, അവരുടെ മക്കളെ സംബന്ധിച്ച്.” ചില കൈയെഴുത്തുപ്രതികൾ “നമ്മുടെ മക്കൾക്ക്” എന്നു വായിക്കുമ്പോൾ, മറ്റുള്ളവ “നമ്മെ, അവരുടെ മക്കളെ” എന്ന വായനയെ പിന്തുണയ്ക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: “യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിലൂടെ” എന്നും അർഥമാകാം; ഗ്രീക്ക് ക്രിയയ്ക്ക് യേശുവിനെ ഉയർത്തിക്കൊണ്ടുവരുക, അഥവാ നിയോഗിക്കുക, എന്ന അർഥവും ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: നിറവേറ്റിയിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന perfect രൂപവും വാഗ്ദാനനിവൃത്തിയുടെ ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ταύτην
  choice: ഇതു
  rationale: മുൻസന്ദർഭത്തിലെ വാഗ്ദാനത്തെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘വാഗ്ദാനം’ എന്ന നാമം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: നമ്മുടെ മക്കൾക്കായി
  rationale: ലഭ്യമായ SBLGNT പാഠത്തിലെ വാക്കുകൾ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; τέκνα എന്നതിന് സന്ദർഭത്തിൽ ‘സന്തതികൾ’ എന്ന അർഥവും സാധ്യമാണെങ്കിലും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘മക്കൾ’ തെരഞ്ഞെടുത്തു.
- source_word: ἀναστήσας Ἰησοῦν
  choice: യേശുവിനെ ഉയർത്തിക്കൊണ്ടുവന്നതിലൂടെ
  rationale: യേശുവിനെ രംഗത്തേക്ക് കൊണ്ടുവന്നു/നിയോഗിച്ചു എന്ന അർഥത്തിനും മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു എന്ന അർഥത്തിനുമിടയിലെ സാധ്യത പൂർണമായി തീർപ്പാക്കാതെ നിലനിർത്താൻ ശ്രമിക്കുന്നു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; perfect-ന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും ഇതിൽ അടങ്ങിയിരിക്കുന്നു.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: രണ്ടാം സങ്കീർത്തനത്തിൽ
  rationale: ഗ്രീക്ക് പദക്രമത്തിന്റെ അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Υἱός μου εἶ σύ
  choice: നീ എന്റെ പുത്രൻ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം.
- source_word: σήμερον γεγέννηκά σε
  choice: ഇന്നു ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു
  rationale: γεννάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും സങ്കീർത്തനം 2:7-ന്റെ അന്തർപാഠപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ ഭാരം വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀναστήσας Ἰησοῦν എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘യേശുവിനെ ഉയർത്തിക്കൊണ്ടുവന്നതിലൂടെ’ എന്നു നൽകി, ഉയിർപ്പിനും ദൈവം യേശുവിനെ എഴുന്നേൽപ്പിച്ച് നിയോഗിച്ചതിനുമിടയിലെ അർഥസാധ്യത തുറന്നുവെച്ചു.
  alternative: ‘യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിലൂടെ’ അല്ലെങ്കിൽ ‘യേശുവിനെ നിയോഗിച്ച് രംഗത്തേക്ക് കൊണ്ടുവന്നതിലൂടെ’.
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ ഉയിർപ്പ് കൂടുതൽ വ്യക്തമായി പറയപ്പെടുന്നു; അതേസമയം പ്രവൃത്തികളിൽ ἀνίστημι ഒരു വിമോചകനെ ദൈവം എഴുന്നേൽപ്പിക്കുന്നതിനും ഉപയോഗിക്കുന്നു. അതിനാൽ മുഖ്യപാഠം ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: ‘ഇന്നു ഞാൻ നിന്നെ ജനിപ്പിച്ചിരിക്കുന്നു’ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ പ്രാബല്യം
  choice: സങ്കീർത്തനം 2:7-ലെ ഉദ്ധരണി വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നേരിട്ട് നിലനിർത്തി.
  alternative: രാജാഭിഷേകം/ദത്തെടുക്കൽ സൂചിപ്പിക്കുന്ന ഭാഷയായി അല്ലെങ്കിൽ ഉയിർപ്പിലെ സ്ഥിരീകരണമായി വിശദീകരിക്കുക.
  rationale: വിവർത്തനം പിന്നീട് രൂപപ്പെട്ട വ്യാഖ്യാനവിവാദങ്ങൾ തീർപ്പാക്കരുത്; ഉദ്ധരണിയുടെ യഥാർഥ ഭാഷയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതും തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രൻ’, ‘ജനിപ്പിച്ചിരിക്കുന്നു’ എന്നിവ അന്തർപാഠപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്താൻ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
