id: ACT.13.19
reference: Acts 13:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ καθελὼν ἔθνη ἑπτὰ ἐν γῇ Χανάαν ⸀κατεκληρονόμησεν τὴν γῆν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: ml
  text: കനാൻദേശത്തിലെ ഏഴു ജനതകളെ നശിപ്പിച്ചശേഷം, അവരുടെ ദേശം അവൻ ഇസ്രായേൽജനത്തിന് അവകാശമായി നൽകി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അവരുടെ ദേശം അവൻ ഇസ്രായേൽജനത്തിന് ഓഹരിയായി വിഭജിച്ചുകൊടുത്തു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അവകാശത്തിന്റെ അടിസ്ഥാനത്തിൽ വിതരണം ചെയ്യുക അഥവാ ഓഹരി നിശ്ചയിച്ചുകൊടുക്കുക എന്ന ആശയം ഊന്നാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: നശിപ്പിച്ചശേഷം
  rationale: καθαιρέω എന്ന ക്രിയയുടെ ഈ സന്ദർഭത്തിലെ അർഥം കനാന്യജനതകൾക്കെതിരായ ദൈവത്തിന്റെ നിർണായക നടപടി സൂചിപ്പിക്കുന്നു. ‘നശിപ്പിക്കുക’ എന്നത് ആ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔθνη ἑπτὰ
  choice: ഏഴു ജനതകൾ
  rationale: ἔθνη എന്നതിന് ‘ജനതകൾ’ എന്നും ‘രാഷ്ട്രങ്ങൾ’ എന്നും അർഥമാകാം. പുരാതന കനാനിലെ ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ ചരിത്രസന്ദർഭത്തിൽ ‘ജനതകൾ’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ἐν γῇ Χανάαν
  choice: കനാൻദേശത്തിലെ
  rationale: മൂലപാഠത്തിലെ γῇ (‘ദേശം’) നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തരൂപം ഉപയോഗിച്ചു.
- source_word: κατεκληρονόμησεν
  choice: അവകാശമായി നൽകി
  rationale: ഈ ക്രിയയ്ക്ക് അവകാശമായി നൽകുക, ഓഹരിയായി വിഭജിച്ചുകൊടുക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. പ്രധാനപാഠം അവകാശത്തിന്റെ ആശയം നിലനിർത്തുന്നു; വിതരണത്തെ ഊന്നുന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τὴν γῆν αὐτῶν
  choice: അവരുടെ ദേശം
  rationale: αὐτῶν മുമ്പു പറഞ്ഞ ഏഴു ജനതകളെ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘അവരുടെ ദേശം’ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണ്.
theological_decisions:
- issue: പ്രവർത്തനങ്ങളുടെ കർത്താവും അവകാശം ലഭിക്കുന്നവരും
  choice: രണ്ടു പ്രവർത്തനങ്ങളുടെയും കർത്താവ് ദൈവമാണെന്ന് ‘അവൻ’കൊണ്ട് നിലനിർത്തി; വ്യക്തമാക്കാത്ത പരോക്ഷ കർമത്തെ ‘ഇസ്രായേൽജനം’ എന്ന് വ്യക്തമാക്കി.
  alternative: ‘അവരുടെ ദേശം അവൻ അവകാശമായി നൽകി’ എന്ന് സ്വീകർത്താവിനെ വ്യക്തമാക്കാതെ വിടുക.
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ പൗലോസ് ദൈവം ഇസ്രായേലിന്റെ ചരിത്രത്തിൽ ചെയ്ത കാര്യങ്ങൾ വിവരിക്കുന്നു. ഗ്രീക്കിൽ സ്വീകർത്താവിനെ പ്രത്യേകം പറയുന്നില്ലെങ്കിലും, ചരിത്രസന്ദർഭത്തിൽ ദേശം ലഭിച്ചത് ഇസ്രായേലിനാണ്. ‘ഇസ്രായേൽജനത്തിന്’ എന്ന വ്യക്തമാക്കൽ ആശയക്കുഴപ്പം ഒഴിവാക്കുന്ന സന്ദർഭാധിഷ്ഠിത വിശദീകരണമാണ്; പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കുന്നതല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. ‘കനാൻദേശം,’ ‘ജനത,’ ‘അവകാശം’ എന്നിവ ചരിത്രപരവും ബൈബിൾസന്ദർഭോചിതവുമായ പദങ്ങളാണ്.
