  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: ml
  text: അവന്റെ വരവിനു മുമ്പ്[a], യോഹന്നാൻ ഇസ്രായേൽജനതയോടാകെ മാനസാന്തരസ്നാനം[b] പ്രസംഗിച്ചിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ ആഗമനത്തിനു മുമ്പ്.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘അവന്റെ പ്രവേശനത്തിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നാണ്; ഒരാളുടെ വരവിനു മുൻപേ എന്നർഥമുള്ള ശൈലീപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മാനസാന്തരത്തിനായുള്ള സ്നാനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: പ്രസംഗിച്ചിരുന്നു
  rationale: മുമ്പ് നടന്ന പരസ്യപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്ന aorist participle-ന്റെ കാലബന്ധം മലയാളത്തിലെ പൂർവകാലരൂപം സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ‘മുമ്പ്’ കാലമുൻഗണന വ്യക്തമാക്കുന്നതിനാൽ ‘മുൻകൂട്ടി’ എന്ന് ആവർത്തിച്ചിട്ടില്ല.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: അവന്റെ വരവിനു മുമ്പ്
  rationale: അക്ഷരാർഥത്തിൽ ‘അവന്റെ പ്രവേശനത്തിന്റെ മുഖത്തിനു മുമ്പിൽ’ എന്നായാലും, മറ്റൊരാളുടെ വരവിന് മുൻപേ എന്നർഥമുള്ള ഗ്രീക്ക് ശൈലിയാണിത്. ‘വരവിനു മുമ്പ്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: εἰσόδου
  choice: വരവ്
  rationale: പദത്തിന് ‘പ്രവേശനം’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആ വ്യക്തിയുടെ എത്തിച്ചേരൽ അഥവാ പ്രത്യക്ഷപ്പെടലാണ്.
- source_word: βάπτισμα μετανοίας
  choice: മാനസാന്തരത്തിന്റെ സ്നാനം
  rationale: ഗ്രീക്കിലെ genitive ബന്ധം നേരിട്ട് നിലനിർത്തുകയും യോഹന്നാന്റെ ശുശ്രൂഷയുമായി ബന്ധപ്പെട്ട പതിവ് പുതിയനിയമ പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ലക്ഷ്യാർഥത്തിലുള്ള ‘മാനസാന്തരത്തിനായുള്ള സ്നാനം’ എന്ന വായനയും സാധ്യമാണ്.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: ഇസ്രായേൽജനത്തിനെല്ലാം
  rationale: πᾶς, λαός എന്നീ ഘടകങ്ങൾ രണ്ടും സംരക്ഷിച്ചുകൊണ്ട് പ്രഖ്യാപനത്തിന്റെ പരോക്ഷ കർമം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἰωάννου
  choice: യോഹന്നാൻ
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ടതും ആധുനിക വായനക്കാർക്ക് പരിചിതവുമായ പേരുരൂപം.
theological_decisions:
- issue: ‘അവന്റെ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: സർവനാമം അതേപടി നിലനിർത്തി; പ്രവൃത്തികൾ 13:23–25-ന്റെ സന്ദർഭത്തിൽ അത് യേശുവെന്ന രക്ഷകനെ സൂചിപ്പിക്കുന്നു.
  alternative: ഈ വാക്യത്തിൽ ‘യേശുവിന്റെ’ എന്ന് പേര് വ്യക്തമാക്കി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ പേര് ആവർത്തിക്കുന്നില്ല. മുൻസന്ദർഭം സൂചിതവ്യക്തിയെ മതിയായവിധം വ്യക്തമാക്കുന്നതിനാൽ അർഥം വിശദീകരിച്ച് ചേർക്കാതെ സർവനാമം സംരക്ഷിച്ചു.
- issue: βάπτισμα μετανοίας എന്നതിലെ genitive ബന്ധം
  choice: ‘മാനസാന്തരത്തിന്റെ സ്നാനം’ എന്ന രൂപത്തിൽ ബന്ധത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തി.
  alternative: ‘മാനസാന്തരത്തിനായുള്ള സ്നാനം’ എന്ന് ലക്ഷ്യബന്ധമായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് ഘടനയ്ക്ക് ബന്ധമോ ലക്ഷ്യമോ സൂചിപ്പിക്കാനാകുന്നതിനാൽ മുഖ്യപാഠത്തിൽ genitive രൂപം സംരക്ഷിക്കുകയും ലക്ഷ്യാർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മാനസാന്തരം,’ ‘സ്നാനം,’ ‘യോഹന്നാൻ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
