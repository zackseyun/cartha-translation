id: ACT.13.41
reference: Acts 13:41
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: ml
  text: “നോക്കൂ[a], പരിഹസിക്കുന്നവരേ, ആശ്ചര്യപ്പെടൂ; നശിച്ചുപോകൂ[b]. എന്തെന്നാൽ, നിങ്ങളുടെ നാളുകളിൽ ഞാൻ ഒരു പ്രവൃത്തി ചെയ്യുന്നു—ആരെങ്കിലും അത് നിങ്ങളോടു വിശദമായി പറഞ്ഞുതന്നാലും[c] നിങ്ങൾ ഒരിക്കലും വിശ്വസിക്കാത്ത ഒരു പ്രവൃത്തി.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാണൂ.” ശ്രദ്ധ ക്ഷണിക്കുന്ന ആജ്ഞയാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അപ്രത്യക്ഷരാകൂ” അല്ലെങ്കിൽ “നശിപ്പിക്കപ്പെടൂ.” ഗ്രീക്കിലുള്ള ഹബക്കൂക്ക് 1:5-ന്റെ പ്രതിധ്വനിയായ ഈ പ്രയോഗം ശക്തമായ വിനാശമുന്നറിയിപ്പ് വഹിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ഇവിടെയുള്ള ഗ്രീക്ക് ക്രിയയ്ക്ക് “പൂർണമായി വിവരിക്കുക” അല്ലെങ്കിൽ “വിശദമായി പറഞ്ഞുതരുക” എന്നർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: നോക്കൂ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ബഹുവചന ആജ്ഞയെ സ്വാഭാവികവും നേരിട്ടുമുള്ള ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἱ καταφρονηταί
  choice: നിന്ദിക്കുന്നവരേ
  rationale: അവജ്ഞയോടെയുള്ള നിരസനമാണ് പദത്തിന്റെ കേന്ദ്രാർഥം. ‘പരിഹസിക്കുന്നവരേ’ എന്നതിനെക്കാൾ വിശാലമായി നിന്ദയും അവഗണനയും ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: θαυμάσατε
  choice: ആശ്ചര്യപ്പെടൂ
  rationale: പ്രവാചകവചനത്തിലെ വിസ്മയവും ഞെട്ടലും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള ആജ്ഞാരൂപം.
- source_word: ἀφανίσθητε
  choice: നശിച്ചുപോകൂ
  rationale: അപ്രത്യക്ഷമാകുക എന്ന അടിസ്ഥാനചായത്തോടൊപ്പം സന്ദർഭത്തിലെ ന്യായവിധിയുടെയും നാശത്തിന്റെയും ശക്തമായ മുന്നറിയിപ്പ് അറിയിക്കുന്നു.
- source_word: ἔργον
  choice: പ്രവൃത്തി
  rationale: ദൈവത്തിന്റെ നിർണായകമായ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന, സഭാഭാഷയിൽ മാത്രം ഒതുങ്ങാത്ത മാന്യവും പരിചിതവുമായ പദം.
- source_word: ἐργάζομαι ἐγώ
  choice: ഞാൻ ഒരു പ്രവൃത്തി ചെയ്യുന്നു
  rationale: വർത്തമാനകാല പ്രവർത്തനവും പ്രത്യേകം പറഞ്ഞിരിക്കുന്ന ‘ഞാൻ’ എന്ന കർത്താവിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: നിങ്ങളുടെ നാളുകളിൽ
  rationale: കാലസൂചനയും കേൾവിക്കാരോടുള്ള പ്രവാചകവചനത്തിന്റെ നേരിട്ടുള്ള പ്രസക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: οὐ μὴ πιστεύσητε
  choice: നിങ്ങൾ ഒരിക്കലും വിശ്വസിക്കാത്ത
  rationale: οὐ μή എന്ന ശക്തമായ നിഷേധത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: ആരെങ്കിലും അതു നിങ്ങളോടു വിശദമായി വിവരിച്ചാലും
  rationale: ἐκδιηγέομαι എന്നതിലെ പൂർണമായി വിവരിക്കുക/വിശദമായി പറഞ്ഞുതരുക എന്ന ചായം നിലനിർത്തുന്നു; ഉപാധിവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘-ആലും’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ഹബക്കൂക്ക് 1:5-ൽ നിന്നുള്ള ഉദ്ധരണിയിലെ ന്യായവിധി മുന്നറിയിപ്പിന്റെ ശക്തി
  choice: ‘നശിച്ചുപോകൂ’ എന്ന ശക്തമായ ന്യായവിധിഭാഷയും ‘ഒരിക്കലും വിശ്വസിക്കാത്ത’ എന്ന ഊന്നിയ നിഷേധവും ഉപയോഗിച്ചു.
  alternative: ‘അപ്രത്യക്ഷരാകൂ’ എന്നു കൂടുതൽ പദാനുപദമായി നൽകുക, അല്ലെങ്കിൽ നാശസൂചന മൃദുവാക്കുക.
  rationale: ഗ്രീക്ക് ഉദ്ധരണി അവിശ്വാസത്തിനെതിരായ ഗൗരവമുള്ള മുന്നറിയിപ്പാണ്. ‘നശിച്ചുപോകൂ’ സന്ദർഭത്തിലെ വിനാശസൂചന വ്യക്തമാക്കുന്നു; എന്നാൽ അടിസ്ഥാനപദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പ്രവാചകീയ തീവ്രതയുള്ളതുമായ ശൈലി. ബഹുവചന ആജ്ഞകൾക്ക് വായനാസൗകര്യമുള്ള ‘-ഊ’ രൂപങ്ങൾ ഉപയോഗിച്ചു. ഉദ്ധരണിയുടെ കഠിനമായ മുന്നറിയിപ്പ് മൃദുവാക്കാതെയും അനാവശ്യമായ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർക്കാതെയും സൂക്ഷിച്ചു.
