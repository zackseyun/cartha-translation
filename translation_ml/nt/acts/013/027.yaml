source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: ml
  text: എന്തെന്നാൽ, യെരൂശലേമിൽ വസിക്കുന്നവരും അവരുടെ ഭരണാധികാരികളും ഈയാളെ[a] തിരിച്ചറിയാതെയും എല്ലാ ശബ്ബത്തിലും വായിക്കപ്പെടുന്ന പ്രവാചകന്മാരുടെ വചനങ്ങൾ[b] ഗ്രഹിക്കാതെയും, അവനെ കുറ്റംവിധിച്ചതിലൂടെ ആ വചനങ്ങൾ നിറവേറ്റി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അവനെ.’ ഗ്രീക്കിൽ ‘ഈയാളെ’ എന്ന നിർദേശകസർവനാമമാണുള്ളത്; പ്രസംഗകൻ യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്നതിന് ഇതിൽ ഊന്നൽ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘പ്രവാചകന്മാരുടെ സ്വരങ്ങൾ.’ ഇവിടെ അവരുടെ വചനങ്ങളെയോ പ്രഖ്യാപനങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിൽ വസിക്കുന്നവർ
  rationale: നാമപദമായി പ്രവർത്തിക്കുന്ന കൃദന്തരൂപത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: അവരുടെ ഭരണാധികാരികൾ
  rationale: രാഷ്ട്രീയവും ന്യായാധിപത്യപരവുമായ അധികാരഭാവം നിലനിർത്തുന്നു.
- source_word: τοῦτον
  choice: ഈയാളെ
  rationale: യേശുവിനെ ചൂണ്ടിക്കാണിക്കുന്ന ഗ്രീക്ക് നിർദേശകസർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀγνοήσαντες
  choice: തിരിച്ചറിയാതെയും … ഗ്രഹിക്കാതെയും
  rationale: ഒരേ ഗ്രീക്ക് കൃദന്തം യേശുവിനെയും പ്രവാചകവചനങ്ങളെയും കർമങ്ങളായി സ്വീകരിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി വ്യക്തിയെക്കുറിച്ച് ‘തിരിച്ചറിയുക’ എന്നും വചനങ്ങളെക്കുറിച്ച് ‘ഗ്രഹിക്കുക’ എന്നും സന്ദർഭാനുസൃതമായി നൽകി.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: പ്രവാചകന്മാരുടെ വചനങ്ങൾ
  rationale: φωνάς എന്നതിന്റെ അക്ഷരാർഥം ‘സ്വരങ്ങൾ’ ആണെങ്കിലും, ഇവിടെ വായിക്കപ്പെടുന്ന പ്രവാചകപ്രഖ്യാപനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വചനങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: എല്ലാ ശബ്ബത്തിലും വായിക്കപ്പെടുന്ന
  rationale: ഗ്രീക്കിലെ വിശേഷണാത്മക കൃദന്തപ്രയോഗവും ആവർത്തിതമായ സമയസൂചനയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κρίναντες
  choice: അവനെ കുറ്റം വിധിച്ചതിലൂടെ
  rationale: ഈ സന്ദർഭത്തിൽ κρίνω സാധാരണ വിലയിരുത്തലല്ല, യേശുവിനെതിരായ ന്യായവിധിയാണ്; ‘-തിലൂടെ’ എന്ന രൂപം നിറവേറ്റലിന്റെ മാർഗബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐπλήρωσαν
  choice: നിറവേറ്റി
  rationale: പ്രവാചകവചനങ്ങളുടെ പൂർത്തീകരണം സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെയും പ്രവാചകസാക്ഷ്യത്തെയും സംബന്ധിച്ച അജ്ഞതയുടെ സ്വഭാവം
  choice: ഈയാളെ തിരിച്ചറിയാതെയും … പ്രവാചകന്മാരുടെ വചനങ്ങൾ ഗ്രഹിക്കാതെയും
  alternative: ഈയാളെ അറിയാതെയും പ്രവാചകന്മാരുടെ വചനങ്ങൾ അറിയാതെയും
  rationale: അവന്റെ അസ്തിത്വത്തെക്കുറിച്ചുള്ള അറിവില്ലായ്മയെന്ന് അതിരുകടന്ന് പറയാതെ, അവൻ ആരാണെന്ന തിരിച്ചറിവിലെയും വായിച്ചുകേൾക്കുന്ന പ്രവാചകസാക്ഷ്യം ഗ്രഹിക്കുന്നതിലെയും പരാജയം പ്രകടമാക്കുന്നു.
- issue: ἀγνοήσαντες എന്ന കൃദന്തത്തിന്റെ കർമങ്ങൾ
  choice: ‘ഈയാളെ’ എന്നും ‘പ്രവാചകന്മാരുടെ വചനങ്ങൾ’ എന്നും രണ്ടിനെയും ἀγνοήσαντες-നോട് ബന്ധിപ്പിച്ചു
  alternative: ‘ഈയാളെ’ മാത്രം ἀγνοήσαντες-നോട് ബന്ധിപ്പിച്ച് പ്രവാചകവചനങ്ങളെ ‘നിറവേറ്റി’ എന്നതിനോട് മാത്രം ബന്ധിപ്പിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ τοῦτον καὶ τὰς φωνὰς എന്ന സമുച്ചയം ἀγνοήσαντες എന്നതിന്റേതായ ഇരട്ടകർമമായി വായിക്കുന്നത് ഏറ്റവും സ്വാഭാവികമാണ്; തുടർന്ന് κρίναντες ἐπλήρωσαν എന്നത് ശിക്ഷാവിധിയിലൂടെ അവ നിറവേറ്റിയതായി പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യബന്ധം നിലനിർത്തിക്കൊണ്ട്, വ്യക്തിയെയും വചനങ്ങളെയും സംബന്ധിച്ച ἀγνοέωയുടെ വ്യത്യസ്ത സന്ദർഭാർഥങ്ങൾ മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു.
