id: ACT.13.30
reference: Acts 13:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἤγειρεν αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: ml
  text: എന്നാൽ ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ മനുഷ്യർ ചെയ്തതും ഇവിടെ ദൈവം ചെയ്തതും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θεὸς
  choice: ദൈവം
  rationale: പ്രവർത്തനത്തിന്റെ കർത്താവായി ദൈവത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἤγειρεν
  choice: ഉയിർപ്പിച്ചു
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിൽ ἐγείρω എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു; വെറും എഴുന്നേൽപ്പിച്ചു എന്നതിനെക്കാൾ മരണത്തിൽനിന്നുള്ള ഉയിർത്തെഴുന്നേൽപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സമീപസന്ദർഭത്തിലെ യേശുവിനെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: മരിച്ചവരുടെ ഇടയിൽനിന്ന് എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും പുനരുത്ഥാനാർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ പദപ്രയോഗം
  choice: ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  alternative: ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് എഴുന്നേൽപ്പിച്ചു
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനമായാണ് വാക്യം യേശുവിന്റെ പുനരുത്ഥാനത്തെ അവതരിപ്പിക്കുന്നത്. ‘ഉയിർപ്പിച്ചു’ എന്നത് അധിക വ്യാഖ്യാനം ചേർക്കാതെ മരണത്തിൽനിന്നുള്ള പുനരുത്ഥാനത്തെ വ്യക്തമായി അറിയിക്കുന്നു; ‘എഴുന്നേൽപ്പിച്ചു’ എന്നത് സാധാരണ ഉറക്കത്തിൽനിന്നോ ഇരിപ്പിൽനിന്നോ എഴുന്നേൽപ്പിക്കുന്നതായും ഗ്രഹിക്കപ്പെടാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും പുനരുത്ഥാനാർഥം ‘ഉയിർപ്പിച്ചു’ കൊണ്ടും വ്യക്തമായി നിലനിർത്തി.
