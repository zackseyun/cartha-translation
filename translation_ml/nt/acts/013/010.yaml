  source_fidelity: The Malayalam closely represents the Greek’s emphatic vocative rebuke, including the two comprehensive genitives (παντὸς/πάσης), ‘son of the devil,’ ‘enemy of all righteousness,’ the rhetorical future question, and the image of perverting the Lord’s straight ways. ‘സകലവിധ നീചത്വം’ suitably conveys ῥᾳδιουργία as unscrupulous/villainous conduct without conflating it entirely with δόλος (‘വഞ്ചന’).
