id: ACT.13.10
reference: Acts 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “സകലവിധ വഞ്ചനയും സകലവിധ നീചത്വവും നിറഞ്ഞവനേ, പിശാചിന്റെ മകനേ, സകല നീതിയുടെയും[a] ശത്രുവേ, കർത്താവിന്റെ നേരായ വഴികളെ വളച്ചൊടിക്കുന്നത് നീ നിർത്തുകയില്ലേ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സകല ന്യായത്തിന്റെയും.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് നീതി എന്നോ ന്യായം എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: സകലവിധ വഞ്ചനയും നിറഞ്ഞവനേ
  rationale: πλήρης എന്ന പദത്തിന്റെ ‘നിറഞ്ഞ/സ്വഭാവസവിശേഷതയായ’ എന്ന ആശയവും παντός എന്നതിന്റെ സമഗ്രതയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; δόλος എന്നത് വഞ്ചന, ചതി എന്നീ ആശയങ്ങൾ സൂചിപ്പിക്കുന്നു.
- source_word: πάσης ῥᾳδιουργίας
  choice: സകലവിധ നീചത്വവും
  rationale: ῥᾳδιουργία വെറും പൊതുവായ തിന്മയല്ല, ധാർമിക നിയന്ത്രണമില്ലാത്ത നീചമായ പെരുമാറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘നീചത്വം’ ആരോപണത്തിന്റെ രൂക്ഷത നിലനിർത്തുന്നു.
- source_word: υἱὲ διαβόλου
  choice: പിശാചിന്റെ മകനേ
  rationale: υἱέ എന്നതിന്റെ അക്ഷരാർഥമായ ‘മകൻ’ നിലനിർത്തുന്നു. ഇവിടെ ഇത് ധാർമിക സാദൃശ്യമോ പക്ഷബന്ധമോ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമാണ്.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: സകല നീതിയുടെയും ശത്രുവേ
  rationale: δικαιοσύνη ഇവിടെ ധാർമികമായി ശരിയായതും നേരുള്ളതുമായ എല്ലാറ്റിനെയും സൂചിപ്പിക്കുന്നു. ‘നീതി’ പ്രധാന അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘ന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐ παύσῃ
  choice: നീ നിർത്തുകയില്ലേ?
  rationale: ഭാവികാല ക്രിയയുടെ ശാസനാരൂപത്തിലുള്ള ആലങ്കാരിക ചോദ്യം മലയാളത്തിൽ നേരിടലിന്റെ ശക്തിയോടെ അവതരിപ്പിക്കുന്നു; ‘ഒരിക്കലും’ ചേർത്ത് മൂലപാഠത്തേക്കാൾ തീവ്രമാക്കുന്നില്ല.
- source_word: διαστρέφων
  choice: വളച്ചൊടിക്കുന്നത്
  rationale: നേരായ ഒന്നിനെ വികലമാക്കുക, തെറ്റായ ദിശയിലാക്കുക എന്നീ διαστρέφωയുടെ രൂപകാർഥങ്ങൾ ‘വളച്ചൊടിക്കുക’ വ്യക്തമായി പകരുന്നു.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: കർത്താവിന്റെ നേരായ വഴികളെ
  rationale: ὁδοίയുടെ അക്ഷരാർഥവും രൂപകാർഥവും ‘വഴികൾ’ ഉൾക്കൊള്ളുന്നു; εὐθείαςയുടെ നേരായതും ശരിയായതുമായ ഗുണം ‘നേരായ’ നിലനിർത്തുന്നു.
- source_word: Ὦ
  choice: …നിറഞ്ഞവനേ
  rationale: Ὦയുടെ ഊന്നലോടെയുള്ള സംബോധന മലയാളത്തിലെ ‘-നേ’ എന്ന സംബോധനരൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; കൃത്രിമമായ ഒരു പ്രത്യേക ഉദ്ഗാരം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: δικαιοσύνηയുടെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായം
  rationale: സന്ദർഭത്തിൽ ധാർമിക നേരും ശരിതനിമയും പ്രധാനമാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘നീതി’ ഉപയോഗിക്കുന്നു. സാമൂഹികമോ ന്യായവിധിസംബന്ധമായോ ഉള്ള ‘ന്യായം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും നേരിട്ടുള്ളതുമായ ശൈലി. ആവർത്തിച്ചുള്ള ‘സകലവിധ’ മൂലപാഠത്തിലെ രണ്ട് സമഗ്രതാസൂചകങ്ങളെയും നിലനിർത്തുന്നു; സംബോധനരൂപങ്ങൾ ശാസനയുടെ രൂക്ഷത സംരക്ഷിക്കുന്നു.
