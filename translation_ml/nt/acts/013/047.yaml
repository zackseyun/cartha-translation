id: ACT.13.47
reference: Acts 13:47
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: ml
  text: 'കാരണം, കർത്താവ് ഞങ്ങളോട് ഇങ്ങനെ കല്പിച്ചിരിക്കുന്നു: “ഞാൻ നിന്നെ ജനതകൾക്കു[a] വെളിച്ചമായി നിയോഗിച്ചിരിക്കുന്നു; നീ ഭൂമിയുടെ അറ്റംവരെ[b] രക്ഷയായിരിക്കേണ്ടതിന്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിജാതീയർക്കു വെളിച്ചമായി.” ഗ്രീക്കിലെ ἐθνῶν എന്ന പദത്തിന് “ജനതകൾ” എന്നും പല സന്ദർഭങ്ങളിലും “വിജാതീയർ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഭൂമിയുടെ അറ്റങ്ങളോളം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ഇങ്ങനെ
  rationale: തുടർന്നുവരുന്ന തിരുവെഴുത്തുദ്ധരണി അവരുടെ പ്രവർത്തനത്തിന് അടിസ്ഥാനമായ കല്പനയാണെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐντέταλται
  choice: കല്പിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന അധികാരബലം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ദൈവിക തിരുവെഴുത്തുവക്താവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പതിവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: Τέθεικά σε
  choice: ഞാൻ നിന്നെ ... നിയോഗിച്ചിരിക്കുന്നു
  rationale: τίθημι ഇവിടെ സ്ഥാനപ്പെടുത്തൽ/നിയോഗം സൂചിപ്പിക്കുന്നു; പൂർണ്ണകാലത്തിന്റെ സ്ഥാപിതവും തുടരുന്നതുമായ ഫലവും ഈ രൂപം വ്യക്തമാക്കുന്നു.
- source_word: εἰς φῶς ἐθνῶν
  choice: ജനതകൾക്കു വെളിച്ചമായി
  rationale: εἰς എന്നതിന്റെ നിയമനാർഥവും φῶς എന്ന രൂപകവും നിലനിർത്തുന്നു; ἐθνῶν എന്നതിന്റെ വിശാലമായ ‘ജനതകൾ’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
- source_word: τοῦ εἶναί σε
  choice: നീ ... ഇരിക്കേണ്ടതിന്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയ്ക്കായി
  rationale: രക്ഷയായിത്തീരുക, രക്ഷ കൊണ്ടുവരുക, രക്ഷയുടെ മാർഗമാകുക എന്നിവയിൽ ഒന്നിനെ മാത്രം വ്യാഖ്യാനിച്ച് ഉറപ്പിക്കാതെ ഗ്രീക്കിന്റെ സംക്ഷിപ്ത ലക്ഷ്യാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: ഭൂമിയുടെ അറ്റംവരെ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ἐσχάτου എന്നതിനെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു; ബഹുവചനപ്രയോഗം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: യെശയ്യാവിൽ നിന്നുള്ള ഏകവചന അഭിസംബോധന പൗലൊസിന്റെയും ബർന്നബാസിന്റെയും ദൗത്യത്തിന് പ്രയോഗിക്കുന്നത്
  choice: ഉദ്ധരണിയിലെ ‘നിന്നെ/നീ’ എന്ന ഏകവചനം അതേപടി നിലനിർത്തി.
  alternative: മുഖ്യപാഠത്തിൽ അത് അപ്പൊസ്തലന്മാരെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ബഹുവചനമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് തിരുവെഴുത്തുദ്ധരണിയുടെ ഏകവചനം നിലനിർത്തുകയും ദാസവചനവും അപ്പൊസ്തലിക ദൗത്യവും തമ്മിലുള്ള ബന്ധം വിവർത്തനത്തിലൂടെ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ഉദ്ധരണിയുടെ ഏകവചനവും ‘രക്ഷയ്ക്കായി’ എന്ന സംക്ഷിപ്തമായ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചിട്ടുണ്ട്; എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
