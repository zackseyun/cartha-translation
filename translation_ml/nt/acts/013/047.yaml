    rationale: Malayalam normally requires a predicative complement with “ആയിരിക്കുക” in this construction. “രക്ഷയായിരിക്കേണ്ടതിന്” is idiomatic and directly represents the quoted figure’s salvific appointment; it does not identify the precise manner in which that role is fulfilled.
