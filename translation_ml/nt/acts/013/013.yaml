  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: ml
  text: പാഫോസിൽനിന്ന് കപ്പലിൽ യാത്രതിരിച്ച്[a], പൗലോസും അദ്ദേഹത്തോടൊപ്പമുള്ളവരും[b] പംഫുല്യയിലെ പെർഗയിൽ എത്തി. എന്നാൽ യോഹന്നാൻ അവരിൽനിന്ന് പിരിഞ്ഞ് യെരൂശലേമിലേക്കു മടങ്ങിപ്പോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കടലിലേക്കു പുറപ്പെട്ട്.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘പൗലോസിനു ചുറ്റുമുള്ളവർ’; ‘പൗലോസിനോടൊപ്പമുള്ളവർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: കപ്പൽ പുറപ്പെട്ടശേഷം
  rationale: സമുദ്രയാത്രാസന്ദർഭത്തിൽ ἀνάγω എന്ന ക്രിയയ്ക്ക് ‘കപ്പൽ പുറപ്പെടുക’ അഥവാ ‘കടലിലേക്കു പുറപ്പെടുക’ എന്നാണ് അർഥം. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ അതിന്റെ സമുദ്രയാത്രാഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οἱ περὶ Παῦλον
  choice: പൗലോസും കൂടെയുള്ളവരും
  rationale: οἱ περὶ + ദ്വിതീയാവിഭക്തി ഒരു വ്യക്തിയെ ചുറ്റിപ്പറ്റിയുള്ള സംഘത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘പൗലോസും കൂടെയുള്ളവരും’ എന്നത് സ്വാഭാവികമായി സംഘത്തെ വ്യക്തമാക്കുന്നു; നേതൃത്വത്തെക്കുറിച്ച് മൂലപാഠത്തിലധികം ഒന്നും ചേർക്കുന്നില്ല.
- source_word: ἦλθον
  choice: എത്തി
  rationale: യാത്രാവിവരണത്തിൽ ലക്ഷ്യസ്ഥാനത്തെത്തിയതിനെ മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: Πέργην τῆς Παμφυλίας
  choice: പംഫുല്യയിലെ പെർഗയിൽ
  rationale: ഷഷ്ഠീവിഭക്തി പെർഗ സ്ഥിതിചെയ്യുന്ന പ്രദേശത്തെ തിരിച്ചറിയിക്കുന്നു; മലയാളത്തിൽ ‘പംഫുല്യയിലെ’ എന്നത് ആ സ്ഥലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: അവരിൽനിന്നു പിരിഞ്ഞ്
  rationale: സംഘത്തിൽനിന്നുള്ള വേർപാടിനെ സൂചിപ്പിക്കുന്നു; യോഹന്നാന്റെ ഉദ്ദേശ്യമോ പ്രവൃത്തിയുടെ ധാർമിക വിലയിരുത്തലോ ചേർക്കാതെ നിഷ്പക്ഷത പാലിക്കുന്നു.
- source_word: ὑπέστρεψεν
  choice: മടങ്ങിപ്പോയി
  rationale: ὑποστρέφω എന്നതിന്റെ ‘തിരികെ പോകുക’ എന്ന അർഥം യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἱεροσόλυμα
  choice: യെരൂശലേം
  rationale: നഗരനാമത്തിന്റെ മലയാളത്തിൽ സുപരിചിതമായ രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യോഹന്നാന്റെ വേർപാടിന്റെ സാധ്യതയുള്ള പ്രതികൂല സൂചന
  choice: ‘അവരിൽനിന്നു പിരിഞ്ഞ്’ എന്ന് നിഷ്പക്ഷമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘അവരെ ഉപേക്ഷിച്ച്’ അല്ലെങ്കിൽ ‘അവരിൽനിന്ന് പിൻവാങ്ങി’
  rationale: ഈ വാക്യം യോഹന്നാന്റെ ഉദ്ദേശ്യമോ ധാർമിക കുറ്റമോ വ്യക്തമാക്കുന്നില്ല. പിന്നീടുള്ള സന്ദർഭം ഈ സംഭവത്തെ വിലയിരുത്താൻ സഹായിക്കാമെങ്കിലും, ഇവിടെ മൂലപാഠത്തിലുള്ള സംയമനം വിവർത്തനം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. സ്ഥലനാമങ്ങൾക്ക് മലയാളത്തിൽ പ്രചാരമുള്ള രൂപങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കൃതന്തഘടന മലയാളത്തിലെ സ്വാഭാവികമായ കാലബന്ധവാക്യമായി മാറ്റിയെങ്കിലും സംഭവക്രമവും അർഥവും നിലനിർത്തി.
