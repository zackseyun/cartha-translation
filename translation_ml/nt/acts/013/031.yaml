id: ACT.13.31
reference: Acts 13:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: ml
  text: അവൻ അനേകം ദിവസങ്ങളോളം ഗലീലയിൽനിന്ന് യെരൂശലേമിലേക്ക് തന്നോടൊപ്പം കയറിവന്നവർക്ക് പ്രത്യക്ഷനായി[a]. അവരാണ് ഇപ്പോൾ ജനത്തോട്[b] അവന്റെ സാക്ഷികൾ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അനേകം ദിവസങ്ങളോളം കാണപ്പെട്ടു.” പുനരുത്ഥാനപ്രത്യക്ഷപ്പെടലുകളുടെ സന്ദർഭത്തിൽ ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ രൂപാനുസൃതമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ജനം” എന്നത് സന്ദർഭത്തിൽ പ്രത്യേകിച്ച് യഹൂദജനത്തെ, അഥവാ ഇസ്രായേൽജനത്തെ, സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: അവൻ
  rationale: മുൻവാക്യത്തിലെ യേശുവിനെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പുതിയ വാക്യം സ്വാഭാവികമായി ആരംഭിക്കാൻ ‘അവൻ’ എന്നു പുനരാരംഭിച്ചു.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷമുള്ള പ്രത്യക്ഷപ്പെടലുകളെ സൂചിപ്പിക്കുന്ന ഈ പാസീവ് രൂപത്തിന് സന്ദർഭോചിതവും സ്വാഭാവികവുമായ വിവർത്തനം. ‘കാണപ്പെട്ടു’ എന്ന കൂടുതൽ രൂപാനുസൃത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: അനേകം ദിവസങ്ങളോളം
  rationale: കാലദൈർഘ്യം വ്യക്തമാക്കുന്ന പ്രയോഗത്തിന്റെ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: തന്നോടൊപ്പം കയറിവന്നവർക്ക്
  rationale: συναναβαίνω എന്നതിലെ ഒരുമിച്ചുള്ള യാത്രയും യെരൂശലേമിലേക്കു ‘കയറുക’ എന്ന ദിശാസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: ഗലീലയിൽനിന്ന് യെരൂശലേമിലേക്ക്
  rationale: ആരംഭസ്ഥാനവും ലക്ഷ്യസ്ഥാനവും നേരിട്ട്, വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: οἵτινες νῦν εἰσὶν
  choice: അവരാണ് ഇപ്പോൾ
  rationale: ഈ പ്രത്യേക സംഘമാണ് ഇപ്പോഴത്തെ സാക്ഷികൾ എന്ന തിരിച്ചറിയൽ-ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μάρτυρες αὐτοῦ
  choice: അവന്റെ സാക്ഷികൾ
  rationale: അവർ അവനെ സംബന്ധിച്ചും അവനുവേണ്ടിയും സാക്ഷ്യം വഹിക്കുന്ന ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: πρὸς τὸν λαόν
  choice: ജനത്തോടുള്ള
  rationale: സാക്ഷ്യം ലക്ഷ്യമിടുന്ന ശ്രോതാക്കളെ സൂചിപ്പിക്കുന്ന πρός എന്നതിന്റെ ദിശാബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λαόν
  choice: ജനം
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ടെങ്കിലും ഗ്രീക്ക് പാഠത്തിലെ പൊതുവായ പദം മുഖ്യവാചകത്തിൽ വികസിപ്പിക്കാതെ നിലനിർത്തി.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷമുള്ള പ്രത്യക്ഷപ്പെടൽ ഭാഷയുടെ സ്വഭാവം
  choice: പ്രത്യക്ഷനായി
  alternative: കാണപ്പെട്ടു
  rationale: ‘പ്രത്യക്ഷനായി’ എന്നത് പുനരുത്ഥാനസന്ദർഭത്തിലെ ὤφθηയുടെ സ്വാഭാവിക അർത്ഥം നൽകുന്നു; അതേസമയം കർത്തൃരഹിത പാസീവ് രൂപത്തെ കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ‘ജനം’ എന്നതിന്റെ പരിധി
  choice: ജനം
  alternative: ഇസ്രായേൽജനം / യഹൂദജനം
  rationale: സന്ദർഭം ഇസ്രായേൽജനത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും പാഠം λαός എന്ന പൊതുപദമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ മുഖ്യവാചകം അനാവശ്യമായി വ്യക്തമാക്കാതെ, സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കയറിവന്നവർ’ എന്ന പ്രയോഗം യെരൂശലേമിലേക്കുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ‘കയറുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
