id: ACT.13.12
reference: Acts 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: ml
  text: അപ്പോൾ, നടന്നത്[a] കണ്ട പ്രോകോൺസൽ, കർത്താവിന്റെ ഉപദേശത്തിൽ[b] വിസ്മയിച്ച് വിശ്വസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സംഭവിച്ചത്’.
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവിന്റെ ഉപദേശം’ എന്നത് കർത്താവിൽനിന്നുള്ള ഉപദേശമെന്നോ കർത്താവിനെക്കുറിച്ചുള്ള ഉപദേശമെന്നോ മനസ്സിലാക്കാം. ഗ്രീക്ക് ജനിറ്റീവ് ഒന്നിലധികം അർഥസാധ്യതകൾ അനുവദിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ അടുത്ത സംഭവത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ കാലക്രമപദം.
- source_word: ἰδὼν
  choice: കണ്ട
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പിലോ അതോടൊപ്പമോ നടന്ന കാഴ്ചയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാല കൃന്തംകൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἀνθύπατος
  choice: പ്രോകോൺസൽ
  rationale: പൊതുവായ ‘ഭരണാധികാരി’ എന്നതിനു പകരം നിർദിഷ്ടമായ റോമൻ ഔദ്യോഗികപദവി നിലനിർത്തുന്നു.
- source_word: τὸ γεγονός
  choice: സംഭവിച്ചതെന്തെന്ന്
  rationale: γίνομαι എന്ന ക്രിയയുടെ substantival perfect participle സൂചിപ്പിക്കുന്ന, പൂർത്തിയായി നടന്ന സംഭവത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: ഗ്രീക്കിൽ വിശ്വാസത്തിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ സന്ദർഭം അതിന്റെ അർഥം സൂചിപ്പിക്കാൻ അനുവദിച്ചുകൊണ്ട് സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: ἐκπλησσόμενος
  choice: വിസ്മയിച്ച്
  rationale: പ്രധാനക്രിയയോടൊപ്പമുള്ള ശക്തമായ ആശ്ചര്യപ്രതികരണം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: ഉപദേശത്തിൽ
  rationale: വിസ്മയത്തിനുള്ള ആധാരമോ കാരണമോ ആയ ഉപദേശത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ‘കർത്താവിന്റേത്’, ‘കർത്താവിൽനിന്നുള്ളത്’, ‘കർത്താവിനെക്കുറിച്ചുള്ളത്’ എന്നീ സാധ്യതകളെ പൂർണമായി തീർപ്പാക്കാതെ സ്വാഭാവികമായ ജനിറ്റീവ് രൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: കർമം വ്യക്തമാക്കാത്ത πιστεύω എന്ന ക്രിയയുടെ അർഥം
  choice: ‘വിശ്വസിച്ചു’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവിൽ വിശ്വസിച്ചു’ അല്ലെങ്കിൽ ‘സന്ദേശം വിശ്വസിച്ചു’.
  rationale: സന്ദർഭം ക്രിസ്തീയ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം കർമം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഉറവിടത്തിന്റെ സംക്ഷിപ്തതയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: τοῦ κυρίου എന്ന ജനിറ്റീവിന്റെ സൂക്ഷ്മാർഥം
  choice: ‘കർത്താവിന്റെ ഉപദേശം’ എന്ന് നൽകി.
  alternative: ‘കർത്താവിൽനിന്നുള്ള ഉപദേശം’ അല്ലെങ്കിൽ ‘കർത്താവിനെക്കുറിച്ചുള്ള ഉപദേശം’.
  rationale: ജനിറ്റീവ് കർത്താവിൽനിന്നുള്ളതോ കർത്താവിനോടു ബന്ധപ്പെട്ടതോ കർത്താവിനെക്കുറിച്ചുള്ളതോ ആയി മനസ്സിലാക്കാം; മുഖ്യപാഠം ഈ സാധ്യതകളിലൊന്ന് നിർബന്ധിച്ച് തിരഞ്ഞെടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ചരിത്രപരമായ കൃത്യതയ്ക്കായി റോമൻ ഔദ്യോഗികപദവി ‘പ്രോകോൺസൽ’ എന്നു ലിപ്യന്തരിച്ചു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി, എന്നാൽ ഗ്രീക്ക് മൂലത്തിലെ കർമരഹിതമായ ‘വിശ്വസിച്ചു’ എന്ന പ്രയോഗവും ജനിറ്റീവിന്റെ അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
