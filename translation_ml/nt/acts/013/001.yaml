    issue: «ഉപദേഷ്ടാക്കന്മാർ» for διδάσκαλοι
    rationale: In current Malayalam, ഉപദേഷ്ടാവ് denotes an adviser or counsellor. διδάσκαλοι denotes teachers; «അധ്യാപകർ» gives the source sense without adding an advisory role.
  - severity: medium
    issue: «ചതുർഭരണാധികാരി» for τετράρχης
    rationale: This coined-looking expression is not natural standard terminology and can imply a ruler over four units. «തെത്രാർക്കായ» preserves the specific historical title without asserting an inaccurate etymological explanation.
