  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: ml
  text: 'അന്ത്യോക്യയിലെ സഭയിൽ പ്രവാചകന്മാരും അധ്യാപകരും ഉണ്ടായിരുന്നു: ബർന്നബാസ്, നീഗർ[a] എന്നു വിളിക്കപ്പെട്ട ശിമെയോൻ, കുറേനക്കാരനായ ലൂക്കിയോസ്[b], തെത്രാർക്കായ ഹെരോദാവിനോടൊപ്പം വളർന്ന മനായേൻ[c], ശൗൽ എന്നിവർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീഗർ” എന്ന ലാറ്റിൻ പേരിന്റെ അർഥം “കറുത്തവൻ” എന്നാണ്. ഇവിടെ അത് പരിഭാഷപ്പെടുത്താതെ വ്യക്തിനാമമായി നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, വടക്കേ ആഫ്രിക്കയിലെ കുറേനയിൽനിന്നുള്ള ലൂക്കിയോസ്.
    reason: cultural_note
  - marker: c
    text: അഥവാ “തെത്രാർക്കായ ഹെരോദാവിന്റെ വളർത്തുസഹോദരൻ” അല്ലെങ്കിൽ “ഹെരോദാവിനോടൊപ്പം ബാല്യത്തിൽ വളർന്നവൻ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ഉണ്ടായിരുന്നു
  rationale: Ἦσαν എന്ന അസ്തിത്വസൂചക ക്രിയയുടെ അർഥം സ്വാഭാവികമായി നൽകുന്നു. δέ മൃദുവായ വ്യവഹാരബന്ധകമായതിനാൽ സന്ദർഭത്തിൽ പ്രത്യേക വിരോധസൂചക പദം ചേർക്കാതെ വാക്യഘടനയിലൂടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: അന്ത്യോക്യയിലെ സഭയിൽ
  rationale: അന്ത്യോക്യയിൽ നിലവിലുണ്ടായിരുന്ന പ്രാദേശിക സഭയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ചുരുക്കവും സ്വാഭാവികവുമായ സ്ഥലസൂചക രൂപം.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: പ്രവാചകന്മാരും ഉപദേഷ്ടാക്കന്മാരും
  rationale: സഭയിലെ തിരിച്ചറിയപ്പെട്ട ശുശ്രൂഷാഭൂമികകളെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; പിന്നീടുണ്ടായ സഭാധികാരഘടനകൾ ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: നീഗർ എന്നു വിളിക്കപ്പെട്ട ശിമെയോൻ
  rationale: Συμεών എന്ന രൂപത്തെ ശിമെയോൻ എന്നു വേർതിരിച്ചു ലിപ്യന്തരണം ചെയ്യുന്നു; Νίγερ ഒരു പേരായി നിലനിർത്തി അതിന്റെ ലാറ്റിൻ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: കുറേനക്കാരനായ ലൂക്കിയോസ്
  rationale: കുറേന സ്വദേശിയെന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: ചതുർഭരണാധികാരിയായ ഹെരോദാവ്
  rationale: τετραάρχης എന്ന ചരിത്രപരമായ പദവി പൊതുവായ ‘രാജാവ്’ എന്നു മാറ്റാതെ പദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
- source_word: σύντροφος
  choice: ഒപ്പം വളർന്ന
  rationale: പങ്കിട്ട വളർച്ചയെയോ ബാല്യകാല അടുപ്പത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ കേന്ദ്രാർഥം നൽകുന്നു; ‘വളർത്തുസഹോദരൻ’ എന്ന കൂടുതൽ നിർദിഷ്ട സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: അന്ത്യോക്യയിലെ ശുശ്രൂഷാഭൂമികകളുടെ സ്വഭാവം
  choice: ‘പ്രവാചകന്മാരും ഉപദേഷ്ടാക്കന്മാരും’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പിന്നീടുള്ള സാങ്കേതിക അർഥത്തിലുള്ള ഔദ്യോഗിക സഭാപദവികളായി അവതരിപ്പിക്കുക.
  rationale: വാക്യം ഈ വ്യക്തികളെ പ്രാദേശിക സഭയിലെ പ്രവാചകന്മാരും ഉപദേഷ്ടാക്കന്മാരുമായി തിരിച്ചറിയുന്നു; എന്നാൽ പിന്നീടുള്ള ഒരു പ്രത്യേക സ്ഥാപനഘടന നിർവചിക്കുന്നില്ല.
- issue: മനയേനും ഹെരോദാവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ഹെരോദാവിനോടൊപ്പം വളർന്ന’ എന്ന് നൽകി.
  alternative: ‘ഹെരോദാവിന്റെ വളർത്തുസഹോദരൻ’ അല്ലെങ്കിൽ ‘അടുത്ത സുഹൃത്ത്’.
  rationale: σύντροφος പങ്കിട്ട വളർച്ചയെ ശക്തമായി സൂചിപ്പിക്കാമെങ്കിലും ബന്ധത്തിന്റെ കൃത്യമായ സാമൂഹിക രൂപം നിർബന്ധമായി നിശ്ചയിക്കുന്നില്ല. മുഖ്യപാഠത്തിൽ സാധ്യതയുള്ള കേന്ദ്രാർഥവും അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകളും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരിചിതമായ ബൈബിൾ പേരുകളുടെ മലയാളരൂപങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു. ‘ചതുർഭരണാധികാരി’ ചരിത്രപദവിയുടെ പ്രത്യേകത കാത്തുസൂക്ഷിക്കുന്നു; അപരിചിതത്വം വാക്യസന്ദർഭം ലഘൂകരിക്കുന്നു.
