revisions:
- from: 'അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിനെക്കുറിച്ച്—അവൻ ഇനി ഒരിക്കലും ജീർണതയിലേക്കു മടങ്ങുകയില്ല—ദൈവം ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു: “ദാവീദിനോടു വാഗ്ദാനം ചെയ്ത വിശുദ്ധവും ഉറപ്പുള്ളതുമായ അനുഗ്രഹങ്ങൾ ഞാൻ നിങ്ങൾക്കു നൽകും.”[a]'
  to: 'അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിനെക്കുറിച്ച്—അവൻ ഇനി ക്ഷയത്തിലേക്കു മടങ്ങേണ്ടതില്ല—ദൈവം ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു: “ദാവീദിന്റെ വിശുദ്ധവും ഉറപ്പുള്ളതുമായ അനുഗ്രഹങ്ങൾ[a] ഞാൻ നിങ്ങൾക്കു നൽകും.”'
  rationale: The revision removes the interpretive expansion ‘promised to David,’ avoids the extra intensifier ‘ever,’ uses a more natural term for physical decay, and moves the footnote marker to the precise difficult phrase. The note preserves the traditional rendering while explaining the Isaiah allusion and the phrase’s covenantal sense without imposing one syntactic resolution in the main text.
  reviewer_model: gpt-5.6-terra
