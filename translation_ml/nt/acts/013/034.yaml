id: ACT.13.34
reference: Acts 13:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: ml
  text: 'അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചതിനെക്കുറിച്ച്—അവൻ ഇനി ക്ഷയത്തിലേക്കു മടങ്ങേണ്ടതില്ല—ദൈവം ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു: “ദാവീദിന്റെ വിശുദ്ധവും ഉറപ്പുള്ളതുമായ അനുഗ്രഹങ്ങൾ[a] ഞാൻ നിങ്ങൾക്കു നൽകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “ദാവീദിന്റെ ഉറപ്പുള്ള കൃപകൾ.” ഈ ഗ്രീക്ക് പ്രയോഗം യെശയ്യാവ് 55:3-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; ദാവീദുമായി ബന്ധപ്പെട്ട വിശുദ്ധവും വിശ്വസനീയവുമായ ഉടമ്പടി വാഗ്ദാനങ്ങളെയോ അനുഗ്രഹങ്ങളെയോ സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു
  rationale: ἐκ νεκρῶν എന്ന പുനരുത്ഥാനപ്രയോഗവും ദൈവത്തിന്റെ പ്രവർത്തനവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν
  choice: അവൻ ഇനി ഒരിക്കലും ജീർണതയിലേക്കു മടങ്ങുകയില്ല
  rationale: μηκέτιയും ഭാവിസൂചനയുള്ള μέλλοντα ὑποστρέφειν എന്ന ഘടനയും ചേർന്നുള്ള അന്തിമത്വം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; διαφθορά ഇവിടെ ശാരീരിക ജീർണതയാണ്.
- source_word: οὕτως εἴρηκεν
  choice: ദൈവം ഇങ്ങനെ അരുളിച്ചെയ്തിരിക്കുന്നു
  rationale: ഉദ്ധരണി പറയുന്നത് ദൈവമാണെന്ന് സന്ദർഭത്തിൽ വ്യക്തമാണ്; perfect രൂപത്തിന്റെ നിലനിൽക്കുന്ന തിരുവെഴുത്തധികാരം ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ സൂചിപ്പിക്കുന്നു.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: ദാവീദിനോടു വാഗ്ദാനം ചെയ്ത വിശുദ്ധവും ഉറപ്പുള്ളതുമായ അനുഗ്രഹങ്ങൾ
  rationale: യെശയ്യാവ് 55:3-ലെ ദാവീദുമായി ബന്ധപ്പെട്ട വിശുദ്ധവും വിശ്വസനീയവുമായ ഉടമ്പടി ആനുകൂല്യങ്ങളെ സൂചിപ്പിക്കുന്ന ദുഷ്കരമായ സംക്ഷിപ്തപ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὰ ὅσια Δαυὶδ τὰ πιστά എന്ന യെശയ്യാവ് 55:3 ഉദ്ധരണിയുടെ അർത്ഥം
  choice: ദാവീദിനോടു വാഗ്ദാനം ചെയ്ത വിശുദ്ധവും ഉറപ്പുള്ളതുമായ അനുഗ്രഹങ്ങൾ
  alternative: ദാവീദിന്റെ ഉറപ്പുള്ള വിശുദ്ധ കൃപകൾ
  rationale: ഈ വാക്യത്തിൽ പൗലോസ് യേശുവിന്റെ പുനരുത്ഥാനത്തെ നിലനിൽക്കുന്ന ദാവീദിക വാഗ്ദാനങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു. ‘വാഗ്ദാനം ചെയ്ത’ എന്നത് ഗ്രീക്കിലെ സംക്ഷിപ്തബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും പ്രത്യേകമായ ഒരു സമുദായവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല; പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീർണത’ ശാരീരിക ക്ഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘അരുളിച്ചെയ്തിരിക്കുന്നു’ തിരുവെഴുത്തിലെ ദൈവവചനത്തിന് യോജിച്ച ഔന്നത്യം നൽകുന്നു.
