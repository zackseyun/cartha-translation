  naturalness: The revised wording is natural, concise modern standard Malayalam and preserves the participle-to-main-verb sequence without unnecessary expansion.
  terminology: ‘കുടഞ്ഞുകളയുക’ appropriately conveys ἐκτινάσσω in this context. ‘ഇക്കോന്യ’ is an established Malayalam form of Ἰκόνιον. The cultural note appropriately explains the gesture without importing its explanation into the verse itself.
