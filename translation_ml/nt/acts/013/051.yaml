id: ACT.13.51
reference: Acts 13:51
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: ml
  text: എന്നാൽ അവർ തങ്ങളുടെ കാലുകളിൽനിന്നുള്ള പൊടി അവർക്കെതിരായി കുടഞ്ഞുകളഞ്ഞിട്ട് ഇക്കോന്യയിലേക്കു പോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കാലുകളിൽനിന്നുള്ള പൊടി കുടഞ്ഞുകളയുന്നത്, സന്ദേശം നിരസിച്ചവരിൽനിന്ന് തങ്ങൾ വേർപെടുന്നതും അവർക്കെതിരായ സാക്ഷ്യവും സൂചിപ്പിക്കുന്ന ഒരു പ്രതീകാത്മക പ്രവൃത്തിയായിരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: എന്നാൽ അവർ
  rationale: δέ ഇവിടെ നേരിയ വൈരുധ്യത്തോടുകൂടിയ ആഖ്യാനമാറ്റം സൂചിപ്പിക്കുന്നു; substantival participle-നോടു ചേർന്ന article മുൻപു പറഞ്ഞ പൗലോസിനെയും ബർന്നബാസിനെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘അവർ’ സ്വാഭാവികമാണ്.
- source_word: ἐκτιναξάμενοι
  choice: കുടഞ്ഞുകളഞ്ഞിട്ട്
  rationale: ἐκτινάσσω ബലമായി കുടഞ്ഞുനീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. Aorist participle പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിച്ചു.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: തങ്ങളുടെ കാലുകളിലെ പൊടി
  rationale: κονιορτός നിലത്തുനിന്നുള്ള അയഞ്ഞ പൊടിയാണ്; genitive ബന്ധം മലയാളത്തിൽ ‘കാലുകളിലെ പൊടി’ എന്നു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐπ’ αὐτοὺς
  choice: അവർക്കെതിരായി
  rationale: ἐπί + accusative ഇവിടെ ഈ പ്രതീകാത്മക പ്രവൃത്തിയുടെ വിരോധാത്മകമോ സാക്ഷ്യാത്മകമോ ആയ ദിശ സൂചിപ്പിക്കുന്നു. ‘അവർക്കെതിരായി’ വ്യാഖ്യാനം വികസിപ്പിക്കാതെ അതു നിലനിർത്തുന്നു.
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: ഇക്കോന്യയിലേക്കു പോയി
  rationale: നാമകരണം ചെയ്ത ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള ആഖ്യാനചലനത്തിൽ ἦλθον ‘പോയി’ എന്നു സ്വാഭാവികമായി വരുന്നു; εἰς ലക്ഷ്യദിശ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: കാലുകളിൽനിന്നുള്ള പൊടി കുടഞ്ഞുകളയുന്ന പ്രതീകാത്മക പ്രവൃത്തി
  choice: പ്രധാനവാക്യത്തിൽ പ്രവൃത്തിയും ‘അവർക്കെതിരായി’ എന്ന ദിശയും മാത്രം നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘അവർക്കെതിരായ സാക്ഷ്യമായി’ അല്ലെങ്കിൽ ‘ന്യായവിധിയുടെ അടയാളമായി’ എന്നു വികസിപ്പിക്കുക.
  rationale: പ്രവൃത്തിക്ക് ബൈബിൾ-സാംസ്കാരിക പ്രാധാന്യമുണ്ടെങ്കിലും ഗ്രീക്ക് വാക്യം അതിന്റെ അർത്ഥം വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. മൂലപാഠത്തിലെ participial ക്രമവും ‘ἐπ’ αὐτοὺς’ എന്നതിന്റെ തുറന്ന അർത്ഥവ്യാപ്തിയും കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തി.
