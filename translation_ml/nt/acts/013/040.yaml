  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: ml
  text: 'അതുകൊണ്ട്, പ്രവാചകഗ്രന്ഥങ്ങളിൽ[a] പറഞ്ഞിരിക്കുന്നതു നിങ്ങളിന്മേൽ വരാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവാചകന്മാരാൽ.’ ഗ്രീക്കിൽ ‘പ്രവാചകന്മാരിൽ’ എന്നാണ്; ഈ മുന്നറിയിപ്പ് കാണപ്പെടുന്ന പ്രവാചകഗ്രന്ഥങ്ങളെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: രണ്ടാം പുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞാരൂപം ശക്തമായ മുന്നറിയിപ്പായി പ്രവർത്തിക്കുന്നു. സാധാരണ ആധുനിക മലയാളത്തിൽ ഈ ജാഗ്രതാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള പ്രഖ്യാപനത്തിൽനിന്നും മുന്നറിയിപ്പിൽനിന്നും ഉരുത്തിരിയുന്ന നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μὴ ἐπέλθῃ
  choice: നിങ്ങളുടെമേൽ വന്നുഭവിക്കാതിരിക്കട്ടെ
  rationale: ആജ്ഞാരൂപത്തിനു പിന്നാലെയുള്ള μή + aorist subjunctive ഭയാശങ്കയോടുകൂടിയ മുന്നറിയിപ്പാണ്. ‘നിങ്ങളുടെമേൽ വന്നുഭവിക്കുക’ എന്നത് വരാനിരിക്കുന്ന ന്യായവിധിയുടെ ഭാവവും ἐπέρχομαι എന്ന ക്രിയയുടെ ദിശാഭാവവും നിലനിർത്തുന്നു.
- source_word: τὸ εἰρημένον
  choice: പറഞ്ഞിരിക്കുന്നത്
  rationale: ലേഖത്തോടുകൂടിയ നപുംസകലിംഗ ഏകവചന perfect passive participle ഒരു വസ്തുനാമമായി പ്രവർത്തിക്കുന്നു. ‘പറഞ്ഞിരിക്കുന്നത്’ എന്ന രൂപം പറഞ്ഞ കാര്യം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന perfect-ന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς προφήταις
  choice: പ്രവാചകന്മാരിൽ
  rationale: ἐν എന്ന പൂർവപ്രത്യയം നേരിട്ട് നിലനിർത്തുകയും മുന്നറിയിപ്പ് കാണപ്പെടുന്ന പ്രവാചകഗ്രന്ഥസമുച്ചയത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; കർത്തൃത്വം മാത്രം സൂചിപ്പിക്കുന്ന ‘പ്രവാചകന്മാരാൽ’ എന്ന് മുഖ്യപാഠത്തിൽ മാറ്റുന്നില്ല.
theological_decisions:
- issue: ‘പ്രവാചകന്മാർ’ എന്നതിന്റെ സൂചന
  choice: പ്രവാചകഗ്രന്ഥങ്ങൾ അഥവാ തിരുവെഴുത്തിലെ പ്രവാചകവിഭാഗം എന്ന സൂചന നിലനിർത്തുന്നു
  alternative: പ്രധാനമായും വാക്കുകൾ പറഞ്ഞ മനുഷ്യപ്രവാചകന്മാർ
  rationale: തുടർന്ന് ഹബക്കൂക്കിൽനിന്നുള്ള ഉദ്ധരണി വരുന്നതിനാൽ, പ്രവാചകതിരുവെഴുത്തുകളിൽ എഴുതപ്പെട്ടിരിക്കുന്നതിലേക്കാണ് സന്ദർഭം വിരൽചൂണ്ടുന്നത്. എന്നാൽ ഗ്രീക്കിലെ പ്രയോഗത്തിന്റെ സ്വാഭാവിക വ്യാപ്തി ചുരുക്കാതിരിക്കാൻ പദാനുപദ രൂപം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മുന്നറിയിപ്പിന്റെ അടിയന്തരതയ്ക്കായി ‘സൂക്ഷിച്ചുകൊള്ളുക’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക വ്യക്തതയ്ക്കായി നേരിയ തോതിൽ പുനഃക്രമീകരിച്ചു. അടിക്കുറിപ്പ് ബന്ധപ്പെട്ട ‘പ്രവാചകന്മാരിൽ’ എന്ന പദത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
