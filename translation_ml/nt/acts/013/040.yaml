- from: 'അതുകൊണ്ട് സൂക്ഷിച്ചുകൊള്ളുക: പ്രവാചകന്മാരിൽ[a] പറഞ്ഞിരിക്കുന്നത് നിങ്ങളുടെമേൽ വന്നുഭവിക്കാതിരിക്കട്ടെ:'
  to: 'അതുകൊണ്ട്, പ്രവാചകഗ്രന്ഥങ്ങളിൽ[a] പറഞ്ഞിരിക്കുന്നതു നിങ്ങളിന്മേൽ വരാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക:'
  rationale: 'The revision restores the Greek warning syntax by making the addressees’ caution explicit: they are to take care that the foretold warning does not come upon them. It also renders ἐν τοῖς προφήταις idiomatically as the prophetic writings, as indicated by the immediate quotation from Habakkuk, while the footnote preserves the lexical alternative “by the prophets.”'
  reviewer_model: gpt-5.6-terra
