id: ACT.13.46
reference: Acts 13:46
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: ml
  text: 'അപ്പോൾ പൗലോസും ബർന്നബാസും ധൈര്യത്തോടെ പറഞ്ഞു: “ദൈവവചനം ആദ്യം നിങ്ങളോടു പറയപ്പെടേണ്ടത് ആവശ്യമായിരുന്നു. നിങ്ങൾ അതിനെ തള്ളിക്കളയുകയും നിത്യജീവന് അയോഗ്യരെന്നു നിങ്ങളെത്തന്നെ വിധിക്കുകയും ചെയ്യുന്നതിനാൽ, ഇതാ, ഞങ്ങൾ യഹൂദേതരരിലേക്കു[a] തിരിയുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജാതികളിലേക്കു.” ഇവിടെ സിനഗോഗിലെ യഹൂദശ്രോതാക്കൾക്കു വിപരീതമായി യഹൂദരല്ലാത്തവരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: ധൈര്യത്തോടെ പറഞ്ഞു
  rationale: ഈ കൃ participle ഭയമില്ലാത്തതും തുറന്നതുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്നു. പ്രധാന ക്രിയയായ εἶπαν-നോടു ചേർത്ത് സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാവിശേഷണരീതിയിൽ അവതരിപ്പിച്ചു.
- source_word: τέ
  choice: അപ്പോൾ
  rationale: ആഖ്യാനത്തിലെ ബന്ധവും തുടർച്ചയും ലഘുവായി സൂചിപ്പിക്കുന്ന കണികയാണ്; സന്ദർഭബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘അപ്പോൾ’ ഉപയോഗിച്ചു.
- source_word: Ὑμῖν
  choice: നിങ്ങളോടു
  rationale: സന്ദേശം ആദ്യം അഭിസംബോധന ചെയ്യപ്പെട്ട ശ്രോതാക്കളെ ദത്തിവ് രൂപം സൂചിപ്പിക്കുന്നു; ‘പറയപ്പെടുക’ എന്നതിനൊപ്പം ‘നിങ്ങളോടു’ സ്വാഭാവികമാണ്.
- source_word: ἀναγκαῖον
  choice: ആവശ്യമായിരുന്നു
  rationale: നിർബന്ധിതമായ ആവശ്യകതയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: സന്ദേശപ്രഖ്യാപനത്തിലെ ക്രമപരമായ മുൻഗണന സംരക്ഷിക്കുന്നു.
- source_word: λαληθῆναι
  choice: പറയപ്പെടേണ്ടത്
  rationale: λαλέω എന്ന ക്രിയയുടെ aorist passive infinitive രൂപവും ἀναγκαῖον നൽകുന്ന ആവശ്യകതയും മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിൽനിന്നുള്ള സന്ദേശം എന്ന പുതിയനിയമത്തിലെ പതിവുപ്രയോഗത്തെ സംക്ഷിപ്തവും പരിചിതവുമായി നൽകുന്നു.
- source_word: ἐπειδὴ
  choice: ചെയ്യുന്നതിനാൽ
  rationale: യഹൂദേതരരിലേക്കു തിരിയാനുള്ള കാരണം അവതരിപ്പിക്കുന്ന causal ബന്ധം മലയാളത്തിലെ വാക്യാന്ത കാരണഘടനയിലൂടെ വ്യക്തമാക്കി.
- source_word: ἀπωθεῖσθε
  choice: തള്ളിക്കളയുകയും
  rationale: സന്ദേശത്തെ ബോധപൂർവം നിരസിക്കുന്ന ഇപ്പോഴത്തെ പ്രവർത്തനം ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτὸν
  choice: അതിനെ
  rationale: പുരുഷലിംഗ ഏകവചനമായ സർവനാമം λόγον എന്ന മുൻപദത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവവചനം’ തിരിച്ചുപറയാൻ ‘അതിനെ’ സ്വാഭാവികമാണ്.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: അയോഗ്യരെന്നു നിങ്ങളെത്തന്നെ വിധിക്കുകയും
  rationale: κρίνω എന്നതിലെ വിധിനിർണയഭാവവും ἑαυτούς എന്നതിലെ ആത്മവാചകശക്തിയും സംരക്ഷിക്കുന്നു; അവരെ അയോഗ്യരെന്നു പൗലോസ് വിധിക്കുന്നു എന്ന അർഥം വരുത്തുന്നില്ല.
- source_word: τῆς αἰωνίου ζωῆς
  choice: നിത്യജീവന്
  rationale: ἀξίους-നോടു ബന്ധപ്പെട്ട genitive മലയാളത്തിൽ ‘നിത്യജീവന് അയോഗ്യർ’ എന്ന സ്വാഭാവിക ഘടനയിൽ നൽകി.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് സൂചനാപദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τὰ ἔθνη
  choice: യഹൂദേതരർ
  rationale: സിനഗോഗിലെ യഹൂദശ്രോതാക്കളോടുള്ള തൽക്ഷണ വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘ജാതികൾ’ എന്ന കൂടുതൽ പദാനുപദമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: രക്ഷാചരിത്രപരമായ സന്ദർഭത്തിൽ τὰ ἔθνη എന്നതിന്റെ അർഥം
  choice: യഹൂദേതരർ
  alternative: ജാതികൾ
  rationale: ഇവിടെ ‘നിങ്ങൾ’ എന്നു വിളിക്കപ്പെടുന്ന സിനഗോഗ് ശ്രോതാക്കളും യഹൂദരല്ലാത്തവരും തമ്മിലുള്ള വൈരുധ്യമാണ് മുഖ്യം. ഭൂമിശാസ്ത്രപരമായ രാജ്യങ്ങൾ മാത്രമെന്ന ധാരണ ഒഴിവാക്കിക്കൊണ്ട് വംശീയ-രക്ഷാചരിത്രപരമായ അർഥം സംരക്ഷിച്ചു.
- issue: οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς എന്നതിന്റെ ശക്തി
  choice: അവരുടെ നിരസനംവഴി അവർ നിത്യജീവന് അയോഗ്യരെന്നു തങ്ങളെത്തന്നെ വിധിക്കുന്നു
  alternative: പൗലോസ് അവരെ വസ്തുനിഷ്ഠമായി നിത്യജീവന് അയോഗ്യരെന്നു വിധിക്കുന്നു
  rationale: κρίνετε ἑαυτούς വിധിക്കുന്ന പ്രവർത്തനം ശ്രോതാക്കളിൽ തന്നെയാണെന്ന് വ്യക്തമായി പറയുന്നു. അതിനാൽ ആത്മവാചകശക്തി സംരക്ഷിക്കുകയും വാക്യത്തിനപ്പുറമുള്ള സിദ്ധാന്തനിഗമനം ചേർക്കാതിരിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ദൈവവചനം,’ ‘നിത്യജീവൻ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, τὰ ἔθνη എന്നതിന്റെ സന്ദർഭാർഥം സാധാരണ വായനക്കാരന് ഉടൻ വ്യക്തമാകാൻ ‘യഹൂദേതരർ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കാരണബന്ധം, ആത്മവാചക വിധിനിർണയം, ἰδοὺ എന്ന ഊന്നൽ എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
