  source_fidelity: 'ഗ്രീക്കിലെ മുഖ്യഘടകങ്ങൾ കൃത്യമായി പ്രതിഫലിക്കുന്നു: പൗലോസും ബർന്നബാസും ധൈര്യത്തോടെ സംസാരിച്ചത്, ദൈവവചനം ആദ്യം ഈ ശ്രോതാക്കളോടു പറയപ്പെടേണ്ടിയിരുന്നത്, അതിനെ നിരസിക്കുന്നതും നിത്യജീവന് അയോഗ്യരെന്നു തങ്ങളെത്തന്നെ വിധിക്കുന്നതും, അതിന്റെ ഫലമായി യഹൂദേതരരിലേക്കു തിരിയുന്നതും. ἰδού-യുടെ ഊന്നൽ ‘ഇതാ’ എന്നതിലൂടെ നിലനിൽക്കുന്നു.'
