reference: Acts 23:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: ml
  text: 'പൗലോസ് പറഞ്ഞു: “സഹോദരന്മാരേ, അദ്ദേഹം മഹാപുരോഹിതനാണെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു. എന്തെന്നാൽ, ‘നിന്റെ ജനത്തിന്റെ ഒരു ഭരണാധികാരിയെക്കുറിച്ച് ദോഷമായി സംസാരിക്കരുത്’[a] എന്ന് എഴുതിയിരിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ ജനത്തിന്റെ ഒരു ഭരണാധികാരിയെ അധിക്ഷേപിക്കരുത്.”
    reason: κακῶς λέγειν എന്ന പ്രയോഗത്തിന് ദോഷകരമായി സംസാരിക്കുക എന്ന വിശാല അർഥമുണ്ട്; “അധിക്ഷേപിക്കുക” കൂടുതൽ ശക്തമായ ഒരു സാധ്യമായ വിവർത്തനമാണ്.
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: അപ്പോൾ പൗലോസ് പറഞ്ഞു
  rationale: τέ ഇവിടെ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ സ്വാഭാവികമായ സംഭവതുടർച്ച ‘അപ്പോൾ’ വ്യക്തമാക്കുന്നു, ἔφη നേരിട്ടുള്ള വാക്കുകളെ പരിചയപ്പെടുത്തുന്നു.
- source_word: Οὐκ ᾔδειν
  choice: എനിക്ക് അറിയില്ലായിരുന്നു
  rationale: οἶδα എന്ന ക്രിയയുടെ ഈ ഭൂതകാലരൂപം അറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളപ്രയോഗമാണിത്.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധന സംരക്ഷിക്കുന്നു; ഇവിടെ പൗലോസ് ന്യായാധിപസഭയിലെ പുരുഷന്മാരോടാണ് സംസാരിക്കുന്നത്.
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: അദ്ദേഹം മഹാപുരോഹിതനാണെന്ന്
  rationale: ἐστίν എന്ന വർത്തമാനകാലം ‘ആണ്’ എന്നു നിലനിർത്തുന്നു; ἀρχιερεύς ഔദ്യോഗിക പദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മഹാപുരോഹിതൻ’ ഉപയോഗിച്ചു.
- source_word: γέγραπται γὰρ
  choice: എന്തെന്നാൽ ... എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സ്ഥിരപ്രയോഗത്തിന്റെ പൂർത്തിയായും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ഭാവം ‘എഴുതിയിരിക്കുന്നുവല്ലോ’ നൽകുന്നു; γάρ മുൻവാക്യത്തിനുള്ള കാരണം സൂചിപ്പിക്കുന്നു.
- source_word: Ἄρχοντα
  choice: ഒരു ഭരണാധികാരിയെ
  rationale: അനാർത്രസ് ἄρχων ഇവിടെ പൊതുവായ അർഥത്തിലാണ്; അധികാരസ്ഥാനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക പദം ‘ഭരണാധികാരി’ ആണ്.
- source_word: τοῦ λαοῦ σου
  choice: നിന്റെ ജനത്തിന്റെ
  rationale: λαός എന്നത് ഉടമ്പടി-സമൂഹപരമായ ‘ജനം’ എന്ന അർഥത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: οὐκ ἐρεῖς κακῶς
  choice: ദൂഷണം പറയരുത്
  rationale: ഭാവികാല നിർദേശരൂപം മലയാളത്തിൽ നിരോധനാജ്ഞയായി സ്വാഭാവികമായി നൽകി; κακῶς പറയുക എന്നത് അപകീർത്തികരമായോ നിന്ദാപരമായോ സംസാരിക്കുന്ന വിശാല അർഥം വഹിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന സംബോധന ഉൾക്കൊള്ളുന്ന ലിംഗഭാഷയിൽ നൽകണമോ
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് രൂപം പുരുഷലിംഗ ബഹുവചനമാണ്; ഈ സന്ദർഭത്തിൽ പൗലോസ് പുരുഷന്മാർ അടങ്ങിയ ന്യായാധിപസഭയെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ മൂലപാഠത്തിനും സന്ദർഭത്തിനും യോജിച്ച രൂപം നിലനിർത്തി.
- issue: ὅτι ἐστὶν ἀρχιερεύς എന്നതിലെ വർത്തമാനകാലം
  choice: അദ്ദേഹം മഹാപുരോഹിതനാണെന്ന്
  alternative: അദ്ദേഹം മഹാപുരോഹിതനായിരുന്നുവെന്ന്
  rationale: മൂലപാഠത്തിലെ ἐστίν വർത്തമാനകാലമാണ്. പൗലോസിന്റെ മുൻകാല അറിവില്ലായ്മയും ആ വ്യക്തിയുടെ അന്നത്തെ പദവിയും തമ്മിലുള്ള ഉദ്ദേശപൂർവമായ കാലഭേദം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയിലെ κακῶς എന്നതിന്റെ വ്യാപ്തി
  choice: ദൂഷണം പറയരുത്
  alternative: അധിക്ഷേപിക്കരുത്
  rationale: ‘ദൂഷണം പറയുക’ ദോഷകരമായി സംസാരിക്കൽ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ‘അധിക്ഷേപിക്കുക’ കൂടുതൽ ശക്തവും ഇടുങ്ങിയതുമായ അർഥത്തിലേക്ക് വായനയെ നയിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘മഹാപുരോഹിതൻ’, ‘ഭരണാധികാരി’ എന്നീ സ്ഥിരവും വ്യക്തവുമായ പദങ്ങൾ ഉപയോഗിച്ചു; മൂലത്തിലെ വർത്തമാനകാലവും തിരുവെഴുത്ത്-ഉദ്ധരണിയുടെ ഔദ്യോഗിക ഭാവവും സംരക്ഷിച്ചു.
