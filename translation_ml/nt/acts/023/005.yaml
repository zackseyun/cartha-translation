revisions:
- from: 'അപ്പോൾ പൗലോസ് പറഞ്ഞു: “സഹോദരന്മാരേ, അദ്ദേഹം മഹാപുരോഹിതനാണെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു. എന്തെന്നാൽ, ‘നിന്റെ ജനത്തിന്റെ ഒരു ഭരണാധികാരിയെക്കുറിച്ച് ദൂഷണം പറയരുത്’[a] എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ.”'
  to: 'പൗലോസ് പറഞ്ഞു: “സഹോദരന്മാരേ, അദ്ദേഹം മഹാപുരോഹിതനാണെന്ന് എനിക്ക് അറിയില്ലായിരുന്നു. എന്തെന്നാൽ, ‘നിന്റെ ജനത്തിന്റെ ഒരു ഭരണാധികാരിയെക്കുറിച്ച് ദോഷമായി സംസാരിക്കരുത്’[a] എന്ന് എഴുതിയിരിക്കുന്നു.”'
  rationale: The revision removes an unnecessarily specific rendering of the mild connective τέ, makes the scriptural citation formula more direct, and renders κακῶς λέγειν with a broad, natural Malayalam expression. It retains the Greek present tense in «മഹാപുരോഹിതനാണെന്ന്», the male address, and the generic sense of «ഒരു ഭരണാധികാരി».
