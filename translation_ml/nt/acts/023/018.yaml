id: ACT.23.18
reference: Acts 23:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: ml
  text: 'അങ്ങനെ അവൻ ആ യുവാവിനെ കൂട്ടിക്കൊണ്ടു സൈനികമേധാവിയുടെ അടുക്കൽ കൊണ്ടുചെന്നു പറഞ്ഞു: “തടവുകാരനായ പൗലോസ് എന്നെ തന്റെ അടുക്കലേക്കു വിളിച്ച്, അങ്ങയോടു പറയാൻ അവന് എന്തോ ഉള്ളതിനാൽ ഈ യുവാവിനെ അങ്ങയുടെ അടുക്കൽ കൊണ്ടുവരണമെന്ന് എന്നോട് അഭ്യർഥിച്ചു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: ആ യുവാവിനെ കൂട്ടിക്കൊണ്ടു
  rationale: παραλαμβάνω ഇവിടെ യുവാവിനെ കൂടെക്കൂട്ടി ഉദ്യോഗസ്ഥന്റെ അടുക്കലേക്കു കൊണ്ടുപോകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കൂട്ടിക്കൊണ്ടു’ സ്വാഭാവികമായി ഈ അനുഗമനവും നീക്കവും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: സൈനികമേധാവിയുടെ അടുക്കൽ ചെന്നു
  rationale: ἄγω എന്നതിന്റെ കൊണ്ടുപോകുക/നയിക്കുക എന്ന ആശയം മുൻപത്തെ ‘കൂട്ടിക്കൊണ്ടു’ എന്നതിൽ ഉൾപ്പെടുന്നതിനാൽ, ആവർത്തനം ഒഴിവാക്കി ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള വരവ് ‘അടുക്കൽ ചെന്നു’ എന്നു സ്വാഭാവികമായി നൽകി.
- source_word: χιλίαρχον
  choice: സൈനികമേധാവി
  rationale: χιλίαρχος റോമൻ സൈന്യത്തിലെ ഒരു ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ‘സൈനികമേധാവി’ ചരിത്രപരമായ പദവിയെ അതിരുകടന്ന് നിർവചിക്കാതെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ അർത്ഥം നൽകുന്നു.
- source_word: φησίν
  choice: പറഞ്ഞു
  rationale: ഗ്രീക്കിൽ ചരിത്രവർത്തമാനകാലമാണെങ്കിലും മലയാള കഥാഖ്യാനത്തിൽ ഭൂതകാലമായ ‘പറഞ്ഞു’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: Ὁ δέσμιος Παῦλος
  choice: തടവുകാരനായ പൗലോസ്
  rationale: δέσμιος ബന്ധനത്തിലോ കാവലിലോ ഉള്ള വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ ‘തടവുകാരനായ’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: προσκαλεσάμενός με
  choice: എന്നെ അടുത്തേക്കു വിളിച്ച്
  rationale: മധ്യപ്രയോഗം പൗലോസ് ആളെ തന്റെ അടുക്കലേക്കു വിളിച്ചതാണെന്ന് സൂചിപ്പിക്കുന്നു; ദിശാസൂചന മലയാളത്തിൽ വ്യക്തമാക്കി.
- source_word: ἠρώτησεν
  choice: എന്നോട് ആവശ്യപ്പെട്ടു
  rationale: ἐρωτάω ഇവിടെ ചോദ്യം ചോദിക്കുക എന്നതല്ല, ഒരു അഭ്യർഥന നടത്തുക എന്നതാണ്. ‘ആവശ്യപ്പെട്ടു’ ആ വിനീത അഭ്യർഥനയുടെ ആശയം നൽകുന്നു.
- source_word: νεανίαν
  choice: യുവാവ്
  rationale: νεανίας യുവാവായ പുരുഷനെ സൂചിപ്പിക്കുന്നു; ‘യുവാവ്’ ആധുനികവും മാന്യവും കൃത്യവുമായ മലയാളമാണ്.
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: അങ്ങയോടു പറയാൻ എന്തോ ഉള്ള
  rationale: ഈ പങ്കാളിപ്രയോഗം യുവാവിനെ വിശേഷിപ്പിക്കുന്നു. കാരണബന്ധം പ്രത്യേകം ചേർക്കാതെ ഗ്രീക്ക് ഘടനയിലെ സ്വാഭാവികമായ അനിശ്ചിതത്വവും ‘τι’യുടെ ‘എന്തോ’ എന്ന അർത്ഥവും നിലനിർത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ കഥാഖ്യാനശൈലി. ഉന്നത സൈനിക ഉദ്യോഗസ്ഥനോടുള്ള അഭിസംബോധനയിൽ ‘അങ്ങ്’ പ്രയോഗിച്ചു. ഈ വാക്യത്തിന് പ്രസിദ്ധീകരണത്തിന് അനിവാര്യമായ പാഠഭേദമോ ദൈവശാസ്ത്രപരമായ വിശദീകരണക്കുറിപ്പോ ഇല്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
