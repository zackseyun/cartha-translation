translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. റോമൻ പദവിക്ക് അപരിചിതമായ സാങ്കേതികപദത്തിനു പകരം ‘സൈനികമേധാവി’ ഉപയോഗിച്ചു; യഹൂദ സഭയുടെ ന്യായപരമായ സ്വഭാവം വ്യക്തമാക്കാൻ ‘ന്യായാധിപസഭ’ തിരഞ്ഞെടുത്തു. വാക്യത്തിന്റെ നീളം കുറയ്ക്കാനും ഗൂഢാലോചനയിലെ വ്യാജ ഉദ്ദേശ്യം വ്യക്തമായി വായിക്കാനുമായി ഗ്രീക്ക് വാക്യം രണ്ട് മലയാളവാക്യങ്ങളായി വിഭജിച്ചു.
