revisions:
- from: അതുകൊണ്ട് ഇപ്പോൾ, അയാളെ നിങ്ങളുടെ അടുക്കലേക്ക് ഇറക്കിക്കൊണ്ടുവരാൻ[a] സൈനികമേധാവിയോട് നിങ്ങളും ന്യായാധിപസഭയും ചേർന്ന് ഔദ്യോഗികമായി അറിയിക്കുക. അയാളെ സംബന്ധിച്ച കാര്യങ്ങൾ കൂടുതൽ സൂക്ഷ്മമായി പരിശോധിക്കാൻ പോകുന്നു എന്ന ഭാവത്തിലായിരിക്കണം[b] അത്. എന്നാൽ അയാൾ അടുത്തെത്തുന്നതിനുമുമ്പ്[c] അയാളെ കൊന്നുകളയാൻ ഞങ്ങൾ തയ്യാറാണ്.
  to: 'അതുകൊണ്ട് ഇപ്പോൾ, നിങ്ങളും ന്യായസഭയും ചേർന്ന് സൈനികമേധാവിയോട് അറിയിക്കണം: അയാളെ സംബന്ധിച്ച കാര്യങ്ങൾ കൂടുതൽ സൂക്ഷ്മമായി പരിശോധിക്കാനിരിക്കുകയാണെന്ന ഭാവത്തിൽ, അയാളെ നിങ്ങളുടെ അടുക്കലേക്ക് താഴേക്ക് കൊണ്ടുവരാൻ[a]. എന്നാൽ അയാൾ അടുത്തെത്തുന്നതിനുമുമ്പ്[c] അയാളെ കൊന്നുകളയാൻ ഞങ്ങൾ തയ്യാറാണ്.'
  rationale: 'The revision restores the Greek syntactic relationship: the council and addressees are to inform the commander so that he brings Paul down to them, while they present themselves as intending a more careful examination. It removes an added adverb, uses a neutral equivalent for ‘council,’ and preserves the directional nuance of κατάγω. Footnote b is omitted because the revised wording directly expresses the pretense and no longer needs a lexical-alternative note; the retained anchors correspond to genuine alternatives in the text.'
