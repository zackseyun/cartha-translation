  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഇപ്പോൾ, നിങ്ങളും ന്യായസഭയും ചേർന്ന് സൈനികമേധാവിയോട് അറിയിക്കണം: അയാളെ സംബന്ധിച്ച കാര്യങ്ങൾ കൂടുതൽ സൂക്ഷ്മമായി പരിശോധിക്കാനിരിക്കുകയാണെന്ന ഭാവത്തിൽ, അയാളെ നിങ്ങളുടെ അടുക്കലേക്ക് താഴേക്ക് കൊണ്ടുവരാൻ[a]. എന്നാൽ അയാൾ അടുത്തെത്തുന്നതിനുമുമ്പ്[c] അയാളെ കൊന്നുകളയാൻ ഞങ്ങൾ തയ്യാറാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അയാളെ നിങ്ങളുടെ മുമ്പാകെ കൊണ്ടുവരാൻ.’ ഗ്രീക്ക് ക്രിയയിൽ അക്ഷരാർഥത്തിൽ താഴേക്ക് കൊണ്ടുവരുക എന്ന ആശയം ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അയാൾ എത്തുന്നതിനുമുമ്പ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: ഔദ്യോഗികമായി അറിയിക്കുക
  rationale: അധികാരസ്ഥാനത്തുള്ള ഒരാളെ ഒരു കാര്യം അറിയിക്കുക എന്ന ക്രിയയുടെ ഔപചാരിക ഭാവം സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; വെറും ‘അപേക്ഷിക്കുക’ എന്ന് പറഞ്ഞ് ഉള്ളടക്കം അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: χιλιάρχῳ
  choice: സൈനികമേധാവിയോട്
  rationale: റോമൻ സൈന്യത്തിലെ chiliarch-നെയാണ് സൂചിപ്പിക്കുന്നത്. സാങ്കേതികമായ ‘സഹസ്രാധിപൻ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദപ്രയോഗം.
- source_word: σὺν τῷ συνεδρίῳ
  choice: നിങ്ങളും ന്യായാധിപസഭയും ചേർന്ന്
  rationale: σύν സൂചിപ്പിക്കുന്ന കൂട്ടായ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; συνέδριον ഇവിടെ യഹൂദ ഭരണ-ന്യായസഭയെ സൂചിപ്പിക്കുന്നു.
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: അയാളെ നിങ്ങളുടെ അടുക്കലേക്ക് ഇറക്കിക്കൊണ്ടുവരാൻ
  rationale: κατάγω എന്ന ക്രിയയിലെ താഴേക്കുള്ള ഗതിയുടെ സൂചന നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാരണപ്രയോഗമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὡς μέλλοντας
  choice: പരിശോധിക്കാൻ പോകുന്നു എന്ന ഭാവത്തിലായിരിക്കണം
  rationale: അവർ അവതരിപ്പിക്കേണ്ട ഉദ്ദേശ്യം യഥാർഥമല്ലെന്ന ὡς സഹിതമുള്ള പങ്കാളിക്രിയയുടെ ഭാവം വ്യക്തമാക്കുന്നു; ‘കപടമായി’ പോലുള്ള അധിക മൂല്യനിർണയപദം ചേർക്കുന്നില്ല.
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: കൂടുതൽ സൂക്ഷ്മമായി പരിശോധിക്കാൻ
  rationale: ന്യായപരമായ അന്വേഷണത്തിന്റെ അർഥവും ἀκριβέστερον എന്ന താരതമ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὰ περὶ αὐτοῦ
  choice: അയാളെ സംബന്ധിച്ച കാര്യങ്ങൾ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘അയാളുടെ കേസ്’ എന്നു പറഞ്ഞ് നിയമപരമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: πρὸ τοῦ ἐγγίσαι αὐτόν
  choice: അയാൾ അടുത്തെത്തുന്നതിനുമുമ്പ്
  rationale: ἐγγίζω എന്നതിലെ സമീപനത്തിന്റെ സ്ഥലപരമായ സൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘എത്തുന്നതിനുമുമ്പ്’ എന്നും മനസ്സിലാക്കാം.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: അയാളെ കൊന്നുകളയാൻ
  rationale: ഈ സന്ദർഭത്തിലെ ἀναιρέω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലത്തിൽ പ്രത്യേകം പ്രകടമല്ലാത്ത നിയമ-ധാർമിക വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
