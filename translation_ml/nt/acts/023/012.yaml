translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വിവരണശൈലി. മൂലത്തിലെ ‘യെഹൂദന്മാർ’ എന്ന പദം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ സന്ദർഭപരമായ പരിമിതി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. ശാപബന്ധിത പ്രതിജ്ഞയുടെ സാംസ്കാരിക അർഥം അമിതവ്യാഖ്യാനമില്ലാതെ അവതരിപ്പിച്ചു.
