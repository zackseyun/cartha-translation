source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: ml
  text: നേരം പുലർന്നപ്പോൾ, യെഹൂദന്മാർ[a] ഗൂഢാലോചന നടത്തി, പൗലോസിനെ കൊന്നിട്ടല്ലാതെ തങ്ങൾ ഭക്ഷിക്കുകയോ കുടിക്കുകയോ ഇല്ലെന്നു പറഞ്ഞ് തങ്ങളെത്തന്നെ ശാപത്തിന് വിധേയരാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘യെഹൂദന്മാർ.’ ഇവിടെ ഇതു മുഴുവൻ യെഹൂദജനതയെയല്ല, ഗൂഢാലോചനയിൽ പങ്കെടുത്ത യെഹൂദന്മാരിൽ ഒരു പ്രത്യേക സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘തങ്ങളെത്തന്നെ ശാപത്തിൻ കീഴിലാക്കി.’ തങ്ങൾ പ്രതിജ്ഞ പാലിച്ചില്ലെങ്കിൽ തങ്ങളുടെമേൽ ന്യായവിധി വരട്ടെ എന്നു വിളിച്ചുപറഞ്ഞ് സ്വയം ഏറ്റെടുത്ത പ്രതിജ്ഞയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: നേരം പുലർന്നപ്പോൾ
  rationale: ദിവസം വന്നതിനെ സൂചിപ്പിക്കുന്ന കാലസംബന്ധിയായ genitive absolute സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ποιήσαντες συστροφὴν
  choice: ഗൂഢാലോചന നടത്തി
  rationale: രഹസ്യമായി സംഘടിച്ച് കൊലപാതകം ആസൂത്രണം ചെയ്തതാണു സന്ദർഭം; ‘കലാപസംഘം രൂപപ്പെടുത്തി’ എന്നതിനേക്കാൾ ഗൂഢാലോചന ഈ ഉദ്ദേശ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ജനവിഭാഗനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മുഴുവൻ യെഹൂദജനതയെയല്ല, ഗൂഢാലോചനയിൽ പങ്കെടുത്ത ഒരു പ്രത്യേക സംഘത്തെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: തങ്ങളെത്തന്നെ ശാപത്തിന് വിധേയരാക്കി
  rationale: പ്രതിജ്ഞ ലംഘിച്ചാൽ തങ്ങളുടെമേൽ ന്യായവിധി വരട്ടെ എന്ന സ്വയം ചുമത്തിയ ശാപത്തിന്റെ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: തങ്ങൾ ഭക്ഷിക്കുകയോ കുടിക്കുകയോ ഇല്ലെന്നു പറഞ്ഞ്
  rationale: പ്രതിജ്ഞയുടെ ഉള്ളടക്കം വ്യക്തമാക്കുന്ന infinitival construction-ഉം ഇരട്ട നിഷേധവും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: പൗലോസിനെ കൊന്നിട്ടല്ലാതെ
  rationale: കൊല നടത്തുന്നതുവരെ ഉപവാസപ്രതിജ്ഞ തുടരുമെന്ന പരിധി ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
