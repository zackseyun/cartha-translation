id: ACT.23.24
reference: Acts 23:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κτήνη τε παραστῆσαι ἵνα ἐπιβιβάσαντες τὸν Παῦλον διασώσωσι πρὸς Φήλικα τὸν ἡγεμόνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/024.yaml
  text: and provide mounts[a], so that they may put Paul on them and bring him safely to Felix the governor[b],
translation:
  language: ml
  text: പൗലോസിനെ അവയുടെ മേൽ കയറ്റി ഭരണാധികാരിയായ ഫേലിക്‌സിന്റെ അടുക്കൽ സുരക്ഷിതമായി എത്തിക്കേണ്ടതിന് സവാരിക്കുള്ള മൃഗങ്ങളെയും[a] ഒരുക്കുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മൃഗങ്ങൾ’ അല്ലെങ്കിൽ ‘ഭാരവാഹിമൃഗങ്ങൾ’; ഏത് തരത്തിലുള്ള സവാരിമൃഗമാണെന്ന് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പൗലോസിനെ അവയുടെ മേൽ കയറ്റിയശേഷം ഭരണാധികാരിയായ ഫേലിക്‌സിന്റെ അടുക്കൽ സുരക്ഷിതമായി എത്തിക്കുക.’
    reason: previous_rendering
lexical_decisions:
- source_word: κτήνη
  choice: വാഹനമൃഗങ്ങൾ
  rationale: κτήνη ഏതെങ്കിലും പ്രത്യേക ജന്തുവർഗത്തെ സൂചിപ്പിക്കാതെ സവാരിക്കോ ഭാരം ചുമക്കാനോ ഉപയോഗിക്കുന്ന മൃഗങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘കുതിരകൾ’ എന്ന് അമിതമായി വ്യക്തമാക്കാതെ പ്രവർത്തനപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τε
  choice: -യും
  rationale: മുൻവാക്യത്തിലെ നിർദേശങ്ങളോടു ഈ നിർദേശം ബന്ധിപ്പിക്കുന്ന സംയോജകബലം മലയാളത്തിൽ ‘-യും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παραστῆσαι
  choice: ഒരുക്കിനിർത്തുക
  rationale: കൽപ്പനാസന്ദർഭത്തിൽ മൃഗങ്ങളെ ലഭ്യമായും സജ്ജമായും നിർത്തുക എന്ന പ്രായോഗിക അർഥം നൽകുന്നു.
- source_word: ἵνα
  choice: -േണ്ടതിന്
  rationale: ἵνα അവതരിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιβιβάσαντες
  choice: പൗലോസിനെ അവയുടെ മേൽ കയറ്റി
  rationale: പൗലോസിനെ മൃഗത്തിന്റെ മേൽ കയറ്റുക എന്ന കാരണാർത്ഥക ആശയവും തുടർന്നുള്ള പ്രവൃത്തിക്കു മുമ്പുള്ള ക്രമവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: διασώσωσι
  choice: സുരക്ഷിതമായി എത്തിക്കേണ്ടതിന്
  rationale: അപകടത്തിൽനിന്നു സംരക്ഷിച്ചുകൊണ്ട് ലക്ഷ്യസ്ഥാനത്ത് എത്തിക്കുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: πρὸς
  choice: അടുക്കൽ
  rationale: ഒരു വ്യക്തിയിലേക്കുള്ള ഗതിയും അദ്ദേഹത്തിന്റെ സന്നിധിയിലേക്കുള്ള എത്തിച്ചേരലും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἡγεμόνα
  choice: ദേശാധിപതി
  rationale: റോമൻ പ്രവിശ്യാഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന ἡγεμών എന്ന പദത്തിന് വ്യക്തവും മാന്യവുമായ മലയാള ഭരണപദമാണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കൽപ്പനാശൈലി. വാക്യം മുൻപത്തെ നിർദേശങ്ങളുടെ തുടർച്ചയായതിനാൽ ‘-യും’ ഉപയോഗിച്ചു. ‘വാഹനമൃഗങ്ങൾ’ ജന്തുവർഗം അനാവശ്യമായി നിർണയിക്കാതെ മൂലപദത്തിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കുന്നു.
