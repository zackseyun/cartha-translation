  to: പൗലോസിനെ അവയുടെ മേൽ കയറ്റി ഭരണാധികാരിയായ ഫേലിക്‌സിന്റെ അടുക്കൽ സുരക്ഷിതമായി എത്തിക്കേണ്ടതിന് സവാരിക്കുള്ള മൃഗങ്ങളെയും[a] ഒരുക്കുക.[b]
