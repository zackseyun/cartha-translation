    rationale: 'While intended to render κτήνη broadly, this compound is not normal modern Malayalam for riding or burden animals and may obscure the immediately relevant function: Paul is to be put on them.'
  - severity: low
    issue: ‘ദേശാധിപതി’ is less natural than ‘ഭരണാധികാരി’ in current Malayalam.
    rationale: The Greek ἡγεμών is a general title for a governing official. ‘ഭരണാധികാരിയായ’ communicates this naturally and avoids an unnecessarily literary-sounding designation.
