id: ACT.23.27
reference: Acts 23:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: ml
  text: ഈ മനുഷ്യനെ യെഹൂദന്മാർ[a] പിടികൂടി, അവരാൽ കൊല്ലപ്പെടാനിരിക്കെ, അവൻ റോമാക്കാരനാണെന്ന് അറിഞ്ഞ് ഞാൻ സൈനികസംഘത്തോടൊപ്പം എത്തി അവനെ രക്ഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദ്യർ.’ ഗ്രീക്കുപദം വംശീയ-മതപരമായ അർഥത്തിൽ യെഹൂദന്മാരെയോ ഭൂമിശാസ്ത്രപരമായ അർഥത്തിൽ യെഹൂദ്യനിവാസികളെയോ സൂചിപ്പിക്കാം; ഇവിടെ മിക്കവാറും യെരൂശലേമിൽ പൗലോസിനെ എതിർത്ത യെഹൂദജനക്കൂട്ടത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: പിടികൂടി
  rationale: ഔപചാരികമായ നിയമനടപടിയായ അറസ്റ്റിനെക്കാൾ, സന്ദർഭത്തിലെ ശത്രുതാപരമായ പിടിച്ചെടുക്കലിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Ἰουδαίων
  choice: യെഹൂദർ
  rationale: ഇവിടെ യെരൂശലേമിൽ പൗലോസിനെ എതിർത്ത യെഹൂദസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: കൊല്ലാൻ ഒരുങ്ങിയപ്പോൾ
  rationale: μέλλω നൽകുന്ന ആസന്നതയും ἀναιρέωയുടെ ‘കൊല്ലുക’ എന്ന സന്ദർഭാർഥവും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπιστὰς
  choice: അവിടെയെത്തി
  rationale: പെട്ടെന്നുള്ള എത്തിച്ചേരൽ/ഇടപെടൽ എന്ന ഭാവം തുടർന്നുള്ള രക്ഷാപ്രവർത്തനത്തോടൊപ്പം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: σὺν τῷ στρατεύματι
  choice: സൈനികരോടൊപ്പം
  rationale: ഒരു സൈനികസംഘത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം സംഘത്തിന്റെ വലുപ്പം അനാവശ്യമായി നിർണ്ണയിക്കാതെ നൽകുന്നു.
- source_word: ἐξειλάμην
  choice: അവനെ രക്ഷിച്ചു
  rationale: ആസന്നമായ മരണഭീഷണിയിൽനിന്നുള്ള വിടുതലാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
- source_word: μαθὼν
  choice: അറിഞ്ഞിട്ടായിരുന്നു അത്
  rationale: ഗ്രീക്കിലെ aorist participle മുഖ്യക്രിയയോടു ബന്ധിപ്പിക്കുന്ന മുൻകാല/കാരണസദൃശ ഭാവം നിലനിർത്തുന്നു; കത്തിന്റെ സ്വയംന്യായീകരണപരമായ അവതരണം തിരുത്തുന്നില്ല.
- source_word: Ῥωμαῖός ἐστιν
  choice: അവൻ റോമാക്കാരനാണെന്ന്
  rationale: നേരിട്ടുള്ള പദാർഥം നിലനിർത്തുന്നു; ഈ നിയമസന്ദർഭത്തിൽ റോമൻ പൗരത്വം സൂചിപ്പിക്കപ്പെടുന്നുവെങ്കിലും ‘പൗരൻ’ എന്നു വാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സേനാധിപന്റെ കത്തിലെ ചരിത്രപരവും വാഗ്മിതാപരവുമായ അവതരണം
  choice: സേനാധിപൻ സ്വന്തം നടപടിയെ അനുകൂലമായി അവതരിപ്പിക്കുന്ന അവകാശവാദം ഗ്രീക്കിലുള്ളതുപോലെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പ്രവൃത്തികൾ 21–22-ലെ വിശാല വിവരണവുമായി ഒത്തുപോകാൻ സംഭവക്രമം വിശദീകരിക്കുകയോ തിരുത്തുകയോ ചെയ്യുക.
  rationale: ഈ വാക്യം ക്ലൗദ്യൊസ് ലുസിയാസിന്റെ തന്നെ വാക്കുകളാണ് റിപ്പോർട്ട് ചെയ്യുന്നത്. ചുറ്റുപാടുള്ള വിവരണവുമായി കാണുന്ന സംഘർഷം പരിഭാഷകൻ നിശ്ശബ്ദമായി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അറിഞ്ഞിട്ടായിരുന്നു അത്’ എന്ന ഘടന ഗ്രീക്കിലെ μαθὼν എന്ന participle-ന്റെ ബന്ധം നിലനിർത്തുകയും സേനാധിപന്റെ വാദത്തിലെ കഥനപരമായ സംഘർഷം മറച്ചുവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
