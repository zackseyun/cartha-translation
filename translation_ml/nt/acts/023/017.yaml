  terminology: “ശതാധിപൻ” suitably renders ἑκατοντάρχης (centurion), while “സൈനികാധിപൻ” gives a readable rendering of χιλίαρχος (the commander/tribune) and maintains a distinction between the two ranks. “യുവാവ്” and “അറിയിക്കാൻ ... ഒരു കാര്യമുണ്ട്” accurately and naturally convey νεανίας and ἔχει ... ἀπαγγεῖλαί τι.
