id: ACT.23.17
reference: Acts 23:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσκαλεσάμενος δὲ ὁ Παῦλος ἕνα τῶν ἑκατονταρχῶν ἔφη· Τὸν νεανίαν τοῦτον ⸀ἄπαγε πρὸς τὸν χιλίαρχον, ἔχει γὰρ ⸂ἀπαγγεῖλαί τι⸃ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: ml
  text: 'അപ്പോൾ പൗലോസ് ശതാധിപന്മാരിൽ ഒരാളെ അടുത്തുവിളിച്ച് പറഞ്ഞു: “ഈ യുവാവിനെ സൈനികാധിപന്റെ അടുക്കൽ കൊണ്ടുപോകുക; അദ്ദേഹത്തെ അറിയിക്കാൻ ഇവന് ഒരു കാര്യമുണ്ട്.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: അടുത്തുവിളിച്ച്
  rationale: ആളെ തന്റെ അടുക്കലേക്കു വിളിക്കുന്ന προσκαλέομαι എന്ന ക്രിയയുടെ മധ്യപ്രയോഗഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, കഥയുടെ തുടർച്ചയാണ് δέ സൂചിപ്പിക്കുന്നത്; ‘അപ്പോൾ’ ആ മുന്നേറ്റം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: ശതാധിപന്മാരിൽ ഒരാളെ
  rationale: റോമൻ സൈന്യത്തിലെ ἑκατοντάρχης എന്ന പദവിക്ക് ചരിത്രപരമായി പരിചിതവും കൃത്യവുമായ മലയാളരൂപമാണ് ‘ശതാധിപൻ’.
- source_word: νεανίαν
  choice: യുവാവിനെ
  rationale: νεανίας സൂചിപ്പിക്കുന്ന ചെറുപ്പക്കാരനായ പുരുഷനെ ആധുനികവും മാന്യവുമായ ഭാഷയിൽ പറയുന്നു.
- source_word: ἄπαγε
  choice: കൊണ്ടുപോകുക
  rationale: ഒരാളെ മറ്റൊരാളുടെ അടുക്കലേക്കു നയിച്ചുകൊണ്ടുപോകാനുള്ള ആജ്ഞയാണ് സന്ദർഭത്തിൽ ἀπάγω നൽകുന്നത്.
- source_word: πρὸς τὸν χιλίαρχον
  choice: സൈനികാധിപന്റെ അടുക്കൽ
  rationale: χιλίαρχος ഇവിടെ റോമൻ സൈനിക ട്രിബ്യൂണിനെ സൂചിപ്പിക്കുന്നു; സാങ്കേതികത അമിതമാക്കാതെ അദ്ദേഹത്തിന്റെ അധികാരസ്ഥാനം ‘സൈനികാധിപൻ’ വ്യക്തമാക്കുന്നു.
- source_word: ἔχει γὰρ ἀπαγγεῖλαί τι αὐτῷ
  choice: അദ്ദേഹത്തെ അറിയിക്കാൻ ഇവന് ഒരു കാര്യമുണ്ട്
  rationale: ἔχει + infinitive എന്ന ഘടനയും വിവരം അറിയിക്കുക/അറിയിച്ചുകൊടുക്കുക എന്ന ἀπαγγέλλωയുടെ അർത്ഥവും സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
