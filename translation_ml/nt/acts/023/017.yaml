translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. റോമൻ പദവികൾ തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്താൻ ἑκατοντάρχης എന്നതിന് ‘ശതാധിപൻ’, χιλίαρχος എന്നതിന് ‘സൈനികാധിപൻ’ എന്നിവ ഉപയോഗിച്ചു.
