source:
  edition: SBLGNT
  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: ml
  text: അതുകൊണ്ട് നീ അവരുടെ വാക്കിന് വഴങ്ങരുത്. കാരണം, അവരുടെ കൂട്ടത്തിൽനിന്നുള്ള നാല്പതിലധികം പേർ അവനെ പതിയിരുന്ന് കാത്തിരിക്കുന്നു. അവനെ കൊന്നുകളയുന്നതുവരെ തിന്നുകയോ കുടിക്കുകയോ ചെയ്യില്ലെന്ന്, തങ്ങൾക്കുതന്നെ ശാപം വരട്ടെയെന്ന് അവർ പ്രതിജ്ഞ ചെയ്തിരിക്കുന്നു.[a] ഇപ്പോൾ അവർ തയ്യാറായിരിക്കുന്നു; നീ നൽകുന്ന വാഗ്ദാനത്തിനായി[b] കാത്തിരിക്കുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളെത്തന്നെ ശാപത്തിന് വിധേയരാക്കി.” തങ്ങൾ പ്രതിജ്ഞ പാലിക്കാതിരുന്നാൽ തങ്ങളുടെമേൽ ശാപം വരട്ടെയെന്ന ആശയം ഗ്രീക്ക് പ്രയോഗത്തിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, “നിന്നിൽനിന്നുള്ള വാഗ്ദാനത്തിനായി.” ഇവിടെ നിന്റെ സമ്മതമോ അനുമതിയോ ലഭിക്കുമെന്ന പ്രതീക്ഷയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: അവരുടെ വാക്കിന് വഴങ്ങരുത്
  rationale: നിഷ്ക്രിയ ആജ്ഞാരൂപം സന്ദർഭത്തിൽ അവരുടെ അഭ്യർഥനയാൽ സ്വാധീനിക്കപ്പെടുകയോ അതിന് വഴങ്ങുകയോ ചെയ്യരുതെന്ന മുന്നറിയിപ്പാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി അത് വ്യക്തമാക്കുന്നു.
- source_word: ἐνεδρεύουσιν
  choice: പതിയിരുന്ന് ആക്രമിക്കാൻ കാത്തിരിക്കുന്നു
  rationale: ക്രിയയിലെ പതിയിരിപ്പിന്റെ മൂർത്തമായ അർഥവും ശത്രുതാപരമായ ഉദ്ദേശ്യവും നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτῶν
  choice: അവരിൽനിന്നുള്ള
  rationale: പറഞ്ഞ കൂട്ടത്തിൽനിന്നുതന്നെയാണ് ഈ ആളുകൾ എന്ന ഉറവിടാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: നാല്പതിലധികം പേർ
  rationale: താരതമ്യരൂപവും സംഖ്യയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: ശാപം ചൊല്ലി പ്രതിജ്ഞ ചെയ്തിരിക്കുന്നു
  rationale: പ്രതിജ്ഞ ലംഘിച്ചാൽ തങ്ങൾക്കുമേൽ ശാപം വരട്ടെയെന്ന സ്വയംശാപത്തിന്റെ ആശയവും പ്രതിജ്ഞയുടെ ഗൗരവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: തിന്നുകയോ കുടിക്കുകയോ ചെയ്യില്ലെന്ന്
  rationale: ഭക്ഷണവും പാനീയവും രണ്ടും നിരസിക്കുന്ന സമാന്തര ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: അവനെ കൊന്നുകളയുന്നതുവരെ
  rationale: ἀναιρέω എന്ന ക്രിയയ്ക്ക് ഇവിടെ അക്രമപരമായി കൊല്ലുക എന്ന വ്യക്തമായ അർഥമാണ്.
- source_word: εἰσιν ἕτοιμοι
  choice: അവർ തയ്യാറായി
  rationale: ഗ്രീക്കിലെ വിശേഷണപ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: προσδεχόμενοι
  choice: കാത്തിരിക്കുകയാണ്
  rationale: പ്രതീക്ഷയോടെയുള്ള കാത്തിരിപ്പിനെ വ്യക്തമാക്കുന്നു.
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: നിന്റെ സമ്മതത്തിനായി
  rationale: 'ἐπαγγελία സാധാരണയായി ‘വാഗ്ദാനം’ എന്നാണെങ്കിലും, ഇവിടെ സൈന്യാധിപന്റെ അനുമതി അഥവാ സമ്മതം ലഭിക്കുമെന്ന പ്രതീക്ഷയാണ് സന്ദർഭാർഥം; മുഖ്യവാചകത്തിൽ അർഥസുതാര്യതയ്ക്കായി ‘സമ്മതം’ ഉപയോഗിച്ചു, അടിക്കുറിപ്പിൽ പദശ: സാധ്യത സൂചിപ്പിച്ചു.'
