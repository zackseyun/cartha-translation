  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; പതിയിരിപ്പ്, സ്വയംശാപം, കൊലപാതക ഉദ്ദേശ്യം എന്നിവയുടെ ശക്തി നിലനിർത്തി.
