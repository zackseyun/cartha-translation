id: ACT.23.19
reference: Acts 23:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: ml
  text: 'അപ്പോൾ സൈനികാധിപൻ അവന്റെ കൈപിടിച്ച് സ്വകാര്യമായി മാറിനിന്ന് അവനോടു ചോദിച്ചുകൊണ്ടിരുന്നു: “എന്നെ അറിയിക്കാനുള്ള കാര്യം നിനക്കു എന്താണ്?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: അവന്റെ കൈപിടിച്ച്
  rationale: ജനിറ്റീവോടുകൂടിയ ἐπιλαμβάνομαι ഇവിടെ ഒരാളുടെ കൈയിൽ പിടിക്കുക എന്ന മൂർത്തമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ‘കൈപിടിച്ച്’ എന്നത് ബലപ്രയോഗം അനാവശ്യമായി സൂചിപ്പിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ ആ പ്രവൃത്തി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: അപ്പോൾ
  rationale: ഇവിടെ δέ ആഖ്യാനത്തിന്റെ തുടർച്ചയാണ് അടയാളപ്പെടുത്തുന്നത്; ‘അപ്പോൾ’ സ്വാഭാവികമായ കഥാഗതിമാറ്റം നൽകുന്നു.
- source_word: ὁ χιλίαρχος
  choice: സൈനികാധിപൻ
  rationale: χιλίαρχος റോമൻ സൈന്യത്തിലെ ഉന്നത ഉദ്യോഗസ്ഥനെ സൂചിപ്പിക്കുന്നു. ‘സൈനികാധിപൻ’ പദവിയുടെ സൈനികസ്വഭാവം വ്യക്തമാക്കുകയും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: മറ്റുള്ളവരിൽനിന്ന് മാറി സ്വകാര്യമായി
  rationale: ἀναχωρέω സൂചിപ്പിക്കുന്ന മാറിപ്പോകലും κατ’ ἰδίαν സൂചിപ്പിക്കുന്ന സ്വകാര്യതയും ഈ പ്രയോഗം നിലനിർത്തുന്നു. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത കർമം ചേർക്കാതെ സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἐπυνθάνετο
  choice: ചോദിച്ചു
  rationale: ഇംപർഫെക്റ്റ് രൂപത്തിന് പുരോഗമനമോ ആരംഭസൂചനയോ ഉണ്ടായേക്കാമെങ്കിലും, ഒറ്റ നേരിട്ടുള്ള ചോദ്യത്തിന്റെ മലയാള ആഖ്യാനത്തിൽ ‘ചോദിച്ചു’ കൂടുതൽ സ്വാഭാവികമാണ്; ചോദിച്ചറിയുക എന്ന അർഥവും നിലനിൽക്കുന്നു.
- source_word: Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: എന്നെ അറിയിക്കാൻ നിനക്കുള്ള കാര്യം എന്താണ്?
  rationale: ἔχεις + ഇൻഫിനിറ്റീവ് എന്ന ഘടനയെ ‘നിനക്കുള്ള കാര്യം’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ἀπαγγέλλω എന്നതിലെ വിവരം അറിയിക്കൽ/റിപ്പോർട്ട് ചെയ്യൽ എന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആഖ്യാനശൈലി. ഔദ്യോഗിക-സൈനിക സന്ദർഭം ‘സൈനികാധിപൻ’ എന്ന പദത്തിലൂടെ വ്യക്തമാക്കിയിട്ടുണ്ട്; മൂലത്തിലെ പ്രവൃത്തിക്രമവും സ്വകാര്യ സംഭാഷണത്തിന്റെ ഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്.
