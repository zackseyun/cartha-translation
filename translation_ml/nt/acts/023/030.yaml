  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηνυθείσης δέ μοι ἐπιβουλῆς εἰς τὸν ⸀ἄνδρα ἔσεσθαι ⸀ἐξαυτῆς ἔπεμψα πρὸς σέ, παραγγείλας καὶ τοῖς κατηγόροις ⸀λέγειν πρὸς αὐτὸν ἐπὶ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: ml
  text: ആ മനുഷ്യനെതിരെ ഒരു ഗൂഢാലോചന നടക്കാനിരിക്കുന്നതായി എനിക്ക് വിവരം ലഭിച്ചപ്പോൾ, ഞാൻ ഉടൻതന്നെ അവനെ അങ്ങയുടെ അടുക്കലേക്ക് അയച്ചു; അവനെ കുറ്റപ്പെടുത്തുന്നവരോട് അവരുടെ വാദം അങ്ങയുടെ മുമ്പാകെ ഉന്നയിക്കാനും കല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെതിരെ പറയാനും.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അങ്ങയുടെ മുമ്പാകെ അവനോട്/അവനെതിരെ സംസാരിക്കാൻ’ എന്നാണ്; ഇവിടെ കോടതിയിലെ ഭാഷാപ്രയോഗമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: എനിക്ക് വിവരം ലഭിച്ചപ്പോൾ
  rationale: μηνύω എന്ന ക്രിയയുടെ aorist passive genitive absolute രൂപത്തെ സ്വാഭാവികമായ കാലസൂചക ഉപവാക്യമായി നൽകി; passive അർഥവും നിലനിർത്തുന്നു.
- source_word: ἐπιβουλῆς
  choice: ഒരു ഗൂഢാലോചന
  rationale: ശത്രുതാപരമായ രഹസ്യപദ്ധതിയെയാണ് ἐπιβουλή സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ പതിയിരിപ്പും സാധ്യതയാണെങ്കിലും, മൂലപദത്തേക്കാൾ അർഥം ചുരുക്കാതിരിക്കാൻ വിശാലമായ ‘ഗൂഢാലോചന’ തിരഞ്ഞെടുത്തു.
- source_word: εἰς τὸν ἄνδρα
  choice: ആ മനുഷ്യനെതിരെ
  rationale: εἰς ഇവിടെ ശത്രുതയുടെ ദിശ സൂചിപ്പിക്കുന്നു; ലേഖനത്തിന്റെ ഔദ്യോഗിക ഭാവവും ἄνδρα എന്ന നാമത്തിന്റെ വ്യക്തമായ പരാമർശവും നിലനിർത്തുന്നു.
- source_word: ἔσεσθαι
  choice: നടക്കാനിരിക്കുന്നതായി
  rationale: ഭാവികാല infinitive വരാനിരിക്കുന്ന ഗൂഢാലോചനയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി റിപ്പോർട്ട് ചെയ്ത വിവരത്തിന്റെ ഉള്ളടക്കമായി അവതരിപ്പിച്ചു.
- source_word: ἐξαυτῆς
  choice: ഉടൻതന്നെ
  rationale: പ്രവർത്തനത്തിന്റെ അടിയന്തരത വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἔπεμψα πρὸς σέ
  choice: ഞാൻ ... അവനെ അങ്ങയുടെ അടുക്കലേക്ക് അയച്ചു
  rationale: ഗ്രീക്കിൽ കർമം പ്രകടമല്ലെങ്കിലും സന്ദർഭത്തിൽ പൗലൊസ് തന്നെയാണെന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി ‘അവനെ’ ചേർത്തു.
- source_word: παραγγείλας
  choice: കല്പിച്ചു
  rationale: അയച്ചതിനോടൊപ്പം നടന്ന അധിക ഔദ്യോഗിക നിർദേശം എന്ന participial ബന്ധം ‘-ആനും കല്പിച്ചു’ എന്ന ഘടനയിൽ നിലനിർത്തി.
- source_word: κατηγόροις
  choice: അവനെ കുറ്റപ്പെടുത്തുന്നവരോട്
  rationale: നിയമപരമായ കുറ്റാരോപകരെയാണ് സൂചിപ്പിക്കുന്നത്; ആരെയാണ് അവർ കുറ്റപ്പെടുത്തുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തമായി നൽകി.
- source_word: λέγειν πρὸς αὐτὸν
  choice: അവരുടെ വാദം ... ഉന്നയിക്കാൻ
  rationale: അക്ഷരാർഥത്തിൽ ‘അവനോട്/അവനെതിരെ സംസാരിക്കാൻ’ എന്നാണെങ്കിലും, കോടതിസന്ദർഭത്തിൽ കുറ്റാരോപണവാദം അവതരിപ്പിക്കുക എന്ന അർഥം സ്വാഭാവികമായി നൽകി; അക്ഷരാർഥത്തിലെ തുറന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἐπὶ σοῦ
  choice: അങ്ങയുടെ മുമ്പാകെ
  rationale: അധികാരിയായ ഫെലിക്സിന്റെ സന്നിധിയിലും ന്യായാധികാരത്തിനു മുമ്പിലും ഹാജരാകുന്ന നിയമപരമായ ഭാവം സംക്ഷിപ്തമായി നൽകുന്നു.
