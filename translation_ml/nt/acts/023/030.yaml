translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഔദ്യോഗിക ശൈലി സ്വീകരിച്ചു. റോമൻ ഭരണാധികാരിയെ അഭിസംബോധന ചെയ്യുന്ന ലേഖനമായതിനാൽ ‘അങ്ങയുടെ’ എന്ന ആദരസൂചക രൂപം ഉപയോഗിച്ചു; അത്യന്തം പുരാതനമോ സഭാവിഭാഗ-സവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
