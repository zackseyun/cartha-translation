id: ACT.23.6
reference: Acts 23:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: ml
  text: 'എന്നാൽ, ഒരു വിഭാഗം സദൂക്യരും മറ്റേ വിഭാഗം പരീശന്മാരുമാണെന്ന് പൗലോസ് മനസ്സിലാക്കിയപ്പോൾ, ന്യായാധിപസഭയിൽ[a] ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “സഹോദരന്മാരേ, ഞാൻ ഒരു പരീശനാണ്, പരീശന്മാരുടെ മകനാണ്[b]. പ്രത്യാശയെയും മരിച്ചവരുടെ പുനരുത്ഥാനത്തെയും കുറിച്ചാണ് ഞാൻ വിചാരണ ചെയ്യപ്പെടുന്നത്[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൻഹെദ്രിനിൽ.” ഈ ഗ്രീക്ക് പദം പ്രത്യേകമായി യഹൂദ ഭരണസഭയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പരീശരായ മാതാപിതാക്കളുടെ മകൻ” അല്ലെങ്കിൽ “പരീശന്മാരുടെ വംശജൻ.”
    reason: alternative_reading
  - marker: c
    text: അഥവാ, “മരിച്ചവരുടെ പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പ്രത്യാശ നിമിത്തമാണ് ഞാൻ വിചാരണ ചെയ്യപ്പെടുന്നത്.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: മനസ്സിലാക്കിയപ്പോൾ
  rationale: അയോറിസ്റ്റ് കൃദന്തം പൗലോസിന്റെ തുടർന്നുള്ള പ്രവൃത്തിക്കുള്ള സാഹചര്യവും കാരണബന്ധവും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ കാലവാക്യരൂപം സ്വാഭാവികമാണ്.
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: ഒരു വിഭാഗം ... മറ്റേ വിഭാഗം
  rationale: സഭയ്ക്കുള്ളിലെ രണ്ടു കൂട്ടങ്ങളെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: സദൂക്യർ / പരീശന്മാർ
  rationale: യഹൂദമതത്തിലെ ഈ വിഭാഗങ്ങൾക്ക് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള പേരുകൾ.
- source_word: ἔκραζεν
  choice: ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു
  rationale: κράζω സൂചിപ്പിക്കുന്ന ശക്തമായ പരസ്യപ്രഖ്യാപനത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ συνεδρίῳ
  choice: ന്യായാധിപസഭയിൽ
  rationale: സന്ദർഭത്തിലെ യഹൂദ ഭരണ-ന്യായസഭയെ അർത്ഥവത്തായി സൂചിപ്പിക്കുന്നു; ‘സൻഹെദ്രിൻ’ എന്ന പേരുരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പുരുഷസംബോധന; ἄνδρες എന്ന ഘടകം പ്രത്യേകം പദാനുപദമായി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകും.
- source_word: Φαρισαῖός εἰμι
  choice: ഞാൻ ഒരു പരീശനാണ്
  rationale: വർത്തമാനകാലത്തിലെ നേരിട്ടുള്ള സ്വയംതിരിച്ചറിയൽ കൃത്യമായി നൽകുന്നു.
- source_word: υἱὸς Φαρισαίων
  choice: പരീശന്മാരുടെ മകനാണ്
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും കുടുംബബന്ധത്തിന്റെ രൂപകവും നിലനിർത്തി, മാതാപിതാക്കളെയോ വംശപരമ്പരയെയോ മാത്രം നിർണ്ണയിക്കുന്നില്ല.
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: മരിച്ചവരുടെ പ്രത്യാശയെയും പുനരുത്ഥാനത്തെയും കുറിച്ച്
  rationale: ἐλπίδος, ἀναστάσεως എന്നീ സംയോജിത നാമങ്ങൾ വേർതിരിച്ചു നിലനിർത്തുന്നു; അവയെ ‘പുനരുത്ഥാനത്തിന്റെ പ്രത്യാശ’ എന്ന ഒറ്റ ആശയമായി നിശ്ശബ്ദമായി ചുരുക്കുന്നില്ല.
- source_word: κρίνομαι
  choice: ഞാൻ വിചാരണ ചെയ്യപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും പൗലോസിന്റെ നിലവിലെ നിയമപരമായ സാഹചര്യവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: υἱὸς Φαρισαίων എന്ന പൗലോസിന്റെ അവകാശവാദത്തിന്റെ അർത്ഥം
  choice: “പരീശന്മാരുടെ മകൻ” എന്ന കുടുംബരൂപകം നിലനിർത്തി.
  alternative: “പരീശരായ മാതാപിതാക്കളുടെ മകൻ” അല്ലെങ്കിൽ “പരീശന്മാരുടെ വംശജൻ.”
  rationale: ബഹുവചന ഗ്രീക്ക് പ്രയോഗം മാതാപിതാക്കളെയോ പൂർവികരെയോ പാർട്ടി പാരമ്പര്യത്തെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠം ഈ സാധ്യതകളിലൊന്ന് മാത്രം ഉറപ്പിക്കുന്നില്ല.
- issue: ‘പ്രത്യാശ’യും ‘മരിച്ചവരുടെ പുനരുത്ഥാനവും’ തമ്മിലുള്ള ബന്ധം
  choice: 'രണ്ടു സംയോജിത ഘടകങ്ങളായി: “മരിച്ചവരുടെ പ്രത്യാശയെയും പുനരുത്ഥാനത്തെയും കുറിച്ച്.”'
  alternative: “മരിച്ചവരുടെ പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പ്രത്യാശ നിമിത്തം.”
  rationale: ഗ്രീക്ക് καί രണ്ടു നാമങ്ങളെയും സംയോജിപ്പിക്കുന്നു. ഇത് രണ്ടു അടുത്ത ആശയങ്ങളായോ പുനരുത്ഥാനത്തിൽ കേന്ദ്രീകരിച്ച ഒരൊറ്റ പ്രത്യാശയായോ വായിക്കാം; മുഖ്യപാഠം വ്യാകരണപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. നിയമസഭാ പശ്ചാത്തലത്തിന് ‘ന്യായാധിപസഭ’, നിയമനടപടിക്ക് ‘വിചാരണ ചെയ്യപ്പെടുന്നു’ എന്നിവ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ യഥാർഥ ആശയദ്വയാർത്ഥങ്ങൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
