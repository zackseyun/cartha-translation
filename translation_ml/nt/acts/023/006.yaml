  revised_text: 'എന്നാൽ, ഒരു വിഭാഗം സദൂക്യരും മറ്റേ വിഭാഗം പരീശന്മാരുമാണെന്ന് പൗലോസ് മനസ്സിലാക്കിയപ്പോൾ, ന്യായാധിപസഭയിൽ[a] ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു: “സഹോദരന്മാരേ, ഞാൻ ഒരു പരീശനാണ്, പരീശന്മാരുടെ മകനാണ്[b]. പ്രത്യാശയെയും മരിച്ചവരുടെ പുനരുത്ഥാനത്തെയും കുറിച്ചാണ് ഞാൻ വിചാരണ ചെയ്യപ്പെടുന്നത്[c].”'
