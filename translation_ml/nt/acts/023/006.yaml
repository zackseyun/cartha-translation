  source_fidelity: പ്രധാന ആശയം ഗ്രീക്ക് പാഠത്തോട് വിശ്വസ്തമാണ്. എന്നാൽ മുഖ്യപാഠത്തിലെ “മരിച്ചവരുടെ പ്രത്യാശയെയും പുനരുത്ഥാനത്തെയും” എന്ന പദക്രമം ‘മരിച്ചവരുടെ’ എന്നത് പ്രത്യാശയെയും പുനരുത്ഥാനത്തെയും ഒരുപോലെ വിശേഷിപ്പിക്കുന്നതായി വായിക്കപ്പെടാം. ഗ്രീക്കിൽ νεκρῶν നേരിട്ട് ἀναστάσεως-നോടാണ് ചേരുന്നത്; അതിനാൽ പദക്രമം തിരുത്തണം.
  naturalness: ഭാഷ ആധുനികവും മാന്യവുമാണ്. “ന്യായാധിപസഭയിൽ,” “ഉച്ചത്തിൽ വിളിച്ചുപറഞ്ഞു,” “വിചാരണ ചെയ്യപ്പെടുന്നു” എന്നിവ സന്ദർഭോചിതമാണ്. “പരീശന്മാരുടെ മകൻ” എന്നത് അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ ഉദ്ദേശപൂർവമായ കുടുംബപ്രയോഗവും അതിന്റെ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
  terminology: സദൂക്യർ, പരീശന്മാർ, സൻഹെദ്രിൻ, പുനരുത്ഥാനം എന്നീ പ്രയോഗങ്ങൾ യോജിച്ചവയാണ്. ‘പ്രത്യാശ’യും ‘മരിച്ചവരുടെ പുനരുത്ഥാനവും’ എന്ന ക്രമം രണ്ട് ഗ്രീക്ക് നാമങ്ങളെ വേർതിരിച്ചും νεκρῶν-ന്റെ സ്വാഭാവിക ബന്ധം കാത്തും നിൽക്കുന്നു.
