id: ACT.23.9
reference: Acts 23:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: ml
  text: 'അപ്പോൾ വലിയൊരു ബഹളം ഉണ്ടായി. പരീശന്മാരുടെ കക്ഷിയിൽപ്പെട്ട ചില ശാസ്ത്രിമാർ എഴുന്നേറ്റുനിന്ന് ശക്തമായി വാദിച്ചു: “ഈ മനുഷ്യനിൽ ഒരു കുറ്റവും ഞങ്ങൾ കാണുന്നില്ല. എന്നാൽ ഒരു ആത്മാവോ[a] ദൂതനോ അവനോടു സംസാരിച്ചിട്ടുണ്ടെങ്കിൽ—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ആത്മാവ്” എന്നത് പൊതുവായി ഒരു ആത്മീയജീവിയെ സൂചിപ്പിക്കാം. ചിലർ ഇതിനെ “ദൈവാത്മാവ്” എന്നു മനസ്സിലാക്കുന്നു; എന്നാൽ “ദൂതൻ” എന്നതിനോടൊപ്പം പറയുന്നത് പൊതുവായ അർഥത്തെ കൂടുതൽ അനുകൂലിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്ക് പാഠത്തിൽ ഈ വാക്യം പെട്ടെന്ന് അപൂർണമായി അവസാനിക്കുന്നു.
    reason: textual_feature
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: വലിയൊരു ബഹളം
  rationale: κραυγή സൂചിപ്പിക്കുന്ന ഉച്ചത്തിലുള്ള കൂട്ടനിലവിളിയും കലഹശബ്ദവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀναστάντες
  choice: എഴുന്നേറ്റുനിന്ന്
  rationale: സഭയിൽ സംസാരിക്കാൻ എഴുന്നേൽക്കുന്ന ശാരീരിക പ്രവർത്തനവും പ്രസംഗാവകാശം ഏറ്റെടുക്കുന്ന സന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: τινὲς τῶν γραμματέων
  choice: ചില ശാസ്ത്രിമാർ
  rationale: യഹൂദമതനിയമത്തിൽ പ്രാവീണ്യമുള്ള γραμματεῖς എന്ന വിഭാഗത്തിനുള്ള പരിചിതവും സംക്ഷിപ്തവുമായ മലയാളപദമാണ് ‘ശാസ്ത്രിമാർ’.
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: പരീശന്മാരുടെ കക്ഷിയിൽപ്പെട്ട
  rationale: μέρος ഇവിടെ ന്യായാധിപസമിതിക്കുള്ളിലെ വിഭാഗത്തെയോ കക്ഷിയെയോ സൂചിപ്പിക്കുന്നു; ‘കക്ഷിയിൽപ്പെട്ട’ അവരുടെ പക്ഷബന്ധം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: διεμάχοντο
  choice: ശക്തമായി വാദിച്ചു
  rationale: ക്രിയയുടെ ശക്തമായ തർക്കഭാവവും അപൂർണ്ണഭൂതകാലത്തിലെ തുടരുന്ന പ്രവർത്തനവും വായനാസൗകര്യത്തോടെ പ്രകടമാക്കുന്നു.
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: ഒരു കുറ്റവും ഞങ്ങൾ കാണുന്നില്ല
  rationale: ന്യായവിചാരണാസന്ദർഭത്തിൽ κακόν കുറ്റകരമോ ആക്ഷേപാർഹമോ ആയ കാര്യം എന്ന അർഥം നൽകുന്നു; ‘കുറ്റം’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: ഈ മനുഷ്യനിൽ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ഘടനയും പൗലൊസിനെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശവും സംരക്ഷിക്കുന്നു.
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: δὲ യുടെ വിരുദ്ധഭാവവും εἰ യുടെ നിബന്ധനാഭാവവും നിലനിർത്തി, പൂർത്തിയാകാതെ മുറിയുന്ന ഗ്രീക്ക് വാക്യം അനാവശ്യമായി പൂർത്തീകരിക്കാതിരിക്കുന്നു.
- source_word: πνεῦμα
  choice: ഒരു ആത്മാവ്
  rationale: ἄγγελος എന്നതിനോടൊപ്പം പറയപ്പെടുന്നതിനാൽ ഇവിടെ പൊതുവായ ഒരു ആത്മീയജീവി എന്ന അർഥമാണ് കൂടുതൽ സ്വാഭാവികം; എങ്കിലും പദത്തിന്റെ സാധ്യതാപരമായ ദൈവാത്മസൂചന അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: ἐλάλησεν αὐτῷ
  choice: അവനോടു സംസാരിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: സംഭവിച്ചിരിക്കാവുന്ന ഒരു പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിലെ പൂർണ്ണക്രിയാരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄγγελος
  choice: ദൂതൻ
  rationale: ഈ അതീന്ദ്രിയസന്ദർഭത്തിൽ ἄγγελος മനുഷ്യസന്ദേശവാഹകനെയല്ല, ദൈവദൂതനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾഭാഷയിൽ ‘ദൂതൻ’ വ്യക്തവും പരിചിതവുമാണ്.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ അർഥം
  choice: ഒരു ആത്മാവ്—പൊതുവായി ഒരു ആത്മീയജീവി
  alternative: ദൈവാത്മാവ്
  rationale: ‘ആത്മാവോ ദൂതനോ’ എന്ന കൂട്ടുപറച്ചിൽ പരീശന്മാർ അംഗീകരിച്ചിരുന്ന ആത്മീയജീവികളുടെ വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. എങ്കിലും പദം സ്വതവേ അനുവദിക്കുന്ന കൂടുതൽ നിർദിഷ്ടമായ വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി, വാചകത്തിലെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- issue: അവസാന നിബന്ധനാവാക്യത്തിന്റെ അപൂർണത
  choice: ദീർഘവരയോടെ വാക്യം അപൂർണമായി നിലനിർത്തുന്നു
  alternative: ‘എങ്കിൽ എന്ത്?’ എന്നോ സമാനമായോ ചേർത്ത് പൂർണ്ണചോദ്യമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം നിബന്ധനാവാക്യത്തിന്റെ ഫലം പ്രസ്താവിക്കാതെ പെട്ടെന്ന് അവസാനിക്കുന്നു. അതിനാൽ വായനാസൗകര്യത്തിനുവേണ്ടി ആശയം അനുമാനിച്ച് ചേർക്കാതെ മൂലപാഠത്തിലെ ഇടർച്ച സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ സഭാവായനയ്ക്കും പ്രസിദ്ധീകരണത്തിനും യോജിച്ച മാന്യമായ ശൈലി. ‘ശാസ്ത്രിമാർ’, ‘പരീശന്മാർ’, ‘ദൂതൻ’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യമായ വ്യാഖ്യാനപൂരിപ്പിക്കലുകളും ഒഴിവാക്കി.
