source:
  edition: SBLGNT
  text: τῇ δὲ ἐπαύριον ἐάσαντες τοὺς ἱππεῖς ⸀ἀπέρχεσθαι σὺν αὐτῷ ὑπέστρεψαν εἰς τὴν παρεμβολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: ml
  text: എന്നാൽ അടുത്ത ദിവസം, കുതിരപ്പടയാളികളെ അവനോടൊപ്പം യാത്ര തുടരാൻ അനുവദിച്ചശേഷം, അവർ സൈനികത്താവളത്തിലേക്ക്[a] മടങ്ങി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പാളയത്തിലേക്ക്.” ഗ്രീക്ക് പദത്തിന് പാളയം എന്നോ സൈനികർ താമസിക്കുന്ന കേന്ദ്രം എന്നോ അർഥമാകാം; ഇവിടെ യെരൂശലേമിലെ റോമൻ സൈനികത്താവളത്തെയോ കോട്ടയിലെ സൈനികവാസസ്ഥലത്തെയോ ആയിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: എന്നാൽ അടുത്ത ദിവസം
  rationale: τῇ ἐπαύριον എന്ന കാലസൂചകപ്രയോഗം ‘അടുത്ത ദിവസം’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ ആഖ്യാനമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐάσαντες
  choice: അനുവദിച്ചശേഷം
  rationale: ἐάω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള ‘അനുവദിക്കുക’ എന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς ἱππεῖς
  choice: കുതിരപ്പടയാളികളെ
  rationale: ἱππεῖς കുതിരപ്പുറത്തു സഞ്ചരിക്കുന്ന സൈനികരെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമായ പ്രയോഗം.
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: അവനോടൊപ്പം യാത്ര തുടരാൻ
  rationale: ἀπέρχεσθαι ഇവിടെ ‘പോകുക/മുന്നോട്ടുപോകുക’ എന്നും σύν ‘കൂടെ’ എന്നും അർഥമാക്കുന്നു. മറ്റുള്ളവർ മടങ്ങുമ്പോൾ കുതിരപ്പടയാളികൾ പൗലോസിനൊപ്പം യാത്ര തുടരുന്നതാണ് സന്ദർഭം.
- source_word: ὑπέστρεψαν
  choice: മടങ്ങി
  rationale: ὑποστρέφω എന്നതിന്റെ സാധാരണ അർഥമായ ‘തിരികെ പോകുക/മടങ്ങുക’ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകി.
- source_word: εἰς τὴν παρεμβολήν
  choice: സൈനികത്താവളത്തിലേക്ക്
  rationale: παρεμβολή പാളയത്തെയോ സൈനികർ താമസിക്കുന്ന കേന്ദ്രത്തെയോ സൂചിപ്പിക്കാം. യെരൂശലേമിലെ റോമൻ സൈനികസന്ദർഭത്തിൽ ‘സൈനികത്താവളം’ അർഥം വ്യക്തമായി നൽകുകയും പദത്തിന്റെ പരിധി അതിയായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
