translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി ഉപയോഗിച്ചു. സൈനികപദങ്ങൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ നൽകി; ഗ്രീക്കിലെ പാളയം/സൈനികവാസസ്ഥലം എന്ന അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
