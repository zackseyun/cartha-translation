id: ACT.23.8
reference: Acts 23:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: ml
  text: കാരണം, സദൂക്യർ പുനരുത്ഥാനമില്ലെന്നും ദൂതനോ ആത്മാവോ ഇല്ലെന്നും പറയുന്നു; എന്നാൽ പരീശന്മാർ രണ്ടും അംഗീകരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരീശന്മാർ മൂന്നും അംഗീകരിക്കുന്നു”—അതായത്, പുനരുത്ഥാനം, ദൂതൻ, ആത്മാവ്. ഗ്രീക്ക് പാഠത്തിൽ “രണ്ടും” എന്നാണ്; അത് ഏറ്റവും നേരിട്ട് “ദൂതൻ” എന്നും “ആത്മാവ്” എന്നും ഉള്ള ജോടിയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ സന്ദർഭത്തിൽനിന്ന് ചിലർ അതിനെ മൂന്നു കാര്യങ്ങളെയും ഉൾക്കൊള്ളുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: സദൂക്യർ
  rationale: യഹൂദമതവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
- source_word: μὲν γὰρ
  choice: (വാക്യഘടനയിൽ വിശദീകരണബന്ധമായി ഉൾപ്പെടുത്തി)
  rationale: ഈ കണികകൾ മുൻസന്ദർഭത്തിന് വിശദീകരണം നൽകുന്നു; മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്തെന്നാൽ’ ചേർക്കാതെ വാക്യത്തിന്റെ സ്വാഭാവിക ബന്ധത്തിലൂടെ അതിന്റെ ബലം അറിയിച്ചു.
- source_word: λέγουσιν μὴ εἶναι
  choice: ഇല്ല എന്നു പറയുന്നു
  rationale: അസ്തിത്വനിഷേധം പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് infinitival ഘടനയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀνάστασιν
  choice: പുനരുത്ഥാനം
  rationale: വീണ്ടും ഉയിർത്തെഴുന്നേൽക്കൽ എന്ന യാഥാർഥ്യവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ പദം.
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: ദൂതനോ ആത്മാവോ
  rationale: μήτε...μήτε എന്ന പരസ്പരബന്ധിത നിഷേധവും ഏകവചന നാമങ്ങളും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Φαρισαῖοι
  choice: പരീശന്മാർ
  rationale: ഈ യഹൂദമതവിഭാഗത്തിന്റെ പേരിന് മലയാളത്തിൽ സ്ഥാപിതമായ രൂപം.
- source_word: ὁμολογοῦσιν
  choice: അംഗീകരിക്കുന്നു
  rationale: ഇവിടെ ‘സത്യമാണെന്ന് സമ്മതിക്കുക/ഉറപ്പിക്കുക’ എന്ന അർഥമാണ്; ‘ഏറ്റുപറയുന്നു’ എന്നത് അനുതാപപരമായ അർഥം നൽകാനിടയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: τὰ ἀμφότερα
  choice: രണ്ടും
  rationale: ഗ്രീക്കിലെ ‘രണ്ടും’ എന്ന പദപ്രയോഗം നേരിട്ട് നിലനിർത്തി; അതിന്റെ പരിധിയെ മുഖ്യപാഠത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കിയില്ല.
theological_decisions:
- issue: പരീശന്മാർ അംഗീകരിക്കുന്ന ‘രണ്ടും’ എന്നതിന്റെ പരിധി
  choice: ഗ്രീക്കിലെ τὰ ἀμφότερα അനുസരിച്ച് മുഖ്യപാഠത്തിൽ ‘രണ്ടും’ എന്ന് നിലനിർത്തി.
  alternative: ‘പുനരുത്ഥാനം, ദൂതൻ, ആത്മാവ്—ഈ മൂന്നും പരീശന്മാർ അംഗീകരിക്കുന്നു.’
  rationale: ഗ്രീക്ക് പദം അക്ഷരാർഥത്തിൽ ‘രണ്ടും’ എന്നാണ്; ഏറ്റവും അടുത്തുള്ള ‘ദൂതൻ’, ‘ആത്മാവ്’ എന്നീ ജോടിയെയാണ് അത് നേരിട്ട് സൂചിപ്പിക്കുന്നതായി കാണാനാകുന്നത്. എന്നാൽ സന്ദർഭം പുനരുത്ഥാനത്തെയും ഉൾപ്പെടുത്തി മൂന്നു കാര്യങ്ങളെയും ഉദ്ദേശിക്കുന്നതായി ചിലർ ഗ്രഹിക്കുന്നു. ഈ അർഥസന്ദിഗ്ധത മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മതവിഭാഗങ്ങളുടെ സ്ഥാപിത പേരുകളും പരിചിതമായ ‘പുനരുത്ഥാനം’ എന്ന പദവും ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സംഖ്യാത്മക അർഥസന്ദിഗ്ധത ‘രണ്ടും’ എന്ന മുഖ്യപാഠവും [a] അടിക്കുറിപ്പും വഴി സംരക്ഷിച്ചു.
