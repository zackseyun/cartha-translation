translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ വിവരണശൈലി. ഗ്രീക്കിന്റെ അർഥക്രമം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ പദക്രമം ഉപയോഗിച്ചു.
