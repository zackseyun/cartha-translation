  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἦσαν δὲ πλείους τεσσεράκοντα οἱ ταύτην τὴν συνωμοσίαν ⸀ποιησάμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: ml
  text: ഈ ഗൂഢാലോചന നടത്തിയവർ നാൽപ്പതിലധികം പേരുണ്ടായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നാൽപ്പതിൽപ്പരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: നാൽപ്പതിലധികം പേർ
  rationale: താരതമ്യരൂപമായ πλείους സംഖ്യയോടൊപ്പം വരുമ്പോൾ ‘നാൽപ്പതിലധികം’ എന്നാണ് അർഥം. ഗ്രീക്കിൽ വ്യക്തമായ നാമപദമില്ലെങ്കിലും substantival participle സൂചിപ്പിക്കുന്ന ആളുകളെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘പേർ’ ചേർത്തു.
- source_word: συνωμοσίαν
  choice: ഗൂഢാലോചന
  rationale: രഹസ്യമായി ചേർന്നുണ്ടാക്കിയ പദ്ധതി അഥവാ conspiracy എന്ന ഔപചാരിക അർഥം കൃത്യമായി നൽകുന്നു; സമീപസന്ദർഭത്തിലെ ശപഥത്തിന്റെ വിശദാംശം ഈ പദത്തിലേക്ക് അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ποιησάμενοι
  choice: നടത്തിയവർ
  rationale: ποιέωയുടെ aorist middle participle ഇവിടെ συνωμοσίαν എന്ന കർമത്തോടൊപ്പം ഗൂഢാലോചന ഉണ്ടാക്കുകയോ നടപ്പാക്കുകയോ ചെയ്തവരെ സൂചിപ്പിക്കുന്നു. ‘ഗൂഢാലോചന നടത്തിയവർ’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἦσαν δὲ
  choice: ഉണ്ടായിരുന്നു
  rationale: സംഘത്തിന്റെ അസ്തിത്വവും എണ്ണവും അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ അസ്തിത്വവാക്യമായി നൽകി. δέയുടെ ലഘുവായ ബന്ധകശക്തി വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: ഈ ഗൂഢാലോചന നടത്തിയവർ
  rationale: article സഹിതമുള്ള participle-നെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘നടത്തിയവർ’ എന്ന രൂപത്തിൽ നൽകി; ταύτην എന്നത് ‘ഈ’ ആയി നിലനിർത്തി.
