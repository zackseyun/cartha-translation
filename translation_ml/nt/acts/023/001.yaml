id: ACT.23.1
reference: Acts 23:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: ml
  text: 'പൗലോസ് മഹാസഭയെ ഉറ്റുനോക്കി പറഞ്ഞു: “സഹോദരന്മാരേ, ഈ ദിവസംവരെ ഞാൻ ദൈവസന്നിധിയിൽ തികച്ചും നല്ല മനസ്സാക്ഷിയോടെ ജീവിച്ചിരിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവസന്നിധിയിൽ ഞാൻ ഒരു പൗരനെപ്പോലെ ജീവിതം നയിച്ചിരിക്കുന്നു”; ഗ്രീക്ക് ക്രിയയ്ക്ക് പൗരജീവിതത്തിന്റെ ഒരു സൂചന ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: സൂക്ഷിച്ചുനോക്കിക്കൊണ്ട്
  rationale: ദൃഷ്ടി ഉറപ്പിച്ച് ശ്രദ്ധയോടെ നോക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന കൃതന്തത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ആഖ്യാനബന്ധകമാണ്; മലയാളത്തിലെ വാക്യക്രമം തന്നെയാണ് മുന്നോട്ടുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നത്.
- source_word: τῷ συνεδρίῳ
  choice: ന്യായാധിപസഭയെ
  rationale: ഈ സന്ദർഭത്തിലെ യഹൂദ ഭരണ-ന്യായസഭയെ സൂചിപ്പിക്കുന്നു; ‘സൻഹെദ്രിൻ’ എന്ന ലിപ്യന്തരണത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് അർഥം സുതാര്യമാണ്.
- source_word: Ἄνδρες ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷന്മാരടങ്ങിയ സഭയോടുള്ള പരമ്പരാഗത സംബോധനയെ സ്വാഭാവികവും ലിംഗസൂചന നിലനിർത്തുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: പൂർണമായും നല്ല മനസ്സാക്ഷിയോടെ
  rationale: πάσῃ എന്ന സമഗ്രതാബോധവും συνειδήσει ἀγαθῇ എന്ന രീതിസൂചക പ്രയോഗവും മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: πεπολίτευμαι
  choice: ജീവിച്ചിരിക്കുന്നു
  rationale: ജീവിതം നയിച്ച രീതി സൂചിപ്പിക്കുന്ന സമ്പൂർണകാലത്തിന്റെ ഭൂതകാലം മുതൽ ഇപ്പോൾവരെയുള്ള പ്രാബല്യം നിലനിർത്തുന്നു; ക്രിയയിലെ പൗരജീവിതസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തോടുള്ള ബന്ധത്തിലും ദൈവത്തിന്റെ ദൃഷ്ടിക്കുമുമ്പിലും നയിച്ച ജീവിതം എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: ഇന്നുവരെയും
  rationale: ഭൂതകാലം മുതൽ പ്രസ്തുത ദിവസംവരെയുള്ള തുടർച്ച സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: πεπολίτευμαι എന്ന പദത്തിലെ പൗരജീവിതസൂചനയും പൗലോസിന്റെ നൈതിക അവകാശവാദവും
  choice: പ്രധാനപാഠത്തിൽ പൊതുവായ ജീവിതനടത്തമായി ‘ജീവിച്ചിരിക്കുന്നു’ എന്നു നൽകി, പൗരനെന്ന നിലയിലെ പെരുമാറ്റം എന്ന സൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: ‘ദൈവസന്നിധിയിൽ ഒരു പൗരനെന്നപോലെ ഞാൻ പെരുമാറിയിരിക്കുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ പരിഭാഷ.
  rationale: സന്ദർഭത്തിൽ ക്രിയ ജീവിതനടത്തത്തെ വിശാലമായി സൂചിപ്പിക്കുന്നു; പൗരത്വത്തിന്റെ സാങ്കേതിക അവകാശവാദമോ പാപരഹിതമായ പൂർണതയുടെ പ്രസ്താവനയോ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ ഗ്രീക്കിലെ സാധ്യതയുള്ള പൗരസൂചന സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ന്യായാധിപസഭ’ സന്ദർഭത്തിലെ യഹൂദ ഭരണ-ന്യായസമിതിയെ സുതാര്യമാക്കുന്നു; ‘പൂർണമായും നല്ല മനസ്സാക്ഷി’ എന്നത് പൗലോസിന്റെ ശക്തമായ പ്രസ്താവന മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
