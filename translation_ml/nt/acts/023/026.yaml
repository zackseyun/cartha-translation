    reason: lexical_alternative
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: ക്ലൗദ്യൊസ് ലുസിയാസ്
  rationale: ഗ്രീക്ക് പാഠത്തിലെ വ്യക്തിനാമങ്ങൾ അവയുടെ ഗ്രീക്ക് രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: τῷ κρατίστῳ
  choice: അത്യുത്തമനായ
  rationale: κρατίστῳ ഔദ്യോഗിക കത്തിടപാടിൽ ബഹുമാനം സൂചിപ്പിക്കുന്ന അതിശയോക്തിരൂപത്തിലുള്ള അഭിസംബോധനയാണ്; ‘അത്യുത്തമനായ’ അതിന്റെ ഔപചാരിക ഭാവവും ബഹുമാനവും നിലനിർത്തുന്നു.
- source_word: ἡγεμόνι
  choice: ഗവർണർ
  rationale: റോമൻ പ്രവിശ്യാഭരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ഭരണാധികാരിയെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സാധാരണമായ പദം.
- source_word: Φήλικι
  choice: ഫേലിക്സ്
  rationale: ഗ്രീക്ക് പാഠത്തിലെ വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: χαίρειν
  choice: അഭിവാദ്യങ്ങൾ
  rationale: കത്തിന്റെ ആരംഭത്തിൽ χαίρειν പതിവായ അഭിവാദനസൂത്രമാണ്; ഇവിടെ അതിനെ ‘സന്തോഷിക്കുക’ എന്നു പദാനുപദമായി വിവർത്തനം ചെയ്യാതെ കത്തുശൈലിയിലെ അർത്ഥം നൽകി.
theological_decisions: []
