  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: ml
  text: ക്ലൗദ്യൊസ് ലുസിയാസ്, ഏറ്റവും മാന്യനായ[a] ഗവർണർ ഫേലിക്സിന്, അഭിവാദ്യങ്ങൾ.
