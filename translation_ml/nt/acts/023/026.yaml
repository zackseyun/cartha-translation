  register: റോമൻ ഉദ്യോഗസ്ഥന്റെ ഔദ്യോഗിക കത്തിന്റെ ആരംഭത്തിന് യോജിച്ച സംക്ഷിപ്തവും മാന്യവുമായ ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചു. പാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനുശേഷം ചേർത്തു.
