id: ACT.23.31
reference: Acts 23:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: ml
  text: അങ്ങനെ സൈനികർ, അവരോടു കൽപ്പിച്ചിരുന്നതുപോലെ[a], പൗലോസിനെ കൂടെക്കൂട്ടി രാത്രിയിൽ[b] അന്തിപത്രിസിലേക്കു കൊണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർക്കു നൽകിയ നിർദേശപ്രകാരം.”
    reason: lexical_alternative
  - marker: b
    text: മൂലഭാഷയിലെ പ്രയോഗം “രാത്രിസമയത്ത്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: അങ്ങനെ സൈനികർ
  rationale: οὖν സൂചിപ്പിക്കുന്ന കഥയുടെ തുടർച്ചയും മുൻനടപടിയുടെ ഫലവും ‘അങ്ങനെ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു. μέν ഇവിടെ അടുത്ത വാക്യഘടകത്തോടുള്ള വ്യവഹാരബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: തങ്ങളോടു കല്പിച്ചിരുന്നതനുസരിച്ച്
  rationale: διατάσσω എന്ന ക്രിയയുടെ perfect passive participle മുൻപ് അവർക്കു നൽകിയ കല്പനയെ സൂചിപ്പിക്കുന്നു. തിരഞ്ഞെടുക്കപ്പെട്ട പ്രയോഗം ആ കർമണിഭാവവും മുൻകാലപ്രസക്തിയും നിലനിർത്തുന്നു.
- source_word: ἀναλαβόντες
  choice: പൗലോസിനെ കൂടെക്കൂട്ടി
  rationale: മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള അനുബന്ധപ്രവൃത്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘കാവലോടെ കൊണ്ടുപോയി’ എന്നതുപോലെ മൂലത്തിൽ വ്യക്തമല്ലാത്ത ആശയം ചേർക്കുന്നില്ല.
- source_word: ἤγαγον
  choice: കൊണ്ടുപോയി
  rationale: ἄγω എന്നതിന് സന്ദർഭത്തിൽ ‘നയിച്ചു/കൊണ്ടുപോയി’ എന്ന അർഥമുണ്ട്. യാത്രയുടെ ലക്ഷ്യസ്ഥാനം പറയുന്നതിനാൽ ‘അന്തിപത്രിസിലേക്കു കൊണ്ടുപോയി’ സ്വാഭാവികമാണ്.
- source_word: διὰ νυκτός
  choice: രാത്രിയിൽ
  rationale: διά + genitive ഇവിടെ രാത്രിസമയത്ത് നടന്ന യാത്രയെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. യാത്ര രാത്രി മുഴുവൻ നീണ്ടുവെന്ന് നിർബന്ധമായി സൂചിപ്പിക്കാതെ ‘രാത്രിയിൽ’ സമയം കൃത്യമായി അറിയിക്കുന്നു.
- source_word: Ἀντιπατρίδα
  choice: അന്തിപത്രിസ്
  rationale: ഗ്രീക്ക് സ്ഥലനാമം മലയാളലിപിയിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരം ചെയ്തു; വിഭക്തിസംബന്ധത്തിന് ‘അന്തിപത്രിസിലേക്കു’ എന്നു ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ കഥനശൈലി ഉപയോഗിച്ചു. ‘സൈനികർ’, ‘കല്പിച്ചിരുന്നത്’, ‘കൂടെക്കൂട്ടി’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലവാക്യത്തിന്റെ ഘടനയോടും അർഥത്തോടും വിശ്വസ്തവുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
