id: ACT.23.10
reference: Acts 23:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: ml
  text: കലഹം രൂക്ഷമായപ്പോൾ[a], അവർ പൗലോസിനെ വലിച്ചുകീറിക്കളയുമോ എന്നു ഭയന്ന സൈന്യാധിപൻ, സൈനികർ ഇറങ്ങിച്ചെന്ന് ആ കൂട്ടത്തിന്റെ നടുവിൽനിന്ന് അവനെ ബലമായി പിടിച്ചെടുത്ത് സൈനികത്താവളത്തിലേക്ക് കൊണ്ടുപോകാൻ കല്പിച്ചു.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കലഹം” എന്നതിന് “ഭിന്നത” എന്നോ “ബഹളം” എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ στάσις എന്ന പദം കടുത്ത ആഭ്യന്തരസംഘർഷത്തെയും ചില സന്ദർഭങ്ങളിൽ ലഹളയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വലിച്ചുകീറിക്കളയുക” എന്നതിന് “വലിച്ചുകീറുക” അല്ലെങ്കിൽ “കഷണങ്ങളാക്കുക” എന്നും പറയാം. ഗ്രീക്കിലെ διασπασθῇ പദം ബലമായി കീറിപ്പിളർക്കുന്നതിന്റെ ശക്തമായ ദൃശ്യം നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: “സൈനികത്താവളം” എന്നു പരിഭാഷപ്പെടുത്തിയ παρεμβολή കൂടുതൽ അക്ഷരാർഥത്തിൽ “പാളയം” എന്നും അർഥമാക്കാം; ഇവിടെ അത് യെരൂശലേമിലെ റോമൻ സൈനികരുടെ താമസസ്ഥലത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: കലഹം രൂക്ഷമായപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സാഹചര്യകാലവാക്യമായി പരിഭാഷപ്പെടുത്തി. στάσις ഇവിടെ സഭയ്ക്കുള്ളിലെ കടുത്ത സംഘർഷത്തെ സൂചിപ്പിക്കുന്നു; ‘കലഹം’ അതിന്റെ തർക്കവും അക്രമസാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നു. πολλῆς എന്ന തീവ്രത ‘രൂക്ഷമായപ്പോൾ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: φοβηθεὶς
  choice: ഭയന്ന
  rationale: തുടർന്നുള്ള കല്പനയ്ക്കുള്ള സൈന്യാധിപന്റെ പ്രേരണ വ്യക്തമാക്കുന്ന കാരണസൂചക കൃതന്തമായി നൽകി.
- source_word: ὁ χιλίαρχος
  choice: സൈന്യാധിപൻ
  rationale: റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായി മനസ്സിലാകുന്ന പദംകൊണ്ട് അവതരിപ്പിക്കുന്നു; അപരിചിതമായ സ്ഥാനപ്പേര് ലിപ്യന്തരണം ചെയ്യുന്നില്ല.
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: അവർ പൗലോസിനെ വലിച്ചുകീറിക്കളയുമോ എന്നു
  rationale: μήയോടുകൂടിയ സബ്ജങ്‌ടീവ് ഭയപ്പെട്ട സാധ്യതയായി നിലനിർത്തുന്നു. διασπάωയുടെ ഉജ്ജ്വലവും അക്രമാസക്തവുമായ ദൃശ്യബലം ‘വലിച്ചുകീറിക്കളയുക’ സംരക്ഷിക്കുന്നു.
- source_word: ἐκέλευσεν
  choice: കല്പിച്ചു
  rationale: സൈനികസന്ദർഭത്തിലെ അധികാരപൂർവമായ ഉത്തരവിനെ നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: τὸ στράτευμα
  choice: സൈനികർ
  rationale: കൂട്ടായ സൈനികസംഘത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദം സ്വാഭാവിക മലയാളത്തിലെ ബഹുവചന കർത്താവായി നൽകി.
- source_word: καταβὰν
  choice: ഇറങ്ങിച്ചെന്ന്
  rationale: മുകളിലുള്ള കോട്ടപ്രദേശത്തുനിന്ന് താഴെയുള്ള സഭാസ്ഥലത്തേക്കുള്ള ചലനം സംരക്ഷിക്കുകയും തുടർന്നുള്ള പ്രവൃത്തികളുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: അവരുടെ നടുവിൽനിന്ന് അവനെ ബലമായി പിടിച്ചെടുത്ത്
  rationale: ἁρπάζωയുടെ പെട്ടെന്നുള്ള ബലപ്രയോഗത്തോടെയുള്ള നീക്കൽ ‘ബലമായി പിടിച്ചെടുത്ത്’ വഴി വ്യക്തമാക്കുന്നു; ἐκ μέσου αὐτῶν എന്നത് ‘അവരുടെ നടുവിൽനിന്ന്’ എന്നു നിലനിർത്തുന്നു.
- source_word: ἄγειν τε
  choice: കൊണ്ടുപോകാൻ
  rationale: ലക്ഷ്യസ്ഥാനത്തേക്ക് സൈനികർ പൗലോസിനെ കൂട്ടിക്കൊണ്ടുപോകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: παρεμβολήν
  choice: പാളയം
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം സംരക്ഷിക്കുന്നു; ഈ സന്ദർഭത്തിൽ അത് യെരൂശലേമിലെ റോമൻ സൈനികരുടെ താമസസ്ഥലമാണെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ഗ്രീക്കിലെ ദീർഘവാക്യത്തിന്റെ പ്രവാഹം സംരക്ഷിച്ചെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമായ കൃതന്തശൃംഖല ഉപയോഗിച്ചു. അക്രമസാധ്യതയെ മൃദൂകരിക്കാതെ ‘വലിച്ചുകീറിക്കളയുമോ’ എന്നു നൽകിയിരിക്കുന്നു.
