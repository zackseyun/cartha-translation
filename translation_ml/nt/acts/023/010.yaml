revisions:
- from: കലഹം രൂക്ഷമായപ്പോൾ[a], അവർ പൗലോസിനെ വലിച്ചുകീറിക്കളയുമോ എന്നു ഭയന്ന സൈന്യാധിപൻ, സൈനികർ ഇറങ്ങിച്ചെന്ന് അവരുടെ നടുവിൽനിന്ന് അവനെ ബലമായി പിടിച്ചെടുത്ത് പാളയത്തിലേക്കു കൊണ്ടുപോകാൻ കല്പിച്ചു.[b]
  to: കലഹം രൂക്ഷമായപ്പോൾ[a], അവർ പൗലോസിനെ വലിച്ചുകീറിക്കളയുമോ എന്നു ഭയന്ന സൈന്യാധിപൻ, സൈനികർ ഇറങ്ങിച്ചെന്ന് ആ കൂട്ടത്തിന്റെ നടുവിൽനിന്ന് അവനെ ബലമായി പിടിച്ചെടുത്ത് സൈനികത്താവളത്തിലേക്ക് കൊണ്ടുപോകാൻ കല്പിച്ചു.[b][c]
  rationale: The revision retains the draft’s faithful treatment of the Greek syntax and force, while clarifying the referent of «അവരുടെ» and using a contextually precise Malayalam term for the Roman military quarters. Footnotes now cover both the στάσις and διασπασθῇ lexical alternatives and retain the cultural explanation of παρεμβολή.
  reviewer_model: gpt-5.6-terra
