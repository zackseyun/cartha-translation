reference: Acts 23:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν εὗρον ἐγκαλούμενον περὶ ζητημάτων τοῦ νόμου αὐτῶν, μηδὲν ⸀δὲ ἄξιον θανάτου ἢ δεσμῶν ⸂ἔχοντα ἔγκλημα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/029.yaml
  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: ml
  text: അവരുടെ നിയമവുമായി ബന്ധപ്പെട്ട ചോദ്യങ്ങളെക്കുറിച്ച്[a] അവനെ കുറ്റം ചുമത്തിയിരുന്നതായും, എന്നാൽ മരണത്തിനോ തടവിനോ[b] അർഹമായ ഒരു കുറ്റാരോപണവും അവന്റെമേൽ ഉണ്ടായിരുന്നില്ലെന്നും ഞാൻ കണ്ടെത്തി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവരുടെ നിയമവുമായി ബന്ധപ്പെട്ട തർക്കവിഷയങ്ങളെക്കുറിച്ച്.’
    reason: ζητήματα എന്ന പദത്തിന് ‘ചോദ്യങ്ങൾ’ എന്നതിനൊപ്പം ‘തർക്കത്തിലിരിക്കുന്ന വിഷയങ്ങൾ’ എന്നും അർഥമാകാം.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ചങ്ങലകൾക്കോ.’
    reason: δεσμῶν എന്ന പദത്തിന്റെ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു; ഈ നിയമസന്ദർഭത്തിൽ അത് തടവിനെയോ ബന്ധനത്തെയോ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: ἐγκαλούμενον
  choice: കുറ്റാരോപണം നേരിട്ടിരുന്നത്
  rationale: നിഷ്ക്രിയ വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടർന്നുകൊണ്ടിരുന്ന കുറ്റാരോപണഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; കുറ്റം തെളിഞ്ഞുവെന്ന് സൂചിപ്പിക്കുന്നില്ല.
- source_word: περὶ ζητημάτων
  choice: ചോദ്യങ്ങളെക്കുറിച്ച്
  rationale: ζητήματα എന്ന പദത്തിന്റെ ‘ചർച്ചാവിഷയങ്ങളായ ചോദ്യങ്ങൾ’ എന്ന അർഥം ലളിതമായി നൽകുന്നു; അതിലെ തർക്കസ്വഭാവം അടിക്കുറിപ്പിലെ മറ്റൊരു പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ νόμου αὐτῶν
  choice: അവരുടെ നിയമവുമായി ബന്ധപ്പെട്ട
  rationale: റോമൻ സൈനികാധികാരിയുടെ കാഴ്ചപ്പാടിൽ നിന്നുള്ള αὐτῶν എന്ന ഉടമസ്ഥസൂചന നിലനിർത്തുകയും ജനിറ്റീവ് ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: മരണത്തിനോ തടവിനോ അർഹമായ ഒരു കുറ്റവും
  rationale: ἄξιον എന്നതിന്റെ നിയമപരമായ ‘ശിക്ഷ അർഹിക്കുന്ന’ ആശയം നൽകുന്നു; δεσμά എന്നതിന്റെ അക്ഷരാർഥമായ ‘ചങ്ങലകൾ’ സന്ദർഭാനുസൃതമായി ‘തടവ്’ എന്നു പരിഭാഷപ്പെടുത്തി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔχοντα ἔγκλημα
  choice: ഒരു കുറ്റവും അവന്റെമേൽ ഉണ്ടായിരുന്നില്ല
  rationale: അവന്റെമേൽ അത്തരമൊരു കുറ്റച്ചുമത്തൽ ഇല്ലെന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗം വ്യക്തമാക്കുന്നു; കുറ്റവിമുക്തനായി വിധിക്കപ്പെട്ടുവെന്നതിലുപരി ആരോപണത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള നിഗമനമാണ് ഇത്.
- source_word: εὗρον
  choice: ഞാൻ കണ്ടെത്തി
  rationale: അന്വേഷണത്തിനുശേഷമുള്ള സൈനികാധികാരിയുടെ നിഗമനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
