  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഔപചാരികവും വായനാസൗകര്യമുള്ളതുമായ നിയമപരമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ദീർഘവാക്യഘടന നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘എന്നും ... എന്നും’ ഘടന ഉപയോഗിച്ചു.
