id: ACT.23.35
reference: Acts 23:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: ml
  text: “നിന്നെ കുറ്റം ചുമത്തുന്നവരും എത്തുമ്പോൾ ഞാൻ നിന്റെ കേസ് കേൾക്കും,” അദ്ദേഹം പറഞ്ഞു. പിന്നെ ഹെരോദാവിന്റെ പ്രെത്തോറിയത്തിൽ[a] അവനെ കാവലിൽ വയ്ക്കാൻ അദ്ദേഹം ഉത്തരവിട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പ്രെത്തോറിയം എന്നത് റോമൻ ഭരണാധികാരിയുടെ ഔദ്യോഗിക വസതിയെയോ ആസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് കൈസര്യയിലെ ഹെരോദാവിന്റെ കൊട്ടാരമായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: നിന്റെ കേസ് കേൾക്കാം
  rationale: διακούω എന്ന ക്രിയയ്ക്ക് ഒരാളെ പൂർണമായി കേൾക്കുക, അയാളുടെ വാദം വിചാരണാപരമായി കേൾക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘നിന്റെ കേസ് കേൾക്കാം’ എന്ന സ്വാഭാവിക പ്രയോഗം സ്വീകരിച്ചു; ‘പൂർണമായി’ എന്ന് പ്രത്യേകം ചേർക്കാതെ ക്രിയയുടെ സന്ദർഭപരമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: നിന്റെ കുറ്റാരോപകരും വന്നെത്തുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള subjunctive ഭാവിയിലെ നിബന്ധനാപരമായ സമയം സൂചിപ്പിക്കുന്നു; καί ഇവിടെ ‘-ഉം’ എന്ന ഉൾപ്പെടുത്തൽഭാവം നൽകുന്നു. κατήγοροί നിയമസന്ദർഭത്തിലെ കുറ്റാരോപകരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: κελεύσας
  choice: തുടർന്ന് ... ഉത്തരവിട്ടു
  rationale: Aorist participle ആയ κελεύσας കഥനത്തിലെ തുടർന്നുള്ള നടപടിയായി സ്വാഭാവിക മലയാളത്തിൽ finite verb ആയി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: ഹെരോദാവിന്റെ പ്രെത്തോറിയത്തിൽ
  rationale: πραιτώριον റോമൻ ഭരണാധികാരിയുടെ ഔദ്യോഗിക വസതിയോ ആസ്ഥാനമോ സൂചിപ്പിക്കുന്ന ചരിത്ര-ഭരണപരമായ പദമാണ്. അതിന്റെ പ്രത്യേകത നിലനിർത്താൻ ലിപ്യന്തരണം ഉപയോഗിച്ച് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
- source_word: φυλάσσεσθαι αὐτόν
  choice: അവനെ കാവലിൽ സൂക്ഷിക്കാൻ
  rationale: Passive infinitive ഇവിടെ തടങ്കലിലുള്ള തുടർച്ചയായ കാവലിനെയാണ് സൂചിപ്പിക്കുന്നത്. ശിക്ഷാത്മക തടവ് എന്ന അധിക ആശയം ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ നിയമ-കഥനശൈലി സ്വീകരിച്ചു. ‘കേസ്’ എന്ന പൊതുവായി മനസ്സിലാകുന്ന പദം നിയമസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ‘പ്രെത്തോറിയം’ എന്ന പദത്തിനോടു ചേർത്തു.
