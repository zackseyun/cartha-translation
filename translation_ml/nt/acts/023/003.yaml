id: ACT.23.3
reference: Acts 23:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: ml
  text: 'അപ്പോൾ പൗലോസ് അവനോടു പറഞ്ഞു: “ദൈവം നിന്നെ അടിക്കാൻ പോകുന്നു, വെള്ളപൂശിയ ചുവരേ![a] ന്യായപ്രമാണമനുസരിച്ച് എന്നെ വിധിക്കാൻ നീ ഇരിക്കയും, ന്യായപ്രമാണം ലംഘിച്ച് എന്നെ അടിക്കണമെന്ന് കൽപ്പിക്കയും ചെയ്യുന്നുവോ?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം നിന്നെ അടിക്കും.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ദൈവം നിന്നെ അടിക്കാൻ പോകുന്നു” എന്നാണ്; ഇത് പ്രവൃത്തി ആസന്നമാണെന്നതിന് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: ദൈവം നിന്നെ അടിക്കാൻ പോകുന്നു
  rationale: μέλλει + infinitive വരാനിരിക്കുന്നതോ ആസന്നമായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ ആ ഭാവം നിലനിർത്താൻ ‘അടിക്കാൻ പോകുന്നു’ എന്നു നൽകി; τύπτειν എന്നതിന്റെ പ്രഹരാർഥം ‘അടിക്കാൻ’ സംരക്ഷിക്കുന്നു.
- source_word: τοῖχε κεκονιαμένε
  choice: വെള്ളപൂശിയ ചുവരേ
  rationale: പുറമേ വൃത്തിയോ മാന്യതയോ തോന്നിപ്പിക്കുന്നെങ്കിലും ഉള്ളിൽ ദുഷിച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ശക്തമായ രൂപകം. κεκονιαμένε എന്ന perfect participle സൂചിപ്പിക്കുന്ന പൂശപ്പെട്ട അവസ്ഥയും സംബോധനരൂപവും നിലനിർത്തുന്നു.
- source_word: κάθῃ
  choice: നീ അവിടെ ഇരിക്കുകയും
  rationale: ‘ഇരിക്കുക’ എന്ന ദൃശ്യമായ ക്രിയ നിലനിർത്തി ശാസനയുടെ മൂർച്ച സംരക്ഷിക്കുന്നു. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിനും പ്രതിവാദത്തിന്റെ ഊന്നലിനുമായി ‘അവിടെ’ ചേർത്തു.
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: ന്യായപ്രമാണമനുസരിച്ച് എന്നെ വിധിക്കാൻ
  rationale: κατά ഇവിടെ നിയമത്തെ മാനദണ്ഡമായി അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണമനുസരിച്ച്’ എന്നത് നിയമപരവും തിരുവെഴുത്തുസംബന്ധവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: παρανομῶν
  choice: ന്യായപ്രമാണം ലംഘിച്ചുകൊണ്ട്
  rationale: നിയമത്തിന് വിരുദ്ധമായി പ്രവർത്തിക്കുന്നതിനെ വ്യക്തമാക്കുന്നു; മുൻഭാഗത്തെ ‘ന്യായപ്രമാണമനുസരിച്ച്’ എന്ന പ്രയോഗത്തോടുള്ള ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: κελεύεις με τύπτεσθαι
  choice: എന്നെ അടിക്കാൻ കൽപ്പിക്കുകയും
  rationale: κελεύεις എന്ന അധികാരപൂർവമായ ആജ്ഞ ‘കൽപ്പിക്കുക’ എന്നും passive infinitive-ന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്നെ അടിക്കാൻ’ എന്നും നൽകി.
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: അപ്പോൾ പൗലോസ് അവനോടു പറഞ്ഞു
  rationale: വിവരണാത്മകമായ തുടക്കം അധിക വിശദീകരണമില്ലാതെ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവം നിന്നെ അടിക്കാൻ പോകുന്നു’ എന്ന പൗലോസിന്റെ പ്രസ്താവനയുടെ സ്വഭാവം
  choice: ആസന്നമായ ദൈവിക നടപടിയെക്കുറിച്ചുള്ള പ്രഖ്യാപനമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൈവം നിന്നെ അടിക്കട്ടെ’ എന്ന ശാപമോ ആഗ്രഹപ്രകടനമോ ആയി പരിഭാഷപ്പെടുത്തുക
  rationale: μέλλει + infinitive സാധാരണയായി ആസന്നമായ പ്രവൃത്തിയെ പ്രസ്താവിക്കുന്നു; ആഗ്രഹമോ ശാപമോ അല്ല. പൗലോസിന്റെ വാക്കുകളുടെ ധാർമിക യോഗ്യതയെക്കുറിച്ച് വിധി ചേർക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിയമപരമായ വൈരുധ്യം വ്യക്തമാക്കാൻ ‘ന്യായപ്രമാണമനുസരിച്ച് / ന്യായപ്രമാണം ലംഘിച്ചുകൊണ്ട്’ എന്ന സമാന്തര പ്രയോഗം ഉപയോഗിച്ചു; ശാസനയുടെ ശക്തിയും രൂപകത്തിന്റെ മൂർച്ചയും മൃദൂകരിച്ചിട്ടില്ല.
