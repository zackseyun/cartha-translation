  rationale: ഗ്രീക്ക് പദക്രമത്തിലെ ദൈവികപ്രഖ്യാപനത്തിനു പിന്നാലെയുള്ള സംബോധനത്തിന്റെ ക്രമം പുനഃസ്ഥാപിച്ചു. ഉറവിടത്തിലില്ലാത്ത ‘അവിടെ’ ഒഴിവാക്കി. ‘എന്നെ അടിക്കണമെന്ന് കൽപ്പിക്കുക’ എന്നതിലൂടെ τύπτεσθαι-യുടെ passive അർഥവും κελεύεις-ന്റെ ആജ്ഞാർഥവും വ്യക്തമായി സംരക്ഷിച്ചു. അടിക്കുറിപ്പിലെ lexical alternative ആസന്നതയുടെ സൂക്ഷ്മത യഥാവത് നിലനിർത്തുന്നു.
