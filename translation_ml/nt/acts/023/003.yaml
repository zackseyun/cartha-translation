  naturalness: പരിഷ്കരിച്ച വാചകം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമായ നിയമപരമായ പ്രതിവാദരൂപം നിലനിർത്തുന്നു. ‘എന്നെ അടിക്കണമെന്ന് കൽപ്പിക്കുക’ എന്ന പ്രയോഗം ആരെയെങ്കിലും പൗലോസിനെ അടിക്കാൻ ആജ്ഞാപിക്കുന്നു എന്ന അർഥം തെളിയിക്കുന്നു.
