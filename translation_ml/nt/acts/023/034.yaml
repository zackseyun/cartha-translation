id: ACT.23.34
reference: Acts 23:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναγνοὺς ⸀δὲ καὶ ἐπερωτήσας ἐκ ποίας ⸀ἐπαρχείας ἐστὶν καὶ πυθόμενος ὅτι ἀπὸ Κιλικίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: ml
  text: കത്ത് വായിച്ചശേഷം, പൗലോസ് ഏതു പ്രവിശ്യയിൽനിന്നുള്ളവനാണെന്ന് അദ്ദേഹം ചോദിച്ചു; അവൻ കിലിക്യയിൽനിന്നുള്ളവനാണെന്ന് അറിഞ്ഞപ്പോൾ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “കത്ത് വായിച്ചും, അവൻ ഏതു പ്രവിശ്യയിൽനിന്നുള്ളവനാണെന്ന് ചോദിച്ചും, അവൻ കിലിക്യയിൽനിന്നുള്ളവനാണെന്ന് അറിഞ്ഞും,”'
    reason: ഗ്രീക്കിലെ തുടർച്ചയായ കൃദന്തരൂപങ്ങളുടെ ഘടന കാണിക്കുന്ന കൂടുതൽ ഔപചാരികമായ പരിഭാഷ.
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: കത്ത് വായിച്ചശേഷം
  rationale: ἀναγινώσκω എന്ന ക്രിയയുടെ ഭൂതകാല കൃദന്തരൂപമാണിത്. തൊട്ടുമുമ്പ് പരാമർശിച്ച കത്താണ് വായിച്ചതെന്ന സന്ദർഭസൂചന സ്വാഭാവികതയ്ക്കായി വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ ഒരു ബന്ധകമാണ്; മലയാളത്തിലെ വാക്യപ്രവാഹം അതിന്റെ ധർമ്മം മതിയായ വിധത്തിൽ വഹിക്കുന്നു.
- source_word: καὶ ἐπερωτήσας
  choice: അദ്ദേഹം ചോദിച്ചു
  rationale: ἐπερωτάω നേരിട്ടുള്ള ചോദ്യം ഉന്നയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കൃദന്തങ്ങളുടെ നീണ്ട നിര ഒഴിവാക്കി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: ἐκ ποίας ἐπαρχείας ἐστίν
  choice: പൗലോസ് ഏതു പ്രവിശ്യയിൽനിന്നുള്ളവനാണെന്ന്
  rationale: ἐπαρχεία റോമൻ ഭരണപ്രവിശ്യയെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ പരോക്ഷമായി നിൽക്കുന്ന വ്യക്തി സന്ദർഭത്തിൽ പൗലോസായതിനാൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ പേര് ചേർത്തു.
- source_word: πυθόμενος
  choice: അറിഞ്ഞപ്പോൾ
  rationale: πυνθάνομαι അന്വേഷിച്ചറിഞ്ഞതിലൂടെ വിവരം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സംഭവക്രമം സ്വാഭാവികമായി പ്രകടമാക്കാൻ ‘അറിഞ്ഞപ്പോൾ’ എന്നു നൽകി.
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: അവൻ കിലിക്യയിൽനിന്നുള്ളവനാണെന്ന്
  rationale: ἀπό സ്ഥലമൂലമോ ഉത്ഭവസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പൂർണമായ ഉപവാക്യമാകാൻ ആവശ്യമായ ഘടകങ്ങൾ സന്ദർഭത്തിൽനിന്ന് ചേർത്തു.
- source_word: Κιλικίας
  choice: കിലിക്യ
  rationale: റോമൻ പ്രവിശ്യയുടെ പേരിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണം ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം അർധവിരാമവും കോമയും നിലനിർത്തി.
