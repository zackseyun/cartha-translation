  edition: SBLGNT
  text: βουλόμενός ⸀τε ⸀ἐπιγνῶναι τὴν αἰτίαν δι’ ἣν ἐνεκάλουν αὐτῷ, ⸀κατήγαγον εἰς τὸ συνέδριον αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/028.yaml
  text: And wanting to know the charge for which they were accusing him[a], I brought him down to their council.
translation:
  language: ml
  text: അവനെതിരെ അവർ ഉന്നയിച്ച കുറ്റമെന്താണെന്ന് അറിയാൻ ആഗ്രഹിച്ച്, ഞാൻ അവനെ അവരുടെ ന്യായസഭയിലേക്കു താഴേക്കു കൊണ്ടുപോയി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരുടെ സൻഹെദ്രിനിലേക്കു.” ഗ്രീക്കിലെ συνέδριον എന്ന പദം ഒരു സഭയെയോ സമിതിയെയോ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് യെരൂശലേമിലെ യെഹൂദ ഭരണസഭയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός
  choice: ആഗ്രഹിച്ച്
  rationale: ലൂസിയാസിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന കൃദന്തരൂപത്തിന്റെ ഇച്ഛാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τε
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: τέ ഇവിടെ മുൻവാക്യത്തോടുള്ള മൃദുവായ ബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ കൃദന്തഘടന തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐπιγνῶναι
  choice: അറിയാൻ
  rationale: കുറ്റാരോപണത്തിന്റെ അടിസ്ഥാനം മനസ്സിലാക്കുക എന്ന സന്ദർഭോചിത അർഥം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: τὴν αἰτίαν
  choice: കുറ്റം
  rationale: നിയമപരമായ ഈ സന്ദർഭത്തിൽ αἰτία പൊതുവായ ‘കാരണം’ എന്നതിലുപരി ചുമത്തപ്പെട്ട കുറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: δι’ ἣν ἐνεκάλουν αὐτῷ
  choice: അവർ അവനെതിരെ ഉന്നയിച്ച ... എന്താണെന്ന്
  rationale: ἐγκαλέω എന്നതിന്റെ നിയമപരമായ ‘ഒരാൾക്കെതിരെ കുറ്റം ഉന്നയിക്കുക’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടരുന്ന ആരോപണഭാവം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: κατήγαγον
  choice: കൊണ്ടുപോയി
  rationale: ഗ്രീക്കിലെ താഴോട്ടുള്ള ചലനസൂചന മലയാളത്തിൽ ‘താഴേക്ക് കൊണ്ടുപോയി’ എന്നു നിർബന്ധമായി പറഞ്ഞാൽ ലക്ഷ്യഭാഷയിൽ അസ്വാഭാവികമാകാം; പ്രധാനമായ ‘അവിടേക്കു കൊണ്ടുപോകുക’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: συνέδριον
  choice: ന്യായാധിപസഭ
  rationale: ഇവിടെ യെഹൂദരുടെ ഭരണ-ന്യായ സമിതിയെ സൂചിപ്പിക്കുന്ന ‘council’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; ‘സൻഹെദ്രിൻ’ എന്ന പരമ്പരാഗത നാമം മുഖ്യപാഠത്തിൽ നിർബന്ധമാക്കുന്നില്ല.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: പരാമർശിക്കപ്പെട്ട കുറ്റാരോപകരുടെയോ അവരുടെ ജനസമൂഹത്തിന്റെയോ സഭയാണെന്ന ഗ്രീക്ക് സർവനാമത്തിന്റെ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
