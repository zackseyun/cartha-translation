id: ACT.23.16
reference: Acts 23:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: ml
  text: എന്നാൽ പൗലോസിന്റെ സഹോദരിയുടെ മകൻ[a] പതിയിരിപ്പിനെക്കുറിച്ച്[b] കേട്ടപ്പോൾ, അവൻ വന്ന് പാളയത്തിനകത്ത്[c] കടന്ന് പൗലോസിനെ വിവരം അറിയിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, പൗലോസിന്റെ അനന്തരവൻ.
    reason: lexical_alternative
  - marker: b
    text: ‘ഗൂഢാലോചനയെക്കുറിച്ച്’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കുപദം കൂടുതൽ കൃത്യമായി പതിയിരുന്നുള്ള ആക്രമണത്തെയോ അതിനായുള്ള പതിയിരിപ്പിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘സൈനികപ്പാളയത്തിനകത്ത്’ അഥവാ ‘ബാരക്കിനകത്ത്.’ ഈ സന്ദർഭത്തിൽ റോമൻ സൈനികരുടെ താമസ-കാവൽകേന്ദ്രമാണ് ഉദ്ദേശിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: കേട്ടപ്പോൾ
  rationale: ἀκούω എന്ന ക്രിയയുടെ ഭൂതകാല ക്രിയാവിശേഷണരൂപം മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘കേട്ടപ്പോൾ’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ കാലബന്ധം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: 'δέ ഇവിടെ കഥയിലെ വഴിത്തിരിവും നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു: ഗൂഢാലോചന ആസൂത്രണം ചെയ്തെങ്കിലും അതു കണ്ടെത്തപ്പെട്ടു.'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: പൗലോസിന്റെ സഹോദരിയുടെ മകൻ
  rationale: ഗ്രീക്കിലെ ബന്ധവിവരണം നേരിട്ട് നിലനിർത്തുന്നു; ‘മരുമകൻ’ പോലുള്ള മലയാളപദങ്ങൾക്ക് ഉണ്ടാകാവുന്ന ബന്ധപരമായ അവ്യക്തത ഒഴിവാക്കുന്നു.
- source_word: τὴν ἐνέδραν
  choice: പതിയിരിപ്പിനെക്കുറിച്ച്
  rationale: ἐνέδραയുടെ മുഖ്യ അർഥം പതിയിരുന്നുള്ള ആക്രമണമോ അതിനായുള്ള പതിയിരിപ്പോ ആണ്. കേൾക്കുക എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിനായി ‘-നെക്കുറിച്ച്’ ചേർത്തിരിക്കുന്നു.
- source_word: παραγενόμενος
  choice: വന്ന്
  rationale: സ്ഥലത്തെത്തിയതിനു പിന്നാലെ പ്രവേശിച്ചതെന്ന ക്രമം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰσελθὼν εἰς τὴν παρεμβολὴν
  choice: പാളയത്തിനകത്ത് കടന്ന്
  rationale: παρεμβολήയ്ക്ക് ‘പാളയം’ എന്നും ‘സൈനികപ്പാളയം/ബാരക്ക്’ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ വിശാലമായ പദം ഉപയോഗിച്ച് സന്ദർഭപരമായ പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπήγγειλεν
  choice: വിവരം അറിയിച്ചു
  rationale: ἀπαγγέλλω കണ്ടെത്തിയ വിവരം എത്തിച്ചറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗമാണിത്.
- source_word: τῷ Παύλῳ
  choice: പൗലോസിനെ
  rationale: മലയാളത്തിൽ ‘അറിയിക്കുക’ എന്ന ക്രിയയുടെ സ്വാഭാവിക കർമഘടന അനുസരിച്ച് സ്വീകർത്താവിനെ ‘പൗലോസിനെ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള കഥനശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ തുടർച്ചയായ ക്രിയാവിശേഷണരൂപങ്ങൾ ‘കേട്ടപ്പോൾ… വന്ന്… കടന്ന്… അറിയിച്ചു’ എന്ന സ്വാഭാവിക മലയാളക്രമത്തിൽ നിലനിർത്തി.
