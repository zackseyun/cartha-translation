id: ACT.23.11
reference: Acts 23:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: ml
  text: 'അടുത്ത രാത്രിയിൽ കർത്താവ് അവന്റെ അരികിൽ വന്നുനിന്ന് പറഞ്ഞു: “ധൈര്യപ്പെടുക![a] നീ യെരൂശലേമിൽ എന്നെക്കുറിച്ച് സാക്ഷ്യം വഹിച്ചതുപോലെ,[b] റോമിലും സാക്ഷ്യം വഹിക്കേണ്ടതാണ്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനസ്സുറപ്പിക്കുക!”
    reason: lexical_alternative
  - marker: b
    text: “സാക്ഷ്യം നൽകുക” എന്നും പരിഭാഷപ്പെടുത്താം. പൗലൊസിന്റെ കഴിഞ്ഞതും വരാനിരിക്കുന്നതുമായ സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന രണ്ടു ഗ്രീക്ക് ക്രിയകളും ഒരേ ‘സാക്ഷി/സാക്ഷ്യം’ പദകുടുംബത്തിൽപ്പെട്ടവയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: അടുത്ത രാത്രിയിൽ
  rationale: ἐπιοῦσα νύξ എന്നത് തൊട്ടടുത്ത രാത്രിയെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആഖ്യാനബന്ധമാണ്; സ്വാഭാവിക മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ ക്രമസൂചനയിലൂടെ അത് പ്രകടമാക്കുന്നു.
- source_word: ἐπιστὰς αὐτῷ
  choice: അവന്റെ അരികിൽ നിന്നുകൊണ്ട്
  rationale: ἐφίστημι ഇവിടെ അടുത്തെത്തി അരികിൽ നിൽക്കുന്ന വ്യക്തിപരവും പിന്തുണ നൽകുന്നതുമായ സാന്നിധ്യം സൂചിപ്പിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനപരമായ ‘പ്രത്യക്ഷപ്പെട്ട്’ എന്നത് ഒഴിവാക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടമായ κύριος എന്ന പദത്തെ വികസിപ്പിച്ച് ‘കർത്താവായ യേശു’ എന്നു ചേർക്കാതെ പതിവും മാന്യവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: Θάρσει
  choice: ധൈര്യപ്പെടുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം ധൈര്യം കൈക്കൊള്ളാനുള്ള നേരിട്ടുള്ള പ്രോത്സാഹനമാണ്. ‘ധൈര്യപ്പെടുക’ ആ ഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: διεμαρτύρω … μαρτυρῆσαι
  choice: സാക്ഷ്യം വഹിച്ചതുപോലെ … സാക്ഷ്യം വഹിക്കേണ്ടതാണ്
  rationale: രണ്ട് ഗ്രീക്ക് ക്രിയകളും സാക്ഷ്യം/സാക്ഷീകരണം എന്ന ഒരേ പദകുടുംബത്തിൽപ്പെട്ടവയാണ്. ഒരേ മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നത് യെരൂശലേമിലെ കഴിഞ്ഞ സാക്ഷ്യവും റോമിലെ വരാനിരിക്കുന്ന സാക്ഷ്യവും തമ്മിലുള്ള ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὰ περὶ ἐμοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: യേശുവിനെ സംബന്ധിക്കുന്ന കാര്യങ്ങൾ എന്ന ആശയം അനാവശ്യമായ വാക്കുകൂട്ടമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς Ἰερουσαλὴμ … εἰς Ῥώμην
  choice: യെരൂശലേമിൽ … റോമിലും
  rationale: നഗരനാമങ്ങളോടൊപ്പം εἰς ഇവിടെ സാക്ഷ്യം നടന്നതും നടക്കേണ്ടതുമായ സ്ഥലത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ അധികരണവിഭക്തിയാണ് സ്വാഭാവികം. καί ‘-ഉം’ വഴി നിലനിർത്തുന്നു.
- source_word: οὕτω
  choice: അതുപോലെ
  rationale: യെരൂശലേമിലെ സാക്ഷ്യത്തിനും റോമിലെ സാക്ഷ്യത്തിനും ഇടയിലെ അനുരൂപത വ്യക്തമാക്കുന്നു.
- source_word: σε δεῖ
  choice: സാക്ഷ്യം വഹിക്കേണ്ടതാണ്
  rationale: δεῖ പ്രകടിപ്പിക്കുന്ന അനിവാര്യത വ്യക്തമായി നൽകുന്നു; എന്നാൽ അതിനെ വിധിവാദമോ മുൻനിശ്ചയമോ ആയി വിശദീകരിക്കുന്നില്ല.
theological_decisions:
- issue: ὁ κύριος എന്നതിന്റെ വ്യക്തിത്വം
  choice: കർത്താവ്
  alternative: കർത്താവായ യേശു
  rationale: സന്ദർഭത്തിൽ സംസാരിക്കുന്നത് ഉയിർത്തെഴുന്നേറ്റ യേശുവാണെന്ന് വ്യക്തമാകുന്നുവെങ്കിലും, മൂലപാഠം പറയുന്ന ‘കർത്താവ്’ എന്ന രൂപം മാത്രം പരിഭാഷയിൽ നിലനിർത്തുന്നു; വ്യക്തിത്വം വിശദീകരിച്ച് പാഠം വികസിപ്പിക്കുന്നില്ല.
- issue: δεῖ എന്നതിലെ അനിവാര്യത
  choice: വഹിക്കേണ്ടതാണ്
  alternative: വഹിക്കാൻ നിയോഗിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ദൈവിക പദ്ധതിയോടു ബന്ധപ്പെട്ട അനിവാര്യതയുടെ ഭാവം സംരക്ഷിക്കുമ്പോഴും, മൂലപാഠം വ്യക്തമാക്കാത്ത വിധിവാദപരമായ സംവിധാനത്തെ പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘സാക്ഷ്യം വഹിക്കുക’ സഭാപരിസരത്തിൽ പരിചിതമാണെങ്കിലും പൊതുവായ മലയാളത്തിലും ഗ്രഹിക്കാവുന്നതാണ്. മൂലപാഠത്തിൽ പേര് ആവർത്തിക്കാത്തതിനാൽ αὐτῷ എന്നത് ‘അവന്റെ’ എന്നാണ് നൽകിയിരിക്കുന്നത്; ‘പൗലൊസിന്റെ’ എന്ന് വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
