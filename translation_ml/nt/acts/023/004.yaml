id: ACT.23.4
reference: Acts 23:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ παρεστῶτες εἶπαν· Τὸν ἀρχιερέα τοῦ θεοῦ λοιδορεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: ml
  text: 'അടുത്തുനിന്നവർ പറഞ്ഞു: “ദൈവത്തിന്റെ മഹാപുരോഹിതനെ നീ അധിക്ഷേപിക്കുന്നോ?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ മഹാപുരോഹിതനെ നീ നിന്ദിക്കുന്നോ?”
    reason: λοιδορεῖς എന്നതിന് ‘അധിക്ഷേപിക്കുക’ എന്നതിനൊപ്പം വാക്കുകളാൽ നിന്ദിക്കുകയോ അപമാനിക്കുകയോ ചെയ്യുക എന്ന അർഥവുമുണ്ട്.
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: അപ്പോൾ അടുത്തുനിന്നവർ
  rationale: പദസമുച്ചയത്തിലെ substantival participle പൗലോസിന്റെ സമീപത്ത് നിന്നിരുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘അടുത്തുനിന്നവർ’ സ്ഥലസാമീപ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; δὲ ഇവിടെ കഥയുടെ തുടർച്ചയിൽ ‘അപ്പോൾ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: εἶπαν
  choice: പറഞ്ഞു
  rationale: Aorist indicative കഥയെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗമാണ്; അതിനാൽ ‘പറഞ്ഞു’ സ്വാഭാവികമാണ്.
- source_word: ἀρχιερέα
  choice: മഹാപുരോഹിതനെ
  rationale: ഈ സന്ദർഭത്തിൽ യെഹൂദ മഹാപുരോഹിതന്റെ പദവിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ ഭാഷയിലും പൊതുപ്രയോഗത്തിലും ‘മഹാപുരോഹിതൻ’ കൃത്യവും പരിചിതവുമാണ്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: Genitive ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ദൈവത്തിന്റെ’ എന്നു നൽകുന്നു. ഇത് ആ വ്യക്തിയുടെ പെരുമാറ്റത്തിന് ദൈവിക അംഗീകാരം ആരോപിക്കാതെ, പദവിയെ ദൈവവുമായി ബന്ധപ്പെടുത്തി മാത്രം അവതരിപ്പിക്കുന്നു.
- source_word: λοιδορεῖς
  choice: അധിക്ഷേപിക്കുന്നോ
  rationale: λοιδορέω വാക്കുകളാൽ അപമാനിക്കുകയോ നിന്ദിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അധിക്ഷേപിക്കുക’ ആ ശക്തി നിലനിർത്തുകയും ആധുനിക മാനകമലയാളത്തിൽ ഗൗരവമുള്ളതും മനസ്സിലാക്കാവുന്നതുമായിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ θεοῦ എന്ന പ്രയോഗം മഹാപുരോഹിതനുമായി പുലർത്തുന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ‘ദൈവത്തിന്റെ മഹാപുരോഹിതൻ’ എന്ന് പരിഭാഷപ്പെടുത്തി; വാക്യം പറയുന്നതിലപ്പുറം ആ വ്യക്തിയുടെ പ്രവൃത്തികൾക്ക് ദൈവിക അംഗീകാരം സൂചിപ്പിച്ചിട്ടില്ല.
  alternative: ‘ദൈവത്തിന്റേതായ മഹാപുരോഹിതൻ’
  rationale: ഗ്രീക്ക് പദസമുച്ചയം പദവിയെ ദൈവവുമായി ബന്ധപ്പെടുത്തുന്നു; എന്നാൽ പദവി വഹിക്കുന്ന വ്യക്തിയുടെ പെരുമാറ്റത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ വിധി ഇവിടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംഭാഷണശൈലി ഉപയോഗിച്ചു. ചോദ്യം ശാസനാഭാവത്തോടെ നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യമായി പഴഞ്ചനായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
