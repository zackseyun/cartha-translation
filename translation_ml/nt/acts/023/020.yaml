  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: ml
  text: 'അവൻ പറഞ്ഞു: “യെഹൂദന്മാർ[a] നാളെ പൗലോസിനെ സൻഹെദ്രിനിലേക്കു[b] താഴെ കൊണ്ടുവരാൻ നിന്നോട് അഭ്യർഥിക്കാൻ തമ്മിൽ ധാരണയായിരിക്കുന്നു—അവനെക്കുറിച്ച് എന്തെങ്കിലും കൂടുതൽ കൃത്യമായി അന്വേഷിക്കാനിരിക്കുന്നതുപോലെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “യെഹൂദന്മാർ” എന്നു പറയുന്നത് പൗലോസിനെതിരായ പദ്ധതിയിൽ ഉൾപ്പെട്ട പ്രത്യേക സംഘത്തെയാണ്; എല്ലാ യെഹൂദരെയും അല്ല.
    reason: referent_clarification
  - marker: b
    text: “സൻഹെദ്രിൻ” യെഹൂദരുടെ ഭരണ-ന്യായസമിതിയായിരുന്നു; ഇതിനെ “ന്യായസഭ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέθεντο
  choice: തമ്മിൽ ധാരണയായിരിക്കുന്നു
  rationale: മധ്യപ്രയോഗം അവർ കൂട്ടായി ഒരു ധാരണയിലോ പദ്ധതിയിലോ എത്തിയതിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ ദുരുദ്ദേശ്യം വ്യക്തമാണെങ്കിലും പദത്തിൽ തന്നെയില്ലാത്ത ‘ഗൂഢാലോചന’ എന്ന അർഥം കുത്തിനിറക്കുന്നില്ല.
- source_word: τοῦ ἐρωτῆσαί σε
  choice: നിന്നോട് അഭ്യർഥിക്കാമെന്ന്
  rationale: ഇവിടെ ἐρωτάω അധികാരിയോട് ഒരു നടപടി ചെയ്യാൻ ആവശ്യപ്പെടുക എന്ന അർഥത്തിലാണ്; ‘അഭ്യർഥിക്കുക’ ആ വിനീതമായ അഭ്യർഥനാഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καταγάγῃς
  choice: താഴെ കൊണ്ടുവരാൻ
  rationale: κατά-യുടെ ദിശാസൂചന നിലനിർത്തുന്നു; കോട്ടയിൽനിന്ന് സഭാസ്ഥലത്തേക്കുള്ള നീക്കമാണ് സന്ദർഭം.
- source_word: συνέδριον
  choice: സൻഹെദ്രിൻ സഭ
  rationale: യെഹൂദരുടെ ഭരണ-ന്യായസമിതിയെന്ന പ്രത്യേക സ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു; ‘സഭ’ ചേർക്കുന്നത് സാധാരണ വായനക്കാർക്ക് സ്ഥാപനസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: എന്ന ഭാവത്തിൽ
  rationale: പ്രസ്താവിച്ച ഉദ്ദേശ്യം യഥാർഥമല്ലെന്ന ഭാവം സൂചിപ്പിക്കുന്ന ὡς-ന്റെ വ്യാജപ്രതീതി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച് കൂടുതൽ കൃത്യമായി അന്വേഷിക്കാനാണ്
  rationale: πυνθάνομαιയുടെ ചോദിച്ചറിവ്/അന്വേഷണം എന്ന അർഥവും ἀκριβέστερον എന്ന താരതമ്യഭാവവും നിലനിർത്തുന്നു; അനിശ്ചിതമായ τι മലയാളത്തിൽ പ്രത്യേകം ‘എന്തെങ്കിലും’ എന്നു ചേർത്താൽ വാചകം അസ്വാഭാവികമാകുന്നതിനാൽ അന്വേഷണത്തിന്റെ പരിധിയിൽ ഉൾക്കൊള്ളിച്ചിരിക്കുന്നു.
- source_word: Οἱ Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ജനവിഭാഗനാമം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പൗലോസിനെതിരായ പദ്ധതിയിൽ ഉൾപ്പെട്ട പ്രത്യേക സംഘത്തെയാണ് സൂചിപ്പിക്കുന്നത്, മുഴുവൻ യെഹൂദജനതയെയല്ല.
theological_decisions:
- issue: വൈരപരമായ സന്ദർഭത്തിലെ Οἱ Ἰουδαῖοι എന്നതിന്റെ പരാമർശപരിധി
  choice: യെഹൂദന്മാർ എന്ന നേരിട്ടുള്ള വിവർത്തനം നിലനിർത്തി, അടിക്കുറിപ്പിൽ സന്ദർഭപരമായ പരിധി വ്യക്തമാക്കുക
  alternative: യെഹൂദനേതാക്കൾ / യെഹൂദ്യർ
  rationale: മൂലപാഠം പറയുന്നതിനെക്കാൾ പരാമർശപരിധി മുഖ്യവാചകത്തിൽ ചുരുക്കുന്നില്ല. അതേസമയം, ഇത് എല്ലാ യെഹൂദരെയും പൊതുവായി കുറ്റപ്പെടുത്തുന്നതല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: ὡς സൂചിപ്പിക്കുന്ന വ്യാജ ഉദ്ദേശ്യം
  choice: ‘എന്ന ഭാവത്തിൽ’ എന്നു നൽകി ഉദ്ദേശ്യത്തിന്റെ കപടസ്വഭാവം നിലനിർത്തുക
  alternative: ‘എന്നപോലെ’ / ‘എന്ന വ്യാജേന’
  rationale: ‘എന്ന ഭാവത്തിൽ’ വ്യാജപ്രതീതിയെ വ്യക്തമാക്കുന്നു; ‘വ്യാജേന’ എന്നത് സാധ്യമായെങ്കിലും മൂലത്തിലെ സൂചനയെ അല്പം കൂടുതൽ തുറന്നുപറയും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സൻഹെദ്രിൻ’ എന്ന ചരിത്രസ്ഥാപനനാമത്തോടൊപ്പം ‘സഭ’ ചേർത്ത് അർഥസൂചന നൽകി. മുഖ്യവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട വിശദീകരണത്തിലേക്ക് ചൂണ്ടുന്നു.
