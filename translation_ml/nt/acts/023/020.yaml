  to: 'അവൻ പറഞ്ഞു: “യെഹൂദന്മാർ[a] നാളെ പൗലോസിനെ സൻഹെദ്രിനിലേക്കു[b] താഴെ കൊണ്ടുവരാൻ നിന്നോട് അഭ്യർഥിക്കാൻ തമ്മിൽ ധാരണയായിരിക്കുന്നു—അവനെക്കുറിച്ച് എന്തെങ്കിലും കൂടുതൽ കൃത്യമായി അന്വേഷിക്കാനിരിക്കുന്നതുപോലെ.”'
