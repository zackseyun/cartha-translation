id: ACT.23.23
reference: Acts 23:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: ml
  text: 'പിന്നെ ശതാധിപന്മാരിൽ രണ്ടുപേരെ വിളിച്ചുവരുത്തി അവൻ പറഞ്ഞു: “രാത്രിയുടെ മൂന്നാം മണിക്കൂർ മുതൽ[b] കൈസര്യവരെ പോകാൻ ഇരുനൂറ് പടയാളികളെയും എഴുപത് കുതിരപ്പടയാളികളെയും ഇരുനൂറ് കുന്തക്കാരെയും[a] സജ്ജമാക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വലതുകൈ കാവൽക്കാർ.” “കുന്തക്കാർ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന അപൂർവപദത്തിന്റെ കൃത്യമായ അർഥം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, രാത്രി ആരംഭിച്ചതിന് ശേഷമുള്ള മൂന്നാം മണിക്കൂർ; യെഹൂദരുടെ സമയക്കണക്കനുസരിച്ച് ഏകദേശം രാത്രി 9 മണി.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: വിളിച്ചുവരുത്തി
  rationale: ആളുകളെ തന്റെ സന്നിധിയിലേക്കു വിളിപ്പിക്കുക എന്ന മധ്യപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: ശതാധിപന്മാരിൽ രണ്ടുപേരെ
  rationale: τινας δύο എന്ന പ്രയോഗം മലയാളത്തിൽ അനാവശ്യമായ അനിശ്ചിതത്വം ചേർക്കാതെ ‘രണ്ടുപേർ’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ἑκατοντάρχης എന്ന റോമൻ സൈനികപദവിക്ക് പരിചിതമായ ‘ശതാധിപൻ’ ഉപയോഗിച്ചു.
- source_word: Ἑτοιμάσατε
  choice: ഒരുക്കിനിർത്തുക
  rationale: പുറപ്പെടേണ്ട സൈനികരെ സജ്ജരാക്കാനുള്ള സൈനിക കല്പനയുടെ ഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: στρατιώτας διακοσίους
  choice: ഇരുനൂറ് പടയാളികളെ
  rationale: തുടർന്നു പറയുന്ന കുതിരപ്പടയാളികളിൽനിന്നും പ്രത്യേക സേനാവിഭാഗത്തിൽനിന്നും വേർതിരിച്ചുള്ള പൊതുവായ കാലാൾസൈനിക വിഭാഗം സൂചിപ്പിക്കുന്നു.
- source_word: ὅπως πορευθῶσιν ἕως Καισαρείας
  choice: കൈസര്യവരെ പോകുന്നതിനായി
  rationale: ὅπως സഹിതമുള്ള വിധിലിംഗത്തിന്റെ ഉദ്ദേശ്യാർഥവും ἕως എന്നതിന്റെ ‘വരെ’ എന്ന സ്ഥലപരിധിയും സംരക്ഷിക്കുന്നു.
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: എഴുപത് കുതിരപ്പടയാളികളെ
  rationale: കുതിരപ്പുറത്തു സഞ്ചരിക്കുന്ന സൈനികരെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി തിരിച്ചറിയാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: δεξιολάβους διακοσίους
  choice: ഇരുനൂറ് കുന്തക്കാരെ
  rationale: അപൂർവവും കൃത്യാർഥം അനിശ്ചിതവുമായ സൈനികപദത്തിന് സന്ദർഭോചിതവും വ്യാപകമായി അംഗീകരിക്കപ്പെട്ടതുമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: രാത്രിയുടെ മൂന്നാം മണിക്കൂറിൽ പുറപ്പെട്ട്
  rationale: ἀπό ആരംഭസമയം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ പുറപ്പെടുന്ന സമയമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോഴും പുരാതന സമയനിർണ്ണയം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
