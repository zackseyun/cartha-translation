  to: 'പിന്നെ ശതാധിപന്മാരിൽ രണ്ടുപേരെ വിളിച്ചുവരുത്തി അവൻ പറഞ്ഞു: “രാത്രിയുടെ മൂന്നാം മണിക്കൂർ മുതൽ[b] കൈസര്യവരെ പോകാൻ ഇരുനൂറ് പടയാളികളെയും എഴുപത് കുതിരപ്പടയാളികളെയും ഇരുനൂറ് കുന്തക്കാരെയും[a] സജ്ജമാക്കുക.”'
  rationale: The revision removes the added/ambiguous participial instruction “പുറപ്പെട്ട്” and makes the military command directly govern the three troop groups. “രാത്രിയുടെ മൂന്നാം മണിക്കൂർ മുതൽ” retains the source’s ἀπό (“from”) while placing the time phrase with the command to ready the troops. No doctrinal or interpretive change is involved.
