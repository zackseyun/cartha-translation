translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. റോമൻ പദവിക്ക് ബൈബിൾ വായനയിൽ പരിചിതമായ ‘ശതാധിപൻ’ നിലനിർത്തി. അപൂർവ സൈനികപദത്തിന്റെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ഇംഗ്ലീഷ് consultation layer-ലെ സ്ഥാനം തെറ്റിയ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവയുടെ യഥാർഥ പദങ്ങളോടു ചേർത്തു.
