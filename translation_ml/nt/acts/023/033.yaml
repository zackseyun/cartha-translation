  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες εἰσελθόντες εἰς τὴν Καισάρειαν καὶ ἀναδόντες τὴν ἐπιστολὴν τῷ ἡγεμόνι παρέστησαν καὶ τὸν Παῦλον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/033.yaml
  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: ml
  text: അവർ കൈസര്യയിൽ പ്രവേശിച്ച് കത്ത് ഗവർണർക്കു കൈമാറി[a]; പൗലോസിനെയും അദ്ദേഹത്തിന്റെ മുമ്പിൽ ഹാജരാക്കി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കത്ത് ഗവർണർക്കു സമർപ്പിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പൗലോസിനെയും അദ്ദേഹത്തിന്റെ മുമ്പിൽ കൊണ്ടുവന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിലെ കുതിരപ്പടയാളികളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ വ്യക്തമായ കർത്തൃരൂപം.
- source_word: εἰσελθόντες
  choice: പ്രവേശിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പു നടന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist participle സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: Καισάρειαν
  choice: കൈസര്യയിൽ
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം; εἰς എന്ന ദിശാബോധം പ്രവേശനക്രിയയോടും -യിൽ വിഭക്തിയോടും ചേർന്ന് വ്യക്തമാണ്.
- source_word: ἀναδόντες
  choice: കൈമാറി
  rationale: അധികാരിക്കു ഔദ്യോഗിക കത്ത് ഏൽപ്പിക്കുന്ന സന്ദർഭത്തിലെ ഔപചാരിക കൈമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐπιστολήν
  choice: കത്ത്
  rationale: ഔദ്യോഗികമായ എഴുത്തുസന്ദേശത്തിനുള്ള സാധാരണവും സന്ദർഭോചിതവുമായ പദം.
- source_word: ἡγεμόνι
  choice: ഗവർണർക്കു
  rationale: റോമൻ പ്രവിശ്യാധികാരിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും ആധുനിക വായനക്കാർക്കു പരിചിതവുമായ പദം.
- source_word: παρέστησαν
  choice: ഹാജരാക്കി
  rationale: ഒരു അധികാരിയുടെ മുമ്പിൽ ഒരാളെ ഔദ്യോഗികമായി കൊണ്ടുവന്ന് നിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന നിയമപരവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: καὶ
  choice: -യും
  rationale: കത്ത് കൈമാറിയതിനു പുറമേ പൗലോസിനെയും ഹാജരാക്കി എന്ന കൂട്ടിച്ചേർക്കൽബന്ധം മലയാളത്തിലെ ‘-യും’ വ്യക്തമാക്കുന്നു.
- source_word: Παῦλον
  choice: പൗലോസിനെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള രൂപം, കർമവിഭക്തിയോടെ.
- source_word: αὐτῷ
  choice: അദ്ദേഹത്തിന്റെ മുമ്പിൽ
  rationale: സർവനാമം ഗവർണറെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഹാജരാക്കി’ എന്ന ക്രിയയോടൊപ്പം ബഹുമാനപൂർവവും സ്വാഭാവികവുമായ രൂപം.
