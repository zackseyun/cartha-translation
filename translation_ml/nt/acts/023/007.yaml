id: ACT.23.7
reference: Acts 23:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ αὐτοῦ ⸀λαλοῦντος ἐγένετο στάσις τῶν Φαρισαίων ⸂καὶ Σαδδουκαίων⸃, καὶ ἐσχίσθη τὸ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/007.yaml
  text: And as he was saying this[a], a dispute arose between the Pharisees and Sadducees[b], and the assembly was divided.
translation:
  language: ml
  text: അവൻ ഇതു പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ, പരീശന്മാരും സദൂക്യരും തമ്മിൽ ഒരു ഭിന്നത ഉണ്ടായി; കൂടിയിരുന്നവർ രണ്ടു ചേരിയായി പിരിഞ്ഞു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: അവൻ ഇതു പറഞ്ഞുകൊണ്ടിരിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപമുള്ള genitive absolute, മുഖ്യസംഭവത്തോടൊപ്പം നടന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം ആ സമകാലികത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐγένετο στάσις
  choice: ഒരു ഭിന്നത ഉണ്ടായി
  rationale: ἐγένετο ഒരു അവസ്ഥ ഉടലെടുത്തതിനെ സൂചിപ്പിക്കുന്നു; στάσις ഇവിടെ അഭിപ്രായസംഘർഷം, കലഹം, കക്ഷിഭേദം എന്നിവയുടെ അർത്ഥപരിധിയിലുണ്ട്. തുടർന്നുള്ള ജനക്കൂട്ടത്തിന്റെ പിളർപ്പുമായി ബന്ധം നിലനിർത്തിക്കൊണ്ട് ‘ഭിന്നത’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: പരീശന്മാരും സദൂക്യരും തമ്മിൽ
  rationale: ഗ്രീക്കിലെ genitive ഘടന എതിർകക്ഷികളായ രണ്ടു വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തമ്മിൽ’ അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐσχίσθη
  choice: രണ്ടു ചേരിയായി പിരിഞ്ഞു
  rationale: σχίζω എന്നതിന്റെ നിഷ്ക്രിയരൂപം അക്ഷരാർഥത്തിൽ പിളരുകയോ വിഭജിക്കപ്പെടുകയോ ചെയ്യുന്നതാണ്. സാമൂഹികസന്ദർഭത്തിൽ കൂട്ടം വിരുദ്ധചേരികളായി വിഭജിക്കപ്പെട്ടതിനെ ഈ പ്രയോഗം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τὸ πλῆθος
  choice: കൂടിയിരുന്നവർ
  rationale: πλῆθος ഇവിടെ വെറും വഴിയാത്രക്കാരുടെ ജനക്കൂട്ടമല്ല, സന്നിഹിതമായിരുന്ന കൂട്ടത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കൂടിയിരുന്നവർ’ സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; ‘സഭ’ എന്നു വിവർത്തനം ചെയ്യുമ്പോൾ ഉണ്ടാകാവുന്ന സഭാസ്ഥാപനപരമായ അധികാർത്ഥം ഒഴിവാക്കുന്നു.
