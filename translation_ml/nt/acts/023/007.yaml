  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. വിഭാഗനാമങ്ങൾക്ക് മലയാള ബൈബിൾപരമ്പരയിൽ പരിചിതമായ ‘പരീശന്മാർ’, ‘സദൂക്യർ’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു.
