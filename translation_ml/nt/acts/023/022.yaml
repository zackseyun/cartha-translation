id: ACT.23.22
reference: Acts 23:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: ml
  text: 'അങ്ങനെ സൈനിക മേധാവി ആ യുവാവിനെ പറഞ്ഞയച്ചു. അവനോട് ഇങ്ങനെ കൽപ്പിച്ചു: “നീ ഈ കാര്യങ്ങൾ എന്നെ അറിയിച്ചതായി[a] ആരോടും പറയരുത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്നെ വിവരം ധരിപ്പിച്ചതായി” അല്ലെങ്കിൽ “ഈ കാര്യങ്ങൾ എനിക്ക് വെളിപ്പെടുത്തിയതായി.”
    reason: ἐνεφάνισας എന്ന ക്രിയയ്ക്ക് ‘അറിയിക്കുക,’ ‘വിവരം ധരിപ്പിക്കുക,’ ‘വെളിപ്പെടുത്തുക’ എന്നീ സമീപാർഥങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: χιλίαρχος
  choice: സൈനിക മേധാവി
  rationale: ഒരു റോമൻ സൈനിക ഉദ്യോഗസ്ഥനെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. പദവിയുടെ അധികാരസ്വഭാവം നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന പ്രയോഗമാണിത്.
- source_word: ἀπέλυσε
  choice: പറഞ്ഞയച്ചു
  rationale: അഭിമുഖസംഭാഷണം അവസാനിപ്പിച്ച് യുവാവിനെ പോകാൻ അനുവദിച്ചതാണ് സന്ദർഭം. തടവിൽനിന്നുള്ള മോചനം എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കാൻ ‘വിട്ടയച്ചു’ എന്നതിനെക്കാൾ ‘പറഞ്ഞയച്ചു’ യോജിക്കുന്നു.
- source_word: νεανίσκον
  choice: യുവാവ്
  rationale: പ്രായം കുറഞ്ഞ ഒരു പുരുഷനെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ആദരവുള്ളതും സമകാലികവുമായ സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: παραγγείλας
  choice: കൽപ്പിച്ചു
  rationale: അധികാരസ്ഥാനത്തുള്ള ഉദ്യോഗസ്ഥൻ നൽകിയ വ്യക്തമായ നിർദേശം എന്ന ബലം സന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: ആരോടും പറയരുത്
  rationale: വിവരം മറ്റാർക്കും വെളിപ്പെടുത്തരുതെന്ന വിലക്ക് സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐνεφάνισας
  choice: അറിയിച്ചതായി
  rationale: ഒരു അധികാരിക്ക് വിവരം ഔദ്യോഗികമായി അറിയിക്കുക അഥവാ കാര്യം വെളിപ്പെടുത്തുക എന്ന അർഥവ്യാപ്തി സന്ദർഭാനുസൃതമായി നൽകുന്നു; മറ്റു സാധ്യമായ ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുമ്പ് അറിയിച്ച വിവരങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചനരൂപം നിലനിർത്തുന്നു.
- source_word: πρὸς ἐμέ
  choice: എന്നെ
  rationale: അറിയിക്കൽ ലക്ഷ്യമാക്കിയ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന πρὸς എന്നതിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ മലയാളരൂപമാണിത്.
