translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ഔദ്യോഗിക ഭാവം സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ കൃതന്തഘടന മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; നിർദേശത്തിന്റെ അധികാരബലം ‘കൽപ്പിച്ചു’ എന്നതിലൂടെ നിലനിർത്തി.
