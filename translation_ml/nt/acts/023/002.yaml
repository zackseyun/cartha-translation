base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: ml
  text: എന്നാൽ മഹാപുരോഹിതനായ അനന്യാസ്, പൗലോസിന്റെ വായിൽ അടിക്കാൻ തന്റെ അരികിൽ നിന്നവരോടു കല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പൗലോസിന്റെ വായത്ത് അടിക്കാൻ.” ഗ്രീക്ക് ക്രിയ പൊതുവായി പ്രഹരിക്കുന്നതിനെ സൂചിപ്പിക്കാം; കൈപ്പത്തി കൊണ്ടുള്ള അടി എന്ന അർത്ഥവും ഇവിടെ സാധ്യമാണ്, എന്നാൽ അത് കൂടുതൽ പ്രത്യേകമായ വ്യാഖ്യാനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: പൗലോസിന്റെ മുൻപ്രസ്താവനയോടുള്ള പെട്ടെന്നുള്ള പ്രതികരണം സൂചിപ്പിക്കുന്ന മൃദുവായ പ്രതികൂല/തുടർച്ചാസംബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀρχιερεὺς
  choice: മഹാപുരോഹിതൻ
  rationale: ഈ ഏകവചന പദവിക്ക് മലയാളത്തിൽ പ്രചാരമുള്ളതും അർത്ഥകൃത്യവുമായ പരിഭാഷ.
- source_word: Ἁνανίας
  choice: അനന്യാസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἐπέταξεν
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ ആജ്ഞയെ സൂചിപ്പിക്കുകയും ഗൗരവമുള്ള ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: തന്റെ അരികിൽ നിന്നവരോട്
  rationale: അനന്യാസിന്റെ സമീപത്ത് സന്നിഹിതരായിരുന്നവരെന്ന സ്ഥലപരമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: τύπτειν
  choice: അടിക്കാൻ
  rationale: പ്രഹരിക്കുക എന്ന പൊതുവായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അടിയുടെ പ്രത്യേക രീതി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: αὐτοῦ τὸ στόμα
  choice: പൗലോസിന്റെ വായിൽ
  rationale: ഗ്രീക്കിലെ സർവനാമത്തിന്റെ സൂചിതവ്യക്തി മലയാളത്തിൽ വ്യക്തതയ്ക്കായി പേരിലൂടെ വ്യക്തമാക്കുകയും പ്രഹരത്തിന്റെ ലക്ഷ്യസ്ഥാനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
