source:
  edition: SBLGNT
  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: ml
  text: 'അവർ മഹാപുരോഹിതന്മാരുടെയും മൂപ്പന്മാരുടെയും അടുക്കൽ ചെന്ന് പറഞ്ഞു: “പൗലോസിനെ കൊല്ലുന്നതുവരെ ഒന്നും രുചിക്കുകയില്ലെന്ന് ഞങ്ങൾ ശാപം ചൊല്ലി സ്വയം ബന്ധിച്ചിരിക്കുന്നു.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞങ്ങൾ ഞങ്ങളെത്തന്നെ ശാപത്തിന് വിധേയരാക്കിയിരിക്കുന്നു.” ഗ്രീക്കിൽ, പ്രതിജ്ഞ ലംഘിച്ചാൽ ശാപം തങ്ങളുടെമേൽ വരട്ടെയെന്ന സ്വയംശാപ പ്രതിജ്ഞയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻവാക്യത്തിലെ ഗൂഢാലോചനക്കാരെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ സ്വാഭാവികമായ പുതിയ വാക്യാരംഭത്തിന് ‘അവർ’ യോജിക്കുന്നു.
- source_word: προσελθόντες
  choice: അടുക്കൽ ചെന്ന്
  rationale: പ്രധാനക്രിയയായ ‘പറഞ്ഞു’വിന് മുമ്പുണ്ടായ സമീപനത്തെ സ്വാഭാവികമായ ആഖ്യാനമലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: മഹാപുരോഹിതന്മാരുടെ
  rationale: രണ്ടാം ദേവാലയകാലത്തെ യെഹൂദ നേതൃസംഘത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സ്ഥാപിതവും ഗ്രാഹ്യവുമായ മലയാളരൂപം.
- source_word: τοῖς πρεσβυτέροις
  choice: മൂപ്പന്മാരുടെ
  rationale: ഇവിടെ പ്രായമേറിയ പുരുഷന്മാരെയല്ല, അംഗീകൃത സമുദായനേതാക്കളെയാണ് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: ശാപം ചൊല്ലി സ്വയം ബന്ധിച്ചിരിക്കുന്നു
  rationale: സമാനമൂലപദങ്ങളുടെ ഊന്നലോടുകൂടിയ പ്രയോഗം സ്വയം ശാപത്തിന് വിധേയരാക്കുന്ന പ്രതിജ്ഞയെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാല സഭാപരമായ ‘അനാഥേമ’ സാങ്കേതികപദം ഒഴിവാക്കി അതിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
- source_word: μηδενὸς γεύσασθαι
  choice: ഒന്നും രുചിക്കുകയില്ലെന്ന്
  rationale: ‘രുചിക്കുക/കഴിക്കുക’ എന്ന മൂലാർത്ഥവും μηδενός എന്ന നിഷേധത്തിന്റെ സമ്പൂർണതയും അടുത്തായി സൂക്ഷിക്കുന്നു.
- source_word: ἕως οὗ
  choice: വരെ
  rationale: പ്രതിജ്ഞയുടെ കാലപരിധി നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποκτείνωμεν
  choice: കൊല്ലുന്നതു
  rationale: ലക്ഷ്യമിട്ട സംഭവത്തെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു; ‘കൊലപ്പെടുത്തുക’ എന്ന നിയമപരമായ അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: τὸν Παῦλον
  choice: പൗലോസിനെ
  rationale: Παῦλος എന്ന പേരിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς എന്ന പ്രതിജ്ഞാസൂത്രത്തിന്റെ വിവർത്തനം
  choice: ശാപം ചൊല്ലി സ്വയം ബന്ധിച്ചിരിക്കുന്നു
  alternative: സ്വയം ശാപത്തിന് വിധേയരാക്കിയിരിക്കുന്നു; കഠിനമായി പ്രതിജ്ഞ ചെയ്തിരിക്കുന്നു
  rationale: ഇത് പിൽക്കാല സഭാപരമായ ‘അനാഥേമ’ എന്ന സാങ്കേതിക ആശയമല്ല, പ്രതിജ്ഞ ലംഘിച്ചാൽ ശാപം തങ്ങളിലേക്കു വരട്ടെയെന്ന സ്വയംശാപ പ്രതിജ്ഞയാണ്. തിരഞ്ഞെടുത്ത രൂപം പ്രതിജ്ഞയുടെ ബന്ധനവും ശാപത്തിന്റെ ഗൗരവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആഖ്യാനശൈലി. ‘മഹാപുരോഹിതന്മാർ’, ‘മൂപ്പന്മാർ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ‘അനാഥേമ’ പോലുള്ള അപരിചിതവും പിൽക്കാല സാങ്കേതിക അർത്ഥഭാരമുള്ളതുമായ പദം ഒഴിവാക്കി.
