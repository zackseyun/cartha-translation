source:
  edition: SBLGNT
  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: ml
  text: ഇവയെല്ലാം ഉപയോഗത്തിൽ നശിച്ചുപോകുന്നവയാണ്[a]. ഈ ചട്ടങ്ങൾ മനുഷ്യരുടെ[b] കൽപ്പനകൾക്കും ഉപദേശങ്ങൾക്കും അനുസരിച്ചുള്ളവയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇവയെല്ലാം ഉപയോഗിച്ചുതീർക്കപ്പെടുന്നതിനാൽ നാശത്തിനുള്ളവയാണ്.” ഗ്രീക്കിൽ ഉപയോഗം, ഉപഭോഗം, ഉപയോഗിച്ചുതീർക്കൽ എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: “മനുഷ്യരുടെ കൽപ്പനകളും ഉപദേശങ്ങളും” എന്ന പ്രയോഗം യെശയ്യാവ് 29:13-നെ പ്രതിധ്വനിപ്പിക്കുന്നതാകാം; ഈ ചട്ടങ്ങളുടെ ഉറവിടം ദൈവികമല്ല, മാനുഷികമാണെന്ന് അത് ഊന്നിപ്പറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: ഇവയെല്ലാം ... നശിച്ചുപോകുന്നവയാണ്
  rationale: മുൻവാക്യത്തിലെ വിലക്കുകൾ ബാധിക്കുന്ന വസ്തുക്കളെയാണ് നപുംസക ബഹുവചനമായ ἅ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ സൂചനയ്ക്കായി ‘ഇവയെല്ലാം’ ഉപയോഗിച്ചു.
- source_word: εἰς φθορὰν
  choice: നശിച്ചുപോകുന്നവയാണ്
  rationale: φθορά ഇവിടെ ഉപയോഗത്തിലൂടെ ഇല്ലാതാകുന്ന, ക്ഷയിക്കുന്ന വസ്തുക്കളുടെ നാശത്തെ സൂചിപ്പിക്കുന്നു; ലക്ഷ്യാഭിമുഖമായ εἰς എന്ന ഭാവവും ‘നശിച്ചുപോകുന്നവ’ എന്ന പ്രയോഗത്തിൽ നിലനിൽക്കുന്നു.
- source_word: τῇ ἀποχρήσει
  choice: ഉപയോഗിക്കുമ്പോൾ
  rationale: ἀπόχρησις ഉപയോഗിച്ചുതീർക്കൽ അഥവാ ഉപഭോഗം എന്ന ആശയം വഹിക്കുന്നു. ദാതിവ് ഇവിടെ സാഹചര്യപരമോ ഉപാധിപരമോ ആയി ഗ്രഹിക്കാം; ‘ഉപയോഗിക്കുമ്പോൾ’ വസ്തുക്കൾ ഉപയോഗത്തിൽ ഇല്ലാതാകുന്നു എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατὰ
  choice: അനുസരിച്ചുള്ളവ
  rationale: മാനദണ്ഡമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന κατὰയുടെ സാധാരണ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐντάλματα
  choice: കൽപ്പനകൾ
  rationale: നിയമപരവും ആജ്ഞാപരവുമായ ഭാവം നിലനിർത്തുകയും യെശയ്യാവ് 29:13-ലെ സാദ്ധ്യമായ പ്രതിധ്വനിയോട് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: διδασκαλίας
  choice: ഉപദേശങ്ങൾ
  rationale: സാങ്കേതികമായ പിൽക്കാല സിദ്ധാന്താർഥം അനാവശ്യമായി ചേർക്കാതെ διδασκαλίαയുടെ പൊതുവായ അർഥം നൽകുന്നു.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωποι ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവിക ഉറവിടത്തിനു വിരുദ്ധമായ മാനുഷിക ഉറവിടം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സന്ന്യാസപരമായ വിലക്കുകളുമായി വിശദീകരണഭാഗത്തിനുള്ള ബന്ധം
  choice: വിലക്കുകൾ ബാധിക്കുന്ന വസ്തുക്കൾ ഉപയോഗത്തിൽ നശിക്കുന്നവയാണെന്നും ഈ ചട്ടങ്ങൾ മനുഷ്യരുടെ കൽപ്പനകളിലും ഉപദേശങ്ങളിലും അധിഷ്ഠിതമാണെന്നും വാക്യം പറയുന്നു.
  alternative: മനുഷ്യനിർമിത ചട്ടങ്ങൾ തന്നെയാണ് ഉപയോഗത്തിൽ നശിക്കുന്ന വസ്തുക്കളെക്കുറിച്ചുള്ളവ എന്നു കൂടുതൽ തീക്ഷ്ണമായി വായിക്കാം.
  rationale: ἅ എന്നത് ഏറ്റവും സ്വാഭാവികമായി മുൻവാക്യത്തിലെ വസ്തുക്കളെ സൂചിപ്പിക്കുന്നു; അവസാനഭാഗം ചട്ടങ്ങളുടെ മാനുഷിക ഉറവിടത്തെ വിമർശിക്കുന്നു. വിവർത്തനം വിമർശനത്തിന്റെ ലക്ഷ്യം അനാവശ്യമായി ചുരുക്കാതെ ഈ ബന്ധം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘കൽപ്പനകൾ’, ‘ഉപദേശങ്ങൾ’ എന്നിവ തിരുവെഴുത്തിന്റെ ഗൗരവമുള്ള ശൈലി നിലനിർത്തുന്നു; അതേസമയം വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
