source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഭക്ഷണത്തിന്റെയോ പാനീയത്തിന്റെയോ കാര്യത്തിൽ[a], അല്ലെങ്കിൽ ഒരു ഉത്സവത്തിന്റെയോ അമാവാസിയുടെയോ ശബ്ബത്തുകളുടെയോ കാര്യത്തിൽ, ആരും നിങ്ങളെ വിധിക്കരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അതായത്, ഭക്ഷണത്തെയോ പാനീയത്തെയോ സംബന്ധിച്ച കാര്യത്തിൽ.
    reason: cultural_note
  - marker: b
    text: ‘ഉത്സവം, അമാവാസി, ശബ്ബത്തുകൾ’ എന്ന ക്രമം യഹൂദരുടെ വാർഷിക, മാസിക, ആഴ്ചതോറുമുള്ള വിശുദ്ധ കലണ്ടറിനെ പ്രതിധ്വനിപ്പിക്കുന്നു. ‘വിധിക്കരുത്’ എന്നത് ‘നിങ്ങളുടെമേൽ വിധി പ്രസ്താവിക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: അതുകൊണ്ട് ... ആരും നിങ്ങളെ വിധിക്കരുത്
  rationale: οὖν മുൻവാദവുമായി നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം നിരോധനമായി സ്വാഭാവിക മലയാളത്തിൽ ‘ആരും ... അരുത്’ എന്നു നൽകി. κρίνωയുടെ ന്യായവിധി നടത്തുക/കുറ്റപ്പെടുത്തുക എന്ന പരിധി ‘വിധിക്കുക’ നിലനിർത്തുന്നു.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: ഭക്ഷണത്തിന്റെയോ പാനീയത്തിന്റെയോ കാര്യത്തിൽ
  rationale: βρῶσις, πόσις എന്നിവയ്ക്ക് കഴിക്കൽ/കുടിക്കൽ എന്നും ഭക്ഷണം/പാനീയം എന്നും അർഥമാകാം. ആചരണവിഭാഗങ്ങളുടെ പട്ടികയായതിനാൽ ഭക്ഷണപാനീയങ്ങളെ സംബന്ധിച്ച കാര്യങ്ങൾ എന്ന അർഥം യോജിക്കുന്നു; ആവർത്തിക്കുന്ന ἐν മലയാളത്തിൽ സ്വാഭാവികമായി ‘കാര്യത്തിൽ’ എന്നു നൽകി.
- source_word: ἐν μέρει ἑορτῆς
  choice: ഒരു ഉത്സവത്തിന്റെ കാര്യത്തിൽ
  rationale: ἐν μέρει ഇവിടെ ‘ഒരു ഭാഗത്തിൽ’ എന്നല്ല, ‘സംബന്ധിച്ച്/കാര്യത്തിൽ’ എന്ന പ്രയോഗാർത്ഥത്തിലാണ്. ἑορτή മതപരമായ ഉത്സവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: νουμηνίας
  choice: അമാവാസി
  rationale: മാസാന്തര യഹൂദ വിശുദ്ധ കലണ്ടറിലെ പുതുചന്ദ്രാചരണത്തെ സൂചിപ്പിക്കുന്നു. മലയാള ബൈബിൾ-സാംസ്കാരിക പ്രയോഗത്തിൽ ‘അമാവാസി’ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: σαββάτων
  choice: ശബ്ബത്തുകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും വാർഷിക–മാസിക–ആഴ്ചതോറുമുള്ള വിശുദ്ധകാലക്രമത്തിലെ ആഴ്ചതോറുമുള്ള ശബ്ബത്ത് ആചരണങ്ങളെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പട്ടികപ്പെടുത്തിയ ആചാരങ്ങളുടെ സ്വഭാവവും ബാധകതയും
  choice: ഭക്ഷണപാനീയങ്ങളെയും വിശുദ്ധ കലണ്ടറിനെയും സംബന്ധിച്ച് വിശ്വാസികളെ മറ്റുള്ളവർ വിധിക്കുന്നത് വിലക്കുന്നതിലേക്കു വാക്യത്തിന്റെ ശ്രദ്ധ പരിമിതപ്പെടുത്തി.
  alternative: ഈ വാക്യം എല്ലാ ഇത്തരം ആചാരങ്ങളെയും പൂർണമായി റദ്ദാക്കുന്നു; അല്ലെങ്കിൽ മനുഷ്യനിർമിത/സന്യാസപരമായ ചട്ടങ്ങളെ മാത്രം ഉദ്ദേശിക്കുന്നു.
  rationale: ഗ്രീക്ക് പാഠം ഈ കാര്യങ്ങളിൽ വിധിക്കുന്നതിനെ നേരിട്ട് വിലക്കുന്നു; ആചാരങ്ങളുടെ തുടർച്ചയെയോ പൂർണമായ അസാധുതയെയോ ഈ വാക്യം മാത്രം നിർണയിക്കുന്നില്ല. അതിനാൽ കൂടുതൽ ശക്തമായ ഒരു സിദ്ധാന്തനിഗമനം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കാര്യത്തിൽ’ എന്ന ആവർത്തനം ഗ്രീക്ക് ഘടനയുടെ ബന്ധം വ്യക്തമാക്കുന്നു; ദൈവശാസ്ത്രപരമായ അമിതനിഗമനം ഒഴിവാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
