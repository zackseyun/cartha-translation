reference: Colossians 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: ml
  text: അവനിൽ നിങ്ങളും കൈകളാൽ ചെയ്യപ്പെടാത്ത പരിച്ഛേദനത്താൽ[a] പരിച്ഛേദിക്കപ്പെട്ടു—ജഡത്തിന്റെ ശരീരം[b] ഉരിഞ്ഞുമാറ്റുന്നതിൽ[c], മശീഹയുടെ പരിച്ഛേദനത്തിൽ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൈകളാൽ ഉണ്ടാക്കപ്പെടാത്ത പരിച്ഛേദനത്താൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജഡത്തിന്റെ ശരീരം’ എന്ന ഗ്രീക്ക് പ്രയോഗം ‘ജഡികശരീരം’ എന്നും മനസ്സിലാക്കാം; അതിന്റെ കൃത്യമായ ബന്ധം ഉദ്ദേശപൂർവം തുറന്നുവച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ഉരിഞ്ഞുമാറ്റുന്നതിൽ’ എന്നതിന് ‘നീക്കിക്കളയുന്നതിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. മൂലപദത്തിൽ വസ്ത്രം ഉരിയുന്ന രൂപകമുണ്ട്.
    reason: lexical_alternative
  - marker: d
    text: ‘മശീഹയുടെ പരിച്ഛേദനം’ എന്നത് മശീഹ നിർവഹിക്കുന്ന പരിച്ഛേദനത്തെയോ മശീഹയ്ക്കുണ്ടായ പരിച്ഛേദനത്തെയോ അവനോടു ബന്ധപ്പെട്ട പരിച്ഛേദനത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: സമീപസന്ദർഭത്തിൽ ബന്ധസർവനാമം മശീഹയെ സൂചിപ്പിക്കുന്നു. ‘അവനിൽ’ എന്നത് മശീഹയോടുള്ള ഐക്യത്തിന്റെ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: περιετμήθητε
  choice: പരിച്ഛേദിക്കപ്പെട്ടു
  rationale: പൂർത്തിയായ ഒരു നിഷ്ക്രിയ പ്രവർത്തിയെ സൂചിപ്പിക്കുന്ന aorist passive രൂപം നേരിട്ട് നിലനിർത്തുന്നു; രൂപകത്തെ വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കുന്നില്ല.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: കൈകളാൽ ചെയ്യപ്പെടാത്ത പരിച്ഛേദനത്താൽ
  rationale: ദൈവികവും മനുഷ്യനിർമിതമല്ലാത്തതുമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു; ദത്തിവിന്റെ ഉപകരണാർഥവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: ഉരിഞ്ഞുമാറ്റുന്നതിൽ
  rationale: ἀπέκδυσις എന്ന പദത്തിലെ വസ്ത്രമുരിയുന്നതുപോലുള്ള ശക്തമായ രൂപകം ‘ഉരിഞ്ഞുമാറ്റുക’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: ജഡത്തിന്റെ ശരീരം
  rationale: ദുഷ്കരമായ ഗ്രീക്ക് ഷഷ്ഠീബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ഭൗതികശരീരമോ ജഡത്താൽ സ്വഭാവീകരിക്കപ്പെട്ട പഴയ അസ്തിത്വമോ എന്ന വ്യാഖ്യാനസാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: σαρκός
  choice: ജഡം
  rationale: ‘പാപസ്വഭാവം’ എന്നു വ്യാഖ്യാനപരമായി പരിമിതപ്പെടുത്താതെ പൗലോസിന്റെ σάρξ പദത്തിന്റെ രൂപകസാന്ദ്രത നിലനിർത്തുന്നു.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: മശീഹയുടെ പരിച്ഛേദനത്തിൽ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേര് ‘മശീഹ’ എന്നു നൽകുന്നു. τοῦ Χριστοῦ എന്ന ഷഷ്ഠിയുടെ ബന്ധം വിശദീകരിച്ച് ഒരൊറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: ‘മശീഹയുടെ പരിച്ഛേദനം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മശീഹയുടെ പരിച്ഛേദനത്തിൽ
  alternative: മശീഹ നിർവഹിച്ച പരിച്ഛേദനത്താൽ; മശീഹയ്ക്കുണ്ടായ പരിച്ഛേദനത്തിൽ; മശീഹയോടു ബന്ധപ്പെട്ട പരിച്ഛേദനത്തിൽ
  rationale: τοῦ Χριστοῦ എന്ന ഗ്രീക്ക് ഷഷ്ഠി പ്രവർത്തകൻ, ഉടമസ്ഥത, അല്ലെങ്കിൽ ബന്ധം എന്നിവ സൂചിപ്പിക്കാം. ഏതെങ്കിലും ഒരൊറ്റ ദൈവശാസ്ത്രവായന നിർബന്ധിക്കാതെ ഈ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
- issue: ‘ജഡത്തിന്റെ ശരീരം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ജഡത്തിന്റെ ശരീരം
  alternative: ജഡികശരീരം; പാപസ്വഭാവത്തിന്റെ ശരീരം; ജഡത്താൽ നിയന്ത്രിക്കപ്പെട്ട പഴയ അസ്തിത്വം
  rationale: SBLGNTയിലെ ചുരുങ്ങിയതും ദുഷ്കരവുമായ പാഠം അതിന്റെ വ്യാഖ്യാനസമ്മർദത്തോടെ നിലനിർത്തുന്നു; പിൽക്കാല പാഠവികാസങ്ങളോ പ്രത്യേക മനുഷ്യശാസ്ത്രവ്യാഖ്യാനമോ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ ഔപചാരികവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പരിച്ഛേദനം’, ‘ജഡം’, ‘മശീഹ’ എന്നീ ബൈബിൾ-ദൈവശാസ്ത്ര പദങ്ങൾ വ്യാഖ്യാനപരമായി ലഘൂകരിക്കാതെ നിലനിർത്തി; ഡാഷ് ഉപയോഗിച്ച് ഗ്രീക്ക് വാക്യത്തിലെ വിശദീകരണഘടന വ്യക്തമാക്കി.
