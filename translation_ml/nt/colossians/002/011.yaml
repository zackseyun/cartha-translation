  source_fidelity: The Malayalam rendering accurately preserves the aorist passive ('പരിച്ഛേദിക്കപ്പെട്ടു'), the non-handmade circumcision, the difficult 'body of flesh' construction, and the open genitive in 'the circumcision of the Messiah.' The repeated ἐν is retained without prematurely resolving its relation.
