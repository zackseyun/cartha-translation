revisions:
- from: ഞാൻ ശരീരത്തിൽ അകലെയാണെങ്കിലും, ആത്മാവിൽ[a] നിങ്ങളോടുകൂടെയുണ്ട്. നിങ്ങളിലെ ക്രമവും മശീഹയിലുള്ള നിങ്ങളുടെ വിശ്വാസത്തിന്റെ ദൃഢതയും കണ്ട് ഞാൻ സന്തോഷിക്കുന്നു.[b]
  to: എന്തെന്നാൽ, ശരീരത്തിൽ ഞാൻ അകലെയാണെങ്കിലും പോലും, ആത്മാവിൽ ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ട്; നിങ്ങളുടെ ക്രമവും മശീഹയിലുള്ള നിങ്ങളുടെ വിശ്വാസത്തിന്റെ ദൃഢതയും കണ്ട് ഞാൻ സന്തോഷിക്കുന്നു.[a][b]
  rationale: The revision restores the omitted connective and more fully expresses the concessive opening. It retains the draft's sound handling of the body/spirit ambiguity and Messiah terminology. Footnote b is adjusted so that the lexical alternative for πίστις does not alter the meaning of στερέωμα.
