id: COL.2.5
reference: Colossians 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, ശരീരത്തിൽ ഞാൻ അകലെയാണെങ്കിലും പോലും, ആത്മാവിൽ ഞാൻ നിങ്ങളോടുകൂടെ ഉണ്ട്; നിങ്ങളുടെ ക്രമവും മശീഹയിലുള്ള നിങ്ങളുടെ വിശ്വാസത്തിന്റെ ദൃഢതയും കണ്ട് ഞാൻ സന്തോഷിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവിൽ’ എന്നത് ഇവിടെ പൗലോസിന്റെ സ്വന്തം ആത്മാവിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം; ‘പരിശുദ്ധാത്മാവിൽ’ എന്ന വായനയും സാധ്യമാണ്.
    reason: theological_ambiguity
  - marker: b
    text: ‘മശീഹയിലുള്ള നിങ്ങളുടെ വിശ്വാസത്തിന്റെ ദൃഢത’ എന്നതിന് പകരം ‘മശീഹയോടുള്ള നിങ്ങളുടെ വിശ്വസ്തതയുടെ ദൃഢത’ എന്നും അർഥമാക്കാൻ സാധ്യതയുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ σαρκί
  choice: ശരീരത്തിൽ
  rationale: ഇവിടെ σάρξ ധാർമ്മികമായ ‘പാപസ്വഭാവം’ എന്ന അർഥത്തിലല്ല, പൗലോസിന്റെ ശാരീരിക സാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നു. ‘ആത്മാവിൽ’ എന്ന തുടർന്നുള്ള പ്രയോഗത്തോടുള്ള വിരുദ്ധസമാന്തരതയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: τῷ πνεύματι
  choice: ആത്മാവിൽ
  rationale: ശാരീരികമായി അകലെയായിരിക്കുമ്പോഴും ശാരീരികമല്ലാത്ത വിധത്തിൽ കൂടെയുണ്ടെന്ന ആശയം നൽകുന്നു. ഇത് പൗലോസിന്റെ സ്വന്തം ആത്മാവിനെയാണോ പരിശുദ്ധാത്മാവിനെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന ചെറിയ അർഥസാധ്യത വിവർത്തനം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- source_word: τάξιν
  choice: ക്രമം
  rationale: τάξις എന്നത് ക്രമീകരണം, ചിട്ട, ക്രമബദ്ധത എന്നിവ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘നല്ല’ എന്ന വിശേഷണം ചേർക്കാതെ പ്രശംസാത്മകമായ സന്ദർഭം നിലനിർത്തുന്നു.
- source_word: στερέωμα
  choice: ദൃഢത
  rationale: ഉറച്ചതും സ്ഥിരതയും സൂചിപ്പിക്കുന്ന പദം. വിശ്വാസത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ ഈ സന്ദർഭത്തിലെ സ്വാഭാവികമായ മുഖ്യാർഥം ‘വിശ്വാസം’ ആണ്; ‘വിശ്വസ്തത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰς Χριστόν
  choice: മശീഹയിലുള്ള
  rationale: εἰς വിശ്വാസത്തിന്റെ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: χαίρων καὶ βλέπων
  choice: കണ്ട് ഞാൻ സന്തോഷിക്കുന്നു
  rationale: രണ്ട് വർത്തമാന കൃദന്തരൂപങ്ങളുടെയും സമകാലികബന്ധം സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ നൽകുന്നു; ‘കാണുക’ എന്നത് ഇവിടെ നിരീക്ഷിച്ചറിയുക എന്ന വിശാലതയും വഹിക്കുന്നു.
theological_decisions:
- issue: ‘ശരീരത്തിൽ ... ആത്മാവിൽ’ എന്ന വിരുദ്ധപ്രയോഗത്തിൽ ആത്മാവിന്റെ സൂചന
  choice: പൗലോസ് ശാരീരികമായി ഇല്ലെങ്കിലും ആത്മാവിൽ അവരോടുകൂടെ ഉണ്ടെന്ന നിലയിൽ തുറന്നുവെച്ചു.
  alternative: പരിശുദ്ധാത്മാവിനാൽ പൗലോസ് അവരോടുകൂടെ ഉണ്ടെന്ന വായന.
  rationale: ശരീരത്തിലെ അഭാവത്തോടുള്ള നേരിട്ടുള്ള വിരുദ്ധത പൗലോസിന്റെ ശാരീരികമല്ലാത്ത വ്യക്തിപരമായ സാന്നിധ്യത്തെ മുൻനിർത്തുന്നു; എങ്കിലും ‘ആത്മാവ്’ എന്ന പ്രയോഗം കൂടുതൽ പ്രത്യേകമായി നിർവചിക്കാതെ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ വിശ്വാസത്തിന്റെ ലക്ഷ്യമായ അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്; അതിനാൽ അർഥം സുതാര്യമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: εἰς Χριστόν എന്ന ഘടനയിൽ ‘മശീഹയിലുള്ള വിശ്വാസം’ ആണ് ഏറ്റവും സ്വാഭാവികമായ വായന. പദത്തിനുള്ള ‘വിശ്വസ്തത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; ആശയബന്ധം മാറ്റിയിട്ടില്ല. ‘ശരീരത്തിൽ/ആത്മാവിൽ’ എന്ന മൂലരൂപകസമാന്തരതയും τάξις–στερέωμα എന്ന ക്രമം/ദൃഢത കൂട്ടുചിത്രവും സംരക്ഷിച്ചു.
