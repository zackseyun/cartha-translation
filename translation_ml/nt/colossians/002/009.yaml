source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/009.yaml
  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്വത്തിന്റെ മുഴുവൻ സമ്പൂർണതയും അവനിൽ ശാരീരികമായി വസിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്വത്തിന്റെ സകല സമ്പൂർണതയും അവനിൽ ശാരീരികമായി വസിക്കുന്നു.’
    reason: πᾶν τὸ πλήρωμα എന്ന പ്രയോഗത്തിലെ സമഗ്രതയെ പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികമായ പദപര്യായം നൽകുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന് അടിസ്ഥാനം നൽകുന്ന കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: മശീഹയെ സൂചിപ്പിക്കുന്ന ലളിതമായ സ്ഥാനസൂചക പ്രയോഗം; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘അവനിൽ മാത്രം’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: κατοικεῖ
  choice: വസിക്കുന്നു
  rationale: സ്ഥിരവും തുടരുന്നതുമായ അധിവാസത്തിന്റെ അർഥം മലയാളത്തിൽ ഗൗരവത്തോടെയും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: πᾶν τὸ πλήρωμα
  choice: സമ്പൂർണത മുഴുവനും
  rationale: πᾶν എന്ന സമഗ്രതയും articular πλήρωμα എന്ന പൂർണതയും ആവർത്തനദോഷമില്ലാതെ കഴിയുന്നത്ര വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τῆς θεότητος
  choice: ദൈവത്വത്തിന്റെ
  rationale: θεότης വെറും ദൈവിക ഗുണങ്ങളെയല്ല, ദൈവമായിരിക്കുന്ന യാഥാർഥ്യത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; ‘ദൈവത്വം’ അതിന്റെ ബലം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: σωματικῶς
  choice: ശാരീരികമായി
  rationale: ഗ്രീക്ക് ക്രിയാവിശേഷണത്തെ നേരിട്ട് പ്രതിനിധീകരിക്കുകയും ‘ശരീരരൂപത്തിൽ’ അല്ലെങ്കിൽ ‘ഒരു ശരീരത്തിൽ’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: θεότης, σωματικῶς എന്നീ പദങ്ങളുടെ ക്രിസ്തുശാസ്ത്രപരമായ ശക്തി
  choice: ദൈവത്വത്തിന്റെ മുഴുവൻ സമ്പൂർണതയും ക്രിസ്തുവിൽ ശാരീരികമായി വസിക്കുന്നു എന്ന് വാക്യം ഉറപ്പിക്കുന്നു.
  alternative: ക്രിസ്തുവിൽ ദൈവിക ഗുണങ്ങളോ ദൈവസാന്നിധ്യമോ മാത്രമേ വസിക്കുന്നുള്ളൂ എന്ന ദുർബലമായ വായന.
  rationale: θεότης ദൈവിക ഗുണങ്ങളെക്കാൾ ശക്തമായി ദൈവത്വത്തിന്റെ യാഥാർഥ്യത്തെ സൂചിപ്പിക്കുന്നു; σωματικῶς ആ വാസത്തെ ശാരീരികമെന്ന് വിശേഷിപ്പിക്കുന്നു. അതിനാൽ വാക്യത്തിന്റെ ഉന്നതമായ ക്രിസ്തുശാസ്ത്രാവകാശം ദുർബലപ്പെടുത്താതെയും അതിന്റെ രീതി അതിരുകടന്ന് വിശദീകരിക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വാക്യത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ശാരീരികമായി’ എന്ന സംക്ഷിപ്തത മൂലപാഠത്തിലെ യഥാർഥ വ്യാഖ്യാനവ്യാപ്തി തുറന്നുവെക്കുന്നു.
