reference: Colossians 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: ml
  text: 'ഇവയ്ക്ക് ജ്ഞാനത്തിന്റെ ഒരു ഭാവമുണ്ട്[a]: സ്വയംനിർമിതമായ ആരാധനയിലും[b] താഴ്മയിലും ശരീരത്തെ കഠിനമായി കൈകാര്യം ചെയ്യുന്നതിലും; എന്നാൽ ജഡത്തിന്റെ മോഹങ്ങളുടെ തൃപ്തിയെ തടയുന്നതിൽ ഇവയ്ക്ക് യാതൊരു മൂല്യവുമില്ല[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ജ്ഞാനമുള്ളവയെന്ന പേരുണ്ട്.”'
    reason: lexical_alternative
  - marker: b
    text: “സ്വയംനിർമിതമായ ആരാധന” എന്നതിന് “സ്വയം ഏർപ്പെടുത്തിയ ആരാധന” എന്നും പരിഭാഷപ്പെടുത്താം; പരമ്പരാഗതമായി “ഇച്ഛാനുസൃത ആരാധന.”
    reason: lexical_alternative
  - marker: c
    text: 'അവസാന ഉപവാക്യം ദുഷ്കരമാണ്. അഥവാ: “അവയ്ക്ക് യാതൊരു ബഹുമാനവുമില്ല; അവ ജഡത്തിന്റെ തൃപ്തിക്കായുള്ളവയാണ്,” അല്ലെങ്കിൽ “ജഡത്തിന്റെ മോഹങ്ങളുടെ തൃപ്തിക്കെതിരെ അവയ്ക്ക് യാതൊരു മൂല്യവുമില്ല.”'
    reason: alternative_reading
  - marker: d
    text: “ജഡം” ഇവിടെ വീണുപോയ മനുഷ്യന്റെ മോഹങ്ങളെ സൂചിപ്പിക്കാം; പൗലോസ് മറ്റിടങ്ങളിൽ ഈ പദം ഉപയോഗിക്കുന്ന സന്ദർഭങ്ങളുമായി താരതമ്യം ചെയ്യുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: ഇവയ്ക്ക്
  rationale: മുൻവാക്യങ്ങളിലെ ചട്ടങ്ങളെ സൂചിപ്പിക്കുന്ന അന്വയശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: ജ്ഞാനത്തിന്റെ ഒരു ഭാവമുണ്ട്
  rationale: λόγον ἔχειν എന്ന പ്രയോഗത്തിലെ കീർത്തി/പ്രതീതി എന്ന അർഥവും μέν സൂചിപ്പിക്കുന്ന concessive ഭാവവും വ്യക്തമാക്കുന്നു; യഥാർഥ ജ്ഞാനമാണെന്ന് ഉറപ്പിക്കുന്നില്ല.
- source_word: ἐθελοθρησκίᾳ
  choice: സ്വയംനിർമിതമായ ആരാധന
  rationale: സ്വന്തം ഇച്ഛയിൽനിന്നു രൂപപ്പെടുത്തിയ മതാനുഷ്ഠാനം/ആരാധന എന്ന അപൂർവപദത്തിന്റെ നിഷേധാത്മക സൂചന നിലനിർത്തുന്നു.
- source_word: ταπεινοφροσύνῃ
  choice: താഴ്മ
  rationale: പദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; ഇവിടെ അത് പ്രകടനപരമോ തപസ്സുസംബന്ധമോ ആയിരിക്കാമെന്ന പരിഹാസസൂചന സന്ദർഭത്തിൽനിന്നു ലഭിക്കുന്നു.
- source_word: ἀφειδίᾳ σώματος
  choice: ശരീരത്തോടുള്ള കഠിനമായ പെരുമാറ്റം
  rationale: ശരീരത്തെ കരുതാതെ കർശനമായി കൈകാര്യം ചെയ്യുന്ന തപസ്സാചാരത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: യാതൊരു മൂല്യവുമില്ല
  rationale: ദുഷ്കരമായ വാക്യഘടനയിൽ τιμήയെ പ്രയോജനം/മൂല്യം എന്ന അർഥത്തിൽ ഗ്രഹിച്ച് മുൻപറഞ്ഞ ജ്ഞാനപ്രതീതിയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: πρὸς πλησμονὴν
  choice: മോഹപൂർത്തിയെ തടയുന്നതിൽ
  rationale: സന്ദർഭത്തിൽ ജഡിക തൃപ്തിയെ നിയന്ത്രിക്കാനുള്ള ഫലപ്രാപ്തിയില്ലായ്മ എന്ന പ്രധാന വായന സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിൽ 'തടയുക' നേരിട്ട് ഇല്ലാത്തതിനാൽ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τῆς σαρκός
  choice: ജഡത്തിന്റെ
  rationale: σάρξ എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് 'പാപസ്വഭാവം' എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός എന്ന ദുഷ്കരമായ അവസാന ഉപവാക്യത്തിന്റെ അർഥം
  choice: ഈ തപസ്സാചാരങ്ങൾക്ക് ജഡത്തിന്റെ മോഹപൂർത്തിയെ തടയുന്നതിൽ യാതൊരു മൂല്യവുമില്ല.
  alternative: “അവയ്ക്ക് യാതൊരു ബഹുമാനവുമില്ല; അവ ജഡത്തിന്റെ തൃപ്തിക്കായുള്ളവയാണ്,” അല്ലെങ്കിൽ “ജഡത്തിന്റെ മോഹപൂർത്തിക്കെതിരെ അവയ്ക്ക് യാതൊരു മൂല്യവുമില്ല.”
  rationale: ഗ്രീക്ക് വാക്യഘടന സംക്ഷിപ്തവും വിവാദവിധേയവുമാണ്. ജ്ഞാനമുള്ളതായി തോന്നുന്ന ചട്ടങ്ങൾ ജഡിക മോഹങ്ങളെ നിയന്ത്രിക്കാൻ അശക്തമാണെന്ന വായന സന്ദർഭത്തിന്റെ വാദഗതിയോട് ഏറ്റവും നന്നായി യോജിക്കുന്നു; എന്നാൽ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: σάρξ എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ജഡം
  alternative: പാപമയമായ മനുഷ്യാഭിലാഷങ്ങൾ / പാപസ്വഭാവം
  rationale: മനുഷ്യന്റെ വീണുപോയ മോഹങ്ങളെയാകാം ഇവിടെ സൂചിപ്പിക്കുന്നത്; എന്നിരുന്നാലും മൂലപദത്തിന്റെ വിശാലതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കാൻ വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദുഷ്കരമായ അവസാന ഉപവാക്യം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചെങ്കിലും അതിന്റെ യഥാർഥ വ്യാകരണ-അർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
