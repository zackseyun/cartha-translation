id: COL.2.12
reference: Colossians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: ml
  text: സ്നാനത്തിൽ അവനോടുകൂടെ അടക്കപ്പെട്ട നിങ്ങൾ, അതിൽ നിങ്ങൾ അവനോടുകൂടെ ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തു—അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള വിശ്വാസത്തിലൂടെ.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ബന്ധസർവനാമം സ്നാനത്തെയല്ല, മശീഹയെയാണ് സൂചിപ്പിക്കുന്നതെന്നു കരുതിയാൽ, “അവനിൽ.”
    reason: alternative_reading
  - marker: b
    text: “വിശ്വാസം” എന്നതിന് “ആശ്രയം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ “വിശ്വസ്തത” എന്ന അർഥവും വരാം; ഇവിടെ “വിശ്വാസം” എന്നതാണ് മുഖ്യപരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: അവനോടുകൂടെ അടക്കപ്പെട്ട നിങ്ങൾ
  rationale: ആഓറിസ്റ്റ് കർമണിപ്രയോഗത്തിലുള്ള പങ്കാളിത്തക്രിയയെയും συν- എന്നതിലെ ‘കൂടെ’ എന്ന ആശയത്തെയും നിലനിർത്തുന്നു; വാക്യത്തിലെ മുഖ്യക്രിയയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐν τῷ βαπτισμῷ
  choice: സ്നാനത്തിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥാനപരവും ഉപാധിപരവുമായ സാധ്യതകൾ അതിയായി നിർവചിക്കാതെ സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν ᾧ
  choice: അതിൽത്തന്നെ
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണപൂർവപദമായ ‘സ്നാനം’ എന്നതിലേക്കുള്ള ബന്ധം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഊന്നൽ നൽകുന്ന καί-യുടെ ഭാവവും പ്രകടമാക്കുന്നു.
- source_word: συνηγέρθητε
  choice: അവനോടുകൂടെ ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തു
  rationale: ആഓറിസ്റ്റ് കർമണിപ്രയോഗവും συν- എന്ന ‘കൂടെ’ ഘടകവും വ്യക്തമാക്കുന്നു; ‘അവനോടുകൂടെ’ എന്നത് സംയുക്തക്രിയയിലും സമീപസന്ദർഭത്തിലും ഉൾക്കൊള്ളുന്നതാണ്.
- source_word: διὰ τῆς πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά സഹിതമുള്ള ഉപാധിയുടെ അർഥവും πίστις എന്നതിന്റെ ഇവിടെ ഏറ്റവും സാധ്യതയുള്ള ‘വിശ്വാസം’ എന്ന അർഥവും നൽകുന്നു.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള
  rationale: ἐνέργεια ദൈവത്തിന്റെ സജീവവും ഫലപ്രദവുമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; വെറും അമൂർത്തമായ ‘ശക്തി’ എന്നതിലേക്ക് ചുരുക്കുന്നില്ല. ജനിറ്റീവ് ഘടനയെ ‘പ്രവർത്തനത്തിലുള്ള വിശ്വാസം’ എന്ന സ്വാഭാവിക മലയാളബന്ധത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച
  rationale: ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന ആർട്ടിക്കുലർ പങ്കാളിത്തക്രിയയെ സ്വാഭാവിക മലയാള വിശേഷണവാക്യമായി നൽകുകയും പുനരുത്ഥാനഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν ᾧ എന്നതിന്റെ പൂർവപദം
  choice: ‘അതിൽത്തന്നെ’—സ്നാനത്തെ സൂചിപ്പിക്കുന്നു
  alternative: ‘അവനിൽത്തന്നെ’—മശീഹയെ സൂചിപ്പിക്കുന്നു
  rationale: സമീപസ്ഥമായ βαπτισμῷ ആണ് വ്യാകരണപരമായി കൂടുതൽ സ്വാഭാവികമായ പൂർവപദം. എന്നാൽ രൂപപരമായി മറ്റൊരു ബന്ധസാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: സ്നാനഭാഷയുടെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: സ്നാനം, മശീഹയോടുള്ള ഐക്യം, വിശ്വാസം, ദൈവത്തിന്റെ പ്രവർത്തനം എന്നിവയ്ക്കിടയിലെ ശക്തമായ ബന്ധം അതേപടി നിലനിർത്തുന്നു
  alternative: ഇത് നിർബന്ധമായും ഒരു പ്രത്യേക സാക്രമെന്റൽ സിദ്ധാന്തമോ പൂർണമായും പ്രതീകാത്മകമായ വായനയോ പഠിപ്പിക്കുന്നു എന്ന് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാചകം ഈ ആശയങ്ങളെ അടുത്ത് ബന്ധിപ്പിക്കുന്നുവെങ്കിലും പിൽക്കാല വിഭാഗീയ സിദ്ധാന്തവിവാദങ്ങളെ സ്വയം തീർപ്പാക്കുന്നില്ല.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ ഘടനയിൽ ദൈവത്തിന്റെ ഉയിർപ്പിക്കുന്ന പ്രവർത്തനത്തിൽ ആശ്രയിക്കുന്ന വിശ്വാസമാണ് മുഖ്യസാധ്യത. ‘ആശ്രയം’ സാധ്യമെങ്കിലും ‘വിശ്വസ്തത’ ഇവിടെ കുറവ് സാധ്യതയുള്ളതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അടക്കപ്പെട്ട’, ‘ഉയിർപ്പിക്കപ്പെട്ടു’ എന്നീ കർമണിരൂപങ്ങൾ ഗ്രീക്കിന്റെ കർമണിപ്രയോഗവും ദൈവിക പ്രവർത്തനവും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
