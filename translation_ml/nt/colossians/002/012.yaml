revisions:
- from: സ്നാനത്തിൽ അവനോടുകൂടെ അടക്കപ്പെട്ട നിങ്ങൾ, അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള വിശ്വാസത്തിലൂടെ, അതിൽത്തന്നെ[a] അവനോടുകൂടെ ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തു.[b]
  to: സ്നാനത്തിൽ അവനോടുകൂടെ അടക്കപ്പെട്ട നിങ്ങൾ, അതിൽ നിങ്ങൾ അവനോടുകൂടെ ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തു—അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള വിശ്വാസത്തിലൂടെ.[b][a]
  rationale: 'καί-യുടെ അർഥം പുനഃസ്ഥാപിക്കുകയും, πίστις-സംബന്ധിയായ അടിക്കുറിപ്പ് അതത് പദത്തോടു ചേർക്കുകയും ചെയ്തിരിക്കുന്നു. എന്നാൽ പരിഷ്കരിച്ച പാഠത്തിൽ [a] വാചകത്തിലെ ἐν ᾧ-യോട് നേരിട്ട് ചേർക്കണം; ശരിയായ ചിഹ്നക്രമത്തോടെയുള്ള പൂർണപാഠം ഇതാണ്: ‘സ്നാനത്തിൽ അവനോടുകൂടെ അടക്കപ്പെട്ട നിങ്ങൾ, അതിൽ[a] നിങ്ങൾ അവനോടുകൂടെ ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തു—അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള വിശ്വാസത്തിലൂടെ.[b]’'
