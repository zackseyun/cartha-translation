  naturalness: ‘അതിൽ നിങ്ങൾ അവനോടുകൂടെ ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തു’ എന്ന ക്രമം ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘കൂടുകയും’ എന്ന രൂപം മുൻപുള്ള ‘അടക്കപ്പെട്ട’ ക്രിയയോടുള്ള തുടർച്ചയും ‘also’ എന്ന ഭാവവും അറിയിക്കുന്നു.
  terminology: ‘സ്നാനം,’ ‘വിശ്വാസം,’ ‘ദൈവത്തിന്റെ പ്രവർത്തനം,’ ‘മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചു’ എന്നിവ യോജിച്ചതും മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നതുമാണ്. ബദൽവായനയിൽ ‘അവനിൽ’ എന്നു മാത്രം നൽകുന്നു; മൂലത്തിൽ പ്രത്യേക ‘തന്നെ’ ഊന്നൽ ഇല്ല.
