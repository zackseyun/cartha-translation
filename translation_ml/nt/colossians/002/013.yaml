revisions:
- from: നിങ്ങളോ, നിങ്ങളുടെ അതിക്രമങ്ങളിലും നിങ്ങളുടെ ജഡത്തിന്റെ പരിച്ഛേദനമില്ലായ്മയിലും മരിച്ചവരായിരിക്കെ, ദൈവം നിങ്ങളെ അവനോടുകൂടെ ജീവിപ്പിച്ചു; നമ്മുടെ എല്ലാ അതിക്രമങ്ങളും നമ്മോടു ക്ഷമിച്ചുകൊണ്ട്.[a][b]
  to: നിങ്ങളോ, നിങ്ങളുടെ അതിക്രമങ്ങളിലും നിങ്ങളുടെ ജഡത്തിന്റെ പരിച്ഛേദനമില്ലായ്മയിലും മരിച്ചവരായിരിക്കെ, അവൻ നിങ്ങളെ അവനോടുകൂടെ ജീവിപ്പിച്ചു; നമ്മുടെ എല്ലാ അതിക്രമങ്ങളും ക്ഷമിച്ചുകൊണ്ട്.[a]
  rationale: The revision removes the explicitly supplied subject ‘ദൈവം’ to follow the Greek’s unexpressed subject while retaining Malayalam clarity through ‘അവൻ.’ It recasts the forgiveness clause into idiomatic Malayalam, preserves the Greek shift from ‘you’ to ‘us/our,’ retains ‘ജഡം’ and ‘പരിച്ഛേദനമില്ലായ്മ’ without doctrinal expansion, and moves the sole necessary note to the exact phrase where the person shift occurs. The cultural note is omitted because the main translation is adequately clear and does not require a note to preserve source meaning.
