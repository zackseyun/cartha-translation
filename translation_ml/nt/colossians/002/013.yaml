source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: ml
  text: നിങ്ങളോ, നിങ്ങളുടെ അതിക്രമങ്ങളിലും നിങ്ങളുടെ ജഡത്തിന്റെ പരിച്ഛേദനമില്ലായ്മയിലും മരിച്ചവരായിരിക്കെ, അവൻ നിങ്ങളെ അവനോടുകൂടെ ജീവിപ്പിച്ചു; നമ്മുടെ എല്ലാ അതിക്രമങ്ങളും ക്ഷമിച്ചുകൊണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്കിൽ ‘നിങ്ങൾ’ എന്നതിൽനിന്ന് ഒന്നാംപുരുഷ ബഹുവചനമായ ‘നമുക്ക്/നമ്മുടെ’ എന്നതിലേക്കു മാറ്റമുണ്ട്: ‘നമ്മുടെ എല്ലാ അതിക്രമങ്ങളും ക്ഷമിച്ചുകൊണ്ട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: മരിച്ചവരായിരിക്കെ
  rationale: ὄντας എന്ന വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന നിലയും പ്രധാനക്രിയയോടുള്ള ബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: നിങ്ങളുടെ അതിക്രമങ്ങളിലും
  rationale: ἐν എന്നതിന്റെ പരിധി/അവസ്ഥാസൂചന നിലനിർത്തുന്നു; παράπτωμα എന്നതിന് സന്ദർഭോചിതമായ ‘അതിക്രമം’ ഉപയോഗിക്കുന്നു.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: നിങ്ങളുടെ ജഡത്തിന്റെ പരിച്ഛേദനമില്ലായ്മയിലും
  rationale: ശാരീരികമായി പരിച്ഛേദന ഏൽക്കാത്ത അവസ്ഥയാണ് നേരിട്ടുള്ള അർഥം; ആത്മീയ സൂചനയെ മുഖ്യവാചകത്തിൽ നിർബന്ധിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: നിങ്ങളെ അവനോടുകൂടെ ജീവിപ്പിച്ചു
  rationale: സംയുക്തക്രിയയുടെയും σύν എന്നതിന്റെയും സഹപങ്കാളിത്തസൂചന ‘അവനോടുകൂടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: χαρισάμενος
  choice: ക്ഷമിച്ചുകൊണ്ട്
  rationale: χαρίζομαι ഇവിടെ കൃപാപൂർവമായ ക്ഷമയെ സൂചിപ്പിക്കുന്നു; കൃദന്തരൂപത്തിന്റെ പ്രധാനക്രിയയോടുള്ള അടുത്ത ബന്ധം നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: നമ്മോടു
  rationale: ഗ്രീക്കിലെ രണ്ടാംപുരുഷമായ ‘നിങ്ങൾ’ എന്നതിൽനിന്ന് ഒന്നാംപുരുഷ ബഹുവചനമായ ‘നമുക്ക്/നമ്മോടു’ എന്നതിലേക്കുള്ള മാറ്റം സമന്വയിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: πάντα τὰ παραπτώματα
  choice: നമ്മുടെ എല്ലാ അതിക്രമങ്ങളും
  rationale: ‘എല്ലാ’ എന്ന സമഗ്രതയും മുമ്പത്തെ παράπτωμα എന്ന പദത്തോടുള്ള പദസാമ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῆς σαρκὸς ὑμῶν എന്നതിലെ σάρξ-ന്റെ അർഥം
  choice: ‘ജഡം’—നേരിട്ടുള്ള ശാരീരിക അർഥം, ആത്മീയ അനുരണനം തുറന്നുവെക്കുന്നു
  alternative: ‘പാപസ്വഭാവം’
  rationale: സമീപസന്ദർഭത്തിലെ പരിച്ഛേദനഭാഷ ശാരീരിക അർഥത്തെ ആദ്യം പിന്തുണയ്ക്കുന്നു; ‘പാപസ്വഭാവം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് പാഠം നിർബന്ധിക്കാത്ത വ്യാഖ്യാനം ഉറപ്പിച്ചുകളയും.
- issue: σὺν αὐτῷ എന്നതിലെ αὐτῷ-ന്റെ സൂചിതൻ
  choice: ‘അവനോടുകൂടെ’ എന്ന സർവനാമം നിലനിർത്തി, സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കാൻ അനുവദിക്കുന്നു
  alternative: ‘ക്രിസ്തുവിനോടുകൂടെ’ എന്നു വ്യക്തമായി ചേർക്കുക
  rationale: 2:12-ലെ അടക്കവും ഉയിർപ്പും സംബന്ധിച്ച സന്ദർഭം ക്രിസ്തുവിലേക്കാണ് ചൂണ്ടുന്നത്; എങ്കിലും മൂലത്തിലെ സർവനാമം മാറ്റാതെ സൂക്ഷിക്കുന്നു.
- issue: συνεζωοποίησεν എന്ന ക്രിയയുടെ വ്യാകരണകർത്താവ്
  choice: വ്യക്തതയ്ക്കായി ‘ദൈവം’ എന്നു നൽകിയിരിക്കുന്നു
  alternative: മൂലത്തിൽ വ്യക്തമായി ആവർത്തിക്കാത്ത കർത്താവിനെ ഒഴിവാക്കി ‘ജീവിപ്പിച്ചു’ എന്നു മാത്രം നൽകുക
  rationale: മുൻസന്ദർഭത്തിൽ പ്രവർത്തിക്കുന്നവൻ ദൈവമാണ്; മലയാളത്തിൽ കർത്താവില്ലാത്ത ദീർഘവാക്യം അസ്പഷ്ടമാകുന്നതിനാൽ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായ കർത്താവ് തുറന്നുപറയുന്നു, എന്നാൽ ഇത് മൂലവാക്യത്തിൽ ഈ സ്ഥാനത്ത് പ്രകടമല്ലെന്നത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അതിക്രമം’, ‘ജഡം’, ‘പരിച്ഛേദനം’ എന്നീ പദങ്ങൾ പൗലോസിന്റെ നിയമ-ശരീര പ്രതീകഭാഷയും അർഥതലങ്ങളിലെ സംഘർഷവും നിലനിർത്തുന്നു.
