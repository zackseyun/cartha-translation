id: COL.2.20
reference: Colossians 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: ml
  text: 'നിങ്ങൾ മശിഹായോടുകൂടെ ലോകത്തിന്റെ അടിസ്ഥാന തത്ത്വങ്ങളിൽനിന്ന് മരിച്ചു എങ്കിൽ[a], ലോകത്തിൽ ജീവിക്കുന്നവരെപ്പോലെ എന്തിന് നിങ്ങൾ ചട്ടങ്ങൾക്കു കീഴടങ്ങുന്നു[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “ലോകത്തിന്റെ മൂലശക്തികളിൽനിന്ന്”; മറ്റൊരു സാധ്യത: “ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങളിൽനിന്ന്.”'
    reason: alternative_reading
  - marker: b
    text: അഥവാ “എന്തിന് ചട്ടങ്ങൾക്കു കീഴ്പ്പെടുത്തപ്പെടുന്നു?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: ആണെങ്കിൽ
  rationale: സന്ദർഭത്തിൽ വ്യവസ്ഥ സത്യമായി കരുതപ്പെടുന്നുണ്ടാകാമെങ്കിലും, ഗ്രീക്കിലെ വ്യവസ്ഥാരൂപം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ἀπεθάνετε
  choice: മരിച്ചവരാണെങ്കിൽ
  rationale: മശിഹായോടുള്ള ഐക്യത്തിൽ നടന്ന നിർണായകമായ മരണത്തെ സൂചിപ്പിക്കുന്ന aorist രൂപം; മലയാളത്തിലെ വ്യവസ്ഥാവാക്യത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: σὺν Χριστῷ
  choice: മശിഹായോടുകൂടെ
  rationale: Χριστός എന്ന അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്താൻ ‘മശിഹാ’ ഉപയോഗിച്ചു.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: ലോകത്തിന്റെ അടിസ്ഥാന തത്ത്വങ്ങളിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വേർപാട് ‘-യിൽനിന്ന്’ വ്യക്തമാക്കുന്നു. στοιχεῖα എന്നത് അടിസ്ഥാന ഘടകങ്ങൾ, തത്ത്വങ്ങൾ, അഥവാ മൂലശക്തികൾ എന്നിങ്ങനെ ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാനവാചകത്തിൽ താരതമ്യേന തുറന്ന ‘അടിസ്ഥാന തത്ത്വങ്ങൾ’ സ്വീകരിച്ചു.
- source_word: τί
  choice: എന്തിന്
  rationale: വാചകത്തിലെ ആലങ്കാരിക ചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: ഇപ്പോഴും ലോകത്തിൽ ജീവിക്കുന്നവരെപ്പോലെ
  rationale: ὡς സഹിതമുള്ള participle-ന്റെ താരതമ്യാത്മക ഭാവം നിലനിർത്തുന്നു; ‘ഇപ്പോഴും’ എന്നത് സന്ദർഭത്തിലെ വിരോധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δογματίζεσθε
  choice: ചട്ടങ്ങൾക്കു കീഴടങ്ങുന്നു
  rationale: middle/passive രൂപത്തിലെ, ചട്ടങ്ങളാൽ നിയന്ത്രിക്കപ്പെടുക അഥവാ അവയ്ക്കു സ്വയം വിധേയരാകുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിലെ στοιχεῖα എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘അടിസ്ഥാന തത്ത്വങ്ങൾ’
  alternative: ‘മൂലശക്തികൾ’ അഥവാ ‘അടിസ്ഥാന ഘടകങ്ങൾ’
  rationale: ഈ പദം ലോകക്രമത്തിന്റെ പ്രാഥമിക തത്ത്വങ്ങളെയോ ആത്മീയ/പ്രപഞ്ചശക്തികളെയോ സൂചിപ്പിക്കാം. ഒരു പ്രത്യേക പ്രപഞ്ചവീക്ഷണം അടിച്ചേൽപ്പിക്കാതെ അവ്യക്തത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
- issue: δογματίζεσθε എന്ന ക്രിയയുടെ middle/passive ഭാവം
  choice: ‘ചട്ടങ്ങൾക്കു കീഴടങ്ങുന്നു’
  alternative: ‘ചട്ടങ്ങൾക്കു കീഴ്പ്പെടുത്തപ്പെടുന്നു’
  rationale: വായനക്കാരുടെ പങ്കാളിത്തം വ്യക്തമാക്കുന്ന reflexive ആശയം പ്രധാനവാചകത്തിൽ സ്വീകരിച്ചെങ്കിലും passive സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യഭാവവും അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച സൂചിപ്പിക്കുന്ന ദ്വിബിന്ദുവും നിലനിർത്തി; എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
