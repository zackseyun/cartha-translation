  to: അവനിൽ വേരൂന്നപ്പെട്ടവരായി, പണിതുയർത്തപ്പെടുകയും, നിങ്ങളെ പഠിപ്പിച്ചതുപോലെ വിശ്വാസത്തിൽ[a] ഉറപ്പിക്കപ്പെടുകയും, നന്ദിയിൽ നിറഞ്ഞുകവിഞ്ഞും ഇരിക്കുവിൻ.
  rationale: നന്ദിയുടെ ബന്ധം 'നന്ദിയിൽ' എന്നു തിരുത്തി, മൂലത്തിലെ ἐν εὐχαριστίᾳ-യുടെ അർഥം ഉപാധി/കാരണം എന്നതിലേക്ക് മാറുന്നത് ഒഴിവാക്കി. തുടർച്ചയായ നിർമാണ-സ്ഥിരീകരണ പ്രവൃത്തികൾക്ക് കൂടുതൽ സ്വാഭാവികമായ സമാന്തരരൂപം ഉപയോഗിച്ചു. 'വിശ്വാസത്തിൽ' എന്ന പ്രയോഗം മലയാളത്തിന്റെ ലേഖനരഹിത സ്വഭാവത്തിന് യോജിക്കുന്നു; പഠിപ്പിക്കപ്പെട്ട വിശ്വാസം എന്ന സാന്ദർഭിക വ്യാഖ്യാനവും പര്യാപ്ത അർഥസാധ്യതകളും അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
