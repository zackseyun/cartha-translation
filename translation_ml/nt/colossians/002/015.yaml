id: COL.2.15
reference: Colossians 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: ml
  text: ഭരണാധികാരികളെയും അധികാരശക്തികളെയും നിരായുധരാക്കിയശേഷം, ദൈവം അവരെ പരസ്യമായി പ്രദർശിപ്പിച്ചു; ക്രിസ്തുവിൽ അവരെ ജയിച്ചുകൊണ്ട് വിജയഘോഷയാത്ര നടത്തി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിൽ,” അതായത് ക്രൂശിൽ.
    reason: ἐν αὐτῷ എന്ന പ്രയോഗം ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം; അതേസമയം, മുമ്പുള്ള ക്രൂശ്-സന്ദർഭത്തെ സൂചിപ്പിച്ച് ‘അതിൽ’ എന്നും മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: നിരായുധരാക്കിയശേഷം
  rationale: ക്രിയയുടെ അടിസ്ഥാനചിത്രം ‘ഊരിമാറ്റുക/അഴിച്ചുകളയുക’ എന്നതാണ്; ഇവിടെ അധികാരശക്തികളുടെ ശക്തിയും ആയുധവും കവർന്നുകളഞ്ഞു എന്ന വിജയസന്ദർഭം സ്വാഭാവികമായി അറിയിക്കാൻ ‘നിരായുധരാക്കി’ ഉപയോഗിച്ചു.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: ഭരണാധികാരികളെയും അധികാരശക്തികളെയും
  rationale: രണ്ട് ബഹുവചന പദങ്ങളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ അവ മനുഷ്യഭരണാധികാരികൾ മാത്രമല്ല, വൈരിയായ അതീന്ദ്രിയ ശക്തികളെയും സൂചിപ്പിക്കാമെന്ന തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: പരസ്യമായി പ്രദർശിപ്പിക്കുകയും
  rationale: പൊതുജനമധ്യേ തുറന്നുകാട്ടി അപമാനിക്കുന്ന വിജയദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: θριαμβεύσας αὐτοὺς
  choice: അവരുടെമേൽ വിജയഘോഷയാത്ര നടത്തുകയും ചെയ്തു
  rationale: റോമൻ വിജയഘോഷയാത്രയുടെ ദൃശ്യരൂപം വെറും ‘ജയിച്ചു’ എന്നതിലുപരി നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗമായ ‘അവനിൽ’ എന്നും നപുംസകലിംഗമായ ‘അതിൽ’ എന്നും വായിക്കാവുന്നതാണ്; മുഖ്യപാഠത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ‘അവനിൽ’ സ്വീകരിച്ചു, മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions:
- issue: ἀπεκδυσάμενος എന്ന ക്രിയയിൽ ആരെയാണ് അഴിച്ചുമാറ്റിയത്/നിരായുധരാക്കിയത്?
  choice: ദൈവം ഭരണാധികാരികളെയും അധികാരശക്തികളെയും നിരായുധരാക്കി
  alternative: ദൈവം തന്റെമേലുണ്ടായിരുന്ന ഭരണാധികാരികളെയും അധികാരശക്തികളെയും ഊരിമാറ്റി; അല്ലെങ്കിൽ ക്രിസ്തു അവരെ നിരായുധരാക്കി
  rationale: വാക്യഘടനയിലെ സ്വാഭാവിക കർതൃബന്ധവും സന്ദർഭത്തിലെ വിജയദൃശ്യവും അനുസരിച്ച് ഈ വായന സ്വീകരിച്ചു; മലയാളത്തിൽ കർത്താവ് വ്യക്തമാക്കേണ്ടതിനാൽ ‘ദൈവം’ ചേർത്തു.
- issue: ἐν αὐτῷ എന്നതിന്റെ സൂചന
  choice: അവനിൽ—ക്രിസ്തുവിൽ
  alternative: അതിൽ—ക്രൂശിൽ
  rationale: αὐτῷ എന്ന രൂപത്തിന്റെ വ്യാകരണപരമായ ദ്വയാർഥത പരിഹരിക്കാതെ, മുഖ്യപാഠത്തിൽ ‘അവനിൽ’ നിലനിർത്തി മറ്റുവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ‘വിജയഘോഷയാത്ര’ പുരാതന ജയാഘോഷത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് യഥാർത്ഥ ഗ്രീക്ക് ദ്വയാർഥത സംരക്ഷിക്കുന്നു.
