revisions:
- from: അങ്ങനെ അവരുടെ ഹൃദയങ്ങൾ ധൈര്യപ്പെടാനും[a], അവർ സ്നേഹത്തിൽ ഒന്നിച്ചുചേർക്കപ്പെട്ട്[b] വിവേകം നൽകുന്ന പൂർണനിശ്ചയത്തിന്റെ സമ്പത്ത് മുഴുവനിലേക്കും, ദൈവത്തിന്റെ മർമ്മം—മശീഹ—അറിയുന്നതിലേക്കും[c][d][e] എത്താനും വേണ്ടിയാണ്.
  to: അവരുടെ ഹൃദയങ്ങൾ പ്രോത്സാഹനം പ്രാപിക്കാനും[a], അവർ സ്നേഹത്തിൽ ഒന്നിച്ചുചേർക്കപ്പെട്ടവരായി[b] വിവേകത്തിന്റെ പൂർണ ഉറപ്പിന്റെ സകല സമ്പത്തിലേക്കും, ദൈവത്തിന്റെ മർമ്മം—മശീഹ—എന്നതിനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലേക്കും[c][d][e] എത്തിച്ചേരാനും വേണ്ടിയാണ്.
  rationale: The revision corrects the reversed genitive relation and improves the rendering of ‘all riches.’ It also makes the passive force of παρακληθῶσιν explicit. The dash-marked appositional rendering of the difficult short reading is retained, and the footnote continues to identify this as an interpretive syntactic judgment rather than an undisputed expansion of the Greek.
  reviewer_model: gpt-5.6-terra
