id: COL.2.2
reference: Colossians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: ml
  text: അവരുടെ ഹൃദയങ്ങൾ പ്രോത്സാഹനം പ്രാപിക്കാനും[a], അവർ സ്നേഹത്തിൽ ഒന്നിച്ചുചേർക്കപ്പെട്ടവരായി[b] വിവേകത്തിന്റെ പൂർണ ഉറപ്പിന്റെ സകല സമ്പത്തിലേക്കും, ദൈവത്തിന്റെ മർമ്മം—മശീഹ—എന്നതിനെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിലേക്കും[c][d][e] എത്തിച്ചേരാനും വേണ്ടിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ആശ്വസിപ്പിക്കപ്പെടാനും’ അഥവാ ‘ശക്തിപ്പെടാനും.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് പ്രോത്സാഹനം, ആശ്വാസം, ശക്തിപ്പെടുത്തൽ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘സ്നേഹത്തിൽ ദൃഢമായി ഐക്യപ്പെട്ടവരായി.’ ഈ ക്രിയയ്ക്ക് ആളുകളെ ഒരുമിച്ചുകൊണ്ടുവരുക, അടുത്ത് ബന്ധിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: ‘പരിജ്ഞാനം’ എന്നതിന് ‘പൂർണമായ അറിവ്’ എന്നും പരിഭാഷപ്പെടുത്താം; ἐπίγνωσις എന്ന ഗ്രീക്ക് പദം ആഴമുള്ളതോ പൂർണമായതോ ആയ പരിജ്ഞാനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: ‘ദൈവത്തിന്റെ മർമ്മം—മശീഹ—’ എന്ന ഗ്രീക്ക് പ്രയോഗം ഹ്രസ്വവും വ്യാകരണപരമായി ദുഷ്കരവുമാണ്. ഈ പരിഭാഷ മശീഹയെ ദൈവത്തിന്റെ മർമ്മവുമായി സമസ്ഥാനത്തിൽ വായിക്കുന്നു; അതായത്, ദൈവത്തിന്റെ മർമ്മം മശീഹയാണ്.
    reason: alternative_reading
  - marker: e
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ദൈവത്തിന്റെ, പിതാവിന്റെ, മശീഹയുടെ മർമ്മം’ എന്നതുപോലുള്ള ദീർഘവായനകളുണ്ട്. ഇവിടെ നൽകിയിരിക്കുന്ന ഗ്രീക്ക് പാഠത്തിലെ ഹ്രസ്വവായനയാണ് പരിഭാഷ പിന്തുടരുന്നത്.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: ധൈര്യപ്പെടാനും
  rationale: സന്ദർഭത്തിൽ ആശ്വാസം മാത്രം അല്ല, ഉള്ളിലുള്ള പ്രോത്സാഹനവും ശക്തിപ്പെടലും ഉൾപ്പെടുന്ന വിശാലമായ അർഥം നൽകുന്നു.
- source_word: καρδίαι
  choice: ഹൃദയങ്ങൾ
  rationale: മനുഷ്യന്റെ ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപരമായ രൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: συμβιβασθέντες
  choice: ഒന്നിച്ചുചേർക്കപ്പെട്ട്
  rationale: സ്നേഹത്തിൽ അടുത്ത ബന്ധത്തിലേക്കും ഐക്യത്തിലേക്കും കൊണ്ടുവരപ്പെടുക എന്ന ബന്ധപരമായ അർഥം ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: അവർ ഒന്നിച്ചുചേർക്കപ്പെടുന്ന മണ്ഡലമോ ബന്ധമോ വ്യക്തമാക്കുന്നു.
- source_word: εἰς πᾶν πλοῦτος
  choice: സമ്പത്ത് മുഴുവനിലേക്കും
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തിലേക്കുള്ള നീക്കവും πλοῦτος എന്ന സമൃദ്ധിയുടെ രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: πληροφορίας τῆς συνέσεως
  choice: വിവേകം നൽകുന്ന പൂർണനിശ്ചയം
  rationale: ഗ്രാഹ്യമായ തിരിച്ചറിവിൽനിന്നു ജനിക്കുന്ന ഉറച്ച ബോധ്യം എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം അമിതമായി നിർവചിക്കാതെ കാരണാത്മകമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐπίγνωσιν
  choice: അറിയുന്നത്
  rationale: ആഴമുള്ള പരിജ്ഞാനം എന്ന സാധ്യത നിലനിൽക്കുമ്പോഴും വാക്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കുന്നു.
- source_word: μυστηρίου
  choice: മർമ്മം
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ദൈവം വെളിപ്പെടുത്തിയതുമായ ഉദ്ദേശ്യം എന്ന പൗലോസിന്റെ സാങ്കേതിക പ്രയോഗത്തിന് യോജിക്കുന്നു.
- source_word: θεοῦ, Χριστοῦ
  choice: ദൈവത്തിന്റെ മർമ്മം—മശീഹ—
  rationale: Χριστοῦ എന്നത് പദവിയായി ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും, ഹ്രസ്വവും ദുഷ്കരവുമായ ഗ്രീക്ക് സമസ്ഥാനബന്ധം ഡാഷുകൾകൊണ്ട് പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ എന്നതിലെ സമസ്ഥാനബന്ധം
  choice: ‘ദൈവത്തിന്റെ മർമ്മം—മശീഹ—’ എന്നു നൽകി മശീഹയെ ദൈവത്തിന്റെ മർമ്മവുമായി സമസ്ഥാനത്തിൽ വായിക്കുന്നു.
  alternative: ‘ദൈവത്തിന്റെ മർമ്മം, മശീഹ’ എന്നു വ്യാഖ്യാനം ഏറ്റവും കുറച്ച് മാത്രം വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ദീർഘമായ കൈയെഴുത്തുപ്രതി വായന പിന്തുടരുക.
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ഹ്രസ്വവായന Χριστοῦനെ മുൻപുള്ള ‘മർമ്മം’ എന്നതിനോടുള്ള സമസ്ഥാനമായി വായിക്കാൻ ഇടനൽകുന്നു. ഡാഷ് ഈ ബന്ധം സൂചിപ്പിക്കുമ്പോൾ ‘അതായത്’ എന്ന വിശദീകരണപദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർക്കുന്നില്ല.
- issue: Χριστός എന്ന പദത്തിന്റെ അവതരണം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ വ്യക്തിനാമംപോലെ മാറ്റുന്നതിനെക്കാൾ അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ സ്വഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹൃദയങ്ങൾ’, ‘മർമ്മം’, ‘മശീഹ’ എന്നീ പ്രധാന ബൈബിൾപരമായ രൂപങ്ങളും പദവിയും നിലനിർത്തി. മൂലവാക്യത്തിലെ ലക്ഷ്യസൂചകമായ ആവർത്തനം മലയാളത്തിലെ ‘-ലേക്കും ... -ലേക്കും എത്താനും’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കി.
