  source_fidelity: തിരുത്തൽ ആവശ്യമാണ്. കരടിൽ καθ’ ἡμῶν, ὑπεναντίον ἡμῖν എന്നീ രണ്ട് വ്യത്യസ്ത പ്രതികൂലതാപ്രയോഗങ്ങളും ഒരേ “നമുക്കെതിരായി നിന്ന” എന്ന വിശേഷണത്തിൽ ലയിപ്പിച്ചിരിക്കുന്നു; അതിനാൽ രണ്ടാമത്തെ പ്രയോഗത്തിന്റെ ഊന്നൽ നഷ്ടമാകുന്നു. കൂടാതെ [b] ചിഹ്നം τοῖς δόγμασιν-നോടല്ല, നീക്കിക്കളയലിനോടാണ് ചേർത്തിട്ടുള്ളത്.
