id: COL.2.14
reference: Colossians 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: ml
  text: ചട്ടങ്ങളിലുള്ളതും[b] നമുക്കെതിരായി നിലകൊണ്ടതും നമുക്കു പ്രതികൂലമായിരുന്നതുമായ കടപ്പത്രം[a] അവൻ മായ്ച്ചുകളഞ്ഞ്, അതിനെ ക്രൂശിൽ ആണിയടിച്ചുകൊണ്ട് വഴിയിൽനിന്ന് നീക്കിക്കളഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കടബാധ്യതയുടെ രേഖ” അല്ലെങ്കിൽ “കൈയെഴുത്തുരേഖ.” ഗ്രീക്ക് പദം കൈയെഴുത്തിലുള്ള കടപ്പത്രത്തെയോ നിയമപരമായ ബാധ്യതയുടെ രേഖയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ചട്ടങ്ങളോടുകൂടിയ” അല്ലെങ്കിൽ “ചട്ടങ്ങളാൽ രൂപപ്പെട്ട.” ഈ പ്രയോഗം കടപ്പത്രം ചട്ടങ്ങളിൽ രേഖപ്പെടുത്തിയതോ ചട്ടങ്ങളാൽ രൂപപ്പെട്ടതോ ആയിരുന്നുവെന്ന് അർഥമാക്കാം; ഗ്രീക്ക് വാക്യഘടന ദുഷ്കരമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: മായിച്ചുകളഞ്ഞു
  rationale: എഴുതിയ രേഖ തുടച്ചുമാറ്റുകയോ മായിക്കുകയോ ചെയ്യുന്ന ദൃശ്യരൂപവും അതിന്റെ പൂർണമായ നീക്കവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: χειρόγραφον
  choice: കടപ്പത്രം
  rationale: കൈയെഴുത്തിലുള്ള കടബാധ്യതാ രേഖ എന്ന പദത്തിന്റെ നിയമപരവും രേഖാപരവുമായ അർഥങ്ങൾ സംക്ഷിപ്തമായി നൽകുന്നു; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καθ’ ἡμῶν
  choice: നമുക്കെതിരായി നിന്ന
  rationale: രേഖ നമ്മെ പ്രതികൂലമായി ബാധിച്ചിരുന്നുവെന്ന ആശയം നേരിട്ട് നൽകുന്നു.
- source_word: τοῖς δόγμασιν
  choice: ചട്ടങ്ങളിൽ രേഖപ്പെടുത്തിയിരുന്ന
  rationale: ദുഷ്കരമായ ദത്തിവ് പ്രയോഗത്തെ, കടപ്പത്രത്തിന്റെ ബാധ്യത ചട്ടങ്ങളിലോ വിധികളിലോ രേഖപ്പെട്ടതായിരുന്നു എന്ന നിലയിൽ അവതരിപ്പിക്കുന്നു; മോശെയുടെ ന്യായപ്രമാണം മാത്രമെന്ന് പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ὑπεναντίον ἡμῖν
  choice: നമുക്കെതിരായി നിന്ന
  rationale: പ്രതികൂലതയും എതിർപ്പും വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ആവർത്തനം ഒഴിവാക്കാൻ καθ’ ἡμῶν എന്നതിനോടൊപ്പം ഏകീകൃതമായി നൽകിയിരിക്കുന്നു.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: നമ്മുടെ ഇടയിൽനിന്ന് നീക്കിക്കളഞ്ഞിരിക്കുന്നു
  rationale: പൂർണമായി നീക്കുക എന്ന ഇടിയത്തിന്റെ അർഥവും, perfect രൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന ഫലവും സംരക്ഷിക്കുന്നു.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: അതിനെ ക്രൂശിൽ ആണിയടിച്ച്
  rationale: നീക്കിക്കളഞ്ഞ രീതി സൂചിപ്പിക്കുന്ന പങ്കുവിനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ക്രൂശിന്റെ ദൃശ്യരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: χειρόγραφον τοῖς δόγμασιν എന്നതിന്റെ അർഥം
  choice: ചട്ടങ്ങളിൽ രേഖപ്പെടുത്തിയിരുന്ന കടബാധ്യതാ രേഖ
  alternative: മോശെയുടെ ന്യായപ്രമാണം തന്നേ; പാപങ്ങളുടെ കടപ്പട്ടിക; നിയമപരമായ കുറ്റപത്രം
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിലെ രേഖ-കടബാധ്യതാ രൂപകം നിലനിർത്തുന്നു; എന്നാൽ അതിനെ ഒരു പ്രത്യേക നിയമശാസ്ത്രപരമോ ഉടമ്പടിശാസ്ത്രപരമോ ആയ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: ἦρκεν എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അവൻ—സന്ദർഭത്തിൽ ദൈവം—നീക്കിക്കളഞ്ഞിരിക്കുന്നു
  alternative: കർത്താവിനെ വ്യക്തമാക്കാതെയുള്ള പ്രയോഗം
  rationale: വിശാലമായ വാക്യസന്ദർഭം ദൈവത്തെ കർത്താവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി സർവനാമം ചേർത്തിരിക്കുന്നു.
- issue: രണ്ട് പ്രതികൂലതാ പ്രയോഗങ്ങളുടെ അവതരണം
  choice: καθ’ ἡμῶν, ὑπεναντίον ἡμῖν എന്നിവയെ സ്വാഭാവിക മലയാളത്തിൽ ഏകീകൃതമായി അവതരിപ്പിച്ചു
  alternative: “നമുക്കെതിരായ ... അത് നമുക്ക് പ്രതികൂലമായിരുന്നു” എന്ന ആവർത്തനം
  rationale: മൂലത്തിലെ ശക്തി നഷ്ടപ്പെടുത്താതെ അസ്വാഭാവികമായ ആവർത്തനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. “കടപ്പത്രം” രേഖയും ബാധ്യതയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു. [a], [b] അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
