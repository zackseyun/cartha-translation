revisions:
- from: നമുക്കെതിരായി നിന്ന, ചട്ടങ്ങളിൽ രേഖപ്പെടുത്തിയിരുന്ന കടപ്പത്രം[a] അവൻ മായിച്ചുകളഞ്ഞു; അതിനെ ക്രൂശിൽ ആണിയടിച്ച് നമ്മുടെ ഇടയിൽനിന്ന് നീക്കിക്കളഞ്ഞിരിക്കുന്നു[b].
  to: ചട്ടങ്ങളിലുള്ളതും[b] നമുക്കെതിരായി നിലകൊണ്ടതും നമുക്കു പ്രതികൂലമായിരുന്നതുമായ കടപ്പത്രം[a] അവൻ മായ്ച്ചുകളഞ്ഞ്, അതിനെ ക്രൂശിൽ ആണിയടിച്ചുകൊണ്ട് വഴിയിൽനിന്ന് നീക്കിക്കളഞ്ഞിരിക്കുന്നു.
