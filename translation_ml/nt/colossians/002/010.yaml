revisions:
- from: അവനിൽ നിങ്ങൾ പൂർണത പ്രാപിച്ചിരിക്കുന്നു[a]. അവൻ സകല ഭരണാധികാരത്തിന്റെയും അധികാരത്തിന്റെയും ശിരസ്സാകുന്നു[b].
  to: നിങ്ങൾ അവനിൽ പൂർണരാക്കപ്പെട്ടിരിക്കുന്നു[a]. അവൻ എല്ലാ ഭരണാധികാരത്തിന്റെയും അധികാരത്തിന്റെയും ശിരസ്സാകുന്നു[b].
  rationale: The revision changes only the fullness expression to a Malayalam perfect-passive construction, thereby reflecting πεπληρωμένοι more faithfully while retaining the fullness/completeness sense and avoiding an interpretation of sinless perfection. It also makes the first note's alternative wording more idiomatic and regularizes the comprehensive expression in the second sentence. No doctrinal conclusion beyond the source's assertion is added.
