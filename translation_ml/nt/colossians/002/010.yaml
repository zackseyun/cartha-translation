  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: ml
  text: നിങ്ങൾ അവനിൽ പൂർണരാക്കപ്പെട്ടിരിക്കുന്നു[a]. അവൻ എല്ലാ ഭരണാധികാരത്തിന്റെയും അധികാരത്തിന്റെയും ശിരസ്സാകുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നിറയ്ക്കപ്പെട്ടിരിക്കുന്നു” അല്ലെങ്കിൽ “പൂർണതയിലെത്തിക്കപ്പെട്ടിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: “ശിരസ്സ്” എന്നത് ഗ്രീക്കിലെ രൂപകം നിലനിർത്തുന്നു; ഇവിടെ അവൻ എല്ലാ ഭരണാധികാരത്തിനും അധികാരത്തിനും മീതെ പരമാധികാരിയാണെന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല]'
  rationale: മുൻവാക്യവുമായുള്ള ബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ നിലനിർത്തുന്നു; ‘കൂടാതെ’ എന്നു ചേർത്താൽ ഇവിടെ അനാവശ്യമായ ഊന്നൽ ഉണ്ടാകാം.
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: നിങ്ങൾ പൂർണത പ്രാപിച്ചിരിക്കുന്നു
  rationale: പരിപൂർണ കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന, പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ ഫലം നിലനിർത്തുകയും πληρόω എന്ന പദത്തിന്റെ ‘നിറവ്/പൂർണത’ ആശയം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ക്രിസ്തുവുമായുള്ള ഐക്യം സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ സംക്ഷിപ്തമായ ഭാഷ മാറ്റിവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ὅς ἐστιν
  choice: അവൻ ... ആകുന്നു
  rationale: മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ഗ്രീക്ക് ആപേക്ഷിക ഉപവാക്യം സ്വതന്ത്രവാക്യമായി അവതരിപ്പിച്ചിട്ടും, പരാമർശം ക്രിസ്തുവിലേക്കുതന്നെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ κεφαλή
  choice: ശിരസ്സ്
  rationale: ഗ്രീക്കിലെ രൂപകം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ സകല അധികാരശക്തികൾക്കും മേലുള്ള ക്രിസ്തുവിന്റെ പരമാധികാരം സൂചിപ്പിക്കുന്നു.
- source_word: πάσης ἀρχῆς
  choice: സകല ഭരണാധികാരത്തിന്റെയും
  rationale: πάσης എന്നതിന്റെ സമഗ്രതയും ἀρχή എന്നതിലെ ഭരണശക്തി/ഭരണാധികാരി എന്ന ആശയവും നൽകുന്നു; ബഹുവചനം ചേർക്കാതെ ഗ്രീക്കിലെ ഏകവചന ഘടനയോട് അടുത്തുനിൽക്കുന്നു.
- source_word: καὶ ἐξουσίας
  choice: അധികാരത്തിന്റെയും
  rationale: ἐξουσία എന്നതിന്റെ അധികാരം, അധികാരശക്തി എന്നീ അർഥപരിധി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിൽ വിശ്വാസികൾക്കുള്ള പൂർണത
  choice: വിശ്വാസികൾ ക്രിസ്തുവിൽ പൂർണത പ്രാപിച്ചിരിക്കുന്നുവെന്ന് പറയുന്നു; അതിന്റെ വ്യാപ്തി ഒരു പ്രത്യേക പൂർണതാസിദ്ധാന്തമായി നിർവചിക്കുന്നില്ല.
  alternative: രക്ഷയ്ക്കാവശ്യമായ ഒന്നും കുറവില്ലെന്ന അർഥത്തിൽ ‘സമ്പൂർണരായിരിക്കുന്നു’; അല്ലെങ്കിൽ ദൈവിക നിറവിനാൽ ‘നിറയ്ക്കപ്പെട്ടിരിക്കുന്നു’.
  rationale: ‘പൂർണത പ്രാപിച്ചിരിക്കുന്നു’ എന്നത് മുൻവാക്യത്തിലെ നിറവ്/പൂർണത ആശയബന്ധം കാത്തുസൂക്ഷിക്കുകയും, പാപരഹിത പൂർണതയോ വെറും നിയമപരമായ സമ്പൂർണതയോ എന്ന പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: അധികാരശക്തികളുടെമേൽ κεφαλή എന്നതിന്റെ അർഥം
  choice: ‘ശിരസ്സ്’ എന്ന രൂപകം നിലനിർത്തി, സന്ദർഭത്തിൽ ക്രിസ്തുവിന്റെ പരമാധികാരം സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു.
  alternative: എല്ലാ ഭരണാധികാരത്തിന്റെയും അധികാരത്തിന്റെയും ‘ഉറവിടം’.
  rationale: κεφαλή എന്ന രൂപകം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നത് യഥാർഥ ഭാഷാചിത്രം സംരക്ഷിക്കുന്നു; കൊലൊസ്സ്യരിലെ പ്രപഞ്ചശക്തികളെക്കുറിച്ചുള്ള സന്ദർഭം മേൽക്കോയ്മയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘അവനിൽ’, ‘പൂർണത’, ‘ശിരസ്സ്’ എന്നീ പൗലോസിന്റെ സംക്ഷിപ്തവും രൂപകാത്മകവുമായ പ്രയോഗങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; നീണ്ട ഗ്രീക്ക് ആപേക്ഷികഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
