  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: ml
  text: അവനിൽ ജ്ഞാനത്തിന്റെയും അറിവിന്റെയും സകല നിധികളും മറഞ്ഞിരിക്കുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അതിൽ’; ബന്ധസർവനാമത്തിന്റെ പൂർവപദം ക്രിസ്തുവിനെ വ്യക്തിപരമായി അല്ലാതെ ദൈവത്തിന്റെ മർമ്മം എന്ന വിശാലാർഥത്തിൽ എടുക്കുന്നുവെങ്കിൽ.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘സൂക്ഷിച്ചുവച്ചിരിക്കുന്നു’; ഗ്രീക്ക് വിശേഷണത്തിന് ‘മറഞ്ഞിരിക്കുന്നു’ എന്നോ ‘കരുതിവച്ചിരിക്കുന്നു’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: സമീപസ്ഥമായ വ്യക്തിപരമായ പൂർവപദമായ ക്രിസ്തുവിനെയാണ് ബന്ധസർവനാമം ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ἐν എന്നതിന്റെ സ്ഥാനാർഥവും ഇതിലൂടെ നിലനിർത്തുന്നു.
- source_word: πάντες οἱ θησαυροὶ
  choice: സകല നിക്ഷേപങ്ങളും
  rationale: നിർദ്ദിഷ്ട ബഹുവചനപ്രയോഗത്തിന്റെ സമഗ്രത നിലനിർത്തുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപമാണിത്.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: ജ്ഞാനത്തിന്റെയും അറിവിന്റെയും
  rationale: σοφία, γνῶσις എന്നീ പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ആശയങ്ങളെ ഒന്നാക്കി ചുരുക്കാതെ വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: ἀπόκρυφοι
  choice: മറഞ്ഞിരിക്കുന്നു
  rationale: വിശേഷണം സൂചിപ്പിക്കുന്ന മറഞ്ഞിരിക്കുന്നതെന്ന അടിസ്ഥാനാർഥം സുതാര്യമായി നൽകുന്നു; അപ്രാപ്യതയോ സുരക്ഷിതമായി സൂക്ഷിച്ചിരിക്കലോ എന്നു അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: മറഞ്ഞിരിക്കുന്നു
  rationale: ബന്ധകക്രിയയും വിധേയവിശേഷണവും മലയാളത്തിൽ സ്വാഭാവികമായ സംയുക്തക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀπόκρυφοι എന്നത് നിഗൂഢമായ രഹസ്യതയെയാണോ ക്രിസ്തുവിൽ സുരക്ഷിതമായി സൂക്ഷിച്ചിരിക്കുന്നതിനെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: വ്യാഖ്യാനപരമായി നിഷ്പക്ഷമായ ‘മറഞ്ഞിരിക്കുന്നു’
  alternative: ‘സൂക്ഷിച്ചുവെച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘രഹസ്യമായി ഇരിക്കുന്നു’
  rationale: ഗ്രീക്ക് പദം അനുവദിക്കുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἐν ᾧ എന്നതിന്റെ പൂർവപദം വ്യക്തിപരമായി ക്രിസ്തുവാണോ, കൂടുതൽ വിശാലമായി ദൈവത്തിന്റെ മർമ്മമാണോ
  choice: പ്രധാനവാചകത്തിൽ ‘അവനിൽ’
  alternative: ‘അതിൽ’
  rationale: കൊലൊസ്സ്യർ 2:2-ലെ ഏറ്റവും അടുത്ത വ്യക്തിപരമായ സൂചകം ക്രിസ്തുവാണ്; വിശാലമായ ബന്ധസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിക്ഷേപങ്ങൾ’ എന്നത് θησαυροί എന്ന രൂപകത്തെ നിലനിർത്തുന്നു; അടിക്കുറിപ്പുകളിലെ എല്ലാ ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
