id: COL.2.4
reference: Colossians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: ml
  text: ആരും വിശ്വസനീയമെന്നു തോന്നിക്കുന്ന വാദങ്ങളാൽ നിങ്ങളെ വഞ്ചിക്കാതിരിക്കാനാണ് ഞാൻ ഇതു പറയുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വശീകരിക്കുന്ന വാദങ്ങളാൽ” അഥവാ “വിശ്വസനീയമെന്നു തോന്നിക്കുന്ന വാക്കുകളാൽ.”
    reason: πιθανολογία എന്ന പദത്തിന് ബോധ്യപ്പെടുത്തുന്ന വാദം, വിശ്വസനീയമെന്നു തോന്നിക്കുന്ന സംസാരം എന്നീ അടുത്ത അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: τοῦτο
  choice: ഇതു
  rationale: നപുംസകലിംഗ ഏകവചനത്തിലുള്ള നിർദേശകസർവനാമം പൗലോസ് മുമ്പ് പറഞ്ഞ കാര്യത്തെയോ വാദഗതിയെയോ സൂചിപ്പിക്കുന്നു; അതിന്റെ പരിധി അനാവശ്യമായി നിർണയിക്കാതെ ഏകവചനസൂചന നിലനിർത്തുന്നു.
- source_word: λέγω
  choice: ഞാൻ പറയുന്നത്
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള പ്രസ്താവനാഭാവം സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: -ാതിരിക്കാനാണ്
  rationale: ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μηδεὶς
  choice: ആരും … -ാതിരിക്കാൻ
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക അനിശ്ചിത കർത്താവിനെ മലയാളത്തിലെ സ്വാഭാവിക നിഷേധഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമരൂപം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: παραλογίζηται
  choice: വഞ്ചിക്കുക
  rationale: തെറ്റായ ന്യായവാദത്തിലൂടെ വഴിതെറ്റിക്കുകയോ കബളിപ്പിക്കുകയോ ചെയ്യുക എന്ന സന്ദർഭാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐν πιθανολογίᾳ
  choice: വിശ്വസനീയമെന്നു തോന്നിക്കുന്ന വാദങ്ങളാൽ
  rationale: ἐν ഇവിടെ മാർഗമോ രീതിയോ സൂചിപ്പിക്കുന്നു. πιθανολογία കേൾക്കുമ്പോൾ വിശ്വസനീയമോ ബോധ്യപ്പെടുത്തുന്നതോ ആയി തോന്നുന്ന വാദപ്രയോഗത്തെ സൂചിപ്പിക്കുന്നു; വാദം യഥാർഥത്തിൽ ശരിയാണെന്ന ധ്വനി ഒഴിവാക്കാൻ ‘തോന്നിക്കുന്ന’ എന്നു ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: παραλογίζηται ἐν πιθανολογίᾳ എന്ന മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: വിശ്വസനീയമെന്നു തോന്നിക്കുന്ന വാദങ്ങളാൽ വഞ്ചിക്കപ്പെടുന്നതിനെതിരായ പൊതുവായ മുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് പ്രത്യേകിച്ച് വ്യാജതത്ത്വചിന്തയ്ക്കെതിരായോ വെറും വാക്ചാതുര്യത്തിനെതിരായോ ഉള്ള മുന്നറിയിപ്പായി വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം പ്രത്യേകമായ ഒരു ഉപദേശവ്യവസ്ഥയെ പേരെടുത്തു പറയുന്നില്ല. അതിനാൽ സന്ദർഭം അനുവദിക്കുന്ന പൊതുവായ മുന്നറിയിപ്പ് നിലനിർത്തി, ഒരു പ്രത്യേക സിദ്ധാന്തവിരോധം പരിഭാഷയിൽ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ഉദ്ദേശ്യബന്ധം സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ അവതരിപ്പിച്ചു; വാദത്തിന്റെ യഥാർഥസത്യത്തെ അംഗീകരിക്കാതെ അതിന്റെ പ്രത്യക്ഷ വിശ്വസനീയത സംരക്ഷിച്ചു.
