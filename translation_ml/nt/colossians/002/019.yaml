base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: ml
  text: തലയെ മുറുകെപ്പിടിക്കാതെയും, ആ തലയിൽനിന്ന് മുഴുവൻ ശരീരവും സന്ധികളിലൂടെയും ബന്ധനനാരുകളിലൂടെയും പോഷണം ലഭിച്ചും ഒരുമിച്ചുചേർക്കപ്പെട്ടും ദൈവത്തിൽനിന്നുള്ള വളർച്ചയാൽ വളരുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ദൈവത്തിന്റെ വളർച്ച വളരുന്നു.” ഈ പ്രയോഗം ദൈവത്തിൽനിന്നു ലഭിക്കുന്ന വളർച്ചയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: മുറുകെപ്പിടിക്കാതിരിക്കുന്നു
  rationale: വെറും പിടിക്കുന്നതിലുപരി ഉറച്ച ബന്ധം നിലനിർത്തുക എന്ന രൂപകാർഥം പ്രകടമാക്കുന്നു; οὐ എന്ന നിഷേധവും ഉൾക്കൊള്ളുന്നു.
- source_word: τὴν κεφαλήν
  choice: തലയെ / ആ തലയിൽനിന്നാണ്
  rationale: സഭയെന്ന ശരീരത്തിന്റെ തലയായ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ശരീരരൂപകം നിലനിർത്തുന്നു. മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് പ്രത്യേക സൂചന നൽകാനാകാത്തതിനാൽ ആവർത്തനത്തിൽ ‘ആ തല’ എന്നു പറയുന്നു.
- source_word: ἐξ οὗ
  choice: ആ തലയിൽനിന്നാണ്
  rationale: പുരുഷലിംഗ ഏകവചന ബന്ധസർവനാമം മുമ്പുള്ള ‘തല’യിലേക്കാണ് മടങ്ങുന്നത്; ഉറവിടബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πᾶν τὸ σῶμα
  choice: ശരീരം മുഴുവൻ
  rationale: ഒരൊറ്റ ശരീരത്തിന്റെ സമഗ്രതയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: διὰ τῶν ἁφῶν καὶ συνδέσμων
  choice: സന്ധികളും ബന്ധനങ്ങളും മുഖാന്തരം
  rationale: ശരീരഘടനയുടെ രൂപകം നിലനിർത്തുന്നു. ἁφαί ബന്ധപ്പെടുന്ന സന്ധികളെയും σύνδεσμοι ഒന്നിച്ചു ബന്ധിക്കുന്ന ഘടകങ്ങളെയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιχορηγούμενον
  choice: പോഷണം ലഭിച്ചും
  rationale: നൽകപ്പെടുന്ന പിന്തുണയോ വിഭവമോ എന്ന വിശാല അർഥത്തിനുള്ളിൽ, വളരുന്ന ശരീരത്തിന്റെ സന്ദർഭത്തിൽ പോഷണം ലഭിക്കുക എന്നത് സ്വാഭാവികവും യോജിച്ചതുമാണ്.
- source_word: συμβιβαζόμενον
  choice: ഒരുമിച്ചു ചേർക്കപ്പെട്ടും
  rationale: ശരീരത്തിന്റെ വിവിധ ഭാഗങ്ങൾ ഏകീകൃതമായി ബന്ധിക്കപ്പെടുന്നു എന്ന നിഷ്ക്രിയ ആശയം സംരക്ഷിക്കുന്നു.
- source_word: αὔξει
  choice: വളരുന്നത്
  rationale: ശരീരരൂപകത്തിന് യോജിച്ച നേരിട്ടുള്ള ആധുനിക പ്രയോഗം.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള വളർച്ചയോടെ
  rationale: ദൈവം തന്നെയാണ് വളരുന്നത് എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി, വളർച്ചയുടെ ഉറവിടം ദൈവമാണെന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ജനിറ്റീവിന്റെ ചുരുക്കം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: τὴν αὔξησιν τοῦ θεοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: വളർച്ച ദൈവത്തിൽനിന്ന് വരുന്നു എന്ന ഉറവിടാർഥം പ്രധാനവാചകത്തിൽ നൽകി
  alternative: ‘ദൈവത്തിന്റെ വളർച്ചയോടെ’ എന്ന കൂടുതൽ പദാനുപദമായ രൂപം; ഗുണാത്മകമോ ഉടമസ്ഥതാസൂചകമോ ആയ സൂക്ഷ്മതകൾ
  rationale: അടുത്ത സന്ദർഭത്തിൽ ശരീരം തലയിൽനിന്ന് പോഷണവും ഐക്യവും പ്രാപിച്ചു വളരുന്നു. അതിനാൽ ദൈവം നൽകുന്ന വളർച്ചയാണ് ഉദ്ദേശ്യം എന്നു മനസ്സിലാക്കുന്നത് യോജിക്കുന്നു; എങ്കിലും ഗ്രീക്കിലെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ‘തല’യുടെ പരാമർശം
  choice: ക്രിസ്തു എന്നു വ്യാഖ്യാനിച്ച് പകരാതെ ശരീരരൂപകമായ ‘തല’ നിലനിർത്തി
  alternative: ‘ക്രിസ്തുവായ തല’ എന്നു വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ പരാമർശം ക്രിസ്തുവിലേക്കാണെങ്കിലും മൂലവാചകത്തിന്റെ രൂപകവും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ശരീരരൂപകം നിലനിർത്തിയിട്ടുണ്ട്; അമിതമായ സഭാപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
