id: COL.2.8
reference: Colossians 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: ml
  text: മനുഷ്യരുടെ പാരമ്പര്യത്തിനും ലോകത്തിന്റെ മൂലതത്ത്വങ്ങൾക്കും[a] അനുസൃതവും മശീഹായ്ക്ക്[b] അനുസൃതമല്ലാത്തതുമായ തത്ത്വചിന്തയും പൊള്ളയായ വഞ്ചനയുംകൊണ്ട് ആരും നിങ്ങളെ കൊള്ളയായി കൊണ്ടുപോകാതിരിക്കാൻ സൂക്ഷിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലോകത്തിലെ മൂലശക്തികൾ” അല്ലെങ്കിൽ “ലോകത്തിലെ ആത്മീയ ശക്തികൾ.” ഗ്രീക്ക് പ്രയോഗം അടിസ്ഥാന തത്ത്വങ്ങളെയോ പ്രപഞ്ചാത്മക ശക്തികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ “ക്രിസ്തു”; ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർത്ഥം മുൻനിൽക്കുന്നതിനാൽ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: ആരും ... പോകാതിരിക്കാൻ സൂക്ഷിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ മുന്നറിയിപ്പുസ്വരം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: നിങ്ങളെ കൊള്ളയായി പിടിച്ചുകൊണ്ടുപോകുക
  rationale: συλαγωγέω എന്ന പദത്തിലെ യുദ്ധക്കൊള്ളയോ ബന്ദിയോ ആയി കൊണ്ടുപോകുന്ന ശക്തമായ രൂപകം നിലനിർത്തുന്നു.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: തത്ത്വചിന്തയും പൊള്ളയായ വഞ്ചനയുംകൊണ്ട്
  rationale: διά സൂചിപ്പിക്കുന്ന മാർഗം നിലനിർത്തുകയും രണ്ടു നാമങ്ങളെയും വ്യാഖ്യാനപരമായി ഒന്നാക്കി ചുരുക്കാതെ ചേർത്ത് നൽകുകയും ചെയ്യുന്നു.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ പാരമ്പര്യത്തിന് അനുസൃതമായ
  rationale: κατά സൂചിപ്പിക്കുന്ന മാനദണ്ഡം വ്യക്തമാക്കുന്നു; ἀνθρώπων ലിംഗനിരപേക്ഷമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: ലോകത്തിന്റെ മൂലതത്ത്വങ്ങൾക്ക് അനുസൃതമായ
  rationale: στοιχεῖα എന്ന പദത്തിന് അടിസ്ഥാന ഘടകങ്ങൾ, പ്രാഥമിക തത്ത്വങ്ങൾ, ആത്മീയ ശക്തികൾ എന്നീ സാധ്യതകളുള്ളതിനാൽ പ്രധാനപാഠത്തിൽ താരതമ്യേന വിശാലമായ പ്രയോഗം സ്വീകരിക്കുന്നു.
- source_word: οὐ κατὰ Χριστόν
  choice: മശീഹായ്ക്ക് അനുസൃതമല്ലാത്ത
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമത്തേക്കാൾ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരിന്റെ ഭാവം വഹിക്കുന്നതിനാൽ ‘മശീഹാ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμου എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ലോകത്തിന്റെ മൂലതത്ത്വങ്ങൾ
  alternative: ലോകത്തിലെ മൂലശക്തികൾ / ആത്മീയ ശക്തികൾ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് അടിസ്ഥാന തത്ത്വങ്ങളെയോ പ്രപഞ്ചാത്മക ശക്തികളെയോ സൂചിപ്പിക്കാം. പ്രധാനപാഠം ഒരു വ്യാഖ്യാനം മാത്രം അന്തിമമാക്കാതെ വിശാലത നിലനിർത്തുന്നു; ആത്മീയ ശക്തികൾ എന്ന പ്രധാന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേര്
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭത്തിലെ വിരുദ്ധമാനദണ്ഡം ഒരു വ്യക്തിയുടെ സ്ഥാനത്തെയും അധികാരത്തെയും മുൻനിർത്തുന്നതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർത്ഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ സ്വീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ മുന്നറിയിപ്പുശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ പരസ്പരബന്ധങ്ങൾ നിലനിർത്താൻ ഏകവാക്യഘടന ഉപയോഗിച്ചെങ്കിലും വായനാസൗകര്യത്തിനായി സ്വാഭാവിക മലയാള പദക്രമം സ്വീകരിച്ചു.
