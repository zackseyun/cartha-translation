id: COL.2.6
reference: Colossians 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: ml
  text: അതുകൊണ്ട്, കർത്താവായ മിശിഹാ[a] യേശുവിനെ നിങ്ങൾ സ്വീകരിച്ചതുപോലെതന്നെ, അവനിൽ നടക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തു യേശു.’
    reason: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗതമായ ലിപ്യന്തരരൂപം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: Ὡς
  choice: സ്വീകരിച്ചതുപോലെതന്നെ
  rationale: മുമ്പുണ്ടായ സ്വീകരണവും തുടർന്നുള്ള ജീവിതനടപ്പും തമ്മിലുള്ള താരതമ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: παρελάβετε
  choice: സ്വീകരിച്ചു
  rationale: സന്ദേശത്തെ അംഗീകരിച്ചതും വ്യക്തിയെ കൈക്കൊണ്ടതും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: മശീഹാ യേശു
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരെന്ന നിലയിൽ അർഥവത്തായി പരിഭാഷപ്പെടുത്തി, Ἰησοῦς എന്ന പേര് ലിപ്യന്തരം ചെയ്യുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേരിനെ മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ക്രിസ്തുവുമായുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ സംക്ഷിപ്തവും അർഥസമ്പന്നവുമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: περιπατεῖτε
  choice: നടക്കുക
  rationale: ജീവിതചര്യയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം നിലനിർത്തുകയും വർത്തമാനകാല കല്പനയുടെ തുടർച്ചാസൂചന ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സ്ഥാനപ്പേരുകളുടെ നിരയിൽ Χριστός എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തു യേശു
  rationale: ഇവിടെ Χριστός വെറും പേരിന്റെ ഭാഗമെന്നതിലുപരി സ്ഥാനപ്പേരിന്റെ ശക്തി നിലനിർത്തുന്നതിനാൽ അതിന്റെ അർഥം പരിഭാഷപ്പെടുത്തുന്നു; പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν αὐτῷ എന്ന പൗലോസിന്റെ ഐക്യഭാഷ
  choice: അവനിൽ
  alternative: അവനോടുള്ള ഐക്യത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും സ്ഥലപരവും ബന്ധപരവുമായ അർഥസാധ്യതകളും നിലനിർത്തി, ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അവനിൽ നടക്കുക’ എന്ന ബൈബിൾരൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; ‘പോലെതന്നെ’ താരതമ്യത്തിന്റെ ഊന്നൽ പ്രകടമാക്കുന്നു.
