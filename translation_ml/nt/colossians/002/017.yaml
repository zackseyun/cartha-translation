  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: ml
  text: ഇവ വരാനിരിക്കുന്നവയുടെ നിഴലാണ്; എന്നാൽ ശരീരം മശീഹായുടേതാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നാൽ ശരീരം മശീഹായ്ക്കുള്ളതാണ്.’
    reason: τοῦ Χριστοῦ എന്ന ജനിറ്റീവിനെ ‘മശീഹായുടേത്’ എന്നതിനു പകരം ‘മശീഹായ്ക്കുള്ളത്’ എന്ന ഉടമസ്ഥതാസംബന്ധമായി വ്യക്തമാക്കാവുന്നതാണ്.
  - marker: b
    text: അഥവാ, ‘എന്നാൽ യാഥാർഥ്യം മശീഹായുടേതാണ്.’
    reason: നിഴലിനോടുള്ള വൈരുധ്യത്തിൽ σῶμα എന്നത് നിഴലിനു പിന്നിലെ സാരവസ്തുവിനെയോ യാഥാർഥ്യത്തെയോ രൂപകമായി സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἅ
  choice: ഇവ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ഭക്ഷണം, പാനം, ഉത്സവം, അമാവാസി, ശബ്ബത്ത് എന്നിവയെ തിരിച്ചുചൂണ്ടുന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇവ’ എന്ന് നൽകി.
- source_word: σκιὰ
  choice: നിഴൽ
  rationale: മൂലത്തിലെ ഏകവചന രൂപവും, വരാനിരിക്കുന്ന യാഥാർഥ്യവുമായി ഉള്ള രൂപകപരമായ വൈരുധ്യവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῶν μελλόντων
  choice: വരാനിരിക്കുന്നവയുടെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ പങ്കാളിത്തരൂപത്തിന്റെ നാമവാചകപ്രയോഗം സംക്ഷിപ്തമായി നൽകുന്നു; ഇത് അന്ത്യകാല കാര്യങ്ങളെയോ മശീഹായിലെ നിറവേറലിനെയോ രണ്ടിനെയുമോ സൂചിപ്പിക്കുന്നുവെന്നത് വിവർത്തനം തീരുമാനിച്ചിട്ടില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: നിഴലും ശരീരവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പദത്തിന്റെ സാധാരണവും ഔപചാരികവുമായ അർഥം നിലനിർത്തുകയും ‘നിഴൽ–ശരീരം’ എന്ന മൂലരൂപകം വായനക്കാരന്റെ വ്യാഖ്യാനത്തിനായി തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായുടേത്
  rationale: ജനിറ്റീവ് രൂപത്തിന്റെ ഉടമസ്ഥതാസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: നിഴലിനോടുള്ള വൈരുധ്യത്തിൽ σῶμα എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ശരീരം’ എന്ന് ഔപചാരികമായി നൽകി.
  alternative: ‘യാഥാർഥ്യം’ അല്ലെങ്കിൽ ‘സാരവസ്തു’ എന്ന് രൂപകത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കി നൽകാം.
  rationale: σῶμα എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും പൗലോസിന്റെ രൂപകത്തിലെ വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു; ‘യാഥാർഥ്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: Χριστοῦ എന്നതിന്റെ വിവർത്തനം
  choice: ‘മശീഹായുടേത്’
  alternative: ‘ക്രിസ്തുവിന്റേത്’
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ സ്വീകരിച്ചു; ജനിറ്റീവിന്റെ സംക്ഷിപ്തതയും ഉടമസ്ഥതാസംബന്ധവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ഏകവചന ‘നിഴൽ’, ഭാവിദിശ, വൈരുധ്യം, സംക്ഷിപ്തമായ ജനിറ്റീവ് ബന്ധം എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
