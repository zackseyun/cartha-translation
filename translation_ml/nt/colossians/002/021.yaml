lexical_decisions:
- source_word: Μὴ ἅψῃ
  choice: കൈകാര്യം ചെയ്യരുത്
  rationale: μή സഹിതമുള്ള aorist subjunctive നിരോധനത്തെ ‘ചെയ്യരുത്’ എന്നു സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ἅπτω എന്ന ക്രിയയ്ക്ക് ‘തൊടുക’, ‘പിടിക്കുക’ എന്നീ അർഥങ്ങളും സാധ്യമാണെങ്കിലും, അവസാനം വരുന്ന θίγῃς-ൽനിന്ന് വ്യത്യാസം നിലനിർത്താൻ ഇവിടെ ‘കൈകാര്യം ചെയ്യുക’ തിരഞ്ഞെടുത്തു.
- source_word: μηδὲ γεύσῃ
  choice: രുചിക്കുകയുമരുത്
  rationale: μηδέ ആവർത്തിത നിരോധനങ്ങളെ ബന്ധിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-യുമരുത്’ ആ സഞ്ചിതബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു. γεύομαι എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘രുചിക്കുക’ എന്നാണ്.
- source_word: μηδὲ θίγῃς
  choice: തൊടുകയുമരുത്
  rationale: θιγγάνω സാധാരണയായി ‘തൊടുക’ എന്നാണ്. ആദ്യക്രിയയെ ‘കൈകാര്യം ചെയ്യുക’ എന്നു നൽകിയതിനാൽ രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയകളുടെയും ഭേദം മലയാളത്തിലും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ നിരോധനങ്ങളുടെ സ്വഭാവം
  choice: വിശദീകരണപദങ്ങൾ ചേർക്കാതെ, ഉദ്ധരണിപോലെയുള്ള മൂന്ന് ചുരുക്കനിരോധനങ്ങളായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇത് കൈകാര്യം ചെയ്യരുത്, അത് രുചിക്കരുത്’ എന്നിങ്ങനെ വസ്തുക്കൾ വ്യക്തമാക്കുക, അല്ലെങ്കിൽ മനുഷ്യനിയമങ്ങളോടുള്ള ബന്ധം ഈ വാക്യത്തിൽത്തന്നെ തുറന്നുപറയുക.
  rationale: ഗ്രീക്ക് വാക്യം അത്യന്തം സംക്ഷിപ്തമാണ്; വസ്തുക്കളെയോ വ്യാഖ്യാനപരമായ ബന്ധങ്ങളെയോ വ്യക്തമാക്കുന്ന പദങ്ങൾ ഇതിലില്ല. അതിനാൽ അതിന്റെ പെട്ടെന്നുള്ള, ഉദ്ധരണിസദൃശമായ ഭാവവും വ്യാഖ്യാനതുറപ്പില്ലായ്മയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷ. മൂലത്തിലെ സംക്ഷിപ്തതയും ആവർത്തിത നിരോധനങ്ങളുടെ താളവും നിലനിർത്തി; ഉദ്ധരണിചിഹ്നവും അവസാന കോമയും സന്ദർഭത്തിലേക്ക് തുടരുമെന്ന ഘടന സൂചിപ്പിക്കുന്നു.
