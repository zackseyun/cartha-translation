revisions:
- from: വിനയത്തിലും ദൂതന്മാരുടെ ആരാധനയിലും ആനന്ദിക്കുന്നവനും, താൻ കണ്ട കാര്യങ്ങളിൽ മുഴുകിനിൽക്കുന്നവനും,[a][b] തന്റെ ജഡികമനസ്സിനാൽ വ്യർഥമായി അഹങ്കരിക്കുന്നവനുമായ ആരും നിങ്ങളെ സമ്മാനത്തിന് അയോഗ്യരാക്കരുത്.[c]
  to: വിനയത്തിലും ദൂതന്മാരുടെ ആരാധനയിലും[a] ആനന്ദിക്കുന്നവനും, താൻ കണ്ട[c] കാര്യങ്ങളിൽ മുഴുകിനിൽക്കുന്നവനും[b] തന്റെ ജഡത്തിന്റെ മനസ്സിനാൽ വ്യർഥമായി അഹങ്കരിക്കുന്നവനുമായ ആരും നിങ്ങളെ സമ്മാനത്തിൽനിന്ന് ഒഴിവാക്കരുത്.
