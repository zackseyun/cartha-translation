reference: Colossians 2:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: ml
  text: വിനയത്തിലും ദൂതന്മാരുടെ ആരാധനയിലും[a] ആനന്ദിക്കുന്നവനും, താൻ കണ്ട[c] കാര്യങ്ങളിൽ മുഴുകിനിൽക്കുന്നവനും[b] തന്റെ ജഡത്തിന്റെ മനസ്സിനാൽ വ്യർഥമായി അഹങ്കരിക്കുന്നവനുമായ ആരും നിങ്ങളെ സമ്മാനത്തിൽനിന്ന് ഒഴിവാക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൂതന്മാരുടെ ആരാധന” എന്ന ഗ്രീക്ക് പ്രയോഗം “ദൂതന്മാരുടെ മതാചാരം” എന്നോ “ദൂതന്മാരോടൊപ്പമുള്ള ആരാധന” എന്നോ മനസ്സിലാക്കാനും കഴിയും.
    reason: alternative_reading
  - marker: b
    text: “മുഴുകിനിൽക്കുന്നവൻ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയ അപൂർവവും അർഥനിർണയം ദുഷ്കരവുമാണ്; “താൻ കണ്ട കാര്യങ്ങളെ വിശദമായി പ്രതിപാദിക്കുന്നവൻ” എന്നോ “താൻ കണ്ട കാര്യങ്ങളിലേക്ക് പ്രവേശിക്കുന്നവൻ” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “താൻ കണ്ട കാര്യങ്ങൾ” എന്നതിനു പകരം “താൻ കണ്ടിട്ടില്ലാത്ത കാര്യങ്ങൾ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: സമ്മാനത്തിന് അയോഗ്യരാക്കരുത്
  rationale: മത്സരവിധികർത്താവ് ഒരാൾക്കെതിരെ വിധിച്ച് സമ്മാനം നഷ്ടപ്പെടുത്തുന്ന ദൃശ്യഭാവം ക്രിയയിൽ ഉണ്ട്. ‘സമ്മാനത്തിന് അയോഗ്യരാക്കുക’ എന്നത് ആ അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θέλων ἐν
  choice: ആനന്ദിക്കുന്നവൻ
  rationale: ഇവിടെ വെറും ഇച്ഛയേക്കാൾ, പറഞ്ഞിരിക്കുന്ന ആചാരങ്ങളിൽ സ്വയം താത്പര്യവും ആനന്ദവും കണ്ടെത്തുന്നതാണ് സന്ദർഭോചിതമായ അർഥം.
- source_word: ταπεινοφροσύνῃ
  choice: വിനയം
  rationale: പദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ കൃത്രിമമോ തപസ്സുപരമോ ആയ വിനയം എന്ന പരിഹാസധ്വനി വിശദീകരണമായി മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: ദൂതന്മാരുടെ ആരാധന
  rationale: ദൂതന്മാരെ ലക്ഷ്യമാക്കിയ ആരാധന എന്ന സാധാരണ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു; ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണത്തിന്റെ യഥാർഥ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: താൻ കണ്ട കാര്യങ്ങളിൽ മുഴുകിനിൽക്കുന്നവൻ
  rationale: അപൂർവവും ദുഷ്കരവുമായ ἐμβατεύω എന്ന ക്രിയയുടെ ‘പ്രവേശിക്കുക/വിശദമായി ഇടപെടുക/മുഴുകുക’ എന്ന സാധ്യതകളെ, ദർശനാനുഭവങ്ങളിൽ മുഴുകിനിൽക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിലുണ്ട്.
- source_word: εἰκῇ φυσιούμενος
  choice: വ്യർഥമായി അഹങ്കരിക്കുന്നവൻ
  rationale: εἰκῇ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനരാഹിത്യവും നിഷ്ഫലതയും ‘വ്യർഥമായി’ നൽകുന്നു. φυσιόωയുടെ വീർപ്പിക്കപ്പെടുക എന്ന രൂപകം മലയാളത്തിൽ നേരിട്ട് അസ്വാഭാവികമായതിനാൽ അതിന്റെ അഹങ്കാരാർഥം ഉപയോഗിച്ചു.
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: തന്റെ ജഡികമനസ്സിനാൽ
  rationale: ‘അവന്റെ ജഡത്തിന്റെ മനസ്സ്’ എന്ന അക്ഷരരൂപത്തിന്റെ ആശയം ചുരുക്കി, σάρξ എന്ന പദത്തെ ‘പാപസ്വഭാവം’ എന്ന സിദ്ധാന്തപരമായ പരാവർത്തനത്തിലേക്ക് മാറ്റാതെ ‘ജഡിക’ എന്നു നിലനിർത്തുന്നു.
theological_decisions:
- issue: θρησκείᾳ τῶν ἀγγέλων എന്നതിലെ ഷഷ്ഠീവ്യാകരണബന്ധം
  choice: ദൂതന്മാരെ ലക്ഷ്യമാക്കിയ ആരാധന
  alternative: ദൂതന്മാരുടെ മതാചാരം; ദൂതന്മാരോടൊപ്പമുള്ള ആരാധന
  rationale: ലക്ഷ്യാർഥക ഷഷ്ഠി സന്ദർഭത്തിൽ സാധാരണവും സാധ്യതയേറിയതുമാണ്; എങ്കിലും വ്യാകരണം മറ്റു വായനകളെ അനുവദിക്കുന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: τῆς σαρκὸς αὐτοῦ എന്നതിലെ σάρξ
  choice: ജഡിക
  alternative: പാപസ്വഭാവപരമായ
  rationale: ‘ജഡം’ എന്ന പൗലൊസീയ പദത്തിന്റെ മാനവശാസ്ത്രപരവും ദൈവശാസ്ത്രപരവുമായ സംഘർഷം നിലനിർത്തി; ‘പാപസ്വഭാവം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം മുഖ്യവാചകത്തിൽ കയറ്റിയില്ല.
- issue: ἃ ἑόρακεν എന്ന പാഠഭേദം
  choice: താൻ കണ്ട കാര്യങ്ങൾ
  alternative: താൻ കണ്ടിട്ടില്ലാത്ത കാര്യങ്ങൾ
  rationale: SBLGNT മുഖ്യപാഠം പിന്തുടർന്നു; ‘അല്ല’ എന്ന നിഷേധപദമുള്ള കൈയെഴുത്തുപ്രതി പാഠഭേദം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ നീണ്ട വിശേഷണഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തി. ‘ജഡികമനസ്സ്’ പൗലൊസീയ σάρξ എന്ന പദത്തിന്റെ കഠിനത പൂർണമായി മായ്ക്കാതെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപമാണ്.
