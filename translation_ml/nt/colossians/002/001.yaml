id: COL.2.1
reference: Colossians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾക്കുവേണ്ടിയും ലവൊദിക്യയിലുള്ളവർക്കുവേണ്ടിയും എന്നെ നേരിൽ[a] കണ്ടിട്ടില്ലാത്ത എല്ലാവർക്കുവേണ്ടിയും എനിക്ക് എത്ര വലിയ പോരാട്ടമുണ്ട് എന്നു നിങ്ങൾ അറിയണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘ജഡത്തിൽ എന്റെ മുഖം.’ ഇവിടെ പൗലോസിനെ ശാരീരികമായി, അതായത് നേരിൽ, കണ്ടിട്ടില്ലാത്തവരെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: നിങ്ങൾ അറിയണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: θέλω + accusative + infinitive എന്ന ഘടനയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. γάρ മുൻവാക്യത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ നിർബന്ധിതമായ ഒരു ബന്ധപദം ചേർക്കാതെ പ്രവാഹം നിലനിർത്തുന്നു.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: ഞാൻ എത്ര വലിയ പോരാട്ടം നടത്തുന്നു
  rationale: ἡλίκον പോരാട്ടത്തിന്റെ വലുപ്പവും തീവ്രതയും ഊന്നുന്നു; ἀγών ഇവിടെ കായികമത്സരമല്ല, കഠിനമായ ആത്മാർഥശ്രമമാണ്. മലയാളത്തിൽ ‘പോരാട്ടം നടത്തുന്നു’ എന്നത് സ്വാഭാവികമാണ്.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ὑπέρ ഇവിടെ വായനക്കാരുടെ നന്മയ്ക്കായുള്ള പ്രവർത്തനത്തെയും കരുതലിനെയും സൂചിപ്പിക്കുന്നു.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ലവൊദിക്യയിലുള്ളവർ
  rationale: സ്ഥലനാമത്തോടുകൂടിയ substantival prepositional phrase ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: കണ്ടിട്ടില്ലാത്ത എല്ലാവരും
  rationale: ὅσοι എന്ന പദത്തിന്റെ സമഗ്രമായ വ്യാപ്തി ‘എല്ലാവരും’ എന്നതിലൂടെ നിലനിർത്തുന്നു; perfect രൂപം ഇപ്പോഴും പ്രസക്തമായ അനുഭവാഭാവമായി നൽകുന്നു.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: ജഡത്തിൽ എന്റെ മുഖം
  rationale: πρόσωπον, σάρξ എന്നീ പദങ്ങളുടെ ദൃശ്യരൂപം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് പൗലോസിനെ ശാരീരികമായി നേരിൽ കണ്ടിട്ടില്ലെന്ന അർഥമാണ്.
theological_decisions:
- issue: ἐν σαρκί എന്നതിലെ σάρξ-ന്റെ അർഥം
  choice: ജഡത്തിൽ
  alternative: നേരിൽ / ശാരീരികമായി
  rationale: ഇവിടെ σάρξ പാപസ്വഭാവത്തെയല്ല, ശരീരസാന്നിധ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലപാഠത്തിന്റെ സാക്ഷാൽ പ്രയോഗം നിലനിർത്താൻ ‘ജഡത്തിൽ’ സ്വീകരിച്ചു; അതിന്റെ സന്ദർഭാർഥം പദപ്രയോഗത്തിൽനിന്നുതന്നെ വ്യക്തമാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ നീണ്ട ഏകവാക്യഘടനയും ‘മുഖം’, ‘ജഡം’ എന്നീ ദൃശ്യപദങ്ങളും പരമാവധി നിലനിർത്തിയിരിക്കുന്നു.
