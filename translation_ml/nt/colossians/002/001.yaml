- from: നിങ്ങൾക്കും ലവൊദിക്യയിലുള്ളവർക്കും ജഡത്തിൽ എന്റെ മുഖം കണ്ടിട്ടില്ലാത്ത എല്ലാവർക്കുംവേണ്ടി ഞാൻ എത്ര വലിയ പോരാട്ടം നടത്തുന്നു എന്നു നിങ്ങൾ അറിയണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു.
