source:
  edition: SBLGNT
  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ മരിച്ചു; നിങ്ങളുടെ ജീവൻ മശീഹയോടൊപ്പം[a] ദൈവത്തിൽ മറഞ്ഞിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിനോടൊപ്പം.” ഗ്രീക്കിലെ Χριστός എന്ന പദവി “മശീഹ” എന്നും “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: നിങ്ങൾ മരിച്ചു
  rationale: രണ്ടാം പുരുഷ ബഹുവചനത്തിലുള്ള aorist ക്രിയ വിശ്വാസികളുടെ നിർണായകമായ ഭൂതകാലമരണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ലളിത ഭൂതകാലം ഇത് സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിന് അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്ന ബന്ധകശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ ζωὴ ὑμῶν
  choice: നിങ്ങളുടെ ജീവൻ
  rationale: ζωή എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ; സന്ദർഭത്തിൽ മശീഹയോടുള്ള ഐക്യത്തിലെ വിശ്വാസികളുടെ യഥാർഥ ജീവനെ സൂചിപ്പിച്ചാലും മുഖ്യവാചകത്തിൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: κέκρυπται
  choice: മറഞ്ഞിരിക്കുന്നു
  rationale: perfect passive രൂപം കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഫലമായി തുടരുന്ന ഇപ്പോഴത്തെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; 'മറഞ്ഞിരിക്കുന്നു' മലയാളത്തിൽ ആ നില സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σὺν τῷ Χριστῷ
  choice: മശീഹയോടൊപ്പം
  rationale: σύν സഹവർത്തിത്വവും ഐക്യവും സൂചിപ്പിക്കുന്നു. Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ 'മശീഹ' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν τῷ θεῷ
  choice: ദൈവത്തിൽ
  rationale: ἐν ഇവിടെ സ്ഥാനം/മണ്ഡലം സൂചിപ്പിക്കുന്നതിനാൽ ഗ്രീക്ക് വാചകത്തിന്റെ രൂപവും ദൈവത്തിലുള്ള സുരക്ഷിതമായ നിലയും വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായോ പേരുപോലെയോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ അർഥം വഹിക്കുന്നു; അതിനാൽ 'മശീഹ' അർഥം കൂടുതൽ തുറന്നുവെക്കുന്നു. മലയാളസഭാപാരമ്പര്യത്തിൽ പരിചിതമായ 'ക്രിസ്തു' സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
- issue: κέκρυπται എന്ന perfect passive-ന്റെ കാലഭാവം
  choice: മറഞ്ഞിരിക്കുന്നു
  alternative: മറച്ചുവെക്കപ്പെട്ടിരിക്കുന്നു
  rationale: കഴിഞ്ഞ പ്രവൃത്തിയിൽ നിന്നുണ്ടായ ഇപ്പോഴത്തെ തുടരുന്ന അവസ്ഥയ്ക്ക് മുൻതൂക്കം നൽകുന്നു. കൂടുതൽ രൂപപരമായി വ്യക്തമായ passive പരിഭാഷ സാധ്യമെങ്കിലും മലയാളത്തിൽ ഭാരമുള്ളതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വചനത്തിന്റെ വിശദീകരണബന്ധം 'കാരണം' കൊണ്ടും, perfect രൂപത്തിന്റെ തുടരുന്ന അവസ്ഥ 'മറഞ്ഞിരിക്കുന്നു' കൊണ്ടും സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു. ദൈവശാസ്ത്രപരമായ വിപുലീകരണം ഒഴിവാക്കി.
