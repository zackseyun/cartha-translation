id: COL.3.15
reference: Colossians 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: ml
  text: 'മശീഹായുടെ[a] സമാധാനം നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ഭരിക്കട്ടെ[b]. ആ സമാധാനത്തിലേക്കുതന്നെ നിങ്ങൾ ഒരു ശരീരത്തിൽ[c] വിളിക്കപ്പെട്ടു. നന്ദിയുള്ളവരായിരിക്കുക.


    [a] അഥവാ, “ക്രിസ്തുവിന്റെ.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “അഭിഷിക്തൻ” എന്ന സ്ഥാനപ്പേരിനെ സൂചിപ്പിക്കുന്നു.


    [b] “ഭരിക്കട്ടെ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് “വിധികർത്താവായി പ്രവർത്തിക്കട്ടെ” അഥവാ “തീരുമാനിക്കട്ടെ” എന്നും അർഥമാകാം. സമൂഹത്തിന്റെ ആന്തരികജീവിതത്തെ നിർണയിക്കുന്ന മാനദണ്ഡമായി മശീഹായുടെ സമാധാനം പ്രവർത്തിക്കണമെന്ന ആശയം ഇതിലുണ്ട്.


    [c] അഥവാ, “ഒരു ശരീരത്തിലേക്ക്.” ഒരു ശരീരമായി ചേർക്കപ്പെട്ടതിനെ ഈ വായന ഊന്നിപ്പറയുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “അഭിഷിക്തൻ” എന്ന സ്ഥാനപ്പേരിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ഭരിക്കട്ടെ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് “വിധികർത്താവായി പ്രവർത്തിക്കട്ടെ” അഥവാ “തീരുമാനിക്കട്ടെ” എന്നും അർഥമാകാം. സമൂഹത്തിന്റെ ആന്തരികജീവിതത്തെ നിർണയിക്കുന്ന മാനദണ്ഡമായി മശീഹായുടെ സമാധാനം പ്രവർത്തിക്കണമെന്ന ആശയം ഇതിലുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഒരു ശരീരത്തിലേക്ക്.” ഒരു ശരീരമായി ചേർക്കപ്പെട്ടതിനെ ഈ വായന ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ബന്ധപരവും സമൂഹപരവുമായ ശാന്തിയും ഐക്യവും സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളതുല്യം.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ മശീഹാസംബന്ധമായ അർഥം നിലനിർത്തുന്നു; പരമ്പരാഗതമായ “ക്രിസ്തുവിന്റെ” എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: βραβευέτω
  choice: ഭരിക്കട്ടെ
  rationale: വിധികർത്താവോ മത്സരനിർണായകനോ പോലെ നിർണായകമായി പ്രവർത്തിക്കുക എന്ന ക്രിയയുടെ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ ഭരണപരമായ നിർണയശക്തിയോടെ അവതരിപ്പിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ആന്തരികജീവിതം, മനോഭാവം, ഇച്ഛാശക്തി എന്നിവയെ ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുകയും ഗ്രീക്കിലെ ബഹുവചനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς ἣν
  choice: ആ സമാധാനത്തിലേക്കുതന്നെ
  rationale: ബന്ധസർവനാമം സമാധാനത്തെ തിരികെ സൂചിപ്പിക്കുന്നതു വ്യക്തമാക്കുന്നു; εἰς എന്നതിലെ ലക്ഷ്യദിശയും καί നൽകുന്ന ഊന്നലും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν ἑνὶ σώματι
  choice: ഏകശരീരത്തിൽ
  rationale: ἐν + ദ്വിതീയാവിഭക്തിയുടെ സ്ഥല/മണ്ഡല ആശയം നേരിട്ട് നിലനിർത്തുകയും പൗലോസിന്റെ ശരീരരൂപകം വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εὐχάριστοι γίνεσθε
  choice: നന്ദിയുള്ളവരായിരിക്കുക
  rationale: നന്ദിയുള്ള നില കൈക്കൊണ്ട് അതിൽ തുടരാനുള്ള ആഹ്വാനം ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനപ്പേരായ ശക്തി മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: “ഏകശരീരം” എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: സഭയെ തുറന്നുപറയാതെ ശരീരരൂപകം അതേപടി നിലനിർത്തുന്നു
  alternative: “ഏകസഭയിൽ” എന്ന് വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തുക
  rationale: സഭാസമൂഹത്തിന്റെ ഐക്യം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും മൂലവാചകം പറയുന്നതിലധികം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കാനും പൗലോസിന്റെ രൂപകം സംരക്ഷിക്കാനും ഈ രൂപം തെരഞ്ഞെടുത്തു.
- issue: εἰς, ἐν എന്നിവ മൂലം വിളിയുടെ ലക്ഷ്യമോ മണ്ഡലമോ
  choice: സമാധാനത്തിലേക്ക് വിളിക്കപ്പെട്ടു; ഏകശരീരത്തിൽ
  alternative: ഏകശരീരത്തിലേക്ക് വിളിക്കപ്പെട്ടു
  rationale: സമാധാനം വിളിയുടെ ലക്ഷ്യമായും ഏകശരീരം അതിന്റെ സമൂഹപരമായ മണ്ഡലമായും വായിക്കുന്ന സ്വാഭാവിക വ്യാകരണബന്ധം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഉൾച്ചേർക്കലിനെ ഊന്നുന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. “ഹൃദയങ്ങൾ,” “ഏകശരീരം” എന്നീ ബൈബിൾരൂപങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
