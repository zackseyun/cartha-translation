id: COL.3.11
reference: Colossians 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: ml
  text: അവിടെ ഗ്രീക്കുകാരനും യെഹൂദനും, പരിച്ഛേദനയും അഗ്രചർമ്മവും, ബർബരനും സ്കിത്യനും, അടിമയും സ്വതന്ത്രനും എന്നില്ല; മറിച്ച്, മശീഹ എല്ലാമാണ്, എല്ലാവരിലും ഉണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “മശീഹ എല്ലാമാണ്, എല്ലാവരിലും ഉണ്ട്.” ഗ്രീക്കിലെ “എല്ലാവരിലും” എന്ന സംക്ഷിപ്ത പ്രയോഗം പുതുക്കപ്പെട്ട സമൂഹത്തിലെ എല്ലാവരെയും സൂചിപ്പിക്കാം; “എല്ലാറ്റിലും” എന്ന വിശാലമായ അർഥവും വ്യാകരണപരമായി സാധ്യമാണ്. “മശീഹ” എന്നതിന് പരമ്പരാഗതമായി “ക്രിസ്തു” എന്നും പറയുന്നു.'
    reason: മൂലപാഠത്തിലെ ἐν πᾶσιν എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ വ്യാപ്തിയും Χριστός എന്നതിന്റെ പരമ്പരാഗത പദരൂപവും രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ὅπου
  choice: അവിടെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പുതുക്കപ്പെട്ട മനുഷ്യന്റെ മണ്ഡലത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സ്ഥാനസൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἔνι
  choice: എന്നില്ല
  rationale: ഈ മണ്ഡലത്തിൽ പ്രസ്തുത തിരിച്ചറിയൽ-വ്യത്യാസങ്ങൾക്ക് നിർണായക സ്ഥാനമില്ലെന്ന ശക്തമായ നിഷേധം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: ഗ്രീക്കുകാരനും യെഹൂദനും
  rationale: വിശാലമായ ‘ജാതിക്കാരൻ’ എന്നതിനു പകരം മൂലപാഠത്തിലെ പ്രത്യേക വംശീയ-സാംസ്കാരിക ജോടി നിലനിർത്തുന്നു.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: പരിച്ഛേദനയും അഗ്രചർമവും
  rationale: സാമൂഹിക-മതപരമായ തിരിച്ചറിയലുകളായി ഉപയോഗിച്ചിരിക്കുന്ന അമൂർത്ത നാമങ്ങളുടെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: βάρβαρος
  choice: ബർബരൻ
  rationale: ഗ്രീക്കേതര ഭാഷ സംസാരിക്കുന്നവരെക്കുറിച്ചുള്ള പുരാതന സാംസ്കാരിക വർഗീകരണത്തിന്റെ മൂർച്ച മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: Σκύθης
  choice: ശകൻ
  rationale: സ്കിതിയൻ ജനവിഭാഗത്തിനുള്ള മലയാളത്തിൽ സ്ഥാപിതമായ ചരിത്രനാമം ഉപയോഗിക്കുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ‘സ്വതന്ത്രൻ’ എന്ന വിരുദ്ധപദത്തോടുള്ള സാമൂഹിക-നിയമപരമായ ബന്ധനസ്ഥിതിയുടെ വ്യക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἐλεύθερος
  choice: സ്വതന്ത്രൻ
  rationale: അടിമയുടെ നേരിട്ടുള്ള സാമൂഹിക വിരുദ്ധസ്ഥാനം വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ πάντα
  choice: എല്ലാം
  rationale: മശീഹയുടെ സമഗ്രമായ പ്രാധാന്യം സംക്ഷിപ്തമായി അറിയിക്കുകയും മൂലപാഠം വിശദീകരിക്കാത്ത തത്ത്വചിന്താപരമായ കൃത്യത ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാവരിലും ഉള്ളതും അവിടുന്നുതന്നെ
  rationale: സന്ദർഭത്തിലെ പുതുക്കപ്പെട്ട സമൂഹത്തിലെ അംഗങ്ങളെയാണ് മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; ‘ഉള്ളതും’ എന്നതിന്റെ സൂചിത ക്രിയ വ്യക്തമാക്കുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ അഭിഷിക്തനായവൻ എന്ന പദവിയായാണ് പ്രവർത്തിക്കുന്നത്; അതിന്റെ ശീർഷകാർഥം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν πᾶσιν എന്നതിന്റെ വ്യാപ്തി
  choice: എല്ലാവരിലും
  alternative: എല്ലാറ്റിലും
  rationale: തൊട്ടുമുമ്പുള്ള പട്ടിക പുതുക്കപ്പെട്ട സമൂഹത്തിലെ വിവിധ മനുഷ്യവിഭാഗങ്ങളെക്കുറിച്ചായതിനാൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന വായനയ്ക്കാണ് സന്ദർഭപരമായ മുൻതൂക്കം. എന്നാൽ വിശാലമായ വായനയ്ക്കുള്ള ഗ്രീക്ക് സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ പ്രയോഗത്തിൽ പദവിയുടെ അർഥം സജീവമാണ്; അതിനാൽ ശീർഷകാർഥം നേരിട്ട് നൽകുന്നു.
- issue: δοῦλος എന്നതിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ
  rationale: ἐλεύθερος എന്നതുമായുള്ള വ്യക്തമായ സാമൂഹിക-നിയമപരമായ വൈരുധ്യം കാരണം ബന്ധിതസ്ഥിതി മയപ്പെടുത്താത്ത പദം ആവശ്യമാണ്.
- issue: തിരിച്ചറിയൽ വ്യത്യാസങ്ങളുടെ നിഷേധം
  choice: ഓരോ ജോടിക്കും ബാധകമാകുന്ന വിധത്തിൽ ‘എന്നില്ല’ ആവർത്തിച്ചു
  alternative: ആദ്യ ജോടിക്കുശേഷം മാത്രം ‘എന്നില്ല’
  rationale: οὐκ ἔνι എന്ന ഏക നിഷേധത്തിന്റെ വ്യാപ്തി മുഴുവൻ പട്ടികയിലേക്കും നീളുന്നതു മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; വ്യക്തികളുടെ അസ്തിത്വം ഇല്ലാതാകുന്നു എന്നതല്ല, ഈ മണ്ഡലത്തിലെ വിഭാഗീയ നിർണായകതയാണ് നിഷേധിക്കപ്പെടുന്നത്.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പുരാതന വംശീയ-സാമൂഹിക പദങ്ങളുടെ ചരിത്രപരമായ മൂർച്ച നിലനിർത്തിയിട്ടുണ്ട്; വാക്യത്തിന്റെ പട്ടികാസ്വഭാവവും ശക്തമായ വിരോധവും അർദ്ധവിരാമങ്ങളിലൂടെ വ്യക്തമാക്കിയിട്ടുണ്ട്.
