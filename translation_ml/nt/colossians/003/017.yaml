id: COL.3.17
reference: Colossians 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: ml
  text: നിങ്ങൾ വാക്കിലോ പ്രവൃത്തിയിലോ[a] എന്തു ചെയ്താലും, അതെല്ലാം കർത്താവായ യേശുവിന്റെ നാമത്തിൽ[b] ചെയ്യുക; അവൻ മുഖാന്തരം പിതാവായ ദൈവത്തിനു നന്ദി അർപ്പിച്ചുകൊണ്ട് ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സംസാരത്തിലോ പ്രവർത്തനത്തിലോ.’
    reason: lexical_alternative
  - marker: b
    text: ‘നാമത്തിൽ’ എന്നതിന് ‘അധികാരത്തിൻ കീഴിൽ’ എന്നോ ‘പ്രതിനിധീകരിച്ച്’ എന്നോ ഉള്ള അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: നിങ്ങൾ ... എന്തു ചെയ്താലും
  rationale: അനിശ്ചിതവും സമഗ്രവുമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ‘ചെയ്യുന്ന എന്തും’ എന്ന തുറന്ന വ്യാപ്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: വാക്കിലോ പ്രവൃത്തിയിലോ
  rationale: സംസാരവും പ്രായോഗിക പ്രവർത്തനവും തമ്മിലുള്ള സംക്ഷിപ്തവും സമതുലിതവുമായ വിരുദ്ധജോടി നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: അതെല്ലാം
  rationale: മുൻപറഞ്ഞ ‘എന്തു ചെയ്താലും’ എന്ന ആശയത്തെ സമഗ്രമായി വീണ്ടും എടുത്തുകാട്ടുന്ന ഗ്രീക്ക് പുനരുക്തി മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ നാമത്തിൽ
  rationale: അധികാരം, പ്രതിനിധാനം, ബന്ധം എന്നീ അർഥസാധ്യതകളുള്ള ബൈബിൾ ശൈലി ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ഇവിടെ κύριος ക്രിസ്തുവിന്റെ പദവിയായതിനാൽ ‘കർത്താവ്’ അതിന്റെ പുതിയനിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: εὐχαριστοῦντες
  choice: നന്ദി അർപ്പിച്ചുകൊണ്ട്
  rationale: മുഖ്യ ആഹ്വാനത്തോടൊപ്പം തുടരുന്ന നന്ദിപ്രകടനത്തെ വർത്തമാനകാല പങ്കാളിത്തക്രിയയുടെ സ്വഭാവത്തിന് യോജിച്ച രീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τῷ θεῷ πατρὶ
  choice: പിതാവായ ദൈവത്തിനു
  rationale: θεῷ എന്നതിനോടു സമാനാധികരണമായി വരുന്ന πατρίയെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവൻ മുഖാന്തരം
  rationale: സർവനാമത്തിന്റെ ഏറ്റവും അടുത്ത പൂർവപദമായ കർത്താവായ യേശുവിലേക്കുള്ള സൂചനയും മധ്യസ്ഥതയുടെ ആശയവും അധിക വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘കർത്താവായ യേശുവിന്റെ നാമത്തിൽ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘കർത്താവായ യേശുവിന്റെ നാമത്തിൽ’ എന്ന ശൈലി നിലനിർത്തി.
  alternative: ‘കർത്താവായ യേശുവിന്റെ അധികാരത്തിൻ കീഴിൽ’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശുവിനെ പ്രതിനിധീകരിച്ച്’.
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ അധികാരം, പ്രതിനിധാനം, തിരിച്ചറിയൽ/ബന്ധം എന്നിവ ഉൾപ്പെടാം; അവയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കാതിരിക്കാൻ മൂലശൈലി നിലനിർത്തുന്നു.
- issue: ‘അവൻ മുഖാന്തരം’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചിതൻ
  choice: സർവനാമം കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തി.
  alternative: വ്യക്തമായ ക്രിസ്തുകേന്ദ്ര ഊന്നലില്ലാത്ത പൊതുവായ ബന്ധമായി വായിക്കുക.
  rationale: ഏറ്റവും അടുത്ത പൂർവപദം ‘കർത്താവായ യേശു’ ആണ്; അതിനാൽ പിതാവായ ദൈവത്തോടുള്ള നന്ദി യേശു മുഖാന്തരം അർപ്പിക്കുന്നു എന്ന വായന വാക്യഘടനയിൽനിന്ന് സ്വാഭാവികമായി വരുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാക്ക്/പ്രവൃത്തി,’ ‘നാമത്തിൽ,’ ‘മുഖാന്തരം’ എന്നീ പരിചിത ബൈബിൾ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന വിധത്തിൽ നിലനിർത്തി; ‘അതെല്ലാം’ എന്ന പുനരുക്തി ഗ്രീക്കിലെ സമഗ്ര ഊന്നൽ സംരക്ഷിക്കുന്നു.
