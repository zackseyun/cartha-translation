language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: ml
  text: കർത്താവിൽനിന്ന് അവകാശത്തിന്റെ പ്രതിഫലം നിങ്ങൾക്കു ലഭിക്കുമെന്ന് അറിഞ്ഞുകൊണ്ട്, നിങ്ങൾ സേവിക്കുന്നത് കർത്താവായ മശീഹാവിനെയാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: ‘കർത്താവായ ക്രിസ്തുവിനെ.’'
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്ക് ക്രിയ നിർദ്ദേശകരൂപത്തിലാണ്—‘നിങ്ങൾ സേവിക്കുന്നു’; ‘സേവിക്കുവിൻ’ എന്ന നേരിട്ടുള്ള ആജ്ഞാരൂപത്തിലല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: അറിഞ്ഞുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനവുമായി ബന്ധിപ്പിക്കുന്ന കർത്തൃസമാനകാലിക ക്രിയാരൂപം നിലനിർത്തുന്നു; ‘കാരണം നിങ്ങൾ അറിയുന്നു’ എന്ന കാര്യകാരണഭാവം നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἀπὸ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: ἀπό + genitive സൂചിപ്പിക്കുന്ന ഉറവിടഭാവം നേരിട്ട് നൽകുന്നു; അടിമ–യജമാന പശ്ചാത്തലമുണ്ടെങ്കിലും ഇവിടെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ ‘യജമാനനിൽനിന്ന്’ എന്നതിനു പകരം ‘കർത്താവിൽനിന്ന്’ തെരഞ്ഞെടുത്തു.
- source_word: ἀπολήμψεσθε
  choice: നിങ്ങൾക്കു ലഭിക്കും
  rationale: ഭാവികാല മധ്യമ നിർദ്ദേശകരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; തിരികെ ലഭിക്കൽ എന്ന സൂക്ഷ്മഭാവം ‘പ്രതിഫലം’ എന്ന നാമത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: ἀνταπόδοσιν
  choice: പ്രതിഫലം
  rationale: തിരിച്ചുനൽകുന്ന പ്രതിഫലം/പ്രതിഫലദാനം എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τῆς κληρονομίας
  choice: അവകാശത്തിന്റെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ genitive ബന്ധം ‘അവകാശത്തിന്റെ പ്രതിഫലം’ എന്നു നിലനിർത്തുന്നു; ‘പ്രതിഫലമായ അവകാശം’ എന്ന് വ്യാഖ്യാനിച്ച് ബന്ധം പൂർണമായി തീർപ്പാക്കുന്നില്ല.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: കർത്താവായ മശീഹായെ
  rationale: δουλεύετε ആവശ്യപ്പെടുന്ന ലക്ഷ്യബന്ധം മലയാളത്തിലെ കർമരൂപത്തിൽ നൽകുന്നു. Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; κύριος ‘കർത്താവ്’ ആയി നിലനിർത്തി.
- source_word: δουλεύετε
  choice: നിങ്ങൾ സേവിക്കുന്നത് … യെയാണ്
  rationale: രണ്ടാംപുരുഷ ബഹുവചന വർത്തമാനകാല നിർദ്ദേശകരൂപം പ്രസ്താവനയായി നിലനിർത്തുന്നു. മലയാളത്തിലെ ഊന്നൽഘടന യഥാർഥത്തിൽ ആരെയാണ് സേവിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; നേരിട്ടുള്ള ആജ്ഞാരൂപമാക്കുന്നില്ല.
theological_decisions:
- issue: Χριστῷ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ പ്രയോഗത്തിൽ Χριστός പേരുപോലുള്ള ഘടകത്തേക്കാൾ അഭിഷിക്തനായ രാജാവിന്റെ സ്ഥാനപ്പേരായി സജീവമാണ്. അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം നൽകുന്ന ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: δουλεύετε എന്ന ക്രിയയുടെ ഭാവം
  choice: 'നിർദ്ദേശക പ്രസ്താവന: ‘നിങ്ങൾ സേവിക്കുന്നത്’'
  alternative: 'ആജ്ഞ: ‘സേവിക്കുവിൻ/സേവിക്കുക’'
  rationale: ഗ്രീക്ക് രൂപം present active indicative ആണ്, imperative അല്ല. അതിനാൽ വീട്ടുകാർക്കുള്ള പ്രബോധനത്തെ ബലപ്പെടുത്തുന്ന ഓർമ്മപ്പെടുത്തലായി പരിഭാഷപ്പെടുത്തി; സന്ദർഭം മൂലം ചിലർ ആജ്ഞാഭാവത്തിൽ ഗ്രഹിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: τῆς κληρονομίας എന്ന genitive ബന്ധം
  choice: അവകാശത്തിന്റെ പ്രതിഫലം
  alternative: പ്രതിഫലമായ അവകാശം
  rationale: പ്രതിഫലവും അവകാശവും തമ്മിലുള്ള ബന്ധം ഗ്രീക്കിൽ സംക്ഷിപ്തവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമാണ്. മുഖ്യപാഠം ആ ബന്ധത്തെ വിശദീകരിച്ച് തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അറിഞ്ഞുകൊണ്ട്’ മുൻവാക്യത്തോടുള്ള പങ്കാളിക്രിയാബന്ധം നിലനിർത്തുന്നു. ‘നിങ്ങൾ സേവിക്കുന്നത് … യെയാണ്’ എന്ന ഊന്നൽഘടന ഗ്രീക്കിലെ indicative ഭാവവും ക്രിസ്തുവാണ് യഥാർഥ കർത്താവ് എന്ന സന്ദർഭപ്രാധാന്യവും ഒരുമിച്ച് സ്വാഭാവികമായി നൽകുന്നു.
