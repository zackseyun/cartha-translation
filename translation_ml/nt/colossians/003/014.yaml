  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: ml
  text: ഇവയ്ക്കെല്ലാം മീതെ സ്നേഹം ധരിക്കുവിൻ; അതു പരിപൂർണതയുടെ ബന്ധമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
