  to: പുതിയ മനുഷ്യനെ[a] ധരിച്ചവരായി, അവനെ സൃഷ്ടിച്ചവന്റെ പ്രതിരൂപത്തിന് അനുസൃതമായി അറിവിലേക്കു[b] പുതുക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു.
