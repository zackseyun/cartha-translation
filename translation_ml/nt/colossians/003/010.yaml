source:
  edition: SBLGNT
  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: ml
  text: പുതിയ മനുഷ്യനെ[a] ധരിച്ചവരായി, അവനെ സൃഷ്ടിച്ചവന്റെ പ്രതിരൂപത്തിന് അനുസൃതമായി അറിവിലേക്കു[b] പുതുക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പുതിയ സ്വത്വത്തെ” അല്ലെങ്കിൽ “പുതിയ വ്യക്തിയെ.” ഗ്രീക്ക് പ്രയോഗം സമീപസന്ദർഭത്തിലെ “പഴയ മനുഷ്യൻ” എന്നതിനു വിരുദ്ധമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “പൂർണമായ അറിവിലേക്ക്” അല്ലെങ്കിൽ “ആഴമേറിയ അറിവിലേക്ക്.” ഗ്രീക്ക് പദത്തിന് കൂടുതൽ പൂർണമായ അറിവ് എന്ന അർത്ഥസൂചന ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: ധരിക്കുകയും ചെയ്തിരിക്കുന്നു
  rationale: വസ്ത്രം ധരിക്കുന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ മുൻക്രിയയോടുള്ള ബന്ധവും സമാപ്തപ്രവൃത്തിയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τὸν νέον
  choice: പുതിയ മനുഷ്യനെ
  rationale: വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗവും സമീപസന്ദർഭത്തിലെ ‘പഴയ മനുഷ്യൻ/പുതിയ മനുഷ്യൻ’ എന്ന മാനവശാസ്ത്രപരമായ വൈരുധ്യവും നിലനിർത്തുന്നു. ഇവിടെ ‘മനുഷ്യൻ’ പൊതുവായ മനുഷ്യവ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνακαινούμενον
  choice: പുതുക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കർമണി കൃദന്തത്തിലെ തുടരുന്ന പ്രക്രിയയും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς ἐπίγνωσιν
  choice: പരിജ്ഞാനത്തിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തിലേക്കോ ഫലത്തിലേക്കോ ഉള്ള നീക്കത്തെ നിലനിർത്തുന്നു. ἐπίγνωσις എന്ന പദത്തിന്റെ അറിവ്/കൂടുതൽ പൂർണമായ അറിവ് എന്ന സാധ്യതകളിൽ ‘പരിജ്ഞാനം’ ഗൗരവമുള്ളതും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാത്തതുമായ തിരഞ്ഞെടുപ്പാണ്.
- source_word: κατ’ εἰκόνα
  choice: പ്രതിരൂപത്തിന് അനുസൃതമായി
  rationale: κατά ഇവിടെ മാനദണ്ഡത്തോടോ മാതൃകയോടോ ഉള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു; ഉല്പത്തി പുസ്തകത്തിലെ ദൈവപ്രതിരൂപ ഭാഷയിലേക്കുള്ള സാധ്യതയുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: അവനെ സൃഷ്ടിച്ചവന്റെ
  rationale: സൃഷ്ടിച്ച വ്യക്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദന്തഘടന നിലനിർത്തുന്നു; αὐτόν എന്നതിന്റെ വ്യാകരണപരമായ പുൽലിംഗം ‘പുതിയ മനുഷ്യൻ’ എന്ന മുൻപദവുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὸν νέον എന്ന മാനവശാസ്ത്രപരമായ പ്രയോഗം
  choice: പുതിയ മനുഷ്യൻ
  alternative: പുതിയ സ്വത്വം / പുതിയ വ്യക്തി
  rationale: ഗ്രീക്കിലെ നാമീകൃത വിശേഷണത്തെയും സന്ദർഭത്തിലെ പഴയ-പുതിയ മനുഷ്യൻ എന്ന വൈരുധ്യത്തെയും ഏറ്റവും സുതാര്യമായി നിലനിർത്തുന്നു. ഇത് പുരുഷന്മാർക്ക് മാത്രമുള്ള പരാമർശമല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐπίγνωσις എന്ന പദത്തിന്റെ ശക്തി
  choice: പരിജ്ഞാനം
  alternative: പൂർണമായ അറിവ് / ആഴമേറിയ അറിവ്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ പൂർണതയോ ആഴമോ എന്ന സൂചന ഉണ്ടായേക്കാമെങ്കിലും, അത് മുഖ്യപാഠത്തിൽ നിർബന്ധമായി ചേർക്കാതെ യഥാർഥ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലപാഠത്തിലെ വസ്ത്രധാരണ രൂപകം, തുടരുന്ന പുതുക്കൽ, പ്രതിരൂപഭാഷ, അറിവിലേക്കുള്ള ലക്ഷ്യഗതി എന്നിവ നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ അടിക്കുറിപ്പുകളുടെ സൂചനകൾ ആശയപരമായി മറിച്ചിട്ടതായി തോന്നുന്നതിനാൽ, മലയാളത്തിൽ [a] ‘പുതിയ മനുഷ്യൻ’ എന്നിടത്തും [b] ‘പരിജ്ഞാനത്തിലേക്ക്’ എന്നിടത്തും അർത്ഥാനുസൃതമായി സ്ഥാപിച്ചു.
