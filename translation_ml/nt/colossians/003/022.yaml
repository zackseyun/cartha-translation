revisions:
- from: അടിമകളേ[a], ജഡപ്രകാരമുള്ള നിങ്ങളുടെ യജമാനന്മാരെ[c] എല്ലാ കാര്യത്തിലും അനുസരിക്കുക. മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരെപ്പോലെ, അവർ നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം സേവിക്കാതെ[b], ഹൃദയത്തിന്റെ ആത്മാർഥതയോടെ കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട് അനുസരിക്കുക.
  to: അടിമകളേ[a], ജഡപ്രകാരമുള്ള നിങ്ങളുടെ യജമാനന്മാരെ[c] എല്ലാ കാര്യങ്ങളിലും അനുസരിക്കുക—മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരെപ്പോലെ, അവർ നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം സേവിക്കുന്നവരായല്ല; മറിച്ച് ഹൃദയത്തിന്റെ ആത്മാർഥതയോടെ, കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട്[b].
  rationale: 'The revision retains all source-level lexical decisions and historical specificity while restoring a single governing imperative. The contrast is expressed as the manner in which the obedience is to be carried out: not merely under observation or to please people, but with wholehearted sincerity and fear of the Lord. Footnote markers and content remain complete and correctly placed.'
  reviewer_model: gpt-5.6-terra
