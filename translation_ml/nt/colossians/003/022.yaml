id: COL.3.22
reference: Colossians 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: ml
  text: അടിമകളേ[a], ജഡപ്രകാരമുള്ള നിങ്ങളുടെ യജമാനന്മാരെ[c] എല്ലാ കാര്യങ്ങളിലും അനുസരിക്കുക—മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരെപ്പോലെ, അവർ നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം സേവിക്കുന്നവരായല്ല; മറിച്ച് ഹൃദയത്തിന്റെ ആത്മാർഥതയോടെ, കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അടിമകൾ’ (ഗ്രീക്ക്: δοῦλοι) എന്നത് ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ പദം സാധാരണയായി ഒരു യജമാനന്റെ അധികാരത്തിൻ കീഴിലുള്ള അടിമയാക്കപ്പെട്ട വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ഉദ്ദേശിക്കുന്നത്, തങ്ങളെ ആരെങ്കിലും നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം നന്നായി ജോലി ചെയ്യുന്നതാണ്.
    reason: cultural_note
  - marker: c
    text: ‘ജഡപ്രകാരമുള്ള’ എന്നത് ‘ഭൗമികരായ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ യജമാനന്മാരുടെ അധികാരം ഈ ലോകത്തിലെ മാനുഷികബന്ധങ്ങളിൽ പരിമിതമാണെന്ന് ഈ പ്രയോഗം ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: അടിമകളേ
  rationale: പുരാതന ഗൃഹക്രമത്തിന്റെ പശ്ചാത്തലത്തിൽ മറ്റൊരാളുടെ ഉടമസ്ഥാധികാരത്തിൻ കീഴിലുള്ള അടിമകളെയാണ് δοῦλοι സൂചിപ്പിക്കുന്നത്. ‘ദാസന്മാരേ’ എന്ന മൃദുവായ പദത്തേക്കാൾ ചരിത്രപരമായ യാഥാർഥ്യം ‘അടിമകളേ’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὑπακούετε
  choice: അനുസരിക്കുക
  rationale: അധികാരത്തിൻ കീഴിൽ പറയുന്നതനുസരിച്ച് പ്രവർത്തിക്കാനുള്ള ബഹുവചന ആജ്ഞയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κατὰ πάντα
  choice: എല്ലാ കാര്യത്തിലും
  rationale: പ്രയോഗത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: ജഡപ്രകാരമുള്ള നിങ്ങളുടെ യജമാനന്മാരെ
  rationale: മാനുഷികവും ഈ ലോകത്തേക്കു പരിമിതവുമായ ബന്ധത്തെ സൂചിപ്പിക്കുന്ന κατὰ σάρκα എന്ന പൗലോസീയ പ്രയോഗം ‘ഭൗമിക’ എന്നു ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു; മനുഷ്യരായ κυρίοις എന്നതിന് ‘യജമാനന്മാർ’ ഉപയോഗിക്കുന്നത് പിന്നീടുള്ള ദൈവിക സ്ഥാനപ്പേരായ ‘കർത്താവ്’ എന്നതിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: അവർ നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം സേവിക്കാതെ
  rationale: നിരീക്ഷിക്കപ്പെടുമ്പോൾ മാത്രം ചെയ്യുന്ന സേവനം എന്ന അപൂർവ സംയുക്തപദത്തിന്റെ അർഥം, മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദ പരിഭാഷ ഒഴിവാക്കി നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരെപ്പോലെ
  rationale: മനുഷ്യരുടെ അംഗീകാരം നേടുക എന്ന ലക്ഷ്യവും അതിലെ വിമർശനാത്മക ഭാവവും സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: ഹൃദയത്തിന്റെ ആത്മാർഥതയോടെ
  rationale: ഇവിടെ ἁπλότης ബൗദ്ധികമായ ലാളിത്യമല്ല, കപടമില്ലാത്ത ഏകമനസ്സും സത്യസന്ധതയുമാണ് സൂചിപ്പിക്കുന്നത്; ‘ആത്മാർഥത’ ആ നൈതിക അർഥം നൽകുന്നു.
- source_word: φοβούμενοι τὸν κύριον
  choice: കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട്
  rationale: ക്രിസ്തീയ കർത്താവിനോടുള്ള ഭയഭക്തി എന്ന ആശയം ‘ബഹുമാനിക്കുക’ എന്നു മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു; κύριος ഇവിടെ ദൈവിക സ്ഥാനപ്പേരായതിനാൽ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: അടിമത്തത്തിന്റെ സാമൂഹിക പശ്ചാത്തലത്തിലുള്ള നൈതിക നിർദേശം
  choice: δοῦλοι, κυρίοις എന്നിവയെ ‘അടിമകൾ’, ‘യജമാനന്മാർ’ എന്നു ചരിത്രപരമായ യാഥാർഥ്യം മറയ്ക്കാതെ പരിഭാഷപ്പെടുത്തി; മനുഷ്യ യജമാനന്മാരും കർത്താവും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമാക്കി.
  alternative: ആധുനിക തൊഴിൽബന്ധങ്ങളോട് ചേർത്ത് ‘വേലക്കാർ’, ‘തൊഴിലുടമകൾ’ എന്നു മൃദൂകരിക്കുക.
  rationale: ഈ വാക്യം പുരാതന അടിമത്തത്തിന്റെ പശ്ചാത്തലത്തിലാണ്. അതിനെ ആധുനിക സ്വതന്ത്ര തൊഴിൽബന്ധമായി അവതരിപ്പിക്കുന്നത് മൂലപാഠത്തിലെ സാമൂഹികവും നൈതികവുമായ സംഘർഷം മറയ്ക്കും. എന്നാൽ നിർദേശം പരിഭാഷപ്പെടുത്തുന്നത് ആ സ്ഥാപനത്തെ അംഗീകരിക്കുന്നുവെന്ന വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അനുസരിക്കുക’ എന്ന രൂപം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന നേരിട്ടുള്ള ആജ്ഞയായി ഉപയോഗിച്ചു. ‘ജഡപ്രകാരമുള്ള’ എന്ന പൗലോസീയ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ സ്വാഭാവിക അർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. അസ്വാഭാവികമായ ‘കൺസേവനം’ പോലുള്ള പദാനുപദരൂപത്തിന് പകരം ὀφθαλμοδουλίαയുടെ അർഥം മുഖ്യപാഠത്തിൽ തുറന്നുപറഞ്ഞു.
