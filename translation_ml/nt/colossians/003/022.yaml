review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the principal terms, including δοῦλοι as «അടിമകളേ», the human masters as distinct from the Lord, the comprehensive force of «എല്ലാ കാര്യത്തിലും», and the sincerity/fear-of-the-Lord motivation. However, its final repeated «അനുസരിക്കുക» makes the Greek participial sequence sound like a second imperative and unnecessarily alters the sentence’s structure.
  naturalness: Most wording is clear modern Malayalam. «അവർ നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം സേവിക്കാതെ» communicates ὀφθαλμοδουλίαις naturally, but the repeated imperative after «കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട്» is stylistically heavy and obscures that the final clauses qualify the one command to obey.
  terminology: «അടിമകൾ», «യജമാനന്മാർ», «ജഡപ്രകാരമുള്ള», and «കർത്താവ്» appropriately preserve the historical setting and the lexical/theological contrast. The footnotes are accurate and their markers are correctly anchored in the revised wording.
  issues:
  - severity: medium
    issue: The main verb «അനുസരിക്കുക» is repeated at the end of the sentence.
    rationale: Greek has one imperative, ὑπακούετε, followed by contrasting prepositional phrases and a participle. Repeating the imperative is not required in Malayalam and can make «കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട്» appear to modify a second command rather than the stated obedience.
  revised_text: അടിമകളേ[a], ജഡപ്രകാരമുള്ള നിങ്ങളുടെ യജമാനന്മാരെ[c] എല്ലാ കാര്യങ്ങളിലും അനുസരിക്കുക—മനുഷ്യരെ പ്രസാദിപ്പിക്കുന്നവരെപ്പോലെ, അവർ നോക്കിക്കൊണ്ടിരിക്കുമ്പോൾ മാത്രം സേവിക്കുന്നവരായല്ല; മറിച്ച് ഹൃദയത്തിന്റെ ആത്മാർഥതയോടെ, കർത്താവിനെ ഭയപ്പെട്ടുകൊണ്ട്[b].
