  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: ml
  text: ഇവ നിമിത്തം ദൈവത്തിന്റെ ക്രോധം അനുസരണക്കേടിന്റെ പുത്രന്മാരുടെ മേൽ[a][b] വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
