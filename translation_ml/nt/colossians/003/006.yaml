    text: അഥവാ, “അനുസരണക്കേടിന്റെ മക്കൾ”; അതായത്, അനുസരണക്കേടാൽ അടയാളപ്പെടുന്ന ആളുകൾ.
    reason: lexical_alternative
  - marker: b
    text: ചില പുരാതന കൈയെഴുത്തുപ്രതികളിൽ “അനുസരണക്കേടിന്റെ പുത്രന്മാരുടെ മേൽ” എന്ന വാക്കുകൾ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: ഇവ നിമിത്തം
  rationale: διά + accusative causal sense. “ഇവ” മുൻവാക്യത്തിൽ പറഞ്ഞ ദുഷ്പ്രവൃത്തികളെ ബഹുവചനത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἔρχεται
  choice: വരുന്നു
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ സജീവതയും വരാനിരിക്കുന്ന ദൈവവിധിയുടെ ഭാവവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം
  rationale: ὀργή ഇവിടെ ദൈവത്തിന്റെ ന്യായവിധിയോടു ബന്ധപ്പെട്ട ക്രോധത്തെ സൂചിപ്പിക്കുന്നു; ജനിതകബന്ധവും ദൈവശാസ്ത്രപരമായ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ
  choice: മേൽ
  rationale: ക്രോധം എത്തുന്ന ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന ἐπίയുടെ ദിശാത്മക അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: അനുസരണക്കേടിന്റെ പുത്രന്മാർ
  rationale: അനുസരണക്കേടിനാൽ സ്വഭാവീകരിക്കപ്പെടുന്ന ആളുകളെ സൂചിപ്പിക്കുന്ന സെമിറ്റിക് ശൈലിയിലുള്ള പ്രയോഗം. ഉറവിടത്തിലെ υἱούς എന്ന പദവും പ്രയോഗത്തിന്റെ രൂപഭാവവും മുഖ്യപാഠത്തിൽ നിലനിർത്തി അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: “അനുസരണക്കേടിന്റെ പുത്രന്മാർ” എന്ന ഉറവിടഭാഷാ പ്രയോഗം അതേപടി നിലനിർത്തണമോ അർഥം മാത്രം പരിഭാഷപ്പെടുത്തണമോ
  choice: മുഖ്യപാഠത്തിൽ “അനുസരണക്കേടിന്റെ പുത്രന്മാർ” എന്നു നിലനിർത്തുക
  alternative: “അനുസരിക്കാത്തവർ” അഥവാ “അനുസരണക്കേടിനാൽ സ്വഭാവീകരിക്കപ്പെടുന്നവർ”
  rationale: ഗ്രീക്കിലെ രൂപകപ്രയോഗവും പുരുഷലിംഗപദവും മറച്ചുവയ്ക്കാതെ നിലനിർത്തുന്നു; എന്നാൽ അതു പുരുഷന്മാരെ മാത്രം പരാമർശിക്കുന്നതല്ലെന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας എന്ന പാഠഭാഗത്തിന്റെ പാഠവിമർശനപരമായ അനിശ്ചിതത്വം
  choice: SBLGNT മുഖ്യപാഠം അനുസരിച്ച് വാക്യഭാഗം ഉൾപ്പെടുത്തുകയും വ്യത്യാസം അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുക
  alternative: വാക്യഭാഗം ഒഴിവാക്കി “ദൈവത്തിന്റെ ക്രോധം വരുന്നു” എന്നു മാത്രം നൽകുക
  rationale: തിരഞ്ഞെടുത്ത ഗ്രീക്ക് പതിപ്പിന്റെ മുഖ്യപാഠം പരിഭാഷപ്പെടുത്തുന്നതിനൊപ്പം പ്രധാനപ്പെട്ട കൈയെഴുത്തുപ്രതി വ്യത്യാസം മറച്ചുവയ്ക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. “പുത്രന്മാർ” സാധാരണ സംസാരഭാഷയെക്കാൾ ഔപചാരികമാണെങ്കിലും ഉറവിടത്തിലെ രൂപകപ്രയോഗം നിലനിർത്താൻ മനപ്പൂർവം സ്വീകരിച്ചു; അതിന്റെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
