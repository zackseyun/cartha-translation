  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: ml
  text: കാരണം, അന്യായം ചെയ്യുന്നവന് താൻ ചെയ്ത അന്യായത്തിന് തക്കത് തിരികെ ലഭിക്കും[a]; പക്ഷപാതമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘താൻ ചെയ്ത അന്യായം തിരികെ ലഭിക്കും.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘മുഖം നോക്കലില്ല’; അതായത്, പുറമേയുള്ള പദവിയോ നിലയോ നോക്കി വിധിക്കുകയില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: കാരണം, അന്യായം ചെയ്യുന്നവന്
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘കാരണം’ എന്നു വ്യക്തമാക്കുന്നു. നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തം ഒരു പ്രത്യേക വ്യക്തിയെ മാത്രമല്ല, അന്യായം ചെയ്യുന്ന ആരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: κομίσεται
  choice: തിരികെ ലഭിക്കും
  rationale: ഈ സന്ദർഭത്തിൽ κομίζω ഒരാളുടെ പ്രവൃത്തിക്കനുസരിച്ചുള്ള ഫലം തിരിച്ചുലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. കർത്താവിനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘പ്രതിഫലം നൽകപ്പെടും’ എന്നതിനെക്കാൾ ‘തിരികെ ലഭിക്കും’ മൂലരൂപത്തിന്റെ തുറന്ന നില നന്നായി നിലനിർത്തുന്നു.
- source_word: ὃ ἠδίκησεν
  choice: താൻ ചെയ്ത അന്യായത്തിന് തക്കത്
  rationale: ബന്ധസർവനാമവും ἀδικέω എന്ന ക്രിയയും ചെയ്ത അന്യായത്തെയും അതിനൊത്ത തിരിച്ചുകിട്ടലിനെയും ബന്ധിപ്പിക്കുന്നു. ‘തക്കത്’ മലയാളത്തിൽ സ്വാഭാവികമായി ഈ പ്രതിഫലബന്ധം അറിയിക്കുന്നു; പകരം കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: അവിടെ പക്ഷപാതമില്ല
  rationale: προσωπολημψία പദവി, മുഖം, പുറമേയുള്ള നില എന്നിവ നോക്കി ഒരാളോട് അനുകൂലത കാണിക്കുന്ന പക്ഷപാതത്തെ സൂചിപ്പിക്കുന്നു. ‘പക്ഷപാതം’ ആധുനികവും ഗൗരവമുള്ളതുമായ പൊതുപദമാണ്.
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: അന്യായം ചെയ്യുന്നവന് / താൻ
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ആശയം പൊതുവായതാണ്. മലയാളത്തിലെ ‘ചെയ്യുന്നവൻ’ എന്ന ലിംഗസൂചന ഒഴിവാക്കി ‘ചെയ്യുന്നവന്’ എന്ന പൊതുവായി ഗ്രഹിക്കാവുന്ന രൂപവും ‘താൻ’ എന്ന പ്രതിഫലക സർവനാമവും ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ സ്വഭാവവും പക്ഷപാതരാഹിത്യവും
  choice: അന്യായം ചെയ്യുന്ന ആർക്കും അവരുടെ പ്രവൃത്തിക്കനുസരിച്ചുള്ള ഫലം പക്ഷപാതമില്ലാതെ ലഭിക്കുമെന്ന പൊതുതത്ത്വമായി വാക്യം നിലനിർത്തുന്നു.
  alternative: ഇത് അന്ത്യന്യായവിധിയെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ അടിമ-യജമാന സാമൂഹികബന്ധത്തിൽ മാത്രം ഒതുങ്ങുന്നു.
  rationale: ഗ്രീക്ക് വാചകം വിധിയുടെ കൃത്യമായ സമയമോ പ്രവർത്തനരീതിയോ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിശാലമായ ധാർമിക-ദൈവശാസ്ത്ര മുന്നറിയിപ്പിനെ ഏതെങ്കിലും ഒറ്റ സാഹചര്യത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘തിരികെ ലഭിക്കും’ മൂലത്തിലെ പ്രതിഫലധ്വനി നിലനിർത്തുന്നു; ‘അവിടെ’ എന്നത് ന്യായപ്രതിഫലത്തിന്റെ സാഹചര്യത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
