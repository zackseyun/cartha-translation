  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “കരുണയുടെ ഉള്ളന്തരാവയവങ്ങൾ”; ആഴത്തിൽനിന്നുയരുന്ന കരുണയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം.
