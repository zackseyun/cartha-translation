id: COL.3.8
reference: Colossians 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ml
  text: 'എന്നാൽ ഇപ്പോൾ നിങ്ങളും ഇവയെല്ലാം ഉപേക്ഷിക്കണം: കോപം, ക്രോധം, ദുഷ്ടത, ദൂഷണം, നിങ്ങളുടെ വായിൽനിന്നുള്ള അശ്ലീലസംസാരം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: ഉപേക്ഷിക്കണം
  rationale: വസ്ത്രം ഊരിവെക്കുന്നതുപോലെ മാറ്റിക്കളയുക എന്ന രൂപകാർഥമുള്ള ആജ്ഞയെ സ്വാഭാവികവും ശക്തവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὀργήν
  choice: കോപം
  rationale: നിലനിൽക്കുന്ന കോപാവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൊതുവായ മലയാളപദം.
- source_word: θυμόν
  choice: ക്രോധം
  rationale: ὀργήയിൽനിന്ന് വേർതിരിച്ച് തീവ്രവും പൊട്ടിപ്പുറപ്പെടുന്നതുമായ രോഷത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: κακίαν
  choice: ദുഷ്ടത
  rationale: ദോഷകരമായ മനോഭാവവും ദുഷ്പ്രവൃത്തിയിലേക്കുള്ള പ്രവണതയും ഉൾക്കൊള്ളുന്ന വിശാലപദം.
- source_word: βλασφημίαν
  choice: ദൂഷണം
  rationale: ഇവിടെ മനുഷ്യർക്കെതിരായ അപകീർത്തികരമായ സംസാരവും നിന്ദയും ഉൾക്കൊള്ളുന്ന അർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; ദൈവദൂഷണം എന്നതിലേക്ക് മാത്രം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: αἰσχρολογίαν
  choice: അശ്ലീലസംസാരം
  rationale: ലജ്ജാകരവും നീചവുമായ സംസാരത്തെ ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: നിങ്ങളുടെ വായിൽനിന്നുള്ള
  rationale: സംസാരവുമായി ബന്ധപ്പെട്ട ഉറവിടത്തെ മൂലപാഠത്തിനടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: βλασφημία എന്ന പദത്തിന്റെ പരിധി
  choice: ദൂഷണം
  alternative: ദൈവദൂഷണം
  rationale: സഹമനുഷ്യരോടുള്ള പെരുമാറ്റവും സംസാരവും പട്ടികപ്പെടുത്തുന്ന സന്ദർഭത്തിൽ പൊതുവായ നിന്ദയോ അപകീർത്തിയോ എന്ന അർഥം കൂടുതൽ യോജിക്കുന്നു; എങ്കിലും പദത്തിന് മറ്റു സന്ദർഭങ്ങളിൽ ദൈവദൂഷണം എന്നും അർഥമാകാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പട്ടികാരൂപം. ὀργή/θυμός എന്നീ അടുത്ത അർഥമുള്ള പദങ്ങളുടെ വ്യത്യാസം ‘കോപം/ക്രോധം’ എന്നിങ്ങനെ നിലനിർത്തി.
