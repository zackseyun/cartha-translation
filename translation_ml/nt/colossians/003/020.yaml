id: COL.3.20
reference: Colossians 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: ml
  text: മക്കളേ, എല്ലാ കാര്യങ്ങളിലും നിങ്ങളുടെ മാതാപിതാക്കളെ അനുസരിക്കുക. കാരണം, ഇത് കർത്താവിൽ[a] പ്രസാദകരമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവിൽ’ എന്നത് കർത്താവുമായുള്ള ബന്ധത്തിനുള്ളിൽ ഇത് പ്രസാദകരമാണെന്ന് സൂചിപ്പിക്കാം; ‘കർത്താവിന് പ്രസാദകരമാണ്’ എന്ന അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘സ്വീകാര്യമാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: മക്കളേ
  rationale: τέκνα ആൺമക്കളെയും പെൺമക്കളെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ സംബോധനയാണ്. ‘മക്കളേ’ ആ അർഥവും സംബോധനഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπακούετε
  choice: അനുസരിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപമായ ὑπακούετε ഇവിടെ മാതാപിതാക്കളുടെ അധികാരത്തെ മാനിച്ച് അനുസരിക്കണമെന്ന നിർദേശം നൽകുന്നു. ‘അനുസരിക്കുക’ ആജ്ഞയുടെ ശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῖς γονεῦσιν
  choice: നിങ്ങളുടെ മാതാപിതാക്കളെ
  rationale: γονεῦσιν എന്നത് ‘മാതാപിതാക്കൾ’ എന്നാണ്. ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും നേരിട്ടുള്ള സംബോധനയിൽ ‘നിങ്ങളുടെ’ എന്ന് ചേർക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ആശയം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: κατὰ πάντα
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: 'κατὰ πάντα ഇവിടെ വ്യാപ്തി സൂചിപ്പിക്കുന്നു: ‘എല്ലാ കാര്യങ്ങളിലും.’ സമയസൂചനയായി തെറ്റിദ്ധരിക്കാവുന്ന ‘എപ്പോഴും’ എന്നതിനെക്കാൾ ഇത് ഗ്രീക്ക് പ്രയോഗത്തോട് കൃത്യമാണ്.'
- source_word: τοῦτο
  choice: ഇത്
  rationale: τοῦτο മുൻപുള്ള അനുസരണനിർദേശത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഇത്’ ഗ്രീക്ക് വാക്യഘടനയും സൂചനയുടെ ലാളിത്യവും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: γάρ മുൻപുള്ള ആജ്ഞയുടെ കാരണം അവതരിപ്പിക്കുന്നു. ‘കാരണം’ ഈ വിശദീകരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: εὐάρεστόν ἐστιν
  choice: പ്രസാദകരമാണ്
  rationale: εὐάρεστος പ്രസാദകരമോ സ്വീകാര്യമോ ആയതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രസാദകരമാണ്’ ദൈവിക വിലയിരുത്തലിന്റെ ഭാവം നിലനിർത്തുകയും സ്വാഭാവികമായ മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ἐν κυρίῳ എന്ന പൗലോസിന്റെ ബന്ധപരമോ മേഖലാസൂചകമോ ആയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘കർത്താവിൽ’ എന്ന് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘എല്ലാ കാര്യങ്ങളിലും’ എന്ന ആജ്ഞയും ‘കർത്താവിൽ’ എന്ന പ്രയോഗവും തമ്മിലുള്ള ബന്ധം
  choice: രണ്ടു പ്രയോഗങ്ങളും ഗ്രീക്ക് വാക്യത്തിലെ ക്രമത്തിലും വ്യാപ്തിയിലും നിലനിർത്തി; ‘കർത്താവിൽ’ എന്നത് പ്രസാദകരമായിരിക്കുന്നതുമായി ചേർത്തു.
  alternative: ‘കർത്താവിന്റെ ഇഷ്ടത്തിനു യോജിക്കുന്ന എല്ലാ കാര്യങ്ങളിലും മാത്രം’ എന്ന് വ്യക്തമായ ഒരു പരിധി വിവർത്തനത്തിൽ ചേർക്കുക; അല്ലെങ്കിൽ ‘ഇത് കർത്താവിനെ പ്രസാദിപ്പിക്കുന്നു’ എന്ന് അർഥം ചുരുക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ‘എല്ലാ കാര്യങ്ങളിലും’ എന്നതിനു പിന്നാലെ വ്യക്തമായ ഒഴിവോ പരിധിയോ ചേർക്കുന്നില്ല. ἐν κυρίῳ എന്നത് ക്രിയയോട് നേരിട്ട് ചേർന്ന് ആജ്ഞയെ പരിമിതപ്പെടുത്തുന്നതിലും സ്വാഭാവികമായി εὐάρεστόν ἐστιν എന്ന പ്രസ്താവനയുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു. അതേസമയം, ‘കർത്താവിൽ’ എന്ന പ്രയോഗത്തിന് ബന്ധപരമോ മേഖലാസൂചകമോ ആയ വ്യാപ്തിയുണ്ട്; അതിനാൽ അതിനെ ‘കർത്താവിന്’ എന്നു മാത്രം വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘അനുസരിക്കുക’ എന്ന ആജ്ഞാരൂപം നേരിട്ടും സ്വാഭാവികവുമാണ്. ‘കർത്താവിൽ’ എന്ന പൗലോസീയ പ്രയോഗം അതിന്റെ യഥാർഥ വ്യാഖ്യാനവ്യാപ്തിയോടെ നിലനിർത്തി.
