id: COL.3.1
reference: Colossians 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: ml
  text: അതിനാൽ, നിങ്ങൾ മശീഹായോടുകൂടെ ഉയിർപ്പിക്കപ്പെട്ടവരാണെങ്കിൽ[a], മുകളിലുള്ളവയെ തേടുക. അവിടെയാണ് മശീഹാ[b] ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘അതിനാൽ, നിങ്ങൾ മശീഹായോടുകൂടെ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നതിനാൽ.’ ഗ്രീക്കിൽ ‘എങ്കിൽ’ എന്ന വ്യവസ്ഥാരൂപമാണുള്ളത്; എന്നാൽ സന്ദർഭത്തിൽ ആ വ്യവസ്ഥ സത്യമാണെന്ന ധാരണയോടെയാണ് അത് പറഞ്ഞിരിക്കുന്നതെന്ന് തോന്നുന്നു.'
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തോസ്’; അതിന്റെ പദവിയർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: അതുകൊണ്ട്, ... എങ്കിൽ
  rationale: οὖν എന്നതിന്റെ നിഗമനസ്വഭാവവും εἰ എന്നതിന്റെ വ്യവസ്ഥാരൂപവും നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ വ്യവസ്ഥ സത്യമാണെന്ന ധാരണയുണ്ടെങ്കിലും അത് നേരിട്ട് ‘ആകയാൽ’ എന്ന ഉറപ്പുവാക്യമായി മാറ്റുന്നില്ല.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: മശീഹായോടൊപ്പം ഉയിർപ്പിക്കപ്പെട്ടുവെങ്കിൽ
  rationale: ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപവും τῷ Χριστῷ സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം/ഐക്യവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰ ἄνω
  choice: മുകളിലുള്ളവ
  rationale: നപുംസക ബഹുവചന പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘സ്വർഗീയ കാര്യങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ζητεῖτε
  choice: തേടുക
  rationale: തുടർച്ചയായ ജീവിതദിശയെ സൂചിപ്പിക്കാവുന്ന വർത്തമാനകാല ആജ്ഞയുടെ അടിസ്ഥാന അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὁ Χριστός
  choice: മശീഹാ
  rationale: Χριστός എന്ന അഭിഷിക്തപദവിയുടെ സജീവമായ ശീർഷകാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുന്നു
  rationale: രാജകീയ മഹത്വത്തിന്റെ പരിചിതമായ വേദപുസ്തക ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘സിംഹാസനസ്ഥനായിരിക്കുന്നു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: Εἰ എന്ന വ്യവസ്ഥയുടെ ബലം
  choice: ‘... എങ്കിൽ’ എന്ന വ്യവസ്ഥാരൂപം നിലനിർത്തി
  alternative: ‘നിങ്ങൾ ... ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നതിനാൽ’
  rationale: പൗലോസ് വ്യവസ്ഥ സത്യമാണെന്ന് സന്ദർഭത്തിൽ കരുതുന്നുവെന്നു തോന്നുന്നെങ്കിലും ഗ്രീക്കിലെ യഥാർഥ വ്യവസ്ഥാരൂപവും അതിലെ വാചകസമ്മർദവും പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ അവതരണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ അഭിഷിക്തനായ രാജാവെന്ന പദവിയർഥം പ്രസക്തമായതിനാൽ ശീർഷകത്തെ അർഥസഹിതം നൽകുന്നു; അതിനെ വെറും വ്യക്തിനാമമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അന്വേഷിക്കുവിൻ’ പോലുള്ള പഴയ ആജ്ഞാരൂപത്തിനു പകരം സ്വാഭാവികമായ ‘തേടുക’ ഉപയോഗിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി; ആശയക്രമം നിലനിർത്തി.
