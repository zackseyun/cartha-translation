  - severity: low
    issue: The final clause is rendered as an independent sentence rather than directly as the relative location introduced by οὗ.
    rationale: ‘അവിടെയാണ് ... ഇരിക്കുന്നത്’ naturally preserves the explicit link between ‘the things above’ and the place where the Messiah is.
