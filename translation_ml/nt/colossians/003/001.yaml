- from: അതുകൊണ്ട്, നിങ്ങൾ മശീഹായോടൊപ്പം ഉയിർപ്പിക്കപ്പെട്ടുവെങ്കിൽ[a], മുകളിലുള്ളവ തേടുക. അവിടെ മശീഹാ[b] ദൈവത്തിന്റെ വലത്തുഭാഗത്ത് ഇരിക്കുന്നു.
