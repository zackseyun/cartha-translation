source:
  edition: SBLGNT
  text: ⸀ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: ml
  text: നിങ്ങൾ എന്തു ചെയ്താലും, മുഴുമനസ്സോടെ[a] പ്രവർത്തിക്കുവിൻ; മനുഷ്യർക്കുവേണ്ടിയല്ല, കർത്താവിനുവേണ്ടി[c] ചെയ്യുന്നതുപോലെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ആത്മാവിൽനിന്ന്’; ‘ഹൃദയപൂർവം’ അല്ലെങ്കിൽ ‘മുഴുമനസ്സോടെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: ഈ ഗൃഹബന്ധസന്ദർഭത്തിൽ ‘കർത്താവ്’ എന്നതിന് ‘യജമാനൻ’ എന്ന അർഥനിറവും ഉണ്ടായേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: നിങ്ങൾ എന്തു ചെയ്താലും
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമവും ἐάν-ഉം ചേർന്ന് പൊതുവായ അനിശ്ചിതത്വം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ‘എന്തു ചെയ്താലും’ എന്ന് നൽകുന്നു.
- source_word: ἐκ ψυχῆς
  choice: പൂർണമനസ്സോടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘ആത്മാവിൽനിന്ന്/പ്രാണനിൽനിന്ന്’ എന്നാണെങ്കിലും, ഇവിടെ ആന്തരികമായ ആത്മാർഥതയും മുഴുവൻ വ്യക്തിത്വത്തോടെയുള്ള സമർപ്പണവുമാണ് ഉദ്ദേശ്യം. ‘പൂർണമനസ്സോടെ’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐργάζεσθε
  choice: പ്രവർത്തിക്കുവിൻ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തുടർച്ചയായും ആത്മാർഥമായും പ്രവർത്തിക്കാനുള്ള പ്രബോധനമാണ്; ‘പ്രവർത്തിക്കുവിൻ’ സന്ദർഭത്തിന് യോജിച്ച വിശാലമായ പദമാണ്.
- source_word: ὡς τῷ κυρίῳ
  choice: കർത്താവിനുവേണ്ടി ചെയ്യുന്നതുപോലെ
  rationale: ὡς പ്രവർത്തനത്തിന്റെ കാഴ്ചപ്പാടും രീതിയും സൂചിപ്പിക്കുന്നു. ദാതിവ് മലയാളത്തിൽ ‘വേണ്ടി’ എന്നു സ്വാഭാവികമായി വരുന്നു; ഗൃഹബന്ധസന്ദർഭത്തിലും κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ അഭിസംബോധന ‘കർത്താവ്’ ആയി നിലനിർത്തുന്നു.
- source_word: καὶ οὐκ ἀνθρώποις
  choice: മനുഷ്യർക്കുവേണ്ടിയല്ല
  rationale: ἀνθρώποις ഇവിടെ ലിംഗഭേദമില്ലാതെ മനുഷ്യരെ കർത്താവിനോട് വിപരീതമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ആധുനിക മലയാളത്തിലെ പൊതുവായ ‘മനുഷ്യർ’ കൃത്യമാണ്. καί ഈ വിരോധഘടനയിൽ ഊന്നൽ നൽകുന്നതിനാൽ പ്രത്യേകമായി ‘ഉം’ ചേർക്കാതെ മലയാളത്തിലെ ‘അല്ല’ ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ഗൃഹബന്ധ നിർദേശങ്ങളുടെ പശ്ചാത്തലത്തിൽ κύριος എന്നതിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭം അടിമകളെയും ഭൗമിക യജമാനന്മാരെയും സംബന്ധിക്കുന്നതാണെങ്കിലും, ഇവിടെ മനുഷ്യരോടുള്ള വ്യക്തമായ വിരോധം κύριος ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി ശക്തമായി കാണിക്കുന്നു. എന്നിരുന്നാലും ഗൃഹബന്ധസന്ദർഭം ‘യജമാനൻ’ എന്ന അർഥനിറവും കേൾപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ പ്രമാണമലയാളം. ‘പൂർണമനസ്സോടെ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗ്രീക്കിലെ ἐκ ψυχῆς എന്ന ആന്തരിക-സമഗ്ര പ്രവർത്തനഭാവം കൈമാറുന്നു. വാക്യക്രമം മലയാളത്തിലെ ഊന്നലിനും സ്വാഭാവികതയ്ക്കുമായി ക്രമീകരിച്ചിരിക്കുന്നു; ഏക അടിക്കുറിപ്പ് ചിഹ്നം [a] മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
