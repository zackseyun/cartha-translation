id: COL.3.9
reference: Colossians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: ml
  text: പരസ്പരം കള്ളം പറയരുത്; കാരണം, പഴയ മനുഷ്യനെ[b] അവന്റെ പ്രവൃത്തികളോടുകൂടെ നിങ്ങൾ ഉരിഞ്ഞുമാറ്റിയിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഉരിഞ്ഞുമാറ്റിയവരായി’ അല്ലെങ്കിൽ ‘ഉരിഞ്ഞുമാറ്റിയശേഷം.’ ഗ്രീക്കിലെ പങ്കാളിക്രിയയെ കൂടുതൽ രൂപാനുസൃതമായി ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് കല്പനയുടെ കാരണം നൽകുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പഴയ സ്വത്വത്തെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പഴയ മനുഷ്യനെ’; അടുത്ത വാക്യത്തിലെ ‘പുതിയ മനുഷ്യൻ’ എന്നതുമായുള്ള പൗലോസിന്റെ വിരുദ്ധരൂപം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: കള്ളം പറയരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാരൂപം ഇവിടെ സ്വാഭാവികമായ ഒരു നിരോധനമാണ്. സന്ദർഭം തുടരുന്ന പ്രവൃത്തി നിർത്തണമെന്ന് പ്രത്യേകം ഊന്നുന്നില്ലാത്തതിനാൽ ‘കള്ളം പറയുന്നത് നിർത്തുക’ എന്നതിനെക്കാൾ ഇത് നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: εἰς ἀλλήλους
  choice: പരസ്പരം
  rationale: അന്യോന്യബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἀπεκδυσάμενοι
  choice: ഉരിഞ്ഞുമാറ്റിയിരിക്കുന്നു
  rationale: വസ്ത്രം അഴിച്ചുമാറ്റുന്ന രൂപകം നിലനിർത്തുകയും പ്രവൃത്തി പൂർത്തിയായെന്ന ഭാവം അറിയിക്കുകയും ചെയ്യുന്നു. ‘കാരണം’ എന്ന ബന്ധപദം പങ്കാളിക്രിയയുടെ സാധ്യതയേറിയ കാരണാർഥം വ്യക്തമാക്കുന്നു; മറ്റു വ്യാകരണസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: പഴയ മനുഷ്യനെ
  rationale: അടുത്ത വാക്യത്തിലെ ‘പുതിയ മനുഷ്യൻ’ എന്ന വിരുദ്ധരൂപവുമായി ഉള്ള പൗലോസിന്റെ ബന്ധം സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘പഴയ സ്വത്വം’ പ്രധാനപാഠത്തിൽ സ്വീകരിക്കുന്നില്ല.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: അവന്റെ പ്രവൃത്തികളോടുകൂടെ
  rationale: σύν എന്നതിന്റെ സഹവർത്തിത്വവും αὐτοῦ എന്ന പുല്ലിംഗ ഏകവചന സൂചനയും നിലനിർത്തുന്നു. πράξεις എന്നത് ധാർമ്മിക പെരുമാറ്റത്തിന്റെ പ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον എന്നതിന്റെ മാനവശാസ്ത്രപരമായ രൂപകം
  choice: പഴയ മനുഷ്യൻ
  alternative: പഴയ സ്വത്വം
  rationale: ‘പഴയ മനുഷ്യൻ/പുതിയ മനുഷ്യൻ’ എന്ന ഉറവിടപാഠത്തിലെ വിരുദ്ധജോടിയും അതിലെ പ്രതിനിധി-മാനവിക സൂചനയും നിലനിർത്തുന്നു; ‘പഴയ സ്വത്വം’ വായനാസൗകര്യമുള്ളതെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- issue: ἀπεκδυσάμενοι എന്ന പങ്കാളിക്രിയയുടെ മുഖ്യവാക്യത്തോടുള്ള ബന്ധം
  choice: 'കാരണാർഥം: ‘കാരണം ... ഉരിഞ്ഞുമാറ്റിയിരിക്കുന്നു’'
  alternative: രീതിയെയോ അനുബന്ധസാഹചര്യത്തെയോ സൂചിപ്പിച്ച് ‘ഉരിഞ്ഞുമാറ്റിയവരായി’; കാലാർഥത്തിൽ ‘ഉരിഞ്ഞുമാറ്റിയശേഷം’
  rationale: സമീപസന്ദർഭത്തിൽ വിശ്വാസികളുടെ മാറിയ നിലയാണ് നിരോധനത്തിന് അടിസ്ഥാനമാകുന്നത് എന്ന വായന സാധ്യതയേറിയതാണ്. എങ്കിലും ഗ്രീക്ക് പങ്കാളിക്രിയ കാരണാർഥം മാത്രം നിർബന്ധിക്കുന്നില്ലാത്തതിനാൽ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉരിഞ്ഞുമാറ്റുക’ എന്നത് വസ്ത്രരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു. ഉറവിടത്തിലെ കല്പന ആദ്യം വരുന്ന ക്രമവും അർദ്ധവിരാമം ഉപയോഗിച്ച് തുടർന്നുള്ള കാരണവാക്യവുമായി അതിന്റെ ബന്ധവും സംരക്ഷിച്ചിട്ടുണ്ട്.
