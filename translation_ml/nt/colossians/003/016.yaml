id: COL.3.16
reference: Colossians 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: ml
  text: മശീഹയുടെ വചനം സമൃദ്ധമായി നിങ്ങളിൽ[a] വസിക്കട്ടെ; സകല ജ്ഞാനത്തോടെ സങ്കീർത്തനങ്ങളാലും സ്തുതിഗീതങ്ങളാലും ആത്മീയ ഗാനങ്ങളാലും പരസ്പരം പഠിപ്പിക്കുകയും തിരുത്തി ഉപദേശിക്കുകയും ചെയ്യുവിൻ; നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ദൈവത്തോടു കൃപയോടെ[b] പാടുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഇടയിൽ.” “നിങ്ങളിൽ” എന്ന ഗ്രീക്ക് ബഹുവചനം മശീഹയുടെ വചനം സമൂഹത്തിനകത്ത് വസിക്കുന്നതിനെയും ഓരോരുത്തരുടെയും ഉള്ളിൽ വസിക്കുന്നതിനെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “നന്ദിയോടെ.” ഗ്രീക്കിലെ ἐν χάριτι എന്ന പ്രയോഗം കൃപയോടെ, കൃപാഭാവത്തോടെ, അല്ലെങ്കിൽ കൃതജ്ഞതയോടെ എന്നർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: മശീഹയുടെ വചനം
  rationale: λόγος എന്നതിന്റെ വിശാലമായ അർത്ഥപരിധി ‘വചനം’ നിലനിർത്തുന്നു. Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; സമാസബന്ധത്തിന്റെ ഉറവിടം/വിഷയം എന്ന തുറന്ന സ്വഭാവം ‘യുടെ’ നിലനിർത്തുന്നു.
- source_word: ἐνοικείτω ἐν ὑμῖν πλουσίως
  choice: സമൃദ്ധമായി നിങ്ങളിൽ വസിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയും ‘വസിക്കുക’ എന്ന അന്തർവാസരൂപകവും നിലനിർത്തുന്നു. ബഹുവചനമായ ‘നിങ്ങളിൽ’ വ്യക്തികളെയും സമൂഹത്തെയും സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിന്റെ തുറന്ന അർത്ഥം കാക്കുന്നു.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: സകല ജ്ഞാനത്തോടുംകൂടെ
  rationale: ഈ വാക്യഘടകം വചനം വസിക്കുന്നതിനോടോ തുടർന്നുള്ള പഠിപ്പിക്കൽ-ബുദ്ധിയുപദേശത്തോടോ ബന്ധിപ്പിക്കാവുന്നതിനാൽ, അതിനെ അതിയായി നിർണ്ണയിക്കാത്ത സ്വാഭാവിക പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: പരസ്പരം പഠിപ്പിക്കുകയും ബുദ്ധിയുപദേശിക്കുകയും ചെയ്യുവിൻ
  rationale: ബഹുവചനസന്ദർഭത്തിലെ ἑαυτούς-ന്റെ പരസ്പരപ്രവർത്തനാർഥം ‘പരസ്പരം’ വ്യക്തമാക്കുന്നു. νουθετέωയിലെ തിരുത്തലും മുന്നറിയിപ്പും ഉൾപ്പെടുന്ന ഉപദേശാർഥം ‘ബുദ്ധിയുപദേശിക്കുക’ നിലനിർത്തുന്നു.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: സങ്കീർത്തനങ്ങളാലും സ്തുതിഗീതങ്ങളാലും ആത്മീയ ഗാനങ്ങളാലും
  rationale: മൂന്നു സംഗീതപദങ്ങളുടെയും വ്യത്യാസം സൂക്ഷിക്കുകയും ദാതൃവിഭക്തിയുടെ ഉപാധ്യർഥം ‘-ആലും’ വഴി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν χάριτι
  choice: കൃപയോടെ
  rationale: χάρις-ന്റെ കൃപ/കൃതജ്ഞത എന്ന അർത്ഥവ്യാപ്തിയിൽ ലെക്സിക്കൽ രൂപത്തോട് അടുത്ത ‘കൃപയോടെ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘നന്ദിയോടെ’ എന്ന സന്ദർഭോചിത സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ദൈവത്തോടു
  rationale: ആന്തരിക ഹൃദയഭാവവും പാട്ടിന്റെ അഭിമുഖനായ ദൈവവും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായി ഗ്രഹിക്കാവുന്നതിനാൽ അതിന്റെ അഭിഷിക്തൻ എന്ന മശീഹീയ അർത്ഥം തുറന്നുകാട്ടുന്നു; ഒരു മതവിഭാഗത്തിന്റെ പ്രത്യേക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἐν ὑμῖν-ന്റെ സാമൂഹികവും വ്യക്തിപരവുമായ അർത്ഥം
  choice: നിങ്ങളിൽ
  alternative: നിങ്ങളുടെ ഇടയിൽ
  rationale: ഗ്രീക്ക് ബഹുവചനം സമൂഹത്തിനകത്തെയും ഓരോ വിശ്വാസിയുടെയും ഉള്ളിലെയും വാസത്തെ സൂചിപ്പിക്കാം. ‘നിങ്ങളിൽ’ മൂലരൂപത്തോട് അടുത്തുനിൽക്കുകയും ഈ ഇരട്ടസാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: ἐν χάριτι-യുടെ അർത്ഥം
  choice: കൃപയോടെ
  alternative: നന്ദിയോടെ
  rationale: χάρις ഇവിടെ കൃപ, കൃപാഭാവം, അല്ലെങ്കിൽ കൃതജ്ഞത സൂചിപ്പിക്കാം. മുഖ്യപാഠം ലെക്സിക്കൽ തുറന്നത്വം സൂക്ഷിക്കുന്നു; സാധുവായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദൈവത്തോടു പാടുന്നതിന്റെ സ്ഥാനം
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ദൈവത്തോടു പാടുവിൻ
  alternative: ഹൃദയപൂർവം ദൈവത്തോടു പാടുവിൻ
  rationale: ‘ഹൃദയങ്ങളിൽ’ എന്ന മൂലപാഠരൂപകം മാറ്റാതെ നിലനിർത്തി; അതിനെ വെറും ആത്മാർഥതയായി ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മശീഹ,’ ‘വചനം,’ ‘സങ്കീർത്തനം’ തുടങ്ങിയ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
