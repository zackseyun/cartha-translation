- from: മശീഹയുടെ വചനം സമൃദ്ധമായി നിങ്ങളിൽ വസിക്കട്ടെ; സകല ജ്ഞാനത്തോടുംകൂടെ സങ്കീർത്തനങ്ങളാലും സ്തുതിഗീതങ്ങളാലും ആത്മീയ ഗാനങ്ങളാലും പരസ്പരം പഠിപ്പിക്കുകയും ബുദ്ധിയുപദേശിക്കുകയും ചെയ്യുവിൻ; നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ദൈവത്തോടു കൃപയോടെ[a] പാടുവിൻ.[b]
  to: മശീഹയുടെ വചനം സമൃദ്ധമായി നിങ്ങളിൽ[a] വസിക്കട്ടെ; സകല ജ്ഞാനത്തോടെ സങ്കീർത്തനങ്ങളാലും സ്തുതിഗീതങ്ങളാലും ആത്മീയ ഗാനങ്ങളാലും പരസ്പരം പഠിപ്പിക്കുകയും തിരുത്തി ഉപദേശിക്കുകയും ചെയ്യുവിൻ; നിങ്ങളുടെ ഹൃദയങ്ങളിൽ ദൈവത്തോടു കൃപയോടെ[b] പാടുവിൻ.
