id: COL.3.5
reference: Colossians 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: ml
  text: അതുകൊണ്ട്, ഭൂമിയിലുള്ള അവയവങ്ങളെ[a]—ലൈംഗിക അധാർമികത, അശുദ്ധി, ദുഷ്‌വികാരം, ദുഷ്ടമായ ആഗ്രഹം, വിഗ്രഹാരാധനയായ അത്യാഗ്രഹം[b]—കൊന്നുകളയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിങ്ങളിലുള്ള ഭൗമികമായതെല്ലാം.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘ഭൂമിയിലുള്ള അവയവങ്ങൾ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘പരദ്രവ്യമോഹം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: കൊന്നുകളയുക
  rationale: നിർണായകമായ പ്രവൃത്തി ആവശ്യപ്പെടുന്ന aorist imperative-ന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലുള്ള അവയവങ്ങൾ
  rationale: ‘അവയവങ്ങൾ’ എന്ന ശരീരരൂപകം നിലനിർത്തുകയും ‘ഭൂമിയിലുള്ള’ എന്ന സ്ഥലപരമായ പ്രയോഗം അമൂർത്തമായ വ്യാഖ്യാനമായി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πορνείαν
  choice: ലൈംഗിക അധാർമികത
  rationale: πορνείαയുടെ വിശാലമായ ലൈംഗിക-നൈതിക അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀκαθαρσίαν
  choice: അശുദ്ധി
  rationale: ധാർമിക അശുദ്ധിയെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും വിശാലവുമായ തുല്യപദം.
- source_word: πάθος
  choice: ദുഷ്‌വികാരം
  rationale: ദോഷപ്പട്ടികയിലെ നിഷേധാത്മകമായ, ക്രമരഹിതമായ ശക്തവികാരത്തെ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ‘ദുഷ്ടമായ ആഗ്രഹം’ എന്നതിൽനിന്നും വേർതിരിക്കുന്നു.
- source_word: ἐπιθυμίαν κακήν
  choice: ദുഷ്ടമായ ആഗ്രഹം
  rationale: κακήν നൽകുന്ന വ്യക്തമായ ധാർമിക വിശേഷണം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: πλεονεξίαν
  choice: അത്യാഗ്രഹം
  rationale: കൂടുതൽ സ്വന്തമാക്കാനുള്ള പിടിച്ചുപറ്റുന്ന മോഹത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: ഈ അത്യാഗ്രഹം വിഗ്രഹാരാധനയാണ്
  rationale: സമീപസ്ഥമായ ഏകവചന നാമമായ ‘അത്യാഗ്രഹം’ തന്നെയാണ് ബന്ധവാക്യത്തിന്റെ സൂചിതപദമെന്ന് വ്യക്തമാക്കിക്കൊണ്ട് പൗലോസിന്റെ ശക്തമായ സമീകരണം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വിഗ്രഹാരാധനയാണ്’ എന്നതിന്റെ സൂചിതപദം
  choice: ബന്ധവാക്യം പ്രത്യേകമായി ‘അത്യാഗ്രഹം’ എന്നതിനെ സൂചിപ്പിക്കുന്നു.
  alternative: മുൻപുള്ള ദോഷപ്പട്ടിക മുഴുവനെയും വിഗ്രഹാരാധനയായി സംഗ്രഹിക്കുന്നു.
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ἥτις, ഏറ്റവും അടുത്ത സ്ത്രീലിംഗ ഏകവചന നാമമായ πλεονεξίαν-നോടാണ് സ്വാഭാവികമായി യോജിക്കുന്നത്.
- issue: ‘ഭൂമിയിലുള്ള അവയവങ്ങൾ’ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: പ്രധാനപാഠത്തിൽ ശരീരാവയവങ്ങളുടെ രൂപകം നിലനിർത്തുന്നു.
  alternative: ‘നിങ്ങളിലുള്ള ഭൗമികമായതെല്ലാം’ അല്ലെങ്കിൽ ‘ഭൗമിക സ്വഭാവം’ എന്ന് അമൂർത്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലഗ്രീക്കിലെ μέλη എന്ന പദം നിലനിർത്തുന്നത് വ്യാഖ്യാനപരമായ അധികനിർണ്ണയം ഒഴിവാക്കുന്നു; തുടർന്നുള്ള ദോഷങ്ങൾ ഈ അവയവങ്ങളുടെ വിശദീകരണമായി വായിക്കാം.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ‘ഭൂമിയിലുള്ള അവയവങ്ങൾ’ എന്ന അസാധാരണമായെങ്കിലും ഉദ്ദേശപൂർവമായ രൂപകം മൂലപാഠത്തിന്റെ ദൃശ്യഭാഷ സംരക്ഷിക്കാൻ നിലനിർത്തി; അതിന്റെ വ്യാഖ്യാനപരമായ പകരം അടിക്കുറിപ്പിൽ നൽകി.
