- from: 'അതുകൊണ്ട്, ഭൂമിയിലുള്ള അവയവങ്ങളെ[a] കൊന്നുകളയുക: ലൈംഗിക അധാർമികത, അശുദ്ധി, ദുഷ്‌വികാരം, ദുഷ്ടമായ ആഗ്രഹം, അത്യാഗ്രഹം[b] എന്നിവയെ. ഈ അത്യാഗ്രഹം വിഗ്രഹാരാധനയാണ്.'
