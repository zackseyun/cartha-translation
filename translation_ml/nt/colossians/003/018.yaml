reference: Colossians 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: ml
  text: ഭാര്യമാരേ, കർത്താവിൽ ഉചിതമായതുപോലെ നിങ്ങളുടെ ഭർത്താക്കന്മാർക്കു വിധേയരാകുവിൻ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നിങ്ങളുടെ ഭർത്താക്കന്മാർക്കു കീഴ്പെട്ടിരിക്കുവിൻ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: ‘കർത്താവിൽ ഉചിതമായിരുന്നതുപോലെ’; ഗ്രീക്ക് ക്രിയ രൂപത്തിൽ ഭൂതകാലമാണെങ്കിലും ഈ സന്ദർഭത്തിൽ പൊതുവായ വർത്തമാന അർഥം നൽകുന്നതായിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: ഭാര്യമാരേ
  rationale: ഗാർഹികബന്ധങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിലും ἀνδράσιν എന്ന പദത്തോടുള്ള ജോടിയിലും γυνή പൊതുവായി ‘സ്ത്രീകൾ’ എന്നല്ല, വിവാഹിതരായ സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὑποτάσσεσθε
  choice: കീഴടങ്ങുവിൻ
  rationale: വർത്തമാനകാല മധ്യമ/കർമണി ആജ്ഞാരൂപം ബന്ധത്തിനുള്ളിൽ സ്വയം കീഴിൽ ക്രമപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘കീഴടങ്ങുവിൻ’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപമാണ്; ബലമായി കീഴ്പ്പെടുത്തപ്പെടുക എന്ന അർഥം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: ἀνδράσιν
  choice: നിങ്ങളുടെ ഭർത്താക്കന്മാർക്കു
  rationale: γυναῖκες എന്നതോടൊപ്പം വരുന്ന ഗാർഹികസന്ദർഭത്തിൽ ἀνήρ ‘പുരുഷന്മാർ’ എന്നതിലുപരി ‘ഭർത്താക്കന്മാർ’ എന്നാണ്. ബന്ധസൂചന സ്വാഭാവികമാക്കാൻ ‘നിങ്ങളുടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: ὡς
  choice: പോലെ
  rationale: ഇവിടെ ὡς കാരണം സൂചിപ്പിക്കുന്നതല്ല; പ്രവൃത്തിയുടെ യോജ്യതയുടെ മാനദണ്ഡമോ രീതിയോ അവതരിപ്പിക്കുന്നു.
- source_word: ἀνῆκεν
  choice: ഉചിതമായത്
  rationale: രൂപപരമായി ഭൂതകാല അപൂർണരൂപമാണെങ്കിലും ഈ പ്രബോധനവാക്യത്തിൽ പൊതുവായ വർത്തമാന അർഥം വഹിക്കുന്നു. ‘ഉചിതമായത്’ നൈതിക യോജ്യതയെ അമിതവ്യാഖ്യാനം കൂടാതെ അറിയിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തമായ ദൈവശാസ്ത്രപരമായ പരിധി നേരിട്ട് നിലനിർത്തുന്നു; κύριος എന്നതിന് പദ്ധതിയുടെ സ്വാഭാവിക മലയാളരൂപം ‘കർത്താവ്’ ആണ്.
theological_decisions:
- issue: ആഹ്വാനത്തിന്റെ പരിധിയും അടിസ്ഥാനവും
  choice: ‘കർത്താവിൽ ഉചിതമായതുപോലെ’ എന്ന് പരിഭാഷപ്പെടുത്തി, ആഹ്വാനത്തിന്റെ യോജ്യത കർത്താവുമായുള്ള ബന്ധത്തിൽ നിർണയിക്കപ്പെടുന്നതായി നിലനിർത്തുന്നു.
  alternative: ഇത് ദൈവശാസ്ത്രപരമായ യാതൊരു പരിധിയുമില്ലാത്ത പൊതുസാമൂഹിക നിയമമായി അവതരിപ്പിക്കുക; അല്ലെങ്കിൽ ‘കർത്താവിൽ’ എന്നത് ഭാര്യമാരെ മാത്രം വിശേഷിപ്പിക്കുന്നതുപോലെ വായിക്കുക.
  rationale: ഗ്രീക്കിൽ ἐν κυρίῳ യോജ്യതയെക്കുറിച്ചുള്ള ἀνῆκεν എന്ന പ്രസ്താവനയോടാണ് സ്വാഭാവികമായി ചേർന്നുനിൽക്കുന്നത്. വാക്യം പറയുന്നതിലധികം വിശദീകരിക്കാതെയും അതിന്റെ ദൈവശാസ്ത്രപരമായ യോഗ്യത മായ്ച്ചുകളയാതെയും പരിഭാഷ അത് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി. ‘ഭാര്യമാരേ’ എന്ന സംബോധനയും ‘കീഴടങ്ങുവിൻ’ എന്ന ബഹുമാനപൂർവമായ ബഹുവചന ആജ്ഞാരൂപവും ഉപയോഗിച്ചു. പദക്രമം സ്വാഭാവിക മലയാളത്തിന് അനുസരിച്ചെങ്കിലും ‘കർത്താവിൽ’ എന്ന നിർണായക യോഗ്യത പ്രവൃത്തിയുടെ ഉചിതത്വത്തോടു ചേർന്ന് നിൽക്കുന്നു.
