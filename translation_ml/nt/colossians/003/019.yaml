  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: ml
  text: ഭർത്താക്കന്മാരേ, നിങ്ങളുടെ ഭാര്യമാരെ സ്നേഹിക്കുവിൻ; അവരോടു കയ്പ് പുലർത്തരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരോടു പരുഷമായി പെരുമാറരുത്.” ഗ്രീക്ക് ക്രിയയ്ക്ക് കയ്പോ വെറുപ്പോ പുലർത്തുക എന്ന അർഥമുണ്ട്; ഇവിടെ അത് അത്തരം മനോഭാവത്തിൽനിന്നുള്ള പരുഷമായ പെരുമാറ്റത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: ഭർത്താക്കന്മാരേ
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം; എന്നാൽ ഗൃഹബന്ധങ്ങളെക്കുറിച്ചുള്ള ഈ സന്ദർഭവും ‘ഭാര്യമാർ’ എന്ന അനുബന്ധപദവും ഇവിടെ ഭർത്താക്കന്മാരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἀγαπᾶτε
  choice: സ്നേഹിക്കുവിൻ
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തർജമ; ബഹുവചന ആജ്ഞയുടെ ബലവും നിലനിർത്തുന്നു.
- source_word: τὰς γυναῖκας
  choice: നിങ്ങളുടെ ഭാര്യമാരെ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ അല്ലെങ്കിൽ ‘ഭാര്യ’ എന്നർഥമുണ്ട്. പരസ്പര വിവാഹബന്ധത്തെ അഭിസംബോധന ചെയ്യുന്ന സന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ എന്നതാണ് ഉചിതം; മലയാളത്തിലെ സ്വാഭാവിക വ്യക്തതയ്ക്കായി ‘നിങ്ങളുടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: μὴ πικραίνεσθε
  choice: കയ്പുള്ളവരാകരുത്
  rationale: πικραίνω എന്ന ക്രിയയുടെ ‘കയ്പാകുക/കയ്പുള്ളവനാകുക’ എന്ന രൂപകം നിലനിർത്തുന്നു. ഇതിൽ ഉള്ളിൽ വിദ്വേഷം വളരുന്നതും അതിൽനിന്നുള്ള പരുഷമായ പെരുമാറ്റവും ഉൾപ്പെടാം; അതിനാൽ ഒരു അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ മൂലത്തിലെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: πρὸς αὐτάς
  choice: അവരോടു
  rationale: πρός ഇവിടെ മനോഭാവത്തിന്റെയോ പെരുമാറ്റത്തിന്റെയോ ദിശ സൂചിപ്പിക്കുന്നു; ‘അവരോടു’ എന്നത് മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ഗൃഹബന്ധ നിർദേശത്തിലെ ലിംഗ-വിവാഹ അഭിസംബോധന
  choice: ‘ഭർത്താക്കന്മാരേ’, ‘ഭാര്യമാരെ’ എന്ന ലിംഗ-വിവാഹബന്ധപരമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘പുരുഷന്മാരേ’, ‘സ്ത്രീകളെ’ എന്ന പൊതുവായ പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പദങ്ങൾക്ക് പൊതുവായ അർഥങ്ങൾ സാധ്യമാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ അഭിസംബോധന വിവാഹബന്ധത്തിനുള്ളിലാണ്. അതിനാൽ പൊതുവായ പുരുഷ-സ്ത്രീ അഭിസംബോധനയായി മാറ്റുന്നത് മൂലവാക്യത്തിന്റെ ബന്ധപരമായ കൃത്യത നഷ്ടപ്പെടുത്തും.
- issue: πικραίνεσθε എന്നതിലെ ആന്തരിക കയ്പും ബാഹ്യ പരുഷതയും
  choice: പ്രധാനവാചകത്തിൽ ‘കയ്പുള്ളവരാകരുത്’ എന്നു നൽകി രൂപകവും അർഥവ്യാപ്തിയും നിലനിർത്തി.
  alternative: ‘അവരോടു പരുഷമായി പെരുമാറരുത്’ എന്നു മാത്രം നൽകുക.
  rationale: സന്ദർഭത്തിൽ പരുഷമായ പെരുമാറ്റം ഉൾപ്പെടുന്നുണ്ടെങ്കിലും, ക്രിയയ്ക്ക് കയ്പോ വിദ്വേഷമോ ഉള്ളിൽ വളരുക എന്ന അർഥവും ഉണ്ടാകാം. പ്രധാനവാചകത്തിൽ അത് തുറന്നുവെച്ച് അടിക്കുറിപ്പിൽ ബന്ധപരമായ ഫലം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സ്നേഹിക്കുവിൻ’, ‘ആകരുത്’ എന്നീ രൂപങ്ങൾ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നൽകുമ്പോഴും അത്യന്തം പുരാതനമായ ശൈലി ഒഴിവാക്കുന്നു. പ്രധാനവാചകത്തിൽ ഗ്രീക്കിലെ ‘കയ്പ്’ രൂപകം സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ സ്വാഭാവിക ബന്ധപരമായ അർഥം വ്യക്തമാക്കുകയും ചെയ്തു.
