id: COL.3.13
reference: Colossians 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: ml
  text: പരസ്പരം സഹിക്കുകയും, ഒരാൾക്ക് മറ്റൊരാളോട് എന്തെങ്കിലും പരാതിയുണ്ടെങ്കിൽ[a] പരസ്പരം ക്ഷമിക്കുകയും ചെയ്യുക. കർത്താവ് നിങ്ങളോടു ക്ഷമിച്ചതുപോലെ നിങ്ങളും അങ്ങനെതന്നെ ചെയ്യുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാൾക്ക് മറ്റൊരാളോട് എന്തെങ്കിലും ആക്ഷേപമുണ്ടെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അവസാന ഉപവാക്യത്തിലെ ക്രിയ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടതാണ്; അതിനെ ഇവിടെ ‘ചെയ്യുക’ എന്നു പൂരിപ്പിച്ചിരിക്കുന്നു. ‘നിങ്ങളും ക്ഷമിക്കുക’ എന്നും വ്യക്തമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: സഹിക്കുകയും
  rationale: വർത്തമാനകാല പങ്കാളിത്തക്രിയയുടെ തുടർച്ചയായ പരസ്പര സഹനഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘പൊറുക്കുക’ എന്നത് ക്ഷമയുമായി കലരാൻ സാധ്യതയുള്ളതിനാൽ ഒഴിവാക്കി.
- source_word: ἀλλήλων
  choice: പരസ്പരം
  rationale: സമൂഹത്തിനുള്ളിലെ അന്യോന്യപ്രവർത്തനം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: χαριζόμενοι
  choice: ക്ഷമിക്കുകയും
  rationale: ഈ സാഹചര്യത്തിൽ കുറ്റം വിട്ടുകൊടുക്കുക എന്ന അർഥമാണ് പ്രധാനമായത്; χάρις-ബന്ധമുള്ള കൃപാഭാവം നിലനിൽക്കുന്നുവെങ്കിലും ‘കൃപയോടെ ക്ഷമിക്കുക’ എന്ന് വിപുലീകരിക്കുന്നത് മൂലത്തിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കും.
- source_word: ἑαυτοῖς
  choice: പരസ്പരം
  rationale: രൂപത്തിൽ പ്രത്യയാത്മകമായിരുന്നാലും ഇവിടെ സമൂഹത്തിനുള്ളിലെ അന്യോന്യപ്രവർത്തനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: ഒരാൾക്ക് മറ്റൊരാളോട് എന്തെങ്കിലും പരാതിയുണ്ടെങ്കിൽ
  rationale: വ്യവസ്ഥയുടെ പൊതുവായ അനിശ്ചിത സ്വഭാവവും വ്യക്തികൾക്കിടയിലെ പരാതിയുടെ ആശയവും സാധാരണ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μομφήν
  choice: പരാതി
  rationale: കുറ്റപ്പെടുത്താനോ ആക്ഷേപിക്കാനോ ഉള്ള കാരണം സൂചിപ്പിക്കുന്ന, അതിരുകടന്ന നിയമപരമായ ഭാവമില്ലാത്ത സ്വാഭാവിക പദം.
- source_word: καθὼς καὶ
  choice: …പോലെ
  rationale: വിശ്വാസികളുടെ ക്ഷമയെ കർത്താവിന്റെ മുൻകൈയിലുള്ള ക്ഷമയോടു താരതമ്യം ചെയ്യുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ബഹുമാനപദവിക്കുള്ള പതിവും ഗൗരവമുള്ളതുമായ മലയാള സമാനപദം; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വിവർത്തനത്തിൽ അതിലധികം വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐχαρίσατο
  choice: ക്ഷമിച്ചു
  rationale: മുൻപത്തെ χαριζόμενοι എന്ന ക്രിയയോടുള്ള അർഥബന്ധം നിലനിർത്തി, പൂർത്തിയായ മുൻകാല പ്രവൃത്തിയെ നേരിട്ട് അറിയിക്കുന്നു.
- source_word: οὕτως καὶ ὑμεῖς
  choice: നിങ്ങളും അങ്ങനെതന്നെ ചെയ്യുക
  rationale: ഗ്രീക്കിൽ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ട ക്രിയ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ചെയ്യുക’ എന്നു പൂരിപ്പിക്കുന്നു; ‘ക്ഷമിക്കുക’ എന്ന് ആവർത്തിക്കുന്നതിനെക്കാൾ മൂലത്തിലെ സംക്ഷിപ്തത ഇതിൽ കൂടുതൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ὁ κύριος ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘കർത്താവ്’ എന്ന പദവി അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സ്വാഭാവികമായി ക്രിസ്തുവിനെ സൂചിപ്പിക്കാം.
  alternative: ‘ക്രിസ്തു’ എന്നോ ‘ദൈവം’ എന്നോ വ്യക്തമായി ചേർക്കുക.
  rationale: കൊലൊസ്സ്യരിലെ പൗലോസിന്റെ പ്രയോഗവും സമീപസന്ദർഭവും ക്രിസ്തുവിലേക്കാണ് കൂടുതൽ വിരൽചൂണ്ടുന്നത്; എങ്കിലും ഗ്രീക്ക് വ്യക്തിനാമം നൽകാത്തതിനാൽ വിവർത്തനം അവ്യക്തത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- issue: അവസാന ഉപവാക്യത്തിലെ ലോപം
  choice: സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ട പ്രവൃത്തിയെ ‘അങ്ങനെതന്നെ ചെയ്യുക’ എന്നു സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
  alternative: ‘നിങ്ങളും അങ്ങനെതന്നെ’ എന്ന് ലോപം പൂർണമായി നിലനിർത്തുക, അല്ലെങ്കിൽ ‘നിങ്ങളും ക്ഷമിക്കുക’ എന്ന് ക്രിയ വ്യക്തമാക്കുക.
  rationale: മൂലഗ്രീക്ക് അവസാനത്തിൽ ക്രിയ ആവർത്തിക്കുന്നില്ല. മലയാളത്തിൽ പൂർണ ലോപം അസ്വാഭാവികമാകാമെന്നതിനാൽ ‘ചെയ്യുക’ ചേർക്കുന്നു; എന്നാൽ ‘ക്ഷമിക്കുക’ എന്ന് തുറന്നുപറഞ്ഞ് മൂലത്തേക്കാൾ വ്യക്തത കൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ഉപദേശശൈലി. ‘പരസ്പരം’ എന്ന ആവർത്തനം മൂലത്തിലെ രണ്ട് അന്യോന്യ സർവനാമങ്ങളുടെ സമാന്തരത നിലനിർത്തുന്നു. വാക്യം ഒറ്റയ്ക്ക് വായിക്കുമ്പോഴും നിർദേശം വ്യക്തമായിരിക്കാനായി പങ്കാളിത്തക്രിയകൾ ‘…ചെയ്യുക’ എന്ന രൂപത്തിൽ അവതരിപ്പിച്ചു.
