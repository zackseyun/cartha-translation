id: COL.3.21
reference: Colossians 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: ml
  text: പിതാക്കന്മാരേ, നിങ്ങളുടെ മക്കളെ പ്രകോപിപ്പിക്കരുത്; അവർ നിരുത്സാഹപ്പെടാതിരിക്കാനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവർ ധൈര്യം നഷ്ടപ്പെടാതിരിക്കാനാണ്.’
    reason: ἀθυμέω എന്ന പദത്തിന് ‘നിരുത്സാഹപ്പെടുക’ എന്നതിനൊപ്പം ‘ധൈര്യം നഷ്ടപ്പെടുക’ എന്ന അർഥഭാവവും ഉണ്ട്.
lexical_decisions:
- source_word: οἱ πατέρες
  choice: പിതാക്കന്മാരേ
  rationale: ഗ്രീക്ക് നാമം പ്രത്യേകമായി പിതാക്കന്മാരെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; പൊതുവായ ‘മാതാപിതാക്കളേ’ എന്നതിലേക്കു വ്യാപിപ്പിക്കാതെ മൂലപാഠത്തിന്റെ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: μὴ ἐρεθίζετε
  choice: പ്രകോപിപ്പിക്കരുത്
  rationale: ἐρεθίζω ഇവിടെ ദോഷകരമായ പ്രതികരണം ഉളവാക്കുന്ന വിധത്തിൽ ചൊടിപ്പിക്കുക അഥവാ പ്രകോപിപ്പിക്കുക എന്ന നിഷേധാത്മക അർഥത്തിലാണ്; ഈ സജീവഭാവം ‘പ്രകോപിപ്പിക്കരുത്’ വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ τέκνα ὑμῶν
  choice: നിങ്ങളുടെ മക്കളെ
  rationale: τέκνα ആൺമക്കളെയും പെൺമക്കളെയും ഉൾക്കൊള്ളുന്ന സന്താനങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മക്കൾ’ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമാണ്.
- source_word: ἵνα μὴ
  choice: അവർ ... ആകാതിരിക്കേണ്ടതിനാണ്
  rationale: ἵνα μή ഉദ്ദേശ്യമോ പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലമോ നിഷേധരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀθυμῶσιν
  choice: നിരുത്സാഹരാകാതിരിക്കുക
  rationale: ἀθυμέω മനസ്സിടിയുക, ധൈര്യം നഷ്ടപ്പെടുക, നിരുത്സാഹപ്പെടുക എന്നിവ സൂചിപ്പിക്കുന്നു; ‘നിരുത്സാഹരാകുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: കുടുംബനിർദേശത്തിൽ πατέρες എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രത്യേകമായി പിതാക്കന്മാരോടുള്ള അഭിസംബോധന
  alternative: പൊതുവായി മാതാപിതാക്കളോടുള്ള അഭിസംബോധന
  rationale: ഗ്രീക്ക് പദം വ്യക്തമായി ‘പിതാക്കന്മാർ’ എന്നാണ്. പ്രയോഗം കൂടുതൽ വ്യാപകമാകാമെങ്കിലും വിവർത്തനം മൂലപാഠത്തിലെ പ്രത്യേക അഭിസംബോധന പൊതുവാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. കുടുംബബന്ധത്തിലെ നേരിട്ടുള്ള ആജ്ഞാഭാവവും ഫലസൂചക ഉപവാക്യവും നിലനിർത്തിയിരിക്കുന്നു.
