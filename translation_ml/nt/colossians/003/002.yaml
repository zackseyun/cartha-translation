  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: ml
  text: മുകളിലുള്ള കാര്യങ്ങളിൽ നിങ്ങളുടെ മനസ്സ് വയ്ക്കുവിൻ[a]; ഭൂമിയിലുള്ള കാര്യങ്ങളിലല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മുകളിലുള്ള കാര്യങ്ങളെക്കുറിച്ചു ചിന്തിക്കുവിൻ.’ ഗ്രീക്ക് ക്രിയ വെറും ചിന്തയെ മാത്രമല്ല, ഒരാളുടെ മനോഭാവവും ശ്രദ്ധയും താത്പര്യവും ഒരു കാര്യത്തിലേക്ക് തിരിക്കുന്നതിനെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഭൂമിയിലെ കാര്യങ്ങളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: ഉയരത്തിലുള്ള കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന ആർട്ടിക്കിളിനോടുകൂടിയ ἄνω ഇവിടെ നാമപദസമാനമായി പ്രവർത്തിച്ച് ‘ഉയരത്തിലുള്ള കാര്യങ്ങൾ’ എന്ന അർഥം നൽകുന്നു. ഇതിലൂടെ ബഹുവചനവും ഭൂമിയിലുള്ള കാര്യങ്ങളുമായുള്ള സ്ഥലപരമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: φρονεῖτε
  choice: നിങ്ങളുടെ മനസ്സ് ഉറപ്പിക്കുവിൻ
  rationale: φρονέω കേവലം ചിന്തിക്കുന്നതിലുപരി മനോഭാവവും ശ്രദ്ധയും താത്പര്യവും ഒരു ദിശയിലേക്കു തിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ മനോഭിമുഖതയും ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μὴ
  choice: അല്ല
  rationale: ആജ്ഞയുടെ രണ്ടാമത്തെ വിഷയത്തെ μὴ നിഷേധിച്ച് ആദ്യത്തേതിനോടു വൈരുധ്യത്തിൽ നിർത്തുന്നു. മലയാളത്തിൽ ‘കാര്യങ്ങളിലല്ല’ എന്ന സംക്ഷിപ്ത രൂപം ഈ നിഷേധം വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലുള്ള കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ നാമപദസമാനമായ ഘടനയും τὰ ἄνω എന്നതിനോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു; ‘ഭൗമിക കാര്യങ്ങൾ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വിശേഷണപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: γῆς
  choice: ഭൂമി
  rationale: ‘ഉയരത്തിലുള്ള’ എന്ന പ്രപഞ്ചപരമായ വൈരുധ്യത്തിൽ γῆ ഒരു പ്രത്യേക ദേശത്തെയല്ല, ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: φρονεῖτε എന്ന ആഹ്വാനത്തിന്റെ വ്യാപ്തി
  choice: ഉയരത്തിലുള്ള യാഥാർഥ്യങ്ങളിലേക്കു മനോഭാവവും മൂല്യബോധവും തുടർച്ചയായി തിരിക്കാനുള്ള ആഹ്വാനം
  alternative: സ്വർഗത്തെക്കുറിച്ച് ബൗദ്ധികമായി ചിന്തിക്കാനുള്ള പരിമിതമായ കല്പന
  rationale: φρονέω എന്ന ക്രിയയിൽ ചിന്തയ്ക്കൊപ്പം മനോഭാവം, സമീപനം, താത്പര്യം എന്നീ അർഥങ്ങളും ഉൾപ്പെടുന്നു. ‘മനസ്സ് ഉറപ്പിക്കുവിൻ’ ഈ വിശാലത നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘മനസ്സ് ഉറപ്പിക്കുവിൻ’ എന്നത് വെറും ബൗദ്ധിക ചിന്തയെക്കാൾ വിശാലമായ മനോഭിമുഖത അറിയിക്കുന്നു. പ്രധാനവാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ നൽകിയിരിക്കുന്നു.
