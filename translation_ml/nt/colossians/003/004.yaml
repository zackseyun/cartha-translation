source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: ml
  text: 'നിങ്ങളുടെ ജീവനായ[b] മശീഹാ[a] വെളിപ്പെടുമ്പോൾ[c], നിങ്ങളും അവനോടൊപ്പം മഹത്വത്തിൽ വെളിപ്പെടും.


    [a] “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദം “മശീഹാ” എന്ന പദവിയെ സൂചിപ്പിക്കുന്നു.


    [b] അക്ഷരാർഥത്തിൽ: “മശീഹാ, നിങ്ങളുടെ ജീവൻ.”


    [c] “പ്രത്യക്ഷനാകുമ്പോൾ” എന്നും, പിന്നീട് “അവനോടൊപ്പം മഹത്വത്തിൽ പ്രത്യക്ഷരാകും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ രണ്ടിടത്തും ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദം “മശീഹാ” എന്ന പദവിയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “മശീഹാ, നിങ്ങളുടെ ജീവൻ.”'
    reason: lexical_alternative
  - marker: c
    text: “പ്രത്യക്ഷനാകുമ്പോൾ” എന്നും, പിന്നീട് “അവനോടൊപ്പം മഹത്വത്തിൽ പ്രത്യക്ഷരാകും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ രണ്ടിടത്തും ഒരേ ധാതുവിൽനിന്നുള്ള ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: വെളിപ്പെടുമ്പോൾ
  rationale: ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവത്തിന്റെ സമയം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ ‘-ുമ്പോൾ’ രൂപം ഉപയോഗിച്ചു.
- source_word: ὁ Χριστὸς
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ പദവിയായതിനാൽ അതിന്റെ അർഥം നിലനിർത്തുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു; പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: വെളിപ്പെടുമ്പോൾ / വെളിപ്പെടും
  rationale: രണ്ടു ക്രിയകളിലുമുള്ള ഒരേ ധാതുവും വെളിവാകുക എന്ന ഭാവവും നിലനിർത്താൻ ഒരേ മലയാളക്രിയ ഉപയോഗിച്ചു.
- source_word: ἡ ζωὴ ὑμῶν
  choice: നിങ്ങളുടെ ജീവനായ
  rationale: ‘നിങ്ങളുടെ ജീവൻ’ എന്ന സമാനാധികരണപ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുമ്പോഴും മശീഹായാണ് വിശ്വാസികളുടെ ജീവൻ എന്ന ശക്തമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നു.
- source_word: τότε καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: കാലസംബന്ധം മുൻവാക്യത്തിലെ ‘വെളിപ്പെടുമ്പോൾ’ വ്യക്തമാക്കുന്നു; καὶയും ഊന്നിയ ὑμεῖςഉം ചേർന്ന ഉൾപ്പെടുത്തൽ ‘നിങ്ങളും’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: σὺν αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: അവനുമായുള്ള അടുത്ത പങ്കാളിത്തം ലളിതവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν δόξῃ
  choice: മഹത്ത്വത്തിൽ
  rationale: δόξαയുടെ ദൈവശാസ്ത്രപരമായ ഭാരവും ἐν എന്നതിന്റെ മണ്ഡലമോ നിലയോ സൂചിപ്പിക്കുന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός പദവിയായോ പേരുപോലെയോ പരിഭാഷപ്പെടുത്തുക
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ Χριστός ഇവിടെ പദവിയുടെ ശക്തി വഹിക്കുന്നു; അതിനാൽ അർഥം പരിഭാഷപ്പെടുത്തി, പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: മശീഹായും വിശ്വാസികളുടെ ജീവനും തമ്മിലുള്ള സമാനാധികരണബന്ധം
  choice: നിങ്ങളുടെ ജീവനായ മശീഹാ
  alternative: മശീഹാ, നിങ്ങളുടെ ജീവൻ
  rationale: മശീഹാ തന്നെയാണ് അവരുടെ ജീവൻ എന്ന വാക്യത്തിന്റെ ശക്തമായ പ്രസ്താവന വിശദീകരിച്ചോ മയപ്പെടുത്തിയോയില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- issue: മശീഹായുടെയും വിശ്വാസികളുടെയും വെളിപ്പെടലിലെ ക്രിയാസമാന്തര്യം
  choice: രണ്ടിടത്തും ‘വെളിപ്പെടുക’
  alternative: പ്രത്യക്ഷനാകുക / പ്രത്യക്ഷരാകുക
  rationale: ഗ്രീക്കിലെ ഒരേ ക്രിയാധാതുവിന്റെ ആവർത്തനം വിശ്വാസികൾ അവനോടൊപ്പം പങ്കിടുന്ന ഭാവി വെളിപ്പെടലിനെ ബന്ധിപ്പിക്കുന്നു; അതിനാൽ മലയാളത്തിലും ഒരേ പദം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മഹത്ത്വം’, ‘വെളിപ്പെടുക’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും ഉറവിടത്തിലെ ക്രിയാസമാന്തര്യവും നിലനിർത്തുന്നു; അനാവശ്യമായ സഭാവിഭാഗ-വിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
