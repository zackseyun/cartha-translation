id: COL.1.25
reference: Colossians 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: ml
  text: ദൈവത്തിന്റെ കാര്യവിചാരകത്വമനുസരിച്ച്, നിങ്ങൾക്കുവേണ്ടി എനിക്കു നൽകപ്പെട്ടതനുസരിച്ച്, ദൈവവചനം നിറവേറ്റുന്നതിനായി ആ സഭയുടെ ശുശ്രൂഷകനായി ഞാൻ തീർന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἧς
  choice: ആ സഭയുടെ
  rationale: സ്ത്രീലിംഗ ഏകവചന ഷഷ്ഠീവിഭക്തിയിലുള്ള ബന്ധസർവനാമം മുൻവാക്യത്തിലെ ἐκκλησία (‘സഭ’)യെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ആശയം വ്യക്തമായി ബന്ധിപ്പിക്കാൻ നാമം ആവർത്തിച്ചു.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: ശുശ്രൂഷകനായി ഞാൻ തീർന്നു
  rationale: ഒരു സേവനചുമതലയിലേക്കു വന്നതെന്ന അർത്ഥം നിലനിർത്തുന്നു; ‘ഡീക്കൻ’ എന്ന പിൽക്കാല സഭാപദവി അനാവശ്യമായി ആരോപിക്കുന്നില്ല.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കാര്യവിചാരകത്വമനുസരിച്ച്
  rationale: οἰκονομία ദൈവം ഏൽപ്പിച്ച ഉത്തരവാദിത്വപരമായ നടത്തിപ്പിനെയോ കാര്യവിചാരകത്വത്തെയോ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധത്തിന്റെ സാദ്ധ്യത തുറന്നുവെക്കുന്നു.
- source_word: τὴν δοθεῖσάν μοι εἰς ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി എനിക്കു നൽകപ്പെട്ട
  rationale: ചുമതല പൗലോസിനു നൽകപ്പെട്ടതും അതിന്റെ ലക്ഷ്യമോ ഗുണഭോക്താക്കളോ വായനക്കാരാണെന്നും പ്രകടമാക്കുന്നു.
- source_word: πληρῶσαι
  choice: നിറവേറ്റേണ്ടതിനാണ്
  rationale: πληρόω എന്ന ക്രിയയുടെ ‘പൂർണതയിലാക്കുക/നിറവേറ്റുക’ എന്ന വിശാലത നിലനിർത്തുന്നു; പൂർണമായി അറിയിക്കുക എന്ന വ്യാഖ്യാനത്തിലേക്ക് മുഖ്യപാഠത്തെ ചുരുക്കുന്നില്ല.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിൽനിന്നുള്ള പ്രഖ്യാപിത സന്ദേശം എന്ന അർത്ഥവും ബൈബിൾപരമായ പ്രതിധ്വനിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πληρῶσαι τὸν λόγον τοῦ θεοῦ എന്നതിന്റെ അർത്ഥം
  choice: ദൈവവചനം നിറവേറ്റുക
  alternative: ദൈവവചനം പൂർണമായി അറിയിക്കുക; ദൈവവചനം പൂർത്തിയാക്കുക
  rationale: സന്ദർഭത്തിൽ ദൈവവചനത്തെ പൂർണമായി പ്രഖ്യാപിക്കുക, അതിനെ പൂർണാവിഷ്കാരത്തിലാക്കുക, അല്ലെങ്കിൽ ഏൽപ്പിക്കപ്പെട്ട ദൗത്യം നിറവേറ്റുക എന്നീ ഭാവങ്ങൾ സാദ്ധ്യമാണ്. മുഖ്യപാഠം വിശാലമായ പ്രയോഗം നിലനിർത്തുകയും മറ്റു സാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- issue: τοῦ θεοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: ദൈവത്തിന്റെ കാര്യവിചാരകത്വം
  alternative: ദൈവത്തിൽനിന്ന് എനിക്കു നൽകപ്പെട്ട കാര്യവിചാരകത്വം
  rationale: ജനിറ്റീവ് ദൈവിക ഉടമസ്ഥതയെയോ ഉറവിടത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഗ്രീക്ക് ഘടനയോടു ചേർന്നുനിൽക്കുന്നു; നൽകിയത് ദൈവമാണെന്ന ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായുണ്ടെങ്കിലും അതിനെ വ്യാകരണപരമായി നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ‘കാര്യവിചാരകത്വം’ ഏൽപ്പിക്കപ്പെട്ട നടത്തിപ്പുചുമതലയുടെ രൂപകം സംരക്ഷിക്കുന്നു; വാക്യഭാരം കുറയ്ക്കാൻ ഗ്രീക്ക് ദീർഘവാക്യം രണ്ട് വാക്യങ്ങളാക്കി.
