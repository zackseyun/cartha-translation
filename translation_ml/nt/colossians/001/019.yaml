id: COL.1.19
reference: Colossians 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/019.yaml
  text: For in him all the fullness was pleased to dwell[c][b][a],
translation:
  language: ml
  text: എന്തെന്നാൽ[a], സകല പൂർണതയും[c] അവനിൽ വസിക്കാൻ പ്രസാദിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കാരണം, സകല പൂർണതയും അവനിൽ വസിക്കാൻ പ്രസാദിച്ചു.’ സന്ദർഭത്തിൽ ഈ സംയോജകപദം ഒന്നിലധികം വിശദീകരണരീതിയിൽ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: b
    text: 'പല പരിഭാഷകളും ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർത്താവിനെ തുറന്നുപറയുന്നു: ‘സകല പൂർണതയും അവനിൽ വസിക്കണമെന്നു ദൈവം പ്രസാദിച്ചു’ അല്ലെങ്കിൽ ‘പിതാവ് പ്രസാദിച്ചു.’'
    reason: alternative_reading
  - marker: c
    text: ‘സകല പൂർണതയും’ എന്നത് സാധാരണയായി ദൈവത്തിന്റെ പൂർണതയെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കപ്പെടുന്നു; കൊലൊസ്സ്യർ 2:9 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യങ്ങളിലെ പുത്രനെക്കുറിച്ചുള്ള പ്രസ്താവനകൾക്ക് കാരണം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; സന്ദർഭാനുസരിച്ച് ‘കാരണം’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: സർവനാമം തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിലെ പുത്രനെ സൂചിപ്പിക്കുന്നു. ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘ക്രിസ്തുവിൽ’ എന്ന നാമം ചേർക്കാതെ ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: εὐδόκησεν
  choice: പ്രസാദിച്ചു
  rationale: εὐδοκέω അനുകൂലമായ ഇഷ്ടമോ സന്തോഷപൂർവമായ തീരുമാനമോ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത ‘ദൈവം’ അല്ലെങ്കിൽ ‘പിതാവ്’ എന്ന കർത്താവിനെ ചേർക്കാതെ ഉയർന്നതും സ്വാഭാവികവുമായ ശൈലി നൽകുന്നു.
- source_word: πᾶν τὸ πλήρωμα
  choice: സകല പൂർണതയും
  rationale: πᾶν എന്നതിന്റെ സമഗ്രതയും πλήρωμα എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന വിശദീകരണം പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: κατοικῆσαι
  choice: വസിക്കാൻ
  rationale: സ്ഥിരമായി പാർക്കുക അഥവാ വാസമാക്കുക എന്ന ആശയം ചുരുക്കമായും മാന്യമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: εὐδόκησεν എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത കർത്താവ്
  choice: ‘ദൈവം’ അല്ലെങ്കിൽ ‘പിതാവ്’ എന്നു ചേർക്കാതെ കർത്താവിനെ മൂലപാഠത്തിലുള്ളതുപോലെ വ്യക്തമാക്കാതിരിക്കുന്നു.
  alternative: ‘സകല പൂർണതയും അവനിൽ വസിക്കണമെന്നു ദൈവം പ്രസാദിച്ചു’ അല്ലെങ്കിൽ ‘പിതാവ് പ്രസാദിച്ചു.’
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ ക്രിയയുടെ കർത്താവ് നേരിട്ട് പറഞ്ഞിട്ടില്ല. ‘ദൈവം’ അല്ലെങ്കിൽ ‘പിതാവ്’ എന്നത് സന്ദർഭത്തിൽനിന്നുള്ള സാധാരണ വ്യാഖ്യാനമാണെങ്കിലും, അത് പ്രധാനവാചകത്തിൽ ചേർത്താൽ മൂലത്തിലെ വ്യാകരണപരവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന നില ഇല്ലാതാകും.
- issue: ‘പൂർണത’യുടെ ബന്ധസൂചന
  choice: ‘സകല പൂർണതയും’ എന്നു മാത്രം നിലനിർത്തുന്നു.
  alternative: ‘ദൈവത്തിന്റെ സകല പൂർണതയും’ അല്ലെങ്കിൽ ‘അവന്റെ സകല പൂർണതയും.’
  rationale: വിശാലമായ സന്ദർഭവും കൊലൊസ്സ്യർ 2:9-ഉം ഇത് ദൈവത്തിന്റെ പൂർണതയായി മനസ്സിലാക്കാൻ ശക്തമായ അടിസ്ഥാനം നൽകുന്നു. എങ്കിലും ഈ വാക്യത്തിൽ അത്തരം ബന്ധസൂചകപദം നേരിട്ട് ഇല്ലാത്തതിനാൽ അത് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രസാദിച്ചു’ എന്ന പദം വാക്യത്തിന്റെ ഉയർന്ന ദൈവശാസ്ത്രഭാവം നിലനിർത്തുന്നു. ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർത്താവിനെയും ‘പൂർണത’യുടെ ബന്ധസൂചനയെയും പ്രധാനവാചകം നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
