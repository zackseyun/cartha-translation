id: COL.1.20
reference: Colossians 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: ml
  text: അവനിലൂടെ[a] സകലത്തെയും[b] തന്നോടു അനുരഞ്ജിപ്പിക്കാനും, അവന്റെ ക്രൂശിലെ രക്തത്തിലൂടെ സമാധാനം സ്ഥാപിച്ച്—അവനിലൂടെ[d]—ഭൂമിയിലുള്ളവയായാലും സ്വർഗങ്ങളിലുള്ളവയായാലും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനിലൂടെ’ എന്ന രണ്ടു പ്രയോഗങ്ങളും ‘അവൻ മുഖാന്തരം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘സകലത്തെയും’ എന്നത് ഗ്രീക്കിലുള്ള വിശാലതയോടെയും തുടർന്ന് വരുന്ന ‘ഭൂമിയിലുള്ളവ… സ്വർഗങ്ങളിലുള്ളവ’ എന്ന പ്രയോഗത്തോടെയും ഒത്തുപോകുന്നു. ഈ അനുരഞ്ജനം അന്തിമരക്ഷയുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന് ഈ വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: ഗ്രീക്കിൽ ‘സ്വർഗങ്ങൾ’ എന്ന പദം ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
  - marker: d
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ രണ്ടാമത്തെ ‘അവനിലൂടെ’ ഇല്ല.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മാർഗത്തെയോ പ്രവർത്തകമാധ്യമത്തെയോ സൂചിപ്പിക്കുന്നു. ‘അവനിലൂടെ’ പുത്രന്റെ മധ്യസ്ഥപങ്ക് സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποκαταλλάξαι
  choice: നിരപ്പിക്കാനും
  rationale: ബന്ധം പുനഃസ്ഥാപിച്ച് അനുരഞ്ജനം വരുത്തുക എന്ന അർഥം നൽകുന്നു. ഉപസർഗത്തിന് അമിതബലം നൽകി ‘പൂർണമായി നിരപ്പിക്കുക’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τὰ πάντα
  choice: സകലത്തെയും
  rationale: സമഗ്രമായ നപുംസകലിംഗ ബഹുവചനപ്രയോഗത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘സകല മനുഷ്യരെയും’ എന്നോ ‘പ്രപഞ്ചമൊട്ടാകെയും രക്ഷിക്കുക’ എന്നോ ചുരുക്കുകയോ വികസിപ്പിക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: εἰς αὐτόν
  choice: തന്നോടു
  rationale: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ദൈവത്തിന്റെ ഉദ്ദേശ്യപ്രവർത്തനത്തിന്റെ പ്രത്യാവർത്തകബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰρηνοποιήσας
  choice: സമാധാനം സ്ഥാപിച്ച്
  rationale: സമാധാനം ഉണ്ടാക്കുക എന്ന അർഥം dignified, current Malayalam-ൽ നൽകുകയും പ്രധാനപ്രവർത്തനത്തോടുള്ള പങ്കാളിക്രിയയുടെ ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: അവന്റെ ക്രൂശിലെ രക്തത്തിലൂടെ
  rationale: διά സൂചിപ്പിക്കുന്ന മാർഗവും ‘രക്തം’, ‘ക്രൂശ്’ എന്നീ മൂർത്തമായ പദങ്ങളും സംരക്ഷിക്കുന്നു; അവയെ വെറും ‘മരണം’ എന്നു പരാവർത്തനം ചെയ്യുന്നില്ല.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: അവനിലൂടെതന്നെ
  rationale: ആവർത്തനത്തിലെ ഊന്നൽ ‘തന്നെ’കൊണ്ടും ഇടയ്ക്കുള്ള പുനരാരംഭം ദീർഘവിരാമചിഹ്നങ്ങൾകൊണ്ടും നിലനിർത്തുന്നു; പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: εἴτε ... εἴτε
  choice: ആയാലും ... ആയാലും
  rationale: രണ്ടു വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് സഹബന്ധഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലുള്ളവ
  rationale: സ്വർഗങ്ങളോടുള്ള പ്രാപഞ്ചിക വൈരുധ്യം നിലനിർത്താൻ γῆയെ ‘ഭൂമി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ളവ
  rationale: οὐρανοῖς എന്ന ബഹുവചനരൂപം ഏകവചനമാക്കാതെ മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὰ πάντα എന്നതിലെ അനുരഞ്ജനത്തിന്റെ വ്യാപ്തി
  choice: ‘സകലത്തെയും’ എന്ന വിശാലപ്രയോഗം മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: ‘സകല മനുഷ്യരെയും’ എന്നോ ‘എല്ലാവരുടെയും അന്തിമരക്ഷ’ എന്നോ നിർവചിക്കുക.
  rationale: തുടർന്നുള്ള ‘ഭൂമിയിലുള്ളവ… സ്വർഗങ്ങളിലുള്ളവ’ എന്ന പ്രാപഞ്ചിക വിശദീകരണം വിശാലത ആവശ്യപ്പെടുന്നു; എന്നാൽ ഈ അനുരഞ്ജനം വ്യക്തികളുടെ അന്തിമരക്ഷയുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന് വാക്യം തന്നെ നിർവചിക്കുന്നില്ല.
- issue: εἰς αὐτόν എന്നതിലെ പ്രത്യാവർത്തക സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: ദൈവം പുത്രനിലൂടെ സകലത്തെയും തന്നോടു നിരപ്പിക്കുന്നു എന്ന വായനയ്ക്ക് യോജിച്ച് ‘തന്നോടു’ എന്നു നൽകി.
  alternative: മിശിഹാ സകലത്തെയും തന്നോടു നിരപ്പിക്കുന്നു എന്ന വായന.
  rationale: വാക്യം 19-ൽ ആരംഭിക്കുന്ന ദൈവിക ഇഷ്ടത്തിന്റെ ഉദ്ദേശ്യഘടന തുടരുന്നതാണ് ഏറ്റവും സാദ്ധ്യം. എങ്കിലും ‘തന്നോടു’ എന്ന മലയാളപ്രയോഗം സന്ദർഭബന്ധം നിലനിർത്തുന്നു; അധികമായ വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ‘അവന്റെ ക്രൂശിലെ രക്തം’ എന്നതിന്റെ അർഥം
  choice: രക്തത്തെയും ക്രൂശിനെയും മൂർത്തമായ ഭാഷയായി നിലനിർത്തി.
  alternative: ‘ക്രൂശിലെ അവന്റെ മരണം’ എന്ന് പരാവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്കിൽ രണ്ടുപദങ്ങളും വ്യക്തമാണ്. അവയെ നിലനിർത്തുന്നത് യാഗപരവും ചരിത്രപരവുമായ ഭാരം സംരക്ഷിക്കുന്നു; പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിരപ്പിക്കുക’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അനുരഞ്ജനത്തിന്റെ ബന്ധപരമായ അർഥം വഹിക്കുന്നതുമാണ്. വാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ഉദ്ദേശ്യഘടനയായതിനാൽ ‘നിരപ്പിക്കാനും’ എന്ന രൂപം നിലനിർത്തി. ഗ്രീക്കിലെ ആവർത്തനവും പ്രാപഞ്ചിക വ്യാപ്തിയും ദീർഘവിരാമവും ബഹുവചനമായ ‘സ്വർഗങ്ങൾ’ എന്ന രൂപവും സംരക്ഷിച്ചു.
