revisions:
- from: അവനിലൂടെ[a] സകലത്തെയും[b] തന്നോടു നിരപ്പിക്കാനും, അവന്റെ ക്രൂശിലെ രക്തത്തിലൂടെ സമാധാനം സ്ഥാപിച്ച്—അവനിലൂടെതന്നെ[d]—ഭൂമിയിലുള്ളവയായാലും സ്വർഗങ്ങളിലുള്ളവയായാലും[c].
  to: അവനിലൂടെ[a] സകലത്തെയും[b] തന്നോടു അനുരഞ്ജിപ്പിക്കാനും, അവന്റെ ക്രൂശിലെ രക്തത്തിലൂടെ സമാധാനം സ്ഥാപിച്ച്—അവനിലൂടെ[d]—ഭൂമിയിലുള്ളവയായാലും സ്വർഗങ്ങളിലുള്ളവയായാലും[c].
  rationale: 'The revision makes two limited, safe changes: it uses a more transparent modern Malayalam term for reconciliation, and it removes the added intensifier from the second ‘through him.’ All source-language ambiguity, the textual-variant footnote, the cosmic scope, and the plural ‘heavens’ are retained.'
