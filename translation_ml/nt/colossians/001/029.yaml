revisions:
- from: ഇതിനായിത്തന്നെ ഞാനും അധ്വാനിക്കുന്നു[a]—എന്നിൽ ശക്തിയോടെ പ്രവർത്തിക്കുന്ന അവന്റെ[c] പ്രവർത്തനത്തിന് അനുസൃതമായി പോരാടിക്കൊണ്ട്[b][d].
