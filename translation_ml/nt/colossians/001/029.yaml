id: COL.1.29
reference: Colossians 1:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: ml
  text: ഇതിനായി ഞാനും അധ്വാനിക്കുന്നു[a], എന്നിൽ ശക്തിയോടെ പ്രവർത്തിച്ചുകൊണ്ടിരിക്കുന്ന[d] അവന്റെ[c] പ്രവർത്തനത്തിന് അനുസരിച്ച് തീവ്രമായി പരിശ്രമിച്ചുകൊണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇതിനുവേണ്ടി’ എന്നോ ‘ഈ ലക്ഷ്യത്തിലേക്ക്’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘തീവ്രമായി പരിശ്രമിച്ചുകൊണ്ട്’ എന്നതിന് ‘പോരാടിക്കൊണ്ട്’ അല്ലെങ്കിൽ ‘കഠിനമായി യത്നിച്ചുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘അവന്റെ’ എന്നാണ്; അത് ദൈവത്തെയാണോ മശീഹയെയാണോ സൂചിപ്പിക്കുന്നത് എന്നു ഇവിടെ പ്രത്യേകം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: d
    text: ‘എന്നിൽ ശക്തിയായി പ്രവർത്തിക്കുന്ന’ എന്നോ ‘എന്നിൽ ശക്തിയിൽ പ്രവർത്തിക്കുന്ന’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: ഇതിനായിത്തന്നെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ശുശ്രൂഷാലക്ഷ്യത്തിലേക്കാണ് ഈ പ്രയോഗം വിരൽചൂണ്ടുന്നത്. ലക്ഷ്യസൂചനയും മുൻപറഞ്ഞ കാര്യത്തോടുള്ള ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: ഞാനും
  rationale: മുൻപറഞ്ഞ കാര്യത്തോടു പൗലോസിന്റെ സ്വന്തം അധ്വാനത്തെ കൂട്ടിച്ചേർക്കുന്ന അർഥം നൽകുന്നു.
- source_word: κοπιῶ
  choice: അധ്വാനിക്കുന്നു
  rationale: ക്ഷീണം വരുത്തുന്ന കഠിനപ്രയത്നം എന്ന ആശയം ഗൗരവമുള്ളതും ആധുനികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀγωνιζόμενος
  choice: പോരാടിക്കൊണ്ട്
  rationale: തീവ്രമായി യത്നിക്കുക, മത്സരത്തിൽ പൊരുതുക എന്നീ ഭാവങ്ങൾ നിലനിർത്തുന്നു; ഇവിടെ ശാരീരിക സംഘർഷം മാത്രം അർഥമാക്കുന്നില്ല.
- source_word: κατὰ
  choice: അനുസൃതമായി
  rationale: പൗലോസിന്റെ പോരാട്ടം ആ പ്രവർത്തനത്തിന്റെ അളവിനോ രീതിക്കോ ഒത്തതാണെന്ന ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἐνέργειαν
  choice: പ്രവർത്തനത്തിന്
  rationale: ഫലപ്രദമായി പ്രവർത്തിക്കുന്ന ശക്തി എന്ന ആശയം നൽകുകയും തുടർന്നുള്ള സമമൂലപദമായ ἐνεργουμένην-നോടുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: സർവനാമത്തിന്റെ മുൻപദം ദൈവമാണോ മശീഹയാണോ എന്ന് വാക്യംതന്നെ വ്യക്തമാക്കാത്തതിനാൽ ഗ്രീക്കിലെ അനിർണീതത്വം നിലനിർത്തുന്നു.
- source_word: τὴν ἐνεργουμένην
  choice: പ്രവർത്തിക്കുന്ന
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന സജീവപ്രവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള സ്ഥാനാർഥം നിലനിർത്തി, ഉള്ളിലെ ശക്തിപ്പെടുത്തലും ശുശ്രൂഷയിലെ ഫലവും തമ്മിലുള്ള വ്യാഖ്യാനസാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐν δυνάμει
  choice: ശക്തിയോടെ
  rationale: പ്രവർത്തനം ശക്തമായ വിധത്തിൽ നടക്കുന്നു എന്ന രീതിഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ശക്തിയിൽ’ എന്ന കൂടുതൽ പദാനുപദ രൂപവും സാധ്യമാണ്.
theological_decisions:
- issue: αὐτοῦ (‘അവന്റെ’) എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ദൈവമെന്നോ മശീഹയെന്നോ പേരെടുത്തു വ്യക്തമാക്കാതെ ‘അവന്റെ’ എന്നു നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ പ്രവർത്തനം’ അല്ലെങ്കിൽ ‘മശീഹയുടെ പ്രവർത്തനം’
  rationale: ഈ വാക്യത്തിൽ മുൻപദം പ്രത്യക്ഷമായി പറയുന്നില്ല. സന്ദർഭത്തിൽ ഇരുവിധ ബന്ധനിർണയത്തിനും വ്യാഖ്യാനസാധ്യതയുള്ളതിനാൽ പരിഭാഷ ഗ്രീക്കിനേക്കാൾ ഇടുങ്ങിയ തീരുമാനം എടുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രവർത്തനം/പ്രവർത്തിക്കുന്ന’ എന്ന പദാവർത്തനം ഗ്രീക്കിലെ ἐνέργεια/ἐνεργουμένην എന്ന സമമൂലപദബന്ധം മനപ്പൂർവം പ്രതിഫലിപ്പിക്കുന്നു. ഡാഷ് പ്രധാനക്രിയയെയും അതിനെ വിശദീകരിക്കുന്ന പങ്കാളിക്രിയയെയും വായനാസൗകര്യത്തോടെ ബന്ധിപ്പിക്കുന്നു.
