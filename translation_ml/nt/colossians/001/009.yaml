id: COL.1.9
reference: Colossians 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞങ്ങളും, നിങ്ങളെക്കുറിച്ചു കേട്ട ദിവസംമുതൽ, നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുന്നതും, അവന്റെ ഇഷ്ടത്തെക്കുറിച്ചുള്ള പരിജ്ഞാനത്താൽ നിങ്ങൾ സകല ജ്ഞാനത്തിലും ആത്മിക[a] വിവേകത്തിലും നിറയേണ്ടതിന് അപേക്ഷിക്കുന്നതും നിർത്തിയിട്ടില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മിക’ എന്നത് സ്വഭാവത്തിൽ ആത്മികമായത് എന്നോ ആത്മാവിനാൽ നൽകപ്പെട്ടത് എന്നോ അർഥമാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പൂർണപരിജ്ഞാനം.’ ഗ്രീക്ക് പദത്തിന് കൂടുതൽ പൂർണമായതോ ആഴമുള്ളതോ ആയ അറിവ് എന്ന ഭാവം ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച കൊലൊസ്സ്യരുടെ വിശ്വാസത്തെയും സ്നേഹത്തെയും ആധാരമാക്കിയ കാരണപരവും നിഗമനപരവുമായ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ ἡμεῖς
  choice: ഞങ്ങളും
  rationale: പൗലൊസിനെയും സഹപ്രവർത്തകരെയും പ്രതികരണത്തിൽ ഉൾപ്പെടുത്തുന്ന καί-യുടെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: നിങ്ങളെക്കുറിച്ചു കേട്ട ദിവസംമുതൽ
  rationale: പ്രാർഥന ആരംഭിച്ച കാലബിന്ദുവും ഇന്നുവരെ തുടരുന്ന സ്വഭാവവും വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ കേട്ടത് അവരെക്കുറിച്ചാണെന്നത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οὐ παυόμεθα
  choice: നിർത്തിയിട്ടില്ല
  rationale: ഭൂതകാലത്ത് ആരംഭിച്ച് ഇപ്പോഴും തുടരുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പ്രാർഥനയിലെ പ്രയോജനാർത്ഥകമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: പ്രാർഥിക്കുന്നതും ... അപേക്ഷിക്കുന്നതും
  rationale: പൊതുവായ പ്രാർഥനയെയും അതിനുള്ളിലെ പ്രത്യേക അപേക്ഷയെയും വേർതിരിച്ചുകൊണ്ട് രണ്ടു ക്രിയകളുടെയും വാചകസമൃദ്ധി നിലനിർത്തുന്നു.
- source_word: ἵνα πληρωθῆτε
  choice: നിങ്ങൾ നിറയണമെന്ന്
  rationale: അപേക്ഷയുടെ ഉള്ളടക്കം പ്രകടിപ്പിക്കുകയും നിറയ്ക്കുന്ന കർത്താവിനെ ഗ്രീക്കുപോലെ വ്യക്തമാക്കാതെ വിടുകയും ചെയ്യുന്നു.
- source_word: τὴν ἐπίγνωσιν
  choice: പരിജ്ഞാനം
  rationale: സാധാരണ അറിവിനെക്കാൾ ആഴമുള്ള തിരിച്ചറിവിന്റെ സാധ്യത സൂചിപ്പിക്കുന്നതോടൊപ്പം ‘പൂർണമായ അറിവ്’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധമാക്കുന്നില്ല.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: അവന്റെ ഇഷ്ടത്തെക്കുറിച്ചുള്ള
  rationale: ദൈവം ഇച്ഛിക്കുന്നതിനെക്കുറിച്ചുള്ള പരിജ്ഞാനം എന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: സകല ആത്മിക ജ്ഞാനത്തിലും വിവേകത്തിലും
  rationale: ἐν സൂചിപ്പിക്കുന്ന മേഖലയെയോ അനുഗമിക്കുന്ന രീതിയെയോ തുറന്നുവെക്കുകയും πνευματικῇ ജ്ഞാനത്തെയും വിവേകത്തെയും ഒരുമിച്ച് വിശേഷിപ്പിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐπίγνωσις എന്ന പദത്തിന്റെ തീവ്രത
  choice: പരിജ്ഞാനം
  alternative: പൂർണപരിജ്ഞാനം
  rationale: പദത്തിന് കൂടുതൽ പൂർണമായോ ആഴമുള്ളതായോ അറിവ് എന്ന ഭാവം ഉണ്ടായേക്കാമെങ്കിലും, ‘പൂർണ’ എന്നത് മുഖ്യപാഠത്തിൽ ചേർത്താൽ ഗ്രീക്ക് നിർബന്ധമാക്കാത്ത ഊന്നൽ വരാം. അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: πνευματικῇ എന്ന വിശേഷണത്തിന്റെ സൂചന
  choice: ആത്മിക
  alternative: ആത്മാവ് നൽകുന്ന
  rationale: ജ്ഞാനത്തിന്റെയും വിവേകത്തിന്റെയും സ്വഭാവത്തെയോ പരിശുദ്ധാത്മാവിൽനിന്നുള്ള അവയുടെ ഉറവിടത്തെയോ ഈ പദം സൂചിപ്പിക്കാം. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ തുറന്ന നില സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ ‘ആത്മിക’ എന്നും മറ്റുസാധ്യത അടിക്കുറിപ്പിലും നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ പ്രവാഹം നിലനിർത്തിയെങ്കിലും, പ്രാർഥനയും പ്രത്യേക അപേക്ഷയും മലയാളത്തിൽ വ്യക്തമായി വായിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി. ദൈവത്തെ നിറയ്ക്കുന്ന കർത്താവായി തുറന്നുപറയാതെയും ‘ആത്മിക’ എന്നതിന്റെ പരിശുദ്ധാത്മബന്ധം നിർബന്ധമായി തീർപ്പാക്കാതെയും മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
