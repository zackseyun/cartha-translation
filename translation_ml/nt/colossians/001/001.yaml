  footnotes:
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘സഹോദരൻ’ (നിർദ്ദിഷ്ട ആർട്ടിക്കിളോടെ). ഇവിടെ തിമൊഥെയൊസിനെ വിശ്വാസസമൂഹത്തിലെ സഹോദരനായി വിശേഷിപ്പിക്കുന്നു; ചില പരിഭാഷകൾ ‘നമ്മുടെ സഹോദരനായ’ എന്നു നൽകുന്നു.
