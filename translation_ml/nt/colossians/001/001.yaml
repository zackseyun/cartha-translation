  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: ml
  text: മശീഹാ യേശുവിന്റെ അപ്പൊസ്തലനായ പൗലോസും, ദൈവഹിതത്താൽ, സഹോദരനായ തിമൊഥെയൊസും[b],
