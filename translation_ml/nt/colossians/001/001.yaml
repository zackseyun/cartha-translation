lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: Παῦλος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: ഇവിടെ ഇത് വെറും ‘ദൂതൻ’ എന്ന പൊതുവായ അർഥത്തിലല്ല, പൗലോസിന്റെ അംഗീകൃത ശുശ്രൂഷാപദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അപ്പൊസ്തലൻ’ എന്നു നൽകി.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹായായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. അതിനാൽ അതിന്റെ അർഥം നിലനിർത്താൻ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; ജനിറ്റീവ് ബന്ധം ‘യേശുവിന്റെ’ എന്നതിലൂടെ വ്യക്തമാക്കി.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവത്തിന്റെ ഹിതത്താൽ
  rationale: διά + ജനിറ്റീവ് ഇവിടെ പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തിനു പിന്നിലുള്ള ദൈവിക നിർണയത്തെയോ ആധാരത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഹിതത്താൽ’ മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Τιμόθεος
  choice: തിമൊഥെയൊസ്
  rationale: Τιμόθεος എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ὁ ἀδελφὸς
  choice: സഹോദരനായ
  rationale: ഇവിടത്തെ നിർദ്ദിഷ്ട ആർട്ടിക്കിൾ തിമൊഥെയൊസിന്റെ വിശ്വാസസമൂഹപരമായ വിശേഷണവുമായി ചേർന്നിരിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ എന്ന ഉടമസ്ഥസൂചന ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ അഭിവാദ്യത്തിൽ Χριστός യേശുവിന്റെ സ്ഥാനപ്പേരെന്ന അർഥം നിലനിർത്തുന്നു. ‘മശീഹാ’ ആ അർഥം നേരിട്ട് അറിയിക്കുന്നു; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപവും സാധുവായ മറ്റൊരു പരിഭാഷയാണ്.
- issue: ὁ ἀδελφός എന്നതിലെ ബന്ധസൂചന
  choice: സഹോദരനായ
  alternative: നമ്മുടെ സഹോദരനായ
  rationale: ഗ്രീക്കിൽ ‘നമ്മുടെ’ എന്ന സർവനാമമില്ല. ക്രിസ്തീയ കൂട്ടായ്മയിലെ ബന്ധം ‘സഹോദരൻ’ വ്യക്തമാക്കുന്നതിനാൽ അധിക ഉടമസ്ഥസൂചന ചേർക്കാതെ മൂലത്തോട് അടുത്ത രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള കത്താരംഭശൈലി സ്വീകരിച്ചു. അടുത്ത വാക്യഘടകത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്ന അഭിവാദ്യമായതിനാൽ അവസാനം പൂർണ്ണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി. ‘മശീഹായായ’ എന്ന രൂപം സ്ഥാനപ്പേരും വ്യക്തിനാമവും തമ്മിലുള്ള ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
