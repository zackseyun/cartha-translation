language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: ml
  text: അവൻ നമ്മെ അന്ധകാരത്തിന്റെ അധികാരത്തിൽനിന്ന് രക്ഷിക്കുകയും താൻ സ്നേഹിക്കുന്ന പുത്രന്റെ രാജ്യത്തിലേക്ക് മാറ്റുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പ്രിയപുത്രന്റെ’; അക്ഷരാർഥത്തിൽ, ‘തന്റെ സ്നേഹത്തിന്റെ പുത്രന്റെ.’
    reason: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ എന്ന ജനിറ്റീവ് പ്രയോഗത്തിന് സ്വാഭാവികമായ അർഥവിവർത്തനവും അതിന്റെ അക്ഷരാർഥസന്നിഹിത രൂപവും നൽകുന്നു.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: രക്ഷിച്ചു
  rationale: ശത്രുതാപരമായ അധികാരത്തിൽനിന്നോ അപകടത്തിൽനിന്നോ നിർണായകമായി വിടുവിക്കുന്നതിനെ ῥύομαι സൂചിപ്പിക്കുന്നു; ‘രക്ഷിച്ചു’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐξουσίας
  choice: അധികാരം
  rationale: ἐξουσία എന്നത് അധികാരം, അവകാശം, ഭരണശക്തി എന്നിവയെ സൂചിപ്പിക്കാം. ഇവിടെ ‘അധികാരം’ നേരിട്ടുള്ള സമാനപദമാണ്; ‘ആധിപത്യം’ എന്നത് സാധ്യമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: σκότους
  choice: അന്ധകാരം
  rationale: σκότος എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘അന്ധകാരം’ എന്നാണ്. അതിലെ ധാർമികവും ആത്മീയവുമായ സൂചനകൾ വിശദീകരിക്കാതെ അന്തർനിഹിതമായി നിലനിർത്തുന്നു.
- source_word: μετέστησεν
  choice: മാറ്റി
  rationale: μεθίστημι ഒരു സ്ഥലത്തുനിന്നോ അവസ്ഥയിൽനിന്നോ മറ്റൊന്നിലേക്കുള്ള മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ‘രാജ്യത്തിലേക്ക് മാറ്റി’ എന്ന പ്രയോഗം രണ്ടു ഭരണവലയങ്ങൾക്കിടയിലെ കൈമാറ്റം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: βασιλείαν
  choice: രാജ്യം
  rationale: βασιλεία എന്നത് രാജത്വമോ രാജ്യമോ ആകാം. εἰς എന്നതിനോടും മാറ്റത്തിന്റെ ദൃശ്യത്തോടും ചേർന്ന് ഇവിടെ ‘രാജ്യം’ സ്വാഭാവികമാണ്; പുത്രന്റെ ഭരണവും അതിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: υἱοῦ
  choice: പുത്രൻ
  rationale: υἱός എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘പുത്രൻ’ എന്നാണ്. സന്ദർഭത്തിൽ ഇത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀγάπης
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിന് ‘സ്നേഹം’ എന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദം ഉപയോഗിക്കുന്നു.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: തന്റെ സ്നേഹത്തിന്റെ പുത്രൻ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയായ ‘അവന്റെ സ്നേഹത്തിന്റെ പുത്രൻ’ എന്ന രൂപം മലയാളത്തിൽ സ്വാഭാവികമാകുന്ന പരിധിവരെ നിലനിർത്തുന്നു. പ്രധാനവാക്യത്തിലെ കർത്താവായ പിതാവിലേക്കുള്ള സൂചന വ്യക്തമാക്കാൻ ‘തന്റെ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ എന്ന ജനിറ്റീവ് പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: തന്റെ സ്നേഹത്തിന്റെ പുത്രൻ
  alternative: തന്റെ പ്രിയപുത്രൻ; താൻ സ്നേഹിക്കുന്ന പുത്രൻ
  rationale: മൂലപാഠത്തിന്റെ പ്രത്യേക ഘടനയും പിതാവിന് പുത്രനോടുള്ള സ്നേഹത്തിന്റെ ഊന്നലും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. കൂടുതൽ സ്വാഭാവികമായ വ്യാഖ്യാനരൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു; അവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിതമായി അന്തിമ അർഥമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അന്ധകാരത്തിന്റെ അധികാരം’, ‘സ്നേഹത്തിന്റെ പുത്രൻ’ എന്നീ മൂലപാഠസന്നിഹിത പ്രയോഗങ്ങൾ വായനാസൗകര്യം നഷ്ടപ്പെടുത്താതെ നിലനിർത്തി. മുൻസന്ദർഭത്തിലെ പിതാവിനെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ എന്നും പ്രതിഫലക ഉടമസ്ഥരൂപമായി ‘തന്റെ’ എന്നും ഉപയോഗിച്ചു.
