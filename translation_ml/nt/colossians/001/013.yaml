revisions:
- from: അവിടുന്ന് നമ്മെ അന്ധകാരത്തിന്റെ അധികാരത്തിൽനിന്ന് രക്ഷിച്ച് തന്റെ സ്നേഹത്തിന്റെ പുത്രന്റെ രാജ്യത്തിലേക്ക് മാറ്റി.[a]
  to: അവൻ നമ്മെ അന്ധകാരത്തിന്റെ അധികാരത്തിൽനിന്ന് രക്ഷിക്കുകയും താൻ സ്നേഹിക്കുന്ന പുത്രന്റെ രാജ്യത്തിലേക്ക് മാറ്റുകയും ചെയ്തു.[a]
  rationale: The revision retains the Greek contrast between liberation from darkness’s authority and transfer into the Son’s kingdom. It replaces an opaque literal genitive with natural Malayalam (‘താൻ സ്നേഹിക്കുന്ന പുത്രൻ’), while preserving both the common idiomatic alternative and the literal genitive texture in the footnote. It also makes the two Greek aorist actions explicitly coordinate in Malayalam.
