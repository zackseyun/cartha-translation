source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: ml
  text: അവനിൽ നമുക്കു പാപങ്ങളുടെ ക്ഷമയായ വീണ്ടെടുപ്പ്[a] ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണ്ടെടുപ്പ്’ എന്നും ‘ക്ഷമ’ എന്നും പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദങ്ങൾക്ക് ‘മോചനം’ എന്ന അർഥവും വരാം. ഇവിടെ ‘പാപങ്ങളുടെ ക്ഷമ’ എന്നത് വീണ്ടെടുപ്പിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: അവനിൽ
  rationale: പുരുഷലിംഗ ഏകവചനത്തിലുള്ള ബന്ധസർവനാമം മുൻവാക്യത്തിലെ പ്രിയപുത്രനെ സൂചിപ്പിക്കുന്നു. ‘അവനിൽ’ എന്നത് വ്യക്തിപരമായ സൂചനയും ബന്ധപരമായ/ഐക്യപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἔχομεν
  choice: നമുക്ക് ... ഉണ്ട്
  rationale: വർത്തമാനകാല സജീവ നിർദേശരൂപം ഇപ്പോഴുള്ള അനുഭവമോ കൈവശമോ ലളിതമായി അറിയിക്കുന്നു.
- source_word: ἀπολύτρωσιν
  choice: വീണ്ടെടുപ്പ്
  rationale: മോചനവും വിലകൊടുത്തുള്ള വീണ്ടെടുക്കലും ഉൾക്കൊള്ളുന്ന പൗലോസീയ പ്രയോഗത്തിന്റെ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പദമാണിത്.
- source_word: ἄφεσιν
  choice: ക്ഷമ
  rationale: പാപങ്ങളെ സംബന്ധിച്ച ഈ സന്ദർഭത്തിൽ ἄφεσις എന്നതിന്റെ വ്യക്തവും സ്വാഭാവികവുമായ തുല്യപദം ‘ക്ഷമ’ ആണ്; ഇത് വീണ്ടെടുപ്പിനെ വിശദീകരിക്കുന്ന സമാനാധികരണ നാമപദമായി വരുന്നു.
- source_word: τῶν ἁμαρτιῶν
  choice: പാപങ്ങളുടെ
  rationale: ഷഷ്ഠീ ബഹുവചനം ക്ഷമയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു; ‘പാപങ്ങളുടെ ക്ഷമ’ മലയാളത്തിൽ സ്വാഭാവികവും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
theological_decisions:
- issue: ‘വീണ്ടെടുപ്പ്’ എന്നതും ‘പാപങ്ങളുടെ ക്ഷമ’ എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: ‘വീണ്ടെടുപ്പും പാപങ്ങളുടെ ക്ഷമയും’ എന്ന രൂപത്തിൽ, മലയാളത്തിലെ ഏക ‘ഉണ്ട്’ എന്ന ക്രിയയോടൊപ്പം ചേർത്ത് സമാനാധികരണബന്ധം സന്ദർഭത്തിലും കുറിപ്പിലും വ്യക്തമാക്കുക.
  alternative: ‘വീണ്ടെടുപ്പ്, അതായത് പാപങ്ങളുടെ ക്ഷമ’ എന്ന് വിശദീകരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ നാമപദം ആദ്യത്തേതിന് സമാനാധികരണമായി നിൽക്കുന്നു. ‘അതായത്’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, ഇവിടെ പാപക്ഷമ വീണ്ടെടുപ്പിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു എന്ന ബന്ധം കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവനിൽ’ ക്രിസ്തുവുമായുള്ള ബന്ധപരമായ അർഥം നിലനിർത്തുന്നു; ‘വീണ്ടെടുപ്പ്’, ‘പാപങ്ങളുടെ ക്ഷമ’ എന്നീ പരിചിതമായെങ്കിലും ഗൗരവമുള്ള ബൈബിൾപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ഉപയോഗിച്ചു.
