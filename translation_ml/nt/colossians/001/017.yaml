  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: ml
  text: അവൻ സകലത്തിനും മുമ്പേ ഉള്ളവനാണ്[b]; സകലവും അവനിൽ ഒന്നിച്ചുനിൽക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സകലവും അവനിൽ നിലനിൽക്കുന്നു” അല്ലെങ്കിൽ “സകലവും അവനിൽ യോജിച്ചു നിൽക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: “സകലത്തിനും മുമ്പേ” എന്നത് സകലത്തിന്മേലുള്ള അവന്റെ പരമാധികാരത്തെയും സൂചിപ്പിക്കാം; എന്നാൽ ഗ്രീക്ക് പ്രയോഗം പ്രാഥമികമായി മുൻനില്പിനെയാണ് പ്രകടിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτός
  choice: അവൻ
  rationale: വാക്യത്തിന്റെ ആരംഭത്തിലുള്ള സർവനാമത്തിന് ഊന്നലുണ്ടെങ്കിലും, മലയാളത്തിൽ ‘അവൻ’ എന്ന സ്വാഭാവിക രൂപം തന്നെ സന്ദർഭത്തിൽ ആ ഊന്നൽ മതിയായവിധം വഹിക്കുന്നു.
- source_word: πρὸ πάντων
  choice: സകലത്തിനും മുമ്പേ
  rationale: πρό + ഷഷ്ഠി ഇവിടെ പ്രാഥമികമായി മുൻകാലികതയെയും മുൻനില്പിനെയും സൂചിപ്പിക്കുന്നു. ‘സകലത്തിനും മീതെ’ എന്നു വിവർത്തനം ചെയ്താൽ പദവിയിലെ ശ്രേഷ്ഠതയിലേക്കു മാത്രം അർഥം മാറാം.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: പ്രയോഗത്തിന്റെ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുകയും ചുറ്റുപാടിലെ സൃഷ്ടിസംബന്ധമായ ആശയത്തെ അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാനബന്ധം നിലനിർത്തുന്നു; ‘അവനാൽ’ അല്ലെങ്കിൽ ‘അവനിലൂടെ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപങ്ങളിലേക്കു മാറ്റുന്നില്ല.
- source_word: συνέστηκεν
  choice: നിലനിൽക്കുന്നു
  rationale: പൂർണ്ണകാല ക്രിയ സൂചിപ്പിക്കുന്ന, മുൻപ്രവർത്തനത്തിന്റെ ഫലമായി തുടരുന്ന ഇപ്പോഴത്തെ അവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു. ഐക്യത്തോടെ ചേർന്നുനിൽക്കുന്നു എന്ന ഭാവവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: πρὸ πάντων എന്നതിൽ ക്രിസ്തുവും സൃഷ്ടിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘സകലത്തിനും മുമ്പേ ഉള്ളവൻ’ എന്ന മുൻകാലികത/മുൻനില്പ് പ്രധാനപാഠത്തിൽ പ്രകടിപ്പിച്ചു.
  alternative: ‘സകലത്തിനും മീതെയുള്ളവൻ’ എന്ന പദവിപരമായ പരമാധികാരം.
  rationale: ഗ്രീക്ക് പദക്രമം പ്രാഥമികമായി മുൻനില്പിനെയാണ് സൂചിപ്പിക്കുന്നത്. സന്ദർഭത്തിൽ പരമാധികാരത്തിന്റെ സൂചന ഉണ്ടാകാമെങ്കിലും അതിനെ പ്രധാനപാഠത്തിൽ മാത്രം അർഥമാക്കി മാറ്റാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: συνέστηκεν എന്നതിന്റെ അർഥബലം
  choice: സകലവും അവനിൽ ‘നിലനിൽക്കുന്നു’.
  alternative: സകലവും അവനിൽ ‘ഒന്നിച്ചുനിൽക്കുന്നു’ അല്ലെങ്കിൽ ‘സംഘടിതമായിരിക്കുന്നു’.
  rationale: സൃഷ്ടിയുടെ തുടർച്ചയായ നിലനില്പും ക്രമബന്ധവും ഈ രൂപം ലളിതമായി അറിയിക്കുന്നു; പദത്തിന്റെ സത്താപരവും ഐക്യപരവുമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉള്ളവനാണ്’ എന്ന പ്രയോഗം ἐστιν πρὸ πάντων എന്ന നിലനില്പിന്റെ ആശയം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദബന്ധങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
