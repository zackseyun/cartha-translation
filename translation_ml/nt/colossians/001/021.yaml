  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: ml
  text: ഒരിക്കൽ അകന്നവരും മനസ്സിൽ ശത്രുതയുള്ളവരും ദുഷ്‌പ്രവൃത്തികൾ ചെയ്തിരുന്നവരുമായിരുന്ന നിങ്ങളെയും[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദുഷ്‌പ്രവൃത്തികളിൽ മനസ്സിൽ ശത്രുക്കളായിരുന്ന നിങ്ങളെയും.” ഗ്രീക്ക് പ്രയോഗം സാന്ദ്രമാണ്; മനസ്സിലെ ശത്രുതയും ദുഷ്‌പ്രവൃത്തികളും തമ്മിലുള്ള കൃത്യബന്ധം അതിൽ വ്യക്തമാക്കിയിട്ടില്ല.'
