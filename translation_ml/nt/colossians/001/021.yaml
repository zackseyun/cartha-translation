lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: നിങ്ങളെയും
  rationale: മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ബന്ധവും ക്രിസ്തുവിന്റെ അനുരഞ്ജനപ്രവൃത്തിയിൽ വായനക്കാരും ഉൾപ്പെടുന്നു എന്ന സൂചനയും ‘-യെയും’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ποτε
  choice: ഒരിക്കൽ
  rationale: വായനക്കാരുടെ മുൻകാല അവസ്ഥയെ ചുരുക്കമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ὄντας
  choice: ആയിരുന്ന
  rationale: ഗ്രീക്കിലെ പങ്കാളിത്തരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിശേഷണബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπηλλοτριωμένους
  choice: അകന്നവർ
  rationale: ബന്ധപരമായ വേർപാടിന്റെ നില വ്യക്തമാക്കുന്നു; ഈ വാക്യഭാഗത്തിൽ വ്യക്തമാക്കാത്ത ‘ദൈവത്തിൽനിന്ന്’ എന്ന പദം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: മനസ്സിൽ ശത്രുതയുള്ളവർ
  rationale: ‘മനസ്സുകൊണ്ട് ശത്രുക്കൾ’ എന്ന അത്യന്തം അക്ഷരാർഥമായെങ്കിലും അസ്വാഭാവികമായ പ്രയോഗത്തിനു പകരം ആന്തരിക ശത്രുതയുടെ അർഥം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: ദുഷ്‌പ്രവൃത്തികൾ ചെയ്തിരുന്ന
  rationale: ആന്തരിക ശത്രുതയും പുറമേയുള്ള ദുഷ്‌പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ ἐν സൂചിപ്പിക്കുന്ന കൃത്യബന്ധം അനിശ്ചിതമായതിനാൽ അതിനെ കർശനമായ കാരണബന്ധമായി അവതരിപ്പിക്കുന്നില്ല.
- source_word: ἔργοις
  choice: പ്രവൃത്തികൾ
  rationale: ഇവിടെ മനുഷ്യരുടെ പ്രവർത്തികളെ സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാളപദമാണ്.
- source_word: πονηροῖς
  choice: ദുഷ്‌
  rationale: ധാർമിക തിന്മയുടെ ശക്തി ചുരുക്കമായും നേരിട്ടും നൽകുന്നു.
theological_decisions:
- issue: മനസ്സിലെ ശത്രുതയും ദുഷ്‌പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം
  choice: ‘മനസ്സിൽ ശത്രുതയുള്ളവരുമായി ദുഷ്‌പ്രവൃത്തികൾ ചെയ്തിരുന്ന’ എന്ന് നൽകി ആന്തരിക മനോഭാവവും പുറമേയുള്ള പ്രവൃത്തികളും ഒരുമിച്ച് നിലനിർത്തുന്നു.
  alternative: ‘ദുഷ്‌പ്രവൃത്തികളിൽ മനസ്സുകൊണ്ട് ശത്രുക്കളായിരുന്ന’ എന്ന കൂടുതൽ അക്ഷരാർഥമായ രൂപം.
  rationale: ἐν എന്ന പദം മേഖല, പ്രകടനം, അല്ലെങ്കിൽ ബന്ധം സൂചിപ്പിക്കാം; അത് ‘കാരണം’ എന്ന് ഉറപ്പിച്ച് ദൈവശാസ്ത്രപരമായ ബന്ധം നിർണ്ണയിക്കാതെ ഗ്രീക്കിന്റെ സാന്ദ്രത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഇത് അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്ന വാക്യഭാഗമായതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തിയിരിക്കുന്നു.
