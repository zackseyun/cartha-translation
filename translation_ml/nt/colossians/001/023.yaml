id: COL.1.23
reference: Colossians 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: ml
  text: നിങ്ങൾ വിശ്വാസത്തിൽ തുടരുകയും, അടിത്തറയുറപ്പിക്കപ്പെട്ടവരും ഉറച്ചവരുമായി, നിങ്ങൾ കേട്ടതും ആകാശത്തിൻ കീഴിലുള്ള സകല സൃഷ്ടിയിലും[a] പ്രസംഗിക്കപ്പെട്ടതുമായ സുവിശേഷത്തിന്റെ പ്രത്യാശയിൽനിന്ന് അകന്നുപോകാതിരിക്കുകയും ചെയ്യുന്നുവെങ്കിൽ തീർച്ചയായും—ആ സുവിശേഷത്തിന്റെ സേവകനായി[b] പൗലോസ് എന്ന ഞാൻ തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആകാശത്തിൻ കീഴിലുള്ള സകല സൃഷ്ടജീവികളിൽ.’ ഗ്രീക്ക് പദത്തിന് ‘സൃഷ്ടി’ എന്നും, ചില സന്ദർഭങ്ങളിൽ ‘സൃഷ്ടജീവി’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശുശ്രൂഷകനായി.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് സേവകനെയോ ശുശ്രൂഷകനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ചെയ്യുന്നുവെങ്കിൽത്തന്നെ
  rationale: യഥാർഥമായ ഉപാധിയുടെ സ്വഭാവവും γε നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു; ഉറപ്പുള്ള നിലപാടായോ രക്ഷ നഷ്ടപ്പെടുമെന്ന നിഗമനമായോ ഇതിനെ മാറ്റുന്നില്ല.
- source_word: ἐπιμένετε τῇ πίστει
  choice: വിശ്വാസത്തിൽ ... തുടരുകയും
  rationale: വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന തുടർച്ചയും τῇ πίστει എന്നതിലെ ‘വിശ്വാസം’ എന്ന സ്വാഭാവിക അർഥവും വ്യക്തമാക്കുന്നു.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: അടിത്തറയുറപ്പിക്കപ്പെട്ടവരും സ്ഥിരതയുള്ളവരുമായി
  rationale: τεθεμελιωμένοι എന്ന പൂർണ നിഷ്ക്രിയ രൂപത്തിലെ അടിത്തറയുടെ രൂപകവും മുൻപ് ഉറപ്പിക്കപ്പെട്ടതിന്റെ നിലനിൽക്കുന്ന ഫലവും സൂക്ഷിക്കുന്നു; ἑδραῖοι ഉറച്ച സ്ഥിരതയെ സൂചിപ്പിക്കുന്നു.
- source_word: μὴ μετακινούμενοι
  choice: അകന്നുപോകാതിരിക്കുകയും
  rationale: ഒരു ഉറച്ച സ്ഥാനത്തുനിന്ന് മാറ്റപ്പെടാതിരിക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിന്റെ പ്രത്യാശയിൽനിന്ന്
  rationale: പ്രത്യാശയും സുവിശേഷവും തമ്മിലുള്ള ഗ്രീക്ക് ഷഷ്ഠീബന്ധം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ κηρυχθέντος
  choice: പ്രസംഗിക്കപ്പെട്ടതുമായ
  rationale: പൊതുവായി പ്രഖ്യാപിക്കപ്പെട്ടുവെന്ന അർഥവും നിഷ്ക്രിയ രൂപവും നിലനിർത്തുന്നു.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: ആകാശത്തിൻ കീഴിലുള്ള സകല സൃഷ്ടിയിലും
  rationale: κτίσις എന്നതിന്റെ വിശാലവും സൃഷ്ടിസംബന്ധവുമായ അർഥം പ്രധാന പാഠത്തിൽ സൂക്ഷിക്കുന്നു; ‘സകല സൃഷ്ടജീവികൾക്കും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: പൗലോസ് എന്ന ഞാൻ ആ സുവിശേഷത്തിന്റെ സേവകനായി തീർന്നു
  rationale: ബന്ധസർവനാമം സുവിശേഷത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; διάκονος-ന് സ്ഥാപനപരമായ പദവിയെന്ന അനാവശ്യ സൂചന ഒഴിവാക്കി ‘സേവകൻ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: εἴ γε-യുടെ ഉപാധിസ്വഭാവവും വിശ്വാസത്തിൽ നിലനിൽക്കലും
  choice: ‘ചെയ്യുന്നുവെങ്കിൽത്തന്നെ’ എന്ന യഥാർഥ ഉപാധിയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിങ്ങൾ തീർച്ചയായും തുടരുന്നതിനാൽ’ അല്ലെങ്കിൽ രക്ഷ നഷ്ടപ്പെടാനുള്ള സാധ്യതയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്ന ‘തുടർന്നാൽ മാത്രം’.
  rationale: ഗ്രീക്ക് വാക്യം വിശ്വാസത്തിൽ തുടരുന്നതുമായി ബന്ധപ്പെട്ട ഒരു ഉപാധി അവതരിപ്പിക്കുന്നു; എന്നാൽ വിശ്വാസത്യാഗമോ ഉറപ്പായ സ്ഥിരോത്സാഹമോ സംബന്ധിച്ച വിപുലമായ സിദ്ധാന്തവിവാദം ഈ വാക്യം മാത്രം തീർപ്പാക്കുന്നില്ല.
- issue: τῇ πίστει എന്നതിലെ πίστις
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ വിശ്വാസികളുടെ വിശ്വാസത്തെയോ അവർ നിലകൊള്ളുന്ന വിശ്വാസമേഖലയെയോ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം; ‘വിശ്വസ്തത’ എന്നത് കുറച്ച് സാധ്യതയുള്ളതാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട് വായനാസൗകര്യത്തിനായി ഉപാധിക്രിയയെ ആദ്യവാക്യത്തിന്റെ അവസാനം വെച്ചു. ‘അടിത്തറയുറപ്പിക്കപ്പെട്ടവർ’ എന്ന രൂപം മൂലത്തിലെ രൂപകവും നിഷ്ക്രിയ പൂർണഫലവും സംരക്ഷിക്കുന്നു.
