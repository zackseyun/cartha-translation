id: COL.1.18
reference: Colossians 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: ml
  text: അവൻതന്നെയാണ് സഭയായ ശരീരത്തിന്റെ തല; അവൻ ആരംഭവും[a] മരിച്ചവരിൽനിന്നുള്ള ആദ്യജാതനും ആകുന്നു; അങ്ങനെ സകലത്തിലും അവൻതന്നെ പ്രഥമസ്ഥാനത്താകേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആരംഭം’ (ἀρχή) എന്നതിന് ‘ഉറവിടം’ എന്നോ ‘ഭരണാധികാരി’ എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: ‘സകലത്തിലും അവൻതന്നെ ഒന്നാം സ്ഥാനം വഹിക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: അവൻ / അവൻതന്നെ
  rationale: ആവർത്തിച്ചുവരുന്ന സർവനാമത്തിന്റെ ഊന്നൽ അവസാന ഉപവാക്യത്തിൽ ‘അവൻതന്നെ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: κεφαλή
  choice: തല
  rationale: ക്രിസ്തുവും സഭയും തമ്മിലുള്ള ‘തല–ശരീരം’ എന്ന രൂപകം അതേപടി നിലനിർത്തുന്നു; അധികാരം എന്നോ ഉറവിടം എന്നോ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: σῶμα
  choice: ശരീരം
  rationale: ‘തല’യോടു ചേർന്നുള്ള സമൂഹരൂപകം വ്യക്തമായി സംരക്ഷിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἐκκλησία
  choice: സഭ
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ദൈവജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാള പ്രയോഗം.
- source_word: ἀρχή
  choice: ആരംഭം
  rationale: ‘മരിച്ചവരിൽനിന്നുള്ള ആദ്യജാതൻ’ എന്ന തുടർപ്രയോഗത്തോടു യോജിച്ച് പുനരുത്ഥാനക്രമത്തിന്റെ തുടക്കക്കാരൻ എന്ന ആശയം സൂചിപ്പിക്കുന്നു; വാക്കിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πρωτότοκος
  choice: ആദ്യജാതൻ
  rationale: മൂലപദത്തിന്റെ രൂപവും തിരുവെഴുത്തിലെ അന്തർബന്ധങ്ങളും സംരക്ഷിക്കുന്നു; ക്രമത്തോടൊപ്പം സ്ഥാനമഹത്ത്വവും സൂചിപ്പിക്കാൻ തുടർന്നുള്ള വാക്യം ഇടനൽകുന്നു.
- source_word: ἐκ τῶν νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുള്ള
  rationale: പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം; മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്ന് ഉയിർത്തെഴുന്നേറ്റത് എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἵνα γένηται
  choice: അങ്ങനെ ... ആകേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവും ഫലവും ഒരുപോലെ തുറന്നുവെക്കുന്ന ἵνα ഉപവാക്യത്തെയും γένηται എന്ന ‘ആകുക’ എന്ന ചലനാത്മകതയെയും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐν πᾶσιν
  choice: സകലത്തിലും
  rationale: നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രവും വിശ്വവ്യാപകവുമായ പരിധി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρωτεύων
  choice: പ്രഥമസ്ഥാനത്താകുക
  rationale: ‘ഒന്നാം സ്ഥാനം വഹിക്കുക, മുൻപന്തിയിലായിരിക്കുക’ എന്ന പങ്കാളിപദത്തിന്റെ അർഥം അമൂർത്തമായ ഒരു സിദ്ധാന്തപദമാക്കി മാറ്റാതെ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തു–ശരീരം രൂപകത്തിലെ κεφαλή എന്നതിന്റെ അർഥം
  choice: ‘തല’ എന്ന രൂപകം വ്യാഖ്യാനപരമായ വികസനം കൂടാതെ നിലനിർത്തി.
  alternative: ‘നേതാവ്/അധികാരിയായവൻ’ അല്ലെങ്കിൽ ‘ഉറവിടം’
  rationale: ഗ്രീക്ക് രൂപകം അധികാരവും ഉറവിടവും സംബന്ധിച്ച വ്യാഖ്യാനസാധ്യതകൾ ഉൾക്കൊള്ളുന്നു; അവയിൽ ഒന്ന് മാത്രം പരിഭാഷയിൽ നിർബന്ധിച്ച് നിശ്ചയിക്കുന്നത് ഒഴിവാക്കി.
- issue: പുനരുത്ഥാനസന്ദർഭത്തിലെ ἀρχή എന്നതിന്റെ അർഥം
  choice: ‘ആരംഭം’
  alternative: ‘ഉറവിടം’ അല്ലെങ്കിൽ ‘ഭരണാധികാരി’
  rationale: തൊട്ടുപിന്നാലെയുള്ള ‘മരിച്ചവരിൽനിന്നുള്ള ആദ്യജാതൻ’ എന്ന പദസമുച്ചയത്തോട് ‘ആരംഭം’ ഏറ്റവും നേരിട്ട് പൊരുത്തപ്പെടുന്നു; യഥാർഥമായ മറ്റു നിഘണ്ടുസാധ്യതകൾ അടിക്കുറിപ്പിൽ ചേർത്തു.
- issue: πρωτότοκος ἐκ τῶν νεκρῶν എന്ന പ്രയോഗത്തിന്റെ ബലം
  choice: ‘മരിച്ചവരിൽനിന്നുള്ള ആദ്യജാതൻ’ എന്ന പദരൂപം നിലനിർത്തി.
  alternative: ‘മരിച്ചവരിൽനിന്ന് ആദ്യം ഉയിർത്തെഴുന്നേറ്റവൻ’ അല്ലെങ്കിൽ ‘മരിച്ചവരുടെമേൽ ആദ്യജാതൻ’
  rationale: ഈ പ്രയോഗം സൃഷ്ടിത്വമല്ല, പുനരുത്ഥാനത്തിലെ ക്രമവും പ്രഥമസ്ഥാനവും സൂചിപ്പിക്കുന്നു. ‘ആദ്യജാതൻ’ എന്ന രൂപം തിരുവെഴുത്തിലെ പ്രതിധ്വനി നിലനിർത്തുകയും അടുത്ത ഉപവാക്യം സ്ഥാനമഹത്ത്വം വ്യക്തമാക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- issue: ἵνα γένηται എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: ‘അങ്ങനെ ... ആകേണ്ടതിന്’
  alternative: ‘അതുകൊണ്ട് ... ആകുന്നു’ അല്ലെങ്കിൽ ‘... ആയിരിക്കേണ്ടതിന്’
  rationale: സംഭവപരമ്പരയുടെ ഫലവും ദൈവിക ഉദ്ദേശ്യവും തമ്മിലുള്ള ഗ്രീക്ക് വാക്യത്തിന്റെ തുറന്ന നില സംരക്ഷിക്കുകയും γένηται-യിലെ ‘ആകുക’ എന്ന ആശയം ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തല–ശരീരം’, ‘ആദ്യജാതൻ’ എന്നീ മുഖ്യ ബൈബിൾ രൂപങ്ങൾ നിലനിർത്തി; സങ്കീർണമായ വ്യാഖ്യാനാർഥങ്ങൾ മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല. നൽകിയ ഇംഗ്ലീഷ് പാളിയിൽ [a] ‘body’ എന്നതിന് പിന്നാലെയുണ്ടെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് ἀρχήയെക്കുറിച്ചായതിനാൽ, മൂലഭാഷയുമായി യോജിക്കുന്നവിധം മലയാളത്തിൽ [a] ‘ആരംഭം’ എന്നതിന് പിന്നാലെ സ്ഥാപിച്ചു.
