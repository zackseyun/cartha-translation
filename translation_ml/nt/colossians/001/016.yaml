id: COL.1.16
reference: Colossians 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: ml
  text: കാരണം അവനിൽ സകലവും സൃഷ്ടിക്കപ്പെട്ടു[a]—സ്വർഗങ്ങളിലുള്ളവയും ഭൂമിയിലുള്ളവയും[b], ദൃശ്യമായവയും അദൃശ്യമായവയും, സിംഹാസനങ്ങളാകട്ടെ ആധിപത്യങ്ങളാകട്ടെ ഭരണാധികാരികളാകട്ടെ അധികാരങ്ങളാകട്ടെ[c]; സകലവും അവനിലൂടെ അവനുവേണ്ടി[d] സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്തെന്നാൽ അവനിൽ സകലവും സൃഷ്ടിക്കപ്പെട്ടു.’'
    reason: ὅτι എന്ന പദത്തിന്റെ കാരണാർഥം സന്ദർഭത്തിൽ ‘കാരണം’ എന്നും ‘എന്തെന്നാൽ’ എന്നും സ്വാഭാവികമായി നൽകാം.
  - marker: b
    text: 'അഥവാ: ‘സ്വർഗത്തിലും ഭൂമിയിലുമുള്ളവ’; ഗ്രീക്കിൽ ‘സ്വർഗങ്ങൾ’ എന്ന ബഹുവചനമാണ്.'
    reason: ഗ്രീക്കിലെ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ പതിവായ ഏകവചനപ്രയോഗം ഒരു സാധ്യതയാണ്.
  - marker: c
    text: ‘ആധിപത്യങ്ങൾ’ എന്നതിന് ‘കർത്തൃത്വങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പദങ്ങൾ സൃഷ്ടിക്കപ്പെട്ട അധികാരശ്രേണികളെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: κυριότητες എന്നതിന്റെ പദാർഥപരമായ വ്യത്യസ്ത സാധ്യതയും പട്ടികയുടെ നിർവചിക്കപ്പെടാത്ത സ്വഭാവവും വ്യക്തമാക്കുന്നു.
  - marker: d
    text: 'അഥവാ: ‘സകലവും അവനിലൂടെ അവനിലേക്കായി സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു’; ‘അവനുവേണ്ടി’ എന്നത് സൃഷ്ടിയുടെ ലക്ഷ്യം അവനാണെന്ന് പ്രകടിപ്പിക്കുന്നു.'
    reason: εἰς αὐτόν എന്നതിന്റെ ദിശ/ലക്ഷ്യാർഥം കൂടുതൽ രൂപപരമായി നൽകുന്ന മറ്റൊരു പരിഭാഷ സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പുത്രന്റെ പ്രാമുഖ്യത്തിനുള്ള അടിസ്ഥാനമാണ് ഈ വാക്യം നൽകുന്നത്; അതിനാൽ കാരണാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: പിന്നീട് വരുന്ന δι’ αὐτοῦ (‘അവനിലൂടെ’) എന്ന പ്രയോഗത്തിൽനിന്നുള്ള വ്യത്യാസം കാത്തുസൂക്ഷിക്കാൻ ἐν എന്നതിനെ ഉപകരണാർഥത്തിൽ വ്യാഖ്യാനിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: ἐκτίσθη / ἔκτισται
  choice: സൃഷ്ടിക്കപ്പെട്ടു / സൃഷ്ടിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ആദ്യത്തേതിലെ aorist passive-ഉം അവസാനത്തേതിലെ perfect passive-ഉം തമ്മിലുള്ള കാലഭേദം മലയാളത്തിൽ യഥാക്രമം പൂർത്തിയായ സൃഷ്ടിക്രിയയായും നിലനിൽക്കുന്ന ഫലമുള്ള പൂർത്തീകരണമായും സൂചിപ്പിക്കുന്നു.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: സൃഷ്ടിയുടെ സമഗ്രവ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിലുള്ളവ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും പട്ടികയിലെ τὰ πάντα എന്നതിനോട് സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിലുള്ളവ
  rationale: സ്വർഗങ്ങളിലുള്ളവ എന്ന സമാന്തരപ്രയോഗത്തോടൊപ്പം സൃഷ്ടിയുടെ സർവവ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: ദൃശ്യമായവയും അദൃശ്യമായവയും
  rationale: നാമവാചകമായി ഉപയോഗിച്ച വിശേഷണങ്ങളുടെ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: θρόνοι
  choice: സിംഹാസനങ്ങൾ
  rationale: അധികാരസ്ഥാനങ്ങളെയോ അധികാരശ്രേണികളെയോ സൂചിപ്പിക്കാവുന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: κυριότητες
  choice: ആധിപത്യങ്ങൾ
  rationale: കർത്തൃത്വമോ അധീശത്വമോ ഉള്ള ശക്തികളുടെ വിഭാഗം എന്ന ആശയം നൽകുന്നു; അവയുടെ കൃത്യസ്വഭാവം നിർണയിക്കുന്നില്ല.
- source_word: ἀρχαὶ
  choice: ഭരണാധികാരികൾ
  rationale: ഭരണപരമായ അധികാരമുള്ളവരെ സൂചിപ്പിക്കുന്ന ആധുനികവും ഗ്രഹിക്കാവുന്നതുമായ പദം; ἐξουσίαι എന്നതിൽനിന്ന് വേർതിരിക്കുന്നു.
- source_word: ἐξουσίαι
  choice: അധികാരങ്ങൾ
  rationale: അധികാരമുള്ള ശക്തികളെയോ സ്ഥാനങ്ങളെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു; അവ മനുഷ്യരോ ആത്മീയരോ എന്ന് പരിഭാഷയിൽ നിശ്ചയിക്കുന്നില്ല.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: സൃഷ്ടിയുടെ മധ്യസ്ഥൻ/മാർഗം എന്ന ബന്ധം വ്യക്തമാക്കുകയും ἐν αὐτῷ എന്നതിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς αὐτόν
  choice: അവനുവേണ്ടി
  rationale: സൃഷ്ടിയുടെ ലക്ഷ്യം അവനാണെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവനിലേക്കായി’ എന്ന കൂടുതൽ രൂപപരമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν എന്നീ മൂന്നു പ്രയോഗങ്ങളിൽ പുത്രനും സൃഷ്ടിയും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവനിൽ ... അവനിലൂടെ ... അവനുവേണ്ടി’ എന്ന വ്യത്യസ്ത പ്രയോഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘അവനാൽ ... അവനിലൂടെ ... അവനുവേണ്ടി’ അല്ലെങ്കിൽ ‘അവനോടുള്ള ഐക്യത്തിൽ ... അവനിലൂടെ ... അവനിലേക്കായി’.
  rationale: ഗ്രീക്ക് വ്യത്യസ്ത ഉപസർഗങ്ങൾ ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്നു. അവയെ ഒരൊറ്റ ഉപകരണാർഥത്തിലേക്ക് ചുരുക്കാതെ സൃഷ്ടിയുടെ പശ്ചാത്തലം/മണ്ഡലം, മധ്യസ്ഥത, ലക്ഷ്യം എന്നീ പാളികൾ നിലനിർത്തുന്നു.
- issue: ‘സിംഹാസനങ്ങൾ, ആധിപത്യങ്ങൾ, ഭരണാധികാരികൾ, അധികാരങ്ങൾ’ എന്നിവയുടെ സ്വഭാവം
  choice: സൃഷ്ടിക്കപ്പെട്ട അധികാരശ്രേണികളായി പൊതുവായി അവതരിപ്പിച്ചു; അവയുടെ കൃത്യമായ അസ്തിത്വസ്വഭാവം നിർവചിച്ചില്ല.
  alternative: അവയെ വ്യക്തമായി ദൂതഗണങ്ങളായോ ആത്മീയശക്തികളായോ മനുഷ്യരാഷ്ട്രീയ സംവിധാനങ്ങളായോ വിളിക്കുക.
  rationale: ഇവിടെ വാക്യം അവയെ പ്രത്യേകമായി ഒരു വിഭാഗത്തിൽ ഒതുക്കുന്നില്ല; അതിനാൽ പരിഭാഷ മൂലപാഠത്തേക്കാൾ കൂടുതൽ സിദ്ധാന്തപരമായ നിർവചനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സകലവും’, ‘സ്വർഗങ്ങൾ’, ‘ആധിപത്യങ്ങൾ’ എന്നീ പദങ്ങൾ വാക്യത്തിന്റെ ഗൗരവവും മൂലപാഠത്തിന്റെ ഘടനയും നിലനിർത്തുന്നു. പട്ടികയിലെ ആവർത്തിക്കുന്ന εἴτε സ്വാഭാവികമായി ‘-ആകട്ടെ’ എന്ന സമാന്തരരൂപത്തിൽ നൽകിയിരിക്കുന്നു; അർധവിരാമം വാക്യത്തിന്റെ ഏകതയും അവസാന ഉപവാക്യത്തിന്റെ പ്രത്യേക ഊന്നലും സംരക്ഷിക്കുന്നു.
