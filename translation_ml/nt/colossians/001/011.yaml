source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: ml
  text: അവന്റെ മഹത്ത്വത്തിന്റെ പ്രാബല്യത്തിന് അനുസരിച്ച് സകല ശക്തിയാലും ശക്തിപ്പെടുന്നവരായി,[a] എല്ലാ സഹനത്തിനും ദീർഘക്ഷമയ്ക്കുമായി സന്തോഷത്തോടെ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവന്റെ മഹത്തായ പ്രാബല്യത്തിന് അനുസരിച്ച്.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘അവന്റെ മഹത്ത്വത്തിന്റെ പ്രാബല്യത്തിന് അനുസരിച്ച്’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: സകല ശക്തിയാലും ശക്തിപ്പെട്ട്
  rationale: ἐν എന്നത് ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നതായി എടുത്തു; വർത്തമാനകാല കർമണി കൃദന്തമായ δυναμούμενοι തുടർന്നുകൊണ്ടിരിക്കുന്ന ദൈവിക ശക്തിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നു. ‘ശക്തി/ശക്തിപ്പെടുക’ എന്ന പദസാമ്യം ഗ്രീക്കിലെ ആവർത്തനഭാവം നിലനിർത്തുന്നു.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: അവന്റെ മഹത്ത്വത്തിന്റെ പ്രാബല്യത്തിന് അനുസരിച്ച്
  rationale: κατά അളവോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു. κράτος എന്നതിന് ‘പ്രാബല്യം’ നൽകി δύναμις എന്ന മുൻപത്തെ ശക്തിപദത്തിൽനിന്ന് വേർതിരിച്ചു; τῆς δόξης αὐτοῦ എന്ന ഷഷ്ഠീബന്ധം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: എല്ലാ സഹനത്തിനും
  rationale: εἰς ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു; ὑπομονή പ്രതികൂല സാഹചര്യങ്ങളിൽ ഉറച്ചുനിൽക്കുന്ന സഹനത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: μακροθυμίαν
  choice: ദീർഘക്ഷമ
  rationale: ὑπομονήയിൽനിന്ന് വ്യത്യസ്തമായെങ്കിലും ബന്ധപ്പെട്ട ആശയം നിലനിർത്താൻ ‘സഹനം’ എന്നതിനു പകരം ‘ദീർഘക്ഷമ’ ഉപയോഗിച്ചു; ഇത് പ്രകോപനത്തിനിടയിലും ദീർഘമായി ക്ഷമിക്കുന്ന ഭാവം നൽകുന്നു.
- source_word: μετὰ χαρᾶς
  choice: സന്തോഷത്തോടെയിരിക്കട്ടെ
  rationale: χαράയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘സന്തോഷം’ എന്നു നൽകി. ഗ്രീക്കിൽ ഈ പദസമുച്ചയത്തിന്റെ ബന്ധം അടുത്ത വാക്യഭാഗത്തോടാകാമെന്ന സാധ്യത നിലനിൽക്കുന്നതിനാൽ അതിനെ കുറിച്ച് അടിക്കുറിപ്പ് ചേർത്തു.
theological_decisions:
- issue: ദൈവിക ശക്തിപ്പെടുത്തലും ദൈവത്തിന്റെ മഹത്ത്വവും തമ്മിലുള്ള ബന്ധം
  choice: ‘അവന്റെ മഹത്ത്വത്തിന്റെ പ്രാബല്യത്തിന് അനുസരിച്ച്’ എന്ന ഗ്രീക്ക് ഷഷ്ഠീഘടന നിലനിർത്തി.
  alternative: ‘അവന്റെ മഹത്തായ പ്രാബല്യത്തിന് അനുസരിച്ച്’
  rationale: ‘മഹത്ത്വം’ എന്ന നാമത്തെ വിശേഷണമായി മാറ്റുന്നത് വായന സുഗമമാക്കുമെങ്കിലും, ശക്തിയുടെ അളവോ ഉറവിടമോ ഗുണമോ സംബന്ധിച്ച പൗലൊസിന്റെ സാന്ദ്രമായ പ്രയോഗത്തെ മുൻകൂട്ടി തീർപ്പാക്കും.
- issue: μετὰ χαρᾶς എന്നതിന്റെ വാക്യഘടനാപരമായ ബന്ധം
  choice: ഈ വാക്യത്തിൽ സഹനത്തോടും ദീർഘക്ഷമയോടും ചേർത്ത് വായിക്കാവുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തി, എന്നാൽ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: അടുത്ത വാക്യത്തിലെ ‘നന്ദി പറഞ്ഞുകൊണ്ട്’ എന്ന ആശയത്തോട് ചേർത്ത് ‘സന്തോഷത്തോടെ നന്ദി പറഞ്ഞുകൊണ്ട്’ എന്നു വായിക്കുക.
  rationale: പുരാതന ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലെ വിരാമചിഹ്നങ്ങൾ ഈ ബന്ധം നിർണയിക്കുന്നില്ല; ഇരുവായനകളും വ്യാകരണപരമായി സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പൗലൊസിന്റെ ശക്തിസംബന്ധിയായ പദസാന്ദ്രതയും ‘മഹത്ത്വത്തിന്റെ പ്രാബല്യം’ എന്ന അസാധാരണ ഷഷ്ഠീബന്ധവും കഴിയുന്നത്ര നിലനിർത്തി.
