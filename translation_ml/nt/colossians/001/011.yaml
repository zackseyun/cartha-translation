    issue: Added finite exhortation in ‘സന്തോഷത്തോടെയിരിക്കട്ടെ’
    rationale: The Greek has no imperative or optative here; δυναμούμενοι is a present passive participle dependent on the ongoing prayer in the surrounding sentence. The added ‘ഇരിക്കട്ടെ’ changes the clause into an exhortation/prayer-wish and should be removed.
