id: COL.1.22
reference: Colossians 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, അവന്റെ മാംസമുള്ള ശരീരത്തിൽ മരണത്തിലൂടെ നിങ്ങൾ അനുരഞ്ജിപ്പിക്കപ്പെട്ടിരിക്കുന്നു[a], നിങ്ങളെ അവന്റെ സന്നിധിയിൽ വിശുദ്ധരും കുറ്റമറ്റവരും[b] കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവരുമായി നിർത്തുന്നതിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങൾ അനുരഞ്ജിപ്പിക്കപ്പെട്ടിരിക്കുന്നു.’ ഗ്രീക്കിലെ ക്രിയ കർമണിപ്രയോഗത്തിലാണ്.
    reason: alternative_reading
  - marker: b
    text: ‘കുറ്റമറ്റവർ’ എന്നതിന് ‘കളങ്കമില്ലാത്തവർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കുപദത്തിലെ യാഗസംബന്ധമായ നിഴലർഥം ഇതിൽ കൂടുതൽ പ്രകടമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻ അവസ്ഥയും ഇപ്പോഴത്തെ അനുരഞ്ജിതാവസ്ഥയും തമ്മിലുള്ള കാലപരവും വിരുദ്ധതാസൂചകവുമായ മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποκατηλλάγητε
  choice: അവൻ നിങ്ങളെ തന്നോടു അനുരഞ്ജിപ്പിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ക്രിയാരൂപം കർമണിപ്രയോഗമാണെങ്കിലും, സന്ദർഭത്തിൽ സൂചിതമായ ദൈവിക കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നത് വായനാസൗകര്യം നൽകുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും ‘അനുരഞ്ജിപ്പിച്ചിരിക്കുന്നു’ നിലനിർത്തുന്നു. ‘തന്നോടു’ എന്നത് അനുരഞ്ജനത്തിന്റെ ബന്ധപരമായ ദിശ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: തന്റെ മാംസശരീരത്തിൽ
  rationale: യഥാർഥമായ ദേഹധാരണയെ ഊന്നുന്ന ‘ശരീരം’–‘മാംസം’ സംയോജനം നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ എന്ന അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: διὰ τοῦ θανάτου
  choice: മരണത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം/ഉപാധി സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നൽകുന്നു; മൂലത്തിൽ വ്യക്തമാക്കാത്ത സർവനാമം ചേർക്കുന്നില്ല.
- source_word: παραστῆσαι
  choice: സന്നിധിയിൽ നിർത്തേണ്ടതിന്
  rationale: ലക്ഷ്യസൂചകമായ infinitive-ന്റെ ശക്തിയും ഒരാളുടെ മുമ്പിൽ ഹാജരാക്കുക/നിർത്തുക എന്ന ദൃശ്യവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἁγίους
  choice: വിശുദ്ധർ
  rationale: വേർതിരിക്കപ്പെട്ടതും ധാർമികശുദ്ധിയുമെന്ന വ്യാപ്തി നിലനിർത്തുന്ന സ്ഥാപിതവും മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ἀμώμους
  choice: കുറ്റമറ്റവർ
  rationale: സന്ദർഭത്തിൽ വ്യക്തികളെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളം; യാഗസംബന്ധമായ ‘കളങ്കമില്ലാത്ത’ എന്ന നിഴലർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀνεγκλήτους
  choice: കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവർ
  rationale: കുറ്റം ചുമത്താൻ അടിസ്ഥാനമില്ലാത്ത അവസ്ഥ എന്ന ന്യായവ്യവഹാരപരമായ നിഴലർഥം വ്യക്തമാക്കുകയും ἀμώμους-ൽ നിന്ന് വ്യത്യസ്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κατενώπιον αὐτοῦ
  choice: തന്റെ സന്നിധിയിൽ
  rationale: മൂലത്തിലെ സർവനാമത്തിന്റെ സൂചന തുറന്നുവെച്ചുകൊണ്ട് സാന്നിധ്യവും വിലയിരുത്തലിന്റെ പശ്ചാത്തലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀποκατηλλάγητε എന്ന കർമണിപ്രയോഗത്തിലെ കർത്തൃത്വം
  choice: പ്രധാനവാചകത്തിൽ സന്ദർഭത്തിൽ സൂചിതമായ ‘അവൻ’ ചേർത്ത് സജീവപ്രയോഗമായി നൽകുക
  alternative: ‘നിങ്ങൾ അനുരഞ്ജിപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന് കർമണിപ്രയോഗം അതേപടി നിലനിർത്തുക
  rationale: മലയാളത്തിൽ സജീവപ്രയോഗം കൂടുതൽ സ്വാഭാവികമാണ്; അനുരഞ്ജനം ദൈവിക മുൻകൈയാൽ സംഭവിച്ചതെന്ന അർഥം നിലനിൽക്കുന്നു. എങ്കിലും ഗ്രീക്കിന്റെ കർമണിരൂപം അടിക്കുറിപ്പിൽ തുറന്നുപറഞ്ഞ് അതിന്റെ ഔപചാരിക അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: σάρξ എന്നതിന്റെ അർഥം
  choice: ഭൗതികമായ ‘മാംസം’
  alternative: ‘പാപസ്വഭാവം’
  rationale: മരണവുമായി ചേർന്ന ‘മാംസശരീരം’ മശിഹായുടെ യഥാർഥ ദേഹധാരണയെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ധാർമികമായി ദുഷിച്ച സ്വഭാവം ഉദ്ദേശിക്കുന്നതിന് സന്ദർഭാധാരം ഇല്ല.
- issue: ἀμώμους, ἀνεγκλήτους എന്നീ പദങ്ങളുടെ വ്യത്യാസം
  choice: ‘കുറ്റമറ്റവർ’, ‘കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവർ’ എന്നിങ്ങനെ വേർതിരിക്കുക
  alternative: ‘കളങ്കമില്ലാത്തവർ, നിന്ദയ്ക്ക് അതീതർ’
  rationale: ആദ്യപദത്തിന്റെ ധാർമിക/യാഗസംബന്ധമായ അർഥവ്യാപ്തിയും രണ്ടാമത്തേതിന്റെ ന്യായവ്യവഹാരപരമായ ശക്തിയും ഒരേപോലുള്ള രണ്ടു പദങ്ങളാക്കി നിരപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
- issue: κατενώπιον αὐτοῦ-ലെ αὐτοῦ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ‘തന്റെ സന്നിധിയിൽ’ എന്ന് സർവനാമം നിലനിർത്തുക
  alternative: ‘ദൈവത്തിന്റെ സന്നിധിയിൽ’ അല്ലെങ്കിൽ ‘ക്രിസ്തുവിന്റെ സന്നിധിയിൽ’ എന്ന് വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യം പേരുപറഞ്ഞ് സൂചന തീർപ്പാക്കുന്നില്ല; അതിനാൽ ദൈവമോ ക്രിസ്തുവോ എന്ന് വിവർത്തനം തന്നെ തീരുമാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അനുരഞ്ജിപ്പിക്കുക’ എന്ന കൃത്യമായെങ്കിലും അല്പം ഔപചാരികമായ പദം ബന്ധപുനഃസ്ഥാപനത്തിന്റെ അർഥം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; ‘തന്നോടു’ അതിന്റെ അർഥം വ്യക്തമാക്കുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി, ലക്ഷ്യബന്ധം ‘ഇത്’ വഴി നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
