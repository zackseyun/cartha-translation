id: COL.1.27
reference: Colossians 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: ml
  text: അവർക്കു യഹൂദേതരരുടെ ഇടയിൽ ഈ രഹസ്യത്തിന്റെ മഹത്ത്വസമ്പത്ത് എന്താണെന്ന് അറിയിച്ചുകൊടുക്കാൻ ദൈവം ഇച്ഛിച്ചു. ആ രഹസ്യം നിങ്ങളിലുള്ള[a] മശീഹായാണ്—മഹത്ത്വത്തിന്റെ പ്രത്യാശ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ ഇടയിലുള്ള മശീഹാ.” ഗ്രീക്ക് പ്രയോഗം മശീഹാ വിശ്വാസികളിൽ വസിക്കുന്നതിനെയോ അവരുടെ സമൂഹത്തിനിടയിൽ സന്നിഹിതനായിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: തന്റെ വിശുദ്ധർക്ക്
  rationale: ബന്ധസർവനാമം മുൻവാക്യത്തിലെ ‘വിശുദ്ധരെ’ സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യം മാത്രമായി വായിക്കുമ്പോഴും ബന്ധം വ്യക്തമാകാൻ സൂചിത നാമം ചേർത്തു.
- source_word: ἠθέλησεν
  choice: ഇച്ഛിച്ചു
  rationale: ദൈവത്തിന്റെ ഉദ്ദേശപൂർവമായ ഇച്ഛയെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘തീരുമാനിച്ചു’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രിയയുടെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: γνωρίσαι
  choice: അറിയിച്ചുകൊടുക്കാൻ
  rationale: γνωρίζω എന്നതിന്റെ ‘അറിയിക്കുക, അറിയിച്ചുകൊടുക്കുക’ എന്ന നേരിട്ടുള്ള അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου
  choice: ഈ രഹസ്യത്തിന്റെ മഹത്ത്വസമ്പത്ത് എന്താണെന്ന്
  rationale: ഗ്രീക്കിലെ സാന്ദ്രമായ ഘടനയെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിക്കുമ്പോഴും ‘മഹത്ത്വം’, ‘സമ്പത്ത്’, ‘രഹസ്യം’ എന്നീ ആശയങ്ങൾ നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ἔθνη യഹൂദേതരരെ സൂചിപ്പിക്കുന്നു. ‘ജനതകൾ’ എന്നതിലുണ്ടാകാവുന്ന പൊതുവായ രാഷ്ട്രീയ അർത്ഥം ഒഴിവാക്കുന്നു.
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ അറിയിക്കപ്പെട്ടതുമായ ദൈവിക ഉദ്ദേശത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്ഥാപിത പദം.
- source_word: Χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമംപോലെയല്ല, രഹസ്യത്തിന്റെ ഉള്ളടക്കം തിരിച്ചറിയിക്കുന്ന സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിലുള്ള
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള ‘നിങ്ങളിൽ’ എന്ന അർത്ഥം നിലനിർത്തുന്നു. സമൂഹത്തിന്റെ ഇടയിലെ സാന്നിധ്യം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: മഹത്ത്വത്തിന്റെ പ്രത്യാശ
  rationale: സാന്ദ്രമായ ഗ്രീക്ക് സമാസബന്ധം വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ അവതരണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വിശദീകരണവാക്യത്തിൽ പദത്തിന് സ്ഥാനപ്പേരായുള്ള ശക്തിയുള്ളതിനാൽ ‘മശീഹാ’ തിരഞ്ഞെടുത്തു.
- issue: ἐν ὑμῖν എന്നതിന്റെ അർത്ഥം
  choice: നിങ്ങളിലുള്ള
  alternative: നിങ്ങളുടെ ഇടയിലുള്ള
  rationale: വിശ്വാസികളിലെ ആന്തരിക സാന്നിധ്യവും അവരുടെ സമൂഹത്തിനിടയിലെ സാന്നിധ്യവും ഗ്രീക്ക് അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള രൂപവും അടിക്കുറിപ്പിൽ സമൂഹപരമായ സാധ്യതയും നൽകിയിരിക്കുന്നു.
- issue: ὅ ἐστιν എന്ന ബന്ധവാക്യത്തിന്റെ സൂചന
  choice: ആ രഹസ്യം ... ആണ്
  alternative: അത് ... ആണ്
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമത്തിന് ‘രഹസ്യം’ എന്നതാണ് സ്വാഭാവികമായ സൂചന. മലയാളത്തിൽ ബന്ധം വ്യക്തമായി പറയുന്നത് ആശയക്കുഴപ്പം കുറയ്ക്കുന്നു; മശീഹാ രഹസ്യത്തിന്റെ ഉള്ളടക്കമാണെന്ന തിരിച്ചറിയൽ നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരവാർന്നതുമായ ശൈലി. അമിതമായി സഭാപരമായ പദപ്രയോഗം ഒഴിവാക്കി; മൂലപാഠത്തിലെ സാന്ദ്രതയും ἐν ὑμῖν എന്നതിലെ അർത്ഥദ്വയവും സംരക്ഷിച്ചു.
