id: COL.1.6
reference: Colossians 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: ml
  text: അത് നിങ്ങളിലേക്കു വന്നെത്തിയിരിക്കുന്നു[a]. ലോകമെങ്ങും[b] അത് ഫലം കായ്ക്കുകയും വളരുകയും ചെയ്യുന്നതുപോലെ, നിങ്ങൾ അതു കേൾക്കുകയും ദൈവത്തിന്റെ കൃപയെ സത്യത്തിൽ[d] അറിയുകയും ചെയ്ത ദിവസംമുതൽ നിങ്ങളുടെ ഇടയിലും[c] അത് ഫലം കായ്ക്കുകയും വളരുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അത് നിങ്ങളുടെ അടുക്കൽ സന്നിഹിതമായിരിക്കുന്നു’ എന്നും ‘അത് നിങ്ങളുടെ ഇടയിൽ എത്തിയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ലോകം മുഴുവനിലും.’
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘നിങ്ങളിലും.’ ഗ്രീക്ക് പ്രയോഗം സമൂഹമെന്ന നിലയിൽ അവരുടെ ഇടയിലെ പ്രവർത്തനത്തെയോ അവരുടെ ഉള്ളിലെ സുവിശേഷപ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: അല്ലെങ്കിൽ ‘സത്യമായി’ എന്നും ‘സത്യത്തിന്റെ മണ്ഡലത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: അത് നിങ്ങളിലേക്കു വന്നെത്തിയിരിക്കുന്നു
  rationale: മുൻവാക്യത്തിലെ ‘സുവിശേഷം’ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന കർത്തൃപ്രയോഗമാണിത്. πάρειμι ഇവിടെ എത്തിച്ചേരലിനെയും ഇപ്പോഴുള്ള സാന്നിധ്യത്തെയും സൂചിപ്പിക്കാം; ‘വന്നെത്തിയിരിക്കുന്നു’ ഈ രണ്ടു ഭാവങ്ങളും സ്വാഭാവികമായി കൂട്ടിയിണക്കുന്നു.
- source_word: καθὼς καὶ
  choice: അതുപോലെ … അങ്ങനെതന്നെ
  rationale: കൊലൊസ്സ്യരുടെ അനുഭവത്തെയും സുവിശേഷത്തിന്റെ ലോകവ്യാപക പ്രവർത്തനത്തെയും ബന്ധിപ്പിക്കുന്ന ആവർത്തിത താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: ലോകമെങ്ങും
  rationale: സുവിശേഷത്തിന്റെ വ്യാപകമായ പ്രചാരം ഊന്നുന്ന പ്രയോഗം. ഭൂമിയിലെ ഓരോ വ്യക്തിയെയും പ്രദേശത്തെയും കർശനമായി ഉൾക്കൊള്ളുന്നു എന്ന വ്യാഖ്യാനം ചേർക്കാതെ ഗ്രീക്കിലെ വിപുലമായ ഭാഷ നിലനിർത്തുന്നു.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: ഫലം കായ്ക്കുകയും വളരുകയും ചെയ്തുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തെ തുടർച്ചയായ പ്രവർത്തനവും കൃഷിസംബന്ധമായ രൂപകവും ഒരുപോലെ സൂക്ഷിക്കുന്നു.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിലും അങ്ങനെതന്നെ
  rationale: സഭാസമൂഹത്തിനിടയിലെ സുവിശേഷപ്രവർത്തനമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്. അതേസമയം ‘നിങ്ങളിൽ’ എന്ന ആന്തരിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀφ’ ἧς ἡμέρας
  choice: ചെയ്ത ദിവസംമുതൽ
  rationale: കൊലൊസ്സ്യർക്കിടയിൽ സുവിശേഷത്തിന്റെ ഫലപ്രദമായ പ്രവർത്തനം ആരംഭിച്ച കാലബിന്ദു വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἠκούσατε
  choice: നിങ്ങൾ അതു കേൾക്കുകയും
  rationale: ആദ്യമായി കേട്ട സംഭവത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗം; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘ആദ്യമായി’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: ἐπέγνωτε
  choice: അറിയുകയും
  rationale: യഥാർഥമായ തിരിച്ചറിവിലേക്കു വന്നതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ ‘പൂർണമായി ഗ്രഹിച്ചു’ എന്ന അതിശക്തമായ അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കൃപയെ
  rationale: പൗലൊസിന്റെ കേന്ദ്രപ്രയോഗം വ്യക്തവും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമായ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: ‘സത്യമായി’ എന്ന രീതിഭാവത്തിനും ‘സത്യത്തിന്റെ മണ്ഡലത്തിൽ/സത്യത്തിൽ’ എന്ന അർഥത്തിനും ഇടയിലുള്ള ഗ്രീക്ക് അവ്യക്തത പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ലോകമെങ്ങും’ എന്നതിന്റെ വ്യാപ്തി
  choice: സുവിശേഷത്തിന്റെ വ്യാപകമായ ലോകപ്രചാരത്തെക്കുറിച്ചുള്ള വിപുലമായ പ്രയോഗമായി വിവർത്തനം ചെയ്തു.
  alternative: അന്നുതന്നെ ഭൂമിയിലെ ഓരോ വ്യക്തിയിലേക്കും ഓരോ പ്രദേശത്തേക്കും സുവിശേഷം എത്തിയെന്ന കർശനമായ സാർവത്രിക അവകാശവാദം.
  rationale: ഗ്രീക്കിലെ സാർവത്രിക ഭാഷ മാറ്റാതെ സൂക്ഷിച്ചെങ്കിലും അതിന്റെ ഭൂമിശാസ്ത്രവ്യാപ്തിയെ വിശദീകരിക്കുന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ἐν ἀληθείᾳ എന്നതിന്റെ ഭാവം
  choice: ‘സത്യത്തിൽ’ എന്ന് നൽകി അർഥവ്യാപ്തി നിലനിർത്തി.
  alternative: ‘സത്യമായി’ അല്ലെങ്കിൽ ‘സത്യത്തിനുള്ളിൽ’.
  rationale: ഈ പ്രയോഗം രീതിയെയോ സത്യത്തിന്റെ മണ്ഡലത്തെയോ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം; അതിനാൽ ഒരു അർഥം മാത്രം തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മത ഇല്ലാതാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. വാക്യത്തിന്റെ ദൈർഘ്യം കൈകാര്യം ചെയ്യാൻ ഗ്രീക്കിലെ തുടർച്ചയായ ഘടന രണ്ട് മലയാളവാക്യങ്ങളാക്കി; എങ്കിലും താരതമ്യബന്ധവും തുടർച്ചയായ പ്രവർത്തനവും നിലനിർത്തി. ‘ഫലം കായ്ക്കുക’ എന്ന രൂപകം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായതിനാൽ അതേപടി സൂക്ഷിച്ചു.
