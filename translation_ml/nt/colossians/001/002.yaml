id: COL.1.2
reference: Colossians 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: ml
  text: 'കൊലൊസ്സ്യയിലെ വിശുദ്ധരും മശീഹയിൽ വിശ്വസ്തരുമായ സഹോദരന്മാർക്ക്[b][c]: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്ന് നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശ്വസിക്കുന്നവരുമായ’; ഗ്രീക്ക് πιστοῖς എന്ന പദത്തിന് ‘വിശ്വസിക്കുന്നവർ’ എന്നോ ‘വിശ്വസ്തർ’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ പദം അക്ഷരാർഥത്തിൽ ‘സഹോദരന്മാർ’ എന്നാണ്; എന്നാൽ സന്ദർഭത്തിൽ പൗലോസ് സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഭാസമൂഹത്തെ മുഴുവൻ അഭിസംബോധന ചെയ്തിരിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘ക്രിസ്തുവിൽ.’ Χριστός എന്ന ഗ്രീക്ക് പദവിക്ക് ‘മശീഹ’ എന്നാണ് അർഥം.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: കൊലൊസ്സ്യയിൽ ... ഉള്ളവർക്ക് / സഹോദരന്മാർക്ക്
  rationale: ἐν ചേർന്ന സ്ഥലനാമം സ്വീകർത്താക്കളുടെ സ്ഥലം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്ഥലവിഭക്തിയായ ‘കൊലൊസ്സ്യയിൽ’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു; വാക്യഘടനയിൽ ‘ഉള്ള’ എന്ന ആശയം വിശേഷണസമുച്ചയത്തിലൂടെ പ്രകടമാകുന്നു.
- source_word: ἁγίοις
  choice: വിശുദ്ധരും
  rationale: ഇവിടെ ἅγιος, ἀδελφοῖς എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്നു. ‘വിശുദ്ധർ’ എന്ന നാമരൂപത്തേക്കാൾ ‘വിശുദ്ധരായ’ എന്ന വിശേഷണാർഥം മൂലവാക്യത്തിന്റെ ഘടനയും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടവർ എന്ന അടിസ്ഥാനഭാവവും നിലനിർത്തുന്നു.
- source_word: πιστοῖς
  choice: വിശ്വസ്തരുമായ
  rationale: πιστός എന്നതിന് ‘വിശ്വസ്തർ’ എന്നും ‘വിശ്വസിക്കുന്നവർ’ എന്നും അർഥമാകാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘വിശ്വസ്തർ’ സ്വീകരിച്ചെങ്കിലും മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοῖς
  choice: സഹോദരന്മാർക്ക്
  rationale: ഗ്രീക്കിൽ പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. അതിനാൽ ഉറവിടരൂപം മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; സമൂഹത്തിലെ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാമെന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ ഒരു പദവിയാണ്; അതിന്റെ പദവിയർഥം നിലനിർത്താൻ ‘മശീഹ’ ഉപയോഗിക്കുന്നു. ἐν എന്നത് പൗലോസിന്റെ ‘മശീഹയിൽ’ എന്ന ബന്ധഭാഷ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ
  rationale: ഗ്രീക്ക് അഭിവാദനസൂത്രത്തിന്റെ ക്രമവും അർഥവും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ ആശംസയായി ‘ഉണ്ടാകട്ടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്ന്
  rationale: 'πατρὸς ἡμῶν എന്നത് θεοῦ-നെ വിശദീകരിക്കുന്ന സമാനാധികരണ പ്രയോഗമായി എടുത്തിരിക്കുന്നു: ‘നമ്മുടെ പിതാവായ ദൈവം.’ ഗ്രീക്കിൽ ഇല്ലാത്ത ഒരു സംയോജകം ചേർക്കുന്നില്ല.'
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστός എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. മലയാളത്തിൽ പരമ്പരാഗതമായി പരിചിതമായ ‘ക്രിസ്തുവിൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἀδελφοῖς എന്ന പുല്ലിംഗ ബഹുവചനത്തിന്റെ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹോദരങ്ങൾ
  rationale: മുഖ്യപാഠം ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണലിംഗം നിലനിർത്തുന്നു. എന്നാൽ പൗലോസ് സഭാസമൂഹത്തെ മുഴുവനായി, സ്ത്രീകളെയും ഉൾപ്പെടുത്തി, അഭിസംബോധന ചെയ്തിരിക്കാനാണ് സാധ്യത; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: πιστοῖς എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വസ്തർ
  alternative: വിശ്വസിക്കുന്നവർ
  rationale: പദം വിശ്വാസത്തെയും വിശ്വസ്തതയെയും സൂചിപ്പിക്കാം; ഈ വാക്യം രണ്ടിനുമിടയിൽ നിർബന്ധിതമായൊരു തീർപ്പ് നൽകുന്നില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ ‘വിശ്വസ്തർ’ സ്വീകരിച്ച് മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ലേഖന-അഭിവാദനശൈലി സ്വീകരിച്ചു. ‘ഉണ്ടാകട്ടെ’ എന്നത് ഗ്രീക്കിലെ സംക്ഷിപ്ത അഭിവാദനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ആശംസയാക്കുന്നു. ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വങ്ങൾ മുഖ്യപാഠത്തിൽ അമിതമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
