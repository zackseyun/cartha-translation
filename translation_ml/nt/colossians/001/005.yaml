  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: ml
  text: നിങ്ങൾക്കായി സ്വർഗങ്ങളിൽ[a] കരുതിവെച്ചിരിക്കുന്ന പ്രത്യാശ നിമിത്തം—ആ പ്രത്യാശയെക്കുറിച്ച് നിങ്ങൾ മുമ്പേ[b] സത്യത്തിന്റെ വചനമായ[c] സുവിശേഷത്തിൽ കേട്ടിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വർഗത്തിൽ.’ ഗ്രീക്കിൽ ‘സ്വർഗങ്ങളിൽ’ എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘മുമ്പ് കേട്ടിരുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. προακούω എന്ന ഗ്രീക്കുപദം മുമ്പുണ്ടായ കേൾവിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘സത്യത്തിന്റെ വചനം’ എന്നത് ‘സത്യത്തിന്റെ സന്ദേശം’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘സുവിശേഷം’ ആ വചനം അഥവാ സന്ദേശം എന്താണെന്ന് തിരിച്ചറിയിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: പ്രത്യാശ നിമിത്തമാണ് ഇത്
  rationale: διά + കർമവിഭക്തി ഇവിടെ കാരണം അഥവാ അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധമുള്ളതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണ്ണവാക്യമാക്കാൻ ‘ഇത്’ ചേർത്തു; അത് പുതിയ ആശയം കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ἀποκειμένην ὑμῖν
  choice: നിങ്ങൾക്കായി കരുതിവെച്ചിരിക്കുന്ന
  rationale: ἀπόκειμαι എന്നത് ഭാവിക്കായി സൂക്ഷിക്കപ്പെട്ടതോ കരുതിവെക്കപ്പെട്ടതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു. ‘നിങ്ങൾക്കായി’ എന്നത് ὑμῖν-ന്റെ പ്രയോജനാർഥക ദത്തിവിനെ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു; മലയാളത്തിലും ഇത് വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἣν προηκούσατε
  choice: ആ പ്രത്യാശയെക്കുറിച്ച് നിങ്ങൾ മുമ്പേ കേട്ടിരുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ἣν നേരിട്ട് ἐλπίδα എന്ന ‘പ്രത്യാശ’യെ സൂചിപ്പിക്കുന്നു. προακούω-യിലെ മുൻകാല കേൾവിയുടെ ഭാവം ‘മുമ്പേ’ നൽകുന്നു; അമൂർത്തമായ പ്രത്യാശയെ സംബന്ധിച്ച് മലയാളത്തിൽ ‘കുറിച്ച് കേൾക്കുക’ സ്വാഭാവികമാണ്.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: സത്യത്തിന്റെ വചനത്തിൽ
  rationale: λόγος എന്നതിന്റെ ‘വചനം’ എന്ന രൂപം മൂലപദത്തിന്റെ രൂപകവും സ്ഥാപിതമായ ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു; പിന്നാലെയുള്ള ‘സുവിശേഷം’ അതിന്റെ അർഥം തിരിച്ചറിയിക്കുന്നു.
- source_word: τοῦ εὐαγγελίου
  choice: അതായത്, സുവിശേഷത്തിൽ
  rationale: τοῦ εὐαγγελίου എന്നത് ‘സത്യത്തിന്റെ വചനം’ എന്താണെന്ന് സമാനാധികരണമായി തിരിച്ചറിയിക്കുന്നു. മലയാളത്തിൽ ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി കാണിക്കാൻ ‘അതായത്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ബന്ധവാക്യത്തിന്റെ പൂർവപദം
  choice: ‘ആ പ്രത്യാശയെക്കുറിച്ച്’ എന്ന് വ്യക്തമാക്കി ബന്ധവാക്യം ‘പ്രത്യാശ’യോടു ചേർത്തു.
  alternative: ബന്ധവാക്യം പൊതുവായി മുഴുവൻ സുവിശേഷസന്ദേശത്തെയും സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുക.
  rationale: ἣν എന്ന സ്ത്രീലിംഗ ഏകവചന ബന്ധസർവനാമം ἐλπίδα എന്ന പദവുമായി നേരിട്ട് പൊരുത്തപ്പെടുന്നു. അതിനാൽ കൊലൊസ്സ്യർ മുമ്പേ കേട്ടത് ഈ പ്രത്യാശയെക്കുറിച്ചാണെന്ന മൂലവാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തി.
- issue: οὐρανοῖς എന്നതിന്റെ വചനം
  choice: ബഹുവചനമായ ‘സ്വർഗങ്ങളിൽ’ ഉപയോഗിച്ചു.
  alternative: മലയാളത്തിൽ കൂടുതൽ പതിവുള്ള ഏകവചനമായ ‘സ്വർഗത്തിൽ’ ഉപയോഗിക്കുക.
  rationale: മൂലഗ്രീക്കിലെ ബഹുവചനം അനാവശ്യമായി ഏകവചനമാക്കാതെ നിലനിർത്തുന്നു; വ്യത്യാസം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ‘സത്യത്തിന്റെ വചനം’യും ‘സുവിശേഷം’യും തമ്മിലുള്ള ബന്ധം
  choice: ‘അതായത്’ ഉപയോഗിച്ച് ‘സുവിശേഷം’ സമാനാധികരണ തിരിച്ചറിയലാണെന്ന് വ്യക്തമാക്കി.
  alternative: ‘സത്യത്തിന്റെ വചനമായ സുവിശേഷത്തിൽ’ എന്ന് വിശേഷണബന്ധമായി ചേർക്കുക.
  rationale: ഗ്രീക്കിൽ τοῦ εὐαγγελίου മുൻപുള്ള ‘സത്യത്തിന്റെ വചനം’ എന്ന പദസമുച്ചയത്തെ തിരിച്ചറിയുന്ന സമാനാധികരണ ജനിറ്റീവായി സ്വാഭാവികമായി വായിക്കാം. പുതിയ വ്യാഖ്യാനഭാരം ചേർക്കാതെ ഈ ബന്ധം മലയാളത്തിൽ തെളിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. മൂലവാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ സ്വതന്ത്ര വാക്യമായി വായിക്കാനാവാൻ ‘ഇത്’ ചേർത്തു. ‘കരുതിവെച്ചിരിക്കുന്ന’ എന്നത് രൂപകവും ഭാവിയിലെ ഉറപ്പും നിലനിർത്തുമ്പോൾ ‘സംഭരിച്ചുവെച്ചിരിക്കുന്ന’ എന്നതിനെക്കാൾ വ്യക്തിപരവും സ്വാഭാവികവുമാണ്.
