translation:
  language: ml
  text: യുഗങ്ങൾ മുതലും തലമുറകൾ മുതലും മറച്ചുവെക്കപ്പെട്ടിരുന്ന രഹസ്യം[a]—എന്നാൽ ഇപ്പോൾ അത് തന്റെ വിശുദ്ധജനങ്ങൾക്ക്[b] വെളിപ്പെടുത്തപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മർമ്മം.’ പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് സാധാരണയായി മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ ദൈവം വെളിപ്പെടുത്തിയതുമായ ഒരു ദൈവിക ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘തന്റെ വിശുദ്ധർക്ക്’ അല്ലെങ്കിൽ ‘തന്റെ വിശുദ്ധന്മാർക്ക്.’ ഇവിടെ ഇത് ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട അവന്റെ ജനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: ഒരിക്കൽ മറഞ്ഞിരുന്നതും ഇപ്പോൾ ദൈവം വെളിപ്പെടുത്തിയതുമായ ദൈവിക ഉദ്ദേശ്യം എന്ന പൗലോസിന്റെ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു. ‘മർമ്മം’ സാധ്യമായ പകരമാണ്.
- source_word: ἀποκεκρυμμένον
  choice: മറച്ചുവെക്കപ്പെട്ടിരുന്ന
  rationale: മുൻകാലത്തെ മറച്ചുവെക്കലിന്റെ ഫലമായി തുടർന്നിരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν αἰώνων
  choice: യുഗങ്ങളിൽനിന്നും
  rationale: ἀπό എന്നതിന്റെ ‘നിന്ന്’ എന്ന ബലവും αἰῶνες എന്നതിന്റെ കാലഘട്ടങ്ങൾ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: തലമുറകളിൽനിന്നും
  rationale: മുൻപുള്ള ‘യുഗങ്ങളിൽനിന്നും’ എന്ന പ്രയോഗത്തോടുള്ള ഗ്രീക്ക് സമാന്തരഘടന നിലനിർത്തുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘എല്ലാ’ എന്ന ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻകാല മറച്ചുവെക്കലും ഇപ്പോഴത്തെ വെളിപ്പെടുത്തലും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐφανερώθη
  choice: വെളിപ്പെടുത്തപ്പെട്ടു
  rationale: അയോറിസ്റ്റ് നിഷ്ക്രിയക്രിയയെ അനാവശ്യമായ കാലപരമായ വിശദീകരണം ചേർക്കാതെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: അവന്റെ വിശുദ്ധർക്ക്
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവുപയോഗം സംരക്ഷിക്കുന്നു; αὐτοῦ എന്ന സർവനാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ വിശുദ്ധർ’ എന്നതിന്റെ സൂചിതർഥവും വ്യാപ്തിയും
  choice: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളുടെ സമൂഹം
  alternative: പിന്നീടുള്ള സഭാപാരമ്പര്യത്തിൽ ഔദ്യോഗികമായി വിശുദ്ധരായി അംഗീകരിക്കപ്പെട്ട ഒരു പരിമിത വിഭാഗം; അല്ലെങ്കിൽ ‘അവന്റെ വിശുദ്ധജനങ്ങൾ’
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἅγιοι സാധാരണയായി വിശ്വാസികളെ സമൂഹമായി സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധർ’ എന്ന പദം മൂലപാഠത്തിന്റെ സഭാപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പ് അതിനെ ഒരു ഉന്നതവർഗത്തിലേക്ക് ചുരുക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരഘടനയും മറച്ചുവെക്കലിൽനിന്ന് വെളിപ്പെടുത്തലിലേക്കുള്ള വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു; സഭാപരമായ സാങ്കേതികത സാധാരണ വായനക്കാർക്ക് തെറ്റിദ്ധാരണയുണ്ടാക്കാതിരിക്കാൻ അടിക്കുറിപ്പുകൾ നൽകിയിരിക്കുന്നു.
