id: COL.1.3
reference: Colossians 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുമ്പോൾ, നമ്മുടെ കർത്താവായ യേശു മശിഹായുടെ[a] പിതാവായ ദൈവത്തിനു ഞങ്ങൾ എപ്പോഴും നന്ദി പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, പരമ്പരാഗതമായി, “യേശുക്രിസ്തുവിന്റെ.”
    reason: Χριστός എന്നതിന്റെ പരമ്പരാഗത മലയാളരൂപമായ ‘ക്രിസ്തു’ എന്ന മറ്റൊരു വായന അറിയിക്കുന്നു.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: ഞങ്ങൾ നന്ദി പറയുന്നു
  rationale: ദൈവത്തോടുള്ള കൃതജ്ഞത പ്രകടിപ്പിക്കുന്ന ലേഖനശൈലിയിലെ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ θεῷ πατρὶ
  choice: പിതാവായ ദൈവത്തിനു
  rationale: രണ്ട് ദത്തിവുകളും സമാനാധികരണബന്ധത്തിലാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന പദത്തിന്റെ അംഗീകൃതമായ സ്ഥാനപ്പേരും ഉടമസ്ഥബന്ധവും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശിഹാ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരെന്ന നിലയിൽ ഗ്രഹിക്കാവുന്നതിനാൽ അതിന്റെ അർഥം ‘മശിഹാ’ എന്നു തുറന്നുകാട്ടുന്നു; മലയാളത്തിലെ സ്വാഭാവിക സ്ഥാനപ്പേര്–പേര് ക്രമം ഉപയോഗിക്കുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: പ്രധാന ക്രിയയായ നന്ദിപറച്ചിലിനെ വിശേഷിപ്പിക്കുന്ന സാധാരണ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പ്രാർഥനയുടെ പശ്ചാത്തലത്തിൽ περί + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥപ്രാർഥനയുടെ ലക്ഷ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: προσευχόμενοι
  choice: പ്രാർഥിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം പ്രധാന ക്രിയയോടു സമകാലികമായ സാഹചര്യം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ നന്ദിപ്രകടനഭാഗത്ത് Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός എന്നതിന്റെ സ്ഥാനപ്പേരായ അർഥം ഇപ്പോഴും സുതാര്യമാണ്. ‘മശിഹാ’ എന്നത് ആ അർഥം വ്യക്തമാക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: πάντοτε ഏതു ക്രിയയോടാണ് പ്രധാനമായി ചേരുന്നത്
  choice: നന്ദി പറയുന്നു എന്ന പ്രധാന ക്രിയയോട് ചേർത്ത് ‘എപ്പോഴും’
  alternative: ‘എപ്പോഴും പ്രാർഥിക്കുമ്പോൾ’
  rationale: വാക്യക്രമവും മുഖ്യക്രിയയുടെ പ്രാധാന്യവും കണക്കിലെടുത്ത് πάντοτε നന്ദിപറച്ചിലിനെ വിശേഷിപ്പിക്കുന്നതായി നൽകിയിരിക്കുന്നു; കൃദന്തരൂപം പ്രാർഥനയുടെ സാഹചര്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആരാധനാസന്ദർഭത്തിന് യോജിച്ച ശൈലി. ‘പ്രാർഥിക്കുക,’ ‘കർത്താവ്,’ ‘മശിഹാ’ എന്നീ പൊതുവായി ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്ക് വാക്യത്തിന്റെ ദൈവം–പിതാവ് എന്ന സമാനാധികരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പുനഃക്രമീകരിച്ചു.
