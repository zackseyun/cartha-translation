  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം മുൻസന്ദർഭത്തിൽ തുടരുന്ന കൃദന്തരൂപമായതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനു പകരം കോമ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർക്കേണ്ടതിനാൽ പാഠത്തിൽ [a], [b] രണ്ടും പ്രത്യക്ഷമാകണം.
