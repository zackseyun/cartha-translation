lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: നന്ദി അർപ്പിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തത്തിന്റെ തുടർച്ചാഭാവവും മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ πατρὶ
