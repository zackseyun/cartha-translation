- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മൂലപാഠത്തിലെ രണ്ടാംപുരുഷ ബഹുവചനത്തെ പിന്തുടരുന്നു; ‘ഞങ്ങളെ’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: അവകാശത്തിലെ ഓഹരിക്കു
  rationale: μερίς എന്ന ‘ഓഹരി/പങ്ക്’ ആശയവും κλῆρος എന്ന അവകാശ-വിഹിത ദൃശ്യവും മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ἐν τῷ φωτί
  choice: വെളിച്ചത്തിലുള്ള
  rationale: വെളിച്ചം എന്ന രൂപകവും അതിന്റെ അവകാശത്തോടോ വിശുദ്ധരോടോ ഉള്ള ബന്ധത്തിലെ സാദ്ധ്യമായ സൂക്ഷ്മതയും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കർമസർവനാമത്തിലെ പാഠഭേദം
  choice: നിങ്ങളെ
  alternative: ഞങ്ങളെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം ὑμᾶς (‘നിങ്ങളെ’) എന്നു വായിക്കുന്നു. ശ്രദ്ധേയമായ ἡμᾶς (‘ഞങ്ങളെ’) എന്ന പാഠഭേദം മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μερίς τοῦ κλήρου എന്ന അവകാശ-വിഹിത ദൃശ്യം
  choice: അവകാശത്തിലെ ഓഹരി
  alternative: വെളിച്ചത്തിലുള്ള വിശുദ്ധർക്കു നറുക്കിട്ടു ലഭിച്ച വിഹിതം
  rationale: അവകാശത്തിൽ പങ്കാളിത്തം എന്ന ആശയം വ്യക്തമായി നൽകുമ്പോഴും ‘നറുക്ക്/വിഹിതം’ എന്ന പഴയനിയമ പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
