id: COL.1.28
reference: Colossians 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: ml
  text: അവനെയാണ് ഞങ്ങൾ പ്രഖ്യാപിക്കുന്നത്. ഓരോ മനുഷ്യനെയും മുന്നറിയിപ്പ് നൽകുകയും സകല ജ്ഞാനത്തോടുംകൂടെ ഓരോ മനുഷ്യനെയും പഠിപ്പിക്കുകയും ചെയ്യുന്നു; അങ്ങനെ ഓരോ മനുഷ്യനെയും ക്രിസ്തുവിൽ പക്വത പ്രാപിച്ചവനായി അവതരിപ്പിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: പ്രഖ്യാപിക്കുന്നു
  rationale: പരസ്യമായി അറിയിക്കുക/പ്രഘോഷിക്കുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: νουθετοῦντες
  choice: മുന്നറിയിപ്പു നൽകുകയും
  rationale: ബോധത്തിൽ വെക്കുക, ഉപദേശിച്ച് തിരുത്തുക, മുന്നറിയിപ്പു നൽകുക എന്നീ അർഥവ്യാപ്തികളിൽ സന്ദർഭോചിതമായ മുന്നറിയിപ്പ് എന്ന വശം നിലനിർത്തുന്നു.
- source_word: πάντα ἄνθρωπον
  choice: ഓരോ മനുഷ്യനെയും
  rationale: മൂന്നു പ്രാവശ്യമുള്ള ഏകവചന ആവർത്തനം വ്യക്തിവ്യക്തിയായുള്ള സർവവ്യാപ്തിയെ ഊന്നുന്നു; അതേ ആവർത്തനം വിവർത്തനത്തിലും സംരക്ഷിക്കുന്നു.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: സകല ജ്ഞാനത്തോടുംകൂടെ
  rationale: ἐν എന്നതിന്റെ മാർഗം/സഹചാരഭാവവും πάσῃ എന്ന സമഗ്രതയും നിലനിർത്തുന്നു.
- source_word: παραστήσωμεν
  choice: ദൈവസന്നിധിയിൽ നിർത്തേണ്ടതിന്
  rationale: ഒരാളെ ഹാജരാക്കുക അല്ലെങ്കിൽ സന്നിധിയിൽ നിർത്തുക എന്ന ക്രിയാഭാവം വ്യക്തമാക്കുന്നു; കൊലൊസ്സ്യർ 1:22-ലെ ദൈവസന്നിധി പശ്ചാത്തലം സൂചിപ്പിക്കുന്നു.
- source_word: τέλειον
  choice: പക്വതയുള്ളവനായി
  rationale: ഇവിടെ പൂർണതയിലേക്കെത്തിയ, വളർച്ചപ്രാപിച്ച എന്ന ആശയം; നൈതികമായി പാപരഹിതൻ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: ക്രിസ്തുവിൽ
  rationale: ഐക്യം/ബന്ധം സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ സംക്ഷിപ്ത പ്രയോഗം അതേപടി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τέλειον എന്നതിന്റെ അർഥം
  choice: പക്വതയുള്ളവൻ
  alternative: പൂർണനായവൻ
  rationale: ക്രിസ്തീയ വളർച്ചയും സമ്പൂർണതയും സൂചിപ്പിക്കുമ്പോഴും പാപരഹിത പൂർണത എന്ന പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിൽ ഇറക്കിവയ്ക്കാതിരിക്കാൻ പക്വത എന്ന പദം തിരഞ്ഞെടുത്തു.
- issue: παραστήσωμεν എന്നതിന്റെ പരോക്ഷ കർമം
  choice: ദൈവസന്നിധിയിൽ
  alternative: ഹാജരാക്കുക എന്നുമാത്രം
  rationale: ഗ്രീക്കിൽ പരോക്ഷ കർമം വ്യക്തമാക്കിയിട്ടില്ല. അടുത്തുള്ള 1:22-ന്റെ പശ്ചാത്തലത്തിൽ ദൈവസന്നിധി സ്വാഭാവികമാണെങ്കിലും ഇത് വ്യക്തീകരണമാണ്; അതിനാൽ വാചകത്തിൽ ചേർത്തത് മിതമായ വ്യാഖ്യാനപരമായ തീരുമാനമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ ‘ഓരോ മനുഷ്യനെയും’ എന്ന മൂന്നിരട്ടി ആവർത്തനം ശൈലിസൗകര്യത്തിനായി ചുരുക്കാതെ നിലനിർത്തി.
