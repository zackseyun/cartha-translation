  terminology: ‘കർത്താവ്,’ ‘സൽപ്രവൃത്തി,’ ‘ഫലം കായ്ക്കുക,’ and ‘ദൈവത്തെക്കുറിച്ചുള്ള അറിവ്’ are suitable, established, and non-sectarian. The footnote’s ‘പൂർണ പരിജ്ഞാനം’ is narrowed to ‘കൂടുതൽ പൂർണമായ/ആഴമേറിയ അറിവ്,’ since ἐπίγνωσις may suggest fullness or depth but does not require an absolute ‘complete knowledge.’
