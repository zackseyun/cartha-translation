id: COL.1.15
reference: Colossians 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: ml
  text: അവൻ അദൃശ്യനായ ദൈവത്തിന്റെ പ്രതിരൂപവും സകല സൃഷ്ടിയുടെയും ആദ്യജാതനും[a] ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആദ്യജാതൻ’ എന്നത് ഇവിടെ ജനനക്രമം മാത്രമല്ല, പദവി, അവകാശം, പ്രാമുഖ്യം എന്നിവയും സൂചിപ്പിക്കാം. പുത്രൻ സൃഷ്ടിയുടെ ഭാഗമാണെന്നല്ല ഇതിന്റെ നിർബന്ധിത അർഥം; തുടർന്നുള്ള വാക്യങ്ങളിലെ വിശദീകരണം താരതമ്യം ചെയ്യുക. ‘സകല സൃഷ്ടിക്കുമീതെയുള്ള ആദ്യജാതൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ‘ആദ്യജാതൻ’ എന്ന രൂപകത്തിന്റെ അർഥവ്യാപ്തിയും πάσης κτίσεως എന്ന ജനിറ്റീവ് ഘടനയുടെ വ്യാഖ്യാനസാധ്യതയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: അവൻ … ആകുന്നു
  rationale: മുൻവാക്യത്തിലെ പുത്രനെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ സ്വതന്ത്രവാക്യമായി അവതരിപ്പിക്കുമ്പോഴും ആ ബന്ധം വ്യക്തമായി നിലനിൽക്കുന്നു.
- source_word: εἰκὼν
  choice: പ്രതിരൂപം
  rationale: ദൈവത്തെ ദൃശ്യമായി വെളിപ്പെടുത്തുന്ന പ്രതിനിധാനവും സാദൃശ്യവും ഉൾക്കൊള്ളുന്ന ‘image’ എന്ന ആശയം അമിതമായി വ്യാഖ്യാനിക്കാതെ അറിയിക്കുന്നു.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: അദൃശ്യനായ ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ വിശേഷണാർഥമുള്ള ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πρωτότοκος
  choice: ആദ്യജാതൻ
  rationale: മൂലപദത്തിന്റെ ജനനരൂപകം നിലനിർത്തുകയും തിരുവെഴുത്തിലെ പദവി, അവകാശം, പ്രാമുഖ്യം എന്നീ പശ്ചാത്തലങ്ങൾക്ക് ഇടം നൽകുകയും ചെയ്യുന്നു; ‘സർവോന്നതൻ’ എന്ന വ്യാഖ്യാനപരമായ പകരംവാക്ക് ഉപയോഗിക്കുന്നില്ല.
- source_word: πάσης κτίσεως
  choice: സകല സൃഷ്ടിയുടെയും
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു. ‘സൃഷ്ടിക്കുമീതെ’ എന്ന് പരിഭാഷപ്പെടുത്തി തർക്കവിഷയമായ ബന്ധത്തെ മുഖ്യവാചകത്തിൽ തന്നെ തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεως എന്നതിൽ ക്രിസ്തുവും സൃഷ്ടിയും തമ്മിലുള്ള ബന്ധം
  choice: സകല സൃഷ്ടിയുടെയും ആദ്യജാതൻ
  alternative: സകല സൃഷ്ടിക്കുമീതെയുള്ള ആദ്യജാതൻ
  rationale: ഗ്രീക്കിലെ ‘സൃഷ്ടിയുടെയും’ എന്ന ജനിറ്റീവ് ഘടന യഥാവിധി നിലനിർത്തുന്നത് അതിന്റെ യഥാർഥ ഭാഷാപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു. അതേസമയം, ‘ആദ്യജാതൻ’ എന്നത് സൃഷ്ടിക്കപ്പെട്ടവരിൽ ആദ്യത്തെയാൾ എന്ന സമയക്രമാർഥം മാത്രമല്ല, പദവി, അവകാശം, പ്രാമുഖ്യം എന്നിവയും സൂചിപ്പിക്കാമെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള വാക്യങ്ങൾ വ്യാഖ്യാനസന്ദർഭം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രതിരൂപം’, ‘ആദ്യജാതൻ’ എന്നീ പരിചിതമായ തിരുവെഴുത്തുപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് എളുപ്പമാക്കി. അടിക്കുറിപ്പ് അടയാളം വിശദീകരിക്കപ്പെടുന്ന ‘ആദ്യജാതൻ’ എന്ന പദത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
