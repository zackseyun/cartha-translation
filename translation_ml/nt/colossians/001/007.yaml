revisions:
- from: നിങ്ങൾ ഞങ്ങളുടെ പ്രിയ സഹദാസനായ[a] എപ്പഫ്രാസിൽനിന്ന് പഠിച്ചതുപോലെതന്നെ; അവൻ ഞങ്ങൾക്കുവേണ്ടി[b] മശിഹായുടെ[c] വിശ്വസ്ത ശുശ്രൂഷകനാണ്.
