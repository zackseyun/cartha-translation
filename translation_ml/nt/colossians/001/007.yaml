id: COL.1.7
reference: Colossians 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: ml
  text: നിങ്ങൾ ഞങ്ങളുടെ പ്രിയ സഹദാസനായ എപ്പഫ്രാസിൽ നിന്ന് പഠിച്ചതുപോലെതന്നെ, അവൻ ഞങ്ങൾക്കുവേണ്ടി മിശിഹായുടെ വിശ്വസ്ത ശുശ്രൂഷകനാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: പഠിച്ചതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സുവിശേഷപഠനവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന താരതമ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: എപ്പഫ്രാസിൽനിന്ന് പഠിച്ചു
  rationale: ἀπό പഠനത്തിന്റെ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ൽനിന്ന്’ എന്നു പരിഭാഷപ്പെടുത്തി; ക്രിയയുടെ ഭൂതകാലഭാവവും നിലനിർത്തി.
- source_word: ἀγαπητοῦ συνδούλου ἡμῶν
  choice: ഞങ്ങളുടെ പ്രിയ സഹദാസൻ
  rationale: σύνδουλος ഒരേ യജമാനന്റെ കീഴിൽ കൂടെ ദാസനായിരിക്കുന്ന ബന്ധം സൂചിപ്പിക്കുന്നു. ‘സഹദാസൻ’ ആ കൂട്ടായ അധീനതയും സ്നേഹഭാവവും ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: πιστὸς
  choice: വിശ്വസ്ത
  rationale: എപ്പഫ്രാസിന്റെ ആശ്രയിക്കാവുന്ന സ്ഥിരതയും സേവനത്തിലെ വിശ്വസ്തതയും സൂചിപ്പിക്കുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: ഞങ്ങൾക്കുവേണ്ടി
  rationale: ὑπέρ + genitive ഇവിടെ പ്രതിനിധാനമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നു; ‘ഞങ്ങൾക്കുവേണ്ടി’ ഈ രണ്ടിനും തുറന്നുനിൽക്കുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: διάκονος
  choice: ശുശ്രൂഷകൻ
  rationale: ഇവിടെ പിൽക്കാലത്തെ ഔദ്യോഗിക സഭാപദവിയേക്കാൾ മശിഹായ്ക്കായുള്ള സേവനമാണ് ഉദ്ദേശ്യം; ‘ശുശ്രൂഷകൻ’ അനാവശ്യമായ പദവിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശിഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായി പ്രവർത്തിക്കുന്നു; ‘മശിഹാ’ അതിന്റെ പദവിപരമായ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: σύνδουλος എന്ന ദാസത്വരൂപകത്തിന്റെ പരിഭാഷ
  choice: സഹദാസൻ
  alternative: സഹശുശ്രൂഷകൻ
  rationale: ‘സഹശുശ്രൂഷകൻ’ സേവനത്തെ മാത്രം മുൻനിർത്തി ഒരേ യജമാനന്റെ അധീനത എന്ന രൂപകത്തെ മൃദുവാക്കും. ‘സഹദാസൻ’ മൂലപദത്തിന്റെ ബന്ധപരവും അധീനതാപരവുമായ ഭാവം നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ പദവിപരമായ അർഥം
  choice: മശിഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ പ്രയോഗത്തിൽ പദം പേരുപോലെ മാത്രമല്ല, സേവിക്കപ്പെടുന്ന അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന പദവിയായും നിലകൊള്ളുന്നു; അതിനാൽ അർഥസുതാര്യമായ ‘മശിഹാ’ തെരഞ്ഞെടുത്തു.
- issue: ὑπὲρ ἡμῶν എന്ന വാക്യഭാഗവും പാഠഭേദവും
  choice: ഞങ്ങൾക്കുവേണ്ടി
  alternative: നിങ്ങൾക്കുവേണ്ടി
  rationale: SBLGNT സ്വീകരിച്ച ἡμῶν അനുസരിച്ച് പ്രധാനപാഠം നൽകി. എന്നാൽ ὑμῶν എന്ന സാക്ഷ്യപ്പെടുത്തിയ പാഠഭേദം അർഥത്തെ വ്യക്തമായി മാറ്റുന്നതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. ‘സഹദാസൻ’ മൂലരൂപകത്തിന്റെ കാഠിന്യം നിലനിർത്തുമ്പോഴും വായനാസൗകര്യം നൽകുന്നു; ‘ശുശ്രൂഷകൻ’ ഔദ്യോഗിക സഭാപദവി അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു. അർധവിരാമം മുൻവാക്യവുമായി ബന്ധമുള്ള താരതമ്യഘടനയും തുടർന്ന് വരുന്ന ബന്ധവാക്യവും വ്യക്തമായി വേർതിരിക്കുന്നു.
