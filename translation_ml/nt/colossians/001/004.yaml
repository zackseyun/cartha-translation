  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: ml
  text: മശീഹയായ യേശുവിലുള്ള നിങ്ങളുടെ വിശ്വാസത്തെക്കുറിച്ചും[a] എല്ലാ വിശുദ്ധരോടും നിങ്ങൾക്കുള്ള സ്നേഹത്തെക്കുറിച്ചും കേട്ടിട്ട്,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘മശീഹയായ യേശുവിലുള്ള നിങ്ങളുടെ വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘മശീഹയായ യേശുവിലുള്ള നിങ്ങളുടെ ആശ്രയം.’ ഗ്രീക്കിലെ pistis എന്ന നാമപദത്തിന് സന്ദർഭമനുസരിച്ച് ഈ പരസ്പരബന്ധമുള്ള അർഥങ്ങൾ വരാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: കേട്ടിട്ട്
  rationale: മുൻവാക്യത്തിലെ കർത്താവിനോടും നന്ദിപറയലിനോടും ബന്ധപ്പെടുന്ന ഭൂതകാല കൃദന്തരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പ്രധാന അർഥം മശീഹയായ യേശുവിൽ കേന്ദ്രീകരിച്ച വിശ്വാസമാണ്; ബന്ധപ്പെട്ട മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിലുള്ള
  rationale: ἐν എന്നതിന്റെ ബന്ധാത്മക-സ്ഥലാത്മക ഭാവം ‘ഉള്ള’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും Χριστός എന്ന പദത്തിന്റെ സ്ഥാനാർഥബലം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ സാധാരണ മലയാളപരിഭാഷ.
- source_word: ἣν ἔχετε
  choice: നിങ്ങൾക്കുള്ള
  rationale: സ്നേഹം വായനക്കാർക്കു നിലവിൽ ഉള്ളതാണെന്ന ബന്ധവാക്യത്തിന്റെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: എല്ലാ വിശുദ്ധരോടും
  rationale: സ്നേഹത്തിന്റെ ദിശയും ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ἅγιοι എന്ന പൗലോസിന്റെ പതിവുപദത്തിന് ‘വിശുദ്ധർ’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗംപോലെയോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός ഇവിടെ Ἰησοῦ എന്ന വ്യക്തിനാമത്തോടു ചേർന്ന സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം പരിഭാഷയിൽ തുറന്നുകാട്ടുന്നു.
- issue: πίστις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: സന്ദർഭത്തിൽ വായനക്കാരുടെ മശീഹയായ യേശുവിനോടുള്ള വിശ്വാസമാണ് ഏറ്റവും സ്വാഭാവികം; എങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ ബന്ധപ്പെട്ട മറ്റു അർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തോട് വ്യാകരണപരമായി ബന്ധപ്പെടുന്നതിനാൽ കൃദന്തരൂപവും അവസാനത്തിലെ കോമയും നിലനിർത്തിയിരിക്കുന്നു.
