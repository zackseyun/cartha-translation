  to: നിങ്ങളുടെ പരിശുദ്ധാത്മാവിലുള്ള സ്നേഹത്തെക്കുറിച്ച് ഞങ്ങളോട് അറിയിച്ചതും അദ്ദേഹമാണ്.[a]
