id: COL.1.8
reference: Colossians 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: ml
  text: നിങ്ങളുടെ പരിശുദ്ധാത്മാവിലുള്ള സ്നേഹത്തെക്കുറിച്ച് ഞങ്ങളോട് അറിയിച്ചതും അദ്ദേഹമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളുടെ ആത്മീയ സ്നേഹം” അല്ലെങ്കിൽ “ആത്മാവിൽ നിങ്ങളുടെ സ്നേഹം.”
    reason: ἐν πνεύματι എന്ന പ്രയോഗം പരിശുദ്ധാത്മാവിലുള്ള സ്നേഹത്തെയോ സ്നേഹത്തിന്റെ ആത്മീയ സ്വഭാവത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: അറിയിച്ചതും അവൻതന്നെയാണ്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന നിർദേശകപദത്തോടുകൂടിയ ഭൂതകാല കൃദന്തം മുൻവാക്യത്തിലെ എപ്പഫ്രാസിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധവും ഊന്നലും നിലനിർത്താൻ ഈ രൂപം സ്വീകരിച്ചു; δηλόω ഇവിടെ ‘അറിയിക്കുക/വിവരം നൽകുക’ എന്നർഥത്തിലാണ്.
- source_word: καὶ
  choice: -തും
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതോടൊപ്പം എപ്പഫ്രാസ് ചെയ്ത മറ്റൊരു കാര്യത്തെ കൂട്ടിച്ചേർക്കുന്ന καίയുടെ അർഥം ക്രിയാരൂപത്തിലെ ‘-തും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡμῖν
  choice: ഞങ്ങളോടു
  rationale: 'ദാതൃവിഭക്തി പരോക്ഷകർമത്തെ സൂചിപ്പിക്കുന്നു: എപ്പഫ്രാസ് പൗലോസിനെയും അദ്ദേഹത്തിന്റെ സഹപ്രവർത്തകരെയും വിവരം അറിയിച്ചു.'
- source_word: τὴν ὑμῶν ἀγάπην
  choice: നിങ്ങളുടെ ... സ്നേഹത്തെക്കുറിച്ച്
  rationale: ἀγάπηയ്ക്ക് സാധാരണവും പ്രസക്തവുമായ ‘സ്നേഹം’ ഉപയോഗിച്ചു. ‘അറിയിച്ചു’ എന്ന മലയാളക്രിയയോടൊപ്പം വിഷയം സൂചിപ്പിക്കാൻ ‘-ത്തെക്കുറിച്ച്’ സ്വാഭാവികമാണ്.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിലുള്ള
  rationale: പൗലോസിന്റെ പ്രയോഗരീതിയും സന്ദർഭവും കണക്കിലെടുക്കുമ്പോൾ പരിശുദ്ധാത്മാവാണ് സാധ്യതയേറിയ സൂചന. എങ്കിലും ഗ്രീക്കിലെ നിർദേശകപദമില്ലായ്മ മൂലമുള്ള ‘ആത്മീയമായ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചിതവ്യക്തി/അർഥം
  choice: ‘ആത്മാവിലുള്ള’—പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന വായന
  alternative: ‘ആത്മീയമായ നിങ്ങളുടെ സ്നേഹം’ അല്ലെങ്കിൽ ‘ആത്മാവിൽ നിങ്ങളുടെ സ്നേഹം’
  rationale: പൗലോസിന്റെ ഭാഷാശൈലിയിൽ നിർദേശകപദമില്ലാതെയും πνεῦμα പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കാം; ഇവിടെ അതാണ് സാധ്യതയേറിയത്. എന്നാൽ മനുഷ്യാത്മാവിനെയോ സ്നേഹത്തിന്റെ ആത്മീയ ഗുണത്തെയോ സൂചിപ്പിക്കാനുള്ള യഥാർഥ ഭാഷാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തിലെ എപ്പഫ്രാസിലേക്കുള്ള ബന്ധം ‘അവൻതന്നെയാണ്’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു; മൂലത്തിലെ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
