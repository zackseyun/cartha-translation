id: COL.1.24
reference: Colossians 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: ml
  text: ഇപ്പോൾ, നിങ്ങൾക്കുവേണ്ടിയുള്ള എന്റെ കഷ്ടതകളിൽ ഞാൻ സന്തോഷിക്കുന്നു; മശീഹയുടെ പീഡനങ്ങളിൽ കുറവുള്ളത് എന്റെ ജഡത്തിൽ ഞാൻ നികത്തുന്നു, അവന്റെ ശരീരത്തിനുവേണ്ടി—ആ ശരീരം സഭയാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “മശീഹയുടെ പീഡനങ്ങളിൽ കുറവുള്ളത് എന്റെ ജഡത്തിൽ ഞാൻ നികത്തുന്നു.” മശീഹയുടെ പ്രായശ്ചിത്തപ്രവൃത്തി അപൂർണ്ണമായിരുന്നു എന്നു പൗലോസ് പറയുന്നില്ല; മശീഹയോടും അവന്റെ ശരീരമായ സഭയോടും ബന്ധപ്പെട്ട പീഡനങ്ങളിൽ താൻ പങ്കുചേരുന്നതിനെക്കുറിച്ചാണ് വാക്യം പറയുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ “ക്രിസ്തുവിന്റെ.” ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ “മശീഹയുടെ” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν χαίρω
  choice: ഇപ്പോൾ ... ഞാൻ സന്തോഷിക്കുന്നു
  rationale: വർത്തമാനകാല സാഹചര്യത്തെയും പൗലോസിന്റെ ഇപ്പോഴത്തെ സന്തോഷഭാവത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടിയുള്ള എന്റെ കഷ്ടതകളിൽ
  rationale: സന്ദർഭത്തിൽ കഷ്ടതകൾ പൗലോസിന്റേതാണെന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘എന്റെ’ ചേർക്കുന്നു; ὑπέρ എന്നതിന്റെ ഗുണഭോക്തൃഭാവം ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: കുറവുള്ളത് ... ഞാൻ നികത്തുന്നു
  rationale: ശക്തവും ഉദ്ദേശപൂർവം സംഘർഷഭരിതവുമായ മൂലപ്രയോഗം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; ക്രിയയുടെ വർത്തമാനകാല ഭാവവും സൂക്ഷിക്കുന്നു.
- source_word: τῶν θλίψεων τοῦ Χριστοῦ
  choice: മശീഹയുടെ കഷ്ടതകളിൽ
  rationale: θλίψεις എന്നത് പീഡനവും ഞെരുക്കവും ഉൾക്കൊള്ളുന്ന കഷ്ടതകളെ സൂചിപ്പിക്കുന്നു. Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകുന്നു.
- source_word: ἐν τῇ σαρκί μου
  choice: എന്റെ ജഡത്തിൽ
  rationale: σάρξ ഇവിടെ പാപസ്വഭാവമല്ല, പൗലോസിന്റെ ദേഹധാരിയായ അസ്തിത്വമാണ്; മൂലരൂപകത്തെ സുതാര്യമായി നിലനിർത്താൻ ‘ജഡം’ ഉപയോഗിക്കുന്നു.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: അവന്റെ ശരീരത്തിനുവേണ്ടി
  rationale: സഭയെ ശരീരമായി ചിത്രീകരിക്കുന്ന പൗലോസിന്റെ രൂപകം സംരക്ഷിക്കുകയും ὑπέρ എന്നതിന്റെ ഗുണഭോക്തൃ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: അതായത് സഭയ്ക്കുവേണ്ടി
  rationale: ബന്ധവാക്യം ‘ശരീരം’ എന്നതിനെ ‘സഭ’യായി തിരിച്ചറിയുന്നു; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി വിശദീകരണാത്മകമായ ‘അതായത്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘മശീഹയുടെ കഷ്ടതകളിൽ കുറവുള്ളത്’ എന്നതിന്റെ അർഥം
  choice: മശീഹയോടും അവന്റെ ശരീരമായ സഭയോടും ബന്ധപ്പെട്ടുകൊണ്ടു തുടരുന്ന കഷ്ടതകളിൽ പൗലോസ് തന്റെ ശുശ്രൂഷയിലൂടെ പങ്കുചേരുന്നു എന്ന ശക്തമായ പ്രയോഗം പ്രധാനവാക്യത്തിൽ നിലനിർത്തുന്നു.
  alternative: മശീഹയുടെ പ്രായശ്ചിത്തപ്രവൃത്തി അപൂർണ്ണമായതിനാൽ പൗലോസിന്റെ കഷ്ടതകൾ അതിനെ പൂർത്തിയാക്കുന്നു എന്ന വായന; അല്ലെങ്കിൽ ഇത് നിശ്ചിത അന്ത്യകാല കഷ്ടതകളുടെ അളവിനെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന വായന.
  rationale: θλίψεις എന്ന പദവും ‘അവന്റെ ശരീരത്തിനുവേണ്ടി—അതായത് സഭയ്ക്കുവേണ്ടി’ എന്ന ബന്ധവും സഭാപരവും ശുശ്രൂഷാപരവുമായ പങ്കാളിത്തത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മൂലവാക്യത്തിലെ യഥാർത്ഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനത്തിൽ മായ്ച്ചിട്ടില്ല.
- issue: Χριστοῦ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘മശീഹ’ അതിന്റെ പദവിസ്വഭാവം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കുറവുള്ളത് ... നികത്തുന്നു’ എന്ന മൂലവാക്യത്തിലെ സംഘർഷം നിലനിർത്തിയിട്ടുണ്ട്. ‘ജഡം’, ‘ശരീരം’, ‘സഭ’ എന്നീ പ്രധാന രൂപക-ദൈവശാസ്ത്ര പദങ്ങൾ ചുരുക്കിവ്യാഖ്യാനിക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്; വായനാസൗകര്യത്തിനായി രണ്ടാം വാക്യത്തിൽ ഡാഷുകൾ ഉപയോഗിച്ചു.
