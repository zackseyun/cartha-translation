id: COL.4.14
reference: Colossians 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: ml
  text: പ്രിയനായ വൈദ്യൻ ലൂക്കോസും ദേമാസും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തുകളിൽ ആശംസ അറിയിക്കുന്നതിനുള്ള പതിവുപ്രയോഗമാണിത്. ഗ്രീക്കിൽ ക്രിയ ഏകവചനമാണെങ്കിലും, മലയാളത്തിൽ ലൂക്കോസും ദേമാസും ചേർന്ന കർത്താവിനോട് സ്വാഭാവികമായി ബഹുവചനാദരരൂപമായ ‘ചെയ്യുന്നു’ ഉപയോഗിക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമരൂപം; കൊലൊസ്സ്യയിലെ വിശ്വാസികളെ സമൂഹമായി അഭിസംബോധന ചെയ്യുന്നു.
- source_word: Λουκᾶς
  choice: ലൂക്കോസ്
  rationale: മലയാള ബൈബിൾ ഉപയോഗത്തിൽ പരിചിതമായ ഗ്രീക്ക് വ്യക്തിനാമരൂപം.
- source_word: ἰατρὸς
  choice: വൈദ്യൻ
  rationale: ഒന്നാം നൂറ്റാണ്ടിലെ ചികിത്സകനെ സൂചിപ്പിക്കുന്ന ἰατρός എന്ന പദത്തിന്റെ അർത്ഥം dignifiedവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀγαπητὸς
  choice: പ്രിയനായ
  rationale: സ്നേഹവും ആദരവും പ്രകടിപ്പിക്കുന്ന ἀγαπητός എന്ന വിശേഷണത്തിന്റെ സ്വാഭാവിക ആധുനിക മലയാളരൂപം.
- source_word: καὶ
  choice: -ഉം … -ഉം
  rationale: ലൂക്കോസിനെയും ദേമാസിനെയും സംയുക്ത കർത്താവായി ബന്ധിപ്പിക്കുന്ന മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയരൂപം.
- source_word: Δημᾶς
  choice: ദേമാസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
theological_decisions:
- issue: ‘പ്രിയനായ’ എന്ന വിശേഷണത്തിന്റെ വ്യാപ്തി
  choice: ‘പ്രിയനായ വൈദ്യൻ’ എന്ന മുഴുവൻ വിവരണം ലൂക്കോസിനെ മാത്രം വിശേഷിപ്പിക്കുന്നു.
  alternative: ‘പ്രിയനായ’ എന്നത് ദേമാസിനെയും ഉൾപ്പെടുത്തുന്നു എന്ന വായന.
  rationale: ὁ ἰατρὸς ὁ ἀγαπητὸς എന്ന ആർട്ടിക്കിൾ-വിശേഷണ ഘടന Λουκᾶς-നോട് സമാനാധികരണമായി ചേർന്ന് ലൂക്കോസിനെ വിവരിക്കുന്നു; ദേമാസ് καὶ വഴി വേറിട്ട് ചേർക്കപ്പെടുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ആശംസാസൂത്രവും ലൂക്കോസിനുള്ള സ്നേഹപൂർവമായ വിശേഷണവും സംരക്ഷിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി.
