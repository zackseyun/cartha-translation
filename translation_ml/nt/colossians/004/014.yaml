  source_fidelity: 'The Malayalam accurately represents every element of the Greek: Luke and Demas are the joint senders of greetings; the plural recipients are retained in നിങ്ങളെ; and both ‘beloved’ and ‘physician’ modify Luke alone. The singular Greek greeting verb is idiomatically rendered with a Malayalam finite verb following the compound subject, without altering the greeting formula’s sense.'
