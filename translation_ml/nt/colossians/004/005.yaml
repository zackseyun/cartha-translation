  language: ml
  text: പുറത്തുള്ളവരോട്[a] ജ്ഞാനത്തോടെ പെരുമാറുക; അവസരത്തെ പരമാവധി പ്രയോജനപ്പെടുത്തുക.[b]
  philosophy: optimal-equivalence
  footnotes:
