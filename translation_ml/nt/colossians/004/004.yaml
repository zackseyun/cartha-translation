    text: അഥവാ “വെളിപ്പെടുത്തേണ്ടതിന്” അല്ലെങ്കിൽ “അറിയിക്കേണ്ടതിന്.” “അത്” എന്ന സർവനാമം മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന രഹസ്യത്തെ സൂചിപ്പിക്കുന്നു.
