lexical_decisions:
- source_word: ἵνα
  choice: വ്യക്തമാക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയുടെ അർഥം മലയാളത്തിലെ ‘-േണ്ടതിന്’ എന്ന ഘടന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φανερώσω
  choice: ഞാൻ ... വ്യക്തമാക്കേണ്ടതിന്
  rationale: പ്രസംഗസന്ദർഭത്തിൽ രഹസ്യം വെളിപ്പെടുത്തുകയും ശ്രോതാക്കൾക്കു ഗ്രഹിക്കാവുന്നവിധം വ്യക്തമാക്കുകയും ചെയ്യുന്നതാണ് ക്രിയയുടെ ആശയം; ‘വ്യക്തമാക്കുക’ ഈ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: αὐτὸ
  choice: അത്
  rationale: ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ ‘രഹസ്യം’ ആണ് ഇതിന്റെ സൂചിതപദം.
- source_word: ὡς
  choice: എങ്ങനെ ... അങ്ങനെ
  rationale: സംസാരിക്കേണ്ട രീതിയോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്ന ὡς മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεῖ
  choice: സംസാരിക്കേണ്ടതോ
  rationale: δεῖ സൂചിപ്പിക്കുന്ന ആവശ്യകതയും ബാധ്യതയും ‘വേണ്ടത്’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘സംസാരിക്കണം’ എന്നതും സാധ്യമാണ്.
- source_word: με
  choice: ഞാൻ
  rationale: ഗ്രീക്കിൽ infinitive-ന്റെ accusative subject ആയ με മലയാളത്തിൽ സ്വാഭാവികമായി ഒന്നാംപുരുഷ കർത്താവായി നൽകുന്നു.
- source_word: λαλῆσαι
  choice: സംസാരിക്കുക
  rationale: ക്രിയയുടെ വിശാലവും നേരിട്ടുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; ‘പ്രഘോഷിക്കുക’ എന്നു വിവർത്തനം ചെയ്താൽ മൂലപദത്തേക്കാൾ പ്രത്യേകമായ ആശയം ചേർന്നേക്കാം.
