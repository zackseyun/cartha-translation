    rationale: The lexical-alternative note for φανερώσω should follow “വ്യക്തമാക്കേണ്ടതിന്,” while the note for the manner/necessity phrase should follow “സംസാരിക്കേണ്ടതുപോലെ.”
  revised_text: ഞാൻ അത് സംസാരിക്കേണ്ടതുപോലെ[b] വ്യക്തമാക്കേണ്ടതിന്.[a]
