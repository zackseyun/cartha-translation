  to: ലവൊദിക്ക്യയിലുള്ള സഹോദരന്മാർക്കും നിംഫയ്ക്കും അവളുടെ വീട്ടിലുള്ള സഭയ്ക്കും അഭിവാദ്യങ്ങൾ അറിയിക്കുക.[a]
