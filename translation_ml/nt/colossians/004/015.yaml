id: COL.4.15
reference: Colossians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: ml
  text: ലവൊദിക്ക്യയിലുള്ള സഹോദരന്മാർക്കും നിംഫയ്ക്കും അവളുടെ വീട്ടിലുള്ള സഭയ്ക്കും അഭിവാദ്യങ്ങൾ അറിയിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിംഫാസ്” എന്നും “അവന്റെ വീട്ടിലുള്ള സഭ” എന്നും വായിക്കുന്നു; മറ്റു ചിലതിൽ “അവരുടെ വീട്ടിലുള്ള സഭ” എന്നും വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: വന്ദനം അറിയിക്കുവിൻ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള ആജ്ഞയുടെ ശക്തി നിലനിർത്തുകയും ലേഖനസന്ദർഭത്തിൽ സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: ലവൊദിക്ക്യയിലുള്ള സഹോദരന്മാർ
  rationale: ἀδελφοὺς എന്ന പുല്ലിംഗ ബഹുവചനരൂപം സംരക്ഷിക്കുന്നു; പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് സഹവിശ്വാസികളായ സ്ത്രീപുരുഷന്മാരെ ഉൾക്കൊള്ളാം.
- source_word: Νύμφαν
  choice: നിംഫ
  rationale: SBLGNT-യിലെ Νύμφαν എന്ന രൂപത്തെയും αὐτῆς എന്ന സ്ത്രീലിംഗ ഏകവചന സർവനാമത്തെയും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: അവളുടെ വീട്ടിലുള്ള സഭ
  rationale: വീട്ടിൽ കൂടിവരുന്ന വിശ്വാസിസമൂഹത്തെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അധിക വിശദീകരണം ചേർക്കാതെ സ്ഥലസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐκκλησίαν
  choice: സഭ
  rationale: പൗലോസിന്റെ ലേഖനസന്ദർഭത്തിൽ കൂടിവരുന്ന ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപദമാണ്.
theological_decisions:
- issue: Νύμφαν എന്ന പേരിന്റെ ലിംഗവും അതിനോടനുബന്ധിച്ച സർവനാമവും
  choice: നിംഫ ... അവളുടെ വീട്ടിലുള്ള സഭ
  alternative: നിംഫാസ് ... അവന്റെ വീട്ടിലുള്ള സഭ; അല്ലെങ്കിൽ അവരുടെ വീട്ടിലുള്ള സഭ
  rationale: അച്ചടിച്ച SBLGNT പാഠത്തിലെ αὐτῆς സ്ത്രീലിംഗ ഏകവചനമായതിനാൽ മുഖ്യപാഠം അതിനെ പിന്തുടരുന്നു. എന്നാൽ കൈയെഴുത്തുപ്രതി വ്യത്യാസങ്ങൾ പുല്ലിംഗവും ബഹുവചനവും പിന്തുണയ്ക്കുന്നതിനാൽ അവ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി. ആജ്ഞാരൂപം വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു; പാഠഭേദം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തിയിരിക്കുന്നു.
