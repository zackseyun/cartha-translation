reference: Colossians 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: ml
  text: ഓരോരുത്തരോടും എങ്ങനെ മറുപടി പറയേണ്ടതെന്ന് നിങ്ങൾ അറിയേണ്ടതിന്, നിങ്ങളുടെ സംസാരം എപ്പോഴും കൃപയോടുകൂടിയതും[a] ഉപ്പിനാൽ രുചിവരുത്തിയതും[b] ആയിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കൃപ നിറഞ്ഞതും’ അല്ലെങ്കിൽ ‘ദയയുള്ളതും.’ ‘കൃപയോടുകൂടിയത്’ എന്ന പ്രയോഗം ദയയും സൗമ്യതയും പ്രസാദകരതയും അടയാളപ്പെടുത്തുന്ന സംസാരത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉപ്പിനാൽ രുചിവരുത്തിയത്’ എന്നത് ഉചിതവും ആകർഷകവും വിവേകപൂർവവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; രുചിയില്ലാത്തതോ ദോഷകരമായതോ ആയ സംസാരമല്ല ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: λόγος
  choice: സംസാരം
  rationale: ഇവിടെ ഒരു ഒറ്റ വാക്കിനെയോ ഔപചാരിക സന്ദേശത്തെയോ അല്ല, വിശ്വാസികളുടെ സംസാരരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സംസാരം’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν χάριτι
  choice: കൃപയോടുകൂടിയതും
  rationale: മുൻപിലെ ‘സംസാരം’ എന്നതിനെ കൃപയും ദയയും പ്രസാദകരതയും അടയാളപ്പെടുത്തുന്നതായി വിശേഷിപ്പിക്കുന്നു; അതേസമയം പൗലോസിന്റെ ‘കൃപ’ എന്ന പദത്തിന്റെ വിശാലമായ ധ്വനി നിലനിർത്തുന്നു.
- source_word: ἅλατι ἠρτυμένος
  choice: ഉപ്പിനാൽ രുചിവരുത്തിയതും
  rationale: ഉചിതവും ആകർഷകവും വിവേകപൂർവവുമായ സംസാരത്തെ സൂചിപ്പിക്കുന്ന ഉപ്പിന്റെ രൂപകം നിലനിർത്തുന്നു. കൃതന്തത്തിന്റെ ഫലാവസ്ഥയും ഈ പ്രയോഗം പ്രകടമാക്കുന്നു.
- source_word: εἰδέναι
  choice: അങ്ങനെ ... നിങ്ങൾ അറിയും
  rationale: വാക്യഘടനാപരമായി ദുഷ്കരമായ infinitive-നെ മുൻ ഉപദേശത്തിന്റെ ഫലമോ ഉദ്ദേശ്യമോ ആയി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഈ രണ്ടു ബന്ധങ്ങളിൽ ഒന്നിനെ അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല.
- source_word: δεῖ
  choice: പറയേണ്ടതെന്ന്
  rationale: സാഹചര്യത്തിന് യോജിച്ച ആവശ്യകതയെയും കടമയെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; അത്യന്തം കർക്കശമായ നിർബന്ധഭാവം ഒഴിവാക്കുന്നു.
- source_word: ἑνὶ ἑκάστῳ
  choice: ഓരോരുത്തരോടും
  rationale: ഓരോ വ്യക്തിക്കും അനുയോജ്യമായി മറുപടി നൽകണമെന്ന വിതരണാത്മക ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀποκρίνεσθαι
  choice: മറുപടി പറയുക
  rationale: സംഭാഷണസന്ദർഭത്തിൽ ഉത്തരം നൽകുക എന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: കാലപരമായ സമഗ്രത വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν χάριτι എന്നതിലെ ‘കൃപ’യുടെ വ്യാപ്തി
  choice: കൃപയോടുകൂടിയതും
  alternative: ദയയുള്ളതും / പ്രസാദകരമായതും
  rationale: ഇത് മനുഷ്യബന്ധത്തിലെ സൗമ്യതയെയും ദയയെയും സൂചിപ്പിക്കാം; അതോടൊപ്പം ദൈവകൃപയുടെ പൗലോസീയ ധ്വനിയും ഉണ്ടായേക്കാം. ‘കൃപ’ എന്ന പദം ഈ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: εἰδέναι എന്ന infinitive-ന്റെ ബന്ധം
  choice: അങ്ങനെ ... നിങ്ങൾ അറിയും
  alternative: അറിയേണ്ടതിന് / അറിഞ്ഞുകൊണ്ട്
  rationale: മൂലത്തിലെ infinitive ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. ‘അങ്ങനെ’ എന്ന ബന്ധകം രണ്ടിനും ഇടമുള്ള സ്വാഭാവിക ഫല-ഉദ്ദേശ്യബന്ധം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഉപദേശശൈലി. ‘കൃപ’ എന്ന പരിചിതമായ ദൈവശാസ്ത്രപദവും ‘ഉപ്പിനാൽ രുചിവരുത്തിയത്’ എന്ന മൂലരൂപകവും സംരക്ഷിച്ചിരിക്കുന്നു; അർഥം അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കുന്നു.
