  to: യുസ്തൊസ് എന്നു വിളിക്കപ്പെടുന്ന യേശുവും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു. പരിച്ഛേദനം ലഭിച്ചവരിൽപ്പെട്ടവരിൽ ദൈവരാജ്യത്തിനുവേണ്ടി എന്നോടൊപ്പം പ്രവർത്തിക്കുന്നവർ ഇവർ മാത്രമാണ്.[a] ഇവർ എനിക്ക് ആശ്വാസമായിത്തീർന്നു.[b]
  rationale: 'The revised wording corrects the Malayalam expression for the circumcision group while retaining the Greek sequence: a group is identified first, and only these within it are said to be Paul’s coworkers for God’s kingdom. The contextual greeting, names, and aorist sense of “became a comfort” are retained. Footnote a now preserves interpretive restraint.'
