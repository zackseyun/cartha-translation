id: COL.4.11
reference: Colossians 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: ml
  text: യുസ്തൊസ് എന്നു വിളിക്കപ്പെടുന്ന യേശുവും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു. പരിച്ഛേദനം ലഭിച്ചവരിൽപ്പെട്ടവരിൽ ദൈവരാജ്യത്തിനുവേണ്ടി എന്നോടൊപ്പം പ്രവർത്തിക്കുന്നവർ ഇവർ മാത്രമാണ്.[a] ഇവർ എനിക്ക് ആശ്വാസമായിത്തീർന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവരാജ്യത്തിനുവേണ്ടിയുള്ള എന്റെ സഹപ്രവർത്തകരിൽ പരിച്ഛേദനം ലഭിച്ചവരിൽപ്പെട്ടവർ ഇവർ മാത്രമാണ്.” പദശഃ, “പരിച്ഛേദനയിൽനിന്നുള്ളവർ”; ഇത് യഹൂദസ്വത്വത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; “യഹൂദർ” എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: വാക്യഘടനയിലെ മറ്റൊരു സാധ്യമായ ബന്ധവും ἐκ περιτομῆς എന്ന യഹൂദസ്വത്വസൂചക പ്രയോഗത്തിന്റെ പദശഃ/വ്യാഖ്യാനാത്മക സാധ്യതകളും നൽകുന്നു.
  - marker: b
    text: 'അഥവാ: “ഇവർ എനിക്ക് പ്രോത്സാഹനമായിത്തീർന്നു”; “ഇവർ എനിക്ക് ആശ്വാസമായി ഭവിച്ചു.”'
    reason: παρηγορία എന്ന പദത്തിന്റെയും ἐγενήθησαν എന്ന ക്രിയാപ്രയോഗത്തിന്റെയും സ്വാഭാവിക വിവർത്തനസാധ്യതകൾ നൽകുന്നു.
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: യുസ്തൊസ് എന്നു വിളിക്കപ്പെടുന്ന യേശു
  rationale: വ്യക്തിനാമമായ Ἰησοῦς എന്നതിന് പുതിയനിയമത്തിലെ പതിവായ ‘യേശു’ നിലനിർത്തുന്നു; Ἰοῦστος എന്ന മറ്റൊരു പേരിനെ ‘യുസ്തൊസ്’ എന്നു ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: പരിച്ഛേദനക്കാരിൽനിന്നുള്ളവർ
  rationale: പദശഃ ‘പരിച്ഛേദനയിൽനിന്നുള്ളവർ’ എന്ന യഹൂദ സ്വത്വസൂചനയാണ്. സ്വാഭാവിക മലയാളത്തിനായി ‘പരിച്ഛേദനക്കാർ’ ഉപയോഗിച്ചെങ്കിലും അതിനെ ഒരു പ്രത്യേക കക്ഷിയായി ചുരുക്കിയിട്ടില്ല.
- source_word: οὗτοι μόνοι
  choice: ഇവർ മാത്രമാണ്
  rationale: μόνοι സൂചിപ്പിക്കുന്ന പ്രത്യേകമായ ഏകത്വവും ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: συνεργοὶ
  choice: എന്നോടൊപ്പം പ്രവർത്തിക്കുന്നവർ
  rationale: ‘സഹപ്രവർത്തകർ’ സാധ്യമാണെങ്കിലും, ഇവിടെ പൗലൊസിനോടൊപ്പമുള്ള ശുശ്രൂഷാപങ്കാളിത്തം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കാൻ ക്രിയാത്മക പ്രയോഗം സ്വീകരിച്ചു.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ദൈവരാജ്യത്തിനുവേണ്ടി
  rationale: εἰς ഇവിടെ പ്രവർത്തനത്തിന്റെ ലക്ഷ്യമോ സേവനദിശയോ സൂചിപ്പിക്കുന്നു; സ്ഥാപിതമായ ‘ദൈവരാജ്യം’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: ഇവർ എനിക്ക് ആശ്വാസമായിത്തീർന്നു
  rationale: ἐγενήθησαν എന്ന അഓറിസ്റ്റിന്റെ ‘ആയിത്തീർന്നു’ എന്ന ചലനവും παρηγορίαയുടെ ‘ആശ്വാസം’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ‘പ്രോത്സാഹനം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘പരിച്ഛേദനയിൽനിന്നുള്ളവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: യഹൂദ പശ്ചാത്തലമുള്ള സഹപ്രവർത്തകരെ സൂചിപ്പിക്കുന്ന, വ്യാഖ്യാനാതീതമായ ‘പരിച്ഛേദനക്കാർ’ എന്ന പ്രയോഗം
  alternative: ‘യഹൂദർ’ അല്ലെങ്കിൽ ‘പരിച്ഛേദനപക്ഷക്കാർ’
  rationale: സന്ദർഭം ഇവരെ ദൈവരാജ്യത്തിനുവേണ്ടിയുള്ള പൗലൊസിന്റെ സഹപ്രവർത്തകരായി കാണിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് പ്രയോഗം വംശീയ-മതപശ്ചാത്തലത്തെയോ കൂടുതൽ ഇടുങ്ങിയ ഒരു വിഭാഗത്തെയോ എത്രത്തോളം ഉദ്ദേശിക്കുന്നു എന്നു മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ നിലനിർത്തുന്നു.
- issue: μόνοι ഏത് വിഭാഗത്തെ പരിമിതപ്പെടുത്തുന്നു
  choice: പരിച്ഛേദനക്കാരിൽനിന്നുള്ളവരിൽ ഇവർ മാത്രമാണ് പൗലൊസിന്റെ സഹപ്രവർത്തകർ
  alternative: പൗലൊസിന്റെ എല്ലാ സഹപ്രവർത്തകരിലും പരിച്ഛേദനക്കാരായവർ ഇവർ മാത്രമാണ്
  rationale: ഗ്രീക്കിലെ ‘οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοί’ എന്ന ഘടന ആദ്യം പരിച്ഛേദനക്കാരെന്ന കൂട്ടത്തെ സ്ഥാപിച്ച്, ആ കൂട്ടത്തിനുള്ളിലെ ഏകത്വം ഊന്നുന്നതായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു. മറ്റൊരു ഘടനാസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി. മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച അഭിവാദ്യങ്ങളുടെ പട്ടികയോട് ഈ വാക്യം ബന്ധപ്പെടുന്നതിനാൽ, ഗ്രീക്കിൽ സന്ദർഭത്തിൽനിന്ന് പൂരിപ്പിക്കപ്പെടുന്ന ‘നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു’ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ചേർത്തു. ദൈവശാസ്ത്രപരമായി നിർണായകമായ ‘പരിച്ഛേദന’യും ‘ദൈവരാജ്യം’യും നിലനിർത്തി.
