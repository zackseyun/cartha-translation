  source_fidelity: മുഖ്യപാഠത്തിലെ ‘മശീഹയെക്കുറിച്ചുള്ള മർമ്മം’ τοῦ Χριστοῦ എന്ന ജനിറ്റീവിന്റെ സാധ്യമായ വ്യാഖ്യാനമാണ്; എന്നാൽ മൂലത്തിന്റെ ബന്ധം കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കാൻ ‘മശീഹയുടെ മർമ്മം’ വേണം. ‘ഞാൻ ബന്ധനത്തിലായിരിക്കുന്നതും’ എന്നിടത്തെ καὶ കൂടുതൽ വ്യക്തമായി ‘ഞാനും’ എന്നാക്കി നൽകുന്നതാണ് ഉചിതം.
  naturalness: കരട് പൊതുവേ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികമാണ്. എന്നാൽ ‘തുറന്നുതരാനും, ... പ്രസ്താവിക്കാനും ഇടയാകട്ടെ’ എന്ന ഘടനയിൽ പ്രസ്താവിക്കുന്ന പ്രവൃത്തിയുടെ കർത്താവ് അല്പം മങ്ങിയിരിക്കുന്നു. വാതിൽ തുറക്കുന്നതും അതിലൂടെ മർമ്മം പ്രസ്താവിക്കുന്നതും വ്യക്തമായി ബന്ധിപ്പിക്കുന്ന പുനഃക്രമീകരണം കൂടുതൽ സ്വാഭാവികമാണ്.
  terminology: ‘മശീഹ’ എന്നത് Χριστός-ന്റെ പദവിസ്വഭാവം നന്നായി സംരക്ഷിക്കുന്നു; ‘മർമ്മം’, ‘വചനം’, ‘ബന്ധനത്തിൽ’ എന്നിവയും യോജിച്ച പ്രയോഗങ്ങളാണ്. δέδεμαι-ക്കു ‘ചങ്ങലകളിൽ’ എന്നത് സാധ്യമായ പര്യായമാണ്; അതിനെ അടിക്കുറിപ്പിൽ നിലനിർത്താം.
