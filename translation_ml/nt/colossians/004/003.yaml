id: COL.4.3
reference: Colossians 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: ml
  text: 'അതോടൊപ്പം ഞങ്ങൾക്കുവേണ്ടിയും പ്രാർഥിക്കുവിൻ: മശീഹയുടെ മർമ്മം പ്രസ്താവിക്കാനായി, വചനം അറിയിക്കുന്നതിനുവേണ്ടി ദൈവം ഞങ്ങൾക്കൊരു വാതിൽ തുറന്നുതരട്ടെ. അതുനിമിത്തം ഞാനും ബന്ധനത്തിലായിരിക്കുന്നു.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാനും ചങ്ങലകളിലാണ്.”
    reason: δέδεμαι എന്ന പൂർണകാല കർമണിരൂപത്തിന് ‘ബന്ധനത്തിലായിരിക്കുന്നു’ എന്നതിനു പകരമായ, തടവിന്റെ ഭൗതികസൂചന കൂടുതൽ വ്യക്തമാക്കുന്ന വിവർത്തനം.
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: അതോടൊപ്പം ഞങ്ങൾക്കുവേണ്ടിയും പ്രാർഥിക്കുവിൻ
  rationale: മുൻവാക്യത്തിലെ പ്രാർഥനാസംബന്ധമായ ആഹ്വാനം തുടരുന്ന വർത്തമാനകാല കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ പ്രകടിപ്പിക്കുന്നു; ἅμα καὶ സൂചിപ്പിക്കുന്ന ഒരേകാലത്തുള്ള ഉൾപ്പെടുത്തൽ ‘അതോടൊപ്പം…യും’ എന്നതിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: വചനം അറിയിക്കാനുള്ള ഒരു വാതിൽ ദൈവം ഞങ്ങൾക്കു തുറന്നുതരാനും
  rationale: θύρα എന്ന വാതിൽ-രൂപകം സംരക്ഷിക്കുന്നു. τοῦ λόγου എന്നത് സന്ദേശം അറിയിക്കുന്നതിനുള്ള അവസരം/പ്രവേശനം എന്ന ആശയം വഹിക്കുന്നതിനാൽ ‘വചനം അറിയിക്കാനുള്ള’ എന്നു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: λαλῆσαι
  choice: പ്രസ്താവിക്കാനും
  rationale: λαλέωയുടെ സംസാരിക്കുക/അറിയിക്കുക എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തിക്കൊണ്ട്, ദൈവിക മർമ്മം പരസ്യമായി അറിയിക്കുന്ന സന്ദർഭത്തിന് യോജിക്കുന്ന dignified Malayalam പ്രയോഗം.
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: മശീഹയെക്കുറിച്ചുള്ള മർമ്മം
  rationale: Χριστός ഇവിടെ പദവിനാമമായി വരുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകി. ജനിറ്റീവ് ബന്ധത്തിന് ‘മശീഹയുടെ മർമ്മം’ എന്നും സാധ്യതയുണ്ടെങ്കിലും, സന്ദർഭത്തിൽ മശീഹയെ സംബന്ധിച്ച വെളിപ്പെടുത്തപ്പെട്ട ദൈവിക മർമ്മം എന്ന വായന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: ആ മർമ്മം നിമിത്തമാണ് ഞാൻ ബന്ധനത്തിലായിരിക്കുന്നതും
  rationale: διά + accusativeന്റെ കാരണാർഥം ‘നിമിത്തം’ എന്ന് വ്യക്തമാക്കി; perfect passive ആയ δέδεμαιയുടെ ഇപ്പോഴും തുടരുന്ന ഫലസ്ഥിതി ‘ബന്ധനത്തിലായിരിക്കുന്നു’ എന്നതിൽ നിലനിർത്തി.
theological_decisions:
- issue: τοῦ Χριστοῦ എന്നതിലെ Χριστός
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός അർത്ഥവത്തായ പദവിനാമമായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അതിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന പദവിസ്വഭാവം നിലനിർത്തുന്നു.
- issue: τοῦ Χριστοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: മശീഹയെക്കുറിച്ചുള്ള മർമ്മം
  alternative: മശീഹയുടെ മർമ്മം
  rationale: ജനിറ്റീവ് വസ്തുനിഷ്ഠമായോ വിശാലബന്ധമായോ വായിക്കാം. മുഖ്യപാഠത്തിൽ സന്ദർഭോചിതമായ ‘മശീഹയെക്കുറിച്ചുള്ള’ സ്വീകരിച്ചെങ്കിലും മറ്റൊരു സാധുവായ ബന്ധം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: θύραν τοῦ λόγου എന്ന രൂപകം
  choice: വചനം അറിയിക്കാനുള്ള ഒരു വാതിൽ
  alternative: വചനത്തിനായി ഒരു വാതിൽ / വചനം അറിയിക്കാനുള്ള അവസരം
  rationale: പൗലോസിന്റെ വാതിൽ-രൂപകം നീക്കം ചെയ്യാതെ, മലയാളവായനക്കാർക്ക് അതിന്റെ ഉദ്ദേശ്യം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ‘അറിയിക്കാനുള്ള’ ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തിൽ നിന്നുള്ള തുടർച്ച വ്യക്തമാക്കാൻ ‘പ്രാർഥിക്കുവിൻ’ ഉപയോഗിച്ചു; രൂപകം നിലനിർത്തിക്കൊണ്ട് അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
