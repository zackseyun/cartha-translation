revisions:
- from: 'അതോടൊപ്പം ഞങ്ങൾക്കുവേണ്ടിയും പ്രാർഥിക്കുവിൻ: വചനം അറിയിക്കാനുള്ള ഒരു വാതിൽ ദൈവം ഞങ്ങൾക്കു തുറന്നുതരാനും, മശീഹയെക്കുറിച്ചുള്ള മർമ്മം പ്രസ്താവിക്കാനും ഇടയാകട്ടെ. ആ മർമ്മം നിമിത്തമാണ് ഞാൻ ബന്ധനത്തിലായിരിക്കുന്നതും.[a]'
  to: 'അതോടൊപ്പം ഞങ്ങൾക്കുവേണ്ടിയും പ്രാർഥിക്കുവിൻ: മശീഹയുടെ മർമ്മം പ്രസ്താവിക്കാനായി, വചനം അറിയിക്കുന്നതിനുവേണ്ടി ദൈവം ഞങ്ങൾക്കൊരു വാതിൽ തുറന്നുതരട്ടെ. അതുനിമിത്തം ഞാനും ബന്ധനത്തിലായിരിക്കുന്നു.[a]'
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ബന്ധം ‘മശീഹയുടെ മർമ്മം’ എന്നു നേരിട്ട് നിലനിർത്തി. ദൈവം വാതിൽ തുറക്കുന്നതും അതിലൂടെ പ്രസ്താവന സാധ്യമാകുന്നതും വാക്യഘടനയിൽ വ്യക്തമാക്കി. δι’ ὃ-യുടെ കാരണാർഥം ‘അതുനിമിത്തം’ എന്നും καὶ-യുടെ ഊന്നൽ ‘ഞാനും’ എന്നും സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധനപ്രയോഗത്തോടു കൃത്യമായി ചേർത്തിരിക്കുന്നു.
