- from: വിശ്വസ്തനും പ്രിയപ്പെട്ട സഹോദരനും നിങ്ങളിൽ ഒരാളുമായ[a] ഒനേസിമൊസും അവനോടൊപ്പമുണ്ടാകും. ഇവിടത്തെ കാര്യങ്ങളെല്ലാം അവർ നിങ്ങളെ അറിയിക്കും.[b]
  to: നിങ്ങളിൽ ഒരാളായ വിശ്വസ്തനും പ്രിയപ്പെട്ട സഹോദരനുമായ ഒനേസിമൊസും തിഹിക്കൊസിനോടൊപ്പം വരുന്നു. ഇവിടത്തെ എല്ലാ കാര്യങ്ങളും അവർ നിങ്ങളെ അറിയിക്കും.[a]
  rationale: The revision replaces the ambiguous and semantically inaccurate future expression “അവനോടൊപ്പമുണ്ടാകും” with a clear accompaniment expression linked to Tychicus, the person supplied by the immediately preceding verse. It preserves the source’s descriptive terms and the comprehensive scope of the report. The proposed footnote on “നിങ്ങളിൽ ഒരാളായ” is removed because the alternative “നിങ്ങളുടെ ഇടയിൽനിന്നുള്ളവനായ” is not needed for a natural rendering and its placement could misleadingly suggest an uncertainty absent from the main translation; the remaining note preserves the viable lexical alternative for γνωρίσουσιν.
