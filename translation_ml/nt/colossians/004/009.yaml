id: COL.4.9
reference: Colossians 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: ml
  text: നിങ്ങളിൽ ഒരാളായ വിശ്വസ്തനും പ്രിയപ്പെട്ട സഹോദരനുമായ ഒനേസിമൊസും തിഹിക്കൊസിനോടൊപ്പം വരുന്നു. ഇവിടത്തെ എല്ലാ കാര്യങ്ങളും അവർ നിങ്ങളെ അറിയിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവിടെയുള്ള സകല കാര്യങ്ങളും അവർ നിങ്ങളോടു പറയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν
  choice: അവനോടൊപ്പം
  rationale: σύν കൂടെയുണ്ടാകുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ തിഹിക്കൊസിനെയാണ് ‘അവൻ’ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: Ὀνησίμῳ
  choice: ഒനേസിമൊസ്
  rationale: വ്യക്തിനാമം ഗ്രീക്ക് ഉച്ചാരണത്തോട് ചേർന്ന് മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു.
- source_word: πιστῷ
  choice: വിശ്വസ്തൻ
  rationale: πιστός ഇവിടെ വിശ്വാസയോഗ്യതയും ക്രിസ്തീയ വിശ്വസ്തതയും സൂചിപ്പിക്കാം; ‘വിശ്വസ്തൻ’ ഈ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἀγαπητῷ
  choice: പ്രിയപ്പെട്ട
  rationale: ἀγαπητός എന്നതിലെ സ്നേഹപൂർവമായ സഭാസംബന്ധിയായ ഭാവം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀδελφῷ
  choice: സഹോദരൻ
  rationale: ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ കുടുംബബന്ധഭാഷ വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: ἐξ ὑμῶν ഉത്ഭവത്തെയോ സമൂഹത്തിലെ അംഗത്വത്തെയോ സൂചിപ്പിക്കാം. ‘നിങ്ങളിൽ ഒരാൾ’ കൊലൊസ്സ്യസമൂഹവുമായുള്ള ഒനേസിമൊസിന്റെ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഉത്ഭവാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: കാര്യങ്ങളെല്ലാം
  rationale: സമഗ്രത സൂചിപ്പിക്കുന്ന നപുംസകലിംഗ ബഹുവചനം സന്ദർഭാനുസൃതമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γνωρίσουσιν
  choice: അറിയിക്കും
  rationale: γνωρίζω എന്നതിന്റെ ‘അറിയിക്കുക/വെളിപ്പെടുത്തുക’ എന്ന ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τὰ ὧδε
  choice: ഇവിടത്തെ കാര്യങ്ങൾ
  rationale: പൗലോസ് ഉള്ള സ്ഥലത്തെ കാര്യങ്ങളെയോ അവിടത്തെ സ്ഥിതിഗതികളെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അവ്യക്തത അനാവശ്യമായി ‘സംഭവിക്കുന്നത്’ എന്നു വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφῷ എന്നതിന്റെ സഭാസംബന്ധിയായ അർത്ഥം
  choice: സഹോദരൻ
  alternative: വിശ്വാസത്തിലെ സഹോദരൻ
  rationale: ഇത് ഒരു സഹക്രിസ്ത്യാനിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂലപാഠം ‘സഹോദരൻ’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി.
- issue: ἐξ ὑμῶν എന്നതിന്റെ അർത്ഥവ്യാപ്തി
  choice: നിങ്ങളിൽ ഒരാൾ
  alternative: നിങ്ങളുടെ ഇടയിൽനിന്നുള്ളവൻ
  rationale: കൊലൊസ്സ്യരോടുള്ള ഒനേസിമൊസിന്റെ സമൂഹപരമായ ബന്ധം ഇത് വ്യക്തമാക്കുന്നു; ഫിലേമോനിൽനിന്നുള്ള സാമൂഹികമോ ദൈവശാസ്ത്രപരമോ ആയ നിഗമനങ്ങൾ ഈ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: മുൻവാക്യവുമായുള്ള σύν എന്ന ബന്ധം
  choice: അവനോടൊപ്പമുണ്ടാകും
  alternative: ഒനേസിമൊസിനോടൊപ്പം
  rationale: ഗ്രീക്കിൽ വാക്യം 8-ലെ അയക്കൽക്രിയയോട് വ്യാകരണപരമായി ചേരുന്നു. വാക്യം 9 മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന ബന്ധം വ്യക്തമാക്കി; പുതിയ സംഭവവിവരം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘പ്രിയപ്പെട്ട സഹോദരൻ’, ‘വിശ്വസ്തൻ’ എന്നീ സഭാപത്രഭാഷയിലെ ചൂടും ഗൗരവവും നിലനിർത്തി. മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ ഒറ്റവാക്യമായി വായിക്കാവുന്ന വിധം കുറഞ്ഞ തോതിൽ വ്യക്തമാക്കി.
