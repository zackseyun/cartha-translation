language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: ml
  text: ഈ കത്ത് നിങ്ങളുടെ ഇടയിൽ വായിച്ചുകഴിഞ്ഞാൽ, അത് ലവൊദിക്യക്കാരുടെ സഭയിലും വായിക്കപ്പെടാൻ ശ്രദ്ധിക്കുക; ലവൊദിക്യയിൽനിന്നുള്ളത്[a] നിങ്ങളും വായിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘കത്ത്’ എന്ന വാക്ക് ഗ്രീക്കിൽ നേരിട്ട് ആവർത്തിക്കുന്നില്ല; സന്ദർഭത്തിൽനിന്ന് അത് ഗ്രഹിക്കണം. ഈ കത്ത് ലവൊദിക്യർക്കു തന്നെ എഴുതിയതാണോ, അന്ന് ലവൊദിക്യയിൽ ഉണ്ടായിരുന്നതാണോ എന്നത് ഉറപ്പില്ല.
    reason: lexical_alternative_and_historical_uncertainty
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: വായിച്ചുകഴിഞ്ഞാൽ / വായിക്കുക
  rationale: ἀναγινώσκω എന്നത് ‘വായിക്കുക’ എന്നാണ്; ആദിമസഭയിലെ പൊതുവായന ഇവിടെ സൂചിതമായേക്കാമെങ്കിലും ‘ഉച്ചത്തിൽ’ അഥവാ ‘പരസ്യമായി’ എന്ന ആശയം മൂലപാഠത്തിൽ നേരിട്ട് പറഞ്ഞിട്ടില്ല.
- source_word: παρ’ ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: παρά + dative ഇവിടെ കൊലൊസ്സ്യ വിശ്വാസസമൂഹത്തിനുള്ളിലെ വായനയെ സൂചിപ്പിക്കുന്നു; കേവലം ആരാണ് വായിക്കുന്നത് എന്ന കർത്തൃത്വത്തേക്കാൾ സമൂഹപരമായ സ്ഥിതി ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἡ ἐπιστολή
  choice: ഈ കത്ത്
  rationale: നിർദിഷ്ട ഉപപദം ഇപ്പോൾ കൊലൊസ്സ്യർക്കു അയയ്ക്കുന്ന കത്തിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ഈ കത്ത്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ποιήσατε ἵνα
  choice: വായിക്കപ്പെടുന്നുവെന്ന് ഉറപ്പാക്കുക
  rationale: ποιέωയുടെ ആജ്ഞാരൂപവും ἵνα ഉപവാക്യവും ചേർന്ന് ഒരു ഫലം നടപ്പാകാൻ ശ്രദ്ധിക്കണമെന്ന ആശയം നൽകുന്നു; ‘ഉറപ്പാക്കുക’ ആജ്ഞയുടെ ബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: ലവൊദിക്യക്കാരുടെ സഭയിലും
  rationale: Λαοδικέων എന്ന ജനസൂചക ബഹുവചന ഷഷ്ഠി അവിടെയുള്ള ജനങ്ങൾ ഉൾപ്പെടുന്ന സഭയെ സൂചിപ്പിക്കുന്നു; ‘ലവൊദിക്യക്കാരുടെ സഭ’ ഗ്രീക്കിന്റെ ഘടനയും അർഥവും സൂക്ഷിക്കുന്നു.
- source_word: τὴν ἐκ Λαοδικείας
  choice: ലവൊദിക്യയിൽനിന്നുള്ളതും
  rationale: ഗ്രീക്കിൽ ‘കത്ത്’ എന്ന നാമം സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടവിധം വിട്ടുകളഞ്ഞിരിക്കുന്നു. മലയാളത്തിലെ ‘ഉള്ളത്’ ആ ലോപം നിലനിർത്തുകയും മുൻവാക്യത്തിലെ ‘കത്ത്’ എന്നതുമായി വ്യക്തമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ Λαοδικείας
  choice: ലവൊദിക്യയിൽനിന്നുള്ള
  rationale: ἐκ എന്നത് സ്വാഭാവികമായി ‘നിന്ന്/നിന്നുള്ള’ എന്നാണ്. കത്ത് ആദ്യം ആർക്കാണ് അഭിസംബോധന ചെയ്തതെന്ന് നിർണയിക്കാതെ, ലവൊദിക്യയുമായുള്ള അതിന്റെ ഉറവിടപരമായ ബന്ധം മാത്രം വിവർത്തനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ലവൊദിക്യയിൽനിന്നുള്ളത്’ എന്ന കത്തിന്റെ തിരിച്ചറിയൽ
  choice: അറിയപ്പെടുന്ന ഏതെങ്കിലും കാനോനികമോ കാനോനികമല്ലാത്തതോ ആയ കത്തുമായി തിരിച്ചറിയാതെ നിഷ്പക്ഷമായി ‘ലവൊദിക്യയിൽനിന്നുള്ളത്’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ലവൊദിക്യർക്കു എഴുതിയ പൗലോസിന്റെ കത്ത്; ലവൊദിക്യയിൽനിന്നു കൊലൊസ്സ്യയിലേക്കു വന്ന കത്ത്; ലവൊദിക്യയുമായി ബന്ധപ്പെട്ട ഒരു ചാക്രികലേഖനം, ഒരുപക്ഷേ എഫെസ്യർ.
  rationale: ഗ്രീക്ക് പാഠം ആ രേഖയുടെ കൃത്യമായ തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നില്ല; ലവൊദിക്യയിൽനിന്നുള്ളതാണെന്ന ബന്ധം മാത്രമേ പറയുന്നുള്ളൂ. അതിനാൽ ഒരു ചരിത്രപരമോ കാനോനികമോ ആയ നിഗമനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സഭാപ്രയോഗം സ്വീകരിച്ചു. ‘ഉറപ്പാക്കുക’ ആജ്ഞയുടെ ബലം നിലനിർത്തുന്നു; ‘ലവൊദിക്യയിൽനിന്നുള്ളത്’ മൂലപാഠത്തിലെ നാമലോപവും രേഖയുടെ തിരിച്ചറിയലിലുള്ള അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു.
