id: COL.4.12
reference: Colossians 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: ml
  text: നിങ്ങളിൽ ഒരുവനായ എപ്പഫ്രാസ് നിങ്ങൾക്കു അഭിവാദ്യങ്ങൾ അറിയിക്കുന്നു. മശീഹായുടെ[a] അടിമയായ അവൻ, നിങ്ങൾ പക്വതയുള്ളവരും ദൈവത്തിന്റെ സകല ഹിതത്തിലും പൂർണ ഉറപ്പുള്ളവരുമായി നിലകൊള്ളേണ്ടതിന് തന്റെ പ്രാർഥനകളിൽ എപ്പോഴും നിങ്ങൾക്കുവേണ്ടി തീവ്രമായി പരിശ്രമിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില പാഠസാക്ഷ്യങ്ങളിൽ “മശീഹായായ യേശുവിന്റെ” എന്നു വായിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “പൂർണ ഉറപ്പുള്ളവർ” എന്നതിന് “പൂർണമായി ബോധ്യപ്പെട്ടവർ” എന്നോ “പൂർണമായി സ്ഥിരപ്പെട്ടവർ” എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്കുപദം പൂർണ ഉറപ്പിനെയോ ഉറച്ച നിലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: വന്ദനം ചെയ്യുന്നു
  rationale: പൗലോസിന്റെ ലേഖനസമാപനങ്ങളിലെ വ്യക്തിപരമായ അഭിവാദനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὁ ἐξ ὑμῶν
  choice: നിങ്ങളിൽ ഒരുവനായ
  rationale: എപ്പഫ്രാസ് കൊലൊസ്സ്യ സമൂഹത്തിൽപ്പെട്ടവനാണെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: വെറും സേവനം മാത്രമല്ല, മശീഹായോടുള്ള പൂർണമായ ഉടമസ്ഥബന്ധവും വിധേയത്വവും സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός എന്ന അഭിഷിക്തരാജാവിന്റെ സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തുന്നു; മൂലപാഠത്തിൽ ഇവിടെ യേശു എന്ന നാമം ഇല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἀγωνιζόμενος
  choice: പോരാടുന്നു
  rationale: തീവ്രമായ അധ്വാനമോ സംഘർഷമോ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ശക്തമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἐν ταῖς προσευχαῖς
  choice: തന്റെ പ്രാർഥനകളിൽ
  rationale: എപ്പഫ്രാസിന്റെ ആവർത്തിച്ചുള്ള മധ്യസ്ഥപ്രാർഥനകളെയാണ് പരാമർശിക്കുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἵνα σταθῆτε
  choice: നിലകൊള്ളേണ്ടതിന്
  rationale: ക്രിയയിലെ ‘നിൽക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുകയും ഉദ്ദേശ്യവാക്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τέλειοι
  choice: പക്വതയുള്ളവർ
  rationale: പാപരഹിതമായ പരിപൂർണതയേക്കാൾ ആത്മീയ പക്വതയെയോ സമ്പൂർണവളർച്ചയെയോ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിക്കുന്നു.
- source_word: πεπληροφορημένοι
  choice: പൂർണനിശ്ചയമുള്ളവർ
  rationale: പൂർണമായ ഉറപ്പോ ബോധ്യമോ നേടിയ നിലയെ സൂചിപ്പിക്കുന്നു; ‘സ്ഥിരപ്പെട്ടവർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സകല ഹിതത്തിലും
  rationale: ദൈവഹിതത്തിന്റെ സമഗ്രതയും ἐν എന്ന പദത്തിന്റെ വ്യാപ്തി/മേഖലാസംബന്ധിയായ തുറന്ന അർഥവും അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: δοῦλος എന്നതിന്റെ ബന്ധപരമായ ശക്തി
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: ഈ തിരിച്ചറിയൽവാക്യത്തിൽ മശീഹായുടെ പൂർണ ഉടമസ്ഥതയിലും അധികാരത്തിലും ഉള്ളവൻ എന്ന ആശയം പ്രധാനമാണ്; അതിനാൽ മൃദുവായ ‘സേവകൻ’ എന്നതിനെക്കാൾ ‘അടിമ’ മൂലപദത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ; ക്രിസ്തുയേശുവിന്റെ
  rationale: Χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു. ലഭിച്ച മൂലപാഠത്തിൽ യേശു എന്ന നാമം ഇല്ല; പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: πεπληροφορημένοι എന്നതിന്റെ അർഥം
  choice: പൂർണനിശ്ചയമുള്ളവർ
  alternative: പൂർണമായി ബോധ്യപ്പെട്ടവർ; പൂർണമായി സ്ഥിരപ്പെട്ടവർ
  rationale: പൂർണ ഉറപ്പിന്റെ അവസ്ഥ എന്ന സാധാരണ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; ഉറപ്പോ സ്ഥിരതയോ എന്ന യഥാർഥ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി; ആശയബന്ധം ‘അവൻ’ എന്ന സർവനാമത്തിലൂടെ നിലനിർത്തി. ‘അടിമ’യും ‘പോരാടുന്നു’യും മൂലപാഠത്തിലെ ശക്തി മൃദൂകരിക്കാതെ ഉപയോഗിച്ചു.
