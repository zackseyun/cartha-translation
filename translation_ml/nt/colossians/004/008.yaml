source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ml
  text: 'ഇതേ ഉദ്ദേശ്യത്തോടെയാണ് ഞാൻ അവനെ നിങ്ങളുടെ അടുക്കലേക്ക് അയച്ചത്: ഞങ്ങളുടെ സ്ഥിതി നിങ്ങൾ അറിയാനും[a] അവൻ നിങ്ങളുടെ ഹൃദയങ്ങളെ ധൈര്യപ്പെടുത്താനും വേണ്ടിയാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ, “നിങ്ങളുടെ സ്ഥിതി ഞങ്ങൾ അറിയാനും” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: അവനെ
  rationale: മുൻവാക്യത്തിലെ തിഹിക്കൊസിനെയാണ് പുൽലിംഗ ഏകവചന ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഈ വാക്യഘടനയിൽ ‘അവനെ’ സ്വാഭാവികമാണ്.
- source_word: ἔπεμψα
  choice: ഞാൻ ... അയച്ചത്
  rationale: ഏറിസ്റ്റ് സൂചകക്രിയയെ സന്ദർഭത്തിന് യോജിച്ച ലളിത ഭൂതകാലമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കലേക്ക്
  rationale: അയയ്ക്കുക എന്ന ക്രിയയോടൊപ്പം πρός ദിശയും വ്യക്തികളിലേക്കുള്ള ഗമനവും സൂചിപ്പിക്കുന്നു.
- source_word: εἰς αὐτὸ τοῦτο
  choice: ഈ ഒരേയൊരു ഉദ്ദേശ്യത്തോടെയാണ്
  rationale: αὐτὸ τοῦτο നൽകുന്ന ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: '... വേണ്ടിയാണ്'
  rationale: തുടർന്നുവരുന്ന രണ്ട് ക്രിയകളെയും ഉൾക്കൊള്ളുന്ന ഉദ്ദേശ്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: γνῶτε
  choice: നിങ്ങൾ അറിയാനും
  rationale: ἵναയ്ക്ക് കീഴിലുള്ള ഏറിസ്റ്റ് സബ്ജങ്ക്ടീവ് ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു; ‘അറിയുക’ അതിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: τὰ περὶ ἡμῶν
  choice: ഞങ്ങളുടെ സ്ഥിതി
  rationale: പൗലോസിന്റെയും കൂട്ടാളികളുടെയും അവസ്ഥയെയും അവരെക്കുറിച്ചുള്ള വിവരങ്ങളെയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: παρακαλέσῃ
  choice: ധൈര്യപ്പെടുത്താനും
  rationale: παρακαλέω ആശ്വസിപ്പിക്കുക, പ്രോത്സാഹിപ്പിക്കുക, ധൈര്യപ്പെടുത്തുക എന്നീ അർഥങ്ങൾ വഹിക്കാം; ഇവിടെ തിഹിക്കൊസിന്റെ സന്ദർശനവും വാർത്തയും വിശ്വാസികളെ ഉള്ളിൽ ശക്തിപ്പെടുത്തുന്നതാണ് മുൻനിരയിൽ.
- source_word: τὰς καρδίας ὑμῶν
  choice: നിങ്ങളുടെ ഹൃദയങ്ങളെ
  rationale: ബൈബിളിലെ മാനവാന്തരത്തെ സൂചിപ്പിക്കുന്ന ‘ഹൃദയം’ എന്ന രൂപകം ചുരുക്കിവ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉദ്ദേശ്യവാക്യത്തിലെ സർവനാമങ്ങളുമായി ബന്ധപ്പെട്ട പാഠഭേദം
  choice: SBLGNTയിലെ γνῶτε τὰ περὶ ἡμῶν അനുസരിച്ച് ‘ഞങ്ങളുടെ സ്ഥിതി നിങ്ങൾ അറിയാനും’ എന്നത് മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നിങ്ങളുടെ സ്ഥിതി ഞങ്ങൾ അറിയാനും’ എന്ന അർഥമുള്ള വായനയുണ്ട്.
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠത്തെ മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നു; അറിവിന്റെ ദിശ മാറ്റുന്ന പ്രധാന പാഠഭേദം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹൃദയങ്ങൾ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തി; παρακαλέωയുടെ അർഥവ്യാപ്തിയിൽ സന്ദർഭോചിതമായി ‘ധൈര്യപ്പെടുത്തുക’ തിരഞ്ഞെടുത്തു. അടിക്കുറിപ്പ് സൂചകം ബന്ധപ്പെട്ട മുഖ്യപാഠഘടകത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
