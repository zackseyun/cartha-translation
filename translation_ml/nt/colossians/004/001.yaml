id: COL.4.1
reference: Colossians 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: ml
  text: യജമാനന്മാരേ, നിങ്ങളുടെ അടിമകൾക്കു നീതിയും ന്യായമായ പരിഗണനയും നൽകുക[a]; നിങ്ങൾക്കും സ്വർഗത്തിൽ ഒരു കർത്താവുണ്ടെന്ന് അറിഞ്ഞുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിയും സമത്വവും നൽകുക.” “ന്യായമായ പരിഗണന” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് “സമത്വം” അല്ലെങ്കിൽ “തുല്യത” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: യജമാനന്മാരേ
  rationale: വീട്ടുചട്ടത്തിന്റെ ഈ സന്ദർഭത്തിൽ മനുഷ്യ യജമാനന്മാരെയാണ് അഭിസംബോധന ചെയ്യുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ സംബോധനമാണിത്.
- source_word: τὸ δίκαιον
  choice: നീതി
  rationale: നീതിയായതും ശരിയായതുമായ കാര്യത്തെ സൂചിപ്പിക്കുന്ന substantivized adjective-ന്റെ ധാർമ്മിക ശക്തി ചുരുക്കമായും വ്യക്തമായും നൽകുന്നു.
- source_word: τὴν ἰσότητα
  choice: ന്യായമായ പരിഗണന
  rationale: ἰσότης എന്ന പദത്തിന്റെ സമത്വം, നിഷ്പക്ഷത, നീതിപൂർവമായ ഇടപാട് എന്നീ അർഥസാധ്യതകളിൽ, ബന്ധപരമായ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം; ‘സമത്വം’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τοῖς δούλοις
  choice: നിങ്ങളുടെ അടിമകൾക്കു
  rationale: യജമാനൻ–അടിമ സാമൂഹികബന്ധം ഇവിടെ തുറന്നുപറയുന്നതിനാൽ δοῦλος എന്നതിന്റെ ബന്ധിതാവസ്ഥ മൃദൂകരിക്കാതെ ‘അടിമകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: παρέχεσθε
  choice: നൽകുക
  rationale: ലഭ്യമാക്കുക, കൊടുക്കുക, ഉറപ്പാക്കുക എന്ന ആജ്ഞയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: εἰδότες
  choice: അറിഞ്ഞുകൊൾവിൻ
  rationale: പ്രധാന ആജ്ഞയ്ക്കു പിന്നിലെ ബോധ്യവും അടിസ്ഥാനവും പങ്കാളിക്രിയയുടെ ആശയത്തിന് യോജിച്ച വിധത്തിൽ നൽകുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങൾക്കും
  rationale: മനുഷ്യ യജമാനന്മാരും അധികാരത്തിനു കീഴിലാണെന്ന ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: κύριον
  choice: ഒരു കർത്താവ്
  rationale: മനുഷ്യ യജമാനന്മാരിൽനിന്ന് സ്വർഗീയ κύριος-നെ വേർതിരിക്കുകയും പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν οὐρανῷ
  choice: സ്വർഗത്തിൽ
  rationale: ഏകവചനത്തിലുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും പ്രമാണികവുമായ മലയാളരൂപം.
theological_decisions:
- issue: വീട്ടുചട്ടത്തിന്റെ പശ്ചാത്തലത്തിൽ δοῦλοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: യജമാനന്മാരോടുള്ള നേരിട്ടുള്ള ബന്ധത്തിൽ ബന്ധിതമായ സാമൂഹികപദവി പ്രസക്തമായതിനാൽ മൃദുവാക്കാത്ത ‘അടിമകൾ’ തിരഞ്ഞെടുത്തു.
- issue: ἰσότητα എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ന്യായമായ പരിഗണന
  alternative: സമത്വം / തുല്യത / നീതിപൂർവമായ പെരുമാറ്റം
  rationale: സന്ദർഭത്തിൽ നീതിപൂർവവും സമചിത്തവുമായ ഇടപാടാണ് സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നത്; എന്നാൽ ‘സമത്വം’ എന്ന ശ്രദ്ധേയമായ പദാർഥം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
- issue: മനുഷ്യ κύριοι-യും സ്വർഗീയ κύριος-യും തമ്മിലുള്ള പദബന്ധം
  choice: യജമാനന്മാർ / കർത്താവ്
  alternative: യജമാനന്മാർ / യജമാനൻ
  rationale: ഗ്രീക്കിലെ ആവർത്തനബന്ധം മലയാളത്തിൽ പൂർണമായി ഒരേ പദംകൊണ്ട് നൽകുന്നതിനേക്കാൾ, സ്വർഗീയ കർത്താവിന്റെ ദൈവശാസ്ത്രപരമായ സ്ഥാനവും മനുഷ്യ യജമാനന്മാരിൽനിന്നുള്ള വ്യത്യാസവും വ്യക്തമാക്കുന്നു; ഇരുവരും അധികാരബന്ധത്തെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ‘അടിമകൾ’ എന്നത് ചരിത്രസാമൂഹിക യാഥാർഥ്യം മൃദൂകരിക്കാതെ വ്യക്തമാക്കുന്നു. ‘അറിഞ്ഞുകൊൾവിൻ’ എന്ന രൂപം വാക്യത്തിന്റെ ഗൗരവവും ബഹുവചന അഭിസംബോധനയും നിലനിർത്തുന്നു.
