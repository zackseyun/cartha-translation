id: COL.4.13
reference: Colossians 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, അവൻ നിങ്ങൾക്കുവേണ്ടിയും ലവോദിക്യയിലും ഹിയെരാപ്പൊലിസിലും ഉള്ളവർക്കുവേണ്ടിയും വളരെയധികം അധ്വാനമുണ്ടെന്ന്[a] അവനെക്കുറിച്ച് ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വളരെ കഠിനമായി പ്രയത്നിക്കുന്നു,’ ‘വലിയ കരുതലുണ്ട്,’ അല്ലെങ്കിൽ ‘തീവ്രമായ വ്യഥയുണ്ട്.’ ഗ്രീക്ക് പദപ്രയോഗം കഠിനമായ അധ്വാനത്തെയും, സന്ദർഭാനുസരണം, തീവ്രമായ കരുതലിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ αὐτῷ
  choice: അവനെക്കുറിച്ച് ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: μαρτυρέω എന്ന ക്രിയയോടൊപ്പമുള്ള ദാതിവ് ഇവിടെ എപ്പഫ്രാസിനെ സംബന്ധിച്ചുള്ള പൗലോസിന്റെ വ്യക്തിപരമായ സാക്ഷ്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും അർഥവ്യക്തവുമായ രൂപം സ്വീകരിച്ചു; ‘അവനുവേണ്ടി സാക്ഷ്യം പറയുന്നു’ എന്ന അനുകൂലസാക്ഷ്യത്തിന്റെ സൂക്ഷ്മഭാവവും സന്ദർഭത്തിൽ സാധ്യമാണ്.
- source_word: γὰρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടമാക്കി
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും വ്യക്തമാക്കുന്നതിനാൽ നിർബന്ധിതമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി.
- source_word: ἔχει πολὺν πόνον
  choice: വളരെ അധ്വാനിക്കുന്നു
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘വളരെ അധ്വാനം ഉണ്ട്’ എന്ന അസ്വാഭാവിക രൂപത്തിനു പകരം, കഠിനപ്രയത്നം എന്ന അടിസ്ഥാനാർഥം സ്വാഭാവികമായ മലയാളക്രിയാരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ലഭിക്കുന്നവരുടെ നന്മയ്ക്കായുള്ള പ്രയത്നമോ കരുതലോ സൂചിപ്പിക്കുന്ന ὑπέρ എന്നതിന്റെ സ്വാഭാവികമായ പരിഭാഷ.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ലവൊദിക്യയിലുള്ളവർ
  rationale: സ്ഥലനാമം മലയാളത്തിലെ പരിചിതമായ ലിപ്യന്തരണത്തിൽ നൽകി, അവിടെയുള്ള വിശ്വാസികളെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: ഹിയരപ്പൊലിസിലുള്ളവർ
  rationale: മുൻപത്തെ സമാന്തര പ്രയോഗം നിലനിർത്തി നഗരനാമം ആധുനിക മലയാളത്തിൽ ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: എപ്പഫ്രാസിന്റെ ശുശ്രൂഷയോടു ബന്ധപ്പെട്ട πόνος എന്ന പദത്തിന്റെ അർഥം
  choice: വളരെ അധ്വാനിക്കുന്നു
  alternative: വലിയ കരുതലുണ്ട്; കടുത്ത മനോവേദനയുണ്ട്; വളരെ കഷ്ടപ്പെടുന്നു
  rationale: സമീപസന്ദർഭം എപ്പഫ്രാസിന്റെ പ്രാർഥനാപോരാട്ടത്തെ എടുത്തുകാണിക്കുന്നതിനാൽ വികാരപരമായ കരുതലോ മനോവേദനയോ സാധ്യമാണ്. എന്നാൽ πόνος എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ അധ്വാനം നിലനിർത്തുന്നതിലൂടെ അർഥം അനാവശ്യമായി ചുരുക്കാതെ ആ സന്ദർഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഭാഷ ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തിച്ചുള്ള ‘നിങ്ങൾക്കുവേണ്ടിയും … ഉള്ളവർക്കുവേണ്ടിയും’ എന്ന സമാന്തരഘടന അർഥവ്യക്തതയ്ക്കായി നിലനിർത്തി.
