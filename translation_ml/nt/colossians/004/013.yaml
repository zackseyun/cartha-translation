revisions:
- from: അവൻ നിങ്ങൾക്കുവേണ്ടിയും ലവൊദിക്യയിലുള്ളവർക്കുവേണ്ടിയും ഹിയരപ്പൊലിസിലുള്ളവർക്കുവേണ്ടിയും വളരെ അധ്വാനിക്കുന്നുവെന്ന്[a] അവനെക്കുറിച്ച് ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു.
