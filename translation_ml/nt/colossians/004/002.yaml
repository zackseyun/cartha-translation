lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: പ്രാർഥനയിൽ
  rationale: ലേഖനത്തോടുകൂടിയ ദാതൃവിഭക്തിപ്രയോഗം ഇവിടെ ഒരു പ്രത്യേക പ്രാർഥനയെക്കാൾ പ്രാർഥന എന്ന നിരന്തര അഭ്യാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘പ്രാർഥനയിൽ’ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: προσκαρτερεῖτε
  choice: അർപ്പണബോധത്തോടെ തുടരുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം സ്ഥിരതയോടെയുള്ള തുടർച്ചയും പ്രതിബദ്ധതയും ആവശ്യപ്പെടുന്നു. ഈ പ്രയോഗം ‘തുടരുക’ എന്ന നിലനിൽപ്പിനെയും ‘അർപ്പണബോധത്തോടെ’ എന്ന സമർപ്പിത മനോഭാവത്തെയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: γρηγοροῦντες
  choice: ജാഗരൂകരായിരിക്കുക
  rationale: ഈ വർത്തമാനകാല കൃദന്തം മുഖ്യ ആജ്ഞ നടപ്പാക്കേണ്ട രീതിയെ സൂചിപ്പിക്കുന്നു. ‘ജാഗരൂകരായിരിക്കുക’ എന്നത് അക്ഷരാർഥത്തിലുള്ള ഉറക്കമില്ലായ്മയെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി ആത്മീയമായ ശ്രദ്ധയും കരുതലും പകർന്നു നൽകുന്നു.
- source_word: ἐν αὐτῇ
  choice: അതിൽ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുൻപുള്ള ‘പ്രാർഥന’യെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘അതിൽ’ എന്നത് മൂലത്തിലെ അന്വയഘടന നിലനിർത്തുന്നു.
- source_word: ἐν εὐχαριστίᾳ
  choice: നന്ദിയോടെ
  rationale: ഈ പദസമുച്ചയം ജാഗ്രതയോടെയുള്ള പ്രാർഥനയുടെ അനുഗാമിയായ മനോഭാവത്തെ സൂചിപ്പിക്കുന്നു. ‘നന്ദിയോടെ’ ആ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
