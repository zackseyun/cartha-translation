translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, മാന്യമായ മലയാളം. മുഖ്യവാക്യത്തിലെ ആജ്ഞാഭാവവും തുടർച്ചയും നിലനിർത്തി; കൃദന്തത്തെ സ്വാഭാവികമായ സമാന്തര ആജ്ഞയായി അവതരിപ്പിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
