  naturalness: ‘ശുശ്രൂഷ പൂർണമായി നിർവഹിക്കാൻ ശ്രദ്ധിക്കുക’ മനസ്സിലാക്കാവുന്നതാണ്; എന്നിരുന്നാലും ‘ശുശ്രൂഷ നിറവേറ്റാൻ ശ്രദ്ധിക്കുക’ കൂടുതൽ സ്വാഭാവികവും ചുരുക്കവുമായ ആധുനിക മലയാളമാണ്. അടിക്കുറിപ്പിന്റെ സൂചകം ഇതരവാക്യത്തിന്റെ അവസാനം നിൽക്കുന്നതിനേക്കാൾ, വ്യത്യസ്തമായി വായിക്കാവുന്ന ‘കർത്താവിൽ’ എന്ന പദത്തോടു ചേർക്കണം.
