id: COL.4.17
reference: Colossians 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: ml
  text: 'അർഖിപ്പൊസിനോടു പറയുക: “കർത്താവിൽ[a] നീ സ്വീകരിച്ച ശുശ്രൂഷ നിറവേറ്റാൻ ശ്രദ്ധിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “കർത്താവിൽനിന്ന് നീ സ്വീകരിച്ച ശുശ്രൂഷ നിറവേറ്റാൻ ശ്രദ്ധിക്കുക.”'
    reason: ἐν κυρίῳ എന്നത് ഇവിടെ ‘കർത്താവിൽ’ എന്ന പ്രവർത്തനമണ്ഡലമോ ബന്ധമോ സൂചിപ്പിക്കാം; സന്ദർഭപരമായി ‘കർത്താവിൽനിന്ന്’ എന്ന ഉറവിടാർഥവും സാധ്യതയാണ്.
lexical_decisions:
- source_word: εἴπατε
  choice: പറയുക
  rationale: സഭയോടു ബഹുവചനത്തിൽ നൽകുന്ന ആജ്ഞയാണ്. ‘അർഖിപ്പൊസിനോടു പറയുക’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി ആ ആജ്ഞാശക്തി നിലനിർത്തുന്നു.
- source_word: Ἀρχίππῳ
  choice: അർഖിപ്പൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളത്തിലെ സാധാരണ ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു; വിഭക്തിയിൽ ‘അർഖിപ്പൊസിനോടു’ എന്നു വരുന്നു.
- source_word: Βλέπε
  choice: ശ്രദ്ധിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം തുടർച്ചയായ ജാഗ്രതയും കരുതലും സൂചിപ്പിക്കുന്നു. ‘ശ്രദ്ധിക്കുക’ ആ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διακονίαν
  choice: ശുശ്രൂഷ
  rationale: ക്രിസ്തീയസന്ദർഭത്തിലെ ഏല്പിക്കപ്പെട്ട സേവനത്തെയോ ഉത്തരവാദിത്വത്തെയോ സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക സഭാപദവി അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: παρέλαβες
  choice: സ്വീകരിച്ച
  rationale: സ്വയം ഏറ്റെടുത്തതല്ല, ലഭിച്ചതോ ഏല്പിക്കപ്പെട്ടതോ ആയ ചുമതല എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ἐν എന്ന ഉപസർഗത്തിന്റെ അടിസ്ഥാനരൂപം സംരക്ഷിക്കുകയും ബന്ധം, പ്രവർത്തനമണ്ഡലം, അല്ലെങ്കിൽ പരോക്ഷമായ ഉറവിടം എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: ἵνα αὐτὴν πληροῖς
  choice: പൂർണമായി നിർവഹിക്കാൻ
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും πληρόωയുടെ പൂർണമായി നടപ്പാക്കുക/നിറവേറ്റുക എന്ന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്ത് നൽകുന്നു.
theological_decisions:
- issue: ἐν κυρίῳ എന്നതിന്റെ സൂക്ഷ്മാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവിൽ’
  alternative: ‘കർത്താവിൽനിന്ന്’
  rationale: ഗ്രീക്കിൽ ἐν ആണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അത് കർത്താവുമായുള്ള ബന്ധത്തിലോ അവന്റെ അധീനതയിലോ ശുശ്രൂഷ സ്വീകരിച്ചതായി സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ ഉറവിടാർഥവും സാധ്യമെങ്കിലും അതിനെ മാത്രം നിർണ്ണയിക്കാതെ യഥാർഥമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ശുശ്രൂഷ’ സഭാസന്ദർഭത്തിൽ പരിചിതമാണെങ്കിലും ഒരു പ്രത്യേക ഔദ്യോഗിക പദവി ചുമത്തുന്നില്ല. അടിക്കുറിപ്പ് സൂചകം മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
