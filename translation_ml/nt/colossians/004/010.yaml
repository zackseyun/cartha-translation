id: COL.4.10
reference: Colossians 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: ml
  text: എന്റെ സഹതടവുകാരനായ അരിസ്താർക്കൊസും ബർന്നബാസിന്റെ കസിനായ മർക്കൊസും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു. (മർക്കൊസിനെക്കുറിച്ച് നിങ്ങൾക്ക് നിർദേശങ്ങൾ ലഭിച്ചിട്ടുണ്ട്; അവൻ നിങ്ങളുടെ അടുക്കൽ വന്നാൽ അവനെ സ്വീകരിക്കുക[a].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ സ്വാഗതം ചെയ്യുക.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ ആതിഥ്യപൂർവം സ്വീകരിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: ലേഖനങ്ങളിലെ ആശംസ അറിയിക്കുന്ന പതിവുപ്രയോഗത്തെ നേരിട്ടും മാന്യമായും അവതരിപ്പിക്കുന്നു.
- source_word: συναιχμάλωτός
  choice: സഹതടവുകാരൻ
  rationale: ഒരാളോടൊപ്പം തടവിലായിരിക്കുന്നവൻ എന്ന പദത്തിന്റെ സുതാര്യമായ അർഥം നൽകുന്നു; തടവ് അക്ഷരാർഥത്തിലോ രൂപകാർഥത്തിലോ എന്നത് നിർണയിക്കുന്നില്ല.
- source_word: ἀνεψιὸς
  choice: ബന്ധു
  rationale: ഗ്രീക്കിൽ കൃത്യമായി 'കസിൻ' എന്ന ബന്ധമാണ് ഉദ്ദേശിക്കുന്നത്; മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ മലയാളം നിലനിർത്തുകയും കൃത്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐλάβετε ἐντολάς
  choice: നിർദേശങ്ങൾ ലഭിച്ചിട്ടുണ്ടല്ലോ
  rationale: അധികാരപൂർവമായ മാർഗനിർദേശം എന്ന ഭാവം നിലനിർത്തുന്നു; മലയാളത്തിലെ സന്ദർഭസഹജമായ പ്രയോഗമാണിത്.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: അവൻ നിങ്ങളുടെ അടുക്കൽ വന്നാൽ
  rationale: ഭാവിയെ സംബന്ധിക്കുന്ന നിബന്ധന സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: δέξασθε αὐτόν
  choice: അവനെ സ്വാഗതം ചെയ്യുക
  rationale: യാത്രക്കാരനെ ആതിഥ്യപൂർവം സ്വീകരിക്കുക എന്ന സന്ദർഭാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: συναιχμάλωτός μου എന്നതിൽ പൗലൊസും അരിസ്താർക്കൊസും തമ്മിലുള്ള ബന്ധത്തിന്റെ സ്വഭാവം
  choice: എന്റെ സഹതടവുകാരൻ
  alternative: കർത്താവിൽ എന്റെ സഹബന്ദി; കഷ്ടതയിൽ എന്റെ സഹപ്രവർത്തകൻ
  rationale: തടവ് അക്ഷരാർഥത്തിലാണോ രൂപകാർഥത്തിലാണോ എന്നു വാക്യം തന്നെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം ചേർക്കാതെ പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ലേഖനശൈലി. വ്യക്തിനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന് ലിപ്യന്തരിച്ചു. മൂലത്തിലെ ഏകവചന ക്രിയയ്ക്ക് അനുസരിച്ച് സംയുക്ത കർത്താവിനോടും ‘അഭിവാദ്യം ചെയ്യുന്നു’ നിലനിർത്തി; മലയാളത്തിൽ ഇത് സ്വാഭാവികമാണ്.
