source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: ml
  text: ഈ വന്ദനം എന്റെ സ്വന്തം കൈപ്പടയിൽ എഴുതിയതാണ്—പൗലോസ്[a]. എന്റെ ചങ്ങലകളെ ഓർക്കുക[b]. കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അഭിവാദനം’ എന്നും പരിഭാഷപ്പെടുത്താം. കത്തിന്റെ അവസാനത്തിലെ ഈ വന്ദനം പൗലോസ് സ്വന്തം കൈപ്പടയിൽ എഴുതിയതാണെന്ന് ഗ്രീക്ക് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ തടവ്’ അല്ലെങ്കിൽ ‘എന്റെ ബന്ധനങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. അക്ഷരാർഥം ‘എന്റെ ചങ്ങലകൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: വന്ദനം
  rationale: കത്തിന്റെ അവസാനത്തിൽ പൗലോസ് നേരിട്ട് എഴുതുന്ന അഭിവാദനത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വന്ദനം’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: പൗലോസ് എന്ന ഞാൻ ... സ്വന്തം കൈകൊണ്ട് എഴുതുന്നു
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പ്രയോഗം പൗലോസ് തന്നെ സ്വന്തം കൈപ്പടയിൽ അവസാനവാക്കുകൾ എഴുതുന്നു എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ അർത്ഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘എഴുതുന്നു’ എന്ന ക്രിയ ചേർത്തിരിക്കുന്നു.
- source_word: μνημονεύετέ
  choice: ഓർക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന് തുടർച്ചയുടെ സൂചന ഉണ്ടായേക്കാമെങ്കിലും, ‘ഓർക്കുക’ എന്ന ലളിതമായ രൂപം ഉപദേശം സ്വാഭാവികമായി അറിയിക്കുന്നു; ക്രിയയുടെ ദൈർഘ്യഭാവം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: μου τῶν δεσμῶν
  choice: എന്റെ ചങ്ങലകൾ
  rationale: δεσμοί എന്നതിന്റെ മൂർത്തമായ ‘ചങ്ങലകൾ’ എന്ന ദൃശ്യബിംബം നിലനിർത്തുന്നു; ഇത് പൗലോസിന്റെ തടവിനെ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക പ്രയോഗവുമാണ്.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ പതിവായ ആശീർവാദവാക്യത്തിലെ പദം. മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ദൈവത്തിന്റെ’ എന്ന വിശേഷണം ചേർക്കുന്നില്ല.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശീർവാദം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തിരിക്കുന്നു; μετάയുടെ ‘കൂടെ’ എന്ന അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിയ വ്യക്തമാക്കാത്ത പൗലോസിന്റെ അവസാന ആശീർവാദം
  choice: കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  alternative: കൃപ നിങ്ങളോടുകൂടെ
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ ക്രിയ ഇല്ലെങ്കിലും മലയാളത്തിൽ ആശീർവാദവാക്യം സ്വാഭാവികവും പൂർണ്ണവുമാകാൻ ‘ഇരിക്കട്ടെ’ ചേർക്കുന്നു. ഇതിലൂടെ അധികമായ ദൈവശാസ്ത്ര ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കത്തുശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ആവശ്യമായ ക്രിയകൾ മാത്രം ചേർത്തു; ‘ചങ്ങലകൾ’ എന്ന മൂർത്തമായ ബിംബം സംരക്ഷിച്ചു.
