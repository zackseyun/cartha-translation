id: COL.4.7
reference: Colossians 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: ml
  text: പ്രിയ സഹോദരനും കർത്താവിൽ വിശ്വസ്തനായ ശുശ്രൂഷകനും സഹദാസനുമായ തിഹിക്കൊസ്, എന്നെ സംബന്ധിച്ച എല്ലാ കാര്യങ്ങളും[a] നിങ്ങളോടു അറിയിക്കും.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എന്നെക്കുറിച്ചുള്ള എല്ലാ കാര്യങ്ങളും” അല്ലെങ്കിൽ “എന്റെ എല്ലാ സാഹചര്യങ്ങളും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വസ്തനായ ദാസൻ” എന്നും പരിഭാഷപ്പെടുത്താം. διάκονος എന്ന ഗ്രീക്ക് പദത്തിന് ‘ശുശ്രൂഷകൻ,’ ‘ദാസൻ,’ ചില സന്ദർഭങ്ങളിൽ സഭാപദവിയായ ‘ഡീക്കൻ’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: c
    text: “കൂടെ ശുശ്രൂഷ ചെയ്യുന്നവൻ” അല്ലെങ്കിൽ “സഹഅടിമ” എന്നും പരിഭാഷപ്പെടുത്താം. σύνδουλος എന്ന ഗ്രീക്ക് പദം ബന്ധിതമായ സേവനത്തെയും ഒരേ യജമാനനുകീഴിലുള്ള പങ്കിട്ട നിലയെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: എന്നെ സംബന്ധിച്ച എല്ലാ കാര്യങ്ങളും
  rationale: പൗലോസിന്റെ സ്ഥിതി, കാര്യങ്ങൾ, സാഹചര്യങ്ങൾ എന്നിവയെ വിശാലമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γνωρίσει ὑμῖν
  choice: നിങ്ങളെ അറിയിക്കും
  rationale: γνωρίζω എന്ന ക്രിയയുടെ ‘അറിയിക്കുക’ എന്ന അർഥവും ὑμῖν എന്ന പരോക്ഷ കർമവും സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
- source_word: Τυχικὸς
  choice: തിഹിക്കൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: പ്രിയ സഹോദരൻ
  rationale: ἀγαπητός സൂചിപ്പിക്കുന്ന സ്നേഹവും ആദരവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ἀδελφός എന്ന ഏകവചന പുല്ലിംഗ പരാമർശം ‘സഹോദരൻ’ എന്ന് നൽകുന്നു.
- source_word: πιστὸς διάκονος
  choice: വിശ്വസ്തനായ ശുശ്രൂഷകൻ
  rationale: πιστός എന്നത് വിശ്വസ്തതയും ആശ്രയയോഗ്യതയും സൂചിപ്പിക്കുന്നു. διάκονος ഇവിടെ സഭാപദവിയായ ‘ഡീക്കൻ’ എന്ന് നിർബന്ധമായി വ്യക്തമല്ലാത്തതിനാൽ ശുശ്രൂഷ ചെയ്യുന്നവൻ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: σύνδουλος
  choice: സഹദാസൻ
  rationale: δοῦλος ഉൾക്കൊള്ളുന്ന അധീനതയുടെയും യജമാനനോടുള്ള ബന്ധിത സേവനത്തിന്റെയും ഭാവം ‘ദാസൻ’ നിലനിർത്തുന്നു; σύν- എന്ന ഘടകം ‘സഹ-’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: σύνδουλος / δοῦλος ഭാഷയുടെ പരിഭാഷ
  choice: സഹദാസൻ
  alternative: കൂടെ ശുശ്രൂഷ ചെയ്യുന്നവൻ; സഹഅടിമ
  rationale: ‘സഹദാസൻ’ എന്നത് ഒരേ കർത്താവിനുകീഴിലുള്ള ബന്ധിത സേവനവും പങ്കിട്ട നിലയും സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു. ‘സഹഅടിമ’ മൂലപദത്തിന്റെ ഉടമസ്ഥതാഭാവം കൂടുതൽ ശക്തമായി പ്രകടിപ്പിക്കുമെങ്കിലും ആധുനിക മലയാളത്തിൽ പ്രധാനമായും ക്രൂരമായ മനുഷ്യ അടിമത്തത്തെ മാത്രം ഓർമിപ്പിച്ച് സന്ദർഭത്തെ അനാവശ്യമായി ചുരുക്കാം; ‘കൂടെ ശുശ്രൂഷ ചെയ്യുന്നവൻ’ അധീനതയുടെ ഭാവം ദുർബലമാക്കുന്നു.
- issue: διάκονος ഒരു സഭാപദവിയാണോ പൊതുവായ ശുശ്രൂഷയാണോ
  choice: ശുശ്രൂഷകൻ
  alternative: ദാസൻ; ഡീക്കൻ
  rationale: ഈ സന്ദർഭം ഔദ്യോഗിക സഭാപദവി നിർണായകമായി സ്ഥാപിക്കുന്നില്ല. അതിനാൽ സേവനത്തിന്റെയും ശുശ്രൂഷയുടെയും അർഥം നിലനിർത്തി പദവിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വം പരിഹരിക്കാതെ വിടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ പദവിവരണങ്ങൾ സ്വാഭാവിക മലയാളക്രമത്തിൽ പേരിനു മുമ്പായി നൽകിയിരിക്കുന്നു. ‘കർത്താവിൽ’ എന്ന പൗലോസീയ പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തി നിലനിർത്തിയിരിക്കുന്നു.
