revisions:
- from: എന്നാൽ അവൻ നിന്നോട് എന്തെങ്കിലും അനീതി ചെയ്തിട്ടുണ്ടെങ്കിലോ നിനക്ക് എന്തെങ്കിലും കടപ്പെട്ടിട്ടുണ്ടെങ്കിലോ, അത് എന്റെ കണക്കിൽ ചേർത്തുകൊള്ളുക.[a]
  to: എന്നാൽ, അവൻ നിന്നോടു എന്തെങ്കിലും അന്യായം ചെയ്തിട്ടുണ്ടെങ്കിലോ നിനക്കു എന്തെങ്കിലും കടപ്പെട്ടിരിക്കുന്നെങ്കിലോ, അത് എന്റെ കണക്കിൽ ചുമത്തിക്കൊള്ളുക.[a]
