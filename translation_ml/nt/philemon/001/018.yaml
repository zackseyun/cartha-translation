  text: εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ⸀ἐλλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/018.yaml
  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: ml
  text: എന്നാൽ, അവൻ നിന്നോടു എന്തെങ്കിലും അന്യായം ചെയ്തിട്ടുണ്ടെങ്കിലോ നിനക്കു എന്തെങ്കിലും കടപ്പെട്ടിരിക്കുന്നെങ്കിലോ, അത് എന്റെ കണക്കിൽ ചുമത്തിക്കൊള്ളുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അത് എനിക്കു കണക്കാക്കുക.’ ഈ ക്രിയയ്ക്ക് ഒരു കാര്യമോ ബാധ്യതയോ ഒരാളുടെ കണക്കിൽ രേഖപ്പെടുത്തുക അഥവാ ചുമത്തുക എന്ന അക്കൗണ്ടിങ് അർഥമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: എന്നാൽ … എങ്കിലോ
  rationale: δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു; εἰ നിബന്ധന അവതരിപ്പിക്കുന്നു.
- source_word: τι ἠδίκησέν σε
  choice: അവൻ നിന്നോട് എന്തെങ്കിലും അനീതി ചെയ്തിട്ടുണ്ടെങ്കിൽ
  rationale: ἀδικέω വ്യക്തിപരമോ സാമ്പത്തികമോ ആയ ദോഷം പ്രത്യേകം നിർണയിക്കാതെ, ഒരാളോട് അന്യായം ചെയ്യുക എന്ന വിശാലമായ അർഥം നൽകുന്നു.
- source_word: ἢ ὀφείλει
  choice: അല്ലെങ്കിൽ നിനക്ക് എന്തെങ്കിലും കടപ്പെട്ടിട്ടുണ്ടെങ്കിൽ
  rationale: ὀφείλω കടമോ ബാധ്യതയോ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ പരോക്ഷകർമമായ ‘നിനക്ക്’ വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τοῦτο ἐμοὶ ἐλλόγα
  choice: അത് എന്റെ കണക്കിൽ ചേർത്തുകൊള്ളുക
  rationale: ἐλλογέω അക്കൗണ്ടിൽ രേഖപ്പെടുത്തുക അഥവാ ഒരാളുടെ കണക്കിൽ ചുമത്തുക എന്ന വാണിജ്യാർഥമുള്ള പദമാണ്; ഈ പരിഭാഷ ആ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനീതി ചെയ്തു’ എന്നത് കുറ്റത്തിന്റെ സ്വഭാവം അനാവശ്യമായി ചുരുക്കാതെ മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; ‘എന്റെ കണക്കിൽ ചേർത്തുകൊള്ളുക’ അക്കൗണ്ടിങ് രൂപകം സംരക്ഷിക്കുന്നു.
