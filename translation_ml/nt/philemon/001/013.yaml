id: PHM.1.13
reference: Philemon 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: ml
  text: അവനെ എന്റെ കൂടെ നിർത്തിക്കൊള്ളാൻ ഞാൻ ആഗ്രഹിച്ചിരുന്നു; സുവിശേഷത്തിന്റെ ചങ്ങലകളിൽ[a] കഴിയുന്ന എനിക്ക് നിന്നെ പ്രതിനിധീകരിച്ച് അവൻ സേവനം ചെയ്യേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സുവിശേഷം നിമിത്തമുള്ള ചങ്ങലകളിൽ”—അതായത്, സുവിശേഷം നിമിത്തം അനുഭവിക്കുന്ന ബന്ധനങ്ങൾ.
    reason: τοῦ εὐαγγελίου എന്ന genitive-ന് സുവിശേഷം കാരണമായുള്ള ബന്ധനം എന്ന causal അർഥം ഉണ്ടാകാം.
lexical_decisions:
- source_word: ὃν
  choice: അവനെ
  rationale: മുൻവാക്യത്തിൽ പരാമർശിച്ച ഒനേസിമൊസിനെ സൂചിപ്പിക്കുന്ന പുൽലിംഗ ഏകവചന കർമസംബന്ധ സർവനാമം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവനെ’ എന്നു നൽകുന്നു.
- source_word: ἐβουλόμην
  choice: ഞാൻ ആഗ്രഹിച്ചിരുന്നു
  rationale: ഭൂതകാലത്തിൽ നിലനിന്നിരുന്ന ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്ന imperfect രൂപത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς ἐμαυτὸν
  choice: എന്റെ കൂടെ
  rationale: κατέχειν എന്ന ക്രിയയോടൊപ്പം ഒരാളെ സ്വന്തം സാന്നിധ്യത്തിൽ നിലനിർത്തുക എന്ന ബന്ധപരമായ അർഥം നൽകുന്നു.
- source_word: κατέχειν
  choice: നിർത്താൻ
  rationale: ഒനേസിമൊസിനെ പൗലൊസ് തന്റെ കൂടെ തുടരാൻ അനുവദിക്കണമെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘തടഞ്ഞുവെക്കുക’ എന്ന അനാവശ്യ പ്രതികൂലഭാവം ഒഴിവാക്കുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ … ചെയ്യേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ പരിചയപ്പെടുത്തുന്ന ἵναയുടെ purposive ബലം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ σοῦ
  choice: നിനക്കുവേണ്ടി
  rationale: ഫിലേമോന്റെ പ്രയോജനത്തിനോ പ്രതിനിധിയായോ ഒനേസിമൊസ് സേവിക്കുന്നുവെന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ‘നിനക്കു പകരം’ എന്നതിലൂടെ പകരക്കാരൻ എന്ന ആശയം അതിരുകടന്ന് ഉറപ്പിക്കുന്നില്ല.
- source_word: μοι διακονῇ
  choice: എനിക്ക് … അവൻ സേവനം ചെയ്യേണ്ടതിന്
  rationale: പ്രായോഗിക സഹായം ഉൾപ്പെടുന്ന διακονέωയുടെ വിശാലമായ സേവനാർഥം നൽകുന്നു; പ്രത്യേക സഭാപദവിയുടെ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐν τοῖς δεσμοῖς
  choice: ചങ്ങലകളിൽ കഴിയുന്ന
  rationale: തടവിനെ സൂചിപ്പിക്കുമ്പോഴും δεσμοίയിലെ ദൃശ്യമായ ‘ചങ്ങലകൾ’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിന്റെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ genitive ബന്ധം നിലനിർത്തുകയും, ചങ്ങലകൾ സുവിശേഷം നിമിത്തമാണെന്ന causal വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τοῦ εὐαγγελίου എന്നത് δεσμοῖς എന്നതിനോടുള്ള ബന്ധം
  choice: സുവിശേഷത്തിന്റെ ചങ്ങലകൾ
  alternative: സുവിശേഷം നിമിത്തമുള്ള ചങ്ങലകൾ
  rationale: ഈ genitive പൗലൊസിന്റെ ബന്ധനം സുവിശേഷത്തോടു ബന്ധപ്പെട്ടതാണെന്നു പറയുന്നു; കാരണം നേരിട്ട് വ്യക്തമാക്കുന്ന വായന സാധ്യതയുള്ളതാണെങ്കിലും, മുഖ്യവാചകം ഗ്രീക്കിലെ സാന്ദ്രതയും അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷ’ എന്ന സഭാപരമായി ചുരുങ്ങിപ്പോകാവുന്ന പദത്തിനു പകരം വിശാലവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ‘സേവനം’ ഉപയോഗിച്ചു. ഏകവചന അഭിസംബോധനയായ σοῦ ‘നിനക്ക്’ എന്ന രൂപത്തിൽ നിലനിർത്തി.
