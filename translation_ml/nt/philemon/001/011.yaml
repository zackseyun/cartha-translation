id: PHM.1.11
reference: Philemon 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: ml
  text: മുമ്പ് നിനക്കു പ്രയോജനമില്ലാത്തവനായിരുന്ന അവൻ[a], എന്നാൽ ഇപ്പോൾ നിനക്കും എനിക്കും പ്രയോജനമുള്ളവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രയോജനമുള്ളവൻ’ എന്ന ആശയവുമായി ബന്ധമുള്ള ഒനേസിമോസ് എന്ന പേരിനെ ആസ്പദമാക്കി പൗലോസ് ഇവിടെ പദപ്രയോഗം നടത്തിയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: അവൻ
  rationale: മുൻവാക്യത്തിലെ ഒനേസിമോസിനെ അനാഫോറികമായി സൂചിപ്പിക്കുന്ന substantival article ആണ്; മലയാളത്തിൽ വാക്യം സ്വാഭാവികമായി തുടരാൻ ‘അവൻ’ യോജിക്കുന്നു.
- source_word: ποτέ
  choice: മുമ്പ്
  rationale: νυνί എന്ന ‘ഇപ്പോൾ’ എന്നതിനോടുള്ള കാലവ്യത്യാസം ലളിതമായും വ്യക്തമായും പ്രകടമാക്കുന്നു.
- source_word: σοι
  choice: നിനക്കു
  rationale: ἄχρηστον എന്ന വിശേഷണത്തോടുള്ള ദത്തിവിഭക്തിയുടെ വ്യക്തിപരമായ ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἄχρηστον
  choice: പ്രയോജനമില്ലാത്തവൻ
  rationale: ‘ഉപയോഗമില്ലാത്ത/പ്രയോജനമില്ലാത്ത’ എന്ന അടിസ്ഥാനാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും εὔχρηστον എന്നതുമായ നേരിട്ടുള്ള വിരുദ്ധത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: νυνὶ δὲ
  choice: ഇപ്പോൾ
  rationale: ‘മുമ്പ്… ഇപ്പോൾ’ എന്ന ഘടനയിൽ δέയുടെ വിരുദ്ധത മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘എന്നാൽ’ ചേർത്താൽ ഇവിടെ അനാവശ്യമായ ഭാരം വരാം.
- source_word: σοὶ καὶ ἐμοὶ
  choice: നിനക്കും എനിക്കും ഒരുപോലെ
  rationale: രണ്ട് ദത്തിവിഭക്തികളെയും വ്യക്തമായി നിലനിർത്തുകയും καί…καί സൂചിപ്പിക്കുന്ന ഉൾക്കൊള്ളുന്ന ജോടിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εὔχρηστον
  choice: പ്രയോജനമുള്ളവൻ
  rationale: ἄχρηστον എന്നതുമായ രൂപാർഥപരമായ വിരുദ്ധത വ്യക്തമാക്കുന്നു; ഒനേസിമോസ് എന്ന പേരുമായി ഉണ്ടായേക്കാവുന്ന പദപ്രയോഗവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒനേസിമോസ് എന്ന പേരിലെ സാധ്യതയുള്ള പദപ്രയോഗവും സംഭവിച്ച മാറ്റവും
  choice: പ്രധാനപാഠത്തിൽ ‘പ്രയോജനമില്ലാത്തവൻ/പ്രയോജനമുള്ളവൻ’ എന്ന ലളിതമായ വിരുദ്ധത നിലനിർത്തുക
  alternative: പദപ്രയോഗം മുൻനിർത്തി ‘ഇപ്പോൾ യഥാർഥത്തിൽ പ്രയോജനമുള്ളവൻ’ എന്നിങ്ങനെ വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കുക
  rationale: ഗ്രീക്ക് പാഠം തന്നെ വിരുദ്ധത വ്യക്തമാക്കുന്നു. കൂടുതൽ വിശദീകരിക്കാതെ നേരിട്ടുള്ള വിവർത്തനം സാഹിത്യപ്രഭാവവും സാധ്യതയുള്ള പേരുകളിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ‘മുമ്പ്/ഇപ്പോൾ’ കാലവ്യത്യാസവും ‘പ്രയോജനമില്ലാത്ത/പ്രയോജനമുള്ള’ പദവിരുദ്ധതയും വ്യക്തമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
