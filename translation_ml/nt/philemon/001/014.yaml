id: PHM.1.14
reference: Philemon 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ സമ്മതമില്ലാതെ ഒന്നും ചെയ്യാൻ ഞാൻ ആഗ്രഹിച്ചില്ല[a], നിന്റെ നന്മ നിർബന്ധത്താൽ ഉള്ളതുപോലെ അല്ലാതെ[b], സ്വമേധയായുള്ളതായിരിക്കേണ്ടതിന്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ അംഗീകാരമില്ലാതെ’ അല്ലെങ്കിൽ ‘നിന്റെ അഭിപ്രായമില്ലാതെ.’
    reason: lexical_alternative
  - marker: b
    text: ‘നിന്റെ നന്മ’ എന്നത് ഇവിടെ ‘നിന്റെ സൽപ്രവൃത്തി,’ ‘നിന്റെ ദയ,’ അല്ലെങ്കിൽ ‘നിന്റെ നന്മ’ എന്ന പൊതുവായ അർഥത്തിലും വരാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘സ്വമേധയായതനുസരിച്ച്’; അതായത്, ‘നിന്റെ സ്വന്തം ഇഷ്ടപ്രകാരം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: നിന്റെ സമ്മതമില്ലാതെ
  rationale: γνώμη എന്നതിന് അഭിപ്രായം, തീരുമാനം, അംഗീകാരം, സമ്മതം എന്നീ അർഥങ്ങൾ വരാം. ഒനേസിമൊസിനെ സംബന്ധിച്ച് ഫിലേമോന്റെ സ്വതന്ത്രമായ അനുമതിയില്ലാതെ പ്രവർത്തിക്കരുതെന്ന സന്ദർഭഭാവം ‘സമ്മതം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: ഒന്നും ചെയ്യാൻ ഞാൻ ആഗ്രഹിച്ചില്ല
  rationale: θέλω ഇവിടെ ഇച്ഛയെയും മനസ്സിനെയും സൂചിപ്പിക്കുന്നു. ‘തീരുമാനിച്ചില്ല’ എന്നതിനെക്കാൾ ‘ആഗ്രഹിച്ചില്ല’ മൂലത്തിലെ volitional ഭാവം നേരിട്ട് സൂക്ഷിക്കുന്നു.
- source_word: ἵνα μὴ ... ᾖ
  choice: അങ്ങനെ ... ആയിരിക്കാതെ ... ആയിരിക്കും
  rationale: ἵνα ഉദ്ദേശ്യഫലം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യബന്ധം നൽകുന്നതിനായി ‘അങ്ങനെ’ ഉപയോഗിച്ചു; നിഷേധവും വിരുദ്ധസമാന്തരതയും വാക്യത്തിൽ നിലനിർത്തി.
- source_word: ὡς κατὰ ἀνάγκην
  choice: നിർബന്ധത്താൽ എന്നപോലെ
  rationale: ἀνάγκη ഇവിടെ ബലപ്രയോഗമോ സമ്മർദമോ മൂലമുള്ള നിർബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ὡς നൽകുന്ന ‘എന്നപോലെ’ എന്ന മൃദൂകരണവും സംരക്ഷിച്ചു.
- source_word: τὸ ἀγαθόν σου
  choice: നിന്റെ നന്മ
  rationale: ഗ്രീക്ക് പ്രയോഗം ഫിലേമോന്റെ ഒരു നല്ല പ്രവൃത്തിയെയോ കൂടുതൽ അമൂർത്തമായ അവന്റെ നന്മയെയോ സൂചിപ്പിക്കാം. ‘നിന്റെ നന്മ’ ഈ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; സാദ്ധ്യമായ മൂർത്ത അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: സ്വമനസ്സാലുള്ളതായിരിക്കും
  rationale: ἑκούσιον എന്നത് നിർബന്ധത്തിനു വിരുദ്ധമായി സ്വമേധയാ, സ്വന്തം ഇഷ്ടപ്രകാരം ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്വമനസ്സാൽ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളമാണ്.
theological_decisions:
- issue: ഫിലേമോന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: നന്മ നിർബന്ധത്തിൽനിന്നല്ല, ഫിലേമോന്റെ സ്വന്തം മനസ്സിൽനിന്ന് ഉണ്ടാകണം എന്ന പൗലൊസിന്റെ ആശയം പ്രകടിപ്പിച്ചു; കൃത്യമായ പ്രവൃത്തി നിർവചിച്ചില്ല.
  alternative: ‘നിന്റെ സൽപ്രവൃത്തി’ അല്ലെങ്കിൽ ‘നിന്റെ ദയാപ്രവൃത്തി’ എന്ന് കൂടുതൽ മൂർത്തമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: τὸ ἀγαθόν σου ഒരു പ്രത്യേക നല്ല പ്രവൃത്തിയെയും പൊതുവായ നന്മയെയും സൂചിപ്പിക്കാവുന്നതിനാൽ, മുഖ്യപാഠത്തിൽ ആ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കുകയും അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യത നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സമ്മതം’, ‘നിർബന്ധം’, ‘സ്വമനസ്സാൽ’ എന്നീ പദങ്ങൾ മൂലത്തിലെ അനുമതി–നിർബന്ധം–സ്വമേധാ എന്ന വിരുദ്ധത തെളിഞ്ഞു നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
