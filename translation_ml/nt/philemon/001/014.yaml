  to: എന്നാൽ നിന്റെ സമ്മതമില്ലാതെ ഒന്നും ചെയ്യാൻ ഞാൻ ആഗ്രഹിച്ചില്ല[a], നിന്റെ നന്മ നിർബന്ധത്താൽ ഉള്ളതുപോലെ അല്ലാതെ[b], സ്വമേധയായുള്ളതായിരിക്കേണ്ടതിന്[c].
