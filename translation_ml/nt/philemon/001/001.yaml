id: PHM.1.1
reference: Philemon 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: ml
  text: 'മശീഹയായ[b] യേശുവിന്റെ തടവുകാരനായ[a] പൗലോസും നമ്മുടെ സഹോദരനായ തിമൊഥെയോസും, ഞങ്ങളുടെ പ്രിയ സഹപ്രവർത്തകനായ ഫിലേമോന് എഴുതുന്നത്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹയായ യേശുവിനുവേണ്ടി തടവുകാരനായ പൗലോസ്.” ഗ്രീക്കിലെ ജനിറ്റീവ് രൂപം മശീഹയായ യേശുവുമായുള്ള ബന്ധത്തെയോ അവനെച്ചൊല്ലിയുള്ള തടവിന്റെ കാരണത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്ക്: “ക്രിസ്തു.” ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ “മശീഹ” എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: തടവുകാരൻ
  rationale: ബന്ധനത്തിലോ തടവിലോ കഴിയുന്ന ഒരാളെ സൂചിപ്പിക്കുന്ന നാമം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ തുല്യപദമാണിത്.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ പദവിയായി ഗ്രഹിച്ച് ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധത്തിന് ‘മശീഹയായ യേശു’ എന്ന ഘടന ഉപയോഗിച്ചു. ജനിറ്റീവിന്റെ ചുരുക്കവും അവ്യക്തതയും പ്രധാനവാചകത്തിൽ നിലനിർത്തി.
- source_word: ὁ ἀδελφὸς
  choice: നമ്മുടെ സഹോദരൻ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ആ സഹോദരൻ’ എന്നാണെങ്കിലും, ക്രൈസ്തവ കുടുംബബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ സന്ദർഭസൂചിതമായ ‘നമ്മുടെ’ ചേർത്തു.
- source_word: ἀγαπητῷ
  choice: പ്രിയ
  rationale: സ്നേഹവും അടുപ്പവും പ്രകടിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: συνεργῷ
  choice: സഹപ്രവർത്തകൻ
  rationale: ഒരുമിച്ചു പ്രവർത്തിക്കുന്ന ഒരാളെ കൃത്യമായി സൂചിപ്പിക്കുകയും പൗലോസിന്റെ ശുശ്രൂഷാസന്ദർഭത്തിലെ കൂട്ടായ അധ്വാനത്തിന്റെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡμῶν
  choice: ഞങ്ങളുടെ
  rationale: പൗലോസിനെയും തിമൊഥെയോസിനെയും ഉൾക്കൊള്ളുന്ന ബഹുവചന ഉടമസ്ഥസർവനാമം നിലനിർത്തുന്നു.
- source_word: Φιλήμονι
  choice: ഫിലേമോന്
  rationale: ലേഖനാഭിവാദ്യത്തിലെ സംപ്രദാനിക വിഭക്തി മലയാളത്തിലെ ‘-ന്’ രൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
- source_word: καὶ Τιμόθεος
  choice: തിമൊഥെയോസും
  rationale: തിമൊഥെയോസിനെ പൗലോസിനോടൊപ്പം സഹപ്രേഷകനായി ചേർക്കുന്ന καί മലയാളത്തിലെ ‘-ഉം’ കൊണ്ട് പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ ലേഖനാരംഭത്തിൽ Χριστός എന്നത് പദവിയുടെ അർഥം വ്യക്തമായി വഹിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; പതിവുപേരുപോലെ മാത്രം വായിക്കപ്പെടാൻ ഇടയുള്ള ‘ക്രിസ്തു’ പ്രധാനവാചകത്തിൽ സ്വീകരിച്ചില്ല.
- issue: δέσμιος Χριστοῦ Ἰησοῦ എന്ന ജനിറ്റീവ് ബന്ധം
  choice: മശീഹയായ യേശുവിന്റെ തടവുകാരൻ
  alternative: മശീഹയായ യേശുവിനുവേണ്ടി തടവുകാരനായവൻ
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് യേശുവുമായുള്ള ബന്ധമോ യേശുവിനെച്ചൊല്ലിയുള്ള തടവിന്റെ കാരണമോ സൂചിപ്പിക്കാം. പ്രധാനവാചകം ഈ ചുരുക്കവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; കാരണാർഥ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ ലേഖനാരംഭശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് വാക്യഘടനയുടെ ഔപചാരിക ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ‘എഴുതുന്നത്:’ എന്ന സമാപനം ചേർത്തു. പേരുകൾ മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ബൈബിൾരൂപങ്ങളിൽ ലിപ്യന്തരിച്ചു.
