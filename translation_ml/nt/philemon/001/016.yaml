id: PHM.1.16
reference: Philemon 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: ml
  text: ഇനി അടിമയായി[a] മാത്രമല്ല, അടിമയെക്കാൾ മേലായ—പ്രിയ സഹോദരനായി. അവൻ എനിക്ക് വിശേഷാൽ പ്രിയനാണ്; എന്നാൽ ജഡത്തിലും[b] കർത്താവിലും അവൻ നിനക്ക് എത്രയധികം പ്രിയനായിരിക്കും!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടിമ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദത്തിന് ‘സേവകൻ’ അല്ലെങ്കിൽ ‘ബന്ധിതദാസൻ’ എന്നും അർഥമാകാം. ഇവിടെ ഒനേസിമൊസിന്റെ സാമൂഹികമായി ബന്ധിതമായ അവസ്ഥയെയാണ് അത് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘ജഡത്തിൽ’ എന്നത് ഇവിടെ ‘പാപസ്വഭാവത്തിൽ’ എന്നല്ല; ഭൗമികമോ സാമൂഹികമോ ആയ ബന്ധത്തിൽ, അല്ലെങ്കിൽ നേരിട്ടുള്ള വ്യക്തിബന്ധത്തിൽ, എന്നായിരിക്കാം അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: ഇനി അടിമയായി മാത്രമല്ല
  rationale: οὐκέτι മുൻസ്ഥിതിയിൽനിന്നുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു. ὡς δοῦλον എന്നത് ഒനേസിമൊസിന്റെ സാമൂഹികമായി ബന്ധിതമായ നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അടിമയായി’ എന്നു നൽകി; ‘മാത്രം’ ചേർത്തത് തുടർന്നുള്ള ὑπὲρ δοῦλον എന്ന താരതമ്യത്തോടുള്ള സ്വാഭാവിക മലയാളബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ δοῦλον
  choice: അടിമയെക്കാൾ മേലായി
  rationale: ὑπέρ ഇവിടെ പകരം എന്നല്ല, നിലയിലും വിലയിലും അതിക്രമിക്കുന്ന താരതമ്യമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: പ്രിയ സഹോദരനായി
  rationale: ക്രിസ്തീയ സമൂഹത്തിലെ കുടുംബബന്ധരൂപകം നേരിട്ട് നിലനിർത്തുകയും ἀγαπητός സ്വാഭാവികമായി ‘പ്രിയ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: μάλιστα ἐμοί
  choice: എനിക്ക് വിശേഷാൽ പ്രിയനാണ്
  rationale: μάλιστα പ്രത്യേക അളവോ മുൻഗണനയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യബന്ധം സ്വാഭാവികമാക്കാൻ ‘പ്രിയൻ’ എന്ന ആശയം ആവർത്തിച്ചു.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: എന്നാൽ ... നിനക്ക് എത്രയധികം പ്രിയനായിരിക്കും!
  rationale: ഗ്രീക്കിലെ ശക്തമായ താരതമ്യാത്മക വാക്ചാതുര്യം ‘എത്രയധികം’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ
  choice: ജഡത്തിലും കർത്താവിലും
  rationale: പൗലോസിന്റെ രണ്ടു മേഖലകളെ സൂചിപ്പിക്കുന്ന സമാന്തരപ്രയോഗവും അതിലെ വ്യാഖ്യാനസാധ്യതയും ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഒനേസിമൊസിന്റെ പശ്ചാത്തലത്തിൽ δοῦλος എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ / ബന്ധിതദാസൻ
  rationale: കത്തിന്റെ സാമൂഹിക-നിയമപര പശ്ചാത്തലത്തിൽ ബന്ധിതാവസ്ഥ പ്രധാനമാണ്. ‘അടിമ’ ആ യാഥാർഥ്യവും ‘അടിമയെക്കാൾ മേലായി’ എന്ന വൈരുധ്യത്തിന്റെ ശക്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: ἐν σαρκὶ καὶ ἐν κυρίῳ എന്നതിന്റെ അർഥം
  choice: ജഡത്തിലും കർത്താവിലും
  alternative: ലൗകികബന്ധത്തിലും കർത്താവിലും / നേരിട്ടുള്ള ബന്ധത്തിലും കർത്താവിലും
  rationale: ഇത് മാനുഷിക-സാമൂഹിക ബന്ധത്തെയും കർത്താവിലുള്ള ആത്മീയബന്ധത്തെയും സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിൽ പൗലോസിന്റെ രൂപം നിലനിർത്തി, സാധ്യതയുള്ള അർഥങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἀδελφός എന്ന ബന്ധപദത്തിന്റെ അവതരണം
  choice: സഹോദരൻ
  alternative: സഹവിശ്വാസി
  rationale: ‘സഹോദരൻ’ കുടുംബരൂപകവും ക്രിസ്തീയ സമൂഹത്തിലെ പുതിയ ബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു; ലിംഗനിഷ്പക്ഷമായി പരാവർത്തനം ചെയ്ത് രൂപകത്തിന്റെ ശക്തി നഷ്ടപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡം’ എന്ന പൗലോസീയ പദപ്രയോഗം വ്യാഖ്യാനപരമായ തുറന്ന നില സംരക്ഷിക്കാൻ മുഖ്യപാഠത്തിൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുകുറികളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
