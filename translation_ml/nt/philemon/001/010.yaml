  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: ml
  text: എന്റെ ബന്ധനങ്ങളിൽ[a] ഞാൻ ജനിപ്പിച്ച എന്റെ മകനായ ഒനേസിമോസിനെക്കുറിച്ച് ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘എന്റെ ബന്ധനങ്ങളിൽ ഞാൻ ജനിപ്പിച്ചവൻ.’ ഒനേസിമോസുമായുള്ള തന്റെ ആത്മീയബന്ധം വിവരിക്കാൻ ഗ്രീക്ക് ജനനം/ജനിപ്പിക്കൽ എന്ന രൂപകം ഉപയോഗിക്കുന്നു. ‘ബന്ധനങ്ങളിൽ’ എന്നത് ‘തടവിലായിരിക്കുമ്പോൾ’ എന്നും മനസ്സിലാക്കാം; ഗ്രീക്ക് ബന്ധനങ്ങളുടെ മൂർത്തമായ ചിത്രം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: അപേക്ഷിക്കുന്നു
  rationale: വെറുമൊരു ചോദിക്കലോ ആജ്ഞയോ അല്ല, വ്യക്തിപരവും ഹൃദയംഗമവുമായ അഭ്യർഥനയാണ് ഇവിടെ; ‘അപേക്ഷിക്കുന്നു’ കത്തിന്റെ ബന്ധപരമായ സ്വരം നിലനിർത്തുന്നു.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: എന്റെ കുഞ്ഞായ ഒനേസിമോസിനുവേണ്ടി
  rationale: περί + genitive ഇവിടെ അഭ്യർഥനയുടെ വിഷയത്തെയോ ആർക്കുവേണ്ടിയാണെന്നതെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒനേസിമോസിനുവേണ്ടി’ സ്വാഭാവികമാണ്; ‘എന്റെ കുഞ്ഞ്’ എന്നത് സ്നേഹപൂർവമായ ആത്മീയ ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: τέκνου
  choice: കുഞ്ഞ്
  rationale: τέκνον ലിംഗനിർണ്ണയം ചെയ്യാതെ ‘child’ എന്ന അർഥം നൽകുന്നു. ‘മകൻ’ സാധ്യമെങ്കിലും, ‘കുഞ്ഞ്’ മൂലപദത്തിന്റെ വ്യാപ്തിയും പൗലോസിന്റെ വാത്സല്യവും നന്നായി നിലനിർത്തുന്നു.
- source_word: ὃν ἐγέννησα
  choice: ഞാൻ അവന് പിതാവായിത്തീർന്നു
  rationale: γεννάωയിലെ ജനിപ്പിക്കൽ/പിതൃത്വ രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ആത്മീയ പരിവർത്തനം എന്ന് മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് മൂലപാഠത്തേക്കാൾ അർഥം ചേർക്കുന്നില്ല.
- source_word: ἐν τοῖς δεσμοῖς
  choice: എന്റെ ബന്ധനങ്ങളിൽവെച്ച്
  rationale: δεσμοί എന്നതിലെ മൂർത്തമായ ‘ബന്ധനങ്ങൾ/ചങ്ങലകൾ’ എന്ന ചിത്രം നിലനിർത്തുന്നു; തടവിലായ അവസ്ഥയും ഇതിലൂടെ സൂചിപ്പിക്കപ്പെടുന്നു.
- source_word: Ὀνήσιμον
  choice: ഒനേസിമോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളത്തിലെ പതിവ് ബൈബിൾ ലിപ്യന്തരണരീതിക്ക് അനുസരിച്ച് നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: പൗലോസും ഒനേസിമോസും തമ്മിലുള്ള ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ആത്മീയ പിതൃത്വത്തിന്റെ ജനിപ്പിക്കൽ രൂപകം നിലനിർത്തി ‘അവന് പിതാവായിത്തീർന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: എന്റെ ബന്ധനങ്ങളിൽവെച്ച് ഞാൻ വിശ്വാസത്തിലേക്കു നയിച്ച ഒനേസിമോസ്
  rationale: വാക്യം ഒനേസിമോസ് പൗലോസിലൂടെ വിശ്വാസത്തിലേക്കു വന്നുവെന്ന് ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് അത് വ്യക്തമായ പരിവർത്തനഭാഷയിൽ അല്ല, ἐγέννησα എന്ന രൂപകത്തിലൂടെയാണ് പറയുന്നത്. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സൂചന വിശദീകരിച്ച് ചേർക്കാതെ രൂപകം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കുഞ്ഞ്’ വാത്സല്യസ്വരം നൽകുന്നു; ‘പിതാവായിത്തീർന്നു’ എന്നത് പഴഞ്ചൻ ‘ജനിപ്പിച്ചു’ എന്ന പ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായി രൂപകത്തെ അറിയിക്കുന്നു. രണ്ടു അടിക്കുറിപ്പ് സൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
