- from: എന്റെ കുഞ്ഞായ ഒനേസിമോസിനുവേണ്ടി ഞാൻ നിന്നോട് അപേക്ഷിക്കുന്നു; എന്റെ ബന്ധനങ്ങളിൽവെച്ച് ഞാൻ അവന് പിതാവായിത്തീർന്നു[a], [b]
