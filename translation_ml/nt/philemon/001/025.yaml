  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: ml
  text: കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളുടെ ആത്മാവിനോടുകൂടെ ഇരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങളുടെ’ എന്നത് ഗ്രീക്കിൽ ബഹുവചനമാണ്; അതിനാൽ ഈ സമാപനാശീർവാദം ഫിലേമോനു മാത്രമല്ല, ലേഖനത്തിന്റെ മറ്റു സ്വീകർത്താക്കൾക്കും ബാധകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ സൗജന്യമായ അനുഗ്രഹപൂർണ പ്രീതിയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവ് ആശീർവാദപദം; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിലും സ്വാഭാവികവും അർത്ഥസമ്പന്നവുമാണ്.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: യേശുവിന്റെ അധികാരവും ക്രിസ്തുവിഷയക സ്ഥാനവും നിലനിർത്തുന്നു; തുടർന്നുവരുന്ന പേരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ വിശേഷണരൂപം ഉപയോഗിച്ചു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തുവിന്റെ
  rationale: മലയാളത്തിൽ Χριστός എന്ന പദത്തിന്റെ പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാക്കപ്പെടുന്നതുമായ രൂപം ‘ക്രിസ്തു’ ആണ്; ഇവിടെ അനുഗ്രഹസൂത്രത്തിൽ സംയുക്തനാമംപോലെ സ്വാഭാവികമായി വായിക്കപ്പെടുമ്പോഴും അഭിഷിക്തൻ എന്ന സ്ഥാനാർഥം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: μετὰ
  choice: -നോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശീർവാദവാക്യം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തു; μετὰയുടെ സഹവർത്തിത്വാർഥം ‘-നോടുകൂടെ’ നിലനിർത്തുന്നു.
- source_word: πνεύματος
  choice: ആത്മാവ്
  rationale: സ്വീകർത്താക്കളുടെ ആന്തരിക വ്യക്തിത്വത്തെയോ ആത്മാവിനെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; പരിശുദ്ധാത്മാവാണെന്ന് അനാവശ്യമായി നിർണയിക്കുന്ന രൂപം ഒഴിവാക്കി.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിന്റെ അർഥം മലയാളത്തിലെ ‘നിങ്ങളുടെ’ നേരിട്ടും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ അവതരണം
  choice: ക്രിസ്തു
  alternative: മശീഹാ / അഭിഷിക്തൻ
  rationale: ഈ സമാപന ആശീർവാദത്തിൽ മലയാള വായനക്കാർക്ക് സ്വാഭാവികവും സ്ഥിരപ്രയോഗവുമായ ‘യേശുക്രിസ്തു’ ഉപയോഗിച്ചു. മൂലപദത്തിന്റെ സ്ഥാനാർഥം അംഗീകരിച്ചുകൊണ്ടുതന്നെ, ഇവിടെ ‘മശീഹാ’ എന്ന് മാറ്റുന്നത് മലയാളത്തിൽ അനാവശ്യമായ ശൈലിവ്യതിയാനം സൃഷ്ടിക്കാം.
- issue: ‘നിങ്ങളുടെ ആത്മാവ്’ എന്നതിലെ ആത്മാവിന്റെ സൂചന
  choice: സ്വീകർത്താക്കളുടെ ആത്മാവ്/ആന്തരിക വ്യക്തിത്വം
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: ὑμῶν എന്ന ഉടമസ്ഥ ബഹുവചനം സ്വീകർത്താക്കളുടെ ആത്മാവിലേക്കാണ് സ്വാഭാവികമായി വിരൽചൂണ്ടുന്നത്. എങ്കിലും വിവർത്തനം അധിക വ്യാഖ്യാനം ചേർക്കാതെ മൂലവാക്യത്തിന്റെ ചുരുക്കവും തുറന്ന നിലയും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. പരമ്പരാഗതമായി പരിചിതമായ ‘കൃപ’, ‘കർത്താവ്’, ‘യേശുക്രിസ്തു’, ‘ആത്മാവ്’ എന്നീ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
