  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: ml
  text: മശീഹയായ യേശുവിൽ[a] എന്റെ സഹതടവുകാരനായ എപ്പഫ്രാസ് നിനക്കു വന്ദനം അറിയിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: ‘ക്രിസ്തുയേശുവിൽ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: വന്ദനം അറിയിക്കുന്നു
  rationale: ἀσπάζομαι എന്ന ക്രിയ ഇവിടെ ഒരാൾ മറ്റൊരാൾക്ക് അഭിവാദ്യം അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: σε
  choice: നിനക്കു
  rationale: ഗ്രീക്കിൽ രണ്ടാംപുരുഷ ഏകവചനമാണ്; ഫിലേമോനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതിനാൽ മലയാളത്തിലും ഏകവചനം നിലനിർത്തി.
- source_word: Ἐπαφρᾶς
  choice: എപ്പഫ്രാസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പതിവനുസരിച്ച് ലിപ്യന്തരണം ചെയ്തു.
- source_word: ὁ συναιχμάλωτός μου
  choice: എന്റെ സഹതടവുകാരനായ
  rationale: συναιχμάλωτος എന്നത് മറ്റൊരാളോടൊപ്പം തടവിലായവനെ സൂചിപ്പിക്കുന്നു. ‘സഹതടവുകാരൻ’ അർഥം കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν എന്നതിലെ പൗലോസിന്റെ ബന്ധം/ഐക്യം സൂചിപ്പിക്കുന്ന ഭാഷ ‘-യിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. Χριστός ഇവിടെ പദവിനാമത്തിന്റെ അർഥഭാരം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നും, മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മശീഹയായ യേശു’ എന്നും നൽകി.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ എന്ന പൗലോസിന്റെ പ്രയോഗത്തിൽ Χριστῷ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: Χριστός എന്നതിന്റെ പദവിനാമാർഥം ഇവിടെ തെളിഞ്ഞുനിൽക്കുന്നതിനാൽ ‘മശീഹ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു. അതേസമയം സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ἐν എന്നത് ‘വേണ്ടി’ എന്നാക്കി വ്യാഖ്യാനിക്കാതെ ‘-യിൽ’ എന്നു നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഏകവചന അഭിസംബോധന ‘നിനക്കു’ എന്നു വ്യക്തമായി നിലനിർത്തിയിട്ടുണ്ട്; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയിരിക്കുന്നു.
