id: PHM.1.17
reference: Philemon 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്നെ ഒരു പങ്കാളിയായി നീ കരുതുന്നെങ്കിൽ, എന്നെ സ്വീകരിക്കുന്നതുപോലെ അവനെയും സ്വീകരിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനെ സ്വാഗതം ചെയ്യുക.’ മൂലഭാഷയിലെ ക്രിയയ്ക്ക് ഒരാളെ അനുകൂലമായി സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക, അല്ലെങ്കിൽ കൂട്ടായ്മയിലേക്ക് അംഗീകരിക്കുക എന്ന അർഥമുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: അതുകൊണ്ട്, ... എങ്കിൽ
  rationale: οὖν എന്നതിന്റെ നിഗമനാത്മക ബന്ധവും εἰ എന്ന വ്യവസ്ഥയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔχεις κοινωνόν
  choice: എന്നെ ഒരു പങ്കാളിയായി നീ കരുതുന്നു
  rationale: κοινωνός പങ്കുചേരുന്നവനെയോ സഹപങ്കാളിയെയോ സൂചിപ്പിക്കുന്നു. ἔχεις എന്ന പ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം സ്വാഭാവികമായി അറിയിക്കാൻ ‘കരുതുന്നു’ ഉപയോഗിച്ചു.
- source_word: προσλαβοῦ
  choice: സ്വീകരിക്കുക
  rationale: ക്രിയയ്ക്ക് അനുകൂലമായി സ്വീകരിക്കുക, സ്വാഗതം ചെയ്യുക, കൂട്ടായ്മയിലേക്ക് അംഗീകരിക്കുക എന്നീ അർഥവ്യാപ്തിയുണ്ട്; ‘സ്വീകരിക്കുക’ ഈ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: സന്ദർഭത്തിൽ ഒനേസിമൊസിനെ സൂചിപ്പിക്കുന്ന കർമസർവനാമം.
- source_word: ὡς ἐμέ
  choice: എന്നെ സ്വീകരിക്കുന്നതുപോലെ
  rationale: ὡς എന്ന താരതമ്യബലത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കാൻ സന്ദർഭത്തിൽനിന്ന് ‘സ്വീകരിക്കുന്ന’ എന്ന ക്രിയ ആവർത്തിച്ചു.
theological_decisions:
- issue: κοινωνός എന്ന പദത്തിന്റെ ബന്ധപരമായ അർഥം
  choice: പങ്കാളി
  alternative: കൂട്ടാളി; സഹപങ്കാളി; പങ്കുചേരുന്നവൻ
  rationale: പൗലൊസും ഫിലേമോനും തമ്മിലുള്ള പങ്കാളിത്തവും പരസ്പരബന്ധവും ‘പങ്കാളി’ വ്യക്തമായി അറിയിക്കുന്നു; സാങ്കേതികമായ സഭാപരമോ വിഭാഗീയമോ ആയ അർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലൊസിന്റെ വ്യവസ്ഥാപരമായ അഭ്യർഥനയും ബന്ധപരമായ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
