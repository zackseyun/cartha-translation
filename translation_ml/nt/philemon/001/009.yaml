id: PHM.1.9
reference: Philemon 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: ml
  text: സ്നേഹം നിമിത്തം ഞാൻ മറിച്ച് അപേക്ഷിക്കുന്നു—പൗലോസ് എന്ന ഞാൻ, ഒരു വൃദ്ധനും ഇപ്പോൾ മശീഹ യേശുവിന്റെ തടവുകാരനും ആയിരിക്കെ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: സ്നേഹം നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണമോ പ്രേരണയോ സൂചിപ്പിക്കുന്നു. ‘സ്നേഹം നിമിത്തം’ ഈ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μᾶλλον παρακαλῶ
  choice: കല്പിക്കുന്നതിനുപകരം അപേക്ഷിക്കുകയാണ്
  rationale: മുൻവാക്യത്തിലെ കല്പിക്കാനുള്ള അധികാരത്തോടുള്ള താരതമ്യം μᾶλλον സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വെറും ‘പകരം’ എന്നു പറഞ്ഞാൽ താരതമ്യത്തിന്റെ മറുവശം അവ്യക്തമാകുന്നതിനാൽ, സന്ദർഭത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്ന ‘കല്പിക്കുക’ ചേർത്ത് വൈരുധ്യം സ്വാഭാവികമാക്കി; παρακαλῶ വ്യക്തിപരമായ അഭ്യർഥനയായതിനാൽ ‘അപേക്ഷിക്കുകയാണ്’ എന്നു നൽകി.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: പൗലോസ് എന്ന ഞാൻ ... ആയിരിക്കെ
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും അല്പം ദുർഗ്രഹവുമാണ്. സ്വയം പരിചയപ്പെടുത്തുന്ന ഊന്നൽ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ പുനഃക്രമീകരിച്ചു.
- source_word: πρεσβύτης
  choice: ഒരു വൃദ്ധൻ
  rationale: ഈ പദത്തിന്റെ സ്വാഭാവിക അർഥം പ്രായംചെന്ന പുരുഷൻ എന്നതാണ്. സഭാപദവിയായ ‘മൂപ്പൻ’ എന്നോ വ്യത്യസ്ത ഗ്രീക്ക് പദത്തെ ആശ്രയിച്ചുള്ള ‘സ്ഥാനപതി’ എന്നോ വിവർത്തനം ചെയ്യുന്നത് ഇവിടെ യോജിക്കുന്നില്ല.
- source_word: νυνὶ δὲ καὶ
  choice: ഇപ്പോൾ ... ഉം
  rationale: νυνίയുടെ കാലസൂചനയും καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും ‘ഇപ്പോൾ ... ഉം’ എന്ന ഘടനയിൽ പ്രതിഫലിപ്പിച്ചു.
- source_word: δέσμιος
  choice: തടവുകാരൻ
  rationale: തടവിലാക്കപ്പെട്ട വ്യക്തിയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദമാണിത്.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി കേൾക്കുന്നതിനാൽ ‘മശീഹ’ ഉപയോഗിച്ചു. മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘മശീഹയായ യേശു’ എന്നു രൂപപ്പെടുത്തി.
theological_decisions:
- issue: πρεσβύτης എന്ന പദത്തിന്റെ അർഥം
  choice: ഒരു വൃദ്ധൻ
  alternative: ഒരു സ്ഥാനപതി; ഒരു മൂപ്പൻ
  rationale: SBLGNTയിലെ πρεσβύτης സാധാരണയായി പ്രായംചെന്ന പുരുഷനെ സൂചിപ്പിക്കുന്നു. ‘സ്ഥാനപതി’ എന്ന അർഥത്തിന് സാധാരണ പ്രതീക്ഷിക്കപ്പെടുന്നത് πρεσβευτής എന്ന വേറൊരു പദമാണ്; ‘മൂപ്പൻ’ സഭാപദവി അനാവശ്യമായി ഇറക്കുമതി ചെയ്യും.
- issue: Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ ബന്ധപ്രയോഗത്തിലും അഭിഷിക്തനായ രാജാവെന്ന പദവിയുടെ അർഥം സജീവമായി നിലനിൽക്കുന്നു; അതിനാൽ അർഥവിവർത്തനമായ ‘മശീഹ’ സ്വീകരിച്ചു.
- issue: δέσμιος Χριστοῦ Ἰησοῦ എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: മശീഹയായ യേശുവിന്റെ തടവുകാരൻ
  alternative: മശീഹയായ യേശുവിനുവേണ്ടി തടവിലായവൻ
  rationale: ഗ്രീക്ക് genitive ബന്ധം ഉടമസ്ഥത, സേവനം, അല്ലെങ്കിൽ യേശുവിനുവേണ്ടിയുള്ള തടവ് എന്നിങ്ങനെ വ്യാഖ്യാനിക്കാവുന്നതാണ്. മൂലത്തിലെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും സംരക്ഷിക്കാൻ നേരിട്ടുള്ള genitive ഘടന നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘരേഖ നിലനിർത്തി. ‘τοιοῦτος ὢν ὡς Παῦλος’ എന്ന കൃത്രിമമായി തോന്നാവുന്ന പദാനുപദ ഘടനയ്ക്ക് പകരം, അർഥം സംരക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളവാക്യക്രമം ഉപയോഗിച്ചു. ആവശ്യമായില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകൾ ചേർത്തിട്ടില്ല.
