id: PHM.1.3
reference: Philemon 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്നും, കൂടാതെ കർത്താവായ യേശു മശീഹയിൽനിന്നും, നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യേശുക്രിസ്തു.” ഗ്രീക്കിലെ Χριστός എന്ന പദം “മശീഹ” എന്ന പദവിയായോ, ചില സന്ദർഭങ്ങളിൽ “ക്രിസ്തു” എന്ന നാമസദൃശ പ്രയോഗമായോ പ്രവർത്തിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ലേഖനാഭിവാദ്യത്തിൽ ഈ പദത്തിനുള്ള അഭിവാദ്യധ്വനിയും ദൈവശാസ്ത്രപരമായ സമൃദ്ധിയും നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ദാതൃവിഭക്തിയുടെ അഭിവാദ്യപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: അഭിവാദ്യത്തിന്റെ അർഥവും ശാലോം എന്ന പശ്ചാത്തലത്തിന്റെ വിശാലമായ ധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἀπὸ
  choice: —യിൽനിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടം സൂചിപ്പിക്കുന്നു; ഏകമായ ἀπό രണ്ടു സമന്വയിത ഉറവിടങ്ങളോടും മലയാളത്തിൽ വ്യക്തമായി ചേർത്തു.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: പദസമുച്ചയത്തെ വിശേഷണസമാനാധികരണമായി വായിച്ച്, 'God our Father' എന്ന സ്വാഭാവിക അർഥം മലയാളത്തിൽ നൽകുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ബഹുമാനസൂചകവും ക്രിസ്തുശാസ്ത്രപരവുമായ ശക്തി ഒരുപോലെ നിലനിർത്തുന്ന പതിവ് മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: യേശു എന്ന നാമം ലിപ്യന്തരം ചെയ്യുകയും Χριστός എന്ന അഭിഷിക്തനായ രാജാവിന്റെ പദവി 'മശീഹ'യായി അർഥസൂചകമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ എങ്ങനെ നൽകണം
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ പദവിയായുള്ള അർഥം വഹിക്കാനിടയുള്ളതിനാൽ 'മശീഹ' അത് തുറന്നുകാട്ടുന്നു; എന്നാൽ പൗലോസിന്റെ പതിവ് പ്രയോഗത്തിൽ അത് നാമസദൃശമായും ഗ്രഹിക്കാവുന്നതുകൊണ്ട് പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സ്വാഭാവികവുമായ മലയാളം. മൂലത്തിലെ അനുഗ്രഹാശംസ മലയാളത്തിൽ പൂർണമാക്കാൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തിരിക്കുന്നു; ദൈവവും കർത്താവായ യേശു മശീഹയും കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടങ്ങളായി സമാന്തരമായി നിലനിർത്തിയിരിക്കുന്നു.
