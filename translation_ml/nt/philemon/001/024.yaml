base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: ml
  text: മർക്കോസ്, അരിസ്തർഖോസ്, ദേമാസ്, ലൂക്കോസ്—എന്റെ സഹപ്രവർത്തകർ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: മർക്കോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Ἀρίσταρχος
  choice: അരിസ്തർഖോസ്
  rationale: ഗ്രീക്ക് ഉച്ചാരണരൂപത്തോട് അടുത്തുനിൽക്കുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Δημᾶς
  choice: ദേമാസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ സ്വാഭാവിക മലയാള ലിപ്യന്തരണം.
- source_word: Λουκᾶς
  choice: ലൂക്കോസ്
  rationale: ഗ്രീക്ക് നാമരൂപത്തോട് അടുത്തുനിൽക്കുകയും മലയാള ബൈബിൾ ഭാഷയിൽ തിരിച്ചറിയാവുന്നതുമായ രൂപം.
- source_word: οἱ συνεργοί μου
  choice: എന്റെ സഹപ്രവർത്തകർ
  rationale: συνεργός ഒരാളോടൊപ്പം പ്രവർത്തിക്കുന്ന പങ്കാളിയെ സൂചിപ്പിക്കുന്നു; ‘സഹപ്രവർത്തകർ’ സഹകരിച്ചുള്ള പ്രവർത്തനത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു. μου ബന്ധം/ഉടമസ്ഥത സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്റെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പേരുകളുടെ പട്ടികയ്ക്കു പിന്നാലെയുള്ള ഗ്രീക്ക് വ്യാഖ്യാനസമാനപദബന്ധം മലയാളത്തിൽ വ്യക്തമായി കാണിക്കാൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു.
