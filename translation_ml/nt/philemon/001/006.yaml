  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: ml
  text: നിന്റെ വിശ്വാസത്തിലെ പങ്കാളിത്തം[a][b] നമ്മിലുള്ള[c] എല്ലാ നന്മകളെയും മശീഹാവിനെ ലക്ഷ്യമാക്കി[d][e] തിരിച്ചറിയുന്നതിൽ ഫലപ്രദമായിത്തീരേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ വിശ്വാസത്തിന്റെ കൂട്ടായ്മ” അല്ലെങ്കിൽ “നീ വിശ്വാസം പങ്കുവെക്കുന്നത്.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “വിശ്വാസം” എന്നു പരിഭാഷപ്പെടുത്തിയ πίστις എന്ന പദത്തിന് ചില സന്ദർഭങ്ങളിൽ “വിശ്വസ്തത” അല്ലെങ്കിൽ “ആശ്രയം” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നമ്മിലുള്ള” എന്നതിനുപകരം “നിന്നിലുള്ള” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: d
    text: അഥവാ, “മശീഹാവിനായി” അല്ലെങ്കിൽ “മശീഹായിലേക്കുള്ള.” Χριστός എന്ന സ്ഥാനപ്പേര് ഇവിടെ “മശീഹാ” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: e
    text: ഈ ദുഷ്കരമായ ഗ്രീക്ക് വാക്യഭാഗം, “മശീഹാവിനെ ലക്ഷ്യമാക്കിയുള്ള നമ്മിലുള്ള എല്ലാ നന്മകളുടെയും പരിജ്ഞാനത്തിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_rendering
lexical_decisions:
- source_word: ὅπως
  choice: —വേണ്ടതിന്
  rationale: പൗലോസിന്റെ പ്രാർഥനയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനായി മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യപ്രത്യയം ഉപയോഗിച്ചു.
- source_word: κοινωνία
  choice: പങ്കാളിത്തം
  rationale: കൂട്ടായ്മ, പങ്കുവെക്കൽ, പങ്കാളിത്തം എന്നീ അർഥസാധ്യതകൾ ഉള്ള പദമാണിത്. വിശ്വാസത്തിൽ സജീവമായി പങ്കുചേരുന്നതും അതിന്റെ പ്രായോഗിക പ്രകടനവും ഒരുപോലെ സൂചിപ്പിക്കാൻ ‘പങ്കാളിത്തം’ യോജിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: πίστεώς
  choice: വിശ്വാസം
  rationale: ഇവിടെ ഫിലേമോന്റെ ക്രിസ്തീയവിശ്വാസത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നതെന്നു തോന്നുന്നു. ‘വിശ്വസ്തത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐνεργὴς γένηται
  choice: ഫലപ്രദമായിത്തീരുക
  rationale: സജീവമാകുക, ഫലം ഉളവാക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν ἐπιγνώσει
  choice: തിരിച്ചറിയുന്നതിൽ
  rationale: ἐπίγνωσις വെറും വിവരജ്ഞാനത്തേക്കാൾ വ്യക്തമായ അറിവിനെയോ തിരിച്ചറിവിനെയോ സൂചിപ്പിക്കാം. ἐν എന്നതിന്റെ പരിധി കാത്തുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ക്രിയാനാമരൂപം സ്വീകരിച്ചു.
- source_word: παντὸς ἀγαθοῦ
  choice: എല്ലാ നന്മകളും
  rationale: നപുംസകലിംഗ ഏകവചനപ്രയോഗത്തിന്റെ സമഗ്രത മലയാളത്തിൽ സ്വാഭാവികമായി ‘എല്ലാ നന്മകളും’ എന്നു നൽകി; ‘ദാനങ്ങൾ’ എന്നു പ്രത്യേകമാക്കിയില്ല.
- source_word: τοῦ ἐν ἡμῖν
  choice: നമ്മിലുള്ള
  rationale: SBLGNT-യിലെ ἡμῖν എന്ന പാഠം പിന്തുടർന്നു. ഇത് വിശ്വാസികളുടെ സമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കാം; ‘നിന്നിലുള്ള’ എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ.
- source_word: εἰς Χριστόν
  choice: മശീഹാവിനുവേണ്ടി
  rationale: εἰς ഇവിടെ ദിശ, ലക്ഷ്യം, ബന്ധം എന്നിവയിൽ ഏതാണ് കൃത്യമെന്നത് ദുഷ്കരമാണ്. ‘മശീഹാവിനുവേണ്ടി’ എന്നത് ലക്ഷ്യോന്മുഖത സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ.
theological_decisions:
- issue: κοινωνία τῆς πίστεώς σου എന്നതിന്റെ അർഥം
  choice: ‘നിന്റെ വിശ്വാസത്തിലെ പങ്കാളിത്തം’—വിശ്വാസത്തിൽ പങ്കുചേരലും അതിന്റെ സജീവമായ പങ്കുവെക്കലും തുറന്നുവയ്ക്കുന്ന വിവർത്തനം
  alternative: ‘നിന്റെ വിശ്വാസത്തിന്റെ കൂട്ടായ്മ’ അല്ലെങ്കിൽ ‘നീ വിശ്വാസം പങ്കുവെക്കുന്നത്’
  rationale: ഈ ദുഷ്കരമായ പ്രയോഗത്തെ വിശ്വാസപ്രചാരണം മാത്രമായോ ആന്തരിക കൂട്ടായ്മ മാത്രമായോ ചുരുക്കാതെ അതിന്റെ സാമൂഹികവും പ്രായോഗികവുമായ വ്യാപ്തി നിലനിർത്തി.
- issue: ‘നമ്മിലുള്ള’ എന്നതിന്റെ സൂചിതർ
  choice: പൗലോസ്, ഫിലേമോൻ, മറ്റു വിശ്വാസികൾ എന്നിവരെ ഉൾക്കൊള്ളുന്ന സമൂഹപരമായ ‘നമ്മൾ’
  alternative: പാഠഭേദത്തിലുള്ള ‘നിന്നിലുള്ള’, ഫിലേമോനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്
  rationale: അച്ചടിച്ച ഗ്രീക്ക് പാഠമായ ἐν ἡμῖν പിന്തുടർന്നു; പ്രധാനപ്പെട്ട പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: εἰς Χριστόν എന്നതിന്റെ ബന്ധം
  choice: നന്മകൾ മശീഹാവിനെ ലക്ഷ്യമാക്കുന്നതായി ‘മശീഹാവിനുവേണ്ടി’
  alternative: ‘മശീഹായിലേക്കുള്ള’ അല്ലെങ്കിൽ മുഴുവൻ തിരിച്ചറിവും മശീഹാവിലേക്കു നയിക്കുന്നതായി വായിക്കൽ
  rationale: ഗ്രീക്ക് വാക്യഘടനയിലെ ബന്ധം ദുഷ്കരമാണ്. പ്രധാനവാചകത്തിൽ ഒരു സ്വാഭാവിക വായന നൽകി, ദിശാസൂചനയുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലത്തിലെ ദുഷ്കരമായ κοινωνία പ്രയോഗവും εἰς Χριστόν എന്നതിന്റെ ബന്ധവും അമിതമായി വ്യാഖ്യാനിക്കാതെ, പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
