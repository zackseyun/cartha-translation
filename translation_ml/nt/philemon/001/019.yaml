  to: 'പൗലൊസായ ഞാൻ എന്റെ സ്വന്തം കൈകൊണ്ട് എഴുതുന്നു: ഞാൻ അതു തിരിച്ചടയ്ക്കും. നിന്നെത്തന്നെപ്പോലും നീ എനിക്കു കടപ്പെട്ടിരിക്കുന്നു എന്നു ഞാൻ നിന്നോടു പറയുന്നില്ല.[a]'
  rationale: The revision corrects the grammatical representation of “yourself” and clarifies repayment language, while preserving the epistolary present “I write,” Paul's personal guarantee, and the source text's intentionally unspecified personal debt. The footnote has been made structurally and semantically sound without imposing a doctrinal explanation.
