id: PHM.1.19
reference: Philemon 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: ml
  text: 'പൗലൊസായ ഞാൻ എന്റെ സ്വന്തം കൈകൊണ്ട് എഴുതുന്നു: ഞാൻ അതു തിരിച്ചടയ്ക്കും. നിന്നെത്തന്നെപ്പോലും നീ എനിക്കു കടപ്പെട്ടിരിക്കുന്നു എന്നു ഞാൻ നിന്നോടു പറയുന്നില്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “പൗലൊസായ ഞാൻ എന്റെ സ്വന്തം കൈകൊണ്ട് എഴുതി; ഞാൻ അതു തിരിച്ചടയ്ക്കും; നീ നിന്നെത്തന്നെപ്പോലും എനിക്കു കടപ്പെട്ടിരിക്കുന്നു എന്നു ഞാൻ നിന്നോടു പറയുന്നില്ല.”'
    reason: ἔγραψα എന്ന അയോറിസ്റ്റിനെ «എഴുതി» എന്ന രൂപത്തിൽ നൽകുന്നു; ἵνα μὴ λέγω σοι എന്ന വാക്യത്തിലെ ആലങ്കാരികമായ മിതപ്രസ്താവനയും നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἔγραψα
  choice: എഴുതുന്നു
  rationale: ഗ്രീക്കിൽ ഇത് അയോറിസ്റ്റ് രൂപമായ ‘എഴുതി’ എന്നാണ് ഔപചാരികമായി വരുന്നത്. എന്നാൽ കത്ത് വായിക്കപ്പെടുന്ന സമയത്ത് സ്വന്തം കൈയെഴുത്തിലുള്ള ഉറപ്പിലേക്കു ശ്രദ്ധ ക്ഷണിക്കുന്ന സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക കത്തുശൈലി ‘എഴുതുന്നു’ എന്ന വർത്തമാനരൂപത്തെ അനുകൂലിക്കുന്നു.
- source_word: τῇ ἐμῇ χειρί
  choice: എന്റെ സ്വന്തം കൈകൊണ്ട്
  rationale: പൗലൊസ് നേരിട്ട് സ്വന്തം കൈകൊണ്ട് എഴുതിയതാണെന്ന ഊന്നൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἀποτίσω
  choice: ഞാൻ അതു തിരിച്ചുതരും
  rationale: മുൻവാക്യത്തിൽ സൂചിപ്പിച്ച നഷ്ടമോ കടമോ താൻ തീർത്തുകൊടുക്കുമെന്ന ഭാവിയിലെ ഉറപ്പ് സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα μὴ λέγω σοι
  choice: ഞാൻ നിന്നോടു പറയുന്നില്ല
  rationale: ഇത് കർശനമായ ഉദ്ദേശ്യവാക്യത്തേക്കാൾ ആലങ്കാരികമായ മിതപ്രസ്താവനയാണ്. പൗലൊസ് പറയുന്നില്ലെന്ന ഭാവത്തിൽ കാര്യം തന്നെയറിയിക്കുന്ന സൂക്ഷ്മമായ വിരോധാഭാസം മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: σεαυτόν
  choice: നിനക്കുതന്നെയും
  rationale: καί നൽകുന്ന ഊന്നൽ ‘-തന്നെയും’ എന്ന രൂപത്തിൽ നിലനിർത്തി, സാമ്പത്തിക കടത്തെക്കാൾ വ്യക്തിപരമായ കടപ്പാടിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
- source_word: προσοφείλεις
  choice: എനിക്കു കടപ്പെട്ടിരിക്കുന്നു
  rationale: കൂടുതലായോ അതിനുപുറമേയോ കടപ്പെട്ടിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അനുബന്ധമായ ഊന്നൽ ‘നിനക്കുതന്നെയും’ എന്നതിലൂടെ പ്രകടമാകുന്നു.
theological_decisions:
- issue: ‘നിനക്കുതന്നെയും എനിക്കു കടപ്പെട്ടിരിക്കുന്നു’ എന്നതിലെ ഫിലേമോന്റെ കടപ്പാടിന്റെ സ്വഭാവം
  choice: കടപ്പാടിനെ ശക്തമായ വ്യക്തിപരമായ രൂപകമായി നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ അടിസ്ഥാനം വ്യക്തമാക്കുന്നില്ല.
  alternative: ഫിലേമോൻ തന്റെ മാനസാന്തരത്തിനോ രക്ഷയ്ക്കോ ഭൗതികജീവനോ വേണ്ടി പൗലൊസിനോടു കടപ്പെട്ടിരിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം കടപ്പാടിനെ ശക്തമായി പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിന്റെ കൃത്യമായ കാരണം പറയുന്നില്ല. അതിനാൽ പാഠത്തിനു പുറത്തുള്ള ചരിത്രപരമോ ഉപദേശപരമോ ആയ നിഗമനം വിവർത്തനത്തിൽ ചേർക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി ഉപയോഗിച്ചു. പൗലൊസിന്റെ വ്യക്തിപരമായ ഉറപ്പും തുടർന്ന് വരുന്ന സൂക്ഷ്മമായ ആലങ്കാരിക സമ്മർദവും നിലനിർത്തി; കടപ്പാടിന്റെ സ്വഭാവം വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായി തീർപ്പാക്കിയില്ല.
