translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. 'ഓർത്തുപറയുക' എന്ന പ്രയോഗം വെറും മനസ്സിൽ ഓർക്കുന്നതിലുപരി പ്രാർഥനയിൽ വ്യക്തിയെ പരാമർശിക്കുന്ന ഗ്രീക്ക് ഭാവം കൈവിടുന്നില്ല. യഥാർഥ വാക്യഘടനാപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
