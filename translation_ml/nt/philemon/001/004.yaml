  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: ml
  text: എന്റെ പ്രാർഥനകളിൽ നിന്നെക്കുറിച്ച് പരാമർശിച്ചുകൊണ്ട്, ഞാൻ എപ്പോഴും എന്റെ ദൈവത്തിന് നന്ദി പറയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്റെ പ്രാർഥനകളിൽ നിന്നെ ഓർക്കുമ്പോൾ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “നിന്നെക്കുറിച്ച് പരാമർശിച്ചുകൊണ്ട്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: നന്ദി പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ഒന്നാംപുരുഷ ഏകവചന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ θεῷ μου
  choice: എന്റെ ദൈവത്തിന്
  rationale: εὐχαριστέω എന്ന ക്രിയയോടുകൂടിയ ദത്തിവിഭക്തി നന്ദിയുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്നു; 'എന്റെ' എന്നത് പൗലോസിന്റെ വ്യക്തിപരമായ ഭക്തിഭാവം നിലനിർത്തുന്നു.
- source_word: πάντοτε
  choice: ഓരോ തവണയും
  rationale: πάντοτε എന്നതിന്റെ സ്ഥിരതാബോധം, പ്രാർഥനയിൽ ഫിലേമോനെ ഓർത്തുപറയുന്ന അവസരങ്ങളുമായി പങ്കാളിവാക്യത്തെ ബന്ധിപ്പിച്ചുകൊണ്ട് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μνείαν σου ποιούμενος
  choice: നിന്നെ ഓർത്തുപറയുമ്പോൾ
  rationale: അക്ഷരാർഥത്തിലെ 'നിന്നെക്കുറിച്ച് പരാമർശിച്ചുകൊണ്ട്' എന്ന ആശയവും പ്രാർഥനയിലെ സ്മരണയും ഒരുമിച്ച് സൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: എന്റെ പ്രാർഥനകളിൽ
  rationale: ἐπί + genitive ഇവിടെ പ്രാർഥനയുടെ അവസരത്തെയോ പശ്ചാത്തലത്തെയോ സൂചിപ്പിക്കുന്നു; 'പ്രാർഥനകളിൽ' വ്യക്തവും സ്വാഭാവികവുമാണ്.
