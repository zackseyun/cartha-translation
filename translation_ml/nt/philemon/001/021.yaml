  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: ml
  text: നിന്റെ അനുസരണത്തെക്കുറിച്ച് എനിക്ക് ഉറപ്പുള്ളതുകൊണ്ട് ഞാൻ നിനക്ക് എഴുതിയതാണ്; ഞാൻ പറയുന്നതിലും കൂടുതൽ നീ ചെയ്യുമെന്ന് അറിഞ്ഞുകൊണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ പറയുന്നതിനും അപ്പുറം.” ഫിലേമോൻ പൗലോസ് പറഞ്ഞതിനെക്കാൾ കൂടുതൽ ചെയ്യുമെന്ന് പൗലോസ് സൂചിപ്പിക്കുന്നുണ്ടാകാം; എന്നാൽ അത് എന്തായിരിക്കുമെന്ന് വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: ഉറപ്പുള്ളവനായിട്ട്
  rationale: പൂർണകാല കർത്തൃവാചക കൃദന്തം സ്ഥിരമായ ആത്മവിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ എഴുത്തിന്റെ അടിസ്ഥാനമായ ആ ഉറപ്പ് നിലനിർത്തുന്നു.
- source_word: τῇ ὑπακοῇ σου
  choice: നിന്റെ അനുസരണത്തിൽ
  rationale: ὑπακοή എന്ന പദത്തിന്റെ അനുസരണം/കീഴ്പ്പെടൽ എന്ന ധാർമികവും ബന്ധപരവുമായ ശക്തി മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: ἔγραψά σοι
  choice: ഞാൻ നിനക്ക് എഴുതിയത്
  rationale: അയോറിസ്റ്റ് ക്രിയയെ ലളിതമായ ഭൂതകാല അർഥത്തിൽ നൽകുന്നു; മുൻപുള്ള കൃദന്തവുമായി ചേർന്ന് മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടന സൃഷ്ടിക്കുന്നു.
- source_word: εἰδὼς
  choice: എനിക്കറിയാം
  rationale: എഴുതുന്നതിനോടൊപ്പമുള്ള പൗലോസിന്റെ ഉറച്ച അറിവ് വ്യക്തമാക്കുന്നു. കൃദന്തരൂപം അക്ഷരാർഥത്തിൽ പകർത്തുന്നതിനേക്കാൾ സ്വാഭാവികമായ മലയാള ഉപവാക്യം ഉപയോഗിച്ചു.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: ഞാൻ പറയുന്നതിലും അധികം
  rationale: ὑπέρ + accusative നൽകുന്ന ‘പറയുന്നതിനെക്കാൾ അപ്പുറം/അധികം’ എന്ന താരതമ്യാർഥം സംരക്ഷിക്കുന്നു; അധികമായി എന്ത് ചെയ്യുമെന്നത് വ്യക്തമാക്കുന്നില്ല.
- source_word: ποιήσεις
  choice: നീ ചെയ്യും
  rationale: ποιέω എന്ന വിശാലാർഥമുള്ള ഭാവികാലക്രിയയെ തുറന്ന അർഥമുള്ള സാധാരണ മലയാള ക്രിയയായി നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അഭ്യർഥനയോടുള്ള ബന്ധത്തിൽ ὑπακοήയുടെ ശക്തി
  choice: ‘അനുസരണം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സമ്മതം’ അല്ലെങ്കിൽ ‘പ്രതികരിക്കാനുള്ള സന്നദ്ധത’
  rationale: മൂലപദത്തിലെ അനുസരണത്തിന്റെ ആശയവും അപ്പൊസ്തലിക അധികാരത്തിന്റെ ബന്ധപരമായ മാനവും നിലനിർത്തുന്നു; എന്നാൽ വാചകത്തിൽ ഇല്ലാത്ത നിർബന്ധം ചേർക്കുന്നില്ല.
- issue: ‘ഞാൻ പറയുന്നതിലും അധികം’ എന്നതിന്റെ സൂചന
  choice: അധികമായി പ്രതീക്ഷിക്കുന്ന പ്രവൃത്തി എന്തെന്ന് വ്യക്തമാക്കാതെ തുറന്നുവച്ചു.
  alternative: ഒനേസിമൊസിനെ മോചിപ്പിക്കുമെന്ന സൂചനയായി വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ഉദാരമായി സ്വീകരിക്കുന്നതിൽ മാത്രം ഒതുക്കുക.
  rationale: പൗലോസിന്റെ ഭാഷ സൂചനാപരമാണ്, പക്ഷേ നിർദിഷ്ടമല്ല. അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനതുറവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധന നിലനിർത്തി. കൃദന്തങ്ങൾ യാന്ത്രികമായി പകർത്താതെ മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധം ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ ഉറപ്പ്, അറിവ്, തുറന്ന സൂചന എന്നിവ സംരക്ഷിച്ചു.
