source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിന്റെ സ്നേഹം നിമിത്തം എനിക്ക് വളരെ സന്തോഷവും പ്രോത്സാഹനവും ലഭിച്ചു; വിശുദ്ധരുടെ ഹൃദയങ്ങൾ[a] നിന്നിലൂടെ നവോന്മേഷം പ്രാപിച്ചിരിക്കുന്നു, സഹോദരാ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘വിശുദ്ധരുടെ ആന്തരിക അവയവങ്ങൾ’; ഇവിടെ ആഴമുള്ള അന്തർവികാരങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: സന്തോഷം
  rationale: χαράയുടെ സാധാരണ അർഥമായ ‘സന്തോഷം’ സ്വാഭാവികവും παράκλησις എന്ന പദത്തോടൊപ്പം യോജിക്കുന്നതുമാണ്.
- source_word: πολλὴν ἔσχον
  choice: എനിക്ക് വളരെയധികം ... ഉണ്ടായി
  rationale: അയോറിസ്റ്റ് രൂപം പൗലോസ് അനുഭവിച്ച സന്തോഷവും പ്രോത്സാഹനവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παράκλησιν
  choice: പ്രോത്സാഹനം
  rationale: സാന്ത്വനം, ആശ്വാസം എന്നീ അർഥങ്ങളും സാധ്യമാണെങ്കിലും, ഫിലേമോന്റെ സ്നേഹത്തിൽനിന്ന് പൗലോസിനു ലഭിച്ച ശക്തിപ്പെടുത്തലിനെ ഇവിടെ ‘പ്രോത്സാഹനം’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: നിന്റെ സ്നേഹം നിമിത്തം
  rationale: ἐπί + ദത്തിവ് ഇവിടെ കാരണത്തെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അതിനെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀγάπῃ
  choice: സ്നേഹം
  rationale: ἀγάπηയുടെ സന്ദർഭോചിതവും സാധാരണവുമായ മലയാള തുല്യപദം.
- source_word: τὰ σπλάγχνα
  choice: ഹൃദയങ്ങൾ
  rationale: അക്ഷരാർഥത്തിൽ ആന്തരിക അവയവങ്ങളെ സൂചിപ്പിക്കുന്ന ഈ ഗ്രീക്ക് രൂപകം ആഴമുള്ള അന്തരംഗത്തെയും വികാരങ്ങളെയും കുറിക്കുന്നു; ‘ഹൃദയങ്ങൾ’ അതിന്റെ സ്വാഭാവിക മലയാള രൂപകമാണ്. കൂടുതൽ അക്ഷരാർഥപരമായ സൂചന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: ἀναπέπαυται
  choice: ആശ്വാസം ലഭിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം മുൻപ്രവൃത്തിയുടെ ഫലമായി ഇപ്പോഴും നിലനിൽക്കുന്ന ആശ്വാസാവസ്ഥയെ അറിയിക്കുന്നു.
- source_word: διὰ σοῦ
  choice: നിന്നിലൂടെ
  rationale: διά + ഷഷ്ഠി സൂചിപ്പിക്കുന്ന മാധ്യമം/കർതൃത്വം നിലനിർത്തുന്നു.
- source_word: ἀδελφέ
  choice: സഹോദരാ
  rationale: ക്രിസ്തീയ സമൂഹത്തിനുള്ളിലെ നേരിട്ടുള്ള കുടുംബസംബോധനയെ അധിക വിശേഷണം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἅγιοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശുദ്ധർ
  alternative: ദൈവജനം; വിശുദ്ധരായവർ
  rationale: പദം ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധർ’ പൗലോസിന്റെ സഭാസമൂഹപരമായ ഭാഷ നിലനിർത്തുന്നു; പിൽക്കാല ഔദ്യോഗിക വിശുദ്ധപദവി എന്ന ആശയം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: σπλάγχνα എന്ന മനുഷ്യശരീരരൂപകം
  choice: ഹൃദയങ്ങൾ
  alternative: അന്തരംഗങ്ങൾ; ഉള്ളങ്ങൾ
  rationale: ഈ ഗ്രീക്ക് രൂപകം ആഴമുള്ള അന്തർജീവിതത്തെയും വാത്സല്യവികാരങ്ങളെയും സൂചിപ്പിക്കുന്നു. ‘ഹൃദയങ്ങൾ’ മലയാളത്തിൽ സ്വാഭാവികമായ രൂപകമാണ്; ശരീരാവയവത്തെ അക്ഷരാർഥത്തിൽ മാത്രം ഗ്രഹിക്കാനുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. γάρ, ὅτι എന്നീ കാരണബന്ധങ്ങൾ യഥാക്രമം ‘എന്തെന്നാൽ’, ‘കാരണം’ എന്നു പ്രകടമാക്കി; ഗ്രീക്കിലെ അവസാനത്തെ നേരിട്ടുള്ള സംബോധനയും നിലനിർത്തി.
