id: PHM.1.20
reference: Philemon 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: ml
  text: അതേ, സഹോദരാ, കർത്താവിൽ എനിക്ക് നിന്നിൽനിന്ന് പ്രയോജനം ലഭിക്കട്ടെ[a]; മശീഹായിൽ[c] എന്റെ ഹൃദയത്തിന്[b] ഉന്മേഷമേകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നിൽനിന്ന് എനിക്ക് നേട്ടമുണ്ടാകട്ടെ’ അല്ലെങ്കിൽ ‘നിന്നിൽനിന്ന് എനിക്ക് സന്തോഷം ലഭിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘പ്രയോജനം’ എന്ന ആശയവും ഒനേസിമൊസിന്റെ പേരും ബന്ധപ്പെടുത്തി പൗലോസ് ഇവിടെ വാക്കുകളി പ്രയോഗിക്കുന്നുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘എന്റെ ആന്തരാവയവങ്ങൾ.’ ആഴമുള്ള വികാരങ്ങളെയോ അന്തരംഗത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയായതിനാൽ ഇവിടെ ‘എന്റെ ഹൃദയം’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: ‘ക്രിസ്തുവിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനനാമത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹാ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: അതേ
  rationale: സ്നേഹപൂർവമായ ഉറപ്പോടുകൂടിയ അഭ്യർഥനയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀδελφέ
  choice: സഹോദരാ
  rationale: ഫിലേമോനെ സഹവിശ്വാസിയായി നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഏകവചന സംബോധന.
- source_word: ἐγώ σου ὀναίμην
  choice: എനിക്ക് നിന്നിൽനിന്ന് പ്രയോജനം ലഭിക്കട്ടെ
  rationale: ὀνίνημι എന്ന ക്രിയയുടെ ‘പ്രയോജനം ലഭിക്കുക’ എന്ന അർഥവും അഭ്യർഥനാസ്വഭാവവും നിലനിർത്തുന്നു; ഒനേസിമൊസിന്റെ പേരുമായുള്ള സാധ്യതയുള്ള വാക്കുകളിയും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ആത്മീയബന്ധത്തിന്റെയും പ്രവർത്തനമേഖലയുടെയും ആശയം ചുരുക്കമായും പതിവായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνάπαυσόν
  choice: ഉന്മേഷമേകുക
  rationale: ആശ്വാസവും പുതുശക്തിയും നൽകാനുള്ള വ്യക്തമായ അഭ്യർഥനയെ അവതരിപ്പിക്കുകയും 1:7-ലെ ആശയപ്രതിധ്വനി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μου τὰ σπλάγχνα
  choice: എന്റെ ഹൃദയത്തിന്
  rationale: അക്ഷരാർഥത്തിലെ ‘ആന്തരാവയവങ്ങൾ’ എന്നതിനു പകരം ആഴമുള്ള വികാരങ്ങളെയും അന്തരംഗത്തെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹായിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനനാമപരമായ അർഥം നിലനിർത്തുകയും ക്രൈസ്തവ കൂട്ടായ്മയുടെ മേഖലയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: ഇവിടെ Χριστός സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ അതിന്റെ അഭിഷിക്തൻ എന്ന അർഥം കൂടുതൽ തുറന്നുവെക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപവും സാധുവായ പരിഭാഷയാണ്.
- issue: κυρίῳ എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവിൽ
  alternative: നാഥനിൽ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ κύριος എന്ന ബഹുമാനപദത്തിന്റെ സ്ഥാപിതമായ പുതിയനിയമ അർഥം സംരക്ഷിക്കുന്നു; യജമാനൻ–ദാസൻ ബന്ധം അനാവശ്യമായി മുൻനിരയിൽ കൊണ്ടുവരുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സംബോധനയും അഭ്യർഥനാശൈലിയും ഉപയോഗിച്ചു. മൂലത്തിലെ ഊഷ്മളത നിലനിർത്തിക്കൊണ്ട് അക്ഷരാർഥത്തിൽ അസ്വാഭാവികമാകുന്ന σπλάγχνα എന്ന ശൈലി സ്വാഭാവികമായ ‘ഹൃദയം’ എന്നു നൽകി; വാക്കുകളിയും സാധുവായ പദഭേദങ്ങളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
