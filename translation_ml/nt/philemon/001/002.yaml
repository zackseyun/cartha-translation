source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: ml
  text: 'സഹോദരിയായ അപ്പിയയ്ക്കും[a], ഞങ്ങളുടെ സഹഭടനായ അർക്കിപ്പൊസിനും, നിന്റെ വീട്ടിലെ സഭയ്ക്കും:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഞങ്ങളുടെ സഹോദരിയായ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: അപ്പിയ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവികമായ ശബ്ദലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: τῇ ἀδελφῇ
  choice: സഹോദരിയായ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ἡμῶν (‘ഞങ്ങളുടെ’) ഇല്ലാത്തതിനാൽ ആ സർവനാമം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. വ്യക്തിനാമത്തോടു ചേർന്ന വിശേഷണപ്രയോഗമായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: Ἀρχίππῳ
  choice: അർക്കിപ്പൊസിന്
  rationale: വ്യക്തിനാമം ഗ്രീക്ക് രൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിലേക്ക് ലിപ്യന്തരണം ചെയ്തു; സമർപ്പണവിഭക്തി ആശംസയുടെ സ്വീകർത്താവിനെ വ്യക്തമാക്കുന്നു.
- source_word: τῷ συστρατιώτῃ ἡμῶν
  choice: ഞങ്ങളുടെ സഹഭടനായ
  rationale: സυστρατιώτης എന്ന സംയുക്തപദത്തിലെ സൈനികരൂപകം നിലനിർത്തുന്നു; ἡμῶν എന്നത് ‘ഞങ്ങളുടെ’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τῇ κατ’ οἶκόν σου ἐκκλησίᾳ
  choice: നിന്റെ വീട്ടിലെ സഭയ്ക്ക്
  rationale: വീട്ടിൽ സ്ഥിതിചെയ്യുന്നതോ അവിടെ കൂടിവരുന്നതോ ആയ വിശ്വാസിസമൂഹത്തെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘കൂടിവരുന്ന’ എന്നു വിശദീകരിച്ച് അർഥം ചുരുക്കാതെ, ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും സ്വാഭാവിക മലയാളവും ഒരുമിച്ച് നിലനിർത്തി.
- source_word: καὶ
  choice: -ക്കും / -നും
  rationale: ആവർത്തിക്കുന്ന ഗ്രീക്ക് സംയോജകത്തെ മലയാളത്തിലെ സമാന്തരമായ ചേർക്കൽപ്രത്യയങ്ങളിലൂടെ നിലനിർത്തി.
- source_word: ἐκκλησίᾳ
  choice: സഭ
  rationale: ഈ ആദ്യകാല ക്രൈസ്തവ ലേഖനസന്ദർഭത്തിൽ കൂടിവരുന്ന വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
theological_decisions:
- issue: τῇ ἀδελφῇ എന്നതിൽ ‘ഞങ്ങളുടെ’ എന്ന ഉടമസ്ഥസർവനാമം ചേർക്കണമോ എന്ന പാഠഭേദം
  choice: സഹോദരിയായ
  alternative: ഞങ്ങളുടെ സഹോദരിയായ
  rationale: നൽകിയ SBLGNT മുഖ്യപാഠം ἡμῶν ഇല്ലാതെ τῇ ἀδελφῇ എന്നു വായിക്കുന്നു. അതിനാൽ പരിചിതമായ പാരമ്പര്യവായന ചേർക്കാതെ മുഖ്യപാഠത്തെ പിന്തുടർന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: κατ’ οἶκόν σου എന്നത് സഭയുടെ സ്ഥലം മാത്രമാണോ കൂടിവരുന്ന പ്രവർത്തിയെയാണോ വ്യക്തമാക്കുന്നത്
  choice: നിന്റെ വീട്ടിലെ സഭ
  alternative: നിന്റെ വീട്ടിൽ കൂടിവരുന്ന സഭ
  rationale: ഗ്രീക്ക് പ്രയോഗം വീട്ടുമായി സഭയ്ക്കുള്ള ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും ‘കൂടിവരുന്ന’ എന്ന ക്രിയ തുറന്നുപറയുന്നില്ല. അതിനാൽ യഥാർഥ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ലേഖനശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിത ചേർക്കൽഘടന മലയാളത്തിലെ ‘-ക്കും/-നും’ രൂപങ്ങളിലൂടെ സ്വാഭാവികമാക്കി; സൈനികരൂപകം ‘സഹഭടൻ’ എന്ന പദത്തിൽ സംരക്ഷിച്ചു.
