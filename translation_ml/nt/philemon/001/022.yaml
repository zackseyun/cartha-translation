id: PHM.1.22
reference: Philemon 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: ml
  text: അതോടൊപ്പം, എനിക്കായി ഒരു അതിഥിമുറിയും ഒരുക്കുക[a]; കാരണം, നിങ്ങളുടെ പ്രാർഥനകളിലൂടെ ഞാൻ നിങ്ങൾക്കു കൃപാപൂർവം നൽകപ്പെടുമെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “താമസസൗകര്യം” അല്ലെങ്കിൽ “അതിഥിസൽക്കാരം”; ഗ്രീക്ക് പദം അതിഥിയെ സ്വീകരിക്കുന്ന പ്രവൃത്തിയെയോ അതിഥിക്കായി ഒരുക്കുന്ന താമസസ്ഥലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിങ്ങൾക്കു നൽകപ്പെടും” അല്ലെങ്കിൽ “നിങ്ങൾക്കു അനുവദിക്കപ്പെടും”; ഗ്രീക്ക് ക്രിയയിൽ സൗജന്യമായോ കൃപാപൂർവമായോ നൽകുക എന്ന ഭാവമുണ്ട്; നൽകുന്നവൻ ദൈവമാണെന്ന സൂചനയും ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: അതോടൊപ്പം ... -യും
  rationale: മുൻ അഭ്യർഥനയോടു ചേർന്ന മറ്റൊരു അഭ്യർഥനയാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καίയുടെ ‘കൂടി/യും’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: ἑτοίμαζέ
  choice: ഒരുക്കുക
  rationale: പ്രായോഗികമായ ഒരുക്കം ചെയ്യാനുള്ള നേരിട്ടുള്ള കല്പന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μοι
  choice: എനിക്കായി
  rationale: ദാതിവിന്റെ ഗുണഭോക്തൃഭാവം വ്യക്തമായി നൽകുന്നു.
- source_word: ξενίαν
  choice: ഒരു അതിഥിമുറി
  rationale: ἑτοίμαζέ എന്ന ക്രിയയോടൊപ്പം ഇവിടെ താമസിക്കാനുള്ള സജ്ജീകരിച്ച ഇടം എന്ന മൂർത്തമായ അർഥമാണ് ഏറ്റവും സ്വാഭാവികം; പദത്തിന് ‘താമസസൗകര്യം’ അഥവാ ‘അതിഥിസൽക്കാരം’ എന്നും അർഥമാകാമെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: '... എന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു'
  rationale: പ്രതീക്ഷയുടെ ഉള്ളടക്കം ὅτι അവതരിപ്പിക്കുന്നതു മലയാള വാക്യക്രമത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; γάρ സൂചിപ്പിക്കുന്ന കാരണബന്ധം മുൻവാക്യത്തോടുള്ള ആശയബന്ധത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: നിങ്ങളുടെ പ്രാർഥനകളിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ ഉപാധി എന്ന ഭാവം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: χαρισθήσομαι
  choice: കൃപയായി നൽകപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും സൗജന്യമായി/കൃപാപൂർവം നൽകുക എന്ന ക്രിയയുടെ ഭാവവും സംരക്ഷിക്കുന്നു; ദൈവമാണ് പ്രവർത്തിക്കുന്നവൻ എന്ന സാധ്യത പ്രകടമാണെങ്കിലും പാഠത്തിൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: പൗലോസ് സ്വീകർത്താക്കൾക്കു നൽകപ്പെടുമെന്ന ദാതിവ് ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: χαρισθήσομαι എന്നതിൽ പൗലോസിന്റെ മടങ്ങിവരവും പ്രവർത്തകന്റെ തിരിച്ചറിയലും
  choice: “ഞാൻ നിങ്ങൾക്കു കൃപയായി നൽകപ്പെടും” എന്നു കർമണിപ്രയോഗത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: “ഞാൻ നിങ്ങളിലേക്കു മടങ്ങിവരാൻ അനുവദിക്കപ്പെടും” / “ദൈവം എന്നെ നിങ്ങൾക്കു തിരികെ നൽകും”
  rationale: ഗ്രീക്ക് പദം മോചനം അഥവാ മടങ്ങിവരവ് നേരിട്ട് പറയുന്നില്ല. ദൈവിക പ്രവർത്തനം സൂചിതമായിരിക്കാമെങ്കിലും പ്രവർത്തകനെ വ്യക്തമാക്കാതെ, കൃപയോടെ നൽകപ്പെടുക എന്ന അർഥഭാവവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും സാധ്യതയുള്ള ദൈവിക പ്രവർത്തനവും വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ നിലനിർത്തി; ‘അതിഥിമുറി’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകുന്നതിനാൽ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
