id: PHM.1.12
reference: Philemon 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν ἀνέπεμψά ⸂σοι αὐτόν, τοῦτ’ ἔστιν τὰ ἐμὰ σπλάγχνα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: ml
  text: അവനെ ഞാൻ നിന്റെ അടുക്കലേക്കു തിരിച്ചയയ്ക്കുന്നു[a]—അവനെത്തന്നെ; അതായത്, എന്റെ ഹൃദയംതന്നെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപനിഷ്ഠമായി: ‘ഞാൻ അവനെ നിന്റെ അടുക്കലേക്കു തിരിച്ചയച്ചു’ അല്ലെങ്കിൽ ‘തിരിച്ചയച്ചിരിക്കുന്നു.’ ഗ്രീക്കിലെ ഭൂതകാലരൂപം പലവിധത്തിൽ പരിഭാഷപ്പെടുത്താം; കത്ത് ഫിലേമോന്റെ കൈയിലെത്തുന്ന കാഴ്ചപ്പാടാണ് ഇവിടെ വർത്തമാനരൂപം പ്രതിഫലിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘എന്റെ ആന്തരികാവയവങ്ങൾ’; പ്രയോഗാർഥത്തിൽ ആഴമായ സ്നേഹത്തെയോ ആർദ്രമായ വാത്സല്യത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: അവനെ
  rationale: മുമ്പ് പരാമർശിച്ച ഒനേസിമൊസിനെ സൂചിപ്പിക്കുന്ന കർമസ്ഥാനത്തിലുള്ള പുല്ലിംഗ ഏകവചന ആപേക്ഷിക സർവനാമം; മലയാളത്തിൽ സ്വാഭാവികമായി ‘അവനെ’ എന്നു നൽകുന്നു.
- source_word: ἀνέπεμψά
  choice: ഞാൻ ... തിരിച്ചയയ്ക്കുന്നു
  rationale: ἀναπέμπω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ‘തിരിച്ചയയ്ക്കുക’ എന്നാണ്. കത്ത് ഫിലേമോന്റെ കൈയിലെത്തുന്ന സന്ദർഭത്തെ മുൻനിർത്തി വർത്തമാനരൂപം ഉപയോഗിക്കുന്നത് കത്തിനോടൊപ്പം ഒനേസിമൊസിനെ മടക്കിയയയ്ക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σοι
  choice: നിന്റെ അടുക്കലേക്കു
  rationale: അയയ്ക്കലിന്റെ സ്വീകർത്താവായ ഏകവചന രണ്ടാംപുരുഷനെ സൂചിപ്പിക്കുന്നു; ‘നിന്റെ അടുക്കലേക്കു’ എന്നത് ദിശയും വ്യക്തിപരമായ ബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτόν
  choice: അവനെത്തന്നെ
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള സർവനാമം ഊന്നൽ നൽകുന്നു. ‘അവനെത്തന്നെ’ ആ ഊന്നലും ആവർത്തനവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: തുടർന്നുവരുന്ന വിശദീകരണത്തെ പരിചയപ്പെടുത്തുന്ന പതിവ് പ്രയോഗം; അധിക വ്യാഖ്യാനം ചേർക്കാതെ വിശദീകരണശക്തി നിലനിർത്തുന്നു.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: എന്റെ ഹൃദയംതന്നെ
  rationale: σπλάγχνα അക്ഷരാർഥത്തിൽ ആന്തരികാവയവങ്ങളെ സൂചിപ്പിച്ചാലും ഇവിടെ ആഴമായ സ്നേഹത്തിന്റെയും ആർദ്രവികാരത്തിന്റെയും കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ‘എന്റെ ഹൃദയംതന്നെ’ പൗലൊസിന്റെ തീവ്രമായ ആത്മബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നുനൽകുന്നു.
theological_decisions:
- issue: σπλάγχνα എന്നതിലെ മനുഷ്യസ്വഭാവസംബന്ധിയായ രൂപകം
  choice: ‘എന്റെ ഹൃദയംതന്നെ’ എന്ന ആശയാനുസൃത പ്രയോഗം
  alternative: ‘എന്റെ ആന്തരികാവയവങ്ങൾ’ / ‘എന്റെ ഏറ്റവും ആഴമായ സ്നേഹം’
  rationale: ഇത് ഉപദേശപരമായ തീരുമാനമല്ല, ഭാഷാശൈലിസംബന്ധിയായ തീരുമാനമാണ്. അക്ഷരാർഥത്തിലുള്ള ശരീരാവയവപ്രയോഗം ആധുനിക മലയാളത്തിൽ ഉദ്ദേശ്യം മറയ്ക്കും; തിരഞ്ഞെടുത്ത രൂപം പൗലൊസിന്റെ ആഴമായ വാത്സല്യവും ഒനേസിമൊസുമായുള്ള ആത്മബന്ധവും അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം കൂടാതെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവനെ ... അവനെത്തന്നെ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘എന്റെ ഹൃദയംതന്നെ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗ്രീക്ക് രൂപകത്തിന്റെ വികാരതീവ്രതയും നിലനിർത്തുന്നു.
