  text: Therefore I urge you to confirm your love for him.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവനോടുള്ള നിങ്ങളുടെ സ്നേഹം സ്ഥിരീകരിക്കണമെന്ന് ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ കാരണവുമായി ഈ അഭ്യർഥനയെ ബന്ധിപ്പിക്കുന്ന നിഗമനസൂചകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παρακαλῶ ὑμᾶς
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: സന്ദർഭത്തിലെ ഗൗരവമുള്ള അപേക്ഷയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: κυρῶσαι
  choice: ഉറപ്പിച്ചുകാണിക്കുക
  rationale: ക്രിയയുടെ ഔദ്യോഗികമായി സാധൂകരിക്കുക, സ്ഥിരീകരിക്കുക എന്ന ആശയം നിലനിർത്തുകയും സ്നേഹം പ്രവൃത്തിയിലൂടെ വ്യക്തമായി സ്ഥിരീകരിക്കണമെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: അവനോടുള്ള നിങ്ങളുടെ സ്നേഹം
  rationale: ലക്ഷ്യബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമല്ലെങ്കിലും അഭിസംബോധിതരുടെ സ്നേഹമാണ് ഉദ്ദേശ്യമെന്നത് വാക്യഘടനയിലും സന്ദർഭത്തിലും വ്യക്തമാണ്.
theological_decisions:
- issue: സഭ കുറ്റം ചെയ്ത വ്യക്തിയോടുള്ള സ്നേഹം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: സ്നേഹം ഉറപ്പിച്ചുകാണിക്കുക
  alternative: സ്നേഹം വീണ്ടും പ്രഖ്യാപിക്കുക
  rationale: κυρῶσαι എന്നത് വെറും വാചികമായ പുനഃപ്രഖ്യാപനത്തേക്കാൾ സ്ഥിരീകരണം/സാധൂകരണം സൂചിപ്പിക്കുന്നു; അതേസമയം അത് എങ്ങനെ ചെയ്യണമെന്നത് വിവർത്തനം അധികമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അഭ്യർഥനാശൈലി. ‘ഉറപ്പിച്ചുകാണിക്കുക’ എന്ന പ്രയോഗം ‘സ്ഥിരീകരിക്കുക’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്; മൂലത്തിലെ സ്ഥിരീകരണഭാവവും നിലനിർത്തുന്നു.
