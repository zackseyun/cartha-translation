id: 2CO.2.3
reference: 2 Corinthians 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: ml
  text: ഞാൻ വന്നപ്പോൾ, എന്നെ സന്തോഷിപ്പിക്കേണ്ടവരിൽനിന്നുതന്നെ എനിക്ക് ദുഃഖം ഉണ്ടാകാതിരിക്കാനാണ് ഞാൻ ഈ കാര്യംതന്നെ എഴുതിയത്.[a] എന്റെ സന്തോഷം നിങ്ങളെല്ലാവരുടെയും സന്തോഷമാണെന്ന് നിങ്ങളെല്ലാവരെയും കുറിച്ച് എനിക്ക് ഉറപ്പുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാൻ സന്തോഷിക്കേണ്ടിയിരുന്നവരിൽനിന്ന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: എഴുതിയത്
  rationale: സന്ദർഭത്തിൽ പൗലോസ് മുമ്പ് എഴുതിയതിനെ സൂചിപ്പിക്കുന്ന ലളിതമായ ഭൂതകാലപ്രയോഗം.
- source_word: τοῦτο αὐτὸ
  choice: ആ കാര്യംതന്നെ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ ... λύπην σχῶ
  choice: എനിക്ക് ദുഃഖം ഉണ്ടാകാതിരിക്കാനാണ്
  rationale: ഉദ്ദേശ്യവും നിഷേധവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: എന്നെ സന്തോഷിപ്പിക്കേണ്ടവരിൽനിന്നുതന്നെ
  rationale: അക്ഷരാർഥത്തിലെ ബന്ധസൂചന നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ പറയുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: നിങ്ങളെല്ലാവരെയുംകുറിച്ച് എനിക്ക് ഉറപ്പുണ്ടായിരുന്നു
  rationale: പൂർണ്ണകൃതന്തം സൂചിപ്പിക്കുന്ന നിലനിന്നിരുന്ന ഉറപ്പിനെ പ്രകടിപ്പിക്കുന്നു. കൃതന്തത്തിന്റെ കൃത്യമായ ബന്ധം ഗ്രീക്കിൽ നിർണ്ണയിക്കപ്പെടാത്തതിനാൽ ശക്തമായ കാരണബന്ധസൂചകം ചേർത്തിട്ടില്ല.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: എന്റെ സന്തോഷം നിങ്ങളെല്ലാവരുടെയും സന്തോഷമാണ്
  rationale: പൗലോസിന്റെയും കൊരിന്ത്യരുടെയും പങ്കിട്ട സന്തോഷം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πεποιθὼς എന്ന കൃതന്തത്തിന്റെ വാക്യബന്ധം
  choice: സ്വതന്ത്രമായ അടുത്ത വാക്യമായി ‘എനിക്ക് ഉറപ്പുണ്ടായിരുന്നു’ എന്നു നൽകി
  alternative: ‘ഉറപ്പുണ്ടായിരുന്നതിനാൽ’ എന്ന കാരണവാക്യമായി നൽകുക
  rationale: ഗ്രീക്ക് കൃതന്തം കാരണബന്ധം അനുവദിച്ചാലും അത് നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ബന്ധപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ദുഃഖം’, ‘സന്തോഷം’, ‘ഉറപ്പ്’ തുടങ്ങിയ പൊതുവായി മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപരമായ സാങ്കേതിക ഭാഷ ഒഴിവാക്കി.
