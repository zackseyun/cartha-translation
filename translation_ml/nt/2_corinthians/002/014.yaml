id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: ml
  text: എന്നാൽ, മശീഹയിൽ ഞങ്ങളെ എപ്പോഴും വിജയഘോഷയാത്രയിൽ നയിക്കുകയും[a] ഞങ്ങളിലൂടെ എല്ലായിടത്തും ദൈവത്തെക്കുറിച്ചുള്ള അറിവിന്റെ സൗരഭ്യം[b] വെളിപ്പെടുത്തുകയും ചെയ്യുന്ന ദൈവത്തിനു നന്ദി!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹയിൽ ഞങ്ങളുടെമേൽ എപ്പോഴും വിജയം നേടുകയും.”
    reason: alternative_reading
  - marker: b
    text: “സൗരഭ്യം” എന്നതിന് “സുഗന്ധം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: നന്ദി
  rationale: Τῷ δὲ θεῷ χάρις എന്ന സ്തോത്രപ്രയോഗത്തിൽ χάρις അമൂർത്തമായ ‘കൃപ’ എന്നതിലുപരി ദൈവത്തോടുള്ള നന്ദിയെ സൂചിപ്പിക്കുന്നു.
- source_word: θριαμβεύοντι
  choice: വിജയഘോഷയാത്രയിൽ നയിക്കുകയും
  rationale: ഈ ക്രിയ സാധാരണ വിജയത്തെക്കാൾ റോമൻ വിജയഘോഷയാത്രയുടെ ദൃശ്യബിംബം ഉണർത്തുന്നു; ἡμᾶς എന്ന നേരിട്ടുള്ള കർമത്തെയും നിലനിർത്തുന്നു.
- source_word: ἐν τῷ Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; ἐν ബന്ധത്തിന്റെയോ പ്രവർത്തനമണ്ഡലത്തിന്റെയോ ആശയം തുറന്നുവെക്കുന്നു.
- source_word: ὀσμὴν
  choice: സൗരഭ്യം
  rationale: സന്ദർഭത്തിലെ അനുകൂല രൂപകത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം; നിഷ്പക്ഷമായ ‘മണം’ എന്നതിനെക്കാൾ ഇവിടെ യോജിക്കുന്നു.
- source_word: γνώσεως αὐτοῦ
  choice: തന്നെക്കുറിച്ചുള്ള അറിവിന്റെ
  rationale: അറിവിന്റെ വിഷയം ദൈവമാണെന്ന സ്വാഭാവിക വായന വ്യക്തമാക്കുന്നു; αὐτοῦ എന്ന സർവനാമത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: φανεροῦντι
  choice: പരത്തുകയും
  rationale: സൗരഭ്യരൂപകത്തോടൊപ്പം സ്വാഭാവികമായ മലയാളം നൽകുമ്പോൾ, ആ അറിവ് എല്ലായിടത്തും വെളിവാക്കപ്പെടുന്നു എന്ന കാരകസാരം അറിയിക്കുന്നു.
- source_word: δι’ ἡμῶν
  choice: ഞങ്ങളിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν παντὶ τόπῳ
  choice: എല്ലായിടത്തും
  rationale: ഗ്രീക്കിലെ സർവവ്യാപക ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: θριαμβεύω എന്ന ക്രിയയ്ക്ക് ἡμᾶς കർമമായിരിക്കുമ്പോഴുള്ള അർഥം
  choice: ദൈവം അപ്പൊസ്തലസംഘത്തെ മശീഹയിൽ വിജയഘോഷയാത്രയിൽ നയിക്കുന്നു.
  alternative: ദൈവം മശീഹയിൽ ഞങ്ങളുടെമേൽ വിജയം നേടുന്നു.
  rationale: പ്രധാനപാഠം വിജയഘോഷയാത്രയുടെ സജീവ ദൃശ്യബിംബവും തുടർന്നുവരുന്ന സൗരഭ്യരൂപകവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു. എന്നാൽ ക്രിയയ്ക്ക് കീഴടക്കപ്പെട്ടവരുടെമേൽ വിജയം നേടുക എന്ന അർഥസാധ്യതയുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. വിജയഘോഷയാത്രയും സൗരഭ്യവും എന്ന രണ്ടു ബന്ധിത രൂപകങ്ങൾ നിലനിർത്തിയിരിക്കുന്നു; വാക്യത്തിന്റെ സ്തോത്രഭാവം ആശ്ചര്യചിഹ്നത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
