id: 2CO.2.2
reference: 2 Corinthians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: ml
  text: കാരണം, ഞാൻ നിങ്ങളെ ദുഃഖിപ്പിക്കുന്നുവെങ്കിൽ, എന്നെ നിമിത്തം ദുഃഖിക്കുന്ന ആൾ അല്ലാതെ എന്നെ സന്തോഷിപ്പിക്കാൻ മറ്റാരാണുള്ളത്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നാൽ ദുഃഖിതനാക്കപ്പെട്ട ആൾ”; ἐξ ἐμοῦ ഉറവിടമോ കാരണമോ സൂചിപ്പിക്കുന്നു; അതിന് “എന്നാൽ” അല്ലെങ്കിൽ “എന്നെ നിമിത്തം” എന്നർഥം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: ദുഃഖിപ്പിക്കുന്നു
  rationale: മറ്റൊരാളിൽ ദുഃഖം ഉളവാക്കുക എന്ന ക്രിയയുടെ causative അർഥം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εὐφραίνων
  choice: സന്തോഷിപ്പിക്കാൻ
  rationale: പൗലോസിനു സന്തോഷം നൽകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുകയും λυπῶ എന്നതുമായ ആശയവൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τίς ὁ εὐφραίνων με
  choice: എന്നെ സന്തോഷിപ്പിക്കാൻ മറ്റാരാണുള്ളത്?
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന പങ്കാളിക്രിയയുടെ അർഥവും ചോദ്യത്തിന്റെ വാഗ്‌വൈഭവവും സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ὁ λυπούμενος
  choice: ദുഃഖിക്കുന്ന ആൾ
  rationale: വർത്തമാനകാല passive participle സൂചിപ്പിക്കുന്ന ദുഃഖം അനുഭവിക്കുന്ന വ്യക്തിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; കർത്താവിനെ ἐξ ἐμοῦ വഴി വേറിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐξ ἐμοῦ
  choice: ഞാൻ നിമിത്തം
  rationale: ἐκ ഇവിടെ ഉറവിടമോ കാരണമോ സൂചിപ്പിക്കുന്നു. ‘ഞാൻ നിമിത്തം’ എന്നത് ‘എന്നാൽ’ എന്ന കർത്തൃവാചക സാധ്യതയെക്കാൾ കാരണം/ഉറവിടം എന്ന ചെറിയ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὁ λυπούμενος ἐξ ἐμοῦ എന്നതിലെ passive ഭാവവും കാരണബന്ധവും
  choice: ഞാൻ നിമിത്തം ദുഃഖിക്കുന്ന ആൾ
  alternative: എന്നാൽ ദുഃഖിപ്പിക്കപ്പെട്ട ആൾ
  rationale: പ്രസക്തിയിലെ കാരണക്കാരൻ പൗലോസാണെന്ന് വ്യക്തമാക്കുമ്പോഴും ἐξ ἐμοῦ എന്നതിന് ‘എന്നാൽ’ എന്ന കർശന കർത്തൃവാചക വ്യാഖ്യാനം മാത്രം ചുമത്താതെ ഉറവിടം/കാരണം എന്ന യഥാർഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിക്കുന്ന ‘ദുഃഖ’ പദമൂലം ഗ്രീക്കിലെ λυπ- ആവർത്തനവും വാക്യത്തിലെ ആശയബന്ധവും നിലനിർത്തുന്നു.
