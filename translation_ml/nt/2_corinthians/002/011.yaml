id: 2CO.2.11
reference: 2 Corinthians 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: ml
  text: സാത്താൻ നമ്മെ ചൂഷണം ചെയ്യാതിരിക്കേണ്ടതിന്, കാരണം അവന്റെ തന്ത്രങ്ങളെക്കുറിച്ച് നാം അജ്ഞരല്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “നമ്മെ മുതലെടുക്കാതിരിക്കേണ്ടതിന്” അല്ലെങ്കിൽ “നമ്മെ കബളിപ്പിക്കാതിരിക്കേണ്ടതിന്.”
    reason: lexical_alternative
  - marker: b
    text: “തന്ത്രങ്ങൾ” എന്നതിന് “പദ്ധതികൾ,” “ഉദ്ദേശ്യങ്ങൾ,” അല്ലെങ്കിൽ “ചിന്തകൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ചെയ്യാതിരിക്കേണ്ടതിനാണ്
  rationale: മുൻസന്ദർഭത്തിലെ നടപടിയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന നിഷേധാത്മക ലക്ഷ്യപ്രയോഗം; മലയാളത്തിൽ സ്വാഭാവികമായി മുന്നറിയിപ്പിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: πλεονεκτηθῶμεν
  choice: നമ്മെ ചൂഷണം ചെയ്യുക
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗത്തിലുള്ള ‘അന്യായമായി മുതലെടുക്കുക/ചൂഷണം ചെയ്യുക’ എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ബൗദ്ധികമായി കബളിപ്പിക്കൽ എന്നതിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: Σατανᾶ
  choice: സാത്താൻ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: γὰρ
  choice: ;
  rationale: രണ്ടാം ഉപവാക്യം ആദ്യത്തേതിന്റെ വിശദീകരണകാരണം നൽകുന്നു. മലയാളത്തിൽ പ്രത്യേക കാരണസൂചകപദം ചേർക്കാതെ അർധവിരാമത്തിലൂടെ ഈ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാകുന്നു.
- source_word: νοήματα
  choice: തന്ത്രങ്ങൾ
  rationale: ഇവിടെ വെറും ചിന്തകളല്ല, ശത്രുതാപരമായ ആസൂത്രണങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്; ‘തന്ത്രങ്ങൾ’ ആ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐ ... ἀγνοοῦμεν
  choice: നാം അറിവില്ലാത്തവരല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മകമായ ‘അജ്ഞരല്ല’ എന്ന രൂപവും അറിവ്/അജ്ഞത ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സാത്താന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന πλεονεκτέωയുടെ പരിധി
  choice: ചൂഷണം ചെയ്യുക
  alternative: കബളിപ്പിക്കുക / മുതലെടുക്കുക
  rationale: വാക്യം സാത്താന്റെ പ്രവർത്തനം ബൗദ്ധിക വഞ്ചന മാത്രമാണെന്ന് നിർണ്ണയിക്കുന്നില്ല; അന്യായമായി നേട്ടമെടുക്കൽ എന്ന വിപുലമായ ആശയം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ഉദ്ദേശ്യബന്ധവും നിഷേധാത്മക അറിവുപ്രയോഗവും സംരക്ഷിച്ചു; അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്ക് ശേഷം ചേർത്തു.
