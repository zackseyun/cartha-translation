id: 2CO.2.4
reference: 2 Corinthians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: ml
  text: കാരണം, വളരെയധികം കഷ്ടതയും ഹൃദയത്തിന്റെ ഞെരുക്കവും നിമിത്തം, ഒട്ടേറെ കണ്ണീരോടെയാണ് ഞാൻ നിങ്ങൾക്കു എഴുതിയത്. നിങ്ങൾ ദുഃഖിക്കേണ്ടതിനല്ല, മറിച്ച് നിങ്ങളോടുള്ള എന്റെ സ്നേഹം എത്രയധികമാണെന്ന് നിങ്ങൾ അറിയേണ്ടതിനാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: അതിയായ കഷ്ടതയും … മൂലം
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടമോ ആന്തരിക കാരണമോ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; θλῖψις എന്ന പദത്തിലെ സമ്മർദത്തിന്റെയും ദുരിതത്തിന്റെയും തീവ്രത ‘അതിയായ കഷ്ടത’ നിലനിർത്തുന്നു.
- source_word: συνοχῆς καρδίας
  choice: ഹൃദയവ്യഥ
  rationale: ഹൃദയം ഞെരുങ്ങുന്നതുപോലുള്ള ആന്തരിക മാനസിക വേദനയെ ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔγραψα ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതിയത്
  rationale: സാധാരണ ഭൂതകാലം നിലനിർത്തുന്നു; ഇത് മുമ്പത്തെ ഒരു പ്രത്യേക കത്താണെന്ന നിഗമനം ക്രിയയിലേക്ക് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: διὰ πολλῶν δακρύων
  choice: ഒട്ടേറെ കണ്ണീരോടെയാണ്
  rationale: കണ്ണീരോടെ എഴുതിയെന്ന അനുഗമനഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കണ്ണീരിന്റെ ബഹുലതയും ഊന്നലും നിലനിർത്തുന്നു.
- source_word: λυπηθῆτε
  choice: നിങ്ങൾ ദുഃഖിക്കേണ്ടതിനല്ല
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും ഉദ്ദേശ്യനിഷേധവും നിലനിർത്തി, ‘നിങ്ങളെ ദുഃഖിപ്പിക്കാനല്ല’ എന്ന കൂടുതൽ കാരണാത്മകമായ പുനരാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിനുള്ള സ്വാഭാവികവും സഭാവിഭാഗനിരപേക്ഷവുമായ പൊതുമലയാള പദം.
- source_word: γνῶτε
  choice: നിങ്ങൾ അറിയേണ്ടതിനാണ്
  rationale: ἵνα-ഉദ്ദേശ്യവാക്യത്തിന്റെ ഘടന നിലനിർത്തുന്നു; അറിവോ തിരിച്ചറിവോ എന്ന സൂക്ഷ്മവ്യത്യാസം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: നിങ്ങളോടുള്ള എന്റെ സ്നേഹം എത്രയധികമാണെന്ന്
  rationale: περισσοτέρως എന്ന പദത്തിന്റെ അളവിലെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘പ്രത്യേകിച്ച് നിങ്ങളോടുള്ള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: περισσοτέρως എന്നതിന്റെ താരതമ്യ/തീവ്രതാഭാവം
  choice: സ്നേഹം എത്രയധികമാണെന്ന്
  alternative: നിങ്ങളോടു എനിക്കു വിശേഷമായുള്ള സ്നേഹം
  rationale: വാക്യത്തിൽ സ്നേഹത്തിന്റെ സമൃദ്ധിയോ തീവ്രതയോ മുൻനിർത്തുന്നു; എന്നാൽ ആരോടാണ് കൂടുതലായി എന്ന താരതമ്യം ഗ്രീക്കിൽ പരോക്ഷമായതിനാൽ മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയവ്യഥ’, ‘ഒട്ടേറെ കണ്ണീരോടെ’ എന്നീ പ്രയോഗങ്ങൾ വികാരതീവ്രത സംരക്ഷിക്കുന്നു; അവസാനത്തെ ‘ഞാൻ എഴുതിയത്’ ആവർത്തിക്കുന്നത് നീണ്ട ഉദ്ദേശ്യവാക്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
