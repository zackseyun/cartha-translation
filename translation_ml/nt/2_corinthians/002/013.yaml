id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: ml
  text: എന്റെ സഹോദരനായ തീത്തൊസിനെ കാണാതിരുന്നതിനാൽ എന്റെ ആത്മാവിന് ആശ്വാസം ലഭിച്ചില്ല. എന്നാൽ, അവരോടു യാത്രപറഞ്ഞ് ഞാൻ മക്കെദോന്യയിലേക്കു പുറപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: ആശ്വാസമുണ്ടായില്ല
  rationale: ഗ്രീക്ക് പൂർണഭൂതരൂപം ആ സന്ദർഭത്തിലെ കഴിഞ്ഞകാലാവസ്ഥയായി മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു. ἄνεσις ഇവിടെ ഉള്ളിലെ അസ്വസ്ഥതയ്ക്കെതിരായ ‘ആശ്വാസം/സ്വസ്ഥത’ സൂചിപ്പിക്കുന്നു.
- source_word: τῷ πνεύματί μου
  choice: എന്റെ ആത്മാവിന്
  rationale: ദത്തിവ് രൂപത്തെ ‘ആത്മാവിന്’ എന്നു നൽകുന്നത് മലയാളത്തിൽ സ്വാഭാവികവും ഗ്രീക്കിലെ വ്യക്തിപരമായ ആന്തരിക അർഥം അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നതുമാണ്.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: തീത്തൊസിനെ കാണാതിരുന്നതിനാൽ
  rationale: μή ചേർന്ന articular infinitive കാരണത്തെ സൂചിപ്പിക്കുന്നു; ‘കാണാതിരുന്നതിനാൽ’ എന്നത് ‘കണ്ടെത്താൻ കഴിഞ്ഞില്ല’ എന്ന അധിക കഴിവുസൂചന ചേർക്കാതെ കാരണം വ്യക്തമാക്കുന്നു.
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: എന്റെ സഹോദരനായ തീത്തൊസിനെ
  rationale: ബന്ധത്തിന്റെ ഊഷ്മളതയുള്ള പൗലോസിന്റെ കുടുംബരൂപകം ‘സഹോദരൻ’ എന്നു നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: അവരോടു യാത്ര പറഞ്ഞിട്ട്
  rationale: പിരിഞ്ഞുപോകുന്നതിനു മുമ്പ് വിടപറയുക എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: മക്കദോന്യയിലേക്കു പുറപ്പെട്ടു
  rationale: യാത്രയുടെ ലക്ഷ്യവും അവിടെനിന്നുള്ള പുറപ്പെടലും വ്യക്തമായി നൽകുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചന
  choice: എന്റെ ആത്മാവിന്
  alternative: എന്റെ മനസ്സിന്
  rationale: ‘മനസ്സ്’ എന്നു മാനസികാവസ്ഥയായി ചുരുക്കാതെ πνεῦμα എന്ന പദത്തിന്റെ മനുഷ്യന്റെ ആന്തരിക സത്തയെ സൂചിപ്പിക്കുന്ന വിശാലത നിലനിർത്തുന്നു.
- issue: ἀδελφός എന്ന കുടുംബരൂപകം
  choice: എന്റെ സഹോദരനായ
  alternative: എന്റെ സഹവിശ്വാസിയായ
  rationale: തീത്തൊസ് രക്തബന്ധുവാണോ സഹവിശ്വാസിയും സഹപ്രവർത്തകനുമാണോ എന്നത് വാചകത്തിൽ വിശദീകരിക്കാതെ മൂലത്തിലെ രൂപകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക നിലവാര മലയാളം; വാക്യത്തിന്റെ മാന്യമായ തിരുവെഴുത്ത് ഭാവം നിലനിർത്തിക്കൊണ്ട് കൃത്രിമമായ പഴയ പ്രയോഗങ്ങൾ ഒഴിവാക്കി. ‘അതുകൊണ്ട്’ ഗ്രീക്കിലെ ἀλλάയുടെ സന്ദർഭപരമായ വഴിത്തിരിവ് മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
