id: 2CO.2.1
reference: 2 Corinthians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: ml
  text: കാരണം, വീണ്ടും ദുഃഖത്തിൽ[a] നിങ്ങളുടെ അടുക്കൽ വരാതിരിക്കാൻ ഞാൻ എന്റെ മനസ്സിൽ ഇതു തീരുമാനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദുഃഖത്തോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: തീരുമാനിച്ചു
  rationale: ഇവിടെ κρίνω എന്ന ക്രിയയുടെ ഭൂതകാലരൂപം ആലോചിച്ചെടുത്ത ഉറച്ച വ്യക്തിപരമായ തീരുമാനത്തെ സൂചിപ്പിക്കുന്നു; ‘തീരുമാനിച്ചു’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻസന്ദർഭത്തെ വിശദീകരിക്കുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ അർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐμαυτῷ
  choice: എന്നിൽത്തന്നെ
  rationale: ദത്തിവിലുള്ള ആത്മവാചക സർവനാമം പൗലോസ് സ്വന്തം മനസ്സിൽ എടുത്ത തീരുമാനമാണെന്ന ആശയം നൽകുന്നു; ഗ്രീക്കിലെ വ്യക്തിപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τοῦτο
  choice: ഇക്കാര്യം
  rationale: തുടർന്നുവരുന്ന infinitive ഖണ്ഡികയിലേക്ക് മുൻകൂട്ടി ചൂണ്ടുന്ന demonstrative-ന്റെ പ്രവർത്തനം വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: വരരുതെന്ന്
  rationale: തീരുമാനത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷപൂരകമായി അവതരിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തിന്റെ അർത്ഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν λύπῃ
  choice: ദുഃഖത്തോടെ
  rationale: ἐν + λύπη സന്ദർഭത്തിൽ ദുഃഖാവസ്ഥയിലോ ദുഃഖം സഹിതമോ വരുന്നതിനെ സൂചിപ്പിക്കാം; മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം ഉപയോഗിക്കുകയും സാധ്യതയുള്ള മറ്റൊരു ന്യൂയൻസ് അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: വരുക എന്ന ചലനക്രിയയോടുകൂടെ πρός വ്യക്തികളിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളുടെ അടുക്കൽ’ മാന്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: ἐν λύπῃ എന്നത് പൗലോസിന്റെ ദുഃഖാവസ്ഥയെയോ സന്ദർശനം ദുഃഖം ഉളവാക്കുന്ന സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ദുഃഖത്തോടെ
  alternative: ദുഃഖത്തിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം ഇരുവിധ സമീപന്യൂയൻസുകളും അനുവദിക്കുന്നു. മുഖ്യവാചകം സ്വാഭാവികമായി വായിക്കുമ്പോൾ, അടിക്കുറിപ്പ് മറ്റൊരു സാധുവായ ഗ്രഹണം സംരക്ഷിക്കുന്നു; ദുഃഖം ആരുടേതാണെന്ന് വിവർത്തനം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ വിശദീകരണബന്ധം ‘കാരണം’ എന്നും, വ്യക്തിപരമായ തീരുമാനത്തിന്റെ ഊന്നൽ ‘എന്നിൽത്തന്നെ’ എന്നും നിലനിർത്തി. കോളൻ ഉപയോഗിച്ച് τοῦτο-യുടെ പിന്നാലെയുള്ള തീരുമാനത്തിന്റെ ഉള്ളടക്കം വ്യക്തമായി വേർതിരിച്ചു.
