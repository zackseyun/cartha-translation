id: 2CO.2.16
reference: 2 Corinthians 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: ml
  text: ചിലർക്കു മരണത്തിൽനിന്ന് മരണത്തിലേക്കുള്ള ഗന്ധം; മറ്റുള്ളവർക്കു ജീവനിൽനിന്ന് ജീവനിലേക്കുള്ള ഗന്ധം.[a][b] ഈ കാര്യങ്ങൾക്ക് ആർ പ്രാപ്തൻ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഗന്ധം” എന്നതിന് “സൗരഭ്യം” അല്ലെങ്കിൽ “വാസന” എന്നും പരിഭാഷപ്പെടുത്താം; ὀσμή എന്ന പദത്തിന്റെ രണ്ടിടത്തെയും പ്രയോഗങ്ങൾക്കും ഇത് ബാധകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: “മരണത്തിൽനിന്ന് മരണത്തിലേക്ക്”, “ജീവനിൽനിന്ന് ജീവനിലേക്ക്” എന്നീ പ്രയോഗങ്ങൾ ഉറവിടവും ഫലവും—“മരണത്തിൽനിന്ന് പുറപ്പെട്ട് മരണത്തിലേക്കു നയിക്കുന്നത്” / “ജീവനിൽനിന്ന് പുറപ്പെട്ട് ജീവനിലേക്കു നയിക്കുന്നത്”—സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ മരണത്തിന്റെയും ജീവന്റെയും തീവ്രമായ സ്വഭാവവിവരണമായിരിക്കാം.
    reason: alternative_reading
  - marker: c
    text: “പ്രാപ്തൻ” എന്നതിന് “മതിയായവൻ” അല്ലെങ്കിൽ “യോഗ്യൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: സൗരഭ്യം
  rationale: ഗന്ധത്തെ ആസ്പദമാക്കിയ രൂപകം നിലനിർത്തുകയും സന്ദർഭത്തിലെ ജീവൻ–മരണം എന്ന ഇരട്ട ഫലത്തോടു ചേർന്ന് വായിക്കാവുന്ന മാന്യവും സ്വാഭാവികവുമായ മലയാളപദം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: മരണത്തിൽനിന്ന് മരണത്തിലേക്ക്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സമാന്തരഘടന സംരക്ഷിക്കുന്നു; ഉറവിടം–ഫലം എന്ന അർഥമോ തീവ്രമായ സ്വഭാവവിവരണമോ എന്ന് നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: ജീവനിൽനിന്ന് ജീവനിലേക്ക്
  rationale: മരണത്തെക്കുറിച്ചുള്ള മുൻവാക്യഘടകത്തിന്റെ കൃത്യമായ സമാന്തരത നിലനിർത്തുകയും മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πρὸς ταῦτα
  choice: ഈ കാര്യങ്ങൾക്ക്
  rationale: ταῦτα എന്ന ബഹുവചന സൂചന നിലനിർത്തിക്കൊണ്ട്, വിവരിച്ചിരിക്കുന്ന ദൗത്യത്തോടുള്ള പ്രാപ്തി എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἱκανός
  choice: പ്രാപ്തൻ
  rationale: ഒരു ഭാരമേറിയ ദൗത്യത്തിന് തക്കവനോ കഴിവുള്ളവനോ ആയിരിക്കുക എന്ന അർഥം ചുരുക്കവും ഗൗരവവുമുള്ള മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘മരണത്തിൽനിന്ന് മരണത്തിലേക്ക്’, ‘ജീവനിൽനിന്ന് ജീവനിലേക്ക്’ എന്നീ ജോടിപ്രയോഗങ്ങളുടെ വ്യാഖ്യാനബലം
  choice: ഉറവിടം–ഫലം, തീവ്രസ്വഭാവം, ശ്രോതാക്കളിലുണ്ടാകുന്ന ഫലം എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കാതെ ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തി.
  alternative: ‘മരണത്തിൽ ഉദിച്ച് മരണത്തിലേക്കു നയിക്കുന്ന’ / ‘ജീവനിൽ ഉദിച്ച് ജീവനിലേക്കു നയിക്കുന്ന’; അല്ലെങ്കിൽ ‘മരണകരമായ’ / ‘ജീവദായകമായ’.
  rationale: മൂലവാക്യം ഒറ്റ വിശദീകരണം നിർബന്ധിക്കുന്നില്ല. സംക്ഷിപ്തമായ സമാന്തരരൂപം നിലനിർത്തുന്നത് യഥാർഥമായ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ അലങ്കാരപരമായ സമാന്തരതയും സംക്ഷിപ്തതയും നിലനിർത്തി. ‘ആർ പ്രാപ്തൻ?’ എന്ന രൂപം പൗലോസിന്റെ ഗൗരവമുള്ള ആലങ്കാരികചോദ്യം സ്വാഭാവികമായി പകരുന്നു.
