    rationale: “അങ്ങനെയുള്ള ആ വ്യക്തിക്ക്” repeats the same unnecessary demonstrative construction; “അവരിൽ മിക്കവരും” can be expressed more naturally as “അവരിൽ ഭൂരിഭാഗംപേർ.”
