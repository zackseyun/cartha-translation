translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ വിധേയഘടന ‘മതി’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി; പ്രധാന പാഠത്തിൽ വ്യക്തിയുടെ പുരുഷലിംഗസൂചനയും സമൂഹത്തിലെ ഭൂരിപക്ഷത്തിന്റെ പങ്കും വ്യക്തമാക്കി.
