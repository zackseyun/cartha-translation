lexical_decisions:
- source_word: ἱκανὸν
  choice: മതി
  rationale: വാക്യത്തിലെ വിധേയാശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ശിക്ഷ ആവശ്യമായ അളവിലെത്തിയെന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: τῷ τοιούτῳ
  choice: അങ്ങനെയുള്ള ആ മനുഷ്യന്
  rationale: സന്ദർഭത്തിലെ പ്രത്യേക കുറ്റക്കാരനെയാണ് പുരുഷലിംഗ ഏകവചനപ്രയോഗം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അത് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιτιμία
  choice: ശിക്ഷ
  rationale: സമൂഹം നടപ്പാക്കിയ ശാസനാത്മക നടപടിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. വെറും വാക്കാലുള്ള ശാസന എന്നതിലുപരി യാഥാർഥ്യമായ ശിക്ഷാനടപടി എന്ന ആശയം നൽകുന്നു.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: ഭൂരിപക്ഷം ഏർപ്പെടുത്തിയ
  rationale: ὑπό എന്ന കർത്തൃസൂചനയും πλείονες എന്ന ‘കൂടുതൽ പേർ/ഭൂരിപക്ഷം’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
