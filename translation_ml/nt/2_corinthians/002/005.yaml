id: 2CO.2.5
reference: 2 Corinthians 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: ml
  text: എന്നാൽ ആരെങ്കിലും ദുഃഖം വരുത്തിയിട്ടുണ്ടെങ്കിൽ, അയാൾ ദുഃഖിപ്പിച്ചിരിക്കുന്നത് എന്നെയല്ല, ഒരു പരിധിവരെ നിങ്ങളെല്ലാവരെയുമാണ്[a]—ഞാൻ നിങ്ങളെല്ലാവരുടെയുംമേൽ ഭാരം ചുമത്താതിരിക്കാനായി.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു പരിധിവരെ’ എന്നത് ‘നിങ്ങളെല്ലാവരെയും’ യോഗ്യമാക്കുന്നതായി ഇവിടെ വിവർത്തനം ചെയ്തിരിക്കുന്നു; മൂലവാക്യത്തിന്റെ പദക്രമം ഈ ബന്ധത്തിൽ കുറച്ച് അനിശ്ചിതത്വം അനുവദിക്കുന്നു.
    reason: syntactic_ambiguity
  - marker: b
    text: അല്ലെങ്കിൽ, “ഞാൻ കാര്യം അതിരുകടന്ന് പറയാതിരിക്കാനായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: ദുഃഖം വരുത്തിയിട്ടുണ്ടെങ്കിൽ / ദുഃഖിപ്പിച്ചിരിക്കുന്നത്
  rationale: പൂർണകാലക്രിയ സൂചിപ്പിക്കുന്ന, കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം ‘വരുത്തിയിട്ടുണ്ടെങ്കിൽ’, ‘ദുഃഖിപ്പിച്ചിരിക്കുന്നത്’ എന്നീ രൂപങ്ങളിലൂടെ പ്രകടമാക്കുന്നു; രണ്ട് പ്രയോഗങ്ങളിലും λυπέω എന്ന ഒരേ മൂലപദത്തിന്റെ ബന്ധവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἐμὲ
  choice: എന്നെയല്ല
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള വൈരുധ്യം അധിക ഊന്നൽ ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ μέρους
  choice: ഒരു പരിധിവരെ
  rationale: ‘ഭാഗികമായി’ എന്ന ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു; ഇത് ‘നിങ്ങളെല്ലാവരെയും’ യോഗ്യമാക്കുന്നതായി പ്രധാനപാഠത്തിൽ വായിക്കുന്നു.
- source_word: ἐπιβαρῶ
  choice: അമിതഭാരം ചുമത്തുക
  rationale: ക്രിയയിലെ ‘ഭാരം ചുമത്തുക’ എന്ന രൂപകം നിലനിർത്തുകയും സന്ദർഭത്തിലെ ‘അതിരുകടന്ന് കുറ്റം ചുമത്തുക/കാര്യം പെരുപ്പിക്കുക’ എന്ന വാചാടോപപരമായ സാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: πάντας ὑμᾶς
  choice: നിങ്ങളെല്ലാവരെയും / നിങ്ങളെല്ലാവരുടെയുംമേൽ
  rationale: πάντας എന്ന പദത്തിന്റെ സമഗ്രതയും സമൂഹത്തെ മുഴുവനായി അഭിസംബോധന ചെയ്യുന്ന സ്വഭാവവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς എന്നതിന്റെ വാചാടോപപരമായ അർത്ഥം
  choice: ഞാൻ നിങ്ങളെല്ലാവരുടെയുംമേൽ അമിതഭാരം ചുമത്തരുതല്ലോ
  alternative: ഞാൻ കാര്യം അതിരുകടന്ന് പറയാതിരിക്കാനാണ്
  rationale: പ്രധാനപാഠം ഗ്രീക്കിലെ ഭാരം എന്ന രൂപകം സൂക്ഷിക്കുന്നു; എന്നാൽ പൗലോസ് തന്റെ പ്രസ്താവനയുടെ കാഠിന്യം കുറയ്ക്കുകയാണ് എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു. ഇതുവഴി രണ്ടു സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിതമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദുഃഖം വരുത്തുക/ദുഃഖിപ്പിക്കുക’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ പദബന്ധം സൂക്ഷിക്കുന്നു. ദീർഘവാക്യത്തിലെ വിശദീകരണപരമായ അവസാനഭാഗം ദീർഘരേഖകൊണ്ട് വേർതിരിച്ച് വായനാസൗകര്യം കൂട്ടിയിരിക്കുന്നു.
