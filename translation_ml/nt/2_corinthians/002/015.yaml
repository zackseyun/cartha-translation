id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: ml
  text: കാരണം, രക്ഷിക്കപ്പെടുന്നവരുടെ ഇടയിലും നശിച്ചുപോകുന്നവരുടെ ഇടയിലും നാം ദൈവത്തിന് മശിഹായുടെ[a] സുഗന്ധമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ.”
    reason: Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത മലയാളരൂപം.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കാരണാത്മക ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശിഹായുടെ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായവന്റെ സ്ഥാനപ്പേരെന്ന നിലയിൽ പ്രവർത്തിക്കുന്നതിനാൽ ‘മശിഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; ജനപരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: εὐωδία
  choice: സുഗന്ധം
  rationale: മണത്തെ ആധാരമാക്കിയ രൂപകം സ്വാഭാവികമായി നിലനിർത്തുകയും പദത്തിന്റെ പ്രസന്നമായ ഗന്ധം എന്ന അർഥം അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിന്
  rationale: ദത്തിവിന്റെ ബന്ധവും സുഗന്ധം ദൈവത്തിങ്കലേക്കുള്ളതാണെന്ന രൂപകദിശയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς σῳζομένοις
  choice: രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവരുടെ ഇടയിൽ
  rationale: വർത്തമാനകാല കർമണി ഭാഗധാതുവിലെ തുടരുന്ന പ്രക്രിയാസ്വഭാവം ‘രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവർ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നവരുടെ ഇടയിൽ
  rationale: വർത്തമാനകാല ഭാഗധാതുവിലെ തുടരുന്ന പ്രക്രിയാസ്വഭാവം നിലനിർത്തുന്നു; അന്തിമാവസ്ഥയായി മുൻകൂട്ടി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: σῳζομένοις, ἀπολλυμένοις എന്നീ വർത്തമാനകാല ഭാഗധാതുക്കളുടെ പ്രക്രിയാസ്വഭാവം
  choice: ‘രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവർ’, ‘നശിച്ചുകൊണ്ടിരിക്കുന്നവർ’ എന്നിങ്ങനെ തുടരുന്ന പ്രക്രിയകളായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രക്ഷിക്കപ്പെട്ടവർ’, ‘നഷ്ടപ്പെട്ടവർ’ എന്നിങ്ങനെ പൂർത്തിയായ അവസ്ഥകളായി നൽകുക.
  rationale: പൗലോസ് ഉപയോഗിക്കുന്ന വർത്തമാനകാല രൂപങ്ങൾ സൂചിപ്പിക്കുന്ന തുടരുന്ന സ്വഭാവവും അതിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഭാഷയിൽ നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അവതരണം
  choice: ‘മശിഹാ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: ‘ക്രിസ്തു’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ‘അഭിഷിക്തൻ/മശിഹാ’ എന്ന സ്ഥാനപ്പേർസ്വഭാവം തെളിയിക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ആവർത്തിച്ചുള്ള ἐν ഘടന ‘ഇടയിലും … ഇടയിലും’ എന്നു നിലനിർത്തി; വാക്യത്തിന്റെ രൂപകവും സമാന്തരതയും സംരക്ഷിച്ചു.
