  to: നിങ്ങൾ ആർക്കെങ്കിലും എന്തെങ്കിലും ക്ഷമിച്ചുകൊടുക്കുന്നുവെങ്കിൽ, ഞാനും അങ്ങനെതന്നെ ചെയ്യുന്നു. കാരണം, ഞാൻ ക്ഷമിച്ചിട്ടുള്ളത്—ഞാൻ എന്തെങ്കിലും ക്ഷമിച്ചിട്ടുണ്ടെങ്കിൽ—നിങ്ങളുടെ നിമിത്തം മശീഹായുടെ സന്നിധിയിൽ ക്ഷമിച്ചതാണ്[a].
