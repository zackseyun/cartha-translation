  terminology: '"മശീഹാ" appropriately renders the titular force of Χριστός under the project policy. "മശീഹായുടെ സന്നിധിയിൽ" is a sound main-text rendering of ἐν προσώπῳ Χριστοῦ. The footnote should more closely represent the lexical alternative "in the person of the Messiah," rather than interpret it solely as representative action.'
  issues:
