source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: ml
  text: നിങ്ങൾ ആർക്കെങ്കിലും എന്തെങ്കിലും ക്ഷമിച്ചുകൊടുക്കുന്നുവെങ്കിൽ, ഞാനും അങ്ങനെതന്നെ ചെയ്യുന്നു. കാരണം, ഞാൻ ക്ഷമിച്ചിട്ടുള്ളത്—ഞാൻ എന്തെങ്കിലും ക്ഷമിച്ചിട്ടുണ്ടെങ്കിൽ—നിങ്ങളുടെ നിമിത്തം മശീഹായുടെ സന്നിധിയിൽ ക്ഷമിച്ചതാണ്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹായുടെ വ്യക്തിയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: ക്ഷമിച്ചുകൊടുക്കുന്നു / ക്ഷമിച്ചിട്ടുണ്ടെങ്കിൽ / ക്ഷമിച്ചിരിക്കുന്നത്
  rationale: χαρίζομαι എന്നതിന് പൊതുവേ കൃപയായി നൽകുക, പ്രീതി കാണിക്കുക എന്നീ അർഥങ്ങളുണ്ടെങ്കിലും, ശിക്ഷാനടപടിക്കുശേഷമുള്ള പുനഃസ്ഥാപനമാണ് ഈ സന്ദർഭം; അതിനാൽ കുറ്റം വിട്ടുകൊടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ‘ക്ഷമിച്ചുകൊടുക്കുക’ ഏറ്റവും യോജിക്കുന്നു. പെർഫെക്റ്റ് രൂപത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയെയും ഇപ്പോഴത്തെ പ്രസക്തിയെയും ‘ക്ഷമിച്ചിട്ടുണ്ടെങ്കിൽ/ക്ഷമിച്ചിരിക്കുന്നത്’ നിലനിർത്തുന്നു.
- source_word: ᾧ ... τι
  choice: ആർക്കെങ്കിലും എന്തെങ്കിലും
  rationale: ദാതൃവിഭക്തിയിലുള്ള ബന്ധസർവനാമം ക്ഷമ ലഭിക്കുന്ന വ്യക്തിയെയും τι ക്ഷമിക്കപ്പെടുന്ന അനിശ്ചിത കാര്യത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ തുറന്ന പരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κἀγώ
  choice: ഞാനും ക്ഷമിച്ചുകൊടുക്കുന്നു
  rationale: ‘ഞാനും’ എന്ന പ്രതികരണാത്മക ഊന്നൽ വ്യക്തമാക്കുന്നതിനായി ഗ്രീക്കിലെ ചുരുക്കപ്രയോഗത്തിലുള്ള ക്രിയ മലയാളത്തിൽ ആവർത്തിച്ചു.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: ഞാൻ എന്തെങ്കിലും ക്ഷമിച്ചിട്ടുണ്ടെങ്കിൽ, ഞാൻ ക്ഷമിച്ചിരിക്കുന്നത്
  rationale: പൗലോസിന്റെ വ്യവസ്ഥാപരവും അല്പം ആത്മനിരപേക്ഷവുമായ പ്രയോഗം മിനുക്കി നിർണായക പ്രസ്താവനയാക്കാതെ നിലനിർത്തുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങളുടെ നിമിത്തം
  rationale: διά + accusative ഇവിടെ കൊരിന്ത്യരുടെ ഗുണത്തിനോ അവരെ പരിഗണിച്ചോ ചെയ്ത പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളുടെ നിമിത്തം’ ഈ ലക്ഷ്യബോധം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: മശീഹായുടെ സന്നിധിയിൽ
  rationale: πρόσωπον എന്നതിന് മുഖം, സാന്നിധ്യം, വ്യക്തി എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. ഇവിടെ മശീഹായുടെ മുമ്പാകെ, അവന്റെ ദൃഷ്ടിയിൽ പ്രവർത്തിക്കുന്നതെന്ന ഗൗരവം ‘സന്നിധിയിൽ’ സ്വാഭാവികമായി നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനെ സൂചിപ്പിക്കുന്ന പദവിയായി മനസ്സിലാക്കാവുന്നതിനാൽ പരമ്പരാഗത നാമരൂപം മാത്രം ഉപയോഗിക്കാതെ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: Χριστός എന്നത് പദവിയായി പരിഭാഷപ്പെടുത്തണമോ, പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന നാമസദൃശ രൂപത്തിൽ നിലനിർത്തണമോ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ Χριστός വെറും വ്യക്തിനാമമായി മാത്രം എടുക്കേണ്ട നിർബന്ധമില്ല; ‘അഭിഷിക്തൻ’ എന്ന പദവിയുടെ ശക്തി നിലനിർത്താൻ ‘മശീഹാ’ സ്വീകരിച്ചു.
- issue: ἐν προσώπῳ Χριστοῦ മശീഹായുടെ സന്നിധിയിലാണോ, അവന്റെ വ്യക്തി/പ്രതിനിധി എന്ന നിലയിലാണോ സൂചിപ്പിക്കുന്നത്
  choice: മശീഹായുടെ സന്നിധിയിൽ
  alternative: മശീഹായുടെ പ്രതിനിധിയായി
  rationale: സന്ദർഭത്തിൽ മശീഹായുടെ മുമ്പാകെ ക്ഷമിക്കുന്നതെന്ന വായന സ്വാഭാവികമാണ്; എങ്കിലും πρόσωπον എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി പ്രതിനിധിത്വപരമായ വായനയ്ക്കും ഇട നൽകുന്നതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘എന്തെങ്കിലും ക്ഷമിച്ചിട്ടുണ്ടെങ്കിൽ’ എന്ന ആവർത്തനവും വ്യവസ്ഥാഭാവവും ഗ്രീക്കിലെ യഥാർഥ സംശയാത്മക/ആത്മനിരപേക്ഷ ഭാവം ഇല്ലാതാക്കാതെ സൂക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം അതു വിശദീകരിക്കുന്ന ‘മശീഹായുടെ സന്നിധിയിൽ’ എന്ന പ്രയോഗത്തിനു പിന്നാലെ വെച്ചു.
