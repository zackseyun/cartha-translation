id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: ml
  text: മശീഹയുടെ സുവിശേഷത്തിനായി ഞാൻ ത്രോവാസിൽ എത്തിയപ്പോൾ, കർത്താവിൽ എനിക്കായി ഒരു വാതിൽ തുറക്കപ്പെട്ടിരിക്കെ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: ഞാൻ … എത്തിയപ്പോൾ
  rationale: ഏറിസ്റ്റ് കൃന്തത്തിന്റെ സന്ദർഭോചിതമായ കാലാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വാക്യബന്ധം പ്രത്യേകം പദമായി ചേർക്കാതെ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εἰς τὴν Τρῳάδα
  choice: ത്രോവാസിൽ
  rationale: സ്ഥലത്തേക്കുള്ള വരവ് മലയാളത്തിൽ ‘ത്രോവാസിൽ എത്തി’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: ക്രിസ്തുവിന്റെ സുവിശേഷത്തിനായി
  rationale: εἰς എന്നതിന്റെ ഉദ്ദേശ്യാർഥവും τοῦ Χριστοῦ എന്ന ജനിറ്റീവ് ഘടനയും നിലനിർത്തുന്നു; ‘പ്രസംഗിക്കാൻ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത ക്രിയ ചേർക്കുന്നില്ല.
- source_word: θύρας
  choice: ഒരു വാതിൽ
  rationale: അവസരം എന്ന ആശയം സൂചിപ്പിക്കുന്ന രൂപകമാണെങ്കിലും പൗലോസിന്റെ വാതിൽ-ചിത്രം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἀνεῳγμένης
  choice: തുറക്കപ്പെട്ടിരുന്നു
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപത്തിലെ മുൻപ്രവൃത്തിയും അതിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലാവസ്ഥയും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ἐν എന്നതിനെ ഉപകരണാർഥമായ ‘കർത്താവിനാൽ’ എന്നു പരിമിതപ്പെടുത്താതെ പൗലോസിന്റെ സവിശേഷമായ പ്രയോഗത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ വിവർത്തനം
  choice: ക്രിസ്തുവിന്റെ
  alternative: മശീഹയുടെ
  rationale: മലയാളത്തിലെ സാധാരണ ബൈബിൾ-ഭാഷയിൽ ‘ക്രിസ്തു’ അഭിഷിക്തനായവന്റെ സ്ഥാനനാമാർഥം വഹിക്കുന്ന സുതാര്യവും മാന്യവുമായ രൂപമാണ്; അപരിചിതത്വം കുറയ്ക്കുന്നതിനൊപ്പം ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധവും നിലനിർത്തുന്നു.
- issue: ἐν κυρίῳ എന്നതിന്റെ ബന്ധം
  choice: കർത്താവിൽ
  alternative: കർത്താവിനാൽ
  rationale: വാതിൽ തുറന്നത് കർത്താവാണെന്ന ഉപകരണാർഥം സന്ദർഭത്തിൽ സാധ്യമാണെങ്കിലും, ഗ്രീക്ക് ἐν അനുവദിക്കുന്ന വിശാലവും പൗലോസിന് സവിശേഷവുമായ ബന്ധാർഥം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ-ഗദ്യശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ അർധവിരാമസദൃശമായ കോമ നിലനിർത്തുന്നു. പ്രധാന വാക്യത്തിലെ ‘എങ്കിലും’ അടുത്ത വാക്യത്തിൽ വ്യക്തമാകുന്ന വൈരുധ്യത്തിലേക്കുള്ള സ്വാഭാവിക മലയാളബന്ധം നൽകുന്നു.
