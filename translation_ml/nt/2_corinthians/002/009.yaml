id: 2CO.2.9
reference: 2 Corinthians 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: ml
  text: 'ഇതിനു വേണ്ടിയാണ് ഞാൻ എഴുതിയതും: പരീക്ഷണത്തിലൂടെ തെളിയപ്പെട്ട നിങ്ങളുടെ നില എന്താണെന്നും, നിങ്ങൾ എല്ലാ കാര്യങ്ങളിലും അനുസരണമുള്ളവരാണോ എന്നും അറിയാനായി.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: ഞാൻ എഴുതിയതിന്റെ ഉദ്ദേശ്യവും ഇതുതന്നെയായിരുന്നു
  rationale: εἰς τοῦτο എന്ന ഉദ്ദേശ്യസൂചനയും γάρ നൽകുന്ന വിശദീകരണബന്ധവും καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα γνῶ
  choice: അറിയുക
  rationale: എഴുത്തിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα ഉപവാക്യത്തെ മുൻവാക്യത്തിലെ ‘ഉദ്ദേശ്യം’ എന്ന പ്രയോഗവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; γινώσκωയുടെ അറിഞ്ഞുവരുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: നിങ്ങളുടെ പരീക്ഷയിൽ തെളിഞ്ഞ നില
  rationale: δοκιμήയ്ക്ക് പരീക്ഷണം എന്നും പരീക്ഷയിലൂടെ വെളിപ്പെടുന്ന തെളിവ്/ഗുണനിലവാരം എന്നും അർഥമാകാം. ‘പരീക്ഷയിൽ തെളിഞ്ഞ നില’ ഈ ഫലഭാവം പ്രകടിപ്പിക്കുമ്പോഴും ‘സ്വഭാവഗുണം’ പോലുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: നിങ്ങൾ എല്ലാ കാര്യങ്ങളിലും അനുസരണമുള്ളവരാണോ എന്ന്
  rationale: γνῶയെ തുടർന്നുള്ള εἰയുടെ പരോക്ഷചോദ്യഭാവവും εἰς πάνταയുടെ സമഗ്രതയും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: δοκιμήയെ നൈതിക ‘സ്വഭാവം’ എന്നു നിർണയിക്കണമോ
  choice: പരീക്ഷയിൽ തെളിഞ്ഞ നില
  alternative: തെളിയിക്കപ്പെട്ട സ്വഭാവം; വിശ്വാസ്യത
  rationale: സന്ദർഭത്തിൽ അനുസരണമാണ് പരിശോധിക്കപ്പെടുന്നത്; എങ്കിലും ഗ്രീക്ക് പദം ഒരു പ്രത്യേക നൈതികമോ ദൈവശാസ്ത്രപരമോ ആയ സ്വഭാവഗുണത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല. അതിനാൽ പരീക്ഷയും അതിന്റെ തെളിഞ്ഞ ഫലവും ഉൾക്കൊള്ളുന്ന വിശാലമായ പ്രയോഗം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുഖ്യപാഠത്തിലെ ഡാഷുകൾ ‘നിങ്ങൾ എല്ലാ കാര്യങ്ങളിലും അനുസരണമുള്ളവരാണോ’ എന്നത് ‘പരീക്ഷയിൽ തെളിഞ്ഞ നില’യെ വിശദീകരിക്കുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു.
