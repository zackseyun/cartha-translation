id: 2CO.2.17
reference: 2 Corinthians 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: ml
  text: ദൈവവചനം ലാഭത്തിനായി കച്ചവടം ചെയ്യുന്ന[b] അനേകരെ[a]പ്പോലെ അല്ല ഞങ്ങൾ; മറിച്ച്, നിർമലതയിൽനിന്നുള്ളവരായും[c] ദൈവത്തിൽനിന്നുള്ളവരായും, ദൈവസന്നിധിയിൽ[d] മശീഹയിൽ[e] ഞങ്ങൾ സംസാരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനേകർ’ എന്നതിന് ‘വളരെയധികം മറ്റുള്ളവർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലാഭത്തിനായി കച്ചവടം ചെയ്യുന്ന’ എന്നതിന് ‘ലാഭത്തിനായി വിൽക്കുക’ എന്നും വിവർത്തനം ചെയ്യാം; ഈ ഗ്രീക്ക് പദത്തിന് കലർപ്പുവരുത്തുക എന്ന സൂചനയും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘നിർമലതയിൽനിന്നുള്ളവരായി’ എന്നതിന് ‘നിർമലതയോടെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: d
    text: ‘ദൈവസന്നിധിയിൽ’ എന്നതിന് ‘ദൈവത്തിന്റെ മുമ്പിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: e
    text: ‘മശീഹയിൽ’ എന്നതിന്റെ പരമ്പരാഗത രൂപം ‘ക്രിസ്തുവിൽ’ എന്നാണ്.
    reason: traditional_rendering
lexical_decisions:
- source_word: οἱ πολλοί
  choice: അനേകർ
  rationale: നിശ്ചിത ആർട്ടിക്കിളോടുകൂടിയ പ്രയോഗം പൗലൊസ് തന്നെത്തന്നെയും സഹപ്രവർത്തകരെയും ഒരു വലിയ കൂട്ടത്തിൽനിന്ന് വേർതിരിക്കുന്നതായി സൂചിപ്പിക്കുന്നു. ‘ഭൂരിപക്ഷം’ എന്ന സ്ഥിതിവിവരാർഥം നിർബന്ധിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ ‘അനേകർ’ ആ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: καπηλεύοντες
  choice: കച്ചവടച്ചരക്കാക്കുന്ന
  rationale: സ്വലാഭത്തിനായി ചില്ലറവ്യാപാരം ചെയ്യുകയോ വില്പനയ്ക്കുള്ള ചരക്കുപോലെ കൈകാര്യം ചെയ്യുകയോ ചെയ്യുന്ന നിന്ദാസൂചന ഈ പദത്തിനുണ്ട്. ‘കച്ചവടച്ചരക്കാക്കുന്ന’ എന്നത് വാണിജ്യരൂപകവും ധാർമിക വിമർശനവും നിലനിർത്തുന്നു; കലർപ്പുവരുത്തുന്നു എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയുടെ നേരിട്ടുള്ളതും മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതവുമായ സമാനപ്രയോഗമാണിത്.
- source_word: ἐξ εἰλικρινείας
  choice: നിർമലമായ ഉദ്ദേശ്യത്തിൽനിന്ന്
  rationale: εἰλικρίνεια സത്യസന്ധതയും കലർപ്പില്ലായ്മയും സൂചിപ്പിക്കുന്നു. ‘ഉദ്ദേശ്യം’ ചേർക്കുന്നത് ഇവിടെ പ്രസംഗത്തിന്റെ ആന്തരിക പ്രേരണയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ἐξ എന്ന ഉറവിടഭാവം ‘നിന്ന്’ വഴി നിലനിർത്തുന്നു.
- source_word: ἐκ θεοῦ
  choice: ദൈവത്തിൽനിന്ന്
  rationale: ശുശ്രൂഷയുടെ ഉറവിടം ദൈവമാണെന്ന പ്രസ്താവന വ്യാഖ്യാനവിസ്താരം കൂടാതെ നേരിട്ട് നൽകുന്നു.
- source_word: κατέναντι θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള സാന്നിധ്യവും ഉത്തരവാദിത്വവും മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός എന്ന അഭിഷിക്തന്റെ സ്ഥാനപ്പേര് ഇവിടെ പൗലൊസിന്റെ പതിവായ ബന്ധപരമായ പ്രയോഗത്തിനുള്ളിലാണെങ്കിലും അർഥസജീവമാണ്. അതിനാൽ പേരുപോലെ വെറും ലിപ്യന്തരണം ചെയ്യാതെ ‘മശീഹ’ എന്നു നൽകുന്നു.
- source_word: λαλοῦμεν
  choice: ഞങ്ങൾ സംസാരിക്കുന്നു
  rationale: സാധാരണ വർത്തമാനകാല ക്രിയയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘പ്രഘോഷിക്കുന്നു’ എന്നു നൽകിയാൽ ഗ്രീക്കിനേക്കാൾ പ്രത്യേകമായ പ്രസംഗാർഥം ചേർന്നുപോകും.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστῷയുടെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: പരമ്പരാഗതമായി ‘ക്രിസ്തുവിൽ’ എന്നു പറയുന്നുവെങ്കിലും Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന അർഥം ഇവിടെ ഇല്ലാതായിട്ടില്ല. അതിനാൽ പദ്ധതിയുടെ സ്ഥാനപ്പേര്-പരിഭാഷാ നയം അനുസരിച്ച് ‘മശീഹയിൽ’ സ്വീകരിച്ചു.
- issue: ἀλλ’ ὡς ... ἀλλ’ ὡς എന്ന ആവർത്തിത ഘടന
  choice: മറിച്ച്, ... എന്നപോലെയും ... എന്നപോലെയും
  alternative: എന്നാൽ ... എന്നപോലെ, എന്നാൽ ... എന്നപോലെ
  rationale: രണ്ടു ഉറവിടവാക്യാംശങ്ങളുടെയും സമാന്തരതയും ὡς എന്ന താരതമ്യ/അവതരണഭാവവും നിലനിർത്തുന്നു; മലയാളത്തിൽ രണ്ടാമത്തെ ἀλλά യാന്ത്രികമായി ആവർത്തിച്ച് തിരുത്തൽപോലെ കേൾക്കുന്നത് ഒഴിവാക്കുന്നു. ‘എന്നപോലെ’ എന്നത് ഗ്രീക്കിലെ ὡς മൂലം നിലനിൽക്കുന്ന സൂക്ഷ്മമായ ഭാഷാഭാവം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാണിജ്യരൂപകം വ്യക്തമായി നിലനിർത്തി; ഗ്രീക്കിലെ ആവർത്തിത ὡς ഘടനയുടെ സൂക്ഷ്മത മലയാളത്തിലെ ‘എന്നപോലെ’ എന്ന സമാന്തരപ്രയോഗത്തിലൂടെ സംരക്ഷിച്ചു.
