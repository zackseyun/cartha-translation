id: 2CO.8.6
reference: 2 Corinthians 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: ml
  text: അതുകൊണ്ട്, തീത്തോസ് മുമ്പ് ആരംഭിച്ചതുപോലെതന്നെ, നിങ്ങളുടെ ഇടയിൽ ഈ കൃപാപ്രവൃത്തിയും പൂർത്തിയാക്കണമെന്ന് ഞങ്ങൾ അദ്ദേഹത്തോട് അഭ്യർഥിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഈ കൃപാപൂർവമായ പ്രവർത്തനവും”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “ഈ കൃപയും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: അഭ്യർഥിച്ചു
  rationale: തീത്തോസിനെ ഒരു പ്രവർത്തനം പൂർത്തിയാക്കാൻ പ്രേരിപ്പിക്കുന്ന സന്ദർഭത്തിൽ, ‘അഭ്യർഥിച്ചു’ എന്നത് παρακαλέωയുടെ അഭ്യർഥനയും പ്രോത്സാഹനവും ഉൾക്കൊള്ളുന്ന ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Τίτον
  choice: തീത്തോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: καθὼς προενήρξατο
  choice: മുമ്പ് ആരംഭിച്ചതുപോലെതന്നെ
  rationale: προενήρξατο എന്ന ക്രിയയിലെ നേരത്തേ ആരംഭിച്ചു എന്ന കാലസൂചന നിലനിർത്തുന്നു.
- source_word: ἐπιτελέσῃ
  choice: പൂർത്തിയാക്കണമെന്ന്
  rationale: ἵναയോടുകൂടിയ ഉപവാക്യത്തിലെ ഉദ്ദേശ്യഭാവവും ആരംഭിച്ച സംരംഭത്തെ സമാപ്തിയിലെത്തിക്കുന്ന അർഥവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: കൊരിന്ത്യസഭയുടെ മധ്യേ നിർവഹിക്കപ്പെടുന്ന പ്രവർത്തനമെന്ന ദിശാത്മകവും സമൂഹപരവുമായ അർഥം നൽകുന്നു.
- source_word: καὶ τὴν χάριν ταύτην
  choice: ഈ കൃപാപ്രവൃത്തിയും
  rationale: καίയുടെ ‘-ഉം’ എന്ന ചേർക്കൽഭാവം നിലനിർത്തുകയും χάρις ഇവിടെ സൂചിപ്പിക്കുന്ന കൃപയാൽ പ്രേരിതമായ സംഭാവനാപ്രവർത്തനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അതേസമയം ‘കൃപ’ എന്ന പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ ഭാഷ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സംഭാവനയുടെ പശ്ചാത്തലത്തിൽ χάρις എന്നതിന്റെ അർഥം
  choice: കൃപാപ്രവൃത്തി
  alternative: കൃപ; കൃപാപൂർവമായ പ്രവർത്തനം; സംഭാവന
  rationale: സമീപസന്ദർഭം വിശുദ്ധർക്കായുള്ള ധനശേഖരണത്തെയും അത് പൂർത്തിയാക്കുന്നതിൽ തീത്തോസിന്റെ പങ്കിനെയും കുറിച്ചാണ്. ‘കൃപാപ്രവൃത്തി’ മൂർത്തമായ ശുശ്രൂഷയെ വ്യക്തമാക്കുമ്പോഴും അതിനെ പൗലോസ് കൃപയായി വിശേഷിപ്പിക്കുന്ന ദൈവശാസ്ത്രപരമായ ഭാവം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ലക്ഷ്യഭാവവും ‘മുമ്പ് ആരംഭിച്ചു—പൂർത്തിയാക്കുക’ എന്ന ഘടനയും χάρις എന്ന പദത്തിലെ മൂർത്തവും ദൈവശാസ്ത്രപരവുമായ ഇരട്ടഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
