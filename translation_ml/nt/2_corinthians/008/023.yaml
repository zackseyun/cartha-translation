reference: 2 Corinthians 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: ml
  text: തീത്തൊസിനെക്കുറിച്ചു പറയുകയാണെങ്കിൽ, അവൻ എന്റെ പങ്കാളിയും നിങ്ങൾക്കുവേണ്ടിയുള്ള സഹപ്രവർത്തകനുമാണ്; നമ്മുടെ സഹോദരന്മാരെക്കുറിച്ചു പറയുകയാണെങ്കിൽ, അവർ സഭകളുടെ ദൂതന്മാരും[a] മശീഹായുടെ മഹത്വവുമാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഭകളുടെ അപ്പൊസ്തലന്മാർ.” ഗ്രീക്ക് പദത്തിന് നിയോഗിക്കപ്പെട്ട ദൂതന്മാർ/പ്രതിനിധികൾ എന്നും വിശാലമായ അർഥത്തിൽ അപ്പൊസ്തലന്മാർ എന്നും അർഥമാകാം; ഇവിടെ സന്ദർഭം സഭകളുടെ പ്രതിനിധികളെയാണ് കൂടുതൽ സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ക്രിസ്തുവിന്റെ മഹത്വം.” ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ “മശീഹാ” എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου … εἴτε ἀδελφοὶ ἡμῶν
  choice: തീത്തൊസിനെക്കുറിച്ചു പറയുകയാണെങ്കിൽ … നമ്മുടെ സഹോദരന്മാരെക്കുറിച്ചു പറയുകയാണെങ്കിൽ
  rationale: മൂലത്തിലെ സമാന്തരവും അപൂർണവുമായ εἴτε … εἴτε ഘടനയുടെ വിഷയമാറ്റ പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ὑπέρ ഇവിടെ ‘സംബന്ധിച്ച്’ എന്ന അർഥത്തിലാണ്.
- source_word: κοινωνὸς ἐμὸς
  choice: എന്റെ പങ്കാളി
  rationale: കൂട്ടായ പങ്കാളിത്തവും ശുശ്രൂഷയിലെ സഹഭാഗിത്വവും സൂചിപ്പിക്കുന്ന κοινωνός എന്ന പദത്തിന്റെ അർഥം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἰς ὑμᾶς συνεργός
  choice: നിങ്ങൾക്കുവേണ്ടിയുള്ള സഹപ്രവർത്തകൻ
  rationale: συνεργός എന്നതിന് ‘സഹപ്രവർത്തകൻ’ എന്നും കൊരിന്ത്യരിലേക്കു തിരിഞ്ഞുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന εἰς ὑμᾶς എന്നതിന് ‘നിങ്ങൾക്കുവേണ്ടിയുള്ള’ എന്നും നൽകി; ‘നിങ്ങളുടെ നന്മയ്ക്കായി’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കി.
- source_word: ἀδελφοὶ ἡμῶν
  choice: നമ്മുടെ സഹോദരന്മാർ
  rationale: ഈ സന്ദർഭത്തിലെ പുരുഷബഹുവചനവും അയക്കപ്പെട്ട പുരുഷപ്രതിനിധികളെയും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: സഭകളുടെ ദൂതന്മാർ
  rationale: ഇവിടെ ἀπόστολοι സഭകൾ നിയോഗിച്ചയച്ച പ്രതിനിധികളെ സൂചിപ്പിക്കുന്നു; പ്രത്യേക അപ്പൊസ്തലിക പദവി അനാവശ്യമായി ചുമത്താതെ വിശാലമായ പദാർഥം നൽകുന്നു.
- source_word: δόξα Χριστοῦ
  choice: മശീഹായുടെ മഹത്ത്വം
  rationale: വാക്യത്തിലെ ക്രിയാരഹിതമായ സമാനാധികരണ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: പേരിടാത്ത സഹോദരന്മാരെക്കുറിച്ചുള്ള ἀπόστολοι എന്ന പദത്തിന്റെ അർഥം
  choice: സഭകളുടെ ദൂതന്മാർ/നിയോഗിത പ്രതിനിധികൾ
  alternative: സഭകളുടെ അപ്പൊസ്തലന്മാർ
  rationale: ധനശേഖരണവുമായി ബന്ധപ്പെട്ട് സഭകൾ അയച്ച പ്രതിനിധികളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; അവരുടെ സഭാപദവിയെക്കുറിച്ച് മൂലപാഠം ആവശ്യപ്പെടാത്ത നിഗമനം ഒഴിവാക്കുന്നു. പദത്തിലെ സാദ്ധ്യമായ വിശാല അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: Χριστός ഇവിടെ വ്യക്തിനാമംപോലെയല്ല, അഭിഷിക്തന്റെ സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ അർഥവിവർത്തനമായ ‘മശീഹാ’ ഉപയോഗിച്ചു, പരിചിതമായ പകരം അടിക്കുറിപ്പിൽ നൽകി.
- issue: δόξα Χριστοῦ എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: അവർ മശീഹായുടെ മഹത്ത്വമാണ്
  alternative: അവർ മശീഹായ്ക്ക് മഹത്വം വരുത്തുന്നവരാണ്
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും അർഥസാന്ദ്രവുമായ സമാനാധികരണ പ്രയോഗം നിലനിർത്തി; അവർ മശീഹായുടെ മഹത്ത്വം പ്രകടമാക്കുന്നു എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. εἴτε … εἴτε എന്ന സമാന്തര ഘടന ആവർത്തനത്തിലൂടെ വ്യക്തമായി സൂക്ഷിച്ചു. δόξα Χριστοῦ എന്ന സാന്ദ്രപ്രയോഗം വിശദീകരിച്ചു തീർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില നിലനിർത്തി.
