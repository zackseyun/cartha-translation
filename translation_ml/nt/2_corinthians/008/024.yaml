id: 2CO.8.24
reference: 2 Corinthians 8:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ സ്നേഹത്തിന്റെയും നിങ്ങളെക്കുറിച്ചുള്ള ഞങ്ങളുടെ പ്രശംസയുടെയും തെളിവ് സഭകളുടെ സന്നിധിയിൽ അവർക്കു കാണിച്ചുകൊടുക്കുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδειξιν
  choice: തെളിവ്
  rationale: സ്നേഹത്തെ പ്രവൃത്തിയിലൂടെ പ്രകടമാക്കി അതിന്റെ യാഥാർഥ്യം വ്യക്തമാക്കുന്ന കാര്യം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘പ്രകടനം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀγάπης
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ; ഇവിടെ പ്രവൃത്തിയിൽ വെളിപ്പെടുന്ന ബന്ധപരമായ സ്നേഹമാണ് ഉദ്ദേശ്യം.
- source_word: καυχήσεως
  choice: പ്രശംസ
  rationale: കൊരിന്ത്യരെക്കുറിച്ച് പൗലോസ് അഭിമാനപൂർവം പറഞ്ഞ കാര്യമാണ് സന്ദർഭം. മലയാളത്തിൽ ‘പ്രശംസ’ സ്വാഭാവികമാണ്; അതിന്റെ ന്യായം അവർ പ്രവൃത്തിയാൽ തെളിയിക്കണമെന്ന ആശയം വാക്യത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ചുള്ള
  rationale: καύχησις എന്നതോടൊപ്പം, കൊരിന്ത്യരെ സംബന്ധിച്ച് പൗലോസ് നടത്തിയ പ്രശംസയെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς αὐτοὺς
  choice: അവർക്കു
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ സഹോദരന്മാരെയോ സഭകളുടെ പ്രതിനിധികളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐνδεικνύμενοι
  choice: കാണിച്ചുകൊടുക്കുക
  rationale: സന്ദർഭത്തിൽ ആജ്ഞാർഥക ശക്തിയുള്ള കർത്തൃവാചകത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള ആജ്ഞയായി നൽകുന്നു.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: സഭകളുടെ സന്നിധിയിൽ
  rationale: സഭകളുടെ പ്രതിനിധികൾക്കു മുമ്പാകെയുള്ള പരസ്യമായ തെളിയിക്കൽ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനവും പ്രബോധനവും ബന്ധിപ്പിക്കുന്ന ഘടകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: καύχησις എന്നതിന്റെ മൂല്യനിറം
  choice: ‘പ്രശംസ’ എന്ന് പരിഭാഷപ്പെടുത്തി, അതിന്റെ ‘ന്യായം’ കാണിക്കണമെന്ന് വ്യക്തമാക്കി
  alternative: ‘അഭിമാനപൂർവമായ പ്രശംസ’ അല്ലെങ്കിൽ ‘പുകഴ്ച’
  rationale: പൗലോസിന്റെ വാചാടോപശക്തി നിലനിർത്തുമ്പോഴും മലയാളത്തിൽ അനാവശ്യമായി ദോഷാർഥമുള്ള ‘പൊങ്ങച്ചം’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു; പ്രത്യേക സമുദായവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനമായ ἔνδειξις/ἐνδείκνυμι മലയാളത്തിൽ ‘തെളിവ്… കാണിച്ചുകൊടുക്കുക’ എന്ന ബന്ധത്തിലൂടെ നിലനിർത്തി. ‘ഞങ്ങളുടെ പ്രശംസയുടെ ന്യായം’ എന്ന രൂപം, സ്നേഹത്തോടൊപ്പം പ്രശംസ തന്നെയാണ് കാണിക്കേണ്ടത് എന്ന അസ്വാഭാവിക ധാരണ ഒഴിവാക്കി, ഗ്രീക്ക് വാക്യത്തിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാരന് വ്യക്തമാക്കുന്നു.
