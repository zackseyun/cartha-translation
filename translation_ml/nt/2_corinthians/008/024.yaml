- from: അതുകൊണ്ട്, നിങ്ങളുടെ സ്നേഹത്തിന്റെ തെളിവും[a] നിങ്ങളെക്കുറിച്ചുള്ള ഞങ്ങളുടെ പ്രശംസയുടെ ന്യായവും സഭകളുടെ സന്നിധിയിൽ[b] അവർക്കു കാണിച്ചുകൊടുക്കുക.
