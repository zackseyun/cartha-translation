id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: ml
  text: കാരണം, സന്നദ്ധത ഉണ്ടെങ്കിൽ[a], ഒരാൾക്കുള്ളതിനനുസരിച്ച്[b] അതു സ്വീകാര്യമാണ്; ഒരാൾക്കില്ലാത്തതിനനുസരിച്ചല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉത്സാഹം” അല്ലെങ്കിൽ “മനസ്സൊരുക്കം.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരാൾക്ക് എന്തെങ്കിലും ഉണ്ടായിരിക്കുമോ അതനുസരിച്ച് ... ഒരാൾക്കില്ലാത്തതിനനുസരിച്ചല്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: സന്നദ്ധത
  rationale: മനസ്സോടെയുള്ള ഒരുക്കത്തെയും നൽകാനുള്ള സന്നദ്ധ മനോഭാവത്തെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം; ‘ഉത്സാഹം’ സാധ്യമെങ്കിലും ഇവിടെ തയ്യാറായ മനസ്സാണ് മുൻനിരയിൽ.
- source_word: πρόκειται
  choice: ഉണ്ടെങ്കിൽ
  rationale: ഈ പ്രയോഗത്തിൽ അക്ഷരാർഥമായ ‘മുന്നിൽ വെച്ചിരിക്കുന്നു’ എന്നതിനെക്കാൾ, സന്നദ്ധത യഥാർഥത്തിൽ നിലവിലുണ്ടെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: ഒരാൾക്കുള്ളതനുസരിച്ച്
  rationale: ലഭ്യമായ ശേഷിയോ സമ്പത്തോ ആണ് അളവുകോൽ എന്ന അനുപാതപരമായ ആശയം നിലനിർത്തുന്നു; ഗ്രീക്കിലെ പൊതുവായ ഏകവചനത്തെ ലിംഗനിരപേക്ഷമായി അവതരിപ്പിക്കുന്നു.
- source_word: εὐπρόσδεκτος
  choice: സ്വീകാര്യമാകുന്നത്
  rationale: സ്വീകാര്യവും അനുകൂലമായി സ്വീകരിക്കപ്പെടുന്നതുമായ അർഥം നൽകുന്നു; ആരുടെ മുമ്പിലാണ് സ്വീകാര്യമെന്നത് വാക്യത്തിൽ ചേർത്ത് നിർണ്ണയിക്കുന്നില്ല.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: ഇല്ലാത്തതനുസരിച്ചല്ല
  rationale: മുൻ ഉപവാക്യത്തോടുള്ള പൗലോസിന്റെ വൈരുധ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: εἰ γὰρ
  choice: എന്തെന്നാൽ ... എങ്കിൽ
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും εἰ-യുടെ നിബന്ധനാത്മകതയും മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സ്വീകാര്യതയുടെ സൂചിപ്പിക്കപ്പെട്ട മാനദണ്ഡവും സ്വീകരിക്കുന്നവനും
  choice: യഥാർഥ സന്നദ്ധതയോടെയുള്ള കൊടുക്കൽ ഒരാൾക്കുള്ളതനുസരിച്ച് സ്വീകാര്യമാണെന്ന് പറയുന്നു; അത് ദൈവത്തിനോ സഭയ്ക്കോ രണ്ടിനുമോ സ്വീകാര്യമാണെന്ന് വിവർത്തനം പ്രത്യേകം നിർണ്ണയിക്കുന്നില്ല.
  alternative: ‘ദൈവത്തിനു സ്വീകാര്യം’ അല്ലെങ്കിൽ ‘സമൂഹത്തിനു സ്വീകാര്യം’ എന്ന് വ്യക്തമാക്കുക.
  rationale: εὐπρόσδεκτος സ്വീകാര്യതയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അത് ആരുടെ മുമ്പിലാണെന്ന് ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരവും സാമൂഹികവുമായ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ ശൈലി. ഗ്രീക്കിലെ നിബന്ധനയും അനുപാതപരമായ വൈരുധ്യവും നിലനിർത്തി; ‘സ്വീകാര്യം’ ആരുടെ മുമ്പിലാണ് എന്നത് വിശദീകരിച്ച് ചേർത്തിട്ടില്ല.
