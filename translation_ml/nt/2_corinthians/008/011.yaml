- from: എന്നാൽ ഇപ്പോൾ അതു പ്രവർത്തിയിൽ പൂർത്തിയാക്കുക[a]. അങ്ങനെ, ചെയ്യണമെന്നുള്ള ഉത്സാഹം ഉണ്ടായിരുന്നതുപോലെതന്നെ, നിങ്ങൾക്കുള്ളതിൽനിന്ന് അതു പൂർത്തിയാക്കലും ഉണ്ടാകട്ടെ[b].
