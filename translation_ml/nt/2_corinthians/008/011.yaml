source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ അത് നടപ്പാക്കി പൂർത്തിയാക്കുക[a]. അങ്ങനെ, ചെയ്യാനുള്ള സന്നദ്ധത ഉണ്ടായിരുന്നതുപോലെതന്നെ, നിങ്ങൾക്കുള്ളതിൽനിന്ന് അത് പൂർത്തിയാക്കലും ഉണ്ടാകട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതു നടപ്പിലാക്കി തീർക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘നിങ്ങൾക്കുള്ളതിൽനിന്ന്’; അതായത്, ഇപ്പോൾ നിങ്ങൾക്കുള്ള സാമ്പത്തികശേഷിക്കനുസരിച്ച്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: δέയുടെ നേരിയ പ്രതികൂലഭാവവും νυνίയുടെ കാലസൂചനയും നിലനിർത്തിക്കൊണ്ട്, മുൻപത്തെ സന്നദ്ധതയിൽനിന്ന് ഇപ്പോഴത്തെ പ്രവർത്തിയിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: അതു പ്രവർത്തിയിൽ പൂർത്തിയാക്കുക
  rationale: മുമ്പ് ഉദ്ദേശിച്ച സംഭാവനയെ യാഥാർഥ്യപ്രവർത്തിയിലൂടെ പൂർത്തിയാക്കണമെന്ന കല്പന വ്യക്തമാക്കുന്നു. articular infinitive-ന്റെ നാമസദൃശ ഭാവം അക്ഷരാർഥത്തിൽ പകർത്താതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: ചെയ്യണമെന്നുള്ള ഉത്സാഹം
  rationale: προθυμίαയിലെ സന്നദ്ധവും ഉത്സുകവുമായ മനോഭാവവും θέλεινയിലെ ഇച്ഛാശക്തിയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: അതുപോലെതന്നെ ... പൂർത്തിയാക്കലും ഉണ്ടാകട്ടെ
  rationale: ആഗ്രഹവും നിർവഹണവും തമ്മിലുള്ള καθάπερ ... οὕτως καί താരതമ്യഘടനയും ἐπιτελέω എന്ന ക്രിയയുടെ ആവർത്തിതമായ പൂർത്തീകരണ ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: ἐκ τοῦ ἔχειν
  choice: നിങ്ങൾക്കുള്ളതിൽനിന്ന്
  rationale: സംഭാവന അവരുടെ കൈവശമുള്ള വിഭവങ്ങളിൽനിന്നായിരിക്കണം എന്ന ഉറവിട/അളവ് സൂചന സംരക്ഷിക്കുന്നു; ‘കഴിവനുസരിച്ച്’ എന്ന് മാത്രം പറഞ്ഞ് അർഥം മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: നിലവിലുള്ള വിഭവങ്ങൾക്കനുസരിച്ചുള്ള ദാനം
  choice: വാഗ്ദാനം ചെയ്ത സംഭാവന തങ്ങൾക്കുള്ളതിൽനിന്ന് പൂർത്തിയാക്കണമെന്ന് വാക്യം ഉദ്ബോധിപ്പിക്കുന്നു.
  alternative: സാമ്പത്തികശേഷി പരിഗണിക്കാതെ ഏതു നല്ല ഉദ്ദേശ്യവും പൂർത്തിയാക്കണമെന്ന പൊതുവായ ആഹ്വാനം.
  rationale: അടുത്ത സന്ദർഭം കൊരിന്ത്യരുടെ സംഭാവനയെക്കുറിച്ചാണ്; ἐκ τοῦ ἔχειν അവരുടെ കൈവശമുള്ളതിൽനിന്നുള്ള നിർവഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ ശേഷിക്കുമപ്പുറം നൽകണമെന്ന ആശയം വിവർത്തനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രവർത്തിയിൽ പൂർത്തിയാക്കുക’ എന്ന പ്രയോഗം ഉദ്ദേശ്യത്തിൽനിന്ന് യഥാർഥ നിർവഹണത്തിലേക്കുള്ള നീക്കം വ്യക്തമാക്കുന്നു. താരതമ്യഘടനയും ‘പൂർത്തിയാക്കുക/പൂർത്തിയാക്കൽ’ എന്ന ആവർത്തനവും ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
