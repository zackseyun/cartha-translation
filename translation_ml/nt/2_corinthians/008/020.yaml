  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: στελλόμενοι τοῦτο μή τις ἡμᾶς μωμήσηται ἐν τῇ ἁδρότητι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: ml
  text: ഞങ്ങൾ കൈകാര്യം ചെയ്യുന്ന ഈ ഉദാരമായ സംഭാവനയെക്കുറിച്ച്[a] ആരും ഞങ്ങളെ കുറ്റപ്പെടുത്താതിരിക്കാൻ ഞങ്ങൾ ഈ മുൻകരുതൽ എടുക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ സമൃദ്ധമായ ദാനത്തെക്കുറിച്ച്.” ‘ഉദാരമായ സംഭാവന’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് സമൃദ്ധി, ഉദാരത, ധാരാളമായ ദാനം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι
  choice: ഞങ്ങൾ ഈ മുൻകരുതൽ എടുക്കുന്നു
  rationale: മധ്യപ്രയോഗത്തിലുള്ള ഈ കൃാദന്തം ഒരു പ്രശ്നം ഒഴിവാക്കാൻ കരുതലോടെ നടപടിയെടുക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘മുൻകരുതൽ എടുക്കുന്നു’ എന്നത് ഈ പ്രതിരോധാത്മക ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: ആരും ഞങ്ങളെ കുറ്റപ്പെടുത്താതിരിക്കേണ്ടതിന്
  rationale: μή + വിധിലിംഗ ക്രിയ ഇവിടെ തടയൽലക്ഷ്യം പ്രകടമാക്കുന്നു; μωμάομαι എന്നതിന്റെ ‘കുറ്റപ്പെടുത്തുക/കുറ്റം കണ്ടെത്തുക’ എന്ന അർഥം ‘കുറ്റപ്പെടുത്തുക’ വ്യക്തമായി പകരുന്നു.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: ഈ ഉദാരമായ സംഭാവനയെക്കുറിച്ച്
  rationale: ἁδρότης സമൃദ്ധിയെയോ ഉദാരമായ ദാനത്തെയോ സൂചിപ്പിക്കുന്നു. ധനശേഖരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ഉദാരമായ സംഭാവന’ മൂർത്തവും സ്വാഭാവികവുമാണ്; ἐν ഇവിടെ വിഷയബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘യെക്കുറിച്ച്’ ഉപയോഗിച്ചു.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: ഞങ്ങൾ കൈകാര്യം ചെയ്യുന്ന
  rationale: ധനസഹായത്തിന്റെ നടത്തിപ്പുമായി ബന്ധപ്പെട്ട സാഹചര്യത്തിൽ διακονέω സേവനപരമായി നിർവഹിക്കുകയോ നിയന്ത്രിക്കുകയോ ചെയ്യുന്നതാണ്. ‘കൈകാര്യം ചെയ്യുന്ന’ സാമ്പത്തിക ഉത്തരവാദിത്വം സഭാപദാവലി കുത്തിനിറക്കാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സംഭാവന കൈകാര്യം ചെയ്യുന്നതിലുള്ള പൗലോസിന്റെ ആശങ്കയുടെ സ്വഭാവം
  choice: സാമ്പത്തിക നടത്തിപ്പിൽ കുറ്റാരോപണത്തിന് ഇടവരാതിരിക്കാനുള്ള പ്രായോഗിക മുൻകരുതലും ഉത്തരവാദിത്വവും ഊന്നിപ്പറയുക.
  alternative: ഇത് വെറും യാത്രാക്രമീകരണമായി ദുർബലമായി അവതരിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം സംഭാവനയെ സംബന്ധിച്ച് ആരും പൗലോസിനെയും സഹപ്രവർത്തകരെയും കുറ്റപ്പെടുത്താതിരിക്കാനുള്ള പ്രതിരോധ നടപടിയിലാണ് കേന്ദ്രീകരിക്കുന്നത്; അതിലധികമായ ഉപദേശപരമായ നിഗമനങ്ങൾ ചേർക്കാതെ ഈ ധാർമ്മിക ഉത്തരവാദിത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ നീണ്ട കൃാദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യക്രമത്തിലാക്കി; സാമ്പത്തിക നടത്തിപ്പിന്റെ പശ്ചാത്തലം വ്യക്തമായി നിലനിർത്തി.
