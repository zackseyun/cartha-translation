id: 2CO.8.16
reference: 2 Corinthians 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങളോടുള്ള അതേ ആത്മാർഥത തീത്തോസിന്റെ ഹൃദയത്തിൽ നൽകുന്ന ദൈവത്തിനു സ്തോത്രം!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: എന്നാൽ ... ദൈവത്തിനു സ്തോത്രം
  rationale: χάρις + ദൈവത്തെ സൂചിപ്പിക്കുന്ന സംപ്രദാനവിഭക്തി ഇവിടെ കൃപ എന്നതിലുപരി ദൈവത്തോടുള്ള നന്ദിയുടെ പ്രയോഗമാണ്. δέ മുൻവാക്യങ്ങളിൽനിന്നുള്ള മൃദുവായ തിരിവ് സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: τῷ διδόντι
  choice: നൽകുന്ന
  rationale: δίδωμι എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥം നിലനിർത്തുകയും വർത്തമാന കൃദന്തരൂപം ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന വിധത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν αὐτὴν σπουδὴν
  choice: അതേ ആത്മാർഥത
  rationale: σπουδή ഇവിടെ വെറും അധ്വാനശീലമല്ല, തീക്ഷ്ണവും സത്യസന്ധവുമായ താത്പര്യമാണ്. ‘ആത്മാർഥത’ ആ ഭാവവും αὐτήν എന്നതിന്റെ ‘അതേ’ എന്ന താരതമ്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങളോടുള്ള
  rationale: കൊരിന്ത്യരിലേക്കു ദിശപ്പെടുത്തിയ കരുതലും താത്പര്യവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: തീത്തോസിന്റെ ഹൃദയത്തിൽ
  rationale: ἐν എന്നതിന്റെ ‘ൽ’ എന്ന സ്ഥാനാർഥവും ഹൃദയം എന്ന ആന്തരിക മനോഭാവത്തിന്റെ രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു സുലഭവുമായ മലയാളം. ദൈവത്തോടുള്ള നന്ദിയുടെ ഉയർന്ന ഭാവം നിലനിർത്താൻ ‘സ്തോത്രം’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ ഹൃദയരൂപകം സംരക്ഷിച്ചു.
