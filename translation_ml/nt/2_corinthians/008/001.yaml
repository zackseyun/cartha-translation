  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: ml
  text: സഹോദരങ്ങളേ,[a] മക്കെദോന്യയിലെ സഭകളിൽ നൽകപ്പെട്ട ദൈവകൃപയെക്കുറിച്ച്[b] ഞങ്ങൾ നിങ്ങളെ അറിയിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരങ്ങളേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്ന പുരുഷലിംഗരൂപമാണെങ്കിലും, അത് പലപ്പോഴും മുഴുവൻ സഭാസമൂഹത്തെയും അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവകൃപ’ ദൈവത്തിന്റെ അനുഗ്രഹത്തെയോ, ആ കൃപ മക്കെദോന്യയിലെ സഭകളിൽ ഉളവാക്കിയ ഔദാര്യത്തെയോ, അല്ലെങ്കിൽ രണ്ടിനെയും ഒരുമിച്ചോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: ഞങ്ങൾ നിങ്ങളെ അറിയിക്കുന്നു
  rationale: ‘അറിയിക്കുക, വെളിപ്പെടുത്തുക’ എന്ന അർഥവും വർത്തമാനകാല പ്രസ്താവനയുടെ ലേഖനശൈലിയും നിലനിർത്തുന്നു; ‘നിങ്ങൾ അറിഞ്ഞിരിക്കണമെന്നു ഞങ്ങൾ ആഗ്രഹിക്കുന്നു’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ വിഷയമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും ആ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു ചേർത്ത് വൈരുധ്യം അതിരൂക്ഷമാക്കിയില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചന അഭിസംബോധനയുടെ രൂപം കാത്തുസൂക്ഷിക്കുന്നു. പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് മുഴുവൻ സഭാസമൂഹത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: χάριν τοῦ θεοῦ
  choice: ദൈവകൃപ
  rationale: പൗലോസിന്റെ പ്രധാന പദമായ χάρις-ന്റെ വിശാലത നിലനിർത്തുന്നു. ‘ദാനം’ അല്ലെങ്കിൽ ‘ഔദാര്യം’ എന്നു ചുരുക്കാതെ ദൈവത്തിന്റെ അനുഗ്രഹപൂർവമായ പ്രവർത്തനത്തെയും അതിൽനിന്നുണ്ടായ ഔദാര്യത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ അനുവദിക്കുന്നു.
- source_word: τὴν δεδομένην
  choice: നൽകപ്പെട്ട
  rationale: പൂർണ നിഷ്ക്രിയ കൃദന്തരൂപം സംക്ഷിപ്തമായി പ്രതിഫലിപ്പിക്കുകയും ദൈവം പ്രവർത്തകനാണെന്ന സൂചന അനാവശ്യമായി തുറന്നുപറയാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: സഭകളിൽ
  rationale: കൃപ ആ സഭകളുടെ ഇടയിലും അവയുടെ ജീവിതത്തിലും പ്രവർത്തിച്ച മേഖലയെ സൂചിപ്പിക്കുന്ന ἐν-ന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: τῆς Μακεδονίας
  choice: മക്കെദോന്യയിലെ
  rationale: സഭകളെ അവയുടെ പ്രദേശവുമായി സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ദൈവകൃപ’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മക്കെദോന്യയിലെ സഭകളിൽ പ്രവർത്തിച്ച ദൈവകൃപ; അവരുടെ ഔദാര്യം അതിന്റെ ഫലമായി ഉൾക്കാഴ്ചയിൽ നിലനിൽക്കുന്നു
  alternative: ദാനത്തെയോ ധനസഹായത്തെയോ മാത്രം സൂചിപ്പിക്കുന്ന കൃപാദാനം; അല്ലെങ്കിൽ ആ സഭകൾക്കു ലഭിച്ച ദൈവപ്രീതി മാത്രം
  rationale: χάρις എന്ന പദം ദൈവത്തിന്റെ കൃപയെയും ആ കൃപ ജനിപ്പിച്ച പ്രായോഗിക ഔദാര്യത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയും. ‘ദൈവകൃപ’ എന്ന വിശാല പ്രയോഗം ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും അർഥവ്യാപ്തിയും പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി ഉപയോഗിച്ചു. ‘സഹോദരങ്ങളേ’ എന്ന സഭാസന്ദർഭത്തിലെ പരിചിതമായ അഭിസംബോധനയും ‘ദൈവകൃപ’ എന്ന സ്ഥാപിതവും വിശാലവുമായ ദൈവശാസ്ത്രപദവും നിലനിർത്തി; അതേസമയം വാക്യം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ക്രമപ്പെടുത്തി.
