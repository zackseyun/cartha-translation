  rationale: മുഖ്യവാചകത്തിൽ പൗലൊസിന്റെ ഉദ്ധരണിയിലെ കൈവശമുള്ള അളവും അതിന്റെ സമതുലിത ഫലവും നിലനിർത്തിയിരിക്കുന്നു; ‘ശേഖരിച്ചു’ എന്ന പുറപ്പാടുസംബന്ധിയായ ക്രിയ അടിക്കുറിപ്പിൽ മാത്രം നിലനിർത്തുന്നു. ‘അധികമായില്ല’ എന്ന അവ്യക്തവും അസ്വാഭാവികവുമായ പ്രയോഗം ‘മിച്ചമുണ്ടായില്ല’ എന്ന വ്യക്തമായ പ്രയോഗമായി തിരുത്തി.
