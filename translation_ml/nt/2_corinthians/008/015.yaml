id: 2CO.8.15
reference: 2 Corinthians 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “ഏറെ ഉണ്ടായിരുന്നവന് മിച്ചമുണ്ടായില്ല; കുറച്ച് ഉണ്ടായിരുന്നവന് കുറവുണ്ടായില്ല.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പുറപ്പാട് 16:18-ന്റെ വാചകത്തോട് കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഏറെ ശേഖരിച്ചവന് മിച്ചമുണ്ടായില്ല; കുറച്ച് ശേഖരിച്ചവന് കുറവുണ്ടായില്ല.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്തിൽ നിലനിൽക്കുന്ന രേഖാമൂലമായ സാക്ഷ്യത്തെ പരിചയപ്പെടുത്തുന്ന പതിവ് ഉദ്ധരണിസൂത്രമാണിത്; ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ തുടർന്നുനിൽക്കുന്ന പ്രാബല്യം ഈ പ്രയോഗം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Ὁ τὸ πολὺ
  choice: ഏറെ ഉണ്ടായിരുന്നവൻ
  rationale: Article + neuter adjective ചേർന്ന പ്രയോഗം ‘ഏറെ ഉള്ളവൻ’ എന്ന അർഥം നൽകുന്നു. പൗലൊസിന്റെ വാചകത്തിൽ ‘ശേഖരിച്ചു’ എന്ന ക്രിയ വ്യക്തമല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ἐπλεόνασεν
  choice: അധികമായില്ല
  rationale: πλεονάζω ഇവിടെ ആവശ്യത്തിലധികമുള്ള മിച്ചം ഉണ്ടാകുക എന്ന ഫലം സൂചിപ്പിക്കുന്നു. ‘അധികമായില്ല’ എന്നത് സംക്ഷിപ്തമായി ആ ആശയം നിലനിർത്തുന്നു.
- source_word: ὁ τὸ ὀλίγον
  choice: കുറച്ച് ഉണ്ടായിരുന്നവൻ
  rationale: Ὁ τὸ πολὺ എന്നതിന് സമാന്തരമായ substantival പ്രയോഗം. കൈവശമുണ്ടായിരുന്ന അളവിലെ കുറവിനെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἠλαττόνησεν
  choice: കുറവുണ്ടായില്ല
  rationale: ἐλαττονέω ഇവിടെ അപര്യാപ്തതയോ അഭാവമോ ഉണ്ടാകുക എന്ന അർഥത്തിലാണ്. ‘കുറവുണ്ടായില്ല’ എന്നത് മുൻവാക്യത്തിലെ ‘അധികമായില്ല’ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തര്യം കാത്തുസൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുറപ്പാട് 16:18-ലെ ഉദ്ധരണി ദാനത്തിന്റെയും സമത്വത്തിന്റെയും പശ്ചാത്തലത്തിൽ പ്രയോഗിക്കുന്നത്
  choice: ശേഖരണപ്രവൃത്തിയെ മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, ഒടുവിലെ അധികമില്ലായ്മയും കുറവില്ലായ്മയും മുൻനിർത്തി പരിഭാഷപ്പെടുത്തി.
  alternative: “ഏറെ ശേഖരിച്ചവന് മിച്ചമുണ്ടായില്ല; കുറച്ച് ശേഖരിച്ചവന് കുറവുണ്ടായില്ല.”
  rationale: പൗലൊസിന്റെ ഗ്രീക്ക് ഉദ്ധരണിയിൽ ‘ശേഖരിച്ചു’ എന്ന ക്രിയ ആവർത്തിക്കുന്നില്ല. അതിനാൽ ദാനവിതരണത്തിലെ പര്യാപ്തതയിലേക്കുള്ള പൗലൊസിന്റെ പ്രയോഗം നിലനിർത്തുകയും, പുറപ്പാടിലെ ശേഖരണപശ്ചാത്തലം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഏറെ/കുറച്ച്’, ‘അധികം/കുറവ്’ എന്നീ സമാന്തര പദങ്ങൾ ഉപയോഗിച്ച് ഉദ്ധരണിയുടെ തുലിതാളം നിലനിർത്തി; പുറപ്പാടിലെ ‘ശേഖരിച്ചു’ എന്ന സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
