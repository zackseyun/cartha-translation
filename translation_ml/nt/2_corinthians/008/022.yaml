source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: ml
  text: അവരോടൊപ്പം നമ്മുടെ സഹോദരനെയും ഞങ്ങൾ അയച്ചിരിക്കുന്നു. പല കാര്യങ്ങളിലും പലപ്പോഴും പരീക്ഷിച്ചറിഞ്ഞ അദ്ദേഹത്തെ ഞങ്ങൾ ഉത്സാഹിയായി കണ്ടിട്ടുണ്ട്; ഇപ്പോഴാകട്ടെ, നിങ്ങളിലുള്ള അദ്ദേഹത്തിന്റെ വലിയ വിശ്വാസം നിമിത്തം അദ്ദേഹം അതിലും ഏറെ ഉത്സാഹിയായിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഇപ്പോഴാകട്ടെ, നിങ്ങളോടുള്ള വലിയ ആത്മവിശ്വാസത്താൽ അദ്ദേഹം വളരെ അധികം ഉത്സാഹിയായിരിക്കുന്നു.” ഗ്രീക്കിലെ ഈ പദസമുച്ചയം ‘വലിയ ആത്മവിശ്വാസം’ അല്ലെങ്കിൽ ‘ഉറച്ച വിശ്വാസം’ എന്ന ഭാവത്തിൽ, മുൻപുള്ള ‘കൂടുതൽ ഉത്സാഹി’ എന്നതോടു അല്പം വ്യത്യസ്തമായി ബന്ധിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: അവരോടൊപ്പം ... ഞങ്ങൾ അയച്ചിരിക്കുന്നു
  rationale: സύν- എന്ന ആശയം ‘അവരോടൊപ്പം’ എന്നു വ്യക്തമാക്കുന്നു; കത്തിലെ സാഹചര്യത്തിൽ പൂർത്തിയായതും ഇപ്പോഴത്തെ പ്രസക്തിയുള്ളതുമായ അയയ്ക്കൽ ‘അയച്ചിരിക്കുന്നു’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀδελφὸν ἡμῶν
  choice: നമ്മുടെ സഹോദരൻ
  rationale: ക്രിസ്തീയ കുടുംബബന്ധത്തെ സൂചിപ്പിക്കുന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു; പേരുപറയാത്ത പുരുഷ സഹപ്രവർത്തകനെയാണ് ഏകവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐδοκιμάσαμεν
  choice: പരീക്ഷിച്ച് ... കണ്ടെത്തിയിട്ടുണ്ട്
  rationale: δοκιμάζω സൂചിപ്പിക്കുന്ന പരിശോധനയും അതിലൂടെ തെളിഞ്ഞ സ്വഭാവവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν πολλοῖς πολλάκις
  choice: പല കാര്യങ്ങളിലും പലപ്പോഴായി
  rationale: കാര്യങ്ങളുടെ വൈവിധ്യവും പരിശോധനയുടെ ആവർത്തനവും രണ്ടും സംരക്ഷിക്കുന്നു.
- source_word: σπουδαῖον ὄντα
  choice: ഉത്സാഹിയാണെന്ന്
  rationale: σπουδαῖος എന്ന പദത്തിലെ ആത്മാർഥത, ജാഗ്രത, ഉത്സാഹം എന്നീ ഭാവങ്ങൾ ഇവിടെ ‘ഉത്സാഹി’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: ഇപ്പോഴാകട്ടെ ... അതിലും ഏറെ ഉത്സാഹിയായിരിക്കുന്നു
  rationale: താരതമ്യരൂപവും πολὺ നൽകുന്ന ശക്തീകരണവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: നിങ്ങളിലുള്ള വലിയ വിശ്വാസം നിമിത്തം
  rationale: ദത്തിവ് രൂപത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായി നൽകുകയും വിശ്വാസത്തിന്റെ ദിശ കൊരിന്ത്യരിലേക്കാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς എന്നതിന്റെ കർത്താവും ഭാവവും
  choice: ആ സഹോദരന്റെ വർധിച്ച ഉത്സാഹത്തിന് കാരണം കൊരിന്ത്യരിലുള്ള അദ്ദേഹത്തിന്റെ വലിയ വിശ്വാസമാണ്
  alternative: ഇത് പൗലോസിന് കൊരിന്ത്യരിലുള്ള വിശ്വാസത്തെയോ, അവരോടുള്ള ധൈര്യത്തെയോ സൂചിപ്പിക്കാം
  rationale: അടുത്തുള്ള വാക്യഘടനയിൽ ഈ പദസമുച്ചയം പേരുപറയാത്ത സഹോദരന്റെ ‘കൂടുതൽ ഉത്സാഹി’ എന്ന വിശേഷണത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി വിശദീകരിക്കുന്നത്. എങ്കിലും ദത്തിവിന്റെ കാരണ/ഉപകരണ ഭാവത്തിലും πεποίθησις എന്നതിന്റെ ‘വിശ്വാസം/ധൈര്യം’ ഭാവത്തിലും ചെറിയ വ്യാഖ്യാനസാധ്യത നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘സഹോദരൻ’ എന്ന ആദിമ ക്രിസ്തീയ ബന്ധപദവും ഉത്സാഹത്തിന്റെ താരതമ്യവും നിലനിർത്തിയിരിക്കുന്നു.
