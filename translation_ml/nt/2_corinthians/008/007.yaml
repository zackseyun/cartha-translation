source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: ml
  text: എന്നാൽ, വിശ്വാസത്തിലും വാക്കിലും അറിവിലും സകല ഉത്സാഹത്തിലും നിങ്ങളിലുള്ള ഞങ്ങളുടെ സ്നേഹത്തിലും[a]—എല്ലാറ്റിലും നിങ്ങൾ സമൃദ്ധരായിരിക്കുന്നതുപോലെ—ഈ കൃപയിലും[b] നിങ്ങൾ സമൃദ്ധരാകുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളോടുള്ള നിങ്ങളുടെ സ്നേഹം.” ഗ്രീക്ക് പദഘടന ദുഷ്കരമാണ്; ചില കൈയെഴുത്തുപ്രതികളിൽ “ഞങ്ങളിലുള്ള നിങ്ങളുടെ സ്നേഹം” എന്നു വായിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അതായത്, ദാനം നൽകുന്നതായ ഈ കൃപാപ്രവൃത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: സമൃദ്ധരായിരിക്കുന്നു / സമൃദ്ധരാകുക
  rationale: രണ്ടിടത്തും ഒരേ പദകുടുംബം ഉപയോഗിച്ച് സമൃദ്ധിയുടെ രൂപകവും വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: ἐν παντί
  choice: സകലത്തിലും
  rationale: തുടർന്നുവരുന്ന ഗുണങ്ങളുടെ പട്ടികയെ സമഗ്രമായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πίστει
  choice: വിശ്വാസം
  rationale: ഈ ക്രൈസ്തവഗുണങ്ങളുടെ പട്ടികയിൽ πίστις എന്നതിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം.
- source_word: λόγῳ
  choice: വാക്ക്
  rationale: സംസാരശേഷിയെയോ ആശയപ്രകടനത്തെയോ സൂചിപ്പിക്കാൻ കഴിയുന്ന, ഗ്രീക്കിലെ വിശാലത നിലനിർത്തുന്ന സംക്ഷിപ്ത പദം.
- source_word: γνώσει
  choice: അറിവ്
  rationale: പട്ടികയുടെ ഘടനയ്ക്കും സാധാരണ വായനയ്ക്കും യോജിച്ച നേരിട്ടുള്ള പരിഭാഷ.
- source_word: πάσῃ σπουδῇ
  choice: എല്ലാ ഉത്സാഹം
  rationale: σπουδήയിലെ ആത്മാർഥത, തീക്ഷ്ണത, പ്രവർത്തനസന്നദ്ധത എന്നിവയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: നിങ്ങളിലുള്ള ഞങ്ങളുടെ സ്നേഹം
  rationale: SBLGNT പാഠത്തിലെ ἐξ ἡμῶν ... ἐν ὑμῖν എന്ന ദുഷ്കരമായ ഘടനയെ അമിതമായി വ്യാഖ്യാനിക്കാതെ വായനയോഗ്യമായി നിലനിർത്തുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: χάριτι
  choice: കൃപ
  rationale: ദാനപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥത്തോടൊപ്പം പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പദപ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യെരൂശലേം ശേഖരണത്തിന്റെ പശ്ചാത്തലത്തിൽ χάρις എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘കൃപ’
  alternative: കൃപാപ്രവൃത്തി; ദാനം; കൃപയുടെ പ്രവൃത്തി
  rationale: ഇവിടെ സാമ്പത്തിക സംഭാവനയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നതെങ്കിലും, പൗലോസിന്റെ χάρις എന്ന പദത്തിലെ ദൈവശാസ്ത്രപരമായ ആഴം നഷ്ടപ്പെടുത്താതിരിക്കാൻ ‘കൃപ’ നിലനിർത്തുന്നു; വ്യക്തതയ്ക്കായി അടിക്കുറിപ്പ് ചേർക്കുന്നു.
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ എന്ന ദുഷ്കരമായ പദഘടന
  choice: ‘നിങ്ങളിലുള്ള ഞങ്ങളുടെ സ്നേഹം’ എന്നു പരിഭാഷപ്പെടുത്തി പാഠത്തിലെ ബന്ധങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തുക
  alternative: ‘ഞങ്ങളോടുള്ള നിങ്ങളുടെ സ്നേഹം’; ചില കൈയെഴുത്തുപ്രതികളുടെ അടിസ്ഥാനത്തിൽ ‘ഞങ്ങളിലുള്ള നിങ്ങളുടെ സ്നേഹം’
  rationale: വാക്യഘടനയും പാഠവ്യത്യാസവും അർഥത്തെ അനിശ്ചിതമാക്കുന്നതിനാൽ ഒരു വ്യാഖ്യാനം അന്തിമമാക്കാതെ പ്രധാന ബദൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് അനായാസവുമായ ശൈലി. ഗ്രീക്കിലെ പട്ടികാസ്വഭാവവും περισσεύω എന്ന ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തി. ദുഷ്കരമായ സ്നേഹപ്രയോഗവും χάρις എന്ന പദത്തിന്റെ ദ്വിതല അർഥവും അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു.
