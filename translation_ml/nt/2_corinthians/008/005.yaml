id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: ml
  text: ഞങ്ങൾ പ്രതീക്ഷിച്ചതുപോലെയല്ല[a]; മറിച്ച്, ദൈവഹിതത്താൽ[b] അവർ ആദ്യം തങ്ങളെത്തന്നെ കർത്താവിനും ഞങ്ങൾക്കും നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങൾ ആശിച്ചതുപോലെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിന്റെ ഇഷ്ടം മുഖേന’ എന്നോ ‘ദൈവത്തിന്റെ ഇഷ്ടമനുസരിച്ച്’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: ഞങ്ങൾ പ്രതീക്ഷിച്ചതുപോലെ
  rationale: ἐλπίζω എന്നതിന് ‘ആശിക്കുക’ എന്നും അർഥമുണ്ടെങ്കിലും, ഇവിടെ മക്കെദോന്യരുടെ പ്രവൃത്തി അപ്പൊസ്തലന്മാരുടെ മുൻകൂട്ടിയുള്ള പ്രതീക്ഷയുമായി താരതമ്യം ചെയ്യുന്നതിനാൽ ‘പ്രതീക്ഷിക്കുക’ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്; ‘ആശിച്ചതുപോലെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: അവർ തങ്ങളെത്തന്നെ നൽകി
  rationale: പ്രതിഫലന സർവനാമവും δίδωμι എന്ന ക്രിയയും ചേർന്നുള്ള വ്യക്തിപരമായ സ്വയംനൽകൽ നേരിട്ട് നിലനിർത്തുന്നു; ഇത് വെറും ധനസംഭാവനയായി ചുരുക്കുന്നില്ല.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: കാലപരവും പ്രാധാന്യപരവുമായ മുൻഗണന രണ്ടും അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിന്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; ദാതൃവിഭക്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ ἡμῖν
  choice: ഞങ്ങൾക്കും
  rationale: കർത്താവിനും അപ്പൊസ്തലന്മാർക്കും എന്ന സമാന്തര ദാതൃഘടന നിലനിർത്തുന്നു; ഇരുവർക്കും തുല്യപദവി ചുമത്തുന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവഹിതത്താൽ
  rationale: ദൈവത്തിന്റെ ഇഷ്ടം പ്രവർത്തനത്തിന്റെ മാർഗമോ കാരണമോ അംഗീകാരമോ അനുരൂപതയോ ആകാമെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പരിധി സംക്ഷിപ്തമായി തുറന്നുവയ്ക്കുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: കർത്താവിനും ഞങ്ങൾക്കും തങ്ങളെത്തന്നെ നൽകുന്നതിലെ ബന്ധം
  choice: ‘ആദ്യം’ എന്ന പദവും ദാതൃപദങ്ങളുടെ ക്രമവും അതേപടി നിലനിർത്തി, സ്വയംനൽകലിന്റെ പ്രാഥമിക ദിശ കർത്താവിലേക്കാണെന്ന സൂചന സംരക്ഷിക്കുന്നു.
  alternative: ഇത് വ്യക്തമായ അധീനക്രമമില്ലാത്ത ഇരട്ട സമർപ്പണമായി വായിക്കാം; അല്ലെങ്കിൽ ‘ആദ്യം’ ധനസഹായത്തിന് മുമ്പുള്ള സ്വയംനൽകലിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  rationale: ‘പിന്നീട്’ എന്നതുപോലുള്ള വാക്കുകൾ ചേർക്കാതെ ഗ്രീക്കിലുള്ള മുൻഗണനയും ഘടനാപരമായ അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: διὰ θελήματος θεοῦ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ദൈവഹിതത്താൽ
  alternative: ദൈവത്തിന്റെ ഇഷ്ടം മുഖേന; ദൈവത്തിന്റെ ഇഷ്ടമനുസരിച്ച്
  rationale: ദൈവിക പ്രവർത്തനം, അനുമതി, അല്ലെങ്കിൽ ദൈവഹിതത്തോടുള്ള അനുരൂപത എന്നിവയിൽ ഒന്ന് മാത്രം നിർബന്ധിക്കാതെ മൂലപാഠത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘തങ്ങളെത്തന്നെ നൽകി’ എന്ന നേരിട്ടുള്ള പ്രയോഗം മൂലപാഠത്തിലെ സ്വയംനൽകലിന്റെ ഊന്നൽ കാത്തുസൂക്ഷിക്കുന്നു; വാക്യഘടനയിലെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത വിശദീകരണവാക്കുകൾ ചേർത്ത് പരിഹരിച്ചിട്ടില്ല.
