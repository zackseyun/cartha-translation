id: 2CO.8.10
reference: 2 Corinthians 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: ml
  text: 'ഈ കാര്യത്തിൽ ഞാൻ എന്റെ അഭിപ്രായം പറയുന്നു: ഇത് നിങ്ങൾക്കു പ്രയോജനകരമാണ്; കാരണം, കഴിഞ്ഞ വർഷംതന്നെ അത് ചെയ്യാൻ മാത്രമല്ല, അതിനു മനസ്സുവെക്കാനും നിങ്ങൾ തുടക്കമിട്ടല്ലോ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മനസ്സുവെക്കാനും’ എന്നതിന് ‘സന്നദ്ധരാകാനും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദപ്രയോഗം ആന്തരികമായ ഇച്ഛയെയും യഥാർഥ പ്രവർത്തനത്തെയും വേർതിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: അഭിപ്രായം
  rationale: ഇവിടെ പൗലോസ് കല്പന നൽകുന്നതിനു പകരം ആലോചിച്ചെടുത്ത വിലയിരുത്തലും ഉപദേശവും അറിയിക്കുന്നു. ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ ‘അഭിപ്രായം’ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τούτῳ
  choice: ഈ കാര്യത്തിൽ
  rationale: സംഭാവനയെക്കുറിച്ച് നടന്നുകൊണ്ടിരിക്കുന്ന പ്രത്യേക ചർച്ചയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: συμφέρει
  choice: പ്രയോജനകരമാണ്
  rationale: ലാഭകരം, അനുകൂലം എന്ന ആശയം വാണിജ്യധ്വനിയില്ലാതെ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ ποιῆσαι
  choice: അതു ചെയ്യാൻ
  rationale: സന്ദർഭത്തിൽ വ്യക്തമാകുന്ന സംഭാവനാപദ്ധതിയുടെ യഥാർഥ നിർവഹണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὸ θέλειν
  choice: അതു ചെയ്യാൻ മനസ്സുവെക്കാനും
  rationale: പ്രവൃത്തിയിൽനിന്ന് വേർതിരിച്ചുള്ള ആന്തരിക സന്നദ്ധതയെയും ഉദ്ദേശ്യത്തെയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: προενήρξασθε
  choice: ആദ്യംതന്നെ ആരംഭിച്ചവരാണ്
  rationale: മുൻകൂട്ടി തുടക്കം കുറിച്ചു എന്ന സംയുക്തക്രിയയുടെ സൂക്ഷ്മത നിലനിർത്തുന്നു; ‘കഴിഞ്ഞ വർഷം’ കാലസൂചന നൽകുന്നു.
- source_word: ἀπὸ πέρυσι
  choice: കഴിഞ്ഞ വർഷം
  rationale: മുൻവർഷത്തിലാണ് തുടക്കം ഉണ്ടായതെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; നിർബന്ധമായും തുടർച്ച സൂചിപ്പിക്കുന്ന ‘കഴിഞ്ഞ വർഷം മുതൽ’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രസ്താവനയുടെ അധികാരഭാവം
  choice: നേരിട്ടുള്ള കല്പനയല്ല, പരിഗണിച്ച അഭിപ്രായമായി അവതരിപ്പിച്ചു
  alternative: അധികാരപൂർവമായ നിർദേശം അഥവാ കല്പന
  rationale: സമീപസന്ദർഭത്തിൽ കല്പനയും γνώμηയും തമ്മിലുള്ള വ്യത്യാസം നിലനിൽക്കുന്നു. ‘അഭിപ്രായം പറയുന്നു’ എന്നത് പൗലോസിന്റെ ഗൗരവമുള്ള അപ്പൊസ്തലിക ഉപദേശം കുറച്ചുകാണിക്കാതെയും അതിനെ നേരിട്ടുള്ള കല്പനയാക്കാതെയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പ്രവൃത്തിയും സന്നദ്ധതയും തമ്മിലുള്ള ഗ്രീക്ക് സമാന്തരത കഴിയുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു; വാക്യഭാരം കുറയ്ക്കാൻ രണ്ട് വാക്യങ്ങളാക്കി.
