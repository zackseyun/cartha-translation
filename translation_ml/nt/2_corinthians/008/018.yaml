id: 2CO.8.18
reference: 2 Corinthians 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: ml
  text: അവനോടൊപ്പം, സുവിശേഷത്തിന്റെ കാര്യത്തിൽ എല്ലാ സഭകളിലുടനീളം പ്രശംസിക്കപ്പെടുന്ന ആ സഹോദരനെയും ഞങ്ങൾ അയച്ചു—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സുവിശേഷത്തിന്റെ കാര്യത്തിൽ എല്ലാ സഭകളിലും പ്രശംസയുള്ളവൻ.’
    reason: ἔπαινος എന്ന നാമപദം ‘പ്രശംസ’/‘ശ്ലാഘനം’ എന്ന രീതിയിൽ നിലനിർത്തുകയും, ἐν τῷ εὐαγγελίῳ, διὰ πασῶν τῶν ἐκκλησιῶν എന്നീ പ്രയോഗങ്ങൾക്ക് അടുത്തൊരു സ്വാഭാവിക ബദൽ നൽകുകയും ചെയ്യുന്നു.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: അവനോടൊപ്പം ഞങ്ങൾ ... അയച്ചു
  rationale: അയയ്ക്കപ്പെട്ട വ്യക്തിയുടെ അനുഗമനത്തെ σύν ഘടകം സൂചിപ്പിക്കുന്നു; aorist പൂർത്തിയായ പ്രവൃത്തിയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: വാക്യക്രമത്തിലൂടെ ബന്ധിപ്പിച്ചു
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, വിവരണം മുന്നോട്ടുകൊണ്ടുപോകുന്ന മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദമില്ലാതെയും ആ പ്രവാഹം സ്വാഭാവികമാണ്.
- source_word: τὸν ἀδελφόν
  choice: ആ സഹോദരനെയും
  rationale: നിശ്ചിതമായ ഒരു പുരുഷ ക്രിസ്തീയ സഹപ്രവർത്തകനെയാണ് നിർദ്ദേശിക്കുന്നത്; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഞങ്ങളുടെ’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: οὗ ὁ ἔπαινος
  choice: അദ്ദേഹം പ്രശംസിക്കപ്പെടുന്നു
  rationale: ἔπαινος എന്ന നാമത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ കർമണിപ്രയോഗമായി നൽകി; പ്രശംസയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: സുവിശേഷവുമായി ബന്ധപ്പെട്ട്
  rationale: പ്രശംസ സുവിശേഷത്തോടു ബന്ധപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുന്നു; പ്രസംഗം, ശുശ്രൂഷാപദവി, അല്ലെങ്കിൽ പ്രത്യേക ജോലി എന്നിങ്ങനെ മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: എല്ലാ സഭകളിലും
  rationale: സഭകളാകെ വ്യാപിച്ച അംഗീകാരമാണ് διά + genitive സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘എല്ലാ സഭകളിലും’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐκκλησιῶν
  choice: സഭകളിൽ
  rationale: പൗലൊസിന്റെ സന്ദർഭത്തിൽ പ്രാദേശിക ക്രിസ്തീയ സഭകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘സഭ’ സാധാരണവും വ്യക്തവുമായ തത്തുല്യപദമാണ്.
theological_decisions:
- issue: ἀδελφός എന്ന പദത്തിന്റെ വ്യക്തിത്വവും ലിംഗസൂചനയും
  choice: കൊരിന്ത്യർക്ക് പരിചിതനായ ഒരു നിർദിഷ്ട പുരുഷ ക്രിസ്തീയ സഹപ്രവർത്തകനെ സൂചിപ്പിക്കുന്ന ‘ആ സഹോദരൻ’
  alternative: പൊതുവായ അർഥത്തിൽ ‘ഒരു സഹവിശ്വാസി’
  rationale: യാത്രാസന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷ ഏകവചനരൂപം ഒരു പ്രത്യേക വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ലിംഗനിരപേക്ഷ പ്രയോഗമാക്കി മാറ്റിയിട്ടില്ല.
- issue: ἐν τῷ εὐαγγελίῳ എന്നതിന്റെ പരിധി
  choice: ‘സുവിശേഷവുമായി ബന്ധപ്പെട്ട്’ എന്ന് വിശാലമായി നിലനിർത്തി
  alternative: ‘സുവിശേഷം പ്രസംഗിക്കുന്നതിൽ’ അല്ലെങ്കിൽ ‘സുവിശേഷശുശ്രൂഷയിലെ പ്രവർത്തനത്തിന്’
  rationale: ഗ്രീക്ക് പാഠം പ്രശംസയും സുവിശേഷവും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നുവെങ്കിലും പ്രസംഗമോ ഔദ്യോഗിക ശുശ്രൂഷാപദവിയോ നിർദിഷ്ടമായി പറയുന്നില്ല; അതിനാൽ അർഥം അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പമുള്ളതുമായ മലയാളം. മൂലത്തിലെ അവസാന ഡാഷും പാദക്കുറിപ്പിന്റെ [a] അടയാളവും നിലനിർത്തി; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ബന്ധുവാക്യം രണ്ടാമത്തെ വാക്യമായി നൽകി.
