revisions:
- from: അവനോടൊപ്പം ഞങ്ങൾ ആ സഹോദരനെയും അയച്ചു. സുവിശേഷവുമായി ബന്ധപ്പെട്ട് എല്ലാ സഭകളിലും അദ്ദേഹം പ്രശംസിക്കപ്പെടുന്നു—[a]
  to: അവനോടൊപ്പം, സുവിശേഷത്തിന്റെ കാര്യത്തിൽ എല്ലാ സഭകളിലുടനീളം പ്രശംസിക്കപ്പെടുന്ന ആ സഹോദരനെയും ഞങ്ങൾ അയച്ചു—[a]
  rationale: The revision more closely links the gospel-related, church-wide praise to the specified brother, makes the scope of διὰ πασῶν explicit, and replaces the footnote with a closer alternative. It does not identify the unnamed brother or narrow “in the gospel” to preaching or an office.
