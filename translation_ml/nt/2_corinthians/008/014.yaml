source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: ml
  text: ഇപ്പോഴത്തെ സമയത്ത് നിങ്ങളുടെ സമൃദ്ധി അവരുടെ കുറവ് നികത്താനാണ്; അതുപോലെ അവരുടെ സമൃദ്ധി നിങ്ങളുടെ കുറവ് നികത്താനും, അങ്ങനെ സമത്വം[a] ഉണ്ടാകാനുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ന്യായത’ അല്ലെങ്കിൽ ‘സന്തുലിതത്വം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്കുപദം എല്ലാവർക്കും ഒരേ അളവിൽ സ്വത്തുണ്ടായിരിക്കണമെന്നല്ല, മറിച്ച് പരസ്പരം ആവശ്യങ്ങൾ നികത്തുന്നതിലെ തുല്യതയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: ഇപ്പോഴത്തെ സാഹചര്യത്തിൽ
  rationale: καιρός വെറും കാലക്രമത്തിലെ ഒരു നിമിഷത്തെയല്ല, നിലവിലുള്ള പ്രത്യേക സമയത്തെയും സാഹചര്യത്തെയും സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ സാഹചര്യാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: നിങ്ങളുടെ സമൃദ്ധി
  rationale: περίσσευμα ആവശ്യത്തിലധികമുള്ള ഭൗതിക സമൃദ്ധിയെ ഇവിടെ സൂചിപ്പിക്കുന്നു. ‘സമൃദ്ധി’ പണത്തിൽ മാത്രം അർഥം ചുരുക്കാതെ ഗ്രീക്കിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: അവരുടെ കുറവ് നികത്തട്ടെ
  rationale: ὑστέρημα ഭൗതിക അഭാവത്തെയോ കുറവിനെയോ സൂചിപ്പിക്കുന്നു; εἰς എന്നതിന്റെ ലക്ഷ്യാർഥം മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘കുറവ് നികത്തുക’ എന്നു നൽകി.
- source_word: ἵνα καὶ
  choice: അങ്ങനെ ... വും
  rationale: ἵνα ഉദ്ദേശ്യം/ഫലം പ്രകടമാക്കുകയും καί പരസ്പരത കൂട്ടിച്ചേർക്കുകയും ചെയ്യുന്നു; ‘അങ്ങനെ’യും ‘വും’യും ഈ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: അവരുടെ സമൃദ്ധി
  rationale: വാക്യത്തിലെ സമാന്തരവും പരസ്പരവുമായ ഘടന നിലനിർത്താൻ ആദ്യ περίσσευμα എന്നതിനുപയോഗിച്ച അതേ പദം ഉപയോഗിച്ചു.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: നിങ്ങളുടെ കുറവും നികത്തട്ടെ
  rationale: ഉദ്ദേശ്യവാക്യത്തിലെ സാധ്യതയും അഭിലഷിത ഫലവും ‘നികത്തട്ടെ’ എന്ന രൂപത്തിൽ സൂക്ഷിക്കുകയും പരസ്പര സഹായം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὅπως γένηται ἰσότης
  choice: ഇതിലൂടെ സമത്വം ഉണ്ടാകട്ടെ
  rationale: ὅπως ഫലലക്ഷ്യം സൂചിപ്പിക്കുന്നു; ἰσότης എന്നതിന്റെ നേരിട്ടുള്ള തുല്യം ‘സമത്വം’ ആണ്. സന്ദർഭത്തിലുള്ള ആനുപാതികവും പരസ്പരവുമായ കരുതലിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ദാനാഹ്വാനത്തിൽ ἰσότης എന്നതിന്റെ അർഥം
  choice: പരസ്പരം ആവശ്യങ്ങൾ നിറവേറ്റുന്നതിലെ സമത്വം
  alternative: നീതിപൂർവത; തുല്യനീതി
  rationale: സന്ദർഭം വിശ്വാസികൾ പരസ്പരം കുറവുകൾ നികത്തുന്നതിനെക്കുറിച്ചാണ്; എല്ലാവർക്കും ഒരേ അളവിലുള്ള സ്വത്ത് നിർബന്ധമാക്കുന്ന സിദ്ധാന്തത്തെക്കുറിച്ചല്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള പദമായ ‘സമത്വം’ നിലനിർത്തി സന്ദർഭസൂക്ഷ്മത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ പരസ്പര സമാന്തരഘടന ‘നിങ്ങളുടെ സമൃദ്ധി—അവരുടെ കുറവ് / അവരുടെ സമൃദ്ധി—നിങ്ങളുടെ കുറവ്’ എന്ന രൂപത്തിൽ നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ‘At the present time’ എന്നതിനു പിന്നാലെ കാണുന്നുവെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ἰσότης എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ അടയാളം ‘സമത്വം’ എന്നതിനു പിന്നാലെ വെച്ചു.
