revisions:
- from: മറ്റുള്ളവർക്ക് ആശ്വാസവും നിങ്ങൾക്ക് ഞെരുക്കവും ഉണ്ടാകണമെന്നല്ല ഞാൻ പറയുന്നത്; മറിച്ച്, സമത്വം[a] ഉണ്ടാകണം—
  to: കാരണം, മറ്റുള്ളവർക്ക് ഇളവും നിങ്ങൾക്ക് കഷ്ടതയും ഉണ്ടാകണമെന്നല്ല എന്റെ ഉദ്ദേശ്യം; മറിച്ച്, സമത്വത്തിന്റെ അടിസ്ഥാനത്തിൽ[a]—
  rationale: The revision restores γάρ, preserves the basis/principle sense of ἐξ ἰσότητος, and uses contextually clearer Malayalam for relief and hardship. It retains the open dash and the lexical ambiguity of ἰσότης without imposing a specific economic or theological interpretation.
