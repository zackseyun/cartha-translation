  text: οὐ γὰρ ἵνα ἄλλοις ἄνεσις, ⸀ὑμῖν θλῖψις· ἀλλ’ ἐξ ἰσότητος
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/013.yaml
  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: ml
  text: കാരണം, മറ്റുള്ളവർക്ക് ഇളവും നിങ്ങൾക്ക് കഷ്ടതയും ഉണ്ടാകണമെന്നല്ല എന്റെ ഉദ്ദേശ്യം; മറിച്ച്, സമത്വത്തിന്റെ അടിസ്ഥാനത്തിൽ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായമായ തുലനം.’ ഗ്രീക്കുപദം ന്യായമായ സന്തുലിതാവസ്ഥയെ സൂചിപ്പിക്കാം; എല്ലാവരുടെയും സ്വത്ത് കർശനമായി ഒരേ അളവിലായിരിക്കണം എന്ന അർഥം അത് നിർബന്ധമായും നൽകുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ ... ἵνα
  choice: '... ഉണ്ടാകണമെന്നല്ല ഞാൻ പറയുന്നത്'
  rationale: ഗ്രീക്കിൽ ഉദ്ദേശ്യത്തെ നിഷേധിക്കുന്ന സംക്ഷിപ്ത ഘടനയാണ്; മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാനായി സന്ദർഭത്തിൽ സൂചിതമായ ‘ഞാൻ പറയുന്നത്’ ചേർത്തു. γάρ-ന്റെ വിശദീകരണബന്ധം മുൻസന്ദർഭത്തിൽനിന്ന് മലയാളവാക്യത്തിന്റെ പ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ വേറിട്ട് ‘കാരണം’ ചേർത്തില്ല.
- source_word: ἄλλοις ἄνεσις
  choice: മറ്റുള്ളവർക്ക് ആശ്വാസം
  rationale: ἄνεσις ഇവിടെ ഭാരം അല്ലെങ്കിൽ സമ്മർദം ലഘൂകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ആശ്വാസം’ സാമ്പത്തികഭാരം നീങ്ങുന്നതുൾപ്പെടെയുള്ള വിശാല അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑμῖν θλῖψις
  choice: നിങ്ങൾക്ക് ഞെരുക്കം
  rationale: θλῖψις-ന്റെ അടിസ്ഥാനമായ സമ്മർദം, കഷ്ടസ്ഥിതി എന്നീ ആശയങ്ങൾ സംഭാവന മൂലമുണ്ടാകാവുന്ന ബുദ്ധിമുട്ടിന്റെ സന്ദർഭത്തിൽ ‘ഞെരുക്കം’ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: മറിച്ച്, സമത്വം ഉണ്ടാകണം
  rationale: ἰσότης-ന് ‘സമത്വം’ നേരിട്ടുള്ള പദസമാനമാണ്. ἐξ സൂചിപ്പിക്കുന്ന അടിസ്ഥാനമോ മാനദണ്ഡമോ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രിയാപൂരണം ചേർത്തു; തുടർന്നുള്ള വാക്യത്തിലേക്കുള്ള ബന്ധം ഡാഷ് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭൗതിക പങ്കുവെക്കലിന്റെ പശ്ചാത്തലത്തിൽ ἰσότης എന്ന പദത്തിന്റെ അർഥം
  choice: സമത്വം
  alternative: നീതിപൂർവമായ തുലനം / ന്യായത
  rationale: മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള അർഥമായ ‘സമത്വം’ നിലനിർത്തുന്നു. എന്നാൽ ഇത് എല്ലാവർക്കും കർശനമായി ഒരേ അളവിലുള്ള സ്വത്ത് വേണമെന്ന നിർബന്ധിത ആശയമായി വ്യാഖ്യാനിക്കാതിരിക്കാൻ അടിക്കുറിപ്പിൽ ന്യായമായ തുലനത്തിന്റെ സാധ്യത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നവിധം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ ശൈലി. മൂലത്തിലെ വിരുദ്ധസമാന്തര ഘടനയും അടുത്ത വാക്യത്തിലേക്കുള്ള അപൂർണമായ തുടർച്ചയും നിലനിർത്തി.
