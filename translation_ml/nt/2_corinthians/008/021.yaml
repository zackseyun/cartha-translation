reference: 2 Corinthians 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: ml
  text: കാരണം, കർത്താവിന്റെ മുമ്പിൽ മാത്രമല്ല, മനുഷ്യരുടെ മുമ്പിലും നല്ല കാര്യങ്ങൾക്കായി[a] ഞങ്ങൾ മുൻകരുതൽ എടുക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാന്യമായ കാര്യങ്ങൾ’ അല്ലെങ്കിൽ ‘ശരിയായ കാര്യങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: മുൻകരുതലെടുക്കുന്നു
  rationale: προνοέω മുൻകൂട്ടി ചിന്തിച്ച് ഉചിതമായ നടപടി കൈക്കൊള്ളുക, കരുതൽ കാണിക്കുക എന്ന ആശയം നൽകുന്നു. ധനശേഖരം സുതാര്യമായി കൈകാര്യം ചെയ്യുന്ന ഈ സന്ദർഭത്തിൽ ‘മുൻകരുതലെടുക്കുന്നു’ എന്നത് ആസൂത്രിതമായ കരുതലും ഉത്തരവാദിത്വവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: γάρ മുൻവാക്യത്തിലെ നടപടിക്കുള്ള വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്നു; ‘കാരണം’ ആ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καλὰ
  choice: നല്ലതായിരിക്കുന്നത്
  rationale: നപുംസകലിംഗ ബഹുവചനമായ καλά ധാർമികമായി നല്ലതോ മാന്യമായതോ ശരിയായതോ ആയ കാര്യങ്ങളെയും പ്രവൃത്തികളെയും സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിലെ വിശാലമായ ‘നല്ലതായിരിക്കുന്നത്’ അർത്ഥപരിധി ചുരുക്കുന്നില്ല; സന്ദർഭോചിതമായ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: മാത്രമല്ല ... മനുഷ്യരുടെ മുമ്പിലും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധിതമായ ഊന്നൽ മലയാളത്തിലെ ‘മാത്രമല്ല ... -ഉം/-ഇലും’ ഘടന സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐνώπιον
  choice: മുമ്പിൽ
  rationale: ἐνώπιον എന്നത് ഒരാളുടെ ദൃഷ്ടിയിലോ സന്നിധിയിലോ എന്ന അർത്ഥമാണ്. ഇരു പ്രയോഗങ്ങളിലും ‘മുമ്പിൽ’ സംക്ഷിപ്തവും മാന്യവും സ്വാഭാവികവുമാണ്.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന ദൈവിക അഭിസംബോധനയ്ക്ക് മലയാള ബൈബിൾ ഭാഷയിൽ വ്യക്തവും സ്ഥിരവുമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രമല്ല, പൊതുവായി മനുഷ്യ നിരീക്ഷകരെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ലിംഗനിഷ്പക്ഷമായ ‘മനുഷ്യർ’ കൃത്യമാണ്.
theological_decisions:
- issue: സാമ്പത്തിക ഉത്തരവാദിത്വത്തിന്റെ സന്ദർഭത്തിൽ καλὰ എന്നതിന്റെ ധാർമികവും പൊതുമാന്യതയുമായി ബന്ധപ്പെട്ടതുമായ സൂക്ഷ്മത
  choice: പ്രധാന പാഠത്തിൽ വിശാലമായി ‘നല്ലതായിരിക്കുന്നത്’
  alternative: ‘മാന്യമായിരിക്കുന്നത്’ അല്ലെങ്കിൽ ‘ശരിയായിരിക്കുന്നത്’
  rationale: വാക്യം ദൈവത്തിന്റെ മുമ്പിലും മനുഷ്യരുടെ ദൃഷ്ടിയിലും പ്രശംസനീയമായ പെരുമാറ്റത്തെ ഊന്നുന്നു. ഗ്രീക്ക് പദത്തിന് പൊതുവായ ധാർമിക നന്മയും പരസ്യമായ മാന്യതയും സൂചിപ്പിക്കാൻ കഴിയും. പ്രധാന പാഠം വിശാലമായ അർത്ഥം നിലനിർത്തുകയും സന്ദർഭപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മുൻകരുതലെടുക്കുന്നു’ എന്ന പ്രയോഗം സാമ്പത്തിക ഇടപാടിലെ സുതാര്യതയ്ക്കായുള്ള ബോധപൂർവമായ മുൻചിന്ത വ്യക്തമാക്കുന്നു; പാഠത്തിലെ ദൈവികവും മാനുഷികവുമായ ഉത്തരവാദിത്വത്തിന്റെ സമാന്തരത നിലനിർത്തിയിട്ടുണ്ട്.
