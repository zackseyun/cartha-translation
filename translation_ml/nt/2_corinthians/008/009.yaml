    text: “സമ്പന്നൻ”, “ദരിദ്രൻ” എന്നീ പദങ്ങൾ ഇവിടെ രൂപകപ്രയോഗങ്ങളായിരിക്കാനാണ് സാധ്യത. ക്രിസ്തുവിന്റെ സമ്പന്നതയെയും മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള അവന്റെ സ്വയംതാഴ്ത്തലിനെയും അവ തമ്മിൽ താരതമ്യം ചെയ്യുന്നു; എന്നാൽ ഈ രൂപകം എന്തിനെ സൂചിപ്പിക്കുന്നുവെന്ന് പൗലോസ് ഇവിടെ വ്യക്തമായി നിർവചിക്കുന്നില്ല.
