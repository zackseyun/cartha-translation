id: 2CO.8.9
reference: 2 Corinthians 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: ml
  text: 'നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ[a] കൃപ നിങ്ങൾ അറിയുന്നുവല്ലോ: അവൻ സമ്പന്നനായിരുന്നിട്ടും, നിങ്ങൾക്കുവേണ്ടി ദരിദ്രനായിത്തീർന്നു; അവന്റെ ദാരിദ്ര്യത്താൽ നിങ്ങൾ സമ്പന്നരായിത്തീരേണ്ടതിന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശു മശീഹ.” ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് “ക്രിസ്തു” എന്ന് ലിപ്യന്തരം ചെയ്യുകയോ “മശീഹ” എന്ന് അർഥം വിവർത്തനം ചെയ്യുകയോ ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκετε
  choice: നിങ്ങൾ അറിയുന്നുവല്ലോ
  rationale: വർത്തമാനകാല ബഹുവചനരൂപം കൊരിന്ത്യർക്ക് ഇതിനകം അറിയാവുന്ന കാര്യം പൗലോസ് ഓർമിപ്പിക്കുന്നതായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: ക്രിസ്തുവിന്റെ കൃപാപൂർണമായ പ്രവൃത്തിയെയും ചുറ്റുപാടിലെ ഉദാരതയ്ക്കുള്ള മാതൃകയെയും ഒരുമിച്ച് സൂചിപ്പിക്കാൻ കഴിയുന്ന, ദൈവശാസ്ത്രപരമായ ആഴമുള്ള സ്വാഭാവിക പദമാണ്.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ അധികാരപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്ന നിലവാരമുള്ള മലയാളപ്രയോഗം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തു
  rationale: മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ സ്ഥിരപ്രയോഗം; Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: διά + accusative-ന്റെ ഗുണഭോക്തൃപരമായ അർഥം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπτώχευσεν
  choice: ദരിദ്രനായിത്തീർന്നു
  rationale: മുൻ സമ്പന്നാവസ്ഥയിൽനിന്ന് ദാരിദ്ര്യത്തിലേക്കുള്ള മാറ്റം നേരിട്ട് രേഖപ്പെടുത്തുകയും കർത്തൃപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πλούσιος ὤν
  choice: സമ്പന്നനായിരുന്നിട്ടും
  rationale: കൃദ്യന്തരൂപത്തിലെ concessive ഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: അവന്റെ ദാരിദ്ര്യത്താൽ
  rationale: ദാതൃവിഭക്തിയുടെ ഉപാധി/മാർഗ അർഥവും ἐκείνου-യുടെ ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλουτήσητε
  choice: സമ്പന്നരായിത്തീരേണ്ടതിന്
  rationale: ἵνα-യോടുകൂടിയ ഉദ്ദേശ്യഭാവം പ്രകടിപ്പിക്കുകയും ‘ദരിദ്രനായിത്തീർന്നു / സമ്പന്നരായിത്തീരുക’ എന്ന ഉദ്ദേശ്യപൂർവമായ വിരുദ്ധസമാന്തര്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ ‘സമ്പത്ത്’, ‘ദാരിദ്ര്യം’, വിശ്വാസികളുടെ ‘സമ്പന്നരാകൽ’ എന്നിവയുടെ അർഥം
  choice: സാമ്പത്തിക രൂപകം മുഖ്യവാക്യത്തിൽ അതേപടി നിലനിർത്തി, അത് ഏതു പ്രത്യേക ദൈവശാസ്ത്രപരമായ യാഥാർഥ്യത്തെ മാത്രം സൂചിപ്പിക്കുന്നു എന്ന് നിർവചിച്ചില്ല.
  alternative: ‘സമ്പന്നൻ’ എന്നത് ക്രിസ്തുവിന്റെ മനുഷ്യാവതാരത്തിനു മുമ്പുള്ള ദിവ്യമഹത്വമെന്നും ‘സമ്പന്നരാകുക’ എന്നത് ആത്മീയ രക്ഷാനുഗ്രഹങ്ങൾ മാത്രമെന്നും തുറന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം രൂപകത്തെ വിശദീകരിക്കുന്നില്ല. അത് ക്രിസ്തുവിന്റെ സ്വയംനൽകലിനെയും പൗലോസിന്റെ ഉദാരതയ്ക്കുള്ള ആഹ്വാനത്തെയും ഒരുമിച്ച് ഉണർത്തുന്നതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ വിശാലതയും സംഘർഷവും സംരക്ഷിച്ചു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അവതരണം
  choice: മുഖ്യവാക്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ ഉപയോഗിച്ച് അതിന്റെ ‘മശീഹ’ എന്ന അർഥം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: മുഖ്യവാക്യത്തിൽ ‘യേശു മശീഹ’ എന്ന് വിവർത്തനം ചെയ്യുക.
  rationale: Χριστός യഥാർഥത്തിൽ സ്ഥാനപ്പേരാണെന്ന അർഥം മറച്ചുവയ്ക്കാതെ, ആധുനിക മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികവും തിരിച്ചറിയാവുന്നതുമായ രൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ കാരണം/വിശദീകരണബന്ധം മലയാളത്തിൽ ദീർഘവും അസ്വാഭാവികവുമായ ‘എന്ന്’ ഘടനയാക്കാതെ ദ്വിബിന്ദുവിലൂടെ വ്യക്തമാക്കി; ἵνα-യുടെ ഉദ്ദേശ്യം അവസാന ഉപവാക്യത്തിൽ സംരക്ഷിച്ചു. ‘സമ്പന്നൻ/ദരിദ്രൻ’ എന്ന നേരിട്ടുള്ള വിരുദ്ധത നിലനിർത്തി.
