- from: അവർ തങ്ങളുടെ കഴിവിനൊത്തും കഴിവിനപ്പുറവും സ്വമേധയാ കൊടുത്തു[a]—ഇതിന് ഞാൻ സാക്ഷ്യം പറയുന്നു.
  to: അവർ തങ്ങളുടെ കഴിവിനൊത്തും കഴിവിനപ്പുറവും സ്വമേധയാ കൊടുത്തു എന്നു ഞാൻ സാക്ഷ്യം പറയുന്നു.[a]
  rationale: The revision replaces the backward demonstrative construction with an explicit content clause governed by “ഞാൻ സാക്ഷ്യം പറയുന്നു,” thereby preserving the syntax and discourse force of ὅτι and μαρτυρῶ. The central terms and the contextual, implied action of giving are retained.
