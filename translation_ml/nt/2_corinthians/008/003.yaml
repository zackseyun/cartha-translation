  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: ml
  text: അവർ തങ്ങളുടെ കഴിവിനൊത്തും കഴിവിനപ്പുറവും സ്വമേധയാ കൊടുത്തു എന്നു ഞാൻ സാക്ഷ്യം പറയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തങ്ങളുടെ സാമ്പത്തികശേഷിക്കൊത്തും അതിനപ്പുറവും, സ്വന്തം ഇഷ്ടപ്രകാരം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: —ഇതിന്
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുകയും ഉറപ്പിക്കുകയും ചെയ്യുന്ന ὅτιയുടെ സന്ദർഭപരമായ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പദക്രമം മാറ്റിയതിനാൽ ബന്ധം വാക്യാവസാനത്ത് സൂചിപ്പിച്ചു.
- source_word: κατὰ δύναμιν
  choice: തങ്ങളുടെ കഴിവിനൊത്തും
  rationale: κατά ഇവിടെ അളവോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു. ‘കഴിവിനൊത്ത്’ എന്നത് അവരുടെ ശേഷിയുടെ പരിധിക്കനുസരിച്ചുള്ള കൊടുക്കലിനെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: μαρτυρῶ
  choice: ഞാൻ സാക്ഷ്യം പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ഊന്നലുള്ള പൗലോസിന്റെ വ്യക്തിപരമായ സാക്ഷ്യപ്രസ്താവന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καὶ παρὰ δύναμιν
  choice: കഴിവിനപ്പുറവും
  rationale: παρά + accusative ഒരു പരിധി കവിയുന്നതിനെ സൂചിപ്പിക്കുന്നു; മുൻപ്രയോഗത്തോടുള്ള അലങ്കാരപരമായ സമാന്തരതയും വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: αὐθαίρετοι
  choice: സ്വമേധയാ
  rationale: നിർബന്ധമില്ലാതെ സ്വന്തം തീരുമാനത്താലും മുൻകൈയോടെയും പ്രവർത്തിച്ചു എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: αὐθαίρετοι എന്നതിനോടൊപ്പമുള്ള അധ്യാഹൃത ക്രിയ
  choice: സന്ദർഭത്തിൽനിന്ന് ‘കൊടുത്തു’ എന്ന് ചേർത്തു.
  alternative: കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘സ്വമേധയുള്ളവരായി’ എന്നു നൽകുക.
  rationale: ഗ്രീക്ക് വാക്യം സംക്ഷിപ്തവും അധ്യാഹാരപരവുമാണ്. 2–4 വാക്യങ്ങളിലെ വിഷയം ദാനമായതിനാൽ, മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യത്തിനായി ‘കൊടുത്തു’ ചേർക്കുന്നത് വ്യക്തമായ സന്ദർഭാർഥത്തിനപ്പുറം ഒന്നും കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഊന്നൽ സ്വാഭാവികമാക്കാൻ ‘ഞാൻ സാക്ഷ്യം പറയുന്നു’ വാക്യാവസാനത്തിലാക്കി; ‘സ്വമേധയാ’ എന്നത് സ്വമനസ്സാലുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു.
