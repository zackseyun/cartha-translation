translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ താരതമ്യഭാവവും സ്വമേധാപ്രവർത്തനവും ദിശാസൂചനയും പരമാവധി സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു.
