- from: കാരണം, അവൻ അഭ്യർഥന സ്വീകരിച്ചു[a]; അതിലുപരി, കൂടുതൽ ഉത്സാഹിയായിരുന്നതിനാൽ, സ്വന്തം ഇഷ്ടപ്രകാരം നിങ്ങളുടെ അടുക്കലേക്കു പുറപ്പെട്ടു[b].
  to: കാരണം, അവൻ അഭ്യർഥന സ്വീകരിച്ചു[a]; എന്നാൽ, കൂടുതൽ ഉത്സാഹമുള്ളവനായ അവൻ, സ്വന്തം ഇഷ്ടപ്രകാരം നിങ്ങളുടെ അടുക്കലേക്കു പുറപ്പെട്ടു[b].
