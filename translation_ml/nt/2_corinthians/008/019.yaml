id: 2CO.8.19
reference: 2 Corinthians 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: ml
  text: അതു മാത്രമല്ല, സഭകൾ അവനെ ഞങ്ങളുടെ സഹയാത്രികനായി തിരഞ്ഞെടുത്തു[a]—ഞങ്ങൾ കൈകാര്യം ചെയ്യുന്ന ഈ കൃപാദാനത്തോടൊപ്പം, കർത്താവിന്റെതന്നെ മഹത്ത്വത്തിനും ഞങ്ങളുടെ സന്നദ്ധതയ്ക്കുമായി[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിയമിച്ചു’ അല്ലെങ്കിൽ ‘തിരഞ്ഞെടുത്ത് നിയോഗിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘അവന്റെ കർത്താവിന്റെ മഹത്ത്വത്തിനായി’ എന്നും ഈ ഗ്രീക്ക് വാക്യഘടന ഗ്രഹിക്കാവുന്നതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: തിരഞ്ഞെടുത്തു
  rationale: സഭകൾ ആ വ്യക്തിയെ ഈ ചുമതലയ്ക്കായി നിയോഗിച്ചതാണ് ആശയം. ആധുനിക വോട്ടെടുപ്പ് നടപടിയെ അനാവശ്യമായി സൂചിപ്പിക്കാതെ ഉറവിടപദത്തിന്റെ ‘തിരഞ്ഞെടുക്കുക/നിയോഗിക്കുക’ എന്ന അർഥം നൽകുന്നു.
- source_word: ἐκκλησιῶν
  choice: സഭകൾ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളെയാണ് സാധാരണയായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദം.
- source_word: συνέκδημος
  choice: സഹയാത്രികൻ
  rationale: ഒരുമിച്ചു യാത്ര ചെയ്യുന്ന വ്യക്തിയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: χάριτι
  choice: കൃപാദാനം
  rationale: യെരൂശലേമിലേക്കുള്ള ധനശേഖരണത്തിന്റെ പശ്ചാത്തലത്തിൽ χάρις കൃപയുടെ സ്വഭാവമുള്ള മൂർത്തമായ ദാനത്തെ സൂചിപ്പിക്കുന്നു; ‘കൃപാദാനം’ ഇരു വശങ്ങളും നിലനിർത്തുന്നു.
- source_word: διακονουμένῃ
  choice: ശുശ്രൂഷയായി നിർവഹിക്കുന്ന
  rationale: ദാനം പൗലോസും കൂട്ടരും ഉത്തരവാദിത്വത്തോടെ കൈകാര്യം ചെയ്യുന്ന സേവനത്തെ സൂചിപ്പിക്കുന്നു; കേവലം വിതരണമെന്നതിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: πρὸς
  choice: …ത്തിനും …ുന്നതിനുമായി
  rationale: ഇവിടെ ഉദ്ദേശ്യമോ ലക്ഷ്യമോ പ്രകടിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യഘടന ഉപയോഗിച്ചു.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: കർത്താവിന്റെതന്നെ
  rationale: αὐτοῦ എന്നതിനെ ഊന്നൽ നൽകുന്ന ഘടകമായി വായിച്ച് കർത്താവിനെത്തന്നെ മുൻനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: δόξαയുടെ ദൈവശാസ്ത്രപരമായ ഭാരവും സ്തുത്യർഹമായ തേജസ്സും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προθυμίαν
  choice: സന്നദ്ധത
  rationale: മനസ്സോടെയുള്ള ഒരുക്കത്തെയും ഉത്സാഹത്തെയും സൂചിപ്പിക്കുന്നു; ‘സഹായിക്കാനുള്ള’ എന്ന വ്യാഖ്യാനവികാസം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν എന്നതിലെ αὐτοῦയുടെ ബന്ധവും ഊന്നലും
  choice: ‘കർത്താവിന്റെതന്നെ മഹത്ത്വം’—αὐτοῦയെ കർത്താവിനെ ഊന്നിപ്പറയുന്ന ഘടകമായി എടുത്തു.
  alternative: ‘അവന്റെ കർത്താവിന്റെ മഹത്ത്വം’ അല്ലെങ്കിൽ ലളിതമായി ‘കർത്താവിന്റെ മഹത്ത്വം’.
  rationale: ഗ്രീക്ക് ഘടന സംക്ഷിപ്തവും ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാവുന്നതുമാണ്. മുഖ്യവാചകത്തിൽ സാധ്യതയേറിയ ഊന്നൽ നിലനിർത്തുകയും യഥാർഥമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: προθυμίαν ἡμῶν എന്നതിന്റെ ലക്ഷ്യബന്ധം
  choice: ‘ഞങ്ങളുടെ സന്നദ്ധത വെളിവാക്കുന്നതിനുമായി’ എന്ന് ആശയബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
  alternative: ‘ഞങ്ങളുടെ സന്നദ്ധതയ്ക്കുമായി’ എന്ന കൂടുതൽ ഔപചാരികവും എന്നാൽ അസ്വാഭാവികവുമായ രൂപം.
  rationale: ഗ്രീക്കിലെ ലക്ഷ്യഘടനയിൽ ‘മഹത്ത്വം’ എന്നതോടൊപ്പം ‘ഞങ്ങളുടെ സന്നദ്ധതയും’ വരുന്നു. മലയാളത്തിൽ ലക്ഷ്യം വ്യക്തമാകാൻ കുറഞ്ഞ തോതിലുള്ള വ്യാകരണവികാസം ആവശ്യമാണ്; സഹായത്തിന്റെ സ്വഭാവം പ്രത്യേകമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. വാക്യത്തിന്റെ തുടർച്ച അടുത്ത വാക്യത്തിലേക്കു നീളുന്നുവെന്ന ഗ്രീക്ക് വിരാമഭാവം ദീർഘരേഖയിലൂടെ നിലനിർത്തി. സഭാ-ഭരണപരമായ അതിസാങ്കേതിക പദങ്ങളും വിഭാഗീയ ഭാഷയും ഒഴിവാക്കി.
