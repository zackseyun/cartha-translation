source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: ml
  text: 'കഠിനമായ കഷ്ടതയുടെ പരീക്ഷണത്തിലും, അവരുടെ സന്തോഷത്തിന്റെ സമൃദ്ധിയും അവരുടെ അഗാധമായ ദാരിദ്ര്യവും[a] അവരുടെ ഉദാരതയുടെ സമ്പത്തിലേക്ക്[b] കവിഞ്ഞൊഴുകി.


    [a] അഥവാ, “അടിത്തട്ടോളമെത്തിയ അവരുടെ ദാരിദ്ര്യം”; അല്ലെങ്കിൽ, “അവരുടെ അത്യന്തമായ ദാരിദ്ര്യം.”


    [b] അഥവാ, “അവരുടെ ലാളിത്യത്തിന്റെ സമ്പത്തിലേക്ക്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് “ലാളിത്യം” അല്ലെങ്കിൽ “ഏകമനസ്സുത” എന്ന അർഥങ്ങളും വരാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് ഉദാരമായ ദാനത്തെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യത.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിത്തട്ടോളമെത്തിയ അവരുടെ ദാരിദ്ര്യം”; അല്ലെങ്കിൽ, “അവരുടെ അത്യന്തമായ ദാരിദ്ര്യം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവരുടെ ലാളിത്യത്തിന്റെ സമ്പത്തിലേക്ക്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് “ലാളിത്യം” അല്ലെങ്കിൽ “ഏകമനസ്സുത” എന്ന അർഥങ്ങളും വരാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് ഉദാരമായ ദാനത്തെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: കഷ്ടതയുടെ കഠിനമായ പരീക്ഷയിൽ
  rationale: δοκιμή എന്നത് പരീക്ഷയെയോ പരിശോധനയെയോ സൂചിപ്പിക്കുന്നു; θλίψεως-നോടുള്ള ജനിറ്റീവ് ബന്ധവും πολλῇ നൽകുന്ന തീവ്രതയും നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: അവരുടെ സന്തോഷത്തിന്റെ സമൃദ്ധി
  rationale: περισσεία എന്ന നാമപദത്തിന്റെ ‘സമൃദ്ധി/ആധിക്യം’ എന്ന അർഥവും പിന്നാലെയുള്ള ἐπερίσσευσεν എന്ന ക്രിയയുമായുള്ള ശബ്ദാർഥബന്ധവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: അവരുടെ അഗാധമായ ദാരിദ്ര്യം
  rationale: κατὰ βάθους ദാരിദ്ര്യത്തിന്റെ അതിതീവ്രതയെ ആഴത്തിന്റെ രൂപകത്തിലൂടെ പ്രകടിപ്പിക്കുന്നു; ‘അഗാധമായ’ ആ രൂപകവും തീവ്രതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐπερίσσευσεν
  choice: കവിഞ്ഞൊഴുകി
  rationale: περισσεύω നൽകുന്ന സമൃദ്ധി അതിരുകവിഞ്ഞ് ഒരു ഫലത്തിലേക്കു നീങ്ങുന്ന സജീവ ദൃശ്യം മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς τὸ πλοῦτος
  choice: സമ്പത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാത്മകവും ഫലസൂചകവുമായ ശക്തി നിലനിർത്തുന്നു; πλοῦτος-ന് ‘സമ്പത്ത്’ സ്വാഭാവികമായ തുല്യപദമാണ്.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: അവരുടെ ഉദാരതയുടെ
  rationale: സഹായധനശേഖരണത്തിന്റെ ഈ സന്ദർഭത്തിൽ ἁπλότης ഉദാരമായ ദാനത്തെ സൂചിപ്പിക്കുന്നതാണ് ഏറ്റവും സാധ്യതയുള്ളത്; അതേസമയം പദത്തിന്റെ ‘നിഷ്കപടത/ലാളിത്യം/ഏകാഗ്രഹൃദയത’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: സാമ്പത്തിക ദാനത്തിന്റെ സന്ദർഭത്തിൽ ἁπλότης എന്ന പദത്തിന്റെ അർഥം
  choice: ഉദാരത
  alternative: നിഷ്കപടത; ലാളിത്യം; ഏകാഗ്രഹൃദയത
  rationale: അടുത്ത സന്ദർഭം വിശുദ്ധർക്കുവേണ്ടിയുള്ള ഭൗതികദാനത്തെക്കുറിച്ചായതിനാൽ ‘ഉദാരത’യാണ് ഇവിടെ ഏറ്റവും യോജിച്ച അർഥം. എന്നാൽ ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥപരിധി അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു; അതിനാൽ പാഠത്തിലെ യഥാർഥ അർഥസാധ്യതകൾ മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ സന്തോഷം–ദാരിദ്ര്യം–സമ്പത്ത് എന്ന വൈരുധ്യവും περισσεία/ἐπερίσσευσεν എന്ന സമൃദ്ധി–കവിഞ്ഞൊഴുകൽ ബന്ധവും നിലനിർത്തി. സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാകാൻ വാക്യഘടന ലളിതമാക്കിയെങ്കിലും ദൈവശാസ്ത്രപരമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
