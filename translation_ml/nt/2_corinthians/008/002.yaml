revisions:
- from: 'കഷ്ടതയുടെ കഠിനമായ പരീക്ഷയിൽ, അവരുടെ സന്തോഷത്തിന്റെ സമൃദ്ധിയും അവരുടെ അഗാധമായ ദാരിദ്ര്യവും[a] അവരുടെ ഉദാരതയുടെ സമ്പത്തിലേക്ക്[b] കവിഞ്ഞൊഴുകി.


