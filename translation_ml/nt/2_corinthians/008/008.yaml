reference: 2 Corinthians 8:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: ml
  text: ഇതു ഞാൻ ഒരു കല്പനയായി പറയുന്നതല്ല; മറിച്ച്, മറ്റുള്ളവരുടെ ഉത്സാഹത്തിലൂടെ[a] നിങ്ങളുടെ സ്നേഹത്തിന്റെ ആത്മാർഥത പരിശോധിക്കുകയും ചെയ്യുകയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മറ്റുള്ളവരുടെ ആത്മാർഥമായ താത്പര്യത്തിലൂടെ”; σπουδή എന്ന പദത്തിന് ഉത്സാഹം, ആത്മാർഥമായ താത്പര്യം, ശുഷ്കാന്തി എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: “പരിശോധിക്കുകയും ചെയ്യുകയാണ്” എന്നതിന് “യഥാർഥമെന്ന് തെളിയിക്കുകയാണ്” അല്ലെങ്കിൽ “പരീക്ഷിച്ചറിയുകയാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: കല്പന
  rationale: അധികാരപൂർവമായ ആജ്ഞ എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും, സ്വമനസ്സാലെയുള്ള ഉദാരതയുമായുള്ള സന്ദർഭപരമായ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: മറ്റുള്ളവരുടെ ഉത്സാഹത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം നിലനിർത്തുന്നു; ἑτέρων എന്നത് ആരെക്കുറിച്ചാണെന്ന് പാഠത്തിൽക്കാൾ അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: σπουδή
  choice: ഉത്സാഹം
  rationale: ഈ ദാനസന്ദർഭത്തിൽ കാണുന്ന ആത്മാർഥമായ താത്പര്യവും പ്രവർത്തനസന്നദ്ധതയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπηയുടെ പതിവായ, വ്യക്തവും സന്ദർഭോചിതവുമായ മലയാള തുല്യപദം.
- source_word: γνήσιον
  choice: ആത്മാർഥത
  rationale: യഥാർഥമോ കപടമില്ലാത്തതോ ആയ ഗുണത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘സ്നേഹത്തിന്റെ ആത്മാർഥത’ സ്വാഭാവികമാണ്.
- source_word: δοκιμάζων
  choice: പരിശോധിക്കുകയാണ്
  rationale: പ്രധാനക്രിയയോടൊപ്പം നടക്കുന്ന പരീക്ഷിക്കൽ/വിലയിരുത്തൽ എന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ബലം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καί
  choice: -യും
  rationale: ‘നിങ്ങളുടെ സ്നേഹത്തിന്റെ ആത്മാർഥതയും’ എന്ന പ്രയോഗത്തിലൂടെ കൂട്ടിച്ചേർക്കൽസൂചകമായ καίയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: ὑμετέρας
  choice: നിങ്ങളുടെ
  rationale: കൊരിന്ത്യരെ കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്ന ഉടമസ്ഥത വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ദാനം സംബന്ധിച്ച പൗലോസിന്റെ വാചകഭാവം
  choice: താൻ അധികാരപൂർവമായ കല്പന നൽകുകയല്ലെന്ന് പൗലോസ് തുറന്നുപറയുകയും, കൊരിന്ത്യരുടെ സ്നേഹത്തിന്റെ ആത്മാർഥത പരിശോധിക്കുകയാണെന്ന് അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
  alternative: പൗലോസ് കല്പനയുടെ സ്വഭാവം നിഷേധിക്കാതെ അതിനെ വാചകപരമായി മൃദുവാക്കുന്നു.
  rationale: οὐ κατ’ ἐπιταγὴν λέγω എന്നത് നേരിട്ടുള്ള നിഷേധമാണ്. അതിനെ മറഞ്ഞിരിക്കുന്ന കല്പനയായി പരിഭാഷപ്പെടുത്താതെ, അപ്പൊസ്തലിക അധികാരവും സ്നേഹത്തിൽനിന്നുള്ള സ്വമേധാനുസരണവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വൈരുധ്യം ‘കല്പനയായിട്ടല്ല... മറിച്ച്’ എന്ന ഘടനയിൽ സൂക്ഷിച്ചു. അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദസമുച്ചയങ്ങൾക്കു ശേഷം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
