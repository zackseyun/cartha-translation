  terminology: ‘കല്പന,’ ‘ഉത്സാഹം,’ ‘സ്നേഹം,’ and ‘ആത്മാർഥത’ are appropriate. ‘ആത്മാർഥത’ suitably expresses the genuineness/sincerity intended by γνήσιον without overinterpreting it.
  issues:
