    rationale: In καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων, καί adds the testing action in relation to the preceding reference to others’ earnestness. The existing wording can mean ‘testing also the genuineness of your love,’ a different scope. Moving the additive expression to the verb preserves the Greek relationship.
