  text: എന്തെന്നാൽ, നാം ജഡത്തിൽ[a] നടക്കുന്നവരെങ്കിലും, ജഡപ്രകാരം യുദ്ധം ചെയ്യുന്നില്ല—
  philosophy: optimal-equivalence
  footnotes:
