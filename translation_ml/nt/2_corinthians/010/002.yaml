revisions:
- from: എന്നാൽ, ഞങ്ങൾ ജഡപ്രകാരം നടക്കുന്നവരാണെന്ന് കരുതുന്ന ചിലരോട് ധൈര്യമായി എതിർനിൽക്കേണ്ടിവരുമെന്ന് ഞാൻ വിചാരിക്കുന്ന ആ ഉറപ്പോടെ, നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ ധൈര്യം കാണിക്കേണ്ടിവരാതിരിക്കട്ടെ എന്നു ഞാൻ അപേക്ഷിക്കുന്നു.[a]
  to: എന്നാൽ, ജഡപ്രകാരം നടക്കുന്നവരാണെന്ന് ഞങ്ങളെ കരുതുന്ന ചിലരോട് എതിർന്നു പ്രവർത്തിക്കാൻ ഞാൻ ധൈര്യപ്പെടുമെന്നു വിചാരിക്കുന്ന ആ ആത്മവിശ്വാസത്തോടെ, നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ ധൈര്യമായി പ്രവർത്തിക്കേണ്ടിവരാതിരിക്കട്ടെ എന്നു ഞാൻ അപേക്ഷിക്കുന്നു.[a]
