id: 2CO.10.2
reference: 2 Corinthians 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ml
  text: എന്നാൽ, ജഡപ്രകാരം നടക്കുന്നവരാണെന്ന് ഞങ്ങളെ കരുതുന്ന ചിലരോട് എതിർന്നു പ്രവർത്തിക്കാൻ ഞാൻ ധൈര്യപ്പെടുമെന്നു വിചാരിക്കുന്ന ആ ആത്മവിശ്വാസത്തോടെ, നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ ധൈര്യമായി പ്രവർത്തിക്കേണ്ടിവരാതിരിക്കട്ടെ എന്നു ഞാൻ അപേക്ഷിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങൾ മാനുഷിക മാനദണ്ഡങ്ങൾക്കനുസരിച്ച് ജീവിക്കുന്നവരാണെന്ന്.’
    reason: κατὰ σάρκα എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ വ്യാഖ്യാനപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: δέομαι
  choice: ഞാൻ അപേക്ഷിക്കുന്നു
  rationale: ലളിതമായ ചോദിക്കലിനെക്കാൾ ശക്തമായ, ആത്മാർഥമായ അഭ്യർഥനയാണ് ഈ ക്രിയ സൂചിപ്പിക്കുന്നത്; ആധുനിക മാന്യമായ മലയാളത്തിൽ ‘അപേക്ഷിക്കുന്നു’ അതു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ ധൈര്യം കാണിക്കേണ്ടിവരാതിരിക്കട്ടെ
  rationale: പൗലൊസിന്റെ അപേക്ഷയുടെ ഉള്ളടക്കവും, നേരിൽ എത്തുമ്പോൾ കർശനമായി പ്രവർത്തിക്കേണ്ടിവരുന്നത് ഒഴിവാക്കാനുള്ള ആഗ്രഹവും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: παρὼν
  choice: നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ
  rationale: സന്ദർഭത്തിലെ സന്നിധി–അസന്നിധി വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: θαρρῆσαι
  choice: ധൈര്യം കാണിക്കുക
  rationale: എതിരാളികളോടു ഉറച്ച നിലപാടെടുക്കുക എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു; അതേസമയം ക്രിയയുടെ അടിസ്ഥാനമായ ‘ധൈര്യപ്പെടുക’ എന്ന ആശയം അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τῇ πεποιθήσει
  choice: ആ ഉറപ്പോടെ
  rationale: πεποίθησις സൂചിപ്പിക്കുന്ന ആത്മവിശ്വാസം/ഉറപ്പ് മലയാളത്തിൽ സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: ᾗ λογίζομαι
  choice: എന്നു ഞാൻ വിചാരിക്കുന്ന
  rationale: λογίζομαιയിലെ ആലോചിച്ചുള്ള വിലയിരുത്തലോ ഉദ്ദേശ്യമോ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τολμῆσαι ἐπί τινας
  choice: ചിലരോട് ധൈര്യമായി എതിർനിൽക്കേണ്ടിവരും
  rationale: τολμάωയുടെ ധൈര്യപൂർവമായ നടപടി എന്ന ബലവും ἐπί τινας എന്നതിന്റെ വ്യക്തികളിലേക്കുള്ള പ്രതികൂല ദിശയും ചേർത്ത് നൽകുന്നു; ‘നേരിടുക’ എന്നതിലുപരി സന്ദർഭത്തിലെ എതിർപ്പിന്റെ സ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: τοὺς λογιζομένους
  choice: കരുതുന്ന ചിലർ
  rationale: പൗലൊസിനെയും സഹപ്രവർത്തകരെയും കുറിച്ചുള്ള ചിലരുടെ വിലയിരുത്തൽ ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലൊസിന്റെ σάρξ എന്ന പ്രധാന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും അർഥദ്വയത്വവും നിലനിർത്തുന്നു; ‘മാനുഷിക മാനദണ്ഡങ്ങൾപ്രകാരം’ എന്ന വ്യാഖ്യാനപരമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: περιπατοῦντας
  choice: നടക്കുന്നവർ
  rationale: ജീവിതചര്യയെ ‘നടക്കുക’ എന്നു ചിത്രീകരിക്കുന്ന പൗലൊസിന്റെ രൂപകം നിലനിർത്തുന്നു; മലയാള ബൈബിൾ ഭാഷയിൽ ഇത് മനസ്സിലാക്കാവുന്നതുമാണ്.
theological_decisions:
- issue: κατὰ σάρκα എന്നതിലെ σάρξ-ന്റെ പരിഭാഷ
  choice: ജഡപ്രകാരം
  alternative: മാനുഷിക മാനദണ്ഡങ്ങൾക്കനുസരിച്ച് ജീവിക്കുന്നവർ
  rationale: ഇവിടെ ആരോപണം വെറും പാപസ്വഭാവത്തെക്കുറിച്ചാണെന്ന് തീർപ്പാക്കുന്നത് മൂലപാഠത്തേക്കാൾ അധികവ്യാഖ്യാനമാകും. ‘ജഡപ്രകാരം’ പൗലൊസിന്റെ പദപ്രയോഗവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു; കൂടുതൽ വ്യാഖ്യാനപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പൗലൊസിന്റെ ‘നടക്കുക’, ‘ജഡം’ എന്നീ രൂപക-ദൈവശാസ്ത്ര പദങ്ങൾ പ്രധാനപാഠത്തിൽ സംരക്ഷിച്ചിരിക്കുന്നു; ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി സ്വാഭാവികമായി ക്രമീകരിച്ചിരിക്കുന്നു.
