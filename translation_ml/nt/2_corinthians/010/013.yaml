id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: ml
  text: എന്നാൽ ഞങ്ങൾ അളവതികന്ന് സ്വയം പുകഴ്ത്തുകയില്ല; മറിച്ച്, ദൈവം ഞങ്ങൾക്കു വിഹിതമായി നൽകിയ പ്രവർത്തനമേഖലയുടെ അളവനുസരിച്ച് സ്വയം പുകഴ്ത്തും—നിങ്ങളിലേക്കും എത്തുന്ന ഒരു അളവാണത്—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμετρα
  choice: പരിധിക്കപ്പുറം
  rationale: εἰς τὰ ἄμετρα എന്ന പ്രയോഗം ഉചിതമായ അതിരുകൾ ലംഘിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പരിധിക്കപ്പുറം’ എന്നത് അളവിന്റെയും അതിരിന്റെയും രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καυχησόμεθα
  choice: പ്രശംസിക്കുകയില്ല / പ്രശംസിക്കൂ
  rationale: വാദപ്രതിവാദപരമായ ഈ സന്ദർഭത്തിൽ സ്വന്തം ശുശ്രൂഷയെക്കുറിച്ച് അവകാശവാദം ഉന്നയിക്കുന്നതോ അഭിമാനിക്കുന്നതോ ആണ് അർഥം. ‘പ്രശംസിക്കുക’ നേരിട്ടും മാന്യവുമായ സമാനപദമാണ്.
- source_word: κατὰ τὸ μέτρον
  choice: അളവനുസരിച്ച്
  rationale: ദൈവം നിശ്ചയിച്ച അളവിനോ പരിധിക്കോ അനുരൂപമായി എന്ന ആശയം നൽകുകയും ആവർത്തിക്കുന്ന μέτρον-രൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: κανόνος
  choice: പ്രവർത്തനമേഖല
  rationale: ഇവിടെ κανών പ്രധാനമായും ഒരു ധാർമിക നിയമമല്ല; ദൈവം പങ്കിട്ടുനൽകിയ, കൊരിന്ത്യരിലേക്കും വ്യാപിക്കുന്ന ശുശ്രൂഷാമേഖലയാണ്. ‘പ്രവർത്തനമേഖല’ മലയാളത്തിൽ ആ സാഹചര്യാർഥം വ്യക്തമായി നൽകുന്നു; മറ്റു സാദ്ധ്യാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: ദൈവം ഞങ്ങൾക്കു വീതിച്ചുനൽകിയ
  rationale: μερίζω നൽകുന്ന പങ്കുവെക്കൽ/വിഹിതമായി നൽകൽ എന്ന ഭാവം ‘വീതിച്ചുനൽകിയ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: μέτρου
  choice: ഒരു അളവാണത്
  rationale: രണ്ടാമത്തെ μέτρον മുൻപുള്ള മേഖലയെ വിശദീകരിക്കുന്നതായി എടുത്ത്, ഗ്രീക്കിലെ ‘അളവ്’ എന്ന പദത്തിന്റെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἐφικέσθαι
  choice: എത്തുന്ന
  rationale: ദൈവം നൽകിയ അളവിന്റെ വ്യാപ്തി സൂചിപ്പിക്കുന്ന ധാതുവിനെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἄχρι καὶ ὑμῶν
  choice: നിങ്ങളിലേക്കും
  rationale: ἄχρι സൂചിപ്പിക്കുന്ന വ്യാപ്തിയും καί നൽകുന്ന ഊന്നലോടെയുള്ള ഉൾപ്പെടുത്തലും ‘നിങ്ങളിലേക്കും’ എന്നതിൽ സംക്ഷിപ്തമായി നിലനിൽക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ശുശ്രൂഷാവകാശവാദത്തിൽ κανών എന്നതിന്റെ അർഥം
  choice: കൊരിന്ത്യരെയും ഉൾക്കൊള്ളുന്ന, ദൈവം വീതിച്ചുനൽകിയ പ്രവർത്തനമേഖല
  alternative: പൗലോസ് തന്റെ പ്രശംസയെ അളക്കുന്ന നിയമം, മാനദണ്ഡം, അല്ലെങ്കിൽ അതിർത്തി
  rationale: സമീപസന്ദർഭത്തിലെ അളവ്, വിഹിതം, വ്യാപ്തി, ‘നിങ്ങളിലേക്കും എത്തുന്നു’ എന്നീ ആശയങ്ങൾ സ്ഥലപരവും ശുശ്രൂഷാപരവുമായ മേഖലയെ മുൻനിരയിൽ കൊണ്ടുവരുന്നു. എങ്കിലും ‘മാനദണ്ഡം’ തുടങ്ങിയ നിഘണ്ടുസാദ്ധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ μέτρον എന്ന പദത്തിന്റെ ആവർത്തനം ‘അളവ്/അളവനുസരിച്ച്’ എന്നിങ്ങനെ സൂക്ഷിച്ചു. വാക്യാവസാനത്തിലെ ഡാഷ് അടുത്ത വാക്യത്തിലേക്കുള്ള തുടർച്ച പ്രതിഫലിപ്പിക്കുന്നു.
