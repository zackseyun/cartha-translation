id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: ml
  text: 'അങ്ങനെയുള്ള ഒരാൾ[a] ഇതു കണക്കിലെടുക്കട്ടെ: ഞങ്ങൾ അകലെയായിരിക്കുമ്പോൾ കത്തുകളിലൂടെ വാക്കിൽ എങ്ങനെയുള്ളവരാണോ[b], സന്നിഹിതരായിരിക്കുമ്പോൾ പ്രവൃത്തിയിലും അങ്ങനെയുള്ളവർ തന്നെയാണ്.


    [a] അഥവാ, “അത്തരക്കാരൻ.”


    [b] അഥവാ, “സംസാരത്തിൽ … പ്രവൃത്തിയിൽ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത്തരക്കാരൻ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സംസാരത്തിൽ … പ്രവൃത്തിയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: കണക്കിലെടുക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ‘ചിന്തിച്ച് അംഗീകരിക്കുക/ഗൗരവമായി പരിഗണിക്കുക’ എന്ന ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ τοιοῦτος
  choice: അങ്ങനെയുള്ള ഒരാൾ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ തരത്തിലുള്ള വ്യക്തിയെയാണ് ഏകവചനത്തിൽ സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: οἷοί ἐσμεν … τοιοῦτοι
  choice: എങ്ങനെയുള്ളവരാണോ … അങ്ങനെയുള്ളവർ തന്നെയാണ്
  rationale: ഗുണമോ സ്വഭാവമോ സംബന്ധിച്ച ഗ്രീക്ക് പരസ്പരബന്ധിത താരതമ്യം മലയാളത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῷ λόγῳ δι’ ἐπιστολῶν
  choice: കത്തുകളിലൂടെ പറയുന്ന വാക്കുകളിൽ
  rationale: διάയുടെ മാധ്യമാർഥവും λόγος എന്നതിന്റെ വാക്ക്/സംസാരം എന്ന പരിധിയും സ്വാഭാവിക മലയാളത്തിൽ ചേർത്തു നൽകുന്നു; ‘പ്രവൃത്തിയിൽ’ എന്ന വൈരുധ്യവും നിലനിൽക്കുന്നു.
- source_word: ἀπόντες
  choice: അകലെയായിരിക്കുമ്പോൾ
  rationale: സാഹചര്യസൂചക വർത്തമാന കൃദന്തരൂപത്തെ παρόντες എന്നതിനോടുള്ള വ്യക്തമായ വിരുദ്ധസമാന്തരമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: παρόντες
  choice: സന്നിഹിതരായിരിക്കുമ്പോൾ
  rationale: വ്യക്തിപരമായി അവിടെ ഉണ്ടായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുകയും ‘അകലെയായിരിക്കുമ്പോൾ’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῷ ἔργῳ
  choice: പ്രവൃത്തിയിലും
  rationale: വാക്കും പ്രവൃത്തിയും തമ്മിലുള്ള പൗലോസിന്റെ സംക്ഷിപ്തമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കത്തുകളിലെ പൗലോസിന്റെ വാക്കുകളും നേരിട്ടുള്ള സാന്നിധ്യത്തിലെ പ്രവൃത്തിയും തമ്മിലുള്ള ബന്ധം
  choice: അകലെയിരിക്കുമ്പോഴുള്ള കത്തുകളിലെ വാക്കുകൾക്ക് സന്നിഹിതനായിരിക്കുമ്പോഴുള്ള പ്രവൃത്തി പൊരുത്തപ്പെടുന്നു എന്ന നേരിട്ടുള്ള അവകാശവാദമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഭാവിയിൽ എന്തു ചെയ്യുമെന്നുള്ള വെറും ഭീഷണിയായി സ്വതന്ത്രമായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം λόγος–ἔργον, ἀπόντες–παρόντες എന്നീ സമാന്തര വിരുദ്ധജോടികളിലൂടെ ഒരേ സ്വഭാവത്തിന്റെ പൊരുത്തം ഉറപ്പിക്കുന്നു; അതിനെ പ്രത്യേക സഭാശാസ്ത്രപരമോ ഉപദേശപരമോ ആയ അവകാശവാദമാക്കി വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ഗുണസൂചക താരതമ്യവും വാക്ക്–പ്രവൃത്തി, അഭാവം–സാന്നിധ്യം എന്നീ സമാന്തരതകളും നിലനിർത്തി; അതേസമയം അസ്വാഭാവികമായ പദാനുപദ ഘടന പ്രധാനവാചകത്തിൽ ഒഴിവാക്കി.
