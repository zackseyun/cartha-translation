revisions:
- from: 'നിങ്ങൾ പുറമേ കാണുന്നതിനെ നോക്കിയാണ് വിലയിരുത്തുന്നത്.[a] താൻ മശീഹായുടേതാണെന്ന് ഒരാൾക്ക് തന്നെക്കുറിച്ച് ഉറപ്പുണ്ടെങ്കിൽ, അവൻ ഇക്കാര്യം വീണ്ടും ഉള്ളിൽ ചിന്തിക്കട്ടെ: താൻ മശീഹായുടേതായിരിക്കുന്നതുപോലെ ഞങ്ങളും മശീഹായുടേതാണ്.[b]'
  to: 'നിങ്ങൾ പുറമേയുള്ളതിനെ നോക്കുന്നു.[a] താൻ മശീഹായുടേതാണെന്ന് ഒരാൾക്ക് ഉറപ്പുണ്ടെങ്കിൽ, അവൻ ഇക്കാര്യം വീണ്ടും ഉള്ളിൽ ചിന്തിക്കട്ടെ: അവൻ മശീഹായുടേതാണതുപോലെ ഞങ്ങളും മശീഹായുടേതാണ്.[b]'
  rationale: The revision makes the object/content of the person’s confidence explicit, reduces an interpretive expansion in the opening clause, and smooths the Malayalam comparison. It retains the indicative reading, the title «മശീഹാ», and the Greek ambiguity noted in footnote a.
