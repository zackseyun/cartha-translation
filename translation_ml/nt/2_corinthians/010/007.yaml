id: 2CO.10.7
reference: 2 Corinthians 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ml
  text: 'നിങ്ങൾ പുറമേയുള്ളതിനെ നോക്കുന്നു.[a] താൻ മശീഹായുടേതാണെന്ന് ഒരാൾക്ക് ഉറപ്പുണ്ടെങ്കിൽ, അവൻ ഇക്കാര്യം വീണ്ടും ഉള്ളിൽ ചിന്തിക്കട്ടെ: അവൻ മശീഹായുടേതാണതുപോലെ ഞങ്ങളും മശീഹായുടേതാണ്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “നിങ്ങൾ പ്രത്യക്ഷത അനുസരിച്ചുള്ള കാര്യങ്ങൾ നോക്കുന്നു”; അല്ലെങ്കിൽ, “നിങ്ങളുടെ കൺമുന്നിലുള്ളത് നോക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം, “അവൻ മശീഹായുടേതാണ്; അതുപോലെ ഞങ്ങളും.” രണ്ടാം ഭാഗത്തിലെ “മശീഹായുടേതാണ്” എന്നത് ആദ്യഭാഗത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു. ഈ പ്രയോഗം മശീഹായോടുള്ള ബന്ധത്തെയോ അവകാശബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: പുറമേ കാണുന്നത്
  rationale: മുഖത്തിനുമുന്നിലുള്ളത് എന്ന അക്ഷരാർഥത്തെക്കാൾ, ബാഹ്യമായതോ പ്രത്യക്ഷമായതോ എന്ന സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പദപ്രയോഗത്തിലെ യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: βλέπετε
  choice: നോക്കിയാണ് വിലയിരുത്തുന്നത്
  rationale: രൂപത്തിൽ നിർദേശമായും പ്രസ്താവനയായും ഗ്രഹിക്കാവുന്നതാണെങ്കിലും, ശാസനയുടെ സന്ദർഭത്തിൽ ബാഹ്യരൂപത്തെ അടിസ്ഥാനമാക്കി വിധിക്കുന്നുവെന്ന പ്രസ്താവനയായി എടുത്തു. 'വിലയിരുത്തുന്നത്' സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: πέποιθεν ἑαυτῷ
  choice: തന്നെക്കുറിച്ച് ഉറപ്പുണ്ടെങ്കിൽ
  rationale: പൂർണ്ണകാലരൂപം സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ആത്മവിശ്വാസാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Χριστοῦ εἶναι
  choice: മശീഹായുടേതാണ്
  rationale: ജനിറ്റീവ് ഉടമസ്ഥതയെയും ബന്ധത്തെയും നേരിട്ട് സൂക്ഷിക്കുന്നു; Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ 'മശീഹാ' എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: ഇക്കാര്യം വീണ്ടും ഉള്ളിൽ ചിന്തിക്കട്ടെ
  rationale: വീണ്ടും സ്വയം ആലോചിച്ചു കണക്കിലെടുക്കാനുള്ള ആജ്ഞയുടെ വിചിന്തനഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: താൻ മശീഹായുടേതായിരിക്കുന്നതുപോലെ ഞങ്ങളും മശീഹായുടേതാണ്
  rationale: ഗ്രീക്കിലെ രണ്ടാം ഭാഗത്തെ ക്രിയാലോപം മലയാളത്തിൽ പൂരിപ്പിച്ച്, ഇരുകൂട്ടരുടെയും തുല്യമായ ബന്ധാവകാശം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായുടേത്
  alternative: ക്രിസ്തുവിന്റേത് / മശീഹായിൽപ്പെട്ടവൻ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ജനിറ്റീവിന്റെ തുറന്ന ഉടമസ്ഥതാ/ബന്ധഭാവം ഒരു പ്രത്യേക സഭാപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: വാക്യാരംഭം പ്രസ്താവനയോ ആജ്ഞയോ
  choice: ശാസനാത്മക പ്രസ്താവന
  alternative: നിങ്ങളുടെ കൺമുന്നിലുള്ളത് നോക്കുക
  rationale: βλέπετε രൂപപരമായി ഇരുവിധം ഗ്രഹിക്കാമെങ്കിലും, സന്ദർഭം കൊരിന്ത്യർ ബാഹ്യരൂപം നോക്കി വിലയിരുത്തുന്നതിനെ പൗലോസ് ശാസിക്കുന്നുവെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രധാനവാക്യത്തിൽ അർഥസുതാര്യതയ്ക്കായി 'നോക്കിയാണ് വിലയിരുത്തുന്നത്' ഉപയോഗിച്ചു; ഗ്രീക്കിലെ രൂപപരവും ശബ്ദാർഥപരവുമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
