id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: ml
  text: കാരണം, “അവന്റെ കത്തുകൾ ഗൗരവമേറിയതും ശക്തവുമാണ്; എന്നാൽ അവന്റെ ശാരീരിക സാന്നിധ്യം ദുർബലവും സംസാരം നിസ്സാരമായി കണക്കാക്കപ്പെടുന്നതുമാണ്[b]” എന്ന് അവർ പറയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്ന് അവൻ പറയുന്നു.’ ഗ്രീക്കിൽ ‘പറയുന്നു’ എന്ന ക്രിയ ഏകവചനത്തിലാണ്; എന്നാൽ ഇവിടെ അത് പൗലോസിന്റെ വിമർശകരുടെ അഭിപ്രായം ഉദ്ധരിക്കുന്ന പ്രയോഗമായിരിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നിന്ദിക്കപ്പെടുന്നതുമാണ്,’ ‘വിലയില്ലാത്തതായി കണക്കാക്കപ്പെടുന്നതുമാണ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് അടിസ്ഥാനമായ വിമർശനം ഇവിടെ ഉദ്ധരിക്കുന്നതിനാൽ കാരണസൂചകമായ ബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐπιστολαὶ
  choice: കത്തുകൾ
  rationale: സാധാരണ എഴുത്തുകുത്തുകളെയാണ് സൂചിപ്പിക്കുന്നത്; സഭാപരമായ അനാവശ്യ സാങ്കേതികഭാഷ ഒഴിവാക്കുന്നു.
- source_word: μέν ... δὲ
  choice: …; എന്നാൽ …
  rationale: കത്തുകളും നേരിട്ടുള്ള സാന്നിധ്യവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: φησίν
  choice: അവർ പറയുന്നു
  rationale: രൂപത്തിൽ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ പൗലോസിനെ വിമർശിക്കുന്നവരുടെ പ്രചരിച്ച അഭിപ്രായം ഉദ്ധരിക്കുന്ന പ്രയോഗമായി മനസ്സിലാക്കാം; യഥാർത്ഥ ഏകവചനത്തിന് അടിക്കുറിപ്പിൽ ഇടം നൽകിയിരിക്കുന്നു.
- source_word: βαρεῖαι
  choice: ഗൗരവമേറിയത്
  rationale: ‘ഭാരമുള്ളത്’ എന്ന രൂപകത്തിന്റെ ആശയമായ പ്രാധാന്യവും ഗൗരവവും കത്തുകളെക്കുറിച്ചുള്ള സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἰσχυραί
  choice: ശക്തമായത്
  rationale: പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും കത്തുകളുടെ പ്രഭാവത്തെ അമിതമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: παρουσία τοῦ σώματος
  choice: ശാരീരികസാന്നിധ്യം
  rationale: കത്തുകൾക്കു വിപരീതമായി നേരിൽ ഉണ്ടായിരിക്കുമ്പോഴുള്ള പൗലോസിന്റെ ദേഹപരമായ സാന്നിധ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀσθενής
  choice: ദുർബലം
  rationale: ദുർബലതയുടെ കൃത്യസ്വഭാവം നിർണയിക്കാതെ ഗ്രീക്കിലെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: λόγος
  choice: സംസാരം
  rationale: കത്തുകളോടും നേരിട്ടുള്ള സാന്നിധ്യത്തോടുമുള്ള വൈരുധ്യത്തിൽ, പൗലോസിന്റെ വാചികമായ സംസാരത്തെയോ പ്രസംഗരീതിയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐξουθενημένος
  choice: അവഗണിക്കപ്പെടുന്നത്
  rationale: വിലകൽപ്പിക്കപ്പെടാതിരിക്കുകയോ നിസ്സാരമായി കാണപ്പെടുകയോ ചെയ്യുന്ന ബാഹ്യവിലയിരുത്തൽ പ്രകടമാക്കുന്നു; പൗലോസിന്റെ സംസാരത്തിന് സ്വതവേ വിലയില്ലെന്ന വിവർത്തകന്റെ വിധിയായി തോന്നുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിനെക്കുറിച്ചുള്ള വിമർശനം വിവരണകർത്താവിന്റെ അംഗീകാരമായി തോന്നാതിരിക്കുക
  choice: വിമർശകരുടെ വാക്കുകൾ ഉദ്ധരണിചിഹ്നങ്ങൾക്കുള്ളിൽ നൽകി ‘എന്ന് അവർ പറയുന്നു’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘അവൻ പറയുന്നു’ അല്ലെങ്കിൽ ‘പറയപ്പെടുന്നു’
  rationale: വാക്യം പൗലോസിന്റെ യഥാർഥ മൂല്യത്തെക്കുറിച്ചുള്ള ദൈവിക വിധിയല്ല, എതിരാളികളുടെ റിപ്പോർട്ട് ചെയ്ത അഭിപ്രായമാണ്. അതേസമയം φησίν എന്ന ഏകവചനത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശാരീരികസാന്നിധ്യം’ മൂലപാഠത്തിന്റെ രൂപം അടുത്തായി സൂക്ഷിക്കുമ്പോൾ, ‘സംസാരം അവഗണിക്കപ്പെടുന്നത്’ വിമർശകരുടെ വിലയിരുത്തലാണെന്ന ഭാവം നിലനിർത്തുന്നു.
