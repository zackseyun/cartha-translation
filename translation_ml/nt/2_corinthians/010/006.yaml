  source_fidelity: 'ഗ്രീക്കിലെ ഘടകങ്ങൾ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ἐν ἑτοίμῳ ἔχοντες എന്നതിന് “ഞങ്ങൾ ഒരുങ്ങിയിരിക്കുന്നു,” ἐκδικῆσαι എന്നതിന് സന്ദർഭോചിതമായ “ശിക്ഷിക്കാൻ,” πᾶσαν παρακοήν എന്നതിന് “എല്ലാ അനുസരണക്കേടിനെയും,” ὅταν πληρωθῇ എന്നതിന് “പൂർണമാകുമ്പോൾ,” ὑμῶν ἡ ὑπακοή എന്നതിന് “നിങ്ങളുടെ അനുസരണം.” വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവികതയ്ക്കായി മാറിയിട്ടുണ്ടെങ്കിലും, അനുസരണം പൂർണമാകുന്നതും ശിക്ഷണനടപടിക്കുള്ള സന്നദ്ധതയും തമ്മിലെ ഭാവി-സാഹചര്യബന്ധം നിലനിൽക്കുന്നു.'
  naturalness: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ വാചകം വ്യക്തവും മാന്യവുമാണ്. “നിങ്ങളുടെ അനുസരണം പൂർണമാകുമ്പോൾ” എന്ന പ്രയോഗവും “ഞങ്ങൾ ഒരുങ്ങിയിരിക്കുന്നു” എന്ന പ്രയോഗവും സ്വാഭാവികമാണ്. “എല്ലാ അനുസരണക്കേടിനെയും ശിക്ഷിക്കാൻ” എന്നത് അല്പം ഔപചാരികമാണെങ്കിലും ബൈബിൾപരമായ മാന്യരജിസ്റ്ററിന് യോജിച്ചതും വ്യക്തവുമാണ്.
  terminology: “അനുസരണം,” “അനുസരണക്കേട്,” “ശിക്ഷിക്കാൻ” എന്നിവ സന്ദർഭത്തിനും ആധുനിക ബൈബിൾ മലയാളത്തിനും യോജിച്ച പദങ്ങളാണ്. “ശിക്ഷിക്കാൻ” സ്വകാര്യപ്രതികാരത്തിന്റെ ധ്വനി അനാവശ്യമായി ചേർക്കാതെ സന്ദർഭത്തിലെ ശിക്ഷണ/അച്ചടക്കനടപടി നന്നായി നൽകുന്നു. അടിക്കുറിപ്പ് ἐκδικῆσαιയുടെ ‘നീതി നടപ്പാക്കുക/പ്രതികാരം ചെയ്യുക’ എന്ന വിശാലമായ അർഥസാധ്യത സംരക്ഷിക്കുന്നു; b അടിക്കുറിപ്പ് πληρωθῇയുടെ ബദൽ വിവർത്തനങ്ങളും ശരിയായി നൽകുന്നു.
