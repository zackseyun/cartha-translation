id: 2CO.10.6
reference: 2 Corinthians 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: ml
  text: നിങ്ങളുടെ അനുസരണം പൂർണമാകുമ്പോൾ[b], എല്ലാ അനുസരണക്കേടിനെയും ശിക്ഷിക്കാൻ[a] ഞങ്ങൾ ഒരുങ്ങിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ അനുസരണക്കേടിനും നീതി നടപ്പാക്കാൻ” അല്ലെങ്കിൽ “പ്രതികാരം ചെയ്യാൻ.” ഗ്രീക്ക് ക്രിയയ്ക്ക് നീതി നടപ്പാക്കുക, പ്രതികാരം ചെയ്യുക എന്നീ അർഥങ്ങളുണ്ടാകാം; ഇവിടെ സന്ദർഭം ശിക്ഷണനടപടിയെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ അനുസരണം നിറവേറുമ്പോൾ” അല്ലെങ്കിൽ “പൂർത്തിയാകുമ്പോൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: ഞങ്ങൾ ഒരുങ്ങിയിരിക്കുന്നു
  rationale: ‘സന്നദ്ധാവസ്ഥയിൽ ആയിരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു. ഗ്രീക്കിലെ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്നതിനാൽ മലയാളത്തിൽ ‘ഞങ്ങൾ’ എന്നു വ്യക്തമാക്കി.
- source_word: ἐκδικῆσαι
  choice: ശിക്ഷിക്കാൻ
  rationale: ക്രിയയ്ക്ക് പ്രതികാരം ചെയ്യുക, നീതി നടപ്പാക്കുക എന്നീ അർഥസാധ്യതകളുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ അപ്പൊസ്തലിക അധികാരപ്രകാരമുള്ള ശിക്ഷണനടപടിയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. വ്യക്തിപരമായ പ്രതികാരമെന്ന ധ്വനി ഒഴിവാക്കാൻ ‘ശിക്ഷിക്കാൻ’ തിരഞ്ഞെടുത്തു.
- source_word: πᾶσαν παρακοήν
  choice: എല്ലാ അനുസരണക്കേടിനെയും
  rationale: πᾶσαν എന്നതിന്റെ സമഗ്രതയും παρακοή എന്നതിന്റെ അനുസരിക്കാതിരിക്കൽ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘പ്രവൃത്തി’ പോലുള്ള ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത നാമം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὅταν
  choice: ആകുമ്പോൾ
  rationale: സബ്ജങ്ക്റ്റീവിനോടുകൂടിയ ὅταν ഭാവിയിൽ സംഭവിക്കേണ്ട സാഹചര്യം സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘ആകുമ്പോൾ’ സമയപരവും വ്യവസ്ഥാസദൃശവുമായ സൂക്ഷ്മത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πληρωθῇ
  choice: പൂർണമാകുമ്പോൾ
  rationale: അനുസരണം അതിന്റെ പൂർണ അളവിലെത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗം ലളിതവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: നിങ്ങളുടെ അനുസരണം
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതാസംബന്ധം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: എതിർപ്പിനോടുള്ള പൗലൊസിന്റെ ഉദ്ദേശിച്ച പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: സഭാസന്ദർഭത്തിലെ അനുസരണക്കേടിനെതിരായ ശിക്ഷണനടപടി
  alternative: എതിരാളികളോടുള്ള വ്യക്തിപരമായ പ്രതികാരം; ദൈവികമായ അന്ത്യന്യായവിധി
  rationale: സമീപസന്ദർഭം അപ്പൊസ്തലിക അധികാരത്തെയും എതിർപ്പിന്റെ തിരുത്തലിനെയും കുറിച്ചാണ്. അതിനാൽ സ്വകാര്യപ്രതികാരമെന്ന ആശയം ഇറക്കുമതി ചെയ്യാതെ ‘ശിക്ഷിക്കാൻ’ എന്നു വിവർത്തനം ചെയ്തു; എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ വിശാലമായ നീതിനിർവഹണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ പങ്കാളിത്തരൂപം മലയാളത്തിലെ സ്വാഭാവിക പൂർണക്രിയയായി അവതരിപ്പിച്ചെങ്കിലും മുൻസന്ദർഭത്തോടുള്ള ബന്ധം ‘ഒരുങ്ങിയിരിക്കുന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
