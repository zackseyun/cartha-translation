lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: പ്രശംസിക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തം പൊതുവായി ഇങ്ങനെ ചെയ്യുന്ന ഒരാളെ സൂചിപ്പിക്കുന്നു; ഏകവചനവും പൊതുവായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാള സമാനപദം തിരഞ്ഞെടുത്തു.
- source_word: καυχώμενος / καυχάσθω
  choice: പ്രശംസിക്കുന്നവൻ / പ്രശംസിക്കട്ടെ
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു. ‘പ്രശംസിക്കട്ടെ’ മൂന്നാംപുരുഷ ആജ്ഞാർഥത്തിന്റെ ഔപചാരിക ഘടനയും പ്രബോധനശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ἐν
  choice: -യിൽ (കർത്താവിൽ)
  rationale: പ്രശംസയുടെ അടിസ്ഥാനമോ മേഖലയോ സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ ഘടന മലയാളത്തിലെ ‘കർത്താവിൽ’ എന്ന രൂപത്തിൽ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവ് മലയാള പരിഭാഷ. വചനസൂചനയുടെ പശ്ചാത്തലത്തിൽ ഇത് ദൈവത്തെയോ പൗലോസിന്റെ പ്രയോഗത്തിൽ കർത്താവായ യേശുവിനെയോ എങ്ങനെ സൂചിപ്പിക്കുന്നു എന്നത് വിശദീകരിച്ച് തീർപ്പാക്കാതെ വിടുന്നു.
theological_decisions:
- issue: തിരുവെഴുത്തുസൂചനയുടെ പശ്ചാത്തലത്തിൽ ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതൻ
  choice: കർത്താവ്
  alternative: ദൈവം; കർത്താവായ യേശു
  rationale: ഗ്രീക്കിൽ κυρίῳ എന്നു മാത്രമാണുള്ളത്. യിരെമ്യാവിലേക്കുള്ള സൂചനയും പൗലോസിന്റെ ക്രിസ്തുകേന്ദ്രിത പ്രയോഗവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ അനുരണനം നിലനിർത്താൻ സൂചിതനെ പരിഭാഷയിൽ കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രശംസ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ വാഗ്‌വൈഭവം സംരക്ഷിക്കുന്നു; ‘കർത്താവിൽ’ എന്ന പ്രയോഗം ബൈബിൾഭാഷയുടെ ദിഗ്നിത്വം നിലനിർത്തുന്നു.
