translation:
  language: ml
  text: എന്നാൽ കർത്താവിൽ അഭിമാനിക്കുന്നവൻ കർത്താവിൽ അഭിമാനിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പൗലോസ് യിരെമ്യാവ് 9:24-നെ (സെപ്റ്റുവജിന്റിൽ 9:23) പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
