reference: 2 Corinthians 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: ml
  text: പൗലോസ് എന്ന ഞാൻ തന്നെ, മശീഹയുടെ സൗമ്യതയും പരിഗണനയും മുൻനിർത്തി, നിങ്ങളോട് അഭ്യർഥിക്കുന്നു—നിങ്ങളുടെ ഇടയിൽ നേരിൽ ഉണ്ടായിരിക്കുമ്പോൾ താഴ്മയുള്ളവനും[a], അകലെയായിരിക്കുമ്പോൾ നിങ്ങളോടു ധൈര്യമുള്ളവനുമായ ഞാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “താഴ്മയുള്ളവൻ” എന്നത് പൗലോസിനെക്കുറിച്ച് ചിലർ നേരിൽ പറഞ്ഞിരുന്ന കാര്യം പരിഹാസത്തോടെ ആവർത്ത Jenningsുന്നതാകാം; “എളിയവൻ” എന്നും, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി “ഭീരുവായവൻ” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: ഞാൻ പൗലോസ് തന്നെ
  rationale: ആവർത്തിച്ചുള്ള ഗ്രീക്ക് സർവനാമങ്ങൾ പൗലോസിന്റെ വ്യക്തിപരമായ ഊന്നൽ പ്രകടമാക്കുന്നു. മലയാളത്തിൽ ‘ഞാൻ പൗലോസ് തന്നെ’ അതു സ്വാഭാവികമായി നിലനിർത്തുന്നു; δέയ്ക്ക് ഇവിടെ നിർബന്ധമായ വൈരുദ്ധ്യമില്ലാത്തതിനാൽ വേറെ സംയോജകപദം ചേർത്തിട്ടില്ല.
- source_word: παρακαλῶ ὑμᾶς
  choice: നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ παρακαλέω കല്പനയെക്കാൾ earnest ആയ വ്യക്തിപരമായ അപേക്ഷയാണ്; ‘അഭ്യർഥിക്കുന്നു’ അതിന്റെ ആദരപൂർവവും ഗൗരവമുള്ളതുമായ ഭാവം നൽകുന്നു.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: സൗമ്യതയും പരിഗണനയും മുൻനിർത്തി
  rationale: διά + genitive അപേക്ഷയുടെ അടിസ്ഥാനത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു. πραΰτης നിയന്ത്രിതമായ സൗമ്യതയും ἐπιείκεια വഴങ്ങിക്കൊടുക്കുന്ന പരിഗണനയും സൂചിപ്പിക്കുന്നു; ‘മുൻനിർത്തി’ മലയാളത്തിൽ ഈ അടിസ്ഥാനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം സൂക്ഷിക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: κατὰ πρόσωπον
  choice: മുഖാമുഖമായിരിക്കുമ്പോൾ
  rationale: അക്ഷരാർഥത്തിലെ മുഖസംബന്ധിയായ പ്രയോഗവും തുടർന്നുള്ള ἀπών എന്ന അഭാവവുമായുള്ള വൈരുദ്ധ്യവും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘നേരിൽ’ എന്ന അർഥമാണ്.
- source_word: ταπεινὸς
  choice: താഴ്മയുള്ളവൻ
  rationale: ταπεινός എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഇത് പൗലോസിന്റെ യഥാർഥ വിനയമാണോ എതിരാളികളുടെ പരിഹാസപരമായ വിലയിരുത്തലാണോ എന്ന് മുഖ്യവാചകം തീരുമാനിക്കുന്നില്ല.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: അകലെയായിരിക്കുമ്പോൾ നിങ്ങളോടു ധൈര്യമുള്ളവൻ
  rationale: ἀπών എന്ന സാഹചര്യപങ്കാളിയെ കാലസൂചനയായി സ്വാഭാവികമാക്കി. θαρρέωയുടെ ധൈര്യവും εἰς ὑμᾶς എന്ന ദിശാസംബന്ധവും സൂക്ഷിക്കുന്നു; ‘നിങ്ങൾക്കെതിരെ’ എന്നു പറഞ്ഞ് ശത്രുത ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം വിവർത്തനത്തിൽ പ്രകടമാക്കി.
- issue: പൗലോസിന്റെ ταπεινός എന്ന സ്വയംവിവരണത്തിന്റെ ഭാവം
  choice: താഴ്മയുള്ളവൻ എന്ന തുറന്ന അർഥം നിലനിർത്തി; സാധ്യതയുള്ള പരിഹാസഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: ഭീരുവായവൻ
  rationale: വാക്യം എതിരാളികളുടെ ആരോപണം പ്രതിധ്വനിപ്പിക്കുന്നതാകാം, എന്നാൽ ഗ്രീക്ക് വാചകം അത് വ്യക്തമായി ഉദ്ധരണിയായി അടയാളപ്പെടുത്തുന്നില്ല. ‘ഭീരു’ എന്നു വിവർത്തനം ചെയ്യുന്നത് വ്യാഖ്യാനം ഉറപ്പിച്ചുകളയും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ഊന്നൽ, നേരിൽ/അകലെയായിരിക്കുമ്പോൾ എന്ന വൈരുദ്ധ്യം, പൗലോസിന്റെ സ്വയംവിവരണത്തിലെ സാധ്യതയുള്ള പരിഹാസം എന്നിവ സംരക്ഷിച്ചു.
