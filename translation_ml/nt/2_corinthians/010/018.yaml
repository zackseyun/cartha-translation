id: 2CO.10.18
reference: 2 Corinthians 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: ml
  text: കാരണം, തന്നെത്തന്നെ ശുപാർശ[a] ചെയ്യുന്നവനല്ല അംഗീകരിക്കപ്പെട്ടവൻ; കർത്താവ് ശുപാർശ ചെയ്യുന്നവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്നെത്തന്നെ പ്രശംസിക്കുന്നവൻ’ … ‘കർത്താവ് പ്രശംസിക്കുന്നവൻ.’ രണ്ടിടത്തും ഒരേ ഗ്രീക്ക് ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: പ്രശംസിക്കുന്ന / പ്രശംസിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ഒരാളെ അനുകൂലമായി അവതരിപ്പിക്കുകയോ അംഗീകാരത്തിനായി ഉയർത്തിക്കാട്ടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പ്രശംസിക്കുക’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമാണ്; മൂലപാഠത്തിലെ അതേ ക്രിയയുടെ ആവർത്തനം ഇരുവിടത്തും ഒരേ പദം ഉപയോഗിച്ച് നിലനിർത്തി.
- source_word: δόκιμος
  choice: അംഗീകൃതൻ
  rationale: പരിശോധനയിലോ വിലയിരുത്തലിലോ അംഗീകാരം നേടിയ വ്യക്തിയെയാണ് പദം സൂചിപ്പിക്കുന്നത്. സ്വയം പ്രശംസിക്കുന്നതും കർത്താവിന്റെ പ്രശംസ ലഭിക്കുന്നതും തമ്മിലുള്ള വൈരുധ്യത്തിന് ‘അംഗീകൃതൻ’ യോജിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ശീർഷകം പതിവായ മലയാളരൂപത്തിൽ വിവർത്തനം ചെയ്തു; ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മുഖ്യപാഠത്തിൽ കൂടുതൽ വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: ἑαυτὸν
  choice: തന്നെത്തന്നെ
  rationale: പ്രതിനിധിയായ ഏകവചന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ആത്മവാചക സർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὃν
  choice: പ്രശംസിക്കുന്നവൻ
  rationale: മലയാളത്തിലെ ബന്ധവാക്യഘടനയിൽ ‘കർത്താവ് പ്രശംസിക്കുന്നവൻ’ എന്ന രൂപം ഗ്രീക്കിലെ വ്യക്തിവാചക വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തെ വിശദീകരിക്കുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ കാരണവിശദീകരണ സ്വഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ κύριος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി.
  alternative: ‘കർത്താവായ യേശു’ അല്ലെങ്കിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കുക.
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് സാധാരണയായി യേശുവിനെ സൂചിപ്പിക്കാമെങ്കിലും, ഈ വാക്യം κύριος എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ പാഠത്തിലെ സൂചിതവ്യക്തിയെ വിവർത്തനത്തിൽ അനാവശ്യമായി നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ‘അല്ല … എന്നാൽ’ എന്ന ശക്തമായ വൈരുധ്യവും ഒരേ ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
