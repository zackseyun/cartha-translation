    issue: The main text uses ‘പ്രശംസിക്കുന്ന’ for συνιστάνων / συνίστησιν.
    rationale: Although ‘praise’ can overlap with commendation, the Greek verb here concerns presenting or recommending someone as worthy of approval. ‘ശുപാർശ ചെയ്യുന്ന’ better retains that evaluative sense and the parallel with the Lord’s commendation.
  - severity: low
    issue: The footnote’s stated alternative is identical in sense to a more source-precise main-text rendering.
    rationale: Once ‘ശുപാർശ’ is used in the main text, the lexical alternative should instead identify ‘പ്രശംസിക്കുക’ as the alternative.
