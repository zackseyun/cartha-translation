id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: ml
  text: തങ്ങളെത്തന്നെ പ്രശംസിക്കുന്ന ചിലരുടെ കൂട്ടത്തിൽ ഞങ്ങളെത്തന്നെ ഉൾപ്പെടുത്താനോ അവരോടു ഞങ്ങളെത്തന്നെ താരതമ്യം ചെയ്യാനോ ഞങ്ങൾ ധൈര്യപ്പെടുന്നില്ല[a]. എന്നാൽ അവർ തങ്ങളിൽത്തന്നെ തങ്ങളെത്തന്നെ അളക്കുകയും തങ്ങളെത്തന്നെ തങ്ങളോടുതന്നെ താരതമ്യം ചെയ്യുകയും ചെയ്യുന്നു; അവർ മനസ്സിലാക്കുന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവരോടൊപ്പം ഞങ്ങളെത്തന്നെ നിരത്താനോ”; ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം മറ്റുള്ളവരുടെ അതേ വിഭാഗത്തിൽ സ്വയം ഉൾപ്പെടുത്തുക എന്ന ആശയം നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “തങ്ങളിൽത്തന്നെ തങ്ങളെത്തന്നെ അളക്കുകയും തങ്ങളെത്തന്നെ തങ്ങളോടുതന്നെ താരതമ്യം ചെയ്യുകയും ചെയ്യുന്നു.” അവർ സ്വയംതന്നെ സ്വന്തം മാനദണ്ഡമാക്കുന്നു എന്നതാണ് ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: ഞങ്ങൾ ധൈര്യപ്പെടുന്നില്ല
  rationale: പ്രസ്തുത പ്രവൃത്തി ചെയ്യാനുള്ള മടിയും അതിനുള്ള അവകാശം സ്വയം ഏറ്റെടുക്കാതിരിക്കുന്നതും സൂചിപ്പിക്കുന്നു; പൗലോസിന്റെ പരിഹാസധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐγκρῖναι
  choice: ചിലരോടൊപ്പം ഞങ്ങളെത്തന്നെ ഗണിക്കാൻ
  rationale: ലളിതമായി വിധിക്കുക എന്നതിലുപരി, മറ്റുള്ളവരുടെ അതേ വിഭാഗത്തിലോ നിരയിലോ സ്വയം ഉൾപ്പെടുത്തുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: താരതമ്യം ചെയ്യാൻ / താരതമ്യം ചെയ്യുകയും
  rationale: രണ്ടിടത്തും ഒരേ പദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ വാക്ചാതുര്യപരമായ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: തങ്ങളെത്തന്നെ പ്രശംസിക്കുന്ന
  rationale: ഇവിടെ συνίστημι സ്വയം അനുകൂലമായി അവതരിപ്പിക്കുകയോ ശുപാർശ ചെയ്യുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഈ ഭാഗത്തെ സ്വയം പ്രശംസ എന്ന പ്രമേയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες
  choice: തങ്ങളെത്തന്നെ മാനദണ്ഡമാക്കി അളക്കുകയും
  rationale: അക്ഷരാർഥമായ അളക്കൽ രൂപകം സംരക്ഷിക്കുമ്പോൾ, അവർ സ്വയം തന്നെയാണ് മൂല്യനിർണയത്തിന്റെ മാനദണ്ഡമാക്കുന്നത് എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: തങ്ങളോടുതന്നെ താരതമ്യം ചെയ്യുകയും
  rationale: ആവർത്തിച്ചുള്ള ആത്മവാചക സർവനാമങ്ങളുടെ ഊന്നൽ നിലനിർത്തി, സ്വയം ആശ്രയിച്ച താരതമ്യത്തെ വ്യക്തമാക്കുന്നു.
- source_word: οὐ συνιᾶσιν
  choice: അവർക്ക് വിവേകമില്ല
  rationale: ഗ്രഹിക്കാതിരിക്കുക, ഉൾക്കാഴ്ചയില്ലാതിരിക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: οὐ συνιᾶσιν എന്നതിൽ സൂചിപ്പിക്കപ്പെട്ടിരിക്കുന്ന കർമം
  choice: അവർക്ക് വിവേകമില്ല
  alternative: അവർ മനസ്സിലാക്കുന്നില്ല
  rationale: അവർ കൃത്യമായി എന്താണ് മനസ്സിലാക്കാത്തതെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അവരുടെ സ്വയം-മാനദണ്ഡത്തിന്റെ വിഡ്ഢിത്തം എന്നൊരു കർമം വാചകത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ മലയാളം. ‘ഗണിക്കുക’, ‘മാനദണ്ഡം’, ‘വിവേകം’ എന്നീ പദങ്ങൾ ആശയകൃത്യതയും സ്വാഭാവികതയും തമ്മിൽ തുലനം ചെയ്യുന്നു; ഗ്രീക്കിലെ ആത്മവാചക ആവർത്തനം സാധ്യമാകുന്നത്ര നിലനിർത്തിയിരിക്കുന്നു.
