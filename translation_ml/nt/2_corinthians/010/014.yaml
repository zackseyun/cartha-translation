id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: ml
  text: ഞങ്ങൾ ഞങ്ങളെത്തന്നെ പരിധിക്കപ്പുറം നീട്ടുന്നില്ല, ഞങ്ങൾ നിങ്ങളിലേക്കു എത്തിയിട്ടില്ലാത്തവരെപ്പോലെ; കാരണം, മശീഹയുടെ സുവിശേഷവുമായി ഞങ്ങൾ നിങ്ങളോളംപോലും എത്തി—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: ഞങ്ങളെത്തന്നെ പരിധിക്കപ്പുറം നീട്ടുകയല്ല
  rationale: അർഹമായ പരിധിക്കപ്പുറം സ്വയം നീട്ടുക എന്ന മൂലഭാഷയിലെ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി ഗ്രഹിക്കാനും കഴിയും.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: ഞങ്ങൾ നിങ്ങളിലേക്കു എത്താത്തവരെപ്പോലെ
  rationale: കൊരിന്ത്യരിലേക്കു തങ്ങളുടെ ശുശ്രൂഷ എത്തിയിട്ടില്ലെന്ന സാങ്കൽപ്പിക അടിസ്ഥാനത്തിലാണ് പരിധിലംഘനമെന്ന ആരോപണം സാധുവാകുക എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: കാരണം, ... ഞങ്ങൾ നിങ്ങളിലേക്കും എത്തി
  rationale: ἐφθάσαμεν സൂചിപ്പിക്കുന്ന പൂർത്തിയായ എത്തിച്ചേരൽ പ്രകടമാക്കുകയും καί നൽകുന്ന ഊന്നൽ ‘നിങ്ങളിലേക്കും’ എന്നതിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: സുവിശേഷവുമായി
  rationale: സുവിശേഷപ്രഘോഷണവുമായി ബന്ധപ്പെട്ടോ അതിന്റെ മാർഗത്തിലൂടെയോ അവർ എത്തിയെന്ന ἐν എന്ന പദത്തിന്റെ സാഹചര്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം സജീവമാണ്; ‘മശീഹ’ അത് നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῦ Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ‘മശീഹയുടെ സുവിശേഷം’ എന്ന പ്രയോഗത്തിൽ Χριστός ഒരു സ്ഥാനപ്പേരായി അർഥവത്തായതിനാൽ ‘മശീഹ’ തെരഞ്ഞെടുത്തു; ഇത് സുവിശേഷം മശീഹയെ സംബന്ധിച്ചതോ അവന്റേതോ എന്ന ജനിറ്റീവ് ബന്ധത്തിന്റെ സ്വാഭാവിക വ്യാപ്തി നിർബന്ധമായി ചുരുക്കുന്നില്ല.
- issue: τοῦ Χριστοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: ‘മശീഹയുടെ’ എന്ന തുറന്ന ജനിറ്റീവ് രൂപം
  alternative: ‘മശീഹയെക്കുറിച്ചുള്ള’ അല്ലെങ്കിൽ ‘മശീഹയിൽനിന്നുള്ള’
  rationale: മൂലപാഠം സുവിശേഷം മശീഹയെക്കുറിച്ചുള്ളതാണോ അവന്റേതാണോ എന്ന ബന്ധം ഇവിടെ കൃത്യമായി നിർണ്ണയിക്കുന്നില്ല; മലയാളത്തിലെ ജനിറ്റീവ് ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. ‘പരിധിക്കപ്പുറം നീട്ടുക’ എന്ന രൂപകം പൗലോസിന്റെ വാദത്തിലെ ശുശ്രൂഷാപരിധി എന്ന ആശയം സംരക്ഷിക്കുന്നു.
