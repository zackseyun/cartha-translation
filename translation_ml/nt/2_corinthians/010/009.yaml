  yaml_path: translation/nt/2_corinthians/010/009.yaml
  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: ml
  text: കത്തുകളിലൂടെ നിങ്ങളെ ഭയപ്പെടുത്താൻ ഞാൻ ശ്രമിക്കുന്നതുപോലെ തോന്നാതിരിക്കാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μὴ
  choice: തോന്നാതിരിക്കാനാണ്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ἵναയും നിഷേധമായ μήയും ചേർന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ ഉദ്ദേശ്യാർഥകമായി അവതരിപ്പിക്കുന്നു.
- source_word: δόξω
  choice: ഞാൻ തോന്നുക
  rationale: ഇവിടെ δοκέω എന്നതിന് ‘ചിന്തിക്കുക’ എന്നല്ല, ‘തോന്നുക/കാണപ്പെടുക’ എന്ന അർഥമാണ്.
- source_word: ὡς ἂν
  choice: —തായി
  rationale: ‘എന്നപോലെ/എന്ന മട്ടിൽ’ എന്ന താരതമ്യഭാവം മലയാളത്തിലെ ‘—തായി തോന്നുക’ എന്ന സ്വാഭാവിക ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐκφοβεῖν
  choice: ഭയപ്പെടുത്താൻ ശ്രമിക്കുക
  rationale: ക്രിയ ശക്തമായി ഭയപ്പെടുത്തുക അഥവാ വിരട്ടുക എന്നർഥം നൽകുന്നു. δοκέωയോടുള്ള ബന്ധം സ്വാഭാവികമാക്കാൻ ‘ശ്രമിക്കുക’ ചേർത്തിരിക്കുന്നു; ‘ഭീതിയിലാഴ്ത്തുക’ എന്നതിനെക്കാൾ ഇത് അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: ἐκφοβεῖν എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: കത്തുകളിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മാർഗം/ഉപാധി സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ ‘എന്റെ’ എന്ന ഉടമസ്ഥപദം ഇല്ലാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല; നിർദിഷ്ടമായ കത്തുകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
theological_decisions: []
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ഗ്രീക്ക് വാക്യം മുൻസന്ദർഭത്തെ ആശ്രയിക്കുന്ന ഉദ്ദേശ്യവാക്യമാണെന്ന സ്വഭാവം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധത്തിനായി ‘ഇത്’ ഉപയോഗിച്ചു.
