  source_fidelity: മുഖ്യപാഠം εἰς τὰ ὑπερέκεινα ὑμῶν എന്ന പ്രയോഗത്തെ “നിങ്ങൾക്കപ്പുറമുള്ള പ്രദേശങ്ങളിൽ” എന്നു വിശ്വസ്തമായി നൽകുന്നു. εὐαγγελίσασθαι-യുടെ ദൗത്യലക്ഷ്യവും, ἐν ἀλλοτρίῳ κανόνι എന്നതിലെ മറ്റൊരാളുടേതായ നിയത പ്രവർത്തനപരിധിയും, εἰς τὰ ἕτοιμα-യുടെ സംക്ഷിപ്തവും പൊതുവായതുമായ ‘ഇതിനകം ഒരുക്കിവെച്ച കാര്യങ്ങൾ’ എന്ന അർഥവും കൃത്യമായി നിലനിൽക്കുന്നു. καυχήσασθαι-യ്ക്ക് “വീമ്പുപറയാതിരിക്കാനും” യോജിച്ചതാണ്.
