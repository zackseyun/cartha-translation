id: 2CO.10.16
reference: 2 Corinthians 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: ml
  text: നിങ്ങൾക്കപ്പുറമുള്ള പ്രദേശങ്ങളിൽ സുവാർത്ത അറിയിക്കാനും[a], മറ്റൊരാളുടെ പ്രവർത്തനമേഖലയിൽ[b] ഇതിനകം ഒരുക്കിവെച്ച കാര്യങ്ങളെക്കുറിച്ച് വീമ്പുപറയാതിരിക്കാനും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങൾക്കപ്പുറമുള്ള ദേശങ്ങളിൽ സുവിശേഷം പ്രസംഗിക്കാനും.”'
    reason: lexical_alternative
  - marker: b
    text: “പ്രവർത്തനമേഖല” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം κανών ആണ്. ഇവിടെ അത് ഒരാൾക്കു നിശ്ചയിക്കപ്പെട്ട ശുശ്രൂഷാപരിധിയെയോ പ്രവർത്തനപ്രദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ധാർമികമായ “നിയമം” എന്നോ പിന്നീടുള്ള “കാനോൻ” എന്നോ ഉള്ള അർഥത്തിലല്ല.
    reason: cultural_note
  - marker: c
    text: 'മറ്റൊരു സാധ്യത: “മറ്റൊരാളുടെ പ്രവർത്തനമേഖലയിൽ ഇതിനകം ചെയ്തുതീർത്തതിനെക്കുറിച്ച് വീമ്പുപറയാതിരിക്കാനും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: നിങ്ങൾക്കപ്പുറമുള്ള പ്രദേശങ്ങളിൽ
  rationale: ὑπερέκεινα എന്നത് ഒരു നിർദിഷ്ട സ്ഥാനത്തിന് അപ്പുറമുള്ള പ്രദേശങ്ങളെ സൂചിപ്പിക്കുന്നു; ὑμῶν കൊരിന്ത്യരെ ആപേക്ഷികസ്ഥാനമായി നിലനിർത്തുന്നു.
- source_word: εὐαγγελίσασθαι
  choice: സുവാർത്ത അറിയിക്കാനും
  rationale: പൗലോസിന്റെ മിഷനറി ലക്ഷ്യമായ സുവാർത്താഘോഷണത്തെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ἀλλοτρίῳ κανόνι
  choice: മറ്റൊരാളുടെ പ്രവർത്തനമേഖലയിൽ
  rationale: ഇവിടെ κανών ധാർമികനിയമത്തെയോ പിന്നീടുള്ള ‘കാനോൻ’ എന്ന ആശയത്തെയോ അല്ല, മറ്റൊരാൾക്കു ബന്ധപ്പെട്ട സേവനപരിധിയെയോ പ്രവർത്തനമേഖലയെയോ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὰ ἕτοιμα
  choice: ഇതിനകം ഒരുക്കിവെച്ച കാര്യങ്ങളെക്കുറിച്ച്
  rationale: ἕτοιμα നപുംസകലിംഗ ബഹുവചന നാമവൽക്കൃത വിശേഷണമായതിനാൽ ‘ഒരുക്കിവെച്ച കാര്യങ്ങൾ’ എന്ന താരതമ്യേന അക്ഷരാർഥമുള്ള പ്രയോഗം നിലനിർത്തുന്നു; മറ്റുള്ളവർ പൂർത്തിയാക്കിയ പ്രവർത്തനം എന്ന സന്ദർഭസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καυχήσασθαι
  choice: വീമ്പുപറയാതിരിക്കാനും
  rationale: ചുറ്റുമുള്ള വാക്യങ്ങളിലെ പൗലോസിന്റെ ആവർത്തിതമായ ‘boast’ ആശയത്തിന്റെ ശക്തിയും വിമർശനാത്മക ഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ശുശ്രൂഷാസന്ദർഭത്തിൽ κανών എന്നതിന്റെ അർഥം
  choice: പ്രവർത്തനമേഖല അഥവാ ഏല്പിക്കപ്പെട്ട ശുശ്രൂഷാപരിധി
  alternative: നിയമം, മാനദണ്ഡം, കാനോൻ
  rationale: 2 കൊരിന്ത്യർ 10:13–15-ൽ അളന്ന പരിധികളെയും പ്രവർത്തനമേഖലകളെയും കുറിച്ചാണ് പറയുന്നത്; അതിനാൽ പിന്നീടുള്ള തിരുവെഴുത്തുപട്ടിക എന്ന അർഥമോ ധാർമികനിയമം എന്ന അർഥമോ ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: τὰ ἕτοιμα എന്നതിന്റെ സൂചന
  choice: ഇതിനകം ഒരുക്കിവെച്ച കാര്യങ്ങൾ
  alternative: മറ്റുള്ളവർ ഇതിനകം ചെയ്തുതീർത്ത പ്രവർത്തനം
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ മറ്റുള്ളവർ നടത്തിയ ശുശ്രൂഷാഫലമായിരിക്കാമെന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന ഗ്രീക്ക് അനന്തക്രിയാരൂപങ്ങൾ മലയാളത്തിൽ “-ആനും / -ാതിരിക്കാനും” എന്ന സമാന്തരഘടനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
