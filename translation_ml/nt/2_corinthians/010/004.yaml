  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞങ്ങളുടെ യുദ്ധായുധങ്ങൾ ജഡികമായവയല്ല[a]; മറിച്ച്, കോട്ടകളെ ഇടിച്ചുനിരത്തുന്നതിനായി ദൈവസന്നിധിയിൽ ശക്തിയുള്ളവയാണ്[b]—ഞങ്ങൾ വാദങ്ങളെ[c] ഇടിച്ചുനിരത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജഡത്തിൽനിന്നുള്ളവയല്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്താൽ ശക്തിയുള്ളവ’ അല്ലെങ്കിൽ ‘ദൈവികശക്തിയുള്ളവ.’
