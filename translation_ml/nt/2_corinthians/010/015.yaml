revisions:
- from: മറ്റുള്ളവരുടെ അധ്വാനത്തെ ആശ്രയിച്ച് പരിധിക്കപ്പുറം പ്രശംസിക്കാതെ, നിങ്ങളുടെ വിശ്വാസം വളരുമ്പോൾ, ഞങ്ങൾക്കു നിശ്ചയിച്ച പ്രവർത്തനമേഖലയ്ക്കനുസരിച്ച്[a] നിങ്ങളുടെ ഇടയിൽ ഞങ്ങളുടെ പ്രവർത്തനം കൂടുതൽ വ്യാപിക്കുമെന്ന[b] പ്രത്യാശയാണു ഞങ്ങൾക്കുള്ളത്[c].
  to: മറ്റുള്ളവരുടെ അധ്വാനത്തെ അടിസ്ഥാനമാക്കി പരിധിക്കപ്പുറം അഭിമാനിച്ചുപറയാതെ, നിങ്ങളുടെ വിശ്വാസം വളരുമ്പോൾ, ഞങ്ങൾക്കു നിശ്ചയിച്ച പ്രവർത്തനമേഖലയ്ക്കനുസരിച്ച്[a] നിങ്ങളുടെ ഇടയിൽ ഞങ്ങളുടെ പ്രവർത്തനം കൂടുതൽ വ്യാപിക്കുമെന്ന[b] പ്രത്യാശയാണു ഞങ്ങൾക്കുള്ളത്[c].
  rationale: The revision corrects the semantic mismatch in the phrase about others’ labors and uses a more exact modern Malayalam equivalent for boasting. It retains the draft’s contextually sound rendering of μεγαλυνθῆναι as expansion of apostolic work, while the footnote preserves the literal passive expression and the syntactic ambiguity of ἐν ὑμῖν.
