id: 2CO.10.15
reference: 2 Corinthians 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: ml
  text: മറ്റുള്ളവരുടെ അധ്വാനത്തെ അടിസ്ഥാനമാക്കി പരിധിക്കപ്പുറം അഭിമാനിച്ചുപറയാതെ, നിങ്ങളുടെ വിശ്വാസം വളരുമ്പോൾ, ഞങ്ങൾക്കു നിശ്ചയിച്ച പ്രവർത്തനമേഖലയ്ക്കനുസരിച്ച്[a] നിങ്ങളുടെ ഇടയിൽ ഞങ്ങളുടെ പ്രവർത്തനം കൂടുതൽ വ്യാപിക്കുമെന്ന[b] പ്രത്യാശയാണു ഞങ്ങൾക്കുള്ളത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞങ്ങളുടെ അളവനുസരിച്ച്’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ പരിധിക്കനുസരിച്ച്.’ ഗ്രീക്കിലെ κανών ഇവിടെ അളന്നുനൽകപ്പെട്ട പ്രവർത്തനമേഖലയെയോ പരിധിയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘നിങ്ങളുടെ ഇടയിൽ ഞങ്ങൾ മഹത്താക്കപ്പെടുക.’ ഇവിടെ പൗലോസിന്റെ വ്യക്തിപരമായ മഹത്ത്വത്തേക്കാൾ അദ്ദേഹത്തിന്റെ അപ്പൊസ്തലിക പ്രവർത്തനം വ്യാപിക്കുന്നതാണ് സന്ദർഭാർഥം. ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നത് ‘നിങ്ങളുടെ വിശ്വാസം വളരുമ്പോൾ’ എന്നതിനോടും ബന്ധിപ്പിക്കാവുന്നതാണ്.
    reason: alternative_reading
  - marker: c
    text: അഥവാ, ‘വളരെയധികം’ അല്ലെങ്കിൽ ‘ഇനിയും വിപുലമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: പരിധിക്കപ്പുറം പ്രശംസിക്കാതെ
  rationale: അളവിന്റെയും അതിരിന്റെയും രൂപകം നിലനിർത്തിക്കൊണ്ട്, തന്റെ അവകാശവാദം നിശ്ചിത പരിധിക്കപ്പുറം നീട്ടുന്നില്ല എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: മറ്റുള്ളവരുടെ അധ്വാനത്തെ ആശ്രയിച്ച്
  rationale: മറ്റുള്ളവർ ചെയ്ത കഠിനപ്രവർത്തനത്തിന്റെ നേട്ടം സ്വന്തമാക്കി പ്രശംസിക്കുന്നതാണു പ്രസക്തമായ ആശയം. ‘അധ്വാനം’ κόπος എന്ന പദത്തിന്റെ പ്രയത്നഭാവം നിലനിർത്തുന്നു.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസം വളരുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കാലപരവും സാഹചര്യപരവുമായ സ്വാഭാവിക ഉപവാക്യമായി നൽകി; πίστις ഇവിടെ ‘വിശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: നിങ്ങളുടെ ഇടയിൽ ഞങ്ങളുടെ പ്രവർത്തനം കൂടുതൽ വ്യാപിക്കുക
  rationale: വാക്യക്രമത്തിൽ ἐν ὑμῖν μεγαλυνθῆναι എന്നതിനോടു ചേർന്ന് നിൽക്കുന്നു. സന്ദർഭം അപ്പൊസ്തലിക പ്രവർത്തനമേഖലയുടെ വികസനമായതിനാൽ, അക്ഷരാർഥത്തിലുള്ള ‘ഞങ്ങൾ വലുതാക്കപ്പെടുക’ എന്ന അസ്വാഭാവിക പ്രയോഗത്തിനുപകരം സന്ദർഭാർഥം വ്യക്തമാക്കി.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: ഞങ്ങൾക്കു നിശ്ചയിച്ച പ്രവർത്തനമേഖലയ്ക്കനുസരിച്ച്
  rationale: κανών ഇവിടെ പിൽക്കാലത്തെ ‘കാനോൻ’ എന്ന സാങ്കേതിക അർഥത്തിലല്ല, അളന്നുനൽകപ്പെട്ട പ്രവർത്തനപരിധിയെയോ മേഖലയെയോ സൂചിപ്പിക്കുന്നു; മുൻസന്ദർഭത്തിലെ ദൈവനിയോഗത്തിന്റെ ആശയം ‘നിശ്ചയിച്ച’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: εἰς περισσείαν
  choice: കൂടുതൽ
  rationale: വലിയ തോതിലേക്കോ കൂടുതൽ വ്യാപ്തിയിലേക്കോ ഉള്ള നീക്കമാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്; ‘കൂടുതൽ വ്യാപിക്കുക’ മലയാളത്തിൽ അതിന്റെ ദിശാബോധം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: μεγαλυνθῆναι എന്നതിന്റെ അർഥവും അപ്പൊസ്തലിക അധികാരവുമായുള്ള ബന്ധവും
  choice: പൗലോസിന്റെയും കൂട്ടാളികളുടെയും പ്രവർത്തനം കൊരിന്ത്യരുടെ ഇടയിൽ കൂടുതൽ വ്യാപിക്കുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: അവർ കൊരിന്ത്യരുടെ ഇടയിൽ കൂടുതൽ ബഹുമാനിക്കപ്പെടുകയോ മഹത്ത്വപ്പെടുത്തപ്പെടുകയോ ചെയ്യുക.
  rationale: 10:13–16-ലെ സന്ദർഭം മറ്റുള്ളവരുടെ അധ്വാനത്തിൽ പ്രശംസിക്കാതെ ദൈവം അളന്നുനൽകിയ പ്രവർത്തനമേഖലയിൽ മുന്നേറുന്നതിനെക്കുറിച്ചാണ്. എങ്കിലും ക്രിയയുടെ ‘മഹത്താക്കപ്പെടുക’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἐν ὑμῖν എന്നതിന്റെ വാക്യബന്ധം
  choice: ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നത് μεγαλυνθῆναι-യുമായി, അതായത് പ്രവർത്തനം വ്യാപിക്കുന്നതുമായി ബന്ധിപ്പിച്ചു.
  alternative: ‘നിങ്ങളുടെ വിശ്വാസം നിങ്ങളുടെ ഇടയിൽ വളരുമ്പോൾ’ എന്നു πίστεως-നോട് ബന്ധിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പദക്രമത്തിൽ ἐν ὑμῖν μεγαλυνθῆναι അടുത്തടുത്തായി വരുന്നതും വിശ്വാസം ഇതിനകം ‘നിങ്ങളുടെ’ എന്നു വിശേഷിപ്പിക്കപ്പെട്ടിരിക്കുന്നതും ഈ ബന്ധത്തിന് അനുകൂലമാണ്; മറുവായന വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: κανών എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ദൈവം നിശ്ചയിച്ച പ്രവർത്തനമേഖല.
  alternative: നിയമം, മാനദണ്ഡം, അല്ലെങ്കിൽ അളവ്.
  rationale: ഈ അധ്യായത്തിലെ അളവ്, അതിർ, മറ്റുള്ളവരുടെ പ്രവർത്തനമേഖല എന്നിവയെക്കുറിച്ചുള്ള വാദത്തിൽ ഭൂമിശാസ്ത്രപരവും ശുശ്രൂഷാപരവുമായ നിയോഗമേഖലയാണ് ഉദ്ദേശിക്കുന്നത്; പിൽക്കാലത്തെ ഗ്രന്ഥസമുച്ചയമായ ‘കാനോൻ’ ഇവിടെ പ്രസക്തമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ ശൈലി സ്വീകരിച്ചു. നീണ്ട ഗ്രീക്ക് പങ്കുപദഘടന മലയാളത്തിൽ ഒറ്റ സമഗ്രവാക്യമായി നിലനിർത്തി. ‘പ്രശംസിക്കുക,’ ‘വിശ്വാസം,’ ‘പ്രവർത്തനമേഖല’ എന്നീ പദങ്ങൾ സമീപസന്ദർഭത്തിലെ അളവ്–അതിർ–വ്യാപനം എന്ന രൂപകശൃംഖല സംരക്ഷിക്കുന്നു.
