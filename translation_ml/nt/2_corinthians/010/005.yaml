id: 2CO.10.5
reference: 2 Corinthians 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: ml
  text: ദൈവത്തെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിനെതിരെ ഉയർന്നുനിൽക്കുന്ന എല്ലാറ്റിനെയും[a], ഓരോ ചിന്തയെയും മശീഹായോടുള്ള[b] അനുസരണത്തിലേക്കു തടവിലാക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിനെതിരെ ഉയർത്തപ്പെട്ടിരിക്കുന്ന എല്ലാ ഉന്നതവസ്തുവിനെയും’; അല്ലെങ്കിൽ ‘എല്ലാ അഹങ്കാരവാദത്തെയും.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘മശീഹായുടെ’ (ജനിറ്റീവ് രൂപം); പരമ്പരാഗതമായി ‘ക്രിസ്തുവിന്റെ.’
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: എല്ലാ ഉന്നതിയെയും
  rationale: ὕψωμα എന്നത് ഉയർത്തപ്പെട്ടതോ ഉന്നതമായി നിലകൊള്ളുന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ രൂപകം നിലനിർത്തുകയും അതിനെ ‘അഹങ്കാരവാദം’ എന്ന മാനസിക അർഥത്തിലേക്കു മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; πᾶν എന്നതിന്റെ വിതരണാർഥം ‘എല്ലാ’ എന്നു പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐπαιρόμενον
  choice: ഉയർന്നുനിൽക്കുന്ന
  rationale: ഉയർത്തപ്പെടുക, പൊങ്ങിനിൽക്കുക എന്ന ദൃശ്യരൂപം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘സ്വയം ഉയർത്തുന്ന’ എന്ന പ്രത്യാവർത്തക അർഥം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: ദൈവത്തെക്കുറിച്ചുള്ള പരിജ്ഞാനത്തിനെതിരെ
  rationale: γνῶσις എന്നതിന്റെ അറിവ്/പരിജ്ഞാനം എന്ന അർഥവും κατά എന്നതിന്റെ എതിർപ്പും വ്യക്തമാക്കുന്നു. τοῦ θεοῦ ഇവിടെ ദൈവത്തെ അറിയുന്നതും ദൈവത്തെക്കുറിച്ചുള്ള യഥാർഥ പരിജ്ഞാനവും ഉൾക്കൊള്ളാവുന്ന ബന്ധമായി നിലനിൽക്കുന്നു.
- source_word: αἰχμαλωτίζοντες
  choice: തടവിലാക്കുകയും ചെയ്യുന്നു
  rationale: യുദ്ധത്തടവുകാരനായി പിടിക്കുക എന്ന സൈനികരൂപകം നിലനിർത്തുന്നു; മുൻവാക്യത്തിൽ ആരംഭിച്ച പ്രവർത്തനത്തിന്റെ തുടർച്ചയും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ അറിയിക്കുന്നു.
- source_word: πᾶν νόημα
  choice: ഓരോ ചിന്തയെയും
  rationale: νόημα ചിന്ത, ധാരണ, മനോഭാവം എന്നിവ സൂചിപ്പിക്കാം. ഇവിടെ ‘ചിന്ത’ സ്വാഭാവികവും വിശാലവുമാണ്; πᾶν എന്ന ഏകവചന വിതരണബലം ‘ഓരോ’ എന്നു നൽകുന്നു.
- source_word: εἰς τὴν ὑπακοὴν
  choice: അനുസരണത്തിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഒരു ഫലാവസ്ഥയിലേക്കുള്ള ദിശയും ചലനവും ‘-ലേക്കു’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായോടുള്ള
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായി വായിക്കപ്പെടുന്നു; അതിനാൽ മലയാളത്തിൽ അർഥസൂചകമായ ‘മശീഹാ’ ഉപയോഗിക്കുന്നു. ‘-യോടുള്ള’ അനുസരണത്തിന്റെ ലക്ഷ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός പേരിന്റെ ഭാഗംപോലെ മാത്രമല്ല, പദവിയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ പദവിയുടെ അർഥം അറിയിക്കുന്ന ‘മശീഹാ’ സ്വീകരിച്ചു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: πᾶν ὕψωμα ἐπαιρόμενον സൂചിപ്പിക്കുന്ന എതിർപ്പിന്റെ സ്വഭാവം
  choice: ദൈവപരിജ്ഞാനത്തിനെതിരെ ഉയർന്നുനിൽക്കുന്ന പൊതുവായ ഉന്നതി/തടസ്സം
  alternative: ദൈവപരിജ്ഞാനത്തിനെതിരെ സ്വയം ഉയർത്തുന്ന എല്ലാ അഹങ്കാരവാദവും
  rationale: ഗ്രീക്കിലെ രൂപകം വിശാലമാണ്. അതിനെ വാദങ്ങളിലേക്കോ മനസ്സിലെ അഹങ്കാരത്തിലേക്കോ മാത്രം ചുരുക്കാതെ അതിന്റെ ദൃശ്യരൂപവും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: τοῦ Χριστοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: മശീഹായോടുള്ള അനുസരണം
  alternative: മശീഹായുടെ അനുസരണം
  rationale: സന്ദർഭത്തിൽ ചിന്തകളെ അനുസരണത്തിലേക്കു കൊണ്ടുവരുന്നതിന്റെ ലക്ഷ്യം മശീഹായാണെന്ന വായന സ്വാഭാവികമാണ്. എങ്കിലും ഗ്രീക്കിലെ ചുരുക്കമുള്ള ജനിറ്റീവ് രൂപത്തിന്റെ മറ്റൊരു സാധ്യതയെ പൂർണമായി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ അക്ഷരാർഥരൂപം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഗ്രീക്ക് ഘടനയെ സൂചിപ്പിക്കാൻ വാക്യത്തിന്റെ തുടക്കത്തിൽ പുതിയ കർത്താവിനെ ചേർത്തിട്ടില്ല. ‘ഉന്നതി’, ‘തടവിലാക്കുക’ എന്നിവ മൂലത്തിലെ ഉയരം/കോട്ടയും യുദ്ധത്തടവും ഉൾപ്പെടുന്ന രൂപകങ്ങൾ സംരക്ഷിക്കുന്നു.
