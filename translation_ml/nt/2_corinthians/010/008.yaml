reference: 2 Corinthians 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവ് ഞങ്ങൾക്കു നൽകിയിരിക്കുന്ന ഞങ്ങളുടെ അധികാരത്തെക്കുറിച്ച് ഞാൻ കുറച്ചുകൂടി പുകഴ്ത്തിപ്പറഞ്ഞാൽപ്പോലും—അത് നിങ്ങളെ പടുത്തുയർത്തുന്നതിനുള്ളതാണ്, നിങ്ങളെ ഇടിച്ചുതകർക്കുന്നതിനുള്ളതല്ല[b]—ഞാൻ അപമാനിതനാകുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻ ലജ്ജിക്കുകയില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇരു അർഥസാധ്യതകളുമുണ്ടെങ്കിലും, ഇവിടെ അതിന്റെ നിഷ്ക്രിയരൂപം ‘ഞാൻ അപമാനിതനാകുകയില്ല’ എന്ന പരിഭാഷയിൽ കൂടുതൽ വ്യക്തമായി പ്രതിഫലിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ നാശത്തിനല്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘പടുത്തുയർത്തൽ’ എന്നതിനു വിപരീതമായി ‘ഇടിച്ചുതകർക്കൽ/നാശം’ എന്ന പദമാണ്; മുഖ്യപരിഭാഷ നിർമാണരൂപകം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: …പ്രശംസിച്ചാലും
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ സ്വാഭാവികമായി സൂചിതമാകുന്നു; ἐάνയും τεയും ചേർന്ന സോപാധിക ഊന്നൽ ‘-ച്ചാലും’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: περισσότερόν τι
  choice: കുറച്ചുകൂടി
  rationale: താരതമ്യമായ ‘കൂടുതൽ’ എന്ന ആശയത്തോടൊപ്പം τι നൽകുന്ന മിതപ്പെടുത്തലും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: καυχήσωμαι
  choice: ഞാൻ … പ്രശംസിച്ചാലും
  rationale: സോപാധിക പ്രയോഗത്തിലുള്ള aorist middle subjunctive-ന്റെ സാങ്കൽപ്പിക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇവിടെ സ്വയം/തനിക്കു ലഭിച്ച അധികാരത്തെക്കുറിച്ചുള്ള പ്രശംസയാണ് ഉദ്ദേശ്യം.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: ഞങ്ങളുടെ അധികാരത്തെക്കുറിച്ച്
  rationale: ἐξουσία എന്നത് അമൂർത്തമായ ശക്തിയേക്കാൾ ഏല്പിക്കപ്പെട്ട അധികാരത്തെയോ അവകാശത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: കർത്താവ് ഞങ്ങൾക്കു നൽകിയ ആ അധികാരം
  rationale: ബന്ധസർവനാമം മുൻപുള്ള ‘അധികാരം’ എന്നതിലേക്കാണ് മടങ്ങുന്നത്; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി നാമം ആവർത്തിക്കുന്നു. കർത്താവ് അധികാരത്തിന്റെ ദാതാവാണെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: εἰς οἰκοδομὴν
  choice: നിങ്ങളെ പടുത്തുയർത്താൻ
  rationale: οἰκοδομήയുടെ നിർമാണരൂപകം നിലനിർത്തുകയും സന്ദർഭത്തിൽ സൂചിതമായ ‘നിങ്ങളെ’ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: നിങ്ങളെ … ഇടിച്ചുതകർക്കാനല്ല
  rationale: οἰκοδομή–καθαίρεσις എന്ന പടുത്തുയർത്തൽ/ഇടിച്ചുതകർക്കൽ വൈരുധ്യവും നിർമാണരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: ഞാൻ ലജ്ജിതനാക്കപ്പെടുകയില്ല
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപം സാധ്യമായത്ര പ്രതിഫലിപ്പിക്കുന്നു; വെറും ആന്തരിക ലജ്ജയെക്കാൾ, അവകാശവാദം വ്യാജമെന്നു തെളിഞ്ഞ് അപമാനിക്കപ്പെടുകയില്ല എന്ന സാധ്യതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തോലിക അധികാരത്തിന്റെ ഉറവിടവും ലക്ഷ്യവും
  choice: അധികാരം കർത്താവ് നൽകിയതും കൊരിന്ത്യരെ പടുത്തുയർത്താനുള്ളതുമാണ്; അവരെ തകർക്കാനുള്ളതല്ല.
  alternative: അധികാരം പ്രധാനമായും ശിക്ഷാപരമായ നാശത്തിനുള്ളതാണെന്ന വായന.
  rationale: οἰκοδομήയും καθαίρεσιςയും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം അധികാരത്തിന്റെ അടിസ്ഥാനലക്ഷ്യം സമൂഹത്തെ ശക്തിപ്പെടുത്തലാണെന്ന് കാണിക്കുന്നു; അതേസമയം അധികാരത്തിന്റെ യാഥാർഥ്യമോ അതിന്റെ ദൃഢമായ പ്രയോഗസാധ്യതയോ വിവർത്തനം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നിർമാണരൂപകവും സോപാധിക ഭാവവും നിഷ്ക്രിയക്രിയയുടെ അർഥസാധ്യതയും സംരക്ഷിച്ചു. രണ്ട് അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
