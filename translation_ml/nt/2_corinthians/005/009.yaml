revisions:
- from: അതുകൊണ്ട്, സ്വദേശത്തായിരുന്നാലും വിദേശത്തായിരുന്നാലും,[a] അവിടുത്തേക്ക് പ്രസാദകരരായിരിക്കാൻ ഞങ്ങൾ അഭിലഷിക്കുന്നു.
  to: അതിനാൽ, വീട്ടിലായിരുന്നാലും വീട്ടിൽനിന്ന് അകന്നിരുന്നാലും,[a] അവിടുത്തേക്ക് പ്രസാദകരായിരിക്കുക എന്നതാണ് ഞങ്ങളുടെ ലക്ഷ്യം.
