id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: ml
  text: പാപം അറിയാത്തവനെ ദൈവം നമുക്കുവേണ്ടി പാപമാക്കി[a], അവനിൽ നാം ദൈവത്തിന്റെ നീതിയായിത്തീരാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപയാഗമാക്കി.’ ഗ്രീക്കിൽ രണ്ടിടത്തും ‘പാപം’ എന്നാണ്; രണ്ടാമത്തെ പ്രയോഗത്തെ ചിലർ യാഗപരമായ അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: γνόντα
  choice: അറിഞ്ഞിട്ടില്ലാത്തവനെ
  rationale: γινώσκω എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു. ക്രിസ്തു പാപത്തിൽ വ്യക്തിപരമായി പങ്കാളിയായിട്ടില്ലെന്ന ആശയം സന്ദർഭത്തിൽ വ്യക്തമാകുമ്പോഴും, ‘പാപം ചെയ്തിട്ടില്ലാത്തവൻ’ എന്നു വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ἁμαρτίαν (first occurrence)
  choice: പാപം
  rationale: ഗ്രീക്കിലെ അമൂർത്തനാമം അതേപടി നിലനിർത്തി പൗലോസിന്റെ സാന്ദ്രമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: പ്രതിനിധിത്വപരവും ഗുണഭോക്തൃപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἁμαρτίαν (second occurrence)
  choice: പാപം
  rationale: മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തുകയും പൗലോസിന്റെ ഞെട്ടിക്കുന്ന സാന്ദ്രപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘പാപയാഗം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐποίησεν
  choice: പാപമാക്കി
  rationale: ποιέωയുടെ ‘ആക്കി’ എന്ന കാരണാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അതിലുപരി തത്ത്വചിന്താപരമായ കൃത്യത ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: γενώμεθα
  choice: ആയിത്തീരേണ്ടതിനുതന്നെ
  rationale: γίνομαιയുടെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക ഭാവവും ἵνα ഉദ്ദേശ്യവാക്യത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: δικαιοσύνηയുടെ നീതി/നീതിനിഷ്ഠത എന്ന അർഥപരിധി മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘നീതി’യിലൂടെ നൽകുന്നു; പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രത വിശദീകരിച്ച് ചുരുക്കുന്നില്ല.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ബന്ധം, ഉറവിടം, ഉടമസ്ഥത തുടങ്ങിയ സാധ്യതകൾ തീർപ്പാക്കാതെ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: പൗലോസിന്റെ പ്രധാനപ്പെട്ട ἐν Χριστῷ ശൈലിയോട് ചേർന്ന സംക്ഷിപ്തരൂപം; ‘അവനോടുള്ള ഐക്യത്തിൽ’ എന്ന വ്യാഖ്യാനവികാസം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘അവനെ ... പാപമാക്കി’ എന്നതിന്റെ അർഥം
  choice: ധാർമികമായി പാപിയായിത്തീർന്നു എന്നു പറയാതെ, പാപമില്ലാത്തവനെ ദൈവം നമുക്കുവേണ്ടി പാപമാക്കി എന്ന പൗലോസിന്റെ വാക്കുകൾ അതേ തീവ്രതയിൽ നിലനിർത്തുന്നു.
  alternative: ‘പാപയാഗമാക്കി’ എന്ന യാഗപരമായ വ്യാഖ്യാനം.
  rationale: ആദ്യ ഉപവാക്യം അവന്റെ പാപരാഹിത്യം വ്യക്തമാക്കുന്നു. അതിനാൽ ധാർമികമായി പാപിയായിത്തീർന്നു എന്ന വായന സന്ദർഭം അനുവദിക്കുന്നില്ല; എന്നാൽ ‘പാപയാഗം’ എന്ന് മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സാധ്യതയായി നൽകുന്നു.
- issue: δικαιοσύνη θεοῦ എന്ന പ്രയോഗത്തിന്റെ ശക്തി
  choice: ‘ദൈവത്തിന്റെ നീതി’ എന്നു തുറന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി, അത് ദൈവത്തിന്റെ സ്വന്തം നീതിയാണോ ദൈവത്തിൽനിന്നുള്ള നീതിയാണോ എന്നു മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
  alternative: ‘ദൈവത്തിൽനിന്നുള്ള നീതി’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ നീതിനിഷ്ഠത.’
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയും δικαιοσύνη എന്ന പദവും ദൈവശാസ്ത്രപരമായി സാന്ദ്രവും വിവാദവിധേയവുമാണ്; അതിനാൽ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പുകളുടെ [a], [b] ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട മുഖ്യപാഠസ്ഥാനങ്ങളിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
