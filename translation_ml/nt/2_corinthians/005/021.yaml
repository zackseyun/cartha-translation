- from: പാപം അറിഞ്ഞിട്ടില്ലാത്തവനെ ദൈവം നമുക്കുവേണ്ടി പാപമാക്കി[a]; അവനിൽ നാം ദൈവത്തിന്റെ നീതി[b] ആയിത്തീരേണ്ടതിനുതന്നെ.
