  rationale: കൊμίσηται-യുടെ സന്ദർഭാർഥം കൂടുതൽ വ്യക്തമായി പ്രതിഫലിപ്പിക്കാൻ ‘തനിക്കുള്ളത് പ്രാപിക്കേണ്ടതിന്’ എന്നത് ‘തനിക്കു ലഭിക്കേണ്ടത് നേടേണ്ടതിന്’ എന്നാക്കി. ഇതിലൂടെ അധിക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ പ്രവൃത്തികൾക്കനുസൃതമായ വ്യക്തിഗത ലഭ്യത വ്യക്തമാകുന്നു. മറ്റെല്ലാ പദങ്ങളും പാദക്കുറിപ്പുകളും നിലനിർത്തിയിരിക്കുന്നു.
