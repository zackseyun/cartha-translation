id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: ml
  text: എന്തെന്നാൽ, നാമെല്ലാവരും മശീഹയുടെ[a] ന്യായാസനത്തിനുമുമ്പിൽ വെളിപ്പെടേണ്ടതാണ്[b]; ഓരോരുത്തനും ശരീരത്തിലൂടെ ചെയ്തതിനനുസരിച്ച്[c]—അത് നല്ലതായാലും മോശമായാലും—തനിക്കു ലഭിക്കേണ്ടത് നേടേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തു’; Χριστός ഇവിടെ ഒരു പദവിയായതിനാൽ മുഖ്യപാഠത്തിൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഹാജരാകേണ്ടതാണ്.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് കേവലം പ്രത്യക്ഷപ്പെടുക എന്നും പരസ്യമായി വെളിപ്പെടുക എന്നും അർഥമാകാം; മുഖ്യപാഠം ശക്തമായ രണ്ടാമത്തെ അർഥം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ശരീരത്തിലൂടെ ചെയ്തതിനനുസരിച്ച്’; ശരീരധാരിയായ ജീവിതത്തിൽ ചെയ്ത പ്രവൃത്തികൾ എന്ന അർഥത്തിലും ഈ പ്രയോഗം മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: വെളിപ്പെടേണ്ടതാണ്
  rationale: ക്രിയയുടെ നിഷ്ക്രിയരൂപവും പരസ്യമായി വെളിവാക്കപ്പെടുക എന്ന ശക്തമായ അർഥവും നിലനിർത്തുന്നു; കേവലം അവിടെ ഹാജരാകുക എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: βήματος
  choice: ന്യായാസനം
  rationale: വിലയിരുത്തലും വിധിനിർണയവും നടക്കുന്ന ന്യായാധിപന്റെ പീഠം എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന പദവിസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: κομίσηται
  choice: തനിക്കുള്ളത് പ്രാപിക്കേണ്ടതിന്
  rationale: ഓരോരുത്തന്റെയും പ്രവൃത്തികൾക്കനുസരിച്ചുള്ള പ്രതിഫലം ലഭിക്കുക എന്ന സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു; പ്രതിഫലത്തിന്റെ സ്വഭാവം അതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: ശരീരത്തിലൂടെ ചെയ്തതിനനുസരിച്ച്
  rationale: διά എന്നതിന്റെ ഉപകരണാർഥമായ ‘ശരീരത്തിലൂടെ’ എന്ന ഘടകവും πρός സൂചിപ്പിക്കുന്ന അനുരൂപതയും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വ്യക്തിഗത ഉത്തരവാദിത്വത്തെ ഊന്നിപ്പറയുന്ന വിതരണാർഥമുള്ള ഏകവചനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἀγαθὸν ... φαῦλον
  choice: നല്ലതായാലും മോശമായാലും
  rationale: വിശാലമായ നൈതിക വൈരുധ്യം അതിശക്തമാക്കാതെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മശീഹയുടെ ന്യായാസനത്തിനു മുമ്പിലുള്ള വിലയിരുത്തലിന്റെ വ്യാപ്തിയും ഫലവും
  choice: എല്ലാവരും വെളിപ്പെടുകയും ഓരോരുത്തനും തന്റെ പ്രവൃത്തികൾക്കനുസരിച്ച് പ്രാപിക്കുകയും ചെയ്യുമെന്ന വാക്യത്തിന്റെ ഭാഷ മാത്രം നിലനിർത്തി.
  alternative: ഇത് വിശ്വാസികളുടെ പ്രതിഫലനിർണയം മാത്രമാണെന്നോ സകല മനുഷ്യരുടെയും അന്തിമവിധിയാണെന്നോ പരിഭാഷയിൽ വ്യക്തമാക്കുക.
  rationale: വാക്യം സാർവത്രിക ഉത്തരവാദിത്വവും വ്യക്തിഗത പ്രതിഫലവും പ്രസ്താവിക്കുന്നുവെങ്കിലും ഈ വിധിയുടെ കൃത്യമായ പരിധിയോ അന്തിമഫലമോ സ്വയം നിർവചിക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായാസനം’ നിയമപരമായ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടന വായനാസൗകര്യത്തിനായി അർധവിരാമവും ഇടവരയും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി; അർഥബന്ധങ്ങൾ നിലനിർത്തി.
