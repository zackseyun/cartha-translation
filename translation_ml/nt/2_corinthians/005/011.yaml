id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: ml
  text: അതുകൊണ്ട്, കർത്താവിനോടുള്ള ഭയം[a] അറിയുന്ന ഞങ്ങൾ മനുഷ്യരെ ബോധ്യപ്പെടുത്തുന്നു. എന്നാൽ ദൈവത്തിന് ഞങ്ങൾ വെളിവായിരിക്കുന്നു[b]; നിങ്ങളുടെ മനസ്സാക്ഷികളിലും ഞങ്ങൾ വെളിവായിട്ടുണ്ടെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവിനോടുള്ള ഭയം’ എന്നത് കർത്താവിനോടുള്ള ഭക്ത്യാദരപൂർവമായ ഭയമായും മനസ്സിലാക്കാം; പ്രത്യേകിച്ച് മുൻവാക്യത്തിലെ ന്യായാസനസന്ദർഭത്തിൽ.
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു വിവർത്തനം: ‘എന്നാൽ ദൈവത്തിനു ഞങ്ങൾ വെളിപ്പെടുത്തപ്പെട്ടിരിക്കുന്നു; നിങ്ങളുടെ മനസ്സാക്ഷികളിലും വെളിപ്പെടുത്തപ്പെട്ടിട്ടുണ്ടെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: അതുകൊണ്ട് ... അറിയുന്ന
  rationale: οὖν മുൻവാക്യത്തിലെ ന്യായാസനസന്ദർഭത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്നു; Εἰδότες എന്ന വർത്തമാനാർഥമുള്ള പൂർണകൃതന്തത്തിന്റെ മുഖ്യക്രിയയോടുള്ള ബന്ധവും ഈ രൂപം നിലനിർത്തുന്നു.
- source_word: φόβον τοῦ κυρίου
  choice: കർത്താവിനോടുള്ള ഭയം
  rationale: വിധിന്യായത്തിന്റെ പശ്ചാത്തലത്തിൽ ഭക്ത്യാദരവും ഉത്തരവാദിത്വബോധത്തോടുകൂടിയ ഭയവും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണിത്; ‘ഭക്ത്യാദരം’ എന്നു മാത്രം മൃദൂകരിച്ചിട്ടില്ല.
- source_word: ἀνθρώπους πείθομεν
  choice: ഞങ്ങൾ മനുഷ്യരെ ബോധ്യപ്പെടുത്തുന്നു
  rationale: ἀνθρώπους സകല മനുഷ്യരെയും പൊതുവായി സൂചിപ്പിക്കുന്നു; πείθομεν എന്ന വർത്തമാന സക്രിയരൂപത്തിന്റെ പ്രേരിപ്പിച്ച് ബോധ്യപ്പെടുത്തുക എന്ന ശക്തി നിലനിർത്തുന്നു.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: എന്നാൽ ദൈവത്തിന് ഞങ്ങൾ വെളിവായിരിക്കുന്നു
  rationale: പൂർണ നിഷ്ക്രിയരൂപം സൂചിപ്പിക്കുന്ന, മുമ്പേ വെളിപ്പെട്ടതിന്റെ ഇപ്പോഴത്തെ ഫലം നിലനിർത്തുന്നു. θεῷ എന്ന ദത്തിവിനെ നേരിട്ട് ‘ദൈവത്തിന്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: നിങ്ങളുടെ മനസ്സാക്ഷികളിലും
  rationale: ἐν എന്നതിന്റെ ‘ഉള്ളിൽ’ എന്ന ബന്ധവും συνειδήσεσιν എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: πεφανερῶσθαι
  choice: വെളിവായിട്ടുണ്ടെന്ന്
  rationale: പൂർണ നിഷ്ക്രിയ അനന്തരൂപത്തിന്റെ പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവിനോടുള്ള ഭയം’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘ഭയം’ നിലനിർത്തി
  alternative: ‘കർത്താവിനോടുള്ള ഭക്ത്യാദരം’
  rationale: മുൻവാക്യത്തിലെ ക്രിസ്തുവിന്റെ ന്യായാസനസന്ദർഭം ഭക്ത്യാദരത്തോടൊപ്പം ദൈവിക കണക്കുബോധവും ഉൾക്കൊള്ളുന്നു; ‘ഭക്ത്യാദരം’ മാത്രം ഉപയോഗിക്കുന്നത് ഈ ശക്തി കുറയ്ക്കാം.
- issue: ദൈവത്തിനും കൊരിന്ത്യരുടെ മനസ്സാക്ഷികൾക്കും മുമ്പിലുള്ള പൗലോസിന്റെ വെളിപ്പെട്ട നില
  choice: ‘വെളിവായിരിക്കുന്നു / വെളിവായിട്ടുണ്ടെന്ന്’
  alternative: ‘അറിയപ്പെട്ടിരിക്കുന്നു / വെളിപ്പെടുത്തപ്പെട്ടിരിക്കുന്നു’
  rationale: φανερόω എന്നതിലെ തുറന്നുകാണപ്പെടുന്ന അവസ്ഥയും പൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും സംരക്ഷിക്കുന്നു; പൗലോസിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധികമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യർ’ ഇവിടെ ലിംഗഭേദമില്ലാതെ ആളുകളെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ദീർഘവാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കിയെങ്കിലും അതിന്റെ താർക്കികബന്ധം നിലനിർത്തിയിട്ടുണ്ട്.
