reference: 2 Corinthians 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: ml
  text: അതിനാൽ ഞങ്ങൾ ധൈര്യമുള്ളവരാണ്; ശരീരത്തിൽനിന്ന് അകന്ന് കർത്താവിനോടൊപ്പം വസിക്കാനാണ് ഞങ്ങൾ അതിലേറെ ആഗ്രഹിക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശരീരത്തിൽനിന്ന് അസന്നിഹിതരായി കർത്താവിനോടൊപ്പം വസിക്കാൻ.’
    reason: ἐκδημῆσαι എന്നതിന് ‘അകന്നിരിക്കുക’ എന്നതിനുപുറമേ ‘അസന്നിഹിതനായിരിക്കുക’ എന്ന പദപരമായ സാധ്യതയുമുണ്ട്; ἐνδημῆσαι അതിന്റെ വിപരീതമായ സാന്നിധ്യം/വാസം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: ഞങ്ങൾ ധൈര്യത്തോടെയിരിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ധൈര്യവും ആത്മവിശ്വാസവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ചിന്തയിൽനിന്നുള്ള തുടർച്ചയും നിഗമനവും സൂചിപ്പിക്കുന്നു; ശക്തമായ വിരോധം ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: καὶ
  choice: ;
  rationale: രണ്ട് സമാന്തര ക്രിയാഭാവങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു; ബന്ധത്തിന്റെ ആശയം നിലനിൽക്കുന്നു.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: ഞങ്ങൾ ഏറെ ഇഷ്ടപ്പെടുന്നു
  rationale: εὐδοκέωയും μᾶλλονും ചേർന്ന് താരതമ്യപരമായ ആഗ്രഹമോ മുൻഗണനയോ പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം ആ ഇച്ഛാപൂർവമായ മുൻഗണന വ്യക്തമാക്കുന്നു.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: ശരീരത്തിൽനിന്ന് അകന്ന്
  rationale: സ്വദേശത്തുനിന്നോ ഭവനത്തിൽനിന്നോ അകലെയാകുക എന്ന ക്രിയയുടെ രൂപകം നിലനിർത്തുന്നു; ‘മരിക്കുക’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἐνδημῆσαι
  choice: സ്വഭവനത്തിലായിരിക്കാൻ
  rationale: ἐκδημέω എന്നതിന് വിപരീതമായ, സ്വന്തം ഭവനത്തിൽ വസിക്കുക എന്ന രൂപകഭാവം സംരക്ഷിക്കുന്നു.
- source_word: πρὸς τὸν κύριον
  choice: കർത്താവിനോടൊപ്പം
  rationale: ഈ സന്ദർഭത്തിൽ πρός വ്യക്തിപരമായ സാന്നിധ്യവും സഹവാസവും സൂചിപ്പിക്കുന്നു; κύριος പതിവുപോലെ ‘കർത്താവ്’ എന്ന് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ശരീരത്തിൽനിന്ന് അകലുന്നതും കർത്താവിനോടൊപ്പം സ്വഭവനത്തിലാകുന്നതും മരണാനന്തരാവസ്ഥയെക്കുറിച്ചുള്ള വിശദമായ പ്രസ്താവനയായി വികസിപ്പിക്കണമോ എന്നത്
  choice: പൗലൊസിന്റെ ശരീരം/ഭവനം എന്ന രൂപകം അതേപടി നിലനിർത്തി; ‘മരണശേഷം’ എന്നോ ‘സ്വർഗത്തിൽ’ എന്നോ ചേർത്തിട്ടില്ല.
  alternative: ‘മരിച്ച് സ്വർഗത്തിൽ കർത്താവിനോടൊപ്പം ചേരാൻ’ എന്ന് പരാവർത്തനം ചെയ്യുക.
  rationale: വാക്യം മരണാനന്തരമായി കർത്താവിനോടൊപ്പമുള്ള സാന്നിധ്യം ശക്തമായി സൂചിപ്പിച്ചാലും, ഗ്രീക്കിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ യഥാർഥ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്വഭവനം’ എന്ന പദം സന്ദർഭത്തിലെ താമസം/ഭവനം എന്ന രൂപകത്തെ വ്യക്തമാക്കുന്നു; വാക്യത്തിന്റെ അർഥം അനാവശ്യമായി മരണത്തെയോ സ്വർഗത്തെയോ പരാമർശിച്ച് വിപുലീകരിച്ചിട്ടില്ല.
