id: 2CO.5.13
reference: 2 Corinthians 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ സ്വബോധം നഷ്ടപ്പെട്ടവരാണെങ്കിൽ[a], അത് ദൈവത്തിനുവേണ്ടിയാണ്; ഞങ്ങൾ സുബോധമുള്ളവരാണെങ്കിൽ[b], അത് നിങ്ങൾക്കുവേണ്ടിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ സ്വബോധത്തിനു പുറത്താണെങ്കിൽ” / “ഞങ്ങൾ ഭ്രാന്തരാണെങ്കിൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞങ്ങൾ സമചിത്തരാണെങ്കിൽ” / “ഞങ്ങൾ ശരിയായ ബോധത്തിലാണെങ്കിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: …ആണെങ്കിൽ …ആണെങ്കിൽ
  rationale: ആവർത്തിച്ചുള്ള നിബന്ധനാരൂപം പൗലോസിന്റെ ചുരുക്കിയ വിരുദ്ധസമാന്തര ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ആകട്ടെ … ആകട്ടെ’ എന്നും സാധ്യമെങ്കിലും ഇവിടെ അത്ര സുതാര്യമല്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്നതോ അതിന് കാരണം നൽകുന്നതോ ആയ ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐξέστημεν
  choice: സമനില തെറ്റിയവരെപ്പോലെയാണ്
  rationale: ബുദ്ധിഭ്രമം സംഭവിച്ചുവെന്ന് തീർപ്പാക്കാതെ, ഒരാൾ സ്വബോധത്തിന് പുറത്താണെന്നോ വിവേകരഹിതനായി തോന്നുന്നുവെന്നോ ഉള്ള അർഥവ്യാപ്തി സൂക്ഷിക്കുന്നു. ആരോപണമോ ബാഹ്യധാരണയോ ആയിരിക്കാവുന്ന സൂക്ഷ്മത ‘പോലെ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: θεῷ
  choice: ദൈവത്തിനുവേണ്ടിയാണ്
  rationale: ചുരുക്കിയ ദത്തിവിഭക്തി ദൈവത്തോടുള്ള ദിശയെയോ ദൈവത്തിന്റെ താത്പര്യത്തിനായുള്ള പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വേണ്ടി’ സ്വാഭാവികമായി ഈ ബന്ധം നൽകുന്നു.
- source_word: σωφρονοῦμεν
  choice: സുബോധമുള്ളവരാണ്
  rationale: വിവേകത്തോടെയും ശരിയായ മാനസികനിലയോടെയും ഇരിക്കുക എന്ന അർഥം നൽകുകയും ἐξέστημεν എന്നതിനോടുള്ള നേരിട്ടുള്ള വിരോധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കുവേണ്ടിയാണ്
  rationale: കൊരിന്ത്യരുടെ നന്മയ്ക്കോ പ്രയോജനത്തിനോ വേണ്ടിയുള്ള പെരുമാറ്റം എന്ന ദത്തിവിഭക്തിയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വിരുദ്ധമായ സ്വയംവിവരണത്തിന്റെ വ്യാഖ്യാനം
  choice: യുക്തിരഹിതമോ സ്വബോധത്തിന് പുറത്തുള്ളതോ ആയി തോന്നാവുന്ന പെരുമാറ്റത്തെയും സുബോധമുള്ള പെരുമാറ്റത്തെയും പൗലോസ് വിരുദ്ധമായി നിരത്തുന്നു; യഥാർഥ ഭ്രാന്ത് അദ്ദേഹത്തിനുണ്ടെന്ന് വിവർത്തനം വിധിക്കുന്നില്ല.
  alternative: ഇത് യഥാർഥ മതപരമായ പരവശാനുഭവത്തെ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ എതിരാളികളുടെ ആരോപണം മാത്രം അതിശയോക്തിയായി ആവർത്തിക്കുന്നു.
  rationale: മൂലവാക്യം വാചാലവും ചുരുക്കിയതുമാണ്. സാങ്കേതികമായ പരവശതാസിദ്ധാന്തമോ വെറും അപമാനാരോപണമോ ഇറക്കുമതി ചെയ്യാതെ അതിലെ വ്യാഖ്യാനസമ്മർദം വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. രണ്ട് അർധവാക്യങ്ങളിലെയും സമാന്തരഘടനയും ‘ദൈവത്തിനുവേണ്ടി / നിങ്ങൾക്കുവേണ്ടി’ എന്ന വിരോധവും സൂക്ഷിച്ചിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
