- from: കാരണം, ഞങ്ങൾ സമനില തെറ്റിയവരെപ്പോലെയാണെങ്കിൽ[a], അത് ദൈവത്തിനുവേണ്ടിയാണ്; ഞങ്ങൾ സുബോധമുള്ളവരാണെങ്കിൽ[b], അത് നിങ്ങൾക്കുവേണ്ടിയാണ്.
  to: കാരണം, ഞങ്ങൾ സ്വബോധം നഷ്ടപ്പെട്ടവരാണെങ്കിൽ[a], അത് ദൈവത്തിനുവേണ്ടിയാണ്; ഞങ്ങൾ സുബോധമുള്ളവരാണെങ്കിൽ[b], അത് നിങ്ങൾക്കുവേണ്ടിയാണ്.
  rationale: The revision removes the added comparison ‘പോലെയാണ്’ and replaces the emotionally colored ‘സമനില തെറ്റിയ’ with ‘സ്വബോധം നഷ്ടപ്പെട്ട,’ which more directly conveys the rhetorical sense of being beside oneself or out of one’s mind. It retains the concise parallelism, the conditional form, and the ambiguity concerning whether Paul refers to ecstatic conduct, an accusation, or rhetorical self-description.
