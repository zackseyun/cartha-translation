- from: അതുകൊണ്ട്, ഇനിമുതൽ നാം ആരെയും ജഡപ്രകാരം[a] അറിയുന്നില്ല. നാം മശീഹയെ ജഡപ്രകാരം അറിഞ്ഞിട്ടുണ്ടെങ്കിൽപോലും, ഇപ്പോൾ ഇനി അങ്ങനെ അറിയുന്നില്ല.[b]
