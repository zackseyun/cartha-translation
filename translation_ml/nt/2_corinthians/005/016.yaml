id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇനിമുതൽ നാം ആരെയും ജഡപ്രകാരം[a] അറിയുന്നില്ല. നാം മശീഹയെ ജഡപ്രകാരം അറിഞ്ഞിട്ടുണ്ടെങ്കിൽപോലും[b], എന്നാൽ ഇപ്പോൾ നാം അവനെ ഇനി അങ്ങനെ അറിയുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മാനുഷിക കാഴ്ചപ്പാടിൽ” അല്ലെങ്കിൽ “ലൗകിക മാനദണ്ഡപ്രകാരം.”
    reason: lexical_alternative
  - marker: b
    text: “അറിഞ്ഞിട്ടുണ്ടെങ്കിൽപോലും” എന്നത് “അറിഞ്ഞിരുന്നെങ്കിലും” എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പ്രയോഗത്തിന് ഉപാധിസൂചകമായ ഇളവുനൽകുന്ന അർഥമുണ്ട്.
    reason: ambiguity
lexical_decisions:
- source_word: Ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπὸ τοῦ νῦν
  choice: ഇനിമുതൽ
  rationale: ഇപ്പോഴാരംഭിക്കുന്ന നിർണായകമായ മാറ്റവും തുടർച്ചയും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδένα οἴδαμεν
  choice: നാം ആരെയും ... അറിയുന്നില്ല
  rationale: οἴδαμεν എന്ന അറിവിന്റെ പദം നിലനിർത്തുകയും κατὰ σάρκα അതിന്റെ കാഴ്ചപ്പാടിനെയോ വിലയിരുത്തൽരീതിയെയോ നിർണ്ണയിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലോസിന്റെ σάρξ പദപ്രയോഗവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; ഇവിടെ പാപസ്വഭാവം എന്നല്ല, കേവലം മാനുഷികമോ ഭൗമികമോ ആയ മാനദണ്ഡപ്രകാരമുള്ള അറിവ്/വിലയിരുത്തൽ എന്നാണ് സന്ദർഭാർഥം.
- source_word: εἰ καὶ
  choice: അറിഞ്ഞിട്ടുണ്ടെങ്കിൽപോലും
  rationale: ഗ്രീക്കിലെ ഉപാധിരൂപത്തോടുകൂടിയ concessive സ്വഭാവം നിലനിർത്തുന്നു; ‘അറിഞ്ഞിരുന്നെങ്കിലും’ എന്ന നിർണായക വ്യാഖ്യാനത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἐγνώκαμεν
  choice: അറിഞ്ഞിട്ടുണ്ടെങ്കിൽപോലും
  rationale: പൂർണകാലത്തിന്റെ മുൻകാല അനുഭവവും ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Χριστόν
  choice: മശീഹയെ
  rationale: Χριστός എന്ന അഭിഷിക്തനായ രക്ഷകന്റെ പദവിയുടെ അർഥം പേരുപോലെ മാത്രം ആക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: ഇപ്പോൾ ഇനി അങ്ങനെ അറിയുന്നില്ല
  rationale: മുൻകാലത്തെയും ഇപ്പോഴത്തെയും അറിവിന്റെ രീതികൾ തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു; ‘അങ്ങനെ’ എന്നത് മുമ്പുള്ള ജഡപ്രകാരമുള്ള രീതിയെ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: κατὰ σάρκα എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ജഡപ്രകാരം’ എന്നു നിലനിർത്തി, അടിക്കുറിപ്പിൽ മാനുഷിക കാഴ്ചപ്പാട്/ലൗകിക മാനദണ്ഡം എന്ന സാധ്യത വ്യക്തമാക്കി.
  alternative: മാനുഷിക കാഴ്ചപ്പാടിൽ; ലൗകിക മാനദണ്ഡപ്രകാരം
  rationale: ഇത് മശീഹയുടെ യഥാർഥ മനുഷ്യാവസ്ഥയെ നിഷേധിക്കുന്നില്ല; വ്യക്തികളെയും മശീഹയെയും കേവലം ഭൗമിക-മാനുഷിക വിഭാഗങ്ങളിലൂടെ അറിയുകയോ വിലയിരുത്തുകയോ ചെയ്യുന്ന അപര്യാപ്തമായ രീതിയെയാണ് നിരസിക്കുന്നത്.
- issue: εἰ καὶ എന്ന concessive ഉപാധി
  choice: ‘എങ്കിൽപോലും’ എന്ന തുറന്ന രൂപം
  alternative: ‘അറിഞ്ഞിരുന്നെങ്കിലും’ എന്ന വസ്തുതാസൂചക concessive രൂപം
  rationale: വാക്യഘടനയിലെ യഥാർഥ അനിശ്ചിതത്വം നിലനിർത്തി, പൗലോസ് ചരിത്രപരമായി യേശുവിനെ നേരിട്ട് പരിചയപ്പെട്ടിരുന്നു എന്ന നിഗമനം പരിഭാഷയിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: Χριστός എന്ന പദവി
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഗ്രീക്ക് പദത്തിന്റെ ‘അഭിഷിക്തൻ’ എന്ന പദവിസ്വഭാവം വായനക്കാരന് ദൃശ്യമാക്കുന്നു; പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡപ്രകാരം’ എന്ന ബൈബിൾപരമായ പദപ്രയോഗം പ്രധാനപാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ തുറന്നുകാട്ടി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
