source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: ml
  text: തീർച്ചയായും, ഈ കൂടാരത്തിൽ ആയിരിക്കുന്ന നാം ഭാരപ്പെട്ട് ഞരങ്ങുന്നു; കാരണം, വസ്ത്രം അഴിച്ചുകളയാനല്ല, മറിച്ച് മേൽവസ്ത്രം ധരിക്കാനാണ്[a] നാം ആഗ്രഹിക്കുന്നത്; അങ്ങനെ മരണവിധേയമായത്[b] ജീവനാൽ വിഴുങ്ങപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മീതെ വസ്ത്രം ധരിക്കാൻ.’ ഗ്രീക്ക് ക്രിയ, ഇതിനകം ധരിച്ചിരിക്കുന്ന വസ്ത്രത്തിനുമീതെ മറ്റൊരു വസ്ത്രം ധരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മർത്യമായത്’ അല്ലെങ്കിൽ ‘മരണവിധേയത്വം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ഞരങ്ങുകയാണല്ലോ
  rationale: ‘-യാണല്ലോ’ എന്ന പ്രയോഗം മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധവും ഗ്രീക്കിലെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: σκήνει
  choice: കൂടാരത്തിൽ
  rationale: ഇപ്പോഴത്തെ ശാരീരിക അസ്തിത്വത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ കൂടാരരൂപകം നിലനിർത്തുകയും ചുറ്റുമുള്ള വാക്യങ്ങളുമായുള്ള ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: στενάζομεν
  choice: ഞരങ്ങുന്നു
  rationale: ഭാരവും ഭാവിയിലെ രൂപാന്തരത്തിനായുള്ള ആഴമായ വാഞ്ഛയും ‘നെടുവീർപ്പിടുന്നു’ എന്നതിനെക്കാൾ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: βαρούμενοι
  choice: ഭാരപ്പെട്ട്
  rationale: ഞരക്കത്തോടൊപ്പം നിലനിൽക്കുന്ന കാരണമോ അവസ്ഥയോ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἐφ’ ᾧ
  choice: എന്തെന്നാൽ
  rationale: തുടർന്നുവരുന്ന വസ്ത്രരൂപകത്തെ ഞരക്കത്തിന്റെ കാരണമായി അവതരിപ്പിക്കുന്ന വ്യാഖ്യാനം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκδύσασθαι
  choice: വസ്ത്രം അഴിച്ചുകളയാൻ
  rationale: ഗ്രീക്കിലെ വസ്ത്രരൂപകം നിലനിർത്തുന്നു; അതിനെ പ്രത്യേകമായ ഒരു പരലോകസിദ്ധാന്തമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἐπενδύσασθαι
  choice: അതിനുമീതെ മറ്റൊന്നു ധരിക്കാൻ
  rationale: ഇതിനകം ധരിച്ചിരിക്കുന്നതിന്റെ മീതെ മറ്റൊരു വസ്ത്രം ധരിക്കുക എന്ന സംയുക്തക്രിയയുടെ പ്രത്യേക ഭാവം വ്യക്തമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: καταποθῇ
  choice: വിഴുങ്ങപ്പെടേണ്ടതാണ്
  rationale: പൂർണമായി കീഴടക്കപ്പെടുന്നതിന്റെ ശക്തമായ ദൃശ്യം നിലനിർത്തുകയും ഗ്രീക്കിലെ കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ θνητόν
  choice: മരണവിധേയമായത്
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന നപുംസകലിംഗ വിശേഷണത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ നൽകുന്നു.
- source_word: ζωῆς
  choice: ജീവനാൽ
  rationale: മരണവിധേയത്വത്തോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ὑπό എന്ന കർത്തൃസൂചനയെ പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: വസ്ത്രരൂപകവും ഇടക്കാലാവസ്ഥയും
  choice: ‘വസ്ത്രം അഴിച്ചുകളയുക’, ‘അതിനുമീതെ മറ്റൊന്നു ധരിക്കുക’ എന്നീ രൂപകങ്ങൾ നിലനിർത്തി; അവയെ ഒരു പ്രത്യേക സിദ്ധാന്തക്രമമായി വ്യാഖ്യാനിച്ചില്ല.
  alternative: ‘വസ്ത്രം അഴിച്ചുകളയുക’ എന്നത് ശരീരരഹിതാവസ്ഥയെന്നും ‘മീതെ മറ്റൊന്നു ധരിക്കുക’ എന്നത് പുനരുത്ഥാനശരീരം മാത്രമെന്നും തുറന്നുവ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഇപ്പോഴത്തെ ശാരീരിക അസ്തിത്വത്തെയും വരാനിരിക്കുന്ന രൂപാന്തരത്തെയും വസ്ത്രരൂപകത്തിലൂടെയാണ് അവതരിപ്പിക്കുന്നത്. പരിഭാഷ വാക്യത്തിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കൂടാരം’, ‘വസ്ത്രം അഴിച്ചുകളയുക’, ‘മീതെ മറ്റൊന്നു ധരിക്കുക’, ‘വിഴുങ്ങപ്പെടുക’ എന്നീ പരസ്പരബന്ധിത രൂപകങ്ങൾ സമതലപ്പെടുത്താതെ നിലനിർത്തി. വായനാസൗകര്യത്തിനായി ഗ്രീക്കിലെ ദീർഘവാക്യം രണ്ട് മലയാളവാക്യങ്ങളാക്കി.
