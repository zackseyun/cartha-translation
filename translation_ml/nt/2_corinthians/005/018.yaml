id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: ml
  text: ഇവയെല്ലാം ദൈവത്തിൽനിന്നുള്ളവയാണ്[a]. മശീഹായിലൂടെ[b] നമ്മെ തന്നോടു അനുരഞ്ജിപ്പിക്കുകയും അനുരഞ്ജനത്തിന്റെ ശുശ്രൂഷ നമുക്ക്[c] ഏൽപ്പിക്കുകയും ചെയ്തത് ദൈവമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗം പുതിയ യാഥാർഥ്യത്തിലെ സകലത്തെയും വിശാലമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ തൊട്ടുമുമ്പ് പറഞ്ഞ കാര്യങ്ങളെയാകാം കൂടുതൽ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തുവിലൂടെ.’ Χριστός ഇവിടെ ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പ്രധാനവാചകത്തിൽ ‘മശീഹായിലൂടെ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘നമുക്ക്’ എന്നത് വിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാം. എന്നാൽ ചുറ്റുപാടിൽ പൗലോസ് തനിക്കും സഹപ്രവർത്തകർക്കും ഏൽപ്പിക്കപ്പെട്ട അപ്പൊസ്തോലിക ദൗത്യത്തിന് പ്രത്യേക ഊന്നൽ നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: ഇവയെല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനമായ τὰ πάντα മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പുതിയ സൃഷ്ടിയും രൂപാന്തരപ്പെട്ട ജീവിതവും ഉൾപ്പെടുന്ന യാഥാർഥ്യങ്ങളെ തിരിഞ്ഞുസൂചിപ്പിക്കാം. അതിനാൽ വെറും ‘എല്ലാം’ എന്നതിനെക്കാൾ ‘ഇവയെല്ലാം’ സന്ദർഭബന്ധം വ്യക്തമാക്കുന്നു. δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ലാത്തതിനാൽ മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർത്തിട്ടില്ല.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ളവയാണ്
  rationale: ἐκ ഉറവിടത്തെയും ഉത്ഭവത്തെയും സൂചിപ്പിക്കുന്നു; ഈ രൂപം ദൈവമാണ് എല്ലാറ്റിന്റെയും ഉറവിടം എന്ന ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: നമ്മെ തന്നോടു നിരപ്പിക്കുകയും
  rationale: അയോറിസ്റ്റ് കൃതന്തത്തിന്റെ പ്രവർത്തി മലയാളത്തിൽ സ്വാഭാവികമായ സമാന്തര ക്രിയാരൂപത്തിൽ നൽകി. ‘തന്നോടു’ എന്നത് ദൈവത്തെ സൂചിപ്പിക്കുന്ന പ്രതിഫലന സർവനാമത്തിന്റെ ബന്ധാർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: διὰ Χριστοῦ
  choice: മശീഹായിലൂടെ
  rationale: διά + സമ്പർക്കവിഭക്തി മാർഗം/മധ്യസ്ഥത സൂചിപ്പിക്കുന്നു. Χριστός ഇവിടെ മധ്യസ്ഥസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘മശീഹാ’ എന്ന് നൽകി.
- source_word: δόντος ἡμῖν
  choice: നമ്മെ ഏൽപ്പിക്കുകയും
  rationale: ‘നൽകി’ എന്നത് സാധ്യമെങ്കിലും, ഒരു ദൗത്യസ്വഭാവമുള്ള ശുശ്രൂഷ നൽകുന്നതിനെ മലയാളത്തിൽ ‘ഏൽപ്പിച്ചു’ എന്നത് വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ദൈവിക നിയോഗത്തിന്റെ ആശയം അനാവശ്യമായി വികസിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: നിരപ്പിക്കലിന്റെ ശുശ്രൂഷ
  rationale: διακονία നിയോഗിക്കപ്പെട്ട സേവനത്തെയും ശുശ്രൂഷയെയും സൂചിപ്പിക്കുന്നു. καταλλαγήയുടെ പ്രവർത്തനാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കാനായി ‘നിരപ്പിക്കൽ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ അവതരണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു; അഭിഷിക്തൻ
  rationale: ഈ വാക്യത്തിൽ പദം യേശുവിന്റെ മധ്യസ്ഥപദവിയെ സജീവമായി സൂചിപ്പിക്കുന്നു. അതിനാൽ പേരുപോലെ മാത്രം കേൾക്കാവുന്ന രൂപത്തേക്കാൾ പദവിയുടെ അർഥം വഹിക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ ‘മശീഹാ’ തെരഞ്ഞെടുത്തു.
- issue: ἡμᾶς / ἡμῖν എന്ന ‘നമ്മുടെ’ പരിധി
  choice: നമ്മെ
  alternative: എല്ലാ വിശ്വാസികളെയും; പൗലോസിനെയും സഹപ്രവർത്തകരെയും പ്രത്യേകമായി
  rationale: ഗ്രീക്ക് സർവനാമം പരിധി സ്വയം നിർണ്ണയിക്കുന്നില്ല. ചുറ്റുപാട് അപ്പൊസ്തോലിക ദൗത്യത്തിന് പ്രത്യേക ഊന്നൽ നൽകുന്നുവെങ്കിലും വിശ്വാസികളെ പൊതുവായി ഉൾക്കൊള്ളാനുള്ള സാധ്യതയും ഉണ്ട്; പ്രധാനവാചകത്തിൽ ഈ സംഘർഷം പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിരപ്പിക്കൽ’, ‘ശുശ്രൂഷ’, ‘ഏൽപ്പിക്കുക’ എന്നീ പദങ്ങൾ ബന്ധപുനഃസ്ഥാപനവും നിയോഗിക്കപ്പെട്ട സേവനവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു. മൂലത്തിലെ രണ്ട് കൃതന്തങ്ങളെ മലയാളത്തിലെ സമാന്തര ക്രിയകളാക്കി, അവസാനത്തിൽ ‘ദൈവമാണ്’ എന്നു വെച്ച് ദൈവിക പ്രവർത്തകത്വത്തിന് ഊന്നൽ നൽകി.
