id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: ml
  text: അതുകൊണ്ട്, ആരെങ്കിലും മിശിഹായിൽ ആണെങ്കിൽ, പുതിയൊരു സൃഷ്ടിയുണ്ട്[a]; പഴയവ കടന്നുപോയി; ഇതാ, പുതിയവ വന്നിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ/അവൾ ഒരു പുതിയ സൃഷ്ടിയാണ്.” ഗ്രീക്ക് വാക്യം ക്രിയയില്ലാതെ സംക്ഷിപ്തമാണ്; അക്ഷരാർഥത്തിൽ, “ആരെങ്കിലും മിശിഹായിൽ ആണെങ്കിൽ—പുതിയ സൃഷ്ടി.”
    reason: alternative_reading
  - marker: b
    text: പല പരിഭാഷകളും, “എല്ലാം പുതിയതായിത്തീർന്നിരിക്കുന്നു” എന്നു വായിക്കുന്നു. എന്നാൽ ഇവിടെ സ്വീകരിച്ചിരിക്കുന്ന SBLGNT പാഠത്തിൽ “എല്ലാം” എന്നതിന് തുല്യമായ വ്യക്തമായ പദമില്ല; “പുതിയവ വന്നിരിക്കുന്നു” എന്നത്രേ.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ബന്ധപദം.
- source_word: εἴ τις
  choice: ആരെങ്കിലും … ആണെങ്കിൽ
  rationale: പുരുഷലിംഗം അനാവശ്യമായി ചേർക്കാതെ അനിശ്ചിതവും പൊതുവ്യാപകവുമായ വ്യവസ്ഥ പ്രകടമാക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മശീഹാസംബന്ധമായ അർഥവും പൗലോസിന്റെ ‘മശീഹയിൽ’ എന്ന ഐക്യഭാഷയും നിലനിർത്തുന്നു.
- source_word: καινὴ κτίσις
  choice: പുതിയൊരു സൃഷ്ടിയുണ്ട്
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് പ്രയോഗത്തെ ഒരാളെക്കുറിച്ചുള്ള വിധേയവാക്യമായി മാത്രം പരിമിതപ്പെടുത്താതെ, പുതിയ സൃഷ്ടി എന്ന വിശാല സാധ്യത നിലനിർത്തുന്നു.
- source_word: τὰ ἀρχαῖα
  choice: പഴയവ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണത്തിന്റെ നാമവാചകപ്രയോഗവും അതിന്റെ വിശാലമായ പരിധിയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: παρῆλθεν
  choice: കടന്നുപോയി
  rationale: പഴയവ ഇനി നിലനിൽക്കുന്നില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് നിപാതത്തിന്റെ വാക്ചാതുര്യവും ഗൗരവവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: γέγονεν καινά
  choice: പുതിയവ വന്നിരിക്കുന്നു
  rationale: ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന perfect രൂപവും καινάയുടെ ബഹുവചനവും സംരക്ഷിക്കുന്നു; മൂലപാഠത്തിലില്ലാത്ത ‘എല്ലാം’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരുപോലെയോ പരിഭാഷപ്പെടുത്തുക
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: ഇവിടെ Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം പ്രസക്തമാണ്; അതിനാൽ അത് വെറും പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- issue: καινὴ κτίσις എന്ന അപൂർണ്ണവാക്യത്തിന്റെ അർഥം
  choice: പുതിയൊരു സൃഷ്ടിയുണ്ട്
  alternative: അയാൾ ഒരു പുതിയ സൃഷ്ടിയാണ്
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ക്രിയയോ കർത്താവോ ഇല്ല. പ്രധാനവാചകം പുതിയ സൃഷ്ടിയെ വ്യക്തിയിലേക്കു മാത്രം ചുരുക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു; വ്യക്തികേന്ദ്രിത വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദങ്ങൾ ഉപയോഗിക്കുമ്പോഴും ഗ്രീക്കിലെ സംക്ഷിപ്തത, ബഹുവചനം, ദൈവശാസ്ത്രപരമായ അവ്യക്തത എന്നിവ സംരക്ഷിച്ചു.
