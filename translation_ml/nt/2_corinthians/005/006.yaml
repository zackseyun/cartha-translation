revisions:
- from: അതുകൊണ്ട്, ഞങ്ങൾ എപ്പോഴും ധൈര്യത്തോടെയിരിക്കുന്നു. ശരീരത്തിൽ വീട്ടിലായിരിക്കുമ്പോൾ കർത്താവിൽനിന്ന് അകന്നാണ് കഴിയുന്നതെന്ന്[a] ഞങ്ങൾ അറിയുന്നു.
