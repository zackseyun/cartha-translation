id: 2CO.5.6
reference: 2 Corinthians 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞങ്ങൾ എപ്പോഴും ധൈര്യത്തോടെയിരിക്കുന്നു; ശരീരത്തിൽ വസിക്കുമ്പോൾ കർത്താവിൽനിന്ന് അകന്നു കഴിയുന്നുവെന്ന് ഞങ്ങൾ അറിയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θαρροῦντες
  choice: ഞങ്ങൾ ... ധൈര്യത്തോടെയിരിക്കുന്നു
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ ധൈര്യാവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിനായി സമാപികാക്രിയയായി അവതരിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ പുനരുത്ഥാനജീവനും സ്വർഗീയ വാസസ്ഥലവും സംബന്ധിച്ച വാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയെയും എല്ലാ സമയങ്ങളെയും സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ തത്തുല്യം.
- source_word: εἰδότες
  choice: ഞങ്ങൾ അറിയുന്നു
  rationale: വർത്തമാന അർഥമുള്ള സമ്പൂർണ കൃദന്തരൂപം ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി സമാപികാക്രിയയായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐνδημοῦντες
  choice: വീട്ടിലായിരിക്കുമ്പോൾ
  rationale: സ്വന്തം വീട്ടിലോ നാട്ടിലോ കഴിയുക എന്ന രൂപകം നിലനിർത്തുകയും ἐκδημοῦμεν എന്ന വിപരീതപദവുമായി ഉള്ള ബന്ധം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ σώματι
  choice: ശരീരത്തിൽ
  rationale: ഭൗമികമായ ശരീരജീവിതത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാനാർഥക പ്രയോഗം; മൂലത്തിൽ ഇല്ലാത്ത ‘ഈ’ എന്ന നിർദ്ദേശപദം ചേർത്തിട്ടില്ല.
- source_word: ἐκδημοῦμεν
  choice: അകന്നാണ് കഴിയുന്നത്
  rationale: ἐνδημοῦντες എന്നതിന് വിപരീതമായി വീട്ടിൽനിന്നോ നാട്ടിൽനിന്നോ അകന്നു കഴിയുക എന്ന ആശയം നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി വേർപാടിന്റെ സ്ഥലരൂപകം നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന അകൽച്ചയെ നേരിട്ട് പ്രകടമാക്കുന്നു; κύριος എന്നത് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ശരീരത്തിലുള്ള ഇപ്പോഴത്തെ ജീവിതവും കർത്താവിനോടൊപ്പമുള്ള സാന്നിധ്യവും തമ്മിലുള്ള രൂപകാത്മക വൈരുധ്യം
  choice: ശരീരത്തിൽ വീട്ടിലായിരിക്കുന്ന ഇപ്പോഴത്തെ അവസ്ഥയെ കർത്താവിൽനിന്ന് അകന്നു കഴിയുന്നതായി പൗലോസ് വിവരിക്കുന്ന രൂപകം അതേപടി നിലനിർത്തി.
  alternative: വിശ്വാസികൾ ശരീരത്തിൽ കഴിയുമ്പോൾ ക്രിസ്തുവിൽനിന്ന് പൂർണമായി വേർപെട്ടിരിക്കുന്നു എന്ന ശക്തമായ വ്യാഖ്യാനം; അല്ലെങ്കിൽ അടുത്ത വാക്യത്തിലെ ‘ശരീരം വിട്ട് കർത്താവിനോടുകൂടെ’ എന്ന ആശയം ഇവിടെ മുൻകൂട്ടി ചേർക്കൽ.
  rationale: വാക്യം ഭാവിയിലെ പൂർണമായ കർത്തൃസാന്നിധ്യവുമായി ഇപ്പോഴത്തെ ശരീരജീവിതത്തെ താരതമ്യം ചെയ്യുന്നു. ക്രിസ്തുവിന്റെ ഇപ്പോഴത്തെ ആത്മീയ സാന്നിധ്യം നിഷേധിക്കാതെയും അടുത്ത വാക്യത്തിലെ ആശയം ഇറക്കുമതി ചെയ്യാതെയും മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശരീരത്തിൽ വീട്ടിലായിരിക്കുക’ എന്ന അല്പം അസാധാരണമായ പ്രയോഗം പൗലോസിന്റെ വീട്ടിൽ/വീടിന് പുറത്തുള്ള രൂപകവൈരുധ്യം നഷ്ടപ്പെടാതിരിക്കാനാണ് നിലനിർത്തിയത്.
