id: 2CO.5.7
reference: 2 Corinthians 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: ml
  text: കാരണം, നാം വിശ്വാസത്താലാണ് നടക്കുന്നത്, കാഴ്ചയാലല്ല[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പ്രത്യക്ഷരൂപത്താലല്ല’ അല്ലെങ്കിൽ ‘കാണുന്നതിനെ ആശ്രയിച്ചല്ല.’ ഗ്രീക്ക് പദം ദൃശ്യമായ രൂപത്തെയോ പ്രത്യക്ഷത്തെയോ സൂചിപ്പിക്കാം; ‘വിശ്വാസം’ എന്നതിനോടുള്ള വിരുദ്ധത നിലനിർത്താൻ ഇവിടെ ‘കാഴ്ച’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മാർഗമോ ജീവിതരീതിയോ സൂചിപ്പിക്കുന്നു. εἴδους എന്നതിനോടുള്ള ചുരുക്കമായ വിരുദ്ധതയിൽ ‘വിശ്വാസത്താൽ’ സ്വാഭാവികവും പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ചതുമാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണകാരണം നൽകുന്നു. ആ ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘കാരണം’ ഉപയോഗിച്ചു.
- source_word: περιπατοῦμεν
  choice: നാം ... നടക്കുന്നു
  rationale: περιπατέωയുടെ ‘നടക്കുക’ എന്ന ദൃശ്യരൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ജീവിതം നയിക്കുന്ന രീതിയെ രൂപകമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐ διὰ εἴδους
  choice: കാഴ്ചയാലല്ല
  rationale: εἶδος കാണപ്പെടുന്ന രൂപം, ദൃശ്യം, ബാഹ്യപ്രത്യക്ഷം എന്നിവയെ സൂചിപ്പിക്കാം. വിശ്വാസത്തോടുള്ള വിരുദ്ധതയിൽ ‘കാഴ്ച’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: പൗലോസിന്റെ വാക്യത്തിൽ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഇവിടെ πίστις ക്രിസ്തുവിന്റെ വിശ്വസ്തതയെക്കുറിച്ചുള്ള പ്രത്യേക വ്യാകരണവിവാദത്തിന്റെ ഭാഗമല്ല. εἶδος എന്ന ദൃശ്യാധാരത്തോടുള്ള വിരുദ്ധത, ഇപ്പോൾ കാണാത്തതിൽ ആശ്രയിക്കുന്ന ‘വിശ്വാസം’ എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
- issue: εἶδος എന്ന പദത്തിന്റെ പരിധി
  choice: കാഴ്ച
  alternative: പ്രത്യക്ഷരൂപം; കാണുന്നതു
  rationale: ‘കാഴ്ച’ വിശ്വാസവും ദൃശ്യാധാരവും തമ്മിലുള്ള വിരുദ്ധത നിലനിർത്തുന്നു. എന്നാൽ ഗ്രീക്ക് പദത്തിന് ബാഹ്യരൂപം അല്ലെങ്കിൽ കാണപ്പെടുന്നത് എന്ന അർഥവും ഉണ്ടായതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നടക്കുന്നു’ എന്ന മൂലരൂപകം സംരക്ഷിച്ചു; വാക്യാവസാനത്തിലെ ഡാഷ് തുടർന്നുവരുന്ന ആശയബന്ധം സൂചിപ്പിക്കുന്നതിനായി നിലനിർത്തി.
