theological_decisions:
- issue: സ്വർഗീയ ദേഹധാരണത്തെക്കുറിച്ചുള്ള രൂപകം
  choice: വാസസ്ഥലം, വസ്ത്രം എന്നീ ഇടകലർന്ന രൂപകങ്ങൾ നിലനിർത്തി; അത് പുനരുത്ഥാനശരീരമോ ഇടക്കാലാവസ്ഥയോ അന്ത്യകാലത്തെ സ്വർഗീയ വാസമോ എന്ന് നിർണയിച്ചില്ല.
  alternative: ‘സ്വർഗത്തിൽനിന്നുള്ള പുനരുത്ഥാനശരീരം’ എന്നോ ‘സ്വർഗീയ ഭവനം’ എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം തന്നെ ഒരു ഏകീകൃത സിദ്ധാന്തപരമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും രൂപകങ്ങളുടെ വ്യാപ്തിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഇതിൽ’ എന്ന പ്രയോഗം മൂലത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു; ‘വാസസ്ഥലം മേലണിയുക’ എന്ന അസാധാരണമായ രൂപകസങ്കലനം പൗലോസിന്റെ ഭാഷയെ വ്യാഖ്യാനിച്ച് ലളിതമാക്കാതെ നിലനിർത്തുന്നു.
