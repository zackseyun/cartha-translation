  terminology: ‘വാസസ്ഥലം’ is a suitable rendering of οἰκητήριον, and ‘സ്വർഗത്തിൽനിന്നുള്ള’ correctly expresses origin rather than merely the quality ‘heavenly.’ ‘ഞരങ്ങുന്നു’ is acceptable for στενάζομεν in this solemn context. The footnote anchors properly identify the dwelling expression and the clothing verb.
