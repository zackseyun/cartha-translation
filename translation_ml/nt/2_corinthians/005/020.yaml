reference: 2 Corinthians 5:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: ml
  text: 'അതുകൊണ്ട്, ദൈവം ഞങ്ങളിലൂടെ അഭ്യർഥിക്കുന്നതുപോലെ, ഞങ്ങൾ മശീഹായ്ക്കുവേണ്ടി[a] സ്ഥാനപതികളായി പ്രവർത്തിക്കുന്നു. മശീഹായ്ക്കുവേണ്ടി ഞങ്ങൾ നിങ്ങളോടു യാചിക്കുന്നു: ദൈവത്തോട് അനുരഞ്ജിതരാകുക[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹാ’ എന്നതിന് പകരം ഈ വാക്യത്തിൽ എല്ലായിടത്തും ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός ഒരു സ്ഥാനപ്പേരാണ്; അതിന്റെ അർഥം നിലനിർത്താനാണ് ഇവിടെ ‘മശീഹാ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ദൈവവുമായി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: മശീഹായ്ക്കുവേണ്ടി
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπέρ ഇവിടെ പ്രതിനിധിത്വം സൂചിപ്പിക്കുന്ന ‘വേണ്ടി/പക്ഷമായി’ എന്ന അർഥത്തിലാണ്. Χριστός ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം നിലനിർത്തുന്ന ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ അനുരഞ്ജനത്തെക്കുറിച്ചുള്ള വാദത്തിൽനിന്നുള്ള നിഗമനം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πρεσβεύομεν
  choice: സ്ഥാനപതികളായി പ്രവർത്തിക്കുന്നു
  rationale: πρεσβεύω എന്നത് സ്ഥാനപതിയോ ദൂതനോ ആയി പ്രവർത്തിക്കുക എന്നാണ്; വർത്തമാനകാലത്തിന്റെ തുടരുന്ന പ്രവർത്തനഭാവവും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὡς
  choice: പോലെയാണ്
  rationale: അപ്പൊസ്തലന്മാരിലൂടെയുള്ള ദൈവത്തിന്റെ അഭ്യർഥനയെ താരതമ്യരീതിയിൽ അവതരിപ്പിക്കുന്ന ὡς-ന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: παρακαλοῦντος
  choice: അഭ്യർഥിക്കുന്ന
  rationale: അനുരഞ്ജനത്തിന്റെ പശ്ചാത്തലത്തിൽ παρακαλέω-യുടെ ആത്മാർഥവും ക്ഷണാത്മകവുമായ അഭ്യർഥനാഭാവം നൽകുന്നു.
- source_word: δι’ ἡμῶν
  choice: ഞങ്ങളിലൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മാധ്യമത്തെയും പ്രവർത്തനോപാധിയെയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεόμεθα
  choice: ഞങ്ങൾ നിങ്ങളോടു യാചിക്കുന്നു
  rationale: δέομαι-യിലെ തീവ്രവും ആത്മാർഥവുമായ അപേക്ഷയുടെ ബലം ‘യാചിക്കുന്നു’ നിലനിർത്തുന്നു; മലയാളത്തിൽ ആവശ്യമായ കർമപൂരകമായ ‘നിങ്ങളോടു’ വ്യക്തമായി ചേർത്തു.
- source_word: καταλλάγητε
  choice: അനുരഞ്ജിതരാകുക
  rationale: അയോറിസ്റ്റ് പാസീവ് ആജ്ഞയുടെ സ്വീകരണഭാവം പരമാവധി നിലനിർത്തുകയും അനുരഞ്ജനത്തിന്റെ ദൈവശാസ്ത്രപരമായ ആശയം അമിതമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: καταλλάσσω-യ്ക്കുശേഷമുള്ള ഡേറ്റീവ് ദൈവത്തോടുള്ള ബന്ധപരമായ ദിശയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ദൈവത്തോട്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ കേവലം പേരുപോലെയല്ല, അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്. അതിന്റെ സ്ഥാനപ്പേർഭാവം ‘മശീഹാ’ നിലനിർത്തുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: അനുരഞ്ജനത്തിലെ കർത്തൃത്വവും മനുഷ്യപ്രതികരണവും
  choice: ദൈവത്തോട് അനുരഞ്ജിതരാകുക
  alternative: ദൈവവുമായി നിരപ്പിലാകുക
  rationale: ദൈവം അപ്പൊസ്തലന്മാരിലൂടെ അഭ്യർഥിക്കുമ്പോഴും കേൾക്കുന്നവർക്ക് അനുരഞ്ജിതരാകാൻ കല്പന ലഭിക്കുന്നു. ഗ്രീക്കിലെ പാസീവ് ആജ്ഞ സൂചിപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനവും മനുഷ്യപ്രതികരണവും തമ്മിലുള്ള സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘സ്ഥാനപതികളായി പ്രവർത്തിക്കുന്നു’ എന്നത് രൂപകത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; ‘അഭ്യർഥിക്കുന്നു’ എന്നും ‘യാചിക്കുന്നു’ എന്നും ഉപയോഗിച്ച് മൂലത്തിലെ രണ്ടു വ്യത്യസ്ത അപേക്ഷാപദങ്ങളുടെ തീവ്രതാഭേദം പ്രകടമാക്കി. അടിക്കുറിപ്പുകളുടെ ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
