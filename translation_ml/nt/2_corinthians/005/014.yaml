reference: 2 Corinthians 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: ml
  text: 'മശീഹയുടെ സ്നേഹം[a] ഞങ്ങളെ നിർബന്ധിക്കുന്നു; കാരണം, ഞങ്ങൾ ഈ നിഗമനത്തിലെത്തിയിരിക്കുന്നു: ഒരുവൻ എല്ലാവർക്കുവേണ്ടി മരിച്ചു; അതുകൊണ്ട് എല്ലാവരും മരിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹയുടെ സ്നേഹം’ എന്നും ‘മശീഹയോടുള്ള സ്നേഹം’ എന്നും മനസ്സിലാക്കാം; ഗ്രീക്കിലെ സംബന്ധികരൂപം രണ്ടർഥങ്ങൾക്കും ഇടനൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന് സ്വാഭാവികവും ആധുനികവുമായ പൊതുമലയാള തുല്യപദം; പഴഞ്ചൻ ധർമ്മദാനാർഥം ഒഴിവാക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന പദവിയാണ്; അതിനാൽ പദവിയെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി. മലയാളത്തിലെ സംബന്ധികരൂപം ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: συνέχει
  choice: നിർബന്ധിക്കുന്നു
  rationale: ശക്തമായി അമർത്തി നയിക്കുക, ഒരാളുടെ പ്രവർത്തനത്തെ നിയന്ത്രിക്കുന്ന പ്രേരകശക്തിയാകുക എന്നീ സന്ദർഭാർഥങ്ങൾ നൽകുന്നു. ‘പ്രേരിപ്പിക്കുന്നു’ എന്നതിനെക്കാൾ ശക്തവും ‘നിയന്ത്രിക്കുന്നു’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: κρίναντας
  choice: ഞങ്ങൾ ഇതു തീർച്ചപ്പെടുത്തിയിരിക്കുന്നു
  rationale: കാരണബോധമുള്ള വിലയിരുത്തലിലൂടെ ഒരു നിഗമനത്തിലെത്തിയതിനെ സൂചിപ്പിക്കുന്നു; പൂർത്തിയായ നിഗമനത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: തീർച്ചപ്പെടുത്തിയിരിക്കുന്നതിന്റെ ഉള്ളടക്കം ദ്വിബിന്ദുവിലൂടെ അവതരിപ്പിച്ചു
  rationale: ὅτι ഇവിടെ നിഗമനത്തിന്റെ ഉള്ളടക്കം ആരംഭിക്കുന്നു. മലയാളത്തിൽ ‘എന്ന്’ ഉപയോഗിച്ച് നീണ്ട വാക്യം സൃഷ്ടിക്കുന്നതിനുപകരം ദ്വിബിന്ദു വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εἷς
  choice: ഒരുവൻ
  rationale: മൂലത്തിലെ സംക്ഷിപ്തവും ഊന്നലുള്ളതുമായ ‘ഒരാൾ/ഒരുവൻ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘മശീഹ’ എന്ന് വിശദീകരിച്ച് ചേർക്കുന്നില്ല.
- source_word: ὑπὲρ πάντων
  choice: എല്ലാവർക്കുംവേണ്ടി
  rationale: ὑπέρ എന്നതിലെ പ്രതിനിധിത്വപരമായ ‘വേണ്ടി/നിമിത്തം’ എന്ന ആശയം നൽകുന്നു; ‘എല്ലാവർക്കും പകരം’ എന്നു പറഞ്ഞ് ഒരു പ്രത്യേക പ്രായശ്ചിത്തവ്യാഖ്യാനം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള പൗലോസിന്റെ നിഗമനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ πάντες
  choice: എല്ലാവരും
  rationale: മൂലത്തിലെ കൂട്ടത്തെ അധിക വിശദീകരണമില്ലാതെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: ἀπέθανον
  choice: മരിച്ചു
  rationale: അയോറിസ്റ്റിന്റെ സംക്ഷിപ്തമായ ഭൂതകാലപ്രസ്താവന നിലനിർത്തുന്നു; പങ്കാളിത്തമരണത്തെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ Χριστοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘മശീഹയുടെ സ്നേഹം’ എന്നു നൽകി ബന്ധം ഔപചാരികമായി നിലനിർത്തി.
  alternative: ‘മശീഹയ്ക്കു നമ്മോടുള്ള സ്നേഹം’ അല്ലെങ്കിൽ ‘നമുക്കു മശീഹയോടുള്ള സ്നേഹം’.
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് കർത്തൃബന്ധമായോ കർമബന്ധമായോ മനസ്സിലാക്കാം. സന്ദർഭം അതിനെ നിർബന്ധമായി തീർപ്പാക്കാത്തതിനാൽ പ്രധാനവാചകത്തിൽ വ്യാഖ്യാനം ചുമത്താതെ, സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ‘എല്ലാവരും മരിച്ചു’ എന്നതിന്റെ വ്യാപ്തിയും അർഥവും
  choice: വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ ‘എല്ലാവരും മരിച്ചു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാവരും മശീഹയിൽ പ്രതിനിധിത്വപരമായി മരിച്ചു; അല്ലെങ്കിൽ എല്ലാ വിശ്വാസികളും അവനോടുകൂടെ മരിച്ചു.
  rationale: മശീഹയുടെ മരണത്തിലുള്ള പ്രതിനിധിത്വപരമായ പങ്കാളിത്തം പൗലോസിന്റെ ചുരുക്കിയ ന്യായത്തിൽ ഉൾപ്പെട്ടിരിക്കാം. എന്നാൽ ഈ വാക്യം അതിന്റെ വ്യാപ്തി വിശദീകരിക്കാത്തതിനാൽ പരിഭാഷയും അതേ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മശീഹ’ എന്ന പദവിവർത്തനം നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ ചുരുക്കവും യഥാർഥമായ അവ്യക്തതയും വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിച്ചു.
