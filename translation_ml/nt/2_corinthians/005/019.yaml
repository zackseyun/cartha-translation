id: 2CO.5.19
reference: 2 Corinthians 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: ml
  text: അതായത്, ദൈവം മശീഹയിൽ[a] ലോകത്തെ തന്നോടു അനുരഞ്ജിപ്പിക്കുകയായിരുന്നു; അവരുടെ ലംഘനങ്ങൾ അവർക്കെതിരെ കണക്കാക്കാതെ, അനുരഞ്ജനത്തിന്റെ സന്ദേശം ഞങ്ങൾക്ക് ഏൽപ്പിക്കുകയും ചെയ്തു[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ലോകത്തെ തന്നോടു അനുരഞ്ജിപ്പിച്ചുകൊണ്ടിരുന്ന ദൈവം മശീഹയിൽ ആയിരുന്നു.”'
    reason: ഗ്രീക്ക് വാക്യഘടനയിൽ “മശീഹയിൽ” എന്നത് ദൈവത്തിന്റെ “ആയിരുന്നു” എന്ന നിലയോടോ അനുരഞ്ജനപ്രവർത്തനത്തോടോ കൂടുതൽ അടുത്ത് ബന്ധിപ്പിക്കാവുന്നതാണ്.
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “ഞങ്ങളിൽ വെച്ചു”; “ഞങ്ങളുടെ ഇടയിൽ സ്ഥാപിച്ചു” അഥവാ “ഞങ്ങൾക്ക് ഏൽപ്പിച്ചു” എന്നും മനസ്സിലാക്കാം.'
    reason: ἐν ἡμῖν എന്നതിന് “ഞങ്ങളിൽ,” “ഞങ്ങളുടെ ഇടയിൽ,” അല്ലെങ്കിൽ സന്ദർഭാർഥത്തിൽ “ഞങ്ങൾക്ക്” എന്നിങ്ങനെ ഗ്രഹിക്കാം.
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: “അനുരഞ്ജനത്തിന്റെ വചനം.”'
    reason: λόγος എന്നതിന് “വചനം/വാക്ക്” എന്നും “സന്ദേശം” എന്നും അർഥമാകാം; ഇവിടെ മുഖ്യവാചകത്തിൽ പ്രഖ്യാപിക്കപ്പെടുന്ന സന്ദേശം എന്ന അർഥം സ്വീകരിച്ചു.
lexical_decisions:
- source_word: ὡς ὅτι
  choice: അതായത്
  rationale: മുൻവാക്യത്തിലെ ആശയം വിശദീകരിച്ച് അതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന പ്രയോഗമായി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകി.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: ദൈവം മശീഹയിൽ ... അനുരഞ്ജിപ്പിക്കുകയായിരുന്നു
  rationale: ἦν എന്ന ക്രിയയും വർത്തമാന കൃദന്തമായ καταλλάσσων-ഉം ചേർന്ന തുടർച്ചയായ ദൈവിക പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ἐν Χριστῷ എന്നതിലെ ‘മശീഹയിൽ’ എന്ന ബന്ധം വ്യാഖ്യാനിച്ച് ‘മുഖാന്തരം’ എന്നു മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: κόσμον
  choice: ലോകത്തെ
  rationale: സന്ദർഭത്തിലെ വ്യാപകമായ മാനവലോകത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ പദം.
- source_word: καταλλάσσων / καταλλαγῆς
  choice: അനുരഞ്ജിപ്പിക്കുകയായിരുന്നു / അനുരഞ്ജനത്തിന്റെ
  rationale: ബന്ധത്തിലെ ശത്രുത നീക്കി വീണ്ടും യോജിപ്പിക്കുന്ന ആശയം പ്രകടിപ്പിക്കുകയും ഒരേ ഗ്രീക്ക് പദകുടുംബത്തിന്റെ ബന്ധം മലയാളത്തിലും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἑαυτῷ
  choice: തന്നോടു
  rationale: അനുരഞ്ജനത്തിന്റെ ദിശ ദൈവത്തിലേക്കാണെന്ന് പ്രതിഫലിപ്പിക്കുന്ന ആത്മവാചക ദത്തിവിന്റെ നേരിട്ടുള്ള രൂപം.
- source_word: μὴ λογιζόμενος
  choice: കണക്കിടാതെ
  rationale: കണക്കുപുസ്തകസംബന്ധമായ രൂപകം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; ഭാരമേറിയ സാങ്കേതിക ദൈവശാസ്ത്രപദം ഒഴിവാക്കുന്നു.
- source_word: παραπτώματα
  choice: അതിക്രമങ്ങൾ
  rationale: അതിര് ലംഘിക്കുന്ന തെറ്റായ പ്രവൃത്തികൾ എന്ന παράπτωμα-യുടെ പ്രത്യേക ഭാവം ‘പാപങ്ങൾ’ എന്ന കൂടുതൽ വ്യാപകമായ പദത്തേക്കാൾ നന്നായി സൂക്ഷിക്കുന്നു.
- source_word: θέμενος ἐν ἡμῖν
  choice: ഞങ്ങളെ ഭരമേൽപ്പിക്കുകയും ചെയ്തു
  rationale: അക്ഷരാർഥമായ ‘ഞങ്ങളിൽ വെച്ചു’ എന്ന അസ്വാഭാവിക മലയാളത്തിനു പകരം സന്ദേശം ഏൽപ്പിച്ചുവെന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; ἐν ἡμῖν എന്നതിന്റെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: അനുരഞ്ജനത്തിന്റെ സന്ദേശം
  rationale: λόγος ഇവിടെ ഒറ്റ ‘വാക്ക്’ എന്നതിലുപരി പ്രഖ്യാപിക്കപ്പെടുന്ന ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സന്ദേശം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: θεὸς ἦν ἐν Χριστῷ എന്ന വാക്യഘടനയുടെ വ്യാഖ്യാനം
  choice: ദൈവം മശീഹയിൽ ലോകത്തെ തന്നോടു അനുരഞ്ജിപ്പിക്കുകയായിരുന്നു
  alternative: ദൈവം മശീഹയിൽ ആയിരുന്നു; ലോകത്തെ തന്നോടു അനുരഞ്ജിപ്പിച്ചുകൊണ്ട്
  rationale: മുഖ്യവാചകം ഗ്രീക്കിലെ തുടർച്ചയായ പ്രവർത്തനത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുമ്പോഴും ‘മശീഹയിൽ’ എന്നത് ‘മശീഹ മുഖാന്തരം’ എന്നു വ്യാഖ്യാനിച്ച് തീർക്കുന്നില്ല. ‘ദൈവം മശീഹയിൽ ആയിരുന്നു’ എന്ന അടുക്കുള്ള വാക്യഘടന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: Χριστῷ എന്ന പദവിനാമത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: അഭിഷിക്തൻ എന്ന പദവിയുടെ അർഥം വ്യക്തമാക്കുകയും ഇവിടെ അതിനെ വെറും വ്യക്തിനാമമായി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἐν ἡμῖν എന്നതിന്റെ ബന്ധാർഥം
  choice: ഞങ്ങളെ ഭരമേൽപ്പിച്ചു
  alternative: ഞങ്ങളിൽ വെച്ചു / ഞങ്ങളുടെ ഇടയിൽ സ്ഥാപിച്ചു
  rationale: ശുശ്രൂഷാസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; ‘ഞങ്ങളിൽ’ എന്ന അക്ഷരാർഥവും അതിലെ വ്യക്തിപരമോ സമൂഹപരമോ ആയ തുറന്ന സാധ്യതയും അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനുരഞ്ജനം’ എന്ന പദം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും καταλλάσσω/καταλλαγή പദകുടുംബത്തിന്റെ ആവർത്തനം സൂക്ഷിക്കുന്നതുമാണ്. അർധവിരാമം ദൈവത്തിന്റെ അനുരഞ്ജനപ്രവർത്തനവും അതിനോടു ചേർന്ന രണ്ട് കൃദന്തപ്രയോഗങ്ങളും വ്യക്തമായി വേർതിരിക്കുന്നു.
