id: 2CO.5.15
reference: 2 Corinthians 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: ml
  text: അവൻ എല്ലാവർക്കുവേണ്ടി[a] മരിച്ചു; അതിനാൽ ജീവിക്കുന്നവർ ഇനി തങ്ങൾക്കുവേണ്ടിയല്ല, മറിച്ച് അവർക്കുവേണ്ടി മരിക്കുകയും ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തവനുവേണ്ടി[b] ജീവിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാവരുടെയും പ്രതിനിധിയായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ വാക്യത്തിലെ ‘വേണ്ടി’ എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും ὑπέρ എന്ന ഒരേ ഗ്രീക്ക് പദമാണ്; അത് പ്രതിനിധാനത്തെയോ മറ്റുള്ളവർക്കുണ്ടാകുന്ന പ്രയോജനത്തെയോ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉയിർപ്പിക്കപ്പെട്ടു’ എന്ന ഗ്രീക്ക് രൂപം കർമണിയാണ്; ‘ഉയിർത്തെഴുന്നേറ്റവൻ’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: എല്ലാവർക്കുംവേണ്ടി
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπέρ പ്രതിനിധാനമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നു. ‘എല്ലാവർക്കുംവേണ്ടി’ സ്വാഭാവികമായ മലയാളത്തിൽ ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀπέθανεν
  choice: അവൻ ... മരിച്ചു
  rationale: അഓറിസ്റ്റ് ഇൻഡിക്കേറ്റീവ് കഴിഞ്ഞകാലത്തിലെ സംഭവത്തെ ലളിതമായി പ്രസ്താവിക്കുന്നു. ഗ്രീക്കിൽ ക്രിയാരൂപത്തിലും സന്ദർഭത്തിലും ഉൾപ്പെട്ടിരിക്കുന്ന കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമായി ചേർത്തു.
- source_word: ἵνα
  choice: ജീവിക്കേണ്ടതിന്
  rationale: ἵνα ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളുന്ന ബന്ധം അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ പ്രയോഗം ക്രിസ്തുവിന്റെ മരണത്തിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു; വെറും ധാർമിക കല്പനയായി മാത്രം മാറ്റുന്നില്ല.
- source_word: οἱ ζῶντες
  choice: ജീവിക്കുന്നവർ
  rationale: നാമപ്രയോഗമായ വർത്തമാന കൃദന്തത്തെ നേരിട്ട്, എന്നാൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു. ശാരീരികമോ ആത്മീയമോ ആയ അർഥം മാത്രം നിർബന്ധിക്കാതെ സന്ദർഭത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: μηκέτι
  choice: ഇനി ... അല്ല
  rationale: മുമ്പുണ്ടായിരുന്ന ജീവിതദിശ അവസാനിക്കണമെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἑαυτοῖς ζῶσιν
  choice: തങ്ങൾക്കുവേണ്ടി ... ജീവിക്കുക
  rationale: പ്രതിഫലന ദത്തീവിനോടുകൂടിയ ζάω ഇവിടെ ജീവിതത്തിന്റെ സ്വയംകേന്ദ്രിത ദിശയെ സൂചിപ്പിക്കുന്നു. ‘തങ്ങൾക്കുവേണ്ടി’ ഈ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: മറിച്ച് ... മരിച്ച് ഉയിർപ്പിക്കപ്പെട്ടവനുവേണ്ടി
  rationale: 'മുമ്പുള്ള ‘ജീവിക്കുക’ എന്ന ക്രിയയുടെ ദിശ ഇവിടെ തുടരുന്നു: തങ്ങൾക്കുവേണ്ടിയല്ല, മറ്റൊരുവനുവേണ്ടി. ഏക ആർട്ടിക്കിളിന് കീഴിലുള്ള രണ്ടു കൃദന്തരൂപങ്ങളെയും ഒരേ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്നതായി മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.'
- source_word: ἐγερθέντι
  choice: ഉയിർപ്പിക്കപ്പെട്ടവൻ
  rationale: ഗ്രീക്കിലെ ദൈവിക കർമണി രൂപം നിലനിർത്തുന്നു. ‘ഉയിർത്തെഴുന്നേറ്റവൻ’ എന്ന കർത്തരി പ്രയോഗത്തേക്കാൾ ഉറവിടത്തിലെ വ്യാകരണസ്വരം ഇതിൽ വ്യക്തമാണ്.
- source_word: ὑπὲρ αὐτῶν
  choice: തങ്ങൾക്കുവേണ്ടി
  rationale: ആദ്യത്തെ ὑπέρ എന്നതുമായി ‘വേണ്ടി’ എന്ന ആവർത്തനം നിലനിർത്തുന്നു. αὐτῶν എന്ന സർവനാമത്തിന്റെ പൂർവപദം ‘ജീവിക്കുന്നവർ’ ആയതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രതിഫലനരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: πάντων / αὐτῶν എന്നതിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാവരും’, ‘തങ്ങൾ’ എന്ന വിശാലമായ ഭാഷ യാതൊരു ചുരുക്കവും കൂടാതെ നിലനിർത്തി.
  alternative: ഇത് നിയന്ത്രണമില്ലാതെ സകല മനുഷ്യരെയും സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ സന്ദർഭത്തിലെ വിശ്വാസികളെയോ ക്രിസ്തു പ്രതിനിധീകരിക്കുന്ന എല്ലാവരെയോ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: ഈ വാക്യം തന്നിൽ ‘എല്ലാവരും’ എന്നതിന്റെ പരിധിയെക്കുറിച്ചുള്ള പിൽക്കാല ദൈവശാസ്ത്രവാദം തീർപ്പാക്കുന്നില്ല. അതിനാൽ ഒരു വിഭാഗീയ നിഗമനവും പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: ἐγερθέντι എന്നതിലെ ഉയിർപ്പിന്റെ വ്യാകരണസ്വരം
  choice: കർമണി നിലനിർത്തി ‘ഉയിർപ്പിക്കപ്പെട്ടവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഉയിർത്തെഴുന്നേറ്റവൻ’ എന്ന കർത്തരി പ്രയോഗം.
  rationale: കർമണി രൂപം ഗ്രീക്കിനോട് അടുത്തുനിൽക്കുകയും ഉയിർപ്പിൽ ദൈവത്തിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന പുതിയനിയമത്തിലെ സാധാരണ ഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു; കർത്തരി പ്രയോഗം മറ്റു സന്ദർഭങ്ങളിൽ സാധുവാകാമെന്നത് ഇതു നിഷേധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ ഉദ്ദേശ്യബന്ധം വ്യക്തമാക്കാൻ അധീനവാക്യം ആദ്യം വച്ചു. ‘മറിച്ച്’ എന്നത് ἀλλάയുടെ ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു. സംയുക്തകൃതന്തമായ ‘മരിച്ച് ഉയിർപ്പിക്കപ്പെട്ടവൻ’ വായനാസൗകര്യവും ഉറവിടത്തിലെ ഏക വ്യക്തിയിലേക്കുള്ള സൂചനയും സംരക്ഷിക്കുന്നു.
