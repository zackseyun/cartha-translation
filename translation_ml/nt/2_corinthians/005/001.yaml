source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: ml
  text: കാരണം, ഭൂമിയിലുള്ള നമ്മുടെ കൂടാരഭവനം അഴിച്ചുനീക്കപ്പെട്ടാൽ[a], ദൈവത്തിൽനിന്നുള്ള ഒരു കെട്ടിടം—മനുഷ്യകൈകളാൽ നിർമിക്കപ്പെടാത്ത[b], സ്വർഗങ്ങളിൽ നിത്യമായ ഒരു ഭവനം—നമുക്കുണ്ട്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തകർക്കപ്പെട്ടാൽ’ അല്ലെങ്കിൽ ‘ഇടിച്ചുകളയപ്പെട്ടാൽ’. ഈ ക്രിയയ്ക്ക് ഒരു ഘടന അഴിച്ചുമാറ്റുന്നതെന്ന അർത്ഥവും വരാം; അത് കൂടാരത്തിന്റെ ചിത്രത്തോട് യോജിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘കൈകളാൽ നിർമിക്കപ്പെടാത്ത’. മനുഷ്യനിർമാണമല്ലാത്ത, ദൈവിക ഉത്ഭവമുള്ള ഒന്നിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘നമുക്കുണ്ട്’ എന്നാണ്, ‘നമുക്കുണ്ടാകും’ എന്നല്ല; ഇപ്പോഴത്തെ ഉടമസ്ഥതയും ഭാവിയിലെ സാക്ഷാത്കാരവും തമ്മിലുള്ള പിരിമുറുക്ക് ഇതിൽ നിലനിൽക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: നമുക്കറിയാം
  rationale: οἴδαμεν ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നു. γάρ മുൻവാക്യവുമായി കാരണാത്മകമായി ബന്ധിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക ബന്ധം നിലനിർത്താൻ വാക്യക്രമവും ചിഹ്നനവും ഉപയോഗിച്ചു.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: ഭൂമിയിലുള്ള നമ്മുടെ കൂടാരഭവനം
  rationale: οἰκία എന്ന ‘ഭവനം’ എന്ന ചിത്രവും σκῆνος എന്ന ‘കൂടാരം’ എന്ന ചിത്രവും ഒന്നിച്ചുതന്നെ നിലനിർത്തുന്നു; അതിനെ നേരിട്ട് ‘ശരീരം’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐὰν ... καταλυθῇ
  choice: '... അഴിച്ചുകളയപ്പെട്ടാൽ'
  rationale: ഭാവിയിലെ ഒരു സാധ്യതയെ ἐάν സൂചിപ്പിക്കുന്നു. καταλύω ഒരു ഘടന അഴിച്ചുമാറ്റുന്നതിനെയോ ഇടിച്ചുകളയുന്നതിനെയോ സൂചിപ്പിക്കാം; കൂടാരചിത്രത്തോട് ‘അഴിച്ചുകളയുക’ നന്നായി ചേരുന്നു.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള ഒരു കെട്ടിടം
  rationale: οἰκοδομή ഇവിടെ മൂർത്തമായ ഒരു നിർമിതിയെ സൂചിപ്പിക്കുന്നു; ἐκ θεοῦ എന്ന ഉത്ഭവസൂചന നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἔχομεν
  choice: നമുക്കുണ്ട്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം ഭാവികാലമാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: οἰκίαν ἀχειροποίητον
  choice: മനുഷ്യകൈകളാൽ നിർമിക്കപ്പെടാത്ത ഒരു ഭവനം
  rationale: ἀχειροποίητος എന്നത് മനുഷ്യനിർമാണമല്ലാത്ത ദൈവിക ഉത്ഭവത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗമാണ്; മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി ‘മനുഷ്യകൈകളാൽ’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: αἰώνιον ἐν τοῖς οὐρανοῖς
  choice: സ്വർഗങ്ങളിൽ നിത്യമായുള്ളത്
  rationale: αἰώνιον എന്ന ദൈർഘ്യവും οὐρανοῖς എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വാസസ്ഥലചിത്രങ്ങളുടെ സൂചിതാർത്ഥം
  choice: ‘കൂടാരഭവനം’, ‘കെട്ടിടം’, ‘ഭവനം’ എന്നീ മൂലപാഠത്തിലെ ചിത്രങ്ങൾ നിലനിർത്തുക.
  alternative: ‘ഭൗമിക ശരീരം’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്യുക.
  rationale: ‘ശരീരം’ സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും, അങ്ങനെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നത് പൗലോസിന്റെ പാളികളുള്ള വാസസ്ഥലരൂപകത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കും.
- issue: ἔχομεν എന്നതിന്റെ കാലസൂചന
  choice: വർത്തമാനകാലത്തിൽ ‘നമുക്കുണ്ട്’ എന്നു നൽകുക.
  alternative: ‘നമുക്കുണ്ടാകും’ എന്നു ഭാവികാലത്തിൽ നൽകുക.
  rationale: ഭാവിയിൽ സാക്ഷാത്കരിക്കപ്പെടുന്ന കാര്യം ഉറപ്പോടെ ഇപ്പോൾ സ്വന്തമായിരിക്കുന്നതായി പറയുന്നതാണോ എന്ന വ്യാഖ്യാനചോദ്യം തുറന്നുവെച്ച്, ഗ്രീക്കിലെ വർത്തമാനകാലം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘കൂടാരഭവനം’ എന്ന സംയുക്തപദം അല്പം അപൂർവമാണെങ്കിലും മൂലത്തിലെ οἰκία/σκῆνος ഇരട്ടചിത്രം ചുരുക്കാതെ സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു. ‘സ്വർഗങ്ങളിൽ’ എന്ന ബഹുവചനം ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു.
