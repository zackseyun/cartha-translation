id: 2CO.5.3
reference: 2 Corinthians 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂εἴ γε⸃ καὶ ⸀ἐνδυσάμενοι οὐ γυμνοὶ εὑρεθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/003.yaml
  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: ml
  text: തീർച്ചയായും, ധരിച്ചവരായാൽ നാം നഗ്നരായി കാണപ്പെടുകയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “തീർച്ചയായും, ധരിച്ചശേഷം നാം വസ്ത്രമില്ലാത്തവരായി കാണപ്പെടുകയില്ല.” ചില കൈയെഴുത്തുപ്രതികളിൽ “തീർച്ചയായും എങ്കിൽ” എന്നതിന് തുല്യമായ പദങ്ങൾ ഇല്ല.'
    reason: εἴ γε has conditional and emphatic force; “വസ്ത്രമില്ലാത്തവരായി” is a lexical alternative for “നഗ്നരായി.” The textual note reflects the bracketed εἴ γε in SBLGNT without resolving the variant in the main text.
lexical_decisions:
- source_word: εἴ γε
  choice: വാസ്തവത്തിൽ
  rationale: സന്ദർഭത്തിൽ സോപാധികതയോടൊപ്പം ഉറപ്പുനൽകുന്ന ഊന്നലും ഈ പ്രയോഗത്തിനുണ്ട്. സ്വാഭാവികമായ മലയാളത്തിൽ ‘വാസ്തവത്തിൽ’ ആ ഊന്നൽ നൽകുന്നു; പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: καὶ ἐνδυσάμενοι
  choice: ധരിച്ചവരായിരിക്കുമ്പോൾ
  rationale: ἐνδυσάμενοι എന്ന എയോറിസ്റ്റ് മധ്യമപ്രയോഗം ‘ധരിച്ചശേഷം/ധരിച്ചവരായി’ എന്ന മുൻകാലാവസ്ഥ സൂചിപ്പിക്കുന്നു. വസ്ത്രധാരണരൂപകം നിലനിർത്തിക്കൊണ്ട് ഭാവിക്രിയയുമായുള്ള ബന്ധം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐ
  choice: —ഇല്ല
  rationale: ഭാവികാല നിഷ്ക്രിയക്രിയയുടെ സാധാരണ നിഷേധം മലയാളത്തിൽ ക്രിയാന്ത്യത്തിലെ ‘ഇല്ല’കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: γυμνοὶ
  choice: നഗ്നരായി
  rationale: വസ്ത്രധാരണരൂപകത്തോട് നേരിട്ട് പൊരുത്തപ്പെടുന്ന അർഥം; ‘വസ്ത്രമില്ലാത്തവരായി’ എന്ന വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: εὑρεθησόμεθα
  choice: നാം ... കാണപ്പെടുകയില്ല
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപം നേരിട്ട് നിലനിർത്തുന്നു; ‘ആയിത്തീരും’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മാറ്റുന്നില്ല.
theological_decisions:
- issue: വസ്ത്രധാരണം/നഗ്നത എന്ന രൂപകത്തിന്റെ അർഥം
  choice: രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘നഗ്നർ’ എന്നത് ദേഹരഹിതമായ ഇടക്കാലാവസ്ഥയെയോ സ്വർഗീയശരീരമില്ലായ്മയെയോ ദൈവസന്നിധിയിലെ ലജ്ജയെയോ സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം രൂപകത്തിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ സൂചന നിർവചിക്കുന്നില്ല; അതിനാൽ അതിലെ അവ്യക്തതയും സംഘർഷവും പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- issue: εἴ γε എന്നതിന്റെ പാഠപരവും അർഥപരവുമായ അനിശ്ചിതത്വം
  choice: പ്രധാനപാഠത്തിൽ ഉറപ്പുനൽകുന്ന ‘വാസ്തവത്തിൽ’ സ്വീകരിച്ചു; സോപാധികമായ വായന അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘തീർച്ചയായും എങ്കിൽ’ അല്ലെങ്കിൽ ‘യഥാർഥത്തിൽ എങ്കിൽ’ എന്ന സോപാധിക പരിഭാഷ പ്രധാനപാഠത്തിൽ നൽകുക.
  rationale: SBLGNT-യിലെ ⸂εἴ γε⸃ പാഠഭേദസൂചനയും പ്രയോഗത്തിന്റെ conditional/confirmatory ഇരട്ടസാധ്യതയും വായനക്കാരന് മറച്ചുവെക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ധരിക്കുക—നഗ്നർ’ എന്ന പൗലോസിന്റെ രൂപകശൃംഖല നിലനിർത്തി; അതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന നിർണ്ണയിച്ചിട്ടില്ല.
