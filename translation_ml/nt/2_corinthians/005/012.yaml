id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: ml
  text: ഞങ്ങൾ വീണ്ടും നിങ്ങളോടു ഞങ്ങളെത്തന്നെ ശുപാർശ ചെയ്യുകയല്ല; മറിച്ച്, ഞങ്ങളെക്കുറിച്ച് അഭിമാനിക്കാൻ നിങ്ങൾക്ക് അവസരം നൽകുകയാണ്[a]. അങ്ങനെ, ഹൃദയത്തിൽ അല്ല, പുറമേ കാണുന്നതിൽ അഭിമാനിക്കുന്നവർക്കു മറുപടി പറയാൻ നിങ്ങൾക്കു കഴിയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞങ്ങൾക്കുവേണ്ടി അഭിമാനിക്കാൻ നിങ്ങൾക്ക് ഒരു അവസരം (അഥവാ അടിസ്ഥാനം) നൽകുകയാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ὑπὲρ എന്നത് ‘ഞങ്ങളെക്കുറിച്ച്’ എന്ന വിഷയാർഥത്തോടൊപ്പം ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്ന പ്രതിനിധാനാർഥവും അനുവദിക്കുന്നു; ἀφορμήയ്ക്ക് ‘അടിസ്ഥാനം/സന്ദർഭം’ എന്ന അർഥവും സാധ്യമാണ്.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘മുഖത്തിൽ അഭിമാനിക്കുന്നവരും ഹൃദയത്തിൽ അല്ലാത്തവരും’; പുറംകാഴ്ചയും ആന്തരിക യാഥാർഥ്യവും തമ്മിലുള്ള വിരോധമാണ് സൂചന.
    reason: ഗ്രീക്കിലെ ‘മുഖം’–‘ഹൃദയം’ എന്ന സംക്ഷിപ്തവും അല്പം ദ്വയാർഥസാധ്യതയുള്ളതുമായ പ്രയോഗം വായനക്കാരനു കാണിക്കുന്നു.
lexical_decisions:
- source_word: συνιστάνομεν
  choice: ശുപാർശ ചെയ്യുകയല്ല
  rationale: ഈ സന്ദർഭത്തിൽ സ്വയം യോഗ്യരെന്നു അവതരിപ്പിക്കുകയോ അംഗീകാരത്തിനായി സ്വയം ശുപാർശ ചെയ്യുകയോ ചെയ്യുന്നതാണ് അർഥം; ‘ശുപാർശ ചെയ്യുക’ പൗലോസിന്റെ ആത്മപ്രശംസനിഷേധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀφορμὴν
  choice: അവസരം
  rationale: തുടക്കക്കുറി, സന്ദർഭം, അവസരം, അടിസ്ഥാനം എന്നീ അർഥസാധ്യതകളിൽ ഇവിടെ കൊരിന്ത്യർക്കു പ്രതികരിക്കാനുള്ള വക നൽകുന്നതിനെ ‘അവസരം’ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: καυχήματος
  choice: അഭിമാനിക്കാൻ
  rationale: καύχημα എന്നതിലെ പ്രശംസയുടെയും അഭിമാനത്തിന്റെയും അർഥമേഖല നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ക്രിയാരൂപം സ്വാഭാവികമായ വാക്യം നൽകുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: ഞങ്ങളെക്കുറിച്ച്
  rationale: ഇവിടെ പൗലോസിനെയും സഹപ്രവർത്തകരെയും കുറിച്ച് അനുകൂലമായി പറയുക എന്ന ആശയം ഉണ്ട്. ‘ഞങ്ങളെക്കുറിച്ച്’ വിഷയം സൂചിപ്പിക്കുമ്പോൾ സന്ദർഭത്തിലെ പ്രതിരോധഭാവവും അനുവദിക്കുന്നു; ‘ഞങ്ങൾക്കുവേണ്ടി’ എന്ന പ്രതിനിധാനാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἵνα ἔχητε πρὸς
  choice: മറുപടി പറയാൻ നിങ്ങൾക്കു കഴിയും
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിൽ എതിരാളികളോടു പറയാൻ എന്തെങ്കിലും ഉണ്ടായിരിക്കുക എന്ന സൂചനയുണ്ട്; മലയാളത്തിൽ അതിനെ അമിതവ്യാഖ്യാനം കൂടാതെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν προσώπῳ
  choice: പുറമേ കാണുന്നതിൽ
  rationale: അക്ഷരാർഥമായ ‘മുഖത്തിൽ’ എന്നതിലുപരി, καρδίᾳ എന്നതിനോടുള്ള വിരോധത്തിൽ ബാഹ്യമായി ദൃശ്യമാകുന്നതാണ് ഉദ്ദേശ്യം; ഈ ഭാഷാന്തരം ആ വിരോധം വ്യക്തമാക്കുന്നു.
- source_word: καυχωμένους
  choice: അഭിമാനിക്കുകയും
  rationale: മുൻപത്തെ καυχήματος എന്ന പദവുമായുള്ള വാചകബന്ധം ‘അഭിമാനിക്കുക’ ആവർത്തിക്കുന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: καρδίᾳ
  choice: ഹൃദയത്തിലുള്ളതിൽ
  rationale: ‘ഹൃദയം’ എന്ന ഉറവിടരൂപകം നിലനിർത്തിക്കൊണ്ട് പുറംകാഴ്ചയ്ക്കു വിരുദ്ധമായ ആന്തരിക യാഥാർഥ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മുമ്പുണ്ടായിരുന്നുവെന്നോ ആരോപിക്കപ്പെട്ടിരുന്നുവെന്നോ ഉള്ള സ്വയം ശുപാർശയുടെ ആവർത്തനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ എന്ന വിരോധത്തിന്റെ അർഥം
  choice: പുറമേ കാണുന്നതും ഹൃദയത്തിലുള്ളതും തമ്മിലുള്ള വിരോധം
  alternative: പൊതുസൽപ്പേരും ആത്മാർഥതയും തമ്മിലുള്ള വിരോധം; നേരിട്ടുള്ള സാന്നിധ്യവും ആന്തരിക മനോഭാവവും തമ്മിലുള്ള വിരോധം
  rationale: സന്ദർഭത്തിലെ ബാഹ്യപ്രകടനവും ആന്തരിക യാഥാർഥ്യവും തമ്മിലുള്ള ധാർമിക-ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു; ‘ഹൃദയം’ എന്ന ഉറവിടരൂപകത്തെ നീക്കുകയോ അതിനെ ഒരു പ്രത്യേക ഉപദേശമായി ചുരുക്കുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്കു ഗ്രാഹ്യവുമായ ശൈലി. ‘ശുപാർശ’, ‘അഭിമാനം’, ‘ഹൃദയം’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ പുറം–അകം വിരോധം സ്വാഭാവികമാക്കുമ്പോഴും അതിന്റെ രൂപകവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തി.
