  naturalness: മുഴുവൻ വാക്യവും ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തമാണ്. ‘ഹൃദയത്തിൽ അല്ല’ എന്നു മാറ്റുമ്പോൾ പുറം–അകം വിരോധം കൂടുതൽ സ്വാഭാവികമായും കൃത്യമായും വരും.
  terminology: ‘ശുപാർശ ചെയ്യുക,’ ‘അവസരം,’ ‘അഭിമാനിക്കുക,’ ‘ഹൃദയം’ എന്നിവ ഉചിതമാണ്. ‘പുറമേ കാണുന്നതിൽ’ എന്നത് ἐν προσώπῳ-യുടെ സന്ദർഭാർഥം നന്നായി നൽകുന്നു; അടിക്കുറിപ്പിൽ അക്ഷരാർഥമായ ‘മുഖത്തിൽ’ സൂക്ഷിക്കണം.
