id: 2CO.5.5
reference: 2 Corinthians 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: ml
  text: ഈ കാര്യത്തിനായിത്തന്നെ നമ്മെ ഒരുക്കിയവൻ ദൈവമാണ്; ആത്മാവിന്റെ അച്ചാരം[a][b] നമുക്കു നൽകിയതും അവിടുന്നാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അച്ചാരം’ എന്നതിന് ‘ഉറപ്പ്’, ‘നിക്ഷേപം’, അല്ലെങ്കിൽ ‘ആദ്യഗഡു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഈ പ്രയോഗം ആത്മാവുതന്നെയാണ് അച്ചാരം എന്നു അർത്ഥമാക്കാം; അല്ലെങ്കിൽ, ആത്മാവ് വരുത്തുന്ന ഭാവിപൂർത്തീകരണത്തിന് ഉറപ്പുനൽകുന്ന ഒരു അച്ചാരം ദൈവം നൽകിയിരിക്കുന്നു എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: ഒരുക്കിയവൻ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞിരിക്കുന്ന ഭാവിയിലെ ദേഹാവസ്ഥയ്ക്കായി ദൈവം വിശ്വാസികളെ ഉദ്ദേശ്യപൂർവം സജ്ജരാക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς αὐτὸ τοῦτο
  choice: ഈ കാര്യത്തിനായിത്തന്നെ
  rationale: αὐτὸ τοῦτο നൽകുന്ന ഊന്നൽ നിലനിർത്തിക്കൊണ്ട്, തൊട്ടുമുമ്പ് പറഞ്ഞ കാര്യത്തിലേക്കു വ്യക്തമായി വിരൽചൂണ്ടുന്നു.
- source_word: θεός
  choice: ദൈവമാണ്
  rationale: ഗ്രീക്കിൽ ഒരുക്കിയവൻ ആരെന്നു തിരിച്ചറിയിക്കുന്ന നാമപദത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: δοὺς
  choice: നൽകിയതും അവിടുന്നാണ്
  rationale: കർത്താവ് ദൈവം തന്നെയാണെന്ന ബന്ധം വ്യക്തമാക്കുകയും ഗ്രീക്ക് കൃദ്യന്തരൂപത്തെ സ്വാഭാവികമായ മലയാളവാക്യമായി മാറ്റുകയും ചെയ്യുന്നു.
- source_word: ἀρραβῶνα
  choice: അച്ചാരം
  rationale: ശേഷിക്കുന്നതു ലഭിക്കുമെന്നുറപ്പുനൽകുന്ന ആദ്യഗഡു അഥവാ മുൻകൂർ നിക്ഷേപം എന്ന വ്യാപാരരൂപകം ചുരുക്കമായും ഗൗരവമായും നിലനിർത്തുന്ന പദമാണ്.
- source_word: τοῦ πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം അതേപടി സൂക്ഷിച്ച്, ആത്മാവുതന്നെയാണ് അച്ചാരം എന്നോ ആത്മാവുമായി ബന്ധപ്പെട്ട അച്ചാരമാണെന്നോ ഉള്ള സാധ്യതകളിൽ ഒന്നിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, നേരിയ വാക്യബന്ധമാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ പോലൊരു ശക്തമായ ബന്ധകം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘ആത്മാവിന്റെ അച്ചാരം’ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ഗ്രീക്ക് ജനിറ്റീവിന്റെ തുറന്ന ഘടന മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘അച്ചാരമായി പരിശുദ്ധാത്മാവിനെ നൽകി’ എന്നു പരിഭാഷപ്പെടുത്തി ആത്മാവുതന്നെയാണ് അച്ചാരം എന്നു വ്യക്തമായി നിർണ്ണയിക്കാം.
  rationale: പൗലോസിന്റെ സമാനപ്രയോഗങ്ങൾ ആത്മാവുതന്നെ ഭാവിയിലെ പൂർത്തീകരണത്തിന്റെ ആദ്യഗഡിയും ഉറപ്പുമാണെന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും τοῦ πνεύματος എന്ന രൂപം മറ്റൊരു വ്യാകരണബന്ധത്തിനും ഇടനൽകുന്നതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അച്ചാരം’ എന്ന പദം വ്യാപാരരൂപകവും വാഗ്ദത്തത്തിന്റെ ഉറപ്പും ഒരുമിച്ച് വഹിക്കുന്നു; സാധാരണ വായനക്കാർക്കായി അതിന്റെ പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. ‘അവിടുന്ന്’ ദൈവത്തെ ആദരപൂർവം സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപ്രയോഗമാണ്.
