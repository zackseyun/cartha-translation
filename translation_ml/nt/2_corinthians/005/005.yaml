  naturalness: ‘ഈ കാര്യത്തിനായിത്തന്നെ,’ ‘നമ്മെ ഒരുക്കിയവൻ ദൈവമാണ്,’ ‘ആത്മാവിന്റെ അച്ചാരം’ എന്നിവ ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും വായനാസൗകര്യമുള്ളതുമാണ്. ‘നമുക്കു നൽകിയതും അവിടുന്നാണ്’ സ്വാഭാവികമാണ്. അടിക്കുറിപ്പ് b മാത്രം ‘ആത്മാവ് പൂർത്തിയാക്കാനിരിക്കുന്നതിനെ’ എന്ന പ്രയോഗത്തിൽ വ്യക്തത കുറവാണ്.
