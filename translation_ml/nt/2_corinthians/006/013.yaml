  text: τὴν δὲ αὐτὴν ἀντιμισθίαν, ὡς τέκνοις λέγω, πλατύνθητε καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: ml
  text: അതേ പ്രത്യുപകാരമായി[a]—മക്കളോടെന്നപോലെ ഞാൻ പറയുന്നു—നിങ്ങളുടെ ഹൃദയങ്ങളും വിശാലമാക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തുല്യമായ പ്രതിഫലമായി,’ ‘പകരമായി,’ ‘തുല്യമായ കൈമാറ്റമായി.’ ഇവിടെ ഉദ്ദേശിക്കുന്നത് പണപരമായ പ്രതിഫലമല്ല, അതിനൊത്ത പരസ്പരപ്രതികരണമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘നിങ്ങളും വിശാലരാകുക.’ സന്ദർഭത്തിൽ സ്നേഹത്തിലും സ്വീകരണത്തിലും ഹൃദയം തുറക്കുക എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: അതേ പ്രത്യുപകാരമായി
  rationale: ἀντιμισθία ഇവിടെ പണമോ ശിക്ഷയോ അല്ല, പൗലോസ് പ്രകടിപ്പിച്ച തുറന്ന സ്നേഹത്തിന് തുല്യമായ പരസ്പരപ്രതികരണമാണ്. αὐτήν എന്നതിലെ ‘അതേ/തുല്യമായ’ എന്ന ആശയവും നിലനിർത്തുന്നു; δέ ഒരു മൃദുവായ ബന്ധകമായതിനാൽ മലയാളത്തിൽ പ്രത്യേകം പദമാക്കാതെ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ὡς τέκνοις λέγω
  choice: മക്കളോടെന്നപോലെ ഞാൻ പറയുന്നു
  rationale: τέκνοις എന്നത് ‘മക്കൾ’ എന്നാണ്; ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘എന്റെ മക്കൾ’ എന്നു ചേർത്തിട്ടില്ല. പൗലോസിന്റെ വാത്സല്യപൂർണമായ അഭിസംബോധന സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: πλατύνθητε
  choice: ഹൃദയം വിശാലമാക്കുക
  rationale: ക്രിയയുടെ അക്ഷരാർഥം ‘വിശാലരാക്കപ്പെടുക/വിശാലരാകുക’ എന്നാണ്. മുൻസന്ദർഭത്തിലെ ഹൃദയം തുറക്കുന്നതിന്റെയും സ്നേഹപൂർണമായ സ്വീകരണത്തിന്റെയും രൂപകം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘ഹൃദയം’ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: καίയും ഊന്നലുള്ള ὑμεῖςഉം ചേർന്ന്, പൗലോസും സഹപ്രവർത്തകരും ചെയ്തതുപോലെ കൊരിന്ത്യരും പ്രതികരിക്കണമെന്ന പരസ്പരത വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ കുടുംബബന്ധസൂചകമായ അഭിസംബോധനയിൽ ഉടമസ്ഥത വ്യക്തമാക്കണമോ എന്നത്
  choice: ‘മക്കളോടെന്നപോലെ’ എന്ന് നൽകി ‘എന്റെ’ ചേർക്കാതിരിക്കുക
  alternative: ‘എന്റെ മക്കളോടെന്നപോലെ’
  rationale: പിതൃതുല്യമായ ബന്ധം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും ഗ്രീക്കിൽ ‘എന്റെ’ എന്ന ഉടമസ്ഥസർവനാമമില്ല. അതിനാൽ സ്രോതസ്സിലുള്ള വാത്സല്യം നിലനിർത്തിക്കൊണ്ട് അധിക ഉടമസ്ഥത ചേർക്കുന്നില്ല.
- issue: πλατύνθητε എന്ന രൂപകത്തിൽ ‘ഹൃദയം’ വ്യക്തമാക്കണമോ എന്നത്
  choice: സന്ദർഭത്തിൽ സൂചിതമായ ‘ഹൃദയം’ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക
  alternative: ‘നിങ്ങളും വിശാലരാകുക’ / ‘നിങ്ങളും വിശാലമായി തുറക്കുക’
  rationale: അക്ഷരാർഥത്തിലുള്ള നിഷ്ക്രിയപ്രയോഗം മലയാളത്തിൽ അസ്വാഭാവികവും അർഥം മങ്ങിയതുമാകും. 6:11–12ലെ ഹൃദയം വിശാലമാകുന്ന സന്ദർഭം അടിസ്ഥാനമാക്കി, സ്നേഹത്തിലും സ്വീകരണത്തിലും തുറന്നവരാകുക എന്ന ആഹ്വാനം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് അക്ഷരരൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഇടയ്ക്കുള്ള പൗലോസിന്റെ വാത്സല്യപൂർണമായ പരാമർശം ഡാഷുകൾകൊണ്ട് വേർതിരിച്ചു; വാക്യത്തിന്റെ അഭ്യർഥനാഭാവവും പരസ്പരതയും നിലനിർത്തി.
