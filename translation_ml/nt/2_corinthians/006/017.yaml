id: 2CO.6.17
reference: 2 Corinthians 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: ml
  text: അതുകൊണ്ട്, “അവരുടെ നടുവിൽനിന്ന് പുറത്തുവരുവിൻ, വേറിട്ടുനിൽക്കുവിൻ[a],” എന്ന് കർത്താവ് പറയുന്നു. “അശുദ്ധമായതിനെ തൊടരുത്[b][c]; ഞാനും നിങ്ങളെ സ്വീകരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വേർതിരിക്കപ്പെട്ടവരായിരിക്കുവിൻ’ അല്ലെങ്കിൽ ‘നിങ്ങളെത്തന്നെ വേർപെടുത്തുവിൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അശുദ്ധമായ യാതൊന്നും തൊടരുത്.’
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ പൗലോസ് പഴയനിയമത്തിലെ പ്രവാചകഭാഷയെ, പ്രത്യേകിച്ച് യെശയ്യാവ് 52:11-നെ, പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐξέλθατε
  choice: പുറത്തുവരുവിൻ
  rationale: ബഹുവചനത്തിലുള്ള നിർണായക ആഹ്വാനത്തിന്റെ ശക്തി നിലനിർത്തുകയും ഉദ്ധരണിസദൃശമായ പ്രബോധനത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ μέσου αὐτῶν
  choice: അവരുടെ നടുവിൽനിന്ന്
  rationale: സ്ഥലപരവും സാമൂഹികവുമായ വേർപാടിന്റെ സാധ്യതകൾ രണ്ടും നിലനിർത്തുന്ന നേരിട്ടുള്ള പ്രയോഗം.
- source_word: ἀφορίσθητε
  choice: വേറിട്ടുനിൽക്കുവിൻ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപത്തെ അതിരുകടന്ന് ആത്മപ്രവർത്തകമാക്കാതെ, വേർതിരിഞ്ഞ അവസ്ഥയിൽ ഇരിക്കാനുള്ള കല്പന സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: λέγει κύριος
  choice: എന്ന് കർത്താവ് അരുളിച്ചെയ്യുന്നു
  rationale: പ്രവാചകീയ ഉദ്ധരണിസൂത്രത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἀκαθάρτου
  choice: അശുദ്ധമായതിനെ
  rationale: ഒരു നിർദിഷ്ട വസ്തുവായി ചുരുക്കാതെ അശുദ്ധമായതെന്ന വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന നപുംസക വിശേഷണത്തിന്റെ നാമവൽക്കരിച്ച പ്രയോഗം.
- source_word: μὴ ἅπτεσθε
  choice: തൊടരുത്
  rationale: ശുദ്ധി-വേർപാട് പശ്ചാത്തലത്തിലെ സ്പർശത്തിന്റെ ദൃശ്യഭാഷയും കല്പനയുടെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καί + ἐγώ എന്ന സംയോജനത്തിലെ ‘and I’ എന്ന ബന്ധവും വ്യക്തിപരമായ ഊന്നലും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: നിങ്ങളെ സ്വീകരിക്കും
  rationale: അനുകൂലമായ സ്വീകരണവും ഉടമ്പടിസദൃശമായ ഗൗരവവും പ്രകടിപ്പിക്കുന്നു; ‘സ്വാഗതം ചെയ്യും’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: പഴയനിയമ പശ്ചാത്തലമുള്ള പ്രവാചകീയ ഉദ്ധരണിയിലെ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ / നാഥൻ
  rationale: പുതിയനിയമ ഗ്രീക്ക് പാഠത്തിലെ κύριος എന്ന രൂപം അനുസരിച്ച് ‘കർത്താവ്’ നിലനിർത്തുന്നു; പഴയനിയമ പശ്ചാത്തലം മാത്രം ആശ്രയിച്ച് ദൈവനാമം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: വേർപാടിനുള്ള കല്പനയുടെ വ്യാപ്തി
  choice: വേറിട്ടുനിൽക്കുവിൻ
  alternative: നിങ്ങളെത്തന്നെ വേർപെടുത്തുവിൻ / വേർതിരിക്കപ്പെട്ടവരായിരിക്കുവിൻ
  rationale: അശുദ്ധമായ ബന്ധത്തിൽനിന്നോ പ്രവൃത്തിയിൽനിന്നോ ഉള്ള വ്യത്യസ്തതയെ അറിയിക്കുന്നു; എല്ലാ പുറത്തുള്ളവരുമായുള്ള സമ്പർക്കം ഉപേക്ഷിക്കണമെന്ന വിഭാഗീയമോ സന്യാസപരമോ ആയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പ്രവാചകീയ ഉദ്ധരണിയുടെ ഭാവം സൂക്ഷിക്കാൻ ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാപരമായ സാങ്കേതികപദങ്ങളും വിഭാഗീയ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
