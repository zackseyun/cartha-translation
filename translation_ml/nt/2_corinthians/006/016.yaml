id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: ml
  text: 'ദൈവത്തിന്റെ ആലയത്തിന് വിഗ്രഹങ്ങളുമായി എന്ത് യോജിപ്പാണുള്ളത്?[a] നാം ജീവനുള്ള ദൈവത്തിന്റെ ആലയമല്ലോ. ദൈവം അരുളിച്ചെയ്തതുപോലെ: “ഞാൻ അവരുടെ ഇടയിൽ വസിക്കുകയും[b] അവരുടെ ഇടയിൽ നടക്കുകയും ചെയ്യും; ഞാൻ അവരുടെ ദൈവമായിരിക്കും, അവർ എന്റെ ജനമായിരിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊരുത്തം’ എന്നോ ‘സമ്മതി’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ അവരിൽ വസിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἐν എന്ന പദത്തിന് ‘അവരിൽ’ എന്നും ‘അവരുടെ ഇടയിൽ’ എന്നും അർഥമാകാം; ഇവിടെ സമൂഹത്തെക്കുറിച്ചുള്ള ഉടമ്പടിപശ്ചാത്തലം ‘അവരുടെ ഇടയിൽ’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: യോജിപ്പ്
  rationale: സമ്മതി, പൊരുത്തം, യോജിപ്പ് എന്നീ അർഥങ്ങൾ നൽകുന്ന ഈ പദത്തിന് സന്ദർഭത്തിലെ പരസ്പരവിരുദ്ധമായ കൂട്ടുകെട്ടുകളെ സൂചിപ്പിക്കാൻ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദമാണ് ‘യോജിപ്പ്’.
- source_word: ναῷ / ναὸς
  choice: ആലയം
  rationale: ναός ദേവാലയപരിസരം മുഴുവനെയല്ല, പ്രത്യേകിച്ച് വിശുദ്ധമന്ദിരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആരാധനാസംബന്ധമായ രൂപകത്തിന്റെ ശക്തി നിലനിർത്തുന്ന പരിചിതമായ മലയാളപ്രയോഗമാണ് ‘ദൈവത്തിന്റെ ആലയം’.
- source_word: εἰδώλων
  choice: വിഗ്രഹങ്ങൾ
  rationale: ഇവിടെ മതപരമായി ആരാധിക്കപ്പെടുന്ന അന്യദേവവിഗ്രഹങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ നിഷ്പക്ഷമായ ‘പ്രതിമകൾ’ എന്നതിനെക്കാൾ ‘വിഗ്രഹങ്ങൾ’ യോജിക്കുന്നു.
- source_word: ζῶντος
  choice: ജീവനുള്ള
  rationale: ജീവനില്ലാത്ത വിഗ്രഹങ്ങൾക്ക് വിപരീതമായി സത്യദൈവത്തെ വിശേഷിപ്പിക്കുന്ന പരമ്പരാഗത ബൈബിൾപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: ദൈവം അരുളിച്ചെയ്തതുപോലെ
  rationale: καθώς എന്നതിന്റെ താരതമ്യബന്ധവും εἶπεν എന്ന ഭൂതകാലവും നിലനിർത്തുന്നു; തിരുവെഴുത്തിലെ ദൈവവചന ഉദ്ധരണിക്ക് യോജിച്ച മാന്യമായ മലയാളശൈലിയാണ് ‘അരുളിച്ചെയ്തു’.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: ഞാൻ അവരുടെ ഇടയിൽ വസിക്കും
  rationale: ἐν എന്നതിന് ‘അവരിൽ’ എന്നും ‘അവരുടെ ഇടയിൽ’ എന്നും അർഥസാധ്യതയുണ്ട്. ബഹുവചന സമൂഹത്തെയും തുടർന്നുള്ള ‘അവരുടെ ഇടയിൽ നടക്കും’ എന്ന സമാന്തരവാക്യത്തെയും കണക്കിലെടുത്ത് മുഖ്യപാഠത്തിൽ ‘അവരുടെ ഇടയിൽ’ സ്വീകരിച്ചു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἐμπεριπατήσω
  choice: അവരുടെ ഇടയിൽ നടക്കും
  rationale: തന്റെ ജനത്തോടൊപ്പമുള്ള ദൈവസാന്നിധ്യത്തെ വരച്ചുകാട്ടുന്ന ഉടമ്പടിസംബന്ധമായ സജീവരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἔσομαι αὐτῶν θεός
  choice: ഞാൻ അവരുടെ ദൈവമായിരിക്കും
  rationale: ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയും പതിവായ ഉടമ്പടിസൂത്രവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαός
  choice: ജനം
  rationale: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ ദൈവത്തിന്റേതായ സമൂഹത്തെ കൂട്ടായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദമാണ് ‘ജനം’.
theological_decisions:
- issue: സഭാസമൂഹത്തെ ആലയമായി ചിത്രീകരിക്കൽ
  choice: നാം ജീവനുള്ള ദൈവത്തിന്റെ ആലയം
  alternative: നാം ജീവനുള്ള ദൈവത്തിന്റെ ഒരു ആലയം
  rationale: വിധേയനാമമായ അനിർദ്ദിഷ്ട ναός ഇവിടെ ഗുണാത്മകവും നിർദ്ദിഷ്ടവുമായ അർഥം നൽകുന്നു. പൗലോസിന്റെ സമൂഹകേന്ദ്രിതമായ ആലയരൂപകവും പിന്നാലെയുള്ള ഉടമ്പടി ഉദ്ധരണിയും ‘ആലയം’ എന്ന നിർദ്ദിഷ്ടവായനയെ പിന്തുണയ്ക്കുന്നു.
- issue: ദൈവം വസിക്കുന്നതിനെക്കുറിച്ചുള്ള ഉദ്ധരണി
  choice: ഞാൻ അവരുടെ ഇടയിൽ വസിക്കും
  alternative: ഞാൻ അവരിൽ വസിക്കും
  rationale: ഉദ്ധരണി സമൂഹത്തെ കൂട്ടായാണ് അഭിസംബോധന ചെയ്യുന്നത്; തുടർന്നുള്ള ‘അവരുടെ ഇടയിൽ നടക്കും’ എന്ന വാക്യത്തോടും ‘അവരുടെ ഇടയിൽ’ നന്നായി പൊരുത്തപ്പെടുന്നു. എന്നാൽ ἐν എന്നതിന്റെ ‘അവരിൽ’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾഗദ്യമാണ് ഉപയോഗിച്ചത്. ‘അരുളിച്ചെയ്തതുപോലെ’ ഉദ്ധരണിക്ക് ഗൗരവം നൽകുന്നു; വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചു. സമൂഹകേന്ദ്രിതമായ ‘നാം’ എന്നും ഉടമ്പടിസൂത്രത്തിലെ കൂട്ടായ ‘ജനം’ എന്നും നിലനിർത്തി.
