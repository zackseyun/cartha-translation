  terminology: ‘ആലയം,’ ‘വിഗ്രഹങ്ങൾ,’ ‘ജീവനുള്ള ദൈവം,’ ‘എന്റെ ജനം’ എന്നിവ സ്ഥിരതയുള്ളതും സന്ദർഭോചിതവുമാണ്. എന്നാൽ അടിക്കുറിപ്പ് a-യിലെ ‘ഒത്തുതീർപ്പ്’ സാധാരണയായി തർക്കപരിഹാരത്തിലൂടെയുള്ള compromise/settlement എന്ന അർഥം ഉണർത്താം; συγκατάθεσις-ന്റെ ഇവിടെ പ്രസക്തമായ ‘agreement/consent’ അർഥത്തിന് ‘സമ്മതി’ കൂടുതൽ കൃത്യമാണ്. അടിക്കുറിപ്പ് b-യിലെ ബദൽ രൂപം പൂർണക്രിയാരൂപത്തിൽ നൽകുന്നതും വ്യക്തത കൂട്ടും.
