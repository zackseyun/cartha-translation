  revised_text: 'ദൈവത്തിന്റെ ആലയത്തിന് വിഗ്രഹങ്ങളുമായി എന്ത് യോജിപ്പാണുള്ളത്?[a] നാം ജീവനുള്ള ദൈവത്തിന്റെ ആലയമല്ലോ. ദൈവം അരുളിച്ചെയ്തതുപോലെ: “ഞാൻ അവരുടെ ഇടയിൽ വസിക്കുകയും[b] അവരുടെ ഇടയിൽ നടക്കുകയും ചെയ്യും; ഞാൻ അവരുടെ ദൈവമായിരിക്കും, അവർ എന്റെ ജനമായിരിക്കും.”'
