id: 2CO.6.10
reference: 2 Corinthians 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: ml
  text: ദുഃഖിക്കുന്നവരെന്നപോലെ, എങ്കിലും എപ്പോഴും ആനന്ദിക്കുന്നവർ; ദരിദ്രരെന്നപോലെ, എങ്കിലും അനേകരെ സമ്പന്നരാക്കുന്നവർ[a]; ഒന്നുമില്ലാത്തവരെന്നപോലെ, എന്നിട്ടും എല്ലാം കൈവശമുള്ളവർ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമ്പന്നരാക്കുന്നവർ’ എന്നതിന് ‘ധനികരാക്കുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം. സമ്പത്തിന്റെ സ്വഭാവം ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: പുറമേ ഒന്നുമില്ലാത്ത അവസ്ഥയ്ക്കും ‘എല്ലാം കൈവശമുള്ളവർ’ എന്ന അവകാശവാദത്തിനുമിടയിലെ വിരോധാഭാസം വാക്യം നിലനിർത്തുന്നു; ആ കൈവശാവകാശത്തിന്റെ സ്വഭാവം ഇവിടെ വിശദീകരിക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: എന്നപോലെ
  rationale: മൂന്നു വിരോധാഭാസങ്ങളിലും ആവർത്തിക്കുന്ന താരതമ്യചട്ടക്കൂട് നിലനിർത്തുന്നു; പുറമേ തോന്നുന്നതും തുടർന്നുള്ള വാക്യഭാഗം വെളിപ്പെടുത്തുന്ന യാഥാർഥ്യവും തമ്മിലുള്ള സംഘർഷം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λυπούμενοι
  choice: ദുഃഖിതർ
  rationale: ദുഃഖം അനുഭവിക്കുന്ന അവസ്ഥയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു; ദുഃഖത്തിന് കാരണക്കാരൻ ആരെന്നത് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀεὶ
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ കാലവ്യാപ്തിയെ സാധാരണ ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: δὲ
  choice: എങ്കിലും
  rationale: ഓരോ ജോഡിയിലുമുള്ള ശക്തമായ വിരോധവും വിരോധാഭാസസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: χαίροντες
  choice: ആനന്ദിക്കുന്നവർ
  rationale: സജീവവും തുടരുന്നതുമായ ആനന്ദത്തെ സൂചിപ്പിക്കുകയും മറ്റു ബഹുവചന പങ്കാളിത്തരൂപങ്ങളോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πτωχοὶ
  choice: ദരിദ്രർ
  rationale: ഭൗതിക ദാരിദ്ര്യത്തെയും അപ്പൊസ്തോലിക ഇല്ലായ്മയെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന നേരിട്ടുള്ള പദമാണ്; ‘നിരാലംബർ’ പോലുള്ള അതിശക്തമായ അർഥം ചുമത്തുന്നില്ല.
- source_word: πολλοὺς
  choice: അനേകരെ
  rationale: അനിശ്ചിതമായ വ്യക്തിബഹുവചന കർമത്തെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: πλουτίζοντες
  choice: സമ്പന്നരാക്കുന്നവർ
  rationale: ‘സമ്പന്നരാക്കുക/ധനികരാക്കുക’ എന്ന ക്രിയാർത്ഥം നേരിട്ട് നൽകുന്നു; സമ്പത്തിന്റെ സ്വഭാവം മുഖ്യവാചകത്തിൽ നിർവചിക്കാതെ വിടുന്നു.
- source_word: μηδὲν ἔχοντες
  choice: ഒന്നുമില്ലാത്തവർ
  rationale: പ്രത്യക്ഷമായ സമ്പൂർണ ഇല്ലായ്മയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: പൗലോസിന്റെ അവകാശവാദത്തിലെ സമഗ്രവ്യാപ്തി ലളിതവും ശക്തവുമായ രൂപത്തിൽ നൽകുന്നു.
- source_word: κατέχοντες
  choice: കൈവശമുള്ളവർ
  rationale: കേവലം പിടിച്ചുനിൽക്കുന്നതല്ല, യഥാർഥമായി സ്വന്തമായി ഉള്ളത് എന്ന അർഥം നൽകുകയും ‘ഒന്നുമില്ലാത്തവർ’ എന്നതിനോടുള്ള വിരോധാഭാസം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വിരോധാഭാസങ്ങളിലെ സമ്പത്തിന്റെയും കൈവശാവകാശത്തിന്റെയും സ്വഭാവം
  choice: ‘സമ്പന്നരാക്കുന്നു’, ‘എല്ലാം കൈവശമുണ്ട്’ എന്നീ പ്രയോഗങ്ങൾ മുഖ്യവാചകത്തിൽ യാതൊരു വിശേഷണവും ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇവയെ ‘ആത്മീയമായി സമ്പന്നരാക്കുന്നു’, ‘ക്രിസ്തുവിൽ എല്ലാം കൈവശമുണ്ട്’ എന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭവും പൗലോസിന്റെ വിശാലമായ ദൈവശാസ്ത്രചിന്തയും ആത്മീയ സമ്പത്തിലേക്ക് വിരൽചൂണ്ടുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം അങ്ങനെ വ്യക്തമായി വിശേഷിപ്പിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ വാചകത്തിന്റെ വിരോധാഭാസവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ മൂന്നു സമാന്തര വിരോധാഭാസങ്ങളും ‘എന്നപോലെ, എങ്കിലും’ എന്ന ആവർത്തനത്തിലൂടെ സംരക്ഷിച്ചു. വാക്യം മുൻസന്ദർഭത്തിലെ ‘ഞങ്ങൾ’ എന്ന കർത്താവിനോട് ചേരുന്നതിനാൽ ഓരോ ഘടകവും ബഹുവചനമായ ‘വർ’ രൂപത്തിൽ നൽകി.
