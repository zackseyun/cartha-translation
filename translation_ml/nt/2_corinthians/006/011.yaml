source:
  edition: SBLGNT
  text: Τὸ στόμα ἡμῶν ἀνέῳγεν πρὸς ὑμᾶς, Κορίνθιοι, ἡ καρδία ἡμῶν πεπλάτυνται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: ml
  text: കൊരിന്ത്യരേ, നിങ്ങളോടു ഞങ്ങളുടെ വായ് തുറന്നിരിക്കുന്നു; ഞങ്ങളുടെ ഹൃദയം വിശാലമായിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവാർഥത്തിൽ: “ഞങ്ങൾ നിങ്ങളോടു തുറന്നു സംസാരിച്ചിരിക്കുന്നു; ഞങ്ങളുടെ ഹൃദയം വിശാലമായി തുറന്നിരിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: വായ്
  rationale: പൗലൊസിന്റെ ശരീരാവയവരൂപകം നിലനിർത്തുകയും തുടർന്നുള്ള ‘ഹൃദയം’ എന്ന രൂപകവുമായി അതിന്റെ സമാന്തരത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνέῳγεν
  choice: തുറന്നിരിക്കുന്നു
  rationale: മുൻപ് സംഭവിച്ച തുറക്കലിന്റെ ഇപ്പോഴുള്ള ഫലാവസ്ഥ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് തുറന്ന സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളോടു
  rationale: അഭിസംബോധനയും ആശയവിനിമയത്തിന്റെ ദിശയും മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: Κορίνθιοι
  choice: കൊരിന്ത്യരേ
  rationale: നേരിട്ടുള്ള സംബോധനയെ മലയാളത്തിലെ സംബോധനരൂപത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: καρδία
  choice: ഹൃദയം
  rationale: വാത്സല്യത്തിന്റെയും ആന്തരിക മനോഭാവത്തിന്റെയും കേന്ദ്രം സൂചിപ്പിക്കുന്ന പ്രചാരമുള്ള രൂപകം നിലനിർത്തുന്നു.
- source_word: πεπλάτυνται
  choice: വിശാലമായിരിക്കുന്നു
  rationale: ‘വിശാലമാക്കുക’ എന്ന മൂലചിത്രവും അതിന്റെ ഇപ്പോഴുള്ള ഫലാവസ്ഥയും നിലനിർത്തുന്നു; മലയാളത്തിൽ ഹൃദയത്തിന്റെ തുറന്ന സ്നേഹവ്യാപ്തി സൂചിപ്പിക്കാനും ഈ പ്രയോഗം യോജിക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ തുറന്ന സംസാരവും വിശാലമായ സ്നേഹവും സൂചിപ്പിക്കുന്ന ശരീരാവയവരൂപകങ്ങൾ
  choice: ‘വായ് തുറന്നിരിക്കുന്നു’, ‘ഹൃദയം വിശാലമായിരിക്കുന്നു’ എന്നീ രൂപകങ്ങൾ മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ഞങ്ങൾ നിങ്ങളോടു തുറന്നു സംസാരിച്ചിരിക്കുന്നു; ഞങ്ങളുടെ ഹൃദയം നിങ്ങൾക്കായി പൂർണമായി തുറന്നിരിക്കുന്നു.’
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ‘വായ്—ഹൃദയം’ എന്ന വാചകസമാന്തരതയും രൂപകാത്മക സംഘർഷവും സംരക്ഷിക്കുന്നു; അർഥം മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രൂപകങ്ങളും പൂർണ്ണകാലത്തിന്റെ ഫലാവസ്ഥയും കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തിയിരിക്കുന്നു; അടിക്കുറിപ്പിലെ ഭാവാർഥം ഇരുക്ലോസുകൾക്കും ബാധകമാണ്.
