id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: ml
  text: മശീഹയ്ക്കും ബെലിയാറിനും തമ്മിൽ എന്ത് യോജിപ്പാണുള്ളത്? വിശ്വാസിക്ക് അവിശ്വാസിയുമായി എന്ത് പങ്കാണുള്ളത്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ബെലിയാർ: ഗ്രീക്ക് Βελιάρ; ഈ പേരിന്റെ മറ്റൊരു പ്രചാരത്തിലുള്ള രൂപം ‘ബെലിയാൽ’ എന്നാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: യോജിപ്പ്
  rationale: ഈ പദം ഐക്യം, പൊരുത്തം, ഒത്തുചേരൽ എന്നിവയെ സൂചിപ്പിക്കുന്നു. ഇവിടെ വിരുദ്ധരായ രണ്ടുപേർ തമ്മിലുള്ള പൊരുത്തമില്ലായ്മ സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘യോജിപ്പ്’ അനുയോജ്യമാണ്.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός പേരുപോലെയല്ല, അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനനാമമായാണ് വരുന്നത്; അതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: Βελιάρ
  choice: ബെലിയാർ
  rationale: ഗ്രീക്ക് പാഠത്തിലെ Βελιάρ എന്ന വ്യക്തിനാമം ശബ്ദാന്തരണം ചെയ്തു. പരിചിതമായ മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: μερίς
  choice: പങ്ക്
  rationale: പങ്കിട്ടുള്ള ഓഹരി, പങ്കാളിത്തം, പൊതുവായ വിഹിതം എന്നീ ആശയങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πιστῷ
  choice: വിശ്വാസിക്ക്
  rationale: വിശ്വസിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന substantival adjective ആയതിനാൽ ‘വിശ്വാസി’ എന്ന സ്വാഭാവിക മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: ἀπίστου
  choice: അവിശ്വാസിയുമായി
  rationale: πιστός എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം നിലനിർത്തി, വിശ്വസിക്കാത്ത വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘അവിശ്വാസി’ ഉപയോഗിച്ചു.
- source_word: πρὸς
  choice: തമ്മിൽ
  rationale: συμφώνησις എന്ന നാമത്തോടൊപ്പം പരസ്പരബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ ‘...ക്കും ...ക്കും തമ്മിൽ’ എന്ന ഘടന സ്വാഭാവികമാണ്.
- source_word: μετὰ
  choice: ആയി / -വുമായി
  rationale: സഹവർത്തിത്വമോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ഈ പൂർവപ്രത്യയം ‘അവിശ്വാസിയുമായി’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പ്രകടിപ്പിച്ചിട്ടില്ല
  rationale: മുൻവാക്യങ്ങളിലെ ചോദ്യപരമ്പര തുടരുമെന്ന ആശയം മലയാളത്തിലെ വാക്യക്രമം തന്നെ വ്യക്തമാക്കുന്നു; ‘എന്നാൽ’ ചേർത്താൽ ഗ്രീക്കിലുള്ളതിനെക്കാൾ ശക്തമായ വൈരുധ്യം തോന്നാം.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വിരുദ്ധജോടിയിൽ പദത്തിന്റെ സ്ഥാനനാമസ്വഭാവം വ്യക്തമാണ്. അതിനാൽ അർത്ഥം തുറന്നുകാട്ടുന്ന ‘മശീഹ’ തിരഞ്ഞെടുത്തു; പേര് പോലെയുള്ള ‘ക്രിസ്തു’ എന്ന രൂപം ഒഴിവാക്കി.
- issue: Βελιάρ എന്ന പേരിന്റെ തിരിച്ചറിയൽ
  choice: ബെലിയാർ എന്ന വ്യക്തിനാമം മാത്രം പ്രധാനപാഠത്തിൽ നിലനിർത്തി
  alternative: ബെലിയാൽ; അല്ലെങ്കിൽ സാത്താൻ എന്നു വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തൽ
  rationale: മൂലപാഠത്തിലെ പേരിനെ ശബ്ദാന്തരണം ചെയ്യുന്നത് വ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ പൗലോസിന്റെ പ്രതിവിരുദ്ധത സംരക്ഷിക്കുന്നു. മറ്റൊരു പ്രചാരത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തരമായ രണ്ട് അലങ്കാരചോദ്യങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തി; ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടില്ല.
