id: 2CO.6.7
reference: 2 Corinthians 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: ml
  text: സത്യവചനത്തിൽ, ദൈവത്തിന്റെ ശക്തിയിൽ; വലങ്കൈയിലെയും ഇടങ്കൈയിലെയും നീതിയുടെ ആയുധങ്ങളാൽ[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്നതിന് ഇവിടെ ‘നീതിനിഷ്ഠ’ എന്നോ ‘ന്യായം’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: വലങ്കൈയും ഇടങ്കൈയും എന്ന പ്രയോഗം ഇരു കൈകളിലുമുള്ള ആയുധങ്ങളെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു; ഇത് ആക്രമണത്തിനും പ്രതിരോധത്തിനുമുള്ള പൂർണസജ്ജതയുടെ ചിത്രമായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: സത്യവചനത്തിൽ
  rationale: λόγος എന്നത് വചനം, സന്ദേശം, സംസാരം എന്നീ അർഥങ്ങൾ വഹിക്കാം. ‘സത്യവചനം’ എന്ന പ്രയോഗം ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് സത്യസന്ധമായ പ്രഘോഷണത്തെയും സത്യത്തിന്റെ സന്ദേശത്തെയും ഉൾക്കൊള്ളാൻ അനുവദിക്കുന്നു.
- source_word: δυνάμει θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയിൽ
  rationale: ആവർത്തിക്കുന്ന ἐν ഘടനയും ദൈവത്തിൽനിന്നുള്ള ശക്തിയെന്ന ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διὰ τῶν ὅπλων
  choice: ആയുധങ്ങളാൽ
  rationale: Genitive-നോടുകൂടിയ διά ഇവിടെ മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ആൽ’ അതിനെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ὅπλα ആക്രമണത്തിനോ പ്രതിരോധത്തിനോ ഉള്ള യുദ്ധോപകരണങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതിയുടെ
  rationale: δικαιοσύνηയുടെ നീതിനിഷ്ഠ, ശരിയായ നില, ന്യായം എന്നീ അർഥസാധ്യതകൾ ഒറ്റത്തവണയിൽ അമിതമായി ചുരുക്കാതെ ‘നീതി’ നിലനിർത്തുന്നു.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: വലങ്കൈയിലെയും ഇടങ്കൈയിലെയും
  rationale: Substantival adjectives-ൽ സൂചിതമായ ‘കൈ’ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഇരു കൈകളിലുമുള്ള ആയുധങ്ങൾ എന്ന സൈനികരൂപകം സ്വാഭാവികമായി നൽകുന്നു; ആക്രമണം/പ്രതിരോധം എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിലെ δικαιοσύνηയുടെ അർഥം
  choice: നീതി
  alternative: നീതിനിഷ്ഠ; ന്യായം
  rationale: ‘നീതി’ പ്രധാന അർഥപരിധി നിലനിർത്തുന്നു. സന്ദർഭം വ്യക്തിയുടെ ധാർമിക നീതിനിഷ്ഠയെയോ ന്യായമായ മാർഗങ്ങളെയോ സൂചിപ്പിക്കാമെന്ന തുറന്ന നില അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: വലങ്കൈയും ഇടങ്കൈയും എന്ന യുദ്ധരൂപകത്തിന്റെ വിശദീകരണം
  choice: ഇരു കൈകളിലുമുള്ള ആയുധങ്ങൾ എന്ന രൂപകം മാത്രം മുഖ്യവാചകത്തിൽ നൽകുന്നു
  alternative: ആക്രമണത്തിനും പ്രതിരോധത്തിനുമുള്ള ആയുധങ്ങൾ
  rationale: ആക്രമണം/പ്രതിരോധം എന്ന വിശദീകരണം സാദ്ധ്യമാണെങ്കിലും ഗ്രീക്ക് പാഠം അത് തുറന്നുപറയുന്നില്ല; അതിനാൽ അത് വ്യാഖ്യാനക്കുറിപ്പായി മാത്രം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. പട്ടികയായി തുടരുന്ന ഗ്രീക്ക് വാക്യത്തിന്റെ താളം നിലനിർത്താൻ കോമയും അർദ്ധവിരാമവും അവസാനത്തെ കോമയും സംരക്ഷിച്ചു.
