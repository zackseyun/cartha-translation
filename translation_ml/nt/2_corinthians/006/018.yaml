source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: ml
  text: “ഞാൻ നിങ്ങൾക്കു പിതാവായിരിക്കും[a]; നിങ്ങൾ എനിക്ക് പുത്രന്മാരും പുത്രിമാരുമായിരിക്കും,” എന്നു സർവശക്തനായ കർത്താവ് അരുളിച്ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഞാൻ നിങ്ങൾക്കു പിതാവായി ഇരിക്കും; നിങ്ങൾ എനിക്ക് പുത്രന്മാരും പുത്രിമാരുമായി ഇരിക്കും.” ഗ്രീക്കിലെ ഈ പ്രയോഗം ഉടമ്പടിബന്ധത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: ഞാൻ നിങ്ങൾക്കു പിതാവായിരിക്കും
  rationale: εἶναι + ദാതിവ് + εἰς എന്ന ഉടമ്പടിബന്ധസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവിക മലയാളത്തിൽ ബന്ധപരമായ അർഥം നിലനിർത്തി അവതരിപ്പിക്കുന്നു.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: നിങ്ങൾ എനിക്ക് ... ആയിരിക്കും
  rationale: ഊന്നിപ്പറഞ്ഞിരിക്കുന്ന ὑμεῖς നിലനിർത്തുകയും ആദ്യ ഉപവാക്യത്തോടുള്ള പരസ്പരബന്ധവും സമാന്തരതയും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: പുത്രന്മാരും പുത്രിമാരും
  rationale: ഗ്രീക്ക് മൂലത്തിൽ ആൺമക്കളെയും പെൺമക്കളെയും പ്രത്യേകം പരാമർശിക്കുന്നതിനാൽ ‘മക്കൾ’ എന്നു പൊതുവാക്കാതെ ആ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: അരുളിച്ചെയ്യുന്നു
  rationale: ദൈവിക തിരുവചന ഉദ്ധരണിയുടെ വർത്തമാനകാല പ്രഖ്യാപനശൈലി മാന്യവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κύριος παντοκράτωρ
  choice: സർവശക്തനായ കർത്താവ്
  rationale: κύριος എന്ന ദൈവിക സ്ഥാനപ്പേരിന് ‘കർത്താവ്’ എന്നും παντοκράτωρ എന്നതിന് അർഥസുതാര്യവും പ്രചാരത്തിലുള്ളതുമായ ‘സർവശക്തനായ’ എന്നും നൽകുന്നു; ‘സൈന്യങ്ങളുടെ കർത്താവ്’ എന്ന വ്യത്യസ്ത പഴയനിയമ സ്ഥാനപ്പേര് ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: മക്കളെന്ന ബന്ധത്തെ ലിംഗകൃത്യതയോടെ അവതരിപ്പിക്കൽ
  choice: പുത്രന്മാരും പുത്രിമാരും
  alternative: മക്കൾ
  rationale: υἱούς, θυγατέρας എന്നീ രണ്ടു പദങ്ങളും മൂലത്തിൽ വ്യക്തമായി ഉള്ളതിനാൽ പുത്രിമാരുടെ പ്രത്യേകം ഉൾപ്പെടുത്തൽ മായ്ച്ചുകളയുന്നില്ല.
- issue: κύριος παντοκράτωρ എന്ന ദൈവിക സ്ഥാനപ്പേര്
  choice: സർവശക്തനായ കർത്താവ്
  alternative: കർത്താവായ സർവശക്തൻ; സൈന്യങ്ങളുടെ കർത്താവ്
  rationale: ഗ്രീക്ക് പദക്രമം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും രണ്ടു സ്ഥാനപ്പേരുകളുടെയും അർഥം സംരക്ഷിക്കുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘സൈന്യങ്ങളുടെ’ എന്ന ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ തിരുവചനശൈലി. ‘അരുളിച്ചെയ്യുന്നു’ ദൈവവചനത്തിന്റെ പ്രഖ്യാപനസ്വരം നിലനിർത്തുന്നു; വാക്യഘടന ഗ്രീക്കിലെ പരസ്പരബന്ധസമാന്തരത സംരക്ഷിക്കുന്നു.
