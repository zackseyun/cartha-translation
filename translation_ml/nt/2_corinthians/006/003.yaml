- from: ഒന്നിലും ഇടർച്ചയ്ക്ക് കാരണമൊന്നും നൽകാതെ ഞങ്ങൾ ജീവിക്കുന്നു[a]; അങ്ങനെ ഈ ശുശ്രൂഷ കുറ്റപ്പെടുത്തപ്പെടാതിരിക്കട്ടെ[b].
