translation:
  language: ml
  text: ഒരു കാര്യത്തിലും ഇടർച്ചയ്ക്കു കാരണമൊന്നും നൽകുന്നില്ല[a], ഈ ശുശ്രൂഷ കുറ്റപ്പെടുത്തപ്പെടാതിരിക്കേണ്ടതിന്[b].
