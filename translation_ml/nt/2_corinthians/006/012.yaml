- from: ഞങ്ങളാൽ നിങ്ങൾ ഞെരുക്കപ്പെടുന്നില്ല[a]; എന്നാൽ നിങ്ങളുടെ സ്വന്തം ഹൃദയവികാരങ്ങളിലാണ് നിങ്ങൾ ഞെരുക്കപ്പെടുന്നത്.
  to: ഞങ്ങളാൽ നിങ്ങൾ പരിമിതരാകുന്നില്ല[a]; എന്നാൽ നിങ്ങളുടെ സ്വന്തം ഹൃദയവികാരങ്ങളിലാണ് നിങ്ങൾ പരിമിതരാകുന്നത്.
  rationale: The revised wording preserves the Greek verb’s deliberate repetition, the contrast marked by δέ, and the emphasis that the limitation lies in the Corinthians’ own deep affections. It also makes the main text more natural while the footnote supplies the more literal rendering of ἐν ἡμῖν.
