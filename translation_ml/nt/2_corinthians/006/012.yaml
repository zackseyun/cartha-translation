reference: 2 Corinthians 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: ml
  text: ഞങ്ങളാൽ നിങ്ങൾ പരിമിതരാകുന്നില്ല[a]; എന്നാൽ നിങ്ങളുടെ സ്വന്തം ഹൃദയവികാരങ്ങളിലാണ് നിങ്ങൾ പരിമിതരാകുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങളിൽ നിങ്ങൾ പരിമിതരാകുന്നില്ല; എന്നാൽ നിങ്ങളുടെ സ്വന്തം ഹൃദയവികാരങ്ങളിലാണ് നിങ്ങൾ പരിമിതരാകുന്നത്.”
    reason: ἐν എന്നതിന്റെ കൂടുതൽ അക്ഷരാർഥപരമായ “ഞങ്ങളിൽ” എന്ന രൂപവും στενοχωρεῖσθε എന്ന പദത്തിന്റെ സ്ഥലപരമായ രൂപകവും നിലനിർത്തുന്ന പരിഭാഷാവികൽപം.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: ഞെരുക്കപ്പെടുന്നു
  rationale: ഇടുങ്ങിയ സ്ഥലത്താകുക എന്ന മൂലരൂപകവും അതിൽനിന്നുള്ള നിയന്ത്രണം/വിശാലതക്കുറവ് എന്ന ആലങ്കാരിക അർഥവും ഈ പദം സ്വാഭാവികമായി അറിയിക്കുന്നു. പൗലോസിന്റെ വൈരുധ്യാത്മക ആവർത്തനം നിലനിർത്താൻ രണ്ടിടത്തും ഒരേ പരിഭാഷ ഉപയോഗിച്ചു.
- source_word: ἐν ἡμῖν
  choice: ഞങ്ങളാൽ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഞങ്ങളിൽ’ എന്നാകാമെങ്കിലും, ഇവിടെ അവരുടെ ഞെരുക്കത്തിന്റെ ഉറവിടം പൗലോസും സഹപ്രവർത്തകരുമല്ല എന്ന ബന്ധപരമായ ആശയമാണ്. മലയാളത്തിൽ ‘ഞങ്ങളാൽ’ അത് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: രണ്ടു വാക്യഭാഗങ്ങൾക്കിടയിലെ വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: നിങ്ങളുടെ സ്വന്തം ഹൃദയവികാരങ്ങളിൽ
  rationale: σπλάγχνα അക്ഷരാർഥത്തിൽ ആന്തരാവയവങ്ങളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ ആഴമുള്ള വികാരങ്ങളെയും സ്നേഹത്തിനുള്ള ആന്തരിക ശേഷിയെയും സൂചിപ്പിക്കുന്നു. ‘ഹൃദയവികാരങ്ങൾ’ ശരീരാധിഷ്ഠിത രൂപകത്തിന്റെ ഒരു അംശം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുന്നു; ‘സ്വന്തം’ എന്നത് നിയന്ത്രണം അവരുടെ ഉള്ളിലാണെന്ന ഊന്നൽ നൽകുന്നു.
- source_word: οὐ
  choice: ഇല്ല / ...പ്പെടുന്നില്ല
  rationale: ആദ്യ വാക്യഭാഗത്തിലെ നിഷേധം മലയാള ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തി.
theological_decisions:
- issue: σπλάγχνα എന്ന പദത്തിന്റെ ആലങ്കാരിക അർഥം
  choice: കൊരിന്ത്യരുടെ ആന്തരിക ഹൃദയവികാരങ്ങളും സ്നേഹപ്രതികരണത്തിനുള്ള ശേഷിയും
  alternative: അക്ഷരാർഥത്തിലുള്ള ‘ആന്തരാവയവങ്ങൾ’; അല്ലെങ്കിൽ പൊതുവായ ‘ഹൃദയം’
  rationale: സന്ദർഭം പൗലോസിന്റെ തുറന്ന മനസ്സിനെയും കൊരിന്ത്യരുടെ പരിമിതമായ പ്രതികരണത്തെയും താരതമ്യം ചെയ്യുന്നതാണ്. അതിനാൽ അക്ഷരാർഥത്തിലുള്ള ശരീരാവയവമല്ല, ആഴമുള്ള വികാരങ്ങളാണ് ഉദ്ദേശ്യം; എന്നാൽ ‘ഹൃദയവികാരങ്ങൾ’ എന്ന പ്രയോഗം മൂലത്തിലെ ശരീരരൂപകം പൂർണമായി മായ്ച്ചുകളയുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ രണ്ടു സമാന ക്രിയകളുടെ ആവർത്തനവും ‘ഞങ്ങൾ/നിങ്ങളുടെ സ്വന്തം’ എന്ന വൈരുധ്യവും നിലനിർത്തി.
