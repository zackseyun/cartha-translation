id: 2CO.6.5
reference: 2 Corinthians 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: ml
  text: അടികളിലും തടവുകളിലും കലാപങ്ങളിലും കഠിനാധ്വാനങ്ങളിലും ഉറക്കമില്ലാത്ത രാത്രികളിലും ഉപവാസങ്ങളിലും;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: അടികളിലും
  rationale: ശാരീരികമായി ഏൽക്കുന്ന പ്രഹരങ്ങളെയോ മർദനങ്ങളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനത്തിന് സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: φυλακαῖς
  choice: തടവുകളിലും
  rationale: കാരാഗൃഹവാസത്തിന്റെ ആവർത്തിത അനുഭവങ്ങളെ ബഹുവചനസ്വഭാവത്തോടെ സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
- source_word: ἀκαταστασίαις
  choice: കലാപങ്ങളിലും
  rationale: ഇവിടെ പട്ടികപ്പെടുത്തിയ പൗലോസിന്റെ ശുശ്രൂഷാനുഭവങ്ങളുടെ പശ്ചാത്തലത്തിൽ പൊതുജനപ്രക്ഷോഭങ്ങളെയോ കലാപങ്ങളെയോ സൂചിപ്പിക്കുന്ന സാധ്യത ഏറ്റവും സ്വാഭാവികമായി നൽകുന്നു; പദത്തിന്റെ വിശാലമായ ‘അക്രമാവസ്ഥ/അശാന്തി’ എന്ന അർഥം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: κόποις
  choice: കഠിനാധ്വാനങ്ങളിലും
  rationale: വെറും ജോലി എന്നതിലുപരി ക്ഷീണം വരുത്തുന്ന അധ്വാനത്തിന്റെ ഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἀγρυπνίαις
  choice: ഉറക്കമില്ലാത്ത രാത്രികളിലും
  rationale: രാത്രിജാഗരണങ്ങളോ ഉറക്കനഷ്ടമോ എന്ന അനുഭവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; അത് സ്വമേധയാ നടത്തിയതാണോ നിർബന്ധിതമായതാണോ എന്ന് നിർണ്ണയിക്കുന്നില്ല.
- source_word: νηστείαις
  choice: ഉപവാസങ്ങളിലും
  rationale: νηστεία എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മതപരമായ സ്വമേധാ ഉപവാസമാണോ ഭക്ഷണമില്ലായ്മയാണോ എന്ന സന്ദർഭപരമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: νηστείαις എന്നത് ആചാരപരമായ ഉപവാസമോ നിർബന്ധിത ഭക്ഷണക്കുറവോ
  choice: ഉപവാസങ്ങളിലും
  alternative: പട്ടിണികളിലും / ഭക്ഷണമില്ലായ്മകളിലും
  rationale: മൂലപദത്തിന്റെ സാധാരണ അർഥം ‘ഉപവാസങ്ങൾ’ എന്നാണ്; പൗലോസിന്റെ ദുരിതപ്പട്ടിക എന്ന പശ്ചാത്തലം മറ്റൊരു വ്യാഖ്യാനത്തിന് ഇടനൽകുന്നുവെങ്കിലും വാചകത്തിൽ തന്നെ അത് നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
- issue: ἀγρυπνίαις എന്നത് ആത്മീയ രാത്രിജാഗരണമോ ദുരിതംമൂലമുള്ള ഉറക്കനഷ്ടമോ
  choice: ഉറക്കമില്ലാത്ത രാത്രികളിലും
  alternative: രാത്രിജാഗരണങ്ങളിലും
  rationale: തിരഞ്ഞെടുത്ത രൂപം അനുഭവത്തെ വ്യക്തമായി പറയുന്നു, എന്നാൽ അതിന്റെ കാരണം നിർണ്ണയിക്കാതെ യഥാർഥ ആശയവൈവിധ്യം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആവർത്തിക്കുന്ന ἐν എന്ന ഘടന ഓരോ ഘടകത്തിലും ‘-ലും’ ഉപയോഗിച്ച് നിലനിർത്തി. പട്ടികയുടെ താളവും ഗൗരവവും സംരക്ഷിക്കുന്ന, ആധുനിക നിലവാരമുള്ള സ്വാഭാവിക മലയാളമാണ് ഉപയോഗിച്ചത്. ഈ വാക്യം അടുത്ത വാക്യഘടകത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം അർധവിരാമം നൽകി.
