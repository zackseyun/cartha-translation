source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: ml
  text: നിർമലതയിൽ, പരിജ്ഞാനത്തിൽ, ദീർഘക്ഷമയിൽ, ദയയിൽ, പരിശുദ്ധാത്മാവിൽ[a], കപടമില്ലാത്ത സ്നേഹത്തിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിശുദ്ധമായ ആത്മാവിൽ’; ഇത് പരിശുദ്ധാത്മാവിനെ അല്ലാതെ വിശുദ്ധമായ ഒരു മനോഭാവത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: നിർമലതയിൽ
  rationale: ἁγνότης വിശാലമായ ധാർമിക ശുദ്ധിയെ സൂചിപ്പിക്കുന്നു. ‘നിർമലത’ അതിനെ ലൈംഗിക നിർമലതയിലേക്കു മാത്രം ചുരുക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: γνώσει
  choice: പരിജ്ഞാനത്തിൽ
  rationale: γνῶσις അറിവിനെയും ഗ്രാഹ്യബോധത്തെയും സൂചിപ്പിക്കുന്നു; ശുശ്രൂഷാസന്ദർഭത്തിലെ പ്രായോഗികവും ആത്മീയവുമായ അറിവ് ഉൾക്കൊള്ളാൻ ‘പരിജ്ഞാനം’ മതിയായ വിശാലത പുലർത്തുന്നു.
- source_word: μακροθυμίᾳ
  choice: ദീർഘക്ഷമയിൽ
  rationale: μακροθυμία ആളുകളോടും പ്രയാസങ്ങളോടും ദീർഘമായി ക്ഷമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദീർഘക്ഷമ’ ഈ ദൈർഘ്യഘടകം സാധാരണ ‘ക്ഷമ’യേക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: χρηστότητι
  choice: ദയയിൽ
  rationale: χρηστότης കരുണാപൂർവമായ നന്മയെയും മറ്റുള്ളവരോടുള്ള സൗമ്യമായ ഉപകാരമനോഭാവത്തെയും സൂചിപ്പിക്കുന്നു; ‘ദയ’ ആ ബന്ധപരമായ ഗുണം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: പൗലോസിന്റെ പ്രയോഗവും സന്ദർഭവും കണക്കിലെടുക്കുമ്പോൾ ദൈവിക പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന. എങ്കിലും മനുഷ്യന്റെ വിശുദ്ധമായ ആത്മഭാവം എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: കപടമില്ലാത്ത സ്നേഹത്തിൽ
  rationale: ἀγάπηയ്ക്ക് ‘സ്നേഹം’ എന്നും ἀνυπόκριτος എന്നതിന് കപടമോ നടിപ്പോ ഇല്ലാത്തത് എന്നും അർഥം. ‘കപടമില്ലാത്ത സ്നേഹം’ ഗ്രീക്കിന്റെ അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐν
  choice: -യിൽ / -ത്തിൽ
  rationale: ആവർത്തിക്കുന്ന ἐν മാർഗം, മേഖല, അല്ലെങ്കിൽ പെരുമാറ്റരീതി സൂചിപ്പിക്കാം. മലയാളത്തിലെ സ്ഥലവിഭക്തി പ്രത്യയത്തിന്റെ ആവർത്തനം ഗ്രീക്കിലെ പട്ടികയുടെ വാഗ്‌ലയവും ഉദ്ദേശപൂർവമായ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πνεύματι ἁγίῳ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ദൈവിക പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യനിലെ വിശുദ്ധമായ ആത്മഭാവം
  rationale: പൗലോസിന്റെ സാധാരണ പ്രയോഗത്തിൽ πνεῦμα ἅγιον ദൈവിക ആത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യത. എന്നാൽ നിർണ്ണായകമായ നിർദേശകം ഇല്ലാത്തതിനാലും ഗുണങ്ങളുടെ പട്ടികയിലാണ് ഇത് വരുന്നതെന്നതിനാലും മനുഷ്യന്റെ വിശുദ്ധമായ ആത്മഭാവം എന്ന വ്യാകരണസാധ്യമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ἐν എന്നതിന്റെ ആവർത്തനതാളം ഓരോ പദത്തിലും ‘-യിൽ/ത്തിൽ’ ഉപയോഗിച്ച് നിലനിർത്തി. വാക്യം അടുത്ത വാക്യഭാഗത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
