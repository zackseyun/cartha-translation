id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: ml
  text: 'എന്തെന്നാൽ അവൻ പറയുന്നു: “സ്വീകാര്യമായ സമയത്ത് ഞാൻ നിനക്കു ചെവികൊടുത്തു[a]; രക്ഷയുടെ ദിവസത്തിൽ ഞാൻ നിന്നെ സഹായിച്ചു.” ഇതാ, ഇപ്പോൾ ഏറെ സ്വീകാര്യമായ സമയമാണ്; ഇതാ[b], ഇപ്പോൾ രക്ഷയുടെ ദിവസമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിന്റെ അപേക്ഷ അനുകൂലമായി കേട്ടു.” ഈ ക്രിയയ്ക്ക് കേൾക്കുക എന്നതിനൊപ്പം സ്വീകരണത്തോടെയോ പ്രതികരിക്കാനുള്ള മനസ്സോടെയോ കേൾക്കുക എന്ന ഭാവവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: “ഇപ്പോൾ സ്വീകാര്യമായ സമയം … ഇപ്പോൾ രക്ഷയുടെ ദിവസം” എന്നും മനസ്സിലാക്കാം. ഗ്രീക്കിൽ ഇവിടെ നിശ്ചിതത്വസൂചക ആർട്ടിക്കിൾ ഇല്ല; മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം നിർദ്ദിഷ്ടവും അനിർദ്ദിഷ്ടവുമായ വായനകൾക്ക് ഇട നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: എന്തെന്നാൽ അവൻ പറയുന്നു
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ സൂചിപ്പിക്കുന്നു. തിരുവെഴുത്തിലെ ദൈവിക പ്രഭാഷകനെ സൂചിപ്പിക്കുന്ന വ്യക്തിപരമായ λέγει ‘അവൻ പറയുന്നു’ എന്ന് നിലനിർത്തുന്നു.
- source_word: Καιρῷ δεκτῷ
  choice: സ്വീകാര്യമായ സമയത്ത്
  rationale: καιρός വെറും കാലക്രമമല്ല, യോജിച്ചതോ നിശ്ചയിക്കപ്പെട്ടതോ ആയ സമയത്തെ സൂചിപ്പിക്കാം; δεκτός എന്നതിന്റെ സ്വീകാര്യത/അനുകൂലത ‘സ്വീകാര്യമായ’ എന്നതിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπήκουσά σου
  choice: ഞാൻ നിനക്കു ചെവികൊടുത്തു
  rationale: കേൾക്കുക എന്ന അടിസ്ഥാനാർഥത്തോടൊപ്പം അനുകൂലമായി കേൾക്കുകയോ പ്രതികരിക്കുകയോ ചെയ്യുന്ന ഭാവവും ക്രിയയ്ക്കുണ്ട്. ‘ഉത്തരം നൽകി’ എന്നു വ്യാഖ്യാനം ഉറപ്പിക്കാതെ മലയാളത്തിൽ ആ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: രക്ഷയുടെ ദിവസത്തിൽ
  rationale: σωτηρία എന്ന നാമരൂപം ‘രക്ഷ’യായി നിലനിർത്തുന്നു. മലയാളത്തിൽ ആർട്ടിക്കിൾ ഇല്ലാത്തതിനാൽ ഗ്രീക്കിലെ നിർദ്ദേശക ആർട്ടിക്കിളിന്റെ അഭാവം സ്വാഭാവികമായ ഈ രൂപത്തിൽ തുറന്ന നിലയിൽ തുടരുന്നു.
- source_word: ἐβοήθησά σοι
  choice: ഞാൻ നിന്നെ സഹായിച്ചു
  rationale: βοηθέω എന്നതിന്റെ നേരിട്ടും വ്യക്തവുമായ ആധുനിക മലയാള പരിഭാഷ.
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്നതും പ്രസ്താവനയ്ക്ക് ഗൗരവവും അടിയന്തരതയും നൽകുന്നതുമായ കണികയുടെ സ്വാഭാവിക മലയാള സമാനം.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: ഏറെ സ്വീകാര്യമായ സമയം
  rationale: εὐπρόσδεκτος സൂചിപ്പിക്കുന്ന ശക്തമായ സ്വീകാര്യതയെ ‘ഏറെ’ വ്യക്തമാക്കുന്നു; അതേസമയം മുമ്പുള്ള δεκτός-നോടുള്ള പദബന്ധം ‘സ്വീകാര്യമായ’ ആവർത്തിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ἡμέρα σωτηρίας
  choice: രക്ഷയുടെ ദിവസം
  rationale: ഗ്രീക്കിലെ നാമബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; νῦν-നോടൊപ്പം ഇത് ഇപ്പോഴത്തെ രക്ഷാകരമായ അവസരത്തിന്റെ അടിയന്തരത പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: സ്വീകാര്യമായ സമയം/രക്ഷയുടെ ദിവസം എന്ന പ്രയോഗങ്ങളെ നിർദ്ദിഷ്ടമോ അനിർദ്ദിഷ്ടമോ ആയി അവതരിപ്പിക്കൽ
  choice: മലയാളത്തിൽ ആർട്ടിക്കിൾ ചേർത്ത് അർഥം നിർബന്ധിക്കാതെ ‘സ്വീകാര്യമായ സമയം’, ‘രക്ഷയുടെ ദിവസം’ എന്ന സ്വാഭാവിക രൂപങ്ങൾ ഉപയോഗിച്ചു.
  alternative: ‘ആ സ്വീകാര്യമായ സമയം’, ‘ആ രക്ഷയുടെ ദിവസം’ എന്നിങ്ങനെ നിർദ്ദിഷ്ടമാക്കുക; അല്ലെങ്കിൽ ‘ഒരു ... സമയം/ദിവസം’ എന്ന് അനിർദ്ദിഷ്ടമാക്കുക.
  rationale: ഗ്രീക്ക് പ്രയോഗങ്ങൾക്ക് ആർട്ടിക്കിൾ ഇല്ല. എന്നാൽ മലയാളത്തിലെ ‘ഒരു’ ചിലപ്പോൾ സംഖ്യാഭാവം നൽകുകയും ‘ആ’ അനാവശ്യമായി നിർദ്ദിഷ്ടത ചേർക്കുകയും ചെയ്യും. ആർട്ടിക്കിൾ ഇല്ലാത്ത മലയാള രൂപം ഉറവിടത്തിലെ തുറന്ന നിലയും പൗലൊസിന്റെ ഇപ്പോഴത്തെ ഊന്നലും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- issue: λέγει എന്നതിന്റെ കർത്താവ് തിരുവെഴുത്തോ ദൈവമോ എന്നത്
  choice: ‘അവൻ പറയുന്നു’ എന്ന വ്യക്തിപരമായ രൂപം ഉപയോഗിച്ചു.
  alternative: ‘തിരുവെഴുത്ത് പറയുന്നു’ അല്ലെങ്കിൽ ‘അതിൽ പറയുന്നു’.
  rationale: ഉദ്ധരണിയിലെ പ്രഭാഷകൻ ദൈവമാണെന്ന പാഠഭാവം വ്യക്തിപരമായ രൂപം സംരക്ഷിക്കുന്നു; അതേസമയം പേരെടുത്ത് ഉറവിടത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- issue: ἐπακούωയെ കേൾക്കൽ, അനുകൂലമായി കേൾക്കൽ, അല്ലെങ്കിൽ ഉത്തരം നൽകൽ എന്നിങ്ങനെ പരിഭാഷപ്പെടുത്തൽ
  choice: ‘നിനക്കു ചെവികൊടുത്തു’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിന്റെ അപേക്ഷ കേട്ടു’ അല്ലെങ്കിൽ ‘നിനക്ക് ഉത്തരം നൽകി’.
  rationale: ഇത് കേൾക്കലും അനുകൂലമായ സ്വീകരണവും ഉൾക്കൊള്ളുന്നു; ‘അപേക്ഷ’ എന്ന നാമമോ വ്യക്തമായ ‘ഉത്തരം’ എന്ന ഫലമോ മൂലപാഠത്തിൽ ചേർക്കാതെ അർഥസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഇതാ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ വാഗ്മിത്വവും അടിയന്തരതയും നിലനിർത്തുന്നു; ‘നിനക്കു ചെവികൊടുത്തു’ ഔപചാരികമെങ്കിലും ഇന്നും സുലഭമായി മനസ്സിലാകുന്ന പ്രയോഗമാണ്.
