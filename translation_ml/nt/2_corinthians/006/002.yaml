revisions:
- from: 'എന്തെന്നാൽ അവൻ പറയുന്നു: “സ്വീകാര്യമായ സമയത്ത് ഞാൻ നിനക്കു ചെവികൊടുത്തു[a]; രക്ഷയുടെ ദിവസത്തിൽ ഞാൻ നിന്നെ സഹായിച്ചു.” ഇതാ, ഇപ്പോഴാണ് ഏറെ സ്വീകാര്യമായ സമയം; ഇതാ[b], ഇപ്പോഴാണ് രക്ഷയുടെ ദിവസം.'
  to: 'എന്തെന്നാൽ അവൻ പറയുന്നു: “സ്വീകാര്യമായ സമയത്ത് ഞാൻ നിനക്കു ചെവികൊടുത്തു[a]; രക്ഷയുടെ ദിവസത്തിൽ ഞാൻ നിന്നെ സഹായിച്ചു.” ഇതാ, ഇപ്പോൾ ഏറെ സ്വീകാര്യമായ സമയമാണ്; ഇതാ[b], ഇപ്പോൾ രക്ഷയുടെ ദിവസമാണ്.'
