id: 2CO.6.4
reference: 2 Corinthians 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: ml
  text: 'എന്നാൽ, എല്ലാ കാര്യത്തിലും[a] ദൈവത്തിന്റെ സേവകരായി[b] ഞങ്ങൾ ഞങ്ങളെത്തന്നെ തെളിയിക്കുന്നു: വളരെ സ്ഥിരതയുള്ള സഹനത്തിലും[c], കഷ്ടതകളിലും, കടുത്ത പ്രയാസങ്ങളിലും, ഞെരുക്കങ്ങളിലും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാ വിധത്തിലും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം വിശാലമാണ്; എല്ലാ സാഹചര്യങ്ങളെയോ തങ്ങൾ ദൈവത്തിന്റെ സേവകരാണെന്ന് തെളിയിക്കുന്ന എല്ലാ വിധങ്ങളെയോ അത് സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിന്റെ ശുശ്രൂഷകരായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം സേവനത്തിന് ഊന്നൽ നൽകുന്നു; ഔദ്യോഗിക പദവിയെ നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: ‘വളരെ സഹനത്തോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. തുടർന്നുള്ള കഷ്ടാനുഭവങ്ങളുടെ പട്ടികയിലുടനീളം ഗ്രീക്കിൽ ‘ഇൽ/യിൽ’ എന്ന ഘടന ആവർത്തിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ നിഷേധാത്മക പ്രസ്താവനയോട് ശക്തമായ വൈരുധ്യം കാണിച്ച് ശുശ്രൂഷയുടെ അനുകൂല വിവരണം അവതരിപ്പിക്കുന്നു.
- source_word: ἐν παντί
  choice: എല്ലാ കാര്യത്തിലും
  rationale: എല്ലാ സാഹചര്യങ്ങളെയും എല്ലാ വിധങ്ങളെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: συνιστάνοντες ἑαυτούς
  choice: ഞങ്ങൾ ഞങ്ങളെത്തന്നെ തെളിയിക്കുന്നു
  rationale: ഇവിടെ συνίστημι വെറും സ്വയം പുകഴ്ത്തലല്ല, ജീവിതത്തിലും സഹനത്തിലും തങ്ങളുടെ ശുശ്രൂഷയുടെ ആധികാരികത പ്രകടമാക്കുന്നതാണ്. മലയാളത്തിൽ ‘തെളിയിക്കുന്നു’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ὡς θεοῦ διάκονοι
  choice: ദൈവത്തിന്റെ സേവകരായി
  rationale: διάκονοι എന്നത് സേവനത്തിന് ഊന്നൽ നൽകുന്നു. ഔദ്യോഗിക സഭാപദവിയുടെ ധ്വനി അനാവശ്യമായി വരാതിരിക്കാൻ ‘ശുശ്രൂഷകർ’ എന്നതിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘സേവകർ’ തിരഞ്ഞെടുത്തു.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: വളരെ സഹിച്ചുനിൽക്കുന്നതിലും
  rationale: ὑπομονή പരീക്ഷകളുടെ മധ്യേ ഉറച്ചുനിൽക്കുന്ന സഹനമാണ്; വെറും കാത്തിരിപ്പോ ക്ഷമയോ അല്ല. ക്രിയാത്മകമായ ഈ മലയാളപ്രയോഗം ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: θλίψεσιν
  choice: കഷ്ടതകളിലും
  rationale: സമ്മർദവും ദുഃഖാനുഭവവും ഉൾപ്പെടുന്ന θλῖψις എന്ന പദത്തിന്റെ സന്ദർഭോചിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἀνάγκαις
  choice: കടുത്ത പ്രയാസങ്ങളിലും
  rationale: ഒഴിവാക്കാനാവാത്തതും സമ്മർദപ്പെടുത്തുന്നതുമായ ദുഷ്കര സാഹചര്യങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ‘ആവശ്യങ്ങൾ’ എന്ന അക്ഷരാർഥം സന്ദർഭത്തിന് യോജിക്കില്ല.
- source_word: στενοχωρίαις
  choice: ഞെരുക്കങ്ങളിലും
  rationale: ചുറ്റും വഴി അടഞ്ഞതുപോലെ കടുത്ത സമ്മർദത്തിലാകുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ രൂപകാത്മക തീവ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശുശ്രൂഷാസന്ദർഭത്തിൽ διάκονοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ദൈവത്തിന്റെ സേവകർ
  alternative: ദൈവത്തിന്റെ ശുശ്രൂഷകർ
  rationale: പദം ദൈവത്തിനായുള്ള സേവനത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ഔദ്യോഗിക സഭാപദവി നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല. അതിനാൽ സ്ഥാപനപരമായ അർഥം ചേർക്കാതെ സേവനത്തിന്റെ ആശയം മുൻനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിത ἐν ഘടന ‘-ത്തിലും/-ങ്ങളിലും’ എന്ന സമാന്തരരൂപങ്ങളിലൂടെ നിലനിർത്തി. കഷ്ടാനുഭവങ്ങളെ സൂചിപ്പിക്കുന്ന മൂന്ന് സമീപാർഥപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം കഴിയുന്നത്ര സംരക്ഷിച്ചു.
