id: 2CO.6.1
reference: 2 Corinthians 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: ml
  text: 'അവനോടൊപ്പം പ്രവർത്തിക്കുന്നവരായി[a] ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു: ദൈവത്തിന്റെ കൃപ വ്യർഥമായി സ്വീകരിക്കരുത്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സഹപ്രവർത്തകരായി ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു.” പൗലോസ് ആരോടൊപ്പമാണ് പ്രവർത്തിക്കുന്നത് എന്നു ഗ്രീക്ക് വാക്യം നേരിട്ട് പറയുന്നില്ല; മുൻസന്ദർഭം ദൈവത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: അവനോടൊപ്പം പ്രവർത്തിക്കുന്നവരായി
  rationale: ക്രിയാവിശേഷണരൂപത്തിന്റെ പ്രവർത്തനഭാവം നിലനിർത്തുന്നു. മുൻസന്ദർഭത്തിലെ ദൈവത്തിന്റെ അനുരഞ്ജനപ്രവർത്തനം കണക്കിലെടുത്ത് സൂചിത പങ്കാളിയെ ‘അവൻ’ എന്നു വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ അത് നേരിട്ട് പറഞ്ഞിട്ടില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: δὲ καὶ
  choice: —
  rationale: δὲ മൃദുവായ സംക്രമണവും καὶ കൂട്ടിച്ചേർക്കലും സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ വേറെ പദങ്ങളില്ലാതെയും ഈ ബന്ധം സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
- source_word: παρακαλοῦμεν
  choice: ഞങ്ങൾ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ ഗൗരവമുള്ള അഭ്യർഥന/പ്രബോധനമാണ് ഉദ്ദേശ്യം. ‘അഭ്യർഥിക്കുന്നു’ ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്.
- source_word: μὴ εἰς κενὸν
  choice: വ്യർഥമായി ... അരുത്
  rationale: ‘ഫലമില്ലാതെ’ അഥവാ ‘ഉദ്ദേശ്യം നിഷ്ഫലമാകുന്ന വിധത്തിൽ’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കൃപ
  rationale: χάρις എന്ന പൗലോസീയ പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും ജനിതകബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δέξασθαι ὑμᾶς
  choice: നിങ്ങൾ ... സ്വീകരിക്കരുത്
  rationale: അക്കുസറ്റീവ്-ഇൻഫിനിറ്റീവ് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള അഭ്യർഥനയായി പുനഃക്രമീകരിക്കുന്നു.
theological_decisions:
- issue: ‘ഒരുമിച്ച് പ്രവർത്തിക്കുന്നു’ എന്നതിന്റെ സൂചിത പങ്കാളി
  choice: ‘അവനോടൊപ്പം’ എന്നു ചേർത്ത്, മുൻസന്ദർഭപ്രകാരം ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘സഹപ്രവർത്തകരായി’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, ആരോടൊപ്പമാണ് പ്രവർത്തിക്കുന്നത് എന്നു വ്യക്തമാക്കാതിരിക്കുക.
  rationale: 2 കൊരിന്ത്യർ 5:18–20-ൽ ദൈവത്തിന്റെ അനുരഞ്ജനപ്രവർത്തനവും പൗലോസിന്റെ ദൂതപങ്കും കേന്ദ്രത്തിലാണ്. അതിനാൽ ദൈവമാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചിത പങ്കാളി. എങ്കിലും ഗ്രീക്ക് മൂലത്തിൽ കർമ്മം വ്യക്തമല്ലാത്തതിനാൽ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ദൈവകൃപ ‘വ്യർഥമായി സ്വീകരിക്കുക’ എന്ന പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം
  choice: 'മൂലത്തിലെ മുന്നറിയിപ്പ് അതേപടി നിലനിർത്തുന്നു: ‘ദൈവത്തിന്റെ കൃപ വ്യർഥമായി സ്വീകരിക്കരുത്.’'
  alternative: ‘ദൈവകൃപയെ നിരസിക്കരുത്’ അല്ലെങ്കിൽ ‘കൃപ ഫലമില്ലാതാകാൻ അനുവദിക്കരുത്’ എന്ന് വ്യാഖ്യാനിച്ച് പറയുക.
  rationale: വാക്യം കൃപ സ്വീകരിക്കുന്നതും അത് വ്യർഥമാകുന്നതും തമ്മിലുള്ള ഉദ്ദേശപൂർവമായ സംഘർഷം നിലനിർത്തുന്നു. ഒരു പ്രത്യേക രക്ഷാശാസ്ത്രവ്യാഖ്യാനം ചേർത്ത് അതിനെ പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. ‘അഭ്യർഥിക്കുന്നു,’ ‘കൃപ,’ ‘വ്യർഥമായി’ എന്നീ പദങ്ങൾ സഭാപരമായ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. മുഖ്യവാക്യത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി കൃത്യമായി ചേർത്തിരിക്കുന്നു.
