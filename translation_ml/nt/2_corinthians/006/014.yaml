id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: ml
  text: അവിശ്വാസികളോടൊപ്പം പൊരുത്തമില്ലാത്ത നുകത്തിൽ ചേരരുത്.[a] നീതിനിഷ്ഠയ്ക്കും അധർമ്മത്തിനും തമ്മിൽ എന്തു പങ്കാളിത്തമാണുള്ളത്? വെളിച്ചത്തിനും ഇരുട്ടിനും തമ്മിൽ എന്തു കൂട്ടായ്മയാണുള്ളത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൊരുത്തമില്ലാത്ത നുകം’ എന്ന പ്രയോഗം വ്യത്യസ്ത തരത്തിലുള്ള മൃഗങ്ങളെ ഒരേ നുകത്തിൽ കെട്ടുന്ന ദൃശ്യത്തെ ഓർമിപ്പിക്കുന്നു; ആവർത്തനം 22:10 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: ഏർപ്പെടരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. γίνομαιയുടെ ‘ആയിത്തീരുക/ഒരു നിലയിലേക്കു പ്രവേശിക്കുക’ എന്ന ചലനാത്മക ഭാവം സന്ദർഭാനുസൃതമായി ‘ഏർപ്പെടുക’യിൽ പ്രതിഫലിക്കുന്നു.
- source_word: ἑτεροζυγοῦντες
  choice: പൊരുത്തമില്ലാത്ത നുകത്തിൽ
  rationale: വ്യത്യസ്ത തരത്തിലുള്ള മൃഗങ്ങളെ ഒരേ നുകത്തിൽ കെട്ടുന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു; ഉപമയെ വെറും പൊതുവായ ‘ചേരരുത്’ എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: ἀπίστοις
  choice: അവിശ്വാസികളോടൊപ്പം
  rationale: വിശ്വസിക്കാത്തവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥവും നുകം പങ്കിടുന്ന ബന്ധത്തിന്റെ ആശയവും നേരിട്ട് നൽകുന്നു.
- source_word: μετοχὴ
  choice: പങ്കാളിത്തം
  rationale: ഒരുമിച്ചുള്ള പങ്ക് അഥവാ പങ്കുചേരൽ എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും അടുത്ത ചോദ്യത്തിലെ κοινωνίαയിൽനിന്നുള്ള സൂക്ഷ്മമായ പദവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമികമായ ശരിതനിമയും ന്യായപരമായ അർഥപരിധിയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം; ഇവിടെ ἀνομίαയോടുള്ള വിരുദ്ധതയിൽ യോജിക്കുന്നു.
- source_word: ἀνομίᾳ
  choice: അധർമ്മം
  rationale: നിയമവിരുദ്ധതയും ദൈവഹിതത്തോടുള്ള വിരോധവും ഉൾപ്പെടുന്ന ἀνομίαയുടെ ധാർമിക ശക്തി സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: κοινωνία
  choice: കൂട്ടായ്മ
  rationale: അടുത്ത പങ്കിടൽ, സഹവാസം, പൊതുവായ പങ്കാളിത്തം എന്നീ ആശയങ്ങൾ നൽകുകയും ‘പങ്കാളിത്തം’ എന്ന മുൻപത്തെ പദത്തിൽനിന്ന് വേർതിരിവ് സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: φωτὶ πρὸς σκότος
  choice: വെളിച്ചവും ഇരുട്ടും തമ്മിൽ
  rationale: പ്രകാശം–അന്ധകാരം എന്ന രൂപകവിരുദ്ധത അതേപടി നിലനിർത്തി, πρός സൂചിപ്പിക്കുന്ന പരസ്പരബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘തമ്മിൽ’ എന്നു നൽകുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പൗലോസിന്റെ പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: നീതിനിഷ്ഠ
  rationale: ഇവിടെ ἀνομίαയോടുള്ള ധാർമിക വിരുദ്ധതയാണ് മുഖ്യം. ‘നീതി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും അർഥവ്യാപ്തിയുള്ളതുമാണ്; വ്യക്തിയുടെ ശരിയായ നിലയെയോ നീതിപൂർവമായ പെരുമാറ്റത്തെയോ മാത്രം നിർബന്ധിച്ച് ചുരുക്കുന്നില്ല.
- issue: ἑτεροζυγοῦντες നിർദേശിക്കുന്ന ബന്ധത്തിന്റെ വ്യാപ്തി
  choice: നുകത്തിന്റെ രൂപകം നിലനിർത്തി, പ്രത്യേക ബന്ധവിഭാഗം നിർദേശിക്കാതെ വിവർത്തനം ചെയ്തു
  alternative: വിവാഹബന്ധത്തിനോ മതപരമായ കൂട്ടുകെട്ടിനോ മാത്രമായി വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യം അവിശ്വാസികളുമായുള്ള പൊരുത്തമില്ലാത്ത നുകത്തെക്കുറിച്ചാണ് പറയുന്നത്; ഈ വാക്യത്തിൽ മാത്രം അതിനെ വിവാഹം പോലുള്ള ഒരൊറ്റ ബന്ധവിഭാഗമായി പരിമിതപ്പെടുത്തുന്നത് മൂലപാഠത്തിലുള്ള വ്യാപ്തിയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പരമ്പരാഗതമായി പരിചിതമായ ‘നുകം’, ‘അധർമ്മം’ എന്നീ പദങ്ങൾ രൂപകത്തിന്റെയും ധാർമിക വിരുദ്ധതയുടെയും കൃത്യതയ്ക്കായി നിലനിർത്തി; വാക്യഘടന സ്വാഭാവിക മലയാളചോദ്യരീതിയാക്കി.
