source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ml
  text: എന്നോടൊപ്പം ചില മക്കെദോന്യർ വന്ന് നിങ്ങളെ ഒരുക്കമില്ലാത്തവരായി കണ്ടാൽ, ഈ ആത്മവിശ്വാസത്തിന്റെ കാര്യത്തിൽ ഞങ്ങൾ—നിങ്ങളെക്കുറിച്ച് പറയേണ്ടതില്ല[b]—ലജ്ജിതരാകേണ്ടിവരാതിരിക്കാൻ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ആത്മവിശ്വാസത്തിൽ.’ സന്ദർഭത്തിൽ ഗ്രീക്ക് പദത്തിന് ‘ഈ ഉദ്യമത്തിൽ’ എന്നോ ‘ഈ സാഹചര്യത്തിൽ’ എന്നോ അർഥമാകാനും കഴിയും; എന്നാൽ ഇവിടെ അത് നിങ്ങളെക്കുറിച്ചുള്ള പൗലോസിന്റെ ആത്മവിശ്വാസത്തെയാണ് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളെ പരാമർശിക്കേണ്ടതില്ല.’ നിങ്ങൾ ഒരുക്കമില്ലാത്തവരായി കാണപ്പെട്ടാൽ നിങ്ങളും ആ ലജ്ജയിൽ പങ്കുചേരുമെന്ന് പൗലോസ് ഈ ഇടയ്ക്കുചേർത്ത വാക്കുകളിലൂടെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: …വന്നാൽ … ലജ്ജിതരാകാതിരിക്കാനാണ്
  rationale: μή πως പ്രകടിപ്പിക്കുന്ന ആശങ്കയും പ്രതിരോധലക്ഷ്യവും മലയാളത്തിലെ നിഷേധാത്മക ഉദ്ദേശ്യഘടനയിലൂടെ സ്വാഭാവികമായി അറിയിച്ചു; ἐάν എന്ന വ്യവസ്ഥ ‘വന്നാൽ’ എന്നതിൽ നിലനിർത്തി.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: മക്കെദോന്യരിൽ ആരെങ്കിലും എന്നോടൊപ്പം വന്ന്
  rationale: വ്യക്തമായി നിർദേശിക്കാത്ത സാധ്യതാപരമായ സംഘത്തെ സൂചിപ്പിക്കുന്ന അനിശ്ചിതഭാവം ‘ആരെങ്കിലും’ കൊണ്ട് വ്യക്തമാക്കി.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: നിങ്ങളെ ഒരുക്കമില്ലാത്തവരായി കണ്ടാൽ
  rationale: സമാഹരണം തയ്യാറായിട്ടില്ലെന്ന സന്ദർഭോചിത അർഥം ലളിതവും നേരിട്ടുമുള്ള മലയാളത്തിൽ നൽകി.
- source_word: καταισχυνθῶμεν
  choice: ലജ്ജിതരാകുക
  rationale: ക്രിയയുടെ നിഷ്ക്രിയരൂപവും മറ്റുള്ളവരുടെ മുമ്പിൽ നാണക്കേടിലാകുന്ന സാമൂഹികഭാവവും ‘ലജ്ജിതരാകുക’ സംരക്ഷിക്കുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ‘ഞങ്ങൾ’ വ്യക്തമാക്കി.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: നിങ്ങളെപ്പറ്റി പറയേണ്ടതില്ല
  rationale: കൊരിന്ത്യർക്കും ലജ്ജ പങ്കിടേണ്ടിവരുമെന്ന പരോക്ഷസൂചന നിലനിർത്തുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: ഈ ആത്മവിശ്വാസത്തിന്റെ കാര്യത്തിൽ
  rationale: ὑπόστασις ഇവിടെ തത്ത്വചിന്താപരമായ ‘സത്ത’ അല്ല, കൊരിന്ത്യരെക്കുറിച്ചുള്ള പൗലോസിന്റെ ആത്മവിശ്വാസമാണെന്ന സന്ദർഭം വ്യക്തമാക്കുന്നു; പദത്തിന്റെ മറ്റു സന്ദർഭസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
theological_decisions:
- issue: സാങ്കേതികമല്ലാത്ത പൗലോസിന്റെ പ്രയോഗത്തിൽ ὑπόστασις എന്നതിന്റെ അർഥം
  choice: ആത്മവിശ്വാസം/ആത്മവിശ്വാസത്തിന്റെ കാര്യം
  alternative: ഉദ്യമം; സാഹചര്യം
  rationale: മക്കെദോന്യരുടെ മുമ്പിൽ കൊരിന്ത്യരുടെ സന്നദ്ധതയെക്കുറിച്ചുള്ള പൗലോസിന്റെ ആത്മവിശ്വാസമാണ് ഉടൻ വരുന്ന സന്ദർഭം. ‘സത്ത’ പോലുള്ള പിൽക്കാല തത്ത്വചിന്താപരമായ അർഥം ഇവിടെ ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ ലെക്സിക്കൽ തുറന്ന നില അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘമായ ആശങ്കാഭരിത വ്യവസ്ഥാവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ക്രമപ്പെടുത്തി; എന്നാൽ വ്യവസ്ഥ, ഊന്നൽ, പരാന്തരപ്രയോഗം, നിഷ്ക്രിയമായ ലജ്ജാഭാവം എന്നിവ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
