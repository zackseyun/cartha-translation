id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: ml
  text: കൂടാതെ, അവർ നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുമ്പോൾ[a], നിങ്ങളുടെമേലുള്ള ദൈവത്തിന്റെ അത്യധികമായ കൃപ നിമിത്തം അവർ നിങ്ങളെ അതിയായി ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങൾക്കുവേണ്ടിയുള്ള അവരുടെ യാചനയിൽ, നിങ്ങളെ അതിയായി ആഗ്രഹിച്ചുകൊണ്ട്.’'
    reason: δέησις എന്നതിന്റെ ‘യാചന’ എന്ന പദവികല്പവും പ്രാർഥനയും ആഗ്രഹവും തമ്മിലുള്ള ചുരുക്കപ്പെട്ട ഗ്രീക്ക് വാക്യഘടനയും സൂചിപ്പിക്കാൻ.
lexical_decisions:
- source_word: δέησις
  choice: പ്രാർഥന
  rationale: ഇവിടെ ദത്തിവ് രൂപമായ δεήσει പ്രാർഥനയുടെ സാഹചര്യത്തെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്നു. ‘പ്രാർഥന’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മധ്യസ്ഥയാചന ഉൾക്കൊള്ളാൻ മതിയായ വ്യാപ്തിയുള്ളതുമാണ്.
- source_word: αὐτῶν
  choice: അവർ
  rationale: സമ്മാനം സ്വീകരിക്കുന്ന യെരൂശലേമിലെ വിശ്വാസികളെയാണ് ഇത് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘അവർ ... പ്രാർഥിക്കുമ്പോൾ’ എന്നു ക്രിയാവാക്യമായി തുറന്നുപറയുന്നത് ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ὑπέρ + ഷഷ്ഠി പ്രാർഥനാസന്ദർഭത്തിൽ ‘വേണ്ടി, പ്രതിനിധിയായി’ എന്ന അർഥം നൽകുന്നു; ‘നിങ്ങൾക്കുവേണ്ടി’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: ἐπιποθούντων
  choice: കാണാൻ അതിയായി ആഗ്രഹിക്കുന്നു
  rationale: ἐπιποθέω ശക്തവും തുടർന്നുനിൽക്കുന്നതുമായ വാഞ്ഛയെ സൂചിപ്പിക്കുന്നു. വ്യക്തികളോടുള്ള ഈ ആഗ്രഹം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘കാണാൻ അതിയായി ആഗ്രഹിക്കുന്നു’ എന്നു നൽകി; ‘കാണാൻ’ എന്നത് പദശഃ ഇല്ലെങ്കിലും വ്യക്തികളോടുള്ള longing എന്ന ആശയം അനാവശ്യമായ അസ്പഷ്ടതയില്ലാതെ കൈമാറുന്നു.
- source_word: διὰ
  choice: നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; ‘നിമിത്തം’ ഗൗരവമുള്ളതും വ്യക്തവുമായ കാരണസൂചകപ്രയോഗമാണ്.
- source_word: ὑπερβάλλουσαν
  choice: അത്യധികമായ
  rationale: സാധാരണ അളവിനെ കവിയുന്ന അസാധാരണ സമൃദ്ധിയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘അത്യധികമായ’ താരതമ്യാതീതമായ ശക്തി നിലനിർത്തുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ χάρις ദൈവത്തിന്റെ സൗജന്യമായ അനുഗ്രഹവും പ്രവർത്തനശക്തിയും വഹിക്കുന്നു; ‘കൃപ’ അതിന്റെ സ്ഥാപിതവും യോജിച്ചതുമായ മലയാളപദമാണ്.
- source_word: ἐφ’ ὑμῖν
  choice: നിങ്ങളുടെമേലുള്ള
  rationale: ἐπί + dative നൽകുന്ന ‘നിങ്ങളുടെമേൽ’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; കൃപ അവരിൽ പ്രവർത്തിക്കുന്നു എന്നതിനെക്കാൾ അപ്പുറമുള്ള വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: καὶ
  choice: —
  rationale: ഈ വാക്യം മുൻവാക്യത്തോട് ചേർന്നുനിൽക്കുന്നുവെങ്കിലും ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ തുടക്കത്തിലെ ‘കൂടാതെ/അവരും’ മലയാളത്തിൽ ഭാരമുള്ളതായി വരാം. സന്ദർഭബന്ധം വാക്യക്രമത്തിലൂടെ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: പ്രാർഥനയും ആഗ്രഹവും തമ്മിലുള്ള വാക്യഘടനാബന്ധം
  choice: അവർ നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുന്ന സാഹചര്യത്തിൽ നിങ്ങളെ അതിയായി ആഗ്രഹിക്കുന്നു എന്ന രണ്ടു പ്രവൃത്തികളും നിലനിർത്തി.
  alternative: ‘നിങ്ങൾക്കുവേണ്ടിയുള്ള അവരുടെ യാചനയാൽ, നിങ്ങളെ അതിയായി ആഗ്രഹിച്ചുകൊണ്ട്’ എന്ന കൂടുതൽ പദാനുപദരൂപം; അല്ലെങ്കിൽ പ്രാർഥനയെ ആഗ്രഹം പ്രകടമാകുന്ന മാർഗമായി ഊന്നൽ നൽകൽ.
  rationale: ഗ്രീക്കിൽ αὐτῶν-നോട് ചേർന്ന genitive participle കാരണം ഘടന ചുരുക്കപ്പെട്ടതാണ്. മലയാളത്തിൽ അത് തുറന്നുപറയേണ്ടിവരുന്നു; എങ്കിലും പ്രാർഥനയും ആഗ്രഹവും രണ്ടും സംരക്ഷിച്ച് അവയുടെ ബന്ധം പാഠം അനുവദിക്കുന്നതിലപ്പുറം സിദ്ധാന്തപരമായി നിർണയിച്ചിട്ടില്ല.
- issue: ἐφ’ ὑμῖν എന്നതിലെ കൃപയുടെ ബന്ധം
  choice: ‘നിങ്ങളുടെമേലുള്ള ദൈവത്തിന്റെ ... കൃപ’ എന്ന സ്ഥാന/ബന്ധ രൂപകം സംരക്ഷിച്ചു.
  alternative: ‘നിങ്ങളിൽ പ്രവർത്തിക്കുന്ന’ അല്ലെങ്കിൽ ‘നിങ്ങളോടുള്ള’ ദൈവകൃപ.
  rationale: ‘മേലുള്ള’ എന്നത് ഗ്രീക്ക് രൂപകത്തോട് അടുത്തുനിൽക്കുകയും കൃപയെ വെറും മനോഭാവമോ പ്രത്യേക പ്രവർത്തനഫലമോ ആയി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രാർഥന’, ‘കൃപ’, ‘നിമിത്തം’ എന്നീ പരിചിതമായ വിശ്വാസഭാഷാപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ഗ്രീക്ക് വാക്യത്തിന്റെ ചുരുക്കം വായനാസൗകര്യത്തിനായി ക്രിയാവാക്യമായി തുറന്നു.
