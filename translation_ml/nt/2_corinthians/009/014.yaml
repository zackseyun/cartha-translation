revisions:
- from: അവർ നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുമ്പോൾ[a], നിങ്ങളുടെമേലുള്ള ദൈവത്തിന്റെ അത്യധികമായ കൃപ നിമിത്തം നിങ്ങളെ കാണാൻ അതിയായി ആഗ്രഹിക്കുന്നു.
  to: കൂടാതെ, അവർ നിങ്ങൾക്കുവേണ്ടി പ്രാർഥിക്കുമ്പോൾ[a], നിങ്ങളുടെമേലുള്ള ദൈവത്തിന്റെ അത്യധികമായ കൃപ നിമിത്തം അവർ നിങ്ങളെ അതിയായി ആഗ്രഹിക്കുന്നു.
  rationale: ‘കാണാൻ’ നീക്കി ἐπιποθούντων-ന്റെ സന്ദർഭനിർവചിക്കാത്ത വ്യക്തിപരമായ ആഗ്രഹം സംരക്ഷിച്ചു. ‘കൂടാതെ’ ചേർത്ത് καί-യുടെ ബന്ധം പ്രകടമാക്കി. പ്രാർഥനയും ആഗ്രഹവും തമ്മിലുള്ള ഗ്രീക്കിലെ സംക്ഷിപ്തബന്ധം മുഖ്യവാക്യത്തിലും അടിക്കുറിപ്പിലും വ്യാഖ്യാനാതീതമായി നിലനിർത്തിയിരിക്കുന്നു.
