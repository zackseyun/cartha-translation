revisions:
- from: ഈ ശുശ്രൂഷ നൽകിയ തെളിവുനിമിത്തം[a], നിങ്ങൾ ഏറ്റുപറയുന്ന മശീഹയുടെ[d] സുവിശേഷത്തോടുള്ള അനുസരണത്തിനായും[b] അവരോടും എല്ലാവരോടുമുള്ള നിങ്ങളുടെ ഉദാരമായ പങ്കുവെക്കലിനായും[c] അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുന്നു.
  to: ഈ ശുശ്രൂഷ നൽകുന്ന തെളിവിലൂടെ[a], മശീഹയുടെ[d] സുവിശേഷത്തെക്കുറിച്ചുള്ള നിങ്ങളുടെ ഏറ്റുപറച്ചിലിൽ പ്രകടമാകുന്ന അനുസരണം നിമിത്തവും[b] അവരോടും എല്ലാവരോടുമുള്ള നിങ്ങളുടെ ഉദാരമായ പങ്കുവെക്കൽ നിമിത്തവും[c] അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുന്നു.
  rationale: The revision retains the evidence/ministry relationship and clarifies, without doctrinal expansion, that the obedience is manifested in the readers’ confession concerning the Messiah’s gospel. All footnote anchors are retained and their text is aligned with the revised wording.
