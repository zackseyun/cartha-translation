id: 2CO.9.13
reference: 2 Corinthians 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: ml
  text: ഈ ശുശ്രൂഷ നൽകുന്ന തെളിവിലൂടെ[a], മശീഹയുടെ[d] സുവിശേഷത്തെക്കുറിച്ചുള്ള നിങ്ങളുടെ ഏറ്റുപറച്ചിലിൽ പ്രകടമാകുന്ന അനുസരണം നിമിത്തവും[b] അവരോടും എല്ലാവരോടുമുള്ള നിങ്ങളുടെ ഉദാരമായ പങ്കുവെക്കൽ നിമിത്തവും[c] അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ശുശ്രൂഷയുടെ പരീക്ഷിക്കപ്പെട്ട സ്വഭാവത്തിലൂടെ.’ ഇവിടെ ഉപയോഗിച്ച ഗ്രീക്ക് പദത്തിന് പരീക്ഷണം, പരീക്ഷയിലൂടെ തെളിയിക്കപ്പെട്ട ഗുണം, തെളിവ് എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘മശീഹയുടെ സുവിശേഷത്തെക്കുറിച്ചുള്ള നിങ്ങളുടെ ഏറ്റുപറച്ചിലിന്റെ കീഴടങ്ങൽ.’ ഗ്രീക്ക് വാക്യഘടന ഏറ്റുപറച്ചിലും അനുസരണവും തമ്മിലുള്ള ബന്ധം സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.'
    reason: ambiguity
  - marker: c
    text: ഇവിടെ ‘പങ്കുവെക്കൽ’ പൊതുവായ കൂട്ടായ്മയെ മാത്രമല്ല, പ്രധാനമായും സഹായധനശേഖരണത്തിലുള്ള ഉദാരമായ ദ്രവ്യപങ്കാളിത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘ക്രിസ്തുവിന്റെ.’ Χριστός എന്ന ഗ്രീക്ക് പദം ‘അഭിഷിക്തൻ’ എന്ന അർഥമുള്ള പദവിയാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: translation_of_title
lexical_decisions:
- source_word: δοκιμῆς
  choice: തെളിവ്
  rationale: ഈ സഹായശുശ്രൂഷ കൊരിന്ത്യരുടെ വിശ്വാസത്തിന്റെയും സ്നേഹത്തിന്റെയും ആധികാരികത പ്രകടമാക്കുന്ന തെളിവായി പ്രവർത്തിക്കുന്നു. പരീക്ഷണത്തിന്റെ പ്രക്രിയയെക്കാൾ അതിലൂടെ തെളിയിക്കപ്പെട്ട ഫലമാണ് സന്ദർഭത്തിൽ മുന്നിൽ നിൽക്കുന്നത്.
- source_word: διακονίας
  choice: ശുശ്രൂഷ
  rationale: പൗലോസ് ക്രമീകരിക്കുന്ന പ്രായോഗിക സഹായപ്രവർത്തനത്തെയും അതിന്റെ വിശുദ്ധമായ സേവനസ്വഭാവത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: δοξάζοντες τὸν θεὸν
  choice: അവർ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുന്നു
  rationale: ഗ്രീക്കിലെ കൃദന്തരൂപം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി കർത്താവോടുകൂടിയ സമാപികക്രിയയായി നൽകി; δοξάζω എന്നതിന്റെ ഭാരം ‘മഹത്ത്വപ്പെടുത്തുക’ നിലനിർത്തുന്നു.
- source_word: ὑποταγῇ
  choice: അനുസരണം
  rationale: സുവിശേഷത്തോടുള്ള കീഴടങ്ങൽ പ്രവൃത്തിയിൽ പ്രകടമാകുന്നതാണ് ഇവിടെ ഉദ്ദേശ്യം. ‘അനുസരണം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: ὁμολογίας ὑμῶν
  choice: നിങ്ങൾ ഏറ്റുപറയുന്ന
  rationale: ὁμολογία വിശ്വാസത്തിന്റെ തുറന്ന ഏറ്റുപറച്ചിലിനെയോ പ്രഖ്യാപനത്തെയോ സൂചിപ്പിക്കുന്നു. ഗ്രീക്ക് നാമപദബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപത്തിൽ നൽകി.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: മശീഹയുടെ സുവിശേഷത്തോടുള്ള
  rationale: εἰς സൂചിപ്പിക്കുന്ന ബന്ധമോ ദിശയോ ‘-ത്തോടുള്ള’ എന്ന രൂപം നിലനിർത്തുന്നു; Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘മശീഹ’ എന്നു നൽകി.
- source_word: ἁπλότητι
  choice: ഉദാരമായ
  rationale: ധനശേഖരണത്തിന്റെ പശ്ചാത്തലത്തിൽ ἁπλότης ലളിതത്വത്തേക്കാൾ കപടമില്ലാത്ത, തുറന്ന കൈയുള്ള ഉദാരതയെ സൂചിപ്പിക്കുന്നു.
- source_word: κοινωνίας
  choice: പങ്കുവെക്കൽ
  rationale: κοινωνίαയ്ക്ക് കൂട്ടായ്മ, പങ്കാളിത്തം എന്നീ വിശാല അർഥങ്ങളുണ്ടെങ്കിലും ഇവിടെ ദ്രവ്യസഹായത്തിലുള്ള പങ്കാളിത്തമാണ് പ്രധാനമായും ഉദ്ദേശിക്കുന്നത്. ‘പങ്കുവെക്കൽ’ ആ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: അവരോടും എല്ലാവരോടുമുള്ള
  rationale: ആ സഹായത്തിന്റെ ദിശയും അതിന്റെ വിശാലതയും ആവർത്തിച്ചുള്ള εἰς പ്രകടമാക്കുന്നു; κοινωνία ‘പങ്കുവെക്കൽ’ എന്നു നൽകിയതിനോട് ഈ മലയാളപ്രയോഗം യോജിക്കുന്നു.
theological_decisions:
- issue: εὐαγγέλιον τοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ വിവർത്തനം
  choice: മശീഹയുടെ സുവിശേഷം
  alternative: ക്രിസ്തുവിന്റെ സുവിശേഷം
  rationale: Χριστός ഇവിടെ പേരുപോലെ മാത്രം ഉപയോഗിച്ചിട്ടില്ല; ദൈവത്തിന്റെ അഭിഷിക്തനായ രാജാവ് എന്ന പദവിയുടെ അർഥവും വഹിക്കുന്നു. ‘മശീഹ’ ആ പദവിയുടെ ശക്തി നിലനിർത്തുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: നിങ്ങൾ ഏറ്റുപറയുന്ന ... സുവിശേഷത്തോടുള്ള അനുസരണം
  alternative: സുവിശേഷത്തെക്കുറിച്ചുള്ള നിങ്ങളുടെ ഏറ്റുപറച്ചിലിന്റെ കീഴടങ്ങൽ
  rationale: ഗ്രീക്കിലെ നാമപദബന്ധം കൃത്യമായി എങ്ങനെ ബന്ധിപ്പിക്കണമെന്നതിൽ ചെറിയ അവ്യക്തതയുണ്ട്. മുഖ്യപാഠം ഏറ്റുപറച്ചിലിനൊപ്പമുള്ള പ്രായോഗിക അനുസരണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കൂടുതൽ രൂപാനുസൃതമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ നീണ്ട വാക്യഘടനയുടെ ബന്ധങ്ങൾ നിലനിർത്തിക്കൊണ്ട്, ‘നിങ്ങൾ ഏറ്റുപറയുന്ന’ എന്ന സ്വാഭാവിക ക്രിയാരൂപം ഉപയോഗിച്ചു. സഹായധനശേഖരണത്തിന്റെ പശ്ചാത്തലം മുഖ്യപാഠത്തിൽ അമിതമായി വിശദീകരിക്കാതെ ‘ഉദാരമായ പങ്കുവെക്കൽ’ എന്നതിലൂടെ സൂചിപ്പിക്കുകയും വിശദാംശം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
