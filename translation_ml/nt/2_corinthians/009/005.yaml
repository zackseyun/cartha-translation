- from: അതുകൊണ്ട്, സഹോദരന്മാരെ[a] ഞങ്ങൾക്കു മുമ്പേ നിങ്ങളുടെ അടുക്കൽ പോകാനും നിങ്ങൾ വാഗ്ദാനം ചെയ്തിരുന്ന ഉദാരമായ സംഭാവന[b] മുൻകൂട്ടി ഒരുക്കിവെക്കാനും പ്രേരിപ്പിക്കേണ്ടത് ആവശ്യമാണെന്ന് ഞാൻ കരുതി. അങ്ങനെ അത് നിർബന്ധിച്ചുവാങ്ങിയ ഒന്നായിട്ടല്ല[c], ഉദാരമായ ഒരു സമ്മാനമായി തയ്യാറായിരിക്കും.
