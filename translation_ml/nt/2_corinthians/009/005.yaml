id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരെ[a] ഞങ്ങൾക്കു മുമ്പേ നിങ്ങളുടെ അടുക്കൽ പോകാനും നിങ്ങൾ വാഗ്ദാനം ചെയ്തിരുന്ന ഉദാരമായ സംഭാവന[b] മുൻകൂട്ടി ക്രമീകരിക്കാനും പ്രേരിപ്പിക്കേണ്ടത് ആവശ്യമാണെന്ന് ഞാൻ കരുതി; അങ്ങനെ അത് സമ്മർദം ചെലുത്തി പിഴിഞ്ഞെടുത്തതുപോലെയല്ല[c], ഉദാരമായ സംഭാവനയായി തയ്യാറായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരീസഹോദരന്മാർ’ എന്നും അർഥമാകാം; ഇവിടെ ഈ പദം പ്രതിനിധിസംഘത്തെ ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗമാണെങ്കിൽ.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘അനുഗ്രഹം.’ ഇവിടെ അത് കൊരിന്ത്യർ വാഗ്ദാനം ചെയ്ത ഉദാരമായ സംഭാവനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്ക് പദം സാധാരണയായി ‘അത്യാഗ്രഹം’ അഥവാ ‘ദുരാഗ്രഹം’ എന്നാണ്. ഇവിടെ ഉദാരമായി നൽകിയ സംഭാവനയ്ക്കു പകരം സമ്മർദം ചെലുത്തി പിഴിഞ്ഞെടുത്ത ഒന്നെന്ന ആശയമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον ... ἡγησάμην
  choice: ആവശ്യമാണെന്ന് ഞാൻ കരുതി
  rationale: പൗലോസിന്റെ ആലോചിച്ചുറച്ച പ്രായോഗിക നിർണയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; നിർബന്ധമെന്ന അർഥം അതിരുകടന്ന് നൽകുന്നില്ല.
- source_word: παρακαλέσαι
  choice: പ്രേരിപ്പിക്കേണ്ടത്
  rationale: പ്രതിനിധികൾ ഉടൻ പ്രവർത്തിക്കണമെന്ന ശക്തമായ അഭ്യർഥനയെ ആധുനികവും മാന്യവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരെ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: ഞങ്ങൾക്കു മുമ്പേ നിങ്ങളുടെ അടുക്കൽ പോകാനും
  rationale: മുൻകൂട്ടി പോകുന്ന പ്രതിനിധിസംഘത്തെ യാത്രാസന്ദർഭം അനുസരിച്ച് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: προκαταρτίσωσι
  choice: മുൻകൂട്ടി ഒരുക്കിവെക്കാനും
  rationale: പൗലോസ് എത്തുംമുമ്പ് സംഭാവനയുടെ ക്രമീകരണം പൂർത്തിയാക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: നിങ്ങൾ വാഗ്ദാനം ചെയ്തിരുന്ന ഉദാരമായ സംഭാവന
  rationale: മുൻവാഗ്ദാനത്തിന്റെ കാലബന്ധവും ശേഖരണസന്ദർഭത്തിൽ εὐλογία സൂചിപ്പിക്കുന്ന ഉദാരസംഭാവനയും വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὕτως ὡς εὐλογίαν
  choice: ഉദാരമായ ഒരു സമ്മാനമായി
  rationale: ആദ്യത്തെ εὐλογίαയുമായുള്ള ആശയപരമായ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ അനാവശ്യ പദാവർത്തനം കുറയ്ക്കുന്നു.
- source_word: πλεονεξίαν
  choice: നിർബന്ധിച്ചുവാങ്ങിയ ഒന്നായിട്ട്
  rationale: സാധാരണയായി ‘അത്യാഗ്രഹം/ദുരാഗ്രഹം’ എന്നർഥമുള്ള പദം ഇവിടെ മനസ്സില്ലാതെ കൊടുക്കുന്നവരിൽനിന്ന് പിഴിഞ്ഞെടുത്ത സംഭാവനയെ ചിത്രീകരിക്കുന്നു; വിപുലമായ പദാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφοὺς എന്ന പദത്തിന്റെ ലിംഗസൂചന
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. പ്രതിനിധിസംഘത്തെ ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗമാകാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ശേഖരണസന്ദർഭത്തിലെ εὐλογίαയുടെ അർഥം
  choice: ഉദാരമായ സംഭാവന / ഉദാരമായ സമ്മാനം
  alternative: അനുഗ്രഹം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് കൊരിന്ത്യർ വാഗ്ദാനം ചെയ്ത സാമ്പത്തിക സംഭാവനയാണെന്ന് വായനക്കാരന് വ്യക്തമായി നൽകുന്നു; അതേ സമയം പൗലോസിന്റെ ‘അനുഗ്രഹം’ എന്ന രൂപകം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: εὐλογίαയും πλεονεξίαയും തമ്മിലുള്ള വിരോധം
  choice: ഉദാരമായ സമ്മാനം—നിർബന്ധിച്ചുവാങ്ങിയ ഒന്ന്
  alternative: അനുഗ്രഹം—അത്യാഗ്രഹം
  rationale: സംഭാവനയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ യഥാർഥ വിരോധം—സ്വമേധയായുള്ള ഉദാരതയോ സമ്മർദത്തിലൂടെ പിഴിഞ്ഞെടുക്കലോ—മലയാളത്തിൽ അർഥവത്തായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. ‘സംഭാവന’ ശേഖരണസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘സമ്മാനം’ എന്ന ആവർത്തനം εὐλογίαയുടെ അനുകൂലഭാവം നിലനിർത്തുന്നു. വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കിക്കൊണ്ട് മൂലത്തിലെ ഉദ്ദേശ്യബന്ധവും ശക്തമായ വിരോധവും സംരക്ഷിച്ചിട്ടുണ്ട്.
