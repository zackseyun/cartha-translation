source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങളെക്കുറിച്ചുള്ള ഞങ്ങളുടെ പുകഴ്ച ഈ കാര്യത്തിൽ[b] വ്യർഥമായിപ്പോകാതിരിക്കാനും[a], ഞാൻ പറഞ്ഞിരുന്നതുപോലെ നിങ്ങൾ സജ്ജരായിരിക്കാനുംവേണ്ടി ഞാൻ സഹോദരന്മാരെ അയച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അടിസ്ഥാനമില്ലാത്തതാണെന്ന് തെളിയാതിരിക്കാനും” അല്ലെങ്കിൽ “നിഷ്ഫലമാക്കപ്പെടാതിരിക്കാനും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈ വിഷയത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: ഞാൻ ... അയച്ചു
  rationale: ആഖ്യാനപരവും വിശദീകരണാത്മകവുമായ ഈ സന്ദർഭത്തിൽ aorist indicative-നെ ലളിതമായ ഭൂതകാലമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοὺς ἀδελφούς
  choice: സഹോദരന്മാരെ
  rationale: സന്ദർഭത്തിൽ പരാമർശിക്കപ്പെട്ടിരിക്കുന്ന പ്രത്യേക പുരുഷപ്രതിനിധികളെയാണ് വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ചുള്ള ഞങ്ങളുടെ പ്രശംസ
  rationale: കൊരിന്ത്യരെക്കുറിച്ച് പൗലോസ് അഭിമാനത്തോടെ പറഞ്ഞ കാര്യത്തെയാണ് καύχημα സൂചിപ്പിക്കുന്നത്; ‘പ്രശംസ’ ആ ആശയം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: κενωθῇ
  choice: വ്യർഥമായിപ്പോകാതിരിക്കാൻ
  rationale: ἵνα μή-യോടുകൂടിയ passive aorist subjunctive പ്രതിരോധലക്ഷ്യം പ്രകടിപ്പിക്കുന്നു. പദശഃ ‘ശൂന്യമാക്കപ്പെടുക’ എന്ന ദൃശ്യത്തെക്കാൾ, ഈ സന്ദർഭത്തിലെ ‘അടിസ്ഥാനമില്ലാത്തതായി/ഫലശൂന്യമായി തീരുക’ എന്ന അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: ഈ കാര്യത്തിൽ
  rationale: μέρος ഇവിടെ ഭൗതികമായ ‘ഭാഗം’ എന്നല്ല, ഒരു പ്രത്യേക വിഷയം അഥവാ കാര്യം എന്ന അർഥത്തിലാണ്.
- source_word: καθὼς ἔλεγον
  choice: ഞാൻ പറഞ്ഞിരുന്നതുപോലെ
  rationale: imperfect ആയ ἔλεγον മുൻപ് തുടർച്ചയായോ ആവർത്തിച്ചോ പറഞ്ഞതിന്റെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: παρεσκευασμένοι ἦτε
  choice: നിങ്ങൾ ഒരുങ്ങിയിരിക്കാൻ
  rationale: ഈ periphrastic perfect construction ഉദ്ദേശിക്കുന്ന സജ്ജമായ അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
