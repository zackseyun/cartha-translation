translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഇരട്ട ἵνα ലക്ഷ്യഘടന മലയാളത്തിലെ ‘-ാതിരിക്കാനും ... -ിരിക്കാനുംവേണ്ടി’ എന്ന സമാന്തരഘടനയിൽ നിലനിർത്തി. പൗലോസിന്റെ മുൻകാല ആവർത്തിത പ്രസ്താവനയുടെ സൂക്ഷ്മത ‘പറഞ്ഞിരുന്നതുപോലെ’ എന്നതിലൂടെ സംരക്ഷിച്ചു.
