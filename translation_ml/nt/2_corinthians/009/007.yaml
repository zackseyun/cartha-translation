id: 2CO.9.7
reference: 2 Corinthians 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: ml
  text: ഓരോരുത്തരും ഹൃദയത്തിൽ തീരുമാനിച്ചിരിക്കുന്നതുപോലെ കൊടുക്കട്ടെ; ദുഃഖത്തിൽനിന്നോ[a] നിർബന്ധം മൂലമോ അല്ല. സന്തോഷത്തോടെ കൊടുക്കുന്നവനെ ദൈവം സ്നേഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനസ്സില്ലാമനസ്സോടെ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ദുഃഖത്തിൽനിന്ന്” അല്ലെങ്കിൽ “സങ്കടത്തിൽനിന്ന്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തരും
  rationale: വിതരണാർഥമുള്ള ഏകവചനത്തിന്റെ വ്യക്തിഗത ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: ഹൃദയത്തിൽ തീരുമാനിച്ചിരിക്കുന്നതുപോലെ
  rationale: മുൻകൂട്ടിയുള്ള ബോധപൂർവമായ വ്യക്തിപരമായ തീരുമാനം എന്ന ആശയം വ്യക്തമാക്കുകയും ‘ഹൃദയം’ എന്ന ബൈബിൾപരമായ പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μὴ ἐκ λύπης
  choice: ദുഃഖത്തോടെയോ അരുത്
  rationale: λύπη എന്ന പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ദുഃഖം/സങ്കടം നിലനിർത്തുന്നു. സന്ദർഭാർഥമായ ‘മനസ്സില്ലാമനസ്സോടെ’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἢ ἐξ ἀνάγκης
  choice: നിർബന്ധത്താലോ അരുത്
  rationale: പുറത്തുനിന്നുള്ള സമ്മർദമോ നിർബന്ധിതാവസ്ഥയോ മൂലം കൊടുക്കുന്നതിനെ ἀνάγκη ഇവിടെ സൂചിപ്പിക്കുന്നു.
- source_word: ἱλαρὸν ... δότην
  choice: സന്തോഷത്തോടെ കൊടുക്കുന്നവനെ
  rationale: സന്തോഷവും മനസ്സൊരുക്കവും നിറഞ്ഞ ദാതാവിന്റെ മനോഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀγαπᾷ ὁ θεός
  choice: ദൈവം സ്നേഹിക്കുന്നു
  rationale: ക്രിയയുടെയും കർത്താവിന്റെയും നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ദൈവിക അംഗീകാരം എന്ന വ്യാഖ്യാനം മാത്രം ചേർത്ത് ‘സ്നേഹിക്കുന്നു’ എന്നതിനെ ദുർബലപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: കൊടുക്കാനുള്ള ക്രിയയുടെ പൂരണം
  choice: കൊടുക്കട്ടെ
  alternative: ഓരോരുത്തരും ... എന്ന ഘടന ക്രിയയില്ലാതെ വിടുക
  rationale: ഗ്രീക്കിൽ സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘കൊടുക്കുക’ എന്ന ക്രിയ മലയാളത്തിൽ വാക്യം പൂർണമാക്കാൻ ആവശ്യമാണ്; ‘-ട്ടെ’ ഉപദേശാത്മകമായ നിർദേശം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- issue: λύπη എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: ദുഃഖത്തോടെ
  alternative: മനസ്സില്ലാമനസ്സോടെ
  rationale: മൂലപദത്തിന്റെ ദുഃഖം/സങ്കടം എന്ന അർഥം മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ച്, കൊടുക്കുന്നതിലെ മടിയെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἕκαστος എന്ന പ്രതിനിധാന ഏകവചനം
  choice: ഓരോരുത്തരും
  alternative: ഓരോ പുരുഷനും
  rationale: ഗ്രീക്ക് രൂപം വ്യാകരണപരമായി പുല്ലിംഗമായിരുന്നാലും സന്ദർഭത്തിൽ എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ ‘ഓരോരുത്തരും’ വ്യക്തിഗത ഊന്നൽ നിലനിർത്തി അനാവശ്യമായ ലിംഗപരിമിതി ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വ്യക്തിഗത തീരുമാനവും കൊടുക്കുന്നവന്റെ മനോഭാവവും വ്യക്തമായി നിലനിർത്തുന്നു. ഗ്രീക്കിലെ പ്രതിനിധാന ഏകവചനം മലയാളത്തിൽ ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ ‘ഓരോരുത്തരും’ എന്ന രൂപത്തിൽ നൽകിയിരിക്കുന്നു.
