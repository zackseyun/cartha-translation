id: 2CO.9.15
reference: 2 Corinthians 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: ml
  text: ദൈവത്തിനു അവന്റെ വിവരിക്കാനാവാത്ത ദാനത്തിനായി നന്ദി[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പറഞ്ഞറിയിക്കാനാവാത്ത ദാനം.’ പൂർണമായി വിവരിക്കാനോ വാക്കുകളിൽ പ്രകടിപ്പിക്കാനോ കഴിയാത്തത് എന്ന അർഥം ഗ്രീക്ക് വിശേഷണത്തിനുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: നന്ദി
  rationale: τῷ θεῷ എന്ന ദത്തിവിനോടുകൂടിയ ഈ ഉദ്‌ഘോഷവാക്യത്തിൽ χάρις ‘കൃപ’ എന്നതിലുപരി ദൈവത്തോടുള്ള നന്ദിപ്രകടനമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: നന്ദിയുടെ സ്വീകർത്താവിനെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിൽ ‘ദൈവത്തിനു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπὶ
  choice: -നായി
  rationale: ദൈവത്തിന്റെ ദാനമാണ് നന്ദിയുടെ കാരണമോ അടിസ്ഥാനമോ എന്ന ബന്ധം മലയാളത്തിൽ ‘ദാനത്തിനായി’ എന്നു സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἀνεκδιηγήτῳ
  choice: വിവരിച്ചുതീരാത്ത
  rationale: പൂർണമായി വിവരിക്കാനോ പറഞ്ഞറിയിക്കാനോ കഴിയാത്തത് എന്ന ഗ്രീക്ക് അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: സർവനാമം മുമ്പുള്ള ദൈവത്തെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ സർവനാമരൂപം നിലനിർത്തുന്നു.
- source_word: δωρεᾷ
  choice: ദാനം
  rationale: പ്രതിഫലമില്ലാതെ നൽകപ്പെടുന്ന സമ്മാനം എന്ന ആശയം ഇവിടെ ‘ദാനം’ വ്യക്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു; ‘സൗജന്യദാനം’ എന്നു ചേർക്കേണ്ടതില്ല.
theological_decisions:
- issue: ‘അവന്റെ വിവരിച്ചുതീരാത്ത ദാനം’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: ദൈവത്തിന്റെ ദാനം എന്നു മാത്രം പറഞ്ഞ് സൂചിതവിഷയം വ്യക്തമാക്കാതെ നിലനിർത്തി.
  alternative: ക്രിസ്തു; ക്രിസ്തുവിലുള്ള രക്ഷയോ കൃപയോ; കൊരിന്ത്യരുടെ ഔദാര്യം ഉൾപ്പെടെ ദൈവകൃപയുടെ വിശാലമായ പ്രവർത്തനം.
  rationale: വാക്യം ദാനത്തിന്റെ സൂചിതവിഷയം നേരിട്ട് നിർവചിക്കുന്നില്ല. ഉടൻമുമ്പുള്ള പശ്ചാത്തലം ദൈവകൃപ ഉളവാക്കുന്ന ഔദാര്യത്തെക്കുറിച്ചാണെങ്കിലും ക്രിസ്തീയ വ്യാഖ്യാനത്തിൽ ക്രിസ്തുവും രക്ഷയും കേന്ദ്രമായി കാണപ്പെടുന്നു. പരിഭാഷ ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കാതെ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം സ്തുതിവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമായ ശൈലി. ‘വിവരിച്ചുതീരാത്ത’ എന്ന പ്രയോഗം അതിശയോക്തിയുടെ ശക്തിയും പൂർണ വിവരണത്തിന്റെ അസാധ്യതയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
