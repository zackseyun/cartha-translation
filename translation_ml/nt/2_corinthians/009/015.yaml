- from: വിവരിച്ചുതീരാത്ത അവന്റെ ദാനത്തിനായി ദൈവത്തിനു നന്ദി[a]!
  to: ദൈവത്തിനു അവന്റെ വിവരിക്കാനാവാത്ത ദാനത്തിനായി നന്ദി[a]!
  rationale: 'The revision makes one limited lexical and stylistic adjustment: “വിവരിക്കാനാവാത്ത” more directly and naturally expresses the Greek adjective’s sense of being beyond adequate description. The word order foregrounds God in the Malayalam thanksgiving formula without changing meaning. The gift’s referent remains deliberately unspecified, as in the Greek.'
