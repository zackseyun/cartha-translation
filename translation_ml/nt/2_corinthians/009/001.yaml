id: 2CO.9.1
reference: 2 Corinthians 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: ml
  text: വിശുദ്ധന്മാർക്കായുള്ള[a] ശുശ്രൂഷയെക്കുറിച്ചാകട്ടെ, നിങ്ങളോട് എഴുതുന്നത് എനിക്ക് അനാവശ്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിശുദ്ധന്മാരിലേക്കുള്ള.’ ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് ഉപസർഗം ദിശയെയോ ഗുണഭോക്താക്കളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: …യെക്കുറിച്ചാകട്ടെ
  rationale: Περὶ വിഷയം അവതരിപ്പിക്കുന്നു; μὲν γὰρ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട് വിഷയമാറ്റം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘യെക്കുറിച്ചാകട്ടെ’ ഈ വ്യവഹാരപ്രവർത്തനം സ്വാഭാവികമായി നൽകുന്നു; γὰρ-ന് വേറൊരു കൃത്രിമ സംയോജകം ചേർക്കുന്നില്ല.
- source_word: διακονίας
  choice: ശുശ്രൂഷ
  rationale: ഇവിടെ ആവശ്യത്തിലിരിക്കുന്ന വിശ്വാസികൾക്കായുള്ള സംഭരണവും സഹായപ്രവർത്തനവും ഉദ്ദേശിക്കുന്നുവെങ്കിലും, പൗലോസ് അതിനെ മാന്യമായി വിശേഷിപ്പിക്കുന്ന διακονία എന്ന പദത്തിന്റെ വിശാലത ‘ശുശ്രൂഷ’ നിലനിർത്തുന്നു.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: വിശുദ്ധന്മാർക്കായുള്ള
  rationale: εἰς ഇവിടെ ദിശയെയോ ഗുണഭോക്താക്കളെയോ സൂചിപ്പിക്കാം. ‘ക്കായുള്ള’ സന്ദർഭത്തിൽ സ്വാഭാവികവും ഗുണഭോക്തൃഭാവം വ്യക്തമാക്കുന്നതുമാണ്; ദിശാസൂചനയായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἁγίους
  choice: വിശുദ്ധന്മാർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവുപദമാണ് ἅγιοι. ‘വിശുദ്ധന്മാർ’ അതിന്റെ സംക്ഷിപ്തവും പരിചിതവുമായ സമാനപദമാണ്.
- source_word: περισσόν
  choice: അനാവശ്യമാണ്
  rationale: ഇവിടെ περισσόν അധികമായതോ ആവർത്തനപരമായതോ ആയതിനാൽ ആവശ്യമില്ലെന്ന അർഥത്തിലാണ്. ‘അനാവശ്യമാണ്’ ആ വാചാടോപബലം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: നിങ്ങളോട് എഴുതുന്നത് എനിക്ക് അനാവശ്യമാണ്
  rationale: ആർട്ടിക്കിൾ ചേർന്ന ഇൻഫിനിറ്റീവ് ഘടനയെ മലയാളത്തിലെ ക്രിയാനാമഘടനയിലൂടെ അവതരിപ്പിച്ച്, μοί എന്ന വ്യക്തിപരമായ സൂചനയും ὑμῖν എന്ന അഭിമുഖതയും സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷ,’ ‘വിശുദ്ധന്മാർ’ എന്നീ സഭാപരിചിത പദങ്ങൾ മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തി നിലനിർത്തുന്നതിനായി ഉപയോഗിച്ചു; വാക്യത്തിന്റെ വിഷയമാറ്റം ‘യെക്കുറിച്ചാകട്ടെ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തിലൂടെ സൂചിപ്പിച്ചു.
