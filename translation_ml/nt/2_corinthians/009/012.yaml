source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: ml
  text: എന്തെന്നാൽ, ഈ സേവനത്തിന്റെ ശുശ്രൂഷ വിശുദ്ധരുടെ ആവശ്യങ്ങൾ[a] നിറവേറ്റുന്നതു മാത്രമല്ല, ദൈവത്തോടുള്ള അനേകം കൃതജ്ഞതാപ്രകടനങ്ങളിലൂടെ കവിഞ്ഞൊഴുകുകയും[b] ചെയ്യുന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധർക്ക് കുറവായിരിക്കുന്നതു നികത്തുക.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്തോടുള്ള അനേകം കൃതജ്ഞതാപ്രകടനങ്ങളിൽ സമൃദ്ധമാകുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കാരണസൂചകബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: ഈ സേവനകർമത്തിന്റെ ശുശ്രൂഷ
  rationale: διακονία, λειτουργία എന്നീ ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ നാമങ്ങളെ യഥാക്രമം ‘ശുശ്രൂഷ’, ‘സേവനകർമം’ എന്നു നൽകി അവ തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: προσαναπληροῦσα
  choice: നിറവേറ്റുക
  rationale: കുറവായിരിക്കുന്നതു നികത്തുക എന്ന ആശയം ഈ ദാനസഹായസന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὰ ὑστερήματα
  choice: ആവശ്യങ്ങൾ
  rationale: അഭാവങ്ങളെയോ കുറവുകളെയോ സൂചിപ്പിക്കുന്ന പദം സഹായസന്ദർഭത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: പൗലോസ് വിശ്വാസികളെ വിളിക്കാൻ പതിവായി ഉപയോഗിക്കുന്ന സഭാപരമായ പദത്തിന്റെ ഭാരം നിലനിർത്തുന്നു.
- source_word: περισσεύουσα
  choice: കവിഞ്ഞൊഴുകുകയും
  rationale: ആവശ്യത്തിന് അതീതമായ സമൃദ്ധിയുടെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: അനേകം കൃതജ്ഞതാസ്തുതികളിലൂടെ ദൈവത്തിലേക്കു
  rationale: διάയുടെ മാധ്യമാർഥവും കൃതജ്ഞതാസ്തുതികളുടെ ദൈവാഭിമുഖ്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἅγιοι എന്ന പൗലോസിന്റെ പ്രയോഗം
  choice: വിശുദ്ധർ
  alternative: ദൈവജനം; വിശുദ്ധരായവർ
  rationale: ദാനം സ്വീകരിക്കുന്ന സഹവിശ്വാസികളെയാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ‘വിശുദ്ധർ’ എന്നത് പൗലോസിന്റെ സഭാപരമായ പദപ്രയോഗം നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട വിശുദ്ധപദവി എന്ന ആശയം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ദൈവത്തോടുള്ള കൃതജ്ഞതാസ്തുതികളുമായുള്ള ശുശ്രൂഷയുടെ ബന്ധം
  choice: അനേകം കൃതജ്ഞതാസ്തുതികളിലൂടെ ദൈവത്തിലേക്കു കവിഞ്ഞൊഴുകുന്നു
  alternative: ദൈവത്തോടുള്ള അനേകം കൃതജ്ഞതാസ്തുതികളിൽ സമൃദ്ധമാകുന്നു
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/വഴി എന്ന ബന്ധവും τῷ θεῷ സൂചിപ്പിക്കുന്ന സ്വീകർത്താവോ ദിശയോ നിലനിർത്തുന്നു; ഫലബന്ധം മാത്രം എന്നു നിർണ്ണയിച്ച് അവ്യക്തത നീക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സേവനകർമം/ശുശ്രൂഷ’ എന്ന പദജോടി ഗ്രീക്കിലെ λειτουργία/διακονία വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുന്നു. മൂലവാക്യത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന അവസാന ദീർഘരേഖയും സംരക്ഷിച്ചിട്ടുണ്ട്.
