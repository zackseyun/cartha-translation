  to: എന്തെന്നാൽ, ഈ സേവനത്തിന്റെ ശുശ്രൂഷ വിശുദ്ധരുടെ ആവശ്യങ്ങൾ[a] നിറവേറ്റുന്നതു മാത്രമല്ല, ദൈവത്തോടുള്ള അനേകം കൃതജ്ഞതാപ്രകടനങ്ങളിലൂടെ കവിഞ്ഞൊഴുകുകയും[b] ചെയ്യുന്നു—
