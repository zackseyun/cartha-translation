  terminology: ‘വിത്ത്,’ ‘അപ്പം,’ ‘പെരുപ്പിക്കുകയും,’ and ‘വിളവ്’ preserve the lexical and agricultural imagery well. ‘നീതി’ is a legitimate broad Malayalam rendering of δικαιοσύνη and, together with footnote b, retains the righteousness/justice semantic range without imposing a theological interpretation.
