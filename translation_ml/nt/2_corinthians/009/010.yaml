id: 2CO.9.10
reference: 2 Corinthians 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: ml
  text: വിതയ്ക്കുന്നവന് വിത്തും ഭക്ഷിക്കാൻ അപ്പവും നൽകുന്നവൻ നിങ്ങളുടെ വിത്ത് നൽകുകയും പെരുപ്പിക്കുകയും നിങ്ങളുടെ നീതിയുടെ വിളവ് വർധിപ്പിക്കുകയും ചെയ്യും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ നീതിയുടെ ഫലങ്ങൾ (അല്ലെങ്കിൽ ഉൽപ്പന്നങ്ങൾ) വർധിപ്പിക്കും.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “നീതി” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “നീതിനിഷ്ഠ” എന്നോ “ന്യായം” എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: നൽകുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി. സമൃദ്ധമായി പ്രദാനം ചെയ്യുക എന്ന സൂക്ഷ്മഭാവം സന്ദർഭത്തിൽ നിലനിൽക്കുന്നുവെങ്കിലും വാചകത്തിൽ അനാവശ്യമായി ശക്തിപ്പെടുത്തിയില്ല.
- source_word: σπόρον
  choice: വിത്ത്
  rationale: വിതയ്ക്കൽ എന്ന കാർഷികചിത്രവും തുടർന്നുള്ള രൂപകവും നിലനിർത്തുന്ന സാധാരണ പദം.
- source_word: τῷ σπείροντι
  choice: വിതയ്ക്കുന്നവന്
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
- source_word: ἄρτον εἰς βρῶσιν
  choice: ഭക്ഷിക്കാൻ അപ്പം
  rationale: വിതയ്ക്കാനുള്ള വിത്തും ഭക്ഷിക്കാനുള്ള അപ്പവും തമ്മിലുള്ള വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: χορηγήσει
  choice: നൽകുകയും
  rationale: ഭാവികാല അർഥം അവസാനത്തെ ‘ചെയ്യും’ എന്നതുമായി ചേർന്ന് വരുന്നു; ἐπιχορηγῶν എന്ന മുൻപത്തെ ക്രിയയുമായുള്ള ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: πληθυνεῖ
  choice: പെരുപ്പിക്കുകയും
  rationale: വിത്തിന്റെ അളവ് കൂടുതലാക്കുക എന്ന കാർഷികവും രൂപകാത്മകവുമായ അർഥം പ്രകടമാക്കുന്നു.
- source_word: τὸν σπόρον ὑμῶν
  choice: നിങ്ങളുടെ വിത്ത്
  rationale: കൊരിന്ത്യരുടെ ദാനശേഷിയിലേക്കും ഭൗതിക വിഭവങ്ങളിലേക്കും ഒരുപോലെ തുറന്നുനിൽക്കുന്ന രൂപകം അക്ഷുണ്ണമായി സൂക്ഷിക്കുന്നു.
- source_word: αὐξήσει
  choice: വർധിപ്പിക്കുകയും ചെയ്യും
  rationale: വളർച്ചയെയും കൂടുതലാകുന്നതിനെയും സൂചിപ്പിക്കുന്ന ഭാവികാലക്രിയ സ്വാഭാവിക മലയാളത്തിൽ നൽകി.
- source_word: τὰ γενήματα
  choice: വിളവ്
  rationale: ഉൽപ്പന്നം, ഫലം, വിളവ് എന്നീ സാധ്യതകളിൽ കാർഷികരൂപകം ഏറ്റവും വ്യക്തമായി നിലനിർത്തുന്ന പദം; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമിക നിഷ്ഠയും ന്യായവും ഉൾക്കൊള്ളാവുന്ന അർഥവ്യാപ്തി മലയാളത്തിലെ ‘നീതി’ നിലനിർത്തുന്നു; സന്ദർഭത്തെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രവായനയിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിങ്ങളുടെ നീതിയുടെ വിളവ്’ എന്നതിന്റെ അർഥം
  choice: കൊരിന്ത്യരുടെ നീതിപൂർവമായ ഔദാര്യത്തിൽനിന്ന് ഉണ്ടാകുന്ന ഫലങ്ങളെ സൂചിപ്പിക്കുന്ന തുറന്ന കാർഷികരൂപകമായി നിലനിർത്തി.
  alternative: ഔദാര്യത്തിന്റെ ഫലമായ ഭൗതിക അനുഗ്രഹം; നീതിപൂർവമായ പെരുമാറ്റത്തിന്റെ തെളിവ്; ന്യായത്തിന്റെയോ ഉടമ്പടിവിശ്വസ്തതയുടെയോ ഫലം.
  rationale: ഉദാരമായ ദാനത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിലാണ് കാർഷികചിത്രം വരുന്നത്. അതിനെ സമൃദ്ധിവാഗ്ദാനമായോ നിയമപരമായി കണക്കാക്കപ്പെടുന്ന നീതിയായോ സാമൂഹികന്യായം മാത്രമായോ പരിമിതപ്പെടുത്തിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിൽ വ്യക്തമായ ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദമില്ലാത്തതിനാൽ വാക്യാരംഭത്തിൽ അത്തരം ബന്ധകപദം ചേർത്തിട്ടില്ല. ആവർത്തിക്കുന്ന ‘നൽകുക’ എന്ന ആശയബന്ധവും വിത്ത്–വിളവ് കാർഷികരൂപകവും സൂക്ഷിച്ചു.
