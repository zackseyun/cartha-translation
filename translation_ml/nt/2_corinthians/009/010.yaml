  source_fidelity: 'The Malayalam accurately represents the Greek structure and agricultural metaphor: God supplies seed to the sower and bread for food, and will supply, multiply, and increase the Corinthians’ seed and the yield of their righteousness. The future force of χορηγήσει, πληθυνεῖ, and αὐξήσει is appropriately carried by the final ‘ചെയ്യും.’'
