language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: ml
  text: 'കാര്യം ഇതാണ്: അല്പമായി വിതയ്ക്കുന്നവൻ അല്പമായിത്തന്നെ കൊയ്യും; അനുഗ്രഹങ്ങളോടെ[a] വിതയ്ക്കുന്നവൻ അനുഗ്രഹങ്ങളോടെത്തന്നെ കൊയ്യും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉദാരമായി’ / ‘സമൃദ്ധമായി.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അനുഗ്രഹങ്ങളോടെ’ എന്ന നാമപദപ്രയോഗമാണ്; ഈ സന്ദർഭത്തിൽ അത് ഉദാരമായ അളവിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'കാര്യം ഇതാണ്:'
  rationale: δέയുടെ ലഘുവായ വിഷയമാറ്റവും Τοῦτο എന്നതിന്റെ ചൂണ്ടിക്കാണിക്കൽഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: ὁ σπείρων
  choice: വിതയ്ക്കുന്നവൻ
  rationale: സാമാന്യവും പഴഞ്ചൊല്ലുസദൃശവുമായ substantival participle-ന്റെ പ്രതിനിധാനഭാവം നിലനിർത്തുന്നു.
- source_word: φειδομένως
  choice: അല്പമായി
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന മിതമായോ കുറഞ്ഞ അളവിലോ എന്ന ആശയം ലളിതമായി നൽകുന്നു; ‘പിശുക്കോടെ’ എന്നു പറഞ്ഞാൽ മൂലപദം നിർബന്ധിക്കാത്ത ശക്തമായ ധാർമ്മിക കുറ്റപ്പെടുത്തൽ വരും.
- source_word: καὶ θερίσει
  choice: തന്നെ കൊയ്യും
  rationale: വിതയ്ക്കുന്ന രീതിക്കും കൊയ്യുന്ന രീതിക്കും ഇടയിലെ അനുരൂപത മലയാളത്തിലെ ‘തന്നെ’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπ’ εὐλογίαις
  choice: അനുഗ്രഹങ്ങളോടെ
  rationale: εὐλογία എന്ന നാമപദത്തിന്റെ ‘അനുഗ്രഹം’ എന്ന ശബ്ദബന്ധം സംരക്ഷിക്കുന്നു; അതേസമയം പ്രസംഗസന്ദർഭത്തിൽ ഇത് ഉദാരമായ അളവിനെ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
- source_word: ἐπ’ εὐλογίαις ... καὶ θερίσει
  choice: അനുഗ്രഹങ്ങളോടെ വിതയ്ക്കുന്നവൻ അനുഗ്രഹങ്ങളോടെതന്നെ കൊയ്യും
  rationale: വിതയ്ക്കലിലും കൊയ്ത്തിലും ഒരേ പ്രയോഗം ആവർത്തിക്കുന്ന പൗലോസിന്റെ സമാന്തരതയും വാക്കുകളിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐπ’ εὐλογίαις എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘അനുഗ്രഹങ്ങളോടെ’ എന്നു നൽകി അനുഗ്രഹഭാഷ സംരക്ഷിച്ചു.
  alternative: ‘ഉദാരമായി’ അല്ലെങ്കിൽ ‘സമൃദ്ധമായി’
  rationale: സാമ്പത്തിക ഉദാരതയാണ് സന്ദർഭമെന്നതിനാൽ അവ സാധുവായ വ്യാഖ്യാനപരമായ പരിഭാഷകളാണ്. എന്നാൽ ‘അനുഗ്രഹം’ എന്ന നാമപദം നിലനിർത്തുന്നത് ഉദാരമായ കൊടുക്കലും അനുഗ്രഹവും തമ്മിലുള്ള പൗലോസിന്റെ ബന്ധം മായാതെ സൂക്ഷിക്കുന്നു. ഇത് ഭൗതിക സമ്പത്ത് ലഭിക്കുമെന്ന യാന്ത്രിക ഉറപ്പായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വിതയ്ക്കൽ–കൊയ്ത്ത് സമാന്തരത സംക്ഷിപ്തമായി നിലനിർത്തി; കൃത്രിമമായ പദാനുപദഭാവം ഒഴിവാക്കിയെങ്കിലും ‘അനുഗ്രഹം’ എന്ന മൂലപദബന്ധം സംരക്ഷിച്ചു.
