id: 2CO.9.11
reference: 2 Corinthians 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: ml
  text: എല്ലാ ഉദാരതയ്ക്കായി എല്ലാ വിധത്തിലും സമ്പന്നരാക്കപ്പെടുന്ന നിങ്ങൾ; ആ ഉദാരത ഞങ്ങളിലൂടെ ദൈവത്തോടുള്ള നന്ദി ഉളവാക്കുന്നു—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: എല്ലാ വിധത്തിലും
  rationale: ഇവിടെയുള്ള പ്രയോഗം സമഗ്രമായ ദൈവിക പ്രദാനം സൂചിപ്പിക്കുന്നു; ‘എല്ലാ വിധത്തിലും’ എന്നത് അതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πλουτιζόμενοι
  choice: സമ്പന്നരാക്കപ്പെടുന്ന നിങ്ങൾ
  rationale: വർത്തമാനകാല കർമണി കൃദന്തരൂപം നിലനിർത്തുകയും ദൈവമാണ് പരോക്ഷമായി പ്രവർത്തിക്കുന്നവൻ എന്ന ആശയം തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: എല്ലാ ഉദാരതയ്ക്കും പ്രാപ്തരാകും
  rationale: εἰς ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു; ധനശേഖരണത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ ἁπλότης തുറന്ന കൈയോടെയുള്ള ഉദാരതയെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ പൂർണ്ണവാക്യപ്രവാഹത്തിനായി ‘പ്രാപ്തരാകും’ ചേർത്തിരിക്കുന്നു.
- source_word: ἥτις
  choice: ആ ഉദാരത
  rationale: ബന്ധസർവനാമം മുമ്പുപറഞ്ഞ ഉദാരതയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ നാമം ആവർത്തിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: κατεργάζεται
  choice: ഉളവാക്കുന്നു
  rationale: ഒരു ഫലം ഉണ്ടാക്കുക എന്ന ക്രിയയുടെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δι’ ἡμῶν
  choice: ഞങ്ങളിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമത്വം നേരിട്ട് നിലനിർത്തുന്നു; പൗലോസും സഹപ്രവർത്തകരും ദാനം കൈകാര്യം ചെയ്യുന്നുവെന്നത് സന്ദർഭത്തിന് വിട്ടുകൊടുക്കുന്നു.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: ദൈവത്തോടുള്ള നന്ദി
  rationale: ദൈവത്തെ ലക്ഷ്യമാക്കിയ നന്ദിപ്രതികരണം എന്ന നാമപദപ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ധനശേഖരണത്തിന്റെ സന്ദർഭത്തിൽ ἁπλότης എന്നതിന്റെ അർഥം
  choice: ഉദാരത, അഥവാ തുറന്ന കൈയോടെയുള്ള ദാനം
  alternative: ലാളിത്യം, ആത്മാർഥത, ഏകാഗ്രത
  rationale: മറ്റു സന്ദർഭങ്ങളിൽ ഈ പദത്തിന് ലാളിത്യമോ ആത്മാർഥതയോ അർഥമാകാമെങ്കിലും, ഇവിടെ സാമ്പത്തിക പ്രദാനവും അതിൽനിന്ന് ദൈവത്തോടുള്ള നന്ദി ഉളവാകുന്നതും ഉദാരത എന്ന അർഥത്തെയാണ് ശക്തമായി പിന്തുണയ്ക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതു സൂചിപ്പിക്കാൻ അവസാനത്തെ ദീർഘരേഖ നിലനിർത്തിയിരിക്കുന്നു. പ്രസിദ്ധീകരണവാചകത്തിൽ പാദക്കുറിപ്പില്ല; കാരണം സന്ദർഭത്തിൽ ‘ഉദാരത’ വ്യക്തമാണ്, മറ്റു നിഘണ്ടുവികല്പങ്ങൾ ഇവിടെ പ്രധാന വായനയായി തുല്യസാധ്യതയുള്ളവയല്ല.
