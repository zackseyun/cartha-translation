id: 2CO.9.9
reference: 2 Corinthians 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “അവൻ വാരിവിതറി, ദരിദ്രർക്കു കൊടുത്തു; അവന്റെ നീതി[a] എന്നേക്കും നിലനിൽക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീതി” എന്നതിന് “ന്യായം” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിന് രണ്ടു അർഥഭാവങ്ങളും ഉൾക്കൊള്ളാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവ് സൂത്രവാക്യത്തെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἐσκόρπισεν
  choice: അവൻ വാരിവിതറി
  rationale: വിശാലമായി ചിതറിച്ചുകൊടുക്കുന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും ഔദാര്യത്തോടെയുള്ള വിതരണം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἔδωκεν
  choice: കൊടുത്തു
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റിന്റെ ലളിതമായ ഭൂതകാലഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῖς πένησιν
  choice: ദരിദ്രർക്ക്
  rationale: പരിമിതമായ സാമ്പത്തികശേഷിയുള്ളവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ നേരിട്ടും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പരിഭാഷ.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: അവന്റെ നീതി
  rationale: δικαιοσύνηയുടെ ധാർമികനീതിയും ന്യായവും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ അർഥപരിധി ‘നീതി’ നിലനിർത്തുന്നു; മറ്റൊരു അർഥഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: തുടർന്ന് ശേഷിക്കുക, നിലനിൽക്കുക എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: അവസാനമില്ലാത്ത നിലനിൽപ്പിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: പൗലോസ് ഉദ്ധരിക്കുന്ന വാക്യത്തിലെ δικαιοσύνηയുടെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായം
  rationale: ഇവിടെ ഈ പദം ഉദാരനായ വ്യക്തിയുടെ നീതിയുള്ള സ്വഭാവത്തെയോ നീതിപ്രവൃത്തിയെയോ സൂചിപ്പിക്കാം; അതേസമയം ന്യായം എന്ന അർഥഭാവവും പൂർണമായി ഒഴിവാക്കാനാവില്ല. മുഖ്യപാഠത്തിൽ വിശാലമായ ‘നീതി’ ഉപയോഗിച്ച് പര്യായം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവവും സങ്കീർത്തനത്തിലെ കവിതാഭാവവും നിലനിർത്തി. ‘വാരിവിതറി’ എന്ന പ്രയോഗം വിശാലമായി കൊടുക്കുന്ന ദൃശ്യഭാവം സ്വാഭാവികമായി പകരുന്നു.
