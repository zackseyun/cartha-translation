revisions:
- from: 'നിങ്ങളുടെ ഉത്സാഹം[a] എനിക്കറിയാം. അതിനെക്കുറിച്ച് ഞാൻ മക്കദോന്യരോടു നിങ്ങളെച്ചൊല്ലി അഭിമാനത്തോടെ പറയുന്നു: അഖായ കഴിഞ്ഞ വർഷംമുതൽ ഒരുങ്ങിയിരിക്കുന്നു[b]; നിങ്ങളുടെ തീക്ഷ്ണത അവരിൽ മിക്കവരെയും ഉത്തേജിപ്പിച്ചിരിക്കുന്നു[c].'
  to: 'നിങ്ങളെക്കുറിച്ച് ഞാൻ മക്കദോന്യരോടു പുകഴ്ത്തിപ്പറയുന്ന നിങ്ങളുടെ ഉത്സാഹം[a] എനിക്കറിയാം: അഖായ കഴിഞ്ഞ വർഷംമുതൽ ഒരുങ്ങിയിരിക്കുന്നു[b]; നിങ്ങളുടെ തീക്ഷ്ണത അവരിൽ മിക്കവരെയും പ്രേരിപ്പിച്ചിരിക്കുന്നു[c].'
  rationale: തിരുത്തൽ καυχῶμαι-യുടെ പുകഴ്ത്തിപ്പറച്ചിൽ എന്ന അർഥശക്തി പുനഃസ്ഥാപിക്കുകയും, അതിന്റെ ആപേക്ഷികബന്ധം മലയാളത്തിൽ വ്യക്തമായി ഘടിപ്പിക്കുകയും ചെയ്യുന്നു. അഖായയെ സ്ഥലനാമമായി നിലനിർത്തുകയും, ‘മിക്കവരെയും’ എന്നതിലൂടെ സൂചിതമായ മക്കദോന്യരെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു. എല്ലാ അടിക്കുറിപ്പ് അടയാളങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
