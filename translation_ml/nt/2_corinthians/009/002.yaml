id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: ml
  text: 'നിങ്ങളെക്കുറിച്ച് ഞാൻ മക്കദോന്യരോടു പുകഴ്ത്തിപ്പറയുന്ന നിങ്ങളുടെ ഉത്സാഹം[a] എനിക്കറിയാം: അഖായ കഴിഞ്ഞ വർഷംമുതൽ ഒരുങ്ങിയിരിക്കുന്നു[b]; നിങ്ങളുടെ തീക്ഷ്ണത അവരിൽ മിക്കവരെയും പ്രേരിപ്പിച്ചിരിക്കുന്നു[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സന്നദ്ധത’.
    reason: lexical_alternative
  - marker: b
    text: ‘അഖായ’ എന്നത് കൊരിന്ത് ഉൾപ്പെട്ടിരുന്ന റോമൻ പ്രവിശ്യയാണ്; ഇവിടെ ആ പ്രദേശത്തെ വിശ്വാസികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: ഗ്രീക്കിൽ ‘ഭൂരിപക്ഷത്തെയും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: ഉത്സാഹം
  rationale: സന്നദ്ധമനസ്സും പ്രവർത്തിക്കാനുള്ള ആവേശവും ഉൾക്കൊള്ളുന്ന പദം; സന്ദർഭത്തിലെ പ്രശംസാഭാവത്തിന് സ്വാഭാവികമാണ്. ‘സന്നദ്ധത’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καυχῶμαι
  choice: അഭിമാനത്തോടെ പറയുന്നു
  rationale: പൗലൊസിന്റെ ശക്തമായ പ്രശംസാപരമായ വാചാടോപം നിലനിർത്തുകയും മലയാളത്തിൽ തെറ്റായ ആത്മപ്രശംസാഭാവം ഒഴിവാക്കി സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങളെച്ചൊല്ലി
  rationale: മക്കദോന്യരുടെ മുമ്പിൽ കൊരിന്ത്യർക്കുവേണ്ടി അനുകൂലമായി സംസാരിക്കുന്ന ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Μακεδόσιν
  choice: മക്കദോന്യരോട്
  rationale: ഗ്രീക്കിലെ ജനവിഭാഗനാമം അതേപടി നിലനിർത്തുന്നു; ‘വിശ്വാസികൾ’ എന്ന സന്ദർഭസൂചന മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: Ἀχαΐα
  choice: അഖായ
  rationale: റോമൻ പ്രവിശ്യയുടെ ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുന്നു; അവിടത്തെ വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന ലക്ഷണപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρεσκεύασται
  choice: ഒരുങ്ങിയിരിക്കുന്നു
  rationale: മുൻകൂട്ടിയുള്ള ഒരുക്കത്തിന്റെ ഫലമായി ഇപ്പോഴും നിലനിൽക്കുന്ന സന്നദ്ധാവസ്ഥയെ ഗ്രീക്ക് പൂർണ്ണകാലത്തിന് യോജിച്ചവിധം നൽകുന്നു.
- source_word: ἀπὸ πέρυσι
  choice: കഴിഞ്ഞ വർഷംമുതൽ
  rationale: മുൻവർഷത്തിൽ ആരംഭിച്ച് ഇപ്പോഴും തുടരുന്ന കാലപരിധി വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τὸ ὑμῶν ζῆλος
  choice: നിങ്ങളുടെ തീക്ഷ്ണത
  rationale: ζῆλος എന്ന പദത്തിന്റെ ശക്തമായ ആവേശവും പ്രതിബദ്ധതയും നിലനിർത്തുന്നു; മുൻപുള്ള προθυμίαν എന്നതിൽനിന്ന് പദവ്യത്യാസവും കാക്കുന്നു.
- source_word: ἠρέθισε
  choice: ഉത്തേജിപ്പിച്ചിരിക്കുന്നു
  rationale: ഈ അനുകൂല സന്ദർഭത്തിൽ മറ്റുള്ളവരെ പ്രവർത്തനത്തിലേക്കു പ്രേരിപ്പിച്ച ഫലം പ്രകടിപ്പിക്കുന്നു; ‘പ്രകോപിപ്പിച്ചു’ എന്ന പ്രതികൂലധ്വനി ഒഴിവാക്കുന്നു.
- source_word: τοὺς πλείονας
  choice: അവരിൽ മിക്കവരെയും
  rationale: സാധാരണ അർഥമായ ‘ഭൂരിപക്ഷം/മിക്കവർ’ നൽകുകയും മുൻപ് പറഞ്ഞ മക്കദോന്യരാണ് സൂചിതരെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘അഖായ’ എന്നതിന്റെ സൂചിതാർഥം
  choice: ഭൂമിശാസ്ത്രനാമമായ ‘അഖായ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അത് അവിടത്തെ വിശ്വാസികളെ—കൊരിന്തിലുള്ളവരെയും ഉൾപ്പെടെ—സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘നിങ്ങൾ കഴിഞ്ഞ വർഷംമുതൽ ഒരുങ്ങിയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അഖായയിലെ വിശ്വാസികൾ ഒരുങ്ങിയിരിക്കുന്നു’ എന്നു നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം Ἀχαΐα എന്ന പ്രവിശ്യാനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അത് നിലനിർത്തുന്നത് പൗലൊസിന്റെ വിശാലമായ പ്രാദേശിക പരാമർശവും ലക്ഷണപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- issue: പൗലൊസിന്റെ καυχῶμαι പ്രയോഗത്തിന്റെ ശക്തി
  choice: ‘അഭിമാനത്തോടെ പറയുന്നു’ എന്നു നൽകി പ്രശംസാപരമായ ശക്തി നിലനിർത്തി.
  alternative: ‘പ്രശംസിക്കുന്നു’ എന്ന മൃദുവായ വിവർത്തനം അല്ലെങ്കിൽ ‘പുകഴ്ത്തിപ്പറയുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ വിവർത്തനം.
  rationale: καυχῶμαι പൗലൊസിന്റെ ധൈര്യമായ വാചാടോപമാണ്; അതിനെ വെറും പ്രശംസയായി ദുർബലപ്പെടുത്തരുത്. അതേസമയം ആധുനിക മലയാളത്തിൽ ‘പൊങ്ങച്ചം പറയുന്നു’ എന്ന പ്രതികൂല അർഥം വരാതിരിക്കാൻ ഈ രൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഭൂമിശാസ്ത്രനാമവും വാചാടോപത്തിന്റെ ശക്തിയും നിലനിർത്തി; അസ്പഷ്ടതകൾ ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
