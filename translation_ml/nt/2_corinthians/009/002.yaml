  terminology: ‘ഉത്സാഹം,’ ‘അഖായ,’ ‘തീക്ഷ്ണത,’ ‘മക്കദോന്യർ’ എന്നിവ യോജിച്ചതാണ്. καυχῶμαι-ക്കായി ‘പുകഴ്ത്തിപ്പറയുന്നു’ ഉപയോഗിക്കുന്നത് പൗലൊസിന്റെ ശക്തമായെങ്കിലും ഈ സന്ദർഭത്തിൽ അനുകൂലമായ ഭാഷ നിലനിർത്തുന്നു. ‘പ്രേരിപ്പിച്ചിരിക്കുന്നു’ ഇവിടെ ‘ഉത്തേജിപ്പിച്ചിരിക്കുന്നു’ എന്നതിനെക്കാൾ സാധാരണവും സ്വാഭാവികവുമാണ്.
