  source_fidelity: 'മുഖ്യാർഥം പൊതുവേ കൃത്യമാണ്: προθυμίαν-ന്റെ സന്നദ്ധ-ഉത്സാഹഭാവം, അഖായ എന്ന പ്രവിശ്യാനാമം, ‘കഴിഞ്ഞ വർഷംമുതൽ’ എന്ന കാലസൂചന, മക്കദോന്യരിൽ ഭൂരിഭാഗത്തെയും പ്രേരിപ്പിച്ച നിങ്ങളുടെ ζῆλος എന്നിവ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു. എന്നാൽ καυχῶμαι-യുടെ വ്യക്തമായ ‘പുകഴ്ത്തിപ്പറയുക/വീമ്പുപറയുക’ എന്ന വാചാടോപശക്തി ‘അഭിമാനത്തോടെ പറയുന്നു’ എന്നതിൽ അല്പം മൃദുവാകുന്നു.'
