reference: 2 Corinthians 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: ml
  text: ദൈവത്തിന് സകല കൃപയും നിങ്ങളിലേക്കു സമൃദ്ധമായി ഒഴുക്കാൻ കഴിയും; അങ്ങനെ, എല്ലാ കാര്യങ്ങളിലും എല്ലായ്പോഴും മതിയായതെല്ലാം ഉണ്ടായവരായി[a] നിങ്ങൾ എല്ലാ നല്ല പ്രവൃത്തിയിലും സമൃദ്ധരാകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പൂർണ പര്യാപ്തതയോടെ.’ ഗ്രീക്ക് പദത്തിന് പര്യാപ്തത, മതിയായ അവസ്ഥ, അല്ലെങ്കിൽ സംതൃപ്തി എന്നിങ്ങനെ അർഥമാകാം. ഇവിടെ സ്വതന്ത്രമായ സ്വയംപര്യാപ്തതയല്ല, ദൈവം ആവശ്യത്തിന് നൽകുന്ന പരിപാലനമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: കഴിയും
  rationale: വർത്തമാനകാല ക്രിയ ദൈവത്തിന്റെ കഴിവിനെയും ശക്തിയെയും സൂചിപ്പിക്കുന്നു; ‘കഴിയും’ ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: വാക്യപ്രവാഹത്തിലൂടെ സൂചിപ്പിച്ചു; പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ പ്രത്യേകമായി ‘എന്നാൽ’ ചേർത്താൽ മൂലത്തിലുള്ളതിലധികം വിരോധഭാവം ഉണ്ടാകാം.
- source_word: πᾶσαν χάριν
  choice: സകല കൃപയും
  rationale: χάρις ഇവിടെ ഉദാരമായി നൽകാൻ പ്രാപ്തരാക്കുന്ന ദൈവത്തിന്റെ കൃപാപൂർവമായ പരിപാലനം ഉൾക്കൊള്ളുന്നു; അതിനെ വെറും ഭൗതികസഹായമായി ചുരുക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: നിങ്ങളിലേക്കു സമൃദ്ധമായി ഒഴുകുമാറാക്കാൻ
  rationale: കൃപ സ്വീകരിക്കുന്നവരിലേക്കു ധാരാളമായി എത്തുന്നതും ദൈവം അതിന് ഇടയാക്കുന്നതുമായ കാരണാർഥം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള വാക്യം ദൈവകൃപയുടെ ഉദ്ദേശ്യവും ഫലവും അവതരിപ്പിക്കുന്നുവെന്നത് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν παντὶ πάντοτε
  choice: എല്ലാ കാര്യത്തിലും എല്ലായ്പോഴും
  rationale: പൗലോസ് ആവർത്തിക്കുന്ന സമഗ്രതയുടെ ഊന്നൽ രണ്ടു ഘടകങ്ങളും വ്യക്തമായി പരിഭാഷപ്പെടുത്തി നിലനിർത്തുന്നു.
- source_word: πᾶσαν αὐτάρκειαν
  choice: പൂർണ പര്യാപ്തത
  rationale: αὐτάρκεια എന്നത് ഇവിടെ ദൈവത്തിൽനിന്നു ലഭിക്കുന്ന മതിയായ വിഭവങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; സ്വതന്ത്രമായ സ്വയംപര്യാപ്തത എന്ന ആശയം ഒഴിവാക്കുന്നു.
- source_word: ἔχοντες
  choice: ഉള്ളവരായി
  rationale: പ്രധാനക്രിയയോടൊപ്പം നിലനിൽക്കുന്ന അവസ്ഥയെ പങ്കാളിക്രിയയുടെ ഘടനയോട് ചേർന്ന് സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: περισσεύητε
  choice: സമൃദ്ധരാകും
  rationale: ആദ്യത്തെ περισσεῦσαιയുമായി ബന്ധപ്പെട്ട സമൃദ്ധിയുടെ ആവർത്തിത ആശയം നിലനിർത്തുകയും ഉദ്ദേശ്യം/ഫലം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: എല്ലാ സൽപ്രവൃത്തിയിലും
  rationale: ‘സമൃദ്ധരാകുക’ എന്ന ക്രിയയോടൊപ്പം εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും പ്രവർത്തനമേഖലയും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഉദാരതയുടെ സന്ദർഭത്തിൽ χάρις എന്നതിന്റെ അർഥം
  choice: ഭൗതികസഹായം ഉൾപ്പെടെ ഉദാരതയ്ക്കു പ്രാപ്തരാക്കുന്ന ദൈവത്തിന്റെ കൃപാപൂർവമായ പരിപാലനം; എന്നാൽ ‘കൃപ’ എന്ന വിശാല അർഥം നിലനിർത്തി
  alternative: വെറും ദൈവപ്രീതി; അല്ലെങ്കിൽ ഒരു പ്രത്യേക ദാനം
  rationale: സന്ദർഭം കൊടുക്കലിനെക്കുറിച്ചാണെങ്കിലും χάρις എന്ന പദത്തെ പണമായോ ഭൗതികവിതരണമായോ മാത്രം ചുരുക്കാൻ പാടില്ല.
- issue: αὐτάρκεια എന്നതിന്റെ അർഥം
  choice: ദൈവം നൽകുന്ന പൂർണ പര്യാപ്തത
  alternative: സംതൃപ്തി; സ്വയംപര്യാപ്തത
  rationale: വിശ്വാസികൾ മറ്റുള്ളവർക്കു നന്മ ചെയ്യാൻ കഴിയേണ്ടതിന് ദൈവം അവർക്കാവശ്യമായത് നൽകുന്നതാണ് സന്ദർഭം; ദൈവത്തിൽനിന്ന് സ്വതന്ത്രമായ ആത്മപര്യാപ്തതയല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. മൂലത്തിലെ ആവർത്തിച്ചുള്ള സമഗ്രത (πᾶς-പദങ്ങൾ) ‘സകല/എല്ലാ/പൂർണ’ എന്ന പ്രയോഗങ്ങളാലും സമൃദ്ധിയുടെ ആവർത്തനം ബന്ധപ്പെട്ട മലയാളപദങ്ങളാലും നിലനിർത്തിയിരിക്കുന്നു.
