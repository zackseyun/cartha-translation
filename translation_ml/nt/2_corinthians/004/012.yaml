review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the inferential ὥστε, the antithetical pairing of death and life, the parallel ἐν ἡμῖν / ἐν ὑμῖν, and the ongoing effective sense of ἐνεργεῖται. Repeating ‘പ്രവർത്തിക്കുന്നു’ in the second clause is a legitimate Malayalam resolution of the Greek ellipsis and does not narrow the death/life contrast.
  naturalness: The wording is generally modern and clear. However, ‘ജീവനോ’ is less idiomatic in this clause. In Malayalam contrastive coordination, the particle is more naturally placed with the contrasted second member as ‘ജീവൻ നിങ്ങളിലോ പ്രവർത്തിക്കുന്നു,’ which also makes the death/life and us/you antithesis more crisp.
  terminology: ‘മരണം’ and ‘ജീവൻ’ are appropriate, established, and theologically non-interpretive equivalents. ‘പ്രവർത്തിക്കുന്നു’ faithfully conveys the operative sense without importing a doctrinal explanation.
  issues:
  - severity: low
    issue: Placement of contrastive particle in the second clause
    rationale: ‘ജീവനോ നിങ്ങളിൽ പ്രവർത്തിക്കുന്നു’ is understandable, but ‘ജീവൻ നിങ്ങളിലോ പ്രവർത്തിക്കുന്നു’ is more natural modern Malayalam and better marks the corresponding contrast with ‘ഞങ്ങളിൽ.’
  revised_text: അങ്ങനെ, മരണം ഞങ്ങളിൽ പ്രവർത്തിക്കുന്നു; ജീവൻ നിങ്ങളിലോ പ്രവർത്തിക്കുന്നു.
