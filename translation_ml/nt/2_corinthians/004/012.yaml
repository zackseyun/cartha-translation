id: 2CO.4.12
reference: 2 Corinthians 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: ml
  text: അങ്ങനെ, മരണം ഞങ്ങളിൽ പ്രവർത്തിക്കുന്നു; ജീവൻ നിങ്ങളിലോ പ്രവർത്തിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞതിൽനിന്നുള്ള ഫലമോ നിഗമനമോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘അതിനാൽ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ഫലസൂചനയ്ക്കും ഇവിടെ യോജിക്കുന്നു.
- source_word: ὁ θάνατος
  choice: മരണം
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ഉപപദം മലയാളത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല. അപ്പൊസ്തലന്മാരുടെ കഷ്ടതയിൽ പ്രവർത്തിക്കുന്ന മരണയാഥാർഥ്യം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν ἡμῖν
  choice: ഞങ്ങളിൽ
  rationale: അപ്പൊസ്തലിക ശുശ്രൂഷകരെയും കൊരിന്ത്യരെയും തമ്മിൽ നേരിട്ട് വിരുദ്ധമായി നിർത്തുന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐνεργεῖται
  choice: പ്രവർത്തിക്കുന്നു
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ഫലപ്രദമായ പ്രവർത്തനത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἡ δὲ ζωὴ
  choice: ജീവനോ
  rationale: δέ സൂചിപ്പിക്കുന്ന മരണവും ജീവനും തമ്മിലുള്ള വൈരുധ്യം ‘-ഓ’ എന്ന ഘടനയിലൂടെ മലയാളത്തിൽ ശക്തവും സംക്ഷിപ്തവുമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ‘ഞങ്ങളിൽ’ എന്നതിനോടുള്ള കൃത്യമായ സമാന്തരത നിലനിർത്തുകയും വ്യക്തിപരവും സമൂഹപരവുമായ അർഥസാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മരണവും ജീവനും തമ്മിലുള്ള വൈരുധ്യത്തിന്റെ അർഥം
  choice: അപ്പൊസ്തലന്മാരുടെ മരണസദൃശമായ കഷ്ടതയും അവരുടെ ശുശ്രൂഷയിലൂടെ കൊരിന്ത്യരിൽ പ്രവർത്തിക്കുന്ന ജീവനും തമ്മിലുള്ള വൈരുധ്യം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘മരണം’, ‘ജീവൻ’ എന്നീ പദങ്ങളാൽ നിലനിർത്തി.
  alternative: ഇത് വെറും ശാരീരിക മരണവും സംരക്ഷണവും മാത്രമായോ, അല്ലെങ്കിൽ ആത്മീയമായി സ്വയത്തോടുള്ള മരണവും നിത്യജീവനും മാത്രമായോ വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം യേശുവിന്റെ മരണവും ജീവനും അപ്പൊസ്തലന്മാരുടെ ശരീരത്തിൽ വെളിപ്പെടുന്നതിനെക്കുറിച്ചാണ്; അതോടൊപ്പം അവരുടെ ശുശ്രൂഷ മറ്റുള്ളവർക്കു ജീവൻ നൽകുന്നതും വാദത്തിന്റെ ഭാഗമാണ്. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ ക്രിയയുടെ അഭാവം
  choice: വ്യക്തതയ്ക്കും സ്വാഭാവിക മലയാളത്തിനുമായി ‘പ്രവർത്തിക്കുന്നു’ ആവർത്തിച്ചു.
  alternative: ‘ജീവനോ നിങ്ങളിൽ’ എന്ന ഗ്രീക്കിനോട് കൂടുതൽ രൂപപരമായി ചേർന്ന അപൂർണവാക്യഘടന ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിൽ രണ്ടാം ഉപവാക്യത്തിലെ ക്രിയ ആദ്യത്തേതിൽനിന്ന് മനസ്സിലാക്കേണ്ടതാണ്. മലയാളത്തിൽ അത് ആവർത്തിക്കുന്നത് പുതിയ അർഥം ചേർക്കാതെ സമാന്തരത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മരണം—ജീവൻ’, ‘ഞങ്ങളിൽ—നിങ്ങളിൽ’ എന്നീ സമാന്തര വൈരുധ്യങ്ങൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. പ്രസിദ്ധീകരണപാഠം: “അങ്ങനെ, മരണം ഞങ്ങളിൽ പ്രവർത്തിക്കുന്നു; ജീവനോ നിങ്ങളിൽ പ്രവർത്തിക്കുന്നു.”'
