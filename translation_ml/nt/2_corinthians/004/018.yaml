id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: ml
  text: കാണപ്പെടുന്നവയിലേക്കല്ല, കാണപ്പെടാത്തവയിലേക്കാണ് ഞങ്ങൾ ശ്രദ്ധ തിരിക്കുന്നത്. എന്തെന്നാൽ, കാണപ്പെടുന്നവ താൽക്കാലികമാണ്[a]; എന്നാൽ കാണപ്പെടാത്തവ നിത്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കാണുന്നത് ... കാണാത്തത്’; ‘ദൃശ്യമായവ ... അദൃശ്യമായവ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: ശ്രദ്ധ തിരിക്കുന്നത്
  rationale: σκοπέω ഇവിടെ വെറുതെ കാണുക എന്നതിലുപരി ശ്രദ്ധയോ ദൃഷ്ടിയോ ഒരു ലക്ഷ്യത്തിലേക്കു തിരിക്കുക എന്ന അർഥം നൽകുന്നു. ‘ശ്രദ്ധ തിരിക്കുക’ ദൃശ്യരൂപകം പൂർണമായി നഷ്ടപ്പെടുത്താതെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഉദ്ദേശ്യപൂർവമായ ശ്രദ്ധയെ അറിയിക്കുന്നു.
- source_word: μὴ
  choice: അല്ല / കാണപ്പെടാത്ത
  rationale: ഗ്രീക്കിലെ ലളിതമായ നിഷേധം മാത്രം നിലനിർത്തുന്നു; ‘ഇനി അല്ല’ എന്ന കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: τὰ βλεπόμενα
  choice: കാണപ്പെടുന്നവ
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിലെ substantival participle-ന്റെ രൂപവും ആവർത്തനസമാന്തരതയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. ‘ദൃശ്യവസ്തുക്കൾ’ എന്നു പറഞ്ഞ് ദാർശനിക വിഭാഗീകരണം ചേർക്കുന്നില്ല.
- source_word: ἀλλὰ
  choice: അല്ല ... ആണ്
  rationale: രണ്ട് ശ്രദ്ധാകേന്ദ്രങ്ങൾ തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ സ്വാഭാവികമായ ‘അല്ല ... ആണ്’ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: τὰ μὴ βλεπόμενα
  choice: കാണപ്പെടാത്തവ
  rationale: τὰ βλεπόμενα എന്നതിനോടുള്ള ഉദ്ദേശ്യപൂർവമായ രൂപസമാന്തരത സംരക്ഷിക്കുന്നു; ‘ആത്മീയവ’ എന്ന വ്യാഖ്യാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πρόσκαιρα
  choice: താൽക്കാലികം
  rationale: പരിമിതമായ കാലത്തേക്കു മാത്രം നിലനിൽക്കുന്നതെന്ന അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; 17-ാം വാക്യത്തിലെ ആശയം അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്ന ‘ക്ഷണികം’ ഒഴിവാക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: വാക്യത്തിന്റെ രണ്ടാം ഭാഗത്തിലെ വൈരുധ്യം വ്യക്തമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: αἰώνια
  choice: നിത്യം
  rationale: πρόσκαιρα എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ അവസാനമില്ലാതെ നിലനിൽക്കുന്നതും വരാനിരിക്കുന്ന യുഗവുമായി ബന്ധപ്പെട്ടതുമായ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἡμῶν
  choice: ഞങ്ങൾ
  rationale: ജനിറ്റീവ് participial ഘടനയിലെ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമായ കർത്താവായി അവതരിപ്പിക്കുന്നു. മുൻവാക്യവുമായി ബന്ധമുള്ള പൗലോസിന്റെ ബഹുവചനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കാണപ്പെടുന്നവയും കാണപ്പെടാത്തവയും തമ്മിലുള്ള വൈരുധ്യം
  choice: ‘കാണപ്പെടുന്നവ ... കാണപ്പെടാത്തവ’ എന്ന മൂർത്തമായ ഭാഷ നിലനിർത്തുക
  alternative: ‘ഭൗതികവ ... ആത്മീയവ’ അല്ലെങ്കിൽ ‘ദൃശ്യവ ... അദൃശ്യവ’
  rationale: പൗലോസ് ഇവിടെ കാണപ്പെടുന്നതും കാണപ്പെടാത്തതുമായ യാഥാർഥ്യങ്ങളെ വൈരുധ്യപ്പെടുത്തുന്നു; അവയെ ദാർശനികമായി ഭൗതികം/ആത്മീയം എന്നു നിർവചിക്കുന്നില്ല. തിരുവെഴുത്തിലെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഗ്രീക്ക് participial ഘടന മലയാളത്തിൽ സമ്പൂർണവാക്യമായി സ്വാഭാവികമാക്കി. ആവർത്തനവും വൈരുധ്യവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
