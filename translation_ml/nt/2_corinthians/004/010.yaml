  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: ml
  text: യേശുവിന്റെ ജീവനും ഞങ്ങളുടെ ശരീരത്തിൽ വെളിപ്പെടേണ്ടതിന്, ഞങ്ങൾ എപ്പോഴും ശരീരത്തിൽ യേശുവിന്റെ മരണം[a] വഹിച്ചുകൊണ്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശുവിന്റെ മരണാനുഭവം’ അല്ലെങ്കിൽ ‘മരണാവസ്ഥ.’ ഗ്രീക്ക് നാമപദത്തിന് ശരീരത്തിൽ വഹിക്കപ്പെടുന്ന മരണാവസ്ഥയെയോ മരണാനുഭവത്തെയോ ഊന്നിക്കാട്ടാനാകും.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായ സാഹചര്യത്തെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ ശക്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: τὴν νέκρωσιν
  choice: മരണം
  rationale: മരണാവസ്ഥയെയോ മരണാനുഭവത്തെയോ സൂചിപ്പിക്കുന്ന നാമം. തുടർന്നുള്ള ‘ജീവൻ’ എന്ന പദത്തോടുള്ള സമാന്തരതയും ഇത് നിലനിർത്തുന്നു; ‘മരിച്ചുകൊണ്ടിരിക്കൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധം അതിന്റെ കൃത്യമായ സ്വഭാവം അമിതമായി നിർവചിക്കാതെ ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ σώματι
  choice: ശരീരത്തിൽ
  rationale: ആദ്യ പ്രയോഗത്തിൽ ഗ്രീക്കിൽ വ്യക്തമായ ഉടമസ്ഥസർവനാമമില്ല; അതിനാൽ ‘ഞങ്ങളുടെ’ എന്നു ചേർക്കാതെ മൂലപാഠത്തിന്റെ രൂപവും കൂട്ടായ അർഥസാധ്യതയും നിലനിർത്തുന്നു.
- source_word: περιφέροντες
  choice: വഹിച്ചുകൊണ്ട്
  rationale: തുടർച്ചയായി ശരീരത്തിൽ ചുമന്നുനടക്കുന്നതിന്റെ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: വെളിപ്പെടേണ്ടതിനുവേണ്ടി
  rationale: ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ഉപവാക്യബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: ജീവനും
  rationale: യേശുവിന്റെ മരണവും ജീവനും തമ്മിലുള്ള അനുബന്ധസമാന്തരത മലയാളത്തിലെ ‘-ഉം’ വഴി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ ζωὴ
  choice: ജീവൻ
  rationale: നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിന്റെ ജീവനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: ഞങ്ങളുടെ ശരീരത്തിൽ
  rationale: ഏകവചനമായ σώματι-യെയും ബഹുവചന ഉടമസ്ഥമായ ἡμῶν-നെയും കൃത്യമായി നിലനിർത്തി കൂട്ടായ അപ്പൊസ്തോലിക ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: φανερωθῇ
  choice: വെളിപ്പെടേണ്ടതിനുവേണ്ടി
  rationale: ἵνα-യോടുകൂടിയ കർമണി പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യ/ഫലഭാവവും വെളിവാകുക എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യേശുവിനോടു ബന്ധപ്പെട്ട νέκρωσις എന്ന പദത്തിന്റെ അർഥം
  choice: ‘യേശുവിന്റെ മരണം’ എന്നു മുഖ്യപാഠത്തിൽ നൽകുന്നു.
  alternative: ‘യേശുവിന്റെ മരിച്ചുകൊണ്ടിരിക്കൽ’ അഥവാ ‘യേശുവിന്റെ മരണാനുഭവം’
  rationale: ‘മരണം’ എന്നത് നാമത്തിന്റെ അർഥവും ‘യേശുവിന്റെ ജീവൻ’ എന്ന സമാന്തരപ്രയോഗവും നന്നായി നിലനിർത്തുന്നു; പ്രക്രിയയെയോ അനുഭവത്തെയോ ഊന്നുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: σῶμα എന്ന പദത്തിന്റെ വചനം
  choice: രണ്ടു പ്രയോഗങ്ങളിലും ഏകവചനമായ ‘ശരീരം’ നിലനിർത്തുന്നു.
  alternative: രണ്ടാമത്തെ പ്രയോഗം ‘ഞങ്ങളുടെ ശരീരങ്ങളിൽ’ എന്നു ബഹുവചനമാക്കുക.
  rationale: ഗ്രീക്ക് രണ്ടിടത്തും ഏകവചനമാണ് ഉപയോഗിക്കുന്നത്. ഏകവചനം വാക്യത്തിന്റെ സമാന്തരഘടനയും പൗലോസിന്റെ ശുശ്രൂഷയുടെ കൂട്ടായ ശരീരബോധവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യത്തെ ‘ശരീരത്തിൽ’ എന്നതിൽ മൂലപാഠത്തിലില്ലാത്ത ഉടമസ്ഥപദം ചേർത്തിട്ടില്ല; രണ്ടാമത്തെ ‘ഞങ്ങളുടെ ശരീരത്തിൽ’ എന്ന കൂട്ടായ ഏകവചനം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
