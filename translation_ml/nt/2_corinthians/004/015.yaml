id: 2CO.4.15
reference: 2 Corinthians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: ml
  text: കാരണം, എല്ലാം നിങ്ങളുടെ നിമിത്തമാണ്; അങ്ങനെ കൃപ കൂടുതൽ കൂടുതൽ ആളുകളിലൂടെ[a] പെരുകി, ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി നന്ദി കവിഞ്ഞൊഴുകട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനേകരിലൂടെ’ എന്നോ ‘കൂടുതൽ പേരിലൂടെ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദപ്രയോഗം പൊതുവായി അനേകം ആളുകളെയോ വർധിച്ചുവരുന്ന ആളുകളുടെ എണ്ണത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: എല്ലാം ... നിമിത്തമാണ്
  rationale: τὰ πάντα എന്ന സമഗ്രപ്രയോഗത്തിന്റെ വ്യാപ്തി ‘എല്ലാം’ നിലനിർത്തുന്നു. γὰρ മുൻവാക്യത്തെ വിശദീകരിക്കുന്നുവെങ്കിലും, മലയാളത്തിൽ ഈ ബന്ധം വാക്യക്രമത്തിലും സന്ദർഭത്തിലും സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ പ്രത്യേക സംയോജകപദം ചേർത്തിട്ടില്ല.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങളുടെ നിമിത്തമാണ്
  rationale: διά + accusative ഇവിടെ പ്രയോജനമോ ഗുണമോ സൂചിപ്പിക്കുന്നു; ‘നിങ്ങളുടെ നിമിത്തം’ അതിനെ ചുരുക്കാതെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ἵναയെ മലയാളത്തിലെ സ്വാഭാവികമായ ഫലോദ്ദേശ്യബന്ധമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: ദൈവിക അനുഗ്രഹപ്രവർത്തനത്തിന്റെ വിശാലമായ അർത്ഥം നിലനിർത്തുന്ന, മലയാള ക്രൈസ്തവഭാഷയിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: πλεονάσασα
  choice: വർധിച്ച്
  rationale: കൃപയുടെ വളർച്ചയെയോ പെരുക്കത്തെയോ സൂചിപ്പിക്കുന്ന participle-നെ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു.
- source_word: διὰ τῶν πλειόνων
  choice: കൂടുതൽ കൂടുതൽ ആളുകളിലൂടെ
  rationale: പദപ്രയോഗം ‘അനേകരിലൂടെ’ എന്നും ‘വർധിച്ചുവരുന്ന എണ്ണമാളുകളിലൂടെ’ എന്നും ഗ്രഹിക്കാം; മുഖ്യപാഠം സന്ദർഭത്തിലെ വ്യാപനഭാവം പ്രകടിപ്പിക്കുന്നു, അടിക്കുറിപ്പ് യഥാർഥമായ പകരവായനകൾ സംരക്ഷിക്കുന്നു.
- source_word: τὴν εὐχαριστίαν
  choice: കൃതജ്ഞത
  rationale: ദൈവത്തോടുള്ള നന്ദിപ്രകടനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ആധുനിക മലയാളപദം.
- source_word: περισσεύσῃ
  choice: കവിഞ്ഞൊഴുകട്ടെ
  rationale: സമൃദ്ധമായി പെരുകുക എന്ന ക്രിയയുടെ ശക്തമായ ദൃശ്യഭാവം നിലനിർത്തുകയും മലയാളത്തിൽ വായനാസൗകര്യം നൽകുകയും ചെയ്യുന്നു.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യം/ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉദ്ദേശ്യവാക്യത്തിലെ ‘കൃപ’യുടെ കൃത്യമായ സൂചന
  choice: അപ്പൊസ്തോലിക ശുശ്രൂഷയിൽ പ്രവർത്തിക്കുകയും വ്യാപിക്കുകയും ചെയ്യുന്ന ദൈവിക കൃപ എന്ന വിശാല അർത്ഥം നിലനിർത്തി.
  alternative: കൂടുതൽ ആളുകൾ പ്രാപിക്കുന്ന രക്ഷാകൃപ; അല്ലെങ്കിൽ പെരുകിയ നന്ദിക്ക് ഇടയാക്കുന്ന ദൈവത്തിന്റെ കൃപാപൂർവമായ അനുഗ്രഹം.
  rationale: χάρις ഇവയിൽ ഒറ്റ അർത്ഥത്തിലേക്കു നിർബന്ധമായി ചുരുക്കുന്നില്ല; അതിനാൽ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിച്ചു.
- issue: διὰ τῶν πλειόνων എന്നതിന്റെ വ്യാപ്തി
  choice: വർധിച്ചുവരുന്ന കൂടുതൽ ആളുകൾ എന്ന അർത്ഥം മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: അനേകരിലൂടെ; കൂടുതൽ എണ്ണമുള്ളവരിലൂടെ.
  rationale: ഗ്രീക്ക് താരതമ്യപ്രയോഗത്തിന് പൊതുവായി ‘അനേകർ’ എന്നും വർധിക്കുന്ന എണ്ണം എന്നും അർത്ഥസാധ്യതയുണ്ട്; അതിനാൽ പകരവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കൃപ’, ‘മഹത്ത്വം’ എന്നീ പരിചിതമായ ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ നീണ്ട ഉദ്ദേശ്യവാക്യം വായിക്കാൻ സ്വാഭാവികമായ മലയാളഘടനയിൽ നൽകി.
