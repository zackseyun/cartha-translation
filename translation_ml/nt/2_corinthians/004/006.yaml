id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: ml
  text: കാരണം, “ഇരുട്ടിൽനിന്ന് വെളിച്ചം പ്രകാശിക്കും”[a] എന്നു പറഞ്ഞ ദൈവം ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ പ്രകാശിച്ചു—മശീഹയുടെ[b] മുഖത്തിലെ[c] ദൈവത്തിന്റെ മഹത്ത്വത്തെക്കുറിച്ചുള്ള അറിവിന്റെ വെളിച്ചത്തിനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്കുകൾ ഉല്പത്തി 1:3-ലെ സൃഷ്ടിവെളിച്ചത്തെ പ്രതിധ്വനിപ്പിക്കുകയും വിശ്വാസികളുടെ ഉള്ളിൽ ദൈവം നടത്തുന്ന വെളിപ്പെടുത്തൽപ്രവൃത്തിയെ അതുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
    reason: cross_reference
  - marker: b
    text: ഗ്രീക്ക് Χριστοῦ; പരമ്പരാഗതമായി “ക്രിസ്തുവിന്റെ.” ഇവിടെ അത് സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ “മശീഹയുടെ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: “മുഖത്തിലെ” എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മൂർത്തമായ ദൃശ്യരൂപകം നിലനിർത്തുന്നു. ഇതിനെ കൂടുതൽ വിപുലമായി “മശീഹയുടെ വ്യക്തിയിൽ” എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള അടിസ്ഥാനം ഈ വാക്യം നൽകുന്നതിനാൽ കാരണസൂചകബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: എന്നു പറഞ്ഞ ദൈവംതന്നെ
  rationale: ആവർത്തിക്കുന്ന നിർദേശകഘടനയെ സ്വാഭാവികമായ മലയാള ആപേക്ഷികപ്രയോഗമാക്കി; ‘തന്നെ’ ദൈവമാണ് പറഞ്ഞതും ഹൃദയങ്ങളിൽ പ്രകാശിച്ചതും എന്ന ഗ്രീക്കിലെ വിഷയതുടർച്ച വ്യക്തമാക്കുന്നു.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: ഇരുട്ടിൽനിന്ന് വെളിച്ചം പ്രകാശിക്കും
  rationale: ἐκ എന്നതിന്റെ ഉറവിടഭാവവും ഭാവികാലക്രിയയും സൃഷ്ടിവെളിച്ചത്തിന്റെ പ്രതിച്ഛായയും നിലനിർത്തുന്നു.
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ പ്രകാശിച്ചു
  rationale: ക്രിയയുടെ അകർമകസ്വഭാവവും ‘ഹൃദയം’ എന്ന വേദപുസ്തകീയ അന്തരംഗരൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: പരിജ്ഞാനത്തിന്റെ പ്രകാശത്തിനായി
  rationale: πρός എന്നതിലെ ലക്ഷ്യഭാവവും φωτισμός–γνῶσις നാമപദശൃംഖലയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; ‘പരിജ്ഞാനം’ അറിവിന്റെ ഗൗരവമുള്ള ആശയം നൽകുന്നു.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: ദൈവമഹത്ത്വത്തെക്കുറിച്ചുള്ള
  rationale: δόξα എന്നതിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ‘മഹത്ത്വം’ ഉപയോഗിച്ച്, പരിജ്ഞാനത്തിന്റെ വിഷയം ദൈവത്തിന്റെ മഹത്ത്വമാണെന്ന് മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: മശീഹയുടെ മുഖത്ത് വെളിപ്പെടുന്ന
  rationale: πρόσωπον എന്നതിന്റെ അടിസ്ഥാനമായ ‘മുഖം’ എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു; മലയാളവാക്യബന്ധം വ്യക്തമാക്കാൻ സൂചിതബന്ധം ‘വെളിപ്പെടുന്ന’ എന്നു പ്രകടമാക്കി. Χριστός ഇവിടെ സ്ഥാനപ്പേരായി ഗ്രഹിച്ച് ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός അഭിഷിക്തനായവന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ അർത്ഥസൂചകമായ ‘മശീഹ’ സ്വീകരിച്ചു.
- issue: ἐν προσώπῳ Χριστοῦ എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: മശീഹയുടെ മുഖത്ത് വെളിപ്പെടുന്ന
  alternative: ക്രിസ്തുവിന്റെ വ്യക്തിത്വത്തിൽ / മശീഹയുടെ സാന്നിധ്യത്തിൽ
  rationale: പ്രകാശവും മഹത്ത്വവും നിറഞ്ഞ അടുത്ത സന്ദർഭത്തിൽ ‘മുഖം’ എന്ന മൂർത്തമായ ദൃശ്യരൂപകം ശക്തമാണ്. അതേസമയം πρόσωπον ‘വ്യക്തി’ അല്ലെങ്കിൽ ‘സാന്നിധ്യം’ എന്ന വിപുലമായ അർത്ഥത്തിലും ഗ്രഹിക്കാമെന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: πρὸς φωτισμὸν എന്നതിലെ ലക്ഷ്യബന്ധം
  choice: പ്രകാശത്തിനായി
  alternative: പ്രകാശം നൽകേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ അമൂർത്തനാമവും ഉദ്ദേശ്യസൂചനയും നേരിട്ട് നിലനിർത്തി; ദൈവം മറ്റൊരു വെളിച്ചം സൃഷ്ടിക്കുന്നു എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പൗലോസിന്റെ വെളിച്ചം–ഇരുട്ട്–മഹത്ത്വം രൂപകശൃംഖല സംരക്ഷിച്ചു. ഗ്രീക്കിലെ സാന്ദ്രമായ നാമപദബന്ധം പൂർണമായി അഴിച്ചുപറയാതെ, മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘വെളിപ്പെടുന്ന’ എന്ന സൂചിതപദം ചേർത്തു.
