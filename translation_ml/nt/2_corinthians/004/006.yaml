  to: കാരണം, “ഇരുട്ടിൽനിന്ന് വെളിച്ചം പ്രകാശിക്കും”[a] എന്നു പറഞ്ഞ ദൈവം ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ പ്രകാശിച്ചു—മശീഹയുടെ[b] മുഖത്തിലെ[c] ദൈവത്തിന്റെ മഹത്ത്വത്തെക്കുറിച്ചുള്ള അറിവിന്റെ വെളിച്ചത്തിനായി.
