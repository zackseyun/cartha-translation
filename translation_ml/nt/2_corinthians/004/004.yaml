revisions:
- from: അവരുടെ കാര്യത്തിൽ[a], ഈ യുഗത്തിന്റെ ദൈവം അവിശ്വാസികളുടെ മനസ്സുകളെ അന്ധമാക്കിയിരിക്കുന്നു; ദൈവത്തിന്റെ പ്രതിരൂപമായ മശീഹായുടെ മഹത്ത്വത്തിന്റെ സുവിശേഷപ്രകാശം അവരുടെമേൽ പ്രകാശിക്കാതിരിക്കേണ്ടതിനാണത്.[b][c]
  to: അവരുടെ കാര്യത്തിൽ[a], ഈ യുഗത്തിന്റെ ദൈവം[c] അവിശ്വാസികളുടെ മനസ്സുകളെ അന്ധമാക്കിയിരിക്കുന്നു, ദൈവത്തിന്റെ പ്രതിരൂപമായ മശീഹായുടെ മഹത്ത്വത്തിന്റെ സുവിശേഷത്തിന്റെ പ്രകാശം അവരുടെമേൽ പ്രകാശിക്കാതിരിക്കേണ്ടതിന്.[b]
  rationale: The revision preserves the Greek wording and its acknowledged lexical ambiguity while improving Malayalam clause flow, making the gospel–light genitive relation explicit, and moving the age/world alternative note to its precise source phrase.
