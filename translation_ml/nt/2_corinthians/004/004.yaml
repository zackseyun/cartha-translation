id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: ml
  text: അവരുടെ കാര്യത്തിൽ[a], ഈ യുഗത്തിന്റെ ദൈവം[c] അവിശ്വാസികളുടെ മനസ്സുകളെ അന്ധമാക്കിയിരിക്കുന്നു, ദൈവത്തിന്റെ പ്രതിരൂപമായ മശീഹായുടെ മഹത്ത്വത്തിന്റെ സുവിശേഷത്തിന്റെ പ്രകാശം അവരുടെമേൽ പ്രകാശിക്കാതിരിക്കേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽ” അല്ലെങ്കിൽ “അവരുടെ ഇടയിൽ.” മുൻസന്ദർഭത്തിലെ നശിച്ചുപോകുന്നവരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “മശീഹായുടെ മഹത്ത്വത്തിന്റെ സുവിശേഷത്തിന്റെ പ്രകാശം അവർ കാണാതിരിക്കേണ്ടതിന്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന അപൂർവമായ ക്രിയ പ്രകാശം തിളങ്ങുന്നതിനെയോ അവർ അതു കാണുന്നതിനെയോ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: c
    text: “ഈ യുഗത്തിന്റെ ദൈവം” എന്നതിന് “ഈ ലോകത്തിന്റെ ദൈവം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ αἰών സാധാരണയായി “യുഗം” എന്നാണ്; ഇവിടെ അത് ഇപ്പോഴത്തെ വീണുപോയ കാലഘട്ടത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: അവരുടെ കാര്യത്തിൽ
  rationale: മുൻസന്ദർഭത്തിലെ നശിച്ചുപോകുന്നവരെയും അവിശ്വാസികളെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധസൂചകശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അവരിൽ’ എന്നത് ഉണ്ടാക്കാവുന്ന അന്തർവാസസൂചന ഒഴിവാക്കുന്നു.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: ഈ യുഗത്തിന്റെ ദൈവം
  rationale: αἰών ഇവിടെ സൃഷ്ടലോകത്തേക്കാൾ ഇപ്പോഴത്തെ യുഗത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മൂലപാഠത്തിലെ പദപ്രയോഗം നിലനിർത്തി, പരാമർശിതനെ ‘സാത്താൻ’ എന്നു വ്യാഖ്യാനിച്ച് ചേർത്തിട്ടില്ല.
- source_word: ἐτύφλωσεν
  choice: അന്ധമാക്കിയിരിക്കുന്നു
  rationale: അവരുടെ ഇപ്പോഴത്തെ അവസ്ഥയിൽ തുടരുന്ന ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τὰ νοήματα τῶν ἀπίστων
  choice: അവിശ്വാസികളുടെ മനസ്സുകളെ
  rationale: νόημα ഇവിടെ ഒറ്റപ്പെട്ട ചിന്തകളെയല്ല, ഗ്രഹണത്തിന്റെയും തിരിച്ചറിവിന്റെയും മാനസിക ശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്; ἄπιστος വിശ്വസിക്കാത്തവരെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: അവരുടെമേൽ പ്രകാശിക്കാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ഘടനയും, അപൂർവമായ αὐγάζω എന്ന ക്രിയയുടെ ‘പ്രകാശിക്കുക’ എന്ന വായനയും നൽകുന്നു. ‘അവരുടെമേൽ’ എന്നത് മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാക്കുന്നു.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: സുവിശേഷപ്രകാശം
  rationale: ‘സുവിശേഷത്തിന്റെ പ്രകാശം’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായ സംയുക്തപദത്തിലൂടെ നൽകുന്നു.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: മശീഹായുടെ മഹത്ത്വത്തിന്റെ
  rationale: ഇരട്ട ജനിറ്റീവ് ഘടനയുടെ പാളികൾ സംരക്ഷിക്കുന്നു; Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പ്രതിരൂപമായ
  rationale: മശീഹായെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവന വികസിപ്പിക്കാതെയും ചുരുക്കാതെയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഈ യുഗത്തിന്റെ ദൈവം’ എന്നതിന്റെ പരാമർശിതൻ
  choice: മൂലത്തിലെ വ്യക്തിപരമായ അധികാരസൂചനയുള്ള പദപ്രയോഗം അതേപടി നിലനിർത്തി
  alternative: ‘സാത്താൻ’ എന്നു നേരിട്ട് എഴുതുക; അല്ലെങ്കിൽ വ്യക്തിത്വമില്ലാത്ത ലോകവ്യവസ്ഥയായി വ്യാഖ്യാനിക്കുക
  rationale: സന്ദർഭം ഒരു ദുഷ്ട വ്യക്തിപരമായ ശക്തിയിലേക്കാണ് വിരൽചൂണ്ടുന്നതെങ്കിലും മൂലപാഠത്തിൽ ‘സാത്താൻ’ എന്ന പേര് ഇല്ല; അതിനാൽ വ്യാഖ്യാനം വാക്യത്തിൽ ചേർത്തിട്ടില്ല.
- issue: αὐγάσαι എന്ന ക്രിയയുടെ കർത്തൃ/അനുഭവസംബന്ധമായ അർത്ഥം
  choice: സുവിശേഷപ്രകാശം അവിശ്വാസികളുടെമേൽ പ്രകാശിക്കാതിരിക്കുക
  alternative: അവിശ്വാസികൾ സുവിശേഷപ്രകാശം കാണാതിരിക്കുക
  rationale: അപൂർവമായ ക്രിയ ഇരുവിധത്തിൽ ഗ്രഹിക്കാവുന്നതിനാൽ, φωτισμός-നോട് ഏറ്റവും സ്വാഭാവികമായി ചേരുന്ന ‘പ്രകാശിക്കുക’ എന്ന വായന മുഖ്യപാഠത്തിൽ നൽകി; മറ്റേ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ‘ദൈവത്തിന്റെ പ്രതിരൂപം’ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പ്രസ്താവന
  choice: മൂലത്തിലെ നേരിട്ടുള്ള തിരിച്ചറിയൽ മാത്രം നിലനിർത്തി
  alternative: പിന്നീടുള്ള സിദ്ധാന്തപരമായ പദാവലി ചേർത്ത് വിശദീകരിക്കുക
  rationale: വാക്യത്തിന്റെ ശക്തമായ ദൈവശാസ്ത്രപരമായ അർത്ഥം സംരക്ഷിക്കുമ്പോഴും മൂലത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സുവിശേഷം,’ ‘മശീഹാ,’ ‘മഹത്ത്വം,’ ‘പ്രതിരൂപം’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
