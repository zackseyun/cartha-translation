source:
  edition: SBLGNT
  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞങ്ങൾക്കു ലഭിച്ചിരിക്കുന്ന ഈ ശുശ്രൂഷ ഉള്ളതിനാൽ, ഞങ്ങൾ കരുണ പ്രാപിച്ചതുപോലെ, ഞങ്ങൾ ധൈര്യം കൈവിടുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονίαν
  choice: ശുശ്രൂഷ
  rationale: ദൈവം ഏൽപ്പിച്ച സേവനദൗത്യം എന്ന ആശയം സ്വാഭാവികവും സഭാപരമായി പരിചിതവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καθὼς ἠλεήθημεν
  choice: ഞങ്ങൾക്കു കരുണ ലഭിച്ചതനുസരിച്ച്
  rationale: καθώς എന്നതിലെ അനുരൂപതയുടെ ബന്ധം നിലനിർത്തുകയും ἠλεήθημεν എന്ന ദൈവിക നിഷ്ക്രിയപ്രയോഗം വിശദീകരിക്കാതെ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἐγκακοῦμεν
  choice: ഞങ്ങൾ നിരുത്സാഹപ്പെടുന്നില്ല
  rationale: ദുഷ്കരതകൾക്കിടയിൽ ധൈര്യം കൈവിടുകയോ തളരുകയോ ചെയ്യുക എന്ന ക്രിയയുടെ സന്ദർഭോചിത അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ശുശ്രൂഷയും കരുണയും തമ്മിലുള്ള ബന്ധം
  choice: “കരുണ ലഭിച്ചതനുസരിച്ച്” എന്ന അനുരൂപത നിലനിർത്തി
  alternative: “കരുണ ലഭിച്ചതിനാൽ” എന്ന കാരണബന്ധം
  rationale: καθώς സാധാരണയായി അനുരൂപതയോ രീതിയോ സൂചിപ്പിക്കുന്നു; അതിനെ വെറും കാരണബന്ധമായി ചുരുക്കാതെ മൂലപാഠത്തിലെ ബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി; പൗലോസിന്റെ കൂട്ടായ ഒന്നാംപുരുഷ ബഹുവചനം നിലനിർത്തിയിരിക്കുന്നു.
