id: 2CO.4.9
reference: 2 Corinthians 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διωκόμενοι ἀλλ’ οὐκ ἐγκαταλειπόμενοι, καταβαλλόμενοι ἀλλ’ οὐκ ἀπολλύμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/009.yaml
  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: ml
  text: പീഡിപ്പിക്കപ്പെടുന്നു, എങ്കിലും ഉപേക്ഷിക്കപ്പെടുന്നില്ല; അടിച്ചുവീഴ്ത്തപ്പെടുന്നു[a], എങ്കിലും നശിപ്പിക്കപ്പെടുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘താഴെയെറിയപ്പെടുന്നു’ അല്ലെങ്കിൽ ‘തള്ളിവീഴ്ത്തപ്പെടുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διωκόμενοι
  choice: പീഡിപ്പിക്കപ്പെടുന്നു
  rationale: ശത്രുതാപരമായ പിന്തുടരലും എതിർപ്പുമൂലമുള്ള പീഡനവും സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐγκαταλειπόμενοι
  choice: ഉപേക്ഷിക്കപ്പെടുന്നില്ല
  rationale: തനിച്ചാക്കി കൈവിടപ്പെടുക എന്ന അർഥം ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു; ദൈവമാണ് പ്രവർത്തനകർത്താവ് എന്ന് മൂലപാഠം നേരിട്ട് പറയാത്തതിനാൽ അത് പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- source_word: καταβαλλόμενοι
  choice: അടിച്ചുവീഴ്ത്തപ്പെടുന്നു
  rationale: താഴെയിടുക, നിലത്തുവീഴ്ത്തുക എന്നീ സാധ്യതകൾ ഉൾക്കൊള്ളുകയും സംഘർഷത്തിന്റെ ദൃശ്യബലം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: ἀπολλύμενοι
  choice: നശിപ്പിക്കപ്പെടുന്നില്ല
  rationale: വീഴ്ത്തപ്പെടുന്നതും അന്തിമമായി നശിപ്പിക്കപ്പെടുന്നതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἀλλ’ οὐκ
  choice: എങ്കിലും ... ഇല്ല
  rationale: രണ്ട് സമാന്തര വിരുദ്ധജോടികളുടെയും സംക്ഷിപ്തമായ വാചകതാളവും ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἐγκαταλειπόμενοι എന്നതിന് ദൈവം ഉപേക്ഷിക്കുന്നില്ലെന്ന് പ്രവർത്തനകർത്താവിനെ വ്യക്തമാക്കണമോ
  choice: പ്രവർത്തനകർത്താവിനെ ചേർക്കാതെ ‘ഉപേക്ഷിക്കപ്പെടുന്നില്ല’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ദൈവം കൈവിടുന്നില്ല’
  rationale: സന്ദർഭത്തിൽ ദൈവിക സംരക്ഷണം സൂചിതമാണെങ്കിലും ഗ്രീക്ക് വാക്യം പ്രവർത്തനകർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ അർഥം വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം പരിഹരിക്കാതെ മൂലപാഠത്തിന്റെ രൂപം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തര വർത്തമാന കർമണി കൃദന്തരൂപങ്ങളെ മലയാളത്തിൽ സമാന്തര വർത്തമാന കർമണി ക്രിയകളായി അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
