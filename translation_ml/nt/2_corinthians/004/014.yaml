id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: ml
  text: കാരണം, യേശുവിനെ[a] ഉയിർപ്പിച്ചവൻ നമ്മെയും യേശുവിനോടൊപ്പം ഉയിർപ്പിക്കുകയും നിങ്ങളോടൊപ്പം തന്റെ മുമ്പാകെ നിർത്തുകയും ചെയ്യുമെന്ന് നമുക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘യേശുവിനെ’ എന്നതിനുപകരം ‘കർത്താവായ യേശുവിനെ’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: കാരണം, … നമുക്കറിയാം
  rationale: ഗ്രീക്കിൽ ഇത് ‘അറിഞ്ഞുകൊണ്ട്’ എന്ന പങ്കാളിക്രിയാരൂപമാണെങ്കിലും, സന്ദർഭത്തിൽ മുൻവാക്യത്തിലെ സഹനത്തിനുള്ള കാരണം വ്യക്തമാക്കുന്നു. അതിനാൽ ആധുനിക മലയാളത്തിൽ കാരണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കി.
- source_word: ὁ ἐγείρας
  choice: ഉയിർപ്പിച്ചവൻ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന നിർദ്ദിഷ്ട ഭൂതകാല പങ്കാളിക്രിയയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τὸν Ἰησοῦν
  choice: യേശുവിനെ
  rationale: SBLGNT-യുടെ മുഖ്യപാഠം ‘യേശു’ എന്നാണ്; അതിനാൽ ‘കർത്താവ്’ എന്ന പദം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല. ദീർഘമായ പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: καὶ ἡμᾶς
  choice: നമ്മെയും … ഉയിർപ്പിക്കുകയും
  rationale: καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-യും’ വഴി പ്രകടമാക്കി; യേശുവിന്റെ ഉയിർപ്പിനോടു വിശ്വാസികളുടെ ഭാവി ഉയിർപ്പിനെ ബന്ധിപ്പിക്കുന്നു.
- source_word: σὺν Ἰησοῦ
  choice: യേശുവിനോടൊപ്പം
  rationale: σύν സഹവർത്തിത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ഉപകരണാർഥമായ ‘യേശുവിലൂടെ’ എന്നു മാറ്റാതെ നേരിട്ടുള്ള അർഥം സംരക്ഷിച്ചു.
- source_word: παραστήσει
  choice: തന്റെ മുമ്പാകെ നിർത്തുകയും ചെയ്യും
  rationale: ക്രിയയുടെ ‘മുമ്പാകെ കൊണ്ടുവന്നു നിർത്തുക/സമർപ്പിക്കുക’ എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. ദൈവസന്നിധിയിലെ ഭാവി അവതരണസൂചന നിലനിർത്തുമ്പോഴും അതിന്റെ കൃത്യമായ സാഹചര്യം അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: σὺν ὑμῖν
  choice: നിങ്ങളോടൊപ്പം
  rationale: പൗലോസും കൊരിന്ത്യരും പങ്കിടുന്ന സമൂഹപരമായ പ്രത്യാശയെ ലളിതമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐγείρας എന്നതിനുശേഷമുള്ള പാഠഭേദം
  choice: മുഖ്യവാചകത്തിൽ SBLGNT അനുസരിച്ച് ‘യേശുവിനെ’; ‘കർത്താവായ യേശുവിനെ’ എന്ന വായന അടിക്കുറിപ്പിൽ.
  alternative: മുഖ്യവാചകത്തിൽ ‘കർത്താവായ യേശുവിനെ’ എന്നു നൽകുക.
  rationale: ഇത് ഉപദേശപരമായ വ്യത്യാസമല്ല, പാഠവിമർശനപരമായ വ്യത്യാസമാണ്. അടിസ്ഥാനപാഠത്തെ പിന്തുടരുകയും പ്രസക്തമായ ദീർഘവായന വായനക്കാരനുവേണ്ടി രേഖപ്പെടുത്തുകയും ചെയ്തു.
- issue: παραστήσει എന്നതിന്റെ അന്ത്യകാലസൂചന
  choice: പൗലോസിനെയും കൊരിന്ത്യരെയും ദൈവം ഒരുമിച്ച് തന്റെ മുമ്പാകെ നിർത്തുന്ന ഭാവി സംഭവമായി വിവർത്തനം ചെയ്തു.
  alternative: പൊതുവായ നീതീകരണം എന്നോ ക്രിസ്തുവിന്റെ ന്യായാസനത്തിനു മുമ്പിലുള്ള അവതരണം എന്നോ കൂടുതൽ നിർദ്ദിഷ്ടമാക്കുക.
  rationale: ഉയിർപ്പിന്റെ സന്ദർഭം ഭാവിയിലെ ദൈവിക അവതരണത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ ഗ്രീക്ക് വ്യക്തമാക്കാത്ത കൃത്യമായ വേദിയോ വിധിന്യായക്രമമോ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉയിർപ്പിക്കുക’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തി; ‘ഹാജരാക്കുക’ എന്ന നിയമഭാഷ ഒഴിവാക്കി, παραστήσει എന്നതിന്റെ സന്നിധി-സൂചന ‘തന്റെ മുമ്പാകെ നിർത്തുക’ എന്ന പ്രയോഗത്തിലൂടെ പ്രകടമാക്കി.
