revisions:
- from: പകരം, ലജ്ജാകരമായ രഹസ്യകാര്യങ്ങളെ ഞങ്ങൾ ഉപേക്ഷിച്ചിരിക്കുന്നു. കൗശലത്തോടെ പെരുമാറുകയോ ദൈവവചനത്തിൽ കൃത്രിമം കാണിക്കുകയോ[a] ചെയ്യാതെ, സത്യം പരസ്യമാക്കുന്നതിലൂടെ[b] ദൈവസന്നിധിയിൽ ഓരോ മനുഷ്യന്റെയും മനസ്സാക്ഷിക്കു ഞങ്ങളെത്തന്നെ ശുപാർശ ചെയ്യുന്നു.
  to: പകരം, ലജ്ജാകരമായ രഹസ്യകാര്യങ്ങളെ ഞങ്ങൾ ഉപേക്ഷിച്ചിരിക്കുന്നു. വഞ്ചനാപരമായ കൗശലത്തോടെ പെരുമാറാതെയും ദൈവവചനം വഞ്ചനയോടെ വികലമാക്കാതെയും, സത്യം പരസ്യമാക്കുന്നതിലൂടെ ദൈവസന്നിധിയിൽ ഓരോ മനുഷ്യന്റെയും മനസ്സാക്ഷിക്കു ഞങ്ങളെത്തന്നെ ശുപാർശ ചെയ്യുന്നു.
