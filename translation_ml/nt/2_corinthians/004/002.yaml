id: 2CO.4.2
reference: 2 Corinthians 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: ml
  text: പകരം, ലജ്ജാകരമായ രഹസ്യകാര്യങ്ങളെ ഞങ്ങൾ ഉപേക്ഷിച്ചിരിക്കുന്നു. വഞ്ചനാപരമായ കൗശലത്തോടെ പെരുമാറാതെയും ദൈവവചനം വഞ്ചനയോടെ വികലമാക്കാതെയും, സത്യം പരസ്യമാക്കുന്നതിലൂടെ ദൈവസന്നിധിയിൽ ഓരോ മനുഷ്യന്റെയും മനസ്സാക്ഷിക്കു ഞങ്ങളെത്തന്നെ ശുപാർശ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: ഞങ്ങൾ ഉപേക്ഷിച്ചിരിക്കുന്നു
  rationale: ഒരിക്കൽ നിർണായകമായി തള്ളിപ്പറഞ്ഞതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: ലജ്ജാകരമായ രഹസ്യകാര്യങ്ങൾ
  rationale: മറച്ചുവെക്കപ്പെടുന്നതും ലജ്ജയാൽ വിശേഷിപ്പിക്കപ്പെടുന്നതുമായ പ്രവൃത്തികളെ വ്യക്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: കൗശലത്തോടെ പെരുമാറുകയോ
  rationale: περιπατέω എന്ന ജീവിതനടപ്പിന്റെ രൂപകത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പെരുമാറുക’ എന്നു നൽകി; πανουργίαയിലെ അധാർമിക ചതുരത്വം ‘കൗശലം’ അറിയിക്കുന്നു.
- source_word: μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ
  choice: ദൈവവചനത്തിൽ കൃത്രിമം കാണിക്കുകയോ
  rationale: δόλοω സൂചിപ്പിക്കുന്ന വഞ്ചനാപരമായ കലർത്തലും തിരുത്തിക്കേടാക്കലും ആധുനിക വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: സത്യം പരസ്യമാക്കുന്നതിലൂടെ
  rationale: φανέρωσις വാചിക പ്രസംഗം മാത്രമല്ല, സത്യം വെളിപ്പെടുത്തി പ്രകടമാക്കുന്നതും ഉൾക്കൊള്ളുന്നതിനാൽ അതിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: συνιστάνοντες ἑαυτοὺς
  choice: ഞങ്ങളെത്തന്നെ ശുപാർശ ചെയ്യുന്നു
  rationale: സ്വയം പ്രശംസിക്കുന്നതെന്നതിനേക്കാൾ മറ്റുള്ളവരുടെ മനസ്സാക്ഷിയുടെ മുമ്പിൽ സ്വന്തം സത്യസന്ധത അംഗീകരിക്കപ്പെടാൻ വെക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: ഓരോ മനുഷ്യന്റെയും മനസ്സാക്ഷിക്കു
  rationale: πᾶσαν എന്ന വിതരണാത്മക അർഥവും ἀνθρώπων എന്ന പൊതുമാനുഷിക വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാക്ഷ്യത്തിന്റെയും വിലയിരുത്തലിന്റെയും മുമ്പിലാണ് ശുശ്രൂഷ നടക്കുന്നതെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: വഞ്ചനാപരമായ ശുശ്രൂഷയും സത്യസന്ധമായ ശുശ്രൂഷയും തമ്മിലുള്ള പൗലോസിന്റെ വൈരുധ്യം
  choice: ശുശ്രൂഷയിലെ നൈതിക സുതാര്യതയും ദൈവവചനത്തെ വഞ്ചനാപരമായി കൈകാര്യം ചെയ്യാതിരിക്കലും എന്ന വിശാലമായ അർഥം നിലനിർത്തി.
  alternative: വാക്യം വാഗ്മിത്വത്തിലെ കൃത്രിമത്വത്തെ മാത്രം അപലപിക്കുന്നു എന്നോ, എല്ലാ തിരുവെഴുത്ത് വ്യാഖ്യാനത്തെയും കുറിച്ചുള്ള സമഗ്ര സാങ്കേതിക സിദ്ധാന്തപ്രസ്താവനയാണെന്നോ വായിക്കുക.
  rationale: സമീപസന്ദർഭം അപ്പൊസ്തലിക ശുശ്രൂഷയുടെ പെരുമാറ്റത്തെയും സന്ദേശത്തിന്റെ പരസ്യമായ അവതരണത്തെയും കുറിച്ചാണ്; പാഠത്തിൽ വ്യക്തമല്ലാത്ത മതവിഭാഗീയ നിഗമനങ്ങൾ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ വൈരുധ്യഘടന നിലനിർത്തിക്കൊണ്ട് നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ട് മലയാളവാക്യങ്ങളാക്കി. സാങ്കേതികമോ മതവിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
