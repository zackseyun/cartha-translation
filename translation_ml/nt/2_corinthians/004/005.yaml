id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: ml
  text: ഞങ്ങൾ ഞങ്ങളെത്തന്നെയല്ല പ്രഘോഷിക്കുന്നത്; മശീഹാ യേശുവിനെ[a] കർത്താവായും ഞങ്ങളെത്തന്നെ യേശു നിമിത്തം[c] നിങ്ങളുടെ അടിമകളായും[b] പ്രഘോഷിക്കുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ക്രിസ്തു യേശുവിനെ കർത്താവായി.’ ഗ്രീക്കിലെ Χριστός പേരുപോലെ പ്രവർത്തിക്കുന്നിടത്ത് ‘ക്രിസ്തു’ എന്ന് നൽകാം; ഇവിടെ അത് ‘മശീഹാ’ എന്ന സ്ഥാനപ്പേരായി എടുത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ ദാസന്മാർ’ അഥവാ ‘നിങ്ങളുടെ സേവകർ.’ ഗ്രീക്കിലെ δοῦλοι എന്നതിന് സേവകരെയോ അടിമകളെയോ സൂചിപ്പിക്കാം; യേശു കർത്താവാണെന്ന പ്രഖ്യാപനത്തോടുള്ള വൈരുധ്യത്തിൽ അധീനതയുടെ ശക്തമായ അർഥം നിലനിർത്താൻ ഇവിടെ ‘അടിമകൾ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘യേശു കാരണം.’
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: പ്രഘോഷിക്കുന്നു
  rationale: പൊതുവായി ദൂതസന്ദേശം അറിയിക്കുന്നതിന്റെ ഭാവം നിലനിർത്തുന്നു; ഔപചാരിക പ്രസംഗത്തിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἑαυτοὺς
  choice: ഞങ്ങളെത്തന്നെ
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ചിരിക്കുന്ന ആത്മവാചക സർവനാമവും പൗലൊസും സഹപ്രവർത്തകരും സന്ദേശത്തിന്റെ ഉള്ളടക്കമല്ലെന്ന വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: Χριστὸν Ἰησοῦν
  choice: മശീഹാ യേശു
  rationale: Χριστός ഇവിടെ കേവലം പേരിന്റെ ഭാഗമായി മാത്രമല്ല, യേശുവിന്റെ സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു; അതിനാൽ ‘മശീഹാ’ എന്ന് പരിഭാഷപ്പെടുത്തി ഗ്രീക്കിലെ പദക്രമവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: യേശുവിനെക്കുറിച്ച് പ്രഘോഷിക്കപ്പെടുന്നത് അവൻ കർത്താവാണ് എന്നതാണെന്ന് സൂചിപ്പിക്കുന്ന വിധത്തിൽ വിധേയപൂരകമായി നൽകുന്നു.
- source_word: δούλους
  choice: അടിമകൾ
  rationale: ‘കർത്താവ്’ എന്നതിനോടുള്ള മനഃപൂർവമായ വൈരുധ്യത്തിലും കൊരിന്ത്യരോടുള്ള അപ്പൊസ്തലന്മാരുടെ കീഴ്പ്പെട്ട സേവനത്തിലും δοῦλος എന്ന പദത്തിന്റെ ശക്തമായ അധീനതാഭാവം നിലനിർത്തുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടെ
  rationale: δοῦλος എന്ന പദത്തിനു ശേഷമുള്ള ബന്ധസൂചക ഷഷ്ഠിയെ സ്വാഭാവികമായി അവതരിപ്പിച്ച് കൊരിന്ത്യരോടുള്ള സേവനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: διὰ Ἰησοῦν
  choice: യേശു നിമിത്തം
  rationale: διά + ദ്വിതീയാവിഭക്തി ഇവിടെ അവരുടെ സേവകത്വത്തിന്റെ കാരണമോ പ്രേരണയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിമിത്തം’ ആ ബന്ധം സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: 'സ്ഥാനപ്പേര്: ‘മശീഹാ’'
  alternative: ‘ക്രിസ്തു’
  rationale: ഈ വാക്യത്തിൽ യേശുവിനെക്കുറിച്ചുള്ള പ്രഘോഷണത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമാണ്; എങ്കിലും പേരുപോലെയുള്ള വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: Χριστὸν Ἰησοῦν κύριον എന്ന ഘടനയുടെ ബലം
  choice: ‘മശീഹാ യേശുവിനെ കർത്താവായി’
  alternative: ‘കർത്താവായ ക്രിസ്തു യേശുവിനെ’ / ‘യേശുക്രിസ്തു കർത്താവാണെന്ന്’
  rationale: κύριον എന്നത് വിധേയപൂരകമായി പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുകയും മൂലത്തിൽ ഇല്ലാത്ത ഒരു പൂർണ ക്രിയ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: δοῦλος എന്ന പദത്തിന്റെ സാമൂഹികവും രൂപകാത്മകവുമായ ശക്തി
  choice: ‘അടിമകൾ’
  alternative: ‘ദാസന്മാർ’ / ‘സേവകർ’
  rationale: യേശു ‘കർത്താവ്’ എന്ന പ്രഖ്യാപനത്തോടുള്ള വൈരുധ്യത്തിൽ അധീനതയുടെ ശക്തമായ അർഥം പ്രധാനമാണ്; അതേസമയം മലയാള വായനക്കാർക്കായി മൃദുവായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രഘോഷിക്കുക’ പൊതുവായ ദൂതസന്ദേശ പ്രഖ്യാപനത്തിന്റെ ഭാവം നൽകുന്നു. സമാന്തരമായ രണ്ട് ദ്വിതീയാവിഭക്തി ഘടകങ്ങളെയും ഒരേ ക്രിയയോട് ബന്ധിപ്പിച്ച് ഗ്രീക്ക് വാക്യത്തിന്റെ വൈരുധ്യഘടന നിലനിർത്തിയിരിക്കുന്നു.
