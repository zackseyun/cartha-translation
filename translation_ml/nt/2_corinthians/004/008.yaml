  text: ἐν παντὶ θλιβόμενοι ἀλλ’ οὐ στενοχωρούμενοι, ἀπορούμενοι ἀλλ’ οὐκ ἐξαπορούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: ml
  text: എല്ലാവിധത്തിലും ഞെരുക്കപ്പെടുന്നു[a], എങ്കിലും തകർന്നുപോകുന്നില്ല[b]; എന്തു ചെയ്യണമെന്നറിയാതെ കുഴങ്ങുന്നു, എങ്കിലും തീർത്തും വഴിമുട്ടുന്നില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എല്ലാറ്റിലും” എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പ്രയോഗം സമഗ്രമായ വ്യാപ്തിയെ സൂചിപ്പിക്കുന്നു, അക്ഷരാർഥത്തിൽ ചുറ്റുമുള്ള സ്ഥാനം ആവണമെന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഇടുങ്ങിയ സ്ഥലത്താക്കപ്പെടുന്നില്ല” അഥവാ “ഞെരുക്കി ഒതുക്കപ്പെടുന്നില്ല.” ഇവിടെ “തകർന്നുപോകുന്നില്ല” എന്നത് ആ രൂപകത്തിന്റെ സ്വാഭാവികമായ മലയാളപ്രകടനമാണ്.
    reason: lexical_alternative
  - marker: c
    text: “നിരാശയിലേക്കു തള്ളപ്പെടുന്നില്ല” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് പദം മുമ്പുള്ള “കുഴങ്ങുന്നു” എന്ന ആശയത്തെ തീവ്രമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: എല്ലാവിധത്തിലും
  rationale: കഷ്ടതയുടെ സമഗ്രമായ വ്യാപ്തിയെയോ രീതിയെയോ സൂചിപ്പിക്കുന്നു; ചുറ്റുമുള്ള ഭൗതിക സ്ഥാനം എന്ന ആശയം അനാവശ്യമായി നൽകുന്നില്ല.
- source_word: θλιβόμενοι
  choice: ഞെരുക്കപ്പെടുന്നു
  rationale: പുറത്തുനിന്നുള്ള സമ്മർദവും കഷ്ടതയും വ്യക്തമാക്കുകയും തുടർന്നുള്ള στενοχωρούμενοι എന്ന പദവുമായുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: στενοχωρούμενοι
  choice: ഞെരിഞ്ഞമരുന്നില്ല
  rationale: ഇടുങ്ങിയ അവസ്ഥയിലാക്കപ്പെടുക, പൂർണമായി അമർത്തപ്പെടുക എന്ന രൂപകത്തിന്റെ ഫലം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπορούμενοι
  choice: എന്തു ചെയ്യണമെന്നറിയാതെ കുഴങ്ങുന്നു
  rationale: എന്തു ചെയ്യണം, ഏതു വഴി സ്വീകരിക്കണം എന്നറിയാതെ വിഷമിക്കുന്ന അവസ്ഥയെ സാധാരണ വായനക്കാർക്കു വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐξαπορούμενοι
  choice: തീർത്തും വഴിമുട്ടുന്നില്ല
  rationale: മുൻപത്തെ ἀπορούμενοι എന്ന പദത്തെ ശക്തിപ്പെടുത്തുന്ന സംയുക്തക്രിയയുടെ തീവ്രത നിലനിർത്തുന്നു; പ്രത്യാശനഷ്ടത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്താർഥം ചുമത്തുന്നില്ല.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: എങ്കിലും ... ഇല്ല; ... എങ്കിലും ... ഇല്ല
  rationale: പൗലോസിന്റെ ആവർത്തിതമായ വൈരുധ്യഘടനയും താളവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രണ്ടാമത്തെ ക്രിയാജോടിയിലെ തീവ്രത
  choice: ἐξαπορούμενοι എന്നത് “തീർത്തും വഴിമുട്ടുന്നില്ല” എന്നു പരിഭാഷപ്പെടുത്തി ἀπορούμενοι എന്നതിൽനിന്നുള്ള തീവ്രത വർധന നിലനിർത്തി.
  alternative: “നിരാശരാകുന്നില്ല” എന്ന് പരിഭാഷപ്പെടുത്താം.
  rationale: ഗ്രീക്ക് പദജോടിയിലെ ‘വഴി കാണാതെ കുഴങ്ങുക / പൂർണമായി വഴിമുട്ടുക’ എന്ന ബന്ധം ഇതിലൂടെ കൂടുതൽ വ്യക്തമായി നിലനിൽക്കുന്നു; അതേസമയം വിശ്വാസമോ പ്രത്യാശയോ നഷ്ടപ്പെടുന്നതിനെക്കുറിച്ചുള്ള സാങ്കേതിക ദൈവശാസ്ത്രവാദം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ട് സമാന്തര വൈരുധ്യങ്ങളും പദാർഥതീവ്രതയും നിലനിർത്താൻ ആവർത്തിതമായ “എങ്കിലും ... ഇല്ല” ഘടന ഉപയോഗിച്ചു; ഒന്നാംപുരുഷ ബഹുവചനം മലയാളക്രിയാരൂപത്തിൽ സന്ദർഭാനുസൃതമായി ഉൾക്കൊള്ളുന്നു.
