revisions:
- from: എന്നാൽ, എഴുതിയിരിക്കുന്നതുപോലെ, “ഞാൻ വിശ്വസിച്ചു; അതുകൊണ്ട് ഞാൻ സംസാരിച്ചു,” വിശ്വാസത്തിന്റെ അതേ ആത്മാവ് നമുക്കുള്ളതിനാൽ[a], ഞങ്ങളും വിശ്വസിക്കുന്നു; അതുകൊണ്ട് ഞങ്ങളും സംസാരിക്കുന്നു[b].
