reference: 2 Corinthians 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: ml
  text: എന്നാൽ, വിശ്വാസത്തിന്റെ അതേ ആത്മാവ് ഉള്ളവരായ നാം[a], എഴുതിയിരിക്കുന്നതുപോലെ, “ഞാൻ വിശ്വസിച്ചു; അതുകൊണ്ട് ഞാൻ സംസാരിച്ചു,” ഞങ്ങളും വിശ്വസിക്കുന്നു; അതുകൊണ്ട് ഞങ്ങളും സംസാരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, πνεῦμα എന്നത് വിശ്വാസത്തിൽ പങ്കുചേരുന്ന ഒരു മനോഭാവത്തെയല്ല, പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നു എടുത്താൽ, “വിശ്വാസത്തിന്റെ അതേ പരിശുദ്ധാത്മാവ്.”
    reason: alternative_reading
  - marker: b
    text: പൗലോസ് സങ്കീർത്തനം 116:10 (സെപ്റ്റ്വജിന്റിൽ 115:1) ഉദ്ധരിച്ച്, തന്റെ വിശ്വാസത്തെയും സംസാരത്തെയും സങ്കീർത്തനകാരന്റെ സാക്ഷ്യത്തോട് ചേർത്തുനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες
  choice: നമുക്കുള്ളതിനാൽ
  rationale: വർത്തമാനകാല കർത്തരി കൃദന്തം പ്രധാനക്രിയയോടുള്ള സാഹചര്യബന്ധം സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ വിശ്വസിക്കുകയും സംസാരിക്കുകയും ചെയ്യുന്നതിന്റെ അടിസ്ഥാനമായി അത് പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിൽ കാരണസൂചനയുള്ള രൂപം സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യമോ വാദത്തിന്റെ മുന്നേറ്റമോ നിലനിർത്തുന്നു.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: വിശ്വാസത്തിന്റെ അതേ ആത്മാവ്
  rationale: വാക്യഘടനയിലെ ജനിറ്റീവ് ബന്ധവും πνεῦμα എന്ന പദത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അർഥസന്ദിഗ്ധതയും നിലനിർത്തുന്നു; ഇവിടെ അത് വിശ്വാസം നിറഞ്ഞ മനോഭാവത്തെയോ പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കാം.
- source_word: κατὰ τὸ γεγραμμένον
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: Ἐπίστευσα
  choice: ഞാൻ വിശ്വസിച്ചു
  rationale: πιστεύω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള പരിഭാഷയും ഉദ്ധരണിയിലെ ഭൂതകാലസ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: രണ്ടിടത്തും കാരണഫലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐλάλησα
  choice: ഞാൻ സംസാരിച്ചു
  rationale: λαλέω എന്ന സാധാരണ സംസാരക്രിയയുടെ ലളിതവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: ഞങ്ങളും വിശ്വസിക്കുന്നു
  rationale: ഊന്നലുള്ള സർവനാമവും καί-യുടെ ‘also’ ഭാവവും മലയാളത്തിലെ ‘ഞങ്ങളും’ എന്ന രൂപത്തിലൂടെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: διὸ καὶ λαλοῦμεν
  choice: അതുകൊണ്ട് ഞങ്ങളും സംസാരിക്കുന്നു
  rationale: സങ്കീർത്തനകാരന്റെ വിശ്വാസത്തോടും സംസാരത്തോടും പൗലോസ് വരയ്ക്കുന്ന സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നത് പരിശുദ്ധാത്മാവിനെയോ വിശ്വാസം നിറഞ്ഞ പൊതുമനോഭാവത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാനപാഠത്തിൽ ‘വിശ്വാസത്തിന്റെ അതേ ആത്മാവ്’ എന്ന് അർഥസന്ദിഗ്ധത നിലനിർത്തി
  alternative: ‘വിശ്വാസം നൽകുന്ന അതേ പരിശുദ്ധാത്മാവ്’ അല്ലെങ്കിൽ ‘വിശ്വാസം നിറഞ്ഞ അതേ മനോഭാവം’
  rationale: ഉദ്ധരിച്ച സങ്കീർത്തനവാക്യവുമായി ഉള്ള ബന്ധം ഒരു പൊതുവായ വിശ്വാസമനോഭാവത്തെ പിന്തുണയ്ക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് പദം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന സാധ്യത ഒഴിവാക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം ഒന്നിനെ നിർബന്ധമായി തെരഞ്ഞെടുത്തിട്ടില്ല.
- issue: πιστ- പദകുടുംബത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം / വിശ്വസിച്ചു / വിശ്വസിക്കുന്നു
  alternative: ആശ്രയിച്ചു / ആശ്രയിക്കുന്നു
  rationale: നാമവും ക്രിയയും തമ്മിലുള്ള ആശയബന്ധം കാത്തുസൂക്ഷിക്കുകയും ഗ്രീക്കിലെ വിശ്വാസസംബന്ധിയായ പദാവർത്തനം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഉദ്ധരണിയുടെ സമാന്തരഘടനയും ‘വിശ്വസിക്കുക—സംസാരിക്കുക’ എന്ന ആവർത്തനവും നിലനിർത്തിയിട്ടുണ്ട്; ‘ആത്മാവ്’ എന്ന പദത്തിലെ ദൈവശാസ്ത്രപരമായ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
