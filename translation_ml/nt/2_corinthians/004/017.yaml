  to: കാരണം, നമ്മുടെ ഈ ക്ഷണികവും ലഘുവുമായ കഷ്ടത നമുക്കുവേണ്ടി അളവതീതമായ നിത്യ തേജസ്സിന്റെ ഭാരം ഉളവാക്കുന്നു.[a]
  rationale: 'The revision more directly reflects the intensive Greek idiom, improves modern Malayalam flow, and retains every central lexical and rhetorical feature: present affliction, its momentary and light character, its benefit for ‘us,’ and the eternal weight of glory. The footnote anchor remains correctly placed immediately after the phrase it explains.'
