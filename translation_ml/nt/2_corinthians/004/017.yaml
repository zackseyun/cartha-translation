id: 2CO.4.17
reference: 2 Corinthians 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: ml
  text: കാരണം, നമ്മുടെ ഈ ക്ഷണികവും ലഘുവുമായ കഷ്ടത നമുക്കുവേണ്ടി അളവതീതമായ നിത്യ തേജസ്സിന്റെ ഭാരം ഉളവാക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതിരുകടന്ന അളവിൽ.” ഗ്രീക്കിൽ പദശഃ, “അതിശയത്തിനനുസരിച്ച് അതിശയത്തിലേക്ക്”; അസാധാരണമായ അളവിനെ സൂചിപ്പിക്കുന്ന ഊന്നൽപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: ക്ഷണികമായ
  rationale: ഇപ്പോഴത്തെ അല്പകാലത്തേക്കുള്ളത് എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും തുടർന്നുള്ള ‘നിത്യ’ എന്ന പദത്തോടുള്ള കാലപരമായ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐλαφρὸν
  choice: ലഘു
  rationale: βάρος എന്ന ‘ഭാരം’ എന്ന പദത്തോടുള്ള പൗലോസിന്റെ മനഃപൂർവമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു; കഷ്ടത നിസ്സാരമാണെന്ന് പറയുന്നില്ല, വരാനിരിക്കുന്ന തേജസ്സുമായി താരതമ്യപ്പെടുത്തുകയാണ്.
- source_word: θλίψεως
  choice: കഷ്ടത
  rationale: സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളുന്ന പൊതുവായ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; പ്രത്യേക അന്ത്യകാല സാങ്കേതികാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἡμῶν
  choice: നമ്മുടെ
  rationale: കഷ്ടത പൗലോസിനും സഹപ്രവർത്തകർക്കും അനുഭവപ്പെടുന്നതാണെന്ന ഉടമസ്ഥബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: താരതമ്യത്തിനതീതമായ
  rationale: ആവർത്തിച്ചുള്ള ഗ്രീക്ക് അതിശയോക്തിപ്രയോഗത്തിന്റെ അളവറ്റ മേന്മ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പദശഃരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: αἰώνιον
  choice: നിത്യ
  rationale: ക്ഷണികമായ ഇപ്പോഴത്തെ കഷ്ടതയോടുള്ള വ്യക്തമായ കാലപരമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: βάρος
  choice: ഭാരം
  rationale: ‘ലഘു’ എന്ന പദത്തോടുള്ള രൂപകാത്മക വൈരുധ്യം നിലനിർത്തുന്നു; ‘ഭാരം’ ഇവിടെ അടിച്ചമർത്തുന്ന ചുമടല്ല, തേജസ്സിന്റെ മഹത്ത്വവും സാരവുമാണ്.
- source_word: δόξης
  choice: തേജസ്സിന്റെ
  rationale: ഗ്രീക്കിലെ സമാസബന്ധം നിലനിർത്തി ‘തേജസ്സിന്റെ ഭാരം’ എന്ന ശക്തമായ പൗലോസീയ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: κατεργάζεται
  choice: ഉളവാക്കുന്നു
  rationale: തുടർച്ചയായി ഫലം സൃഷ്ടിക്കുന്നു എന്ന വർത്തമാനകാല കാരണാത്മക ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കുവേണ്ടി
  rationale: ഈ ദത്തിവ് വിശ്വാസികളുടെ പ്രയോജനത്തെ സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തുന്നു; ‘നമ്മിൽ’ എന്നു പറഞ്ഞ് ആന്തരിക സ്വഭാവരൂപീകരണം മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: നമ്മുടെ ക്ഷണികമായ ഈ ലഘുകഷ്ടത
  rationale: മൂലത്തിലെ ഉടമസ്ഥത, ഹ്രസ്വകാലികത, ലഘുത്വം എന്നിവയെല്ലാം സ്വാഭാവിക മലയാള പദക്രമത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കഷ്ടത ഉളവാക്കുന്ന തേജസ്സിന്റെ സ്വഭാവം
  choice: ഇപ്പോഴത്തെ കഷ്ടത വിശ്വാസികൾക്കുവേണ്ടി ഭാവിയിലെ നിത്യ തേജസ്സിലേക്കു ഫലിക്കുന്നതായി വാക്യം പറയുന്നു; കഷ്ടത രക്ഷയ്ക്ക് അർഹത നേടിത്തരുന്നു എന്ന് പരിഭാഷ പ്രസ്താവിക്കുന്നില്ല.
  alternative: കഷ്ടത മനുഷ്യപുണ്യത്താൽ തേജസ്സ് സമ്പാദിക്കുന്നു; അല്ലെങ്കിൽ അത് ഇപ്പോഴത്തെ ആത്മീയ പക്വത മാത്രം ഉളവാക്കുന്നു.
  rationale: ‘ക്ഷണികം–നിത്യം’, ‘ലഘു–ഭാരം’ എന്നീ വൈരുധ്യങ്ങൾ ഭാവിയിലെ അന്തിമ തേജസ്സിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. κατεργάζεται എന്ന ക്രിയയുടെ ശക്തമായ കാരണ-ഫലബന്ധം നിലനിർത്തിയിട്ടും അർഹതാസിദ്ധാന്തം വാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ലഘു/ഭാരം’, ‘ക്ഷണികം/നിത്യം’ എന്നീ മൂലപാഠത്തിലെ പ്രധാന വൈരുധ്യങ്ങൾ സംരക്ഷിച്ചു. ‘തേജസ്സിന്റെ ഭാരം’ എന്ന അപൂർവമായെങ്കിലും ഉദ്ദേശ്യപൂർവമായ രൂപകം ലളിതമാക്കി കളഞ്ഞിട്ടില്ല.
