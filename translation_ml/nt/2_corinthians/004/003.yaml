id: 2CO.4.3
reference: 2 Corinthians 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: ml
  text: എന്നാൽ, ഞങ്ങളുടെ സുവിശേഷം മൂടപ്പെട്ടിരിക്കുകയാണെങ്കിൽപ്പോലും, നശിച്ചുകൊണ്ടിരിക്കുന്നവരുടെ ഇടയിലാണ്[a] അത് മൂടപ്പെട്ടിരിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നശിച്ചുകൊണ്ടിരിക്കുന്നവർക്ക്’; അല്ലെങ്കിൽ, ‘നഷ്ടപ്പെട്ടവരുടെ ഇടയിൽ.’
    reason: ἐν τοῖς ἀπολλυμένοις can be understood with a reference-oriented sense (“to/for those who are perishing”) as well as the primary sphere sense (“among”); “lost” is a contextual lexical alternative to “perishing.”
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: എന്നാൽ … എങ്കിൽപോലും
  rationale: δέ സൂചിപ്പിക്കുന്ന തുടർച്ചയോടുകൂടിയ വൈരുധ്യവും καί ശക്തിപ്പെടുത്തുന്ന concessive ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κεκαλυμμένον
  choice: മൂടപ്പെട്ടിരിക്കുന്ന
  rationale: καλύπτω എന്ന ക്രിയയുടെ perfect passive രൂപവും 3:14–16; 4:4 എന്നിവയിലെ മൂടുപടത്തിന്റെ രൂപകവും സംരക്ഷിക്കുന്നു; ‘മറഞ്ഞിരിക്കുന്ന’ എന്നത് രൂപകത്തെ മങ്ങിച്ചേക്കാം.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: ഞങ്ങളുടെ സുവിശേഷം
  rationale: ἡμῶν എന്ന ഉടമസ്ഥസർവനാമം നേരിട്ട് നിലനിർത്തുകയും εὐαγγέλιον എന്നതിന് മലയാളത്തിൽ സ്ഥാപിതമായ ‘സുവിശേഷം’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നവരുടെ ഇടയിൽ
  rationale: ἐν എന്നതിന്റെ കൂട്ടത്തിനുള്ളിലെ മേഖല/ബന്ധം എന്ന അർഥം ‘ഇടയിൽ’ കൊണ്ട് പ്രകടമാക്കുന്നു; വർത്തമാന participle ആയ ἀπολλυμένοις സൂചിപ്പിക്കുന്ന തുടരുന്ന അവസ്ഥയെയോ പ്രക്രിയയെയോ ‘നശിച്ചുകൊണ്ടിരിക്കുന്നവർ’ സംരക്ഷിക്കുന്നു.
- source_word: ἐστὶν κεκαλυμμένον
  choice: അത് മൂടപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ച predicate ഊന്നൽ നിലനിർത്തുന്നു; ‘അത്’ സുവിശേഷത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. ‘മൂടപ്പെട്ടുതന്നെ തുടരുന്നു’ എന്നത് മൂലത്തിലെ ലളിതമായ copula-യെക്കാൾ അധികമായ ദൈർഘ്യഭാവം ചേർക്കും.
theological_decisions:
- issue: പൗലോസിന്റെ രക്ഷാശാസ്ത്രപരമായ സന്ദർഭത്തിൽ ἀπολλυμένοις എന്നതിന്റെ സ്വഭാവം
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നവർ
  alternative: നഷ്ടപ്പെട്ടവർ
  rationale: ഈ participle ഒരു സ്ഥിരമായ വിഭാഗനാമം മാത്രമല്ല, തുടരുന്ന അവസ്ഥയെയോ പ്രക്രിയയെയോ സൂചിപ്പിക്കുന്നു. ‘നശിച്ചുകൊണ്ടിരിക്കുന്നവർ’ പൗലോസിന്റെ ഭാഷയിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുകയും ‘നഷ്ടപ്പെട്ടവർ’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പരിഹാരം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മൂടപ്പെട്ടിരിക്കുന്നു’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ഊന്നലും സമീപസന്ദർഭത്തിലെ മൂടുപടത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
