reference: 2 Corinthians 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: ml
  text: കാരണം, യേശുവിന്റെ ജീവനും ഞങ്ങളുടെ മർത്യമായ ജഡത്തിൽ[b] വെളിപ്പെടേണ്ടതിനായി, ജീവിച്ചിരിക്കുന്ന ഞങ്ങൾ യേശു നിമിത്തം[a] എപ്പോഴും മരണത്തിന് ഏൽപ്പിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യേശു കാരണം’ എന്നും ‘യേശുവിനുവേണ്ടി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ജഡം’ എന്നത് മരണാധീനമായ ശാരീരിക അസ്തിത്വത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘പാപസ്വഭാവത്തെ’ അല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: എപ്പോഴും
  rationale: തുടർച്ചയായോ ആവർത്തിച്ചോ സംഭവിക്കുന്ന സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു; ലളിതവും നേരിട്ടുമുള്ള സമാനപദം.
- source_word: γάρ
  choice: ആകട്ടെ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായ കാരണവ്യാഖ്യാനം അധികമായി ചേർക്കുന്നില്ല.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: ജീവിച്ചിരിക്കുന്ന ഞങ്ങൾ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ തുടരുന്ന ഭാവവും അതേ വാക്യത്തിലെ ‘മരണം’ എന്നതിനോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: മരണത്തിന് ഏൽപ്പിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും മരണത്തിലേക്കുള്ള വിധി/ലക്ഷ്യവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ Ἰησοῦν
  choice: യേശു നിമിത്തം
  rationale: διά + ദ്വിതീയാവിഭക്തി ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ‘യേശുവിനുവേണ്ടി’ എന്ന ഉദ്ദേശ്യനിറം മാത്രം നൽകാതെ മൂലത്തിലെ കാരണപരമായ വിശാലത കാക്കുന്നു.
- source_word: ἵνα
  choice: വെളിപ്പെടേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ἵναയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ ἡ ζωὴ τοῦ Ἰησοῦ
  choice: യേശുവിന്റെ ജീവനും
  rationale: καὶ എന്നതിന്റെ ‘കൂടി/ഉം’ ഭാവവും ‘യേശുവിന്റെ ജീവൻ’ എന്ന ജനിറ്റീവ് ഘടനയും നിലനിർത്തുന്നു.
- source_word: φανερωθῇ
  choice: വെളിപ്പെടുക
  rationale: കർമണി അർത്ഥം നിലനിർത്തുകയും പ്രവർത്തകനെ വ്യക്തമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: ഞങ്ങളുടെ മർത്യമായ ജഡത്തിൽ
  rationale: σάρξ എന്ന മൂലപദം ‘ജഡം’ ആയി നിലനിർത്തുന്നു; θνητός അതിന്റെ മരണാധീനത വ്യക്തമാക്കുന്നു. ഇവിടെ പാപസ്വഭാവമല്ല, ദുർബലവും നശ്വരവുമായ ശാരീരിക അസ്തിത്വമാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിലെ σάρξ എന്ന പദം
  choice: ജഡം
  alternative: ശരീരം; പാപസ്വഭാവം
  rationale: ‘മർത്യമായ ജഡം’ എന്ന സന്ദർഭം ശാരീരിക മരണാധീനതയെ സൂചിപ്പിക്കുന്നു; ധാർമികമായ ‘പാപസ്വഭാവം’ ഇവിടെ ഉദ്ദേശ്യമല്ല. ‘ശരീരം’ കൂടുതൽ വ്യാഖ്യാനാത്മകവും മൂലപദത്തിന്റെ പ്രത്യേകത മങ്ങിക്കുന്നതുമാകുന്നതിനാൽ ‘ജഡം’ നിലനിർത്തി അടിക്കുറിപ്പിൽ അർത്ഥം വ്യക്തമാക്കി.
- issue: διὰ Ἰησοῦν എന്നതിലെ കാരണബന്ധം
  choice: യേശു നിമിത്തം
  alternative: യേശുവിനുവേണ്ടി; യേശു കാരണം
  rationale: ഈ പ്രയോഗം യേശുവുമായുള്ള ബന്ധം മൂലമുണ്ടാകുന്ന കഷ്ടതയെയും അവനുവേണ്ടി സഹിക്കുന്നതെയും ഉൾക്കൊള്ളാം. പ്രധാനപാഠം കാരണപരമായ വിശാലത നിലനിർത്തുന്നു; പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἵναയുടെ ഉദ്ദേശ്യം/ഫലം
  choice: വെളിപ്പെടേണ്ടതിനാണ്
  alternative: അങ്ങനെ വെളിപ്പെടുന്നു
  rationale: ഉദ്ദേശ്യഭാവത്തിന് മുൻതൂക്കം നൽകുന്നു; എങ്കിലും ഫലത്തിന്റെ അനുരണനം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘മരണത്തിന് ഏൽപ്പിക്കപ്പെടുന്നു’ എന്നത് കർമണിരൂപവും തുടർച്ചയായ പീഡനഭാവവും കാക്കുന്നു. ‘ജഡം’ എന്ന പരമ്പരാഗതവും മൂലപദസന്നിഹിതവുമായ പദം നിലനിർത്തി തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
