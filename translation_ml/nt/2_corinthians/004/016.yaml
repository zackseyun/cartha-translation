source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: ml
  text: അതുകൊണ്ട് ഞങ്ങൾ മനസ്സുതളരുന്നില്ല. ഞങ്ങളുടെ ബാഹ്യമനുഷ്യൻ ക്ഷയിച്ചുകൊണ്ടിരിക്കുകയാണെങ്കിലും, ഞങ്ങളുടെ ആന്തരികമനുഷ്യൻ അനുദിനം പുതുക്കപ്പെടുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഞങ്ങളുടെ ബാഹ്യവ്യക്തി’ എന്നും ‘ഞങ്ങളുടെ ആന്തരികവ്യക്തി’ എന്നും. ഗ്രീക്കിൽ ‘മനുഷ്യൻ’ എന്ന പദം പ്രതിനിധാനാർഥത്തിൽ ഉപയോഗിച്ച് മനുഷ്യജീവിതത്തിന്റെ ബാഹ്യവും ആന്തരികവുമായ വശങ്ങൾ തമ്മിൽ ഉദ്ദേശ്യപൂർവമായ വിരുദ്ധത സ്ഥാപിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἐγκακοῦμεν
  choice: ഞങ്ങൾ മനസ്സുതളരുന്നില്ല
  rationale: ധൈര്യം നഷ്ടപ്പെടുകയോ നിരുത്സാഹപ്പെടുകയോ ചെയ്യാതിരിക്കുന്നതെന്ന പൗലോസിന്റെ പ്രയോഗാർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀλλ’ εἰ καὶ
  choice: …ആണെങ്കിലും
  rationale: യാഥാർഥ്യമായി അംഗീകരിക്കുന്ന സാഹചര്യത്തെ concessive ഭാവത്തിൽ അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘എങ്കിലും’ ഘടന ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: ഞങ്ങളുടെ ബാഹ്യമനുഷ്യൻ
  rationale: ἄνθρωπος എന്ന ഏകവചനവും ‘ആന്തരികമനുഷ്യൻ’ എന്ന ഉദ്ദേശ്യപൂർവമായ സമാന്തരവിരുദ്ധതയും നിലനിർത്തുന്നു; ശരീരം മാത്രം എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: διαφθείρεται
  choice: ക്ഷയിച്ചുകൊണ്ടിരിക്കുന്നു
  rationale: നടന്നുകൊണ്ടിരിക്കുന്ന ജീർണതയെയോ അധഃപതനത്തെയോ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കർമണിപ്രയോഗം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സമ്പൂർണ നാശം എന്ന അതിരുകടന്ന അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἀλλ’
  choice: എങ്കിലും
  rationale: ബാഹ്യക്ഷയത്തിനും ആന്തരിക പുതുക്കലിനുമിടയിലെ ശക്തമായ വിരോധം വ്യക്തമാക്കുന്നു.
- source_word: ὁ ἔσω ἡμῶν
  choice: ഞങ്ങളുടെ ആന്തരികമനുഷ്യൻ
  rationale: മൂലത്തിലെ ലോപപ്രയോഗം പൂരിപ്പിക്കുകയും ‘ബാഹ്യമനുഷ്യൻ’ എന്നതിനോടുള്ള കൃത്യമായ പദസമാന്തര്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνακαινοῦται
  choice: പുതുക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: തുടർച്ചയായി വിഷയത്തിന്മേൽ സംഭവിക്കുന്ന പുതുക്കലിനെ വർത്തമാന കർമണിരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: അനുദിനം
  rationale: ഓരോ ദിവസവും തുടർച്ചയായി എന്ന വിതരണാർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ὁ ἔξω ἄνθρωπος / ὁ ἔσω ἄνθρωπος എന്ന മനുഷ്യശാസ്ത്രപരമായ വിരുദ്ധത
  choice: ‘ബാഹ്യമനുഷ്യൻ’ / ‘ആന്തരികമനുഷ്യൻ’ എന്ന് സമാന്തരമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ബാഹ്യവ്യക്തിത്വം’ / ‘ആന്തരികവ്യക്തിത്വം’; അല്ലെങ്കിൽ ‘പുറമേയുള്ള ഞങ്ങൾ’ / ‘അകമേയുള്ള ഞങ്ങൾ’.
  rationale: പൗലോസ് ഉദ്ദേശ്യപൂർവം സ്ഥാപിക്കുന്ന ‘പുറത്തെ/അകത്തെ മനുഷ്യൻ’ എന്ന വിരുദ്ധത നിലനിർത്തുന്നു. അതേസമയം ഇതിനെ പൂർണമായ ശരീരം–ആത്മാവ് ദ്വൈതസിദ്ധാന്തമായി വിശദീകരിക്കാതെ വാക്യത്തിലെ യഥാർഥ അനിശ്ചിതത്വവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പൗലോസിന്റെ സമാന്തരപ്രയോഗം സംരക്ഷിക്കാൻ ‘ബാഹ്യമനുഷ്യൻ/ആന്തരികമനുഷ്യൻ’ തെരഞ്ഞെടുത്തു. ‘ക്ഷയിച്ചുകൊണ്ടിരിക്കുന്നു’ എന്നും ‘പുതുക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു’ എന്നും ഉപയോഗിച്ച് രണ്ടു വർത്തമാന കർമണിക്രിയകളുടെയും തുടരുന്ന സ്വഭാവം പ്രകടമാക്കി.
