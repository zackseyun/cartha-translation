revisions:
- from: എന്നാൽ ഈ നിധി നമുക്കുള്ളത് മൺകുടങ്ങളിലാണ്[a]; ശക്തിയുടെ അത്യധികമായ മഹത്ത്വം ദൈവത്തിന്റേതായിരിക്കാനും നമ്മിൽനിന്നുള്ളതല്ലാതിരിക്കാനുമാണിത്[b].
  to: എന്നാൽ ഈ നിധി മൺകുടങ്ങളിൽ നമുക്കുണ്ട്[a]; ശക്തിയുടെ അത്യധികമായ മഹത്ത്വം ദൈവത്തിന്റേതും നമ്മിൽനിന്നുള്ളതല്ലാത്തതും ആകേണ്ടതിന്[b].
  rationale: 'The revision improves modern Malayalam syntax while preserving every semantic component of the Greek: present possession (‘നമുക്കുണ്ട്’), the fragile clay-vessel metaphor, and the purposive/resultative ἵνα clause. It does not identify the treasure or vessels beyond the source text, and it retains the source’s asymmetric expressions for God and human source/agency.'
