  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: ml
  text: എന്നാൽ ഈ നിധി മൺകുടങ്ങളിൽ നമുക്കുണ്ട്[a]; ശക്തിയുടെ അത്യധികമായ മഹത്ത്വം ദൈവത്തിന്റേതും നമ്മിൽനിന്നുള്ളതല്ലാത്തതും ആകേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മൺപാത്രങ്ങളിൽ.”
    reason: lexical_alternative
  - marker: b
    text: “ശക്തിയുടെ അത്യധികമായ മഹത്ത്വം” എന്നതിന് “അസാധാരണമായ ശക്തി” എന്നോ “അതിശ്രേഷ്ഠമായ ശക്തി” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: എന്നാൽ … നമുക്കുള്ളത്
  rationale: വർത്തമാനകാലത്തിലുള്ള കൈവശാവസ്ഥയും δέ സൂചിപ്പിക്കുന്ന മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: ഈ നിധി
  rationale: θησαυρός എന്നതിന്റെ സാധാരണ അർഥമായ ‘നിധി’യും മുൻസന്ദർഭത്തിലേക്കു വിരൽചൂണ്ടുന്ന demonstrative-ഉം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: മൺകുടങ്ങളിൽ
  rationale: ചുട്ടമണ്ണുകൊണ്ടുള്ള സാധാരണവും എളുപ്പം പൊട്ടുന്നതുമായ പാത്രങ്ങളുടെ ദൃശ്യബിംബം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ പൊതുവായ ‘മൺപാത്രങ്ങളിൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἵνα
  choice: …ആിരിക്കാനും …അല്ലാതിരിക്കാനുമാണിത്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യ/ഫല സൂചനയെ മലയാളത്തിൽ സ്വാഭാവികമായ ലക്ഷ്യഘടനയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: ശക്തിയുടെ അത്യധികമായ മഹത്ത്വം
  rationale: ὑπερβολή സൂചിപ്പിക്കുന്ന അളവുകടന്ന ശ്രേഷ്ഠതയും ഗ്രീക്കിലെ നാമപദഘടനയും ചുരുക്കിക്കളയാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: ദൈവത്തിന്റേതായിരിക്കാനും നമ്മിൽനിന്നുള്ളതല്ലാതിരിക്കാനും
  rationale: ശക്തിയുടെ ഉറവിടം ദൈവമാണെന്നും മനുഷ്യരല്ലെന്നും പറയുന്ന കർത്തൃത്വ/ഉറവിട വൈരുധ്യം നിലനിർത്തുന്നു; τοῦ θεοῦ എന്ന ജനിറ്റീവും ἐξ ἡμῶν എന്ന ഉറവിടപ്രയോഗവും തമ്മിലുള്ള ചെറിയ രൂപവ്യത്യാസവും മായ്ച്ചുകളയുന്നില്ല.
theological_decisions:
- issue: ‘നിധി’, ‘മൺകുടങ്ങൾ’ എന്നീ രൂപകങ്ങളുടെ അർഥം
  choice: രൂപകങ്ങളെ വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘സുവിശേഷമാകുന്ന നിധി’, ‘നമ്മുടെ ദുർബലമായ ശരീരങ്ങൾ’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: ചുറ്റുപാടുള്ള വാക്യങ്ങൾ രൂപകങ്ങളുടെ അർഥം വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യം തന്നെ അത്തരം വിശദീകരണം ചേർക്കുന്നില്ല; അതിനാൽ പരിഭാഷയിൽ വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: ἵνα ഉപവാക്യത്തിന്റെ ഭാവം
  choice: ഉദ്ദേശ്യവും അതിൽനിന്നുണ്ടാകുന്ന ഫലവും ഉൾക്കൊള്ളാവുന്ന ലക്ഷ്യഘടന ഉപയോഗിച്ചു.
  alternative: ‘അതിന്റെ ഫലമായി … ആണ്’ എന്ന ശുദ്ധഫലവാചകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ἵνα ഇവിടെ ഫലത്തിന്റെ ഛായ കൈവരിക്കാമെങ്കിലും ഉദ്ദേശ്യഭാവം ഇല്ലാതാക്കുന്നത് ഗ്രീക്കിലുള്ള യഥാർഥ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കും.
- issue: ശക്തി ദൈവത്തിന്റേതോ ദൈവത്തിൽനിന്നുള്ളതോ എന്ന ബന്ധം
  choice: τοῦ θεοῦ എന്നതിനെ ‘ദൈവത്തിന്റേത്’ എന്നും ἐξ ἡμῶν എന്നതിനെ ‘നമ്മിൽനിന്നുള്ളതല്ല’ എന്നും വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടും ഒരേപോലെ ‘ദൈവത്തിൽനിന്നുള്ളത്, നമ്മിൽനിന്നുള്ളതല്ല’ എന്നു സമാന്തരമാക്കുക.
  rationale: ഗ്രീക്കിലെ വ്യത്യസ്ത വിഭക്തി/ഉപസർഗഘടനകൾ നിലനിർത്തുന്നത് ഉടമസ്ഥത, ഉത്ഭവം, കർത്തൃത്വം എന്നിവയ്ക്കിടയിലെ അർഥസമ്പുഷ്ടമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘നിധി’ നിലനിർത്തിയപ്പോൾ, ദുർഗ്രാഹ്യമായ പഴയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. പ്രധാനവാക്യത്തിലെ രൂപകവും പൗലോസിന്റെ സാന്ദ്രമായ ദൈവശാസ്ത്രപരമായ വൈരുധ്യവും വിശദീകരിച്ച് ലഘൂകരിച്ചിട്ടില്ല.
