id: 2CO.11.19
reference: 2 Corinthians 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡδέως γὰρ ἀνέχεσθε τῶν ἀφρόνων φρόνιμοι ὄντες·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/019.yaml
  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ജ്ഞാനികളായിരിക്കെ, മൂഢന്മാരെ സന്തോഷത്തോടെ സഹിക്കുന്നുവല്ലോ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “മൂഢന്മാരെ പൊറുക്കുന്നുവല്ലോ.”'
    reason: lexical_alternative
  - marker: b
    text: 'പൗലോസ് ഇവിടെ പരിഹാസത്തോടെയാണ് സംസാരിക്കുന്നത്: കൊരിന്ത്യർ തങ്ങളെ ജ്ഞാനികളെന്നു കരുതുമ്പോഴും, മൂഢന്മാരെ സന്തോഷത്തോടെ സഹിക്കുന്നു.'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: സന്തോഷത്തോടെ
  rationale: മനസ്സോടെയോ പ്രസാദത്തോടെയോ സ്വീകരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം. സന്ദർഭത്തിലെ പൗലോസിന്റെ പരിഹാസസ്വരവും ഇത് നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἀνέχεσθε
  choice: സഹിച്ചുകൊള്ളുന്നു
  rationale: ഒരാളെ പൊറുക്കുക, സഹിക്കുക, അനുവദിച്ചുകൊടുക്കുക എന്ന അർഥം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ സന്ദർഭത്തിലെ വിമർശനത്തിന്റെ മൂർച്ചയും നിലനിർത്തുന്നു.
- source_word: τῶν ἀφρόνων
  choice: മൂഢന്മാരെ
  rationale: ജ്ഞാനികളെന്നതിന് നേർവിപരീതമായി, വിവേകമില്ലാത്ത ആളുകളെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: φρόνιμοι
  choice: ജ്ഞാനികൾ
  rationale: ‘മൂഢന്മാർ’ എന്നതിനോടുള്ള പദവൈരുധ്യം സംരക്ഷിക്കുകയും കൊരിന്ത്യർ തങ്ങളെക്കുറിച്ച് കരുതുന്നതിനെ പരിഹാസത്തോടെ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὄντες
  choice: ആയിരിക്കെ
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപത്തെ കാരണം എന്നോ വഴങ്ങൽ എന്നോ നിർബന്ധമായി തീർപ്പാക്കാതെ അവതരിപ്പിക്കുന്നു; പരിഹാസത്തിന്റെ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു.
theological_decisions:
- issue: കൊരിന്ത്യരോടുള്ള പൗലോസിന്റെ പരിഹാസപ്രയോഗം
  choice: ‘മൂഢന്മാർ’–‘ജ്ഞാനികൾ’ എന്ന വൈരുധ്യത്തിലൂടെയും ‘സന്തോഷത്തോടെ’ എന്ന പദത്തിലൂടെയും പരിഹാസം പാഠത്തിൽ പരോക്ഷമായി നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ അത്ര ജ്ഞാനികളാണല്ലോ’ എന്നതുപോലെ പരിഹാസം വ്യാഖ്യാനിച്ച് കൂടുതൽ പ്രകടമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം പരിഹാസം വിശദീകരിക്കുന്നില്ല; പദങ്ങളുടെ കൂട്ടിയിടിയിലൂടെയാണ് അത് പ്രകടമാകുന്നത്. അതിനാൽ വ്യാഖ്യാനപരമായ വാക്കുകൾ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സഹിച്ചുകൊള്ളുന്നു’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പൗലോസിന്റെ മൂർച്ചയുള്ള പരിഹാസത്തിന് യോജിച്ചതുമാണ്; ‘ആയിരിക്കെ’ പങ്കാളിത്തരൂപത്തിലെ കാരണം/വഴങ്ങൽ സംബന്ധമായ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
