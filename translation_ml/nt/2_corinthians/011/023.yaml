id: 2CO.11.23
reference: 2 Corinthians 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ml
  text: 'അവർ മശീഹയുടെ[a] സേവകരാണോ? മതിഭ്രമം വന്നവനെപ്പോലെയാണ് ഞാൻ സംസാരിക്കുന്നത്: ഞാൻ അതിലുമധികമാണ്—അധ്വാനങ്ങളിൽ അതിലേറെ, തടവുകളിൽ അതിലേറെ, അടികളിൽ അളവറ്റവിധം, മരണങ്ങളിൽ പലപ്പോഴും.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ ‘ക്രിസ്തുവിന്റെ’: ‘അവർ ക്രിസ്തുവിന്റെ സേവകരാണോ?’'
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മരണങ്ങളിൽ പലപ്പോഴും’; ആവർത്തിച്ചുണ്ടായ മരണസമീപ അനുഭവങ്ങളെയോ മാരകമായ അപകടങ്ങളെയോ ഇത് സൂചിപ്പിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: സേവകർ
  rationale: ശുശ്രൂഷിക്കുകയോ സേവിക്കുകയോ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന പദമാണിത്. സഭാപദവിയെന്ന ധ്വനി അനാവശ്യമായി വരാതിരിക്കാനും പൗലൊസിന്റെ താരതമ്യം സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കാനും ‘സേവകർ’ തെരഞ്ഞെടുത്തു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമംപോലെക്കാൾ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി. പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: παραφρονῶν λαλῶ
  choice: മതിഭ്രമം വന്നവനെപ്പോലെയാണ് ഞാൻ സംസാരിക്കുന്നത്
  rationale: സ്വന്തം പ്രശംസ ഭ്രാന്തമായ സംസാരമായി കേൾക്കാമെന്ന പൗലൊസിന്റെ ആത്മബോധമുള്ള പരാമർശം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ἐγώ
  choice: ഞാൻ അതിലുമധികമാണ്
  rationale: ഗ്രീക്കിലെ ചുരുക്കിയ താരതമ്യപ്രയോഗം പൂർണമായി വിശദീകരിക്കാതെ, മുൻചോദ്യവുമായി ബന്ധിപ്പിച്ച് മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവണ്ണം അവതരിപ്പിക്കുന്നു.
- source_word: ἐν κόποις περισσοτέρως
  choice: അധ്വാനങ്ങളിൽ അതിലേറെ
  rationale: κόπος സൂചിപ്പിക്കുന്ന കഠിനവും ക്ഷീണിപ്പിക്കുന്നതുമായ പരിശ്രമവും περισσοτέρως എന്ന താരതമ്യശക്തിയും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: തടവുകളിൽ അതിലേറെ
  rationale: ബഹുവചനം ആവർത്തിച്ചുണ്ടായ തടവനുഭവങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘തടവുകളിൽ’ സ്ഥലത്തെയും അനുഭവത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: അടികളിൽ അളവറ്റവിധം
  rationale: ശാരീരികമായി ഏൽപ്പിച്ച പ്രഹരങ്ങളും അവയുടെ അസാധാരണമായ അതിരുകടന്ന അളവും നിലനിർത്തുന്നു; ഔദ്യോഗിക ചമ്മട്ടിയടിയായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἐν θανάτοις πολλάκις
  choice: മരണങ്ങളിൽ പലപ്പോഴും
  rationale: ഗ്രീക്കിലെ ശ്രദ്ധേയമായ ‘മരണങ്ങൾ’ എന്ന ബഹുവചനം വ്യാഖ്യാനിച്ച് മിനുക്കാതെ മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു; സാധ്യതയുള്ള ആശയം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരിന്റെ സ്വഭാവം പ്രകടമാണ്. പരമ്പരാഗത രൂപം തള്ളിക്കളയാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: ἐν θανάτοις πολλάκις എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: മരണങ്ങളിൽ പലപ്പോഴും
  alternative: പലപ്പോഴും മരണത്തെ അഭിമുഖീകരിച്ചു / പലവട്ടം മരണത്തിന്റെ വക്കിലായി
  rationale: മരണസമീപ അനുഭവങ്ങളെയോ മാരകമായ അപകടങ്ങളെയോ ഉദ്ദേശിച്ചിരിക്കാം; എന്നാൽ മൂലത്തിലെ അസാധാരണമായ ബഹുവചനം വ്യാഖ്യാനത്തിലൂടെ നിശ്ചയിച്ച് കളയാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. പൗലൊസിന്റെ പരിഹാസഭരിതമായ ചോദ്യവും ചുരുക്കിയ താരതമ്യവും കഷ്ടാനുഭവങ്ങളുടെ തീവ്രമായ പട്ടികയും സംരക്ഷിച്ചു; ‘മരണങ്ങളിൽ’ എന്ന ഉദ്ദേശപൂർവമായ അസാധാരണത മിനുക്കിയില്ല.
