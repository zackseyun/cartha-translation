id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: ml
  text: സംസാരത്തിൽ വൈദഗ്ധ്യമില്ലാത്തവനാണെങ്കിലും[a], അറിവിൽ അങ്ങനെയല്ല. പക്ഷേ, എല്ലാ വിധത്തിലും എല്ലാ കാര്യങ്ങളിലും ഞങ്ങൾ ഇതു നിങ്ങൾക്കു വ്യക്തമാക്കിയിട്ടുണ്ട്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സംസാരിക്കുന്നതിൽ പരിശീലനം ലഭിക്കാത്തവനാണെങ്കിലും”; അതായത്, മിനുക്കമുള്ള വാഗ്‌മിത്വത്തിൽ ഔപചാരിക പരിശീലനം ലഭിക്കാത്തവൻ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എല്ലാ വിധത്തിലും, എല്ലാവരുടെയും ഇടയിൽ, ഞങ്ങൾ ഇതു നിങ്ങൾക്കു വ്യക്തമാക്കിയിട്ടുണ്ട്.” ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമുള്ളതായതിനാൽ “എല്ലാ കാര്യങ്ങളിലും,” “എല്ലാ സാഹചര്യങ്ങളിലും,” അല്ലെങ്കിൽ “എല്ലാവരുടെയും ഇടയിൽ” എന്നിങ്ങനെ അടുത്ത അർഥങ്ങളിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: സംസാരത്തിൽ പരിശീലനം നേടിയിട്ടില്ലാത്തവൻ
  rationale: ഇവിടെ പൗലോസ് പൊതുവായ അജ്ഞതയെയല്ല, ഔപചാരികമായ പ്രസംഗപരിശീലനത്തിന്റെയോ വാഗ്‌മിത്വമികവിന്റെയോ അഭാവത്തെയാണ് അറിവിനോടു വിപരീതമായി പറയുന്നത്.
- source_word: γνώσει
  choice: അറിവിൽ
  rationale: സംസാരവൈദഗ്ധ്യത്തോടുള്ള വ്യക്തമായ വിരോധം നിലനിർത്തുന്ന നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: φανερώσαντες
  choice: ഞങ്ങൾ ഇതു വ്യക്തമാക്കിയിട്ടുണ്ട്
  rationale: കർത്താവ് ബഹുവചനമായതിനാൽ ‘ഞങ്ങൾ’ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ പ്രത്യക്ഷമായ കർമമില്ലെങ്കിലും സന്ദർഭത്തിൽ പൗലോസിന്റെ അറിവാണ് തെളിയിക്കപ്പെട്ട കാര്യം. മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ഇതു’ ചേർത്തിരിക്കുന്നു.
- source_word: ἐν παντί
  choice: എല്ലാ വിധത്തിലും
  rationale: തെളിയിച്ച രീതിയുടെ സമഗ്രത സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗമായി എടുത്തിരിക്കുന്നു.
- source_word: ἐν πᾶσιν εἰς ὑμᾶς
  choice: എല്ലാ കാര്യങ്ങളിലും ... നിങ്ങൾക്കു
  rationale: ചുരുക്കിപ്പറഞ്ഞിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലമായ അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; വ്യക്തികളെയാണോ കാര്യങ്ങളെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന അവ്യക്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സംസാരശേഷിയെക്കുറിച്ചുള്ള സ്വയംവിവരണം
  choice: മിനുക്കമുള്ള പ്രസംഗപരിശീലനത്തിന്റെ അഭാവം അദ്ദേഹം സമ്മതിക്കുന്നു; അറിവിന്റെ അഭാവം അല്ല
  alternative: അദ്ദേഹം പൊതുവെ വിദ്യാഭ്യാസമില്ലാത്തവനാണെന്നോ യാതൊരു കുറവും സമ്മതിക്കാതെ പൂർണമായി പരിഹസിക്കുകയാണെന്നോ വായിക്കുക
  rationale: ‘സംസാരം’–‘അറിവ്’ എന്ന നേരിട്ടുള്ള വിരോധവും എതിരാളികളായ അധ്യാപകരെക്കുറിച്ചുള്ള സമീപസന്ദർഭവും വിഷയം വാഗ്‌മിത്വശൈലിയാണെന്ന് സൂചിപ്പിക്കുന്നു; അധികാരത്തെയോ സത്യത്തെയോ നിഷേധിക്കുന്നതായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘വാഗ്‌മിത്വം’ പോലുള്ള സാങ്കേതിക പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു; ആവർത്തനസ്വഭാവമുള്ള ἐν παντί / ἐν πᾶσιν മുഖ്യവാചകത്തിൽ കഴിയുന്നത്ര നിലനിർത്തി.
