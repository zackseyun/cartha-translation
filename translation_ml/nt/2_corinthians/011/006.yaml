revisions:
- from: സംസാരത്തിൽ ഞാൻ പരിശീലനം നേടിയിട്ടില്ലാത്തവനായിരുന്നാലും[a], അറിവിൽ അങ്ങനെയല്ല. മറിച്ച്, എല്ലാ വിധത്തിലും എല്ലാ കാര്യങ്ങളിലും ഞങ്ങൾ ഇതു നിങ്ങൾക്കു വ്യക്തമാക്കിയിട്ടുണ്ട്.[b]
  to: സംസാരത്തിൽ വൈദഗ്ധ്യമില്ലാത്തവനാണെങ്കിലും[a], അറിവിൽ അങ്ങനെയല്ല. പക്ഷേ, എല്ലാ വിധത്തിലും എല്ലാ കാര്യങ്ങളിലും ഞങ്ങൾ ഇതു നിങ്ങൾക്കു വ്യക്തമാക്കിയിട്ടുണ്ട്.[b]
