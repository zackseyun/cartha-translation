  to: ഞാൻ ഒരു ജനലിലൂടെ, ഒരു കൊട്ടയിൽ, മതിലിലൂടെ താഴേക്കിറക്കപ്പെട്ടു; അങ്ങനെ അവന്റെ കൈകളിൽനിന്ന് രക്ഷപ്പെട്ടു.[a]
