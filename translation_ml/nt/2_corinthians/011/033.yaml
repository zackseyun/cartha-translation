id: 2CO.11.33
reference: 2 Corinthians 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διὰ θυρίδος ἐν σαργάνῃ ἐχαλάσθην διὰ τοῦ τείχους καὶ ἐξέφυγον τὰς χεῖρας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: ml
  text: ഞാൻ ഒരു ജനലിലൂടെ, ഒരു കൊട്ടയിൽ, മതിലിലൂടെ താഴേക്കിറക്കപ്പെട്ടു; അങ്ങനെ അവന്റെ കൈകളിൽനിന്ന് രക്ഷപ്പെട്ടു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊട്ട’ എന്നതിനു ‘കയർകൊട്ട’ അല്ലെങ്കിൽ ‘ചൂരൽക്കൊട്ട’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: ജനൽ
  rationale: θυρίς ഒരു ജനലിനെയോ ചെറിയ തുറവിനെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ‘ജനൽ’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദമാണ്.
- source_word: σαργάνῃ
  choice: കൊട്ട
  rationale: σαργάνη കയറോ ചൂരലോ പോലുള്ള വസ്തുക്കൾ മെടഞ്ഞുണ്ടാക്കിയ പാത്രത്തെ സൂചിപ്പിക്കുന്നു. മുഖ്യപാഠത്തിൽ ‘കൊട്ട’ വ്യക്തവും സ്വാഭാവികവുമാണ്; നിർമ്മാണരീതിയുടെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐχαλάσθην
  choice: ഞാൻ ... ഇറക്കപ്പെട്ടു
  rationale: χαλάω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം ഇവിടെ കയറോ സമാനമായ മാർഗമോ ഉപയോഗിച്ച് താഴേക്ക് ഇറക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഇറക്കപ്പെട്ടു’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: διὰ τοῦ τείχους
  choice: മതിലിനപ്പുറത്തേക്ക്
  rationale: ജനലിലൂടെ കൊട്ടയിൽ താഴെയിറക്കപ്പെട്ടെന്ന സന്ദർഭത്തിൽ മതിലിലെ തുറവിലൂടെ കടന്ന് അതിന്റെ മറുവശത്തേക്കുള്ള നീക്കമാണ് ഉദ്ദേശിക്കുന്നത്. അക്ഷരാർഥമായ ‘മതിലിലൂടെ’ മലയാളത്തിൽ മതിലിന്റെ ഘനഭാഗം തുളച്ചുകടന്നെന്ന തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; ‘മതിലിനപ്പുറത്തേക്ക്’ സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: അവന്റെ കൈകളിൽനിന്ന് രക്ഷപ്പെട്ടു
  rationale: ഇത് ഒരാളുടെ പിടിയിൽനിന്നോ അധികാരത്തിൽനിന്നോ ഒഴിഞ്ഞുമാറുന്നതിനെ സൂചിപ്പിക്കുന്ന സജീവമായ പ്രയോഗമാണ്. ‘കൈകളിൽനിന്ന് രക്ഷപ്പെട്ടു’ എന്നത് ഗ്രീക്കിലെ ദൃശ്യഭാവം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ സംഭവക്രമം വ്യക്തമായി നിലനിർത്തുകയും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും ‘കൈകൾ’ എന്ന ദൃശ്യപ്രയോഗവും സംരക്ഷിക്കുകയും ചെയ്തു.
