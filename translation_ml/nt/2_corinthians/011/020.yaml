source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: ml
  text: കാരണം, ആരെങ്കിലും നിങ്ങളെ അടിമകളാക്കുകയോ, ആരെങ്കിലും നിങ്ങളെ വിഴുങ്ങുകയോ, ആരെങ്കിലും നിങ്ങളിൽനിന്ന് എടുക്കുകയോ[a], ആരെങ്കിലും സ്വയം ഉയർത്തിക്കാട്ടുകയോ, ആരെങ്കിലും നിങ്ങളുടെ മുഖത്ത് അടിക്കുകയോ ചെയ്താൽ, നിങ്ങൾ അത് സഹിക്കുന്നുവല്ലോ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളിൽനിന്ന് പിടിച്ചെടുക്കുകയോ’; ഗ്രീക്കിൽ ‘എടുക്കുന്നു’ എന്നു മാത്രമാണ്. സന്ദർഭത്തിൽ ഇത് ചൂഷണപരമായ എടുക്കലിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ അത് പൊറുക്കുന്നുവല്ലോ’ അല്ലെങ്കിൽ ‘നിങ്ങൾ അത് ക്ഷമയോടെ സഹിക്കുന്നുവല്ലോ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: നിങ്ങൾ അത് സഹിക്കുന്നുവല്ലോ
  rationale: വർത്തമാനകാല ക്രിയ കൊരിന്ത്യർ യഥാർഥത്തിൽ ഈ ദുരുപയോഗം സഹിച്ചുകൊണ്ടിരിക്കുന്നുവെന്ന പരിഹാസാത്മക ശാസന പ്രകടമാക്കുന്നു. ‘സഹിക്കുന്നു’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർഥവ്യാപ്തിയുള്ളതുമാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യവുമായി ഈ വാക്യത്തിനുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: καταδουλοῖ
  choice: അടിമകളാക്കുന്നു
  rationale: അടിമത്തത്തിലേക്കോ പൂർണ അധീനതയിലേക്കോ കൊണ്ടുവരുക എന്ന ശക്തമായ അർഥം മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
- source_word: κατεσθίει
  choice: വിഴുങ്ങുന്നു
  rationale: ചൂഷണത്തെ സൂചിപ്പിക്കുന്ന ഇരപിടിത്തത്തിന്റെ സജീവ രൂപകം നിലനിർത്തുന്നു.
- source_word: λαμβάνει
  choice: നിങ്ങളിൽനിന്ന് പിടിച്ചെടുക്കുന്നു
  rationale: λαμβάνει എന്നതിന്റെ വിശാലമായ ‘എടുക്കുന്നു’ എന്ന അർഥവും സന്ദർഭത്തിലെ ചൂഷണസ്വഭാവവും പ്രകടമാക്കുന്നു; പണമോ സ്വത്തോ എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἐπαίρεται
  choice: അഹങ്കാരത്തോടെ സ്വയം ഉയർത്തുന്നു
  rationale: സ്വയം ഉയർത്തൽ എന്ന പ്രതിഫലനാർഥവും അതിലെ ധാർഷ്ട്യവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: നിങ്ങളുടെ മുഖത്തടിക്കുന്നു
  rationale: മുഖത്ത് പ്രഹരിക്കുന്നതെന്ന മൂർത്തമായ അപമാനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; വെറും കൈയടി എന്നതിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: εἴ τις
  choice: ആരെങ്കിലും
  rationale: ഓരോ കുറ്റത്തിനുമുമ്പുള്ള ആവർത്തിത സോപാധിക ഘടന നിലനിർത്തി വാക്യത്തിന്റെ വാഗ്മിതാബലം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വാക്യത്തിലെ പരിഹാസാത്മക ശാസന
  choice: ദുരുപയോഗം ചെയ്യുന്നവരെ ഈ വാക്യത്തിൽ പ്രത്യേക പേരിട്ട് വിളിക്കാതെ, കൊരിന്ത്യർ അവരുടെ പ്രവൃത്തികൾ സഹിക്കുന്നതിനെ പരിഹാസാത്മകമായി ശാസിക്കുന്ന രൂപം നിലനിർത്തി.
  alternative: ‘കള്ളയപ്പൊസ്തലന്മാർ’ അല്ലെങ്കിൽ ‘കള്ളഉപദേഷ്ടാക്കൾ’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: സന്ദർഭം അത്തരം വ്യക്തികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ ഗ്രീക്ക് വാക്യം അവരുടെ ദുരുപയോഗപ്രവൃത്തികളെയാണ് നിരത്തുന്നത്; വ്യക്തമായ ലേബൽ ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ വ്യാഖ്യാനപരമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആവർത്തിക്കുന്ന ‘ആരെങ്കിലും’ ഘടനയും പ്രവൃത്തികളുടെ കഠിനതയും പൗലോസിന്റെ പരിഹാസാത്മക വാഗ്മിതിയും നിലനിർത്തിയിരിക്കുന്നു.
