    issue: ‘പ്രശംസിക്കുന്നു/പ്രശംസിക്കും’ is semantically ambiguous and commonly denotes praising rather than boasting.
    rationale: καυχῶνται and καυχήσομαι refer to boasting, specifically self-boasting in this context. ‘ആത്മപ്രശംസ ചെയ്യുക’ expresses this meaning in clear modern standard Malayalam and preserves the rhetorical repetition.
  revised_text: പലരും ജഡപ്രകാരം ആത്മപ്രശംസ ചെയ്യുന്നതിനാൽ[a], ഞാനും ആത്മപ്രശംസ ചെയ്യും.
