  edition: SBLGNT
  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: ml
  text: പലരും ജഡപ്രകാരം ആത്മപ്രശംസ ചെയ്യുന്നതിനാൽ[a], ഞാനും ആത്മപ്രശംസ ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മാനുഷിക മാനദണ്ഡപ്രകാരം” അല്ലെങ്കിൽ “വെറും മനുഷ്യരീതിയിൽ.”
    reason: κατὰ σάρκα എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ അർത്ഥവികല്പങ്ങൾ വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἐπεὶ
  choice: എന്നതിനാൽ
  rationale: പൗലൊസിന്റെ തുടർന്നുള്ള പരിഹാസാത്മകമായ തീരുമാനത്തിന് കാരണമെന്തെന്ന് സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πολλοὶ
  choice: പലരും
  rationale: അളവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പരിഭാഷ.
- source_word: καυχῶνται
  choice: പ്രശംസിക്കുന്നു
  rationale: സന്ദർഭത്തിലെ ആത്മപ്രശംസയെയും വാദാത്മക-പരിഹാസഭാവത്തെയും ഉൾക്കൊള്ളുന്നു; തുടർന്നുള്ള καυχήσομαι-യുമായി ഒരേ ധാതുവിന്റെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: σάρξ എന്ന പൗലൊസിന്റെ അർത്ഥസമ്പന്നമായ പദം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്ന മാനുഷിക മാനദണ്ഡപ്രകാരമുള്ള അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καί + ἐγώ എന്ന ഊന്നലോടെയുള്ള സമാന്തരത സ്വാഭാവിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: καυχήσομαι
  choice: പ്രശംസിക്കും
  rationale: ഭാവികാലവും മുൻക്രിയയുമായുള്ള പദാവർത്തനവും നിലനിർത്തി പൗലൊസിന്റെ പ്രഖ്യാപിത വാഗ്‌രീതിയെ പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: κατὰ σάρκα എന്ന പ്രയോഗത്തിലെ σάρξ-ന്റെ പരിഭാഷ
  choice: ജഡപ്രകാരം
  alternative: മാനുഷിക മാനദണ്ഡപ്രകാരം; വെറും മനുഷ്യരീതിയിൽ
  rationale: ഇവിടെ ശാരീരിക ദേഹമോ ‘പാപസ്വഭാവം’ എന്ന പ്രത്യേക വ്യാഖ്യാനമോ മാത്രമല്ല, മാനുഷികവും ലോകികവുമായ അടിസ്ഥാനങ്ങളാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും പൗലൊസിന്റെ അർത്ഥസമ്പന്നമായ ‘ജഡം’ എന്ന ഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജഡപ്രകാരം’ എന്ന ബൈബിൾപരമായ സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ അപരിചിതത്വം അടിക്കുറിപ്പിലൂടെ പരിഹരിച്ചിരിക്കുന്നു.
