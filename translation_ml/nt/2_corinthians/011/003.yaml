id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: ml
  text: 'എന്നാൽ, സർപ്പം തന്റെ കൗശലത്താൽ ഹവ്വയെ വഞ്ചിച്ചതുപോലെ, മശീഹയോടുള്ള[c] ആത്മാർഥതയും[a] നിർമലതയും[b] വിട്ട് നിങ്ങളുടെ ചിന്തകൾ ഏതെങ്കിലും വിധത്തിൽ ദുഷിച്ചുപോകുമോ എന്നു ഞാൻ ഭയപ്പെടുന്നു.


    [a] “ആത്മാർഥത” എന്നതിന് “ലാളിത്യം” എന്നോ “ഏകമനസ്സോടെയുള്ള ഭക്തി” എന്നോ അർഥമാകാം.


    [b] ചില കൈയെഴുത്തുപ്രതികളിൽ “നിർമലതയും” ഇല്ല.


    [c] ഗ്രീക്കിൽ “ക്രിസ്തോസ്”; അതിന്റെ അർഥം “മശീഹ” എന്നാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആത്മാർഥത” എന്നതിന് “ലാളിത്യം” എന്നോ “ഏകമനസ്സോടെയുള്ള ഭക്തി” എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിർമലതയും” ഇല്ല.
    reason: textual_variant
  - marker: c
    text: ഗ്രീക്കിൽ “ക്രിസ്തോസ്”; അതിന്റെ അർഥം “മശീഹ” എന്നാണ്.
    reason: source_term
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: എന്നാൽ ... ഏതെങ്കിലും വിധത്തിൽ ... മോ എന്നു ഞാൻ ഭയപ്പെടുന്നു
  rationale: തുടർന്നുനിൽക്കുന്ന ആശങ്കയും μή πως അവതരിപ്പിക്കുന്ന ഭയാശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ὄφις
  choice: സർപ്പം
  rationale: ഉല്പത്തി വിവരണത്തിലേക്കുള്ള സൂചനയും ഗൗരവമുള്ള ബൈബിൾ ഭാഷാശൈലിയും നിലനിർത്തുന്നു.
- source_word: ἐξηπάτησεν
  choice: വഞ്ചിച്ചു
  rationale: ക്രിയയുടെ വഞ്ചനാഭാവം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഉപസർഗത്തിന്റെ ഊന്നൽ കൃത്രിമമായി വികസിപ്പിക്കുന്നില്ല.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: തന്റെ കൗശലത്താൽ
  rationale: πανουργία സൂചിപ്പിക്കുന്ന കപടബുദ്ധിയെയും മാർഗം/ഉപാധി എന്ന ബന്ധത്തെയും മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: നിങ്ങളുടെ ചിന്തകൾ ... ദുഷിച്ചുപോകുമോ
  rationale: νόημα എന്നതിലെ ചിന്ത/മാനസികധാരണ എന്ന അർഥവും φθαρῇ എന്നതിലെ ഹാനികരമായ ദുഷിപ്പും നിലനിർത്തുന്നു.
- source_word: τῆς ἁπλότητος
  choice: ആത്മാർഥത
  rationale: ഈ സന്ദർഭത്തിലെ കപടമില്ലാത്ത, വിഭജിക്കപ്പെടാത്ത സമർപ്പണം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ലാളിത്യം, ഏകമനസ്സോടെയുള്ള ഭക്തി എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: καὶ τῆς ἁγνότητος
  choice: നിർമലതയും
  rationale: ἁγνότης എന്നതിന്റെ വിശാലമായ നൈതിക-ഭക്തിപരമായ നിർമലത നിലനിർത്തുന്നു; ലൈംഗികശുദ്ധിയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: മശീഹയോടുള്ള
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശാബദ്ധമായ സമർപ്പണബന്ധം സ്വാഭാവികമായി നൽകുകയും Χριστός എന്ന പദവിയുടെ അർഥം പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστόν എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός മശീഹാപദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം പരിഭാഷപ്പെടുത്തി; പരിചിതമായ ഗ്രീക്ക് രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἁπλότης എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ആത്മാർഥത
  alternative: ലാളിത്യം / ഏകമനസ്സോടെയുള്ള ഭക്തി
  rationale: വാക്യം മശീഹയോടുള്ള കപടമില്ലാത്ത, അവിഭക്തമായ സമർപ്പണത്തിൽനിന്നുള്ള വ്യതിചലനത്തെക്കുറിച്ചാണ്; എന്നാൽ പദത്തിന്റെ യഥാർഥ ബഹുവ്യഞ്ജകത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: καὶ τῆς ἁγνότητος ഉൾപ്പെടുത്തൽ
  choice: പ്രധാന പാഠത്തിൽ “നിർമലതയും” ഉൾപ്പെടുത്തി
  alternative: വാക്കുകൾ ഒഴിവാക്കുന്ന ഹ്രസ്വവായന
  rationale: SBLGNT ഈ വാക്കുകൾ പ്രധാന പാഠത്തിൽ ഉൾക്കൊള്ളുന്നതിനാൽ പരിഭാഷയിലും ഉൾപ്പെടുത്തി; ചില കൈയെഴുത്തുപ്രതികളിലെ അഭാവം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പുനഃക്രമീകരിച്ചിട്ടുണ്ടെങ്കിലും താരതമ്യം, ആശങ്ക, ദുഷിപ്പിന്റെ സാധ്യത, മശീഹയിലേക്കുള്ള ദിശാബദ്ധമായ ആത്മാർഥതയും നിർമലതയും എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
