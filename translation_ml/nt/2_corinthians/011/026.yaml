  terminology: ‘വിജാതീയർ’ is a standard contextually appropriate rendering for ἔθνη in this contrast. ‘വ്യാജസഹോദരന്മാർ’ is a close, gender-accurate rendering of ψευδάδελφοι and avoids forcing a more interpretive reading into the text. Footnotes accurately present the stated lexical alternatives.
