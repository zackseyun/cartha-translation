source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: ml
  text: പലപ്പോഴും യാത്രകളിൽ; നദികളിൽനിന്നുള്ള അപകടങ്ങളിൽ, കള്ളന്മാരിൽനിന്നുള്ള അപകടങ്ങളിൽ, എന്റെ സ്വന്തം ജനത്തിൽനിന്നുള്ള[a] അപകടങ്ങളിൽ, വിജാതീയരിൽനിന്നുള്ള അപകടങ്ങളിൽ, നഗരത്തിലെ അപകടങ്ങളിൽ, വിജനപ്രദേശത്തെ അപകടങ്ങളിൽ, കടലിലെ അപകടങ്ങളിൽ, വ്യാജസഹോദരന്മാരുടെ ഇടയിലെ[b] അപകടങ്ങളിൽ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘എന്റെ സ്വന്തം വംശത്തിൽനിന്നുള്ള’ അഥവാ ‘എന്റെ സ്വന്തം ജനതയിൽനിന്നുള്ള.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘[എന്റെ] വംശം/ജനവിഭാഗം’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘വ്യാജവിശ്വാസികളുടെ ഇടയിലെ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വ്യാജസഹോദരന്മാരുടെ ഇടയിൽ’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: പലപ്പോഴും യാത്രകളിൽ
  rationale: ആവർത്തിച്ചുള്ള യാത്രകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; കഷ്ടതകളുടെ പട്ടികയെന്ന ഘടനയും നിലനിർത്തുന്നു.
- source_word: κινδύνοις
  choice: അപകടങ്ങളിൽ
  rationale: ഓരോ ഘടകത്തിലും പദം ആവർത്തിച്ച് ഗ്രീക്കിലെ സഞ്ചിതമായ ആലങ്കാരിക താളം പരമാവധി നിലനിർത്തുന്നു.
- source_word: ποταμῶν
  choice: നദികളിൽനിന്നുള്ള
  rationale: അപകടത്തിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്നു; വെള്ളപ്പൊക്കമോ നദി കടക്കലോ എന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ അതു തുറന്നുവെക്കുന്നു.
- source_word: λῃστῶν
  choice: കള്ളന്മാരിൽനിന്നുള്ള
  rationale: യാത്രാസന്ദർഭത്തിൽ λῃσταί എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἐκ γένους
  choice: എന്റെ സ്വന്തം ജനത്തിൽനിന്നുള്ള
  rationale: പൗലോസിന്റെ സ്വന്തം വംശീയ ജനവിഭാഗത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും തുടർന്നുള്ള ἐξ ἐθνῶν എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐξ ἐθνῶν
  choice: വിജാതീയരിൽനിന്നുള്ള
  rationale: സ്വന്തം ജനത്തോടു വൈരുധ്യമായി വരുന്ന ἔθνη എന്ന പദത്തിന്റെ യഹൂദരല്ലാത്ത ജനങ്ങൾ എന്ന സന്ദർഭാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐν πόλει
  choice: നഗരത്തിലെ
  rationale: ഏകവചനത്തിലുള്ള പൊതുവായ സ്ഥലസൂചന നിലനിർത്തുന്നു.
- source_word: ἐν ἐρημίᾳ
  choice: വിജനപ്രദേശത്തെ
  rationale: ἐρημία എന്നത് മരുഭൂമിയെയോ ജനവാസമില്ലാത്ത പ്രദേശത്തെയോ സൂചിപ്പിക്കാം; 'വിജനപ്രദേശം' ഈ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐν θαλάσσῃ
  choice: കടലിലെ
  rationale: സമുദ്രയാത്രയിലോ കടലിലോ നേരിട്ട അപകടം എന്ന ആശയം അധിക വിശദീകരണം ചേർക്കാതെ നൽകുന്നു.
- source_word: ἐν ψευδαδέλφοις
  choice: വ്യാജസഹോദരന്മാരുടെ ഇടയിലെ
  rationale: പദത്തിന്റെ അക്ഷരാർഥമായ 'വ്യാജ സഹോദരന്മാർ' നിലനിർത്തുന്നു; അവർ വിശ്വാസികളായി അവകാശപ്പെട്ടവരാണെന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ψευδαδέλφοις എന്ന പദത്തിലെ ലിംഗവും സഭാസംബന്ധമായ സൂചനയും
  choice: വ്യാജസഹോദരന്മാരുടെ ഇടയിലെ
  alternative: വ്യാജവിശ്വാസികളുടെ ഇടയിലെ
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനവും അക്ഷരാർഥത്തിൽ 'വ്യാജസഹോദരന്മാർ' എന്നുമാണ്. 'വിശ്വാസികൾ' എന്നത് സാധ്യമായ സന്ദർഭവ്യാഖ്യാനമാണെങ്കിലും മുഖ്യപാഠത്തിൽ അതു നിർബന്ധമാക്കുന്നില്ല.
- issue: ἐξ ἐθνῶν എന്നത് ἐκ γένους എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ
  choice: വിജാതീയരിൽനിന്നുള്ള
  alternative: യഹൂദരല്ലാത്തവരിൽനിന്നുള്ള
  rationale: സ്വന്തം ജനവിഭാഗത്തിനു പുറത്തുള്ള ജനങ്ങളെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും സന്ദർഭോചിതവുമായ പദം സ്വീകരിക്കുന്നു; കൂടുതൽ വിശദമായ പരാവർത്തനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ഗ്രീക്കിലെ κινδύνοις എന്ന ആവർത്തനം ‘അപകടങ്ങളിൽ’ എന്നു ഓരോ ഘടകത്തിലും നിലനിർത്തി പട്ടികയുടെ ശക്തമായ താളം സംരക്ഷിച്ചു. വാക്യം അടുത്ത ഘടകത്തിലേക്കു തുടരുന്ന പട്ടികാഭാഗമായതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിൽ [a] യാത്രകൾക്കു ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ കുറിപ്പ് ἐκ γένους എന്നതിന്റേതായതിനാൽ മലയാള മുഖ്യപാഠത്തിൽ ബന്ധപ്പെട്ട പദത്തിനു ശേഷമാണ് അടയാളം വെച്ചത്.
