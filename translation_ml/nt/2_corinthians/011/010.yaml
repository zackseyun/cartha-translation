id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: ml
  text: മശീഹയുടെ സത്യം എന്നിലുള്ളതുപോലെ ഉറപ്പായി, അഖായയിലെ പ്രദേശങ്ങളിൽ എന്റെ ഈ അഭിമാനപ്രസ്താവം തടയപ്പെടുകയില്ല[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ സത്യം എന്നിലുള്ളതുപോലെ ഉറപ്പായി.”
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “എന്റെ ഈ അഭിമാനപ്രസ്താവം തടയപ്പെടുകയില്ല” അല്ലെങ്കിൽ “എന്റെ ഈ അഭിമാനപ്രസ്താവം അടച്ചുകളയപ്പെടുകയില്ല.” ഗ്രീക്ക് പ്രയോഗം രൂപകാത്മകവും ദുഷ്കരവുമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “എന്നെ സംബന്ധിച്ച ഈ അഭിമാനപ്രസ്താവം മൗനമാക്കപ്പെടുകയില്ല.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: മശീഹയുടെ സത്യം
  rationale: 'ജനിറ്റീവ് ഘടനയിലെ ബന്ധം/ഉടമസ്ഥതാഭാവം നിലനിർത്തുന്നു: മശീഹയോടു ചേർന്നതോ മശീഹയ്ക്കുള്ളതോ ആയ സത്യം.'
- source_word: ἐν ἐμοὶ
  choice: എന്നിൽ
  rationale: പൗലോസിന്റെ ഗൗരവമുള്ള ഉറപ്പുപറച്ചിലിനെ അധികമായി വ്യാഖ്യാനിക്കാതെ സ്ഥലസൂചകമായ മൂലരൂപം നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എത്ര ഉറപ്പോ
  rationale: ഇവിടെ ὅτι ഒരു ഗൗരവമുള്ള ഉറപ്പുപറച്ചിലിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ കാരണാർഥം വരാതെ ശപഥസദൃശമായ ബലം സ്വാഭാവികമായി അറിയിക്കാൻ ഈ പ്രയോഗം ഉപയോഗിച്ചു.
- source_word: καύχησις
  choice: പ്രശംസ
  rationale: സ്വയം സംബന്ധിച്ച് അഭിമാനത്തോടെ പറയുന്നതെന്ന സന്ദർഭാർഥം നൽകുന്നു; അമിതമായി നിഷേധാത്മകമായ ‘പൊങ്ങച്ചം’ ഒഴിവാക്കുന്നു.
- source_word: φραγήσεται
  choice: തടയപ്പെടുകയില്ല
  rationale: φράσσω എന്നതിലെ അടച്ചുകളയുക/തടയുക എന്ന രൂപകവും ഭാവികാല കർമണിപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: εἰς ἐμὲ
  choice: എന്റെ ഈ പ്രശംസ
  rationale: ദുഷ്കരമായ ഗ്രീക്ക് ബന്ധപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗമായി അവതരിപ്പിക്കുന്നു; പൗലോസിനെ സംബന്ധിച്ച ഈ പ്രശംസ എന്ന അർഥം സൂക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: അഖായയിലെ പ്രദേശങ്ങളിൽ
  rationale: κλίμασι എന്ന ബഹുവചനത്തിലെ പ്രദേശങ്ങൾ/മേഖലകൾ എന്ന സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: Ἀχαΐας
  choice: അഖായ
  rationale: റോമൻ പ്രവിശ്യയുടെ പേരിന്റെ മലയാളത്തിലെ നേരിട്ടുള്ള ലിപ്യന്തരണം.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός പദവിനാമബലം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ പര്യായമായി സൂക്ഷിച്ചു.
- issue: ἀλήθεια Χριστοῦ എന്ന ജനിറ്റീവ് ബന്ധം
  choice: മശീഹയുടെ സത്യം
  alternative: മശീഹയിലുള്ള സത്യം
  rationale: മശീഹയുടേതായതോ മശീഹയുമായി അവിഭാജ്യമായി ബന്ധപ്പെട്ടതോ ആയ സത്യം എന്ന തുറന്ന ബന്ധം നിലനിർത്തി; അതിനെ ‘മശീഹയിലുള്ള സത്യം’ എന്നു മാത്രം നിർണയിച്ചില്ല.
- issue: പൗലോസിന്റെ ഉറപ്പുപറച്ചിലിന്റെ സ്വഭാവം
  choice: എത്ര ഉറപ്പോ
  alternative: എന്നിൽ ഉള്ളതിനാൽ
  rationale: ὅτιയെ കാരണാർഥമായി വായിച്ച് ദൈവശാസ്ത്രപരമായ കാരണം സൃഷ്ടിക്കാതെ, ഗ്രീക്കിലെ ശപഥസദൃശമായ ഉറപ്പിന്റെ ബലം മലയാളത്തിൽ പ്രകടമാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളെങ്കിലും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ശൈലി. ഗ്രീക്കിലെ ശപഥസദൃശമായ ഘടനയെ വാക്കിന് വാക്കായി അസ്വാഭാവികമാക്കാതെ ‘എത്ര ഉറപ്പോ’ എന്നു പുനരാവിഷ്കരിച്ചു. ‘തടയപ്പെടുകയില്ല’ എന്ന കർമണിപ്രയോഗം മൂലത്തിലെ ഭാവികാല കർമണിരൂപവും തടസ്സപ്പെടുത്തൽ എന്ന രൂപകവും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
