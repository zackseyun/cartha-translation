  text: χωρὶς τῶν παρεκτὸς ἡ ⸀ἐπίστασίς ⸀μοι ἡ καθ’ ἡμέραν, ἡ μέριμνα πασῶν τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: ml
  text: മറ്റു കാര്യങ്ങൾക്കു പുറമേ[a], ദിവസേന എനിക്കുള്ള സമ്മർദം—എല്ലാ സഭകളെക്കുറിച്ചുമുള്ള ആശങ്കയാണ്[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മറ്റു കാര്യങ്ങൾക്കു പുറമേ’ എന്നതിനു ‘പറയാതെവിട്ട കാര്യങ്ങൾക്കു പുറമേ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ ദിവസേനയുള്ള ഭാരം’ എന്നും ‘ദിവസേന എന്നെ ഞെരുക്കുന്നത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘എല്ലാ സഭകളെക്കുറിച്ചുമുള്ള കരുതൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: മറ്റു കാര്യങ്ങൾക്കു പുറമേ
  rationale: χωρίς സഹിതമുള്ള παρεκτός എന്ന പ്രയോഗം മുമ്പു വിവരിച്ച കഷ്ടതകൾക്കു പുറമേയുള്ളതോ പറയാതെവിട്ടതോ ആയ കാര്യങ്ങളെ സൂചിപ്പിക്കാം. ‘മറ്റു കാര്യങ്ങൾക്കു പുറമേ’ ഈ പരിധി തുറന്നുവെക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി മുൻപത്തെ പട്ടികയുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐπίστασίς μοι
  choice: സമ്മർദം എനിക്കുണ്ട്
  rationale: ἐπίστασις ഇവിടെ അക്ഷരാർഥത്തിലുള്ള ജനത്തിരക്കിനെക്കാൾ ഒരാളിന്മേൽ വന്നുചേരുന്ന ഭാരമോ സമ്മർദമോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു. μοι-യുടെ അനുഭവപരമായ ഭാവം ‘എനിക്കുണ്ട്’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἡ καθ’ ἡμέραν
  choice: ദിവസേനയുള്ള
  rationale: καθ’ ἡμέραν ഓരോ ദിവസവും ആവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ദിവസേനയുള്ള’ എന്നത് ἐπίστασις-നെ സ്വാഭാവികമായി വിശേഷിപ്പിക്കുന്നു.
- source_word: ἡ μέριμνα
  choice: കരുതൽ
  rationale: μέριμνα കരുതൽ, ആശങ്ക, ഉത്കണ്ഠ എന്നീ ഭാവങ്ങൾ വഹിക്കാം. ഇവിടെ സഭകളോടുള്ള പൗലോസിന്റെ ഉത്തരവാദിത്വബോധവും മാനസികഭാരവും പ്രകടമാക്കാൻ ‘കരുതൽ’ യോജിക്കുന്നു; ദോഷകരമായ വേവലാതി എന്ന വിധി അതിൽ നിർബന്ധമായി ചുമത്തപ്പെടുന്നില്ല.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: എല്ലാ സഭകളെയുംകുറിച്ചുള്ള
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἐκκλησίαι ക്രിസ്തീയസഭകളെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്. μέριμνα-യോടുള്ള ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ ‘സഭകളെയുംകുറിച്ചുള്ള കരുതൽ’ എന്ന് സ്വാഭാവികമായി വരുന്നു.
theological_decisions:
- issue: μέριμνα സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ഇടയപരമായ ഭാരം
  choice: ‘കരുതൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഉത്കണ്ഠ’ അല്ലെങ്കിൽ ‘ആശങ്ക’
  rationale: വാക്യം പൗലോസിന്റെ അപ്പൊസ്തലികവും ഇടയപരവുമായ ഭാരത്തെയാണ് വിവരിക്കുന്നത്; അതിനെ പാപകരമായ വേവലാതിയായി വിധിക്കുന്നില്ല. ‘കരുതൽ’ ഉത്തരവാദിത്വവും മാനസികഭാരവും ഉൾക്കൊള്ളുന്നു; ‘ഉത്കണ്ഠ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘സഭ’ സ്ഥാപിതമായ പുതിയനിയമ പദപ്രയോഗമായി നിലനിർത്തി. മൂലവാക്യത്തിലെ സമാസാധിഷ്ഠിത ഘടന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘എന്ന’ ചേർത്തെങ്കിലും, കരുതലും ദിവസേനയുള്ള സമ്മർദവും തമ്മിലുള്ള വിശദീകരണബന്ധം നിലനിർത്തി.
