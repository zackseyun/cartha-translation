id: 2CO.11.30
reference: 2 Corinthians 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: ml
  text: വീമ്പു പറയേണ്ടിവന്നാൽ, എന്റെ ബലഹീനതയുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ വീമ്പു പറയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ സ്വാഭാവികമായി: ‘എന്റെ ബലഹീനതകളെക്കുറിച്ച് ഞാൻ വീമ്പു പറയും.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘എന്റെ ബലഹീനതയുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ വീമ്പു പറയും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: ആണെങ്കിൽ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാസൂചക രൂപം നിലനിർത്തുന്നു; ‘ആയതിനാൽ’ എന്ന കാരണാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: καυχᾶσθαι
  choice: പ്രശംസിക്കുക
  rationale: പൗലോസിന്റെ വാചാടോപപരവും വിരോധാഭാസപരവുമായ ‘boasting’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δεῖ
  choice: വേണ്ടതാണ്
  rationale: അനിവാര്യതയെയോ നിർബന്ധത്തെയോ സൂചിപ്പിക്കുന്ന നിർവ്യക്തിക ക്രിയയുടെ ബലം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: എന്റെ ബലഹീനതയുമായി ബന്ധപ്പെട്ട കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന ആർട്ടിക്കിളും ഷഷ്ഠീവിഭക്തി പ്രയോഗവും സൂചിപ്പിക്കുന്ന ‘ബലഹീനതയോടു ബന്ധപ്പെട്ട കാര്യങ്ങൾ’ എന്ന അർഥം, വെറും ‘എന്റെ ബലഹീനതകൾ’ എന്നു ചുരുക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: ἀσθενείας
  choice: ബലഹീനത
  rationale: ശാരീരിക രോഗത്തിൽ മാത്രം ഒതുക്കാതെ, അപമാനകരമായ സാഹചര്യങ്ങളും പരിമിതികളും ഉൾക്കൊള്ളുന്ന പൗലോസിന്റെ വിശാലമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: καυχήσομαι
  choice: ഞാൻ പ്രശംസിക്കും
  rationale: ഭാവികാലരൂപം സ്വാഭാവികമായി നൽകുകയും ആദ്യത്തെ ക്രിയയുമായുള്ള വാചാടോപപരമായ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രശംസയുടെ സ്വഭാവം
  choice: ബലഹീനതയുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെക്കുറിച്ചുള്ള വിരോധാഭാസപരമായ പ്രശംസയായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘എന്റെ ബലഹീനതകളെക്കുറിച്ച് ഞാൻ പ്രശംസിക്കും’ എന്നു കൂടുതൽ സ്വതന്ത്രമായി പരിഭാഷപ്പെടുത്താം.
  rationale: സാധാരണ പ്രശംസയും ബലഹീനതയെ ആധാരമാക്കിയ പ്രശംസയും തമ്മിലുള്ള പൗലോസിന്റെ ഉദ്ദേശപൂർവമായ സംഘർഷം വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ അസാധാരണമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ വായനാസൗകര്യത്തോടെ സംരക്ഷിച്ച്, കൂടുതൽ സ്വാഭാവികമായ മലയാളരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
