revisions:
- from: പ്രശംസിക്കേണ്ടതാണെങ്കിൽ, എന്റെ ബലഹീനതയുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ പ്രശംസിക്കും.[a]
  to: വീമ്പു പറയേണ്ടിവന്നാൽ, എന്റെ ബലഹീനതയുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ വീമ്പു പറയും.[a]
  rationale: ‘വീമ്പു പറയേണ്ടിവന്നാൽ’ preserves the conditional and impersonal necessity of Εἰ καυχᾶσθαι δεῖ. Repeating ‘വീമ്പു പറയും’ renders the Greek rhetorical repetition. The main text retains the plural ‘കാര്യങ്ങൾ’ implied by τὰ while the footnote supplies the smoother idiomatic alternative.
