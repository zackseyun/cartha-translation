id: 2CO.11.14
reference: 2 Corinthians 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: ml
  text: അതിൽ അതിശയിക്കാനില്ല; കാരണം, സാത്താൻ തന്നേ പ്രകാശത്തിന്റെ ദൂതനായി വേഷംമാറുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രകാശത്തിന്റെ ദൂതനായി രൂപം മാറുന്നു.’ ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘രൂപം മാറുന്നു’ എന്നു പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് വഞ്ചനാപരമായ ബാഹ്യരൂപത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: അതിൽ അതിശയിക്കാനില്ല
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധവും ‘ഇത് ആശ്ചര്യകരമല്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥവും ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸς γὰρ ὁ Σατανᾶς
  choice: സാത്താൻതന്നെ ... എന്നല്ലോ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ ‘തന്നെ’കൊണ്ട് നിലനിർത്തുന്നു; γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ ‘എന്നല്ലോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετασχηματίζεται εἰς
  choice: ആയി വേഷംമാറുന്നു
  rationale: സന്ദർഭത്തിലെ വഞ്ചനാപരമായ ബാഹ്യരൂപധാരണം വ്യക്തമാക്കുന്നു; അതേസമയം പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥമായ ‘രൂപം മാറുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἄγγελον φωτός
  choice: പ്രകാശത്തിന്റെ ദൂതൻ
  rationale: ‘പ്രകാശത്തിന്റെ’ എന്ന ബന്ധരൂപം മൂലപാഠത്തിലെ genitive ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു; അതീന്ദ്രിയസന്ദർഭത്തിൽ ἄγγελος എന്നതിന് ‘ദൂതൻ’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: സാത്താന്റെ രൂപമാറ്റത്തിന്റെ സ്വഭാവം
  choice: വഞ്ചനാപരമായി പ്രകാശത്തിന്റെ ദൂതനെന്ന ഭാവം ധരിക്കൽ
  alternative: യഥാർഥത്തിൽ പ്രകാശത്തിന്റെ ദൂതനായി രൂപാന്തരപ്പെടൽ
  rationale: ഉടൻമുമ്പുള്ള വ്യാജ അപ്പൊസ്തലന്മാരുടെ വഞ്ചനാസന്ദർഭം ബാഹ്യമായ ഭാവമാറ്റത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും μετασχηματίζεται എന്ന പദം ‘രൂപം മാറുന്നു’ എന്നും വിവർത്തനം ചെയ്യാവുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘വേഷംമാറുന്നു’ സന്ദർഭത്തിലെ വഞ്ചന വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് മൂലപദത്തിന്റെ യഥാർഥ വിവർത്തനവ്യാപ്തി സംരക്ഷിക്കുന്നു.
