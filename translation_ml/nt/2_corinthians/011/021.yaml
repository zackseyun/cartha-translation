id: 2CO.11.21
reference: 2 Corinthians 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ml
  text: 'നാണക്കേടായിട്ടാണ് ഞാൻ പറയുന്നത്: ഞങ്ങൾ ബലഹീനരായിരുന്നുവെന്ന മട്ടിൽ.[a] എന്നാൽ, ആരെങ്കിലും ഏതെങ്കിലും കാര്യത്തിൽ ധൈര്യപ്പെടുന്നുവെങ്കിൽ—മൂഢതയോടെ ഞാൻ പറയുന്നു—അതിൽ ഞാനും ധൈര്യപ്പെടുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അപമാനത്തിന്റെ രീതിയിൽ ഞാൻ പറയുന്നു’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ നാണക്കേടായി ഞാൻ പറയുന്നു.’ ‘ഞങ്ങൾ ബലഹീനരായിരുന്നുവെന്ന മട്ടിൽ’ എന്നത് പൗലോസിന്റെ പരിഹാസാത്മകമായ പ്രസ്താവനയാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ആരെങ്കിലും ഏതിൽ ധൈര്യപ്പെടുന്നുവോ, അതിൽ ഞാനും ധൈര്യപ്പെടുന്നു.’ ചുറ്റുപാടിൽ പ്രശംസിക്കുന്നതിനെക്കുറിച്ചുള്ള ആശയം സൂചിതമാണ്.'
    reason: implicit_object
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: അപമാനത്തോടെ
  rationale: പദപ്രയോഗത്തിന്റെ അപമാനം/മാനംകേട് എന്ന ഭാവം നിലനിർത്തുന്നു; അത് ആരുടെ അപമാനമെന്നത് മൂലപാഠം പോലെ തുറന്നുവെക്കുന്നു.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: ഞങ്ങൾ ബലഹീനരായിരുന്നെന്നപോലെ
  rationale: ὡς ὅτι എന്ന താരതമ്യപരവും പരിഹാസാത്മകവുമായ ഭാവവും ἠσθενήκαμεν എന്ന പൂർണ്ണകാല ക്രിയയുടെ മുൻകാലസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: എന്നാൽ ആരെങ്കിലും ഏതൊരു കാര്യത്തിൽ ധൈര്യപ്പെടുന്നുവോ
  rationale: ἐν ᾧ എന്നത് ധൈര്യം പ്രകടിപ്പിക്കുന്ന വിഷയമോ മേഖലയോ ആയി പരിഭാഷപ്പെടുത്തി; 'പ്രശംസിക്കാൻ' എന്ന കർമം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ചേർത്തില്ല.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: ഞാൻ മൂഢതയോടെ സംസാരിക്കുകയാണ്
  rationale: പൗലോസിന്റെ ഇടയ്ക്കുള്ള സ്വയംബോധമുള്ള പ്രസ്താവനയെ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τολμῶ κἀγώ
  choice: അതിൽ ഞാനും ധൈര്യപ്പെടുന്നു
  rationale: മുൻപത്തെ τολμᾷ-യുമായുള്ള ആവർത്തനവും താരതമ്യവും സംരക്ഷിക്കുന്നു; 'അതിൽ' എന്നത് മലയാളത്തിലെ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ‘ബലഹീനത’യെക്കുറിച്ചുള്ള വാചാടോപപരമായ പരിഹാസം
  choice: ‘ഞങ്ങൾ ബലഹീനരായിരുന്നെന്നപോലെ’ എന്ന് പരിഹാസാത്മകമായ താരതമ്യം നിലനിർത്തി
  alternative: ‘ഞങ്ങൾ ബലഹീനരായിരുന്നു’ എന്ന നേരിട്ടുള്ള സമ്മതമായി പരിഭാഷപ്പെടുത്തുക
  rationale: സന്ദർഭം പൗലോസിന്റെ ‘മൂഢമായ’ പ്രശംസാപ്രസംഗമാണ്; ὡς ὅτι യഥാർഥ സമ്മതത്തേക്കാൾ പരിഹാസാത്മകമായ തോന്നലോ ആരോപണമോ സൂചിപ്പിക്കുന്നു. അപ്പൊസ്തലിക അധികാരത്തെക്കുറിച്ചുള്ള നിഗമനം പരിഭാഷയിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മൂലപാഠത്തിലെ വാചാടോപപരമായ ഇടവേള ഡാഷുകളാൽ നിലനിർത്തി; അപമാനത്തിന്റെ ബന്ധവും ‘ധൈര്യപ്പെടുക’ എന്ന ക്രിയയുടെ സൂചിത കർമവും അനാവശ്യമായി തീർപ്പാക്കിയിട്ടില്ല.
