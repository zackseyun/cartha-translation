revisions:
- from: 'അപമാനത്തോടെ ഞാൻ പറയുന്നു: ഞങ്ങൾ ബലഹീനരായിരുന്നെന്നപോലെ![a] എന്നാൽ ആരെങ്കിലും ഏതൊരു കാര്യത്തിൽ ധൈര്യപ്പെടുന്നുവോ—ഞാൻ മൂഢതയോടെ സംസാരിക്കുകയാണ്—അതിൽ ഞാനും ധൈര്യപ്പെടുന്നു.[b]'
  to: 'നാണക്കേടായിട്ടാണ് ഞാൻ പറയുന്നത്: ഞങ്ങൾ ബലഹീനരായിരുന്നുവെന്ന മട്ടിൽ.[a] എന്നാൽ, ആരെങ്കിലും ഏതെങ്കിലും കാര്യത്തിൽ ധൈര്യപ്പെടുന്നുവെങ്കിൽ—മൂഢതയോടെ ഞാൻ പറയുന്നു—അതിൽ ഞാനും ധൈര്യപ്പെടുന്നു.[b]'
