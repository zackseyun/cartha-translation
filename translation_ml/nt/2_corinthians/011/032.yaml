source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: ml
  text: ദമസ്കൊസിൽ, അരേതാസ് രാജാവിന്റെ കീഴിലുള്ള ജനാധിപൻ എന്നെ പിടികൂടാനായി ദമസ്കൊസുകാരുടെ നഗരം[a] കാവൽ ചെയ്യുകയായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദമസ്കൊസ് നഗരം.’ ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി ‘ദമസ്കൊസുകാരുടെ നഗരം’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: ദമസ്കൊസിൽ
  rationale: ἐν സഹിതമുള്ള സ്ഥലസൂചക ദത്തിവ് സ്വാഭാവികമായി ‘ദമസ്കൊസിൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐθνάρχης
  choice: ജനാധിപൻ
  rationale: ഒരു ജനവിഭാഗത്തിന്റെയോ പ്രദേശത്തിന്റെയോ മേൽ അധികാരമുള്ള ചരിത്രപരമായ പദവി സൂചിപ്പിക്കാൻ പൊതുവായ ‘ഭരണാധികാരി’ എന്നതിനെക്കാൾ പ്രത്യേകത നിലനിർത്തുന്ന മലയാളപദം തെരഞ്ഞെടുത്തു.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: അരേതാസ് രാജാവിന്റെ കീഴിലുള്ള
  rationale: ജനാധിപൻ അരേതാസ് രാജാവിനോടു ബന്ധപ്പെട്ടവനോ അദ്ദേഹത്തിന്റെ അധികാരത്തിൻ കീഴിൽ സേവിക്കുന്നവനോ ആണെന്ന ഷഷ്ഠീബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഉടമസ്ഥത മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: ἐφρούρει
  choice: കാവൽ ചെയ്യുകയായിരുന്നു
  rationale: അപൂർണ്ണ ഭൂതകാലക്രിയയുടെ തുടർച്ചയായ പ്രവർത്തനഭാവവും നിരീക്ഷണ-സുരക്ഷാഭാവവും നിലനിർത്തുന്നു.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: ദമസ്കൊസുകാരുടെ നഗരം
  rationale: ‘ദമസ്കൊസുകാരുടെ നഗരം’ എന്ന ഗ്രീക്കിലെ ബഹുവചന ഷഷ്ഠീപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πιάσαι με
  choice: എന്നെ പിടികൂടാൻ
  rationale: ക്രിയയുടെ ഉദ്ദേശ്യാർഥം നിലനിർത്തുകയും നിയമപരമായ അറസ്റ്റാണെന്ന് അധികമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
