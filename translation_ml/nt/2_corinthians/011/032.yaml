  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചരിത്രപരമായ ἐθνάρχης എന്ന പദവിയുടെ പ്രത്യേകത നിലനിർത്താൻ ‘ജനാധിപൻ’ ഉപയോഗിച്ചു; അപരിചിതത്വം ഉണ്ടായാലും പൊതുവായ ‘ഭരണാധികാരി’ എന്നു സമതലപ്പെടുത്തുന്നത് ഒഴിവാക്കി.
