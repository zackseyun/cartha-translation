reference: 2 Corinthians 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ml
  text: 'വീണ്ടും ഞാൻ പറയുന്നു: ആരും എന്നെ ബുദ്ധിയില്ലാത്തവനെന്നു കരുതരുത്; അല്ലെങ്കിൽ, ബുദ്ധിയില്ലാത്തവനെന്നപോലെയെങ്കിലും എന്നെ സ്വീകരിക്കൂ, അങ്ങനെ ഞാനും അല്പമെങ്കിലും പ്രശംസിച്ചുപറയട്ടെ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആരും എന്നെ ബുദ്ധിയില്ലാത്തവനായി കരുതരുത് … ബുദ്ധിയില്ലാത്തവനായി എന്നെ സ്വീകരിക്കൂ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ബുദ്ധിയില്ലാത്ത’ എന്നർഥമുള്ള ഗ്രീക്ക് നാമവിശേഷണം (ἄφρων) ഇവിടെ നാമമായി (‘ബുദ്ധിയില്ലാത്തവൻ’) അല്ലെങ്കിൽ വിശേഷണമായി (‘ബുദ്ധിയില്ലാത്തവനായി’) ഗ്രഹിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: വീണ്ടും ഞാൻ പറയുന്നു
  rationale: പൗലോസ് തന്റെ അഭ്യർഥന ആവർത്തിക്കുന്നതിനെ സ്വാഭാവികവും നേരിട്ടുമുള്ള മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: ആരും എന്നെ ബുദ്ധിയില്ലാത്തവനെന്നു കരുതരുത്
  rationale: μή + subjunctive എന്ന വിലക്കിന്റെ ഭാവവും δοκέω + infinitive എന്ന ‘കരുതുക’ എന്ന അർഥവും നിലനിർത്തുന്നു; ἄφρων ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമവിശേഷണമായി സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
- source_word: εἰ δὲ μή γε
  choice: അങ്ങനെ കരുതാതിരിക്കാൻ കഴിയുന്നില്ലെങ്കിൽ
  rationale: മുൻ അഭ്യർഥന അവർ അംഗീകരിക്കാത്ത പക്ഷം എന്ന സാന്ദർഭിക അർഥം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്തമായ വ്യവസ്ഥയെ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: ബുദ്ധിയില്ലാത്തവനെയെന്നപോലെയെങ്കിലും എന്നെ സ്വീകരിക്കൂ
  rationale: κἄν എന്നതിലെ ‘എങ്കിലും/കുറഞ്ഞപക്ഷം’ എന്ന concessive ഊന്നലും δέχομαι എന്നതിലെ സ്വീകരിക്കുക എന്ന നേരിട്ടുള്ള ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: ഞാനും അല്പം പ്രശംസിച്ചുപറയേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവം, κἀγώയിലെ ‘ഞാനും’ എന്ന ഊന്നൽ, μικρόν τι എന്ന പരിധി, καυχάομαιയുടെ പ്രശംസിച്ചുപറയുക/പുകഴ്ത്തിപ്പറയുക എന്ന വാചാടോപപരമായ അർഥം എന്നിവ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄφρων എന്ന പദത്തിലൂടെയുള്ള പൗലോസിന്റെ പരിഹാസാത്മക സ്വയംവിവരണം
  choice: ‘ബുദ്ധിയില്ലാത്തവൻ’ എന്ന ഭാഷയും ‘പ്രശംസിച്ചുപറയുക’ എന്ന ആശയവും മൃദൂകരിക്കാതെ നിലനിർത്തി
  alternative: ‘വിവേകമില്ലാതെ സംസാരിക്കുന്നവൻ’ എന്നിങ്ങനെ പരാവർത്തനം ചെയ്യുക
  rationale: പൗലോസ് പ്രശംസാപ്രസംഗത്തിന്റെ ഭോഷത്വസദൃശമായ ഭാവം താൽക്കാലികമായി ഏറ്റെടുക്കുന്ന വാചാടോപപരമായ സംഘർഷം വാക്യത്തിന്റെ ഭാഗമാണ്; വിവർത്തനം അത് പരിഹരിക്കുകയോ മങ്ങിക്കുകയോ ചെയ്യരുത്.
- issue: ἄφρων നാമമായോ നാമവിശേഷണമായോ ഗ്രഹിക്കാവുന്നത്
  choice: മുഖ്യപാഠത്തിൽ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘ബുദ്ധിയില്ലാത്തവൻ’ എന്ന രൂപം
  alternative: ‘ബുദ്ധിയില്ലാത്തവനായി/ബുദ്ധിയില്ലാത്തവനെന്ന നിലയിൽ’ എന്ന വിശേഷണാത്മക രൂപം
  rationale: ഗ്രീക്കിൽ ഇരു നിർമാണസാധ്യതകളും ഉണ്ട്; മലയാളത്തിലെ മുഖ്യവാക്യത്തിൽ വ്യക്തിസൂചക രൂപം സ്വാഭാവികമാണ്, എന്നാൽ പാദക്കുറിപ്പിൽ യഥാർഥമായ ഭാഷാപരമായ വ്യത്യാസം രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പൗലോസിന്റെ ആവർത്തിച്ച അഭ്യർഥനയും പരിഹാസാത്മകമായ പ്രശംസാപ്രസംഗത്തിന്റെ സംഘർഷവും സംരക്ഷിച്ചു; അനാവശ്യമായ സഭാവിഭാഗപരമായ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
