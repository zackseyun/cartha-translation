  text: Five times I received from the Jews forty lashes less one[a][b].
translation:
  language: ml
  text: യെഹൂദന്മാരിൽനിന്ന് അഞ്ചു പ്രാവശ്യം ഞാൻ നാൽപ്പതിൽ ഒന്നു കുറവായ ചാട്ടവാറടികൾ ഏറ്റു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: ‘നാൽപ്പതിൽ ഒന്ന് കുറവ്’; അതായത് മുപ്പത്തൊൻപത് ചാട്ടവാറടികൾ.'
    reason: lexical_alternative
  - marker: b
    text: ‘യെഹൂദന്മാരാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ശിക്ഷയുടെ കർത്താക്കളെയോ ഉറവിടത്തെയോ ഗ്രീക്ക് സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഏതെങ്കിലും പ്രത്യേക ഭരണസ്ഥാപനത്തെ വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: യെഹൂദന്മാരിൽനിന്ന്
  rationale: ὑπό + ഷഷ്ഠീവിഭക്തി വ്യക്തികളായ കർത്താക്കളെയോ ശിക്ഷയുടെ ഉറവിടത്തെയോ സൂചിപ്പിക്കുന്നു. ഔദ്യോഗിക ഭരണസമിതിയെന്ന് മൂലപാഠത്തിലില്ലാത്തത് കൂട്ടിച്ചേർക്കാതെ ഈ രൂപം ആ ബന്ധം നിലനിർത്തുന്നു.
- source_word: πεντάκις
  choice: അഞ്ചു പ്രാവശ്യം
  rationale: ആവർത്തിച്ച് അഞ്ചുതവണ സംഭവിച്ചതെന്ന ക്രിയാവിശേഷണത്തിന്റെ നേരായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: നാൽപ്പതിൽ ഒന്നു കുറവ് ചാട്ടവാറടി
  rationale: ‘നാൽപ്പതിൽ ഒന്നു കുറവ്’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സൂചിതമായ അടികളുടെ ആശയം വ്യക്തതയ്ക്കായി ‘ചാട്ടവാറടി’ എന്നു ചേർക്കുന്നു.
- source_word: ἔλαβον
  choice: ഞാൻ ... ഏറ്റു
  rationale: ശിക്ഷ അനുഭവിക്കുക എന്ന സന്ദർഭത്തിലെ λαμβάνωയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായും മൂലത്തിലെ സ്വീകരിക്കൽ എന്ന വാചകചിത്രം നിലനിർത്തിയും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘യെഹൂദന്മാർ’ എന്നത് മൂലപാഠത്തിലെ പൊതുപദം നിലനിർത്തുന്നു; ‘യെഹൂദ അധികാരികൾ’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കി. അടിക്കായി ‘ചാട്ടവാറടി’ ഉപയോഗിച്ച് ശിക്ഷയുടെ സ്വഭാവം സാധാരണ വായനക്കാരന് വ്യക്തമായി.
