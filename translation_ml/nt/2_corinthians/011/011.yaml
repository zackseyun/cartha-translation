  text: Why? Because I do not love you? God knows I do.
translation:
  language: ml
  text: എന്തുകൊണ്ട്? ഞാൻ നിങ്ങളെ സ്നേഹിക്കാത്തതുകൊണ്ടോ? ദൈവത്തിനറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, സന്ദർഭം വ്യക്തമാക്കിക്കൊണ്ട്: “ഞാൻ നിങ്ങളെ സ്നേഹിക്കുന്നുവെന്ന് ദൈവത്തിനറിയാം.” ഗ്രീക്കിൽ അക്ഷരാർഥമായി “ദൈവം അറിയുന്നു” എന്നുമാത്രമാണ്; വാചാടോപപരമായ ചോദ്യത്തിനുള്ള പരോക്ഷ ഉത്തരം പ്രസ്താവിച്ചിട്ടില്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: എന്തുകൊണ്ട്?
  rationale: കാരണത്തെക്കുറിച്ചുള്ള സംക്ഷിപ്തമായ ചോദ്യം; ഗ്രീക്കിലെ വാചാടോപപരമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: —തുകൊണ്ടോ?
  rationale: മുൻപത്തെ ‘എന്തുകൊണ്ട്?’ എന്ന ചോദ്യത്തിന് സാധ്യതയുള്ള കാരണം വാചാടോപപരമായ മറുചോദ്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ സ്നേഹിക്കാത്തത്
  rationale: നിഷേധവും ഒന്നാംപുരുഷ കർത്താവും ബഹുവചന കർമവും നേരിട്ട് നിലനിർത്തുന്നു; ἀγαπάω എന്നതിന് സാധാരണമായ ‘സ്നേഹിക്കുക’ ഉപയോഗിക്കുന്നു.
- source_word: ὁ θεὸς οἶδεν
  choice: ദൈവത്തിനറിയാം
  rationale: ഗ്രീക്കിൽ പറഞ്ഞിരിക്കുന്നത് ‘ദൈവം അറിയുന്നു’ എന്നത്രമാത്രമാണ്; സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപ്രയോഗം തിരഞ്ഞെടുക്കുന്നു.
theological_decisions:
- issue: അവസാനവാക്യത്തിൽ സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘ഞാൻ നിങ്ങളെ സ്നേഹിക്കുന്നുവെന്ന്’ എന്ന ഉത്തരം തുറന്നുപറയണമോ
  choice: ദൈവത്തിനറിയാം.
  alternative: ഞാൻ നിങ്ങളെ സ്നേഹിക്കുന്നുവെന്ന് ദൈവത്തിനറിയാം.
  rationale: ὁ θεὸς οἶδεν എന്ന ഗ്രീക്ക് വാചകം അറിവിന്റെ വിഷയം വ്യക്തമാക്കാതെ വിടുന്നു. മുൻചോദ്യത്തിൽനിന്ന് അനുകൂലമായ ഉത്തരം ഗ്രഹിക്കാമെങ്കിലും, അത് മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലത്തിലെ സംക്ഷിപ്തതയും യഥാർഥമായ പരോക്ഷതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവത്തിനറിയാം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലത്തിലെ ലഘുതയും പരോക്ഷതയും നിലനിർത്തുന്നു.
