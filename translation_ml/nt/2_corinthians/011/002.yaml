id: 2CO.11.2
reference: 2 Corinthians 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: ml
  text: ദൈവത്തിന്റെ അസൂയയോടെ[a] ഞാൻ നിങ്ങളെക്കുറിച്ച് അസൂയപ്പെടുന്നു. കാരണം, നിങ്ങളെ നിർമലയായ ഒരു കന്യകയായി മശീഹായ്ക്ക്[b] സമർപ്പിക്കാനായി, ഒരേയൊരു ഭർത്താവിന് ഞാൻ നിങ്ങളെ വിവാഹനിശ്ചയം ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവികമായ അസൂയയോടെ.” ഗ്രീക്ക് പ്രയോഗത്തിന് ദൈവത്തിന്റേതായ അസൂയ എന്നോ ദൈവിക സ്വഭാവമുള്ള അസൂയ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ, “ക്രിസ്തുവിന്.” ഗ്രീക്ക്: “മശീഹായ്ക്ക്.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: ζηλῶ
  choice: ഞാൻ നിങ്ങളെക്കുറിച്ച് അസൂയപ്പെടുന്നു
  rationale: ക്രിയയ്ക്ക് തീക്ഷ്ണതയെന്നും അസൂയയെന്നും അർഥമാകാം. വിവാഹനിശ്ചയത്തിന്റെ രൂപകം ദൈവിക ഉടമ്പടിയോടു ബന്ധപ്പെട്ട സംരക്ഷണപരമായ അസൂയയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അസൂയപ്പെടുന്നു’ നിലനിർത്തുന്നു.
- source_word: θεοῦ ζήλῳ
  choice: ദൈവത്തിന്റേതായ അസൂയയോടെ
  rationale: θεοῦ എന്ന ഷഷ്ഠീവിഭക്തി അസൂയ ദൈവത്തിന്റേതാണെന്നോ ദൈവിക സ്വഭാവമുള്ളതാണെന്നോ അർഥമാക്കാം. മുഖ്യപാഠം ഉടമസ്ഥതാസാധ്യത നേരിട്ട് നിലനിർത്തുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἡρμοσάμην
  choice: വിവാഹനിശ്ചയം ചെയ്തിരിക്കുന്നു
  rationale: വിവാഹത്തിനായി ഒരാളോട് ബന്ധിപ്പിക്കുകയോ വാഗ്ദാനം ചെയ്യുകയോ ചെയ്യുന്നതാണ് സന്ദർഭാർത്ഥം. പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള ബന്ധം മലയാളത്തിലെ ഈ രൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἑνὶ ἀνδρὶ
  choice: ഒരേയൊരു ഭർത്താവിന്
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമുണ്ടെങ്കിലും വധു-വിവാഹ രൂപകത്തിൽ ‘ഭർത്താവ്’ സന്ദർഭോചിതമാണ്; ἑνί സൂചിപ്പിക്കുന്ന ഏകത്വം ‘ഒരേയൊരു’ വ്യക്തമാക്കുന്നു.
- source_word: παρθένον ἁγνὴν
  choice: നിർമലയായ ഒരു കന്യകയായി
  rationale: കന്യകാത്വത്തിന്റെയും വിശുദ്ധിയുടെയും വധുരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു. ‘നിർമല’ ആധുനികവും ഗൗരവമുള്ളതുമായ പദമാണ്.
- source_word: παραστῆσαι
  choice: സമർപ്പിക്കേണ്ടതിന്
  rationale: ഒരാളുടെ മുമ്പാകെ കൊണ്ടുവന്ന് ഏല്പിക്കുകയോ ഹാജരാക്കുകയോ ചെയ്യുന്ന ഔപചാരിക ആശയം വിവാഹരൂപകത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ Χριστῷ
  choice: മശീഹായ്ക്ക്
  rationale: നിർദ്ദിഷ്ട ആർട്ടിക്കിളും വരന്റെ രൂപകവും Χριστός ഇവിടെ അഭിഷിക്തനായവന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നുവെന്ന് സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘മശീഹാ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ‘അസൂയ’യുടെ സ്വഭാവം
  choice: ദൈവത്തിന്റേതായ ഉടമ്പടി-അസൂയയെ പ്രതിഫലിപ്പിക്കുന്ന സംരക്ഷണപരമായ അസൂയ
  alternative: ദൈവികബന്ധസൂചനയില്ലാത്ത പൗലോസിന്റെ വ്യക്തിപരമായ തീക്ഷ്ണത
  rationale: θεοῦ ζήλῳ എന്ന പ്രയോഗവും ഏകഭർത്താവിനോടുള്ള വിവാഹരൂപകവും ദൈവത്തിന്റെ ഉടമ്പടി-ഏകാഗ്രതയിലേക്കു സൂചിപ്പിക്കുന്നു. അതിനെ വെറും ‘തീക്ഷ്ണത’യായി മൃദൂകരിക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός വരനായി തിരിച്ചറിയപ്പെടുന്ന സ്ഥാനപ്പേരാണ്; അതിനാൽ ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു. സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. വിവാഹനിശ്ചയം, ഏകഭർത്താവ്, കന്യക, സമർപ്പണം എന്നീ പരസ്പരം ബന്ധിച്ച രൂപകങ്ങൾ സംരക്ഷിച്ചു; അസൂയ എന്ന അസൗകര്യമുള്ളെങ്കിലും പ്രധാനപ്പെട്ട ആശയം വ്യാഖ്യാനിച്ച് നീക്കിയില്ല.
