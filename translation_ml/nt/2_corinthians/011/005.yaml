id: 2CO.11.5
reference: 2 Corinthians 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: ml
  text: കാരണം, ആ അതിശ്രേഷ്ഠരായ അപ്പൊസ്തലന്മാരെക്കാൾ ഞാൻ ഒട്ടും പിന്നിലായിട്ടില്ലെന്നാണ് ഞാൻ കരുതുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഏറ്റവും പ്രമുഖരായ അപ്പൊസ്തലന്മാർ.” ഗ്രീക്ക് പ്രയോഗം പരിഹാസത്തോടെ “അതിശ്രേഷ്ഠരായ അപ്പൊസ്തലന്മാർ” എന്നോ, വളരെ ആദരിക്കപ്പെട്ട അപ്പൊസ്തലന്മാരെ നേരിട്ട് സൂചിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: എന്റെ വിലയിരുത്തൽ
  rationale: ചിന്തിച്ചുനോക്കി എത്തുന്ന നിഗമനം എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുകയും പിന്തുണയ്ക്കുകയും ചെയ്യുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: μηδὲν
  choice: ഒട്ടും ... അല്ല
  rationale: ക്രിയാവിശേഷണപരമായ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑστερηκέναι
  choice: താഴ്ന്നവനല്ല
  rationale: മറ്റുള്ളവരുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ കുറവോ അധമത്വമോ ഇല്ലെന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ആ “അതിശ്രേഷ്ഠ അപ്പൊസ്തലന്മാരെക്കാൾ”
  rationale: ὑπερλίαν എന്നതിന്റെ അതിരുകടന്ന ശ്രേഷ്ഠതാഭാവവും സന്ദർഭത്തിലെ സാധ്യതയുള്ള പരിഹാസവും ഉദ്ധരണിച്ചിഹ്നങ്ങളിലൂടെ സൂചിപ്പിക്കുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων എന്നത് പൗലൊസിന്റെ എതിരാളികളെ പരിഹസിച്ച് പറയുന്നതാണോ, അതോ പ്രമുഖ അപ്പൊസ്തലന്മാരെ നേരാർഥത്തിൽ സൂചിപ്പിക്കുന്നതാണോ
  choice: സാധ്യതയുള്ള പരിഹാസം നിലനിർത്താൻ “അതിശ്രേഷ്ഠ അപ്പൊസ്തലന്മാർ” എന്നു നൽകി.
  alternative: “ഏറ്റവും പ്രമുഖരായ അപ്പൊസ്തലന്മാർ” എന്ന നേരാർഥ വായന.
  rationale: ഉടൻമുൻപും പിന്നാലെയും ഉള്ള സന്ദർഭം എതിരാളികളായ ശുശ്രൂഷകരോടുള്ള വാദപ്രതിവാദത്തെ സൂചിപ്പിക്കുന്നു; എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന് നേരാർഥ വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലൊസിന്റെ വാദാത്മക ഊന്നൽ നിലനിർത്തി; അപൂർവമായ പദാനുപദ ഘടന ഒഴിവാക്കി. “അപ്പൊസ്തലൻ” എന്ന വ്യാപകമായി പരിചിതമായ ബൈബിൾപദം ഉപയോഗിച്ചു.
