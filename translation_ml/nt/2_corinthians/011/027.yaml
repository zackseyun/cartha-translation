source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: ml
  text: അധ്വാനത്തിലും കഷ്ടപ്പാടിലും, പലപ്പോഴും ഉറക്കമില്ലാതെ, വിശപ്പിലും ദാഹത്തിലും, പലപ്പോഴും ഉപവാസങ്ങളിൽ[a], തണുപ്പിലും മതിയായ വസ്ത്രമില്ലായ്മയിലും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പലപ്പോഴും ഉപവാസങ്ങളിൽ’ എന്നതിന് ‘ആവർത്തിച്ച ഭക്ഷണവിലക്കുകളിൽ’ എന്നും അർഥമാകാം. ഇവ സ്വമേധയാ അനുഷ്ഠിച്ച ഉപവാസങ്ങളായിരുന്നോ സാഹചര്യങ്ങൾ അടിച്ചേൽപ്പിച്ച ഭക്ഷണവിലക്കുകളായിരുന്നോ എന്ന് ഗ്രീക്ക് പാഠം വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘നഗ്നതയിൽ.’ ഇവിടെ തണുപ്പിൽനിന്ന് സംരക്ഷിക്കാൻ മതിയായ വസ്ത്രമില്ലാത്ത അവസ്ഥയായിരിക്കാം ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: അധ്വാനത്തിലും
  rationale: κόπος കഠിനമായ അധ്വാനത്തെയും പ്രയത്നത്തെയും സൂചിപ്പിക്കുന്നു. തുടർന്നുവരുന്ന സമാനാർഥപദത്തിൽനിന്നുള്ള വ്യത്യാസവും പട്ടികയുടെ താളവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: μόχθῳ
  choice: കഷ്ടപ്പാടിലും
  rationale: μόχθος അധ്വാനത്തോടൊപ്പം അനുഭവിക്കുന്ന ക്ലേശത്തിന്റെയും ദുരിതത്തിന്റെയും ഭാവം നൽകുന്നു; അതിനാൽ κόπος എന്നതുമായി ചേർന്നുള്ള ആവർത്തനാത്മക ഊന്നൽ സമാനപദങ്ങളാക്കി നിരപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: പലപ്പോഴും ഉറക്കമില്ലാതെ
  rationale: ἀγρυπνία ഉറക്കമില്ലായ്മയെയോ ഉണർന്നിരിക്കേണ്ടിവരുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ആവർത്തിച്ച അനുഭവം പ്രകടമാക്കുന്ന രൂപമാണിത്; അതിന്റെ കാരണം വാചകം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: വിശപ്പിലും ദാഹത്തിലും
  rationale: ഇവ സഹിച്ച അവസ്ഥകളെയാണ് ഈ ദ്വന്ദ്വപ്രയോഗം സൂചിപ്പിക്കുന്നത്. ആവർത്തിക്കുന്ന ἐν ഘടന മലയാളത്തിലെ ‘-ഇലും’ രൂപങ്ങളിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν νηστείαις πολλάκις
  choice: പലപ്പോഴും ഉപവാസങ്ങളിൽ
  rationale: νηστεία ഉപവാസത്തെ സൂചിപ്പിക്കുന്നു; മുമ്പുള്ള λιμός ‘വിശപ്പ്’ എന്നതിനാൽ രണ്ടും ഒരേ അർഥമാക്കി മാറ്റുന്നില്ല. ഉപവാസങ്ങൾ സ്വമേധയാ ആയിരുന്നോ സാഹചര്യങ്ങൾ അടിച്ചേൽപ്പിച്ചതായിരുന്നോ എന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐν ψύχει
  choice: തണുപ്പിലും
  rationale: ψῦχος സഹിച്ച തണുത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; പട്ടികയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: γυμνότητι
  choice: മതിയായ വസ്ത്രമില്ലായ്മയിലും
  rationale: γυμνότης അക്ഷരാർഥത്തിൽ നഗ്നതയായിരിക്കാം; എന്നാൽ ദുരിതങ്ങളുടെ ഈ പട്ടികയിൽ തണുപ്പിനോടു ചേർന്നുവരുന്നതിനാൽ ആവശ്യമായ വസ്ത്രമില്ലാത്ത അവസ്ഥ എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു. കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: νηστείαις എന്ന പദത്തിന്റെ അർഥം
  choice: ഉപവാസങ്ങളിൽ
  alternative: ഭക്ഷണം ലഭിക്കാതെയുള്ള പട്ടിണി അഥവാ നിർബന്ധിത ഭക്ഷണവിലക്ക്
  rationale: ഗ്രീക്ക് പദം സാധാരണയായി ഉപവാസത്തെ സൂചിപ്പിക്കുകയും λιμός ഇതിനകം വിശപ്പിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. എന്നാൽ ഇവ സ്വമേധയാ അനുഷ്ഠിച്ച മതപരമായ ഉപവാസങ്ങളാണെന്ന് വിവർത്തനം ഉറപ്പിക്കുന്നില്ല; അവ്യക്തത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: γυμνότητι എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: മതിയായ വസ്ത്രമില്ലായ്മയിൽ
  alternative: നഗ്നതയിൽ
  rationale: തണുപ്പിനോടു ചേർന്നുള്ള ദുരിതപ്പട്ടികയിൽ കാലാവസ്ഥയിൽനിന്ന് സംരക്ഷിക്കാൻ വേണ്ട വസ്ത്രമില്ലാത്ത അവസ്ഥയാണ് സാധ്യതയേറിയ സന്ദർഭാർഥം. എങ്കിലും അക്ഷരാർഥമായ ‘നഗ്നത’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ദുരിതപ്പട്ടികയായി വിവർത്തനം ചെയ്തു. ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന ἐν ഘടന സാധ്യമായിടത്ത് ‘-ഇലും’ രൂപങ്ങളിലൂടെ സൂക്ഷിച്ചു; അസ്വാഭാവികമായ നാമവൽക്കരണം ഒഴിവാക്കാൻ ἀγρυπνίαις എന്നത് ‘ഉറക്കമില്ലാതെ’ എന്നു നൽകി. ഉപവാസത്തിന്റെയും വസ്ത്രമില്ലായ്മയുടെയും സന്ദർഭപരമായ അവ്യക്തതകൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
