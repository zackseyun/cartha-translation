  terminology: ‘അവസരം’ appropriately preserves the neutral lexical choice and visible repetition of ἀφορμή. ‘മുറിച്ചുകളയുക’ suitably retains the metaphor. The footnote’s ‘ഒഴികഴിവ്’ and ‘സന്ദർഭം’ are valid alternatives; ‘പഴുത്’ is also possible but need not be added.
