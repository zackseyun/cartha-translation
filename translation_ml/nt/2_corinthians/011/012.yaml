id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ഇപ്പോൾ ചെയ്യുന്നത് തുടർന്നും ചെയ്യും; അവസരം തേടുന്നവരുടെ അവസരം മുറിച്ചുകളയാനും, അവർ അഭിമാനിക്കുന്ന കാര്യത്തിൽ അവരും ഞങ്ങൾ ഉള്ളതുപോലെ കണ്ടെത്തപ്പെടേണ്ടതിനുമാണ് ഇത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അവസരം’ എന്നതിന്റെ രണ്ടു പ്രയോഗങ്ങൾക്കും ‘ഒഴികഴിവ്’ എന്നോ ‘സന്ദർഭം’ എന്നോ പരിഭാഷപ്പെടുത്താം (ഗ്രീക്ക്: ἀφορμή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: എന്നാൽ ഞാൻ ഇപ്പോൾ ചെയ്യുന്നത് തുടർന്നും ചെയ്യും
  rationale: വർത്തമാനകാലവും ഭാവികാലവും ചേർന്ന പ്രയോഗം പൗലോസ് ഇപ്പോൾ പിന്തുടരുന്ന രീതി തുടരാനുള്ള ദൃഢനിശ്ചയം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി അതു വ്യക്തമാക്കുന്നു.
- source_word: ἐκκόψω
  choice: മുറിച്ചുകളയാനും
  rationale: മൂലപദത്തിലെ ശക്തമായ ‘മുറിച്ചുനീക്കുക’ എന്ന രൂപകം നിലനിർത്തുകയും ഇവിടെ അവസരം ഇല്ലാതാക്കുക എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀφορμή
  choice: അവസരം
  rationale: ഈ പദത്തിന് അവസരം, സന്ദർഭം, കാരണം/ഒഴികഴിവ് എന്നീ അർഥസാധ്യതകളുണ്ട്. പ്രധാനപാഠത്തിലെ ‘അവസരം’ നിഷ്പക്ഷമായ വിശാല അർഥം നിലനിർത്തുന്നു; കൂടുതൽ ആരോപണാത്മകമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῶν θελόντων ἀφορμήν
  choice: അവസരം തേടുന്നവരുടെ അവസരം
  rationale: ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് എതിരാളികൾ ഒരു പഴുത് തേടുന്നു എന്ന മൂർച്ചയുള്ള പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: ἐν ᾧ καυχῶνται
  choice: അവർ അഭിമാനിക്കുന്ന കാര്യത്തിൽ
  rationale: അവരുടെ അഭിമാനത്തിന്റെ വിഷയമോ മേഖലയോ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: അവരും ഞങ്ങളെപ്പോലെത്തന്നെയാണെന്ന് തെളിയേണ്ടതിന്
  rationale: εὑρεθῶσιν എന്ന ദൈവവാച്യത്തിന്റെ ‘കണ്ടെത്തപ്പെടുക/തെളിയുക’ എന്ന ആശയവും പൗലോസിനോടും സഹപ്രവർത്തകരോടുമുള്ള താരതമ്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ എതിരാളികൾ തേടുന്ന ἀφορμήയുടെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ നിഷ്പക്ഷമായി ‘അവസരം’
  alternative: ‘ഒഴികഴിവ്’, ‘പഴുത്’, അല്ലെങ്കിൽ ‘സന്ദർഭം’
  rationale: സന്ദർഭം വിമർശനാത്മകമാണെങ്കിലും ἀφορμή എന്ന നാമം സ്വതവേ വഞ്ചനാപരമായ ‘ഒഴികഴിവ്’ എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠം അവ്യക്തത സംരക്ഷിക്കുകയും കൂടുതൽ പ്രതികൂലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ‘അവസരം’ എന്ന ആവർത്തനവും ‘മുറിച്ചുകളയുക’ എന്ന രൂപകവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
