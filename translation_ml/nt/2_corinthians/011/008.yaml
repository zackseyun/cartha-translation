translation:
  language: ml
  text: നിങ്ങളെ സേവിക്കുന്നതിനായി മറ്റു സഭകളിൽനിന്ന് സഹായധനം സ്വീകരിച്ചുകൊണ്ട് ഞാൻ അവയെ കൊള്ളയടിച്ചു.[a]
  philosophy: optimal-equivalence
