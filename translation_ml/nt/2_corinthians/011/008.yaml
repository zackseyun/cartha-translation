    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: മറ്റു സഭകളെ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἐκκλησία സാധാരണയായി പ്രാദേശിക ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘സഭകൾ’ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദമാണ്.
- source_word: ἐσύλησα
  choice: കൊള്ളയടിച്ചു
  rationale: സുലάω എന്ന ശക്തമായ ക്രിയയുടെ കൊള്ളയിടുക/കവർന്നെടുക്കുക എന്ന മൂർച്ചയും പൗലോസിന്റെ ഉദ്ദേശപൂർവമായ അതിശയോക്തിപരമായ വിരോധാഭാസവും ഇത് നിലനിർത്തുന്നു.
- source_word: λαβὼν
  choice: സ്വീകരിച്ചുകൊണ്ട്
  rationale: 'ഏഒറിസ്റ്റ് കൃദന്തം മുഖ്യക്രിയയുമായി ഉപാധി/രീതി എന്ന ബന്ധം പുലർത്തുന്നു: മറ്റു സഭകളിൽനിന്ന് സഹായം സ്വീകരിച്ചതിലൂടെയാണ് അവരെ ‘കൊള്ളയടിച്ചു’ എന്നു പൗലോസ് പറയുന്നത്.'
- source_word: ὀψώνιον
  choice: സഹായധനം
  rationale: പദം അടിസ്ഥാനമായി കൂലി അല്ലെങ്കിൽ വേതനം സൂചിപ്പിക്കുമെങ്കിലും, ഇവിടെ ശുശ്രൂഷയ്ക്കായി ലഭിച്ച സാമ്പത്തിക സഹായമാണ് സന്ദർഭാർത്ഥം. ‘സഹായധനം’ തൊഴിൽകരാർ എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കി അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: നിങ്ങളെ സേവിക്കുന്നതിനായി
  rationale: πρός + accusative ഇവിടെ ഉദ്ദേശ്യം/ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. ‘നിങ്ങളെ സേവിക്കുന്നതിനായി’ എന്നത് പൗലോസാണ് കൊരിന്ത്യരെ സേവിക്കുന്നത് എന്നു സന്ദർഭാനുസൃതമായി വ്യക്തവും സ്വാഭാവികവുമായി പറയുന്നു.
theological_decisions:
- issue: മറ്റു സഭകളിൽനിന്ന് സാമ്പത്തിക സഹായം സ്വീകരിച്ചതിനെക്കുറിച്ചുള്ള പൗലോസിന്റെ വാക്കുകളുടെ ആലങ്കാരിക ശക്തി
  choice: ‘ഞാൻ മറ്റു സഭകളെ കൊള്ളയടിച്ചു’ എന്ന പ്രകോപനപരമായ രൂപകം അതിശയോക്തിയും വിരോധാഭാസവുമായി നിലനിർത്തി.
  alternative: ‘ഞാൻ മറ്റു സഭകളിൽനിന്ന് സഹായം വാങ്ങി’ അല്ലെങ്കിൽ ‘മറ്റു സഭകൾക്ക് നഷ്ടമുണ്ടാക്കി’ എന്നു മൃദൂകരിക്കുക.
  rationale: ഗ്രീക്ക് ക്രിയ ഉദ്ദേശപൂർവം ശക്തമാണ്. സന്ദർഭം യഥാർഥ മോഷണത്തെക്കുറിച്ചല്ല, കൊരിന്ത്യരിൽ ശുശ്രൂഷ ചെയ്യുമ്പോൾ മറ്റു സഭകളിൽനിന്ന് സഹായം സ്വീകരിച്ചതിനെക്കുറിച്ചാണ്. അതിനാൽ രൂപകം മൃദൂകരിക്കുന്നത് പൗലോസിന്റെ സ്വയംതാഴ്ത്തുന്ന പരിഹാസത്തിന്റെ മൂർച്ച നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കൊള്ളയടിച്ചു’ എന്ന ശക്തമായ രൂപം മൂലപാഠത്തിന്റെ ആലങ്കാരിക മൂർച്ച സംരക്ഷിക്കുന്നു; ‘സഹായധനം’ സന്ദർഭാർത്ഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
