id: 2CO.11.1
reference: 2 Corinthians 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: ml
  text: എന്റെ ഈ അല്പം ഭോഷത്വം നിങ്ങൾ സഹിച്ചിരുന്നെങ്കിൽ എന്നു ഞാൻ ആഗ്രഹിക്കുന്നു[a]. എന്നാൽ, എന്നെ സഹിക്കൂ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അല്പം മൂഢത.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്നെ പൊറുക്കൂ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: എന്നു ഞാൻ ആശിക്കുന്നു
  rationale: നടക്കണമെന്ന ആഗ്രഹം പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് അവ്യയത്തിന്റെ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: സഹിച്ചിരുന്നെങ്കിൽ / സഹിക്കൂ
  rationale: ἀνέχομαι എന്ന ക്രിയയുടെ ‘ക്ഷമയോടെ സഹിക്കുക’ എന്ന ബന്ധപരമായ അർഥം നിലനിർത്തുകയും, ആവർത്തിച്ച അഭ്യർഥന മലയാളത്തിലും ആവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: μου
  choice: എന്റെ / എന്നെ
  rationale: ആദ്യ പ്രയോഗത്തിൽ ἀφροσύνης-നോടു ബന്ധപ്പെടുത്തി ‘എന്റെ ഭോഷത്വം’ എന്നും, രണ്ടാം പ്രയോഗത്തിൽ ക്രിയയുടെ കർമമായി ‘എന്നെ’ എന്നും മലയാള വ്യാകരണത്തിന് സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
- source_word: μικρόν τι
  choice: അല്പം
  rationale: പൗലോസിന്റെ മിതോക്തി സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: ἀφροσύνης
  choice: ഭോഷത്വം
  rationale: മൂഢമായ പെരുമാറ്റമോ സംസാരമോ എന്ന ആശയം ഔപചാരികവും ഗ്രഹിക്കാവുന്നതുമായ മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിലെ ആത്മനിന്ദാപരമായ വിരോധാഭാസം നിലനിർത്തുന്നു.
- source_word: ἀλλὰ καὶ
  choice: അതെ
  rationale: മുൻ ആഗ്രഹത്തെ ശക്തിപ്പെടുത്തി നേരിട്ടുള്ള അഭ്യർഥനയായി പുനരാരംഭിക്കുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; യാന്ത്രികമായ ‘എന്നാൽ കൂടിയും’ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പൗലോസ് തന്റെ വരാനിരിക്കുന്ന വാദത്തെ ‘ഭോഷത്വം’ എന്നു വിശേഷിപ്പിക്കുന്നത്
  choice: ആത്മനിന്ദാപരമായ വാചാടോപമായി ‘ഭോഷത്വം’ നിലനിർത്തി
  alternative: അല്പം മൂഢത / അല്പം വിവേകശൂന്യത
  rationale: തുടർന്നുള്ള വിരോധാഭാസപരമായ പ്രശംസാവചനങ്ങൾക്ക് തുടക്കമിടുന്ന വാചാടോപപരമായ സംഘർഷം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആദ്യവാക്യത്തിലെ ആശംസാഭാവവും രണ്ടാം വാക്യത്തിലെ ശക്തിപ്പെടുത്തിയ നേരിട്ടുള്ള അഭ്യർഥനയും വേർതിരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
