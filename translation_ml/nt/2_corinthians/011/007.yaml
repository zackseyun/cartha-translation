id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, നിങ്ങൾ ഉയർത്തപ്പെടേണ്ടതിന് എന്നെത്തന്നെ താഴ്ത്തിക്കൊണ്ട്, ദൈവത്തിന്റെ സുവിശേഷം നിങ്ങൾക്കു പ്രതിഫലം വാങ്ങാതെ ഞാൻ പ്രസംഗിച്ചതിനാൽ, ഞാൻ പാപം ചെയ്തുവോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ഒരു പാപം ചെയ്തുവോ?” ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ “ഒരു പാപം ചെയ്തു/ഉണ്ടാക്കി” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കൂലി വാങ്ങാതെ” അല്ലെങ്കിൽ “സൗജന്യമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദത്തോടു ബന്ധിപ്പിച്ചുള്ള മൂർച്ചയുള്ള മറ്റൊരു സാധ്യതയായ വാചാടോപചോദ്യം അവതരിപ്പിക്കുന്നു.
- source_word: ἁμαρτίαν ἐποίησα
  choice: ഞാൻ പാപം ചെയ്തുവോ
  rationale: ഗ്രീക്കിലെ ‘പാപം ചെയ്തു/ഉണ്ടാക്കി’ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; ധാർമിക ഗൗരവവും ചോദ്യത്തിന്റെ പരിഹാസസ്വരവും നിലനിർത്തുന്നു.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: എന്നെത്തന്നെ താഴ്ത്തിക്കൊണ്ട്
  rationale: പ്രതിഫലനാർഥവും പൗലോസിന്റെ താഴ്ത്തലും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: നിങ്ങൾ ഉയർത്തപ്പെടേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും ταπεινόω–ὑψόω എന്ന നില/മാന വിപരീതതയും സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: …പ്രസംഗിച്ചതിനാൽ
  rationale: സങ്കൽപ്പിത ‘പാപത്തിന്റെ’ കാരണമോ അടിസ്ഥാനമോ മലയാളത്തിലെ കാരണപ്രത്യയംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: δωρεὰν
  choice: പ്രതിഫലം വാങ്ങാതെ
  rationale: ഈ സാഹചര്യത്തിലെ സാമ്പത്തിക അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘സൗജന്യമായി’ എന്നതിന്റെ വാണിജ്യഛായ ഒഴിവാക്കുന്നു.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: ദൈവത്തിന്റെ സുവിശേഷം
  rationale: ജനിറ്റീവ് ഘടനയും പൗലോസിന്റെ പരിചിതമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: നിങ്ങൾക്കു … പ്രസംഗിച്ചു
  rationale: സുവിശേഷം അറിയിച്ച പ്രവർത്തിയെ സാധാരണ വായനക്കാർക്കു സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രീതിയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സാമ്പത്തിക പിന്തുണയും പൗലോസിന്റെ സ്വയംതാഴ്ത്തലും സംബന്ധിച്ച വാചാടോപചോദ്യം
  choice: ചോദ്യം നേരായും പരിഹാസത്തിന്റെ സൂചന നിലനിർത്തിയും വിവർത്തനം ചെയ്തു; ശുശ്രൂഷകപ്രതിഫലത്തെക്കുറിച്ചുള്ള അധിക സിദ്ധാന്തനിഗമനം ചേർത്തില്ല.
  alternative: പൗലോസ് ന്യായമായ അപ്പൊസ്തലിക അവകാശം ഉപേക്ഷിച്ചു എന്ന് വിശദീകരിക്കുന്ന പരാവർത്തനം, അല്ലെങ്കിൽ പരിഹാസത്തെ ക്ഷമാപണമായി മൃദൂകരിക്കൽ.
  rationale: ഗ്രീക്ക് വാക്യം സ്വയം താഴ്ത്തിയതും പ്രതിഫലം വാങ്ങാതെ സുവിശേഷം പ്രസംഗിച്ചതും ‘പാപം’ ആയിരുന്നോ എന്നു ചോദിക്കുന്നു; അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിവർത്തനം തന്നെ പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘താഴ്ത്തി/ഉയർത്തപ്പെട്ടു’ എന്ന പ്രതിവിരുദ്ധതയും പൗലോസിന്റെ വാചാടോപപരമായ പരിഹാസവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
