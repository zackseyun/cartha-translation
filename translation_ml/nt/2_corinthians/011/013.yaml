id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, അങ്ങനെയുള്ളവർ വ്യാജ അപ്പൊസ്തലന്മാരും വഞ്ചകരായ പ്രവർത്തകരുമാണ്; അവർ മശീഹയുടെ അപ്പൊസ്തലന്മാരായി വേഷം ധരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ അപ്പൊസ്തലന്മാരായി വേഷം ധരിക്കുന്നു.” ഗ്രീക്കിലെ Χριστός എന്ന പദം പേരുപോലെ ഉപയോഗിക്കുമ്പോൾ “ക്രിസ്തു” എന്നും, അതിന്റെ പദവിയർഥം വ്യക്തമാക്കുമ്പോൾ “മശീഹ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: —ആണ്
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം മലയാളത്തിലെ വാക്യക്രമവും പ്രസംഗസന്ദർഭവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; പ്രത്യേകം ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതായി തോന്നും.
- source_word: τοιοῦτοι
  choice: അങ്ങനെയുള്ളവർ
  rationale: മുമ്പ് വിവരിച്ച പ്രത്യേക വിഭാഗത്തെ സ്വാഭാവികമായും ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെയും സൂചിപ്പിക്കുന്നു.
- source_word: ψευδαπόστολοι
  choice: വ്യാജ അപ്പൊസ്തലന്മാർ
  rationale: അപ്പൊസ്തലസ്ഥാനമുണ്ടെന്ന് വ്യാജമായി അവകാശപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐργάται δόλιοι
  choice: വഞ്ചകരായ പ്രവർത്തകർ
  rationale: അവരുടെ പ്രവർത്തനത്തെ നിർണയിക്കുന്ന വഞ്ചനാസ്വഭാവം നേരായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μετασχηματιζόμενοι
  choice: വേഷം ധരിക്കുന്നു
  rationale: ആന്തരിക രൂപാന്തരത്തേക്കാൾ വഞ്ചനാപരമായ ബാഹ്യ അവതരണമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: മശീഹയുടെ അപ്പൊസ്തലന്മാരുടെ വേഷം
  rationale: εἰς ഇവിടെ ഏറ്റെടുക്കുന്ന വ്യാജപദവിയെയോ ഭാവത്തെയോ സൂചിപ്പിക്കുന്നു; ‘വേഷം ധരിക്കുന്നു’ എന്ന പ്രയോഗത്തോടൊപ്പം ഈ അർഥം വ്യക്തമാണ്.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർഥം ഇവിടെ സജീവമായി നിലനിൽക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ‘മശീഹയുടെ അപ്പൊസ്തലന്മാർ’ എന്ന ബന്ധത്തിൽ പദവിയുടെ അർഥം നിലനിർത്തുന്നു; ‘ക്രിസ്തു’ എന്ന പതിവുരൂപവും സാധ്യമാണ്, അതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. സഭാപരമായി പരിചിതമായ ‘അപ്പൊസ്തലൻ’ നിലനിർത്തി; ‘വേഷം ധരിക്കുന്നു’ എന്നത് വഞ്ചനാപരമായ ബാഹ്യസ്വരൂപമാറ്റം വ്യക്തമായി പറയുന്നു.
