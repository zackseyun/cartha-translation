id: 2CO.11.29
reference: 2 Corinthians 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: ml
  text: ആരെങ്കിലും ബലഹീനനാണെങ്കിൽ, ഞാനും ബലഹീനനല്ലേ? ആരെങ്കിലും ഇടറിപ്പോകാൻ പ്രേരിപ്പിക്കപ്പെടുന്നെങ്കിൽ, ഞാനും ഉള്ളിൽ എരിയുന്നില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എരിയുന്നു’ എന്ന ഗ്രീക്ക് പ്രയോഗം രൂപകമാണ്; അത് തീവ്രമായ ദുഃഖത്തെയോ ആവേശത്തെയോ രോഷത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: ബലഹീനനാകുന്നു / ബലഹീനനാകുന്നു
  rationale: ശാരീരികമോ സാമൂഹികമോ ആത്മീയമോ ആയ ബലഹീനതയെ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദമാണ് ‘ബലഹീനനാകുക’; ‘രോഗിയാകുക’ എന്നതിനേക്കാൾ ഇത് ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തിയും പൗലോസിന്റെ സഹാനുഭൂതിപൂർണമായ പങ്കുചേരലും നന്നായി നിലനിർത്തുന്നു.
- source_word: σκανδαλίζεται
  choice: ഇടറിപ്പോകാൻ ഇടയാകുന്നു
  rationale: ആത്മീയമോ ധാർമികമോ ആയ വീഴ്ചയിലേക്കു കൊണ്ടുപോകപ്പെടുന്നതിന്റെ രൂപകം നിലനിർത്തുകയും ‘വ്രണപ്പെടുക’, ‘പാപത്തിൽ വീഴുക’ തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ട വ്യാഖ്യാനങ്ങൾ ഒഴിവാക്കുകയും ചെയ്യുന്നു. ‘ഇടയാകുന്നു’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ കാരണഭാവം സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πυροῦμαι
  choice: ഉള്ളിൽ എരിയുന്നു
  rationale: തീവ്രമായ ആന്തരിക വികാരം സൂചിപ്പിക്കുന്ന തീയുടെ രൂപകം നിലനിർത്തുന്നു; അത് ദുഃഖമോ തീക്ഷ്ണതയോ രോഷമോ എന്ന് മുഖ്യവാക്യത്തിൽ ഏകാർത്ഥമാക്കി തീർക്കുന്നില്ല. ‘ഉള്ളിൽ’ എന്നത് മലയാളത്തിൽ രൂപകാർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τίς
  choice: ആരെങ്കിലും
  rationale: ഇവിടെ വ്യക്തികളെക്കുറിച്ചുള്ള അലങ്കാരപ്രശ്നങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കാൻ ‘ആരെങ്കിലും ... ചെയ്യുമ്പോൾ’ എന്ന ഘടന അനുയോജ്യമാണ്.
- source_word: καὶ οὐκ ἐγὼ
  choice: ഞാനും ... ഇല്ലേ?
  rationale: ἐγώ നൽകുന്ന ഊന്നൽ ‘ഞാനും’ സംരക്ഷിക്കുന്നു; പ്രതീക്ഷിക്കപ്പെടുന്ന അനുകൂല ഉത്തരം വ്യക്തമാക്കുന്ന ‘ഇല്ലേ?’ മലയാളത്തിലെ സ്വാഭാവിക അലങ്കാരപ്രശ്നരൂപമാണ്.
theological_decisions:
- issue: πυροῦμαι എന്നതിൽ പൗലോസിന്റെ പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: മുഖ്യവാക്യത്തിൽ ‘ഉള്ളിൽ എരിയുന്നു’ എന്ന രൂപകം നിലനിർത്തുക
  alternative: ‘രോഷംകൊണ്ട് ജ്വലിക്കുന്നു’, ‘ദുഃഖത്താൽ എരിയുന്നു’, അല്ലെങ്കിൽ ‘തീവ്രമായി അസ്വസ്ഥനാകുന്നു’
  rationale: പൗലോസിന്റെ ആഴമുള്ള ഐക്യദാർഢ്യവും വൈകാരിക പങ്കാളിത്തവും വാക്യം പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് രൂപകം കൃത്യമായി ഏതു വികാരമാണെന്ന് നിർബന്ധിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക വികാരം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരവും ഇടയപരിപാലനപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ അലങ്കാരപ്രശ്നരൂപം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനവും പൗലോസിന്റെ സഹാനുഭൂതിപൂർണമായ ‘ഞാനും’ എന്ന ഊന്നലും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദ കർമണിഘടന ഒഴിവാക്കി.
