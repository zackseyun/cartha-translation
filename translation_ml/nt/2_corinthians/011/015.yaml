id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: ml
  text: അതുകൊണ്ട്, അവന്റെ ശുശ്രൂഷകരും നീതിയുടെ ശുശ്രൂഷകരായി വേഷംമാറിയാലും അതിൽ അതിശയിക്കാനൊന്നുമില്ല[a]. അവരുടെ അവസാനം അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ചായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീതിനിഷ്ഠയുടെ ശുശ്രൂഷകർ.’ ഗ്രീക്ക് പദത്തിന് ‘നീതി’ എന്നും ‘നീതിനിഷ്ഠ’ എന്നും അർഥമാകാം; ഇവിടെ ശരിയായതിനോട് യോജിച്ചവരായി കാണപ്പെടുന്ന ഭാവമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: അതിശയിക്കാനൊന്നുമില്ല
  rationale: ഈ പ്രയോഗം ഒരു കാര്യം ശ്രദ്ധേയമോ ആശ്ചര്യകരമോ അല്ലെന്ന് സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അർഥം നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: διάκονοι
  choice: ശുശ്രൂഷകർ
  rationale: ഒരാളുടെ സേവനത്തിൽ പ്രവർത്തിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; സഭാപദവിയിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ ഗൗരവമുള്ള ഭാഷ നിലനിർത്തുന്നു.
- source_word: μετασχηματίζονται
  choice: വേഷംമാറുന്നു
  rationale: ആന്തരിക പരിവർത്തനമല്ല, വഞ്ചനാപരമായ ബാഹ്യരൂപമാറ്റമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: ὡς
  choice: ആയി
  rationale: അവർ ഏറ്റെടുക്കുന്ന വ്യാജരൂപമോ പദവിയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: മലയാളത്തിൽ ധാർമികമായി ശരിയായ നിലയെയും ന്യായത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക പദം; ഈ സന്ദർഭത്തിൽ ശരിയായവരെന്ന വ്യാജഭാവമാണ് മുഖ്യം.
- source_word: τὸ τέλος
  choice: അവരുടെ അവസാനം
  rationale: അവരെ കാത്തിരിക്കുന്ന അന്തിമഫലത്തെയോ വിധിയെയോ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ച്
  rationale: അന്തിമഫലം അവരുടെ ചെയ്തികളോട് പൊരുത്തപ്പെടുമെന്ന വിധിസൂത്രം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പൗലോസിന്റെ പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: നീതിനിഷ്ഠ
  rationale: δικαιοσύνη എന്നതിന് നീതി, നീതിനിഷ്ഠ എന്നീ അർഥവ്യാപ്തികളുണ്ട്. ഇവിടെ അവർ ധാർമികമായി ശരിയായതിന്റെ പക്ഷത്തുള്ള ശുശ്രൂഷകരെന്നു തോന്നിക്കുന്നതാണ് ആശയം; മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ ‘നീതി’ ഉപയോഗിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: അവരുടെ അന്ത്യം പ്രവൃത്തികൾക്കനുസരിച്ചായിരിക്കും എന്ന വിധിപ്രസ്താവം
  choice: അവരുടെ പ്രവൃത്തികൾക്കനുസരിച്ചായിരിക്കും അവരുടെ അവസാനം
  alternative: അവരുടെ പ്രവൃത്തികൾക്ക് തക്കതായിരിക്കും അവരുടെ അന്തിമഫലം
  rationale: ഗ്രീക്ക് വാക്യം വിധിയും പ്രവൃത്തികളും തമ്മിലുള്ള correspondence പ്രസ്താവിക്കുന്നു; അതിന്റെ വ്യവസ്ഥിത ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കാതെ പ്രസ്താവനയുടെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശുശ്രൂഷകർ’ എന്ന ആവർത്തനം ഗ്രീക്ക് പദത്തിന്റെ ആവർത്തനവും വാക്യത്തിലെ വൈരുധ്യവും നിലനിർത്തുന്നു.
