  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: ml
  text: കർത്താവായ യേശുവിന്റെ ദൈവവും പിതാവുമായവൻ—എന്നേക്കും വാഴ്ത്തപ്പെട്ടവൻ—ഞാൻ കള്ളം പറയുന്നില്ലെന്ന് അറിയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
