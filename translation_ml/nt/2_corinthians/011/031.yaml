    text: ‘എന്നെന്നേക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം; അക്ഷരാർഥത്തിൽ ‘യുഗങ്ങളോളം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ദൈവവും പിതാവുമായവൻ
  rationale: ഒരേ നിർദേശകപദത്തിന്റെ കീഴിലുള്ള രണ്ടു നാമങ്ങളെയും നിലനിർത്തി, ഗ്രീക്കിലെ സ്ഥിരപ്രയോഗത്തിന്റെ ഏകീകൃത സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ
  rationale: κύριος എന്ന സ്ഥാനപ്പേര് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ എന്ന പദം ചേർത്തിട്ടില്ല.
- source_word: οἶδεν
  choice: അറിയുന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സത്യപ്രതിജ്ഞാസദൃശമായ പ്രയോഗമാണെങ്കിലും ‘സാക്ഷിയാണ്’ എന്ന് വികസിപ്പിക്കുന്നില്ല.
- source_word: ὁ ὢν εὐλογητὸς
  choice: വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന സ്തുതിവാക്യം സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും
  rationale: അനന്തമായ കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന സ്തുതിപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യം.
- source_word: ὅτι
  choice: എന്ന്
  rationale: ദൈവം അറിയുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ഘടകമായി പരിഭാഷപ്പെടുത്തി; കാരണാർഥത്തിൽ എടുത്തിട്ടില്ല.
- source_word: οὐ ψεύδομαι
  choice: ഞാൻ കള്ളം പറയുന്നില്ല
  rationale: വർത്തമാനകാലത്തിലുള്ള പ്രസ്താവനയെ വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവവും പിതാവും’ എന്ന പ്രയോഗവും ‘കർത്താവായ യേശു’വുമായുള്ള ബന്ധവും
  choice: ‘കർത്താവായ യേശുവിന്റെ ദൈവവും പിതാവുമായവൻ’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: വ്യക്തികൾ തമ്മിലുള്ള വ്യത്യാസം മയപ്പെടുത്തുന്ന പരാവർത്തനം.
  rationale: മൂലവാക്യത്തിലെ ബന്ധവും വ്യക്തിവ്യത്യാസവും വിശദീകരിച്ചോ മയപ്പെടുത്തിയോയില്ലാതെ നിലനിർത്തുന്നു.
- issue: സ്തുതിവാക്യത്തിന്റെ ബന്ധവും വിരാമചിഹ്നവും
  choice: ‘എന്നേക്കും വാഴ്ത്തപ്പെട്ടവൻ’ എന്നത് ദൈവത്തെ വിശേഷിപ്പിക്കുന്ന ഇടയ്ക്കുള്ള സ്തുതിവാക്യമായി ഡാഷുകൾക്കിടയിൽ നൽകി.
  alternative: നിയന്ത്രക വിശേഷണവാക്യംപോലെ വിരാമമില്ലാതെ ചേർക്കുക.
  rationale: പൗലോസിന്റെ ഗൗരവപൂർവമായ ഉറപ്പിനുള്ളിലെ സ്തുതിസ്വഭാവം വ്യക്തമായി വായിക്കാനാകുന്നു; വാക്യബന്ധം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവവും പിതാവുമായവൻ’ എന്ന ഘടന മൂലഭാഷയുടെ രൂപം സൂക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ വ്യക്തത നൽകുന്നു. എല്ലാ മൂലഘടകങ്ങളും നിലനിർത്തിയിട്ടുണ്ട്.
