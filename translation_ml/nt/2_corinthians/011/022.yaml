id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: ml
  text: അവർ എബ്രായരാണോ? ഞാനും അങ്ങനെതന്നെ. അവർ ഇസ്രായേല്യരാണോ? ഞാനും അങ്ങനെതന്നെ. അവർ അബ്രാഹാമിന്റെ സന്തതിയാണോ? ഞാനും അങ്ങനെതന്നെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘അബ്രാഹാമിന്റെ വിത്ത്.’ ഗ്രീക്കിൽ ഏകവചനത്തിലുള്ള ഒരു കൂട്ടാർഥപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: എബ്രായർ
  rationale: യഹൂദ പൈതൃകത്തെയും സാംസ്കാരിക-വംശീയ തിരിച്ചറിയലിനെയും സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാളപദം; തുടർന്നുള്ള ‘ഇസ്രായേല്യർ’, ‘അബ്രാഹാമിന്റെ സന്തതി’ എന്നിവയിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: κἀγώ
  choice: ഞാനും അങ്ങനെതന്നെ
  rationale: καί + ἐγώ എന്ന സംക്ഷിപ്തവും ഊന്നലുള്ളതുമായ മറുപടിയുടെ സ്വാഭാവിക മലയാളരൂപം; മൂന്നു പ്രാവശ്യത്തെ ആവർത്തനത്തിന്റെ വാചാടോപബലവും സംരക്ഷിക്കുന്നു.
- source_word: Ἰσραηλῖταί
  choice: ഇസ്രായേല്യർ
  rationale: ഇസ്രായേൽജനത്തോടുള്ള അംഗത്വം കൃത്യമായി പ്രകടിപ്പിക്കുകയും ‘എബ്രായർ’ എന്ന പദത്തിൽനിന്നുള്ള സൂക്ഷ്മവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: σπέρμα Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ സന്തതി
  rationale: σπέρμα എന്ന ഏകവചന കൂട്ടാർഥപ്രയോഗത്തിന് മലയാളത്തിൽ സ്വാഭാവികമായി യോജിക്കുന്ന രൂപം; വംശപരമ്പരയെ സൂചിപ്പിക്കുമ്പോഴും ഉറവിടത്തിലെ കൂട്ടാർഥം നിലനിർത്തുന്നു.
- source_word: εἰσιν
  choice: ആണോ / അങ്ങനെതന്നെ
  rationale: ആവർത്തിക്കുന്ന ബന്ധകക്രിയയെ മലയാളത്തിലെ സ്വാഭാവിക ചോദ്യോത്തരഘടനയിൽ ഉൾപ്പെടുത്തി, മൂലത്തിലെ ഹ്രസ്വവും ഊന്നലുള്ളതുമായ താളം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: യഹൂദ തിരിച്ചറിയലിനെ സൂചിപ്പിക്കുന്ന മൂന്നു പദങ്ങളിലെ സൂക്ഷ്മവ്യത്യാസം
  choice: ‘എബ്രായർ’, ‘ഇസ്രായേല്യർ’, ‘അബ്രാഹാമിന്റെ സന്തതി’ എന്നീ മൂന്നു വ്യത്യസ്ത പ്രയോഗങ്ങളും നിലനിർത്തുക
  alternative: മൂന്നിനെയും ‘യഹൂദർ’ എന്നോ സമാനമായ ഒരൊറ്റ പദത്തിലോ ലയിപ്പിക്കുക
  rationale: പൗലോസിന്റെ വാദം പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ പൈതൃകാവകാശങ്ങൾ അടുക്കിവെക്കുന്നതിലാണ് ആശ്രയിക്കുന്നത്; അവയെ ഒരൊറ്റ വിഭാഗമാക്കുന്നത് മൂലപാഠത്തിന്റെ വാചാടോപവും അർത്ഥസൂക്ഷ്മതയും നഷ്ടപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ മൂന്നു ഹ്രസ്വ ചോദ്യോത്തരങ്ങളുടെ സമാന്തരഘടനയും ഊന്നലുള്ള ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
