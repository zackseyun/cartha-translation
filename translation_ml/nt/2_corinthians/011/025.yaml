id: 2CO.11.25
reference: 2 Corinthians 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: ml
  text: മൂന്നു പ്രാവശ്യം എനിക്ക് വടികൊണ്ട് അടിയേറ്റു; ഒരിക്കൽ എന്നെ കല്ലെറിഞ്ഞു; മൂന്നു പ്രാവശ്യം ഞാൻ കപ്പൽച്ചേതത്തിൽപ്പെട്ടു; ഒരു രാത്രിയും ഒരു പകലും ഞാൻ ആഴക്കടലിൽ[a] ചെലവഴിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തുറസ്സായ കടലിൽ.”
    reason: βυθός ഇവിടെ ആഴക്കടലിനെയോ കരയിൽനിന്ന് അകലെയുള്ള തുറസ്സായ കടലിനെയോ സൂചിപ്പിക്കാം; കൃത്യമായ സാഹചര്യം മൂലപാഠം നിർണയിക്കുന്നില്ല.
lexical_decisions:
- source_word: τρὶς
  choice: മൂന്നു പ്രാവശ്യം
  rationale: ആവർത്തിച്ചുണ്ടായ സംഭവങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം; വാക്യത്തിലെ രണ്ടിടത്തും ഒരേവിധം പരിഭാഷപ്പെടുത്തി.
- source_word: ἐραβδίσθην
  choice: എനിക്ക് വടികൊണ്ട് അടിയേറ്റു
  rationale: ῥαβδίζω എന്ന ക്രിയയിലെ വടികൊണ്ടുള്ള മർദനം വ്യക്തമാക്കുകയും കർമ്മണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἅπαξ
  choice: ഒരിക്കൽ
  rationale: ഒറ്റത്തവണ സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന ലളിതവും കൃത്യവുമായ പ്രയോഗം.
- source_word: ἐλιθάσθην
  choice: എന്നെ കല്ലെറിഞ്ഞു
  rationale: കല്ലെറിഞ്ഞുള്ള ആക്രമണത്തെ വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക മലയാളം; ഗ്രീക്ക് കർമ്മണിപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐναυάγησα
  choice: ഞാൻ കപ്പൽച്ചേതത്തിൽപ്പെട്ടു
  rationale: ναυαγέω സൂചിപ്പിക്കുന്ന കപ്പൽ തകർച്ചയിലോ മുങ്ങലിലോ അകപ്പെട്ട അനുഭവം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: νυχθήμερον
  choice: ഒരു രാത്രിയും ഒരു പകലും
  rationale: രാത്രി-പകൽ കാലയളവിന്റെ ക്രമം നിലനിർത്തുന്നു; ‘ഇരുപത്തിനാല് മണിക്കൂർ’ എന്ന അതികൃത്യമായ ആധുനികവത്കരണം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ βυθῷ
  choice: ആഴക്കടലിൽ
  rationale: βυθός എന്ന പദത്തിന്റെ ആഴമേറിയ കടൽ/തുറസ്സായ കടൽ എന്ന അർഥപരിധി സംക്ഷിപ്തമായി നൽകുന്നു; സന്ദർഭസാധ്യമായ മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πεποίηκα
  choice: കഴിച്ചുകൂട്ടി
  rationale: കാലയളവിനോടൊപ്പം ποιέωയ്ക്ക് വരുന്ന ‘സമയം ചെലവഴിക്കുക’ എന്ന പ്രയോഗാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പിന്നോട്ടുനോക്കുന്ന അനുഭവവിവരണത്തിനും യോജിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം ഉപയോഗിച്ചു. ദുരനുഭവങ്ങളുടെ പട്ടികയിലെ ആവർത്തനവും വേഗതയും നിലനിർത്താൻ സമാന്തര ഘടനയും അർധവിരാമങ്ങളും പ്രയോഗിച്ചു. ‘ആഴക്കടലിൽ’ എന്നതിലെ യഥാർഥ സ്ഥലസൂചന തീർപ്പാക്കാതെ പദാർഥത്തിലെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചു.
