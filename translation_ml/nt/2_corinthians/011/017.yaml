id: 2CO.11.17
reference: 2 Corinthians 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: ml
  text: ഞാൻ പറയുന്നത് കർത്താവിന് അനുസൃതമായി പറയുന്നതല്ല[a]; മറിച്ച്, ഭോഷത്വത്തിൽ എന്നപോലെ[b], ഈ വീമ്പുപറച്ചിലിലുള്ള ആത്മവിശ്വാസത്തോടെ[c] പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ ഇത് കർത്താവിൽനിന്നുള്ളതായി പറയുന്നതല്ല,’ അല്ലെങ്കിൽ ‘കർത്താവിന്റെ മാനദണ്ഡപ്രകാരം പറയുന്നതല്ല.’
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ഒരു ഭോഷനെപ്പോലെ.’
    reason: lexical_alternative
  - marker: c
    text: ‘ആത്മവിശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘അടിസ്ഥാനം,’ ‘കാര്യം,’ അല്ലെങ്കിൽ ‘ഉദ്യമം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: ഞാൻ പറയുന്നത്
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമവും വർത്തമാനകാല ക്രിയയും ചേർന്ന് പൗലോസ് ഇപ്പോൾ പറയുന്ന കാര്യത്തെ സൂചിപ്പിക്കുന്നു; ഈ രൂപം സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: κατὰ κύριον
  choice: കർത്താവിന് അനുസൃതമായി
  rationale: κατά ഇവിടെ മാനദണ്ഡമോ രീതിയോ സൂചിപ്പിക്കുന്നു. കർത്താവിന്റെ മാതൃക, മാനദണ്ഡം, അല്ലെങ്കിൽ അധികാരം എന്നിവയിൽ ഏതാണെന്ന് നിർബന്ധിച്ച് തീർപ്പാക്കാതെ പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: ഈ സന്ദർഭത്തിൽ κύριος സ്വാഭാവികമായി കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്നു; മുഖ്യവാക്യത്തിൽ കൂടുതൽ വിശദീകരണം ആവശ്യമില്ല.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: മറിച്ച്, ഒരു ഭോഷനെപ്പോലെയാണ്
  rationale: ഗ്രീക്കിലെ ‘ഭോഷത്വത്തിൽ എന്നപോലെ’ എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി നൽകുന്നു; പൗലോസ് യഥാർഥത്തിൽ ഭോഷനാണെന്ന തീർപ്പ് ഇതിൽ ചുമത്തുന്നില്ല.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: ഈ ധൈര്യത്തോടെ
  rationale: ὑπόστασις ഇവിടെ വീമ്പുപറച്ചിലിനോടു ബന്ധപ്പെട്ട ആത്മവിശ്വാസമുള്ള നിലപാടിനെയോ ധൈര്യത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘ധൈര്യത്തോടെ’ സന്ദർഭത്തിന് യോജിച്ചും സ്വാഭാവികമായും വരുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῆς καυχήσεως
  choice: വീമ്പുപറയാനുള്ള
  rationale: καύχησις എന്ന നാമത്തിന്റെ ക്രിയാത്മക അർഥം നിലനിർത്തുകയും ധൈര്യം ഏതു കാര്യവുമായി ബന്ധപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘കർത്താവിന് അനുസൃതമായി’ എന്നതിന്റെ സൂചനയും പ്രാബല്യവും
  choice: തുടർന്നുവരുന്ന വീമ്പുപറച്ചിലിന്റെ രീതി കർത്താവിന്റെ മാതൃകയോടോ മാനദണ്ഡത്തോടോ യോജിച്ചതല്ലെന്ന് പൗലോസ് പറയുന്നു.
  alternative: ഇവിടെ കർത്താവിന്റെ നേരിട്ടുള്ള വചനമോ കല്പനയോ താൻ ഉദ്ധരിക്കുന്നില്ല എന്നാണ് പൗലോസ് ഉദ്ദേശിക്കുന്നത്; അല്ലെങ്കിൽ ഈ വാക്കുകൾ കർത്താവിൽനിന്നുള്ളവയല്ലെന്നാണ് അദ്ദേഹം പറയുന്നത്.
  rationale: ഈ പ്രയോഗം പ്രചോദനത്തെയോ സത്യസന്ധതയെയോ നിഷേധിക്കുന്നതായി വിവർത്തനം ചെയ്യാതെ, പൗലോസ് തന്റെ വീമ്പുപറച്ചിലിന്റെ ശൈലിയെ കർത്താവിന്റെ മാതൃകയിൽനിന്ന് അകറ്റിനിർത്തുന്നതായി അവതരിപ്പിക്കുന്നു. അതേസമയം ഗ്രീക്കിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘ഒരു ഭോഷനെപ്പോലെ’ എന്ന സ്വാഭാവിക പ്രയോഗത്തോടൊപ്പം കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി. മുഖ്യവാക്യത്തിന്റെ വാക്കുക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനായി ക്രമീകരിച്ചെങ്കിലും ഗ്രീക്കിലെ പ്രധാന ആശയബന്ധങ്ങൾ സംരക്ഷിച്ചു.
