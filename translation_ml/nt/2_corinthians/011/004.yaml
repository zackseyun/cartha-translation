reference: 2 Corinthians 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: ml
  text: കാരണം, ആരെങ്കിലും വന്ന് ഞങ്ങൾ പ്രസംഗിക്കാത്ത മറ്റൊരു യേശുവിനെ പ്രസംഗിക്കുകയോ, നിങ്ങൾ മുമ്പ് സ്വീകരിച്ചിട്ടില്ലാത്ത വ്യത്യസ്തമായ ഒരു ആത്മാവിനെ സ്വീകരിക്കുന്നുവെങ്കിലോ[a], നിങ്ങൾ അംഗീകരിച്ചിട്ടില്ലാത്ത വ്യത്യസ്തമായ ഒരു സുവിശേഷം അംഗീകരിക്കുന്നുവെങ്കിലോ[b]—നിങ്ങൾ അത് വളരെ നന്നായി സഹിക്കുന്നു![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വ്യത്യസ്തമായ ഒരു ആത്മാവ്’ എന്നത് പരിശുദ്ധാത്മാവിനെ തെറ്റായി അവതരിപ്പിക്കുന്നതാണോ, ഒരു ദുരാത്മാവാണോ, മറ്റൊരു ആത്മീയ സ്വാധീനമാണോ എന്ന് ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നില്ല.
    reason: theological_ambiguity
  - marker: b
    text: 'അഥവാ: ‘മറ്റൊരു സുവിശേഷം.’'
    reason: lexical_alternative
  - marker: c
    text: ‘വളരെ നന്നായി സഹിക്കുന്നു!’ എന്നത് പരിഹാസമാണ്; അത്തരം അവകാശവാദങ്ങളെയോ അവ ഉന്നയിക്കുന്നവനെയോ കൊരിന്ത്യർ വളരെ എളുപ്പത്തിൽ സഹിക്കുന്നതിനെ പൗലോസ് ശാസിക്കുന്നു.
    reason: ironic_tone
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: ആരെങ്കിലും വന്ന്
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാന കൃുദന്തം സന്ദർഭത്തിൽ അനിശ്ചിതമായ ഒരാളെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഇത് സ്വാഭാവികമാണ്.
- source_word: ἄλλον Ἰησοῦν
  choice: മറ്റൊരു യേശുവിനെ
  rationale: ἄλλος എന്നതിന്റെ ‘മറ്റൊരു’ എന്ന അടിസ്ഥാനാർഥവും അതേ ‘യേശു’ എന്ന പേരിൽ അവതരിപ്പിക്കപ്പെടുന്ന എതിരാളി ചിത്രീകരണവും നിലനിർത്തുന്നു.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: പ്രസംഗിക്കുകയോ / പ്രസംഗിക്കാത്ത
  rationale: κηρύσσω സൂചിപ്പിക്കുന്ന പരസ്യപ്രഖ്യാപനത്തിന് സാധാരണ മലയാള ബൈബിൾ-ഭാഷയിലും പൊതുഭാഷയിലും ഗ്രാഹ്യമായ തത്തുല്യം.
- source_word: πνεῦμα ἕτερον
  choice: വ്യത്യസ്തമായ ഒരു ആത്മാവിനെ
  rationale: ἕτερος ഇവിടെ മുമ്പ് ലഭിച്ചതിൽനിന്നുള്ള ഗുണപരമായ വ്യത്യാസം ഊന്നുന്നു; ‘ആത്മാവ്’ എന്നത് അതിന്റെ കൃത്യമായ സ്വഭാവം നിർണയിക്കാതെ വിടുന്നു.
- source_word: λαμβάνετε / ἐλάβετε
  choice: സ്വീകരിക്കുകയോ / മുമ്പ് സ്വീകരിക്കാത്ത
  rationale: λαμβάνω എന്ന ക്രിയയുടെ സ്വീകരിക്കൽ എന്ന അർഥം നിലനിർത്തുന്നു; അഒറിസ്റ്റിന്റെ മുൻകാലസൂചന മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘മുമ്പ്’ ചേർത്തു.
- source_word: εὐαγγέλιον ἕτερον
  choice: വ്യത്യസ്തമായ ഒരു സുവിശേഷം
  rationale: ἕτερος എന്നതിന്റെ വൈരുധ്യബലം ‘വ്യത്യസ്തമായ’ എന്നും εὐαγγέλιον എന്ന പൗലോസീയ പദം ‘സുവിശേഷം’ എന്നും നൽകുന്നു.
- source_word: ἐδέξασθε
  choice: അംഗീകരിക്കാത്ത / അംഗീകരിക്കുകയോ
  rationale: മുൻവാക്യത്തിലെ λαμβάνω (‘സ്വീകരിക്കുക’) എന്നതിൽനിന്നുള്ള പദഭേദം സൂക്ഷിച്ചുകൊണ്ട് δέχομαι എന്നതിലെ അംഗീകരിക്കൽ/സ്വാഗതം ചെയ്യൽ ഭാവം നൽകുന്നു.
- source_word: καλῶς ἀνέχεσθε
  choice: നിങ്ങൾ അതെല്ലാം എത്ര നന്നായി സഹിക്കുന്നു!
  rationale: ἀνέχομαι എന്നതിന്റെ ‘സഹിക്കുക’ എന്ന അർഥവും καλῶς ഉൾക്കൊള്ളുന്ന പരിഹാസാത്മക ശാസനയും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: εἰ μὲν γὰρ
  choice: ചെയ്താൽ
  rationale: ഗ്രീക്കിലെ നിബന്ധന മലയാളത്തിലെ ഏകോപിത ‘-യോ ... ചെയ്താൽ’ ഘടനയിൽ സ്വാഭാവികമായി ഉൾപ്പെടുത്തിയിരിക്കുന്നു; γάρ-ന്റെ വിശദീകരണബന്ധം വാക്യത്തിന്റെ സന്ദർഭപ്രവാഹത്തിലൂടെ സൂചിതമാണ്.
theological_decisions:
- issue: ‘വ്യത്യസ്തമായ ഒരു ആത്മാവ്’ എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവിനെയോ ദുരാത്മാവിനെയോ ആത്മീയ സ്വാധീനത്തെയോ പ്രത്യേകം നിർണയിക്കാതെ പൊതുവായി നിലനിർത്തി.
  alternative: തെറ്റായി അവതരിപ്പിക്കപ്പെട്ട പരിശുദ്ധാത്മാവ്; ഒരു ദുരാത്മാവ്; വ്യത്യസ്തമായ ആത്മീയ മനോഭാവം അല്ലെങ്കിൽ അനുഭവം.
  rationale: πνεῦμα ἕτερον എന്ന ഗ്രീക്ക് പ്രയോഗം വിശാലമാണ്; സമീപസന്ദർഭം അതിന്റെ സൂചന നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
- issue: καλῶς ἀνέχεσθε എന്നതിന്റെ സ്വരം
  choice: ‘നിങ്ങൾ അതെല്ലാം എത്ര നന്നായി സഹിക്കുന്നു!’ എന്ന പരിഹാസാത്മക ശാസനയായി നൽകി.
  alternative: നേരിട്ടുള്ള പ്രശംസ; നിഷ്പക്ഷമായ നിരീക്ഷണം.
  rationale: സന്ദർഭത്തിൽ പൗലോസ് എതിരാളികളുടെ അവകാശവാദങ്ങളെ കൊരിന്ത്യർ എളുപ്പത്തിൽ സഹിക്കുന്നതിനെ വിമർശിക്കുകയാണ്; ആശ്ചര്യചിഹ്നവും ‘എത്ര നന്നായി’ എന്ന പ്രയോഗവും പരിഹാസം ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ‘പ്രസംഗിക്കുക,’ ‘ആത്മാവ്,’ ‘സുവിശേഷം’ എന്നീ പരിചിതമായ ക്രൈസ്തവ പദങ്ങൾ നിലനിർത്തി. മൂന്ന് സമാന്തര നിബന്ധനകളും അവസാനത്തെ പരിഹാസാത്മക മുഖ്യവാക്യവും വ്യക്തമായി ക്രമപ്പെടുത്തി.
