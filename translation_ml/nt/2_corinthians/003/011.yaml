  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: ml
  text: അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നത് മഹത്ത്വത്തോടുകൂടി വന്നതാണെങ്കിൽ,[a][b] നിലനിൽക്കുന്നതോ[c] എത്രയധികം മഹത്ത്വത്തിൽ നിലനിൽക്കുന്നു!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പ്രാബല്യമില്ലാതാക്കപ്പെട്ടുകൊണ്ടിരുന്നത്,” “നീക്കിക്കളയപ്പെട്ടുകൊണ്ടിരുന്നത്”; സന്ദർഭപരമായി, “മങ്ങിപ്പോയിക്കൊണ്ടിരുന്നത്.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “മഹത്ത്വത്തിലൂടെ.”'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: “തുടരുന്നത്” അല്ലെങ്കിൽ “സ്ഥിരമായി നിൽക്കുന്നത്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നത്
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ പ്രക്രിയാത്മക ഭാവവും ‘അവസാനിപ്പിക്കുക/പ്രാബല്യമില്ലാതാക്കുക’ എന്ന മുഖ്യ അർഥവും നിലനിർത്തുന്നു; സന്ദർഭം മാത്രം ആശ്രയിച്ചുള്ള ‘മങ്ങിപ്പോകുന്നത്’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: διὰ δόξης
  choice: മഹത്ത്വത്തോടുകൂടി വന്നത്
  rationale: διά + genitive എന്നതിന്റെ അക്ഷരാർഥം ‘മഹത്ത്വത്തിലൂടെ’ എന്നാണെങ്കിലും, ഇവിടെ മഹത്ത്വത്താൽ അനുഗമിക്കപ്പെട്ട അവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ‘മഹത്ത്വത്തോടുകൂടി വന്നത്’ എന്നു നൽകി.
- source_word: μένον
  choice: നിലനിൽക്കുന്നത്
  rationale: μένω എന്നതിന്റെ ‘നിലനിൽക്കുക, തുടരുക’ എന്ന അർഥവും നപുംസക substantival participle-ന്റെ സമാന്തര ഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: ἐν δόξῃ
  choice: മഹത്ത്വത്തിൽ ആയിരിക്കും
  rationale: ἐν എന്ന ഉപസർഗത്തിന്റെ മേഖലയെയോ അവസ്ഥയെയോ സൂചിപ്പിക്കുന്ന ഭാവം സംരക്ഷിക്കുന്നു. മലയാളവാക്യത്തിൽ ഭാവിസൂചകമായി തോന്നാമെങ്കിലും ഇത് നിബന്ധനാപരമായ താരതമ്യനിഗമനമാണ്.
- source_word: πολλῷ μᾶλλον
  choice: എത്രയധികം
  rationale: ഗ്രീക്കിലെ ശക്തമായ താരതമ്യത്തെ സ്വാഭാവികമായ ‘എത്രയധികം’ ഘടനയിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: അവസാനിക്കുന്നതും നിലനിൽക്കുന്നതും എന്താണെന്ന തിരിച്ചറിയൽ
  choice: ഗ്രീക്കുപാഠത്തിലെ നപുംസക കൃദന്തരൂപങ്ങൾപോലെ വസ്തുക്കളെ ഈ വാക്യത്തിൽ പേരിട്ടു വ്യക്തമാക്കാതെ വിട്ടു.
  alternative: ‘പഴയ ഉടമ്പടിയുടെ ശുശ്രൂഷ’, ‘പുതിയ ഉടമ്പടിയുടെ ശുശ്രൂഷ’ എന്ന് തുറന്നു പറയുക.
  rationale: സന്ദർഭം ആ ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം തന്നെ അവയെ പേരെടുത്തു പറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: καταργούμενον എന്നതിന്റെ സ്വഭാവം
  choice: ‘അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നത്’ എന്ന് നൽകി.
  alternative: ‘മങ്ങിപ്പോയിക്കൊണ്ടിരുന്നത്’ അല്ലെങ്കിൽ ‘നീക്കിക്കളയപ്പെട്ടുകൊണ്ടിരുന്നത്’.
  rationale: ആദ്യത്തേത് സന്ദർഭാധിഷ്ഠിത രൂപകവ്യാഖ്യാനവും രണ്ടാമത്തേത് ശക്തമായ വ്യാഖ്യാനവുമാണ്; തിരഞ്ഞെടുത്ത രൂപം നിഷ്ക്രിയതയും നടന്നുകൊണ്ടിരിക്കുന്ന പ്രക്രിയയും കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ നിബന്ധനാ-താരതമ്യ ഘടന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘എത്രയധികം’ എന്ന വിസ്മയാത്മക താരതമ്യരൂപം ഉപയോഗിച്ചു.
