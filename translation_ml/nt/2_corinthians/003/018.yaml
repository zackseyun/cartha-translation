id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: ml
  text: എന്നാൽ നാമെല്ലാവരും, മൂടുപടം നീക്കപ്പെട്ട മുഖത്തോടെ, കണ്ണാടിയിലെന്നപോലെ കർത്താവിന്റെ മഹത്ത്വം നോക്കിക്കൊണ്ട്[a], അതേ പ്രതിരൂപത്തിലേക്ക് മഹത്ത്വത്തിൽനിന്ന് മഹത്ത്വത്തിലേക്ക് രൂപാന്തരപ്പെട്ടുകൊണ്ടിരിക്കുന്നു—കർത്താവായ ആത്മാവിൽനിന്നുള്ളതുപോലെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കണ്ണാടിപോലെ കർത്താവിന്റെ മഹത്ത്വം പ്രതിഫലിപ്പിച്ചുകൊണ്ട്.’
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘കർത്താവിൽനിന്ന്, ആത്മാവിൽനിന്നുള്ളതുപോലെ’; മറ്റൊരു സാധ്യത, ‘കർത്താവിന്റെ ആത്മാവിൽനിന്നുള്ളതുപോലെ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: മൂടുപടം നീക്കപ്പെട്ട മുഖത്തോടെ
  rationale: പൂർണകാല കൃദന്തം മൂടുപടം നീക്കിയതിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഏകവചനത്തിലുള്ള സമൂഹപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: δόξαν κυρίου
  choice: കർത്താവിന്റെ മഹത്ത്വം
  rationale: ജനിറ്റീവ് ബന്ധം നേരിട്ട് നൽകുന്നു; κύριος എന്നതിന് പദ്ധതിയുടെ സ്വാഭാവികമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: κατοπτριζόμενοι
  choice: കണ്ണാടിയിലെന്നപോലെ ... ദർശിച്ചുകൊണ്ട്
  rationale: ക്രിയയ്ക്ക് കണ്ണാടിയിൽ നോക്കുക എന്നും കണ്ണാടിപോലെ പ്രതിഫലിപ്പിക്കുക എന്നും അർഥമാകാം. കർത്താവിന്റെ മഹത്ത്വം കാണുന്നതിൽനിന്ന് രൂപാന്തരത്തിലേക്കുള്ള ആശയഗതി കണക്കിലെടുത്ത് ആദ്യ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; മറ്റേ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: അതേ പ്രതിരൂപത്തിലേക്ക്
  rationale: രൂപാന്തരത്തിന്റെ ലക്ഷ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; കർത്താവിന്റെ മഹത്ത്വവും വിശ്വാസികൾ രൂപാന്തരപ്പെടുന്ന പ്രതിരൂപവും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു.
- source_word: μεταμορφούμεθα
  choice: രൂപാന്തരപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല നിഷ്ക്രിയരൂപത്തിലെ തുടരുന്ന പ്രക്രിയയും കർത്തൃബാഹ്യമായ പ്രവർത്തനവും പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: മഹത്ത്വത്തിൽനിന്ന് മഹത്ത്വത്തിലേക്ക്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തപ്രയോഗം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ അതേ സംക്ഷിപ്തതയിൽ നൽകുന്നു.
- source_word: καθάπερ
  choice: എന്നപോലെ
  rationale: താരതമ്യസൂചകമായ സംയോജകത്തിന് സമകാലികവും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: കർത്താവിൽനിന്ന്, ആത്മാവിൽനിന്ന്
  rationale: അത്യന്തം സംക്ഷിപ്തവും വ്യാകരണപരമായി ഒന്നിലധികം രീതിയിൽ ഗ്രഹിക്കാവുന്നതുമായ ഗ്രീക്ക് പദബന്ധത്തിന്റെ സമാനാധികരണസാധ്യത തുറന്നുവെക്കുന്നു; വ്യക്തമായ മറ്റു വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: രണ്ടിടത്തും അർഥത്തിനും ഗൗരവമുള്ള ആധുനിക മലയാള ശൈലിക്കും യോജിക്കുന്ന പതിവ് പരിഭാഷ.
theological_decisions:
- issue: κατοπτριζόμενοι എന്ന ക്രിയയുടെ അർഥം
  choice: കണ്ണാടിയിലെന്നപോലെ കർത്താവിന്റെ മഹത്ത്വം ദർശിക്കുക
  alternative: കണ്ണാടിപോലെ കർത്താവിന്റെ മഹത്ത്വം പ്രതിഫലിപ്പിക്കുക
  rationale: മഹത്ത്വം കാണുന്നതിനെ തുടർന്ന് രൂപാന്തരം സംഭവിക്കുന്നു എന്ന സന്ദർഭഗതി ‘ദർശിക്കുക’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ മറുവായനയ്ക്കും യഥാർഥ ഭാഷാപരമായ അടിസ്ഥാനമുള്ളതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: അവസാന പദബന്ധത്തിൽ κυρίου എന്നും πνεύματος എന്നും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവിൽനിന്ന്, ആത്മാവിൽനിന്ന്
  alternative: ആത്മാവായ കർത്താവിൽനിന്ന്; അല്ലെങ്കിൽ കർത്താവിന്റെ ആത്മാവിൽനിന്ന്
  rationale: ഗ്രീക്ക് പദബന്ധം സംക്ഷിപ്തവും ദ്വയാർഥസാധ്യതയുള്ളതുമാണ്. മുഖ്യപാഠം സമാനാധികരണത്തിന്റെ സാധ്യത തുറന്നുവെക്കുകയും കൂടുതൽ വ്യക്തമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും സംക്ഷിപ്തതയും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; യഥാർഥ ദ്വയാർഥങ്ങൾ അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
