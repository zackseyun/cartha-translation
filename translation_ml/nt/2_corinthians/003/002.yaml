reference: 2 Corinthians 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: ml
  text: നിങ്ങൾ തന്നെയാണ് ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ എഴുതപ്പെട്ടതും എല്ലാ മനുഷ്യരാലും അറിയപ്പെടുകയും വായിക്കപ്പെടുകയും ചെയ്യുന്ന ഞങ്ങളുടെ കത്ത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: ഞങ്ങളുടെ കത്ത്
  rationale: ἐπιστολή എന്നത് എഴുതിയ സന്ദേശത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും രൂപകം വ്യക്തമായി നിലനിർത്തുന്നതുമായ പദം ‘കത്ത്’ ആണ്. ἡμῶν ഉടമസ്ഥത സൂചിപ്പിക്കുന്നു.
- source_word: ὑμεῖς ἐστε
  choice: നിങ്ങൾതന്നെയാണ്
  rationale: പ്രകടമായ ὑμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ ‘തന്നെ’ ചേർത്ത് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγγεγραμμένη
  choice: എഴുതപ്പെട്ടതും
  rationale: പൂർണ്ണകാല നിഷ്ക്രിയ കൃദന്തം ഇപ്പോഴും എഴുതപ്പെട്ട നിലയിൽ ഉള്ളതിനെ സൂചിപ്പിക്കുന്നു; ‘എഴുതപ്പെട്ട’ രൂപകം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ അകസ്ഥലാർഥവും ബഹുവചനമായ καρδίαις എന്ന രൂപവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: γινωσκομένη
  choice: അറിയപ്പെടുകയും
  rationale: γινώσκω ഇവിടെ ‘അറിയുക/തിരിച്ചറിയുക’ എന്ന അർഥം നൽകുന്നു. ‘അറിയപ്പെടുക’ കൃദന്തരൂപത്തിന്റെ നിഷ്ക്രിയതയും ἀναγινωσκομένηയുമായുള്ള കൂട്ടുചേരലും നിലനിർത്തുന്നു.
- source_word: ἀναγινωσκομένη
  choice: വായിക്കപ്പെടുകയും
  rationale: കത്ത് എന്ന രൂപകത്തെ നേരിട്ട് തുടരുന്ന ‘വായിക്കപ്പെടുക’ എന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: എല്ലാവരാലും
  rationale: ὑπό നിഷ്ക്രിയ ക്രിയയുടെ കർത്താവിനെയും πάντων ἀνθρώπων സർവമനുഷ്യരെയും സൂചിപ്പിക്കുന്നു; ലിംഗനിരപേക്ഷവും സ്വാഭാവികവുമായ മലയാളരൂപം ‘എല്ലാവരാലും’ ആണ്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ കത്ത്-രൂപകവും കൃദന്തങ്ങളുടെ നിഷ്ക്രിയ സ്വഭാവവും സംരക്ഷിച്ചിരിക്കുന്നു; ആശയവ്യക്തതയ്ക്കായി ഡാഷ് ഉപയോഗിച്ചു.
