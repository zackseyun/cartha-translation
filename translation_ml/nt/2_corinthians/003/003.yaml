id: 2CO.3.3
reference: 2 Corinthians 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: ml
  text: നിങ്ങൾ മശീഹയിൽനിന്നുള്ള ഒരു കത്താണെന്ന്[a][b] വ്യക്തമായി വെളിപ്പെടുന്നു—ഞങ്ങളുടെ ശുശ്രൂഷയിലൂടെ ലഭിച്ചതും മഷികൊണ്ടല്ല, ജീവനുള്ള ദൈവത്തിന്റെ ആത്മാവിനാൽ എഴുതപ്പെട്ടതും കൽപ്പലകകളിലല്ല, മാംസമുള്ള ഹൃദയങ്ങളാകുന്ന പലകകളിൽ എഴുതപ്പെട്ടതുമായ കത്ത്.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മശീഹയുടെ ഒരു കത്ത്.’ ഗ്രീക്ക് ഷഷ്ഠീരൂപം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ നൽകാം; മുഖ്യപാഠം ഉറവിടമോ കർത്തൃത്വമോ എന്ന സാധ്യതയേറിയ അർഥം നൽകുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘മശീഹ’ എന്നത് Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷയാണ്; പരമ്പരാഗതമായി ‘ക്രിസ്തു.’
    reason: lexical_alternative
  - marker: c
    text: ‘മാംസമുള്ള ഹൃദയങ്ങൾ’ പഴയനിയമത്തിലെ പുതിയ ഉടമ്പടി ദൃശ്യഭാഷയെ, പ്രത്യേകിച്ച് യെഹെസ്കേൽ 11:19; 36:26 എന്നിവയെ, പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: d
    text: അഥവാ, ‘മാംസമുള്ള ഹൃദയങ്ങളുടെ പലകകളിൽ.’ ഗ്രീക്ക് പദക്രമം ഈ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപത്തിനും ഇടനൽകുന്നു.
    reason: alternative_rendering
lexical_decisions:
- source_word: φανερούμενοι
  choice: വ്യക്തമായി തെളിയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപം ‘വെളിവാക്കപ്പെടുന്നു/വ്യക്തമാകുന്നു’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കുമ്പോഴും അവർ കത്താണെന്ന കാര്യം പരസ്യമായി പ്രകടമാകുന്നു എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπιστολὴ
  choice: കത്ത്
  rationale: ആധുനിക മലയാളത്തിലെ ലളിതവും സ്വാഭാവികവുമായ പദം; രൂപകവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയിൽനിന്നുള്ള
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ‘മശീഹ’ എന്നു നൽകുന്നു. ഇവിടെ ഷഷ്ഠീവ്യാകരണം കത്തിന്റെ ഉറവിടത്തെയോ കർത്തൃത്വത്തെയോ സൂചിപ്പിക്കാമെന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘മശീഹയിൽനിന്നുള്ള’ എന്നു നൽകിയിരിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: ഞങ്ങൾ ശുശ്രൂഷിച്ച
  rationale: അപ്പൊസ്തലിക സഹപ്രവർത്തകരുടെ ഇടനിലശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു. ‘എത്തിച്ച’ എന്നു ചുരുക്കുന്നത് കത്ത് കൊണ്ടുപോകുന്നതിലേക്കു മാത്രം അർഥം പരിമിതപ്പെടുത്താം; ‘ശുശ്രൂഷിച്ച’ മൂലത്തിലെ διακονέω ആശയം നിലനിർത്തുന്നു.
- source_word: ἐγγεγραμμένη
  choice: എഴുതപ്പെട്ടത്
  rationale: മഷിയും ആത്മാവും തമ്മിലുള്ള വൈരുധ്യത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: μέλανι
  choice: മഷികൊണ്ട്
  rationale: എഴുത്തുരൂപകത്തിലെ നേരിട്ടുള്ള പദസമം.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: ജീവനുള്ള ദൈവത്തിന്റെ ആത്മാവുകൊണ്ട്
  rationale: ദൈവികമായി ഉള്ളിൽ എഴുതപ്പെടുന്നതെന്ന ഉടമ്പടി-സന്ദർഭം ദൈവത്തിന്റെ ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ പൂർണ്ണവാക്യം സംരക്ഷിക്കുന്നു.
- source_word: πλαξὶν λιθίναις
  choice: കൽപ്പലകകളിൽ
  rationale: സീനായിലെ കൽപ്പലകകളിലേക്കുള്ള സൂചന മലയാളത്തിൽ ചുരുക്കവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: മാംസമുള്ള ഹൃദയങ്ങളാകുന്ന പലകകളിൽ
  rationale: പലകകൾ തന്നെയാണ് മാംസമുള്ള ഹൃദയങ്ങൾ എന്ന സമാനാധികരണബന്ധം വ്യക്തമാക്കുകയും യെഹെസ്കേലിലെ പുതിയ-ഹൃദയ പ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന ഷഷ്ഠീരൂപത്തിന്റെ ബന്ധം
  choice: മശീഹയിൽനിന്നുള്ള ഒരു കത്ത്
  alternative: മശീഹയുടെ ഒരു കത്ത്
  rationale: കത്തിന്റെ ഉറവിടം/കർത്താവ് മശീഹയാണെന്നതാണ് സന്ദർഭത്തിലെ സാധ്യതയേറിയ അർഥം. എങ്കിലും ഗ്രീക്ക് ഷഷ്ഠിയുടെ കൂടുതൽ പൊതുവായ ബന്ധം നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: πνεύματι എന്നതിന്റെ സൂചന
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള ആത്മാവ്/ജീവശ്വാസം
  rationale: മഷിയോടുള്ള വൈരുധ്യവും പുതിയ ഉടമ്പടിയുടെ പശ്ചാത്തലവും ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- issue: കല്ലും മാംസമുള്ള ഹൃദയവും തമ്മിലുള്ള ഉടമ്പടി-വൈരുധ്യം
  choice: കൽപ്പലകകളിലല്ല, മാംസമുള്ള ഹൃദയങ്ങളാകുന്ന പലകകളിൽ
  alternative: കൽപ്പലകകളിലല്ല, മാംസമുള്ള ഹൃദയങ്ങളുടെ പലകകളിൽ
  rationale: പുറമേ എഴുതിയ കൽപ്പലകയും ഉള്ളിൽ എഴുതപ്പെട്ട മനുഷ്യഹൃദയവും തമ്മിലുള്ള പൗലോസിന്റെ വൈരുധ്യം നിലനിർത്തുന്നു; ‘മാംസമുള്ള’ എന്നത് ഇവിടെ പാപസ്വഭാവമല്ല, കല്ലിനു വിരുദ്ധമായ ജീവിക്കുന്ന മൃദുഹൃദയമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യബന്ധം നിലനിർത്താൻ അർദ്ധവിരാമങ്ങളും ദീർഘവിരാമവും ഉപയോഗിച്ചു. ‘ശുശ്രൂഷിച്ച’ എന്ന സഭാപരിചിത പദം ഇവിടെ സാങ്കേതിക പദവിയെ സൂചിപ്പിക്കാതെ ഇടനിലസേവനത്തെ സൂചിപ്പിക്കുന്നു. ‘മാംസമുള്ള ഹൃദയം’ എന്ന വാചകം അല്പം അസാധാരണമായിരുന്നാലും പഴയനിയമ പ്രതിധ്വനി സംരക്ഷിക്കാനായി ഉദ്ദേശപൂർവം നിലനിർത്തി.
