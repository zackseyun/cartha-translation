id: 2CO.3.9
reference: 2 Corinthians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: ml
  text: ശിക്ഷാവിധിയുടെ ശുശ്രൂഷ മഹത്വത്തോടുകൂടി വന്നതാണെങ്കിൽ, നീതിയുടെ[a] ശുശ്രൂഷ എത്രയധികം മഹത്വത്തിൽ സമൃദ്ധമാണ്!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായത്തിന്റെ.”
    reason: δικαιοσύνη എന്ന പദത്തിന്റെ നിയമന്യായവുമായി ബന്ധപ്പെട്ട മറ്റൊരു സാധ്യത സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: διακονία
  choice: ശുശ്രൂഷ
  rationale: ഇവിടെ ഒറ്റപ്പെട്ട സേവനപ്രവൃത്തിയെയല്ല, രണ്ടു ഉടമ്പടികളുമായി ബന്ധപ്പെട്ട ദൈവിക ദൗത്യങ്ങളെയാണ് പൗലോസ് താരതമ്യം ചെയ്യുന്നത്; അതിനാൽ ‘ശുശ്രൂഷ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: κατάκρισις
  choice: ശിക്ഷാവിധി
  rationale: കുറ്റക്കാരനെന്ന വിധിയെയും അതിന്റെ ശിക്ഷാത്മക ഫലത്തെയും സൂചിപ്പിക്കുന്ന നിയമപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: പുതിയ ഉടമ്പടിയുടെ അതിശ്രേഷ്ഠമായ മഹത്ത്വത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ തുടർച്ചയായ വാദം നിലനിർത്തുന്ന, സ്വാഭാവികമായ മലയാള പദമാണ്.
- source_word: πολλῷ μᾶλλον
  choice: എത്രയധികം
  rationale: കുറഞ്ഞതിൽനിന്ന് കൂടുതലിലേക്കുള്ള പൗലോസിന്റെ ശക്തമായ താരതമ്യത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: περισσεύω
  choice: സമൃദ്ധമാകുന്നു
  rationale: അളവിൽ കവിഞ്ഞുനിൽക്കുക എന്ന ആശയം നിലനിർത്തുകയും ‘മഹത്ത്വത്തിൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവസന്നിധിയിലെ ശരിയായ നിലയും നൈതിക നീതിയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദമാണ്; ‘ന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രണ്ടു ശുശ്രൂഷകളുടെ താരതമ്യത്തിൽ δικαιοσύνη എന്ന പദത്തിന്റെ അർഥം
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; എന്നാൽ നിയമന്യായത്തിന്റെ സൂക്ഷ്മഭാവം സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ക്രിയയില്ലാത്ത ആദ്യ ഗ്രീക്ക് ഉപവാക്യം മലയാളത്തിൽ അവതരിപ്പിക്കൽ
  choice: മഹത്ത്വത്തോടുകൂടി വന്നതാണെങ്കിൽ
  alternative: മഹത്ത്വം ഉണ്ടായിരുന്നെങ്കിൽ
  rationale: മൂലത്തിലെ ക്രിയാരഹിത ഘടന മലയാളത്തിൽ പൂർണമാക്കേണ്ടതുണ്ട്. ‘വന്നതാണെങ്കിൽ’ മഹത്ത്വം ആ ശുശ്രൂഷയോടൊപ്പം ഉണ്ടായിരുന്നുവെന്ന ആശയം വ്യക്തമാക്കുന്നു; അതിനെ രണ്ടാം ഉപവാക്യത്തിലെ ‘സമൃദ്ധമാകുന്നു’ എന്നതിനെ തുല്യമായ അവകാശവാദമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സഭാപരമായി പരിചിതമായെങ്കിലും സാധാരണ വായനക്കാർക്കും മനസ്സിലാകുന്ന ഗൗരവമുള്ള ഭാഷയാണ് ഉപയോഗിച്ചത്. മൂലത്തിലെ ശക്തമായ താരതമ്യം ‘എത്രയധികം’ എന്ന പ്രയോഗത്തിലൂടെയും അവസാനത്തെ ആശ്ചര്യചിഹ്നത്തിലൂടെയും പ്രകടമാക്കി.
