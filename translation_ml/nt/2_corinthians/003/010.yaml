id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: ml
  text: എന്തെന്നാൽ, തീർച്ചയായും, മുമ്പ് തേജസ്സ് ലഭിച്ചിരുന്നത്, അതിനെ അതിശയിക്കുന്ന തേജസ്സ്[a] നിമിത്തം, ഈ കാര്യത്തിൽ തേജസ്സ് ലഭിച്ചിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിശയമാർന്ന തേജസ്സ്.”
    reason: ὑπερβαλλούσης എന്ന പദം സന്ദർഭത്തിൽ മുൻ തേജസ്സിനെ മറികടക്കുന്ന തേജസ്സിനെ സൂചിപ്പിക്കുന്നു; അതിന് “അതിശയമാർന്ന” എന്ന ഗുണാർഥത്തിലുള്ള വിവർത്തനവും സാധ്യമാണ്.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: വാസ്തവത്തിൽ
  rationale: γάρ നൽകുന്ന വിശദീകരണബന്ധവും καί നൽകുന്ന നേരിയ ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: δεδόξασται
  choice: തേജസ്സില്ല
  rationale: ഗ്രീക്കിലെ പൂർണകാല കർമണി രൂപം മലയാളത്തിൽ അക്ഷരാർഥമായി ആവർത്തിച്ചാൽ അസ്വാഭാവികമാകും. മുൻപ് യഥാർഥത്തിൽ ലഭിച്ച തേജസ്സ് ഇപ്പോഴത്തെ താരതമ്യത്തിൽ തേജസ്സായി നിലകൊള്ളുന്നില്ലെന്ന വിരോധാഭാസം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τὸ δεδοξασμένον
  choice: മുമ്പ് തേജസ്സ് ലഭിച്ചതിന്
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന പൂർണകാല കർമണി കൃദന്തത്തെ അധികമായി ഒരു നിർദ്ദിഷ്ട നാമം ചേർക്കാതെ അവതരിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ മുൻകാല തേജസ്സും സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: ഈ കാര്യത്തിൽ
  rationale: നിഷേധം സമ്പൂർണമല്ലെന്നും നിർദ്ദിഷ്ടമായ താരതമ്യപരിധിക്കുള്ളിലാണെന്നും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: εἵνεκεν
  choice: നിമിത്തം
  rationale: കാരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: അതിനെ അതിശയിക്കുന്ന തേജസ്സ്
  rationale: ὑπερβαλλούσης എന്ന കൃദന്തത്തിന്റെ താരതമ്യബലം പ്രകടമാക്കുന്നു. ‘അതിനെ’ എന്നത് സന്ദർഭത്തിൽ നിന്നു വ്യക്തമാകുന്ന മുൻ തേജസ്സിനെ സൂചിപ്പിക്കാൻ ചേർത്തതാണ്.
- source_word: δόξα / δεδοξασμένον wordplay
  choice: തേജസ്സ് ലഭിച്ചത് ... തേജസ്സ്
  rationale: δοξ- പദകുടുംബത്തിന്റെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തി പൗലോസിന്റെ വാക്ചാതുര്യവും ആശയബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മുൻ ഉടമ്പടിയുടെ ശുശ്രൂഷയ്ക്ക് യാതൊരു തേജസ്സുമില്ലെന്ന് പൗലോസ് സമ്പൂർണമായി നിഷേധിക്കുന്നുവോ, അതോ താരതമ്യപരമായി പറയുന്നുവോ?
  choice: '‘ഈ കാര്യത്തിൽ’ എന്ന പരിധിക്കുള്ള താരതമ്യനിഷേധം: അതിശയിക്കുന്ന തേജസ്സിനോട് താരതമ്യപ്പെടുത്തുമ്പോൾ മുൻ തേജസ്സ് തേജസ്സില്ലാത്തതുപോലെ ആകുന്നു.'
  alternative: മുൻ ശുശ്രൂഷയ്ക്ക് യഥാർഥ തേജസ്സ് ഒരിക്കലും ഉണ്ടായിരുന്നില്ലെന്ന സമ്പൂർണ നിഷേധം.
  rationale: ἐν τούτῳ τῷ μέρει നിഷേധത്തെ പരിമിതപ്പെടുത്തുന്നു; ചുറ്റുപാടുള്ള വാക്യങ്ങൾ മുൻ ശുശ്രൂഷയ്ക്ക് തേജസ്സ് ഉണ്ടായിരുന്നുവെന്ന് സമ്മതിച്ചുകൊണ്ടുതന്നെ അതിനെ വലിയ തേജസ്സ് മറികടക്കുന്നതായി പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തേജസ്സ്’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ δοξ- പദപ്രയോഗം പ്രതിഫലിപ്പിക്കുന്നു. കർമണി പൂർണകാലത്തെ അക്ഷരാർഥത്തിൽ ആവർത്തിക്കുന്ന അസ്വാഭാവിക ഘടന ഒഴിവാക്കി താരതമ്യവിരോധാഭാസം നിലനിർത്തിയിരിക്കുന്നു.
