  to: ആത്മാവിന്റെ ശുശ്രൂഷ അതിലുമധികം മഹത്വത്തിൽ ആയിരിക്കാതെ എങ്ങനെ ഇരിക്കും?[a]
  rationale: The revision restores πῶς with ‘എങ്ങനെ’ and preserves the Greek negative rhetorical-question structure through ‘ആയിരിക്കാതെ എങ്ങനെ ഇരിക്കും?’ It retains the comparative ‘അതിലുമധികം,’ the contextual reference of ‘ആത്മാവിന്റെ,’ and the formal ‘in glory’ wording. ‘മഹത്വം’ replaces the less standard spelling without changing meaning.
