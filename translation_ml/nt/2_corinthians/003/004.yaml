id: 2CO.3.4
reference: 2 Corinthians 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πεποίθησιν δὲ τοιαύτην ἔχομεν διὰ τοῦ Χριστοῦ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: ml
  text: മശീഹയിലൂടെ ദൈവത്തോടുള്ള ഇത്തരമൊരു ആത്മവിശ്വാസം നമുക്കുണ്ട്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിലൂടെ.”
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ദൈവത്തിലേക്ക്.” സന്ദർഭാർഥത്തിൽ “ദൈവസന്നിധിയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεποίθησιν
  choice: ഉറപ്പ്
  rationale: സന്ദർഭത്തിൽ ശുശ്രൂഷയ്ക്കുള്ള യോഗ്യതയെക്കുറിച്ചുള്ള സ്ഥിരമായ ആത്മവിശ്വാസമാണ് സൂചിപ്പിക്കുന്നത്; ‘ഉറപ്പ്’ അതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δὲ τοιαύτην
  choice: ഇങ്ങനെയുള്ള
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞതിലേക്കു വിരൽചൂണ്ടുന്ന τοιαύτην എന്ന പദത്തിന്റെ ഗുണസൂചകബലം നിലനിർത്തുന്നു; δέ ഇവിടെ ലഘുവായ ബന്ധകമായതിനാൽ മലയാള വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἔχομεν
  choice: നമുക്കുണ്ട്
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഉടമസ്ഥതാസൂചന മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: διὰ τοῦ Χριστοῦ
  choice: മശീഹയിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മധ്യസ്ഥതയെയോ ഉപാധിയെയോ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘-യിലൂടെ’ യോജിക്കുന്നു. Χριστός ഇവിടെ പദവിയായി എടുത്ത് ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: πρὸς τὸν θεόν
  choice: ദൈവത്തോടുള്ള
  rationale: πρός എന്നതിന്റെ ദൈവാഭിമുഖമായ ബന്ധാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥമായ ‘ദൈവത്തിലേക്ക്’ ഇവിടെ അസ്വാഭാവികമാണ്.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός പദവിയുടെ ഭാവം നിലനിർത്തുന്നതിനായി ‘മശീഹ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- issue: πρὸς τὸν θεόν എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: ദൈവത്തോടുള്ള
  alternative: ദൈവസന്നിധിയിൽ
  rationale: ഉറപ്പിന്റെ ദൈവാഭിമുഖതയും ബന്ധപരമായ ദിശയും നിലനിർത്തുന്നു; ‘ദൈവസന്നിധിയിൽ’ എന്നത് സാധ്യമായ സന്ദർഭാർഥമാണെങ്കിലും πρός എന്നതിന്റെ ദിശാസൂചനയെ കുറച്ച് കൂടുതൽ വ്യാഖ്യാനിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ദൈവാഭിമുഖത സ്വാഭാവികമാക്കാൻ πρὸς τὸν θεόν വാക്യത്തിന്റെ തുടക്കത്തിൽ ‘ദൈവത്തോടുള്ള’ എന്നു ചേർത്തു; യാതൊരു പ്രത്യേക സഭാവിഭാഗീയ വ്യാഖ്യാനവും ഉൾപ്പെടുത്തിയിട്ടില്ല.
