    issue: ‘ഉറപ്പ്’ for Πεποίθησιν is semantically narrower than the context.
    rationale: It may suggest objective certainty or an assurance/guarantee, whereas Paul’s term denotes confidence. ‘ആത്മവിശ്വാസം’ preserves the personal yet Godward confidence of the Greek more closely.
