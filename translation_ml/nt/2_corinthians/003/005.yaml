source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: ml
  text: എന്തെങ്കിലും ഞങ്ങളിൽനിന്ന് ഉത്ഭവിക്കുന്നതാണെന്ന് കണക്കാക്കാൻ ഞങ്ങൾ ഞങ്ങളിൽത്തന്നെ പര്യാപ്തരാണെന്നല്ല[a]; ഞങ്ങളുടെ പര്യാപ്തത ദൈവത്തിൽനിന്നാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പര്യാപ്തർ” എന്നതിന് “യോഗ്യർ” അല്ലെങ്കിൽ “പ്രാപ്തർ” എന്നും, “പര്യാപ്തത” എന്നതിന് “യോഗ്യത” അല്ലെങ്കിൽ “പ്രാപ്തി” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: എന്നല്ല
  rationale: പൗലോസ് മുമ്പുള്ള പ്രസ്താവനയെ നിഷേധിക്കാതെ വിശദീകരിക്കുകയും പരിമിതപ്പെടുത്തുകയും ചെയ്യുന്ന വാക്യഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: നാം സ്വയം പ്രാപ്തരാണ്
  rationale: സ്വന്തമായ ഉറവിടത്തിൽനിന്നുള്ള പര്യാപ്തത എന്ന ആശയം വ്യക്തമാക്കുന്നു; ἱκανοί എന്നതിനും പിന്നീടുള്ള ἱκανότης എന്നതിനും ഒരേ പദമൂലം ഉപയോഗിച്ച് ബന്ധം സൂക്ഷിക്കുന്നു.
- source_word: λογίσασθαί
  choice: കണക്കാക്കാൻ
  rationale: മനസ്സിൽ വിലയിരുത്തുക, ഗണിക്കുക എന്ന ഗ്രീക്ക് ക്രിയയുടെ ബൗദ്ധിക അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: നിഷേധാത്മക സന്ദർഭത്തിലെ വിശാലവും അനിശ്ചിതവുമായ വ്യാപ്തി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς ἐξ αὑτῶν
  choice: നമ്മിൽനിന്നുതന്നെ ഉത്ഭവിച്ചതായി
  rationale: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ἐξ എന്നതിന്റെ ശക്തി വ്യക്തമാക്കുന്നു; വെറും ‘നമ്മിൽനിന്ന്’ എന്നതിലേക്കാൾ മലയാളത്തിൽ ആശയം പൂർണമാകുന്നു.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: നമ്മുടെ പ്രാപ്തി
  rationale: ആവശ്യമായ ശേഷി/പര്യാപ്തത എന്ന അർഥം നൽകുകയും ἱκανοί എന്നതിനോടുള്ള പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നാണ്
  rationale: ദൈവമാണ് പ്രാപ്തിയുടെ ഉറവിടം എന്ന ഊന്നൽ ലളിതമായും നേരിട്ടും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യപ്രാപ്തിയെക്കുറിച്ചുള്ള പൗലോസിന്റെ പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: സ്വയം ഉത്ഭവിക്കുന്ന പ്രാപ്തിയെക്കുറിച്ചുള്ള വിശാലമായ പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
  alternative: അപ്പൊസ്തലിക ശുശ്രൂഷയ്ക്കുള്ള യോഗ്യതയെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാം.
  rationale: സമീപസന്ദർഭം ശുശ്രൂഷയെക്കുറിച്ചാണെങ്കിലും ഗ്രീക്ക് വാചകം അതിനേക്കാൾ വിശാലമാണ്; അതിനാൽ വിവർത്തനം തന്നെ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രാപ്തർ/പ്രാപ്തി’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ἱκανοί/ἱκανότης പദബന്ധം സൂക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
