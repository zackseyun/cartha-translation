id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: ml
  text: പുതിയ ഉടമ്പടിയുടെ സേവകരായി[a] നമ്മെയും പ്രാപ്തരാക്കിയത് അവിടുന്നാണ്—അക്ഷരത്തിന്റെയല്ല, ആത്മാവിന്റെ[b] സേവകരായി. അക്ഷരം[c] കൊല്ലുന്നു; ആത്മാവോ ജീവിപ്പിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേവകർ’ എന്നതിന് ‘ശുശ്രൂഷകർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: രണ്ടിടത്തും ‘ആത്മാവ്’ എന്നതിന് പൊതുവായ ‘spirit’ എന്ന അർഥവും സാധ്യമാണ്; ഗ്രീക്ക് മൂലപാഠം വലിയക്ഷരവും ചെറിയക്ഷരവും കൊണ്ട് വ്യത്യാസം കാണിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: ‘അക്ഷരം’ എന്നത് ‘എഴുതപ്പെട്ട നിയമസംഹിത’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: പ്രാപ്തരാക്കിയതു
  rationale: ശുശ്രൂഷയ്ക്കാവശ്യമായ കഴിവും യോഗ്യതയും ദൈവം നൽകിയെന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; വെറും ഔദ്യോഗിക യോഗ്യത നൽകുക എന്ന ആശയത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: διακόνους
  choice: സേവകർ
  rationale: പിൽക്കാല സഭാപദവിയുടെ അർഥം അനാവശ്യമായി ചുമത്താതെ, διάκονος എന്ന പദത്തിലെ സേവനഭാവം നിലനിർത്തുന്നു. ‘ശുശ്രൂഷകർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: καινῆς διαθήκης
  choice: പുതിയ ഉടമ്പടിയുടെ
  rationale: ഗ്രീക്കിലെ സ്വാഭാവിക ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു. മലയാളത്തിൽ അനിശ്ചിതത്വം സൂചിപ്പിക്കാൻ ‘ഒരു’ നിർബന്ധമല്ല; അത് ഒഴിവാക്കുന്നത് പൗലൊസിന്റെ ഉടമ്പടിസൂചനയും സ്വാഭാവിക ശൈലിയും സംരക്ഷിക്കുന്നു.
- source_word: γράμματος / γράμμα
  choice: അക്ഷരം
  rationale: πνεῦμα എന്നതിനോടുള്ള പൗലൊസിന്റെ ചുരുക്കവും ശക്തവുമായ രൂപകവിരുദ്ധത നിലനിർത്തുന്നു. ‘എഴുതപ്പെട്ട നിയമസംഹിത’ കൂടുതൽ വ്യാഖ്യാനാത്മകമായതിനാൽ അടിക്കുറിപ്പിൽ മാത്രം നൽകുന്നു.
- source_word: πνεύματος / πνεῦμα
  choice: ആത്മാവ്
  rationale: പുതിയ ഉടമ്പടിയുടെ ഈ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന. ഗ്രീക്ക് ലിപി വലിയക്ഷരംകൊണ്ട് ഈ വ്യത്യാസം അടയാളപ്പെടുത്താത്തതിനാൽ ‘ആത്മഭാവം/ആത്മിക അർഥം’ എന്ന പൊതുവായ വായനയുടെ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀποκτέννει
  choice: കൊല്ലുന്നു
  rationale: മൂലത്തിലെ വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: ζῳοποιεῖ
  choice: ജീവിപ്പിക്കുന്നു
  rationale: ‘ജീവനുള്ളവനാക്കുന്നു/ജീവൻ നൽകുന്നു’ എന്ന അർഥം ചുരുക്കമായും സ്വാഭാവികമായും നൽകുകയും ‘കൊല്ലുന്നു’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നത് പരിശുദ്ധാത്മാവിനെയോ പൊതുവായ ‘ആത്മാവ്/ആത്മിക അർഥം’ എന്ന ആശയത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ആത്മാവ് (പരിശുദ്ധാത്മാവ് എന്ന സൂചനയോടെ)
  alternative: ആത്മഭാവം അല്ലെങ്കിൽ ആത്മിക അർഥം
  rationale: പൗലൊസിന്റെ പുതിയ-ഉടമ്പടി സന്ദർഭവും ജീവിപ്പിക്കുന്ന പ്രവർത്തനവും പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് മൂലപാഠത്തിൽ വലിയക്ഷരം-ചെറിയക്ഷരം വ്യത്യാസമില്ലാത്തതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: γράμμα എന്നതിന്റെ പരിധി
  choice: അക്ഷരം
  alternative: എഴുതപ്പെട്ട നിയമസംഹിത
  rationale: ‘അക്ഷരം’ മൂലത്തിലെ രൂപകപരമായ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു; ‘നിയമസംഹിത’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകുന്നത് പദത്തിന്റെ അർഥം മുൻകൂട്ടി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവിടുന്ന്’ എന്ന ആദരസൂചക സർവനാമം മുൻവാക്യത്തിലെ ദൈവസൂചനയുമായി ബന്ധിപ്പിക്കുന്നു. ഡാഷും അർധവിരാമവും ഗ്രീക്കിലെ പ്രതിവിരുദ്ധ ഘടന വ്യക്തമായി കേൾപ്പിക്കുന്നു; പദവിസൂചകമായ സഭാഭാഷ പരമാവധി ഒഴിവാക്കിയിരിക്കുന്നു.
