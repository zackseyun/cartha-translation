id: 2CO.3.16
reference: 2 Corinthians 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ കർത്താവിലേക്കു തിരിയുമ്പോഴെല്ലാം, മൂടുപടം നീക്കപ്പെടുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഒരാൾ കർത്താവിലേക്കു തിരിയുമ്പോൾ.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘മൂടുപടം എടുത്തുമാറ്റപ്പെടുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: എന്നാൽ ... തിരിയുമ്പോഴെല്ലാം
  rationale: δέയുടെ വിരുദ്ധത സൂചിപ്പിക്കുന്ന ബന്ധവും ἡνίκα ... ἐὰν സഹിതമുള്ള അനിശ്ചിതമായ കാലാർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιστρέψῃ
  choice: തിരിയുന്നു
  rationale: പശ്ചാത്താപം, മതപരിവർത്തനം തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ട ആശയങ്ങൾ ചേർക്കാതെ ദിശാമാറ്റത്തിന്റെ രൂപകം സംരക്ഷിക്കുന്നു; കാലോപവാക്യത്തിൽ ഇത് ‘തിരിയുമ്പോഴെല്ലാം’ എന്നു വരുന്നു.
- source_word: πρὸς κύριον
  choice: കർത്താവിലേക്കു
  rationale: πρός എന്നതിന്റെ വ്യക്തിയിലേക്കുള്ള ദിശാബോധം ‘-ലേക്കു’ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κύριον
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദവിക്കുള്ള സ്ഥിരവും മാന്യവുമായ മലയാളപരിഭാഷയാണ്; ഈ വാക്യത്തിൽ ക്രിസ്തുവെന്നോ ആത്മാവെന്നോ കൂടുതൽ വ്യക്തമാക്കി ചേർക്കുന്നില്ല.
- source_word: περιαιρεῖται
  choice: നീക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി പ്രയോഗം നിലനിർത്തുകയും പ്രവർത്തകനെ പ്രത്യേകം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ κάλυμμα
  choice: മൂടുപടം
  rationale: മോശെയുടെ മൂടുപടത്തെക്കുറിച്ചുള്ള സന്ദർഭസൂചനയ്ക്ക് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
theological_decisions:
- issue: ἐπιστρέψῃ എന്ന ക്രിയയുടെ വ്യക്തമാക്കാത്ത ഏകവചന കർത്താവ്
  choice: ‘ഒരാൾ’ എന്നു പൊതുവായ അനിശ്ചിത കർത്താവ് ചേർത്തു
  alternative: കർത്താവിലേക്കു തിരിയുമ്പോൾ
  rationale: ഗ്രീക്കിൽ നാമരൂപത്തിലുള്ള കർത്താവ് ഇല്ലെങ്കിലും മലയാളത്തിൽ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ഒരാൾ’ സഹായിക്കുന്നു; വ്യക്തിപരമോ സമൂഹപരമോ ആയ പരിധി ഇതിലൂടെ സിദ്ധാന്തപരമായി ചുരുക്കുന്നില്ല.
- issue: ‘കർത്താവ്’ ആരെന്ന തിരിച്ചറിയൽ
  choice: ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘കർത്താവായ ക്രിസ്തു’ / ‘കർത്താവ്, അതായത് ആത്മാവ്’
  rationale: സമീപസന്ദർഭം കർത്താവും ആത്മാവും തമ്മിലുള്ള സങ്കീർണ ബന്ധം അവതരിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം κύριον എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മൂടുപടം’ സന്ദർഭത്തിലെ മോശെയുടെ veil motif നിലനിർത്തുന്നു. പ്രധാനപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ അനുബന്ധ അടിക്കുറിപ്പുകളുമായി പൊരുത്തപ്പെടുന്നു.
