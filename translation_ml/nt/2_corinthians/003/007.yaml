language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: ml
  text: എന്നാൽ, അക്ഷരങ്ങളാൽ കല്ലുകളിൽ കൊത്തിവെക്കപ്പെട്ട മരണത്തിന്റെ ശുശ്രൂഷ മഹത്ത്വത്തോടെ വന്നെങ്കിൽ, മോശെയുടെ മുഖത്തിലെ മങ്ങിക്കൊണ്ടിരുന്ന[b] മഹത്ത്വം നിമിത്തം ഇസ്രായേൽപുത്രന്മാർക്ക്[a] മോശെയുടെ മുഖത്തേക്ക് ഉറ്റുനോക്കാൻ കഴിയാത്തവിധം,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇസ്രായേൽപുത്രന്മാർ” എന്നത് “ഇസ്രായേല്യർ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ പുരുഷലിംഗപ്രയോഗം കൂടുതൽ അടുത്തായി പ്രതിഫലിപ്പിക്കാനാണ് മുഖ്യപാഠത്തിലെ രൂപം നിലനിർത്തിയത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന” അല്ലെങ്കിൽ “നീങ്ങിപ്പോയിക്കൊണ്ടിരുന്ന.”
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: ശുശ്രൂഷ
  rationale: സേവനത്തെയും ഏല്പിക്കപ്പെട്ട ദൗത്യത്തെയും സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ഉടമ്പടിസംബന്ധമായ പ്രയോഗത്തിന് സ്വാഭാവികവും സഭാപരമായ ഒരു പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാത്തതുമായ പദം.
- source_word: τοῦ θανάτου
  choice: മരണത്തിന്റെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സമ്ബന്ധിക പ്രയോഗം നിലനിർത്തുന്നു; ‘മരണം വരുത്തുന്ന’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: അക്ഷരങ്ങളായി കല്ലുകളിൽ കൊത്തിവെക്കപ്പെട്ട
  rationale: അക്ഷരങ്ങൾ എന്ന ആശയവും കല്ലുകളിൽ പതിപ്പിക്കപ്പെട്ടതെന്ന അർഥവും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘കൽപ്പലകകൾ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: മഹത്ത്വത്തോടെ വന്നു
  rationale: ἐγενήθηയുടെ സംഭവാത്മക ഭാവവും മഹത്ത്വം ഒപ്പമുണ്ടായിരുന്നുവെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: ഉറ്റുനോക്കാൻ കഴിയാത്തവിധം
  rationale: ഫലസൂചക ഘടനയും ἀτενίζω സൂചിപ്പിക്കുന്ന സ്ഥിരവും ശ്രദ്ധാപൂർവവുമായ നോട്ടവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ഇസ്രായേൽപുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗപ്രയോഗത്തെ അടുത്തായി പ്രതിഫലിപ്പിക്കുന്നു; സാധാരണ മലയാളത്തിൽ ‘ഇസ്രായേല്യർ’ എന്നും പറയാം.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: മോശെയുടെ മുഖത്തേക്ക്
  rationale: മുഖം എന്ന മൂർത്തമായ പരാമർശവും നോട്ടത്തിന്റെ ദിശയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καταργουμένην
  choice: മങ്ങിപ്പോയിക്കൊണ്ടിരുന്ന
  rationale: തത്സന്ദർഭത്തിൽ ദൃശ്യമഹത്ത്വം കുറഞ്ഞുപോകുന്നതെന്ന അർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; അവസാനിപ്പിക്കപ്പെടൽ/നീങ്ങിപ്പോകൽ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: καταργουμένην എന്ന പദം ദൃശ്യമഹത്ത്വം മങ്ങുന്നതായോ അവസാനിപ്പിക്കപ്പെടുന്നതായോ വിവർത്തനം ചെയ്യണമോ എന്നത്.
  choice: മങ്ങിപ്പോയിക്കൊണ്ടിരുന്ന
  alternative: അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന; നീങ്ങിപ്പോയിക്കൊണ്ടിരുന്ന
  rationale: ഉടൻ വരുന്ന സന്ദർഭം മോശെയുടെ മുഖത്തിലെ കാണാവുന്ന മഹത്ത്വത്തെക്കുറിച്ചായതിനാൽ മുഖ്യപാഠത്തിൽ ‘മങ്ങിപ്പോയിക്കൊണ്ടിരുന്ന’ എന്ന് നൽകി. എന്നാൽ പഴയ ഉടമ്പടിസംബന്ധമായ ശുശ്രൂഷ അവസാനിപ്പിക്കപ്പെടുന്നതിലേക്കുള്ള പൗലോസിന്റെ വിശാലമായ ആശയബന്ധം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം അൽപവിരാമം നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പുകളുടെ ഉള്ളടക്കവും മുഖ്യപാഠത്തിലെ സ്ഥാനവും തമ്മിലുള്ള പൊരുത്തക്കേട് തിരുത്തി: ‘ഇസ്രായേൽപുത്രന്മാർ’ എന്നിടത്ത് [a], καταργουμένην എന്നിടത്ത് [b] ചേർത്തു.'
