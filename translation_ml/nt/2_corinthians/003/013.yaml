    issue: Footnote anchors are not attached to the expressions they explain.
    rationale: Note a concerns τέλος τοῦ καταργουμένου, and note b concerns τοὺς υἱοὺς Ἰσραήλ. Placing both at the sentence end makes their referents unclear.
