language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: ml
  text: ഞങ്ങൾ മോശെയെപ്പോലെയല്ല; ഇസ്രായേൽമക്കൾ[b] മാഞ്ഞുപോകുന്നതിന്റെ അവസാനത്തിലേക്ക്[a] ഉറ്റുനോക്കാതിരിക്കേണ്ടതിന് അദ്ദേഹം തന്റെ മുഖത്ത് ഒരു മൂടുപടം ഇടാറുണ്ടായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നതിന്റെ ലക്ഷ്യം/പരിണതി.”'
    reason: alternative_reading
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: “ഇസ്രായേലിന്റെ പുത്രന്മാർ”; ഇവിടെ അർഥം “ഇസ്രായേല്യർ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: മോശെയെപ്പോലെ
  rationale: മുൻവാക്യത്തിലെ പൗലോസിന്റെ പ്രസ്താവനയുമായി താരതമ്യം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐτίθει
  choice: ഇടാറുണ്ടായിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപം സൂചിപ്പിക്കുന്ന പതിവായ പ്രവൃത്തിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κάλυμμα
  choice: മൂടുപടം
  rationale: മുഖം മറയ്ക്കുന്ന വസ്തുവിനും തുടർന്നുവരുന്ന പൗലോസിന്റെ രൂപകത്തിനും യോജിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം.
- source_word: πρόσωπον αὐτοῦ
  choice: തന്റെ മുഖത്തിന്മേൽ
  rationale: മോശെയുടെ സ്വന്തം മുഖമെന്ന പ്രത്യാവർത്തകബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: ഉറ്റുനോക്കാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്ന ഘടനയും ἀτενίζω എന്നതിലെ സൂക്ഷിച്ചുനോക്കുക/ദൃഷ്ടി ഉറപ്പിക്കുക എന്ന ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന സെമിറ്റിക് ശൈലിയെ അക്ഷരാർഥത്തിൽ കടുപ്പിക്കാതെ, ബൈബിൾസന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇസ്രായേല്യർ’ എന്ന അർഥത്തിൽ നൽകുന്നു.
- source_word: εἰς τὸ τέλος
  choice: അവസാനം
  rationale: τέλος എന്നതിന്റെ ‘അവസാനം’ എന്ന സാധ്യതയെ മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ‘ലക്ഷ്യം/പരിണതി’ എന്ന യഥാർഥമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ καταργουμένου
  choice: ഇല്ലാതായിക്കൊണ്ടിരുന്നതിന്റെ
  rationale: καταργέω എന്നതിലെ പ്രവർത്തനരഹിതമാകുക/അവസാനത്തിലേക്കു വരുക എന്ന ആശയവും വർത്തമാന കൃദന്തരൂപത്തിലെ പുരോഗമനസ്വഭാവവും നൽകുന്നു; പ്രകാശം തന്നെയാണ് മങ്ങുന്നതെന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: τέλος τοῦ καταργουμένου എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ഇല്ലാതായിക്കൊണ്ടിരുന്നതിന്റെ അവസാനം
  alternative: അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നതിന്റെ ലക്ഷ്യം/പരിണതി
  rationale: സമീപസന്ദർഭത്തിലെ താൽക്കാലികവും നിലനിൽക്കുന്നതുമായവയുടെ വൈരുധ്യത്തോട് ‘അവസാനം’ യോജിക്കുന്നു. എങ്കിലും τέλος എന്നതിന് ‘ലക്ഷ്യം’ അല്ലെങ്കിൽ ‘പരിണതി’ എന്നും καταργουμένου എന്നതിന് ‘അവസാനിപ്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നത്’ എന്നും അർഥമാകാവുന്നതിനാൽ ആ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: മോശെയുടെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്ന πρὸς τὸ μὴ ἀτενίσαι
  choice: ഇസ്രായേൽമക്കൾ ഉറ്റുനോക്കാതിരിക്കേണ്ടതിന്
  alternative: ഇസ്രായേൽമക്കൾ ഉറ്റുനോക്കാതിരിക്കാൻ
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യഘടന നേരിട്ട് സംരക്ഷിക്കുന്നു; മോശെയുടെ പ്രവൃത്തിയുടെ കാരണം സംബന്ധിച്ച് വാചകത്തിൽ ഉള്ളതിലധികം വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സുലഭവുമായ മലയാളം. വാക്യത്തിന്റെ തുടക്കത്തിൽ ഗ്രീക്കിൽ സൂചിതമായ ഒന്നാംപുരുഷ ബഹുവചനത്തെ മലയാളത്തിലെ പൂർണ്ണവാക്യത്തിനായി ‘ഞങ്ങൾ’ എന്നു വ്യക്തമാക്കി. ‘മൂടുപടം’, ‘ഉറ്റുനോക്കുക’, ‘ഇടാറുണ്ടായിരുന്നു’ എന്നീ പദങ്ങൾ യഥാക്രമം രൂപകം, ശക്തമായ ദൃഷ്ടി, പതിവായ പ്രവൃത്തി എന്നിവ സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
