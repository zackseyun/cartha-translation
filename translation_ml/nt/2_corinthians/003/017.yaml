id: 2CO.3.17
reference: 2 Corinthians 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: ml
  text: കർത്താവ് ആത്മാവാണ്[a]; കർത്താവിന്റെ ആത്മാവ് എവിടെയുണ്ടോ, അവിടെ സ്വാതന്ത്ര്യമുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവ് ആത്മാവാണ്” എന്നത്, ഈ ബന്ധം ദൈവശാസ്ത്രപരമായി കൃത്യമായി എങ്ങനെ നിർവചിക്കണമെന്നു വ്യക്തമാക്കാതെ, സന്ദർഭത്തിൽ കർത്താവിനെയും ആത്മാവിനെയും അടുത്ത ബന്ധത്തിൽ സമീകരിക്കുന്ന പ്രസ്താവനയായി മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗവും മലയാള ബൈബിൾഭാഷയിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: രണ്ടിടത്തും പരിശുദ്ധാത്മാവാണ് സൂചിതനാകുന്നത്; വ്യക്തിപരമായ ദൈവിക പരാമർശം നിലനിർത്തുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല; അർധവിരാമവും വാക്യബന്ധവും വഴി ആശയവികാസം സൂചിപ്പിച്ചു
  rationale: ഇവിടെ δέ ഒരു ലഘുവായ ആശയബന്ധമാണ്; ‘ഇപ്പോൾ’ എന്നു ചേർത്താൽ ഗ്രീക്കിലില്ലാത്ത കാലസൂചന തോന്നാം.
- source_word: οὗ
  choice: എവിടെയുണ്ടോ
  rationale: പൊതുവായ സ്ഥാനസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐλευθερία
  choice: സ്വാതന്ത്ര്യം
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ആശയഭാരം സംരക്ഷിക്കുന്നതുമായ തുല്യപദം.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: കർത്താവു ആത്മാവാകുന്നു
  rationale: ഗ്രീക്കിലെ സമീകരണപ്രസ്താവനയെ മയപ്പെടുത്താതെയും അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα κυρίου
  choice: കർത്താവിന്റെ ആത്മാവ്
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും തിരുവെഴുത്തിലെ പരിചിതമായ പ്രയോഗവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവു ആത്മാവാകുന്നു’ എന്ന തിരിച്ചറിയൽപ്രസ്താവനയുടെ കൃത്യമായ ദൈവശാസ്ത്രബന്ധം വിവാദവിധേയമാണ്.
  choice: സമീകരണപ്രസ്താവനയെ ‘കർത്താവു ആത്മാവാകുന്നു’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ഇത് സമ്പൂർണ വ്യക്തിസമീകരണമല്ലാതെ സന്ദർഭപരമോ പ്രവർത്തനപരമോ ഉടമ്പടിസംബന്ധമോ ആയ അടുത്ത തിരിച്ചറിയലായി മനസ്സിലാക്കാം.
  rationale: ഗ്രീക്ക് വാചകം ബന്ധത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നുവെങ്കിലും അതിനെ ദൈവശാസ്ത്രപരമായി എങ്ങനെ നിർവചിക്കണമെന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ മുഖ്യവാചകം ആ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ആകുന്നു’ എന്ന രൂപം സമീകരണത്തിന്റെ വ്യക്തതയും തിരുവെഴുത്തിന് യോജിച്ച ഔന്നത്യവും നിലനിർത്തുന്നു; അനാവശ്യമായ ‘ഇപ്പോൾ’ ഒഴിവാക്കി.
