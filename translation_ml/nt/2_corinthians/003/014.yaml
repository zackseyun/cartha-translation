id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: ml
  text: എന്നാൽ അവരുടെ മനസ്സുകൾ കഠിനമായിപ്പോയി. എന്തെന്നാൽ ഇന്നുവരെ, പഴയ ഉടമ്പടി[a] വായിക്കുമ്പോൾ, അതേ മൂടുപടം നീക്കപ്പെടാതെ നിലനിൽക്കുന്നു; കാരണം മിശിഹായിൽ അത് നീക്കപ്പെടുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, “പഴയ നിയമം.” ഗ്രീക്കിൽ: “പഴയ ഉടമ്പടി.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു സാധ്യത: “കാരണം മിശിഹായിൽ അത് ഇല്ലാതാക്കപ്പെടുന്നു / മാറ്റിവെക്കപ്പെടുന്നു.” ഇവിടെ ‘അത്’ പഴയ ഉടമ്പടിയെ സൂചിപ്പിക്കുന്നതായും വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: കഠിനമായിപ്പോയി
  rationale: ആത്മീയമായ ഗ്രഹണശേഷി മന്ദമാകുകയോ പ്രതിരോധമുള്ളതാകുകയോ ചെയ്തതിനെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയഭാവം നിലനിർത്തുന്നു; മനഃപൂർവമായ കലാപം എന്ന് അതിരുകടന്ന് പറയുന്നില്ല.
- source_word: νοήματα
  choice: മനസ്സുകൾ
  rationale: ഈ സന്ദർഭത്തിൽ ഗ്രഹിക്കാനും മനസ്സിലാക്കാനുമുള്ള ആന്തരിക ശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: എന്തെന്നാൽ ഇന്നുവരെ
  rationale: കാലപരമായ ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: κάλυμμα
  choice: മൂടുപടം
  rationale: ചുറ്റുമുള്ള വാക്യങ്ങളിൽ മോശെയുമായി ബന്ധപ്പെട്ടിരിക്കുന്ന ദൃശ്യരൂപകം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: വായിക്കുമ്പോൾ
  rationale: വായന നടക്കുന്ന സമയത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: παλαιᾶς διαθήκης
  choice: പഴയ ഉടമ്പടി
  rationale: διαθήκη എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ഉടമ്പടി’ നേരിട്ട് നൽകുന്നു; പരമ്പരാഗതമായ ‘പഴയ നിയമം’ എന്ന രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: നീക്കപ്പെടാതെ നിലനിൽക്കുന്നു
  rationale: മൂടുപടത്തിന്റെ രൂപകവും തുടരുന്ന അവസ്ഥയും നിഷ്ക്രിയഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹായിൽ
  rationale: Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർഥം നിലനിർത്തുകയും ἐν എന്ന ബന്ധപ്രയോഗം അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: καταργεῖται
  choice: നീക്കപ്പെടുന്നു
  rationale: ഏറ്റവും അടുത്ത മുൻപദമായ ‘മൂടുപടം’ എന്നതിനോട് സ്വാഭാവികമായി ചേരുന്നു; നിഷ്ക്രിയഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: καταργεῖται എന്ന ക്രിയയുടെ സൂചിത കർത്താവ്
  choice: '‘അത്’ എന്നത് മൂടുപടത്തെ സൂചിപ്പിക്കുന്നു: ‘മശീഹായിൽ അത് നീക്കപ്പെടുന്നു.’'
  alternative: പഴയ ഉടമ്പടിയാണ് ഇല്ലാതാക്കപ്പെടുന്നതോ മാറ്റിവെക്കപ്പെടുന്നതോ എന്ന് വായിക്കാം; അല്ലെങ്കിൽ മൂടുപടത്തിനും ഉടമ്പടിക്കും ഇടയിൽ വാക്യം മനഃപൂർവം ഒരു പരിധിവരെ അവ്യക്തമാണെന്ന് കാണാം.
  rationale: ഏറ്റവും അടുത്തതും വ്യാകരണപരമായി സ്വാഭാവികവുമായ മുൻപദം κάλυμμα (‘മൂടുപടം’) ആണ്; തുടർന്നുള്ള മൂടുപടരൂപകത്തോടും ഇത് യോജിക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ സൂചിത കർത്താവിന്റെ സാധ്യതയുള്ള അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മൂടുപടം’ എന്ന രൂപകം ആവർത്തിച്ച് നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന വാക്കുകളോടോ വാക്യഭാഗങ്ങളോടോ ചേർത്തിരിക്കുന്നു.
