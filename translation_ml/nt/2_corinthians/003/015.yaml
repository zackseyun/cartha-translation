reference: 2 Corinthians 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: ml
  text: എന്നാൽ ഇന്നുവരെയും, മോശെ[a] വായിക്കപ്പെടുമ്പോഴെല്ലാം, അവരുടെ ഹൃദയത്തിന്മേൽ[b] ഒരു മൂടുപടം കിടക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘മോശെ’ എന്നു പറയുന്നത് മോശെയുടെ രചനകളെ, വിശേഷിച്ച് ന്യായപ്രമാണത്തെ, സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ഗ്രീക്കിൽ ‘അവരുടെ ഹൃദയം’ എന്നത് ഏകവചനത്തിലാണ്; ഇത് കൂട്ടായ ഏകവചനമായിരിക്കാം. ‘അവരുടെ ഹൃദയങ്ങൾ’ എന്നും അർഥമാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἕως σήμερον
  choice: ഇന്നുവരെയും
  rationale: ആ അവസ്ഥ വർത്തമാനകാലംവരെ തുടരുന്നു എന്ന കാലസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: വായിക്കപ്പെടുമ്പോഴെല്ലാം
  rationale: ἡνίκα, ἄν, വർത്തമാനകാല subjunctive എന്നിവ ചേർന്ന് സൂചിപ്പിക്കുന്ന അനിശ്ചിതമായി ആവർത്തിക്കുന്ന സന്ദർഭം ‘എപ്പോഴൊക്കെ’ എന്ന അർഥത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: Μωϋσῆς
  choice: മോശെ
  rationale: ഗ്രീക്കിൽ മോശെയുടെ രചനകളെ സൂചിപ്പിക്കാൻ വ്യക്തിനാമം metonymy ആയി ഉപയോഗിക്കുന്നു; വ്യാഖ്യാനം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ മൂലപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κάλυμμα
  choice: ഒരു മൂടുപടം
  rationale: ഈ അധ്യായത്തിലുടനീളമുള്ള മോശെയുടെ മൂടുപടത്തിന്റെ ദൃശ്യബിംബം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: അവരുടെ ഹൃദയത്തിന്മേൽ
  rationale: ബഹുവചന ഉടമസ്ഥസർവനാമത്തോടൊപ്പം ഗ്രീക്കിലുള്ള ഏകവചന ‘ഹൃദയം’ കൂട്ടായ ഏകവചനമായി സംരക്ഷിക്കുന്നു.
- source_word: κεῖται
  choice: കിടക്കുന്നു
  rationale: ഒരിടത്ത് മൂടിക്കിടക്കുകയോ നിലകൊള്ളുകയോ ചെയ്യുന്ന അവസ്ഥയെ ഈ രൂപകം നേരിട്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘മോശെ’ എന്നത് മോശെയുടെ ന്യായപ്രമാണത്തെയോ രചനകളെയോ സൂചിപ്പിക്കുന്നുവെന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കണമോ
  choice: മുഖ്യവാക്യത്തിൽ ‘മോശെ’ എന്ന metonymy നിലനിർത്തി അടിക്കുറിപ്പിൽ വിശദീകരിക്കുക
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണം’ അല്ലെങ്കിൽ ‘മോശെയുടെ രചനകൾ’ എന്നു മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കുക
  rationale: മൂലപാഠം വ്യക്തിനാമം തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അത് നിലനിർത്തുന്നത് വ്യാഖ്യാനം വിവർത്തനത്തിനുള്ളിൽ ചേർക്കാതെയും പാഠത്തിന്റെ സാഹിത്യരൂപം സംരക്ഷിച്ചും അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കാൻ സഹായിക്കുന്നു.
- issue: ‘ഹൃദയം’ ഏകവചനമോ ‘ഹൃദയങ്ങൾ’ ബഹുവചനമോ ആയി നൽകണമോ
  choice: ഗ്രീക്കിലെ കൂട്ടായ ഏകവചനം അനുസരിച്ച് ‘അവരുടെ ഹൃദയം’ നിലനിർത്തുക
  alternative: സ്വാഭാവിക വ്യക്തിവിതരണ അർഥത്തിൽ ‘അവരുടെ ഹൃദയങ്ങൾ’ എന്നു നൽകുക
  rationale: ഏകവചനരൂപം സമൂഹത്തെ ഒരു കൂട്ടമായി കാണുന്ന പാഠത്തിന്റെ ഭാഷാപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു; സാധ്യതയുള്ള ബഹുവചന അർഥം അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മോശെ വായിക്കപ്പെടുന്നു’ എന്ന മൂലപാഠത്തിലെ metonymy ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങളോടു നേരിട്ട് ചേർത്തിരിക്കുന്നു.
