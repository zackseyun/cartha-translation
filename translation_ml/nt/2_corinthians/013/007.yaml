id: 2CO.13.7
reference: 2 Corinthians 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: ml
  text: നിങ്ങൾ ഒരു തിന്മയും ചെയ്യാതിരിക്കണമെന്ന് ഞങ്ങൾ ദൈവത്തോടു പ്രാർഥിക്കുന്നു[a]—ഞങ്ങൾ പരീക്ഷയിൽ യോഗ്യരെന്നു കാണപ്പെടേണ്ടതിനല്ല, നിങ്ങൾ നല്ലതു ചെയ്യേണ്ടതിനാണ്; ഞങ്ങൾ അയോഗ്യരായി കണക്കാക്കപ്പെട്ടാലും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങൾ തെറ്റായതൊന്നും ചെയ്യാതിരിക്കണമെന്ന്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഞങ്ങൾ അംഗീകാരമില്ലാത്തവരെന്നു തോന്നിയാലും’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ പരീക്ഷയിൽ പരാജയപ്പെട്ടവരെപ്പോലെ ആയാലും.’ ‘യോഗ്യർ’ എന്നും ‘അയോഗ്യർ’ എന്നും പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദങ്ങൾ പരസ്പരം ബന്ധപ്പെട്ട വിപരീതപദങ്ങളാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: ഞങ്ങൾ ദൈവത്തോടു പ്രാർഥിക്കുന്നു
  rationale: εὔχομαι ഇവിടെ ദൈവത്തോടുള്ള പ്രാർഥനയെ സൂചിപ്പിക്കുന്നു; πρός ദിശ പ്രകടിപ്പിക്കുന്നു. δέ-യുടെ ലഘുവായ ബന്ധകസ്വഭാവം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേകം പദമാക്കാതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: നിങ്ങൾ ഒരു തിന്മയും ചെയ്യാതിരിക്കണമെന്ന്
  rationale: ഇൻഫിനിറ്റീവ് പ്രാർഥനയുടെ ഉള്ളടക്കം നൽകുന്നു. κακὸν μηδέν എന്ന ഊന്നിയ നിഷേധത്തെ ‘ഒരു തിന്മയും’ എന്നു സ്വാഭാവികവും നൈതികബലം നിലനിർത്തുന്നതുമായ രീതിയിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: ഞങ്ങൾ പരീക്ഷയിൽ യോഗ്യരെന്നു കാണപ്പെടേണ്ടതിനല്ല
  rationale: οὐχ ἵνα നിഷേധിക്കപ്പെട്ട ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. δόκιμοι എന്നതിലെ പരീക്ഷിക്കപ്പെട്ട് അംഗീകരിക്കപ്പെടുന്ന ആശയവും φανῶμεν എന്നതിലെ ‘കാണപ്പെടുക’ എന്ന ഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: നിങ്ങൾ നന്മയായതു ചെയ്യേണ്ടതിനാണ്
  rationale: ἀλλά വിരുദ്ധമായ യഥാർഥ ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്നു. τὸ καλόν ഇവിടെ നൈതികമായി നല്ലതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നന്മയായതു’ എന്നു നൽകി.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: ഞങ്ങൾ അയോഗ്യരെന്നപോലെ ആയിരുന്നാലും
  rationale: ἀδόκιμοι, δόκιμοι എന്നതിന്റെ നേരിട്ടുള്ള വിപരീതമാണ്. ὡς എന്നതിലെ ‘എന്നപോലെ’ എന്ന ഭാവവും ὦμεν എന്നതിലെ സാധ്യതയും നിലനിർത്തുന്ന ഈ രൂപം വെറും പൊതുധാരണയെന്നോ യഥാർഥ അയോഗ്യതയെന്നോ നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: ὡς ἀδόκιμοι എന്ന പൗലോസിന്റെ സ്വയംവിവരണത്തിന്റെ അർഥം
  choice: ‘അയോഗ്യരെന്നപോലെ ആയിരുന്നാലും’ എന്ന് നൽകി, അപ്പൊസ്തലിക പരീക്ഷയിൽ അംഗീകാരം ലഭിക്കാത്തവരായി കാണപ്പെടുന്നതോ അങ്ങനെ കണക്കാക്കപ്പെടുന്നതോ എന്ന സന്ദർഭാർഥം തുറന്നുവെച്ചു.
  alternative: ‘ഞങ്ങൾ അയോഗ്യരെന്നു തോന്നിയാലും’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ പരീക്ഷയിൽ പരാജയപ്പെട്ടവരായാലും’.
  rationale: ഉടൻമുമ്പുള്ള δόκιμοι φανῶμεν എന്ന പ്രയോഗവുമായുള്ള പദവിരുദ്ധത പ്രധാനമാണ്. ഈ വാക്യം അന്തിമ ആത്മീയ നാശത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപ്രസ്താവനയാണെന്ന് നിർബന്ധിക്കാതെ, യഥാർഥ നിലയും മറ്റുള്ളവരുടെ വിലയിരുത്തലും തമ്മിലുള്ള പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പരീക്ഷയിൽ യോഗ്യർ/അയോഗ്യർ’ എന്ന പദജോടി ഗ്രീക്കിലെ δόκιμοι/ἀδόκιμοι വൈരുധ്യം വായനക്കാരന് വ്യക്തമാക്കുന്നു. വാക്യത്തിലെ ഉദ്ദേശ്യവൈരുധ്യം ദീർഘഡാഷും അർധവിരാമവും ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തിയിരിക്കുന്നു.
