revisions:
- from: 'അതുകൊണ്ടാണ്, ഇപ്പോൾ നിങ്ങളിൽനിന്ന് അകലെയായിരിക്കെ ഞാൻ ഈ കാര്യങ്ങൾ എഴുതുന്നത്: നിങ്ങളുടെ ഇടയിൽ ആയിരിക്കുമ്പോൾ, കർത്താവ് എനിക്കു തന്ന അധികാരം പ്രയോഗിച്ച് ഞാൻ കർശനമായി ഇടപെടേണ്ടിവരാതിരിക്കാനാണ്.[a] ആ അധികാരം പടുത്തുയർത്താനാണ്, ഇടിച്ചുകളയാനല്ല.[b]'
  to: 'അതുകൊണ്ട്, അകന്നിരിക്കെ ഞാൻ ഈ കാര്യങ്ങൾ എഴുതുന്നു: നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കുമ്പോൾ, കർത്താവ് എനിക്കു നൽകിയ അധികാരത്തിന് അനുസരിച്ച് ഞാൻ കർശനമായി പ്രവർത്തിക്കേണ്ടിവരാതിരിക്കാനാണ്. ആ അധികാരം പടുത്തുയർത്തുന്നതിനാണ്, ഇടിച്ചുകളയുന്നതിനല്ല.[a]'
  rationale: Removed the unsupported temporal adverb “ഇപ്പോൾ,” retained the absent/present contrast, and made the purpose of the Lord-given authority explicit. The severity alternatives in the former note are not needed in the revised text; the remaining note is anchored to the construction metaphor it explains.
