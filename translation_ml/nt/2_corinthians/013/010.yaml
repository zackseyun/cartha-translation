reference: 2 Corinthians 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: ml
  text: 'അതുകൊണ്ട്, അകന്നിരിക്കെ ഞാൻ ഈ കാര്യങ്ങൾ എഴുതുന്നു: നിങ്ങളുടെ ഇടയിൽ ഉണ്ടായിരിക്കുമ്പോൾ, കർത്താവ് എനിക്കു നൽകിയ അധികാരത്തിന് അനുസരിച്ച് ഞാൻ കർശനമായി പ്രവർത്തിക്കേണ്ടിവരാതിരിക്കാനാണ്. ആ അധികാരം പടുത്തുയർത്തുന്നതിനാണ്, ഇടിച്ചുകളയുന്നതിനല്ല.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “വളർച്ചയ്ക്കായിട്ടാണ്, നാശത്തിനായിട്ടല്ല.” ഗ്രീക്കിൽ നിർമ്മാണരൂപകമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്: “പടുത്തുയർത്തുന്നതിനാണ്, ഇടിച്ചുകളയുന്നതിനല്ല.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻസന്ദർഭവുമായി പൗലോസ് വ്യക്തമാക്കുന്ന കാരണപരമായ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചന നിർദേശകപദം നിലനിർത്തുകയും കത്തിലെ ഈ ഉള്ളടക്കത്തെയോ മുന്നറിയിപ്പുകളെയോ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπὼν
  choice: ഇപ്പോൾ നിങ്ങളിൽനിന്ന് അകലെയായിരിക്കെ
  rationale: παρὼν എന്ന തുടർന്നുള്ള പദത്തോടുള്ള വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ‘നിങ്ങളിൽനിന്ന്’ എന്നത് സന്ദർഭത്തിൽ അന്തർലീനമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: γράφω
  choice: ഞാൻ ... എഴുതുന്നത്
  rationale: കത്തെഴുത്തിന്റെ ഇപ്പോഴത്തെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα
  choice: '...ആണ്'
  rationale: മലയാളത്തിലെ ഉദ്ദേശ്യനിർമാണമായ ‘-ാതിരിക്കാനാണ്’ വഴി ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παρὼν
  choice: നിങ്ങളുടെ ഇടയിൽ ആയിരിക്കുമ്പോൾ
  rationale: ἀπὼν എന്നതിന് സമാന്തരമായി പൗലോസിന്റെ ശാരീരിക സാന്നിധ്യം ലളിതമായി അറിയിക്കുന്നു.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: ഞാൻ കർശനമായി ഇടപെടേണ്ടിവരാതിരിക്കാൻ
  rationale: ἀποτόμως എന്നതിലെ കാഠിന്യവും χράομαι എന്നതിലെ പ്രവർത്തിക്കൽ/ഇടപെടൽ ആശയവും സ്വാഭാവികമായി നൽകുന്നു. സന്ദർഭത്തിലെ അനിഷ്ടകരമായ നിർബന്ധസാധ്യത ‘വേണ്ടിവരാതിരിക്കാൻ’ എന്നതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: അധികാരം പ്രയോഗിച്ച്
  rationale: പൗലോസിന്റെ കർശനമായ ഇടപെടൽ അവനു ലഭിച്ച അധികാരത്തിന്റെ പ്രയോഗമായിരിക്കുമെന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: പദവിയെ അതേ നിലയിൽ നിലനിർത്തുന്നു; ഈ വാക്യം വ്യക്തമാക്കുന്നതിലധികം ആരെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് പരിഭാഷയിൽ നിർണയിക്കുന്നില്ല.
- source_word: ἔδωκέν μοι
  choice: എനിക്കു തന്ന
  rationale: ലഭിച്ച അധികാരത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് എയോറിസ്റ്റിനെ ലളിതമായ ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: εἰς οἰκοδομὴν
  choice: പടുത്തുയർത്താൻ
  rationale: ഒരാളെ ആത്മീയമായോ സമൂഹപരമായോ വളർത്തുക എന്ന ആശയത്തോടൊപ്പം ഗ്രീക്കിലെ നിർമ്മാണരൂപകവും നിലനിർത്തുന്നു.
- source_word: καθαίρεσιν
  choice: ഇടിച്ചുകളയാൻ
  rationale: οἰκοδομή എന്ന നിർമ്മാണരൂപകത്തിന് എതിരായ പൊളിച്ചുകളയൽ എന്ന ചിത്രം നിലനിർത്തുന്നു.
theological_decisions:
- issue: അധികാരം നൽകിയ ‘കർത്താവ്’ ആരെന്ന നിർദേശം
  choice: ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘കർത്താവായ യേശു’ എന്നു വ്യക്തീകരിക്കുക; അല്ലെങ്കിൽ പൊതുവായ ദൈവിക പരാമർശമായി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് പാഠം ὁ κύριος എന്നു മാത്രമേ പറയുന്നുള്ളൂ. അതിനാൽ ഈ വാക്യം വ്യക്തമാക്കുന്നതിനെക്കാൾ സവിശേഷമായ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
- issue: പൗലോസിന്റെ അധികാരത്തിന്റെ ഉദ്ദേശ്യം
  choice: ‘പടുത്തുയർത്താനാണ്, ഇടിച്ചുകളയാനല്ല’ എന്ന നിർമ്മാണരൂപകം നിലനിർത്തി
  alternative: ‘ആത്മീയ വളർച്ചയ്ക്കാണ്, നശിപ്പിക്കാനല്ല’ എന്നു വ്യാഖ്യാനാത്മകമായി നൽകുക
  rationale: അധികാരത്തിന്റെ ലക്ഷ്യത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ വൈരുധ്യവും ഗ്രീക്ക് രൂപകവും വ്യാഖ്യാനത്തിലൂടെ ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സന്നിഹിതൻ,’ ‘പരിപോഷണം,’ ‘നിർമാർജനം’ തുടങ്ങിയ കൂടുതൽ പാണ്ഡിത്യപരമായ പദങ്ങൾ ഒഴിവാക്കി. മൂലത്തിലെ അകലം/സാന്നിധ്യം എന്ന സമാന്തരതയും പടുത്തുയർത്തൽ/ഇടിച്ചുകളയൽ എന്ന രൂപകവൈരുധ്യവും നിലനിർത്തി.
