source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: ml
  text: 'ഇത് മൂന്നാം തവണയാണ് ഞാൻ നിങ്ങളുടെ അടുക്കൽ വരുന്നത്: “രണ്ടോ മൂന്നോ സാക്ഷികളുടെ മൊഴിയാൽ എല്ലാ കാര്യവും സ്ഥിരീകരിക്കപ്പെടും.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “രണ്ടോ മൂന്നോ സാക്ഷികളുടെ വായ്മൊഴിയാൽ ഓരോ വാക്കും സ്ഥാപിക്കപ്പെടും.” ഗ്രീക്ക് പാഠം ആവർത്തനം 19:15-ലെ നിയമപരമായ പ്രയോഗത്തെ അടുത്തായി പിന്തുടരുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ആവർത്തനം 19:15-ലേക്കുള്ള സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: ഇത് മൂന്നാം തവണയാണ്
  rationale: നപുംസക അക്കൂസറ്റീവ് പ്രയോഗം ἔρχομαι എന്ന ക്രിയയോടൊപ്പം ക്രിയാവിശേഷണമായി വന്ന് പൗലോസിന്റെ വരവിന്റെ മൂന്നാം സന്ദർഭം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളുടെ അടുക്കൽ വരുന്നത്
  rationale: വർത്തമാനകാലരൂപത്തിന് സന്ദർഭത്തിൽ സമീപഭാവിക അർഥമുണ്ട്; പ്രഖ്യാപിച്ചിരിക്കുന്ന വരവിന്റെ സാന്നിധ്യവും ഉടൻ സംഭവിക്കുമെന്ന ഭാവവും ഇത് നിലനിർത്തുന്നു.
- source_word: ἐπὶ στόματος
  choice: മൊഴിയാൽ
  rationale: ആവർത്തനം 19:15-നെ അനുസ്മരിപ്പിക്കുന്ന നിയമപരമായ ശൈലിയാണിത്. അക്ഷരാർഥത്തിലുള്ള ‘വായിന്മേൽ’ ആധുനിക മലയാളത്തിൽ അവ്യക്തമായതിനാൽ സാക്ഷിമൊഴിയുടെ നിയമപരമായ ആശയം ‘മൊഴിയാൽ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: രണ്ടോ മൂന്നോ സാക്ഷികളുടെ
  rationale: καί ഇവിടെ രണ്ട് കൂട്ടങ്ങളെ ചേർത്ത് മൊത്തം അഞ്ചുപേരെ സൂചിപ്പിക്കുന്നതല്ല; തിരുവെഴുത്തിലെ സ്ഥിരപ്രയോഗത്തിൽ ‘രണ്ടോ മൂന്നോ’ എന്ന വിതരണാർഥമാണ്. സ്വാഭാവിക മലയാള ക്രമത്തിൽ അത് നൽകിയിരിക്കുന്നു.
- source_word: σταθήσεται
  choice: സ്ഥിരീകരിക്കപ്പെടും
  rationale: ἵστημι എന്ന ക്രിയയുടെ ഭാവികാല കർമണിരൂപം നിയമസന്ദർഭത്തിൽ ഒരു കാര്യം തെളിവാൽ ഉറപ്പിക്കപ്പെടുകയോ സാധുവായി സ്ഥാപിക്കപ്പെടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πᾶν ῥῆμα
  choice: എല്ലാ കാര്യവും
  rationale: ῥῆμα എന്നതിന് ‘വാക്ക്’ എന്ന അർഥമുണ്ടെങ്കിലും ഈ നിയമോദ്ധരണിയിൽ പരിഗണിക്കപ്പെടുന്ന കാര്യം അല്ലെങ്കിൽ വിഷയം എന്ന വിശാലമായ അർഥമാണ്. ‘എല്ലാ കാര്യവും’ അത് വ്യക്തമായി അറിയിക്കുന്നു; ‘എല്ലാ കുറ്റാരോപണവും’ എന്നതുപോലെ അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ ശാസനാത്മക സന്ദർഭത്തിൽ ആവർത്തനപുസ്തകത്തിലെ നിയമതത്ത്വത്തിന്റെ പ്രയോഗം
  choice: ഉദ്ധരണിയെ ഏതൊരു കാര്യവും സാക്ഷിമൊഴിയാൽ സ്ഥിരീകരിക്കപ്പെടുന്നു എന്ന വിശാല നിയമതത്ത്വമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘എല്ലാ വാക്കും’ എന്നു കൂടുതൽ അക്ഷരാർഥമായി നൽകുക, അല്ലെങ്കിൽ ‘എല്ലാ കുറ്റാരോപണവും’ എന്നു പ്രത്യേകമായി ചുരുക്കുക.
  rationale: പൗലോസ് ഒരു തിരുവെഴുത്താധിഷ്ഠിത നിയമതത്ത്വം ഉദ്ധരിക്കുന്നു. ഗ്രീക്ക് പാഠം സഭാശാസനത്തിലേക്കോ കുറ്റാരോപണത്തിലേക്കോ മാത്രം അർഥം ചുരുക്കാത്തതിനാൽ വിവർത്തനവും ആ വിശാലതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
