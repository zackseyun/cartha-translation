id: 2CO.13.4
reference: 2 Corinthians 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: ml
  text: അവൻ ബലഹീനതയിൽ[a] ക്രൂശിക്കപ്പെട്ടുവെങ്കിലും ദൈവത്തിന്റെ ശക്തിയാൽ ജീവിക്കുന്നു. കാരണം, ഞങ്ങളും അവനിൽ ബലഹീനരാണ്; എങ്കിലും ദൈവത്തിന്റെ ശക്തിയാൽ അവനോടുകൂടെ ജീവിക്കും[c], നിങ്ങളോടുള്ള ബന്ധത്തിൽ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ബലഹീനതയിൽനിന്ന്’; ഗ്രീക്കിലെ ἐξ എന്ന പദത്തിന് ഉറവിടമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾക്കുവേണ്ടി’ എന്നോ ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നോ വിവർത്തനം ചെയ്യാം; εἰς ὑμᾶς ദിശയെയോ ബന്ധത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കാവുന്ന സാന്ദ്രമായ പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവനോടുകൂടെ ജീവിക്കും’ എന്നത് കൊരിന്ത്യരോടുള്ള ബന്ധത്തിൽ ക്രിസ്തുവിന്റെ ശക്തിയാൽ പൗലോസും സഹപ്രവർത്തകരും പ്രവർത്തിക്കുന്നതിനെ സൂചിപ്പിക്കാം; അതോടൊപ്പം വിശാലമായ പുനരുത്ഥാനജീവന്റെ ആശയവും പ്രതിധ്വനിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: ക്രൂശിക്കപ്പെട്ടു
  rationale: σταυρόω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിപ്രയോഗം; സന്ദർഭത്തിൽ കൃത്യവും സ്വാഭാവികവുമായ നിലവാരമുള്ള പ്രയോഗമാണിത്.
- source_word: ἐξ ἀσθενείας
  choice: ബലഹീനതയിൽ
  rationale: ἐξ ഉറവിടമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കാമെങ്കിലും, ഇവിടെ ക്രൂശീകരണത്തിന്റെ അവസ്ഥയെയോ രീതിയെയോ സ്വാഭാവികമായി അറിയിക്കാൻ ‘ബലഹീനതയിൽ’ യോജിക്കുന്നു; ഉറവിടസൂചന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ζῇ
  choice: ജീവിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ തുടർച്ചയുള്ള ജീവനെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയാൽ
  rationale: മലയാളത്തിൽ ഉപാധിയോ പ്രവർത്തകശക്തിയോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ἐκ എന്നതിലെ ഉറവിടഭാവവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἀσθενοῦμεν
  choice: ബലഹീനരാണ്
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ἀσθένεια എന്ന പദവുമായുള്ള പദബന്ധം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ക്രിസ്തുവുമായുള്ള ഐക്യം സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ സാന്ദ്രമായ ഭാഷ വിശദീകരിച്ചു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ζήσομεν
  choice: ജീവിക്കും
  rationale: ഭാവികാലം വ്യക്തമായി നിലനിർത്തുന്നു; ഇപ്പോഴത്തെ അപ്പൊസ്തോലിക ശുശ്രൂഷയിലേക്കോ അന്തിമ പുനരുത്ഥാനത്തിലേക്കോ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: σὺν αὐτῷ
  choice: അവനോടുകൂടെ
  rationale: പങ്കാളിത്തവും സഹവാസവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളോടുള്ള ബന്ധത്തിൽ
  rationale: ദിശ, ബന്ധം, ഫലം എന്നിവ ഉൾക്കൊള്ളാവുന്ന സാന്ദ്രമായ ഗ്രീക്ക് പ്രയോഗത്തെ അനാവശ്യമായി ഒരു അർഥത്തിലേക്ക് ചുരുക്കാതെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ക്രൂശീകരണത്തിലെ ക്രിസ്തുവിന്റെ ‘ബലഹീനത’
  choice: ക്രിസ്തു ബലഹീനതയുടെ അവസ്ഥയിൽ ക്രൂശിക്കപ്പെട്ടു എന്ന പാഠത്തിലെ വൈരുധ്യഭാവം നിലനിർത്തി.
  alternative: മനുഷ്യർക്ക് ബലഹീനമായി തോന്നിയതിനെ മാത്രം സൂചിപ്പിക്കുന്ന വിധത്തിൽ വ്യാഖ്യാനിച്ചു വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം ബലഹീനതയും ദൈവശക്തിയും തമ്മിലുള്ള പൗലോസിന്റെ വൈരുധ്യം അവതരിപ്പിക്കുന്നു; ക്രിസ്തുവിന്റെ ദൈവത്വത്തെയോ പാപരാഹിത്യത്തെയോ കുറിച്ചുള്ള നിഷേധം ഇതിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്.
- issue: ‘അവനോടുകൂടെ ജീവിക്കും’ എന്നതിന്റെ സൂചന
  choice: കൊരിന്ത്യരോടുള്ള ബന്ധത്തിൽ പ്രകടമാകുന്ന ക്രിസ്തുശക്തിയുള്ള അപ്പൊസ്തോലിക ജീവിതവും വിശാലമായ പുനരുത്ഥാനജീവന്റെ പ്രതിധ്വനിയും ഉൾക്കൊള്ളാൻ കഴിയുന്നവിധം തുറന്നുവച്ചു.
  alternative: അന്തിമ പുനരുത്ഥാനം മാത്രമെന്നോ ഇപ്പോഴത്തെ അപ്പൊസ്തോലിക ശുശ്രൂഷ മാത്രമെന്നോ പരിമിതപ്പെടുത്തുക.
  rationale: തൊട്ടടുത്ത സന്ദർഭം കൊരിന്ത്യരോടുള്ള പൗലോസിന്റെ ഇടപെടലിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; എന്നാൽ ക്രിസ്തുവിനോടുകൂടെ ജീവിക്കൽ എന്ന ഭാഷയ്ക്ക് വിശാലമായ പുനരുത്ഥാനസൂചനയും ഉണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ ബലഹീനത–ശക്തി വൈരുധ്യവും ‘അവനിൽ’/‘അവനോടുകൂടെ’ എന്ന വ്യത്യാസവും നിലനിർത്തി. ഇംഗ്ലീഷ് കരടിലെ അടിക്കുറിപ്പ്-മാർക്കർ ക്രമക്കേട് തിരുത്തി, ഓരോ മാർക്കറും ബന്ധപ്പെട്ട പദപ്രയോഗത്തിനുശേഷം ചേർത്തു.
