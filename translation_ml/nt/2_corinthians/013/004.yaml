revisions:
- from: അവൻ ബലഹീനതയിൽ ക്രൂശിക്കപ്പെട്ടുവെങ്കിലും[a] ദൈവത്തിന്റെ ശക്തിയാൽ ജീവിക്കുന്നു. അതുപോലെ, ഞങ്ങളും അവനിൽ ബലഹീനരാണ്; എങ്കിലും നിങ്ങളോടുള്ള ബന്ധത്തിൽ ദൈവത്തിന്റെ ശക്തിയാൽ അവനോടുകൂടെ ജീവിക്കും[b][c].
  to: അവൻ ബലഹീനതയിൽ[a] ക്രൂശിക്കപ്പെട്ടുവെങ്കിലും ദൈവത്തിന്റെ ശക്തിയാൽ ജീവിക്കുന്നു. കാരണം, ഞങ്ങളും അവനിൽ ബലഹീനരാണ്; എങ്കിലും ദൈവത്തിന്റെ ശക്തിയാൽ അവനോടുകൂടെ ജീവിക്കും[c], നിങ്ങളോടുള്ള ബന്ധത്തിൽ[b].
