id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: ml
  text: കർത്താവായ യേശു മശീഹയുടെ കൃപയും[a] ദൈവത്തിന്റെ സ്നേഹവും പരിശുദ്ധാത്മാവിന്റെ കൂട്ടായ്മയും[b] നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, പരമ്പരാഗതമായി, “കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപയും.”
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ “പരിശുദ്ധാത്മാവിന്റെ സംസർഗവും” എന്നോ “പരിശുദ്ധാത്മാവിലുള്ള പങ്കാളിത്തവും” എന്നോ.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ പതിവായ പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: ഇവിടെ യേശുവിനുള്ള ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി κύριος വരുന്നതിനാൽ ‘കർത്താവ്’ യോജിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ പേരിന്റെ ഭാഗംപോലെ മാത്രം അല്ല, അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു; അതിനാൽ അർത്ഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നതുമായ തുല്യപദം.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം അതേപടി സൂക്ഷിക്കുന്നു; ‘ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹം’ എന്നിങ്ങനെ അർത്ഥം ചുരുക്കി നിർണയിക്കുന്നില്ല.
- source_word: κοινωνία
  choice: കൂട്ടായ്മ
  rationale: ബന്ധം, പങ്കാളിത്തം, പങ്കിടൽ എന്നീ അർത്ഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: ἁγίου πνεύματος
  choice: പരിശുദ്ധാത്മാവ്
  rationale: ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സമകാലികവുമായ മലയാളപ്രയോഗം.
- source_word: μετὰ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ ഇരിക്കട്ടെ
  rationale: μετάയുടെ സാന്നിധ്യ/സഹവാസ അർത്ഥവും πάντων എന്ന ഉൾക്കൊള്ളുന്ന ഊന്നലും വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ സൂചിതമായ ആശംസാക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി ചേർത്തു.
theological_decisions:
- issue: Χριστοῦ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിനോടു ചേർന്ന സ്ഥാനപ്പേരായി ഗ്രഹിക്കാം. അതിന്റെ അർത്ഥം പ്രകടമാക്കാൻ ‘മശീഹ’ മുഖ്യവാചകത്തിൽ നൽകി; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: κοινωνία τοῦ ἁγίου πνεύματος എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: പരിശുദ്ധാത്മാവിന്റെ കൂട്ടായ്മ
  alternative: പരിശുദ്ധാത്മാവിലുള്ള പങ്കാളിത്തം; പരിശുദ്ധാത്മാവിന്റെ സംസർഗം
  rationale: ജനിറ്റീവ് ഘടന ആത്മാവ് നൽകുന്ന കൂട്ടായ്മയെയോ ആത്മാവുമായുള്ള/ആത്മാവിലുള്ള പങ്കാളിത്തത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യവാചകം ഈ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിർബന്ധമായി ചുരുക്കുന്നില്ല; സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ആശീർവാദശൈലി. മൂന്നു സമാന്തര ഘടകങ്ങളുടെ ഗ്രീക്ക് ഘടന നിലനിർത്തിയിട്ടുണ്ട്; മലയാളത്തിലെ സ്വാഭാവിക ക്രമത്തിനായി ‘ഇരിക്കട്ടെ’ അവസാനം നൽകിയിരിക്കുന്നു.
