id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: ml
  text: മശീഹാ എന്നിൽ[a] സംസാരിക്കുന്നു എന്നതിന് തെളിവ് നിങ്ങൾ അന്വേഷിക്കുന്നതിനാൽ—അവൻ നിങ്ങളോടു ബലഹീനനല്ല, മറിച്ച് നിങ്ങളിൽ[b] ശക്തനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നിലൂടെ.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “എന്നിൽ” എന്നാണ്.
    reason: ἐν ἐμοὶ മശീഹായുടെ പൗലോസിലുള്ള സാന്നിധ്യത്തെയോ പൗലോസിലൂടെയുള്ള പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം.
  - marker: b
    text: അഥവാ, “നിങ്ങളുടെ ഇടയിൽ.”
    reason: ബഹുവചനമായ ἐν ὑμῖν വ്യക്തികളുടെ ഉള്ളിലുള്ള പ്രവർത്തനത്തെയോ സഭാസമൂഹത്തിനിടയിലെ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἐπεὶ
  choice: അന്വേഷിക്കുന്നതിനാൽ
  rationale: മുൻസന്ദർഭത്തിൽ പൗലോസ് കർശനമായി ഇടപെടാനുള്ള കാരണമാണ് ഈ പദം അവതരിപ്പിക്കുന്നത്; ‘-തിനാൽ’ അതിന്റെ കാരണസൂചകബലം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δοκιμὴν ζητεῖτε
  choice: തെളിവ് നിങ്ങൾ അന്വേഷിക്കുന്നു
  rationale: ഇവിടെ δοκιμή പരീക്ഷണപ്രക്രിയയെക്കാൾ ഒരു അവകാശവാദം സത്യമാണെന്ന് തെളിയിക്കുന്ന സാക്ഷ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. വർത്തമാനകാലരൂപം അവരുടെ തുടരുന്ന ആവശ്യത്തെ പ്രകടമാക്കുന്നു.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: മശീഹാ എന്നിൽ സംസാരിക്കുന്നു എന്നതിന്
  rationale: ജനിറ്റീവ്-പാർട്ടിസിപ്പിൾ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഉള്ളടക്കവാക്യമായി നൽകി. ἐν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘എന്നിൽ’ നിലനിർത്തി; ‘എന്നിലൂടെ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: Χριστοῦ
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായവന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ പദവിയർഥം നിലനിർത്തുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: അവൻ നിങ്ങളോടു ബലഹീനനല്ല
  rationale: εἰς ὑμᾶς എന്ന ബന്ധപരവും ദിശാസൂചകവുമായ അർഥം ‘നിങ്ങളോടു’ വഴി സംക്ഷിപ്തമായി നൽകി; ἀσθενεῖ–δυνατεῖ വൈരുധ്യം നിലനിർത്താൻ ‘ബലഹീനൻ’ ഉപയോഗിച്ചു.
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: മറിച്ച് നിങ്ങളിൽ ശക്തനാണ്
  rationale: അപൂർവമായ δυνατέω എന്ന ക്രിയയുടെ ശക്തി/പ്രാബല്യ അർഥം, മുൻപുള്ള ബലഹീനതയോടുള്ള നേരിട്ടുള്ള വൈരുധ്യത്തോടെ നൽകി. ἐν ὑμῖν നേരിട്ട് ‘നിങ്ങളിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പദം ഒരു സ്ഥാനപ്പേരായി വായിക്കാവുന്നതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന പദവിയർഥം സൂക്ഷിക്കുന്ന ‘മശീഹാ’ തിരഞ്ഞെടുത്തു; അതിനെ വെറും പേരായി മാത്രം പരിഗണിച്ചില്ല.
- issue: ἐν ἐμοὶ, ἐν ὑμῖν എന്നിവയുടെ വ്യാപ്തി
  choice: ‘എന്നിൽ’, ‘നിങ്ങളിൽ’
  alternative: ‘എന്നിലൂടെ’, ‘നിങ്ങളുടെ ഇടയിൽ’
  rationale: ഗ്രീക്കിലെ ഒരേ ἐν പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി. മശീഹാ പൗലോസിലൂടെ സംസാരിക്കുന്നതാണോ അവനിൽ സന്നിഹിതനായി സംസാരിക്കുന്നതാണോ, അവന്റെ ശക്തി കൊരിന്ത്യരുടെ ഉള്ളിലാണോ അവരുടെ സമൂഹത്തിനിടയിലാണോ എന്ന വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ബലഹീനൻ/ശക്തൻ’ എന്ന നേരിട്ടുള്ള വൈരുധ്യം പൗലോസിന്റെ ചുറ്റുപാടിലുള്ള ബലഹീനത–ശക്തി പ്രമേയം നിലനിർത്തുന്നു; ദീർഘവാക്യത്തിന്റെ മുൻസന്ദർഭബന്ധം സൂചിപ്പിക്കാൻ കാരണസൂചകമായ ‘-തിനാൽ’യും ദീർഘവിരാമവും ഉപയോഗിച്ചു.
