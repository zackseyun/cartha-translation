id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ml
  text: നിങ്ങൾ വിശ്വാസത്തിൽ ആണോ എന്ന് നിങ്ങളെത്തന്നെ പരീക്ഷിക്കുവിൻ[a]; നിങ്ങളെത്തന്നെ പരിശോധിക്കുവിൻ. യേശു മശീഹ നിങ്ങളിൽ ഉണ്ടെന്ന് നിങ്ങളെത്തന്നെ തിരിച്ചറിയുന്നില്ലയോ?[b]—നിങ്ങൾ പരീക്ഷയിൽ പരാജയപ്പെട്ടവരല്ലെങ്കിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസത്തിൽ’ എന്നത് ക്രൈസ്തവവിശ്വാസത്തിൽ നിലനിൽക്കുന്നതിനെയോ യഥാർഥമായ വിശ്വാസം ഉണ്ടായിരിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യേശു ക്രിസ്തു’; ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: പരീക്ഷിക്കുവിൻ
  rationale: ഇവിടെ പ്രലോഭിപ്പിക്കുക എന്നല്ല, യാഥാർഥ്യം തെളിയാൻ സ്വയം പരിശോധനയ്ക്കു വിധേയരാക്കുക എന്ന വിലയിരുത്തൽഭാവമാണ്.
- source_word: ἐν τῇ πίστει
  choice: വിശ്വാസത്തിൽ നിലകൊള്ളുന്നുവോ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടമായ ‘വിശ്വാസത്തിൽ’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായി ക്രൈസ്തവവിശ്വാസത്തിന്റെ മണ്ഡലത്തിൽ തുടരുക എന്ന അർഥം പ്രകടമാക്കുന്നു; വ്യക്തിപരമായ യഥാർഥ വിശ്വാസം എന്ന സാധ്യതയും കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δοκιμάζετε
  choice: പരിശോധിക്കുവിൻ
  rationale: πειράζετε എന്നതിനോട് അടുത്ത അർഥമുണ്ടെങ്കിലും, സൂക്ഷ്മമായി പരിശോധിച്ച് അംഗീകാരയോഗ്യമാണോ എന്നു നിർണയിക്കുന്ന ഭാവം വേർതിരിക്കുന്നു.
- source_word: ἐπιγινώσκετε
  choice: തിരിച്ചറിയുന്നില്ലയോ
  rationale: വെറും അറിവിനേക്കാൾ പൂർണമായി ഗ്രഹിക്കുകയോ അംഗീകരിക്കുകയോ ചെയ്യുന്ന ഭാവം വാചകത്തിലെ വാഗ്‌ചോദ്യത്തിന് യോജിക്കുന്നു.
- source_word: ἑαυτούς
  choice: നിങ്ങളെത്തന്നെക്കുറിച്ച്
  rationale: മൂന്നാമത്തെ ആവർത്തനത്തിൽ ‘സ്വയം സംബന്ധിച്ച ഈ യാഥാർഥ്യം തിരിച്ചറിയുക’ എന്ന പ്രതിഫലനഭാവം വ്യക്തമാക്കുന്നു.
- source_word: Ἰησοῦς Χριστός
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായി കേൾക്കുന്നതിനാൽ അർഥസമ്പന്നമായ ‘മശീഹ’ ഉപയോഗിക്കുന്നു; പരമ്പരാഗത ‘ക്രിസ്തു’ കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: സ്വയംപരിശോധനയുടെ പശ്ചാത്തലത്തിൽ വ്യക്തികളിലുള്ള മശീഹയുടെ സാന്നിധ്യം മുഖ്യമായി സൂചിപ്പിക്കുന്നു; സമൂഹത്തിനിടയിൽ എന്ന സാധ്യത കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰ μήτι
  choice: അല്ലെങ്കിൽ … ആയിരിക്കാം
  rationale: ഒഴിവാക്കൽഭാവത്തോടൊപ്പം ഉള്ള വാഗ്‌പരമായ മൃദുത്വവും സാധ്യതാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀδόκιμοι
  choice: പരീക്ഷയിൽ പരാജയപ്പെട്ടവർ
  rationale: δοκιμάζετε എന്ന പരിശോധനാഭാഷയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ‘തിരസ്കൃതർ’ പോലുള്ള പിന്നീടുള്ള സിദ്ധാന്തഭാരം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവി എന്ന ഭാവം പ്രസക്തമാണ്; അതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യുന്നതിനെക്കാൾ പദവിയുടെ അർഥം പ്രകടമാക്കുന്നു.
- issue: ἐν τῇ πίστει എന്നതിന്റെ അർഥം
  choice: ക്രൈസ്തവവിശ്വാസത്തിന്റെ മണ്ഡലത്തിൽ നിലകൊള്ളുക
  alternative: യഥാർഥമായ വ്യക്തിപരമായ വിശ്വാസം ഉണ്ടായിരിക്കുക
  rationale: മൂലവാക്യം രണ്ടിനും ഇടം നൽകുന്നു. പ്രധാനവാചകം നിർദിഷ്ട ‘വിശ്വാസം’ എന്ന ഭാവം സൂക്ഷിക്കുകയും കുറിപ്പ് അർഥവ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ἐν ὑμῖν എന്നതിന്റെ അർഥം
  choice: നിങ്ങളിൽ
  alternative: നിങ്ങളുടെ ഇടയിൽ
  rationale: സ്വയംപരിശോധനയുടെ സമീപസന്ദർഭം ഉള്ളിലുള്ള സാന്നിധ്യത്തെ അനുകൂലിക്കുന്നു; ബഹുവചനത്തെ അടിസ്ഥാനമാക്കിയ സമൂഹപരമായ വായനയും കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: εἰ μήτι ἀδόκιμοί ἐστε എന്ന അവസാന വ്യവസ്ഥ
  choice: അല്ലെങ്കിൽ നിങ്ങൾ പരീക്ഷയിൽ പരാജയപ്പെട്ടവരായിരിക്കാം
  alternative: നിങ്ങൾ വാസ്തവത്തിൽ പരീക്ഷയിൽ പരാജയപ്പെട്ടവരല്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാപരവും അല്പം മൃദൂകരിച്ച വാഗ്‌ഭാവവും സൂക്ഷിക്കാൻ സാധ്യതാഭാവമുള്ള മലയാളരൂപം ഉപയോഗിക്കുന്നു; അന്തിമ സിദ്ധാന്തവിധിയായി കടുപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ബഹുവചന ആജ്ഞകൾക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം, വാഗ്‌ചോദ്യം, പരിശോധന/പരാജയം എന്ന പദബന്ധം എന്നിവ പരമാവധി നിലനിർത്തി.
