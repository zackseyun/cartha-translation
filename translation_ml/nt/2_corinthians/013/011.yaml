reference: 2 Corinthians 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ml
  text: ഒടുവിൽ[a], സഹോദരന്മാരേ[b], സന്തോഷിക്കുവിൻ; ശരിയായ നിലയിലേക്കു വരുവിൻ[c]; പ്രോത്സാഹനം സ്വീകരിക്കുവിൻ[d]; ഒരേ കാര്യം ചിന്തിക്കുവിൻ[e]; സമാധാനത്തോടെ ജീവിക്കുവിൻ. സ്നേഹത്തിന്റെയും സമാധാനത്തിന്റെയും ദൈവം നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ശേഷമായി’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ ഗ്രീക്ക് പദം സമാപനത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സഹോദരന്മാർ’ എന്ന അഭിസംബോധന ഇവിടെ സഭയെ ഒന്നാകെ ഉദ്ദേശിക്കുന്നതിനാൽ സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘പൂർണരാക്കപ്പെടുവിൻ,’ ‘പുനഃസ്ഥാപിക്കപ്പെടുവിൻ,’ അല്ലെങ്കിൽ ‘കാര്യങ്ങൾ ക്രമത്തിലാക്കുവിൻ’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: d
    text: ‘പ്രബോധനം സ്വീകരിക്കുവിൻ’ അല്ലെങ്കിൽ ‘ആശ്വസിപ്പിക്കപ്പെടുവിൻ’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: e
    text: അക്ഷരാർഥത്തിൽ ‘ഒരേ കാര്യം ചിന്തിക്കുവിൻ’; അതായത്, ‘ഒരേ മനസ്സുള്ളവരാകുവിൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: ഒടുവിൽ
  rationale: ലേഖനം സമാപനത്തിലേക്കു നീങ്ങുന്നതു സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാള പ്രയോഗം.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; സഭയെ മുഴുവനായി അഭിസംബോധന ചെയ്യുന്നതിലെ ഉൾക്കൊള്ളുന്ന പ്രയോഗശക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: χαίρετε
  choice: സന്തോഷിക്കുവിൻ
  rationale: ഇത് വിടവാങ്ങൽ അഭിവാദ്യമായും വരാമെങ്കിലും, ഇവിടെ തുടർച്ചയായ ആജ്ഞകളുടെ കൂട്ടത്തിൽ വരുന്നതിനാൽ ‘സന്തോഷിക്കുവിൻ’ എന്ന ആജ്ഞാർത്ഥം യോജിക്കുന്നു.
- source_word: καταρτίζεσθε
  choice: ശരിയായ നിലയിലേക്കു വരുവിൻ
  rationale: നന്നാക്കുക, പുനഃസ്ഥാപിക്കുക, വേണ്ട നിലയിൽ കൊണ്ടുവരുക എന്നീ അർത്ഥവ്യാപ്തി അമിതമായ ‘പരിപൂർണരാകുക’ എന്ന ആശയം ചേർക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ മധ്യമ/കർമണി രൂപത്തിന്റെ സാവകാശത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: παρακαλεῖσθε
  choice: പ്രോത്സാഹനം സ്വീകരിക്കുവിൻ
  rationale: പ്രോത്സാഹനമോ പ്രബോധനമോ സ്വീകരിക്കുക എന്ന മധ്യമ/കർമണി സാധ്യത വ്യക്തമാക്കുകയും വെറും ‘ധൈര്യപ്പെടുക’ എന്നതിനെക്കാൾ ഗ്രീക്കിനോടു ചേർന്നുനിൽക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: ഒരേ കാര്യം ചിന്തിക്കുവിൻ
  rationale: ‘ഒരേ കാര്യം ചിന്തിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബൗദ്ധികവും ഐക്യപരവുമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: εἰρηνεύετε
  choice: സമാധാനത്തോടെ ജീവിക്കുവിൻ
  rationale: സമൂഹത്തിനുള്ളിൽ തുടർച്ചയായി സമാധാനപരമായി ജീവിക്കണമെന്ന വർത്തമാനകാല ആജ്ഞയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: സ്നേഹത്തിന്റെയും സമാധാനത്തിന്റെയും ദൈവം
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി പ്രയോഗത്തെ ലളിതമായും ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം കൂടാതെയും പകർന്നിരിക്കുന്നു.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കും
  rationale: ഭാവികാല വാഗ്ദാനം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് അറിയിക്കുന്നു.
theological_decisions:
- issue: സഭയെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί എന്ന പദത്തിന്റെ ഉൾക്കൊള്ളുന്ന പ്രയോഗശക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നൽകി വ്യാകരണപരമായ പുല്ലിംഗരൂപം നിലനിർത്തുക.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ അല്ലെങ്കിൽ ‘സഹോദരങ്ങളേ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: മൂലരൂപം കൃത്യമായി പ്രതിഫലിപ്പിക്കുമ്പോഴും, മിശ്രസഭ മുഴുവനുമാണ് അഭിസംബോധിതർ എന്ന പ്രയോഗശക്തി അടിക്കുറിപ്പിലൂടെ വ്യക്തമായി സംരക്ഷിക്കാം.
- issue: καταρτίζεσθε എന്നതിലെ പുനഃസ്ഥാപനം, ക്രമപ്പെടുത്തൽ, പൂർത്തീകരണം എന്നീ അർത്ഥസാധ്യതകൾ
  choice: ‘ശരിയായ നിലയിലേക്കു വരുവിൻ’ എന്നു നൽകി സഭയുടെ തിരുത്തലും പുനഃസ്ഥാപനവും ഉൾക്കൊള്ളുന്ന വിശാല അർത്ഥം നിലനിർത്തുക.
  alternative: ‘പരിപൂർണരാകുവിൻ’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ‘പരിപൂർണരാകുവിൻ’ എന്നത് പാപരഹിതമായ പൂർണതയെന്ന പ്രത്യേക ദൈവശാസ്ത്ര നിഗമനം അനാവശ്യമായി നിർദേശിക്കാം; മൂലപദം അതിനെ നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ബഹുവചന ആജ്ഞകൾക്ക് ‘-വിൻ’ രൂപം ഉപയോഗിച്ച് വാക്യത്തിന്റെ ഗൗരവവും സമാന്തരഘടനയും നിലനിർത്തി. ‘അപ്പോൾ’ എന്നത് ആജ്ഞകളെയും തുടർന്നുള്ള വാഗ്ദാനത്തെയും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; അതിനെ കർശനമായ കാരണഫല വ്യവസ്ഥയായി വായിക്കേണ്ടതില്ല.
