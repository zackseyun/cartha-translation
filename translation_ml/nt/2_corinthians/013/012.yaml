source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: ml
  text: വിശുദ്ധ ചുംബനത്തോടെ പരസ്പരം അഭിവാദ്യം ചെയ്യുക.[a] വിശുദ്ധരെല്ലാവരും[b] നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധമായ ചുംബനത്തോടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. വിശുദ്ധതയും ക്രിസ്തീയ കൂട്ടായ്മയും പ്രകടമാക്കുന്ന, സമൂഹത്തിൽ അംഗീകരിക്കപ്പെട്ട ഒരു അഭിവാദ്യരീതിയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘വിശുദ്ധർ’ എന്നത് വിശ്വാസികളെ—ദൈവത്തിന്റെ വിശുദ്ധജനത്തെ—സൂചിപ്പിക്കുന്നു; പിന്നീട് ഔദ്യോഗികമായി വിശുദ്ധരായി പ്രഖ്യാപിക്കപ്പെട്ട ഒരു പ്രത്യേക വിഭാഗത്തെ മാത്രമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള നേരിട്ടുള്ള ആഹ്വാനം. കത്തുകളുടെ സന്ദർഭത്തിൽ മലയാളത്തിൽ സ്വാഭാവികവും അർഥകൃത്യവുമായ പ്രയോഗമാണിത്.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: സമൂഹത്തിനുള്ളിലെ അന്യോന്യമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന reciprocal pronoun മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: വിശുദ്ധ ചുംബനത്തോടെ
  rationale: ἐν ഇവിടെ അഭിവാദ്യത്തിന്റെ രീതിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘-ത്തോടെ’ എന്നു നൽകി. ἁγίῳ എന്നതിന്റെ വിശുദ്ധമായ, ദൈവത്തിനു വേർതിരിക്കപ്പെട്ട സ്വഭാവവും φίλημα എന്നതിന്റെ വ്യക്തമായ ‘ചുംബനം’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: ἀσπάζονται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തിന്റെ സമാപനത്തിലെ ആശംസ അറിയിക്കൽ എന്ന അർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന വർത്തമാനകാല രൂപം.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: οἱ ἅγιοι πάντες
  choice: വിശുദ്ധരെല്ലാവരും
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἅγιοι വിശ്വാസിസമൂഹത്തെ, ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ, സൂചിപ്പിക്കുന്നു. πάντες-ന്റെ സമഗ്രത ‘എല്ലാവരും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സമൂഹസംബോധനയിൽ ἅγιοι എന്നതിന്റെ പരിഭാഷ
  choice: വിശുദ്ധർ
  alternative: ദൈവത്തിന്റെ വിശുദ്ധജനം / വിശുദ്ധരായവർ
  rationale: ‘വിശുദ്ധർ’ മൂലപദത്തിന്റെ പ്രധാന ദൈവശാസ്ത്രപരമായ ആശയവും പൗലോസിന്റെ പതിവായ സമൂഹനാമവും നിലനിർത്തുന്നു. ഇത് പിന്നീട് ഔദ്യോഗികമായി വിശുദ്ധരായി പ്രഖ്യാപിക്കപ്പെട്ട ഒരു പ്രത്യേക ഉന്നതവിഭാഗത്തെ മാത്രം സൂചിപ്പിക്കുന്നില്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അഭിവാദ്യം ചെയ്യുക’ കത്തുസന്ദർഭത്തിന് യോജിച്ച ഔപചാരികത നൽകുന്നു; ‘ചുംബനം’ എന്ന സാംസ്കാരികമായി പ്രത്യേകമായ മൂലചിത്രം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
