id: 2CO.13.8
reference: 2 Corinthians 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: ml
  text: കാരണം, സത്യത്തിനെതിരായി ഒന്നും ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയില്ല; മറിച്ച്, സത്യത്തിനുവേണ്ടി ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സത്യത്തെ പിന്തുണച്ച് ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയും.”'
    reason: ὑπὲρ τῆς ἀληθείας എന്നതിന് ‘സത്യത്തിനുവേണ്ടി’ എന്ന സംക്ഷിപ്ത പ്രയോഗവും ‘സത്യത്തെ പിന്തുണച്ച്’ എന്ന കൂടുതൽ വിശദീകരണാത്മക പ്രയോഗവും സാധ്യമാണ്.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: കാരണം ... കഴിയില്ല
  rationale: γάρ മുൻപ്രസ്താവനയുടെ കാരണം വിശദീകരിക്കുന്നു; അതിനാൽ സ്വാഭാവികമായ മലയാളബന്ധകമായി ‘കാരണം’ ഉപയോഗിച്ചു. οὐ നിഷേധം ‘കഴിയില്ല’ എന്നതിലൂടെ പ്രകടമാകുന്നു.
- source_word: δυνάμεθά
  choice: ഞങ്ങൾക്കു കഴിയില്ല / കഴിയുക
  rationale: δύναμαι കഴിവിനെയോ ശേഷിയെയോ സൂചിപ്പിക്കുന്നു. ‘കഴിയുക’ അതിന്റെ വാച്യാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τι
  choice: ഒന്നും
  rationale: നിഷേധവാക്യത്തിലെ അനിശ്ചിതസർവനാമമായ τι മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒന്നും’ എന്നു പരിഭാഷപ്പെടുന്നു; പ്രസ്താവനയുടെ വ്യാപകതയും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: κατὰ τῆς ἀληθείας
  choice: സത്യത്തിന് എതിരായി
  rationale: ജനിറ്റീവിനോടുകൂടിയ κατά ഇവിടെ എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നിർദ്ദിഷ്ടതയും സത്യത്തെ ഒരു യാഥാർഥ്യമായി കാണുന്ന ഭാവവും ‘സത്യത്തിന്’ നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: ;
  rationale: ἀλλά ശക്തമായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു. ആവർത്തനഭാരം ഒഴിവാക്കി മലയാളത്തിൽ അർധവിരാമത്തിലൂടെയും വാക്യഘടനയിലെ നേരിട്ടുള്ള പ്രതിവിരുദ്ധതയിലൂടെയും ആ ഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: സത്യത്തിനുവേണ്ടി
  rationale: ὑπέρ ഇവിടെ അനുകൂലതയെയോ പിന്തുണയെയോ സൂചിപ്പിക്കുന്നു. ‘സത്യത്തിനുവേണ്ടി’ എന്നത് ‘സത്യത്തിന് എതിരായി’ എന്നതിനോടുള്ള സംക്ഷിപ്തമായ വാചാലസമാന്തര്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സത്യം’ എന്നതിന്റെ പരിധി
  choice: ഒരു പ്രത്യേക ഉപദേശസൂത്രത്തിലേക്ക് ചുരുക്കാതെ ‘സത്യം’ എന്നു തന്നെ നിലനിർത്തി.
  alternative: ‘സുവിശേഷസത്യം’ അല്ലെങ്കിൽ ‘സത്യമായത്’
  rationale: സന്ദർഭത്തിൽ സുവിശേഷസത്യം ഉൾപ്പെടുന്നുണ്ടെങ്കിലും പൗലോസിന്റെ പദപ്രയോഗം അതിലും വിശാലമാണ്. അതിനാൽ വാചകത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും പിരിമുറുക്കവും പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
- issue: രണ്ടാം ഖണ്ഡത്തിലെ ക്രിയയുടെ അധ്യാഹാരം
  choice: മലയാളത്തിൽ വാക്യം പൂർണമാകാൻ ‘പ്രവർത്തിക്കാനാണ് കഴിയുക’ എന്ന് വ്യക്തമാക്കി.
  alternative: ‘എന്നാൽ സത്യത്തിനുവേണ്ടി’ എന്ന ഗ്രീക്കിനോട് കൂടുതൽ രൂപപരമായി ചേർന്ന അപൂർണ പ്രയോഗം
  rationale: ഗ്രീക്കിൽ ആദ്യഖണ്ഡത്തിലെ ‘ചെയ്യാൻ കഴിയും’ രണ്ടാം ഖണ്ഡത്തിൽ അധ്യാഹരിക്കപ്പെടുന്നു. മലയാളത്തിൽ അർഥം മാറ്റാതെ ആ ക്രിയ വ്യക്തമാക്കി; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മാത്രം’ മുഖ്യവാക്യത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സത്യത്തിന് എതിരായി / സത്യത്തിനുവേണ്ടി’ എന്ന പ്രതിവിരുദ്ധ സമാന്തര്യം നിലനിർത്തി. ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലാത്ത ‘മാത്രം’ മുഖ്യവാക്യത്തിൽ ഒഴിവാക്കി; അധ്യാഹൃതമായ ക്രിയ മാത്രം സ്വാഭാവിക മലയാളത്തിനായി വ്യക്തമാക്കി.
