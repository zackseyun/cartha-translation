revisions:
- from: കാരണം, സത്യത്തിന് എതിരായി ഒന്നും ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയില്ല; സത്യത്തിനുവേണ്ടി പ്രവർത്തിക്കാനാണ് കഴിയുക.[a]
  to: കാരണം, സത്യത്തിനെതിരായി ഒന്നും ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയില്ല; മറിച്ച്, സത്യത്തിനുവേണ്ടി ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയും.[a]
  rationale: ‘പ്രവർത്തിക്കാനാണ്’ എന്നതിനു പകരം ‘ചെയ്യാൻ ഞങ്ങൾക്കു കഴിയും’ ഉപയോഗിച്ചതിലൂടെ ഗ്രീക്കിലെ വിശാലമായ പ്രവർത്തനാർഥം നിലനിർത്തി. ‘മറിച്ച്’ ἀλλάയുടെ ശക്തമായ പ്രതിവിരുദ്ധത സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ഗ്രീക്കിൽ സ്വതന്ത്രമായി ഇല്ലാത്ത ‘മാത്രം’ മുഖ്യവാക്യത്തിലോ പാദക്കുറിപ്പിലോ നിർബന്ധിത ഘടകമായി ചേർത്തിട്ടില്ല.
