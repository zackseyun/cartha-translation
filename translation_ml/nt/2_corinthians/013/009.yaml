reference: 2 Corinthians 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ ബലഹീനരായിരിക്കുമ്പോൾ നിങ്ങൾ ശക്തരായിരിക്കുന്നതിൽ ഞങ്ങൾ സന്തോഷിക്കുന്നു. നിങ്ങളുടെ പുനഃസ്ഥാപനത്തിനായും ഞങ്ങൾ പ്രാർഥിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങളുടെ പക്വത” അഥവാ “നിങ്ങളെ പൂർണരാക്കൽ.” ഗ്രീക്ക് പദത്തിന് പുനഃസ്ഥാപിക്കൽ, സജ്ജമാക്കൽ, അല്ലെങ്കിൽ ഒരാളെ/ഒന്നിനെ ശരിയായ നിലയിലെത്തിക്കൽ എന്നിങ്ങനെയുള്ള അർഥങ്ങളുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: ഞങ്ങൾ സന്തോഷിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള പൗലോസിന്റെ ഇപ്പോഴത്തെ സന്തോഷഭാവം സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിലെ തുടക്കത്തിലുള്ള ‘എന്തെന്നാൽ’ കൃത്രിമമാകുന്നതിനാൽ ബന്ധം വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കി.
- source_word: ὅταν
  choice: ആയിരിക്കുമ്പോൾ
  rationale: ഉപവാക്യത്തിലെ പൊതുവായ കാലസംബന്ധം നിലനിർത്തുന്നു; ‘എപ്പോഴെല്ലാം’ എന്നതിനെക്കാൾ ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: ἀσθενῶμεν
  choice: ഞങ്ങൾ ബലഹീനരായിരിക്കുമ്പോൾ
  rationale: ശാരീരികമോ സാമൂഹികമോ ശുശ്രൂഷാപരമോ ആയ ദൗർബല്യം എന്ന് നിർണ്ണയിക്കാതെ ഗ്രീക്കിലെ വിശാലമായ അർഥവും വിരുദ്ധതയും നിലനിർത്തുന്നു.
- source_word: δυνατοὶ ἦτε
  choice: നിങ്ങൾ ശക്തരായിരിക്കുന്നതിൽ
  rationale: ‘ബലഹീനർ’ എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: ഇതിനായും ഞങ്ങൾ പ്രാർഥിക്കുന്നു
  rationale: καίയുടെ ‘കൂടിയും’ എന്ന ഭാവവും εὔχομαιയുടെ പ്രാർഥനാസൂചനയും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: κατάρτισιν
  choice: നിങ്ങളുടെ യഥാസ്ഥാപനം
  rationale: ശരിയായ നിലയിലാക്കൽ, പുനഃക്രമീകരണം, പൂർണതയിലേക്കു കൊണ്ടുവരൽ എന്നീ സാധ്യതകളിൽ സന്ദർഭത്തിലെ ഇടയപരമായ തിരുത്തൽഭാവം മുൻനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κατάρτισις എന്ന പദത്തിൽ പൗലോസിന്റെ ഇടയപരമായ ലക്ഷ്യം
  choice: നിങ്ങളുടെ യഥാസ്ഥാപനം
  alternative: നിങ്ങളുടെ പക്വത; നിങ്ങളെ പൂർണരാക്കൽ; നിങ്ങളെ ശരിയായ നിലയിലാക്കൽ
  rationale: കൊരിന്ത്യർ ശരിയായ നിലയിലാകണമെന്ന പൗലോസിന്റെ ആഗ്രഹം സന്ദർഭത്തിൽ പ്രധാനമാണ്. ‘യഥാസ്ഥാപനം’ ഒരു സാങ്കേതിക പൂർണതാസിദ്ധാന്തം ഇറക്കുമതി ചെയ്യാതെ ആ ഭാവം നൽകുന്നു; ഗ്രീക്ക് പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ബലഹീനത–ശക്തി എന്ന വൈരുധ്യം നേരിട്ട് നിലനിർത്തി. κατάρτισις എന്ന പദത്തിന്റെ യഥാസ്ഥാപനം/പക്വത/പൂർണത എന്നീ യഥാർഥ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
