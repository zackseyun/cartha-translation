- from: ഞങ്ങൾ ബലഹീനരായിരിക്കുമ്പോൾ നിങ്ങൾ ശക്തരായിരിക്കുന്നതിൽ ഞങ്ങൾ സന്തോഷിക്കുന്നു. നിങ്ങളുടെ യഥാസ്ഥാപനത്തിനായും[a] ഞങ്ങൾ പ്രാർഥിക്കുന്നു.
  to: കാരണം, ഞങ്ങൾ ബലഹീനരായിരിക്കുമ്പോൾ നിങ്ങൾ ശക്തരായിരിക്കുന്നതിൽ ഞങ്ങൾ സന്തോഷിക്കുന്നു. നിങ്ങളുടെ പുനഃസ്ഥാപനത്തിനായും ഞങ്ങൾ പ്രാർഥിക്കുന്നു.[a]
  rationale: The revision explicitly represents γάρ with ‘കാരണം,’ replaces the less idiomatic ‘യഥാസ്ഥാപനം’ with the natural contextual rendering ‘പുനഃസ്ഥാപനം,’ and revises the footnote to preserve the lexical range of κατάρτισις without introducing an inaccurate Malayalam term. The sentence continues to express that Paul and his coworkers rejoice in the Corinthians’ strength and pray also for their restoration.
