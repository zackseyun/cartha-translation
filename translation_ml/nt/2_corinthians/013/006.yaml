id: 2CO.13.6
reference: 2 Corinthians 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλπίζω δὲ ὅτι γνώσεσθε ὅτι ἡμεῖς οὐκ ἐσμὲν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: ml
  text: എന്നാൽ ഞങ്ങൾ പരിശോധനയിൽ പരാജയപ്പെട്ടവരല്ലെന്ന് നിങ്ങൾ അറിയുമെന്നു ഞാൻ പ്രത്യാശിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അംഗീകരിക്കപ്പെടാത്തവരല്ല” അല്ലെങ്കിൽ “അയോഗ്യരല്ല.” പരിശോധനയ്ക്കുശേഷം അംഗീകാരം നേടാതിരിക്കുന്നവരെയാണ് ഗ്രീക്ക് വിശേഷണം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: ഞാൻ പ്രത്യാശിക്കുന്നു
  rationale: വർത്തമാനകാല ഉത്തമപുരുഷ ഏകവചനമായ ക്രിയയുടെ സാധാരണ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ഭാവിയിലേക്കുള്ള പൗലോസിന്റെ പ്രതീക്ഷയും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പരിശോധനയിൽ പരാജയപ്പെടാനുള്ള ആശങ്കയോടുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: γνώσεσθε
  choice: നിങ്ങൾ അറിയും
  rationale: ഭാവിയിൽ കൊരിന്ത്യർ തിരിച്ചറിയാനിരിക്കുന്ന കാര്യത്തെ ലളിതമായി അറിയിക്കുന്നു; ‘മനസ്സിലാക്കും’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് വ്യാഖ്യാനപരമായേക്കാം.
- source_word: ὅτι
  choice: എന്ന്
  rationale: ഉള്ളടക്കവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമം പൗലോസിനെയും സഹപ്രവർത്തകരെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സാധാരണ രൂപം മതിയാകുന്നു.
- source_word: οὐκ ἐσμὲν
  choice: അല്ല
  rationale: ലളിതമായ നിഷേധത്തെ അധിക ഊന്നൽ ചേർക്കാതെ കൃത്യമായി നൽകുന്നു.
- source_word: ἀδόκιμοι
  choice: പരിശോധനയിൽ പരാജയപ്പെട്ടവർ
  rationale: സമീപസന്ദർഭത്തിലെ പരീക്ഷിക്കുക, തെളിയിക്കുക എന്നീ ആശയങ്ങളോട് നേരിട്ട് ബന്ധപ്പെടുകയും പരിശോധനയ്ക്കുശേഷം അംഗീകാരം ലഭിക്കാത്തതിന്റെ അർഥം വ്യക്തമായി നൽകുകയും ചെയ്യുന്നു. ‘അയോഗ്യർ’ എന്നത് ഫലത്തെ മാത്രം സൂചിപ്പിച്ച് പരിശോധനാ രൂപകം മങ്ങിച്ചേക്കാം.
theological_decisions:
- issue: പരിശോധനയുടെയും അപ്പൊസ്തലിക സാധുതയുടെയും സന്ദർഭത്തിൽ ἀδόκιμοι എന്നതിന്റെ പരിഭാഷ
  choice: പരിശോധനയിൽ പരാജയപ്പെട്ടവരല്ല
  alternative: അംഗീകരിക്കപ്പെടാത്തവരല്ല; അയോഗ്യരല്ല
  rationale: ഉടൻ മുമ്പുള്ള വാക്യങ്ങളിലെ സ്വയം പരിശോധിക്കൽ, പരീക്ഷയിൽ നിലനിൽക്കൽ എന്നീ ആശയങ്ങളെ നിലനിർത്തുന്നു. അതേസമയം ‘ശാപാർഹർ’ പോലുള്ള പിൽക്കാല സിദ്ധാന്തഭാരം വഹിക്കുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരിശോധനാ രൂപകം വായനക്കാർക്ക് വ്യക്തമായി നിലനിർത്താൻ വ്യാഖ്യാനപരമെങ്കിലും ഉറവിടസന്ദർഭത്തോട് ചേർന്ന പ്രയോഗം തിരഞ്ഞെടുത്തു.
