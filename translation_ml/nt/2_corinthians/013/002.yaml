id: 2CO.13.2
reference: 2 Corinthians 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ml
  text: 'ഞാൻ മുമ്പേ പറഞ്ഞിട്ടുണ്ട്; രണ്ടാം പ്രാവശ്യം നിങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നപ്പോൾ പറഞ്ഞതുപോലെ, ഇപ്പോൾ അസാന്നിധ്യത്തിലായിരിക്കെ, മുമ്പ് പാപം ചെയ്തവരോടും മറ്റെല്ലാവരോടും ഞാൻ മുൻകൂട്ടി പറയുന്നു: ഞാൻ വീണ്ടും വന്നാൽ[a], അവരെ വെറുതെ വിടുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യക്തമായി: ‘ഞാൻ മൂന്നാം പ്രാവശ്യം വന്നാൽ.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഞാൻ വീണ്ടും വന്നാൽ’ എന്നാണ്; എന്നാൽ പൗലോസിന്റെ സന്ദർശനങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭം, രണ്ടാമത്തെ സന്ദർശനത്തിനു ശേഷമുള്ള മറ്റൊരു വരവിനെ സൂചിപ്പിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: ഞാൻ മുമ്പേ പറഞ്ഞിട്ടുണ്ട്
  rationale: പൂർണകാലക്രിയ മുൻപ് പറഞ്ഞ വാക്കിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രാബല്യം സൂചിപ്പിക്കുന്നു. ‘മുന്നറിയിപ്പ് നൽകി’ എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കാതെ മൂലത്തിലെ ‘പറഞ്ഞു’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: προλέγω
  choice: ഞാൻ മുൻകൂട്ടി പറയുന്നു
  rationale: ‘മുൻകൂട്ടി പറയുക’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും προείρηκα എന്നതുമായ പദബന്ധവും സംരക്ഷിക്കുന്നു; മുന്നറിയിപ്പിന്റെ ഭാവം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: രണ്ടാം പ്രാവശ്യം നിങ്ങളോടൊപ്പം ഉണ്ടായിരുന്നപ്പോൾ പറഞ്ഞതുപോലെ, ഇപ്പോൾ അകലെയായിരിക്കെ
  rationale: ഗ്രീക്കിലെ സങ്കുചിതമായ പ്രയോഗം പൗലോസിന്റെ രണ്ടാമത്തെ നേരിട്ടുള്ള സാന്നിധ്യത്തെയും ഇപ്പോഴത്തെ അസാന്നിധ്യത്തെയും താരതമ്യം ചെയ്യുന്നു. സ്വാഭാവിക മലയാളത്തിനായി ബന്ധം വ്യക്തമാക്കിയെങ്കിലും സന്ദർശനക്രമം മാറ്റിയിട്ടില്ല.
- source_word: τοῖς προημαρτηκόσιν
  choice: മുമ്പ് പാപം ചെയ്തവരോട്
  rationale: മുൻകാലത്ത് ചെയ്ത പാപം ഇതിനകം ചർച്ചയിലുള്ളതാണെന്ന് പൂർണകാല കൃദന്തം സൂചിപ്പിക്കുന്നു. അവർ മാനസാന്തരപ്പെട്ടോ ഇല്ലയോ എന്ന് വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: മറ്റെല്ലാവരോട്
  rationale: λοιποί-യോടുകൂടിയ πᾶσιν സമഗ്രത പ്രകടമാക്കുന്നു; മുമ്പ് പാപം ചെയ്തവരെയും ശേഷിക്കുന്ന എല്ലാവരെയും വേർതിരിക്കുന്ന ഘടന നിലനിർത്തുന്നു.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: ഞാൻ വീണ്ടും വന്നാൽ
  rationale: മറ്റൊരു വരവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപമാണിത്. ‘മൂന്നാം പ്രാവശ്യം’ എന്നത് സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: οὐ φείσομαι
  choice: അവരെ വെറുതെ വിടുകയില്ല
  rationale: φείδομαι കഠിനനടപടിയിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുക, ഒരാളെ വെറുതെ വിടുക എന്നീ ആശയങ്ങൾ നൽകുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി സന്ദർഭത്തിൽ വ്യക്തമായ ബഹുവചന കർമം ചേർത്തിരിക്കുന്നു; പ്രത്യേക ശിക്ഷാരീതി നിർദേശിച്ചിട്ടില്ല.
theological_decisions:
- issue: പൗലോസ് മുന്നറിയിപ്പു നൽകുന്ന കഠിനനടപടിയുടെ വ്യാപ്തി
  choice: മുമ്പ് പാപം ചെയ്തവരെയും മറ്റെല്ലാവരെയും അഭിസംബോധന ചെയ്യുന്ന മുന്നറിയിപ്പായി വിവർത്തനം ചെയ്തു; വീണ്ടും വന്നാൽ അവരെ വെറുതെ വിടുകയില്ല എന്നാണ് പ്രസ്താവന.
  alternative: മുന്നറിയിപ്പ് മുമ്പ് പാപം ചെയ്തവർക്ക് മാത്രമാണെന്നോ, ഒരു പ്രത്യേക സഭാശിക്ഷാരീതിയെയാണ് സൂചിപ്പിക്കുന്നതെന്നോ വായിക്കാം.
  rationale: വാക്യഘടനയിൽ ‘മുമ്പ് പാപം ചെയ്തവർ’ എന്നും ‘മറ്റെല്ലാവരും’ എന്നും രണ്ടു വിഭാഗങ്ങളും അഭിസംബോധന ചെയ്യപ്പെടുന്നു. എന്നാൽ കഠിനനടപടിയുടെ കൃത്യരൂപം മൂലപാഠം പറയാത്തതിനാൽ അതു നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘നിങ്ങളോടൊപ്പം’ എന്നത് സാന്നിധ്യത്തിന്റെ ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ആവർത്തനാത്മക പദബന്ധം ‘മുമ്പേ പറഞ്ഞിട്ടുണ്ട് / മുൻകൂട്ടി പറയുന്നു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; സഭാഭരണരീതിയോ ശിക്ഷയുടെ സ്വഭാവമോ ചേർത്തിട്ടില്ല.
