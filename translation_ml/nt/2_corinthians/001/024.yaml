id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: ml
  text: നിങ്ങളുടെ വിശ്വാസത്തിന്മേൽ ഞങ്ങൾ ആധിപത്യം ചെലുത്തുന്നു എന്നല്ല[a]; മറിച്ച്, നിങ്ങളുടെ സന്തോഷത്തിനായി ഞങ്ങൾ സഹപ്രവർത്തകരാണ്[b]. കാരണം, വിശ്വാസത്താലാണ് നിങ്ങൾ ഉറച്ചുനിൽക്കുന്നത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെ ആശ്രയത്തിന്മേൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ സന്തോഷത്തിനുവേണ്ടിയുള്ള സഹവേലക്കാരാണ് ഞങ്ങൾ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘വിശ്വാസത്തിൽ നിങ്ങൾ ഉറച്ചുനിൽക്കുന്നു.’
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: ആധിപത്യം ചെലുത്തുന്നു
  rationale: കർത്തൃത്വമോ മേൽക്കോയ്മയോ പ്രയോഗിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ നിഷേധാത്മക ഭാവം മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑμῶν τῆς πίστεως
  choice: നിങ്ങളുടെ വിശ്വാസത്തിന്മേൽ
  rationale: ക്രിയയോടു ബന്ധപ്പെട്ട ഗ്രീക്ക് ജനിറ്റീവ് ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; πίστις എന്നതിന് മുഖ്യപാഠത്തിൽ സ്ഥിരമായി ‘വിശ്വാസം’ ഉപയോഗിക്കുന്നു.
- source_word: συνεργοί
  choice: നിങ്ങളോടൊപ്പം പ്രവർത്തിക്കുന്നവർ
  rationale: കൊരിന്ത്യരുടെമേൽ അധികാരം പുലർത്തുന്നതിനു പകരം അവരോടൊപ്പം പങ്കാളികളായി പ്രവർത്തിക്കുന്നു എന്ന വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: നിങ്ങളുടെ സന്തോഷത്തിനായി
  rationale: ജനിറ്റീവ് ഘടന ഇവിടെ അവരുടെ സന്തോഷം ലക്ഷ്യമാക്കിയുള്ള പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῇ γὰρ πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ഡേറ്റീവ് രൂപത്തെ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നതായി എടുത്ത് സംക്ഷിപ്തമായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἑστήκατε
  choice: നിങ്ങൾ ഉറച്ചുനിൽക്കുന്നു
  rationale: പെർഫെക്റ്റ് രൂപത്തിലെ സ്ഥാപിതവും തുടരുന്നതുമായ നില ‘ഉറച്ചുനിൽക്കുന്നു’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടിടത്തുമുള്ള πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഇവിടെ കൊരിന്ത്യരുടെ വിശ്വസിക്കുന്ന നിലപാടാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘വിശ്വസ്തത’ എന്ന പ്രത്യേക അർഥം നിർബന്ധിക്കുന്ന സാഹചര്യമില്ല; ‘ആശ്രയം’ സാധ്യമായ പദപരമായ മറ്റൊരു വിവർത്തനമായി അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: τῇ πίστει എന്ന ഡേറ്റീവിന്റെ ബന്ധം
  choice: വിശ്വാസത്താൽ—മാർഗം അല്ലെങ്കിൽ അടിസ്ഥാനം
  alternative: വിശ്വാസത്തിൽ—മേഖല അല്ലെങ്കിൽ നില
  rationale: ഡേറ്റീവിന് മാർഗം/അടിസ്ഥാനം, മേഖല/നില എന്നീ വായനകൾ സാധ്യമാണ്. മുഖ്യപാഠം ആദ്യത്തേത് സ്വീകരിക്കുമ്പോൾ യഥാർഥമായ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ആധിപത്യം ചെലുത്തുന്നു’ എന്നത് പൗലോസ് നിഷേധിക്കുന്ന അധികാരപ്രയോഗം വ്യക്തമാക്കുന്നു; ‘നിങ്ങളോടൊപ്പം പ്രവർത്തിക്കുന്നവർ’ സഹകരണത്തിന്റെ ആശയം സ്വാഭാവികമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
