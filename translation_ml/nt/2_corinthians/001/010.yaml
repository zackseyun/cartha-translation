  to: 'അവിടുന്ന് അത്ര വലിയ മരണത്തിൽനിന്ന് ഞങ്ങളെ വിടുവിച്ചു, വിടുവിക്കുകയും ചെയ്യും; അവിടുന്നിൽ ഞങ്ങൾ പ്രത്യാശ വെച്ചിരിക്കുന്നു: അവിടുന്ന് ഞങ്ങളെ ഇനിയും വിടുവിക്കും.'
  rationale: The revision retains the source’s literal “death” in the main text and its danger-related alternative in the footnote. It keeps the repeated rescue verb consistent, expresses the settled present relevance of the perfect “we have hoped,” and places the sense of καὶ ἔτι with the final future rescue, where it occurs in the Greek sentence.
