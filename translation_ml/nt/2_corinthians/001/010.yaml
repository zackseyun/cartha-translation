id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: ml
  text: 'അവിടുന്ന് അത്ര വലിയ മരണത്തിൽനിന്ന് ഞങ്ങളെ വിടുവിച്ചു, വിടുവിക്കുകയും ചെയ്യും; അവിടുന്നിൽ ഞങ്ങൾ പ്രത്യാശ വെച്ചിരിക്കുന്നു: അവിടുന്ന് ഞങ്ങളെ ഇനിയും വിടുവിക്കും.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηλικούτου
  choice: അത്ര വലിയ
  rationale: അപകടത്തിന്റെ അതിവലുപ്പം ഊന്നിപ്പറയുന്ന നിർദേശകവിശേഷണത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: θανάτου
  choice: മരണം
  rationale: ഗ്രീക്കിലെ നാമത്തിന്റെ നേരിട്ടുള്ള അർഥവും പൗലോസിന്റെ ശക്തമായ ദൃശ്യഭാഷയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; മാരകമായ അപകടം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐρρύσατο / ῥύσεται
  choice: വിടുവിച്ചു / വിടുവിക്കും
  rationale: അപകടത്തിൽനിന്നുള്ള രക്ഷയെ സൂചിപ്പിക്കുന്ന ഒരേ ക്രിയയുടെ ഭൂതകാല-ഭാവികാല ബന്ധം മലയാളത്തിലും ഒരേ പദമൂലം ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: εἰς ὃν
  choice: അവിടുന്നിൽ
  rationale: പ്രത്യാശയുടെ വ്യക്തിപരമായ ആധാരം സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തിന് സ്വാഭാവികവും ആദരസൂചകവുമായ മലയാളരൂപം.
- source_word: ἠλπίκαμεν
  choice: പ്രത്യാശവെച്ചിരിക്കുന്നു
  rationale: മുൻപ് ഉറപ്പിച്ച പ്രത്യാശ ഇപ്പോഴും തുടരുന്നു എന്ന perfect ക്രിയയുടെ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: καὶ ἔτι
  choice: വീണ്ടും
  rationale: തുടർന്നും ഉണ്ടാകുന്ന വിടുതലിന്റെ പ്രതീക്ഷ സ്വാഭാവികമായി അറിയിക്കുന്നു; വാക്യഘടനയിലെ ഉറപ്പിന്റെ ഭാവം '-മെന്നു' എന്ന രൂപത്തോടൊപ്പം പ്രകടമാകുന്നു.
theological_decisions:
- issue: '''മരണം'' എന്നത് അക്ഷരാർഥത്തിൽ നിലനിർത്തണമോ, മുഖ്യപാഠത്തിൽ ''മാരകമായ അപകടം'' എന്നു വ്യാഖ്യാനിക്കണമോ'
  choice: മുഖ്യപാഠത്തിൽ 'മരണം' നിലനിർത്തി
  alternative: അത്ര മാരകമായ അപകടത്തിൽനിന്ന്
  rationale: ഗ്രീക്ക് പാഠം θάνατος എന്നു നേരിട്ട് പറയുന്നതിനാൽ പൗലോസിന്റെ ശക്തമായ ഭാഷ മുഖ്യപാഠത്തിൽ സംരക്ഷിച്ചു; സന്ദർഭോചിതമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആദരപൂർവവും ഗൗരവമുള്ളതുമായ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടുന്ന്’ ഉപയോഗിച്ചു. ആവർത്തിക്കുന്ന ῥύομαι എന്ന ക്രിയയ്ക്ക് എല്ലായിടത്തും ‘വിടുവിക്കുക’ എന്ന ഒരേ പദമൂലം നൽകി.
