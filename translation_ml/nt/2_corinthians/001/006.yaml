id: 2CO.1.6
reference: 2 Corinthians 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: ml
  text: എന്നാൽ ഞങ്ങൾ കഷ്ടത അനുഭവിക്കുന്നുവെങ്കിൽ, അത് നിങ്ങളുടെ ആശ്വാസത്തിനും[b] രക്ഷയ്ക്കും വേണ്ടിയാണ്; ഞങ്ങൾക്ക് ആശ്വാസം ലഭിക്കുന്നുവെങ്കിൽ, അത് നിങ്ങളുടെ ആശ്വാസത്തിനുവേണ്ടിയാണ്[a]—ഞങ്ങളും സഹിക്കുന്ന അതേ കഷ്ടപ്പാടുകൾ സ്ഥിരതയോടെ സഹിക്കുന്നതിൽ ആ ആശ്വാസം പ്രവർത്തിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഞങ്ങൾക്ക് ആശ്വാസം ലഭിക്കുന്നുവെങ്കിൽ, അത് നിങ്ങളുടെ ആശ്വാസത്തിനുവേണ്ടിയാണ്” എന്ന ഭാഗം ഇല്ല.
    reason: textual_variant
  - marker: b
    text: ഈ വാക്യത്തിലുടനീളം “ആശ്വാസം” എന്നതിന് “പ്രോത്സാഹനം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: ഞങ്ങൾ കഷ്ടത അനുഭവിക്കുന്നെങ്കിൽ
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം തുടരുന്ന സമ്മർദമോ കഷ്ടതയോ അനുഭവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ പ്രയോഗമാണിത്.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: ആശ്വാസം / ആശ്വാസം ലഭിക്കുന്നു
  rationale: ഈ സന്ദർഭത്തിൽ പദം സാന്ത്വനത്തിന്റെയും ശക്തിപ്പെടുത്തലിന്റെയും അർഥം വഹിക്കുന്നു. ആവർത്തിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ ഐക്യം നിലനിർത്താൻ ഒരേ മലയാള പദകുടുംബം ഉപയോഗിച്ചു.
- source_word: σωτηρίας
  choice: രക്ഷ
  rationale: വിടുതൽ എന്ന അർഥസാധ്യത ഉണ്ടായാലും, ഇവിടെ പൗലോസിന്റെ വിശാലമായ രക്ഷാസംബന്ധിയായ ഭാഷ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῆς ἐνεργουμένης
  choice: പ്രവർത്തിക്കുന്നു
  rationale: ആശ്വാസം വെറുതെ നിലനിൽക്കുന്നതല്ല, സഹനത്തിൽ സജീവമായി ഫലം ഉളവാക്കുന്നതാണെന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐν ὑπομονῇ
  choice: സ്ഥിരതയോടെ സഹിക്കുന്നതിൽ
  rationale: ὑπομονή സൂചിപ്പിക്കുന്ന ഉറച്ചുനിൽക്കുന്ന സഹനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τῶν αὐτῶν παθημάτων
  choice: അതേ കഷ്ടപ്പാടുകൾ
  rationale: പൗലോസും കൊരിന്ത്യരും പങ്കിടുന്ന വേദനാനുഭവങ്ങൾക്ക് നേരിട്ടും വ്യക്തമായും യോജിക്കുന്നു.
- source_word: ὑπὲρ
  choice: വേണ്ടിയാണ് / വേണ്ടിയാണ്
  rationale: രണ്ടിടത്തും കൊരിന്ത്യരുടെ പ്രയോജനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ പ്രയോജനാർഥപ്രയോഗം സ്വീകരിച്ചു.
theological_decisions:
- issue: ആശ്വാസവും സ്ഥിരതയോടെയുള്ള സഹനവും തമ്മിലുള്ള ബന്ധം
  choice: “സ്ഥിരതയോടെ സഹിക്കുന്നതിൽ ആ ആശ്വാസം പ്രവർത്തിക്കുന്നു”
  alternative: “അതേ കഷ്ടപ്പാടുകൾ സഹിക്കാൻ ആ ആശ്വാസം നിങ്ങളെ പ്രാപ്തരാക്കുന്നു”
  rationale: ഗ്രീക്ക് വാക്യം ആശ്വാസം സഹനത്തിൽ പ്രവർത്തിക്കുന്നു എന്നു പറയുന്നു; അതിനെ വ്യക്തമായ കാരണഫലബന്ധമായി ചുരുക്കാതെ മൂലപാഠത്തിലെ ബന്ധവും തുറന്ന നിലയും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തനഘടനയും ആശ്വാസം–സഹനം ബന്ധവും പരമാവധി നിലനിർത്തിക്കൊണ്ട് ദീർഘവാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ ഡാഷ് ഉപയോഗിച്ചു.
