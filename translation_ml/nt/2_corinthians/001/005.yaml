  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: ml
  text: എന്തെന്നാൽ, ക്രിസ്തുവിന്റെ കഷ്ടാനുഭവങ്ങൾ ഞങ്ങളിൽ കവിഞ്ഞൊഴുകുന്നതുപോലെതന്നെ[a][b], ക്രിസ്തുവിലൂടെ ഞങ്ങളുടെ ആശ്വാസവും കവിഞ്ഞൊഴുകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിനുവേണ്ടിയുള്ള കഷ്ടാനുഭവങ്ങൾ.’ ഗ്രീക്ക് പ്രയോഗം ക്രിസ്തുവിനുള്ള കഷ്ടാനുഭവങ്ങളെയോ അവനെപ്രതി സഹിക്കുന്ന കഷ്ടാനുഭവങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘ക്രിസ്തു’ എന്നത് ‘മശീഹ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: '[പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല]'
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധകമാണിത്. ഒറ്റവാക്യമായി നൽകിയിരിക്കുന്ന മലയാളപരിഭാഷയിൽ ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് കൃത്രിമമായി തോന്നുന്നതിനാൽ താരതമ്യഘടനയിലൂടെ വിശദീകരണബന്ധം സ്വാഭാവികമായി സൂചിപ്പിച്ചു.
- source_word: καθὼς ... οὕτως
  choice: …പോലെതന്നെ …വും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള താരതമ്യഘടന ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: περισσεύει
  choice: കവിഞ്ഞൊഴുകുന്നു
  rationale: അളവിലധികമുള്ള സമൃദ്ധിയെയും ഒഴുകിപ്പരക്കുന്നതിന്റെയും ദൃശ്യഭാവത്തെയും പകർത്തുന്നു; വാക്യത്തിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തി.
- source_word: τὰ παθήματα
  choice: കഷ്ടാനുഭവങ്ങൾ
  rationale: πάθημα സൂചിപ്പിക്കുന്ന അനുഭവിച്ച കഷ്ടതകളെ വ്യക്തമായി അറിയിക്കുന്ന, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: τοῦ Χριστοῦ
  choice: ക്രിസ്തുവിന്റെ
  rationale: ബന്ധത്തിന്റെ സ്വഭാവം തീർപ്പാക്കാതെ ഗ്രീക്ക് ജനിറ്റീവിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു; ‘ക്രിസ്തുവിനുവേണ്ടിയുള്ള’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: εἰς ἡμᾶς
  choice: നമ്മിലേക്കു
  rationale: കഷ്ടാനുഭവങ്ങൾ പൗലോസിലേക്കും കൂട്ടാളികളിലേക്കും എത്തി അവർ അനുഭവിക്കുന്നു എന്ന ദിശാഭാവം നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ Χριστοῦ
  choice: ക്രിസ്തുവിലൂടെ
  rationale: διά + ജനിറ്റീവ് സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ παράκλησις ἡμῶν
  choice: നമ്മുടെ ആശ്വാസം
  rationale: സന്ദർഭത്തിലെ കഷ്ടത–ആശ്വാസം വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് possessive ഘടന നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘ക്രിസ്തുവിന്റെ കഷ്ടാനുഭവങ്ങൾ’ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: ‘ക്രിസ്തുവിന്റെ’ എന്ന ബന്ധരൂപം നിലനിർത്തി, ക്രിസ്തുവിനോടു ബന്ധപ്പെട്ടതോ അവനിൽ പങ്കുചേരുന്നതുമായ കഷ്ടാനുഭവങ്ങൾ എന്ന വിശാലത തുറന്നുവെച്ചു.
  alternative: ‘ക്രിസ്തുവിനുവേണ്ടിയുള്ള കഷ്ടാനുഭവങ്ങൾ’ അല്ലെങ്കിൽ ‘ക്രിസ്തു അനുഭവിച്ച കഷ്ടങ്ങൾ ഇപ്പോൾ അവന്റെ ജനത്തിൽ നിറയുന്നു.’
  rationale: τοῦ Χριστοῦ പല ബന്ധസൂക്ഷ്മതകൾ അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ ഒന്ന് മാത്രം ഉറപ്പിക്കാതെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുകയും പ്രധാന മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കവിഞ്ഞൊഴുകുന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ സമാന്തരഘടനയും സമൃദ്ധിയുടെ ദൃശ്യഭാവവും കാത്തുസൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
