id: 2CO.1.15
reference: 2 Corinthians 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: ml
  text: ഈ ആത്മവിശ്വാസത്തോടെ ഞാൻ ആദ്യം[a] നിങ്ങളുടെ അടുക്കൽ വരാൻ ഉദ്ദേശിച്ചു; അങ്ങനെ നിങ്ങൾക്ക് രണ്ടാമതൊരു പ്രയോജനം[b] ലഭിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നേരത്തേ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “രണ്ടാമതൊരു കൃപ” അല്ലെങ്കിൽ “രണ്ടാമതൊരു അനുഗ്രഹം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: ഉറപ്പോടെ
  rationale: πεποίθησις സൂചിപ്പിക്കുന്ന ആത്മവിശ്വാസം അഥവാ ഉറച്ച ബോധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘ഉറപ്പ്’ എന്നു നൽകി.
- source_word: ἐβουλόμην
  choice: ഉദ്ദേശിച്ചത്
  rationale: βούλομαι ഇവിടെ ആഗ്രഹത്തോടുകൂടിയ ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്നു; ഔപചാരികമായി ഉറപ്പിച്ച പദ്ധതിയെന്നതിലധികം അർഥം വരാതിരിക്കാൻ ‘ഉദ്ദേശിച്ചത്’ തിരഞ്ഞെടുത്തു.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: ആദ്യം നിങ്ങളുടെ അടുക്കൽ വരാൻ
  rationale: πρότερον യാത്രാക്രമത്തിലെ മുൻഗണനയെ സൂചിപ്പിക്കുന്നതായി പ്രധാനപാഠത്തിൽ നൽകി; ‘നേരത്തേ’ എന്ന കാലസംബന്ധിയായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: δευτέραν χάριν
  choice: രണ്ടാമതൊരു നന്മ
  rationale: ഈ യാത്രാസന്ദർഭത്തിൽ χάρις പൗലോസിന്റെ സന്ദർശനത്തിലൂടെ ലഭിക്കുന്ന നന്മയെയോ അനുഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്നു. ‘നന്മ’ സന്ദർഭാർത്ഥം സ്വാഭാവികമായി അറിയിക്കുമ്പോൾ ‘കൃപ/അനുഗ്രഹം’ എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: σχῆτε
  choice: ലഭിക്കണമെന്നായിരുന്നു
  rationale: ἔχω ഇവിടെ ‘ഉണ്ടായിരിക്കുക/ലഭിക്കുക’ എന്ന പ്രയോഗാർഥത്തിലാണ്; മലയാളത്തിൽ സ്വീകരിക്കുന്നവരുടെ അനുഭവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ലഭിക്കുക’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: χάρις എന്ന പദം രക്ഷാകരമായ ‘കൃപ’യെയാണോ സന്ദർശനത്തിലൂടെ ലഭിക്കുന്ന നന്മയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘നന്മ’
  alternative: ‘കൃപ’ അല്ലെങ്കിൽ ‘അനുഗ്രഹം’
  rationale: യാത്രാപദ്ധതിയാണ് ഉടൻസന്ദർഭം; അതിനാൽ ഇവിടെ സന്ദർശനത്തിലൂടെ ലഭിക്കുന്ന പ്രയോജനം/അനുഗ്രഹം മുൻനിൽക്കുന്നു. എങ്കിലും പദത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ പകരങ്ങൾ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ നീണ്ട ഉദ്ദേശ്യഘടന വ്യക്തമായി നിലനിർത്തി; πρότερον, χάρις എന്നീ പദങ്ങളിലെ യഥാർത്ഥ അർത്ഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
