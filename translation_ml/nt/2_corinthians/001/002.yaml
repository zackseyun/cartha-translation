  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്നും യേശു മശീഹയായ കർത്താവിൽനിന്നും[a][b] നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പരമ്പരാഗതമായി, “യേശുക്രിസ്തു.”
    reason: lexical_alternative
  - marker: b
    text: ചില സന്ദർഭങ്ങളിൽ “കർത്താവ്” എന്നത് “യജമാനൻ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദനത്തിലെ ആശംസാഭാവവും ദൈവിക അനുഗ്രഹത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരവും ഒരുപോലെ നിലനിർത്തുന്ന പതിവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ദാതൃകാർഥത്തിലുള്ള ബഹുവചന സർവനാമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിനിധീകരിക്കുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: പൗലോസിന്റെ ആശംസാസൂത്രത്തിലും വിശാലമായ ബൈബിൾ പ്രയോഗത്തിലും ഉള്ള സമഗ്രക്ഷേമത്തിന്റെ അർഥപ്രതിധ്വനി സംരക്ഷിക്കുന്ന സ്ഥാപിതമായ വിവർത്തനം.
- source_word: ἀπὸ
  choice: നിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടം സൂചിപ്പിക്കുന്നു; രണ്ടു ഉറവിടപദബന്ധങ്ങളോടും ചേർത്ത് മലയാളത്തിൽ വ്യക്തമായി നൽകിയിരിക്കുന്നു.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: ഗ്രീക്കിലെ സമാനാധികരണബന്ധം സ്വാഭാവികമായ മലയാളഘടനയിൽ വ്യക്തമാക്കുന്നു; 'നമ്മുടെ ദൈവവും പിതാവും' എന്ന വ്യത്യസ്ത ഘടന അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: യേശുവിനുള്ള ക്രിസ്തുശാസ്ത്രപരമായ ബഹുമാനപദവിയായി κύριος എന്നതിന്റെ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തനായ രാജാവ്/മശീഹ എന്ന പദവ്യർഥം വെറും ശബ്ദലിപ്യന്തരണത്തിൽ മറയ്ക്കാതെ സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ പേരിനോടു ചേർന്ന പദവിയായി സ്വാഭാവികമായി നിൽക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അഭിവാദനത്തിൽ Χριστοῦ എന്നതിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: പദത്തിന്റെ മശീഹാപദവിയെന്ന അർഥം വായനക്കാരന് തുറന്നുകാട്ടുന്നു; പരമ്പരാഗത ശബ്ദരൂപവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: യേശുവിനെ സംബന്ധിച്ച κυρίου എന്ന പദം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ദൈവമായ പിതാവിനോടൊപ്പം അനുഗ്രഹത്തിന്റെ ഉറവിടമായി യേശുവിനെ അവതരിപ്പിക്കുന്ന ഈ സൂത്രത്തിൽ 'കർത്താവ്' ന്യൂനപക്ഷ വ്യാഖ്യാനം ചുമത്താതെ ഗൗരവവും ക്രിസ്തുശാസ്ത്രപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- issue: ἀπόയുടെ പരിധിയും രണ്ടു വ്യക്തികളിൽനിന്നുള്ള ഉറവിടസൂചനയും
  choice: ദൈവത്തിൽനിന്നും ... യേശു മശീഹയിൽനിന്നും
  alternative: ദൈവവും ... യേശു മശീഹയും നൽകുന്ന
  rationale: മൂലത്തിലെ ഉറവിടസൂചന നേരിട്ട് നിലനിർത്തുകയും പിതാവിനെയും കർത്താവായ യേശുവിനെയും കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടമായി അവതരിപ്പിക്കുന്ന വാക്യഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശംസാശൈലി. മൂലത്തിലെ നാമവാക്യരൂപം മലയാളത്തിൽ പൂർണ്ണ ആശംസയായി സ്വാഭാവികമാക്കാൻ “ഉണ്ടാകട്ടെ” ചേർത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
