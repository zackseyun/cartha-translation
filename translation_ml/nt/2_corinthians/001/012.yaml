id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: ml
  text: 'ഞങ്ങളുടെ അഭിമാനം ഇതാണ്: ലോകത്തിൽ ഞങ്ങൾ വിശുദ്ധിയിലും[a] ദൈവത്തിൽനിന്നുള്ള നിഷ്കപടതയിലും[b]—ജഡിക ജ്ഞാനത്തിലല്ല[c], ദൈവകൃപയിൽ—പെരുമാറിയെന്നും, പ്രത്യേകിച്ച് നിങ്ങളോട് അങ്ങനെ പെരുമാറിയെന്നും ഞങ്ങളുടെ മനസ്സാക്ഷി സാക്ഷ്യം പറയുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “വിശുദ്ധി” എന്നതിനുപകരം “ലാളിത്യം” എന്നാണ് വായന.
    reason: textual_variant
  - marker: b
    text: അഥവാ “ദൈവികമായ നിഷ്കപടത.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “മാനുഷിക ജ്ഞാനത്തിലല്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: അഭിമാനം
  rationale: പൗലോസ് ഉദ്ദേശിക്കുന്ന ന്യായമായ ആത്മവിശ്വാസത്തെയും അഭിമാനിക്കാനുള്ള അടിസ്ഥാനത്തെയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; വെറും അഹങ്കാരം എന്ന നിഷേധാത്മക അർഥത്തിൽ ഒതുക്കുന്നില്ല.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: ഞങ്ങളുടെ മനസ്സാക്ഷി സാക്ഷ്യം പറയുന്നു
  rationale: ഗ്രീക്കിലെ നാമപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ ക്രിയാപ്രയോഗമാക്കി; മനസ്സാക്ഷിയുടെ ആന്തരിക സാക്ഷ്യപ്പെടുത്തൽ നിലനിർത്തുന്നു.
- source_word: ἁγιότητι
  choice: വിശുദ്ധിയോടും
  rationale: SBLGNT മുഖ്യവായനയുടെ ധാർമികവും ദൈവബന്ധിതവുമായ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള നിഷ്കപടതയോടും
  rationale: εἰλικρίνεια എന്നതിന്റെ സത്യസന്ധതയും കലർപ്പില്ലായ്മയും ‘നിഷ്കപടത’ അറിയിക്കുന്നു; τοῦ θεοῦ എന്ന ഷഷ്ഠീവ്യവഹാരത്തെ ദൈവം ഉറവിടമാണെന്ന സാധ്യതയായി മുഖ്യവാചകത്തിൽ അവതരിപ്പിക്കുമ്പോഴും അടിക്കുറിപ്പിൽ ഗുണസൂചക വായന നിലനിർത്തുന്നു.
- source_word: σοφίᾳ σαρκικῇ
  choice: ജഡിക ജ്ഞാനത്താൽ
  rationale: σαρκ- പദകുടുംബം ദൃശ്യമാക്കുകയും മനുഷ്യസ്വഭാവത്തിൽ ആശ്രയിക്കുന്ന ജ്ഞാനം എന്ന പൗലോസിന്റെ വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: χάριτι θεοῦ
  choice: ദൈവകൃപയാൽ
  rationale: പ്രവൃത്തിയുടെ മാർഗമോ പ്രേരകശക്തിയോ ദൈവത്തിന്റെ കൃപയാണെന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνεστράφημεν
  choice: ഞങ്ങൾ ... പെരുമാറി
  rationale: ഇവിടെ ക്രിയ സൂചിപ്പിക്കുന്ന ജീവിതനടത്തയെയും പെരുമാറ്റരീതിയെയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: വിശേഷാൽ നിങ്ങളോടുള്ള ഞങ്ങളുടെ പെരുമാറ്റം
  rationale: περισσοτέρως എന്ന താരതമ്യ ഊന്നലും πρὸς ὑμᾶς എന്ന ബന്ധപരമായ അർഥവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: εἰλικρινείᾳ τοῦ θεοῦ എന്നതിലെ τοῦ θεοῦ-യുടെ അർഥബലം
  choice: ‘ദൈവത്തിൽനിന്നുള്ള നിഷ്കപടത’—ദൈവത്തെ അതിന്റെ ഉറവിടമായി വായിക്കുന്നു.
  alternative: ‘ദൈവികമായ നിഷ്കപടത’ അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ നിഷ്കപടത’.
  rationale: ഷഷ്ഠീവ്യവഹാരം ഉറവിടമോ ഗുണമോ സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ സന്ദർഭോചിതമായ ഉറവിടവായന സ്വീകരിച്ചെങ്കിലും മറ്റൊരു യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: σοφίᾳ σαρκικῇ എന്നതിലെ σάρξ-ന്റെ ശക്തി
  choice: ‘ജഡിക ജ്ഞാനം’ എന്ന് പദബന്ധം നിലനിർത്തി.
  alternative: ‘മാനുഷിക ജ്ഞാനം’.
  rationale: ‘മാനുഷികം’ വായിക്കാൻ എളുപ്പമാണെങ്കിലും പൗലോസിന്റെ σάρξ പദകുടുംബത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം ക്ഷയിപ്പിക്കാം; അതിനാൽ അത് അടിക്കുറിപ്പിലെ അർഥവ്യക്തീകരണമായി മാത്രം നൽകി.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യം നിലനിർത്തിയെങ്കിലും ഡാഷുകളും ആവർത്തിച്ച ‘പെരുമാറ്റം’ എന്ന ആശയവും ഉപയോഗിച്ച് ലോകത്തിലെ പൊതുനടത്തയും കൊരിന്ത്യരോടുള്ള പ്രത്യേക നടത്തയും വ്യക്തമായി വേർതിരിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
