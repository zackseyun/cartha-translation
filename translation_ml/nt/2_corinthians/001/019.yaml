  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: ml
  text: ദൈവപുത്രനായ യേശുക്രിസ്തു[a] ഞങ്ങളിലൂടെ—എന്നിലൂടെയും സില്വാനൊസിലൂടെയും തിമൊഥെയൊസിലൂടെയും—നിങ്ങളുടെ ഇടയിൽ പ്രഘോഷിക്കപ്പെട്ടവൻ[b] “അതെ”യും “അല്ല”യും ആയിത്തീർന്നില്ല; മറിച്ച്, അവനിൽ “അതെ” ആയിത്തീർന്നിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശുവായ മശീഹാ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞങ്ങളാൽ നിങ്ങളുടെ ഇടയിൽ പ്രഘോഷിക്കപ്പെട്ടവൻ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “അവൻ ‘അതെ’യും ‘അല്ല’യും ആയിരുന്നില്ല; എന്നാൽ അവനിൽ ‘അതെ’ ആയിരിക്കുന്നു.”
    reason: alternative_reading
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: പദവിസ്വഭാവവും ക്രിസ്തുശാസ്ത്രപരമായ പ്രാധാന്യവും നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും പരിചിതവുമായ പ്രയോഗം.
- source_word: Ἰησοῦς Χριστός
  choice: യേശുക്രിസ്തു
  rationale: ഇവിടെ ഈ സംയുക്തപ്രയോഗം വ്യക്തിനാമസദൃശമായി പ്രവർത്തിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്ഥിരപ്രയോഗമായ ‘യേശുക്രിസ്തു’ സ്വീകരിച്ചു; Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹാ എന്ന പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κηρυχθείς
  choice: പ്രസംഗിക്കപ്പെട്ടവൻ
  rationale: κηρύσσω എന്നതിന്റെ പരസ്യപ്രഖ്യാപനത്തിന്റെ ആശയം സൂക്ഷിക്കുമ്പോഴും സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: δι’ ἡμῶν
  choice: ഞങ്ങളിലൂടെ
  rationale: διά സൂചിപ്പിക്കുന്ന മാധ്യമം/കാര്യകർത്തൃത്വം നിലനിർത്തുകയും തുടർന്ന് പേരുകൾക്കുമുമ്പ് ആവർത്തിക്കുന്ന ഗ്രീക്ക് ഘടന പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: എന്നിലൂടെയും സില്വാനൊസിലൂടെയും തിമൊഥെയൊസിലൂടെയും
  rationale: മൂലത്തിലെ ആവർത്തിത διά-ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: “അതെ” എന്നും “അല്ല” എന്നും ആയിത്തീർന്നില്ല
  rationale: ἐγένετο എന്ന ക്രിയയുടെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മകതയും പൗലൊസിന്റെ സുതാര്യമായ ‘അതെ/അല്ല’ വിരുദ്ധപ്രയോഗവും വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: മറിച്ച്, അവനിൽ “അതെ” ആയിത്തീർന്നിരിക്കുന്നു
  rationale: γέγονεν എന്ന perfect ക്രിയയുടെ പൂർത്തിയായതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഭാവം ‘ആയിത്തീർന്നിരിക്കുന്നു’ വഴി പ്രകടമാക്കുന്നു; ‘അവനിൽ’ എന്ന ദൈവശാസ്ത്രപരമായി സാന്ദ്രമായ പ്രയോഗം വിശദീകരിച്ച് മാറ്റുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്നത് പദവിയായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തുക
  choice: യേശുക്രിസ്തു
  alternative: മശീഹയായ യേശു
  rationale: ഈ വാക്യത്തിൽ Ἰησοῦς Χριστός ഒരു സ്ഥിരമായ വ്യക്തിനാമസദൃശ നിർദ്ദേശമായി നിൽക്കുന്നു. മലയാളത്തിലെ ‘ക്രിസ്തു’ അഭിഷിക്തൻ എന്ന പദവിയുടെ ഭാരം പൂർണമായി ഇല്ലാതാക്കാതെ സ്വാഭാവികതയും സഭാതീതമായ പൊതുപരിചിതത്വവും നൽകുന്നു.
- issue: Ναί/Οὔ എന്ന വിരുദ്ധപ്രയോഗം വ്യാഖ്യാനിക്കണമോ സുതാര്യമായി നിലനിർത്തണമോ
  choice: “അതെ” എന്നും “അല്ല” എന്നും ... അവനിൽ “അതെ”
  alternative: അസ്ഥിരനായിരുന്നില്ല; വിശ്വസ്തനായിരുന്നു
  rationale: മൂലത്തിലെ വാചാടോപപരവും ദൈവശാസ്ത്രപരമായി സാന്ദ്രവുമായ ഭാഷയെ ‘അസ്ഥിരത/വിശ്വസ്തത’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ അതേ സംഘർഷത്തോടെ നിലനിർത്തുന്നു.
- issue: γέγονεν എന്ന perfect ക്രിയയുടെ ഭാവം
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  alternative: ആയിരുന്നു
  rationale: സംഭവിച്ച കാര്യത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കാൻ മലയാളത്തിലെ perfect-സദൃശ രൂപം ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും മനസ്സിലാകുന്ന ശൈലി. ഗ്രീക്കിലെ διά-ആവർത്തനം ദീർഘമായി തോന്നാതിരിക്കാൻ ഇടവരകളാൽ വേർതിരിച്ചു. ‘അതെ/അല്ല’ എന്ന അസാധാരണ രൂപകം വ്യാഖ്യാനപരമായി മിനുക്കാതെ ഉദ്ധരണിചിഹ്നങ്ങളോടെ നിലനിർത്തി.
