id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ[b] യേശു മശീഹയുടെ[a] ദൈവവും പിതാവുമായവൻ വാഴ്ത്തപ്പെടട്ടെ—കരുണകളുടെ[c] പിതാവും എല്ലാ ആശ്വാസത്തിന്റെയും[d] ദൈവവുമായവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യേശുക്രിസ്തു.”
    reason: alternative_reading
  - marker: b
    text: “കർത്താവ്” എന്നതിന് “യജമാനൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “കരുണകൾ” എന്നതിന് “അനുകമ്പകൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: “ആശ്വാസം” എന്നതിന് “പ്രോത്സാഹനം” അല്ലെങ്കിൽ “സാന്ത്വനം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: വാഴ്ത്തപ്പെടുമാറാകട്ടെ
  rationale: ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന സ്തുതിസൂത്രത്തിലെ വിധേയവിശേഷണത്തിന്റെ ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: ദൈവവും പിതാവുമായവൻ
  rationale: ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചന ഘടന നിലനിർത്തുന്നു; മലയാളത്തിൽ തെറ്റായ രണ്ടു-പരാമർശ വായന ഒഴിവാക്കാൻ ‘മായവൻ’ ചേർത്തു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ κύριος എന്ന പദത്തിന് പരിചിതവും ഗൗരവമുള്ളതുമായ മലയാള സമാനപദം.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: അഭിഷിക്തൻ എന്ന പദവിയുടെ അർത്ഥം ദൃശ്യമാക്കുന്നു; ഇവിടെ യേശുവിനോടു ചേർന്ന പദവിയായാണ് ഗ്രഹിച്ചിരിക്കുന്നത്.
- source_word: οἰκτιρμῶν
  choice: കരുണകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുകയും ദൈവത്തിന്റെ സമൃദ്ധമായ കരുണാഭാവങ്ങളെയും കരുണാപ്രവൃത്തികളെയും സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πάσης παρακλήσεως
  choice: എല്ലാ ആശ്വാസത്തിന്റെയും
  rationale: πάσης എന്നതിന്റെ സമഗ്രതയും παρακλήσεως എന്നതിന്റെ സന്ദർഭോചിതമായ മുഖ്യാർഥമായ ആശ്വാസവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστός-ന്റെ അവതരണം
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ പദവിയുടെ ശക്തി നിലനിർത്തുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ വ്യക്തിനാമത്തോടൊപ്പം ഇത് സ്വാഭാവികമായി നിശ്ചയാർഥം വഹിക്കുന്നു.
- issue: ὁ πατὴρ τῶν οἰκτιρμῶν എന്ന ബന്ധത്തിന്റെ അർത്ഥം
  choice: കരുണകളുടെ പിതാവ്
  alternative: കരുണയുടെ ഉറവിടം
  rationale: മൂലത്തിലെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു; ‘ഉറവിടം’ അതിന്റെ സാധ്യതയുള്ള അർത്ഥവ്യാഖ്യാനമാണെങ്കിലും പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള സ്തുതിശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി ദീർഘരേഖകൊണ്ട് വിഭജിച്ചെങ്കിലും സമാന്തരബന്ധവും ഏകപരാമർശവും സംരക്ഷിച്ചിട്ടുണ്ട്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
