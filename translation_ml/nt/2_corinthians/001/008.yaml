reference: 2 Corinthians 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: ml
  text: സഹോദരന്മാരേ,[a] ഏഷ്യയിൽ[b] ഞങ്ങൾക്കുണ്ടായ കഷ്ടതയെക്കുറിച്ച് നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് ഞങ്ങൾ ആഗ്രഹിക്കുന്നില്ല. അളവതികന്ന്, ഞങ്ങളുടെ ശക്തിക്കപ്പുറം, ഞങ്ങൾ ഭാരത്താൽ ഞെരുങ്ങി; ജീവനെക്കുറിച്ചുപോലും ഞങ്ങൾ നിരാശരായി.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരന്മാരേ” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദം പുല്ലിംഗ ബഹുവചനമാണ്; ഇവിടെ അത് വിശ്വാസിസമൂഹത്തിലെ സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന അഭിസംബോധനയായിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: “ഏഷ്യ” എന്നത് ആധുനിക ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുണ്ടായിരുന്ന റോമൻ പ്രവിശ്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: 'അഥവാ: “ജീവിച്ചിരിക്കുമെന്ന പ്രത്യാശപോലും ഞങ്ങൾക്കില്ലാതായി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: നിങ്ങൾ അറിയാതിരിക്കണമെന്നു ഞങ്ങൾ ആഗ്രഹിക്കുന്നില്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മകമായ ഇച്ഛാപ്രസ്താവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; γάρ-ന്റെ ബന്ധകബലം സന്ദർഭത്തിൽ മലയാള വാക്യപ്രവാഹത്തിലൂടെ വ്യക്തമാകുന്നതിനാൽ പ്രത്യേകം ‘എന്തെന്നാൽ’ ചേർത്തിട്ടില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു; സമൂഹത്തെ ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: ഏഷ്യയിൽ ഞങ്ങൾക്കുണ്ടായ കഷ്ടതയെക്കുറിച്ച്
  rationale: θλῖψις സൂചിപ്പിക്കുന്ന ഗുരുതര ദുരിതം ‘കഷ്ടത’ സ്വാഭാവികമായി നൽകുന്നു; participial construction മലയാളത്തിൽ സുഗമമായി പുനഃക്രമീകരിച്ചു.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: ഞങ്ങളുടെ ശക്തിക്കപ്പുറം അത്യന്തം ഭാരപ്പെടേണ്ടിവന്നു
  rationale: അളവുകടന്ന തീവ്രതയും സ്വന്തം ശേഷിക്കപ്പുറമുള്ള സമ്മർദവും ഭാരത്തിന്റെ രൂപകവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: ജീവിച്ചിരിക്കുമെന്ന പ്രത്യാശപോലും ഞങ്ങൾക്കില്ലാതായി
  rationale: ഫലബന്ധവും ജീവൻ തുടരുമെന്ന കാര്യത്തിലെ അത്യന്ത നിരാശയും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥസമീപമായ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ലേഖനാഭിസംബോധനയായ ἀδελφοίയുടെ ലിംഗസൂചന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുകയും, മിശ്ര വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗമായിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ പറയുകയും ചെയ്യുന്നു.
- issue: καὶ τοῦ ζῆν സൂചിപ്പിക്കുന്ന നിരാശയുടെ പരിധി
  choice: ജീവിച്ചിരിക്കുമെന്ന പ്രത്യാശപോലും ഞങ്ങൾക്കില്ലാതായി
  alternative: ജീവിക്കുന്നതിനെക്കുറിച്ചുപോലും ഞങ്ങൾ നിരാശരായി
  rationale: ഇത് മരണത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ പ്രസ്താവനയായി വികസിപ്പിക്കാതെ, പൗലൊസിന്റെ അനുഭവപരമായ അത്യന്ത നിരാശയായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ തീവ്രത, ശേഷിക്കപ്പുറമുള്ള ഭാരം, ജീവനെക്കുറിച്ചുള്ള നിരാശ എന്നിവ നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യ സഭാപരമായ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
