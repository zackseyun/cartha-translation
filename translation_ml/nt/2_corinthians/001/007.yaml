id: 2CO.1.7
reference: 2 Corinthians 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: ml
  text: നിങ്ങളെക്കുറിച്ചുള്ള ഞങ്ങളുടെ പ്രത്യാശ ഉറപ്പുള്ളതാണ്; കാരണം, നിങ്ങൾ കഷ്ടാനുഭവങ്ങളിൽ പങ്കാളികളായിരിക്കുന്നതുപോലെ ആശ്വാസത്തിലും[a] പങ്കാളികളാണെന്ന് ഞങ്ങൾ അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആശ്വാസം” (παράκλησις) എന്നതിന് “പ്രോത്സാഹനം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: പ്രത്യാശ
  rationale: പ്രതീക്ഷയുടെയും ആത്മവിശ്വാസത്തിന്റെയും ഭാവങ്ങൾ ഉൾക്കൊള്ളുന്ന, മലയാളത്തിലെ സുതാര്യവും പതിവുമായ തത്തുല്യപദം.
- source_word: βεβαία
  choice: ഉറപ്പുള്ളതാണ്
  rationale: പൗലോസിന്റെ പ്രത്യാശയുടെ ദൃഢവും ആശ്രയിക്കാവുന്നതുമായ സ്വഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ചുള്ള
  rationale: ഇവിടെ ὑπέρ കൊരിന്ത്യരെ സംബന്ധിച്ചുള്ള പരാമർശം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ 'നിങ്ങളെക്കുറിച്ചുള്ള' എന്നത് ഈ ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: εἰδότες
  choice: കാരണം ... ഞങ്ങൾ അറിയുന്നു
  rationale: കൃ participle മുൻവാക്യത്തിലെ ഉറപ്പിന് ആധാരമാകുന്നു; കാരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὡς ... οὕτως καί
  choice: '...പോലെ ...ത്തിലും'
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള താരതമ്യഘടന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: κοινωνοί
  choice: പങ്കാളികളായിരിക്കുന്നു / പങ്കാളികളാണ്
  rationale: നാമരൂപം സൂചിപ്പിക്കുന്ന പങ്കാളിത്തം നിലനിർത്തുകയും രണ്ടാം ഉപവാക്യത്തിലെ ഗ്രീക്ക് ലോപം മലയാളത്തിൽ ആവശ്യമായ ക്രിയയോടെ പൂർത്തിയാക്കുകയും ചെയ്യുന്നു.
- source_word: παθημάτων
  choice: കഷ്ടാനുഭവങ്ങൾ
  rationale: വേദനയും പീഡനവും ഉൾപ്പെടുന്ന വിശാലമായ അർത്ഥം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: παρακλήσεως
  choice: ആശ്വാസം
  rationale: 2 കൊരിന്ത്യർ 1-ലെ ആവർത്തിത പ്രമേയത്തോടു യോജിച്ച്, ദുഃഖത്തിൽ ലഭിക്കുന്ന ആശ്വസിപ്പിക്കൽ എന്ന സന്ദർഭാർഥം മുൻനിർത്തുന്നു; 'പ്രോത്സാഹനം' എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: '[elliptical second clause]'
  choice: ആശ്വാസത്തിലും പങ്കാളികളാണ്
  rationale: ഗ്രീക്കിൽ രണ്ടാം ഉപവാക്യത്തിൽ ക്രിയ ആവർത്തിക്കാത്തെങ്കിലും മലയാളത്തിൽ അർത്ഥവ്യക്തതയ്ക്കായി ആദ്യ ഉപവാക്യത്തിലെ പങ്കാളിത്തധാരണ സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ 'എങ്ങനെ/അങ്ങനെ' എന്ന പങ്കാളിത്തസമാന്തര്യം സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട പദമായ 'ആശ്വാസം' ഉൾപ്പെടുന്ന വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
