id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: ml
  text: നമ്മുടെ സകല കഷ്ടതകളിലും നമ്മെ ആശ്വസിപ്പിക്കുന്നവൻ, അങ്ങനെ ദൈവം നമുക്കുതന്നെ നൽകുന്ന ആശ്വാസംകൊണ്ട് ഏതു കഷ്ടതയിലും കഴിയുന്നവരെ ആശ്വസിപ്പിക്കാൻ നമുക്കു കഴിയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: ആശ്വസിപ്പിക്കുന്നവൻ / ആശ്വസിപ്പിക്കാൻ / ആശ്വാസം / ആശ്വസിപ്പിക്കുന്ന
  rationale: കഷ്ടതയുടെ പശ്ചാത്തലത്തിൽ ശക്തിപ്പെടുത്തുന്ന സാന്ത്വനം എന്ന അർഥം മുൻനിൽക്കുന്നു. ഒരേ പദകുടുംബം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനബന്ധം കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: നമ്മുടെ സകല കഷ്ടതകളിലും
  rationale: θλῖψις സൂചിപ്പിക്കുന്ന സമ്മർദവും ദുരിതവും ‘കഷ്ടത’ സ്വാഭാവികമായി നൽകുന്നു; συλλക ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി അവതരിപ്പിച്ചു.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: അങ്ങനെ ... നമുക്കു കഴിയും
  rationale: ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ഫലപ്രകടനമായി നൽകുന്നു.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: ഏതു കഷ്ടതയിലും കഴിയുന്നവരെ
  rationale: ഇവിടത്തെ πάσῃ-യുടെ വ്യാപകവും വിതരണാത്മകവുമായ അർഥം ‘ഏതു ... യിലും’ വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοὶ ὑπὸ τοῦ θεοῦ
  choice: ദൈവം നമ്മെത്തന്നെ
  rationale: αὐτοί-യുടെ ഊന്നൽ ‘നമ്മെത്തന്നെ’ എന്നതിൽ നിലനിർത്തി; ഗ്രീക്കിലെ കർമണിപ്രയോഗം മലയാളത്തിലെ സ്വാഭാവികമായ കർത്തരിപ്രയോഗമാക്കിയെങ്കിലും ദൈവിക കർത്തൃത്വം വ്യക്തമായി സൂക്ഷിച്ചു.
theological_decisions:
- issue: παρακαλέω / παράκλησις എന്ന പദകുടുംബത്തിന്റെ അർഥവ്യാപ്തി
  choice: ആശ്വസിപ്പിക്കുക / ആശ്വാസം
  alternative: ധൈര്യപ്പെടുത്തുക / പ്രോത്സാഹിപ്പിക്കുക
  rationale: θλῖψις എന്ന കഷ്ടതാപശ്ചാത്തലത്തിൽ സാന്ത്വനവും ശക്തിപ്പെടുത്തലും ചേർന്ന അർഥമാണ് പ്രധാനം. ‘ആശ്വാസം’ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികവും ആത്മീയമായി അനാവശ്യമായി ചുരുക്കാത്തതുമാണ്; മറ്റൊരു സാധുവായ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലവാക്യം മുൻവാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ ‘ആശ്വസിപ്പിക്കുന്നവൻ’ എന്ന ബന്ധവാക്യരൂപം നിലനിർത്തി. കർമണിപ്രയോഗത്തിന്റെ കൃത്രിമത ഒഴിവാക്കാൻ അവസാന ഘടകം സ്വാഭാവികമായ കർത്തരിപ്രയോഗത്തിൽ നൽകി.
