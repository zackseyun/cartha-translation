id: 2CO.1.20
reference: 2 Corinthians 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: ml
  text: ദൈവത്തിന്റെ വാഗ്ദാനങ്ങൾ എത്രയുണ്ടെങ്കിലും, അവനിൽ അവയ്ക്ക് “അതേ”യാണ്.[a] അതുകൊണ്ടാണ്, ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി, നമ്മിലൂടെ അവനാൽ ദൈവത്തോടു “ആമേൻ”[b] പറയപ്പെടുന്നതും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യക്തമാക്കി: “അവനിൽ അവയ്ക്ക് അവയുടെ ‘അതേ’ ഉണ്ട്.”'
    reason: alternative_reading
  - marker: b
    text: “ആമേൻ” എന്നത് “സത്യമായി” അല്ലെങ്കിൽ “അങ്ങനെതന്നെ ആകട്ടെ” എന്നതുപോലുള്ള ഉറപ്പിനെ സൂചിപ്പിക്കുന്ന, എബ്രായത്തിൽനിന്നു വന്ന വാക്കാണ്.
    reason: cultural_note
  - marker: c
    text: 'ഗ്രീക്കിൽ “ആമേൻ പറയുക” എന്ന ക്രിയ തുറന്നുപറയുന്നില്ല. പദാനുപദക്രമം: “അതിനാൽ അവനിലൂടെ ‘ആമേൻ’ ദൈവത്തോടു, മഹത്ത്വത്തിനായി, നമ്മിലൂടെ.” “മഹത്ത്വത്തിനായി” എന്നത് ദൈവത്തിന്റെ മഹത്ത്വം ഉദ്ദേശിച്ചാണെന്നു ഗ്രഹിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: എത്രതന്നെയായാലും
  rationale: ദൈവത്തിന്റെ എല്ലാ വാഗ്ദാനങ്ങളെയും ഒന്നുപോലും ഒഴിവാക്കാതെ ഉൾക്കൊള്ളുന്ന അനിശ്ചിത സമഗ്രത സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐπαγγελίαι θεοῦ
  choice: ദൈവത്തിന്റെ വാഗ്ദാനങ്ങൾ
  rationale: വാഗ്ദാനങ്ങൾ ദൈവത്തിന്റേതാണെന്ന ജനിറ്റീവ് ബന്ധം നേരിട്ടും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ക്രിസ്തുവുമായുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ചുരുക്കപ്രയോഗം നിലനിർത്തുന്നു; ‘നിവൃത്തിയാകുന്നു’ പോലുള്ള വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τὸ Ναί
  choice: “അതേ”
  rationale: ഊന്നലോടെയുള്ള സമ്മതവാക്ക് എന്ന പ്രയോഗം നിലനിർത്തുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ‘അവയ്ക്ക് … എന്നാണ്’ എന്ന കുറഞ്ഞ വ്യാകരണപൂരണം ഉപയോഗിച്ചു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന ക്രിസ്തുവിന്റെ മധ്യസ്ഥത നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ Ἀμὴν
  choice: “ആമേൻ”
  rationale: ഗ്രീക്കിലും ലിപ്യന്തരണം ചെയ്തിരിക്കുന്ന ആരാധനാപരമായ ഉറപ്പുവാക്ക് മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: ‘ആമേൻ’ ദൈവത്തോടു നേർക്കുള്ളതാണെന്ന ദാതൃകബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: πρὸς δόξαν δι’ ἡμῶν
  choice: നമ്മിലൂടെ ദൈവത്തിനു മഹത്ത്വം ഉണ്ടാകേണ്ടതിന്
  rationale: മഹത്ത്വം ലക്ഷ്യമാണെന്ന πρὸς-പ്രയോഗവും ‘നമ്മിലൂടെ’ എന്ന മധ്യസ്ഥപ്രയോഗവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വാക്യഘടനയിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിൽ ദൈവവാഗ്ദാനങ്ങൾ നിവൃത്തിയാകുന്നു എന്ന ആശയം തുറന്നുപറയണമോ
  choice: “അവനിൽ അവയ്ക്ക് ‘അതേ’ എന്നാണ്” എന്ന ചുരുക്കവും രൂപകാത്മകവുമായ പ്രസ്താവന നിലനിർത്തി.
  alternative: “അവനിൽ ദൈവത്തിന്റെ എല്ലാ വാഗ്ദാനങ്ങളും നിവൃത്തിയാകുന്നു.”
  rationale: നിവൃത്തി എന്ന ആശയം സന്ദർഭത്തിൽ ശക്തമായി സൂചിപ്പിച്ചിട്ടുണ്ടെങ്കിലും ഗ്രീക്ക് പാഠം അത് ആ ക്രിയ ഉപയോഗിച്ച് തുറന്നുപറയുന്നില്ല. അതിനാൽ പൗലോസിന്റെ വാചകത്തിലെ സാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ സമ്മർദവും സംരക്ഷിച്ചു.
- issue: πρὸς δόξαν എന്നത് τῷ θεῷ എന്നതിനോടുള്ള ബന്ധം എത്ര വ്യക്തമായി പ്രകടിപ്പിക്കണം
  choice: “ദൈവത്തിനു മഹത്ത്വം ഉണ്ടാകേണ്ടതിന്” എന്നു മുഖ്യപാഠത്തിൽ നൽകി.
  alternative: “നമ്മിലൂടെ ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി” അല്ലെങ്കിൽ കൂടുതൽ പദാനുപദമായി “മഹത്ത്വത്തിനായി നമ്മിലൂടെ ദൈവത്തിനു.”
  rationale: ഗ്രീക്കിലെ ബന്ധം ചുരുക്കമുള്ളതും ഒന്നിലധികം വിധത്തിൽ ഘടിപ്പിക്കാവുന്നതുമാണ്. മുഖ്യപാഠം സ്വാഭാവികമായ ലക്ഷ്യാർഥം നൽകുന്നു; മറ്റൊരു ഘടനാപരമായ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘വാഗ്ദത്തങ്ങൾ’ എന്ന പഴയ സഭാഭാഷയ്ക്കു പകരം ‘വാഗ്ദാനങ്ങൾ’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ‘അതേ/ആമേൻ’ സമാന്തരതയും ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ‘അവനിൽ/അവനിലൂടെ’ സമാന്തരതയും നിലനിർത്തി.
