revisions:
- from: ദൈവത്തിന്റെ വാഗ്ദാനങ്ങൾ എത്രതന്നെയായാലും, അവനിൽ അവയ്ക്ക് “അതേ” എന്നാണ്.[a] അതുകൊണ്ട്, നമ്മിലൂടെ ദൈവത്തിനു മഹത്ത്വം ഉണ്ടാകേണ്ടതിന്, “ആമേൻ”[b] എന്നതും അവനിലൂടെയാണ്.[c]
  to: ദൈവത്തിന്റെ വാഗ്ദാനങ്ങൾ എത്രയുണ്ടെങ്കിലും, അവനിൽ അവയ്ക്ക് “അതേ”യാണ്.[a] അതുകൊണ്ടാണ്, ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി, നമ്മിലൂടെ അവനാൽ ദൈവത്തോടു “ആമേൻ”[b] പറയപ്പെടുന്നതും.[c]
  rationale: The revision keeps Paul’s elliptical ‘Yes’ and ‘Amen’ parallel while using the minimal verb ‘പറയപ്പെടുന്നതും’ to make the Malayalam second clause grammatical. It restores the explicit direction of the Amen ‘to God,’ preserves Christ as its mediating basis (‘അവനാൽ’), and expresses the communal δι’ ἡμῶν as ‘നമ്മിലൂടെ.’ The revised notes retain the lexical and syntactic ambiguity without adding a fulfillment claim to the main text or footnote.
