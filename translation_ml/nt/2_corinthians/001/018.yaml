  text: πιστὸς δὲ ὁ θεὸς ὅτι ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς οὐκ ⸀ἔστιν Ναὶ καὶ Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: ml
  text: ദൈവം വിശ്വസ്തനാണെന്നത് ഉറപ്പായതുപോലെ, നിങ്ങളോടുള്ള ഞങ്ങളുടെ സന്ദേശം “അതെയും അല്ലയും” അല്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്നാൽ ദൈവം വിശ്വസ്തനാണ്: നിങ്ങളോടുള്ള ഞങ്ങളുടെ വാക്ക് അതെയും അല്ലയും അല്ല.”'
    reason: lexical_alternative
  - marker: b
    text: “സന്ദേശം” എന്നത് “വാക്ക്” അല്ലെങ്കിൽ “സംസാരം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ദൈവത്തിന്റെ ആശ്രയയോഗ്യതയും വാക്കുമാറാത്ത സ്വഭാവവും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സഭാവിഭാഗനിരപേക്ഷവുമായ പദം.
- source_word: δὲ
  choice: വാക്യഘടനയിൽ പ്രത്യേകം പദമായി പരിഭാഷപ്പെടുത്താതെ ഉറപ്പുനൽകുന്ന പ്രയോഗത്തിൽ ഉൾപ്പെടുത്തി
  rationale: ഇവിടെ δέ വെറും വിരോധസൂചകമായ ‘എന്നാൽ’ എന്നതിലുപരി, πιστὸς ὁ θεός എന്ന സത്യപ്രതിജ്ഞാസദൃശമായ ഉറപ്പിക്കൽ ഘടനയുടെ ഭാഗമാണ്.
- source_word: πιστὸς δὲ ὁ θεὸς ὅτι
  choice: 'ദൈവം വിശ്വസ്തനാണ് എന്നത് എത്ര ഉറപ്പോ, അത്ര ഉറപ്പോടെ പറയാം:'
  rationale: ഗ്രീക്കിലെ സത്യപ്രതിജ്ഞാസദൃശമായ ഉറപ്പിക്കൽ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ὅτι-യുടെ ബന്ധം അതിയായി നിർണ്ണയിക്കാതെ തുടർന്നുള്ള അവകാശവാദത്തെ അവതരിപ്പിക്കുന്നു.
- source_word: ὁ λόγος ἡμῶν
  choice: ഞങ്ങളുടെ സന്ദേശം
  rationale: λόγος ഇവിടെ കൊരിന്ത്യരോടു അറിയിച്ച കാര്യത്തെ സൂചിപ്പിക്കുന്നു; ‘വചനം’ എന്നത് അനാവശ്യമായ സാങ്കേതികമോ മതപരമോ ആയ അർഥം വരുത്താം.
- source_word: ὁ πρὸς ὑμᾶς
  choice: നിങ്ങളോടുള്ള
  rationale: സന്ദേശം ആരെ അഭിമുഖീകരിച്ചതാണെന്ന attributive ബന്ധം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν
  choice: ഉള്ളതല്ല
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല അവകാശവാദം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ναὶ καὶ Οὔ
  choice: “ഉവ്വ് എന്നും ഇല്ല എന്നും”
  rationale: പരസ്പരവിരുദ്ധമായ ഉറപ്പുകളെയോ ചാഞ്ചാട്ടത്തെയോ സൂചിപ്പിക്കുന്ന മൂർച്ചയുള്ള പദജോടി നിലനിർത്തുന്നു; ഉദ്ധരണിച്ചിഹ്നങ്ങൾ പ്രയോഗത്തിന്റെ മുദ്രാവാക്യസദൃശ സ്വഭാവം കാണിക്കുന്നു.
theological_decisions:
- issue: πιστὸς δὲ ὁ θεὸς ὅτι എന്ന ഉറപ്പിക്കൽ ഘടനയുടെ വ്യാഖ്യാനം
  choice: ദൈവത്തിന്റെ വിശ്വസ്തതയെ പൗലോസിന്റെ പ്രസ്താവനയുടെ ഉറപ്പായ അടിസ്ഥാനമായി പ്രകടമാക്കുന്ന സത്യപ്രതിജ്ഞാസദൃശ രൂപം
  alternative: “എന്നാൽ ദൈവം വിശ്വസ്തനാണ്; നിങ്ങളോടുള്ള ഞങ്ങളുടെ വാക്ക്...” എന്ന കൂടുതൽ പദാനുപദ രൂപം
  rationale: സന്ദർഭത്തിൽ പൗലോസ് തന്റെ സന്ദേശത്തിന്റെ സ്ഥിരതയ്ക്ക് ദൈവത്തിന്റെ വിശ്വസ്തതയെ സാക്ഷ്യമായോ അടിസ്ഥാനമായോ ഉന്നയിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ ‘ദൈവം വിശ്വസ്തൻ, എന്ന്...’ എന്ന ഘടന ഒഴിവാക്കുമ്പോഴും ദൈവശാസ്ത്രബന്ധം അമിതമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അതെ’ എന്നതിനെക്കാൾ പ്രസ്താവനയോടുള്ള സമ്മതത്തിന്റെ മുദ്രാവാക്യസദൃശ ഭാവം നൽകാൻ ‘ഉവ്വ്’ ഉപയോഗിച്ചു. പ്രധാനവാചകത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട എല്ലാ അടിക്കുറിപ്പുകളെയും സൂചിപ്പിക്കുന്നു.
