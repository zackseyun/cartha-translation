  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: ml
  text: അവൻ നമ്മിൽ മുദ്ര പതിപ്പിക്കുകയും നമ്മുടെ ഹൃദയങ്ങളിൽ ആത്മാവിനെ മുൻപണമായി നൽകുകയും ചെയ്തു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പദാനുപദമായി: ‘ആത്മാവിന്റെ മുൻപണം.’ ‘മുൻപണം’ എന്നതിന് ‘ആദ്യഗഡു,’ ‘നിക്ഷേപം,’ അല്ലെങ്കിൽ ‘ഉറപ്പ്’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: ἀρραβών എന്ന വാണിജ്യപദത്തിന്റെ രൂപകവും τοῦ πνεύματος എന്ന ജനിറ്റീവ് ഘടനയും സൂചിപ്പിക്കുന്ന പദവികല്പങ്ങൾ.
lexical_decisions:
- source_word: σφραγισάμενος
  choice: തന്റെ മുദ്രകൊണ്ട് അടയാളപ്പെടുത്തുകയും
  rationale: ഉടമസ്ഥത, ആധികാരികത, സുരക്ഷ എന്നിവ സൂചിപ്പിക്കാവുന്ന മുദ്രയുടെ രൂപകം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: δοὺς
  choice: നൽകുകയും ചെയ്തു
  rationale: മുൻപത്തെ പങ്കാളിക്രിയയോടു സമാന്തരമായി ഏകോപിപ്പിച്ച് സ്വാഭാവിക മലയാളവാക്യമാക്കി.
- source_word: ἀρραβῶνα
  choice: മുൻപണമായി
  rationale: ശേഷിക്കുന്ന മുഴുവൻ തുകയും ലഭിക്കുമെന്ന ഉറപ്പായ ആദ്യഗഡു എന്ന വാണിജ്യരൂപകം നിലനിർത്തുന്നു; ‘ഉറപ്പ്’ എന്നു മാത്രം പറഞ്ഞ് രൂപകം നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: τοῦ πνεύματος
  choice: പരിശുദ്ധാത്മാവിനെ
  rationale: ജനിറ്റീവ് ഇവിടെ മുൻപണമായി നൽകപ്പെട്ടത് ആത്മാവുതന്നെയാണെന്ന സ്വാഭാവികമായ ഉള്ളടക്കബന്ധമായി പരിഭാഷപ്പെടുത്തി. മലയാളത്തിൽ ‘ആത്മാവിന്റെ മുൻപണം’ എന്നത് അനാവശ്യമായ അവ്യക്തത സൃഷ്ടിക്കാം.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: നമ്മുടെ ഹൃദയങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥാനസൂചനയും ഉള്ളന്തരമായ വ്യക്തിപരമായ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ καὶ ... καὶ
  choice: അവൻ ... -ുകയും ... -ുകയും ചെയ്തു
  rationale: മുൻവാക്യത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയ പങ്കാളിക്രിയകൾ മലയാളത്തിൽ സ്വാഭാവികമായ തുടർച്ചയുള്ള സ്വതന്ത്രവാക്യമായി നൽകി.
theological_decisions:
- issue: പരിശുദ്ധാത്മാവ് ἀρραβών ആയിരിക്കുന്നതിന്റെ അർഥം
  choice: ‘പരിശുദ്ധാത്മാവിനെ മുൻപണമായി’ എന്ന് വാണിജ്യരൂപകം നിലനിർത്തി.
  alternative: ‘പരിശുദ്ധാത്മാവിനെ ഉറപ്പായി’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിന്റെ നിക്ഷേപം’
  rationale: ἀρραβών ശേഷമുള്ള പൂർണലഭ്യത ഉറപ്പാക്കുന്ന ആദ്യഗഡുവിനെ സൂചിപ്പിക്കുന്നു. ‘മുൻപണം’ ദൃശ്യരൂപകം സംരക്ഷിക്കുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: τοῦ πνεύματος എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: മുൻപണമായി നൽകപ്പെട്ടത് പരിശുദ്ധാത്മാവുതന്നെയാണെന്ന ഉള്ളടക്കജനിറ്റീവ് അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കി.
  alternative: ‘ആത്മാവിന്റെ മുൻപണം’—ആത്മാവ് നൽകുന്ന മുൻപണം എന്നും ആത്മാവുതന്നെ മുൻപണം എന്നും വായിക്കാവുന്ന കൂടുതൽ രൂപപരമായ പരിഭാഷ.
  rationale: സന്ദർഭത്തിൽ ആത്മാവുതന്നെയാണ് ദൈവത്തിന്റെ ഭാവിവാഗ്ദാനങ്ങളുടെ ആദ്യഗഡു എന്ന വായന ശക്തമാണ്; എങ്കിലും അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുപദരൂപം സൂചിപ്പിച്ച് യഥാർത്ഥ ഘടന മറച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘മുദ്രകൊണ്ട് അടയാളപ്പെടുത്തുക’ എന്ന പ്രയോഗം മുദ്രാരൂപകത്തെ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ആത്മാവിനെ ഉദ്ദേശിക്കുന്നതിനാൽ ‘പരിശുദ്ധാത്മാവ്’ ഉപയോഗിച്ചു; മൂലത്തിൽ πνεῦμα എന്നുണ്ടെങ്കിലും പൗലോസിന്റെ സന്ദർഭം ഇതിനെ ദൈവാത്മാവായി വ്യക്തമാക്കുന്നു.
