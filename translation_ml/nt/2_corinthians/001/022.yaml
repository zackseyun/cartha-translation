  to: അവൻ നമ്മിൽ മുദ്ര പതിപ്പിക്കുകയും നമ്മുടെ ഹൃദയങ്ങളിൽ ആത്മാവിനെ മുൻപണമായി നൽകുകയും ചെയ്തു.[a]
