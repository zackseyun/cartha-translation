source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: ml
  text: നിങ്ങളുടെ അടുക്കൽവഴി മക്കെദോന്യയിലേക്കു കടന്നുപോകാനും, പിന്നെ മക്കെദോന്യയിൽനിന്ന് വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരാനും, നിങ്ങളാൽ യെഹൂദ്യയിലേക്കു യാത്രയയക്കപ്പെടാനും ഞാൻ ഉദ്ദേശിച്ചിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യെഹൂദ്യയിലേക്കുള്ള എന്റെ യാത്രയ്ക്കു നിങ്ങൾ സഹായം നൽകാനും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: നിങ്ങളുടെ ഇടയിലൂടെ
  rationale: διά + genitive ഇവിടെ കൊരിന്തിലുള്ളവരുടെ അടുക്കൽവഴി യാത്ര ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിങ്ങളുടെ ഇടയിലൂടെ’ ദിശയും വ്യക്തികളുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: മക്കെദോന്യയിലേക്കു കടന്നുപോകാനും
  rationale: διέρχομαι-യുടെ കടന്നുപോകുക/യാത്രചെയ്യുക എന്ന ചലനാർഥവും εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: പിന്നെ മക്കെദോന്യയിൽനിന്ന് വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരാനും
  rationale: πάλιν എന്ന ആവർത്തനസൂചനയും ἀπό എന്ന പുറപ്പെടൽസ്ഥാനവും πρὸς എന്ന വ്യക്തികളിലേക്കുള്ള ചലനവും വ്യക്തമായി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മടങ്ങി’ എന്ന ആശയം ചേർത്തിട്ടില്ല.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: നിങ്ങളാൽ യാത്രയയക്കപ്പെടാനും
  rationale: ὑπό + genitive സൂചിപ്പിക്കുന്ന കർത്തൃത്വവും προπέμπω-യുടെ യാത്രയ്ക്കാവശ്യമായ സഹായത്തോടെ യാത്രയാക്കുക എന്ന സന്ദർഭാർഥവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: യെഹൂദ്യയിലേക്കുള്ള യാത്രയ്ക്കായി
  rationale: യെഹൂദ്യ ലക്ഷ്യസ്ഥാനമാണെന്ന് വ്യക്തമാക്കുകയും προπεμφθῆναι എന്ന ക്രിയയോടു സ്വാഭാവിക മലയാളത്തിൽ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
