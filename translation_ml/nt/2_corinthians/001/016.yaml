- from: നിങ്ങളുടെ ഇടയിലൂടെ മക്കെദോന്യയിലേക്കു കടന്നുപോകാനും, പിന്നെ മക്കെദോന്യയിൽനിന്ന് വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരാനും, അവിടെനിന്ന് യെഹൂദ്യയിലേക്കുള്ള യാത്രയ്ക്കായി നിങ്ങളാൽ യാത്രയയക്കപ്പെടാനും[a] ഞാൻ ഉദ്ദേശിച്ചിരുന്നു.
  to: നിങ്ങളുടെ അടുക്കൽവഴി മക്കെദോന്യയിലേക്കു കടന്നുപോകാനും, പിന്നെ മക്കെദോന്യയിൽനിന്ന് വീണ്ടും നിങ്ങളുടെ അടുക്കൽ വരാനും, നിങ്ങളാൽ യെഹൂദ്യയിലേക്കു യാത്രയയക്കപ്പെടാനും ഞാൻ ഉദ്ദേശിച്ചിരുന്നു.[a]
  rationale: The revision removes the unsupported «അവിടെനിന്ന്», restores Judea as the direct destination of being sent onward, and uses a more idiomatic route expression for δι’ ὑμῶν. The supplied governing clause «ഞാൻ ഉദ്ദേശിച്ചിരുന്നു» is retained because this verse continues the intention stated in the preceding context; it makes the Malayalam sentence complete without altering the itinerary. The footnote remains anchored to the sending-on expression and preserves the travel-support nuance of προπέμπω.
