translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച ഉദ്ദേശ്യപ്രസ്താവനയുടെ തുടർച്ചയായതിനാൽ വ്യക്തതയ്ക്കായി ‘ഞാൻ ഉദ്ദേശിച്ചിരുന്നു’ ചേർത്തിരിക്കുന്നു. പ്രധാനപാഠത്തിലെ [a] അടിക്കുറിപ്പ് ചിഹ്നം യാത്രയയക്കപ്പെടുക എന്ന പദത്തിനുശേഷം നൽകിയിരിക്കുന്നു.
