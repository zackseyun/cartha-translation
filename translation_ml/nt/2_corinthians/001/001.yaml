id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: ml
  text: 'ദൈവഹിതത്താൽ മശീഹായായ യേശുവിന്റെ[a] അപ്പൊസ്തലനായ പൗലോസും സഹോദരനായ തിമൊഥെയൊസും, കൊരിന്തിലുള്ള ദൈവസഭയ്ക്കും അതോടൊപ്പം അഖായ മുഴുവനിലുമുള്ള എല്ലാ വിശുദ്ധർക്കും എഴുതുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ക്രിസ്തുയേശുവിന്റെ.”
    reason: Χριστός എന്നതിന്റെ പരമ്പരാഗത വിവർത്തനം.
lexical_decisions:
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പൗലോസിന്റെ ദൈവനിയുക്തമായ ശുശ്രൂഷാപദവിയെ കൃത്യമായി സൂചിപ്പിക്കുന്ന, മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതമായ പദം.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹായായ യേശു
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായ ‘മശീഹാ’ എന്ന അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മശീഹായായ യേശു’ എന്നു നൽകി.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവഹിതത്താൽ
  rationale: διά + സമ്ബന്ധികാവിഭക്തി ഇവിടെ പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തിനു പിന്നിലുള്ള ദൈവിക നിർണയത്തെ സൂചിപ്പിക്കുന്നു; ‘ദൈവഹിതത്താൽ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὁ ἀδελφὸς
  choice: നമ്മുടെ സഹോദരൻ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലെങ്കിലും സമൂഹബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘നമ്മുടെ’ ചേർത്തു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἐκκλησίᾳ
  choice: സഭ
  rationale: പൗലോസിന്റെ അഭിവാദനസന്ദർഭത്തിൽ ദൈവജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ἁγίοις
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസികളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്ഥാപിത വിവർത്തനം.
- source_word: σὺν
  choice: അതോടൊപ്പം
  rationale: കൊരിന്തിലെ സഭയോടൊപ്പം അഖായയിലെ മറ്റു വിശുദ്ധരും കത്തിന്റെ അഭിസംബോധിതരാണെന്ന ഉൾക്കൊള്ളുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: അഖായപ്രദേശം മുഴുവനിലും
  rationale: പ്രദേശവ്യാപകമായ പരിധി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പദവിസ്വഭാവം
  choice: മശീഹായായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ അഭിവാദനത്തിൽ Χριστός പദവിയുടെ അർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു മുഖ്യവാചകത്തിൽ നൽകി; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: ὁ ἀδελφός എന്നതിലെ നിർദ്ദേശക ലേഖനവും സമൂഹബന്ധവും
  choice: നമ്മുടെ സഹോദരൻ
  alternative: ആ സഹോദരൻ
  rationale: അക്ഷരാർഥത്തിൽ നിർദ്ദേശക ലേഖനം ഉണ്ടെങ്കിലും മലയാള അഭിവാദനത്തിൽ ‘ആ സഹോദരൻ’ അസ്വാഭാവികമാണ്; ‘നമ്മുടെ’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന സമൂഹബന്ധം വ്യക്തമാക്കുന്നു, എന്നാൽ ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് സുഗമവുമായ മലയാളം. ഗ്രീക്ക് മൂലത്തിലെ കർത്താക്കളും അഭിസംബോധിതരും തമ്മിലുള്ള ദീർഘവാക്യഘടന നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എഴുതുന്നത്’ എന്ന ക്രിയ പൂരിപ്പിച്ചു.
