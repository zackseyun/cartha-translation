  to: 'ദൈവഹിതത്താൽ മശീഹായായ യേശുവിന്റെ[a] അപ്പൊസ്തലനായ പൗലോസും സഹോദരനായ തിമൊഥെയൊസും, കൊരിന്തിലുള്ള ദൈവസഭയ്ക്കും അതോടൊപ്പം അഖായ മുഴുവനിലുമുള്ള എല്ലാ വിശുദ്ധർക്കും എഴുതുന്നു:'
