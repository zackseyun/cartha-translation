  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: ml
  text: 'നിങ്ങൾ ഞങ്ങളെ ഭാഗികമായി മനസ്സിലാക്കിയതുപോലെതന്നെ: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാളിൽ ഞങ്ങൾ നിങ്ങൾക്കു പുകഴ്ചാവിഷയവും[a] നിങ്ങൾ ഞങ്ങൾക്കു പുകഴ്ചാവിഷയവും ആണെന്ന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അഭിമാനവിഷയം” അല്ലെങ്കിൽ “പ്രശംസാകാരണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: മനസ്സിലാക്കി
  rationale: കൊരിന്ത്യർ പൗലോസിനെയും സഹപ്രവർത്തകരെയും കുറിച്ച് യഥാർഥമായ ഒരു തിരിച്ചറിവിൽ എത്തിയെന്ന ആശയം നൽകുന്നു; പൂർണമായി ഗ്രഹിച്ചു എന്ന് അതിശയിപ്പിക്കുന്നില്ല.
- source_word: ἀπὸ μέρους
  choice: ഭാഗികമായെങ്കിലും
  rationale: മനസ്സിലാക്കലിന്റെ അപൂർണത സൂചിപ്പിക്കുകയും അതിന്റെ അളവ് തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: καύχημα
  choice: പ്രശംസാകാരണം
  rationale: വ്യക്തിയെയോ ബന്ധത്തെയോ ആധാരമാക്കിയുള്ള അഭിമാനപൂർവമായ പ്രശംസ എന്ന പൗലോസിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: καθάπερ
  choice: അതുപോലെ
  rationale: പൗലോസും കൊരിന്ത്യരും തമ്മിലുള്ള പരസ്പരബന്ധം വ്യക്തമാക്കുന്ന താരതമ്യം നിലനിർത്തുന്നു.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാളിൽ
  rationale: സ്ഥിരമായ അന്ത്യകാല പ്രയോഗവും ഗ്രീക്കിലെ ബന്ധവാചകവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ സ്ഥാപിതമായ പദം.
theological_decisions:
- issue: പരസ്പരമുള്ള καύχημα ഭാഷ
  choice: ഞങ്ങൾ നിങ്ങൾക്കു പ്രശംസാകാരണമാകുന്നതുപോലെ നിങ്ങളും ഞങ്ങൾക്കു പ്രശംസാകാരണമാണ്
  alternative: ഞങ്ങൾ നിങ്ങളുടെ അഭിമാനവും നിങ്ങൾ ഞങ്ങളുടെ അഭിമാനവുമാണ്
  rationale: സ്വയം മഹത്ത്വപ്പെടുത്തൽ എന്നതിലേക്കു ചുരുക്കാതെ, അന്ത്യനാളിലെ പരസ്പര പ്രശംസയുടെയും സന്തോഷത്തിന്റെയും അർഥവും വാചകത്തിലെ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ പ്രധാനവാക്യത്തിന്റെ ക്രമം ക്രമീകരിച്ചു; ‘ഭാഗികമായെങ്കിലും’ എന്നത് ἀπὸ μέρους എന്നതിന്റെ തുറന്ന അളവ് സംരക്ഷിക്കുന്നു.
