- from: നിങ്ങൾ ഞങ്ങളെ ഭാഗികമായെങ്കിലും മനസ്സിലാക്കിയതുപോലെതന്നെ, നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാളിൽ ഞങ്ങൾ നിങ്ങൾക്കു പ്രശംസാകാരണമാകുന്നതുപോലെ നിങ്ങളും ഞങ്ങൾക്കു പ്രശംസാകാരണമാണെന്ന്[a] മനസ്സിലാക്കും.
  to: 'നിങ്ങൾ ഞങ്ങളെ ഭാഗികമായി മനസ്സിലാക്കിയതുപോലെതന്നെ: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാളിൽ ഞങ്ങൾ നിങ്ങൾക്കു പുകഴ്ചാവിഷയവും[a] നിങ്ങൾ ഞങ്ങൾക്കു പുകഴ്ചാവിഷയവും ആണെന്ന്.'
