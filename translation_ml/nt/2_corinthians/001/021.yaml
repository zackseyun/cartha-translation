id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളോടുകൂടെ ഞങ്ങളെ മശീഹയിൽ[a] ഉറപ്പിക്കുന്നവനും ഞങ്ങളെ അഭിഷേകം ചെയ്തവനും ദൈവമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’ ഗ്രീക്കിലെ പദം ക്രിസ്റ്റോസ് എന്ന സ്ഥാനപ്പേരാണ്; ഇവിടെ അത് ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: ഉറപ്പിക്കുന്നവൻ
  rationale: തുടർച്ചയായി ഉറപ്പുള്ളവരാക്കുക, സ്ഥിരപ്പെടുത്തുക എന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: σὺν ὑμῖν
  choice: നിങ്ങളോടുകൂടെ
  rationale: പൗലോസും കൊരിന്ത്യരും ഒരുമിച്ച് ഈ ദൈവിക പ്രവർത്തനത്തിൽ പങ്കാളികളാണെന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: εἰς Χριστόν
  choice: മശീഹയിൽ
  rationale: εἰς എന്നതിന്റെ അക്ഷരാർഥമായ ‘അകത്തേക്ക്’ എന്നതിലുപരി, ഇവിടെ മശീഹയുമായുള്ള ബന്ധമോ ഐക്യമോ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: χρίσας
  choice: അഭിഷേകം ചെയ്തവൻ
  rationale: χρίω എന്ന ക്രിയയുടെ അഭിഷേകസംബന്ധമായ മൂലാർഥവും മശീഹാ-ഭാഷയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: θεός
  choice: ദൈവമാണ്
  rationale: ഗ്രീക്കിൽ വാക്യാവസാനത്ത് ഊന്നലോടെ വരുന്ന കർത്താവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ വിധേയഘടനയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: εἰς Χριστόν എന്ന പ്രയോഗത്തിന്റെ അർഥബലം
  choice: ബന്ധപരവും ഐക്യസൂചകവുമായ അർഥത്തിൽ ‘മശീഹയിൽ’
  alternative: കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘മശീഹയിലേക്ക്’; പരമ്പരാഗതമായി ‘ക്രിസ്തുവിൽ’
  rationale: ‘മശീഹയിലേക്ക്’ എന്നു പറയുന്നത് ഗ്രീക്ക് മുൻസർഗത്തിന്റെ ദിശാസൂചകത നിലനിർത്തുമെങ്കിലും ഈ പൗലോസീയ സന്ദർഭത്തിൽ അസ്വാഭാവികവും തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതുമാണ്. ‘മശീഹയിൽ’ ബന്ധവും ഉൾച്ചേരലും പ്രകടമാക്കുന്നു; ‘ക്രിസ്തുവിൽ’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ വർത്തമാനകാല ‘ഉറപ്പിക്കുന്നവൻ’ എന്നതും ഭൂതകാല ‘അഭിഷേകം ചെയ്തവൻ’ എന്നതും വേർതിരിച്ചു നിലനിർത്തി. θεός എന്ന പദത്തിന്റെ വാക്യാവസാന ഊന്നലും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
