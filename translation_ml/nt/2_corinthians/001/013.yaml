id: 2CO.1.13
reference: 2 Corinthians 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ വായിക്കുന്നതും മനസ്സിലാക്കുന്നതുമല്ലാതെ മറ്റൊന്നും ഞങ്ങൾ നിങ്ങൾക്ക് എഴുതുന്നില്ല. അവസാനത്തോളം നിങ്ങൾ മനസ്സിലാക്കുമെന്ന് ഞാൻ പ്രത്യാശിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: മറ്റൊന്നും
  rationale: നിഷേധവാക്യത്തിൽ വരുന്ന നപുംസകലിംഗ ബഹുവചനം മലയാളത്തിൽ സ്വാഭാവികമായി ഏകവചനസദൃശമായ ‘മറ്റൊന്നും’ എന്നു നൽകാം; വ്യത്യസ്തമോ മറഞ്ഞതോ ആയ മറ്റൊരു സന്ദേശം എഴുതുന്നില്ലെന്ന ആശയം ഇതു നിലനിർത്തുന്നു.
- source_word: ἀναγινώσκετε
  choice: നിങ്ങൾ വായിക്കുന്നതും
  rationale: വർത്തമാനകാലത്തിന്റെ പൊതുവായ അർഥവും കത്ത് വായിക്കുന്നതെന്ന നേരിട്ടുള്ള ആശയവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπιγινώσκετε
  choice: മനസ്സിലാക്കുന്നതും
  rationale: ഇവിടെ കേവലം വായിക്കുന്നതിൽനിന്ന് അർഥം ഗ്രഹിക്കുന്നതിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നതിനാൽ ‘തിരിച്ചറിയുക’ എന്നതിനെക്കാൾ ‘മനസ്സിലാക്കുക’ സന്ദർഭോചിതമാണ്.
- source_word: ἐπιγνώσεσθε
  choice: നിങ്ങൾ മനസ്സിലാക്കുമെന്ന്
  rationale: മുൻപത്തെ ἐπιγινώσκετε എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുകയും ഭാവികാലത്തെ വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ἕως τέλους
  choice: അവസാനത്തോളം
  rationale: ഗ്രീക്കിലെ കാലപരമോ പരിധിസൂചകമോ ആയ പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് ‘പൂർണമായി’ എന്നു മാത്രം നൽകാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു; പൂർണതയുടെ നിഴലർഥം സന്ദർഭത്തിൽ തുറന്നുതന്നെ നിൽക്കുന്നു.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: കാരണം ... അല്ലാതെ മറ്റൊന്നും ... ഇല്ല
  rationale: ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടനയെ സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἕως τέλους എന്നതിന്റെ അർഥപരിധി
  choice: അവസാനത്തോളം
  alternative: പൂർണമായി
  rationale: ഈ പ്രയോഗം ‘അവസാനംവരെ’ എന്നും ‘പൂർണമായി’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ, മൂലപാഠത്തിന്റെ തുറന്ന അർഥപരിധി ചുരുക്കാതിരിക്കാൻ കൂടുതൽ രൂപസമീപമായ വിവർത്തനം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വായിക്കുന്നതും മനസ്സിലാക്കുന്നതുമല്ലാതെ’ എന്ന സമാന്തരഘടന മൂലത്തിലെ രണ്ടു ക്രിയകളുടെ ബന്ധം നിലനിർത്തുന്നു.
