source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: ml
  text: നിങ്ങളും ഞങ്ങൾക്കുവേണ്ടി പ്രാർഥിച്ചുകൊണ്ട് സഹായിക്കുന്നതിൽ പങ്കുചേരുമ്പോൾ, ഞങ്ങൾക്കു ലഭിച്ച കൃപാദാനത്തെപ്രതി ഞങ്ങൾക്കുവേണ്ടി അനേകരുടെ ഭാഗത്തുനിന്ന് അനേകരിലൂടെ നന്ദി അർപ്പിക്കപ്പെടും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കൃപാദാനം” എന്നത് “അനുഗ്രഹം” അല്ലെങ്കിൽ “ഞങ്ങളോടു കാണിച്ച കൃപ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: “അനേകം മുഖങ്ങളിൽനിന്ന്.” “അനേകരിലൂടെ” എന്ന വാക്യഭാഗത്തിന്റെ ബന്ധം ദുഷ്കരമാണ്. ഇതിനെ, “അനേകരുടെ പ്രാർഥനകളിലൂടെ ഞങ്ങൾക്കു ലഭിച്ച കൃപാദാനത്തെപ്രതി അനേകർ ഞങ്ങൾക്കുവേണ്ടി നന്ദി അർപ്പിക്കും” എന്നും വ്യാഖ്യാനിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων καὶ ὑμῶν
  choice: നിങ്ങളും ... ഞങ്ങളെ സഹായിക്കുന്നതിൽ പങ്കുചേരണം
  rationale: συν- എന്ന ഘടകം സൂചിപ്പിക്കുന്ന കൂട്ടായ സഹായം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ ജനിറ്റീവ് അബ്സല്യൂട്ട് മുൻസന്ദർഭവുമായി ബന്ധപ്പെടുത്തി അഭ്യർഥനാഭാവത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὑπὲρ ἡμῶν τῇ δεήσει
  choice: ഞങ്ങൾക്കുവേണ്ടി പ്രാർഥനയിലൂടെ
  rationale: δέησις പ്രത്യേകമായ അപേക്ഷയോ യാചനയോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, സന്ദർഭത്തിൽ ‘പ്രാർഥന’ വ്യക്തവും സ്വാഭാവികവുമാണ്; ദത്തിവിന്റെ ഉപകരണാർഥം ‘പ്രാർഥനയിലൂടെ’ എന്നതിൽ നിലനിൽക്കുന്നു.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: ഞങ്ങൾക്കു ലഭിച്ച കൃപാദാനം
  rationale: χάρισμα എന്നതിലെ കൃപയുടെയും ദാനത്തിന്റെയും ആശയങ്ങൾ രണ്ടും നിലനിർത്തുന്നു. εἰς ἡμᾶς എന്നത് ഇവിടെ ഞങ്ങളിലേക്കു വന്ന ദാനം എന്ന അർഥത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐκ πολλῶν προσώπων
  choice: അനേകം ആളുകളിൽനിന്ന്
  rationale: πρόσωπον അക്ഷരാർഥത്തിൽ ‘മുഖം’ ആണെങ്കിലും ഇവിടെ ആളുകളെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ πολλῶν
  choice: അനേകരിലൂടെ
  rationale: ദുഷ്കരമായ ഈ പദബന്ധത്തെ ഒഴിവാക്കാതെയും ‘അനേകം’ എന്ന ആവർത്തനം മായ്ച്ചുകളയാതെയും അതിന്റെ ഉപാധി/മാധ്യമാർഥം നിലനിർത്തുന്നു.
- source_word: εὐχαριστηθῇ
  choice: നന്ദി അർപ്പിക്കപ്പെടും
  rationale: ഗ്രീക്കിലെ പാസീവ് രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ദൈവത്തോടുള്ള നന്ദിയർപ്പണത്തിന് യോജിച്ച സ്വാഭാവിക പ്രയോഗം നൽകുന്നു.
theological_decisions:
- issue: χάρισμα ഇവിടെ നിർദിഷ്ടമായി എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: ‘കൃപാദാനം’ എന്ന പൊതുവായ പ്രയോഗം നിലനിർത്തി
  alternative: ‘വിടുതൽ’ അല്ലെങ്കിൽ ‘അനുഗ്രഹം’ എന്നു വ്യക്തമായി നിർവചിക്കുക
  rationale: സന്ദർഭം ദൈവിക വിടുതലിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ പദം അതിനെ നേരിട്ട് നിർവചിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: διὰ πολλῶν എന്നതിന്റെ ബന്ധവും അർഥവും
  choice: ‘അനേകരിലൂടെ’ എന്നു ഔപചാരികമായ അവ്യക്തത നിലനിർത്തി
  alternative: ‘അനേകരുടെ പ്രാർഥനകളിലൂടെ’ എന്നു വിശദീകരിക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടന ദുഷ്കരമാണ്; ‘പ്രാർഥനകൾ’ എന്നു ചേർക്കുന്നത് സാദ്ധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും മൂലത്തിൽ വ്യക്തമായി ഇല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കൃപാദാനം’, ‘നന്ദി അർപ്പിക്കുക’ എന്നീ പദങ്ങൾ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതോടൊപ്പം സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതാണ്. ഗ്രീക്കിലെ ‘അനേകർ’ എന്ന ഇരട്ടപ്രയോഗം അല്പം അസാധാരണമായിരുന്നാലും യഥാർത്ഥ വാക്യത്തിന്റെ ദുഷ്കരതയും സാദ്ധ്യമായ അർഥഭേദവും സംരക്ഷിക്കാൻ മുഖ്യവാചകത്തിൽ നിലനിർത്തി.
