reference: 2 Corinthians 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: ml
  text: എന്നാൽ, ഞങ്ങൾക്കുതന്നെ, ഞങ്ങളുടെ ഉള്ളിൽ മരണവിധി[a] ഉണ്ടായിരുന്നു. ഞങ്ങളിൽത്തന്നെ ആശ്രയം വെക്കാതെ, മരിച്ചവരെ ഉയിർപ്പിക്കുന്ന ദൈവത്തിൽ ആശ്രയം വെക്കേണ്ടതിനായിരുന്നു അത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരണത്തിന്റെ തീർപ്പ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: വാസ്തവത്തിൽ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ ഭേദവും ഇവിടെ വരുന്ന ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: ഞങ്ങളുടെ ഉള്ളിൽത്തന്നെ ഞങ്ങൾക്കുണ്ടായിരുന്നു
  rationale: αὐτοί എന്നതിലെ ഊന്നലും ἐν ἑαυτοῖς എന്നതിലെ ആന്തരികവും വ്യക്തിപരവുമായ അർഥവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: മരണവിധി
  rationale: ഇവിടെ ἀπόκριμα നിർണായകമായ ഒരു വിധിയെയോ തീർപ്പിനെയോ സൂചിപ്പിക്കുന്നു; ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗമാണ് ‘മരണവിധി’.
- source_word: ἐσχήκαμεν
  choice: ഞങ്ങൾക്കുണ്ടായിരുന്നു
  rationale: ക്രിയയിൽ വ്യക്തമല്ലാത്ത ‘ലഭിച്ചു’ എന്ന ആശയം ചേർക്കാതെ, മുൻ അനുഭവത്തിന്റെ ഫലമായി നിലനിന്ന അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: ഞങ്ങളിൽത്തന്നെ ആശ്രയിക്കാതെ
  rationale: ഉദ്ദേശ്യം പ്രകടമാക്കുന്ന ഘടനയും സ്വാശ്രയത്വത്തെ നിഷേധിക്കുന്ന സ്ഥിരമായ ആശ്രയബോധവും സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: ദൈവത്തിൽ ആശ്രയിക്കേണ്ടതിനായിരുന്നു
  rationale: സ്വയം ആശ്രയിക്കുന്നതും ദൈവത്തെ ആശ്രയിക്കുന്നതും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: മരിച്ചവരെ ഉയിർപ്പിക്കുന്ന
  rationale: ദൈവത്തെ ജീവൻ നൽകുന്നവനായി വിശേഷിപ്പിക്കുന്ന വർത്തമാനകർത്തൃരൂപം നേരിട്ടും പരിചിതമായും പകരുന്നു.
theological_decisions:
- issue: τοὺς νεκρούς എന്നതിന്റെ പരിഭാഷ
  choice: മരിച്ചവരെ
  alternative: മൃതരെ
  rationale: ‘മരിച്ചവരെ’ എന്നത് കൃത്യവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്; പുനരുത്ഥാനശക്തിയോടുള്ള സൂചനയെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു.
- issue: മരണവിധി യഥാർഥ നിയമവിധിയാണോ ഉള്ളിലെ ഉറച്ച ബോധ്യമാണോ എന്ന അനിശ്ചിതത്വം
  choice: മരണവിധി ഞങ്ങളുടെ ഉള്ളിൽത്തന്നെ ഞങ്ങൾക്കുണ്ടായിരുന്നു
  alternative: ഞങ്ങൾ മരിക്കുമെന്ന തീർപ്പ് ഞങ്ങളുടെ ഉള്ളിൽത്തന്നെ ഉണ്ടായിരുന്നു
  rationale: മൂലപദത്തിലെ വിധി/തീർപ്പ് എന്ന രൂപകം നിലനിർത്തുകയും അത് വെറും മാനസിക നിഗമനമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഞങ്ങളുടെ ഉള്ളിൽത്തന്നെ ഞങ്ങൾക്കുണ്ടായിരുന്നു’ എന്ന ആവർത്തനസദൃശ ഘടന മൂലത്തിലെ αὐτοί/ἑαυτοῖς ഊന്നൽ സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
