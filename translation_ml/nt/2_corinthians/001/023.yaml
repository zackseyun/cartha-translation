source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ ദൈവത്തെ എന്റെ ജീവനുമേൽ സാക്ഷിയാക്കി വിളിച്ചപേക്ഷിക്കുന്നു[a]: നിങ്ങളെ വെറുതെ വിടാനായിട്ടാണ് ഞാൻ വീണ്ടും കൊരിന്തിലേക്കു വരാതിരുന്നത്[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എനിക്കെതിരായി”; അക്ഷരാർഥത്തിൽ, “എന്റെ പ്രാണനുമേൽ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞാൻ ഇനി കൊരിന്തിലേക്കു വന്നില്ല.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: എന്നാൽ ഞാൻ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും ἐγώ നൽകുന്ന ഒന്നാംപുരുഷ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: ദൈവത്തെ ... സാക്ഷിയായി വിളിക്കുന്നു
  rationale: ദൈവത്തെ തന്റെ വാക്കിന്റെ സത്യത്തിന് സാക്ഷിയാക്കുന്ന ഗൗരവമുള്ള ശപഥസദൃശ പ്രയോഗം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: എന്റെ ജീവനുമേൽ
  rationale: ψυχή ഇവിടെ വ്യക്തിയുടെ ജീവൻ/സ്വയം എന്ന അർഥമുള്ള ശപഥസദൃശ പ്രയോഗത്തിലാണ്; 'ആത്മാവിന്മേൽ' എന്ന അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ പദാനുപദ വിവർത്തനത്തേക്കാൾ 'ജീവനുമേൽ' ആ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: —
  rationale: തുടർന്നുവരുന്നത് സാക്ഷിവിളിയുടെ ഉള്ളടക്കമാണെന്ന് മലയാളത്തിലെ വിരാമചിഹ്നവും വാക്യഘടനയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; നിർബന്ധിതമായ ഒരു ബന്ധപദം ചേർത്തിട്ടില്ല.
- source_word: φειδόμενος ὑμῶν
  choice: നിങ്ങളെ വെറുതെവിടാനാണ്
  rationale: പൗലോസ് വരാതിരുന്നതിന്റെ ഉദ്ദേശ്യം അവർക്കു കഠിനതയോ ശാസനയോ വരുത്താതിരിക്കുക എന്നതാണെന്ന് φείδομαι എന്ന പദത്തിന്റെ 'spare' ഭാവത്തോടെ അറിയിക്കുന്നു.
- source_word: οὐκέτι ἦλθον
  choice: വീണ്ടും ... വരാതിരുന്നത്
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിച്ചിരുന്ന മടക്കസന്ദർശനം നടന്നില്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; οὐκέτιയിലെ 'ഇനി/വീണ്ടും ഇല്ല' എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς Κόρινθον
  choice: കൊരിന്തിലേക്കു
  rationale: ഒരു നഗരത്തിലേക്കുള്ള ചലനം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
theological_decisions:
- issue: ἐπὶ τὴν ἐμὴν ψυχήν എന്ന ശപഥസദൃശ പ്രയോഗത്തിലെ ഉത്തരവാദിത്വഭാവം
  choice: എന്റെ ജീവനുമേൽ
  alternative: എനിക്കെതിരായി / എന്റെ പ്രാണനുമേൽ
  rationale: പൗലോസ് തെറ്റായി പറയുന്നുവെങ്കിൽ വിധി തന്റെമേൽ വരട്ടെ എന്ന ഗൗരവം പ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു; എന്നാൽ വ്യാഖ്യാനത്തെ മുഖ്യവാചകത്തിൽ അതിയായി തുറന്നുപറയാതെ യഥാർഥ അസ്പഷ്ടത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ശപഥസദൃശ ഭാഷയുടെ ഭാരം നിലനിർത്തിക്കൊണ്ട് കൃത്രിമമായ പദാനുപദശൈലി ഒഴിവാക്കി.
