id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: ml
  text: അതുകൊണ്ട്, ഞാൻ ഇത് ഉദ്ദേശിച്ചപ്പോൾ ചാഞ്ചാട്ടത്തോടെ പെരുമാറിയോ?[a] അല്ലെങ്കിൽ, ഞാൻ ആസൂത്രണം ചെയ്യുന്ന കാര്യങ്ങൾ ജഡപ്രകാരം തന്നെയാണോ ആസൂത്രണം ചെയ്യുന്നത്, അങ്ങനെ എന്റെ കാര്യത്തിൽ “അതേ, അതേ” എന്നും “അല്ല, അല്ല” എന്നും ഒരേസമയം ഉണ്ടാകേണ്ടതിന്?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലാഘവത്തോടെയാണോ പെരുമാറിയത്?” ഇവിടെ സ്ഥിരതയില്ലായ്മയോ ചാഞ്ചാട്ടമോ ഉദ്ദേശിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ജഡപ്രകാരം” എന്നത് വെറും മാനുഷികമോ ലോകീയമോ ആയ മാനദണ്ഡങ്ങൾക്കനുസരിച്ച് എന്നു സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, “അതേ” എന്നും “അല്ല” എന്നും ഒരേസമയം നിലനിൽക്കുന്നതുപോലെ സംസാരിക്കുക.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: ഉദ്ദേശിച്ചപ്പോൾ
  rationale: മുമ്പ് പറഞ്ഞ യാത്രാപദ്ധതിയോടു ബന്ധമുള്ള ഉദ്ദേശ്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഔപചാരികമായ തീരുമാനമെന്ന അർഥം അനാവശ്യമായി കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: ചാഞ്ചാട്ടത്തോടെയാണോ പ്രവർത്തിച്ചത്
  rationale: സ്ഥിരതയില്ലാത്തതോ ലാഘവമുള്ളതോ ആയ പെരുമാറ്റത്തെക്കുറിച്ചുള്ള ആരോപണമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്; മലയാളത്തിൽ ചോദ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: ഞാൻ ആസൂത്രണം ചെയ്യുന്നതെല്ലാം ... ആസൂത്രണം ചെയ്യുന്നത്
  rationale: ഗ്രീക്കിലെ ആവർത്തനവും അതിലൂടെ ലഭിക്കുന്ന വാഗ്‌ശക്തിയും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലോസിന്റെ അർഥസമ്പന്നമായ σάρξ എന്ന പദത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭസാധ്യമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρ’ ἐμοὶ
  choice: എന്റെ കാര്യത്തിൽ
  rationale: പൗലോസിന്റെ നിലപാടിലോ പെരുമാറ്റത്തിലോ കാണപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “അതേ, അതേ” എന്നും “അല്ല, അല്ല” എന്നും
  rationale: മൂലത്തിലെ ആവർത്തനം നിലനിർത്തി, പരസ്പരവിരുദ്ധമായ ഉറപ്പുകൾ നൽകുന്നു എന്ന ആരോപണത്തിന്റെ മൂർച്ച സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κατὰ σάρκα എന്ന പൗലോസീയ പ്രയോഗത്തിലെ σάρξ
  choice: ജഡപ്രകാരം
  alternative: വെറും മാനുഷികമോ ലോകീയമോ ആയ മാനദണ്ഡങ്ങൾക്കനുസരിച്ച്
  rationale: ‘ജഡം’ എന്ന പൗലോസീയ പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഇവിടെ സാധ്യമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: “അതേ, അതേ” എന്നും “അല്ല, അല്ല” എന്നും എന്നതിന്റെ ബന്ധം
  choice: ഒരേസമയം പരസ്പരവിരുദ്ധമായ നിലപാടുകൾ കൈക്കൊള്ളുന്നതിനെ സൂചിപ്പിക്കുന്ന രൂപം
  alternative: വെറും ‘അതേയും അല്ലയും’
  rationale: ഗ്രീക്കിലെ ഇരട്ട ആവർത്തനം മായ്ച്ചുകളയാതെ, പൗലോസിനെതിരായ ചാഞ്ചാട്ടത്തിന്റെ ആരോപണം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ രണ്ട് വാഗ്‌ചോദ്യങ്ങളും പ്രധാന ആവർത്തനങ്ങളും സംരക്ഷിച്ചു; ‘ജഡപ്രകാരം’ എന്ന പൗലോസീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അടിക്കുറിപ്പിലൂടെ വിശദീകരിച്ചു.
