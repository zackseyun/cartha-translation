id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: ml
  text: നാം നിങ്ങളോടു സ്വയം ന്യായീകരിക്കുകയാണെന്നാണ് ഇത്രനാളും നിങ്ങൾ കരുതിവന്നതോ? ദൈവസന്നിധിയിൽ, മശീഹായിൽ, ഞങ്ങൾ സംസാരിക്കുന്നു. പ്രിയരേ, എല്ലാം നിങ്ങളെ പടുത്തുയർത്തുന്നതിനുവേണ്ടിയാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: ഇത്രനാളും
  rationale: വായനക്കാർ തുടർന്നുവന്ന ഒരു ധാരണയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; വിദൂരമായ ഭൂതകാലത്തെ അല്ല. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘ഇത്രനാളും’ എന്നു നൽകി.
- source_word: δοκεῖτε
  choice: നിങ്ങൾ കരുതിവന്നതോ?
  rationale: വർത്തമാനകാലത്തിലുള്ള അലങ്കാരപ്രശ്നവും Πάλαι സൂചിപ്പിക്കുന്ന തുടർച്ചയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ὑμῖν ἀπολογούμεθα
  choice: നിങ്ങളോടു സ്വയം ന്യായീകരിക്കുകയാണ്
  rationale: ἀπολογέομαι എന്ന പദത്തിലെ സ്വയം പ്രതിരോധിക്കുന്നതിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിക്കുന്നു.
- source_word: κατέναντι θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള സംസാരവും ഉത്തരവാദിത്വബോധവും സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹായിൽ
  rationale: ἐν എന്ന ബന്ധത്തിന്റെ വിശാലത—ഐക്യം, ബന്ധം, പ്രവർത്തനമണ്ഡലം—വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; Χριστός ഇവിടെ പദവിനാമമായി ‘മശീഹാ’ എന്നു നൽകി.
- source_word: λαλοῦμεν
  choice: ഞങ്ങൾ സംസാരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: τὰ δὲ πάντα
  choice: എല്ലാം
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല; പൗലോസിന്റെ വാക്കുകളും പ്രവർത്തനങ്ങളും മുഴുവനായി അടുത്ത പ്രസ്താവനയിലേക്കു കൊണ്ടുവരുന്നു. മലയാളത്തിൽ വേറൊരു ബന്ധകപദം ആവശ്യമില്ല.
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ സംബോധന ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: നിങ്ങളെ പടുത്തുയർത്തുന്നതിനുവേണ്ടി
  rationale: οἰκοδομήയിലെ കെട്ടിപ്പടുക്കൽ എന്ന രൂപകം നിലനിർത്തുകയും ആത്മിക ശക്തിപ്പെടുത്തൽ എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστῷ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹായിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: ഈ പ്രയോഗത്തിൽ Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹാ എന്ന പദവിയർഥം സജീവമാണ്; അതിനാൽ പേരുപോലെ ലിപ്യന്തരണം ചെയ്യാതെ പദവിനാമം പരിഭാഷപ്പെടുത്തി.
- issue: ἐν Χριστῷ എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: മശീഹായിൽ
  alternative: മശീഹയോടുള്ള ഐക്യത്തിൽ
  rationale: ‘ഐക്യത്തിൽ’ എന്ന വിശദീകരണം സാധ്യതയുള്ള അർഥമാണെങ്കിലും ഗ്രീക്കിലെ ἐν എന്നതിന്റെ ബന്ധപരവും മണ്ഡലപരവുമായ അർഥവ്യാപ്തി ചുരുക്കാതിരിക്കാൻ സംക്ഷിപ്ത രൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആദ്യവാക്യത്തിലെ അലങ്കാരപ്രശ്നത്തിന്റെ മൂർച്ചയും അവസാനത്തെ ‘പടുത്തുയർത്തുക’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
