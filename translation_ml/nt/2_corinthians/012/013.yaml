id: 2CO.12.13
reference: 2 Corinthians 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: ml
  text: കാരണം, മറ്റു സഭകളെ അപേക്ഷിച്ച് ഏതു കാര്യത്തിലാണ് നിങ്ങൾ താഴ്ന്ന നിലയിലാക്കപ്പെട്ടത്[a]? ഞാൻ തന്നേ നിങ്ങൾക്കു ഭാരമായിത്തീർന്നില്ല എന്നതൊഴിച്ചാൽ? എന്റെ ഈ തെറ്റ് ക്ഷമിക്കൂ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘മറ്റു സഭകളെ അപേക്ഷിച്ച് നിങ്ങൾക്കു കുറവ് വരുത്തപ്പെട്ടു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ഒരാളെ പ്രതികൂല നിലയിലാക്കുക, അല്ലെങ്കിൽ താഴ്ന്നവനായി പരിഗണിക്കുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
  - marker: c
    text: 'പൗലൊസ് ഇവിടെ പരിഹാസരൂപേണ സംസാരിക്കുന്നു: അവർക്കു ഭാരമാകാതിരുന്നതാണ് താൻ ചെയ്തുവെന്നു പറയുന്ന ‘തെറ്റ്.’'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: നിങ്ങൾ താഴ്ന്ന നിലയിലാക്കപ്പെട്ടത്
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗവും മറ്റു സഭകളുമായുള്ള താരതമ്യവും നിലനിർത്തുന്നു; കൊരിന്ത്യർ സ്വഭാവത്തിൽ താഴ്ന്നവരാണെന്ന അർഥം വരുത്താതെ, അവർക്കു ലഭിച്ചുവെന്നു കരുതാവുന്ന കുറഞ്ഞ പരിഗണനയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: മറ്റു സഭകളെ അപേക്ഷിച്ച്
  rationale: താരതമ്യസന്ദർഭത്തിലെ ὑπέρ എന്നതിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὐτὸς ἐγώ
  choice: ഞാൻതന്നെ
  rationale: പൗലൊസിന്റെ വ്യക്തിപരമായ ഊന്നൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: നിങ്ങൾക്കു ഭാരമായില്ല
  rationale: സന്ദർഭത്തിൽ സഭയിൽനിന്ന് സാമ്പത്തികമോ ഭൗതികമോ ആയ സഹായം വാങ്ങി അവർക്കു ഭാരമാകാതിരുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: χαρίσασθέ μοι
  choice: എന്നോടു ക്ഷമിക്കൂ
  rationale: പരിഹാസാത്മകമായ ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: τὴν ἀδικίαν ταύτην
  choice: ഈ തെറ്റ്
  rationale: ഇപ്പോൾ പറഞ്ഞതായി കരുതപ്പെടുന്ന കുറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അനീതി’ എന്നതിനെക്കാൾ ഈ പരിഹാസസന്ദർഭത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: τί γάρ ἐστιν ὃ
  choice: കാരണം, ... ഏതു കാര്യത്തിലാണ്
  rationale: γάρ നൽകുന്ന മുൻവാക്യബന്ധവും ചോദ്യം ചോദിക്കുന്ന പ്രത്യേക കാര്യത്തിന്റെ ആശയവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സാമ്പത്തിക സഹായത്തെക്കുറിച്ചുള്ള പൗലൊസിന്റെ പരിഹാസാത്മക സ്വയംപ്രതിരോധം
  choice: ‘ഈ തെറ്റ് എന്നോടു ക്ഷമിക്കൂ’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്ത് പരിഹാസം സന്ദർഭത്തിലൂടെ പ്രകടമാകാൻ അനുവദിച്ചു.
  alternative: ‘ഈ വലിയ തെറ്റ്’ പോലുള്ള വിശദീകരണപരമോ അതിശയോക്തിപരമോ ആയ വാക്കുകൾ മുഖ്യപാഠത്തിൽ ചേർത്ത് പരിഹാസം തുറന്നുപറയുക.
  rationale: മൂലപാഠത്തിലെ പരിഹാസം സന്ദർഭവും അവസാന ആജ്ഞയും ചേർന്നാണ് സൃഷ്ടിക്കുന്നത്; ഇല്ലാത്ത വിശേഷണങ്ങളോ വ്യാഖ്യാനങ്ങളോ ചേർക്കുന്നത് അർഥത്തെ അതിയായി നിർണയിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ചോദ്യത്തിന്റെ വാദാത്മക സ്വഭാവവും പൗലൊസിന്റെ പരിഹാസവും അതിവ്യാഖ്യാനം ചെയ്യാതെ നിലനിർത്തിയിരിക്കുന്നു.
