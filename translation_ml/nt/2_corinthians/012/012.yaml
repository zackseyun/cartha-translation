id: 2CO.12.12
reference: 2 Corinthians 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: ml
  text: ഒരു അപ്പൊസ്തലന്റെ അടയാളങ്ങൾ തീർച്ചയായും[a] നിങ്ങളുടെ ഇടയിൽ സകല സഹനത്തോടും നടപ്പാക്കപ്പെട്ടു—അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും ശക്തിപ്രവൃത്തികളാലും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ അപ്പൊസ്തലന്റെ അടയാളങ്ങൾ തീർച്ചയായും’; പ്രയോഗം അപ്പൊസ്തലന്മാരുടെ പൊതുവായ ലക്ഷണങ്ങളെക്കാൾ പ്രത്യേകമായി പൗലോസിനെ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കിയാൽ.
    reason: alternative_reading
  - marker: b
    text: ‘ശക്തിപ്രവൃത്തികൾ’ എന്നത് ‘അത്ഭുതപ്രവൃത്തികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം ശക്തി പ്രകടമാകുന്ന പ്രവൃത്തികൾക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: അടയാളങ്ങൾ തീർച്ചയായും
  rationale: μέν നൽകുന്ന ഉറപ്പിക്കൽ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ ‘തീർച്ചയായും’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു; σημεῖα എന്നതിന് ‘അടയാളങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: τοῦ ἀποστόλου
  choice: ഒരു അപ്പൊസ്തലന്റെ
  rationale: അപ്പൊസ്തലശുശ്രൂഷയെ സാക്ഷ്യപ്പെടുത്തുന്ന പൊതുവായ ലക്ഷണങ്ങൾ എന്ന ഗുണപരമായ അർഥം മുൻനിർത്തുന്നു; ഗ്രീക്കിലെ നിർദിഷ്ടരൂപം പൗലോസിനെത്തന്നെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κατειργάσθη
  choice: പ്രവർത്തിക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയഭാവവും കാര്യങ്ങൾ നടപ്പാക്കപ്പെട്ടു എന്ന ഫലാർഥവും നിലനിർത്തുന്നു; പ്രവർത്തകനെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: കൊരിന്ത്യസഭാസമൂഹത്തിന്റെ മധ്യത്തിൽ നടന്ന പ്രവർത്തനം എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: പൂർണ സഹിഷ്ണുതയോടെ
  rationale: പ്രയാസങ്ങൾക്കിടയിലെ ഉറച്ചുനിൽപ്പ് സൂചിപ്പിക്കുന്ന ὑπομονήയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും ശക്തിപ്രവൃത്തികളാലും
  rationale: മൂന്നു പദങ്ങളുടെയും വ്യത്യാസം നിലനിർത്തുന്നു. ദത്തിവ് രൂപത്തിന്റെ ഉപകരണാർഥം ‘-ആലും’ വഴി പ്രകടമാക്കുകയും δυνάμεις എന്നതിലെ ശക്തിയുടെ ആശയം ‘ശക്തിപ്രവൃത്തികൾ’ വഴി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഒരു അപ്പൊസ്തലന്റെ അടയാളങ്ങൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: അപ്പൊസ്തലശുശ്രൂഷയെ സാക്ഷ്യപ്പെടുത്തുന്ന ലക്ഷണങ്ങളായി വിവർത്തനം ചെയ്തു; സഹിഷ്ണുതയും അത്ഭുതപ്രവൃത്തികളും ഉൾപ്പെടുന്ന വാക്യഘടന തുറന്നുവെച്ചു.
  alternative: അത്ഭുതങ്ങൾ മാത്രം അപ്പൊസ്തലത്വത്തിന്റെ നിർവചനാത്മക അടയാളങ്ങളാണെന്ന് ചുരുക്കി വായിക്കുക.
  rationale: മുഖ്യപ്രസ്താവനയ്ക്കുശേഷം സഹിഷ്ണുതയും അടയാളങ്ങൾ, അത്ഭുതങ്ങൾ, ശക്തിപ്രവൃത്തികൾ എന്നിവയും വരുന്നു. അതിനാൽ വാക്യം നൽകുന്ന വിശാലത നിലനിർത്തി, സ്ഥിരമായ ഒരു സിദ്ധാന്തപട്ടിക വിവർത്തനത്തിൽ ചുമത്തിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘അപ്പൊസ്തലൻ’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി. ഗ്രീക്കിലെ നിഷ്ക്രിയഭാവവും മൂന്നു അത്ഭുതസംബന്ധ പദങ്ങളുടെയും വേർതിരിവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
