review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the qualitative/generic sense of τοῦ ἀποστόλου, the passive sense of κατειργάσθη, the communal sense of ἐν ὑμῖν, and the threefold sequence of signs, wonders, and powers. However, “പൂർണ സഹിഷ്ണുത” conveys completeness more readily than πάσῃ’s distributive/intensive “all,” and “പ്രവർത്തിക്കപ്പെട്ടു” is an unnatural Malayalam passive for signs being effected.
  naturalness: “നടപ്പാക്കപ്പെട്ടു” is clearer and more idiomatic than “പ്രവർത്തിക്കപ്പെട്ടു” in this context. “സകല സഹനത്തോടും” naturally expresses steadfast endurance under hardship without reducing ὑπομονή to mere patience.
  terminology: “അപ്പൊസ്തലൻ,” “അടയാളങ്ങൾ,” and “അത്ഭുതങ്ങൾ” are appropriate established biblical terms. “ശക്തിപ്രവൃത്തികൾ” suitably preserves the distinct force of δυνάμεις, while the footnote appropriately notes “അത്ഭുതപ്രവൃത്തികൾ” as an alternative.
  issues:
  - severity: medium
    issue: “പൂർണ സഹിഷ്ണുതയോടെ” does not most closely represent ἐν πάσῃ ὑπομονῇ.
    rationale: പൂർണ primarily means “complete,” whereas πάσῃ intensifies the extent of endurance. “സകല സഹനത്തോടും” better retains the Greek sense and stresses endurance rather than simply tolerance.
  - severity: medium
    issue: “പ്രവർത്തിക്കപ്പെട്ടു” is awkward Malayalam for κατειργάσθη.
    rationale: Although it formally reflects a passive, it is not idiomatic for signs or evidences. “നടപ്പാക്കപ്പെട്ടു” preserves the passive without specifying the agent and reads naturally.
  revised_text: ഒരു അപ്പൊസ്തലന്റെ അടയാളങ്ങൾ തീർച്ചയായും[a] നിങ്ങളുടെ ഇടയിൽ സകല സഹനത്തോടും നടപ്പാക്കപ്പെട്ടു—അടയാളങ്ങളാലും അത്ഭുതങ്ങളാലും ശക്തിപ്രവൃത്തികളാലും.[b]
