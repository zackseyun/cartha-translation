id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ml
  text: അതുകൊണ്ട് മശീഹായ്ക്കുവേണ്ടി[a] ബലഹീനതകളിലും അപമാനങ്ങളിലും കഷ്ടതകളിലും പീഡനങ്ങളിലും ഞെരുക്കങ്ങളിലും ഞാൻ സന്തോഷിക്കുന്നു; കാരണം, ഞാൻ ബലഹീനനായിരിക്കുമ്പോൾ അപ്പോഴാണ് ഞാൻ ശക്തനാകുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തുവിനുവേണ്ടി.”'
    reason: Χριστός എന്നതിന്റെ പരമ്പരാഗത പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ വാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εὐδοκῶ
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: വെറും സഹിച്ചുനിൽക്കൽ എന്നതിലുപരി, പൗലോസ് ഈ അനുഭവങ്ങളെ അനുകൂലമായി സ്വീകരിക്കുന്ന വിരോധാഭാസപരമായ മനോഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐν ἀσθενείαις
  choice: ബലഹീനതകളിൽ
  rationale: ശാരീരിക രോഗത്തിൽ മാത്രം ഒതുക്കാതെ പലവിധ ദൗർബല്യങ്ങളെയും ഉൾക്കൊള്ളുന്ന ബഹുവചനരൂപം നിലനിർത്തുന്നു.
- source_word: ἐν ὕβρεσιν
  choice: അപമാനങ്ങളിൽ
  rationale: അധിക്ഷേപവും അപമാനകരമായ പെരുമാറ്റവും ഉൾക്കൊള്ളുന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ἀνάγκαις
  choice: കഷ്ടതകളിൽ
  rationale: സമ്മർദകരമായ നിർബന്ധാവസ്ഥകളും പ്രയാസങ്ങളും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ പ്രയോഗം.
- source_word: ἐν διωγμοῖς
  choice: പീഡനങ്ങളിൽ
  rationale: മശീഹയോടുള്ള വിശ്വസ്തത നിമിത്തം അനുഭവിക്കുന്ന വേട്ടയാടലിനെയും ഉപദ്രവത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: καὶ στενοχωρίαις
  choice: ഞെരുക്കങ്ങളിൽ
  rationale: ഇടുങ്ങിപ്പോകുന്നതുപോലെയുള്ള കടുത്ത സമ്മർദത്തിന്റെ രൂപകാത്മക തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: ὑπὲρ Χριστοῦ
  choice: മശീഹായ്ക്കുവേണ്ടി
  rationale: ὑπέρ സൂചിപ്പിക്കുന്ന ‘നിമിത്തം/വേണ്ടി’ എന്ന ബന്ധവും Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥവും നിലനിർത്തുന്നു.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: കാരണം, ഞാൻ ബലഹീനനായിരിക്കുമ്പോൾ
  rationale: ὅταν സഹിതമുള്ള വർത്തമാനകാല സബ്ജങ്‌ടീവിന്റെ പൊതുവായ കാലാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τότε δυνατός εἰμι
  choice: അപ്പോഴാണ് ശക്തനായിരിക്കുന്നത്
  rationale: ബലഹീനതയും ശക്തിയും തമ്മിലുള്ള പൗലോസിന്റെ വിരോധാഭാസം ഊന്നലോടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നതായി വായിക്കാവുന്നതിനാൽ ‘മശീഹാ’ എന്ന് നൽകി; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ആവർത്തിക്കുന്ന ἐν-പ്രയോഗങ്ങളുടെ പട്ടിക മലയാളത്തിലെ ‘-കളിലും’ ഘടനയിലൂടെ നിലനിർത്തി; അവസാനത്തെ വിരോധാഭാസത്തിന് ‘ആണ്’ എന്ന ഊന്നൽ നൽകി.
