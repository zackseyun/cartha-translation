id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ml
  text: ഞാൻ ഒരു മൂഢനായിത്തീർന്നിരിക്കുന്നു; നിങ്ങളാണ് എന്നെ അതിന് നിർബന്ധിച്ചത്. കാരണം, നിങ്ങൾ എന്നെ ശുപാർശ ചെയ്യേണ്ടിയിരുന്നതായിരുന്നു. കാരണം, ഞാൻ ഒന്നുമല്ലെങ്കിലും, ആ അതിശ്രേഷ്ഠരായ അപ്പൊസ്തലന്മാരെക്കാൾ[a] ഒരു കാര്യത്തിലും ഞാൻ പിന്നിലായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത്യുന്നത അപ്പൊസ്തലന്മാരെക്കാൾ.” ഗ്രീക്ക് പ്രയോഗം അത്യന്തം ഊന്നലുള്ളതാണ്; സന്ദർഭത്തിൽ അത് പരിഹാസമായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: സമ്പൂർണകാലരൂപം മുൻപ് സംഭവിച്ച മാറ്റത്തിന്റെ ഇപ്പോഴത്തെ ഫലം സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം ആ നിലനിൽക്കുന്ന അവസ്ഥ സംരക്ഷിക്കുന്നു.
- source_word: ἄφρων
  choice: ഒരു മൂഢൻ
  rationale: നാമസദൃശമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണം പൗലോസിന്റെ പരിഹാസാത്മകമായ സ്വയംവിശേഷണമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: നിങ്ങളാണ് എന്നെ അതിന് നിർബന്ധിച്ചത്
  rationale: ഊന്നൽ ലഭിച്ച ὑμεῖς എന്ന കർത്താവിനെ ‘നിങ്ങളാണ്’ എന്നു നിലനിർത്തുന്നു; ‘അതിന്’ എന്നത് സമീപസന്ദർഭത്തിലെ മൂഢമായ പ്രശംസാപ്രസംഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: വാസ്തവത്തിൽ, നിങ്ങളാൽ പ്രശംസിക്കപ്പെടേണ്ടിയിരുന്നത് ഞാനായിരുന്നു
  rationale: പ്രതീക്ഷിക്കപ്പെട്ട കടമയും കർമണിപ്രയോഗവും ഏജൻസിയും നിലനിർത്തുന്നു; ἐγώയുടെ ഊന്നൽ ‘ഞാനായിരുന്നു’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: οὐδὲν ... ὑστέρησα
  choice: ഒരു കാര്യത്തിലും ഞാൻ പിന്നിലായിരുന്നില്ല
  rationale: കുറവോ അധമത്വമോ ഇല്ലെന്ന താരതമ്യാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ആ അതിശ്രേഷ്ഠ അപ്പൊസ്തലന്മാരെക്കാൾ
  rationale: ὑπερλίαν എന്ന അതിശക്തമായ വിശേഷണത്തിന്റെ അർഥം നിലനിർത്തുമ്പോഴും പരിഹാസമാണോ യഥാർഥ ബഹുമാനമാണോ എന്ന സന്ദർഭപരമായ അസ്പഷ്ടത പ്രധാനവാക്യത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: ഞാൻ ഒന്നുമല്ലെങ്കിലും
  rationale: വഴങ്ങിക്കൊടുക്കുന്ന concessive ഭാവവും പൗലോസിന്റെ സ്വയംതാഴ്ത്തലും ചുരുക്കവും വ്യക്തവുമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: ‘ആ അതിശ്രേഷ്ഠ അപ്പൊസ്തലന്മാർ’ എന്നു പ്രധാനവാക്യത്തിൽ നൽകി, സാധ്യതയുള്ള പരിഹാസഭാവം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘ആ അത്യുന്നത അപ്പൊസ്തലന്മാർ’ എന്ന പരിഹാസരഹിത വായന; അല്ലെങ്കിൽ ‘ആ സ്വയംപ്രഖ്യാപിത അതിശ്രേഷ്ഠ അപ്പൊസ്തലന്മാർ’ എന്ന് പരിഹാസം തുറന്നുപറയുന്ന വായന.
  rationale: ഗ്രീക്ക് പ്രയോഗം വളരെ ശക്തമാണെങ്കിലും ‘എന്നു വിളിക്കപ്പെടുന്ന’ പോലുള്ള വ്യക്തമായ പരിഹാസചിഹ്നം ഇല്ല. അതിനാൽ പ്രധാനവാക്യം വ്യാഖ്യാനസാധ്യത തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ വാക്ചാതുര്യവും സ്വയംതാഴ്ത്തലും നിലനിർത്തി; സഭാപരമായ പ്രത്യേക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
