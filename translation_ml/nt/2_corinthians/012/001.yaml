id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: ml
  text: പുകഴ്ത്തിപ്പറയുക അനിവാര്യമാണ്; അതു പ്രയോജനകരമല്ലെങ്കിലും,[b] ഇനി ഞാൻ കർത്താവിന്റെ[a] ദർശനങ്ങളിലേക്കും വെളിപ്പാടുകളിലേക്കും വരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിൽനിന്നുള്ള.’ ഗ്രീക്ക് ജനിറ്റീവ് ഉറവിടത്തെ സൂചിപ്പിക്കാം; എന്നാൽ ‘കർത്താവിന്റെ’ എന്നത് ഗ്രീക്കിലെ പദപ്രയോഗവും അതിന്റെ അർഥവ്യാപ്തിയും കൂടുതൽ അടുത്ത് നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: 'വാക്യം ഇങ്ങനെയും ഘടിപ്പിക്കാം: ‘പുകഴ്ത്തിപ്പറയുക അനിവാര്യമാണ്—അതു പ്രയോജനകരമല്ലെന്നതു ശരിതന്നെ—എന്നാൽ ഇനി ഞാൻ … വരും.’'
    reason: alternative_syntax
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: പുകഴ്ത്തിപ്പറയേണ്ടത്
  rationale: വർത്തമാനകാല മധ്യവാചക അനന്തക്രിയയെ നാമവത്കരിച്ച ഭാവത്തിൽ അവതരിപ്പിക്കുന്നു. സന്ദർഭത്തിലെ സ്വയം പുകഴ്ത്തലിന്റെ ആശയം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: δεῖ
  choice: ആവശ്യമാണ്
  rationale: നിർബന്ധമോ അനിവാര്യതയോ സൂചിപ്പിക്കുന്ന δεῖയുടെ ശക്തി നിലനിർത്തുന്നു; ആരാണ് നിർബന്ധിക്കുന്നത് എന്നത് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: οὐ συμφέρον μέν
  choice: അതു പ്രയോജനകരമല്ലെങ്കിലും
  rationale: συμφέρον എന്നതിലെ പ്രയോജനമോ ഗുണമോ എന്ന ആശയം നൽകുന്നു. μέν ആരംഭിക്കുന്ന സമ്മതാത്മക-വിരുദ്ധ ബന്ധം ‘എങ്കിലും’ എന്ന രൂപത്തിലൂടെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐλεύσομαι δὲ
  choice: ഞാൻ … കടക്കാം
  rationale: ഇവിടെ ἔρχομαι ഒരു പുതിയ വിഷയത്തിലേക്കുള്ള നീക്കത്തെ സൂചിപ്പിക്കുന്നു. ‘കടക്കാം’ എന്നത് പ്രസംഗവിഷയത്തിലെ പുരോഗതി സ്വാഭാവികമായി അറിയിക്കുന്നു; μέν–δέ ബന്ധം വാക്യഘടനയിലും വിരാമചിഹ്നത്തിലും പ്രതിഫലിക്കുന്നു.
- source_word: εἰς ὀπτασίας
  choice: ദർശനങ്ങളിലേക്ക്
  rationale: ὀπτασία സൂചിപ്പിക്കുന്ന അതീന്ദ്രിയ ദർശനാനുഭവത്തിന് സ്ഥാപിതവും പൊതുവേ മനസ്സിലാകുന്നതുമായ മലയാളപദമാണ് ‘ദർശനം’.
- source_word: καὶ ἀποκαλύψεις
  choice: വെളിപ്പാടുകളിലേക്കും
  rationale: ἀποκάλυψις എന്നതിലെ മറനീക്കിയറിയിക്കൽ എന്ന ആശയം ‘വെളിപ്പാട്’ കൃത്യമായും സഭാഭേദമില്ലാതെയും നൽകുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ബന്ധം കൂടുതൽ വിശദീകരിക്കാതെ ഗ്രീക്ക് ജനിറ്റീവിന്റെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും പരമാവധി നിലനിർത്തുന്നു; ഇത് ദർശനങ്ങളെയും വെളിപ്പാടുകളെയും ഒരുപോലെ വിശേഷിപ്പിക്കുന്നു.
theological_decisions:
- issue: κυρίου എന്ന ജനിറ്റീവിന് ‘ദർശനങ്ങളും വെളിപ്പാടുകളും’ എന്നതുമായുള്ള ബന്ധം
  choice: കർത്താവിന്റെ
  alternative: കർത്താവിൽനിന്നുള്ള
  rationale: ജനിറ്റീവ് ഉറവിടബന്ധം സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് അതിനെ വ്യക്തമായി തുറന്നുപറയുന്നില്ല. ‘കർത്താവിന്റെ’ എന്നത് ആ ദൈവശാസ്ത്രപരമായ സംയമനവും യഥാർഥ അവ്യക്തതയും നിലനിർത്തുന്നു.
- issue: δεῖ സൂചിപ്പിക്കുന്ന നിർബന്ധത്തിന്റെ വ്യക്തിപരമായ രൂപം
  choice: പുകഴ്ത്തിപ്പറയേണ്ടത് ആവശ്യമാണ്
  alternative: ഞാൻ പുകഴ്ത്തിപ്പറയണം
  rationale: ഗ്രീക്കിൽ അനന്തക്രിയ നാമവത്കൃതമായി വരുന്നതിനാൽ ഒന്നാംപുരുഷ കർത്താവിനെ നേരിട്ട് ചേർക്കാതെ അതിന്റെ പൊതുവായ രൂപവും പൗലോസിന്റെ മടിയോടെയുള്ള സമ്മതവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ‘പുകഴ്ത്തിപ്പറയുക,’ ‘ദർശനം,’ ‘വെളിപ്പാട്,’ ‘കർത്താവ്’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ആശയഭാരം നിലനിർത്തുന്നതുമാണ്. ഗ്രീക്കിലെ μέν–δέ വിരുദ്ധബന്ധം മലയാളത്തിൽ ഭാരമേറിയ അക്ഷരാനുകരണം ഒഴിവാക്കി concessive clause-ഉം വിരാമചിഹ്നവുംകൊണ്ട് അവതരിപ്പിച്ചു.
