- from: പുകഴ്ത്തിപ്പറയേണ്ടത് ആവശ്യമാണ്; അതു പ്രയോജനകരമല്ലെങ്കിലും,[b] ഞാൻ കർത്താവിന്റെ[a] ദർശനങ്ങളിലേക്കും വെളിപ്പാടുകളിലേക്കും കടക്കാം.
  to: പുകഴ്ത്തിപ്പറയുക അനിവാര്യമാണ്; അതു പ്രയോജനകരമല്ലെങ്കിലും,[b] ഇനി ഞാൻ കർത്താവിന്റെ[a] ദർശനങ്ങളിലേക്കും വെളിപ്പാടുകളിലേക്കും വരും.
  rationale: The revision preserves the source’s substantival infinitive plus necessity (Καυχᾶσθαι δεῖ), the concessive force of οὐ συμφέρον μέν, and the topic-transition sense of ἐλεύσομαι δὲ εἰς. It corrects the Malayalam modal force so that the statement remains a future intention rather than a request for permission or a possibility. The footnote anchor and text preserve the ambiguity of κυρίου.
