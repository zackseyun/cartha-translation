id: 2CO.12.6
reference: 2 Corinthians 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ml
  text: സ്വയം പുകഴ്ത്താൻ ഞാൻ ആഗ്രഹിച്ചാൽ, ഞാൻ ഭോഷനായിരിക്കില്ല; കാരണം ഞാൻ സത്യം പറയും. എന്നാൽ, ആരെങ്കിലും എന്നിൽ കാണുന്നതിലും എന്നിൽനിന്ന് കേൾക്കുന്നതിലും[a] അധികമായി എന്നെ കണക്കാക്കാതിരിക്കേണ്ടതിന് ഞാൻ അതിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “എന്നിൽനിന്ന് എന്തെങ്കിലും കേൾക്കുന്നതിലും.”'
    reason: ഗ്രീക്കിൽ ‘എന്തെങ്കിലും’ എന്ന അനിശ്ചിത ഘടകം വ്യക്തമായി ഉണ്ട്; സ്വാഭാവിക മലയാള മുഖ്യപാഠത്തിൽ അത് പരോക്ഷമായി ഉൾക്കൊള്ളുന്നു.
lexical_decisions:
- source_word: θελήσω
  choice: ഞാൻ ആഗ്രഹിച്ചാൽ
  rationale: ἐὰν എന്നതിനോടുകൂടിയ aorist subjunctive ഭാവിയിലെ സാങ്കൽപ്പിക സാധ്യതയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സോപാധിക രൂപം ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καυχήσασθαι
  choice: സ്വയം പുകഴ്ത്താൻ
  rationale: സന്ദർഭത്തിലെ മടിയോടെയുള്ള self-commendation വ്യക്തമാക്കുന്നു. ‘വീമ്പുപറയുക’ എന്നത് അസത്യമോ അതിശയോക്തിയോ മുൻകൂട്ടി സൂചിപ്പിക്കാവുന്നതിനാൽ ഒഴിവാക്കി; ഇവിടെ പൗലോസ് താൻ സത്യം പറയുമെന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἄφρων
  choice: ഭോഷനായിരിക്കില്ല
  rationale: Predicate adjective-ന്റെ ബലം നിലനിർത്തുകയും ഈ അധ്യായത്തിലെ ഭോഷത്വത്തെക്കുറിച്ചുള്ള പരിഹാസാത്മക ഭാഷയുമായി ബന്ധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: ഞാൻ സത്യം പറയും
  rationale: Future verb-ന്റെ അർഥം സോപാധിക വാക്യത്തിനുള്ളിൽ ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: φείδομαι
  choice: ഞാൻ അതിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുന്നു
  rationale: തുടർന്ന് സ്വയം പുകഴ്ത്തുന്നതിൽനിന്നുള്ള മനഃപൂർവമായ നിയന്ത്രണം സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ കർമം വ്യക്തമാക്കാത്തതിനെ സന്ദർഭത്തിൽനിന്ന് കുറഞ്ഞ തോതിൽ മാത്രം പൂരിപ്പിക്കുന്നു.
- source_word: λογίσηται
  choice: കണക്കാക്കാതിരിക്കേണ്ടതിന്
  rationale: വെറും അഭിപ്രായത്തേക്കാൾ ഒരാളെ വിലയിരുത്തി ഒരു നിലയിൽ ഗണിക്കുന്നതെന്ന λογίζομαι-യുടെ evaluative sense നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ὃ
  choice: …തിലും അധികമായി
  rationale: നിരീക്ഷിക്കാവുന്ന കാര്യങ്ങളെ കവിയുന്ന വിലയിരുത്തൽ എന്ന exceeding-standard അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: βλέπει με
  choice: എന്നിൽ കാണുന്നതിലും
  rationale: പൗലോസിൽ നേരിട്ട് കാണാവുന്നതിനെ അടിസ്ഥാനമാക്കിയുള്ള വിലയിരുത്തൽ എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: എന്നിൽനിന്ന് കേൾക്കുന്നതിലും
  rationale: ἐξ ἐμοῦ എന്ന ഉറവിടാർഥം നിലനിർത്തുന്നു. τι എന്ന അനിശ്ചിത ഘടകം മലയാളത്തിലെ ഈ പ്രയോഗത്തിൽ സ്വാഭാവികമായി പരോക്ഷമാണ്; അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സ്വയം പുകഴ്ത്തലും അതിൽനിന്നുള്ള ഒഴിഞ്ഞുനിൽപ്പും
  choice: പൗലോസ് സ്വയം പുകഴ്ത്തിയാൽ സത്യം പറയുന്നതിനാൽ ഭോഷനായിരിക്കില്ലെന്നും, എങ്കിലും മറ്റുള്ളവർ തന്നെ അതിരുകടന്ന് വിലയിരുത്താതിരിക്കാനായി അതിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുന്നു എന്നും വിവർത്തനം ചെയ്യുന്നു.
  alternative: പൗലോസിന്റെ പുകഴ്ത്തൽ പൊതുവേ ന്യായമാണെന്നോ, എല്ലാത്തരം പുകഴ്ത്തലും ഇവിടെ അസത്യവും പാപകരവുമാണെന്നോ വ്യക്തമാക്കുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: ഗ്രീക്ക് പാഠം സത്യമായ പുകഴ്ത്തലിന്റെ സാധ്യതയും അതിൽനിന്നുള്ള മനഃപൂർവമായ നിയന്ത്രണവും ഒരുമിച്ച് നിലനിർത്തുന്നു; അതിനാൽ വിശാലമായ ഉപദേശപരമായ നിഗമനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പഴയ രൂപങ്ങളായ ‘പ്രശംസിപ്പാൻ’, ‘ഭോഷൻ ആകയില്ല’ എന്നിവ ഒഴിവാക്കി. ‘സ്വയം പുകഴ്ത്തുക’ സന്ദർഭത്തിലെ boasting വ്യക്തമാക്കുമ്പോഴും അസത്യത്തിന്റെ അർഥം നിർബന്ധമായി ചേർക്കുന്നില്ല.
