id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ml
  text: മശീഹയിലുള്ള[a] ഒരു മനുഷ്യനെ എനിക്കറിയാം—പതിനാലു വർഷം മുമ്പ്, അവൻ ശരീരത്തിലായിരുന്നോ എന്നു എനിക്കറിയില്ല, ശരീരത്തിനു പുറത്തായിരുന്നോ എന്നും എനിക്കറിയില്ല; ദൈവത്തിനറിയാം—അങ്ങനെയുള്ള ഒരാൾ മൂന്നാം സ്വർഗംവരെ എടുത്തുയർത്തപ്പെട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘മശീഹയിലുള്ള’ എന്നതിന് പരമ്പരാഗതമായി ‘ക്രിസ്തുവിൽ’ എന്നും പറയാറുണ്ട്. ഗ്രീക്ക്: ἐν Χριστῷ.'
    reason: alternative_reading
  - marker: b
    text: ‘മൂന്നാം സ്വർഗം’ പുരാതന യഹൂദ പ്രപഞ്ചധാരണയിലെ ഭാഷയാണ്. ഇവിടെ അതിനെ ‘പരമോന്നത സ്വർഗം’ എന്നോ ‘പറുദീസ’ എന്നോ വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു. ഈ അനുഭവം ശരീരത്തിലായിരുന്നോ ശരീരത്തിനു പുറത്തായിരുന്നോ എന്നു പൗലോസ് തീർപ്പാക്കുന്നില്ല.
    reason: cultural_and_ambiguity_note
lexical_decisions:
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: കൊയ്നേ ഗ്രീക്കിലെ perfect രൂപമായ οἶδα വർത്തമാനാർഥത്തിലാണ്; മലയാളത്തിൽ സ്വാഭാവികമായ തുല്യം ‘എനിക്കറിയാം’.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യനെ
  rationale: നാമം പുല്ലിംഗ ഏകവചനവും ഒരു നിർദിഷ്ട പുരുഷനെ സൂചിപ്പിക്കുന്നതുമാണ്; മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഉറവിടത്തിന്റെ രൂപവും സന്ദർഭത്തിലെ പരോക്ഷ പരാമർശവും നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ ഉള്ള
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നു. ‘മശീഹയിൽ’ എന്ന പൗലോസിന്റെ ഐക്യഭാഷ നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ വാക്യബന്ധം വ്യക്തമാക്കാൻ ‘ഉള്ള’ ചേർത്തു.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: പതിനാലു വർഷം മുമ്പ്
  rationale: πρό + genitive സൂചിപ്പിക്കുന്ന കഴിഞ്ഞകാലപരിധിയുടെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: εἴτε ἐν σώματι
  choice: ശരീരത്തിലായിരുന്നോ
  rationale: ശരീരത്തിനുള്ളിലോ ശരീരാവസ്ഥയിലോ എന്ന ഉറവിടവാചകത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐκτὸς τοῦ σώματος
  choice: ശരീരത്തിനു പുറത്തായിരുന്നോ
  rationale: ἐκτός + genitive-ന്റെ നേരിട്ടുള്ള അർഥം നൽകി, ‘ശരീരത്തിൽ’ എന്നതിനോടുള്ള വിരോധം സംരക്ഷിക്കുന്നു.
- source_word: ὁ θεὸς οἶδεν
  choice: ദൈവത്തിനറിയാം
  rationale: ‘ദൈവം മാത്രം’ എന്ന ഉറവിടത്തിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കാതെ ഉപവാക്യം നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: ἁρπαγέντα
  choice: എടുത്തുകൊണ്ടുപോകപ്പെട്ടു
  rationale: aorist passive participle-ന്റെ ദൈവിക passive ഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; പെട്ടെന്നുള്ള കൊണ്ടുപോകൽ എന്ന ശക്തി സന്ദർഭത്തിൽ പ്രകടമാണ്.
- source_word: τὸν τοιοῦτον
  choice: അങ്ങനെയുള്ള ആ മനുഷ്യൻ
  rationale: മുമ്പ് പറഞ്ഞ വ്യക്തിയിലേക്കു തിരികെ ചൂണ്ടുന്ന പ്രയോഗം; അക്ഷരാർഥത്തോട് അടുത്തതും മലയാളത്തിൽ വായനാസുഖമുള്ളതുമാണ്.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: മൂന്നാം സ്വർഗംവരെ
  rationale: ἕως-ന്റെ പരിധി/ലക്ഷ്യഭാവവും ‘മൂന്നാം സ്വർഗം’ എന്ന പുരാതന പ്രയോഗവും വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστῷ-യുടെ വിവർത്തനം
  choice: മശീഹയിൽ ഉള്ള
  alternative: ക്രിസ്തുവിൽ ഉള്ള
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി സജീവമാണ്; അതിനാൽ പരമ്പരാഗത രൂപം മാത്രം പകർത്താതെ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തു. ‘യിൽ’ പൗലോസിന്റെ ഐക്യഭാഷ സംരക്ഷിക്കുന്നു.
- issue: അനുഭവം ശരീരത്തിലായിരുന്നോ ശരീരത്തിനു പുറത്തായിരുന്നോ
  choice: പൗലോസിന്റെ ഇരട്ട അനിശ്ചിതത്വം അതേപടി നിലനിർത്തി
  alternative: ശാരീരികമായ സ്വർഗാരോഹണം അല്ലെങ്കിൽ ശരീരരഹിത ദർശനം എന്നു നിർണയിക്കൽ
  rationale: ഗ്രീക്ക് വാചകം രണ്ടു സാധ്യതകളെക്കുറിച്ചും ‘എനിക്കറിയില്ല’ എന്നു പറയുന്നു; അറിവ് ദൈവത്തിനാണെന്നു മാത്രം ഉറപ്പിക്കുന്നു. അതിനാൽ അനുഭവത്തിന്റെ രീതി തീർപ്പാക്കുന്നില്ല.
- issue: ‘മൂന്നാം സ്വർഗം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മൂന്നാം സ്വർഗം എന്ന രൂപം പ്രധാനവാചകത്തിൽ നിലനിർത്തി
  alternative: പരമോന്നത സ്വർഗം അല്ലെങ്കിൽ പറുദീസ എന്നു വ്യാഖ്യാനിച്ച് പകരംവയ്ക്കൽ
  rationale: പുരാതന യഹൂദ പ്രപഞ്ചഭാഷയിലെ സാംസ്കാരിക പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കാം; പ്രധാനവാചകത്തിലെ യഥാർഥ പ്രയോഗം മാറ്റുന്നത് അനാവശ്യ വ്യാഖ്യാനമായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് വാക്യങ്ങളാക്കി; ആവർത്തിച്ച ‘എനിക്കറിയില്ല’ എന്ന ഊന്നലും ദൈവത്തിനറിയാം എന്ന ഇടക്കുറിപ്പും സംരക്ഷിച്ചു.
