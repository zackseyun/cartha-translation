revisions:
- from: പതിനാലു വർഷം മുമ്പ് മശീഹയിൽ ഉള്ള ഒരു മനുഷ്യനെ എനിക്കറിയാം. അവൻ ശരീരത്തിലായിരുന്നോ എന്നു എനിക്കറിയില്ല; ശരീരത്തിനു പുറത്തായിരുന്നോ എന്നും എനിക്കറിയില്ല—ദൈവത്തിനറിയാം. അങ്ങനെയുള്ള ആ മനുഷ്യൻ മൂന്നാം സ്വർഗംവരെ എടുത്തുകൊണ്ടുപോകപ്പെട്ടു.[a][b]
  to: മശീഹയിലുള്ള[a] ഒരു മനുഷ്യനെ എനിക്കറിയാം—പതിനാലു വർഷം മുമ്പ്, അവൻ ശരീരത്തിലായിരുന്നോ എന്നു എനിക്കറിയില്ല, ശരീരത്തിനു പുറത്തായിരുന്നോ എന്നും എനിക്കറിയില്ല; ദൈവത്തിനറിയാം—അങ്ങനെയുള്ള ഒരാൾ മൂന്നാം സ്വർഗംവരെ എടുത്തുയർത്തപ്പെട്ടു.[b]
  rationale: പരിഷ്കാരം ഗ്രീക്ക് വാക്യത്തിന്റെ ഏകീകൃത ഘടനയും ഇടയ്ക്കുള്ള അനിശ്ചിതത്വവാക്യങ്ങളും നിലനിർത്തുന്നു. ‘മശീഹയിലുള്ള’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കുകയും τὸν τοιοῦτον-ന്റെ ആവർത്തനഭാരം ഒഴിവാക്കുകയും ἁρπαγέντα-യുടെ മുകളിലേക്കുള്ള എടുക്കൽഭാവം ‘എടുത്തുയർത്തപ്പെട്ടു’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു. അനുഭവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വമോ ‘മൂന്നാം സ്വർഗം’ എന്ന പ്രയോഗമോ വ്യാഖ്യാനിച്ചു തീർപ്പാക്കിയിട്ടില്ല.
