  - marker: a
    text: '‘മശീഹയിലുള്ള’ എന്നതിന് പരമ്പരാഗതമായി ‘ക്രിസ്തുവിൽ’ എന്നും പറയാറുണ്ട്. ഗ്രീക്ക്: ἐν Χριστῷ.'
    reason: alternative_reading
  - marker: b
    text: ‘മൂന്നാം സ്വർഗം’ പുരാതന യഹൂദ പ്രപഞ്ചധാരണയിലെ ഭാഷയാണ്. ഇവിടെ അതിനെ ‘പരമോന്നത സ്വർഗം’ എന്നോ ‘പറുദീസ’ എന്നോ വ്യാഖ്യാനിച്ച് മാറ്റാതെ മൂലപ്രയോഗം നിലനിർത്തിയിരിക്കുന്നു. ഈ അനുഭവം ശരീരത്തിലായിരുന്നോ ശരീരത്തിനു പുറത്തായിരുന്നോ എന്നു പൗലോസ് തീർപ്പാക്കുന്നില്ല.
    reason: cultural_and_ambiguity_note
  revision_rationale: പരിഷ്കാരം ഗ്രീക്ക് വാക്യത്തിന്റെ ഏകീകൃത ഘടനയും ഇടയ്ക്കുള്ള അനിശ്ചിതത്വവാക്യങ്ങളും നിലനിർത്തുന്നു. ‘മശീഹയിലുള്ള’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിക്കുകയും τὸν τοιοῦτον-ന്റെ ആവർത്തനഭാരം ഒഴിവാക്കുകയും ἁρπαγέντα-യുടെ മുകളിലേക്കുള്ള എടുക്കൽഭാവം ‘എടുത്തുയർത്തപ്പെട്ടു’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു. അനുഭവത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വമോ ‘മൂന്നാം സ്വർഗം’ എന്ന പ്രയോഗമോ വ്യാഖ്യാനിച്ചു തീർപ്പാക്കിയിട്ടില്ല.
