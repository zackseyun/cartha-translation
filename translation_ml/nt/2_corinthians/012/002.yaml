  source_fidelity: 'പ്രധാന അർഥം പൊതുവേ കൃത്യമാണ്: ‘മശീഹയിൽ,’ പതിനാലു വർഷം, ശരീരത്തിലുള്ള/ശരീരത്തിനു പുറത്തുള്ള അനിശ്ചിതത്വം, ദൈവത്തിനറിയാം എന്ന ഇടക്കുറിപ്പ്, മൂന്നാം സ്വർഗം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നിരുന്നാലും ആദ്യവാക്യത്തിനു ശേഷം പിരിച്ചിട്ടിരിക്കുന്ന ‘അവൻ’യും പിന്നീട് വരുന്ന ‘അങ്ങനെയുള്ള ആ മനുഷ്യൻ’യും ഗ്രീക്കിലെ ഒരേയൊരു വാക്യഘടനയുടെയും τὸν τοιοῦτον-ന്റെ തിരിച്ചുചൂണ്ടലിന്റെയും ഒഴുക്ക് ദുർബലമാക്കുന്നു. ‘എടുത്തുകൊണ്ടുപോകപ്പെട്ടു’ എന്നത് ἁρπαγέντα-യിലെ മുകളിലേക്കുള്ള പെട്ടെന്നുള്ള എടുക്കൽ കൂടുതൽ വ്യക്തമായി കാണിക്കുന്നില്ല.'
  naturalness: ‘മശീഹയിൽ ഉള്ള’ എന്നതിനു പകരം ‘മശീഹയിലുള്ള’ ആധുനിക നിലവാരമലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്. ‘അങ്ങനെയുള്ള ആ മനുഷ്യൻ’ അനാവശ്യമായി ഭാരമുള്ളതും ‘ആ’യും ‘അങ്ങനെയുള്ള’തും ഒരുമിച്ച് ആവർത്തനഭാവം സൃഷ്ടിക്കുന്നതുമാണ്. ഡാഷുകൾക്കുള്ളിൽ പൗലോസിന്റെ ആവർത്തിച്ച അനിശ്ചിതത്വം നിലനിർത്തി വാക്യം ഒരൊറ്റ ഒഴുക്കിൽ നൽകുന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
  terminology: ‘മശീഹ’ എന്നത് Χριστός-ന്റെ സജീവമായ സ്ഥാനപ്പേര് എന്ന അർഥം സംരക്ഷിക്കുന്ന യോജിച്ച തിരഞ്ഞെടുപ്പാണ്; അടിക്കുറിപ്പിലെ ‘ക്രിസ്തുവിൽ’ എന്ന പരമ്പരാഗത പകരവും സഹായകരമാണ്. ‘മൂന്നാം സ്വർഗം’ വ്യാഖ്യാനിച്ചു പകരംവയ്ക്കാതെ നിലനിർത്തണം. ἁρπαγέντα-യ്ക്കായി ‘എടുത്തുയർത്തപ്പെട്ടു’ എന്നത് ‘എടുത്തുകൊണ്ടുപോകപ്പെട്ടു’ എന്നതിനെക്കാൾ ‘caught up’ എന്ന ദിശാഭാവം നന്നായി പ്രതിഫലിപ്പിക്കുന്നു.
  issues:
  - severity: medium
    issue: വാക്യവിഭജനം മുഖ്യവാക്യത്തിന്റെ ബന്ധം മങ്ങിക്കുന്നു.
    rationale: ‘പതിനാലു വർഷം മുമ്പ്’ എന്ന കാലസൂചനയും ‘മൂന്നാം സ്വർഗംവരെ ...’ എന്ന സംഭവവും ഗ്രീക്കിൽ ‘മശീഹയിലുള്ള ഒരു മനുഷ്യനെ’ എന്ന ഏക പരാമർശത്തോടു ബന്ധിച്ചിരിക്കുന്നു. നിലവിലെ മൂന്ന് വാക്യങ്ങളിലെ ‘അവൻ’/‘അങ്ങനെയുള്ള ആ മനുഷ്യൻ’ പ്രയോഗം ഈ ബന്ധം അനാവശ്യമായി അകലെയാക്കുന്നു.
  - severity: low
    issue: ‘അങ്ങനെയുള്ള ആ മനുഷ്യൻ’ എന്ന പ്രയോഗം ഭാരവും ആവർത്തനവും സൃഷ്ടിക്കുന്നു.
    rationale: τὸν τοιοῦτον-നു ‘അങ്ങനെയുള്ള ഒരാൾ’ മതി; ‘ആ മനുഷ്യൻ’ ചേർക്കുന്നത് മലയാളത്തിൽ അനാവശ്യമായ ദ്വിതീയ ചൂണ്ടിക്കാണിക്കലാകുന്നു.
  - severity: low
    issue: ἁρπαγέντα-യുടെ ഉയർത്തപ്പെടൽഭാവം ദുർബലമാണ്.
    rationale: ‘എടുത്തുകൊണ്ടുപോകപ്പെട്ടു’ പൊതുവായ മാറ്റിക്കൊണ്ടുപോകൽ മാത്രമായി കേൾക്കാം. സ്വർഗീയ ലക്ഷ്യത്തോടു ചേർന്ന ‘എടുത്തുയർത്തപ്പെട്ടു’ പദം മൂലത്തിലെ caught-up ഭാവം കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
  revised_text: മശീഹയിലുള്ള[a] ഒരു മനുഷ്യനെ എനിക്കറിയാം—പതിനാലു വർഷം മുമ്പ്, അവൻ ശരീരത്തിലായിരുന്നോ എന്നു എനിക്കറിയില്ല, ശരീരത്തിനു പുറത്തായിരുന്നോ എന്നും എനിക്കറിയില്ല; ദൈവത്തിനറിയാം—അങ്ങനെയുള്ള ഒരാൾ മൂന്നാം സ്വർഗംവരെ എടുത്തുയർത്തപ്പെട്ടു.[b]
