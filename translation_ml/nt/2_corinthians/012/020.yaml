id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ വരുമ്പോൾ എങ്ങാനും നിങ്ങളെ ഞാൻ ആഗ്രഹിക്കുന്നതുപോലെയല്ലാത്തവരായി കണ്ടെത്തുകയും, നിങ്ങൾ ആഗ്രഹിക്കാത്തവനായി എന്നെ നിങ്ങൾ കണ്ടെത്തുകയും ചെയ്യുമോ എന്നും, എങ്ങാനും കലഹം, അസൂയ, കോപവിസ്ഫോടനങ്ങൾ, സ്വാർഥതാൽപര്യങ്ങൾ, അപവാദങ്ങൾ, കുശുകുശുപ്പുകൾ[a], അഹങ്കാരം, ക്രമക്കേടുകൾ എന്നിവ ഉണ്ടായിരിക്കുമോ എന്നും ഞാൻ ഭയപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുശുകുശുപ്പുകൾ” എന്നതിന് “രഹസ്യമായ പരദൂഷണങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: ഞാൻ ഭയപ്പെടുന്നു
  rationale: വർത്തമാനകാലരൂപം പൗലോസിന്റെ തുടരുന്ന ആശങ്കയെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: μή πως
  choice: ചെയ്യുമോ എന്നും / ഒരുപക്ഷേ … ഉണ്ടായിരിക്കുമോ എന്നും
  rationale: രണ്ടിടത്തും ഭയപ്പെടുന്ന സാധ്യതയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ആശങ്കാപ്രയോഗത്തിലൂടെ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: ἐλθὼν
  choice: ഞാൻ വരുമ്പോൾ
  rationale: സന്ദർഭത്തിൽ കാലസൂചകമായ പങ്കാളിക്രിയയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐχ οἵους θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നതുപോലെയല്ല
  rationale: കൊരിന്ത്യരുടെ അവസ്ഥയെയോ സ്വഭാവത്തെയോ കുറിച്ചുള്ള പൗലോസിന്റെ പ്രതീക്ഷയെ, അതിലധികം വ്യാഖ്യാനിക്കാതെ, പ്രകടമാക്കുന്നു.
- source_word: εὕρω ὑμᾶς
  choice: നിങ്ങളെ … കണ്ടെത്തുകയോ
  rationale: ഭയപ്പെടുന്ന സാധ്യതയിലുള്ള സംഭവത്തെ സൂചിപ്പിക്കുകയും മൂലപാഠത്തിലെ ‘കണ്ടെത്തുക’ എന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν
  choice: എന്നെ നിങ്ങൾ കണ്ടെത്തുകയോ
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ സജീവഘടന ഉപയോഗിച്ചെങ്കിലും മുൻവാക്യാംശത്തോടുള്ള പരസ്പരസമാന്തര്യം സംരക്ഷിക്കുന്നു.
- source_word: οἷον οὐ θέλετε
  choice: നിങ്ങൾ ആഗ്രഹിക്കാത്തവനായി
  rationale: പൗലോസിനെ അവർ എങ്ങനെയുള്ളവനായി കാണുമെന്നത് തുറന്നുവെക്കുന്നു; അപ്പൊസ്തലിക കാഠിന്യം പോലുള്ള സന്ദർഭാനുമാനം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἔρις
  choice: കലഹം
  rationale: സമൂഹത്തിനുള്ളിലെ തർക്കവും ഭിന്നതയും ഉൾക്കൊള്ളുന്ന വിശാലവും സാധാരണവുമായ പദം.
- source_word: ζῆλος
  choice: അസൂയ
  rationale: ദുർഗുണപ്പട്ടികയിലെ സന്ദർഭം അനുകൂലമായ തീക്ഷ്ണതയല്ല, പ്രതികൂലമായ അസൂയയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: θυμοί
  choice: കോപവിസ്ഫോടനങ്ങൾ
  rationale: ബഹുവചനരൂപം ആവർത്തിച്ചുണ്ടാകുന്ന പെട്ടെന്നുള്ള കോപപ്രകടനങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐριθεῖαι
  choice: സ്വാർഥമായ സ്ഥാനമോഹങ്ങൾ
  rationale: സ്വന്തം ഉയർച്ച ലക്ഷ്യമിടുന്ന വിഭാഗീയവും സ്വാർഥവുമായ അഭിലാഷത്തെ വ്യക്തമാക്കുന്നു.
- source_word: καταλαλιαί
  choice: അപവാദങ്ങൾ
  rationale: മറ്റുള്ളവരുടെ പേരിന് ദോഷം വരുത്തുന്ന സംസാരത്തെ ആധുനികവും വ്യക്തവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: ψιθυρισμοί
  choice: കുശുകുശുപ്പുകൾ
  rationale: മറ്റുള്ളവർക്കെതിരെ രഹസ്യമായി നടത്തുന്ന ദുഷ്പ്രസംഗത്തിന്റെ ‘പിറുപിറുക്കൽ/ചെവിയിൽ പറയൽ’ ഭാവം നിലനിർത്തുന്നു; കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: φυσιώσεις
  choice: അഹങ്കാരം
  rationale: ‘ഊതിവീർപ്പിക്കൽ’ എന്ന രൂപകത്തിന്റെ സന്ദർഭാർഥമായ സ്വയംവലുതാക്കൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀκαταστασίαι
  choice: ക്രമക്കേടുകൾ
  rationale: സമൂഹത്തിലെ അവ്യവസ്ഥകളെ സൂചിപ്പിക്കുന്ന ബഹുവചനവും വിശാലതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസ് ഭയപ്പെടുന്ന കൂടിക്കാഴ്ചയുടെ സ്വഭാവം
  choice: പരസ്പരമായ നിരാശയും സമൂഹത്തിലെ ദുർഗുണങ്ങളുടെ സാന്നിധ്യവും മാത്രം വാക്യത്തിൽ വ്യക്തമാക്കുന്നു.
  alternative: പൗലോസ് അപ്പൊസ്തലിക കാഠിന്യം പ്രയോഗിക്കേണ്ടിവരുമെന്നോ വ്യാജോപദേഷ്ടാക്കളുടെ സ്വാധീനം കണ്ടെത്തുമെന്നോ വാക്യത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം പരസ്പരം ആഗ്രഹിക്കാത്ത നിലയിൽ ഒരുവനെ മറ്റൊരുവൻ കണ്ടെത്തുന്നതും സാമൂഹിക ദുർഗുണങ്ങളുടെ പട്ടികയും പറയുന്നു; കാഠിന്യത്തിന്റെയോ വ്യാജോപദേശത്തിന്റെയോ കൂടുതൽ നിർദിഷ്ടമായ വിശദീകരണം സന്ദർഭത്തിൽനിന്നുള്ള അനുമാനമായതിനാൽ പരിഭാഷയിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ദുർഗുണപ്പട്ടികയിലെ ബഹുവചനഭാവം സാധ്യമായിടത്ത് നിലനിർത്തി; മലയാളത്തിലെ ദീർഘമായ വാക്യഘടന വ്യക്തമാക്കാൻ ആവർത്തിച്ച ‘എന്നും’ പ്രയോഗിച്ചു.
