id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: ml
  text: 'അവൻ എന്നോടു പറഞ്ഞിരിക്കുന്നു: “എന്റെ കൃപ നിനക്കു മതി; എന്തെന്നാൽ ശക്തി ബലഹീനതയിൽ പൂർണത പ്രാപിക്കുന്നു.” അതുകൊണ്ട് മശീഹയുടെ ശക്തി എന്റെമേൽ വസിക്കേണ്ടതിന്[a], എന്റെ ബലഹീനതകളിൽ ഞാൻ അതിലും അധികം സന്തോഷത്തോടെ അഭിമാനിക്കും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മശീഹയുടെ ശക്തി എന്റെമേൽ വിശ്രമിക്കേണ്ടതിന്” എന്നും പരിഭാഷപ്പെടുത്താം; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “എന്റെമേൽ കൂടാരമടിക്കേണ്ടതിന്.” ‘മശീഹ’ എന്നതിന് പാരമ്പര്യമായി ‘ക്രിസ്തു’ എന്നും പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: പറഞ്ഞിരിക്കുന്നു
  rationale: പൂർണകാലരൂപം മുൻപ് പറഞ്ഞ വാക്കിന്റെ നിലനിൽക്കുന്ന പ്രസക്തി സൂചിപ്പിക്കുന്നതിനാൽ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: എന്റെ കൃപ നിനക്കു മതി
  rationale: പര്യാപ്തത എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δύναμις
  choice: ശക്തി
  rationale: വാക്യത്തിലെ ആവർത്തനം നിലനിർത്തുകയും ദൈവിക പ്രവർത്തനശേഷിയും മശീഹയുടെ ശക്തിയും തമ്മിലുള്ള ബന്ധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: ബലഹീനത / ബലഹീനതകൾ
  rationale: ഏകവചനത്തിൽ പൊതുതത്ത്വവും ബഹുവചനത്തിൽ പൗലോസിന്റെ വ്യക്തമായ അനുഭവങ്ങളും പ്രകടമാകുന്ന മാറ്റം നിലനിർത്തുന്നു.
- source_word: τελεῖται
  choice: പൂർണത പ്രാപിക്കുന്നു
  rationale: ശക്തി അതിന്റെ ലക്ഷ്യത്തിലും പൂർണപ്രകടനത്തിലും എത്തുന്നു എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ദൈവശക്തിക്ക് മുമ്പ് കുറവുണ്ടായിരുന്നു എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἥδιστα ... μᾶλλον
  choice: അത്യന്തം സന്തോഷത്തോടെ ഇനിയും അധികം
  rationale: രണ്ട് തീവ്രതാസൂചകങ്ങളെയും വേർതിരിച്ചറിയാവുന്ന വിധത്തിൽ നിലനിർത്തുന്നു, എങ്കിലും മലയാളവാക്യത്തിൽ സ്വാഭാവികമായ ക്രമത്തിലാണ്.
- source_word: καυχήσομαι ἐν ταῖς ἀσθενείαις μου
  choice: എന്റെ ബലഹീനതകളെക്കുറിച്ച് ഞാൻ ... പ്രശംസിക്കും
  rationale: പൗലോസിന്റെ വിരോധാഭാസപരമായ പ്രശംസാഭാവം നിലനിർത്തുന്നു; മലയാളത്തിൽ വിഷയത്തെക്കുറിച്ചുള്ള പ്രശംസ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: എന്റെമേൽ വസിക്കേണ്ടതിന്
  rationale: കൂടാരമടിച്ച് മേൽ വസിക്കുക എന്ന മൂലദൃശ്യത്തിന്റെ വാസവും മേൽനില്പും വായനാസൗകര്യത്തോടെ സൂചിപ്പിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായ രാജാവിന്റെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകി.
theological_decisions:
- issue: δύναμις എന്ന പദത്തിനു മുമ്പിലുള്ള ഉടമസ്ഥസർവനാമം
  choice: എന്റെ ശക്തി
  alternative: ശക്തി
  rationale: SBLGNT പ്രദർശനത്തിൽ apparatus ചിഹ്നങ്ങൾ ഉണ്ടായിരുന്നാലും നൽകിയ ഇംഗ്ലീഷ് പാഠവും ഏറ്റവും സാദ്ധ്യമായ വായനയും ‘എന്റെ’ എന്ന ഉടമസ്ഥതയെ പിന്തുണയ്ക്കുന്നു; പ്രസ്താവകന്റെ കൃപയും ശക്തിയും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- issue: τελεῖται എന്നതിന്റെ വിവർത്തനം
  choice: പൂർണത പ്രാപിക്കുന്നു
  alternative: പൂർണമാക്കപ്പെടുന്നു
  rationale: ദൈവിക ശക്തി ബലഹീനതയിൽ പൂർണമായി പ്രകടമാകുന്നു എന്ന ആശയം കാത്തുസൂക്ഷിക്കുമ്പോൾ, ശക്തിയിൽ ഒരു നൈതിക അപൂർണത ഉണ്ടായിരുന്നുവെന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- issue: Χριστοῦ എന്നതിന്റെ വിവർത്തനം
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ സ്ഥാനപ്പേരായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നതിനായി ‘മശീഹ’ സ്വീകരിച്ചു; സഭാപാരമ്പര്യത്തിലെ പരിചിതരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: ἐπισκηνώσῃ എന്ന രൂപകം
  choice: എന്റെമേൽ വസിക്കേണ്ടതിന്
  alternative: എന്റെമേൽ വിശ്രമിക്കേണ്ടതിന്; എന്റെമേൽ കൂടാരമടിക്കേണ്ടതിന്
  rationale: കൂടാരവാസത്തിന്റെ രൂപകത്തെ പൂർണമായി ഇല്ലാതാക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കൃപ’, ‘ശക്തി’, ‘ബലഹീനത’, ‘മശീഹ’ തുടങ്ങിയ പ്രധാന ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
