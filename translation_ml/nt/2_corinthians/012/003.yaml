  terminology: ‘മനുഷ്യൻ,’ ‘ശരീരം,’ and ‘ദൈവം’ are appropriate. ‘എനിക്കറിയാം / എനിക്കറിയില്ല / ദൈവത്തിനറിയാം’ effectively preserves the Greek repetition and contrast.
