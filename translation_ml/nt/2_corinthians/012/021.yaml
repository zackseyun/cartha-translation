id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: ml
  text: ഞാൻ വീണ്ടും വരുമ്പോൾ[a] എന്റെ ദൈവം നിങ്ങളുടെ മുമ്പിൽ[b] എന്നെ താഴ്ത്തുകയും, മുമ്പ് പാപം ചെയ്തിട്ടും തങ്ങൾ ചെയ്ത അശുദ്ധി, ലൈംഗിക അധാർമികത, ലജ്ജയില്ലാത്ത ദുർന്നടപ്പ്[c] എന്നിവയെക്കുറിച്ച് മാനസാന്തരപ്പെടാത്ത പലരെ ഓർത്ത് ഞാൻ വിലപിക്കേണ്ടിവരുകയും ചെയ്യുമോ എന്ന് ഞാൻ ഭയപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാൻ മടങ്ങിവരുമ്പോൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങളുടെ ഇടയിൽ എന്നെ താഴ്ന്ന നിലയിലാക്കുക.’
    reason: lexical_alternative
  - marker: c
    text: ‘ലജ്ജയില്ലാത്ത ദുർന്നടപ്പ്’ എന്നതിന് ‘അഴിഞ്ഞാട്ടം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: ഞാൻ വീണ്ടും വരുമ്പോൾ
  rationale: മുൻവാക്യത്തിൽ നിന്നു തുടരുന്ന ഭയാശങ്കയുടെ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ കാലവാക്യമായി നൽകുന്നു; πάλιν എന്നതിന്റെ ‘വീണ്ടും’ എന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: എന്റെ ദൈവം നിങ്ങളുടെ മുമ്പിൽ എന്നെ താഴ്ത്തുമോ
  rationale: ταπεινόω എന്നതിന് ‘താഴ്ത്തുക/എളിമപ്പെടുത്തുക/അപമാനിക്കുക’ എന്ന അർഥപരിധിയുണ്ട്. സന്ദർഭത്തിലെ വേദനാജനകമായ താഴ്ത്തൽ സൂചിപ്പിക്കുമ്പോഴും ‘അപമാനിക്കുക’ എന്ന് അതിരുകടന്ന് നിർണ്ണയിക്കാതിരിക്കാൻ ‘താഴ്ത്തുക’ തെരഞ്ഞെടുത്തു. πρὸς ὑμᾶς അവരുടെ സാന്നിധ്യത്തിൽ എന്ന ആശയം നൽകുന്നു.
- source_word: πενθήσω
  choice: ഞാൻ വിലപിക്കേണ്ടിവരുമോ
  rationale: πενθέω ദുഃഖിക്കുകയും വിലപിക്കുകയും ചെയ്യുന്നതിന്റെ ശക്തമായ ഭാവം നൽകുന്നു. μή മുഖേന തുടരുന്ന ഭയത്തിന്റെ രണ്ടാമത്തെ ഘടകമായി മലയാളത്തിൽ ചോദ്യംസദൃശ ആശങ്കാഘടന ഉപയോഗിച്ചു.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: മുമ്പ് പാപം ചെയ്തിട്ടും ... പലരെയും
  rationale: προημαρτηκότων മുൻകാല പാപവും ഇപ്പോഴും പ്രസക്തമായ അവസ്ഥയും സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള മാനസാന്തരമില്ലായ്മയുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ചെയ്തിട്ടും’ ഉപയോഗിച്ചു.
- source_word: μὴ μετανοησάντων
  choice: മാനസാന്തരപ്പെടാത്ത
  rationale: അവർ ഇതുവരെ പശ്ചാത്തപിച്ച് തിരിഞ്ഞിട്ടില്ലെന്ന നിലനിൽക്കുന്ന അവസ്ഥ വ്യക്തമാക്കുന്നു.
- source_word: ἀκαθαρσίᾳ
  choice: അശുദ്ധി
  rationale: ധാർമിക അശുദ്ധിയുടെ വിശാലത നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും ഇപ്പോഴും ഗ്രാഹ്യവുമായ പദം.
- source_word: πορνείᾳ
  choice: ലൈംഗിക അധാർമികത
  rationale: πορνείαയെ ഒരു പ്രത്യേക ലൈംഗിക പാപത്തിലേക്ക് ചുരുക്കാതെ അതിന്റെ വിശാലമായ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀσελγείᾳ
  choice: ലജ്ജയില്ലാത്ത ദുർനടപ്പ്
  rationale: ἀσέλγεια സൂചിപ്പിക്കുന്ന നിയന്ത്രണമില്ലാത്തതും ധാർഷ്ട്യപൂർവവും ലജ്ജയറ്റതുമായ പെരുമാറ്റം ‘കാമാസക്തി’യിലേക്ക് മാത്രം ചുരുക്കാതെ നൽകുന്നു.
- source_word: ᾗ ἔπραξαν
  choice: തങ്ങൾ ചെയ്ത
  rationale: ബന്ധസർവനാമം മുമ്പുള്ള മൂന്ന് ദോഷങ്ങളെയും കൂട്ടമായി പരാമർശിക്കുന്നു. πράσσωയുടെ പ്രവൃത്തിപരമായ ഭാവം ലളിതമായി നൽകുന്നു.
theological_decisions:
- issue: മുൻവാക്യത്തിലെ ഭയപ്രസ്താവനയോട് μή മുഖേന ഈ വാക്യം ബന്ധപ്പെടുന്ന വിധം
  choice: രണ്ടു ആശങ്കകളും ‘എന്നും ... എന്നും ഞാൻ ഭയപ്പെടുന്നു’ എന്ന ഒറ്റ ഘടനയിൽ വ്യക്തമാക്കി
  alternative: ‘ഞാൻ വീണ്ടും വരുമ്പോൾ എന്റെ ദൈവം എന്നെ താഴ്ത്താതിരിക്കട്ടെ; ഞാൻ വിലപിക്കാതിരിക്കട്ടെ’ എന്ന ആശംസാസദൃശ രൂപം
  rationale: ഗ്രീക്കിൽ സ്വതന്ത്രമായ ആശംസയല്ല, 12:20-ലെ φοβοῦμαι എന്ന ക്രിയയിൽ ആശ്രയിക്കുന്ന ഭയാശങ്കയാണ്. മലയാളത്തിൽ അത് വെളിപ്പെടുത്തുന്നത് അർഥം വ്യക്തമാക്കുന്നു.
- issue: മൂന്നു ധാർമികദോഷങ്ങളുടെ വ്യത്യാസം
  choice: ‘അശുദ്ധി, ലൈംഗിക അധാർമികത, ലജ്ജയില്ലാത്ത ദുർനടപ്പ്’ എന്ന് വേർതിരിച്ചു
  alternative: മൂന്നിനെയും പൊതുവായി ‘ലൈംഗിക പാപങ്ങൾ’ എന്ന് ചുരുക്കുക
  rationale: ഗ്രീക്ക് മൂന്നു ഭാഗികമായി മടങ്ങിച്ചേരുന്നെങ്കിലും വ്യത്യസ്ത പദങ്ങൾ നിരത്തുന്നു. അവയെ ഒന്നാക്കി ചുരുക്കുന്നത് മൂലപാഠത്തിന്റെ ഊന്നൽ നഷ്ടപ്പെടുത്തും.
- issue: ταπεινόωയുടെ തീവ്രത
  choice: ‘താഴ്ത്തുക’
  alternative: ‘അപമാനിക്കുക’
  rationale: ദൈവം പൗലോസിനെ കൊരിന്ത്യരുടെ സാന്നിധ്യത്തിൽ താഴ്ന്ന അവസ്ഥയിലാക്കുമെന്ന ആശയം നിലനിർത്തി; പരസ്യ അപമാനം തന്നെയാണെന്ന് നിർബന്ധമായി തീരുമാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ഏകത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഭയത്തിന്റെ രണ്ടു ഘടകങ്ങളും വ്യക്തമായി ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
