id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: ml
  text: വെളിപ്പാടുകളുടെ അസാധാരണമായ മഹത്ത്വം നിമിത്തം—ഞാൻ എന്നെത്തന്നെ ഉയർത്താതിരിക്കേണ്ടതിന്—എനിക്ക് ജഡത്തിൽ ഒരു മുള്ള് നൽകപ്പെട്ടു[a], സാത്താന്റെ ഒരു ദൂതൻ[b], എന്നെ പ്രഹരിച്ചുകൊണ്ടിരിക്കേണ്ടതിന്, ഞാൻ എന്നെത്തന്നെ ഉയർത്താതിരിക്കേണ്ടതിന്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജഡത്തിൽ ഒരു കൂർത്ത കുറ്റി’ എന്നും വിവർത്തനം ചെയ്യാം. σκόλοψ എന്ന ഗ്രീക്ക് പദത്തിന് കൂർത്ത കുറ്റി, ചീള്, മുള്ള് എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ ഉദ്ദേശിക്കുന്ന കൃത്യമായ ചിത്രം അനിശ്ചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സാത്താന്റെ ഒരു ദൈവദൂതൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ἄγγελος എന്ന ഗ്രീക്ക് പദത്തിന് ‘ദൂതൻ’ എന്നും ‘ദൈവദൂതൻ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: c
    text: ‘ഞാൻ എന്നെത്തന്നെ ഉയർത്താതിരിക്കേണ്ടതിന്’ എന്ന പ്രയോഗം ഗ്രീക്ക് പാഠത്തിൽ രണ്ടുതവണ വരുന്നതിനാൽ ഇവിടെ രണ്ടുതവണയും നിലനിർത്തിയിരിക്കുന്നു.
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: വെളിപ്പാടുകളുടെ അത്യധികമായ മഹത്ത്വം നിമിത്തം
  rationale: വെളിപ്പാടുകളുടെ അസാധാരണമായ അളവിനെയോ മഹത്ത്വത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; തുടർന്നുള്ള വാക്യവുമായി കാരണബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: ὑπεραίρωμαι
  choice: ഞാൻ എന്നെത്തന്നെ ഉയർത്താതിരിക്കേണ്ടതിന്
  rationale: സ്വയം ഉന്നതനാക്കുക, അഹങ്കരിക്കുക എന്നീ അർഥസാധ്യതകൾ ഉള്ള ക്രിയയുടെ രൂപകാത്മകതയും പ്രത്യാവർത്തക ഭാവവും കാത്തുസൂക്ഷിക്കുന്നു. ഗ്രീക്കിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തിയിരിക്കുന്നു.
- source_word: ἐδόθη μοι
  choice: എനിക്കു നൽകപ്പെട്ടു
  rationale: കർത്താവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്ക് കർമണിപ്രയോഗം അതേപടി നിലനിർത്തി, നൽകിയത് ആരെന്ന് വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- source_word: σκόλοψ τῇ σαρκί
  choice: ജഡത്തിൽ ഒരു മുള്ള്
  rationale: σκόλοψ സൂചിപ്പിക്കുന്ന കൂർത്ത വസ്തുവിന്റെ കൃത്യരൂപം അനിശ്ചിതമാണ്; പരിചിതമായ ‘മുള്ള്’ രൂപകം നിലനിർത്തുന്നു. σάρξ ഇവിടെ ശരീരബന്ധിതമായ അസ്തിത്വത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ജഡം’ ഉപയോഗിച്ചു.
- source_word: ἄγγελος Σατανᾶ
  choice: സാത്താന്റെ ഒരു ദൂതൻ
  rationale: ἄγγελος എന്നത് ദൂതനെയോ ദൈവദൂതസ്വഭാവമുള്ള ആത്മജീവിയെയോ സൂചിപ്പിക്കാം. ‘ദൂതൻ’ ഈ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
- source_word: κολαφίζῃ
  choice: എന്നെ പ്രഹരിച്ചുകൊണ്ടിരിക്കേണ്ടതിന്
  rationale: മുഷ്ടികൊണ്ടോ ആവർത്തിച്ചോ അടിക്കുക എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; വർത്തമാനകാല ക്രിയയുടെ തുടർച്ചാഭാവം ‘കൊണ്ടിരിക്കുക’ വഴി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘ജഡത്തിലെ മുള്ള്’ എന്താണെന്ന തിരിച്ചറിയൽ
  choice: രൂപകം വിശദീകരിക്കാതെ നിലനിർത്തി
  alternative: ശാരീരിക രോഗം, പീഡനം, എതിരാളികൾ, അല്ലെങ്കിൽ പൈശാചിക ഉപദ്രവം എന്നു വ്യക്തമാക്കുക
  rationale: മൂലപാഠം കഷ്ടതയുടെ കൃത്യസ്വഭാവം വെളിപ്പെടുത്തുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: മുള്ള് നൽകിയത് ആരാണ്
  choice: ‘എനിക്കു നൽകപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തി
  alternative: ‘ദൈവം എനിക്കു നൽകി’ അല്ലെങ്കിൽ ‘അനുവദിക്കപ്പെട്ടു’
  rationale: ദൈവിക അനുമതി സൂചിപ്പിക്കപ്പെടാമെങ്കിലും കർത്താവ് പാഠത്തിൽ വ്യക്തമല്ല; ദൈവിക പരമാധികാരവും സാത്താനിക ഉപകരണത്വവും തമ്മിലുള്ള പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: ἄγγελος Σατανᾶയുടെ സ്വഭാവം
  choice: ‘സാത്താന്റെ ഒരു ദൂതൻ’
  alternative: ‘സാത്താന്റെ ഒരു ദൈവദൂതൻ’ അല്ലെങ്കിൽ ‘സാത്താന്റെ ഒരു മനുഷ്യദൂതൻ’
  rationale: അത് ആത്മജീവിയാണോ മനുഷ്യപ്രതിനിധിയാണോ എന്നു പാഠം തീർച്ചപ്പെടുത്തുന്നില്ല.
- issue: ἵνα μὴ ὑπεραίρωμαι എന്ന പ്രയോഗത്തിന്റെ ആവർത്തനം
  choice: രണ്ടുതവണയും നിലനിർത്തി
  alternative: മലയാളത്തിലെ ആവർത്തനം ഒഴിവാക്കി ഒരിക്കൽ മാത്രം പറയുക
  rationale: ഗ്രീക്ക് പാഠത്തിലെ യഥാർഥ ആവർത്തനം പൗലോസിന്റെ ഉദ്ദേശ്യഊന്നൽ പ്രകടമാക്കുന്നു; അവസാനത്തെ പ്രയോഗം സ്വാഭാവിക മലയാളവാക്യമായി വേർതിരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡം’, ‘വെളിപ്പാട്’, ‘സാത്താൻ’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. ഗ്രീക്കിലെ ആദ്യ ഉദ്ദേശ്യവാക്യം ഡാഷുകൾക്കിടയിൽ കൊടുത്തും അവസാന ആവർത്തനം വേറൊരു വാക്യമാക്കിയും സങ്കീർണമായ ഘടന വായനാസൗകര്യത്തോടെ അവതരിപ്പിച്ചു.
