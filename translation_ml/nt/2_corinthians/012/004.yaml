id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: ml
  text: അവൻ പറുദീസയിലേക്ക് എടുക്കപ്പെട്ടു; മനുഷ്യന് പറയാൻ അനുവാദമില്ലാത്ത, പറഞ്ഞറിയിക്കാനാവാത്ത വാക്കുകൾ അവൻ കേട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: എടുക്കപ്പെട്ടു
  rationale: ബലമായോ പെട്ടെന്നോ എടുത്തുകൊണ്ടുപോകപ്പെടുക എന്ന നിഷ്ക്രിയാർഥം സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παράδεισον
  choice: പറുദീസ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പതിവായ ബൈബിൾസംബന്ധിയായ മലയാളരൂപം നിലനിർത്തുന്നു.
- source_word: ἄρρητα ῥήματα
  choice: വാക്കുകളിൽ പ്രകടിപ്പിക്കാനാവാത്ത കാര്യങ്ങൾ
  rationale: ἄρρητα എന്നതിലെ ‘പറയാനാവാത്ത/വിവരിക്കാനാവാത്ത’ അർഥവും ῥήματα എന്നതിലെ ഉച്ചരിക്കപ്പെട്ട കാര്യങ്ങൾ എന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ലാലῆσαιയുമായി അനാവശ്യ പദാവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: οὐκ ἐξὸν
  choice: അനുവാദമില്ലാത്ത
  rationale: കഴിവില്ലായ്മയല്ല, അനുവദനീയമല്ലാത്തത് എന്ന നിയമാനുമതിയുടെ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ἀνθρώπῳ
  choice: മനുഷ്യന്
  rationale: ഇവിടെ പൊതുവായ മനുഷ്യനെ സൂചിപ്പിക്കുന്ന ഏകവചന ദാതൃരൂപം; ലിംഗവിശേഷം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: λαλῆσαι
  choice: ഉച്ചരിക്കാൻ
  rationale: വായാൽ പറയുക/സംസാരിക്കുക എന്ന അർഥം നൽകുകയും ‘പ്രകടിപ്പിക്കാനാവാത്ത’ എന്ന മുൻപ്രയോഗത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἄρρητα എന്നത് സ്വഭാവതാൽ പ്രകടിപ്പിക്കാനാവാത്തതോ പറയാൻ വിലക്കപ്പെട്ടതോ
  choice: ആദ്യ ഘടകത്തിൽ ‘വാക്കുകളിൽ പ്രകടിപ്പിക്കാനാവാത്ത’ എന്നും അനുബന്ധവാക്യത്തിൽ ‘ഉച്ചരിക്കാൻ അനുവാദമില്ലാത്ത’ എന്നും നൽകി രണ്ടുതലങ്ങളും നിലനിർത്തി.
  alternative: ‘രഹസ്യവാക്കുകൾ’ അല്ലെങ്കിൽ ‘പറയാൻ പാടില്ലാത്ത വാക്കുകൾ’ എന്ന് മാത്രം വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാക്യം ἄρρητα എന്നും οὐκ ἐξὸν ... λαλῆσαι എന്നും വേർതിരിച്ച് പറയുന്നു; അവയെ ഒന്നാക്കി ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം നീക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മുൻവാക്യത്തിലെ വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘അവൻ’ നിലനിർത്തി; ἀνθρώπῳ പൊതുവായി ‘മനുഷ്യന്’ എന്നു നൽകി.
