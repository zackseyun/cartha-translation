source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: ml
  text: 'എന്നാൽ, അങ്ങനെയിരിക്കട്ടെ: ഞാൻ നിങ്ങൾക്കു ഭാരമായില്ല.[a] എന്നാൽ, തന്ത്രശാലിയായ ഞാൻ വഞ്ചനയിലൂടെ നിങ്ങളെ പിടിച്ചു.[c][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അങ്ങനെയെങ്കിൽ സമ്മതിച്ചു’ അല്ലെങ്കിൽ ‘എന്തായാലും അങ്ങനെ തന്നെയിരിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. വാദത്തിനുവേണ്ടി പൗലോസ് ഒരു കാര്യം താൽക്കാലികമായി സമ്മതിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘തന്ത്രശാലിയായ ഞാൻ വഞ്ചനയിലൂടെ നിങ്ങളെ പിടിച്ചു’ എന്നത് പൗലോസിന്റെ യഥാർഥ കുറ്റസമ്മതമല്ല; അദ്ദേഹത്തിനെതിരായ ഒരു ആരോപണം അദ്ദേഹം പരിഹാസത്തോടെ ആവർത്തിക്കുന്നതായിരിക്കാനാണ് സാധ്യത.
    reason: alternative_reading
  - marker: c
    text: ‘ഞാൻ നിങ്ങളെ കപടതന്ത്രത്തിൽ കുടുക്കി’ അല്ലെങ്കിൽ ‘വഞ്ചനയിലൂടെ നിങ്ങളെ മുതലെടുത്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: ശരി, അങ്ങനെയിരിക്കട്ടെ
  rationale: വാദത്തിനുവേണ്ടി ഒരു കാര്യം സമ്മതിച്ചുകൊടുക്കുന്ന ആലങ്കാരിക പ്രയോഗമാണിത്. ‘ശരി, അങ്ങനെയിരിക്കട്ടെ’ എന്നത് അതിന്റെ concessive ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατεβάρησα
  choice: ഭാരമായില്ല
  rationale: സന്ദർഭത്തിൽ കൊരിന്ത്യർക്കുമേൽ, പ്രത്യേകിച്ച് സാമ്പത്തികമായി, ഭാരം ചുമത്താതിരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭാരമായില്ല’ മൂലത്തിലെ രൂപകവും സന്ദർഭത്തിലെ അർഥവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ὑπάρχων
  choice: ആയിരുന്ന
  rationale: ഗ്രീക്കിലെ participle-ന്റെ സാഹചര്യബന്ധം കാരണമോ വിട്ടുവീഴ്ചയോ ആയി അമിതമായി വ്യക്തമാക്കാതെ ലളിതമായി നിലനിർത്തുന്നു.
- source_word: πανοῦργος
  choice: തന്ത്രശാലി
  rationale: ഇവിടെ കുറ്റാരോപണത്തിന്റെ ഭാഗമായി വരുന്ന, ധാർമികമായി പ്രതികൂലമായ കൗശലത്തെ സൂചിപ്പിക്കുന്നു. ‘തന്ത്രശാലി’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും പരിഹാസാത്മകമായ ആരോപണത്തിന് യോജിച്ചതുമാണ്.
- source_word: δόλῳ
  choice: വഞ്ചനയിലൂടെ
  rationale: ദത്തിവ് ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നു. വഞ്ചനയെ മാർഗമാക്കി എന്ന അർഥം ‘വഞ്ചനയിലൂടെ’ വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἔλαβον
  choice: പിടിച്ചു
  rationale: λαμβάνω എന്നതിന്റെ അടിസ്ഥാനമായ ‘എടുക്കുക/പിടിക്കുക’ എന്ന ആശയത്തോട് അടുത്തുനിൽക്കുകയും ഒരു തന്ത്രത്തിലൂടെ കുടുക്കിപ്പിടിച്ചു എന്ന സന്ദർഭസൂചന അനുവദിക്കുകയും ചെയ്യുന്നു. ‘മുതലെടുത്തു’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀλλὰ എന്നതിന് ശേഷമുള്ള വാക്കുകൾ പൗലോസിന്റെ യഥാർഥ സമ്മതമാണോ, അതോ അദ്ദേഹത്തിനെതിരായ ആരോപണത്തിന്റെ പരിഹാസാത്മകമായ ആവർത്തനമാണോ
  choice: പ്രധാനവാചകത്തിൽ ‘എന്നാൽ, തന്ത്രശാലിയായിരുന്ന ഞാൻ വഞ്ചനയിലൂടെ നിങ്ങളെ പിടിച്ചു’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി, പരിഹാസാത്മകമായ ആരോപണവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ‘എന്നാൽ, തന്ത്രശാലിയായ ഞാൻ നിങ്ങളെ കപടതന്ത്രത്തിൽ കുടുക്കി’ അല്ലെങ്കിൽ ആരോപണമാണെന്ന് പ്രധാനവാചകത്തിൽ തന്നെ തുറന്നുപറയുക.
  rationale: വിശാലമായ സന്ദർഭത്തിൽ പൗലോസ് താൻ അവരെ ചൂഷണം ചെയ്തിട്ടില്ലെന്ന് നിഷേധിക്കുന്നു; അതുകൊണ്ട് ഈ വാക്കുകൾ എതിരാളികളുടെ ആരോപണം പരിഹാസത്തോടെ ആവർത്തിക്കുന്നതാകാനാണ് കൂടുതൽ സാധ്യത. എന്നിരുന്നാലും, പരിഹാസം പ്രധാനവാചകത്തിൽ വിശദീകരിച്ചുചേർക്കാതെ ഗ്രീക്കിലെ വാചകഘടനയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘ശരി, അങ്ങനെയിരിക്കട്ടെ’ വാദപരമായ വിട്ടുവീഴ്ചയും, ‘ഭാരമായില്ല’ സാമ്പത്തികസന്ദർഭത്തോടൊപ്പം മൂലത്തിലെ രൂപകവും നിലനിർത്തുന്നു. രണ്ടാം വാക്യത്തിലെ കുറ്റാരോപണസ്വരം വിശദീകരണപരമായി മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു.
