  - severity: low
    issue: Register of the concessive opening
    rationale: ‘ശരി’ is somewhat conversational. ‘എന്നാൽ, അങ്ങനെയിരിക്കട്ടെ’ retains the rhetorical concession of ἔστω δέ in a more suitable biblical-public register.
