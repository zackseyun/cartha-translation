reference: 2 Corinthians 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μή τινα ὧν ἀπέσταλκα πρὸς ὑμᾶς, δι’ αὐτοῦ ἐπλεονέκτησα ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ അടുക്കലേക്ക് അയച്ചവരിൽ ആരെയെങ്കിലും മുഖേന നിങ്ങളെ ചൂഷണം ചെയ്തിട്ടുണ്ടോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ മുതലെടുത്തിട്ടുണ്ടോ?” അല്ലെങ്കിൽ “നിങ്ങളിൽനിന്ന് അന്യായമായി ലാഭം നേടിയിട്ടുണ്ടോ?” ഗ്രീക്ക് ക്രിയയ്ക്ക് മറ്റൊരാളുടെ ചെലവിൽ നേട്ടമുണ്ടാക്കുക എന്ന ആശയമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: ചെയ്തോ?
  rationale: μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സാധാരണ ചോദ്യരൂപം സന്ദർഭത്തോടൊപ്പം ആ പ്രതീക്ഷ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τινα ὧν
  choice: അയച്ചവരിൽ ആരെയെങ്കിലും
  rationale: പൗലോസ് അയച്ച സംഘത്തിൽ ഉൾപ്പെട്ട ഏതെങ്കിലും ഒരാളെ സൂചിപ്പിക്കുന്ന വിഭജകഭാവം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളുടെ അടുക്കലേക്ക് അയച്ച
  rationale: കൊരിന്ത്യരുടെ അടുക്കലേക്ക് പൗലോസ് നിയോഗിച്ചയച്ച ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ദിശയും വ്യക്തിബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: δι’ αὐτοῦ
  choice: ആരെയെങ്കിലും ഉപയോഗിച്ച്
  rationale: ഗ്രീക്കിൽ സർവനാമം ഏകവചനമായതിനാൽ, മുൻപുള്ള അനിശ്ചിത വ്യക്തിയെ ഓരോരുത്തനായി എടുത്ത് ‘അയാളിലൂടെ’ എന്ന അർഥം നൽകുന്നു. മലയാളത്തിൽ ആവർത്തനം ഒഴിവാക്കി അതേ ഉപാധിഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἐπλεονέκτησα
  choice: ചൂഷണം ചെയ്തോ
  rationale: മറ്റൊരാളുടെ ചെലവിൽ അന്യായമായി നേട്ടമുണ്ടാക്കുക എന്ന ക്രിയയുടെ സാമ്പത്തികവും ബന്ധപരവുമായ ഭാവം ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പകരുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: കൊരിന്തിലെ വിശ്വാസിസമൂഹത്തെ കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്ന ബഹുവചന കർമരൂപം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യം നിലനിർത്തിയിരിക്കുന്നു; ‘ചൂഷണം’ എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
