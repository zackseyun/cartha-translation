id: 2CO.12.15
reference: 2 Corinthians 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ആത്മാക്കൾക്കുവേണ്ടി[a] ഞാൻ അത്യന്തം സന്തോഷത്തോടെ ചെലവഴിക്കുകയും ഞാൻതന്നെ പൂർണമായി ചെലവാകുകയും ചെയ്യും. ഞാൻ നിങ്ങളെ കൂടുതൽ സ്നേഹിക്കുന്നുവെങ്കിൽ, ഞാൻ കുറച്ചുമാത്രം സ്നേഹിക്കപ്പെടുന്നുവോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ ജീവനുവേണ്ടി” അല്ലെങ്കിൽ “നിങ്ങൾക്കുവേണ്ടി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ψυχή എന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ ‘ആത്മാവ്,’ ‘ജീവൻ,’ ‘വ്യക്തി’ എന്നീ അർഥസാധ്യതകൾ ഉള്ളതിനാൽ.
lexical_decisions:
- source_word: ἥδιστα
  choice: ഏറ്റവും സന്തോഷത്തോടെ
  rationale: സമ്മതമാത്രമല്ല, പൗലോസിന്റെ അതിയായ സന്തോഷവും സന്നദ്ധതയും പ്രകടമാക്കുന്ന അതിശയോന്നത ക്രിയാവിശേഷണത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: δαπανήσω
  choice: ഞാൻ ... ചെലവഴിക്കുകയും
  rationale: വിഭവങ്ങൾ ചെലവിടുക എന്ന രൂപകം നിലനിർത്തുകയും തുടർന്ന് വരുന്ന ἐκδαπανηθήσομαι എന്ന പദവുമായി ബന്ധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκδαπανηθήσομαι
  choice: ഞാൻതന്നെ ചെലവായിത്തീരുകയും ചെയ്യും
  rationale: തനിക്കുള്ളതു ചെലവിടുന്നതിന് അപ്പുറം താൻതന്നെ പൂർണമായി വിനിയോഗിക്കപ്പെടുമെന്ന തീവ്രമായ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: ഇവിടെ മറ്റുള്ളവരുടെ പ്രയോജനത്തിനായുള്ള ത്യാഗപരമായ പ്രവർത്തനത്തെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: നിങ്ങളുടെ ആത്മാക്കൾ
  rationale: ψυχή എന്ന പദത്തിന്റെ ആത്മാവ്, ജീവൻ, വ്യക്തി എന്നീ അർഥസാധ്യതകളിൽ ഒന്നിനെ മുഖ്യവാചകത്തിൽ അടുത്തായി നിലനിർത്തുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: വാചകത്തെ കാരണവാക്യമായി തീർപ്പാക്കാതെ ഗ്രീക്കിലെ വ്യവസ്ഥാപരവും വാഗ്വാദപരവുമായ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: περισσοτέρως
  choice: കൂടുതൽ
  rationale: താരതമ്യത്തിന്റെ ഉയർന്ന അളവ് ലളിതവും നിലവാരമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀγαπῶν
  choice: ഞാൻ ... സ്നേഹിക്കുന്നുവെങ്കിൽ
  rationale: ഗ്രീക്കിൽ കൃദന്തരൂപമാണെങ്കിലും മലയാളത്തിലെ വ്യവസ്ഥാപരമായ ചോദ്യത്തിൽ ക്രിയാരൂപം ഉപയോഗിക്കുന്നത് അർഥവും ഒഴുക്കും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἧσσον
  choice: കുറച്ചുമാത്രമേ
  rationale: περισσοτέρως എന്നതിനോടുള്ള താരതമ്യവിരുദ്ധത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀγαπῶμαι
  choice: ഞാൻ ... സ്നേഹിക്കപ്പെടുന്നുള്ളോ
  rationale: ആരാണ് സ്നേഹിക്കുന്നത് എന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ കർമണിപ്രയോഗം സംരക്ഷിച്ച് അനാവശ്യമായ വ്യാഖ്യാനനിർണ്ണയം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഇടയപരിപാലനസന്ദർഭത്തിൽ ψυχαί എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നിങ്ങളുടെ ആത്മാക്കൾ
  alternative: നിങ്ങളുടെ ജീവനുകൾ / നിങ്ങൾതന്നെ
  rationale: മുഖ്യവാചകം ഗ്രീക്ക് പദത്തിന്റെ ആത്മീയവും വ്യക്തിപരവുമായ ഭാരം കാത്തുസൂക്ഷിക്കുന്നു; എന്നാൽ ഇവിടെ സാങ്കേതികമായ മനുഷ്യഘടനാശാസ്ത്രം നിർബന്ധമാക്കാതിരിക്കാൻ വിശാലമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: അവസാന ചോദ്യത്തിലെ കർമണിപ്രയോഗം
  choice: ഞാൻ കുറച്ചുമാത്രമേ സ്നേഹിക്കപ്പെടുന്നുള്ളോ?
  alternative: നിങ്ങൾ എന്നെ കുറച്ചുമാത്രമേ സ്നേഹിക്കുന്നുള്ളോ?
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം പ്രവർത്തകനെ തുറന്നുവെക്കുന്നു. സന്ദർഭം കൊരിന്ത്യരെ സൂചിപ്പിച്ചാലും അവരെ പ്രവർത്തകരായി മുഖ്യവാചകത്തിൽ ചേർക്കാതെ അസലിലെ വാഗ്വാദപരമായ മുറുക്ക് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ചെലവഴിക്കുക / ചെലവായിത്തീരുക’ എന്ന ആവർത്തിത രൂപകം ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു; അവസാനത്തിലെ കർമണിപ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും അസലിലെ യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
