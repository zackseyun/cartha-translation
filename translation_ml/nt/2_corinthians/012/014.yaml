id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: ml
  text: ഇതാ, മൂന്നാം പ്രാവശ്യം നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ ഒരുങ്ങിയിരിക്കുന്നു[a]; ഞാൻ നിങ്ങൾക്കു ഭാരമാകുകയുമില്ല[b]. കാരണം, ഞാൻ അന്വേഷിക്കുന്നത് നിങ്ങളുടേതല്ല, നിങ്ങളെത്തന്നെയാണ്. മക്കൾ മാതാപിതാക്കൾക്കായി സമ്പാദിച്ചുവെക്കേണ്ടതില്ല; മറിച്ച് മാതാപിതാക്കൾ മക്കൾക്കായാണ് സമ്പാദിച്ചുവെക്കേണ്ടത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘ഈ മൂന്നാം പ്രാവശ്യം നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ ഒരുങ്ങിയിരിക്കുന്നു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഭാരമാകുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയ്ക്ക് ഈ സന്ദർഭത്തിൽ ഒരാളിൽ സാമ്പത്തികഭാരം അടിച്ചേൽപ്പിക്കുക എന്ന അർഥവും ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ രൂപം.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: മൂന്നാം പ്രാവശ്യം നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ ഒരുങ്ങിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ‘ഈ മൂന്നാമത്’ എന്ന ഘടനയുടെ സന്ദർശനസംബന്ധമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മുമ്പ് രണ്ട് സന്ദർശനങ്ങൾ നിർബന്ധമായും നടന്നുവെന്ന് വാക്യത്തിനപ്പുറം ഉറപ്പിക്കുന്നില്ല.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: യാത്രചെയ്ത് സന്ദർശിക്കാൻ വരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: καταναρκήσω
  choice: നിങ്ങൾക്കു ഭാരമാകുകയില്ല
  rationale: സന്ദർഭത്തിലെ സാമ്പത്തികമോ ഭൗതികമോ ആയ ബാധ്യത ചുമത്തുക എന്ന ആശയം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: ഞാൻ അന്വേഷിക്കുന്നത് നിങ്ങളുടേതല്ല, നിങ്ങളെത്തന്നെയാണ്
  rationale: സ്വത്തുക്കളും വ്യക്തികളും തമ്മിലുള്ള ഗ്രീക്ക് വൈരുധ്യം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ὀφείλει
  choice: വെക്കേണ്ടത്
  rationale: ധാർമികമോ സാമൂഹികമോ ആയ ബാധ്യതയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θησαυρίζειν
  choice: സമ്പാദിച്ചുവെക്കുക
  rationale: ‘ശേഖരിച്ചുവെക്കുക/നിക്ഷേപിച്ചുവെക്കുക’ എന്ന അടിസ്ഥാന ആശയം കുടുംബപോഷണത്തിന്റെ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γονεῦσιν / γονεῖς
  choice: മാതാപിതാക്കൾ
  rationale: ലിംഗഭേദമില്ലാതെ മാതാവിനെയും പിതാവിനെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പദത്തിന് യോജിച്ച മലയാളം.
- source_word: τέκνα / τέκνοις
  choice: മക്കൾ
  rationale: പുത്രന്മാരെയും പുത്രിമാരെയും പൊതുവായി ഉൾക്കൊള്ളുന്ന, കുടുംബസന്ദർഭത്തിൽ സ്വാഭാവികമായ പദം.
theological_decisions:
- issue: ‘മൂന്നാം പ്രാവശ്യം’ എന്ന പൗലോസിന്റെ പരാമർശത്തിന്റെ അർഥം
  choice: ഇപ്പോൾ മൂന്നാം പ്രാവശ്യം വരാൻ ഒരുങ്ങിയിരിക്കുന്നതായാണ് പരിഭാഷപ്പെടുത്തിയത്.
  alternative: മുമ്പ് രണ്ട് സന്ദർശനങ്ങൾ നടന്നുവെന്ന് വ്യക്തമായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ ‘ഇത് എന്റെ മൂന്നാമത്തെ സന്ദർശനമായിരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം മൂന്നാം തവണത്തെ ഇപ്പോഴത്തെ ഒരുക്കത്തെ മുൻനിർത്തുന്നു; യാത്രാചരിത്രത്തെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം നിർണയിക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: മാതാപിതാക്കളും മക്കളും സംബന്ധിച്ച സമ്പാദ്യബാധ്യത
  choice: വാക്യത്തിലെ കുടുംബോപമയെ അതേപടി നിലനിർത്തി.
  alternative: ഇത് പൗലോസിന്റെ അപ്പൊസ്തോലിക അധികാരത്തെക്കുറിച്ചുള്ള പൊതുനിയമമായി വിശദീകരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: പാഠം തന്നെ നൽകുന്ന ഉപമയും നൈതിക വൈരുധ്യവും സംരക്ഷിച്ചു; ഒരു പ്രത്യേക സഭാശാസ്ത്ര വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ ശൈലി. ‘നിങ്ങളുടേതല്ല, നിങ്ങളെത്തന്നെയാണ്’ എന്ന സമാന്തരവൈരുധ്യവും മാതാപിതാവ്–മക്കൾ ഉപമയും നിലനിർത്തിയിരിക്കുന്നു.
