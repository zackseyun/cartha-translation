    rationale: 'The Malayalam form may suggest that the implicit subject was under an obligation to leave, whereas ἵνα ἀποστῇ gives the requested result/content: that it might depart.'
  - severity: low
    issue: Footnote d narrows the antecedent to ‘പീഡ’
    rationale: The Greek leaves the subject implicit and the prior verse uses both ‘thorn’ and ‘messenger’ imagery. The note should describe the antecedent without resolving that ambiguity.
