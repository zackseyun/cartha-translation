lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: ഇതിനെക്കുറിച്ച്
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπέρ ഇവിടെ മുൻവാക്യത്തിൽ പറഞ്ഞ കഷ്ടതയെ സംബന്ധിച്ച കാര്യം അവതരിപ്പിക്കുന്നു; ‘ഇതിനെക്കുറിച്ച്’ ആ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τρὶς
  choice: മൂന്നുപ്രാവശ്യം
  rationale: മൂന്ന് അവസരങ്ങളെയോ ആവർത്തനങ്ങളെയോ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണം; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവും.
- source_word: τὸν κύριον
  choice: കർത്താവിനോട്
  rationale: മൂലപാഠം പേര് ചേർക്കാതെ κύριος മാത്രമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ‘കർത്താവ്’ എന്ന പരമ്പരാഗതവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദം നിലനിർത്തുന്നു.
- source_word: παρεκάλεσα
  choice: അപേക്ഷിച്ചു
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ ഗൗരവമുള്ള അഭ്യർഥനയെ ‘അപേക്ഷിച്ചു’ സ്വാഭാവികമായി അറിയിക്കുന്നു; ഗ്രീക്കിലുള്ളതിലധികം വികാരതീവ്രത നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- source_word: ἵνα
  choice: വേണ്ടതിന്
  rationale: അപേക്ഷയുടെ ഉദ്ദേശ്യവും ഉള്ളടക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀποστῇ
  choice: അത് വിട്ടുപോകേണ്ടതിന്
  rationale: ക്രിയയുടെ അർഥം അകന്നുപോകുക/വിട്ടുപോകുക എന്നാണ്. ഗ്രീക്കിൽ കർത്താവ് പരോക്ഷമായതിനാൽ ‘അത്’ ഉപയോഗിച്ച് മുൻസന്ദർഭത്തിലെ പീഡയുടെ കൃത്യസ്വഭാവം നിർണയിക്കാതെ വയ്ക്കുന്നു.
- source_word: ἀπ’ ἐμοῦ
  choice: എന്നിൽനിന്ന്
  rationale: പൗലോസിൽനിന്നുള്ള വേർപാടിനെ ലളിതവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പേര് വികസിപ്പിക്കാതെ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കർത്താവായ യേശു’
  rationale: സന്ദർഭത്തിൽ യേശുവായിരിക്കാനാണ് സാധ്യതയെങ്കിലും ഗ്രീക്ക് പാഠം κύριον എന്നു മാത്രമേ പറയുന്നുള്ളൂ; അതിനാൽ മൂലപാഠത്തിലെ നിർവചനനില സംരക്ഷിക്കുന്നു.
- issue: ἀποστῇ എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അത്’ എന്നു നൽകി അവ്യക്തത സംരക്ഷിച്ചു.
  alternative: ‘മുള്ള് വിട്ടുപോകേണ്ടതിന്’ അല്ലെങ്കിൽ ‘ദൂതൻ വിട്ടുപോകേണ്ടതിന്’
  rationale: മുൻവാക്യത്തിൽ ‘ജഡത്തിലെ മുള്ള്’, ‘സാത്താന്റെ ദൂതൻ’ എന്നീ രണ്ടു വിവരണങ്ങളും ഉള്ളതിനാൽ ഏതൊന്നിനെ മാത്രം കർത്താവായി ഉറപ്പിക്കുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമാകും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കർത്താവ്’, ‘അപേക്ഷിച്ചു’ എന്നീ പദങ്ങൾ സഭാപരിചയമുള്ള വായനക്കാർക്കും സാധാരണ വായനക്കാർക്കും ഗ്രാഹ്യം; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിനനുസരിച്ച് ക്രമപ്പെടുത്തി.
