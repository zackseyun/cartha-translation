id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: ml
  text: അങ്ങനെയുള്ള ഒരാളെക്കുറിച്ച് ഞാൻ അഭിമാനിക്കും[a]; എന്നാൽ എന്നെക്കുറിച്ച് ഞാൻ അഭിമാനിക്കുകയില്ല—എന്റെ ബലഹീനതകളിൽ അല്ലാതെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങനെയുള്ള ഒരാൾക്കുവേണ്ടി.” ഗ്രീക്ക് പദത്തിന് “കുറിച്ച്,” “വേണ്ടി,” അല്ലെങ്കിൽ “സംബന്ധിച്ച്” എന്നിങ്ങനെ അർഥമാക്കാം. ഇവിടെയുള്ള പരോക്ഷമായ പ്രയോഗം പൗലോസിന്റെ വാചക അകലം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ബലഹീനതകളിൽ അല്ലാതെ” അല്ലെങ്കിൽ “എന്റെ അശക്തതകളിൽ അല്ലാതെ.” പൗലോസിന്റെ പ്രയോഗത്തിൽ “ബലഹീനത” മനുഷ്യദൗർബല്യം, കഷ്ടത, അല്ലെങ്കിൽ ദൈവത്തിന്റെ ശക്തി വെളിപ്പെടുന്ന അവസ്ഥകൾ എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: അങ്ങനെയുള്ള ഒരാളെക്കുറിച്ച്
  rationale: ὑπέρ + genitive ഇവിടെ ആ വ്യക്തിയെ സംബന്ധിച്ചുള്ള അഭിമാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഒരാളെക്കുറിച്ച്’ സ്വാഭാവികമാണ്; ‘അങ്ങനെയുള്ള’ എന്നത് പൗലോസിന്റെ മനപ്പൂർവമായ പരോക്ഷതയും വാചക അകലവും നിലനിർത്തുന്നു.
- source_word: καυχήσομαι
  choice: ഞാൻ അഭിമാനിക്കും
  rationale: καυχάομαι എന്നതിന് ഈ സന്ദർഭത്തിൽ ‘അഭിമാനിക്കുക’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ തുല്യപദമാണ്; ഭാവികാലവും നിലനിർത്തുന്നു.
- source_word: ἐμαυτοῦ
  choice: എന്നെക്കുറിച്ച്
  rationale: പ്രതിഫലക സർവനാമം പൗലോസിനെത്തന്നെ വിരുദ്ധഘടകമായി ചൂണ്ടുന്നു; ആവർത്തിക്കുന്ന ὑπέρ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഇവിടെ εἰ μή ഒരു വ്യവസ്ഥയല്ല, അപവാദം അവതരിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘അല്ലാതെ’ അതിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: എന്റെ ബലഹീനതകളെക്കുറിച്ച്
  rationale: ἀσθένεια മനുഷ്യദൗർബല്യം, കഷ്ടത, അശക്താവസ്ഥ എന്നിവ ഉൾക്കൊള്ളാം. സന്ദർഭത്തിലെ വ്യക്തിപരമായ വിരുദ്ധത വ്യക്തമാക്കാൻ ‘എന്റെ’ ചേർത്തിരിക്കുന്നു; ആവർത്തിക്കുന്ന അഭിമാനത്തിന്റെ വിഷയമായി മലയാളത്തിൽ ‘-യെക്കുറിച്ച്’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: പൗലോസിന് അനുവദനീയമായ അഭിമാനത്തിന്റെ സ്വഭാവം
  choice: അസാധാരണ അനുഭവവുമായി ബന്ധപ്പെട്ട ‘അങ്ങനെയുള്ള ഒരാൾ’ എന്ന പരോക്ഷ പരാമർശത്തെയും സ്വന്തം ബലഹീനതകളിൽ മാത്രം അഭിമാനിക്കുന്നതിനെയും തമ്മിൽ വാക്യം വിരുദ്ധമായി നിർത്തുന്നു.
  alternative: ‘അങ്ങനെയുള്ള ഒരാൾ’ പൗലോസിൽനിന്ന് യഥാർഥത്തിൽ വേറിട്ട മറ്റൊരാളാണെന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് വാചകം ആത്മകഥാപരമായ തിരിച്ചറിയൽ നേരിട്ട് തീർപ്പാക്കാതെ വാചക അകലം സൃഷ്ടിക്കുന്നു. വിവർത്തനം ആ ഉദ്ദേശ്യപൂർവമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അങ്ങനെയുള്ള ഒരാൾ’ എന്ന പരോക്ഷതയും ‘എന്നെക്കുറിച്ച്’ എന്ന വിരുദ്ധതയും സംരക്ഷിച്ചു. ‘അഭിമാനിക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതിനാൽ പരമ്പരാഗതമായെങ്കിലും കുറച്ച് സുതാര്യമല്ലാത്ത പദങ്ങൾ ഒഴിവാക്കി.
