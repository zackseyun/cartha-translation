id: 2CO.7.15
reference: 2 Corinthians 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: ml
  text: നിങ്ങളെല്ലാവരുടെയും അനുസരണവും നിങ്ങൾ ഭയത്തോടും വിറയലോടുംകൂടെ[a] അവനെ സ്വീകരിച്ചതും അവൻ ഓർക്കുമ്പോൾ, നിങ്ങളോടുള്ള അവന്റെ വാത്സല്യം കൂടുതലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭക്ത്യാദരത്തോടും വിറയലോടുംകൂടെ.’ ‘ഭയവും വിറയലും’ എന്നത് ഗൗരവപൂർവവും വിനീതവുമായ പ്രതികരണത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ഒരു പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: വാത്സല്യം
  rationale: അക്ഷരാർഥത്തിൽ ആന്തരാവയവങ്ങളെ സൂചിപ്പിക്കുന്ന പദം ഇവിടെ ഉള്ളിൽനിന്നുള്ള ആഴമായ സ്നേഹവികാരത്തെയാണ് കുറിക്കുന്നത്. ‘വാത്സല്യം’ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ ആ വൈകാരിക ഊഷ്മളത പ്രകടമാക്കുന്നു.
- source_word: περισσοτέρως
  choice: ഇനിയും വർധിക്കുന്നു
  rationale: തീത്തൊസിന് കൊരിന്ത്യരോടുള്ള വാത്സല്യം അവരുടെ പ്രതികരണം ഓർക്കുമ്പോൾ കൂടുതൽ ശക്തമാകുന്നു എന്ന താരതമ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങളോടുള്ള
  rationale: വാത്സല്യത്തിന്റെ ദിശ കൊരിന്ത്യരിലേക്കാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀναμιμνῃσκομένου
  choice: അവൻ ഓർക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് പാർട്ടിസിപ്പിൾ സൂചിപ്പിക്കുന്ന അനുബന്ധസാഹചര്യവും ഓർമിക്കുന്ന പ്രവൃത്തിയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὑπακοήν
  choice: അനുസരണം
  rationale: അപ്പൊസ്തോലിക നിർദേശത്തോടുള്ള സമൂഹത്തിന്റെ അനുസരണത്തെ നേരിട്ടും സുതാര്യമായും വിവർത്തനം ചെയ്യുന്നു.
- source_word: πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരുടെയും
  rationale: മുഴുവൻ സമൂഹത്തെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: ഭയത്തോടും വിറയലോടുംകൂടെ
  rationale: പൗലോസിന്റെ പരിചിതമായ പ്രയോഗം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ഭക്ത്യാദരപൂർവമായ ഗൗരവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐδέξασθε
  choice: നിങ്ങൾ ... സ്വീകരിച്ചതും
  rationale: തീത്തൊസിനെ സ്വാഗതം ചെയ്യുകയും അംഗീകരിക്കുകയും ചെയ്തതിനെ ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലവും സ്വാഭാവികവുമായ പദം.
- source_word: αὐτόν
  choice: അവനെ
  rationale: ഗ്രീക്കിലെ സർവനാമം നിലനിർത്തുന്നു; സമീപസന്ദർഭത്തിൽ അത് തീത്തൊസിനെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: കൊരിന്ത്യർ തീത്തൊസിനെ സ്വീകരിച്ചതുമായി ബന്ധപ്പെട്ട ‘ഭയവും വിറയലും’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ഭയത്തോടും വിറയലോടുംകൂടെ’ എന്ന പൗലോസിന്റെ പ്രയോഗം അതേപടി നിലനിർത്തുക
  alternative: ‘ഭക്ത്യാദരത്തോടും വിറയലോടുംകൂടെ’ എന്നു വ്യാഖ്യാനപരമായി വിവർത്തനം ചെയ്യുക
  rationale: ഈ പ്രയോഗത്തിന് അക്ഷരാർഥത്തിലുള്ള ഭയം, ആദരപൂർവമായ ഗൗരവം, വിനീതമായ പ്രതികരണസന്നദ്ധത എന്നീ അർഥഛായകൾ ഉണ്ട്. അതിനാൽ മുഖ്യപാഠം ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് സന്ദർഭോചിതമായ അർഥം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ വിവരക്രമം മലയാളവായനയ്ക്ക് വ്യക്തമായ രീതിയിൽ ക്രമപ്പെടുത്തി; എന്നാൽ താരതമ്യഭാവം, സമൂഹമൊട്ടാകെയുള്ള അനുസരണം, പൗലോസീയ പ്രയോഗത്തിന്റെ തുറന്ന അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
