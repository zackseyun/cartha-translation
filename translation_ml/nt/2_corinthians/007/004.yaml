language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: ml
  text: നിങ്ങളോടു എനിക്ക് വളരെ ധൈര്യമുണ്ട്[a]; നിങ്ങളെക്കുറിച്ച് എനിക്ക് വളരെ പുകഴ്ചയുമുണ്ട്. ഞാൻ പ്രോത്സാഹനത്താൽ നിറഞ്ഞിരിക്കുന്നു[b]; ഞങ്ങളുടെ സകല കഷ്ടതകളുടെയും മധ്യേ[c] ഞാൻ സന്തോഷത്താൽ കവിഞ്ഞൊഴുകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളോടു എനിക്ക് വളരെ ആത്മവിശ്വാസമുണ്ട്.” ഗ്രീക്ക് പദത്തിന് ധൈര്യം, ആത്മവിശ്വാസം, തുറന്ന സംസാരസ്വാതന്ത്ര്യം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞാൻ ആശ്വാസത്താൽ നിറഞ്ഞിരിക്കുന്നു.” ഗ്രീക്ക് പദത്തിൽ പ്രോത്സാഹനവും ആശ്വാസവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഞങ്ങളുടെ സകല കഷ്ടതകളും ഉണ്ടായിട്ടും.” ഗ്രീക്ക് പ്രയോഗം തുടരുന്ന കഷ്ടതയുടെ നടുവിൽ സന്തോഷം കവിഞ്ഞൊഴുകുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: തുറന്ന ധൈര്യത്തോടെ സംസാരിക്കാൻ
  rationale: ഈ പദത്തിൽ ധൈര്യവും മറയില്ലാത്ത സംസാരസ്വാതന്ത്ര്യവും ഉൾപ്പെടുന്നു. സന്ദർഭത്തിലെ πρὸς ὑμᾶς എന്ന ബന്ധസൂചനയോടൊപ്പം ഈ സ്വാഭാവിക മലയാളപ്രയോഗം രണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: καύχησις
  choice: അഭിമാനിക്കാൻ
  rationale: കൊരിന്ത്യരെക്കുറിച്ചുള്ള പൗലോസിന്റെ അനുകൂലമായ പ്രശംസാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഇത് സ്വയംപുകഴ്ത്തൽ എന്ന പ്രതികൂല അർഥത്തിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: ഇവിടെ ὑπέρ കൊരിന്ത്യരെ സംബന്ധിച്ചുള്ള അനുകൂലമായ അഭിമാനത്തെയും പ്രശംസയെയും സൂചിപ്പിക്കുന്നു. 'നിങ്ങൾക്കുവേണ്ടി' എന്നത് മലയാളത്തിൽ തെറ്റായ പ്രതിനിധാനാർഥം ഉണർത്താം.
- source_word: πεπλήρωμαι τῇ παρακλήσει
  choice: എനിക്കു പ്രോത്സാഹനം നിറഞ്ഞിരിക്കുന്നു
  rationale: പൂർണ്ണമായതിന്റെ ഇപ്പോഴത്തെ ഫലം സൂചിപ്പിക്കുന്ന perfect passive ഭാവം നിലനിർത്തുന്നു. παράκλησις നൽകുന്ന ശക്തിപ്പെടുത്തലും ആശ്വാസവും ഉൾക്കൊള്ളാൻ 'പ്രോത്സാഹനം' മുഖ്യപദമായി സ്വീകരിച്ചു.
- source_word: ὑπερπερισσεύομαι τῇ χαρᾷ
  choice: ഞാൻ സന്തോഷത്താൽ കവിഞ്ഞൊഴുകുന്നു
  rationale: തീവ്രമായ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ദൃശ്യരൂപവും χαράയുടെ നേരിട്ടുള്ള അർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: ഞങ്ങളുടെ സകല കഷ്ടതകളുടെയും മധ്യേ
  rationale: കഷ്ടതയും സന്തോഷവും ഒരേ സമയം നിലനിൽക്കുന്നുവെന്ന ആശയസംഘർഷം സംരക്ഷിക്കുന്നു; 'എന്നിട്ടും' എന്ന് വ്യാഖ്യാനിച്ച് ബന്ധം തീർപ്പാക്കുന്നില്ല.
- source_word: πολλή ... πολλή
  choice: വളരെ ... വളരെ
  rationale: മൂലത്തിലെ ആവർത്തനവും അളവിന്റെ ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അനുകൂലമായ പൗലോസീയ καύχησις ഭാഷയെ പ്രതികൂല സ്വയംപുകഴ്ത്തലായി മാറ്റാതിരിക്കുക
  choice: '''അഭിമാനിക്കാൻ'' എന്ന് പരിഭാഷപ്പെടുത്തി'
  alternative: '''പുകഴാൻ'' / ''പ്രശംസിക്കാൻ'''
  rationale: സന്ദർഭം കൊരിന്ത്യരെക്കുറിച്ചുള്ള പൗലോസിന്റെ അനുകൂലമായ അഭിമാനമാണ്. 'അഭിമാനം' എന്നത് ആ ഭാവം നിലനിർത്തുന്നു; ധാർഷ്ട്യമെന്ന വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: സന്തോഷവും കഷ്ടതയും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുക
  choice: '''ഞങ്ങളുടെ സകല കഷ്ടതകളുടെയും മധ്യേ'''
  alternative: '''ഞങ്ങളുടെ സകല കഷ്ടതകളും ഉണ്ടായിട്ടും'''
  rationale: ഗ്രീക്ക് വാക്യം സന്തോഷം കഷ്ടതയുടെ നടുവിൽ കവിഞ്ഞൊഴുകുന്നതായി അവതരിപ്പിക്കുന്നു. വിരുദ്ധാർഥകമായി മാത്രം പുനർവ്യാഖ്യാനിക്കാതെ സഹവർത്തിത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ആദ്യവാക്യത്തിലെ നാമസാന്ദ്രമായ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപങ്ങളാക്കി; ആവർത്തനവും വികാരതീവ്രതയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
