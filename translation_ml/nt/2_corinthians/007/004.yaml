  to: നിങ്ങളോടു എനിക്ക് വളരെ ധൈര്യമുണ്ട്[a]; നിങ്ങളെക്കുറിച്ച് എനിക്ക് വളരെ പുകഴ്ചയുമുണ്ട്. ഞാൻ പ്രോത്സാഹനത്താൽ നിറഞ്ഞിരിക്കുന്നു[b]; ഞങ്ങളുടെ സകല കഷ്ടതകളുടെയും മധ്യേ[c] ഞാൻ സന്തോഷത്താൽ കവിഞ്ഞൊഴുകുന്നു.
  rationale: 'The revision restores the Greek''s two parallel nominal assertions: Paul has great παρρησία toward the Corinthians and great καύχησις concerning them. It avoids importing a mere ability-to-speak meaning, maintains the lexical force of positive Pauline boasting, improves the Malayalam idiom for πεπλήρωμαι τῇ παρακλήσει, and corrects footnote a''s directionality. The rendering of joy amid all affliction and all footnote anchors are retained.'
