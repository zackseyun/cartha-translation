id: 2CO.7.5
reference: 2 Corinthians 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: ml
  text: കാരണം, ഞങ്ങൾ മക്കെദോന്യയിൽ എത്തിയപ്പോൾപോലും ഞങ്ങളുടെ ജഡത്തിന് യാതൊരു വിശ്രമവും ഉണ്ടായില്ല[a]; മറിച്ച്, എല്ലാവിധത്തിലും ഞങ്ങൾ ഞെരുക്കപ്പെട്ടു—പുറത്ത് പോരാട്ടങ്ങൾ, അകത്ത് ഭയങ്ങൾ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾക്കുതന്നെ യാതൊരു വിശ്രമവും ഉണ്ടായില്ല.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “ഞങ്ങളുടെ ജഡത്തിന്” എന്നാണ്; ശരീരധാരികളായ മനുഷ്യരുടെ ദൗർബല്യവും ക്ലേശവുമാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: ഞങ്ങൾ ... എത്തിയപ്പോഴും
  rationale: γάρ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; καί ഇവിടെ ‘പോലും’ എന്ന ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ കാലവാക്യത്തോടു ചേർത്ത ‘-പ്പോഴും’ ഈ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: ഞങ്ങൾ മക്കെദോന്യയിൽ എത്തിയപ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കാലസൂചനയായി പരിഭാഷപ്പെടുത്തി. εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യസ്ഥാനത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-യിൽ എത്തുക’ എന്ന പ്രയോഗം നൽകുന്നു.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: ഒട്ടും ആശ്വാസം ഉണ്ടായില്ല
  rationale: ἄνεσις സമ്മർദത്തിൽനിന്നുള്ള ആശ്വാസം, അയവ്, വിശ്രമം എന്നിവ സൂചിപ്പിക്കുന്നു. ഇവിടെ ‘ആശ്വാസം’ ശാരീരികവും മാനസികവുമായ ക്ലേശത്തെ ഉൾക്കൊള്ളുന്നു.
- source_word: ἡ σὰρξ ἡμῶν
  choice: ഞങ്ങളുടെ ജഡത്തിന്
  rationale: σάρξ ഇവിടെ പാപസ്വഭാവത്തെക്കുറിച്ചുള്ള സാങ്കേതിക പ്രയോഗമല്ല; ശരീരധാരിയായ മനുഷ്യന്റെ ദൗർബല്യവും ക്ലേശവും സൂചിപ്പിക്കുന്ന യഥാർഥ രൂപകപ്രയോഗമാണ്. ‘ജഡം’ ഉറവിടപദത്തിന്റെ സ്വഭാവം നിലനിർത്തുന്നു; സ്വാഭാവികമായ അർഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: മറിച്ച്, എല്ലാവിധത്തിലും ഞങ്ങൾ ഞെരുക്കപ്പെട്ടു
  rationale: θλίβω സമ്മർദത്തിലാക്കപ്പെടുക, ഞെരുക്കപ്പെടുക, കഷ്ടപ്പെടുക എന്ന വ്യാപക അർഥം നൽകുന്നു. ‘ഞെരുക്കപ്പെട്ടു’ മൂലത്തിലെ സമ്മർദചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: ἔξωθεν μάχαι
  choice: പുറത്ത് പോരാട്ടങ്ങൾ
  rationale: μάχαι അക്ഷരാർഥത്തിലുള്ള യുദ്ധങ്ങൾക്കു മാത്രമല്ല, എതിർപ്പുകളും സംഘർഷങ്ങളും സൂചിപ്പിക്കാം. ‘പോരാട്ടങ്ങൾ’ ഈ വ്യാപ്തിയും വാക്യത്തിന്റെ തീക്ഷ്ണതയും നിലനിർത്തുന്നു.
- source_word: ἔσωθεν φόβοι
  choice: അകത്ത് ഭയങ്ങൾ
  rationale: φόβοι എന്ന ബഹുവചനം അതേപടി സൂക്ഷിക്കുകയും ἔξωθεν/ἔσωθεν എന്ന സമാന്തരവിരോധം ‘പുറത്ത്/അകത്ത്’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: σάρξ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഞങ്ങളുടെ ജഡത്തിന്
  alternative: ഞങ്ങൾക്കുതന്നെ / ഞങ്ങളുടെ ശരീരത്തിന്
  rationale: ഇവിടെ σάρξ ധാർമികമായ ‘പാപസ്വഭാവം’ എന്നല്ല, ശരീരധാരിയായ മനുഷ്യജീവിതത്തിന്റെ ദൗർബല്യവും ക്ലേശവും എന്ന നിലയിലാണ്. അതിനാൽ ഉറവിടത്തിന്റെ രൂപകഭാവം ‘ജഡം’ വഴി നിലനിർത്തി, കൂടുതൽ സ്വാഭാവികമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജഡം’ എന്ന ബൈബിൾപരിചിത പദം ഉറവിടരൂപം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചെങ്കിലും അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിട്ടുണ്ട്. അവസാനത്തിലെ ‘പുറത്ത് ... അകത്ത് ...’ സമാന്തരഘടന ഗ്രീക്ക് വാക്യത്തിന്റെ സംക്ഷിപ്തതയും പ്രഹരശക്തിയും നിലനിർത്തുന്നു.
