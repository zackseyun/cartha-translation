reference: 2 Corinthians 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: ml
  text: നിങ്ങളെ കുറ്റംവിധിക്കാനായല്ല[a] ഞാൻ ഇതു പറയുന്നത്. കാരണം, ഒരുമിച്ചു മരിക്കാനും ഒരുമിച്ചു ജീവിക്കാനും നിങ്ങൾ ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ ഉണ്ടെന്ന്[b] ഞാൻ മുമ്പേ പറഞ്ഞിട്ടുണ്ടല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുറ്റവിധിക്കുവേണ്ടിയല്ല’ അല്ലെങ്കിൽ ‘കുറ്റവിധി ലക്ഷ്യമാക്കിയല്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരുമിച്ചു മരിക്കുന്നതിനും ഒരുമിച്ചു ജീവിക്കുന്നതിനുമായി.’ ഗ്രീക്കിലെ പ്രയോഗം മരണത്തിലും ജീവിതത്തിലും പങ്കിടുന്ന ഐക്യദാർഢ്യത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: കുറ്റംവിധിക്കാനല്ല
  rationale: πρός + κατάκρισιν ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ‘കുറ്റംവിധിക്കാനല്ല’ എന്നത് പൗലോസിന്റെ വാക്കുകൾ കൊരിന്ത്യരെ ശിക്ഷാർഹരായി വിധിക്കാൻ ഉദ്ദേശിച്ചുള്ളതല്ലെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λέγω
  choice: ഞാൻ ഇതു പറയുന്നത്
  rationale: വർത്തമാനകാലമായ λέγω ‘ഞാൻ പറയുന്നു’ എന്നാണ്; സന്ദർഭത്തിലെ മുൻവാക്കുകളെ സൂചിപ്പിക്കാൻ മലയാളത്തിൽ ‘ഇതു’ ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: προείρηκα
  choice: ഞാൻ മുമ്പേ പറഞ്ഞിട്ടുണ്ടല്ലോ
  rationale: പൂർണകാലരൂപം മുമ്പ് പറഞ്ഞ വാക്കിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തി സൂചിപ്പിക്കുന്നു. ‘പറഞ്ഞിട്ടുണ്ടല്ലോ’ മുൻപ്രസ്താവനയെ ഓർമിപ്പിക്കുന്ന ഗ്രീക്കിലെ γάρ-ന്റെ വിശദീകരണഭാവവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: നിങ്ങൾ ഞങ്ങളുടെ ഹൃദയങ്ങളിൽ ഉണ്ട്
  rationale: ഗ്രീക്കിലെ ബഹുവചനമായ ‘ഹൃദയങ്ങളിൽ’ നിലനിർത്തി പൗലോസിന്റെയും സഹപ്രവർത്തകരുടെയും ആഴമായ സ്നേഹവും ആന്തരികബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: ഒരുമിച്ചു മരിക്കാനും ഒരുമിച്ചു ജീവിക്കാനും
  rationale: εἰς + articular infinitive-ന്റെ ലക്ഷ്യ/ഫലസാദ്ധ്യത പൂർണമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു. συν- ഘടകം രണ്ടു ക്രിയകളിലും സൂചിപ്പിക്കുന്ന പങ്കാളിത്തവും ഐക്യദാർഢ്യവും ‘ഒരുമിച്ചു’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഒരുമിച്ചു മരിക്കാനും ഒരുമിച്ചു ജീവിക്കാനും’ എന്നതിനെ പ്രത്യേക സഖ്യബന്ധമോ ക്രിസ്തുവുമായുള്ള ഐക്യമോ ആയി വിശദീകരിക്കണമോ
  choice: പ്രത്യേക സാങ്കേതിക ദൈവശാസ്ത്രവിഭാഗം ചേർക്കാതെ പരസ്പര ഐക്യദാർഢ്യത്തിന്റെ ഭാഷ നിലനിർത്തി
  alternative: ഇത് സഖ്യവിശ്വസ്തതയുടെയോ ക്രിസ്തുവിലുള്ള പങ്കാളിത്തത്തിന്റെയോ വ്യക്തമായ സൂചനയായി വിവർത്തനം ചെയ്യുക
  rationale: വാക്യം ആഴമായ സ്നേഹവും മരണത്തിലും ജീവിതത്തിലും പങ്കുചേരാനുള്ള ദൃഢബന്ധവും വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രസങ്കേതമായി വാക്യം തന്നെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കുറ്റംവിധിക്കുക,’ ‘ഹൃദയങ്ങളിൽ,’ ‘ഒരുമിച്ചു മരിക്കുക/ജീവിക്കുക’ എന്നീ പ്രയോഗങ്ങൾ മൂലത്തിന്റെ നിയമപരവും ബന്ധപരവും വികാരതീവ്രവുമായ ഘടകങ്ങൾ നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
