id: 2CO.7.16
reference: 2 Corinthians 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χαίρω ὅτι ἐν παντὶ θαρρῶ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/016.yaml
  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: ml
  text: എല്ലാ കാര്യങ്ങളിലും നിങ്ങളിൽ എനിക്ക് വിശ്വാസമുണ്ടെന്നതിൽ ഞാൻ സന്തോഷിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “എല്ലാ കാര്യങ്ങളിലും നിങ്ങളെക്കുറിച്ച് എനിക്ക് വിശ്വാസമുള്ളതിനാൽ ഞാൻ സന്തോഷിക്കുന്നു.”'
    reason: ὅτι എന്നത് ‘എന്നതിൽ’ എന്നും ‘ആയതിനാൽ’ എന്നും, ἐν ὑμῖν എന്നത് ‘നിങ്ങളിൽ’ എന്നും ‘നിങ്ങളെക്കുറിച്ച്’ എന്നും ഈ സന്ദർഭത്തിൽ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: χαίρω
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: ὅτι
  choice: എന്നതിൽ
  rationale: ഇവിടെ പൗലോസിന്റെ സന്തോഷത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം; കാരണാർഥകമായ വായനയും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἐν παντί
  choice: എല്ലാ കാര്യത്തിലും
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ വ്യാപ്തി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: θαρρῶ
  choice: എനിക്ക് ആത്മവിശ്വാസമുണ്ട്
  rationale: ഈ സന്ദർഭത്തിൽ ധൈര്യപ്പെടുക എന്നതിലുപരി കൊരിന്ത്യരോടുള്ള ഉറച്ച വിശ്വാസമാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ഗ്രീക്കിലെ ἐν എന്നതിന്റെ ബന്ധപരമായ ഭാവം നേരിട്ട് നിലനിർത്തുന്നു; ‘നിങ്ങളെക്കുറിച്ച്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ പ്രതിഫലിപ്പിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യവും സ്വാഭാവികവുമായ ശൈലി. മൂലപാഠത്തിലെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
