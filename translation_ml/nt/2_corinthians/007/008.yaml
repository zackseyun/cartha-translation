id: 2CO.7.8
reference: 2 Corinthians 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: ml
  text: എന്തെന്നാൽ, കത്തിലൂടെ ഞാൻ നിങ്ങളെ ദുഃഖിപ്പിച്ചെങ്കിലും, അതിൽ ഞാൻ ഖേദിക്കുന്നില്ല; ഞാൻ ഖേദിച്ചിരുന്നെങ്കിലും (ആ കത്ത് നിങ്ങളെ കുറച്ചുനേരത്തേക്കു മാത്രമാണെങ്കിലും ദുഃഖിപ്പിച്ചതെന്ന് ഞാൻ കാണുന്നു).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: ദുഃഖമുണ്ടാക്കി
  rationale: λυπέω ഇവിടെ വൈകാരികമായ ദുഃഖമോ വേദനയോ ഉണ്ടാക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ദുഃഖമുണ്ടാക്കി’ എന്നത് ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: ആ കത്തിലൂടെ
  rationale: ἐν ഇവിടെ ഉപാധിയെയോ മാധ്യമത്തെയോ സൂചിപ്പിക്കുന്നു; പൗലോസ് എഴുതിയ കത്താണ് ദുഃഖത്തിന് ഇടയാക്കിയതെന്ന ആശയം ‘കത്തിലൂടെ’ വ്യക്തമായി നൽകുന്നു.
- source_word: μεταμέλομαι
  choice: ഖേദിക്കുന്നില്ല
  rationale: സന്ദർഭത്തിൽ μεταμέλομαι ധാർമികമായ മാനസാന്തരത്തേക്കാൾ ചെയ്ത കാര്യത്തെക്കുറിച്ചുള്ള ഖേദമാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: μετεμελόμην
  choice: ഖേദിച്ചിരുന്നെങ്കിലും
  rationale: ഇംപെർഫെക്റ്റ് രൂപം കഴിഞ്ഞകാലത്ത് നിലനിന്നിരുന്ന ഖേദാവസ്ഥയെ സൂചിപ്പിക്കാൻ കഴിയും; ‘ഖേദിച്ചിരുന്നെങ്കിലും’ ആ കാലഭാവവും ഇപ്പോഴത്തെ ‘ഖേദിക്കുന്നില്ല’ എന്നതുമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: βλέπω
  choice: ഞാൻ കാണുന്നു
  rationale: തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്ന βλέπωയുടെ ലളിതവും ഉറവിടത്തോട് അടുത്തതുമായ പ്രയോഗമാണിത്.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: ആ കത്ത്
  rationale: ἐκείνηയുടെ നിർദേശകശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πρὸς ὥραν
  choice: കുറച്ചുനേരത്തേക്കു മാത്രം
  rationale: പദശഃ ‘ഒരു മണിക്കൂറിലേക്ക്’ എന്നാണെങ്കിലും ഇവിടെ ഇത് ഹ്രസ്വകാലത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിന് വിശദീകരണം നൽകുന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰ καὶ
  choice: എങ്കിലും / മാത്രമാണെങ്കിലും
  rationale: ആവർത്തിക്കുന്ന concessive ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്താൻ സന്ദർഭാനുസൃതമായ ഈ രൂപങ്ങൾ ഉപയോഗിച്ചു.
theological_decisions:
- issue: പൗലോസിന്റെ വികാരാവസ്ഥയെ വിവരിക്കുന്ന μεταμέλομαι എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ഖേദിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘മാനസാന്തരപ്പെടുക’ അല്ലെങ്കിൽ ‘പശ്ചാത്തപിക്കുക’
  rationale: ഇവിടെ വിഷയം ദൈവസന്നിധിയിലെ ധാർമിക മാനസാന്തരമല്ല; തന്റെ കത്ത് വായനക്കാർക്ക് ദുഃഖമുണ്ടാക്കിയതിനെക്കുറിച്ചുള്ള പൗലോസിന്റെ താൽക്കാലിക ഖേദമാണ്. അതിനാൽ ദൈവശാസ്ത്രപരമായ അധിക അർഥം ഇറക്കുമതി ചെയ്യാതെ ‘ഖേദിക്കുക’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. ഗ്രീക്കിലെ വിശദീകരണബന്ധവും concessive ആവർത്തനവും, അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന അപൂർണമായ വാക്യഘടനയും ഡാഷ് ഉപയോഗിച്ച് നിലനിർത്തി.
