reference: 2 Corinthians 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: ml
  text: ഇപ്പോൾ ഞാൻ സന്തോഷിക്കുന്നു—നിങ്ങൾ ദുഃഖിച്ചതുകൊണ്ടല്ല, മറിച്ച് നിങ്ങൾക്ക് മാനസാന്തരമുണ്ടാകുന്നവിധം ദുഃഖമുണ്ടായതുകൊണ്ടാണ്.[a] എന്തെന്നാൽ, ദൈവത്തിന് അനുസൃതമായ വിധത്തിൽ[b] നിങ്ങൾ ദുഃഖിച്ചു; അങ്ങനെ, ഞങ്ങളിൽനിന്ന് നിങ്ങൾക്ക് യാതൊരു നഷ്ടവും സംഭവിക്കാതിരിക്കേണ്ടതിന്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാനസാന്തരം’ എന്നതിന് ‘മനസ്സുമാറ്റം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവികമായ വിധത്തിൽ’ അല്ലെങ്കിൽ ‘ദൈവം ഇച്ഛിക്കുന്നതുപോലെ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഞങ്ങൾ നിമിത്തം നിങ്ങൾക്ക് യാതൊരു ദോഷവും ഉണ്ടാകാതിരിക്കേണ്ടതിന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: ഇപ്പോൾ ഞാൻ സന്തോഷിക്കുന്നു
  rationale: νῦν സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ നിലയും χαίρω എന്ന ക്രിയയുടെ സജീവഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλυπήθητε
  choice: നിങ്ങൾ ദുഃഖിച്ചു
  rationale: ആവർത്തിച്ചുവരുന്ന ഗ്രീക്ക് ക്രിയയുടെ മാതൃക നിലനിർത്തുന്നു; ദുഃഖത്തിന്റെ കാരണക്കാരനെ അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: εἰς μετάνοιαν
  choice: മാനസാന്തരത്തിലേക്കു നയിക്കുന്നവിധം
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയെയോ ഫലത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. μετάνοιαയുടെ ഈ സന്ദർഭത്തിലെ ധാർമിക-ആത്മീയ അർഥത്തിന് ‘മാനസാന്തരം’ യോജിക്കുന്നു.
- source_word: κατὰ θεόν
  choice: ദൈവത്തിന് അനുസൃതമായ വിധത്തിൽ
  rationale: ദുഃഖം ദൈവത്തിന്റെ മാനദണ്ഡത്തോടോ ഹിതത്തോടോ യോജിക്കുന്നതെന്ന ബന്ധം നിലനിർത്തുന്നു; ‘ദൈവിക ദുഃഖം’ എന്നു നാമവിശേഷണമായി ചുരുക്കുന്നില്ല.
- source_word: ζημιωθῆτε
  choice: നിങ്ങൾക്ക് യാതൊരു നഷ്ടവും ഉണ്ടാകാതിരിക്കുക
  rationale: ശാരീരിക ഉപദ്രവം എന്നു അമിതമായി വ്യാഖ്യാനിക്കാതെ ζημιόωയുടെ നഷ്ടം/ദോഷം എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ἐξ ἡμῶν
  choice: ഞങ്ങളിൽനിന്ന്
  rationale: ἐξ എന്നതിന്റെ ഉറവിടസൂചന നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കാരണാർഥവും സാധ്യമാണ്.
theological_decisions:
- issue: μετάνοιαയുടെ സ്വഭാവം
  choice: മാനസാന്തരം
  alternative: മനസ്സുമാറ്റം
  rationale: വെറും ബൗദ്ധിക അഭിപ്രായമാറ്റമായി ചുരുക്കാതെ ഈ സന്ദർഭത്തിലെ ധാർമികവും ആത്മീയവുമായ തിരിഞ്ഞുവരവ് അറിയിക്കുന്നു; പദത്തിന്റെ അടിസ്ഥാനമായ മനോഭാവമാറ്റം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: κατὰ θεόν എന്നതിലെ ദുഃഖവും ദൈവവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തിന് അനുസൃതമായ വിധത്തിൽ
  alternative: ദൈവികമായ വിധത്തിൽ / ദൈവം ഇച്ഛിക്കുന്നതുപോലെ
  rationale: ദൈവത്തിന്റെ മാനദണ്ഡം, ഹിതം, അല്ലെങ്കിൽ ദൈവത്തോടുള്ള യോജിപ്പ് എന്നീ സാധ്യതകളെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് പൂർണമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: ἐξ ἡμῶν എന്നതിലെ ഉറവിടമോ കാരണമോ
  choice: ഞങ്ങളിൽനിന്ന്
  alternative: ഞങ്ങൾ നിമിത്തം
  rationale: ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന്റെ നേരിട്ടുള്ള ഉറവിടാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ഗ്രീക്ക് ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും εἰς μετάνοιαν സ്വാഭാവികമായി വായിക്കാനായി ‘നയിക്കുന്നവിധം’ എന്നു വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട സ്ഥാനങ്ങളിൽ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
