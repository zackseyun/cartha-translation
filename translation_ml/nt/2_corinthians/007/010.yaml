id: 2CO.7.10
reference: 2 Corinthians 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: ml
  text: ദൈവഹിതപ്രകാരമുള്ള ദുഃഖം രക്ഷയിലേക്കു നയിക്കുന്നതും ഖേദിക്കേണ്ടതില്ലാത്തതുമായ മാനസാന്തരം ഉളവാക്കുന്നു[a][b]; എന്നാൽ ലോകത്തിന്റെ ദുഃഖം മരണം ഉളവാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മൂലഭാഷയിൽ കൂടുതൽ പദാനുപദമായി: ‘ദൈവപ്രകാരമുള്ള ദുഃഖം.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ഖേദിക്കേണ്ടതില്ലാത്ത’ എന്ന വിശേഷണം ഗ്രീക്കിൽ ‘മാനസാന്തരം’ എന്നതിനോടാണ് വ്യാകരണപരമായി നേരിട്ട് പൊരുത്തപ്പെടുന്നത്; പദക്രമം മൂലം ‘രക്ഷയിലേക്കു നയിക്കുന്ന മാനസാന്തരം’ എന്ന മുഴുവൻ ആശയത്തോടും ചേർത്ത് മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: ദൈവഹിതപ്രകാരമുള്ള
  rationale: പദാനുപദമായി ‘ദൈവപ്രകാരമുള്ള’ എന്ന ആശയം നൽകുന്നതിനൊപ്പം, ദൈവത്തിന്റെ മാനദണ്ഡത്തോടും ഹിതത്തോടും ഒത്ത ദുഃഖം എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘ലോകത്തിന്റെ’ എന്ന മറുവശത്തോടുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: λύπη
  choice: ദുഃഖം
  rationale: രണ്ടു വാക്യഭാഗങ്ങളിലും വികാരപരവും ധാർമികവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: μετάνοιαν
  choice: മാനസാന്തരം
  rationale: വെറും അഭിപ്രായമാറ്റമല്ല, ജീവിതദിശയിലെ ധാർമിക-ആത്മീയ തിരിഞ്ഞുവരവ് ഉൾക്കൊള്ളുന്ന സ്ഥാപിതമായ മലയാള ബൈബിൾപദം.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയിലേക്കു നയിക്കുന്ന
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യമോ ഫലദിശയോ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; രക്ഷയുടെ കാര്യകാരണബന്ധം പാഠം പറയുന്നതിലുപരി നിർവചിക്കുന്നില്ല.
- source_word: ἀμεταμέλητον
  choice: ഖേദിക്കേണ്ടതില്ലാത്തതുമായ
  rationale: ‘പശ്ചാത്തപിക്കേണ്ടതില്ലാത്ത’ എന്നു പറഞ്ഞാൽ μετάνοιαയുമായി മലയാളത്തിൽ ആശയക്കുഴപ്പം ഉണ്ടാകാം. ഈ രൂപം regret എന്ന അർഥം വ്യക്തമാക്കുകയും വിശേഷണം മാനസാന്തരത്തോടു നേരിട്ട് ബന്ധപ്പെടാനുള്ള ഗ്രീക്ക് സാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐργάζεται / κατεργάζεται
  choice: ഉളവാക്കുന്നു
  rationale: രണ്ടു ക്രിയകളും ഫലം സൃഷ്ടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഒരേ മലയാളരൂപം ഉപയോഗിക്കുന്നത് വാക്യത്തിന്റെ ശക്തമായ സമാന്തരത സംരക്ഷിക്കുന്നു; ഇവിടെ ഉപസർഗ്ഗഭേദം നിർബന്ധമായ അർഥവ്യത്യാസം ആവശ്യപ്പെടുന്നില്ല.
- source_word: τοῦ κόσμου
  choice: ലോകത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന സ്വാഭാവികമായി നിലനിർത്തുകയും ദൈവഹിതപ്രകാരമുള്ള ദുഃഖത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: θάνατον
  choice: മരണം
  rationale: ശാരീരികമോ ആത്മീയമോ അന്ത്യകാലപരമോ ആയ പ്രത്യേക അർഥത്തിലേക്ക് ചുരുക്കാതെ മൂലപാഠത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: രണ്ടുതരം ദുഃഖങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം
  choice: ‘ദൈവഹിതപ്രകാരമുള്ള ദുഃഖം’ എന്നും ‘ലോകത്തിന്റെ ദുഃഖം’ എന്നും നൽകി; ‘മരണം’ ഏതു വിധത്തിലുള്ളതെന്ന് കൂടുതൽ നിർവചിച്ചില്ല.
  alternative: ‘ദൈവിക ദുഃഖം’ / ‘ലൗകിക ദുഃഖം’; മരണം ആത്മീയമരണം മാത്രമാണെന്ന് വ്യക്തമാക്കൽ.
  rationale: പൗലോസ് ദൈവത്തോടൊത്ത ദുഃഖത്തെയും ലോകത്തിന്റേതായ ദുഃഖത്തെയും വേർതിരിക്കുന്നു; എന്നാൽ ‘മരണം’ ഇവിടെ കൃത്യമായി ചുരുക്കി നിർവചിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിച്ചു.
- issue: മാനസാന്തരവും രക്ഷയും തമ്മിലുള്ള ബന്ധം
  choice: ‘രക്ഷയിലേക്കു നയിക്കുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘രക്ഷയ്ക്കായുള്ള’ അല്ലെങ്കിൽ ‘രക്ഷയിൽ കലാശിക്കുന്ന’.
  rationale: εἰς ലക്ഷ്യമോ ഫലദിശയോ സൂചിപ്പിക്കുന്നു. മാനസാന്തരത്തെ സ്വതന്ത്രമായ പുണ്യകാരണമായി അവതരിപ്പിക്കാതെയും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ രക്ഷാക്രമം ഇറക്കുമതി ചെയ്യാതെയും ബന്ധം പ്രകടിപ്പിക്കുന്നു.
- issue: ἀμεταμέλητον ഏതിനെയാണ് വിശേഷിപ്പിക്കുന്നത്
  choice: പ്രധാനവാചകത്തിൽ അതിനെ ‘മാനസാന്തരം’ എന്നതിനോടു വ്യാകരണപരമായി ബന്ധപ്പെടുത്തി.
  alternative: ‘ഖേദമില്ലാതെ രക്ഷയിലേക്കു നയിക്കുന്നു’ എന്നപോലെ മുഴുവൻ പ്രക്രിയയെയോ സമീപമുള്ള ‘രക്ഷ’യെയോ സംബന്ധിക്കുന്നതായി വായിക്കൽ.
  rationale: ഗ്രീക്കിൽ വിശേഷണം μετάνοιαν എന്ന സ്ത്രീലിംഗ കർമപദത്തോടു പൊരുത്തപ്പെടുന്നതിനാൽ മാനസാന്തരത്തോടുള്ള നേരിട്ടുള്ള ബന്ധമാണ് ശക്തം; എങ്കിലും പദക്രമം കാരണം വിശാലമായ പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാനസാന്തരം’, ‘രക്ഷ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
