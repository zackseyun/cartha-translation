id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: ml
  text: അതിനാൽ, പ്രിയരേ, ഈ വാഗ്ദാനങ്ങൾ നമുക്കുള്ളതുകൊണ്ട്, ശരീരത്തിന്റെയും ആത്മാവിന്റെയും[a] സകല മലിനതയിൽനിന്ന് നമ്മെത്തന്നെ ശുദ്ധീകരിക്കാം; ദൈവഭയത്തിൽ[b] വിശുദ്ധിയെ പൂർണതയിലെത്തിച്ചുകൊണ്ട്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജഡത്തിന്റെയും ആത്മാവിന്റെയും.’
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവഭയം’ എന്നത് വെറും ഭീകരതയല്ല; ദൈവസന്നിധിയിലെ ഭക്തിപൂർവമായ ഭയാദരവും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_clarification
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘ദൈവഭയത്തിൽ വിശുദ്ധിയെ പരിപൂർണമാക്കിക്കൊണ്ട്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: ഈ വാഗ്ദാനങ്ങൾ
  rationale: ταύτας മുൻസന്ദർഭത്തിലെ ദൈവിക ഉറപ്പുകളിലേക്കു വിരൽചൂണ്ടുന്നു; ἐπαγγελίαയ്ക്ക് പൗലോസിന്റെ പ്രയോഗത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ‘വാഗ്ദാനം’ ആണ്.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹവും ഗൗരവവും ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്ന സ്വാഭാവികമായ സംബോധന.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: നമ്മെത്തന്നെ ശുദ്ധീകരിച്ച് ... പൂർണതയിലെത്തിക്കാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള ആഹ്വാനത്തിന്റെ ഉൾക്കൊള്ളുന്ന സ്വഭാവം ‘നമുക്ക്/നമ്മെത്തന്നെ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിൽ മുഖ്യ ആഹ്വാനം അവസാനം പൂർത്തിയാകുന്നു.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: സകല മലിനതയിൽനിന്നും
  rationale: μολυσμός സൂചിപ്പിക്കുന്ന ധാർമികവും ആചാരപരവുമായ കളങ്കത്തിന്റെ ആശയം ‘മലിനത’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: σαρκὸς καὶ πνεύματος
  choice: ശരീരത്തിന്റെയും ആത്മാവിന്റെയും
  rationale: 'ഇവിടെ σάρξ, πνεῦμα എന്നിവ മനുഷ്യന്റെ ബാഹ്യവും ആന്തരികവുമായ വശങ്ങളെ ചേർത്തു സൂചിപ്പിക്കുന്നു. ‘ശരീരം’ എന്നത് ‘ജഡം’ എന്ന പദത്തിന് ചില സാഹചര്യങ്ങളിലുള്ള ‘പാപസ്വഭാവം’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു; പദശ: സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.'
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: വിശുദ്ധിയെ പൂർണതയിലെത്തിക്കാം
  rationale: ἐπιτελέω എന്നതിലെ തുടക്കംമുതൽ ഉദ്ദേശിച്ച അവസാനത്തിലേക്കു കൊണ്ടുപോകുന്ന ഭാവവും ἁγιωσύνη എന്ന ഗുണാവസ്ഥയും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν φόβῳ θεοῦ
  choice: ദൈവഭയത്തിൽ
  rationale: വെറും ആദരവ് എന്നാക്കി മൃദൂകരിക്കാതെ ബൈബിൾപ്രയോഗത്തിന്റെ ശക്തിയും ഭക്തിപൂർവമായ ഭയാദരത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘σαρκὸς καὶ πνεύματος’ എന്നതിലെ σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ശരീരത്തിന്റെയും ആത്മാവിന്റെയും’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ജഡത്തിന്റെയും ആത്മാവിന്റെയും’
  rationale: ‘ആത്മാവ്’ എന്നതിനോടുള്ള ജോടി ഇവിടെ മുഴുവൻ മനുഷ്യനെയും—ശാരീരികവും ആന്തരികവുമായ തലങ്ങളിൽ—സൂചിപ്പിക്കുന്നു; പ്രത്യേകമായ ‘പാപസ്വഭാവം’ എന്ന അർഥം സന്ദർഭം ആവശ്യപ്പെടുന്നില്ല.
- issue: καθαρίσωμεν എന്ന ആഹ്വാനരൂപത്തിന്റെ ശക്തി
  choice: പൗലോസിനെയും വായനക്കാരെയും ഉൾക്കൊള്ളുന്ന ‘നമ്മെത്തന്നെ ... ശുദ്ധീകരിച്ച് ... പൂർണതയിലെത്തിക്കാം’ എന്ന ആഹ്വാനം.
  alternative: ‘നാം ശുദ്ധീകരിക്കണം’ എന്ന ബാധ്യതാപ്രസ്താവം
  rationale: ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ബഹുവചന ഹോർട്ടേറ്ററി സബ്ജങ്ക്റ്റീവിന്റെ കൂട്ടായ ക്ഷണവും ആഹ്വാനശക്തിയും നിലനിർത്തുന്നു.
- issue: φόβος θεοῦ എന്ന പ്രയോഗത്തിന്റെ ഭാവം
  choice: ‘ദൈവഭയത്തിൽ’ എന്ന് നിലനിർത്തി.
  alternative: ‘ദൈവത്തോടുള്ള ഭയാദരത്തിൽ’
  rationale: ഇത് വെറും ഭീകരതയല്ലെങ്കിലും ‘ആദരവ്’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നത് മൂലപദത്തിന്റെ ശക്തി കുറയ്ക്കും; വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐπιτελοῦντες എന്ന കൃതന്തത്തിന്റെ മുഖ്യ ആഹ്വാനത്തോടുള്ള ബന്ധം
  choice: ശുദ്ധീകരണത്തോടൊപ്പം വിശുദ്ധിയെ ലക്ഷ്യപൂർണതയിലേക്കു കൊണ്ടുപോകുന്ന പ്രവൃത്തിയായി അവതരിപ്പിച്ചു.
  alternative: ‘വിശുദ്ധിയെ പരിപൂർണമാക്കിക്കൊണ്ട്’
  rationale: പ്രവർത്തനത്തിന്റെ പൂർത്തീകരണഭാവം സംരക്ഷിക്കുമ്പോൾ പാപരഹിത പരിപൂർണത എന്ന പ്രത്യേക സിദ്ധാന്തവായന നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രിയരേ’, ‘ശുദ്ധീകരിച്ച്’, ‘വിശുദ്ധി’, ‘ദൈവഭയം’ എന്നിവ സഭാപരിചയമുള്ള വായനക്കാർക്കു പരിചിതമായിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്നതാണ്. ‘ജഡം’ മൂലമുള്ള അനാവശ്യ സിദ്ധാന്താർഥസൂചന ഒഴിവാക്കാൻ മുഖ്യവാചകത്തിൽ ‘ശരീരം’ തിരഞ്ഞെടുത്തു.
