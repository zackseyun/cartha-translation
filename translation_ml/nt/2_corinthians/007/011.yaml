id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: ml
  text: 'കാരണം, നോക്കൂ: ദൈവഹിതപ്രകാരമുള്ള ഈ ദുഃഖംതന്നെ[a] നിങ്ങളിൽ എത്ര വലിയ ഉത്സാഹം ഉളവാക്കി! എന്തൊരു പ്രതിരോധം[b], എന്തൊരു രോഷം, എന്തൊരു ഭയം, എന്തൊരു വാഞ്ഛ, എന്തൊരു തീക്ഷ്ണത, എന്തൊരു നീതിനിർവഹണം[c]! ഈ കാര്യത്തിൽ നിങ്ങൾ കുറ്റമില്ലാത്തവരാണെന്ന് എല്ലാ വിധത്തിലും തെളിയിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവികമായ ഈ ദുഃഖംതന്നെ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സ്വയം കുറ്റവിമുക്തരെന്നു തെളിയിക്കൽ.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ശിക്ഷാനടപടി,’ ‘നീതി,’ അല്ലെങ്കിൽ ‘തെറ്റിന് പരിഹാരം വരുത്തൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: ഇതാ
  rationale: ἰδούവിന്റെ ശ്രദ്ധ ക്ഷണിക്കുന്ന ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാണ്.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: ദൈവഹിതപ്രകാരമുള്ള ഈ ദുഃഖംതന്നെ
  rationale: κατὰ θεόν എന്നത് ദൈവത്തിന്റെ ഇഷ്ടത്തിനോ മാനദണ്ഡത്തിനോ അനുസൃതമായ ദുഃഖമെന്ന തുറന്ന അർഥത്തിൽ അവതരിപ്പിക്കുന്നു; വെറും ‘ദൈവിക ദുഃഖം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: നിങ്ങളിൽ എത്ര വലിയ ഉത്സാഹമാണ് ഉളവാക്കിയത്
  rationale: κατεργάζομαιയുടെ ഫലം ഉളവാക്കുക എന്ന അർഥവും σπουδήയുടെ ഗൗരവപൂർണമായ ഉത്സാഹവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀλλὰ ... ἀλλὰ
  choice: മാത്രമല്ല ... എന്തൊരു
  rationale: ആവർത്തിതമായ ἀλλά ഇവിടെ ശക്തമായ വിരോധത്തേക്കാൾ വർധിച്ചുവരുന്ന കൂട്ടിച്ചേർക്കലാണ്; മലയാളത്തിലെ ആവർത്തിത ആശ്ചര്യഘടന പൗലോസിന്റെ വാഗ്‌ശൈലിയുടെ ഊന്നൽ കൈമാറുന്നു.
- source_word: ἀπολογίαν
  choice: പ്രതിവാദം
  rationale: ആരോപണത്തോടുള്ള മറുപടി അഥവാ സ്വന്തം നിലപാട് വിശദീകരിച്ചുള്ള പ്രതിരോധം എന്ന അർഥം നിലനിർത്തുന്നു; സ്വയം കുറ്റവിമുക്തരാക്കൽ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀγανάκτησιν
  choice: രോഷം
  rationale: സംഭവിച്ച തെറ്റിനോടുള്ള ശക്തമായ ധാർമിക അമർഷം സൂചിപ്പിക്കുന്നു; രോഷത്തിന്റെ ലക്ഷ്യം ഗ്രീക്കിൽ വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: φόβον
  choice: ഭയം
  rationale: ഭയം ദൈവത്തോടോ പൗലോസിനോടോ സാഹചര്യത്തിന്റെ ഗൗരവത്തോടോ ബന്ധപ്പെട്ടതാണെന്ന് മൂലപാഠം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ തുറന്ന അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐπιπόθησιν
  choice: വാഞ്ഛ
  rationale: ആഴമുള്ള ആഗ്രഹം എന്ന ശക്തി നിലനിർത്തുന്ന, ഗൗരവമുള്ള ആധുനിക മലയാളപദമാണ്.
- source_word: ζῆλον
  choice: തീക്ഷ്ണത
  rationale: σπουδήയിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ശക്തമായ ധാർമിക ശുഷ്കാന്തിയും ആവേശവും സൂചിപ്പിക്കുന്നു.
- source_word: ἐκδίκησιν
  choice: നീതി നടപ്പാക്കാൻ ... വ്യഗ്രത
  rationale: തെറ്റിനെ നേരിട്ട് കാര്യങ്ങൾ ശരിയാക്കാനുള്ള ഉറച്ച നടപടിയെ സൂചിപ്പിക്കുന്നു; വ്യക്തിപരമായ പ്രതികാരം എന്ന അർഥം അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: എല്ലാ വിധത്തിലും തെളിയിച്ചു
  rationale: അവരുടെ പ്രതികരണം അവരുടെ നില തെളിയിച്ചു എന്ന തെളിവാധിഷ്ഠിത അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: ഈ കാര്യത്തിൽ നിങ്ങൾ കുറ്റമില്ലാത്തവരാണെന്ന്
  rationale: ἁγνός ഇവിടെ പൊതുവായ ധാർമിക പൂർണതയേക്കാൾ പ്രസ്തുത സംഭവവുമായി ബന്ധപ്പെട്ട നിർമലതയോ കുറ്റമില്ലായ്മയോ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: κατὰ θεόν എന്നതിന്റെ അർഥം
  choice: ദൈവഹിതപ്രകാരമുള്ള
  alternative: ദൈവികമായ
  rationale: ദുഃഖം ദൈവത്തിന്റെ ഇഷ്ടത്തിനോ മാനദണ്ഡത്തിനോ അനുസൃതമാണെന്ന ബന്ധം നിലനിർത്തുന്നു; ദുഃഖത്തിന് സ്വതവേ ഒരു ദൈവിക ഗുണമുണ്ടെന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- issue: ἐκδίκησις എന്നതിന്റെ പശ്ചാത്തലാർഥം
  choice: നീതി നടപ്പാക്കാനുള്ള വ്യഗ്രത
  alternative: ശിക്ഷിക്കാനുള്ള വ്യഗ്രത / പ്രതികാരം
  rationale: അനുതാപത്തിന്റെ ഫലമായി തെറ്റിനെ ശരിയാക്കാൻ എടുത്ത ഉറച്ച നിലപാട് പ്രകടമാക്കുന്നു. ശിക്ഷ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുമ്പോഴും വ്യക്തിപരമായ പ്രതികാരത്തെ മുഖ്യപാഠത്തിൽ പ്രോത്സാഹിപ്പിക്കുന്നില്ല.
- issue: ἁγνούς എന്നതിന്റെ വ്യാപ്തി
  choice: ഈ കാര്യത്തിൽ കുറ്റമില്ലാത്തവർ
  alternative: ഈ കാര്യത്തിൽ നിർമലർ
  rationale: കൊരിന്ത്യർ എല്ലാ അർഥത്തിലും പാപരഹിതരായി എന്ന അവകാശവാദം ഒഴിവാക്കി, τῷ πράγματι ചൂണ്ടിക്കാണിക്കുന്ന പ്രത്യേക വിഷയത്തോടു മാത്രം പ്രസ്താവന ബന്ധിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. പട്ടികയുടെ വാഗ്‌ഊന്നൽ ‘എന്തൊരു’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ഭയത്തിന്റെയും രോഷത്തിന്റെയും വാഞ്ഛയുടെയും ലക്ഷ്യങ്ങൾ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
