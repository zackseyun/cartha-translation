id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: ml
  text: കാരണം, നിങ്ങളെക്കുറിച്ച് ഞാൻ തീത്തൊസിനോട് എന്തെങ്കിലും പുകഴ്ത്തിപ്പറഞ്ഞിട്ടുണ്ടെങ്കിൽ[a], എനിക്ക് നാണംകെടേണ്ടിവന്നില്ല. മറിച്ച്, ഞങ്ങൾ നിങ്ങളോടു സത്യമായി എല്ലാം പറഞ്ഞതുപോലെതന്നെ, തീത്തൊസിനോടു ഞങ്ങൾ നടത്തിയ പുകഴ്ത്തിപ്പറച്ചിലും[b] സത്യമെന്നു തെളിഞ്ഞു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവനോട്’ എന്നാണ് മൂലഭാഷയിൽ; സന്ദർഭത്തിൽ അത് തീത്തൊസിനെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തീത്തൊസിന്റെ മുമ്പാകെയുള്ള ഞങ്ങളുടെ പുകഴ്ത്തിപ്പറച്ചിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. സന്ദർഭത്തിൽ, കൊരിന്ത്യരെക്കുറിച്ച് തീത്തൊസിനോട് പറഞ്ഞതാണു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι / καύχησις
  choice: പുകഴ്ത്തിപ്പറഞ്ഞിട്ടുണ്ടെങ്കിൽ / പുകഴ്ത്തിപ്പറച്ചിൽ
  rationale: ക്രിയയും അതിന്റെ നാമരൂപവും തമ്മിലുള്ള ഗ്രീക്ക് പദബന്ധം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ഇത് പാപകരമായ അഹങ്കാരമല്ല, കൊരിന്ത്യരെക്കുറിച്ചുള്ള അഭിമാനപൂർവമായ പ്രശംസയാണ്; അതേസമയം ‘ആത്മവിശ്വാസം’ എന്നു മൃദൂകരിക്കാതെ വാചകത്തിന്റെ ശക്തി സൂക്ഷിക്കുന്നു.
- source_word: οὐ κατῃσχύνθην
  choice: എനിക്ക് നാണംകെടേണ്ടിവന്നില്ല
  rationale: അകത്തെ ലജ്ജാഭാവത്തെക്കാൾ, പൗലൊസിന്റെ വാക്കുകൾ തെറ്റാണെന്നു തെളിഞ്ഞ് അദ്ദേഹം നാണംകെട്ടുപോകാതിരുന്നതാണ് കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്നത്.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: ഞങ്ങൾ നിങ്ങളോടു സത്യമായി എല്ലാം പറഞ്ഞു
  rationale: πάντα എന്നതിന്റെ സമഗ്രതയും ἐν ἀληθείᾳ എന്നതിന്റെ ക്രിയാവിശേഷണപരമായ അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἡ ἐπὶ Τίτου
  choice: തീത്തൊസിനോടുള്ള
  rationale: ἐπί + genitive എന്ന പ്രയോഗത്തിന് ‘തീത്തൊസിന്റെ മുമ്പാകെ/സന്നിധിയിൽ’ എന്നും ‘തീത്തൊസിനോട്’ എന്നും ഗ്രഹിക്കാവുന്ന ഇടമുണ്ട്. സന്ദർഭത്തിൽ തീത്തൊസിനോട് നടത്തിയ പുകഴ്ത്തിപ്പറച്ചിലാണ് ഉദ്ദേശ്യം; വിവർത്തനം അത് സ്വാഭാവികമായി പറയുന്നു, വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀλήθεια ἐγενήθη
  choice: സത്യമെന്നു തെളിഞ്ഞു
  rationale: ‘സത്യമായിത്തീർന്നു’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ, മുമ്പത്തെ പുകഴ്ത്തിപ്പറച്ചിൽ യാഥാർഥ്യത്തോട് ഒത്തതായി തെളിഞ്ഞു എന്ന ഗ്രീക്ക് ശൈലിയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ ‘പുകഴ്ത്തൽ’ എന്നതിന്റെ സ്വഭാവം
  choice: കൊരിന്ത്യരെക്കുറിച്ചുള്ള ന്യായമായ അഭിമാനപൂർവമായ പ്രശംസയായി ‘പുകഴ്ത്തിപ്പറയുക’ എന്നു നൽകി.
  alternative: നെഗറ്റീവ് ധ്വനി ഒഴിവാക്കാൻ ‘ആത്മവിശ്വാസം പ്രകടിപ്പിക്കുക’ എന്നു നൽകാം.
  rationale: പൗലൊസിന്റെ പ്രയോഗത്തിൽ καυχάομαι/καύχησις അഹങ്കാരത്തെ മാത്രമല്ല, മറ്റൊരാളെക്കുറിച്ചുള്ള ന്യായമായ അഭിമാനത്തെയും സൂചിപ്പിക്കാം. ശക്തമായ മൂലപദത്തെ മൃദൂകരിക്കാതെ സന്ദർഭം അതിന്റെ ന്യായത വ്യക്തമാക്കാൻ അനുവദിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പുകഴ്ത്തിപ്പറയുക/പുകഴ്ത്തിപ്പറച്ചിൽ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ക്രിയ–നാമ പദബന്ധം നിലനിർത്തുന്നു; ഏകവചനമായ ‘ഞാൻ’ എന്നതിൽനിന്ന് ബഹുവചനമായ ‘ഞങ്ങൾ’ എന്നതിലേക്കുള്ള മൂലവാചകത്തിലെ മാറ്റവും സംരക്ഷിച്ചു.
