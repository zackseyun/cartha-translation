reference: 2 Corinthians 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: ml
  text: അവന്റെ വരവിനാൽ[a] മാത്രമല്ല, നിങ്ങളെ സംബന്ധിച്ച് അവന് ലഭിച്ച ആശ്വാസത്താലും[b] ദൈവം ഞങ്ങളെ ആശ്വസിപ്പിച്ചു. നിങ്ങളെക്കുറിച്ചുള്ള നിങ്ങളുടെ വാഞ്ഛയും നിങ്ങളുടെ വിലാപവും എനിക്കുവേണ്ടിയുള്ള നിങ്ങളുടെ ഉത്സാഹവും അവൻ ഞങ്ങളോടു അറിയിച്ചപ്പോൾ ഞാൻ കൂടുതൽ സന്തോഷിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സാന്നിധ്യത്താൽ.”
    reason: lexical_alternative
  - marker: b
    text: “ആശ്വാസം,” “ആശ്വസിപ്പിച്ചു” എന്നിവയ്ക്കു പകരം യഥാക്രമം “പ്രോത്സാഹനം,” “പ്രോത്സാഹിപ്പിച്ചു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: വരവ്
  rationale: തീത്തൊസിന്റെ യാത്രയും എത്തിച്ചേരലും സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ സംഭവാർഥമുള്ള ‘വരവ്’ സ്വാഭാവികമാണ്; ‘സാന്നിധ്യം’ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: παρακλήσει / παρεκλήθη
  choice: ആശ്വാസം / ആശ്വസിച്ചു
  rationale: ഒരേ ധാതുവിൽനിന്നുള്ള നാമ-ക്രിയാ ബന്ധം മലയാളത്തിലും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ ദുഃഖശമനത്തിന്റെയും മാനസികബലത്തിന്റെയും ഭാവം ഉൾക്കൊള്ളുന്നു.
- source_word: ἐφ’ ὑμῖν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: തീത്തൊസിനു ലഭിച്ച ആശ്വാസത്തിന്റെ കാരണമോ അവസരമോ കൊരിന്ത്യരുമായി ബന്ധപ്പെട്ടതാണെന്ന വിശാലത നിലനിർത്തുന്നു; അവരാൽ നേരിട്ടു ആശ്വസിപ്പിക്കപ്പെട്ടു എന്നു അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀναγγέλλων
  choice: അവൻ ഞങ്ങളെ അറിയിച്ചപ്പോൾ
  rationale: വിവരം അറിയിച്ചതിനോടനുബന്ധിച്ചാണ് പൗലൊസിന്റെ വർധിച്ച സന്തോഷമെന്ന പങ്കുപദത്തിന്റെ സന്ദർഭബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπιπόθησιν
  choice: വാഞ്ഛ
  rationale: ശക്തമായ ആഗ്രഹത്തെയും കാണാനുള്ള കൊതിയെയും സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ὀδυρμόν
  choice: വിലാപം
  rationale: ഉള്ളിലെ ദുഃഖത്തോടൊപ്പം അതിന്റെ പ്രകടനവും സൂചിപ്പിക്കുന്നതിനാൽ ‘ദുഃഖം’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: ζῆλον
  choice: തീക്ഷ്ണത
  rationale: പൗലൊസിനുവേണ്ടിയുള്ള അവരുടെ തീവ്രമായ ഉത്സാഹവും കരുതലും ഉൾക്കൊള്ളുന്ന പദം.
- source_word: ὑπὲρ ἐμοῦ
  choice: എനിക്കായുള്ള
  rationale: പൗലൊസിനുവേണ്ടിയുള്ള പിന്തുണയോ കരുതലോ എന്ന വിശാലമായ ദിശാബോധം നിലനിർത്തുന്നു.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: ഞാൻ അതിലുമധികം സന്തോഷിച്ചു
  rationale: ഫലസൂചനയും μᾶλλον എന്ന താരതമ്യശക്തിയും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἐφ’ ὑμῖν എന്ന പ്രയോഗത്തിലെ ബന്ധം
  choice: നിങ്ങളെക്കുറിച്ച്
  alternative: നിങ്ങൾ നിമിത്തം / നിങ്ങളാൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം കാരണം, അവസരം, അല്ലെങ്കിൽ സംബന്ധം സൂചിപ്പിക്കാവുന്നതാണ്. ‘നിങ്ങളെക്കുറിച്ച്’ ബന്ധം തുറന്നുവെക്കുകയും തീത്തൊസിന്റെ ആശ്വാസത്തിന് കൊരിന്ത്യരുടെ പ്രതികരണമാണ് പശ്ചാത്തലമെന്ന് സന്ദർഭത്തിൽ ഗ്രഹിക്കാനിടവരുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ദീർഘവാക്യം അർഥബന്ധം നഷ്ടപ്പെടാതെ രണ്ട് വാക്യങ്ങളാക്കി; ആവർത്തിച്ചുള്ള ‘നിങ്ങളുടെ’ എന്ന ഘടന സാധ്യമായത്ര നിലനിർത്തി.
