id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: ml
  text: എന്നാൽ താഴ്ത്തപ്പെട്ടവരെ[a] ആശ്വസിപ്പിക്കുന്ന ദൈവം തീത്തോസിന്റെ വരവിലൂടെ[b] ഞങ്ങളെയും ആശ്വസിപ്പിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എളിയവരെ” അല്ലെങ്കിൽ “മനസ്സിടിഞ്ഞവരെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “തീത്തോസിന്റെ സാന്നിധ്യത്താൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ വിവരിച്ച കഷ്ടതയോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ὁ παρακαλῶν
  choice: ആശ്വസിപ്പിക്കുന്ന
  rationale: ദൈവത്തിന്റെ പതിവായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം; ഈ വാക്യത്തിലെ παρεκάλεσεν എന്ന ക്രിയയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: τοὺς ταπεινοὺς
  choice: താഴ്ത്തപ്പെട്ടവരെ
  rationale: സാഹചര്യങ്ങളാൽ താഴ്ന്ന നിലയിലായവരെയും മനസ്സിടിഞ്ഞവരെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പ്രയോഗം; വിനയശീലർ എന്ന അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- source_word: παρεκάλεσεν
  choice: ആശ്വസിപ്പിച്ചു
  rationale: കഷ്ടതയുടെ പശ്ചാത്തലത്തിൽ ലഭിച്ച ആശ്വാസമാണ് സന്ദർഭത്തിന് യോജിച്ചത്; παρακαλῶν എന്ന പദവുമായുള്ള ആവർത്തനബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ παρουσίᾳ
  choice: വരവിലൂടെ
  rationale: παρουσία ഇവിടെ തീത്തോസിന്റെ എത്തിച്ചേരൽ എന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്നു; ἐν എന്നത് ആ വരവ് ആശ്വാസത്തിന്റെ മാധ്യമമായിരുന്നുവെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: Τίτου
  choice: തീത്തോസിന്റെ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണവും ഷഷ്ഠീവ്യാകരണ രൂപവും.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: പ്രവർത്തിക്കുന്ന വ്യക്തിയായി ദൈവത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: τοὺς ταπεινοὺς എന്നതിന്റെ സന്ദർഭാർഥം
  choice: താഴ്ത്തപ്പെട്ടവരെ
  alternative: എളിയവരെ; മനസ്സിടിഞ്ഞവരെ
  rationale: ഗ്രീക്ക് പദത്തിന് താഴ്ന്ന നില, വിനയം, കഷ്ടതയാൽ മനസ്സിടിയൽ എന്നീ ആശയങ്ങൾ വഹിക്കാനാകും. സന്ദർഭം കഷ്ടതയെ സൂചിപ്പിച്ചാലും വികാരാവസ്ഥയിലേക്ക് മാത്രം അർഥം ചുരുക്കാതെ വിശാലത നിലനിർത്തുന്നു.
- issue: παρουσία എന്നതിന്റെ അർഥം
  choice: വരവ്
  alternative: സാന്നിധ്യം
  rationale: തീത്തോസ് എത്തിച്ചേർന്ന സംഭവമാണ് ഉടൻ വരുന്ന സന്ദർഭത്തിൽ പ്രധാനമെങ്കിലും, ഗ്രീക്ക് പദത്തിന് സാന്നിധ്യം എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. παρακαλέω എന്ന ഒരേ മൂലപദത്തിന്റെ രണ്ടു രൂപങ്ങൾക്കും “ആശ്വസിപ്പിക്കുക” ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
