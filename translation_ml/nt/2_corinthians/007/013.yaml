  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: ml
  text: അതുകൊണ്ട് ഞങ്ങൾ ആശ്വാസം പ്രാപിച്ചിരിക്കുന്നു.[a] ഞങ്ങൾക്കു ലഭിച്ച ആശ്വാസത്തിനുപുറമേ, തീത്തോസിന്റെ സന്തോഷത്തിൽ ഞങ്ങൾ അതിലും അധികമായി സന്തോഷിച്ചു; കാരണം, നിങ്ങളെല്ലാവരാലും അവന്റെ ആത്മാവ് നവോന്മേഷം പ്രാപിച്ചിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആശ്വാസം പ്രാപിച്ചിരിക്കുന്നു/ആശ്വാസം’ എന്നതിനുപകരം ‘പ്രോത്സാഹനം ലഭിച്ചിരിക്കുന്നു/പ്രോത്സാഹനം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ παρακαλέω, παράκλησις എന്നീ പദങ്ങൾക്ക് ഈ സന്ദർഭത്തിൽ രണ്ട് അർഥങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘അവന്റെ ആത്മാവ് നവോന്മേഷം പ്രാപിച്ചിരിക്കുന്നു’ എന്നതിനുപകരം ‘അവന്റെ ആത്മാവിനു വിശ്രമം ലഭിച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽനിന്നുള്ള കാരണപരവും നിഗമനപരവുമായ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρακεκλήμεθα
  choice: ഞങ്ങൾ ആശ്വാസം പ്രാപിച്ചിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണിരൂപം സൂചിപ്പിക്കുന്ന, മുമ്പുണ്ടായ ആശ്വാസത്തിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ആശ്വസിപ്പിക്കൽ എന്ന അർഥമാണ് മുൻനിരയിൽ.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: ഞങ്ങൾക്കു ലഭിച്ച ആശ്വാസത്തിനുപുറമേ
  rationale: സ്വന്തം ആശ്വാസത്തോടൊപ്പം അതിനെക്കാൾ കൂടിയ സന്തോഷവും ഉണ്ടായെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: παρακλήσει
  choice: ആശ്വാസം
  rationale: അതേ വാക്യത്തിലെ παρακεκλήμεθα എന്ന ക്രിയയോടുള്ള പദബന്ധം നിലനിർത്തുന്നു; ‘പ്രോത്സാഹനം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: περισσοτέρως μᾶλλον
  choice: അത്യധികം
  rationale: ഇരട്ട താരതമ്യപ്രയോഗത്തിന്റെ തീവ്രത അനാവശ്യമായ വാക്കുപെരുപ്പമില്ലാതെ പകർന്നു നൽകുന്നു.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: തീത്തോസിന്റെ സന്തോഷം നിമിത്തം ഞങ്ങൾ ... സന്തോഷിച്ചു
  rationale: തീത്തോസിന്റെ സന്തോഷമാണ് അവരുടെ വർധിച്ച സന്തോഷത്തിന്റെ അടിസ്ഥാനമെന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: ἀναπέπαυται
  choice: നവോന്മേഷം പകർന്നിരിക്കുന്നു
  rationale: മുമ്പുണ്ടായ പ്രവർത്തനത്തിന്റെ തുടരുന്ന ഫലാവസ്ഥയെയും മാനസിക ഉന്മേഷത്തെയും പൂർണ്ണകാലപ്രയോഗത്തിലൂടെ പകരുന്നു; ‘വിശ്രമം ലഭിച്ചിരിക്കുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: അവന്റെ മനസ്സ്
  rationale: ഇവിടെ πνεῦμα തീത്തോസിന്റെ ഉള്ളിലെ മാനസിക-വൈകാരിക നിലയെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധാരണ കുറയ്ക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരും ചേർന്ന്
  rationale: എല്ലാ കൊരിന്ത്യരും തീത്തോസിനു നവോന്മേഷം ലഭിച്ചതിന്റെ കാരണമായെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു; ‘എല്ലാവരും’ എന്ന സമഗ്രത നിലനിർത്തുന്നു.
theological_decisions:
- issue: തീത്തോസിനെക്കുറിച്ചുള്ള τὸ πνεῦμα αὐτοῦ എന്നതിന്റെ അർഥം
  choice: തീത്തോസിന്റെ സ്വന്തം മനസ്സ് അഥവാ ആന്തരിക നില
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: αὐτοῦ എന്ന ഉടമസ്ഥസർവനാമവും തീത്തോസിന്റെ സന്തോഷത്തെയും ആശ്വാസത്തെയും കുറിച്ചുള്ള സന്ദർഭവും ഇത് അവന്റെ മാനുഷികമായ ആന്തരിക നിലയെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് കാണിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘തീത്തോസ്’ എന്ന രൂപം ഗ്രീക്ക് Τίτος-നോട് അടുത്തതാണ്. ആശ്വാസം/പ്രോത്സാഹനം എന്ന യഥാർഥ പദാർഥവ്യാപ്തിയും നവോന്മേഷം/വിശ്രമം എന്ന വ്യത്യാസവും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
