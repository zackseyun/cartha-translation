  to: അതുകൊണ്ട് ഞങ്ങൾ ആശ്വാസം പ്രാപിച്ചിരിക്കുന്നു.[a] ഞങ്ങൾക്കു ലഭിച്ച ആശ്വാസത്തിനുപുറമേ, തീത്തോസിന്റെ സന്തോഷത്തിൽ ഞങ്ങൾ അതിലും അധികമായി സന്തോഷിച്ചു; കാരണം, നിങ്ങളെല്ലാവരാലും അവന്റെ ആത്മാവ് നവോന്മേഷം പ്രാപിച്ചിരിക്കുന്നു.[b]
