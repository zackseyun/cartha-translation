id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: ml
  text: അതിനാൽ, ഞാൻ നിങ്ങൾക്കു എഴുതിയെങ്കിലും, അത് അന്യായം ചെയ്തവന്റെ നിമിത്തമോ അന്യായം അനുഭവിച്ചവന്റെ നിമിത്തമോ ആയിരുന്നില്ല; മറിച്ച്, ഞങ്ങളോടുള്ള നിങ്ങളുടെ ആത്മാർഥത ദൈവസന്നിധിയിൽ നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടേണ്ടതിനായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “നിങ്ങളോടുള്ള ഞങ്ങളുടെ ആത്മാർഥത ദൈവസന്നിധിയിൽ നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടേണ്ടതിന്.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: അതുകൊണ്ട്, ... എഴുതിയെങ്കിലും
  rationale: ἄραയുടെ നിഗമനസൂചന ‘അതുകൊണ്ട്’ എന്നും εἰ καίയുടെ concessive ഭാവം ‘എഴുതിയെങ്കിലും’ എന്നും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔγραψα ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതിയെങ്കിലും
  rationale: മുമ്പ് എഴുതിയ കത്തിനെ സൂചിപ്പിക്കുന്ന aorist ക്രിയയെ ഭൂതകാലരൂപത്തിൽ നൽകുന്നു.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: അത് അന്യായം ചെയ്തവനെപ്രതി ... ആയിരുന്നില്ല
  rationale: ἕνεκεν എന്നതിന്റെ കാരണം/ലക്ഷ്യം സംബന്ധിച്ച അർഥം ‘-നെപ്രതി’ കൊണ്ട് നൽകുകയും substantival participle വ്യക്തിപരമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: അന്യായം അനുഭവിച്ചവനെപ്രതിയോ
  rationale: passive participle-ന്റെ ഭാവം ‘അന്യായം അനുഭവിച്ചവൻ’ എന്ന് വ്യക്തമാക്കുകയും മുൻവാക്യാംശത്തോടുള്ള സമാന്തരത പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: മറിച്ച്, ... വെളിപ്പെടേണ്ടതിനായിരുന്നു
  rationale: articular infinitive-ന്റെ ലക്ഷ്യഭാവവും φανερωθῆναιയുടെ passive അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: നിങ്ങളുടെ ആത്മാർഥത
  rationale: σπουδή സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള താത്പര്യം, ഉത്സാഹം, കരുതൽ എന്നിവയെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘ആത്മാർഥത’ ഉൾക്കൊള്ളിക്കുന്നു.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: ഞങ്ങളോടുള്ള
  rationale: പൗലോസിനോടും സഹപ്രവർത്തകരോടുമുള്ള അവരുടെ അനുകൂലമായ മനോഭാവവും കരുതലും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ദുഷ്കരമായ ഘടനയിൽ πρός എന്നതിനെ സമൂഹത്തിനുള്ളിലെ വെളിപ്പെടലായി ഗ്രഹിക്കുന്നു; പാഠത്തിന്റെ ആശയക്കുഴപ്പം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യവും സാക്ഷിത്വവും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ പ്രയോഗം.
theological_decisions:
- issue: ‘നിങ്ങളുടെ ആത്മാർഥത ... നിങ്ങളുടെ ഇടയിൽ’ എന്ന ദുഷ്കരമായ വാക്യഘടനയുടെ അർഥം
  choice: അച്ചടിച്ച SBLGNT പാഠം പിന്തുടർന്ന്, കൊരിന്ത്യരുടെ ഞങ്ങളോടുള്ള ആത്മാർഥത അവരുടെ ഇടയിൽ ദൈവസന്നിധിയിൽ വെളിപ്പെടുക എന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിങ്ങളോടുള്ള ഞങ്ങളുടെ ആത്മാർഥത നിങ്ങളുടെ ഇടയിൽ ദൈവസന്നിധിയിൽ വെളിപ്പെടേണ്ടതിന്’ എന്ന പാഠഭേദം.
  rationale: SBLGNTയിലെ τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν എന്നത് ‘ഞങ്ങളോടുള്ള നിങ്ങളുടെ ആത്മാർഥത’യെ പിന്തുണയ്ക്കുന്നു. ‘നിങ്ങളോടുള്ള ഞങ്ങളുടെ ആത്മാർഥത’ എന്ന പ്രധാന പാഠഭേദം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
- issue: കത്ത് എഴുതിയതിന്റെ ഉദ്ദേശ്യം കുറ്റം ചെയ്തവനെയോ അന്യായം അനുഭവിച്ചവനെയോ കുറിച്ചല്ലെന്ന പ്രസ്താവന
  choice: ‘അവരെപ്രതി ആയിരുന്നില്ല’ എന്ന് നേരിട്ട് നിലനിർത്തി.
  alternative: അവരുടെ കാര്യത്തിന് യാതൊരു പ്രാധാന്യവും ഇല്ലായിരുന്നു എന്ന വിശദീകരണപരമായ വായന.
  rationale: വാക്യം കത്തിന്റെ ലക്ഷ്യത്തെ വിരുദ്ധഘടനയിൽ അവതരിപ്പിക്കുന്നു; ബന്ധപ്പെട്ട വ്യക്തികളുടെ പ്രാധാന്യം പൂർണമായി നിഷേധിക്കുന്നതായി അതിനെ വികസിപ്പിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, വായിക്കാൻ എളുപ്പവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘അന്യായം ചെയ്തവൻ/അനുഭവിച്ചവൻ’ എന്ന സമാന്തരരൂപം ഗ്രീക്ക് participle-കളുടെ ബന്ധം കാത്തുസൂക്ഷിക്കുന്നു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ചതുരക്കൊളുത്തിൽ നൽകിയിരിക്കുന്നു.
