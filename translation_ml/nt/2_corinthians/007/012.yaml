revisions:
- from: അതുകൊണ്ട്, ഞാൻ നിങ്ങൾക്ക് എഴുതിയെങ്കിലും, അത് അന്യായം ചെയ്തവനെപ്രതിയോ അന്യായം അനുഭവിച്ചവനെപ്രതിയോ ആയിരുന്നില്ല; മറിച്ച്, ഞങ്ങളോടുള്ള നിങ്ങളുടെ ആത്മാർഥത ദൈവസന്നിധിയിൽ നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടേണ്ടതിനായിരുന്നു.[a]
  to: അതിനാൽ, ഞാൻ നിങ്ങൾക്കു എഴുതിയെങ്കിലും, അത് അന്യായം ചെയ്തവന്റെ നിമിത്തമോ അന്യായം അനുഭവിച്ചവന്റെ നിമിത്തമോ ആയിരുന്നില്ല; മറിച്ച്, ഞങ്ങളോടുള്ള നിങ്ങളുടെ ആത്മാർഥത ദൈവസന്നിധിയിൽ നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടേണ്ടതിനായിരുന്നു.[a]
