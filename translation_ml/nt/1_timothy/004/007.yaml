source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: ml
  text: എന്നാൽ അവിശുദ്ധവും വയോധികസ്ത്രീകളുടേതുപോലെയുള്ളതുമായ കെട്ടുകഥകൾ[a] നിരസിക്കുക; ദൈവഭക്തിക്കായി സ്വയം പരിശീലിപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘വയോധികസ്ത്രീകൾക്കു സ്വഭാവികമായ കെട്ടുകഥകൾ.’ ഇത് ഗ്രീക്കിലെ നിന്ദാസൂചകമായ ഒരു പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: വിശുദ്ധമല്ലാത്ത
  rationale: വിശുദ്ധമായതിനോടുള്ള വിപരീതത സൂചിപ്പിക്കുന്ന βέβηλος എന്ന പദത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘ദൈവരഹിതമായ’ എന്നതിനെക്കാൾ കൃത്യമായി sacred/profane വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: γραώδεις
  choice: വയോധികസ്ത്രീകളുടെ കഥകൾപോലെയുള്ള
  rationale: ‘വയോധികസ്ത്രീകൾക്കു സ്വഭാവികമായ’ എന്ന നിന്ദാസൂചകമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പ്രത്യേക ദൃശ്യവും മൂർച്ചയും പൂർണമായി മായ്ച്ചുകളയാതെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന രീതിയിൽ നൽകുന്നു.
- source_word: μύθους
  choice: കെട്ടുകഥകൾ
  rationale: ഇവിടെ μῦθος സാങ്കൽപ്പികമോ അടിസ്ഥാനരഹിതമോ ആയ കഥകളെ സൂചിപ്പിക്കുന്നു; ‘കെട്ടുകഥകൾ’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: παραιτοῦ
  choice: തള്ളിക്കളയുക
  rationale: മധ്യമരൂപത്തിലുള്ള ആജ്ഞയുടെ നിരസിക്കുക/ഒഴിവാക്കുക എന്ന ശക്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γύμναζε
  choice: പരിശീലിക്കുക
  rationale: കായികപരിശീലനത്തിന്റെ രൂപകം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു.
- source_word: σεαυτόν
  choice: സ്വയം
  rationale: തിമൊഥെയൊസ് തന്നെയാണ് പരിശീലനത്തിന്റെ കർമമെന്ന് പ്രതിഫലക സർവനാമം നേരിട്ട് വ്യക്തമാക്കുന്നു.
- source_word: πρὸς εὐσέβειαν
  choice: ദൈവഭക്തി ലക്ഷ്യമാക്കി
  rationale: πρός ഇവിടെ ലക്ഷ്യം/ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; εὐσέβεια ദൈവത്തെ ആദരിച്ചുകൊണ്ടുള്ള ജീവിതത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ദൈവഭക്തി’ ഉചിതമാണ്.
- source_word: δὲ ... δὲ
  choice: എന്നാൽ ... ;
  rationale: ആദ്യ δέ മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ എന്നു വ്യക്തമാക്കുന്നു; രണ്ടാമത്തേത് വിരുദ്ധമായ സകാരാത്മക ആജ്ഞയിലേക്കുള്ള മാറൽ അർധവിരാമത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: γραώδεις μύθους എന്ന നിന്ദാസൂചക പ്രയോഗത്തിന്റെ വിവർത്തനം
  choice: ‘വയോധികസ്ത്രീകളുടെ കഥകൾപോലെയുള്ളതുമായ കെട്ടുകഥകൾ’ എന്ന് മുഖ്യപാഠത്തിൽ പ്രത്യേക ദൃശ്യവും നിന്ദാസൂചനയും നിലനിർത്തുക.
  alternative: ‘വൃദ്ധസ്ത്രീകളുടെ കഥകൾ’ അല്ലെങ്കിൽ ‘വിഡ്ഢിത്തം നിറഞ്ഞ കെട്ടുകഥകൾ’
  rationale: ‘വിഡ്ഢിത്തം നിറഞ്ഞ’ എന്ന മൃദൂകരണം മൂലപാഠത്തിലെ സ്ത്രീ-വയസ്സ് സംബന്ധമായ സാംസ്കാരിക ദൃശ്യം ഇല്ലാതാക്കും. അതേസമയം പദാനുപദമായി ‘വയോധികസ്ത്രീസദൃശമായ’ എന്നു പറയുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാണ്. തിരഞ്ഞെടുത്ത രൂപം മൂലത്തിന്റെ പ്രത്യേകതയും മലയാളത്തിന്റെ സ്വാഭാവികതയും തുലനം ചെയ്യുന്നു; കൂടുതൽ നേരിട്ടുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം. ‘വയോധികസ്ത്രീകളുടെ കഥകൾപോലെയുള്ള’ എന്ന പ്രയോഗം അസാധാരണമായിരുന്നാലും മൂലഗ്രീക്കിലെ സാംസ്കാരികമായി അടയാളപ്പെടുത്തിയ നിന്ദാസൂചന മറച്ചുവയ്ക്കാതെ വായനാസൗകര്യം നിലനിർത്തുന്നു.
