id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: ml
  text: നിന്റെ ചെറുപ്പത്തെ ആരും നിസ്സാരമായി കാണരുത്. പകരം, വിശ്വാസികൾക്കു സംസാരത്തിൽ, പെരുമാറ്റത്തിൽ, സ്നേഹത്തിൽ, വിശ്വാസത്തിൽ[a], നിർമലതയിൽ ഒരു മാതൃകയായിരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിശ്വസ്തതയിൽ.” ഈ സന്ദർഭത്തിൽ ഗ്രീക്കുപദത്തിന് വിശ്വാസം എന്നോ വിശ്വസ്തത എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: ആരും ... നിസ്സാരമായി കാണാൻ ഇടവരുത്തരുത്
  rationale: ഗ്രീക്കിലെ മൂന്നാംപുരുഷ വർത്തമാനകാല ആജ്ഞാരൂപം ഒരു നിരോധനാത്മക പ്രബോധനമാണ്. മലയാളത്തിൽ സ്വാഭാവികമായി അതിന്റെ ആജ്ഞാശക്തി പ്രകടമാക്കുകയും, καταφρονέω എന്നതിലെ അവജ്ഞയോടെ താഴ്ത്തിക്കാണുന്ന സാമൂഹിക ഭാവം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: σου τῆς νεότητος
  choice: നിന്റെ ചെറുപ്പത്തെ
  rationale: νεότης ഇവിടെ പ്രായപരമായ ചെറുപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: ἀλλὰ
  choice: പകരം
  rationale: മുൻ നിരോധനത്തിന് വിപരീതമായി തിമൊഥെയൊസ് ചെയ്യേണ്ട കാര്യം അവതരിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: τύπος γίνου
  choice: മാതൃകയായിരിക്കുക
  rationale: τύπος അനുകരിക്കാവുന്ന മാതൃകയെയും γίνου അതായിരിക്കാനുള്ള തുടർച്ചയായ ആഹ്വാനത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: τῶν πιστῶν
  choice: വിശ്വാസികൾക്കു
  rationale: തിമൊഥെയൊസ് മാതൃകയാകേണ്ട സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് മലയാളത്തിൽ ലക്ഷ്യാർഥകമായ ദത്തിവിഭക്തിയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν λόγῳ
  choice: സംസാരത്തിൽ
  rationale: λόγος ഇവിടെ സംസാരിക്കുന്ന രീതിയെയോ പറയുന്ന കാര്യങ്ങളെയോ സൂചിപ്പിക്കുന്നു; പട്ടികയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പദം.
- source_word: ἐν ἀναστροφῇ
  choice: പെരുമാറ്റത്തിൽ
  rationale: ἀναστροφή ജീവിതനടത്തത്തെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക പ്രയോഗം.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: ἀγάπη എന്നതിന്റെ സാധാരണവും വിശാലവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐν πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: πίστις എന്ന പദത്തിന്റെ വിശ്വാസം എന്ന അർഥം മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുന്നു; ഈ സദ്ഗുണപ്പട്ടികയിൽ സാധ്യമായ വിശ്വസ്തത എന്ന അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ἁγνείᾳ
  choice: നിർമലതയിൽ
  rationale: ἁγνεία ധാർമികവും ലൈംഗികവുമായ ശുദ്ധിയെ ഉൾക്കൊള്ളാം. 'നിർമലത' അതിനെ അനാവശ്യമായി ഒരു മേഖലയിൽ മാത്രം പരിമിതപ്പെടുത്താതെ വിശാലത സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: സദ്ഗുണപ്പട്ടികയിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിലുള്ള വിശ്വാസമോ വിശ്വസ്തമായ സ്വഭാവമോ ഉദ്ദേശിക്കാം. മുഖ്യപാഠത്തിൽ സാധാരണ പരിഭാഷയായ 'വിശ്വാസം' നൽകി, യഥാർഥമായ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആവർത്തിക്കുന്ന ἐν ഘടന ഓരോ പട്ടികാംഗത്തിലും '-ത്തിൽ' ഉപയോഗിച്ച് നിലനിർത്തി; വാക്യം കൃത്രിമമാകാതിരിക്കാൻ സ്വാഭാവിക മലയാള പദക്രമം സ്വീകരിച്ചു.
