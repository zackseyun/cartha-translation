revisions:
- from: നിന്റെ ചെറുപ്പത്തെ ആരും നിസ്സാരമായി കാണാൻ ഇടവരുത്തരുത്. പകരം, സംസാരത്തിൽ, പെരുമാറ്റത്തിൽ, സ്നേഹത്തിൽ, വിശ്വാസത്തിൽ[a], നിർമലതയിൽ വിശ്വാസികൾക്കു മാതൃകയായിരിക്കുക.
  to: നിന്റെ ചെറുപ്പത്തെ ആരും നിസ്സാരമായി കാണരുത്. പകരം, വിശ്വാസികൾക്കു സംസാരത്തിൽ, പെരുമാറ്റത്തിൽ, സ്നേഹത്തിൽ, വിശ്വാസത്തിൽ[a], നിർമലതയിൽ ഒരു മാതൃകയായിരിക്കുക.
  rationale: The revision removes the slight added causative nuance in the opening and improves idiomatic Malayalam with «ഒരു മാതൃകയായിരിക്കുക». It retains the source sequence more closely by placing the believers before the list, while preserving every semantic element and the footnoted ambiguity of πίστις.
