reference: 1 Timothy 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: ml
  text: കാരണം, ദൈവവചനത്താലും പ്രാർഥനയാലും അത് വിശുദ്ധീകരിക്കപ്പെടുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വിശുദ്ധമാക്കപ്പെടുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: “പ്രാർഥന” എന്നതിന് “അപേക്ഷ” എന്നോ “മധ്യസ്ഥപ്രാർഥന” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: വിശുദ്ധീകരിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു; മുൻവാക്യത്തിൽ പറഞ്ഞ ഭക്ഷണമാണ് ഇവിടെ സൂചിപ്പിക്കപ്പെടുന്നത്. മതസാങ്കേതിക അർഥം അനാവശ്യമായി ചുരുക്കാതെ, വിശുദ്ധമായി വേർതിരിക്കപ്പെടുന്നു എന്ന ആശയം സംരക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ
  choice: -ത്താലും / -യാലും
  rationale: ഷഷ്ഠീവിഭക്തിയോടുകൂടിയ διά ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ കരണം സൂചിപ്പിക്കുന്ന ഈ രൂപങ്ങൾ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λόγου θεοῦ
  choice: ദൈവവചനം
  rationale: ദൈവത്തിന്റെ വചനം എന്ന ജനിറ്റീവ് ബന്ധം സംക്ഷിപ്തവും പരിചിതവുമായി നൽകുന്നു; ഇത് തിരുവെഴുത്തിലെ പ്രഖ്യാപനമാണോ സൃഷ്ടിയിലെ ദൈവപ്രഖ്യാപനമാണോ ദൈവിക അനുമതിയാണോ എന്ന് വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
- source_word: ἐντεύξεως
  choice: പ്രാർഥന
  rationale: ഈ പദത്തിന് അപേക്ഷയുടെയോ മധ്യസ്ഥപ്രാർഥനയുടെയോ പ്രത്യേക സൂചന ഉണ്ടാകാമെങ്കിലും, ഭക്ഷണം നന്ദിയോടെ സ്വീകരിക്കുന്ന സന്ദർഭത്തിൽ വിശാലമായ ‘പ്രാർഥന’ സ്വാഭാവികമാണ്; കൂടുതൽ പ്രത്യേകമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ വിശുദ്ധീകരണഭാഷയുടെ വ്യാപ്തി
  choice: ഭക്ഷണം ഉപയോഗത്തിനായി വിശുദ്ധമായി വേർതിരിക്കപ്പെടുന്നതായി വാക്യം പറയുന്നു; ‘വിശുദ്ധീകരിക്കപ്പെടുന്നു’ എന്ന ഭാഷ അതേപടി നിലനിർത്തുന്നു.
  alternative: ഇത് കൂടുതൽ പൊതുവായ മതപരമായ അർഥത്തിൽ ‘വിശുദ്ധമാക്കപ്പെടുന്നു’ എന്നു വായിക്കാം.
  rationale: 1 തിമൊഥെയൊസ് 4:3-4-ലെ ഉടൻമുമ്പുള്ള സന്ദർഭം നന്ദിയോടെ സ്വീകരിക്കുന്ന ഭക്ഷണത്തെക്കുറിച്ചാണ്. വിവർത്തനം ധാർമികശുദ്ധീകരണമോ രക്ഷയോ കൂദാശാസംബന്ധിയായ പ്രത്യേക അവകാശവാദമോ ചേർക്കാതെ, മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാഷയും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ദൈവവചനം’, ‘വിശുദ്ധീകരിക്കപ്പെടുന്നു’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു.
