  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: ml
  text: നിന്നെത്തന്നെയും ഉപദേശത്തെയും സൂക്ഷ്മമായി ശ്രദ്ധിക്കുക; ഇവയിൽ ഉറച്ചുനിൽക്കുക[a]. ഇങ്ങനെ ചെയ്യുന്നതിലൂടെ നീ നിന്നെത്തന്നെയും നിന്നെ കേൾക്കുന്നവരെയും രക്ഷിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവയിൽ തുടരുക’ അല്ലെങ്കിൽ ‘ഇവയിൽ സ്ഥിരമായി നിലനിൽക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കാത്തുസൂക്ഷിക്കും.’ ഗ്രീക്കിലെ ‘രക്ഷിക്കുക’ എന്ന പദം സന്ദർഭമനുസരിച്ച് വിടുതൽ, സംരക്ഷണം, അല്ലെങ്കിൽ രക്ഷ എന്നിവ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: സൂക്ഷ്മമായി ശ്രദ്ധിക്കുക
  rationale: ഈ ആജ്ഞ ക്ഷണികമായ ശ്രദ്ധയല്ല, തുടർച്ചയായ സൂക്ഷ്മശ്രദ്ധയും ജാഗ്രതയും ആവശ്യപ്പെടുന്നു. ആ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം നൽകുന്നു.
- source_word: σεαυτῷ
  choice: നിന്നെയും
  rationale: ἔπεχε എന്ന ക്രിയയുടെ ശ്രദ്ധാവിഷയമാണ് ഈ ആത്മവാചക സർവനാമം. മലയാളത്തിലെ സംയുക്തവാക്യത്തിൽ ‘നിന്നെയും … ഉപദേശത്തെയും ശ്രദ്ധിക്കുക’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τῇ διδασκαλίᾳ
  choice: ഉപദേശത്തെയും
  rationale: διδασκαλία പഠിപ്പിക്കുന്ന പ്രവൃത്തിയെയോ അതിന്റെ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ ‘ഉപദേശം’ ഈ ഇരുവശവും അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുകയും ‘സിദ്ധാന്തം’ എന്നതിനേക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാകുകയും ചെയ്യുന്നു.
- source_word: ἐπίμενε αὐτοῖς
  choice: അവയിൽ ഉറച്ചുനിൽക്കുക
  rationale: ക്രിയ തുടർച്ചയും സ്ഥിരോത്സാഹവും സൂചിപ്പിക്കുന്നു; ബഹുവചന സർവനാമം മുമ്പു പറഞ്ഞ സ്വയംശ്രദ്ധയെയും ഉപദേശത്തോടുള്ള ശ്രദ്ധയെയും ഒരുമിച്ച് പരാമർശിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. ‘ഉറച്ചുനിൽക്കുക’ സ്ഥിരതയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ഇങ്ങനെ ചെയ്യുന്നതിലൂടെ
  rationale: വർത്തമാന കൃദന്തഘടന ഇവിടെ മാർഗമോ അനുബന്ധ സാഹചര്യവോ സൂചിപ്പിക്കുന്നു. ‘ചെയ്യുന്നതിലൂടെ’ അതിന്റെ ഉപാധിപരമായ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σώσεις
  choice: രക്ഷിക്കും
  rationale: σῴζω എന്നതിന്റെ പ്രാഥമികവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ അർഥം നിലനിർത്തുന്നു; അതിനെ കേവലം ഭൗതിക സംരക്ഷണമെന്നോ അന്ത്യകാല രക്ഷയെന്നോ വിവർത്തനം തന്നെ ചുരുക്കുന്നില്ല.
- source_word: τοὺς ἀκούοντάς σου
  choice: നിന്നെ കേൾക്കുന്നവരെയും
  rationale: വർത്തമാന കൃദന്തം തിമൊഥെയൊസിനെ തുടർച്ചയായി കേൾക്കുന്നവരെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം മൂലപാഠത്തിന്റെ ലാഘവവും തുടരുന്ന ശ്രവണത്തിന്റെ ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഇടയശുശ്രൂഷാസംബന്ധിയായ ഈ പ്രബോധനത്തിൽ ‘രക്ഷിക്കും’ എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘രക്ഷിക്കും’ എന്നു നിലനിർത്തി, അതിനെ നിത്യരക്ഷയിലേക്കു മാത്രം ചുരുക്കാതെയും കേവല സംരക്ഷണമായി ദുർബലപ്പെടുത്താതെയും വിടുന്നു.
  alternative: ‘കാത്തുസൂക്ഷിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തി പ്രായോഗികമോ ആത്മീയമോ ആയ സംരക്ഷണത്തിന് ഊന്നൽ നൽകാം.
  rationale: ഈ വാക്യം തിമൊഥെയൊസിന്റെ ജീവിതത്തിലും ഉപദേശത്തിലും ഉള്ള സ്ഥിരതയെ അവന്റെയും ശ്രോതാക്കളുടെയും രക്ഷയുമായി ബന്ധിപ്പിക്കുന്നു. ഇത് സ്വയം സമ്പാദിക്കുന്ന രക്ഷയാണെന്ന് പാഠം പറയുന്നില്ല; അതേസമയം വിശ്വസ്തമായ സ്ഥിരതയിലൂടെയും ഉപദേശത്തിലൂടെയും പ്രവർത്തിക്കുന്ന ദൈവത്തിന്റെ രക്ഷയെക്കുറിച്ചുള്ള പാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം വിവർത്തനം നിലനിർത്തണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. ‘ഉപദേശം’, ‘ഉറച്ചുനിൽക്കുക’, ‘രക്ഷിക്കും’ എന്നീ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ തിരഞ്ഞെടുത്തു; സഭാപരമായ സാങ്കേതികപദങ്ങളും പ്രത്യേക സഭാവിഭാഗത്തിന്റെ വ്യാഖ്യാനവും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
