    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “വിവാഹം കഴിക്കുന്നത് വിലക്കുകയും ഭക്ഷണങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കുകയും.” ഭക്ഷണങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കാൻ അവർ മറ്റുള്ളവരോട് ആവശ്യപ്പെടുന്നു എന്ന സൂചിതമായ അർഥമാണ് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയിരിക്കുന്നത്.'
