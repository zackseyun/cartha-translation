revisions:
- from: വിവാഹം കഴിക്കുന്നത് വിലക്കുകയും ചില ഭക്ഷണങ്ങൾ വർജിക്കണമെന്ന് ആവശ്യപ്പെടുകയും ചെയ്യുന്നവരാണ് അവർ. വിശ്വസിക്കുകയും സത്യം അറിഞ്ഞിരിക്കുകയും ചെയ്യുന്നവർ നന്ദിയോടെ സ്വീകരിക്കാനാണ് ദൈവം ആ ഭക്ഷണങ്ങൾ സൃഷ്ടിച്ചത്.[a]
  to: വിവാഹം കഴിക്കുന്നത് വിലക്കുകയും ഭക്ഷണങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കാൻ ആവശ്യപ്പെടുകയും ചെയ്യുന്നവരാണ് അവർ. വിശ്വസിക്കുകയും സത്യം അറിഞ്ഞിട്ടുള്ളവരും നന്ദിയോടെ സ്വീകരിക്കേണ്ടതിനായി ദൈവം സൃഷ്ടിച്ച ഭക്ഷണങ്ങളാണ് അവ.
