id: 1TI.4.3
reference: 1 Timothy 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: ml
  text: വിവാഹം കഴിക്കുന്നത് വിലക്കുകയും ഭക്ഷണങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കാൻ ആവശ്യപ്പെടുകയും ചെയ്യുന്നവരാണ് അവർ. വിശ്വസിക്കുകയും സത്യം അറിഞ്ഞിട്ടുള്ളവരും നന്ദിയോടെ സ്വീകരിക്കേണ്ടതിനായി ദൈവം സൃഷ്ടിച്ച ഭക്ഷണങ്ങളാണ് അവ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κωλυόντων
  choice: വിലക്കുകയും
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച വിവരണത്തെ തുടരുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ നിരോധനാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γαμεῖν
  choice: വിവാഹം കഴിക്കുന്നത്
  rationale: ഇൻഫിനിറ്റീവിന്റെ ‘വിവാഹം കഴിക്കുക’ എന്ന പ്രവർത്തനാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ നാമവൽക്കൃത രൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἀπέχεσθαι βρωμάτων
  choice: ചില ഭക്ഷണങ്ങൾ വർജിക്കണമെന്ന് ആവശ്യപ്പെടുകയും
  rationale: ἀπέχεσθαι എന്നതിന് ‘വർജിക്കുക’ എന്നും βρωμάτων എന്ന ബഹുവചനത്തിന് ‘ഭക്ഷണങ്ങൾ’ എന്നും നൽകുന്നു; κωλυόντων-നോട് അസൗകര്യകരമായി ചേർന്നിരിക്കുന്ന ഗ്രീക്ക് ഘടനയിൽ സൂചിതമായ നിർദേശാർഥം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘ചില’ എന്നത് എല്ലാ ഭക്ഷണവും അല്ല, ചില ഭക്ഷണവിഭാഗങ്ങളാണ് ഉദ്ദേശ്യമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἔκτισεν
  choice: സൃഷ്ടിച്ചത്
  rationale: κτίζωയിലെ സൃഷ്ടിഭാഷയും ദൈവമാണ് കർത്താവ് എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: εἰς μετάλημψιν
  choice: സ്വീകരിക്കാനാണ്
  rationale: ഭക്ഷണം പങ്കെടുത്ത് അനുഭവിക്കുകയോ കഴിക്കുകയോ ചെയ്യുക എന്ന ലക്ഷ്യാർഥം സാധാരണ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μετὰ εὐχαριστίας
  choice: നന്ദിയോടെ
  rationale: ദൈവത്തോടുള്ള നന്ദിയോടുകൂടിയ സ്വീകരണത്തെ ചുരുക്കവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοῖς πιστοῖς
  choice: വിശ്വസിക്കുകയും
  rationale: ഇവിടെ πιστοῖς എന്നത് ‘വിശ്വസ്തർ’ എന്നതിലുപരി വിശ്വസിക്കുന്നവരെ സൂചിപ്പിക്കുന്നതിനാൽ ക്രിയാത്മക അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: സത്യം അറിഞ്ഞിരിക്കുകയും ചെയ്യുന്നവർ
  rationale: പൂർണ്ണകാല കൃദന്തം സൂചിപ്പിക്കുന്ന, അറിവിലേക്കെത്തി ഇപ്പോഴും ആ നിലയിൽ തുടരുന്ന അവസ്ഥ ‘അറിഞ്ഞിരിക്കുന്നു’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν ഒരേ കൂട്ടത്തെയോ രണ്ടു കൂട്ടങ്ങളെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: വിശ്വസിക്കുകയും സത്യം അറിഞ്ഞിരിക്കുകയും ചെയ്യുന്ന ഒരേ കൂട്ടം
  alternative: വിശ്വാസികളും സത്യം അറിഞ്ഞവരും എന്ന രണ്ടു കൂട്ടങ്ങൾ
  rationale: ഒരേ നിർദേശകഘടകത്തിനുകീഴിൽ καίകൊണ്ട് ബന്ധിപ്പിച്ച വിശേഷണ/കൃദന്തരൂപങ്ങൾ ഒരേ ആളുകളെ രണ്ടു സവിശേഷതകളാൽ വിവരിക്കുന്നതാണ് വ്യാകരണപരമായി കൂടുതൽ സ്വാഭാവികം.
- issue: ἀπέχεσθαι എന്ന ഇൻഫിനിറ്റീവിന് κωλυόντων എങ്ങനെ ബാധകമാകുന്നു
  choice: വ്യാജോപദേശകർ ചില ഭക്ഷണങ്ങൾ വർജിക്കാൻ ആവശ്യപ്പെടുന്നു എന്ന സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി
  alternative: അക്ഷരാർഥത്തിൽ ‘വിവാഹം കഴിക്കുന്നത് വിലക്കുകയും ഭക്ഷണങ്ങൾ വർജിക്കുകയും’ എന്ന അവ്യക്തമായ ഘടന
  rationale: ഗ്രീക്ക് വാക്യഘടന സംക്ഷിപ്തവും അസമവുമാണ്; സന്ദർഭം ഭക്ഷണവർജനം അവർ മറ്റുള്ളവരോട് നിർദേശിച്ചതാണെന്ന് കാണിക്കുന്നു. യഥാർഥ ഘടനാപരമായ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘വർജിക്കുക’, ‘സൃഷ്ടിക്കുക’ എന്നീ പദങ്ങൾ ഗൗരവവും മൂലഭാഷയിലെ ആശയവും നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ദീർഘവാക്യഘടന മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ടു വാക്യങ്ങളാക്കി.
