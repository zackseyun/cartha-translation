id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: ml
  text: നിന്നിലുള്ള കൃപാവരം അവഗണിക്കരുത്. പ്രവചനത്തിലൂടെ[b], മൂപ്പന്മാരുടെ സംഘത്തിന്റെ കൈവെപ്പോടുകൂടെ[a], അത് നിനക്കു നൽകപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മൂപ്പന്മാരുടെ സമിതി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം മൂപ്പന്മാരുടെ കൂട്ടായ സംഘത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രവചനവചനത്തിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. വരം നൽകപ്പെട്ടപ്പോൾ പ്രവചനം അതിനോടൊപ്പം ഉണ്ടായിരുന്നുവെന്നോ അതിന് മാധ്യമമായിരുന്നുവെന്നോ ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: അവഗണിക്കരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞാരൂപം തുടരുന്ന അശ്രദ്ധയെയോ അവഗണനയെയോ വിലക്കുന്നു. ‘അവഗണിക്കരുത്’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: χάρισμα
  choice: കൃപാവരം
  rationale: χάρισμα കൃപയായി ലഭിക്കുന്ന വരത്തെ സൂചിപ്പിക്കുന്നു. ‘കൃപാവരം’ മൂലപദത്തിലെ കൃപാസംബന്ധം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സാധ്യതയുള്ള ശുശ്രൂഷാസംബന്ധമായ പ്രത്യേകത അതിലേർപ്പെടുത്തുന്നില്ല.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: നിന്നിലുള്ള കൃപാവരം
  rationale: ἐν σοὶ എന്നത് വരം തിമൊഥെയൊസിൽ ‘ഉള്ളത്’ എന്നു വ്യക്തമായി പറയുന്നു. വെറും ‘നിന്റെ വരം’ എന്ന ഉടമസ്ഥപ്രയോഗത്തേക്കാൾ ഇത് മൂലഘടനയെ നന്നായി സൂക്ഷിക്കുന്നു.
- source_word: ἐδόθη σοι
  choice: നിനക്കു നൽകപ്പെട്ടു
  rationale: കർമണിപ്രയോഗം ദാതാവിനെ വ്യക്തമാക്കാതെ സ്വീകരിച്ചതിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു; മലയാളത്തിലും അതേ തുറന്ന നില നിലനിർത്തുന്നു.
- source_word: διὰ προφητείας
  choice: പ്രവചനത്തിലൂടെ
  rationale: διά + genitive ഇവിടെ മാർഗമോ മാധ്യമമോ സൂചിപ്പിക്കാം. പ്രവചനം വരം നൽകപ്പെട്ടതിനോടൊപ്പം ഉണ്ടായിരുന്നോ അതിന് മാധ്യമമായിരുന്നോ എന്ന സൂക്ഷ്മമായ അനിശ്ചിതത്വം ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: കൈവെപ്പോടുകൂടെ
  rationale: കൈകൾ ഒരാളുടെമേൽ വെക്കുന്ന ആചാരപരമായ പ്രവൃത്തിക്കുള്ള സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്; μετά സൂചിപ്പിക്കുന്ന സഹസാന്നിധ്യവും നിലനിർത്തുന്നു.
- source_word: τοῦ πρεσβυτερίου
  choice: മൂപ്പന്മാരുടെ സംഘം
  rationale: πρεσβυτέριον ഒറ്റ മൂപ്പനെയല്ല, മൂപ്പന്മാരുടെ കൂട്ടായ സമിതിയെയോ സംഘത്തെയോ സൂചിപ്പിക്കുന്നു. ‘സംഘം’ ഈ കൂട്ടായ അർഥം അറിയിക്കുകയും പിൽക്കാല സഭാഭരണപരമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: χάρισμα എന്നതിന് പ്രത്യേക കരിസ്മാറ്റിക് അഥവാ സഭാശുശ്രൂഷാ അർഥം വ്യക്തമാക്കണമോ
  choice: കൃപാവരം
  alternative: ആത്മികവരം; ശുശ്രൂഷാവരം
  rationale: സന്ദർഭം ശുശ്രൂഷയ്ക്കുള്ള ഒരു ദൈവദത്ത വരത്തെ സൂചിപ്പിക്കാമെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ അതിനെ ‘ആത്മിക’മെന്നോ ‘ശുശ്രൂഷാ’യെന്നോ വിശേഷിപ്പിക്കുന്നില്ല. അതിനാൽ അനാവശ്യമായ സിദ്ധാന്തപരമായ ചുരുക്കം ഒഴിവാക്കി.
- issue: πρεσβυτέριον സഭാഭരണവുമായി ബന്ധപ്പെട്ട പിൽക്കാല സാങ്കേതികപദമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: മൂപ്പന്മാരുടെ സംഘം
  alternative: മൂപ്പന്മാരുടെ സമിതി; പ്രെസ്ബിറ്ററി
  rationale: കൈവെപ്പിൽ പങ്കെടുത്തത് മൂപ്പന്മാരുടെ ഒരു കൂട്ടായ ശരീരമാണെന്ന് പാഠം പറയുന്നു. ‘മൂപ്പന്മാരുടെ സംഘം’ ആ അർഥം വ്യക്തമാക്കുമ്പോൾ ഏതെങ്കിലും പിൽക്കാല സഭാവിഭാഗത്തിന്റെ ഭരണസംവിധാനം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കൃപാവരം’, ‘കൈവെപ്പ്’, ‘മൂപ്പന്മാർ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും പിൽക്കാല സഭാവിഭാഗപരമായ സാങ്കേതികഭാഷ ഒഴിവാക്കി. മുഖ്യപാഠത്തിലെ [a], [b] അടയാളങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് ശേഷം നൽകിയിരിക്കുന്നു.
