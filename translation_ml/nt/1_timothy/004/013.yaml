id: 1TI.4.13
reference: 1 Timothy 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: ml
  text: ഞാൻ വരുന്നതുവരെ, പരസ്യവായനയ്ക്കും[a] പ്രബോധനത്തിനും ഉപദേശത്തിനും നിന്നെത്തന്നെ സമർപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘തിരുവെഴുത്തിന്റെ വായനയ്ക്ക്.’ ഗ്രീക്കിൽ ‘വായന’ എന്നു മാത്രമേ ഉള്ളൂ; എന്നാൽ സന്ദർഭത്തിൽ ഇത് സഭായോഗത്തിലെ പരസ്യമായ തിരുവെഴുത്തുവായനയെ സൂചിപ്പിക്കാനാണ് സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: ഞാൻ വരുന്നതുവരെ
  rationale: ἕως സമയപരിധി സൂചിപ്പിക്കുകയും ἔρχομαι സന്ദർഭത്തിൽ ഭാവിയിലേക്കുള്ള വരവിനെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ഈ മലയാളപ്രയോഗം ഗ്രീക്കിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തുല്യരൂപമാണ്.
- source_word: πρόσεχε
  choice: നിന്നെത്തന്നെ സമർപ്പിക്കുക
  rationale: ഇവിടെയുള്ള വർത്തമാനകാല ആജ്ഞ തുടർച്ചയായ ശ്രദ്ധയും അർപ്പണവും ആവശ്യപ്പെടുന്നു; വെറും ‘ശ്രദ്ധിക്കുക’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം ശുശ്രൂഷാപരമായ ദൈർഘ്യബലം വ്യക്തമാക്കുന്നു.
- source_word: τῇ ἀναγνώσει
  choice: പരസ്യവായനയ്ക്ക്
  rationale: ἀνάγνωσις അടിസ്ഥാനമായി ‘വായന’ എന്നാണ്; സഭായോഗസന്ദർഭത്തിൽ ഇത് പൊതുവായ വായനയെ, മിക്കവാറും തിരുവെഴുത്തുവായനയെ, സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ സഭാസന്ദർഭം പ്രകടമാക്കുന്നു.
- source_word: τῇ παρακλήσει
  choice: പ്രബോധനത്തിന്
  rationale: παράκλησις എന്നതിന് പ്രോത്സാഹനം, അഭ്യർഥന, പ്രബോധനം എന്നീ അർഥവ്യാപ്തിയുണ്ട്. വായനയോടും ഉപദേശത്തോടും ചേർന്ന ശുശ്രൂഷാപട്ടികയിൽ നിർദേശവും ഉത്സാഹിപ്പിക്കലും ഉൾക്കൊള്ളുന്ന ‘പ്രബോധനം’ യോജിക്കുന്നു.
- source_word: τῇ διδασκαλίᾳ
  choice: ഉപദേശത്തിന്
  rationale: διδασκαλία ഇവിടെ പഠിപ്പിക്കുന്ന പ്രവർത്തനത്തെയോ അതിന്റെ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കുന്നു. ‘ഉപദേശം’ ആ അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വ്യവസ്ഥാപിത സിദ്ധാന്തം എന്ന ചുരുങ്ങിയ അർഥം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: ἀνάγνωσις എന്നത് തിരുവെഴുത്തുവായനയാണെന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കണമോ
  choice: പരസ്യവായന
  alternative: തിരുവെഴുത്തിന്റെ വായന; വായന
  rationale: സഭാക്രമവും ശുശ്രൂഷയും സംബന്ധിച്ച സന്ദർഭം പൊതുവായ തിരുവെഴുത്തുവായനയെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്കിൽ ‘തിരുവെഴുത്ത്’ എന്ന കർമം പറഞ്ഞിട്ടില്ല. അതിനാൽ മുഖ്യപാഠം സാധ്യതയുള്ള സഭാസന്ദർഭം അറിയിക്കുകയും, വ്യക്തമാക്കാത്ത കർമം അടിക്കുറിപ്പിൽ മാത്രം നൽകുകയും ചെയ്യുന്നു.
- issue: παράκλησις എന്നതിലെ പ്രോത്സാഹനവും ആഹ്വാനവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: പ്രബോധനം
  alternative: പ്രോത്സാഹനം; ആഹ്വാനം
  rationale: ‘പ്രബോധനം’ സന്ദർഭത്തിലെ നിർദേശാത്മക ശുശ്രൂഷയെ വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് പദത്തിലെ ആശ്വാസം/പ്രോത്സാഹനം എന്ന ഭാവം പൂർണമായി ഒഴിവാക്കുന്നില്ല. ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധന വ്യക്തമാക്കാൻ ‘നിന്നെത്തന്നെ’ ഉപയോഗിച്ചു. മൂന്ന് സമാന്തര ദത്തിവ് ഘടകങ്ങളും ‘-യ്ക്ക്/-ത്തിനും’ എന്ന ഘടനയിൽ നിലനിർത്തി; മതവിഭാഗവിശേഷമായ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
