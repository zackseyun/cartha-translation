source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: ml
  text: കാരണം ദൈവം സൃഷ്ടിച്ച ഓരോന്നും നല്ലതാണ്[a]; നന്ദിയോടെ സ്വീകരിക്കുമ്പോൾ ഒന്നും തള്ളിക്കളയേണ്ടതല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ ഓരോ സൃഷ്ടിയും നല്ലതാണ്.” κτίσμα എന്ന ഗ്രീക്ക് പദത്തിന് ‘സൃഷ്ടിക്കപ്പെട്ടത്’, ‘സൃഷ്ടി’, ‘ജീവി’ എന്നീ അർഥങ്ങൾ വരാം.
