  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: ml
  text: ഇക്കാര്യങ്ങൾ നിർദേശിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഇക്കാര്യങ്ങൾ ആജ്ഞാപിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുക.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: ആജ്ഞാപിക്കുകയും
  rationale: വർത്തമാനകാല കർത്തരി ആജ്ഞാരൂപം തുടർച്ചയായ അധികാരപൂർവ നിർദേശം സൂചിപ്പിക്കുന്നു. ‘ആജ്ഞാപിക്കുക’ എന്നത് വെറും ഉപദേശത്തേക്കാൾ ശക്തമായ παραγγέλλωയുടെ നിർദേശാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: ταῦτα
  choice: ഇക്കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചന സൂചകസർവനാമം മുൻപു പറഞ്ഞ ഉപദേശങ്ങളിലേക്കോ നിർദേശങ്ങളിലേക്കോ വിരൽചൂണ്ടുന്നു. ‘ഇക്കാര്യങ്ങൾ’ ബഹുവചനത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -കയും … -കയും
  rationale: രണ്ട് ആജ്ഞാരൂപങ്ങളെയും ഏകോപിപ്പിക്കുന്ന καὶയുടെ ബന്ധകശക്തി സ്വാഭാവികമായ മലയാള സമുച്ചയഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: δίδασκε
  choice: പഠിപ്പിക്കുകയും ചെയ്യുക
  rationale: വർത്തമാനകാല കർത്തരി ആജ്ഞാരൂപം തുടർച്ചയായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു. പഠിപ്പിക്കേണ്ട വിഷയം ταῦταയിൽനിന്ന് വ്യക്തമായതിനാൽ മലയാളത്തിൽ കർമം ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: παράγγελλω എന്ന ആജ്ഞാരൂപത്തിൽ ഉൾക്കൊള്ളുന്ന ശുശ്രൂഷാപരമായ അധികാരം
  choice: അധികാരപൂർവമായ ‘ആജ്ഞാപിക്കുക’ എന്ന നിലയിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇക്കാര്യങ്ങൾ നിർദേശിക്കുകയും പഠിപ്പിക്കുകയും ചെയ്യുക.’
  rationale: രണ്ട് വർത്തമാനകാല ആജ്ഞാരൂപങ്ങളിൽ ആദ്യത്തേത് വ്യക്തമായ നിർദേശാധികാരം വഹിക്കുന്നു. ‘ആജ്ഞാപിക്കുക’ ഗ്രീക്കിന്റെ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു; അതേസമയം വാക്യത്തിനപ്പുറമുള്ള സഭാധികാരസിദ്ധാന്തങ്ങൾ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇക്കാര്യങ്ങൾ’ മുൻസന്ദർഭത്തിലേക്കുള്ള ബഹുവചന സൂചന നിലനിർത്തുന്നു; ‘ആജ്ഞാപിക്കുക’ മൂലപദത്തിന്റെ അധികാരപൂർവ ശക്തിയും ‘നിർദേശിക്കുക’ എന്ന അടിക്കുറിപ്പ് അതിന്റെ സാധ്യമായ മൃദുവായ പദവികൽപ്പവും നൽകുന്നു.
