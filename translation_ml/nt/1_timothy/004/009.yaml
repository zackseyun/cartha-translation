lexical_decisions:
- source_word: πιστὸς
  choice: വിശ്വസനീയം
  rationale: ഇവിടെ വിശേഷണം ഈ വചനം ആശ്രയിക്കാവുന്നതും വിശ്വാസം അർഹിക്കുന്നതുമാണെന്ന് സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘വിശ്വസനീയം’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ὁ λόγος
  choice: ഈ വചനം
  rationale: ποιമനലേഖനങ്ങളിലെ ഈ സൂത്രവാക്യത്തിൽ λόγος ഒരു നിർദിഷ്ട പ്രസ്താവനയെയോ ചൊല്ലിനെയോ സൂചിപ്പിക്കുന്നു. ‘ഈ വചനം’ സൂത്രവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; ‘പ്രസ്താവന’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πάσης
  choice: പൂർണമായി
  rationale: πάσης ἀποδοχῆς എന്ന പ്രയോഗത്തിലെ സമഗ്രതയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘പൂർണമായി’ ഉപയോഗിച്ചു.
- source_word: ἀποδοχῆς
  choice: സ്വീകരിക്കപ്പെടാൻ
  rationale: ἀποδοχή ഇവിടെ സ്വീകരണം എന്ന അർഥത്തിലാണ്; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രിയാരൂപം ഉപയോഗിച്ചു.
- source_word: ἄξιος
  choice: യോഗ്യം
  rationale: ജനിറ്റീവിനോടൊപ്പം വരുന്ന ἄξιος എന്നത് ‘അർഹം/യോഗ്യം’ എന്നർഥം നൽകുന്നു; ഇവിടെ ‘സ്വീകരിക്കപ്പെടാൻ യോഗ്യം’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
