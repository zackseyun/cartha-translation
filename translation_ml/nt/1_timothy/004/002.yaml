id: 1TI.4.2
reference: 1 Timothy 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/002.yaml
  text: through the hypocrisy of liars whose own conscience has been seared,[a]
translation:
  language: ml
  text: നുണ പറയുന്നവരുടെ കപടതയിലൂടെയാണ് ഇത് സംഭവിക്കുന്നത്; അവരുടെ സ്വന്തം മനസ്സാക്ഷി ചുട്ടുപൊള്ളിക്കപ്പെട്ടിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവരുടെ സ്വന്തം മനസ്സാക്ഷി മുദ്രകുത്തപ്പെട്ടിരിക്കുന്നു’ എന്നോ ‘അവരുടെ സ്വന്തം മനസ്സാക്ഷി ദഹിപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നോ. ഗ്രീക്ക് ദൃശ്യരൂപം മനസ്സാക്ഷി അടയാളപ്പെടുത്തപ്പെട്ടതിനെയോ അതിന്റെ സംവേദനശേഷി നഷ്ടപ്പെട്ടതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: -ലൂടെയാണ്
  rationale: മുൻവാക്യവുമായി ബന്ധപ്പെടുത്തി മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ‘-ലൂടെ’ എന്നു നൽകി.
- source_word: ὑποκρίσει
  choice: കപടഭാവം
  rationale: നന്മയോ സത്യസന്ധതയോ നടിക്കുന്ന കപടതയെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായ പദപ്രയോഗം.
- source_word: ψευδολόγων
  choice: നുണ പറയുന്നവരുടെ
  rationale: കള്ളം സംസാരിക്കുന്നവരെ വിശേഷിപ്പിക്കുന്ന ജനിറ്റീവ് ബഹുവചനം; ‘കപടഭാവം’ എന്നതിനോടുള്ള ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κεκαυστηριασμένων
  choice: ചുട്ടുപൊള്ളിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: καυστηριάζω എന്ന ക്രിയയുടെ ചുട്ടുപൊള്ളിക്കൽ/ദഹിപ്പിക്കൽ എന്ന ദൃശ്യരൂപവും perfect passive participle സൂചിപ്പിക്കുന്ന ഫലാവസ്ഥയും സംരക്ഷിക്കുന്നു; നിർവികാരത എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: അവരുടെ സ്വന്തം മനസ്സാക്ഷി
  rationale: ഗ്രീക്കിലെ ഏകവചനവും ἰδίαν നൽകുന്ന ‘സ്വന്തം’ എന്ന ഊന്നലും നിലനിർത്തുന്നു; മലയാളത്തിൽ ഇത് വിതരണാത്മകമായി സ്വാഭാവികമാണ്.
theological_decisions:
- issue: κεκαυστηριασμένων എന്നതിന്റെ രൂപകാർഥം
  choice: ‘ചുട്ടുപൊള്ളിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ദൃശ്യരൂപം നിലനിർത്തി
  alternative: ‘മുദ്രകുത്തപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘സംവേദനശേഷി നഷ്ടപ്പെട്ടിരിക്കുന്നു’
  rationale: ഗ്രീക്ക് പദം മുദ്രകുത്തലിനെയോ ദഹിപ്പിച്ച് നിർവികാരമാക്കലിനെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത നിലനിൽക്കുന്നു. അന്തിമമായ ആത്മീയ തിരസ്കാരമോ തിരിച്ചുവരാനാകാത്ത അവസ്ഥയോ വാചകത്തിൽ ചേർക്കാതെ രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ ഭാഗം മുൻവാക്യത്തെ ആശ്രയിക്കുന്നതിനാൽ അർഥപൂർണമായ മലയാളവാക്യമായി നൽകാൻ ‘ഇത് സംഭവിക്കുന്നത്’ ചേർത്തിരിക്കുന്നു; പുതിയ ആശയം ചേർത്തിട്ടില്ല.
