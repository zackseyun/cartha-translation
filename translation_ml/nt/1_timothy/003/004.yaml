  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: ml
  text: സ്വന്തം കുടുംബത്തെ നന്നായി നയിക്കുന്നവനും[a], മക്കളെ സമ്പൂർണ മാന്യതയോടെ വിധേയത്വത്തിൽ നിർത്തുന്നവനും[b][c] ആയിരിക്കണം;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സ്വന്തം കുടുംബത്തെ നന്നായി പരിപാലിച്ചു നയിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘സ്വന്തം വീടിനെ നന്നായി ഭരിക്കുന്നവൻ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിധേയരായ മക്കളുള്ളവൻ’ അല്ലെങ്കിൽ ‘മക്കളെ നിയന്ത്രണത്തിൽ നിർത്തുന്നവൻ.’
    reason: lexical_alternative
  - marker: c
    text: ‘സമ്പൂർണ മാന്യതയോടെ’ എന്ന പദബന്ധം മക്കളുടെ വിധേയത്വത്തിന്റെ രീതിയെയോ, അദ്ദേഹത്തിന്റെ കുടുംബനിർവഹണത്തിന്റെ ആകെ രീതിയെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: സ്വന്തം കുടുംബത്തെ
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെക്കാൾ വീട്ടുകാരെയും കുടുംബജീവിതത്തിന്റെ മേഖലയെയും സൂചിപ്പിക്കുന്നു. ἰδίου എന്നതിന്റെ വ്യക്തമായ ഉടമസ്ഥതാബോധം ‘സ്വന്തം’ നിലനിർത്തുന്നു.
- source_word: καλῶς
  choice: നന്നായി
  rationale: കുടുംബനേതൃത്വം നിർവഹിക്കുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ ക്രിയാവിശേഷണമാണിത്.
- source_word: προϊστάμενον
  choice: നയിക്കുന്നവനും
  rationale: ഈ സന്ദർഭത്തിൽ ഉത്തരവാദിത്വമുള്ള മേൽനോട്ടവും നേതൃത്വവും അർഥമാക്കുന്നു. ‘നയിക്കുക’ യഥാർഥ അധികാരബോധം നിലനിർത്തിക്കൊണ്ട് ‘ഭരിക്കുക’ എന്നതിലുണ്ടാകാവുന്ന അനാവശ്യമായ കാഠിന്യം ഒഴിവാക്കുന്നു.
- source_word: τέκνα ἔχοντα
  choice: മക്കളെ … നിർത്തുന്നവനും
  rationale: ἔχοντα എന്ന ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാനും ἐν ὑποταγῇ എന്ന അവസ്ഥയുമായി ബന്ധിപ്പിക്കാനും ‘നിർത്തുന്നവൻ’ ഉപയോഗിച്ചു; ഇതിൽ കുടുംബനേതൃത്വത്തിന്റെ ഉത്തരവാദിത്വവും പ്രകടമാണ്.
- source_word: ἐν ὑποταγῇ
  choice: വിധേയത്വത്തിൽ
  rationale: ὑποταγήയിലെ ക്രമത്തിനുകീഴിലുള്ള വിധേയത്വബോധം നിലനിർത്തുന്നു. ‘അനുസരണം’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കാം; ‘നിയന്ത്രണത്തിൽ’ എന്നത് ബാഹ്യനിയന്ത്രണത്തിന് അമിത ഊന്നൽ നൽകാം.
- source_word: μετὰ πάσης σεμνότητος
  choice: പൂർണ മാന്യതയോടെ
  rationale: σεμνότης സൂചിപ്പിക്കുന്ന മാന്യത, ഗൗരവം, യോഗ്യത എന്നിവ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഈ പദബന്ധം ആരുടെ പെരുമാറ്റത്തെയാണ് പ്രധാനമായി വിശേഷിപ്പിക്കുന്നത് എന്നത് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
theological_decisions:
- issue: കുടുംബനേതൃത്വഭാഷയുടെ വ്യാപ്തി
  choice: മേൽവിചാരകസ്ഥാനത്തേക്കുള്ള ഒരാളുടെ സ്വന്തം കുടുംബത്തിലെ ഉത്തരവാദിത്വമുള്ള നേതൃത്വമായാണ് വാക്യം അവതരിപ്പിക്കുന്നത്.
  alternative: എല്ലാത്തരം അധികാരത്തെയും കുറിച്ചുള്ള വിപുലമായ പിതൃമേധാവിത്വപ്രസ്താവനയായി വായിക്കുക; അല്ലെങ്കിൽ അധികാരബോധം നീക്കി വെറും പരിചരണമായി വായിക്കുക.
  rationale: προϊστάμενον, ὑποταγή എന്നീ പദങ്ങൾ യഥാർഥ നേതൃത്വവും ക്രമവും സൂചിപ്പിക്കുന്നു. എന്നാൽ ഈ വാക്യം കുടുംബഘടനയെക്കുറിച്ചുള്ള സമ്പൂർണ സിദ്ധാന്തമല്ല, ഒരു സ്ഥാനാർഥിയുടെ യോഗ്യതയാണ് വിവരിക്കുന്നത്.
- issue: ‘പൂർണ മാന്യതയോടെ’ എന്നതിന്റെ ബന്ധം
  choice: അത് മക്കളുടെ വിധേയത്വത്തെയോ കുടുംബനിർവഹണത്തിന്റെ ആകെ രീതിയെയോ വിശേഷിപ്പിക്കാം എന്ന അനിശ്ചിതത്വം നിലനിർത്തി.
  alternative: മക്കളുടെ വിധേയത്വത്തെ മാത്രം വിശേഷിപ്പിക്കുന്നു; അല്ലെങ്കിൽ പിതാവിന്റെ നടത്തിപ്പിനെ മാത്രം വിശേഷിപ്പിക്കുന്നു.
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടുതരത്തിലുള്ള ബന്ധവും ചർച്ചയ്ക്കിടയാക്കുന്നു. അതിനാൽ മുഖ്യവാചകം ഒന്നിനെ മാത്രം നിർബന്ധമായി തിരഞ്ഞെടുക്കുന്നില്ല; അടിക്കുറിപ്പ് സാധ്യതകൾ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ സഭാപരമായ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘കീഴ്വഴക്കം’ പോലുള്ള പഴക്കമുള്ള പ്രയോഗത്തിനു പകരം ‘വിധേയത്വം’ ഉപയോഗിച്ചു. വാക്യം മുൻസന്ദർഭത്തിലെ യോഗ്യതാപട്ടികയുടെ തുടർച്ചയായതിനാൽ ‘ആയിരിക്കണം’ ചേർത്തു.
