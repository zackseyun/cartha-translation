revisions:
- from: 'ഈ വചനം വിശ്വാസയോഗ്യമാണ്: ആരെങ്കിലും മേൽനോട്ടച്ചുമതല[a] നേടാൻ ലക്ഷ്യമിടുന്നെങ്കിൽ, ആ വ്യക്തി നല്ലൊരു പ്രവൃത്തി[b] ആഗ്രഹിക്കുന്നു.'
  to: 'ഈ പ്രസ്താവന വിശ്വാസയോഗ്യമാണ്: ആരെങ്കിലും മേൽനോട്ടച്ചുമതല[a] അഭിലഷിക്കുന്നുവെങ്കിൽ, അയാൾ നല്ലൊരു ദൗത്യം[b] ആഗ്രഹിക്കുന്നു.'
  rationale: The revised wording retains the generic force of τις, distinguishes the two Greek desire-verbs without adding the idea of obtaining office, and renders καλοῦ ἔργου as a task/undertaking rather than an isolated deed. The main text continues to avoid imposing later ecclesiastical polity, while the footnote supplies the traditional office term as an alternative.
