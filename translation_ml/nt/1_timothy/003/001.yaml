id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: ml
  text: 'ഈ പ്രസ്താവന വിശ്വാസയോഗ്യമാണ്: ആരെങ്കിലും മേൽനോട്ടച്ചുമതല[a] അഭിലഷിക്കുന്നുവെങ്കിൽ, അയാൾ നല്ലൊരു ദൗത്യം[b] ആഗ്രഹിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേൽനോട്ടക്കാരന്റെ പദവി’; പരമ്പരാഗതമായി, ‘മെത്രാൻപദവി.’
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ശ്രേഷ്ഠമായൊരു ദൗത്യം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: ഈ വചനം വിശ്വാസയോഗ്യമാണ്
  rationale: ഇടയലേഖനങ്ങളിൽ വിശ്വസിക്കാവുന്ന ഒരു പ്രസ്താവനയെ അവതരിപ്പിക്കുന്ന സൂത്രവാക്യമാണിത്. λόγος എന്നതിന് ഇവിടെ ‘വചനം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: εἴ τις
  choice: ആരെങ്കിലും
  rationale: τις അനിശ്ചിതവും പൊതുവുമായ സർവനാമമാണ്; ഈ പദപ്രയോഗം തന്നിൽ ഇല്ലാത്ത പുരുഷലിംഗപരമായ നിയന്ത്രണം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- source_word: ἐπισκοπῆς
  choice: മേൽനോട്ടച്ചുമതല
  rationale: മേൽനോട്ടം വഹിക്കുന്ന പ്രവർത്തനത്തെയും അതുമായി ബന്ധപ്പെട്ട ഉത്തരവാദിത്വത്തെയും ഈ പദം സൂചിപ്പിക്കുന്നു. പിൽക്കാല സഭാഭരണഘടനയിലെ സ്ഥിരമായ സ്ഥാനപ്പേര് മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അർത്ഥം വ്യക്തമാക്കുന്നു.
- source_word: ὀρέγεται
  choice: നേടാൻ ലക്ഷ്യമിടുന്നെങ്കിൽ
  rationale: എന്തിലേക്കെങ്കിലും നീളുക എന്ന അടിസ്ഥാനചിത്രത്തിൽനിന്ന് ഉരുത്തിരിഞ്ഞ ‘ലക്ഷ്യമിടുക/നേടാൻ ശ്രമിക്കുക’ എന്ന അഭിലാഷഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καλοῦ ἔργου
  choice: നല്ലൊരു പ്രവൃത്തി
  rationale: καλός എന്നതിന്റെ ‘നല്ല/ശ്രേഷ്ഠ’ അർത്ഥവും ἔργον എന്നതിന്റെ ‘പ്രവൃത്തി’ എന്ന ഊന്നലും നേരിട്ട് നിലനിർത്തുന്നു; ഇത് പദവിമാത്രമല്ല, ചെയ്യേണ്ട പ്രവർത്തിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐπιθυμεῖ
  choice: ആഗ്രഹിക്കുന്നു
  rationale: ശക്തമായ ആഗ്രഹം സൂചിപ്പിക്കുന്നുവെങ്കിലും സന്ദർഭത്തിൽ അനാവശ്യമായി തീവ്രമാക്കാതെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ നൽകുന്നു.
theological_decisions:
- issue: ἐπισκοπῆς എന്നത് പിൽക്കാല സഭാപദവിയുടെ പേരായി പരിഭാഷപ്പെടുത്തണമോ
  choice: മേൽനോട്ടച്ചുമതല
  alternative: മേൽവിചാരകന്റെ സ്ഥാനം; പരമ്പരാഗതമായി, മെത്രാൻപദവി
  rationale: ഗ്രീക്ക് പദത്തിന് മേൽനോട്ടം, അതിന്റെ ഉത്തരവാദിത്വം, ബന്ധപ്പെട്ട സ്ഥാനം എന്നീ അർത്ഥവ്യാപ്തിയുണ്ട്. ഒരു പ്രത്യേക സഭാഭരണരീതി മുൻകൂട്ടി നിർണയിക്കാതെ ആ വ്യാപ്തി മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: εἴ τις എന്ന പൊതുവായ പ്രയോഗം പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ആരെങ്കിലും; തുടർവാക്യത്തിൽ ‘ആ വ്യക്തി’
  alternative: ഒരു പുരുഷൻ; അവൻ
  rationale: τις എന്ന പദം സ്വതവേ പൊതുവായതാണ്. തുടർന്നുള്ള സന്ദർഭത്തിലെ വ്യാകരണപരവും വ്യാഖ്യാനപരവുമായ ചോദ്യങ്ങൾ ഈ പദപ്രയോഗത്തിലേക്ക് മുൻകൂട്ടി കൊണ്ടുവരാതെ ലിംഗനിരപേക്ഷമായ മലയാളം ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മേൽനോട്ടച്ചുമതല’ സഭാപരമായ സന്ദർഭം വ്യക്തമാക്കുമ്പോഴും പിൽക്കാലത്തെ ഏതെങ്കിലും പ്രത്യേക സ്ഥാനഘടന അടിച്ചേൽപ്പിക്കുന്നില്ല. രണ്ടു വ്യത്യസ്ത ആഗ്രഹക്രിയകൾ ‘നേടാൻ ലക്ഷ്യമിടുക’, ‘ആഗ്രഹിക്കുക’ എന്നിങ്ങനെ വേർതിരിച്ചിരിക്കുന്നു.
