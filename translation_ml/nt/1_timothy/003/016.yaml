id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: ml
  text: 'എല്ലാവരും സമ്മതിക്കുന്നതുപോലെ, ദൈവഭക്തിയുടെ രഹസ്യം മഹത്താണ്:


    അവൻ[a] ജഡത്തിൽ വെളിപ്പെട്ടു,


    ആത്മാവിൽ നീതിമാനെന്ന് തെളിയിക്കപ്പെട്ടു[b],


    ദൂതന്മാർക്ക് പ്രത്യക്ഷനായി,


    ജനതകളുടെ ഇടയിൽ[c] പ്രസംഗിക്കപ്പെട്ടു,


    ലോകത്തിൽ വിശ്വസിക്കപ്പെട്ടു,


    മഹത്വത്തിൽ എടുത്തുകൊള്ളപ്പെട്ടു[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘അവൻ ജഡത്തിൽ വെളിപ്പെട്ടു’ എന്നതിനുപകരം ‘ദൈവം ജഡത്തിൽ വെളിപ്പെട്ടു’ എന്നു കാണുന്നു. ഇവിടെ പിന്തുടരുന്ന വിമർശനാത്മക ഗ്രീക്ക് പാഠത്തിൽ ‘ആർ’ എന്നാണ്; സന്ദർഭത്തിൽ അത് ‘അവൻ’ എന്നു സ്വാഭാവികമായി വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: ‘പരിശുദ്ധാത്മാവിനാൽ നീതിമാനെന്ന് തെളിയിക്കപ്പെട്ടു’ എന്നും ‘ആത്മാവിൽ നീതിമാനെന്ന് തെളിയിക്കപ്പെട്ടു’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ സംക്ഷിപ്ത ഗ്രീക്ക് പ്രയോഗം പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെയോ ആത്മീയ ജീവന്റെ മണ്ഡലത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ ‘വിജാതീയരുടെ ഇടയിൽ.’
    reason: lexical_alternative
  - marker: d
    text: അല്ലെങ്കിൽ ‘മഹത്വത്തിലേക്ക് എടുത്തുകൊള്ളപ്പെട്ടു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: തർക്കമില്ലാതെ
  rationale: എല്ലാവരും സമ്മതിക്കുന്നതും നിഷേധിക്കാനാവാത്തതുമായ കാര്യം എന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον
  choice: ദൈവഭക്തിയുടെ രഹസ്യം മഹത്താണ്
  rationale: മുൻനിരയിൽ വരുന്ന μέγα എന്ന പദത്തിന്റെ ഊന്നൽ ‘മഹത്താണ്’ എന്നതിലൂടെ നിലനിർത്തുന്നു. μυστήριον ദൈവം വെളിപ്പെടുത്തിയിരുന്ന മറഞ്ഞ സത്യത്തെയും εὐσέβεια ദൈവഭക്തിയുള്ള ജീവിതത്തെയും സൂചിപ്പിക്കുന്നു.
- source_word: Ὃς
  choice: അവൻ
  rationale: SBLGNTയിലെ പുല്ലിംഗ ആപേക്ഷിക സർവനാമത്തെ വ്യക്തിപരമായ ക്രിസ്തുസൂചനയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘ദൈവം’ എന്ന പാഠഭേദം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: ജഡത്തിൽ വെളിപ്പെട്ടു
  rationale: ശരീരധാരിയായ മനുഷ്യാവസ്ഥയിൽ പ്രത്യക്ഷനായതെന്ന ആശയം സംക്ഷിപ്തമായും കാവ്യാത്മക സമാന്തരഘടനയോടെയും നൽകുന്നു.
- source_word: ἐδικαιώθη ἐν πνεύματι
  choice: ആത്മാവിൽ നീതിമാനെന്ന് തെളിയിക്കപ്പെട്ടു
  rationale: ഇവിടെ δικαιόω ‘നീതിമാനാക്കി’ എന്നതിലുപരി ശരിയുള്ളവനെന്നോ നീതിമാനെന്നോ സ്ഥിരീകരിക്കപ്പെട്ടു എന്ന അർഥത്തിലാണ്. ἐν πνεύματι എന്നതിന്റെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്തതയും ദ്വയാർഥസാധ്യതയും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὤφθη ἀγγέλοις
  choice: ദൂതന്മാർക്ക് പ്രത്യക്ഷനായി
  rationale: ὤφθη എന്ന രൂപത്തിന് ‘കാണപ്പെട്ടു/പ്രത്യക്ഷനായി’ എന്ന സാധാരണ അർഥമുണ്ട്; മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം തെരഞ്ഞെടുത്തു. സന്ദർഭത്തിൽ ἀγγέλοις സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: ജനതകളുടെ ഇടയിൽ പ്രസംഗിക്കപ്പെട്ടു
  rationale: κηρύσσωയുടെ പരസ്യപ്രഘോഷണഭാവം ‘പ്രസംഗിക്കപ്പെട്ടു’ എന്നും ἔθνηയുടെ വിശാലമായ ‘ജനതകൾ’ എന്ന അർഥം മുഖ്യപാഠത്തിലും നൽകുന്നു.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: ലോകത്തിൽ വിശ്വസിക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗവും വ്യക്തിയിൽ വിശ്വാസമർപ്പിക്കുക എന്ന ആശയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: മഹത്വത്തിൽ എടുത്തുകൊള്ളപ്പെട്ടു
  rationale: ἀναλαμβάνωയുടെ മേലേക്ക് സ്വീകരിക്കപ്പെടുക/എടുക്കപ്പെടുക എന്ന കർമണിഭാവവും ἐν δόξῃയുടെ വ്യാകരണസംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: 'സ്തോത്രഭാഗത്തിന്റെ ആരംഭത്തിലെ പാഠഭേദം: Ὃς / θεός / ὅ'
  choice: വിമർശനാത്മക ഗ്രീക്ക് പാഠത്തിലെ Ὃς എന്ന വായനയെ ‘അവൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ദൈവം ജഡത്തിൽ വെളിപ്പെട്ടു’ അല്ലെങ്കിൽ ‘അത് ജഡത്തിൽ വെളിപ്പെട്ടു.’
  rationale: SBLGNT Ὃς (‘ആർ/അവൻ’) എന്നാണ് വായിക്കുന്നത്. സന്ദർഭം ക്രിസ്തുവിനെക്കുറിച്ചായതിനാൽ ‘അവൻ’ സ്വാഭാവികമാണ്; ചരിത്രപ്രാധാന്യമുള്ള θεός എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ സുതാര്യമായി സൂക്ഷിക്കുന്നു.
- issue: ἐν πνεύματι എന്നതിലെ πνεῦμα ആരെയോ എന്തിനെയോ സൂചിപ്പിക്കുന്നുവോ എന്ന അനിശ്ചിതത്വം
  choice: മുഖ്യപാഠത്തിൽ ‘ആത്മാവിൽ’ എന്ന നിഷ്പക്ഷവും സംക്ഷിപ്തവുമായ രൂപം നിലനിർത്തി.
  alternative: ‘പരിശുദ്ധാത്മാവിനാൽ’ അല്ലെങ്കിൽ ആത്മീയ ജീവന്റെ/ഉയിർപ്പിന്റെ മണ്ഡലത്തിൽ ‘ആത്മാവിൽ.’
  rationale: ഗ്രീക്ക് പ്രയോഗം പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെയോ ആത്മീയ അസ്തിത്വത്തിന്റെ മണ്ഡലത്തെയോ സൂചിപ്പിക്കാം. ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കാതെ യഥാർഥ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സ്തോത്രസദൃശമായ ആറുവരിയുള്ള സമാന്തരഘടനയും കർമണിപ്രയോഗങ്ങളുടെ ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദരൂപങ്ങൾ ഒഴിവാക്കി.
