  to: 'എല്ലാവരും സമ്മതിക്കുന്നതുപോലെ, ദൈവഭക്തിയുടെ രഹസ്യം മഹത്താണ്:


    അവൻ[a] ജഡത്തിൽ വെളിപ്പെട്ടു,


    ആത്മാവിൽ നീതിമാനെന്ന് തെളിയിക്കപ്പെട്ടു[b],


    ദൂതന്മാർക്ക് പ്രത്യക്ഷനായി,


    ജനതകളുടെ ഇടയിൽ[c] പ്രസംഗിക്കപ്പെട്ടു,


    ലോകത്തിൽ വിശ്വസിക്കപ്പെട്ടു,


    മഹത്വത്തിൽ എടുത്തുകൊള്ളപ്പെട്ടു[d].'
  rationale: The revision only improves the rendering of ὁμολογουμένως and sharpens the explanatory wording of the textual-variant footnote. It preserves the source text’s syntax, the hymn-like parallelism, and the unresolved interpretive ambiguity of ἐν πνεύματι.
  reviewer_model: gpt-5.6-terra
