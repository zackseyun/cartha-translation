id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: ml
  text: എന്തെന്നാൽ, നന്നായി സേവിച്ചവർ തങ്ങൾക്കുതന്നെ മാന്യമായൊരു നിലയും മശീഹയായ യേശുവിലുള്ള[c] വിശ്വാസത്തിൽ[b] വലിയ ധൈര്യവും[a] നേടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വലിയ ആത്മവിശ്വാസം’; ഗ്രീക്ക് പദത്തിന് ധൈര്യം, ആത്മവിശ്വാസം, തുറന്നുപറയാനുള്ള സ്വാതന്ത്ര്യം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘മശീഹയായ യേശുവിലുള്ള വിശ്വസ്തതയിൽ.’ ഗ്രീക്ക് πίστις എന്ന പദത്തിന് ‘വിശ്വാസം,’ ‘ആശ്രയം,’ ‘വിശ്വസ്തത’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: alternative_reading
  - marker: c
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു’; ഇവിടെ ആ പദം സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: സേവിച്ചവർ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘സേവിക്കുക’ എന്നത് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ശുശ്രൂഷകരെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ക്രിയയ്ക്കുള്ളിൽ പദവിപ്പേര് ചേർക്കുന്നില്ല.
- source_word: καλῶς
  choice: നന്നായി
  rationale: ക്രിയയെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: βαθμὸν ... καλὸν
  choice: മാന്യമായൊരു നില
  rationale: βαθμός എന്നതിന്റെ രൂപകാർഥമായ നിലയെയോ അംഗീകാരത്തെയോ വ്യക്തമാക്കുന്നു; സഭാപരമായ ഒരു ഉയർന്ന പദവി നേടിയെന്ന അർഥം അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: περιποιοῦνται
  choice: തങ്ങൾക്കുതന്നെ ... നേടുന്നു
  rationale: മധ്യമപ്രയോഗത്തിലെ സ്വയംലാഭസൂചന ‘തങ്ങൾക്കുതന്നെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: παρρησίαν
  choice: ധൈര്യം
  rationale: ഇവിടെ ഉദ്ദേശിക്കാവുന്ന ആത്മവിശ്വാസത്തോടെയുള്ള നിർഭയത്വം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ആത്മവിശ്വാസം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πίστει
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ വിവർത്തനം; ‘വിശ്വസ്തത’ എന്ന യഥാർഥ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിലുള്ള
  rationale: മുൻപുള്ള ‘വിശ്വാസം’ എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Χριστῷ
  choice: മശീഹയായ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ എന്നതിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ മശീഹയായ യേശുവിൽ കേന്ദ്രീകരിച്ച വിശ്വാസം എന്ന വായന സ്വാഭാവികമാണ്; എങ്കിലും ‘വിശ്വസ്തത’ എന്ന അർഥസാധ്യത യഥാർഥമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστός എന്ന പദം പേരായോ സ്ഥാനപ്പേരായോ അവതരിപ്പിക്കൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അഭിഷിക്തൻ/മശീഹ എന്ന സ്ഥാനപ്പേരായ പ്രവർത്തനം പ്രധാനവാചകത്തിൽ വ്യക്തമാക്കുന്നു; പതിവ് ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സേവിച്ചവർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘മാന്യമായൊരു നില’ സഭാപദവിയുടെ പടവുകൾ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു. അടിക്കുറിപ്പു ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദബന്ധങ്ങളോടു ചേർത്തിരിക്കുന്നു.
