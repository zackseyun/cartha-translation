id: 1TI.3.12
reference: 1 Timothy 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: ml
  text: ശുശ്രൂഷകന്മാർ ഒരു ഭാര്യയുള്ള പുരുഷന്മാരും[a] തങ്ങളുടെ മക്കളെയും സ്വന്തം കുടുംബങ്ങളെയും നന്നായി നയിക്കുന്നവരുമായിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു സ്ത്രീയോടു മാത്രം വിശ്വസ്തരായ പുരുഷന്മാർ.’ ഈ പ്രയോഗം വൈവാഹിക വിശ്വസ്തതയ്ക്കു ഊന്നൽ നൽകുന്നതാകാം; ചിലർ ഇതിനെ കൂടുതൽ പ്രത്യേകമായി ബഹുഭാര്യത്വത്തെയോ പുനർവിവാഹത്തെയോ ഒഴിവാക്കുന്നതായി മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: ശുശ്രൂഷകന്മാർ
  rationale: സഭാക്രമത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ അംഗീകൃത ശുശ്രൂഷാപദവിയെയാണ് സൂചിപ്പിക്കുന്നത്; പൊതുവായ ‘സേവകർ’ എന്ന അർഥത്തേക്കാൾ പദവിനാമം നിലനിർത്തുന്നു.
- source_word: ἔστωσαν
  choice: ആയിരിക്കണം
  rationale: യോഗ്യതകളുടെ പട്ടികയിലെ വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിർബന്ധാത്മക സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: ഒരു ഭാര്യയുടെ ഭർത്താക്കന്മാർ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും വിവാദവിധേയവുമായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുകയും വൈവാഹിക വിശ്വസ്തത, ഏകഭാര്യത്വം, പുനർവിവാഹം എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τέκνων
  choice: തങ്ങളുടെ മക്കളെ
  rationale: ഉടമസ്ഥസർവനാമം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലെങ്കിലും സമാന്തരമായ ‘സ്വന്തം കുടുംബങ്ങളെ’ എന്ന പ്രയോഗവും മലയാളഭാഷാശൈലിയും ബന്ധം വ്യക്തമാക്കാൻ ഇതിനെ സ്വാഭാവികമാക്കുന്നു.
- source_word: καλῶς
  choice: നന്നായി
  rationale: ക്രിയാവിശേഷണത്തിന്റെ ലളിതവും നേരിട്ടുള്ളതുമായ അർഥം നൽകുന്നു.
- source_word: προϊστάμενοι
  choice: നയിക്കുന്നവർ
  rationale: ഉത്തരവാദിത്വമുള്ള മേൽനോട്ടവും നേതൃത്വവും സൂചിപ്പിക്കുന്നു; കുടുംബസന്ദർഭത്തിൽ അമിതാധികാരഭാവമില്ലാത്ത സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: τῶν ἰδίων οἴκων
  choice: സ്വന്തം കുടുംബങ്ങളെ
  rationale: οἶκος ഇവിടെ കെട്ടിടമാത്രമല്ല, വീട്ടുകാരടങ്ങുന്ന കുടുംബഘടകത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാധാരണ മലയാളത്തിൽ ‘കുടുംബം’ അതിനെ വ്യക്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: സഭാശുശ്രൂഷാപദവിക്കുള്ള യോഗ്യതയിൽ μιᾶς γυναικὸς ἄνδρες എന്നതിന്റെ വ്യാഖ്യാനം
  choice: ‘ഒരു ഭാര്യയുടെ ഭർത്താക്കന്മാർ’ എന്ന ഔപചാരികമായ പരിഭാഷ മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു.
  alternative: ‘ഒരു സ്ത്രീയോടുമാത്രം വിശ്വസ്തരായ പുരുഷന്മാർ’, ‘ഭാര്യമാരോട് വിശ്വസ്തരായവർ’, അല്ലെങ്കിൽ ‘ഒരിക്കൽ മാത്രം വിവാഹിതരായവർ’.
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും വ്യത്യസ്ത വ്യാഖ്യാനങ്ങൾക്ക് ഇടനൽകുന്നതുമാണ്. അതിനാൽ വൈവാഹിക വിശ്വസ്തത, ബഹുഭാര്യത്വനിരോധനം, പുനർവിവാഹനിരോധനം എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് വാചകത്തിൽ അന്തിമമായി നിശ്ചയിക്കാതെ അർഥസമ്മർദം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷകന്മാർ’ സഭയിലെ അംഗീകൃത പദവിയെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ പുരുഷലിംഗവും വിവാഹപ്രയോഗത്തിലെ യഥാർഥ അസ്പഷ്ടതയും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
