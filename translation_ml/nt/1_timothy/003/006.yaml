id: 1TI.3.6
reference: 1 Timothy 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: ml
  text: അവൻ വിശ്വാസത്തിൽ പുതുതായി വന്നവനായിരിക്കരുത്; അഹങ്കാരത്താൽ വീർത്ത് പിശാചിന്റെ വിധിയിൽ അകപ്പെടാതിരിക്കാൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεόφυτον
  choice: വിശ്വാസത്തിൽ പുതുതായി വന്നവൻ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘പുതുതായി നട്ടവൻ’ എന്നാണ്; ഇവിടെ ക്രിസ്തീയ വിശ്വാസത്തിലേക്ക് അടുത്തിടെ വന്ന ഒരാളെ രൂപകമായി സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസത്തിൽ പുതുതായി വന്നവൻ’ എന്നത് ഈ സഭാപരമായ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τυφωθεὶς
  choice: അഹങ്കാരംകൊണ്ട് വീർത്ത്
  rationale: അഹന്തയാൽ വീർപ്പുമുട്ടുന്ന രൂപകം നിലനിർത്തുകയും ധാർമ്മിക മുന്നറിയിപ്പ് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: ഈ പദത്തിന് ‘വിധി’ എന്നും ‘ശിക്ഷാവിധി’ എന്നും അർഥമാകാം. ‘ന്യായവിധി’ എന്ന വിശാലമായ പ്രയോഗം മൂലപാഠത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τοῦ διαβόλου
  choice: പിശാചിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തി, പിശാചിന്മേൽ വന്ന വിധിയെയാണോ പിശാചുമായി ബന്ധപ്പെട്ട വിധിയെയാണോ സൂചിപ്പിക്കുന്നത് എന്നതിൽ അവ്യക്തമാണ്. നേരിട്ടുള്ള ഈ പരിഭാഷ ആ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: ἐμπέσῃ
  choice: വീഴുക
  rationale: അപകടകരമായ ഒരു അവസ്ഥയിലോ ഫലത്തിലോ അകപ്പെടുന്നതിന്റെ മൂലരൂപകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ
  choice: വീഴാതിരിക്കേണ്ടതിനാണിത്
  rationale: ഉദ്ദേശ്യത്തെയോ പ്രതീക്ഷിക്കപ്പെടുന്ന ഫലത്തെയോ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου എന്ന വാക്യഭാഗത്തിന്റെ അർഥം
  choice: ‘പിശാചിന്റെ ന്യായവിധിയിൽ വീഴുക’ എന്ന് അവ്യക്തത നിലനിർത്തി പരിഭാഷപ്പെടുത്തി
  alternative: ‘പിശാചിനുണ്ടായ അതേ ശിക്ഷാവിധിയിൽ വീഴുക’ അല്ലെങ്കിൽ ‘പിശാചുമായി ബന്ധപ്പെട്ട ന്യായവിധിക്ക് വിധേയനാകുക’
  rationale: τοῦ διαβόλου എന്ന ഷഷ്ഠിവിഭക്തി പിശാചിനെക്കുറിച്ചുള്ളതോ അവനുമേൽ വന്നതോ ആയ വിധിയെയും, പിശാചുമായി മറ്റുവിധത്തിൽ ബന്ധപ്പെട്ട വിധിയെയും സൂചിപ്പിക്കാം. ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം സിദ്ധാന്തപരമായി ഉറപ്പിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പ്രധാനപാഠം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘നവവിശ്വാസി’ പോലുള്ള സഭാവൃത്തത്തിനുള്ളിലെ സാങ്കേതിക പദത്തിനു പകരം വിശദവും സ്വാഭാവികവുമായ പ്രയോഗം ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ഷഷ്ഠിവിഭക്തിയുടെ അവ്യക്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
