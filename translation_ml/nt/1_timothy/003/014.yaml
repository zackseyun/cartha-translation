id: 1TI.3.14
reference: 1 Timothy 3:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: ml
  text: ഞാൻ ഉടൻ[a] നിന്റെ അടുക്കൽ വരുമെന്നു പ്രത്യാശിച്ചുകൊണ്ട്, ഈ കാര്യങ്ങൾ നിനക്ക് എഴുതുന്നു,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വേഗത്തിൽ” / “ചുരുങ്ങിയ സമയത്തിനുള്ളിൽ.”
    reason: ἐν τάχει എന്ന പ്രയോഗത്തിന് സമയസാമീപ്യത്തോടൊപ്പം പ്രവർത്തനത്തിന്റെ വേഗതയും സൂചിപ്പിക്കാനാകുന്നതിനാൽ പദാർഥപരമായ മറ്റു സാധ്യതകൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: Ταῦτά
  choice: ഈ കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ സർവനാമം മുൻപുള്ളതും തുടരുന്നതുമായ നിർദേശങ്ങളെ ഒരു കൂട്ടമായി സൂചിപ്പിക്കുന്നു; ബഹുവചനഭാവം നിലനിർത്തുന്നു.
- source_word: σοι
  choice: നിനക്ക്
  rationale: γράφω എന്ന ക്രിയയോടുകൂടിയ സംപ്രദാനിക സർവനാമം കത്തിന്റെ സ്വീകർത്താവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: γράφω
  choice: എഴുതുന്നു
  rationale: വർത്തമാനകാല ക്രിയ കത്ത് എഴുതുന്ന ഇപ്പോഴത്തെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ലളിതമായ വർത്തമാനരൂപം സ്വാഭാവികമാണ്.
- source_word: ἐλπίζων
  choice: പ്രത്യാശിച്ചുകൊണ്ട്
  rationale: വർത്തമാന കർത്തരി കൃദന്തം മുഖ്യക്രിയയോടൊപ്പമുള്ള പ്രത്യാശയെ പ്രകടിപ്പിക്കുന്നു; ഉറപ്പിനെ അതിശയിപ്പിക്കാതെ മൂലത്തിലെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐλθεῖν
  choice: വരുമെന്ന്
  rationale: πρὸς σέ എന്ന ദിശാസൂചനയോടുകൂടി എഴുത്തുകാരൻ തിമൊഥെയൊസിന്റെ അടുക്കലേക്കുള്ള വരവിനെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: πρὸς σὲ
  choice: നിന്റെ അടുക്കൽ
  rationale: വ്യക്തിയിലേക്കുള്ള ദിശയെ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τάχει
  choice: ഉടൻ
  rationale: സന്ദർഭത്തിൽ സമീപഭാവിയിലെ വരവാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ‘ഉടൻ’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു, അതേസമയം സാധ്യമായ രീതിവാചക അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി. തുടർന്നുള്ള വാക്യവുമായി ബന്ധം നിലനിർത്താൻ ഒടുവിൽ അർധവിരാമത്തിനു പകരം മൂലത്തിലെ തുടർച്ച സൂചിപ്പിക്കുന്ന കോമ ഉപയോഗിച്ചു.
