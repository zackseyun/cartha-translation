id: 1TI.3.9
reference: 1 Timothy 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/009.yaml
  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: ml
  text: വിശ്വാസത്തിന്റെ മർമ്മം നിർമലമായ മനസ്സാക്ഷിയോടെ മുറുകെപ്പിടിക്കുന്നവരായിരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വാസത്തിന്റെ മർമ്മം ശുദ്ധമായ മനസ്സാക്ഷിയോടെ സൂക്ഷിക്കുന്നവരായിരിക്കണം.”
    reason: ‘ἔχοντας’ എന്നതിന് ‘സൂക്ഷിക്കുന്നവർ’ എന്നും ‘καθαρᾷ’ എന്നതിന് ‘ശുദ്ധമായ’ എന്നും നൽകാവുന്ന കൂടുതൽ പദാനുസൃതമായ മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: ἔχοντας
  choice: മുറുകെപ്പിടിക്കുന്നവരായിരിക്കണം
  rationale: മുൻവാക്യത്തിലെ ശുശ്രൂഷകരെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല കർത്തരി കൃദന്തരൂപമാണിത്. തുടർച്ചയായ കൈവശംവെക്കലും വിശ്വാസത്തോടുള്ള ഉറച്ച ചേർന്നുനിൽപ്പും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കാൻ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: μυστήριον
  choice: മർമ്മം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഒരിക്കൽ മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെട്ടതുമായ ദൈവിക സത്യത്തെ സൂചിപ്പിക്കാം. സ്ഥിരമായി അജ്ഞേയമായ ഒന്നെന്ന ധ്വനി ഒഴിവാക്കി, പദത്തിന്റെ ഗൗരവവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: τῆς πίστεως
  choice: വിശ്വാസത്തിന്റെ
  rationale: സഭാശുശ്രൂഷകരുടെ യോഗ്യതകളെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ക്രൈസ്തവ വിശ്വാസത്തിന്റെ ഉള്ളടക്കമാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം. എന്നാൽ മലയാളത്തിൽ ഈ രൂപം വ്യക്തിപരമായ വിശ്വാസം എന്ന സാധ്യത പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: നിർമലമായ മനസ്സാക്ഷിയോടെ
  rationale: ἐν ഇവിടെ അവസ്ഥയെയോ ധാർമിക സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-യോടെ’ സ്വാഭാവികമാണ്. καθαρός എന്നതിന്റെ ശുദ്ധി/നിർമലത എന്ന അർഥം ‘നിർമലമായ’ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: συνειδήσει
  choice: മനസ്സാക്ഷി
  rationale: പൗലോസിന്റെ ധാർമിക പ്രയോഗത്തിലെ συνείδησις എന്ന പദത്തിന് ആധുനിക മലയാളത്തിലെ സാധാരണവും കൃത്യവുമായ തത്തുല്യം.
theological_decisions:
- issue: τῆς πίστεως എന്നതിലെ ‘വിശ്വാസം’ എന്ന പദത്തിന്റെ അർഥം
  choice: ക്രൈസ്തവ വിശ്വാസത്തിന്റെ ഉള്ളടക്കം എന്നതാണ് സന്ദർഭത്തിൽ മുഖ്യമായ അർഥം
  alternative: വ്യക്തിപരമായി വിശ്വസിക്കൽ; വിശ്വസ്തത
  rationale: സഭാശുശ്രൂഷകരുടെ യോഗ്യതകളെക്കുറിച്ചുള്ള സന്ദർഭം അംഗീകരിക്കപ്പെടുന്ന വിശ്വാസസത്യത്തോടുള്ള ഉറച്ച ചേർന്നുനിൽപ്പിനെ സൂചിപ്പിക്കുന്നു. എങ്കിലും മൂലപദത്തിന്റെ സ്വാഭാവിക അർഥവ്യാപ്തി വിവർത്തനത്തിൽ അനാവശ്യമായി ചുരുക്കിയിട്ടില്ല.
- issue: μυστήριον വെളിപ്പെടുത്തപ്പെട്ട രഹസ്യമാണോ എന്നത്
  choice: ‘മർമ്മം’ എന്നു മാത്രം നൽകി
  alternative: ‘വെളിപ്പെടുത്തപ്പെട്ട മർമ്മം’
  rationale: പൗലോസിന്റെ വിശാലമായ പ്രയോഗം വെളിപ്പെടുത്തപ്പെട്ട ദൈവിക സത്യത്തെ സൂചിപ്പിക്കാമെങ്കിലും, ‘വെളിപ്പെടുത്തപ്പെട്ട’ എന്ന ആശയം ഈ വാക്യത്തിൽ തുറന്നുപറഞ്ഞിട്ടില്ല; അതിനാൽ അത് മുഖ്യപാഠത്തിലേക്ക് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാപാരായണ ശൈലി. ‘മർമ്മം,’ ‘മനസ്സാക്ഷി’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; അനാവശ്യമായ സാങ്കേതിക പദപ്രയോഗം ഒഴിവാക്കി.
