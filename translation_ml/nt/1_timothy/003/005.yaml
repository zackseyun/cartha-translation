id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: ml
  text: എന്നാൽ സ്വന്തം കുടുംബത്തെ നയിക്കാൻ[a] ഒരാൾക്ക് അറിയില്ലെങ്കിൽ, അയാൾ ദൈവത്തിന്റെ സഭയെ[b] എങ്ങനെ പരിപാലിക്കും[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം കുടുംബത്തിന് നേതൃത്വം നൽകാൻ’ അല്ലെങ്കിൽ ‘അതിന്റെ ചുമതല വഹിക്കാൻ.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘ദൈവത്തിന്റെ സഭയെ.’ ‘ദൈവസഭയെ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ശ്രദ്ധയോടെ നോക്കിനടത്തും’ അല്ലെങ്കിൽ ‘കരുതും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: എന്നാൽ … എങ്കിൽ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും εἰയുടെ നിബന്ധനാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: അനിശ്ചിത ഏകവചനത്തെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മേൽവിചാരകന്റെ യോഗ്യതകളെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിനനുസരിച്ച് തുടർന്നുള്ള പരാമർശം ഏകവചനത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦ ἰδίου οἴκου
  choice: സ്വന്തം കുടുംബത്തെ
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെക്കാൾ ഒരാളുടെ ഉത്തരവാദിത്വത്തിലുള്ള കുടുംബസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. സാധാരണ മലയാളത്തിൽ ‘കുടുംബം’ ഈ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: προστῆναι
  choice: നയിക്കാൻ
  rationale: ഉത്തരവാദിത്വത്തോടെ മുന്നിൽനിന്ന് നേതൃത്വം നൽകുന്ന അർത്ഥം നൽകുന്നു; ഗ്രീക്കിലുള്ളതിനെക്കാൾ അധികാരാധിഷ്ഠിതമായ ഭാവം ചേർക്കുന്നില്ല.
- source_word: οὐκ οἶδεν
  choice: അറിയില്ലെങ്കിൽ
  rationale: അനന്തക്രിയയോടുകൂടിയ οἶδα ‘എങ്ങനെ ചെയ്യണമെന്ന് അറിയുക’ എന്ന ആശയം വഹിക്കുന്നു; മലയാളവാക്യത്തിൽ ‘നയിക്കാൻ … അറിയില്ലെങ്കിൽ’ എന്ന ഘടന അതു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: കുടുംബത്തിലെ നേതൃത്വത്തിൽനിന്ന് സഭയിലെ പരിചരണത്തിലേക്കുള്ള ആലങ്കാരിക നിഗമനചോദ്യം അതേപടി സൂക്ഷിക്കുന്നു.
- source_word: ἐκκλησίας θεοῦ
  choice: ദൈവത്തിന്റെ സഭയെ
  rationale: ഉടമസ്ഥബന്ധം സ്വാഭാവികമായ മലയാള ഷഷ്ഠീപ്രയോഗത്തിൽ നൽകുന്നു; ഈ സഭാസന്ദർഭത്തിൽ ἐκκλησίαയ്ക്ക് സ്ഥിരവും യോജിച്ചതുമായ പദം ‘സഭ’യാണ്.
- source_word: ἐπιμελήσεται
  choice: പരിപാലിക്കും
  rationale: ശ്രദ്ധയോടെയുള്ള കരുതലും ഉത്തരവാദിത്വപൂർവമായ പരിചരണവും പ്രകടമാക്കുന്നു; ആദ്യ ക്രിയയായ ‘നയിക്കുക’ എന്നതിൽനിന്നുള്ള ഗ്രീക്കിലെ വ്യത്യാസം നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുടുംബനേതൃത്വവും സഭാപരിപാലനവും തമ്മിലുള്ള ബന്ധം
  choice: കുടുംബത്തെ ‘നയിക്കുക’ എന്നും ദൈവത്തിന്റെ സഭയെ ‘പരിപാലിക്കുക’ എന്നും വ്യത്യസ്ത ക്രിയകളാൽ വിവർത്തനം ചെയ്തു.
  alternative: രണ്ടിടത്തും ‘നയിക്കുക’ ഉപയോഗിക്കുക; അല്ലെങ്കിൽ കുടുംബത്തെ ‘ഭരിക്കുക’ എന്നും സഭയെ ‘പരിപാലിക്കുക’ എന്നും നൽകുക.
  rationale: മൂലപാഠം προΐστημι, ἐπιμελέομαι എന്നീ രണ്ടു വ്യത്യസ്ത ക്രിയകൾ ഉപയോഗിക്കുന്നു. ആ വ്യത്യാസം നിലനിർത്തുന്നത് സഭാനേതൃത്വത്തെ വെറും അധികാരപ്രയോഗമായി ചുരുക്കാതെ വാക്യത്തിലെ ഉപമ സംരക്ഷിക്കുന്നു.
- issue: അനിശ്ചിത കർത്താവിന്റെ ലിംഗസൂചന
  choice: τις എന്നതിന് ‘ഒരാൾ’ എന്നും, തുടർന്നുള്ള ഏകവചനപരാമർശത്തിന് ‘അയാൾ’ എന്നും നൽകി.
  alternative: പൂർണമായി ലിംഗനിരപേക്ഷമായ ബഹുവചനഘടന ഉപയോഗിക്കുക; അല്ലെങ്കിൽ പ്രധാനപാഠത്തിൽ ‘ഒരു പുരുഷൻ’ എന്ന് വ്യക്തമാക്കുക.
  rationale: τις സ്വതവേ അനിശ്ചിതമാണ്; എന്നാൽ സമീപസന്ദർഭം മേൽവിചാരകന്റെ പുരുഷലിംഗ ഏകവചന യോഗ്യതകളിലാണ്. ‘ഒരാൾ … അയാൾ’ എന്ന രൂപം പദത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെയും സന്ദർഭത്തിന്റെ വ്യാകരണസൂചന നഷ്ടപ്പെടുത്താതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നയിക്കുക’–‘പരിപാലിക്കുക’ എന്ന വ്യത്യാസം മൂലപാഠത്തിലെ ക്രിയാഭേദം സംരക്ഷിക്കുന്നു; സഭാഭരണത്തെക്കുറിച്ചുള്ള പ്രത്യേക സഭാവിഭാഗീയ മാതൃക ഒന്നും ചേർത്തിട്ടില്ല.
