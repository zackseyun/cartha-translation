id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: ml
  text: അതുകൊണ്ട് മേൽനോട്ടക്കാരൻ കുറ്റാരോപണത്തിന് ഇടനൽകാത്തവനും ഒരു ഭാര്യയുടെ ഭർത്താവും[a], മിതശീലനും, ആത്മനിയന്ത്രണമുള്ളവനും, മാന്യമായ പെരുമാറ്റമുള്ളവനും, അതിഥിസൽക്കാരപ്രിയനും, പഠിപ്പിക്കാൻ കഴിവുള്ളവനും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു സ്ത്രീയോടുമാത്രം വിശ്വസ്തനായ പുരുഷൻ.” ഈ പ്രയോഗം വിവാഹസ്ഥിതിയെ മാത്രം സൂചിപ്പിക്കുന്നതിനുപകരം ദാമ്പത്യവിശ്വസ്തതയ്ക്ക് ഊന്നൽ നൽകുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: ആയിരിക്കണം
  rationale: ഇത് വെറും ഉപദേശമല്ല, മേൽനോട്ടക്കാരനുള്ള നിർബന്ധമായ യോഗ്യതയാണെന്ന ഗ്രീക്ക് ക്രിയയുടെ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ ചർച്ചയിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπίσκοπον
  choice: മേൽനോട്ടക്കാരൻ
  rationale: പിൽക്കാല സഭാപദവിയായ ‘ബിഷപ്പ്’ എന്നത് ഇറക്കുമതി ചെയ്യാതെ, ഗ്രീക്ക് പദത്തിന്റെ പ്രവർത്തനപരമായ അർഥം നൽകുന്നു.
- source_word: ἀνεπίλημπτον
  choice: കുറ്റാരോപണത്തിന് ഇടനൽകാത്തവൻ
  rationale: പാപരഹിതൻ എന്ന അർഥം വരുത്താതെ, സാധുവായ അപവാദത്തിനോ കുറ്റപ്പെടുത്തലിനോ വക നൽകാത്ത സാമൂഹിക-ധാർമിക നില വ്യക്തമാക്കുന്നു.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: ഒരു ഭാര്യയുടെ ഭർത്താവ്
  rationale: ഗ്രീക്കിലെ പുരുഷനിർദ്ദിഷ്ടവും വിവാഹപരവുമായ വാക്കുകൾ ഔപചാരികമായി നിലനിർത്തി, വിശ്വസ്തത, ബഹുഭാര്യത്വം, പുനർവിവാഹം എന്നിവയെക്കുറിച്ചുള്ള വ്യാഖ്യാനവിവാദം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: νηφάλιον
  choice: സമചിത്തൻ
  rationale: മദ്യവർജനത്തിൽ മാത്രം ചുരുക്കാതെ, ജാഗ്രതയും മാനസികസ്ഥിരതയും സംയമിതമായ നിലപാടും സൂചിപ്പിക്കുന്നു.
- source_word: σώφρονα
  choice: ആത്മനിയന്ത്രണമുള്ളവൻ
  rationale: വിവേകപൂർവമായ സ്വയംനിയന്ത്രണത്തിന്റെയും ശീലനിയമത്തിന്റെയും ധാർമിക ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: κόσμιον
  choice: മാന്യമായ പെരുമാറ്റമുള്ളവൻ
  rationale: ക്രമവും ഔചിത്യവും മറ്റുള്ളവരുടെ ആദരവിന് യോജിച്ച പെരുമാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: φιλόξενον
  choice: അതിഥിസൽക്കാരപ്രിയൻ
  rationale: അതിഥികളെയും അപരിചിതരെയും സ്വാഗതംചെയ്യുന്ന സന്നദ്ധത സംക്ഷിപ്തമായും പരിചിതമായും അറിയിക്കുന്നു.
- source_word: διδακτικόν
  choice: പഠിപ്പിക്കാൻ കഴിവുള്ളവൻ
  rationale: പഠിപ്പിക്കാനുള്ള വെറും മനസ്സല്ല, അതിനുള്ള പ്രാപ്തിയാണ് ഗ്രീക്ക് വിശേഷണം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: സഭാമേൽനോട്ടക്കാരന്റെ യോഗ്യതയിൽ μιᾶς γυναικὸς ἄνδρα എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘ഒരു ഭാര്യയുടെ ഭർത്താവ്’ എന്ന് ഔപചാരികമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഒരു സ്ത്രീയോടുമാത്രം വിശ്വസ്തനായ പുരുഷൻ’ അല്ലെങ്കിൽ ‘ഭാര്യയോടു വിശ്വസ്തനായവൻ’.
  rationale: ഈ പ്രയോഗം ദാമ്പത്യവിശ്വസ്തതയെ ഊന്നുന്നതാണോ, ബഹുഭാര്യത്വം നിരോധിക്കുന്നതാണോ, പുനർവിവാഹവുമായി ബന്ധപ്പെട്ട നിയന്ത്രണം സൂചിപ്പിക്കുന്നതാണോ എന്നത് വിവാദവിഷയമാണ്. മുഖ്യപാഠം അതിന്റെ രൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് പ്രധാന സാധ്യത വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാ-ധാർമിക ഭാഷ ഉപയോഗിച്ചു. ഗുണവിശേഷങ്ങളുടെ പട്ടികയിൽ ആവർത്തിക്കുന്ന ‘-വനും’ ഘടന നിലനിർത്തി വായനാസൗകര്യവും വ്യാകരണസമന്വയവും ഉറപ്പാക്കി.
