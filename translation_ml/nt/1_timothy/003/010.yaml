  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: ml
  text: ഇവരെയും ആദ്യം പരിശോധിക്കട്ടെ; പിന്നെ, കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവരായി[b] അവർ ശുശ്രൂഷ ചെയ്യട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ ഡീക്കന്മാരായി ശുശ്രൂഷ ചെയ്യട്ടെ.” ഗ്രീക്ക് ക്രിയയുടെ അർഥം “സേവിക്കുക/ശുശ്രൂഷിക്കുക” എന്നാണ്; ഇവിടെ ഡീക്കന്മാരുടെ യോഗ്യതകളാണ് സന്ദർഭം, അതിനാൽ ഈ സേവനത്തിന് ഡീക്കൻ-സ്ഥാനവുമായി ബന്ധമുള്ള സൂചന ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കുറ്റമറ്റവരായി.” അവർക്കെതിരെ സാധുവായ കുറ്റാരോപണം ഉന്നയിക്കാൻ കഴിയാത്ത നിലയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അവർ പാപരഹിതരാണെന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ഇവരെയും
  rationale: മുൻവാക്യങ്ങളിൽ പരാമർശിച്ചുകൊണ്ടിരിക്കുന്ന ഡീക്കന്മാരിലേക്കുള്ള സൂചനയും δέ നൽകുന്ന ‘കൂടാതെ/യും’ എന്ന ബന്ധവും സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ‘പുരുഷന്മാർ’ എന്ന നാമം പ്രത്യേകം ഇല്ല.
- source_word: δοκιμαζέσθωσαν
  choice: പരിശോധിക്കട്ടെ
  rationale: യോഗ്യതയോ വിശ്വാസ്യതയോ നിർണയിക്കുന്നതിനായി പരീക്ഷിച്ചറിയുക/പരിശോധിക്കുക എന്ന അർഥം നൽകുന്നു; മൂന്നാംപുരുഷ ആജ്ഞാരൂപവും നിലനിർത്തുന്നു.
- source_word: πρῶτον … εἶτα
  choice: ആദ്യം … അതിനുശേഷം
  rationale: പരിശോധന സേവനത്തിനു മുമ്പാകണം എന്ന ക്രമം വ്യക്തമായി പകർന്നുനൽകുന്നു.
- source_word: διακονείτωσαν
  choice: ഡീക്കന്മാരായി ശുശ്രൂഷ ചെയ്യട്ടെ
  rationale: ക്രിയയുടെ അടിസ്ഥാനമായ ‘സേവിക്കുക/ശുശ്രൂഷിക്കുക’ എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട്, തൊട്ടുമുമ്പുള്ള സന്ദർഭം ഡീക്കന്മാരുടെ യോഗ്യതകളെക്കുറിച്ചാണെന്ന ഔദ്യോഗിക ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ἀνέγκλητοι
  choice: കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവരായി
  rationale: പാപരഹിതരെന്നല്ല, സാധുവായ കുറ്റം ചുമത്താൻ വകയില്ലാത്തവരെന്ന യോഗ്യതാസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὄντες
  choice: …വരായി
  rationale: സേവനത്തോടൊപ്പം നിലനിൽക്കേണ്ട അവസ്ഥയെ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: διακονείτωσαν എന്നത് പൊതുവായ ‘സേവിക്കുക’ എന്നോ സ്ഥാനസംബന്ധമായ ‘ഡീക്കന്മാരായി ശുശ്രൂഷിക്കുക’ എന്നോ വിവർത്തനം ചെയ്യണമോ
  choice: ഡീക്കന്മാരായി ശുശ്രൂഷ ചെയ്യട്ടെ
  alternative: ശുശ്രൂഷ ചെയ്യട്ടെ / സേവിക്കട്ടെ
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം ഡീക്കന്മാരുടെ യോഗ്യതകളാണ്; അതിനാൽ ഇവിടെ സേവനം അംഗീകരിക്കപ്പെട്ട ഡീക്കൻ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് ക്രിയയിൽ ‘ഡീക്കൻ’ എന്ന നാമം പ്രത്യേകം ഇല്ലെന്ന കാര്യം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ἀνέγκλητοι പാപരഹിതമായ പൂർണതയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവരായി
  alternative: കുറ്റമറ്റവരായി
  rationale: യോഗ്യതാപട്ടികയിൽ ഈ പദം സാധുവായ കുറ്റാരോപണത്തിന് വകയില്ലാത്ത നിലയാണ് സൂചിപ്പിക്കുന്നത്; സമ്പൂർണ പാപരാഹിത്യം അല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സഭാസന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ആജ്ഞാരൂപവും പ്രവർത്തനക്രമവും കൃദന്തരൂപത്തിന്റെ അനുബന്ധഭാവവും കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് നേരിട്ട് ചേർത്തിരിക്കുന്നു.
