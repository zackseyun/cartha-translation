id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ വരാൻ വൈകിയാൽ, ദൈവത്തിന്റെ കുടുംബത്തിൽ[a] ഒരാൾ എങ്ങനെ പെരുമാറേണ്ടതാണെന്ന് നീ അറിയേണ്ടതിനാണ് ഞാൻ ഇതെഴുതുന്നത്. ആ കുടുംബം ജീവനുള്ള ദൈവത്തിന്റെ സഭയാണ്—സത്യത്തിന്റെ തൂണും ഉറച്ച താങ്ങും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ ഭവനത്തിൽ.” ഇവിടെ “ഭവനം” എന്നത് ദൈവജനമാകുന്ന കുടുംബത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “ഉറച്ച താങ്ങ്” എന്നതിന് “അടിത്തറ,” “പിന്തുണ,” അല്ലെങ്കിൽ “ഉറപ്പിക്കൽ” എന്നും പരിഭാഷ നിർദേശിക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: ഞാൻ വരാൻ വൈകിയാൽ
  rationale: സന്ദർഭത്തിൽ പൗലോസിന്റെ വരവ് വൈകുന്നതാണ് ഉദ്ദേശ്യം; ധാർമികമായ മന്ദതയല്ല. ‘വരാൻ’ എന്നത് മലയാളത്തിൽ ഈ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἵνα εἰδῇς
  choice: നീ അറിയേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യവാക്യത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δεῖ
  choice: വേണ്ടതാണ്
  rationale: നിർബന്ധസ്വഭാവമുള്ള മാനദണ്ഡത്തെ അതിരുകടന്ന കാഠിന്യമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: ἐν οἴκῳ θεοῦ
  choice: ദൈവത്തിന്റെ കുടുംബത്തിൽ
  rationale: οἶκος എന്നത് വീടിനെയും കുടുംബത്തെയും സൂചിപ്പിക്കാം. പിന്നാലെ അതിനെ ἐκκλησία എന്നു വിശദീകരിക്കുന്നതിനാൽ ഇവിടെ കെട്ടിടത്തേക്കാൾ ദൈവജനമാകുന്ന കുടുംബമാണ് മുൻനിരയിൽ വരുന്നത്.
- source_word: ἀναστρέφεσθαι
  choice: ഒരാൾ എങ്ങനെ പെരുമാറണം
  rationale: ജീവിതരീതിയെയും പെരുമാറ്റത്തെയും സൂചിപ്പിക്കുന്ന മധ്യരൂപത്തിന്റെ പൊതുവായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ അനിർദ്ദിഷ്ട കർത്താവിനെ ‘ഒരാൾ’ എന്നു പ്രകടമാക്കുന്നു.
- source_word: ἥτις ἐστὶν
  choice: ആ കുടുംബം ... സഭയാണ്
  rationale: ബന്ധവാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκκλησία
  choice: സഭ
  rationale: ദൈവത്തിന്റെ കൂടിവന്ന ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പദം. ഇവിടെ അത് ഒരു കെട്ടിടത്തെ സൂചിപ്പിക്കുന്നില്ലെന്ന് ‘കുടുംബം’ എന്ന മുൻപദം വ്യക്തമാക്കുന്നു.
- source_word: θεοῦ ζῶντος
  choice: ജീവനുള്ള ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് സമാസത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ രൂപം; ‘ജീവനുള്ള’ എന്ന ദൈവശാസ്ത്രപരമായ വിശേഷണം സംരക്ഷിക്കുന്നു.
- source_word: στῦλος
  choice: തൂൺ
  rationale: വാസ്തുശില്പരൂപകം വ്യക്തമായി നിലനിർത്തുന്ന സാധാരണ മലയാളപദം.
- source_word: ἑδραίωμα
  choice: ഉറച്ച താങ്ങ്
  rationale: സ്ഥിരത നൽകുന്നതോ ഉറപ്പിച്ചുനിർത്തുന്നതോ ആയ ഒന്നെന്ന അപൂർവ ഗ്രീക്ക് പദത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു; ‘അടിത്തറ’ എന്ന ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് രൂപകത്തെ ചുരുക്കുന്നില്ല.
- source_word: τῆς ἀληθείας
  choice: സത്യത്തിന്റെ
  rationale: നിശ്ചിതമായ ‘സത്യം’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവിക ഷഷ്ഠീബന്ധത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐκκλησία എന്ന പദത്തിന്റെ സഭാശാസ്ത്രപരമായ വിവർത്തനം
  choice: സഭ
  alternative: കൂടിവന്ന സമൂഹം; വിശ്വാസിസമൂഹം
  rationale: ‘സഭ’ മലയാളത്തിൽ കൂടിവന്ന ദൈവജനത്തെയും ക്രിസ്തീയ സമൂഹത്തെയും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. അതിനെ കെട്ടിടമോ പിൽക്കാല സ്ഥാപനഘടനയോ മാത്രമായി വ്യാഖ്യാനിക്കാതെ, ‘ദൈവത്തിന്റെ കുടുംബം’ എന്ന സമാനാധികരണവാക്യം അർഥം നിയന്ത്രിക്കുന്നു.
- issue: സഭ ‘സത്യത്തിന്റെ തൂണും ἑδραίωμα-വും’ ആണെന്ന അവകാശവാദം
  choice: സത്യത്തിന്റെ തൂണും ഉറച്ച താങ്ങും
  alternative: സത്യത്തിന്റെ തൂണും അടിത്തറയും; സത്യത്തിന്റെ തൂണും കോട്ടയും
  rationale: ഗ്രീക്ക് വാക്യഘടനയിലെ ശക്തമായ സഭാശാസ്ത്രപരമായ അവകാശവാദം സംരക്ഷിക്കുന്നു; അതേസമയം സഭയാണ് സത്യത്തിന്റെ ഉത്ഭവകാരണം എന്ന അധിക നിഗമനം വാചകത്തിൽ ചേർക്കുന്നില്ല. അപൂർവമായ ἑδραίωμα എന്ന പദത്തിന്റെ യഥാർഥ പദാർഥപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ഞാൻ ഇതെഴുതുന്നത്’ എന്നത് മുൻവാക്യത്തിലെ എഴുത്തിനെ ആശ്രയിക്കുന്ന ഗ്രീക്ക് ഉദ്ദേശ്യവാക്യം ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ പൂർണമാക്കുന്നു. ദീർഘവാക്യത്തിന്റെ വിശദീകരണബന്ധം ഒരു പൂർണവിരാമവും ദീർഘരേഖയും ഉപയോഗിച്ച് വ്യക്തമായി ക്രമീകരിച്ചിരിക്കുന്നു.
