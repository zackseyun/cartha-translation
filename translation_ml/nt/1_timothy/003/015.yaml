  naturalness: The prose is clear, dignified, and natural in modern standard Malayalam. “ദൈവത്തിന്റെ കുടുംബത്തിൽ” and “സത്യത്തിന്റെ തൂണും ഉറച്ച താങ്ങും” communicate the intended social and architectural images effectively.
