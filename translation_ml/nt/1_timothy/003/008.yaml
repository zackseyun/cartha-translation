  text: ഡീക്കന്മാരും അതുപോലെ മാന്യരായിരിക്കണം; ഒരാളോടൊന്നും മറ്റൊരാളോട് മറ്റൊന്നും പറയുന്നവരാകരുത്[a]; അധികം വീഞ്ഞിൽ ആസക്തരാകരുത്[b]; നിന്ദ്യമായ ലാഭം മോഹിക്കുന്നവരാകരുത്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘രണ്ടുവാക്കുള്ളവർ’; അതായത്, ഒരാളോട് ഒരു കാര്യവും മറ്റൊരാളോട് മറ്റൊരു കാര്യവും പറയുന്നവർ.
