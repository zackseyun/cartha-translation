id: 1TI.3.3
reference: 1 Timothy 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πάροινον, μὴ ⸀πλήκτην, ἀλλὰ ἐπιεικῆ, ἄμαχον, ἀφιλάργυρον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/003.yaml
  text: not given to drunkenness[a], not violent, but gentle, peaceable, free from the love of money[d][c][b],
translation:
  language: ml
  text: മദ്യാസക്തനല്ല[a], അക്രമിയല്ല[b], മറിച്ച് സൗമ്യനും കലഹിക്കാത്തവനും[c] പണത്തെ സ്നേഹിക്കാത്തവനും[d] ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വീഞ്ഞിന് അടിമപ്പെട്ടവനല്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘അടിക്കുന്നവനല്ല’; ശാരീരിക ആക്രമണപ്രവണതയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘സമാധാനപ്രിയനും.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘പണത്തോടുള്ള സ്നേഹത്തിൽനിന്ന് സ്വതന്ത്രനും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάροινον
  choice: മദ്യാസക്തനല്ല
  rationale: വീഞ്ഞിനോടോ മദ്യപാനത്തോടോ പതിവായി അടിമപ്പെട്ട സ്വഭാവത്തെ ഈ പദം സൂചിപ്പിക്കുന്നു. പ്രത്യേക പാനീയമായ വീഞ്ഞിൽ ഒതുക്കാതെ, ആധുനിക മലയാളത്തിൽ ദുശ്ശീലം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: πλήκτην
  choice: അക്രമിയല്ല
  rationale: അക്ഷരാർഥത്തിൽ അടിക്കുന്നവൻ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന പദമാണിത്; യോഗ്യതകളുടെ പട്ടികയിൽ ശാരീരിക ആക്രമണപ്രവണതയുള്ള സ്വഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അക്രമി’ യോജിക്കുന്നു.
- source_word: ἐπιεικῆ
  choice: സൗമ്യനും
  rationale: സൗമ്യത, വിട്ടുവീഴ്ച, ന്യായബോധമുള്ള പരിഗണന എന്നിവ ഉൾക്കൊള്ളുന്ന പദം. ഈ സംക്ഷിപ്ത പട്ടികയിൽ ‘സൗമ്യൻ’ സ്വാഭാവികവും മാന്യവുമായ പരിഭാഷയാണ്.
- source_word: ἄμαχον
  choice: കലഹിക്കാത്തവനും
  rationale: വഴക്കിനോ പോരിനോ മുതിരാത്തവൻ എന്ന നിഷേധാത്മക രൂപം ഗ്രീക്കിന്റെ ഘടനയും അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀφιλάργυρον
  choice: പണത്തെ സ്നേഹിക്കാത്തവനും
  rationale: പണത്തോടുള്ള സ്നേഹത്തെ നിഷേധിക്കുന്ന ഗ്രീക്ക് സംയുക്തപദത്തിന്റെ ആന്തരിക മനോഭാവം നേരിട്ട് സംരക്ഷിക്കുന്നു; വെറും സാമ്പത്തിക അത്യാഗ്രഹമായി അർഥം ചുരുക്കുന്നില്ല.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ യോഗ്യതാപട്ടിക. ഗ്രീക്കിലെ μὴ… μὴ… ἀλλά എന്ന വിരുദ്ധഘടന ‘അല്ല… അല്ല, മറിച്ച്…’ എന്ന രൂപത്തിൽ നിലനിർത്തി. എല്ലാ വിശേഷണങ്ങളെയും ‘ആയിരിക്കണം’ എന്നതോട് ചേർത്ത് വായിക്കാവുന്ന വിധത്തിൽ പുരുഷ ഏകവചനരൂപം ഉപയോഗിച്ചു.
