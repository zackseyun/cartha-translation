id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: ml
  text: അതുപോലെ, സ്ത്രീകൾ മാന്യരും[a] അപവാദം പറയാത്തവരും സംയമനമുള്ളവരും എല്ലാ കാര്യങ്ങളിലും വിശ്വസ്തരും ആയിരിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അതുപോലെ, ഭാര്യമാർ മാന്യരും...” ഈ സന്ദർഭത്തിൽ γυναῖκας എന്ന ഗ്രീക്കുപദത്തിന് “സ്ത്രീകൾ” എന്നോ “ഭാര്യമാർ” എന്നോ അർഥമാകാം; “അവരുടെ ഭാര്യമാർ” എന്ന് പാഠം വ്യക്തമായി പറയുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: സ്ത്രീകൾ
  rationale: γυνή എന്ന പദത്തിന് സന്ദർഭത്തിൽ ‘സ്ത്രീകൾ’ എന്നും ‘ഭാര്യമാർ’ എന്നും അർഥമാകാം. ഇവിടെ ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന പദമില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘സ്ത്രീകൾ’ എന്നു നൽകി, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὡσαύτως
  choice: അതുപോലെ
  rationale: മുമ്പുള്ള യോഗ്യതാപട്ടികയോടുള്ള ഘടനാപരമായ സമാന്തര്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σεμνάς
  choice: മാന്യരും
  rationale: ഗൗരവം, ആദരണീയത, മാന്യമായ പെരുമാറ്റം എന്നിവ ഉൾക്കൊള്ളുന്ന σεμνός എന്ന പദത്തിന്റെ അർഥം സാധാരണ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: μὴ διαβόλους
  choice: അപവാദം പറയാത്തവരും
  rationale: ഇവിടെ διάβολος ഒരു വിശേഷണമായി ദൂഷണം അല്ലെങ്കിൽ അപവാദം പറയുന്ന സ്വഭാവത്തെ സൂചിപ്പിക്കുന്നു; ‘പിശാച്’ എന്ന പേരല്ല.
- source_word: νηφαλίους
  choice: സമചിത്തരും
  rationale: മദ്യലഹരിയില്ലായ്മ എന്ന അക്ഷരാർഥത്തോടൊപ്പം മനസ്സിന്റെ ജാഗ്രതയും നിയന്ത്രിതാവസ്ഥയും സൂചിപ്പിക്കുന്ന പദം; ‘സമചിത്തർ’ ആ വിപുലമായ നൈതിക ഗുണം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πιστὰς
  choice: വിശ്വസ്തരും
  rationale: ആശ്രയിക്കാവുന്നവരും എല്ലാറ്റിലും വിശ്വാസ്യത പുലർത്തുന്നവരുമെന്ന സ്വഭാവഗുണം വ്യക്തമാക്കുന്നു; πιστ- പദകുടുംബത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐν πᾶσιν
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ വ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യോഗ്യതാപട്ടികയിലെ γυναῖκας എന്ന പദത്തിന്റെ സൂചിതവിഭാഗം
  choice: സ്ത്രീകൾ
  alternative: ഭാര്യമാർ; അവരുടെ ഭാര്യമാർ
  rationale: ഇത് ശുശ്രൂഷയിൽ ഏർപ്പെട്ട സ്ത്രീകളെയോ പുരുഷ ശുശ്രൂഷകരുടെ ഭാര്യമാരെയോ സൂചിപ്പിക്കാം. γυνή ഇരു അർഥങ്ങളും അനുവദിക്കുന്നു; എന്നാൽ ‘അവരുടെ’ എന്ന ഉടമസ്ഥപദം ഗ്രീക്കിലില്ല. അതിനാൽ മുഖ്യപാഠം വിശാലമായി നിലനിർത്തി ‘ഭാര്യമാർ’ എന്ന പ്രധാന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ, സഭാവായനയ്ക്ക് യോജിച്ച മാന്യവും വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത ഗുണപ്പട്ടിക മലയാളത്തിലെ സ്വാഭാവിക ബഹുവചനവാക്യഘടനയിൽ അവതരിപ്പിച്ചിരിക്കുന്നു.
