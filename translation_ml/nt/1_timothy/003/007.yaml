id: 1TI.3.7
reference: 1 Timothy 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: ml
  text: കൂടാതെ, പുറത്തുള്ളവരിൽനിന്ന്[a] അദ്ദേഹത്തിന് നല്ല സാക്ഷ്യം ഉണ്ടായിരിക്കണം; അങ്ങനെ അദ്ദേഹം നിന്ദയിലും[b] പിശാചിന്റെ കെണിയിലും[c] വീഴാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പുറത്തുള്ളവരിൽനിന്ന്.’ ഈ പ്രയോഗം ക്രിസ്തീയ സമൂഹത്തിനു പുറത്തുള്ള ആളുകളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അപമാനം.’
    reason: lexical_alternative
  - marker: c
    text: διάβολος എന്ന പദം കൂടുതൽ പൊതുവായ അർത്ഥത്തിൽ എടുത്താൽ, ‘അപവാദിയുടെ കെണി’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ അത് ‘പിശാച്’ എന്നു മനസ്സിലാക്കിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: കൂടാതെ ... ഉണ്ടായിരിക്കണം
  rationale: മുൻപത്തെ യോഗ്യതകളോട് മറ്റൊന്ന് കൂട്ടിച്ചേർക്കുന്നതും അതിന്റെ നിർബന്ധസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: നല്ല സാക്ഷ്യം ഉണ്ടായിരിക്കണം
  rationale: μαρτυρία എന്നതിലെ സാക്ഷ്യം/അനുകൂലമായ സാക്ഷ്യപ്പെടുത്തൽ എന്ന ആശയം നിലനിർത്തുന്നു; ‘നല്ല പേര്’ എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: പുറത്തുള്ളവരിൽനിന്നും
  rationale: ക്രിസ്തീയ സമൂഹത്തിനു പുറത്തുള്ള ആളുകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകാത്മക തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ἵνα μὴ
  choice: അങ്ങനെ ... വീഴാതെയും ... അകപ്പെടാതെയും ഇരിക്കും
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന നിഷേധഘടന വായനാസൗകര്യമുള്ള മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: നിന്ദയിൽ വീഴാതെയും
  rationale: ὀνειδισμός എന്നതിലെ അപമാനം, പഴി, പൊതുനിന്ദ എന്നീ അർത്ഥപരിധികളോട് ചേർന്നുനിൽക്കുകയും ‘വീഴുക’ എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: παγίδα
  choice: കെണി
  rationale: പിടികൂടാനുള്ള കുടുക്ക് എന്ന രൂപകം സ്വാഭാവികവും ബൈബിൾ ഭാഷാശൈലിക്ക് യോജിച്ചതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ διαβόλου
  choice: പിശാചിന്റെ
  rationale: പുതിയനിയമത്തിലെ സാധാരണ വ്യക്തിപരമായ സൂചന അനുസരിച്ച് διάβολος എന്നത് പിശാചിനെ സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുന്നു; ഗ്രീക്ക് ജനിറ്റീവ് സ്വാഭാവികമായ മലയാള ഉടമസ്ഥരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τοῦ διαβόλου എന്നതിന്റെ അർത്ഥം
  choice: 'വ്യക്തിപരമായ ദുഷ്ടനായ പിശാച്: ‘പിശാചിന്റെ കെണി’'
  alternative: ‘അപവാദിയുടെ കെണി’ അഥവാ അപവാദവുമായി ബന്ധപ്പെട്ട കെണി
  rationale: പാസ്റ്ററൽ ലേഖനങ്ങളിലും വിശാലമായ പുതിയനിയമ ഉപയോഗത്തിലും διάβολος സാധാരണയായി പിശാച്/സാത്താൻ എന്ന വ്യക്തിപരമായ സൂചനയാണ്. എന്നാൽ ‘അപവാദി’ എന്ന പദാർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മേൽവിചാരകൻ’ എന്ന കർത്താവ് മുൻവാക്യങ്ങളിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നതിനാൽ ഗ്രീക്കിലെപ്പോലെ ഇവിടെ പേര് ആവർത്തിക്കാതെ ലിംഗസൂചകമായ ‘അയാൾ’ ഉപയോഗിച്ചു. സാക്ഷ്യം, നിന്ദ, കെണി എന്നീ പ്രധാന രൂപകങ്ങളും ആശയങ്ങളും പരമാവധി നിലനിർത്തി.
