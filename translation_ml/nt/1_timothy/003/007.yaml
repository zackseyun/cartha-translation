- from: കൂടാതെ, പുറത്തുള്ളവരിൽനിന്നും[a] അയാൾക്ക് നല്ല സാക്ഷ്യം ഉണ്ടായിരിക്കണം; അങ്ങനെ അയാൾ നിന്ദയിൽ[b] വീഴാതെയും പിശാചിന്റെ കെണിയിൽ[c] അകപ്പെടാതെയും ഇരിക്കും.
