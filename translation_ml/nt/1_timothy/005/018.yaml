id: 1TI.5.18
reference: 1 Timothy 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: ml
  text: എന്തെന്നാൽ, തിരുവെഴുത്ത് ഇപ്രകാരം പറയുന്നു:[a] “മെതിക്കുമ്പോൾ കാളയുടെ വായ് കെട്ടരുത്”; കൂടാതെ,[b] “വേലക്കാരൻ തന്റെ കൂലിക്ക് അർഹനാണ്.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധാന്യം ചവിട്ടിമെതിക്കുമ്പോൾ.” ഗ്രീക്ക് കൃദന്തം മെതിക്കൽപ്രവൃത്തിയിൽ ഏർപ്പെട്ടിരിക്കുന്ന കാളയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വേലക്കാരൻ തന്റെ പ്രതിഫലത്തിന് അർഹനാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: തിരുവെഴുത്ത് പറയുന്നതിങ്ങനെ
  rationale: γάρ മുൻവാക്യത്തിന്റെ വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ബന്ധം സന്ദർഭത്തോടൊപ്പം സ്വാഭാവികമായി വ്യക്തമാകുന്നു. ἡ γραφή അധികാരമുള്ള വിശുദ്ധലിഖിതത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തിരുവെഴുത്ത്’ എന്നും, നിലനിൽക്കുന്ന സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല λέγει ‘പറയുന്നതിങ്ങനെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: Βοῦν
  choice: കാളയുടെ
  rationale: βοῦς ഇവിടെ ധാന്യം മെതിക്കാൻ ഉപയോഗിക്കുന്ന കാളയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘കാള’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἀλοῶντα
  choice: മെതിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: ഈ വർത്തമാനകാല കൃദന്തം കാള മെതിക്കൽപ്രവൃത്തിയിൽ ഏർപ്പെട്ടിരിക്കുമ്പോഴുള്ള സമകാലിക പ്രവർത്തിയെ സൂചിപ്പിക്കുന്നു. ‘മെതിച്ചുകൊണ്ടിരിക്കുന്ന’ അത് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ φιμώσεις
  choice: വായ് കെട്ടരുത്
  rationale: ഭാവികാലരൂപത്തിന് ഇവിടെ നിരോധനാത്മക ബലമുണ്ട്. മൃഗത്തെ ധാന്യം തിന്നാതിരിക്കാൻ അതിന്റെ വായ് കെട്ടുന്നതിനെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘വായ് കെട്ടരുത്’ എന്നു പറയുന്നു.
- source_word: καί
  choice: കൂടാതെ
  rationale: καί രണ്ടു ഉദ്ധരണികളെയും കൂട്ടിയിണക്കുന്നു. രണ്ടാമത്തെ ഉദ്ധരണിയും അതേ ആമുഖത്തിന് കീഴിലാണെന്ന് ‘കൂടാതെ’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: വേലക്കാരൻ … അർഹനാണ്
  rationale: ἐργάτης ജോലി ചെയ്യുന്ന ആളെ സൂചിപ്പിക്കുന്നു. ‘വേലക്കാരൻ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും പ്രസ്തുത പഴമൊഴിയുടെ ഗൗരവത്തിന് അനുയോജ്യവുമാണ്; ἄξιος എന്നതിന്റെ അവകാശയോഗ്യത ‘അർഹനാണ്’ കൃത്യമായി നൽകുന്നു.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: തന്റെ കൂലിക്ക്
  rationale: μισθός ഇവിടെ ചെയ്ത ജോലിക്കുള്ള പ്രതിഫലമാണ്; അതിനാൽ ‘കൂലി’ യോജിക്കുന്നു. αὐτοῦ ഏകവചന പുല്ലിംഗമാണെങ്കിലും മലയാളത്തിൽ കർത്താവിലേക്കു തിരിച്ചുപോകുന്ന സ്വാഭാവിക രൂപം ‘തന്റെ’ ആണ്; ഇത് ഏകവചനം നിലനിർത്തുന്നു.
theological_decisions:
- issue: γραφή എന്ന ആമുഖത്തിന്റെ പരിധിയും രണ്ടു ഉദ്ധരണികളും
  choice: രണ്ടു ഉദ്ധരണികളെയും ‘തിരുവെഴുത്ത് പറയുന്നതിങ്ങനെ’ എന്ന ഒറ്റ ആമുഖത്തിന് കീഴിൽ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ആദ്യത്തെ ഉദ്ധരണിയെ മാത്രം തിരുവെഴുത്തായും രണ്ടാമത്തേതിനെ പഴമൊഴിയോ കർത്താവിന്റെ വചനമോ ആയി പ്രത്യേകം കാണിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടു വചനങ്ങളെയും ഒരേ ആമുഖത്തിന് കീഴിൽ കൂട്ടിയിണക്കുന്നു. കാനോനിനെക്കുറിച്ചുള്ള തുടർ നിഗമനങ്ങൾ പരിഭാഷയിൽ നിർബന്ധിച്ച് ചേർക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
- issue: αὐτοῦ എന്നതിന്റെ ലിംഗവും ഏകവചനവും
  choice: ‘തന്റെ കൂലിക്ക്’ എന്ന് നൽകി ഏകവചനവും കർത്താവുമായുള്ള ബന്ധവും നിലനിർത്തി.
  alternative: ‘അവരുടെ കൂലിക്ക്’ എന്ന ലിംഗനിരപേക്ഷ ബഹുവചനം ഉപയോഗിക്കുക.
  rationale: മലയാളത്തിലെ സ്വാഭാവിക പ്രതിഫലന സർവനാമമായ ‘തന്റെ’ ഗ്രീക്കിലെ ഏകവചനബന്ധം കാത്തുസൂക്ഷിക്കുന്നു; അനാവശ്യമായി ബഹുവചനമാക്കുന്നില്ല. ‘വേലക്കാരൻ’ എന്ന നാമം ഉറവിടത്തിലെ പുല്ലിംഗ ഏകവചനരൂപവും പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമനിരോധനത്തിന്റെ ബലം ‘വായ് കെട്ടരുത്’ എന്നും, തൊഴിൽപ്രതിഫലത്തിന്റെ സാധാരണ അർത്ഥം ‘കൂലി’ എന്നും നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
