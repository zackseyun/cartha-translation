id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: ml
  text: ദൈവത്തിന്റെയും മശീഹാ യേശുവിന്റെയും തിരഞ്ഞെടുക്കപ്പെട്ട ദൂതന്മാരുടെയും[a] സന്നിധിയിൽ, മുൻകൂർവിധിയില്ലാതെ[b] ഇവ പാലിക്കണമെന്നും പക്ഷപാതത്തോടെ[c] ഒന്നും ചെയ്യരുതെന്നും ഞാൻ നിന്നോട് ഗൗരവപൂർവം ആജ്ഞാപിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരഞ്ഞെടുത്ത ദൂതന്മാർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മുൻവിധിയില്ലാതെ’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദത്തിന് മുൻകൂട്ടിയുള്ള വിധിനിർണയം എന്ന ഭാവവുമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഒരുവശത്തേക്കുള്ള ചായ്‌വോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: ഞാൻ നിന്നോട് ഗൗരവപൂർവം ആജ്ഞാപിക്കുന്നു
  rationale: സാക്ഷികളുടെ സന്നിധിയിൽ നൽകുന്ന ശക്തവും ഔപചാരികവുമായ കൽപ്പനയാണ് ഇവിടെ ക്രിയ സൂചിപ്പിക്കുന്നത്; വെറും ‘സാക്ഷ്യപ്പെടുത്തുന്നു’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം സന്ദർഭോചിതമാണ്.
- source_word: ἐνώπιον
  choice: സന്നിധിയിൽ
  rationale: ദൈവിക സാക്ഷികളുടെ മുമ്പിൽ നൽകുന്ന ഗൗരവമേറിയ ആജ്ഞയുടെ ഭാവം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തനായ രാജാവ്/മശീഹാ എന്ന ശീർഷകാർഥം വ്യക്തമാക്കുന്നു; ‘ക്രിസ്തുയേശു’ എന്ന പാരമ്പര്യ ലിപ്യന്തരണം മാത്രം ആശ്രയിക്കുന്നില്ല.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട ദൂതന്മാർ
  rationale: ἐκλεκτός എന്നതിലെ തിരഞ്ഞെടുപ്പ് എന്ന ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു; ആരാൽ, എന്തിനായി തിരഞ്ഞെടുക്കപ്പെട്ടു എന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതു കൂട്ടിച്ചേർത്തിട്ടില്ല.
- source_word: ταῦτα
  choice: ഇവ
  rationale: സമീപസന്ദർഭത്തിലെ നിർദേശങ്ങളിലേക്കാണ് സൂചന; ‘ഈ നിർദേശങ്ങൾ’ എന്ന് വ്യാഖ്യാനിച്ച് പരിധി ചുരുക്കാതെ ഗ്രീക്കിലെ പൊതുവായ സൂചന നിലനിർത്തുന്നു.
- source_word: φυλάξῃς
  choice: പാലിക്കുകയും
  rationale: ഇവിടെ φυλάσσω നിർദേശങ്ങൾ വിശ്വസ്തമായി അനുസരിക്കുക/പാലിക്കുക എന്ന അർഥത്തിലാണ്; ‘കാക്കുക’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭത്തിൽ സ്വാഭാവികം.
- source_word: χωρὶς προκρίματος
  choice: മുൻകൂർ വിധിയില്ലാതെ
  rationale: πρόκριμα ഒരു കാര്യം പരിശോധിക്കുന്നതിനു മുമ്പേ ഉണ്ടാക്കുന്ന വിധിയെയോ മുൻവിധിനിർണയത്തെയോ സൂചിപ്പിക്കുന്നു; പിന്നാലെയുള്ള പക്ഷപാതത്തിൽനിന്നുള്ള വ്യത്യാസവും ഈ വിവർത്തനം കാക്കുന്നു.
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: പക്ഷപാതത്തോടെ ഒന്നും ചെയ്യാതിരിക്കുകയും
  rationale: πρόσκλισις ഒരുവശത്തേക്കുള്ള ചായ്‌വ്, പക്ഷപാതം, പ്രീതിപൂർവമായ അനുകൂലനം എന്നിവ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ നിരോധനമായി ക്രിയാഭാഗം അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന ശീർഷകത്തിന്റെ വിവർത്തനം
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ ഔപചാരിക ആഹ്വാനത്തിൽ Χριστός എന്നതിന്റെ ശീർഷകാർഥം സജീവമായി നിലനിൽക്കുന്നു. അതിനാൽ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ സ്വീകരിച്ചു; പദം വെറും പേരുപോലെ മാത്രം വായിക്കണമെന്ന് നിർബന്ധിച്ചിട്ടില്ല.
- issue: ἐκλεκτῶν ἀγγέλων എന്നതിലെ തിരഞ്ഞെടുപ്പ്
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട ദൂതന്മാർ
  alternative: തിരഞ്ഞെടുത്ത ദൂതന്മാർ
  rationale: ഗ്രീക്ക് വാക്യം തിരഞ്ഞെടുപ്പിന്റെ കർത്താവിനെയോ ഉദ്ദേശ്യത്തെയോ വിശദീകരിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക ദൂതശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കാതെ വിശേഷണത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തി.
- issue: πρόκριμα, πρόσκλισις എന്നീ പദങ്ങളുടെ വ്യത്യാസം
  choice: മുൻകൂർ വിധി; പക്ഷപാതം
  alternative: മുൻവിധി; ഒരുവശത്തേക്കുള്ള ചായ്‌വ്
  rationale: ആദ്യത്തേത് മുൻകൂട്ടിയുള്ള വിധിനിർണയത്തെയും രണ്ടാമത്തേത് ഒരുവശത്തോടുള്ള അനുകൂല ചായ്‌വിനെയും സൂചിപ്പിക്കുന്നതായി വേർതിരിച്ചു; രണ്ടും ‘പക്ഷപാതം’ എന്നു ലയിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഗൗരവപൂർവം ആജ്ഞാപിക്കുന്നു’ എന്നത് മൂലത്തിലെ ഔപചാരിക ശക്തി നിലനിർത്തുന്നു. ‘മുൻകൂർ വിധി’യും ‘പക്ഷപാതം’യും വേർതിരിച്ച് മൂലത്തിലെ രണ്ടു ബന്ധപ്പെട്ടെങ്കിലും വ്യത്യസ്തമായ ആശയങ്ങൾ സംരക്ഷിച്ചിട്ടുണ്ട്.
