  rationale: The revision replaces a potentially interpretive expression for hope with the direct Malayalam idiom ‘ദൈവത്തിൽ പ്രത്യാശ വെച്ചിരിക്കുന്നു,’ and replaces wording that can imply deliberate abandonment with wording denoting the solitary state itself. It also regularizes the spelling of ‘പ്രാർത്ഥനകൾ.’ The contrastive ‘എന്നാൽ’ is retained as a reasonable representation of δέ, without adding a temporal ‘now.’
