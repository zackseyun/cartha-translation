id: 1TI.5.5
reference: 1 Timothy 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: ml
  text: എന്നാൽ, യഥാർഥവിധവയും[a] ഒറ്റയ്ക്കായവളുമായവൾ[b] ദൈവത്തിൽ പ്രത്യാശ വെച്ചിരിക്കുന്നു[c]; അവൾ രാവും പകലും യാചനകളിലും പ്രാർത്ഥനകളിലും[d] തുടർന്നുനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഥാർഥവിധവ’ എന്നത് ഭർത്താവ് മരിച്ച സ്ത്രീ എന്ന സാമൂഹികനാമം മാത്രം ഉദ്ദേശിക്കുന്നില്ല; സമീപസന്ദർഭത്തിൽ വിവരിക്കുന്ന നിലയിലുള്ള വിധവയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: contextual_clarification
  - marker: b
    text: ‘തനിച്ചാക്കപ്പെട്ടവൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് രൂപം പിന്തുണയ്ക്കാൻ ആരുമില്ലാതെ ഒറ്റയ്ക്കായിത്തീർന്ന അവസ്ഥയ്ക്ക് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിൽ പ്രത്യാശ വെച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ദൈവത്തിൽ പ്രത്യാശിച്ചിരിക്കുന്നു.’ ഗ്രീക്ക് പൂർണകാലം തുടർന്നുനിൽക്കുന്ന ഉറച്ച പ്രത്യാശയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: d
    text: ഗ്രീക്കിൽ പ്രത്യേക അപേക്ഷകളെ സൂചിപ്പിക്കുന്ന ‘യാചനകൾ’ എന്നും പൊതുവായ ‘പ്രാർത്ഥനകൾ’ എന്നും രണ്ടു പദങ്ങളുണ്ട്; ആ വ്യത്യാസം പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ കുടുംബസഹായമുള്ള വിധവയിൽനിന്ന് ഇവിടെ വിവരിക്കുന്ന യഥാർഥ വിധവയിലേക്കുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ഇതിനെ കാലസൂചകമായ ‘ഇപ്പോൾ’ എന്നു മാറ്റുന്നില്ല.
- source_word: ὄντως χήρα
  choice: യഥാർഥ വിധവയായവൾ
  rationale: ὄντως എന്നത് വെറും സാമൂഹികനാമമല്ല, സമീപസന്ദർഭത്തിൽ നിർവചിക്കപ്പെടുന്ന യഥാർഥ അവസ്ഥയെയോ യോഗ്യതയെയോ അടയാളപ്പെടുത്തുന്നു.
- source_word: μεμονωμένη
  choice: തനിച്ചാക്കപ്പെട്ടവൾ
  rationale: പൂർണകാല കൃദന്തരൂപം, മറ്റുള്ളവരുടെ പിന്തുണയില്ലാതെ ഒറ്റയ്ക്കായിത്തീർന്ന് ആ നിലയിൽ കഴിയുന്നതിന്റെ ഫലം പ്രകടമാക്കുന്നു.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: ദൈവത്തിൽ പ്രത്യാശ ഉറപ്പിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് പൂർണകാലം മുൻപ് സ്ഥാപിതമായതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ പ്രത്യാശയെ സൂചിപ്പിക്കുന്നു; ‘ഉറപ്പിച്ചിരിക്കുന്നു’ ആ സ്ഥിരമായ അഭിമുഖത സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προσμένει
  choice: തുടർന്നുനിൽക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ തുടർച്ചയും നിലനിൽപ്പും അനാവശ്യമായ തീവ്രത ചേർക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: യാചനകളിലും പ്രാർഥനകളിലും
  rationale: δέησις എന്ന പ്രത്യേക അപേക്ഷയുടെ ഭാവവും προσευχή എന്ന പൊതുവായ പ്രാർഥനാഭാവവും വേർതിരിച്ചു നിലനിർത്തുന്നു.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: രാവും പകലും
  rationale: ഗ്രീക്കിലെ ക്രമം നിലനിർത്തിക്കൊണ്ട് തുടർച്ചയായ അഭ്യാസത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ‘യഥാർഥ വിധവ’യുടെ സ്വഭാവനിർണയം
  choice: കുടുംബപിന്തുണയില്ലാതെ ശേഷിക്കുകയും ദൈവത്തിൽ സ്ഥിരപ്രത്യാശ വെച്ച് പ്രാർഥനയിൽ തുടരുകയും ചെയ്യുന്ന വിധവയെ സന്ദർഭപരമായി വേർതിരിച്ചുകാട്ടുന്നു.
  alternative: വിധവമാരെയെല്ലാം പൊതുവായി വിവരിക്കുന്ന പ്രസ്താവനയായി വായിക്കുക.
  rationale: ὄντως എന്ന പദവും 1 തിമൊഥെയോസ് 5-ലെ സമീപസന്ദർഭവും ഒരു പ്രത്യേക വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു. സഭാപരിപാലനവുമായി ബന്ധമുള്ള ഈ സന്ദർഭബലം പരിഭാഷ നിലനിർത്തുന്നു; എന്നാൽ ഏതെങ്കിലും സഭാവിഭാഗത്തിന്റെ പ്രത്യേക യോഗ്യതാനിയമം അതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സ്ത്രീലിംഗ ഏകവചനവിഷയം വ്യക്തമായി നിലനിർത്തി. ‘രാവും പകലും’ എന്ന പരിചിതപ്രയോഗം വായനാസൗകര്യം നൽകുന്നു; പദദ്വയവും പൂർണകാലത്തിന്റെ തുടർച്ചാഭാവവും കഴിയുന്നത്ര സംരക്ഷിച്ചു.
