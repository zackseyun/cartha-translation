id: 1TI.5.17
reference: 1 Timothy 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: ml
  text: നന്നായി നേതൃത്വം നൽകുന്ന മൂപ്പന്മാർ ഇരട്ടി ബഹുമാനത്തിന്[a] അർഹരായി കണക്കാക്കപ്പെടട്ടെ; പ്രത്യേകിച്ച്[b] വചനത്തിലും ഉപദേശത്തിലും[c] കഠിനമായി അധ്വാനിക്കുന്നവർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രണ്ടിരട്ടി ബഹുമാനത്തിന് അർഹരായി കരുതപ്പെടട്ടെ.’ ഈ പ്രയോഗത്തിൽ ആദരവും ഭൗതിക പിന്തുണയും ഉൾപ്പെട്ടേക്കാം; പ്രത്യേകിച്ച് അടുത്ത വാക്യം ഇതിലേക്കു വിരൽചൂണ്ടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രത്യേകിച്ച്’ എന്നതിനെ ചിലർ ‘അതായത്’ എന്നും മനസ്സിലാക്കുന്നു; അങ്ങനെ വന്നാൽ ഇവിടെ ഉദ്ദേശിക്കുന്ന മൂപ്പന്മാർ വചനത്തിലും ഉപദേശത്തിലും അധ്വാനിക്കുന്നവരാണെന്ന് അത് തിരിച്ചറിയിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘വചനത്തിലും ഉപദേശത്തിലും’ എന്നത് പ്രസംഗവും പഠിപ്പിക്കലും പോലുള്ള വാചിക ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: മൂപ്പന്മാർ
  rationale: ഇവിടെ പ്രായംചെന്ന പുരുഷന്മാരെ പൊതുവായി അല്ല, സഭയിലെ അംഗീകൃത നേതാക്കളെയാണ് സൂചിപ്പിക്കുന്നത്. പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക സഭാഭരണഘടനകൾ അടിച്ചേൽപ്പിക്കാതെ ഈ അർഥം നൽകാൻ ‘മൂപ്പന്മാർ’ അനുയോജ്യമാണ്.
- source_word: καλῶς προεστῶτες
  choice: നന്നായി നേതൃത്വം നൽകുന്ന
  rationale: προΐστημι ഇവിടെ നേതൃത്വവും മേൽനോട്ടവും വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭരിക്കുന്ന’ എന്നതിനെക്കാൾ സ്വാഭാവികവും അനാവശ്യമായ കടുപ്പമില്ലാത്തതുമായ പ്രയോഗമാണിത്.
- source_word: διπλῆς τιμῆς
  choice: ഇരട്ടി ബഹുമാനത്തിന്
  rationale: ബഹുമാനവും ഭൗതിക പിന്തുണയും ഉൾക്കൊള്ളാനിടയുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἀξιούσθωσαν
  choice: അർഹരായി കണക്കാക്കപ്പെടട്ടെ
  rationale: സമൂഹം അവരുടെ അർഹത അംഗീകരിക്കണമെന്ന നിഷ്ക്രിയ ആജ്ഞയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: μάλιστα
  choice: പ്രത്യേകിച്ച്
  rationale: മൂപ്പന്മാരിൽ പ്രത്യേക ഊന്നൽ ലഭിക്കുന്ന ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക അർഥം നൽകുന്നു; ‘അതായത്’ എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: κοπιῶντες
  choice: കഠിനമായി അധ്വാനിക്കുന്നവർ
  rationale: κοπιάω സൂചിപ്പിക്കുന്ന തീവ്രമായ പരിശ്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐν λόγῳ
  choice: വചനത്തിൽ
  rationale: പ്രസംഗം ഉൾപ്പെടെയുള്ള വാചിക ശുശ്രൂഷയെ സൂചിപ്പിക്കാനിടയുള്ള λόγος എന്ന പദത്തിന്റെ വ്യാപ്തി ‘പ്രസംഗം’ എന്നു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: διδασκαλίᾳ
  choice: ഉപദേശത്തിൽ
  rationale: അംഗീകൃതമായ പഠിപ്പിക്കൽ പ്രവർത്തനത്തെ ആധുനികവും സഭാസന്ദർഭത്തിൽ സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: സഭാനേതാക്കൾക്കുള്ള ‘ഇരട്ടി ബഹുമാനം’ എന്നതിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘ഇരട്ടി ബഹുമാനം’ എന്ന വിശാല പ്രയോഗം നിലനിർത്തി.
  alternative: ഇരട്ടി ആദരവ്; ഇരട്ടി പ്രതിഫലം; ഭൗതിക പിന്തുണ ഉൾപ്പെടുന്ന ബഹുമാനം
  rationale: അടുത്ത വാക്യം ഭൗതിക പിന്തുണയിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും τιμή എന്ന പദത്തിൽ ആദരവും ഉൾപ്പെടാം. പരിഭാഷയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നത് ഒഴിവാക്കി.
- issue: μάλιστα എന്ന പദത്തിന്റെ പ്രാബല്യം
  choice: ‘പ്രത്യേകിച്ച്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അതായത്’ എന്നു പരിഭാഷപ്പെടുത്തി തുടർന്നുള്ളവരെ മുമ്പ് പറഞ്ഞ മൂപ്പന്മാരുമായി പൂർണമായി സമീകരിക്കുക
  rationale: എല്ലാ മൂപ്പന്മാരെയും കുറിച്ചുള്ള പൊതുപ്രസ്താവനയ്ക്കുള്ളിൽ വചനത്തിലും ഉപദേശത്തിലും അധ്വാനിക്കുന്നവർക്ക് പ്രത്യേക ഊന്നൽ നൽകുന്ന സാധ്യത ഇത് നിലനിർത്തുന്നു; വ്യാഖ്യാനവിവാദം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. സഭാഭരണരീതിയെയോ പ്രതിഫലസിദ്ധാന്തത്തെയോ പ്രത്യേകമായി നിർണ്ണയിക്കുന്ന പദങ്ങൾ ഒഴിവാക്കി; മൂലപാഠത്തിലെ അർഥവ്യാപ്തിയും വ്യാഖ്യാനസമ്മർദവും അടിക്കുറിപ്പുകളിലൂടെ നിലനിർത്തി.
