language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χήρας τίμα τὰς ὄντως χήρας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: ml
  text: യഥാർഥത്തിൽ വിധവകളായവരെ ആദരിക്കുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യഥാർഥത്തിൽ വിധവകളായവരെ പരിപാലിക്കുക.” ഈ സന്ദർഭത്തിൽ “ആദരിക്കുക” എന്നതിൽ ഭൗതിക സഹായവും ഉൾപ്പെടാൻ സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: വിധവകളായവരെ
  rationale: χήρα ഭർത്താവ് മരിച്ച സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; കർമസ്ഥാനത്തിലുള്ള ബഹുവചനം മലയാളത്തിൽ സ്വാഭാവികമായി ‘വിധവകളായവരെ’ എന്നു നൽകി.
- source_word: τίμα
  choice: ആദരിക്കുക
  rationale: τιμάω എന്നത് ആദരിക്കുക, വിലമതിക്കുക, ബഹുമാനം കാണിക്കുക എന്നീ വിശാലമായ അർഥങ്ങൾ വഹിക്കുന്നു. സന്ദർഭത്തിൽ പ്രായോഗികവും സാമ്പത്തികവുമായ പരിപാലനം ഉൾപ്പെടാമെങ്കിലും, മുഖ്യപാഠത്തിൽ അതിനെ ‘സഹായിക്കുക’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τὰς ὄντως χήρας
  choice: യഥാർഥത്തിൽ വിധവകളായവരെ
  rationale: ὄντως നൽകുന്ന യഥാർഥമായ അവസ്ഥയെന്ന വേർതിരിവ് ആവർത്തിച്ചുള്ള അസ്വാഭാവിക പ്രയോഗം കൂടാതെ വ്യക്തമാക്കുന്നു; തുടർന്നുള്ള സന്ദർഭത്തിൽ സഭയുടെ പരിപാലനത്തിന് യഥാർഥമായി അർഹരായ വിധവകളെ ഇത് വേർതിരിക്കുന്നു.
- source_word: ὄντως
  choice: യഥാർഥത്തിൽ
  rationale: ഈ ക്രിയാവിശേഷണം വെറും ഊന്നലല്ല, യഥാർഥ സ്ഥിതിയെ അടിസ്ഥാനമാക്കിയുള്ള ഒരു വേർതിരിവാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: സന്ദർഭത്തിൽ τιμάω എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ആദരിക്കുക’ എന്ന വിശാലമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അതിൽ ഭൗതിക പരിപാലനവും ഉൾപ്പെടാൻ സാധ്യതയുണ്ടെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: യഥാർഥത്തിൽ വിധവകളായവരെ സഹായിക്കുക / പരിപാലിക്കുക.
  rationale: 1 തിമൊഥെയൊസ് 5-ന്റെ സമീപസന്ദർഭം വിധവകൾക്കുള്ള ഭൗതിക പരിപാലനം ചർച്ച ചെയ്യുന്നു. എങ്കിലും ഗ്രീക്ക് ക്രിയ സാമ്പത്തിക സഹായത്തേക്കാൾ വിശാലമായതിനാൽ മുഖ്യപാഠം അതിനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘യഥാർഥത്തിൽ’ എന്ന പദം ὄντως സൂചിപ്പിക്കുന്ന സന്ദർഭപരമായ വേർതിരിവ് നിലനിർത്തുന്നു; ‘ആദരിക്കുക’ മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
