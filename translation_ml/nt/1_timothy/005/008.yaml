id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: ml
  text: എന്നാൽ ആരെങ്കിലും സ്വന്തക്കാർക്കു[a], വിശേഷിച്ച് തന്റെ വീട്ടിലെ അംഗങ്ങൾക്കു വേണ്ടതു നൽകുന്നില്ലെങ്കിൽ, അയാൾ വിശ്വാസം നിഷേധിച്ചിരിക്കുന്നു[b]; അവിശ്വാസിയേക്കാൾ മോശനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സ്വന്തക്കാർ” എന്നത് വീട്ടിലെ അംഗങ്ങളിൽ മാത്രം ഒതുങ്ങുന്നില്ല; ബന്ധുക്കളെയും ആശ്രിതരെയും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പ്രയോഗമാണ്. “തന്റെ വീട്ടിലെ അംഗങ്ങൾ” പ്രത്യേക ഊന്നൽ ലഭിക്കുന്ന ഉപവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_clarification
  - marker: b
    text: അഥവാ “വിശ്വാസം ഉപേക്ഷിച്ചിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἰδίων
  choice: സ്വന്തക്കാർ
  rationale: വീട്ടിൽ ഒരുമിച്ചു താമസിക്കുന്നവരിൽ മാത്രം ഒതുങ്ങാത്ത, ഒരാളുടെ സ്വന്തം ബന്ധുക്കളെയും ആശ്രിതരെയും ഉൾക്കൊള്ളാവുന്ന വിശാലമായ പ്രയോഗം; തുടർന്ന് വരുന്ന οἰκείων അതിലെ പ്രത്യേക ബാധ്യതയുള്ള വിഭാഗത്തെ ചൂണ്ടിക്കാണിക്കുന്നു.
- source_word: μάλιστα
  choice: വിശേഷിച്ച്
  rationale: വിശാലമായ ഒരു കൂട്ടത്തിനുള്ളിൽ പ്രത്യേക പരിഗണന അർഹിക്കുന്ന ഉപവിഭാഗത്തെ ഊന്നിപ്പറയുന്നു.
- source_word: οἰκείων
  choice: തന്റെ വീട്ടിലുള്ളവർ
  rationale: ഒരാളുടെ ഗൃഹവുമായി ബന്ധപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ, മുൻപത്തെ 'സ്വന്തക്കാർ' എന്ന വിശാല വിഭാഗത്തേക്കാൾ ഇടുങ്ങിയ അർഥം നിലനിർത്തുന്നു.
- source_word: προνοεῖ
  choice: കരുതുന്നു
  rationale: മുൻകൂട്ടി ശ്രദ്ധിക്കുകയും ആവശ്യമായ പ്രായോഗിക പരിപാലനവും ഉപജീവനസഹായവും നൽകുകയും ചെയ്യുക എന്ന സന്ദർഭാർഥം വഹിക്കുന്നു; 'കരുതുക' മലയാളത്തിൽ ഈ വിശാലത സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τὴν πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ വ്യക്തി ഏറ്റുപറയുന്ന ക്രിസ്തീയ വിശ്വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ നിർദിഷ്ടത മലയാളത്തിൽ സന്ദർഭംകൊണ്ട് വ്യക്തമാകുന്നു.
- source_word: ἤρνηται
  choice: തള്ളിപ്പറഞ്ഞിരിക്കുന്നു
  rationale: പൂർണ്ണകാല ക്രിയയുടെ, കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം, ഈ രൂപം പ്രകടമാക്കുന്നു; പെരുമാറ്റത്തിലൂടെ വിശ്വാസത്തെ നിഷേധിക്കുന്നതിന്റെ ഗൗരവവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀπίστου
  choice: അവിശ്വാസി
  rationale: ഈ വൈരുധ്യത്തിൽ വിശ്വാസസമൂഹത്തിന് പുറത്തുള്ള വിശ്വസിക്കാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; വെറും വിശ്വസ്തതയില്ലായ്മയല്ല.
- source_word: χείρων
  choice: മോശൻ
  rationale: ധാർമികമായ താരതമ്യം നേരിട്ടും ലളിതമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: τις എന്ന അനിശ്ചിത സർവനാമത്തിന്റെ പൊതുവ്യാപ്തിയും വ്യാകരണലിംഗവും
  choice: '''ആരെങ്കിലും ... അയാൾ'' എന്ന പൊതുവ്യാപ്തിയുള്ള ഏകവചന പ്രയോഗം'
  alternative: പൂർണമായും ലിംഗനിരപേക്ഷമായ ബഹുവചനമോ പുരുഷന്മാർക്ക് മാത്രമായി തോന്നാവുന്ന 'ഏതെങ്കിലും പുരുഷൻ' എന്ന പ്രയോഗമോ
  rationale: ഗ്രീക്കിൽ പ്രയോഗം ഏകവചനവും പൊതുവ്യാപ്തിയുള്ളതുമാണ്. മലയാളത്തിലെ 'ആരെങ്കിലും' അതിനെ ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ നൽകുന്നു; 'അയാൾ' ഏകവചന തുടർച്ച സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- issue: τὴν πίστιν എന്നതിന്റെ അർഥം
  choice: ഏറ്റുപറയുന്ന ക്രിസ്തീയ 'വിശ്വാസം'
  alternative: വ്യക്തിപരമായ ആശ്രയം, അല്ലെങ്കിൽ വിശ്വസ്തത
  rationale: പാസ്റ്ററൽ ലേഖനങ്ങളിലെ സന്ദർഭത്തിൽ ഈ പദസമുച്ചയം ഏറ്റുപറയുകയും ജീവിതത്തിൽ പ്രകടമാക്കുകയും ചെയ്യുന്ന വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു. സ്വന്തക്കാരെ പരിപാലിക്കാതിരിക്കുന്നത് ആ ഏറ്റുപറച്ചിലിനെ പ്രവൃത്തിയാൽ നിഷേധിക്കുന്നതായി വാക്യം പറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. τῶν ἰδίων / οἰκείων എന്ന വിശാല-ഇടുങ്ങിയ ബന്ധം 'സ്വന്തക്കാർ / തന്റെ വീട്ടിലുള്ളവർ' എന്ന വ്യത്യാസത്തിലൂടെ നിലനിർത്തി. പ്രായോഗികവും സാമ്പത്തികവുമായ പരിപാലനം ഉൾക്കൊള്ളുന്ന προνοεῖ എന്ന പദത്തെ അതിയായി ഇടുക്കാതിരിക്കാൻ 'കരുതുക' ഉപയോഗിച്ചു.
