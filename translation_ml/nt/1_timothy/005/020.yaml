revisions:
- from: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവരെ[a][b] എല്ലാവരുടെയും മുമ്പിൽ ശാസിക്കുക; അങ്ങനെ ശേഷമുള്ളവർക്കും ഭയം ഉണ്ടാകട്ടെ.
  to: പാപം ചെയ്യുന്നവരെ[a][b] എല്ലാവരുടെയും മുമ്പിൽ ശാസിക്കുക; മറ്റുള്ളവർക്കും ഭയമുണ്ടാകേണ്ടതിന്.
  rationale: The revision avoids making the participle's possible ongoing aspect obligatory in the main text, while retaining it in footnote a. It also restores the explicit purpose relationship of ἵνα and uses more idiomatic Malayalam for ‘the rest.’ Footnote b is adjusted only to quote the revised main-text wording exactly; it preserves the contextual ambiguity about whether the offenders are specifically elders.
