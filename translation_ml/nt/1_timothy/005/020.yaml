source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: ml
  text: പാപം ചെയ്യുന്നവരെ[a][b] എല്ലാവരുടെയും മുമ്പിൽ ശാസിക്കുക; മറ്റുള്ളവർക്കും ഭയമുണ്ടാകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപത്തിൽ തുടരുന്നവരെ’; വർത്തമാനകാല കൃദന്തരൂപം തുടർന്നുകൊണ്ടിരിക്കുന്ന പാപപ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: തൊട്ടുമുമ്പുള്ള സന്ദർഭം കണക്കിലെടുക്കുമ്പോൾ ഇവിടെ പ്രത്യേകിച്ച് പാപം ചെയ്യുന്ന മൂപ്പന്മാരെയായിരിക്കാം ഉദ്ദേശിക്കുന്നത്; എന്നാൽ ഈ വാക്യം തന്നെ പറയുന്നത് ‘പാപം ചെയ്യുന്നവർ’ എന്നു മാത്രമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവരെ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം നാമസദൃശമായി ഉപയോഗിച്ചിരിക്കുന്നു. പ്രവർത്തനം തുടരുന്നതായിരിക്കാമെന്ന ഭാവം നിലനിർത്തുന്നു; എന്നാൽ ‘പാപത്തിൽ തുടരുന്നവർ’ എന്നു മുഖ്യപാഠത്തിൽ പറഞ്ഞ് ആ അർഥം അനാവശ്യമായി ശക്തമാക്കുന്നില്ല.
- source_word: ἐνώπιον πάντων
  choice: എല്ലാവരുടെയും മുമ്പിൽ
  rationale: ‘എല്ലാവരുടെയും സന്നിധിയിൽ’ എന്ന മൂലഘടനയും പരസ്യമായ സാഹചര്യവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔλεγχε
  choice: ശാസിക്കുക
  rationale: ഈ ശിക്ഷണപരമായ സന്ദർഭത്തിൽ ἐλέγχω എന്നതിലെ തെറ്റ് ചൂണ്ടിക്കാട്ടി തിരുത്തുന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘വെളിപ്പെടുത്തുക’ എന്നത് വെളിച്ചത്തുകൊണ്ടുവരുന്നതിന് അമിത ഊന്നൽ നൽകാം.
- source_word: οἱ λοιποὶ
  choice: ശേഷമുള്ളവർ
  rationale: കുറ്റം ചെയ്യുന്നവരെ കൂടാതെ സമൂഹത്തിൽ ശേഷിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: φόβον ἔχωσιν
  choice: ഭയം ഉണ്ടാകട്ടെ
  rationale: ‘ഭയം ഉണ്ടായിരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; അതിനെ ഭക്ത്യാദരമെന്നോ വെറും പേടിയെന്നോ നിർബന്ധമായി വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: സന്ദർഭത്തിൽ കുറ്റക്കാരുടെ പരിധി
  choice: മുഖ്യപാഠത്തിൽ ‘പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവർ’ എന്നു വിശാലമായി വിവർത്തനം ചെയ്യുന്നു; മൂപ്പന്മാർ എന്ന് ചേർക്കുന്നില്ല.
  alternative: തൊട്ടുമുമ്പുള്ള 19-ാം വാക്യത്തിന്റെ അടിസ്ഥാനത്തിൽ ഇത് പ്രത്യേകിച്ച് പാപം ചെയ്യുന്ന മൂപ്പന്മാരെ സൂചിപ്പിക്കാം.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘പാപം ചെയ്തുകൊണ്ടിരിക്കുന്നവർ’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. എന്നാൽ ഉടൻ മുമ്പുള്ള സന്ദർഭം മൂപ്പന്മാരെക്കുറിച്ചായതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശാസിക്കുക’ സഭാശിക്ഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്. മൂലപാഠത്തിലെ പൊതുവായ പരാമർശവും സന്ദർഭം നൽകുന്ന മൂപ്പന്മാരെക്കുറിച്ചുള്ള സാധ്യതയും വേർതിരിച്ച് നിലനിർത്തിയിരിക്കുന്നു.
