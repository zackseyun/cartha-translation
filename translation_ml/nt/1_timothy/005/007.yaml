reference: 1 Timothy 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίλημπτοι ὦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: ml
  text: ഈ കാര്യങ്ങളും ആജ്ഞാപിക്കുക[a], അവർ ആക്ഷേപമില്ലാത്തവരായിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിർദേശിക്കുക’ അല്ലെങ്കിൽ ‘ചുമതലപ്പെടുത്തുക’ എന്നും പരിഭാഷപ്പെടുത്താം; മൂലക്രിയയ്ക്ക് അധികാരപൂർവമായ ബലമുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവർ’ ആരെന്നു ഗ്രീക്കിൽ വ്യക്തമായി പറഞ്ഞിട്ടില്ല. സന്ദർഭത്തിൽ, മുൻ നിർദേശങ്ങൾ അഭിസംബോധന ചെയ്യുന്നവരെ—പ്രത്യേകിച്ച് വിധവകളെയും അവരുടെ കുടുംബങ്ങളെയും—ആയിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻ നിർദേശങ്ങളോടുള്ള ലളിതമായ തുടർച്ചയും ബന്ധവും മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുൻപും ചുറ്റുപാടും പറഞ്ഞ നിർദേശങ്ങളിലേക്കു വിരൽചൂണ്ടുന്ന നപുംസക ബഹുവചനത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ‘ഈ നിർദേശങ്ങൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: παράγγελλε
  choice: ആജ്ഞാപിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിലുള്ള ക്രിയയുടെ അധികാരപൂർവമായ നിർദേശബലം നിലനിർത്തുന്നു. മലയാളത്തിൽ ആവർത്തിച്ചോ തുടർന്നോ ചെയ്യേണ്ട കല്പന സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യം/ഫലം അവതരിപ്പിക്കുന്ന ἵναയുടെ ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀνεπίλημπτοι
  choice: കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവർ
  rationale: ന്യായമായ വിമർശനത്തിനോ കുറ്റാരോപണത്തിനോ വിധേയരാകാത്ത നിലയാണ് സൂചിപ്പിക്കുന്നത്; പൂർണ പാപരാഹിത്യം ധ്വനിപ്പിക്കാവുന്ന ‘കുറ്റമറ്റവർ’ എന്നതിനേക്കാൾ കൃത്യമാണ്.
- source_word: ὦσιν
  choice: ആയിരിക്കട്ടെ
  rationale: ἵναയ്ക്കുശേഷമുള്ള വർത്തമാന subjunctive-ന്റെ ഉദ്ദേശ്യസ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു പൂരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘അവർ കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവരായിരിക്കട്ടെ’ എന്നതിലെ പരോക്ഷ ബഹുവചന കർത്താവിന്റെ സൂചിതർ
  choice: പ്രധാനപാഠത്തിൽ ‘അവർ’ എന്നു മാത്രം നൽകി കൂട്ടത്തെ വ്യക്തമാക്കിയില്ല.
  alternative: തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിലെ വിധവകളും അവരുടെ കുടുംബങ്ങളും; അല്ലെങ്കിൽ തിമൊഥെയൊസും വിശ്വാസസമൂഹവും കൂടുതൽ വിശാലമായി.
  rationale: ഗ്രീക്കിൽ ബഹുവചന കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല. അടുത്ത സന്ദർഭം മുൻ നിർദേശങ്ങൾ അഭിസംബോധന ചെയ്യുന്നവരിലേക്കു—പ്രത്യേകിച്ച് വിധവകളിലേക്കും അവരുടെ കുടുംബങ്ങളിലേക്കും—ചൂണ്ടുന്നുവെങ്കിലും, പാഠത്തിലെ യഥാർഥ അവ്യക്തത പരിഭാഷയിൽ പരിഹരിച്ചുകളയാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. അധികാരപൂർവമായ ക്രിയാബലവും പരോക്ഷ കർത്താവിന്റെ അവ്യക്തതയും ഒരുപോലെ നിലനിർത്തി.
