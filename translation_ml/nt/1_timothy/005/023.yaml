id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: ml
  text: ഇനി വെള്ളം മാത്രം കുടിക്കരുത്[a]; പകരം, നിന്റെ വയറിനുവേണ്ടിയും നിനക്കു കൂടെക്കൂടെ ഉണ്ടാകുന്ന അസുഖങ്ങൾ നിമിത്തവും അല്പം വീഞ്ഞ് ഉപയോഗിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ഇനി വെള്ളം കുടിക്കുന്നവനായിരിക്കരുത്.’ തിമൊഥെയൊസ് വെള്ളം മാത്രം കുടിക്കുന്നത് തുടരരുത് എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: ഇനി … കുടിക്കാതെ
  rationale: മുമ്പുണ്ടായിരുന്ന ഒരു പതിവ് അവസാനിപ്പിക്കണമെന്ന നിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὑδροπότει
  choice: വെള്ളം മാത്രം കുടിക്കാതെ
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ‘വെള്ളം കുടിക്കുക’ എന്നതാണ്. എന്നാൽ ἀλλά കൊണ്ടുവരുന്ന വൈരുധ്യവും അല്പം വീഞ്ഞ് ഉപയോഗിക്കാനുള്ള തുടർനിർദേശവും കണക്കിലെടുത്ത്, വെള്ളം പൂർണമായി ഉപേക്ഷിക്കണമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ സന്ദർഭത്തിൽ സൂചിതമായ ‘മാത്രം’ വ്യക്തമാക്കി.
- source_word: ἀλλὰ
  choice: പകരമായ നിർദേശഘടന
  rationale: ‘കുടിക്കാതെ … ഉപയോഗിക്കുക’ എന്ന മലയാളഘടന ഗ്രീക്കിലെ ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വേറിട്ട് ‘എന്നാൽ’ ചേർക്കേണ്ടതില്ല.
- source_word: οἴνῳ ὀλίγῳ
  choice: അല്പം വീഞ്ഞ്
  rationale: ὀλίγῳ സൂചിപ്പിക്കുന്ന ചെറിയ അളവും οἶνος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: χρῶ
  choice: ഉപയോഗിക്കുക
  rationale: χράομαι എന്ന ക്രിയയുടെ ‘ഉപയോഗിക്കുക’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത ഔഷധപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: διὰ
  choice: വേണ്ടിയും … നിമിത്തവും
  rationale: Accusative-നോടുകൂടിയ διά കാരണം അഥവാ പരിഗണന സൂചിപ്പിക്കുന്നു. ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട് രണ്ടു കാരണങ്ങളെയും മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: στόμαχον
  choice: വയർ
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണവും എല്ലാവർക്കും മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: πυκνάς
  choice: കൂടെക്കൂടെ ഉണ്ടാകുന്ന
  rationale: അസുഖങ്ങൾ ആവർത്തിച്ചുണ്ടാകുന്നതെന്ന അർഥം ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀσθενείας
  choice: അസുഖങ്ങൾ
  rationale: ἀσθένεια എന്നതിന് ‘ബലഹീനതകൾ’ എന്നും അർഥമുണ്ടാകാമെങ്കിലും, വയറിനെയും ആരോഗ്യപരമായ ഉപദേശത്തെയും ചേർത്തുള്ള ഈ സന്ദർഭത്തിൽ ശാരീരിക അസുഖങ്ങളാണ് ഏറ്റവും സാദ്ധ്യമായ അർഥം.
theological_decisions:
- issue: തിമൊഥെയൊസിന്റെ മുൻപത്തെ ശീലം വെള്ളം മാത്രം കുടിക്കലായിരുന്നെന്ന് വ്യക്തമാക്കണമോ
  choice: വെള്ളം മാത്രം കുടിക്കാതെ
  alternative: വെള്ളം കുടിക്കാതെ
  rationale: തുടർന്ന് ‘അല്പം വീഞ്ഞ് ഉപയോഗിക്കുക’ എന്നു പറയുന്ന വൈരുധ്യം വെള്ളം പൂർണമായി ഉപേക്ഷിക്കാനല്ല, വെള്ളം മാത്രമായി കുടിക്കുന്നത് തുടരാതിരിക്കാനാണ് നിർദേശമെന്ന് സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥരൂപവും നൽകുന്നു.
- issue: οἶνος എന്നത് അക്ഷരാർഥത്തിൽ പരിഭാഷപ്പെടുത്തണമോ, ഔഷധപാനീയമായി സാമാന്യവത്കരിക്കണമോ
  choice: വീഞ്ഞ്
  alternative: ഔഷധപാനീയം
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി οἶνος എന്നു പറയുന്നു. സാംസ്കാരികമോ ഉപദേശപരമോ ആയ കാരണങ്ങളാൽ അതിനെ മയപ്പെടുത്താതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘അല്പം’ എന്ന വിശേഷണം അളവിലെ മിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘വീഞ്ഞ്’ എന്ന സാധാരണ പദവും ‘കൂടെക്കൂടെ ഉണ്ടാകുന്ന അസുഖങ്ങൾ’ എന്ന പൊതുജനസൗഹൃദ പ്രയോഗവും തെരഞ്ഞെടുത്തു; പാഠത്തിൽ ഇല്ലാത്ത വൈദ്യശാസ്ത്രപരമോ സഭാവിഭാഗപരമോ ആയ വിശദീകരണങ്ങൾ ഒഴിവാക്കി.
