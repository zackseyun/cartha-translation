id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: ml
  text: പ്രായംചെന്ന ഒരു പുരുഷനെ[a] ശാസിക്കരുത്; പകരം, പിതാവിനോടെന്നപോലെ അദ്ദേഹത്തോട് അഭ്യർഥിക്കുക; ചെറുപ്പക്കാരായ പുരുഷന്മാരോട് സഹോദരന്മാരോടെന്നപോലെ അഭ്യർഥിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരു മൂപ്പനെ കഠിനമായി ശാസിക്കരുത്.’ ഗ്രീക്ക് പദത്തിന് ‘പ്രായംചെന്ന പുരുഷൻ’ എന്നും ‘മൂപ്പൻ’ എന്നും അർഥമാകാം; എന്നാൽ ഈ സന്ദർഭത്തിലെ പ്രായത്തെ അടിസ്ഥാനമാക്കിയുള്ള താരതമ്യം ‘പ്രായംചെന്ന പുരുഷൻ’ എന്ന അർഥത്തെയാണ് പിന്തുണയ്ക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: പ്രായമുള്ള ഒരു പുരുഷനെ
  rationale: ഇതേ വാക്യത്തിലെ νεωτέρους (‘ചെറുപ്പക്കാരായ പുരുഷന്മാർ’) എന്ന പ്രായാധിഷ്ഠിത വിരുദ്ധജോടിയും അടുത്ത വാക്യത്തിലെ സ്ത്രീകളെ സംബന്ധിച്ച സമാന്തര പ്രയോഗവും ഇവിടെ സഭാമൂപ്പൻ എന്ന പദവിയെക്കാൾ പ്രായമുള്ള പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് ശക്തമായി പിന്തുണയ്ക്കുന്നു.
- source_word: μὴ ἐπιπλήξῃς
  choice: ശാസിക്കരുത്
  rationale: വാക്കുകൊണ്ട് കഠിനമായി കുറ്റപ്പെടുത്തുക അഥവാ ശാസിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; തീവ്രത അനാവശ്യമായി വർധിപ്പിക്കാതെ ഗ്രീക്കിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀλλὰ παρακάλει
  choice: പകരം ... അഭ്യർഥിക്കുക
  rationale: παρακαλέω എന്നതിന്റെ പ്രോത്സാഹിപ്പിക്കുക, പ്രബോധിപ്പിക്കുക, അഭ്യർഥിക്കുക എന്നീ അർഥങ്ങളിൽ, കടുത്ത ശാസനയ്ക്കു പകരമുള്ള ആദരപൂർവമായ കുടുംബബന്ധസദൃശ സമീപനം ഇവിടെ ‘അഭ്യർഥിക്കുക’ നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς πατέρα
  choice: പിതാവിനോടെന്നപോലെ
  rationale: ὡς സൂചിപ്പിക്കുന്ന താരതമ്യം സ്വാഭാവികവും ആദരസൂചകവുമായി മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: νεωτέρους
  choice: ചെറുപ്പക്കാരായ പുരുഷന്മാരോട്
  rationale: പുരുഷലിംഗ ബഹുവചനവും അടുത്ത വാക്യത്തിലെ പ്രായ-ലിംഗ വിഭാഗീകരണവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ὡς ἀδελφούς
  choice: സഹോദരന്മാരോടെന്നപോലെ
  rationale: സന്ദർഭത്തിലെ പുരുഷന്മാരെ പ്രത്യേകമായി അഭിസംബോധന ചെയ്യുന്ന ഘടന നിലനിർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘വിശ്വാസത്തിലുള്ള’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Πρεσβυτέρῳ എന്നത് സഭയിലെ ‘മൂപ്പൻ’ എന്ന പദവിയെയാണോ പ്രായമുള്ള പുരുഷനെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: 'പ്രായാധിഷ്ഠിത അർഥം: ‘പ്രായമുള്ള ഒരു പുരുഷൻ’'
  alternative: ‘ഒരു മൂപ്പൻ’
  rationale: പ്രായമുള്ള പുരുഷൻ/പിതാവ്, ചെറുപ്പക്കാരായ പുരുഷന്മാർ/സഹോദരന്മാർ, തുടർന്ന് പ്രായമുള്ള സ്ത്രീകൾ/അമ്മമാർ, ചെറുപ്പക്കാരായ സ്ത്രീകൾ/സഹോദരിമാർ എന്ന സന്ദർഭസമാന്തര്യം പ്രായാധിഷ്ഠിത വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എന്നിരുന്നാലും പദത്തിന് സഭാമൂപ്പൻ എന്ന അർഥവും സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് സംരക്ഷിക്കുന്നു.
- issue: ἀδελφούς ഉൾക്കൊള്ളുന്ന ലിംഗനിരപേക്ഷ രൂപത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘സഹോദരന്മാർ’
  alternative: ‘സഹോദരീസഹോദരന്മാർ’
  rationale: ഇവിടെ പുരുഷന്മാരും സ്ത്രീകളും അടുത്തടുത്തായി വേർതിരിച്ച വിഭാഗങ്ങളായി പരാമർശിക്കപ്പെടുന്നതിനാൽ പുരുഷലിംഗ രൂപം പൊതുവായ ഉൾക്കൊള്ളുന്ന പ്രയോഗമല്ല; അതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘അദ്ദേഹത്തോട്’ എന്ന ആദരരൂപം പിതാവിനോടെന്നപോലുള്ള സമീപനത്തിന് യോജിക്കുന്നു. അവസാനത്തെ ‘പെരുമാറുക’ ഗ്രീക്കിൽ അധ്യാഹൃതമായ സമാന്തര ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ചേർത്തതാണ്.
