revisions:
- from: പ്രായമുള്ള ഒരു പുരുഷനെ[a] ശാസിക്കരുത്; പകരം, പിതാവിനോടെന്നപോലെ അദ്ദേഹത്തോട് അഭ്യർഥിക്കുക; ചെറുപ്പക്കാരായ പുരുഷന്മാരോട് സഹോദരന്മാരോടെന്നപോലെയും പെരുമാറുക.
  to: പ്രായംചെന്ന ഒരു പുരുഷനെ[a] ശാസിക്കരുത്; പകരം, പിതാവിനോടെന്നപോലെ അദ്ദേഹത്തോട് അഭ്യർഥിക്കുക; ചെറുപ്പക്കാരായ പുരുഷന്മാരോട് സഹോദരന്മാരോടെന്നപോലെ അഭ്യർഥിക്കുക.
  rationale: പരിഭാഷയുടെ പ്രായാധിഷ്ഠിത വായനയും പുരുഷലിംഗവിഭാഗീകരണവും നിലനിർത്തിയിരിക്കുന്നു. എന്നാൽ παρακάλει എന്ന മൂലക്രിയയുടെ വ്യാപ്തി അവസാന ഖണ്ഡത്തിലും വ്യക്തമായി നിലനിർത്താൻ ‘പെരുമാറുക’ എന്ന ചേർക്കൽ മാറ്റി ‘അഭ്യർഥിക്കുക’ എന്ന ക്രിയ ആവർത്തിച്ചു. അടിക്കുറിപ്പ് വിവാദസാധ്യതയുള്ള ‘മൂപ്പൻ’ എന്ന വായന സംരക്ഷിക്കുന്നു.
