id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: ml
  text: അതുകൊണ്ട്, യുവവിധവകൾ വിവാഹം കഴിക്കാനും[a], മക്കളെ പ്രസവിക്കാനും, തങ്ങളുടെ വീടുകൾ നടത്താനും, എതിരാളിക്ക്[b] നിന്ദിക്കാൻ യാതൊരു അവസരവും നൽകാതിരിക്കാനും ഞാൻ ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘വിവാഹം കഴിക്കുക’ എന്നു മാത്രമാണ്. ഇവിടെ യുവവിധവകളാണ് സന്ദർഭവിഷയം എന്നതിനാൽ പുനർവിവാഹം സൂചിതമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിരോധി’; ഇത് സാത്താനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: പൗലോസിന്റെ വ്യക്തിപരമായ ഇച്ഛയെയോ ഉറച്ച നിലപാടിനെയോ സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ചർച്ചയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: νεωτέρας
  choice: പ്രായം കുറഞ്ഞ വിധവകൾ
  rationale: പദത്തിന് അക്ഷരാർഥത്തിൽ ‘പ്രായം കുറഞ്ഞ സ്ത്രീകൾ’ എന്നാണെങ്കിലും, ഈ ഭാഗത്തിന്റെ സന്ദർഭം വിധവകളെക്കുറിച്ചായതിനാൽ സൂചിതമായ നാമം ചേർത്തിരിക്കുന്നു.
- source_word: γαμεῖν
  choice: വിവാഹം കഴിക്കാൻ
  rationale: ഗ്രീക്ക് ക്രിയ ‘വിവാഹം കഴിക്കുക’ എന്നാണ്; വിധവകളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ പുനർവിവാഹം സൂചിതമാണെങ്കിലും ‘വീണ്ടും’ എന്ന ആശയം പദത്തിൽതന്നെ വ്യക്തമല്ല.
- source_word: τεκνογονεῖν
  choice: മക്കളെ പ്രസവിക്കാൻ
  rationale: കുട്ടികളെ പ്രസവിക്കുക എന്ന ക്രിയയുടെ പ്രത്യേക അർഥം നിലനിർത്തുന്നു.
- source_word: οἰκοδεσποτεῖν
  choice: തങ്ങളുടെ കുടുംബകാര്യങ്ങൾ നടത്താൻ
  rationale: വീട്ടുകാര്യങ്ങളുടെ സജീവമായ മേൽനോട്ടവും നടത്തിപ്പും സൂചിപ്പിക്കുന്നു; അനാവശ്യമായി ആധിപത്യത്തിന്റെ ഭാവം നൽകുന്നില്ല.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: യാതൊരു അവസരവും നൽകാതിരിക്കാൻ
  rationale: എതിർപ്പിനോ ആക്രമണത്തിനോ ഒരു പഴുതും അവസരവും നൽകാതിരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῷ ἀντικειμένῳ
  choice: എതിരാളിക്ക്
  rationale: ‘എതിർക്കുന്നവൻ’ എന്ന ഏകവചനരൂപം നിലനിർത്തുകയും അത് സാത്താനാണെന്ന് മുഖ്യപാഠത്തിൽ നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: λοιδορίας χάριν
  choice: ദുഷിച്ചുപറയാൻ
  rationale: അധിക്ഷേപിക്കുകയോ അപകീർത്തിപ്പെടുത്തുകയോ ചെയ്യുന്ന ശത്രുതാപരമായ സംസാരത്തിന് അവസരം ലഭിക്കുക എന്ന ആശയം ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: τῷ ἀντικειμένῳ എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: ആരാണെന്ന് നിർണയിക്കാതെ ‘എതിരാളി’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘പ്രതിയോഗി’ അഥവാ സാത്താൻ
  rationale: ഗ്രീക്ക് പദം എതിർക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അയാളെ പിശാചായി വ്യക്തമായി തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ മുഖ്യപാഠം ഈ അവ്യക്തത നിലനിർത്തുന്നു; സാത്താനെ സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ആധുനിക നിലവാരമലയാളം ഉപയോഗിച്ചിരിക്കുന്നു. വാക്യത്തിലെ സമാന്തര ക്രിയാരൂപങ്ങൾ നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ മലയാളക്രമം സ്വീകരിച്ചു. ‘കുടുംബകാര്യങ്ങൾ നടത്തുക’ എന്ന പ്രയോഗം ഗൃഹനിർവഹണവും മേൽനോട്ടവും ഉൾക്കൊള്ളുന്നു.
