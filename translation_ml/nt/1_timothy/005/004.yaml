revisions:
- from: എന്നാൽ ഏതെങ്കിലും വിധവയ്ക്കു മക്കളോ കൊച്ചുമക്കളോ[a] ഉണ്ടെങ്കിൽ, അവർ ആദ്യം സ്വന്തം കുടുംബത്തെ പരിപാലിച്ചുകൊണ്ട് ദൈവഭക്തി പ്രവൃത്തിയിൽ കാണിക്കാനും[b] തങ്ങളുടെ മുൻതലമുറക്കാർക്കു[c] പ്രത്യുപകാരം ചെയ്യാനും പഠിക്കട്ടെ. ഇതു ദൈവസന്നിധിയിൽ സ്വീകാര്യമാണ്.
  to: എന്നാൽ ഏതെങ്കിലും വിധവയ്ക്കു മക്കളോ കൊച്ചുമക്കളോ[a] ഉണ്ടെങ്കിൽ, അവർ ആദ്യം സ്വന്തം കുടുംബത്തോടുള്ള കടമ ഭക്തിയോടെ നിർവഹിക്കാനും[b] തങ്ങളുടെ മുൻതലമുറയിലുള്ളവർക്കു[c] പ്രത്യുപകാരം ചെയ്യാനും പഠിക്കട്ടെ. ഇതു ദൈവസന്നിധിയിൽ സ്വീകാര്യമാണ്.
  rationale: The revision removes the added instrumental wording while preserving the Greek’s linkage of household obligation and piety. It retains the appropriately broad reference to children/grandchildren and forebears, improves the idiomatic Malayalam expression of the obligation, and corrects the non-Malayalam form in footnote c.
