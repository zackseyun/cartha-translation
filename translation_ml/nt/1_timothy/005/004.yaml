id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: ml
  text: എന്നാൽ ഏതെങ്കിലും വിധവയ്ക്കു മക്കളോ കൊച്ചുമക്കളോ[a] ഉണ്ടെങ്കിൽ, അവർ ആദ്യം സ്വന്തം കുടുംബത്തോടുള്ള കടമ ഭക്തിയോടെ നിർവഹിക്കാനും[b] തങ്ങളുടെ മുൻതലമുറയിലുള്ളവർക്കു[c] പ്രത്യുപകാരം ചെയ്യാനും പഠിക്കട്ടെ. ഇതു ദൈവസന്നിധിയിൽ സ്വീകാര്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘മക്കളോ സന്തതികളോ.’ ἔκγονα എന്ന ഗ്രീക്ക് പദത്തിന് ‘കൊച്ചുമക്കൾ’ എന്നതിനെക്കാൾ വിശാലമായ അർഥമുണ്ടാകാം; ഇവിടെ അടുത്ത കുടുംബതലമുറയാണ് സാധ്യതയേറിയ സൂചന.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സ്വന്തം കുടുംബത്തോടു ഭക്തി കാണിക്കാനും.’ കുടുംബത്തോടുള്ള ഉത്തരവാദിത്വത്തെ ഗ്രീക്ക് പദം ദൈവഭക്തിയുമായി ബന്ധിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ ‘തങ്ങളുടെ മാതാപിതാക്കൾക്ക്’ അല്ലെങ്കിൽ ‘തങ്ങളുടെ പൂർവികർക്ക്.’ ഗ്രീക്ക് പദം മുൻതലമുറയിലുള്ളവരെ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ മാതാപിതാക്കളെയോ മുത്തച്ഛൻമാരെയും മുത്തശ്ശിമാരെയും ഉദ്ദേശിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: വിധവ
  rationale: ഭർത്താവ് മരിച്ച സ്ത്രീ എന്ന സന്ദർഭോചിതമായ സാധാരണ അർഥം; ചുറ്റുപാടുള്ള ഭാഗവും വിധവകളെക്കുറിച്ചാണ്.
- source_word: τέκνα ἢ ἔκγονα
  choice: മക്കളോ കൊച്ചുമക്കളോ
  rationale: τέκνα എന്നത് മക്കളെയും ἔκγονα എന്നത് പൊതുവായി സന്തതികളെയും സൂചിപ്പിക്കാം; ഇവിടെ കുടുംബപരിപാലനത്തിന്റെ അടുത്ത തലമുറകളെ ഉദ്ദേശിക്കുന്നതിനാൽ ‘കൊച്ചുമക്കൾ’ സ്വാഭാവികമാണ്, വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: μανθανέτωσαν
  choice: അവർ ... പഠിക്കട്ടെ
  rationale: മൂന്നാം പുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞയുടെ പ്രേരണാത്മക ശക്തി നിലനിർത്തുന്നു; ‘അവർ’ എന്നത് വിധവയുടെ മക്കളെയോ കൊച്ചുമക്കളെയോ സൂചിപ്പിക്കുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: കുടുംബത്തോടുള്ള ഉത്തരവാദിത്വത്തിനുള്ള മുൻഗണന നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: τὸν ἴδιον οἶκον
  choice: സ്വന്തം കുടുംബത്തെ
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെക്കാൾ കുടുംബത്തെയോ കുടുംബവൃത്തത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: εὐσεβεῖν
  choice: പരിപാലിച്ചുകൊണ്ട് ദൈവഭക്തി പ്രവൃത്തിയിൽ കാണിക്കാൻ
  rationale: ക്രിയയിലെ മതപരമായ ‘ഭക്തി’ എന്ന ആശയവും സന്ദർഭത്തിലെ കുടുംബപരിചരണരൂപത്തിലുള്ള പ്രായോഗിക പ്രകടനവും ഒരുമിച്ച് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: പ്രത്യുപകാരം ചെയ്യാൻ
  rationale: മുമ്പ് ലഭിച്ച പരിചരണത്തിനു പകരമായി നന്മ ചെയ്യുക എന്ന ആശയം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τοῖς προγόνοις
  choice: തങ്ങളുടെ മുൻതലമുറക്കാർക്ക്
  rationale: πρόγονοι എന്നതിന്റെ മാതാപിതാക്കളെയും മറ്റു മുൻതലമുറക്കാരെയും ഉൾക്കൊള്ളാവുന്ന വ്യാപ്തി സംരക്ഷിക്കുന്നു; ‘പൂർവികർ’ എന്ന പദം മരിച്ചവരെ മാത്രം ഓർമിപ്പിക്കാനുള്ള സാധ്യത ഒഴിവാക്കുന്നു.
- source_word: ἀπόδεκτον
  choice: സ്വീകാര്യമാണ്
  rationale: ദൈവം ഈ പ്രവൃത്തിയെ അനുകൂലമായി സ്വീകരിക്കുന്നു എന്ന മൂലപദത്തിന്റെ അർഥത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ സാന്നിധ്യത്തിലും വിലയിരുത്തലിലും എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: μανθανέτωσαν എന്ന ബഹുവചന ആജ്ഞയുടെ കർത്താവ്
  choice: വിധവയുടെ മക്കളോ കൊച്ചുമക്കളോ ആണ് ആജ്ഞയുടെ കർത്താക്കൾ.
  alternative: എണ്ണത്തിൽ പരോക്ഷമായ മാറ്റം കരുതി ആജ്ഞ വിധവമാരോടാണ് എന്നു വായിക്കുക.
  rationale: ഏറ്റവും അടുത്തുള്ള ബഹുവചന പദങ്ങൾ τέκνα ἢ ἔκγονα ആണ്; കുടുംബാംഗങ്ങൾ വിധവയെ പരിപാലിച്ച് മുൻതലമുറയ്ക്കു പ്രത്യുപകാരം ചെയ്യണം എന്ന തുടർന്നുള്ള ആശയത്തോടും ഇത് യോജിക്കുന്നു.
- issue: εὐσεβεῖν എന്നതിലെ ദൈവഭക്തിയും കുടുംബപരിചരണവും തമ്മിലുള്ള ബന്ധം
  choice: കുടുംബത്തെ പരിപാലിക്കുന്നത് ദൈവഭക്തിയുടെ പ്രായോഗിക പ്രകടനമായി അവതരിപ്പിക്കുന്നു.
  alternative: മതപരമായ സൂചന കുറഞ്ഞ, കുടുംബക്കടമ നിറവേറ്റുക എന്ന അർഥത്തിൽ മാത്രം വായിക്കുക.
  rationale: εὐσεβεῖν വ്യക്തമായ ഭക്തി/ദൈവഭക്തി അർഥം വഹിക്കുന്നു; ഈ പ്രവൃത്തി ദൈവസന്നിധിയിൽ സ്വീകാര്യമാണെന്ന അവസാനവാക്യവും ആ ദൈവശാസ്ത്രപരമായ മാനം ഉറപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവഭക്തി’ എന്ന മതപരമായ അർഥം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ കുടുംബത്തെ ആരാധിക്കുന്നതുപോലുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അതിന്റെ പ്രകടനം കുടുംബപരിപാലനവുമായി വ്യക്തമായി ബന്ധിപ്പിച്ചു. ആജ്ഞയുടെ ബഹുവചന കർത്താവിനെ ‘അവർ’ എന്നു തുറന്നുകാട്ടി.
