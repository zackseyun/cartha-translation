  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχουσαι κρίμα ὅτι τὴν πρώτην πίστιν ἠθέτησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/012.yaml
  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: ml
  text: തങ്ങളുടെ മുമ്പുണ്ടായിരുന്ന വിശ്വാസം തള്ളിക്കളഞ്ഞതിനാൽ അവർ ന്യായവിധി നേരിടുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘തങ്ങളുടെ ആദ്യ പ്രതിജ്ഞ’ അഥവാ ‘മുമ്പുണ്ടായിരുന്ന പ്രതിബദ്ധത.’ ഗ്രീക്ക് പദത്തിന് ‘വിശ്വാസം’ എന്ന അർഥമുണ്ട്; എന്നാൽ ഈ സന്ദർഭത്തിൽ, വിധവകളുടെ പട്ടികയിൽ ചേർന്നതുമായി ബന്ധപ്പെട്ടിരിക്കാവുന്ന ഒരു മുൻപ്രതിജ്ഞയെയാണ് ഇതു സൂചിപ്പിക്കുന്നതെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: വിധേയരാകുന്നു
  rationale: ക്രിയാവിശേഷണരൂപം അക്ഷരാർഥത്തിൽ ‘ഉള്ളവരായി’ എന്നാണെങ്കിലും, κρίμαയോടൊപ്പം വരുമ്പോൾ ന്യായവിധിക്ക് കീഴിലാകുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: ഈ പദത്തിന് വിധി, ശിക്ഷാവിധി, കുറ്റവിധി എന്നീ അർഥങ്ങൾ വരാം. നിത്യശിക്ഷയെന്ന ആശയം അനാവശ്യമായി ചേർക്കാതെ ഗൗരവം നിലനിർത്താൻ ‘ന്യായവിധി’ തെരഞ്ഞെടുത്തു.
- source_word: ὅτι
  choice: തിനാൽ
  rationale: ന്യായവിധിക്ക് കാരണമെന്തെന്ന് സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ കാരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν πρώτην πίστιν
  choice: തങ്ങളുടെ മുൻവിശ്വാസം
  rationale: πρώτην ഇവിടെ മുമ്പുണ്ടായിരുന്നതിനെ സൂചിപ്പിക്കുന്നു; πίστιν എന്നത് മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ എന്നു നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ ‘ആദ്യ പ്രതിജ്ഞ’ അല്ലെങ്കിൽ ‘മുൻ പ്രതിബദ്ധത’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἠθέτησαν
  choice: തള്ളിക്കളഞ്ഞതിനാൽ
  rationale: ἀθετέωയ്ക്ക് നിരസിക്കുക, മാറ്റിവെക്കുക, അസാധുവാക്കുക എന്നീ അർഥങ്ങളുണ്ട്. മുൻവിശ്വാസത്തെയോ പ്രതിബദ്ധതയെയോ ഉപേക്ഷിച്ചെന്ന ആശയം ‘തള്ളിക്കളയുക’ വ്യക്തമായി നൽകുന്നു; perfect രൂപത്തിന്റെ നിലവിലെ പ്രസക്തി കാരണവാക്യത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: τὴν πρώτην πίστιν എന്ന പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം
  choice: തങ്ങളുടെ മുൻവിശ്വാസം
  alternative: തങ്ങളുടെ ആദ്യ പ്രതിജ്ഞ / മുൻ പ്രതിബദ്ധത
  rationale: πίστις സാധാരണയായി ‘വിശ്വാസം’ എന്നാണെങ്കിലും, ഈ സന്ദർഭത്തിൽ വിധവകളുടെ പട്ടികയിൽ ചേർന്നപ്പോഴുള്ള ഒരു മുൻപ്രതിജ്ഞയെയോ പ്രതിബദ്ധതയെയോ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു. ഈ യഥാർഥ അർഥദ്വയസാധ്യത പരിഹരിക്കാതെ, മുഖ്യപാഠത്തിൽ ‘വിശ്വാസം’ നിലനിർത്തുകയും മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായവിധിക്ക് വിധേയരാകുന്നു’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ κρίμαയുടെ ഗൗരവം നിലനിർത്തുന്നു; വിവാദമായ πίστις എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
