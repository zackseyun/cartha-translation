id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: ml
  text: അതുപോലെതന്നെ, നല്ല പ്രവൃത്തികളും വ്യക്തമാണ്; മറ്റുവിധത്തിലുള്ളവയും[a] മറഞ്ഞിരിക്കാൻ കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യത്യസ്തമായവ” അല്ലെങ്കിൽ “അങ്ങനെയല്ലാത്തവ.” മുൻവാക്യത്തോടുള്ള സാമ്യം കണക്കിലെടുത്ത് ചിലർ ഇതിനെ പ്രത്യേകിച്ച് ദുഷ്പ്രവൃത്തികൾ എന്നു മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തോടുള്ള സമാന്തരബന്ധവും ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἔργα τὰ καλά
  choice: നല്ല പ്രവൃത്തികൾ
  rationale: ἔργα എന്നതിന്റെ പ്രവർത്തി/കൃതി എന്ന മൂർത്തമായ അർഥവും καλά എന്ന ധാർമിക ഗുണവും നിലനിർത്തുന്ന, പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച പരിചിതമായ പദപ്രയോഗം.
- source_word: πρόδηλα
  choice: വ്യക്തമാണ്
  rationale: പ്രകടമായത്, എളുപ്പം തിരിച്ചറിയാവുന്നത് എന്ന അർഥം നൽകുകയും മറഞ്ഞിരിക്കുന്നതുമായുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὰ ἄλλως ἔχοντα
  choice: മറ്റുവിധത്തിലുള്ളവ
  rationale: ഇവ ദുഷ്പ്രവൃത്തികളാണെന്ന് വാചകം നേരിട്ട് പറയാത്തതിനാൽ, ഗ്രീക്കിലെ സംക്ഷിപ്തവും തുറന്നതുമായ വൈരുധ്യം അമിതമായി വ്യാഖ്യാനിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: κρυβῆναι οὐ δύνανται
  choice: മറഞ്ഞിരിക്കാൻ കഴിയില്ല
  rationale: δύνανται സൂചിപ്പിക്കുന്ന അസാധ്യതയും ഇപ്പോൾ വ്യക്തമല്ലാത്ത പ്രവൃത്തികൾക്കും ഒടുവിൽ മറഞ്ഞുനിൽക്കാനാവില്ലെന്ന സന്ദർഭബലവും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: τὰ ἄλλως ἔχοντα പ്രത്യേകിച്ച് ദുഷ്പ്രവൃത്തികളെയാണോ, അതോ മറ്റുവിധത്തിലുള്ളതോ ഇപ്പോൾ വ്യക്തമല്ലാത്തതോ ആയ പ്രവൃത്തികളെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘മറ്റുവിധത്തിലുള്ളവ’ എന്ന വിശാലവും തുറന്നതുമായ പ്രയോഗം
  alternative: ‘ദുഷ്പ്രവൃത്തികൾ’ എന്ന് വ്യക്തമായി പരിഭാഷപ്പെടുത്തുക
  rationale: ഗ്രീക്ക് പാഠം ഇവിടെ ‘ദുഷ്ടം’ എന്ന പദം ഉപയോഗിക്കുന്നില്ല. മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ദുഷ്പ്രവൃത്തികൾ എന്ന സൂചന സാധ്യമാണെങ്കിലും, അതിനെ മുഖ്യപാഠത്തിൽ നിർബന്ധിതമാക്കാതെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘നല്ല പ്രവൃത്തികൾ’ എന്ന പരിചിതമായ ബൈബിൾ പ്രയോഗം നിലനിർത്തിയപ്പോൾ, ‘മറ്റുവിധത്തിലുള്ളവ’ എന്നത് മൂലപാഠത്തിലെ വ്യാഖ്യാനതുറന്ന നില സംരക്ഷിക്കുന്നു.
