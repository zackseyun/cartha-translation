id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: ml
  text: 'സൽപ്രവൃത്തികളുടെ കാര്യത്തിൽ നല്ല സാക്ഷ്യമുള്ളവളായിരിക്കണം: അവൾ മക്കളെ വളർത്തിയിട്ടുണ്ടെങ്കിൽ, അതിഥികളെ സ്വീകരിച്ചിട്ടുണ്ടെങ്കിൽ, വിശുദ്ധരുടെ[a] കാലുകൾ കഴുകിയിട്ടുണ്ടെങ്കിൽ, കഷ്ടത അനുഭവിക്കുന്നവരെ സഹായിച്ചിട്ടുണ്ടെങ്കിൽ, എല്ലാ സൽപ്രവൃത്തികളുടെയും പിന്നാലെ പോയിട്ടുണ്ടെങ്കിൽ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “വിശുദ്ധർ” എന്നത് ദൈവത്തിന്റെ വിശുദ്ധജനമായ സഹവിശ്വാസികളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എല്ലാ സൽപ്രവൃത്തികളെയും പിന്തുടർന്നിട്ടുണ്ടെങ്കിൽ.” ഗ്രീക്ക് പ്രയോഗം സൽപ്രവൃത്തികളെ സജീവമായി പിന്തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: സൽപ്രവൃത്തികൾക്ക് സാക്ഷ്യം ലഭിച്ചവളായിരിക്കണം
  rationale: അവളുടെ സൽപ്രവൃത്തികളെക്കുറിച്ച് മറ്റുള്ളവർ നൽകുന്ന അനുകൂലസാക്ഷ്യം എന്ന passive ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰ
  choice: …ഇട്ടുണ്ടോ … എന്നു നോക്കണം
  rationale: ആവർത്തിക്കുന്ന εἰ യോഗ്യതകളുടെ പരിശോധനാസ്വഭാവമുള്ള പട്ടികയാണ്; മലയാളത്തിൽ ഓരോ ഘടകത്തിന്റെയും ആവർത്തനം നിലനിർത്തിക്കൊണ്ട് വാക്യം പൂർണമാക്കുന്നു.
- source_word: ἐτεκνοτρόφησεν
  choice: മക്കളെ വളർത്തിയിട്ടുണ്ടോ
  rationale: ജന്മമക്കൾ മാത്രമെന്ന് പരിമിതപ്പെടുത്താതെ കുട്ടികളെ പോറ്റിവളർത്തിയ അർഥം നൽകുന്നു.
- source_word: ἐξενοδόχησεν
  choice: അതിഥികളെ സ്വീകരിച്ചിട്ടുണ്ടോ
  rationale: അപരിചിതരെയോ അതിഥികളെയോ വീട്ടിൽ സ്വീകരിക്കുക എന്ന ക്രിയയുടെ പ്രത്യേക അർഥം പൊതുവായ ‘അതിഥിസൽക്കാരം’ എന്നതിലുപരി നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: വിശുദ്ധരുടെ കാലുകൾ കഴുകിയിട്ടുണ്ടോ
  rationale: ആദ്യകാല ക്രിസ്തീയ സാഹചര്യത്തിലെ വിനീതമായ സേവനപ്രവൃത്തിയെ അതിന്റെ സാംസ്കാരിക ശക്തിയോടെ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: കഷ്ടത അനുഭവിക്കുന്നവരെ സഹായിച്ചിട്ടുണ്ടോ
  rationale: θλίβω സൂചിപ്പിക്കുന്ന സമ്മർദം, ദുരിതം, കഷ്ടത എന്നിവയുടെ വിശാലത നിലനിർത്തുകയും ἐπαρκέωയുടെ പ്രായോഗികസഹായം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: എല്ലാ സൽപ്രവൃത്തികളെയും ഉത്സാഹത്തോടെ പിന്തുടർന്നിട്ടുണ്ടോ
  rationale: ἐπακολουθέωയുടെ ‘പിന്നാലെ ചെല്ലുക/പിന്തുടരുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു; മലയാളത്തിൽ നൈതികമായ സജീവാനുഷ്ഠാനം വ്യക്തമാക്കാൻ ‘ഉത്സാഹത്തോടെ’ ചേർക്കുന്നു, എന്നാൽ സമർപ്പണം എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ἁγίων എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: വിശുദ്ധർ
  alternative: വിശ്വാസികൾ / ദൈവത്തിന്റെ വിശുദ്ധജനം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട സഹവിശ്വാസികളെയാണ് സാധാരണ സൂചിപ്പിക്കുന്നത്. പ്രധാനപാഠം മുഖ്യപദത്തിന്റെ രൂപം നിലനിർത്തുകയും അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ἐπηκολούθησεν എന്നതിലെ പ്രവർത്തനതീവ്രത
  choice: ഉത്സാഹത്തോടെ പിന്തുടർന്നു
  alternative: സ്വയം സമർപ്പിച്ചു / ചെയ്തുപോന്നു
  rationale: മൂലത്തിലെ പിന്തുടരുക എന്ന രൂപകവും സജീവപ്രതിബദ്ധതയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; ഒരു പ്രത്യേക സഭാപരമായ സേവനക്രമം ഇതിൽ വായിച്ചുചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. മുൻവാക്യത്തിലെ വിധവയെ പട്ടികയിൽ ചേർക്കാനുള്ള യോഗ്യതാപരിശോധന തുടരുന്നതായി മലയാളവാക്യം പൂർണമാക്കിയിരിക്കുന്നു; മൂലത്തിലെ ആവർത്തനഘടന കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്.
