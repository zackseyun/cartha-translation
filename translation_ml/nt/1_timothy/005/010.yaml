revisions:
- from: 'സൽപ്രവൃത്തികൾക്ക് സാക്ഷ്യം ലഭിച്ചവളായിരിക്കണം: അവൾ മക്കളെ വളർത്തിയിട്ടുണ്ടോ, അതിഥികളെ സ്വീകരിച്ചിട്ടുണ്ടോ, വിശുദ്ധരുടെ[a] കാലുകൾ കഴുകിയിട്ടുണ്ടോ, കഷ്ടത അനുഭവിക്കുന്നവരെ സഹായിച്ചിട്ടുണ്ടോ, എല്ലാ സൽപ്രവൃത്തികളെയും ഉത്സാഹത്തോടെ പിന്തുടർന്നിട്ടുണ്ടോ[b] എന്നു നോക്കണം.'
  to: 'സൽപ്രവൃത്തികളുടെ കാര്യത്തിൽ നല്ല സാക്ഷ്യമുള്ളവളായിരിക്കണം: അവൾ മക്കളെ വളർത്തിയിട്ടുണ്ടെങ്കിൽ, അതിഥികളെ സ്വീകരിച്ചിട്ടുണ്ടെങ്കിൽ, വിശുദ്ധരുടെ[a] കാലുകൾ കഴുകിയിട്ടുണ്ടെങ്കിൽ, കഷ്ടത അനുഭവിക്കുന്നവരെ സഹായിച്ചിട്ടുണ്ടെങ്കിൽ, എല്ലാ സൽപ്രവൃത്തികളുടെയും പിന്നാലെ പോയിട്ടുണ്ടെങ്കിൽ[b].'
