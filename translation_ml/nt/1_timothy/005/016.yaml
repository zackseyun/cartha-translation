id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: ml
  text: ഏതെങ്കിലും വിശ്വാസിനിയുടെ പരിചരണത്തിൽ വിധവകൾ ഉണ്ടെങ്കിൽ[a], അവൾ അവർക്കു ആവശ്യമായ സഹായം നൽകട്ടെ. സഭ ഭാരപ്പെടാതിരിക്കട്ടെ; അങ്ങനെ യഥാർഥത്തിൽ വിധവകളായിരിക്കുന്നവർക്ക് സഭ ആവശ്യമായ സഹായം നൽകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ, “വിശ്വാസിയായ ഏതെങ്കിലും പുരുഷനോ സ്ത്രീക്കോ വിധവകൾ ഉണ്ടെങ്കിൽ” എന്നോ “വിശ്വാസിയായ ഏതൊരാൾക്കും വിധവകൾ ഉണ്ടെങ്കിൽ” എന്നോ വായിക്കുന്നു; അങ്ങനെ നിർദേശം പ്രത്യേകമായി ഒരു സ്ത്രീയെ മാത്രം സംബന്ധിക്കുന്നതല്ലാതെ കൂടുതൽ വിശാലമാകുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: വിശ്വാസിനിയായ ഏതെങ്കിലും സ്ത്രീ
  rationale: πιστή സ്ത്രീലിംഗ ഏകവചനമായതിനാൽ ഈ പാഠരൂപത്തിൽ വിഷയം പ്രത്യേകമായി ഒരു സ്ത്രീയാണ്. പാസ്റ്ററൽ ലേഖനങ്ങളിലെ സന്ദർഭത്തിൽ ‘വിശ്വാസിനി’ ക്രിസ്തീയ വിശ്വാസിയായ വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: χήρας
  choice: വിധവകൾ
  rationale: χήραയുടെ ബഹുവചന കർമരൂപം; ഈ അധ്യായത്തിന്റെ സന്ദർഭം ഭൗതികസഹായം ആവശ്യമുള്ള വിധവകളെക്കുറിച്ചാണ്.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: വേണ്ട സഹായം നൽകട്ടെ / വേണ്ട സഹായം നൽകാൻ കഴിയും
  rationale: ἐπαρκέω ഇവിടെ ആവശ്യത്തിന് പ്രായോഗികവും ഭൗതികവുമായ സഹായം നൽകുന്നതിനെ സൂചിപ്പിക്കുന്നു. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ അടിസ്ഥാന പദപ്രയോഗം നിലനിർത്തി.
- source_word: βαρείσθω
  choice: ഭാരം വരുത്തരുത്
  rationale: സഭ ഒരു ബാധ്യതയാൽ ഭാരപ്പെടരുതെന്ന നിഷ്ക്രിയ ആജ്ഞയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡ ἐκκλησία
  choice: സഭ
  rationale: ഇവിടെ ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെയാണ് ἐκκλησία സൂചിപ്പിക്കുന്നത്; ‘സഭ’ മലയാളത്തിലെ മാനകവും വ്യക്തവുമായ പദമാണ്.
- source_word: ὄντως
  choice: യഥാർഥത്തിൽ
  rationale: കുടുംബസഹായമില്ലാതെ യഥാർഥ ആവശ്യത്തിലിരിക്കുന്ന വിധവകളെ മറ്റുള്ളവരിൽനിന്ന് വേർതിരിക്കുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ταῖς ὄντως χήραις
  choice: യഥാർഥത്തിൽ വിധവകളായിരിക്കുന്നവർ
  rationale: ഈ അധ്യായം നിർവചിക്കുന്ന പൂർണ അർഥത്തിലുള്ള, ഒറ്റയ്ക്കായതും സഭയുടെ സഹായത്തിന് അർഹതയുള്ളതുമായ വിധവകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആരംഭവാക്യത്തിലെ കർത്താവിന്റെ ലിംഗം
  choice: 'പ്രത്യേക സ്ത്രീവിഷയം: ‘വിശ്വാസിനിയായ ഏതെങ്കിലും സ്ത്രീ’'
  alternative: മറ്റു പാഠപരമ്പരകളെ അടിസ്ഥാനമാക്കിയുള്ള ‘വിശ്വാസിയായ ഏതൊരാൾ’ അല്ലെങ്കിൽ ‘വിശ്വാസിയായ പുരുഷനോ സ്ത്രീയോ’
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ τις πιστή വ്യാകരണപരമായി സ്ത്രീലിംഗ ഏകവചനമാണ്. അതിനാൽ മുഖ്യപാഠം സ്ത്രീയെ തന്നെയാണ് സൂചിപ്പിക്കുന്നത്; വിശാലമായ മറ്റു വായനകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിധവകൾ ഉണ്ടെങ്കിൽ’ എന്നത് ഗ്രീക്കിലെ ἔχει χήρας എന്ന ബന്ധസൂചനയുടെ ഉദ്ദേശപൂർവമായ അടുത്ത പരിഭാഷയാണ്; കുടുംബത്തിലോ പരിചരണബാധ്യതയിലോ വിധവകൾ ഉള്ള സാഹചര്യം സന്ദർഭം വ്യക്തമാക്കുന്നു.
