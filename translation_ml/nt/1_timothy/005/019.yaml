id: 1TI.5.19
reference: 1 Timothy 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: ml
  text: ഒരു മൂപ്പനെതിരായ[a] കുറ്റാരോപണം രണ്ടോ മൂന്നോ സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിലല്ലാതെ സ്വീകരിക്കരുത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘പ്രായമേറിയ ഒരു പുരുഷനെതിരായ.’ πρεσβυτέρου എന്ന പദം സഭയിലെ ‘മൂപ്പൻ’ എന്ന സ്ഥാനത്തെക്കാൾ പ്രായത്തെ സൂചിപ്പിക്കുന്നതായി എടുത്താൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ഒരു കാര്യം ‘രണ്ടോ മൂന്നോ സാക്ഷികളുടെ’ അടിസ്ഥാനത്തിൽ ഉറപ്പിക്കണമെന്ന പഴയനിയമ നിയമതത്ത്വം ഈ വാക്കുകളിൽ പ്രതിഫലിക്കുന്നു (ആവർത്തനം 19:15 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: ഒരു മൂപ്പനെതിരായ
  rationale: κατά ഇവിടെ കുറ്റാരോപണം ആരെതിരെയാണെന്നു സൂചിപ്പിക്കുന്നു. πρεσβύτερος സമീപസന്ദർഭത്തിൽ സഭയിലെ മൂപ്പനെയോ നേതാവിനെയോ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത; എന്നാൽ പ്രായമേറിയ പുരുഷൻ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατηγορίαν
  choice: കുറ്റാരോപണം
  rationale: ഔപചാരികമായ ആരോപണം അഥവാ കുറ്റം ചുമത്തൽ എന്ന ന്യായപരമായ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ παραδέχου
  choice: സ്വീകരിക്കരുത്
  rationale: ആരോപണം കേവലം സത്യമെന്നു സമ്മതിക്കരുത് എന്നതിലുപരി, ആവശ്യമായ തെളിവില്ലാതെ പരിഗണനയ്ക്കെടുക്കരുത് എന്ന നടപടിക്രമപരമായ അർഥവും ഈ പ്രയോഗം വഹിക്കുന്നു.
- source_word: ἐκτὸς εἰ μὴ
  choice: അല്ലാതെ
  rationale: തുടർന്നുവരുന്ന നിബന്ധനയ്ക്ക് പുറത്തുള്ള സാഹചര്യങ്ങളെ ഒഴിവാക്കുന്ന അപവാദപ്രയോഗം മലയാളത്തിൽ ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: രണ്ടോ മൂന്നോ സാക്ഷികളുടെ മൊഴിയുടെ അടിസ്ഥാനത്തിൽ
  rationale: ἐπίയുടെ തെളിവാധിഷ്ഠിതമായ അർഥവും പഴയനിയമത്തിലെ നിയമഭാഷയുടെ പ്രതിധ്വനിയും വ്യക്തമാക്കുന്നു; ‘മൊഴി’ എന്നത് സാക്ഷികൾ നൽകുന്ന സാക്ഷ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിൽ πρεσβυτέρου എന്നതിന്റെ അർഥം
  choice: സഭയിലെ മൂപ്പൻ/നേതാവ്
  alternative: പ്രായമേറിയ പുരുഷൻ
  rationale: 1 തിമൊഥെയോസ് 5-ലെ സമീപസന്ദർഭം മൂപ്പന്മാരുടെ ശുശ്രൂഷയും ശാസനയും സംബന്ധിക്കുന്നതിനാൽ ഔദ്യോഗിക സഭാനേതാവെന്ന അർഥമാണ് കൂടുതൽ സാധ്യത. എങ്കിലും പദത്തിന്റെ പ്രായാധിഷ്ഠിതമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘മൂപ്പൻ’ എന്ന പ്രചാരത്തിലുള്ള സഭാപദം ഉപയോഗിച്ചെങ്കിലും മൂലപദത്തിലെ പ്രായാധിഷ്ഠിത അർഥസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചിരിക്കുന്നു. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കി, നിയമപരവും നടപടിക്രമപരവുമായ ഭാവം നിലനിർത്തി.
