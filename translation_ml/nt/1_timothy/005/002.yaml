source:
  edition: SBLGNT
  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: ml
  text: പ്രായമായ സ്ത്രീകളെ അമ്മമാരെപ്പോലെയും, ഇളയ സ്ത്രീകളെ പൂർണ നിർമലതയോടെ സഹോദരിമാരെപ്പോലെയും പരിഗണിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ നിർമലതയിലും.” ഈ സന്ദർഭത്തിൽ ഈ പ്രയോഗത്തിന് ചാരിത്ര്യശുദ്ധിയുടെയും ലൈംഗിക മര്യാദയുടെയും ശക്തമായ സൂചന ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: പ്രായമായ സ്ത്രീകളെ
  rationale: സ്ത്രീലിംഗ ബഹുവചനമായ ഈ വിശേഷണം ഇവിടെ നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു; νεωτέρας എന്നതുമായുള്ള വൈരുധ്യം സഭാപദവിയെയല്ല, പ്രായത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὡς
  choice: -യെപ്പോലെ
  rationale: താരതമ്യം സൂചിപ്പിക്കുന്ന ὡς എന്ന പദത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; അമ്മമാർ/സഹോദരിമാർ എന്ന സമാന്തര കുടുംബബന്ധരൂപകം നിലനിർത്തുന്നു.
- source_word: μητέρας
  choice: അമ്മമാരെ
  rationale: ഗ്രീക്കിൽ ഇല്ലാത്ത ‘നിന്റെ’ എന്നത് ചേർക്കാതെ കുടുംബബന്ധരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: νεωτέρας
  choice: ഇളയ സ്ത്രീകളെ
  rationale: സ്ത്രീലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ച് പ്രായത്തിൽ ഇളയ സ്ത്രീകളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀδελφὰς
  choice: സഹോദരിമാരെ
  rationale: കുടുംബാംഗങ്ങളോടുള്ളതുപോലെയുള്ള സമീപനം വ്യക്തമാക്കുന്ന രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: പൂർണ നിർമലതയോടെ
  rationale: πάσῃ സൂചിപ്പിക്കുന്ന സമഗ്രതയും ἁγνείαയുടെ വിശാലമായ ധാർമിക നിർമലതയും, സന്ദർഭത്തിലുള്ള ലൈംഗിക മര്യാദയുടെ ശക്തമായ സൂചനയും അനാവശ്യമായി ചുരുക്കാതെ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഇളയ സ്ത്രീകളോടുള്ള പെരുമാറ്റത്തിൽ ἁγνείαയുടെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ വിശാലമായ അർഥമുള്ള ‘നിർമലത’ ഉപയോഗിക്കുക
  alternative: ‘പൂർണ ലൈംഗിക ശുദ്ധിയോടെ’ അഥവാ ‘പരിപൂർണ ചാരിത്ര്യശുദ്ധിയോടെ’
  rationale: ἁγνεία പൊതുവായ ധാർമിക നിർമലതയെ സൂചിപ്പിക്കാമെങ്കിലും ഈ സന്ദർഭത്തിൽ ലൈംഗിക മര്യാദയും ശക്തമായി ഉൾപ്പെടുന്നു. വിശാലമായ പദം മൂലപാഠത്തിന്റെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്നതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന ആജ്ഞയുടെ ക്രിയ മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘കാണുക’ എന്നു നൽകിയിരിക്കുന്നു; കുടുംബബന്ധങ്ങളിലെ സമീപനം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണിത്.
