  to: എന്നാൽ പ്രായം കുറഞ്ഞ വിധവകളെ സ്വീകരിക്കരുത്[a]. എന്തെന്നാൽ, അവർ മശീഹയ്ക്കെതിരായി ഇന്ദ്രിയാസക്തരാകുമ്പോൾ[b][c], വിവാഹം കഴിക്കാൻ ആഗ്രഹിക്കുന്നു.
  rationale: The revision replaces the less precise periphrasis ‘ഇന്ദ്രിയാഭിലാഷങ്ങൾക്ക് വഴങ്ങുമ്പോൾ’ with ‘ഇന്ദ്രിയാസക്തരാകുമ്പോൾ.’ This better represents the inchoative force and sensual/self-indulgent sense of καταστρηνιάω, while ‘മശീഹയ്ക്കെതിരായി’ preserves the source’s disputed and grammatically difficult relation without importing a full interpretation. Footnote c is adjusted so that its first alternative is genuinely distinct from the revised main text.
