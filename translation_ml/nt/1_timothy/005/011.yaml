id: 1TI.5.11
reference: 1 Timothy 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: ml
  text: എന്നാൽ പ്രായം കുറഞ്ഞ വിധവകളെ സ്വീകരിക്കരുത്[a]. എന്തെന്നാൽ, അവർ മശീഹയ്ക്കെതിരായി ഇന്ദ്രിയാസക്തരാകുമ്പോൾ[b][c], വിവാഹം കഴിക്കാൻ ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘സ്വീകരിക്കരുത്’ എന്നത്, സന്ദർഭത്തിൽ ചർച്ച ചെയ്യുന്ന വിധവകളുടെ പട്ടികയിൽ അവരെ ചേർക്കാതിരിക്കുന്നതിനെ സൂചിപ്പിക്കാം; അവരുമായി യാതൊരു ബന്ധവും പുലർത്തരുത് എന്നല്ല.
    reason: contextual_clarification
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘മശീഹയ്ക്കെതിരായി.’ അവരുടെ അഭിലാഷങ്ങൾ മശീഹയോടുള്ള മുൻസമർപ്പണത്തോടോ പ്രതിബദ്ധതയോടോ സംഘർഷത്തിലാകുന്നു എന്നായിരിക്കാം ആശയം.
    reason: alternative_reading
  - marker: c
    text: 'മറ്റൊരു പരിഭാഷ: ‘മശീഹയ്ക്കെതിരായി കാമാസക്തരാകുമ്പോൾ’ അല്ലെങ്കിൽ ‘അവരുടെ ഇന്ദ്രിയാഭിലാഷങ്ങൾ അവരെ മശീഹയിൽനിന്ന് അകറ്റുമ്പോൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας χήρας
  choice: പ്രായം കുറഞ്ഞ വിധവകളെ
  rationale: വിശേഷണം χήρας-നെ നേരിട്ട് വിശേഷിപ്പിക്കുകയും മുൻസന്ദർഭത്തിലെ പ്രായമേറിയ വിധവകളോടുള്ള വ്യത്യാസം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. കൃത്യമായ പ്രായപരിധി നിർണ്ണയിക്കാതെ താരതമ്യഭാവം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ നിർദേശങ്ങളിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യവും വിഷയമാറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: παραιτοῦ
  choice: സ്വീകരിക്കരുത്
  rationale: ഇവിടെ തിമൊഥെയൊസ് അവരെ പൊതുവായി തള്ളിക്കളയണമെന്നല്ല, സന്ദർഭത്തിൽ ചർച്ച ചെയ്യുന്ന വിധവകളുടെ പട്ടികയിലേക്ക് സ്വീകരിക്കരുതെന്ന നിർദേശമാണ്. പ്രധാനപാഠത്തിൽ പട്ടിക എന്ന വാക്ക് ചേർക്കാതെ സന്ദർഭാർഥം നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: ὅταν γὰρ
  choice: എന്തെന്നാൽ, … എപ്പോൾ
  rationale: γὰρ-ന്റെ കാരണസൂചനയും ὅταν-ന്റെ പൊതുവായ കാലസാഹചര്യവും മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ സംരക്ഷിക്കുന്നു.
- source_word: καταστρηνιάσωσιν
  choice: ഇന്ദ്രിയാഭിലാഷങ്ങൾക്ക് വഴങ്ങുമ്പോൾ
  rationale: അപൂർവമായ ഈ ക്രിയയിൽ ഇന്ദ്രിയപരമോ കാമപരമോ ആയ പ്രേരണകൾ മേൽക്കൈ നേടുന്ന ആശയം ഉണ്ട്. ‘കാമാസക്തരാകുക’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും, പുനർവിവാഹത്തെയേ തന്നെ കുറ്റമായി ചിത്രീകരിക്കാത്തതുമായ പ്രയോഗമാണിത്.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയ്ക്കെതിരായി
  rationale: ദുഷ്കരമായ ജനിറ്റീവ് ബന്ധം വിശദീകരിച്ച് തീർക്കാതെ ‘എതിരായി’ എന്ന നേരിട്ടുള്ള ബന്ധം നിലനിർത്തുന്നു. Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: γαμεῖν θέλουσιν
  choice: വിവാഹം കഴിക്കാൻ ആഗ്രഹിക്കുന്നു
  rationale: θέλω കൂടിയ അനന്തക്രിയ ആഗ്രഹമോ ഉദ്ദേശ്യമോ പ്രകടിപ്പിക്കുന്നു; മലയാളത്തിൽ ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ രൂപമാണിത്.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ പേരുപോലെയല്ല, പദവിയായാണ് പ്രവർത്തിക്കുന്നത്. അതിനാൽ ‘മശീഹ’ മൂലഭാഷയിലെ പദവിസ്വഭാവം കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- issue: καταστρηνιάσωσιν τοῦ Χριστοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥബന്ധം
  choice: മശീഹയ്ക്കെതിരായി ഇന്ദ്രിയാഭിലാഷങ്ങൾക്ക് വഴങ്ങുക
  alternative: മശീഹയോടുള്ള മുൻസമർപ്പണത്തെ അവഗണിച്ച് അവരുടെ അഭിലാഷങ്ങൾ മേൽക്കൈ നേടുക
  rationale: മൂലപാഠത്തിലെ ‘മശീഹയ്ക്കെതിരായി’ എന്ന ദുഷ്കരമായ ബന്ധം പ്രധാനപാഠത്തിൽ നിലനിർത്തി; അത് മുൻസമർപ്പണത്തോടുള്ള സംഘർഷമാണെന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിലേക്കു മാറ്റി. അതുവഴി പുനർവിവാഹം തന്നെയാണ് കുറ്റമെന്ന് വാക്യം പറയുന്നതായി നിർബന്ധിച്ച് വ്യാഖ്യാനിക്കുന്നതു ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘നിരസിക്കുക’ എന്നത് വിധവകളെ വ്യക്തികളെന്ന നിലയിൽ തള്ളിക്കളയുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ ‘സ്വീകരിക്കരുത്’ ഉപയോഗിച്ചു. ദുഷ്കരമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംഘർഷം പ്രധാനപാഠത്തിൽ നിലനിർത്തി, ആവശ്യമായ സന്ദർഭവ്യാഖ്യാനം അടിക്കുറിപ്പുകളിൽ നൽകി.
