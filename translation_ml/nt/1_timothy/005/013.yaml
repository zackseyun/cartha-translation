id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: ml
  text: അതോടൊപ്പം, വീടുതോറും കറങ്ങിനടന്ന് അവർ അലസരായിരിക്കാൻ പഠിക്കുന്നു. അവർ അലസരായിരിക്കുക മാത്രമല്ല, പരദൂഷണം പറയുന്നവരും[a] മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ അനാവശ്യമായി ഇടപെടുന്നവരും[b] ആയിത്തീരുന്നു; പറയാൻ പാടില്ലാത്തതു സംസാരിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വ്യർഥമായി സംസാരിക്കുന്നവർ”; ഗ്രീക്ക് പദത്തിന് വിവേകശൂന്യമോ പൊള്ളയോ ആയ സംസാരത്തെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കാം. ഈ സന്ദർഭത്തിൽ പരദൂഷണവും അതിൽ ഉൾപ്പെടാൻ സാധ്യതയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അന്യകാര്യങ്ങളിൽ തലയിടുന്നവർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: അതോടൊപ്പം
  rationale: മുൻവാക്യത്തിലെ ചർച്ചയോടുള്ള ബന്ധവും ‘കൂടാതെ/അതേ സമയം’ എന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀργαὶ
  choice: അലസർ / അലസരായിരിക്കാൻ
  rationale: വെറും ധാർമ്മികമായ മടിയേക്കാൾ പ്രവർത്തിയില്ലായ്മയും അലസശീലവും സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: μανθάνουσιν
  choice: പഠിക്കുന്നു
  rationale: ഔപചാരിക പഠനമല്ല, ഒരു ശീലം കൈവരിക്കുന്നതാണിവിടെ; ‘അലസരായിരിക്കാൻ പഠിക്കുന്നു’ എന്ന പ്രയോഗം ആ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: വീടുതോറും കറങ്ങിനടന്ന്
  rationale: ഒരു വീട്ടിൽനിന്ന് മറ്റൊന്നിലേക്കുള്ള സഞ്ചാരത്തിന്റെ വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φλύαροι
  choice: പരദൂഷണം പറയുന്നവർ
  rationale: വ്യർഥമോ വിവേകശൂന്യമോ ആയ സംസാരത്തെ സൂചിപ്പിക്കുന്ന പദം ഈ സന്ദർഭത്തിൽ മറ്റുള്ളവരെക്കുറിച്ചുള്ള ദോഷസംസാരവും ഉൾക്കൊള്ളുന്നു; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: περίεργοι
  choice: മറ്റുള്ളവരുടെ കാര്യങ്ങളിൽ അനാവശ്യമായി ഇടപെടുന്നവർ
  rationale: തങ്ങളുമായി ബന്ധമില്ലാത്ത കാര്യങ്ങളിൽ അനുചിതമായി ഇടപെടുക എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: λαλοῦσαι
  choice: പറയുന്നു
  rationale: തുടർന്നുവരുന്ന വസ്തുവാക്യത്തോട് സ്വാഭാവികമായി ചേരുന്ന ലളിതമായ സംസാരക്രിയയാണ്.
- source_word: τὰ μὴ δέοντα
  choice: പറയാൻ പാടില്ലാത്തത്
  rationale: ഉചിതമല്ലാത്തതോ പറയേണ്ടതല്ലാത്തതോ ആയ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; λαλοῦσαι മൂലം ഇത് സംസാരവുമായി ബന്ധപ്പെട്ടതാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീലിംഗ ബഹുവചന രൂപങ്ങളുടെ സൂചിതർ
  choice: അവർ
  alternative: ഈ സ്ത്രീകൾ / ഈ വിധവകൾ
  rationale: ഗ്രീക്ക് രൂപങ്ങൾ സന്ദർഭത്തിലെ പ്രായം കുറഞ്ഞ വിധവകളെയാണ് സൂചിപ്പിക്കുന്നത്. മുൻസന്ദർഭത്തിൽ സൂചിതർ വ്യക്തമായതിനാൽ മലയാളത്തിലെ ‘അവർ’ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു; അതേസമയം സ്ത്രീകളെന്ന സന്ദർഭാർഥം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ‘അലസർ’ എന്ന ആവർത്തനം നിലനിർത്തി. φλύαροι, περίεργοι എന്നീ പദങ്ങളുടെ അർഥവ്യാപ്തി പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പുകളിലും സമതുലിതമായി അവതരിപ്പിച്ചു.
