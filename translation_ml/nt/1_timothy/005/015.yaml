id: 1TI.5.15
reference: 1 Timothy 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: ml
  text: കാരണം, ചിലർ ഇതിനകം വഴിതെറ്റി സാത്താനെ അനുഗമിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: സംഭവം ഇപ്പോഴേക്കും നടന്നുകഴിഞ്ഞുവെന്ന കാലസൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: (പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല)
  rationale: മുൻവാക്യത്തിനുള്ള വിശദീകരണമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകമാണ്. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ ‘എന്തെന്നാൽ’ എന്നു ചേർക്കുന്നത് മലയാളത്തിൽ അസ്വാഭാവികമാകാം; വാക്യക്രമവും സന്ദർഭവും അതിന്റെ വിശദീകരണസ്വഭാവം വഹിക്കുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: വ്യക്തമായി നിർണ്ണയിക്കാത്ത ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: ἐξετράπησαν
  choice: വഴിതെറ്റി
  rationale: ശരിയായ പാതയിൽനിന്നു മാറിപ്പോയെന്ന മൂലരൂപകം നിലനിർത്തുന്നു; മറ്റൊരാൾ അവരെ വഴിതെറ്റിച്ചു എന്ന കാരണാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ὀπίσω
  choice: അനുഗമിച്ചിരിക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘പിന്നാലെ’ എന്ന ദിശാസൂചന ഇവിടെ ഒരാളെ പിന്തുടരുക/അനുഗമിക്കുക എന്ന രൂപകാലങ്കാരപരമായ അർഥത്തിലാണ്; മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: Σατανᾶ
  choice: സാത്താനെ
  rationale: പുതിയനിയമത്തിലെ വ്യക്തിനാമം/സ്ഥാനനാമം മലയാളത്തിലെ സ്ഥാപിതമായ ലിപ്യന്തരണത്തിൽ നൽകുന്നു; വിഭക്തി വാക്യഘടനയ്ക്കനുസരിച്ച് ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶ എന്നത് അക്ഷരാർഥത്തിൽ ‘സാത്താന്റെ പിന്നാലെ’ എന്നോ അർഥവ്യക്തതയോടെ ‘സാത്താനെ അനുഗമിക്കുക’ എന്നോ നൽകണോ എന്നത്.
  choice: സാത്താനെ അനുഗമിച്ചിരിക്കുന്നു
  alternative: സാത്താന്റെ പിന്നാലെ വഴിതെറ്റിപ്പോയിരിക്കുന്നു
  rationale: ‘പിന്നിൽ/പിന്നാലെ’ എന്ന മൂലദിശാരൂപകം ഒരാളുടെ പാത പിന്തുടരുന്നതിനെയോ അയാളോടു ചേർന്നുനിൽക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു. ‘അനുഗമിക്കുക’ ആ അർഥം ഇന്നത്തെ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അതേസമയം സാത്താനിക നിയന്ത്രണം പോലുള്ള അധിക ആശയം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ചുരുക്കവും ഗൗരവമുള്ളതുമായ വാക്യം. ‘വഴിതെറ്റി’ മൂലത്തിലെ പാതയിൽനിന്നുള്ള വ്യതിചലനരൂപകം സൂക്ഷിക്കുന്നു; ‘അനുഗമിച്ചിരിക്കുന്നു’ കഴിഞ്ഞ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
