  source_fidelity: The draft correctly renders the generic reference to people, the personification of sins, the directional movement toward judgment, and the unresolved scope of κρίσις. However, “വ്യക്തമായി കാണാം” means ‘can be seen clearly’ and weakens/shifts the predicative assertion πρόδηλοί εἰσιν (‘are evident/obvious’).
