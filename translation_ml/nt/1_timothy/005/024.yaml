  terminology: “പാപങ്ങൾ,” “ന്യായവിധി,” and “പിന്നാലെ വരുന്നു” are suitable. “ന്യായവിധി” appropriately preserves the source ambiguity between immediate assessment and broader judgment. The revised footnote a is aligned with the revised main rendering.
  issues:
