id: 1TI.5.24
reference: 1 Timothy 5:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: ml
  text: ചിലരുടെ പാപങ്ങൾ വ്യക്തമാണ്[a], അവ അവർക്കു മുമ്പായി ന്യായവിധിയിലേക്കു പോകുന്നു[b]; എന്നാൽ മറ്റുചിലരുടെ പാപങ്ങൾ പിന്നാലെ വരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തെളിവായി കാണപ്പെടുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ “ന്യായവിധി” ഇപ്പോഴത്തെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കാം; എങ്കിലും ഈ പ്രയോഗത്തിന് ദൈവിക ന്യായവിധി എന്ന വിശാലമായ അർഥവും ഉണ്ടാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: ചിലരുടെ പാപങ്ങൾ
  rationale: ജനങ്ങളെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥതാരൂപത്തിൽ നൽകി; സന്ദർഭം ആവശ്യപ്പെടാത്ത ലിംഗസൂചന ഒഴിവാക്കി.
- source_word: πρόδηλοί
  choice: വ്യക്തമായി കാണാം
  rationale: പാപങ്ങൾ പരസ്യമായോ എളുപ്പം തിരിച്ചറിയാവുന്നവയായോ ഇരിക്കുന്നു എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προάγουσαι εἰς κρίσιν
  choice: അവ അവർക്കു മുമ്പായി ന്യായവിധിയിലേക്കു പോകുന്നു
  rationale: പാപങ്ങൾ ബന്ധപ്പെട്ട വ്യക്തികൾക്കു മുമ്പേ പോകുന്നു എന്ന മനുഷ്യവൽക്കൃത ദൃശ്യവും εἰς എന്നതിന്റെ ദിശാസൂചനയും നിലനിർത്തുന്നു. 'അവർക്കു' എന്നത് സന്ദർഭത്തിൽനിന്ന് വ്യക്തതയ്ക്കായി ചേർത്തതാണ്.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: എന്നാൽ മറ്റുചിലരുടെ പാപങ്ങൾ പിന്നാലെ വരുന്നു
  rationale: ആദ്യ വിഭാഗത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും പാപങ്ങൾ പിന്നാലെ വരുന്നു എന്ന ഗ്രീക്ക് ദൃശ്യഭാഷ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κρίσις എന്നതിന്റെ വ്യാപ്തി
  choice: ന്യായവിധി
  alternative: ഇപ്പോഴത്തെ പരിശോധന അല്ലെങ്കിൽ അന്തിമ ദൈവിക ന്യായവിധി എന്നു പ്രത്യേകം നിർവചിക്കുക
  rationale: സമീപസന്ദർഭം സഭയിലെ വ്യക്തികളുടെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കാമെങ്കിലും പദപ്രയോഗത്തിന് വിശാലമായ ദൈവിക ന്യായവിധിയുടെയും അർഥസാധ്യതയുണ്ട്. അതിനാൽ അവ്യക്തത പരിഭാഷയിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ പാപങ്ങളുടെ മനുഷ്യവൽക്കരണം നിലനിർത്തിയിരിക്കുന്നു; വാക്യത്തിന്റെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം തീർപ്പാക്കിയിട്ടില്ല.
