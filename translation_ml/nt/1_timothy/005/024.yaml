    issue: “വ്യക്തമായി കാണാം” does not directly render πρόδηλοί εἰσιν.
    rationale: The Greek states that the sins are evident/obvious, whereas the Malayalam wording expresses that they can be clearly seen. “വ്യക്തമാണ്” preserves the assertion and the lexical sense more closely.
