  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: ml
  text: ആരുടെയും മേൽ തിടുക്കത്തിൽ കൈകൾ വെക്കരുത്[a]; മറ്റുള്ളവരുടെ പാപങ്ങളിൽ പങ്കാളിയാകരുത്. നിന്നെത്തന്നെ നിർമലനായി സൂക്ഷിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ വ്യക്തമായി: “ആരെയും തിടുക്കത്തിൽ നിയമിക്കരുത്/ശുശ്രൂഷയ്ക്കായി നിയോഗിക്കരുത്.” ഗ്രീക്കിൽ അക്ഷരാർഥമായി “കൈകൾ വെക്കുക” എന്നാണ്; ശുശ്രൂഷയ്ക്കായി ഒരാളെ നിയോഗിക്കുകയോ അംഗീകരിക്കുകയോ ചെയ്യുന്നതുമായി ഈ പ്രയോഗം പലപ്പോഴും ബന്ധപ്പെട്ടിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: കൈകൾ വെക്കുക
  rationale: ഗ്രീക്കിലെ ‘കൈകൾ വെക്കുക’ എന്ന പ്രയോഗം അതേപടി നിലനിർത്തുന്നു. ഈ ഇടയലേഖനസന്ദർഭത്തിൽ ശുശ്രൂഷയ്ക്കായുള്ള നിയമനം, അംഗീകാരം, അല്ലെങ്കിൽ നിയോഗം ഇതിലൂടെ സൂചിപ്പിക്കപ്പെടാം; എന്നാൽ മുഖ്യവാചകത്തിൽ അർഥം അത്രയ്ക്ക് ചുരുക്കുന്നില്ല.
- source_word: ταχέως
  choice: തിടുക്കത്തിൽ
  rationale: വെറും വേഗമല്ല, വേണ്ടത്ര പരിഗണനയില്ലാത്ത അകാലനടപടിയാണ് ഇവിടെ വിലക്കുന്നത്. ‘തിടുക്കത്തിൽ’ എന്നത് ഈ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μηδενὶ
  choice: ആരുടെയുംമേൽ ... അരുത്
  rationale: നിഷേധാത്മക കല്പനയോടൊപ്പം സാർവത്രിക വ്യാപ്തി വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μηδὲ κοινώνει
  choice: പങ്കാളിയാകുകയും അരുത്
  rationale: κοινωνέω ഇവിടെ മറ്റുള്ളവരുടെ പ്രവൃത്തികളിലോ കുറ്റത്തിലോ പങ്കുചേരുക, അതിൽ ഉൾപ്പെടുക എന്ന അർഥം നൽകുന്നു. ‘പങ്കാളിയാകുക’ സഹകുറ്റത്തിന്റെ സാധ്യത നിലനിർത്തുന്നു.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: മറ്റുള്ളവരുടെ പാപങ്ങളിൽ
  rationale: ἀλλοτρίαις എന്നതിലെ ‘മറ്റൊരാളുടേത്’ എന്ന ആശയം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: σεαυτὸν
  choice: നിന്നെത്തന്നെ
  rationale: ഏകവചന ദ്വിതീയപുരുഷ ആത്മവാചക സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἁγνὸν
  choice: നിർമലനായി
  rationale: ഇവിടെ വിശാലമായ ധാർമികശുദ്ധിയാണ് ഉദ്ദേശിക്കുന്നത്. ‘നിർമലൻ’ ലൈംഗികശുദ്ധിയിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: τήρει
  choice: സൂക്ഷിക്കുക
  rationale: തുടർച്ചയായി കാത്തുസൂക്ഷിക്കുക എന്ന കല്പനാഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘കൈകൾ വെക്കുക’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘കൈകൾ വെക്കുക’ എന്ന പ്രയോഗം നിലനിർത്തി, നിയമനം/ശുശ്രൂഷാനിയോഗം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘ആരെയും തിടുക്കത്തിൽ നിയമിക്കരുത്’ അല്ലെങ്കിൽ ‘ആരെയും തിടുക്കത്തിൽ അഭിഷേകം ചെയ്യരുത്.’
  rationale: മൂപ്പന്മാരെക്കുറിച്ചുള്ള സമീപസന്ദർഭം ശുശ്രൂഷാനിയോഗമോ ഔദ്യോഗിക അംഗീകാരമോ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം നിയമനത്തിനുള്ള വ്യക്തമായ ക്രിയയ്ക്കുപകരം വിശാലമായ സഭാപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വിഭാഗീയമായ നടപടിക്രമം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: രണ്ട് വിലക്കുകൾ തമ്മിലുള്ള ബന്ധം
  choice: മറ്റുള്ളവരുടെ പാപങ്ങളിൽ പങ്കാളിയാകരുതെന്ന പൊതുവായ ഭാഷ നിലനിർത്തുന്നു; തിടുക്കത്തിലുള്ള അംഗീകാരവുമായി അതിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ബന്ധിപ്പിക്കുന്നില്ല.
  alternative: തിടുക്കത്തിൽ ഒരാളെ നിയമിക്കുന്നതിലൂടെ അയാളുടെ പാപങ്ങളുടെ കുറ്റത്തിൽ പങ്കാളിയാകരുത് എന്ന പ്രത്യേക അർഥം തുറന്നുപറയുക.
  rationale: വാക്യങ്ങളുടെ ചേർച്ച അത്തരമൊരു സഹകുറ്റബന്ധം സൂചിപ്പിച്ചേക്കാം; എന്നാൽ ഗ്രീക്ക് ആ ബന്ധം വിശദീകരിക്കുന്നില്ല. അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനതുറവ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. ‘കൈകൾ വെക്കുക’ എന്ന സഭാപ്രയോഗം മൂലത്തിലെ തുറവ് സംരക്ഷിക്കുന്നു; ‘അഭിഷേകം’ പോലുള്ള കൂടുതൽ വിഭാഗീയമോ സാങ്കേതികമോ ആയ പദം ഒഴിവാക്കി. ഏകവചന അഭിസംബോധന വ്യക്തമാക്കാൻ ‘നിന്നെത്തന്നെ’ ഉപയോഗിച്ചു.
