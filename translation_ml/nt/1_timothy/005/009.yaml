id: 1TI.5.9
reference: 1 Timothy 5:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: ml
  text: അറുപത് വയസ്സോ അതിലധികമോ പ്രായമുള്ളതും ഒരു ഭർത്താവിന്റെ ഭാര്യയായിരുന്നതുമായ ഒരു വിധവയെ മാത്രമേ പട്ടികയിൽ ചേർക്കാവൂ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പദാനുസൃത അർഥം: ‘ഒരു പുരുഷന്റെ സ്ത്രീ.’ ഈ പ്രയോഗം ദാമ്പത്യവിശ്വസ്തതയെയോ നല്ല പേരിനെയോ സൂചിപ്പിക്കാം; എന്നാൽ ‘ഒരിക്കൽ മാത്രം വിവാഹിതയായവൾ’ എന്നാണ് ചിലർ മനസ്സിലാക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: വിധവ
  rationale: ഭർത്താവ് മരിച്ച സ്ത്രീ എന്ന സാധാരണ അർഥം; സന്ദർഭത്തിൽ ഔദ്യോഗികമായി പട്ടികയിൽ ചേർക്കപ്പെടേണ്ട വിധവയെ സൂചിപ്പിക്കുന്നു.
- source_word: καταλεγέσθω
  choice: പട്ടികയിൽ ചേർക്കണമെങ്കിൽ
  rationale: ഔദ്യോഗിക പട്ടികയിൽ പേര് രേഖപ്പെടുത്തുക എന്ന ഭരണപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ‘പരിഗണിക്കുക’ എന്ന അർഥമല്ല.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: അവൾക്ക് അറുപത് വയസ്സിൽ കുറയാതിരിക്കുകയും
  rationale: അറുപത് വയസ്സ് എന്ന കുറഞ്ഞ പ്രായപരിധി വ്യക്തമാക്കുകയും γεγονυῖα സൂചിപ്പിക്കുന്ന പ്രായം തികഞ്ഞ അവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: ഒരേ ഭർത്താവിന്റെ ഭാര്യയായിരുന്നിരിക്കുകയും
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും അതിലുള്ള വ്യാഖ്യാനസാധ്യതകളും പരമാവധി നിലനിർത്തുന്നു; ദാമ്പത്യവിശ്വസ്തതയോ ഒരിക്കൽ മാത്രം വിവാഹിതയായിരുന്നതോ എന്ന് മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ἑνὸς ἀνδρὸς γυνή എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘ഒരേ ഭർത്താവിന്റെ ഭാര്യയായിരുന്നിരിക്കുകയും’ എന്ന താരതമ്യേന പദാനുസൃതമായ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘ഭർത്താവിനോട് വിശ്വസ്തയായിരുന്നവൾ’ അല്ലെങ്കിൽ ‘ഒരിക്കൽ മാത്രം വിവാഹിതയായവൾ’
  rationale: ഗ്രീക്ക് വാചകം ദാമ്പത്യവിശ്വസ്തതയെയാണോ വിവാഹങ്ങളുടെ എണ്ണത്തെയാണോ പ്രധാനമായി സൂചിപ്പിക്കുന്നത് എന്ന് നിർവിവാദമായി വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിഗമനം അടിച്ചേൽപ്പിക്കാതെ വ്യാഖ്യാനപരമായ പിരിമുറുക്കം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പട്ടികയിൽ ചേർക്കുക’ ഔദ്യോഗിക രജിസ്ട്രേഷൻ എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. വിവാദമായ ദാമ്പത്യപ്രയോഗം മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിലൂടെ പ്രധാന വ്യാഖ്യാനങ്ങൾ നൽകുന്നു.
