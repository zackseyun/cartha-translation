revisions:
- from: ഒരു വിധവയെ പട്ടികയിൽ ചേർക്കണമെങ്കിൽ, അവൾക്ക് അറുപത് വയസ്സിൽ കുറയാതിരിക്കുകയും ഒരേ ഭർത്താവിന്റെ ഭാര്യയായിരുന്നിരിക്കുകയും വേണം.[a]
  to: അറുപത് വയസ്സോ അതിലധികമോ പ്രായമുള്ളതും ഒരു ഭർത്താവിന്റെ ഭാര്യയായിരുന്നതുമായ ഒരു വിധവയെ മാത്രമേ പട്ടികയിൽ ചേർക്കാവൂ.[a]
  rationale: The revision uses a natural restrictive construction for the Greek imperative and minimum-age requirement. It replaces “ഒരേ ഭർത്താവിന്റെ” with “ഒരു ഭർത്താവിന്റെ,” avoiding an unintended comparative nuance while retaining the formal and deliberately unresolved marital idiom. The footnote is revised for idiomatic Malayalam and preserves the interpretive ambiguity.
