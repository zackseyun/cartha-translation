id: 1TI.5.6
reference: 1 Timothy 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: ml
  text: എന്നാൽ സുഖഭോഗജീവിതം നയിക്കുന്നവൾ ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ മരിച്ചവളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സുഖഭോഗജീവിതം നയിക്കുന്നവൾ’ എന്നതിന് ‘സ്വയംസുഖത്തിൽ മുഴുകി ജീവിക്കുന്നവൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: സുഖഭോഗങ്ങളിൽ മുഴുകി ജീവിക്കുന്നവൾ
  rationale: വെറും ആനന്ദാനുഭവമല്ല, സുഖഭോഗകേന്ദ്രിതവും സ്വയംതൃപ്തിക്കായുള്ളതുമായ തുടർച്ചയായ ജീവിതരീതിയാണ് വർത്തമാനകാല കൃദന്തം സൂചിപ്പിക്കുന്നത്. ഈ പ്രയോഗം ആ ജീവിതശൈലിയുടെ തുടർച്ചയും നിഷേധാത്മക ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ζῶσα
  choice: ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ
  rationale: തുടർന്നുവരുന്ന പൂർണ്ണകാല ക്രിയയോടുള്ള കാലപരവും വിരോധാഭാസപരവുമായ ബന്ധം വ്യക്തമാക്കുന്നു; ശാരീരികമായി ജീവിച്ചിരിക്കെ മറ്റൊരു അർഥത്തിൽ മരിച്ചിരിക്കുന്നുവെന്ന വിരോധാഭാസം ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: τέθνηκεν
  choice: മരിച്ചവളാണ്
  rationale: θνῄσκω എന്ന ക്രിയയുടെ പൂർണ്ണകാലരൂപം മരണം സംഭവിച്ചതിന്റെ ഫലമായ ഇപ്പോഴത്തെ അവസ്ഥയെ ഊന്നുന്നു. മലയാളത്തിൽ ‘മരിച്ചവളാണ്’ ആ നിലയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἡ ... σπαταλῶσα
  choice: സുഖഭോഗങ്ങളിൽ മുഴുകി ജീവിക്കുന്നവൾ
  rationale: സ്ത്രീലിംഗ ഏകവചന ആർട്ടിക്കിളും കൃദന്തവും ചേർന്ന് വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. സമീപസന്ദർഭം വിധവകളെക്കുറിച്ചായതിനാൽ സ്ത്രീലിംഗം നിലനിർത്തുന്നു; എന്നാൽ മൂലപാഠത്തേക്കാൾ അധികമായി ‘വിധവ’ എന്ന് ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ദൈവത്തിൽ പ്രത്യാശവെച്ച് പ്രാർഥനയിൽ തുടരുന്ന യഥാർഥ വിധവയെക്കുറിച്ചുള്ള മുൻവിവരണത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ജീവിച്ചിരിക്കെ ‘മരിച്ചവൾ’ എന്നതിന്റെ സ്വഭാവം
  choice: ശാരീരികമല്ലാത്ത മരണത്തെ സൂചിപ്പിക്കുന്ന രൂപകം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുക
  alternative: ‘ആത്മീയമായി മരിച്ചവൾ’ അല്ലെങ്കിൽ ‘ധാർമികമായി മരിച്ചവൾ’ എന്ന് വ്യക്തമാക്കുക
  rationale: ‘ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ മരിച്ചവൾ’ എന്ന വിരോധാഭാസം ശാരീരിക മരണത്തെയല്ല സൂചിപ്പിക്കുന്നത്. എന്നാൽ അത് ആത്മീയമോ ധാർമികമോ സാമൂഹികമോ എന്ന് പരിഭാഷയിൽ നിർണയിച്ചുപറയാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന അർഥപരിധിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യമായ മലയാളം. ‘സുഖഭോഗം’ σπαταλάω എന്ന പദത്തിലെ സ്വയംതൃപ്തിയും ആഡംബരസുഖകേന്ദ്രിതത്വവും നൽകുന്നു; ‘മുഴുകി ജീവിക്കുക’ വർത്തമാനകാല കൃദന്തത്തിന്റെ തുടർച്ചയായ ജീവിതരീതി സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
