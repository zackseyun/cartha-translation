id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: ml
  text: എന്നാൽ, ഒരു സ്ത്രീ ഉപദേശിക്കാനോ ഒരു പുരുഷന്റെമേൽ അധികാരം പ്രയോഗിക്കാനോ ഞാൻ അനുവദിക്കുന്നില്ല[a][b]; പകരം, അവൾ ശാന്തതയോടെ ആയിരിക്കണം[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരു ഭാര്യ ... ഭർത്താവിന്റെമേൽ.’ ഗ്രീക്ക് പദങ്ങൾക്ക് പൊതുവായ ‘സ്ത്രീ/പുരുഷൻ’ എന്ന അർഥമോ ദാമ്പത്യപരമായ ‘ഭാര്യ/ഭർത്താവ്’ എന്ന അർഥമോ വരാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘അധികാരം വഹിക്കാനോ’; ഒരുപക്ഷേ, ‘ആധിപത്യം പുലർത്താനോ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ അപൂർവമാണ്; അതിന്റെ കൃത്യമായ അർഥനിഴൽ തർക്കവിധേയമാണ്.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘മൗനമായി.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭാനുസരണം ശാന്തത, സമാധാനം, അല്ലെങ്കിൽ മൗനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: ഉപദേശിക്കാൻ
  rationale: ἐπιτρέπω എന്ന ക്രിയയുടെ പൂരകമായ അനന്തക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും സഭാസന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽനിന്നുള്ള മൃദുവായ വൈരുധ്യപരമായ തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: γυναικί
  choice: ഒരു സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. 2:9–15-ലെ വിശാല സന്ദർഭം കണക്കിലെടുത്ത് പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ദാമ്പത്യാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: οὐκ ἐπιτρέπω
  choice: ഞാൻ അനുവദിക്കുന്നില്ല
  rationale: വർത്തമാനകാലത്തെ പൊതുവായ പ്രസ്താവനയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: οὐδὲ
  choice: -ാനോ ... -ാനോ
  rationale: രണ്ട് അനന്തക്രിയകളെയും ഒരേ നിഷേധത്തിന്റെ കീഴിൽ സ്വാഭാവിക മലയാള സമാന്തരഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: αὐθεντεῖν
  choice: അധികാരം പ്രയോഗിക്കാൻ
  rationale: അപൂർവവും അർഥനിഴൽ വിവാദവിധേയവുമായ ക്രിയയ്ക്ക് നിഷ്പക്ഷമായ അധികാരാർഥം നൽകുന്നു; ‘ആധിപത്യം പുലർത്തുക’ എന്ന പ്രതികൂല നിഴൽ നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: ἀνδρός
  choice: ഒരു പുരുഷന്റെമേൽ
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം. പൊതുവായ അർഥം മുഖ്യപാഠത്തിലും ദാമ്പത്യാർഥം അടിക്കുറിപ്പിലും നൽകി.
- source_word: ἀλλ’
  choice: പകരം
  rationale: നിഷേധത്തിനു പിന്നാലെയുള്ള അനുകൂല പ്രതീക്ഷയെ വ്യക്തമായി വൈരുധ്യപ്പെടുത്തുന്നു.
- source_word: εἶναι
  choice: അവൾ ... ഇരിക്കണം
  rationale: ഗ്രീക്കിലെ അനന്തക്രിയാഘടനയെ അർഥം വ്യക്തമാകുന്ന സ്വാഭാവിക മലയാള വിധിവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ἡσυχίᾳ
  choice: ശാന്തതയോടെ
  rationale: ἡσυχία എന്നത് സന്ദർഭാനുസരണം ശാന്തത, അടക്കം, അല്ലെങ്കിൽ മൗനം സൂചിപ്പിക്കാം. സമ്പൂർണ സംസാരനിരോധനം നിർബന്ധമായി സൂചിപ്പിക്കാതെ പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐθεντεῖν എന്ന അപൂർവക്രിയയുടെ അർഥം
  choice: അധികാരം പ്രയോഗിക്കാൻ
  alternative: അധികാരം വഹിക്കാൻ; ആധിപത്യം പുലർത്താൻ
  rationale: മുഖ്യപാഠത്തിൽ നിഷ്പക്ഷമായ അധികാരാർഥം സ്വീകരിച്ചു. ക്രിയ തന്നെ നിർബന്ധമാക്കാത്ത ദുർവിനിയോഗാർഥം ചേർക്കാതെ, തർക്കവിധേയമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: γυνή / ἀνήρ എന്ന പദജോടിയുടെ പൊതുവായ അർഥമോ ദാമ്പത്യാർഥമോ
  choice: ഒരു സ്ത്രീ ... ഒരു പുരുഷൻ
  alternative: ഒരു ഭാര്യ ... ഭർത്താവ്
  rationale: രണ്ടു പദങ്ങൾക്കും പൊതുവായതും ദാമ്പത്യപരവുമായ അർഥങ്ങൾ സാധ്യമാണ്. ചുറ്റുപാടിലെ വിശാലമായ പരാമർശം കാരണം പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ ദ്വയാർഥത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- issue: ἡσυχία സമ്പൂർണ മൗനമാണോ ശാന്തമായ നിലയാണോ
  choice: ശാന്തതയോടെ
  alternative: മൗനമായി
  rationale: ഇവിടെ പദം സമ്പൂർണ മൗനം നിർബന്ധമായി ആവശ്യപ്പെടുന്നില്ല; 2:11-നോടുള്ള പദസാദൃശ്യവും ശാന്തമായ, അടക്കമുള്ള നില എന്ന അർഥവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉപദേശിക്കുക’, ‘അധികാരം പ്രയോഗിക്കുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിന്റെ ഔപചാരിക ഭാവം നിലനിർത്തുന്നതുമാണ്. യഥാർഥമായ ലെക്സിക്കൽ-വ്യാഖ്യാന ദ്വയാർഥതകൾ മുഖ്യപാഠത്തിൽ പരിഹരിച്ചുകളയാതെ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
