id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: ml
  text: അതുപോലെതന്നെ, സ്ത്രീകളും മാന്യമായ വസ്ത്രധാരണത്തിൽ[a], മര്യാദാബോധത്തോടും ആത്മനിയന്ത്രണത്തോടുംകൂടെ തങ്ങളെത്തന്നെ അലങ്കരിക്കണം; പിന്നിയ മുടിയാലോ സ്വർണംകൊണ്ടോ മുത്തുകൾകൊണ്ടോ വിലയേറിയ വസ്ത്രംകൊണ്ടോ അല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മാന്യമായ വസ്ത്രധാരണത്തിൽ’ എന്നതിന് ‘ഉചിതമായ വേഷത്തിൽ’ അല്ലെങ്കിൽ ‘മര്യാദയുള്ള വസ്ത്രധാരണത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പിന്നിയ മുടി, സ്വർണം, മുത്തുകൾ, വിലയേറിയ വസ്ത്രം’ എന്ന പട്ടിക എല്ലാ സാഹചര്യങ്ങളിലും മുടി പിന്നുന്നതോ ആഭരണം ധരിക്കുന്നതോ നിരോധിക്കുന്നതിനെക്കാൾ, പ്രദർശനപരവും ആഡംബരപൂർണവുമായ അലങ്കാരത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: അതുപോലെതന്നെ സ്ത്രീകളും
  rationale: മുൻപത്തെ പ്രബോധനത്തോടുള്ള ബന്ധവും καί നൽകുന്ന കൂട്ടിച്ചേർക്കൽഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γυναῖκας
  choice: സ്ത്രീകൾ
  rationale: വിവാഹത്തെ സൂചിപ്പിക്കുന്ന പ്രത്യേക അടയാളങ്ങളില്ലാത്ത പൊതുവായ പ്രബോധനസന്ദർഭത്തിൽ ‘ഭാര്യമാർ’ എന്നതിനെക്കാൾ ‘സ്ത്രീകൾ’ യോജിക്കുന്നു.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: മാന്യമായ വസ്ത്രധാരണത്തോടെ
  rationale: καταστολή വേഷത്തെയും വസ്ത്രധാരണത്തെയും, κόσμιος ഔചിത്യവും മാന്യതയും ക്രമവും സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം രണ്ടിന്റെയും ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: μετὰ αἰδοῦς
  choice: മര്യാദാബോധത്തോടും
  rationale: αἰδώς അനുചിതമായ പ്രകടനത്തിൽനിന്ന് ഒരാളെ പിന്തിരിപ്പിക്കുന്ന ഔചിത്യബോധവും മാന്യമായ സംയമനവും സൂചിപ്പിക്കുന്നു; ‘മര്യാദാബോധം’ അനാവശ്യമായി ‘ലജ്ജ’ എന്ന വികാരം മുൻനിർത്താതെ ആ ആശയം നൽകുന്നു.
- source_word: σωφροσύνης
  choice: ആത്മനിയന്ത്രണത്തോടും
  rationale: വിവേകപൂർവമായ സംയമനവും സ്വയം നിയന്ത്രിക്കലും ഉൾപ്പെടുന്ന പദത്തിന്റെ പ്രായോഗിക അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: κοσμεῖν ἑαυτάς
  choice: തങ്ങളെത്തന്നെ അലങ്കരിക്കണം
  rationale: κοσμέω എന്ന ക്രിയയുടെ ‘അലങ്കരിക്കുക/ക്രമപ്പെടുത്തുക’ എന്ന അർഥവും തുടർന്നുള്ള ബാഹ്യ അലങ്കാരങ്ങളുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ പ്രബോധനബലം ‘അലങ്കരിക്കണം’ വ്യക്തമാക്കുന്നു.
- source_word: μὴ ἐν πλέγμασιν
  choice: പിന്നിയ മുടികൊണ്ടോ ... അല്ല
  rationale: πλέγματα പിന്നിയ മുടിയലങ്കാരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. അലങ്കാരത്തിന്റെ മാർഗം സൂചിപ്പിക്കുന്ന ἐν എന്നതിന്റെ ഭാവം ‘കൊണ്ട്’ വഴി നിലനിർത്തുന്നു.
- source_word: χρυσίῳ
  choice: സ്വർണം
  rationale: ഗ്രീക്ക് പദം ആഭരണത്തിന്റെ പ്രത്യേക രൂപം നിർണ്ണയിക്കാതെ സ്വർണം എന്നു മാത്രമാണ് പറയുന്നത്; പരിഭാഷയും അതേ വിശാലത നിലനിർത്തുന്നു.
- source_word: μαργαρίταις
  choice: മുത്തുകൾ
  rationale: പദത്തിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ അർഥം.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: വിലയേറിയ വസ്ത്രം
  rationale: ἱματισμός വസ്ത്രത്തെയും πολυτελής വലിയ വിലയുള്ളതോ ആഡംബരമുള്ളതോ ആയതിനെയും സൂചിപ്പിക്കുന്നു; ‘വിലയേറിയ വസ്ത്രം’ ലളിതവും സമകാലികവുമാണ്.
theological_decisions:
- issue: വാക്യം പൊതുവെ സ്ത്രീകളെയാണോ പ്രത്യേകിച്ച് ഭാര്യമാരെയാണോ അഭിസംബോധന ചെയ്യുന്നത്
  choice: സ്ത്രീകൾ എന്ന പൊതുവായ വായന
  alternative: ഭാര്യമാർ
  rationale: γυναῖκας എന്ന ബഹുവചനത്തെ വിവാഹിതരായ സ്ത്രീകളിൽ പരിമിതപ്പെടുത്തുന്ന സന്ദർഭസൂചന ഇവിടെ ഇല്ല. അതിനാൽ ഗ്രീക്ക് അനുവദിക്കുന്നതിലധികം അർഥം ചുരുക്കാതിരിക്കാൻ ‘സ്ത്രീകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- issue: പിന്നിയ മുടി, സ്വർണം, മുത്തുകൾ, വിലയേറിയ വസ്ത്രം എന്നിവയെക്കുറിച്ചുള്ള വിലക്ക് സമ്പൂർണമാണോ അതോ ആഡംബരപ്രകടനത്തെയാണോ ലക്ഷ്യമിടുന്നത്
  choice: പട്ടിക വാചകത്തിൽ നേരിട്ട് നിലനിർത്തുകയും, അതിന്റെ സാധ്യതയുള്ള ആഡംബരപ്രകടനസന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും ഇവ ഓരോന്നും ഉപയോഗിക്കുന്നത് സമ്പൂർണമായി നിരോധിക്കുന്നു എന്ന വായന
  rationale: വാക്യഘടന മാന്യവും സംയമിതവുമായ അലങ്കാരത്തെ പ്രദർശനപരമായ ബാഹ്യ അലങ്കാരത്തോട് താരതമ്യപ്പെടുത്തുന്നു. എന്നിരുന്നാലും മൂലവാക്യത്തിലെ പട്ടികയിൽ വ്യാഖ്യാനപരമായ വിശേഷണം ചേർക്കാതെ അതിനെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി; ചരിത്ര-സാമൂഹിക സൂചന അടിക്കുറിപ്പിൽ മാത്രം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ‘ലജ്ജാശീലം’ എന്ന പദം ഇന്നത്തെ വായനയിൽ അനാവശ്യമായി അപമാനമോ കുറ്റബോധമോ സൂചിപ്പിക്കാവുന്നതിനാൽ αἰδώς എന്നതിനു ‘മര്യാദാബോധം’ തിരഞ്ഞെടുത്തു. വാക്യത്തിന്റെ ദീർഘമായ ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി അർധവിരാമം ഉപയോഗിച്ചെങ്കിലും ആശയക്രമം നിലനിർത്തി.
