- from: അതുപോലെതന്നെ സ്ത്രീകളും മാന്യമായ വസ്ത്രധാരണത്തോടെ[a], മര്യാദാബോധത്തോടും ആത്മനിയന്ത്രണത്തോടുംകൂടെ തങ്ങളെത്തന്നെ അലങ്കരിക്കണം; പിന്നിയ മുടികൊണ്ടോ സ്വർണംകൊണ്ടോ മുത്തുകൾകൊണ്ടോ വിലയേറിയ വസ്ത്രംകൊണ്ടോ അല്ല[b].
