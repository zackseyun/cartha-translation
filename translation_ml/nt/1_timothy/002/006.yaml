  to: എല്ലാവർക്കും വേണ്ടി മോചനവിലയായി തന്നെത്തന്നെ നൽകിയവൻ—തക്ക സമയങ്ങളിലെ സാക്ഷ്യം.[a][b]
  rationale: മുഖ്യപാഠത്തിൽ ചേർത്തിരുന്ന ‘നൽകപ്പെട്ട’ നീക്കി, മൂലപാഠത്തിലെ സംക്ഷിപ്തമായ appositional നാമവാക്യവും അതിലെ വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു. വായനാസൗകര്യത്തിനായി ‘എല്ലാവർക്കും വേണ്ടി’ എന്നു വേർതിരിച്ചെഴുതി. കുറിപ്പിൽ സാധ്യമായ ‘അറിയിക്കപ്പെട്ട’ അർഥം രേഖപ്പെടുത്തിയെങ്കിലും അതിനെ പരിഭാഷയുടെ ഉറപ്പായ വാചകമാക്കിയിട്ടില്ല.
