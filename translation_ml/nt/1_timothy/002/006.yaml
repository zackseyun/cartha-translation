    rationale: τὸ μαρτύριον καιροῖς ἰδίοις-ൽ ‘നൽകപ്പെട്ടു/വഹിക്കപ്പെട്ടു’ എന്ന ക്രിയ പ്രത്യക്ഷമല്ല. അത്തരം ക്രിയ ചേർക്കുന്നത് ഒരു സാധ്യമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുകയും ഗ്രീക്കിന്റെ സംക്ഷിപ്തവും ചർച്ചാവിഷയവുമായ ഘടനയെ അതിവ്യക്തമാക്കുകയും ചെയ്യുന്നു.
