id: 1TI.2.6
reference: 1 Timothy 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: ml
  text: എല്ലാവർക്കും വേണ്ടി മോചനവിലയായി തന്നെത്തന്നെ നൽകിയവൻ—തക്ക സമയങ്ങളിലെ സാക്ഷ്യം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാവർക്കും വേണ്ടി’ എന്നത് ‘എല്ലാവരുടെയും പക്ഷമായി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇത് ഓരോ വ്യക്തിയെയാണോ എല്ലാത്തരം ആളുകളെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന് ഗ്രീക്ക് വാക്യം ഇവിടെ പ്രത്യേകം നിർണ്ണയിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: 'അവസാനഭാഗം സംക്ഷിപ്തമായ ഗ്രീക്ക് നാമവാക്യമാണ്: ‘തക്ക സമയങ്ങളിലെ/തക്ക സമയങ്ങളിൽ ഉള്ള സാക്ഷ്യം.’ ക്രിസ്തുവിന്റെ സ്വയംസമർപ്പണമാണ് ദൈവം നിശ്ചയിച്ച സമയങ്ങളിൽ അറിയിക്കപ്പെട്ട സാക്ഷ്യം എന്ന അർഥവും സാധ്യമാണ്; എന്നാൽ ഗ്രീക്കിൽ അതിനുള്ള ക്രിയ പ്രത്യക്ഷമായി ഇല്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: നൽകിയവൻ
  rationale: മുൻവാക്യത്തിലെ ‘മനുഷ്യനായ ക്രിസ്തുയേശു’വിനെ വിശേഷിപ്പിക്കുന്ന ഭൂതകാല കൃദന്തരൂപം; മലയാളത്തിൽ ബന്ധവാക്യസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἑαυτὸν
  choice: തന്നെത്തന്നെ
  rationale: പ്രവൃത്തിയുടെ സ്വയംസമർപ്പണസ്വഭാവത്തിന് ഊന്നൽ നൽകുന്ന പ്രത്യയസർവനാമത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം.
- source_word: ἀντίλυτρον
  choice: മോചനവിലയായി
  rationale: വിടുതലിനായി നൽകുന്ന വില എന്ന മുഖ്യാർഥവും ἀντί- സൂചിപ്പിക്കുന്ന പകരസ്വഭാവവും അനാവശ്യമായി വികസിപ്പിക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: ὑπὲρ πάντων
  choice: എല്ലാവർക്കുംവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ ‘വേണ്ടി/പക്ഷമായി’ എന്ന അർഥവും πάντων എന്നതിന്റെ വിശാലവ്യാപ്തിയും നിലനിർത്തുന്നു; ‘എല്ലാവരും’ ആരെല്ലാമെന്ന പിൽക്കാല ദൈവശാസ്ത്രവിവാദം തീർപ്പാക്കുന്നില്ല.
- source_word: τὸ μαρτύριον
  choice: സാക്ഷ്യം
  rationale: മുൻപറഞ്ഞ ക്രിസ്തുവിന്റെ സ്വയംസമർപ്പണത്തെ സംക്ഷിപ്തമായി പുനർനിർദേശിക്കുന്ന നാമപ്രയോഗം; ‘സാക്ഷ്യം’ സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമാണ്.
- source_word: καιροῖς ἰδίοις
  choice: തക്ക സമയങ്ങളിൽ
  rationale: നിശ്ചിതമോ യോജിച്ചതോ ആയ കാലങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ബഹുവചനപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ക്രിസ്തുവിന്റെ മോചനവിലയോടു ബന്ധപ്പെട്ട πάντων എന്നതിന്റെ വ്യാപ്തി
  choice: എല്ലാവർക്കുംവേണ്ടി
  alternative: എല്ലാത്തരം ആളുകൾക്കുംവേണ്ടി; ഓരോ മനുഷ്യനുംവേണ്ടി
  rationale: മൂലപാഠത്തിന്റെ സർവവ്യാപകമായ ഭാഷ നിലനിർത്തുന്നു; അത് ഓരോ വ്യക്തിയെയാണോ എല്ലാ വിഭാഗങ്ങളെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന ദൈവശാസ്ത്രവിവാദം വിവർത്തനംകൊണ്ട് തീർപ്പാക്കുന്നില്ല.
- issue: ἀντίλυτρον എന്ന പദത്തിലെ പകരസ്വഭാവം
  choice: മോചനവില
  alternative: പകരമായി നൽകിയ മോചനവില
  rationale: പദത്തിന്റെ മോചനപരവും പകരപരവുമായ ഭാവം ‘മോചനവില’ ഉൾക്കൊള്ളുന്നു; ‘പകരമായി’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തെക്കാൾ വിശദീകരണാത്മകമാകാം.
- issue: τὸ μαρτύριον καιροῖς ἰδίοις എന്ന സംക്ഷിപ്ത ഘടനയുടെ ബന്ധം
  choice: മുൻപറഞ്ഞ സ്വയംസമർപ്പണത്തെ apposition ആയി ‘തക്ക സമയങ്ങളിൽ നൽകപ്പെട്ട സാക്ഷ്യം’ എന്നു ബന്ധിപ്പിച്ചു
  alternative: ‘തക്ക സമയങ്ങളിലെ സാക്ഷ്യം’; ‘തക്ക സമയങ്ങളിൽ വെളിപ്പെടുത്തപ്പെട്ട സാക്ഷ്യം’
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തതയും അർഥത്തിലെ അനിശ്ചിതത്വവും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യം നൽകുന്നു. ‘നൽകപ്പെട്ട’ എന്നത് സാക്ഷ്യം നൽകപ്പെടുന്നതിന്റെ സൂചന വ്യക്തമാക്കുന്നു; കർത്താവിനെ പ്രത്യേകം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മോചനവില’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ λύτρον-കുടുംബത്തിന്റെ അർഥം നൽകുന്നു. ഗ്രീക്കിലെ അവസാന നാമവാക്യത്തിന്റെ സംക്ഷിപ്തത പൂർണമായി അഴിച്ചെഴുതാതെ, ഡാഷും കുറിപ്പും ഉപയോഗിച്ച് ബന്ധം വ്യക്തമാക്കിയിരിക്കുന്നു.
