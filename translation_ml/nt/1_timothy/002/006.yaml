  source_fidelity: ‘നൽകപ്പെട്ട സാക്ഷ്യം’ എന്ന മുഖ്യപാഠം ഗ്രീക്കിലെ τὸ μαρτύριον καιροῖς ἰδίοις-ൽ പ്രത്യക്ഷമല്ലാത്ത ഒരു കർമണിപ്രയോഗം ചേർക്കുന്നു. ഈ സംക്ഷിപ്ത നാമവാക്യത്തിന്റെ കൃത്യമായ ബന്ധം വ്യാഖ്യാനപരമായി ചർച്ചചെയ്യപ്പെടുന്നതായതിനാൽ, മുഖ്യപാഠത്തിൽ അത് ചേർക്കാതെ നാമവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നതാണ് സുരക്ഷിതം. ὑπὲρ πάντων, ἀντίλυτρον, ἑαυτόν എന്നിവയുടെ നിലവിലെ പരിഭാഷകൾ അർഥവിശ്വസ്തമാണ്.
  naturalness: ‘എല്ലാവർക്കുംവേണ്ടി’ എന്നത് ആധുനിക മാനകമലയാളത്തിൽ വേർതിരിച്ച് ‘എല്ലാവർക്കും വേണ്ടി’ എന്നു എഴുതുന്നതാണ് സാധാരണം. അവസാന ഭാഗം ഗ്രീക്കിലും സംക്ഷിപ്തമാണെന്നതിനാൽ ‘തക്ക സമയങ്ങളിലെ സാക്ഷ്യം’ എന്ന നാമവാക്യം അല്പം സാന്ദ്രമാണെങ്കിലും വായിക്കാവുന്നതാണ്; കുറിപ്പ് അതിന്റെ സാധ്യതയുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
  terminology: ‘മോചനവില’, ‘തന്നെത്തന്നെ’, ‘സാക്ഷ്യം’ എന്നിവ യോജിച്ചും ദൈവശാസ്ത്രപരമായി അനാവശ്യമായി നിർണയിക്കാതെയും ഉപയോഗിച്ചിരിക്കുന്നു. ‘എല്ലാവർക്കും വേണ്ടി’ πάντων-ന്റെ വ്യാപ്തി പരിമിതപ്പെടുത്തുന്നില്ല.
