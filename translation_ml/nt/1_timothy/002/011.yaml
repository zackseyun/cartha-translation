id: 1TI.2.11
reference: 1 Timothy 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: ml
  text: ഒരു സ്ത്രീ[a] പൂർണവിധേയത്വത്തോടെ ശാന്തതയിൽ[b] പഠിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഭാര്യ’; γυνή എന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ ‘മൗനത്തിൽ’; ഗ്രീക്ക് പദത്തിന് പൂർണമായ സംസാരമില്ലായ്മ മാത്രമല്ല, ശാന്തതയോ കലഹരഹിതമായ നിലയോ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: ഒരു സ്ത്രീ
  rationale: γυνή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഇവിടെ വിവാഹബന്ധം വ്യക്തമായി സൂചിപ്പിക്കാത്തതിനാൽ പൊതുവായ ‘ഒരു സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν ἡσυχίᾳ
  choice: ശാന്തതയിൽ
  rationale: ἡσυχία പൂർണമായ മൗനം മാത്രമല്ല, ശാന്തവും കലഹരഹിതവുമായ നിലയെയും സൂചിപ്പിക്കാം. ‘ശാന്തതയിൽ’ എന്നത് ഈ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: μανθανέτω
  choice: പഠിക്കട്ടെ
  rationale: ഇത് വർത്തമാനകാലത്തിലെ മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപമാണ്. ‘പഠിക്കട്ടെ’ എന്നത് സ്ത്രീ പഠിക്കണമെന്ന സകാരാത്മക നിർദേശം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: പൂർണവിധേയത്വത്തോടെ
  rationale: πάσῃ എന്നതിന്റെ സമഗ്രതയും ὑποταγή എന്നതിന്റെ വിധേയത്വാർഥവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ പറയാത്ത വിധേയത്വത്തിന്റെ ലക്ഷ്യത്തെ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ἡσυχία എന്നത് പൂർണമായ മൗനമാണോ ശാന്തമായ നിലയാണോ
  choice: ശാന്തതയിൽ
  alternative: മൗനത്തിൽ
  rationale: ഈ പദത്തിന് ‘മൗനം’ എന്ന അർഥം സാധ്യമാണെങ്കിലും, ശാന്തവും കലഹരഹിതവുമായ പെരുമാറ്റം എന്ന വിശാലാർഥവും ഉണ്ട്. മുഖ്യപാഠം കല്പനയെ പൂർണമായ സംസാരനിരോധനമായി നിർവചിക്കാതെ ആ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: γυνή എന്നത് ‘സ്ത്രീ’യെയാണോ ‘ഭാര്യ’യെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: സ്ത്രീ
  alternative: ഭാര്യ
  rationale: ഉടൻചുറ്റുമുള്ള വാചകത്തിൽ വിവാഹബന്ധം വ്യാകരണപരമായി വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ ‘സ്ത്രീ’ എന്ന വിശാലമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുകയും ‘ഭാര്യ’ എന്ന സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ നിർദേശാത്മക സ്വരം ‘പഠിക്കട്ടെ’ എന്ന രൂപത്തിൽ നിലനിർത്തി. വിധേയത്വം ആരോടാണെന്ന് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷയും അത് നിർവചിക്കുന്നില്ല.
