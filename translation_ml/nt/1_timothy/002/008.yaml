id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: ml
  text: അതുകൊണ്ട്, എല്ലാ സ്ഥലത്തും പുരുഷന്മാർ കോപവും തർക്കവും[a] കൂടാതെ വിശുദ്ധമായ കൈകൾ ഉയർത്തി പ്രാർഥിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സംശയവും.” ഈ ഗ്രീക്ക് പദം ഉള്ളിലെ ആലോചനയെയോ സംശയത്തെയോ സൂചിപ്പിക്കാം; എന്നാൽ ഇവിടെ അത് സഭായോഗത്തിലെ കലഹപരമായ തർക്കത്തെയാകാം സൂചിപ്പിക്കുന്നത്.
    reason: διαλογισμοῦ എന്ന പദത്തിന്റെ പദാർഥപരമായി സാധ്യമായ മറ്റൊരു വായന സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: Βούλομαι
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: ഇച്ഛയെയോ മനസ്സുറപ്പിനെയോ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായിരിക്കെ പൗലോസിന്റെ നിർദേശാത്മക ഭാവവും നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളോടുള്ള നിഗമനപരമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: προσεύχεσθαι
  choice: പ്രാർഥിക്കണമെന്ന്
  rationale: βούλομαι എന്ന ക്രിയയെ ആശ്രയിക്കുന്ന infinitive-ന്റെ ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς ἄνδρας
  choice: പുരുഷന്മാർ
  rationale: സന്ദർഭത്തിൽ ἀνήρ പൊതുവായ ‘ആളുകൾ’ എന്നതിലുപരി ലിംഗനിർദിഷ്ടമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്നു; ‘ഭർത്താക്കന്മാർ’ എന്നു നിർബന്ധിക്കാൻ ആവശ്യമായ സന്ദർഭസൂചനകളില്ല.
- source_word: ἐν παντὶ τόπῳ
  choice: എല്ലാ സ്ഥലത്തും
  rationale: വിതരണാർഥം നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐπαίροντας
  choice: ഉയർത്തി
  rationale: പ്രാർഥനയോടൊപ്പമുള്ള ശാരീരിക ഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁσίους χεῖρας
  choice: വിശുദ്ധമായ കൈകൾ
  rationale: ദൈവത്തിനു സ്വീകാര്യമായ വിശുദ്ധതയെയും ഭക്തിപൂർവമായ ജീവിതത്തെയും സൂചിപ്പിക്കുന്ന ὅσιος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ശുദ്ധമായ’ എന്നു മാറ്റുന്നത് മറ്റൊരു ഗ്രീക്ക് പദത്തിന്റെ സൂക്ഷ്മാർഥം ഇറക്കുമതി ചെയ്യാം.
- source_word: χωρὶς
  choice: കൂടാതെ
  rationale: കോപവും തർക്കവും ഇല്ലാത്ത അവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὀργῆς
  choice: കോപം
  rationale: വ്യക്തിബന്ധപരമായ ഈ സന്ദർഭത്തിൽ വ്യക്തവും സാധാരണവുമായ ആധുനിക മലയാളപദം.
- source_word: διαλογισμοῦ
  choice: തർക്കം
  rationale: ഈ പദത്തിന് ചിന്ത, സംശയം, വാദപ്രതിവാദം എന്നീ അർഥങ്ങൾ ഉണ്ടാകാം. ‘കോപം’ എന്നതിനോടൊപ്പം സഭയിലെ കൂട്ടായ പ്രാർഥനയെക്കുറിച്ചുള്ള നിർദേശത്തിൽ വരുന്നതിനാൽ കലഹപരമായ തർക്കമാണ് ഇവിടെ കൂടുതൽ സാധ്യത; ‘സംശയം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοὺς ἄνδρας എന്നതിന്റെ ലിംഗനിർദിഷ്ട പരാമർശം
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ / എല്ലാവരും / ഭർത്താക്കന്മാർ
  rationale: ഉടൻപിന്തുടരുന്ന സന്ദർഭം പുരുഷന്മാർക്കും സ്ത്രീകൾക്കും വേർതിരിച്ച നിർദേശങ്ങൾ നൽകുന്നതിനാൽ മൂലപാഠത്തിന്റെ ലിംഗനിർദിഷ്ടത നിലനിർത്തുന്നു; അതേസമയം ‘ഭർത്താക്കന്മാർ’ എന്ന അർഥത്തിന് വ്യക്തമായ സന്ദർഭാധാരം ഇല്ല.
- issue: പ്രാർഥനാസന്ദർഭത്തിലെ διαλογισμοῦ എന്നതിന്റെ അർഥം
  choice: തർക്കം
  alternative: വാദപ്രതിവാദം / സംശയം
  rationale: ‘കോപം’ എന്നതിനോടുള്ള കൂട്ടുകെട്ടും സമൂഹപ്രാർഥനയുടെ സന്ദർഭവും കലഹപരമായ തർക്കത്തെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ ഉള്ളിലെ സംശയം എന്ന അർഥം പദസാധ്യതയായതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ നിർദേശാത്മക ഭാവം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിച്ചു; വിഭാഗീയ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
