id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, എല്ലാറ്റിലും ആദ്യം, എല്ലാ മനുഷ്യർക്കുവേണ്ടി അപേക്ഷകളും പ്രാർഥനകളും മധ്യസ്ഥപ്രാർഥനകളും സ്തോത്രങ്ങളും അർപ്പിക്കണമെന്ന് ഞാൻ അഭ്യർഥിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ അഭ്യർഥിക്കുന്നു
  rationale: ഗൗരവമുള്ള അപ്പൊസ്തലിക ആഹ്വാനത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പത്തെ ചർച്ചയിൽനിന്നുള്ള നിഗമനാത്മകമായ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: πρῶτον πάντων
  choice: ഒന്നാമതായി
  rationale: ക്രമപ്പട്ടികയിലെ ആദ്യ ഇനം എന്നതിലുപരി മുൻഗണനയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ποιεῖσθαι
  choice: അർപ്പിക്കണമെന്ന്
  rationale: നാലു പ്രാർഥനാസംബന്ധിയായ നാമങ്ങളോടും സ്വാഭാവികമായി ചേരുന്നു; ആരാധനാക്രമത്തെ അനാവശ്യമായി നിർവചിക്കാതെ അവ ദൈവത്തോടു നടത്തപ്പെടുന്നതാണെന്ന ആശയം നൽകുന്നു.
- source_word: δεήσεις
  choice: അപേക്ഷകൾ
  rationale: ആവശ്യത്തിൽനിന്നുയരുന്ന അഭ്യർഥനകളെ സൂചിപ്പിക്കുകയും പ്രാർഥനകൾ എന്ന പൊതുപദത്തിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προσευχάς
  choice: പ്രാർഥനകൾ
  rationale: പ്രാർഥനയ്ക്കുള്ള പൊതുവായ ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἐντεύξεις
  choice: മധ്യസ്ഥപ്രാർഥനകൾ
  rationale: ഈ സന്ദർഭത്തിൽ മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള അപേക്ഷ എന്ന ആശയം വ്യക്തമാക്കുന്ന, മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ മനസ്സിലാകുന്ന പദം.
- source_word: εὐχαριστίας
  choice: സ്തോത്രങ്ങൾ
  rationale: ദൈവത്തോടുള്ള നന്ദിപ്രകടനങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം; ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: പ്രയോജനത്തിനായോ പ്രതിനിധിയായോ എന്ന അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πάντων ἀνθρώπων
  choice: എല്ലാ മനുഷ്യർക്കും
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ വ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: πάντων ἀνθρώπων എന്നതിന്റെ വ്യാപ്തി
  choice: എല്ലാ മനുഷ്യരും
  alternative: എല്ലാത്തരം മനുഷ്യരും
  rationale: ഗ്രീക്ക് വാചകം നേരിട്ട് ‘എല്ലാ മനുഷ്യർ’ എന്നാണ് പറയുന്നത്. ഓരോ വ്യക്തിയെയോ എല്ലാ വിഭാഗങ്ങളെയോ ഉദ്ദേശിക്കുന്നുവെന്ന ദൈവശാസ്ത്രവാദം പരിഭാഷയിൽ തീർപ്പാക്കാതെ മൂലവാചകത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- issue: ἐντεύξεις എന്ന പദത്തിന്റെ അർഥപരിധി
  choice: മധ്യസ്ഥപ്രാർഥനകൾ
  alternative: അപേക്ഷകൾ / അഭ്യർഥനകൾ
  rationale: പദത്തിന് അഭ്യർഥനയുടെയോ സമീപനത്തിന്റെയോ വിശാല അർഥം ഉണ്ടായേക്കാമെങ്കിലും, ‘എല്ലാ മനുഷ്യർക്കുംവേണ്ടി’ എന്ന തുടർവാക്യം ഇവിടെ മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള പ്രാർഥന എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പ്രാർഥനാസംബന്ധിയായ നാലു ഗ്രീക്ക് പദങ്ങളുടെയും വ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തി; അതേസമയം അപൂർവമോ അത്യന്തം പുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
