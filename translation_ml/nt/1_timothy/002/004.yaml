id: 1TI.2.4
reference: 1 Timothy 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: ml
  text: എല്ലാ മനുഷ്യരും രക്ഷിക്കപ്പെടുകയും സത്യത്തിന്റെ പരിജ്ഞാനത്തിലേക്കു[b] വരുകയും വേണമെന്ന് അവിടന്ന് ആഗ്രഹിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാ മനുഷ്യരും രക്ഷിക്കപ്പെടാനും സത്യത്തിന്റെ പരിജ്ഞാനത്തിലേക്കു വരാനും അവിടന്ന് ഇച്ഛിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ആഗ്രഹിക്കുന്നു,’ ‘ഇച്ഛിക്കുന്നു,’ ‘വേണമെന്നു വിചാരിക്കുന്നു’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരിജ്ഞാനം’ എന്ന പദത്തിന് ഇവിടെ സത്യത്തെ കൂടുതൽ പൂർണമായി അറിയുക എന്ന അർഥനിറവും ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: അവിടന്ന്
  rationale: മുൻവാക്യത്തിലെ ദൈവത്തെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ആദരസൂചകമായ ഏകവചന സർവനാമം ഉപയോഗിച്ചു; മുൻവാക്യത്തോടുള്ള ആശയബന്ധം നിലനിൽക്കുന്നു.
- source_word: πάντας ἀνθρώπους
  choice: എല്ലാ മനുഷ്യരും
  rationale: ഇവിടെ ἄνθρωπος പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ സർവവ്യാപകമായ പരിധി ചുരുക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്തു.
- source_word: θέλει
  choice: ആഗ്രഹിക്കുന്നു
  rationale: θέλω എന്നതിന് ആഗ്രഹിക്കുക, ഇച്ഛിക്കുക, വേണമെന്നു വിചാരിക്കുക എന്നീ അർഥങ്ങളുണ്ടാകാം. ദൈവഹിതത്തെക്കുറിച്ചുള്ള പ്രത്യേക സാങ്കേതിക വ്യാഖ്യാനം വിവർത്തനത്തിൽ അടിച്ചേൽപ്പിക്കാതെ ക്രിയയുടെ സാധാരണ അർഥം നൽകുന്നു.
- source_word: σωθῆναι
  choice: രക്ഷിക്കപ്പെടുകയും
  rationale: σῴζω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗത്തിലുള്ള അനന്തക്രിയാരൂപമാണിത്; പൗലോസിന്റെ ഈ സന്ദർഭത്തിലെ രക്ഷാസംബന്ധമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: സത്യത്തിന്റെ പരിജ്ഞാനത്തിലേക്കു
  rationale: ἐπίγνωσις അറിവ്, തിരിച്ചറിവ്, പൂർണമായ അറിവ് എന്നീ അർഥനിറങ്ങൾ വഹിക്കാം. ‘പരിജ്ഞാനം’ എന്നത് നാമരൂപവും കൂടുതൽ ആഴമുള്ള അറിവിന്റെ സാധ്യതയും നിലനിർത്തുന്നു; എന്നാൽ മുഖ്യവാചകത്തിൽ ‘പൂർണമായ’ എന്നു ചേർത്ത് അർഥം അതിരുകടത്തി നിർണയിക്കുന്നില്ല.
- source_word: ἐλθεῖν
  choice: വരുകയും
  rationale: εἰς എന്നതിനോടൊപ്പം ഒരു അവസ്ഥയിലേക്കോ യാഥാർഥ്യത്തിലേക്കോ എത്തുന്നതിനെ സൂചിപ്പിക്കുന്ന ἔρχομαι എന്ന ക്രിയയുടെ നേരിട്ടുള്ള തുല്യപദം; ‘പരിജ്ഞാനത്തിലേക്കു വരുക’ എന്ന ചലനരൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πάντας ἀνθρώπους എന്നതിന്റെ വ്യാപ്തിയും ദൈവത്തിന്റെ രക്ഷാകാംക്ഷയും
  choice: ‘എല്ലാ മനുഷ്യരും’ എന്നും θέλει എന്നതിന് ‘ആഗ്രഹിക്കുന്നു’ എന്നും നൽകി, വാക്യത്തിന്റെ സർവവ്യാപകമായ ഭാഷയും അതിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തി.
  alternative: ‘എല്ലാത്തരം മനുഷ്യരും’; ‘എല്ലാ മനുഷ്യരും രക്ഷിക്കപ്പെടണമെന്ന് ഇച്ഛിക്കുന്നു/നിശ്ചയിക്കുന്നു.’
  rationale: ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായി എല്ലാ മനുഷ്യരെയും ഉൾക്കൊള്ളുന്നു. അതിനെ മനുഷ്യരുടെ വിവിധ വിഭാഗങ്ങളായി ചുരുക്കുന്നതോ θέλει എന്നതിനെ നിർണയാത്മകമായ ദൈവവിധിയെ സൂചിപ്പിക്കുന്ന സാങ്കേതിക പദമാക്കി ശക്തിപ്പെടുത്തുന്നതോ മൂലവാചകത്തിനപ്പുറം വിവാദം തീർപ്പാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പരിജ്ഞാനത്തിലേക്കു വരുക’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ നാമരൂപവും ചലനരൂപകവും സംരക്ഷിക്കുന്നു. പ്രധാനവാചകത്തിലെ അടിക്കുറിപ്പ് [a] ‘വേണമെന്ന്’ എന്ന മുഴുവൻ ഘടനയോടും [b] ‘ആഗ്രഹിക്കുന്നു’ എന്ന ക്രിയയോടും ചേർന്നിരിക്കുന്നു.
