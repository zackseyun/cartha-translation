id: 1TI.2.2
reference: 1 Timothy 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: ml
  text: രാജാക്കന്മാർക്കും ഉന്നതസ്ഥാനങ്ങളിലുള്ള എല്ലാവർക്കുംവേണ്ടിയും[a] പ്രാർഥിക്കണം; അങ്ങനെ നമുക്ക് സകല ദൈവഭക്തിയോടും ഗൗരവത്തോടുംകൂടെ സ്വസ്ഥവും ശാന്തവുമായ ജീവിതം നയിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അധികാരത്തിലുള്ള എല്ലാവർക്കും.’ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം ‘ഉന്നതനിലയിലുള്ള എല്ലാവർക്കും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: വേണ്ടിയും
  rationale: മുൻവാക്യത്തിലെ പ്രാർഥനകളുടെയും മധ്യസ്ഥപ്രാർഥനകളുടെയും ആഹ്വാനം ഇവിടെ തുടരുന്നതിനാൽ, ചില വ്യക്തികൾക്കുവേണ്ടിയുള്ള പ്രാർഥന എന്ന അർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: βασιλέων
  choice: രാജാക്കന്മാർക്കും
  rationale: ഈ നാമം പ്രത്യേകമായി രാജാക്കന്മാരെയോ പരമാധികാരികളെയോ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ഭരണാധികാരികൾ’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: ഉന്നതസ്ഥാനങ്ങളിലുള്ള എല്ലാവർക്കും
  rationale: ഔദ്യോഗിക അധികാരപദവികൾ മാത്രമല്ല, പ്രാമുഖ്യമോ ഉയർന്ന നിലയോ ഉള്ളവരെയും ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: പ്രാർഥനയുടെ ഉദ്ദേശ്യവും പ്രതീക്ഷിക്കുന്ന ഫലവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἤρεμον
  choice: സ്വസ്ഥമായ
  rationale: കലഹമോ ശല്യമോ ഇല്ലാത്ത സമാധാനപൂർണമായ അവസ്ഥയെ സൂചിപ്പിക്കുകയും അടുത്ത വിശേഷണത്തിൽനിന്ന് ചെറിയ അർഥവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡσύχιον
  choice: ശാന്തമായ
  rationale: ഒതുക്കവും ശാന്തതയും നിറഞ്ഞ ജീവിതത്തെ സൂചിപ്പിക്കുന്നു; ἤρεμον എന്ന പദത്തോടുള്ള സമാനതയും വ്യത്യാസവും ഒരുപോലെ കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: βίον
  choice: ജീവിതം
  rationale: ഇവിടെ ഭൂമിയിലെ ജീവിതരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷയാണിത്.
- source_word: διάγωμεν
  choice: നയിക്കാം
  rationale: ജീവിതം കഴിക്കുക അഥവാ നയിക്കുക എന്ന സജീവഭാവം മലയാളത്തിലെ പതിവുപ്രയോഗത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: പൂർണ ദൈവഭക്തിയോടും
  rationale: εὐσέβεια ദൈവത്തോടുള്ള ആദരഭക്തി ജീവിതത്തിൽ പ്രകടമാകുന്നതിനെ സൂചിപ്പിക്കുന്നു; πάσῃ നൽകുന്ന സമഗ്രത ‘പൂർണ’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: σεμνότητι
  choice: മാന്യതയോടുംകൂടെ
  rationale: ആദരവിന് അർഹമായ ഗൗരവവും ഉചിതമായ പെരുമാറ്റവും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗമാണിത്.
theological_decisions:
- issue: ഭരണാധികാരികൾക്കുവേണ്ടിയുള്ള പ്രാർഥനയുടെ വ്യാപ്തിയും ഉദ്ദേശ്യവും
  choice: വിശ്വാസികൾക്ക് സ്വസ്ഥവും ശാന്തവുമായി ദൈവഭക്തിയിലും മാന്യതയിലും ജീവിക്കാനാകേണ്ടതിന് ഭരണാധികാരികൾക്കുവേണ്ടി പ്രാർഥിക്കണമെന്ന് വാക്യം പറയുന്നു; അവരെ നിരുപാധികം അംഗീകരിക്കണമെന്ന ആശയം ചേർക്കുന്നില്ല.
  alternative: ഭരണാധികാരികൾക്കുള്ള കീഴടങ്ങലിന് കൂടുതൽ ഊന്നൽ നൽകുക, അല്ലെങ്കിൽ ഈ പ്രയോഗം ഔദ്യോഗിക അധികാരസ്ഥാനങ്ങളിലുള്ളവർക്ക് മാത്രമായി ചുരുക്കുക.
  rationale: ഗ്രീക്ക് പാഠം പ്രാർഥനയുടെ വിഷയങ്ങളെയും അതിന്റെ ഉദ്ദേശ്യമായ സാമൂഹിക സാഹചര്യത്തെയും പ്രസ്താവിക്കുന്നു. ഓരോ ഭരണാധികാരിയുടെയും നിയമസാധുതയെക്കുറിച്ചുള്ള വിപുലമായ രാഷ്ട്രീയ ദൈവശാസ്ത്രം ഇവിടെ നേരിട്ട് ഉന്നയിക്കുന്നില്ല; അതിനാൽ ആ സംഘർഷം പരിഭാഷയിൽ പരിഹരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. മുൻവാക്യത്തിൽനിന്നുള്ള വ്യാകരണബന്ധം വായനക്കാർക്ക് വ്യക്തമാകാൻ ‘പ്രാർഥിക്കണം’ ചേർത്തു; സെമിക്കോളൺ ഉദ്ദേശ്യവാക്യത്തെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു. ‘സ്വസ്ഥവും ശാന്തവുമായ’ എന്ന പദജോടി ഗ്രീക്കിലെ സമീപാർഥമുള്ള രണ്ടു വിശേഷണങ്ങളെയും ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ അവതരിപ്പിക്കുന്നു.
