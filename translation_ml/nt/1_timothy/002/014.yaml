id: 1TI.2.14
reference: 1 Timothy 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: ml
  text: ആദാം വഞ്ചിക്കപ്പെട്ടില്ല; എന്നാൽ സ്ത്രീ പൂർണമായി വഞ്ചിക്കപ്പെട്ട്[a] ലംഘനത്തിൽ ആയിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വഞ്ചിക്കപ്പെട്ട്.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയ ആദാമിനെക്കുറിച്ച് മുമ്പ് ഉപയോഗിച്ച ക്രിയയെക്കാൾ ശക്തമായ അർഥത്തിൽ, ‘തികച്ചും വഞ്ചിക്കപ്പെട്ട്’ എന്ന ആശയം നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ലംഘനത്തിൽ ആയിത്തീർന്നിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ലംഘനത്തിൽ ആയിത്തീർന്നു.’ ഗ്രീക്കിലെ പെർഫെക്റ്റ് ക്രിയ സംഭവത്തിന്റെ ഫലമായി ഉണ്ടായ നിലയ്ക്ക് ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: ആദാം
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥിരപ്പെട്ടിട്ടുള്ള രൂപത്തിൽ വ്യക്തിനാമം ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἠπατήθη
  choice: വഞ്ചിക്കപ്പെട്ടില്ല
  rationale: ἀπατάω എന്ന ക്രിയയുടെ എയോറിസ്റ്റ് കർമണിരൂപം നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: ഈ ഉല്പത്തി വിവരണസൂചനയിലും ആദാമുമായുള്ള വൈരുധ്യത്തിലും ‘ഭാര്യ’ എന്നതിനെക്കാൾ പൊതുവായ ‘സ്ത്രീ’ ഗ്രീക്കിനോട് കൂടുതൽ നേരിട്ട് ഒത്തുപോകുന്നു.
- source_word: ἐξαπατηθεῖσα
  choice: പൂർണമായി വഞ്ചിക്കപ്പെട്ട്
  rationale: ἐξαπατάω എന്ന സംയുക്തക്രിയയിൽ ഉണ്ടായേക്കാവുന്ന ശക്തമായ അർഥഭാവം സൂക്ഷിക്കുകയും, കൃതന്തത്തെ മുഖ്യക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν παραβάσει
  choice: ലംഘനത്തിൽ അകപ്പെട്ട
  rationale: παράβασις എന്ന അമൂർത്തനാമത്തെ ‘ലംഘക’ എന്ന വ്യക്തിപദമാക്കി മാറ്റാതെ, ἐν എന്നതിന്റെ ബന്ധവും മലയാളത്തിലെ സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: γέγονεν
  choice: ആയിത്തീർന്നു
  rationale: γίνομαι എന്നതിന്റെ പെർഫെക്റ്റ് രൂപത്തിലുള്ള സംഭവവും അതിന്റെ ഫലാവസ്ഥയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ആദാമിനെയും സ്ത്രീയെയും തമ്മിൽ താരതമ്യപ്പെടുത്തുന്ന വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നതിനാൽ ‘കൂടാതെ’ എന്ന പദം ചേർക്കുന്നത് അനാവശ്യ ഭാരമുണ്ടാക്കും.
theological_decisions:
- issue: സ്ത്രീയും ലംഘനവും തമ്മിലുള്ള ബന്ധം വിശാലമായ സ്ത്രീദോഷമോ സ്വഭാവപരമായ വിധിയോ ആയി വ്യാഖ്യാനിക്കാതെ എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ഉല്പത്തി സംഭവവുമായി ബന്ധപ്പെട്ട ചരിത്രപ്രസ്താവനയായി, ‘സ്ത്രീ ... ലംഘനത്തിൽ അകപ്പെട്ടവളായിത്തീർന്നു’ എന്ന് അടുത്തായി വിവർത്തനം ചെയ്തു.
  alternative: ‘സ്ത്രീ വഞ്ചിക്കപ്പെട്ട് ലംഘകയായി’ അല്ലെങ്കിൽ ‘പാപത്തിൽ വീണു’
  rationale: മൂലത്തിലെ അമൂർത്തനാമവും ഫലാവസ്ഥയും നിലനിർത്തുന്നു; ‘ലംഘക’ എന്ന വ്യക്തിമുദ്രയോ കൂടുതൽ വ്യാഖ്യാനപരമായ ‘പാപത്തിൽ വീണു’ എന്ന പ്രയോഗമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ വൈരുധ്യം വ്യക്തമായി സൂക്ഷിച്ചു; രണ്ടാം വഞ്ചനാക്രിയയുടെ സാധ്യതയുള്ള ശക്തി പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലെ കൂടുതൽ മിതമായ പകരത്തിലും രേഖപ്പെടുത്തി.
