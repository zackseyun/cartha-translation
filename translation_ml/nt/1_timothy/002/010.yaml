  text: ἀλλ’ ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν, δι’ ἔργων ἀγαθῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: ml
  text: മറിച്ച്, ദൈവഭക്തി[b] ഏറ്റുപറയുന്ന സ്ത്രീകൾക്ക് ഉചിതമായ[a] സൽപ്രവൃത്തികളിലൂടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യോജിച്ച’ അല്ലെങ്കിൽ ‘അനുയോജ്യമായ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ദൈവത്തോടുള്ള ഭക്തി’ അല്ലെങ്കിൽ ‘ദൈവത്തോടുള്ള ഭയഭക്തി.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘സൽപ്രവൃത്തികളിലൂടെ’; ഇവിടെ സൽപ്രവൃത്തികളാണ് യോജിച്ച അലങ്കാരം എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ ബാഹ്യ അലങ്കാരത്തോട് ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘മറിച്ച്’ സ്വാഭാവികമാണ്.
- source_word: ὃ πρέπει
  choice: ഉചിതമായതുകൊണ്ട്
  rationale: ‘യോജിക്കുന്നത്/ഉചിതമായത്’ എന്ന നൈതിക ഔചിത്യത്തിന്റെ ആശയം നപുംസകലിംഗ ആപേക്ഷിക പ്രയോഗത്തോടുകൂടെ നിലനിർത്തുന്നു.
- source_word: γυναιξὶν
  choice: സ്ത്രീകൾക്ക്
  rationale: സന്ദർഭം വിവാഹിതരായ ഭാര്യമാരെ മാത്രമല്ല, പൊതുവായി സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπαγγελλομέναις
  choice: ഏറ്റുപറയുന്ന
  rationale: ഒരു അവകാശവാദമോ പരസ്യമായ വിശ്വാസപ്രഖ്യാപനമോ നടത്തുന്നതിന്റെ അർഥം നൽകുന്നു; നേർച്ചയെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: θεοσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭക്തി, ആദരവ്, ഭയഭക്തി എന്നിവ ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള പദമാണ്.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: സൽപ്രവൃത്തികളിലൂടെ
  rationale: διά + genitive എന്ന മൂലരൂപത്തിലെ മാർഗം/വിധം എന്ന ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ അലങ്കാരത്തിന് പകരമായ യോജിച്ച പ്രകടനമാണ് സൽപ്രവൃത്തികൾ എന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘സൽപ്രവൃത്തികൾ’ക്കും ‘ദൈവഭക്തി ഏറ്റുപറയുന്നു’ എന്നതിനുമിടയിലെ ബന്ധം
  choice: ദൈവഭക്തി ഏറ്റുപറയുന്ന സ്ത്രീകൾക്ക് യോജിച്ച ബാഹ്യപ്രകടനമായി സൽപ്രവൃത്തികളെ അവതരിപ്പിക്കുന്നു.
  alternative: ദൈവസമ്മതം അല്ലെങ്കിൽ രക്ഷ നേടുന്നതിനുള്ള അർഹതയുടെ അടിസ്ഥാനമായി സൽപ്രവൃത്തികളെ അവതരിപ്പിക്കുന്നു.
  rationale: വാക്യഘടന ബാഹ്യ അലങ്കാരത്തെ ദൈവഭക്തിക്ക് യോജിച്ച പെരുമാറ്റവുമായി താരതമ്യം ചെയ്യുന്നു; രക്ഷാശാസ്ത്രപരമായ ഒരു നിഗമനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യം മുൻവാക്യത്തിലെ ‘അലങ്കരിക്കുക’ എന്ന ആശ്രിതക്രിയയുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നതിനാൽ, അതിന്റെ അപൂർണവാക്യസ്വഭാവവും ഡാഷ് ഉപയോഗിച്ചുള്ള ഊന്നലും നിലനിർത്തി; വ്യാഖ്യാനപരമായി ഒരു ക്രിയ ചേർത്തിട്ടില്ല.
