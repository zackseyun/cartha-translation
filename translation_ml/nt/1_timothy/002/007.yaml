id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: ml
  text: ഇതിനായി എന്നെ ഒരു പ്രഘോഷകനായും അപ്പൊസ്തലനായും നിയമിച്ചു[a]—ഞാൻ സത്യം പറയുന്നു; കള്ളം പറയുന്നില്ല—വിശ്വാസത്തിലും സത്യത്തിലും യെഹൂദേതരരുടെ അധ്യാപകനായി.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അതിന് ഞാൻ നിയമിക്കപ്പെട്ടു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ജനതകളുടെ അധ്യാപകൻ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “വിശ്വസ്തതയിലും സത്യത്തിലും.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: ഇതിനായിട്ടാണ്
  rationale: മുൻവാക്യത്തിലെ രക്ഷാസന്ദേശത്തെയോ അതിന്റെ പ്രഖ്യാപനത്തെയോ പിന്നോട്ടു ചൂണ്ടുകയും ഉദ്ദേശ്യത്തിന്റെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐτέθην
  choice: നിയമിക്കപ്പെട്ടത്
  rationale: ഇവിടെ ഭൗതികമായി വെക്കപ്പെടുക എന്നതല്ല, ഒരു ശുശ്രൂഷാദൗത്യത്തിലേക്ക് നിയോഗിക്കപ്പെടുക എന്ന അർഥമാണ്.
- source_word: κῆρυξ
  choice: വിളംബരക്കാരൻ
  rationale: മറ്റൊരാളുടെ അധികാരത്തിൽ പരസ്യമായി സന്ദേശം അറിയിക്കുന്ന ഔദ്യോഗിക പ്രതിനിധിയുടെ ഭാവം സൂക്ഷിക്കുന്നു; സഭാപാരമ്പര്യത്തിന്റെ പ്രത്യേക നിറമുള്ള പദം ഒഴിവാക്കുന്നു.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പൗലോസിന്റെ സ്വയംപരാമർശത്തിൽ അംഗീകൃതമായ ശുശ്രൂഷാപദവിയായതിനാൽ പ്രചാരത്തിലുള്ള കൃത്യമായ പദം ഉപയോഗിക്കുന്നു.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: ഞാൻ സത്യം പറയുന്നു; കള്ളം പറയുന്നില്ല
  rationale: ഊന്നലുള്ള ഇരട്ട ഉറപ്പിനെ സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διδάσκαλος ἐθνῶν
  choice: ജനതകളുടെ ഉപദേഷ്ടാവ്
  rationale: ἐθνῶν എന്നതിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ’ എന്ന വിശാലത പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; പൗലോസിന്റെ സന്ദർഭത്തിൽ ‘യെഹൂദേതരർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. διδάσκαλος എന്നത് പഠിപ്പിക്കുന്നവനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉപദേഷ്ടാവ്’ സ്വാഭാവികമായി യോജിക്കുന്നു.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: വിശ്വാസത്തിലും സത്യത്തിലും
  rationale: ἐν എന്നതിന്റെ ബന്ധപരിധി നിർബന്ധമായി വിശദീകരിക്കാതെ, പൗലോസിന്റെ പഠിപ്പിക്കലിന്റെ മേഖലയോ രീതിയോ സൂചിപ്പിക്കാവുന്ന യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു; πίστις എന്നതിന് സാധാരണമായ ‘വിശ്വാസം’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ നിയോഗത്തിൽ ἐθνῶν എന്നതിന്റെ അർഥം
  choice: ജനതകൾ
  alternative: യെഹൂദേതരർ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലമായ അർഥം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് പലപ്പോഴും യെഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ആ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν πίστει καὶ ἀληθείᾳ എന്നതിലെ πίστις
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത
  rationale: πίστις എന്നതിന് ഇവിടെ ‘വിശ്വാസം’ സ്വാഭാവികമാണ്; എന്നാൽ ‘വിശ്വസ്തത’ എന്ന ഗുണാർഥവും ഭാഷാപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഇടവാക്യത്തിലെ ഊന്നൽ ദീർഘരേഖകളാൽ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
