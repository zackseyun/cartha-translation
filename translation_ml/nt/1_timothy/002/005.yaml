source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവം ഒരുവനാണ്; ദൈവത്തിനും മനുഷ്യർക്കും ഇടയിൽ മധ്യസ്ഥനും ഒരുവനാണ്—മനുഷ്യനായ മശീഹാ യേശു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനുഷ്യനായ ക്രിസ്തുയേശു.’ ഗ്രീക്ക് Χριστός എന്നത് ‘മശീഹാ’ എന്ന പദവിയാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς
  choice: ഒരുവൻ / ഒരുവനാണ്
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും ‘ഒരുവൻ’ എന്ന ആശയം നിലനിർത്തി ‘ദൈവം ഒരുവൻ; മധ്യസ്ഥനും ഒരുവൻ’ എന്ന ഊന്നിയ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തെ വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: μεσίτης
  choice: മധ്യസ്ഥൻ
  rationale: രണ്ടു കക്ഷികൾക്കിടയിൽ നിന്ന് ബന്ധമോ അനുരഞ്ജനമോ സാധ്യമാക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: ദൈവത്തിനും മനുഷ്യർക്കും ഇടയിൽ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തി ബന്ധം മലയാളത്തിലെ ‘മധ്യസ്ഥൻ’ എന്ന പദത്തോടൊപ്പം സ്വാഭാവികമായി ‘ഇടയിൽ’ എന്നു വ്യക്തമാക്കുന്നു; ἀνθρώπων ഇവിടെ മനുഷ്യരാശിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: മനുഷ്യനായ
  rationale: യേശുവിന്റെ യഥാർഥ മനുഷ്യത്വം വ്യക്തമാക്കുകയും മുൻപത്തെ ‘മനുഷ്യർ’ എന്ന പദവുമായി ശാബ്ദികബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു; ഗ്രീക്കിലെ ഗുണാത്മകവും സമാനാധികരണപരവുമായ പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അർത്ഥം വിവർത്തനം ചെയ്യുന്നു; വെറും പേരിന്റെ ഭാഗംപോലെ ലിപ്യന്തരണം ചെയ്യുന്നില്ല.
- source_word: Ἰησοῦς
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ നിലവാരമുള്ള മലയാളരൂപം.
theological_decisions:
- issue: ἀνθρώπων / ἄνθρωπος തമ്മിലുള്ള ബന്ധം
  choice: മനുഷ്യർക്കും … മനുഷ്യനായ
  alternative: ആളുകൾക്കും … മനുഷ്യനായ
  rationale: പല മനുഷ്യരെയും ഏക മനുഷ്യനായ യേശുവിനെയും ബന്ധിപ്പിക്കുന്ന ഗ്രീക്കിലെ ആവർത്തനം സംരക്ഷിക്കുന്നു; അതിലൂടെ അവന്റെ യഥാർഥവും പ്രതിനിധാനപരവുമായ മനുഷ്യത്വം പാഠം പറയുന്നതിലധികം വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഗ്രീക്കിലെ പദക്രമം നിലനിർത്തിക്കൊണ്ട് Χριστός എന്നതിന്റെ പദവിസ്വഭാവം തുറന്നുകാട്ടുന്നു.
- issue: ἄνθρωπος Χριστὸς Ἰησοῦς എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഊന്നൽ
  choice: മനുഷ്യനായ മശീഹാ യേശു
  alternative: മനുഷ്യൻ, ക്രിസ്തുയേശു
  rationale: വാക്യം വ്യക്തമായി ഉറപ്പിക്കുന്ന യേശുവിന്റെ മനുഷ്യത്വം സംരക്ഷിക്കുന്നു; അതേസമയം അവന്റെ ദൈവത്വത്തെ നിഷേധിക്കുന്ന ആശയം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. അർദ്ധവിരാമവും ദീർഘവിരാമവും ഗ്രീക്കിലെ ‘ഒരുവൻ … ഒരുവൻ’ എന്ന സമാന്തരഘടനയും അവസാനത്തെ സമാനാധികരണ തിരിച്ചറിയലും വ്യക്തമാക്കുന്നു.
