id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: ml
  text: എങ്കിലും, അവൾ മക്കളെ പ്രസവിക്കുന്നതിലൂടെ[a] രക്ഷിക്കപ്പെടും[c]—അവർ വിശ്വാസത്തിലും[b] സ്നേഹത്തിലും വിശുദ്ധിയിലും ആത്മനിയന്ത്രണത്തോടെ നിലനിൽക്കുന്നെങ്കിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആ പ്രസവത്തിലൂടെ.’ ചിലർ ഇത് ഒരു പ്രത്യേക പ്രസവത്തെ—ഒരുപക്ഷേ മിശിഹായുടെ ജനനത്തെ—സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; എന്നാൽ ഈ പ്രയോഗം പൊതുവായി ‘മക്കളെ പ്രസവിക്കുന്നതിലൂടെ’ എന്നും വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ഇവിടെ ‘വിശ്വാസം’ എന്നത് ‘വിശ്വസ്തത’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്ക് പാഠം ഏകവചനമായ ‘അവൾ രക്ഷിക്കപ്പെടും’ എന്നതിൽനിന്ന് ബഹുവചനമായ ‘അവർ നിലനിൽക്കുന്നെങ്കിൽ’ എന്നതിലേക്കു മാറുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ σῴζω സാധാരണയായി ‘രക്ഷിക്കുക’ എന്ന ദൈവശാസ്ത്രപരമായ അർഥം വഹിക്കുന്നു. ‘സുരക്ഷിതയായിരിക്കും’ എന്നു പരിഭാഷപ്പെടുത്തിയാൽ ശാരീരിക സംരക്ഷണം എന്ന അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുങ്ങാം.
- source_word: δὲ
  choice: എങ്കിലും
  rationale: മുൻവാക്യവുമായി മൃദുവായ വൈരുധ്യമോ ആശയവികാസമോ സൂചിപ്പിക്കുന്ന δέയുടെ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: διὰ τῆς τεκνογονίας
  choice: മക്കളെ പ്രസവിക്കുന്നതിലൂടെ
  rationale: τεκνογονία മക്കളെ പ്രസവിക്കൽ എന്ന പ്രക്രിയയെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നിർദേശക ഉപപദം പൊതുവായോ ഒരു പ്രത്യേക പ്രസവത്തെ സൂചിപ്പിക്കുന്നതായോ ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാനപാഠം സ്വാഭാവികമായി പൊതുവായ അർഥത്തിൽ നൽകിയിട്ട് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐὰν
  choice: എങ്കിൽ
  rationale: ἐάν നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ നേരിട്ടുള്ള മലയാള സമാനപദം ഉപയോഗിച്ചു.
- source_word: μείνωσιν
  choice: അവർ ... നിലനിൽക്കുന്നെങ്കിൽ
  rationale: μένω ഇവിടെ സൂചിപ്പിക്കുന്ന ഒരു നിലയിൽ തുടരുക, ഉറച്ചുനിൽക്കുക എന്ന ആശയം ‘നിലനിൽക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: πίστις എന്നതിന് അടിസ്ഥാനപരമായി ‘വിശ്വാസം’ ഉപയോഗിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘വിശ്വസ്തത’ എന്ന സൂക്ഷ്മാർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: ἀγάπηയുടെ വ്യക്തവും സാധാരണവുമായ മലയാള പരിഭാഷ.
- source_word: ἁγιασμῷ
  choice: വിശുദ്ധിയിൽ
  rationale: ἁγιασμός എന്നത് വിശുദ്ധീകരണമോ വിശുദ്ധിയോ സൂചിപ്പിക്കാം. ഗുണങ്ങളുടെ ഈ പട്ടികയിൽ സാങ്കേതികമല്ലാത്ത ‘വിശുദ്ധി’ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്.
- source_word: μετὰ σωφροσύνης
  choice: ആത്മനിയന്ത്രണത്തോടുകൂടെ
  rationale: σωφροσύνη ആത്മനിയന്ത്രണം, വിവേകം, സുബോധം എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു; ഈ ധാർമിക സന്ദർഭത്തിൽ ‘ആത്മനിയന്ത്രണം’ വ്യക്തവും ആധുനികവുമാണ്.
theological_decisions:
- issue: ‘അവൾ രക്ഷിക്കപ്പെടും’ എന്ന ഏകവചനത്തിൽനിന്ന് ‘അവർ നിലനിൽക്കുന്നെങ്കിൽ’ എന്ന ബഹുവചനത്തിലേക്കുള്ള മാറ്റം
  choice: ഗ്രീക്കിലെ ഏകവചന-ബഹുവചന മാറ്റം അതേപടി നിലനിർത്തി.
  alternative: രണ്ടും സ്ത്രീകളെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വ്യാഖ്യാനിച്ച് ‘സ്ത്രീകൾ ... അവർ’ എന്നു സുഗമമാക്കുക; അല്ലെങ്കിൽ ‘അവൾ’ ഹവ്വയെയും ‘അവർ’ സ്ത്രീകളെ പൊതുവായും സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: മൂലപാഠത്തിലെ വ്യാകരണപരമായ മാറ്റം വ്യാഖ്യാനപ്രാധാന്യമുള്ളതാണ്. അത് സുഗമമാക്കി മാറ്റാതെ നിലനിർത്തുന്നത് ‘അവൾ’ മുൻസന്ദർഭത്തിലെ സ്ത്രീയെയോ ഹവ്വയെയോ സൂചിപ്പിക്കുന്നുവോ, പിന്നത്തെ ബഹുവചനം സ്ത്രീകളിലേക്ക് പൊതുവാക്കുന്നുവോ എന്ന യഥാർഥ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
- issue: ‘മക്കളെ പ്രസവിക്കുന്നതിലൂടെ രക്ഷിക്കപ്പെടും’ എന്നതിന്റെ അർഥം
  choice: രക്ഷ ശാരീരിക സംരക്ഷണമാണോ, അന്തിമരക്ഷയാണോ, മാതൃത്വവുമായി ബന്ധപ്പെട്ടതാണോ എന്നു പ്രധാനപാഠത്തിൽ നിർണയിക്കാതെ മൂലവാക്യത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തി.
  alternative: പ്രസവത്തിൽ സുരക്ഷിതയായിരിക്കും; മാതൃത്വം സ്വീകരിക്കുന്നതിലൂടെ രക്ഷിക്കപ്പെടും; മശീഹയുടെ ജനനത്തിലൂടെ രക്ഷിക്കപ്പെടും.
  rationale: ഇത് യഥാർഥത്തിൽ വിവാദമുള്ള പ്രയോഗമാണ്. ഗ്രീക്ക് പാഠം ശാരീരിക സുരക്ഷയെന്നോ ഒരു പ്രത്യേക മശീഹാജനനമെന്നോ വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ വിഭാഗീയമോ സിദ്ധാന്തപരമായി ചുരുക്കുന്നതോ ആയ വ്യാഖ്യാനം പ്രധാനപാഠത്തിലേക്ക് കൊണ്ടുവന്നിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദുഷ്കരമായ ദൈവശാസ്ത്രപ്രയോഗത്തെ വിശദീകരിച്ച് തീർക്കാതെ മൂലപാഠത്തിന്റെ അനിശ്ചിതത്വം സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
