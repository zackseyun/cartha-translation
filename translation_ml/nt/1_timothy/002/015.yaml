  to: എങ്കിലും, അവൾ മക്കളെ പ്രസവിക്കുന്നതിലൂടെ[a] രക്ഷിക്കപ്പെടും[c]—അവർ വിശ്വാസത്തിലും[b] സ്നേഹത്തിലും വിശുദ്ധിയിലും ആത്മനിയന്ത്രണത്തോടെ നിലനിൽക്കുന്നെങ്കിൽ.
