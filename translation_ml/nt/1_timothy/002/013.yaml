  source_fidelity: 'The draft accurately retains γάρ as an explanatory connective and preserves the stated temporal order: Adam first, Eve afterward. However, the passive form “രൂപിക്കപ്പെട്ടു” is not idiomatic modern standard Malayalam in this context.'
