  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: ml
  text: കാരണം, ആദാമിനെ ആദ്യം രൂപപ്പെടുത്തി; പിന്നെ ഹവ്വയെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻപുള്ള നിർദേശത്തിനുള്ള അടിസ്ഥാനമോ കാരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ വിശദീകരണശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἀδὰμ
  choice: ആദാം
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം ഉപയോഗിക്കുന്നു.
- source_word: πρῶτος
  choice: ആദ്യം
  rationale: ഹവ്വയുടെ രൂപീകരണത്തോടുള്ള കാലക്രമപരമായ മുൻഗണന വ്യക്തമാക്കുന്നു; പദവിയോ അധികാരമോ ഇതിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἐπλάσθη
  choice: രൂപിക്കപ്പെട്ടു
  rationale: πλάσσω എന്ന ക്രിയയിലെ രൂപപ്പെടുത്തുക/ആകൃതി നൽകുക എന്ന ആശയം സൂക്ഷിക്കുകയും ഉല്പത്തി സൃഷ്ടിവിവരണത്തിലെ രൂപീകരണഭാഷയെ പ്രതിധ്വനിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἶτα
  choice: പിന്നെ
  rationale: തുടർന്നുള്ള കാലക്രമം ലളിതമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: Εὕα
  choice: ഹവ്വ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ബൈബിൾരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: സഭാസംബന്ധമായ വിവാദസന്ദർഭത്തിൽ ഉല്പത്തിയിലെ സൃഷ്ടിക്രമവുമായുള്ള ബന്ധം
  choice: ആദാം ആദ്യം രൂപിക്കപ്പെട്ടു; പിന്നെ ഹവ്വയും എന്ന ലളിതമായ കാലക്രമപ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തി.
  alternative: അധികാരത്തെയോ ചുമതലാവ്യത്യാസത്തെയോ കുറിച്ചുള്ള നിഗമനം പരിഭാഷയിൽത്തന്നെ ചേർക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം രൂപീകരണക്രമം മാത്രമാണ് നേരിട്ട് പറയുന്നത്. ഈ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ദൈവശാസ്ത്രനിഗമനം ചേർക്കാതെ അതിലെ സംഘർഷവും വ്യാഖ്യാനസാധ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘രൂപിക്കപ്പെട്ടു’ സൃഷ്ടിക്കപ്പെട്ടു എന്ന വിശാലപദത്തേക്കാൾ മൂലത്തിലെ ആകൃതി നൽകുന്ന ആശയം സൂക്ഷിക്കുന്നു. ഹവ്വയ്ക്കുശേഷമുള്ള ‘യും’ ഗ്രീക്കിലെ ചുരുക്കഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
