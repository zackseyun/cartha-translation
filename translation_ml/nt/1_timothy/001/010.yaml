  to: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവർക്കും, പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാർക്കും,[a] മനുഷ്യരെ അടിമകളാക്കി വിൽക്കുന്നവർക്കും, നുണ പറയുന്നവർക്കും, കള്ളസത്യം ചെയ്യുന്നവർക്കും, ആരോഗ്യകരമായ ഉപദേശത്തിന് എതിരായ മറ്റെന്തെങ്കിലും ഉണ്ടെങ്കിൽ അതിനും വേണ്ടിയുള്ളതാണ്.
