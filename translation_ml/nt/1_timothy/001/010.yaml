id: 1TI.1.10
reference: 1 Timothy 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: ml
  text: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവർക്കും, പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാർക്കും,[a] മനുഷ്യരെ അടിമകളാക്കി വിൽക്കുന്നവർക്കും, നുണ പറയുന്നവർക്കും, കള്ളസത്യം ചെയ്യുന്നവർക്കും, ആരോഗ്യകരമായ ഉപദേശത്തിന് എതിരായ മറ്റെന്തെങ്കിലും ഉണ്ടെങ്കിൽ അതിനും വേണ്ടിയുള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സ്വവർഗ ലൈംഗികപ്രവൃത്തി ചെയ്യുന്ന പുരുഷന്മാർ.” ἀρσενοκοῖται എന്ന ഗ്രീക്ക് പദം അപൂർവമാണ്; അതിന്റെ കൃത്യമായ വ്യാപ്തി ചർച്ചചെയ്യപ്പെടുന്നുണ്ടെങ്കിലും, അത് പുരുഷന്മാർ തമ്മിലുള്ള ലൈംഗികപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവർ
  rationale: പദം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവരെ വിശാലമായി സൂചിപ്പിക്കുന്നു; വിവാഹപൂർവ ലൈംഗികബന്ധത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀρσενοκοίταις
  choice: പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാർ
  rationale: അപൂർവവും പരിധിയിൽ ചർച്ചചെയ്യപ്പെടുന്നതുമായ ഈ പദത്തിന്റെ പുരുഷ-പുരുഷ ലൈംഗികപ്രവൃത്തിയെ സംബന്ധിക്കുന്ന അർഥം, ആധുനിക ലൈംഗിക സ്വത്വവിഭാഗങ്ങൾ വാചകത്തിലേക്ക് കൊണ്ടുവരാതെ പ്രവൃത്തികേന്ദ്രിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀνδραποδισταῖς
  choice: മനുഷ്യരെ അടിമകളാക്കി വിൽക്കുന്നവർ
  rationale: ആളുകളെ പിടിച്ചോ കൈവശപ്പെടുത്തിയോ അടിമകളാക്കി വ്യാപാരം ചെയ്യുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്; വെറും തട്ടിക്കൊണ്ടുപോകുന്നവർ എന്നതിനെക്കാൾ പൂർണമായ അർഥം നൽകുന്നു.
- source_word: ψεύσταις
  choice: കള്ളം പറയുന്നവർ
  rationale: നുണ പറയുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ἐπιόρκοις
  choice: കള്ളസത്യം ചെയ്യുന്നവർ
  rationale: സത്യംചെയ്ത് അസത്യം പറയുകയോ സത്യപ്രതിജ്ഞ ലംഘിക്കുകയോ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: καὶ εἴ τι ἕτερον
  choice: മറ്റെന്തിനും
  rationale: പട്ടികയിൽ പറയാത്ത സമാനമായ കാര്യങ്ങളിലേക്കും പ്രയോഗം വ്യാപിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ആരോഗ്യകരമായ ഉപദേശം
  rationale: ὑγιαίνω എന്നതിലെ ആരോഗ്യത്തിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട്, അമിതമായ സഭാസാങ്കേതിക ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: ἀντίκειται
  choice: എതിരായ
  rationale: വിരോധത്തിലോ വൈരുധ്യത്തിലോ നിൽക്കുന്നു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ἀρσενοκοίταις എന്ന പദത്തിന്റെ സിദ്ധാന്തപരമായും നിഘണ്ടുപരമായും ചർച്ചചെയ്യപ്പെടുന്ന വിവർത്തനം
  choice: പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാർ
  alternative: സ്വവർഗ ലൈംഗികപ്രവൃത്തി ചെയ്യുന്ന പുരുഷന്മാർ
  rationale: ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്ന പുരുഷ-പുരുഷ ലൈംഗികപ്രവൃത്തി വ്യക്തമാക്കുമ്പോഴും ആധുനിക സ്വത്വവിഭാഗം പാഠത്തിൽ ചേർക്കാതിരിക്കാൻ പ്രവൃത്തികേന്ദ്രിത വിവർത്തനം തിരഞ്ഞെടുത്തു. പദത്തിന്റെ കൃത്യമായ വ്യാപ്തി ചർച്ചചെയ്യപ്പെടുന്നതിനാൽ മറ്റൊരു സാധാരണ വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലവാക്യത്തിൽ ഈ പട്ടിക മുൻവാക്യത്തിലെ ‘നിയമം ഏർപ്പെടുത്തിയിരിക്കുന്നത്’ എന്ന ആശ്രിതഘടന തുടരുന്നതിനാൽ, ‘വേണ്ടിയുള്ളതാണ്’ എന്നു നൽകി അതിന്റെ വ്യാകരണബന്ധം സൂക്ഷിച്ചു. ലൈംഗികവും അടിമവ്യാപാരവുമായി ബന്ധപ്പെട്ട പദങ്ങളിൽ വ്യക്തത പാലിച്ചെങ്കിലും അപമാനകരമോ ആധുനിക സ്വത്വം ചുമത്തുന്നതോ ആയ ഭാഷ ഒഴിവാക്കി.
