id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: ml
  text: ധന്യനായ ദൈവത്തിന്റെ മഹത്ത്വത്തിന്റെ സുവിശേഷപ്രകാരം—ആ സുവിശേഷം എനിക്കാണ് ഏൽപ്പിക്കപ്പെട്ടത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാവഹാരികമായി: ‘ധന്യനായ ദൈവത്തിന്റെ മഹത്തായ സുവിശേഷം.’'
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: പ്രകാരമാണ്
  rationale: മുൻവാക്യത്തിലെ ആശയത്തെ അളക്കുന്ന മാനദണ്ഡമോ അനുരൂപതയോ സൂചിപ്പിക്കുന്ന κατά എന്ന പദത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ θεοലോഗിക ഭാരവും മലയാള ബൈബിൾഭാഷയിലെ പരിചിതത്വവും നിലനിർത്തുന്നു.
- source_word: τῆς δόξης
  choice: മഹത്ത്വത്തിന്റെ
  rationale: ഗ്രീക്കിലെ സമ്ബന്ധികാവിഭക്തിഘടന നിലനിർത്തി, ഇത് വിവരണാത്മകമാണോ ഉടമസ്ഥതാസൂചകമാണോ എന്ന യഥാർഥ വ്യാഖ്യാനസാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: μακαρίου
  choice: ധന്യനായ
  rationale: ദൈവത്തെ വിശേഷിപ്പിക്കുമ്പോൾ μακάριος സൂചിപ്പിക്കുന്ന അനുഗൃഹീതവും പരമാനന്ദപൂർണവുമായ അവസ്ഥയെ മാന്യമായി അറിയിക്കുന്നു; ‘സന്തുഷ്ടനായ’ എന്നത് ഇവിടെ ലഘുവായി തോന്നാം.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: θεός എന്ന പദത്തിന്റെ സമ്ബന്ധികാവിഭക്തിരൂപത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: ὃ
  choice: ആ സുവിശേഷം
  rationale: ബന്ധസർവനാമത്തിന്റെ പൂർവപദം εὐαγγέλιον ആണെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπιστεύθην ἐγώ
  choice: എന്നെ ഭരമേൽപ്പിച്ചിരിക്കുന്നു
  rationale: ഇവിടെ πιστεύω-യുടെ കർമണിപ്രയോഗം ‘വിശ്വസിക്കുക’ എന്നല്ല, ഒരു ഉത്തരവാദിത്വം ഏൽപ്പിക്കപ്പെടുക എന്ന അർഥത്തിലാണ്. മലയാളത്തിൽ സുവിശേഷം വ്യക്തിയെ ഭരമേൽപ്പിച്ചിരിക്കുന്നു എന്ന ഘടന സ്വാഭാവികമാണ്; ἐγώ നൽകുന്ന വ്യക്തിപരമായ ഊന്നലും ‘എന്നെ’ എന്നതിൽ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ എന്നതിലെ സമ്ബന്ധികാവിഭക്തിബന്ധം
  choice: ധന്യനായ ദൈവത്തിന്റെ മഹത്ത്വത്തിന്റെ സുവിശേഷം
  alternative: ധന്യനായ ദൈവത്തിന്റെ മഹത്തായ സുവിശേഷം
  rationale: മുഖ്യവാചകത്തിൽ ഗ്രീക്കിലെ ‘മഹത്ത്വത്തിന്റെ സുവിശേഷം’ എന്ന ഘടന നിലനിർത്തുന്നത് അതിന്റെ ബന്ധം മുൻകൂട്ടി adjectival ആയി തീർപ്പാക്കാതിരിക്കാൻ സഹായിക്കുന്നു. കൂടുതൽ വ്യാവഹാരികമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐπιστεύθην എന്നതിന്റെ അർഥം
  choice: എന്നെ ഭരമേൽപ്പിച്ചിരിക്കുന്നു
  alternative: ഞാൻ വിശ്വസിച്ചു
  rationale: ഈ സന്ദർഭത്തിലെ കർമണിരൂപം ഒരു ദൗത്യമോ നിക്ഷേപമോ ഏൽപ്പിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ഞാൻ വിശ്വസിച്ചു’ എന്നത് വ്യാകരണപരവും സന്ദർഭപരവുമായി യോജിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മഹത്ത്വത്തിന്റെ സുവിശേഷം’ എന്ന അല്പം ഔപചാരികമായ ഘടന ഉറവിടത്തിലെ യഥാർഥ സമ്ബന്ധികാവിഭക്തി നിലനിർത്താൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു; വ്യാവഹാരിക രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
