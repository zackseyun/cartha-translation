id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: ml
  text: എനിക്ക് ശക്തി നൽകിയ നമ്മുടെ കർത്താവായ മശീഹാ യേശുവിനു[a] ഞാൻ നന്ദി പറയുന്നു; എന്നെ വിശ്വസ്തനെന്നു കണക്കാക്കി ശുശ്രൂഷയ്ക്കായി[b] നിയമിച്ചതിനാലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ കർത്താവായ ക്രിസ്തുയേശുവിനു.’ ഗ്രീക്ക് സ്ഥാനപ്പേരായ Χριστός എന്നത് അർഥം പരിഭാഷപ്പെടുത്തി ‘മശീഹാ’ എന്നോ പരമ്പരാഗതമായി ലിപ്യന്തരം ചെയ്ത് ‘ക്രിസ്തു’ എന്നോ നൽകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘സേവനത്തിനായി’ അല്ലെങ്കിൽ ‘സേവനത്തിലേക്ക്.’ ഗ്രീക്ക് διακονία എന്ന പദം സേവനത്തെയോ ശുശ്രൂഷയെയോ വിശാലമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: ഞാൻ നന്ദി പറയുന്നു
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗം നന്ദി പ്രകടിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ക്രിയാത്മകവുമായ പ്രയോഗമാണിത്.
- source_word: ἐνδυναμώσαντί με
  choice: എനിക്കു ശക്തി നൽകിയ
  rationale: മശീഹാ യേശു പൗലോസിനെ പ്രാപ്തനാക്കിയതും ബലപ്പെടുത്തിയതുമായ അർഥം വ്യക്തമായി നൽകുന്നു; പ്രത്യേകതരം ആത്മീയ ശക്തീകരണം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിനു
  rationale: Χριστός ഇവിടെ അർഥസമ്പന്നമായ സ്ഥാനപ്പേരായി നിലകൊള്ളുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു; ദത്തിവ് ‘യേശുവിനു’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു.
- source_word: κυρίῳ ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരിന്റെ അധികാരാർഥവും പുതിയനിയമത്തിലെ പരിചിത പ്രയോഗവും ‘കർത്താവ്’ നിലനിർത്തുന്നു.
- source_word: πιστόν
  choice: വിശ്വസ്തനെന്നു
  rationale: ഏൽപ്പിക്കപ്പെട്ട സേവനത്തിൽ ആശ്രയിക്കാവുന്നവൻ, വിശ്വസനീയൻ എന്ന ആശയം ‘വിശ്വസ്തൻ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἡγήσατο
  choice: കണക്കാക്കി
  rationale: ഒരാളെ അങ്ങനെ കരുതുക അഥവാ പരിഗണിക്കുക എന്ന അർഥം നൽകുന്നു; ന്യായവിധിയുടെ അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: θέμενος
  choice: നിയമിച്ചു
  rationale: അക്ഷരാർഥം ‘വെച്ചു’ എന്നാണെങ്കിലും, സേവനച്ചുമതല ഏൽപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘നിയമിച്ചു’ പ്രവർത്തനാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς διακονίαν
  choice: ശുശ്രൂഷയ്ക്കു
  rationale: διακονίαയുടെ സേവനം/ശുശ്രൂഷ എന്ന വിശാല അർഥം നിലനിർത്തുകയും പിന്നീട് രൂപപ്പെട്ട പ്രത്യേക വൈദികപദവി ഇതിൽ ആരോപിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: സ്ഥാനപ്പേരിന്റെ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന അർഥം സജീവമായി നിലനിർത്തുന്നു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: പൗലോസിനെ ശുശ്രൂഷയിൽ ആക്കിയതിന്റെ സൂക്ഷ്മാർഥം
  choice: ശുശ്രൂഷയ്ക്കു നിയമിച്ചു
  alternative: സേവനത്തിൽ ആക്കി
  rationale: മശീഹാ പൗലോസിന് ചുമതല നൽകിയ പ്രവർത്തനം വ്യക്തമാക്കുന്നു; എന്നാൽ പിന്നീടുള്ള സഭാപദവികളുടെ ഘടന വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യബന്ധം മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; കാരണംബന്ധം വ്യക്തമായി നിലനിർത്തി. മതവിഭാഗവിശേഷമായ പദപ്രയോഗങ്ങളും അനാവശ്യമായ വൈദിക ഔദ്യോഗികതയും ഒഴിവാക്കി.
