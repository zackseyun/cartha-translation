id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: ml
  text: 'ഈ വചനം വിശ്വസനീയവും പൂർണമായ സ്വീകരണം അർഹിക്കുന്നതുമാണ്: പാപികളെ രക്ഷിക്കാനായി മശീഹയായ യേശു[a] ലോകത്തിലേക്കു വന്നു; അവരിൽ ഒന്നാമൻ[b] ഞാനാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുയേശു.’
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘അവരിൽ ഏറ്റവും വലിയ പാപി’ അല്ലെങ്കിൽ ‘അവരിൽ മുഖ്യൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: ഈ വചനം വിശ്വസനീയമാണ്
  rationale: ഇടയലേഖനങ്ങളിലെ സൂത്രവാക്യത്തിൽ ὁ λόγος വിശ്വസിക്കാവുന്ന ഒരു സംക്ഷിപ്ത പ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ഈ വചനം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: പൂർണമായി സ്വീകരിക്കാൻ യോഗ്യം
  rationale: ἀποδοχή സ്വീകരിക്കലിനെയും πάσης അതിന്റെ സമ്പൂർണതയെയും സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം അർഥവും സ്വാഭാവികതയും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: തുടർന്നുള്ള പ്രസ്താവനയായി കോളൻകൊണ്ട് സൂചിപ്പിച്ചു
  rationale: ഇവിടെ ὅτι കാരണം അറിയിക്കുന്നതല്ല, വിശ്വസനീയമായ വചനത്തിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതാണ്. മലയാളത്തിൽ കോളൻ ഉപയോഗിച്ച് നേരിട്ട് പ്രസ്താവിക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: Χριστὸς Ἰησοῦς
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവെന്ന പദവിയുടെ അർഥം വഹിക്കുന്നു; ‘മശീഹയായ യേശു’ ആ പദവിസ്വഭാവം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു വന്നു
  rationale: ചലനവും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ അനുരണനവും അനാവശ്യമായ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്ന നേരായ വിവർത്തനമാണിത്.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: പാപികളെ രക്ഷിക്കാനായി
  rationale: സാരവത്തായ വിശേഷണമായ ἁμαρτωλούς ‘പാപികൾ’ എന്നും രക്ഷാസംബന്ധിയായ σῶσαι ‘രക്ഷിക്കുക’ എന്നും കൃത്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: അവരിൽ ഒന്നാമൻ ഞാനാണ്
  rationale: πρῶτος എന്നതിന്റെ ‘ഒന്നാമൻ/മുഖ്യൻ’ എന്ന സ്ഥാനരൂപകം നിലനിർത്തുകയും ‘ഏറ്റവും മോശക്കാരൻ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു. ‘ഞാനാണ്’ ἐγώയുടെ ഊന്നൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ വിശ്വാസപ്രഖ്യാപനത്തിൽ Χριστός പദവിയായി മനസ്സിലാക്കാവുന്നതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ നൽകി; പേര് പോലെയുള്ള പരമ്പരാഗത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: πρῶτος എന്ന പദത്തിന്റെ മൂല്യനിർണയപരമായ അർഥം
  choice: ഒന്നാമൻ
  alternative: ഏറ്റവും വലിയ പാപി / മുഖ്യൻ
  rationale: മൂലപദം സ്ഥാനക്രമത്തിൽ ‘ഒന്നാമൻ’ അല്ലെങ്കിൽ ‘മുഖ്യൻ’ എന്ന അർഥം നൽകാം. സന്ദർഭത്തിൽ ‘ഏറ്റവും മോശക്കാരൻ’ എന്ന ആശയം സാധ്യമെങ്കിലും അതിനെ മാത്രം നിർബന്ധിക്കാതെ യഥാർഥമായ അർഥവ്യാപ്തി നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘വചനം’, ‘പാപികൾ’, ‘രക്ഷിക്കുക’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
