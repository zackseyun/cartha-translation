  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: ml
  text: ചിലർ ഇവയിൽനിന്ന് ലക്ഷ്യംതെറ്റി, വ്യർഥസംസാരത്തിലേക്ക് വഴിതിരിഞ്ഞിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇവയിൽനിന്ന് വ്യതിചലിച്ച്.’ ഈ ക്രിയയ്ക്ക് ലക്ഷ്യം തെറ്റുക, അതിൽ എത്താതിരിക്കുക, അതിൽനിന്ന് വ്യതിചലിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
