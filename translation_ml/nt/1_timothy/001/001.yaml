lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: ആദിമ ക്രൈസ്തവസമൂഹത്തിലെ ഔദ്യോഗിക ദൗത്യസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതമായ പദം; പൊതുവായ ‘ദൂതൻ’ എന്നതിനെക്കാൾ പ്രത്യേക അർഥം നിലനിർത്തുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്ന അഭിഷിക്തപദവി അർഥസഹിതമായി ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി, Ἰησοῦ എന്ന പേര് ‘യേശു’ എന്നു ലിപ്യന്തരിച്ചു. ‘യായ’ ചേർക്കുന്നത് ആ പദവിയും പേരും തമ്മിലുള്ള ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατ’ ἐπιταγήν
  choice: കല്പനപ്രകാരം
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ἐπιταγήയുടെ ഭാവവും κατά സൂചിപ്പിക്കുന്ന അടിസ്ഥാനമോ അനുസരണമോ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: നമ്മുടെ രക്ഷകനായ ദൈവത്തിന്റെ
  rationale: σωτήρ ദൈവത്തെ വിശേഷിപ്പിക്കുന്നുവെന്ന അപ്പോസിഷണൽ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘രക്ഷകനായ’ എന്നു നൽകുന്നു.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: നമ്മുടെ പ്രത്യാശയായ മശീഹയായ യേശുവിന്റെ
  rationale: ‘നമ്മുടെ പ്രത്യാശ’ മശീഹയായ യേശുവിനെ തിരിച്ചറിയിക്കുന്ന അപ്പോസിഷണൽ വിശേഷണമാണെന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തുന്നു.
- source_word: ἐλπίδος
  choice: പ്രത്യാശ
  rationale: പ്രതീക്ഷയും ആശ്രയപൂർവമായ ഉറപ്പും ഉൾക്കൊള്ളുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്ഥാപിത മലയാളപദം.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവി എന്ന അർഥം സജീവമായതിനാൽ ‘അഭിഷിക്തൻ’ എന്ന ആശയം വഹിക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു; മലയാള വായനക്കാർക്ക് പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ‘നമ്മുടെ പ്രത്യാശ’ എന്നതിന്റെ ബന്ധം
  choice: മശീഹയായ യേശുവിനെ വിശേഷിപ്പിക്കുന്ന അപ്പോസിഷണൽ പ്രയോഗം
  alternative: ‘നമ്മുടെ പ്രത്യാശയായിരിക്കുന്ന മശീഹയായ യേശു’ എന്ന വിശദീകരിച്ച രൂപം
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ തിരിച്ചറിയിക്കൽ നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തത നൽകുന്നു; അനാവശ്യമായി ഉപവാക്യമാക്കി വികസിപ്പിക്കുന്നില്ല.
- issue: കല്പനയുടെ അധികാരസ്രോതസ്സുകൾ
  choice: ദൈവത്തെയും മശീഹയായ യേശുവിനെയും ബന്ധിപ്പിക്കുന്ന ഏക സംയുക്ത കല്പന
  alternative: ദൈവത്തിന്റെ കല്പനയെ മാത്രം മുൻനിർത്തി രണ്ടാമത്തെ പദസമുച്ചയം വേർതിരിക്കുന്ന വായന
  rationale: καί ചേർക്കുന്ന രണ്ട് ജനിറ്റീവ് പദസമുച്ചയങ്ങളും ἐπιταγήν എന്ന നാമത്തോടു സമാന്തരമായി ബന്ധപ്പെടുന്നതാണ് ഏറ്റവും സ്വാഭാവികമായ വ്യാകരണവായന.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ അഭിവാദനവാക്യത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനം അർധവിരാമമല്ല, കോമ നിലനിർത്തി. ദീർഘമായ ജനിറ്റീവ് ഘടന മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി കല്പനയെ സൂചിപ്പിക്കുന്ന ഭാഗം ആദ്യം കൊണ്ടുവന്നു; അർഥബന്ധം മാറ്റിയിട്ടില്ല.
