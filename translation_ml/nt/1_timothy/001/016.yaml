id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: ml
  text: എന്നാൽ, പാപികളിൽ ഒന്നാമനായ എന്നിൽ മശീഹായ യേശു[a] തന്റെ സകല ദീർഘക്ഷമയും പ്രകടമാക്കേണ്ടതിനും, നിത്യജീവനിലേക്കായി അവനിൽ വിശ്വസിക്കാനിരിക്കുന്നവർക്ക് ഞാൻ ഒരു മാതൃകയായിരിക്കേണ്ടതിനുമാണ് എനിക്കു കരുണ ലഭിച്ചത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുയേശു.’ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേരിന് ‘അഭിഷിക്തൻ’ അഥവാ ‘മശീഹാ’ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: എനിക്കു കരുണ ലഭിച്ചത്
  rationale: ἐλεάω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; കരുണ കാട്ടിയ പ്രവർത്തകനെ ഗ്രീക്ക് വാക്യം ഇവിടെ നേരിട്ട് പറയാത്തതും നിലനിർത്തുന്നു.
- source_word: πρώτῳ
  choice: അവരിൽ ഒന്നാമനായ
  rationale: മുൻവാക്യത്തിലെ ‘പാപികൾ’ എന്ന പരാമർശത്തിലേക്കാണ് ഇത് തിരിച്ചുപോകുന്നത്. ‘ഏറ്റവും ദുഷ്ടനായ’ എന്നു വ്യാഖ്യാനിച്ച് ശക്തിപ്പെടുത്താതെ πρώτῳ എന്ന പദത്തിന്റെ ‘ഒന്നാമൻ/മുഖ്യൻ’ എന്ന ഭാവം സൂക്ഷിക്കുന്നു.
- source_word: ἐνδείξηται
  choice: പ്രകടമാക്കേണ്ടതിനും
  rationale: ἵνα-യോടുകൂടിയ ഉദ്ദേശ്യസൂചക പ്രയോഗവും പരസ്യമായി വെളിപ്പെടുത്തുക/കാണിക്കുക എന്ന ക്രിയാഭാവവും ഒരുമിച്ച് നൽകുന്നു.
- source_word: Χριστὸς Ἰησοῦς
  choice: ക്രിസ്തുയേശു
  rationale: മലയാളത്തിലെ സ്ഥാപിതവും സ്വാഭാവികവുമായ ബൈബിൾ പ്രയോഗം; Χριστός എന്ന അഭിഷിക്തസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἅπασαν μακροθυμίαν
  choice: തന്റെ പൂർണമായ ദീർഘക്ഷമ
  rationale: ἅπασαν സൂചിപ്പിക്കുന്ന സമഗ്രതയും μακροθυμίαയിലെ ദീർഘമായി സഹിച്ചുനിൽക്കുന്ന ക്ഷമയും നിലനിർത്തുന്നു.
- source_word: ὑποτύπωσιν
  choice: ഒരു മാതൃക
  rationale: പിന്നാലെ വരുന്ന വിശ്വാസികൾക്കായി കാട്ടിവെക്കുന്ന മാതൃകയെയോ രൂപരേഖയെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: τῶν μελλόντων πιστεύειν
  choice: വിശ്വസിക്കാനിരിക്കുന്നവർക്ക്
  rationale: പൗലോസിന് കരുണ ലഭിച്ച സമയത്തുനിന്നു നോക്കിയുള്ള ഭാവികാലസൂചന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: അവനിൽ വിശ്വസിക്കുക
  rationale: ἐπί + ദത്തിവ് സഹിതമുള്ള πιστεύωയുടെ വ്യക്തിപരമായ ആശ്രയവും വിശ്വാസവും മലയാളത്തിലെ പതിവായ പുതിയനിയമ പ്രയോഗത്തിൽ നൽകുന്നു.
- source_word: εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനിലേക്കായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യദിശ നിലനിർത്തുന്നു; ‘നിത്യജീവൻ നേടാൻ’ എന്നു ഫലം കൂടുതൽ നിർണ്ണയിച്ച് വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: പ്രധാന പാഠത്തിൽ ‘ക്രിസ്തുയേശു’; അടിക്കുറിപ്പിൽ ‘മശീഹായ യേശു’
  alternative: മശീഹായ യേശു
  rationale: ‘ക്രിസ്തുയേശു’ ആധുനിക മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്വാഭാവികവും തിരിച്ചറിയാവുന്നതുമാണ്; എന്നാൽ Χριστός ഒരു സ്ഥാനപ്പേരാണെന്ന അർഥം നഷ്ടപ്പെടാതിരിക്കാൻ പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: കരുണയുടെ പ്രവർത്തകനും ക്ഷമ പ്രകടമാക്കുന്നവനും
  choice: കരുണയുടെ പ്രവർത്തകനെ വ്യക്തമാക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തി; ക്ഷമ പ്രകടമാക്കുന്നത് ക്രിസ്തുയേശുവാണെന്ന് വ്യക്തമായി പറഞ്ഞു
  alternative: പിതാവായ ദൈവം കരുണ കാട്ടി എന്ന് തുറന്നു പറയുക
  rationale: ἠλεήθην പ്രവർത്തകനെ പേരെടുത്ത് പറയുന്നില്ല; അതേസമയം ഉദ്ദേശ്യവാക്യം ക്രിസ്തുയേശുവിനെ ദീർഘക്ഷമ പ്രകടമാക്കുന്നവനായി വ്യക്തമായി അവതരിപ്പിക്കുന്നു. വിവർത്തനം ഈ വ്യത്യാസം ലയിപ്പിക്കുന്നില്ല.
- issue: πρώτῳ എന്നതിന്റെ അർഥം
  choice: അവരിൽ ഒന്നാമനായ
  alternative: പാപികളിൽ ഏറ്റവും ദുഷ്ടനായ
  rationale: സന്ദർഭം പാപികളിൽ മുഖ്യൻ എന്ന ആശയം നൽകുന്നുവെങ്കിലും, ഈ വാക്യത്തിലെ പദം നേരിട്ട് ‘ഏറ്റവും ദുഷ്ടൻ’ എന്നു പറയുന്നില്ല. അതിനാൽ അർഥപരമായ സംഘർഷം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ദീർഘക്ഷമ’ എന്ന അല്പം ഔപചാരികമായ പദം μακροθυμίαയിലെ ദീർഘകാല സഹനത്തിന്റെ ഭാവം കാത്തുസൂക്ഷിക്കാൻ ഉപയോഗിച്ചു. പ്രധാന പാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും [a], [b] എന്ന രൂപത്തിൽ ചേർത്തിരിക്കുന്നു.
