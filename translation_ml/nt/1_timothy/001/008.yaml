  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: ml
  text: എന്നാൽ, ഒരാൾ ന്യായപ്രമാണത്തെ ന്യായപ്രമാണാനുസൃതമായി[a] ഉപയോഗിക്കുന്നുവെങ്കിൽ, ന്യായപ്രമാണം നല്ലതാണെന്ന് നാം അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ശരിയായ വിധത്തിൽ” അല്ലെങ്കിൽ “നിയമപ്രകാരം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: നാം അറിയുന്നു
  rationale: οἶδα എന്ന പൂർണരൂപത്തിന് ഇവിടെ വർത്തമാനകാല അർഥമാണ്; ഉറച്ച പൊതുവിജ്ഞാനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ മുൻവാക്യങ്ങളോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും സൂചിപ്പിക്കുന്നു; ശക്തമായ എതിർപ്പ് വരുത്താതെ ‘എന്നാൽ’ അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: καλὸς ὁ νόμος
  choice: ന്യായപ്രമാണം … നല്ലതാണ്
  rationale: καλός എന്നതിന്റെ വിശാലമായ അനുകൂല-നൈതിക അർഥം ‘നല്ലത്’ നിലനിർത്തുന്നു; ὁ νόμος എന്നതിനെ അതിന്റെ കൃത്യമായ പരിധി നിർണയിക്കാതെ ‘ന്യായപ്രമാണം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἐάν τις
  choice: … ഉപയോഗിച്ചാൽ
  rationale: ഗ്രീക്കിലെ പൊതുവായ ഏകവചന കർത്താവ് മലയാളത്തിലെ സോപാധിക ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘ആരെങ്കിലും’ എന്ന് വ്യക്തമാക്കുന്നതിനെക്കാൾ ഇതു ചൊല്ലിന്റെ പൊതുസ്വഭാവം സുതാര്യമായി നൽകുന്നു.
- source_word: αὐτῷ … χρῆται
  choice: അതു … ഉപയോഗിച്ചാൽ
  rationale: αὐτῷ ന്യായപ്രമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; χράομαι എന്നതിന് ‘ഉപയോഗിക്കുക’ എന്നത് ലളിതവും കൃത്യവുമായ പ്രയോഗമാണ്.
- source_word: νομίμως
  choice: ന്യായാനുസൃതമായി
  rationale: നിയമത്തിനോ ശരിയായ മാനദണ്ഡത്തിനോ അനുസൃതമായി എന്ന അർഥവും νόμος–νομίμως എന്ന പദബന്ധവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ νόμος എന്നതിന്റെ പരിധി
  choice: ന്യായപ്രമാണം
  alternative: മോശെയുടെ ന്യായപ്രമാണം; നിയമം പൊതുവിൽ
  rationale: സന്ദർഭത്തിൽ മോശെയുടെ ന്യായപ്രമാണം പ്രത്യേകമായി ഉദ്ദേശിച്ചിരിക്കാമെങ്കിലും ഗ്രീക്ക് വാചകം അതിനെ അങ്ങനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പ്രധാനവാചകം വ്യാഖ്യാനപരമായി പരിധി ചുരുക്കുന്നില്ല.
- issue: νομίμως എന്നതിലെ നിയമബന്ധവും ശരിയായ ഉപയോഗവും
  choice: ന്യായാനുസൃതമായി
  alternative: ശരിയായ വിധത്തിൽ; നിയമവിധേയമായി
  rationale: ന്യായപ്രമാണത്തെ അതിനനുസൃതമായി ഉപയോഗിക്കണമെന്ന പദപ്രയോഗം നിലനിർത്തുന്നു; അതേസമയം ‘ശരിയായി’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘നിയമം’ എന്നതിനെക്കാൾ ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവും നിർദ്ദിഷ്ടവുമായ ‘ന്യായപ്രമാണം’ തെരഞ്ഞെടുത്തു; എന്നാൽ ‘മോശെയുടെ’ എന്ന് ചേർത്ത് അർഥപരിധി ചുരുക്കിയിട്ടില്ല.
