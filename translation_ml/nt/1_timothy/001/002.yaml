id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ml
  text: 'വിശ്വാസത്തിൽ എന്റെ യഥാർഥ[a] മകനായ തിമൊഥെയൊസിന്: പിതാവായ ദൈവത്തിൽനിന്നും നമ്മുടെ കർത്താവായ മശീഹാ യേശുവിൽനിന്നും കൃപയും കരുണയും സമാധാനവും ഉണ്ടാകട്ടെ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “വിശ്വാസത്തിലെ യഥാർഥ സന്താനം.” ഇവിടെ ആത്മീയബന്ധമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: b
    text: '“മശീഹാ യേശു” എന്നതിന്റെ പരമ്പരാഗത വിവർത്തനം: “ക്രിസ്തുയേശു.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: γνησίῳ
  choice: യഥാർഥ
  rationale: തിമൊഥെയൊസുമായുള്ള പൗലൊസിന്റെ ആത്മീയബന്ധത്തിന്റെ ആധികാരികത സൂചിപ്പിക്കുന്നു; ജൈവിക പിതൃത്വം അർഥമാക്കുന്നില്ല.
- source_word: τέκνῳ
  choice: മകൻ
  rationale: തിമൊഥെയൊസ് പുരുഷനായതിനാലും ആത്മീയ പിതൃപുത്രബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നതിനാലും ‘മകൻ’ തിരഞ്ഞെടുത്തു; മൂലപദത്തിന്റെ വിശാലമായ ‘സന്താനം/കുട്ടി’ എന്ന അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- source_word: ἐν πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: പങ്കിടുന്ന ക്രിസ്തീയവിശ്വാസത്തിന്റെ മണ്ഡലത്തെയും വ്യക്തിപരമായ വിശ്വാസത്തെയും പൂർണമായി വേർതിരിക്കാതെ മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലൊസിന്റെ അഭിവാദനങ്ങളിൽ പതിവായ, സ്ഥാപിതവും കൃത്യവുമായ മലയാള പദം.
- source_word: ἔλεος
  choice: കരുണ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുകയും ഈ ലേഖനത്തിലെ പ്രത്യേക അഭിവാദനക്രമം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: അഭിവാദനത്തിലെ ദൈവദത്തമായ സമഗ്രക്ഷേമത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ വിവർത്തനം.
- source_word: θεοῦ πατρὸς
  choice: പിതാവായ ദൈവം
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായി പിതാവെന്ന ദൈവവിശേഷണം പ്രകടിപ്പിക്കുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ പദവിയായി ഗ്രഹിച്ച് അതിന്റെ അർഥമായ ‘മശീഹാ’ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യാകരണരൂപത്തിൽ നൽകി.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ സ്ഥാപിതമായ മലയാള വിവർത്തനവും ഈ വാക്യത്തിലെ ക്രിസ്തുവിനെക്കുറിച്ചുള്ള പ്രാധാന്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐν πίστει എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി
  choice: വിശ്വാസത്തിൽ
  alternative: വിശ്വാസസമൂഹത്തിൽ / വിശ്വാസം നിമിത്തം
  rationale: പങ്കിടുന്ന വിശ്വാസത്തിന്റെ മണ്ഡലമാണോ വിശ്വസിക്കുന്ന പ്രവൃത്തിയാണോ എന്നത് മൂലത്തിൽ പൂർണമായി നിർണയിക്കപ്പെടുന്നില്ല; ‘വിശ്വാസത്തിൽ’ ഈ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- issue: Χριστοῦ Ἰησοῦ എന്നതിന്റെ വിവർത്തനം
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός എന്നത് ഇവിടെ വെറും പേരായി കാണാതെ പദവിയുടെ അർഥത്തോടെ വിവർത്തനം ചെയ്തു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: ആശംസയിലെ ക്രിയയുടെ പൂരണം
  choice: ഉണ്ടാകട്ടെ
  alternative: ക്രിയ ചേർക്കാതെ നാമപദങ്ങൾ മാത്രം നൽകുക
  rationale: ഗ്രീക്കിൽ ക്രിയ പ്രകടമല്ലെങ്കിലും മലയാള ആശംസാവാക്യം പൂർണമാകാൻ ‘ഉണ്ടാകട്ടെ’ സ്വാഭാവികമായി പൂരിപ്പിച്ചു; ആശയത്തിൽ പുതുമ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ലേഖനാഭിവാദനശൈലി ഉപയോഗിച്ചു. ‘മശീഹയായ യേശു’ പദവിയുടെ അർഥം തുറന്നുകാട്ടുന്നു; ‘കൃപ, കരുണ, സമാധാനം’ എന്ന സ്ഥാപിത ദൈവശാസ്ത്രപരമായ പദക്രമം നിലനിർത്തി.
