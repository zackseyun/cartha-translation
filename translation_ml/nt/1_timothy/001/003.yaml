id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: ml
  text: ഞാൻ മക്കെദോന്യയിലേക്കു പോകുമ്പോൾ എഫെസൊസിൽ തുടരാൻ നിന്നോട് അഭ്യർഥിച്ചതുപോലെ, വ്യത്യസ്തമായ ഉപദേശം പഠിപ്പിക്കരുതെന്ന് ചിലരോട് നീ നിർദേശിക്കേണ്ടതിന്[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ചിലരോട് കല്പിക്കേണ്ടതിന്.”
    reason: παραγγέλλω എന്ന ക്രിയയ്ക്ക് ‘നിർദേശിക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ, അധികാരപൂർവമായ ‘കല്പിക്കുക’ എന്ന അർഥവും ഇവിടെ സാധ്യമാണ്.
lexical_decisions:
- source_word: Καθὼς
  choice: …അഭ്യർഥിച്ചതുപോലെ
  rationale: മുമ്പ് നടത്തിയ അഭ്യർഥനയെ ഓർമിപ്പിക്കുന്ന താരതമ്യാത്മകവും പുനരാരംഭാത്മകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρεκάλεσά
  choice: അഭ്യർഥിച്ചു
  rationale: παρακαλέω ഇവിടെ ഗൗരവമുള്ള അപേക്ഷയെയോ പ്രേരണയെയോ സൂചിപ്പിക്കുന്നു; ‘അഭ്യർഥിച്ചു’ എന്നത് അതിനെ കല്പനയായി അതിശക്തമാക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: προσμεῖναι
  choice: തുടരാൻ
  rationale: ഒരു സ്ഥലത്ത് തുടർന്നും താമസിക്കുക എന്ന അർഥം സന്ദർഭോചിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν Ἐφέσῳ
  choice: എഫെസൊസിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പരിചിതമായ മലയാള ലിപ്യന്തരണവും സ്ഥലസൂചക വിഭക്തിയും ഉപയോഗിക്കുന്നു.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: ഞാൻ മക്കെദോന്യയിലേക്കു പോകുമ്പോൾ
  rationale: കർത്താവ് പൗലോസാണെന്ന പങ്കുവാക്യബന്ധവും അതിന്റെ കാലസാഹചര്യവും മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἵνα
  choice: …വേണ്ടതിന്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം സംരക്ഷിക്കുന്നു; തുടർന്നുവരുന്ന വാക്യഭാഗവുമായി ബന്ധപ്പെടുന്ന ഘടനയും തുറന്നുവെക്കുന്നു.
- source_word: παραγγείλῃς
  choice: നീ നിർദേശിക്കേണ്ടതിന്
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ഭാവം വായനാസൗകര്യമുള്ള ആധുനിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ ശക്തമായ ‘കല്പിക്കുക’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τισὶν
  choice: ചിലരോട്
  rationale: പേര് പറയാത്തെങ്കിലും പ്രത്യേകമായി ഉദ്ദേശിക്കപ്പെട്ട ചില വ്യക്തികളെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἑτεροδιδασκαλεῖν
  choice: വ്യത്യസ്തമായ ഉപദേശം പഠിപ്പിക്കുക
  rationale: അപ്പൊസ്തലിക മാനദണ്ഡത്തിൽനിന്നു വ്യത്യസ്തമായ പഠിപ്പിക്കൽ എന്ന പദാർഥം നിലനിർത്തുന്നു; മൂലപദത്തേക്കാൾ വ്യാഖ്യാനപരമായി ശക്തമായ ‘വ്യാജോപദേശം’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: സഭയിലെ തെറ്റായ പഠിപ്പിക്കൽ തിരുത്തുന്ന സന്ദർഭത്തിൽ παραγγείλῃς എത്ര ശക്തമായി പരിഭാഷപ്പെടുത്തണം
  choice: പ്രധാന പാഠത്തിൽ ‘നിർദേശിക്കേണ്ടതിന്’
  alternative: ‘കല്പിക്കേണ്ടതിന്’
  rationale: ഇത് വെറും ഉപദേശമല്ല, അധികാരപൂർവമായ ചുമതലയാണ്; എങ്കിലും ‘നിർദേശിക്കുക’ ആധുനിക മലയാളത്തിൽ ആ അധികാരം അനാവശ്യമായ കാഠിന്യമില്ലാതെ അറിയിക്കുന്നു. കൂടുതൽ ശക്തമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἑτεροδιδασκαλεῖν എന്ന സംയുക്തക്രിയയുടെ വിലയിരുത്തൽഭാവം
  choice: ‘വ്യത്യസ്തമായ ഉപദേശം പഠിപ്പിക്കുക’
  alternative: ‘വ്യാജോപദേശം പഠിപ്പിക്കുക’ അല്ലെങ്കിൽ ‘മറ്റൊരു ഉപദേശം പഠിപ്പിക്കുക’
  rationale: മൂലപദം അംഗീകൃത ഉപദേശത്തിൽനിന്നുള്ള വ്യത്യാസം വ്യക്തമാക്കുന്നു; ‘വ്യാജം’ എന്നു ചേർക്കുന്നത് പദത്തിന്റെ നേരിട്ടുള്ള അർഥത്തേക്കാൾ ശക്തമായ വിധിനിർണയം കൊണ്ടുവരാം. അതിനാൽ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: വാക്യത്തിന്റെ അപൂർണമായി തുടരുന്ന ഘടന
  choice: വാക്യാവസാനത്തിൽ അർധവിരാമമോ പൂർണവിരാമമോ ചേർക്കാതെ കോമ നിലനിർത്തുക
  alternative: വാക്യം ഇവിടെ പൂർണമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടന അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നു. ഈ ഭാഗത്തെ സ്വതന്ത്ര പൂർണവാക്യമാക്കുന്നത് മൂലത്തിലെ വാക്യബന്ധം മറയ്ക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഉപദേശം’ ഇവിടെ പൊതുവായ ഉപദേശമല്ല, പഠിപ്പിക്കപ്പെടുന്ന വിശ്വാസബോധനമെന്ന അർഥത്തിൽ ഉപയോഗിക്കുന്നു. മൂലത്തിലെ തുടരുന്ന വാക്യഘടന കാണിക്കാൻ അവസാന കോമ നിലനിർത്തിയിരിക്കുന്നു.
