id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: ml
  text: എന്നാൽ നമ്മുടെ കർത്താവിന്റെ കൃപ, മശീഹാ യേശുവിലുള്ള[a] വിശ്വാസവും സ്നേഹവും സഹിതം, അളവറ്റ വിധം കവിഞ്ഞൊഴുകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തു യേശുവിലുള്ള.’
    reason: Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേര് ‘മശീഹാ’ എന്നും പരമ്പരാഗതമായി ‘ക്രിസ്തു’ എന്നും നൽകാം.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: അളവറ്റവിധം കവിഞ്ഞൊഴുകി
  rationale: ὑπέρ എന്ന തീവ്രതയും πλεονάζω എന്ന ‘പെരുകുക/സമൃദ്ധമാകുക’ എന്ന ആശയവും ഒരുമിച്ച് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പാപത്തിന്റെയും അവിശ്വാസത്തിന്റെയും വിവരണത്തോട് ഇവിടെ കാണുന്ന വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ അനർഹമായ അനുഗ്രഹപൂർവമായ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന പതിവും സന്ദർഭോചിതവുമായ മലയാള പദം.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവിന്റെ
  rationale: κύριος എന്ന സ്ഥാനനാമത്തിന്റെ പുതിയനിയമത്തിലെ ഗൗരവവും ബന്ധസൂചനയും നിലനിർത്തുന്നു.
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: വിശ്വാസവും സ്നേഹവും സഹിതം
  rationale: μετά + genitive സൂചിപ്പിക്കുന്ന സഹവർത്തിത്വം നിലനിർത്തുകയും കൃപയോടൊപ്പം വിശ്വാസവും സ്നേഹവും ഉണ്ടായിരുന്നുവെന്ന വ്യാകരണബന്ധം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹായേശുവിലുള്ള
  rationale: ബന്ധവാക്യം വിശ്വാസത്തെയും സ്നേഹത്തെയും വിശേഷിപ്പിക്കുന്നതായി വായിക്കാവുന്ന വിധത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു; Χριστός എന്ന സ്ഥാനനാമത്തിന്റെ ‘മശീഹാ’ എന്ന അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വിശ്വാസവും സ്നേഹവും സഹിതം’ എന്നതും കൃപയും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവിന്റെ കൃപ വിശ്വാസവും സ്നേഹവും സഹിതം കവിഞ്ഞൊഴുകിയതായി വിവർത്തനം ചെയ്തു.
  alternative: കൃപ പൗലോസിൽ വിശ്വാസവും സ്നേഹവും ഉളവാക്കിയതായി കാരണബന്ധം വ്യക്തമാക്കി വിവർത്തനം ചെയ്യുക.
  rationale: μετά എന്നതിന്റെ നേരിട്ടുള്ള വ്യാകരണബന്ധം സഹവർത്തിത്വമാണ്; കൃപ ഇവയെ ഉളവാക്കി എന്ന ദൈവശാസ്ത്രപരമായ സാധ്യതയെ വാക്യം നിഷേധിക്കുന്നില്ലെങ്കിലും വിവർത്തനം അതിനെ തുറന്നുപറഞ്ഞ് നിർണയിക്കുന്നില്ല.
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ സ്ഥാനനാമത്തിന്റെ അർഥം സജീവമായി നിലനിർത്താൻ ‘മശീഹാ’ ഉപയോഗിച്ചു; മലയാളത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അളവറ്റവിധം കവിഞ്ഞൊഴുകി’ എന്ന പ്രയോഗം മൂലത്തിലെ ശക്തിപ്പെടുത്തിയ ക്രിയയുടെ സമൃദ്ധതാബോധം നിലനിർത്തുന്നു; വാക്യക്രമം വായനാസൗകര്യത്തിനായി മലയാളത്തിന് അനുയോജ്യമാക്കി.
