  to: തിമൊഥെയൊസേ, കുഞ്ഞേ, നിന്നെക്കുറിച്ച് മുമ്പേ ഉണ്ടായ പ്രവചനങ്ങൾക്ക്[a] അനുസൃതമായി ഈ ആജ്ഞ ഞാൻ നിനക്കു ഏൽപ്പിക്കുന്നു; അവയാൽ[b] നീ നല്ല യുദ്ധസേവനം നടത്തേണ്ടതിന്[c].
