reference: 1 Timothy 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: ml
  text: തിമൊഥെയൊസേ, കുഞ്ഞേ, നിന്നെക്കുറിച്ച് മുമ്പേ ഉണ്ടായ പ്രവചനങ്ങൾക്ക്[a] അനുസൃതമായി ഈ ആജ്ഞ ഞാൻ നിനക്കു ഏൽപ്പിക്കുന്നു; അവയാൽ[b] നീ നല്ല യുദ്ധസേവനം നടത്തേണ്ടതിന്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിന്നെ സംബന്ധിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം; തിമൊഥെയൊസിന്റെമേൽ ഉച്ചരിക്കപ്പെട്ട പ്രവചനങ്ങൾ എന്ന അർഥത്തിൽ ‘നിന്റെമേൽ’ എന്നും സാധ്യതയുണ്ട്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവയിലൂടെ’ അല്ലെങ്കിൽ ‘അവയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം മാർഗത്തെയോ പ്രവർത്തനമണ്ഡലത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: ‘നല്ല പോർ പൊരുതുക.’ ഗ്രീക്ക് പദപ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘നല്ല യുദ്ധസേവനം നടത്തുക’ എന്നാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: ആജ്ഞ
  rationale: അധികാരപൂർവമായ നിർദേശമെന്ന ആശയം സ്വാഭാവികമായും ഗൗരവത്തോടെയും അറിയിക്കുന്നു.
- source_word: παρατίθεμαί
  choice: ഭരമേൽപ്പിക്കുന്നു
  rationale: ഒരാളുടെ ഉത്തരവാദിത്വത്തിലും പരിപാലനത്തിലും ഏൽപ്പിക്കുക എന്ന മധ്യമപ്രയോഗത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: τέκνον
  choice: കുഞ്ഞേ
  rationale: ആത്മീയമായ കുടുംബബന്ധവും വാത്സല്യമുള്ള അഭിസംബോധനയും നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മകൻ’ എന്ന ലിംഗനിർണയം ചേർക്കുന്നില്ല.
- source_word: κατὰ
  choice: അനുസൃതമായി
  rationale: പ്രവചനങ്ങളുമായി ഈ ആജ്ഞയ്ക്കുള്ള പൊരുത്തമോ അനുരൂപതയോ വ്യക്തമാക്കുന്നു.
- source_word: προαγούσας
  choice: മുമ്പുണ്ടായ
  rationale: ‘മുമ്പേ പോയ’ എന്ന അക്ഷരാർഥത്തെ ഈ സന്ദർഭത്തിലെ കാലസൂചനയായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐπὶ σὲ
  choice: നിന്നെക്കുറിച്ച്
  rationale: പ്രവചനങ്ങളുടെ പരാമർശവിഷയം തിമൊഥെയൊസ് ആണെന്ന ഏറ്റവും സ്വാഭാവിക വായന നൽകുന്നു; ‘നിന്റെമേൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: προφητείας
  choice: പ്രവചനങ്ങൾ
  rationale: പ്രവാചകസന്ദേശങ്ങളെ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ളതും സാധാരണവുമായ പദം.
- source_word: στρατεύῃ
  choice: നടത്തേണ്ടതിനാണ്
  rationale: തുടർന്നുള്ള യുദ്ധസേവനം എന്ന സജാതീയ കർമപദത്തോടൊപ്പം സൈനികപ്രവർത്തനത്തിൽ ഏർപ്പെടുക എന്ന ആശയം സ്വാഭാവികമാക്കുന്നു.
- source_word: ἐν αὐταῖς
  choice: അവയാൽ
  rationale: പ്രവചനങ്ങളെ തിമൊഥെയൊസിന്റെ ദൗത്യപോരാട്ടത്തിനുള്ള മാർഗമോ പ്രേരകശക്തിയോ ആയി വായിക്കുന്നു; മണ്ഡലം അല്ലെങ്കിൽ മാർഗം എന്ന മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὴν καλὴν στρατείαν
  choice: ശ്രേഷ്ഠമായ യുദ്ധസേവനം
  rationale: ഒറ്റ പോരിനെക്കാൾ സൈനികസേവനം, യുദ്ധയാത്ര, തുടർച്ചയായ പോരാട്ടം എന്നീ വിശാലഭാവമുള്ള സൈനികരൂപകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രവചനങ്ങളിലൂടെ തിമൊഥെയൊസിന് ലഭിച്ച നിയോഗത്തിന്റെ സ്വഭാവം
  choice: മുമ്പ് തിമൊഥെയൊസിനെക്കുറിച്ചുണ്ടായ പ്രവചനങ്ങൾ പൗലോസിന്റെ ഇപ്പോഴത്തെ ആജ്ഞയ്ക്ക് അടിസ്ഥാനമോ മാർഗദർശനമോ ആകുന്നു.
  alternative: ആ പ്രവചനങ്ങൾ ഔപചാരികമായി തിമൊഥെയൊസിനെ സ്ഥാനാഭിഷേകം ചെയ്തു; അല്ലെങ്കിൽ അവ സ്വകാര്യമായ പ്രോത്സാഹനം മാത്രമായിരുന്നു.
  rationale: വാക്യം ആജ്ഞയും മുൻപ്രവചനങ്ങളും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുന്നു; എന്നാൽ ഒരു പ്രത്യേക സ്ഥാനാഭിഷേകസിദ്ധാന്തമോ സ്വകാര്യ പ്രോത്സാഹനം മാത്രമെന്ന പരിമിതിയോ വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കുഞ്ഞേ’ എന്ന അഭിസംബോധന ഗ്രീക്കിലെ വാത്സല്യവും കുടുംബരൂപകവും നിലനിർത്തുന്നു. ‘യുദ്ധസേവനം’ അല്പം ഔപചാരികമായിരുന്നാലും മൂലത്തിലെ വിപുലമായ സൈനികരൂപകം ‘പോർ’ എന്ന ഒറ്റ ഏറ്റുമുട്ടൽചിത്രത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ തെരഞ്ഞെടുത്തു.
