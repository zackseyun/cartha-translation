id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: ml
  text: 'ഇതു അറിഞ്ഞുകൊണ്ട്: നീതിമാനുവേണ്ടിയല്ല നിയമം സ്ഥാപിച്ചിരിക്കുന്നത്; മറിച്ച് നിയമവിരുദ്ധർക്കും അനുസരണക്കേടുള്ളവർക്കും, ദൈവഭക്തിയില്ലാത്തവർക്കും പാപികൾക്കും, വിശുദ്ധിയില്ലാത്തവർക്കും അപവിത്രർക്കും, അപ്പനെ കൊല്ലുന്നവർക്കും അമ്മയെ കൊല്ലുന്നവർക്കും[a], കൊലപാതകികൾക്കും വേണ്ടിയാണ്;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “അപ്പനെ അടിക്കുന്നവർക്കും അമ്മയെ അടിക്കുന്നവർക്കും.” ഗ്രീക്ക് പദങ്ങൾ മാതാപിതാക്കൾക്കെതിരായ ക്രൂരമായ ആക്രമണത്തെയും സൂചിപ്പിക്കാം; എന്നാൽ ഈ സന്ദർഭത്തിൽ “കൊല്ലുന്നവർ” എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: ഇതു മനസ്സിലാക്കിക്കൊണ്ട്
  rationale: മുൻപ്രസ്താവനയുടെ അടിസ്ഥാനമായ അറിവിനെ സൂചിപ്പിക്കുന്ന പങ്കാളിക്രിയയുടെ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαίῳ
  choice: നീതിമാനുവേണ്ടി
  rationale: ഏകവചന പുല്ലിംഗരൂപവും പ്രതിനിധാനപരമായ അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: νόμος οὐ κεῖται
  choice: നിയമം വെച്ചിരിക്കുന്നത് ... അല്ല
  rationale: κεῖται എന്നതിലെ ‘വെക്കപ്പെട്ടിരിക്കുന്നു/സ്ഥാപിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന നിയമപരമായ ഭാവം സംരക്ഷിക്കുന്നു; ‘ബാധകമല്ല’ എന്ന വ്യാഖ്യാനാത്മക പരിഭാഷ ഒഴിവാക്കുന്നു.
- source_word: ἀνόμοις
  choice: നിയമലംഘകർ
  rationale: നിയമവിരുദ്ധമായ ജീവിതത്തിന്റെ നൈതിക-നിയമപരമായ ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνυποτάκτοις
  choice: അനുസരണക്കേടുള്ളവർ
  rationale: അധികാരത്തിനു കീഴടങ്ങാൻ വിസമ്മതിക്കുന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀσεβέσι
  choice: ദൈവഭക്തിയില്ലാത്തവർ
  rationale: ദൈവത്തോടുള്ള ഭക്തിയുടെയും ആദരവിന്റെയും അഭാവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἁμαρτωλοῖς
  choice: പാപികൾ
  rationale: പട്ടികയിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ദത്തിവ് ബഹുവചനത്തിന് സ്വാഭാവികമായ മലയാള നാമരൂപം.
- source_word: ἀνοσίοις
  choice: വിശുദ്ധിയില്ലാത്തവർ
  rationale: വിശുദ്ധമായതിനു വിരുദ്ധമായ സ്വഭാവം βεβήλοις എന്ന അടുത്ത പദത്തിൽനിന്ന് വേർതിരിച്ച് സൂചിപ്പിക്കുന്നു.
- source_word: βεβήλοις
  choice: അശുദ്ധമാക്കുന്നവർ
  rationale: വിശുദ്ധമായതിനെ സാധാരണയോ അശുദ്ധമോ ആയി കൈകാര്യം ചെയ്യുന്ന ‘profane’ ഭാവം മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു.
- source_word: πατρολῴαις
  choice: അപ്പനെ കൊല്ലുന്നവർ
  rationale: പിതാവിനെ അടിക്കുന്നവൻ എന്നോ കൊല്ലുന്നവൻ എന്നോ അർഥമാകാവുന്ന അപൂർവപദം; സന്ദർഭത്തിലെ ശക്തമായ സാധ്യതയായ ‘കൊല്ലുക’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μητρολῴαις
  choice: അമ്മയെ കൊല്ലുന്നവർ
  rationale: മുൻപദത്തിനു സമാന്തരമായി ‘കൊല്ലുക’ സ്വീകരിക്കുന്നു; ആക്രമിക്കുക/അടിക്കുക എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀνδροφόνοις
  choice: കൊലപാതകികൾ
  rationale: അന്യായമായി മനുഷ്യനെ കൊല്ലുന്നവരെ സൂചിപ്പിക്കുന്ന പദത്തിന് വ്യക്തവും നിലവാരമുള്ളതുമായ മലയാള തുല്യം.
theological_decisions:
- issue: δικαίῳ എന്ന ഏകവചന പുല്ലിംഗരൂപത്തിന്റെ പ്രതിനിധാനപരമായ പ്രയോഗം
  choice: നീതിമാൻ
  alternative: നീതിയുള്ള വ്യക്തി / നീതിമാന്മാർ
  rationale: ഗ്രീക്ക് ഏകവചനരൂപം നിലനിർത്തുകയും, സന്ദർഭത്തിൽ പൊതുവായ ഒരു വിഭാഗത്തെ പ്രതിനിധീകരിക്കുന്ന സ്വഭാവം അനാവശ്യമായി ബഹുവചനമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: πατρολῴαις / μητρολῴαις എന്ന പദങ്ങളുടെ അർഥപരിധി
  choice: അപ്പനെ കൊല്ലുന്നവർ / അമ്മയെ കൊല്ലുന്നവർ
  alternative: അപ്പനെ അടിക്കുന്നവർ / അമ്മയെ അടിക്കുന്നവർ
  rationale: ഈ അപൂർവപദങ്ങൾ മാതാപിതാക്കൾക്കെതിരായ ക്രൂരാക്രമണത്തെയോ കൊലപാതകത്തെയോ സൂചിപ്പിക്കാം. തുടർന്ന് ‘കൊലപാതകികൾ’ വരുന്നതുൾപ്പെടെയുള്ള സന്ദർഭത്തിൽ ‘കൊല്ലുക’ സാധ്യതയുള്ളതാണെങ്കിലും, യഥാർഥമായ പദാർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദോഷപ്പട്ടികയുടെ ജോടിയായ താളം കഴിയുന്നത്ര നിലനിർത്തി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം അർധവിരാമം ഉപയോഗിച്ചു.
