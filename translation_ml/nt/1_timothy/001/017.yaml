  source_fidelity: 'The Malayalam accurately represents the SBLGNT doxology: βασιλεῖ τῶν αἰώνων is retained as “യുഗങ്ങളുടെ രാജാവായ”; the coordinated divine descriptions, “അനശ്വരനായ, അദൃശ്യനായ, ഏക ദൈവത്തിന്,” reflect the Greek dative sequence; and “ബഹുമാനവും മഹത്ത്വവും ഉണ്ടാകട്ടെ” properly supplies the doxological predicate for τιμὴ καὶ δόξα. “എന്നെന്നേക്കും” idiomatically conveys εἰς τοὺς αἰῶνας τῶν αἰώνων without losing its unbounded force. The non-translation of δέ is appropriate in Malayalam and does not introduce the unjustified temporal “now.”'
