source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: ml
  text: യുഗങ്ങളുടെ രാജാവായ, അനശ്വരനായ, അദൃശ്യനായ ഏക ദൈവത്തിന്[a] എന്നെന്നേക്കും ബഹുമാനവും മഹത്ത്വവും ഉണ്ടാകട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “ജ്ഞാനിയായ ഏക ദൈവത്തിന്.”'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: യുഗങ്ങളുടെ രാജാവായ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി ഘടന നേരിട്ട് നിലനിർത്തുകയും എല്ലാ യുഗങ്ങളിലുമുള്ള ദൈവത്തിന്റെ രാജത്വം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘നിത്യരാജാവ്’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
- source_word: ἀφθάρτῳ
  choice: അനശ്വരനായ
  rationale: നാശത്തിനും ക്ഷയത്തിനും വിധേയനല്ലാത്തവൻ എന്ന ആശയം ദൈവത്തെക്കുറിച്ചുള്ള സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀοράτῳ
  choice: അദൃശ്യനായ
  rationale: കാണപ്പെടാത്തവൻ എന്ന അർഥം കൃത്യമായും സ്തുതിവാക്യത്തിന് യോജിച്ച ഉയർന്ന ശൈലിയിലും നൽകുന്നു.
- source_word: μόνῳ θεῷ
  choice: ഏക ദൈവത്തിന്
  rationale: SBLGNT-യിലെ പാഠം നേരിട്ട് പ്രതിഫലിപ്പിച്ച് ഏകദൈവവിശ്വാസത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു; ‘ജ്ഞാനിയായ’ എന്ന പാഠഭേദം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τιμὴ καὶ δόξα
  choice: ബഹുമാനവും മഹത്ത്വവും
  rationale: τιμή എന്നതിന് ‘ബഹുമാനം’ കൃത്യമാണ്; δόξα എന്ന സ്തുതിപദത്തിന്റെ മഹിമയും ഔന്നത്യവും ‘മഹത്ത്വം’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: എന്നെന്നേക്കും
  rationale: അവസാനമില്ലാത്ത കാലദൈർഘ്യം മലയാളത്തിലെ സ്വാഭാവികമായ സ്തുതിവാക്യശൈലിയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: മലയാള ബൈബിൾ-ആരാധനാ പാരമ്പര്യത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ സ്തുതിവാക്യത്തിലേക്കുള്ള മൃദുവായ വ്യവഹാരമാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഇപ്പോൾ’ എന്ന പദം ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന ഉണ്ടാകും; വാക്യക്രമം തന്നെ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: μόνῳ θεῷ എന്ന പ്രയോഗത്തിലെ ഏകദൈവവിശ്വാസത്തിന്റെ ഊന്നൽ
  choice: ഏക ദൈവത്തിന്
  alternative: ദൈവത്തിന് മാത്രം
  rationale: മൂലപാഠത്തിലെ വിശേഷണ-നാമ ഘടന നേരിട്ട് നിലനിർത്തുന്നു. ക്രിസ്തുവിനെക്കുറിച്ചുള്ള വിശാലമായ തിരുവെഴുത്തുസാക്ഷ്യത്തെ വിശദീകരിക്കാനോ പരിമിതപ്പെടുത്താനോ അധിക വാക്കുകൾ ചേർക്കാതെ ഈ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഊന്നൽ അതേപടി വിടുന്നു.
- issue: μόνῳ എന്നതിന് ശേഷം σοφῷ (‘ജ്ഞാനിയായ’) ചേർക്കുന്ന പാഠഭേദം
  choice: ‘ജ്ഞാനിയായ’ എന്നത് മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി പാഠക്കുറിപ്പിൽ നൽകുന്നു
  alternative: ജ്ഞാനിയായ ഏക ദൈവത്തിന്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ σοφῷ ഇല്ല. അതിനാൽ മൂലപാഠത്തിന് മുൻഗണന നൽകുകയും പരിചിതമായ ദീർഘപാഠം പാഠഭേദമായി രേഖപ്പെടുത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും സ്തുതിഗീതാത്മകവുമായ ശൈലി. ദത്തിവ് രൂപങ്ങളായ വിശേഷണങ്ങളെ സ്വാഭാവിക മലയാളത്തിൽ ‘രാജാവായ, … ഏക ദൈവത്തിന്’ എന്ന ഏകീകൃത ഘടനയാക്കി. സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും മൂലത്തിലെ യുഗഭാഷയും ഏകദൈവവിശ്വാസത്തിന്റെ ഊന്നലും നിലനിർത്തി.
