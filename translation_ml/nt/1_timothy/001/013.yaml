translation:
  language: ml
  text: മുമ്പ് ഞാൻ ദൈവദൂഷകനും പീഡകനും അക്രമിയും ആയിരുന്നു[a]. എങ്കിലും എന്നോടു കരുണ കാണിക്കപ്പെട്ടു[b], കാരണം അവിശ്വാസത്തിൽ അറിവില്ലാതെ ഞാൻ പ്രവർത്തിച്ചു[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ധിക്കാരപൂർവം ഉപദ്രവിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘ക്രൂരൻ.’ ഗ്രീക്കുപദം വെറും അഹങ്കാരമല്ല, അപമാനകരവും അതിരുകടന്നതുമായ അക്രമപ്രവർത്തനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എനിക്കു കരുണ ലഭിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘അറിവില്ലായ്മയിൽ’ അല്ലെങ്കിൽ ‘അറിയാതിരുന്നുകൊണ്ട്.’
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘അവിശ്വസ്തതയിൽ.’ ഇവിടെ ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെക്കാൾ വിശ്വാസമില്ലായ്മ എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: മുമ്പ് ഞാൻ ... ആയിരുന്നു
  rationale: മുൻകാലാവസ്ഥയെ സൂചിപ്പിക്കുന്ന കാലാർഥവും participial force-ഉം സ്വാഭാവികമായ മലയാളവാക്യത്തിൽ നിലനിർത്തുന്നു.
- source_word: βλάσφημον
  choice: ദൈവദൂഷകൻ
  rationale: ഇവിടെ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന substantival പ്രയോഗമാണ്; മലയാളത്തിൽ നേരിട്ടും വ്യക്തവുമായ സമാനപദം.
- source_word: διώκτην
  choice: പീഡകൻ
  rationale: വിശ്വാസികളെ ഉപദ്രവിച്ചിരുന്ന പൗലോസിന്റെ മുൻകാല പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന സാധാരണയും കൃത്യവുമായ പദം.
- source_word: ὑβριστήν
  choice: അക്രമി
  rationale: അപമാനകരവും അതിരുകടന്നതുമായ ആക്രമണസ്വഭാവം ഉൾക്കൊള്ളുന്ന, ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം; വെറും അഹങ്കാരം എന്നാക്കി ചുരുക്കുന്നില്ല.
- source_word: ἠλεήθην
  choice: എനിക്കു കരുണ ലഭിച്ചു
  rationale: ദൈവത്തിൽനിന്നു കരുണ ലഭിച്ചതെന്ന passive അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: കരുണ ലഭിച്ചതുമായി തുടർന്നുള്ള പ്രസ്താവനയ്ക്കുള്ള കാരണാത്മക/വിശദീകരണാത്മക ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἀγνοῶν ἐποίησα
  choice: അറിവില്ലാതെ ഞാൻ അങ്ങനെ പ്രവർത്തിച്ചു
  rationale: പ്രവൃത്തിയുടെ രീതി സൂചിപ്പിക്കുന്ന participle-ഉം വ്യക്തമായ object ഇല്ലാത്ത ποιέω-യും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘അങ്ങനെ’ മുൻപറഞ്ഞ പെരുമാറ്റത്തിലേക്കാണ് വിരൽചൂണ്ടുന്നത്.
- source_word: ἐν ἀπιστίᾳ
  choice: അവിശ്വാസത്തിൽ
  rationale: ഈ സന്ദർഭത്തിൽ ഉടമ്പടിയോടുള്ള അവിശ്വസ്തതയെക്കാൾ വിശ്വാസമില്ലായ്മയാണ് പ്രധാന അർഥം.
theological_decisions:
- issue: ὅτι അവതരിപ്പിക്കുന്ന പ്രസ്താവനയുടെ ബന്ധം
  choice: താൻ അവിശ്വാസത്തിൽ അറിവില്ലാതെ പ്രവർത്തിച്ചതിനാലാണ് കരുണ ലഭിച്ചതെന്ന് പൗലോസ് പറയുന്നു.
  alternative: ഇത് കരുണയുടെ കാരണം പറയാതെ അതിന്റെ സാഹചര്യം മാത്രം വിശദീകരിക്കുന്നു.
  rationale: ὅτι-യുടെ സ്വാഭാവിക കാരണാത്മക അർഥം ‘കാരണം’ എന്നു നിലനിർത്തുന്നു. അതേസമയം അറിവില്ലായ്മ കരുണ അർഹമാക്കിയെന്ന നിഗമനം പരിഭാഷയിൽ ചേർക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ദൈവദൂഷകൻ—പീഡകൻ—അക്രമി’ എന്ന മൂന്നു സ്വഭാവവിവരണങ്ങളുടെ തീവ്രത നിലനിർത്തി. പ്രധാനവാക്യത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘എനിക്കു കരുണ ലഭിച്ചു’ ഉപയോഗിച്ചു; passive വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
