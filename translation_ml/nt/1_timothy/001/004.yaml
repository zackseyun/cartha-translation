revisions:
- from: കെട്ടുകഥകൾക്കും അവസാനമില്ലാത്ത വംശാവലികൾക്കും ശ്രദ്ധ കൊടുക്കരുതെന്നും കല്പിക്കുക. അവ വിശ്വാസത്തിലുള്ള ദൈവിക കാര്യനിർവഹണത്തെക്കാൾ ഫലമില്ലാത്ത ഊഹാപോഹങ്ങൾക്കാണ് ഇടയാക്കുന്നത്[a][b][c]—
  to: കെട്ടുകഥകൾക്കും അവസാനമില്ലാത്ത വംശാവലികൾക്കും ശ്രദ്ധ കൊടുക്കരുതെന്നും കല്പിക്കുക. അവ ഊഹാപോഹങ്ങൾക്കാണ്[a] ഇടയാക്കുന്നത്; വിശ്വാസത്തിലുള്ള ദൈവത്തിന്റെ കാര്യനിർവഹണത്തിനല്ല[b][c]—
  rationale: ‘ഫലമില്ലാത്ത’ ഒഴിവാക്കി ἐκζητήσεις-ന്റെ അർഥപരിധി മുഖ്യവാചകത്തിൽ അതിരുകടക്കാതെ നിലനിർത്തി. μᾶλλον ἢയുടെ വിരോധം മലയാളത്തിൽ കൂടുതൽ വ്യക്തമായി വരുന്നതിനായി വാക്യക്രമം ‘...ഇടയാക്കുന്നത്; ...അല്ല’ എന്നാക്കി. οἰκονομίαയെ ‘ദൈവത്തിന്റെ കാര്യനിർവഹണം’ എന്നു നൽകിയതിലൂടെ genitive-ന്റെ സാധാരണ ബന്ധം പ്രതിഫലിപ്പിക്കുമ്പോൾ, ഭരണക്രമം/പദ്ധതി/ദൈവത്തിൽനിന്നുള്ള ചുമതല എന്നീ വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
  reviewer_model: gpt-5.6-terra
