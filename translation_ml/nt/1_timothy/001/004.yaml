id: 1TI.1.4
reference: 1 Timothy 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: ml
  text: കെട്ടുകഥകൾക്കും അവസാനമില്ലാത്ത വംശാവലികൾക്കും ശ്രദ്ധ കൊടുക്കരുതെന്നും കല്പിക്കുക. അവ ഊഹാപോഹങ്ങൾക്കാണ്[a] ഇടയാക്കുന്നത്; വിശ്വാസത്തിലുള്ള ദൈവത്തിന്റെ കാര്യനിർവഹണത്തിനല്ല[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഊഹാപോഹങ്ങൾ’ എന്നതിന് പകരം ‘തർക്കങ്ങൾ,’ ‘അന്വേഷണങ്ങൾ,’ അല്ലെങ്കിൽ ‘ചോദ്യചർച്ചകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ഇവിടെ പ്രയോജനകരമല്ലാത്ത അന്വേഷണങ്ങളെയോ തർക്കങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിന്റെ കാര്യനിർവഹണം’ എന്നതിന് ‘ദൈവത്തിന്റെ ഭരണക്രമം,’ ‘ദൈവത്തിന്റെ പദ്ധതി,’ അല്ലെങ്കിൽ ‘ദൈവത്തിൽനിന്നുള്ള കാര്യനിർവഹണച്ചുമതല’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘വിശ്വാസത്തിലുള്ള’ എന്നതിന് ‘വിശ്വാസത്താൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; ‘വിശ്വാസം’ എന്ന പദത്തിൽ ‘ആശ്രയം’ അല്ലെങ്കിൽ ‘വിശ്വസ്തത’ എന്ന സൂക്ഷ്മാർഥവും ചിലർ കാണുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: ശ്രദ്ധ കൊടുക്കുക
  rationale: എന്തെങ്കിലും കാര്യത്തിനു ചെവികൊടുക്കുകയും അതിൽ മനസ്സുറപ്പിക്കുകയും ചെയ്യുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μύθοις
  choice: കെട്ടുകഥകൾ
  rationale: സന്ദർഭത്തിലെ നിഷേധാത്മക ഭാവം വ്യക്തമാക്കുന്നു; പഴഞ്ചനായ ‘കെട്ടുകഥകൾ’ എന്നതിനു പകരം ഇതു സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകും.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: അവസാനമില്ലാത്ത വംശാവലികൾ
  rationale: ἀπέραντος എന്നതിലെ അറ്റമില്ലായ്മയും നീണ്ടുനിൽക്കുന്ന ഫലശൂന്യതയും സ്വാഭാവികമായി പകർത്തുന്നു.
- source_word: ἐκζητήσεις
  choice: ഫലമില്ലാത്ത ഊഹാപോഹങ്ങൾ
  rationale: പദം അന്വേഷണങ്ങളെയോ തർക്കവിഷയങ്ങളെയോ സൂചിപ്പിക്കാമെങ്കിലും ഇവിടെ നിഷ്ഫലമായ ചോദ്യചർച്ചകളാണ് ഉദ്ദേശ്യം; ‘ഫലമില്ലാത്ത’ എന്നത് സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: παρέχουσι
  choice: ഇടയാക്കുന്നു
  rationale: ‘ഉളവാക്കുന്നു/കാരണമാകുന്നു’ എന്ന അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μᾶλλον ἢ
  choice: …യെക്കാൾ
  rationale: രണ്ട് ഫലങ്ങൾ തമ്മിലുള്ള ഗ്രീക്ക് താരതമ്യ-വിരോധം നിലനിർത്തുന്നു.
- source_word: οἰκονομίαν θεοῦ
  choice: ദൈവിക കാര്യനിർവഹണം
  rationale: οἰκονομία എന്ന പദത്തിന്റെ കാര്യനിർവഹണം, ഭരണക്രമം, നിയോഗം/പദ്ധതി എന്നീ അർഥസാധ്യതകൾ പൂർണമായി ഒരു വശത്തേക്ക് ചുരുക്കാതെ നൽകുന്നു; θεοῦ ദൈവത്തിന്റേതെന്നോ ദൈവത്തിൽനിന്നുള്ളതെന്നോ ഗ്രഹിക്കാവുന്ന തുറന്ന നിലയും ഭാഗികമായി സംരക്ഷിക്കുന്നു.
- source_word: τὴν ἐν πίστει
  choice: വിശ്വാസത്തിലുള്ള
  rationale: ἐν എന്നതിന്റെ മേഖലാസൂചന നേരിട്ട് നിലനിർത്തുകയും πίστις എന്നതിന് പദ്ധതിയുടെ പതിവ് പരിഭാഷയായ ‘വിശ്വാസം’ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: οἰκονομίαν θεοῦ എന്നതിന്റെ അർഥം
  choice: ദൈവിക കാര്യനിർവഹണം
  alternative: ദൈവത്തിന്റെ ഭരണക്രമം; ദൈവത്തിന്റെ പദ്ധതി; ദൈവത്തിൽനിന്നുള്ള കാര്യവിചാരകത്വം
  rationale: രക്ഷാപദ്ധതി, ദൈവത്തിന്റെ ക്രമീകരണം, ഏല്പിക്കപ്പെട്ട കാര്യവിചാരകത്വം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം സിദ്ധാന്തപരമായി ഉറപ്പിക്കാതെ പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- issue: πίστει എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭം ‘വിശ്വാസം’ എന്ന സാധാരണ പൗലോസീയ അർഥത്തിൽനിന്ന് മാറാൻ നിർബന്ധിക്കുന്നില്ല; മറ്റു സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യം മുൻവാക്യത്തിലെ കല്പന തുടരുന്നതിനാൽ ‘കല്പിക്കുക’ ചേർത്തിരിക്കുന്നു. അവസാനത്തിലെ ദീർഘവിരാമം തുടർന്നുവരുന്ന വാക്യബന്ധം സൂചിപ്പിക്കുന്നു.
