id: 1TI.1.19
reference: 1 Timothy 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: ml
  text: വിശ്വാസവും[b] നല്ല മനസ്സാക്ഷിയും മുറുകെപ്പിടിച്ചുകൊണ്ട്; ചിലർ അതിനെ[a] തള്ളിക്കളഞ്ഞ് വിശ്വാസത്തിന്റെ കാര്യത്തിൽ കപ്പൽച്ചേതം അനുഭവിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അതിനെ’ എന്നത് ഏറ്റവും സ്വാഭാവികമായി ‘നല്ല മനസ്സാക്ഷി’യെ സൂചിപ്പിക്കുന്നു. എന്നാൽ ‘വിശ്വാസവും നല്ല മനസ്സാക്ഷിയും’ രണ്ടും ചേർന്ന ആശയത്തെ ഇത് സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘വിശ്വാസം’ എന്നത് ‘വിശ്വസിച്ചാശ്രയിക്കൽ’ എന്നും, ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവായി ‘വിശ്വസ്തത’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: മുറുകെപ്പിടിച്ചുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടർച്ചയായും സജീവമായും നിലനിർത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു; മുൻവാക്യത്തിലെ അഭിസംബോധിതനായ തിമൊഥെയൊസിനോടാണ് ഇത് ബന്ധപ്പെടുന്നത്.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിസ്തീയ വിശ്വാസമാണ് ഏറ്റവും സ്വാഭാവികമായ അർഥം; ‘ആശ്രയം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀγαθὴν συνείδησιν
  choice: നല്ല മനസ്സാക്ഷി
  rationale: ἀγαθή എന്നതിന്റെ നേരായ അർഥവും συνείδησις എന്നതിന്റെ നൈതിക വ്യാപ്തിയും നിലനിർത്തുന്നു; ‘കുറ്റബോധമില്ലാത്ത മനസ്സാക്ഷി’ എന്നു പറഞ്ഞാൽ അർഥം അനാവശ്യമായി ചുരുങ്ങും.
- source_word: ἥν
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ സർവനാമം ഏറ്റവും സ്വാഭാവികമായി തൊട്ടുമുമ്പുള്ള συνείδησιν എന്ന പദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; വിശാലമായ ബന്ധസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπωσάμενοι
  choice: തള്ളിക്കളഞ്ഞ്
  rationale: മനഃപൂർവമായ നിരാകരണത്തിന്റെ ശക്തി നിലനിർത്തുകയും ഗ്രീക്കിലെ ദൃശ്യമായ പ്രയോഗത്തിന് സ്വാഭാവിക മലയാളരൂപം നൽകുകയും ചെയ്യുന്നു.
- source_word: περὶ τὴν πίστιν
  choice: വിശ്വാസത്തിന്റെ കാര്യത്തിൽ
  rationale: കപ്പൽച്ചേതം സംഭവിച്ച മേഖല അഥവാ പരിഗണനാവിഷയം വിശ്വാസമാണെന്ന ബന്ധം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ നിർദേശകപദം ക്രിസ്തീയ വിശ്വാസത്തോടുള്ള സൂചനയെ പിന്തുണയ്ക്കുന്നു.
- source_word: ἐναυάγησαν
  choice: കപ്പൽച്ചേതം അനുഭവിച്ചു
  rationale: മൂലത്തിലെ കപ്പൽദുരന്തരൂപകം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἥν എന്ന ബന്ധസർവനാമത്തിന്റെ പൂർവപദം
  choice: ‘അതിനെ’ എന്നത് പ്രത്യേകമായി ‘നല്ല മനസ്സാക്ഷി’യെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘വിശ്വാസവും നല്ല മനസ്സാക്ഷിയും’ രണ്ടും ചേർന്ന ആശയത്തെ സർവനാമം സംഗ്രഹിക്കുന്നു.
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ἥν, ഏറ്റവും അടുത്ത സ്ത്രീലിംഗ ഏകവചന നാമമായ συνείδησιν-നോട് വ്യാകരണപരമായി യോജിക്കുന്നു. എങ്കിലും ആശയപരമായി രണ്ടിനെയും ഉൾക്കൊള്ളുന്ന വായന സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; ഈ സന്ദർഭത്തിൽ സാധ്യത കുറവായി വിശ്വസ്തത
  rationale: വാക്യത്തിന്റെ അവസാനത്തിലെ നിർദേശകപദത്തോടുകൂടിയ τὴν πίστιν ക്രിസ്തീയ വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നതായി ഏറ്റവും സ്വാഭാവികമായി വായിക്കാം; പദത്തിന്റെ വിപുലമായ അർഥപരിധി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. മൂലവാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന കൃദന്തരൂപമായതിനാൽ ആദ്യഭാഗത്തിന്റെ അപൂർണവാക്യസ്വഭാവം നിലനിർത്തി; അതിനെ സ്വതന്ത്ര കല്പനയായി മാറ്റിയിട്ടില്ല. കപ്പൽച്ചേതത്തിന്റെ രൂപകം വിശദീകരിച്ച് മൃദൂകരിക്കാതെ സംരക്ഷിച്ചു.
