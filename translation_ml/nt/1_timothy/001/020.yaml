id: 1TI.1.20
reference: 1 Timothy 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: ml
  text: അവരിൽ ഹുമെനായൊസും അലക്സാണ്ടറും ഉണ്ട്; അവർ ദൈവദൂഷണം ചെയ്യാതിരിക്കാൻ പഠിപ്പിക്കപ്പെടേണ്ടതിന്[b] ഞാൻ അവരെ സാത്താന് ഏൽപ്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാത്താന്റെ കയ്യിൽ ഏൽപ്പിച്ചു.’ ഈ പ്രയോഗം അന്തിമവിധിയെക്കാൾ കഠിനമായ തിരുത്തൽശിക്ഷയെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘പഠിപ്പിക്കപ്പെടുക’ എന്നത് ‘ശിക്ഷണം ലഭിക്കുക,’ ‘പരിശീലിപ്പിക്കപ്പെടുക,’ അല്ലെങ്കിൽ ‘തിരുത്തപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദത്തിൽ രൂപപ്പെടുത്തുന്ന തിരുത്തലിന്റെ ആശയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: അവരിൽ ... ഉൾപ്പെടുന്നു
  rationale: മുമ്പ് പറഞ്ഞ കൂട്ടത്തിൽ ഇവർ ഉൾപ്പെടുന്നു എന്ന ഭാഗികബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: ഹുമനയൊസും അലക്സാണ്ടറും
  rationale: ഗ്രീക്ക് വ്യക്തിനാമങ്ങൾ മലയാളത്തിൽ തിരിച്ചറിയാവുന്ന വിധം ലിപ്യന്തരണം ചെയ്തു.
- source_word: παρέδωκα
  choice: ഞാൻ ... ഏൽപ്പിച്ചു
  rationale: παραδίδωμι എന്ന ക്രിയയുടെ കൈമാറുക/ഏൽപ്പിക്കുക എന്ന ശക്തി നിലനിർത്തുന്നു; ഗ്രീക്ക് ഏറിസ്റ്റിനെ ലളിതമായ ഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τῷ Σατανᾷ
  choice: സാത്താന്
  rationale: ഇവിടെ Σατανᾶς ഒരു വ്യക്തിനാമസദൃശമായ പദവിയായതിനാൽ പുതിയനിയമത്തിലെ പതിവ് രൂപം നിലനിർത്തുന്നു.
- source_word: ἵνα παιδευθῶσι
  choice: അവർ ശിക്ഷണത്തിലൂടെ പഠിക്കേണ്ടതിന്
  rationale: παιδεύω ഉൾക്കൊള്ളുന്ന പഠിപ്പിക്കൽ, പരിശീലനം, തിരുത്തൽശിക്ഷണം എന്നീ ആശയങ്ങൾ ഒരുമിച്ച് സൂചിപ്പിക്കുകയും വെറും ശാരീരികശിക്ഷ എന്ന അർഥം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ βλασφημεῖν
  choice: ദൈവദൂഷണം പറയാതിരിക്കാൻ
  rationale: βλασφημέω എന്നതിന്റെ മതപരമായ ഗൗരവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സന്ദർഭത്തിൽ ദൈവത്തെയോ വിശ്വാസത്തെയോ നിന്ദിക്കുന്ന സംസാരമാണ് ഉദ്ദേശ്യമെന്ന സാധ്യത പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘സാത്താന് ഏൽപ്പിച്ചു’ എന്നതിന്റെ അർഥം
  choice: വാക്യത്തിലെ രൂപകം വ്യാഖ്യാനിച്ച് തീർക്കാതെ അക്ഷരാർഥത്തോട് അടുത്തുതന്നെ നിലനിർത്തി; ലക്ഷ്യം തിരുത്തലാണെന്ന് ഉദ്ദേശ്യവാക്യം വ്യക്തമാക്കുന്നു.
  alternative: ഇത് അത്ഭുതകരമായ ശാരീരികപീഡനമെന്നോ അന്തിമശിക്ഷാവിധിയെന്നോ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: ‘ദൈവദൂഷണം പറയാതിരിക്കാൻ ... പഠിക്കേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യവാക്യം പരിഹാരാത്മകമായ ലക്ഷ്യം സൂചിപ്പിക്കുന്നു. എന്നാൽ നടപ്പാക്കിയ കൃത്യമായ സഭാശിക്ഷാരീതി മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ പരിഭാഷ അതു നിർണ്ണയിക്കുന്നില്ല.
- issue: παιδευθῶσι എന്നതിലെ പഠിപ്പിക്കലും ശിക്ഷണവും
  choice: ‘ശിക്ഷണത്തിലൂടെ പഠിക്കേണ്ടതിന്’
  alternative: ‘ശിക്ഷിക്കപ്പെടേണ്ടതിന്’ അല്ലെങ്കിൽ ‘പഠിക്കേണ്ടതിന്’ മാത്രം
  rationale: ഒറ്റ പദത്തിൽ ഒതുക്കുമ്പോൾ നഷ്ടപ്പെടാവുന്ന രൂപീകരണപരവും തിരുത്തൽപരവുമായ ഇരട്ടഭാവം ഈ പ്രയോഗം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സാത്താന് ഏൽപ്പിച്ചു’ എന്ന ദൈവശാസ്ത്രപരമായി സംഘർഷമുള്ള പ്രയോഗം വിശദീകരിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി; അപരിചിതമായ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചു.
