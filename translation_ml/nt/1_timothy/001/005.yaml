id: 1TI.1.5
reference: 1 Timothy 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: ml
  text: ഈ നിർദേശത്തിന്റെ ലക്ഷ്യം ശുദ്ധമായ ഹൃദയത്തിൽനിന്നും നല്ല മനസ്സാക്ഷിയിൽനിന്നും കപടമില്ലാത്ത വിശ്വാസത്തിൽനിന്നും ഉളവാകുന്ന സ്നേഹമാണ്.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ലക്ഷ്യം” എന്നതിന് “ഉദ്ദേശ്യം” എന്നോ “ഫലം” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നിർദേശം” എന്നതിന് “ആജ്ഞ” എന്നോ “ചുമതലപ്പെടുത്തൽ” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “കപടമില്ലാത്ത വിശ്വാസം” എന്നത് “ആത്മാർഥമായ വിശ്വാസം” എന്നും പറയാം; ചില സന്ദർഭങ്ങളിൽ πίστις എന്ന പദത്തിന് “വിശ്വസ്തത” എന്നോ “ആശ്രയം” എന്നോ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: ലക്ഷ്യം
  rationale: ഇവിടെ ഒരു കാര്യത്തിന്റെ അവസാനത്തെയല്ല, നിർദേശത്തിന്റെ ഉദ്ദേശ്യത്തെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: παραγγελίας
  choice: നിർദേശം
  rationale: ആജ്ഞ, ചുമതലപ്പെടുത്തൽ, നിർദേശം എന്നീ അർഥസാധ്യതകളിൽ, 1:3–4-ലെ ശുശ്രൂഷാ-പഠിപ്പിക്കൽ പശ്ചാത്തലത്തിന് സ്വാഭാവികവും വിശാലവുമായ പദം.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ധാർമികവും ബന്ധപരവുമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκ
  choice: -ത്തിൽനിന്നും ഉളവാകുന്ന
  rationale: സ്നേഹം തുടർന്നുപറയുന്ന മൂന്ന് ഗുണങ്ങളിൽനിന്ന് ഉദ്ഭവിക്കുന്നു എന്ന ഉറവിടബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: καθαρᾶς καρδίας
  choice: ശുദ്ധമായ ഹൃദയം
  rationale: ആന്തരികവും ധാർമികവുമായ ശുദ്ധി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: συνειδήσεως ἀγαθῆς
  choice: നല്ല മനസ്സാക്ഷി
  rationale: ἀγαθῆς എന്നതിന്റെ നേരിട്ടുള്ള മൂല്യം നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായ ‘കുറ്റബോധമില്ലാത്ത മനസ്സാക്ഷി’ എന്നതിനെക്കാൾ ഉറവിടത്തോട് അടുത്തത്.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണ പുതിയനിയമ പ്രയോഗം; ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀνυποκρίτου
  choice: കപടമില്ലാത്ത
  rationale: ‘വ്യാജമല്ലാത്ത/ആത്മാർഥമായ’ എന്ന അർഥം വ്യക്തമായി നൽകുകയും ഗ്രീക്കിലെ നിഷേധാത്മക രൂപഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ നേരിയ ആശയമാറ്റം സൂചിപ്പിക്കുന്ന കണികയാണ്; മലയാളത്തിൽ നിർബന്ധമായി ‘എന്നാൽ/ഇപ്പോൾ’ ചേർത്താൽ അനാവശ്യമായ കാലികമോ വിരുദ്ധമോ ആയ ഊന്നൽ വരാം.
theological_decisions:
- issue: πίστεως ἀνυποκρίτου എന്നതിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: കപടമില്ലാത്ത വിശ്വാസം
  alternative: ആത്മാർഥമായ വിശ്വസ്തത; കപടമില്ലാത്ത ആശ്രയം
  rationale: സന്ദർഭത്തിൽ യഥാർഥമായ വിശ്വാസം ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാം; എന്നാൽ പദത്തിന്റെ വിശാലമായ അർഥപരിധി സിദ്ധാന്തപരമായി ചുരുക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വചനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഗ്രീക്കിലെ മൂന്ന് ἐκ-ഘടകങ്ങളുടെയും സമാന്തരത ‘-ത്തിൽനിന്നും’ ആവർത്തിച്ച് സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പ്രധാനപാഠത്തിന്റെ അവസാനം ക്രമത്തിൽ നൽകിയിരിക്കുന്നു.
