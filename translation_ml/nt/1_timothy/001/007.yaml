id: 1TI.1.7
reference: 1 Timothy 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: ml
  text: നിയമം പഠിപ്പിക്കുന്നവരാകാൻ ആഗ്രഹിക്കുന്ന അവർ, തങ്ങൾ പറയുന്നതെന്താണെന്നോ തങ്ങൾ എന്തിനെക്കുറിച്ചാണ് ഇത്ര ഉറപ്പോടെ ഉറപ്പിച്ചുപറയുന്നതെന്നോ മനസ്സിലാക്കുന്നില്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “തങ്ങൾ പറയുന്നതും തങ്ങൾ ഉറപ്പിച്ചുപറയുന്ന കാര്യങ്ങളും എന്താണെന്ന് അവർ മനസ്സിലാക്കുന്നില്ല.”'
    reason: lexical_alternative
  - marker: b
    text: “നിയമം പഠിപ്പിക്കുന്നവർ” എന്നത് യഹൂദരുടെ നിയമമായ തോറാ പഠിപ്പിക്കാൻ തങ്ങൾക്ക് അധികാരമുണ്ടെന്ന് അവകാശപ്പെട്ടിരുന്നവരെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες εἶναι
  choice: ആകാൻ ആഗ്രഹിക്കുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിലെ തുടരുന്ന ആഗ്രഹവും εἶναι എന്ന പൂരക അനന്തരൂപവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: νομοδιδάσκαλοι
  choice: നിയമോപദേഷ്ടാക്കൾ
  rationale: നിയമം പഠിപ്പിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ അർഥം സംക്ഷിപ്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; മുഖ്യപാഠത്തിൽ ‘മോശെയുടെ’ എന്ന് അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: μὴ νοοῦντες
  choice: മനസ്സിലാക്കുന്നില്ല
  rationale: പ്രധാനവാക്യവുമായി ചേർത്ത് വായിക്കുമ്പോൾ അവരുടെ ആഗ്രഹവും ഗ്രാഹ്യമില്ലായ്മയും തമ്മിലുള്ള വൈരുധ്യം മലയാളവാക്യഘടനയിൽ വ്യക്തമാണ്; ‘എങ്കിലും’ എന്ന ആശയം മൂലത്തിൽ ചേർക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: μήτε ... μήτε
  choice: '...ഓ ...ഓ ... ഇല്ല'
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധിത നിഷേധം സ്വാഭാവിക മലയാളത്തിലെ ‘ഓ...ഓ’ ഘടനയിലൂടെ നൽകുന്നു.
- source_word: ἃ λέγουσιν
  choice: തങ്ങൾ പറയുന്നത്
  rationale: അവരുടെ സംസാരത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: περὶ τίνων διαβεβαιοῦνται
  choice: ഇത്ര ഉറപ്പോടെ വാദിക്കുന്ന കാര്യങ്ങൾ
  rationale: περί സൂചിപ്പിക്കുന്ന വിഷയബന്ധവും διαβεβαιοῦνται എന്നതിലെ ശക്തമായ, ആത്മവിശ്വാസപൂർവമായ ഉറപ്പിക്കലും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: νομοδιδάσκαλοι എന്നതിലെ ‘നിയമം’ ഏതിനെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘നിയമോപദേഷ്ടാക്കൾ’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മോശെയുടെ നിയമത്തിന്റെ ഉപദേഷ്ടാക്കൾ’ അല്ലെങ്കിൽ ‘തോറാ ഉപദേഷ്ടാക്കൾ’.
  rationale: സന്ദർഭത്തിൽ യഹൂദനിയമമായ തോറായെയാണ് മിക്കവാറും സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഗ്രീക്കുപദം അതിനെ മുഖ്യപാഠത്തിൽ അത്ര വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται എന്നതിലെ സമാന്തരഘടന
  choice: ‘തങ്ങൾ പറയുന്നതോ ... വാദിക്കുന്ന കാര്യങ്ങളോ’ എന്ന് രണ്ട് വ്യത്യസ്ത ഘടകങ്ങളായി നിലനിർത്തി.
  alternative: ‘തങ്ങൾ പറയുന്നതോ ഉറപ്പിച്ചു പറയുന്നതോ’ എന്ന് രണ്ടും പ്രസ്താവനയുടെ ഉള്ളടക്കമായി വായിക്കുക.
  rationale: περί എന്ന മുൻപ്രത്യയത്തിന്റെ വിഷയസൂചന മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; മറ്റൊരു സാധ്യമായ വായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിയമോപദേഷ്ടാക്കൾ’ ഔപചാരികമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണ്. അടിക്കുറിപ്പുസൂചകങ്ങൾ വാക്യാവസാനത്ത് ക്രമമായി ചേർത്തിരിക്കുന്നു.
