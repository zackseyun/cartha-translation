  source_fidelity: 'The Malayalam faithfully renders all four coordinated infinitival/adjectival elements: doing good (ἀγαθοεργεῖν), being rich in good works (πλουτεῖν ἐν ἔργοις καλοῖς), generosity (εὐμεταδότους), and readiness to share (κοινωνικούς). The continuing infinitival form appropriately reflects its dependence on the preceding charge.'
