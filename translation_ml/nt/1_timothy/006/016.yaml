id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: ml
  text: അമർത്യത തനിക്കുമാത്രമുള്ളവനും സമീപിക്കാനാവാത്ത വെളിച്ചത്തിൽ വസിക്കുന്നവനും മനുഷ്യരിൽ ആരും[a] കണ്ടിട്ടില്ലാത്തതും കാണാൻ ആർക്കും കഴിയാത്തതുമായവന്[b] ബഹുമാനവും നിത്യമായ ആധിപത്യവും ഉണ്ടാകട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു മനുഷ്യനും.”
    reason: lexical_alternative
  - marker: b
    text: വിശാലമായ സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ചിലർ ഈ വിവരണവും സ്തുതിയും കർത്താവായ യേശു മശീഹയെ കൂടുതൽ നേരിട്ട് സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കുന്നു; എന്നാൽ അദൃശ്യതയെക്കുറിച്ചുള്ള ഭാഷ ഏറ്റവും സ്വാഭാവികമായി ദൈവത്തെ ചൂണ്ടിക്കാണിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος ἔχων ἀθανασίαν
  choice: അമർത്യത തനിക്കുമാത്രമുള്ളവൻ
  rationale: μόνος എന്നതിന്റെ പ്രത്യേകതയും ἔχων ἀθανασίαν എന്നതിന്റെ ‘അമർത്യത കൈവശമുള്ളവൻ’ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ചു പ്രകടിപ്പിക്കുന്നു; അമർത്യത അവനു മാത്രം സ്വതസിദ്ധമായി ഉള്ളതാണെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: സമീപിക്കാനാവാത്ത വെളിച്ചത്തിൽ വസിക്കുന്നവൻ
  rationale: οἰκῶν എന്നതിന് ‘വസിക്കുന്നവൻ’ എന്നും ἀπρόσιτον എന്നതിന് ‘സമീപിക്കാനാവാത്ത’ എന്നും നൽകി മൂലപാഠത്തിലെ ശക്തമായ അപ്രാപ്യതാബോധം നിലനിർത്തുന്നു.
- source_word: οὐδεὶς ἀνθρώπων
  choice: മനുഷ്യരിൽ ആരും
  rationale: ജനിറ്റീവ് ഘടനയുടെ ഭാഗാത്മക അർഥം (‘മനുഷ്യരിൽ ആരും’) കൃത്യമായും സ്വാഭാവികമായും നൽകുന്നു; ἄνθρωπος ഇവിടെ മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: കാണാൻ കഴിയാത്തവൻ
  rationale: δύναται സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മ ഒഴിവാക്കാതെ, മുൻപുള്ള ‘കണ്ടിട്ടില്ലാത്തവൻ’ എന്ന ബന്ധവാചകത്തോട് സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: τιμὴ
  choice: ബഹുമാനം
  rationale: സ്തുതിവാക്യസന്ദർഭത്തിൽ τιμήയുടെ സാധാരണ അർഥം നൽകുന്നു; ഗ്രീക്കിലെ ക്രിയാരഹിത വാചകം മലയാളത്തിൽ ‘ഉണ്ടാകട്ടെ’ ചേർത്ത് പൂർത്തിയാക്കുന്നു.
- source_word: κράτος αἰώνιον
  choice: നിത്യമായ ആധിപത്യം
  rationale: κράτος വെറും ശക്തിയെയല്ല, പ്രകടമാകുന്ന ഭരണശക്തിയെയും ആധിപത്യത്തെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘ആധിപത്യം’ തിരഞ്ഞെടുത്തു; αἰώνιον ‘നിത്യമായ’ എന്നു നൽകി.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥിരപ്പെട്ട ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ബന്ധവാക്യങ്ങളുടെയും സ്തുതിവാക്യത്തിന്റെയും സൂചിതവ്യക്തി
  choice: മുൻസന്ദർഭത്തിലെ ‘ധന്യനും ഏകാധിപതിയുമായവനെ’—ഏറ്റവും സ്വാഭാവികമായി ദൈവത്തെ—വിവരണം തുടരുന്നതായി പാഠം അവതരിപ്പിക്കുന്നു.
  alternative: വിശാലമായ വാക്യസന്ദർഭത്തിലെ അടുത്ത സൂചിതവ്യക്തിയെ അടിസ്ഥാനമാക്കി ചിലർ ഈ വിവരണവും സ്തുതിയും കർത്താവായ യേശു മശീഹയോട് കൂടുതൽ നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
  rationale: ‘മനുഷ്യരിൽ ആരും കണ്ടിട്ടില്ലാത്തവനും കാണാൻ കഴിയാത്തവനും’ എന്ന അദൃശ്യതാഭാഷ ദൈവത്തെ സൂചിപ്പിക്കുന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും മൂലവാക്യത്തിലെ ബന്ധത്തിന്റെ പരിധി വിവാദമാകാവുന്നതിനാൽ പാദക്കുറിപ്പിൽ മറ്റൊരു വായന സംരക്ഷിക്കുന്നു.
- issue: ἀνθρώπων എന്നതിന്റെ വ്യാപ്തി
  choice: മനുഷ്യരിൽ ആരും
  alternative: ഒരു മനുഷ്യനും
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം ഇവിടെ മനുഷ്യരെ മുഴുവനായി പ്രതിനിധീകരിക്കുന്നു. ‘മനുഷ്യരിൽ ആരും’ എന്നത് ഭാഗാത്മക ഘടനയും സർവമാനവ വ്യാപ്തിയും ഒരുപോലെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ തുടർച്ചയായ ബന്ധവാക്യഘടന കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘ആയ അവന് … ഉണ്ടാകട്ടെ’ എന്ന സ്തുതിവാക്യരൂപം ഉപയോഗിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] അടയാളം ‘immortality’ എന്നതിന് ശേഷം വന്നിരുന്നെങ്കിലും അതിന്റെ പാദക്കുറിപ്പ് οὐδεὶς ἀνθρώπων എന്ന പ്രയോഗത്തിനുള്ള പര്യായമായതിനാൽ, മലയാള മുഖ്യപാഠത്തിൽ അടയാളം അതത് വാക്കിനരികിലേക്ക് മാറ്റി.
