id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: ml
  text: ഓ തിമൊഥെയൊസേ, നിനക്കു ഏൽപ്പിക്കപ്പെട്ട നിക്ഷേപം കാത്തുസൂക്ഷിക്കുക. അപവിത്രമായ അർഥശൂന്യമായ സംസാരങ്ങളിൽനിന്നും ‘ജ്ഞാനം’ എന്ന് വ്യാജമായി വിളിക്കപ്പെടുന്നതിന്റെ വൈരുദ്ധ്യങ്ങളിൽനിന്നും[a][b] ഒഴിഞ്ഞുമാറിക്കൊള്ളുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എതിർവാദങ്ങളിൽനിന്നും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജ്ഞാനം എന്നു പറയപ്പെടുന്നതിന്റെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: ഓ തിമൊഥെയൊസേ
  rationale: Ὦ എന്ന സംബോധനനിപാതത്തിന്റെ ഗൗരവവും നേരിട്ടുള്ള അഭിസംബോധനയും മലയാളത്തിലെ സ്വാഭാവിക സംബോധനരൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: παραθήκην
  choice: നിന്നെ ഏല്പിച്ച നിക്ഷേപം
  rationale: സൂക്ഷിക്കാനായി ഒരാളെ ഏല്പിച്ച വസ്തു എന്ന പദത്തിന്റെ ആശയം വ്യക്തമാക്കുകയും ‘നിക്ഷേപം’ എന്ന രൂപകത്തെ നിലനിർത്തുകയും ചെയ്യുന്നു; അതിന്റെ ഉള്ളടക്കം എന്താണെന്ന് വാക്യം പറയുന്നതിലധികം നിർവചിക്കുന്നില്ല.
- source_word: φύλαξον
  choice: കാത്തുസൂക്ഷിക്കുക
  rationale: ഏല്പിക്കപ്പെട്ടതിനെ ജാഗ്രതയോടെ സംരക്ഷിക്കണമെന്ന ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκτρεπόμενος
  choice: ഒഴിഞ്ഞുമാറുക
  rationale: ഒന്നിൽനിന്ന് തിരിഞ്ഞുമാറുക അഥവാ അതിനെ ഒഴിവാക്കുക എന്ന ക്രിയാചിത്രം വ്യക്തമായി നൽകുന്നു.
- source_word: βεβήλους
  choice: അപവിത്രമായ
  rationale: വിശുദ്ധമായതിനോട് വിപരീതമായി സാധാരണയോ അശുദ്ധമോ ആയത് എന്ന മതപരമായ ഭാവം ‘അപവിത്രമായ’ എന്ന പദം വ്യക്തമാക്കുന്നു.
- source_word: κενοφωνίας
  choice: പൊള്ളവാക്കുകൾ
  rationale: ഉള്ളടക്കമില്ലാത്ത, ഫലശൂന്യമായ സംസാരത്തെ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന സംക്ഷിപ്തമായ ഭാഷയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀντιθέσεις
  choice: വൈരുദ്ധ്യങ്ങൾ
  rationale: പരസ്പരം എതിർത്തുനിൽക്കുന്ന പ്രസ്താവനകളെയോ വാദങ്ങളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സന്ദർഭോചിതമായ വിവർത്തനം; ‘എതിർവാദങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: ‘ജ്ഞാനം’ എന്ന് വ്യാജമായി വിളിക്കപ്പെടുന്നതിന്റെ
  rationale: ഇവിടെ പരാമർശിക്കുന്ന ഉപദേശത്തിന് ‘ജ്ഞാനം’ എന്ന പേര് യഥാർഥത്തിൽ ചേരുന്നില്ലെന്ന ψευδώνυμος എന്ന പദത്തിന്റെ വിധിനിർണയം വ്യക്തമാക്കുന്നു; കൂടുതൽ ചുരുക്കമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: παραθήκη എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘നിന്നെ ഏല്പിച്ച നിക്ഷേപം’ എന്ന് പൊതുവായി വിവർത്തനം ചെയ്തു; അതിന്റെ ഉള്ളടക്കം പ്രത്യേകം നിർവചിച്ചില്ല.
  alternative: സുവിശേഷസന്ദേശം; അപ്പൊസ്തലിക ഉപദേശം; തിമൊഥെയൊസിന് നൽകിയ ശുശ്രൂഷാദൗത്യം
  rationale: ഇത് തിമൊഥെയൊസിന് സുരക്ഷിതമായി സൂക്ഷിക്കാൻ ഏല്പിച്ച ഒന്നാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു. എന്നാൽ പദം തന്നെ അതിന്റെ ഉള്ളടക്കം കൃത്യമായി നിർവചിക്കാത്തതിനാൽ, വിവർത്തനം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ രൂപകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. സംബോധനത്തിന്റെ ഊന്നൽ നിലനിർത്തിയിരിക്കുന്നു; സാങ്കേതികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
