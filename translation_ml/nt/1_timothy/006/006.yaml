id: 1TI.6.6
reference: 1 Timothy 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: ml
  text: എന്നാൽ സംതൃപ്തിയോടുകൂടിയ ദൈവഭക്തി വലിയ നേട്ടമാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വലിയ ലാഭം’ എന്നും ‘നേട്ടത്തിനുള്ള വലിയ മാർഗം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ പദം ലാഭം/നേട്ടം എന്ന ആശയത്തോടു ബന്ധപ്പെട്ടതും മുൻവാക്യത്തിലെ പ്രയോഗത്തെ പ്രതിധ്വനിപ്പിക്കുന്നതുമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്വയംപര്യാപ്തത’ എന്നും പരിഭാഷപ്പെടുത്താം. എന്നാൽ ഇവിടെ സ്വതന്ത്രമായ സ്വാശ്രയത്വത്തേക്കാൾ സംതൃപ്തി അഥവാ ഉള്ളതുകൊണ്ട് മതിയെന്ന മനോഭാവമാണ് ഉദ്ദേശിച്ചിരിക്കാനിടയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ ദൈവഭക്തിയെ ലാഭമാർഗമായി കരുതുന്നതിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിനോട് ഈ വാക്യത്തെ മൃദുവായ വൈരുധ്യബന്ധത്തിൽ ചേർക്കുന്നു.
- source_word: πορισμὸς
  choice: നേട്ടം
  rationale: ‘ലാഭം,’ ‘നേട്ടം,’ അല്ലെങ്കിൽ ‘നേട്ടത്തിനുള്ള മാർഗം’ എന്ന അർഥപരിധിയുള്ള പദമാണിത്. ഇവിടെ ‘നേട്ടം’ എന്ന് നൽകുന്നത് മുൻവാക്യവുമായുള്ള പദപ്രതിധ്വനി നിലനിർത്തുകയും ഭൗതികസമ്പത്ത് മാത്രമാണെന്ന് പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μέγας
  choice: വലിയ
  rationale: അളവിലോ മൂല്യത്തിലോ മഹത്തായതിനെ സൂചിപ്പിക്കുന്ന സാധാരണ സമാനപദം; ‘വലിയ നേട്ടം’ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണ്.
- source_word: εὐσέβεια
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭക്തിയും അതനുസരിച്ചുള്ള ജീവിതവും ഉൾക്കൊള്ളുന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; വെറും ബാഹ്യ മതാചാരമായി ചുരുക്കുന്നില്ല.
- source_word: μετὰ
  choice: -യോടുകൂടിയ
  rationale: ജനിറ്റീവിനോടൊപ്പം വരുന്ന μετά ഇവിടെ സഹവർത്തിത്വമോ കൂടെയുണ്ടാകലോ സൂചിപ്പിക്കുന്നു.
- source_word: αὐταρκείας
  choice: സംതൃപ്തി
  rationale: പദത്തിന് ‘സ്വയംപര്യാപ്തത’ എന്നും അർഥമുണ്ടാകാമെങ്കിലും, തുടർന്നുള്ള വാക്യങ്ങളിൽ അടിസ്ഥാന ആവശ്യങ്ങൾ ലഭിക്കുമ്പോൾ തൃപ്തരാകുന്നതാണ് സന്ദർഭം. അതിനാൽ ദൈവത്തിൽനിന്ന് സ്വതന്ത്രമായ സ്വാശ്രയത്വം സൂചിപ്പിക്കാതെ ‘സംതൃപ്തി’ തിരഞ്ഞെടുക്കുന്നു.
theological_decisions:
- issue: ക്രിസ്തീയ സന്ദർഭത്തിൽ αὐτάρκεια എന്ന പദത്തിന്റെ അർഥം
  choice: സംതൃപ്തി
  alternative: സ്വയംപര്യാപ്തത; പര്യാപ്തത
  rationale: 6:7–8-ലെ സമീപസന്ദർഭം ഭക്ഷണവും വസ്ത്രവും ഉണ്ടെങ്കിൽ തൃപ്തരാകുന്നതിനെക്കുറിച്ചാണ്; ദൈവത്തിൽനിന്നുള്ള സ്വതന്ത്രതയെ ഉയർത്തിപ്പിടിക്കുന്ന തത്ത്വചിന്താപരമായ സ്വാശ്രയത്വമല്ല.
- issue: ദൈവഭക്തിയും നേട്ടവും തമ്മിലുള്ള ബന്ധം
  choice: സംതൃപ്തിയോടുകൂടിയ ദൈവഭക്തി തന്നെയാണ് വലിയ നേട്ടം
  alternative: സംതൃപ്തിയോടുകൂടുമ്പോൾ ദൈവഭക്തി വലിയ നേട്ടത്തിനുള്ള മാർഗമാണ്
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടു ധാരണകൾക്കും ഇടനൽകുന്നു. മുഖ്യവാചകത്തിലെ സംക്ഷിപ്ത രൂപം മുൻവാക്യത്തിലെ പദപ്രതിധ്വനി നിലനിർത്തുകയും പ്രയോജനത്തിനുവേണ്ടിയുള്ള മതഭക്തിയെ പൗലോസ് അംഗീകരിക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു; മറ്റുവായന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സംതൃപ്തിയോടുകൂടിയ’ എന്ന സംയുക്തപ്രയോഗം ഗ്രീക്കിലെ സഹവർത്തിത്വബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു; ‘ദൈവഭക്തി’ സഭാപരമായ പരിചിതത്വമുള്ളതായിരിക്കുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്.
