id: 1TI.6.5
reference: 1 Timothy 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: ml
  text: മനസ്സ് ദുഷിപ്പിക്കപ്പെട്ടവരും സത്യത്തിൽനിന്ന് വഞ്ചിക്കപ്പെട്ടവരും ദൈവഭക്തി ലാഭത്തിനുള്ള ഒരു മാർഗമാണെന്ന്[b] കരുതുന്നവരുമായ ആളുകൾക്കിടയിലെ നിരന്തരമായ ഉരസലുകൾ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തീരാത്ത കലഹങ്ങൾ’ അല്ലെങ്കിൽ ‘തുടർച്ചയായ വാക്കുതർക്കങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ആളുകൾ നിരന്തരം പരസ്പരം ഉരസുന്നതുപോലുള്ള സംഘർഷത്തെ ചിത്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവഭക്തിതന്നെ ലാഭമാണെന്ന്’ അല്ലെങ്കിൽ ‘ദൈവഭക്തി ലാഭത്തിന്റെ ഉറവിടമാണെന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ദൈവത്തോടുള്ള ഭക്തിയെ ഭൗതിക നേട്ടത്തിനായി ഉപയോഗിക്കാവുന്ന ഒന്നായി അവർ കാണുന്നു എന്നതാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: നിരന്തരമായ ഉരസലുകൾ
  rationale: തുടർച്ചയായി പരസ്പരം ഉരസുന്നതിൽനിന്നുണ്ടാകുന്ന സംഘർഷം എന്ന അപൂർവ ഗ്രീക്ക് പദത്തിന്റെ രൂപകവും നിരന്തരതയും നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് തീരാത്ത തർക്കങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: διεφθαρμένων
  choice: മനസ്സു ദുഷിച്ചവർ
  rationale: പൂർണമായ ക്രിയാരൂപം ദുഷിപ്പിക്കപ്പെട്ടതിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ദുഷിച്ച’ എന്നത് അനാവശ്യമായ സിദ്ധാന്തപരമായ തീവ്രത ചേർക്കാതെ ധാർമ്മികവും ബൗദ്ധികവുമായ തകർച്ച പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν νοῦν
  choice: മനസ്സ്
  rationale: νοῦς എന്ന പദത്തിന്റെ ചിന്താശേഷിയെയും ധാർമ്മിക വിവേചനത്തെയും ഉൾക്കൊള്ളുന്ന സാധാരണയും സ്വാഭാവികവുമായ മലയാള പദമാണ്.
- source_word: ἀπεστερημένων
  choice: നഷ്ടപ്പെട്ടവർ
  rationale: സത്യത്തിൽനിന്ന് വഞ്ചിതരായി ഇപ്പോൾ അത് കൈവശമില്ലാത്ത അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ പൂർണരൂപത്തിന്റെ ഫലാവസ്ഥ നിലനിർത്തുന്നു.
- source_word: τῆς ἀληθείας
  choice: സത്യം
  rationale: ഇവിടെ പൊതുവായ സത്യസന്ധതയല്ല, നിർദിഷ്ടമായ സത്യമാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ ഈ നിർദിഷ്ടത സന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νομιζόντων
  choice: കരുതുന്നു
  rationale: അവരുടെ തെറ്റായ ധാരണയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; അതു തെറ്റാണെന്ന വിലയിരുത്തൽ സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു.
- source_word: πορισμὸν
  choice: ലാഭത്തിനുള്ള ഒരു മാർഗം
  rationale: പദത്തിന് ‘ലാഭം’ എന്നും ‘ലാഭം നേടാനുള്ള മാർഗം’ എന്നും അർഥമാകാം. ഇവിടെ ദൈവഭക്തിയെ സ്വാർഥലാഭത്തിനായി ഉപയോഗിക്കുന്ന ഉപാധിയായി കാണുന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: εὐσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ആദരവിൽ അധിഷ്ഠിതമായ ജീവിതം എന്ന പദത്തിന്റെ അനുകൂല അർഥം നിലനിർത്തുന്നു; തെറ്റ് ദൈവഭക്തിയിലല്ല, അതിനെ ലാഭോപാധിയായി കാണുന്നതിലാണ്.
theological_decisions:
- issue: εὐσέβεια യഥാർഥ ദൈവഭക്തിയെയാണോ വെറും ബാഹ്യ മതാചാരത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ദൈവഭക്തി
  alternative: മതാചാരം; ഭക്തി
  rationale: ഗ്രീക്ക് പദം സ്വതവേ അനുകൂലമാണ്. അതിനെ ‘മതാചാരം’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം പ്രതികൂലമാക്കാതെ, ആളുകളുടെ ലാഭേച്ഛയുള്ള സമീപനത്തിലാണ് ദുരുപയോഗമെന്ന് വാക്യം വ്യക്തമാക്കുന്നു.
- issue: διεφθαρμένων എന്നതിലെ ധാർമ്മിക കുറ്റവിധി എത്ര ശക്തമായി പ്രകടിപ്പിക്കണം
  choice: മനസ്സു ദുഷിച്ചവർ
  alternative: മനസ്സിൽ അധഃപതിച്ചവർ; മനസ്സ് നശിച്ചവർ
  rationale: വാക്യത്തിന്റെ ശക്തമായ കുറ്റവിധി നിലനിർത്തുമ്പോഴും, മൂലപദത്തേക്കാൾ തീവ്രമായ പിൽക്കാല സിദ്ധാന്തപരമായ അർഥം ചേർക്കുന്നില്ല.
- issue: πορισμός ലാഭത്തെയോ ലാഭം നേടാനുള്ള ഉപാധിയെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ലാഭത്തിനുള്ള ഒരു മാർഗം
  alternative: ലാഭം; ലാഭത്തിന്റെ ഉറവിടം
  rationale: നാമത്തിന്റെ ഇരുവിധ സാധ്യതകളും അംഗീകരിക്കാം. ഈ സന്ദർഭത്തിൽ ദൈവഭക്തിയെ ചൂഷണം ചെയ്യാവുന്ന ഉപാധിയായി കാണുന്ന ആശയം പ്രധാന പാഠത്തിൽ വ്യക്തമായി നൽകുന്നു; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. അപൂർവമായ ഗ്രീക്ക് രൂപകം ‘ഉരസലുകൾ’ എന്നതിലൂടെ നിലനിർത്തി, അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. വാക്യം വലിയ പട്ടികയുടെ ഭാഗമായതിനാൽ അവസാനത്തെ ഡാഷ് അനുബന്ധ വിവരണം സുഗമമായി ബന്ധിപ്പിക്കുന്നു.
