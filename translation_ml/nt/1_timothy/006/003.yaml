  source_fidelity: മൂലത്തിലെ നിബന്ധനാഭാഗം, ἑτεροδιδασκαλεῖ-യുടെ ‘വ്യത്യസ്തമായ ഉപദേശം പഠിപ്പിക്കുക’ എന്ന ആശയം, ὑγιαίνουσι λόγοις-ലെ ആരോഗ്യരൂപകം, കർത്താവായ യേശുവിനോടുള്ള ജനിറ്റീവ് ബന്ധം, κατὰ εὐσέβειαν-ലെ അനുരൂപത എന്നിവ കരടിൽ നന്നായി പ്രതിഫലിക്കുന്നു. προσέρχεται ഇവിടെ ‘യോജിക്കുക/സ്വീകരിക്കുക/പറ്റിനിൽക്കുക’ എന്ന ആശയമാണു നൽകുന്നത്; ‘യോജിക്കാതിരിക്കുക’ ആ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
  naturalness: ‘ചേർന്നുനിൽക്കാതിരിക്കുക’ മനസ്സിലാക്കാവുന്നതാണെങ്കിലും വചനങ്ങളോടും ഉപദേശത്തോടും എന്ന ദ്വന്ദ്വ ദത്തിവിനോടു ‘യോജിക്കാതിരിക്കുക’ കൂടുതൽ സ്വാഭാവികമാണ്. ‘മശീഹാ’ എന്ന രൂപത്തിനു ജനിറ്റീവ് പ്രത്യയം ചേർക്കുമ്പോൾ ‘മശീഹായുടെ’ എന്നതാണ് വ്യാകരണപരമായി സുഗമം.
