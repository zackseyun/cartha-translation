id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: ml
  text: ആരെങ്കിലും വ്യത്യസ്തമായ ഒരു ഉപദേശം പഠിപ്പിക്കുകയും നമ്മുടെ കർത്താവായ യേശു മശീഹായുടെ[a] ആരോഗ്യകരമായ വചനങ്ങളോടും[b] ദൈവഭക്തിക്കു യോജിച്ച ഉപദേശത്തോടും യോജിക്കാതിരിക്കുകയും ചെയ്യുന്നെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: ‘യേശുക്രിസ്തുവിന്റെ.’ ഗ്രീക്കിലെ Χριστός എന്നത് ‘മശീഹാ’ എന്ന പദവിയാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ‘ആരോഗ്യകരമായ’ എന്നത് ഗ്രീക്കിലെ ആരോഗ്യരൂപകം നിലനിർത്തുന്നു; ഇവിടെ അർഥം ശുദ്ധവും വിശ്വാസയോഗ്യവുമായ എന്നാണ്.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: വ്യത്യസ്തമായ ഉപദേശം പഠിപ്പിക്കുന്നു
  rationale: അംഗീകരിക്കപ്പെട്ട ഉപദേശത്തിൽനിന്നു വ്യത്യസ്തമായത് പഠിപ്പിക്കുക എന്ന സംയുക്തക്രിയയുടെ അർഥം വ്യക്തമാക്കുന്നു; മൂലത്തിൽ നേരിട്ട് ഇല്ലാത്ത ‘വ്യാജ’ എന്ന വിലയിരുത്തൽ ചേർക്കുന്നില്ല.
- source_word: προσέρχεται
  choice: ചേർന്നുനിൽക്കുന്നു
  rationale: അക്ഷരാർഥമായ ‘അടുത്തുവരുന്നു’ എന്നതിനു പകരം, ഇവിടെ ഉപദേശം സ്വീകരിച്ച് അതിനോടു പറ്റിനിൽക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑγιαίνουσι λόγοις
  choice: ആരോഗ്യകരമായ വചനങ്ങൾ
  rationale: ὑγιαίνω എന്ന പദത്തിലെ ആരോഗ്യത്തിന്റെ രൂപകം നിലനിർത്തുകയും λόγοις എന്നതിനെ പൊതുവായ ‘ഉപദേശം’ എന്നു ലയിപ്പിക്കാതെ ‘വചനങ്ങൾ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ
  rationale: വചനങ്ങൾ കർത്താവായ യേശുവിന്റേതോ അവിടുന്നിൽനിന്നുള്ളതോ ആണെന്ന ജനിറ്റീവ് ബന്ധം മലയാളത്തിലെ ഉടമസ്ഥരൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: ഇവിടെ വ്യക്തിനാമത്തോടൊപ്പം വരുന്ന അഭിഷിക്തനായ രാജാവിന്റെ പദവിയർഥം സജീവമായതിനാൽ ലിപ്യന്തരണമായ ‘ക്രിസ്തു’വിനു പകരം ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
- source_word: κατ’ εὐσέβειαν
  choice: ദൈവഭക്തിക്കു ചേർന്ന
  rationale: κατά ഇവിടെ അനുരൂപതയെയോ പൊരുത്തത്തെയോ സൂചിപ്പിക്കുന്നു. ഉപദേശം ദൈവഭക്തി നിർബന്ധമായും ഉളവാക്കുന്നു എന്ന കാരണബന്ധം കൂട്ടിച്ചേർക്കാതെ അതിനൊത്തതാണെന്ന ആശയം നൽകുന്നു.
- source_word: διδασκαλίᾳ
  choice: ഉപദേശം
  rationale: പഠിപ്പിക്കുന്ന പ്രവൃത്തിയെയും പഠിപ്പിക്കപ്പെടുന്ന ഉള്ളടക്കത്തെയും സൂചിപ്പിക്കാവുന്ന പദത്തിന് ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: εὐσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ആദരവും അതിനൊത്ത ജീവിതവും ഉൾക്കൊള്ളുന്ന പാസ്റ്ററൽ ലേഖനങ്ങളിലെ ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പദവിയർഥം
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός എന്നത് ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന പദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യപാഠത്തിൽ അതിന്റെ അർഥം തെളിയിക്കുന്നു; പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: κατ’ εὐσέβειαν എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ദൈവഭക്തിക്കു ചേർന്ന
  alternative: ദൈവഭക്തിയിലേക്കു നയിക്കുന്ന
  rationale: മൂലത്തിലെ κατά പൊരുത്തം വ്യക്തമാക്കുന്നു; ഉപദേശം ദൈവഭക്തി ഉളവാക്കുന്നു എന്ന സാദ്ധ്യമായെങ്കിലും ഇവിടെ വ്യക്തമല്ലാത്ത കാരണാർഥം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ആധുനിക പ്രമാണമലയാളം ഉപയോഗിച്ചു. ‘പഥ്യവചനങ്ങൾ’ പോലുള്ള പഴയ പ്രയോഗം ഒഴിവാക്കി ആരോഗ്യരൂപകം ‘ആരോഗ്യകരമായ വചനങ്ങൾ’ എന്നു തുറന്നുവച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന നിബന്ധനാഭാഗമായതിനാൽ അവസാനം കോമ നിലനിർത്തി.
