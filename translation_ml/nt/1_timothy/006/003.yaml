  rationale: പാഠത്തിന്റെ അർഥം മാറ്റാതെ, ‘മശീഹാ’യുടെ ജനിറ്റീവ് രൂപം ‘മശീഹായുടെ’ എന്നാക്കി തിരുത്തി. കൂടാതെ, രണ്ടുസമാന്തര ദത്തിവിഭക്തി ഘടകങ്ങളോടും προσέρχεται-യുടെ സന്ദർഭാർഥം കൂടുതൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ചേർന്നുനിൽക്കാതിരിക്കുക’ എന്നത് ‘യോജിക്കാതിരിക്കുക’ എന്നാക്കി. വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ അവസാന കോമ നിലനിർത്തിയിരിക്കുന്നു.
