revisions:
- from: അവന്റെ സ്വന്തം നിശ്ചിതകാലങ്ങളിൽ അതിനെ വെളിപ്പെടുത്തുന്നവൻ—ധന്യനും ഏക പരമാധികാരിയുമായവൻ, വാഴുന്നവരുടെ രാജാവും ഭരിക്കുന്നവരുടെ കർത്താവും[a]—
  to: അവൻ തന്റെ സ്വന്തം നിശ്ചിതകാലങ്ങളിൽ അതിനെ വെളിപ്പെടുത്തും—ധന്യനും ഏക പരമാധികാരിയുമായവൻ, വാഴുന്നവരുടെ രാജാവും ഭരിക്കുന്നവരുടെ കർത്താവും[a]—
  rationale: വെളിപ്പെടുത്തുന്നവൻ എന്ന രൂപം മാറ്റി വെളിപ്പെടുത്തും എന്ന ഭാവികാല ക്രിയ ഉപയോഗിച്ചു; ഇതിലൂടെ δείξειയുടെ കാലവും വാക്യത്തിന്റെ അർഥവും വ്യക്തമായി നിലനിർത്തുന്നു. വ്യക്തിനാമമോ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലോ ചേർക്കാതെ, തുടർന്നുള്ള വിശേഷണങ്ങൾ വിഷയത്തെ ഗ്രീക്കിലെപ്പോലെ വ്യക്തമാക്കുന്നു. നിലവിലുള്ള അടിക്കുറിപ്പ് അതിന്റെ ശരിയായ വാചകഭാഗത്ത് തന്നെ നിലനിർത്തിയിരിക്കുന്നു.
