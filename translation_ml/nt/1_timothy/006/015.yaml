id: 1TI.6.15
reference: 1 Timothy 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: ml
  text: അവൻ തന്റെ സ്വന്തം നിശ്ചിതകാലങ്ങളിൽ അതിനെ വെളിപ്പെടുത്തും—ധന്യനും ഏക പരമാധികാരിയുമായവൻ, വാഴുന്നവരുടെ രാജാവും ഭരിക്കുന്നവരുടെ കർത്താവും[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത പരിഭാഷ: “രാജാക്കന്മാരുടെ രാജാവും കർത്താക്കന്മാരുടെ കർത്താവും.” ഗ്രീക്കിൽ കൃദന്തരൂപങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അക്ഷരാർഥത്തിൽ, “വാഴുന്നവരുടെ രാജാവും ഭരിക്കുന്നവരുടെ കർത്താവും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: അതിനെ
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ ഈ ബന്ധസർവനാമം മുൻവാക്യത്തിലെ ἐπιφάνειαν (‘പ്രത്യക്ഷത’) എന്ന പദത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ അതിനെ വസ്തുസൂചകമായി വ്യക്തമാക്കുന്നു.
- source_word: καιροῖς ἰδίοις
  choice: അവന്റെ സ്വന്തം നിശ്ചിതകാലങ്ങളിൽ
  rationale: ബഹുവചനവും ദൈവം നിശ്ചയിച്ച സമയങ്ങൾ എന്ന ആശയവും നിലനിർത്തുന്നു; ‘നിശ്ചിത’ എന്നത് καιρός എന്ന പദത്തിന്റെ യോജിച്ച/നിയുക്ത സമയഭാവം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δείξει
  choice: വെളിപ്പെടുത്തുന്നവൻ
  rationale: ഭാവികാലക്രിയയുടെ അർഥം ബന്ധവാക്യത്തിൽ സ്വാഭാവിക മലയാളരീതിയിൽ നൽകുന്നു; പ്രത്യക്ഷതയെ പരസ്യമായി ദൃശ്യമാക്കുക എന്ന ആശയം സൂക്ഷിക്കുന്നു.
- source_word: ὁ μακάριος καὶ μόνος δυνάστης
  choice: ധന്യനും ഏക പരമാധികാരിയുമായവൻ
  rationale: μακάριος എന്ന ദൈവിക വിശേഷണം ‘ധന്യൻ’ എന്നും δυνάστης എന്ന പരമമായ ഭരണാധികാരം ‘പരമാധികാരി’ എന്നും മാന്യവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ὁ βασιλεὺς τῶν βασιλευόντων
  choice: വാഴുന്നവരുടെ രാജാവ്
  rationale: ‘രാജാക്കന്മാരുടെ രാജാവ്’ എന്ന പരമ്പരാഗത പ്രയോഗത്തിലേക്ക് ഒതുക്കാതെ βασιλευόντων എന്ന കൃദന്തരൂപത്തിന്റെ ‘വാഴുന്നവർ’ എന്ന ക്രിയാത്മക ഭാവം നിലനിർത്തുന്നു.
- source_word: κύριος τῶν κυριευόντων
  choice: ഭരിക്കുന്നവരുടെ കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന് ‘കർത്താവ്’ എന്ന ശീർഷകവും κυριευόντων എന്ന കൃദന്തരൂപത്തിന് ‘ഭരിക്കുന്നവർ’ എന്ന ക്രിയാത്മക അർഥവും നൽകുന്നു.
theological_decisions:
- issue: പ്രത്യക്ഷത വെളിപ്പെടുത്തുന്നവന്റെ വ്യക്തമായ തിരിച്ചറിയൽ
  choice: ഗ്രീക്കിലെപ്പോലെ കർത്താവിന്റെ പേര് ചേർക്കാതെ ദൈവിക ശീർഷകങ്ങളിലൂടെ മാത്രം അവതരിപ്പിച്ചു.
  alternative: സന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘പിതാവായ ദൈവം’ എന്ന് വ്യക്തമാക്കുക.
  rationale: മൂലവാക്യം വ്യക്തിനാമം നൽകാതെ ഉന്നതമായ ശീർഷകങ്ങളാൽ വിഷയത്തെ തിരിച്ചറിയിക്കുന്നു; വിവർത്തനം ആ ദൈവശാസ്ത്രപരമായ അവതരണവും സന്ദർഭത്തിലെ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള ആരാധനാപരമായ ശൈലി. വാക്യം 14-ാം വാക്യത്തിൽനിന്ന് തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമം നൽകിയിട്ടില്ല. ‘നിശ്ചിതകാലങ്ങളിൽ’ എന്ന പ്രയോഗം കാലങ്ങളുടെ ബഹുവചനവും അവ ദൈവനിയുക്തമാണെന്ന സൂചനയും നിലനിർത്തുന്നു.
