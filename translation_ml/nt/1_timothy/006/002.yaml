id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: ml
  text: വിശ്വാസികളായ യജമാനന്മാരുള്ളവർ, അവർ സഹോദരന്മാരാണ് എന്ന കാരണത്താൽ അവരെ അവജ്ഞയോടെ കാണരുത്; മറിച്ച്, പ്രയോജനം ലഭിക്കുന്നവർ[a] വിശ്വാസികളും പ്രിയപ്പെട്ടവരുമാകയാൽ, അവരെ ഇനിയും അധികമായി സേവിക്കണം. ഇവ പഠിപ്പിക്കുകയും ഉദ്ബോധിപ്പിക്കുകയും ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പ്രയോജനം ലഭിക്കുന്നവർ” എന്ന ഗ്രീക്ക് പ്രയോഗം വ്യാഖ്യാനിക്കാൻ ദുഷ്കരമാണ്. ഇവിടെ വിശ്വാസികളായ യജമാനന്മാർ അടിമകളുടെ സേവനത്തിൽനിന്ന് പ്രയോജനം ലഭിക്കുന്നവരാണെന്ന വായനയാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: വിശ്വാസികളായ
  rationale: ഇവിടെ വിശ്വസനീയർ എന്നല്ല, ക്രിസ്തുവിൽ വിശ്വസിക്കുന്ന യജമാനന്മാർ എന്നാണ് സന്ദർഭാർത്ഥം.
- source_word: δεσπότας
  choice: യജമാനന്മാർ
  rationale: അടിമത്തവുമായി ബന്ധപ്പെട്ട ഗൃഹസാമൂഹിക പശ്ചാത്തലത്തിൽ അധികാരവും ഉടമസ്ഥതയും ഉള്ളവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: καταφρονείτωσαν
  choice: നിന്ദിക്കരുത്
  rationale: അവജ്ഞയോടെ കാണുക, വിലകുറച്ചുകാണുക എന്നീ ശക്തമായ അർത്ഥങ്ങൾ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; ഇവിടെ സഹവിശ്വാസികളെന്ന കുടുംബബന്ധമാണ് ഉദ്ദേശ്യം.
- source_word: μᾶλλον δουλευέτωσαν
  choice: കൂടുതൽ നന്നായി സേവിക്കട്ടെ
  rationale: അടിമയുടെ നിലയിൽ സേവിക്കുക എന്ന δουλεύωയുടെ സന്ദർഭാർത്ഥവും μᾶλλον നൽകുന്ന വർധിത ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πιστοί
  choice: വിശ്വാസികൾ
  rationale: ക്രിസ്തുവിൽ വിശ്വസിക്കുന്നവരെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ἀγαπητοὶ
  choice: പ്രിയപ്പെട്ടവർ
  rationale: ക്രൈസ്തവ സമൂഹത്തിലെ സ്നേഹബന്ധത്തിന്റെ ഭാരം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ആ നന്മയുടെ പ്രയോജനം ലഭിക്കുന്നവർ
  rationale: പ്രയോജനം അനുഭവിക്കുന്നവരെന്ന സാധ്യതയേറിയ അർത്ഥം നൽകുമ്പോഴും ദുഷ്കരമായ ഗ്രീക്ക് പ്രയോഗത്തെ അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: ഇവ പഠിപ്പിക്കുകയും പ്രബോധിപ്പിക്കുകയും ചെയ്യുക
  rationale: തിമൊഥെയൊസിനോടുള്ള രണ്ടു വർത്തമാനകാല ആജ്ഞകളുടെയും പഠിപ്പിക്കൽ, ശക്തമായി ഉദ്ബോധിപ്പിക്കൽ എന്നീ ഭാവങ്ങൾ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പദത്തിന്റെ ലിംഗവും സഭാസംബന്ധിയായ വ്യാപ്തിയും
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: മൂലത്തിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; യജമാനന്മാരെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ പുല്ലിംഗരൂപം സ്വാഭാവികവുമാണ്.
- issue: അടിമത്തത്തിന്റെ സാമൂഹിക പശ്ചാത്തലം
  choice: യജമാനന്മാർ ... സേവിക്കട്ടെ
  alternative: ഉടമകൾ ... അടിമവേല ചെയ്യട്ടെ
  rationale: δεσπότης സൂചിപ്പിക്കുന്ന അധികാരബന്ധം മറച്ചുവയ്ക്കാതെ, δουλεύωയെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ഈ വാക്യത്തിൽ δοῦλος എന്ന നാമം നേരിട്ട് ഇല്ല.
- issue: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι ആരെ സൂചിപ്പിക്കുന്നു
  choice: നന്മയുടെ പ്രയോജനം ലഭിക്കുന്ന വിശ്വാസികളായ യജമാനന്മാർ
  alternative: നന്മ ചെയ്യുന്നതിൽ ഏർപ്പെട്ട വിശ്വാസികളായ അടിമകൾ; അല്ലെങ്കിൽ ഇരുകൂട്ടരും പങ്കിടുന്ന പ്രയോജനം
  rationale: സന്ദർഭത്തിലും വാക്യഘടനയിലും യജമാനന്മാരാണ് അടിമകളുടെ മെച്ചപ്പെട്ട സേവനത്തിന്റെ ഗുണഭോക്താക്കൾ എന്ന വായന കൂടുതൽ സാധ്യതയുള്ളത്; എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ദുഷ്കരത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ ആജ്ഞാഭാവവും സാമൂഹിക യാഥാർഥ്യവും നിലനിർത്തി; ദുഷ്കരമായ അവസാന കാരണവാക്യത്തെ അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
