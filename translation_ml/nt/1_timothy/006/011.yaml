id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: ml
  text: എന്നാൽ ദൈവപുരുഷനായ നീ ഈ കാര്യങ്ങളിൽനിന്ന് ഓടിയകലുക; നീതി[a], ദൈവഭക്തി, വിശ്വാസം[b], സ്നേഹം, സഹിഷ്ണുത, സൗമ്യത[c] എന്നിവ പിന്തുടരുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീതിനിഷ്ഠ’.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വിശ്വസ്തത’ അല്ലെങ്കിൽ ‘ആശ്രയം’.
    reason: lexical_alternative
  - marker: c
    text: ഈ അപൂർവ ഗ്രീക്കുപദം ‘മൃദുസ്വഭാവം’, ‘സഹിഷ്ണുതയോടുകൂടിയ സൗമ്യത’, അല്ലെങ്കിൽ ‘ക്ഷമാപൂർവമായ സൗമ്യത’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: എന്നാൽ ... നീ
  rationale: മുൻവിവരണത്തോടുള്ള ശക്തമായ വൈരുധ്യവും ഊന്നിപ്പറഞ്ഞ രണ്ടാംപുരുഷ ഏകവചനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: ദൈവപുരുഷനായ
  rationale: തിമൊഥെയൊസിനോടുള്ള പുല്ലിംഗ ഏകവചന അഭിസംബോധനയും തിരുവെഴുത്തിലെ അംഗീകൃത വിശേഷണവും സംരക്ഷിക്കുന്നു.
- source_word: ταῦτα φεῦγε
  choice: ഈ കാര്യങ്ങളിൽനിന്ന് ഓടിയകലുക
  rationale: മുമ്പ് പറഞ്ഞ ദോഷങ്ങളെയും ധനമോഹജന്യ തെറ്റുകളെയും സൂചിപ്പിക്കുകയും φεῦγε എന്ന ആജ്ഞയുടെ അടിയന്തരതയും ശക്തിയും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: δίωκε
  choice: പിന്തുടരുക
  rationale: തിന്മയിൽനിന്ന് അകലുന്നതിന് വിപരീതമായി സദ്ഗുണങ്ങളെ സജീവമായി തേടണമെന്ന ആശയം നൽകുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: ധാർമ്മികവും ബന്ധപരവുമായ ശരിതനിമയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; ‘നീതിനിഷ്ഠ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εὐσέβειαν
  choice: ദൈവഭക്തി
  rationale: ദൈവത്തോടുള്ള ഭക്തിയിൽ അധിഷ്ഠിതമായ ജീവിതത്തെ വ്യക്തവും സ്ഥാപിതവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണ അർഥം നിലനിർത്തുന്നു; സദ്ഗുണപ്പട്ടികയിൽ ‘വിശ്വസ്തത’ എന്ന അർഥവും സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ സാധാരണ മലയാളപരിഭാഷ.
- source_word: ὑπομονήν
  choice: സഹിഷ്ണുത
  rationale: സമ്മർദത്തിലും കഷ്ടതയിലും ഉറച്ചുനിൽക്കുന്ന ക്ഷമാപൂർവമായ നിലനിൽപ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πραϋπαθίαν
  choice: സൗമ്യത
  rationale: അപൂർവമായ ഈ ഗ്രീക്കുപദത്തിലെ മൃദുത്വവും ക്ഷമാപൂർവമായ ആത്മനിയന്ത്രണവും വായനാസൗകര്യത്തോടെ നൽകുന്നു; കൂടുതൽ സൂക്ഷ്മമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὦ ἄνθρωπε θεοῦ എന്നതിലെ ലിംഗസൂചക അഭിസംബോധന
  choice: ദൈവപുരുഷനായ
  alternative: ദൈവത്തിന്റെ മനുഷ്യനായ
  rationale: ഇത് തിമൊഥെയൊസിനോടുള്ള വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചന അഭിസംബോധനയാണ്; അതിനാൽ ലിംഗസൂചന നിഷ്പക്ഷമാക്കി മാറ്റാതെ സംരക്ഷിച്ചു.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: നീതി
  alternative: നീതിനിഷ്ഠ
  rationale: സദ്ഗുണപ്പട്ടികയിൽ ധാർമ്മികമായ ശരിതനിമയാണ് മുഖ്യമായി തോന്നുന്നതെങ്കിലും, പദത്തിന്റെ അർഥവ്യാപ്തി ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- issue: സദ്ഗുണപ്പട്ടികയിലെ πίστις
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത അഥവാ ആശ്രയം
  rationale: ‘വിശ്വാസം’ മുഖ്യപരിഭാഷയായി നിലനിർത്തുമ്പോഴും സന്ദർഭത്തിൽ വിശ്വസ്തതയെന്ന അർഥസാധ്യതയും അംഗീകരിക്കുന്നു.
- issue: അപൂർവപദമായ πραϋπαθία
  choice: സൗമ്യത
  alternative: സൗമ്യമായ ക്ഷമ അഥവാ ദീർഘക്ഷമ
  rationale: കൃത്യമായ അർഥനിർണയം ദുഷ്കരമായതിനാൽ വായനാസൗകര്യമുള്ള മുഖ്യപദം ഉപയോഗിച്ച് അപൂർവപദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രണ്ട് വിരുദ്ധ ആജ്ഞകളുടെ ശക്തി നിലനിർത്താൻ ‘ഓടിയകലുക’ എന്നും ‘പിന്തുടരുക’ എന്നും ഉപയോഗിച്ചു; സാങ്കേതികമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
