id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: ml
  text: വിശ്വാസത്തിന്റെ നല്ല പോരാട്ടം പോരാടുക[a]. നീ വിളിക്കപ്പെട്ട ആ നിത്യജീവനെ മുറുകെപ്പിടിക്കുക; അനേകം സാക്ഷികളുടെ മുമ്പാകെ നീ നല്ല ഏറ്റുപറച്ചിൽ നടത്തുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിശ്വാസം കൊണ്ടു സവിശേഷമാകുന്ന നല്ല പോരാട്ടം പോരാടുക.’ ഗ്രീക്ക് പദപ്രയോഗം ക്രിസ്തീയ വിശ്വാസത്തിനായുള്ള പോരാട്ടത്തെയോ വിശ്വാസം സവിശേഷമാക്കുന്ന പോരാട്ടത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നീ വിളിക്കപ്പെട്ട ആ നിത്യജീവനെ മുറുകെപ്പിടിക്കുക; അതിനെക്കുറിച്ച് നീ അനേകം സാക്ഷികളുടെ മുമ്പാകെ നല്ല ഏറ്റുപറച്ചിൽ നടത്തി.’ ഗ്രീക്ക് പാഠം ഏറ്റുപറച്ചിലിന്റെ ഉള്ളടക്കം വ്യക്തമായി പറയുന്നില്ല; എങ്കിലും അത് നിത്യജീവനിലേക്കുള്ള വിളിയുമായി അടുത്ത് ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: നല്ല പോരാട്ടം പോരാടുക
  rationale: മൂലത്തിലെ ഒരേ പദകുടുംബത്തിൽപ്പെട്ട ക്രിയയുടെയും നാമത്തിന്റെയും ആവർത്തനം നിലനിർത്തുന്നു. വർത്തമാനകാല ആജ്ഞ തുടർന്നുകൊണ്ടിരിക്കുന്ന സജീവമായ പോരാട്ടത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: τῆς πίστεως
  choice: വിശ്വാസത്തിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ബന്ധം നിർവചിച്ചുതീർക്കാതെ നിലനിർത്തുന്നു; ഇത് ക്രിസ്തീയ വിശ്വാസത്തിനായുള്ള പോരാട്ടമായോ വിശ്വാസം സവിശേഷമാക്കുന്ന പോരാട്ടമായോ ഗ്രഹിക്കാം.
- source_word: ἐπιλαβοῦ
  choice: മുറുകെപ്പിടിക്കുക
  rationale: ദൃഢമായും നിർണായകമായും കൈക്കൊള്ളുക എന്ന രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ പകർന്നുനൽകുന്നു.
- source_word: τῆς αἰωνίου ζωῆς
  choice: നിത്യജീവനെ
  rationale: സുവിശേഷത്തിൽ വാഗ്ദാനം ചെയ്യപ്പെട്ട നിർദിഷ്ടമായ ജീവനെ സൂചിപ്പിക്കുന്ന പദപ്രയോഗം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: εἰς ἣν ἐκλήθης
  choice: നീ വിളിക്കപ്പെട്ട
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യം മലയാളത്തിലെ ബന്ധവാക്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; വിളിയുടെ പ്രവർത്തകനെ പാഠം വ്യക്തമാക്കാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: നല്ല ഏറ്റുപറച്ചിൽ
  rationale: പൊതുവായ അംഗീകാരമോ പ്രഖ്യാപനമോ എന്ന ὁμολογίαയുടെ അർഥം നിലനിർത്തുന്നു; ഏറ്റുപറച്ചിലിന്റെ കൃത്യമായ ഉള്ളടക്കം പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: അനേകം സാക്ഷികളുടെ മുമ്പാകെ
  rationale: പലരുടെയും സാന്നിധ്യത്തിൽ നടന്ന പരസ്യമായ ഏറ്റുപറച്ചിൽ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; μάρτυρες എന്നത് ഇവിടെ ‘രക്തസാക്ഷികൾ’ എന്ന പിൽക്കാല സാങ്കേതിക അർഥത്തിലല്ല.
- source_word: καὶ ὡμολόγησας
  choice: അതിനെക്കുറിച്ചാണ് നീ … ഏറ്റുപറച്ചിൽ നടത്തിയത്
  rationale: വിളിക്കപ്പെട്ട നിത്യജീവനും പരസ്യ ഏറ്റുപറച്ചിലും തമ്മിലുള്ള സന്ദർഭബന്ധം വായനാസൗകര്യത്തിനായി വ്യക്തമാക്കുന്നു; ഗ്രീക്ക് ഈ ബന്ധം വ്യാകരണപരമായി നിർബന്ധിതമാക്കാത്തതിനാൽ നേരിട്ടുള്ള സമന്വയവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τῆς πίστεως എന്നതിലെ πίστις-ന്റെ അർഥവും ഷഷ്ഠീവിഭക്തിബന്ധവും
  choice: ‘വിശ്വാസത്തിന്റെ’ എന്നു വിവർത്തനം ചെയ്ത് ബന്ധത്തിലെ സ്വാഭാവിക അവ്യക്തത നിലനിർത്തി
  alternative: ‘വിശ്വാസത്തിനായുള്ള’ അല്ലെങ്കിൽ ‘വിശ്വാസത്താൽ സവിശേഷമായ’
  rationale: ഇടയലേഖനങ്ങളിൽ ഇത് ക്രിസ്തീയ വിശ്വാസസത്യത്തെ സൂചിപ്പിക്കാമെങ്കിലും വ്യക്തിയുടെ വിശ്വാസത്താൽ സവിശേഷമാകുന്ന പോരാട്ടം എന്ന വായനയും സാധ്യമാണ്; മുഖ്യപാഠം ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: ഏറ്റുപറച്ചിലും നിത്യജീവനിലേക്കുള്ള വിളിയും തമ്മിലുള്ള ബന്ധം
  choice: ഏറ്റുപറച്ചിൽ നിത്യജീവനെക്കുറിച്ചായിരുന്നുവെന്ന് സന്ദർഭബന്ധം വ്യക്തമാക്കി
  alternative: ‘നീ വിളിക്കപ്പെട്ടു; അനേകം സാക്ഷികളുടെ മുമ്പാകെ നല്ല ഏറ്റുപറച്ചിൽ നടത്തുകയും ചെയ്തു’ എന്ന സമന്വയവായന
  rationale: ഗ്രീക്ക് വാക്യക്രമം ഇവയെ അടുത്ത് ബന്ധിപ്പിക്കുന്നുവെങ്കിലും ഏറ്റുപറച്ചിലിന്റെ ഉള്ളടക്കം തുറന്നുപറയുന്നില്ല. അതിനാൽ മുഖ്യവായനയ്ക്കൊപ്പം കൂടുതൽ ഔപചാരികമായ സമന്വയവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ‘പോരാട്ടം പോരാടുക’ എന്ന പദകുടുംബ ആവർത്തനം മൂലത്തിലെ വാഗ്വൈഭവം നിലനിർത്തുന്നു. ‘മുറുകെപ്പിടിക്കുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ നിർണായകമായ കൈക്കൊള്ളലിന്റെ രൂപകം പകരുന്നു; ‘ഏറ്റുപറച്ചിൽ’ മതപരമായ അർഥം വഹിച്ചാലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദാവലി അടിച്ചേൽപ്പിക്കുന്നില്ല.
