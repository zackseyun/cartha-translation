revisions:
- from: വിശ്വാസത്തിന്റെ നല്ല പോരാട്ടം പോരാടുക[a]. നീ വിളിക്കപ്പെട്ട നിത്യജീവനെ മുറുകെപ്പിടിക്കുക; അതിനെക്കുറിച്ചാണ് നീ അനേകം സാക്ഷികളുടെ മുമ്പാകെ നല്ല ഏറ്റുപറച്ചിൽ നടത്തിയത്[b].
  to: വിശ്വാസത്തിന്റെ നല്ല പോരാട്ടം പോരാടുക[a]. നീ വിളിക്കപ്പെട്ട ആ നിത്യജീവനെ മുറുകെപ്പിടിക്കുക; അനേകം സാക്ഷികളുടെ മുമ്പാകെ നീ നല്ല ഏറ്റുപറച്ചിൽ നടത്തുകയും ചെയ്തു[b].
  rationale: The revision retains the Greek cognate force in ‘പോരാട്ടം പോരാടുക,’ the ambiguity of ‘വിശ്വാസത്തിന്റെ,’ and the imperative force of ‘മുറുകെപ്പിടിക്കുക.’ It removes from the main text an interpretive assertion about the confession’s content and instead presents that association as an explicitly marked alternative. The revised footnote also restores the Greek goal phrase, ‘to which you were called.’
  reviewer_model: gpt-5.6-terra
