id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: ml
  text: നുകത്തിൻ കീഴിലുള്ള എല്ലാ അടിമകളും[a] തങ്ങളുടെ സ്വന്തം യജമാനന്മാരെ എല്ലാ ആദരവിനും അർഹരായി കരുതട്ടെ; അങ്ങനെ ദൈവത്തിന്റെ നാമവും ഉപദേശവും[b] നിന്ദിക്കപ്പെടാതിരിക്കാൻ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘അടിമകൾ’ എന്നതിന് ‘ദാസന്മാർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക്: δοῦλοι. ‘നുകത്തിൻ കീഴിലുള്ള’ എന്ന പ്രയോഗം ഇവിടെ ബന്ധനാവസ്ഥ വ്യക്തമാക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: ‘ഉപദേശം’ എന്നതിന് ‘സിദ്ധാന്തം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘നിന്ദിക്കപ്പെടുക’ എന്നതിന് ‘ദുഷിക്കപ്പെടുക’ എന്നും പരിഭാഷപ്പെടുത്താം; ദൈവത്തിന്റെ നാമത്തെ സംബന്ധിച്ച് ‘ദൈവദൂഷണം ചെയ്യപ്പെടുക’ എന്നും പറയാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: ‘നുകത്തിൻകീഴിൽ’ എന്ന പ്രയോഗം ബന്ധനാവസ്ഥ വ്യക്തമാക്കുന്നതിനാൽ, സാമൂഹിക യാഥാർഥ്യം മറയ്ക്കാത്ത ‘അടിമകൾ’ എന്ന പദം യോജിക്കുന്നു.
- source_word: ὑπὸ ζυγὸν
  choice: നുകത്തിൻകീഴിൽ
  rationale: അധീനതയുടെയും ബന്ധനത്തിന്റെയും ഗ്രീക്ക് രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δεσπότας
  choice: യജമാനന്മാർ
  rationale: അടിമകളുടെമേൽ അധികാരമുള്ള ഗൃഹനാഥന്മാരെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: ἰδίους
  choice: തങ്ങളുടെ സ്വന്തം
  rationale: പൊതുവിൽ യജമാനന്മാരെയല്ല, ഓരോരുത്തരുടെയും പ്രത്യേക യജമാനന്മാരെയാണ് സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ ഉടമസ്ഥസൂചന വ്യക്തമാക്കുന്നു.
- source_word: πάσης τιμῆς ἀξίους
  choice: എല്ലാ ബഹുമാനത്തിനും അർഹരായി
  rationale: സമഗ്രമായ ആദരവ് എന്ന അർഥം അതിശയോക്തിയില്ലാതെ, ഗ്രീക്ക് ഘടനയോട് അടുത്തുനിൽക്കി നൽകുന്നു.
- source_word: ἡγείσθωσαν
  choice: കരുതട്ടെ
  rationale: തുടർച്ചയായ വിലയിരുത്തൽനിലപാട് ആവശ്യപ്പെടുന്ന വർത്തമാനകാല ആജ്ഞയെ മാന്യവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ നാമം
  rationale: ദൈവത്തിന്റെ വെളിപ്പെട്ട വ്യക്തിത്വവും പ്രസിദ്ധിയും ഉൾക്കൊള്ളുന്ന ബൈബിൾപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἡ διδασκαλία
  choice: ഉപദേശം
  rationale: സന്ദർഭത്തിലെ ക്രൈസ്തവ പഠിപ്പിക്കലിനെ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ‘സിദ്ധാന്തം’ എന്ന കൂടുതൽ സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: βλασφημῆται
  choice: ദുഷിക്കപ്പെടുക
  rationale: ദൈവത്തിന്റെ നാമത്തെയും ഉപദേശത്തെയും അപകീർത്തിപ്പെടുത്തുകയോ നിന്ദിക്കുകയോ ചെയ്യുക എന്ന രണ്ടിനും ചേരുന്ന മലയാളപ്രയോഗം.
- source_word: Ὅσοι εἰσὶν
  choice: ആയിരിക്കുന്ന എല്ലാവരും
  rationale: ὅσοι എന്ന പദത്തിന്റെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: δοῦλος എന്ന സാമൂഹികവും ധാർമികവുമായി സംവേദനക്ഷമമായ പദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസന്മാർ / സേവകർ
  rationale: വാക്യം അടിമത്തത്തെ അംഗീകരിക്കുന്നു എന്ന വ്യാഖ്യാനം ചേർക്കാതെ, ‘നുകത്തിൻകീഴിൽ’ എന്ന വ്യക്തമായ ബന്ധനസൂചനയോടുകൂടിയ പുരാതന സാമൂഹിക യാഥാർഥ്യം മറച്ചുവയ്ക്കാതെ പരിഭാഷപ്പെടുത്തുന്നു.
- issue: διδασκαλία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ഉപദേശം
  alternative: സിദ്ധാന്തം / പഠിപ്പിക്കൽ
  rationale: പിന്നീടുള്ള സാങ്കേതിക ദൈവശാസ്ത്ര അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതെ, ക്രൈസ്തവ സന്ദേശവും പഠിപ്പിക്കലും എന്ന അർഥം കാത്തുസൂക്ഷിക്കുന്നു.
- issue: βλασφημῆται എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ദുഷിക്കപ്പെടുക
  alternative: നിന്ദിക്കപ്പെടുക / ദൈവദൂഷണം ചെയ്യപ്പെടുക
  rationale: ക്രിയയുടെ രണ്ട് കർത്തൃവിഷയങ്ങളായ ദൈവനാമത്തിനും ഉപദേശത്തിനും ഒരുപോലെ ചേരുന്ന വിപുലമായ പ്രയോഗം തെരഞ്ഞെടുത്തു; ദൈവത്തെ സംബന്ധിച്ച പ്രത്യേക ‘ദൈവദൂഷണം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘നുകം’ എന്ന ബൈബിൾപരിചിത രൂപകം നിലനിർത്തിയപ്പോൾ, ബന്ധനാവസ്ഥ മറയ്ക്കാതിരിക്കാൻ ‘അടിമകൾ’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട പദക്രമത്തോട് ചേർന്ന് [a], [b], [c] എന്നിങ്ങനെ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
