id: 1TI.6.13
reference: 1 Timothy 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: ml
  text: 'സകലത്തിനും ജീവൻ നൽകുന്ന ദൈവത്തിന്റെയും[a], പൊന്തിയൊസ് പീലാത്തോസിന്റെ മുമ്പാകെ നല്ല ഏറ്റുപറച്ചിലിനു സാക്ഷ്യം വഹിച്ച മശീഹാ യേശുവിന്റെയും[b][c] സന്നിധിയിൽ ഞാൻ നിന്നോട് ആജ്ഞാപിക്കുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘സകലത്തെയും ജീവനോടെ നിലനിർത്തുന്ന’ എന്നോ ‘സകലത്തെയും ജീവിപ്പിക്കുന്ന’ എന്നോ. ζῳογονοῦντος എന്ന ഗ്രീക്ക് പദം ജീവൻ സംരക്ഷിക്കുന്നതിനെയോ ജീവൻ നൽകുന്നതിനെയോ ഊന്നിപ്പറയാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തു യേശു.’ Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ അർഥം വ്യക്തമാക്കാൻ മുഖ്യവാചകത്തിൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അല്ലെങ്കിൽ ‘നല്ല ഏറ്റുപറച്ചിൽ നടത്തിയ.’ ഗ്രീക്കിൽ ‘നല്ല ഏറ്റുപറച്ചിൽ’ എന്നത് ‘സാക്ഷ്യം വഹിച്ചു’ എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമമായി വരുന്നു.
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω
  choice: കർശനമായി ആജ്ഞാപിക്കുന്നു
  rationale: ദൈവത്തിന്റെയും മശീഹാ യേശുവിന്റെയും സന്നിധിയിൽ നൽകുന്ന ഗൗരവപൂർണവും ഔപചാരികവുമായ കല്പനയാണെന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: σοι
  choice: നിന്നോട്
  rationale: ഏകവചനത്തിലുള്ള രണ്ടാംപുരുഷ പരോക്ഷകർമത്തെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐνώπιον
  choice: സന്നിധിയിൽ
  rationale: വെറും സ്ഥലസൂചനയല്ല, ദൈവത്തിന്റെയും മശീഹാ യേശുവിന്റെയും സാക്ഷാത് സാന്നിധ്യത്തിൽ കല്പിക്കുന്നതിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ἐνώπιον-നോടു ബന്ധപ്പെടുന്ന ജനിറ്റീവ് രൂപത്തിന്റെ നേരായ മലയാളപരിഭാഷ.
- source_word: ζῳογονοῦντος
  choice: ജീവൻ നൽകുന്ന
  rationale: ജീവിപ്പിക്കുക എന്നും ജീവനോടെ നിലനിർത്തുക എന്നും അർഥസാധ്യതയുള്ള പദത്തിന് വിശാലവും സ്വാഭാവികവുമായ മുഖ്യപരിഭാഷ; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὰ πάντα
  choice: സകലത്തിനും
  rationale: സൃഷ്ടിയിലെ എല്ലാറ്റിനെയും ഉൾക്കൊള്ളുന്ന സമഗ്രവ്യാപ്തി സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹാ യേശു
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണെന്ന അർഥം ‘മശീഹാ’ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μαρτυρήσαντος
  choice: സാക്ഷ്യം വഹിച്ച
  rationale: യേശുവിന്റെ പരസ്യവും ന്യായവിസ്താരസംബന്ധവുമായ സാക്ഷ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: പൊന്തിയൊസ് പീലാത്തൊസിന്റെ മുമ്പാകെ
  rationale: പീലാത്തൊസിന്റെ സാന്നിധ്യത്തിലുള്ള വിചാരണാസന്ദർഭം സൂചിപ്പിക്കാൻ യോജിച്ച പരിഭാഷ; ‘അവന്റെ കാലത്ത്/ഭരണത്തിൽ’ എന്ന കാലസൂചനയെക്കാൾ സന്ദർഭത്തിന് അനുയോജ്യം.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: നല്ല ഏറ്റുപറച്ചിൽ
  rationale: ὁμολογίαയുടെ ഏറ്റുപറച്ചിൽ/പ്രഖ്യാപനം എന്ന അർഥവും καλός എന്ന വിശേഷണത്തിന്റെ ലളിതമായ മൂല്യനിർണയവും നിലനിർത്തുന്നു; ചുറ്റുപാടിലുള്ള തിമൊഥെയൊസിന്റെ ഏറ്റുപറച്ചിലുമായുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തു യേശു
  rationale: ഈ ഔപചാരിക സാക്ഷ്യസന്ദർഭത്തിൽ Χριστός എന്നതിന്റെ സ്ഥാനപ്പേരായ അർഥം സജീവമാണ്; അതിനാൽ ‘മശീഹാ’ മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ച് പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ζῳογονοῦντος എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: സകലത്തിനും ജീവൻ നൽകുന്ന
  alternative: സകലത്തെയും ജീവനോടെ നിലനിർത്തുന്ന / സകലത്തെയും ജീവിപ്പിക്കുന്ന
  rationale: ഗ്രീക്ക് കൃതി ജീവൻ നൽകുന്നതും ജീവൻ സംരക്ഷിക്കുന്നതും സൂചിപ്പിക്കാം. മുഖ്യപരിഭാഷ അതിന്റെ വിശാലമായ ജീവദായകഭാവം നൽകുന്നു; കൂടുതൽ നിർദിഷ്ടമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: μαρτυρέωയും ὁμολογίαയും തമ്മിലുള്ള ബന്ധം
  choice: നല്ല ഏറ്റുപറച്ചിലിനു സാക്ഷ്യം വഹിച്ച
  alternative: നല്ല ഏറ്റുപറച്ചിൽ നടത്തിയ
  rationale: ഗ്രീക്കിൽ ὁμολογία നേരിട്ടുള്ള കർമമാണ്. മുഖ്യപരിഭാഷ സാക്ഷ്യം വഹിക്കുന്നതിന്റെ നിയമപരമായ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു; യേശു തന്നെയാണ് ഏറ്റുപറച്ചിൽ നടത്തിയതെന്ന സ്വാഭാവിക വായനയും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും ഔപചാരികതയും നിലനിർത്തുന്ന ശൈലി. ‘കർശനമായി ആജ്ഞാപിക്കുന്നു’ എന്ന പ്രയോഗം παραγγέλλωയുടെ ഭാരവും, ‘സന്നിധിയിൽ’ എന്നത് ഔപചാരിക സാക്ഷിസാന്നിധ്യവും പ്രകടിപ്പിക്കുന്നു. സഭാപരമായ ഒരു പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ‘മശീഹാ’, ‘ഏറ്റുപറച്ചിൽ’ എന്നീ അർഥസുതാര്യമായ പദങ്ങൾ ഉപയോഗിച്ചു.
