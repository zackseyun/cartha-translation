revisions:
- from: 'സകലത്തിനും ജീവൻ നൽകുന്ന ദൈവത്തിന്റെയും[a], പൊന്തിയൊസ് പീലാത്തൊസിന്റെ മുമ്പാകെ നല്ല ഏറ്റുപറച്ചിലിനു സാക്ഷ്യം വഹിച്ച മശീഹാ യേശുവിന്റെയും[b][c] സന്നിധിയിൽ ഞാൻ നിന്നോടു കർശനമായി ആജ്ഞാപിക്കുന്നു:'
  to: 'സകലത്തിനും ജീവൻ നൽകുന്ന ദൈവത്തിന്റെയും[a], പൊന്തിയൊസ് പീലാത്തോസിന്റെ മുമ്പാകെ നല്ല ഏറ്റുപറച്ചിലിനു സാക്ഷ്യം വഹിച്ച മശീഹാ യേശുവിന്റെയും[b][c] സന്നിധിയിൽ ഞാൻ നിന്നോട് ആജ്ഞാപിക്കുന്നു:'
  rationale: 'Two safe, minor revisions improve modern Malayalam usage and lexical restraint: the conventional Malayalam form of Pontius Pilate is used, and the added adverb ‘കർശനമായി’ is removed. No change is made to the carefully preserved ambiguity concerning God’s life-giving activity or to the main rendering of Jesus’ testimony.'
