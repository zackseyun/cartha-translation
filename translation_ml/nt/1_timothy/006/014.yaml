id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹ[a] പ്രത്യക്ഷപ്പെടുന്നതുവരെ, നീ കളങ്കമില്ലാത്തവനും ആക്ഷേപത്തിന് ഇടനൽകാത്തവനുമായി ആ കല്പന പാലിക്കണം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘യേശുക്രിസ്തു.’ Χριστός എന്ന ഗ്രീക്ക് പദം ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരായോ പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപത്തിലോ നൽകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τηρῆσαί
  choice: പാലിക്കണം
  rationale: മുൻവാക്യത്തിലെ ആജ്ഞയോട് ആശ്രയിച്ചിരിക്കുന്ന ക്രിയാരൂപം വിശ്വസ്തമായി അനുസരിക്കുകയും നിലനിർത്തുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘പാലിക്കുക’ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὴν ἐντολήν
  choice: ആ കല്പന
  rationale: നിശ്ചിത ഏകവചനപദം മുൻസന്ദർഭത്തിൽ നൽകിയ കല്പനയെ സൂചിപ്പിക്കുന്നു. ‘ആ’ എന്നത് അതിന്റെ സന്ദർഭനിശ്ചിതത്വം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἄσπιλον
  choice: കളങ്കമില്ലാത്തത്
  rationale: കറയോ കളങ്കമോ ഇല്ലാത്ത അവസ്ഥയാണ് അടിസ്ഥാനാർഥം. ഗ്രീക്കിൽ ഇത് ἐντολήν എന്ന പദത്തോട് വ്യാകരണപരമായി യോജിക്കുന്നു.
- source_word: ἀνεπίλημπτον
  choice: ആക്ഷേപത്തിന് ഇടയില്ലാത്തത്
  rationale: ന്യായമായ കുറ്റപ്പെടുത്തലിനോ ആക്ഷേപത്തിനോ പിടികൊടുക്കാത്ത അവസ്ഥയെ ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ പറയുന്നു.
- source_word: μέχρι τῆς ἐπιφανείας
  choice: പ്രത്യക്ഷപ്പെടുന്നതുവരെ
  rationale: ഭാവിയിൽ യേശുവിന്റെ ദൃശ്യമായ പ്രത്യക്ഷതവരെയുള്ള കാലപരിധി സ്വാഭാവികമായ മലയാളക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു; ‘വീണ്ടും’ എന്ന ആശയം മൂലപദത്തിൽ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേര് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി, മലയാളത്തിൽ അടുത്ത പേരുമായി സ്വാഭാവികമായി ബന്ധിപ്പിച്ചു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ അന്തിമകാല പ്രത്യക്ഷതയെക്കുറിച്ചുള്ള ഗൗരവമുള്ള സ്ഥാനപ്പേരായി കേൾക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός-ന്റെ സ്ഥാനപ്പേരായ സ്വഭാവം വ്യക്തമായി നിലനിൽക്കുന്നു. ‘മശീഹ’ അതിന്റെ അർഥം തുറന്നുകാട്ടുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപവും സാധ്യമാണ്.
- issue: ἄσπιλον, ἀνεπίλημπτον എന്നീ വിശേഷണങ്ങളുടെ ബന്ധം
  choice: കല്പനയെ വ്യാകരണപരമായി വിശേഷിപ്പിക്കുന്ന രൂപം
  alternative: തിമൊഥെയൊസ് കല്പന പാലിക്കുന്ന രീതിയെ സൂചിപ്പിക്കുന്ന രൂപം
  rationale: രണ്ട് ഗ്രീക്ക് വിശേഷണങ്ങളും τὴν ἐντολήν എന്നതോടു ലിംഗം, വചനം, വിഭക്തി എന്നിവയിൽ യോജിക്കുന്നു. എങ്കിലും ചുരുക്കമുള്ള പ്രയോഗം കല്പന പാലിക്കുന്നവന്റെ നിർമലതയും കുറ്റമറ്റ നിലയും അർഥപരമായി ഉൾക്കൊള്ളാൻ ഇടയാക്കുന്നു; അതിനാൽ ഈ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രത്യക്ഷതവരെ’ എന്ന നാമപ്രയോഗത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് സുഗമമായ ‘പ്രത്യക്ഷപ്പെടുന്നതുവരെ’ സ്വീകരിച്ചു. മൂലത്തിലെ സംക്ഷിപ്തത പൂർണമായി വിശദീകരിച്ച് വികസിപ്പിക്കാതെ, വിശേഷണങ്ങളുടെ അർഥബന്ധത്തിലെ സമ്മർദം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
