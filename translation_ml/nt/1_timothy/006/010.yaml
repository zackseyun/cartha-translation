id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: ml
  text: പണത്തോടുള്ള സ്നേഹം സകലവിധ തിന്മകളുടെയും ഒരു വേരാകുന്നു.[a] അതിനെ അതിയായി മോഹിച്ച ചിലർ വിശ്വാസത്തിൽനിന്ന് വഴിതെറ്റിപ്പോകുകയും[b] അനേകം വേദനകളാൽ തങ്ങളെത്തന്നെ കുത്തിത്തുളയ്ക്കുകയും ചെയ്തു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗതമായി: “പണത്തോടുള്ള സ്നേഹം സകല തിന്മയുടെയും വേരാകുന്നു.” എന്നാൽ ഗ്രീക്ക് വാചകം “സകലവിധ തിന്മകളുടെയും ഒരു വേര്” എന്ന അർഥത്തിന് കൂടുതൽ സ്വാഭാവികമായി ഇടനൽകുന്നു; എല്ലാ തിന്മയ്ക്കും ഒരേയൊരു കാരണമാണെന്ന് ഇതു സൂചിപ്പിക്കുന്നില്ല.'
    reason: alternative_reading
  - marker: b
    text: “വിശ്വാസത്തിൽനിന്ന് അകന്നുപോയി” എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ “വിശ്വാസം” എന്നത് ക്രിസ്തീയ വിശ്വാസസത്യങ്ങളുടെ സമുച്ചയത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: “അനേകം ദുഃഖങ്ങളാൽ” അല്ലെങ്കിൽ “അനേകം യാതനകളാൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: ഒരു വേര്
  rationale: ക്രിയയ്ക്കുമുമ്പിലുള്ള അനാർത്രസ് വിധേയനാമമായതിനാൽ ഇവിടെ അനിശ്ചിത അർഥം സ്വാഭാവികമാണ്; പണസ്നേഹം എല്ലാ തിന്മയുടെയും ഏകകാരണമാണെന്ന അതിശയോക്തി ഒഴിവാക്കുന്നു.
- source_word: πάντων τῶν κακῶν
  choice: സകലവിധ തിന്മകളുടെയും
  rationale: ബഹുവചനമായ κακῶν-ന്റെ വ്യാപകവും വിതരണാത്മകവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: φιλαργυρία
  choice: പണത്തോടുള്ള സ്നേഹം
  rationale: ‘വെള്ളി/പണം സ്നേഹിക്കൽ’ എന്ന സംയുക്തപദത്തിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു; ‘അത്യാഗ്രഹം’ എന്ന കൂടുതൽ വ്യാപകമായ വ്യാഖ്യാനപദം ഒഴിവാക്കുന്നു.
- source_word: ὀρεγόμενοι
  choice: അതിനെ അതിയായി മോഹിച്ച
  rationale: ഒരു കാര്യത്തിലേക്ക് ശക്തമായി ആഗ്രഹത്തോടെ നീളുക എന്ന ആശയം, സന്ദർഭത്തിലെ തുടർച്ചയായ തീവ്രാഭിലാഷത്തോടെ വ്യക്തമാക്കുന്നു.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: വിശ്വാസത്തിൽനിന്ന് വഴിതെറ്റിപ്പോകുകയും
  rationale: ഒരു നിലയിൽനിന്ന് അകന്ന് തെറ്റിപ്പോകുന്ന ചലനചിത്രം നിലനിർത്തുന്നു; ഗ്രീക്ക് പാസീവിന്റെ കാരണപരമായ അനിശ്ചിതത്വം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ആർട്ടിക്കിളും പാസ്റ്ററൽ ലേഖനങ്ങളിലെ സന്ദർഭവും ക്രിസ്തീയ വിശ്വാസസത്യങ്ങളുടെ സമുച്ചയത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതാണ്; മലയാളത്തിൽ ‘വിശ്വാസം’ ഇരുവിധ നിഴലുകളും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: περιέπειραν
  choice: തങ്ങളെത്തന്നെ കുത്തിത്തുളയ്ക്കുകയും ചെയ്തു
  rationale: ‘തുളച്ചുകയറ്റുക/കുത്തിത്തുളയ്ക്കുക’ എന്ന ശക്തമായ രൂപകം വ്യക്തവും സജീവവുമായി നിലനിർത്തുന്നു.
- source_word: ὀδύναις πολλαῖς
  choice: അനേകം വേദനകളാൽ
  rationale: ശാരീരിക വേദന, മാനസിക ദുഃഖം, കഠിനയാതന എന്നിവ ഉൾക്കൊള്ളാവുന്ന ὀδύνη-യുടെ അർഥവ്യാപ്തി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പണസ്നേഹവും തിന്മയും തമ്മിലുള്ള അവകാശവാദത്തിന്റെ വ്യാപ്തി
  choice: പണസ്നേഹം സകലവിധ തിന്മകളുടെയും ഒരു വേര്
  alternative: പണസ്നേഹം സകല തിന്മയുടെയും വേര്
  rationale: ῥίζα-യ്ക്ക് ആർട്ടിക്കിൾ ഇല്ലാത്തതും κακῶν ബഹുവചനമായതും പരിഗണിക്കുമ്പോൾ, എല്ലാ തിന്മയ്ക്കും ഒരേയൊരു കാരണമെന്നതിലുപരി പലവിധ തിന്മകൾക്ക് ഒരു ഉറവിടം എന്ന വായനയാണ് കൂടുതൽ സ്വാഭാവികം.
- issue: τῆς πίστεως എന്നതിന്റെ അർഥം
  choice: ക്രിസ്തീയ വിശ്വാസത്തെ സൂചിപ്പിക്കാവുന്ന ‘വിശ്വാസം’
  alternative: വ്യക്തിപരമായ ആശ്രയവിശ്വാസം മാത്രം
  rationale: പാസ്റ്ററൽ ലേഖനങ്ങളിലെ പ്രയോഗവും ആർട്ടിക്കിളും വസ്തുനിഷ്ഠമായ ക്രിസ്തീയ വിശ്വാസസമുച്ചയത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ മലയാള മുഖ്യപാഠത്തിൽ മൂലത്തിന്റെ സാധ്യതയുള്ള അർഥനിഴൽ പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരു വേര്’, ‘സകലവിധ തിന്മകൾ’ എന്നീ പ്രയോഗങ്ങൾ ഗ്രീക്കിലെ വ്യാകരണപരമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു. കുത്തിത്തുളയ്ക്കുന്ന രൂപകം അതിന്റെ തീവ്രതയോടെ നിലനിർത്തിയിട്ടുണ്ട്; ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
