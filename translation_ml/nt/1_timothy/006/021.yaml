  to: അതു തങ്ങൾക്കുണ്ടെന്ന് അവകാശപ്പെട്ട ചിലർ വിശ്വാസത്തെ സംബന്ധിച്ച് ലക്ഷ്യം തെറ്റിപ്പോയിരിക്കുന്നു.[a] കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.[b]
  rationale: പ്രധാനപാഠത്തിൽ മാറ്റം ആവശ്യമില്ല. എന്നാൽ നിലവിലെ അടിക്കുറിപ്പ് a-യിലെ ബദൽവാക്യം ‘professing it’ എന്ന ആശയത്തെ അസ്പഷ്ടമാക്കുന്നതിനാൽ, അതു നീക്കി മൂലഗ്രീക്കിലെ ബന്ധസർവനാമം, ക്രിയയുടെ ബദൽ അർഥങ്ങൾ, ‘വിശ്വാസം’ എന്നതിന്റെ സാധ്യമായ വായനകൾ എന്നിവ കൃത്യമായി വിശദീകരിക്കുന്ന അടിക്കുറിപ്പ് നൽകിയിരിക്കുന്നു.
