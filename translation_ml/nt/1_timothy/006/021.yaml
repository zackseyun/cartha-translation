id: 1TI.6.21
reference: 1 Timothy 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: ml
  text: അതു തങ്ങൾക്കുണ്ടെന്ന് അവകാശപ്പെട്ട ചിലർ വിശ്വാസത്തെ സംബന്ധിച്ച് ലക്ഷ്യം തെറ്റിപ്പോയിരിക്കുന്നു.[a] കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ മുമ്പു പറഞ്ഞ കാര്യത്തെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമം വ്യക്തമായി ഉണ്ട്. ‘തങ്ങൾക്കുണ്ടെന്ന് അവകാശപ്പെട്ട’ എന്നതിനെ ‘അതു അവകാശപ്പെട്ട’ എന്നും, ‘ലക്ഷ്യം തെറ്റിപ്പോയിരിക്കുന്നു’ എന്നതിനെ ‘വഴിതെറ്റിപ്പോയിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘പിഴച്ചുപോയിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ‘വിശ്വാസം’ ക്രൈസ്തവവിശ്വാസത്തെ സൂചിപ്പിക്കുന്നതാകാം; വ്യക്തിപരമായ വിശ്വാസം എന്ന അർഥവും സാധ്യമാണ്.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ ‘നിങ്ങൾ’ ബഹുവചനമാണ്.
    reason: grammatical_detail
lexical_decisions:
- source_word: ἥν
  choice: അതു
  rationale: മുൻവാക്യത്തിലെ ‘ജ്ഞാനം എന്നു തെറ്റായി വിളിക്കപ്പെടുന്നത്’ എന്ന ആശയത്തെ സൂചിപ്പിക്കുന്ന സ്ത്രീലിംഗ ഏകവചന ബന്ധസർവനാമം. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യഘടനയ്ക്കായി ‘അതു’ എന്നു പുനരുക്തസർവനാമമായി നൽകി.
- source_word: ἐπαγγελλόμενοι
  choice: തങ്ങൾക്കുണ്ടെന്ന് അവകാശപ്പെട്ട
  rationale: ഈ മധ്യമപ്രയോഗത്തിൽ ‘വാഗ്ദാനം ചെയ്യുക’ എന്നതിനെക്കാൾ, എന്തോ കൈവശമുണ്ടെന്നോ അതിൽ പ്രാവീണ്യമുണ്ടെന്നോ അവകാശപ്പെടുക എന്ന അർഥമാണ് സന്ദർഭോചിതം.
- source_word: περὶ τὴν πίστιν
  choice: വിശ്വാസത്തെ സംബന്ധിച്ച്
  rationale: περί + accusative ഇവിടെ ബന്ധമോ വിഷയമോ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നിർദ്ദിഷ്ടത മലയാളത്തിൽ വേറെ നിർദ്ദേശപദം ചേർക്കാതെ സന്ദർഭത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: ഇവിടെ ക്രൈസ്തവവിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്ന വായന സന്ദർഭത്തിന് ഏറ്റവും യോജിക്കുന്നു; എങ്കിലും വ്യക്തിപരമായ വിശ്വാസം എന്ന സാധ്യത ഭാഷയിൽ പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: ἠστόχησαν
  choice: ലക്ഷ്യം തെറ്റിപ്പോയിരിക്കുന്നു
  rationale: ἀστοχέω എന്ന ക്രിയയിലെ ലക്ഷ്യം തെറ്റുക എന്ന രൂപകം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: Ἡ χάρις
  choice: കൃപ
  rationale: കത്തിന്റെ സമാപനാശംസയിൽ മലയാളത്തിൽ നിർദ്ദേശപദമില്ലാതെ ‘കൃപ’ എന്ന പ്രയോഗമാണ് സ്വാഭാവികം.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ആശംസാവാക്യം മലയാളത്തിൽ പൂർണമാക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തു; ‘നിങ്ങൾ’ എന്നത് ബഹുവചനമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
theological_decisions:
- issue: ‘വിശ്വാസം’ എന്നതിന്റെ അർഥം
  choice: ക്രൈസ്തവവിശ്വാസത്തിന്റെ ഉള്ളടക്കം എന്ന വസ്തുനിഷ്ഠ സൂചന
  alternative: വ്യക്തിപരമായ വിശ്വാസം
  rationale: തൊട്ടുമുൻപുള്ള ‘ജ്ഞാനം എന്നു തെറ്റായി വിളിക്കപ്പെടുന്നത്’ എന്ന പരാമർശവും പാസ്റ്ററൽ ലേഖനങ്ങളിലെ പ്രയോഗവും വിശ്വാസസത്യങ്ങളുടെ സമാഹാരത്തെ സൂചിപ്പിക്കുന്ന വായനയെ പിന്തുണയ്ക്കുന്നു; പരിഭാഷയിൽ അനാവശ്യമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
- issue: സമാപനാശംസയുടെ അഭിസംബോധിതർ
  choice: ബഹുവചനമായ ‘നിങ്ങൾ’ നിലനിർത്തി
  alternative: തിമൊഥെയൊസിനെ മാത്രം ഉദ്ദേശിച്ച് ഏകവചനമാക്കുക
  rationale: SBLGNTയിലെ ὑμῶν വ്യക്തമായി ബഹുവചനമാണ്; അതിനാൽ കത്തിന്റെ ആശംസ തിമൊഥെയൊസിനപ്പുറം ബന്ധപ്പെട്ട വിശ്വാസസമൂഹത്തിലേക്കും വ്യാപിക്കുന്നതായി വരാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ലക്ഷ്യം തെറ്റിപ്പോയിരിക്കുന്നു’ എന്നത് മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുന്നു. സമാപനാശംസ സഭാപാരായണത്തിന് യോജിച്ച വിധത്തിൽ ചുരുക്കവും ഗൗരവവുമുള്ളതാണ്.
