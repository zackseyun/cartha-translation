id: 1TI.6.7
reference: 1 Timothy 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: ml
  text: കാരണം, നാം ലോകത്തിലേക്ക് ഒന്നും കൊണ്ടുവന്നില്ല[a]; ഒന്നും പുറത്തേക്കു കൊണ്ടുപോകാനും നമുക്കു കഴിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “കാരണം, നാം ലോകത്തിലേക്ക് ഒന്നും കൊണ്ടുവന്നില്ല; കാരണം ഒന്നും പുറത്തേക്കു കൊണ്ടുപോകാനും നമുക്കു കഴിയില്ല.” ὅτι എന്ന ഗ്രീക്ക് ബന്ധകപദം “കാരണം” എന്നോ, ഇതോടു പൊരുത്തപ്പെടുന്ന രണ്ടാമത്തെ പ്രസ്താവന അവതരിപ്പിക്കുന്നതായോ മനസ്സിലാക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ഒന്നും ... ഇല്ല
  rationale: സമ്പൂർണ നിഷേധം സ്വാഭാവികമായ മലയാള നിഷേധഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: εἰσηνέγκαμεν
  choice: കൊണ്ടുവന്നിട്ടില്ല
  rationale: εἰσφέρω എന്ന ക്രിയയിലെ ‘അകത്തേക്ക് കൊണ്ടുവരുക’ എന്ന ആശയം ‘ലോകത്തിലേക്ക്’ എന്ന പദസമുച്ചയത്തോടൊപ്പം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്ക്
  rationale: ഇവിടെ κόσμος മനുഷ്യൻ ജനനത്തിലൂടെ പ്രവേശിക്കുന്ന ലോകത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὅτι
  choice: ;
  rationale: രണ്ടാമത്തെ സമാന്തര പ്രസ്താവനയെ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ഗ്രീക്കിലെ കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐδὲ
  choice: ഒന്നും ... ഇല്ല
  rationale: τι-യോടു ചേർന്ന നിഷേധത്തെ മലയാളത്തിൽ സമ്പൂർണ നിഷേധമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐξενεγκεῖν
  choice: പുറത്തേക്കു കൊണ്ടുപോകാൻ
  rationale: ലോകത്തിൽനിന്നുള്ള പുറപ്പെടലിന്റെ ദൃശ്യഭാവം നിലനിർത്തിക്കൊണ്ട് ‘പുറത്തേക്ക് കൊണ്ടുപോകുക’ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു.
- source_word: τι
  choice: ഒന്നും
  rationale: നിഷേധവാക്യത്തിൽ അനിശ്ചിത സർവനാമത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: δυνάμεθα
  choice: നമുക്കു കഴിയില്ല
  rationale: കഴിവില്ലായ്മയെ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: ὅτι ആരംഭിക്കുന്ന രണ്ടാം ഉപവാക്യത്തിന്റെ ബന്ധം
  choice: ഒന്നും പുറത്തേക്കു കൊണ്ടുപോകാനാകില്ല എന്ന സമാന്തരമായ രണ്ടാമത്തെ പ്രസ്താവന
  alternative: ‘കാരണം ഒന്നും പുറത്തേക്കു കൊണ്ടുപോകാൻ നമുക്കു കഴിയില്ല’ എന്ന കാരണവാക്യം
  rationale: സന്ദർഭത്തിൽ അകത്തേക്ക് ഒന്നും കൊണ്ടുവന്നില്ല/പുറത്തേക്ക് ഒന്നും കൊണ്ടുപോകാനാകില്ല എന്ന പഴഞ്ചൊല്ലുസദൃശമായ തുലനം പ്രധാനമാണ്. എന്നാൽ ὅτι-യുടെ കാരണാർഥസാധ്യത യഥാർഥമായതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ലോകത്തിലേക്ക്/പുറത്തേക്ക്’ എന്ന സമാന്തര ദിശാഭാഷ മൂലപാഠത്തിലെ തുലനം നിലനിർത്തുന്നു; യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
