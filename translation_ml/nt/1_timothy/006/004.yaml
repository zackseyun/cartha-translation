  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: ml
  text: അവൻ അഹങ്കാരത്താൽ വീർത്തിരിക്കുന്നവനാണ്[a]; അവന് ഒന്നും അറിയില്ല; എന്നാൽ, തർക്കവിഷയങ്ങളോടും വാക്കുതർക്കങ്ങളോടും[b] രോഗാതുരമായ അഭിനിവേശം ഉള്ളവനാണ്. അവയിൽനിന്ന് അസൂയ, കലഹം, നിന്ദകൾ[c], ദുഷ്ടസംശയങ്ങൾ എന്നിവ ഉണ്ടാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അഹങ്കാരിയായിത്തീർന്നിരിക്കുന്നു.” ഗ്രീക്കിൽ അഹങ്കാരത്താൽ വീർത്തിരിക്കുന്നതിന്റെ രൂപകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വാക്കുകളെച്ചൊല്ലിയുള്ള പോരുകൾ” അല്ലെങ്കിൽ “വാക്കുകളെക്കുറിച്ചുള്ള തർക്കങ്ങൾ.”
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ഈ പദം ആളുകൾക്കെതിരായ നിന്ദാപരമായോ അപകീർത്തികരമായോ ഉള്ള സംസാരത്തെ സൂചിപ്പിക്കുന്നു; മറ്റു സന്ദർഭങ്ങളിൽ ഇതിന് “ദൂഷണങ്ങൾ” അഥവാ “ദൈവദൂഷണങ്ങൾ” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: അഹങ്കാരത്താൽ വീർപ്പുമുട്ടിയവനാണ്
  rationale: പൂർണകാല ക്രിയ സൂചിപ്പിക്കുന്ന നിലവിലെ അവസ്ഥയും അഹങ്കാരത്താൽ വീർത്തിരിക്കുന്നതെന്ന ഗ്രീക്ക് രൂപകവും നിലനിർത്തുന്നു.
- source_word: μηδὲν ἐπιστάμενος
  choice: ഒന്നും ഗ്രഹിക്കാതെ
  rationale: വസ്തുതകൾ അറിയാത്തതിലുപരി വിഷയത്തെ ശരിയായി മനസ്സിലാക്കാത്ത അവസ്ഥ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: νοσῶν
  choice: രോഗാതുരമായ ആസക്തി പുലർത്തുന്നു
  rationale: νοσέω എന്നതിലെ രോഗരൂപകം സംരക്ഷിക്കുമ്പോൾ ഇത് ശാരീരികരോഗമല്ല, അനാരോഗ്യകരമായ മോഹമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: περὶ ζητήσεις
  choice: തർക്കവിഷയങ്ങൾക്കു വേണ്ടി
  rationale: ζητήσεις ഇവിടെ ഊഹാധിഷ്ഠിത ചോദ്യങ്ങളെയും വിവാദങ്ങളെയും സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അവയോടുള്ള ആസക്തിയുടെ ലക്ഷ്യമായി പരിഭാഷപ്പെടുത്തി.
- source_word: λογομαχίας
  choice: വാക്കുകളെച്ചൊല്ലിയുള്ള പോരുകൾ
  rationale: λόγος, μάχη എന്നീ ഘടകങ്ങളിലെ വാക്കും പോരാട്ടവും സംരക്ഷിക്കുകയും മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξ ὧν γίνεται
  choice: അവയിൽനിന്ന് ... ഉണ്ടാകുന്നു
  rationale: മുൻപറഞ്ഞ തർക്കങ്ങളും വാക്കുപോരുകളും തുടർന്നുള്ള ദോഷങ്ങളുടെ ഉറവിടമാണെന്ന ഫലബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: φθόνος
  choice: അസൂയ
  rationale: മറ്റൊരാളുടെ നന്മയോടുള്ള വിരോധപരമായ envy എന്ന അർത്ഥത്തിന് സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: ἔρις
  choice: കലഹം
  rationale: വൈരവും സംഘർഷവും നിറഞ്ഞ തർക്കാവസ്ഥയെ ചുരുക്കമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: βλασφημίαι
  choice: അപവാദങ്ങൾ
  rationale: മനുഷ്യർ തമ്മിലുള്ള ദോഷപ്പട്ടികയായ ഈ സന്ദർഭത്തിൽ ദൈവദൂഷണത്തേക്കാൾ മറ്റുള്ളവരെ നിന്ദിക്കുന്നതോ അപകീർത്തിപ്പെടുത്തുന്നതോ ആയ സംസാരമാണ് മുൻനിൽക്കുന്നത്.
- source_word: ὑπόνοιαι πονηραί
  choice: ദുഷ്ടസംശയങ്ങൾ
  rationale: ὑπόνοιαι എന്ന സംശയവും πονηραί എന്ന ധാർമ്മിക ദോഷവിശേഷണവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: βλασφημίαι മനുഷ്യർക്കെതിരായ അപവാദമോ ദൈവത്തിനെതിരായ ദൂഷണമോ
  choice: അപവാദങ്ങൾ
  alternative: ദൂഷണങ്ങൾ
  rationale: അസൂയ, കലഹം, ദുഷ്ടസംശയങ്ങൾ എന്നിവയോടൊപ്പം വരുന്ന വ്യക്തികൾ തമ്മിലുള്ള ദോഷപ്പട്ടികയിൽ അപകീർത്തികരമായ സംസാരം കൂടുതൽ സാധ്യതയുള്ളതാണ്; വിശാലമായ ഗ്രീക്ക് അർത്ഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ അഹങ്കാരവീക്കത്തിന്റെയും രോഗത്തിന്റെയും രൂപകങ്ങൾ കഴിയുന്നത്ര നിലനിർത്തി; വാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിനായി ദീർഘ ഗ്രീക്ക് ഘടന രണ്ട് വാക്യങ്ങളാക്കി.
