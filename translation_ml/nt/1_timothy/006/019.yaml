source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: ml
  text: ഭാവിക്കായി തങ്ങൾക്കായി നല്ലൊരു അടിത്തറ ശേഖരിച്ചുവെച്ചുകൊണ്ട്, യഥാർഥജീവിതത്തെ[a] മുറുകെപ്പിടിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, “യഥാർഥത്തിൽ ജീവിതമായിരിക്കുന്ന ജീവിതത്തെ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: സ്വരൂപിച്ചുവെച്ചുകൊണ്ട്
  rationale: സമ്പത്ത് ശേഖരിച്ചുവെക്കുക എന്ന ദൃശ്യഭാവം നിലനിർത്തുകയും, മുൻവാക്യത്തിലെ പ്രബോധനത്തെ തുടരുന്ന വർത്തമാനകാല കൃദന്തരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἑαυτοῖς
  choice: തങ്ങൾക്കുതന്നെ
  rationale: പ്രവൃത്തിയുടെ പ്രയോജനം അതു ചെയ്യുന്നവർക്കുതന്നെയാണെന്ന ആത്മവാചക ദത്തിവിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: θεμέλιον καλὸν
  choice: നല്ലൊരു അടിത്തറ
  rationale: θεμέλιον എന്നതിലെ കെട്ടിടനിർമാണ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു; καλόν ഇവിടെ നല്ലത്, ഉറപ്പുള്ളത്, യോഗ്യമായത് എന്നീ ഭാവങ്ങൾ നൽകുന്നു.
- source_word: εἰς τὸ μέλλον
  choice: വരാനിരിക്കുന്നതിനായി
  rationale: മുന്നിലുള്ളതിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഗ്രീക്കിൽ വ്യക്തമല്ലാത്ത ‘വരാനിരിക്കുന്ന യുഗം’ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἵνα
  choice: —വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തെ സ്വാഭാവികമായ മലയാള ഉദ്ദേശ്യപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιλάβωνται
  choice: മുറുകെപ്പിടിക്കേണ്ടതിന്
  rationale: എത്തിപ്പിടിക്കുക, ഉറച്ചുപിടിക്കുക എന്ന സജീവ രൂപകം സംരക്ഷിക്കുന്നു; വെറും ‘ലഭിക്കുക’ എന്നതിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: τῆς ὄντως ζωῆς
  choice: യഥാർഥമായ ജീവനെ
  rationale: ὄντως എന്നതിലെ ‘വാസ്തവമായും/യഥാർഥമായും’ എന്ന ഗുണാത്മക ഊന്നലും ζωή എന്ന വ്യക്തമായ നാമവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς τὸ μέλλον എന്നത് പ്രത്യേകമായി അന്ത്യകാലപരമായി വിവർത്തനം ചെയ്യണമോ
  choice: വരാനിരിക്കുന്നതിനായി
  alternative: വരാനിരിക്കുന്ന യുഗത്തിനായി
  rationale: സന്ദർഭത്തിന് അന്ത്യകാലപരമായ പ്രതിധ്വനി ഉണ്ടെങ്കിലും εἰς τὸ μέλλον സ്വതവേ ‘യുഗം’ എന്നു വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനത്തെക്കാൾ മൂലപാഠത്തിന്റെ വിശാലത നിലനിർത്തി.
- issue: τῆς ὄντως ζωῆς എന്നതിലെ ജീവന്റെ ഗുണാത്മക വൈരുധ്യം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: യഥാർഥമായ ജീവനെ
  alternative: സത്യമായും ജീവനായിരിക്കുന്ന ജീവനെ
  rationale: സമ്പത്തിൽ അധിഷ്ഠിതമായ ജീവിതവും യഥാർഥ ജീവനും തമ്മിലുള്ള സൂചന നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ സ്വഭാവം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ പ്രബോധനത്തെ തുടരുന്ന കൃദന്ത-ഉദ്ദേശ്യഘടനയായതിനാൽ, ഒറ്റയ്ക്ക് വായിക്കുമ്പോഴും ആ ബന്ധം കഴിയുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്. ‘സ്വരൂപിച്ചുവെക്കുക’ എന്നും ‘അടിത്തറ’ എന്നും ഉള്ള കലർന്ന രൂപകങ്ങൾ ഗ്രീക്കിലേതായതിനാൽ അവയെ മിനുക്കി ഒറ്റ രൂപകമാക്കി മാറ്റിയിട്ടില്ല.
