id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: ml
  text: എന്നാൽ ധനികരാകാൻ[a] ആഗ്രഹിക്കുന്നവർ പ്രലോഭനത്തിലും കെണിയിലും[b] വിവേകശൂന്യവും ഹാനികരവുമായ അനേകം മോഹങ്ങളിലും അകപ്പെടുന്നു. ഈ മോഹങ്ങൾ മനുഷ്യരെ[c] തകർച്ചയിലേക്കും നാശത്തിലേക്കും ആഴ്ത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സമ്പന്നരാകാൻ.’ ഗ്രീക്ക് പദപ്രയോഗം ധനം കൈവശമുള്ള അവസ്ഥയെ മാത്രമല്ല, ധനികരായിത്തീരാനുള്ള ആഗ്രഹത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വലയിൽ.’
    reason: lexical_alternative
  - marker: c
    text: ‘മനുഷ്യരെ’ എന്നത് ഗ്രീക്കിലെ ἄνθρωποι എന്ന പദത്തെ സ്ത്രീപുരുഷഭേദമില്ലാത്ത പൊതുവായ അർഥത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: എന്നാൽ … ആഗ്രഹിക്കുന്നവർ
  rationale: βούλομαι ഇവിടെ സ്ഥിരമായ ആഗ്രഹമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ‘ആഗ്രഹിക്കുന്നവർ’ എന്നത് കൃദന്തരൂപത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πλουτεῖν
  choice: ധനികരാകാൻ
  rationale: ഇവിടെ ധനം കൈവശമുള്ള അവസ്ഥയെക്കാൾ സമ്പന്നരാകാനുള്ള അഭിലാഷമാണ് സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നത്. ‘ധനികരാകാൻ’ എന്നത് εἶναι/γίνεσθαι എന്ന ഇരു സാധ്യതകളെയും അനുയോജ്യമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐμπίπτουσιν
  choice: അകപ്പെടുന്നു
  rationale: ദോഷകരമായ ഒരു അവസ്ഥയിലോ അപകടത്തിലോ ചെന്നുപെടുക എന്ന രൂപകാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πειρασμόν
  choice: പ്രലോഭനം
  rationale: ഈ ദുർഗുണത്തെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിൽ നിഷ്പക്ഷമായ പരീക്ഷയെക്കാൾ പാപത്തിലേക്കു വശീകരിക്കുന്ന അർഥമാണ് യോജിക്കുന്നത്.
- source_word: παγίδα
  choice: കെണി
  rationale: പിടികൂടുന്ന വല അഥവാ ചതി എന്ന സജീവ രൂപകം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ പദമാണ്.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: അനേകം വിവേകശൂന്യവും ഹാനികരവുമായ മോഹങ്ങൾ
  rationale: ἐπιθυμίαയുടെ ശക്തമായ അഭിലാഷം ‘മോഹങ്ങൾ’ വ്യക്തമാക്കുന്നു; ἀνόητος, βλαβερός എന്നിവ യഥാക്രമം ‘വിവേകശൂന്യം,’ ‘ഹാനികരം’ എന്ന് കൃത്യവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: αἵτινες
  choice: ഈ മോഹങ്ങൾ
  rationale: ബന്ധസർവനാമം ഏതു നാമത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്നു മലയാളത്തിൽ വ്യക്തമായി കാണിക്കാനും, വിനാശകരമായ ഫലം മോഹങ്ങളോടു ബന്ധിപ്പിക്കാനും നാമം ആവർത്തിച്ചു.
- source_word: βυθίζουσι
  choice: ആഴ്ത്തുന്നു
  rationale: മുക്കുകയോ ആഴത്തിലേക്കു താഴ്ത്തുകയോ ചെയ്യുന്ന ശക്തമായ കാരകപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τοὺς ἀνθρώπους
  choice: മനുഷ്യരെ
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യരെ’ ഈ പൊതുവായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ὄλεθρον
  choice: തകർച്ച
  rationale: വിനാശകരമായ നഷ്ടമോ തകർച്ചയോ എന്ന അർഥം നൽകുകയും പിന്നാലെയുള്ള ἀπώλειαയിൽനിന്ന് പദപരമായ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπώλειαν
  choice: നാശം
  rationale: സമ്പൂർണ നഷ്ടമോ നശിപ്പിക്കപ്പെടലോ എന്ന സാധാരണ അർഥം നൽകുന്നു; ഈ വാക്യം മാത്രം പറയുന്നതിനെക്കാൾ പ്രത്യേകമായ പരലോകശിക്ഷയുടെ ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὄλεθρον καὶ ἀπώλειαν എന്ന പദജോടി നിത്യശിക്ഷയെ മാത്രം സാങ്കേതികമായി സൂചിപ്പിക്കുന്നതായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘തകർച്ചയും നാശവും’ എന്ന വിശാലമായ മുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘നാശവും നിത്യവിനാശവും’ എന്നിങ്ങനെ അന്തിമശിക്ഷയെ വ്യക്തമായി സൂചിപ്പിക്കുക
  rationale: ഗ്രീക്ക് പദങ്ങൾ അത്യന്തം ഗുരുതരമായ വിനാശകര ഫലം വ്യക്തമാക്കുന്നുവെങ്കിലും, ഈ വാക്യത്തിൽ മാത്രം അതിന്റെ പരിധി നിത്യശിക്ഷയായി നിർവചിക്കുന്നില്ല. അതിനാൽ വാചകത്തിന്റെ ഗൗരവവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘വിവേകശൂന്യം,’ ‘ഹാനികരം,’ ‘ആഴ്ത്തുന്നു’ എന്നിവ മൂലപാഠത്തിന്റെ ഗൗരവവും ദൃശ്യശക്തിയും നിലനിർത്തുന്നു; അതേസമയം അസ്വാഭാവികമായ പദാനുപദഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് അടയാളങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്കു പിന്നാലെ മുഖ്യവാചകത്തിൽ നൽകിയിരിക്കുന്നു.
