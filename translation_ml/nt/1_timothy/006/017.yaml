id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: ml
  text: ഇപ്പോഴത്തെ കാലഘട്ടത്തിൽ[a] സമ്പന്നരായിരിക്കുന്നവരോട് അഹങ്കരിക്കരുതെന്നും, സമ്പത്തിന്റെ അനിശ്ചിതത്വത്തിൽ[b] പ്രത്യാശ വെക്കരുതെന്നും, മറിച്ച് നമുക്ക് ആസ്വദിക്കാനായി എല്ലാം സമൃദ്ധമായി നൽകുന്ന ദൈവത്തിൽ പ്രത്യാശ വെക്കണമെന്നും ആജ്ഞാപിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഇപ്പോഴത്തെ ലോകക്രമത്തിൽ.’ ഗ്രീക്ക് പദത്തിന് ‘കാലഘട്ടം’ എന്നും വിപുലമായ അർഥത്തിൽ ‘ഇപ്പോഴത്തെ ലോകക്രമം’ എന്നും അർഥമാകാം; ‘കാലഘട്ടം’ പൗലോസിന്റെ കാലപരമായ വൈരുധ്യം കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഉറപ്പില്ലാത്ത സമ്പത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: സമ്പന്നരായിരിക്കുന്നവരോട്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ദത്തിവ് ബഹുവചനം വ്യക്തികളെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം അവരെ വെറും ഒരു വിഭാഗപ്പേരിൽ ഒതുക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: ഈ ഇപ്പോഴത്തെ കാലഘട്ടത്തിൽ
  rationale: αἰών ഭൗതികലോകത്തെക്കാൾ ഇപ്പോഴത്തെ യുഗത്തെയോ കാലക്രമത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കാലഘട്ടം’ പൗലോസിന്റെ കാലപരവും അന്ത്യകാലപരവുമായ ഭേദം നിലനിർത്തുന്നു.
- source_word: παράγγελλε
  choice: ആജ്ഞാപിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞാർത്ഥരൂപമായ ഈ ക്രിയയ്ക്ക് അധികാരപൂർവമായ നിർദേശത്തിന്റെ ശക്തിയുണ്ട്; ‘ആജ്ഞാപിക്കുക’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: അഹങ്കരിക്കരുതെന്ന്
  rationale: ഉന്നതഭാവമോ ഗർവമോ പുലർത്തുന്നതിനെ ഈ ക്രിയ നിരാകരിക്കുന്നു. ‘അഹങ്കരിക്കുക’ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: μηδὲ ἠλπικέναι
  choice: പ്രത്യാശ വെക്കാതെ
  rationale: പൂർണകാല അനന്തക്രിയ പ്രത്യാശ സ്ഥിരമായി ഒരു വസ്തുവിൽ സ്ഥാപിക്കുന്ന ആശയം നൽകുന്നു. ‘പ്രത്യാശ വെക്കുക’ അതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: ഉറപ്പില്ലാത്ത സമ്പത്തിൽ
  rationale: ἀδηλότης സമ്പത്തിന്റെ അസ്ഥിരവും ആശ്രയിക്കാനാവാത്തതുമായ സ്വഭാവത്തെ വിശേഷിപ്പിക്കുന്നു. മലയാളത്തിൽ ആശയം വ്യക്തമായി എത്തിക്കുന്ന സ്വാഭാവിക രൂപമാണിത്.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: മറിച്ച് ... ദൈവത്തിൽ പ്രത്യാശ വെക്കണമെന്ന്
  rationale: ആവർത്തിക്കുന്ന ἐπί പ്രത്യാശയുടെ ആശ്രയവിഷയത്തെ സൂചിപ്പിക്കുകയും സമ്പത്തും ദൈവവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: നമുക്ക് ... നൽകുന്ന
  rationale: ആട്രിബ്യൂട്ടീവ് കൃദന്തം ദൈവത്തെ ദാതാവായി വിവരിക്കുന്നു. ‘നൽകുന്ന’ ലളിതവും നേരിട്ടുള്ളതുമാണ്.
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനം വിശാലമായ പരിധി സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ആവശ്യമായവ’ പോലുള്ള നിയന്ത്രണം ചേർക്കുന്നില്ല.
- source_word: πλουσίως
  choice: സമൃദ്ധമായി
  rationale: ദൈവത്തിന്റെ ഔദാര്യപൂർവമായ നൽകലിനെ ഈ ക്രിയാവിശേഷണം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ‘സമൃദ്ധമായി’ സ്വാഭാവികമാണ്; സമ്പത്തിന്റെ ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: εἰς ἀπόλαυσιν
  choice: ആസ്വദിക്കാനായി
  rationale: εἰς സഹിതമുള്ള നാമം ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്നു. ദൈവം നൽകുന്നതിനെ അനുഭവിച്ചു സന്തോഷിക്കാനുള്ള ഉദ്ദേശ്യം ഈ രൂപം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: നൈതിക-അന്ത്യകാലപരമായ സന്ദർഭത്തിൽ αἰών എന്നതിന്റെ അർഥം
  choice: കാലഘട്ടം
  alternative: ലോകം / ഇപ്പോഴത്തെ ലോകക്രമം
  rationale: ‘കാലഘട്ടം’ എന്നത് പൗലോസിന്റെ രചനകളിൽ സാധാരണമായ ഇപ്പോഴത്തെ യുഗവും വരാനിരിക്കുന്ന യുഗവും തമ്മിലുള്ള കാലപരമായ വൈരുധ്യം സംരക്ഷിക്കുന്നു; ഭൗതികലോകം മാത്രം ഉദ്ദേശിക്കുന്നുവെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- issue: πάντα എന്നതിലെ ദൈവിക പരിപാലനത്തിന്റെ വ്യാപ്തി
  choice: എല്ലാം
  alternative: ആവശ്യമായ എല്ലാം / സകലവും
  rationale: മൂലപാഠം ദൈവത്തിന്റെ നൽകലിനെ വിശാലമായി പറയുന്നു; അതിനെ അടിസ്ഥാനാവശ്യങ്ങളിലേക്കു മാത്രം ചുരുക്കുകയോ സമൃദ്ധിവാഗ്ദാനമായി വികസിപ്പിക്കുകയോ ചെയ്യാതെ വാചകത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- issue: സമ്പത്ത് ആസ്വദിക്കുന്നതും അതിൽ പ്രത്യാശ വെക്കുന്നതും തമ്മിലുള്ള പിരിമുറുക്ക്
  choice: സമ്പത്തിൽ പ്രത്യാശ വെക്കരുത്; ദൈവം നൽകുന്നതെല്ലാം ആസ്വദിക്കാനായുള്ളതാണ്
  alternative: ആസ്വാദനം വെറും ഉപഭോഗമെന്നോ സമ്പത്ത് സ്വതവേ തെറ്റാണെന്നോ വ്യക്തമാക്കുക
  rationale: വാക്യം സമ്പത്തിനെ സ്വതവേ കുറ്റപ്പെടുത്തുന്നില്ല; അഹങ്കാരവും സമ്പത്തിൽ ആശ്രയിക്കുന്നതുമാണ് നിരാകരിക്കുന്നത്. അതേസമയം ദൈവിക ദാനത്തിന്റെ ആസ്വാദനം ഉറപ്പിക്കുന്നു. ഈ പിരിമുറുക്ക് വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. അധികാരപൂർവമായ παράγγελλε എന്നതിന് ‘ആജ്ഞാപിക്കുക’ നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ വായനാസൗകര്യമുള്ള വിധം ക്രമപ്പെടുത്തിയെങ്കിലും സമ്പത്തും ദൈവവും തമ്മിലുള്ള പ്രത്യാശയുടെ നേർവൈരുധ്യം സംരക്ഷിച്ചു. നൽകിയ ഇംഗ്ലീഷ് പാളിയിലെ അടിക്കുറിപ്പുസൂചകങ്ങൾ ഉള്ളടക്കവുമായി പൊരുത്തപ്പെടാത്തതിനാൽ, [a] കാലഘട്ടത്തിന്റെ പകരവായനയോടും [b] സമ്പത്തിന്റെ അനിശ്ചിതത്വത്തിന്റെ പകരവായനയോടും ചേർത്തു.
