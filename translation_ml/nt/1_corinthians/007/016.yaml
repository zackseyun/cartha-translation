id: 1CO.7.16
reference: 1 Corinthians 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: ml
  text: എന്തെന്നാൽ, ഭാര്യേ, നിന്റെ ഭർത്താവിനെ നീ രക്ഷിക്കുമോ എന്ന് നിനക്ക് എങ്ങനെ അറിയാം?[a] അല്ലെങ്കിൽ, ഭർത്താവേ, നിന്റെ ഭാര്യയെ നീ രക്ഷിക്കുമോ എന്ന് നിനക്ക് എങ്ങനെ അറിയാം?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാവസഹജമായി: ‘നിന്റെ ഭർത്താവിനെ നീ രക്ഷിക്കുമോ എന്ന് നിനക്ക് എങ്ങനെ അറിയാൻ കഴിയും?’ ഗ്രീക്കിലെ പരോക്ഷചോദ്യത്തിൽ ‘രക്ഷിക്കും’ എന്ന ഭാവികാല ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ഇവിടെ അതു ഉറച്ച പ്രവചനമല്ല, സാധ്യതയെക്കുറിച്ചുള്ള ചോദ്യമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: എന്ന് നിനക്ക് എങ്ങനെ അറിയാം?
  rationale: τί + οἶδας എന്ന പ്രയോഗം ഇവിടെ ‘നിനക്ക് എങ്ങനെ അറിയാം?’ എന്ന അലങ്കാരചോദ്യമായി സ്വാഭാവികമായി വരുന്നു. γάρ-ന്റെ സന്ദർഭബന്ധം മലയാളത്തിൽ വാക്യക്രമവും ‘അതുപോലെ’ എന്ന സമാന്തരബന്ധവും വഴി പ്രകടമാകുന്നു; കൃത്രിമമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി.
- source_word: γύναι
  choice: ഭാര്യേ
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നത് ‘ഭാര്യ’യെ സൂചിപ്പിക്കുന്നു; സംബോധനരൂപം നിലനിർത്തി.
- source_word: ἄνερ
  choice: ഭർത്താവേ
  rationale: വിവാഹസന്ദർഭത്തിൽ ἀνήρ എന്നത് ‘ഭർത്താവ്’ എന്ന അർത്ഥത്തിലാണ്; സംബോധനരൂപം നിലനിർത്തി.
- source_word: σώσεις
  choice: രക്ഷിക്കുമോ
  rationale: ഭാവികാലരൂപത്തിന്റെ ആശയം നിലനിർത്തുന്നു. εἰ ചേർന്ന പരോക്ഷചോദ്യത്തിൽ ഇത് ഉറച്ച പ്രവചനമല്ല, ‘രക്ഷിക്കുമോ എന്ന്’ എന്ന സാധ്യതയാണ്.
- source_word: τὸν ἄνδρα
  choice: നിന്റെ ഭർത്താവിനെ
  rationale: ബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കാൻ ഉടമസ്ഥസർവനാമം ചേർത്തു.
- source_word: τὴν γυναῖκα
  choice: നിന്റെ ഭാര്യയെ
  rationale: ബന്ധത്തെ മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കാൻ ഉടമസ്ഥസർവനാമം ചേർത്തു.
- source_word: ἢ
  choice: അതുപോലെ
  rationale: രണ്ടാമത്തെ സമാന്തരചോദ്യത്തിലേക്കുള്ള മാറൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ἢ അടിസ്ഥാനമായി ‘അല്ലെങ്കിൽ’ ആണെങ്കിലും ഇവിടെ വിപരീത തിരഞ്ഞെടുപ്പിനേക്കാൾ സമാന്തരമായ ആവർത്തനമാണ് ഉദ്ദേശ്യം.
theological_decisions:
- issue: വിവാഹസന്ദർഭത്തിലെ ‘രക്ഷിക്കുക’ എന്നതിന്റെ അർത്ഥം
  choice: ‘രക്ഷിക്കുക’ എന്ന പദം നിലനിർത്തി
  alternative: വിശ്വാസത്തിലേക്കു കൊണ്ടുവരുക; വിവാഹബന്ധം സംരക്ഷിക്കുക; ആത്മീയമായി രക്ഷയ്ക്കു കാരണമാകുക
  rationale: σῴζω എന്ന പദത്തിന്റെ രക്ഷാസംബന്ധിയായ ശക്തി ചുരുക്കുകയോ വ്യാഖ്യാനത്തിലൂടെ തീർപ്പാക്കുകയോ ചെയ്യാതെ നിലനിർത്തുന്നു. വിശ്വാസിയായ ജീവിതപങ്കാളിയുടെ പങ്കും ദൈവത്തിന്റെ രക്ഷാപ്രവർത്തനവും തമ്മിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം വാചകം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഭാര്യേ’, ‘ഭർത്താവേ’ എന്നീ സംബോധനങ്ങൾ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു. ആദ്യ ചോദ്യത്തിനുശേഷം അടിക്കുറിപ്പ് ചിഹ്നം നൽകിയിരിക്കുന്നു.
