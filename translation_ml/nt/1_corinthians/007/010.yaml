id: 1CO.7.10
reference: 1 Corinthians 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῖς δὲ γεγαμηκόσιν παραγγέλλω, οὐκ ἐγὼ ἀλλὰ ὁ κύριος, γυναῖκα ἀπὸ ἀνδρὸς μὴ χωρισθῆναι—
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: ml
  text: 'വിവാഹിതരോടാകട്ടെ ഞാൻ കൽപ്പിക്കുന്നു—ഞാനല്ല, കർത്താവാണ്: ഭാര്യ ഭർത്താവിൽനിന്ന് വേർപിരിയരുത്[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭർത്താവുമായുള്ള വിവാഹബന്ധം വേർപെടുത്തരുത്.” ഗ്രീക്ക് ക്രിയ വിവാഹജീവിതത്തിലെ വേർപിരിയലിനെ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിൽ അതിൽ വിവാഹമോചനവും ഉൾപ്പെട്ടേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: വിവാഹിതരോടാകട്ടെ
  rationale: γεγαμηκόσιν വിവാഹിതരായി കഴിയുന്നവരെ സൂചിപ്പിക്കുന്നു. ദാതൃവിഭക്തിയുടെ അഭിസംബോധനാഭാവം ‘വിവാഹിതരോട്’ നൽകുന്നു; δέ സൂചിപ്പിക്കുന്ന ബന്ധപ്പെട്ട വിഷയമാറ്റം സ്വാഭാവികമായി ‘ആകട്ടെ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: παραγγέλλω
  choice: ഞാൻ കൽപ്പിക്കുന്നു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ക്രിയയുടെ ശക്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: ഞാനല്ല, കർത്താവാണ്
  rationale: ഗ്രീക്കിലെ ഊന്നലോടുകൂടിയ വൈരുധ്യം നിലനിർത്തുന്നു; കൽപ്പിക്കുന്നത് കർത്താവാണെന്ന ഒഴിവാക്കിയ ക്രിയ മലയാളത്തിൽ സ്വാഭാവികമായി മനസ്സിലാകുന്നു.
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: ഭാര്യ ഭർത്താവിൽനിന്ന്
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή, ἀνήρ എന്നിവ യഥാക്രമം ‘ഭാര്യ’, ‘ഭർത്താവ്’ എന്നാണ്; ബന്ധസൂചന മലയാളത്തിൽ പ്രസക്തിയിൽ വ്യക്തമാണ്.
- source_word: μὴ χωρισθῆναι
  choice: വേർപിരിയരുത്
  rationale: വിവാഹബന്ധത്തിലെ വേർപിരിയൽ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ആധുനിക നിയമപരമായ വിവാഹമോചനത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല. കൽപ്പനയുടെ ശക്തി ‘അരുത്’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഞാനല്ല, കർത്താവാണ്’ എന്നതിന്റെ അർഥം
  choice: കർത്താവിൽനിന്ന് നേരത്തേ ലഭിച്ച കൽപ്പനയെയും പൗലോസ് തുടർന്ന് നൽകുന്ന അപ്പൊസ്തലിക പ്രയോഗത്തെയും വേർതിരിക്കുന്ന വാചകമായി നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: പൗലോസ് തന്റെ വാക്കുകൾക്ക് അധികാരമില്ലെന്ന് നിഷേധിക്കുന്നു.
  rationale: മൂലവാക്യത്തിലെ വൈരുധ്യം അതേപടി സൂക്ഷിക്കുന്നു; അതേസമയം പൗലോസിന്റെ അധികാരത്തെക്കുറിച്ചുള്ള നിഗമനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: വിവാഹസന്ദർഭത്തിലെ χωρισθῆναι എന്നതിന്റെ വ്യാപ്തി
  choice: വേർപിരിയരുത്
  alternative: വിവാഹമോചനം ചെയ്യരുത്
  rationale: പദം വിവാഹപരമായ വേർപിരിയലിനെയും സന്ദർഭാനുസൃതമായി വിവാഹമോചനത്തെയും ഉൾക്കൊള്ളാം. പ്രധാനപാഠത്തിൽ വിശാലമായ അർഥം സൂക്ഷിച്ച് നിയമപരമായ കൃത്യാർഥം അടിച്ചേൽപ്പിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിവാഹിതരോടാകട്ടെ’ വിഷയമാറ്റം മൃദുവായി സൂചിപ്പിക്കുന്നു. അവസാനത്തെ ദീർഘരേഖ അടുത്ത വാക്യത്തിലേക്ക് ചിന്ത തുടരുന്നതായി നിലനിർത്തുന്നു.
