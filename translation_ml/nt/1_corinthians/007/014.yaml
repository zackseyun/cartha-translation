id: 1CO.7.14
reference: 1 Corinthians 7:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: ml
  text: അവിശ്വാസിയായ ഭർത്താവ് ഭാര്യയിലൂടെ വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു; അവിശ്വാസിയായ ഭാര്യ സഹോദരനിലൂടെ[a] വിശുദ്ധയാക്കപ്പെട്ടിരിക്കുന്നു. അല്ലായിരുന്നെങ്കിൽ നിങ്ങളുടെ മക്കൾ അശുദ്ധരാകുമായിരുന്നു; എന്നാൽ ഇപ്പോഴാകട്ടെ അവർ വിശുദ്ധരാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വാസിയായ ഭർത്താവിലൂടെ.” ഗ്രീക്കിൽ “സഹോദരനിലൂടെ”; സഹവിശ്വാസിയെ സൂചിപ്പിക്കാൻ പൗലോസ് പതിവായി ഉപയോഗിക്കുന്ന പദമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു” എന്നും “വിശുദ്ധർ” എന്നും പറയുന്നത് വിശ്വാസിയായ ജീവിതപങ്കാളിയോടും കുടുംബത്തോടുമുള്ള ബന്ധത്തിൽ വേർതിരിക്കപ്പെട്ട ഒരു നിലയെ സൂചിപ്പിക്കാം; അത് അവിശ്വാസിയായ വ്യക്തിയുടെ രക്ഷയെ അനിവാര്യമായി പ്രഖ്യാപിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു / വിശുദ്ധയാക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗം മുൻപ് സംഭവിച്ച പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ നിലയെ സൂചിപ്പിക്കുന്നു. ലിംഗാനുസൃത രൂപങ്ങൾ സ്വാഭാവിക മലയാളം നൽകുകയും, പദത്തിന്റെ വിശുദ്ധി എന്ന ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἄπιστος
  choice: അവിശ്വാസിയായ
  rationale: വിവാഹസന്ദർഭത്തിൽ വിശ്വസിക്കാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ‘അവിശ്വസ്തൻ’ എന്ന അർഥം ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: ἐν
  choice: —യിലൂടെ
  rationale: ബന്ധപരമോ ഉപാധിപരമോ ആയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കേവലം ‘ഉള്ളിൽ’ എന്ന് യാന്ത്രികമായി വിവർത്തനം ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἀνήρ / γυνή
  choice: ഭർത്താവ് / ഭാര്യ
  rationale: അടുത്ത സന്ദർഭം വിവാഹത്തെക്കുറിച്ചായതിനാൽ ‘പുരുഷൻ / സ്ത്രീ’ എന്നതിനെക്കാൾ ബന്ധസൂചക പദങ്ങൾ കൃത്യമാണ്.
- source_word: ἀδελφῷ
  choice: സഹോദരനിലൂടെ
  rationale: ഗ്രീക്കിലെ ‘സഹോദരൻ’ എന്ന പദം പ്രധാനവാചകത്തിൽ നിലനിർത്തി ഉറവിടത്തിന്റെ അസമമിതമായ പദപ്രയോഗം സംരക്ഷിക്കുന്നു; സാധ്യതയുള്ള സൂചന അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἐπεὶ ἄρα
  choice: അല്ലായിരുന്നെങ്കിൽ
  rationale: മുൻപ്രസ്താവന ശരിയല്ലെങ്കിൽ ഉണ്ടാകുന്ന സങ്കൽപ്പിത ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀκάθαρτα
  choice: അശുദ്ധർ
  rationale: ആരാധനാപരവും ഉടമ്പടിപരവുമായ ശുദ്ധി–അശുദ്ധി അനുരണനം നിലനിർത്തുന്നു.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോഴാകട്ടെ
  rationale: സങ്കൽപ്പിത അവസ്ഥയ്ക്കു വിരുദ്ധമായ യഥാർഥ നിലവിലെ അവസ്ഥയെ വ്യക്തമാക്കുന്നു.
- source_word: ἅγια
  choice: വിശുദ്ധർ
  rationale: ἡγίασται എന്ന ക്രിയയുമായുള്ള പദബന്ധം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ ‘വേർതിരിക്കപ്പെട്ടവർ’ എന്ന ലഘൂകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അവിശ്വാസിയായ ജീവിതപങ്കാളി ‘വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു’ എന്നതിന്റെ അർഥം
  choice: വിവാഹബന്ധത്തിന്റെയും കുടുംബത്തിന്റെയും പശ്ചാത്തലത്തിലുള്ള വിശുദ്ധമായ അഥവാ വേർതിരിക്കപ്പെട്ട നില എന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു; വ്യക്തിപരമായ രക്ഷയായി വാചകത്തിൽ വിശദീകരിക്കുന്നില്ല.
  alternative: വിശ്വാസിയുമായുള്ള വിവാഹംകൊണ്ടുതന്നെ അവിശ്വാസിയായ പങ്കാളിക്ക് രക്ഷ ലഭിക്കുന്നു; അല്ലെങ്കിൽ ഇത് വിവാഹത്തിന്റെ ലൈംഗിക നിയമസാധുതയെ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: വാക്യം വിവാഹത്തിന്റെയും മക്കളുടെയും നിലയെ ബന്ധിപ്പിക്കുന്നു. ‘വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ഉറവിടഭാഷ നിലനിർത്തുന്നത് ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുകയും പാഠം പറയാത്ത രക്ഷാസിദ്ധാന്തം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀδελφῷ എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: പ്രധാനവാചകത്തിൽ ‘സഹോദരൻ’ നിലനിർത്തുന്നു; അടിക്കുറിപ്പിൽ വിശ്വാസിയായ ഭർത്താവായിരിക്കാനുള്ള സാധ്യത വ്യക്തമാക്കുന്നു.
  alternative: സമാന്തരതയ്ക്കായി നേരിട്ട് ‘വിശ്വാസിയായ ഭർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് രണ്ടാം ഉപവാക്യത്തിൽ ἀνήρ എന്നല്ല, ἀδελφός എന്നാണ് ഉപയോഗിക്കുന്നത്. ഉറവിടത്തിലെ പദതിരഞ്ഞെടുപ്പ് സംരക്ഷിച്ചുകൊണ്ട് വായനാസഹായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: മക്കളുടെ അശുദ്ധാവസ്ഥയെക്കുറിച്ചുള്ള സങ്കൽപ്പിത ഫലം
  choice: ‘അശുദ്ധരാകുമായിരുന്നു’ എന്നു നൽകി വ്യവസ്ഥാപിത/വിരുദ്ധസത്യ ആശയം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
  alternative: ഗ്രീക്ക് വർത്തമാനകാലത്തെ രൂപപരമായി പിന്തുടർന്ന് ‘അശുദ്ധരാണ്’ എന്നു നൽകുക.
  rationale: ἐπεὶ ἄρα മുൻപ്രസ്താവന നിഷേധിച്ചാൽ ഉണ്ടാകുന്ന ഫലം അവതരിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘അല്ലായിരുന്നെങ്കിൽ ... അശുദ്ധരാണ്’ എന്നത് അസ്വാഭാവികവും യഥാർഥ അവസ്ഥയായി തെറ്റിദ്ധരിക്കാവുന്നതുമാണ്; സങ്കൽപ്പിതത്വം ക്രിയാരൂപത്തിൽ വ്യക്തമാക്കുന്നത് ആശയസമത്വം മെച്ചപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന ദൈവശാസ്ത്രഭാരമുള്ള പദം നിലനിർത്തിയെങ്കിലും അതിന്റെ അർഥം പ്രധാനവാചകത്തിൽ ചുരുക്കിയിട്ടില്ല. ‘സഹോദരൻ’ ഉറവിടസുതാര്യതയ്ക്കായി സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
