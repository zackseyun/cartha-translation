  source_fidelity: പ്രധാനപാഠം SBLGNT-യോടു വിശ്വസ്തമാണ്. ἡγίασται-യുടെ പൂർണകാല കർമണിരൂപം ‘വിശുദ്ധനാക്കപ്പെട്ടിരിക്കുന്നു/വിശുദ്ധയാക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു നന്നായി പ്രതിഫലിക്കുന്നു. ἀδελφῷ എന്ന അസമമിതമായ പദപ്രയോഗം ‘സഹോദരനിലൂടെ’ എന്നു നിലനിർത്തിയിട്ടുണ്ട്. ἐπεὶ ἄρα-യുടെ നിഗൂഢ വ്യവസ്ഥാപിത ന്യായവാദം മലയാളത്തിൽ ‘അല്ലായിരുന്നെങ്കിൽ ... അശുദ്ധരാകുമായിരുന്നു’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; ഗ്രീക്കിലെ ἐστιν രൂപത്തിൽ വർത്തമാനകാലമുണ്ടെങ്കിലും ഈ മലയാളരൂപം അതിനെ യഥാർഥ നിലവിലെ പ്രഖ്യാപനമെന്നു തെറ്റിദ്ധരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം സ്വാഭാവികവും മാന്യവുമാണ്. ‘ഭാര്യയിലൂടെ,’ ‘സഹോദരനിലൂടെ,’ ‘എന്നാൽ ഇപ്പോഴാകട്ടെ’ എന്നിവ വ്യക്തവും വായനാസൗകര്യമുള്ളതുമാണ്.
