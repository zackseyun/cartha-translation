id: 1CO.7.25
reference: 1 Corinthians 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: ml
  text: കന്യകമാരെക്കുറിച്ച്[a] കർത്താവിൽനിന്നുള്ള കല്പനയൊന്നും എനിക്കില്ല. എന്നാൽ കർത്താവിൽനിന്ന് കരുണ ലഭിച്ച, വിശ്വസനീയനായ ഒരാളെന്ന നിലയിൽ ഞാൻ എന്റെ അഭിപ്രായം[b] പറയുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അവിവാഹിതരായ സ്ത്രീകൾ’; സന്ദർഭത്തെക്കുറിച്ചുള്ള ചില വ്യാഖ്യാനങ്ങളിൽ ‘കന്യകമാരായ പുത്രിമാർ.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘കന്യകമാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എന്റെ വിലയിരുത്തൽ’ അല്ലെങ്കിൽ ‘എന്റെ ഉപദേശം.’ ഇവിടെ പൗലോസ് തന്റെ പരിഗണിച്ച അഭിപ്രായത്തെ കർത്താവിൽനിന്നുള്ള നേരിട്ടുള്ള ‘കല്പന’യിൽനിന്ന് വേർതിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: ‘വിശ്വസനീയനായ’ എന്നതിന് പകരം ‘വിശ്വസ്തനായ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ഈ രണ്ടു അർഥങ്ങളും വരാം; ഇവിടെ കർത്താവിന്റെ കരുണയാൽ പൗലോസ് വിശ്വസിക്കാവുന്ന മാർഗദർശിയാണെന്ന ആശയമായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: …യെക്കുറിച്ച്
  rationale: പൗലോസ് ഒരു പുതിയ വിഷയത്തിലേക്കു കടക്കുന്നതു സൂചിപ്പിക്കുന്ന പ്രയോഗം. ഗ്രീക്കിൽ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: τῶν παρθένων
  choice: കന്യകമാർ
  rationale: παρθένος എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കന്യക’ എന്നതാണ്. സന്ദർഭത്തിലെ കൃത്യമായ സൂചന വിവാദമായതിനാൽ ‘അവിവാഹിതരായ സ്ത്രീകൾ’ എന്ന വ്യാഖ്യാനാത്മക രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചിട്ടില്ല.
- source_word: ἐπιταγὴν κυρίου
  choice: കർത്താവിൽനിന്നുള്ള കല്പന
  rationale: ἐπιταγή അധികാരപൂർവമായ കല്പനയെയോ നിർദേശത്തെയോ സൂചിപ്പിക്കുന്നു; ‘കർത്താവിൽനിന്നുള്ള’ എന്നത് അതിന്റെ ഉറവിടം വ്യക്തമാക്കുന്നു.
- source_word: γνώμην
  choice: എന്റെ അഭിപ്രായം
  rationale: γνώμη പരിഗണിച്ചുണ്ടാക്കിയ അഭിപ്രായം, വിലയിരുത്തൽ, ഉപദേശം എന്നിവ സൂചിപ്പിക്കാം. നേരിട്ടുള്ള കർത്തൃകല്പനയുമായുള്ള വ്യത്യാസം നിലനിർത്താൻ സ്വാഭാവികമായ ‘അഭിപ്രായം’ തെരഞ്ഞെടുത്തു.
- source_word: δίδωμι
  choice: പറയുന്നു
  rationale: മലയാളത്തിൽ ‘അഭിപ്രായം പറയുന്നു’ എന്നത് സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ ‘നൽകുന്നു’ എന്ന പ്രയോഗത്തിന്റെ ആശയം ഇതിലൂടെ വ്യക്തമായി കൈമാറുന്നു.
- source_word: ὡς
  choice: ഒരാളെന്ന നിലയിൽ
  rationale: പൗലോസ് ഏതു നിലയിലാണ് ഈ അഭിപ്രായം പറയുന്നതെന്ന് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: കർത്താവിന്റെ കരുണയാൽ
  rationale: കർത്താവിൽനിന്ന് കരുണ ലഭിച്ചിരിക്കുന്നു എന്ന perfect passive ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: πιστὸς εἶναι
  choice: വിശ്വസനീയനായ
  rationale: πιστός എന്നതിന് ‘വിശ്വസ്തൻ’ എന്നും ‘വിശ്വസിക്കാവുന്നവൻ/വിശ്വസനീയൻ’ എന്നും അർഥമാകാം. ഇവിടെ പൗലോസ് തന്റെ വിലയിരുത്തലിന്റെ വിശ്വാസ്യത വ്യക്തമാക്കുന്നതിനാൽ ‘വിശ്വസനീയനായ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി; മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
theological_decisions:
- issue: കർത്താവിന്റെ നേരിട്ടുള്ള കല്പനയും പൗലോസിന്റെ പരിഗണിച്ച അഭിപ്രായവും തമ്മിലുള്ള ബന്ധം
  choice: ഈ വിഷയത്തിൽ കർത്താവിൽനിന്നുള്ള നേരിട്ടുള്ള കല്പന തനിക്കില്ലെന്നു പൗലോസ് പറയുന്നു; എന്നിരുന്നാലും കർത്താവിന്റെ കരുണയാൽ വിശ്വസനീയനായ ഒരാളെന്ന നിലയിൽ തന്റെ അഭിപ്രായം നൽകുന്നു.
  alternative: ഇത് യാതൊരു അധികാരവുമില്ലാത്ത പൗലോസിന്റെ സ്വകാര്യാഭിപ്രായം മാത്രമാണ്; അല്ലെങ്കിൽ പൗലോസ് അറിയപ്പെടാത്ത ഒരു യേശുവചനത്തെ പരോക്ഷമായി ഉദ്ധരിക്കുന്നു.
  rationale: ἐπιταγήയും γνώμηയും തമ്മിലുള്ള വൈരുധ്യം നേരിട്ടുള്ള കർത്തൃകല്പനയും പൗലോസിന്റെ പരിഗണിച്ച വിലയിരുത്തലും വേർതിരിക്കുന്നു. എന്നാൽ πιστός എന്ന വിശേഷണം അദ്ദേഹത്തിന്റെ വാക്കിനെ വെറും സ്വകാര്യാഭിപ്രായമായി തള്ളുന്നില്ല. ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വിവർത്തനം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘കല്പന’, ‘കരുണ’, ‘വിശ്വസനീയൻ’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തിലെ അധികാരഭാവവും ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും നിലനിർത്തുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
