source:
  edition: SBLGNT
  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: ml
  text: പരിച്ഛേദനയേറ്റ നിലയിൽ വിളിക്കപ്പെട്ട ആരെങ്കിലുമുണ്ടോ? അയാൾ പരിച്ഛേദനയുടെ അടയാളങ്ങൾ മറയ്ക്കാൻ ശ്രമിക്കരുത്[a]. പരിച്ഛേദനയേൽക്കാത്ത നിലയിൽ വിളിക്കപ്പെട്ട ആരെങ്കിലുമുണ്ടോ? അയാൾ പരിച്ഛേദനയേൽക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘അയാൾ അഗ്രചർമം വലിച്ചുനീട്ടരുത്.’ അതായത്, പരിച്ഛേദനയുടെ അടയാളങ്ങൾ മറയ്ക്കാനോ പരിച്ഛേദനയില്ലാത്തതുപോലെ തോന്നിക്കാനോ ശ്രമിക്കരുത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: പരിച്ഛേദനയേറ്റ നിലയിൽ
  rationale: പൂർണകാല കൃദന്തം പരിച്ഛേദന നടന്നുകഴിഞ്ഞതിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ആ നിലയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκλήθη / κέκληταί
  choice: വിളിക്കപ്പെട്ട
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ വിളിയെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ വ്യാഖ്യാനം അതിരുകടക്കാതിരിക്കാൻ ‘മാനസാന്തരപ്പെട്ടു’ എന്ന പരാവർത്തനത്തിനു പകരം മൂലത്തിലെ ‘വിളി’ നിലനിർത്തുന്നു. രണ്ടു ക്രിയാരൂപങ്ങളിലെ കാലവ്യത്യാസം ഇവിടെ അർത്ഥഭാരം വഹിക്കുന്നതായി തോന്നാത്തതിനാൽ ഒരേ മലയാളരൂപം ഉപയോഗിച്ചു.
- source_word: ἐπισπάσθω
  choice: അതിന്റെ അടയാളങ്ങൾ മാറ്റാൻ ശ്രമിക്കരുത്
  rationale: പരിച്ഛേദനയുടെ ദൃശ്യമായ അടയാളങ്ങൾ മറയ്ക്കുകയോ പഴയ നിലയിലാക്കാൻ ശ്രമിക്കുകയോ ചെയ്യുന്നതാണ് ക്രിയയുടെ സന്ദർഭാർഥം. അവ്യക്തമായ അക്ഷരാർഥത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപം നൽകി; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: ἐν ἀκροβυστίᾳ
  choice: പരിച്ഛേദനയേൽക്കാത്ത നിലയിൽ
  rationale: വിളിക്കപ്പെട്ട സമയത്തെ അവസ്ഥയാണ് ഈ പദസമുച്ചയം സൂചിപ്പിക്കുന്നത്. ‘അഗ്രചർമത്തിൽ’ എന്ന കൃത്രിമമായ അക്ഷരാർഥം ഒഴിവാക്കി സ്വാഭാവികവും കൃത്യവുമായ മലയാളം ഉപയോഗിച്ചു.
- source_word: περιτεμνέσθω
  choice: പരിച്ഛേദനയേൽക്കരുത്
  rationale: μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിരോധനസ്വഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടു വാക്യഭാഗങ്ങളിലുമുള്ള ‘വിളിക്കപ്പെട്ട’ എന്നതിന്റെ അർഥം
  choice: ഒരു പ്രത്യേക മത-സാമൂഹിക നിലയിലിരിക്കെ ദൈവത്താൽ ക്രിസ്തീയജീവിതത്തിലേക്കു വിളിക്കപ്പെടുക
  alternative: പൊതുവായ അർഥത്തിൽ വിളിക്കപ്പെടുക
  rationale: 1 കൊരിന്ത്യർ 7-ന്റെ സമീപസന്ദർഭത്തിൽ പൗലോസ് ദൈവവിളി ലഭിച്ച സമയത്തെ വിശ്വാസിയുടെ നിലയെക്കുറിച്ചാണ് സംസാരിക്കുന്നത്. എങ്കിലും ‘മാനസാന്തരപ്പെട്ടു’ എന്നു പരാവർത്തനം ചെയ്ത് അർഥം അനാവശ്യമായി നിർണയിക്കാതെ ‘വിളിക്കപ്പെട്ട’ എന്ന മൂലരൂപം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി. ‘പരിച്ഛേദന’ എന്ന സ്ഥിരപ്രയോഗം നിലനിർത്തി; പുരാതന ശാരീരിക നടപടിയെ സൂചിപ്പിക്കുന്ന അപരിചിതമായ ക്രിയ അടിക്കുറിപ്പോടെ അർഥവ്യക്തമാക്കി.
