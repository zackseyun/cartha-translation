  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τιμῆς ἠγοράσθητε· μὴ γίνεσθε δοῦλοι ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: ml
  text: നിങ്ങൾ വിലയ്ക്കു വാങ്ങപ്പെട്ടവരാണ്; മനുഷ്യരുടെ അടിമകളായിത്തീരരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμῆς
  choice: വിലയ്ക്കു
  rationale: ἀγοράζω എന്ന ക്രിയയോടുള്ള ഈ ജനിറ്റീവ് വാങ്ങലിന്റെ വിലയെയോ ചെലവിനെയോ സൂചിപ്പിക്കുന്നു. തുക വ്യക്തമാക്കാതെ, വില കൊടുത്തുള്ള വാങ്ങൽ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἠγοράσθητε
  choice: നിങ്ങൾ വാങ്ങപ്പെട്ടവരാണ്
  rationale: ഇത് ഭൂതകാലത്തെ പൂർത്തിയായ സംഭവത്തെ സൂചിപ്പിക്കുന്ന, ദ്വിതീയപുരുഷ ബഹുവചന കർമണിപ്രയോഗമാണ്. ‘വാങ്ങപ്പെട്ടവരാണ്’ എന്നത് വാങ്ങൽ-ഉടമസ്ഥതയുടെ രൂപകം സംരക്ഷിക്കുകയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ γίνεσθε
  choice: ആയിത്തീരരുത്
  rationale: γίνομαι എന്നത് വെറും ‘ആയിരിക്കുക’ എന്നതിലുപരി ‘ആയിത്തീരുക’ എന്നാണ്. μή ചേർന്ന വർത്തമാനകാല ആജ്ഞാപ്രയോഗം അത്തരമൊരു നിലയിലേക്കു കടക്കുന്നതോ അതിൽ തുടരുന്നതോ വിലക്കുന്നു.
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: സന്ദർഭത്തിൽ വാങ്ങലും ഉടമസ്ഥതയും അനുസരണബന്ധവും പ്രധാനമായതിനാൽ ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ ഗ്രീക്ക് പദത്തിന്റെ ശക്തി വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ഈ ബഹുവചന ജനിറ്റീവ് മനുഷ്യരെയാകെ സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരെ മാത്രം അല്ല. ദൈവിക ഉടമസ്ഥതയ്ക്കു വിരുദ്ധമായ മനുഷ്യാധിപത്യമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: δοῦλοι ἀνθρώπων എന്ന പ്രയോഗത്തിലെ ഉടമസ്ഥതയുടെയും അനുസരണത്തിന്റെയും രൂപകം
  choice: മനുഷ്യരുടെ അടിമകൾ
  alternative: മനുഷ്യരുടെ ദാസന്മാർ
  rationale: വിശ്വാസികൾ വിലയ്ക്കു വാങ്ങപ്പെട്ടവർ എന്ന ആദ്യവാക്യത്തോടുള്ള പ്രത്യക്ഷബന്ധം നിലനിർത്താൻ ‘അടിമകൾ’ അനുയോജ്യമാണ്. ഇതിലൂടെ ഏതൊരു നിയമാനുസൃത സേവനവും നിരോധിക്കപ്പെടുന്നു എന്ന് അധികമായി വ്യാഖ്യാനിക്കാതെ, മനുഷ്യരുടെ പരമാധികാരത്തിന് കീഴടങ്ങരുതെന്ന തീവ്രമായ ആശയം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ രണ്ടു ഖണ്ഡങ്ങളുടെയും നേരിട്ടുള്ള വിരോധബന്ധം നിലനിർത്തിയിരിക്കുന്നു; ആവശ്യമില്ലാത്ത വ്യാഖ്യാനപദങ്ങളോ വിഭാഗീയ പ്രയോഗങ്ങളോ ചേർത്തിട്ടില്ല.
