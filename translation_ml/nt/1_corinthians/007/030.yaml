  to: കരയുന്നവർ കരയാത്തവരെപ്പോലെയും, സന്തോഷിക്കുന്നവർ സന്തോഷിക്കാത്തവരെപ്പോലെയും, വാങ്ങുന്നവർ തങ്ങൾ വാങ്ങിയത് സ്വന്തമായി കൈവശം വയ്ക്കാത്തവരെപ്പോലെയും ആയിരിക്കട്ടെ.[a]
