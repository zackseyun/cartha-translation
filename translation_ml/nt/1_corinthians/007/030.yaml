  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: ml
  text: കരയുന്നവർ കരയാത്തവരെപ്പോലെയും, സന്തോഷിക്കുന്നവർ സന്തോഷിക്കാത്തവരെപ്പോലെയും, വാങ്ങുന്നവർ തങ്ങൾ വാങ്ങിയത് സ്വന്തമായി കൈവശം വയ്ക്കാത്തവരെപ്പോലെയും ആയിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കരയുന്നില്ലെന്നപോലെയും … സന്തോഷിക്കുന്നില്ലെന്നപോലെയും … സ്വന്തമായി കൈവശം വയ്ക്കുന്നില്ലെന്നപോലെയും.’ ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ‘...ചെയ്യാത്തവരെപ്പോലെ’ എന്ന പ്രയോഗം ഈ അനുഭവങ്ങൾ യഥാർഥത്തിൽ സംഭവിക്കുന്നില്ലെന്ന നിഷേധമല്ല; അവയോടുള്ള ഒരാളുടെ ജീവിതനിലപാടിനെ സൂചിപ്പിക്കുന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαίοντες
  choice: കരയുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം നാമപദമായി പ്രവർത്തിക്കുന്നു. ‘കരയുന്നവർ’ എന്നത് വികാരത്തിന്റെ ദൃശ്യമായ പ്രവൃത്തിയെ നേരിട്ട് നിലനിർത്തുന്നു; ‘ദുഃഖിക്കുന്നവർ’ എന്ന വ്യാഖ്യാനപരമായ അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ὡς μὴ κλαίοντες
  choice: കരയാത്തവരെപ്പോലെ
  rationale: ὡς μή + കൃദന്തം യാഥാർഥ്യത്തെ നിഷേധിക്കുന്നതിലുപരി ജീവിക്കുന്ന രീതിയോ നിലപാടോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികവും ആവർത്തിത സമാന്തരഘടന നിലനിർത്തുന്നതുമാണ്.
- source_word: χαίροντες
  choice: സന്തോഷിക്കുന്നവർ
  rationale: χαίρω ഇവിടെ ആനന്ദം പ്രകടിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സന്തോഷിക്കുക’ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ὡς μὴ χαίροντες
  choice: സന്തോഷിക്കാത്തവരെപ്പോലെ
  rationale: മുൻ ഉപവാക്യത്തിലെ ὡς μή ഘടനയോടുള്ള വാചകസമാന്തര്യം കാത്തുസൂക്ഷിക്കുന്നു; സന്തോഷം സംഭവിക്കുന്നില്ലെന്ന നിഷേധമായി ഇതിനെ അവതരിപ്പിക്കുന്നില്ല.
- source_word: ἀγοράζοντες
  choice: വാങ്ങുന്നവർ
  rationale: സാധാരണ വാണിജ്യപരമായ വാങ്ങലിനെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: κατέχοντες
  choice: കൈവശമുള്ളവർ
  rationale: κατέχω എന്നതിന് പിടിച്ചുവയ്ക്കുക, കൈവശംവയ്ക്കുക, സ്വന്തമാക്കുക എന്നീ അർഥങ്ങൾ വരാം. വാങ്ങുന്നതുമായുള്ള വൈരുധ്യത്തിൽ ‘കൈവശമുള്ളവർ’ ഉടമസ്ഥാവകാശബോധവും ഉറച്ച പിടിയും ഒരളവുവരെ തുറന്നുവയ്ക്കുന്നു.
- source_word: καὶ
  choice: -ഉം / സംയോജക സമാന്തരഘടന
  rationale: ആവർത്തിക്കുന്ന καὶ ഓരോ വിഭാഗത്തെയും താളാത്മകമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഉം’ ഘടന അതേ സഞ്ചിത സമാന്തര്യം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന ὡς μή (‘അല്ലാത്തവരെപ്പോലെ’) പ്രയോഗങ്ങളുടെ വ്യാഖ്യാനബലം
  choice: കരച്ചിലും സന്തോഷവും വാങ്ങലും യഥാർഥത്തിൽ സംഭവിക്കുന്നുവെന്നത് നിഷേധിക്കാതെ, അവയോടുള്ള ആസക്തിയില്ലാത്ത ജീവിതനിലപാട് സൂചിപ്പിക്കുന്ന രൂപം നിലനിർത്തി.
  alternative: ഈ പ്രവൃത്തികൾ സ്വഭാവതഃ തെറ്റാണെന്ന ശക്തമായ സന്യാസപരമായ വായന; അല്ലെങ്കിൽ സമീപകാലവും ലോകത്തിന്റെ രൂപം കടന്നുപോകുന്നതുമായ സന്ദർഭം അവഗണിക്കുന്ന ശുദ്ധ മാനസിക വായന.
  rationale: 1 കൊരിന്ത്യർ 7:26,31-ലെ ‘ഇപ്പോഴത്തെ കഷ്ടാവസ്ഥ’, ‘ഈ ലോകത്തിന്റെ രൂപം കടന്നുപോകുന്നു’ എന്നീ സന്ദർഭസൂചനകളിൽ ὡς μή + കൃദന്തം സമ്പൂർണ നിരോധനമല്ല, ഒരു വിധത്തിലുള്ള നിലപാടാണ് സൂചിപ്പിക്കുന്നത്. പരിഭാഷ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ മൂന്ന് സമാന്തര കൃദന്തഘടനകളും ആവർത്തിത ‘ὡς μή’ രൂപവും മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ നിലനിർത്തി. മുൻവാക്യത്തിൽനിന്ന് തുടരുന്ന നിർദേശത്തിന്റെ ബലം വ്യക്തമാക്കാൻ അവസാനം ‘ആയിരിക്കട്ടെ’ ചേർത്തു.
