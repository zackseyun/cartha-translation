id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: ml
  text: സഹോദരന്മാരേ[b], ഓരോരുത്തനും താൻ വിളിക്കപ്പെട്ട അവസ്ഥയിൽത്തന്നെ ദൈവത്തോടൊപ്പം[a] തുടരട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ മുമ്പാകെ’ അല്ലെങ്കിൽ ‘ദൈവസന്നിധിയിൽ.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സഹോദരന്മാരേ’ എന്ന അഭിസംബോധന സ്ത്രീകളുൾപ്പെടെ സഭയിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വിതരണാർഥമുള്ള ഏകവചനത്തിന്റെ വ്യക്തിഗത പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: താൻ വിളിക്കപ്പെട്ട അവസ്ഥയിൽത്തന്നെ
  rationale: ആവർത്തിച്ചുള്ള ἐν ഘടന ഒരാളുടെ ഭൗതിക സ്ഥലം മാത്രമല്ല, വിളിക്കപ്പെട്ടപ്പോഴുണ്ടായിരുന്ന ജീവിതാവസ്ഥയെയോ സാമൂഹിക സാഹചര്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘-ത്തന്നെ’ ἐν τούτῳ എന്ന തിരിച്ചുചൂണ്ടൽ പ്രകടമാക്കുന്നു.
- source_word: ἐκλήθη
  choice: വിളിക്കപ്പെട്ട
  rationale: ദൈവമാണ് വിളിക്കുന്നവൻ എന്നു സന്ദർഭം സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് വാക്യം കർത്താവിനെ തുറന്നുപറയുന്നില്ല; അതിനാൽ കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: സഭയെ അഭിസംബോധന ചെയ്യുന്ന പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം സംരക്ഷിക്കുന്നു; ഇവിടെ സ്ത്രീകളും ഉൾപ്പെടുന്നുവെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μενέτω
  choice: നിലനിൽക്കട്ടെ
  rationale: നിലവിലുള്ള അവസ്ഥയിൽ തുടരുക എന്ന μένωയുടെ ആജ്ഞാർഥം ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: παρὰ θεῷ
  choice: ദൈവത്തോടുകൂടെ
  rationale: παρά + ചതുർത്ഥി ഇവിടെ ദൈവത്തോടുള്ള അടുപ്പമോ ബന്ധമോ സൂചിപ്പിക്കാം; ചുരുക്കമുള്ള ഗ്രീക്ക് പ്രയോഗത്തിന്റെ മുഖ്യസാധ്യത ഈ പരിഭാഷ നിലനിർത്തുന്നു, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘വിളിക്കപ്പെട്ട’ എന്നതിൽ ദൈവത്തിന്റെ കർത്തൃത്വം തുറന്നുചേർക്കണമോ
  choice: ‘ദൈവത്താൽ’ എന്നു ചേർക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തുക
  alternative: ദൈവത്താൽ വിളിക്കപ്പെട്ട
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ദൈവിക വിളി ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്നുവെങ്കിലും മൂലവാക്യത്തിൽ കർത്താവ് വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ പദം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: സമ്മിശ്ര ലിംഗമുള്ള സഭയെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ സംബോധന മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും അതിന്റെ പ്രതിനിധാനപരമായ ഉൾക്കൊള്ളൽ അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: παρὰ θεῷ എന്നതിലെ ബന്ധപരവും സന്നിധിപരവുമായ അർഥസാധ്യത
  choice: ദൈവത്തോടുകൂടെ
  alternative: ദൈവസന്നിധിയിൽ / ദൈവത്തിന്റെ മുമ്പാകെ
  rationale: ഗ്രീക്ക് പ്രയോഗം ദൈവത്തോടുള്ള ബന്ധവും ദൈവസന്നിധിയിൽ ജീവിക്കുന്നതും തമ്മിൽ അർഥസാന്ദ്രമാണ്. മുഖ്യപാഠത്തിൽ ബന്ധപരമായ അർഥം എടുത്ത് മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അവസ്ഥയിൽത്തന്നെ’ എന്ന രൂപം ഗ്രീക്കിലെ ബന്ധസൂചക–തിരിച്ചുചൂണ്ടൽ ഘടന ചുരുക്കമായും സ്വാഭാവികമായും പ്രതിഫലിപ്പിക്കുന്നു.
