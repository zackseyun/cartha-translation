language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ἄπιστος χωρίζεται, χωριζέσθω· οὐ δεδούλωται ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ ἐν τοῖς τοιούτοις, ἐν δὲ εἰρήνῃ κέκληκεν ⸀ἡμᾶς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: ml
  text: എന്നാൽ അവിശ്വാസി വേർപിരിയുന്നുവെങ്കിൽ, വേർപിരിയട്ടെ. ഇത്തരം സാഹചര്യങ്ങളിൽ സഹോദരനോ സഹോദരിയോ അടിമയാക്കപ്പെട്ടിട്ടില്ല.[a][b] എന്നാൽ ദൈവം നമ്മെ സമാധാനത്തിൽ വിളിച്ചിരിക്കുന്നു.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സന്ദർഭാനുസൃതമായി: ‘അവിശ്വാസിയായ ജീവിതപങ്കാളി.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ബന്ധിതനോ ബന്ധിതയോ അല്ല.’ എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘അടിമയാക്കുക’ എന്നാണ്; സാധാരണ ‘ബന്ധിക്കുക’ എന്നർഥമുള്ള ക്രിയയല്ല.
    reason: lexical_alternative
  - marker: c
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘നമ്മെ’ എന്നതിനുപകരം ‘നിങ്ങളെ’ എന്നു കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: അവിശ്വാസിയായ ആൾ
  rationale: സന്ദർഭത്തിൽ അവിശ്വാസിയായ ജീവിതപങ്കാളിയെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഗ്രീക്കിൽ ‘ജീവിതപങ്കാളി’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ പരോക്ഷത നിലനിർത്തി സ്വാഭാവികമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: χωρίζεται / χωριζέσθω
  choice: വേർപിരിയുന്നെങ്കിൽ, വേർപിരിയട്ടെ
  rationale: രണ്ടു ക്രിയാരൂപങ്ങളിലുമുള്ള പദാവർത്തനം നിലനിർത്തുന്നു; ഇത് നിയമപരമായ വിവാഹമോചനമാണോ ശാരീരികമായ വിട്ടുപോകലാണോ എന്നു വിവർത്തനം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല. ആജ്ഞാരൂപം ഇവിടെ അനുവദനീയമായ സമ്മതമായി സ്വാഭാവികമായി വായിക്കാം.
- source_word: οὐ δεδούλωται
  choice: അടിമപ്പെട്ടിട്ടില്ല
  rationale: δουλόω എന്നത് ‘അടിമയാക്കുക’ എന്ന ക്രിയയാണ്; സാധാരണ ‘ബന്ധിക്കുക’ എന്നർഥമുള്ള δέω അല്ല. അതിനാൽ പുനർവിവാഹത്തെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക നിഗമനം വിവർത്തനത്തിൽ ചേർക്കാതെ മൂലപദത്തിന്റെ രൂപകം സൂക്ഷിക്കുന്നു.
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: സഹോദരനോ സഹോദരിയോ
  rationale: വിശ്വാസസമൂഹത്തിലെ പുരുഷനെയും സ്ത്രീയെയും വേർതിരിച്ച് പറയുന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς τοιούτοις
  choice: ഇത്തരം സാഹചര്യങ്ങളിൽ
  rationale: ഇപ്പോൾ വിവരിച്ചിരിക്കുന്നതുപോലുള്ള സംഭവങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ഇടിയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν δὲ εἰρήνῃ
  choice: എന്നാൽ ... സമാധാനത്തിൽ
  rationale: ἐν എന്നതിന്റെ മേഖലയെയോ നിലയെയോ സൂചിപ്പിക്കുന്ന അർഥം ‘സമാധാനത്തിൽ’ എന്ന നേരിട്ടുള്ള പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: ദൈവം നമ്മെ ... വിളിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ വിളിയും അതിന്റെ തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്ന perfect രൂപത്തെ ‘വിളിച്ചിരിക്കുന്നു’ എന്നു നൽകുന്നു; SBLGNT-യിലെ ἡμᾶς എന്ന വായനയ്ക്ക് ‘നമ്മെ’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: οὐ δεδούλωται എന്നതിന്റെ വിവാഹമോചനത്തോടും പുനർവിവാഹത്തോടുമുള്ള ബന്ധം
  choice: ‘അടിമപ്പെട്ടിട്ടില്ല’ എന്നു പദസമീപമായി വിവർത്തനം ചെയ്ത് ആ സ്വാതന്ത്ര്യത്തിന്റെ പൂർണ വ്യാപ്തി നിർവചിക്കാതെ വിടുന്നു.
  alternative: ‘ബന്ധിതനല്ല/ബന്ധിതയല്ല’ എന്നു നൽകി പുനർവിവാഹത്തിനുള്ള സാങ്കേതിക അനുമതിയായി വായിക്കുക; അല്ലെങ്കിൽ വിട്ടുപോകുന്ന പങ്കാളിയെ നിർബന്ധിച്ച് പിന്തുടരേണ്ടതില്ല എന്നതിൽ മാത്രം പരിമിതപ്പെടുത്തുക.
  rationale: വാക്യം വിശ്വാസി ഇത്തരം സാഹചര്യത്തിൽ അടിമപ്പെട്ടിട്ടില്ലെന്ന് പറയുന്നു; എന്നാൽ അതിന്റെ എല്ലാ നിയമപരമോ വിവാഹപരമോ ആയ ഫലങ്ങളും ഇവിടെ തുറന്നുപറയുന്നില്ല. അതിനാൽ മതവിഭാഗപരമായ നിഗമനം ചേർക്കുന്നില്ല.
- issue: ὁ ἄπιστος എന്നതിന്റെ പരാമർശവിഷയം
  choice: മുഖ്യപാഠത്തിൽ ‘അവിശ്വാസിയായ ആൾ’ എന്നു നൽകി, സന്ദർഭത്തിൽ അത് അവിശ്വാസിയായ ജീവിതപങ്കാളിയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: മുഖ്യപാഠത്തിൽ തന്നെ ‘അവിശ്വാസിയായ ജീവിതപങ്കാളി’ എന്നു വ്യക്തമാക്കുക.
  rationale: വിവാഹസന്ദർഭം പരാമർശവിഷയം വ്യക്തമാക്കുന്നുവെങ്കിലും ഗ്രീക്ക് നാമവത്കൃത വിശേഷണത്തിൽ ‘ജീവിതപങ്കാളി’ എന്ന നാമം പ്രകടമല്ല; അതിനാൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും പരോക്ഷതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അടിമപ്പെട്ടിട്ടില്ല’ എന്ന മൂലപദസമീപ പ്രയോഗം ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യപാഠഭാഗത്തിനു പിന്നാലെ നൽകിയിരിക്കുന്നു.
