revisions:
- from: എന്നാൽ അവിശ്വാസിയായ ആൾ വേർപിരിയുന്നെങ്കിൽ, വേർപിരിയട്ടെ. ഇത്തരം സാഹചര്യങ്ങളിൽ സഹോദരനോ സഹോദരിയോ അടിമപ്പെട്ടിട്ടില്ല.[a][b] എന്നാൽ ദൈവം നമ്മെ സമാധാനത്തിൽ വിളിച്ചിരിക്കുന്നു.[c]
  to: എന്നാൽ അവിശ്വാസി വേർപിരിയുന്നുവെങ്കിൽ, വേർപിരിയട്ടെ. ഇത്തരം സാഹചര്യങ്ങളിൽ സഹോദരനോ സഹോദരിയോ അടിമയാക്കപ്പെട്ടിട്ടില്ല.[a][b] എന്നാൽ ദൈവം നമ്മെ സമാധാനത്തിൽ വിളിച്ചിരിക്കുന്നു.[c]
  rationale: The revision is limited to safe stylistic and lexical clarification. ‘അവിശ്വാസി’ is a natural Malayalam substantival equivalent of ὁ ἄπιστος and does not over-specify the referent. ‘അടിമയാക്കപ്പെട്ടിട്ടില്ല’ more transparently conveys the perfect passive force of οὐ δεδούλωται. No conclusion about divorce, remarriage, or the scope of freedom is added. All footnote anchors remain present and attached to their relevant clauses.
