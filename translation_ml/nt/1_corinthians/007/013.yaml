review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the marital sense of γυνή/ἀνήρ, the husband's willing agreement (συνευδοκεῖ), shared residence, and the prohibition expressed by μὴ ἀφιέτω. However, its opening construction is syntactically awkward and can momentarily suggest that the husband is to live with “a woman” in a non-specific sense, rather than with his own wife.
  naturalness: “അവിശ്വാസിയായ ഭർത്താവുള്ള ഒരു സ്ത്രീയുടെ കൂടെ താമസിക്കാൻ” is grammatically parseable but unnatural because the long modifier intervenes before “കൂടെ.” Recasting the condition with “ഒരു സ്ത്രീക്ക് ... ഭർത്താവുണ്ടെങ്കിൽ” and “അവളോടൊപ്പം” is clear, idiomatic modern standard Malayalam.
  terminology: '“അവിശ്വാസിയായ” and “ഭർത്താവ്” are appropriate. “ഉപേക്ഷിക്കരുത്” appropriately retains the Greek verb’s breadth in this marital context without narrowing it to a technical legal term for divorce. The footnote should present its alternatives more accurately and idiomatically: “വിട്ടയയ്ക്കുക” is closer to the active Greek form, while “വിട്ടുപിരിയുക” conveys the marital-context sense.'
  issues:
  - severity: medium
    issue: Opening conditional is awkwardly attached to “കൂടെ താമസിക്കാൻ.”
    rationale: 'The wording “അവിശ്വാസിയായ ഭർത്താവുള്ള ഒരു സ്ത്രീയുടെ കൂടെ താമസിക്കാൻ” delays identification of the husband as the subject and makes the relationship less immediately clear. The Greek explicitly states the general case: if a woman has an unbelieving husband, and he is willing to live with her.'
  - severity: low
    issue: Footnote’s lexical alternatives need idiomatic refinement.
    rationale: “വിട്ടുപോകുക” does not directly reflect the active construction with the husband as object. “വിട്ടയയ്ക്കുക” and, in marital context, “വിട്ടുപിരിയുക” better explain the range without overstating a technical divorce sense.
  revised_text: ഒരു സ്ത്രീക്ക് അവിശ്വാസിയായ ഭർത്താവുണ്ടെങ്കിൽ, അയാൾ അവളോടൊപ്പം താമസിക്കാൻ സമ്മതിക്കുന്നുവെങ്കിൽ, അവൾ ഭർത്താവിനെ ഉപേക്ഷിക്കരുത്.[a]
