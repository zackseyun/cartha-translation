id: 1CO.7.13
reference: 1 Corinthians 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γυνὴ ⸂εἴ τις⸃ ἔχει ἄνδρα ἄπιστον, καὶ ⸀οὗτος συνευδοκεῖ οἰκεῖν μετ’ αὐτῆς, μὴ ἀφιέτω ⸂τὸν ἄνδρα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: ml
  text: ഒരു സ്ത്രീക്ക് അവിശ്വാസിയായ ഭർത്താവുണ്ടെങ്കിൽ, അയാൾ അവളോടൊപ്പം താമസിക്കാൻ സമ്മതിക്കുന്നുവെങ്കിൽ, അവൾ ഭർത്താവിനെ ഉപേക്ഷിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭർത്താവിൽനിന്ന് വേർപിരിയരുത്.” ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ അക്ഷരാർഥത്തിൽ “വിട്ടയയ്ക്കുക” എന്നു പരിഭാഷപ്പെടുത്താം; വിവാഹസന്ദർഭത്തിൽ അത് വിവാഹബന്ധം അവസാനിപ്പിക്കുകയോ ഭർത്താവിൽനിന്ന് വേർപിരിയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις ἔχει ἄνδρα ἄπιστον
  choice: അവിശ്വാസിയായ ഭർത്താവുള്ള ഒരു സ്ത്രീ
  rationale: γυνή, ἀνήρ എന്നിവയ്ക്ക് പൊതുവേ ‘സ്ത്രീ’, ‘പുരുഷൻ’ എന്നും അർഥമുണ്ടെങ്കിലും ഇവിടെ വിവാഹസന്ദർഭം ‘സ്ത്രീ’, ‘ഭർത്താവ്’ എന്ന അർഥം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാവാക്യമായി രൂപപ്പെടുത്തി.
- source_word: ἄπιστον
  choice: അവിശ്വാസിയായ
  rationale: ഇവിടെ ക്രിസ്തീയവിശ്വാസം പങ്കിടാത്ത ജീവിതപങ്കാളിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശ്വാസവഞ്ചകനായ’ എന്നത് ദാമ്പത്യവഞ്ചന എന്ന തെറ്റായ ധാരണ നൽകാം.
- source_word: οὗτος συνευδοκεῖ
  choice: അയാൾ സമ്മതിക്കുന്നെങ്കിൽ
  rationale: οὗτος ഭർത്താവിലേക്കു തിരികെ ചൂണ്ടുന്നു; συνευδοκεῖ മനസ്സോടെയുള്ള യോജിപ്പിനെയോ സമ്മതത്തെയോ സൂചിപ്പിക്കുന്നു.
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: അവളുടെ കൂടെ താമസിക്കാൻ
  rationale: തുടർന്നുള്ള ഒരുമിച്ചുള്ള ഗാർഹികജീവിതം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: അവൾ ഭർത്താവിനെ ഉപേക്ഷിക്കരുത്
  rationale: ἀφίημι എന്ന ക്രിയയ്ക്ക് ‘വിട്ടയയ്ക്കുക’, ‘വിട്ടുപോകുക’, ‘ഉപേക്ഷിക്കുക’ എന്നീ വ്യാപ്തികളുണ്ട്. വിവാഹബന്ധം അവസാനിപ്പിക്കരുതെന്ന സന്ദർഭാർഥം നിലനിർത്തിക്കൊണ്ട്, ‘വിവാഹമോചനം ചെയ്യരുത്’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ യഥാർഥ വ്യാപ്തി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: മിശ്രവിശ്വാസ ദാമ്പത്യത്തിൽ ἀφιέτω എന്ന നിർദേശം എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ഭർത്താവിനെ ഉപേക്ഷിക്കരുത്
  alternative: ഭർത്താവിൽനിന്ന് വിവാഹമോചനം നേടരുത് / ഭർത്താവിനെ വിട്ടയയ്ക്കരുത്
  rationale: സന്ദർഭത്തിൽ വിവാഹബന്ധം അവസാനിപ്പിക്കുന്നതിനെക്കുറിച്ചാണ് നിർദേശം. എന്നാൽ ഗ്രീക്ക് ക്രിയ നിയമപരമായ വിവാഹമോചനത്തിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തുന്നില്ല; അതിനാൽ വിശാലതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്ന ‘ഉപേക്ഷിക്കരുത്’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അയാൾ’ എന്ന പ്രയോഗം ഭർത്താവിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു. പ്രധാനവാക്യത്തിൽ ‘ഉപേക്ഷിക്കുക’ ഉപയോഗിച്ച് മൂലത്തിലെ അർഥവ്യാപ്തി സംരക്ഷിക്കുകയും അടിക്കുറിപ്പിൽ വേർപിരിയൽ/വിട്ടയയ്ക്കൽ സാധ്യത വ്യക്തമാക്കുകയും ചെയ്തു.
