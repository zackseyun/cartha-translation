revisions:
- from: അവിശ്വാസിയായ ഭർത്താവുള്ള ഒരു സ്ത്രീയുടെ കൂടെ താമസിക്കാൻ അയാൾ സമ്മതിക്കുന്നെങ്കിൽ, അവൾ ഭർത്താവിനെ ഉപേക്ഷിക്കരുത്.[a]
  to: ഒരു സ്ത്രീക്ക് അവിശ്വാസിയായ ഭർത്താവുണ്ടെങ്കിൽ, അയാൾ അവളോടൊപ്പം താമസിക്കാൻ സമ്മതിക്കുന്നുവെങ്കിൽ, അവൾ ഭർത്താവിനെ ഉപേക്ഷിക്കരുത്.[a]
  rationale: The revision makes the two linked conditions explicit and natural in Malayalam, restores the referentially clear “അവളോടൊപ്പം,” and retains the source’s non-technical but marital-contextual force for ἀφιέτω. The footnote is revised to explain the lexical range without implying that the Greek necessarily specifies a formal legal divorce.
  reviewer_model: gpt-5.6-terra
