source:
  edition: SBLGNT
  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: ml
  text: 'എന്നാൽ മറ്റുള്ളവരോട് ഞാൻ പറയുന്നു—കർത്താവല്ല—: ഒരു സഹോദരന് അവിശ്വാസിയായ ഭാര്യയുണ്ടാകുകയും അവൾ അവനോടൊപ്പം താമസിക്കാൻ സമ്മതിക്കുകയും ചെയ്യുന്നുവെങ്കിൽ, അവൻ അവളെ വിവാഹമോചനം ചെയ്യരുത്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവളെ വിട്ടുപോകരുത്’ അല്ലെങ്കിൽ ‘അവളെ പറഞ്ഞയയ്ക്കരുത്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയുടെ കൂടുതൽ അക്ഷരാർഥം ‘വിടുക’ അല്ലെങ്കിൽ ‘പറഞ്ഞയയ്ക്കുക’ എന്നാണ്; എന്നാൽ ഇവിടെ അത് വിവാഹബന്ധം അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: എന്നാൽ ശേഷിക്കുന്നവരോട്
  rationale: λοιποί മുമ്പത്തെ നിർദേശത്തിൽ ഉൾപ്പെടാത്ത ശേഷിക്കുന്ന വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ മൃദുവായ മാറ്റമോ വ്യത്യാസമോ അടയാളപ്പെടുത്തുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: കർത്താവല്ല, ഞാൻതന്നെയാണ് പറയുന്നത്
  rationale: ἐγώ എന്ന ഊന്നൽ ‘ഞാൻതന്നെ’ എന്നു നിലനിർത്തി. പൗലൊസിന്റെ നിർദേശവും കർത്താവായ യേശുവിന്റെ നേരിട്ടുള്ള വചനവും തമ്മിലുള്ള വ്യത്യാസം വാചകം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἀδελφὸς
  choice: ഒരു സഹോദരൻ
  rationale: ഇവിടെ ഭാര്യയോടു വിപരീതമായി പരാമർശിക്കപ്പെടുന്ന പുരുഷവിശ്വാസിയെയാണ് ഏകവചന പുല്ലിംഗപദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ ലിംഗനിർദ്ദിഷ്ടമായ ‘സഹോദരൻ’ നിലനിർത്തി.
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: അവിശ്വാസിയായ ഭാര്യ ഉണ്ടായിരിക്കുക
  rationale: ἔχει γυναῖκα വിവാഹബന്ധത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്. ἄπιστος ഇവിടെ ദാമ്പത്യ അവിശ്വസ്തതയെയല്ല, ക്രിസ്തീയ വിശ്വാസം പങ്കിടാത്തതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവിശ്വാസിയായ’ എന്നു നൽകി.
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: അവൾ ... സമ്മതിക്കുക
  rationale: συνευδοκέω നിർദേശിച്ച ക്രമീകരണത്തോടുള്ള മനസ്സോടെയുള്ള അംഗീകാരത്തെ സൂചിപ്പിക്കുന്നു; ‘സമ്മതിക്കുക’ അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: അവനോടൊപ്പം താമസിക്കാൻ
  rationale: οἰκέω μετά എന്ന പ്രയോഗം ഒരുമിച്ചുള്ള ഗാർഹികജീവിതത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ഒപ്പം താമസിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: μὴ ἀφιέτω αὐτήν
  choice: അവളെ വിവാഹമോചനം ചെയ്യരുത്
  rationale: ἀφίημι എന്നതിന് അക്ഷരാർഥത്തിൽ വിടുക/പറഞ്ഞയയ്ക്കുക എന്ന വ്യാപ്തിയുണ്ടെങ്കിലും ഈ ദാമ്പത്യസന്ദർഭത്തിൽ വിവാഹബന്ധം അവസാനിപ്പിക്കലാണ് ഉദ്ദേശ്യം. ‘വിവാഹമോചനം ചെയ്യരുത്’ ആ ബന്ധപരമായ അർഥം വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ വിപുലമായ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
theological_decisions:
- issue: ‘കർത്താവല്ല, ഞാൻതന്നെ’ എന്ന പൗലൊസിന്റെ പ്രസ്താവന
  choice: യേശുവിന്റെ ഭൗമിക ശുശ്രൂഷയിൽനിന്നുള്ള നേരിട്ടുള്ള വചനവും പൗലൊസിന്റെ ഈ നിർദേശവും തമ്മിലുള്ള വ്യത്യാസം മാത്രം വാചകത്തിൽ നിലനിർത്തുന്നു.
  alternative: ഇത് അധികാരമില്ലാത്ത പൗലൊസിന്റെ സ്വകാര്യാഭിപ്രായം മാത്രമാണെന്ന വായന.
  rationale: മൂലവാചകം ഈ വ്യത്യാസം പ്രകടമാക്കുന്നു, എന്നാൽ പൗലൊസിന്റെ അപ്പൊസ്തലിക അധികാരത്തെയോ പ്രചോദനത്തെയോ നിഷേധിക്കുന്നതായി പറയുന്നില്ല. വിവർത്തനം ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘ഞാൻതന്നെ’ മൂലത്തിലെ ഊന്നൽ നിലനിർത്തുന്നു; ‘അവിശ്വാസിയായ’ എന്നത് ദാമ്പത്യ അവിശ്വസ്തതയല്ല, വിശ്വാസം പങ്കിടാത്ത അവസ്ഥയാണെന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു.
