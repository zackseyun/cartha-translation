  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ ഇതു പറയുന്നത് ഒരു ഇളവ് എന്ന നിലയിലാണ്[a], കല്പന എന്ന നിലയിലല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇളവായിട്ട്’ അല്ലെങ്കിൽ ‘അനുവാദം എന്ന നിലയിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ഇതു
  rationale: സന്ദർഭത്തിൽ തൊട്ടുമുമ്പുള്ള പ്രസ്താവനയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ദിശ അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ഇളവും കല്പനയും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: λέγω
  choice: ഞാൻ ... പറയുന്നത്
  rationale: ഗ്രീക്ക് വർത്തമാനകാല ക്രിയയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κατὰ συγγνώμην
  choice: ഒരു ഇളവ് എന്ന നിലയിലാണ്
  rationale: ഇവിടെ συγγνώμη എന്നത് ക്ഷമയെയല്ല, അനുവദിച്ചുകൊടുക്കുന്ന ഇളവിനെയാണ് സൂചിപ്പിക്കുന്നത്; ἐπιταγήയോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: οὐ κατ’ ἐπιταγήν
  choice: കല്പന എന്ന നിലയിലല്ല
  rationale: അധികാരപൂർവമായ നിർദേശം അല്ലെന്ന ആശയം വ്യക്തമായും ആദ്യഘടകത്തോട് സമാന്തരമായും നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വാക്ക് വ്യക്തിപരമായ അനുമതിയാണോ, കുറഞ്ഞ നിലയിലുള്ള ദൈവിക കല്പനയാണോ എന്ന ചോദ്യം
  choice: ഈ പ്രസ്താവനയെ നിർബന്ധകമായ കല്പനയല്ല, ഒരു ഇളവായാണ് പൗലോസ് അവതരിപ്പിക്കുന്നതെന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: അപ്പോസ്തോലിക അധികാരമുള്ള ഉപദേശമെങ്കിലും നേരിട്ടുള്ള കല്പനയല്ലെന്ന് വ്യാഖ്യാനിച്ച് കൂടുതൽ വ്യക്തമാക്കുക.
  rationale: മൂലവാക്യം ഇളവും കല്പനയും തമ്മിൽ മാത്രം വ്യക്തമായ വ്യത്യാസം വരയ്ക്കുന്നു. പൗലോസിന്റെ അധികാരത്തിന്റെ വ്യാപ്തിയെക്കുറിച്ച് വാക്യം പറയുന്നതിലധികം വിവർത്തനത്തിൽ നിർണയിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കല്പന’ ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും ഇവിടെ അധികാരപൂർവമായ നിർദേശം എന്ന അർഥം വ്യക്തമാക്കുന്നതുമാണ്; ‘ഇളവ്’ συγγνώμηയുടെ സന്ദർഭോചിതമായ അനുവദനീയത പ്രകടിപ്പിക്കുന്നു.
