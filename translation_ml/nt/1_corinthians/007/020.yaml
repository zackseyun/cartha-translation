source:
  edition: SBLGNT
  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: ml
  text: ഓരോരുത്തനും താൻ വിളിക്കപ്പെട്ട വിളിയിൽത്തന്നെ തുടരട്ടെ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിളി’ എന്നതിന് ഇവിടെ ‘അവസ്ഥ,’ ‘സാഹചര്യം,’ അല്ലെങ്കിൽ ‘ജീവിതനില’ എന്നും അർഥമാകാം. ഗ്രീക്കിൽ ‘വിളി’ എന്ന പദം അതേ വാക്യത്തിലെ ‘വിളിക്കപ്പെട്ടു’ എന്നതിനെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം ഉപയോഗിക്കുന്നു; ഈ നിർദേശം ഓരോ വിശ്വാസിക്കും ബാധകമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വിതരണാർഥമുള്ള ഏകവചനം നിലനിർത്തുകയും നിർദേശം ഓരോ വിശ്വാസിക്കും വ്യക്തിപരമായി ബാധകമാണെന്ന് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: κλήσει
  choice: വിളിയിൽ
  rationale: സന്ദർഭത്തിൽ ജീവിതസാഹചര്യമോ സാമൂഹികനിലയോ സൂചിപ്പിക്കാമെങ്കിലും, ‘വിളി’ എന്നു നിലനിർത്തുന്നത് ἐκλήθη (‘വിളിക്കപ്പെട്ടു’) എന്നതുമായ പദബന്ധവും ദൈവവിളി–ജീവിതാവസ്ഥ എന്ന അർഥപിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- source_word: ᾗ ἐκλήθη
  choice: താൻ വിളിക്കപ്പെട്ട
  rationale: ബന്ധവാക്യത്തിന്റെ ഏകവചനഘടന സംരക്ഷിക്കുന്നു. കർത്താവിനെ നേരിട്ട് ചേർക്കാതെ കർമണിപ്രയോഗം നിലനിർത്തുന്നതിലൂടെ ഗ്രീക്കിലെ ദൈവിക കർമണിയുടെ സൂചന അതിരുകടന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐν ταύτῃ
  choice: വിളിയിൽത്തന്നെ
  rationale: ταύτῃ മുൻപറഞ്ഞ ‘വിളി’യിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. ‘-ത്തന്നെ’ ആ തിരിച്ചുപറച്ചിലും ഊന്നലും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μενέτω
  choice: തുടരട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചാഭാവം ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘താമസിക്കട്ടെ’ ഇവിടെ തെറ്റായ സ്ഥലാർഥം ഉണർത്താം.
theological_decisions:
- issue: സന്ദർഭത്തിലെ κλῆσις എന്ന പദത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘വിളി’ നിലനിർത്തി, ജീവിതാവസ്ഥ/സാഹചര്യം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: അവസ്ഥ; സാഹചര്യം; ജീവിതനില
  rationale: സമീപസന്ദർഭം പരിച്ഛേദന, അടിമത്തം തുടങ്ങിയ ജീവിതസാഹചര്യങ്ങളെക്കുറിച്ചാണെങ്കിലും κλήσει–ἐκλήθη എന്ന പദബന്ധം ദൈവവിളിയെയും വിളിക്കപ്പെട്ടപ്പോഴത്തെ അവസ്ഥയെയും ഒരുമിച്ച് കേൾപ്പിക്കുന്നു. അതിനാൽ ഒരു അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
- issue: വ്യാകരണലിംഗവും പ്രതിനിധാനപരമായ പ്രയോഗവും
  choice: ‘ഓരോരുത്തനും’ എന്ന ഏകവചനരൂപവും ‘താൻ’ എന്ന സ്വാഭാവിക പരാമർശവും ഉപയോഗിക്കുന്നു.
  alternative: എല്ലാവരും; ഓരോ വ്യക്തിയും
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം പ്രതിനിധാനപരമായി ഓരോ വിശ്വാസിയെയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ ‘ഓരോരുത്തനും’ ആ ഏകവചനവും വ്യാകരണലിംഗസൂചനയും നിലനിർത്തുമ്പോൾ, ‘താൻ’ അനാവശ്യമായ ആവർത്തനവും കൃത്രിമത്വവും ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിളിയിൽത്തന്നെ’ എന്ന രൂപം മൂലത്തിലെ ആവർത്തനവും ഊന്നലും സൂക്ഷിക്കുന്നു; ദൈവശാസ്ത്രപരവും സാമൂഹികവുമായ ഇരട്ടസൂചന അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
