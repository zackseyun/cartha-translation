id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവിൽ വിളിക്കപ്പെട്ട അടിമ കർത്താവിന്റെ സ്വതന്ത്രനാക്കപ്പെട്ടവനാണ്[a]; അതുപോലെ, സ്വതന്ത്രനായിരിക്കെ വിളിക്കപ്പെട്ടവൻ മശീഹയുടെ അടിമയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിന്റെ സ്വതന്ത്രൻ.’ ഗ്രീക്ക് പദം അടിമത്തത്തിൽനിന്ന് സ്വതന്ത്രനാക്കപ്പെട്ട ഒരാളെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: അടിമ
  rationale: പൗലൊസിന്റെ വിരോധാഭാസത്തിൽ അടിമത്തത്തിന്റെ ബന്ധിതപദവി നിർണായകമായതിനാൽ, മൃദുവായ ‘ദാസൻ’ എന്നതിനു പകരം ‘അടിമ’ ഉപയോഗിച്ചു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലൊസിന്റെ പ്രയോഗത്തിലുള്ള ബന്ധത്തിന്റെയോ ആത്മീയ മേഖലയുടെയോ സൂചന വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: κληθεὶς
  choice: വിളിക്കപ്പെട്ട
  rationale: ദൈവിക വിളിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἀπελεύθερος
  choice: സ്വതന്ത്രനാക്കപ്പെട്ടവൻ
  rationale: അടിമത്തത്തിൽനിന്ന് മോചിപ്പിക്കപ്പെട്ട വ്യക്തിയെയാണ് പദം പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്; സാധാരണയായി സ്വതന്ത്രനായ ഒരാൾ എന്നതിലധികമുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഉടമസ്ഥതയെയും ബന്ധത്തെയും സൂചിപ്പിക്കുന്ന ജനിറ്റീവ് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁμοίως
  choice: അതുപോലെ
  rationale: വാക്യത്തിന്റെ രണ്ടു ഭാഗങ്ങൾക്കിടയിലെ സമാന്തരതയും സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: ἐλεύθερος
  choice: സ്വതന്ത്രനായിരിക്കെ
  rationale: വിളിക്കപ്പെട്ട സമയത്തെ സാമൂഹികമായി സ്വതന്ത്രനായിരുന്ന നില വ്യക്തമാക്കുകയും ആദ്യപകുതിയോടുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: സാധാരണ യജമാനൻ എന്ന സാമൂഹിക അർഥത്തിലൊതുങ്ങാത്ത, ഉയർത്തപ്പെട്ട യേശുവിന്റെ ദൈവശാസ്ത്രപരമായ സ്ഥാനപ്പേര് നിലനിർത്തുന്നു.
theological_decisions:
- issue: സാമൂഹികപദവിയും മശീഹയോടുള്ള ബന്ധവും തമ്മിലുള്ള വിരോധാഭാസം
  choice: അടിമ കർത്താവിന്റെ സ്വതന്ത്രനാക്കപ്പെട്ടവനും സ്വതന്ത്രനായവൻ മശീഹയുടെ അടിമയുമാണെന്ന മൂർച്ചയുള്ള മറിച്ചിടൽ നിലനിർത്തി.
  alternative: ‘അടിമ’ എന്നത് ‘ദാസൻ’ എന്നു മൃദൂകരിക്കുകയോ ἀπελεύθερος എന്നത് വെറും ‘സ്വതന്ത്രൻ’ എന്നു പൊതുവാക്കുകയോ ചെയ്യുക.
  rationale: ഭൗമിക സാമൂഹികപദവിയെ കർത്താവിനോടുള്ള ബന്ധം ആപേക്ഷികമാക്കുന്നു എന്ന പൗലൊസിന്റെ ആശയത്തിന് ഈ കൃത്യമായ വൈരുധ്യം നിർണായകമാണ്.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹയുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമംപോലെ മാത്രമല്ല, അഭിഷിക്തനായ രാജാവിന്റെ സ്ഥാനപ്പേരായും സജീവമായി പ്രവർത്തിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അടിമ’ എന്ന പദം വാക്യത്തിലെ സാമൂഹിക-ദൈവശാസ്ത്രപരമായ വിരോധാഭാസം തുറന്നുവയ്ക്കുന്നു; ‘സ്വതന്ത്രനാക്കപ്പെട്ടവൻ’ നിയമ-സാമൂഹിക മോചനത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു.
