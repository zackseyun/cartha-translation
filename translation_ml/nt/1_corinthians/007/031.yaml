id: 1CO.7.31
reference: 1 Corinthians 7:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: ml
  text: ലോകത്തെ ഉപയോഗിക്കുന്നവർ അതിനെ പൂർണമായി ഉപയോഗിക്കാത്തവരെപ്പോലെ ആയിരിക്കണം[a]. എന്തെന്നാൽ, ഈ ലോകത്തിന്റെ ഇപ്പോഴത്തെ രൂപം[b] കടന്നുപോകുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അതിനെ മുഴുവനായി ഉപയോഗിക്കാത്തവരെപ്പോലെ’; ഈ ക്രിയയ്ക്ക് ‘അതിനെ ദുരുപയോഗം ചെയ്യാത്തവരെപ്പോലെ’ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ബാഹ്യരൂപം’ അല്ലെങ്കിൽ ‘രൂപഭാവം’.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: ഉപയോഗിക്കുന്നവർ
  rationale: χράομαι എന്ന ക്രിയയുടെ സാധാരണ അർഥമായ ‘ഉപയോഗിക്കുക’ നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: τὸν κόσμον
  choice: ലോകത്തെ
  rationale: ഇവിടെ κόσμος സൃഷ്ടപ്രപഞ്ചത്തെ അമൂർത്തമായി സൂചിപ്പിക്കുന്നതിലുപരി ഇപ്പോഴത്തെ സാമൂഹിക-ഭൗതിക ലോകക്രമത്തെ സൂചിപ്പിക്കുന്നു; ‘ലോകം’ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ὡς μὴ καταχρώμενοι
  choice: അതിനെ പൂർണമായി ഉപയോഗിക്കാത്തവരെപ്പോലെയും
  rationale: χρώμενοι / καταχρώμενοι എന്ന പദവിന്യാസം നിലനിർത്തിക്കൊണ്ട്, രണ്ടാം ക്രിയയിലെ തീവ്രത ‘പൂർണമായി’ എന്നു പ്രകടമാക്കുന്നു; ‘ദുരുപയോഗം’ എന്ന സദാചാരപരമായ അർഥത്തിലേക്ക് മാത്രം വാക്യത്തെ ചുരുക്കുന്നില്ല.
- source_word: παράγει
  choice: കടന്നുപോകുകയാണ്
  rationale: വർത്തമാനകാലം സൂചിപ്പിക്കുന്ന തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രക്രിയയും ലോകത്തിന്റെ ക്ഷണികതയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ σχῆμα τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിന്റെ ഇപ്പോഴത്തെ രൂപം
  rationale: σχῆμα എന്നത് നിലവിലെ രൂപവിന്യാസത്തെയോ ബാഹ്യരൂപത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ഇപ്പോഴത്തെ രൂപം’ അതിന്റെ താൽക്കാലിക സ്വഭാവം വ്യക്തമാക്കുകയും τούτου എന്ന നിർദേശകത്തിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: χρώμενοι എന്നതിനോടുള്ള ബന്ധത്തിൽ καταχρώμενοι എന്നതിന്റെ അർഥം
  choice: വിശ്വാസികൾ ലോകവുമായി ഇടപെടുമ്പോൾ അതിനെ പൂർണമായി ഉപയോഗിക്കുന്നവരെപ്പോലെ ആകരുത് എന്ന ആശയം
  alternative: ലോകത്തെ ദുരുപയോഗം ചെയ്യരുത് എന്ന മുന്നറിയിപ്പ്
  rationale: ഇരു പങ്കാളിക്രിയകളിലുമുള്ള പദവിന്യാസവും തീവ്രതയും ‘ഉപയോഗിക്കുക / പൂർണമായി ഉപയോഗിക്കുക’ എന്ന വിവർത്തനം സംരക്ഷിക്കുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്ത ഒരു സങ്കുചിത സദാചാരവായന ഒഴിവാക്കുന്നു.
- issue: σχῆμα എന്നതിന്റെ സൂചന
  choice: ലോകക്രമത്തിന്റെ ക്ഷണികമായ ഇപ്പോഴത്തെ രൂപവിന്യാസം
  alternative: ലോകത്തിന്റെ ബാഹ്യപ്രത്യക്ഷം മാത്രം, അല്ലെങ്കിൽ അതിന്റെ അടിസ്ഥാനസത്ത
  rationale: സന്ദർഭത്തിൽ σχῆμα ലോകത്തിന്റെ സത്തയേക്കാൾ അതിന്റെ നിലവിലെ ഘടനയെയും നിലയെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ സൃഷ്ടിയുടെ നന്മ നിഷേധിക്കാതെ അതിന്റെ ക്ഷണികത വ്യക്തമാകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഗ്രീക്കിലെ ‘ഉപയോഗിക്കുക / പൂർണമായി ഉപയോഗിക്കുക’ എന്ന പദവിന്യാസവും σχῆμα എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
