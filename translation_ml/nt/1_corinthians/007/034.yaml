id: 1CO.7.34
reference: 1 Corinthians 7:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: ml
  text: അവന്റെ ശ്രദ്ധ വിഭജിക്കപ്പെട്ടിരിക്കുന്നു. അവിവാഹിതയായ സ്ത്രീ, അതായത് കന്യക,[a] ശരീരത്തിലും ആത്മാവിലും വിശുദ്ധയായിരിക്കേണ്ടതിന് കർത്താവിന്റെ കാര്യങ്ങളിൽ ശ്രദ്ധ ചെലുത്തുന്നു. എന്നാൽ വിവാഹിതയായ സ്ത്രീ, തന്റെ ഭർത്താവിനെ എങ്ങനെ പ്രസാദിപ്പിക്കാമെന്ന് ചിന്തിച്ച്, ലോകത്തിന്റെ കാര്യങ്ങളിൽ ശ്രദ്ധ ചെലുത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവിവാഹിതയായ സ്ത്രീയും കന്യകയും കർത്താവിന്റെ കാര്യങ്ങളിൽ ശ്രദ്ധ ചെലുത്തുന്നു.” ഗ്രീക്ക് വാക്യം ‘അവിവാഹിതയായ സ്ത്രീ’യും ‘കന്യക’യും ഒരേ വിഭാഗത്തെ സൂചിപ്പിക്കുന്നതായോ രണ്ടു വിഭാഗങ്ങളെ പട്ടികപ്പെടുത്തുന്നതായോ വായിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: താത്പര്യങ്ങൾ വിഭജിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണി രൂപത്തിന്റെ ഫലാവസ്ഥയും വിഭജിക്കപ്പെട്ട ശ്രദ്ധ/താത്പര്യം എന്ന രൂപകവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. സ്ത്രീലിംഗ ഏകവചനമായി വായിക്കാവുന്ന ഗ്രീക്ക് രൂപത്തിന് അനുസരിച്ച് ‘അവളുടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: γυνὴ ἡ ἄγαμος
  choice: അവിവാഹിതയായ സ്ത്രീ
  rationale: വിവാഹിതയായ സ്ത്രീയോടുള്ള വ്യക്തമായ വൈരുധ്യം സൂക്ഷിക്കുന്ന ആധുനികവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: παρθένος
  choice: കന്യക
  rationale: ലൈംഗിക കന്യകാത്വം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ പ്രത്യേക അർഥം പൊതുവായ ‘യുവതി’ എന്നാക്കി ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος
  choice: അവിവാഹിതയായ സ്ത്രീ, അതായത് കന്യക
  rationale: ഏകവചന ക്രിയയോടു യോജിക്കുന്ന വിധത്തിൽ രണ്ടാമത്തെ പദത്തെ വിശദീകരണസമാനാധികരണമായി മുഖ്യവാചകത്തിൽ കൊടുക്കുന്നു; രണ്ട് വിഭാഗങ്ങളായി വായിക്കാവുന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: μεριμνᾷ
  choice: ശ്രദ്ധവെക്കുന്നു
  rationale: ഇവിടെ നിർബന്ധമായും പാപകരമായ ഉത്കണ്ഠയല്ല, ശ്രദ്ധയും പരിഗണനയും ആണെന്ന സാഹചര്യാർഥം നൽകുന്നു.
- source_word: τὰ τοῦ κυρίου
  choice: കർത്താവിന്റെ കാര്യങ്ങൾ
  rationale: കർത്താവുമായി ബന്ധപ്പെട്ട താത്പര്യങ്ങളെയും കാര്യങ്ങളെയും സൂചിപ്പിക്കുകയും ‘ലോകകാര്യങ്ങൾ’ എന്ന തുടർന്നുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα ᾖ ἁγία
  choice: വിശുദ്ധയായിരിക്കാനാണ്
  rationale: ἵναയുടെ ഉദ്ദേശ്യബോധവും ἁγίαയുടെ വ്യക്തമായ വിശുദ്ധി-ഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: ശരീരത്തിലും ആത്മാവിലും
  rationale: വിശുദ്ധി ബാധകമായ രണ്ട് മേഖലകളെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അതിലധികമായ മനുഷ്യഘടനാ സിദ്ധാന്തം ഇതിൽ കയറ്റുന്നില്ല.
- source_word: ἡ δὲ γαμήσασα
  choice: വിവാഹിതയായ സ്ത്രീ
  rationale: വിവാഹാവസ്ഥയിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളം; മുൻപത്തെ ‘അവിവാഹിതയായ സ്ത്രീ’യോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
- source_word: τὰ τοῦ κόσμου
  choice: ലോകകാര്യങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ ആവശ്യത്തിലധികം നിന്ദാത്മകമായ അർഥം ചേർക്കാതെ ലോകജീവിതവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: എങ്ങനെ തന്റെ ഭർത്താവിനെ പ്രസാദിപ്പിക്കാം
  rationale: വിവാഹസന്ദർഭത്തിൽ ἀνήρ എന്നത് ‘ഭർത്താവ്’ എന്നാണ്; പരിഗണനയുടെ ഉള്ളടക്കം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘അവിവാഹിതയായ സ്ത്രീയും കന്യകയും’ എന്നത് രണ്ട് വിഭാഗങ്ങളാണോ, വിശദീകരണസമാനാധികരണമാണോ
  choice: 'മുഖ്യവാചകത്തിൽ വിശദീകരണസമാനാധികരണം: ‘അവിവാഹിതയായ സ്ത്രീ, അതായത് കന്യക’'
  alternative: 'രണ്ട് ഏകോപിത വിഭാഗങ്ങൾ: ‘അവിവാഹിതയായ സ്ത്രീയും കന്യകയും’'
  rationale: ഗ്രീക്ക് വാക്യഘടന ചുരുക്കമുള്ളതാണെങ്കിലും ഏകവചനമായ μεριμνᾷ ഏകീകൃത കർത്താവിനെ അനുകൂലിക്കുന്നു. എന്നിരുന്നാലും ഏകോപിത വായന യഥാർഥ സാധ്യതയായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: μεμέρισται എന്നതിന്റെ കർത്താവും മുൻവാക്യത്തോടുള്ള ബന്ധവും
  choice: ‘അവളുടെ താത്പര്യങ്ങൾ വിഭജിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന സ്ത്രീലിംഗ വായന
  alternative: മുൻവാക്യത്തിന്റെ സമാപനമായി ‘അവന്റെ താത്പര്യങ്ങൾ വിഭജിക്കപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ പൊതുവായി ‘അവൻ വിഭജിക്കപ്പെട്ടിരിക്കുന്നു’
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ സ്ത്രീലിംഗ ഏകവചന രൂപം അടുത്തുള്ള സ്ത്രീയെ ചൂണ്ടുന്നു; എന്നാൽ വാക്യവിഭജനപരമായ പാഠചരിത്രസങ്കീർണ്ണത കാരണം ആശയം വ്യക്തമാക്കാൻ ‘താത്പര്യങ്ങൾ’ ചേർത്തെങ്കിലും രൂപകത്തിന്റെ വിഭജനബോധം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘കർത്താവ്’, ‘വിശുദ്ധ’, ‘ആത്മാവ്’ തുടങ്ങിയ സുപരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; എന്നാൽ അനാവശ്യമായ പുരാതനശൈലിയും സഭാവിഭാഗസവിശേഷ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
