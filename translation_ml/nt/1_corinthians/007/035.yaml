id: 1CO.7.35
reference: 1 Corinthians 7:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: ml
  text: നിങ്ങളുടെതന്നെ നന്മയ്ക്കുവേണ്ടിയാണ് ഞാൻ ഇതു പറയുന്നത്—നിങ്ങളുടെമേൽ ഒരു കഴുത്തുകുരുക്ക് ഇടാനല്ല, മറിച്ച് ഉചിതമായതിനും കർത്താവിനോടുള്ള ശ്രദ്ധചിതറാത്ത സമർപ്പണത്തിനും വേണ്ടിയാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: നന്മ
  rationale: സന്ദർഭത്തിൽ വ്യക്തിക്ക് പ്രയോജനകരമായതോ ഗുണകരമായതോ എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: βρόχον
  choice: കുരുക്ക്
  rationale: മൂലപദത്തിന്റെ അക്ഷരാർഥമായ കെണി/കഴുത്തുകുരുക്ക് എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട്, നിർബന്ധം ചുമത്തുക എന്ന രൂപകാലങ്കാരാർഥവും മലയാളത്തിൽ വഹിക്കുന്നു.
- source_word: εὔσχημον
  choice: ഉചിതമായത്
  rationale: മാന്യവും ക്രമോചിതവും യോജിച്ചതുമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ വിശാലത നിലനിർത്തുന്നു.
- source_word: εὐπάρεδρον
  choice: ചേർന്നുനിൽക്കാൻ
  rationale: കർത്താവിന്റെ അടുക്കൽ സ്ഥിരമായി സന്നിഹിതനായിരിക്കുക, അവിടത്തേക്കു സമർപ്പിതനായിരിക്കുക എന്നീ ആശയങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀπερισπάστως
  choice: ശ്രദ്ധ ചിതറാതെ
  rationale: വ്യതിചലനമോ മറ്റു കാര്യങ്ങളിലേക്കുള്ള വലിച്ചിഴയ്ക്കലോ കൂടാതെ എന്ന അർഥം വ്യക്തമായി പകർന്നുനൽകുന്നു.
theological_decisions:
- issue: കർത്താവിനോടുള്ള εὐπάρεδρον എന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: കർത്താവിനോടു ചേർന്നുനിൽക്കുക
  alternative: കർത്താവിനെ ഏകാഗ്രമായി സേവിക്കുക
  rationale: മൂലപാഠം സേവനം മാത്രം വ്യക്തമാക്കുന്നില്ല; സന്നിധിയിൽ സ്ഥിരമായി നിലകൊള്ളുന്നതും സമർപ്പിതനായിരിക്കുന്നതും ഉൾക്കൊള്ളുന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: പൗലോസിന്റെ ഉപദേശത്തിന്റെ നിർബന്ധസ്വഭാവം
  choice: നിങ്ങളുടെമേൽ ഒരു കുരുക്ക് ഇടാനല്ല
  alternative: നിങ്ങളെ നിയന്ത്രിക്കാനല്ല
  rationale: βρόχος എന്ന മൂലപദത്തിന്റെ ശക്തമായ രൂപകം നിലനിർത്തുകയും, ഉപദേശം നിയമപരമായ നിർബന്ധമായി അടിച്ചേൽപ്പിക്കുന്നില്ലെന്ന പാഠത്തിലെ സംഘർഷം സ്വയം വ്യാഖ്യാനിച്ച് ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്കു വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ ‘അല്ല—മറിച്ച്’ വിരോധഘടനയും രൂപകാലങ്കാരവും നിലനിർത്തി; അനാവശ്യമായ ആരംഭവാക്യസൂചകം ചേർത്തിട്ടില്ല.
