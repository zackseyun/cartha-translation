- from: നിങ്ങളുടെതന്നെ നന്മയ്ക്കുവേണ്ടിയാണ് ഞാൻ ഇതു പറയുന്നത്—നിങ്ങളുടെമേൽ ഒരു കുരുക്ക് ഇടാനല്ല, മറിച്ച് ഉചിതമായത് ചെയ്യാനും ശ്രദ്ധ ചിതറാതെ കർത്താവിനോടു ചേർന്നുനിൽക്കാനും വേണ്ടിയാണ്.
  to: നിങ്ങളുടെതന്നെ നന്മയ്ക്കുവേണ്ടിയാണ് ഞാൻ ഇതു പറയുന്നത്—നിങ്ങളുടെമേൽ ഒരു കഴുത്തുകുരുക്ക് ഇടാനല്ല, മറിച്ച് ഉചിതമായതിനും കർത്താവിനോടുള്ള ശ്രദ്ധചിതറാത്ത സമർപ്പണത്തിനും വേണ്ടിയാണ്.
