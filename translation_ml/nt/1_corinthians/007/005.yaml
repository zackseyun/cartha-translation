id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: ml
  text: പരസ്പരം ദാമ്പത്യസഹവാസം നിഷേധിക്കരുത്. എന്നാൽ, പ്രാർഥനയ്ക്കായി നിങ്ങളെത്തന്നെ സമർപ്പിക്കുന്നതിനുവേണ്ടി, പരസ്പരസമ്മതത്തോടെ കുറച്ചുകാലത്തേക്കു മാത്രം ഒരുപക്ഷേ അങ്ങനെ ചെയ്യാം. അതിനുശേഷം വീണ്ടും ഒന്നിച്ചുചേരുക; നിങ്ങളുടെ ആത്മനിയന്ത്രണക്കുറവ് നിമിത്തം സാത്താൻ നിങ്ങളെ പ്രലോഭിപ്പിക്കാതിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: ദാമ്പത്യബന്ധം നിഷേധിക്കരുത്
  rationale: ഈ ദാമ്പത്യസന്ദർഭത്തിൽ ജീവിതപങ്കാളിക്ക് അർഹമായ ശാരീരിക അടുപ്പം തടഞ്ഞുവെക്കുന്നതാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. വാണിജ്യപരമായ ‘വഞ്ചിക്കുക’ എന്ന ധ്വനി ഒഴിവാക്കി, അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: ഭാര്യയ്ക്കും ഭർത്താവിനും ഒരുപോലെ ബാധകമായ പരസ്പരത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰ μήτι ἂν
  choice: എന്നാൽ ... മാത്രം അങ്ങനെ ചെയ്യാം
  rationale: സമ്പൂർണ വിലക്കിനുള്ള പരിമിതവും സൂക്ഷ്മമായി പ്രസ്താവിച്ചിട്ടുള്ളതുമായ ഒഴിവ് മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐκ συμφώνου
  choice: പരസ്പരസമ്മതത്തോടെ
  rationale: തീരുമാനം ഇരുവരുടെയും പങ്കിട്ട സമ്മതത്തോടെയായിരിക്കണം എന്ന ആശയം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: πρὸς καιρόν
  choice: കുറച്ചുകാലത്തേക്ക്
  rationale: കാലപരിധിയുള്ള താൽക്കാലിക ഇടവേളയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: σχολάσητε
  choice: നിങ്ങളെത്തന്നെ സമർപ്പിക്കേണ്ടതിന്
  rationale: പ്രാർഥനയ്ക്കായി സ്വയം ഒഴിവാക്കി മനഃപൂർവം അതിൽ വ്യാപൃതരാകുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: τῇ προσευχῇ
  choice: പ്രാർഥനയ്ക്കായി
  rationale: ഏകവചനത്തിലുള്ള ഗ്രീക്ക് പദം പൊതുവായ പ്രാർഥനാചരണത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: വീണ്ടും ഒന്നിച്ചുചേരുക
  rationale: ദാമ്പത്യജീവിതവും ശാരീരികബന്ധവും പുനരാരംഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന വിനീതമായ പരോക്ഷപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: πειράζῃ
  choice: പ്രലോഭിപ്പിക്കുക
  rationale: സാത്താനും ആത്മനിയന്ത്രണക്കുറവും ഉൾപ്പെടുന്ന സന്ദർഭത്തിൽ പാപത്തിലേക്ക് വശീകരിക്കുക എന്ന അർഥമാണ് യോജിച്ചത്.
- source_word: Σατανᾶς
  choice: സാത്താൻ
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: ἀκρασίαν
  choice: ആത്മനിയന്ത്രണക്കുറവ്
  rationale: സ്വയം നിയന്ത്രിക്കാനുള്ള കഴിവിന്റെ അഭാവം ആധുനികവും വ്യക്തവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτε എന്നത് ലൈംഗികബന്ധം പുനരാരംഭിക്കുക എന്ന് തുറന്നുപറയണമോ, പൊതുവായി വീണ്ടും ഒന്നിച്ചുചേരുക എന്ന് പറയണമോ
  choice: വീണ്ടും ഒന്നിച്ചുചേരുക
  alternative: വീണ്ടും ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുക
  rationale: സന്ദർഭത്തിൽ ദാമ്പത്യശാരീരികബന്ധം ഉൾപ്പെടുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് അതു വിനീതമായി പരോക്ഷമായാണ് പറയുന്നത്. ആ സൂചനയും മിതത്വവും പരിഭാഷ നിലനിർത്തുന്നു.
- issue: ὁ Σατανᾶς എന്നത് വ്യക്തിനാമമായാണോ പൊതുവായ ‘എതിരാളി’ എന്നാണോ നൽകേണ്ടത്
  choice: സാത്താൻ
  alternative: എതിരാളി
  rationale: ഇവിടെ പൗലോസ് ഒരു വ്യക്തിയായ സാത്താനെയാണ് പരാമർശിക്കുന്നത്; പൊതുവായ എതിരാളിയെയോ അമൂർത്തമായ ദുഷ്ടശക്തിയെയോ അല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ദാമ്പത്യശാരീരികബന്ധത്തെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ വിനീതമായ പരോക്ഷത നിലനിർത്തിക്കൊണ്ട്, ἀποστερεῖτε എന്നതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കാൻ ‘ദാമ്പത്യബന്ധം’ ചേർത്തിരിക്കുന്നു.
