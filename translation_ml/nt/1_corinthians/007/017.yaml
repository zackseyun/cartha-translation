- from: എന്നാൽ, കർത്താവ് ഓരോരുത്തനും പങ്കിട്ടുനൽകിയതനുസരിച്ചും[a] ദൈവം ഓരോരുത്തനെയും വിളിച്ചതനുസരിച്ചും ഓരോരുത്തരും അങ്ങനെ നടക്കട്ടെ[b]. എല്ലാ സഭകളിലും ഞാൻ ഇപ്രകാരം നിർദേശിക്കുന്നു.
  to: എന്നാൽ, കർത്താവ് ഓരോരുത്തന് വിഹിതമാക്കിയതനുസരിച്ചും ദൈവം ഓരോരുത്തനെ വിളിച്ചതനുസരിച്ചും, ഓരോരുത്തൻ അങ്ങനെ നടക്കട്ടെ[b]. ഇപ്രകാരം ഞാൻ എല്ലാ സഭകളിലും നിർദേശിക്കുന്നു.
  rationale: ἐμέρισεν എന്ന ക്രിയയ്ക്കായി «വിഹിതമാക്കിയ» ഉപയോഗിച്ച്, കർത്താവ് എന്താണ് ഓരോരുത്തനും വിഹിതമാക്കിയതെന്ന് പാഠം വ്യക്തമാക്കാത്ത അവസ്ഥ സംരക്ഷിച്ചു. വാക്യത്തിന്റെ വിതരണം സൂചിപ്പിക്കുന്ന ആവർത്തനവും περιπατείτωയുടെ ഏകവചന ആജ്ഞാരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്താൻ «ഓരോരുത്തൻ» ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് a നീക്കി, കാരണം പരിഷ്കരിച്ച മുഖ്യപാഠത്തിൽ അതിന്റെ ആങ്കർ ഇല്ല; നിലവിലുള്ള b ആങ്കർ നിലനിർത്തിയിരിക്കുന്നു.
