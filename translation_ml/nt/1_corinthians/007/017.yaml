source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: ml
  text: എന്നാൽ, കർത്താവ് ഓരോരുത്തന് വിഹിതമാക്കിയതനുസരിച്ചും ദൈവം ഓരോരുത്തനെ വിളിച്ചതനുസരിച്ചും, ഓരോരുത്തൻ അങ്ങനെ നടക്കട്ടെ[b]. ഇപ്രകാരം ഞാൻ എല്ലാ സഭകളിലും നിർദേശിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘നടക്കുക’ ഇവിടെ ഒരാളുടെ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന ബൈബിൾ രൂപകമാണ്; ‘ജീവിക്കട്ടെ’ അല്ലെങ്കിൽ ‘ജീവിതം നയിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: എന്നാൽ
  rationale: ഇവിടെ ഈ പ്രയോഗം കർശനമായ ഒരു വ്യവസ്ഥയല്ല; മുൻചർച്ചയ്ക്കുശേഷം പൊതുവായ മാർഗനിർദേശം അവതരിപ്പിക്കുന്ന വിരുദ്ധതാസൂചകമായ സംക്രമണമാണ്.
- source_word: ἑκάστῳ / ἕκαστον
  choice: ഓരോരുത്തനും / ഓരോരുത്തനെയും / ഓരോരുത്തരും
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ἕκαστος-ന്റെ വ്യക്തിവിതരണ ഊന്നൽ മലയാളത്തിലും നിലനിർത്തുന്നു; വാക്യാവസാനത്തെ ‘ഓരോരുത്തരും’ സ്വാഭാവികമായ പൊതുപ്രയോഗമാണ്.
- source_word: ἐμέρισεν
  choice: പങ്കിട്ടുനൽകിയതനുസരിച്ച്
  rationale: കർത്താവ് ഓരോ വ്യക്തിക്കും ഓഹരിയായി നൽകിയതോ നിശ്ചയിച്ചതോ എന്ന അർഥം സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർമത്തെ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ κύριος എന്ന ദൈവിക പദവിയുടെ സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: κέκληκεν
  choice: വിളിച്ചതനുസരിച്ച്
  rationale: ദൈവിക വിളി എന്ന ആശയം നിലനിർത്തുന്നു; സന്ദർഭം മാത്രം കണക്കാക്കി അതിനെ ‘ഒരു നിലയിൽ ആക്കി’ എന്നു വ്യാഖ്യാനിച്ചിട്ടില്ല.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ സാധാരണ മലയാള പരിഭാഷ.
- source_word: οὕτως
  choice: അങ്ങനെ / ഇപ്രകാരം
  rationale: ആദ്യത്തേത് വ്യക്തിയുടെ ജീവിതരീതിയെയും രണ്ടാമത്തേത് സഭകളിലെ പൗലോസിന്റെ നിർദേശത്തെയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനം ആശയപരമായി നിലനിർത്തുന്നു.
- source_word: περιπατείτω
  choice: നടക്കട്ടെ
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം അതേപടി നിലനിർത്തുന്നു; അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διατάσσομαι
  choice: ഞാൻ നിർദേശിക്കുന്നു
  rationale: സഭകളിലെ ആചാരത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ അധികാരപൂർവമായ ക്രമനിർദേശം പ്രകടമാക്കുന്നു; ‘കല്പിക്കുന്നു’ എന്നതിനെക്കാൾ സ്വാഭാവികമായും അതിരുകടക്കാതെയും അധികാരഭാവം നൽകുന്നു.
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: എല്ലാ സഭകളിലും
  rationale: പ്രാദേശിക ക്രൈസ്തവസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നും ‘ദൈവം’ എന്നും ഉള്ള പദവികളുടെ ബന്ധം
  choice: രണ്ട് പദവികളും വേർതിരിച്ചുതന്നെ നിലനിർത്തി
  alternative: രണ്ടും ഒരേ ദൈവിക കർത്താവിനെ സൂചിപ്പിക്കുന്ന ശൈലിവ്യത്യാസമായി ലയിപ്പിക്കുക
  rationale: സമാന്തര ഘടനകളിൽ ഗ്രീക്ക് മൂലപാഠം രണ്ട് വ്യത്യസ്ത ദൈവിക പദവികൾ ഉപയോഗിക്കുന്നു; അവയുടെ കൃത്യമായ ബന്ധം വിവർത്തനം സ്വയം തീർപ്പാക്കുന്നില്ല.
- issue: περιπατείτω എന്ന ജീവിതരൂപകം
  choice: ‘നടക്കട്ടെ’ എന്ന രൂപകം നിലനിർത്തി
  alternative: ‘ജീവിക്കട്ടെ’ എന്ന് ആശയപരമായി പരിഭാഷപ്പെടുത്തുക
  rationale: പൗലോസിന്റെ നൈതിക-ജീവിതരീതി സൂചിപ്പിക്കുന്ന രൂപകവും അതിലെ വിശാലതയും സംരക്ഷിക്കുന്നു; സാധാരണ വായനക്കാർക്കായി അടിക്കുറിപ്പ് അർഥം വിശദീകരിക്കുന്നു.
- issue: ദൈവിക പങ്കുവെപ്പിന്റെയും വിളിയുടെയും കൃത്യമായ ഉള്ളടക്കം
  choice: മൂലപാഠത്തിലെ അവ്യക്തത നിലനിർത്തി
  alternative: ‘ജീവിതസാഹചര്യം’ അല്ലെങ്കിൽ ‘സാമൂഹികനില’ എന്ന് വ്യക്തമായി ചേർക്കുക
  rationale: സന്ദർഭം അത്തരം ആശയങ്ങളെ സൂചിപ്പിക്കാമെങ്കിലും ഈ വാക്യത്തിൽ കർമം തുറന്നുപറയുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക വ്യാഖ്യാനം പാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നടക്കട്ടെ’ എന്ന ബൈബിൾ രൂപകം നിലനിർത്തിയെങ്കിലും അതിന്റെ ആശയം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ വ്യക്തിവിതരണ ഊന്നൽ സംരക്ഷിക്കാൻ ‘ഓരോരുത്തൻ’ എന്ന ആശയം ആവർത്തിച്ചു.
