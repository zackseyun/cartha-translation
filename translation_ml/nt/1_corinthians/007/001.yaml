id: 1CO.7.1
reference: 1 Corinthians 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ δὲ ὧν ⸀ἐγράψατε, καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/001.yaml
  text: 'Concerning the matters you wrote about: it is good for a man not to touch a woman.[a]'
translation:
  language: ml
  text: 'നിങ്ങൾ എഴുതിയ കാര്യങ്ങളെക്കുറിച്ചാകട്ടെ: ഒരു പുരുഷൻ സ്ത്രീയെ തൊടാതിരിക്കുന്നത് നല്ലതാണ്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “ഒരു പുരുഷൻ ഒരു സ്ത്രീയെ തൊടാതിരിക്കുന്നത്.” ഇവിടെ “തൊടുക” എന്നത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന ശിഷ്ടോക്തിയായിരിക്കാം.'
    reason: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ പൂർണമായ അക്ഷരാർഥവും സന്ദർഭത്തിൽ സാധ്യതയുള്ള പരോക്ഷാർഥവും വായനക്കാരന് വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: Περὶ δὲ ὧν ἐγράψατε
  choice: നിങ്ങൾ എഴുതിയ കാര്യങ്ങളെക്കുറിച്ചാകട്ടെ
  rationale: περὶ ὧν എന്നത് ‘നിങ്ങൾ എഴുതിയ കാര്യങ്ങളെക്കുറിച്ച്’ എന്നും δέ വിഷയം മാറുന്നതിനെ മലയാളത്തിലെ ‘-ആകട്ടെ’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: καλὸν
  choice: നല്ലതാണ്
  rationale: ധാർമ്മികമോ പ്രായോഗികമോ ആയ നന്മയെ സൂചിപ്പിക്കാവുന്ന പൊതുവായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἀνθρώπῳ
  choice: ഒരു പുരുഷൻ
  rationale: γυναικός എന്ന സ്ത്രീലിംഗ പദത്തോടുള്ള വ്യത്യാസവും സന്ദർഭത്തിലെ ലൈംഗിക അർഥസാധ്യതയും കണക്കിലെടുത്ത് ഇവിടെ ‘പുരുഷൻ’ യോജിക്കുന്നു.
- source_word: γυναικὸς μὴ ἅπτεσθαι
  choice: സ്ത്രീയെ തൊടാതിരിക്കുന്നത്
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ സാധ്യതയുള്ള ലൈംഗിക ശിഷ്ടോക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘ഒരു പുരുഷൻ സ്ത്രീയെ തൊടാതിരിക്കുന്നത് നല്ലതാണ്’ എന്ന വാക്കുകൾ പൗലോസിന്റെ പ്രസ്താവനയാണോ കൊരിന്ത്യർ എഴുതിയ വാദത്തിന്റെ ഉദ്ധരണിയാണോ
  choice: മുഖ്യപാഠത്തിൽ ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ചേർക്കാതെ അവ്യക്തത നിലനിർത്തി
  alternative: ഇത് കൊരിന്ത്യരുടെ മുദ്രാവാക്യമെന്നപോലെ ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ നൽകുക
  rationale: ഗ്രീക്ക് കൈയെഴുത്തുപാരമ്പര്യത്തിൽ ആധുനിക ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ല; വാക്യം ആരുടേതാണെന്ന് വ്യാകരണം മാത്രം നിർണയിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
- issue: ‘തൊടുക’ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: അക്ഷരാർഥം മുഖ്യപാഠത്തിലും സാധ്യതയുള്ള ലൈംഗിക ശിഷ്ടോക്തി അടിക്കുറിപ്പിലും നൽകി
  alternative: മുഖ്യപാഠത്തിൽ നേരിട്ട് ‘ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടാതിരിക്കുക’ എന്നു നൽകുക
  rationale: ἅπτεσθαι എന്ന പദത്തിന്റെ രൂപകം സന്ദർഭത്തിൽ ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കാമെങ്കിലും, മൂലത്തിന്റെ ഭാഷാരൂപവും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘-ആകട്ടെ’ വിഷയം മാറുന്ന δέ-യുടെ പ്രവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു. വാക്യത്തിന്റെ ചുരുക്കവും തത്വചിന്താപരമായ അവ്യക്തതയും നിലനിർത്തിയിരിക്കുന്നു.
