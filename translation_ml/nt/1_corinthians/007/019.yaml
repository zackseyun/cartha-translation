  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: ml
  text: പരിച്ഛേദന ഒന്നുമല്ല[a]; പരിച്ഛേദനമില്ലായ്മയും ഒന്നുമല്ല; എന്നാൽ ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കലാണ് പ്രധാനം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “പ്രാധാന്യമില്ല”; “ഒന്നുമല്ല” എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും ഇത് ബാധകം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: പരിച്ഛേദനം
  rationale: പൗലോസ് ഉടമ്പടി-അടയാളമായ നിലയെക്കുറിച്ച് പറയുന്നതിനാൽ, പ്രവൃത്തിയെ മാത്രം മുൻനിർത്താതെ നാമരൂപം നിലനിർത്തുന്നു.
- source_word: οὐδέν ἐστιν
  choice: ഒന്നുമല്ല
  rationale: ആവർത്തിക്കുന്ന ഗ്രീക്ക് ഘടനയും അതിന്റെ മൂർച്ചയുള്ള മൂല്യനിർണയവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; പ്രസക്തിയിൽ ‘പ്രാധാന്യമില്ല’ എന്ന അർഥവും സാധ്യമാണ്.
- source_word: ἀκροβυστία
  choice: പരിച്ഛേദനമില്ലായ്മ
  rationale: ‘പരിച്ഛേദനം’ എന്നതിനോടുള്ള നേരിട്ടുള്ള വിരുദ്ധപദമായി ഉപയോഗിച്ച് വാക്യത്തിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുന്നു.
- source_word: ἀλλά
  choice: എന്നാൽ … പ്രധാനം
  rationale: ബാഹ്യ നിലകളെ ദൈവകല്പനകളുടെ പാലനത്തോടു ശക്തമായി വിരുദ്ധമാക്കുന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τήρησις
  choice: പാലിക്കുന്നത്
  rationale: ‘കല്പനകൾ’ എന്ന കർമത്തോടൊപ്പം സ്വാഭാവികമായി ചേരുകയും അനുസരണയോടെ കാത്തുസൂക്ഷിക്കൽ/ആചരിക്കൽ എന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐντολῶν θεοῦ
  choice: ദൈവത്തിന്റെ കല്പനകൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ജനിറ്റീവ് ബന്ധവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനത്തിന്റെയും പരിച്ഛേദനമില്ലായ്മയുടെയും പൗലോസിന്റെ വിലയിരുത്തൽ
  choice: ഇരുവിധ ബാഹ്യ ഉടമ്പടി-നിലകളും ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുന്നതുമായി താരതമ്യപ്പെടുത്തുമ്പോൾ ഒന്നുമല്ലെന്ന് വാക്യം പറയുന്നു.
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും പരിച്ഛേദനത്തിന് യാതൊരു ധാർമിക പ്രസക്തിയുമില്ലെന്ന് വാക്യം പ്രഖ്യാപിക്കുന്നു.
  rationale: ഗ്രീക്ക് പാഠം ഇരുവരെയും ‘ഒന്നുമല്ല’ എന്നു പറഞ്ഞശേഷം കല്പനകളുടെ പാലനത്തെ വിരുദ്ധമായി മുന്നോട്ടുവയ്ക്കുന്നു. അതിനപ്പുറമുള്ള സമഗ്ര ദൈവശാസ്ത്ര നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനവും വിരുദ്ധഘടനയും നിലനിർത്തിയിരിക്കുമ്പോൾ, അവസാനത്തിലെ അപൂർണ്ണ നാമവാക്യം സ്വാഭാവിക മലയാളത്തിനായി ‘പ്രധാനം’ എന്നു പൂർത്തിയാക്കി.
