id: 1CO.7.9
reference: 1 Corinthians 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ οὐκ ἐγκρατεύονται, γαμησάτωσαν, κρεῖττον γάρ ἐστιν ⸀γαμῆσαι ἢ πυροῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/009.yaml
  text: But if they do not have self-control[a], let them marry; for it is better to marry than to burn.
translation:
  language: ml
  text: എന്നാൽ അവർ ആത്മസംയമനം പാലിക്കുന്നില്ലെങ്കിൽ, അവർ വിവാഹം കഴിക്കട്ടെ; എരിയുന്നതിനെക്കാൾ[a] വിവാഹം കഴിക്കുന്നതാണ് നല്ലത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാമത്താൽ എരിയുന്നതിനെക്കാൾ.” ഗ്രീക്ക് പ്രയോഗം ‘എരിയുക’ എന്നു മാത്രം സൂചിപ്പിക്കുന്നു; എന്നാൽ ഈ സന്ദർഭത്തിൽ അത് മിക്കവാറും ലൈംഗികാഭിലാഷത്താൽ എരിയുന്നതിനെ ഉദ്ദേശിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκρατεύονται
  choice: ആത്മസംയമനം പാലിക്കുന്നു
  rationale: ലൈംഗികതയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ സ്വയം നിയന്ത്രിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. നിഷേധരൂപത്തിൽ ‘ആത്മസംയമനം പാലിക്കുന്നില്ലെങ്കിൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് കഴിവില്ലായ്മ എന്ന ആശയം മൂലപാഠത്തിൽ ഇല്ലാത്തവിധം ശക്തമാക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: γαμησάτωσαν
  choice: അവർ വിവാഹം കഴിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നിർദേശാത്മക ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κρεῖττον
  choice: നല്ലത്
  rationale: താരതമ്യാർഥം മലയാളത്തിലെ ‘-നെക്കാൾ ... നല്ലത്’ എന്ന സ്വാഭാവിക ഘടനയിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: γαμῆσαι
  choice: വിവാഹം കഴിക്കുന്നത്
  rationale: ഗ്രീക്കിലെ ക്രിയാനാമരൂപത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാള തുല്യരൂപം.
- source_word: πυροῦσθαι
  choice: എരിയുന്നത്
  rationale: മൂലത്തിലെ രൂപകം അതേപടി നിലനിർത്തുന്നു. സന്ദർഭം ലൈംഗികാഭിലാഷത്താൽ എരിയുന്നതിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ആ വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: πυροῦσθαι എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘എരിയുന്നത്’ എന്ന രൂപകവും അവ്യക്തതയും നിലനിർത്തുക
  alternative: ‘കാമത്താൽ എരിയുന്നത്’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക
  rationale: വിവാഹം, അവിവാഹിതാവസ്ഥ, ആത്മസംയമനം എന്നിവയാണ് സമീപസന്ദർഭം; അതിനാൽ ലൈംഗികാഭിലാഷമാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം. എന്നിരുന്നാലും γ്രീക്ക് പദം ആ അഭിലാഷത്തെ നേരിട്ട് പേരെടുത്തുപറയാത്തതിനാൽ മുഖ്യപാഠം അതിനെ നിശ്ശബ്ദമായി നിർണയിക്കുന്നില്ല; സന്ദർഭസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആത്മസംയമനം’, ‘വിവാഹം കഴിക്കട്ടെ’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘എരിയുക’ എന്ന മൂലരൂപകം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിരിക്കുന്നു.
