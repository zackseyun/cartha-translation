id: 1CO.7.37
reference: 1 Corinthians 7:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: ml
  text: എന്നാൽ, സ്വന്തം ഹൃദയത്തിൽ ദൃഢനായി നിൽക്കുകയും യാതൊരു നിർബന്ധവും ഇല്ലാതിരിക്കുകയും[a] സ്വന്തം ഇച്ഛയുടെ കാര്യത്തിൽ അധികാരമുള്ളവനായിരിക്കുകയും, തന്റെ കന്യകയെ[b] സൂക്ഷിക്കണമെന്ന് സ്വന്തം ഹൃദയത്തിൽ തീരുമാനിച്ചിട്ടുണ്ടാകുകയും ചെയ്യുന്നവൻ നന്നായി ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യാതൊരു ആവശ്യകതയും ഇല്ലാതെ.’
    reason: ἀνάγκη എന്ന പദത്തിന് ‘നിർബന്ധം,’ ‘ആവശ്യകത,’ അല്ലെങ്കിൽ ‘സമ്മർദം’ എന്നിങ്ങനെ അർഥമാകാം.
  - marker: b
    text: ‘തന്റെ കന്യക’ എന്നത് അയാളുടെ കന്യകയായ മകളെയോ അയാൾ വിവാഹം നിശ്ചയിച്ച കന്യകയെയോ സൂചിപ്പിക്കാം; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം വിവാദമാണ്.
    reason: τὴν ἑαυτοῦ παρθένον എന്ന പ്രയോഗത്തിന്റെ പരാമർശവിഷയം മൂലത്തിൽ അവ്യക്തമാണ്; പ്രധാന വ്യാഖ്യാനസാധ്യതകൾ മാത്രം രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: ഉറച്ചുനിൽക്കുന്നവൻ
  rationale: പൂർണകാല ക്രിയയും ἑδραῖος എന്ന വിശേഷണവും ചേർന്ന് സ്ഥിരപ്പെട്ട, ദൃഢമായ നിലപാടിനെ സൂചിപ്പിക്കുന്നു. ‘ഉറച്ചുനിൽക്കുന്നവൻ’ ഈ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: സ്വന്തം ഹൃദയത്തിൽ
  rationale: καρδία ഇവിടെ തീരുമാനത്തിന്റെയും മനസ്സുറപ്പിന്റെയും ആന്തരിക കേന്ദ്രത്തെ സൂചിപ്പിക്കുന്നു. മൂലത്തിലെ ദൃശ്യബിംബവും ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: μὴ ἔχων ἀνάγκην
  choice: യാതൊരു നിർബന്ധവും ഇല്ലാതെ
  rationale: ἀνάγκη ആവശ്യകത, സമ്മർദം, നിർബന്ധം എന്നിവ സൂചിപ്പിക്കാം. സന്ദർഭത്തിൽ സ്വതന്ത്രമായ തീരുമാനത്തോടുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ ‘നിർബന്ധം’ സ്വാഭാവികമാണ്; ‘ആവശ്യകത’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: സ്വന്തം ഇച്ഛയുടെമേൽ അധികാരമുള്ളവനായി
  rationale: ἐξουσία എന്നതിലെ അധികാരം/അവകാശം എന്ന ആശയവും θέλημα എന്നതിലെ ഇച്ഛ/ഉദ്ദേശ്യം എന്ന ആശയവും നിലനിർത്തുന്നു; വാചകത്തെ ലൈംഗികമായി അമിതമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: κέκρικεν
  choice: തീരുമാനിച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: പൂർണകാലരൂപം ഇതിനകം എടുത്ത് ഉറപ്പിച്ച തീരുമാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ രൂപം ആ നിലനിൽക്കുന്ന ഫലത്തെ പ്രകടമാക്കുന്നു.
- source_word: τηρεῖν
  choice: അതേ നിലയിൽ സൂക്ഷിക്കാൻ
  rationale: τηρέω എന്നതിന്റെ ‘സൂക്ഷിക്കുക/നിലനിർത്തുക’ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു. സന്ദർഭത്തിൽ കന്യകയുടെ നിലവിലുള്ള അവസ്ഥ തുടരുന്നതാണ് ഉദ്ദേശ്യമെന്നു വ്യക്തമാക്കുമ്പോഴും ‘വിവാഹം കഴിപ്പിക്കാതിരിക്കുക’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മക പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: τὴν ἑαυτοῦ παρθένον
  choice: തന്റെ കന്യകയെ
  rationale: παρθένος എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ ‘കന്യക’ നിലനിർത്തുന്നു. അത് മകളെയോ വിവാഹനിശ്ചയം കഴിഞ്ഞ കന്യകയെയോ സൂചിപ്പിക്കുന്നുവെന്ന തർക്കം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: καλῶς ποιήσει
  choice: അവൻ ചെയ്യുന്നത് നല്ലതാണ്
  rationale: പ്രവൃത്തി ഉചിതവും പ്രശംസനീയവുമാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: τὴν ἑαυτοῦ παρθένον (‘തന്റെ കന്യക’) ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാചകത്തിൽ ‘തന്റെ കന്യക’ എന്ന താരതമ്യേന അക്ഷരാർഥവും അവ്യക്തത നിലനിർത്തുന്നതുമായ പ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘തന്റെ കന്യകയായ മകൾ’ അല്ലെങ്കിൽ ‘താൻ വിവാഹം നിശ്ചയിച്ച കന്യക’
  rationale: ഗ്രീക്ക് പ്രയോഗം ഒരു പിതാവിന്റെ/രക്ഷാകർത്താവിന്റെ കന്യകയായ മകളെയാണോ, വിവാഹനിശ്ചയം കഴിഞ്ഞ പുരുഷന്റെ വധുവിനെയാണോ സൂചിപ്പിക്കുന്നത് എന്നത് വിവാദമാണ്. മൂലവാക്യം തന്നെ ഈ ചോദ്യം വ്യക്തമായി തീർപ്പാക്കാത്തതിനാൽ പരിഭാഷയും അത് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ബൈബിൾ ശൈലി. ‘ഹൃദയത്തിൽ’ എന്ന മൂലഭാഷാ ദൃശ്യബിംബവും വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തി. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ യുക്തിബന്ധം മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ പുനഃക്രമീകരിച്ചെങ്കിലും വ്യാഖ്യാനവിവാദം തീർപ്പാക്കിയിട്ടില്ല.
