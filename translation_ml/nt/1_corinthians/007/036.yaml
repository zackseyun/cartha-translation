id: 1CO.7.36
reference: 1 Corinthians 7:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: ml
  text: എന്നാൽ, ആരെങ്കിലും തന്റെ കന്യകയോട്[a] അനുചിതമായി പെരുമാറുന്നു എന്നു കരുതുന്നുവെങ്കിൽ—അവൾ യൗവനം പിന്നിട്ടവളും അങ്ങനെ സംഭവിക്കേണ്ടതുമാണെങ്കിൽ—അവൻ ആഗ്രഹിക്കുന്നതു ചെയ്യട്ടെ; അവൻ പാപം ചെയ്യുന്നില്ല. അവർ വിവാഹം കഴിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തന്റെ പ്രതിശ്രുതവധുവിനോട്’ അഥവാ ‘വിവാഹനിശ്ചയം കഴിഞ്ഞ കന്യകയോട്’; പരമ്പരാഗതമായി, ‘കന്യകയായ തന്റെ മകളോട്’ എന്നും മനസ്സിലാക്കിയിട്ടുണ്ട്. ഗ്രീക്ക് പ്രയോഗം അവ്യക്തമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: അനുചിതമായി പെരുമാറുന്നു
  rationale: മര്യാദയ്ക്കോ ഉചിതമായ പെരുമാറ്റത്തിനോ നിരക്കാത്ത വിധത്തിൽ പ്രവർത്തിക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ലൈംഗിക അശ്ലീലത എന്ന അതിരുകടന്ന അർഥം ചുമത്തുന്നില്ല.
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: തന്റെ കന്യകയോട്
  rationale: παρθένος എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘കന്യക’ നിലനിർത്തുകയും αὐτοῦ സൂചിപ്പിക്കുന്ന ബന്ധം മുഖ്യവാചകത്തിൽ നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു. പ്രതിശ്രുതവധു/വിവാഹനിശ്ചയം കഴിഞ്ഞ കന്യക, അല്ലെങ്കിൽ കന്യകയായ മകൾ എന്നീ പ്രധാന വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὑπέρακμος
  choice: യൗവനം പിന്നിട്ടവൾ
  rationale: യൗവനത്തിന്റെ പുഷ്ടികാലം പിന്നിട്ടിരിക്കുന്നു എന്ന പ്രായസംബന്ധമായ ആശയം ലളിതമായി അറിയിക്കുന്നു; കൃത്യമായ വിവാഹപ്രായം എന്ന ആധുനിക വിഭാഗം മൂലപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: കാര്യങ്ങൾ അങ്ങനെതന്നെ നടക്കേണ്ടതാണ്
  rationale: ὀφείλει എന്ന ആവശ്യകതയും γίνεσθαι എന്ന പൊതുവായ സംഭവിക്കൽ ആശയവും നിലനിർത്തുന്നു; കാരണം ലൈംഗികാഭിലാഷമോ സാമൂഹിക സമ്മർദമോ ആണെന്ന് പ്രത്യേകം നിർണ്ണയിക്കുന്നില്ല.
- source_word: ὃ θέλει ποιείτω
  choice: അവൻ ആഗ്രഹിക്കുന്നതു ചെയ്യട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞാരൂപത്തിന്റെ അനുമതിദായക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: οὐχ ἁμαρτάνει
  choice: അവൻ പാപം ചെയ്യുന്നില്ല
  rationale: പ്രവർത്തി പാപമല്ലെന്ന ധാർമിക അനുമതി വർത്തമാനകാലത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: γαμείτωσαν
  choice: അവർ വിവാഹം കഴിക്കട്ടെ
  rationale: രണ്ടുപേരെയും സൂചിപ്പിക്കുന്ന മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞാരൂപം അതിന്റെ ശക്തിയോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘തന്റെ കന്യക’ (παρθένον αὐτοῦ) ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാചകത്തിൽ ‘തന്റെ കന്യക’ എന്നു നൽകി ഗ്രീക്കിലെ അവ്യക്തത നിലനിർത്തുന്നു.
  alternative: ‘തന്റെ പ്രതിശ്രുതവധു/വിവാഹനിശ്ചയം കഴിഞ്ഞ കന്യക’ അല്ലെങ്കിൽ ‘തന്റെ സംരക്ഷണത്തിലുള്ള കന്യകയായ മകൾ’.
  rationale: ഈ പ്രയോഗം ഒരു പുരുഷനും അവന്റെ പ്രതിശ്രുതവധുവും തമ്മിലുള്ള ബന്ധമായോ, ഒരു പിതാവ്/രക്ഷാകർത്താവും കന്യകയായ മകളും തമ്മിലുള്ള ബന്ധമായോ മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്. മൂലപാഠം ബന്ധം വ്യക്തമായി നിർണ്ണയിക്കാത്തതിനാൽ പരിഭാഷയും അത് നിശ്ചയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘തന്റെ കന്യക’ സാധാരണ സംഭാഷണത്തിൽ അപൂർവമാണെങ്കിലും, ബന്ധത്തെ പ്രതിശ്രുതവധുവെന്നോ മകളെന്നോ തീർപ്പാക്കാതെ മൂലപാഠത്തിലെ യഥാർഥ അവ്യക്തത സൂക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
