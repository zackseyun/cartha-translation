id: 1CO.7.21
reference: 1 Corinthians 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: ml
  text: അടിമയായിരിക്കുമ്പോഴാണോ നീ വിളിക്കപ്പെട്ടത്? അതിനെക്കുറിച്ച് നീ വിഷമിക്കേണ്ട. എന്നാൽ, സ്വതന്ത്രനാകാൻ നിനക്കു കഴിയുമെങ്കിൽ, പകരം ആ അവസരം പ്രയോജനപ്പെടുത്തുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിന്റെ ഇപ്പോഴത്തെ അവസ്ഥ പ്രയോജനപ്പെടുത്തുക,” അതായത്, ഇപ്പോഴുള്ള നിലയിൽ തുടരുക. “μᾶλλον χρῆσαι” എന്ന ഗ്രീക്ക് പ്രയോഗത്തിൽ കർമം വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ഈ വാക്യം രണ്ടു വിധത്തിലും മനസ്സിലാക്കപ്പെട്ടിട്ടുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: അടിമ
  rationale: സേവകൻ എന്ന പൊതുവായ അർഥത്തേക്കാൾ ബന്ധിതമായ സാമൂഹികപദവിയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; സ്വതന്ത്രനാകുന്നതിനെക്കുറിച്ചുള്ള തുടർവാക്യം ഇതു വ്യക്തമാക്കുന്നു.
- source_word: ἐκλήθης
  choice: വിളിക്കപ്പെട്ടത്
  rationale: ദൈവികവിളിയെന്ന പൗലോസിന്റെ സന്ദർഭാർഥം നിലനിർത്തുമ്പോഴും, മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കാതെ കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: μή σοι μελέτω
  choice: അതു നിന്നെ അലട്ടേണ്ട
  rationale: ആശങ്കപ്പെടുകയോ മനസ്സിനെ ബാധിക്കുകയോ ചെയ്യരുതെന്ന ഇടയപരമായ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐλεύθερος γενέσθαι
  choice: സ്വതന്ത്രനാകാൻ
  rationale: അടിമത്തത്തിൽനിന്ന് സ്വതന്ത്രമായ സാമൂഹികപദവിയിലേക്കുള്ള മാറ്റം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: μᾶλλον χρῆσαι
  choice: ആ അവസരംതന്നെ പ്രയോജനപ്പെടുത്തുക
  rationale: χρῆσαι എന്ന ക്രിയയുടെ കർമം മൂലപാഠത്തിൽ വ്യക്തമാക്കിയിട്ടില്ല. ഉടൻ മുമ്പുള്ള സ്വതന്ത്രനാകാനുള്ള സാധ്യതയെ സൂചിപ്പിക്കുന്ന വായന മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും മറ്റൊരു പുരാതന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: μᾶλλον χρῆσαι എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനദ്വയാർഥത
  choice: സ്വതന്ത്രനാകാനുള്ള അവസരം ലഭിച്ചാൽ അതു പ്രയോജനപ്പെടുത്തുക.
  alternative: നിലവിലുള്ള അടിമസ്ഥിതിയെ പ്രയോജനപ്പെടുത്തുക, അഥവാ അതേ നിലയിൽ തുടരുക.
  rationale: അടുത്തുള്ള വ്യവസ്ഥാവാക്യം സ്വാതന്ത്ര്യത്തിനുള്ള സാധ്യതയെ കർമമായി ഗ്രഹിക്കാൻ ഇടനൽകുന്നു. എങ്കിലും ഗ്രീക്കിൽ കർമം പറയാത്തതിനാലും മറുവായനയ്ക്ക് ദീർഘമായ വ്യാഖ്യാനചരിത്രമുള്ളതിനാലും അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഏകവചന അഭിസംബോധന ഉപയോഗിച്ചു. അടിമത്തത്തിന്റെ യാഥാർഥ സാമൂഹികപദവി മറയ്ക്കാതിരിക്കാൻ ‘അടിമ’ എന്നും, മുഖ്യവായന വ്യക്തമാക്കാൻ ‘ആ അവസരംതന്നെ’ എന്നും ഉപയോഗിച്ചു; മൂലപാഠത്തിലെ ദ്വയാർഥത അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
