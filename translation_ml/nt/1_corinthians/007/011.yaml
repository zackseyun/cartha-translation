  to: എന്നാൽ അവൾ വേർപിരിയുകയാണെങ്കിൽ[a], അവിവാഹിതയായി തുടരട്ടെ; അല്ലെങ്കിൽ ഭർത്താവുമായി അനുരഞ്ജിതയാകട്ടെ. ഭർത്താവ് ഭാര്യയെ വിവാഹമോചനം ചെയ്യരുത്[b].
