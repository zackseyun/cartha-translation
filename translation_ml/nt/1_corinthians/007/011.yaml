id: 1CO.7.11
reference: 1 Corinthians 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: ml
  text: എന്നാൽ അവൾ വേർപിരിയുകയാണെങ്കിൽ[a], അവിവാഹിതയായി തുടരട്ടെ; അല്ലെങ്കിൽ ഭർത്താവുമായി അനുരഞ്ജിതയാകട്ടെ. ഭർത്താവ് ഭാര്യയെ വിവാഹമോചനം ചെയ്യരുത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘എന്നാൽ അവൾ വേർപിരിഞ്ഞാലും.’ ഇവിടെ ഗ്രീക്ക് പ്രയോഗത്തിന് നേരിയ ഇളവുനൽകുന്ന ഭാവം ഉണ്ടായിരിക്കാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഭാര്യയെ ഉപേക്ഷിക്കരുത്.’ ഗ്രീക്ക് ക്രിയയെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘അയച്ചുകളയുക’ എന്നു പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഈ ദാമ്പത്യസന്ദർഭത്തിൽ അത് സാധാരണയായി വിവാഹമോചനത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: എന്നാൽ ... വേർപിരിയുകയാണെങ്കിൽ
  rationale: ഈ പ്രയോഗം നിബന്ധനയോടൊപ്പം നേരിയ concessive ഭാവവും വഹിക്കാം. മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായ നിബന്ധനാപ്രയോഗം നിലനിർത്തി, ‘വേർപിരിഞ്ഞാലും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: χωρισθῇ
  choice: വേർപിരിയുകയാണെങ്കിൽ
  rationale: χωρίζω ഇവിടെ ദാമ്പത്യബന്ധത്തിലെ വേർപിരിയലിനെ സൂചിപ്പിക്കുന്നു. നിയമപരമായ വിവാഹമോചനം എന്ന് അതിരുകടന്ന് നിർണ്ണയിക്കാതെ, ἀφιέναι എന്ന പിന്നാലെയുള്ള വ്യത്യസ്ത ക്രിയയുമായുള്ള വ്യത്യാസവും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: μενέτω
  choice: തുടരട്ടെ
  rationale: μένω എന്നതിന്റെ ‘തുടരുക/നിലനിൽക്കുക’ എന്ന അർത്ഥവും മൂന്നാംപുരുഷ ആജ്ഞാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄγαμος
  choice: അവിവാഹിതയായി
  rationale: ἄγαμος എന്നത് വിവാഹിതയല്ലാത്ത അവസ്ഥയെ കൃത്യമായി സൂചിപ്പിക്കുന്നു. ‘ഒറ്റയ്ക്ക്’ എന്നത് കൂടുതൽ വിപുലവും അവ്യക്തവുമായതിനാൽ ഒഴിവാക്കി.
- source_word: τῷ ἀνδρὶ
  choice: ഭർത്താവുമായി
  rationale: ദാമ്പത്യസന്ദർഭത്തിൽ ἀνήρ എന്നത് ‘പുരുഷൻ’ എന്നതിലുപരി ‘ഭർത്താവ്’ എന്നാണ്.
- source_word: καταλλαγήτω
  choice: അനുരഞ്ജനപ്പെടട്ടെ
  rationale: καταλλάσσω എന്ന പദത്തിന്റെ ബന്ധപരമായ ‘അനുരഞ്ജിതയാകുക’ എന്ന അർത്ഥം നിലനിർത്തുന്നു; വെറും ഒരുമിച്ചുതാമസിക്കൽ എന്നതിലേക്ക് അർത്ഥം ചുരുക്കുന്നില്ല.
- source_word: ἄνδρα
  choice: ഭർത്താവാകട്ടെ
  rationale: ഇവിടെയും ἀνήρ ദാമ്പത്യസന്ദർഭത്തിൽ ഭർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആകട്ടെ’ ചേർത്തത് സ്ത്രീയോടുള്ള നിർദേശത്തിനു പിന്നാലെയുള്ള സമാന്തര നിർദേശം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: γυναῖκα
  choice: ഭാര്യയെ
  rationale: γυνή ഈ ദാമ്പത്യസന്ദർഭത്തിൽ ‘സ്ത്രീ’ എന്നല്ല, ‘ഭാര്യ’ എന്നാണ്.
- source_word: μὴ ἀφιέναι
  choice: വിവാഹമോചനം ചെയ്യരുത്
  rationale: ἀφίημι അടിസ്ഥാനമായി ‘അയച്ചുകളയുക/വിട്ടയക്കുക’ എന്ന് അർത്ഥമാക്കാമെങ്കിലും, ദാമ്പത്യസന്ദർഭത്തിൽ ഭാര്യയെ വിവാഹമോചനം ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ വ്യക്തമായ നിരോധനരൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: χωρισθῇ, ἀφιέναι എന്നീ രണ്ടു ക്രിയകളെയും ഒരേ പദമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: χωρισθῇ എന്നത് ‘വേർപിരിയുക’ എന്നും ἀφιέναι എന്നത് ‘വിവാഹമോചനം ചെയ്യുക’ എന്നും വേർതിരിച്ചു പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടും ‘വിവാഹമോചനം ചെയ്യുക’ എന്നോ, രണ്ടും പൊതുവായി ‘വേർപിരിയുക/ഉപേക്ഷിക്കുക’ എന്നോ പരിഭാഷപ്പെടുത്തുക.
  rationale: പൗലോസ് രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് ക്രിയകളാണ് ഉപയോഗിക്കുന്നത്. ആ വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നത് χωρισθῇ എന്നതിൽ നിയമപരമായ കൃത്യത അനാവശ്യമായി ചുമത്താതെയും ἀφιέναι എന്നതിന്റെ ദാമ്പത്യസന്ദർഭത്തിലെ വിവാഹമോചനഭാവം വ്യക്തമാക്കിയും ഇരിക്കുന്നു.
- issue: ആദ്യ ഉപവാക്യത്തിലെ സ്ത്രീലിംഗ കർത്താവിനെ മലയാളത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘അവൾ’ എന്നും തുടർന്ന് സ്ത്രീലിംഗരൂപങ്ങളും ഉപയോഗിച്ചു.
  alternative: ‘ഭാര്യ’ എന്ന് ആവർത്തിക്കുക, അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമായി പരാവർത്തനം ചെയ്യുക.
  rationale: മുൻസന്ദർഭത്തിൽ ഭാര്യയോടാണ് നിർദേശം; ഗ്രീക്കിലെ കർത്താവ് പ്രസംഗസന്ദർഭത്തിൽനിന്നാണ് വ്യക്തമാകുന്നത്. മലയാളത്തിൽ ‘അവൾ’ ചേർക്കുന്നത് ആ ഘടന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- issue: καταλλαγήτω എന്നതിനെ വെറും പുനഃസംഗമമായി വ്യക്തമാക്കണമോ
  choice: ‘ഭർത്താവുമായി അനുരഞ്ജനപ്പെടട്ടെ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഭർത്താവിന്റെ അടുക്കലേക്കു മടങ്ങട്ടെ’ അല്ലെങ്കിൽ ‘വീണ്ടും ഒത്തുചേരട്ടെ’.
  rationale: ഗ്രീക്ക് പദം ബന്ധത്തിലെ അനുരഞ്ജനമാണ് സൂചിപ്പിക്കുന്നത്; താമസസ്ഥലത്തേക്കുള്ള മടങ്ങിവരവോ ശാരീരിക പുനഃസംഗമമോ മാത്രം എന്ന് പാഠം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അനുരഞ്ജനപ്പെടട്ടെ’ എന്നത് ദൈവശാസ്ത്രപരമായി അധിക അർത്ഥം ചേർക്കാതെ ഗ്രീക്കിലെ ബന്ധപരമായ ആശയം നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് consultation പാഠത്തിലെ [b] അടയാളത്തിന്റെ സ്ഥാനം അതിന്റെ അടിക്കുറിപ്പ് ἀφιέναιയെക്കുറിച്ചാണെന്നതനുസരിച്ച് മലയാളത്തിൽ ‘വിവാഹമോചനം ചെയ്യരുത്’ എന്നതിനുശേഷം ക്രമപ്പെടുത്തി.
