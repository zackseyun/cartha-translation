id: 1CO.7.26
reference: 1 Corinthians 7:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: ml
  text: 'അതുകൊണ്ട്, ഇപ്പോഴത്തെ ഞെരുക്കം നിമിത്തം ഇതു നല്ലതാണെന്ന് ഞാൻ കരുതുന്നു: ഒരു മനുഷ്യന് ഇങ്ങനെ ആയിരിക്കുന്നത് നല്ലതാണ്[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഇപ്പോഴത്തെ അനിവാര്യത നിമിത്തം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ἀνάγκη എന്ന പദത്തിന് അനിവാര്യത, സമ്മർദം, ഞെരുക്കം എന്നീ അർഥസാധ്യതകളുണ്ട്.
  - marker: b
    text: 'അക്ഷരാർഥം: “ഇങ്ങനെ ആയിരിക്കുക.” സന്ദർഭത്തിൽ, “താൻ ആയിരിക്കുന്ന നിലയിൽ തുടരുക” എന്ന ആശയം ഇതിനു സൂചിപ്പിക്കാം.'
    reason: τὸ οὕτως εἶναι എന്ന പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭാർഥസാധ്യതയും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: νομίζω
  choice: ഞാൻ കരുതുന്നു
  rationale: പൗലൊസിന്റെ വ്യക്തിപരവും പരിഗണിച്ചെടുത്തതുമായ വിലയിരുത്തൽ പ്രകടമാക്കുന്നു; സമ്പൂർണമായ ഒരു കല്പനയുടെ ഭാവം നൽകുന്നില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള ചർച്ചയിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: നല്ലതെന്ന്
  rationale: അനന്തക്രിയാരൂപമുള്ള ഗ്രീക്ക് ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായ പരോക്ഷവാക്യമായി നൽകുന്നു; καλός എന്ന പദത്തിന്റെ ‘നല്ലത്/ഉചിതം’ എന്ന വിലയിരുത്തൽ നിലനിർത്തുന്നു.
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: ഇപ്പോഴത്തെ ഞെരുക്കം നിമിത്തം
  rationale: ἐνεστῶσαν എന്നത് ഇപ്പോഴുള്ള സാഹചര്യം സൂചിപ്പിക്കുന്നു; ἀνάγκη ഇവിടെ സമ്മർദകരമായ ദുരവസ്ഥയെയോ ഞെരുക്കത്തെയോ സൂചിപ്പിക്കാം.
- source_word: ὅτι
  choice: —
  rationale: ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന ὅτι മലയാളത്തിലെ ‘എന്ന്’ ഘടനയിലൂടെ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പ്രത്യേകമായ ഒരു പദമായി വേർതിരിച്ചിട്ടില്ല.
- source_word: καλὸν
  choice: നല്ലത്
  rationale: വാക്യത്തിലെ ആവർത്തിച്ചുള്ള മൂല്യനിർണയപദത്തിന്റെ അർഥം കാത്തുസൂക്ഷിക്കുന്നു; ‘പ്രയോജനകരം’ പോലുള്ള വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കുന്നു.
- source_word: ἀνθρώπῳ
  choice: ഒരു മനുഷ്യനു
  rationale: ഗ്രീക്ക് ഏകവചനമായ ἄνθρωπος പൊതുവായി ‘വ്യക്തി’ എന്നർഥത്തിലും വരാം; ഉറവിടത്തിന്റെ രൂപം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ മാന്യവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὸ οὕτως εἶναι
  choice: ഇങ്ങനെ ആയിരിക്കുന്നത്
  rationale: അക്ഷരാർഥമായ ‘ഇങ്ങനെ ആയിരിക്കുക’ എന്ന അനിശ്ചിത സൂചന നിലനിർത്തുന്നു; ‘തന്റെ ഇപ്പോഴത്തെ നിലയിൽ തുടരുക’ എന്ന സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ അമിതമായി വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: പൗലൊസിന്റെ പ്രസ്താവനയുടെ സ്വഭാവം
  choice: ‘ഞാൻ കരുതുന്നു’ എന്നും ‘ഇപ്പോഴത്തെ ഞെരുക്കം നിമിത്തം’ എന്നും നൽകി സാഹചര്യബന്ധിതമായ പരിഗണനയായി നിലനിർത്തി.
  alternative: വിവാഹത്തിനെതിരായ സർവകാലികമായ കല്പനയോ മുൻഗണനയോ ആയി വ്യക്തമാക്കുക.
  rationale: വാക്യത്തിലെ ഒന്നാംപുരുഷ വിലയിരുത്തലും അതിനു പറയുന്ന സാഹചര്യകാരണവും സമ്പൂർണമായ നിരോധനമെന്ന വ്യാഖ്യാനം അനുവദിക്കുന്നില്ല; പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഞെരുക്കം’ ബാഹ്യമായ സമ്മർദസാഹചര്യം സൂചിപ്പിക്കുന്നു. ഉറവിടത്തിലെ പൊതുവായോ പുരുഷനെ പ്രത്യേകിച്ചോ സൂചിപ്പിക്കാവുന്ന ἀνθρώπῳ എന്ന അനിശ്ചിതത്വം ‘ഒരു മനുഷ്യനു’ എന്ന രൂപത്തിൽ നിലനിർത്തി; പ്രത്യേക അടിക്കുറിപ്പ് ചേർക്കാതെ സ്വാഭാവിക വായനയ്ക്ക് മുൻഗണന നൽകി.
