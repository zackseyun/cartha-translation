id: 1CO.7.2
reference: 1 Corinthians 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ δὲ τὰς πορνείας ἕκαστος τὴν ἑαυτοῦ γυναῖκα ἐχέτω, καὶ ἑκάστη τὸν ἴδιον ἄνδρα ἐχέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/002.yaml
  text: But because of sexual immoralities[a], let each man have his own wife, and let each woman have her own husband.
translation:
  language: ml
  text: എന്നാൽ, ലൈംഗിക അനാചാരങ്ങൾ[a] നിമിത്തം, ഓരോ പുരുഷനും സ്വന്തം ഭാര്യ ഉണ്ടായിരിക്കട്ടെ; ഓരോ സ്ത്രീക്കും സ്വന്തം ഭർത്താവും ഉണ്ടായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ലൈംഗിക അനാചാരം’ (ഏകവചനം). ഗ്രീക്കിൽ ‘ലൈംഗിക അനാചാരങ്ങൾ’ എന്ന ബഹുവചനമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ
  choice: എന്നാൽ ... നിമിത്തം
  rationale: διά + accusative കാരണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘നിമിത്തം’ എന്നു പരിഭാഷപ്പെടുത്തി; δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യമോ ആശയവികാസമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ ഉപയോഗിച്ചു.
- source_word: τὰς πορνείας
  choice: ലൈംഗിക അധാർമികതകൾ
  rationale: πορνεία ലൈംഗികമായി അധാർമികമായ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്താൻ ‘അധാർമികതകൾ’ എന്ന ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: ἕκαστος
  choice: ഓരോ പുരുഷനും
  rationale: തുടർന്നുള്ള സ്ത്രീലിംഗരൂപമായ ἑκάστηയോടും ഭാര്യ/ഭർത്താവ് എന്ന സമാന്തര ഘടനയോടും ചേർന്നുനിൽക്കുന്നതിനാൽ ഇവിടെ പുരുഷനെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: സ്വന്തം ഭാര്യ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമുണ്ടെങ്കിലും, ἄνδραയോടുള്ള ദാമ്പത്യസമാന്തരവും സന്ദർഭവും ‘ഭാര്യ’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; ἑαυτοῦയുടെ സ്വത്വഊന്നൽ ‘സ്വന്തം’ നിലനിർത്തുന്നു.
- source_word: ἐχέτω
  choice: ഉണ്ടായിരിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിർദേശസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘വിവാഹം കഴിക്കട്ടെ’ എന്നതുപോലെ മൂലത്തിൽ ഇല്ലാത്ത ക്രിയ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: καὶ ἑκάστη
  choice: ഓരോ സ്ത്രീക്കും
  rationale: പുരുഷനെക്കുറിച്ചുള്ള ആദ്യ ഉപവാക്യത്തിന് സമാന്തരമായ സ്ത്രീലിംഗ വിതരണാർഥം നിലനിർത്തുന്നു.
- source_word: τὸν ἴδιον ἄνδρα
  choice: സ്വന്തം ഭർത്താവ്
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമുണ്ടെങ്കിലും, വിവാഹസന്ദർഭത്തിലും γυνήയോടുള്ള സമാന്തരത്തിലും ‘ഭർത്താവ്’ യോജിക്കുന്നു; ἴδιον എന്ന ഊന്നൽ ‘സ്വന്തം’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യം ലൈംഗികപാപം ഒഴിവാക്കാനുള്ള വിവാഹനിർദേശമായോ ദാമ്പത്യബന്ധത്തെക്കുറിച്ചുള്ള കല്പനയായോ വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: ഓരോ പുരുഷനും സ്ത്രീക്കും സ്വന്തം ജീവിതപങ്കാളി ഉണ്ടായിരിക്കട്ടെ എന്ന ഗ്രീക്ക് ആജ്ഞാരൂപം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘വിവാഹം കഴിക്കട്ടെ’ എന്നോ ‘ദാമ്പത്യകടമകൾ നിറവേറ്റട്ടെ’ എന്നോ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: മൂലപാഠത്തിൽ വിവാഹം കഴിക്കുക എന്ന പ്രത്യേക ക്രിയയോ ദാമ്പത്യകടമ നിറവേറ്റുക എന്ന പ്രയോഗമോ ഇല്ല; ἐχέτω എന്നത് ‘ഉണ്ടായിരിക്കട്ടെ/സ്വന്തമായി ഉണ്ടായിരിക്കട്ടെ’ എന്നാണ്. അതിനാൽ വിശാലമായ ദൈവശാസ്ത്രനിഗമനം പരിഭാഷയിൽ ചേർക്കാതെ പാഠത്തിലെ അർഥവ്യാപ്തിയും പിരിമുറുക്കവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. സമാന്തരമായ രണ്ട് ഉപവാക്യങ്ങളുടെയും തുല്യത നിലനിർത്തിയിട്ടുണ്ട്.
