reference: 1 Corinthians 7:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: ml
  text: 'എന്നാൽ, നിങ്ങൾ ഉത്കണ്ഠയില്ലാത്തവരായിരിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്. അവിവാഹിതനായ പുരുഷൻ[a] കർത്താവിന്റെ കാര്യങ്ങളെക്കുറിച്ച് ശ്രദ്ധിക്കുന്നു: എങ്ങനെ കർത്താവിനെ പ്രസാദിപ്പിക്കാമെന്ന്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവിവാഹിതനായ വ്യക്തി.’ ഗ്രീക്കിൽ പുല്ലിംഗ ഏകവചനമാണ് (‘അവിവാഹിതനായ പുരുഷൻ’); എങ്കിലും ചുറ്റുമുള്ള സന്ദർഭത്തിൽ പൗലോസ് അവിവാഹിതരുടെയും വിവാഹിതരുടെയും അവസ്ഥകളെ കൂടുതൽ വിശാലമായി പരിഗണിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: എന്നാൽ ... എന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്
  rationale: θέλω എന്നതിന്റെ ഇച്ഛയെ നേരിട്ട് അറിയിക്കുന്നു; δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ സ്വാഭാവികമാണ്.
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: നിങ്ങൾ ഉത്കണ്ഠകളിൽനിന്ന് ഒഴിഞ്ഞിരിക്കണം
  rationale: ἀμέριμνος ആശങ്കയോ അമിതമായ ചിന്താഭാരമോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ‘ഒഴിഞ്ഞിരിക്കുക’ നിസ്സംഗത എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ὁ ἄγαμος
  choice: അവിവാഹിതനായ പുരുഷൻ
  rationale: ഗ്രീക്കിൽ നിർദിഷ്ടപ്രത്യയത്തോടുകൂടിയ പുല്ലിംഗ ഏകവചനരൂപമാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ ലിംഗവും വചനവും നിലനിർത്തുന്നു.
- source_word: μεριμνᾷ
  choice: ശ്രദ്ധിക്കുന്നു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് ആശങ്കപ്പെടുക എന്നതിലുപരി ശ്രദ്ധ ചെലുത്തുക/കരുതൽ കാണിക്കുക എന്ന അർഥമാണ്; മുൻഭാഗത്തെ ἀμερίμνους-നോടുള്ള പദബന്ധവും ആശയവ്യത്യാസവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ τοῦ κυρίου
  choice: കർത്താവിന്റെ കാര്യങ്ങൾ
  rationale: കർത്താവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളുടെ വിശാലമായ പരിധി ഈ സ്വാഭാവിക മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κυρίου / κυρίῳ
  choice: കർത്താവ് / കർത്താവിനെ
  rationale: κύριος എന്ന പുതിയനിയമ ബിരുദത്തിന്റെ ദൈവശാസ്ത്രപരവും പദാർത്ഥപരവുമായ ശക്തി ‘കർത്താവ്’ നിലനിർത്തുന്നു.
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: എങ്ങനെ കർത്താവിനെ പ്രസാദിപ്പിക്കാം
  rationale: πῶς രീതിയെയോ ലക്ഷ്യത്തെയോ സൂചിപ്പിക്കുന്നു; subjunctive ആയ ἀρέσῃ-യുടെ വിചാരിക്കപ്പെടുന്ന സാധ്യത ‘പ്രസാദിപ്പിക്കാം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അവിവാഹിതനും വിവാഹിതനും തമ്മിലുള്ള പൗലോസിന്റെ താരതമ്യത്തിലെ പുല്ലിംഗ ഏകവചന പരാമർശം
  choice: മുഖ്യപാഠത്തിൽ ‘അവിവാഹിതനായ പുരുഷൻ’ എന്ന് പുല്ലിംഗ ഏകവചനം നിലനിർത്തുന്നു.
  alternative: ‘അവിവാഹിതനായ വ്യക്തി’ അല്ലെങ്കിൽ ‘അവിവാഹിതർ’
  rationale: ὁ ἄγαμος വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; സമീപവാക്യങ്ങളിൽ പുരുഷന്റെയും സ്ത്രീയുടെയും സാഹചര്യങ്ങൾ വേർതിരിച്ചുപറയുന്നു. അതിനാൽ ഉറവിടരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും വിശാലമായ സന്ദർഭം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആശങ്കയില്ലായ്മയും കർത്താവിന്റെ കാര്യങ്ങളിലുള്ള സജീവശ്രദ്ധയും തമ്മിലുള്ള ഗ്രീക്ക് പദകളി കഴിയുന്നത്ര വ്യക്തമായി സൂക്ഷിച്ചിരിക്കുന്നു; വാക്യാവസാനത്തിലെ അർധവിരാമം തുടർവാക്യത്തിലേക്കുള്ള ബന്ധം നിലനിർത്തുന്നു.
