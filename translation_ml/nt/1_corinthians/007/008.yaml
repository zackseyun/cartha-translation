reference: 1 Corinthians 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: ml
  text: 'അവിവാഹിതരോടും[a] വിധവമാരോടും ഞാൻ പറയുന്നു: അവർ എന്നെപ്പോലെ[b] തുടരുന്നെങ്കിൽ, അത് അവർക്കു നല്ലതാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിവാഹിതരായ പുരുഷന്മാരോട്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ രൂപം പുല്ലിംഗ ബഹുവചനമാണ്, എങ്കിലും സന്ദർഭത്തിൽ അത് പ്രതിനിധാനപരമായി ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥം: ‘ഞാനും ആയിരിക്കുന്നതുപോലെ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: ഞാൻ പറയുന്നു
  rationale: δέ ഇവിടെ നേരിയ ബന്ധസൂചകമാണ്; മലയാളത്തിൽ അനാവശ്യമായ ശക്തമായ വിരോധമോ കാലസൂചനയോ ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
- source_word: τοῖς ἀγάμοις
  choice: അവിവാഹിതരോട്
  rationale: ἄγαμος എന്നത് വിവാഹിതരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിൽ രൂപം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും സന്ദർഭത്തിൽ അത് പ്രതിനിധാനപരമായി ഉപയോഗിച്ചിരിക്കാം; ഈ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ταῖς χήραις
  choice: വിധവമാരോട്
  rationale: χήρα ഭർത്താവ് മരിച്ച സ്ത്രീയെ, അഥവാ വിധവയെ, പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു.
- source_word: καλὸν αὐτοῖς
  choice: അത് അവർക്കു നല്ലതാണ്
  rationale: καλόν ഇവിടെ ‘നല്ലത്’ എന്ന വിശാലമായ വിലയിരുത്തലാണ്; ‘കൂടുതൽ നല്ലത്’ എന്ന താരതമ്യം ഗ്രീക്കിൽ ഇല്ല.
- source_word: ἐὰν μείνωσιν
  choice: അവർ … തുടരുന്നെങ്കിൽ
  rationale: ἐάν സഹിതമുള്ള ഉപവാക്യത്തിന്റെ വ്യവസ്ഥാഭാവവും μένωയുടെ ‘നിലയിൽ തുടരുക’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ὡς κἀγώ
  choice: എന്നെപ്പോലെതന്നെ
  rationale: പൗലോസിന്റെ നിലവിലെ അവിവാഹിതാവസ്ഥയോടുള്ള താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; καὶ ἐγώ എന്ന ഘടനയിലെ ചേർക്കൽഭാവം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀγάμοις എന്നതിന്റെ ലിംഗപരവും വിഭാഗപരവുമായ വ്യാപ്തി
  choice: ‘അവിവാഹിതർ’ എന്ന വിശാല പദം ഉപയോഗിച്ച് ‘വിധവമാർ’ എന്ന വിഭാഗം പ്രത്യേകം നിലനിർത്തി.
  alternative: ‘അവിവാഹിതരായ പുരുഷന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും അത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതാണോ പ്രതിനിധാനപരമാണോ എന്ന യഥാർഥ അനിശ്ചിതത്വം ഉണ്ട്. പ്രധാനപാഠത്തിൽ വിശാല അർഥവും അടിക്കുറിപ്പിൽ രൂപപരമായ സാധ്യതയും സംരക്ഷിച്ചു.
- issue: καλὸν എന്നതിലെ വിലയിരുത്തലിന്റെ ശക്തി
  choice: ‘നല്ലതാണ്’
  alternative: ‘കൂടുതൽ നല്ലതാണ്’ അല്ലെങ്കിൽ ‘ഉചിതമാണ്’
  rationale: മൂലപദം ഇവിടെ താരതമ്യരൂപമല്ല; അതിനാൽ പൗലോസിന്റെ ഉപദേശത്തെ ഗ്രീക്ക് പറയുന്നതിലുമധികം ശക്തമായ താരതമ്യമായി അവതരിപ്പിച്ചില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിലെ വ്യവസ്ഥാഭാവം ‘തുടരുന്നെങ്കിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തി; വിവാഹിതരാകാതെ തുടരുന്ന അവസ്ഥ സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാവുന്നതിനാൽ പ്രധാനപാഠത്തിൽ അനാവശ്യ വിശദീകരണം ചേർത്തിട്ടില്ല.
