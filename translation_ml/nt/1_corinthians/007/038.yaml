id: 1CO.7.38
reference: 1 Corinthians 7:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: ml
  text: അതുകൊണ്ട്, തന്റെ കന്യകയെ[a] വിവാഹം കഴിച്ചുകൊടുക്കുന്നവൻ നന്നായി ചെയ്യുന്നു; അവളെ വിവാഹം കഴിച്ചുകൊടുക്കാത്തവനോ അതിലും നന്നായി ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തന്റെ കന്യകയായ പ്രതിശ്രുതവധുവിനെ വിവാഹം കഴിക്കുന്നവൻ നന്നായി ചെയ്യുന്നു; അവളെ വിവാഹം കഴിക്കാത്തവൻ അതിലും നന്നായി ചെയ്യും.” ‘കന്യക’ എന്നത് അയാളുടെ കന്യകയായ മകളെ സൂചിപ്പിക്കുന്നു എന്നതും പൊതുവായ മറ്റൊരു വ്യാഖ്യാനമാണ്. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘വിവാഹം കഴിക്കുക’ എന്നതിനെക്കാൾ സ്വാഭാവികമായി ‘വിവാഹം കഴിച്ചുകൊടുക്കുക’ എന്നാണ് അർഥം; അതിനാൽ മുഖ്യവാചകം ആ അർഥം നിലനിർത്തുകയും കന്യകയുമായുള്ള കൃത്യബന്ധം വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γαμίζων
  choice: വിവാഹം കഴിച്ചുകൊടുക്കുന്നവൻ
  rationale: γαμίζω എന്ന കാരകക്രിയയുടെ സാധാരണ അർഥമായ ‘വിവാഹം കഴിച്ചുകൊടുക്കുക’ നിലനിർത്തുന്നു; അതിനെ γαμέω എന്ന ‘വിവാഹം കഴിക്കുക’ എന്ന ക്രിയയുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: തന്റെ കന്യകയെ
  rationale: παρθένος എന്നതിന്റെ ‘കന്യക’ എന്ന അർഥവും ἑαυτοῦ സൂചിപ്പിക്കുന്ന വ്യക്തിബന്ധവും നിലനിർത്തുന്നു; അവൾ മകളോ സംരക്ഷണത്തിലുള്ളവളോ വിവാഹനിശ്ചയം കഴിഞ്ഞവളോ എന്ന് മുഖ്യവാചകത്തിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: καλῶς ποιεῖ
  choice: നല്ലതു ചെയ്യുന്നു
  rationale: ഗ്രീക്കിലെ അനുകൂലമായ വിലയിരുത്തൽ അതിനെ കേവലമായ ധാർമിക കല്പനയാക്കി മാറ്റാതെ ലളിതമായി നൽകുന്നു.
- source_word: μὴ γαμίζων
  choice: അവളെ വിവാഹം കഴിച്ചുകൊടുക്കാത്തവൻ
  rationale: ആദ്യ പ്രയോഗത്തിലെ കാരകാർഥം ഏകീകൃതമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ വ്യക്തതയ്ക്കായി മുൻപറഞ്ഞ കന്യകയെ ‘അവളെ’ എന്ന് ആവർത്തിക്കുന്നു.
- source_word: κρεῖσσον ποιήσει
  choice: അതിലും നല്ലതു ചെയ്യും
  rationale: κρεῖσσον താരതമ്യപദമായതിനാൽ ‘ഏറ്റവും നല്ലത്’ എന്നു ശക്തിപ്പെടുത്താതെ താരതമ്യാർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ‘തന്റെ കന്യക’ ആരെ സൂചിപ്പിക്കുന്നു, γαμίζω ഇവിടെ എന്താണ് അർഥമാക്കുന്നത്?
  choice: മുഖ്യവാചകത്തിൽ ‘വിവാഹം കഴിച്ചുകൊടുക്കുക’ എന്ന കാരകാർഥം നിലനിർത്തി, കന്യകയുമായുള്ള കൃത്യബന്ധം നിർണയിക്കാതെ വിടുന്നു.
  alternative: ‘തന്റെ കന്യകയായ പ്രതിശ്രുതവധുവിനെ വിവാഹം കഴിക്കുന്നവൻ നല്ലതു ചെയ്യുന്നു; അവളെ വിവാഹം കഴിക്കാത്തവൻ അതിലും നല്ലതു ചെയ്യും.’ മറ്റൊരു സാധാരണ വ്യാഖ്യാനം കന്യകയായ മകളെ വിവാഹം കഴിച്ചുകൊടുക്കുന്നതിനെക്കുറിച്ചാണ്.
  rationale: 1 കൊരിന്ത്യർ 7:36–38 വ്യാഖ്യാനപരമായി സങ്കീർണമാണ്. γαμίζω സാധാരണയായി ‘വിവാഹം കഴിച്ചുകൊടുക്കുക’ എന്ന കാരകാർഥത്തെ പിന്തുണയ്ക്കുന്നു; എന്നാൽ കന്യക മകളാണോ, സംരക്ഷണത്തിലുള്ള യുവതിയാണോ, പ്രതിശ്രുതവധുവാണോ എന്നത് തർക്കവിഷയമാണ്. അതിനാൽ മുഖ്യവാചകം ഗ്രീക്ക് നേരിട്ട് നൽകുന്നതിലധികം ഒരു സാമൂഹിക പശ്ചാത്തലം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘തന്റെ കന്യക’ മലയാളത്തിൽ അപൂർവമായ പ്രയോഗമാണെങ്കിലും, വിവാദത്തിലുള്ള ബന്ധം ‘മകൾ’ അല്ലെങ്കിൽ ‘പ്രതിശ്രുതവധു’ എന്നു തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ അസ്പഷ്ടത നിലനിർത്താൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു.
