    issue: Footnote b uses the less natural expression “കർത്താവിനുള്ളവനെ.”
    rationale: “കർത്താവിനോടുള്ളവനെ” is more idiomatic modern Malayalam for a person belonging to the Lord; the note remains explicitly interpretive rather than a replacement for the main text.
