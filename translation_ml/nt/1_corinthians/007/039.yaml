language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: ml
  text: ഭാര്യ തന്റെ ഭർത്താവ് ജീവിച്ചിരിക്കുന്ന കാലമത്രയും ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു. എന്നാൽ ഭർത്താവ് നിദ്രപ്രാപിച്ചാൽ[a], താൻ ആഗ്രഹിക്കുന്നയാളെ വിവാഹം കഴിക്കാൻ അവൾക്ക് സ്വാതന്ത്ര്യമുണ്ട്; കർത്താവിൽ മാത്രം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘മരിച്ചാൽ.’ ഗ്രീക്കിൽ മരണത്തെ സൂചിപ്പിക്കാൻ ‘നിദ്രപ്രാപിക്കുക’ എന്ന സാധാരണ സൗമ്യപ്രയോഗമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവിൽ മാത്രം’ എന്നത് സാധാരണയായി കർത്താവിനോടുള്ളവനെ, അതായത് ഒരു സഹവിശ്വാസിയെ, മാത്രം വിവാഹം കഴിക്കണം എന്ന അർഥത്തിൽ മനസ്സിലാക്കപ്പെടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: ഭാര്യ
  rationale: വിവാഹബന്ധത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ പൊതുവായ ‘സ്ത്രീ’ എന്നതിനെക്കാൾ ‘ഭാര്യ’ എന്ന അർഥമാണ് യോജിച്ചത്.
- source_word: δέδεται
  choice: ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗം തുടരുന്ന ബന്ധിതാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; നിയമപരവും ബന്ധപരവുമായ ഭാവം അധികവാക്കുകൾ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς
  choice: തന്റെ ഭർത്താവ് ജീവിച്ചിരിക്കുന്ന കാലമത്രയും
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തെ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κοιμηθῇ
  choice: നിദ്രപ്രാപിച്ചാൽ
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നിദ്രാരൂപകം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു; വ്യക്തമായ അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐλευθέρα ἐστίν
  choice: അവൾക്ക് സ്വാതന്ത്ര്യമുണ്ട്
  rationale: മുൻ വിവാഹബന്ധത്തിൽനിന്നുള്ള മോചനത്തെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി മനസ്സിലാകുന്ന ഭാഷയിൽ വ്യക്തമാക്കുന്നു.
- source_word: ᾧ θέλει γαμηθῆναι
  choice: താൻ ആഗ്രഹിക്കുന്നയാളെ വിവാഹം കഴിക്കാൻ
  rationale: പുതിയ ജീവിതപങ്കാളിയെ തിരഞ്ഞെടുക്കാനുള്ള സ്വാതന്ത്ര്യം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ കർമണിരൂപം മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ സ്വാഭാവിക സജീവഘടന ഉപയോഗിക്കുന്നു.
- source_word: μόνον ἐν κυρίῳ
  choice: കർത്താവിൽ മാത്രം
  rationale: നിയന്ത്രണാർഥമുള്ള μόνον-ന്റെ ഊന്നൽ നിലനിർത്തുകയും വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ പൗലോസിന്റെ സംക്ഷിപ്ത പ്രയോഗം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുനർവിവാഹനിർദേശത്തിലെ ‘കർത്താവിൽ’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘കർത്താവിൽ മാത്രം’ എന്ന് സംക്ഷിപ്തമായി നിലനിർത്തി.
  alternative: കർത്താവിൽ വിശ്വസിക്കുന്ന ഒരാളെ മാത്രം; അല്ലെങ്കിൽ കർത്താവിനോടുള്ള ഭക്തിക്ക് യോജിച്ചവിധം മാത്രം.
  rationale: ἐν κυρίῳ വ്യാഖ്യാനസാന്ദ്രമായ പൗലോസീയ പ്രയോഗമാണ്. സഹവിശ്വാസിയെ മാത്രം വിവാഹം കഴിക്കുക എന്നത് സാധാരണ വ്യാഖ്യാനമാണെങ്കിലും അതിനെ മുഖ്യവാചകത്തിൽ ചേർക്കുന്നത് ഗ്രീക്കിനേക്കാൾ അർഥം വികസിപ്പിക്കും.
- issue: മരണത്തെ സൂചിപ്പിക്കുന്ന നിദ്രാരൂപകം
  choice: ‘നിദ്രപ്രാപിച്ചാൽ’ എന്ന് രൂപകം സംരക്ഷിച്ചു.
  alternative: മരിച്ചാൽ.
  rationale: κοιμηθῇ എന്ന മൂലപ്രയോഗത്തിന്റെ രൂപകവും ആദിമ ക്രൈസ്തവ മരണഭാഷയുടെ ഭാവവും നിലനിർത്തുന്നു; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പിൽ നേരാർഥം നൽകുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിദ്രപ്രാപിക്കുക’ എന്നത് രൂപകം സംരക്ഷിക്കുന്നതിനാൽ അല്പം ഉയർന്ന രജിസ്റ്ററിലാണെങ്കിലും അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുന്നു. ‘കർത്താവിൽ മാത്രം’ എന്ന സംക്ഷിപ്തത ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
