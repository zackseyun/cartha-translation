id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: ml
  text: 'എന്നാൽ സഹോദരങ്ങളേ[b], ഞാൻ പറയുന്നത് ഇതാണ്: സമയം ചുരുങ്ങിയിരിക്കുന്നു[a]; അങ്ങനെ, ഇനിമുതൽ ഭാര്യമാരുള്ളവർപോലും ഭാര്യമാരില്ലാത്തവരെപ്പോലെ ആയിരിക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിശ്ചിതകാലം ഹ്രസ്വമായിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരങ്ങളേ” എന്നു പരിഭാഷപ്പെടുത്തിയ ἀδελφοί എന്നത് ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനമാണ്; സന്ദർഭത്തിൽ സഹവിശ്വാസികളായ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട ഒരു സംഘത്തെ ഇത് അഭിസംബോധന ചെയ്യാം.
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: എന്നാൽ ... ഞാൻ പറയുന്നത് ഇതാണ്
  rationale: പൗലോസ് തുടർന്നുള്ള വിശദീകരണം അവതരിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ വിശ്വാസികളുടെ സമ്മിശ്രസംഘത്തെ അഭിസംബോധന ചെയ്യാനും ഇതിന് കഴിയുമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ καιρός
  choice: സമയം
  rationale: നിർണായകമോ നിശ്ചിതമോ ആയ സമയത്തെ സൂചിപ്പിക്കുന്ന καιρός എന്ന പദം സന്ദർഭം വ്യക്തമാക്കുന്നതിനാൽ ചുരുക്കവും സ്വാഭാവികവുമായ പദം തെരഞ്ഞെടുത്തു.
- source_word: συνεσταλμένος ἐστίν
  choice: ചുരുങ്ങിയിരിക്കുന്നു
  rationale: ചുരുക്കപ്പെട്ടതിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പരിപൂർണകാല പര്യായഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കർത്താവിനെ വ്യക്തമാക്കാത്ത ഗ്രീക്കിന്റെ രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: τὸ λοιπὸν
  choice: ഇനിമുതൽ
  rationale: ശേഷിക്കുന്ന കാലത്തേക്കുള്ള പ്രായോഗിക നിർദേശം ആരംഭിക്കുന്ന കാലസൂചന വ്യക്തമായി നൽകുന്നു.
- source_word: ἵνα
  choice: പ്രത്യേക പദമായി ആവർത്തിക്കാതെ വാക്യബന്ധത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: ചുരുങ്ങിയ സമയവും തുടർന്നുള്ള ജീവിതരീതിയും തമ്മിലുള്ള ഉദ്ദേശ്യ/ഫലബന്ധം മലയാളത്തിലെ വാക്യക്രമവും പൂർണവിരാമത്തിനു ശേഷമുള്ള നിർദേശവും സ്വാഭാവികമായി വഹിക്കുന്നു; ഉദ്ദേശ്യമോ ഫലമോ എന്ന് അതിയായി നിർണയിക്കുന്നില്ല.
- source_word: οἱ ἔχοντες γυναῖκας
  choice: ഭാര്യമാരുള്ളവർ
  rationale: ഇവിടെ γυναῖκας എന്നത് പൊതുവെ സ്ത്രീകളെയല്ല, ഭാര്യമാരെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്ക് പദപ്രയോഗത്തോട് അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: ὡς μὴ ἔχοντες
  choice: ഇല്ലാത്തവരെപ്പോലെ
  rationale: ഭാര്യമാരെ സംബന്ധിച്ച മുൻപത്തെ പരാമർശത്തിലേക്കു തിരിച്ചുചൂണ്ടുന്ന താരതമ്യത്തിന്റെ മൂർച്ച അനാവശ്യ ആവർത്തനമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിവാഹത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ നിർദേശത്തിന്റെ ഇടയശുശ്രൂഷാപരവും ദൈവശാസ്ത്രപരവുമായ ശക്തി
  choice: ഭാര്യമാരുള്ളവർ ഇല്ലാത്തവരെപ്പോലെ ആയിരിക്കണം എന്ന വാക്യം മൃദൂകരിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വിവാഹബന്ധത്തോട് അനാസക്തരായി ജീവിക്കണം’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ നൽകുക, അല്ലെങ്കിൽ വിവാഹബാധ്യതകൾ ഇല്ലാതാക്കുന്നതല്ലെന്ന് മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക.
  rationale: സമയത്തിന്റെ അടിയന്തരതയുടെ പശ്ചാത്തലത്തിൽ സാധാരണ സാമൂഹികാവസ്ഥകളെ ആപേക്ഷികമാക്കുന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കണം. അതിനെ മുഖ്യവാചകത്തിൽ പരിഹരിക്കുന്നത് പരിഭാഷയെ വ്യാഖ്യാനമാക്കി മാറ്റും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ അടിയന്തരതയും വിവാഹത്തെക്കുറിച്ചുള്ള മൂർച്ചയുള്ള താരതമ്യവും വിശദീകരണത്തിലൂടെ മൃദൂകരിക്കാതെ നിലനിർത്തി.
