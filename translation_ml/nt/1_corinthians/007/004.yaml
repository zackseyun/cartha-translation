id: 1CO.7.4
reference: 1 Corinthians 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: ml
  text: ഭാര്യയ്ക്ക് സ്വന്തം ശരീരത്തിന്മേൽ അധികാരമില്ല; ഭർത്താവിനാണ്. അതുപോലെതന്നെ, ഭർത്താവിനും സ്വന്തം ശരീരത്തിന്മേൽ അധികാരമില്ല; ഭാര്യയ്ക്കാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അധികാരം പ്രയോഗിക്കുന്നില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അധികാരം കൈവശംവയ്ക്കുക എന്നോ അത് പ്രയോഗിക്കുക എന്നോ അർഥമാകാം; ഇവിടെ ദാമ്പത്യത്തിലെ അധികാരം പരസ്പരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ഭാര്യ
  rationale: വിവാഹത്തെയും ദാമ്പത്യകടമകളെയും കുറിച്ചുള്ള ഉടനെയുള്ള സന്ദർഭത്തിൽ γυνή എന്നത് വിവാഹിതയായ സ്ത്രീയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀνήρ
  choice: ഭർത്താവ്
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നതിനോട് സമാന്തരമായി വരുന്ന ἀνήρ ഇവിടെ ‘പുരുഷൻ’ എന്ന പൊതുവായ അർഥത്തേക്കാൾ ‘ഭർത്താവ്’ എന്നാണ്.
- source_word: ἰδίου σώματος
  choice: സ്വന്തം ശരീരത്തിന്മേൽ
  rationale: ἴδιος വ്യക്തിക്ക് സ്വന്തമായതിനെ ഊന്നുന്നു; ‘സ്വന്തം ശരീരം’ ഈ ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐξουσιάζει
  choice: അധികാരമില്ല
  rationale: ക്രിയയ്ക്ക് അധികാരം കൈവശംവയ്ക്കുക അല്ലെങ്കിൽ പ്രയോഗിക്കുക എന്ന അർഥമുണ്ട്. ‘അധികാരമില്ല’ മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള ബന്ധപരമായ ശക്തിയും പരസ്പരതയും നിലനിർത്തുന്നു.
- source_word: ἀλλά
  choice: ; …ക്കാണ്
  rationale: മലയാളത്തിൽ ‘അല്ല, മറിച്ച്’ എന്ന ഭാരമുള്ള ഘടനയ്ക്കുപകരം അർധവിരാമവും ‘ആണ്’ എന്ന ഊന്നലും ഉപയോഗിക്കുന്നത് വൈരുധ്യം സ്വാഭാവികമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁμοίως δὲ καὶ
  choice: അതുപോലെതന്നെ
  rationale: രണ്ടാം പ്രസ്താവന ആദ്യത്തേതിന് കൃത്യമായ പരസ്പരസമാന്തരമാണെന്ന ഊന്നൽ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദാമ്പത്യത്തിലെ അധികാരത്തിന്റെ സ്വഭാവം
  choice: ഇരുഭാഗത്തിന്റെയും പരസ്പര അധികാരം ഒരേ സമാന്തരഘടനയിൽ അവതരിപ്പിച്ചു.
  alternative: ‘സ്വന്തം ശരീരം തനിക്കുള്ളതല്ല’ എന്നു ദുർബലമായി പറയുക, അല്ലെങ്കിൽ ഒരാൾ മറ്റെയാളുടെ ശരീരത്തെ നിയന്ത്രിക്കുന്നു എന്നു ശക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഭാര്യയെയും ഭർത്താവിനെയും തുല്യമായ സമാന്തരവാക്യങ്ങളിൽ നിർത്തുന്നു. അതിനാൽ ഏകപക്ഷീയമായ മേൽക്കോയ്മയോ നിർബന്ധമോ ചേർക്കാതെയും ‘അധികാരം’ എന്ന പദത്തിന്റെ ശക്തി കുറയ്ക്കാതെയും പരസ്പരത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ സമാന്തരതയും പരസ്പരതയും നിലനിർത്താൻ രണ്ടു ഭാഗങ്ങളിലും ഒരേ വാക്യഘടന ഉപയോഗിച്ചു.
