review_pass:
  verdict: approve
  source_fidelity: 'The Malayalam accurately renders the reciprocal force of ἐξουσιάζει in both clauses: neither spouse has authority over his or her own body, while the other spouse does. ‘ഭാര്യ’ and ‘ഭർത്താവ്’ correctly reflect γυνή and ἀνήρ in this marital context, and ‘സ്വന്തം ശരീരത്തിന്മേൽ’ preserves the possessive emphasis of ἰδίου σώματος. The ellipsis in ‘ഭർത്താവിനാണ് / ഭാര്യയ്ക്കാണ്’ is clear and faithfully reflects the Greek’s concise contrasted predicates.'
  naturalness: The wording is natural, clear modern standard Malayalam. The paired clauses and ‘അതുപോലെതന്നെ’ effectively preserve the source’s deliberate reciprocal parallelism. The semicolon-based elliptical phrasing is idiomatic and avoids needless repetition.
  terminology: ‘അധികാരം’ is an appropriate, suitably restrained equivalent for ἐξουσιάζει. It conveys authority without adding ideas of coercion, ownership, or unilateral domination. The footnote accurately identifies ‘അധികാരം പ്രയോഗിക്കുന്നില്ല’ as a possible lexical rendering and explains the reciprocal marital sense.
