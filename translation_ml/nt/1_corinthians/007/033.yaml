translation:
  language: ml
  text: എന്നാൽ വിവാഹിതനായ പുരുഷൻ ലോകകാര്യങ്ങളെക്കുറിച്ചും തന്റെ ഭാര്യയെ എങ്ങനെ പ്രസാദിപ്പിക്കാമെന്നതിനെക്കുറിച്ചും ശ്രദ്ധിക്കുന്നു,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ലോകത്തിലെ കാര്യങ്ങളെക്കുറിച്ച്’ അല്ലെങ്കിൽ ‘ലോകത്തിന്റെ ഇടപാടുകളെക്കുറിച്ച്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ γαμήσας
  choice: എന്നാൽ വിവാഹിതനായ പുരുഷൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ ഭൂതകാല കൃദന്തം ഇവിടെ നാമപദമായി പ്രവർത്തിച്ച്, മുൻസന്ദർഭത്തിലെ അവിവാഹിതനായ പുരുഷനോടു വിരുദ്ധമായി വിവാഹിതനായ പുരുഷനെ സൂചിപ്പിക്കുന്നു. ആൺലിംഗ ഏകവചനബലം നിലനിർത്തുന്നു.
- source_word: μεριμνᾷ
  choice: ചിന്തിക്കുന്നു
  rationale: ക്രിയയ്ക്ക് ഉത്കണ്ഠപ്പെടുക, കരുതൽ കാണിക്കുക, ശ്രദ്ധവെക്കുക എന്നീ അർത്ഥവ്യാപ്തിയുണ്ട്. ഇവിടെ നിർബന്ധമായും പാപകരമായ ഉത്കണ്ഠയല്ല, വിവാഹജീവിതവുമായി ബന്ധപ്പെട്ട ശ്രദ്ധയും പരിഗണനയുമാണ്; അതിനാൽ സ്വാഭാവികവും അമിതവ്യാഖ്യാനമില്ലാത്തതുമായ ‘ചിന്തിക്കുന്നു’ തെരഞ്ഞെടുത്തു.
- source_word: τὰ τοῦ κόσμου
  choice: ലോകകാര്യങ്ങളെക്കുറിച്ച്
  rationale: സാധാരണ ലോകജീവിതവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘ലോകകാര്യങ്ങൾ’ എന്നത് അവയെ ധാർമ്മികമായി ദുഷിച്ചതായി ചിത്രീകരിക്കാതെ ഗ്രീക്കിലെ ബഹുവചന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πῶς ἀρέσῃ
  choice: എങ്ങനെ പ്രസാദിപ്പിക്കാം
  rationale: πῶς സഹിതമുള്ള വിധിലിംഗ ക്രിയ അവന്റെ ചിന്തയുടെ ഉള്ളടക്കം—ഭാര്യയെ പ്രസാദിപ്പിക്കാനുള്ള വിധം—വ്യക്തമാക്കുന്നു. ‘എങ്ങനെ പ്രസാദിപ്പിക്കാം’ ആലോചനാത്മക ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τῇ γυναικί
  choice: തന്റെ ഭാര്യയെ
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή വ്യക്തമായി ‘ഭാര്യ’ എന്നാണ്. ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം വ്യക്തമല്ലെങ്കിലും മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമാക്കാൻ ‘തന്റെ’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: κόσμος എന്നതിന് ഇവിടെ ധാർമ്മികമായി നിഷേധാത്മകമായ അർത്ഥം നൽകണമോ
  choice: ധാർമ്മിക കുറ്റപ്പെടുത്തൽ സൂചിപ്പിക്കാതെ ‘ലോകകാര്യങ്ങൾ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘ലൗകിക കാര്യങ്ങൾ’ എന്നിങ്ങനെ നിഷേധാത്മക ഛായയോടെ വിവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭത്തിൽ പൗലോസ് വിവാഹത്തെയോ സാധാരണ കുടുംബബാധ്യതകളെയോ അപലപിക്കുന്നില്ല; കർത്താവിനോടുള്ള അവിഭക്ത ശ്രദ്ധയും വിവാഹജീവിതത്തിലെ പ്രായോഗിക പരിഗണനകളും തമ്മിലുള്ള വ്യത്യാസമാണ് അവതരിപ്പിക്കുന്നത്. നിഷ്പക്ഷ പ്രയോഗം ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ ആശയബന്ധം വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
