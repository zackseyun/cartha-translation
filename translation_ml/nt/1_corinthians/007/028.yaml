id: 1CO.7.28
reference: 1 Corinthians 7:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: ml
  text: എന്നാൽ നീ വിവാഹം കഴിച്ചാലും പാപം ചെയ്തിട്ടില്ല; കന്യക വിവാഹം കഴിച്ചാലും അവൾ പാപം ചെയ്തിട്ടില്ല. എങ്കിലും അങ്ങനെയുള്ളവർക്ക് ജഡത്തിൽ കഷ്ടത ഉണ്ടാകും[a]. എന്നാൽ നിങ്ങളെ ഒഴിവാക്കാനാണ് എന്റെ ഉദ്ദേശ്യം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജഡത്തിൽ ദുരിതം/ക്ലേശം ഉണ്ടാകും.’ ഇവിടെ ‘ജഡത്തിൽ’ എന്നത് പ്രത്യേകിച്ച് ‘പാപസ്വഭാവത്തിൽ’ എന്നല്ല, വിവാഹത്തോടനുബന്ധിച്ച ഈ ലോകജീവിതത്തിലെ അല്ലെങ്കിൽ ശരീരബന്ധിതമായ കഷ്ടതകളെയാണ് സാധ്യതയേറിയവിധം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞാൻ നിങ്ങളെ ഒഴിവാക്കുന്നു’ അല്ലെങ്കിൽ ‘ഞാൻ നിങ്ങളെ ഒഴിവാക്കാൻ ആഗ്രഹിക്കുന്നു.’ ഇത്തരം കഷ്ടതയെക്കുറിച്ച് മുന്നറിയിപ്പ് നൽകുന്നതിലുള്ള തന്റെ കരുതലാണ് പൗലോസ് അറിയിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: നീ വിവാഹം കഴിച്ചാലും
  rationale: ἐάν സഹിതമുള്ള aorist subjunctive ഭാവിസാധ്യതയുള്ള നിബന്ധനയാണ്; മലയാളത്തിൽ ‘വിവാഹം കഴിച്ചാലും’ അതിന്റെ concessive force സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἥμαρτες
  choice: പാപം ചെയ്തിട്ടില്ല
  rationale: വിവാഹം എന്ന പ്രവൃത്തി പാപമല്ലെന്ന ധാർമിക വിലയിരുത്തൽ മലയാളത്തിലെ perfect രൂപം വ്യക്തമായി നൽകുന്നു.
- source_word: ἡ παρθένος
  choice: കന്യക
  rationale: παρθένος എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘അവിവാഹിതയായ സ്ത്രീ’ എന്നു പൊതുവാക്കുന്നില്ല.
- source_word: γήμῃ
  choice: വിവാഹം കഴിച്ചാലും
  rationale: ആദ്യ ഉപവാക്യത്തോടുള്ള സമാന്തരതയും നിബന്ധനാഭാവവും നിലനിർത്തുന്നു.
- source_word: θλῖψιν
  choice: കഷ്ടത
  rationale: സമ്മർദം, ദുരിതം, ക്ലേശം എന്നീ അർഥപരിധി ഉൾക്കൊള്ളുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം; ഇവിടെ പ്രത്യേകമായി അന്ത്യകാല ‘മഹാകഷ്ടത’ എന്ന അർഥം നിർബന്ധിക്കുന്നില്ല.
- source_word: τῇ σαρκὶ
  choice: ജഡത്തിൽ
  rationale: σάρξ എന്ന ഉറവിടരൂപം സംരക്ഷിക്കുകയും അതിനെ ‘പാപസ്വഭാവം’ എന്ന് വ്യാഖ്യാനിച്ചുറപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു; ഉദ്ദേശിച്ചിരിക്കുന്ന ശരീരബന്ധിതമോ ഭൗമികമോ ആയ ജീവിതസാഹചര്യങ്ങൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ τοιοῦτοι
  choice: അങ്ങനെയുള്ളവർ
  rationale: വിവാഹം ചെയ്യുന്നവരെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുമ്പോഴും ഗ്രീക്കിലെ പൊതുവായ പരാമർശം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: φείδομαι
  choice: ഞാനാകട്ടെ നിങ്ങളെ അതിൽനിന്ന് ഒഴിവാക്കുകയാണ്
  rationale: ‘spare’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അതിൽനിന്ന്’ മുമ്പ് പറഞ്ഞ കഷ്ടതയെ സൂചിപ്പിക്കുന്നു. വർത്തമാനകാലരൂപം ഗ്രീക്കിലെ present-നോട് ചേർന്നുനിൽക്കുന്നു.
theological_decisions:
- issue: τῇ σαρκί എന്നതിലെ σάρξ-ന്റെ അർഥം
  choice: ‘ജഡത്തിൽ’ എന്ന് നിലനിർത്തി, ശരീരബന്ധിതമോ ഈ ലോകജീവിതത്തിലേതോ ആയ കഷ്ടത എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: ‘പാപസ്വഭാവത്തിൽ’ അല്ലെങ്കിൽ വ്യാഖ്യാനാത്മകമായി ‘ഈ ജീവിതത്തിൽ’
  rationale: ഇവിടെ പൗലോസ് മനുഷ്യന്റെ പാപസ്വഭാവത്തെക്കുറിച്ച് സിദ്ധാന്തപ്രസ്താവന നടത്തുന്നതല്ല; വിവാഹത്തോടനുബന്ധിച്ച ജീവിതകഷ്ടതയെക്കുറിച്ചാണ് മുന്നറിയിപ്പ്. അതേസമയം ‘ജഡം’ എന്ന പദത്തിന്റെ യഥാർഥ രൂപവും അർഥവ്യാപ്തിയും പ്രധാനവാക്യത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: φείδομαι എന്നതിലെ പൗലോസിന്റെ ഉദ്ദേശ്യം
  choice: ‘നിങ്ങളെ അതിൽനിന്ന് ഒഴിവാക്കുകയാണ്’
  alternative: ‘നിങ്ങളെ ഒഴിവാക്കാൻ ആഗ്രഹിക്കുന്നു’ അല്ലെങ്കിൽ ‘നിങ്ങളെ ഒഴിവാക്കാൻ ശ്രമിക്കുന്നു’
  rationale: ഗ്രീക്ക് വർത്തമാനരൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; ആഗ്രഹമോ ശ്രമമോ എന്ന അധിക സൂക്ഷ്മഭാവം നിർബന്ധമായി ചേർക്കുന്നില്ല. സന്ദർഭത്തിലെ ഇടയപരമായ കരുതൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കന്യക’, ‘ജഡത്തിൽ’ എന്നീ ഉറവിടസാന്നിധ്യമുള്ള പദങ്ങൾ അർഥം അനാവശ്യമായി പൊതുവാക്കാതിരിക്കാൻ നിലനിർത്തി; അപരിചിതത്വവും തെറ്റായ ദൈവശാസ്ത്രവായനയും കുറയ്ക്കാൻ അടിക്കുറിപ്പുകൾ ചേർത്തു.
