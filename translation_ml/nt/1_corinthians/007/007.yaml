id: 1CO.7.7
reference: 1 Corinthians 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: ml
  text: എന്നാൽ എല്ലാവരും എന്നെപ്പോലെ ആയിരിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്. എങ്കിലും ഓരോരുത്തർക്കും ദൈവത്തിൽനിന്ന് താന്താന്റെ കൃപാവരം ഉണ്ട്—ഒരാൾക്ക് ഒരു തരത്തിൽ, മറ്റൊരാൾക്ക് മറ്റൊരു തരത്തിൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: വക്താവിന്റെ വ്യക്തിപരമായ ആഗ്രഹം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντας ἀνθρώπους
  choice: എല്ലാ മനുഷ്യരും
  rationale: ἀνθρώπους എന്ന പൊതുവായ മനുഷ്യസൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ പുരുഷന്മാരെ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നതായി ചുരുക്കുന്നില്ല.
- source_word: ὡς καὶ ἐμαυτόν
  choice: എന്നെപ്പോലെ
  rationale: പൗലോസ് തന്റെ നിലവിലെ അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; ആ അവസ്ഥയുടെ കൃത്യസ്വഭാവം വാക്യം തന്നെ നിർവചിക്കാത്തതിനാൽ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: χάρισμα
  choice: കൃപാവരം
  rationale: ദൈവം കൃപയാൽ നൽകുന്ന പ്രത്യേക വരം എന്ന പൗലോസീയ ആശയം പകർത്തുന്ന പരിചിതമായ മലയാള പദം.
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: ഒരാൾക്ക് ഒരുവിധത്തിലും മറ്റൊരാൾക്ക് മറ്റൊരു വിധത്തിലും
  rationale: വരങ്ങളുടെ വ്യത്യാസം സൂചിപ്പിക്കുന്ന സമാന്തരവും ഉദ്ദേശപൂർവം പൊതുവുമായ പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിനെപ്പോലെ ആയിരിക്കുക എന്നതിന്റെ അർഥം
  choice: എന്നെപ്പോലെ
  alternative: എന്നെപ്പോലെ അവിവാഹിതനായിരിക്കുക
  rationale: സമീപസന്ദർഭം അവിവാഹിതാവസ്ഥയെ സൂചിപ്പിച്ചേക്കാമെങ്കിലും, ഗ്രീക്ക് വാക്യം അത് ഇവിടെ തുറന്നുപറയുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ സൂചനയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും നിലനിർത്തുന്നു.
- issue: ഓരോരുത്തന്റെയും ദൈവദത്ത വരം
  choice: ഓരോരുത്തനും ദൈവത്തിൽനിന്ന് അവനവന്റെ കൃപാവരം ലഭിച്ചിട്ടുണ്ട്
  alternative: ഓരോരുത്തനും ദൈവത്തിൽനിന്ന് സ്വന്തം ആത്മീയവരം ലഭിച്ചിട്ടുണ്ട്
  rationale: χάρισμα എന്നത് ദൈവദത്തമായ വരമാണെന്ന് വ്യക്തമാക്കുമ്പോഴും അതിനെ പ്രത്യേക വിഭാഗത്തിലുള്ള ‘ആത്മീയവരം’ എന്നു പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എല്ലാ മനുഷ്യരും’ എന്നത് മൂലത്തിലെ പൊതുവായ ἀνθρώπους-നെ പ്രതിഫലിപ്പിക്കുന്നു. വാക്യത്തിന്റെ അവസാനഭാഗത്തിലെ ഉദ്ദേശപൂർവമായ പൊതുസ്വഭാവം വിശദീകരിച്ച് ചുരുക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
