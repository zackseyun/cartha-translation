revisions:
- from: എന്നാൽ എല്ലാ മനുഷ്യരും എന്നെപ്പോലെ ആയിരിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്. എങ്കിലും ഓരോരുത്തനും ദൈവത്തിൽനിന്ന് അവനവന്റെ കൃപാവരം ലഭിച്ചിട്ടുണ്ട്—ഒരാൾക്ക് ഒരുവിധത്തിലും മറ്റൊരാൾക്ക് മറ്റൊരു വിധത്തിലും.
  to: എന്നാൽ എല്ലാവരും എന്നെപ്പോലെ ആയിരിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്. എങ്കിലും ഓരോരുത്തർക്കും ദൈവത്തിൽനിന്ന് താന്താന്റെ കൃപാവരം ഉണ്ട്—ഒരാൾക്ക് ഒരു തരത്തിൽ, മറ്റൊരാൾക്ക് മറ്റൊരു തരത്തിൽ.
  rationale: The revision replaces the completed-reception sense with a present-possession construction corresponding to ἔχει, improves idiomatic Malayalam for the generic plural, and preserves the source text's deliberate lack of specification regarding both Paul's state and the differing gifts.
