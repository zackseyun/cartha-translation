id: 1CO.7.3
reference: 1 Corinthians 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ γυναικὶ ὁ ἀνὴρ τὴν ⸀ὀφειλὴν ἀποδιδότω, ὁμοίως δὲ καὶ ἡ γυνὴ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/003.yaml
  text: The husband must give to his wife her marital duty, and likewise the wife to her husband.
translation:
  language: ml
  text: ഭർത്താവ് ഭാര്യയോടുള്ള തന്റെ ദാമ്പത്യബാധ്യത നിറവേറ്റട്ടെ[a]; അതുപോലെതന്നെ ഭാര്യയും ഭർത്താവിനോടുള്ള തന്റെ ദാമ്പത്യബാധ്യത നിറവേറ്റട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭാര്യയ്ക്ക് നൽകേണ്ടത്.’ അക്ഷരാർഥത്തിൽ, ‘കടം/ബാധ്യത.’ ഈ സന്ദർഭത്തിൽ ഇത് ദമ്പതികൾ പരസ്പരം നിറവേറ്റേണ്ട ദാമ്പത്യബന്ധത്തിലെ ബാധ്യതയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί / γυνή
  choice: ഭാര്യയ്ക്ക് / ഭാര്യ
  rationale: വിവാഹത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ γυνή പൊതുവായി ‘സ്ത്രീ’ എന്നല്ല, ‘ഭാര്യ’ എന്നാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀνήρ / ἀνδρί
  choice: ഭർത്താവ് / ഭർത്താവിന്
  rationale: γυνήയോടുള്ള സമാന്തരപ്രയോഗവും വിവാഹസന്ദർഭവും കണക്കിലെടുത്ത് ‘പുരുഷൻ’ എന്നതിനെക്കാൾ ‘ഭർത്താവ്’ യോജിക്കുന്നു.
- source_word: ὀφειλήν
  choice: അവൾക്കു ലഭിക്കേണ്ട ദാമ്പത്യകടമ
  rationale: ὀφειλήയുടെ അടിസ്ഥാനാർഥം ‘കടം/ബാധ്യത’ എന്നാണ്. ഇവിടെ പരിസരം ദാമ്പത്യബന്ധത്തിലെ പരസ്പര ബാധ്യതയെ സൂചിപ്പിക്കുന്നതിനാൽ, ‘ലഭിക്കേണ്ട’ എന്ന ഘടകം കടപ്പാടിന്റെ ആശയവും ‘ദാമ്പത്യകടമ’ സന്ദർഭാർഥവും നിലനിർത്തുന്നു.
- source_word: ἀποδιδότω
  choice: നിറവേറ്റിക്കൊടുക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ തുടർച്ചയായ ബാധ്യതയും ἀποδίδωμι എന്ന പദത്തിലെ ‘കടപ്പെട്ടത് നൽകുക/നിറവേറ്റുക’ എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὁμοίως δὲ καὶ
  choice: അതുപോലെതന്നെ …യും
  rationale: ഭർത്താവിന്റെയും ഭാര്യയുടെയും ബാധ്യത തുല്യവും പരസ്പരവുമാണെന്ന സമാന്തരത വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὀφειλή സൂചിപ്പിക്കുന്ന ദാമ്പത്യബാധ്യത എത്ര വ്യക്തമായി പരിഭാഷപ്പെടുത്തണം
  choice: പ്രധാനവാചകത്തിൽ ‘അവൾക്കു ലഭിക്കേണ്ട ദാമ്പത്യകടമ’ ഉപയോഗിച്ചു.
  alternative: ‘അവൾക്കു ലഭിക്കേണ്ടത്’ അല്ലെങ്കിൽ ‘കടപ്പെട്ട ബാധ്യത’
  rationale: സന്ദർഭം ദാമ്പത്യത്തിലെ ലൈംഗിക/സംയോഗബന്ധിയായ പരസ്പര ബാധ്യതയെ സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും, നാമപദം സ്വതവേ കൂടുതൽ വിശാലമാണ്. തെരഞ്ഞെടുത്ത പ്രയോഗം സന്ദർഭം വ്യക്തമാക്കുകയും മൂലപദത്തിലെ കടപ്പാടിന്റെ ആശയം നിലനിർത്തുകയും അനാവശ്യമായി കൂടുതൽ നിർവചിക്കുന്നത് ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിറവേറ്റിക്കൊടുക്കട്ടെ’ എന്നത് ആജ്ഞയുടെ ഗൗരവവും പരസ്പര ബാധ്യതയും അറിയിക്കുന്നു; വാക്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തിയിരിക്കുന്നു.
