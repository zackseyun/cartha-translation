    rationale: Modern standard Malayalam more naturally asks 'ബന്ധിക്കപ്പെട്ടിട്ടുണ്ടോ?' and 'മോചിതനായിട്ടുണ്ടോ?' than using the continuous-looking forms 'ബന്ധിക്കപ്പെട്ടിരിക്കുന്നുവോ?' and 'മോചിതനായിരിക്കുന്നുവോ?'. This is a stylistic improvement, not a change in meaning.
