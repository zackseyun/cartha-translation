id: 1CO.7.27
reference: 1 Corinthians 7:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δέδεσαι γυναικί; μὴ ζήτει λύσιν· λέλυσαι ἀπὸ γυναικός; μὴ ζήτει γυναῖκα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: ml
  text: നീ ഭാര്യയോടു ബന്ധിക്കപ്പെട്ടിട്ടുണ്ടോ? മോചനം തേടരുത്.[a] ഭാര്യയിൽനിന്ന് മോചിതനായിട്ടുണ്ടോ? ഭാര്യയെ തേടരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനപരമായി: “നീ വിവാഹിതനാണോ? വിവാഹമോചനം തേടരുത്. നീ വിവാഹമോചിതനാണോ? ഭാര്യയെ തേടരുത്.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി “ബന്ധിക്കപ്പെട്ടിരിക്കുക,” “മോചിതനായിരിക്കുക” എന്നാണ് പറയുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: ബന്ധിക്കപ്പെട്ടിരിക്കുന്നുവോ
  rationale: പൂർണ്ണകാല ക്രിയയുടെ ഫലമായി തുടരുന്ന അവസ്ഥയും ‘ബന്ധിക്കുക’ എന്ന രൂപകവും നിലനിർത്തുന്നു; തുടർന്നുള്ള λύσιν/λέλυσαι എന്ന ‘മോചനം’ പ്രയോഗത്തോടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: γυναικί
  choice: ഭാര്യയോടു
  rationale: വിവാഹസന്ദർഭത്തിൽ γυνή എന്നത് സാധാരണ സ്ത്രീയെയല്ല, ഭാര്യയെയാണ് സൂചിപ്പിക്കുന്നത്; ദത്തിവിഭക്തിയുടെ ബന്ധം ‘-യോടു’ വഴി സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ζήτει
  choice: തേടരുത്
  rationale: ζητέωയുടെ അന്വേഷിക്കുക/ലക്ഷ്യമാക്കുക എന്ന അർഥവും നിഷേധാത്മക ആജ്ഞയുടെ ബലവും ലളിതമായി നിലനിർത്തുന്നു.
- source_word: λύσιν
  choice: മോചനം
  rationale: ‘അഴിക്കൽ, വിടുതൽ’ എന്ന അർഥം നൽകുകയും λέλυσαιയുമായുള്ള പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു; ‘വിവാഹമോചനം’ എന്നു പറഞ്ഞ് ഗ്രീക്കിനേക്കാൾ അർഥം ചുരുക്കുന്നില്ല.
- source_word: λέλυσαι
  choice: മോചിതനായിരിക്കുന്നുവോ
  rationale: പൂർണ്ണകാലത്തിൽ സൂചിപ്പിക്കുന്ന നിലവിലുള്ള അവസ്ഥയും λύσιν എന്ന നാമവുമായുള്ള ബന്ധവും നിലനിർത്തുന്നു; വിവാഹമോചനം, വേർപാട്, വിധവാവസ്ഥ എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല.
- source_word: ἀπὸ γυναικός
  choice: ഭാര്യയിൽനിന്നു
  rationale: ἀπόയുടെ വേർപാടിന്റെ അർഥം ‘-യിൽനിന്നു’ കൊണ്ടും വിവാഹസന്ദർഭത്തിലുള്ള γυνήയുടെ അർഥം ‘ഭാര്യ’ കൊണ്ടും വ്യക്തമാക്കുന്നു.
- source_word: γυναῖκα
  choice: ഭാര്യയെ
  rationale: അവസാന വിലക്കിന്റെ വിവാഹസന്ദർഭത്തിൽ ‘സ്ത്രീയെ’ എന്നതിനെക്കാൾ ‘ഭാര്യയെ’ കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: വാക്യം ‘വിവാഹിതൻ/വിവാഹമോചിതൻ’ എന്ന വ്യക്തമായ നിയമപരമായ പദങ്ങളിലാണോ, അതോ പൗലോസിന്റെ ബന്ധനം/മോചനം എന്ന രൂപകത്തിലാണോ പരിഭാഷപ്പെടുത്തേണ്ടത്?
  choice: മുഖ്യവാചകത്തിൽ ‘ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു/മോചനം/മോചിതനായിരിക്കുന്നു’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘നീ വിവാഹിതനാണോ? വിവാഹമോചനം തേടരുത്. നീ വിവാഹമോചിതനാണോ? ഭാര്യയെ തേടരുത്.’
  rationale: ഗ്രീക്ക് വാചകം വിവാഹം/വിവാഹമോചനം എന്ന കൂടുതൽ വ്യക്തമായ പദാവലിയല്ല, δέω/λύω എന്ന ബന്ധനം–അഴിക്കൽ ഭാഷയാണ് ഉപയോഗിക്കുന്നത്. രൂപകം നിലനിർത്തുന്നത് വാചകത്തോട് സുതാര്യമാണ്; അർഥത്തെ ഒരു നിയമപരമായ സാഹചര്യത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ബന്ധനം–മോചനം എന്ന സമാന്തര രൂപകം സംരക്ഷിക്കുമ്പോഴും വിവാഹസന്ദർഭം ‘ഭാര്യ’ എന്ന പദത്തിലൂടെ വ്യക്തമാക്കുന്നു. പുരുഷ അഭിസംബോധന സന്ദർഭാനുസൃതമായി നിലനിർത്തിയിരിക്കുന്നു.
