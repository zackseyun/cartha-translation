    issue: The explanatory particle γάρ is omitted.
    rationale: γάρ grounds or explains the preceding statement. Although Malayalam can sometimes express this relation implicitly, no grammatical feature in the current standalone verse carries it. Initial ‘എന്തെന്നാൽ’ preserves the source connection without altering the sense.
