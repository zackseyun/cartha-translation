id: 1CO.3.11
reference: 1 Corinthians 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇതിനകം ഇട്ടിരിക്കുന്ന അടിത്തറയല്ലാതെ മറ്റൊരടിത്തറ ഇടാൻ ആർക്കും കഴിയില്ല; ആ അടിത്തറ യേശു മശീഹയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “യേശുക്രിസ്തു.”'
    reason: Χριστός എന്ന പദവിയുടെ പരമ്പരാഗത ലിപ്യന്തരരൂപം.
lexical_decisions:
- source_word: θεμέλιον
  choice: അടിത്തറ
  rationale: കെട്ടിടനിർമാണത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ രൂപകത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപദം.
- source_word: γὰρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ പ്രകടിപ്പിച്ചു
  rationale: γάρ മുൻവാക്യത്തിനുള്ള കാരണം/വിശദീകരണം നൽകുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ഒഴിവാക്കി ബന്ധം വാക്യഘടനയിൽ നിലനിർത്തി.
- source_word: ἄλλον
  choice: മറ്റൊരു
  rationale: നിലവിലുള്ളതിനു പുറമേ വേറൊരു അടിത്തറ എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: οὐδεὶς δύναται θεῖναι
  choice: ഇടാൻ ആർക്കും കഴിയില്ല
  rationale: കഴിവിനെയോ സാധ്യതയെയോ പൂർണമായി നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: παρὰ τὸν κείμενον
  choice: ഇതിനകം ഇട്ടിരിക്കുന്ന ... അല്ലാതെ
  rationale: παράയുടെ ഒഴിവാക്കൽഭാവവും κείμενον സൂചിപ്പിക്കുന്ന നിലവിൽ സ്ഥാപിക്കപ്പെട്ട അവസ്ഥയും സംരക്ഷിക്കുന്നു.
- source_word: ὅς ἐστιν
  choice: ആ അടിത്തറ ... ആണ്
  rationale: ബന്ധസർവനാമത്തിന്റെ പൂർവ്വപദമായ ‘അടിത്തറ’ വീണ്ടും പറഞ്ഞ് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി തിരിച്ചറിയിക്കൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦς Χριστός
  choice: യേശു മശീഹ
  rationale: Ἰησοῦς എന്ന പേര് ലിപ്യന്തരം ചെയ്യുകയും Χριστός എന്ന അഭിഷിക്തപദവി ‘മശീഹ’യായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിനെ ഏക അടിത്തറയായി തിരിച്ചറിയിക്കുന്ന പദവിയായതിനാൽ അതിന്റെ ‘മശീഹ’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തി; സഭാപാരമ്പര്യത്തിൽ സുപരിചിതമായ ലിപ്യന്തരരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: അടിത്തറയും യേശുവും തമ്മിലുള്ള തിരിച്ചറിയിക്കൽ
  choice: ആ അടിത്തറ യേശു മശീഹയാണ്
  alternative: അത് യേശു മശീഹയാണ്
  rationale: ὅς എന്ന ബന്ധസർവനാമം θεμέλιον എന്ന പദത്തിലേക്കാണ് മടങ്ങുന്നത്; രൂപകത്തെ വ്യക്തമായി നിലനിർത്താൻ ‘അടിത്തറ’ ആവർത്തിച്ചു, അതിന്റെ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയിക്കൽ ലഘൂകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘അടിസ്ഥാനം’ എന്ന അമൂർത്തസാധ്യതയ്ക്കു പകരം നിർമ്മാണരൂപകം തെളിഞ്ഞുനിൽക്കാൻ ‘അടിത്തറ’ ഉപയോഗിച്ചു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട വാചകത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
