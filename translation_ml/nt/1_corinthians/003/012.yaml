id: 1CO.3.12
reference: 1 Corinthians 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: ml
  text: ആരെങ്കിലും ആ അടിത്തറമേൽ സ്വർണം, വെള്ളി, വിലയേറിയ കല്ലുകൾ, മരം, ഉണങ്ങിയ പുല്ല്, വൈക്കോൽ എന്നിവകൊണ്ട് പണിയുന്നെങ്കിൽ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: ആരെങ്കിലും … പണിയുന്നെങ്കിൽ
  rationale: εἰ എന്ന വ്യവസ്ഥയും τις എന്ന അനിശ്ചിതവും പൊതുവായ വ്യക്തിസൂചനയും സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാവാക്യത്തിൽ നിലനിർത്തുന്നു. δέ ഇവിടെ ശക്തമായ വിരോധമല്ലാത്തതിനാൽ പ്രത്യേകമായ ‘എന്നാൽ’ ചേർത്ത് ബന്ധത്തെ കടുപ്പിക്കുന്നില്ല.
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: ആ അടിത്തറമേൽ … പണിയുന്നു
  rationale: നിലവിലുള്ള അടിത്തറയ്ക്കുമേൽ തുടർന്നു പണിയുക എന്ന നിർമ്മാണരൂപകം വ്യക്തമായി സൂക്ഷിക്കുന്നു; നിർദ്ദിഷ്ട ആർട്ടിക്കിളിന്റെ സന്ദർഭസൂചന ‘ആ’ വഴി പ്രകടമാക്കുന്നു.
- source_word: χρυσόν, ἄργυρον
  choice: സ്വർണം, വെള്ളി
  rationale: നിർമാണസാമഗ്രികളുടെ പട്ടികയിലെ നേരിട്ടുള്ള വസ്തുനാമങ്ങൾ.
- source_word: λίθους τιμίους
  choice: വിലയേറിയ കല്ലുകൾ
  rationale: τιμίους എന്നത് വിലയേറിയതോ വിലമതിക്കപ്പെട്ടതോ ആയ കല്ലുകളെ സൂചിപ്പിക്കുന്നു; ‘രത്നങ്ങൾ’ എന്നു ചുരുക്കി അർത്ഥപരിധി കുറയ്ക്കുന്നില്ല.
- source_word: ξύλα
  choice: മരം
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ദ്രവ്യനാമം ഉപയോഗിച്ച് നിർമ്മാണസാമഗ്രിയെ സൂചിപ്പിക്കുന്നു.
- source_word: χόρτον
  choice: ഉണങ്ങിയ പുല്ല്
  rationale: ഈ നിർമ്മാണസാമഗ്രിപ്പട്ടികയിൽ സാധാരണ പച്ചപ്പുല്ലിനെക്കാൾ ‘hay’ എന്ന അർത്ഥം പ്രസക്തമാണ്; ‘ഉണങ്ങിയ പുല്ല്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
- source_word: καλάμην
  choice: വൈക്കോൽ
  rationale: തണ്ടോ കൊയ്ത്തിനുശേഷമുള്ള ഉണങ്ങിയ താളടിയോ എന്ന പദത്തിന്റെ സന്ദർഭാർഥം, നിർമ്മാണത്തിനുപയോഗിക്കുന്ന താഴ്ന്ന നിലവാരമുള്ള സസ്യസാമഗ്രിയായി സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർമ്മാണഭാഷ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ പട്ടികാക്രമവും വ്യവസ്ഥാവാക്യത്തിന്റെ അപൂർണത സൂചിപ്പിക്കുന്ന അവസാന കോമയും നിലനിർത്തി; അടുത്ത വാക്യത്തിലാണ് വ്യവസ്ഥയുടെ ഫലം വരുന്നത്.
