  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε μηδεὶς καυχάσθω ἐν ἀνθρώποις· πάντα γὰρ ὑμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/021.yaml
  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: ml
  text: അതുകൊണ്ട് ആരും മനുഷ്യരിൽ[a] അഭിമാനം കൊള്ളരുത്; കാരണം, സകലവും നിങ്ങളുടേതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തിൽ, ‘മനുഷ്യനേതാക്കളിൽ’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: μηδεὶς
  choice: ആരും ... അരുത്
  rationale: എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ നിരോധനം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καυχάσθω
  choice: അഭിമാനം കൊള്ളരുത്
  rationale: വീമ്പുപറയുക, അഭിമാനിക്കുക എന്നീ അർഥവ്യാപ്തി നിലനിർത്തിക്കൊണ്ട് സന്ദർഭത്തിന് യോജിച്ച ഗൗരവമുള്ള പ്രയോഗം നൽകുന്നു.
- source_word: ἐν ἀνθρώποις
  choice: മനുഷ്യരിൽ
  rationale: പ്രശംസയുടെയോ അഭിമാനത്തിന്റെയോ ആധാരം/മേഖല എന്ന ഗ്രീക്ക് ഘടന സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ἀνθρώποις പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രതയും പൗലോസിന്റെ വിപുലമായ വാക്ചാതുര്യവും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻനിരോധനത്തിനുള്ള കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὑμῶν ἐστιν
  choice: നിങ്ങളുടേതാണ്
  rationale: ഉടമസ്ഥതയെ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀνθρώποις എന്നതിന്റെ സന്ദർഭോചിത പരിധി
  choice: പ്രധാനവാചകത്തിൽ വിശാലമായ ‘മനുഷ്യരിൽ’ നിലനിർത്തി
  alternative: ‘മനുഷ്യനേതാക്കളിൽ’ അല്ലെങ്കിൽ ‘മനുഷ്യനേതാക്കളെക്കുറിച്ച്’
  rationale: അടുത്തുള്ള സന്ദർഭം അപ്പൊല്ലോസ്, പൗലോസ്, കേഫാസ് തുടങ്ങിയ നേതാക്കളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്ക് പദം വിശാലമാണ്; അതിനാൽ വ്യാഖ്യാനപരമായ ചുരുക്കം മുഖ്യവാചകത്തിൽ വരുത്താതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ നിഗമനം, നിരോധനം, കാരണം എന്നീ ഘടകങ്ങൾ തുറന്നുവെച്ചിരിക്കുന്നു.
