reference: 1 Corinthians 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: ml
  text: ഓരോരുത്തന്റെയും പ്രവൃത്തി വെളിവാകും; ആ ദിവസം[b] അത് വ്യക്തമാക്കും. കാരണം, ആ ദിവസം അഗ്നിയിൽ[a] വെളിപ്പെടുന്നു; ഓരോരുത്തന്റെയും പ്രവൃത്തി എങ്ങനെയുള്ളതാണെന്ന് അഗ്നി തന്നേ പരിശോധിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അഗ്നിയാൽ’. ἐν πυρί എന്ന ഗ്രീക്ക് പ്രയോഗം ‘അഗ്നിയിൽ’ എന്നോ, ഉപകരണാർഥത്തിൽ ‘അഗ്നിയാൽ’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ആ ദിവസം’ എന്നത് ഭാവിയിലെ ദൈവിക വിലയിരുത്തലിന്റെയോ ന്യായവിധിയുടെയോ ദിവസത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἑκάστου
  choice: ഓരോരുത്തന്റെയും
  rationale: വിതരണാർഥമുള്ള ഏകവചന ഷഷ്ഠീവിഭക്തിയുടെ വ്യക്തിവൽക്കരണശക്തി ലിംഗസൂചന ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ ἔργον
  choice: പ്രവൃത്തി
  rationale: ഇവിടെ ഓരോ പണിക്കാരനും നിർവഹിച്ച ശുശ്രൂഷയെയോ അതിന്റെ ഫലത്തെയോ വിശാലമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദമാണ്.
- source_word: φανερὸν γενήσεται
  choice: വെളിവാകും
  rationale: ഭാവിയിൽ പരസ്യമായി അറിയപ്പെടുന്ന ഫലത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ ἡμέρα
  choice: ആ ദിവസം
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ടതയും സന്ദർഭത്തിലെ ഭാവിയിലെ ദൈവിക വിലയിരുത്തൽദിനത്തോടുള്ള സൂചനയും അമിതവ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
- source_word: δηλώσει
  choice: വ്യക്തമാക്കും
  rationale: തുടർന്നുള്ള ἀποκαλύπτεται എന്ന ക്രിയയിൽനിന്ന് വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് കാര്യം തെളിയിക്കുന്ന അർഥം നൽകുന്നു.
- source_word: ἐν πυρὶ
  choice: അഗ്നിയിൽ
  rationale: ഗ്രീക്കിലെ ἐν എന്ന പദത്തിന്റെ സ്ഥലാർഥസാധ്യത നിലനിർത്തുന്നു; കരണാർഥമായ ‘അഗ്നിയാൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀποκαλύπτεται
  choice: വെളിപ്പെടുന്നു
  rationale: വെളിപ്പെടുത്തപ്പെടൽ എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അത്’ എന്ന സർവനാമത്തിന്റെ സന്ദർഭപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- source_word: ὁποῖόν ἐστιν
  choice: എങ്ങനെയുള്ളതാണെന്ന്
  rationale: പ്രവൃത്തിയുടെ സ്വഭാവമോ ഗുണമോ പരിശോധിക്കപ്പെടുന്നു എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δοκιμάσει
  choice: പരിശോധിക്കും
  rationale: ഗുണമോ യാഥാർഥ്യമോ നിർണയിക്കാൻ പരീക്ഷിക്കുന്നതെന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτὸ
  choice: തന്നേ
  rationale: പരിശോധിക്കുന്നത് അഗ്നി തന്നെയാണെന്ന ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἡ ἡμέρα എന്നത് സാധാരണ ഒരു ദിവസത്തെയാണോ ഭാവിയിലെ ദൈവിക വിലയിരുത്തൽദിനത്തെയാണോ സൂചിപ്പിക്കുന്നത്?
  choice: ‘ആ ദിവസം’ എന്ന് പരിഭാഷപ്പെടുത്തി, ഭാവിയിലെ ദൈവിക വിലയിരുത്തൽദിനമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ദിവസം’ എന്ന പൊതുവായ രൂപം
  rationale: സന്ദർഭം ഭാവിയിലെ ദൈവിക പരിശോധനയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ന്യായവിധിദിവസം’ എന്ന വ്യാഖ്യാനപദം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ἐν πυρὶ സ്ഥലാർഥത്തിലാണോ കരണാർഥത്തിലാണോ ഗ്രഹിക്കേണ്ടത്?
  choice: മുഖ്യപാഠത്തിൽ ‘അഗ്നിയിൽ’ എന്ന് നൽകി.
  alternative: ‘അഗ്നിയാൽ’
  rationale: ഗ്രീക്ക് പ്രയോഗം ‘അഗ്നിയിൽ’ എന്നും ‘അഗ്നിയാൽ’ എന്നും ഗ്രഹിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ രൂപസാദൃശ്യം നിലനിർത്തി മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അഗ്നി’ എന്നത് വാക്യത്തിന്റെ ഗൗരവവും ബൈബിൾസന്ദർഭവും നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ആവർത്തനവും ‘അഗ്നി തന്നേ’ എന്ന ഊന്നലും സംരക്ഷിച്ചു; ἐν πυρί എന്ന പ്രയോഗത്തിലെ യഥാർഥ ദ്വയാർഥസാധ്യത പരിഹരിക്കാതെ അടിക്കുറിപ്പിലൂടെ അറിയിച്ചു.
