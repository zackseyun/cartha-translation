id: 1CO.3.5
reference: 1 Corinthians 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Τί οὖν ἐστιν ⸂Ἀπολλῶς; τί δέ ἐστιν Παῦλος⸃; ⸀διάκονοι δι’ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: ml
  text: അപ്പോൾ അപ്പൊല്ലോസ് എന്താണ്? പൗലോസ് എന്താണ്? നിങ്ങൾ വിശ്വസിക്കാൻ ഇടയായ ശുശ്രൂഷകർ[a]—കർത്താവ് ഓരോരുത്തനും നൽകിയതനുസരിച്ച്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സേവകർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം സേവനത്തിനുള്ള ആളുകളെയോ ഏജന്റുമാരെയോ സൂചിപ്പിക്കുന്നു; സഭയിലെ ഔദ്യോഗിക ‘ഡീക്കൻ’ പദവിയെ നിർബന്ധമായും സൂചിപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവ് ഓരോരുത്തനും നൽകിയതുപോലെ’ എന്നതാണ് അക്ഷരാർഥത്തോട് അടുത്ത രൂപം. എന്താണ് നൽകിയതെന്ന് ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല; ‘ഓരോരുത്തന് കർത്താവ് ചുമതലപ്പെടുത്തിയതനുസരിച്ച്’ എന്നും അർഥമാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: എന്താണ്
  rationale: നപുംസകലിംഗ ചോദ്യം വ്യക്തികളുടെ സ്വത്വത്തേക്കാൾ അവരുടെ പങ്കിനെയും നിലയെയും കേന്ദ്രീകരിക്കുന്നു; അതിനാൽ ‘ആരാണ്’ എന്നതിനു പകരം ‘എന്താണ്’ എന്നു നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനവും സംഭാഷണപരമായ മാറ്റവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δέ
  choice: പൗലോസ് എന്താണ്?
  rationale: ഗ്രീക്കിലെ δέ ഇവിടെ മൃദുവായ തുടർച്ചയോ താരതമ്യമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ചോദ്യം ചേർത്തുവയ്ക്കുന്നതിലൂടെ അത് സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേക ബന്ധപദം ആവശ്യമില്ല.
- source_word: διάκονοι
  choice: ശുശ്രൂഷകർ
  rationale: ഇവിടെ സഭയിലെ ഔദ്യോഗിക ‘ഡീക്കൻ’ പദവിയല്ല, സേവനത്തിൽ ഏർപ്പെട്ടിരിക്കുന്ന ഏജന്റുമാരെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ശുശ്രൂഷകർ’ സന്ദർഭത്തിന് യോജിച്ച മാന്യവും സാധാരണഗ്രാഹ്യവുമായ പദമാണ്.
- source_word: δι’ ὧν
  choice: ഇടയായ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വിശ്വാസത്തിന്റെ അന്തിമ കാരണക്കാരായി ശുശ്രൂഷകരെ ചിത്രീകരിക്കുന്നില്ല.
- source_word: ἐπιστεύσατε
  choice: നിങ്ങൾ വിശ്വസിക്കാൻ
  rationale: വിശ്വാസത്തിലേക്കുള്ള നിർണായക പ്രതികരണം നേരിട്ട് നിലനിർത്തുന്നു; ‘വിശ്വാസം അർപ്പിച്ചു’ പോലുള്ള വ്യാഖ്യാനവികാസം ചേർക്കുന്നില്ല.
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: കർത്താവ് ഓരോരുത്തനും നൽകിയതനുസരിച്ച്
  rationale: ഗ്രീക്കിലെ ദീർഘലോപം മലയാളത്തിൽ പൂർണമായി അനുകരിച്ചാൽ അർഥം അസ്വാഭാവികമാകും. എങ്കിലും എന്താണ് നൽകിയതെന്ന്—ചുമതലയോ, കഴിവോ, ഫലമോ—പൂരിപ്പിക്കാതെ മൂലത്തിലെ തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ ദൈവശാസ്ത്രപരവും സന്ദർഭോചിതവുമായ മലയാളരൂപം; മുഖ്യപാഠത്തിൽ സൂചിത വ്യക്തിയെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ‘കർത്താവ്’ (κύριος) ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ എന്നുതന്നെ നിലനിർത്തി സൂചിത വ്യക്തിയെ വ്യക്തമാക്കാതിരിക്കുന്നു.
  alternative: ഇത് കർത്താവായ യേശുവിനെ പ്രത്യേകം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ പൊതുവായി ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
  rationale: പൗലോസിന്റെ സന്ദർഭം കർത്താവായ ക്രിസ്തുവിലേക്കു ചൂണ്ടാമെങ്കിലും, ഈ വാക്യം പേര് വ്യക്തമാക്കുന്നില്ല. വിവർത്തനം മൂലപാഠത്തെക്കാൾ നിർദ്ദിഷ്ടമാകരുത്.
- issue: ‘കർത്താവ് നൽകിയതനുസരിച്ച്’ എന്നതിലെ ലോപം
  choice: നൽകിയതിന്റെ കർമം മുഖ്യപാഠത്തിൽ പൂരിപ്പിക്കുന്നില്ല.
  alternative: ‘ഓരോരുത്തനും ചുമതല നൽകിയതനുസരിച്ച്’ അല്ലെങ്കിൽ ‘ഓരോരുത്തന് പങ്ക് നിശ്ചയിച്ചതനുസരിച്ച്.’
  rationale: ഗ്രീക്ക് എന്താണ് നൽകിയതെന്ന് വ്യക്തമാക്കുന്നില്ല. ‘ചുമതല,’ ‘പങ്ക്,’ ‘വരം’ എന്നിവയിൽ ഒന്ന് ചേർത്താൽ യഥാർഥമായ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുങ്ങും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായി ഗ്രാഹ്യവുമായ ശൈലി. നേതാക്കളെ ഉയർത്തിക്കാട്ടാതെ സേവനഭൂമികയിൽ നിർത്തുന്ന പൗലോസിന്റെ ഊന്നൽ പ്രകടമാക്കാൻ ‘മാത്രം’ ഉപയോഗിച്ചു. ‘നിങ്ങൾ വിശ്വസിക്കാൻ ഇടയായ’ എന്ന പ്രയോഗം ശുശ്രൂഷകരുടെ മാധ്യമപരമായ പങ്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
