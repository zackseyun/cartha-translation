  to: അപ്പോൾ അപ്പൊല്ലോസ് എന്താണ്? പൗലോസ് എന്താണ്? നിങ്ങൾ വിശ്വസിക്കാൻ ഇടയായ ശുശ്രൂഷകർ[a]—കർത്താവ് ഓരോരുത്തനും നൽകിയതനുസരിച്ച്.[b]
  rationale: ‘മാത്രം’ ഒഴിവാക്കി, മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യക്തമായ നിയന്ത്രണാർഥം നീക്കുന്നു. ബാക്കി പാഠം ഗ്രീക്കിലെ ചോദ്യങ്ങളുടെ പങ്ക്-കേന്ദ്രീകൃത സ്വഭാവവും, വിശ്വാസത്തിന്റെ മാധ്യമമായ പങ്കും, അവസാനവാക്യത്തിലെ കർമലോപവും യഥാവിധി നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് b-യുടെ പ്രയോഗം അല്പം സ്വാഭാവികമാക്കി; അതിന്റെ അർഥമോ പരിധിയോ മാറ്റിയിട്ടില്ല.
