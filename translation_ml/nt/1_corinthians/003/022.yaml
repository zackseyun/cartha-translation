id: 1CO.3.22
reference: 1 Corinthians 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε Παῦλος εἴτε Ἀπολλῶς εἴτε Κηφᾶς εἴτε κόσμος εἴτε ζωὴ εἴτε θάνατος εἴτε ἐνεστῶτα εἴτε μέλλοντα, πάντα ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/022.yaml
  text: whether Paul or Apollos or Cephas or the world or life or death or things present or things to come—all are yours,
translation:
  language: ml
  text: പൗലോസായാലും അപ്പൊല്ലോസായാലും കേഫാവായാലും ലോകമായാലും ജീവനായാലും മരണമായാലും ഇപ്പോഴുള്ളവയായാലും വരാനിരിക്കുന്നവയായാലും—എല്ലാം നിങ്ങളുടേതാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: …ആയാലും …ആയാലും
  rationale: ആവർത്തിച്ചുവരുന്ന ഗ്രീക്ക് ഘടനയിലെ ബദലുകളുടെ നിരയും വാക്യത്തിന്റെ പ്രഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: Ἀπολλῶς
  choice: അപ്പൊല്ലോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം നിലനിർത്തുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Κηφᾶς
  choice: കേഫാ
  rationale: മൂലപാഠത്തിലുള്ള സെമിറ്റിക് രൂപത്തിലുള്ള പേര് തന്നെ നിലനിർത്തുന്നു; അതിന് പകരം തത്തുല്യമായ ‘പത്രോസ്’ ഉപയോഗിക്കുന്നില്ല.
- source_word: κόσμος
  choice: ലോകം
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്ന ലോകത്തെയോ സൃഷ്ടിവ്യവസ്ഥയെയോ വിശാലമായി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാള പദം.
- source_word: ζωή
  choice: ജീവൻ
  rationale: ഈ പട്ടികയിൽ നാമരൂപമായി വരുന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: θάνατος
  choice: മരണം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള മലയാള തത്തുല്യം.
- source_word: ἐνεστῶτα
  choice: ഇപ്പോഴുള്ളവ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന ബഹുവചന കൃന്തത്തിന്റെ അർഥം നിലനിർത്തി വർത്തമാന യാഥാർഥ്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
- source_word: μέλλοντα
  choice: വരാനിരിക്കുന്നവ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന കൃന്തത്തിന്റെ ഭാവികാലസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: വ്യക്തികളെയും വസ്തുതകളെയും ഉൾക്കൊള്ളുന്ന മുഴുവൻ പട്ടികയെയും സമഗ്രമായി സംഗ്രഹിക്കുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളുടേതാണ്
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ അർഥം നേരിട്ടും ഊന്നലോടെയും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തനാത്മകമായ വാക്യഘടന പൗലോസിന്റെ വാഗ്മിത്വപരമായ ഉയർച്ച നിലനിർത്തുന്നു; അവസാനത്തെ സമഗ്രപ്രഖ്യാപനം ദീർഘവിരാമചിഹ്നംകൊണ്ട് വേർതിരിച്ചിരിക്കുന്നു.
