id: 1CO.3.1
reference: 1 Corinthians 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], ഞാനും നിങ്ങളോടു ആത്മികരോടു സംസാരിക്കുന്നതുപോലെ സംസാരിക്കാൻ കഴിഞ്ഞില്ല; മറിച്ച്, ജഡികരോടു സംസാരിക്കുന്നതുപോലെ, മശീഹയിൽ[b] ശിശുക്കളോടു സംസാരിക്കുന്നതുപോലെ, സംസാരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: ഞാനും
  rationale: καί എന്ന ബന്ധകത്തിന്റെയും ഊന്നലുള്ള ἐγώ എന്ന സർവനാമത്തിന്റെയും ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἠδυνήθην
  choice: സംസാരിക്കാൻ കഴിഞ്ഞില്ല
  rationale: ഭൂതകാലത്തിലെ കഴിവില്ലായ്മ നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: πνευματικοῖς
  choice: ആത്മികരായവർ
  rationale: സന്ദർഭത്തിൽ നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ അധിക വ്യാഖ്യാനം ചേർക്കാതെ വ്യക്തമാക്കുന്നു.
- source_word: σαρκίνοις
  choice: ജഡികരായവർ
  rationale: ‘ആത്മികർ’ എന്നതിനോടുള്ള വിരോധവും σάρξ എന്ന ‘ജഡം’ എന്ന പദവുമായുള്ള ബന്ധവും സൂക്ഷിക്കുന്നു; ‘ലൗകികർ’ അല്ലെങ്കിൽ ‘പാപികൾ’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: νηπίοις
  choice: ശിശുക്കൾ
  rationale: ആത്മിക അപക്വതയെ സൂചിപ്പിക്കുന്ന ശിശുരൂപകം ഗൗരവത്തോടെയും വ്യക്തതയോടെയും നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ഇവിടെ ദൃശ്യമാക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തുവിൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: പൗലോസിന്റെ ἐν Χριστῷ എന്ന പ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം തുറന്നുവെച്ചുകൊണ്ട് Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന ശക്തി പ്രധാന പാഠത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആത്മികർ/ജഡികർ’ എന്ന സമാന്തരതയും ‘ശിശുക്കൾ’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
