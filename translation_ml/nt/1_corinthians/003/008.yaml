  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: ml
  text: നടുന്നവനും നനയ്ക്കുന്നവനും ഒന്നാണ്[a]; എന്നാൽ ഓരോരുത്തനും അവനവന്റെ അധ്വാനത്തിനനുസരിച്ച് അവനവന്റെ പ്രതിഫലം ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഐക്യപ്പെട്ടിരിക്കുന്നു” അല്ലെങ്കിൽ “ഒരേ ലക്ഷ്യമുള്ളവരാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: നടുന്നവൻ
  rationale: കർത്തൃവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പ്രവർത്തകസ്വഭാവവും കൃഷിരൂപകവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποτίζων
  choice: നനയ്ക്കുന്നവൻ
  rationale: സസ്യങ്ങൾക്ക് വെള്ളം നൽകുന്ന കൃഷിപ്രവർത്തനത്തെ മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἕν
  choice: ഒന്നാണ്
  rationale: ഗ്രീക്കിലെ നപുംസക ഏകവചനം വ്യക്തികൾ ഒരേ ആളാണെന്നല്ല, അവരുടെ ഐക്യമാണെന്ന സൂചന നൽകുന്നു; മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും യഥാർഥമായ അർഥവ്യാപ്തിയും ഈ രൂപം കാക്കുന്നു.
- source_word: μισθὸν
  choice: പ്രതിഫലം
  rationale: വെറും പണിക്കൂലിയായി അർഥം ചുരുക്കാതെ, ചെയ്ത സേവനത്തിന് ലഭിക്കുന്ന പ്രത്യുപകാരം എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: λήμψεται
  choice: ലഭിക്കും
  rationale: ഭാവികാലത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατὰ
  choice: അനുസരിച്ച്
  rationale: ഓരോരുത്തന്റെ അധ്വാനവുമായി പ്രതിഫലത്തിനുള്ള മാനദണ്ഡബന്ധം സൂക്ഷിക്കുന്നു.
- source_word: κόπον
  choice: അധ്വാനം
  rationale: κόπος സൂചിപ്പിക്കുന്ന പ്രയാസപൂർവമായ പരിശ്രമം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἴδιον
  choice: അവനവന്റെ
  rationale: രണ്ടുതവണ വരുന്ന ἴδιον എന്ന പദത്തിന്റെ വ്യക്തിഗത ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἕν εἰσιν എന്നതിലെ ‘ഒന്നാണ്’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: നടുന്നവനും നനയ്ക്കുന്നവനും വ്യത്യസ്ത ചുമതലകളുള്ളവരായിരുന്നാലും സേവനത്തിൽ ഐക്യമുള്ളവരാണ് എന്ന തുറന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ഐക്യപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ഒരേ ലക്ഷ്യമുള്ളവരാണ്’ എന്ന് അർഥം വ്യക്തമാക്കി പരിഭാഷപ്പെടുത്തുക.
  rationale: നപുംസക ഏകവചനമായ ἕν വ്യക്തിപരമായ ഒരേത്തനിമയെക്കാൾ ഐക്യത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഐക്യം ലക്ഷ്യത്തിലോ പ്രവർത്തനത്തിലോ പദവിയിലോ എന്നത് മുഖ്യപാഠത്തിൽ അനാവശ്യമായി ചുരുക്കാതെ, സന്ദർഭത്തിലെ വിഭാഗീയതാവിരുദ്ധ ഊന്നൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കൃഷിരൂപകം, ആവർത്തിച്ചുള്ള വ്യക്തിഗത ഊന്നൽ, ‘ഒന്നാണ്’ എന്നതിലെ യഥാർഥ അർഥവ്യാപ്തി എന്നിവ സംരക്ഷിച്ചു.
