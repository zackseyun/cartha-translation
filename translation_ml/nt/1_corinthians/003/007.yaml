base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: ml
  text: അതുകൊണ്ട്, നടുന്നവനും നനയ്ക്കുന്നവനും ഒന്നുമല്ല; എന്നാൽ വളർച്ച നൽകുന്നത് ദൈവമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “വളർത്തുന്നത് ദൈവമാണ്”; പരമ്പരാഗതമായി: “വർധന നൽകുന്നത് ദൈവമാണ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനഫലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ φυτεύων
  choice: നടുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പ്രവർത്തകഭാവം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἐστίν τι
  choice: ഒന്നുമല്ല
  rationale: οὔτε ... τι എന്ന നിഷേധപ്രയോഗത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മനുഷ്യപ്രവർത്തകർക്ക് യാതൊരു പ്രാധാന്യവുമില്ലെന്ന സന്ദർഭപരമായ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὁ ποτίζων
  choice: നനയ്ക്കുന്നവൻ
  rationale: നടുന്നവൻ എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരഘടനയും കൃഷിസന്ദർഭത്തിലെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἀλλ’
  choice: എന്നാൽ ... ആണ്
  rationale: മനുഷ്യപ്രവർത്തകരെയും ദൈവത്തെയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ സ്വാഭാവിക ഊന്നൽഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁ αὐξάνων
  choice: വളർത്തുന്ന
  rationale: വളർച്ച ഉളവാക്കുന്നവൻ എന്ന ഗ്രീക്ക് കൃദന്തത്തിന്റെ കാരകഭാവം ലളിതമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θεός
  choice: ദൈവം
  rationale: വാക്യാവസാനത്തിലെ ഗ്രീക്ക് ഊന്നൽ മലയാളത്തിൽ വിധേയപ്രധാനമായ ‘ദൈവമാണ്’ എന്ന ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: മനുഷ്യപ്രവർത്തകരുടെ പങ്കും വളർച്ച നൽകുന്ന ദൈവത്തിന്റെ നിർണായക പ്രവർത്തനവും തമ്മിലുള്ള വൈരുധ്യം
  choice: വളർത്തുന്ന ദൈവമാണ് എല്ലാം
  alternative: വളർത്തുന്ന ദൈവമത്രേ
  rationale: ഗ്രീക്കിൽ θεός എന്നതിന് ശേഷം ‘എല്ലാം’ എന്ന പദമില്ലെങ്കിലും, οὔτε ... τι ... ἀλλά എന്ന അപൂർണ്ണമായ വൈരുധ്യഘടനയുടെ ഉദ്ദേശം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പൂർത്തിയാക്കുന്നു. അടിക്കുറിപ്പ് കൂടുതൽ രൂപസമീപമായ പരിഭാഷ നൽകുന്നു; മനുഷ്യശുശ്രൂഷയെ പൂർണമായി നിരസിക്കുന്നതല്ല, ഫലപ്രദമായ വളർച്ചയുടെ ഉറവിടം ദൈവമാണെന്ന ഊന്നൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘നടുന്നവൻ / നനയ്ക്കുന്നവൻ’ എന്ന സമാന്തരഘടന പൗലോസിന്റെ വാക്ചാതുര്യം നിലനിർത്തുന്നു. പ്രധാനവാചകത്തിലെ ‘എല്ലാം’ മലയാളത്തിൽ വൈരുധ്യം സ്വാഭാവികമായി പൂർത്തിയാക്കുന്ന അർഥവ്യക്തീകരണമാണ്; അതിനാൽ അക്ഷരസമീപരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
