id: 1CO.3.15
reference: 1 Corinthians 3:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: ml
  text: ഒരാളുടെ പ്രവൃത്തി കത്തിനശിച്ചുപോയാൽ, അയാൾക്ക് നഷ്ടം സംഭവിക്കും; എന്നാൽ അയാൾതന്നെ രക്ഷിക്കപ്പെടും—തീയിലൂടെ കടന്നുപോകുന്നതുപോലെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “തീയിലൂടെ മാത്രമെന്നപോലെ”; അല്ലെങ്കിൽ, “തീയിൽനിന്ന് രക്ഷപ്പെടുന്ന ഒരാളെപ്പോലെ.”
    reason: അവസാന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകപരമായ സൂക്ഷ്മതയ്ക്ക് ഒന്നിലധികം സ്വാഭാവിക വിവർത്തനങ്ങൾ സാധ്യമാണ്.
lexical_decisions:
- source_word: εἴ τινος
  choice: ഒരാളുടെ … എങ്കിൽ
  rationale: നിബന്ധനയും അനിശ്ചിത വ്യക്തിസൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ἔργον
  choice: പ്രവൃത്തി
  rationale: സന്ദർഭത്തിലെ പണിയുടെയും ശുശ്രൂഷാഫലത്തിന്റെയും രൂപകം അമിതമായി വിശദീകരിക്കാതെ വിശാലമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: κατακαήσεται
  choice: കത്തിനശിച്ചാൽ
  rationale: വെറുതെ കത്തുക എന്നതിലുപരി തീയിൽ പൂർണമായി നശിക്കുന്നതിന്റെ ശക്തി പ്രകടമാക്കുന്നു.
- source_word: ζημιωθήσεται
  choice: നഷ്ടം സംഭവിക്കും
  rationale: നഷ്ടമോ കൈവിട്ടുപോകലോ സൂചിപ്പിക്കുന്നു; പ്രതിഫലം നഷ്ടപ്പെടുമെന്ന വ്യാഖ്യാനം നേരിട്ട് വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: αὐτὸς δὲ σωθήσεται
  choice: എങ്കിലും അയാൾതന്നെ രക്ഷിക്കപ്പെടും
  rationale: പ്രവൃത്തി നഷ്ടപ്പെടുന്നതും വ്യക്തി രക്ഷിക്കപ്പെടുന്നതും തമ്മിലുള്ള വൈരുധ്യവും αὐτός എന്ന പദത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: എന്നാൽ തീയിലൂടെ എന്നപോലെ
  rationale: ഗ്രീക്കിലെ ചുരുങ്ങിയതും ദൃശ്യവുമായ രൂപകം അതിന്റെ അവ്യക്തതയോടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാനത്തെ അഗ്നിരൂപകം ഒരു പ്രത്യേക ഉപദേശപരമായ അർഥത്തിലേക്ക് ചുരുക്കണമോ എന്നത്
  choice: “എന്നാൽ തീയിലൂടെ എന്നപോലെ” എന്നു വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: “തീയിൽനിന്ന് കഷ്ടിച്ച് രക്ഷപ്പെടുന്നവനെപ്പോലെ” അല്ലെങ്കിൽ ശുദ്ധീകരണാഗ്നിയെ സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ
  rationale: മൂലവാക്യം രക്ഷയുടെ രീതി ഒരു ദൃശ്യരൂപകത്തിലൂടെ പറയുന്നു; അത് കഷ്ടിച്ചുള്ള രക്ഷയാണോ മറ്റേതെങ്കിലും പ്രത്യേക ശുദ്ധീകരണമാണോ എന്നു വ്യക്തമായി നിർവചിക്കുന്നില്ല. അതിനാൽ മതവിഭാഗപരമായ നിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. “അയാൾതന്നെ” എന്ന രൂപം വ്യക്തിയെയും അയാളുടെ പ്രവൃത്തിയെയും തമ്മിൽ വ്യക്തമായി വേർതിരിക്കുന്നു; അഗ്നിരൂപകത്തിന്റെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത സംരക്ഷിച്ചിരിക്കുന്നു.
