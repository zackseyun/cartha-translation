  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: ml
  text: ഞാൻ നിങ്ങൾക്കു പാൽ കുടിപ്പിച്ചു[a], കട്ടിയുള്ള ഭക്ഷണമല്ല[b]; കാരണം, അന്നു നിങ്ങൾക്കു കഴിയുമായിരുന്നില്ല. എന്നാൽ ഇപ്പോഴും നിങ്ങൾക്കു കഴിയുന്നില്ല,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങൾക്കു കുടിക്കാൻ പാൽ തന്നു.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “കട്ടിയുള്ള ഭക്ഷണം” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്കുപദത്തിന്റെ പൊതുവായ അർഥം “ഭക്ഷണം” എന്നാണ്; പാലുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കാനാണ് “കട്ടിയുള്ള” എന്നു ചേർത്തത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: പാൽ
  rationale: പോഷണത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ രൂപകത്തിലെ നേരിട്ടുള്ള കർമപദമാണ്; സാധാരണ മലയാളപദം തന്നെയാണ് ആശയവ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നത്.
- source_word: ἐπότισα
  choice: കുടിക്കാൻ തന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘കുടിപ്പിച്ചു/കുടിക്കാൻ കൊടുത്തു’ എന്നത് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും പാലും ഭക്ഷണവും തമ്മിലുള്ള രൂപകാത്മക വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: βρῶμα
  choice: കട്ടിയുള്ള ഭക്ഷണം
  rationale: ഗ്രീക്കുപദത്തിന് പൊതുവായി ‘ഭക്ഷണം’ എന്നാണ് അർഥം; എന്നാൽ പാലുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കാൻ ‘കട്ടിയുള്ള ഭക്ഷണം’ എന്നു വിവർത്തനം ചെയ്തു. ഈ വ്യാഖ്യാനാത്മക വ്യക്തമാക്കൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὔπω
  choice: അന്ന് ... കഴിവുണ്ടായിരുന്നില്ല
  rationale: മുൻകാലത്തെ ‘ഇനിയും ആയിട്ടില്ല’ എന്ന ശേഷിക്കുറവ് സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; തുടർന്നുള്ള വർത്തമാനകാല പ്രസ്താവനയുമായുള്ള കാലവ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἐδύνασθε
  choice: നിങ്ങൾക്ക് ... കഴിവുണ്ടായിരുന്നില്ല
  rationale: δύναμαι സൂചിപ്പിക്കുന്ന ശേഷി/പ്രാപ്തി നേരിട്ട് നൽകുകയും ഭൂതകാലഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐδὲ ἔτι νῦν
  choice: ഇപ്പോൾപ്പോലും ... കഴിവില്ല
  rationale: ‘ഇപ്പോൾപ്പോലും’ എന്ന പ്രയോഗം വർത്തമാനകാലത്തും തുടരുന്ന ശേഷിക്കുറവിന് ഗ്രീക്കിലുള്ള ഊന്നൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: δύνασθε
  choice: നിങ്ങൾക്ക് ... കഴിവില്ല
  rationale: ഇപ്പോഴത്തെ ശേഷിയില്ലായ്മ വ്യക്തമാക്കുകയും മുൻവാക്യത്തിലെ ഭൂതകാലപ്രയോഗവുമായി സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പോഷണരൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: പാലും കട്ടിയുള്ള ഭക്ഷണവും എന്ന രൂപകം അതേപടി നിലനിർത്തി; അവ എന്തുതരം ഉപദേശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത് എന്നു വിവർത്തനത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ‘അടിസ്ഥാനകാര്യങ്ങൾ മാത്രമാണ് ഞാൻ നിങ്ങളെ പഠിപ്പിച്ചത്’ എന്ന വ്യാഖ്യാനാത്മക പരാവർത്തനം.
  rationale: ഗ്രീക്കുമൂലം അമൂർത്തമായ വിശദീകരണമല്ല, പോഷണരൂപകമാണ് ഉപയോഗിക്കുന്നത്. അതിനെ അതേപടി നിലനിർത്തുന്നത് പാഠം അനുവദിക്കുന്ന പരിധിക്കപ്പുറം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം dignifiedവും സ്വാഭാവികവുമായി രചിച്ചു. ‘കുടിക്കാൻ പാലാണ് തന്നത്’ എന്ന പ്രയോഗം മൂലക്രിയയുടെ കുടിപ്പിക്കൽഭാവം നിലനിർത്തുന്നു; ‘അതിനു’ എന്നത് സന്ദർഭത്തിൽ കട്ടിയുള്ള ഭക്ഷണം സ്വീകരിക്കാനുള്ള ശേഷിയെ സൂചിപ്പിക്കുമ്പോഴും രൂപകത്തിന്റെ പ്രയോഗം കൂടുതൽ വിശദീകരിക്കാതെ തുറന്നുവെക്കുന്നു.
