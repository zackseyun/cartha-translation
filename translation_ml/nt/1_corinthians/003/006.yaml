id: 1CO.3.6
reference: 1 Corinthians 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: ml
  text: ഞാൻ നട്ടു, അപ്പൊല്ലോസ് നനച്ചു; എന്നാൽ ദൈവം വളർത്തിക്കൊണ്ടിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവം വളർച്ച നൽകി” / “ദൈവം അതിനെ വളർത്തി.”'
    reason: ηὔξανεν എന്നതിന്റെ സ്വാഭാവികമായ മറ്റു പരിഭാഷകൾ നൽകുന്നു; മുഖ്യപാഠം അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാസൂചന കൂടുതൽ വ്യക്തമായി നിലനിർത്തുന്നു.
lexical_decisions:
- source_word: ἐγὼ
  choice: ഞാൻ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം പൗലൊസിന്റെ പങ്കിനെ എടുത്തുകാട്ടുന്നു; മലയാളത്തിലെ ‘ഞാൻ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐφύτευσα
  choice: നട്ടു
  rationale: കൃഷിയുടെ രൂപകം നേരായും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: Ἀπολλῶς
  choice: അപ്പൊല്ലോസ്
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള ലിപ്യന്തരണരീതിയിൽ നൽകി.
- source_word: ἐπότισεν
  choice: നനച്ചു
  rationale: ചെടിക്ക് വെള്ളം നൽകുന്ന കൃഷിദൃശ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മനുഷ്യരുടെ പ്രവർത്തനവും ദൈവത്തിന്റെ നിർണായക പ്രവർത്തനവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: വളർച്ചയുടെ ഫലപ്രദമായ കർത്താവ് ദൈവമാണെന്ന ഗ്രീക്ക് വാക്യത്തിലെ കർത്തൃവ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: ηὔξανεν
  choice: വളർത്തിക്കൊണ്ടിരുന്നു
  rationale: αὐξάνω എന്ന ക്രിയയുടെ വളരാൻ ഇടയാക്കുക എന്ന അർഥവും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മനുഷ്യശുശ്രൂഷയും ദൈവിക പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: പൗലൊസും അപ്പൊല്ലോസും തങ്ങളുടെ യഥാർഥ ചുമതലകൾ നിർവഹിച്ചു; എന്നാൽ വളർച്ച ഉണ്ടാക്കിക്കൊണ്ടിരുന്നത് ദൈവമാണ് എന്ന വൈരുധ്യം നിലനിർത്തി.
  alternative: ‘ദൈവം വളർച്ച നൽകി’
  rationale: മനുഷ്യപ്രയത്നത്തെ നിഷേധിക്കാതെയും ഫലപ്രദമായ വളർച്ചയുടെ കർത്തൃത്വം ദൈവത്തിനാണെന്ന വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നട്ടു—നനച്ചു—വളർത്തിക്കൊണ്ടിരുന്നു’ എന്ന ക്രിയാനിര കൃഷിരൂപകവും കർത്താക്കളുടെ വ്യത്യാസവും വ്യക്തമായി നിലനിർത്തുന്നു.
