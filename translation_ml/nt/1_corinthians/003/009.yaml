id: 1CO.3.9
reference: 1 Corinthians 3:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεοῦ γάρ ἐσμεν συνεργοί· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/009.yaml
  text: For we are God’s fellow workers; you are God’s field[a], God’s building.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞങ്ങൾ ദൈവത്തിന്റെ സഹപ്രവർത്തകരാണ്[a]; നിങ്ങൾ ദൈവത്തിന്റെ വയലും ദൈവത്തിന്റെ കെട്ടിടവുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞങ്ങൾ ദൈവത്തോടൊപ്പം സഹപ്രവർത്തിക്കുന്നവരാണ്.”
    reason: θεοῦ συνεργοί എന്ന ഗ്രീക്ക് പ്രയോഗത്തിൽ ഉടമസ്ഥതയോ സേവനബന്ധമോ സൂചിപ്പിക്കുന്ന ‘ദൈവത്തിന്റെ സഹപ്രവർത്തകർ’ എന്നും പങ്കാളിത്തം സൂചിപ്പിക്കുന്ന ‘ദൈവത്തോടൊപ്പം സഹപ്രവർത്തിക്കുന്നവർ’ എന്നും വ്യാഖ്യാനിക്കാവുന്ന യഥാർഥമായ അർഥസന്ദിഗ്ധതയുണ്ട്.
lexical_decisions:
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തെ വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνεργοί
  choice: സഹപ്രവർത്തകർ
  rationale: ഒരുമിച്ചു പ്രവർത്തിക്കുന്നവരെന്ന ബഹുവചന അർഥം സംക്ഷിപ്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: θεοῦ (with συνεργοί)
  choice: ദൈവത്തിന്റെ
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റേതായവരും അവന്റെ സേവനത്തിലുള്ളവരുമെന്ന ആശയത്തിന് മുൻഗണന നൽകുന്നു; ദൈവത്തോടൊപ്പം സഹപ്രവർത്തിക്കുന്നവർ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γεώργιον
  choice: വയൽ
  rationale: കൃഷിയുടെ രൂപകം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: οἰκοδομή
  choice: കെട്ടിടം
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ വികസിക്കുന്ന നിർമാണരൂപകത്തിന് ചേരുന്ന ലളിതവും നേരിട്ടുള്ളതുമായ പദം.
- source_word: ἐστε
  choice: നിങ്ങൾ ... ആണ്
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ രണ്ടാംപുരുഷ ബഹുവചനം നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
theological_decisions:
- issue: θεοῦ συνεργοί എന്നത് “ദൈവത്തിന്റെ സഹപ്രവർത്തകർ” എന്നോ “ദൈവത്തോടൊപ്പം സഹപ്രവർത്തിക്കുന്നവർ” എന്നോ അർഥമാക്കണമോ
  choice: ദൈവത്തിന്റെ സഹപ്രവർത്തകർ
  alternative: ദൈവത്തോടൊപ്പം സഹപ്രവർത്തിക്കുന്നവർ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി രണ്ടു വ്യാഖ്യാനങ്ങൾക്കും ഇടനൽകുന്നു. തൽസന്ദർഭം ശുശ്രൂഷകർ ദൈവത്തിന്റേതും അവന്റെ കീഴിൽ സേവിക്കുന്നവരുമാണെന്നും കൊരിന്ത്യർ ദൈവത്തിന്റേതാണെന്നും ഊന്നുന്നു. മുഖ്യപാഠം ആ ഊന്നൽ നിലനിർത്തുന്നു; യഥാർഥമായ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കൃഷി, നിർമാണം എന്നീ രൂപകങ്ങൾ സംക്ഷിപ്തമായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വിവാദപ്രയോഗമായ ‘സഹപ്രവർത്തകർ’ എന്നതിനോടു ചേർത്തു.
