id: 1CO.3.16
reference: 1 Corinthians 3:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: ml
  text: നിങ്ങൾ ദൈവത്തിന്റെ ആലയമാണെന്നും ദൈവത്തിന്റെ ആത്മാവ് നിങ്ങളിൽ വസിക്കുന്നുവെന്നും നിങ്ങൾ അറിയുന്നില്ലേ?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ വിശുദ്ധമന്ദിരം.’
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ’ എന്നത് ബഹുവചനമാണ്; പൗലോസ് ഇവിടെ സമൂഹത്തെ ഒന്നാകെ അഭിസംബോധന ചെയ്യുന്നു.
    reason: cultural_note
  - marker: c
    text: അഥവാ ‘നിങ്ങളുടെ ഇടയിൽ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ναὸς
  choice: ആലയം
  rationale: ναός വിശുദ്ധമന്ദിരത്തെ, പ്രത്യേകിച്ച് ദൈവസാന്നിധ്യത്തിന്റെ വിശുദ്ധസ്ഥാനത്തെ, സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ആലയം’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദമാണ്; വിശാലമായ ക്ഷേത്രപരിസരം എന്നതിലുപരി വിശുദ്ധമന്ദിരത്തിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ബന്ധവിഭക്തിയെ സ്വാഭാവികമായ മലയാള ഷഷ്ഠീവ്യാകരണരൂപത്തിൽ നൽകുന്നു; ‘ദൈവത്തിന്റെ ആലയം’, ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്നീ രണ്ടു പ്രയോഗങ്ങളിലെയും ബന്ധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐστε
  choice: നിങ്ങൾ … ആകുന്നു
  rationale: രണ്ടാംപുരുഷ ബഹുവചനമാണ്. മലയാളത്തിലെ ആദര/ബഹുവചനരൂപമായ ‘നിങ്ങൾ’ മൂലപാഠത്തിന്റെ ബഹുവചനത്തെ നിലനിർത്തുന്നു; വാക്യത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘ആണ്’ എന്ന ആശയം ‘ആലയമാണ്’ എന്ന രൂപത്തിൽ ചേർത്തിരിക്കുന്നു.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: മൂലത്തിലെ ബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്നതും ആധുനിക മലയാളത്തിൽ വ്യക്തവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ പ്രയോഗമാണിത്.
- source_word: οἰκεῖ
  choice: വസിക്കുന്നു
  rationale: οἰκέω സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പാർപ്പിനെ ‘വസിക്കുന്നു’ കൃത്യമായി നൽകുകയും ആലയരൂപകവുമായി സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ഉള്ളിൽ/ഇൽ’ നിലനിർത്തുന്നു. ബഹുവചനസംബോധന കാരണം ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന സാമൂഹിക അർഥവും സാധ്യമാണ്; അത് അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: Οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലേ?
  rationale: പ്രതീക്ഷിക്കുന്ന ഉത്തരം ‘അറിയുന്നു’ എന്നതായ ഗ്രീക്ക് വാചാടോപചോദ്യത്തിന്റെ ശാസനാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വാക്യം പ്രധാനമായും വ്യക്തിവിശ്വാസികളെയോ സഭാസമൂഹത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാനപാഠത്തിൽ ‘നിങ്ങൾ’ എന്ന ബഹുവചനരൂപം നിലനിർത്തി; സന്ദർഭത്തിലെ സമൂഹപരമായ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘നിങ്ങൾ എല്ലാവരും ചേർന്ന് ദൈവത്തിന്റെ ആലയമാണ്’ എന്ന് സമൂഹപരമായ അർഥം പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക, അല്ലെങ്കിൽ ‘നിങ്ങളിൽ ഓരോരുത്തനും’ എന്ന് വ്യക്തിവൽക്കരിക്കുക.
  rationale: ഗ്രീക്കിൽ രണ്ടാംപുരുഷ ബഹുവചനമുണ്ടെങ്കിലും ‘ഒരുമിച്ച്’ എന്നോ ‘ഓരോരുത്തനും’ എന്നോ വ്യക്തമാക്കുന്ന പദമില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ അർഥപരിധിയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും ചുരുക്കാതെ ‘നിങ്ങൾ’ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാചാടോപചോദ്യം നിലനിർത്തി. സഭാസമൂഹത്തെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചനം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും വ്യക്തിപരമോ സമൂഹപരമോ എന്ന അർഥം അനാവശ്യമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്തു.
