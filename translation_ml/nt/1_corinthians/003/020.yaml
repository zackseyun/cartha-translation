source:
  edition: SBLGNT
  text: καὶ πάλιν· Κύριος γινώσκει τοὺς διαλογισμοὺς τῶν σοφῶν ὅτι εἰσὶν μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/020.yaml
  text: And again[a], “The Lord knows the thoughts of the wise[c][b], that they are futile.”
translation:
  language: ml
  text: 'വീണ്ടും: “ജ്ഞാനികളുടെ ചിന്തകൾ[a] വ്യർഥമാണെന്ന്[c] കർത്താവ് അറിയുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ചിന്തകൾ” എന്നതിന് “യുക്തിവിചാരങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: സങ്കീർത്തനം 94:11-ൽനിന്നുള്ള ഉദ്ധരണി (സെപ്റ്റുവജിന്റിൽ 93:11).
    reason: cross_reference
  - marker: c
    text: “വ്യർഥം” എന്നതിന് “നിഷ്ഫലം” അല്ലെങ്കിൽ “പൊള്ളയായത്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: വീണ്ടും
  rationale: മുമ്പുള്ള ഉദ്ധരണിക്കു പിന്നാലെ രണ്ടാമത്തെ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: Κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ പതിവായ, ആദരസൂചകമായ മലയാളപരിഭാഷ; ഇവിടെ സങ്കീർത്തനത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: γινώσκει
  choice: അറിയുന്നു
  rationale: ദൈവത്തിന് ജ്ഞാനികളുടെ ഉള്ളിലെ ചിന്തകൾ അറിയാം എന്ന പ്രസ്താവനയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: διαλογισμοὺς
  choice: ചിന്തകൾ
  rationale: മനസ്സിലെ വിചാരങ്ങളെയും യുക്തിവിചാരങ്ങളെയും ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ പദം; ‘യുക്തിവിചാരങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῶν σοφῶν
  choice: ജ്ഞാനികളുടെ
  rationale: പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കാതെ substantival adjective-ന്റെ പൊതുവായ അർഥം നൽകുന്നു; സന്ദർഭത്തിലെ മനുഷ്യജ്ഞാനത്തെക്കുറിച്ചുള്ള വിമർശനവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: കർത്താവ് അറിയുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന content conjunction ആയി പരിഭാഷപ്പെടുത്തി; കാരണാർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: μάταιοι
  choice: വ്യർഥം
  rationale: ചിന്തകൾ പൊള്ളയും ഫലശൂന്യവുമാണെന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ജ്ഞാനികൾ’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ജ്ഞാനികളുടെ
  alternative: പണ്ഡിതന്മാരുടെ / ജ്ഞാനികളായ പുരുഷന്മാരുടെ
  rationale: ഗ്രീക്കിലെ τῶν σοφῶν ലിംഗപരമായി പുരുഷന്മാർക്കു മാത്രമായി പരിമിതപ്പെടുത്തേണ്ടതില്ല; പൗലോസിന്റെ സന്ദർഭത്തിൽ ജ്ഞാനികളെന്ന് കരുതപ്പെടുന്നവരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ഉദ്ധരണിയിലെ ഗ്രീക്ക് പദക്രമം കൃത്രിമമായി അനുകരിക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക ക്രമം സ്വീകരിച്ചു; എന്നാൽ കർത്താവാണ് അറിയുന്നവൻ, ജ്ഞാനികളുടെ ചിന്തകളാണ് വ്യർഥമായവ എന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തി.
