  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: ml
  text: ഈ ലോകത്തിന്റെ ജ്ഞാനം ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ ഭോഷത്തമാണ്.[a] എന്തെന്നാൽ, ഇങ്ങനെ എഴുതപ്പെട്ടിരിക്കുന്നു:[b] “ജ്ഞാനികളെ അവരുടെ കപടതയിൽ അവൻ പിടികൂടുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ദൈവത്തിങ്കൽ”; അതായത്, ദൈവത്തിന്റെ കാഴ്ചപ്പാടിലോ വിധിയിലോ.
    reason: lexical_alternative
  - marker: b
    text: ഇയ്യോബ് 5:13-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: scripture_reference
lexical_decisions:
- source_word: σοφία
  choice: ജ്ഞാനം
  rationale: സന്ദർഭത്തിൽ ലോകം ജ്ഞാനമെന്നു കരുതുന്നതിനെ സൂചിപ്പിക്കുന്ന പതിവും സ്വാഭാവികവുമായ പദം.
- source_word: κόσμου τούτου
  choice: ഈ ലോകത്തിന്റെ
  rationale: κόσμος ഇവിടെ ഇപ്പോഴത്തെ ലോകക്രമത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഈ ലോകത്തിന്റെ’ എന്നത് പൗലോസിന്റെ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μωρία
  choice: ഭോഷത്തം
  rationale: പൗലോസിന്റെ ആവർത്തിതമായ ജ്ഞാനം–ഭോഷത്തം വൈരുധ്യം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി പകർന്നുനൽകുന്നു.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവത്തിന്റെ ദൃഷ്ടിയിൽ
  rationale: παρά + dative ഇവിടെ ദൈവത്തിന്റെ വിലയിരുത്തലിനെയോ കാഴ്ചപ്പാടിനെയോ സൂചിപ്പിക്കുന്നു; അക്ഷരാർഥമായ ‘ദൈവത്തോടുകൂടെ’ മലയാളത്തിൽ ഉദ്ദേശ്യം തെറ്റിദ്ധരിപ്പിക്കാം.
- source_word: γέγραπται
  choice: എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന perfect passive സൂത്രവാക്യത്തിന്റെ പ്രചാരത്തിലുള്ള ഔപചാരിക പരിഭാഷ.
- source_word: δρασσόμενος
  choice: പിടികൂടുന്നു
  rationale: പിടിച്ചെടുക്കുക, കെണിയിലാക്കുക എന്ന ഭാവമുള്ള participle; ഉദ്ധരണിയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: σοφοὺς
  choice: ജ്ഞാനികളെ
  rationale: ലിംഗനിർണ്ണയം അനാവശ്യമായി ചേർക്കാതെ ജ്ഞാനികളായ വ്യക്തികളെ സൂചിപ്പിക്കുന്നു.
- source_word: πανουργίᾳ
  choice: കൗശലത്തിൽത്തന്നെ
  rationale: ഇവിടെ ധാർമ്മികമായി പ്രതികൂലമായ ചതുരതയെയോ കപടതയെയോ സൂചിപ്പിക്കുന്നു; ‘ത്തന്നെ’ അവരുടെ സ്വന്തം തന്ത്രം അവർക്കെതിരാകുന്ന ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഇയ്യോബ് 5:13-ലെ ഉദ്ധരണിയിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന articular participle മലയാളത്തിൽ എങ്ങനെ നൽകണം
  choice: “ജ്ഞാനികളെ അവരുടെ കൗശലത്തിൽത്തന്നെ അവൻ പിടികൂടുന്നു”
  alternative: “ജ്ഞാനികളെ അവരുടെ കൗശലത്തിൽ പിടികൂടുന്നവൻ”
  rationale: ഗ്രീക്കിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ὁ δρασσόμενος എന്ന പ്രയോഗം ഉണ്ട്. ‘അവൻ’ എന്നു വ്യക്തമാക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം ചേർക്കാതെ മലയാളത്തിലെ പൂർണ്ണവാക്യം സ്വാഭാവികമാക്കുകയും മനുഷ്യജ്ഞാനത്തെ ദൈവം മറിച്ചിടുന്ന ഉദ്ധരണിയുടെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭോഷത്തം’, ‘ദൃഷ്ടിയിൽ’, ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ എന്നിവ പൗലോസിന്റെ വാദത്തിന്റെ ഔപചാരികത നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
