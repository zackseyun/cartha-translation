id: 1CO.3.4
reference: 1 Corinthians 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν γὰρ λέγῃ τις· Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ· Ἐγὼ Ἀπολλῶ, ⸂οὐκ ἄνθρωποί⸃ ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: ml
  text: കാരണം, ഒരാൾ “ഞാൻ പൗലോസിന്റെ ആളാണ്” എന്നും മറ്റൊരാൾ “ഞാൻ അപ്പൊല്ലോസിന്റെ ആളാണ്” എന്നും പറയുമ്പോഴെല്ലാം, നിങ്ങൾ മനുഷ്യരല്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ വെറും മനുഷ്യരല്ലേ?” അല്ലെങ്കിൽ “നിങ്ങൾ സാധാരണ മനുഷ്യരെപ്പോലെ പെരുമാറുന്നവരല്ലേ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: പറയുമ്പോഴെല്ലാം
  rationale: ഒരിക്കൽ മാത്രം സംഭവിക്കുന്ന കാര്യമല്ല, ആവർത്തിക്കാവുന്ന പൊതുസാഹചര്യമാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വാദത്തിന് ഈ വാക്യം വിശദീകരണം നൽകുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: λέγῃ τις
  choice: ഒരാൾ … പറയുമ്പോൾ
  rationale: അനിശ്ചിത ഏകവചനത്തിന്റെ പൊതുവായ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: ഞാൻ പൗലോസിന്റെ ആളാണ്
  rationale: വിഭാഗീയമായ കൂറ് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ചുരുക്കരൂപം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു; ഉടമസ്ഥതയുടെ സ്വഭാവം അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: ἕτερος δέ
  choice: മറ്റൊരാൾ
  rationale: μέν … δέ സൃഷ്ടിക്കുന്ന രണ്ടു പ്രസ്താവനകളിലെ വൈരുധ്യം മലയാളത്തിലെ സ്വാഭാവിക ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: Ἐγὼ Ἀπολλῶ
  choice: ഞാൻ അപ്പൊല്ലോസിന്റെ ആളാണ്
  rationale: മുൻപ്രസ്താവനയിൽനിന്ന് മനസ്സിലാക്കേണ്ട ക്രിയ പൂരിപ്പിച്ച് സമാന്തരമായ കൂറുപ്രഖ്യാപനം നിലനിർത്തുന്നു.
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: നിങ്ങൾ മനുഷ്യരല്ലേ?
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി ഉള്ള ‘മനുഷ്യർ’ എന്ന പദം മുഖ്യപാഠത്തിൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നിലനിർത്തുന്നു; സന്ദർഭം സൂചിപ്പിക്കുന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘മനുഷ്യർ’ എന്ന ശാസനയുടെ അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘നിങ്ങൾ മനുഷ്യരല്ലേ?’ എന്ന നേരിട്ടുള്ള രൂപം
  alternative: ‘നിങ്ങൾ വെറും മനുഷ്യരല്ലേ?’ / ‘നിങ്ങൾ സാധാരണ മനുഷ്യരെപ്പോലെ പെരുമാറുന്നവരല്ലേ?’
  rationale: പൗലോസിന്റെ വാചാടോപപരമായ ചോദ്യം വിഭാഗീയ പെരുമാറ്റത്തെ ശാസിക്കുന്നുവെങ്കിലും, ‘വെറും’ എന്ന പദം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ല. അതിനാൽ മൂലപാഠത്തിന്റെ ചുരുക്കവും അർഥത്തിലെ പിരിമുറുക്കവും മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് സന്ദർഭാധിഷ്ഠിത വ്യാഖ്യാനം അടിക്കുറിപ്പിലാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പൗലോസിന്റെ ആളാണ്’ എന്ന പ്രയോഗം വിഭാഗീയ കൂറ് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു; മുഖ്യപാഠത്തിലെ വാചാടോപപരമായ ചുരുക്കം നിലനിർത്തിയിരിക്കുന്നു.
