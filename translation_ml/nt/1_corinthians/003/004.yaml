  terminology: ‘പൗലോസ്,’ ‘അപ്പൊല്ലോസ്,’ ‘മനുഷ്യർ’ എന്നിവ സ്ഥാപിതവും യോജിച്ചതുമായ രൂപങ്ങളാണ്. ‘ആളാണ്’ ഇവിടെ വ്യക്തിപരമായ ഉടമസ്ഥതയല്ല, വിഭാഗീയ അനുയായിത്തം എന്ന സന്ദർഭാർഥം മതിയായ രീതിയിൽ നൽകുന്നു. അടിക്കുറിപ്പിലെ ‘വെറും മനുഷ്യർ’ എന്നും ‘സാധാരണ മനുഷ്യരെപ്പോലെ പെരുമാറുന്നവർ’ എന്നും സന്ദർഭപരമായ വ്യാഖ്യാനസാധ്യതകൾ ഉചിതമായി വേർതിരിക്കുന്നു.
