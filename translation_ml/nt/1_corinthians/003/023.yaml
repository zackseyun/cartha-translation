  text: ὑμεῖς δὲ Χριστοῦ, Χριστὸς δὲ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/023.yaml
  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: ml
  text: നിങ്ങളോ മശീഹായ്ക്കുള്ളവരാണ്[a][b]; മശീഹാ ദൈവത്തിനുള്ളവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നിങ്ങൾ മശീഹായുടേതാണ്; മശീഹാ ദൈവത്തിന്റേതാണ്.’'
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗത മലയാള പരിഭാഷകളിൽ ‘മശീഹാ’ എന്നതിനുപകരം ‘ക്രിസ്തു’ എന്നു സാധാരണയായി കാണുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: δὲ
  choice: -ഓ … -ഓ
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള δέയുടെ തുടർച്ചയും താരതമ്യാത്മകമായ വ്യത്യാസവും മലയാളത്തിലെ വിഷയസൂചകമായ ‘-ഓ’ നിലനിർത്തുന്നു.
- source_word: Χριστοῦ / Χριστὸς
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി വരുന്നതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണമായ ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ ‘മശീഹാ’ അതിന്റെ സ്ഥാനപ്പേരായ അർഥം വ്യക്തമാക്കുന്നു; ആവർത്തനം വാക്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റേത്
  rationale: θεός എന്ന പദത്തിന്റെ ഏകവചന ജനിറ്റീവ് രൂപം സൂചിപ്പിക്കുന്ന ബന്ധം വിശദീകരിക്കാതെ, മലയാളത്തിലെ ഉടമസ്ഥതാസൂചക രൂപത്തിലൂടെ സംക്ഷിപ്തമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστοῦ, θεοῦ എന്നീ ജനിറ്റീവ് രൂപങ്ങളിലെ ബന്ധം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ‘മശീഹായുടേത്’, ‘ദൈവത്തിന്റേത്’ എന്ന സമാന്തര ഉടമസ്ഥതാരൂപങ്ങൾ
  alternative: ‘മശീഹായ്ക്കുള്ളവർ’, ‘ദൈവത്തിനുള്ളവൻ’ അഥവാ ‘മശീഹായുടേതാകുന്നു’, ‘ദൈവത്തിന്റേതാകുന്നു’
  rationale: ഗ്രീക്ക് വാക്യം ബന്ധത്തെ വിശദീകരിക്കാതെ സംക്ഷിപ്തമായി പ്രസ്താവിക്കുന്നു. സമാന്തര ഉടമസ്ഥതാരൂപങ്ങൾ അതിന്റെ വാക്യഘടനയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു; ബന്ധത്തിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആണ്’ എന്ന സ്വാഭാവിക ബന്ധകക്രിയയും സമാന്തര ഉടമസ്ഥതാരൂപങ്ങളും ഉപയോഗിച്ച് മൂലവാക്യത്തിന്റെ ലഘുതയും താളവും നിലനിർത്തിയിരിക്കുന്നു.
