  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον μενεῖ ὃ ἐποικοδόμησεν, μισθὸν λήμψεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/014.yaml
  text: If anyone’s work that he built on remains[b][a], he will receive a reward.
translation:
  language: ml
  text: ഒരാൾ അതിന്മേൽ പണിത പ്രവൃത്തി നിലനിൽക്കുന്നുവെങ്കിൽ[a], അയാൾക്ക് പ്രതിഫലം[b] ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈടുനിൽക്കുന്നുവെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘കൂലി’ അല്ലെങ്കിൽ ‘പ്രതിഫലത്തുക.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ
  choice: എങ്കിൽ
  rationale: ലളിതമായ വ്യവസ്ഥാസൂചക പ്രയോഗമായതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ‘എങ്കിൽ’ ഉപയോഗിച്ചു.
- source_word: τινος
  choice: ഒരാൾ
  rationale: അനിശ്ചിത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ അർഥം ലിംഗനിർണ്ണയം കൂടാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ ἔργον
  choice: പ്രവൃത്തി
  rationale: നിർമാണരൂപകത്തോടൊപ്പം ചേരുന്നതും പ്രവർത്തനഫലത്തെ അമിതമായി പ്രത്യേകവത്കരിക്കാത്തതുമായ വിശാല പദം.
- source_word: μενεῖ
  choice: നിലനിൽക്കുന്നെങ്കിൽ
  rationale: ഭാവികാലസന്ദർഭത്തിലെ ‘നിലനിൽക്കുക, തുടർന്നിരിക്കുക’ എന്ന അടിസ്ഥാനാർഥം സൂക്ഷിക്കുന്നു; തീയുടെ പരിശോധനയെ മുൻനിർത്തിയുള്ള ‘അതിജീവിക്കുക’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: ὃ ἐποικοδόμησεν
  choice: പണിതുയർത്തിയ
  rationale: ഒരു അടിത്തറയ്ക്കുമേൽ പണിയുക എന്ന സംയുക്തക്രിയയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ ഈ വാക്യത്തിൽ വ്യക്തമാക്കാത്ത ‘അടിത്തറ’ എന്ന കർമം പ്രത്യേകം ചേർത്തിട്ടില്ല.
- source_word: μισθὸν
  choice: പ്രതിഫലം
  rationale: പ്രവൃത്തിക്കു ലഭിക്കുന്ന തിരിച്ചുനൽകൽ എന്ന അർഥം നിലനിർത്തുകയും ‘കൂലി’ എന്ന സാമ്പത്തിക അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: λήμψεται
  choice: ലഭിക്കും
  rationale: ‘സ്വീകരിക്കും/ലഭിക്കും’ എന്ന ഭാവികാലാർഥം ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: μισθός എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: പ്രതിഫലം
  alternative: കൂലി / പ്രതിഫലത്തുക
  rationale: ദൈവിക വിലയിരുത്തലിന്റെ സന്ദർഭത്തിൽ ലഭിക്കുന്ന തിരിച്ചുനൽകൽ എന്ന ആശയം സൂക്ഷിക്കുന്നു; അതിനെ നിർബന്ധമായി തൊഴിൽക്കൂലിയായോ പ്രത്യേക രക്ഷാശാസ്ത്രപരമായ പ്രതിഫലമായോ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് പാഠത്തിൽ ലിംഗസൂചക സർവനാമമില്ലാത്തതിനാൽ ‘ആ വ്യക്തിക്ക്’ എന്ന ലിംഗനിരപേക്ഷ പ്രയോഗം സ്വീകരിച്ചു. നിർമാണരൂപകം ‘പണിതുയർത്തിയ’ എന്നതിലൂടെ നിലനിർത്തി.
