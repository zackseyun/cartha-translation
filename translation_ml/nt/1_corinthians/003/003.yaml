id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: ml
  text: നിങ്ങൾ ഇപ്പോഴും ജഡപ്രകാരമുള്ളവരാണ്. കാരണം, നിങ്ങളുടെ ഇടയിൽ അസൂയയും കലഹവും ഉള്ളതുകൊണ്ട്, നിങ്ങൾ ജഡപ്രകാരമുള്ളവരും മനുഷ്യരീതിയിൽ നടക്കുന്നവരുമ[a] അല്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വെറും മനുഷ്യരെപ്പോലെ ജീവിക്കുന്നവരും.”
    reason: κατὰ ἄνθρωπον περιπατεῖτε എന്ന പ്രയോഗത്തിന്റെ കൂടുതൽ സ്വാഭാവികവും വ്യാഖ്യാനാത്മകവുമായ പരിഭാഷ.
lexical_decisions:
- source_word: ἔτι
  choice: ഇപ്പോഴും
  rationale: അവരുടെ അവസ്ഥ തുടരുന്നു എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: രണ്ടു വാക്യഘടകങ്ങളിലുമുള്ള വിശദീകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; രണ്ടാമത്തേതിൽ ആവർത്തനം ഒഴിവാക്കിയാലും ബന്ധം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: σαρκικοί
  choice: ജഡപ്രകാരമുള്ളവർ
  rationale: σάρξ-നോടുള്ള പദബന്ധം നിലനിർത്തുകയും ‘പാപസ്വഭാവത്താൽ നിയന്ത്രിക്കപ്പെടുന്നവർ’ എന്ന വ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു. ‘ജഡികർ’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് അർഥം ഗ്രഹിക്കാൻ സൗകര്യമുണ്ട്.
- source_word: ὅπου
  choice: ഉള്ളപ്പോൾ
  rationale: ഗ്രീക്കിലെ സാന്നിധ്യസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി സാഹചര്യാർഥത്തിൽ അവതരിപ്പിക്കുന്നു; അസൂയയും കലഹവും അവരുടെ ഇടയിൽ നിലനിൽക്കുന്നതാണ് പൗലോസിന്റെ നിഗമനത്തിന് തെളിവ്.
- source_word: ζῆλος
  choice: അസൂയ
  rationale: ἔρις-നോടൊപ്പം വരുന്ന പ്രതികൂല സന്ദർഭത്തിൽ ‘തീക്ഷ്ണത’ എന്ന അനുകൂലാർഥമല്ല, ബന്ധങ്ങളെ തകർക്കുന്ന അസൂയയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἔρις
  choice: കലഹം
  rationale: വാക്കുതർക്കത്തിൽ മാത്രം ഒതുങ്ങാതെ ഭിന്നതയും സംഘർഷവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നൽകുന്നു.
- source_word: οὐχὶ
  choice: അല്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യം അധിക ഊന്നൽ ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: κατὰ ἄνθρωπον
  choice: മനുഷ്യരുടെ രീതിയിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ἄνθρωπον പൊതുവായ മനുഷ്യരീതിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി പൊതുവാചകമായ ബഹുവചനം ഉപയോഗിച്ചു. ‘വെറും മനുഷ്യരെപ്പോലെ’ എന്ന വ്യാഖ്യാനാത്മക സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: περιπατεῖτε
  choice: നടക്കുന്നവർ
  rationale: പൗലോസിന്റെ ധാർമിക ജീവിതത്തെ സൂചിപ്പിക്കുന്ന ‘നടക്കുക’ എന്ന രൂപകം പരത്താതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: σαρκικοί എന്ന പദത്തിലെ σάρξ-ബന്ധിത ഭാഷ
  choice: ജഡപ്രകാരമുള്ളവർ
  alternative: ലൗകികർ; പാപസ്വഭാവമുള്ളവർ
  rationale: വിശ്വാസികളുടെ പെരുമാറ്റം ജഡത്താൽ അടയാളപ്പെടുന്നു എന്ന പൗലോസിന്റെ ശാസന നിലനിർത്തുന്നു; എന്നാൽ ‘പാപസ്വഭാവം’ പോലുള്ള സമ്പൂർണ ദൈവശാസ്ത്ര വ്യാഖ്യാനം മൂലപദത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: κατὰ ἄνθρωπον എന്ന പ്രയോഗം
  choice: മനുഷ്യരുടെ രീതിയിൽ
  alternative: വെറും മനുഷ്യരെപ്പോലെ
  rationale: മനുഷ്യരുടെ സാധാരണ രീതിയും ആത്മാവിനാൽ രൂപപ്പെടുന്ന പക്വതയും തമ്മിലുള്ള സംഘർഷം തീർപ്പാക്കാതെ നിലനിർത്തുന്നു. കൂടുതൽ വ്യാഖ്യാനാത്മകവും സ്വാഭാവികവുമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡപ്രകാരമുള്ളവർ’ എന്നും ‘നടക്കുന്നവർ’ എന്നും ഉപയോഗിച്ച് പൗലോസിന്റെ ജഡ-രൂപകവും നടത്തം-രൂപകവും നിലനിർത്തി; വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
