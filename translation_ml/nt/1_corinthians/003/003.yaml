revisions:
- from: എന്തെന്നാൽ, നിങ്ങൾ ഇപ്പോഴും ജഡപ്രകാരമുള്ളവരാണ്. നിങ്ങളുടെ ഇടയിൽ അസൂയയും കലഹവും ഉള്ളപ്പോൾ, നിങ്ങൾ ജഡപ്രകാരമുള്ളവരും മനുഷ്യരുടെ രീതിയിൽ നടക്കുന്നവരും[a] അല്ലയോ?
