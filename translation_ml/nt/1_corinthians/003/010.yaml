id: 1CO.3.10
reference: 1 Corinthians 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: ml
  text: ദൈവം എനിക്കു നൽകിയ കൃപയനുസരിച്ച്, ജ്ഞാനിയായ ഒരു മുഖ്യനിർമാതാവിനെപ്പോലെ ഞാൻ അടിത്തറയിട്ടു; മറ്റൊരാൾ അതിന്മേൽ പണിയുന്നു. എന്നാൽ ഓരോരുത്തരും താൻ എങ്ങനെ പണിയുന്നു എന്നു ശ്രദ്ധിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ
  choice: അനുസരിച്ച്
  rationale: നൽകപ്പെട്ട കൃപയോടുള്ള പൊരുത്തമോ മാനദണ്ഡമോ സൂചിപ്പിക്കുന്നു; വെറും ഉപകരണാർഥമല്ല.
- source_word: χάριν
  choice: കൃപ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവിക അനുഗ്രഹവും പ്രാപ്തീകരണവും ഉൾക്കൊള്ളുന്ന ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
- source_word: τὴν δοθεῖσάν μοι
  choice: എനിക്കു നൽകപ്പെട്ട
  rationale: കൃപ പൗലോസിന് ദാനമായി ലഭിച്ചതാണെന്ന കർമ്മണി അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: ജ്ഞാനിയായ ഒരു മുഖ്യശില്പിയെപ്പോലെ
  rationale: ὡς എന്ന ഉപമാഭാവവും σοφός എന്ന ജ്ഞാനം/വൈദഗ്ധ്യഭാവവും, നിർമാണത്തിന് മേൽനോട്ടം വഹിക്കുന്ന ἀρχιτέκτων എന്ന പുരാതന പദവിയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: θεμέλιον ἔθηκα
  choice: അടിസ്ഥാനം ഇട്ടു
  rationale: നിർമാണസന്ദർഭത്തിൽ മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗം; ഗ്രീക്കിലെ അനിർദ്ദിഷ്ട നാമരൂപം മലയാളത്തിൽ പ്രത്യേക നിർദ്ദേശകമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: മറ്റൊരാൾ അതിന്മേൽ പണിയുന്നു
  rationale: മറ്റൊരു പ്രവർത്തകനെ സൂചിപ്പിക്കുകയും മുമ്പിട്ട അടിസ്ഥാനംമേലുള്ള തുടർനിർമാണം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ
  choice: എന്നാൽ ഓരോരുത്തരും എങ്ങനെ പണിയുന്നു എന്നു സൂക്ഷിക്കട്ടെ
  rationale: വിതരണാർഥമുള്ള ἕκαστος, ജാഗ്രത ആവശ്യപ്പെടുന്ന ആജ്ഞാർഥ βλεπέτω, നിർമാണരീതിയെ ചോദ്യം ചെയ്യുന്ന πῶς എന്നിവ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἕκαστος എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി
  choice: ഓരോരുത്തരും
  alternative: ഓരോ പുരുഷനും / ഓരോ വ്യക്തിയും
  rationale: സന്ദർഭത്തിൽ പുരുഷന്മാർക്ക് മാത്രം ബാധകമെന്ന സൂചനയില്ല. ‘ഓരോരുത്തരും’ എന്നത് ഗ്രീക്കിലെ വിതരണാർഥം സംരക്ഷിച്ചുകൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്നതുമാണ്.
- issue: കൃപയും പൗലോസിന്റെ നിർമാണപ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവകൃപയ്ക്ക് അനുസരിച്ച്
  alternative: ദൈവകൃപയാൽ
  rationale: Κατά ഇവിടെ പ്രവർത്തനത്തിന്റെ ഉപകരണം മാത്രം പറയുന്നതിലുപരി ലഭിച്ച കൃപയോടുള്ള പൊരുത്തം സൂചിപ്പിക്കുന്നു; അതിനാൽ കാരണബന്ധം മാത്രം നിർബന്ധിച്ച് വായിക്കുന്നില്ല.
- issue: ἀρχιτέκτων എന്ന പദവിയുടെ അർഥം
  choice: മുഖ്യശില്പി
  alternative: വാസ്തുശില്പി
  rationale: പുരാതന സാഹചര്യത്തിൽ രൂപകല്പന മാത്രം ചെയ്യുന്ന ആധുനിക ‘ആർക്കിടെക്റ്റ്’ എന്നതിനെക്കാൾ നിർമാണത്തിന് നേതൃത്വം നൽകുന്ന പ്രധാന ശില്പി/പണിക്കാരൻ എന്ന ഭാവമാണ് പ്രസക്തം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ നിർമാണരൂപകം മുഴുവനായി നിലനിർത്തി; രണ്ടാം ἐποικοδομεῖ-ൽ അടിസ്ഥാനം വീണ്ടും പറയാതെ ഉറവിടത്തിലെ സ്വാഭാവിക സംക്ഷിപ്തത സംരക്ഷിച്ചു.
