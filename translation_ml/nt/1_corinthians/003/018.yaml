  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: ml
  text: ആരും തന്നെത്തന്നെ വഞ്ചിക്കരുത്. നിങ്ങളിൽ ആരെങ്കിലും ഈ യുഗത്തിൽ[a] ജ്ഞാനിയാണെന്ന് കരുതുന്നെങ്കിൽ, ജ്ഞാനിയാകേണ്ടതിന് അയാൾ മൂഢനായിത്തീരട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഈ യുഗത്തിന്റെ മാനദണ്ഡപ്രകാരം ജ്ഞാനിയാണെന്ന്.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘മൂഢനാകട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: ആരും തന്നെത്തന്നെ വഞ്ചിക്കരുത്
  rationale: സാർവത്രിക നിഷേധവും പ്രതിഫലക സർവനാമവും വിലക്കിന്റെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δοκεῖ σοφὸς εἶναι
  choice: ജ്ഞാനിയാണെന്ന് കരുതുന്നെങ്കിൽ
  rationale: ഇവിടെ δοκεῖ വ്യക്തിയുടെ സ്വയംവിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കരുതുന്നു’ എന്നത് സന്ദർഭോചിതമാണ്.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: കൊരിന്ത്യ വിശ്വാസസമൂഹത്തിനുള്ളിലെ ഒരാളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: ഈ യുഗത്തിൽ
  rationale: αἰών എന്നതിലെ കാലഘട്ടപരമായ അർഥവും പൗലോസിന്റെ ഇപ്പോഴത്തെ യുഗവും ദൈവജ്ഞാനവും തമ്മിലുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: μωρὸς γενέσθω
  choice: മൂഢനായിത്തീരട്ടെ
  rationale: മൂലത്തിലെ നാമവിശേഷണസ്വഭാവമുള്ള predicate-ഉം γενέσθω എന്ന ആജ്ഞാർഥക ‘ആയിത്തീരുക’ എന്ന ചലനവും നിലനിർത്തുന്നു.
- source_word: ἵνα γένηται σοφός
  choice: ജ്ഞാനിയാകേണ്ടതിന്
  rationale: ἵνα അവതരിപ്പിക്കുന്ന ഉദ്ദേശ്യബന്ധവും വാക്യത്തിലെ ഉദ്ദേശപൂർവമായ വിരോധാഭാസവും ചുരുക്കമായ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: αἰών എന്ന പദത്തിന്റെ അർഥം
  choice: ‘യുഗം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ലോകം’ അല്ലെങ്കിൽ ‘ഈ യുഗത്തിന്റെ മാനദണ്ഡപ്രകാരം’
  rationale: ‘യുഗം’ എന്നത് മൂലപദത്തിന്റെ കാലഘട്ടപരമായ സൂക്ഷ്മത നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിൽ ഈ യുഗത്തിന്റെ ജ്ഞാനമാനദണ്ഡങ്ങളെയും സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: μωρός എന്നതിലെ വിരോധാഭാസം
  choice: ‘മൂഢനായിത്തീരട്ടെ’ എന്ന് നൽകി.
  alternative: ‘ഭോഷനാകട്ടെ’ അല്ലെങ്കിൽ ‘മൂഢതയുള്ളവനായിത്തീരട്ടെ’
  rationale: പൗലോസ് ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്ന ശക്തമായ വിരോധാഭാസം മൃദൂകരിക്കാതെ, സ്ഥിരമായ അപമാനപ്പേരായി മാത്രം കേൾക്കാതിരിക്കുന്ന വിധത്തിൽ ‘ആയിത്തീരുക’ എന്ന ക്രിയയോടുകൂടെ നൽകി.
- issue: ഗ്രീക്കിലെ പ്രതിനിധിപരമായ പുല്ലിംഗ ഏകവചനം
  choice: മലയാളത്തിൽ സ്വാഭാവികമായ ‘ആരെങ്കിലും … അയാൾ’ എന്ന ഏകവചനരൂപം ഉപയോഗിച്ചു.
  alternative: ‘അവർ’ എന്ന ലിംഗനിരപേക്ഷ ബഹുമാനരൂപം
  rationale: മൂലത്തിലെ ഏകവചന വാദക്രമം നിലനിർത്തിക്കൊണ്ട് പൊതുവായ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; പുരുഷന്മാർക്കു മാത്രമായി അർഥം ചുരുക്കുന്നില്ല.
