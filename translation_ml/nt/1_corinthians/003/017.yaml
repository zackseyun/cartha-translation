id: 1CO.3.17
reference: 1 Corinthians 3:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: ml
  text: ആരെങ്കിലും ദൈവത്തിന്റെ ആലയത്തെ നശിപ്പിച്ചാൽ[a], ദൈവം അയാളെ നശിപ്പിക്കും; എന്തെന്നാൽ ദൈവത്തിന്റെ ആലയം വിശുദ്ധമാണ്; ആ ആലയം നിങ്ങൾതന്നെയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘നശിപ്പിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ക്രിയയുടെ രണ്ടു പ്രയോഗങ്ങൾക്കും ‘ദുഷിപ്പിക്കുക’ എന്നോ ‘അശുദ്ധമാക്കുക’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങൾ’ എന്നത് ബഹുവചനമാണ്; പൗലോസ് സഭാസമൂഹത്തെ കൂട്ടായി ദൈവത്തിന്റെ ഏക ആലയമായി തിരിച്ചറിയിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: ആലയം
  rationale: ദൈവത്തിന്റെ വിശുദ്ധ വാസസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ναός എന്ന പദത്തിന് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം; ഒരു പൊതുകെട്ടിടമെന്നതിലുപരി വിശുദ്ധസ്ഥാനമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: φθείρει / φθερεῖ
  choice: നശിപ്പിച്ചാൽ / നശിപ്പിക്കും
  rationale: മൂലത്തിലെ ഒരേ ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുകയും മുന്നറിയിപ്പിന്റെ ശക്തി സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘ദുഷിപ്പിക്കുക’, ‘അശുദ്ധമാക്കുക’ എന്നീ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τοῦτον
  choice: അയാളെ
  rationale: τις എന്ന ഏകവചന അനിശ്ചിത വ്യക്തിസൂചനയിലേക്കു തിരിച്ചുപോകുന്ന τοῦτον എന്ന പദത്തിന്റെ വ്യക്തിപരവും ഏകവചനവുമായ സൂചന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἅγιος
  choice: വിശുദ്ധം
  rationale: വിശുദ്ധതയും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട നിലയും പരാവർത്തനം കൂടാതെ വ്യക്തമാക്കുന്ന പതിവും കൃത്യവുമായ പ്രയോഗം.
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: ആ ആലയം നിങ്ങൾതന്നെയാണ്
  rationale: വായനക്കാരെ ദൈവത്തിന്റെ ആലയമായി തിരിച്ചറിയിക്കുന്ന ബന്ധവാക്യം വ്യക്തമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ‘നിങ്ങൾതന്നെ’ എന്നത് ബഹുവചന സമൂഹസൂചനയെ ഊന്നുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നിലനിർത്തുന്നു. ഏകവചനമായ ‘ആലയം’ എന്നതിനൊപ്പം ഇത് സഭാസമൂഹത്തെ കൂട്ടായ നിലയിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഈ വാക്യം പ്രധാനമായി വ്യക്തിവിശ്വാസിയെയാണോ സഭാസമൂഹത്തെയാണോ ദൈവത്തിന്റെ ആലയമായി സൂചിപ്പിക്കുന്നത്
  choice: ബഹുവചനമായ ‘നിങ്ങൾ’ ഏകവചനമായ ‘ആലയം’ എന്നതിനോടു ചേർന്നതിനാൽ, സന്ദർഭത്തിലെ മുഖ്യസൂചന സഭാസമൂഹത്തെയാണ് കൂട്ടായി ദൈവത്തിന്റെ ആലയമായി തിരിച്ചറിയിക്കുന്നത്.
  alternative: വിശാലമായ ബൈബിൾ ദൈവശാസ്ത്രത്തിന്റെ അടിസ്ഥാനത്തിൽ ഇത് വ്യക്തിവിശ്വാസിക്കും ബാധകമാണെന്ന വായന ചിലർ സ്വീകരിക്കുന്നു.
  rationale: മൂലവാക്യത്തിന്റെ വ്യാകരണം ഏകവചനമായ ναός എന്ന പദത്തോടൊപ്പം ബഹുവചനമായ ὑμεῖς ഉപയോഗിക്കുന്നു; അതിനാൽ ഇവിടെ സമൂഹപരമായ അർഥമാണ് ഏറ്റവും സ്വാഭാവികം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ φθείρω എന്ന ക്രിയയുടെ ആവർത്തനവും മുന്നറിയിപ്പിന്റെ തീവ്രതയും സംരക്ഷിച്ചു. ‘ആലയം’ ഏകവചനമായും ‘നിങ്ങൾ’ ബഹുവചനമായും നിലനിർത്തി സമൂഹപരമായ സൂചന വ്യക്തമാക്കിയിരിക്കുന്നു.
