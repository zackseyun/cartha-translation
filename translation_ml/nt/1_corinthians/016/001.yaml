id: 1CO.16.1
reference: 1 Corinthians 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: ml
  text: വിശുദ്ധർക്കുവേണ്ടിയുള്ള[a] ധനശേഖരത്തെ സംബന്ധിച്ച്, ഗലാത്യയിലെ സഭകൾക്കു ഞാൻ നിർദേശം നൽകിയതുപോലെ നിങ്ങളും ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവജനത്തിനുവേണ്ടിയുള്ള.”
    reason: ἅγιοι എന്നതിന് സന്ദർഭാനുസൃതമായ അർഥവ്യക്തീകരണം.
lexical_decisions:
- source_word: Περὶ δὲ
  choice: സംബന്ധിച്ച്
  rationale: ഒരു പുതിയ വിഷയം അവതരിപ്പിക്കുന്ന പൗലോസിന്റെ ലേഖനശൈലിയിലെ പരിവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; മൂലത്തിൽ വ്യക്തമായ കാലസൂചകമായ ‘ഇപ്പോൾ’ ഇല്ലാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
- source_word: λογείας
  choice: ധനശേഖരം
  rationale: പദം പണമായി ശേഖരിക്കുന്ന സഹായധനത്തെ സൂചിപ്പിക്കുന്നു. ‘ധനശേഖരം’ ആ അർഥം വ്യക്തമാക്കുകയും ആരാധനാകർമവുമായി ബന്ധപ്പെട്ട ‘വഴിപാട്’ എന്ന അധിക ആശയം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: വിശുദ്ധർക്കുവേണ്ടിയുള്ള
  rationale: εἰς ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നു; ‘വിശുദ്ധർ’ എന്നത് വിശ്വാസികളെക്കുറിച്ചുള്ള പൗലോസിന്റെ പതിവുപ്രയോഗത്തിന്റെ തുടർച്ച നിലനിർത്തുന്നു.
- source_word: διέταξα
  choice: ഞാൻ നിർദേശം നൽകിയതുപോലെ
  rationale: അധികാരപൂർവമായ നിർദേശത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; എന്നാൽ അനാവശ്യമായി കടുപ്പമുള്ള ‘കല്പിച്ചു’ എന്ന പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἐκκλησίαις
  choice: സഭകൾക്കു
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം.
- source_word: Γαλατίας
  choice: ഗലാത്യയിലെ
  rationale: ഭൂമിശാസ്ത്രനാമത്തിന്റെ മലയാളത്തിലെ പതിവായ ലിപ്യന്തരണം.
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: നിങ്ങളും ചെയ്യുക
  rationale: താരതമ്യസൂചകമായ ‘പോലെ’ മുൻവാക്യത്തിൽ നിലനിർത്തിക്കൊണ്ട്, ആജ്ഞാരൂപത്തിന്റെ നിർദേശബലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സാമ്പത്തികസഹായത്തിന്റെ പശ്ചാത്തലത്തിൽ ἅγιοι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശുദ്ധർ
  alternative: ദൈവജനം
  rationale: വിശ്വാസികളെ വിളിക്കാൻ പൗലോസ് പതിവായി ഉപയോഗിക്കുന്ന പദത്തിന്റെ ശാബ്ദികവും ദൈവശാസ്ത്രപരവുമായ തുടർച്ച ‘വിശുദ്ധർ’ നിലനിർത്തുന്നു. ഇവിടെ പിന്നീട് രൂപപ്പെട്ട വിശുദ്ധപദവി സമ്പ്രദായം ഉദ്ദേശിക്കുന്നില്ല; വായനാസൗകര്യത്തിനായി ‘ദൈവജനം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ധനശേഖരം’ സാമ്പത്തിക അർഥം വ്യക്തമാക്കുന്നു; ‘വിശുദ്ധർ’ പൗലോസിന്റെ പ്രധാന പദപ്രയോഗം സംരക്ഷിക്കുന്നു. മുഖ്യവാചകത്തിലെ [a] അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
