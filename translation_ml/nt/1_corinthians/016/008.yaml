  text: ⸀ἐπιμενῶ δὲ ἐν Ἐφέσῳ ἕως τῆς πεντηκοστῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: ml
  text: എന്നാൽ പെന്തെക്കൊസ്തെ[a] വരെ ഞാൻ എഫെസൊസിൽ താമസിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആഴ്ചകളുടെ ഉത്സവം വരെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: ഞാൻ താമസിക്കും
  rationale: ἐπιμένω എന്ന ക്രിയയുടെ ഭാവികാലരൂപം ഇവിടെ യാത്രാപദ്ധതിയുടെ പശ്ചാത്തലത്തിൽ ഒരു സ്ഥലത്ത് കുറച്ചുകാലം തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘താമസിക്കും’ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യാത്രാപദ്ധതിയോടുള്ള നേരിയ വൈരുധ്യമോ വഴിത്തിരിവോ δέ സൂചിപ്പിക്കുന്നു. അതിനാൽ ‘എന്നാൽ’ അനുയോജ്യമാണ്.
- source_word: ἐν Ἐφέσῳ
  choice: എഫെസൊസിൽ
  rationale: ἐν + ചതുർത്ഥീവിഭക്തി ഇവിടെ വ്യക്തമായ സ്ഥലസൂചനയാണ്. Ἔφεσος എന്ന സ്ഥലനാമത്തിന്റെ പരമ്പരാഗത മലയാളരൂപം ‘എഫെസൊസ്’ ഉപയോഗിച്ചു.
- source_word: ἕως τῆς πεντηκοστῆς
  choice: പെന്തെക്കൊസ്ത് വരെ
  rationale: ἕως + ഷഷ്ഠീവിഭക്തി ഒരു നിശ്ചിത സമയബിന്ദുവരെ തുടരുന്ന കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു. πεντηκοστή എന്നതിന് പുതിയനിയമസന്ദർഭത്തിൽ പരിചിതമായ ‘പെന്തെക്കൊസ്ത്’ സ്വീകരിച്ചു; യഹൂദപശ്ചാത്തലം വ്യക്തമാക്കുന്ന മറ്റൊരു പേര് അടിക്കുറിപ്പിൽ നൽകി.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ലഘുത്വവും യാത്രാപദ്ധതിയുടെ നേരിട്ടുള്ള പ്രസ്താവനയും നിലനിർത്തി; പരമ്പരാഗത ഉത്സവനാമത്തോടൊപ്പം അതിന്റെ യഹൂദപശ്ചാത്തല നാമം അടിക്കുറിപ്പിൽ നൽകി.
