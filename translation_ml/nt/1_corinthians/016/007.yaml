id: 1CO.16.7
reference: 1 Corinthians 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: ml
  text: കാരണം, ഇപ്പോൾ യാത്രാമധ്യേ നിങ്ങളെ കാണാൻ ഞാൻ ആഗ്രഹിക്കുന്നില്ല[a]. കർത്താവ് അനുവദിച്ചാൽ, നിങ്ങളോടൊപ്പം കുറച്ചുകാലം താമസിക്കുമെന്ന് ഞാൻ പ്രതീക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കടന്നുപോകുന്നതിനിടെ” അല്ലെങ്കിൽ “വഴിയിൽവെച്ച്.”
    reason: ἐν παρόδῳ എന്ന പ്രയോഗം യാത്രയ്ക്കിടയിൽ, ഹ്രസ്വമായി നടത്തുന്ന സന്ദർശനത്തെ സൂചിപ്പിക്കുന്നു; സാധ്യമായ സ്വാഭാവിക മലയാള രൂപങ്ങൾ നൽകുന്നു.
lexical_decisions:
- source_word: οὐ θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നില്ല
  rationale: ഇവിടെ θέλω പൗലോസിന്റെ വ്യക്തിപരമായ ആഗ്രഹവും ഉദ്ദേശ്യവും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘ആഗ്രഹിക്കുന്നില്ല’ സ്വാഭാവികവും മാന്യവുമാണ്.
- source_word: ἄρτι
  choice: ഇപ്പോൾ
  rationale: വർത്തമാന സമയത്തെയോ നിലവിലെ സാഹചര്യത്തെയോ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐν παρόδῳ
  choice: കടന്നുപോകുന്ന വഴിയിൽവെച്ച് മാത്രം
  rationale: യാത്രാമധ്യേ നടത്തുന്ന ഹ്രസ്വസന്ദർശനമാണ് ഉദ്ദേശ്യം. ‘മാത്രം’ എന്നത് സന്ദർശനത്തിന്റെ താൽക്കാലികത സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; മറ്റു സാധ്യമായ രൂപങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἰδεῖν
  choice: കാണാൻ
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സന്ദർശിക്കുക എന്ന ആശയവും സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐλπίζω
  choice: ഞാൻ പ്രതീക്ഷിക്കുന്നു
  rationale: ഉറപ്പായ പ്രഖ്യാപനമല്ലാത്ത, ആഗ്രഹത്തോടുകൂടിയ പ്രതീക്ഷയെ പ്രകടിപ്പിക്കുന്നു.
- source_word: χρόνον τινά
  choice: കുറച്ചുകാലം
  rationale: നിശ്ചയിക്കപ്പെടാത്തെങ്കിലും അർഥവത്തായ ഒരു കാലയളവിനെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιμεῖναι
  choice: താമസിക്കാമെന്ന്
  rationale: അവരോടൊപ്പം ഒരു കാലയളവ് തുടരുക എന്ന ἐπιμένωയുടെ സന്ദർഭാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളോടൊപ്പം
  rationale: താമസിക്കുക എന്ന ക്രിയയോടൊപ്പം വ്യക്തികളുടെ സാന്നിധ്യത്തിലും കൂട്ടായ്മയിലും ഇരിക്കുക എന്ന അർഥം നൽകുന്നു.
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: കർത്താവ് അനുവദിച്ചാൽ
  rationale: പദ്ധതി കർത്താവിന്റെ അനുമതിക്ക് വിധേയമാണെന്ന സോപാധിക ആശ്രയം വ്യക്തവും സ്വാഭാവികവുമായി സൂക്ഷിക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ദൈവിക κύριος എന്ന പദത്തിന് മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥാപിതവും മാന്യവുമായ തുല്യപദം; വാക്യം വ്യക്തമാക്കാത്ത പരാമർശവിഷയത്തെ കൂടുതൽ നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘കർത്താവ്’ എന്നതിന്റെ പരാമർശവിഷയം
  choice: ‘കർത്താവ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, യേശുവെന്നോ പിതാവായ ദൈവമെന്നോ പ്രത്യേകം നിർണ്ണയിക്കാതിരിക്കുക.
  alternative: ‘കർത്താവായ യേശു’ അല്ലെങ്കിൽ ‘ദൈവം’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριος എന്നുമാത്രമാണ്; അതിനാൽ മൂലപാഠത്തിലെ തുറന്ന നിലയും ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, മാന്യമായ മലയാളം. വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഒഴുക്കിനനുസരിച്ച് ക്രമപ്പെടുത്തി; മൂലത്തിലെ γὰρ രണ്ടുതവണ വരുന്നതിൽ ആദ്യത്തേത് ‘കാരണം’ എന്നു പ്രകടമാക്കി, രണ്ടാമത്തേത് മലയാളത്തിൽ ആവർത്തിക്കാതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു.
