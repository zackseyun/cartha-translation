  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: ml
  text: ഏഷ്യയിലെ സഭകൾ നിങ്ങൾക്ക് വന്ദനം അറിയിക്കുന്നു.[a] അക്വിലായും പ്രിസ്കയും അവരുടെ വീട്ടിലെ സഭയോടൊപ്പം കർത്താവിൽ നിങ്ങൾക്ക് ഹൃദയപൂർവം വന്ദനം അറിയിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “ഏഷ്യ” എന്നത് ആധുനിക ഏഷ്യാഭൂഖണ്ഡത്തെയല്ല, ഏഷ്യാമൈനറിന്റെ പടിഞ്ഞാറൻ ഭാഗത്തുള്ള റോമൻ പ്രവിശ്യയായ ഏഷ്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: b
    text: ഗ്രീക്കുപാഠത്തിൽ പേര് “പ്രിസ്ക” എന്നാണ്; മറ്റിടങ്ങളിൽ അവൾ “പ്രിസ്കില്ല” എന്നും അറിയപ്പെടുന്നു (ഉദാ. അപ്പൊ. 18:2, 18, 26; റോമ. 16:3).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: വന്ദനം അറിയിക്കുന്നു
  rationale: ἀσπάζομαι എന്നതിന് ഇവിടെ അഭിവാദ്യം അഥവാ വന്ദനം അറിയിക്കുക എന്ന സാധാരണ അർഥമാണ്. കത്തുകളുടെ സമാപനസന്ദർഭത്തിൽ ‘വന്ദനം അറിയിക്കുന്നു’ സ്വാഭാവികവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: αἱ ἐκκλησίαι
  choice: സഭകൾ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἐκκλησία സാധാരണയായി പ്രാദേശിക ക്രൈസ്തവ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ബഹുവചനത്തിന് ‘സഭകൾ’ വ്യക്തവും പതിവുമായ പരിഭാഷയാണ്.
- source_word: τῆς Ἀσίας
  choice: ഏഷ്യയിലെ
  rationale: മൂലപാഠത്തിലെ ഭൂമിശാസ്ത്രനാമം നിലനിർത്തുന്നു. ഇവിടെ ആധുനിക ഭൂഖണ്ഡമല്ല, റോമൻ പ്രവിശ്യയാണ് ഉദ്ദേശിക്കുന്നത് എന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ സവിശേഷമായ ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ പ്രയോഗം വ്യാഖ്യാനിച്ചു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: πολλὰ
  choice: ഹൃദയപൂർവം
  rationale: ἀσπάζεται എന്ന ക്രിയയെ πολλὰ ശക്തിപ്പെടുത്തുന്നു. അക്ഷരാർഥത്തിലുള്ള ‘വളരെ’ എന്നതിനെക്കാൾ അഭിവാദ്യത്തിന്റെ ഊഷ്മളത സ്വാഭാവിക മലയാളത്തിൽ ‘ഹൃദയപൂർവം’ വ്യക്തമാക്കുന്നു.
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: അക്വിലാസും പ്രിസ്കയും
  rationale: SBLGNT-യിലെ പേരുകളുടെ രൂപം ലിപ്യന്തരണം ചെയ്യുന്നു. Πρίσκα എന്ന ഹ്രസ്വരൂപത്തിന് ‘പ്രിസ്ക’ ഉപയോഗിക്കുന്നു; ‘പ്രിസ്കില്ല’ എന്ന മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: അവരുടെ വീട്ടിലെ സഭയോടൊപ്പം
  rationale: വീട്ടുമായി ബന്ധപ്പെട്ട പ്രാദേശിക വിശ്വാസസമൂഹം എന്ന അർഥം അടുത്തും സ്വാഭാവികവുമായി നൽകുന്നു; ‘കൂടിവരുന്ന’ എന്ന ആശയം പ്രധാനപാഠത്തിൽ കൂട്ടിച്ചേർക്കാതെ മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഗൃഹസന്ദർഭത്തിലെ ἐκκλησία എന്നതിന്റെ അർഥം
  choice: അവരുടെ വീട്ടിലെ സഭ എന്നത് അക്വിലാസിന്റെയും പ്രിസ്കയുടെയും വീട്ടിൽ കൂടിവന്നിരുന്ന പ്രാദേശിക ക്രൈസ്തവ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്നു
  alternative: അവരുടെ കുടുംബത്തെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ ‘ഗൃഹസഭ’ എന്ന സ്ഥാപനപരമായ സംജ്ഞ
  rationale: κατ’ οἶκον ... ἐκκλησίᾳ എന്ന പ്രയോഗവും പൗലോസിന്റെ സാധാരണ ἐκκλησία പ്രയോഗവും ഒരു വീട്ടുമായി ബന്ധപ്പെട്ട വിശ്വാസസമൂഹത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ഏതെങ്കിലും പ്രത്യേക സഭാഭരണരീതി ഇതിൽ ചേർക്കുന്നില്ല.
- issue: κύριος എന്നതിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ἐν κυρίῳ എന്ന പൗലോസിന്റെ സ്ഥിരപ്രയോഗത്തിൽ ‘കർത്താവ്’ അതിന്റെ വിശ്വാസപ്രഖ്യാപനപരവും ബന്ധപരവുമായ ഭാവം നിലനിർത്തുന്നു; വാക്യം പറയുന്നതിലധികമായി വ്യക്തിയെ നിർവചിക്കുന്നില്ല.
