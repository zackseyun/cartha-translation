  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മാന്യവും സഭാപാരായണത്തിന് അനുയോജ്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കർത്താവിൽ’ എന്ന ദൈവശാസ്ത്രപരമായ പ്രയോഗവും ‘വീട്ടിലെ സഭ’ എന്ന മൂലപാഠസന്നിഹിതമായ ഘടനയും നിലനിർത്തി; രണ്ടാമത്തെ അഭിവാദ്യത്തിലെ πολλὰ എന്ന ഊന്നൽ ‘ഹൃദയപൂർവം’ എന്നു സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
