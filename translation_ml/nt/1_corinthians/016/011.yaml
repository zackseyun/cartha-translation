id: 1CO.16.11
reference: 1 Corinthians 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: ml
  text: അതുകൊണ്ട് ആരും അവനെ നിസ്സാരനായി കാണരുത്. അവൻ എന്റെ അടുക്കൽ എത്തേണ്ടതിന് അവനെ സമാധാനത്തോടെ യാത്രയാക്കുക; കാരണം, സഹോദരന്മാരോടൊപ്പം അവനെ ഞാൻ കാത്തിരിക്കുകയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സഹോദരീസഹോദരന്മാരോടൊപ്പം.” “സഹോദരന്മാർ” എന്നത് വിശ്വാസികളുടെയോ സഹപ്രവർത്തകരുടെയോ ഒരു വിശാലമായ, ഒരുപക്ഷേ സമ്മിശ്രലിംഗ, സംഘത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: അതുകൊണ്ട് ആരും ... അരുത്
  rationale: μή എന്നതിനോടുകൂടിയ aorist subjunctive നിരോധനം പ്രകടിപ്പിക്കുന്നു; οὖν മുൻസന്ദർഭത്തോടുള്ള നിഗമനബന്ധമായി ‘അതുകൊണ്ട്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐξουθενήσῃ
  choice: നിസ്സാരനായി കാണുക
  rationale: ഒരാളെ വിലയില്ലാത്തവനായി കരുതുക, അവജ്ഞയോടെ കാണുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προπέμψατε
  choice: യാത്രയാക്കുക
  rationale: വെറുതെ അയയ്ക്കുക എന്നതിലുപരി തുടർയാത്രയ്ക്ക് വേണ്ട സഹായവും മാന്യമായ യാത്രയയപ്പും സൂചിപ്പിക്കുന്ന സന്ദർഭോചിത പ്രയോഗം.
- source_word: ἐν εἰρήνῃ
  choice: സമാധാനത്തോടെ
  rationale: കലഹമോ തടസ്സമോ കൂടാതെ സൗഹാർദപൂർവം യാത്രയാക്കണമെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἵνα ἔλθῃ πρός με
  choice: അവൻ എന്റെ അടുക്കൽ വരേണ്ടതിന്
  rationale: ἵναയും subjunctive-ഉം പ്രകടിപ്പിക്കുന്ന ഉദ്ദേശ്യാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἐκδέχομαι
  choice: ഞാൻ കാത്തിരിക്കുകയാണ്
  rationale: ഇപ്പോൾ തുടരുന്ന പ്രതീക്ഷാപൂർവമായ കാത്തിരിപ്പിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: μετὰ τῶν ἀδελφῶν
  choice: സഹോദരന്മാരോടൊപ്പം
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ἀδελφῶν നേരിട്ട് നിലനിർത്തുന്നു; ഇത് വിശ്വാസികളുടെയോ സഹപ്രവർത്തകരുടെയോ വിശാലമായ സംഘത്തെ സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀδελφῶν എന്ന പദം സമ്മിശ്രലിംഗ ക്രിസ്തീയ സംഘത്തെ സൂചിപ്പിക്കാനുള്ള സാധ്യത
  choice: സഹോദരന്മാരോടൊപ്പം
  alternative: സഹോദരീസഹോദരന്മാരോടൊപ്പം
  rationale: മൂലഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ പ്രതിനിധാനപരമായ വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിസ്സാരനായി കാണരുത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ἐξουθενέωയുടെ ശക്തി നിലനിർത്തുന്നു; ‘യാത്രയാക്കുക’ προπέμπωയുടെ യാത്രാസഹായ അർഥം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
