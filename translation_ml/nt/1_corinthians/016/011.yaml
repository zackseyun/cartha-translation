- from: അതുകൊണ്ട് ആരും അവനെ നിസ്സാരനായി കാണരുത്. അവൻ എന്റെ അടുക്കൽ വരേണ്ടതിന് അവനെ സമാധാനത്തോടെ യാത്രയാക്കുക; സഹോദരന്മാരോടൊപ്പം അവനെ ഞാൻ കാത്തിരിക്കുകയാണ്.[a]
  to: അതുകൊണ്ട് ആരും അവനെ നിസ്സാരനായി കാണരുത്. അവൻ എന്റെ അടുക്കൽ എത്തേണ്ടതിന് അവനെ സമാധാനത്തോടെ യാത്രയാക്കുക; കാരണം, സഹോദരന്മാരോടൊപ്പം അവനെ ഞാൻ കാത്തിരിക്കുകയാണ്.[a]
