id: 1CO.16.15
reference: 1 Corinthians 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: ml
  text: 'സഹോദരന്മാരേ,[a] ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു: സ്തെഫനാസിന്റെ ഭവനക്കാരെ നിങ്ങൾ അറിയുന്നുവല്ലോ. അവർ അഖായയിലെ ആദ്യഫലമാണ്;[b] വിശുദ്ധന്മാരെ ശുശ്രൂഷിക്കുന്നതിനായി അവർ തങ്ങളെത്തന്നെ സമർപ്പിച്ചു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്. സഭയിലെ എല്ലാവരെയും ഉൾപ്പെടുത്തി അഭിസംബോധന ചെയ്യാൻ ഈ പദം സാധാരണയായി ഉപയോഗിക്കാമായിരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആദ്യഫലം’ എന്നത് അഖായയിൽ ആദ്യം വിശ്വസിച്ചവരിൽപ്പെട്ടവർ എന്ന അർഥം നൽകുന്നതോടൊപ്പം, ദൈവത്തിനായി വേർതിരിച്ച ആദ്യവിഹിതം എന്ന രൂപകവും നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ ക്രിയ ഗൗരവമുള്ള അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു. ‘അഭ്യർഥിക്കുന്നു’ എന്നത് ആ ശക്തി നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികമായ ആധുനിക മലയാളം നൽകുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇത് നേരിയ ആശയമാറ്റം സൂചിപ്പിക്കുന്ന കണികയാണ്. ഈ ഒറ്റവാക്യത്തിൽ ‘എന്നാൽ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വിരുദ്ധഭാവം ഉണ്ടാകും; വാക്യക്രമം തന്നെ മാറ്റം വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ സംബോധനരൂപം നിലനിർത്തുന്നു; സഭ മുഴുവനെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οἴδατε
  choice: നിങ്ങൾ അറിയുന്നുവല്ലോ
  rationale: രൂപത്തിൽ perfect ആയിരുന്നാലും ഇവിടെ വർത്തമാന അർഥമാണ്. അഭിസംബോധിതർക്ക് അറിയാവുന്ന കാര്യം ഓർമിപ്പിക്കുന്ന സന്ദർഭഭാവം ‘അറിയുന്നുവല്ലോ’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οἰκίαν Στεφανᾶ
  choice: സ്തെഫനാസിന്റെ ഭവനക്കാർ
  rationale: οἰκία ഇവിടെ കെട്ടിടത്തെക്കാൾ കുടുംബാംഗങ്ങളും ആശ്രിതരും ഉൾപ്പെടുന്ന household എന്ന സാമൂഹിക ഘടകത്തെ സൂചിപ്പിക്കുന്നു. ‘ഭവനക്കാർ’ അതിനെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: അഖായയിലെ ആദ്യഫലം
  rationale: ‘ആദ്യഫലം’ എന്ന രൂപകം നിലനിർത്തുന്നത് കാലക്രമത്തിൽ ആദ്യം വിശ്വസിച്ചവർ എന്ന ആശയത്തോടൊപ്പം ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ആദ്യവിഹിതത്തിന്റെ സാധ്യതയുള്ള ധ്വനിയും സംരക്ഷിക്കുന്നു.
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: വിശുദ്ധന്മാരെ ശുശ്രൂഷിക്കുന്നതിനായി
  rationale: διακονίαയെ സഭാപദവിയായി ചുരുക്കാതെ സേവനപ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു; dative രൂപം സേവനത്തിന്റെ പ്രയോജനഭോക്താക്കളായ വിശുദ്ധന്മാരെ സൂചിപ്പിക്കുന്നു.
- source_word: ἔταξαν ἑαυτούς
  choice: അവർ തങ്ങളെത്തന്നെ സമർപ്പിച്ചു
  rationale: സ്വയം ഒരു ദൗത്യത്തിനായി നിശ്ചയിക്കുകയും സ്ഥിരമായി ഏർപ്പെടുകയും ചെയ്തതിന്റെ അർഥം നൽകുന്നു; ഔദ്യോഗിക നിയമനം എന്ന ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: സഭയോടുള്ള ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ രൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഇത് മിശ്രസഭയെ ഉൾക്കൊള്ളുന്ന സാധാരണ സംബോധനമായിരിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἀπαρχὴ τῆς Ἀχαΐας എന്ന പ്രയോഗം
  choice: അഖായയിലെ ആദ്യഫലം
  alternative: അഖായയിൽ ആദ്യം വിശ്വസിച്ചവർ
  rationale: വെറും കാലക്രമവിവരമായി വ്യാഖ്യാനം ചുരുക്കാതെ പൗലൊസിന്റെ കൃഷി-ആരാധനാ രൂപകവും അതിലെ സമർപ്പണധ്വനിയും നിലനിർത്തുന്നു.
- issue: οἰκία എന്ന ഏകവചന നാമവും തുടർന്നുള്ള ബഹുവചന ക്രിയയും
  choice: ‘ഭവനക്കാർ’ എന്ന സമൂഹവാചകത്തോട് ‘അവർ’ എന്ന ബഹുവചനം
  alternative: ‘ഭവനം’ എന്ന ഏകവചനരൂപം
  rationale: ഗ്രീക്കിൽ household ഒരു ഏകവചന ഘടകമായി വരുമ്പോഴും ἑαυτούς എന്ന ബഹുവചനം അതിലെ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഭവനക്കാർ—അവർ’ എന്നത് ഈ കൂട്ടായ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാവായനാശൈലി സ്വീകരിച്ചു. ‘വിശുദ്ധന്മാർ’, ‘ആദ്യഫലം’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
