  yaml_path: translation/nt/1_corinthians/016/023.yaml
  text: The grace of the Lord Jesus be with you.
translation:
  language: ml
  text: കർത്താവായ യേശുവിന്റെ കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ ദൈവികമായ അനുഗ്രഹപൂർണ പ്രീതിയെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സ്വാഭാവികവും അർഥസമ്പന്നവുമായ തുല്യപദം.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പുതിയനിയമത്തിലെ ബഹുമാനപദവിയും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ശക്തിയും നിലനിർത്തുന്നു; ‘യജമാനൻ’ എന്നതിനെക്കാൾ ഈ ആശീർവാദസന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ സ്ഥിരപ്പെട്ട രൂപം.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നിങ്ങളോടുകൂടെ’ എന്നാണെങ്കിലും, ക്രിയയില്ലാത്ത ആശീർവാദവാക്യത്തിന്റെ ആശംസാഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തു.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ
  rationale: ജനിറ്റീവ് ഘടനയെ ഉടമസ്ഥത/ഉറവിടം തുറന്നുവെക്കുന്ന സ്വാഭാവിക മലയാള നാമപദബന്ധമായി പരിഭാഷപ്പെടുത്തി; ‘കർത്താവിൽനിന്നുള്ള’ എന്ന് ഉറവിടം മാത്രം വ്യക്തമാക്കി ചുരുക്കിയില്ല.
theological_decisions:
- issue: വ്യക്തമായ ക്രിയയില്ലാത്ത ആശീർവാദസൂത്രം
  choice: ‘ഇരിക്കട്ടെ’ എന്ന ആശംസാക്രിയ ചേർക്കുക
  alternative: ‘കർത്താവായ യേശുവിന്റെ കൃപ നിങ്ങളോടുകൂടെ.’
  rationale: മൂലഗ്രീക്ക് ക്രിയാരഹിതമാണെങ്കിലും വാക്യത്തിന് ആശീർവാദപരമായ ആശംസാഭാവമുണ്ട്. ‘ഇരിക്കട്ടെ’ എന്നത് അധിക ദൈവശാസ്ത്ര ആശയം ചേർക്കാതെ ആ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ പൗലോസിന്റെ സംക്ഷിപ്തമായ സമാപനഭാവം നിലനിർത്തുന്നു.
