translation:
  language: ml
  text: നിങ്ങളും അത്തരക്കാരോടും, ഒപ്പം പ്രവർത്തിക്കുകയും കഠിനാധ്വാനം ചെയ്യുകയും ചെയ്യുന്ന ഏവരോടും വിധേയരാകണമെന്ന് ഞാൻ അഭ്യർഥിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളും അത്തരക്കാരോടും, ഒപ്പം പ്രവർത്തിക്കുകയും കഠിനാധ്വാനം ചെയ്യുകയും ചെയ്യുന്ന ഏവരോടും കീഴ്‌പ്പെടേണ്ടതിന്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: എന്നും … എന്നും ഞാൻ അഭ്യർഥിക്കുന്നു
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച അഭ്യർഥനയുടെ ഉള്ളടക്കം ഈ വാക്യം തുടരുന്നു. ഒറ്റയ്ക്ക് അപൂർണമായി നിൽക്കുന്ന ἵνα-ഉപവാക്യത്തെ മലയാളത്തിൽ സ്വാഭാവികവും അർഥസമ്പൂർണവുമായി അവതരിപ്പിക്കാൻ സന്ദർഭത്തിൽനിന്ന് ‘ഞാൻ അഭ്യർഥിക്കുന്നു’ ആവർത്തിച്ചു ചേർത്തു.
- source_word: καὶ ὑμεῖς
  choice: നിങ്ങളും
  rationale: കൊരിന്ത്യരും അതേ രീതിയിൽ പ്രതികരിക്കണമെന്ന ഉൾപ്പെടുത്തലും ഊന്നലും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑποτάσσησθε
  choice: കീഴ്‌പെട്ടിരിക്കണം
  rationale: അംഗീകരിക്കപ്പെട്ട ശുശ്രൂഷകരോടു സ്വമേധയാ വിധേയരാകുക എന്ന മധ്യമ/കർമണി ഭാവം സൂചിപ്പിക്കുന്നു; അതിരില്ലാത്ത അനുസരണം എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: τοῖς τοιούτοις
  choice: അത്തരത്തിലുള്ളവർക്ക്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സ്തെഫനാസിന്റെ വീട്ടുകാരെപ്പോലെ സേവനത്തിനു സ്വയം സമർപ്പിക്കുന്ന ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ലിംഗപരിധി അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: παντὶ τῷ συνεργοῦντι
  choice: ഒപ്പം പ്രവർത്തിക്കുന്ന ഏവർക്കും
  rationale: συνεργέω എന്ന ക്രിയയുടെ കൂട്ടായ പ്രവർത്തനം എന്ന അർഥവും കൃദ്യന്തരൂപത്തിന്റെ ക്രിയാത്മകതയും നിലനിർത്തുന്നു; ആരോടൊപ്പമെന്നത് ഗ്രീക്കിൽ വ്യക്തമല്ലാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: καὶ κοπιῶντι
  choice: കഠിനാധ്വാനം ചെയ്യുകയും ചെയ്യുന്ന
  rationale: κοπιάω സൂചിപ്പിക്കുന്ന അധ്വാനത്തിന്റെ തീവ്രത സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ആരോടുള്ള കീഴ്‌പെടലാണ് ആവശ്യപ്പെടുന്നത്
  choice: ഇപ്പോൾ പരാമർശിച്ചവരെപ്പോലുള്ള ക്രിസ്തീയ പ്രവർത്തകരോടും അവരോടൊപ്പം അധ്വാനിക്കുന്നവരോടുമുള്ള സ്വമേധയായ വിധേയത്വം
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും ബാധകമായ പൂർണമായ പദവിക്രമാനുസരണം
  rationale: 15–18 വാക്യങ്ങളുടെ ഉടൻസന്ദർഭം സ്തെഫനാസിന്റെ വീട്ടുകാരെയും പ്രവർത്തനത്തിലും അധ്വാനത്തിലും പങ്കുചേരുന്നവരെയും സംബന്ധിച്ചതാണ്. അതിനാൽ വാക്യത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട് അതിൽ ഇല്ലാത്ത സ്ഥാപനപരമോ നിരുപാധികമോ ആയ അധികാരവാദം ചേർത്തിട്ടില്ല.
- issue: ἵνα-യുടെ ബന്ധം
  choice: മുൻവാക്യത്തിലെ അഭ്യർഥനയുടെ ഉള്ളടക്കം തുടരുന്നതായി മലയാളത്തിൽ വ്യക്തമാക്കുക
  alternative: ‘അങ്ങനെ’ എന്ന ഉദ്ദേശ്യസൂചകമായി മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: ഇവിടെ ἵνα മുൻവാക്യത്തിലെ παρακαλῶ-വിനോടു ചേർന്ന് അഭ്യർഥനയുടെ ഉള്ളടക്കം അവതരിപ്പിക്കാം. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ മലയാളത്തിൽ പൂർണതയ്ക്കായി ‘ഞാൻ അഭ്യർഥിക്കുന്നു’ ചേർത്തെങ്കിലും അതിനെ വ്യാഖ്യാനാത്മക ചേർക്കലായി അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കീഴ്‌പെട്ടിരിക്കുക’ വാക്യത്തിന്റെ ഗൗരവം സൂക്ഷിക്കുന്നു; ‘ഒപ്പം പ്രവർത്തിക്കുക’, ‘കഠിനാധ്വാനം ചെയ്യുക’ എന്നിവ സഹകരണവും പ്രയാസകരമായ അധ്വാനവും വേർതിരിച്ചറിയിക്കുന്നു. എല്ലാ [a], [b] അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ നൽകിയിട്ടുണ്ട്.
