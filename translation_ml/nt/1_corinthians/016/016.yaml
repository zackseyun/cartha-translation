- from: അത്തരത്തിലുള്ളവർക്ക് നിങ്ങളും കീഴ്‌പെട്ടിരിക്കണമെന്നും[a] ഒപ്പം പ്രവർത്തിക്കുകയും കഠിനാധ്വാനം ചെയ്യുകയും ചെയ്യുന്ന ഏവർക്കും കീഴ്‌പെട്ടിരിക്കണമെന്നും ഞാൻ അഭ്യർഥിക്കുന്നു.[b]
  to: നിങ്ങളും അത്തരക്കാരോടും, ഒപ്പം പ്രവർത്തിക്കുകയും കഠിനാധ്വാനം ചെയ്യുകയും ചെയ്യുന്ന ഏവരോടും വിധേയരാകണമെന്ന് ഞാൻ അഭ്യർഥിക്കുന്നു.[a]
  rationale: The revision uses one governing expression of voluntary deference for both Greek dative phrases, replaces a less natural stative expression with «വിധേയരാകുക», and makes the inherited appeal from the preceding verse syntactically smooth in a stand-alone Malayalam verse. It preserves the cooperative and strenuous senses of συνεργοῦντι and κοπιῶντι without adding an object or institutional interpretation.
