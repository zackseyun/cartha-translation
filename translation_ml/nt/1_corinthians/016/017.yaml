  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ⸀ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: ml
  text: സ്തെഫനാസും ഫൊർത്തുനാത്തൊസും അഖായിക്കൊസും വന്നതിൽ ഞാൻ സന്തോഷിക്കുന്നു; കാരണം, നിങ്ങളിൽനിന്നുണ്ടായ കുറവ് ഇവർ നികത്തിയിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ അഭാവം ഇവർ നികത്തി.” ‘നിങ്ങളിൽനിന്നുണ്ടായ കുറവ്’ എന്ന പ്രയോഗം കൊരിന്ത്യർക്ക് പൗലോസിനോടൊപ്പം വ്യക്തിപരമായി ഉണ്ടായിരിക്കാൻ കഴിഞ്ഞില്ല എന്നതിനെ സൂചിപ്പിക്കാം; അവരിൽ ധാർമിക ന്യൂനതയുണ്ടെന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: ഞാൻ സന്തോഷിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ നേരിട്ടുള്ള വ്യക്തിപരമായ സന്തോഷപ്രകടനം നിലനിർത്തുന്നു; പൗലോസിന്റെ ലേഖനശൈലിക്കും സ്വാഭാവികമായ മലയാളത്തിനും യോജിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആശയബന്ധമാണ്. മലയാളത്തിലെ വാക്യപ്രവാഹം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വൈരുധ്യം ഉണ്ടാകും.
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: വന്നതിൽ
  rationale: ഇവിടെ παρουσία അന്ത്യകാലപരമായ സാങ്കേതിക അർഥത്തിലല്ല, ഇവരുടെ വ്യക്തിപരമായ വരവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വന്നതിൽ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: സ്തെഫനാസും ഫൊർത്തുനാത്തൊസും അഖായിക്കൊസും
  rationale: ഗ്രീക്ക് വ്യക്തിനാമങ്ങളെ മലയാളലിപിയിൽ ശബ്ദസാമീപ്യത്തോടെ ലിപ്യന്തരം ചെയ്യുന്നു; ആവർത്തിക്കുന്ന καί മലയാളത്തിലെ ‘-ഉം’ സംയോജനത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: പൗലോസ് സന്തോഷിക്കുന്നതിന്റെ കാരണം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: നിങ്ങളുടെ അഭാവം
  rationale: ὑστέρημα എന്നത് കുറവ്, ഇല്ലായ്മ, അഭാവം എന്നീ അർഥങ്ങൾ വഹിക്കുന്നു. സന്ദർഭത്തിൽ കൊരിന്ത്യരുടെ വ്യക്തിപരമായ അസാന്നിധ്യമാണ് സാധ്യതയേറിയ സൂചന; ‘അഭാവം’ ആ അർഥം സ്വാഭാവികമായി നൽകുകയും മൂലത്തിലെ പരിധിയിലുള്ള ദ്വയാർഥസാധ്യത പൂർണമായി ഇല്ലാതാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: οὗτοι
  choice: ഇവർ
  rationale: സമീപത്ത് പേരെടുത്ത മൂന്നു പുരുഷന്മാരിലേക്കുള്ള ഊന്നലുള്ള സൂചന ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: ἀνεπλήρωσαν
  choice: നികത്തിയിരിക്കുന്നു
  rationale: കുറവായിരുന്നതിനെ നിറയ്ക്കുക അഥവാ പകരംവെക്കുക എന്ന ക്രിയയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴത്തെ പ്രസക്തിയും അറിയിക്കുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ അഭാവം/കുറവ്’ എന്ന പ്രയോഗത്തിന്റെ ലക്ഷ്യം
  choice: പ്രധാനവാചകത്തിൽ ‘നിങ്ങളുടെ അഭാവം’ എന്നു നൽകി, അടിക്കുറിപ്പിൽ കൂടുതൽ പദാനുസൃതമായ സാധ്യത രേഖപ്പെടുത്തി.
  alternative: ‘നിങ്ങളുടെ ഭാഗത്തുനിന്ന് കുറവായിരുന്നത്’
  rationale: സന്ദർഭം കൊരിന്ത്യരുടെ വ്യക്തിപരമായ അസാന്നിധ്യത്തിലേക്കാണ് സാധ്യതയോടെ വിരൽചൂണ്ടുന്നത്; എന്നാൽ ഗ്രീക്ക് പ്രയോഗം അതിൽ മാത്രം നിർബന്ധമായി ഒതുങ്ങുന്നില്ല. അതിനാൽ അവരിൽ ധാർമികമായ ന്യൂനത ആരോപിക്കാതെയും മൂലത്തിലെ അർഥവ്യാപ്തി മറച്ചുവെക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ലേഖനശൈലി. ദുഷ്കരമായ പദാനുപദരൂപം ഒഴിവാക്കിയെങ്കിലും ὑστέρημα എന്ന പദത്തിന്റെ യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
