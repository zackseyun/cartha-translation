  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τις οὐ φιλεῖ τὸν ⸀κύριον, ἤτω ἀνάθεμα. ⸂Μαράνα θά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/022.yaml
  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: ml
  text: ആരെങ്കിലും കർത്താവിനെ സ്നേഹിക്കുന്നില്ലെങ്കിൽ, അവൻ ശാപഗ്രസ്തനായിരിക്കട്ടെ.[a] മാരാനാ ഥാ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ പരമ്പരാഗതമായി: ‘അനാഥേമ ആയിരിക്കട്ടെ’; അതായത്, ശാപത്തിൻ കീഴിലായിരിക്കട്ടെ.'
    reason: lexical_alternative
  - marker: b
    text: 'അരമായഭാഷ. ഒരുപക്ഷേ: ‘ഞങ്ങളുടെ കർത്താവേ, വരണമേ!’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ കർത്താവ് വന്നിരിക്കുന്നു.’'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: സ്നേഹിക്കുന്നില്ല
  rationale: φιλέω ഇവിടെ കർത്താവിനോടുള്ള വ്യക്തിപരമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സ്നേഹിക്കുക’ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗമാണ്; വികാരപരമായ അടുപ്പം എന്ന സൂക്ഷ്മഭാവം അനാവശ്യമായി അതിശയിപ്പിക്കുന്നില്ല.
- source_word: κύριον
  choice: കർത്താവിനെ
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ κύριος യേശുവിനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരാണ്. ‘കർത്താവ്’ സ്ഥാപിതമായ പുതിയനിയമ പ്രയോഗവും ക്രിസ്തുവിനെക്കുറിച്ചുള്ള ഭാരം നിലനിർത്തുന്നതുമാണ്.
- source_word: ἤτω
  choice: ആയിരിക്കട്ടെ
  rationale: εἰμί എന്ന ക്രിയയുടെ വർത്തമാനകാല ആജ്ഞാരൂപം ഇവിടെ വിധിപ്രഖ്യാപനാത്മകമായ ആശംസ/കല്പന പ്രകടിപ്പിക്കുന്നു. ‘ആയിരിക്കട്ടെ’ അതിന്റെ ഗൗരവവും ജസ്സീവ് സ്വഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀνάθεμα
  choice: ശാപഗ്രസ്തനായിരിക്കട്ടെ
  rationale: ἀνάθεμα ശാപത്തിന് വിധേയനായവൻ അഥവാ നാശത്തിനായി വേർതിരിക്കപ്പെട്ടവൻ എന്ന ശക്തമായ അർഥം വഹിക്കുന്നു. ‘ശാപഗ്രസ്തൻ’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Μαράνα θά
  choice: മാറാനാ ഥാ
  rationale: ഗ്രീക്ക് അക്ഷരങ്ങളിൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്ന അരമായപ്രയോഗമാണിത്. പദവിഭജനവും കൃത്യമായ അർഥവും വിവാദമായതിനാൽ മുഖ്യവാചകത്തിൽ ലിപ്യന്തരണം നിലനിർത്തി പ്രധാന വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: Μαράνα θά എന്ന അരമായപ്രയോഗത്തിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘മാറാനാ ഥാ’ എന്ന ലിപ്യന്തരണം നിലനിർത്തുക
  alternative: ‘ഞങ്ങളുടെ കർത്താവേ, വരണമേ!’ അല്ലെങ്കിൽ ‘ഞങ്ങളുടെ കർത്താവ് വന്നിരിക്കുന്നു.’
  rationale: അരമായ പദങ്ങൾ എങ്ങനെ വിഭജിക്കണമെന്നതനുസരിച്ച് അർഥം മാറാം. അതിനാൽ ഒരു വ്യാഖ്യാനം മാത്രം തിരഞ്ഞെടുത്ത് യഥാർഥമായ അനിശ്ചിതത്വം ഇല്ലാതാക്കാതെ, മൂലരൂപത്തിന്റെ ആരാധനാപരമായ/ഉദ്ഘോഷാത്മകമായ സ്വഭാവം മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: ἀνάθεμα എന്നതിന്റെ ന്യായവിധിപരമായ ശക്തി
  choice: ‘ശാപഗ്രസ്തനായിരിക്കട്ടെ’
  alternative: ‘അനാഥേമ ആയിരിക്കട്ടെ’ അല്ലെങ്കിൽ ‘ശാപത്തിൻ കീഴിലായിരിക്കട്ടെ’
  rationale: മലയാളത്തിൽ അർഥം വ്യക്തമാക്കിക്കൊണ്ട് വാക്യത്തിന്റെ ഗൗരവമുള്ള വിധിപ്രഖ്യാപന സ്വരം നിലനിർത്തുന്നു; ശാപത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ച് മൂലവാചകത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആരെങ്കിലും… അയാൾ’ എന്ന ഘടന ഗ്രീക്കിലെ അനിശ്ചിത വ്യക്തിസൂചന വ്യക്തമാക്കുന്നു. അരമായ ഉദ്‌ഘോഷം മലയാളലിപിയിൽ ലിപ്യന്തരിച്ചു; അതിന്റെ യഥാർഥമായ അർഥാനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
