source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: ml
  text: തിമൊഥെയൊസ് വന്നാൽ, അവൻ നിങ്ങളോടൊപ്പം ഭയമില്ലാതെ ഇരിക്കേണ്ടതിന് ഉറപ്പാക്കുവിൻ[a]; കാരണം, അവൻ കർത്താവിന്റെ വേല ചെയ്യുന്നു, ഞാനും ചെയ്യുന്നതുപോലെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ നിങ്ങളുടെ ഇടയിൽ ഭയമില്ലാതെ ഇരിക്കേണ്ടതിന് ഉറപ്പാക്കുവിൻ.” ഗ്രീക്ക് പ്രയോഗം തിമൊഥെയൊസ് അവരോടൊപ്പമിരിക്കുന്നതും ഭയരഹിതമായ അവസ്ഥയിൽ ആയിരിക്കുന്നതും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവൻ കർത്താവിന്റെ പ്രവൃത്തി ചെയ്യുന്നു, ഞാനും ചെയ്യുന്നതുപോലെ.” ഗ്രീക്കിൽ, “കർത്താവിന്റെ വേല” എന്ന ആശയം ഒരേ പദകുടുംബത്തിലുള്ള നാമവും ക്രിയയും ഉപയോഗിച്ച് പ്രകടിപ്പിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: തിമൊഥെയൊസ് വന്നാൽ
  rationale: ἐάν സഹിതമുള്ള aorist subjunctive ഭാവിയിലെ യഥാർഥ സാധ്യതയുള്ള വ്യവസ്ഥയെ സൂചിപ്പിക്കുന്നു. δέ ഇവിടെ മൃദുവായ ആശയമാറ്റമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ വ്യവസ്ഥാവാക്യം സ്വാഭാവികമായി അത് വഹിക്കുന്നു.
- source_word: βλέπετε ἵνα
  choice: ശ്രദ്ധിക്കുവിൻ
  rationale: വെറും കാണൽ അല്ല, തിമൊഥെയൊസിന്റെ സുരക്ഷിതമായ സാന്നിധ്യം ഉറപ്പാക്കാനുള്ള സജീവ കരുതലാണ് ആജ്ഞയുടെ ആശയം.
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: അവൻ നിങ്ങളുടെ ഇടയിൽ ഭയമില്ലാതെ കഴിയാൻ
  rationale: γένηται πρὸς ὑμᾶς അവരോടൊപ്പമുള്ള അവന്റെ സാന്നിധ്യവും അവസ്ഥയും ചേർത്ത് സൂചിപ്പിക്കുന്നു. ‘നിങ്ങളുടെ ഇടയിൽ ... കഴിയാൻ’ എന്നത് ഈ ബന്ധപരമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘ഭയമില്ലാതെ’ ἀφόβως-നെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: എന്തെന്നാൽ, ... അവനും കർത്താവിന്റെ വേല ചെയ്യുന്നു
  rationale: γάρ കാരണബന്ധം വ്യക്തമാക്കുന്നു. cognate ഘടനയായ ἔργον ... ἐργάζεται മലയാളത്തിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കി സ്വാഭാവികമായി ‘വേല ചെയ്യുന്നു’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ὡς κἀγώ
  choice: എന്നെപ്പോലെ അവനും
  rationale: κἀγώ എന്നത് καὶ ἐγώ, ‘ഞാനും’, എന്നാണ്. മലയാളത്തിലെ സ്വാഭാവിക താരതമ്യക്രമത്തിൽ ‘എന്നെപ്പോലെ അവനും’ എന്ന് നൽകി പൗലൊസിന്റെയും തിമൊഥെയൊസിന്റെയും ഒരേ കർത്തൃവേലയിലുള്ള പങ്കാളിത്തം നിലനിർത്തുന്നു.
theological_decisions:
- issue: κυρίου എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: കർത്താവ്
  alternative: യേശുകർത്താവ് എന്ന് വ്യക്തമായി വികസിപ്പിക്കൽ
  rationale: പൗലൊസിന്റെ പ്രയോഗത്തിൽ യേശുവായിരിക്കാനുള്ള സാധ്യത വളരെ ശക്തമാണെങ്കിലും, ഗ്രീക്ക് പാഠം ഇവിടെ ‘കർത്താവ്’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ വിവർത്തനം അധിക വ്യക്തീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശ്രദ്ധിക്കുവിൻ’ സഭയെ അഭിസംബോധന ചെയ്യുന്ന ബഹുവചന ആജ്ഞയെ വ്യക്തമാക്കുന്നു. ‘കർത്താവ്’ എന്ന പദം ഉറവിടത്തിലെ ദൈവശാസ്ത്രപരമായ സംക്ഷിപ്തത നിലനിർത്തുന്നു; denominational വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
