reference: 1 Corinthians 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ παραγένωμαι, οὓς ⸀ἐὰν δοκιμάσητε δι’ ἐπιστολῶν, τούτους πέμψω ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: ml
  text: ഞാൻ എത്തുമ്പോൾ, നിങ്ങൾ അംഗീകരിക്കുന്നവരെ കത്തുകൾ സഹിതം നിങ്ങളുടെ ദാനം യെരൂശലേമിലേക്കു കൊണ്ടുപോകാൻ അയയ്ക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ കൃപാപൂർവമായ ദാനം.” ഇവിടെ “ദാനം” എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് “കൃപ” എന്നും അർത്ഥമാകാം; ഈ സന്ദർഭത്തിൽ അത് യെരൂശലേമിലേക്കു കൊണ്ടുപോകുന്ന സംഭാവനയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: ഞാൻ എത്തുമ്പോൾ
  rationale: ὅταν എന്ന പദത്തോടുകൂടിയ aorist subjunctive ഭാവിയിലെ സന്ദർഭത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എത്തുമ്പോൾ’ സ്വാഭാവികമാണ്. δέ ഇവിടെ ലഘുവായ ബന്ധകമായതിനാൽ പ്രത്യേകം വിവർത്തനം ചെയ്യാതിരിക്കുന്നത് പ്രവാഹത്തിന് യോജിക്കുന്നു.
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: നിങ്ങൾ അംഗീകരിക്കുന്നവരെ
  rationale: δοκιμάζω എന്നതിന് പരിശോധിച്ച് യോഗ്യരെന്നു അംഗീകരിക്കുക എന്ന ആശയമുണ്ട്. പ്രതിനിധികളെ തിരഞ്ഞെടുക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘അംഗീകരിക്കുന്നവർ’ ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δι’ ἐπιστολῶν
  choice: കത്തുകളോടുകൂടെ
  rationale: διά + genitive ഇവിടെ മാർഗമോ അനുബന്ധ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. കത്തുകൾ അംഗീകരിക്കപ്പെട്ട പ്രതിനിധികളോടൊപ്പം അയയ്ക്കപ്പെടുന്നു എന്ന ആശയം ‘കത്തുകളോടുകൂടെ’ വ്യക്തമാക്കുന്നു; ‘ശുപാർശക്കത്തുകൾ’ എന്നു പറയുന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനാത്മകമായിരിക്കും.
- source_word: τούτους πέμψω
  choice: അവരെ ... അയയ്ക്കും
  rationale: τούτους മുൻപ് പറഞ്ഞ അംഗീകരിക്കപ്പെട്ടവരെ വീണ്ടും ചൂണ്ടിക്കാണിക്കുന്ന പദമാണ്. മലയാളവാക്യത്തിൽ അവരെ ക്രിയയോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἀπενεγκεῖν
  choice: കൊണ്ടുപോകാൻ
  rationale: infinitive അയയ്ക്കുന്നതിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു. കൊരിന്തിൽനിന്ന് യെരൂശലേമിലേക്കുള്ള ഗതിയെ മലയാളത്തിൽ ‘കൊണ്ടുപോകാൻ’ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὴν χάριν ὑμῶν
  choice: നിങ്ങളുടെ ദാനം
  rationale: ഈ അധ്യായത്തിലെ വിശുദ്ധന്മാർക്കായുള്ള ശേഖരണസന്ദർഭത്തിൽ χάρις ഒരു മൂർത്തമായ സംഭാവനയെ സൂചിപ്പിക്കുന്നു. ‘ദാനം’ വ്യക്തവും മാന്യവുമായ മലയാളമാണ്; χάρις എന്ന പദത്തിലെ കൃപാപൂർവമായ ഔദാര്യത്തിന്റെ നിഴൽാർത്ഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς നഗരത്തിലേക്കുള്ള ദിശ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘യെരൂശലേമിലേക്കു’ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ശേഖരണസന്ദർഭത്തിലെ χάρις എന്ന പദത്തിന്റെ അർത്ഥം
  choice: യെരൂശലേമിലുള്ള വിശ്വാസികൾക്കായുള്ള ദാനം/സംഭാവന
  alternative: കൃപ; കൃപാപൂർവമായ പ്രവൃത്തി
  rationale: 1 കൊരിന്ത്യർ 16-ലെ പശ്ചാത്തലം വിശുദ്ധന്മാർക്കായുള്ള ധനശേഖരണമാണ്. അതിനാൽ ഇവിടെ χάρις അമൂർത്തമായ ‘കൃപ’യെക്കാൾ മൂർത്തമായ ദാനത്തെ സൂചിപ്പിക്കുന്നു; അതേസമയം ഔദാര്യത്തിന്റെ നിഴൽാർത്ഥം പൂർണമായി നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പ് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ ഭാവിസന്ദർഭവും ഉദ്ദേശ്യബന്ധവും നിലനിർത്തി. ‘ശുപാർശക്കത്തുകൾ’ പോലുള്ള അധിക വ്യാഖ്യാനം ഒഴിവാക്കി; കത്തുകൾ പ്രതിനിധികളോടൊപ്പം പോകുന്നു എന്ന ബന്ധം വ്യക്തമായി സൂക്ഷിച്ചു.
