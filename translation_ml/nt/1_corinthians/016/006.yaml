    text: അഥവാ, “എന്റെ തുടർയാത്രയ്ക്ക് എന്നെ സഹായിക്കുക.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ക്രിയയ്ക്ക് യാത്ര പുറപ്പെടുന്ന ഒരാളെ അനുഗമിക്കുകയോ ആവശ്യമായ സഹായം നൽകുകയോ ചെയ്യുക എന്ന അർഥവും ഉൾക്കൊള്ളാം.
