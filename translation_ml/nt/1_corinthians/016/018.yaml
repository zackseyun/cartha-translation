revisions:
- from: കാരണം, അവർ എന്റെ ആത്മാവിനും നിങ്ങളുടെ ആത്മാവിനും നവോന്മേഷം പകർന്നു. അതുകൊണ്ട് ഇങ്ങനെയുള്ള പുരുഷന്മാരെ അംഗീകരിക്കുക[a].
  to: കാരണം, അവർ എന്റെ ആത്മാവിനും നിങ്ങളുടെ ആത്മാവിനും നവോന്മേഷം പകർന്നു. അതുകൊണ്ട് അങ്ങനെയുള്ള പുരുഷന്മാരെ വിലമതിക്കുക[a].
