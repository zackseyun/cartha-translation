  text: ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. ἐπιγινώσκετε οὖν τοὺς τοιούτους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/018.yaml
  text: For they refreshed my spirit and yours[a]. Therefore acknowledge such men.
translation:
  language: ml
  text: കാരണം, അവർ എന്റെ ആത്മാവിനും നിങ്ങളുടെ ആത്മാവിനും നവോന്മേഷം പകർന്നു. അതുകൊണ്ട് അങ്ങനെയുള്ള പുരുഷന്മാരെ വിലമതിക്കുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരിച്ചറിയുക’ അല്ലെങ്കിൽ ‘അംഗീകരിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ പ്രയോഗം പുല്ലിംഗത്തിലാണ്; ഇവിടെ അത് തൊട്ടുമുമ്പ് പറഞ്ഞ പുരുഷന്മാരെയാണ് പ്രത്യേകമായി സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: നവോന്മേഷം പകർന്നു
  rationale: ഇവിടെ ക്രിയ അക്ഷരാർഥത്തിലുള്ള വിശ്രമത്തെയല്ല, ഉള്ളിലെ ആശ്വാസത്തെയും പുതുക്കലിനെയും സൂചിപ്പിക്കുന്നു. ‘നവോന്മേഷം പകർന്നു’ എന്നത് ആ രൂപകാലങ്കാരപരമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് കാരണം നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ഇവിടെ പരിശുദ്ധാത്മാവിനെയല്ല, ഒരാളുടെ ആന്തരിക അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്. എന്നിരുന്നാലും പൗലോസിന്റെ പ്രയോഗവും മൂലപദത്തിന്റെ തുറന്ന അർഥവും നിലനിർത്താൻ ‘ആത്മാവ്’ ഉപയോഗിച്ചു.
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: എന്റെ ആത്മാവിനും നിങ്ങളുടെ ആത്മാവിനും
  rationale: രണ്ടാം ഘടകത്തിൽ ഗ്രീക്കിൽ വിട്ടുകളഞ്ഞിരിക്കുന്ന ‘ആത്മാവ്’ മലയാളത്തിൽ വ്യക്തതയ്ക്കും സ്വാഭാവികതയ്ക്കുമായി ആവർത്തിച്ചു.
- source_word: ἐπιγινώσκετε
  choice: അംഗീകരിക്കുക
  rationale: വെറും തിരിച്ചറിയൽ മാത്രമല്ല, അത്തരക്കാർക്കു തക്ക അംഗീകാരം നൽകുക എന്ന ആഹ്വാനവും ഈ സന്ദർഭത്തിൽ ഉൾപ്പെടുന്നു; ‘ആദരിക്കുക’ എന്നതിലേക്കു അർഥം അതിരുകടത്തുന്നില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്ന് വരുന്ന നിഗമനാത്മക ആഹ്വാനം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοὺς τοιούτους
  choice: ഇങ്ങനെയുള്ള പുരുഷന്മാരെ
  rationale: ഉടൻമുമ്പ് പരാമർശിച്ച സ്തെഫനാസ്, ഫൊർത്തുനാത്തൊസ്, അഖായിക്കൊസ് എന്നീ പുരുഷന്മാരിലേക്കാണ് വാക്യം പ്രത്യേകമായി വിരൽചൂണ്ടുന്നത്; അതിനാൽ സൂചനയുടെ ലിംഗപരമായ പ്രത്യേകത നിലനിർത്തി.
theological_decisions:
- issue: τοὺς τοιούτους എന്ന പ്രയോഗത്തിലെ ലിംഗസൂചന
  choice: ഇങ്ങനെയുള്ള പുരുഷന്മാരെ
  alternative: ഇങ്ങനെയുള്ളവരെ / ഇത്തരക്കാരെ
  rationale: ഈ പ്രയോഗം ചില സന്ദർഭങ്ങളിൽ പൊതുവായി ഉപയോഗിക്കാമെങ്കിലും ഇവിടെ തൊട്ടുമുമ്പ് പേരെടുത്ത മൂന്ന് പുരുഷ സഹപ്രവർത്തകരെയാണ് സൂചിപ്പിക്കുന്നത്. അതിനാൽ പൊതുവൽക്കരിക്കാതെ പ്രത്യേക പരാമർശം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആത്മാവ്’ എന്ന പദം പൗലോസിന്റെ ഭാഷയും അർഥത്തിലെ ആന്തരികതയും നിലനിർത്തുന്നു; ‘നവോന്മേഷം പകർന്നു’ എന്ന പ്രയോഗം അക്ഷരാർഥമല്ലാത്ത ആശ്വാസവും പുതുക്കലും സ്വാഭാവികമായി അറിയിക്കുന്നു.
