  text: നിങ്ങൾ ചെയ്യുന്നതെല്ലാം സ്നേഹത്തോടെ ചെയ്യുക[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ അക്ഷരാർഥത്തിൽ: “നിങ്ങളുടേതെല്ലാം സ്നേഹത്തിൽ ആകട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനരൂപം സമഗ്രമായ വ്യാപ്തി സൂചിപ്പിക്കുന്നു; ‘എല്ലാം’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങൾ ചെയ്യുന്നത്
  rationale: πάνταയോടു ചേർന്ന ഈ ഷഷ്ഠീവിഭക്തി പ്രയോഗം അർഥത്തിൽ സംക്ഷിപ്തമാണ്—അക്ഷരാർഥത്തിൽ ‘നിങ്ങളുടേതെല്ലാം.’ സന്ദർഭത്തിൽ കൊരിന്ത്യരുടെ ഭാഗത്തുനിന്നുള്ള സകല പ്രവർത്തനങ്ങളെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘നിങ്ങൾ ചെയ്യുന്നത്’ എന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തിൽ
  rationale: ἐν എന്നതിന്റെ ‘ൽ/യിൽ’ എന്ന രൂപവും ἀγάπηയുടെ പതിവ് അർഥമായ ‘സ്നേഹം’ എന്നതും നിലനിർത്തുന്നു; പ്രവർത്തനം നടക്കേണ്ട മനോഭാവത്തെയും മേഖലത്തെയും ഈ പ്രയോഗം സൂചിപ്പിക്കാം.
- source_word: γινέσθω
  choice: ചെയ്യപ്പെടട്ടെ
  rationale: γίνομαιയുടെ വർത്തമാനകാല മധ്യമ/കർമണി ആജ്ഞാരൂപമാണിത്. ‘ആകട്ടെ/നടക്കട്ടെ’ എന്ന പ്രബോധനശക്തി, പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളവാക്യത്തിൽ ‘ചെയ്യപ്പെടട്ടെ’ എന്നു നൽകിയിരിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. ഗ്രീക്കിലെ സമഗ്രവ്യാപ്തിയും ‘സ്നേഹത്തിൽ’ എന്ന രൂപകവും നിലനിർത്തിയപ്പോൾ, ὑμῶν എന്ന സംക്ഷിപ്തപ്രയോഗം വായനാസൗകര്യത്തിനായി ‘നിങ്ങൾ ചെയ്യുന്നത്’ എന്നു വ്യക്തമാക്കി.
