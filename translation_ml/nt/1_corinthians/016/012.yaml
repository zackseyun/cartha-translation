reference: 1 Corinthians 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: ml
  text: സഹോദരനായ അപ്പൊല്ലോസിനെക്കുറിച്ചാകട്ടെ, സഹോദരന്മാരോടൊപ്പം നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ അവനോട് വളരെയേറെ അഭ്യർഥിച്ചു. എന്നാൽ, ഇപ്പോൾ വരാൻ അവന് ഒട്ടും മനസ്സുണ്ടായിരുന്നില്ല.[a] അവസരം ലഭിക്കുമ്പോൾ അവൻ വരും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇപ്പോൾ വരാൻ അവൻ ഒട്ടും സന്നദ്ധനായിരുന്നില്ല.” ഗ്രീക്കിൽ കൂടുതൽ അക്ഷരാർഥമായി, “ഇപ്പോൾ വരാൻ അവന് ഒട്ടും മനസ്സുണ്ടായിരുന്നില്ല” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: സഹോദരനായ അപ്പൊല്ലോസിന്റെ കാര്യമാകട്ടെ
  rationale: περὶ δὲ എന്ന വിഷയമാറ്റം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കാര്യമായാകട്ടെ’ എന്നു നൽകി. τοῦ ἀδελφοῦ എന്നതിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘നമ്മുടെ’ ചേർക്കാതെ അപ്പൊല്ലോസിനെ ‘സഹോദരനായ’ എന്നു വിശേഷിപ്പിച്ചു.
- source_word: πολλὰ παρεκάλεσα αὐτὸν
  choice: ഞാൻ അവനോട് വളരെ നിർബന്ധിച്ചു
  rationale: πολλὰ അഭ്യർഥനയുടെ ശക്തി വർധിപ്പിക്കുന്നു; ‘വളരെ നിർബന്ധിച്ചു’ എന്നത് ശക്തമായ ആവർത്തിത അഭ്യർഥനയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: സഹോദരന്മാരോടൊപ്പം നിങ്ങളുടെ അടുക്കൽ വരാൻ
  rationale: ചലനദിശയും കൂടെ യാത്രചെയ്യുന്ന നിർദ്ദിഷ്ട പുരുഷ സഹപ്രവർത്തകരെയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: എന്നാൽ ഇപ്പോൾ വരാൻ അവന് ഒട്ടും മനസ്സുണ്ടായിരുന്നില്ല
  rationale: πάντως ചേർന്ന നിഷേധത്തിന്റെ ഊന്നൽ ‘ഒട്ടും’ കൊണ്ട് നൽകി; θέλημα എന്ന നാമരൂപത്തിന്റെ ഇച്ഛ/മനസ്സ് എന്ന ആശയം സംരക്ഷിച്ചു. സന്ദർഭപ്രകാരം ആ മനസ്സ് അപ്പൊല്ലോസിന്റേതാണ്.
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: അവസരം ലഭിക്കുമ്പോൾ അവൻ വരും
  rationale: εὐκαιρέω സൂചിപ്പിക്കുന്ന അനുകൂലമായ അവസരത്തെ ലളിതമായി നൽകുന്നു; വെറും വ്യക്തിപരമായ സൗകര്യം എന്ന ഭാവം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: οὐκ ἦν θέλημα എന്നതിലെ ഇച്ഛയുടെ കർത്താവ്
  choice: അപ്പൊല്ലോസിന് ഇപ്പോൾ വരാൻ മനസ്സുണ്ടായിരുന്നില്ല
  alternative: ഇപ്പോൾ വരുന്നത് ദൈവഹിതമായിരുന്നില്ല
  rationale: ഏറ്റവും അടുത്തതും സ്വാഭാവികവുമായ സൂചിത കർത്താവ് അപ്പൊല്ലോസാണ്. ദൈവഹിതത്തിലേക്കുള്ള മാറ്റം സൂചിപ്പിക്കുന്ന ഒന്നും വാക്യത്തിൽ ഇല്ല; അങ്ങനെ പരിഭാഷപ്പെടുത്തുന്നത് മൂലത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്രപരമായ അർഥം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാപത്രഭാഷ. ‘സഹോദരന്മാർ’ നിർദ്ദിഷ്ട പുരുഷ യാത്രാസഹചാരികളെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവ്യാപനം നടത്തിയിട്ടില്ല. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പാദക്കുറിപ്പിനോട് കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
