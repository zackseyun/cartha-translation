revisions:
- from: സഹോദരനായ അപ്പൊല്ലോസിന്റെ കാര്യമാകട്ടെ, സഹോദരന്മാരോടൊപ്പം നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ അവനോട് വളരെ നിർബന്ധിച്ചു. എന്നാൽ ഇപ്പോൾ വരാൻ അവന് ഒട്ടും മനസ്സുണ്ടായിരുന്നില്ല.[a] അവസരം ലഭിക്കുമ്പോൾ അവൻ വരും.
