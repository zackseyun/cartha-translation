  yaml_path: translation/nt/1_corinthians/016/013.yaml
  text: Stay alert[a], stand firm in the faith, act courageously[b], be strong.
translation:
  language: ml
  text: ജാഗരൂകരായിരിക്കുക; വിശ്വാസത്തിൽ ഉറച്ചുനിൽക്കുക; ധൈര്യത്തോടെ പെരുമാറുക[a]; ശക്തരാകുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പുരുഷന്മാരെപ്പോലെ പെരുമാറുക.” ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ പുരുഷലിംഗ ചിത്രം ഉൾക്കൊള്ളുന്നുവെങ്കിലും, പ്രയോഗത്തിൽ “ധൈര്യപ്പെടുക” അല്ലെങ്കിൽ “ധീരമായി പെരുമാറുക” എന്നാണ് അർഥം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ശക്തരാക്കപ്പെടുക.” ഗ്രീക്കിൽ ക്രിയ കർമണിപ്രയോഗത്തിലാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: ജാഗരൂകരായിരിക്കുക
  rationale: γρηγορέω എന്ന വർത്തമാനകാല ആജ്ഞാരൂപം തുടർച്ചയായ ജാഗ്രതയെ സൂചിപ്പിക്കുന്നു. ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: στήκετε
  choice: ഉറച്ചുനിൽക്കുക
  rationale: στήκω ഇവിടെ കേവലം നിൽക്കുന്നതല്ല, അചഞ്ചലമായി നിലകൊള്ളുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν τῇ πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ πίστις ഇവിടെ ക്രിസ്തീയ വിശ്വാസത്തിന്റെ മേഖലയെയോ ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘വിശ്വാസത്തിൽ’ എന്നത് ആ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു; ‘ആ വിശ്വാസത്തിൽ’ എന്നത് അനാവശ്യമായി കൃത്രിമമാകും.
- source_word: ἀνδρίζεσθε
  choice: ധൈര്യത്തോടെ പെരുമാറുക[a]
  rationale: ക്രിയയുടെ പദോത്ഭവത്തിലുള്ള പുരുഷലിംഗ ചിത്രം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചുകൊണ്ട്, സന്ദർഭത്തിലെ പ്രയോഗാർഥമായ ധീരമായ പെരുമാറ്റം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κραταιοῦσθε
  choice: ശക്തരാകുക[b]
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിലുള്ള ആജ്ഞയായതിനാൽ ‘ശക്തരാക്കപ്പെടുക’ എന്ന വായന സാധ്യമാണ്; എന്നാൽ exhortation ആയി ‘ശക്തരാകുക’ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസത്തിൽ
  alternative: വിശ്വസിക്കുന്നതിൽ / ആ വിശ്വാസത്തിൽ
  rationale: നിശ്ചയോപപദം ക്രിസ്തീയ വിശ്വാസത്തെയോ വിശ്വാസസമ്മതത്തെയോ സൂചിപ്പിക്കുന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും മലയാളത്തിൽ വേറിട്ട നിശ്ചയോപപദമില്ലാത്തതിനാൽ ‘വിശ്വാസത്തിൽ’ എന്ന സ്വാഭാവിക രൂപം ഉപയോഗിച്ചു; വ്യക്തിപരമായ വിശ്വാസക്രിയയിലേക്ക് അർഥം ചുരുക്കിയിട്ടില്ല.
- issue: ἀνδρίζεσθε എന്നതിലെ പുരുഷലിംഗ ചിത്രം
  choice: ധൈര്യത്തോടെ പെരുമാറുക
  alternative: പുരുഷന്മാരെപ്പോലെ പെരുമാറുക
  rationale: ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ പുരുഷനെ ആധാരമാക്കിയ ഒരു പ്രയോഗമാണെങ്കിലും, അതിന്റെ പതിവ് ആജ്ഞാർഥം ധൈര്യം കാണിക്കുക എന്നതാണ്. മുഖ്യവാചകം പ്രയോഗാർഥം നൽകുന്നു; മൂലത്തിലെ ചിത്രം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: κραταιοῦσθε എന്നതിന്റെ കർമണിപ്രയോഗം
  choice: ശക്തരാകുക
  alternative: ശക്തരാക്കപ്പെടുക
  rationale: മലയാളത്തിലെ സ്വാഭാവിക ആജ്ഞാരൂപം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു. ശക്തി പുറത്തുനിന്ന് ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് കർമണിരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ആജ്ഞാരൂപങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ നാല് ഹ്രസ്വ ആജ്ഞകളുടെ താളവും സമാന്തരഘടനയും അർധവിരാമങ്ങളിലൂടെ നിലനിർത്തി. പദശഃ വിവർത്തനം മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാവുന്നിടത്ത് പ്രയോഗാർഥം മുഖ്യവാചകത്തിലും പദശഃ സാധ്യത അടിക്കുറിപ്പിലും നൽകി.
