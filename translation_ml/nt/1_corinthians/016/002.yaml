id: 1CO.16.2
reference: 1 Corinthians 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: ml
  text: ഓരോ ആഴ്ചയുടെയും ഒന്നാം ദിവസം[a], നിങ്ങളിൽ ഓരോരുത്തനും തന്റെ പക്കൽ[b], തനിക്കു ലഭിക്കുന്ന അഭിവൃദ്ധിക്കനുസരിച്ച്[c] ഒരു വിഹിതം മാറ്റിവെച്ചു ശേഖരിച്ചുവെക്കട്ടെ. അങ്ങനെ, ഞാൻ വരുമ്പോൾ പിരിവുകൾ നടത്തേണ്ടിവരാതിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആഴ്ചയുടെ ഒന്നാം ദിവസം.’ ഗ്രീക്ക് പ്രയോഗം ഇവിടെ ആഴ്ചതോറും ആവർത്തിക്കുന്ന പതിവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘തന്നോടൊപ്പം’ അല്ലെങ്കിൽ ‘തന്റെ അടുക്കൽ.’ ഓരോരുത്തനും പണം വ്യക്തിപരമായി, ഒരുപക്ഷേ വീട്ടിൽ, മാറ്റിവെക്കണമെന്നായിരിക്കാം ഇതിന്റെ അർഥം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘താൻ അഭിവൃദ്ധിപ്പെടുന്നതനുസരിച്ച്.’ ഓരോരുത്തനും തനിക്കു ലഭിച്ച അഭിവൃദ്ധിക്ക് അനുസൃതമായി മാറ്റിവെക്കണമെന്നാണ് ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: എല്ലാ ആഴ്ചയുടെയും ഒന്നാം ദിവസം
  rationale: κατά ചേർന്ന ഈ പ്രയോഗത്തിന് ഇവിടെ വിതരണാത്മകമായ, പതിവായി ആവർത്തിക്കുന്ന അർഥമുണ്ട്. അതിനാൽ ആഴ്ചതോറുമുള്ള പ്രവൃത്തിയെന്ന് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἕκαστος ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തനും
  rationale: നിർദേശം സമൂഹത്തിലെ എല്ലാവർക്കും വ്യക്തിപരമായി ബാധകമാണെന്ന വിതരണാത്മക അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: παρ’ ἑαυτῷ
  choice: തന്റെ പക്കൽ
  rationale: അക്ഷരാർഥമായ ‘തന്നോടൊപ്പം/തന്റെ അടുക്കൽ’ എന്ന ആശയം നിലനിർത്തുകയും, പണം വ്യക്തിപരമായി—ഒരുപക്ഷേ വീട്ടിൽ—മാറ്റിവെക്കുന്നതാകാം എന്ന അവ്യക്തത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τιθέτω θησαυρίζων
  choice: ഒരു തുക മാറ്റിവെച്ച് സ്വരൂപിച്ചുകൊള്ളട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ നിർദേശവും, θησαυρίζων സൂചിപ്പിക്കുന്ന ക്രമേണ ശേഖരിച്ചുവെക്കലും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് നൽകുന്നു.
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: തനിക്കു ലഭിക്കുന്ന അഭിവൃദ്ധിക്കനുസരിച്ച്
  rationale: അനിശ്ചിതവും നിബന്ധനാത്മകവുമായ പ്രയോഗം ഓരോരുത്തർക്കും ലഭിച്ച സാമ്പത്തിക അഭിവൃദ്ധിക്ക് അനുസൃതമായ തുകയെ സൂചിപ്പിക്കുന്നു. ‘സമ്പാദിക്കുന്നതനുസരിച്ച്’ എന്നതിനെക്കാൾ ‘അഭിവൃദ്ധി’ മൂലപദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: അങ്ങനെ, ഞാൻ വരുമ്പോൾ പിരിവുകൾ നടത്തേണ്ടിവരില്ല
  rationale: മുൻകൂട്ടിയുള്ള ആഴ്ചതോറുമുള്ള ശേഖരണത്തിന്റെ ഉദ്ദേശ്യം പൗലോസ് എത്തുമ്പോഴുള്ള അവസാനനിമിഷ പിരിവുകൾ ഒഴിവാക്കലാണെന്ന് മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘സ്വരൂപിച്ചുകൊള്ളട്ടെ’ എന്നത് ക്രമേണ ശേഖരിക്കുന്ന ഭാവം നൽകുന്നു; ‘പിരിവുകൾ’ സാമ്പത്തിക ശേഖരണത്തിന്റെ സന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
