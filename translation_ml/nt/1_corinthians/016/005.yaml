id: 1CO.16.5
reference: 1 Corinthians 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλεύσομαι δὲ πρὸς ὑμᾶς ὅταν Μακεδονίαν διέλθω, Μακεδονίαν γὰρ διέρχομαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/005.yaml
  text: But I will come to you when I have gone through Macedonia[a], for I am going through Macedonia.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ മക്കെദോന്യയിലൂടെ കടന്നുകഴിഞ്ഞാൽ[a] നിങ്ങളുടെ അടുത്തേക്കു വരും; കാരണം ഞാൻ മക്കെദോന്യയിലൂടെ കടന്നുപോകുകയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മക്കെദോന്യയിലൂടെ കടന്നുപോയാൽ.’ ഗ്രീക്കിലെ ക്രിയാരൂപം ഭാവിയിൽ നടക്കുന്ന ഈ യാത്രയെ സൂചിപ്പിക്കുന്നു; മുഖ്യപാഠത്തിലെ ‘കടന്നുകഴിഞ്ഞാൽ’ എന്നത് പൗലോസ് അവരുടെ അടുത്തേക്കു വരുന്നതിനു മുമ്പ് ആ യാത്ര പൂർത്തിയാകുമെന്ന ക്രമം കൂടുതൽ വ്യക്തമായി നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: വരും
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭാവികാലരൂപം കൊരിന്ത്യരുടെ അടുത്തേക്കുള്ള പൗലോസിന്റെ ഭാവിയാത്രയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വരും’ സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ യാത്രാപദ്ധതിയിൽനിന്നുള്ള മൃദുവായ മാറ്റം സൂചിപ്പിക്കുന്നു; ശക്തമായ വിരോധം സൃഷ്ടിക്കാതെ അത് നിലനിർത്തുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുത്തേക്കു
  rationale: ചലനക്രിയയോടൊപ്പമുള്ള πρός വ്യക്തികളുടെ ദിശയിലേക്കുള്ള നീക്കം സൂചിപ്പിക്കുന്നു.
- source_word: ὅταν ... διέλθω
  choice: കടന്നുകഴിഞ്ഞാൽ
  rationale: ഭാവികാലസന്ദർഭത്തിലെ ὅταν സഹിതമുള്ള aorist subjunctive, കൊരിന്തിലേക്കുള്ള വരവിനു മുമ്പായി മക്കെദോന്യയിലൂടെയുള്ള യാത്ര പൂർത്തിയാകുമെന്ന ക്രമം വ്യക്തമാക്കുന്നു.
- source_word: Μακεδονίαν
  choice: മക്കെദോന്യ
  rationale: റോമൻ പ്രവിശ്യയുടെ പേരിന്റെ മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: സന്ദർശനത്തിന്റെ സമയക്രമത്തിനു പിന്നിലെ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: διέρχομαι
  choice: കടന്നുപോകുകയാണ്
  rationale: വർത്തമാനകാലരൂപം പൗലോസിന്റെ നിശ്ചയിച്ചിരിക്കുന്നതോ പുരോഗമിക്കുന്നതോ ആയ യാത്രാമാർഗം സൂചിപ്പിക്കുന്നു; ആദ്യപ്രയോഗത്തിലെ പൂർത്തീകരണഭാവത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ യാത്രാഭാഷ ഉപയോഗിച്ചു. ‘കടന്നുകഴിഞ്ഞാൽ’ എന്ന പ്രയോഗം ഗ്രീക്ക് ക്രിയയുടെ പൂർത്തീകരണഭാവം വ്യക്തമാക്കുന്നു; രണ്ടാം ക്രിയയിൽ ‘കടന്നുപോകുകയാണ്’ ഉപയോഗിച്ച് വർത്തമാനകാല/നിശ്ചിത യാത്രാഭാവം വേർതിരിച്ചു.
