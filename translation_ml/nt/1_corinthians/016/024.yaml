  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ ἀγάπη μου μετὰ πάντων ὑμῶν ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: ml
  text: മശീഹയായ യേശുവിൽ എന്റെ സ്നേഹം നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുയേശുവിൽ.” Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേര് അർഥം വിവർത്തനം ചെയ്ത് “മശീഹ” എന്നും, പരമ്പരാഗതമായി “ക്രിസ്തു” എന്നും നൽകാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: സ്വന്തമായ അടുപ്പവും സ്വയംനൽകുന്ന സ്നേഹവും സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാളപദം.
- source_word: μου
  choice: എന്റെ
  rationale: പൗലോസിന്റെ വ്യക്തിപരമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്ന ലളിതമായ ഉടമസ്ഥസർവനാമം.
- source_word: μετὰ
  choice: കൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ ഇല്ലെങ്കിലും കത്തിന്റെ സമാപനാശംസയായതിനാൽ മലയാളത്തിൽ ആശംസാഭാവം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഇരിക്കട്ടെ’ ചേർത്തു; μετάയുടെ സഹവർത്തിത്വഭാവം ‘കൂടെ’ നിലനിർത്തുന്നു.
- source_word: πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടും
  rationale: കൊരിന്തുസഭയിലെ ഒരാളെയും ഒഴിവാക്കാത്ത സമഗ്രത വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν
  choice: -യിൽ
  rationale: പൗലോസിന്റെ ‘മശീഹയിൽ’ എന്ന ബന്ധ/മണ്ഡലപ്രയോഗത്തെ അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്ന സ്ഥിതിവാചക രൂപം.
- source_word: Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി, മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധം വ്യക്തമാക്കാൻ ‘ആയ’ ഉപയോഗിച്ചു; Ἰησοῦ എന്ന പേര് ‘യേശു’ എന്നു ലിപ്യന്തരിച്ചു.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ എന്ന പൗലോസിന്റെ സമാപനപ്രയോഗത്തിൽ Χριστός എങ്ങനെ നൽകണം
  choice: മശീഹയായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നതിനാൽ അതിന്റെ അർഥം സുതാര്യമാക്കുന്ന ‘മശീഹ’ മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു. പരമ്പരാഗതമായ ‘ക്രിസ്തു’ രൂപം സാധുവായ മറ്റൊരു അവതരണമായി അടിക്കുറിപ്പിൽ നൽകി.
- issue: ക്രിയയില്ലാത്ത ഗ്രീക്ക് സമാപനവാക്യത്തിന്റെ ഭാവം
  choice: ഇരിക്കട്ടെ
  alternative: ഇരിക്കുന്നു
  rationale: മൂലവാക്യത്തിൽ ക്രിയ ഇല്ല. കത്തിന്റെ ആശംസാപരമായ സമാപനസന്ദർഭം കണക്കിലെടുത്ത്, ഒരു വർത്തമാനവസ്തുതയായി തീർപ്പാക്കാതെ ആശംസാഭാവം നൽകുന്ന ‘ഇരിക്കട്ടെ’ സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ കത്തുസമാപനശൈലി. ഗ്രീക്കിലെ ക്രിയാരാഹിത്യം മലയാളത്തിലെ ആശംസാഭാവത്തിലൂടെ സ്വാഭാവികമാക്കി; ഉൾക്കൊള്ളുന്ന ‘എല്ലാവരും’ എന്ന ഊന്നൽ സംരക്ഷിച്ചു.
