id: 1CO.16.4
reference: 1 Corinthians 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ ⸂ἄξιον ᾖ⸃ τοῦ κἀμὲ πορεύεσθαι, σὺν ἐμοὶ πορεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/004.yaml
  text: And if it is worthwhile for me to go also, they will go with me.
translation:
  language: ml
  text: ഞാനും പോകുന്നത് ഉചിതമാണെങ്കിൽ[a], അവർ എന്നോടൊപ്പം പോകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഞാനും പോകുന്നത് പ്രയോജനകരമാണെങ്കിൽ.’ ഗ്രീക്കുപദപ്രയോഗത്തിന് സാഹചര്യത്തിൽ ഉചിതമായത്, യോജിച്ചത്, അല്ലെങ്കിൽ പ്രയോജനകരമായത് എന്നിങ്ങനെ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: —എങ്കിൽ
  rationale: ἐάν വ്യവസ്ഥ സൂചിപ്പിക്കുന്നു; δέ ഇവിടെ നേരിയ ബന്ധകമാണ്. മലയാളത്തിൽ വാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്താൻ പ്രത്യേകമായി ‘എന്നാൽ’ ചേർക്കാതെ വ്യവസ്ഥാപ്രത്യയത്തിലൂടെ ബന്ധം പ്രകടമാക്കി.
- source_word: ἄξιον ᾖ
  choice: ഉചിതമാണെങ്കിൽ
  rationale: നപുംസകലിംഗ വിശേഷണമായ ἄξιον, ᾖയോടൊപ്പം ഇവിടെ വ്യക്തിനിരപേക്ഷ പ്രയോഗമാണ്; പൗലോസിന്റെ ധാർമിക യോഗ്യതയല്ല, അദ്ദേഹം പോകുന്നതിന്റെ സാഹചര്യോചിതത്വമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: τοῦ κἀμὲ πορεύεσθαι
  choice: ഞാനും പോകുന്നത്
  rationale: τοῦയോടുകൂടിയ ക്രിയാനാമരൂപം ഉചിതമായി കണക്കാക്കപ്പെടുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുന്നു; κἀμέയിലെ ചേർക്കൽഭാവം ‘ഞാനും’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: σὺν ἐμοὶ
  choice: എന്നോടൊപ്പം
  rationale: σύν + സമ്പ്രദാനികം സഹയാത്രയെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πορεύσονται
  choice: അവർ ... പോകും
  rationale: ഭാവികാല ക്രിയയുടെ സാധാരണ അർഥം നിലനിർത്തുകയും πορεύεσθαιയുമായുള്ള ക്രിയാപുനരാവർത്തനം സംരക്ഷിക്കുകയും ചെയ്തു.
theological_decisions:
- issue: പൗലോസ് സംഘത്തോടൊപ്പം പോകുന്നതിനെക്കുറിച്ചുള്ള വ്യവസ്ഥയുടെ അർഥം
  choice: പൗലോസും പോകുന്നത് സാഹചര്യത്തിൽ ഉചിതമാണെങ്കിൽ പ്രതിനിധികൾ അദ്ദേഹത്തോടൊപ്പം പോകും.
  alternative: സംഭാവന അത്ര പ്രാധാന്യമുള്ളതാണെങ്കിൽ പൗലോസ് പോകും; അല്ലെങ്കിൽ പൗലോസ് പോകാൻ യോഗ്യനാണെങ്കിൽ പോകും.
  rationale: ἄξιον വ്യക്തിനിരപേക്ഷമാണ്; infinitive clause വിലയിരുത്തപ്പെടുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. അതിനാൽ പൗലോസിന്റെ വ്യക്തിപരമായ യോഗ്യതയോ സംഭാവനയുടെ മൂല്യമോ വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഉചിതം’ സാഹചര്യോചിതത്വം വ്യക്തമാക്കുന്നു; ‘യോഗ്യം’ എന്നു പറഞ്ഞാൽ പൗലോസിന്റെ വ്യക്തിപരമായ യോഗ്യതയായി തെറ്റിദ്ധരിക്കപ്പെടാൻ ഇടയുള്ളതിനാൽ ഒഴിവാക്കി.
