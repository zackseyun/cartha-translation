  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: ml
  text: എല്ലാ സഹോദരന്മാരും നിങ്ങൾക്ക് അഭിവാദനം അറിയിക്കുന്നു.[a] വിശുദ്ധ ചുംബനത്തോടെ പരസ്പരം അഭിവാദ്യം ചെയ്യുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാ സഹോദരന്മാരും സഹോദരിമാരും നിങ്ങൾക്ക് അഭിവാദനം അറിയിക്കുന്നു.” ഇവിടെ “സഹോദരന്മാർ” എന്ന പദം സഹവിശ്വാസികളെ സ്ത്രീപുരുഷഭേദമില്ലാതെ കൂട്ടമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശുദ്ധ ചുംബനം” വിശ്വാസികൾക്കിടയിലെ പതിവായ ഒരു അഭിവാദ്യമായിരുന്നു; അത് വിശുദ്ധതയാൽ അടയാളപ്പെട്ട പരസ്പര കൂട്ടായ്മയെ പ്രകടമാക്കി.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തിലൂടെ ആശംസ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയാണ്; മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പ്രയോഗം. പിന്നാലെയുള്ള അതേ മൂലപദത്തിന്റെ കല്പനാരൂപത്തോടും പദസാമ്യം നിലനിർത്തുന്നു.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: എല്ലാ സഹോദരന്മാരും
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. സഹവിശ്വാസികളെ സ്ത്രീപുരുഷഭേദമില്ലാതെ കൂട്ടമായി സൂചിപ്പിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: നേരിട്ടുള്ള കല്പനയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആദ്യവാക്യത്തിലെ ἀσπάζονται എന്ന ക്രിയയുമായുള്ള പദസാമ്യം സംരക്ഷിക്കുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: അന്യോന്യത വ്യക്തമാക്കുന്ന ലളിതവും സാധാരണവുമായ മലയാളപ്രയോഗം.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: വിശുദ്ധ ചുംബനത്തോടെ
  rationale: ἐν ഇവിടെ മാർഗമോ രീതിയോ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ ചുംബനം എന്ന ദേഹപരമായ അഭിവാദ്യവും അതിന്റെ വിശുദ്ധ സ്വഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിൽ ἀδελφοί എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹവിശ്വാസികൾ
  rationale: വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ മിശ്രലിംഗ വിശ്വാസിസമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കാമെന്ന യഥാർഥ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സഭാപത്ര ശൈലി ഉപയോഗിച്ചു. രണ്ട് ഗ്രീക്ക് ക്രിയാരൂപങ്ങൾക്കും “അഭിവാദ്യം ചെയ്യുക” എന്ന ഒരേ പദപ്രയോഗം നൽകി ആവർത്തനബന്ധം നിലനിർത്തി; സാംസ്കാരിക വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
