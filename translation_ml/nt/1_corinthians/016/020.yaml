  - severity: low
    issue: The lexical-alternative footnote uses an awkward compound for “brothers and sisters.”
    rationale: Modern standard Malayalam normally says “സഹോദരന്മാരും സഹോദരിമാരും,” which is clearer and more natural than “സഹോദരീസഹോദരന്മാർ.”
