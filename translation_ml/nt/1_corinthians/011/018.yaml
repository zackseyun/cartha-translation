id: 1CO.11.18
reference: 1 Corinthians 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: ml
  text: കാരണം, ഒന്നാമതായി, നിങ്ങൾ സഭയായി ഒരുമിച്ചുകൂടുമ്പോൾ[a], നിങ്ങളുടെ ഇടയിൽ ഭിന്നതകൾ ഉണ്ടെന്ന് ഞാൻ കേൾക്കുന്നു; അത് ഒരു പരിധിവരെ ഞാൻ വിശ്വസിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഭായോഗത്തിൽ’ അല്ലെങ്കിൽ ‘സഭയിൽ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കുപദം ഇവിടെ ഒരു പ്രത്യേക കെട്ടിടത്തെയല്ല, ഒരുമിച്ചുകൂടിയ വിശ്വാസിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: ഒന്നാമതായി
  rationale: തുടർന്നുവരുന്ന വാദത്തിലെ ആദ്യ വിഷയം അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ഔപചാരികമായ μέν…δέ ഘടന പൂർത്തിയാകാത്തതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമസൂചകപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: συνερχομένων ὑμῶν
  choice: നിങ്ങൾ … ഒരുമിച്ചുകൂടുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് കാലസൂചകമായി എടുത്തു. ഈ അധ്യായത്തിലെ സഭായോഗസന്ദർഭത്തിൽ συνέρχομαι എന്നതിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: ἐν ἐκκλησίᾳ
  choice: സഭയായി
  rationale: ഇവിടെ പദം ഒരു കെട്ടിടത്തെയല്ല, ഒരുമിച്ചുകൂടിയ വിശ്വാസിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭയായി’ എന്നത് ആ സാമൂഹികവും സഭാത്മകവുമായ അർത്ഥം ചുരുക്കമായി നിലനിർത്തുന്നു.
- source_word: ἀκούω
  choice: ഞാൻ കേൾക്കുന്നു
  rationale: വർത്തമാനകാലവും മറ്റുള്ളവരിൽനിന്ന് ലഭിച്ച വിവരമെന്ന ഭാവവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σχίσματα
  choice: ഭിന്നതകൾ
  rationale: സമൂഹത്തിനുള്ളിലെ പിളർപ്പുകളെയോ വിഭാഗീയ അകൽച്ചകളെയോ സൂചിപ്പിക്കുന്നു; ഔപചാരിക കക്ഷികൾ നിലവിലുണ്ടെന്ന് അനാവശ്യമായി സൂചിപ്പിക്കാതെ അർത്ഥം നൽകുന്നു.
- source_word: ὑπάρχειν
  choice: ഉണ്ടെന്ന്
  rationale: ഭിന്നതകൾ നിലവിലുണ്ടെന്ന പരോക്ഷവിവരത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ μέρος τι
  choice: ഒരു പരിധിവരെ
  rationale: വാർത്തയെ പൗലോസ് പൂർണമായി അല്ല, ഭാഗികമായോ പരിമിതമായോ അംഗീകരിക്കുന്നുവെന്ന സൂക്ഷ്മത വ്യക്തമാക്കുന്നു.
- source_word: πιστεύω
  choice: ഞാൻ വിശ്വസിക്കുകയും ചെയ്യുന്നു
  rationale: സന്ദർഭത്തിൽ പരാമർശിച്ച വാർത്തയാണ് വിശ്വാസത്തിന്റെ പരോക്ഷ കർമ്മം; ‘അത്’ ചേർത്ത് മലയാളത്തിൽ അത് വ്യക്തവും സ്വാഭാവികവുമാക്കി.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യവുമായി ഉള്ള വിശദീകരണാത്മക ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ ἐκκλησία എന്നതിന്റെ അർത്ഥം
  choice: കൂടിവന്ന വിശ്വാസിസമൂഹം എന്ന അർത്ഥത്തിൽ ‘സഭയായി’
  alternative: ‘സഭയിൽ’ അല്ലെങ്കിൽ ‘സഭായോഗത്തിൽ’
  rationale: സന്ദർഭം കർത്താവിന്റെ അത്താഴത്തിനായി കൊരിന്ത്യർ ഒരുമിച്ചുകൂടുന്നതിനെക്കുറിച്ചാണ്. അതിനാൽ പിൽക്കാലത്തെ കെട്ടിടകേന്ദ്രിത അർത്ഥം ഇറക്കുമതി ചെയ്യാതെ, കൂടിവന്ന സമൂഹം എന്ന സഭാത്മക അർത്ഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘സഭയായി ഒരുമിച്ചുകൂടുമ്പോൾ’ എന്ന രൂപം കെട്ടിടത്തെക്കാൾ കൂടിവന്ന സമൂഹത്തെ മുൻനിർത്തുന്നു; ‘ഒരു പരിധിവരെ’ എന്നത് പൗലോസിന്റെ സംവരണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
