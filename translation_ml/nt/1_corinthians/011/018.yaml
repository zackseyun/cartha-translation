  terminology: ‘സഭയായി’ appropriately conveys the congregational sense of ἐν ἐκκλησίᾳ without implying a building. ‘ഭിന്നതകൾ’ is a sound, current equivalent for σχίσματα. The footnote accurately states the lexical alternatives and the non-building sense in this context.
