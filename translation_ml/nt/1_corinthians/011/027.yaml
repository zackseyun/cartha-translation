id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: ml
  text: അതുകൊണ്ട്, ആരെങ്കിലും യോഗ്യമല്ലാത്ത വിധത്തിൽ[a] അപ്പം തിന്നുകയോ കർത്താവിന്റെ പാനപാത്രം കുടിക്കുകയോ ചെയ്താൽ, അയാൾ കർത്താവിന്റെ ശരീരത്തെയും രക്തത്തെയും സംബന്ധിച്ച് കുറ്റക്കാരനായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യോഗ്യമല്ലാത്ത വിധത്തിൽ’ എന്നത് ഗ്രീക്കിലെ ഒരു ക്രിയാവിശേഷണത്തിന്റെ പരിഭാഷയാണ്. അത് തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്ന രീതിയെ വിവരിക്കുന്നു; പങ്കെടുക്കുന്ന വ്യക്തിക്ക് സ്വതവേ യോഗ്യതയില്ലെന്നല്ല പറയുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ പദാനുപദമായി: ‘കർത്താവിന്റെ ശരീരത്തിന്റെയും രക്തത്തിന്റെയും കുറ്റക്കാരനായിരിക്കും.’ ഗ്രീക്ക് പ്രയോഗം ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; കർത്താവിന്റെ ശരീരത്തോടും രക്തത്തോടും ബന്ധപ്പെട്ട കുറ്റബാധ്യത വ്യക്തമാക്കാനാണ് മുഖ്യപാഠത്തിൽ ‘സംബന്ധിച്ച്’ എന്നു നൽകിയിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള കർത്താവിന്റെ അത്താഴത്തെക്കുറിച്ചുള്ള വാദത്തിൽനിന്നുള്ള നിഗമനമാണെന്ന് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὃς ἂν
  choice: ആരെങ്കിലും
  rationale: അനിശ്ചിതവും പൊതുവ്യാപകവുമായ വ്യവസ്ഥയുടെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐσθίῃ
  choice: തിന്നുകയോ ചെയ്താൽ
  rationale: പൊതുവായ വ്യവസ്ഥയിലെ വർത്തമാനകാല സബ്ജങ്ക്റ്റീവിന്റെ ആവർത്തിക്കാവുന്ന പ്രവർത്തനസ്വഭാവം വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: τὸν ἄρτον
  choice: അപ്പം
  rationale: സന്ദർഭത്തിൽ ഇതിനകം പരാമർശിച്ച അപ്പത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ നിർദ്ദേശകപദം ചേർക്കാതെ തന്നെ ഇത് സ്വാഭാവികമാണ്.
- source_word: ἢ
  choice: -യോ ... -യോ
  rationale: ഗ്രീക്കിലെ വികല്പസമുച്ചയത്തിന്റെ ശക്തി നിലനിർത്തി, ഈ രണ്ടു പ്രവൃത്തികളിൽ ഏതെങ്കിലും ഒന്നിനെക്കുറിച്ചും മുന്നറിയിപ്പ് ബാധകമാണെന്ന് കാണിക്കുന്നു.
- source_word: πίνῃ τὸ ποτήριον
  choice: പാനപാത്രം കുടിക്കുകയോ
  rationale: ഉള്ളടക്കത്തെ പാത്രംകൊണ്ട് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു; കർത്താവിന്റെ അത്താഴത്തിന്റെ ഭാഷയിൽ അർഥം വ്യക്തമാണ്.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഉടമസ്ഥതയോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ഷഷ്ഠിവിഭക്തി സ്വാഭാവികമായി നൽകുന്നു; κύριος എന്ന സ്ഥാനപ്പേരിന് പതിവായ മലയാളരൂപമാണിത്.
- source_word: ἀναξίως
  choice: യോഗ്യമല്ലാത്ത വിധത്തിൽ
  rationale: ഇത് വ്യക്തിയുടെ അന്തർലീന യോഗ്യതയെ വിശേഷിപ്പിക്കുന്നതല്ല, തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്ന രീതിയെ വിശേഷിപ്പിക്കുന്ന ക്രിയാവിശേഷണമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἔνοχος ἔσται
  choice: കുറ്റക്കാരനായിരിക്കും
  rationale: കുറ്റബാധ്യതയും ഉത്തരവാദിത്വവും ഉൾക്കൊള്ളുന്ന ഗൗരവമുള്ള അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: τοῦ σώματος καὶ τοῦ αἵματος
  choice: ശരീരത്തെയും രക്തത്തെയും സംബന്ധിച്ച്
  rationale: ἔνοχος-നോടൊപ്പമുള്ള ഷഷ്ഠിവിഭക്തി ഏതിനോടുള്ള ബന്ധത്തിൽ കുറ്റബാധ്യതയുണ്ടെന്നു സൂചിപ്പിക്കുന്നു; നിയമപരമായ സൂക്ഷ്മത അനാവശ്യമായി നിർണയിക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀναξίως എന്നത് കർത്താവിന്റെ അത്താഴത്തിൽ പങ്കെടുക്കുന്ന വ്യക്തിയെയോ പങ്കെടുക്കുന്ന രീതിയെയോ വിശേഷിപ്പിക്കുന്നുവോ
  choice: യോഗ്യമല്ലാത്ത വിധത്തിൽ തിന്നുകയോ കുടിക്കുകയോ ചെയ്യുന്നതാണ് വാക്യം കുറ്റപ്പെടുത്തുന്നത്.
  alternative: സ്വയം അയോഗ്യനായ വ്യക്തി പങ്കെടുക്കുന്നതാണ് വാക്യം കുറ്റപ്പെടുത്തുന്നത്.
  rationale: ἀναξίως ഒരു ക്രിയാവിശേഷണമായി ἐσθίῃ, πίνῃ എന്നീ ക്രിയകളെ വിശേഷിപ്പിക്കുന്നു. അതിനാൽ വ്യക്തിയുടെ അന്തർലീന യോഗ്യതയെക്കുറിച്ചുള്ള പിൽക്കാല സിദ്ധാന്തം പാഠത്തിലേക്ക് ചേർക്കാതെ പ്രവർത്തനരീതിയിലാണ് പരിഭാഷ ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നത്.
- issue: തിന്നുന്നതിനും കുടിക്കുന്നതിനും ഇടയിലെ ἢ എന്നതിന്റെ ശക്തി
  choice: രണ്ടിൽ ഏതെങ്കിലും പ്രവൃത്തി യോഗ്യമല്ലാത്ത വിധത്തിൽ ചെയ്താലും മുന്നറിയിപ്പ് ബാധകമാണ്.
  alternative: രണ്ടു പ്രവൃത്തികളും വേർപെടുത്താനാകാത്ത ഒരു ജോടിയായി കണ്ട് ‘ഉം’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം വികല്പസമുച്ചയമായ ἢ ഉപയോഗിക്കുന്നതിനാൽ ആരാധനാക്രമത്തിലെ പ്രതീക്ഷയ്ക്കനുസരിച്ച് അതിനെ ‘ഉം’ എന്നാക്കി മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവവും വ്യക്തതയും നിലനിർത്തി. ‘യോഗ്യമല്ലാത്ത വിധത്തിൽ’ എന്ന വിപുലരൂപം വ്യാകരണപരമായ നിർണായകത വ്യക്തമാക്കുന്നു. ‘പാനപാത്രം കുടിക്കുക’ എന്ന ഉറവിടത്തിലെ ലക്ഷണാപ്രയോഗം സംരക്ഷിച്ചിട്ടുണ്ട്; ‘അയാൾ’ പൊതുവായ അനിശ്ചിത ഏകവചനത്തെ സൂചിപ്പിക്കുന്നു.
