  to: ഇക്കാരണത്താൽ നിങ്ങളുടെ ഇടയിൽ പലരും ദുർബലരും രോഗികളുമാണ്; ഗണ്യമായൊരു വിഭാഗം ഉറങ്ങിപ്പോയിരിക്കുന്നു[a].
