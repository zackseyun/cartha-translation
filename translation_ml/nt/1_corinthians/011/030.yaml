  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ നിങ്ങളുടെ ഇടയിൽ പലരും ദുർബലരും രോഗികളുമാണ്; ഗണ്യമായൊരു വിഭാഗം ഉറങ്ങിപ്പോയിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ വ്യക്തമായി പറഞ്ഞാൽ, ‘മരിച്ചിരിക്കുന്നു.’ മരണത്തെ സൂചിപ്പിക്കാൻ പൗലൊസ് ഇവിടെ ‘ഉറങ്ങിപ്പോയിരിക്കുന്നു’ എന്ന ആദ്യകാല ക്രൈസ്തവ രൂപകം ഉപയോഗിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻവാക്യങ്ങളിൽ വിവരിച്ച കർത്താവിന്റെ അത്താഴത്തിന്റെ ദുരുപയോഗത്തിലേക്കു വിരൽചൂണ്ടുന്ന വ്യക്തമായ കാരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: വ്യക്തികളുടെ ആന്തരിക അവസ്ഥയെയല്ല, കൊരിന്ത്യസഭാസമൂഹത്തിനിടയിൽ കാണപ്പെട്ട അവസ്ഥയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘നിങ്ങളിൽ’ അതു സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πολλοὶ
  choice: പലരും
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന അളവുസൂചക വിശേഷണത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἀσθενεῖς
  choice: ബലഹീനർ
  rationale: ശാരീരിക ദൗർബല്യം ഉൾപ്പെടുന്ന വിശാലമായ അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള ‘രോഗികൾ’ എന്ന ശക്തമായ പദത്തിൽനിന്ന് വ്യത്യാസം കാക്കുകയും ചെയ്യുന്നു.
- source_word: ἄρρωστοι
  choice: രോഗികൾ
  rationale: ശാരീരിക രോഗാവസ്ഥ വ്യക്തമായി അറിയിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന പദം.
- source_word: κοιμῶνται
  choice: ഉറങ്ങിപ്പോയിരിക്കുന്നു
  rationale: മരണത്തെ സൂചിപ്പിക്കുന്ന ആദിമ ക്രൈസ്തവ രൂപകം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ ഫലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἱκανοί
  choice: കുറേപ്പേർ
  rationale: ഗണ്യമായ ഒരു സംഖ്യ എന്ന അർഥം സ്വാഭാവികമായി നൽകുകയും മുമ്പുള്ള ‘പലരും’ എന്ന പദത്തിന്റെ യാന്ത്രിക ആവർത്തനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κοιμῶνται എന്നത് അക്ഷരാർഥത്തിലുള്ള ഉറക്കമായോ മരണത്തിന്റെ രൂപകമായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: മരണത്തെ സൂചിപ്പിക്കുന്ന രൂപകം എന്ന നിലയിൽ ‘ഉറങ്ങിപ്പോയിരിക്കുന്നു’ എന്നു മുഖ്യപാഠത്തിൽ നിലനിർത്തി
  alternative: ‘മരിച്ചിരിക്കുന്നു’ എന്ന് അർഥം നേരിട്ട് വ്യക്തമാക്കുക, അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘ഉറങ്ങുന്നു’ എന്നു നൽകുക
  rationale: ബലഹീനത, രോഗം, ഉറക്കം എന്ന ക്രമവും ദൈവിക ന്യായവിധിയെക്കുറിച്ചുള്ള സമീപസന്ദർഭവും മരണമാണ് ഉദ്ദേശ്യമെന്നു ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും പൗലൊസിന്റെ രൂപകം നേരിട്ട് ‘മരണം’ എന്നു പരത്താതെ നിലനിർത്തുന്നത് ഉറവിടത്തിന്റെ ഭാഷയും ദൈവശാസ്ത്രപരമായ സ്വരവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉറങ്ങിപ്പോയിരിക്കുന്നു’ എന്ന സാധാരണപ്രയോഗം മൂലപാഠത്തിലെ മരണരൂപകം സംരക്ഷിക്കുന്നു; തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
