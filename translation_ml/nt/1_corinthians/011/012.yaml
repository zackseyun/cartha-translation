id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: ml
  text: കാരണം, സ്ത്രീ പുരുഷനിൽനിന്ന് ഉണ്ടായതുപോലെതന്നെ, പുരുഷനും സ്ത്രീയിലൂടെയാണ് ഉണ്ടാകുന്നത്; എന്നാൽ എല്ലാം ദൈവത്തിൽനിന്നാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭത്തെ പൊതുവായ സ്ത്രീ-പുരുഷബന്ധത്തേക്കാൾ ദാമ്പത്യബന്ധമായി മനസ്സിലാക്കുന്നുവെങ്കിൽ, ‘സ്ത്രീ’, ‘പുരുഷൻ’ എന്നിവ ‘ഭാര്യ’, ‘ഭർത്താവ്’ എന്നിങ്ങനെയും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ഉണ്ടായതുപോലെതന്നെ
  rationale: ὥσπερ എന്ന താരതമ്യഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; γάρ മുൻവാദത്തിന്റെ വിശദീകരണം സൂചിപ്പിക്കുന്നതിനാൽ വാക്യബന്ധത്തിൽ അതിന്റെ കാരണാത്മക സ്വരം പ്രകടമാണ്.
- source_word: ἡ γυνή
  choice: സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. സൃഷ്ടിയും മനുഷ്യജനനവും ഉൾക്കൊള്ളുന്ന പൊതുവായ പ്രസ്താവനയായതിനാൽ ഇവിടെ ‘സ്ത്രീ’ യോജിക്കുന്നു.
- source_word: ἐκ τοῦ ἀνδρός
  choice: പുരുഷനിൽനിന്ന്
  rationale: ἐκ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു; സ്ത്രീ പുരുഷനിൽനിന്ന് ഉണ്ടായെന്ന സൃഷ്ടിസൂചന ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ὁ ἀνήρ
  choice: പുരുഷൻ
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം. γυνήയോടുള്ള പരസ്പരസമതുലിതമായ പൊതുപ്രസ്താവനയിൽ ‘പുരുഷൻ’ കൂടുതൽ യോജിക്കുന്നു.
- source_word: διὰ τῆς γυναικός
  choice: സ്ത്രീയിലൂടെ
  rationale: ജനനത്തിൽ സ്ത്രീ മാർഗമോ മാധ്യമമോ ആകുന്നതിനെ διά + genitive സൂചിപ്പിക്കുന്നു. മുൻപുള്ള ἐκ (‘നിന്ന്’) എന്നതിൽനിന്നുള്ള വ്യത്യാസവും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τὰ δὲ πάντα
  choice: എന്നാൽ എല്ലാം
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വിരുദ്ധതയും മനുഷ്യരുടെ പരസ്പരബന്ധത്തിൽനിന്ന് അന്തിമ ദൈവിക ഉറവിടത്തിലേക്കുള്ള തിരിവും പ്രകടമാക്കുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നാണ്
  rationale: ἐκ ഇവിടെ അന്തിമ ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിൽനിന്നാണ്’ സ്വാഭാവികവും ഊന്നലുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: γυνή / ἀνήρ എന്നീ പദങ്ങളുടെ അർഥം
  choice: പൊതുവായ ‘സ്ത്രീ’, ‘പുരുഷൻ’
  alternative: ‘ഭാര്യ’, ‘ഭർത്താവ്’
  rationale: സൃഷ്ടിയിലെ സ്ത്രീയുടെ ഉത്ഭവവും സാധാരണ മനുഷ്യജനനത്തിലെ പുരുഷന്റെ വരവും വാക്യം ചേർത്തുപറയുന്നതിനാൽ വിവാഹബന്ധത്തിൽ മാത്രം പരിമിതപ്പെടുത്താതെ പൊതുവായ സ്ത്രീ-പുരുഷ അർഥം സ്വീകരിച്ചു; സാധ്യതയുള്ള ദാമ്പത്യവായന അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: സ്ത്രീയുടെയും പുരുഷന്റെയും ഉത്ഭവബന്ധം
  choice: ἐκ എന്നത് ‘നിന്ന്’ എന്നും διά എന്നത് ‘യിലൂടെ’ എന്നും വ്യത്യസ്തമായി വിവർത്തനം ചെയ്തു
  alternative: രണ്ടും ‘നിന്ന്’ എന്നു സമമാക്കുക
  rationale: സൃഷ്ടിയിൽ സ്ത്രീ പുരുഷനിൽനിന്ന് ഉണ്ടായതും ജനനത്തിൽ പുരുഷൻ സ്ത്രീയിലൂടെ ഉണ്ടാകുന്നതും തമ്മിലുള്ള പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ വ്യത്യാസവും പരസ്പരതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഉണ്ടാകുന്നു’ സൃഷ്ടിയെയും ജനനത്തെയും ഒരേപോലെ ആക്കാതെ, ‘നിന്ന്’/‘യിലൂടെ’ എന്ന മൂലപാഠത്തിലെ നിർണായക വ്യത്യാസം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
