id: 1CO.11.29
reference: 1 Corinthians 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐσθίων καὶ ⸀πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: ml
  text: എന്തെന്നാൽ, ശരീരത്തെ വിവേചിച്ചറിയാതെ ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്യുന്നവൻ തനിക്കുതന്നെ ന്യായവിധിക്കിടയാക്കിക്കൊണ്ട് ഭക്ഷിക്കുകയും കുടിക്കുകയും ചെയ്യുന്നു.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ശരീരം’ എന്നതിനുപകരം ‘കർത്താവിന്റെ ശരീരം’ എന്നു കാണുന്നു.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘ശരീരത്തെ വേർതിരിച്ചറിയാതെ.’ ഇത് കർത്താവിന്റെ അത്താഴത്തിന്റെ പ്രാധാന്യം തിരിച്ചറിയുന്നതിനെയോ, ഒരുമിച്ചുകൂടിയ വിശ്വാസിസമൂഹത്തെ തിരിച്ചറിയുന്നതിനെയോ, അല്ലെങ്കിൽ രണ്ടിനെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: ഇത് നീതിന്യായപരമായ വിധിയെയോ വിലയിരുത്തലിനെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള വാക്യങ്ങളിൽ അന്തിമ ശിക്ഷാവിധിയേക്കാൾ ദൈവിക ശിക്ഷണമാണ് പറയുന്നത്; അതിനാൽ ‘ശിക്ഷാവിധി’ എന്നതിനെക്കാൾ വിശാലമായ ‘ന്യായവിധി’ യോജിക്കുന്നു.
- source_word: ἑαυτῷ
  choice: തനിക്കുതന്നെ
  rationale: പ്രതികൂലമായ വിധി ഭക്ഷിച്ചു പാനം ചെയ്യുന്ന വ്യക്തി തന്നെയാണ് വരുത്തിവെക്കുന്നതെന്ന് ദാതിവ് പ്രത്യയത്തിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: διακρίνων
  choice: വിവേചിച്ചറിയുക
  rationale: ശരിയായ വ്യത്യാസം തിരിച്ചറിയുകയും ഉചിതമായി വിലയിരുത്തുകയും ചെയ്യുക എന്ന ഇരട്ടഭാവം നിലനിർത്തുന്നു; കൃത്യമായ വിവക്ഷയെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: τὸ σῶμα
  choice: ശരീരം
  rationale: SBLGNT-യിലെ പാഠം ‘ശരീരം’ എന്നു മാത്രമാണ്. കർത്താവിന്റെ ശരീരമോ വിശ്വാസികളുടെ സമൂഹമെന്ന ശരീരമോ രണ്ടും കൂടിയോ എന്ന വ്യാഖ്യാനസാധ്യത തുറന്നുവെക്കുന്നു.
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: ഭക്ഷിക്കുകയും പാനം ചെയ്യുകയും ചെയ്യുന്നവൻ
  rationale: ഗ്രീക്കിലെ പൊതുവായ ഏകവചന substantival participle മലയാളത്തിൽ സ്വാഭാവികമായും ഘടനാപരമായി അടുത്തും അവതരിപ്പിക്കുന്നു.
- source_word: μὴ διακρίνων
  choice: വിവേചിച്ചറിയാതെ
  rationale: നിഷേധാർഥക പങ്കാളിക്രിയയെ സ്വാഭാവികമായ മലയാള ക്രിയാവിശേഷണരൂപത്തിൽ നൽകുന്നു; വിധി വരുത്തിവെക്കുന്നതും ശരീരത്തെ വിവേചിക്കാതിരിക്കുന്നതും തമ്മിലുള്ള ബന്ധം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ശരീരം’ എന്നതിന്റെ വിവക്ഷ
  choice: പ്രധാന പാഠത്തിൽ വ്യാഖ്യാനവിശദീകരണം ചേർക്കാതെ ‘ശരീരം’ എന്നു നിലനിർത്തുക.
  alternative: ‘കർത്താവിന്റെ ശരീരം’ അല്ലെങ്കിൽ ‘വിശ്വാസികളുടെ ശരീരം’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ‘ശരീരം’ എന്നു മാത്രമാണ് പറയുന്നത്. സന്ദർഭം യേശുവിന്റെ അത്താഴത്തെയും കൊരിന്ത്യർ പരസ്പരം പെരുമാറിയ രീതിയെയും ഉൾക്കൊള്ളുന്നതിനാൽ ക്രിസ്തുവിന്റെ അർപ്പിത ശരീരം, സഭയാകുന്ന ശരീരം, അല്ലെങ്കിൽ രണ്ടും എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷ പരിഹരിക്കരുത്.
- issue: κρίμα എന്നതിന്റെ ശക്തി
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി
  rationale: വാക്യം 32-ൽ ലോകത്തോടൊപ്പം ശിക്ഷാവിധിക്കു വിധേയരാകാതിരിക്കേണ്ടതിനുള്ള കർത്താവിന്റെ ശിക്ഷണം പറയുന്നതിനാൽ ഇവിടെ അന്തിമ നാശവിധി സൂചിപ്പിക്കുന്ന ശക്തമായ പദം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പാനം ചെയ്യുക’ എന്നത് സന്ദർഭത്തിന്റെ ഗൗരവവും ഭക്ഷിക്കുക/പാനം ചെയ്യുക എന്ന ആവർത്തനഘടനയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ഇംഗ്ലീഷ് POB-യിലെ ക്രമമായ [b][a] അനുസരിച്ച് പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
