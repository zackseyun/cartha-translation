id: 1CO.11.13
reference: 1 Corinthians 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ὑμῖν αὐτοῖς κρίνατε· πρέπον ἐστὶν γυναῖκα ἀκατακάλυπτον τῷ θεῷ προσεύχεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: ml
  text: 'നിങ്ങൾതന്നെ വിധിക്കൂ: തല മറയ്ക്കാതെ ഒരു സ്ത്രീ ദൈവത്തോടു പ്രാർഥിക്കുന്നത് ഉചിതമാണോ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഭാഗത്തിന്റെ വിശാലസന്ദർഭത്തിൽ γυνή എന്ന പദം വൈവാഹിക അർഥത്തിൽ എടുത്താൽ, ‘ഒരു ഭാര്യ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: നിങ്ങൾതന്നെ
  rationale: സ്വന്തം വിലയിരുത്തലിലേക്കുള്ള ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: κρίνατε
  choice: വിധിക്കൂ
  rationale: വിലയിരുത്താൻ ആവശ്യപ്പെടുന്ന ഔറിസ്റ്റ് ആജ്ഞയുടെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തുന്നു.
- source_word: πρέπον ἐστὶν
  choice: ഉചിതമാണോ
  rationale: സാമൂഹികമായോ ധാർമികമായോ യോജിച്ചതാണോ എന്ന ചോദ്യത്തെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: γυναῖκα
  choice: ഒരു സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം; ഈ വാക്യത്തിൽ ഭർത്താവിനെ വ്യക്തമായി പരാമർശിക്കാത്തതിനാൽ പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു.
- source_word: ἀκατακάλυπτον
  choice: തല മറയ്ക്കാതെ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘മറയ്ക്കപ്പെടാത്ത’ എന്നാണ്; സമീപസന്ദർഭം തലമൂടിയെക്കുറിച്ചായതിനാൽ സൂചിതമായ ‘തല’ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോടു
  rationale: പ്രാർഥന അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: προσεύχεσθαι
  choice: പ്രാർഥിക്കുന്നത്
  rationale: ചോദ്യത്തിന്റെ വിഷയമായി വരുന്ന ഇൻഫിനിറ്റീവിന്റെ അർഥവും വാക്യഘടനയും സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: ശിരോവസ്ത്രത്തെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ γυνή എന്നതിന്റെ അർഥം
  choice: ഒരു സ്ത്രീ
  alternative: ഒരു ഭാര്യ
  rationale: ഈ വാക്യം ഭർത്താവിനെ വ്യക്തമായി പറയുന്നില്ല; അതിനാൽ കൂടുതൽ പൊതുവായ അർഥം മുഖ്യപാഠത്തിൽ നൽകി, വിശാലസന്ദർഭത്തിൽ സാധ്യമായ വൈവാഹിക അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ നേരിട്ടുള്ള ആഹ്വാനവും വാചാടോപചോദ്യവും നിലനിർത്തിയിരിക്കുന്നു.
