id: 1CO.11.2
reference: 1 Corinthians 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπαινῶ δὲ ⸀ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/002.yaml
  text: I praise you because you remember me in everything and hold firmly to the traditions just as I delivered them to you[a].
translation:
  language: ml
  text: നിങ്ങൾ എല്ലാ കാര്യങ്ങളിലും എന്നെ ഓർക്കുകയും, ഞാൻ നിങ്ങൾക്കു കൈമാറിയതുപോലെ പാരമ്പര്യങ്ങൾ മുറുകെപ്പിടിക്കുകയും ചെയ്യുന്നതിനാൽ ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പഠിപ്പിക്കലുകൾ’ അല്ലെങ്കിൽ ‘നിർദേശങ്ങൾ’; ഗ്രീക്കിൽ ‘പാരമ്പര്യങ്ങൾ’, അതായത് കൈമാറിക്കിട്ടിയ കാര്യങ്ങൾ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘പ്രശംസിക്കുക’ നിലനിർത്തുന്നു; വാക്യത്തിന്റെ അനുകൂല ഭാവത്തിനും യോജിക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ പ്രഭാഷണപരിവർത്തനമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ കൃത്രിമമായ ‘എന്നാൽ/ഇപ്പോൾ’ ചേർക്കാതെ വാക്യക്രമത്തിലൂടെ ബന്ധം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: ὅτι
  choice: ചെയ്യുന്നതിനാൽ
  rationale: പൗലോസ് പ്രശംസിക്കുന്നതിന്റെ കാരണം വ്യക്തമാക്കുന്ന കാരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πάντα μου μέμνησθε
  choice: എല്ലാ കാര്യങ്ങളിലും എന്നെ ഓർക്കുന്നു
  rationale: πάντα എന്നതിന്റെ വിശാല വ്യാപ്തിയും μέμνησθε എന്നതിലെ തുടർന്നുനിൽക്കുന്ന ഓർമയും ലളിതവും സ്വാഭാവികവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്കു കൈമാറിയതുപോലെ
  rationale: പൗലോസ് അവർക്കു പകർന്നുനൽകിയതും അവർ പാലിക്കുന്നതും തമ്മിലുള്ള അനുരൂപത വ്യക്തമാക്കുന്നു; παρέδωκα എന്നതിലെ കൈമാറ്റധ്വനിയും സൂക്ഷിക്കുന്നു.
- source_word: τὰς παραδόσεις
  choice: പാരമ്പര്യങ്ങൾ
  rationale: παράδοσις എന്നത് കൈമാറിക്കിട്ടിയ കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു. ‘പാരമ്പര്യങ്ങൾ’ എന്നത് ഈ പദത്തിന്റെ സാങ്കേതികവും കൈമാറ്റസംബന്ധവുമായ അർഥം നിലനിർത്തുന്നു; അതിനെ പൊതുവായ ‘പഠിപ്പിക്കലുകൾ’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: κατέχετε
  choice: മുറുകെപ്പിടിക്കുന്നു
  rationale: സ്വീകരിച്ച കാര്യങ്ങളെ നിലനിർത്തുകയും അവയോട് ഉറച്ചുനിൽക്കുകയും ചെയ്യുന്നതെന്ന സജീവ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിൽ παραδόσεις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പാരമ്പര്യങ്ങൾ
  alternative: പഠിപ്പിക്കലുകൾ / നിർദേശങ്ങൾ
  rationale: വാക്യം പൗലോസ് കൊരിന്ത്യർക്കു കൈമാറിയ കാര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘പാരമ്പര്യങ്ങൾ’ എന്നത് കൈമാറ്റത്തിന്റെ പദബന്ധം സംരക്ഷിക്കുന്നു; അതേസമയം പിൽക്കാലത്തെ ഏതെങ്കിലും സഭാവിഭാഗത്തിന്റെ പാരമ്പര്യസിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധവും കൈമാറ്റം–മുറുകെപ്പിടിക്കൽ എന്ന പദബന്ധവും നിലനിർത്തിയിരിക്കുന്നു.
