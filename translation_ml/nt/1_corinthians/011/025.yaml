id: 1CO.11.25
reference: 1 Corinthians 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: ml
  text: 'അതുപോലെതന്നെ, അത്താഴം കഴിച്ചശേഷം പാനപാത്രം എടുത്ത് അവൻ പറഞ്ഞു: “ഈ പാനപാത്രം എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്.[a] നിങ്ങൾ ഇത് കുടിക്കുമ്പോഴൊക്കെയും[b] എന്റെ ഓർമയ്ക്കായി ഇത് ചെയ്തുകൊണ്ടിരിക്കുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉടമ്പടി’ എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദത്തിന് ‘വിൽപത്രം’ എന്നും അർഥമാകാം. എന്നാൽ ഇവിടത്തെ വേദപശ്ചാത്തലത്തിന് ‘ഉടമ്പടി’യാണ് കൂടുതൽ യോജിച്ചത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “നിങ്ങൾ കുടിക്കുമ്പോഴൊക്കെയും.” ഗ്രീക്ക് പ്രയോഗം ആവർത്തിക്കുന്ന സന്ദർഭങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുമ്പത്തെ അപ്പവുമായി ബന്ധപ്പെട്ട പ്രവൃത്തിയോടുള്ള സാമ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: τὸ ποτήριον
  choice: പാനപാത്രവും
  rationale: സാധാരണവും മാന്യവുമായ മലയാളപദം; ഗ്രീക്കിൽ ഇല്ലാത്ത പ്രത്യേക ആരാധനാക്രമ രജിസ്റ്റർ ഒഴിവാക്കുന്നു.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: അത്താഴം കഴിച്ചശേഷം
  rationale: μετάയോടുകൂടിയ articular infinitive സൂചിപ്പിക്കുന്ന കാലബന്ധം നേരിട്ട് നൽകുന്നു.
- source_word: λέγων
  choice: എടുത്തുകൊണ്ട് അവൻ പറഞ്ഞു
  rationale: λέγων എന്നതിന്റെ ‘പറഞ്ഞുകൊണ്ട്’ എന്ന അർഥം നിലനിർത്തുമ്പോൾ, മുൻവാക്യത്തിലെ സമാന്തരപ്രവൃത്തിയിൽനിന്ന് സൂചിതമായ പാനപാത്രം എടുക്കൽ മലയാളവാക്യത്തിന്റെ പൂർണതയ്ക്കായി വ്യക്തമാക്കുന്നു.
- source_word: ἡ καινὴ διαθήκη
  choice: പുതിയ ഉടമ്പടി
  rationale: യിരെമ്യാവ് 31-ലെ വേദപശ്ചാത്തലത്തിനും രക്തത്താൽ സ്ഥാപിക്കപ്പെടുന്ന ബന്ധത്തിനും ‘ഉടമ്പടി’ ഏറ്റവും യോജിക്കുന്നു.
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: എന്റെ രക്തത്തിലുള്ള
  rationale: ἐν എന്നതിന്റെ രൂപകാത്മകവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ ബന്ധം സംരക്ഷിക്കുന്നു; ‘എന്റെ രക്തത്താൽ ഉറപ്പിക്കപ്പെട്ട’ എന്ന വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: τοῦτο ποιεῖτε
  choice: ഇങ്ങനെ ചെയ്തുകൊണ്ടിരിക്കുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ആവർത്തിതമോ തുടരുന്നതോ ആയ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ὁσάκις ἐὰν πίνητε
  choice: നിങ്ങൾ ഇത് കുടിക്കുമ്പോഴൊക്കെയും
  rationale: ആവർത്തിക്കുന്ന ഓരോ സന്ദർഭത്തെയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘ഇത്’ പാനപാത്രത്തിലെ പാനീയത്തെ സന്ദർഭാനുസൃതമായി സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: എന്റെ ഓർമയ്ക്കായി
  rationale: ἀνάμνησις സൂചിപ്പിക്കുന്ന ഓർമിക്കൽ/സ്മാരകാചരണം ലളിതവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
theological_decisions:
- issue: διαθήκη എന്ന പദത്തിന്റെ അർഥം
  choice: ഉടമ്പടി
  alternative: വിൽപത്രം / നിയമപത്രം
  rationale: പഴയനിയമത്തിലെ പുതിയ ഉടമ്പടി പശ്ചാത്തലവും രക്തവുമായി ബന്ധപ്പെട്ട ഉടമ്പടിഭാഷയും ഇവിടെ നിർണായകമാണ്; പിന്നീട് രൂപപ്പെട്ട സഭാപരമായ ‘ടെസ്റ്റമെന്റ്’ പ്രയോഗം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: പാനപാത്രവും പുതിയ ഉടമ്പടിയും തമ്മിലുള്ള ബന്ധം
  choice: “ഈ പാനപാത്രം എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്” എന്ന നേരിട്ടുള്ള തിരിച്ചറിയൽ നിലനിർത്തി
  alternative: “ഈ പാനപാത്രം എന്റെ രക്തത്താൽ ഉറപ്പിക്കപ്പെട്ട പുതിയ ഉടമ്പടിയെ പ്രതിനിധാനം ചെയ്യുന്നു”
  rationale: ഗ്രീക്ക് വാചകം ‘ആണ്’ എന്ന തിരിച്ചറിയൽ നേരിട്ട് പറയുന്നു. സാന്നിധ്യമോ പ്രതീകത്വമോ സംബന്ധിച്ച പിന്നീടുള്ള സഭാവിഭാഗീയ നിർവചനങ്ങൾ ചേർക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ποιεῖτε എന്ന ആജ്ഞയുടെ ആവർത്തിതഭാവം
  choice: ചെയ്തുകൊണ്ടിരിക്കുക
  alternative: ചെയ്യുക
  rationale: വർത്തമാനകാല ആജ്ഞയും ‘കുടിക്കുമ്പോഴൊക്കെയും’ എന്ന തുടർവാക്യവും ആവർത്തിച്ചുള്ള ആചരണത്തെ പിന്തുണയ്ക്കുന്നു; അതിനെ അതിരുകടന്ന് പ്രത്യേക ആരാധനാക്രമനിയമമാക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ വേദഭാഷയാണ് ഉപയോഗിച്ചത്. ‘പാനപാത്രം’, ‘ഉടമ്പടി’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി; സഭാവിഭാഗീയ സാങ്കേതികപദങ്ങളും അനാവശ്യ സംസ്കൃതഭാരവും ഒഴിവാക്കി.
