revisions:
- from: 'അതുപോലെതന്നെ, അത്താഴം കഴിച്ചശേഷം പാനപാത്രവും എടുത്തുകൊണ്ട് അവൻ പറഞ്ഞു: “ഈ പാനപാത്രം എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്.[a] നിങ്ങൾ ഇത് കുടിക്കുമ്പോഴൊക്കെയും എന്റെ ഓർമയ്ക്കായി ഇങ്ങനെ ചെയ്തുകൊണ്ടിരിക്കുക.[b]”'
  to: 'അതുപോലെതന്നെ, അത്താഴം കഴിച്ചശേഷം പാനപാത്രം എടുത്ത് അവൻ പറഞ്ഞു: “ഈ പാനപാത്രം എന്റെ രക്തത്തിലുള്ള പുതിയ ഉടമ്പടിയാണ്.[a] നിങ്ങൾ ഇത് കുടിക്കുമ്പോഴൊക്കെയും[b] എന്റെ ഓർമയ്ക്കായി ഇത് ചെയ്തുകൊണ്ടിരിക്കുക.”'
