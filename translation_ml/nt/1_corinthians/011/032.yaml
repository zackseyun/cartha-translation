  source_fidelity: The draft accurately reflects the temporal participle κρινόμενοι, the Lord's agency (ὑπὸ κυρίου), the corrective sense of παιδευόμεθα, the purpose clause, and the contrast between judgment and condemnation. However, “അവിടന്ന് നമ്മെ ശിക്ഷണം നൽകുന്നു” unnecessarily changes the Greek passive “we are disciplined” into an active construction and is less natural in this context.
