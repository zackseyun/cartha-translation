id: 1CO.11.32
reference: 1 Corinthians 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κρινόμενοι δὲ ⸀ὑπὸ κυρίου παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: ml
  text: എന്നാൽ, കർത്താവിനാൽ നാം വിധിക്കപ്പെടുമ്പോൾ[a], ലോകത്തോടൊപ്പം നാം ശിക്ഷാവിധിക്കു വിധേയരാകാതിരിക്കേണ്ടതിന് നമുക്കു ശിക്ഷണം ലഭിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കർത്താവിനാൽ വിധിക്കപ്പെട്ടുകൊണ്ടിരിക്കെ, നമുക്കു ശിക്ഷണം ലഭിക്കുന്നു.’ ഗ്രീക്കിലെ വർത്തമാനകാല രൂപങ്ങൾ തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രവൃത്തിക്ക് ഊന്നൽ നൽകാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: നാം വിധിക്കപ്പെടുമ്പോൾ
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തത്തെ സന്ദർഭത്തിൽ കാലസൂചകമായി അവതരിപ്പിക്കുന്നു. ‘വിധിക്കപ്പെടുന്നു’ എന്നത് ന്യായവിധിയുടെ അർഥം നിലനിർത്തുകയും അതിന്റെ തിരുത്തൽസ്വഭാവം തുടർന്നുള്ള παιδευόμεθα വ്യക്തമാക്കാൻ ഇടവരുത്തുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ന്യായവിധിയെക്കുറിച്ചുള്ള മുന്നറിയിപ്പിനോടുള്ള മൃദുവായ വൈരുധ്യം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑπὸ κυρίου
  choice: കർത്താവിനാൽ
  rationale: ὑπό + ഷഷ്ഠി കർത്തൃകാരകത്തെ സൂചിപ്പിക്കുന്നു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘യേശു’ എന്ന വിശദീകരണം ചേർക്കാതെ κύριος എന്നതിന് പതിവായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു.
- source_word: παιδευόμεθα
  choice: അവിടന്ന് നമ്മെ ശിക്ഷണം നൽകുന്നു
  rationale: παιδεύω എന്നതിലെ പരിശീലനം, തിരുത്തൽ, ശാസന എന്നീ പരിഹാരാത്മക ആശയങ്ങൾ ‘ശിക്ഷണം നൽകുന്നു’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; കേവലം ദണ്ഡനം എന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἵνα μὴ
  choice: ആകാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ സൂചിപ്പിക്കുന്ന ἵνα μὴ എന്ന ഘടനയുടെ ലക്ഷ്യാർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: σὺν τῷ κόσμῳ
  choice: ലോകത്തോടൊപ്പം
  rationale: σύν സൂചിപ്പിക്കുന്ന സഹഭാഗിത്വവും ഒരേ ഗതി പങ്കിടുന്നതും ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατακριθῶμεν
  choice: നാം ശിക്ഷാവിധിക്കു വിധേയരാകുക
  rationale: ആദ്യത്തെ κρίνω-യിൽനിന്ന് വ്യത്യസ്തമായി പ്രതികൂലമായ അന്തിമ വിധി എന്ന κατακρίνω-യുടെ ശക്തമായ അർഥം ‘ശിക്ഷാവിധി’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ ഇപ്പോഴത്തെ വിധിയും ലോകത്തോടൊപ്പമുള്ള ശിക്ഷാവിധിയും തമ്മിലുള്ള ബന്ധം
  choice: കർത്താവിന്റെ വിധിയെ തിരുത്തുന്ന ശിക്ഷണമായും ലോകത്തോടൊപ്പമുള്ള ശിക്ഷാവിധിയിൽനിന്ന് ഒഴിവാക്കാനുള്ളതായും വിവർത്തനം ചെയ്യുന്നു.
  alternative: ഇത് വിശ്വാസി–അവിശ്വാസി വ്യത്യാസം സൂചിപ്പിക്കാത്ത പൊതുവായ താൽക്കാലിക ശിക്ഷയായി വായിക്കാം.
  rationale: κρινόμενοι, παιδευόμεθα, κατακριθῶμεν എന്നിവ തമ്മിലുള്ള പദവ്യത്യാസവും ἵνα μὴ എന്ന ഉദ്ദേശ്യവാക്യവും ഇപ്പോഴത്തെ പരിഹാരാത്മക ശിക്ഷണത്തെയും ഒഴിവാക്കപ്പെടുന്ന ശിക്ഷാവിധിയെയും വേർതിരിക്കുന്നു. അതേസമയം അന്തിമരക്ഷ, സ്ഥിരത, കൂദാശാഫലം എന്നിവയെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സിദ്ധാന്തം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ശിക്ഷണം’ പരിഹാരാത്മകമായ ദൈവിക ശാസനയെ സൂചിപ്പിക്കുന്നു; ‘ശിക്ഷാവിധി’ κατακρίνω എന്ന പദത്തിന്റെ പ്രതികൂല ന്യായവിധിയർഥം വേർതിരിച്ചുനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
