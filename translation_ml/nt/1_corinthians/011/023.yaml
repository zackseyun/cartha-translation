  naturalness: The explicit reflexive “താൻ” in “താൻ ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന” is less idiomatic here and can momentarily sound semantically awkward. Omitting it produces a smoother modern-standard Malayalam temporal clause without losing the referent.
