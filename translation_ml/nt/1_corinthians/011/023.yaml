id: 1CO.11.23
reference: 1 Corinthians 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഞാൻ കർത്താവിൽനിന്ന് സ്വീകരിച്ചതുതന്നെ നിങ്ങൾക്കു കൈമാറി: കർത്താവായ യേശു ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന രാത്രിയിൽ[a] അപ്പം എടുത്തു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: ‘അവൻ ഒറ്റിക്കൊടുക്കപ്പെട്ട രാത്രിയിൽ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: സ്വീകരിച്ചു
  rationale: പൗലോസ് കർത്താവിൽനിന്ന് ഉപദേശപരമ്പര സ്വീകരിച്ചതിനെ സൂചിപ്പിക്കുന്നു; παρέδωκα എന്നതുമായ സ്വീകരിക്കുക/കൈമാറുക എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἀπὸ τοῦ κυρίου
  choice: കർത്താവിൽനിന്ന്
  rationale: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു; പിന്നാലെ വരുന്ന ‘കർത്താവായ യേശു’ എന്ന തിരിച്ചറിയൽ മുൻകൂട്ടി വികസിപ്പിക്കുന്നില്ല.
- source_word: παρέδωκα
  choice: കൈമാറി
  rationale: ലഭിച്ച ഉപദേശം മറ്റുള്ളവർക്കു പകർന്നുനൽകുന്ന പരമ്പരാഗത പ്രവർത്തനം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പിന്നാലെയുള്ള അതേ ധാതുവിന്റെ നിഷ്ക്രിയപ്രയോഗത്തിൽനിന്ന് ആവശ്യമായ വ്യത്യാസവും സൂക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: മുമ്പ് കൈമാറിയതിന്റെ ഉള്ളടക്കം തുടർന്നുവരുന്നു എന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ദ്വിബിന്ദു ഉപയോഗിച്ചു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ബഹുമാനപരവും ക്രിസ്തുസംബന്ധവുമായ അർഥബലം നിലനിർത്തുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: രാത്രിയിൽ
  rationale: ബന്ധവാക്യത്തോടു ചേർന്ന് സമയസൂചന സ്വാഭാവികമായ മലയാളക്രമത്തിൽ നൽകുന്നു.
- source_word: παρεδίδετο
  choice: ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  rationale: ഇംപർഫെക്റ്റ് നിഷ്ക്രിയരൂപത്തിന്റെ പുരോഗമനഭാവവും ‘കൈമാറപ്പെടുക/ഏല്പിക്കപ്പെടുക’ എന്ന വിശാല അർഥപരിധിയും സംരക്ഷിക്കുന്നു; യൂദാസിന്റെ വഞ്ചനയിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἔλαβεν ἄρτον
  choice: അപ്പം എടുത്തു
  rationale: ഗ്രീക്ക് ക്രിയയും കർമവും ലളിതമായും ആരാധനാപരമായി പരിചിതമായും മലയാളത്തിൽ നൽകുന്നു; അനിശ്ചിത ആർട്ടിക്കിൾ നിർബന്ധമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സ്ഥാപനവിവരണത്തിലെ παρεδίδετο എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു
  alternative: വഞ്ചിക്കപ്പെട്ട രാത്രി
  rationale: παραδίδωμι എന്ന ക്രിയയ്ക്ക് ഏല്പിക്കുക, കൈമാറുക, വഞ്ചിച്ചുകൊടുക്കുക എന്നീ അർഥങ്ങൾ സന്ദർഭാനുസരണം വരാം. മുഖ്യപാഠത്തിലെ വിശാലമായ നിഷ്ക്രിയപ്രയോഗം മനുഷ്യവഞ്ചനയെയും യേശുവിന്റെ ഏല്പിക്കപ്പെടലിന്റെ വിപുലമായ രക്ഷാചരിത്രപരമായ മാനത്തെയും ഒരുമിച്ച് തുറന്നുവയ്ക്കുന്നു; പരമ്പരാഗതമായ ചുരുങ്ങിയ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യക്രമം. ‘സ്വീകരിച്ചു/കൈമാറി’ എന്ന പരമ്പരാഭാഷയും ‘ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്നു’ എന്ന അർഥവ്യാപ്തിയുള്ള നിഷ്ക്രിയരൂപവും സംരക്ഷിച്ചു; അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
