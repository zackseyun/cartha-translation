  - severity: medium
    issue: Footnote renders the traditional alternative as “വഞ്ചിക്കപ്പെട്ട”
    rationale: “വഞ്ചിക്കപ്പെട്ട” primarily means “deceived.” For the passion-context alternative “was betrayed,” “ഒറ്റിക്കൊടുക്കപ്പെട്ട” is more accurate and idiomatic.
