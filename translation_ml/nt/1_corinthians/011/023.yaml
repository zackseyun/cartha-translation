revisions:
- from: 'എന്തെന്നാൽ, ഞാൻ കർത്താവിൽനിന്ന് സ്വീകരിച്ചതുതന്നെ നിങ്ങൾക്കു കൈമാറി: കർത്താവായ യേശു, താൻ ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന രാത്രിയിൽ[a], അപ്പം എടുത്തു.'
  to: 'എന്തെന്നാൽ, ഞാൻ കർത്താവിൽനിന്ന് സ്വീകരിച്ചതുതന്നെ നിങ്ങൾക്കു കൈമാറി: കർത്താവായ യേശു ഏല്പിക്കപ്പെട്ടുകൊണ്ടിരുന്ന രാത്രിയിൽ[a] അപ്പം എടുത്തു.'
