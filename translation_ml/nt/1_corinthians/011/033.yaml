id: 1CO.11.33
reference: 1 Corinthians 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ സഹോദരന്മാരേ[a], ഭക്ഷണം കഴിക്കാൻ നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ, പരസ്പരം കാത്തിരിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്ന പുല്ലിംഗരൂപമാണ് ഉള്ളത്. എന്നാൽ ഈ രൂപം പലപ്പോഴും സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട മുഴുവൻ സഭയെയും അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് വിവരിച്ച കർത്താവിന്റെ അത്താഴത്തിലെ ക്രമക്കേടുകളിൽനിന്ന് നിഗമനമായി വരുന്ന നിർദേശം എന്ന യുക്തിബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: സംബോധനാവിഭക്തിയിലുള്ള ഗ്രീക്ക് പദപ്രയോഗത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപവും μου എന്ന ഉടമസ്ഥസർവനാമവും നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന പ്രതിനിധിപരമായ പ്രയോഗമാകാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: συνερχόμενοι
  choice: നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ
  rationale: ആജ്ഞ ബാധകമാകുന്ന സാഹചര്യം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ വർത്തമാനകാല കൃദന്തരൂപം സ്വാഭാവികമായി പകരുന്നു.
- source_word: εἰς τὸ φαγεῖν
  choice: ഭക്ഷണം കഴിക്കാൻ
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന εἰς + articular infinitive എന്ന ഘടനയെ അധിക വിശദീകരണമില്ലാതെ കൃത്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: അന്യോന്യത സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἐκδέχεσθε
  choice: കാത്തിരിക്കുക
  rationale: ചിലർ മറ്റുള്ളവർക്കുമുമ്പേ ഭക്ഷിച്ചിരുന്നതിനെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ, മറ്റുള്ളവർ എത്തി ഒരുമിച്ച് ഭക്ഷിക്കുന്നതുവരെ കാത്തിരിക്കുക എന്ന അർഥമാണ് ഏറ്റവും യോജിച്ചത്.
theological_decisions:
- issue: ἀδελφοί എന്ന പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: പ്രധാന പാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നിലനിർത്തി, സ്ത്രീകളും ഉൾപ്പെടാം എന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’ എന്നു പ്രധാന പാഠത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് മൂലപാഠത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം മറച്ചുവയ്ക്കാതെ സൂക്ഷിക്കുന്നു; അതേസമയം ഈ സംബോധന മിശ്രസഭയെ മുഴുവനായി ഉദ്ദേശിക്കാവുന്നതാണെന്ന ചരിത്ര-ഭാഷാപരമായ സാധ്യതയും വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ സഭാസംബോധനയും നേരിട്ടുള്ള ആജ്ഞാരൂപവും ഉപയോഗിച്ചു. ‘പരസ്പരം കാത്തിരിക്കുക’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ സന്ദർഭത്തിലെ പ്രായോഗിക തിരുത്തലും സംരക്ഷിക്കുന്നു.
