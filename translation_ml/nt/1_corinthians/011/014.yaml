source:
  edition: SBLGNT
  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: ml
  text: ഒരു പുരുഷൻ മുടി നീട്ടിവളർത്തിയാൽ അത് അവന് അപമാനമാണെന്ന് പ്രകൃതിതന്നെപ്പോലും നിങ്ങളെ പഠിപ്പിക്കുന്നില്ലേ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീണ്ട മുടി ധരിച്ചാൽ’ അല്ലെങ്കിൽ ‘നീണ്ട മുടിയുണ്ടെങ്കിൽ.’ ഗ്രീക്ക് ക്രിയ നീണ്ട മുടി വളർത്തുന്നതിനെയോ അങ്ങനെ ധരിക്കുന്നതിനെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രകൃതിതന്നെ’ എന്നത് സൃഷ്ടിക്രമത്തെയോ പൊതുവായ മാനുഷിക ധാരണയെയോ ഒരു സംസ്കാരം സ്വാഭാവികമായി യോജിച്ചതെന്നു കരുതുന്നതിനെയോ സൂചിപ്പിക്കാം; ഇവിടെ ഗ്രീക്ക് പദം ഇതിനെക്കുറിച്ച് കൂടുതൽ കൃത്യമായി നിർവചിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: പഠിപ്പിക്കുന്നില്ലേ?
  rationale: മുൻവാദത്തിന്റെ തുടർച്ചയായ നിഷേധാത്മക അലങ്കാരചോദ്യമായി സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; οὐδέയുടെ ‘പോലും/തന്നെ’ എന്ന ഊന്നൽ ‘പ്രകൃതിതന്നെ’ എന്ന പ്രയോഗത്തോടൊപ്പം വാക്യത്തിൽ പ്രകടമാകുന്നു.
- source_word: ἡ φύσις αὐτὴ
  choice: പ്രകൃതിതന്നെ
  rationale: αὐτή നൽകുന്ന ഊന്നൽ നിലനിർത്തുകയും φύσις സൃഷ്ടിക്രമം, പൊതുവായ മാനുഷിക ധാരണ, സ്വാഭാവികമായി യോജിച്ചതെന്ന സാംസ്കാരിക ബോധം എന്നിവയിൽ ഏതാണെന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: διδάσκει ὑμᾶς
  choice: നിങ്ങളെ പഠിപ്പിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെയും നേരിട്ടുള്ള കർമത്തിന്റെയും ഉപദേശാത്മക അർഥം ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἀνὴρ
  choice: ഒരു പുരുഷൻ
  rationale: ഈ ഉപവാക്യത്തിൽ ഭർത്താവിനെ പ്രത്യേകമായി സൂചിപ്പിക്കാതെ സ്ത്രീയോടു വ്യത്യസ്തമായ പുരുഷനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐὰν κομᾷ
  choice: മുടി നീട്ടിവളർത്തിയാൽ
  rationale: κομάω മുടി നീളത്തിൽ വളർത്തുകയോ നീണ്ട മുടി ധരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികവും ക്രിയയുടെ പ്രവർത്തനഭാവം വ്യക്തമാക്കുന്നതുമായ പരിഭാഷ.
- source_word: ἀτιμία
  choice: അപമാനം
  rationale: മാനവും അപമാനവും സംബന്ധിച്ച സന്ദർഭത്തിൽ dishonor/shame എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτῷ ἐστιν
  choice: അത് അവന് ... ആണ്
  rationale: ഗ്രീക്കിലെ ദാതൃവിഭക്തിയോടുകൂടിയ വിധേയഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വാദത്തിലെ φύσις എന്നതിന്റെ അർഥം
  choice: ‘പ്രകൃതിതന്നെ’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തി
  alternative: സൃഷ്ടിയിലെ ജൈവക്രമം; സ്വാഭാവികമെന്നു കരുതപ്പെടുന്ന സാമൂഹിക പതിവ്; സഹജമായ ധാർമികബോധം
  rationale: ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് പദം ഏത് അർഥമാണ് കൃത്യമായി ഉദ്ദേശിക്കുന്നതെന്ന് നിർണയിക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമോ സാംസ്കാരികമോ ആയ വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. അലങ്കാരചോദ്യത്തിന്റെ രൂപം നിലനിർത്തി. ‘പ്രകൃതി’യുടെ വ്യാഖ്യാനപരമായ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; മതവിഭാഗപരമായ പ്രത്യേക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
