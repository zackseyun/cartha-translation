id: 1CO.11.7
reference: 1 Corinthians 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: ml
  text: പുരുഷൻ[a] ദൈവത്തിന്റെ പ്രതിരൂപവും മഹത്ത്വവും ആയിരിക്കുന്നതിനാൽ, അവൻ തന്റെ തല മൂടേണ്ടതില്ല[b]; എന്നാൽ സ്ത്രീ പുരുഷന്റെ മഹത്ത്വമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലുടനീളം ‘പുരുഷൻ’/‘സ്ത്രീ’ എന്നതിനുപകരം ‘ഭർത്താവ്’/‘ഭാര്യ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ ἀνήρ, γυνή എന്നീ പദങ്ങൾക്ക് സന്ദർഭമനുസരിച്ച് ഈ രണ്ട് അർഥങ്ങളും വരാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘തലയിൽ മൂടുപടം ഇടേണ്ടതില്ല’; ഗ്രീക്ക് കൂടുതൽ പൊതുവായി ‘തല മൂടുക’ എന്നാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: പുരുഷൻ
  rationale: ആരാധനാസന്ദർഭത്തിലും തുടർന്നുള്ള സൃഷ്ടിവാദത്തിലും ഇവിടെ പൊതുവായ പുരുഷ–സ്ത്രീ വ്യത്യാസമാണ് പ്രധാനമായും ഉദ്ദേശിക്കപ്പെടുന്നത്. അതിനാൽ ഭർത്താവ് എന്നതിലുപരി പുരുഷൻ എന്നു നൽകി; വൈവാഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ὀφείλει
  choice: മൂടേണ്ടതില്ല
  rationale: ധാർമികമോ ചട്ടപരമോ ആയ ബാധ്യതയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ‘മൂടാൻ പാടില്ല’ എന്നത് ഗ്രീക്കിലുള്ളതിനെക്കാൾ കടുത്ത സമ്പൂർണ നിരോധനമായി കേൾക്കാം.
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: തന്റെ തല മൂടുക
  rationale: മൂടലിന്റെ കൃത്യമായ രൂപം നിർണയിക്കാതെ ഗ്രീക്കിലെ പൊതുവായ ആശയം നിലനിർത്തുന്നു. ‘മൂടുപടം ഇടുക’ എന്നത് കൂടുതൽ നിർദിഷ്ടമാണ്.
- source_word: εἰκὼν
  choice: പ്രതിരൂപം
  rationale: സൃഷ്ടിവിവരണത്തിലേക്കുള്ള സാധ്യതയുള്ള സൂചന സംരക്ഷിക്കുന്നതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: രണ്ടിടത്തും ഒരേ പദം ഉപയോഗിച്ച് വാക്യത്തിലെ സമാന്തരതയും ദൈവശാസ്ത്രപരവും ബന്ധപരവുമായ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ὑπάρχων
  choice: ആയിരിക്കുന്നതിനാൽ
  rationale: മുൻവാക്യത്തിനുള്ള കാരണമാണ് കൃദന്തരൂപം നൽകുന്നത്; അത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ γυνὴ
  choice: സ്ത്രീ
  rationale: ഇവിടെ പ്രതിനിധാനപരമായ സ്ത്രീവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ‘ഭാര്യ’ എന്ന വൈവാഹിക അർഥം സാധ്യമെങ്കിലും സന്ദർഭം അതിൽ മാത്രം ഒതുങ്ങുന്നില്ല.
- source_word: ἀνδρός
  choice: പുരുഷന്റെ
  rationale: ആദ്യഭാഗത്തിലെ പൊതുവായ ἀνήρ എന്ന പ്രയോഗവുമായി പൊരുത്തവും ദൈവത്തിന്റെ/പുരുഷന്റെ മഹത്ത്വം എന്ന സമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνήρ/γυνή എന്നിവയെ പുരുഷൻ/സ്ത്രീ എന്നോ ഭർത്താവ്/ഭാര്യ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: പുരുഷൻ/സ്ത്രീ
  alternative: ഭർത്താവ്/ഭാര്യ
  rationale: തലമൂടലിനെയും സൃഷ്ടിയെയും ആസ്പദമാക്കിയ ഉടനെയുള്ള വാദം വൈവാഹികബന്ധത്തിൽ മാത്രം ഒതുങ്ങാത്ത പുരുഷ–സ്ത്രീ വ്യത്യാസത്തെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദങ്ങളുടെ വൈവാഹിക അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: സ്ത്രീ പുരുഷന്റെ മഹത്ത്വമാണ് എന്ന അസമമായ പ്രസ്താവനയുടെ അവതരണം
  choice: പ്രസ്താവനയുടെ നേരിട്ടുള്ള രൂപവും ‘മഹത്ത്വം’ എന്ന പദവും നിലനിർത്തി
  alternative: സ്ത്രീ പുരുഷന്റെ മഹത്ത്വത്തെ പ്രതിഫലിപ്പിക്കുന്നു / സ്ത്രീ പുരുഷന്റെ ബഹുമാനമാണ്
  rationale: ഗ്രീക്കിൽ ἐστιν, δόξα എന്നിവകൊണ്ട് പ്രസ്താവന നേരിട്ട് നൽകിയിരിക്കുന്നു. അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മയപ്പെടുത്തുകയോ വിശദീകരണത്തിലൂടെ പരിഹരിക്കുകയോ ചെയ്യാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലത്തിലെ കാരണബന്ധവും ‘ദൈവത്തിന്റെ മഹത്ത്വം/പുരുഷന്റെ മഹത്ത്വം’ എന്ന സമാന്തരതയും സംരക്ഷിച്ചു; കടുത്ത നിയമഭാഷയും അനാവശ്യമായ വ്യാഖ്യാനപരമായ മയപ്പെടുത്തലും ഒഴിവാക്കി.
