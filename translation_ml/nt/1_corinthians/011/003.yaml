id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: ml
  text: 'എന്നാൽ നിങ്ങൾ ഇതു അറിയണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു: ഓരോ പുരുഷന്റെയും തല മശീഹയാണ്[a]; സ്ത്രീയുടെ തല പുരുഷനാണ്[b]; മശീഹയുടെ തല ദൈവമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തല’ എന്ന രൂപകം ഇവിടെ ‘ഉറവിടം’ എന്നോ ‘അധികാരമുള്ളവൻ’ എന്നോ മനസ്സിലാക്കാം; ഗ്രീക്കിലെ രൂപകം മുഖ്യവാചകത്തിൽ അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘സ്ത്രീ’, ‘പുരുഷൻ’ എന്നീ പദങ്ങളെ ‘ഭാര്യ’, ‘ഭർത്താവ്’ എന്നും വായിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω δὲ ὑμᾶς εἰδέναι
  choice: എന്നാൽ നിങ്ങൾ ഇതു അറിയണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: പൗലോസിന്റെ വ്യക്തിപരമായ ഉദ്ദേശവും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ ആശയമാറ്റവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παντὸς ἀνδρὸς
  choice: ഓരോ പുരുഷന്റെയും
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാമെങ്കിലും, ആദ്യ സമാന്തരവാക്യം പൊതുവായ അർഥത്തെ കൂടുതൽ സ്വാഭാവികമായി പിന്തുണയ്ക്കുന്നു.
- source_word: κεφαλή
  choice: തല
  rationale: ഗ്രീക്കിലെ രൂപകം അതേപടി നിലനിർത്തുന്നു; ‘ഉറവിടം’ എന്നോ ‘അധികാരമുള്ളവൻ’ എന്നോ വിവാദമായ അർഥം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങളിലും ഏകീകരണം പാലിക്കുന്നു.
- source_word: γυναικός
  choice: സ്ത്രീയുടെ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. വിവാഹബന്ധം വ്യാകരണത്തിൽ വ്യക്തമായി അടയാളപ്പെടുത്തിയിട്ടില്ലാത്തതിനാൽ പൊതുവായ അർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിക്കുന്നു.
- source_word: ὁ ἀνήρ
  choice: പുരുഷൻ
  rationale: γυνήയോടുള്ള സമാന്തരബന്ധത്തിൽ ‘പുരുഷൻ’ എന്ന പൊതുവായ വായന നിലനിർത്തുന്നു; ‘ഭർത്താവ്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: θεός എന്നതിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാള പരിഭാഷ.
theological_decisions:
- issue: മൂന്നു സമാന്തരവാക്യങ്ങളിലുമുള്ള κεφαλήയുടെ അർഥം
  choice: ‘തല’ എന്ന രൂപകം മുഖ്യവാചകത്തിൽ നിലനിർത്തുക
  alternative: ‘ഉറവിടം’ അല്ലെങ്കിൽ ‘അധികാരമുള്ളവൻ’ എന്നു വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് പദത്തിന്റെ രൂപകാർഥത്തെക്കുറിച്ച് തർക്കമുണ്ട്. ഏതെങ്കിലും വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
- issue: ἀνήρ / γυνή എന്നവയെ പുരുഷൻ/സ്ത്രീ എന്നോ ഭർത്താവ്/ഭാര്യ എന്നോ വായിക്കണമോ
  choice: മുഖ്യവാചകത്തിൽ ‘പുരുഷൻ/സ്ത്രീ’
  alternative: ‘ഭർത്താവ്/ഭാര്യ’
  rationale: വാക്യഘടന പൊതുവായ പ്രസ്താവനയെ അനുകൂലിക്കുന്നു; എങ്കിലും പദങ്ങൾ ദമ്പതികളെ സൂചിപ്പിക്കാനും കഴിയുന്നതിനാൽ ആ വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: മശീഹയുടെ തല ദൈവമാണെന്ന അന്തിമവാക്യം
  choice: ‘മശീഹയുടെ തല ദൈവമാണ്’ എന്നു നേരിട്ട് പരിഭാഷപ്പെടുത്തുക
  alternative: പ്രവർത്തനപരമായ ക്രമം മാത്രം വ്യക്തമാക്കുന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം
  rationale: മൂലവാചകം ദുർബലപ്പെടുത്തുകയോ വികസിപ്പിക്കുകയോ ചെയ്യാതെ അതേപടി നിലനിർത്തുന്നു; പുത്രന്റെ ദൈവത്വത്തെക്കുറിച്ചോ അധീനതയുടെ സ്വഭാവത്തെക്കുറിച്ചോ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ മൂന്നു സമാന്തരഘടകങ്ങളും വ്യക്തമായി സൂക്ഷിച്ചു; വിവാദമായ രൂപകവും ദാമ്പത്യവായനയുടെ സാധ്യതയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചു.
