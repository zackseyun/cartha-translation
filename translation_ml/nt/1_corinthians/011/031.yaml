  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἑαυτοὺς διεκρίνομεν, οὐκ ἂν ἐκρινόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/031.yaml
  text: But if we judged ourselves[a], we would not be judged.
translation:
  language: ml
  text: എന്നാൽ നാം നമ്മെത്തന്നെ വിധിച്ചിരുന്നെങ്കിൽ[a], നാം വിധിക്കപ്പെടുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നമ്മെത്തന്നെ പരിശോധിച്ചിരുന്നെങ്കിൽ’ അല്ലെങ്കിൽ ‘നമ്മെത്തന്നെ വിവേചിച്ചിരുന്നെങ്കിൽ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് വിലയിരുത്തുക, വേർതിരിച്ചറിയുക എന്നീ അർഥങ്ങൾ വരാം. എന്നാൽ അടുത്ത ഉപവാക്യത്തിലെ ‘വിധിക്കപ്പെടുക’ എന്നതുമായുള്ള പദബന്ധം നിലനിർത്താൻ ഇവിടെ ‘വിധിക്കുക’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: εἰ എന്ന ഉപാധിയും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἑαυτοὺς
  choice: നമ്മെത്തന്നെ
  rationale: ക്രിയയുടെ ആത്മവാചക കർമത്തെ വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: διεκρίνομεν
  choice: വിധിച്ചിരുന്നെങ്കിൽ
  rationale: διακρίνω ഇവിടെ സ്വയം വിവേചനപൂർവം വിലയിരുത്തുക എന്ന ആശയം വഹിക്കുന്നു. പിന്നാലെയുള്ള ἐκρινόμεθα എന്നതുമായുള്ള പദബന്ധം നിലനിർത്താൻ ‘വിധിക്കുക’ ഉപയോഗിച്ചു; ‘പരിശോധിക്കുക’, ‘വിവേചിക്കുക’ എന്നിവയും സാധ്യമാണ്.
- source_word: οὐκ ἂν
  choice: മായിരുന്നില്ല
  rationale: യാഥാർഥ്യവിരുദ്ധമായ ഉപാധിവാക്യത്തിന്റെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐκρινόμεθα
  choice: വിധിക്കപ്പെടുമായിരുന്നില്ല
  rationale: κρίνω എന്ന ക്രിയയുടെ ന്യായവിധി എന്ന അർഥവും ആദ്യ ഉപവാക്യവുമായുള്ള പദപ്രതിധ്വനിയും നിലനിർത്തുന്നു; ‘ശിക്ഷാവിധിക്കപ്പെടുക’ എന്നു ശക്തിപ്പെടുത്തി അന്തിമ ശിക്ഷാവിധി മുൻകൂട്ടി നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: രണ്ടാം ഉപവാക്യം അന്തിമ ശിക്ഷാവിധിയെയാണോ ദൈവികമായ ശിക്ഷണവിധിയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: അർഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘വിധിക്കപ്പെടുക’ എന്നു നൽകി
  alternative: ‘ശിക്ഷാവിധിക്കപ്പെടുക’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ ശിക്ഷണവിധിക്ക് വിധേയരാകുക’
  rationale: തൊട്ടടുത്ത വാക്യം കർത്താവിന്റെ വിധിയെയും ലോകത്തോടൊപ്പമുള്ള ശിക്ഷാവിധിയെയും വേർതിരിക്കുന്നു. അതിനാൽ ഈ വാക്യം പറയുന്നതിലധികം നിർണയിക്കാതെ ദൈവികവിധിയുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള സന്ദർഭപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ഉപാധിവാക്യവും ഇരുക്രിയകളിലുമുള്ള പദപ്രതിധ്വനിയും കഴിയുന്നത്ര സ്വാഭാവികമായി നിലനിർത്തി.
