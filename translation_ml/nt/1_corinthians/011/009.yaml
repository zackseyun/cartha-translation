  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: ml
  text: കാരണം, പുരുഷൻ സ്ത്രീക്കുവേണ്ടിയല്ല സൃഷ്ടിക്കപ്പെട്ടത്; സ്ത്രീ പുരുഷനുവേണ്ടിയാണ് സൃഷ്ടിക്കപ്പെട്ടത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്ത്രീ നിമിത്തം / പുരുഷൻ നിമിത്തം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ഈ പൂർവപ്രത്യയപ്രയോഗം കാരണമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം; ഇവിടെ സൃഷ്ടിയെ ആധാരമാക്കിയ വാദം പ്രതിഫലിപ്പിക്കാൻ ‘വേണ്ടി’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: കാരണം
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ‘കാരണം’ എന്നു നൽകുന്നു; καί നൽകുന്ന നേരിയ ഊന്നൽ വാക്യഘടനയിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: ἐκτίσθη
  choice: സൃഷ്ടിക്കപ്പെട്ടത്
  rationale: κτίζω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ഉല്പത്തി-സൃഷ്ടിവിവരണത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἀνὴρ / γυνὴ
  choice: പുരുഷൻ / സ്ത്രീ
  rationale: ഇവിടെ വിവാഹബന്ധം മാത്രമല്ല, സൃഷ്ടിവിവരണത്തിലെ പൊതുവായ പുരുഷ-സ്ത്രീ പരാമർശമാണ്; അതിനാൽ ‘ഭർത്താവ്/ഭാര്യ’ ഒഴിവാക്കുന്നു.
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: സ്ത്രീക്കുവേണ്ടി / പുരുഷനുവേണ്ടി
  rationale: διά + accusative ഉദ്ദേശ്യം, പ്രയോജനം, അല്ലെങ്കിൽ കാരണം സൂചിപ്പിക്കാം. സൃഷ്ടിയെ ആധാരമാക്കിയ വാദത്തിൽ ‘വേണ്ടി’ ഉദ്ദേശ്യ/പ്രയോജനഭാവം സ്വാഭാവികമായി നൽകുകയും ഗ്രീക്കിലെ സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ എന്നതിനുപകരം വിരാമചിഹ്നത്തിനു ശേഷം പ്രതിലോമ ഘടന
  rationale: മലയാളത്തിൽ ‘അല്ല ... ആണ്’ എന്ന സമാന്തര പ്രതിലോമഘടന ഗ്രീക്കിലെ ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀνήρ/γυνή എന്നവയെ ‘പുരുഷൻ/സ്ത്രീ’ എന്നോ ‘ഭർത്താവ്/ഭാര്യ’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: പുരുഷൻ/സ്ത്രീ
  alternative: ഭർത്താവ്/ഭാര്യ
  rationale: ‘സൃഷ്ടിക്കപ്പെട്ടു’ എന്ന പരാമർശം ഉല്പത്തി സൃഷ്ടിവിവരണത്തെ ആധാരമാക്കുന്നതിനാൽ വിവാഹിത ദമ്പതികളിൽ മാത്രം ഒതുക്കാതെ പൊതുവായ പുരുഷ-സ്ത്രീ അർഥം നിലനിർത്തുന്നു.
- issue: διά + accusative കാരണം എന്നോ ഉദ്ദേശ്യം/പ്രയോജനം എന്നോ വ്യക്തമാക്കുക
  choice: ‘വേണ്ടി’ എന്നു പ്രധാനപാഠത്തിൽ നൽകി, കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക
  alternative: ‘നിമിത്തം’ അല്ലെങ്കിൽ ‘കാരണം’
  rationale: സന്ദർഭത്തിലെ സൃഷ്ടിക്രമവാദത്തിന് ഉദ്ദേശ്യ/പ്രയോജനാർഥം യോജിച്ചാലും, ഗ്രീക്ക് പ്രയോഗത്തിലെ യഥാർഥ കാരണാർഥസാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുരുഷൻ/സ്ത്രീ’ പൊതുവായ സൃഷ്ടിപരാമർശം വ്യക്തമാക്കുന്നു; ‘അല്ല ... ആണ്’ എന്ന ഘടന മൂലപാഠത്തിലെ സമാന്തര വൈരുധ്യം വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
