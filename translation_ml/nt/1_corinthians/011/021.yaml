id: 1CO.11.21
reference: 1 Corinthians 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: ml
  text: കാരണം, ഭക്ഷണം കഴിക്കുമ്പോൾ ഓരോരുത്തനും സ്വന്തം അത്താഴം മുൻകൂട്ടി കഴിക്കുന്നു[a]; ഒരാൾ വിശന്നിരിക്കുകയും മറ്റൊരാൾ മത്തനാകുകയും ചെയ്യുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്വന്തം ഭക്ഷണം മറ്റുള്ളവർക്കുമുമ്പേ കഴിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘മുൻകൂട്ടി എടുക്കുക’ എന്നും മറ്റുള്ളവരെ കാത്തിരിക്കാതെ മുന്നോട്ടുപോകുക എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരാൾ വിശന്നുകിടക്കുന്നു; മറ്റൊരാൾ മത്തനായിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: വിതരണാർഥമുള്ള ഏകവചനത്തിന്റെ വ്യക്തിവൽക്കരണശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: മുൻവാക്യത്തിലെ ശാസനയ്ക്കുള്ള കാരണം ഈ വാക്യം നൽകുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമാകാവുന്ന ‘എന്തെന്നാൽ’ ചേർക്കാതെ കാരണബന്ധം ഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ ἴδιον δεῖπνον
  choice: സ്വന്തം അത്താഴം
  rationale: ἴδιον സ്വകാര്യ ഉടമസ്ഥതയെ ഊന്നുന്നു; δεῖπνον ഭക്ഷണത്തെയോ അത്താഴത്തെയോ സൂചിപ്പിക്കുന്നു. സമീപസന്ദർഭത്തിലെ കർത്താവിന്റെ അത്താഴവുമായി ഉള്ള പദബന്ധവും ‘അത്താഴം’ നിലനിർത്തുന്നു.
- source_word: προλαμβάνει
  choice: മറ്റുള്ളവരെ കാത്തുനിൽക്കാതെ ... കഴിച്ചുതുടങ്ങുന്നു
  rationale: മുൻകൂട്ടി എടുക്കുക എന്നതും മറ്റുള്ളവരെ കാത്തിരിക്കാതെ മുന്നോട്ടുപോകുക എന്നതും ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; പകരംവായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐν τῷ φαγεῖν
  choice: ഭക്ഷണം കഴിക്കുമ്പോൾ
  rationale: ἐν സഹിതമുള്ള articular infinitive-ന്റെ കാലാർഥം അധിക വ്യാഖ്യാനമില്ലാതെ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ഒരാൾ ... മറ്റൊരാൾ
  rationale: പങ്കെടുക്കുന്നവർക്കിടയിലെ വിരുദ്ധഫലങ്ങൾ ചുരുക്കമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: πεινᾷ
  choice: വിശന്നിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ അവസ്ഥ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: μεθύει
  choice: മദ്യപിച്ചു മത്തനാകുന്നു
  rationale: യഥാർത്ഥ ലഹരിയെ മയപ്പെടുത്താതെ, ആ അവസ്ഥയിലേക്കുള്ള പുരോഗതിയും ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: വിതരണാർഥമുള്ള ഏകവചനവും ലിംഗസൂചനയും
  choice: ഓരോരുത്തനും ... സ്വന്തം
  alternative: ഓരോ വ്യക്തിയും ... അവരവരുടെ
  rationale: മലയാളത്തിലെ ‘സ്വന്തം’ ലിംഗനിരപേക്ഷമായി ഉടമസ്ഥബന്ധം വ്യക്തമാക്കുന്നു; ‘ഓരോരുത്തനും’ ഗ്രീക്കിലെ വിതരണാർഥമുള്ള ഏകവചനത്തെ നിലനിർത്തുന്നു. വ്യാകരണലിംഗത്തെ അനാവശ്യമായി പുരുഷന്മാർക്കു മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- issue: കർത്താവിന്റെ അത്താഴത്തിലെ ദുരുപയോഗത്തിന്റെ സ്വഭാവം
  choice: മദ്യപിച്ചു മത്തനാകുന്നു
  alternative: മത്തനായിരിക്കുന്നു
  rationale: μεθύει യഥാർത്ഥ മദ്യലഹരിയെ സൂചിപ്പിക്കുന്നതിനാൽ അതിനെ വെറും അമിതഭക്ഷണമെന്നാക്കി മയപ്പെടുത്തിയിട്ടില്ല; എങ്കിലും ക്രിയയെ അവസ്ഥയായും വായിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പങ്കുവെക്കേണ്ട അത്താഴത്തോട് വിരുദ്ധമായി സ്വകാര്യമായി ഭക്ഷിക്കുന്നതും വിശപ്പും മദ്യലഹരിയും തമ്മിലുള്ള കടുത്ത വൈരുധ്യവും നിലനിർത്തിയിരിക്കുന്നു.
