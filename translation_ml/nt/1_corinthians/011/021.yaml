revisions:
- from: ഭക്ഷണം കഴിക്കുമ്പോൾ ഓരോരുത്തനും മറ്റുള്ളവരെ കാത്തുനിൽക്കാതെ സ്വന്തം അത്താഴം കഴിച്ചുതുടങ്ങുന്നു[a]. അങ്ങനെ ഒരാൾ വിശന്നിരിക്കുകയും മറ്റൊരാൾ മദ്യപിച്ചു മത്തനാകുകയും ചെയ്യുന്നു[b].
