base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഈ അപ്പം തിന്നുകയും പാനപാത്രത്തിൽനിന്ന്[b] കുടിക്കുകയും ചെയ്യുമ്പോഴൊക്കെയും[a], കർത്താവ് വരുന്നതുവരെ അവിടുത്തെ മരണം നിങ്ങൾ പ്രഘോഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങൾ ഈ അപ്പം തിന്നുകയും പാനപാത്രത്തിൽനിന്ന് കുടിക്കുകയും ചെയ്യുന്ന ഓരോ തവണയും.’'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘പാനപാത്രം’ എന്നാണ്; ഈ വാക്യത്തിൽ ‘ഈ പാനപാത്രം’ എന്നല്ല, എങ്കിലും സന്ദർഭം ഏത് പാനപാത്രമാണെന്നു വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: ചെയ്യുമ്പോഴൊക്കെയും
  rationale: ഓരോ തവണയും ആവർത്തിച്ച് സംഭവിക്കുന്ന അനിശ്ചിത സന്ദർഭം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായി ആവർത്തനബലം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമവും സന്ദർഭവും സ്വാഭാവികമായി നൽകുന്നു; ‘എന്തെന്നാൽ’ ചേർത്താൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ കൃത്രിമമാകും.
- source_word: ἐσθίητε
  choice: തിന്നുകയും
  rationale: അനിശ്ചിത കാലവാക്യത്തിലെ വർത്തമാന സബ്ജങ്ക്റ്റീവിനെ മലയാളത്തിൽ സ്വാഭാവികമായ സാധാരണ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸν ἄρτον τοῦτον
  choice: ഈ അപ്പം
  rationale: τοῦτον എന്ന സൂചനാപദവും ἄρτος എന്ന സാധാരണ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ ποτήριον πίνητε
  choice: പാനപാത്രത്തിൽനിന്ന് കുടിക്കുകയും
  rationale: ഗ്രീക്കിൽ ‘പാനപാത്രം കുടിക്കുക’ എന്നത് അതിലെ പാനീയം കുടിക്കുന്നതിനുള്ള മെറ്റോണിമിയാണ്. മലയാളത്തിൽ അർഥം സ്വാഭാവികമാക്കാൻ ‘പാനപാത്രത്തിൽനിന്ന്’ എന്നു നൽകി; ഗ്രീക്കിൽ ‘ഈ’ ഇല്ലെന്നത് നിലനിർത്തി.
- source_word: καταγγέλλετε
  choice: പ്രഘോഷിക്കുന്നു
  rationale: പരസ്യമായി അറിയിക്കുക, പ്രഖ്യാപിക്കുക എന്ന ഔപചാരികവും ശക്തവുമായ അർഥം നൽകുന്നു.
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: അവിടുത്തെ മരണം
  rationale: മുൻപുള്ള ‘കർത്താവ്’ എന്ന വ്യക്തിയെ ആദരസൂചക സർവനാമത്തിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ പരാമർശിക്കുന്നു; മരണത്തിന്റെ ഉടമസ്ഥബന്ധം വ്യക്തമാണ്.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ κύριος എന്നതിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള സമാനപദം.
- source_word: ἄχρι οὗ ἔλθῃ
  choice: കർത്താവ് വരുന്നതുവരെ
  rationale: ഗ്രീക്കിൽ കർത്താവ് തന്നെയാണ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാകുന്ന കർത്താവ്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ വിഷയം വ്യക്തമായി ആവർത്തിച്ചു.
theological_decisions:
- issue: ἄχρι οὗ ἔλθῃ എന്നതിലെ പരോക്ഷ കർത്താവ്
  choice: വരുന്നത് കർത്താവാണെന്ന് വാചകത്തിൽ വ്യക്തമാക്കി.
  alternative: ‘അവിടുന്ന് വരുന്നതുവരെ’ എന്ന് സർവനാമം ഉപയോഗിക്കുക.
  rationale: തൊട്ടുമുൻപുള്ള κύριος ആണ് ഏറ്റവും സ്വാഭാവികമായ പൂർവപദം; ഇത് കർത്താവിന്റെ വരവിനെക്കുറിച്ചുള്ള സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു, അധിക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: കർത്താവിന്റെ അത്താഴത്തെക്കുറിച്ചുള്ള സാക്രമെന്റൽ വ്യാഖ്യാനം
  choice: അപ്പം തിന്നൽ, പാനപാത്രത്തിൽനിന്ന് കുടിക്കൽ, കർത്താവിന്റെ മരണം പ്രഘോഷിക്കൽ എന്നിവ മാത്രം നേരിട്ട് പ്രസ്താവിച്ചു.
  alternative: കൂടുതൽ സാക്രമെന്റൽ അർഥമോ കേവലം സ്മാരകപരമായ അർഥമോ ചേർത്ത പരാവർത്തനം.
  rationale: ഈ പ്രവൃത്തി കർത്താവിന്റെ മരണം പ്രഘോഷിക്കുന്നു എന്ന് വാക്യം പറയുന്നു; എന്നാൽ സമ്പൂർണ സാക്രമെന്റൽ ദൈവശാസ്ത്രം ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പാനപാത്രം കുടിക്കുക’ എന്ന അസ്വാഭാവിക പദാനുപദരൂപത്തിനു പകരം അർഥസുതാര്യമായ ‘പാനപാത്രത്തിൽനിന്ന് കുടിക്കുക’ ഉപയോഗിച്ചു. മുഖ്യവാചകത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
