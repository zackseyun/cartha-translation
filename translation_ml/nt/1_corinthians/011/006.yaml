id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: ml
  text: കാരണം, ഒരു സ്ത്രീ[a] തല മൂടുന്നില്ലെങ്കിൽ, അവൾ മുടിയും വെട്ടിക്കളയട്ടെ; എന്നാൽ മുടി വെട്ടിക്കളയുന്നതോ തല മൊട്ടയടിക്കുന്നതോ ഒരു സ്ത്രീക്ക് അപമാനകരമാണെങ്കിൽ, അവൾ തല മൂടട്ടെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭാര്യ’; ഗ്രീക്ക് പദമായ gynē സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നോ ‘ഭാര്യ’ എന്നോ അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘മൂടുപടം ധരിക്കട്ടെ.’ ഗ്രീക്കിൽ ‘മൂടപ്പെടുക’ എന്നാണ്; സന്ദർഭം തലമൂടലിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: തല മൂടുന്നില്ലെങ്കിൽ / തല മൂടട്ടെ
  rationale: ക്രിയയ്ക്ക് ‘മൂടുക’ അല്ലെങ്കിൽ ‘മൂടുപടമിടുക’ എന്നർഥമുണ്ട്. സന്ദർഭം തലമൂടലിനെക്കുറിച്ചായതിനാൽ, ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത ‘തല’ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കും വ്യക്തതയ്ക്കുമായി ചേർത്തു; പ്രത്യേകതരം വസ്ത്രം നിർദേശിച്ചിട്ടില്ല.
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഈ വാക്യം ഭർത്താവിനെ വ്യക്തമായി പരാമർശിക്കാതെ പൊതുവായി പ്രസ്താവിക്കുന്നതിനാൽ ‘സ്ത്രീ’ എന്ന വിശാലമായ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
- source_word: κειράσθω / τὸ κείρασθαι
  choice: മുടി വെട്ടിക്കളയട്ടെ / മുടി വെട്ടിക്കളയുന്നത്
  rationale: ഈ പദം മുടി കത്രിക്കുകയോ ചെറുതായി വെട്ടിക്കളയുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘മൊട്ടയടിക്കുക’ എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്താനും സാധാരണ മുടിവെട്ടലെന്ന മൃദുവായ അർഥം ഒഴിവാക്കാനും ‘വെട്ടിക്കളയുക’ ഉപയോഗിച്ചു.
- source_word: ξυρᾶσθαι
  choice: തല മൊട്ടയടിക്കുന്നത്
  rationale: ക്ഷൗരം ചെയ്ത് മുടി പൂർണമായി നീക്കുന്നതാണ് സൂചന. മലയാളത്തിൽ സ്വാഭാവികവും മുൻപത്തെ മുടിവെട്ടലിൽനിന്ന് വ്യക്തമായി വേറിട്ടതുമായ പ്രയോഗമാണിത്.
- source_word: αἰσχρόν
  choice: അപമാനകരം
  rationale: സാമൂഹികമായ ലജ്ജയും മാനഹാനിയും ഉൾപ്പെടുന്ന പദത്തിന്റെ ഭാവം ‘അപമാനകരം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καί
  choice: -യും ചെയ്യട്ടെ
  rationale: തല മൂടാതിരിക്കുന്നതിന്റെ തുടർനടപടി എന്ന വാദക്രമം ‘കൂടി/യും’ എന്ന ആശയത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: γὰρ ... δὲ
  choice: എങ്കിൽ ... എന്നാൽ
  rationale: മുൻവാക്യത്തെ പിന്തുണയ്ക്കുന്ന കാരണവിവരണവും അതിനുള്ളിലെ വൈരുധ്യവും മലയാളത്തിലെ വ്യവസ്ഥാ-വൈരുധ്യ ഘടനയിൽ സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
theological_decisions:
- issue: γυνή എന്നത് ‘സ്ത്രീ’യോ ‘ഭാര്യ’യോ
  choice: സ്ത്രീ
  alternative: ഭാര്യ
  rationale: വാക്യത്തിൽ ഭർത്താവിനെ വ്യക്തമായി പരാമർശിക്കുന്നില്ല; അതിനാൽ അർഥം വിവാഹിതരായ സ്ത്രീകളിൽ മാത്രം പരിമിതപ്പെടുത്താതെ ‘സ്ത്രീ’ സ്വീകരിച്ചു. സന്ദർഭപരമായി ‘ഭാര്യ’ സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: κατακαλύπτω ഒരു പ്രത്യേക മൂടുപടത്തെ നിർദേശിക്കുന്നുണ്ടോ
  choice: തല മൂടുക
  alternative: മൂടുപടം ധരിക്കുക
  rationale: മൂലക്രിയ മൂടുന്നതിനെ വ്യക്തമാക്കുന്നു, എന്നാൽ മൂടിയുടെ പ്രത്യേക രൂപമോ വസ്തുവോ നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക വസ്ത്രത്തെ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ വിശാലമായ പ്രയോഗം സ്വീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. വാദത്തിന്റെ കർശനമായ വ്യവസ്ഥാ ഘടനയും മുടി വെട്ടുന്നതും മൊട്ടയടിക്കുന്നതും തമ്മിലുള്ള വ്യത്യാസവും നിലനിർത്തി. പ്രത്യേക മൂടുപടമോ സഭാപാരമ്പര്യമോ പാഠത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
