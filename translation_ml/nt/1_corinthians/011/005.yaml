id: 1CO.11.5
reference: 1 Corinthians 11:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: ml
  text: എന്നാൽ തല മൂടാതെ[b] പ്രാർഥിക്കുകയോ പ്രവചിക്കുകയോ ചെയ്യുന്ന ഓരോ സ്ത്രീയും തന്റെ തലയെ[a] അപമാനിക്കുന്നു. കാരണം, അത് മുണ്ഡനം ചെയ്യപ്പെട്ടിരിക്കുന്നതിന് ഒന്നുതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഓരോ ഭാര്യയും … തന്റെ ഭർത്താവിനെ/തലയെ അപമാനിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. γυνή എന്ന ഗ്രീക്ക് പദത്തിന് ‘സ്ത്രീ’ അല്ലെങ്കിൽ ‘ഭാര്യ’ എന്നും അർഥമാകാം; ചുറ്റുപാടുള്ള സന്ദർഭത്തിൽ ‘തല’ എന്നത് അക്ഷരാർഥത്തിലോ രൂപകാലങ്കാരപരമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘മൂടാതെ’ എന്ന പദം ഏതു തരത്തിലുള്ള മൂടലാണെന്ന് സ്വതവേ വ്യക്തമാക്കുന്നില്ല. പൗലോസ് പ്രത്യേകിച്ച് ഒരു മൂടുപടത്തെയാണോ അതോ പൊതുവേ മൂടപ്പെടാത്ത തലയെയാണോ ഉദ്ദേശിക്കുന്നതെന്നതിൽ വ്യാഖ്യാതാക്കൾക്കിടയിൽ അഭിപ്രായവ്യത്യാസമുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഇവിടെ ‘പ്രാർഥിക്കുകയോ പ്രവചിക്കുകയോ ചെയ്യുന്ന ഓരോ സ്ത്രീയും’ എന്ന പൊതുവായ പ്രയോഗത്തിന് ‘സ്ത്രീ’ സ്വാഭാവികമാണ്; വിവാഹസ്ഥിതി അനാവശ്യമായി നിർണയിക്കുന്നില്ല. ‘ഭാര്യ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: പ്രാർഥിക്കുകയോ പ്രവചിക്കുകയോ ചെയ്യുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപങ്ങൾ സൂചിപ്പിക്കുന്ന തുടരുന്ന പ്രവർത്തനം സ്വാഭാവികമായ മലയാള ആപേക്ഷികവാക്യത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: തല മൂടാതെ
  rationale: തല മൂടപ്പെടാത്ത അവസ്ഥയെ ലളിതമായും സ്വാഭാവികമായും അറിയിക്കുന്നു; മൂടുപടം, മുടി, മറ്റേതെങ്കിലും പ്രത്യേക മൂടൽ എന്നിവയിൽ ഒന്നും വാചകത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: καταισχύνει
  choice: അപമാനിക്കുന്നു
  rationale: പൊതുവായ ലജ്ജയും മാനഹാനിയും ഉൾക്കൊള്ളുന്ന സാമൂഹിക അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: തന്റെ തലയെ
  rationale: ഗ്രീക്കിലെ ‘അവളുടെ തല’ എന്ന പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു. ഇത് ശരീരത്തിലെ തലയാണോ സന്ദർഭത്തിലെ രൂപകാലങ്കാരപരമായ ‘തല’യാണോ എന്ന് മുഖ്യവാചകം തീരുമാനിക്കുന്നില്ല.
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτὸ
  choice: …പോലെ തന്നെയാണ്
  rationale: രണ്ടും ഒന്നുതന്നെയാണെന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τῇ ἐξυρημένῃ
  choice: തല മുണ്ഡനം ചെയ്യപ്പെട്ടവൾ
  rationale: പൂർണ്ണ കൃദന്തം സൂചിപ്പിക്കുന്ന, മുണ്ഡനം നടന്നുകഴിഞ്ഞതിന്റെ ഫലാവസ്ഥ നിലനിർത്തുന്നു; സ്ത്രീലിംഗരൂപവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘തന്റെ തലയെ അപമാനിക്കുന്നു’ എന്നതിലെ രണ്ടാമത്തെ κεφαλήയുടെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘തന്റെ തലയെ’ എന്ന അവ്യക്തത നിലനിർത്തി.
  alternative: ശരീരത്തിലെ തല; അല്ലെങ്കിൽ സന്ദർഭത്തിലെ ബന്ധപരമായ/രൂപകാലങ്കാരപരമായ തല, അതായത് ഭർത്താവ് അല്ലെങ്കിൽ പുരുഷൻ.
  rationale: ഉടനെയുള്ള ഗ്രീക്ക് പദപ്രയോഗം അക്ഷരാർഥം അനുവദിക്കുമ്പോൾ വിശാലസന്ദർഭം രൂപകാലങ്കാരപരമായ സാധ്യതയും ഉയർത്തുന്നു. അതിനാൽ വിവർത്തനം ഒരു വ്യാഖ്യാനം മാത്രം ഉറപ്പിക്കുന്നില്ല.
- issue: ‘മൂടാതെ’ എന്നതിലെ മൂടലിന്റെ സ്വഭാവം
  choice: ഏതു തരത്തിലുള്ള മൂടലാണെന്ന് വ്യക്തമാക്കാതെ പൊതുവായി ‘തല മൂടാതെ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: മൂടുപടമില്ലാതെ; മുടി ഒരു പ്രത്യേക രീതിയിൽ മൂടാതെയോ അഴിച്ചിട്ടോ.
  rationale: ἀκατακάλυπτος മൂടപ്പെടാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മൂടലിന്റെ വസ്തുവോ കൃത്യരൂപമോ സ്വതവേ നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രവചിക്കുക’, ‘മുണ്ഡനം ചെയ്യപ്പെടുക’ എന്നീ പരിചിതമായ ബൈബിൾ/പൊതുപദങ്ങൾ നിലനിർത്തി; എന്നാൽ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട ‘തലയെ അപമാനിക്കുന്നു’ എന്ന ഭാഗത്തിനു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
