reference: 1 Corinthians 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τις δοκεῖ φιλόνεικος εἶναι, ἡμεῖς τοιαύτην συνήθειαν οὐκ ἔχομεν, οὐδὲ αἱ ἐκκλησίαι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: ml
  text: എന്നാൽ, ആരെങ്കിലും തർക്കപ്രിയനായി തോന്നുന്നുവെങ്കിൽ[a], ഞങ്ങൾക്ക് അത്തരമൊരു പതിവില്ല[b]; ദൈവത്തിന്റെ സഭകൾക്കും ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കലഹപ്രിയൻ” അല്ലെങ്കിൽ “വഴക്കിനു താത്പര്യമുള്ളവൻ.”
    reason: lexical_alternative
  - marker: b
    text: “അത്തരമൊരു പതിവ്” എന്നത് തർക്കപ്രിയനായിരിക്കുന്ന രീതിയെയോ, മുൻവാക്യങ്ങളിൽ ചർച്ച ചെയ്ത വിവാദവിധേയമായ ആചാരത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: തോന്നുന്നെങ്കിൽ
  rationale: ‘തോന്നുന്നു’ എന്ന അർഥം നിലനിർത്തി, ഒരാളുടെ പ്രകടമായ മനോഭാവമാണോ സ്വയം കരുതുന്നതാണോ എന്ന സൂക്ഷ്മത നിർബന്ധമായി തീർപ്പാക്കാതെ വിടുന്നു.
- source_word: φιλόνεικος
  choice: തർക്കപ്രിയൻ
  rationale: കലഹത്തിനും വാദപ്രതിവാദത്തിനും ചായുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: τοιαύτην
  choice: അത്തരമൊരു
  rationale: മുൻപറഞ്ഞ കാര്യത്തിലേക്കുള്ള പിന്നോട്ടുള്ള സൂചന നിലനിർത്തുന്നു; കൃത്യമായ സൂചിതവിഷയം വിവർത്തനത്തിൽ നിർണ്ണയിക്കുന്നില്ല.
- source_word: συνήθειαν
  choice: പതിവ്
  rationale: സ്ഥിരമായ ആചാരമോ പ്രയോഗമോ എന്ന വിശാല അർഥം നൽകുന്നു; ഇവിടെ ‘ആചാരം’ എന്നതിനെക്കാൾ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്.
- source_word: οὐκ ἔχομεν
  choice: ഞങ്ങൾക്കു ... ഇല്ല
  rationale: ഗ്രീക്കിലെ ‘ഞങ്ങൾക്ക് ഇല്ല’ എന്ന നേരിട്ടുള്ള ഘടന സംരക്ഷിക്കുന്നു; ‘ഞങ്ങൾ അനുസരിക്കുന്നില്ല’ പോലുള്ള വ്യാഖ്യാനപരമായ ശക്തീകരണം ഒഴിവാക്കുന്നു.
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭകൾ
  rationale: ഉടമസ്ഥത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി ഘടനയും അനേകവചനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അത്തരമൊരു പതിവ്’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: സൂചിതവിഷയം മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കാതെ ‘അത്തരമൊരു പതിവ്’ എന്നു നിലനിർത്തി.
  alternative: തർക്കപ്രിയരാകുന്ന പതിവ്; അല്ലെങ്കിൽ മുൻവാക്യങ്ങളിൽ ചർച്ചചെയ്ത വിവാദപരമായ ആചാരം.
  rationale: τοιαύτην συνήθειαν എന്ന ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും സന്ദർഭത്തിൽ രണ്ടുവിധം ഗ്രഹിക്കാവുന്നതുമാണ്. അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനസന്ദിഗ്ധത വിവർത്തനത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ മാന്യവും തിരുവെഴുത്തിന് യോജിച്ചതുമായ ശൈലി. ‘തർക്കപ്രിയൻ’, ‘പതിവ്’ എന്നീ പദങ്ങൾ സ്വാഭാവികതയും മൂലഭാഷയിലെ അർഥവ്യാപ്തിയും തമ്മിൽ സമതുലിതമാക്കുന്നു; മുഖ്യവാചകത്തിലെ സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
