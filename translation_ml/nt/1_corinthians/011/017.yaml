id: 1CO.11.17
reference: 1 Corinthians 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦτο δὲ ⸂παραγγέλλων οὐκ ἐπαινῶ⸃ ὅτι οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον συνέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: ml
  text: എന്നാൽ, ഈ നിർദേശം നൽകിക്കൊണ്ട്[a] ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നില്ല. കാരണം, നിങ്ങൾ ഒന്നിച്ചുകൂടുന്നത് മെച്ചത്തിലേക്കല്ല, മോശത്തിലേക്കാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ ആജ്ഞ നൽകിക്കൊണ്ട്.’ ഗ്രീക്ക് കൃദന്തരൂപത്തിന് നിർദേശം, ദിശാബോധം, അല്ലെങ്കിൽ ആജ്ഞ നൽകുക എന്ന അർഥം വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δὲ
  choice: എന്നാൽ, ഈ
  rationale: Τοῦτο അടുത്തുവരുന്ന നിർദേശത്തെ സൂചിപ്പിക്കുന്നു; δὲ മുൻവിഷയത്തിൽനിന്നുള്ള നേരിയ വൈരുധ്യത്തോടെയുള്ള മാറ്റം അടയാളപ്പെടുത്തുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി.
- source_word: παραγγέλλων
  choice: നിർദേശം നൽകിക്കൊണ്ട്
  rationale: പഠിപ്പിക്കുക, നിർദേശിക്കുക, ആജ്ഞാപിക്കുക എന്നീ അർഥവ്യാപ്തിയുള്ള വർത്തമാനകാല കൃദന്തരൂപം. സന്ദർഭത്തിലെ അധികാരഭാവം നിലനിർത്തിക്കൊണ്ട് അതിനെ അനാവശ്യമായി കടുപ്പിക്കാതിരിക്കാൻ ‘നിർദേശം നൽകിക്കൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οὐκ ἐπαινῶ
  choice: ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നില്ല
  rationale: ἐπαινέω എന്നതിന്റെ നേരിട്ടുള്ള അർഥമായ പ്രശംസിക്കുക/അനുമോദിക്കുക എന്ന ആശയം നൽകുന്നു; 11:2-ലെ പ്രശംസയുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: പൗലോസ് പ്രശംസിക്കാത്തതിന്റെ കാരണം അവതരിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗമാണിവിടെ.
- source_word: οὐκ εἰς τὸ κρεῖσσον ἀλλὰ εἰς τὸ ἧσσον
  choice: മെച്ചത്തിലേക്കല്ല, മോശത്തിലേക്കാണ്
  rationale: εἰς സഹിതമുള്ള താരതമ്യവിശേഷണങ്ങൾ ഫലത്തിലേക്കോ ദിശയിലേക്കോ ഉള്ള നീക്കം സൂചിപ്പിക്കുന്നു. ‘മെച്ചം/മോശം’ എന്ന താരതമ്യജോടി മൂലപാഠത്തിലെ സമാന്തര വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: συνέρχεσθε
  choice: നിങ്ങൾ ഒന്നിച്ചുകൂടുന്നത്
  rationale: സഭായോഗത്തിനായി ആളുകൾ ഒരുമിച്ചുകൂടുന്നതിനെ സൂചിപ്പിക്കുന്ന അകർമകപ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: παραγγέλλων എന്ന പദത്തിലെ അധികാരഭാവം
  choice: നിർദേശം നൽകിക്കൊണ്ട്
  alternative: ആജ്ഞാപിച്ചുകൊണ്ട്
  rationale: ക്രിയയ്ക്ക് ‘ആജ്ഞാപിക്കുക’ എന്ന ശക്തമായ അർഥം സാധ്യമാണെങ്കിലും, ഇവിടെ ആരാധനാസമ്മേളനത്തെക്കുറിച്ചുള്ള അപ്പൊസ്തലിക തിരുത്തൽ അവതരിപ്പിക്കുകയാണ്. ‘നിർദേശം’ അധികാരഭാവം നിലനിർത്തുകയും സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം കടുപ്പം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: εἰς τὸ κρεῖσσον / εἰς τὸ ἧσσον എന്നതിലെ ഉദ്ദേശ്യം-ഫലം അവ്യക്തത
  choice: മെച്ചത്തിലേക്കല്ല, മോശത്തിലേക്കാണ്
  alternative: ഗുണത്തിനല്ല, ദോഷത്തിനാണ്
  rationale: ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഫലമോ എന്നത് കർശനമായി വേർതിരിക്കുന്നില്ല. ‘-ത്തിലേക്ക്’ എന്ന രൂപം ആ തുറന്ന നില സംരക്ഷിക്കുകയും, കൂടിവരവ് നല്ല ഫലത്തിനുപകരം മോശമായ അവസ്ഥയിലേക്കാണ് നയിക്കുന്നതെന്ന വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലപാഠത്തിലെ ശാസനാഭാവം വ്യക്തമായി നിലനിർത്തിയെങ്കിലും അതിനെ അനാവശ്യമായി കടുപ്പിച്ചിട്ടില്ല; ‘മെച്ചം/മോശം’ എന്ന താരതമ്യവൈരുധ്യവും സംരക്ഷിച്ചു.
