id: 1CO.11.24
reference: 1 Corinthians 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: ml
  text: 'അവൻ നന്ദി പറഞ്ഞശേഷം അപ്പം നുറുക്കി ഇങ്ങനെ പറഞ്ഞു: “ഇത് നിങ്ങൾക്കുവേണ്ടിയുള്ള എന്റെ ശരീരമാണ്.[a][b] എന്നെ ഓർക്കുന്നതിനായി ഇത് തുടർന്നും ചെയ്യുക.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങൾക്കുവേണ്ടിയുള്ള” എന്നത് “നിങ്ങൾക്കായി” എന്നോ “നിങ്ങളുടെ നന്മയ്ക്കുവേണ്ടിയുള്ള” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'ചില കൈയെഴുത്തുപ്രതികൾ “നിങ്ങൾക്കുവേണ്ടിയുള്ള” എന്നതിനു ശേഷം “മുറിക്കപ്പെട്ട” എന്നു ചേർക്കുന്നു: “ഇത് നിങ്ങൾക്കുവേണ്ടി മുറിക്കപ്പെട്ട എന്റെ ശരീരമാണ്.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: നന്ദി പറഞ്ഞശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള aorist participle സൂചിപ്പിക്കുന്ന ക്രമം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔκλασεν
  choice: അത് നുറുക്കി
  rationale: ക്രിയയുടെ അർഥം ‘നുറുക്കി’ എന്നാണ്; സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ അപ്പത്തെയാണ് ‘അത്’ സൂചിപ്പിക്കുന്നത്.
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: ഇത് ... എന്റെ ശരീരമാണ്
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള സമവാക്യവാക്യം വ്യാഖ്യാനപരമായ ‘പ്രതിനിധീകരിക്കുന്നു’ എന്ന പദം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടിയുള്ള
  rationale: ὑπέρ + genitive നൽകുന്ന പ്രയോജനപരവും പ്രതിനിധാനപരവുമായ വിശാല അർഥം ഒരു പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തമായി ചുരുക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦτο ποιεῖτε
  choice: ഇത് തുടർന്നും ചെയ്യുക
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം ഈ സ്ഥാപനസന്ദർഭത്തിൽ ആവർത്തിച്ചുള്ള ആചരണത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ അതിന്റെ തുടർച്ചാബലം വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: എന്നെ ഓർക്കുന്നതിനായി
  rationale: ἀνάμνησις സൂചിപ്പിക്കുന്ന സജീവമായ ഓർമിക്കലിനെയും അനുസ്മരണത്തെയും വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: കർത്തൃമേശാസന്ദർഭത്തിലെ ‘ഇത് എന്റെ ശരീരമാണ്’ എന്ന വാക്യത്തിന്റെ അർഥം
  choice: ‘ഇത് ... എന്റെ ശരീരമാണ്’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ഇത് എന്റെ ശരീരത്തെ പ്രതിനിധീകരിക്കുന്നു’ എന്ന പ്രതീകാത്മക വ്യാഖ്യാനം; അല്ലെങ്കിൽ സാന്നിധ്യത്തിന്റെ രീതി വിശദീകരിക്കുന്ന സാക്രമെന്റൽ വ്യാഖ്യാനം.
  rationale: ഗ്രീക്ക് പാഠം സാന്നിധ്യത്തിന്റെ രീതി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പിന്നീടുണ്ടായ ഉപദേശപരമായ തർക്കം പരിഭാഷയിൽ തീർപ്പാക്കാതെ മൂലവാക്യത്തിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ὑπὲρ ὑμῶν എന്നതിന്റെ പ്രയോജനപര/പ്രതിനിധാനപര ബലം
  choice: ‘നിങ്ങൾക്കുവേണ്ടിയുള്ള’
  alternative: ‘നിങ്ങൾക്കായി’; ‘നിങ്ങളുടെ നന്മയ്ക്കുവേണ്ടിയുള്ള’.
  rationale: സ്വീകർത്താക്കളുടെ പ്രയോജനത്തിനും അവർക്കുവേണ്ടിയുമുള്ള പ്രവർത്തനമാണ് വാക്യം സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഒരു സാങ്കേതിക പ്രായശ്ചിത്തസിദ്ധാന്തം പാഠത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ശരീരമാണ്’ എന്ന നേരിട്ടുള്ള രൂപം ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു; ‘തുടർന്നും ചെയ്യുക’ ആവർത്തനബലം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
