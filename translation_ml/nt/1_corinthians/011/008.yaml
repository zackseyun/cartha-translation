id: 1CO.11.8
reference: 1 Corinthians 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀνὴρ ἐκ γυναικός, ἀλλὰ γυνὴ ἐξ ἀνδρός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: ml
  text: എന്തെന്നാൽ, പുരുഷൻ സ്ത്രീയിൽനിന്ന് ഉത്ഭവിച്ചവനല്ല; മറിച്ച് സ്ത്രീ പുരുഷനിൽനിന്ന് ഉത്ഭവിച്ചവളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഭർത്താവ് ഭാര്യയിൽനിന്ന് ഉത്ഭവിച്ചവനല്ല; മറിച്ച് ഭാര്യ ഭർത്താവിൽനിന്ന് ഉത്ഭവിച്ചവളാണ്.” ഗ്രീക്ക് പദങ്ങൾക്ക് ‘പുരുഷൻ/സ്ത്രീ’ എന്നും ‘ഭർത്താവ്/ഭാര്യ’ എന്നും അർഥമാകാം; ഇവിടെ സൃഷ്ടിയുമായി ബന്ധപ്പെട്ട വിശാലമായ അർഥമാണ് സ്വീകരിച്ചിരിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ആണ് (വാക്യാവസാന ഊന്നലിലൂടെ വിശദീകരണബന്ധം)
  rationale: മുൻവാക്യത്തിനുള്ള കാരണം/വിശദീകരണമാണ് γάρ സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിനായി വേറിട്ട ‘എന്തെന്നാൽ’ ചേർക്കാതെ നിഷേധ–പ്രതിവിരുദ്ധ ഘടനയും വാക്യാവസാനത്തിലെ ‘ആണ്’ എന്ന ഊന്നലും ഉപയോഗിച്ചു.
- source_word: ἀνὴρ / ἀνδρός
  choice: പുരുഷൻ / പുരുഷനിൽനിന്ന്
  rationale: സൃഷ്ടിവിവരണത്തെ ആധാരമാക്കുന്ന സന്ദർഭത്തിൽ ‘ഭർത്താവ്’ എന്നതിനേക്കാൾ വിശാലമായ പുരുഷൻ എന്ന അർഥമാണ് യോജിക്കുന്നത്; വിഭക്തിരൂപങ്ങൾ ഉറവിടം വ്യക്തമാക്കുന്നു.
- source_word: γυναικός / γυνὴ
  choice: സ്ത്രീയിൽനിന്ന് / സ്ത്രീ
  rationale: പുരുഷൻ–സ്ത്രീ എന്ന സൃഷ്ടിപരമായ വൈരുധ്യം നിലനിർത്തുന്നു; ‘ഭാര്യ’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം വിവാഹബന്ധത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἐκ / ἐξ
  choice: -യിൽനിന്ന്
  rationale: ഉറവിടമോ ഉത്ഭവമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന്റെ സ്വാഭാവിക മലയാളസമാനം.
- source_word: ἀλλὰ
  choice: ; … ആണ്
  rationale: ‘അല്ല … ആണ്’ എന്ന മലയാളത്തിലെ പ്രതിവിരുദ്ധ ഘടന ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അർധവിരാമം രണ്ട് ഉപവാക്യങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
- source_word: ἐστιν
  choice: ഉണ്ടായവനല്ല / ഉണ്ടായവളാണ്
  rationale: വെറും അസ്തിത്വമല്ല, ἐκ/ἐξ സഹിതം ഉത്ഭവമാണ് പ്രസ്താവിക്കുന്നത്. ലിംഗസൂചനയുള്ള രൂപങ്ങൾ ഗ്രീക്കിലെ പുരുഷൻ–സ്ത്രീ വ്യത്യാസം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνήρ/γυνή എന്ന പദജോടി ‘പുരുഷൻ/സ്ത്രീ’ എന്നോ ‘ഭർത്താവ്/ഭാര്യ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: പുരുഷൻ/സ്ത്രീ
  alternative: ഭർത്താവ്/ഭാര്യ
  rationale: ഉത്ഭവത്തെ (‘നിന്ന്’) മുൻനിർത്തുന്ന സൃഷ്ടിവിവരണമാണ് വാദത്തിന്റെ പശ്ചാത്തലം. അതിനാൽ വിശാലമായ സൃഷ്ടിപരമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും ഗ്രീക്കിലെ യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഉണ്ടായവൻ/ഉണ്ടായവൾ’ ഉത്ഭവബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. [a] മുഖ്യപാഠത്തിൽ കൃത്യമായി ഉൾപ്പെടുത്തി.
