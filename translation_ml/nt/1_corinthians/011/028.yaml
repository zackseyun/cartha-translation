id: 1CO.11.28
reference: 1 Corinthians 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: ml
  text: എന്നാൽ ഒരാൾ തന്നെത്തന്നെ പരിശോധിക്കട്ടെ; അങ്ങനെ ആ അപ്പത്തിൽനിന്നു ഭക്ഷിക്കുകയും ആ പാനപാത്രത്തിൽനിന്നു കുടിക്കുകയും ചെയ്യട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: പരിശോധിക്കട്ടെ
  rationale: പരിശോധിച്ച് യഥാർഥ നില തിരിച്ചറിയുക/അംഗീകരിക്കപ്പെടുന്നതാണോ എന്നു വിലയിരുത്തുക എന്ന ക്രിയയുടെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἄνθρωπος
  choice: ഒരാൾ
  rationale: ഇവിടെ പദം പൊതുവായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; ലിംഗനിർണ്ണയം പ്രധാനമല്ലാത്തതിനാൽ ആധുനിക മലയാളത്തിൽ ഉൾക്കൊള്ളുന്നതും സ്വാഭാവികവുമായ രൂപം.
- source_word: ἑαυτόν
  choice: തന്നെത്തന്നെ
  rationale: പരിശോധന മറ്റൊരാളിലേക്കല്ല, സ്വന്തം വ്യക്തിയിലേക്കാണെന്ന പ്രതിഫലന ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: സ്വയംപരിശോധനയോടു ബന്ധപ്പെട്ടു അതിന്റെ അടിസ്ഥാനത്തിലോ അതിനുശേഷമോ ഭക്ഷിക്കാനും കുടിക്കാനും ഉള്ള നിർദേശം നൽകുന്നു; ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: ἐκ τοῦ ἄρτου / ἐκ τοῦ ποτηρίου
  choice: ആ അപ്പത്തിൽനിന്നു / ആ പാനപാത്രത്തിൽനിന്നു
  rationale: ἐκ എന്ന മുൻപ്രത്യയത്തിന്റെ ‘അതിൽനിന്ന് പങ്കെടുക്കുക’ എന്ന രൂപം ഇരുഭാഗത്തും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സ്വയംപരിശോധനയും ഭക്ഷിച്ചു കുടിക്കലും തമ്മിലുള്ള ബന്ധം
  choice: ‘അങ്ങനെ’ എന്ന ബന്ധപദം ഉപയോഗിച്ച് മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും തുറന്ന അർഥപരിധിയും നിലനിർത്തി.
  alternative: ‘പരിശോധിച്ചശേഷം’ അല്ലെങ്കിൽ ‘യോഗ്യനെന്നു കണ്ടാൽ മാത്രം’
  rationale: മൂലപാഠം സമയം മാത്രമോ യോഗ്യതയുടെ ഒരു പ്രത്യേക മാനദണ്ഡമോ വ്യക്തമായി നിർദേശിക്കുന്നില്ല; അത്തരം വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ നിർദേശശൈലി. ‘ഒരാൾ’ പൊതുവായ ἄνθρωπος എന്ന പദത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘തന്നെത്തന്നെ’ സ്വയംപരിശോധനയുടെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
