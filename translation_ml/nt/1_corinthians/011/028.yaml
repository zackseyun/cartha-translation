  source_fidelity: Greek δοκιμαζέτω … ἑαυτόν is accurately rendered by “ഒരാൾ തന്നെത്തന്നെ പരിശോധിക്കട്ടെ.” The coordinated present imperatives, linked by οὕτως, are retained as “അങ്ങനെ … ഭക്ഷിക്കുകയും … കുടിക്കുകയും ചെയ്യട്ടെ.” “ആ അപ്പത്തിൽനിന്നു” and “ആ പാനപാത്രത്തിൽനിന്നു” appropriately preserve the repeated ἐκ expressions without adding an interpretation of the meal.
