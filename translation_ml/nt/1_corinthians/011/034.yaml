id: 1CO.11.34
reference: 1 Corinthians 11:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: ml
  text: ആർക്കെങ്കിലും വിശക്കുന്നുവെങ്കിൽ, അയാൾ വീട്ടിൽ ഭക്ഷിക്കട്ടെ; നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ ന്യായവിധിക്കു വിധേയരാകാതിരിക്കാനായി. ശേഷിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച് ഞാൻ വരുമ്പോൾ നിർദേശങ്ങൾ നൽകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινᾷ
  choice: വിശക്കുന്നെങ്കിൽ
  rationale: വർത്തമാനകാലത്തിലുള്ള അവസ്ഥയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν οἴκῳ
  choice: വീട്ടിൽവെച്ച്
  rationale: സഭായോഗത്തിൽനിന്ന് വ്യത്യസ്തമായ സ്വന്തം ഗൃഹപരിസരത്തിൽ ഭക്ഷിക്കുന്നതെന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐσθιέτω
  choice: ഭക്ഷിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς κρίμα
  choice: ന്യായവിധിക്കായി
  rationale: κρίμα എന്ന പദത്തിന്റെ വിധി/ന്യായവിധി എന്ന വിശാല അർഥം നിലനിർത്തുകയും അന്തിമ ശിക്ഷാവിധിയെന്ന് അതിയായി നിർണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: συνέρχησθε
  choice: നിങ്ങൾ ഒരുമിച്ചുകൂടുന്നത്
  rationale: ഈ ഭാഗത്ത് സഭയുടെ കൂടിവരവിനെ സൂചിപ്പിക്കാൻ ആവർത്തിക്കുന്ന ക്രിയാസംബന്ധം നിലനിർത്തുന്നു.
- source_word: Τὰ δὲ λοιπὰ
  choice: ശേഷിക്കുന്ന കാര്യങ്ങൾ
  rationale: ഇനിയും നിർദേശം നൽകാനുള്ള വിഷയങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക സംക്രമണം.
- source_word: ὡς ἂν ἔλθω
  choice: ഞാൻ വരുമ്പോൾ
  rationale: പൗലോസിന്റെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഭാവിസന്ദർശനത്തെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: διατάξομαι
  choice: ക്രമപ്പെടുത്താം
  rationale: ആവശ്യമായ ക്രമീകരണങ്ങളും നിർദേശങ്ങളും നൽകുമെന്ന അർഥം സംക്ഷിപ്തവും സന്ദർഭോചിതവുമായി നൽകുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ അത്താഴവുമായി ബന്ധപ്പെട്ട മുന്നറിയിപ്പിൽ κρίμα എന്നതിന്റെ അർഥം
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം (വാ. 29–32) ഇപ്പോഴത്തെ ദൈവിക വിധി/ശിക്ഷണത്തെ ലോകത്തോടൊപ്പമുള്ള അന്തിമ ശിക്ഷാവിധിയിൽനിന്ന് വേർതിരിക്കുന്നു. അതിനാൽ പദത്തിലെ ഗൗരവവും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- issue: τις എന്ന അനിശ്ചിത ഏകവചനവും ഏകവചന ആജ്ഞയും
  choice: ആർക്കെങ്കിലും ... അയാൾ ... ഭക്ഷിക്കട്ടെ
  alternative: ആരെങ്കിലും ... അവർ ഭക്ഷിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത ഏകവചനവും മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞയും മലയാളത്തിൽ വ്യക്തമായി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഒരുമിച്ചുകൂടുന്നത്’ ചുറ്റുമുള്ള സന്ദർഭത്തിലെ സഭായോഗബന്ധം നിലനിർത്തുന്നു; ‘ന്യായവിധി’ κρίμαയിലെ യഥാർഥ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
