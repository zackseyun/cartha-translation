id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: ml
  text: എന്നാൽ ഒരു സ്ത്രീക്ക്[a] നീണ്ട മുടിയുണ്ടെങ്കിൽ, അത് അവളുടെ മഹത്ത്വമാണ്; കാരണം അവളുടെ മുടി ഒരു ആവരണത്തിനു പകരമായി[b] അവൾക്കു നൽകപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ഒരു ഭാര്യക്ക്.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ഒരു ആവരണമായി.’ ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന് അനുരൂപബന്ധമോ പകരംനിൽക്കലോ സൂചിപ്പിക്കാം. മുടി തന്നെയാണ് ആവരണമായി പ്രവർത്തിക്കുന്നതെന്നോ അത് ഒരു ആവരണത്തോടുള്ള ബന്ധത്തിൽ നൽകപ്പെട്ടതാണെന്നോ ഈ പ്രയോഗം മാത്രം നിർണയിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: ഒരു സ്ത്രീ
  rationale: സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നോ ‘ഭാര്യ’ എന്നോ അർഥമാകാം. ഇവിടെ പൊതുവായ പ്രസ്താവനയായതിനാൽ ‘ഒരു സ്ത്രീ’ എന്നു പരിഭാഷപ്പെടുത്തി; മറ്റർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: κομᾷ
  choice: നീണ്ട മുടിയുണ്ടെങ്കിൽ
  rationale: വെറും മുടിയുണ്ടാകുക എന്നതല്ല, മുടി നീട്ടി വളർത്തിയിരിക്കുന്ന അവസ്ഥയാണ് ക്രിയ സൂചിപ്പിക്കുന്നത്. ഈ രൂപം ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: ബഹുമാനമോ പ്രശോഭമോ നൽകുന്ന ഒന്നിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ശക്തിയും പൗലോസിന്റെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പ്രതിധ്വനിയും ‘മഹത്ത്വം’ നിലനിർത്തുന്നു.
- source_word: κόμη
  choice: മുടി
  rationale: തലമുടി, പ്രത്യേകിച്ച് വളർത്തിയ മുടി, എന്നാണ് അർഥം. മുൻക്രിയയിൽ നീളത്തിന്റെ ആശയം വ്യക്തമാക്കിയതിനാൽ ഇവിടെ ‘മുടി’ എന്നു മാത്രം പറയുന്നത് അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἀντί
  choice: പകരമായി
  rationale: പകരംനിൽക്കൽ അല്ലെങ്കിൽ അനുരൂപബന്ധം സൂചിപ്പിക്കാവുന്ന പദമാണിത്. ‘പകരമായി’ അതിന്റെ സാധാരണ ശക്തി നിലനിർത്തുന്നു; വ്യത്യസ്ത വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: περιβολαίου
  choice: ഒരു ആവരണം
  rationale: ചുറ്റിയിടുന്നതോ മൂടുന്നതോ ആയ വസ്തുവിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘മുഖപടം’ പോലുള്ള കൂടുതൽ സവിശേഷമായ പദം മൂലപാഠം നിർബന്ധിക്കുന്നതിലധികം അർഥം ചേർക്കും.
- source_word: δέδοται
  choice: നൽകപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണി രൂപത്തിലെ, നൽകിയ പ്രവൃത്തിയുടെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന ഭാവം ഈ മലയാളരൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: περιβόλαιον എന്നത് പ്രത്യേകമായി ‘മുഖപടം’ എന്നു പരിഭാഷപ്പെടുത്തി സ്ത്രീയുടെ മുടി തന്നെയാണ് ഈ ഭാഗം ആവശ്യപ്പെടുന്ന ശിരോവസ്ത്രം എന്നു നിർണയിക്കണമോ എന്ന ചോദ്യം.
  choice: പദം പൊതുവായി ‘ഒരു ആവരണം’ എന്നു പരിഭാഷപ്പെടുത്തി, വിശാലമായ വ്യാഖ്യാനവിവാദം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ നിലനിർത്തി.
  alternative: ‘ഒരു മുഖപടം’ അല്ലെങ്കിൽ ‘ഒരു മൂടുപടം’
  rationale: ഗ്രീക്ക് നാമം ‘മുഖപടം’ എന്നതിനെക്കാൾ വിശാലമാണ്. പൊതുവായ പരിഭാഷ, തുണികൊണ്ടുള്ള മൂടിയോ പൊതുവായ ശിരോ-ആവരണമോ സ്വാഭാവിക മുടിയും മറ്റൊരു ആവരണവും തമ്മിലുള്ള അനുരൂപതയോ—ഇവയിൽ ഒന്നിനെ നിർബന്ധമായി തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ആവരണം’ അല്പം ഔപചാരികമായിരുന്നാലും περιβόλαιον എന്ന പദത്തിന്റെ പൊതുവായ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുകയും ‘മുഖപടം’ എന്ന അതിസവിശേഷ വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കരികിൽ വെച്ചിരിക്കുന്നു.
