  to: കാരണം, ഭക്ഷിക്കാനും കുടിക്കാനും നിങ്ങൾക്കു വീടുകളില്ലേ? അതോ, നിങ്ങൾ ദൈവത്തിന്റെ സഭയെ അവജ്ഞയോടെ കാണുകയും ഒന്നുമില്ലാത്തവരെ[a] ലജ്ജിപ്പിക്കുകയും ചെയ്യുന്നുവോ? ഞാൻ നിങ്ങളോട് എന്തു പറയണം? നിങ്ങളെ പ്രശംസിക്കണമോ? ഈ കാര്യത്തിൽ ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നില്ല.
  rationale: ഗ്രീക്കിലെ γάρ-ന്റെ സന്ദർഭബന്ധം ‘കാരണം’ എന്ന പദത്തിലൂടെ പുനഃസ്ഥാപിച്ചു. ‘ഒന്നുമില്ലാത്തവരെ’ എന്ന മുഖ്യപാഠരൂപം നിലനിർത്തി, കാരണം അത് വിഭവങ്ങളോ ഭക്ഷണമോ ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്ന സന്ദർഭം അനുവദിക്കുമ്പോഴും ഗ്രീക്കിലെ അസ്പഷ്ടത ചുരുക്കുന്നില്ല. അടിക്കുറിപ്പിലെ അക്ഷരാർഥവിശദീകരണം മലയാളത്തിൽ പൂർണവും കൃത്യവുമാക്കി.
