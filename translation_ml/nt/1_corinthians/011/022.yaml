id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: ml
  text: കാരണം, ഭക്ഷിക്കാനും കുടിക്കാനും നിങ്ങൾക്കു വീടുകളില്ലേ? അതോ, നിങ്ങൾ ദൈവത്തിന്റെ സഭയെ അവജ്ഞയോടെ കാണുകയും ഒന്നുമില്ലാത്തവരെ[a] ലജ്ജിപ്പിക്കുകയും ചെയ്യുന്നുവോ? ഞാൻ നിങ്ങളോട് എന്തു പറയണം? നിങ്ങളെ പ്രശംസിക്കണമോ? ഈ കാര്യത്തിൽ ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദരിദ്രരെ’ എന്നോ ‘ഭക്ഷണമില്ലാത്തവരെ’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ഇല്ലാത്തവരായവർ’ എന്നാണ്.
    reason: τοὺς μὴ ἔχοντας എന്ന പ്രയോഗത്തിന്റെ വിശാലമായ അക്ഷരാർഥവും സന്ദർഭം അനുവദിക്കുന്ന പ്രധാന വ്യാഖ്യാനങ്ങളും അറിയിക്കാൻ.
lexical_decisions:
- source_word: οἰκίας
  choice: വീടുകൾ
  rationale: സ്വകാര്യമായി ഭക്ഷിക്കാനും കുടിക്കാനുമുള്ള ഇടങ്ങളെ കൂടിവരുന്ന ദൈവസഭയോട് വേർതിരിച്ചുകാട്ടുന്ന ബഹുവചനപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: ഭക്ഷിക്കാനും കുടിക്കാനും
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭ
  rationale: ദൈവത്തിന്റേതായ, കൂടിവരുന്ന വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവായ പൗലോസിന്റെ പ്രയോഗം; സ്ഥാപനപരമായ അർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: καταφρονεῖτε
  choice: അവജ്ഞയോടെ കാണുന്നു
  rationale: വിലകുറച്ചു കാണുകയും നിസ്സാരമായി കരുതുകയും ചെയ്യുന്ന ധാർമിക ഗൗരവം വ്യക്തമാക്കുന്നു; ‘നിന്ദിക്കുന്നു’ എന്നതിലെ വാക്കാൽ അധിക്ഷേപിക്കുന്നു എന്ന സാധ്യത ഒഴിവാക്കുന്നു.
- source_word: καταισχύνετε
  choice: ലജ്ജിപ്പിക്കുന്നു
  rationale: മറ്റൊരാൾക്ക് ലജ്ജ വരുത്തുക എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τοὺς μὴ ἔχοντας
  choice: ഒന്നുമില്ലാത്തവർ
  rationale: ഗ്രീക്കിലെ ‘ഇല്ലാത്തവർ’ എന്ന വിശാലവും അപൂർണവുമായ പ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭം ഭക്ഷണമോ ഭൗതികവിഭവങ്ങളോ ഇല്ലാത്തവരെ സൂചിപ്പിക്കുന്നുവെങ്കിലും മുഖ്യപാഠത്തിൽ ‘ദരിദ്രർ’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: τί εἴπω ὑμῖν;
  choice: ഞാൻ നിങ്ങളോട് എന്തു പറയണം?
  rationale: ആലോചനാത്മകമായ ഉപവാക്യത്തിന്റെ വാചാടോപപരമായ ആശയക്കുഴപ്പം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπαινέσω ὑμᾶς;
  choice: നിങ്ങളെ പ്രശംസിക്കണമോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യവും അതിലെ പരിഹാസധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ἐν τούτῳ
  choice: ഈ കാര്യത്തിൽ
  rationale: ചർച്ചചെയ്യുന്ന പ്രത്യേക പെരുമാറ്റത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
- source_word: οὐκ ἐπαινῶ
  choice: ഞാൻ നിങ്ങളെ പ്രശംസിക്കുന്നില്ല
  rationale: മുൻചോദ്യത്തിലെ അതേ ക്രിയ ആവർത്തിച്ച് പൗലോസിന്റെ വാചാടോപപരമായ ആവർത്തനം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ അത്താഴത്തിന്റെ സന്ദർഭത്തിൽ ‘ഇല്ലാത്തവർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘ഒന്നുമില്ലാത്തവർ’ എന്ന വിശാലപ്രയോഗം
  alternative: ‘ദരിദ്രർ’ അല്ലെങ്കിൽ ‘ഭക്ഷണമില്ലാത്തവർ’
  rationale: സന്ദർഭം ഭൗതികമായി പിന്നാക്കം നിൽക്കുന്ന വിശ്വാസികളെ ശക്തമായി സൂചിപ്പിക്കുന്നുണ്ടെങ്കിലും ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ ‘ഇല്ലാത്തവർ’ എന്നാണ്. അതിനാൽ സാമൂഹികമോ ഭക്ഷണസംബന്ധമോ ആയ അർഥം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് നിശ്ചയിക്കാതെ യഥാർഥ അസ്പഷ്ടത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ തുടർച്ചയായ വാചാടോപചോദ്യങ്ങളും അവസാനത്തെ മൂർച്ചയുള്ള ശാസനയും നിലനിർത്തിയിരിക്കുന്നു. വായനാസൗകര്യത്തിനായി γάρ പ്രത്യേക ബന്ധകപദമായി പരിഭാഷപ്പെടുത്താതെ ആദ്യചോദ്യത്തിന്റെ സന്ദർഭപരമായ വിശദീകരണബലം വാക്യക്രമത്തിലൂടെ പ്രകടമാക്കുന്നു.
