  source_fidelity: ഗ്രീക്കിലെ χρονിക ജനിറ്റീവ് കൃതന്തം (‘നിങ്ങൾ ഒന്നിച്ചുകൂടുമ്പോൾ’), നിഗമനസൂചകമായ οὖν (‘അതുകൊണ്ട്’), ἐπὶ τὸ αὐτό-യുടെ സ്ഥല/ഒരുമിച്ചുകൂടൽ ഭാവം (‘ഒരേ സ്ഥലത്ത്’), കൂടാതെ οὐκ ἔστιν ... φαγεῖν-ന്റെ സന്ദർഭാനുസൃതമായ വിലയിരുത്തൽഭാവം എന്നിവ വിവർത്തനം കൃത്യമായി കൈമാറുന്നു. ‘അവിടെ നടക്കുന്നത്’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ സംക്ഷിപ്തഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യാഖ്യാനിക്കുമ്പോഴും വാക്യത്തിന്റെ അർഥം മാറ്റുന്നില്ല.
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാക്യം സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘കർത്താവിന്റെ അത്താഴം’ മലയാള ക്രൈസ്തവസന്ദർഭത്തിൽ സ്ഥിരവും മാന്യവുമായ പ്രയോഗമാണ്. ‘ഭക്ഷിക്കുക എന്നതല്ല അവിടെ നടക്കുന്നത്’ എന്നത് ഗ്രീക്കിനെ വാക്കിന്-വാക്ക് അനുകരിക്കാതെ പൗലോസിന്റെ വിമർശനാത്മക വിലയിരുത്തൽ വ്യക്തമായി നൽകുന്നു.
