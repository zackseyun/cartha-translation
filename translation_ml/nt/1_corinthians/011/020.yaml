reference: 1 Corinthians 11:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/020.yaml
  text: Therefore[a], when you come together in the same place, it is not to eat the Lord’s supper,
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ ഒരേ സ്ഥലത്ത് ഒന്നിച്ചുകൂടുമ്പോൾ, കർത്താവിന്റെ അത്താഴം ഭക്ഷിക്കുക എന്നതല്ല അവിടെ നടക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നിങ്ങൾ കർത്താവിന്റെ അത്താഴം ഭക്ഷിക്കുന്നില്ല.” അവരുടെ പെരുമാറ്റം നിമിത്തം ആ ഭക്ഷണം ഇനി കർത്താവിന്റെ അത്താഴമായി കണക്കാക്കാനാവില്ല എന്നതിന് ഈ വായന ഊന്നൽ നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: συνερχομένων
  choice: ഒന്നിച്ചുകൂടുമ്പോൾ
  rationale: 'ὑμῶν എന്നതോടുചേർന്ന ജനിറ്റീവ് കൃതന്തം സമയസൂചന നൽകുന്നു: ‘നിങ്ങൾ ഒന്നിച്ചുകൂടുമ്പോൾ.’ സമൂഹമായി കൂടിവരുന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.'
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പറഞ്ഞ ഭിന്നതകളെക്കുറിച്ചുള്ള ശാസനയിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒരേ സ്ഥലത്ത്
  rationale: ഒരേ ഇടത്തോ ഒരേ യോഗത്തിലോ കൂടുന്നതിന്റെ സ്ഥലപരമായ ഭാവം നിലനിർത്തുന്നു; συνερχομένων എന്നതിന്റെ അർഥം വെറുതെ ആവർത്തിക്കുന്നില്ല.
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: ഭക്ഷിക്കുക എന്നതല്ല അവിടെ നടക്കുന്നത്
  rationale: ഗ്രീക്കിലെ ചുരുക്കവും പ്രയോഗസവിശേഷതയുമുള്ള ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു. അവരുടെ പ്രവൃത്തി കർത്താവിന്റെ അത്താഴം ഭക്ഷിക്കൽ എന്നു യഥാർഥമായി വിശേഷിപ്പിക്കാനാവില്ലെന്ന വിലയിരുത്തൽ ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: κυριακὸν
  choice: കർത്താവിന്റെ
  rationale: ‘കർത്താവിനുള്ളത്/കർത്താവിന്റേത്’ എന്ന ഉടമസ്ഥതാസൂചന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δεῖπνον
  choice: അത്താഴം
  rationale: സന്ദർഭത്തിലെ സമൂഹഭക്ഷണത്തെയും യേശുവിന്റെ സ്മരണയുമായി ബന്ധപ്പെട്ട സ്ഥാപിത പ്രയോഗത്തെയും യോജിച്ചവിധം സൂചിപ്പിക്കുന്നു.
- source_word: κυριακὸν δεῖπνον
  choice: കർത്താവിന്റെ അത്താഴം
  rationale: ഗ്രീക്ക് വിശേഷണ-നാമ ഘടന കൃത്യമായി നൽകുന്ന, മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ വ്യക്തവും പരിചിതവുമായ പദസമുച്ചയമാണ്.
theological_decisions:
- issue: പൗലോസ് ഭക്ഷണം കഴിക്കാനുള്ള സാധ്യത തന്നെയാണോ നിഷേധിക്കുന്നത്, അതോ അവരുടെ ആചരണം കർത്താവിന്റെ അത്താഴമായി കണക്കാക്കാനാവില്ലെന്നാണോ പറയുന്നത്?
  choice: അവരുടെ കൂടിവരവും പെരുമാറ്റവും കാരണം അവിടെ നടക്കുന്നത് കർത്താവിന്റെ അത്താഴം ഭക്ഷിക്കൽ എന്നു യഥാർഥമായി പറയാനാവില്ല.
  alternative: ‘നിങ്ങൾ കർത്താവിന്റെ അത്താഴം ഭക്ഷിക്കുന്നില്ല’ അല്ലെങ്കിൽ ‘കർത്താവിന്റെ അത്താഴം ഭക്ഷിക്കാൻ സാധ്യമല്ല.’
  rationale: 21–22 വാക്യങ്ങൾ കാണിക്കുന്നത് പൗലോസ് ഭക്ഷണത്തിന്റെ രീതിയെയും വിഭജനപരമായ പെരുമാറ്റത്തെയും ശാസിക്കുകയാണെന്നാണ്; ഭക്ഷണം കഴിക്കാനുള്ള തത്ത്വപരമായ അസാധ്യതയല്ല വിഷയം. എന്നാൽ ഗ്രീക്ക് ഘടനയിലെ ചുരുക്കവും വ്യാഖ്യാനസാധ്യതയും അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കർത്താവിന്റെ അത്താഴം’ എന്ന പരിചിത പ്രയോഗം നിലനിർത്തി; ഗ്രീക്കിലെ അസ്വാഭാവികമായ ചുരുക്കം വാക്കിന് വാക്കായി പകർത്താതെ അതിന്റെ വിലയിരുത്തൽഭാവവും വ്യാഖ്യാനതീവ്രതയും സംരക്ഷിച്ചു.
