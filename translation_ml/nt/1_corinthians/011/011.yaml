id: 1CO.11.11
reference: 1 Corinthians 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: ml
  text: എങ്കിലും, കർത്താവിൽ സ്ത്രീ പുരുഷനിൽനിന്ന് വേറിട്ടവളല്ല; പുരുഷൻ സ്ത്രീയിൽനിന്ന് വേറിട്ടവനുമല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു വിവർത്തനം: ‘ഭാര്യ ഭർത്താവിൽനിന്ന് വേറിട്ടവളല്ല; ഭർത്താവ് ഭാര്യയിൽനിന്ന് വേറിട്ടവനുമല്ല.’ ഗ്രീക്കുപദങ്ങൾക്ക് ‘സ്ത്രീ/പുരുഷൻ’ എന്നും ‘ഭാര്യ/ഭർത്താവ്’ എന്നും അർത്ഥമാകാം. പ്രസ്താവന വിവാഹത്തിൽ മാത്രം ഒതുങ്ങാതെ പൊതുവായതായി തോന്നുന്നതിനാൽ വിശാലമായ അർത്ഥം മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: എങ്കിലും
  rationale: മുൻവാദത്തെ നിഷേധിക്കാതെ അതിന് തുലനം നൽകുന്ന ആശയമാറ്റം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γυνή
  choice: സ്ത്രീ
  rationale: ഈ പദത്തിന് ‘ഭാര്യ’ എന്നും അർത്ഥമാകാമെങ്കിലും, സൃഷ്ടിയെയും ആരാധനയെയും കുറിച്ചുള്ള വിശാലമായ സന്ദർഭത്തിൽ പൊതുവായ ‘സ്ത്രീ’ എന്ന അർത്ഥമാണ് മുഖ്യപാഠത്തിൽ യോജിച്ചത്.
- source_word: ἀνήρ
  choice: പുരുഷൻ
  rationale: ഈ പദത്തിന് ‘ഭർത്താവ്’ എന്നും അർത്ഥമാകാമെങ്കിലും, ഇവിടെ സ്ത്രീയും പുരുഷനും തമ്മിലുള്ള പൊതുവായ പരസ്പരബന്ധമാണ് മുൻനിലയിൽ.
- source_word: χωρὶς
  choice: കൂടാതെ
  rationale: വേർപാട് അഥവാ മറ്റേയാളിൽനിന്നുള്ള സ്വതന്ത്രനില എന്ന ആശയം അനാവശ്യമായി വ്യാഖ്യാനിച്ചുറപ്പിക്കാതെ ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: കർത്താവുമായുള്ള ബന്ധത്തിന്റെയോ അവനിലുള്ള ജീവിതമേഖലയുടെയോ പൗലോസിന്റെ പതിവ് പ്രയോഗം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: οὔτε ... οὔτε
  choice: '... അല്ല; ... ഉമല്ല'
  rationale: രണ്ട് നിഷേധവാക്യങ്ങളുടെയും സമാന്തരതയും തുലനവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: γυνή / ἀνήρ എന്നിവയെ ‘സ്ത്രീ/പുരുഷൻ’ എന്നോ ‘ഭാര്യ/ഭർത്താവ്’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: സ്ത്രീ/പുരുഷൻ
  alternative: ഭാര്യ/ഭർത്താവ്
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം സൃഷ്ടിയിലും ആരാധനയിലും സ്ത്രീയെയും പുരുഷനെയും കുറിച്ചാണ്; ഈ വാക്യം പരസ്പരാശ്രിതത്വത്തെക്കുറിച്ചുള്ള പൊതുവായ തുലനപ്രസ്താവനയായി തോന്നുന്നു. എങ്കിലും ഗ്രീക്കിലെ വൈവാഹിക അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ സമാന്തരഘടനയും ‘കർത്താവിൽ’ എന്ന പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗവും സംരക്ഷിച്ചിരിക്കുന്നു.
