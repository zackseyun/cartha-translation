id: 1CO.11.19
reference: 1 Corinthians 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ γὰρ καὶ αἱρέσεις ἐν ὑμῖν εἶναι, ἵνα ⸀καὶ οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: ml
  text: നിങ്ങളുടെ ഇടയിൽ കക്ഷിഭേദങ്ങളും ഉണ്ടായിരിക്കേണ്ടതുണ്ട്; അങ്ങനെ പരീക്ഷയിൽ തെളിഞ്ഞവരും നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടും[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കക്ഷിഭേദങ്ങൾ’ എന്നതിന് ‘ഭിന്നതകൾ’ എന്നോ ‘വിഭാഗങ്ങൾ’ എന്നോ വിവർത്തനം ചെയ്യാം. പിൽക്കാല പ്രയോഗത്തിൽ ഈ പദത്തിന് ‘പാഷണ്ഡതകൾ’ എന്ന അർഥവും വന്നു; എന്നാൽ ഇവിടെ സഭയ്ക്കുള്ളിലെ വിഭാഗീയ കൂട്ടുകെട്ടുകളാണ് ഏറ്റവും സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ‘പരീക്ഷയിൽ തെളിഞ്ഞവർ’ എന്നത് ‘അംഗീകൃതർ’ എന്നോ ‘യഥാർഥരെന്ന് തെളിഞ്ഞവർ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: ഉണ്ടാകേണ്ടതാണല്ലോ
  rationale: ആവശ്യകതയെയോ അനിവാര്യതയെയോ ശക്തമായി സൂചിപ്പിക്കുന്നു; അത് ദൈവിക നിർണയമാണോ സാഹചര്യപരമായ അനിവാര്യതയാണോ എന്ന് വിവർത്തനം തീരുമാനിക്കുന്നില്ല.
- source_word: γὰρ
  choice: -ല്ലോ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാള വാക്യാന്ത്യനിപാതത്തിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: καὶ αἱρέσεις
  choice: കക്ഷിഭേദങ്ങളും
  rationale: പിന്നീടുണ്ടായ സാങ്കേതിക അർഥമായ ‘വേദവിരുദ്ധ ഉപദേശം’ എന്നത് ഇറക്കുമതി ചെയ്യാതെ, സഭയ്ക്കുള്ളിലെ വിഭാഗീയ കൂട്ടുകെട്ടുകളെ സൂചിപ്പിക്കുന്നു; καί ‘-ഉം’ ആയി നിലനിർത്തുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ / നിങ്ങളിൽ
  rationale: സമൂഹത്തിനകത്തെ സ്ഥിതിയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുകയും ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ഉദ്ദേശ്യം/ഫലം എന്നീ രണ്ടിനും ഇടമുള്ള ഗ്രീക്ക് സൂക്ഷ്മത നിർബന്ധമായി ഒന്നിലേക്കു ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: καὶ οἱ δόκιμοι
  choice: പരീക്ഷയിൽ തെളിഞ്ഞവർ
  rationale: പരിശോധനയ്ക്കുശേഷം യഥാർഥരെന്നും അംഗീകൃതരെന്നും തെളിയുന്നവരെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: φανεροὶ γένωνται
  choice: ആരെന്ന് വ്യക്തമാകും
  rationale: മറഞ്ഞിരുന്നതു തിരിച്ചറിയാവുന്ന വിധത്തിൽ പ്രകടമാകുന്ന ഫലത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: αἱρέσεις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കക്ഷിഭേദങ്ങൾ
  alternative: ഭിന്നതകൾ; വിഭാഗങ്ങൾ; പാഷണ്ഡതകൾ
  rationale: ഇവിടെ കർത്താവിന്റെ അത്താഴവുമായി ബന്ധപ്പെട്ട സഭയ്ക്കുള്ളിലെ വിഭാഗീയതയാണ് സന്ദർഭം. പിൽക്കാലത്തെ സാങ്കേതിക അർഥമായ ‘heresies’ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: δεῖ എന്നതിലെ ആവശ്യകത
  choice: ഉണ്ടാകേണ്ടതാണ്
  alternative: ഉണ്ടാകുന്നത് അനിവാര്യമാണ്; ദൈവികമായി നിർണയിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ആവശ്യകതയുടെ ഉറച്ച ഭാവം നിലനിർത്തുന്നു; എന്നാൽ അത് ദൈവപരിപാലനപരമായ ആവശ്യമാണോ പ്രായോഗിക അനിവാര്യതയാണോ എന്നു വാക്യം വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനവും തീർപ്പാക്കുന്നില്ല.
- issue: ἵναയുടെ ഉദ്ദേശ്യം/ഫല ഭാവം
  choice: അങ്ങനെ
  alternative: അതുകൊണ്ട്; അതിനുവേണ്ടി
  rationale: കക്ഷിഭേദങ്ങളുടെ ദൈവിക ഉദ്ദേശ്യം എന്നു മാത്രം നിർണയിക്കാതെയും വെറും ഫലം എന്നു ചുരുക്കാതെയും മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘പാഷണ്ഡത’ പോലുള്ള പിൽക്കാല സാങ്കേതിക പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി. വിശദീകരണാത്മകമായ γὰρ-നെ ‘-ല്ലോ’ വഴി സ്വാഭാവികമായി ചേർത്തു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
