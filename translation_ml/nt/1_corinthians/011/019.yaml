review_pass:
  verdict: revise
  source_fidelity: ‘കക്ഷിഭേദങ്ങൾ’ αἱρέσεις-ന്റെ സന്ദർഭോചിതമായ വിവർത്തനമാണ്; ‘ഉണ്ടാകേണ്ടതാണല്ലോ’ δεῖ γάρ-ന്റെ ആവശ്യകതയും വിശദീകരണബന്ധവും പൊതുവേ നന്നായി നൽകുന്നു. എന്നാൽ δεύτερο καί (‘also’) മുഖ്യപാഠത്തിൽ നഷ്ടപ്പെട്ടിരിക്കുന്നു. ‘ആരെന്ന് വ്യക്തമാകും’ എന്നത് മൂലത്തിലെ ‘പരീക്ഷയിൽ തെളിഞ്ഞവർ … വെളിപ്പെടുക’ എന്ന പ്രയോഗത്തെ അവരുടെ തിരിച്ചറിയൽ മാത്രമായി അല്പം ചുരുക്കുന്നു.
  naturalness: ഇപ്പോഴത്തെ വാക്യം വായനാസൗകര്യമുള്ളതാണ്. ‘വെളിപ്പെടും’ ഉപയോഗിക്കുന്നത് വ്യക്തികൾ പ്രകടമാകുന്നതെന്ന മൂലപാഠത്തിന്റെ ആശയം കൂടുതൽ നേരിട്ട് നൽകും. രണ്ടു പ്രാവശ്യവും ‘നിങ്ങളുടെ ഇടയിൽ’ ഉപയോഗിക്കുന്നത് ἐν ὑμῖν-ന്റെ ആവർത്തനം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
  terminology: ‘കക്ഷിഭേദങ്ങൾ’ ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഈ സന്ദർഭത്തിൽ ‘പാഷണ്ഡതകൾ’ എന്ന പിൽക്കാല സാങ്കേതിക അർഥം ഒഴിവാക്കുന്നതുമാണ്. ‘പരീക്ഷയിൽ തെളിഞ്ഞവർ’ δόκιμοι-ക്ക് യോജിക്കുന്നു.
  issues:
  - severity: medium
    issue: καὶ οἱ δόκιμοι-ലുള്ള രണ്ടാമത്തെ καί മുഖ്യപാഠത്തിൽ പ്രതിഫലിക്കുന്നില്ല.
    rationale: ഗ്രീക്കിൽ കക്ഷിഭേദങ്ങൾ ‘also’ ഉണ്ടാകണം എന്നും പരീക്ഷയിൽ തെളിഞ്ഞവർ ‘also’ വെളിപ്പെടണം എന്നും ഊന്നലുണ്ട്. ‘പരീക്ഷയിൽ തെളിഞ്ഞവരും’ എന്ന് ചേർക്കുന്നത് ഈ ഘടകം സംരക്ഷിക്കുന്നു.
  - severity: low
    issue: ‘ആരെന്ന് വ്യക്തമാകും’ എന്ന പ്രയോഗം φανεροὶ γένωνται-ന്റെ വ്യക്തികൾ വെളിപ്പെടുന്ന ആശയത്തെ അവരുടെ ഐഡന്റിറ്റി വ്യക്തമാകുന്നതായി മാറ്റുന്നു.
    rationale: അർഥം വലിയ തോതിൽ നിലനിൽക്കുന്നുണ്ടെങ്കിലും ‘വെളിപ്പെടും’ മൂലപാഠത്തിന്റെ പ്രത്യക്ഷതാഭാവം കൂടുതൽ നേരിട്ട് നൽകുന്നു.
  revised_text: നിങ്ങളുടെ ഇടയിൽ കക്ഷിഭേദങ്ങളും ഉണ്ടായിരിക്കേണ്ടതുണ്ട്; അങ്ങനെ പരീക്ഷയിൽ തെളിഞ്ഞവരും നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടും[a][b].
