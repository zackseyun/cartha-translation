revisions:
- from: നിങ്ങളുടെ ഇടയിൽ കക്ഷിഭേദങ്ങളും ഉണ്ടാകേണ്ടതാണല്ലോ[a]; അങ്ങനെ നിങ്ങളിൽ പരീക്ഷയിൽ തെളിഞ്ഞവർ ആരെന്ന് വ്യക്തമാകും[b].
  to: നിങ്ങളുടെ ഇടയിൽ കക്ഷിഭേദങ്ങളും ഉണ്ടായിരിക്കേണ്ടതുണ്ട്; അങ്ങനെ പരീക്ഷയിൽ തെളിഞ്ഞവരും നിങ്ങളുടെ ഇടയിൽ വെളിപ്പെടും[a][b].
  rationale: രണ്ടാമത്തെ καί-യുടെ ഊന്നൽ ‘പരീക്ഷയിൽ തെളിഞ്ഞവരും’ എന്നിലൂടെ പുനഃസ്ഥാപിച്ചു. ‘ആരെന്ന് വ്യക്തമാകും’ എന്നതിനു പകരം ‘വെളിപ്പെടും’ ഉപയോഗിച്ച് φανεροὶ γένωνται-ന്റെ പ്രകടമാകൽഭാവം സംരക്ഷിച്ചു. ‘അങ്ങനെ’ ἵναയുടെ ഉദ്ദേശ്യം/ഫല സൂക്ഷ്മതയെ ഒരു വ്യാഖ്യാനത്തിലേക്കു പരിമിതപ്പെടുത്തുന്നില്ല.
