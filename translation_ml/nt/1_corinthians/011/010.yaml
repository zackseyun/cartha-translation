id: 1CO.11.10
reference: 1 Corinthians 11:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ὀφείλει ἡ γυνὴ ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς διὰ τοὺς ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/010.yaml
  text: For this reason the woman ought to have authority on her head[b][a], because of the angels.
translation:
  language: ml
  text: ഇക്കാരണത്താൽ സ്ത്രീ തന്റെ തലയിൽ അധികാരം ഉണ്ടായിരിക്കണം[a], ദൂതന്മാർ നിമിത്തം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “തന്റെ തലയിൽ അധികാരത്തിന്റെ അടയാളം ധരിക്കണം.” ഗ്രീക്കുപാഠത്തിൽ “അധികാരം” എന്നാണ്; “അടയാളം” എന്നോ “മൂടുപടം” എന്നോ വ്യക്തമായി പറയുന്നില്ല.'
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ “സന്ദേശവാഹകർ നിമിത്തം”; എങ്കിലും ഇവിടെ “ദൂതന്മാർ” എന്ന അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള പൗലോസിന്റെ കാരണാത്മക നിഗമനം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὀφείλει
  choice: ഉണ്ടായിരിക്കേണ്ടതാണ്
  rationale: ധാർമികമായോ ഉചിതമായോ ഉള്ള ബാധ്യത സൂചിപ്പിക്കുന്നു; അതിനെ കർശനമായ നിയമകല്പനയായി അതിശക്തമാക്കുന്നില്ല.
- source_word: ἡ γυνὴ
  choice: സ്ത്രീ
  rationale: ഗ്രീക്കിലെ നിർദ്ദിഷ്ട ഏകവചനം ഇവിടെ പൊതുവായ പ്രതിനിധാനാർഥത്തിലാണ്; ‘ഭാര്യ’ എന്നു ചുരുക്കേണ്ട ആവശ്യമില്ല.
- source_word: ἐξουσίαν
  choice: അധികാരം
  rationale: ഗ്രീക്കിൽ നേരിട്ട് ‘അധികാരം’ എന്നാണ്; ‘അധികാരത്തിന്റെ അടയാളം’ എന്നോ ‘മൂടുപടം’ എന്നോ ഉള്ള വാക്കുകൾ മൂലപാഠത്തിലില്ല.
- source_word: ἔχειν
  choice: ഉണ്ടായിരിക്കുക
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ധരിക്കുക’ എന്നത് സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനപരമായ ചേർക്കലായിരിക്കും.
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: തന്റെ തലയിൽ
  rationale: സ്വാഭാവികമായ മലയാളത്തിൽ സ്ഥലസംബന്ധിയായ വിശാലത നിലനിർത്തുന്നു.
- source_word: διὰ τοὺς ἀγγέλους
  choice: ദൂതന്മാർ നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം നിലനിർത്തുന്നു. ἄγγελοι എന്നതിന് ഇവിടെ സ്വർഗീയ ദൂതന്മാർ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യത; എന്നാൽ പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘തന്റെ തലയിൽ അധികാരം ഉണ്ടായിരിക്കുക’ എന്ന മൂലപാഠത്തിന്റെ അസാധാരണമായ രൂപം നിലനിർത്തി.
  alternative: ‘തന്റെ തലയിൽ അധികാരത്തിന്റെ അടയാളം ധരിക്കുക’ അല്ലെങ്കിൽ മൂടുപടത്തെ അധികാരത്തിന്റെ അടയാളമായി കാണുക.
  rationale: ഗ്രീക്കിൽ ‘അടയാളം’ അല്ലെങ്കിൽ ‘മൂടുപടം’ എന്ന പദമില്ല. തർക്കവിധേയമായ ഈ പ്രയോഗത്തെ മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ, സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ἀγγέλους എന്ന പദത്തിന്റെ സൂചകം
  choice: ദൂതന്മാർ
  alternative: സന്ദേശവാഹകർ
  rationale: ἄγγελος എന്നതിന് രണ്ടർഥവും സാധ്യമാണെങ്കിലും, വിശേഷണമില്ലാത്ത ബഹുവചനം പൗലോസിന്റെ പ്രയോഗത്തിൽ സാധാരണയായി സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്. അവർ ഇവിടെ പരാമർശിക്കപ്പെടുന്നതിന്റെ കാരണം ഏതെങ്കിലും പ്രത്യേക സിദ്ധാന്തത്തിലൂടെ നിർണയിച്ചിട്ടില്ല.
- issue: γυνή എന്ന പദത്തിന്റെ പരിധി
  choice: സ്ത്രീ
  alternative: ഭാര്യ
  rationale: ചുറ്റുപാടുള്ള വാദം പുരുഷൻ/സ്ത്രീ എന്ന വിശാലമായ ചർച്ചയിലാണ്; അതിനാൽ വിവാഹബന്ധത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലഗ്രീക്കിലെ ദുഷ്കരവും വ്യാഖ്യാനവൈവിധ്യമുള്ളതുമായ ‘തലയിൽ അധികാരം ഉണ്ടായിരിക്കുക’ എന്ന പ്രയോഗം മനപ്പൂർവം ലളിതീകരിക്കാതെ നിലനിർത്തി; വ്യക്തതയ്ക്കായി വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
