id: 1CO.11.4
reference: 1 Corinthians 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: ml
  text: തലയിൽ എന്തെങ്കിലും വെച്ചുകൊണ്ട് പ്രാർഥിക്കുകയോ പ്രവചിക്കുകയോ ചെയ്യുന്ന ഓരോ പുരുഷനും തന്റെ തലയെ അപമാനിക്കുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, പരമ്പരാഗതമായി: “തല മൂടിക്കൊണ്ട്.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “തലയിൽനിന്ന് താഴേക്കു [എന്തെങ്കിലും] ഉള്ളവനായി” എന്നാണ്; കൃത്യമായ മൂടുവസ്തു ഏതെന്ന് പറയുന്നില്ല.'
    reason: lexical_alternative
  - marker: b
    text: “തന്റെ തല” എന്നത് അക്ഷരാർഥത്തിൽ അയാളുടെ സ്വന്തം തലയെ സൂചിപ്പിക്കാം; അതോടൊപ്പം, ചുറ്റുപാടിലുള്ള വാക്യങ്ങളിൽ “തല” എന്ന പദത്തിനുള്ള ബന്ധപരമായ അർഥത്തെയും പ്രതിധ്വനിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: ഓരോ പുരുഷനും
  rationale: ἀνήρ എന്നതിന് സന്ദർഭാനുസരണം ‘പുരുഷൻ’ എന്നോ ‘ഭർത്താവ്’ എന്നോ അർഥമാകാം. ഇവിടെ 5-ാം വാക്യത്തിലെ ‘ഓരോ സ്ത്രീയും’ എന്ന സമാന്തരപ്രയോഗത്തോടൊപ്പം പൊതുവായ പുരുഷപരാമർശമായതിനാൽ, വ്യാഖ്യാനഭാരം കുറഞ്ഞ ‘ഓരോ പുരുഷനും’ തിരഞ്ഞെടുത്തു.
- source_word: προσευχόμενος ἢ προφητεύων
  choice: പ്രാർഥിക്കുകയോ പ്രവചിക്കുകയോ ചെയ്യുന്ന
  rationale: രണ്ട് വർത്തമാനകാല കൃദന്തരൂപങ്ങളെയും സ്വാഭാവികമായ മലയാള ആപേക്ഷികഘടനയിൽ അവതരിപ്പിക്കുന്നു; പ്രവർത്തനത്തിൽ ഏർപ്പെട്ടിരിക്കുന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: κατὰ κεφαλῆς ἔχων
  choice: തലയിൽ എന്തെങ്കിലും ധരിച്ചുകൊണ്ട്
  rationale: ഗ്രീക്ക് പ്രയോഗം അക്ഷരാർഥത്തിൽ തലയിൽനിന്ന് താഴോട്ടോ തലമേലോ എന്തോ ഉണ്ടായിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; കൃത്യമായ മൂടുപടമോ വസ്തുവോ പേരെടുത്തുപറയുന്നില്ല. ‘ധരിച്ചുകൊണ്ട്’ മലയാളത്തിൽ സ്വാഭാവികമാണ്; ‘എന്തെങ്കിലും’ മൂലത്തിലെ അനിർദിഷ്ടത സംരക്ഷിക്കുന്നു.
- source_word: καταισχύνει
  choice: അപമാനിക്കുന്നു
  rationale: ക്രിയയുടെ ലജ്ജിപ്പിക്കുക/മാനംകെടുത്തുക എന്ന അർഥവും ഈ ഭാഗത്തിലെ മാനം–അപമാനം പശ്ചാത്തലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: തന്റെ തലയെ
  rationale: ശാരീരിക തലയെയോ ചുറ്റുപാടിലുള്ള ബന്ധപരമായ ‘തല’ എന്ന ആശയത്തിന്റെ പ്രതിധ്വനിയെയോ വ്യക്തമായി നിശ്ചയിക്കാതെ മൂലത്തിലെ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാനത്തെ κεφαλή ശാരീരിക തലയെയാണോ ബന്ധപരമായ/രൂപകാലങ്കാരപരമായ ‘തല’യെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘തന്റെ തലയെ’ എന്നതിലൂടെ ദ്വയാർഥസാധ്യത നിലനിർത്തുക
  alternative: ‘സ്വന്തം ശാരീരിക തലയെ’ അല്ലെങ്കിൽ ‘തനിക്കു തലയായിരിക്കുന്നവനെ’ എന്ന് വ്യക്തമായി നിർണയിക്കുക
  rationale: പൗലോസിന്റെ വാക്കുകൾ ശാരീരിക തലയും 3-ാം വാക്യത്തിലെ ബന്ധപരമായ ‘തല’യും തമ്മിലുള്ള വാക്ചാതുര്യപരമായ പ്രതിധ്വനിക്ക് ഇടനൽകുന്നു. മുഖ്യപാഠത്തിൽ ഒന്നിനെ മാത്രം ഉറപ്പിക്കുന്നത് ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം അനാവശ്യമായി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രാർഥിക്കുക’, ‘പ്രവചിക്കുക’, ‘അപമാനിക്കുക’ എന്നിവ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന സുതാര്യമായ പദങ്ങളാണ്. മൂലത്തിലെ ലിംഗനിർദിഷ്ടതയും തല എന്ന പദത്തിന്റെ ദ്വയാർഥസാധ്യതയും സംരക്ഷിച്ചു.
