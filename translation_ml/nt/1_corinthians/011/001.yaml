id: 1CO.11.1
reference: 1 Corinthians 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: ml
  text: ഞാൻ മശീഹായെ അനുകരിക്കുന്നതുപോലെ, നിങ്ങളും എന്നെ അനുകരിക്കുന്നവരായിത്തീരുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμηταί
  choice: അനുകരിക്കുന്നവർ
  rationale: മറ്റൊരാളുടെ മാതൃക പിന്തുടർന്ന് അതുപോലെ പ്രവർത്തിക്കുന്നവരെ സൂചിപ്പിക്കുന്നതിനാൽ, വിശാലമായ ‘പിന്തുടരുന്നവർ’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ അനുകരണഭാവം ഇത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μου
  choice: എന്നെ
  rationale: μιμηταί എന്ന പദത്തോടു ചേർന്ന ജനിറ്റീവ് മലയാളത്തിൽ ‘എന്നെ അനുകരിക്കുന്നവർ’ എന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കാം.
- source_word: γίνεσθε
  choice: ആയിത്തീരുക
  rationale: വെറും ‘ആയിരിക്കുക’ എന്നതിലുപരി, ഈ മാതൃക സ്വീകരിച്ച് അത്തരക്കാരായി മാറുക എന്ന γίνομαιയുടെ ചലനാത്മകമായ ആജ്ഞാഭാവം നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: അനുകരിക്കുന്നതുപോലെ
  rationale: ‘പോലെ’ എന്ന താരതമ്യപ്രയോഗം പൗലോസിനെ അനുകരിക്കാനുള്ള ആഹ്വാനത്തെ, പൗലോസ് മശീഹായെ അനുകരിക്കുന്നതുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാൻ … അനുകരിക്കുന്നതുപോലെ
  rationale: καί + ἐγώയിലെ ‘ഞാനും/ഞാൻ അതുപോലെ’ എന്ന കൂട്ടിച്ചേർക്കൽഭാവം മലയാളവാക്യത്തിലെ താരതമ്യഘടന സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായെ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാളത്തിലെ കർമവിഭക്തിക്കനുസരിച്ച് ‘മശീഹായെ’ എന്ന രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹായെ
  alternative: ക്രിസ്തുവിനെ
  rationale: പദവിയായ Χριστός എന്നതിന്റെ അർഥം തുറന്നുകാട്ടാൻ ‘മശീഹാ’ ഉപയോഗിച്ചു; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: κἀγὼ Χριστοῦ എന്ന അപൂർണവാക്യത്തിന്റെ അവതരണം
  choice: ഞാൻ മശീഹായെ അനുകരിക്കുന്നതുപോലെ
  alternative: ഞാനും മശീഹായുടെ അനുകർത്താവായിരിക്കുന്നതുപോലെ
  rationale: ഗ്രീക്കിൽ മുൻപത്തെ μιμηταί എന്ന ആശയം അവസാന ഉപവാക്യത്തിൽ അധ്യാഹരിച്ചിരിക്കുന്നു. മലയാളത്തിൽ തെറ്റായി ‘മശീഹായുടേതാണ്’ എന്ന ഉടമസ്ഥതാഭാവം ഉണ്ടാകാതിരിക്കാൻ അധ്യാഹരിച്ച ‘അനുകരിക്കുക’ സ്വാഭാവികമായി വ്യക്തമാക്കി; പുതിയ ദൈവശാസ്ത്രാശയം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ ആജ്ഞയും താരതമ്യവും നിലനിർത്തിക്കൊണ്ട്, അവസാന ഭാഗത്തിലെ അധ്യാഹാരം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
