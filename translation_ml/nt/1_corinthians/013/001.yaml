  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: ml
  text: ഞാൻ മനുഷ്യരുടെയും ദൂതന്മാരുടെയും ഭാഷകളിൽ[a] സംസാരിക്കുകയും എനിക്ക് സ്നേഹമില്ലാതിരിക്കുകയും ചെയ്താൽ, ഞാൻ മുഴങ്ങുന്ന വെങ്കലമോ ഉച്ചത്തിൽ മുഴങ്ങുന്ന കൈത്താളമോ ആയിത്തീർന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഭാഷകൾ’ എന്നതിന് ‘നാവുകൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദം നാവിനെയോ ഭാഷയെയോ സൂചിപ്പിക്കാം; ഇവിടെ അത് കൊരിന്ത്യരോടുള്ള ലേഖനത്തിലെ ആത്മപ്രേരിത സംസാരത്തെക്കുറിച്ചുള്ള ചർച്ചയുമായി ബന്ധമുള്ളതാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: സംസാരിച്ചാലും
  rationale: സോപാധികമായ സങ്കൽപ്പത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ concessive conditional രൂപത്തിൽ അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള അതിശയോക്തിപരമായ വാദഗതിക്കും ഇത് യോജിക്കുന്നു.
- source_word: ταῖς γλώσσαις
  choice: ഭാഷകളിൽ
  rationale: γλῶσσα ഇവിടെ നാവ്/ഭാഷ എന്ന അർത്ഥവ്യാപ്തിയുള്ളതാണ്. മലയാളത്തിൽ ‘ഭാഷകളിൽ സംസാരിക്കുക’ സ്വാഭാവികമാണ്; കൊരിന്ത്യലേഖനത്തിലെ പ്രത്യേക ആത്മിക സംസാരവുമായി ഉള്ള ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, ദൂതന്മാർക്ക് വിപരീതമായി മനുഷ്യരെയാകെ സൂചിപ്പിക്കുന്നു. ‘മനുഷ്യരുടെ’ എന്നത് ഈ വ്യത്യാസം കൃത്യമായി നൽകുന്നു.
- source_word: καὶ τῶν ἀγγέλων
  choice: ദൂതന്മാരുടെ
  rationale: മനുഷ്യരോടുള്ള വൈരുധ്യവും വാക്യത്തിലെ പടിപടിയായ ഉയർത്തലും കണക്കിലെടുക്കുമ്പോൾ ἄγγελοι സ്വർഗീയ ദൂതന്മാരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ആധുനിക മലയാളത്തിൽ ἀγάπηയുടെ വിശാലവും ഗൗരവമുള്ളതുമായ അർത്ഥം സ്വാഭാവികമായി നൽകുന്ന പദമാണ്.
- source_word: δὲ μὴ ἔχω
  choice: സ്നേഹം ഇല്ലെങ്കിൽ
  rationale: δέയുടെ വൈരുധ്യവും μή ἔχωയുടെ അഭാവാർഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: γέγονα
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: ഗ്രീക്ക് perfect രൂപത്തിലെ സംഭവിച്ച മാറ്റവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: χαλκὸς ἠχῶν
  choice: മുഴങ്ങുന്ന വെങ്കലം
  rationale: χαλκός ഒരു പ്രത്യേക വാദ്യം നിർണ്ണയിക്കാതെ ലോഹത്തെ സൂചിപ്പിക്കുന്നു. ‘വെങ്കലം’ ചിത്രത്തെ അടുത്തായി നിലനിർത്തുകയും ἠχῶν എന്ന ശബ്ദാർഥം ‘മുഴങ്ങുന്ന’ നൽകുകയും ചെയ്യുന്നു.
- source_word: κύμβαλον ἀλαλάζον
  choice: ഉച്ചത്തിൽ കിലുങ്ങുന്ന കൈത്താളം
  rationale: κύμβαλον താളവാദ്യത്തെയും ἀλαλάζον അതിന്റെ ഉച്ചവും കോലാഹലപരവുമായ ശബ്ദത്തെയും സൂചിപ്പിക്കുന്നു. ‘കൈത്താളം’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപദമാണ്.
theological_decisions:
- issue: ‘മനുഷ്യരുടെയും ദൂതന്മാരുടെയും ഭാഷകൾ’ എന്നതിന്റെ സ്വഭാവം
  choice: മനുഷ്യഭാഷകളും ദൂതഭാഷകളും എന്ന വാചകവൈരുധ്യം അതേപടി നിലനിർത്തി.
  alternative: യഥാർഥ സ്വർഗീയ ഭാഷകളെന്നോ, ഏറ്റവും ഉന്നതമായ സംസാരത്തെ സൂചിപ്പിക്കുന്ന അതിശയോക്തിയെന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം തന്നെ ഈ രണ്ട് സാധ്യതകൾക്കിടയിൽ അന്തിമതീർപ്പ് നൽകുന്നില്ല. അതിനാൽ ദൂതഭാഷകളുടെ യാഥാർഥ്യത്തെക്കുറിച്ചോ അന്യഭാഷാഭാഷണത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചോ ഒരു പ്രത്യേക സിദ്ധാന്തം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യരുടെ’ എന്ന പ്രയോഗം ലിംഗപരമായി പരിമിതപ്പെടുത്താതെ മനുഷ്യരാശിയെയും ദൂതന്മാരെയും തമ്മിൽ വൈരുധ്യപ്പെടുത്തുന്നു. ശബ്ദചിത്രം വ്യക്തമായി നിലനിർത്താൻ ‘മുഴങ്ങുന്ന വെങ്കലം’, ‘ഉച്ചത്തിൽ കിലുങ്ങുന്ന കൈത്താളം’ എന്നീ പ്രയോഗങ്ങൾ തിരഞ്ഞെടുത്തു.
