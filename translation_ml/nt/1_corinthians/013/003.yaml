id: 1CO.13.3
reference: 1 Corinthians 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: ml
  text: എന്റെ സകലസ്വത്തുക്കളും ഞാൻ പങ്കിട്ടുകൊടുത്താലും, എന്റെ ശരീരം ചുട്ടുകളയപ്പെടേണ്ടതിന് ഏല്പിച്ചുകൊടുത്താലും,[a] സ്നേഹം എനിക്കില്ലെങ്കിൽ എനിക്ക് യാതൊരു പ്രയോജനവുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ചുട്ടുകളയപ്പെടേണ്ടതിന്” എന്നതിനുപകരം “ഞാൻ പ്രശംസിക്കേണ്ടതിന്” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: ദരിദ്രർക്കു പങ്കിട്ടുകൊടുത്താലും
  rationale: ക്രിയയുടെ അടിസ്ഥാന അർഥം ചെറിയ ഭാഗങ്ങളായി കൊടുക്കുക അഥവാ വിതരണം ചെയ്യുക എന്നതാണ്. സ്വത്തുക്കളെല്ലാം നൽകുന്ന ഈ സന്ദർഭത്തിൽ ദാനവിതരണത്തിന്റെ ആശയം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘ദരിദ്രർക്കു പങ്കിട്ടുകൊടുക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ദരിദ്രർക്കു’ എന്നത് സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന സ്വീകർത്താക്കളെ വ്യക്തമാക്കുന്ന ചെറിയ വ്യാഖ്യാനവിസ്താരമാണ്.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: എനിക്കുള്ളതെല്ലാം
  rationale: ഒരാളുടെ സ്വത്തും ഭൗതികസമ്പാദ്യവും മുഴുവനായി സൂചിപ്പിക്കുന്ന പ്രയോഗം. ‘എനിക്കുള്ളതെല്ലാം’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും സമഗ്രത നിലനിർത്തുന്നതുമാണ്.
- source_word: παραδῶ
  choice: ഏല്പിച്ചുകൊടുത്താലും
  rationale: സ്വന്തം ശരീരം മറ്റൊരാളുടെ അധികാരത്തിനോ നടപടിക്കോ വിട്ടുകൊടുക്കുന്ന ഗൗരവം നിലനിർത്തുന്നു; ‘ബലിയർപ്പിക്കുക’ പോലുള്ള വ്യാഖ്യാനാത്മക ആശയം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: τὸ σῶμά μου
  choice: എന്റെ ശരീരം
  rationale: മൂലത്തിലെ മൂർത്തമായ നാമപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἵνα καυθήσομαι
  choice: ചുട്ടുകളയേണ്ടതിന്
  rationale: SBLGNTയിലെ καυθήσομαι എന്ന ഭാവികാല കർമണി രൂപത്തിന്റെ ‘ചുട്ടുകളയപ്പെടുക’ എന്ന അർഥവും ἵνα സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യബന്ധവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിന്റെ വിശാലമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പ്രത്യേക സഭാപാരമ്പര്യത്തിലെ സാങ്കേതിക പദം ഒഴിവാക്കുന്നു.
- source_word: οὐδὲν ὠφελοῦμαι
  choice: എനിക്ക് യാതൊരു പ്രയോജനവുമില്ല
  rationale: പ്രവൃത്തികളിൽനിന്ന് തനിക്ക് ഒരു നേട്ടമോ ഗുണമോ ലഭിക്കുന്നില്ല എന്ന കർമണി ആശയം വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: '...കൊടുത്താലും, ...ഏല്പിച്ചുകൊടുത്താലും'
  rationale: പൗലോസിന്റെ തുടർച്ചയായ രണ്ട് സോപാധിക സങ്കൽപ്പങ്ങൾ മലയാളത്തിലെ ആവർത്തിത ‘-ആലും’ ഘടനയിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഉദ്ദേശ്യവാക്യത്തിലെ പാഠഭേദം
  choice: SBLGNTയിലെ καυθήσομαι അനുസരിച്ച് ‘ചുട്ടുകളയേണ്ടതിന്’ എന്ന വായന മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു.
  alternative: καυχήσωμαι — ‘ഞാൻ പ്രശംസിക്കേണ്ടതിന്’ അഥവാ ‘എനിക്ക് പ്രശംസിക്കാനായി’
  rationale: നൽകിയിരിക്കുന്ന മൂലപാഠമായ SBLGNTയെ മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നു. ‘ചുട്ടുകളയപ്പെടുക’ എന്നും ‘പ്രശംസിക്കുക’ എന്നും ഉള്ള വായനകൾ വ്യാഖ്യാനത്തെ ഗണ്യമായി മാറ്റുന്നതിനാൽ മറ്റേ വായന അടിക്കുറിപ്പിൽ സുതാര്യമായി രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ക്രമാനുഗത സോപാധിക വാക്യഘടന നിലനിർത്തി. പാഠഭേദത്തിന്റെ അടയാളം ബന്ധപ്പെട്ട മുഖ്യവാക്യത്തിന് പിന്നാലെ ചേർത്തിരിക്കുന്നു.
