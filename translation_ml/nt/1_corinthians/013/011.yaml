id: 1CO.13.11
reference: 1 Corinthians 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: ml
  text: ഞാൻ കുട്ടിയായിരുന്നപ്പോൾ കുട്ടിയെപ്പോലെ സംസാരിച്ചു, കുട്ടിയെപ്പോലെ ചിന്തിച്ചു, കുട്ടിയെപ്പോലെ യുക്തിവിചാരം നടത്തി. ഞാൻ പുരുഷനായിത്തീർന്നപ്പോൾ കുട്ടിയുടേതായ കാര്യങ്ങൾ ഉപേക്ഷിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥം: “കുട്ടിയുടേതായ കാര്യങ്ങൾ.” “കുട്ടിത്തമായ കാര്യങ്ങൾ” എന്നും “കുട്ടിയുടെ രീതികൾ” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: τὰ τοῦ νηπίου എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സ്വാഭാവികമായ മറ്റു പരിഭാഷാസാധ്യതകളും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: νήπιος
  choice: കുട്ടി
  rationale: ചെറിയ കുട്ടിയെയും അപക്വതയെയും സൂചിപ്പിക്കുന്ന പദമാണിത്. ‘ശിശു’ എന്നത് പ്രായപരമായി അത്യന്തം ഇടുങ്ങിയതിനാൽ, വാക്യത്തിലെ സംസാരിക്കൽ–ചിന്തിക്കൽ–യുക്തിവിചാരം നടത്തൽ എന്ന ക്രമത്തിനും ἀνήρ എന്നതുമായ വൈരുധ്യത്തിനും ‘കുട്ടി’ സ്വാഭാവികമായി യോജിക്കുന്നു.
- source_word: ἐλάλουν
  choice: സംസാരിച്ചു
  rationale: λαλέω എന്നതിന്റെ സാധാരണ അർഥം വ്യക്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: ἐφρόνουν
  choice: ചിന്തിച്ചു
  rationale: മനോഭാവം, ചിന്താരീതി എന്നീ അർഥസാധ്യതകളുള്ള φρονέωയെ ഈ ത്രിപദക്രമത്തിൽ സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐλογιζόμην
  choice: യുക്തിവിചാരം നടത്തി
  rationale: ἐφρόνουν എന്ന ‘ചിന്തിച്ചു’ എന്നതിൽനിന്ന് വേർതിരിച്ച്, പരിഗണിക്കൽ അഥവാ നിഗമനത്തിലെത്തുന്ന ചിന്ത എന്ന λογίζομαιയുടെ ഭാവം നിലനിർത്തുന്നു.
- source_word: γέγονα
  choice: ആയിത്തീർന്നപ്പോൾ
  rationale: പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന അവസ്ഥാമാറ്റം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ കാലപ്രയോഗം നൽകുന്നു.
- source_word: ἀνήρ
  choice: പുരുഷൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനത്തെ ലിംഗനിഷ്ഠമായി നിലനിർത്തുകയും കുട്ടി–മുതിർന്ന പുരുഷൻ എന്ന പൗലോസിന്റെ ആത്മകഥാപരമായ ഉപമ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: κατήργηκα
  choice: ഉപേക്ഷിച്ചു
  rationale: ഈ പക്വതയുടെ ഉപമയിൽ ‘പ്രവർത്തനരഹിതമാക്കി’ എന്ന അക്ഷരാർഥത്തേക്കാൾ, പഴയ ശീലങ്ങളും കാര്യങ്ങളും വിട്ടുകളഞ്ഞു എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ τοῦ νηπίου
  choice: കുട്ടിക്കാലത്തെ കാര്യങ്ങൾ
  rationale: ‘കുട്ടിയുടേതായ കാര്യങ്ങൾ’ എന്ന അക്ഷരാർഥത്തിന്റെ അസ്വാഭാവികത ഒഴിവാക്കി, കുട്ടിക്കു സവിശേഷമായ കാര്യങ്ങളെന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀνήρ എന്ന പദത്തിലെ ലിംഗസൂചന
  choice: പുരുഷൻ
  alternative: മുതിർന്നയാൾ
  rationale: മൂലപാഠം പൊതുവായ ‘മുതിർന്ന വ്യക്തി’ എന്നതിനു പകരം പുല്ലിംഗ ഏകവചനമായ ἀνήρ ഉപയോഗിക്കുന്നു. ഇവിടെ പൗലോസ് സ്വയം പക്വതയുടെ ഉദാഹരണമായി അവതരിപ്പിക്കുകയാണ്; പുരുഷമേധാവിത്വത്തെക്കുറിച്ചുള്ള സിദ്ധാന്തവാദമല്ല. അതിനാൽ ലിംഗസൂചന ഇല്ലാതാക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ഗദ്യം. ‘കുട്ടിയെപ്പോലെ’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ വാചാലയവും മൂന്നു ഘട്ടങ്ങളുള്ള സമാന്തരഘടനയും നിലനിർത്തുന്നു. അവസാന പ്രയോഗത്തിന്റെ അക്ഷരാർഥത്തിലെ അസ്വാഭാവികത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചുകൊണ്ട് മുഖ്യവാചകത്തിൽ സ്വാഭാവികത പാലിക്കുന്നു.
