id: 1CO.13.12
reference: 1 Corinthians 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: ml
  text: ഇപ്പോൾ നാം ഒരു കണ്ണാടിയിലൂടെ, ഒരു കടങ്കഥയിലെന്നപോലെ[a], കാണുന്നു; എന്നാൽ അപ്പോൾ മുഖാമുഖമായി കാണും. ഇപ്പോൾ ഞാൻ ഭാഗികമായി അറിയുന്നു; എന്നാൽ അപ്പോൾ, ഞാനും പൂർണമായി അറിയപ്പെട്ടതുപോലെതന്നെ, പൂർണമായി അറിയും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘ഒരു കടങ്കഥയിൽ’ അഥവാ ‘ദുരൂഹമായി.’ നേരിട്ടല്ലാത്തതും പൂർണമായി വ്യക്തമല്ലാത്തതുമായ കാഴ്ചയ്ക്കാണ് ഗ്രീക്ക് പ്രയോഗം ഊന്നൽ നൽകുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπομεν
  choice: നാം കാണുന്നു
  rationale: ദൃശ്യരൂപകം നേരിട്ട് നിലനിർത്തുകയും വർത്തമാനകാല അർഥം സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
- source_word: ἄρτι
  choice: ഇപ്പോൾ
  rationale: τότε (‘അപ്പോൾ’) എന്നതിനോടുള്ള കാലപരമായ വൈരുധ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δι’ ἐσόπτρου
  choice: ഒരു കണ്ണാടിയിലൂടെ
  rationale: διά സഹിതമുള്ള പരോക്ഷമോ മാധ്യമം വഴിയുള്ളതോ ആയ കാഴ്ചയെ നിലനിർത്തുന്നു; കണ്ണാടി എന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν αἰνίγματι
  choice: ഒരു കടങ്കഥയിലെന്നപോലെ
  rationale: αἴνιγμα എന്ന നാമത്തിന്റെ ‘കടങ്കഥ, ദുരൂഹമായ സൂചന’ എന്ന അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ നേരിട്ടുള്ള ‘ഒരു കടങ്കഥയിൽ’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: മുഖാമുഖമായി
  rationale: നേരിട്ടുള്ള, മാധ്യമമില്ലാത്ത കണ്ടുമുട്ടലിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: γινώσκω ἐκ μέρους
  choice: ഞാൻ ഭാഗികമായി അറിയുന്നു
  rationale: ἐκ μέρους എന്നതിന്റെ ‘ഒരു ഭാഗം മാത്രം/ഭാഗികമായി’ എന്ന അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἐπιγνώσομαι
  choice: പൂർണമായി അറിയും
  rationale: ഇപ്പോഴത്തെ ഭാഗികജ്ഞാനത്തോടുള്ള വൈരുധ്യം പ്രകടമാക്കുന്നു; എന്നാൽ സർവജ്ഞത അവകാശപ്പെടുന്ന ഭാഷ ഒഴിവാക്കുന്നു.
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: ഞാനും പൂർണമായി അറിയപ്പെട്ടതുപോലെതന്നെ
  rationale: മുൻപത്തെ ἐπιγνώσομαι എന്ന ക്രിയയുമായുള്ള പദബന്ധം നിലനിർത്തുന്നു; അറിയുന്നവൻ ആരെന്നത് ഗ്രീക്കുപോലെ വ്യക്തമാക്കാതെ വിടുന്നു.
theological_decisions:
- issue: ഭാവിയിലെ അറിവിന്റെ വ്യാപ്തി
  choice: പൂർണമായി അറിയും
  alternative: എല്ലാം അറിയും / സമ്പൂർണമായി ഗ്രഹിക്കും
  rationale: വാക്യം ഭാഗികമായ അറിവിനെയും ഭാവിയിലെ പൂർണമായ അറിവിനെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്നു; മനുഷ്യൻ ദൈവത്തെപ്പോലെ സർവജ്ഞനാകും എന്ന് നിർബന്ധമായി പറയുന്നില്ല. അതിനാൽ പൂർണതയുടെ ഊന്നൽ നിലനിർത്തിയെങ്കിലും സർവജ്ഞത സൂചിപ്പിച്ചില്ല.
- issue: ‘അറിയപ്പെട്ടത്’ ആരാൽ എന്ന ചോദ്യം
  choice: കർതൃവിനെ വ്യക്തമാക്കാത്ത കർമണിപ്രയോഗം
  alternative: ദൈവം എന്നെ പൂർണമായി അറിയുന്നതുപോലെ
  rationale: ഗ്രീക്ക് വാചകം അറിയുന്ന കർത്താവിനെ പേരെടുത്തു പറയുന്നില്ല. ദൈവമാണ് ഉദ്ദേശ്യം എന്നു സന്ദർഭത്തിൽ മനസ്സിലാക്കാമെങ്കിലും പരിഭാഷ അതിനെ ചേർത്തുപറയുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കണ്ണാടി, കടങ്കഥ, മുഖാമുഖം എന്നീ മൂലരൂപകങ്ങൾ നിലനിർത്തി; വാക്യത്തിന്റെ സമാന്തരഘടനയും ‘ഇപ്പോൾ—അപ്പോൾ’ വൈരുധ്യവും സംരക്ഷിച്ചു.
