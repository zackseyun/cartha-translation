id: 1CO.13.9
reference: 1 Corinthians 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: ml
  text: കാരണം, നാം ഭാഗികമായി അറിയുന്നു; ഭാഗികമായി പ്രവചിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ μέρους
  choice: ഭാഗികമായേ
  rationale: ‘ഭാഗികമായി’ എന്ന അർഥം നൽകുന്ന ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആവർത്തനം രണ്ടു ഉപവാക്യങ്ങളിലും നിലനിർത്തുന്നു. ‘-യേ’ എന്ന ഊന്നൽ അറിവിന്റെയും പ്രവചനത്തിന്റെയും ഇപ്പോഴത്തെ പരിമിതസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; തുടർന്നുവരുന്ന ‘പൂർണമായത്’ എന്ന വൈരുധ്യത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാള സംയോജകമാണ്.
- source_word: γινώσκομεν
  choice: നാം … അറിയുന്നുള്ളൂ
  rationale: അറിവിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘മനസ്സിലാക്കുന്നു’ എന്നു നൽകി അർഥം ചുരുക്കുന്നില്ല.
- source_word: καὶ
  choice: ;
  rationale: രണ്ട് സമാന്തര ഉപവാക്യങ്ങളെ മലയാളത്തിൽ അർധവിരാമംകൊണ്ട് ചേർത്തിരിക്കുന്നു. ഇതിലൂടെ ഗ്രീക്കിലെ ബന്ധവും വാക്യഘടനയിലെ സമമിതിയും നിലനിൽക്കുന്നു; അസ്വാഭാവികമായ ഒരു അധിക സംയോജകം ഒഴിവാക്കുന്നു.
- source_word: προφητεύομεν
  choice: നാം … പ്രവചിക്കുന്നുള്ളൂ
  rationale: ആത്മീയവരങ്ങളുടെ സന്ദർഭത്തിൽ ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ഭാവികഥനമെന്നോ പൊതുവായ പ്രസംഗമെന്നോ അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സഭയിലെ പ്രവചനപ്രവർത്തനത്തിന്റെ അർഥം
  choice: προφητεύομεν എന്നത് ‘പ്രവചിക്കുന്നുള്ളൂ’ എന്നു പരിഭാഷപ്പെടുത്തി അതിന്റെ വിശാലമായ അർഥം നിലനിർത്തി.
  alternative: ‘ഭാവികാര്യങ്ങൾ മുൻകൂട്ടി പറയുന്നു’ അല്ലെങ്കിൽ ‘പ്രസംഗിക്കുന്നു’
  rationale: സമീപസന്ദർഭം ആത്മീയവരങ്ങളെക്കുറിച്ചാണ്. ഗ്രീക്ക് പദം കേവലം ഭാവികഥനത്തേക്കാളും വിശാലമായ ദൈവപ്രേരിത വചനത്തെ സൂചിപ്പിക്കാം; അതിനാൽ വ്യാഖ്യാനവിവാദം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള സമാന്തര ആവർത്തനം മനപ്പൂർവം നിലനിർത്തിയിരിക്കുന്നു.
