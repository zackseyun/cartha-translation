id: 1CO.13.8
reference: 1 Corinthians 13:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: ml
  text: സ്നേഹം ഒരിക്കലും പരാജയപ്പെടുന്നില്ല[a]. എന്നാൽ പ്രവചനങ്ങളായാലും അവ ഒഴിവാക്കപ്പെടും; ഭാഷകളായാലും അവ നിലച്ചുപോകും; അറിവായാലും അത് ഒഴിവാക്കപ്പെടും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സ്നേഹം ഒരിക്കലും വീഴുന്നില്ല’ അല്ലെങ്കിൽ ‘സ്നേഹം ഒരിക്കലും അവസാനിക്കുന്നില്ല.’
    reason: lexical_alternative
  - marker: c
    text: ‘ഒഴിവാക്കപ്പെടും’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന അതേ ക്രിയയാണ് പ്രവചനങ്ങളെക്കുറിച്ചുള്ള വാക്യഭാഗത്തിലും അറിവിനെക്കുറിച്ചുള്ള വാക്യഭാഗത്തിലും ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: പൗലൊസിന്റെ വിശാലമായ ആശയവും സന്ദർഭത്തിലെ മുഖ്യപദവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐδέποτε
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: സമ്പൂർണ നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πίπτει
  choice: പരാജയപ്പെടുന്നില്ല
  rationale: വെറും ശാരീരികമായ ‘വീഴുക’ എന്ന അർഥമല്ല, സ്നേഹം ഒരിക്കലും വിഫലമാകുന്നില്ല എന്ന സന്ദർഭോചിതമായ ആശയം നൽകുന്നു; പിന്നാലെയുള്ള അവസാനിപ്പിക്കൽ ക്രിയകളുമായി ഇതിനെ ഒന്നാക്കുന്നില്ല.
- source_word: προφητεῖαι
  choice: പ്രവചനങ്ങൾ
  rationale: ‘പ്രവചനവരങ്ങൾ’ എന്നു ചേർത്ത് ഗ്രീക്കിൽ ഇല്ലാത്ത ‘വരം’ വ്യക്തമാക്കാതെ, പ്രവചനസന്ദേശങ്ങളെയോ പ്രവചനപ്രവർത്തനങ്ങളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: ഒഴിവാക്കപ്പെടും
  rationale: പ്രവർത്തനത്തിൽനിന്ന് മാറ്റപ്പെടുക എന്ന ആശയം, പൂർണ നാശം നിർബന്ധമാക്കാതെ, രണ്ടിടത്തും ഒരേ രീതിയിൽ നൽകുന്നു.
- source_word: γλῶσσαι
  choice: നാവുകൾ
  rationale: 1 കൊരിന്ത്യർ 12–14-ലെ സാങ്കേതികവും ദൈവശാസ്ത്രപരമായി തുറന്നതുമായ പ്രയോഗം നിലനിർത്തുന്നു; ‘ഭാഷകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παύσονται
  choice: നിലച്ചുപോകും
  rationale: καταργέω-യിൽനിന്നുള്ള ക്രിയാഭേദം നിലനിർത്തിക്കൊണ്ട് ‘നിർത്തുക/അവസാനിക്കുക’ എന്ന സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: γνῶσις
  choice: അറിവ്
  rationale: തുടർന്നുള്ള ഭാഗികമായ അറിയലിനെക്കുറിച്ചുള്ള സന്ദർഭവുമായി യോജിക്കുന്ന സാധാരണ പൗലൊസീയ അർഥം നൽകുന്നു.
theological_decisions:
- issue: πίπτει എന്ന ക്രിയയുടെ അർഥം
  choice: സ്നേഹം ഒരിക്കലും പരാജയപ്പെടുന്നില്ല
  alternative: സ്നേഹം ഒരിക്കലും വീഴുന്നില്ല / സ്നേഹം ഒരിക്കലും അവസാനിക്കുന്നില്ല
  rationale: സ്നേഹത്തിന്റെ നിലനിൽക്കുന്ന വിശ്വസ്തതയെ വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനെ പിന്നാലെയുള്ള ‘നിലയ്ക്കുക’, ‘ഒഴിവാക്കപ്പെടുക’ എന്നീ ക്രിയകളോട് പൂർണമായി സമാനമാക്കുന്നില്ല.
- issue: γλῶσσαι എന്ന പദത്തിന്റെ സന്ദർഭാർഥം
  choice: നാവുകൾ
  alternative: ഭാഷകൾ
  rationale: കരിസ്മാറ്റിക് പ്രതിഭാസത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള തർക്കം പരിഹരിക്കാതെ 1 കൊരിന്ത്യർ 12–14-ലെ സ്ഥാപിത പ്രയോഗം നിലനിർത്തുന്നു.
- issue: καταργέω എന്ന ക്രിയയുടെ ശക്തി
  choice: ഒഴിവാക്കപ്പെടും
  alternative: ഇല്ലാതാക്കപ്പെടും / പ്രവർത്തനരഹിതമാക്കപ്പെടും
  rationale: പൂർണമായ നശീകരണം നിർബന്ധമായി സൂചിപ്പിക്കാതെ, പ്രവചനങ്ങളും അറിവും ഭാവിയിൽ പ്രവർത്തനത്തിൽനിന്ന് മാറ്റപ്പെടുമെന്ന ആശയം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ മൂന്ന് സമാന്തര ഉപവാക്യങ്ങളും ക്രിയാഭേദവും നിലനിർത്തി; സഭാവിഭാഗപരമായ വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
