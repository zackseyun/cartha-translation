  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: ml
  text: സ്നേഹം ക്ഷമയുള്ളതാണ്; സ്നേഹം ദയയോടെ പെരുമാറുന്നു. അത്[a] അസൂയപ്പെടുന്നില്ല[b]; പൊങ്ങച്ചം പറയുന്നില്ല; അഹങ്കാരത്തോടെ വീർത്തിരിക്കുന്നില്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ഇവിടെ ‘സ്നേഹം’ എന്നു വീണ്ടും കാണുന്നു; മറ്റുള്ളവയിൽ കർത്താവ് സന്ദർഭത്തിൽനിന്ന് മനസ്സിലാക്കപ്പെടുന്നു.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഈർഷ്യപ്പെടുന്നില്ല.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് നല്ല അർഥത്തിൽ തീക്ഷ്ണതയെയും മോശമായ അർഥത്തിൽ അസൂയയെയും സൂചിപ്പിക്കാം; ഇവിടത്തെ നിഷേധാത്മക സന്ദർഭം ‘അസൂയ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘അഹങ്കരിക്കുന്നില്ല.’ ഗ്രീക്കിൽ അഹങ്കാരത്താൽ ഊതിവീർപ്പിക്കപ്പെടുന്നതിന്റെ രൂപകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: വ്യാപകമായ ധാർമികവും ബന്ധപരവുമായ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ദാനധർമ്മം’ എന്ന ചുരുങ്ങിയ അർഥം വരുത്തുന്ന പദങ്ങൾ ഒഴിവാക്കുന്നു.
- source_word: μακροθυμεῖ
  choice: ക്ഷമയുള്ളതാണ്
  rationale: മറ്റുള്ളവരോടു ദീർഘകാലം സഹിഷ്ണുത പുലർത്തുക എന്ന ക്രിയയുടെ ധാർമിക ആശയം ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: χρηστεύεται
  choice: ദയയോടെ പെരുമാറുന്നു
  rationale: വെറും ഒരു ഗുണനിലവാരമല്ല, ദയാപൂർവമായി പ്രവർത്തിക്കുന്നതും പെരുമാറുന്നതുമായ ക്രിയാത്മക അർഥം നിലനിർത്തുന്നു.
- source_word: ζηλοῖ
  choice: അസൂയപ്പെടുന്നില്ല
  rationale: οὐ ഉള്ള നിഷേധാത്മക സന്ദർഭത്തിൽ മറ്റൊരാളുടെ നന്മയെയോ നേട്ടത്തെയോ കണ്ടുള്ള അസൂയയാണ് ഏറ്റവും യോജിച്ച അർഥം.
- source_word: περπερεύεται
  choice: പൊങ്ങച്ചം പറയുന്നില്ല
  rationale: സ്വയം പ്രദർശിപ്പിക്കുകയും വീമ്പുപറയുകയും ചെയ്യുക എന്ന അപൂർവ ഗ്രീക്ക് ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: φυσιοῦται
  choice: അഹങ്കാരത്താൽ വീർപ്പുകൊള്ളുന്നില്ല
  rationale: അഹങ്കാരംകൊണ്ട് ഊതിവീർപ്പിക്കപ്പെടുന്നതെന്ന പൗലോസിന്റെ രൂപകം പരമാവധി നിലനിർത്തുന്നു.
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: സ്നേഹം ... സ്നേഹം ... അത്
  rationale: ആദ്യ രണ്ടു വാക്യഭാഗങ്ങളിലെ ആവർത്തനത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും തുടർന്നുള്ള ഭാഗത്ത് മലയാളത്തിലെ സ്വാഭാവിക സർവനാമപ്രയോഗം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐ
  choice: ഇല്ല
  rationale: ഓരോ ക്രിയയോടും ചേർന്ന നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാനിഷേധരൂപങ്ങളായി നൽകുന്നു.
theological_decisions:
- issue: ἀγάπη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സ്നേഹം
  alternative: ദാനധർമ്മം / കാരുണ്യം
  rationale: ഈ ഭാഗത്ത് പദം ഒരു പ്രത്യേക ദാനപ്രവൃത്തിയെക്കാൾ വിശാലമായ ബന്ധപരവും ധാർമികവുമായ സ്നേഹത്തെ സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘സ്നേഹം’ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- issue: φυσιοῦται എന്ന രൂപകത്തിന്റെ സംരക്ഷണം
  choice: അഹങ്കാരത്താൽ വീർപ്പുകൊള്ളുന്നില്ല
  alternative: അഹങ്കരിക്കുന്നില്ല
  rationale: ലളിതമായ പര്യായം മാത്രം നൽകാതെ, പൗലോസിന്റെ ‘ഊതിവീർപ്പിക്കൽ’ എന്ന രൂപകവും അതിന്റെ അഹങ്കാരസൂചനയും ഒരുമിച്ച് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ളതും ചൊല്ലിവായിക്കാൻ സുഗമവുമായ ശൈലി. ആദ്യ രണ്ടു ഭാഗങ്ങളിലെ ‘സ്നേഹം’ എന്ന ആവർത്തനം ഗ്രീക്ക് വാചകത്തിന്റെ ഊന്നലിനായി നിലനിർത്തി; തുടർന്ന് അനാവശ്യ ആവർത്തനം ഒഴിവാക്കാൻ ‘അത്’ ഉപയോഗിച്ചു.
