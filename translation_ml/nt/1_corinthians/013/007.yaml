  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: ml
  text: എല്ലാം സഹിക്കുന്നു[a], എല്ലാം വിശ്വസിക്കുന്നു[b], എല്ലാം പ്രത്യാശിക്കുന്നു, എല്ലാം സഹിച്ചുനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാം മൂടുന്നു’ അല്ലെങ്കിൽ ‘എല്ലാം സംരക്ഷിക്കുന്നു’; στέγει എന്ന പദത്തിന് സഹിക്കുക എന്നതിനൊപ്പം മൂടുക, സംരക്ഷിക്കുക എന്നീ അർഥങ്ങളും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘എല്ലാം വിശ്വസിക്കുന്നു’ എന്നത് സ്നേഹം എളുപ്പം വഞ്ചിക്കപ്പെടുന്നു എന്നല്ല; മറ്റുള്ളവരെ വിശ്വസിക്കാൻ ചായുന്ന മനോഭാവമാണ് ഉദ്ദേശ്യം.
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം
  rationale: ഓരോ ക്രിയയോടും ചേർന്നുള്ള സമഗ്രതയും നാലു പ്രാവശ്യമുള്ള വാക്യലയം നിറഞ്ഞ ആവർത്തനവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: στέγει
  choice: സഹിക്കുന്നു
  rationale: മൂടുക, സംരക്ഷിക്കുക എന്ന അടിസ്ഥാനഭാവത്തിൽനിന്ന് സഹിക്കുക എന്ന അർഥവും ഈ ക്രിയയ്ക്കുണ്ട്. സ്നേഹത്തിന്റെ സ്ഥിരത വിവരിക്കുന്ന സന്ദർഭത്തിൽ ‘സഹിക്കുന്നു’ യോജിക്കുന്നു; ‘മൂടുന്നു’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πιστεύει
  choice: വിശ്വസിക്കുന്നു
  rationale: πιστεύω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും മൂലപാഠത്തിലെ സംക്ഷിപ്ത സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു. ഇവിടെ വിവേചനമില്ലാത്ത വിശ്വാസമല്ല, വിശ്വസിക്കാൻ ചായുന്ന മനോഭാവമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ἐλπίζει
  choice: പ്രത്യാശിക്കുന്നു
  rationale: സ്നേഹത്തിന്റെ സ്ഥിരമായ സ്വഭാവപ്രവർത്തനത്തെ നേരിട്ടും മാന്യമായ ആധുനിക മലയാളത്തിലും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑπομένει
  choice: സഹിച്ചുനിൽക്കുന്നു
  rationale: സമ്മർദത്തിനടിയിലും നിലനിൽക്കുക, ഉറച്ചുനിൽക്കുക, സഹിച്ചുകൊണ്ടിരിക്കുക എന്നീ ഭാവങ്ങൾ ഉൾക്കൊള്ളുകയും ആദ്യക്രിയയിൽനിന്നുള്ള അർഥവ്യത്യാസം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πάντα എന്ന പദത്തിന്റെ ആവർത്തനത്തിലൂടെ സ്നേഹത്തെക്കുറിച്ചു പറയുന്ന സമഗ്രത
  choice: സ്നേഹത്തിന്റെ എല്ലാം ഉൾക്കൊള്ളുന്ന സ്ഥിരതയെ ചിത്രീകരിക്കുന്ന അലങ്കാരപരവും സ്വഭാവവിവരണാത്മകവുമായ ഭാഷയായി വിവർത്തനം ചെയ്തു.
  alternative: സ്നേഹം യാതൊരു വിവേചനവുമില്ലാതെ എന്തും അംഗീകരിക്കുകയോ എല്ലാം സത്യമെന്നു കരുതുകയോ ചെയ്യുന്നു എന്ന കേവലമായ സാർവത്രിക അവകാശവാദം.
  rationale: πάντα എന്ന ആവർത്തനം അതേപടി നിലനിർത്തുമ്പോഴും, സന്ദർഭം സ്നേഹത്തിന്റെ സ്വഭാവത്തെ കാവ്യാത്മകമായി വിവരിക്കുന്നതാണ്; നൈതിക വിവേചനമില്ലായ്മയോ എളുപ്പം വഞ്ചിക്കപ്പെടുന്ന സ്വഭാവമോ പാഠത്തിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. πάντα എന്ന നാലുമടങ്ങുള്ള ആവർത്തനവും മൂലപാഠത്തിന്റെ സംക്ഷിപ്ത സമാന്തരഘടനയും നിലനിർത്തി. στέγει, ὑπομένει എന്നീ ക്രിയകളുടെ വ്യത്യാസം ‘സഹിക്കുന്നു’, ‘സഹിച്ചുനിൽക്കുന്നു’ എന്നിങ്ങനെ പ്രകടമാക്കി.
