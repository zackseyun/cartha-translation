id: 1CO.13.2
reference: 1 Corinthians 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: ml
  text: എനിക്ക് പ്രവചനം ഉണ്ടായാലും, എല്ലാ രഹസ്യങ്ങളും സകല ജ്ഞാനവും ഗ്രഹിച്ചാലും, പർവതങ്ങളെ നീക്കാൻ തക്കവിധം സമ്പൂർണമായ വിശ്വാസം[a] എനിക്കുണ്ടായാലും, സ്നേഹമില്ലെങ്കിൽ ഞാൻ ഒന്നുമല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമ്പൂർണമായ ആശ്രയം’ എന്നും പരിഭാഷപ്പെടുത്താം; സാധ്യത കുറഞ്ഞ മറ്റൊരു അർഥം ‘സമ്പൂർണമായ വിശ്വസ്തത’ എന്നാണ്. ഗ്രീക്ക് പദത്തിന് ഈ അർഥവ്യാപ്തിയുണ്ടെങ്കിലും, ഇവിടെ അസാധാരണമായ വിശ്വാസത്തെയാണ് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: പ്രവചനവരം
  rationale: കൊരിന്ത്യർക്ക് എഴുതിയ ലേഖനത്തിലെ ആത്മീയവരങ്ങളുടെ പശ്ചാത്തലത്തിൽ പ്രവചനത്തിനുള്ള കഴിവിനെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. വെറും പ്രവചനക്രിയയെന്നോ ഒരു ഔദ്യോഗിക സ്ഥാനമെന്നോ അർഥം പരിമിതപ്പെടുത്താതെ സ്വാഭാവികമായ മലയാളത്തിനായി ‘പ്രവചനവരം’ ഉപയോഗിച്ചു.
- source_word: εἰδῶ
  choice: ഗ്രഹിച്ചാലും
  rationale: οἶδα എന്ന ക്രിയയ്ക്ക് അടിസ്ഥാനമായി ‘അറിയുക’ എന്നാണ് അർഥമെങ്കിലും, ‘രഹസ്യങ്ങൾ’, ‘ജ്ഞാനം’ എന്നിവയോടൊപ്പം ഇവിടെ സമഗ്രമായ ബൗദ്ധിക ഗ്രഹണം സൂചിപ്പിക്കുന്നു. γνῶσις എന്ന നാമത്തിൽനിന്നുള്ള വ്യത്യാസവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: μυστήρια
  choice: രഹസ്യങ്ങൾ
  rationale: മനുഷ്യർക്ക് മറഞ്ഞിരുന്ന ദൈവിക സത്യങ്ങൾ എന്ന പൗലോസിന്റെ വിശാലമായ ആശയം നിലനിർത്തുകയും സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: πᾶσαν τὴν γνῶσιν
  choice: സകല ജ്ഞാനവും
  rationale: πᾶσαν എന്ന സമഗ്രതയും γνῶσις എന്ന നാമത്തിന്റെ അർഥവും നിലനിർത്തുന്നു; മുൻപുള്ള ‘ഗ്രഹിച്ചാലും’ എന്ന ക്രിയയുമായി അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: πᾶσαν τὴν πίστιν
  choice: സമ്പൂർണമായ വിശ്വാസം
  rationale: ‘സകല വിശ്വാസവും’ എന്ന അക്ഷരാർഥപ്രയോഗത്തേക്കാൾ സ്വാഭാവികമായി സമഗ്രത പ്രകടിപ്പിക്കുന്നു. പർവതങ്ങളെ നീക്കുന്നതുമായി ബന്ധിപ്പിച്ചിരിക്കുന്നതിനാൽ ഇവിടെ അസാധാരണമായ വിശ്വാസത്തെയാണ് സൂചിപ്പിക്കുന്നത്; സാങ്കേതികമായി രക്ഷാകരവിശ്വാസമെന്ന് നിർവചിക്കുന്നില്ല.
- source_word: ὥστε ὄρη μεθιστάναι
  choice: പർവതങ്ങളെ നീക്കാൻ തക്കവിധം
  rationale: ഫലമോ കഴിവോ സൂചിപ്പിക്കുന്ന ὥστε ഘടനയും അസാധാരണ ശക്തിയെ സൂചിപ്പിക്കുന്ന പർവതങ്ങൾ നീക്കുക എന്ന ദൃശ്യരൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀγάπην
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ വിശാലവും ബന്ധപരവുമായ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ദാനധർമ്മം എന്ന പരിമിതമായ അർഥം ചുമത്തുന്നില്ല.
- source_word: οὐθέν εἰμι
  choice: ഞാൻ ഒന്നുമല്ല
  rationale: പൗലോസിന്റെ ശക്തവും നിരുപാധികവുമായ സ്വയംനിഷേധം വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: അത്ഭുതകരമായ ശേഷിയുടെ പശ്ചാത്തലത്തിൽ πίστις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം; സാധ്യത കുറഞ്ഞതായി വിശ്വസ്തത
  rationale: ഈ വാക്യത്തിലെ പർവതങ്ങളെ നീക്കുക എന്ന സന്ദർഭം അസാധാരണമായ വിശ്വാസത്തെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. πίστις എന്ന പദത്തിന്റെ വിശാല അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു; ‘വിശ്വസ്തത’ ഈ വാക്യഘടനയിലും സന്ദർഭത്തിലും സാധ്യത കുറവാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ അതിശയോക്തിപരമായ ‘എല്ലാം/സകലവും’ എന്ന ആവർത്തനവും അവസാനത്തെ ശക്തമായ ‘ഞാൻ ഒന്നുമല്ല’ എന്ന പ്രസ്താവനയും നിലനിർത്തി. നീണ്ട വ്യവസ്ഥാവാക്യം വായിക്കാൻ എളുപ്പമാക്കാൻ കോമകൾ ഉപയോഗിച്ചു.
