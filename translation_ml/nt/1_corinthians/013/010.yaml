id: 1CO.13.10
reference: 1 Corinthians 13:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ τὸ τέλειον, ⸀τὸ ἐκ μέρους καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: ml
  text: എന്നാൽ പൂർണമായത് വരുമ്പോൾ[a], ഭാഗികമായത് നീക്കിക്കളയപ്പെടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ “സമ്പൂർണമായത്” അല്ലെങ്കിൽ “പക്വമായത്.” “പൂർണമായത്” (ഗ്രീക്ക്: τὸ τέλειον, to teleion) എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്നതു വിവാദവിഷയമാണ്; ഇപ്പോഴത്തെ ഭാഗികാവസ്ഥയ്ക്കു വിരുദ്ധമായി സമ്പൂർണത, പക്വത, അല്ലെങ്കിൽ അന്തിമ പൂർത്തീകരണം എന്നിങ്ങനെ ഇത് വ്യാഖ്യാനിക്കപ്പെടുന്നു.'
    reason: alternative_reading
  - marker: b
    text: അഥവാ “ഒഴിവാക്കപ്പെടും,” “അവസാനിക്കും,” അല്ലെങ്കിൽ “പ്രാബല്യമില്ലാതാക്കപ്പെടും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: വരുമ്പോൾ
  rationale: ഭാവിയിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന സംഭവത്തെ സൂചിപ്പിക്കുന്ന സമയവാക്യമായി സ്വാഭാവികമായ മലയാളം നൽകുന്നു; ആവർത്തനാർഥമുള്ള ‘എപ്പോഴൊക്കെ’ ഇവിടെ അനുയോജ്യമല്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഭാഗികാവസ്ഥയോടുള്ള മൃദുവായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἔλθῃ
  choice: വരുമ്പോൾ
  rationale: ὅταν-നോടുകൂടിയ aorist subjunctive ഭാവിയിലെ സംഭവത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സമയപ്രത്യയത്തോടുകൂടിയ ഈ രൂപം സ്വാഭാവികമാണ്.
- source_word: τὸ τέλειον
  choice: പൂർണമായത്
  rationale: നപുംസകലിംഗ substantival പ്രയോഗത്തിന്റെ വിശാലത നിലനിർത്തുകയും ‘പക്വമായത്’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ ἐκ μέρους
  choice: ഭാഗികമായത്
  rationale: substantival ആയ ἐκ μέρους-നെ സംക്ഷിപ്തമായി നൽകുകയും τὸ τέλειον-നോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: καταργηθήσεται
  choice: ഇല്ലാതാകും
  rationale: പ്രവർത്തനം അവസാനിക്കുകയോ പ്രാബല്യം നഷ്ടപ്പെടുകയോ ചെയ്യുന്ന അർഥം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി അറിയിക്കുന്നു; സമ്പൂർണ നാശം മാത്രം നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: τὸ τέλειον എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: ‘പൂർണമായത്’ എന്നു പൊതുവായി നൽകി, അത് എന്താണെന്ന് മുഖ്യപാഠത്തിൽ നിർണ്ണയിച്ചിട്ടില്ല.
  alternative: ‘സമ്പൂർണമായത്,’ ‘പക്വമായത്,’ അല്ലെങ്കിൽ അന്തിമ പൂർത്തീകരണം; ചിലർ പൂർത്തിയായ തിരുവെഴുത്തുസമാഹാരം എന്നും വ്യാഖ്യാനിക്കുന്നു.
  rationale: ഗ്രീക്ക് പദപ്രയോഗം ഈ വാക്യത്തിൽ സൂചിതാർത്ഥം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘പൂർണമായത്/ഭാഗികമായത്’ എന്ന സമാന്തര ഘടന ഗ്രീക്ക് വൈരുധ്യം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
