id: 1CO.13.13
reference: 1 Corinthians 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ[a] വിശ്വാസം[b], പ്രത്യാശ, സ്നേഹം—ഈ മൂന്നും നിലനിൽക്കുന്നു[c]. ഇവയിൽ ഏറ്റവും വലിയത് സ്നേഹമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇപ്പോൾ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ ബന്ധകം തുടർച്ചയെയോ മൃദുവായ വൈരുധ്യത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശ്വാസം’ എന്നത് ഇവിടെ ‘വിശ്വസിക്കൽ’ അല്ലെങ്കിൽ ‘ആശ്രയിക്കൽ’ എന്ന വിശാല അർഥത്തിലും ഗ്രഹിക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘നിലനിൽക്കുന്നു’ എന്നതിന് ‘തുടരുന്നു’ അല്ലെങ്കിൽ ‘ശേഷിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: νυνί എന്നത് ‘ഇപ്പോൾ’ എന്ന വർത്തമാന/സംഗ്രഹാത്മക സൂചന നൽകുന്നു; δέ മുൻവാക്യങ്ങളോടുള്ള മൃദുവായ വൈരുധ്യമോ ആശയമാറ്റമോ സൂചിപ്പിക്കുന്നു. ‘എന്നാൽ ഇപ്പോൾ’ ഈ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μένει
  choice: നിലനിൽക്കുന്നു
  rationale: μένω ഇവിടെ തുടർന്നുനിൽക്കുക, ശേഷിക്കുക, നിലനിൽക്കുക എന്ന അർഥത്തിലാണ്. താൽക്കാലിക വരങ്ങൾ ഇല്ലാതാകുന്നതുമായുള്ള വൈരുധ്യത്തിൽ ‘നിലനിൽക്കുന്നു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: പ്രത്യാശയും സ്നേഹവും ചേർന്ന ഈ ത്രയത്തിൽ πίστις എന്നതിന് പതിവും സന്ദർഭോചിതവുമായ മലയാളപദം ‘വിശ്വാസം’ ആണ്; ‘ആശ്രയം’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλπίς
  choice: പ്രത്യാശ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലും ഈ ത്രയത്തിലും ἐλπίς എന്നതിന് ദൈവശാസ്ത്രപരമായി സ്ഥാപിതവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായ പദമാണ് ‘പ്രത്യാശ’.
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπη എന്നതിന് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും വ്യാപകവുമായ ആധുനിക മലയാള പരിഭാഷ ‘സ്നേഹം’ ആണ്.
- source_word: τὰ τρία ταῦτα
  choice: ഈ മൂന്നും
  rationale: മുമ്പ് പറഞ്ഞ വിശ്വാസം, പ്രത്യാശ, സ്നേഹം എന്നീ മൂന്നിലേക്കാണ് ഈ പ്രയോഗം വിരൽചൂണ്ടുന്നത്; ‘ഈ മൂന്നും’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: μείζων δὲ τούτων
  choice: ഇവയിൽ ഏറ്റവും വലിയത്
  rationale: μείζων രൂപത്തിൽ താരതമ്യപദമാണെങ്കിലും, τούτων എന്ന താരതമ്യജനിറ്റീവോടുകൂടി ഈ മൂന്നിൽ സ്നേഹത്തിന്റെ പരമസ്ഥാനമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ഇവയിൽ ഏറ്റവും വലിയത്’ ആ അർഥം കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ ത്രയത്തിൽ πίστις എന്നതിന്റെ പരിഭാഷ
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ ‘വിശ്വാസം, പ്രത്യാശ, സ്നേഹം’ എന്ന സ്ഥാപിത ത്രയം ‘വിശ്വാസം’ എന്ന വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. ‘വിശ്വസ്തത’ എന്ന അർഥം ഇവിടെ കുറച്ച് സാധ്യതയുള്ളതാണ്; πίστις-ന്റെ ആശ്രയാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: μείζων എന്ന താരതമ്യരൂപത്തിന്റെ ശക്തി
  choice: ഇവയിൽ ഏറ്റവും വലിയത് സ്നേഹമാണ്
  alternative: ഇവയെക്കാൾ വലിയത് സ്നേഹമാണ്
  rationale: ഗ്രീക്ക് താരതമ്യരൂപം ഈ മൂന്ന് ഗുണങ്ങളിൽ സ്നേഹത്തിന് പരമസ്ഥാനം നൽകുന്നു. മലയാളത്തിലെ അത്യുത്തമരൂപം ആ ക്രമനിർണ്ണയം വ്യക്തമായി അറിയിക്കുന്നു; അധിക ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: νυνὶ δὲ എന്ന ബന്ധകത്തിന്റെ ആശയബന്ധം
  choice: എന്നാൽ ഇപ്പോൾ
  alternative: ഇപ്പോൾ; ഇനി ഇപ്പോൾ
  rationale: δέ-ക്ക് തുടർച്ചയുടെയും മൃദുവായ വൈരുധ്യത്തിന്റെയും ശക്തി ഉണ്ടാകാം. മുൻസന്ദർഭത്തിലെ ഇല്ലാതാകുന്ന വരങ്ങളും നിലനിൽക്കുന്ന ഗുണങ്ങളും തമ്മിലുള്ള ബന്ധം കണക്കിലെടുത്ത് ‘എന്നാൽ ഇപ്പോൾ’ തിരഞ്ഞെടുത്തു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ത്രയമായ ‘വിശ്വാസം, പ്രത്യാശ, സ്നേഹം’ നിലനിർത്തി. ഗ്രീക്കിലെ സംക്ഷിപ്തതയും അവസാനവാക്യത്തിന്റെ ഊന്നലും മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
