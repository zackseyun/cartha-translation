id: 1CO.13.5
reference: 1 Corinthians 13:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἀσχημονεῖ, οὐ ζητεῖ τὰ ἑαυτῆς, οὐ παροξύνεται, οὐ λογίζεται τὸ κακόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: ml
  text: അത് അനുചിതമായി പെരുമാറുന്നില്ല[a]; സ്വന്തത്തിനുവേണ്ടിയുള്ളത് തേടുന്നില്ല[b]; പ്രകോപിതമാകുന്നില്ല[c]; ദോഷം കണക്കിൽ വെക്കുന്നില്ല[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മാന്യമല്ലാത്തവിധം പെരുമാറുന്നില്ല” അല്ലെങ്കിൽ “മര്യാദകേടായി പെരുമാറുന്നില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “തനിക്കുള്ളവ തേടുന്നില്ല”; അതായത്, സ്വാർഥമായി സ്വന്തം താൽപര്യം മാത്രം നോക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “കോപത്തിലേക്കു പ്രകോപിക്കപ്പെടുന്നില്ല.” മൂലപാഠത്തിൽ “എളുപ്പത്തിൽ” എന്ന പദമില്ല.
    reason: alternative_reading
  - marker: d
    text: അഥവാ, “ചെയ്ത തെറ്റുകളുടെ കണക്ക് സൂക്ഷിക്കുന്നില്ല.” അക്ഷരാർഥത്തിൽ, “ദോഷം കണക്കാക്കുന്നില്ല.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: മാന്യമല്ലാത്തവിധം പെരുമാറുന്നു
  rationale: അനുചിതവും അപമാനകരവും സാമൂഹികമായി ശോഭിക്കാത്തതുമായ പെരുമാറ്റം എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; ‘മര്യാദകേടായി’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: സ്വന്തം കാര്യം അന്വേഷിക്കുന്നു
  rationale: ‘തനിക്കുള്ളവയെ അന്വേഷിക്കുന്നു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആത്മകേന്ദ്രിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ‘സ്വന്തം ഇഷ്ടം നിർബന്ധിക്കുന്നു’ എന്ന അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: παροξύνεται
  choice: പ്രകോപിതമാകുന്നു
  rationale: മൂർച്ചയുള്ള അസ്വസ്ഥതയിലേക്കോ കോപത്തിലേക്കോ ഉണർത്തപ്പെടുക എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘എളുപ്പത്തിൽ’ എന്ന തീവ്രത ചേർക്കുന്നില്ല.
- source_word: λογίζεται
  choice: കണക്കിൽ വെക്കുന്നു
  rationale: കണക്കുകൂട്ടുക, രേഖപ്പെടുത്തിവെക്കുക, പരിഗണിക്കുക എന്നീ അർഥങ്ങളുള്ള കണക്കെടുപ്പ് രൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸ κακόν
  choice: തിന്മ
  rationale: ഗ്രീക്കിലെ നിർവചനാർഥമുള്ള ഏകവചനത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഒരാൾ ചെയ്ത ദോഷത്തെയും അനീതിയെയും സൂചിപ്പിക്കാമെങ്കിലും അതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἀγάπη (implicit subject from context)
  choice: അത്
  rationale: മുൻസന്ദർഭത്തിലെ ‘സ്നേഹം’ എന്ന കർത്താവിനെ തുടർന്നുകൊണ്ടുപോകുന്നു; വിവരണപരമ്പരയിൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: παροξύνεται എന്നതിൽ ‘എളുപ്പത്തിൽ കോപപ്പെടുന്നു’ എന്ന തീവ്രത ചേർക്കണമോ
  choice: പ്രകോപിതമാകുന്നില്ല
  alternative: എളുപ്പത്തിൽ കോപപ്പെടുന്നില്ല
  rationale: മൂലപാഠത്തിൽ ‘എളുപ്പത്തിൽ’ എന്ന ക്രിയാവിശേഷണം ഇല്ല. അതിനാൽ കോപത്തിലേക്കോ അസ്വസ്ഥതയിലേക്കോ പ്രകോപിക്കപ്പെടുക എന്ന ആശയം മാത്രം നിലനിർത്തുന്നു.
- issue: λογίζεται τὸ κακόν എന്നത് മറ്റുള്ളവർ ചെയ്ത തെറ്റുകളുടെ പട്ടിക സൂക്ഷിക്കുന്നതായി വികസിപ്പിക്കണമോ
  choice: തിന്മ കണക്കിൽ വെക്കുന്നില്ല
  alternative: ചെയ്ത തെറ്റുകളുടെ കണക്ക് സൂക്ഷിക്കുന്നില്ല
  rationale: തിരഞ്ഞെടുത്ത രൂപം കണക്കെടുപ്പ് രൂപകവും ഏകവചനവും നിലനിർത്തുന്നു; അതേസമയം ‘തിന്മ’ പൊതുവായ ദോഷമാണോ അനുഭവിച്ച അനീതിയാണോ എന്ന യഥാർഥ അർഥവ്യാപ്തി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മാന്യമല്ലാത്തവിധം’ സാമൂഹികവും നൈതികവുമായ അനുചിതത്വം ഉൾക്കൊള്ളുന്നു. ‘തിന്മ കണക്കിൽ വെക്കുക’ മലയാളത്തിൽ മനസ്സിൽ കണക്ക് സൂക്ഷിക്കുന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ഗ്രീക്കിലെ accounting metaphor സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
