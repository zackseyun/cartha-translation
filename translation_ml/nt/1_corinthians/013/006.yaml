id: 1CO.13.6
reference: 1 Corinthians 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ χαίρει ἐπὶ τῇ ἀδικίᾳ, συγχαίρει δὲ τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/006.yaml
  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: ml
  text: അനീതിയിൽ[a] സന്തോഷിക്കുന്നില്ല; മറിച്ച് സത്യത്തോടൊപ്പം[b] സന്തോഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അധർമ്മത്തിൽ’ എന്നോ ‘തെറ്റായ പ്രവൃത്തിയിൽ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘സത്യത്തിൽ സന്തോഷിക്കുന്നു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് സംയുക്തക്രിയയ്ക്ക് ഒരാളോടോ ഒന്നിനോടോ കൂടെ സന്തോഷിക്കുക എന്നോ അതിനെക്കുറിച്ച് സന്തോഷിക്കുക എന്നോ അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: സന്തോഷിക്കുന്നു
  rationale: χαίρω സൂചിപ്പിക്കുന്ന ആനന്ദത്തെയും സന്തോഷത്തെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; συγχαίρει എന്ന സമാന്തര ക്രിയയുമായുള്ള ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: അനീതിയിൽ
  rationale: ἐπί + ദത്തി ഇവിടെ സന്തോഷത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്നു. ‘അനീതിയിൽ സന്തോഷിക്കുക’ എന്ന പ്രയോഗം തെറ്റിലും അധാർമ്മികതയിലും ആനന്ദം കണ്ടെത്തുന്ന വിശാലമായ നൈതിക അർഥം നിലനിർത്തുന്നു.
- source_word: συγχαίρει
  choice: സത്യത്തോടൊപ്പം സന്തോഷിക്കുന്നു
  rationale: συν- എന്ന ഉപസർഗത്തിലെ ‘കൂടെ/ഒപ്പം’ എന്ന ആശയം വ്യക്തമായി നിലനിർത്തുകയും, സത്യവുമായി ചേർന്ന് സന്തോഷിക്കുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യക്തിവൽക്കരിച്ച ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: മറിച്ച്
  rationale: അനീതിയിൽ സന്തോഷിക്കാത്തതും സത്യത്തോടൊപ്പം സന്തോഷിക്കുന്നതും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τῇ ἀληθείᾳ
  choice: സത്യം
  rationale: നിശ്ചയാർഥകമായ ഗ്രീക്ക് പ്രയോഗം ആശയപരമായി ‘സത്യം’ എന്നു നൽകുന്നു; ഇത് സത്യസന്ധത, യാഥാർഥ്യം, ശരിയായ നൈതിക നിലപാട് എന്നിവയിൽ ഏതെങ്കിലും ഒറ്റ അർഥത്തിലേക്ക് വാക്യത്തെ ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ നൈതിക വൈരുധ്യത്തിൽ ἀδικία എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അനീതി
  alternative: അധർമ്മം; തെറ്റായ പ്രവൃത്തി
  rationale: ‘അനീതി’ സാമൂഹിക അന്യായത്തിൽ മാത്രം ഒതുങ്ങാതെ തെറ്റും നീതികേടും ഉൾക്കൊള്ളാൻ കഴിവുള്ളതാണ്. ‘അധർമ്മം’ എന്നത് കൂടുതൽ മതപരമായ പ്രത്യേകാർഥം വരുത്താൻ ഇടയുള്ളതിനാൽ പ്രധാന പാഠത്തിൽ ഒഴിവാക്കി, പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: συγχαίρει എന്നതിലെ συν- ഉപസർഗത്തിന്റെ അർഥം
  choice: സത്യത്തോടൊപ്പം സന്തോഷിക്കുന്നു
  alternative: സത്യത്തിൽ സന്തോഷിക്കുന്നു
  rationale: പ്രധാന പാഠം ‘കൂടെ സന്തോഷിക്കുക’ എന്ന സംയുക്തക്രിയയുടെ ഘടകം നിലനിർത്തുന്നു; എന്നാൽ ഗ്രീക്ക് ക്രിയയ്ക്ക് സത്യത്തെക്കുറിച്ച് അഥവാ സത്യത്തിൽ സന്തോഷിക്കുക എന്ന അർഥവും സന്ദർഭത്തിൽ സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിൽ ഈ വാക്യത്തിൽ ‘സ്നേഹം’ എന്ന കർത്താവ് ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിലും കർത്താവിനെ അനാവശ്യമായി ചേർത്തിട്ടില്ല. അർധവിരാമം നിഷേധാത്മകവും അനുകൂലാത്മകവുമായ സമാന്തര ഘടകങ്ങളുടെ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
