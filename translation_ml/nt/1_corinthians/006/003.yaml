id: 1CO.6.3
reference: 1 Corinthians 6:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν, μήτιγε βιωτικά;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/003.yaml
  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: ml
  text: ദൂതന്മാരെ നാം വിധിക്കുമെന്ന് നിങ്ങൾ അറിയുന്നില്ലേ? ഈ ജീവിതത്തിലെ കാര്യങ്ങളോ, പിന്നെ പറയാനുണ്ടോ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഈ ജീവിതത്തിലെ കാര്യങ്ങളെക്കുറിച്ച് എത്ര അധികം!’ അല്ലെങ്കിൽ ‘ഈ ജീവിതത്തിലെ കാര്യങ്ങൾ എത്രയോ അധികം!’'
    reason: μήτιγε വലിയതിൽനിന്ന് ചെറിയതിലേക്കുള്ള വാദത്തെ ഊന്നിപ്പറയുന്നു. പ്രധാനപാഠത്തിലെ പ്രയോഗം ‘പിന്നെ പറയാനുണ്ടോ/let alone’ എന്ന സ്വാഭാവിക മലയാളരീതിയിൽ ആ വാദദിശ വ്യക്തമാക്കുന്നു; ‘എത്ര അധികം’ എന്നത് സാധ്യമായ കൂടുതൽ ഔപചാരിക ബദലാണ്.
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾക്കറിയില്ലേ
  rationale: പൗലൊസിന്റെ ആവർത്തിച്ചുവരുന്ന അലങ്കാരചോദ്യത്തിന്റെ ഔപചാരിക ശക്തി നിലനിർത്തുന്നതിനൊപ്പം സ്വാഭാവികമായ ആധുനിക മലയാളവും നൽകുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: ‘അറിയുക’ എന്ന ക്രിയയുടെ ഉള്ളടക്കവാക്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀγγέλους
  choice: ദൂതന്മാരെ
  rationale: ഈ അന്ത്യകാലവിധിയുടെ പശ്ചാത്തലത്തിൽ മനുഷ്യസന്ദേശവാഹകരല്ല, സ്വർഗീയ ജീവികളാണ് സൂചിപ്പിക്കപ്പെടുന്നത്.
- source_word: κρινοῦμεν
  choice: നാം വിധിക്കും
  rationale: ഭാവികാല സൂചന നിലനിർത്തുകയും κρίνω എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധമായ അർഥം അനാവശ്യമായി ‘ഭരിക്കുക’ എന്ന് പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: μήτιγε
  choice: അങ്ങനെയെങ്കിൽ ... എത്രയധികം
  rationale: വലിയതിൽനിന്ന് ചെറിയതിലേക്കുള്ള വാദത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; ഇതിന് ‘പിന്നെ ... പറയാനുണ്ടോ’ എന്ന അർഥച്ഛായയും സാധ്യമാണ്.
- source_word: βιωτικά
  choice: ഈ ജീവിതത്തിലെ കാര്യങ്ങൾ
  rationale: സാധാരണ ഭൗമികജീവിതവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങൾ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ തർക്കങ്ങളെ മാത്രം സൂചിപ്പിക്കുന്നതായി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: വിശ്വാസികൾ ‘ദൂതന്മാരെ വിധിക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: ‘ദൂതന്മാരെ നാം വിധിക്കും’ എന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൂതന്മാരുടെമേൽ നാം ഭരിക്കും’ അല്ലെങ്കിൽ ‘വീണുപോയ ദൂതന്മാരെ നാം വിധിക്കും’
  rationale: വിധിയുടെ രീതി, വ്യാപ്തി, അല്ലെങ്കിൽ ഏതു ദൂതന്മാരാണ് ഉദ്ദേശിക്കപ്പെടുന്നത് എന്നിവ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനത്തിലൂടെ ആ അവ്യക്തത പരിഹരിക്കാതെ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ദൂതന്മാർ’, ‘വിധിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അവസാന ഭാഗത്തിന്റെ ഗ്രീക്ക് സംക്ഷിപ്തത മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി ‘അങ്ങനെയെങ്കിൽ’ ചേർത്ത് വ്യക്തമാക്കി.
