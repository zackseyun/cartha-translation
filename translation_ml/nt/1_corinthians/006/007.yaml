id: 1CO.6.7
reference: 1 Corinthians 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: ml
  text: അപ്പോൾ, നിങ്ങൾ തമ്മിൽ വ്യവഹാരങ്ങൾ ഉണ്ടെന്നത് ഇതിനകംതന്നെ നിങ്ങൾക്കു മൊത്തത്തിൽ ഒരു പരാജയമാണ്[a][b]. എന്തുകൊണ്ട് നിങ്ങൾ അതിനു പകരം അന്യായം അനുഭവിക്കുന്നില്ല? എന്തുകൊണ്ട് നിങ്ങൾ അതിനു പകരം വഞ്ചിക്കപ്പെടുന്നില്ല[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പരാജയം’ എന്നതിന് ‘നഷ്ടം’ അല്ലെങ്കിൽ ‘തോൽവി’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἥττημα എന്ന പദത്തിന് നഷ്ടം, തോൽവി, പരാജയം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വ്യവഹാരങ്ങൾ’ എന്നതിന് ‘കോടതിക്കേസുകൾ’ അല്ലെങ്കിൽ ‘നിയമപരമായ കേസുകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ κρίματα ഇവിടെ കോടതിയിലെത്തിച്ച തർക്കങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: c
    text: ‘വഞ്ചിക്കപ്പെടുന്നില്ല?’ എന്നതിന് ‘നഷ്ടപ്പെടുത്തപ്പെടുന്നില്ല?’ അല്ലെങ്കിൽ ‘കബളിപ്പിക്കപ്പെടുന്നില്ല?’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ἀποστερεῖσθε എന്ന പദത്തിന് വഞ്ചിക്കപ്പെടുക, നഷ്ടപ്പെടുത്തപ്പെടുക, അല്ലെങ്കിൽ അവകാശപ്പെട്ടത് നിഷേധിക്കപ്പെടുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: കേസുകളുടെ ഫലം എന്തായാലും പരാജയം ഇപ്പോൾത്തന്നെ സംഭവിച്ചുകഴിഞ്ഞുവെന്ന പൗലോസിന്റെ വിലയിരുത്തൽ വ്യക്തമാക്കുന്നു.
- source_word: μὲν οὖν
  choice: അതിനാൽ
  rationale: മുൻവാക്യങ്ങളിൽനിന്ന് നിഗമനത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; μὲν എന്ന ഘടകത്തിന്റെ ലഘുവായ ഊന്നൽ വാക്യത്തിന്റെ സമഗ്രരൂപത്തിൽ പ്രകടമാകുന്നു.
- source_word: ὅλως
  choice: സമ്പൂർണ
  rationale: സ്ഥിതിയെ മൊത്തത്തിൽ പരാജയമായി വിലയിരുത്തുന്ന തീവ്രത നിലനിർത്തുന്നു.
- source_word: ἥττημα
  choice: പരാജയം
  rationale: നിയമപരമായ കേസിൽ ആര് ജയിക്കുന്നു എന്നതിനു മുമ്പേ സമൂഹം ധാർമികമായി തോറ്റുവെന്ന ശക്തമായ വാചാടോപഭാവം നൽകുന്നു; ‘നഷ്ടം’ എന്നും അർഥമാകാം.
- source_word: κρίματα
  choice: വ്യവഹാരങ്ങൾ
  rationale: ഈ സന്ദർഭത്തിൽ വിശ്വാസികൾ പരസ്പര തർക്കങ്ങൾ കോടതിയിലെത്തിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ നിയമപദമാണ്.
- source_word: μεθ’ ἑαυτῶν
  choice: നിങ്ങൾ തമ്മിൽ
  rationale: സമൂഹത്തിനകത്തെ പരസ്പര തർക്കം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: διὰ τί οὐχὶ μᾶλλον
  choice: പകരം ... കൂടേ?
  rationale: പൗലോസിന്റെ താരതമ്യാത്മകമായ വാചാടോപചോദ്യം മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികമായും പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἀδικεῖσθε
  choice: അന്യായം സഹിക്കുക
  rationale: അന്യായത്തിന് ഇരയാകുക എന്ന കർമണിഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποστερεῖσθε
  choice: വഞ്ചിക്കപ്പെടുക
  rationale: ഒരാളാൽ സ്വത്തോ അവകാശമോ നഷ്ടപ്പെടുത്തപ്പെടുക, ചതിക്കപ്പെടുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു; ‘കവർന്നെടുക്കപ്പെടുക’ എന്ന വിശാലമായ അർഥവും സാധ്യമാണ്.
theological_decisions:
- issue: സഭയ്ക്കുള്ളിലെ നിയമവ്യവഹാരങ്ങളെക്കുറിച്ചുള്ള പൗലോസിന്റെ വിലയിരുത്തൽ
  choice: ἥττημα എന്നത് ‘പരാജയം’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നഷ്ടം’ അല്ലെങ്കിൽ ‘വീഴ്ച’
  rationale: വ്യവഹാരങ്ങൾ നിലനിൽക്കുന്നതുതന്നെ സമൂഹത്തിന്റെ പരാജയമാണെന്ന ശക്തമായ വിലയിരുത്തൽ ഇത് നിലനിർത്തുന്നു; വാക്യം വ്യക്തമാക്കാത്ത പ്രത്യേക സിദ്ധാന്തവിഭാഗം ഇതിൽ ചേർക്കുന്നില്ല.
- issue: അന്യായവും വഞ്ചനയും സഹിക്കണമെന്ന വാചാടോപചോദ്യങ്ങളുടെ സ്വഭാവം
  choice: രണ്ട് ചോദ്യങ്ങളും നേരിട്ടുള്ള വെല്ലുവിളികളായി നിലനിർത്തി.
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും അന്യായം നിർബന്ധമായി സഹിക്കണമെന്ന പൊതുനിയമമായി വിശദീകരിക്കുക
  rationale: മൂലപാഠം ഈ പ്രത്യേക സാഹചര്യത്തിൽ ചോദ്യരൂപത്തിലാണ് സംസാരിക്കുന്നത്; അതിന്റെ പ്രയോഗപരിധി വിവർത്തനം സ്വമേധയാ വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘വ്യവഹാരങ്ങൾ’ ഉപയോഗിച്ചു. ‘അന്യായം സഹിച്ചുകൂടേ?’ എന്ന പ്രയോഗം കർമണിഭാവത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; രണ്ട് സമാന്തര ചോദ്യങ്ങളുടെയും വാചാടോപശക്തി സംരക്ഷിച്ചിട്ടുണ്ട്.
