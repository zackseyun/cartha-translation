revisions:
- from: അതിനാൽ, നിങ്ങൾ തമ്മിൽ വ്യവഹാരങ്ങൾ ഉണ്ടെന്നതുതന്നെ നിങ്ങൾക്ക് ഇതിനകം സമ്പൂർണ പരാജയമാണ്[a][b]. പകരം അന്യായം സഹിച്ചുകൂടേ? പകരം വഞ്ചിക്കപ്പെട്ടുകൂടേ?[c]
  to: അപ്പോൾ, നിങ്ങൾ തമ്മിൽ വ്യവഹാരങ്ങൾ ഉണ്ടെന്നത് ഇതിനകംതന്നെ നിങ്ങൾക്കു മൊത്തത്തിൽ ഒരു പരാജയമാണ്[a][b]. എന്തുകൊണ്ട് നിങ്ങൾ അതിനു പകരം അന്യായം അനുഭവിക്കുന്നില്ല? എന്തുകൊണ്ട് നിങ്ങൾ അതിനു പകരം വഞ്ചിക്കപ്പെടുന്നില്ല[c]?
  rationale: The revision preserves the Greek sequence and rhetorical structure while using idiomatic modern Malayalam. It moderates the rendering of ὅλως to a summative assessment, makes μᾶλλον explicit through ‘അതിനു പകരം,’ and keeps the alternatives for ἀποστερεῖσθε within the source word’s semantic range.
