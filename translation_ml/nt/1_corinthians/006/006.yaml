reference: 1 Corinthians 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: ml
  text: എന്നാൽ ഒരു സഹോദരൻ മറ്റൊരു സഹോദരനെതിരെ കോടതിയിൽ പോകുന്നു[b]—അതും അവിശ്വാസികളുടെ മുമ്പാകെ[a] തന്നെയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ആ അവിശ്വാസികളുടെ മുമ്പാകെ.’ സഭയ്ക്കു പുറത്തുള്ളവർ നടത്തുന്ന ലൗകിക കോടതികളെയാണ് ഈ പ്രയോഗം സാധ്യതയോടെ സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഗ്രീക്കിൽ ‘അവിശ്വാസികളുടെ മുമ്പാകെ’ എന്നു മാത്രമാണുള്ളത്.
    reason: lexical_alternative
  - marker: b
    text: ആവർത്തിച്ചിരിക്കുന്ന ‘സഹോദരൻ’ എന്ന പദം ക്രിസ്തീയ സമൂഹത്തിലെ സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പ്രതീക്ഷിച്ചിരുന്ന സഭയ്ക്കുള്ളിലെ തീർപ്പും ഇവിടെ പറയുന്ന യാഥാർഥ്യവും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: ഒരു സഹോദരൻ മറ്റൊരു സഹോദരനെതിരെ
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ഏകവചന പുല്ലിംഗ കുടുംബപദം നിലനിർത്തുന്നു; ഇവിടെ അത് ക്രിസ്തീയ സമൂഹത്തിലെ സഹവിശ്വാസികളെ പ്രതിനിധീകരിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: μετὰ
  choice: എതിരെ
  rationale: നിയമവ്യവഹാരത്തിന്റെ സന്ദർഭത്തിൽ കക്ഷികൾ തമ്മിലുള്ള എതിർപ്പ് സൂചിപ്പിക്കുന്നതിനാൽ, സാധാരണ അർഥമായ ‘കൂടെ’ എന്നതിനെക്കാൾ ‘എതിരെ’ യോജിക്കുന്നു.
- source_word: κρίνεται
  choice: കോടതിയിൽ പോകുന്നു
  rationale: ഇവിടെ ക്രിയയ്ക്ക് നിയമവ്യവഹാരപരമായ അർഥമാണ്; അക്ഷരാർഥത്തിലുള്ള ‘വിധിക്കപ്പെടുന്നു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: καὶ τοῦτο
  choice: അതും ... തന്നെയോ
  rationale: സഹോദരങ്ങൾ തമ്മിലുള്ള കേസ് അവിശ്വാസികളുടെ മുമ്പാകെയാണെന്നതിലുള്ള പൗലോസിന്റെ ഞെട്ടലും ശാസനാത്മകമായ ചോദ്യഭാവവും പകർത്തുന്നു.
- source_word: ἐπὶ ἀπίστων
  choice: അവിശ്വാസികളുടെ മുമ്പാകെ
  rationale: കേസ് ആരുടെ മുമ്പിലാണ് നടക്കുന്നതെന്ന് സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ന്യായാധിപന്മാർ’ എന്ന വിശദീകരണം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: സഭയിലെ അംഗങ്ങളെ സൂചിപ്പിക്കുന്ന ἀδελφός എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ പ്രയോഗം
  choice: സഹോദരൻ
  alternative: സഹവിശ്വാസി; സഹോദരനോ സഹോദരിയോ
  rationale: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗവും പൗലോസിന്റെ കുടുംബബന്ധ ഭാഷയും നിലനിർത്തുന്നു; ഇത് ക്രിസ്തീയ സമൂഹത്തിലെ സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കുന്നുവെന്ന കാര്യം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ἀπίστων എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: അവിശ്വാസികൾ
  alternative: അവിശ്വാസികളായ ന്യായാധിപന്മാർ; പുറത്തുള്ളവർ
  rationale: സഭയും വിശ്വാസത്തിന് പുറത്തുള്ളവരും തമ്മിലുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു; ഗ്രീക്ക് വ്യക്തമാക്കുന്നതിനെക്കാൾ ഇടുങ്ങിയ ഒരു തിരിച്ചറിയൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായതും അതേസമയം ഗൗരവമുള്ളതുമായ മലയാളം. നിയമസന്ദർഭം വ്യക്തമാക്കാൻ ‘കോടതിയിൽ പോകുന്നു’ ഉപയോഗിച്ചു; മൂലത്തിലെ ചോദ്യഭാവവും കുടുംബബന്ധ ഭാഷയും സംരക്ഷിച്ചു.
