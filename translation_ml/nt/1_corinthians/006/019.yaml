id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: ml
  text: അല്ലെങ്കിൽ, നിങ്ങളുടെ ശരീരം നിങ്ങളിലുള്ള പരിശുദ്ധാത്മാവിന്റെ ആലയമാണെന്നും[a] ആ ആത്മാവിനെ നിങ്ങൾക്കു ദൈവത്തിൽനിന്ന് ലഭിച്ചിരിക്കുന്നുവെന്നും നിങ്ങൾ അറിയുന്നില്ലേ? നിങ്ങൾ നിങ്ങളുടേതല്ല[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളിൽ ഇരിക്കുന്ന പരിശുദ്ധാത്മാവിന്റെ ആലയമാണ് നിങ്ങളുടെ ശരീരം എന്നും.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ശരീരം’ ഏകവചനത്തിലും ‘നിങ്ങളുടെ’ ബഹുവചനത്തിലുമാണ്. ഇത് ‘നിങ്ങളിൽ ഓരോരുത്തരുടെയും ശരീരം’ എന്ന വിതരണാത്മക അർഥത്തിലോ പ്രതിനിധിപരമായ അർഥത്തിലോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദത്തിന്റെ തുടർച്ചയായി മറ്റൊരു മൂർച്ചയുള്ള ആലങ്കാരിക ചോദ്യം അവതരിപ്പിക്കുന്ന ബന്ധപദമാണ്.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലേ?
  rationale: പൗലോസിന്റെ പതിവായ ആലങ്കാരിക ചോദ്യരൂപവും οἶδα എന്ന ക്രിയയുടെ നേരായ അർഥവും നിലനിർത്തുന്നു.
- source_word: τὸ σῶμα ὑμῶν
  choice: നിങ്ങളുടെ ശരീരം
  rationale: ഗ്രീക്കിലെ ബഹുവചന ഉടമസ്ഥസർവനാമത്തോടുകൂടിയ ഏകവചന ‘ശരീരം’ അതേപടി നിലനിർത്തുന്നു.
- source_word: ναὸς
  choice: ആലയം
  rationale: ναός സൂചിപ്പിക്കുന്ന വിശുദ്ധമന്ദിരത്തിന്റെ ശക്തമായ രൂപകം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: നിങ്ങളിലുള്ള പരിശുദ്ധാത്മാവിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധവും ἐν ὑμῖν എന്ന ‘നിങ്ങളിൽ’ എന്ന ആശയവും വ്യാഖ്യാനാതിരേകം കൂടാതെ സൂക്ഷിക്കുന്നു.
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: ആ ആത്മാവിനെ നിങ്ങൾക്കു ദൈവത്തിൽനിന്ന് ലഭിച്ചിരിക്കുന്നു
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി ബന്ധവാക്യം സമാന്തര ഉപവാക്യമായി നൽകുന്നു; ἀπὸ θεοῦ സൂചിപ്പിക്കുന്ന ഉറവിടവും പരിശുദ്ധാത്മാവെന്ന വ്യക്തിപരമായ സൂചനയും വ്യക്തമാക്കുന്നു.
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: നിങ്ങൾ നിങ്ങളുടേതല്ല
  rationale: സ്വയം തങ്ങൾക്കു സ്വന്തമല്ല എന്ന ജനിറ്റീവ് പ്രതിഫലനപ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: οὗ എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചനയും വ്യക്തിപരതയും
  choice: ‘ആ ആത്മാവിനെ’ എന്നു നൽകി പരിശുദ്ധാത്മാവിനെ വ്യക്തിപരമായ സൂചനയായി നിലനിർത്തുന്നു.
  alternative: വ്യക്തിത്വസൂചനയില്ലാതെ ‘അത്’ എന്നു നൽകുക.
  rationale: ബന്ധസർവനാമം ἁγίου πνεύματός എന്നതിലേക്കാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘ആ ആത്മാവിനെ’ എന്നത് വ്യാകരണബന്ധം വ്യക്തമാക്കുന്നു, അധിക ഉപദേശപരമായ ഭാഷ ചേർക്കുന്നില്ല.
- issue: ബഹുവചന ശ്രോതാക്കളോടൊപ്പം ഏകവചന ‘ശരീരം’
  choice: ‘നിങ്ങളുടെ ശരീരം’ എന്ന ഏകവചനം നിലനിർത്തുന്നു.
  alternative: ‘നിങ്ങളുടെ ശരീരങ്ങൾ’ എന്ന് ബഹുവചനമാക്കുക.
  rationale: τὸ σῶμα ഏകവചനവും ὑμῶν ബഹുവചനവുമാണ്. ഇത് ഓരോരുത്തരെയും വിതരണാത്മകമായി സൂചിപ്പിക്കുന്നതോ സമൂഹത്തെ പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്നതോ എന്ന തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ ആലങ്കാരിക ചോദ്യം, ആലയരൂപകം, ഏകവചന ‘ശരീരം’–ബഹുവചന ‘നിങ്ങളുടെ’ എന്ന സംഘർഷം എന്നിവ നിലനിർത്തി.
