  to: അല്ലെങ്കിൽ, വിശുദ്ധർ ലോകത്തെ വിധിക്കുമെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? ലോകം നിങ്ങളാൽ[a] വിധിക്കപ്പെടുന്നുവെങ്കിൽ, ഏറ്റവും ചെറിയ ന്യായകാര്യങ്ങൾപോലും തീർപ്പാക്കാൻ നിങ്ങൾ യോഗ്യരല്ലയോ?
  rationale: κρiτήριον-ന്റെ സന്ദർഭാനുസൃതമായ ‘വിധിക്കേണ്ട ന്യായകാര്യം’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമായി നൽകി; സ്ഥാപനപരമായ ‘ന്യായാസനം/കോടതി’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. ἐν ὑμῖν-നെക്കുറിച്ചുള്ള തർക്കസാധ്യത പരിഹരിക്കാതെ, മുഖ്യപാഠത്തിലെ സന്ദർഭാനുസൃത വായനയും അടിക്കുറിപ്പിലെ അക്ഷരാർഥവായനയും നിലനിർത്തി.
