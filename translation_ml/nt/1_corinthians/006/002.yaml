id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, വിശുദ്ധർ ലോകത്തെ വിധിക്കുമെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? ലോകം നിങ്ങളാൽ[a] വിധിക്കപ്പെടുന്നുവെങ്കിൽ, ഏറ്റവും ചെറിയ ന്യായകാര്യങ്ങൾപോലും തീർപ്പാക്കാൻ നിങ്ങൾ യോഗ്യരല്ലയോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘നിങ്ങളുടെ ഇടയിൽ’: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘ലോകം നിങ്ങളുടെ ഇടയിൽ വിധിക്കപ്പെടുന്നുവെങ്കിൽ’ എന്നു വായിക്കാം. സന്ദർഭത്തിൽ വിശുദ്ധർ ലോകത്തിന്റെ വിധിയിൽ പങ്കാളികളാകുന്നു എന്നതാണ് ആശയം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യത്തിലെ വാദത്തെ മറ്റൊരു മൂർച്ചയുള്ള ആലങ്കാരിക ചോദ്യമായി തുടരുന്നു.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലയോ?
  rationale: പൗലൊസിന്റെ പതിവായ ആലങ്കാരിക ചോദ്യരൂപവും οἶδα എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ἅγιοι
  choice: വിശുദ്ധർ
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പൗലൊസിന്റെ പ്രയോഗം; പ്രത്യേകമായി വിശുദ്ധരായി പ്രഖ്യാപിക്കപ്പെട്ട ഒരു ചെറുവിഭാഗം എന്ന ആശയം ഇതിൽ ചേർക്കുന്നില്ല.
- source_word: τὸν κόσμον
  choice: ലോകത്തെ
  rationale: മനുഷ്യലോകത്തെയും വിശാലമായ ലോകക്രമത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന κόσμος എന്ന പദത്തിന്റെ സ്വാഭാവികവും വിശാലവുമായ പരിഭാഷ.
- source_word: κρινοῦσιν
  choice: വിധിക്കുമെന്ന്
  rationale: ഭാവികാലത്തിലെ യഥാർഥ വിധിനിർവഹണത്തെ സൂചിപ്പിക്കുന്നു; അതിന്റെ കൃത്യമായ രീതി നിർവചിക്കുന്നില്ല.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളാൽ
  rationale: വിധിയിൽ വിശുദ്ധർ പങ്കാളികളാകുന്നു എന്ന സന്ദർഭാർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κρίνεται
  choice: വിധിക്കപ്പെടുന്നുവെങ്കിൽ
  rationale: നിബന്ധനാവാക്യത്തിലെ വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഭാവിയെ അഭിമുഖീകരിക്കുന്ന അർഥം സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: ἀνάξιοί ἐστε
  choice: നിങ്ങൾ യോഗ്യരല്ലയോ?
  rationale: ἀνάξιος എന്ന പദത്തിന്റെ യോഗ്യതയില്ലായ്മ എന്ന വിലയിരുത്തൽഭാവവും ആലങ്കാരിക ചോദ്യത്തിന്റെ മൂർച്ചയും നിലനിർത്തുന്നു.
- source_word: κριτηρίων ἐλαχίστων
  choice: ഏറ്റവും ചെറിയ കേസുകൾപോലും
  rationale: സന്ദർഭത്തിൽ വിശ്വാസികൾക്കിടയിലെ ചെറിയ തർക്കവിഷയങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. κριτήριον എന്ന പദത്തിന് ‘ന്യായാസനം/കോടതി’ എന്ന സ്ഥാപനാർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ദൈവജനമായ വിശ്വാസികൾ പൊതുവായി
  alternative: അസാധാരണ വിശുദ്ധിയുള്ള ഒരു പരിമിത വിഭാഗം
  rationale: പൗലൊസിന്റെ സാധാരണ പ്രയോഗത്തിൽ οἱ ἅγιοι ക്രിസ്തുവിലുള്ള വിശ്വാസിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഒരു മേൽത്തട്ടിലുള്ള വിഭാഗത്തെ പാഠം വേർതിരിക്കുന്നില്ല.
- issue: വിശുദ്ധർ ലോകത്തെ വിധിക്കുന്നതിന്റെ സ്വഭാവം
  choice: ഭാവിയിലെ വിധിയിൽ യഥാർഥ പങ്കാളിത്തം; അതിന്റെ രീതി വ്യക്തമാക്കാതെ വിടുന്നു
  alternative: വെറും രൂപകാത്മകമായ ധാർമിക വിലയിരുത്തൽ, അല്ലെങ്കിൽ സ്വതന്ത്രവും പൂർണവുമായ ന്യായാധികാരം
  rationale: വിശുദ്ധർ ലോകത്തെ വിധിക്കുമെന്ന് പാഠം നേരിട്ട് പറയുന്നു, എന്നാൽ അത് എങ്ങനെ നടപ്പാകുമെന്ന് വിശദീകരിക്കുന്നില്ല; അതിനാൽ പ്രസ്താവനയുടെ ശക്തിയും അവ്യക്തതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘വിശുദ്ധർ’, ‘വിധിക്കുക’ തുടങ്ങിയ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. രണ്ട് ഗ്രീക്ക് പ്രയോഗങ്ങളിലെ യഥാർഥ അർഥസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
