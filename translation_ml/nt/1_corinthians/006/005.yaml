id: 1CO.6.5
reference: 1 Corinthians 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: ml
  text: നിങ്ങൾക്കു ലജ്ജയുണ്ടാകേണ്ടതിനാണ് ഞാൻ ഇതു പറയുന്നത്. നിങ്ങളിൽ തന്റെ സഹോദരന്റെ കാര്യത്തിൽ തീർപ്പുകൽപ്പിക്കാൻ കഴിവുള്ള ജ്ഞാനിയായ ഒരാൾപോലും[a] ഇല്ലെന്നത് വാസ്തവമാണോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ജ്ഞാനി’ പുല്ലിംഗ ഏകവചനത്തിലാണ്; എന്നാൽ പൗലോസ് മുഴുവൻ സഭയോടുമാണ് സംസാരിക്കുന്നത്. ‘ജ്ഞാനിയായ ഒരു പുരുഷൻപോലും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘തന്റെ സഹോദരന്റെ ഇടയിൽ’ എന്നത് ‘തന്റെ സഹോദരനും മറ്റൊരാളും തമ്മിൽ’ എന്ന അർഥത്തിലുള്ള സംക്ഷിപ്ത പ്രയോഗമാണ്; മറുകക്ഷി സന്ദർഭത്തിൽ സൂചിതമാണ്. ഇവിടെ ‘സഹോദരൻ’ സഭയിലെ ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്നു; അതിൽ സഹോദരിയോ സഹോദരനോ ഉൾപ്പെടാം.
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν λέγω
  choice: നിങ്ങൾക്കു ലജ്ജയുണ്ടാകേണ്ടതിനാണ് ഞാൻ ഇതു പറയുന്നത്
  rationale: പ്രയോഗം ശ്രോതാക്കളുടെ ലജ്ജയെ ഉണർത്തുന്ന ഉദ്ദേശ്യവും ശാസനയുടെ ശക്തിയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ഉദ്ദേശ്യാർഥം വ്യക്തമായി അവതരിപ്പിച്ചു.
- source_word: οὕτως
  choice: എന്നത് വാസ്തവമാണോ?
  rationale: മുൻവാദത്തിൽനിന്നുള്ള പൗലോസിന്റെ രോഷഭരിതമായ ആലങ്കാരിക ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐδεὶς σοφὸς
  choice: ജ്ഞാനിയായ ഒരാൾപോലും
  rationale: οὐδεὶς എന്ന ഊന്നിയ നിഷേധം ‘ഒരാൾപോലും’ എന്നു നൽകി. ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം കലർന്ന സഭയെ പ്രതിനിധീകരിക്കാവുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികവും ഉൾക്കൊള്ളുന്നതുമായ ‘ഒരാൾ’ തിരഞ്ഞെടുത്തു.
- source_word: δυνήσεται διακρῖναι
  choice: തീർപ്പുകൽപ്പിക്കാൻ കഴിവുള്ള
  rationale: നിയമവ്യവഹാരസന്ദർഭത്തിൽ διακρῖναι കക്ഷികൾക്കിടയിൽ വിധിക്കുകയോ തീരുമാനം എടുക്കുകയോ ചെയ്യുന്നതാണ്; ഭാവികാല ശേഷിയുടെ ആശയം ‘കഴിവുള്ള’ എന്നതിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു.
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: തന്റെ സഹോദരന്മാർക്കിടയിൽ
  rationale: ഗ്രീക്ക് വാചകം ‘ഇടയിൽ’ എന്നതിനുശേഷം ഏകവചനത്തിൽ വന്നിട്ടുള്ള സംക്ഷിപ്ത പ്രയോഗമാണ്; തർക്കത്തിലെ രണ്ട് കക്ഷികൾ സന്ദർഭത്തിൽ ഉൾക്കൊള്ളപ്പെടുന്നു. ‘സഹോദരന്മാർക്കിടയിൽ’ മലയാളത്തിൽ വ്യക്തവും കുടുംബസംബന്ധമായ രൂപകം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: കലർന്ന സഭയിലെ ലിംഗസൂചക പ്രതിനിധിപ്രയോഗം
  choice: ജ്ഞാനിയായ ഒരാൾപോലും
  alternative: ജ്ഞാനിയായ ഒരു പുരുഷൻപോലും
  rationale: σοφός പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ചോദ്യം മുഴുവൻ സഭയോടാണ്. മലയാളത്തിലെ ‘ഒരാൾ’ വ്യാകരണലിംഗം അനാവശ്യമായി കർശനമാക്കാതെ പ്രതിനിധിപ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: ἀδελφός എന്ന കുടുംബസംബന്ധമായ വിശ്വാസിസംബോധന
  choice: സഹോദരന്മാർ
  alternative: സഹവിശ്വാസികൾ
  rationale: പൗലോസിന്റെ കുടുംബരൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സഭയിലെ സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ഏകവചനത്തിലുള്ള സംക്ഷിപ്ത ‘between his brother’ പ്രയോഗം
  choice: തന്റെ സഹോദരന്മാർക്കിടയിൽ
  alternative: തന്റെ ഒരു സഹോദരനും മറ്റൊരാളും തമ്മിൽ
  rationale: രണ്ടാമത്തെ കക്ഷി ഗ്രീക്കിൽ തുറന്നുപറയാത്തതിനാൽ ‘മറ്റൊരാൾ’ പ്രധാനവാചകത്തിൽ ചേർക്കാതെ, തർക്കത്തിലെ ഒന്നിലധികം കക്ഷികളെ സ്വാഭാവിക മലയാള ബഹുവചനത്തിലൂടെ സൂചിപ്പിച്ചു; സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആലങ്കാരിക ചോദ്യത്തിന്റെ ശാസനാത്മക ശക്തി നിലനിർത്തി; നിയമസന്ദർഭത്തിന് ‘തീർപ്പുകൽപ്പിക്കുക’ ഉപയോഗിച്ചു.
