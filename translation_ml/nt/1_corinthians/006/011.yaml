  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: ml
  text: നിങ്ങളിൽ ചിലർ അങ്ങനെയുള്ളവരായിരുന്നു. എന്നാൽ നിങ്ങൾ കഴുകപ്പെട്ടു[a]; എന്നാൽ നിങ്ങൾ വിശുദ്ധീകരിക്കപ്പെട്ടു; എന്നാൽ നിങ്ങൾ നീതീകരിക്കപ്പെട്ടു—കർത്താവായ യേശുവിന്റെ നാമത്തിലും നമ്മുടെ ദൈവത്തിന്റെ ആത്മാവിലും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾ കഴുകപ്പെട്ടു’ എന്നതിനുള്ള ഗ്രീക്കുരൂപം ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ കഴുകി’ എന്നും മനസ്സിലാക്കാം. എന്നാൽ സന്ദർഭത്തിൽ പലരും ഇതിനെ ദൈവത്തിന്റെ രക്ഷാകരമായ പ്രവർത്തനങ്ങളുടെ നിരയിലെ ഭാഗമായി ഗ്രഹിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘നാമത്താൽ ... ആത്മാവിനാൽ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിലെ ἐν എന്ന പദം പ്രവർത്തനമാധ്യമത്തെയോ പ്രവർത്തനമേഖലയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: നിങ്ങളിൽ ചിലർ അങ്ങനെയുള്ളവരായിരുന്നു
  rationale: മുൻവാക്യത്തിലെ ദുഷ്പ്രവൃത്തിക്കാരുടെ വിഭാഗങ്ങളിലേക്കുള്ള ταῦτα എന്ന പദത്തിന്റെ സൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻകാല അവസ്ഥയും തുടർന്നുള്ള രക്ഷാകരമായ മാറ്റങ്ങളും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുകയും മൂന്നു പ്രാവശ്യത്തെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπελούσασθε
  choice: നിങ്ങൾ കഴുകപ്പെട്ടു
  rationale: മധ്യമവാചകരൂപം സ്വയം കഴുകി എന്ന അർഥത്തിനും ഇടനൽകുന്നുവെങ്കിലും, തുടർന്നുള്ള രണ്ട് കർമണിപ്രയോഗങ്ങളോടൊപ്പമുള്ള ദൈവിക രക്ഷാപ്രവർത്തനങ്ങളുടെ നിരയായി വായിക്കാവുന്ന അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു.
- source_word: ἡγιάσθητε
  choice: നിങ്ങൾ വിശുദ്ധീകരിക്കപ്പെട്ടു
  rationale: ദൈവത്തിന്നായി വിശുദ്ധരാക്കപ്പെടുക എന്ന പൗലോസിന്റെ ആശയം കൃത്യവും പരിചിതവുമായ ദൈവശാസ്ത്രപദത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐδικαιώθητε
  choice: നിങ്ങൾ നീതീകരിക്കപ്പെട്ടു
  rationale: δικαιόω എന്ന ക്രിയയുടെ ന്യായവിധി-ബന്ധിതമായ പൗലോസീയ അർഥവും മലയാള ബൈബിൾഭാഷയിലെ പരിചിതമായ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: കർത്താവായ യേശുവിന്റെ നാമത്തിൽ
  rationale: ἐν എന്നതിലെ മേഖല, അധികാരം, ഉപാധി എന്നീ സാധ്യതകൾ അനാവശ്യമായി ചുരുക്കാതെ സ്വാഭാവികമായ പ്രയോഗം നൽകുന്നു.
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: നമ്മുടെ ദൈവത്തിന്റെ ആത്മാവിൽ
  rationale: മൂലത്തിലെ ἐν നിലനിർത്തി പ്രവർത്തനമാധ്യമമോ പ്രവർത്തനമേഖലയോ എന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു; ഇവിടെ πνεῦμα പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി മനസ്സിലാക്കാം.
theological_decisions:
- issue: ἀπελούσασθε എന്നതിലെ വാച്യവും പ്രവർത്തകത്വവും
  choice: കർമണിസദൃശമായി ‘നിങ്ങൾ കഴുകപ്പെട്ടു’
  alternative: ‘നിങ്ങൾ നിങ്ങളെത്തന്നെ കഴുകി’
  rationale: മധ്യമവാചകരൂപം പ്രത്യാവർത്തക അർഥം അനുവദിക്കുന്നു. എന്നാൽ ‘വിശുദ്ധീകരിക്കപ്പെട്ടു’, ‘നീതീകരിക്കപ്പെട്ടു’ എന്നീ തുടർന്നുള്ള കർമണിക്രിയകളോടൊപ്പം ദൈവത്തിന്റെ രക്ഷാപ്രവർത്തനമായി ഗ്രഹിക്കപ്പെടുന്ന സാധ്യത ശക്തമായതിനാൽ മുഖ്യപാഠത്തിൽ കർമണിപ്രയോഗം നൽകി, മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐν എന്നതിന്റെ അർഥം
  choice: ‘നാമത്തിലും ... ആത്മാവിലും’ എന്ന ഔപചാരിക രൂപം
  alternative: ‘നാമത്താൽ ... ആത്മാവിനാൽ’ എന്ന കരണാർഥം
  rationale: ഗ്രീക്കിലെ ἐν പ്രവർത്തനമാധ്യമത്തെയോ മേഖലയെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു; കരണാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πνεύματι എന്നതിന്റെ സൂചിതൻ
  choice: ദൈവത്തിന്റെ ആത്മാവ്, അഥവാ പരിശുദ്ധാത്മാവ്
  alternative: പൊതുവായ ഒരു ആത്മീയ മേഖല
  rationale: ‘നമ്മുടെ ദൈവത്തിന്റെ ആത്മാവ്’ എന്ന പൗലോസീയ പ്രയോഗം പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; വിവർത്തനം ‘പരിശുദ്ധ’ എന്ന പദം കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശുദ്ധീകരിക്കപ്പെട്ടു’, ‘നീതീകരിക്കപ്പെട്ടു’ എന്നീ പരിചിത ദൈവശാസ്ത്രപദങ്ങൾ കൃത്യതയ്ക്കായി നിലനിർത്തി; ἀλλάയുടെ മൂന്നു പ്രാവശ്യത്തെ ആവർത്തനം പൗലോസിന്റെ ഊന്നലും വാക്ചാതുര്യവും സംരക്ഷിക്കാൻ ആവർത്തിച്ചു.
