id: 1CO.6.17
reference: 1 Corinthians 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ κολλώμενος τῷ κυρίῳ ἓν πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/017.yaml
  text: But the one who joins himself to the Lord is one spirit with him[a][b][c].
translation:
  language: ml
  text: എന്നാൽ കർത്താവിനോടു ചേരുന്നവൻ[a] അവിടുത്തോടൊപ്പം ഏകാത്മാവാണ്[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കർത്താവിനോടു ചേർക്കപ്പെട്ടവൻ.’ ഗ്രീക്ക് ക്രിയയെ ‘ചേരുന്നവൻ’ എന്ന മധ്യാർഥത്തിലോ ‘ചേർക്കപ്പെട്ടവൻ’ എന്ന കർമണിസദൃശമായ അർഥത്തിലോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഏകാത്മാവാണ്.’ ‘അവിടുത്തോടൊപ്പം’ എന്നത് ഗ്രീക്കിൽ തുറന്നുപറഞ്ഞിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ആശയമാണ്; വ്യക്തതയ്ക്കായി മലയാളത്തിൽ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ആത്മാവ്’ എന്നത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കാം. എന്നാൽ വിശ്വാസി കർത്താവുമായി ആത്മാവിൽ ഒന്നായിരിക്കുന്നു എന്നതാണ് ഈ പ്രയോഗത്തിന്റെ കൂടുതൽ സ്വാഭാവികമായ അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος
  choice: ചേരുന്നവൻ
  rationale: κολλάομαι അടുത്ത ബന്ധത്തിൽ ചേരുകയോ പറ്റിച്ചേരുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ ശാരീരിക ഐക്യത്തോടുള്ള താരതമ്യം നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന പ്രയോഗമാണിത്.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ ഈ പ്രയോഗത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അധികാരത്തെയും ദൈവശാസ്ത്രപരമായ പ്രാധാന്യത്തെയും നിലനിർത്തുന്ന പതിവായ മലയാളപദമാണ് ‘കർത്താവ്’.
- source_word: ἓν
  choice: ഒരേ
  rationale: ഇവിടെ സംഖ്യാത്മകമായ ‘ഒന്ന്’ ഐക്യത്തെ സൂചിപ്പിക്കുന്നു. ‘അവിടത്തോടൊപ്പം ഒരേ ആത്മാവ്’ എന്ന മലയാളഘടനയിൽ ‘ഒരേ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: വാക്യം വിശ്വാസിയും കർത്താവും തമ്മിലുള്ള യഥാർഥമായ ആത്മീയ ഐക്യത്തെ സൂചിപ്പിക്കുന്നതായി ഏറ്റവും സ്വാഭാവികമായി വായിക്കാം. ഗ്രീക്കിൽ വലിയക്ഷര-ചെറിയക്ഷര വ്യത്യാസം മൂലം ‘Spirit/spirit’ വേർതിരിക്കാനാവാത്തതിനാൽ മറ്റൊരു വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ δὲ ... ἐστιν
  choice: എന്നാൽ ... ചേരുന്നവൻ ... ആണ്
  rationale: ആർട്ടിക്കിളും കൃദന്തരൂപവും ചേർന്ന ഗ്രീക്ക് ഘടനയെ ‘ചേരുന്നവൻ’ എന്നു പ്രതിനിധികമായി പരിഭാഷപ്പെടുത്തി; δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം ‘എന്നാൽ’ നിലനിർത്തുന്നു.
- source_word: implicit relational complement
  choice: അവിടത്തോടൊപ്പം
  rationale: ഗ്രീക്കിൽ ബന്ധത്തിന്റെ മറുപക്ഷം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമായതിനാൽ പറയാതെവിടുന്നു. മലയാളത്തിൽ വാക്യം പൂർണവും വ്യക്തവുമാക്കാൻ കർത്താവിനെ സൂചിപ്പിക്കുന്ന ‘അവിടത്തോടൊപ്പം’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ‘ഒരേ ആത്മാവ്’ എന്ന ഐക്യത്തിന്റെ സ്വഭാവം
  choice: വിശ്വാസിയും കർത്താവും തമ്മിലുള്ള യഥാർഥമായ ആത്മീയ ഐക്യം പ്രകടിപ്പിക്കുന്നു; ഇരുവരുടെയും വ്യത്യസ്തത ഇല്ലാതാക്കുന്നില്ല.
  alternative: അസ്തിത്വപരമായ ലയനം; അല്ലെങ്കിൽ വെറും ഒരേ മനോഭാവമോ ലക്ഷ്യമോ മാത്രം
  rationale: മുൻവാക്യത്തിലെ ശാരീരിക ഐക്യത്തോടു പൗലോസ് ശക്തമായൊരു താരതമ്യം നടത്തുന്നു. അതിനാൽ ഐക്യത്തിന്റെ ശക്തി നിലനിർത്തണം; എന്നാൽ വിശ്വാസിയും കർത്താവും ഒരേ വ്യക്തിയോ സത്തയോ ആകുന്നു എന്ന ധാരണ സൃഷ്ടിക്കരുത്.
- issue: ഗ്രീക്കിൽ പരോക്ഷമായിരിക്കുന്ന ‘അവിടത്തോടൊപ്പം’ ചേർക്കൽ
  choice: വ്യക്തതയ്ക്കായി മുഖ്യവാചകത്തിൽ ചേർക്കുന്നു.
  alternative: ‘ഒരേ ആത്മാവാണ്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക
  rationale: ഐക്യം ആരുമായാണെന്നത് ഗ്രീക്കിൽ സന്ദർഭം വ്യക്തമാക്കുന്നു. മലയാളത്തിൽ ബന്ധം തുറന്നുപറയുന്നത് അർഥം മാറ്റാതെ ആശയം ഉടൻ ഗ്രഹിക്കാൻ സഹായിക്കുന്നു.
- issue: πνεῦμα പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നുവോ എന്ന ചോദ്യം
  choice: മുഖ്യവാചകത്തിൽ ‘ആത്മാവ്’ നിലനിർത്തി, വിശ്വാസിയുടെ കർത്താവുമായുള്ള ആത്മീയ ഐക്യം എന്ന വായനയ്ക്ക് മുൻഗണന നൽകുന്നു.
  alternative: ‘പരിശുദ്ധാത്മാവ്’ എന്ന അർഥത്തിൽ വായിക്കുക
  rationale: ഗ്രീക്ക് ലിപി ഈ വ്യത്യാസം നിർണ്ണയിക്കുന്നില്ല. സന്ദർഭത്തിൽ ‘ഒരേ ആത്മാവ്’ എന്നത് വിശ്വാസിയും കർത്താവും തമ്മിലുള്ള ഐക്യം എന്നു വായിക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം; എന്നിരുന്നാലും മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അവിടത്തോടൊപ്പം’ കർത്താവിനെ ആദരപൂർവം സൂചിപ്പിക്കുകയും ബന്ധത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു. സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ ഒഴിവാക്കി മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ശക്തമായ ഐക്യഭാഷയും നിലനിർത്തി.
