reference: 1 Corinthians 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: ml
  text: ലൈംഗിക അധാർമികതയിൽനിന്ന് ഓടിപ്പോകുവിൻ. ഒരു മനുഷ്യൻ ചെയ്തേക്കാവുന്ന ഏതു പാപവും ശരീരത്തിനു പുറത്താണ്[a]; എന്നാൽ ലൈംഗിക അധാർമികത ചെയ്യുന്നവൻ സ്വന്തം ശരീരത്തിനെതിരേ പാപം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു മനുഷ്യൻ’ എന്നത് ഇവിടെ സ്ത്രീപുരുഷഭേദമില്ലാതെ ഏതൊരു മനുഷ്യനെയും പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: φεύγετε
  choice: ഓടിപ്പോകുവിൻ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞയുടെ അടിയന്തരവും തുടർച്ചയുള്ളതുമായ അകന്നുനിൽക്കൽ സ്വാഭാവികമായ മലയാളത്തിൽ ശക്തമായി അറിയിക്കുന്നു.
- source_word: πορνείαν
  choice: ലൈംഗിക അധാർമികത
  rationale: വിവാഹപൂർവ ലൈംഗികബന്ധത്തിൽ മാത്രം ഒതുങ്ങാതെ, നിയമവിരുദ്ധമോ ധാർമികമായി തെറ്റായതോ ആയ ലൈംഗിക പെരുമാറ്റത്തിന്റെ വിശാല അർഥം നിലനിർത്തുന്നു.
- source_word: πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: ഒരു മനുഷ്യൻ ചെയ്യുന്ന മറ്റെല്ലാ പാപവും
  rationale: ἄνθρωπος എന്ന ഏകവചനത്തിന്റെ പ്രതിനിധാനപരമായ പൊതുവായ അർഥം ‘ഒരു മനുഷ്യൻ’ എന്നു നിലനിർത്തുന്നു. മലയാളത്തിൽ പ്രസ്താവനയുടെ താരതമ്യഭാവം വ്യക്തമാക്കാൻ πᾶν എന്നത് ‘മറ്റെല്ലാ’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: ശരീരത്തിനു പുറത്താണ്
  rationale: ഗ്രീക്കിലെ സ്ഥലസംബന്ധിയായ രൂപകപ്രയോഗവും അടുത്ത ഉപവാക്യത്തോടുള്ള വൈരുധ്യവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ὁ δὲ πορνεύων
  choice: എന്നാൽ ലൈംഗിക അധാർമികത ചെയ്യുന്നവൻ
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ പ്രവൃത്തിസൂചന നിലനിർത്തുകയും ആദ്യ ആജ്ഞയിലെ പദവുമായി ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: സ്വന്തം ശരീരത്തിനെതിരേ പാപം ചെയ്യുന്നു
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യദിശാസൂചന ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘എതിരേ’ എന്ന മലയാളപ്രയോഗത്തിലൂടെ നൽകുന്നു; ἴδιον എന്നതിന്റെ ആത്മബന്ധ ഊന്നൽ ‘സ്വന്തം’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἄνθρωπος എന്ന പദത്തിന്റെ പൊതുവായ പ്രതിനിധാനാർഥം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി / ആരെങ്കിലും
  rationale: ഗ്രീക്കിലെ ഏകവചന നാമം ഇവിടെ മനുഷ്യരെയെല്ലാം പ്രതിനിധീകരിക്കുന്നു. ‘ഒരു മനുഷ്യൻ’ രൂപം നിലനിർത്തി അതിന്റെ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ‘എല്ലാ പാപവും ശരീരത്തിനു പുറത്താണ്’ എന്ന പ്രസ്താവനയുടെ വ്യാഖ്യാനപരമായ സംഘർഷം
  choice: പ്രസ്താവനയെ നേരിട്ട് പരിഭാഷപ്പെടുത്തി അതിന്റെ സംഘർഷം നിലനിർത്തുക
  alternative: കൊരിന്ത്യരുടെ മുദ്രാവാക്യമായി ഉദ്ധരണിചിഹ്നങ്ങളിൽ നൽകുക, അല്ലെങ്കിൽ വ്യാഖ്യാനപരമായ യോഗ്യത ചേർക്കുക
  rationale: ഗ്രീക്ക് വാചകം പ്രസ്താവനയെ നേരിട്ടാണ് അവതരിപ്പിക്കുന്നത്. അതിനെ ഒരു മുദ്രാവാക്യമെന്നോ പരമപ്രസ്താവനയ്ക്ക് വിശദീകരണം ആവശ്യമെന്നോ മുഖ്യപാഠത്തിൽ തീരുമാനിക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘ലൈംഗിക അധാർമികത’ എന്നത് വ്യാപകവും സഭാവിഭാഗനിരപേക്ഷവുമായ പദമായി ഉപയോഗിച്ചു; ദുഷ്കരമായ ‘ശരീരത്തിനു പുറത്താണ്’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിച്ചില്ല.
