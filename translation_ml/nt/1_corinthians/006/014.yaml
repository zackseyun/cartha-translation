id: 1CO.6.14
reference: 1 Corinthians 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: ml
  text: ദൈവം കർത്താവിനെ ഉയിർപ്പിച്ചു; തന്റെ ശക്തിയാൽ നമ്മെയും ഉയിർപ്പിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല; വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്തി
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മുൻവാദം തുടരുന്ന മൃദുവായ ബന്ധകമാണ്. മലയാളത്തിൽ ‘എന്നാൽ’ എന്നു ചേർത്താൽ അനാവശ്യമായ വിരോധഭാവം വരാം; ‘കൂടാതെ’ എന്നും ചേർക്കേണ്ടതില്ല.
- source_word: θεὸς
  choice: ദൈവം
  rationale: θεός എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപരിഭാഷ; ഉയിർപ്പിക്കുന്ന പ്രവൃത്തിയുടെ വ്യക്തമായ കർത്താവാണ് ദൈവം.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: κύριος ഇവിടെ യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരാണ്; ‘കർത്താവ്’ അതിന്റെ മാന്യവും സ്ഥാപിതവുമായ മലയാളരൂപമാണ്.
- source_word: ἤγειρεν
  choice: ഉയിർപ്പിച്ചു
  rationale: ἐγείρωയുടെ ഭൂതകാലരൂപം ദൈവം യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ച സംഭവത്തെ സൂചിപ്പിക്കുന്നു. ‘ഉയിർപ്പിച്ചു’ പുനരുത്ഥാനാർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἡμᾶς
  choice: നമ്മെയും
  rationale: ഒന്നാംപുരുഷ ബഹുവചന കർമത്തെ സ്വാഭാവികമായി നൽകുന്നു; καί സൂചിപ്പിക്കുന്ന സമാന്തരത ‘-യും’ വഴി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐξεγερεῖ
  choice: ഉയിർപ്പിക്കും
  rationale: ἐξεγείρωയുടെ ഭാവികാലം വിശ്വാസികളുടെ ഭാവി ഉയിർപ്പിനെ സൂചിപ്പിക്കുന്നു. മുൻപത്തെ ἤγειρεν എന്ന ക്രിയയോടുള്ള സമാന്തരത ഒരേ മലയാളമൂലം ഉപയോഗിച്ച് നിലനിർത്തുന്നു.
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: തന്റെ ശക്തിയാൽ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുന്നു. ‘തന്റെ’ എന്നത് വാക്യത്തിലെ കർത്താവായ ദൈവത്തിലേക്കുള്ള പരാമർശം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കുന്നു.
theological_decisions:
- issue: ഭാവികാല ക്രിയയിലെ ഉയിർപ്പിന്റെ സ്വഭാവം
  choice: വിശ്വാസികളുടെ ഭാവിയിലെ ദേഹപരമായ പുനരുത്ഥാനം സൂചിപ്പിക്കുന്ന ‘നമ്മെയും ഉയിർപ്പിക്കും’
  alternative: പൊതുവായ ദൈവിക നീതീകരണം, അല്ലെങ്കിൽ ആലങ്കാരികമായ ആത്മീയ ഉയിർപ്പ്
  rationale: അടുത്ത സന്ദർഭം ശരീരത്തെക്കുറിച്ചാണ് (6:13–20); ‘കർത്താവിനെ ഉയിർപ്പിച്ചു’ എന്ന ചരിത്രപരമായ പുനരുത്ഥാനത്തോടുള്ള നേരിട്ടുള്ള സമാന്തരതയും വിശ്വാസികളുടെ യഥാർഥ ഭാവി പുനരുത്ഥാനത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും പരിഭാഷ വ്യാഖ്യാനവിസ്താരം ചേർക്കാതെ മൂലവാചകത്തിന്റെ സംക്ഷിപ്തത പാലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഉത്ഥാനപ്പെടുത്തി’ പോലുള്ള ഭാരമേറിയ രൂപത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘ഉയിർപ്പിച്ചു/ഉയിർപ്പിക്കും’ ഉപയോഗിച്ചു. δέ-യ്ക്ക് പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹം പാലിച്ചു; അർദ്ധവിരാമം ഭൂതകാല പ്രവൃത്തിയും ഭാവിവാഗ്ദാനവും തമ്മിലുള്ള സമാന്തരത വ്യക്തമാക്കുന്നു.
