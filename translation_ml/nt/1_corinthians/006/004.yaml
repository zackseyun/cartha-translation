id: 1CO.6.4
reference: 1 Corinthians 6:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: ml
  text: അതിനാൽ, ഈ ജീവിതവുമായി ബന്ധപ്പെട്ട ന്യായവ്യവഹാരങ്ങൾ നിങ്ങൾക്കുണ്ടെങ്കിൽ[a], സഭയിൽ നിസ്സാരരായി കണക്കാക്കപ്പെടുന്നവരെയാണോ[b] നിങ്ങൾ ന്യായാധിപന്മാരായി നിയമിക്കുന്നത്?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈനംദിന ജീവിതത്തിലെ കാര്യങ്ങൾ.’ ഗ്രീക്ക് പദം സാധാരണ ഭൗമികമോ പൗരസംബന്ധമോ ആയ കാര്യങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സഭയിൽ നിന്ദിക്കപ്പെടുന്നവരെ.’ സഭയ്ക്കുള്ളിൽ നിസ്സാരരായി കണക്കാക്കപ്പെടുന്നവരെയോ സഭയുടെ കാഴ്ചപ്പാടിൽ സ്ഥാനമില്ലാത്തവരെയോ ഈ ഗ്രീക്ക് പ്രയോഗം പരിഹാസത്തോടെ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: 'ചിലർ ഈ വാക്യഭാഗം പരിഹാസാത്മകമായ ഒരു കല്പനയായി മനസ്സിലാക്കുന്നു: ‘സഭയിൽ നിസ്സാരരായി കണക്കാക്കപ്പെടുന്നവരെ ന്യായാധിപന്മാരായി നിയമിക്കുവിൻ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: ഈ ജീവിതത്തിലെ കാര്യങ്ങളുമായി ബന്ധപ്പെട്ട
  rationale: സാധാരണ ഭൗമിക, ദൈനംദിന, പൗരകാര്യങ്ങളെയാണ് ഈ വിശേഷണം സൂചിപ്പിക്കുന്നത്. ധാർമികമായി ദുഷിച്ച ‘ലൗകിക’ കാര്യങ്ങൾ എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കിക്കൊണ്ട് ഗ്രീക്കിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: κριτήρια
  choice: കേസുകൾ
  rationale: ഈ പദത്തിന് ന്യായാസനങ്ങളെയോ ന്യായവ്യവഹാരങ്ങളെയോ സൂചിപ്പിക്കാം. ἐὰν ἔχητε എന്ന പ്രയോഗത്തോടൊപ്പം ‘കേസുകൾ നിങ്ങൾക്കുണ്ടെങ്കിൽ’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും സന്ദർഭത്തിലെ തർക്കവിഷയങ്ങളെ വ്യക്തമായി സൂചിപ്പിക്കുന്നതുമാണ്.
- source_word: ἐὰν ἔχητε
  choice: നിങ്ങൾക്കുണ്ടെങ്കിൽ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാപക പ്രയോഗം നേരായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τοὺς ἐξουθενημένους
  choice: യാതൊരു സ്ഥാനവുമില്ലാത്തവരായി കണക്കാക്കപ്പെടുന്നവരെ
  rationale: അവഗണിക്കപ്പെടുന്നവർ, നിസ്സാരരായി കരുതപ്പെടുന്നവർ, അംഗീകൃത സ്ഥാനമില്ലാത്തവർ എന്നീ സാധ്യതകൾ ഈ പങ്കാളിത്തരൂപത്തിനുണ്ട്. തിരഞ്ഞെടുത്ത ഭാഷ സാമൂഹികവും ന്യായപരവുമായ ധ്വനി നിലനിർത്തുകയും അവർ സഭയ്ക്കുള്ളിലുള്ളവരോ പുറത്തുള്ളവരോ എന്നത് നിർബന്ധമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: സഭയിൽ
  rationale: സഭാസമൂഹത്തിനുള്ളിലോ സഭയുടെ വിലയിരുത്തലിലോ എന്ന രണ്ടുവിധ ധ്വനികൾക്കും ഇടം നൽകുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: τούτους καθίζετε
  choice: നിങ്ങൾ ന്യായാധിപന്മാരായി നിയമിക്കുന്നത്
  rationale: καθίζω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘ഇരുത്തുക’ എന്നാണെങ്കിലും ന്യായവ്യവഹാരസന്ദർഭത്തിൽ വിധിനിർണയത്തിനായി ഒരാളെ ഇരുത്തുകയോ നിയമിക്കുകയോ ചെയ്യുക എന്നാണ്. മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി പറയാൻ ‘ന്യായാധിപന്മാരായി നിയമിക്കുക’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: വാക്യം ആക്ഷേപാത്മക ചോദ്യമാണോ പരിഹാസാത്മക കല്പനയാണോ, ‘അവഗണിക്കപ്പെട്ടവർ’ ആരാണ് എന്നതും
  choice: ‘നിങ്ങൾ ... നിയമിക്കുന്നത്?’ എന്ന ആക്ഷേപാത്മക ചോദ്യമായി പരിഭാഷപ്പെടുത്തി; ‘സഭയിൽ യാതൊരു സ്ഥാനവുമില്ലാത്തവരായി കണക്കാക്കപ്പെടുന്നവർ’ എന്ന ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘സഭയിൽ വിലകൽപ്പിക്കപ്പെടാത്തവരെ ന്യായാധിപന്മാരായി നിയമിക്കുവിൻ’ എന്ന പരിഹാസാത്മക കല്പനയായി വായിക്കാം; പ്രസ്തുത ആളുകളെ സഭയ്ക്കു പുറത്തുള്ള ലൗകിക ന്യായാധിപന്മാരായി മാത്രവും വ്യാഖ്യാനിക്കാം.
  rationale: ഗ്രീക്ക് വാക്യഘടന ദുഷ്കരമായതിനാൽ ചോദ്യവും കല്പനയും സാധ്യമാണ്. SBLGNT-യിലെ ചോദ്യചിഹ്നവും 6:1–6-ലെ ശാസനാഭാവവും ചോദ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എന്നാൽ അടിക്കുറിപ്പിൽ കല്പനാവായനയും വ്യക്തികളുടെ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്ഥാനമില്ലാത്തവർ’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; അതേസമയം ഗ്രീക്കിലെ സാമൂഹിക അവഗണനയും സഭയുമായുള്ള ബന്ധത്തിലെ ഉദ്ദേശ്യപൂർവമായ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു. ചോദ്യരൂപം പൗലോസിന്റെ ശാസനാഭാവം പ്രകടമാക്കുന്നു.
