revisions:
- from: അതിനാൽ, ഈ ജീവിതത്തിലെ കാര്യങ്ങളുമായി ബന്ധപ്പെട്ട കേസുകൾ നിങ്ങൾക്കുണ്ടെങ്കിൽ[a], സഭയിൽ യാതൊരു സ്ഥാനവുമില്ലാത്തവരായി കണക്കാക്കപ്പെടുന്നവരെയാണോ[b] നിങ്ങൾ ന്യായാധിപന്മാരായി നിയമിക്കുന്നത്?[c]
  to: അതിനാൽ, ഈ ജീവിതവുമായി ബന്ധപ്പെട്ട ന്യായവ്യവഹാരങ്ങൾ നിങ്ങൾക്കുണ്ടെങ്കിൽ[a], സഭയിൽ നിസ്സാരരായി കണക്കാക്കപ്പെടുന്നവരെയാണോ[b] നിങ്ങൾ ന്യായാധിപന്മാരായി നിയമിക്കുന്നത്?[c]
  rationale: The revision makes κριτήρια explicit as judicial disputes/proceedings, avoiding the redundant and less precise ‘cases related to matters.’ It also streamlines the description of the despised while retaining the Greek phrase’s social force and its deliberate ambiguity concerning their relation to the church. The interrogative form, judicial appointment language, and all three footnote anchors are retained.
