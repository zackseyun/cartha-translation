id: 1CO.6.20
reference: 1 Corinthians 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: ml
  text: കാരണം, നിങ്ങളെ വില കൊടുത്ത് വാങ്ങിയിരിക്കുന്നു.[a] അതുകൊണ്ട്[b] നിങ്ങളുടെ ശരീരത്തിൽ ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘നിങ്ങളെ ഒരു വിലയ്ക്ക് വാങ്ങിയിരിക്കുന്നു.’ ഗ്രീക്കിൽ, വാങ്ങുന്നതിനുള്ള വില നൽകപ്പെട്ടുവെന്ന രൂപകം നിലനിൽക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ‘അതുകൊണ്ട്’ എന്നതിന് ‘അതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; δή എന്ന കണം ആജ്ഞയ്ക്ക് നിഗമനപരമായ ഊന്നലും അടിയന്തരതയും നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: നിങ്ങളെ … വാങ്ങിയതാണ്
  rationale: ἀγοράζω എന്ന ക്രിയയുടെ അരിസ്റ്റ് കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന ‘വാങ്ങപ്പെട്ടു’ എന്ന അർഥവും വാങ്ങൽ എന്ന രൂപകവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: ആണല്ലോ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിനുള്ള കാരണം γάρ നൽകുന്നു. മലയാളത്തിലെ ‘ആണല്ലോ’ ഈ വിശദീകരണബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τιμῆς
  choice: വില കൊടുത്തു
  rationale: വാങ്ങുന്നതിനായി വില നൽകപ്പെട്ടുവെന്ന ജനിറ്റീവ് ഓഫ് പ്രൈസ് ആശയം വ്യക്തമായി നൽകുകയും വാണിജ്യരൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δοξάσατε
  choice: മഹത്ത്വപ്പെടുത്തുക
  rationale: δοξάζω എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്ന, നിർണായക പ്രവർത്തനത്തിനുള്ള അരിസ്റ്റ് ആജ്ഞാരൂപത്തിന് യോജിച്ച പ്രയോഗമാണിത്.
- source_word: δὴ
  choice: അതുകൊണ്ട്
  rationale: δή ആജ്ഞയ്ക്ക് നൽകുന്ന നിഗമനപരവും ഊന്നലോടുകൂടിയതുമായ ഭാവം ‘അതുകൊണ്ട്’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: നിങ്ങളുടെ ശരീരത്തിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥലപരവും ഉപകരണപരവുമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ, ഏകവചനമായ σῶμαയും ബഹുവചനമായ ὑμῶνയും ഉറവിടത്തോട് അടുത്ത് നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിലകൊടുത്തുള്ള വാങ്ങലിന്റെ രൂപകം
  choice: ‘വില കൊടുത്തു വാങ്ങി’ എന്ന വാങ്ങൽരൂപകം നിലനിർത്തി
  alternative: ‘വില നൽകി വീണ്ടെടുത്തു’
  rationale: പൗലോസ് ഇവിടെ ഉപയോഗിക്കുന്നത് വ്യക്തമായ വിപണനഭാഷയാണ്. ‘വീണ്ടെടുത്തു’ എന്നു വ്യാഖ്യാനപരമായി ചുരുക്കാതെ മൂലരൂപകം നിലനിർത്തുന്നത് വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- issue: ശരീരവുമായി ബന്ധപ്പെട്ട ധാർമികത
  choice: σῶμα എന്നത് വ്യക്തമായി ‘ശരീരം’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘നിങ്ങളുടെ ജീവിതം’ അല്ലെങ്കിൽ ‘നിങ്ങളെത്തന്നെ’
  rationale: സമീപസന്ദർഭം ശരീരത്തിലൂടെയുള്ള ലൈംഗിക പെരുമാറ്റത്തെക്കുറിച്ചായതിനാൽ, ‘ശരീരം’ എന്ന മൂർത്തമായ പദം പൗലോസിന്റെ വാദം കൃത്യമായി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വില കൊടുത്തു വാങ്ങുക’ എന്ന സാധാരണ പ്രയോഗം മൂലത്തിലെ വാണിജ്യരൂപകം വ്യക്തമാക്കുന്നു; ‘മഹത്ത്വപ്പെടുത്തുക’ തിരുവെഴുത്തുപരമായ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുന്നു.
