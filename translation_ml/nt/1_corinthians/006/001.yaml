id: 1CO.6.1
reference: 1 Corinthians 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/001.yaml
  text: Does any one of you dare[a], when he has a case against another[b], to be judged before the unrighteous and not before the saints?
translation:
  language: ml
  text: നിങ്ങളിൽ ഒരാൾക്ക് മറ്റൊരാൾക്കെതിരെ ഒരു വ്യവഹാരം ഉണ്ടായിരിക്കെ, വിശുദ്ധന്മാരുടെ[b] മുമ്പാകെയല്ല, നീതികെട്ടവരുടെ[a] മുമ്പാകെ വിധി തേടാൻ ധൈര്യപ്പെടുന്നുവോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അനീതിയുള്ളവരുടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ചില പരിഭാഷകൾ വ്യാഖ്യാനപരമായി ‘അവിശ്വാസികളുടെ’ എന്നു നൽകുന്നു; എന്നാൽ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നീതികെട്ടവർ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘വിശുദ്ധന്മാർ’ എന്നത് ദൈവത്തിന്റെ വിശുദ്ധജനത്തെ, അതായത് വിശ്വാസികളെ, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: ധൈര്യപ്പെടുന്നുവോ
  rationale: പൗലോസിന്റെ ആക്ഷേപസ്വരമുള്ള അലങ്കാരചോദ്യവും, സന്ദർഭത്തിൽ അതിരുകടന്ന ധൈര്യം സൂചിപ്പിക്കുന്ന τολμάω എന്ന ക്രിയയുടെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: τις ὑμῶν
  choice: നിങ്ങളിൽ ഒരാൾ
  rationale: അനിശ്ചിത ഏകവചനമായ τις-ഉം ഭാഗികബന്ധം സൂചിപ്പിക്കുന്ന ὑμῶν-ഉം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ടുള്ള അഭിസംബോധനയോടെ നൽകുന്നു.
- source_word: πρᾶγμα ἔχων
  choice: ഒരു വ്യവഹാരം ഉണ്ടായിരിക്കെ
  rationale: നിയമപരമായ സന്ദർഭത്തിലെ ‘കാര്യം/തർക്കം/കേസ്’ എന്ന അർഥം ‘വ്യവഹാരം’ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ കൃതന്തഘടന ‘ഉണ്ടായിരിക്കെ’ എന്നു സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πρὸς τὸν ἕτερον
  choice: മറ്റൊരാൾക്കെതിരെ
  rationale: തർക്കമോ നിയമനടപടിയോ ഉള്ള സന്ദർഭത്തിൽ πρός സൂചിപ്പിക്കുന്ന പ്രതിപക്ഷബന്ധം കൃത്യമായി നൽകുന്നു; ἕτερον പൊതുവായ ‘മറ്റൊരാൾ’ ആയി നിലനിർത്തുന്നു.
- source_word: κρίνεσθαι
  choice: വിധി തേടാൻ
  rationale: ഇവിടെ കോടതി/ന്യായനിർണയത്തിന്റെ മുമ്പാകെ കേസ് കൊണ്ടുപോകുക എന്ന മധ്യ-നിഷ്ക്രിയ ക്രിയയുടെ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിധിക്കപ്പെടാൻ’ എന്ന അക്ഷരാർഥരൂപത്തേക്കാൾ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: ἐπὶ τῶν ἀδίκων
  choice: നീതികെട്ടവരുടെ മുമ്പാകെ
  rationale: ἀδίκων എന്നതിലെ നൈതിക-ദൈവശാസ്ത്രപരമായ വിലയിരുത്തൽ ‘അവിശ്വാസികൾ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; ന്യായവ്യവഹാരസന്ദർഭത്തിലെ ἐπί ‘മുമ്പാകെ’ എന്നു നൽകുന്നു.
- source_word: καὶ οὐχὶ
  choice: അല്ല
  rationale: മലയാളത്തിലെ ‘X-ന്റെ മുമ്പാകെയല്ല, Y-യുടെ മുമ്പാകെ’ എന്ന സ്വാഭാവിക വിരുദ്ധഘടനയിലൂടെ ഗ്രീക്കിലെ ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῶν ἁγίων
  choice: വിശുദ്ധന്മാരുടെ മുമ്പാകെ
  rationale: ἅγιοι എന്ന പൗലോസിന്റെ പതിവ് സമൂഹനാമം വ്യാഖ്യാനിച്ച് മാറ്റാതെ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗതവും മനസ്സിലാകുന്നതുമായ പദത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀδίκων എന്നതും ἁγίων എന്നതും തമ്മിലുള്ള വൈരുധ്യം
  choice: നീതികെട്ടവർ ... വിശുദ്ധന്മാർ
  alternative: അവിശ്വാസികൾ ... വിശ്വാസികൾ
  rationale: സന്ദർഭത്തിൽ ക്രൈസ്തവസമൂഹത്തിന് പുറത്തുള്ള ന്യായാധിപന്മാർ ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും, ഗ്രീക്ക് ഉപയോഗിക്കുന്ന നൈതിക-ദൈവശാസ്ത്രപരമായ പദങ്ങൾ തന്നെയാണ് പരിഭാഷ നിലനിർത്തുന്നത്; സൂചനയെ വ്യാഖ്യാനമായി തീർപ്പാക്കുന്നില്ല.
- issue: ἔχων എന്ന പുല്ലിംഗ ഏകവചന കൃതന്തത്തിന്റെ പ്രതിനിധിക സ്വഭാവം
  choice: നിങ്ങളിൽ ഒരാൾക്ക് ... ഉണ്ടായിരിക്കെ
  alternative: നിങ്ങളിൽ ആർക്കെങ്കിലും ... ഉണ്ടെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിയെ നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അനാവശ്യമായ ലിംഗസൂചക സർവനാമം ചേർക്കാതെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- issue: κρίνεσθαι എന്ന മധ്യ/നിഷ്ക്രിയ രൂപത്തിന്റെ നിയമപരമായ അർഥം
  choice: വിധി തേടാൻ
  alternative: വിധിക്കപ്പെടാൻ
  rationale: രൂപപരമായ നിഷ്ക്രിയത മാത്രം മുൻനിർത്താതെ, ഒരാളുടെ വ്യവഹാരം ഒരു ന്യായവേദിയുടെ മുമ്പാകെ കൊണ്ടുപോകുന്നതെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ആരുടെ പക്ഷം ശരിയെന്നോ വിധി എന്തെന്നോ പരിഭാഷ നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘കേസ്’ എന്ന ഇംഗ്ലീഷ് വായ്പാപദത്തിന് പകരം നിയമപരമായ അർഥമുള്ള ‘വ്യവഹാരം’ ഉപയോഗിച്ചു. മലയാളത്തിലെ സ്വാഭാവിക വിരുദ്ധഘടനയ്ക്കായി ഗ്രീക്കിലെ അവസാന രണ്ട് ഘടകങ്ങളുടെ ക്രമം മാറ്റിയെങ്കിലും ആശയവൈരുധ്യം പൂർണമായി നിലനിർത്തി.
