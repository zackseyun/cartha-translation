  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς ἀδικεῖτε καὶ ἀποστερεῖτε, καὶ ⸀τοῦτο ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/008.yaml
  text: But you yourselves do wrong and defraud—and this to your brothers[a].
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ തന്നെ അന്യായം ചെയ്യുകയും വഞ്ചിച്ച് അപഹരിക്കുകയും ചെയ്യുന്നു—അതും നിങ്ങളുടെ സഹോദരന്മാരോടു തന്നെ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ സഹോദരന്മാരോടും സഹോദരിമാരോടും”; ഇവിടെ “സഹോദരന്മാർ” എന്ന ഗ്രീക്ക് പദം സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: ഗ്രീക്കിൽ സർവനാമം പ്രത്യേകം നൽകിയിരിക്കുന്നതിനാൽ കൊരിന്ത്യരുടെ സ്വന്തം പ്രവൃത്തിയിലേക്കുള്ള ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ἀδικεῖτε
  choice: അന്യായം ചെയ്യുന്നു
  rationale: മറ്റൊരാളോട് തെറ്റോ അനീതിയോ പ്രവർത്തിക്കുക എന്ന വിശാലമായ ധാർമ്മിക അർഥം അനാവശ്യമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: ἀποστερεῖτε
  choice: വഞ്ചിക്കുന്നു
  rationale: ഒരാൾക്കു ലഭിക്കേണ്ടത് വഞ്ചനയിലൂടെ നിഷേധിക്കുകയോ അപഹരിക്കുകയോ ചെയ്യുക എന്ന ആശയം സന്ദർഭോചിതവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: καὶ τοῦτο
  choice: —അതും
  rationale: കുറ്റത്തിന്റെ ഗൗരവം വർധിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വാചാടോപപരമായ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἀδελφούς
  choice: സഹോദരന്മാരോടുതന്നെ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും, ഇവർ വിശ്വാസസമൂഹത്തിലെ സഹവിശ്വാസികളാണെന്ന ഊന്നൽ ‘തന്നെ’യിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: മിശ്രലിംഗ വിശ്വാസസമൂഹത്തിൽ ἀδελφούς എന്ന പദത്തിന്റെ പരിധി
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ; സഹവിശ്വാസികൾ
  rationale: മൂലപദം വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണെങ്കിലും പൗലോസിന്റെ പ്രയോഗത്തിൽ വിശ്വാസസമൂഹത്തെ വിശാലമായി സൂചിപ്പിക്കാം. അതിനാൽ രൂപസാദൃശ്യം മുഖ്യപാഠത്തിൽ സൂക്ഷിച്ച് ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങൾതന്നെ’യും ‘അതും … തന്നെയും’ ഗ്രീക്ക് വാക്യത്തിലെ ഇരട്ട ഊന്നൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ദീർഘരേഖ വാചാടോപപരമായ തിരിവ് പ്രകടമാക്കുന്നു.
