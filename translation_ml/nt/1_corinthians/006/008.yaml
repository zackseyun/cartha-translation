  verdict: revise
  source_fidelity: The draft correctly preserves the contrast (ἀλλά), the emphatic explicit pronoun, the two coordinated present-tense accusations, and the climactic force of καὶ τοῦτο. However, “വഞ്ചിക്കുന്നു” primarily means ‘deceive’ and does not adequately express ἀποστερεῖτε, namely depriving others of what is due to them. “വഞ്ചിച്ച് അപഹരിക്കുകയും” conveys defrauding/depriving without overstating the term as violent robbery.
  naturalness: 'Spacing should follow standard modern Malayalam practice: “നിങ്ങൾ തന്നെ” and “...ഓടു തന്നെ.” The revised wording is fluent, direct, and retains the rhetorical dash and final emphasis.'
  terminology: “സഹോദരന്മാർ” appropriately reflects the masculine plural ἀδελφούς in the main text. The note should use idiomatic coordinated Malayalam (“സഹോദരന്മാരും സഹോദരിമാരും”), while explaining that the term may refer broadly to fellow believers.
  issues:
  - severity: medium
    issue: “വഞ്ചിക്കുന്നു” is too semantically broad for ἀποστερεῖτε.
    rationale: The Greek denotes defrauding or depriving someone of what is due, not merely misleading them. Adding “അപഹരിക്കുകയും” supplies the deprivation component in natural Malayalam.
  - severity: low
    issue: Several emphatic forms are written without normal word spacing.
    rationale: “നിങ്ങൾതന്നെ” and “സഹോദരന്മാരോടുതന്നെ” are less standard orthographically than “നിങ്ങൾ തന്നെ” and “സഹോദരന്മാരോടു തന്നെ.”
