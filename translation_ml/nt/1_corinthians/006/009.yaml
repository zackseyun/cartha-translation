id: 1CO.6.9
reference: 1 Corinthians 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: ml
  text: 'അല്ലെങ്കിൽ, അനീതിക്കാർ ദൈവരാജ്യം അവകാശമാക്കുകയില്ലെന്ന് നിങ്ങൾക്കറിയില്ലേ? വഞ്ചിക്കപ്പെടരുത്: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവരോ വിഗ്രഹാരാധകരോ വ്യഭിചാരികളോ മൃദുലരോ[a] പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാരോ[b] ദൈവരാജ്യം അവകാശമാക്കുകയില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മൃദുലർ” എന്നു പരിഭാഷപ്പെടുത്തിയ μαλακοί എന്ന പദത്തിന് അക്ഷരാർഥത്തിൽ “മൃദുവായവർ” എന്നാണ്. ഇത് സ്ത്രൈണരായി കണക്കാക്കപ്പെട്ട പുരുഷന്മാരെയോ, ധാർമികമായി ദുർബലരെയോ, ഒരുപക്ഷേ പുരുഷവേശ്യകളെയോ, പുരുഷന്മാർ തമ്മിലുള്ള ലൈംഗികബന്ധത്തിൽ സ്വീകരിക്കുന്ന പങ്കാളിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ἀρσενοκοῖται അപൂർവവും അർഥം വിവാദവിധേയവുമായ പദമാണ്. “പുരുഷന്മാരോടൊപ്പം ശയിക്കുന്ന പുരുഷന്മാർ,” “പുരുഷന്മാരുമായി നിഷിദ്ധമായ ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്നവർ,” അല്ലെങ്കിൽ പരമ്പരാഗതമായി “സോദോമ്യർ” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ലേവ്യപുസ്തകത്തിലെ പദപ്രയോഗവുമായി ഇതിന് ബന്ധമുണ്ടെന്ന് പലരും കരുതുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദത്തെ തുടർന്നുള്ള പൗലോസിന്റെ മൂർച്ചയുള്ള ആലങ്കാരിക ചോദ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἄδικοι
  choice: അനീതിക്കാർ
  rationale: കേവലം ഒറ്റപ്പെട്ട പ്രവൃത്തികളെയല്ല, ധാർമിക വിഭാഗത്തെയും സൂചിപ്പിക്കുന്ന വിശാലമായ പദം.
- source_word: θεοῦ βασιλείαν
  choice: ദൈവരാജ്യം
  rationale: മലയാള ബൈബിൾഭാഷയിൽ സുപരിചിതവും ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിഘടനയ്ക്ക് സുതാര്യവുമായ പ്രയോഗം.
- source_word: κληρονομήσουσιν
  choice: അവകാശമാക്കുകയില്ല
  rationale: അവകാശമായി പ്രാപിക്കുക എന്ന ഉടമ്പടിപരവും അന്ത്യകാലപരവുമായ ധ്വനി നിലനിർത്തുന്നു.
- source_word: μὴ πλανᾶσθε
  choice: വഞ്ചിക്കപ്പെടരുത്
  rationale: രൂപത്തിലെ കർമണിപ്രയോഗവും സ്വയംവഞ്ചന ഉൾപ്പെടാവുന്ന മുന്നറിയിപ്പിന്റെ വിശാലതയും സംരക്ഷിക്കുന്നു.
- source_word: πόρνοι
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവർ
  rationale: പദത്തിന്റെ വിശാലമായ ലൈംഗിക-ധാർമിക അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: εἰδωλολάτραι
  choice: വിഗ്രഹാരാധകർ
  rationale: നേരിട്ടുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ തുല്യപദം.
- source_word: μοιχοὶ
  choice: വ്യഭിചാരികൾ
  rationale: വിവാഹലംഘനത്തെ പ്രത്യേകം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ പരിധി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: μαλακοὶ
  choice: മൃദുലർ
  rationale: അക്ഷരാർഥത്തോട് അടുത്തുനിൽക്കുകയും വിവാദമായ സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു; സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀρσενοκοῖται
  choice: പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാർ
  rationale: ആധുനിക സ്വത്വവിഭാഗങ്ങൾ ചുമത്താതെ പുരുഷൻ-പുരുഷൻ ലൈംഗികപ്രവൃത്തിയെ വിവരണാത്മകമായി സൂചിപ്പിക്കുന്നു; അപൂർവപദത്തിന്റെ വിവാദപരിധി അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: μαλακοὶ, ἀρσενοκοῖται എന്നീ വിവാദപദങ്ങളുടെ പരസ്പരബന്ധം
  choice: ആദ്യത്തേതിനെ ‘മൃദുലർ’ എന്നും രണ്ടാമത്തേതിനെ ‘പുരുഷന്മാരുമായി ലൈംഗികബന്ധത്തിൽ ഏർപ്പെടുന്ന പുരുഷന്മാർ’ എന്നും വേർതിരിച്ച് പരിഭാഷപ്പെടുത്തി; ഇരുവർക്കും അടിക്കുറിപ്പുകൾ നൽകി.
  alternative: ഇവയെ യഥാക്രമം പുരുഷ-പുരുഷ ലൈംഗികബന്ധത്തിലെ സ്വീകരിക്കുന്ന പങ്കാളികളും സജീവ പങ്കാളികളും എന്നു നിർണ്ണയിക്കുക; അല്ലെങ്കിൽ ‘സ്ത്രൈണരായ പുരുഷന്മാർ’, ‘പുരുഷവേശ്യകൾ’, ‘സോദോമ്യർ’ തുടങ്ങിയ പരമ്പരാഗത പദങ്ങൾ ഉപയോഗിക്കുക.
  rationale: μαλακοὶ എന്നത് അക്ഷരാർഥത്തിൽ ‘മൃദുലർ’ എന്നാണെങ്കിലും ഈ സന്ദർഭത്തിൽ സ്ത്രൈണത, ധാർമിക ദൗർബല്യം, പുരുഷവേശ്യാവൃത്തി, അല്ലെങ്കിൽ പുരുഷ-പുരുഷ ലൈംഗികബന്ധത്തിലെ സ്വീകരിക്കുന്ന പങ്ക് എന്നിവ സൂചിപ്പിക്കാം. ἀρσενοκοῖται അപൂർവവും വിവാദവുമായ പദമാണെങ്കിലും സെപ്റ്റുവജിന്റിലെ ലേവ്യപുസ്തകഭാഷയുമായി പലരും ബന്ധിപ്പിക്കുന്നു. അതിനാൽ സാധ്യതയുള്ള ലൈംഗികസന്ദർഭം മറയ്ക്കാതെയും കൃത്രിമമായ ഉറപ്പോടെ വ്യാഖ്യാനം തീർപ്പാക്കാതെയും അവതരിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനയ്ക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യാവസാനത്തിലെ ‘അതു അവകാശമാക്കുകയില്ല’ എന്ന ആവർത്തനം ഗ്രീക്കിൽ പട്ടികയ്ക്കു ശേഷം ക്രിയ ആവർത്തിക്കാത്തതിനാൽ മലയാളത്തിൽ അർഥപൂർണതയ്ക്കായി പൂരിപ്പിച്ചതാണ്. വിവാദമായ ലൈംഗികപദങ്ങളിൽ ആധുനിക സ്വത്വലേബലുകൾ ഒഴിവാക്കി, യഥാർത്ഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
