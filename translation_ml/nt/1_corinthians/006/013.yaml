id: 1CO.6.13
reference: 1 Corinthians 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: ml
  text: ഭക്ഷണങ്ങൾ വയറിനുവേണ്ടി, വയർ ഭക്ഷണങ്ങൾക്കുവേണ്ടി; എന്നാൽ ദൈവം വയറിനെയും ഭക്ഷണങ്ങളെയും ഇല്ലാതാക്കും.[a] എന്നാൽ ശരീരം ലൈംഗിക അധാർമികതയ്ക്കുവേണ്ടിയല്ല, കർത്താവിനുവേണ്ടിയാണ്; കർത്താവും ശരീരത്തിനുവേണ്ടിയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഇല്ലാതാക്കും’ എന്നതിന് ‘നശിപ്പിക്കും,’ ‘നീക്കിക്കളയും,’ അല്ലെങ്കിൽ ‘പ്രവർത്തനരഹിതമാക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഭക്ഷണങ്ങൾ വയറിനുവേണ്ടി, വയർ ഭക്ഷണങ്ങൾക്കുവേണ്ടി’ എന്നത് പൗലോസ് ഉദ്ധരിച്ച കൊരിന്ത്യരുടെ ഒരു മുദ്രാവാക്യമാണെന്ന് പല വ്യാഖ്യാതാക്കളും കരുതുന്നു; എന്നാൽ ഗ്രീക്ക് പാഠത്തിൽ അത് ഉദ്ധരണിയായി വ്യക്തമായി അടയാളപ്പെടുത്തിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: βρώματα
  choice: ഭക്ഷണങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; മലയാളത്തിലും ഈ പൊതുവായ പ്രസ്താവന സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: κοιλίᾳ / κοιλία
  choice: വയർ
  rationale: ഇവിടെ ഭക്ഷണവും ദഹനവുമായി ബന്ധപ്പെട്ട ശരീരാവയവമാണ് ഉദ്ദേശിക്കുന്നത്; ‘വയർ’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καταργήσει
  choice: ഇല്ലാതാക്കും
  rationale: പ്രവർത്തനം അവസാനിപ്പിക്കുക, നീക്കിക്കളയുക എന്ന വിശാല അർഥം നൽകുന്നു; ഭൗതിക നാശം മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല.
- source_word: ταύτην καὶ ταῦτα
  choice: ഇതിനെയും അവയെയും
  rationale: സ്ത്രീലിംഗ ഏകവചനമായ κοιλίαയെയും നപുംസകലിംഗ ബഹുവചനമായ βρώματαയെയും സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സർവനാമവ്യത്യാസം കഴിയുന്നത്ര സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സാധാരണവും കൃത്യവുമായ മലയാളപദം.
- source_word: πορνείᾳ
  choice: ലൈംഗിക അധാർമികത
  rationale: πορνείαയുടെ വിശാലമായ ലൈംഗിക നൈതിക അർഥപരിധി ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: κυρίῳ / κύριος
  choice: കർത്താവ്
  rationale: യേശുവിനെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരവും പൗലോസിന്റെ പതിവുപ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: ഭക്ഷണം–വയർ പ്രസ്താവനയും ശരീരത്തെക്കുറിച്ചുള്ള തിരുത്തൽപരമായ വാദവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആദ്യവാക്യം കൊരിന്ത്യരുടെ മുദ്രാവാക്യമാണോ പൗലോസിന്റെ സ്വന്തം പ്രസ്താവനയാണോ
  choice: ഉദ്ധരണിച്ചിഹ്നമോ ‘നിങ്ങൾ പറയുന്നു’ എന്ന കൂട്ടിച്ചേർക്കലോ ഇല്ലാതെ നേരിട്ട് അവതരിപ്പിച്ചു.
  alternative: ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ കൊരിന്ത്യരുടെ മുദ്രാവാക്യമായി അടയാളപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം തന്നെ ഉദ്ധരണി വ്യക്തമായി അടയാളപ്പെടുത്തുന്നില്ല; വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ച് മുഖ്യപാഠത്തിലെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
- issue: καταργήσει എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ‘ഇല്ലാതാക്കും’ എന്ന് പരിഭാഷപ്പെടുത്തി, ഭാവിയിലെ അവസാനിപ്പിക്കൽ സൂചിപ്പിച്ചു.
  alternative: ‘നശിപ്പിക്കും’ അല്ലെങ്കിൽ ‘പ്രവർത്തനരഹിതമാക്കും’.
  rationale: ക്രിയയ്ക്ക് നശിപ്പിക്കൽ എന്ന അർഥസാധ്യതയുണ്ടെങ്കിലും, ഈ സന്ദർഭത്തിൽ ഭക്ഷണം–വയർ ക്രമത്തിന്റെ താൽക്കാലികതയാണ് പ്രധാനമായും പ്രകടമാകുന്നത്; ഭൗതിക ഉന്മൂലനം അനാവശ്യമായി നിർബന്ധിക്കുന്നില്ല.
- issue: ‘കർത്താവ് ശരീരത്തിനുവേണ്ടി’ എന്ന വാക്യത്തിന്റെ അർഥം
  choice: ഗ്രീക്കിലെ സംക്ഷിപ്തവും പരസ്പരബന്ധം സൂചിപ്പിക്കുന്നതുമായ രൂപം വികസിപ്പിക്കാതെ നിലനിർത്തി.
  alternative: ‘കർത്താവ് ശരീരത്തെ പരിപാലിക്കുന്നു’ അല്ലെങ്കിൽ ‘ശരീരത്തിന്റെ നന്മയ്ക്കായാണ് കർത്താവ്’.
  rationale: ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം മൂലപാഠം വിശദീകരിക്കുന്നില്ല; വികസിപ്പിച്ച പരിഭാഷ ഒരു പ്രത്യേക വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ സമാന്തരഘടനയും സംക്ഷിപ്തമായ ദൈവശാസ്ത്രപരമായ പരസ്പരബന്ധവും നിലനിർത്തി; വ്യാഖ്യാനപരമായ അവ്യക്തതകൾ മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തി.
