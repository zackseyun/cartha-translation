  terminology: ‘വയർ,’ ‘ശരീരം,’ ‘ലൈംഗിക അധാർമികത,’ and ‘കർത്താവ്’ are appropriate modern-standard Malayalam renderings. ‘ഇല്ലാതാക്കും’ suitably conveys καταργήσει without requiring physical annihilation.
