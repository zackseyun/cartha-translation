id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: ml
  text: നിങ്ങളുടെ ശരീരങ്ങൾ മശീഹയുടെ അവയവങ്ങളാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലേ? അങ്ങനെയെങ്കിൽ, ഞാൻ മശീഹയുടെ അവയവങ്ങളെ എടുത്ത് ഒരു വേശ്യയുടെ അവയവങ്ങളാക്കണമോ? ഒരിക്കലും അരുത്![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹ’ എന്നതിനുപകരം ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദം ‘മശീഹ’ എന്ന പരിഭാഷപ്പെടുത്തിയ പദവിയായോ ‘ക്രിസ്തു’ എന്ന പേരുപോലുള്ള രൂപമായോ പ്രവർത്തിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘ഒരിക്കലുമില്ല!’ അല്ലെങ്കിൽ ‘തീർച്ചയായും അരുത്!’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ μὴ γένοιτο ശക്തമായ നിരാകരണപ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: σώματα
  choice: ശരീരങ്ങൾ
  rationale: വിശ്വാസികളുടെ യഥാർഥ ശാരീരിക അസ്തിത്വത്തെയാണ് ബഹുവചനം സൂചിപ്പിക്കുന്നത്; ‘ശരീരങ്ങൾ’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷയാണ്.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ഒരു ശരീരത്തിന്റെ ഭാഗങ്ങൾ എന്ന രൂപകം നിലനിർത്തുകയും അവ ഒരു വലിയ സമഗ്രതയോട് ചേർന്നവയാണെന്ന പൗലോസിന്റെ ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന പദവിയായി ഗ്രഹിക്കാം; ‘മശീഹ’ ആ പദവിയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἄρας
  choice: എടുത്ത്
  rationale: തുടർന്നുള്ള ποιήσω-യുമായി ചേർന്ന് ആലോചിക്കപ്പെടുന്ന ഞെട്ടിക്കുന്ന പ്രവൃത്തിയെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ποιήσω
  choice: അവയവങ്ങളാക്കണമോ
  rationale: ‘ആക്കുക’ എന്ന പ്രയോഗം ഒരാളുടെ അവയവങ്ങളെ മറ്റൊരാളുടെ അവയവങ്ങളാക്കുന്നതെന്ന രൂപകത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: πόρνης
  choice: ഒരു വേശ്യയുടെ
  rationale: πόρνη ഈ സന്ദർഭത്തിൽ പൊതുവായ ലൈംഗിക അധാർമികതയെയല്ല, പ്രത്യേകമായി ഒരു വേശ്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലും അരുത്!
  rationale: ഇത് വെറും നിഷേധമല്ല, ശക്തമായ നിരാകരണമാണ്; ചുരുക്കവും സ്വാഭാവികവുമായ ഈ പ്രയോഗം അതിന്റെ തീവ്രത കൈവിടുന്നില്ല.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലേ?
  rationale: ശ്രോതാക്കൾ ഇതിനകം അറിയേണ്ട കാര്യം ഓർമിപ്പിക്കുന്ന വാചാടോപചോദ്യം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ശരീര-ഐക്യ ഭാഷയിൽ Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവിയുടെ അർഥം പ്രസക്തമാണെന്ന് കണ്ട് ‘മശീഹ’ ഉപയോഗിച്ചു; എന്നാൽ ഗ്രീക്കുപദം പേരുപോലെ പ്രവർത്തിക്കുന്നതായി ഗ്രഹിക്കാനും കഴിയും, അതിനാൽ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: μὴ γένοιτο എന്ന ശക്തമായ നിരാകരണത്തിന്റെ ഭാവം
  choice: ഒരിക്കലും അരുത്!
  alternative: ഒരിക്കലുമില്ല! / തീർച്ചയായും അരുത്!
  rationale: അറപ്പുളവാക്കുന്ന നിഗമനത്തെ പൗലോസ് ശക്തമായി തള്ളുന്നതു നിലനിർത്തുന്നു; അതോടൊപ്പം മലയാളത്തിൽ കൃത്രിമമല്ലാത്ത പ്രയോഗവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവവും വാചാടോപചോദ്യത്തിന്റെ ഞെട്ടിക്കുന്ന ശക്തിയും നിലനിർത്തി. ‘അവയവങ്ങൾ’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ശരീരരൂപകത്തെ ബോധപൂർവം സംരക്ഷിക്കുന്നു.
