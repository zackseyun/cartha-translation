revisions:
- from: അല്ലെങ്കിൽ, വേശ്യയോടു ചേരുന്നവൻ അവളുമായി ഏകശരീരമാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? “ഇരുവരും ഏകജഡമായിത്തീരും” എന്ന് അവൻ പറയുന്നുവല്ലോ.[a]
