id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: ml
  text: അല്ലെങ്കിൽ, വേശ്യയോടു ചേരുന്നവൻ അവളുമായി ഏകശരീരമാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? കാരണം, “ഇരുവരും ഏകജഡമായിത്തീരും” എന്ന് അവൻ പറയുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവൻ പറയുന്നു” എന്നാണ് ഗ്രീക്ക്; ഉദ്ധരണി ഉല്പത്തി 2:24-ൽനിന്നാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദത്തിന്റെ തുടർച്ചയായ വാചാടോപപരമായ ചോദ്യം അവതരിപ്പിക്കുന്നു.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലയോ?
  rationale: പൗലോസിന്റെ പതിവായ വാചാടോപസൂത്രം സ്വാഭാവികമായും മൂലത്തോട് ചേർന്നും നൽകുന്നു.
- source_word: ὁ κολλώμενος
  choice: ചേരുന്നവൻ
  rationale: κολλάομαι എന്നതിലെ ചേരുക/പറ്റിച്ചേരുക എന്ന ആശയം നിലനിർത്തുന്നു; ഈ ലൈംഗികസന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: τῇ πόρνῃ
  choice: വേശ്യയോടു
  rationale: πόρνη എന്നത് വിശാലമായ ലൈംഗിക അധാർമികതയല്ല, പ്രത്യേകമായി വേശ്യയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἓν σῶμά ἐστιν
  choice: അവളുമായി ഏകശരീരമാണ്
  rationale: ഗ്രീക്കിൽ ബന്ധത്തിൽ അന്തർലീനമായിരിക്കുന്ന ‘അവളുമായി’ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുകയും ഏകശരീരബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἔσονται γάρ
  choice: ആയിത്തീരും ... എന്നതാണല്ലോ കാരണം
  rationale: ഭാവികാല εἰμί + εἰς ഇവിടെ ‘ആയിത്തീരുക’ എന്ന ഫലാർഥം നൽകുന്നു; γάρ-ന്റെ അടിസ്ഥാനപ്പെടുത്തുന്ന ബലം ‘പറയുന്നുവല്ലോ’ എന്ന സ്വാഭാവിക ഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: φησίν
  choice: എന്ന് അവൻ പറയുന്നുവല്ലോ
  rationale: ഏകവചനമായ ‘അവൻ പറയുന്നു’ എന്ന ഗ്രീക്ക് രൂപം സംരക്ഷിക്കുന്നു; വിഷയം അനാവശ്യമായി ‘തിരുവെഴുത്ത്’ എന്നു നിർണ്ണയിക്കുന്നില്ല.
- source_word: οἱ δύο
  choice: ഇരുവരും
  rationale: ‘ആ രണ്ടുപേർ’ എന്ന ആശയം ഉദ്ധരണിയിൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰς σάρκα μίαν
  choice: ഏകജഡമായിത്തീരും
  rationale: ഉല്പത്തി 2:24-ലെ സ്ഥാപിതമായ ‘ഏകജഡം’ എന്ന ദേഹപരവും ബന്ധപരവുമായ ഭാഷ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിവാഹത്തിനു പുറത്തുള്ള ലൈംഗികബന്ധത്തിൽ ഉല്പത്തി ഉദ്ധരണിയുടെ പ്രയോഗം
  choice: വേശ്യയുമായുള്ള ലൈംഗികചേരൽ യഥാർഥമായ ‘ഏകജഡ’ ദേഹബന്ധം സൃഷ്ടിക്കുന്നു എന്ന പൗലോസിന്റെ വാദത്തിന് ഉദ്ധരണി നേരിട്ട് അടിസ്ഥാനമാകുന്നവിധം വിവർത്തനം ചെയ്തു.
  alternative: ഉദ്ധരണി വിവാഹത്തിനു മാത്രമേ ബാധകമാകൂ എന്നു പരിമിതപ്പെടുത്തുക, അല്ലെങ്കിൽ വാക്യത്തിൽ ഇല്ലാത്ത വിപുലമായ വിവാഹ/ധാർമിക വിശദീകരണം ചേർക്കുക.
  rationale: പൗലോസ് ഉല്പത്തി 2:24 വേശ്യയുമായുള്ള ബന്ധത്തോട് സാദൃശ്യപരമായി പ്രയോഗിക്കുന്നു. ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെയും അധിക വ്യാഖ്യാനം ചേർക്കാതെയും നിലനിർത്തണം.
- issue: φησίν എന്നതിന്റെ വ്യക്തമല്ലാത്ത കർത്താവ്
  choice: ‘അവൻ പറയുന്നുവല്ലോ’ എന്നു നൽകി.
  alternative: ‘തിരുവെഴുത്ത് പറയുന്നു’ അല്ലെങ്കിൽ ‘ദൈവം പറയുന്നു’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് ഏകവചന കർത്താവിനെ പരാമർശിക്കുന്നുവെങ്കിലും ഇവിടെ പേര് പറയുന്നില്ല; വിവർത്തനം ആ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു. അടിക്കുറിപ്പ് ഉദ്ധരണിയുടെ ഉറവിടം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ഏകശരീരം’ (σῶμα), ‘ഏകജഡം’ (σάρξ) എന്ന വ്യത്യാസം ബോധപൂർവം സംരക്ഷിച്ചു; വാക്യത്തിൽ ഇല്ലാത്ത വിവാഹസിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
