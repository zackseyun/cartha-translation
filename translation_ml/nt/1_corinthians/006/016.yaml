review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the rhetorical question, the generic reference to a prostitute, the present assertion that the person is one body with her, and the Genesis wording’s future/result sense. However, γάρ is not clearly represented: the emphatic-sounding പറയുന്നുവല്ലോ does not reliably carry the explicit grounding force of “for.”'
  naturalness: The Malayalam is generally clear and suitably formal-modern. Recasting the quotation introduction with “കാരണം” gives the argument’s connection directly and reads more naturally than placing the explanatory force in പറയുന്നുവല്ലോ.
  terminology: വേശ്യ, ഏകശരീരം, and ഏകജഡം appropriately preserve πόρνη, σῶμα, and σάρξ respectively. Retaining the distinction between ഏകശരീരം and ഏകജഡം is valuable in this context.
  issues:
  - severity: medium
    issue: The causal particle γάρ is insufficiently expressed.
    rationale: The wording “എന്ന് അവൻ പറയുന്നുവല്ലോ” can add discourse emphasis, but it does not explicitly state that the Genesis citation supplies the reason for the preceding assertion. “കാരണം” preserves γάρ without adding interpretation.
  revised_text: അല്ലെങ്കിൽ, വേശ്യയോടു ചേരുന്നവൻ അവളുമായി ഏകശരീരമാണെന്ന് നിങ്ങൾ അറിയുന്നില്ലയോ? കാരണം, “ഇരുവരും ഏകജഡമായിത്തീരും” എന്ന് അവൻ പറയുന്നു.[a]
