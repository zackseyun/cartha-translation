id: 1CO.6.10
reference: 1 Corinthians 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: ml
  text: കള്ളന്മാരോ അത്യാഗ്രഹികളോ മദ്യപന്മാരോ അധിക്ഷേപിക്കുന്നവരോ പിടിച്ചുപറിക്കുന്നവരോ[a] ദൈവരാജ്യം അവകാശമാക്കുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ചൂഷണം ചെയ്യുന്നവരോ” അല്ലെങ്കിൽ “കൊള്ളക്കാരോ” (ἅρπαγες).
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ദൈവരാജ്യത്തിൽ അവകാശമായി ഒരു പങ്ക് ലഭിക്കുകയില്ല.
    reason: inheritance_clarification
lexical_decisions:
- source_word: κλέπται
  choice: കള്ളന്മാർ
  rationale: മോഷണം നടത്തുന്നവരെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പൊതുവായി മനസ്സിലാകുന്നതുമായ മലയാളപദം.
- source_word: πλεονέκται
  choice: അത്യാഗ്രഹികൾ
  rationale: കൂടുതൽ നേടാനുള്ള അടങ്ങാത്ത മോഹത്താൽ സ്വഭാവീകരിക്കപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നു; വെറും ആഗ്രഹത്തേക്കാൾ ശക്തമായ ദുഷ്പ്രവണത ഇതിൽ പ്രകടമാണ്.
- source_word: μέθυσοι
  choice: മദ്യപന്മാർ
  rationale: ഒരിക്കൽ മദ്യപിച്ചവരെയല്ല, മദ്യപാനത്താൽ സ്വഭാവീകരിക്കപ്പെടുന്നവരെയാണ് ഈ ദോഷപ്പട്ടികയിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: λοίδοροι
  choice: അധിക്ഷേപിക്കുന്നവർ
  rationale: അപമാനകരമായും നിന്ദ്യമായും സംസാരിക്കുന്നവരെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; ‘അപവാദികൾ’ എന്നത് വ്യാജാരോപണത്തിലേക്ക് അർഥം ചുരുക്കാം.
- source_word: ἅρπαγες
  choice: പിടിച്ചുപറിക്കുന്നവർ
  rationale: ബലപ്രയോഗത്തിലൂടെയോ ചൂഷണത്തിലൂടെയോ മറ്റുള്ളവരുടേത് കൈക്കലാക്കുന്നവരെന്ന വിശാല അർഥം നൽകുന്നു; പദത്തിന്റെ കൊള്ളയടിക്കുന്ന സ്വഭാവം നിലനിർത്തുന്നു.
- source_word: βασιλείαν θεοῦ
  choice: ദൈവരാജ്യം
  rationale: ദൈവത്തിന്റെ രാജത്വത്തെയും രാജ്യത്തെയും ഉൾക്കൊള്ളുന്ന, മലയാള ബൈബിൾഭാഷയിൽ സ്ഥാപിതമായ സംക്ഷിപ്ത പ്രയോഗം.
- source_word: κληρονομήσουσιν
  choice: അവകാശമാക്കുകയില്ല
  rationale: അവകാശമായി ലഭിക്കുക എന്ന ഭാവി-പാരമ്പര്യ ആശയം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദോഷപ്പട്ടികയിലെ വ്യക്തിനാമങ്ങളും രാജ്യാവകാശഭാഷയും
  choice: ഈ പ്രവൃത്തികളാൽ സ്വഭാവീകരിക്കപ്പെടുന്ന വിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന ബഹുവചന വ്യക്തിനാമങ്ങൾ നിലനിർത്തി; വ്യാഖ്യാനപരമായ ‘അനുതപിക്കാത്ത’ തുടങ്ങിയ വിശേഷണങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
  alternative: ഒറ്റപ്പെട്ട ഓരോ പ്രവൃത്തിയും ചെയ്യുന്ന ഏതൊരാളെയും നേരിട്ട് സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്കിലെ ബഹുവചന വ്യക്തിനാമങ്ങൾ ദോഷപ്പട്ടികയിൽ സാധാരണയായി അത്തരം പെരുമാറ്റത്താൽ തിരിച്ചറിയപ്പെടുന്ന ആളുകളെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അനുതാപം, പതിവ്, അന്തിമവിധി എന്നിവയെക്കുറിച്ചുള്ള വിശദീകരണം പാഠത്തിൽ ചേർക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ദോഷപ്പട്ടികയുടെ ഗൗരവവും സംക്ഷിപ്തതയും നിലനിർത്തിയിരിക്കുന്നു. ആവർത്തിക്കുന്ന ഗ്രീക്ക് നിഷേധപ്രയോഗങ്ങളെ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ഓ’ പട്ടികയാക്കി, അവസാനത്തിൽ ഒരൊറ്റ നിഷേധക്രിയ ഉപയോഗിച്ചു.
