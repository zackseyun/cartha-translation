  to: “എനിക്ക് എല്ലാം അനുവദനീയമാണ്,” എന്നാൽ എല്ലാം പ്രയോജനകരമല്ല.[a][b] “എനിക്ക് എല്ലാം അനുവദനീയമാണ്,” എന്നാൽ യാതൊന്നിന്റെയും അധീനതയിൽ ഞാൻ ആകുകയില്ല.[c]
