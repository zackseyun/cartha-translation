id: 1CO.6.12
reference: 1 Corinthians 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: ml
  text: “എനിക്ക് എല്ലാം അനുവദനീയമാണ്,” എന്നാൽ എല്ലാം പ്രയോജനകരമല്ല.[a][b] “എനിക്ക് എല്ലാം അനുവദനീയമാണ്,” എന്നാൽ യാതൊന്നിന്റെയും അധീനതയിൽ ഞാൻ ആകുകയില്ല.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെയും വായിക്കാം: എനിക്ക് എല്ലാം അനുവദനീയമാണ്. പൗലോസ് ഉദ്ധരിച്ചശേഷം അതിനെ പരിമിതപ്പെടുത്തുന്ന കൊരിന്ത്യരുടെ ഒരു മുദ്രാവാക്യമായാണ് പലരും ഈ വാക്യഭാഗത്തെ മനസ്സിലാക്കുന്നത്.'
    reason: alternative_reading
  - marker: b
    text: ‘പ്രയോജനകരം’ എന്നതിന് ‘ഗുണകരം’ അല്ലെങ്കിൽ ‘ഉപകാരപ്രദം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘ഒന്നിനാലും ഞാൻ നിയന്ത്രിക്കപ്പെടുകയില്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: എനിക്ക് എല്ലാം അനുവദനീയമാണ്
  rationale: ἔξεστιν എന്നത് അനുവദിക്കപ്പെട്ടത്/നിയമാനുസൃതമായത് എന്ന അർഥം വഹിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും മുദ്രാവാക്യസദൃശമായ വ്യാപ്തിയോടെയും ആവർത്തനം നിലനിർത്തുന്നതിനും ഈ രൂപം യോജിക്കുന്നു.
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: എന്നാൽ എല്ലാം പ്രയോജനകരമല്ല
  rationale: συμφέρει ഇവിടെ ഗുണകരമാകുക, ഉപകാരപ്പെടുക എന്ന മൂല്യനിർണയാർഥത്തിലാണ്. ‘പ്രയോജനകരം’ വാണിജ്യപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതെ ആ വിശാലത നിലനിർത്തുന്നു.
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος
  choice: എന്നാൽ ഒന്നിന്റെയും അധികാരത്തിന് ഞാൻ കീഴ്പ്പെടുകയില്ല
  rationale: ἐξουσιασθήσομαι എന്ന ഭാവികാല കർമണി രൂപത്തിലെ അധികാരത്തിനോ നിയന്ത്രണത്തിനോ വിധേയനാകുക എന്ന ആശയം വ്യക്തമാക്കുന്നു. τινος സന്ദർഭത്തിൽ വ്യക്തിയെയോ വസ്തുവെയോ ശീലത്തെയോ ഉൾക്കൊള്ളാവുന്ന വിശാലതയുള്ളതിനാൽ ‘ഒന്നിന്റെയും’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: Πάντα μοι ἔξεστιν എന്ന ആവർത്തിത വാക്യം കൊരിന്ത്യരുടെ മുദ്രാവാക്യമാണോ എന്നത്
  choice: ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ നൽകി, പൗലോസ് ഉദ്ധരിച്ച് യോഗ്യതപ്പെടുത്തുന്ന മുദ്രാവാക്യമെന്ന സാധ്യത മുഖ്യവാചകത്തിൽ സൂചിപ്പിച്ചു.
  alternative: ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെ, തുടർന്നുള്ള വാക്യങ്ങളാൽ പൗലോസ് യോഗ്യതപ്പെടുത്തുന്ന അദ്ദേഹത്തിന്റെ സ്വന്തം പ്രസ്താവനയായി വായിക്കാം.
  rationale: ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ല; അതിനാൽ ഇത് വ്യാഖ്യാനപരമായ തീരുമാനമാണ്. വ്യാപകമായി അംഗീകരിക്കപ്പെടുന്ന മുദ്രാവാക്യവായന മുഖ്യവാചകത്തിൽ സഹായകരമാണെങ്കിലും, യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തര ആവർത്തനം സംരക്ഷിച്ചു. ‘നിയമാനുസൃതം’ എന്ന കൂടുതൽ നിയമസാങ്കേതിക പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘അനുവദനീയം’ ഉപയോഗിച്ചു; ἐξουσιάζωയിലെ അധികാരസൂചന നിലനിർത്താൻ ‘അധികാരത്തിന് കീഴ്പ്പെടുക’ തെരഞ്ഞെടുത്തു.
