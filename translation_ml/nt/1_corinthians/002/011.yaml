id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: ml
  text: മനുഷ്യരിൽ ആരാണ് ഒരു മനുഷ്യന്റെ കാര്യങ്ങൾ[a] അറിയുന്നത്—ആ മനുഷ്യന്റെ ഉള്ളിലുള്ള ആത്മാവല്ലാതെ? അതുപോലെതന്നെ, ദൈവത്തിന്റെ കാര്യങ്ങൾ ദൈവത്തിന്റെ ആത്മാവല്ലാതെ ആരും അറിഞ്ഞിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു മനുഷ്യന്റെ ചിന്തകൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: മനുഷ്യരിൽ / ഒരു മനുഷ്യന്റെ
  rationale: ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നതാണ്. മലയാളത്തിൽ സ്വാഭാവികവും ഉറവിടത്തോട് അടുത്തതുമായ രൂപങ്ങൾ തിരഞ്ഞെടുത്തു.
- source_word: τὰ τοῦ ἀνθρώπου
  choice: ഒരു മനുഷ്യന്റെ ഉള്ളിലുള്ള കാര്യങ്ങൾ
  rationale: പ്രയോഗം ആ മനുഷ്യനുമായി ബന്ധപ്പെട്ട ആന്തരിക കാര്യങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു. വെറും ‘ചിന്തകൾ’ എന്നു ചുരുക്കാതെ, ദൈവത്തിന്റെ കാര്യങ്ങളുമായുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: അവനിലുള്ള അവന്റെ ആത്മാവ്
  rationale: വ്യക്തിയുടെ ആത്മാവും അത് അവനിൽ ഉള്ളതുമെന്ന ഗ്രീക്ക് വാക്യഘടന കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു; ‘ആത്മാവ്’ എന്ന പദം ദൈവത്തിന്റെ ആത്മാവുമായുള്ള വിരോധസമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മാനുഷിക ഉദാഹരണവും ദൈവിക പ്രസ്താവനയും തമ്മിലുള്ള അടുത്ത ഉപമ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔγνωκεν
  choice: അറിഞ്ഞിട്ടില്ല
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ രൂപം പ്രതിഫലിപ്പിക്കുന്നതിനായി വർത്തമാനകാലമായ ‘അറിയുന്നില്ല’ എന്നതിനു പകരം ഫലപ്രസക്തിയുള്ള പൂർണ്ണകാലരൂപം ഉപയോഗിച്ചു.
- source_word: τὰ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കാര്യങ്ങൾ
  rationale: ഇത് ‘ദൈവത്തിന്റെ ചിന്തകൾ’ എന്നതിലധികം വിശാലമാണ്; ആദ്യ അർധത്തിലെ പ്രയോഗവുമായുള്ള സമാന്തരത സംരക്ഷിക്കുന്നു.
- source_word: πνεῦμα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സ്വന്തം ആത്മാവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ പദപ്രയോഗം വ്യക്തിപരമായ ദൈവിക പരാമർശം നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα τοῦ θεοῦ എന്നത് ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ശീർഷകമായി വിവർത്തനം ചെയ്യണമോ, പൊതുവായ ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്ന പ്രയോഗമായി കാണണമോ
  choice: ദൈവത്തിന്റെ ആത്മാവ്
  alternative: ദൈവാത്മാവ്
  rationale: തൊട്ടടുത്ത സന്ദർഭത്തിൽ അന്വേഷിക്കുകയും വെളിപ്പെടുത്തുകയും ചെയ്യുന്ന ദൈവത്തിന്റെ സ്വന്തം ആത്മാവാണ് ഉദ്ദേശ്യം. ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്ന രൂപം ഉറവിടത്തിലെ ഉടമസ്ഥബന്ധം വ്യക്തമായി നിലനിർത്തുകയും അധിക ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: τὰ τοῦ ἀνθρώπου എന്നതിന്റെ പരിധി
  choice: ഒരു മനുഷ്യന്റെ ഉള്ളിലുള്ള കാര്യങ്ങൾ
  alternative: ഒരു മനുഷ്യന്റെ ചിന്തകൾ
  rationale: ‘ചിന്തകൾ’ എന്നു മാത്രം പറയുന്നത് അർത്ഥപരിധി ചുരുക്കാം. സന്ദർഭം ആന്തരിക അറിവിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഉള്ളിലുള്ള’ എന്നത് വായനാസഹായമായി ചേർത്തിട്ടുണ്ടെങ്കിലും ‘കാര്യങ്ങൾ’ എന്ന വിശാലത നിലനിർത്തി; പര്യായം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക പ്രമാണ മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. ആദ്യ ചോദ്യത്തിലെ ഗ്രീക്ക് വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുമ്പോഴും മനുഷ്യന്റെ ആത്മാവും ദൈവത്തിന്റെ ആത്മാവും തമ്മിലുള്ള സമാന്തരത നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വ്യത്യസ്ത വിവർത്തനസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
