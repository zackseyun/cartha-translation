- from: മനുഷ്യരിൽ ആരാണ് ഒരു മനുഷ്യന്റെ ഉള്ളിലുള്ള കാര്യങ്ങൾ അറിയുന്നത്—അവനിലുള്ള അവന്റെ ആത്മാവല്ലാതെ? അതുപോലെതന്നെ, ദൈവത്തിന്റെ കാര്യങ്ങൾ ദൈവത്തിന്റെ ആത്മാവല്ലാതെ ആരും അറിഞ്ഞിട്ടില്ല.[a]
