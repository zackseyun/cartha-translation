  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀγὼ ἐν ἀσθενείᾳ καὶ ἐν φόβῳ καὶ ἐν τρόμῳ πολλῷ ἐγενόμην πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/003.yaml
  text: And I was with you in weakness[a], in fear, and in great trembling,
translation:
  language: ml
  text: ഞാനും ബലഹീനതയോടും ഭയത്തോടും അത്യന്തം വിറയലോടുംകൂടെ നിങ്ങളുടെ അടുക്കൽ വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ബലഹീനതയിലും ഭയത്തിലും അത്യന്തം വിറയലിലും നിങ്ങളോടുകൂടെ ആയിരുന്നു.”
    reason: ἐγενόμην πρὸς ὑμᾶς എന്ന പ്രയോഗം അവരുടെ അടുക്കലേക്കുള്ള വരവിനെയോ അവരുടെ സാന്നിധ്യത്തിൽ ഉണ്ടായിരുന്നതിനെയോ മുൻനിർത്തി മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: κἀγώ
  choice: ഞാനും
  rationale: καί എന്ന ബന്ധകഭാവവും പൗലോസിന്റെ വ്യക്തമായ സ്വയംപരാമർശവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐν ἀσθενείᾳ
  choice: ബലഹീനതയിൽ
  rationale: ശാരീരികമോ വ്യക്തിപരമോ ആയ ദൗർബല്യം ഉൾക്കൊള്ളാവുന്ന ἀσθένεια എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἐν φόβῳ
  choice: ഭയത്തിൽ
  rationale: φόβος എന്നതിനെ ഭക്ത്യാദരമെന്നോ ജാഗ്രതയെന്നോ മൃദൂകരിക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἐν τρόμῳ πολλῷ
  choice: വളരെ വിറയലിൽ
  rationale: τρόμος എന്നതിന്റെ ‘വിറയൽ’ എന്ന അർഥവും πολλῷ നൽകുന്ന ശക്തമായ തീവ്രതയും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ἐγενόμην πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വന്നു
  rationale: πρὸς ὑμᾶς സഹിതമുള്ള ἐγενόμην ഇവിടെ അവരുടെ അടുക്കലേക്കുള്ള വരവിനെ സൂചിപ്പിക്കാവുന്നതിനാൽ ഈ സ്വാഭാവിക രൂപം തിരഞ്ഞെടുത്തു; ‘നിങ്ങളോടുകൂടെ ആയിരുന്നു’ എന്ന സാന്നിധ്യകേന്ദ്രിത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ἐν ഘടനയെ ‘-യിൽ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി; എന്നാൽ മലയാളവാക്യം സ്വാഭാവികമായി വായിക്കാവുന്ന വിധം ക്രമപ്പെടുത്തി.
