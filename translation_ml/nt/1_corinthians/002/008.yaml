id: 1CO.2.8
reference: 1 Corinthians 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: ml
  text: ഈ യുഗത്തിലെ ഭരണാധികാരികളിൽ[a] ആരും ആ ജ്ഞാനം അറിഞ്ഞിട്ടില്ല. അവർ അത് അറിഞ്ഞിരുന്നെങ്കിൽ, മഹത്വത്തിന്റെ കർത്താവിനെ ക്രൂശിക്കുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഈ യുഗത്തിലെ ഭരണാധികാരികൾ” എന്നത് മനുഷ്യരായ അധികാരികളെയോ ആത്മീയ ശക്തികളെയോ അല്ലെങ്കിൽ ഇരുവരെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: ആ ജ്ഞാനം
  rationale: സ്ത്രീലിംഗ ഏകവചന ആപേക്ഷിക സർവനാമം മുൻവാക്യത്തിൽ പറഞ്ഞിരിക്കുന്ന ദൈവജ്ഞാനത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യം സ്വാഭാവികവും വ്യക്തവുമാക്കാൻ സൂചിതമായ നാമം ആവർത്തിച്ചു.
- source_word: ἀρχόντων
  choice: ഭരണാധികാരികൾ
  rationale: ഭരണാധികാരം പ്രയോഗിക്കുന്നവരെ സൂചിപ്പിക്കുന്നതോടൊപ്പം മനുഷ്യാധികാരികളോ ആത്മീയ ശക്തികളോ രണ്ടും കൂടിയോ എന്ന സാധ്യത തുറന്നുവയ്ക്കുന്നു.
- source_word: αἰῶνος τούτου
  choice: ഈ യുഗത്തിലെ
  rationale: αἰών എന്നതിന്റെ കാലഘട്ടപരമായ അർത്ഥം സംരക്ഷിക്കുന്നു; ‘ഈ ലോകത്തിലെ’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: അറിഞ്ഞിട്ടില്ല / അറിഞ്ഞിരുന്നെങ്കിൽ
  rationale: ഗ്രീക്ക് ക്രിയയുടെ ‘അറിയുക’ എന്ന നേരിട്ടുള്ള അർത്ഥവും ആദ്യരൂപത്തിലെ സമ്പൂർണകാല ഭാവവും തുടർന്ന് വരുന്ന യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κύριον τῆς δόξης
  choice: മഹത്വത്തിന്റെ കർത്താവ്
  rationale: ഗ്രീക്കിലെ ബന്ധവിഭക്തി ഘടനയും ക്രിസ്തുവിന്റെ സ്ഥാനപ്പേരിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ἐσταύρωσαν
  choice: ക്രൂശിക്കുമായിരുന്നില്ല
  rationale: ക്രൂശിലേറ്റിയുള്ള വധത്തെ ചരിത്രപരമായി കൃത്യമായി സൂചിപ്പിക്കുകയും യാഥാർഥ്യവിരുദ്ധ നിബന്ധനയുടെ ഫലം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഈ യുഗത്തിലെ ഭരണാധികാരികൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘ഭരണാധികാരികൾ’ എന്നു നിഷ്പക്ഷമായി പരിഭാഷപ്പെടുത്തി.
  alternative: മനുഷ്യരായ രാഷ്ട്രീയ-മത അധികാരികൾ; ആത്മീയമോ പൈശാചികമോ ആയ ശക്തികൾ; അല്ലെങ്കിൽ ഇരുവിഭാഗവും ഉൾക്കൊള്ളുന്ന സൂചന.
  rationale: ഗ്രീക്ക് പ്രയോഗം ഈ വ്യാഖ്യാനസാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘യുഗം,’ ‘മഹത്വം,’ ‘കർത്താവ്,’ ‘ക്രൂശിക്കുക’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി.
