id: 1CO.2.14
reference: 1 Corinthians 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: ml
  text: എന്നാൽ സ്വാഭാവികനായ മനുഷ്യൻ ദൈവത്തിന്റെ ആത്മാവിന്റെ കാര്യങ്ങൾ സ്വീകരിക്കുന്നില്ല[a]; അവ അയാൾക്കു ഭോഷത്വമാണ്. അവയെ അറിയാനും അയാൾക്കു കഴിയുന്നില്ല, കാരണം അവ ആത്മീയമായി വിവേചിക്കപ്പെടുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആത്മീയനല്ലാത്ത മനുഷ്യൻ.”
    reason: lexical_alternative
  - marker: b
    text: “വിവേചിക്കപ്പെടുന്നു” എന്നതിന് “വിലയിരുത്തപ്പെടുന്നു” എന്നോ “പരിശോധിക്കപ്പെടുന്നു” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: സ്വാഭാവികനായ
  rationale: ψυχικός ഇവിടെ πνευματικός എന്നതിനോടു വിരുദ്ധമായി നിൽക്കുന്നു. ‘സ്വാഭാവികനായ’ എന്നത് ആത്മാവിനാൽ ലഭിക്കുന്ന വിവേചനത്തിൽനിന്നു വ്യത്യസ്തമായ സാധാരണ മാനുഷിക നിലയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഉള്ളതിലധികം സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പ്രതിനിധാനപരമായ പൊതുവായ അർഥമാണ്; മലയാളത്തിൽ ‘മനുഷ്യൻ’ ആ പൊതുവായ അർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: δέχεται
  choice: സ്വീകരിക്കുന്നില്ല
  rationale: വെറും ലഭിക്കൽ മാത്രമല്ല, സാധുവെന്ന് അംഗീകരിച്ച് കൈക്കൊള്ളുക എന്ന ആശയവും സന്ദർഭത്തിൽ ഉണ്ട്; ‘സ്വീകരിക്കുക’ അതു നന്നായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവിന്റെ കാര്യങ്ങൾ
  rationale: ഗ്രീക്ക് ബന്ധഘടനയും പ്രയോഗത്തിന്റെ വിശാലതയും നിലനിർത്തുന്നു; ദൈവത്തിന്റെ ആത്മാവിനോടു ബന്ധപ്പെട്ട യാഥാർഥ്യങ്ങളെ പരിമിതപ്പെടുത്താതെ സൂചിപ്പിക്കുന്നു.
- source_word: μωρία
  choice: ഭോഷത്തം
  rationale: ദൈവജ്ഞാനവും മാനുഷിക വിധിയും തമ്മിലുള്ള 1 കൊരിന്ത്യരിലെ ആവർത്തിത വൈരുധ്യം സ്വാഭാവികവും ശക്തവുമായി നൽകുന്നു.
- source_word: γνῶναι
  choice: അറിയാൻ
  rationale: γινώσκω എന്ന ക്രിയയുടെ അടിസ്ഥാനമായ ‘അറിയുക’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഗ്രഹിക്കുകയോ തിരിച്ചറിയുകയോ ചെയ്യുന്ന അർഥവും ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: πνευματικῶς
  choice: ആത്മീയമായിട്ട്
  rationale: വിവേചനത്തിന്റെ രീതി അല്ലെങ്കിൽ മണ്ഡലം സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; ‘ആത്മാവിനാൽ’ എന്ന് വ്യക്തമാക്കി ഗ്രീക്കിലെ അവ്യക്തത നീക്കുന്നില്ല.
- source_word: ἀνακρίνεται
  choice: വിവേചിക്കപ്പെടുന്നത്
  rationale: ἀνακρίνω എന്നതിന് പരിശോധിക്കുക, വിലയിരുത്തുക, വിവേചിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. സന്ദർഭത്തിലെ ശരിയായ ഗ്രഹണവും വിധിനിർണയവും ‘വിവേചിക്കുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ψυχικὸς ἄνθρωπος എന്ന പ്രയോഗവും ആത്മീയ വിവേചനവുമായുള്ള വൈരുധ്യം
  choice: സ്വാഭാവികനായ മനുഷ്യൻ
  alternative: ആത്മീയനല്ലാത്ത മനുഷ്യൻ; ആത്മാവില്ലാത്ത മനുഷ്യൻ
  rationale: തിരഞ്ഞെടുത്ത രൂപം ഗ്രീക്കിലെ വൈരുധ്യം നിലനിർത്തുന്നു; എന്നാൽ ആ മനുഷ്യന് ആത്മാവില്ലെന്ന് മൂലപാഠത്തേക്കാൾ വ്യക്തമാക്കി സിദ്ധാന്തപരമായി തീർപ്പാക്കുന്നില്ല.
- issue: πνευματικῶς എന്നതിലെ ആത്മാവ്/ആത്മീയം എന്ന അവ്യക്തത
  choice: ആത്മീയമായിട്ട്
  alternative: ആത്മാവിനാൽ
  rationale: ഗ്രീക്ക് ക്രിയാവിശേഷണത്തിന്റെ രീതി/മണ്ഡലം എന്ന തുറന്ന സ്വഭാവം നിലനിർത്തുന്നു; ദൈവാത്മാവിന്റെ പ്രവർത്തനം പ്രസക്തമായിരിക്കുമ്പോഴും അതിനെ വ്യാകരണത്തിൽ വ്യക്തമാക്കിയ കാരകമായി മാറ്റുന്നില്ല.
- issue: ἀνακρίνεται എന്ന കർമണിപ്രയോഗത്തിന്റെ പരിധി
  choice: വിവേചിക്കപ്പെടുന്നത്
  alternative: വിലയിരുത്തപ്പെടുന്നത്; പരിശോധിക്കപ്പെടുന്നത്
  rationale: ആത്മീയ യാഥാർഥ്യങ്ങളെ ശരിയായി തിരിച്ചറിയുന്നതും വിലയിരുത്തുന്നതും തമ്മിലുള്ള പൗലോസിന്റെ ഉദ്ദേശ്യപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അയാൾ’ ആവർത്തിക്കുന്നത് ഏകവചന പ്രതിനിധാനപരമായ മനുഷ്യനെ വ്യക്തമായി പിന്തുടരാൻ സഹായിക്കുന്നു. പ്രധാനപാഠത്തിൽ [a], [b] എന്നീ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ചേർത്തിരിക്കുന്നു.
