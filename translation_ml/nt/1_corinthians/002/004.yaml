id: 1CO.2.4
reference: 1 Corinthians 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὁ λόγος μου καὶ τὸ κήρυγμά μου οὐκ ἐν ⸂πειθοῖ σοφίας⸃ ἀλλ’ ἐν ἀποδείξει πνεύματος καὶ δυνάμεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/004.yaml
  text: And my speech and my proclamation were not with persuasive wisdom, but with a demonstration of the Spirit and of power,
translation:
  language: ml
  text: എന്റെ സംസാരവും എന്റെ പ്രസംഗവും ജ്ഞാനത്തിന്റെ ബോധ്യപ്പെടുത്തുന്ന വാക്കുകളിലല്ല[b], ദൈവാത്മാവിന്റെയും ശക്തിയുടെയും പ്രകടനത്തിലായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ആത്മാവിന്റെയും ശക്തിയുടെയും പ്രകടനത്തിൽ”; ‘ആത്മാവ്’ ഇവിടെ പൊതുവായ അർഥത്തിലോ ആത്മികഭാവം എന്ന അർഥത്തിലോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ജ്ഞാനത്തിന്റെ പ്രേരണാപരമായ വാക്കുകളിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: സംസാരം
  rationale: ഇവിടെ പൗലോസ് തന്റെ സംസാരരീതിയെ സൂചിപ്പിക്കുന്നു; ‘വചനം’ അല്ലെങ്കിൽ ‘സന്ദേശം’ എന്നതിനെക്കാൾ പ്രസംഗശൈലിയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും κήρυγμα എന്നതിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κήρυγμα
  choice: പ്രസംഗം
  rationale: പ്രഖ്യാപിക്കപ്പെട്ട പ്രസംഗം എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; λόγος എന്ന ‘സംസാരം’ എന്നതുമായി ലയിപ്പിക്കുന്നില്ല.
- source_word: πειθοῖ σοφίας
  choice: ജ്ഞാനത്തിന്റെ പ്രേരണാപരമായ വാക്കുകളിൽ
  rationale: πειθός എന്ന അപൂർവ രൂപത്തിന്റെ ‘പ്രേരിപ്പിക്കുന്ന/ബോധ്യപ്പെടുത്തുന്ന’ ഭാവവും σοφίας എന്ന ബന്ധവും വ്യക്തമാക്കുന്നു. ‘വാക്കുകൾ’ ഗ്രീക്കിൽ പ്രകടമായി ഇല്ലാത്തതിനാൽ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള വഴിവായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀποδείξει
  choice: പ്രകടനം
  rationale: വെറും വാഗ്ചാതുര്യത്തിലൂടെയുള്ള പ്രേരണയ്ക്കു വിപരീതമായി ആത്മാവും ശക്തിയും തെളിഞ്ഞുകാണിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘തെളിവ്’ എന്നതിലുപരി സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: πνεύματος
  choice: ആത്മാവ്
  rationale: സമീപസന്ദർഭത്തിലെ ദൈവിക പ്രവർത്തനവും തുടർന്നുള്ള ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്ന പരാമർശങ്ങളും പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി പിന്തുണയ്ക്കുന്നു; എന്നാൽ ‘ആത്മാവ്/ആത്മികഭാവം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: δυνάμεως
  choice: ശക്തി
  rationale: Pauline പ്രയോഗത്തിലെ സാധാരണവും വ്യക്തവുമായ തത്തുല്യം; πνεύματος-നോടൊപ്പം ചേർന്ന ഘടനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεύματος എന്നത് പരിശുദ്ധാത്മാവിനെയോ ആത്മാവിനെയോ/ആത്മികഭാവത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാനവാചകത്തിൽ ദൈവത്തിന്റെ ആത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: ‘ആത്മാവ്’ എന്ന പൊതുവായ അർഥം, അല്ലെങ്കിൽ ‘ആത്മികഭാവം’
  rationale: 1 കൊരിന്ത്യർ 2-ലെ വിപുലമായ വാദം മനുഷ്യജ്ഞാനത്തെയും ദൈവത്തിൽനിന്നുള്ള വെളിപ്പെടുത്തലിനെയും തമ്മിൽ വേർതിരിക്കുകയും ദൈവത്തിന്റെ ആത്മാവിനെ വ്യക്തമായി പരാമർശിക്കുകയും ചെയ്യുന്നു. മലയാളലിപിയിൽ capitalization വഴി വ്യത്യാസപ്പെടുത്താനാകാത്തതിനാൽ അടിക്കുറിപ്പ് യഥാർഥമായ അർഥസന്ദിഗ്ധത വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ οὐκ ἐν … ἀλλ’ ἐν എന്ന സമാന്തര വൈരുധ്യം ‘…വാക്കുകളിലല്ല … പ്രകടനത്തിലായിരുന്നു’ എന്ന് നിലനിർത്തി. Malayalam capitalization ഇല്ലാത്തതിനാൽ πνεῦμα സംബന്ധിച്ച വ്യാഖ്യാനവ്യത്യാസം അടിക്കുറിപ്പിലൂടെ രേഖപ്പെടുത്തി.
