id: 1CO.2.10
reference: 1 Corinthians 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവം ആത്മാവിലൂടെ ഇവ നമുക്കു വെളിപ്പെടുത്തിയിരിക്കുന്നു[a]. ആത്മാവ് സകലവും, ദൈവത്തിന്റെ ആഴങ്ങൾപോലും[b], ആരായുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവ നമുക്കു വെളിപ്പെടുത്തി.” നേരിട്ടുള്ള കർമപദം ഗ്രീക്കിൽ പ്രകടമല്ല; അത് മുൻസന്ദർഭത്തിൽനിന്നാണ് ഗ്രഹിക്കപ്പെടുന്നത്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “ദൈവത്തിന്റെ ആഴമായ കാര്യങ്ങൾപോലും.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκάλυψεν
  choice: വെളിപ്പെടുത്തിയിരിക്കുന്നു
  rationale: ഗ്രീക്ക് ഏറിസ്റ്റ് ദൈവിക വെളിപ്പെടുത്തലിനെ പൂർത്തിയായ സംഭവമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം അതിന്റെ ഇപ്പോഴുള്ള പ്രസക്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കു
  rationale: ദാതൃവിഭക്തി വെളിപ്പെടുത്തൽ ലഭിച്ചവരെ സൂചിപ്പിക്കുന്ന പരോക്ഷകർമമായി പരിഭാഷപ്പെടുത്തി.
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: ഇവ
  rationale: ഗ്രീക്കിൽ നേരിട്ടുള്ള കർമപദം പ്രകടമല്ലെങ്കിലും മുൻസന്ദർഭത്തിലെ കാര്യങ്ങളാണ് ഉദ്ദേശിക്കുന്നത്; ‘ഇവ’ ആ ബന്ധം അമിതവ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦ πνεύματος
  choice: ആത്മാവിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά മാർഗമോ മധ്യസ്ഥപ്രവർത്തനമോ സൂചിപ്പിക്കുന്നു; ‘ആത്മാവിലൂടെ’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ദൈവിക വെളിപ്പെടുത്തലും ദൈവത്തിന്റെ ആഴങ്ങളെക്കുറിച്ചുള്ള അറിവും പറയുന്ന സന്ദർഭത്തിൽ ഇത് പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐραυνᾷ
  choice: ആരായുന്നു
  rationale: സൂക്ഷ്മമായി അന്വേഷിച്ചറിയുന്ന സജീവമായ അർഥബലം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: πάντα
  choice: സകലവും
  rationale: പദത്തിന്റെ വിശാലമായ വ്യാപ്തിയും വാക്യത്തിന്റെ ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: പോലും
  rationale: ഇവിടെ καί ഊന്നൽ നൽകുന്നതാണ്; സകലത്തിൽ ദൈവത്തിന്റെ ആഴങ്ങൾവരെ ഉൾപ്പെടുന്നു എന്ന പരമാവധി വ്യാപ്തി ‘പോലും’ വ്യക്തമാക്കുന്നു.
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ആഴങ്ങൾ
  rationale: ആഴം എന്ന മൂലരൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ഔപചാരികമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεῦμα പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യാത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: രണ്ടിടത്തും പരിശുദ്ധാത്മാവ്
  alternative: പൊതുവായ അർഥത്തിൽ മനുഷ്യാത്മാവ്
  rationale: ഉടൻമുമ്പുള്ള വാക്യഭാഗം വെളിപ്പെടുത്തൽ ആത്മാവിലൂടെ വരുന്നതായി പറയുന്നു; ദൈവത്തിന്റെ ആഴങ്ങൾവരെ ആരായുന്നതും ദൈവാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ, എന്നാൽ പൗലോസിന്റെ വാദത്തിന്റെ ഗൗരവവും ‘ആഴങ്ങൾ’ എന്ന രൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
