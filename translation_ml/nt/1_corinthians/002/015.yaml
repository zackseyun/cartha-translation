id: 1CO.2.15
reference: 1 Corinthians 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: ml
  text: എന്നാൽ ആത്മിക വ്യക്തി[a] സകലവും വിലയിരുത്തുന്നു[b]; ആ വ്യക്തിയാകട്ടെ ആരാലും വിലയിരുത്തപ്പെടുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മിക വ്യക്തി’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത് നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന പുരുഷലിംഗ ഏകവചന വിശേഷണമാണ്; ആത്മാവിനാൽ സവിശേഷത പ്രാപിച്ച ഏതൊരു വ്യക്തിയെയും ഇത് പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: b
    text: ‘വിലയിരുത്തുന്നു’ എന്നതിന് ‘പരിശോധിക്കുന്നു’, ‘വിവേചിച്ചറിയുന്നു’, അല്ലെങ്കിൽ ‘വിധിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; വാക്യത്തിലെ ഈ ഗ്രീക്കുക്രിയയുടെ രണ്ടു പ്രയോഗങ്ങൾക്കും ഇതു ബാധകമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνευματικὸς
  choice: ആത്മികനായ വ്യക്തി
  rationale: പുരുഷലിംഗ ഏകവചന വിശേഷണം ഇവിടെ നാമമായി ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും, ഒരു പുരുഷനെ മാത്രം സൂചിപ്പിക്കാതെ ആത്മാവിനാൽ സവിശേഷത കൈവരിച്ച വ്യക്തിയെ പൊതുവായി സൂചിപ്പിക്കുന്നു. ‘ആത്മികനായ വ്യക്തി’ ഗ്രീക്കിന്റെ രൂപത്തോടു ചേർന്നുനിൽക്കുകയും മലയാളത്തിൽ വ്യക്തിപരമായ സൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: വിലയിരുത്തുന്നു / വിലയിരുത്തുന്നില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ക്രിയ ശ്രദ്ധാപൂർവമായ പരിശോധനയെയും വിവേചനത്തെയും സൂചിപ്പിക്കുന്നു; അന്തിമമായ കുറ്റവിധി എന്ന ആശയം നിർബന്ധമല്ല. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ മലയാളക്രിയ ഉപയോഗിച്ച് ഗ്രീക്കിലെ പദാവർത്തനം നിലനിർത്തുന്നു.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ പ്രയോഗം യാതൊരു വിശദീകരണപരമായ പരിമിതിയും ചേർക്കാതെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: αὐτὸς
  choice: ആ വ്യക്തിയെത്തന്നെ
  rationale: αὐτός എന്ന ഊന്നൽ ‘-ത്തന്നെ’ ഉപയോഗിച്ച് നിലനിർത്തുന്നു; അതോടൊപ്പം മലയാളത്തിൽ ലിംഗപരമായി പൊതുവായ പരാമർശവും സാധ്യമാക്കുന്നു.
- source_word: ὑπ’ οὐδενὸς
  choice: ആരും … ഇല്ല
  rationale: ഗ്രീക്കിലെ സമ്പൂർണ നിഷേധം മലയാളത്തിലെ സ്വാഭാവികമായ ‘ആരും … ഇല്ല’ ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആത്മികനായ വ്യക്തിയെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ‘സകലവും’, ‘ആരും … ഇല്ല’ എന്നീ പരിമിതിയില്ലാത്ത പ്രയോഗങ്ങൾ അതേപടി നിലനിർത്തി.
  alternative: പ്രധാനപാഠത്തിൽത്തന്നെ ഇതിനെ ‘ആത്മികകാര്യങ്ങൾ’ എന്നു പരിമിതപ്പെടുത്തുക.
  rationale: വാക്യം അവകാശവാദം പരിമിതപ്പെടുത്താതെ അവതരിപ്പിക്കുന്നു; അതിന്റെ വ്യാഖ്യാനപരമായ ചട്ടക്കൂട് സമീപസന്ദർഭം നൽകുന്നു. പ്രധാനപാഠത്തിൽ പരിധി ചേർക്കുന്നത് ഗ്രീക്ക് പാഠം തുറന്നുവെക്കുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മുൻകൂട്ടി പരിഹരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ആ വ്യക്തിയെത്തന്നെയാകട്ടെ’ എന്ന ഘടന αὐτός എന്നതിന്റെ ഊന്നലും രണ്ടാമത്തെ δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യവും നിലനിർത്തുന്നു; ലിംഗപരമായി അനാവശ്യമായ പുരുഷപരിമിതിയും ഒഴിവാക്കുന്നു.
