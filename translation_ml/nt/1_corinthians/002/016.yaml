id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, “അവനെ ഉപദേശിക്കേണ്ടതിന് കർത്താവിന്റെ മനസ്സ് അറിഞ്ഞവൻ ആർ?”[b] എന്നാൽ നമുക്കാകട്ടെ മശീഹയുടെ മനസ്സുണ്ട്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ മനസ്സ്.”
    reason: lexical_alternative
  - marker: b
    text: പൗലോസ് ഇവിടെ യെശയ്യാവ് 40:13-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: τίς γὰρ
  choice: എന്തെന്നാൽ, … ആർ?
  rationale: γάρ മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ എന്നു നൽകി; τίς ഉന്നയിക്കുന്ന അലങ്കാരപ്രശ്നത്തിന്റെ നേരിട്ടുള്ള ഭാവം ‘ആർ?’ നിലനിർത്തുന്നു.
- source_word: ἔγνω νοῦν κυρίου
  choice: കർത്താവിന്റെ മനസ്സ് അറിഞ്ഞവൻ
  rationale: νοῦς എന്നതിലെ ചിന്ത, ഗ്രഹണം, മനോഭാവം എന്നീ അർത്ഥവ്യാപ്തി ‘മനസ്സ്’ നിലനിർത്തുന്നു; ἔγνω ഇവിടെ വെറും വിവരജ്ഞാനമല്ല, കർത്താവിനെ ഉപദേശിക്കാൻ യോഗ്യമാക്കുന്ന സമഗ്രമായ അറിവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ὃς συμβιβάσει αὐτόν
  choice: അവനെ ഉപദേശിക്കാൻ കഴിയുന്നവൻ ആർ?
  rationale: ഈ ഉദ്ധരണിസന്ദർഭത്തിൽ συμβιβάζω ‘ഉപദേശിക്കുക/നിർദേശം നൽകുക’ എന്ന അർത്ഥത്തിലാണ്. ഗ്രീക്കിലെ αὐτόν എന്ന സർവനാമം വ്യാഖ്യാനിച്ച് പകരം നാമം ചേർക്കാതെ ‘അവനെ’ എന്നു നിലനിർത്തി. ഭാവികാലരൂപത്തിന്റെ അലങ്കാരപ്രശ്നബലം സ്വാഭാവിക മലയാളത്തിൽ കഴിവിനെ ചോദ്യം ചെയ്യുന്ന രൂപത്തിൽ അറിയിച്ചു.
- source_word: ἡμεῖς δὲ
  choice: എന്നാൽ നമുക്കാകട്ടെ
  rationale: δὲ സൂചിപ്പിക്കുന്ന ശക്തമായ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ടും ഊന്നിപ്പറയുന്ന ἡμεῖς എന്നതിന്റെ ഭാവം ‘നമുക്കാകട്ടെ’ കൊണ്ടും പ്രകടമാക്കുന്നു.
- source_word: νοῦν Χριστοῦ ἔχομεν
  choice: മശീഹയുടെ മനസ്സുണ്ട്
  rationale: ἔχομεν എന്ന ലളിതമായ വർത്തമാനകാല പ്രഖ്യാപനം ‘ഉണ്ട്’ എന്നു സ്വാഭാവികമായി നൽകി. Χριστός ഇവിടെ അഭിഷിക്തന്റെ സ്ഥാനപ്പേരായി ഗ്രഹിക്കാവുന്നതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: νοῦν Χριστοῦ എന്ന പ്രയോഗത്തിലെ Χριστοῦ-യുടെ വിവർത്തനം
  choice: മശീഹയുടെ മനസ്സ്
  alternative: ക്രിസ്തുവിന്റെ മനസ്സ്
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരിന്റെ ശക്തി നിലനിർത്തുന്നതിനാൽ ‘മശീഹ’ പ്രധാന പാഠത്തിൽ ഉപയോഗിച്ചു. മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സുപരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം സാധുവായ മറ്റൊരു വിവർത്തനമായി അടിക്കുറിപ്പിൽ നൽകി; ഇതിലൂടെ ദൈവശാസ്ത്രപരമായ അവകാശവാദത്തിൽ മാറ്റമൊന്നും വരുത്തുന്നില്ല.
- issue: കർത്താവിന്റെ മനസ്സ് അറിയുകയും അവനെ ഉപദേശിക്കുകയും ചെയ്യുന്നതിനെക്കുറിച്ചുള്ള അലങ്കാരപ്രശ്നം
  choice: ഉത്തരം ‘ആരുമില്ല’ എന്ന് സൂചിപ്പിക്കുന്ന ചോദ്യം എന്ന നിലയിൽ നിലനിർത്തി
  alternative: ‘ആരും കർത്താവിന്റെ മനസ്സ് അറിഞ്ഞിട്ടില്ല’ എന്ന പ്രസ്താവനയായി തുറന്നുപറയുക
  rationale: ഗ്രീക്ക് പാഠം അലങ്കാരപ്രശ്നരൂപത്തിലാണ്; അതിനെ പ്രസ്താവനയാക്കി മാറ്റാതെ അതിലെ വാചകബലവും യെശയ്യാവുമായുള്ള പ്രതിധ്വനിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഉദ്ധരണിയുടെ അലങ്കാരപ്രശ്നഭാവം നിലനിർത്തിക്കൊണ്ട്, നീണ്ട ഒറ്റവാക്യത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ രണ്ടു ചോദ്യങ്ങളായി അവതരിപ്പിച്ചു.
