id: 1CO.2.12
reference: 1 Corinthians 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: ml
  text: എന്നാൽ നാം സ്വീകരിച്ചിരിക്കുന്നത് ലോകത്തിന്റെ ആത്മാവിനെയല്ല, ദൈവത്തിൽനിന്നുള്ള ആത്മാവിനെയാണ്; ദൈവം നമുക്കു കൃപയായി നൽകിയിരിക്കുന്നവ[b] അറിയുന്നതിനായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അറിയുന്നതിനായി” എന്നതിന് “മനസ്സിലാക്കുന്നതിനായി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “കൃപയായി നൽകിയിരിക്കുന്നവ” എന്നതിന് “സൗജന്യമായി നൽകിയിരിക്കുന്നവ” അല്ലെങ്കിൽ “ദാനമായി നൽകിയിരിക്കുന്നവ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ മലയാളപദം നിലനിർത്തുന്നു. ആദ്യത്തേത് ലോകത്തെ നയിക്കുന്ന സ്വാധീനത്തെയും രണ്ടാമത്തേത് സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ആത്മാവിനെയും സൂചിപ്പിക്കുന്നു; മലയാളലിപിയിൽ വലിയക്ഷരംകൊണ്ട് ഈ വ്യത്യാസം അടയാളപ്പെടുത്താനാവില്ല.
- source_word: κόσμου
  choice: ലോകത്തിന്റെ
  rationale: ഇവിടെ ദൈവത്തിനു വിരുദ്ധമായി നിൽക്കുന്ന ഇപ്പോഴത്തെ മനുഷ്യലോകക്രമത്തെ സൂചിപ്പിക്കുന്ന ലളിതവും സാധാരണവുമായ പരിഭാഷ.
- source_word: ἐλάβομεν
  choice: നാം സ്വീകരിച്ചിരിക്കുന്നത്
  rationale: ഭൂതകാലത്തിൽ ലഭിച്ചതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ അവസ്ഥ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടബന്ധം അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: ἵνα εἰδῶμεν
  choice: അറിയേണ്ടതിനായി
  rationale: ഉദ്ദേശ്യവാക്യം വ്യക്തമായി നിലനിർത്തുകയും οἶδα എന്ന ക്രിയയുടെ അറിവുസംബന്ധമായ അടിസ്ഥാനാർത്ഥം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: χαρισθέντα
  choice: കൃപയോടെ നൽകിയവ
  rationale: χαρίζομαι എന്ന ക്രിയയിലെ കൃപയുടെയും ദാനത്തിന്റെയും ഭാവം വെറും ‘നൽകിയവ’ എന്നതിനെക്കാൾ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: ദൈവം നമുക്കു കൃപയോടെ നൽകിയവ
  rationale: നപുംസകലിംഗ ബഹുവചനത്തിന്റെ വിശാലമായ വ്യാപ്തി നിലനിർത്തുന്നു; ഇത് പ്രത്യേക ആത്മീയവരങ്ങളിൽ മാത്രം ഒതുക്കുന്നില്ല.
theological_decisions:
- issue: πνεῦμα τὸ ἐκ τοῦ θεοῦ എന്നത് പ്രത്യേകമായി പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ദൈവത്തിൽനിന്നുള്ള ആത്മാവ്
  alternative: ദൈവത്തിൽനിന്നുള്ള പരിശുദ്ധാത്മാവ്
  rationale: സന്ദർഭം പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും ഗ്രീക്കിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ല. അതിനാൽ മൂലപാഠത്തിന്റെ രൂപവും അതിലെ സൂക്ഷ്മമായ തുറന്ന നിലയും കാത്തുകൊണ്ട് ‘ദൈവത്തിൽനിന്നുള്ള ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വിരോധഘടന ‘അല്ല ... ആണ്’ എന്ന രൂപത്തിൽ വ്യക്തമായി സൂക്ഷിച്ചു. മലയാളത്തിൽ അക്ഷരവലിപ്പത്തിലൂടെ spirit/Spirit വ്യത്യാസം കാണിക്കാനാവാത്തതിനാൽ സന്ദർഭവും ‘ദൈവത്തിൽനിന്നുള്ള’ എന്ന നിർണ്ണയവുമാണ് അർത്ഥവ്യത്യാസം വ്യക്തമാക്കുന്നത്.
