id: 1CO.2.9
reference: 1 Corinthians 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· Ἃ ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ⸀ὅσα ἡτοίμασεν ὁ θεὸς τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: ml
  text: 'എന്നാൽ എഴുതിയിരിക്കുന്നതുപോലെ: “ഒരു കണ്ണും കണ്ടിട്ടില്ലാത്തതും ഒരു ചെവിയും കേട്ടിട്ടില്ലാത്തതും മനുഷ്യന്റെ[a] ഹൃദയത്തിൽ ഉദിച്ചിട്ടില്ലാത്തതും എന്തൊക്കെയോ, അവയൊക്കെയാണ്[b] തന്നെ സ്നേഹിക്കുന്നവർക്കായി ദൈവം ഒരുക്കിയത്.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ “മനുഷ്യൻ” എന്നത് മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നു; പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല.
    reason: cultural_note
  - marker: b
    text: 'അഥവാ: “മനുഷ്യഹൃദയത്തിൽ കടന്നുവന്നിട്ടില്ലാത്തവ” അല്ലെങ്കിൽ “ആർക്കും ചിന്തയിൽ തോന്നിയിട്ടില്ലാത്തവ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സൂത്രവാക്യവും γέγραπται എന്നതിന്റെ പൂർത്തിയായിട്ടും നിലനിൽക്കുന്ന അർഥഭാവവും നിലനിർത്തുന്നു.
- source_word: Ἃ ... ὅσα
  choice: …കാര്യങ്ങൾ—…ഒരുക്കിയവ
  rationale: ആദ്യ ബന്ധസർവനാമത്തെ അവസാനം പുനരെടുത്ത് വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ കാവ്യാത്മക പുനരുക്തിയോടെ അവതരിപ്പിക്കുന്നു.
- source_word: ὀφθαλμὸς ... οὖς
  choice: ഒരു കണ്ണും … ഒരു ചെവിയും
  rationale: ഗ്രീക്കിലെ ഏകവചന പൊതുപ്രയോഗവും നിഷേധത്തോടൊപ്പമുള്ള ‘ഒന്നും ഇല്ല’ എന്ന ഊന്നലും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: മനുഷ്യന്റെ ഹൃദയത്തിൽ ഉദിച്ചിട്ടില്ലാത്തത്
  rationale: ‘ഹൃദയത്തിലേക്ക് ഉയർന്നുവന്നിട്ടില്ല’ എന്ന ഗ്രീക്ക് രൂപകത്തിന്റെ ആശയം ‘ഉദിക്കുക’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു; ‘ഹൃദയം’ എന്ന ബൈബിൾപരമായ മനുഷ്യാന്തരംഗസൂചനയും സംരക്ഷിക്കുന്നു.
- source_word: ἡτοίμασεν
  choice: ഒരുക്കിയവ
  rationale: ദൈവം പൂർത്തിയാക്കിയ ഒരുക്കത്തെ സന്ദർഭത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: തന്നെ സ്നേഹിക്കുന്നവർക്കായി
  rationale: വർത്തമാനകാല കൃതന്തത്തിന്റെ തുടർച്ചയായ സ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘തന്നെ’ എന്നത് കർത്താവായ ദൈവത്തിലേക്കുള്ള സൂചന വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀνθρώπου എന്ന ഏകവചന പൊതുപ്രയോഗം
  choice: മനുഷ്യന്റെ
  alternative: മനുഷ്യഹൃദയത്തിൽ / ഒരാളുടെ ഹൃദയത്തിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപവും മനുഷ്യവർഗത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന ശക്തിയും നിലനിർത്തുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം ഉദ്ദേശിക്കുന്നതല്ലെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: വാഗ്ദത്ത കാര്യങ്ങളുടെ കാലപരമായ പരിധി
  choice: വാക്യം ഭാവിയിലെ സ്വർഗീയ അനുഗ്രഹങ്ങളിലേക്കു മാത്രം ചുരുക്കാതെ പരിഭാഷപ്പെടുത്തി
  alternative: ദൈവം സ്വർഗത്തിൽ ഒരുക്കിയവ
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം അനുഗ്രഹങ്ങളുടെ സ്ഥലം അല്ലെങ്കിൽ കാലം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു പരിധി മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയുടെ കാവ്യാത്മക സമാന്തരഘടന നിലനിർത്തിയിട്ടുണ്ട്; അപൂർവമോ സഭാവിഭാഗ-സവിശേഷമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
