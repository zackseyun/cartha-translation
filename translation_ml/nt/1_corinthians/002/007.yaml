  text: എന്നാൽ നാം ദൈവത്തിന്റെ ജ്ഞാനം ഒരു മർമമായി[a] സംസാരിക്കുന്നു—മറഞ്ഞുകിടന്ന ആ ജ്ഞാനം, നമ്മുടെ മഹത്ത്വത്തിനായി ദൈവം യുഗങ്ങൾക്കുമുമ്പേ[c] മുൻനിശ്ചയിച്ചത്[b].
