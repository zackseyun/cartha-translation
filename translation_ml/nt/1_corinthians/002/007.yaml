lexical_decisions:
- source_word: λαλοῦμεν
  choice: നാം സംസാരിക്കുന്നു
  rationale: λαλέωയുടെ സാധാരണ അർഥം നിലനിർത്തുകയും ഔപചാരികമായ ‘പ്രഘോഷിക്കുന്നു’ എന്നതിലേക്കു ആശയം ശക്തിപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: θεοῦ σοφίαν
  choice: ദൈവത്തിന്റെ ജ്ഞാനം
  rationale: ഷഷ്ഠീവ്യാകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ ഉടമസ്ഥത/ഉത്ഭവബന്ധമായി നൽകുന്നു.
- source_word: ἐν μυστηρίῳ
  choice: ഒരു മർമമായി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ μυστήριον ദൈവത്തിന്റെ മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെട്ടതുമായ പദ്ധതിയെ സൂചിപ്പിക്കാം. ‘മർമം’ ആ സവിശേഷ ആശയം നിലനിർത്തുന്നു; ‘ആയി’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ ബന്ധത്തിന്റെ ചെറിയൊരു അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
- source_word: τὴν ἀποκεκρυμμένην
  choice: മറച്ചുവെക്കപ്പെട്ടിരുന്ന ആ ജ്ഞാനം
  rationale: സ്ത്രീലിംഗ ഏകവചന കൃദന്തം ‘ജ്ഞാനം’ എന്നതിലേക്കു തിരികെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ആ നാമം ആവർത്തിക്കുന്നത് സൂചന വ്യക്തമാക്കുകയും passive ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: προώρισεν
  choice: മുൻനിശ്ചയിച്ചതാണ്
  rationale: ദൈവത്തിന്റെ മുൻകാല നിർണയത്തെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; എന്നാൽ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സമ്പൂർണ സിദ്ധാന്തവ്യവസ്ഥ പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: πρὸ τῶν αἰώνων
  choice: യുഗങ്ങൾക്കുമുമ്പേ
  rationale: αἰῶνες എന്ന ബഹുവചനത്തിന്റെ കാലിക-പ്രാപഞ്ചിക ഭാവം ‘ലോകം ഉണ്ടാകുന്നതിനുമുമ്പ്’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: εἰς δόξαν ἡμῶν
  choice: നമ്മുടെ മഹത്ത്വത്തിനായി
  rationale: εἰς എന്ന ലക്ഷ്യബന്ധവും δόξαയുടെ ശക്തമായ ദൈവശാസ്ത്രപരമായ അർഥവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സന്ദർഭത്തിൽ προώρισεν എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യം
  choice: മുൻനിശ്ചയിച്ചതാണ്
  alternative: മുൻകൂട്ടി തീരുമാനിച്ചതാണ് / മുൻകൂട്ടി നിയോഗിച്ചതാണ്
  rationale: ക്രിയയിൽ തന്നെയുള്ള മുൻകാല നിർണയത്തിന്റെ ശക്തി ‘മുൻനിശ്ചയിച്ചു’ നിലനിർത്തുന്നു. ആരുടെയോ രക്ഷയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തമായി അതിനെ ചുരുക്കാതെ, ഇവിടെ ജ്ഞാനത്തെക്കുറിച്ച് പാഠം പറയുന്നതു മാത്രമായി വിടുന്നു.
- issue: ἐν μυστηρίῳ എന്നതിൽ മർമവും ജ്ഞാനവും തമ്മിലുള്ള ബന്ധം
  choice: ഒരു മർമമായി
  alternative: ഒരു മർമത്തിൽ / രഹസ്യമായി
  rationale: ഗ്രീക്ക് പ്രയോഗം രീതി, സ്വഭാവം, അല്ലെങ്കിൽ വെളിപ്പെടുത്തപ്പെട്ട ദൈവിക രഹസ്യം എന്ന ആശയങ്ങളിലേക്കു തുറന്നിരിക്കുന്നു. ‘ഒരു മർമമായി’ ഈ ഭാവം പൂർണമായി ഒറ്റ അർഥത്തിലേക്കു ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘മർമം,’ ‘മുൻനിശ്ചയിച്ചു,’ ‘യുഗങ്ങൾ,’ ‘മഹത്ത്വം’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ പൗലോസീയവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്താൻ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ apposition മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി ദീർഘവിരാമവും തുടർന്ന് വിശദീകരണഘടകവും ഉപയോഗിച്ചു.
