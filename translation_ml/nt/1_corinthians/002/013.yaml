id: 1CO.2.13
reference: 1 Corinthians 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἃ καὶ λαλοῦμεν οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις, ἀλλ’ ἐν διδακτοῖς ⸀πνεύματος, πνευματικοῖς πνευματικὰ συγκρίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: ml
  text: 'ഇവയും ഞങ്ങൾ സംസാരിക്കുന്നു: മനുഷ്യജ്ഞാനം പഠിപ്പിച്ച വാക്കുകളിലല്ല, ആത്മാവ് പഠിപ്പിച്ച വാക്കുകളിലാണ്—ആത്മികകാര്യങ്ങളെ ആത്മികവാക്കുകളാൽ വിശദീകരിച്ചുകൊണ്ട്.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആത്മികകാര്യങ്ങൾ ആത്മികരായ ആളുകൾക്ക് വ്യാഖ്യാനിച്ചുകൊണ്ട്.” ഗ്രീക്കിലെ πνευματικοῖς എന്ന പദം ഇവിടെ ‘ആത്മികവാക്കുകളാൽ’ എന്നു മനസ്സിലാക്കാം; അല്ലെങ്കിൽ ‘ആത്മികരായ ആളുകൾക്ക്’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: ഇവയും
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ ദൈവം വെളിപ്പെടുത്തിയ കാര്യങ്ങളിലേക്കുള്ള സ്വാഭാവികമായ സൂചന; καίയുടെ ‘യും’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: λαλοῦμεν
  choice: ഞങ്ങൾ സംസാരിക്കുന്നത്
  rationale: λαλέωയുടെ വാചികമായ ആശയവും പൗലൊസിന്റെ വാക്കുകളെക്കുറിച്ചുള്ള വിരോധാഭാസവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐν διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: മനുഷ്യജ്ഞാനം പഠിപ്പിച്ച വാക്കുകളിലല്ല
  rationale: ἐν എന്നതിന്റെ മാധ്യമസൂചനയും വാക്കുകളുടെ പഠിപ്പിക്കൽ ഉറവിടം മനുഷ്യജ്ഞാനമാണെന്ന അർത്ഥവും സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἀλλ’ ἐν διδακτοῖς πνεύματος
  choice: ആത്മാവ് പഠിപ്പിച്ച വാക്കുകളിലാണ്
  rationale: മുൻപുള്ള λόγοις ഇവിടെ അധ്യാഹരിക്കപ്പെട്ടിരിക്കുന്നതായി എടുത്ത് മലയാളത്തിൽ വ്യക്തമായി ആവർത്തിക്കുന്നു; സന്ദർഭത്തിൽ πνεῦμα പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: ആത്മികകാര്യങ്ങളെ ആത്മികവാക്കുകളാൽ വിശദീകരിച്ചുകൊണ്ട്
  rationale: ഉടൻ മുൻപുള്ള ‘വാക്കുകൾ’ എന്ന വിരോധവുമായി യോജിച്ച് πνευματικοῖςനെ അധ്യാഹൃതമായ ‘വാക്കുകൾ’ എന്ന നപുംസക ദത്തിവായി കാണുന്നു. συγκρίνωയ്ക്ക് സന്ദർഭോചിതമായ ‘വിശദീകരിക്കുക/വ്യാഖ്യാനിക്കുക’ എന്ന അർത്ഥം നൽകുന്നു; യഥാർഥ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: πνεύματος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ് എന്ന വ്യക്തിപരമായ അർത്ഥത്തിൽ ‘ആത്മാവ്’
  alternative: പൊതുവായ ഒരു ആത്മിക ഉറവിടം
  rationale: 1 കൊരിന്ത്യർ 2-ന്റെ സമീപസന്ദർഭം മനുഷ്യജ്ഞാനത്തെയും ദൈവത്തിന്റെ ആത്മാവിനെയും വ്യക്തമായി വേർതിരിക്കുന്നു.
- issue: πνευματικοῖς എന്നതിന്റെ ലിംഗവും സൂചിതനാമവും
  choice: നപുംസകമായി, അധ്യാഹൃതമായ ‘ആത്മികവാക്കുകളാൽ’
  alternative: പുല്ലിംഗമായി, ‘ആത്മികരായ ആളുകൾക്ക്’
  rationale: വാക്യത്തിന്റെ ആദ്യപകുതിയിലെ λόγοις എന്ന ‘വാക്കുകൾ’ സംബന്ധിച്ച വിരോധവുമായി ഇത് ശക്തമായി ബന്ധപ്പെടുന്നു; എങ്കിലും പുല്ലിംഗവായന വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആത്മികം’ എന്ന പദം πνευματικός ആവർത്തിക്കുന്നതിനെ പ്രതിഫലിപ്പിക്കുന്നു. പ്രധാനവായന വാക്കുകളെക്കുറിച്ചുള്ള സന്ദർഭബന്ധം നിലനിർത്തുമ്പോൾ അടിക്കുറിപ്പ് ഗ്രീക്കിലെ യഥാർഥ വ്യാകരണദ്വയാർഥത സംരക്ഷിക്കുന്നു.
