revisions:
- from: ഇവയും ഞങ്ങൾ സംസാരിക്കുന്നത് മനുഷ്യജ്ഞാനം പഠിപ്പിച്ച വാക്കുകളിലല്ല, ആത്മാവ് പഠിപ്പിച്ച വാക്കുകളിലാണ്—ആത്മികകാര്യങ്ങളെ ആത്മികവാക്കുകളാൽ വിശദീകരിച്ചുകൊണ്ട്.[a]
  to: 'ഇവയും ഞങ്ങൾ സംസാരിക്കുന്നു: മനുഷ്യജ്ഞാനം പഠിപ്പിച്ച വാക്കുകളിലല്ല, ആത്മാവ് പഠിപ്പിച്ച വാക്കുകളിലാണ്—ആത്മികകാര്യങ്ങളെ ആത്മികവാക്കുകളാൽ വിശദീകരിച്ചുകൊണ്ട്.[a]'
  rationale: മുഖ്യപാഠത്തിന്റെ അർത്ഥം മാറ്റാതെ, മലയാളത്തിലെ ക്രിയാരൂപം സ്വാഭാവികമാക്കി. കൂടാതെ πνευματικοῖς സംബന്ധിച്ച അടിക്കുറിപ്പിലെ തെറ്റായ നപുംസക-വിശേഷണം നീക്കി, പദത്തിന്റെ യഥാർഥ വാക്യഘടനാപരമായ ദ്വയാർഥത—ആത്മിക വാക്കുകൾ എന്ന ഉപകരണം അല്ലെങ്കിൽ ആത്മികരായ ആളുകൾ എന്ന സ്വീകർത്താക്കൾ—നിഷ്പക്ഷമായി സൂക്ഷിച്ചു.
