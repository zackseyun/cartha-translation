id: 1CO.2.5
reference: 1 Corinthians 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: ml
  text: നിങ്ങളുടെ വിശ്വാസം മനുഷ്യരുടെ ജ്ഞാനത്തിലല്ല, മറിച്ച് ദൈവത്തിന്റെ ശക്തിയിലായിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ആയിരിക്കേണ്ടതിന്
  rationale: പൗലോസ് ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵνα-ഉപവാക്യം ഉപയോഗിക്കുന്നു. മലയാളത്തിൽ ‘ആയിരിക്കേണ്ടതിന്’ അതിന്റെ ലക്ഷ്യാർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ കൊരിന്ത്യരുടെ വിശ്വസിക്കുന്ന പ്രതികരണമാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ‘വിശ്വാസം’ ഏറ്റവും യോജിച്ച പൊതുപദമാണ്.
- source_word: μὴ ᾖ
  choice: അല്ല ... ആയിരിക്കേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ നിഷേധാർഥക വർത്തമാനകാല subjunctive ഉദ്ദേശ്യം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ഈ ഘടന നിഷേധവും ലക്ഷ്യാർഥവും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: ἐν σοφίᾳ ἀνθρώπων
  choice: മനുഷ്യരുടെ ജ്ഞാനത്തിൽ
  rationale: ἀνθρώπων ഇവിടെ പൊതുവായി മനുഷ്യരെ സൂചിപ്പിക്കുന്നു. ലിംഗഭേദമില്ലാത്ത ഈ അർഥം മലയാളത്തിൽ ‘മനുഷ്യരുടെ’ എന്നു കൃത്യമായി ലഭിക്കുന്നു; ἐν വിശ്വാസത്തിന്റെ ആധാരം/ആശ്രയം സൂചിപ്പിക്കുന്ന ഘടനയായി നിലനിർത്തുന്നു.
- source_word: ἐν δυνάμει θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തിയിൽ
  rationale: ആദ്യത്തെ ἐν-പ്രയോഗത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും വിശ്വാസത്തിന്റെ ആധാരം ദൈവത്തിന്റെ ശക്തിയാണെന്ന വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν എന്നതിലൂടെ വിശ്വാസത്തിന്റെ ബന്ധം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: ‘ജ്ഞാനത്തിൽ ... ശക്തിയിൽ’ എന്ന സമാന്തര രൂപം
  alternative: ‘ജ്ഞാനത്തെ ആശ്രയിച്ചല്ല ... ശക്തിയെ ആശ്രയിച്ചായിരിക്കണം’
  rationale: മൂലപാഠത്തിന്റെ സംക്ഷിപ്തമായ സമാന്തര ഘടനയും ‘മനുഷ്യരുടെ ജ്ഞാനം / ദൈവത്തിന്റെ ശക്തി’ എന്ന ദൈവശാസ്ത്രപരമായ വൈരുധ്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു; ‘ആശ്രയം’ എന്ന ആശയം വ്യാഖ്യാനമായി ചേർക്കുന്നില്ല.
- issue: ἀνθρώπων എന്നതിന്റെ ലിംഗസൂചന
  choice: ‘മനുഷ്യരുടെ’
  alternative: ‘പുരുഷന്മാരുടെ’
  rationale: ഇവിടെ ἄνθρωπος പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു. അതിനാൽ ആ അർഥം ആധുനിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലഗ്രീക്കിലെ ഉദ്ദേശ്യോപവാക്യവും ഇരട്ട ἐν-ഘടനയുടെ സമാന്തരതയും സംരക്ഷിച്ചിരിക്കുന്നു.
