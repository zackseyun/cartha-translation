- from: നിങ്ങളുടെ വിശ്വാസം മനുഷ്യരുടെ ജ്ഞാനത്തിലല്ല, ദൈവത്തിന്റെ ശക്തിയിലായിരിക്കേണ്ടതിന്.
  to: നിങ്ങളുടെ വിശ്വാസം മനുഷ്യരുടെ ജ്ഞാനത്തിലല്ല, മറിച്ച് ദൈവത്തിന്റെ ശക്തിയിലായിരിക്കേണ്ടതിന്.
