review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders πίστις, the generic sense of ἀνθρώπων, and the parallel contrast between human wisdom and God's power. However, it omits the explicit adversative ἀλλ’ (‘but/rather’), which is a meaningful element of the Greek contrast.
  naturalness: The sentence is understandable and suitably formal in modern standard Malayalam. Adding ‘മറിച്ച്’ makes the contrast clear and yields a more complete, natural parallel structure.
  terminology: ‘വിശ്വാസം,’ ‘മനുഷ്യരുടെ ജ്ഞാനം,’ and ‘ദൈവത്തിന്റെ ശക്തി’ are accurate, natural, and theologically noninterpretive. No footnote is needed, since ‘മനുഷ്യരുടെ’ naturally conveys the generic-human sense of ἀνθρώπων in Malayalam.
  issues:
  - severity: medium
    issue: The adversative conjunction ἀλλ’ is not represented.
    rationale: The Greek explicitly contrasts faith being ‘not in human wisdom but in God’s power.’ Malayalam should retain this contrast with ‘മറിച്ച്’ (or an equivalent).
  revised_text: നിങ്ങളുടെ വിശ്വാസം മനുഷ്യരുടെ ജ്ഞാനത്തിലല്ല, മറിച്ച് ദൈവത്തിന്റെ ശക്തിയിലായിരിക്കേണ്ടതിന്.
  revised_footnotes: []
