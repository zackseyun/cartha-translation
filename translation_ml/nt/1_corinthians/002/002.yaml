reference: 1 Corinthians 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങളുടെ ഇടയിൽ യേശു മശീഹയെയും[a]—ക്രൂശിക്കപ്പെട്ട അവനെത്തന്നെയും—അല്ലാതെ മറ്റൊന്നും അറിയാതിരിക്കാൻ ഞാൻ തീരുമാനിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘മശീഹ’ എന്നതിന് ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക്: Χριστός (ക്രിസ്റ്റോസ്).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινά
  choice: തീരുമാനിച്ചു
  rationale: ഇവിടെ κρίνω ന്യായവിധിയെയല്ല, ഉറച്ച മനഃപൂർവമായ തീരുമാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τι εἰδέναι
  choice: മറ്റൊന്നും അറിയേണ്ടതില്ലെന്ന്
  rationale: οὐ ... εἰ μὴ എന്ന നിയന്ത്രണപ്രയോഗത്തോടൊപ്പം, പ്രസ്താവിച്ചിരിക്കുന്ന ഒരേയൊരു വിഷയമല്ലാതെ ഒന്നും അറിയാതിരിക്കാനുള്ള പൗലൊസിന്റെ നിശ്ചയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ ആയിരിക്കുമ്പോൾ
  rationale: കൊരിന്ത്യരോടൊപ്പമുള്ള പൗലൊസിന്റെ സാന്നിധ്യവും ശുശ്രൂഷാസാഹചര്യവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഗ്രീക്കിലെ exceptive construction-ന്റെ നിയന്ത്രണാർഥം നേരിട്ട് നൽകുന്നു.
- source_word: Χριστόν
  choice: മശീഹയായ
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ മശീഹാപദവിയെ മുന്നോട്ടുകൊണ്ടുവരുന്ന ശീർഷകമായി വായിക്കാം; മലയാളത്തിൽ പേരിനോടു സ്വാഭാവികമായി ചേരാൻ ‘മശീഹയായ യേശു’ എന്നു നൽകി.
- source_word: τοῦτον ἐσταυρωμένον
  choice: ക്രൂശിക്കപ്പെട്ടവനായ അവനെത്തന്നെയും
  rationale: τοῦτον നൽകുന്ന ഊന്നൽ ‘അവനെത്തന്നെയും’ സംരക്ഷിക്കുന്നു; perfect passive participle യേശുവിനെ ക്രൂശിക്കപ്പെട്ടവനെന്ന നിലയിൽ മുന്നിൽ നിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദത്തിന്റെ ശീർഷകസ്വഭാവം പ്രകടമായതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: καὶ τοῦτον ἐσταυρωμένον എന്നതിലെ ഊന്നൽ
  choice: ക്രൂശിക്കപ്പെട്ടവനായ അവനെത്തന്നെയും
  alternative: അവൻ ക്രൂശിക്കപ്പെട്ടവനാണെന്നതും
  rationale: വാക്യം യേശുവിനോടൊപ്പം വേറൊരു അറിവുവിഷയം ചേർക്കുന്നതല്ല; അതേ യേശുവിനെ ക്രൂശിക്കപ്പെട്ടവനായി ഊന്നിപ്പറയുകയാണ്. അതിനാൽ demonstrative-ന്റെ ശക്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും നിലനിർത്തി. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഊന്നൽ ദീർഘവ്യാഖ്യാനമാക്കാതെ ഡാഷുകൾകൊണ്ട് വേർതിരിച്ചു; ‘അവനെത്തന്നെയും’ എന്ന രൂപം τοῦτον എന്ന പദത്തിന്റെ ഊന്നൽ പ്രകടമാക്കുന്നു.
