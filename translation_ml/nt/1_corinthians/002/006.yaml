id: 1CO.2.6
reference: 1 Corinthians 2:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: ml
  text: എന്നാൽ പക്വതയുള്ളവരുടെ ഇടയിൽ ഞങ്ങൾ ജ്ഞാനം പറയുന്നു[a]. എന്നാൽ അത് ഈ യുഗത്തിന്റെ ജ്ഞാനമോ ഈ യുഗത്തിലെ ഭരണാധികാരികളുടെ ജ്ഞാനമോ അല്ല[b]—ആ ഭരണാധികാരികൾ ശക്തിരഹിതരാക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നവരാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പൂർണതയുള്ളവരുടെ”; ഇവിടെ ആത്മീയമായി പക്വതയുള്ളവരെയാണ് സാധ്യതയേറിയും ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ഈ യുഗത്തിലെ ഭരണാധികാരികൾ” എന്നത് മനുഷ്യ അധികാരികളെയോ ആത്മീയ ശക്തികളെയോ ഇരുകൂട്ടരെയുമോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ “കടന്നുപോകുന്നവർ,” “നിഷ്ഫലമാക്കപ്പെടുന്നവർ,” അല്ലെങ്കിൽ “ഇല്ലാതാക്കപ്പെടുന്നവർ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: ജ്ഞാനം
  rationale: σοφία എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ തർജമ. ഗ്രീക്കിലെ ആവർത്തനത്തിന്റെ ആശയം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: λαλοῦμεν
  choice: ഞങ്ങൾ ... സംസാരിക്കുന്നു
  rationale: λαλέω എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘സംസാരിക്കുക’ നിലനിർത്തുന്നു; ‘പ്രഘോഷിക്കുന്നു’ എന്നു നൽകി അർഥം അധികമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐν τοῖς τελείοις
  choice: പക്വതയുള്ളവരുടെ ഇടയിൽ
  rationale: ἐν എന്നത് ഇവിടെ കൂട്ടത്തിനിടയിൽ എന്ന അർഥത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. τέλειοι എന്നതിലെ പക്വത/പൂർണത അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: ഈ യുഗത്തിന്റെ ജ്ഞാനമോ ... അല്ല
  rationale: αἰών എന്നതിനെ κόσμος എന്ന ‘ലോകം’ എന്ന ആശയവുമായി ലയിപ്പിക്കാതെ കാലഘട്ടപരമായ ‘യുഗം’ എന്നു നൽകുന്നു.
- source_word: ἀρχόντων
  choice: ഭരണാധികാരികൾ
  rationale: മനുഷ്യ ഭരണാധികാരികളെയോ ആത്മീയ ശക്തികളെയോ രണ്ടിനെയും കൂടിയോ സൂചിപ്പിക്കാവുന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: τῶν καταργουμένων
  choice: ഇല്ലാതാക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കർമണി കൃദന്തരൂപത്തിന്റെ തുടരുന്ന പ്രക്രിയ വ്യക്തമാക്കുകയും καταργέωയിലെ പ്രവർത്തനരഹിതമാക്കൽ/നിഷ്ഫലമാക്കൽ/ഇല്ലാതാക്കൽ എന്ന അർഥപരിധി അടിക്കുറിപ്പിലൂടെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഈ യുഗത്തിലെ ഭരണാധികാരികൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘ഭരണാധികാരികൾ’ എന്ന വിശാല പ്രയോഗം നിലനിർത്തി.
  alternative: മനുഷ്യ രാഷ്ട്രീയ-മത നേതാക്കൾ; ആത്മീയ ശക്തികൾ; അല്ലെങ്കിൽ ഇരുകൂട്ടരും.
  rationale: ഗ്രീക്ക് പദപ്രയോഗം ഇവയിൽ ഒന്നിനെ നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ വൈരുധ്യവും ആവർത്തനവും തുടരുന്ന കർമണി പ്രവർത്തിയും സംരക്ഷിച്ചിരിക്കുന്നു; വിവാദമായ ഭരണാധികാരികളുടെ സ്വഭാവം മുഖ്യപാഠത്തിൽ നിർണയിച്ചിട്ടില്ല.
