revisions:
- from: സഹോദരങ്ങളേ[a], ഞാനും നിങ്ങളുടെ അടുക്കൽ വന്നപ്പോൾ, വാക്കിന്റെയോ ജ്ഞാനത്തിന്റെയോ മികവോടെയല്ല വന്നത്; ദൈവത്തിന്റെ സാക്ഷ്യം[b] നിങ്ങളോടു പ്രഖ്യാപിച്ചുകൊണ്ടായിരുന്നു.
  to: സഹോദരങ്ങളേ[a], ഞാനും നിങ്ങളുടെ അടുക്കൽ വന്നപ്പോൾ, വാക്കിന്റെയോ ജ്ഞാനത്തിന്റെയോ മികവോടെയല്ല ദൈവത്തിന്റെ സാക്ഷ്യം[b] നിങ്ങളോടു പ്രഖ്യാപിച്ചുകൊണ്ട് വന്നത്.
  rationale: The revision only repairs the Malayalam clause structure. It preserves the temporal ‘വന്നപ്പോൾ … വന്നത്’ correspondence to ἐλθὼν … ἦλθον, the negated manner ‘വാക്കിന്റെയോ ജ്ഞാനത്തിന്റെയോ മികവോടെയല്ല,’ and the participial force of καταγγέλλων in ‘പ്രഖ്യാപിച്ചുകൊണ്ട്.’ The SBLGNT reading and both footnote anchors remain unchanged.
  reviewer_model: gpt-5.6-terra
