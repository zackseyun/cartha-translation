id: 1CO.2.1
reference: 1 Corinthians 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: ml
  text: സഹോദരങ്ങളേ[a], ഞാനും നിങ്ങളുടെ അടുക്കൽ വന്നപ്പോൾ, വാക്കിന്റെയോ ജ്ഞാനത്തിന്റെയോ മികവോടെയല്ല ദൈവത്തിന്റെ സാക്ഷ്യം[b] നിങ്ങളോടു പ്രഖ്യാപിച്ചുകൊണ്ട് വന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരങ്ങളേ” എന്നത് സഭയിലെ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാം.
    reason: cultural_note
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ദൈവത്തിന്റെ രഹസ്യം” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: ഞാനും
  rationale: καί എന്ന ബന്ധകഭാവവും ഊന്നിപ്പറഞ്ഞ ഒന്നാംപുരുഷ സർവനാമവും അതിരുകടക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐλθὼν … ἦλθον
  choice: വന്നപ്പോൾ … വന്നത്
  rationale: കൃതന്തവും പ്രധാന ക്രിയയും തമ്മിലുള്ള കാലസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനവും സാധ്യമായത്ര നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: പുരുഷലിംഗത്തിലുള്ള സംബോധനരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; മിശ്രസഭയിലെ സഹവിശ്വാസികളെ പൊതുവായി സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: വാക്കിന്റെയോ ജ്ഞാനത്തിന്റെയോ മികവോടെ
  rationale: ὑπεροχή സൂചിപ്പിക്കുന്ന ശ്രേഷ്ഠതയോ പ്രഭാവമോ സ്വാഭാവികമായി അറിയിക്കുന്നു; വാഗ്‌ചാതുര്യത്തിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: καταγγέλλων
  choice: പ്രഖ്യാപിച്ചുകൊണ്ടായിരുന്നു
  rationale: പൊതുവായി അറിയിക്കുക എന്ന ക്രിയയുടെ ഭാവവും വർത്തമാന കൃതന്തത്തിന്റെ അനുബന്ധപ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: μαρτύριον
  choice: സാക്ഷ്യം
  rationale: SBLGNT-യിലെ അച്ചടിച്ചിരിക്കുന്ന വായന പിന്തുടരുകയും പദത്തിന്റെ ഗൗരവവും തുറന്ന അർഥപരിധിയും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഈ ഷഷ്ഠീവ്യാകരണബന്ധം ദൈവത്തിൽനിന്നുള്ളതെന്നോ ദൈവത്തെക്കുറിച്ചുള്ളതെന്നോ വ്യാഖ്യാനിക്കാവുന്നതിനാൽ, അതിനെ നിർണയിക്കാതെ അവ്യക്തത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: μαρτύριον എന്നിടത്തെ പാഠഭേദം
  choice: ദൈവത്തിന്റെ സാക്ഷ്യം
  alternative: ദൈവത്തിന്റെ രഹസ്യം
  rationale: SBLGNT അടിസ്ഥാനപാഠത്തിൽ μαρτύριον (‘സാക്ഷ്യം’) എന്നാണ്. പ്രാധാന്യമുള്ള μυστήριον (‘രഹസ്യം’) എന്ന പാഠഭേദം അവഗണിക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാസംബോധനയും ലളിതമായ വാക്യഘടനയും ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വാക്ക്/ജ്ഞാനം എന്ന വ്യത്യാസവും ‘ദൈവത്തിന്റെ’ എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനാത്മക അവ്യക്തതയും സംരക്ഷിച്ചു.
