base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: ml
  text: ഒരു അപ്പം ഉള്ളതിനാൽ[a], അനേകരായ നാം ഒരു ശരീരമാണ്; കാരണം, നാമെല്ലാവരും ആ ഏക അപ്പത്തിൽനിന്ന് പങ്കുപറ്റുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒരു അപ്പം’ എന്നത് രണ്ടിടത്തും ‘ഒരു അപ്പംമുഴ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പദമായ ἄρτος ഒരു ഏകകമായ അപ്പംമുഴയെ സൂചിപ്പിക്കാം; അതിനാൽ പലരും ഒരേ ഉറവിടത്തിൽനിന്ന് പങ്കുപറ്റുന്ന ചിത്രം കൂടുതൽ വ്യക്തമാകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ആയതിനാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തിന് കാരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἷς ἄρτος
  choice: അപ്പം ഒന്ന്
  rationale: ἄρτος എന്ന പദത്തിന്റെ ‘അപ്പം’ എന്ന അർഥവും ഏകത്വത്തിനുള്ള ഊന്നലും നിലനിർത്തുന്നു; ഒരൊറ്റ അപ്പത്തെ സൂചിപ്പിക്കുന്ന കൂടുതൽ ദൃശ്യമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἓν σῶμα
  choice: ഒരു ശരീരം
  rationale: സമൂഹപരവും കർത്താവിന്റെ അത്താഴവുമായി ബന്ധപ്പെട്ടതുമായ അർഥസാന്ദ്രത വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: οἱ πολλοί
  choice: അനേകരായ നാം
  rationale: വിശ്വാസികളുടെ ബഹുത്വവും ‘ഒരു ശരീരം’ എന്ന ഏകത്വവും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: രണ്ടാം ഉപവാക്യം ആദ്യത്തേതിന്റെ വിശദീകരണമാണെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: πάντες
  choice: നാമെല്ലാവരും
  rationale: മുഴുവൻ സമൂഹത്തിന്റെയും പൊതുവായ പങ്കാളിത്തത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: ആ ഒരേ അപ്പത്തിൽനിന്ന്
  rationale: ἐκ സൂചിപ്പിക്കുന്ന പങ്കിടലിന്റെ ഉറവിടം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും അപ്പത്തിന്റെ ഏകത്വം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μετέχομεν
  choice: പങ്കുപറ്റുന്നു
  rationale: ഒരുമിച്ചുള്ള യഥാർഥ പങ്കാളിത്തം സൂചിപ്പിക്കുന്ന, ഭക്ഷണസന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവിക മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: ഒരേ അപ്പവും ഒരേ ശരീരവും തമ്മിലുള്ള ബന്ധം
  choice: ഒരേ അപ്പത്തിൽ എല്ലാവരും പങ്കുപറ്റുന്നതും അനേകർ ഒരു ശരീരമായിരിക്കുന്നതും തമ്മിലുള്ള പൗലോസിന്റെ ബന്ധം അതേപടി നിലനിർത്തുന്നു.
  alternative: അപ്പം വെറും പ്രതീകമാണെന്നോ, അപ്പത്തിലെ പങ്കാളിത്തം സഭയുടെ ഏകത്വം ഒരു പ്രത്യേക സാക്രമെന്റൽ രീതിയിൽ സൃഷ്ടിക്കുന്നുവെന്നോ വിവർത്തനത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം പങ്കിട്ട അപ്പവും വിശ്വാസികളുടെ ഏകത്വവും തമ്മിൽ ശക്തമായ ബന്ധം സ്ഥാപിക്കുന്നു; എന്നാൽ കർത്താവിന്റെ അത്താഴത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പിൽക്കാല സഭാവിഭാഗീയ നിർവചനങ്ങളിൽ ഒന്നിനെയും വിവർത്തനം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പങ്കുപറ്റുന്നു’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലത്തിലെ പങ്കാളിത്തഭാവം സൂക്ഷിക്കുന്നതുമാണ്; വാക്യം സഭാവിഭാഗീയ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കുന്നു.
