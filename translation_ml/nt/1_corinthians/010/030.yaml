source:
  edition: SBLGNT
  text: εἰ ἐγὼ χάριτι μετέχω, τί βλασφημοῦμαι ὑπὲρ οὗ ἐγὼ εὐχαριστῶ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: ml
  text: ഞാൻ നന്ദിയോടെ പങ്കുകൊള്ളുന്നുവെങ്കിൽ[a], ഞാൻ നന്ദി പറയുന്ന കാര്യത്തെച്ചൊല്ലി എന്നെ നിന്ദിക്കുന്നത് എന്തിന്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഞാൻ കൃപയാൽ പങ്കുകൊള്ളുന്നുവെങ്കിൽ, ഞാൻ നന്ദി പറയുന്ന കാര്യത്തെച്ചൊല്ലി എന്നെ നിന്ദിക്കുന്നത് എന്തിന്?’ ഗ്രീക്കിലെ χάριτι എന്ന പദത്തിന് ‘കൃപയാൽ’ എന്നും അർഥമാകാം. എന്നാൽ പിന്നാലെ ‘ഞാൻ നന്ദി പറയുന്നു’ എന്നു വരുന്നതിനാൽ, ഈ സന്ദർഭത്തിൽ പലരും അതിനെ ‘നന്ദിയോടെ’ എന്നു മനസ്സിലാക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: നന്ദിയോടെ
  rationale: ഭക്ഷണസന്ദർഭവും പിന്നാലെയുള്ള εὐχαριστῶ (‘നന്ദി പറയുന്നു’) എന്ന പ്രയോഗവും കണക്കിലെടുക്കുമ്പോൾ, പങ്കുചേരൽ നന്ദിയോടുകൂടിയാണെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μετέχω
  choice: ഭക്ഷിക്കുന്നു
  rationale: ക്രിയയുടെ അടിസ്ഥാനാർഥം ‘പങ്കുകൊള്ളുന്നു’ എന്നാണെങ്കിലും, തൊട്ടടുത്ത സന്ദർഭം ഭക്ഷണത്തെക്കുറിച്ചായതിനാൽ സാധാരണ മലയാളത്തിൽ ‘ഭക്ഷിക്കുന്നു’ എന്നത് ഉദ്ദേശ്യം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: βλασφημοῦμαι
  choice: എന്നെ കുറ്റപ്പെടുത്തുന്നത്
  rationale: ഇവിടെ ദൈവദൂഷണമല്ല, പൗലോസിന്റെ ഭക്ഷണത്തെച്ചൊല്ലിയുള്ള നിന്ദാപരമായ സംസാരമാണ് ഉദ്ദേശിക്കുന്നത്. ‘കുറ്റപ്പെടുത്തുക’ പൊതുവായ പ്രതികൂല വിമർശനം വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ οὗ
  choice: അതേ കാര്യത്തെച്ചൊല്ലി
  rationale: ആക്ഷേപത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു; നന്ദി പറയുന്നതും കുറ്റപ്പെടുത്തപ്പെടുന്നതും ഒരേ കാര്യത്തെക്കുറിച്ചാണെന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: εὐχαριστῶ
  choice: ഞാൻ നന്ദി പറയുന്ന
  rationale: ഗ്രീക്കിലെ ‘നന്ദി പറയുന്നു’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു. നന്ദി ദൈവത്തോടാണെന്നത് സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും മൂലപാഠത്തിൽ ‘ദൈവം’ വ്യക്തമല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: τί
  choice: എന്തിന്
  rationale: ഈ വാചാടോപചോദ്യത്തിൽ τί കാരണത്തെ ചോദിക്കുന്നതിനാൽ ആധുനിക മലയാളത്തിലെ സ്വാഭാവികമായ ‘എന്തിന്?’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ഭക്ഷണവും നന്ദിപറച്ചിലും സംബന്ധിച്ച χάριτι എന്നതിന്റെ അർഥം
  choice: നന്ദിയോടെ
  alternative: കൃപയാൽ
  rationale: തുടർന്നുവരുന്ന ‘ഞാൻ നന്ദി പറയുന്ന’ എന്ന വാക്ക് χάριτιയെ നന്ദിയുടെയോ കൃതജ്ഞതയുടെയോ ഭാവമായി മനസ്സിലാക്കാൻ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ‘കൃപയാൽ’ എന്ന അർഥസാധ്യത യഥാർഥമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന, എന്നാൽ മാന്യമായ ശൈലി. ഭക്ഷണസന്ദർഭത്തിൽ ‘പങ്കുകൊള്ളുന്നു’ എന്നതിനെക്കാൾ ‘ഭക്ഷിക്കുന്നു’ പ്രധാനവാചകത്തിൽ സ്വാഭാവികം; കൂടുതൽ ശാബ്ദികമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
