- from: ഞാൻ നന്ദിയോടെ ഭക്ഷിക്കുന്നുവെങ്കിൽ[a], ഞാൻ നന്ദി പറയുന്ന അതേ കാര്യത്തെച്ചൊല്ലി എന്നെ കുറ്റപ്പെടുത്തുന്നത് എന്തിന്?
  to: ഞാൻ നന്ദിയോടെ പങ്കുകൊള്ളുന്നുവെങ്കിൽ[a], ഞാൻ നന്ദി പറയുന്ന കാര്യത്തെച്ചൊല്ലി എന്നെ നിന്ദിക്കുന്നത് എന്തിന്?
