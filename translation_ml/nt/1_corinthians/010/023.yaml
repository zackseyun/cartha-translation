  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: ml
  text: “എല്ലാം അനുവദനീയമാണ്,” എന്നാൽ എല്ലാം പ്രയോജനകരമല്ല.[a] “എല്ലാം അനുവദനീയമാണ്,” എന്നാൽ എല്ലാം പടുത്തുയർത്തുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എല്ലാം നിയമാനുസൃതമാണ്.” ഗ്രീക്ക് പ്രയോഗത്തിന് ‘അനുവദനീയമായത്’ എന്നോ ‘നിയമാനുസൃതമായത്’ എന്നോ അർഥമാകാം. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ, ഇത് പൗലോസ് നിയന്ത്രിച്ചു പറയുന്ന കൊരിന്ത്യരുടെ ഒരു മുദ്രാവാക്യമായിരിക്കാം എന്ന സാധ്യത സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative_and_interpretive_punctuation
lexical_decisions:
- source_word: Πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്നു. ആവർത്തിക്കുന്ന, സമഗ്രമായ പ്രസ്താവനയുടെ വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘എല്ലാം’ വ്യക്തമാക്കുന്നു.
- source_word: ἔξεστιν
  choice: അനുവദനീയമാണ്
  rationale: അനുവദിക്കപ്പെട്ടത് അഥവാ നിയമാനുസൃതമായത് എന്ന അർഥം വരുന്ന പദം. ‘അനുവദനീയമാണ്’ ആധുനിക മലയാളത്തിൽ അനുമതിയുടെ ആശയം വ്യക്തമായി നൽകുന്നു; നിയമപരമായ അർഥം മാത്രമായി ചുരുക്കുന്നില്ല.
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: രണ്ട് ഹ്രസ്വ പ്രസ്താവനകൾക്കിടയിലെ ശക്തമായ വൈരുധ്യം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: συμφέρει
  choice: പ്രയോജനകരമല്ല
  rationale: ഉപകാരപ്രദം, ഗുണകരം, അനുകൂലം എന്ന ആശയം ഇവിടെ ഉണ്ട്. വാണിജ്യലാഭത്തിന്റെ ധ്വനി ഒഴിവാക്കി ധാർമികസന്ദർഭത്തിലെ ഗുണത്തെ ‘പ്രയോജനകരം’ വ്യക്തമാക്കുന്നു.
- source_word: οἰκοδομεῖ
  choice: ആത്മികമായി പടുത്തുയർത്തുന്നില്ല
  rationale: അക്ഷരാർഥത്തിലെ പണിയുക എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട്, പൗലോസിന്റെ പ്രയോഗത്തിൽ വ്യക്തിയെയോ സമൂഹത്തെയോ ശക്തിപ്പെടുത്തുന്നതാണ് ഉദ്ദേശ്യമെന്ന് ‘ആത്മികമായി’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Πάντα ἔξεστιν എന്നത് കൊരിന്ത്യരുടെ മുദ്രാവാക്യമായി അടയാളപ്പെടുത്തണമോ
  choice: “എല്ലാം അനുവദനീയമാണ്” എന്ന് ഉദ്ധരണിച്ചിഹ്നങ്ങളിൽ നൽകുക
  alternative: ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെ പൗലോസിന്റെ സ്വന്തം പ്രസ്താവനയായി നൽകുക
  rationale: ആവർത്തിക്കുന്ന വാക്യം കൊരിന്ത്യരുടെ മുദ്രാവാക്യമായിരിക്കാമെന്നും പൗലോസ് അതിനെ നിയന്ത്രിക്കുന്നുവെന്നും വാക്യഘടന സൂചിപ്പിക്കുന്നു. പുരാതന ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിൽ ആധുനിക ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഇല്ലാത്തതിനാൽ ഇത് വ്യാഖ്യാനപരമായ വിരാമചിഹ്നമാണ്; ഉറപ്പില്ലായ്മ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തനവും വൈരുധ്യഘടനയും മൂലപാഠംപോലെ നിലനിർത്തിയിരിക്കുന്നു; οἰκοδομεῖ എന്ന രൂപകം വായനാസൗകര്യത്തിനായി ‘ആത്മികമായി പടുത്തുയർത്തുക’ എന്നു നൽകിയിരിക്കുന്നു.
