language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ ⸂κυρίου γὰρ⸃ ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/026.yaml
  text: For the earth is the Lord’s[a], and all that fills it.
translation:
  language: ml
  text: കാരണം, ഭൂമിയും അതിലുള്ളതെല്ലാം കർത്താവിന്റേതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സങ്കീർത്തനം 24:1-ൽനിന്നുള്ള ഉദ്ധരണി. ‘അതിലുള്ളതെല്ലാം’ എന്നതിന്റെ കൂടുതൽ പദശഃമായ പരിഭാഷ: ‘അതിനെ നിറയ്ക്കുന്നതെല്ലാം’ അഥവാ ‘അതിന്റെ പൂർണത.’'
    reason: cross_reference_and_translation_note
lexical_decisions:
- source_word: κυρίου
  choice: കർത്താവിന്റേതാണ്
  rationale: τοῦ κυρίου എന്ന ഉടമസ്ഥതാസംബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘കർത്താവിന്റേതാണ്’ എന്നു പ്രകടിപ്പിക്കുന്നു; ‘കർത്താവ്’ പുതിയനിയമത്തിലെ κύριος എന്ന പദത്തിന്റെ പതിവായ ദൈവശാസ്ത്രപരമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാദത്തിന് തിരുവെഴുത്തിൽനിന്നുള്ള അടിസ്ഥാനം നൽകുന്ന വിശദീകരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: γῆ
  choice: ഭൂമി
  rationale: സങ്കീർത്തനം 24:1-ലെ ഉദ്ധരണിയിൽ τὸ πλήρωμα αὐτῆς എന്നതിനോടൊപ്പം വരുന്നതിനാൽ ഇവിടെ ‘ദേശം’ എന്നതിനെക്കാൾ സാർവലൗകികമായ ‘ഭൂമി’ യോജിക്കുന്നു.
- source_word: πλήρωμα
  choice: അതിലുള്ളതെല്ലാം
  rationale: τὸ πλήρωμα αὐτῆς എന്നത് ഭൂമിയെ നിറയ്ക്കുന്നതെല്ലാം, അഥവാ അതിലുള്ള സകലവും, എന്ന അർഥത്തിലാണ്. ‘പൂർണത’ എന്ന പദശഃരൂപത്തേക്കാൾ ഇത് സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിൽ കൃത്യവുമാണ്.
- source_word: αὐτῆς
  choice: അതിലുള്ള
  rationale: സ്ത്രീലിംഗ സർവനാമം γῆയെ സൂചിപ്പിക്കുന്നു; πλήρωμαയോടുള്ള ബന്ധം മലയാളത്തിൽ ‘അതിലുള്ളതെല്ലാം’ എന്ന ഏകീകൃത പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ / നാഥൻ
  rationale: പൗലൊസിന്റെ ഗ്രീക്ക് പാഠത്തിലുള്ള κύριος എന്ന പദത്തെ നേരിട്ട് പ്രതിനിധീകരിക്കുകയും സങ്കീർത്തന ഉദ്ധരണിയുടെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുകയും ചെയ്യുന്നു; ഇവിടെ എബ്രായ ദൈവനാമം പാഠത്തിലേക്ക് നേരിട്ട് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വിശദീകരണാത്മകമായ γάρ ‘കാരണം’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി. ഉദ്ധരണിയുടെ ആശയം സ്വാഭാവിക മലയാളവാക്യക്രമത്തിൽ നൽകി.
