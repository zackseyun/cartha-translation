  to: അവർ മോഹിച്ചതുപോലെ നാം തിന്മയായ കാര്യങ്ങൾ മോഹിക്കുന്നവരാകാതിരിക്കേണ്ടതിന്, ഈ സംഭവങ്ങൾ നമുക്കുള്ള ഉദാഹരണങ്ങളായിത്തീർന്നു[a].
