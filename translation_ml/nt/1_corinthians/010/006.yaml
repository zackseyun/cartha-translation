id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: ml
  text: അവർ മോഹിച്ചതുപോലെ നാം തിന്മയായ കാര്യങ്ങൾ മോഹിക്കുന്നവരാകാതിരിക്കേണ്ടതിന്, ഈ സംഭവങ്ങൾ നമുക്കുള്ള ഉദാഹരണങ്ങളായിത്തീർന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമുക്കുള്ള മാതൃകകൾ” അല്ലെങ്കിൽ “നമുക്കുള്ള പ്രതിരൂപങ്ങൾ.”
    reason: τύποι എന്ന ഗ്രീക്ക് പദത്തിന് ഉദാഹരണങ്ങൾ, മാതൃകകൾ, പ്രതിരൂപങ്ങൾ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: Ταῦτα
  choice: ഈ സംഭവങ്ങൾ
  rationale: മുമ്പ് വിവരിച്ച മരുഭൂമിയിലെ സംഭവങ്ങളെയാണ് നപുംസകലിംഗ ബഹുവചന സർവനാമം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സന്ദർഭം വ്യക്തമാക്കാൻ ‘സംഭവങ്ങൾ’ സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് പ്രസംഗത്തിലെ മാറ്റമോ വിശദീകരണമോ സൂചിപ്പിക്കുന്ന ലഘു ബന്ധകമാണ്; മലയാള വാക്യക്രമം തന്നെ ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τύποι
  choice: ഉദാഹരണങ്ങൾ
  rationale: ഈ ഉപദേശാത്മക സന്ദർഭത്തിൽ മുൻകാല സംഭവങ്ങൾ വിശ്വാസികൾക്കുള്ള മുന്നറിയിപ്പായ മാതൃകകളാണ്; ‘ഉദാഹരണങ്ങൾ’ ആ പ്രായോഗിക ശക്തി വ്യക്തമായി നൽകുന്നു, എന്നാൽ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἡμῶν
  choice: നമുക്കുള്ള
  rationale: τύποι എന്ന പദത്തോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘നമുക്കുള്ള ഉദാഹരണങ്ങൾ’ എന്നു പ്രകടമാകുന്നു.
- source_word: ἐγενήθησαν
  choice: ആയിത്തീർന്നു
  rationale: വെറും ‘ആയിരുന്നു’ എന്നതിനെക്കാൾ, ആ സംഭവങ്ങൾ നമുക്കായി ഒരു പ്രത്യേക പ്രവർത്തനം കൈവരിച്ചു എന്ന γίνομαιയുടെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ μὴ εἶναι
  choice: ആകാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള ഗ്രീക്ക് നിർമാണത്തിന്റെ തുറന്ന ഭാവം സൂക്ഷിച്ചുകൊണ്ട് മുന്നറിയിപ്പിന്റെ ലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπιθυμητὰς
  choice: മോഹിക്കുന്നവർ
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന നാമരൂപത്തിന്റെ ഘടന സംരക്ഷിക്കുന്നു; ‘മോഹിക്കുക’ ശക്തമായ തെറ്റായ ആഗ്രഹത്തെ സൂചിപ്പിക്കുമ്പോഴും ലൈംഗിക അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: κακῶν
  choice: തിന്മയായ കാര്യങ്ങൾ
  rationale: മോഹത്തിന്റെ വസ്തുക്കളായ നപുംസകലിംഗ ബഹുവചനത്തെ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ധാർമിക ഗൗരവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: καθὼς κἀκεῖνοι
  choice: അവർ മോഹിച്ചതുപോലെതന്നെ
  rationale: മരുഭൂമിതലമുറയുമായുള്ള താരതമ്യവും καίയുടെ ചേർക്കൽഭാവവും ‘പോലെതന്നെ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: ἐπεθύμησαν
  choice: മോഹിച്ചു
  rationale: ἐπιθυμητάς എന്നതുമായുള്ള പദബന്ധം ഒരേ മലയാള ക്രിയയിലൂടെ നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത കർമം മലയാളത്തിലും സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാം.
theological_decisions:
- issue: τύποι എന്ന പദവും ഇസ്രായേലിന്റെ മരുഭൂമി അനുഭവങ്ങളും തമ്മിലുള്ള ബന്ധം
  choice: ധാർമിക മുന്നറിയിപ്പിന്റെ അർഥത്തിൽ ‘ഉദാഹരണങ്ങൾ’
  alternative: ‘മാതൃകകൾ’ അല്ലെങ്കിൽ സാങ്കേതികമായി ‘പ്രതിരൂപങ്ങൾ’
  rationale: സമീപസന്ദർഭം സഭയ്ക്കുള്ള ഉപദേശവും മുന്നറിയിപ്പുമാണ് ഊന്നുന്നത്. സാങ്കേതികമായ ഒരു typological വ്യവസ്ഥ വിവർത്തനത്തിലേക്ക് കൊണ്ടുവരാതെ പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ἐπιθυμία പദകുടുംബത്തിന്റെ ശക്തിയും വ്യാപ്തിയും
  choice: ‘മോഹിക്കുക’
  alternative: ‘കാമിക്കുക’ അല്ലെങ്കിൽ ‘കൊതിക്കുക’
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് പൊതുവായ പാപകരമായ ആഗ്രഹമാണ്, ലൈംഗിക മോഹം മാത്രമല്ല. ‘മോഹിക്കുക’ ധാർമിക ഗൗരവം സൂക്ഷിക്കുകയും അർഥം അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: εἰς τὸ μὴ εἶναι എന്ന നിർമാണത്തിലെ ഉദ്ദേശ്യം/ഫലം
  choice: ‘ആകാതിരിക്കേണ്ടതിന്’
  alternative: ‘ആകാതിരിക്കുന്നവിധം’
  rationale: ഗ്രീക്ക് നിർമാണം ഉദ്ദേശ്യവും ഫലവും ഉൾക്കൊള്ളാൻ കഴിയുന്നതാണ്; പ്രധാനവാചകം മുന്നറിയിപ്പിന്റെ ലക്ഷ്യം മുന്നിൽവെക്കുന്നു, എന്നാൽ നിർണ്ണായകമായ കാരണബന്ധം അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ἐπιθυμητάς എന്ന നാമരൂപം ‘മോഹിക്കുന്നവർ’ എന്നു നിലനിർത്തിയിട്ടുണ്ട്. പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പുമായി കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
