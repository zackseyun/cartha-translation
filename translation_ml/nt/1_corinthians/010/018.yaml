id: 1CO.10.18
reference: 1 Corinthians 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπετε τὸν Ἰσραὴλ κατὰ σάρκα· ⸀οὐχ οἱ ἐσθίοντες τὰς θυσίας κοινωνοὶ τοῦ θυσιαστηρίου εἰσίν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/018.yaml
  text: 'Consider Israel according to the flesh: are not those who eat the sacrifices participants in the altar?[a][b][c]'
translation:
  language: ml
  text: ജഡപ്രകാരമുള്ള ഇസ്രായേലിനെ പരിഗണിക്കൂ:[a] ബലിവസ്തുക്കൾ ഭക്ഷിക്കുന്നവർ യാഗപീഠത്തിന്റെ പങ്കാളികളല്ലേ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വാഭാവിക വംശപരമ്പരയിലുള്ള ഇസ്രായേലിനെ” അല്ലെങ്കിൽ “ഭൗതിക ഇസ്രായേലിനെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “യാഗപീഠവുമായി പങ്കുചേരുന്നവരല്ലേ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: പരിഗണിക്കൂ
  rationale: ബഹുവചന ആജ്ഞാരൂപം വെറും ദൃശ്യമായി നോക്കുന്നതിലുപരി ചിന്താപൂർവമായ ശ്രദ്ധ ആവശ്യപ്പെടുന്നു; പൗലോസിന്റെ വാദാത്മക ആഹ്വാനത്തിന് സ്വാഭാവികമായ മലയാളം.
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: ജഡപ്രകാരമുള്ള ഇസ്രായേൽ
  rationale: κατὰ σάρκα എന്ന പൗലോസിന്റെ പദപ്രയോഗത്തിലെ ‘ജഡം’ എന്ന രൂപം നിലനിർത്തുന്നു; ഇവിടെ അത് പാപസ്വഭാവമല്ല, സ്വാഭാവിക/വംശീയ ഇറക്കം സൂചിപ്പിക്കുന്നു.
- source_word: οὐχ ... εἰσίν;
  choice: അല്ലേ?
  rationale: οὐχ പ്രതീക്ഷിക്കുന്ന സമ്മതാത്മക ഉത്തരമുള്ള അലങ്കാരചോദ്യത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οἱ ἐσθίοντες
  choice: ഭക്ഷിക്കുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിലെ വ്യക്തമായ ഭക്ഷണപ്രവൃത്തി സംരക്ഷിക്കുന്നു; ഇവിടെത്തന്നെ വ്യാഖ്യാനാത്മകമായ ‘പങ്കുകൊള്ളുന്നവർ’ ചേർക്കുന്നില്ല.
- source_word: τὰς θυσίας
  choice: ബലിവസ്തുക്കൾ
  rationale: ഭക്ഷിക്കപ്പെടുന്ന യാഗാർപ്പണങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്; ‘ബലികൾ ഭക്ഷിക്കുക’ എന്ന അസ്വാഭാവികത ഒഴിവാക്കി അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: κοινωνοὶ
  choice: പങ്കാളികൾ
  rationale: യാഗപീഠവുമായി ബന്ധപ്പെട്ട യഥാർഥ പങ്കാളിത്തവും കൂട്ടായ്മയും വ്യക്തമാക്കുന്ന ആധുനികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: τοῦ θυσιαστηρίου
  choice: യാഗപീഠത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠിവിഭക്തി നേരിട്ട് നിലനിർത്തി, യാഗപീഠവുമായി ബന്ധപ്പെട്ട പങ്കാളിത്തത്തിന്റെ കൃത്യമായ സ്വഭാവം അനാവശ്യമായി തീർപ്പാക്കാതെ വിടുന്നു.
theological_decisions:
- issue: ‘ജഡപ്രകാരമുള്ള ഇസ്രായേൽ’ എന്നതിന്റെ അർത്ഥം
  choice: ഇവിടെ സ്വാഭാവിക വംശപരമ്പരയിലുള്ള ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം അതിന്റെ ‘ജഡം’ എന്ന ഭാഷയോടെ നിലനിർത്തി.
  alternative: വംശപരമ്പരയിലുള്ള ഇസ്രായേൽ; ഭൗതിക ഇസ്രായേൽ
  rationale: സന്ദർഭത്തിൽ ഇത് യാഗാചാരത്തിൽനിന്നുള്ള ഒരു ഉപമയായി വംശീയ/സ്വാഭാവിക ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്നു. ഇസ്രായേലും സഭയും തമ്മിലുള്ള വിപുലമായ ദൈവശാസ്ത്രബന്ധം പരിഭാഷയിൽ തീരുമാനിക്കുന്നില്ല.
- issue: യാഗപീഠത്തോടുള്ള κοινωνίαയുടെ സ്വഭാവം
  choice: ‘യാഗപീഠത്തിന്റെ പങ്കാളികൾ’ എന്ന ഷഷ്ഠിവിഭക്തി ഘടന നിലനിർത്തി.
  alternative: യാഗപീഠവുമായി പങ്കുചേരുന്നവർ; യാഗപീഠത്തിലെ പങ്കാളികൾ
  rationale: κοινωνοὶ τοῦ θυσιαστηρίου യാഗപീഠവുമായി ബന്ധപ്പെട്ട യഥാർഥ ആരാധനാപര പങ്കാളിത്തം സൂചിപ്പിക്കുന്നു; ബന്ധത്തെ ‘കൂടെ’ എന്നോ ‘അകത്ത്’ എന്നോ മാത്രം പരിമിതപ്പെടുത്താതെ മൂലത്തിലെ സങ്കുചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജഡപ്രകാരമുള്ള’ എന്ന അല്പം അടയാളപ്പെടുത്തിയ പൗലോസീയ പ്രയോഗം ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കാൻ നിലനിർത്തി; അടിക്കുറിപ്പിൽ സാധാരണഭാഷാ വിശദീകരണം നൽകി.
