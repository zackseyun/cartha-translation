id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: ml
  text: മനുഷ്യർക്കു സാധാരണമായതല്ലാതെ ഒരു പ്രലോഭനവും[b] നിങ്ങളെ പിടികൂടിയിട്ടില്ല.[a] എന്നാൽ ദൈവം വിശ്വസ്തനാണ്; നിങ്ങൾക്കു സഹിക്കാവുന്നതിലധികം പ്രലോഭിപ്പിക്കപ്പെടാൻ അവിടന്ന് അനുവദിക്കുകയില്ല. പ്രലോഭനത്തോടൊപ്പം, അതു സഹിച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയേണ്ടതിന്, അതിൽനിന്നു കടന്നുപോകാനുള്ള വഴിയും[c] അവിടന്ന് ഒരുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യസഹജമായതല്ലാതെ.”
    reason: lexical_alternative
  - marker: b
    text: ഈ വാക്യത്തിലെ “പ്രലോഭനം,” “പ്രലോഭിപ്പിക്കപ്പെടുക” എന്നീ പദങ്ങൾ “പരീക്ഷണം,” “പരീക്ഷിക്കപ്പെടുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: “അതിൽനിന്നു കടന്നുപോകാനുള്ള വഴി” എന്നതിന് “രക്ഷാമാർഗം,” “പുറത്തേക്കുള്ള വഴി,” അല്ലെങ്കിൽ “പരിണതി” എന്നും അർഥമാകാം. ഇവിടെ ദൈവം ഒരുക്കുന്ന മാർഗം പ്രലോഭനത്തിനിടയിൽ സഹിച്ചുനിൽക്കാൻ പ്രാപ്തരാക്കുന്നതായി വാക്യത്തിന്റെ അവസാനം വ്യക്തമാക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: പ്രലോഭനം / പ്രലോഭിപ്പിക്കപ്പെടുക
  rationale: മുൻസന്ദർഭത്തിലെ ദുഷ്ടമോഹത്തെയും വിഗ്രഹാരാധനയെയും കുറിച്ചുള്ള മുന്നറിയിപ്പുകൾ കണക്കിലെടുത്ത് ധാർമിക പ്രലോഭനത്തിന്റെ അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ‘പരീക്ഷണം’ എന്ന വിശാല അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: εἴληφεν
  choice: പിടികൂടിയിട്ടില്ല
  rationale: ലംബാനോയുടെ പൂർണകാലരൂപം അനുഭവം വായനക്കാരെ പിടികൂടിയിരിക്കുന്നു എന്ന ആശയം നൽകുന്നു; ഈ മലയാളപ്രയോഗം അതിന്റെ ബലം സ്വാഭാവികമായി പകരുന്നു.
- source_word: εἰ μὴ ἀνθρώπινος
  choice: മനുഷ്യർക്കു സാധാരണമായതല്ലാതെ
  rationale: ἀνθρώπινος മനുഷ്യസഹജമായതോ മനുഷ്യാനുഭവത്തിനു പൊതുവായതോ സൂചിപ്പിക്കുന്നു. അസാധാരണമോ അതിമാനുഷികമോ ആയ പ്രലോഭനം എന്ന ആശയം ഒഴിവാക്കി ഉൾക്കൊള്ളാവുന്ന ആധുനിക മലയാളം ഉപയോഗിച്ചു.
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ദൈവത്തിന്റെ ആശ്രയയോഗ്യതയും വാഗ്ദത്തം പാലിക്കുന്ന സ്ഥിരതയും നേരിട്ട് പ്രകടിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾ മലയാളപദം.
- source_word: ἐάσει
  choice: അനുവദിക്കുകയില്ല
  rationale: അനുവദിക്കുക/സമ്മതിക്കുക എന്ന അർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπὲρ ὃ δύνασθε
  choice: നിങ്ങൾക്കു സഹിക്കാവുന്നതിലധികം
  rationale: ശേഷിക്കപ്പുറം എന്ന ഗ്രീക്ക് ഘടന നിലനിർത്തിക്കൊണ്ട്, സന്ദർഭത്തിലെ സഹനവുമായി ബന്ധിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
- source_word: ποιήσει
  choice: ഒരുക്കും
  rationale: ποιέω അടിസ്ഥാനമായി ‘ചെയ്യുക/ഉണ്ടാക്കുക’ എന്നാണെങ്കിലും ἔκβασις-നോടുള്ള ചേർച്ചയിൽ ദൈവം മാർഗം സജ്ജമാക്കുന്നു എന്ന അർഥം ‘ഒരുക്കും’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σὺν τῷ πειρασμῷ
  choice: പ്രലോഭനത്തോടൊപ്പം
  rationale: ദൈവത്തിന്റെ കരുതൽ പ്രലോഭനത്തെ ഉടൻ നീക്കണമെന്നില്ല; അതിനൊപ്പം ലഭിക്കുന്നു എന്ന σύν-ന്റെ സഹവർത്തിത്വം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἔκβασιν
  choice: അതിൽനിന്നു കടന്നുപോകാനുള്ള വഴി
  rationale: ἔκβασις പുറപ്പെടൽ, രക്ഷാമാർഗം, പരിണതി എന്നിവ സൂചിപ്പിക്കാം. തുടർന്നുള്ള ‘സഹിച്ചുനിൽക്കുക’ എന്ന ആശയത്തോടു ചേർന്ന്, വെറും ഒഴിഞ്ഞുമാറൽ എന്ന ധാരണ ഒഴിവാക്കി പ്രലോഭനത്തിലൂടെ നിലനിന്നു കടന്നുപോകാൻ ദൈവം ഒരുക്കുന്ന മാർഗം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: അതു സഹിച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയേണ്ടതിന്
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യ/ഫലബന്ധവും ὑποφέρω എന്നതിലെ ഭാരത്തിനടിയിൽ നിലനിൽക്കുന്ന സഹനവും വ്യക്തമായി പകരുന്നു.
theological_decisions:
- issue: πειρασμός/πειρασθῆναι എന്നതിന്റെ ധാർമിക പ്രലോഭനവും വിശാലമായ പരീക്ഷണവും തമ്മിലുള്ള അർഥവ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘പ്രലോഭനം/പ്രലോഭിപ്പിക്കപ്പെടുക’
  alternative: ‘പരീക്ഷണം/പരീക്ഷിക്കപ്പെടുക’
  rationale: 1 കൊരിന്ത്യർ 10-ലെ സമീപസന്ദർഭം പാപമോഹത്തെയും വിഗ്രഹാരാധനയെയും മുന്നിൽ നിർത്തുന്നതിനാൽ ധാർമിക അർഥം മുൻഗണിച്ചു. എന്നാൽ ദൈവം തിന്മയിലേക്കു പ്രേരിപ്പിക്കുന്നു എന്നു വ്യാഖ്യാനിക്കാതെയും ‘പരീക്ഷണം’ എന്ന യഥാർഥ പദാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചും ഉള്ളിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തി.
- issue: ἔκβασις ദൈവം പ്രലോഭനം നീക്കുന്നു എന്നോ അതിനിടയിൽ സഹിക്കാൻ മാർഗം നൽകുന്നു എന്നോ ഉള്ള ചോദ്യം
  choice: ‘അതിൽനിന്നു കടന്നുപോകാനുള്ള വഴി’ എന്ന് പരിഭാഷപ്പെടുത്തി, സഹനമാണ് ലക്ഷ്യമെന്ന് വാക്യഘടനയിൽ വ്യക്തമാക്കി
  alternative: ‘രക്ഷാമാർഗം’, ‘പുറത്തേക്കുള്ള വഴി’, അല്ലെങ്കിൽ ‘പരിണതി’
  rationale: അവസാനത്തെ ὑπενεγκεῖν പ്രലോഭനം ഒഴിവാക്കുന്നതിലുപരി അതിനടിയിൽ നിലനിൽക്കുന്ന സഹനത്തെ ഊന്നുന്നു. അതിനാൽ ദൈവം എല്ലായ്പ്പോഴും പരീക്ഷണം ഉടൻ നീക്കും എന്ന ഉപദേശം ഇറക്കുമതി ചെയ്യാതെ, അവിടത്തെ കരുതൽ സഹനത്തിനു പ്രാപ്തമാക്കുന്നു എന്ന് പാഠം പറയുന്നു.
- issue: ἀνθρώπινος എന്നതിലെ മനുഷ്യസംബന്ധിയായ പൊതുത്വം
  choice: ‘മനുഷ്യർക്കു സാധാരണമായത്’
  alternative: ‘മനുഷ്യസഹജമായത്’
  rationale: ഗ്രീക്ക് വിശേഷണം ലിംഗഭേദമുള്ള ഒരു വ്യക്തിയെക്കാൾ മനുഷ്യരാശിക്കു ചേർന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഉറവിടത്തിന്റെ ഉദ്ദേശ്യത്തിന് കൃത്യവുമായ പൊതുവചനരൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ മലയാളം. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ബഹുവചനമായ ‘നിങ്ങൾ’ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
