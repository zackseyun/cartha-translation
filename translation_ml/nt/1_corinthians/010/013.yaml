revisions:
- from: മനുഷ്യർക്കു സാധാരണമായതല്ലാതെ ഒരു പ്രലോഭനവും നിങ്ങളെ പിടികൂടിയിട്ടില്ല.[a] എന്നാൽ ദൈവം വിശ്വസ്തനാണ്. നിങ്ങൾക്കു സഹിക്കാവുന്നതിലധികം പ്രലോഭിപ്പിക്കപ്പെടാൻ അവിടന്ന് അനുവദിക്കുകയില്ല; പ്രലോഭനത്തോടൊപ്പം, അതു സഹിച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയേണ്ടതിന്, അതിൽനിന്നു കടന്നുപോകാനുള്ള വഴിയും അവിടന്ന് ഒരുക്കും.[b][c]
  to: മനുഷ്യർക്കു സാധാരണമായതല്ലാതെ ഒരു പ്രലോഭനവും[b] നിങ്ങളെ പിടികൂടിയിട്ടില്ല.[a] എന്നാൽ ദൈവം വിശ്വസ്തനാണ്; നിങ്ങൾക്കു സഹിക്കാവുന്നതിലധികം പ്രലോഭിപ്പിക്കപ്പെടാൻ അവിടന്ന് അനുവദിക്കുകയില്ല. പ്രലോഭനത്തോടൊപ്പം, അതു സഹിച്ചുനിൽക്കാൻ നിങ്ങൾക്കു കഴിയേണ്ടതിന്, അതിൽനിന്നു കടന്നുപോകാനുള്ള വഴിയും[c] അവിടന്ന് ഒരുക്കും.
