id: 1CO.10.1
reference: 1 Corinthians 10:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: ml
  text: എന്തെന്നാൽ, സഹോദരന്മാരേ[a], നമ്മുടെ പിതാക്കന്മാർ എല്ലാവരും മേഘത്തിൻ കീഴിലായിരുന്നു, എല്ലാവരും കടലിലൂടെ കടന്നുപോയി എന്ന കാര്യം നിങ്ങൾ അറിയാതിരിക്കണമെന്നു ഞാൻ ആഗ്രഹിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സഹോദരീസഹോദരന്മാരേ’; ‘സഹോദരന്മാർ’ എന്ന ഗ്രീക്ക് പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട ഒരു സഭയെ അഭിസംബോധന ചെയ്യാൻ ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നില്ല
  rationale: പൗലോസിന്റെ നിഷേധരൂപത്തിലുള്ള പ്രയോഗം നിലനിർത്തുന്നു; ‘നിങ്ങൾ അറിയണം’ എന്ന കൂടുതൽ സ്വതന്ത്രമായ രൂപത്തിലേക്ക് മാറ്റുന്നില്ല.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സഭ മുഴുവനെയും ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οἱ πατέρες ἡμῶν
  choice: നമ്മുടെ പിതാക്കന്മാർ
  rationale: ഇസ്രായേലിന്റെ ചരിത്രവുമായി വായനക്കാരെ ബന്ധിപ്പിക്കുന്ന കുടുംബപരവും വാഗ്മിതാപരവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: വാക്യത്തിലെ πάντες എന്ന പദത്തിന്റെ ആവർത്തനവും അതിന്റെ ഊന്നലും രണ്ടിടത്തും നിലനിർത്തുന്നു.
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: മേഘത്തിൻകീഴിലായിരുന്നു
  rationale: പുറപ്പാടിലെ വഴികാട്ടിയായ മേഘത്തെക്കുറിച്ചുള്ള സൂചന അധികവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: കടലിലൂടെ കടന്നുപോയി
  rationale: διά സൂചിപ്പിക്കുന്ന ‘അകത്തുകൂടിയുള്ള’ ചലനം സ്വാഭാവികമായ മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: സമ്മിശ്രലിംഗ സഭയെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മുഖ്യപാഠത്തിൽ ഗ്രീക്കിലെ പുല്ലിംഗരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രതിനിധിപരമായ അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ‘നമ്മുടെ പിതാക്കന്മാർ’ എന്നതിലൂടെ സഭയെ ഇസ്രായേലിന്റെ ചരിത്രവുമായി കൂട്ടിയിണക്കൽ
  choice: നമ്മുടെ പിതാക്കന്മാർ
  alternative: നമ്മുടെ പൂർവികർ
  rationale: ‘പൂർവികർ’ അർഥപരമായി സാധ്യമാണെങ്കിലും, പൗലോസിന്റെ കുടുംബപരമായ ഭാഷയും ഉടമ്പടിചരിത്രവുമായി ഉള്ള വാഗ്മിതാപരമായ തിരിച്ചറിയലും ‘പിതാക്കന്മാർ’ കൂടുതൽ നേരിട്ട് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ നിഷേധപ്രയോഗം, πάντες എന്നതിന്റെ ആവർത്തനം, പുറപ്പാട്-സൂചന എന്നിവ നിലനിർത്തിയിരിക്കുന്നു.
