id: 1CO.10.5
reference: 1 Corinthians 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ οὐκ ἐν τοῖς πλείοσιν αὐτῶν ηὐδόκησεν ὁ θεός, κατεστρώθησαν γὰρ ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/005.yaml
  text: Nevertheless[a], God was not pleased with most of them, for they were struck down in the wilderness.
translation:
  language: ml
  text: എങ്കിലും, അവരിൽ മിക്കവരോടും ദൈവം പ്രസാദിച്ചില്ല; കാരണം, അവർ മരുഭൂമിയിൽ വീഴ്ത്തപ്പെട്ടു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വീണുകിടന്നു’ അല്ലെങ്കിൽ ‘നിലംപരിചായി’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: κατεστρώθησαν എന്ന ക്രിയയ്ക്ക് വീഴ്ത്തപ്പെടുക, വീണുകിടക്കുക, നിലംപരിചാകുക എന്നീ ദൃശ്യാത്മക അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: ἀλλ’
  choice: എങ്കിലും
  rationale: മുൻവാക്യങ്ങളിൽ പറഞ്ഞ അനുഗ്രഹങ്ങളും ഇപ്പോൾ പറയുന്ന ദൈവിക അപ്രീതിയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: അവരിൽ മിക്കവരോടും
  rationale: ‘അവരിലെ ഭൂരിപക്ഷത്തിൽ അല്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അളവുസൂചന നിലനിർത്തിക്കൊണ്ട്, εὐδοκέω എന്ന ക്രിയയോടു ചേർന്ന് സ്വാഭാവികമായ മലയാളരൂപം നൽകുന്നു.
- source_word: ηὐδόκησεν
  choice: പ്രസാദിച്ചില്ല
  rationale: ‘സംപ്രീതനാകുക, സന്തോഷം തോന്നുക, അംഗീകരിക്കുക’ എന്ന അർഥപരിധിയിൽ ദൈവത്തിന്റെ അപ്രീതി സംക്ഷിപ്തമായും ഗൗരവത്തോടെയും അറിയിക്കുന്നു.
- source_word: ὁ θεός
  choice: ദൈവം
  rationale: മൂലപാഠത്തിലെ കർത്താവിനെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
- source_word: κατεστρώθησαν
  choice: വീഴ്ത്തപ്പെട്ടു
  rationale: മരുഭൂമിയിൽ ന്യായവിധിയാൽ അവർ വീണുപോയെന്ന സന്ദർഭാർഥം അറിയിക്കുകയും മൂലത്തിലെ കർമണിപ്രയോഗവും പ്രവർത്തകനെ വ്യക്തമാക്കാതിരിക്കുന്ന സ്വഭാവവും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: ദൈവം പ്രസാദിക്കാതിരുന്നതിന്റെ തെളിവോ വിശദീകരണമോ അടുത്ത വാക്യഭാഗം നൽകുന്നുവെന്ന് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἐρήμῳ
  choice: മരുഭൂമിയിൽ
  rationale: പുറപ്പാടിനുശേഷമുള്ള ഇസ്രായേലിന്റെ മരുഭൂമിയാത്രയെ സൂചിപ്പിക്കുന്ന സ്ഥിരവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
theological_decisions:
- issue: κατεστρώθησαν വിവരിക്കുന്ന ന്യായവിധിയുടെ സ്വഭാവം
  choice: മരുഭൂമിയാത്രയിൽ അവർ ദൈവിക ന്യായവിധിയാൽ വീഴ്ത്തപ്പെട്ടുവെന്ന സൂചന
  alternative: അവരുടെ ശരീരങ്ങൾ മരുഭൂമിയിൽ വീണുകിടന്നു അല്ലെങ്കിൽ ചിതറിക്കിടന്നു എന്ന കൂടുതൽ ദൃശ്യാത്മകമായ വിവർത്തനം
  rationale: സന്ദർഭം ഇസ്രായേലിന്റെ പരാജയങ്ങളും തുടർന്നുണ്ടായ ന്യായവിധിയും കൊരിന്ത്യർക്കുള്ള മുന്നറിയിപ്പായി അവതരിപ്പിക്കുന്നു. ‘വീഴ്ത്തപ്പെട്ടു’ ആ മുന്നറിയിപ്പിന്റെ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ പ്രവർത്തകനെ പേരെടുത്ത് ചേർക്കുകയോ മൂലപാഠത്തിലില്ലാത്ത വിശദാംശങ്ങൾ നൽകുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ‘പ്രസാദിച്ചില്ല’ തിരുവെഴുത്തുസന്ദർഭത്തിന് അനുയോജ്യമായ ഔപചാരികത നിലനിർത്തുന്നു; ബാക്കി വാക്യഘടന സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്നതാണ്.
