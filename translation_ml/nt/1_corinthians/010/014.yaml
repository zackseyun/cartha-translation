id: 1CO.10.14
reference: 1 Corinthians 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ പ്രിയരേ, വിഗ്രഹാരാധനയിൽനിന്ന് ഓടിയകലുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിഗ്രഹപൂജയിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διόπερ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്ന് നിഗമനം അവതരിപ്പിക്കുന്ന ശക്തമായ അനുമാനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀγαπητοί μου
  choice: എന്റെ പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ സംബോധനയും ‘എന്റെ’ എന്ന വ്യക്തിപരമായ ഊഷ്മളതയും നിലനിർത്തുന്നു; പൗലോസിന്റെ ഗൗരവമുള്ള ശൈലിക്കും യോജിക്കുന്നു.
- source_word: φεύγετε
  choice: ഓടിയകലുവിൻ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന വർത്തമാനകാല ആജ്ഞയുടെ അടിയന്തരതയും അപകടത്തിൽനിന്ന് ഒഴിഞ്ഞുമാറുക എന്ന ശക്തമായ അർഥവും പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ
  choice: -യിൽനിന്ന്
  rationale: ഒഴിവാക്കേണ്ട കാര്യത്തിൽനിന്നുള്ള വേർപാടിനെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῆς εἰδωλολατρίας
  choice: വിഗ്രഹാരാധന
  rationale: വിഗ്രഹങ്ങളെ ആരാധിക്കുന്നതും അവയുമായി ബന്ധപ്പെട്ട ആരാധനാചാരങ്ങളിൽ പങ്കെടുക്കുന്നതും ഉൾക്കൊള്ളുന്ന εἰδωλολατρίαയുടെ സാധാരണവും വ്യക്തവുമായ മലയാള തുല്യപദമാണ്.
theological_decisions:
- issue: നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: വിഗ്രഹാരാധനയിലും അതുമായി ബന്ധപ്പെട്ട ആചാരങ്ങളിലും പങ്കെടുക്കുന്നത് ഒഴിവാക്കണമെന്ന നേരിട്ടുള്ള ആജ്ഞ
  alternative: വിഗ്രഹങ്ങളോടുള്ള ആന്തരിക ഭക്തി മാത്രം ഒഴിവാക്കണമെന്ന പരിമിതമായ മുന്നറിയിപ്പ്
  rationale: സമീപസന്ദർഭത്തിൽ പൗലോസ് വിജാതീയ ആരാധനാഭോജനങ്ങളിലും ആചാരങ്ങളിലും പങ്കെടുക്കുന്നതിനെക്കുറിച്ചാണ് മുന്നറിയിപ്പു നൽകുന്നത്. പൊതുവായ ‘വിഗ്രഹാരാധന’ എന്ന പദം ഗ്രീക്കിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; അതിനെ ആന്തരിക മനോഭാവത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഓടിയകലുവിൻ’ ആജ്ഞയുടെ അടിയന്തരത നിലനിർത്തുമ്പോൾ ‘എന്റെ പ്രിയരേ’ സ്നേഹപൂർവമായ സംബോധന സംരക്ഷിക്കുന്നു.
