id: 1CO.10.31
reference: 1 Corinthians 10:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങൾ ഭക്ഷിച്ചാലും കുടിച്ചാലും എന്തു ചെയ്താലും, എല്ലാം ദൈവത്തിന്റെ മഹത്വത്തിനായി ചെയ്യുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: '... ചെയ്താലും ... ചെയ്താലും ... ചെയ്താലും'
  rationale: വ്യത്യസ്ത സാധ്യതകളെ നിരത്തുന്ന പരസ്പരബന്ധിത ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻചർച്ചയിൽനിന്നുള്ള നിഗമനവും തുടർന്നുള്ള പ്രബോധനവും വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐσθίετε
  choice: നിങ്ങൾ ഭക്ഷിച്ചാലും
  rationale: വർത്തമാനകാല ക്രിയയുടെ പൊതുവായ, പതിവുചെയ്യലിനെ സൂചിപ്പിക്കുന്ന അർഥം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: πίνετε
  choice: പാനം ചെയ്താലും
  rationale: ഭക്ഷിക്കുന്നതിനോടൊപ്പം നിരത്തിയ പൊതുവായ പ്രവൃത്തിയെ മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τι ποιεῖτε
  choice: മറ്റെന്തു ചെയ്താലും
  rationale: ഭക്ഷണപാനീയങ്ങൾക്കപ്പുറം ഏതു പ്രവൃത്തിയെയും ഉൾക്കൊള്ളുന്ന അനിശ്ചിതവും സമഗ്രവുമായ വ്യാപ്തി വ്യക്തമാക്കുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: സകല പ്രവൃത്തികളെയും ഉൾക്കൊള്ളുന്ന സമഗ്രത ചുരുക്കമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: εἰς δόξαν
  choice: മഹത്ത്വത്തിനായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യം അല്ലെങ്കിൽ ഉദ്ദേശ്യം മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം ഔപചാരികവും സ്വാഭാവികവുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: ποιεῖτε
  choice: ചെയ്യുക
  rationale: രൂപത്തിൽ നിർദ്ദേശാത്മകമായ മുഖ്യക്രിയയുടെ പ്രബോധനശക്തി മലയാളത്തിലെ ആജ്ഞാരൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രബോധനത്തിന്റെ വ്യാപ്തി
  choice: ഭക്ഷിക്കുകയും പാനം ചെയ്യുകയും ഉൾപ്പെടെ എല്ലാ പ്രവൃത്തികളും ദൈവത്തിന്റെ മഹത്ത്വം ലക്ഷ്യമാക്കി ചെയ്യണമെന്ന സമഗ്രമായ പ്രബോധനം
  alternative: ഭക്ഷണപാനീയങ്ങളെ സംബന്ധിച്ച തർക്കത്തിൽ മാത്രം ഒതുങ്ങുന്ന നിർദ്ദേശം
  rationale: പ്രത്യേക ഉദാഹരണങ്ങളിൽനിന്ന് ‘മറ്റെന്തു ചെയ്താലും’, ‘എല്ലാം’ എന്ന സമഗ്രമായ ഭാഷയിലേക്കുള്ള നീക്കം വിശാലമായ പ്രയോഗം സൂചിപ്പിക്കുന്നു; അതേസമയം ഈ വാക്യം ഭക്ഷണപാനീയങ്ങളെക്കുറിച്ചുള്ള തൊട്ടുമുൻപത്തെ ചർച്ചയിൽനിന്നാണ് ഉയരുന്നത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. വാക്യത്തിന്റെ ആവർത്തനാത്മക ഘടനയും സമഗ്രമായ പ്രബോധനവും സംരക്ഷിച്ചു; വിഭാഗീയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
