id: 1CO.10.4
reference: 1 Corinthians 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: ml
  text: എല്ലാവരും ഒരേ ആത്മീയ പാനീയം കുടിച്ചു. എന്തെന്നാൽ, അവരെ അനുഗമിച്ചുകൊണ്ടിരുന്ന[a] ഒരു ആത്മീയ പാറയിൽനിന്ന് അവർ കുടിച്ചുകൊണ്ടിരുന്നു; ആ പാറ മശിഹാ[b] ആയിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരെ അനുഗമിച്ച ഒരു ആത്മീയ പാറയിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തം തുടരുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ പ്രധാന പാഠത്തിൽ ‘അനുഗമിച്ചുകൊണ്ടിരുന്ന’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തു.’ ഇവിടെ Χριστός പേരുപോലെയല്ല, ‘മശിഹാ’ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: ആത്മിക പാനീയം
  rationale: πνευματικός എന്ന പൗലോസിന്റെ ആവർത്തിത വിശേഷണം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു; മുൻവാക്യത്തിലെ ‘ആത്മിക ആഹാരം’ എന്ന സമാന്തരപ്രയോഗവും കാക്കുന്നു.
- source_word: ἔπιον
  choice: കുടിച്ചു
  rationale: അയോറിസ്റ്റ് രൂപം മരുഭൂമിതലമുറയുടെ പൊതുവായ അനുഭവത്തെ സംഗ്രഹിക്കുന്നു; ലളിതമായ ഭൂതകാലം മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἔπινον
  choice: കുടിച്ചുകൊണ്ടിരുന്നു
  rationale: ഇംപെർഫെക്റ്റ് രൂപത്തിലെ തുടരുന്ന അഥവാ ആവർത്തിക്കുന്ന പ്രവർത്തനഭാവം പ്രകടമാക്കുകയും മുൻപത്തെ ἔπιον എന്ന രൂപത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: അവരെ അനുഗമിച്ചുകൊണ്ടിരുന്ന ഒരു ആത്മിക പാറയിൽനിന്ന്
  rationale: പാറ എന്ന പദം ഇവിടെ നിർദേശകപ്രത്യയം കൂടാതെയാണ് വരുന്നത്; അതിനാൽ ‘ഒരു’ യോജിക്കുന്നു. വർത്തമാനകാല കൃദന്തരൂപമായ ἀκολουθούσης-ന്റെ തുടരുന്ന ഭാവം ‘അനുഗമിച്ചുകൊണ്ടിരുന്ന’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: πέτρα
  choice: പാറ
  rationale: πέτρα ചെറിയ കല്ലിനെയല്ല, പാറയെയാണ് സൂചിപ്പിക്കുന്നത്; രൂപക-പ്രതീകാത്മക ശക്തിയും ഇതിലൂടെ നിലനിൽക്കുന്നു.
- source_word: ἡ πέτρα δὲ ἦν
  choice: ആ പാറ ... ആയിരുന്നു
  rationale: മുൻപു പറഞ്ഞ പാറയെ നിർദിഷ്ടമായി തിരിച്ചറിയിക്കുന്നു. δέ-യുടെ മൃദുവായ ബന്ധകഭാവം മലയാളത്തിലെ വാക്യക്രമത്തിലും അർധവിരാമത്തിലും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: ὁ Χριστός
  choice: മശിഹാ
  rationale: ഇവിടെ Χριστός ഒരു പേരുപോലെ മാത്രമല്ല, പദവിയായി പ്രവർത്തിക്കുന്നു. ‘മശിഹാ’ അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ അർഥം നിലനിർത്തുന്നു.
- source_word: πάντες τὸ αὐτὸ
  choice: എല്ലാവരും ഒരേ
  rationale: മുഴുവൻ സമൂഹത്തിന്റെയും പങ്കിട്ട ഒരേ അനുഭവത്തിന്മേലുള്ള പൗലോസിന്റെ ഊന്നൽ കാക്കുന്നു.
theological_decisions:
- issue: ‘ആ പാറ മശിഹാ ആയിരുന്നു’ എന്ന തിരിച്ചറിയൽവാക്യം
  choice: 'ഗ്രീക്കിലെ സമീകരണവാക്യത്തിന്റെ നേരിട്ടുള്ള ശക്തി നിലനിർത്തി: ‘ആ പാറ മശിഹാ ആയിരുന്നു.’'
  alternative: ‘ആ പാറ മശിഹായെ പ്രതിനിധാനം ചെയ്തു.’
  rationale: ἡ πέτρα δὲ ἦν ὁ Χριστός എന്നത് നേരിട്ടുള്ള സമീകരണവാക്യമാണ്. അതിനെ ‘പ്രതിനിധാനം ചെയ്തു’ എന്നു മാറ്റുന്നത് പൗലോസിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അവകാശവാദം മുൻകൂട്ടി വിശദീകരിച്ച് ദുർബലമാക്കും. അതേസമയം ഭൗതിക പാറയും വ്യക്തിയും സംബന്ധിച്ച തത്ത്വചിന്താപരമായ വിശദീകരണം പരിഭാഷ ചേർക്കുന്നില്ല.
- issue: പാനീയത്തെയും പാറയെയും വിശേഷിപ്പിക്കുന്ന πνευματικός
  choice: ‘ആത്മിക’ എന്ന തുറന്നതും ദൈവശാസ്ത്രഭാരമുള്ളതുമായ പദം നിലനിർത്തി.
  alternative: ‘അത്ഭുതകരമായ’ അല്ലെങ്കിൽ ‘പ്രതീകാത്മകമായ.’
  rationale: ‘അത്ഭുതകരമായ’ എന്നും ‘പ്രതീകാത്മകമായ’ എന്നും വിവർത്തനം ചെയ്യുന്നത് ഗ്രീക്ക് പദത്തിന്റെ അർഥപരിധി അനാവശ്യമായി ചുരുക്കും. ദൈവിക ദാനവും ആത്മാവിന്റെ മണ്ഡലവും മാതൃകാപരമായ പ്രാധാന്യവും ഉൾക്കൊള്ളാവുന്ന അസ്പഷ്ടത ‘ആത്മിക’ കാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ἔπιον/ἔπινον വ്യത്യാസം ‘കുടിച്ചു/കുടിച്ചുകൊണ്ടിരുന്നു’ എന്നു സൂക്ഷിച്ചു. ‘ആത്മിക’ എന്ന പദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെയും തിരിച്ചറിയൽവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെയും നിലനിർത്തി.
