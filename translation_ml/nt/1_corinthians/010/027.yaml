reference: 1 Corinthians 10:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: ml
  text: അവിശ്വാസികളിൽ ഒരാൾ നിങ്ങളെ ക്ഷണിക്കുകയും നിങ്ങൾ പോകാൻ ആഗ്രഹിക്കുകയും ചെയ്യുന്നുവെങ്കിൽ, നിങ്ങളുടെ മുമ്പിൽ വിളമ്പുന്നതെന്തും മനസ്സാക്ഷിയെ[b] കരുതി ഒന്നും അന്വേഷിക്കാതെ[a] കഴിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഒന്നും പരിശോധിക്കാതെ’ അല്ലെങ്കിൽ ‘ഒന്നും ചോദിച്ചറിയാതെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഭക്ഷണം എവിടെനിന്നു വന്നതാണെന്ന് അന്വേഷിക്കാതിരിക്കുക എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
  - marker: b
    text: ‘മനസ്സാക്ഷി’ ആരുടേതെന്നത് അടുത്ത വാക്യത്തിൽ കൂടുതൽ വ്യക്തമാകുന്നു; അവിടെ പൗലോസ് മറ്റൊരാളുടെ മനസ്സാക്ഷിയെയും സ്വന്തം മനസ്സാക്ഷിയെയും വേർതിരിച്ചുപറയുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: അവിശ്വാസികളിൽ
  rationale: വിശ്വാസസമൂഹത്തിനു പുറത്തുള്ള, വിശ്വസിക്കാത്ത ആളുകളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘അവിശ്വാസികൾ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്; അനാവശ്യമായ ശത്രുതാഭാവം ചേർക്കുന്നില്ല.
- source_word: καλεῖ
  choice: ക്ഷണിക്കുകയും
  rationale: ഭക്ഷണസന്ദർഭത്തിൽ καλέω എന്നതിന് ‘വിളിക്കുക’ എന്നതിലുപരി ‘ക്ഷണിക്കുക’ എന്ന അർഥമാണ് സ്വാഭാവികം.
- source_word: θέλετε πορεύεσθαι
  choice: നിങ്ങൾ പോകാൻ ആഗ്രഹിക്കുകയും ചെയ്യുന്നുവെങ്കിൽ
  rationale: ക്ഷണം സ്വീകരിച്ച് പോകാനുള്ള ഇച്ഛയെ വ്യവസ്ഥാപരമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: നിങ്ങളുടെ മുമ്പിൽ വിളമ്പുന്നതെന്തും
  rationale: ഭക്ഷണസമയത്ത് മുമ്പിൽ വെക്കപ്പെടുന്നതെല്ലാം എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; πᾶν എന്നതിന്റെ വ്യാപ്തി ‘എന്തും’ നിലനിർത്തുന്നു.
- source_word: ἐσθίετε
  choice: കഴിക്കുക
  rationale: പൊതുവായ നിർദേശം നൽകുന്ന വർത്തമാനകാല ആജ്ഞയെ ലളിതമായ മലയാള ആജ്ഞാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μηδὲν ἀνακρίνοντες
  choice: അതിനെക്കുറിച്ച് ഒന്നും അന്വേഷിക്കേണ്ടതില്ല
  rationale: ഭക്ഷണത്തിന്റെ പശ്ചാത്തലമോ ഉറവിടമോ പരിശോധിക്കാതിരിക്കുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; ‘ചോദ്യം ചോദിക്കാതെ’ എന്നതിനെക്കാൾ ἀνακρίνωയുടെ പരിശോധനാഭാവം നന്നായി നിലനിർത്തുന്നു.
- source_word: διὰ τὴν συνείδησιν
  choice: മനസ്സാക്ഷിയെ കരുതി
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന പരിഗണനയെയോ കാരണത്തെയോ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; മനസ്സാക്ഷി ആരുടേതെന്നത് ഇവിടെ നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: സന്ദർഭത്തിലെ συνείδησις എന്നതിന്റെ സൂചന
  choice: ‘മനസ്സാക്ഷി’ എന്ന പൊതുവായ പ്രയോഗം നിലനിർത്തി, അത് ആരുടേതെന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നില്ല.
  alternative: ഇത് വിശ്വാസിയുടെ സ്വന്തം മനസ്സാക്ഷിയെന്നോ അടുത്ത വാക്യത്തിൽ പറയുന്ന മറ്റൊരാളുടെ മനസ്സാക്ഷിയെന്നോ വ്യക്തമായി വിവർത്തനം ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാചകം ഇവിടെ സംക്ഷിപ്തവും നിർവ്യക്തവുമാണ്; അടുത്ത വാക്യമാണ് കൂടുതൽ വിശദീകരണം നൽകുന്നത്. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അവ്യക്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം മാന്യവുമായ ശൈലി. ‘വിളമ്പുന്നതെന്തും’ ഭക്ഷണസന്ദർഭം സ്വാഭാവികമാക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ വാക്യാവസാനത്തിൽ ചേർത്തത് അവയുടെ വിശദീകരണങ്ങൾ യഥാക്രമം അന്വേഷണപ്രയോഗത്തെയും മനസ്സാക്ഷിയെയും സംബന്ധിക്കുന്നതിനാലാണ്.
