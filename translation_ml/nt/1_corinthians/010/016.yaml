id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: ml
  text: നാം അനുഗ്രഹിക്കുന്ന അനുഗ്രഹപാനപാത്രം മശീഹായുടെ രക്തത്തിലുള്ള പങ്കാളിത്തമല്ലയോ? നാം നുറുക്കുന്ന അപ്പം മശീഹായുടെ ശരീരത്തിലുള്ള പങ്കാളിത്തമല്ലയോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പങ്കുചേരൽ”; പരമ്പരാഗതമായി “കൂട്ടായ്മ.”
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: Χριστοῦ (Christou); ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ “മശീഹാ” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു. പരമ്പരാഗതമായി “ക്രിസ്തു.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ποτήριον
  choice: പാനപാത്രം
  rationale: സാധാരണ ഉപയോഗത്തിലും ആരാധനാസന്ദർഭത്തിലും സ്വാഭാവികവും മാന്യവുമായ പദം; പിൽക്കാല സഭാപാരമ്പര്യത്തിന്റെ പ്രത്യേക സാങ്കേതിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: τῆς εὐλογίας
  choice: അനുഗ്രഹത്തിന്റെ
  rationale: ഗ്രീക്കിലെ നാമരൂപം നേരിട്ട് നിലനിർത്തുകയും തുടർന്നുള്ള εὐλογοῦμεν എന്ന ക്രിയയുമായുള്ള പദാവർത്തനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὃ εὐλογοῦμεν
  choice: നാം അനുഗ്രഹിക്കുന്ന
  rationale: ‘അനുഗ്രഹം’ എന്ന നാമത്തോടുള്ള ഗ്രീക്ക് പദാവർത്തനം നിലനിർത്തുന്നു; അതിനെ നന്ദിപറച്ചിലായി മാത്രം ചുരുക്കുന്നില്ല.
- source_word: οὐχὶ
  choice: അല്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ രൂപവും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: κοινωνία
  choice: പങ്കാളിത്തം
  rationale: വെറും സാമൂഹിക കൂട്ടായ്മയേക്കാൾ യഥാർഥമായി പങ്കുചേരുന്ന അർഥം വ്യക്തമാക്കുന്നു; കൂദാശാസംബന്ധമായ പിൽക്കാല സാങ്കേതിക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: τοῦ αἵματος
  choice: രക്തത്തിലുള്ള
  rationale: κοινωνίαയോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുമ്പോൾ ‘രക്തം’ എന്ന ബലിയും ഉടമ്പടിയും സൂചിപ്പിക്കുന്ന പദം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ ശീർഷകാർഥം നിലനിർത്തുന്നു.
- source_word: ἄρτον
  choice: അപ്പം
  rationale: സന്ദർഭത്തിന് അനുയോജ്യമായ സാധാരണ മലയാളപദം; ഈ വാക്യം നിർബന്ധിക്കാത്ത ‘ഒറ്റ അപ്പക്കഷണം/അപ്പത്തുണ്ട്’ എന്ന അധികവിശദീകരണം ഒഴിവാക്കുന്നു.
- source_word: ὃν κλῶμεν
  choice: നാം നുറുക്കുന്ന
  rationale: ആചാരത്തിലെ ദൃശ്യമായ പ്രവൃത്തി വ്യാഖ്യാനവികാസമില്ലാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τοῦ σώματος
  choice: ശരീരത്തിലുള്ള
  rationale: ‘ശരീരം’ എന്ന ക്രിസ്തുശാസ്ത്രപരവും കർത്തൃഭോജനസംബന്ധവുമായ ഭാരമുള്ള പദം നേരിട്ട് നിലനിർത്തുന്നു; പങ്കാളിത്തത്തിന്റെ രീതി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: കർത്തൃഭോജനസന്ദർഭത്തിലെ κοινωνίαയുടെ വിവർത്തനം
  choice: പങ്കാളിത്തം
  alternative: പങ്കുചേരൽ; കൂട്ടായ്മ
  rationale: മശീഹായുടെ രക്തത്തിലും ശരീരത്തിലും യഥാർഥമായി പങ്കുചേരുന്ന ആശയം സംരക്ഷിക്കുന്നു. എന്നാൽ ആ പങ്കാളിത്തം എങ്ങനെ സംഭവിക്കുന്നു എന്നതിനെക്കുറിച്ചുള്ള സഭാവിഭാഗീയ നിലപാട് വിവർത്തനം തന്നെ തീരുമാനിക്കുന്നില്ല.
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദത്തിന്റെ ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനപ്പേരായ അർഥം സജീവമാണ്; പതിവായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരമായ രണ്ടു അലങ്കാരചോദ്യങ്ങളും ‘അനുഗ്രഹം/അനുഗ്രഹിക്കുന്ന’ എന്ന പദാവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു. ‘പങ്കാളിത്തം’ എന്ന പദം യഥാർഥ പങ്കുചേരലിനെ സൂചിപ്പിക്കുമ്പോഴും അതിന്റെ കൂദാശാസംബന്ധമായ രീതി നിർവചിക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവയ്ക്കുന്നു.
