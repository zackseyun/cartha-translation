  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ലൈംഗിക അധാർമികത’ എന്നത് ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു. ആദ്യത്തെ വിലക്കും ചരിത്രോദാഹരണവും രണ്ടു ചെറുവാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചിരിക്കുന്നു; ‘-യുമരുത്’ പരമ്പരയിലെ ബന്ധം സംരക്ഷിക്കുന്നു.
