  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: ml
  text: അവരിൽ ചിലർ ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെട്ടതുപോലെ, നാം ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുകയുമരുത്; ഒരൊറ്റ ദിവസം ഇരുപത്തിമൂവായിരം പേർ വീണു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരിച്ചു’ അല്ലെങ്കിൽ ‘സംഹരിക്കപ്പെട്ടു’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വീണു’ എന്നാണ്; ന്യായവിധിയിൽ മരിച്ചതിനെ സൂചിപ്പിക്കാൻ സാധാരണയായി ഉപയോഗിച്ചിരുന്ന പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: സംഖ്യ 25:9-ൽ ഇരുപത്തിനാലായിരം പേർ മരിച്ചതായി പറയുന്നു. ഇവിടെ പൗലൊസ് ‘ഒരൊറ്റ ദിവസം’ വീണത് ഇരുപത്തിമൂവായിരം പേരാണെന്നു പറയുന്നു. ആ ദിവസം മരിച്ചവരുടെ എണ്ണവും ആകെ മരണസംഖ്യയും തമ്മിലുള്ള വ്യത്യാസമായിരിക്കാം ഇത്; എങ്കിലും വിവർത്തനം ഇവയെ സമന്വയിപ്പിക്കാതെ പൗലൊസിന്റെ വാക്കുകൾ അതേപടി നിലനിർത്തുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: μηδὲ
  choice: ഏർപ്പെടുകയുമരുത്
  rationale: μηδέ മുൻവാക്യങ്ങളിലെ മുന്നറിയിപ്പുകളുടെ പരമ്പരയുമായി ഈ വിലക്കിനെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-യുമരുത്’ ആ ബന്ധവും വിലക്കിന്റെ ശക്തിയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുക
  rationale: πορνεύω എന്ന ക്രിയയുടെ വിശാലമായ ലൈംഗിക-ധാർമിക അർഥം അനാവശ്യമായി ചുരുക്കാതെയും പ്രാചീനമോ അവ്യക്തമോ ആയ പദപ്രയോഗം ഒഴിവാക്കിയും വ്യക്തമാക്കുന്നു. രണ്ടു രൂപങ്ങളിലും ഒരേ പദപ്രയോഗം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: καθώς τινες αὐτῶν
  choice: അവരിൽ ചിലർ … ഏർപ്പെട്ടു
  rationale: മരുഭൂമിയിലെ ഇസ്രായേൽജനത്തിൽ ചിലരെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം. രണ്ടു വാക്യങ്ങളാക്കിയിട്ടും ഉദാഹരണവും വിലക്കും തമ്മിലുള്ള താരതമ്യം സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: ἔπεσαν
  choice: വീണു
  rationale: πίπτω എന്നതിന്റെ നേരായ ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു. ഇവിടെ ന്യായവിധിയിൽ മരിച്ചതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണെങ്കിലും ആ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μιᾷ ἡμέρᾳ
  choice: ഒരൊറ്റ ദിവസം
  rationale: സംഭവം ഒരു ദിവസത്തിനുള്ളിൽ കേന്ദ്രീകരിച്ചുവെന്ന ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: ഇരുപത്തിമൂവായിരം
  rationale: ഗ്രീക്കിലെ സംഖ്യ മാറ്റമോ സമന്വയിപ്പിക്കലോ കൂടാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: സംഖ്യ 25:9-ലെ കണക്കുമായുള്ള ബന്ധം
  choice: പൗലൊസിന്റെ പാഠത്തിലുള്ള ‘ഇരുപത്തിമൂവായിരം’ മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തി.
  alternative: ‘ഇരുപത്തിനാലായിരം’ എന്നു സംഖ്യ 25:9-നോട് സമന്വയിപ്പിക്കുക; അല്ലെങ്കിൽ ഒരു കണക്ക് ഉപമൊത്തവും മറ്റേത് ആകെ മൊത്തവുമാണെന്ന് മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക.
  rationale: 1 കൊരിന്ത്യർ 10:8-ന്റെ ഗ്രീക്ക് പാഠം വ്യക്തമായി ഇരുപത്തിമൂവായിരം എന്നു പറയുന്നു. കാണപ്പെടുന്ന സംഖ്യാപരമായ സംഘർഷം വിവർത്തനം നിശ്ശബ്ദമായി പരിഹരിക്കാതെ പാഠം സംരക്ഷിക്കുകയും സാധ്യതയുള്ള വിശദീകരണം അടിക്കുറിപ്പിൽ മാത്രം നൽകുകയും ചെയ്യുന്നു.
- issue: ἔπεσαν എന്നതിലെ ന്യായവിധിയോടു ബന്ധപ്പെട്ട മരണസൂചന
  choice: ‘വീണു’ എന്നു രൂപകം നിലനിർത്തി, മരണസൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: മുഖ്യപാഠത്തിൽ ‘മരിച്ചു’ അല്ലെങ്കിൽ ‘കൊല്ലപ്പെട്ടു’ എന്നു വ്യക്തമായി എഴുതുക.
  rationale: ഗ്രീക്കിലെ രൂപകവും അതിന്റെ സന്ദർഭാർഥവും ഒരുപോലെ ലഭ്യമാക്കുന്നു; പ്രവർത്തിയുടെ കർത്താവിനെ ഗ്രീക്ക് തുറന്നു പറയാത്തതിനാൽ ‘കൊല്ലപ്പെട്ടു’ എന്ന രൂപം മുഖ്യപാഠത്തിൽ അധികമായി നിർണ്ണയിക്കുന്നില്ല.
