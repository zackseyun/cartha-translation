id: 1CO.10.2
reference: 1 Corinthians 10:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάντες εἰς τὸν Μωϋσῆν ⸀ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/002.yaml
  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: ml
  text: എല്ലാവരും മേഘത്തിലും കടലിലും മോശെയിലേക്കു സ്നാനമേറ്റു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മോശെയോടു താദാത്മ്യം പ്രാപിച്ചു” അല്ലെങ്കിൽ “മോശെയോടുള്ള വിധേയത്വത്തിലേക്കു പ്രവേശിച്ചു.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “മോശെയിലേക്ക്” എന്നാണ്; സ്നാനവുമായി പൗലോസ് സൃഷ്ടിക്കുന്ന പ്രതിരൂപസമാന്തരം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
    reason: alternative_reading
  - marker: b
    text: പൗലോസ് ഇവിടെ “കടലിൽ” എന്നാണ് പറയുന്നത്, “കടലിലൂടെ” എന്നല്ല; അങ്ങനെ “മേഘത്തിൽ” എന്നതിനോടുള്ള സമാന്തരം നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: പരാമർശിക്കപ്പെടുന്ന ഇസ്രായേൽജനത്തെ മുഴുവനായി ഉൾക്കൊള്ളുകയും സമീപസന്ദർഭത്തിലെ ആവർത്തിച്ചുള്ള ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰς τὸν Μωϋσῆν
  choice: മോശെയിലേക്കു
  rationale: ഗ്രീക്കിലെ അസാധാരണമായ ‘മോശെയിലേക്ക്’ എന്ന ഘടനയും സ്നാനവുമായി പൗലോസ് സൃഷ്ടിക്കുന്ന പ്രതിരൂപസമാന്തരവും വ്യാഖ്യാനിച്ച് ഒതുക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐβαπτίσαντο
  choice: സ്നാനം ഏറ്റു
  rationale: ഗ്രീക്ക് മധ്യപ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘സ്വയം സ്നാനം കഴിച്ചു’ എന്നു മധ്യരൂപത്തെ അമിതമായി ഊന്നുകയോ ‘മുങ്ങി’ എന്നു അർഥം ചുരുക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: ἐν τῇ νεφέλῃ
  choice: മേഘത്തിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥലപരമായ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നതിനൊപ്പം മണ്ഡലം, ഉപാധി, സഹവർത്തിത്വം എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു.
- source_word: ἐν τῇ θαλάσσῃ
  choice: കടലിൽ
  rationale: പുറപ്പാടിന്റെ വിവരണത്തിൽ അവർ കടലിലൂടെ കടന്നെങ്കിലും ഇവിടെ പൗലോസ് διά അല്ല, ἐν ആണ് ഉപയോഗിക്കുന്നത്; ‘മേഘത്തിൽ’ എന്നതിനോടുള്ള സമാന്തരവും ഇതിലൂടെ നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ഇസ്രായേൽ ‘മോശെയിലേക്കു സ്നാനം ഏറ്റു’ എന്നതിന്റെ അർഥം
  choice: ‘മോശെയിലേക്കു’ എന്ന പ്രതിരൂപാത്മകവും പ്രതിനിധിത്വപരവുമായ ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘മോശെയോടു താദാത്മ്യം പ്രാപിച്ചു’ അല്ലെങ്കിൽ ‘മോശെയോടുള്ള വിധേയത്വത്തിലേക്കു പ്രവേശിച്ചു’ എന്നു വിശദീകരിക്കുക.
  rationale: പുറപ്പാട് അനുഭവത്തെയും ക്രിസ്തീയ സ്നാനത്തെയും പൗലോസ് സമാന്തരപ്പെടുത്തുന്നു. ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം നിർബന്ധിക്കാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്നാനം ഏറ്റു’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സഭാപാരമ്പര്യങ്ങൾക്കിടയിൽ താരതമ്യേന നിഷ്പക്ഷവുമാണ്. ഗ്രീക്കിലെ പദക്രമത്തേക്കാൾ മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമം പിന്തുടർന്ന് ‘മേഘത്തിലും കടലിലും’ ആദ്യം നൽകിയെങ്കിലും ‘മോശെയിലേക്കു’ എന്ന നിർണായക അസാധാരണപ്രയോഗം സംരക്ഷിച്ചു.
