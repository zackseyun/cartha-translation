source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: ml
  text: 'അവരിൽ ചിലരെപ്പോലെ നിങ്ങളും വിഗ്രഹാരാധകരായിത്തീരരുത്. എഴുതിയിരിക്കുന്നതുപോലെ: “ജനം തിന്നാനും കുടിക്കാനും ഇരുന്നു; പിന്നെ കളിക്കാനായി[a] എഴുന്നേറ്റു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഉല്ലസിക്കാനായി.” ഇവിടെ ഉദ്ധരിച്ചിരിക്കുന്നത് പുറപ്പാട് 32:6-ൽ നിന്നാണ്; അവിടെ ഈ ‘കളി’ സ്വർണക്കാളക്കുട്ടിയെ ചുറ്റിപ്പറ്റിയുള്ള ഇസ്രായേലിന്റെ വിഗ്രഹാരാധനാപരമായ വിരുന്നിനോടു ബന്ധപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: അരുത്
  rationale: മുൻസന്ദർഭത്തിലെ വിലക്കുകളുടെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികമായ നിരോധനരൂപത്തിൽ നൽകുന്നു.
- source_word: εἰδωλολάτραι γίνεσθε
  choice: വിഗ്രഹാരാധകരായിത്തീരരുത്
  rationale: εἰδωλολάτραι എന്ന നാമത്തിന്റെ അർഥവും γίνεσθε എന്ന ക്രിയയിലെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: καθώς τινες αὐτῶν
  choice: അവരിൽ ചിലരെപ്പോലെ
  rationale: മരുഭൂമിയിലെ ഇസ്രായേല്യരിൽ ചിലരോടുള്ള താരതമ്യം ചുരുക്കവും സ്വാഭാവികവുമായി വ്യക്തമാക്കുന്നു.
- source_word: ὥσπερ γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സ്ഥിരമായ സൂത്രവാക്യവും ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν
  choice: ജനം തിന്നാനും കുടിക്കാനും ഇരുന്നു
  rationale: ഉദ്ധരണിയിലെ ക്രമവും കൂട്ടായ ὁ λαός എന്ന പ്രയോഗവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀνέστησαν παίζειν
  choice: പിന്നെ കളിക്കാനായി എഴുന്നേറ്റു
  rationale: ἀνέστησαν എന്ന കഥാഗതിയും παίζειν എന്നതിന്റെ അടിസ്ഥാനമായ ‘കളിക്കുക’ എന്ന അർഥവും സംരക്ഷിക്കുന്നു; ‘പിന്നെ’ മലയാളത്തിലെ സ്വാഭാവിക സംഭവക്രമം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുറപ്പാട് 32:6-ലെ ഉദ്ധരണിയിൽ παίζειν എത്ര വ്യക്തമായി വ്യാഖ്യാനിക്കണം
  choice: മുഖ്യവാചകത്തിൽ ‘കളിക്കാനായി’ നിലനിർത്തി, വിഗ്രഹാരാധനയോടു ബന്ധപ്പെട്ട ഉല്ലാസത്തിന്റെ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: ഉല്ലസിക്കാനായി / ആഘോഷത്തിമിർപ്പിലേർപ്പെടാനായി
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാനാർഥവും പുറപ്പാടിലെ ഉദ്ധരണിയുടെ രൂപവും മുഖ്യവാചകത്തിൽ സംരക്ഷിക്കുമ്പോൾ, സന്ദർഭത്തിലെ വിഗ്രഹാരാധനാപരമായ ആഘോഷത്തിന്റെ സൂചന അടിക്കുറിപ്പിലൂടെ വായനക്കാരന് ലഭിക്കുന്നു; അങ്ങനെ അർഥസാധ്യത ഏകപക്ഷീയമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിഗ്രഹാരാധകരായിത്തീരരുത്’ എന്ന രൂപം മൂലത്തിലെ γίνεσθε-യുടെ ‘ആയിത്തീരുക’ എന്ന ഭാവം നിലനിർത്തുന്നു. ഉദ്ധരണിക്ക് ബൈബിൾഭാഷയുടെ ഗൗരവം നൽകിയെങ്കിലും പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
