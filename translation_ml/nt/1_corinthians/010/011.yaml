id: 1CO.10.11
reference: 1 Corinthians 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῦτα ⸀δὲ ⸂τυπικῶς συνέβαινεν⸃ ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν, εἰς οὓς τὰ τέλη τῶν αἰώνων ⸀κατήντηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: ml
  text: ഇക്കാര്യങ്ങൾ അവർക്ക് മാതൃകകളായി[a] സംഭവിച്ചു; എന്നാൽ അവ യുഗങ്ങളുടെ അന്ത്യങ്ങൾ[c] വന്നെത്തിയിരിക്കുന്ന നമുക്കു പ്രബോധനത്തിനായി[b] എഴുതപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രതിരൂപങ്ങളായി” അല്ലെങ്കിൽ “പ്രതിരൂപാത്മകമായി”; ഈ സംഭവങ്ങൾ പിൽക്കാല വിശ്വാസികൾക്കു പ്രബോധനപരമായ മാതൃകകളായി പ്രവർത്തിക്കുന്നുവെന്നാണ് പൗലോസ് അവതരിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നമ്മുടെ തിരുത്തലിനായി” അല്ലെങ്കിൽ “നമുക്കുള്ള മുന്നറിയിപ്പിനായി”; ഗ്രീക്ക് പദത്തിൽ തിരുത്തുന്ന പ്രബോധനത്തിന്റെയും മുന്നറിയിപ്പിന്റെയും ഭാവങ്ങളുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “യുഗങ്ങളുടെ അന്ത്യം വന്നെത്തിയിരിക്കുന്ന”; ഗ്രീക്കിൽ “യുഗങ്ങളുടെ അന്ത്യങ്ങൾ” എന്ന് ബഹുവചനമാണ്. പൗലോസിന്റെ രക്ഷാചരിത്രപരമായ പദപ്രയോഗം മുഖ്യപാഠത്തിൽ അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: മാതൃകകളായി
  rationale: സംഭവങ്ങൾ പിൽക്കാല വിശ്വാസികൾക്കു പ്രബോധനപരമായ മാതൃകകളായി പ്രവർത്തിക്കുന്നു എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; സാങ്കേതികമായ ‘പ്രതിരൂപാത്മകമായി’ എന്നതിനെക്കാൾ വായനാസൗകര്യമുണ്ട്.
- source_word: συνέβαινεν
  choice: സംഭവിച്ചു
  rationale: ഭൂതകാലത്തിൽ നടന്ന കാര്യങ്ങളെ ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; ഗ്രീക്കിലെ അപൂർണ്ണഭൂതകാലത്തിന്റെ ആവർത്തന/തുടർച്ചാഭാവം ‘ഇക്കാര്യങ്ങൾ’ എന്ന ബഹുവചനസന്ദർഭത്തിൽ മതിയായവിധം സൂചിതമാകുന്നു.
- source_word: ἐκείνοις
  choice: അവർക്ക്
  rationale: മുൻസന്ദർഭത്തിലെ മരുഭൂമിതലമുറയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ ദത്തിവിഭക്തി ഗ്രീക്ക് ദത്തിവിഭക്തിയുടെ ബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐγράφη
  choice: അവ എഴുതപ്പെട്ടു
  rationale: ഗ്രീക്കിൽ ക്രിയ ഏകവചനമായിരുന്നാലും, മുമ്പ് പറഞ്ഞ കാര്യങ്ങളുടെ രേഖപ്പെടുത്തലാണ് അർത്ഥം; മലയാളത്തിൽ ബഹുവചനസൂചനയായ ‘അവ’ ആശയം വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: πρὸς νουθεσίαν
  choice: നമുക്കുള്ള പ്രബോധനത്തിനായി
  rationale: νουθεσίαയിൽ പഠിപ്പിക്കൽ, തിരുത്തൽ, മുന്നറിയിപ്പ് എന്നീ ഭാവങ്ങൾ ഉൾപ്പെടുന്നു. ‘പ്രബോധനം’ ഇവയെ വിശാലമായി ഉൾക്കൊള്ളുന്ന മാന്യവും ഗ്രാഹ്യവുമായ പദമാണ്.
- source_word: εἰς οὓς
  choice: നമുക്ക് … വന്നെത്തിയിരിക്കുന്ന
  rationale: അന്ത്യകാല യാഥാർഥ്യം ആരിലേക്കാണ് എത്തിച്ചേർന്നത് എന്ന ദിശാത്മക ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ τέλη τῶν αἰώνων
  choice: യുഗങ്ങളുടെ അന്ത്യങ്ങൾ
  rationale: τέλη, αἰώνων എന്നീ രണ്ടു പദങ്ങളുടെയും ബഹുവചനം നിലനിർത്തി പൗലോസിന്റെ രക്ഷാചരിത്രപരവും അന്ത്യകാലപരവുമായ പ്രയോഗം ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: κατήντηκεν
  choice: വന്നെത്തിയിരിക്കുന്ന
  rationale: സംഭവിച്ചുകഴിഞ്ഞ വരവിനും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിക്കും ഊന്നൽ നൽകുന്ന ഗ്രീക്ക് പൂർണ്ണകാലഭാവം മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: τὰ τέλη τῶν αἰώνων എന്ന പൗലോസിന്റെ രക്ഷാചരിത്രപരമായ പ്രയോഗം
  choice: യുഗങ്ങളുടെ അന്ത്യങ്ങൾ വന്നെത്തിയിരിക്കുന്നു
  alternative: യുഗങ്ങളുടെ അന്ത്യം വന്നെത്തിയിരിക്കുന്നു / യുഗങ്ങളുടെ പൂർത്തീകരണം വന്നെത്തിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ഇരട്ട ബഹുവചനം നിലനിർത്തുന്നത് പൗലോസിന്റെ അന്ത്യകാലപരമായ പിരിമുറുക്കത്തെ ഏകവചനമോ വ്യാഖ്യാനാത്മകമായ ‘പൂർത്തീകരണം’ എന്ന പദമോ ഉപയോഗിച്ച് അനാവശ്യമായി പരിഹരിക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ മുഖ്യപാഠത്തിൽ പരമാവധി ഒഴിവാക്കി, എന്നാൽ ഗ്രീക്കിലെ ബഹുവചനവും അന്ത്യകാലപരമായ പിരിമുറുക്കവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുകുറികളും ബന്ധപ്പെട്ട വാക്കുകൾക്കു പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
