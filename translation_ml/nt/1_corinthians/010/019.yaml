source:
  edition: SBLGNT
  text: τί οὖν φημι; ὅτι ⸂εἰδωλόθυτόν τί ἐστιν, ἢ ὅτι εἴδωλόν⸃ τί ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/019.yaml
  text: What then am I saying? That food sacrificed to idols is anything[b][a], or that an idol is anything?
translation:
  language: ml
  text: അപ്പോൾ ഞാൻ എന്താണു പറയുന്നത്? വിഗ്രഹങ്ങൾക്കു ബലിയർപ്പിച്ച ഭക്ഷണം എന്തെങ്കിലും ആണെന്നോ[b][a], അല്ലെങ്കിൽ വിഗ്രഹം എന്തെങ്കിലും ആണെന്നോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘വിഗ്രഹാർപ്പിതം എന്തെങ്കിലും പ്രാധാന്യമുള്ളതാണെന്നോ.’
    reason: lexical_alternative
  - marker: b
    text: അതായത്, വിഗ്രഹങ്ങൾക്ക് യഥാർഥ ദൈവിക അസ്തിത്വമുണ്ടെന്നോ അർപ്പിച്ച ഭക്ഷണത്തിന് അതിൽത്തന്നെ അന്തർലീനമായ ആത്മീയ പ്രാധാന്യമുണ്ടെന്നോ പൗലോസ് ഉറപ്പിച്ചു പറയുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: τί οὖν φημι
  choice: അങ്ങനെയെങ്കിൽ, ഞാൻ എന്താണ് പറയുന്നത്?
  rationale: οὖν എന്ന നിഗമനസൂചക ബന്ധവും φημίയുടെ ഒന്നാംപുരുഷ വർത്തമാനകാലത്തിലുള്ള വാചകശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: …എന്നോ
  rationale: പൗലോസ് പറയുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാവുന്ന ആശയം ഉദ്ധരിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിലെ പരോക്ഷചോദ്യരൂപത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: εἰδωλόθυτόν
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം
  rationale: വിഗ്രഹാരാധനാസംബന്ധമായ ബലിയിൽ അർപ്പിച്ച മാംസത്തെയോ ഭക്ഷണത്തെയോ സൂചിപ്പിക്കുന്ന പദം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘വിഗ്രഹാർപ്പിതം’ എന്ന സാങ്കേതിക പദത്തേക്കാൾ സ്വാഭാവികമാണ്.
- source_word: τί ἐστιν
  choice: എന്തെങ്കിലും ആണ്
  rationale: അസ്തിത്വമോ പ്രസക്തിയോ മൂല്യമോ എന്നതിൽ ഏതാണ് മുൻനിർത്തുന്നതെന്ന് നിർബന്ധമായി തീർപ്പാക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്തവും ഉദ്ദേശപൂർവം തുറന്നതുമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἢ
  choice: …എന്നോ, …എന്നോ
  rationale: രണ്ട് സമാന്തര സാധ്യതകളെ ബന്ധിപ്പിക്കുന്ന വ്യത്യാസസൂചക ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἴδωλον
  choice: വിഗ്രഹം
  rationale: സന്ദർഭത്തിൽ ഇത് പൊതുവായ ഒരു പ്രതിമയെയല്ല, ആരാധനാവിഷയമായ വിഗ്രഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: വിഗ്രഹത്തിനോ വിഗ്രഹാർപ്പിത ഭക്ഷണത്തിനോ യഥാർഥ അസ്തിത്വമോ ആത്മീയ പ്രാധാന്യമോ ഉണ്ടെന്ന് പൗലോസ് സമ്മതിക്കുന്നുവോ എന്ന ചോദ്യം
  choice: ‘എന്തെങ്കിലും ആണെന്നോ’ എന്ന തുറന്ന ചോദ്യരൂപം നിലനിർത്തി.
  alternative: ‘യഥാർഥ പ്രാധാന്യമുള്ളതാണെന്നോ’ അല്ലെങ്കിൽ ‘യഥാർഥത്തിൽ നിലനിൽക്കുന്നതാണെന്നോ’ എന്നു വ്യക്തമാക്കുക.
  rationale: τί ἐστιν എന്ന പ്രയോഗം അസ്തിത്വം, പദവി, പ്രാധാന്യം എന്നിവയിൽ ഒന്നിലേക്കു മാത്രം ചുരുക്കാനാവില്ല. അതിനാൽ മുഖ്യപാഠത്തിൽ ദാർശനികമോ മതശാസ്ത്രപരമോ ആയ വിശദീകരണം ചേർക്കാതെ പൗലോസിന്റെ വാചകത്തിലെ സംഘർഷവും സന്ദർഭം നൽകുന്ന നിഷേധാർഥക സൂചനയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിഗ്രഹാർപ്പിതം’ പോലുള്ള സഭാപരമായ സാങ്കേതികപദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി വ്യക്തമായ വിവരണാത്മക പ്രയോഗം സ്വീകരിച്ചു. ‘എന്തെങ്കിലും ആണ്’ എന്ന അല്പം അസാധാരണമായെങ്കിലും ഗ്രഹിക്കാവുന്ന രൂപം മൂലപാഠത്തിലെ ഉദ്ദേശപൂർവമായ അർഥതുറപ്പ് സംരക്ഷിക്കാൻ നിലനിർത്തി.
