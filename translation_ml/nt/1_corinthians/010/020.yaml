id: 1CO.10.20
reference: 1 Corinthians 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: ml
  text: അല്ല; മറിച്ച്, അവർ അർപ്പിക്കുന്ന ബലികൾ ഭൂതങ്ങൾക്കാണ്, ദൈവത്തിനല്ല. നിങ്ങൾ ഭൂതങ്ങളുമായി പങ്കാളിത്തമുള്ളവരായിത്തീരാൻ[a] ഞാൻ ആഗ്രഹിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂതങ്ങളോടു പങ്കാളികളായിത്തീരാൻ’ അല്ലെങ്കിൽ ‘ഭൂതങ്ങളുമായി കൂട്ടായ്മയുള്ളവരായിത്തീരാൻ.’
    reason: κοινωνός എന്ന പദം പങ്കാളിത്തം, കൂട്ടായ്മ, പങ്കുചേരൽ എന്നീ അടുത്ത അർഥഭാവങ്ങൾ ഉൾക്കൊള്ളുന്നു.
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: അല്ല; മറിച്ച്
  rationale: മുൻവാക്യത്തിൽനിന്ന് ഉണ്ടായേക്കാവുന്ന തെറ്റിദ്ധാരണ തിരുത്തുന്ന വിരുദ്ധാർഥബലം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἃ θύουσιν
  choice: അവർ ബലിയർപ്പിക്കുന്നത്
  rationale: നപുംസകലിംഗ ആപേക്ഷിക സർവനാമം ബലിവസ്തുക്കളെ പൊതുവായി സൂചിപ്പിക്കുന്നു; അനാവശ്യമായി ‘വസ്തുക്കൾ’ എന്നു ചേർക്കാതെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δαιμονίοις
  choice: ഭൂതങ്ങൾക്കാണ്
  rationale: പുതിയനിയമസന്ദർഭത്തിൽ δαιμόνια ദുഷ്ടമായ അമാനുഷിക സത്തകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ ‘ഭൂതങ്ങൾ’ ഇതിന്റെ പതിവായ തത്തുല്യമാണ്.
- source_word: καὶ οὐ θεῷ
  choice: ദൈവത്തിനല്ല
  rationale: സന്ദർഭത്തിലെ ഏകദൈവവിശ്വാസപരമായ വൈരുധ്യം നിലനിർത്തി, ബലി സത്യദൈവത്തിനല്ലെന്നു വ്യക്തമാക്കുന്നു.
- source_word: οὐ θέλω δὲ
  choice: ഞാൻ ആഗ്രഹിക്കുന്നില്ല
  rationale: δέയുടെ മൃദുവായ തുടർച്ച മലയാളവാക്യക്രമത്തിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; പൗലോസിന്റെ വ്യക്തമായ അഭിലാഷനിഷേധം സംരക്ഷിക്കുന്നു.
- source_word: κοινωνοὺς τῶν δαιμονίων
  choice: ഭൂതങ്ങളോടു പങ്കുചേരുന്നവർ
  rationale: κοινωνός സൂചിപ്പിക്കുന്ന യഥാർഥ പങ്കാളിത്തവും ബന്ധവും നിലനിർത്തുന്നു; വെറും സാമൂഹിക സഹവാസമെന്നോ സമ്പൂർണ ആരാധനാനിഷ്ഠയെന്നോ അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: γίνεσθαι
  choice: ആയിത്തീരാൻ
  rationale: നിലവിലുള്ള അവസ്ഥയല്ല, അത്തരം പങ്കാളിത്തത്തിലേക്ക് പ്രവേശിക്കുന്നതിനെക്കുറിച്ചുള്ള മുന്നറിയിപ്പാണ് γίνομαι നൽകുന്നത്; ‘ആയിത്തീരാൻ’ ആ മാറ്റബലം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: വിജാതീയ ബലികളുടെ സ്വഭാവം
  choice: അവർ അർപ്പിക്കുന്ന ബലികൾ ഭൂതങ്ങൾക്കാണ്, ദൈവത്തിനല്ല.
  alternative: വിഗ്രഹവിരുന്നുകളുടെ സാമൂഹിക അർഥത്തെക്കുറിച്ചുള്ള അലങ്കാരപ്രയോഗം മാത്രമാണിത്; അല്ലെങ്കിൽ ‘ഭൂതങ്ങൾ’ വെറും രൂപകമാണ്.
  rationale: ‘ഭൂതങ്ങൾക്ക്, ദൈവത്തിനല്ല’ എന്ന മൂലപാഠത്തിലെ വ്യക്തമായ ദൈവശാസ്ത്രപരമായ വൈരുധ്യം മയപ്പെടുത്താതെയും അതിനപ്പുറം അനുമാനങ്ങൾ ചേർക്കാതെയും നിലനിർത്തുന്നു.
- issue: κοινωνοὺς τῶν δαιμονίων എന്നതിന്റെ ബലം
  choice: ഭൂതങ്ങളോടുള്ള യഥാർഥ പങ്കാളിത്തബന്ധം
  alternative: വിഗ്രഹാരാധകരുമായുള്ള വെറും സാമൂഹിക സഹവാസം; അല്ലെങ്കിൽ ഭൂതങ്ങളോടുള്ള സമ്പൂർണ ആരാധനാനിഷ്ഠ
  rationale: ചുറ്റുപാടിലുള്ള κοινωνία ഭാഷ യഥാർഥ പങ്കാളിത്തം സൂചിപ്പിക്കുന്നു. വിവർത്തനം അതിന്റെ ഗൗരവം സംരക്ഷിക്കുമ്പോഴും പാഠം പറയുന്നതിലധികം ശക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ബലിയർപ്പിക്കുക,’ ‘ഭൂതങ്ങൾ,’ ‘ദൈവം’ എന്നീ സാധാരണ മതപര പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിച്ച θύουσιν മലയാളത്തിൽ അസ്വാഭാവികമാകാതിരിക്കാൻ ഒരിക്കൽ മാത്രം വ്യക്തമാക്കി; വൈരുധ്യവും ആശയവും പൂർണമായി നിലനിർത്തി.
