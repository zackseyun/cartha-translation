id: 1CO.10.22
reference: 1 Corinthians 10:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ παραζηλοῦμεν τὸν κύριον; μὴ ἰσχυρότεροι αὐτοῦ ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/022.yaml
  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: ml
  text: അല്ലെങ്കിൽ നാം കർത്താവിനെ അസൂയപ്പെടുത്തുകയാണോ? നാം അവിടുത്തേക്കാൾ ശക്തരല്ലല്ലോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: അസൂയപ്പെടുത്തുകയാണോ
  rationale: മറ്റൊരാളോടുള്ള കൂറിലൂടെ അസൂയ ഉണർത്തുക എന്ന ക്രിയയുടെ ആശയം നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണവും സന്ദർഭോചിതവുമായ മലയാള പരിഭാഷ.
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: അവിടത്തേക്കാൾ ശക്തർ
  rationale: താരതമ്യരൂപവും ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക സർവനാമവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ അസൂയ
  choice: അസൂയപ്പെടുത്തുക എന്ന ശക്തമായ ദൈവശാസ്ത്രഭാഷ അതേപടി നിലനിർത്തി
  alternative: കർത്താവിനെ കോപിപ്പിക്കുക
  rationale: παραζηλόω വെറും കോപമല്ല, അസൂയ ഉണർത്തുന്നതാണ്; വിഗ്രഹാരാധനയോടുള്ള ഉടമ്പടിപരമായ സംഘർഷം മയപ്പെടുത്തരുത്.
- issue: രണ്ടാമത്തെ ചോദ്യത്തിന്റെ പ്രതീക്ഷിത ഉത്തരം
  choice: നാം അവിടത്തേക്കാൾ ശക്തരല്ലല്ലോ, അല്ലേ?
  alternative: നാം അവിടത്തേക്കാൾ ശക്തരാണോ?
  rationale: ഗ്രീക്കിലെ μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നതായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ആ വാചാടോപബലം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. പരസ്പരം ബന്ധിപ്പിച്ചിരിക്കുന്ന രണ്ട് വാചാടോപചോദ്യങ്ങളും മൂലപാഠത്തിന്റെ മുന്നറിയിപ്പിന്റെ തീവ്രതയും നിലനിർത്തിയിരിക്കുന്നു.
