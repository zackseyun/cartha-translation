  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ὁ δοκῶν ἑστάναι βλεπέτω μὴ πέσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/012.yaml
  text: Therefore[a], let the one who thinks he stands watch out lest he fall.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], താൻ നിൽക്കുന്നു എന്നു കരുതുന്നവൻ വീഴാതിരിക്കാൻ സൂക്ഷിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അതിനാൽ, താൻ നിൽക്കുകയാണെന്നു കരുതുന്നവൻ വീഴാതിരിക്കാൻ ശ്രദ്ധിക്കട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുമ്പ് പറഞ്ഞ മുന്നറിയിപ്പുകളിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ഈ പ്രയോഗം യോജിക്കുന്നു.
- source_word: ὁ δοκῶν
  choice: കരുതുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തിന്റെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἑστάναι
  choice: താൻ നിൽക്കുന്നു
  rationale: ἵστημι എന്ന ക്രിയയുടെ പൂർണ്ണകാല അനന്തക്രിയ സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന അവസ്ഥയെ പകർത്തുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഉറച്ചുനിൽക്കുന്നു’ എന്ന അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: βλεπέτω
  choice: സൂക്ഷിക്കട്ടെ
  rationale: തുടർച്ചയായ ജാഗ്രത ആവശ്യപ്പെടുന്ന വർത്തമാനകാല ആജ്ഞയുടെ മുന്നറിയിപ്പുസ്വരം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: μὴ πέσῃ
  choice: വീഴാതിരിക്കാൻ
  rationale: ആജ്ഞയ്ക്കു പിന്നാലെയുള്ള μή + അനിശ്ചിതഭാവം പ്രകടിപ്പിക്കുന്ന നിഷേധാത്മക ഉദ്ദേശ്യം/മുന്നറിയിപ്പ് സ്വാഭാവികമായി പകർത്തുന്നു.
theological_decisions:
- issue: ‘വീഴുക’ എന്ന മുന്നറിയിപ്പിന്റെ സ്വഭാവം
  choice: ‘വീഴുക’ എന്ന പൊതുവായ പ്രയോഗം നിലനിർത്തി.
  alternative: ‘പാപത്തിൽ വീഴുക’, ‘ന്യായവിധിക്ക് ഇരയാകുക’, അല്ലെങ്കിൽ ‘വിശ്വാസത്തിൽനിന്ന് വീണുപോകുക’
  rationale: സന്ദർഭം ഇസ്രായേലിന്റെ പരാജയങ്ങളെ മുൻനിർത്തി അമിത ആത്മവിശ്വാസത്തിനെതിരെ മുന്നറിയിപ്പു നൽകുന്നുവെങ്കിലും, πέσῃ എന്ന പദം വീഴ്ചയുടെ സ്വഭാവം കൃത്യമായി പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  choice: ‘കരുതുന്നവൻ’ എന്ന പുല്ലിംഗ ഏകവചനം ഉപയോഗിച്ചു.
  alternative: ‘കരുതുന്നവർ’ എന്ന ബഹുവചനം അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമായ പുനരാഖ്യാനം
  rationale: ഗ്രീക്ക് വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പൊതുവായ പ്രതിനിധാന അർഥത്തിലാണ്; അതിന്റെ രൂപവും ഉദ്ദേശ്യവും മലയാളത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ മുന്നറിയിപ്പുശൈലി. ‘സൂക്ഷിക്കട്ടെ’ എന്നത് ആജ്ഞയുടെ ബലം നിലനിർത്തുന്നു; ‘വീഴുക’ എന്നത് ഉദ്ദേശപൂർവം വിശദീകരിക്കാതെ വിട്ടിരിക്കുന്നു.
