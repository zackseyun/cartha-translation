id: 1CO.10.32
reference: 1 Corinthians 10:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: ml
  text: യെഹൂദർക്കോ ഗ്രീക്കുകാർക്കോ ദൈവത്തിന്റെ സഭയ്ക്കോ ഇടർച്ച വരുത്തരുത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആർക്കും ഇടർച്ചയുണ്ടാക്കരുത്” അല്ലെങ്കിൽ “ഇടർച്ചയില്ലാത്തവരായിരിക്കുക.”'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഗ്രീക്കുകാർ” എന്നത് പൗലോസിന്റെ സാഹചര്യത്തിൽ യെഹൂദരല്ലാത്തവരെ പൊതുവായി സൂചിപ്പിക്കുന്നതാകാം; എന്നാൽ ഗ്രീക്ക് മൂലപാഠത്തിൽ നിർദിഷ്ടമായി “ഗ്രീക്കുകാർ” എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: ഇടർച്ച വരുത്തരുത്
  rationale: ഈ സന്ദർഭത്തിൽ മറ്റുള്ളവർക്ക് ഇടർച്ചയോ തടസ്സമോ ഉണ്ടാക്കാത്ത പെരുമാറ്റമാണ് പദം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായ ആജ്ഞാരൂപത്തിൽ ബന്ധപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: γίνεσθε
  choice: വരുത്തരുത്
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ തുടർച്ചയായ പ്രബോധനഭാവം ἀπρόσκοποι എന്നതിനോടു ചേർത്ത് സ്വാഭാവികമായ നിഷേധാത്മക ആജ്ഞയായി അവതരിപ്പിച്ചു.
- source_word: Ἰουδαίοις
  choice: യെഹൂദർക്ക്
  rationale: ഇവിടെ യെഹൂദജനതയെ മത-വംശീയ സമൂഹമായി സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: Ἕλλησιν
  choice: ഗ്രീക്കുകാർക്ക്
  rationale: മൂലപാഠത്തിലെ ‘ഗ്രീക്കുകാർ’ എന്ന നിർദിഷ്ട പദം നിലനിർത്തി; സന്ദർഭത്തിൽ ഇതിന് യെഹൂദരല്ലാത്തവരെ വിശാലമായി സൂചിപ്പിക്കാനാകുമെന്ന കാര്യം അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭയ്ക്ക്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന ‘സഭ’യും ഉടമസ്ഥത/ബന്ധം പ്രകടമാക്കുന്ന ‘ദൈവത്തിന്റെ’ എന്ന രൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ധാർമിക പ്രബോധനത്തിലെ മൂന്ന് സമൂഹങ്ങൾ
  choice: യെഹൂദർ, ഗ്രീക്കുകാർ, ദൈവത്തിന്റെ സഭ എന്നീ മൂന്നു വിഭാഗങ്ങളെയും മൂലപാഠപ്രകാരം വേർതിരിച്ചു നിലനിർത്തി.
  alternative: ‘ഗ്രീക്കുകാർ’ എന്നത് മുഖ്യവാചകത്തിൽ ‘ജാതികൾ’ അല്ലെങ്കിൽ ‘യെഹൂദരല്ലാത്തവർ’ എന്നു പൊതുവാക്കുക.
  rationale: വാക്യം മൂന്നു വിഭാഗങ്ങളെ വ്യക്തമായി പേരെടുത്തു പറയുന്നു. ‘ഗ്രീക്കുകാർ’ എന്നതിന്റെ സന്ദർഭപരമായ വിശാലത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചുകൊണ്ട് മുഖ്യവാചകത്തിലെ പദം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം. ‘ഇടർച്ച വരുത്തുക’ എന്ന ബൈബിൾപരമായി പരിചിതമായ പ്രയോഗം സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; മൂന്നു സമൂഹങ്ങൾക്കും സമാന്തരമായ ‘-ക്കോ’ ഘടന ഉപയോഗിച്ചു.
