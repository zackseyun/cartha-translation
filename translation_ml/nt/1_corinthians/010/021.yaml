  terminology: «കർത്താവ്», «പാനപാത്രം», «മേശ», «പങ്കുചേരുക» എന്നിവ സന്ദർഭോചിതവും സ്ഥിരതയുള്ളതുമാണ്. δαιμονίων-നുള്ള «ദുരാത്മാക്കൾ» വ്യക്തിത്വമുള്ള ദുഷ്ട ആത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്ന സ്വീകാര്യമായ മലയാളപ്രയോഗമാണ്; ഏകവചനമായ പിശാചുമായി കലരുന്നില്ല.
