id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: ml
  text: കർത്താവിന്റെ പാനപാത്രത്തിൽനിന്നു കുടിക്കാനും ദുരാത്മാക്കളുടെ പാനപാത്രത്തിൽനിന്നു കുടിക്കാനും നിങ്ങൾക്കു കഴിയില്ല; കർത്താവിന്റെ മേശയിൽ പങ്കുചേരാനും ദുരാത്മാക്കളുടെ മേശയിൽ പങ്കുചേരാനും നിങ്ങൾക്കു കഴിയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: നിങ്ങൾക്കു കഴിയില്ല
  rationale: ആവർത്തിച്ചിരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വർഗീയമായ അസാധ്യതയും രണ്ടു വാക്യഭാഗങ്ങളിലെ സമാന്തരതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ποτήριον
  choice: പാനപാത്രം
  rationale: ആരാധനാപരവും പങ്കാളിത്തപരവുമായ സന്ദർഭസൂചന നിലനിർത്തുന്ന, വ്യക്തവും മാന്യവുമായ നേരിട്ടുള്ള തത്തുല്യപദം.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും κύριος എന്ന പദത്തിന്റെ പതിവായ ദൈവശാസ്ത്രപരമായ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πίνειν
  choice: കുടിക്കുക
  rationale: δύνασθε-യോടു ചേർന്ന ഇൻഫിനിറ്റീവിനെ ലളിതവും സ്വാഭാവികവുമായി പരിഭാഷപ്പെടുത്തുന്നു; മലയാളത്തിൽ പാത്രത്തിൽനിന്നു കുടിക്കുക എന്നു പറഞ്ഞ് ഉദ്ദേശിക്കപ്പെട്ട ഉള്ളടക്കം വ്യക്തമാക്കുന്നു.
- source_word: δαιμονίων
  choice: ദുരാത്മാക്കൾ
  rationale: വ്യക്തിത്വമുള്ള ദുഷ്ട ആത്മീയ സത്തകളെ സൂചിപ്പിക്കുന്നു; ആധുനിക വായനക്കാർക്കു ‘ഭൂതങ്ങൾ’ എന്നതിനെക്കാൾ വ്യക്തവും ‘പിശാച്’ എന്ന ഏകപ്രധാന ദുഷ്ടസത്തയുമായി ആശയക്കുഴപ്പം വരുത്താത്തതുമാണ്.
- source_word: τραπέζης
  choice: മേശ
  rationale: ആരാധനാപരവും സമൂഹപരവുമായ ദൃശ്യബിംബം വ്യാഖ്യാനാത്മകമായ ‘യാഗപീഠം’ പോലുള്ള വിപുലീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: μετέχειν
  choice: പങ്കുചേരുക
  rationale: യഥാർഥ പങ്കാളിത്തം എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘അനുഭവിക്കുക’ പോലുള്ള പഴയതോ അസ്പഷ്ടമോ ആയ പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: καὶ
  choice: -ആനും … -ആനും
  rationale: രണ്ടു വിരുദ്ധ ആരാധനാപങ്കാളിത്തങ്ങളെയും ബന്ധിപ്പിക്കുന്ന ആവർത്തിച്ച καὶ മലയാളത്തിലെ സമാന്തര ക്രിയാരൂപങ്ങളാൽ വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: കർത്താവിന്റെ മേശയിലും ദുരാത്മാരാധനയിലും പങ്കുചേരുന്നതിനെക്കുറിച്ചുള്ള നിഷേധത്തിന്റെ സ്വഭാവം
  choice: രണ്ടിലും പങ്കുചേരുന്നത് വർഗീയമായി പൊരുത്തപ്പെടാത്തതാണെന്ന അർഥം
  alternative: ഇത് യഥാർഥ അസാധ്യതയല്ല, വെറും ശക്തമായ നിരുത്സാഹപ്പെടുത്തൽ മാത്രമാണെന്ന വായന
  rationale: οὐ δύνασθε എന്ന പ്രയോഗം രണ്ടു സമാന്തര വാക്യഭാഗങ്ങളിലും ആവർത്തിക്കുന്നത് കേവലമായ മുൻഗണനയല്ല, ഉറച്ച അസംഗതിയാണ് സൂചിപ്പിക്കുന്നത്. ‘നിങ്ങൾക്കു കഴിയില്ല’ എന്ന ആവർത്തനം അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ആ ശക്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും സമാന്തരഘടനയും വാക്യത്തിന്റെ വാഗ്മിതാശക്തിക്കായി നിലനിർത്തിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടിക്കുറിപ്പ് അതിന്റെ സ്ഥാനത്തോടും ഉള്ളടക്കത്തോടും പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല; μετέχειν എന്ന പദത്തിന്റെ പങ്കാളിത്താർഥം മുഖ്യവാചകത്തിൽ നേരിട്ട് നൽകിയിരിക്കുന്നു.
