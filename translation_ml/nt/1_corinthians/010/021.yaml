  source_fidelity: ഗ്രീക്കിലെ ആവർത്തിച്ച οὐ δύνασθε എന്ന വർഗീയ അസാധ്യത, ποτήριον/τραπέζης എന്നിവയുടെ സമാന്തരം, πίνειν, μετέχειν എന്നിവയുടെ വ്യത്യസ്ത ക്രിയകൾ എല്ലാം കൃത്യമായി പ്രതിഫലിക്കുന്നു. «പാനപാത്രത്തിൽനിന്നു കുടിക്കുക» എന്ന മലയാളപ്രയോഗം സ്വാഭാവികമാണ്; ഉറവിടത്തിലെ ‘cup’ എന്ന മെറ്റോണിമിയെ അനാവശ്യമായി വികസിപ്പിക്കുന്നില്ല.
