source:
  edition: SBLGNT
  text: καθὼς κἀγὼ πάντα πᾶσιν ἀρέσκω, μὴ ζητῶν τὸ ἐμαυτοῦ ⸀σύμφορον ἀλλὰ τὸ τῶν πολλῶν, ἵνα σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: ml
  text: ഞാനും എല്ലാവരെയും എല്ലാ കാര്യങ്ങളിലും പ്രസാദിപ്പിക്കുന്നു; എന്റെ സ്വന്തം പ്രയോജനമല്ല, അനേകരുടെ പ്രയോജനമാണ് അന്വേഷിക്കുന്നത്, അവർ രക്ഷിക്കപ്പെടേണ്ടതിന്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എല്ലാവർക്കും എല്ലാ കാര്യങ്ങളിലും.’ ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘എല്ലാവരെയും എല്ലാ കാര്യങ്ങളിലും’ എന്നാണ്; മറ്റുള്ളവരുടെ നന്മയ്ക്കുവേണ്ടിയുള്ള വിപുലമായ പൊരുത്തപ്പെടലാണ് ഇതു സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ സ്വന്തം ഗുണമല്ല, അനേകരുടെ ഗുണം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: ഞാനും … ചെയ്യുന്നതുപോലെ
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തോടുള്ള താരതമ്യവും പൗലൊസ് സ്വന്തം മാതൃക ചൂണ്ടിക്കാണിക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: πάντα πᾶσιν
  choice: എല്ലാ കാര്യങ്ങളിലും എല്ലാവരെയും
  rationale: ‘എല്ലാവരെയും എല്ലാ കാര്യങ്ങളിലും’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിപുലമായ വ്യാപ്തി നിലനിർത്തുന്നു; 9:22-ലെ വ്യത്യസ്ത പദപ്രയോഗം ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀρέσκω
  choice: പ്രസാദിപ്പിക്കുന്നു
  rationale: മറ്റുള്ളവർക്ക് ഇഷ്ടകരമായി പ്രവർത്തിക്കുക എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു. തുടർന്നുള്ള പ്രയോജനവാക്യം ഇത് മുഖസ്തുതിയോ മനുഷ്യരുടെ അംഗീകാരം തേടലോ അല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: μὴ ζητῶν
  choice: അന്വേഷിക്കുന്നത് … അല്ല
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ മനോഭാവവും ലക്ഷ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: എന്റെ സ്വന്തം പ്രയോജനം
  rationale: σύμφορον എന്നതിലെ ഗുണകരമോ പ്രയോജനകരമോ ആയത് എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: അനേകരുടെ പ്രയോജനം
  rationale: ഗ്രീക്കിലെ സമാന്തരവും അപൂർണ്ണവുമായ ഘടന മലയാളത്തിൽ വ്യക്തമായി പൂർത്തിയാക്കുന്നു; ‘അനേകർ’ എന്ന മൂലപദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
- source_word: ἵνα σωθῶσιν
  choice: അവർ രക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: ἵνα-വാക്യത്തിന്റെ ഉദ്ദേശ്യാർഥവും σωθῶσιν എന്ന കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; രക്ഷയുടെ കർത്താവിനെ വിവർത്തനം അധികമായി നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: σωθῶσιν എന്നതിന്റെ വ്യാപ്തിയും അർഥവും
  choice: ‘അവർ രക്ഷിക്കപ്പെടേണ്ടതിന്’ എന്ന സാധാരണ പൗലൊസീയ രക്ഷാർഥം
  alternative: ‘അവർ സഹായിക്കപ്പെടേണ്ടതിന്’ അല്ലെങ്കിൽ ‘സംരക്ഷിക്കപ്പെടേണ്ടതിന്’
  rationale: സുവിശേഷപരമായ സമീപസന്ദർഭവും 1 കൊരിന്ത്യരിലെ σῴζω എന്ന പദത്തിന്റെ സാധാരണ പ്രയോഗവും രക്ഷാർഥത്തെ പിന്തുണയ്ക്കുന്നു. കർമണിരൂപം അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
- issue: മറ്റുള്ളവരെ ‘പ്രസാദിപ്പിക്കുക’ എന്നതിന്റെ ധാർമിക സ്വഭാവം
  choice: അവരുടെ നന്മയ്ക്കായി സ്വയം പൊരുത്തപ്പെടുത്തുക
  alternative: മനുഷ്യരുടെ അംഗീകാരം നേടാൻ ശ്രമിക്കുക
  rationale: ‘എന്റെ സ്വന്തം പ്രയോജനമല്ല, അനേകരുടെ പ്രയോജനം’ എന്ന വിശദീകരണം ἀρέσκωയുടെ അർഥത്തെ നിയന്ത്രിക്കുന്നു. അതിനാൽ അടിസ്ഥാനപദമായ ‘പ്രസാദിപ്പിക്കുന്നു’ നിലനിർത്തിക്കൊണ്ട് ദുരുദ്ദേശ്യമായ പ്രീണനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പ്രസാദിപ്പിക്കുന്നു’ എന്നത് മൂലപദത്തോട് അടുത്തുനിൽക്കുന്നു; എന്നാൽ തെറ്റായ മനുഷ്യപ്രീണനമായി വായിക്കാതിരിക്കാനായി പ്രയോജനത്തെക്കുറിച്ചുള്ള വിരുദ്ധഘടന വ്യക്തമായി നിലനിർത്തി. അവസാനത്തെ ‘അങ്ങനെ ചെയ്യുന്നത്’ മലയാളത്തിൽ ഉദ്ദേശ്യബന്ധം വ്യക്തമാക്കാൻ ചേർത്ത സൂചനാപ്രയോഗമാണ്; പുതിയ പ്രവൃത്തി ഒന്നും അതിലൂടെ അവതരിപ്പിക്കുന്നില്ല.
