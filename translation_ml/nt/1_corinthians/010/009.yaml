revisions:
- from: മശീഹയെ[a] നാം പരീക്ഷിക്കുകയുമരുത്; അവരിൽ ചിലർ അദ്ദേഹത്തെ പരീക്ഷിച്ച് പാമ്പുകളാൽ[b] നശിച്ചുകൊണ്ടിരുന്നതുപോലെ.
  to: അവരിൽ ചിലർ അദ്ദേഹത്തെ പരീക്ഷിക്കുകയും പാമ്പുകളാൽ നശിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തതുപോലെ, നാം മശീഹയെ പരീക്ഷിക്കരുത്.
  rationale: The revision resolves the Malayalam syntactic problem by making the comparative clause precede and modify the main prohibition. It also coordinates the historical testing and ongoing destruction, while retaining the source reading, the imperfective force, and both footnote anchors without adding doctrinal interpretation.
