reference: 1 Corinthians 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: ml
  text: അവരിൽ ചിലർ അദ്ദേഹത്തെ പരീക്ഷിക്കുകയും പാമ്പുകളാൽ നശിച്ചുകൊണ്ടിരിക്കുകയും ചെയ്തതുപോലെ, നാം മശീഹയെ പരീക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδὲ
  choice: …കയുമരുത്
  rationale: മുൻവാക്യങ്ങളിലെ വിലക്കുകളുടെ തുടർച്ചയും ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള പ്രബോധനഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκπειράζωμεν
  choice: നാം പരീക്ഷിക്കുകയുമരുത്
  rationale: ഒരാളെ അനുചിതമായി പരീക്ഷണത്തിനു വിധേയനാക്കുക എന്ന നിഷേധാത്മക അർഥം നൽകുന്നു; ‘പ്രലോഭിപ്പിക്കുക’ എന്നത് ഇവിടെ തെറ്റിദ്ധാരണയ്ക്കിടയാക്കും.
- source_word: τὸν Χριστόν
  choice: മശീഹയെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരാണ്; അതിനാൽ പേരുപോലെ ‘ക്രിസ്തു’ എന്നു ലിപ്യന്തരണം ചെയ്യാതെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: καθώς
  choice: …തുപോലെ
  rationale: മരുഭൂമിയിലെ ഇസ്രായേല്യരുടെ സംഭവവുമായി താരതമ്യം അവതരിപ്പിക്കുന്നു.
- source_word: τινες αὐτῶν
  choice: അവരിൽ ചിലർ
  rationale: മരുഭൂമിയിലുണ്ടായിരുന്ന ഇസ്രായേല്യരിൽ ചിലരെ വ്യക്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു.
- source_word: ἐπείρασαν
  choice: അദ്ദേഹത്തെ പരീക്ഷിച്ച്
  rationale: മുൻഖണ്ഡത്തിലെ കർമത്തെ ആവർത്തിച്ചുകൊണ്ട് ചരിത്രത്തിലെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ആദരസൂചക സർവനാമം ആധുനിക മലയാളത്തിന്റെ മാന്യമായ ശൈലിക്ക് യോജിക്കുന്നു.
- source_word: ὑπὸ τῶν ὄφεων
  choice: പാമ്പുകളാൽ
  rationale: ὄφις എന്നതിന്റെ സാധാരണവും വ്യക്തവുമായ ആധുനിക മലയാള പദം; ‘സർപ്പങ്ങൾ’ എന്ന സാഹിത്യപരമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀπώλλυντο
  choice: നശിച്ചുകൊണ്ടിരുന്നതുപോലെ
  rationale: അപൂർണഭൂതകാലരൂപം ചിത്രീകരിക്കുന്ന തുടർന്നുകൊണ്ടിരുന്ന നാശത്തെ മലയാളത്തിൽ കഴിയുന്നത്ര നിലനിർത്തുന്നു; ലളിതമായി ‘നശിച്ചു’ എന്നു പറഞ്ഞാൽ ആ ഭാവം നഷ്ടപ്പെടും.
theological_decisions:
- issue: τὸν Χριστόν എന്ന പാഠവും അതിന്റെ സൂചിതവ്യക്തിയും
  choice: മശീഹയെ
  alternative: കർത്താവിനെ; ക്രിസ്തുവിനെ
  rationale: SBLGNT-യിലെ പാഠം Χριστόν എന്നാണ്; അത് സ്ഥാനപ്പേരായി ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി. ‘കർത്താവ്’ എന്ന പ്രധാന കൈയെഴുത്തുപ്രതി വ്യത്യാസം മറച്ചുവയ്ക്കാതെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി. മരുഭൂമിയിൽ പരീക്ഷിക്കപ്പെട്ടവനുമായി മശീഹയെ ബന്ധിപ്പിക്കുന്ന വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ലഘൂകരിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരും ‘അദ്ദേഹത്തെ’ എന്ന ആദരസൂചക സർവനാമവും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗൗരവം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവം ‘നശിച്ചുകൊണ്ടിരുന്നതുപോലെ’ എന്ന പ്രയോഗത്തിൽ സൂക്ഷിച്ചു.
