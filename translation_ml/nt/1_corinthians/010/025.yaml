  source_fidelity: ‘ഇറച്ചിച്ചന്തയിൽ വിൽക്കുന്നതെന്തും’ πᾶν τὸ ἐν μακέλλῳ πωλούμενον എന്നതിലെ സമഗ്രതയും μάκελλον എന്ന പ്രത്യേക ഇറച്ചിച്ചന്തയും കൃത്യമായി അറിയിക്കുന്നു. ‘ഭക്ഷിക്കുക’ ἐσθίετε എന്ന ബഹുവചന ആജ്ഞാരൂപത്തിന് യോജിക്കുന്നു. ‘ഒന്നും അന്വേഷിക്കാതെ’ μηδὲν ἀνακρίνοντες എന്നതിന്റെ സന്ദർഭോചിതമായ ‘അന്വേഷിക്കാതിരിക്കുക/ചോദിച്ചറിയാതിരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു. ‘മനസ്സാക്ഷി നിമിത്തം’ διὰ τὴν συνείδησιν എന്നതിന്റെ കാരണ-പരിഗണനാഭാവം പുനരാവിഷ്കരിക്കുകയും ആരുടെ മനസ്സാക്ഷിയെന്നുള്ള മൂലത്തിലെ അവ്യക്തത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
  naturalness: വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ഇറച്ചിച്ചന്ത’യും ‘മനസ്സാക്ഷി നിമിത്തം’യും മാന്യമായ വേദപുസ്തക-രജിസ്റ്ററിന് യോജിക്കുന്നു. ക്രിയാവിശേഷണപ്രയോഗമായ ‘ഒന്നും അന്വേഷിക്കാതെ’ ആജ്ഞയോടു സുഗമമായി ചേരുന്നു.
  terminology: ‘ഇറച്ചിച്ചന്ത’ μάκελλον-ന്റെ പ്രത്യേക അർഥത്തെ പൊതുചന്തയായി ചുരുക്കാതെ കാക്കുന്നു. ‘മനസ്സാക്ഷി’ συνείδησις-നു സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദമാണ്. അടിക്കുറിപ്പ് മുഖ്യവാചകത്തിലെ ‘അന്വേഷിക്കാതെ’ എന്ന പ്രയോഗത്തിന് സാധുവായ വ്യാഖ്യാന-ബദലുകൾ നൽകുന്നു; വിഗ്രഹാർപ്പിത ഇറച്ചി എന്ന് വാചകത്തിൽ ചേർത്ത് അർഥം അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
