source:
  edition: SBLGNT
  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: ml
  text: ഇറച്ചിച്ചന്തയിൽ വിൽക്കുന്നതെന്തും മനസ്സാക്ഷി നിമിത്തം ഒന്നും അന്വേഷിക്കാതെ[a] ഭക്ഷിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘യാതൊന്നും ചോദിച്ചറിയാതെ’ അല്ലെങ്കിൽ ‘ഒന്നും പരിശോധിക്കാതെ’; ഇറച്ചിയുടെ പശ്ചാത്തലം അന്വേഷിക്കാതിരിക്കുക എന്നതാണ് സന്ദർഭത്തിലെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: വിൽക്കുന്നതെന്തും
  rationale: നപുംസകലിംഗത്തിലുള്ള substantival പ്രയോഗത്തിന്റെ ‘വിൽക്കപ്പെടുന്ന എല്ലാം/എന്തും’ എന്ന സമഗ്രത സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν μακέλλῳ
  choice: ഇറച്ചിച്ചന്തയിൽ
  rationale: μάκελλον ഒരു പൊതുചന്തയെയല്ല, പ്രത്യേകമായി ഇറച്ചി വിൽക്കുന്ന ചന്തയെയാണ് സൂചിപ്പിക്കുന്നത്; വിഗ്രഹാർപ്പിതമായിരിക്കാവുന്ന ഇറച്ചിയെക്കുറിച്ചുള്ള സന്ദർഭത്തിനും ഇത് യോജിക്കുന്നു.
- source_word: ἐσθίετε
  choice: ഭക്ഷിക്കുക
  rationale: വർത്തമാനകാല സജീവ ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള, മാന്യവും ആധുനികവുമായ മലയാള പരിഭാഷ.
- source_word: μηδὲν ἀνακρίνοντες
  choice: ഒന്നും അന്വേഷിക്കാതെ
  rationale: ἀνακρίνω എന്നതിന് ചോദിച്ചറിയുക, പരിശോധിക്കുക, അന്വേഷിക്കുക എന്നീ അർഥങ്ങളുണ്ട്. ഇവിടെ ഇറച്ചിയുടെ പശ്ചാത്തലം അന്വേഷിക്കാതിരിക്കലാണ് സന്ദർഭാർഥം; അതേസമയം മൂലപദത്തിന്റെ വിശാലതയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: διὰ τὴν συνείδησιν
  choice: മനസ്സാക്ഷി നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം/പരിഗണന സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; ആരുടെ മനസ്സാക്ഷിയാണെന്ന് വാക്യം വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തുപറയുന്നില്ല.
theological_decisions:
- issue: ‘മനസ്സാക്ഷി’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ആരുടെ മനസ്സാക്ഷിയെന്ന് വ്യക്തമാക്കാതെ ‘മനസ്സാക്ഷി’ എന്നു പൊതുവായി നിലനിർത്തി.
  alternative: ‘നിങ്ങളുടെ മനസ്സാക്ഷി’ അല്ലെങ്കിൽ ‘മറ്റൊരാളുടെ മനസ്സാക്ഷി’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിൽ τὴν συνείδησιν (‘മനസ്സാക്ഷി’) എന്നു മാത്രമാണ്; ഈ വാക്യം തന്നെ അതിന്റെ സൂചിതവ്യക്തിയെ വ്യക്തമാക്കുന്നില്ല. തുടർന്നുള്ള സന്ദർഭത്തിനു മുമ്പായി അർഥം തീരുമാനിക്കാതിരിക്കാൻ മൂലത്തിലെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ആരാധനാവായനയ്ക്ക് യോജിക്കുന്നവിധം മാന്യവുമായ ശൈലി. ‘ഇറച്ചിച്ചന്ത’ സാംസ്കാരിക പശ്ചാത്തലം വ്യക്തമായി നൽകുന്നു; ‘മനസ്സാക്ഷി നിമിത്തം’ മൂലത്തിലെ സംക്ഷിപ്തതയും അവ്യക്തതയും നിലനിർത്തുന്നു.
