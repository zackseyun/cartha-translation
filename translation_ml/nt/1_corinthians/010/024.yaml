id: 1CO.10.24
reference: 1 Corinthians 10:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδεὶς τὸ ἑαυτοῦ ζητείτω ἀλλὰ τὸ τοῦ ⸀ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/024.yaml
  text: Let no one seek his own good[a], but that of the other person.
translation:
  language: ml
  text: ആരും സ്വന്തം നന്മ അന്വേഷിക്കരുത്; മറിച്ച് മറ്റൊരാളുടെ നന്മ അന്വേഷിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ആരും തന്റേത് അന്വേഷിക്കരുത്; മറിച്ച് മറ്റൊരാളുടേത് അന്വേഷിക്കട്ടെ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς
  choice: ആരും ... അന്വേഷിക്കരുത്
  rationale: നിഷേധാത്മക അനിശ്ചിത കർത്താവിനോടുകൂടിയ പൊതുവായ വിലക്ക് മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ζητείτω
  choice: അന്വേഷിക്കരുത് / അന്വേഷിക്കട്ടെ
  rationale: ζητέω എന്നതിന്റെ ‘അന്വേഷിക്കുക, ലക്ഷ്യമാക്കുക, തേടുക’ എന്ന വിശാലമായ അർഥപരിധി നിലനിർത്തുന്നു; ആദ്യഭാഗത്തെ നിരോധനവും രണ്ടാംഭാഗത്തെ ഉൾക്കൊള്ളുന്ന നിർദേശവും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ ἑαυτοῦ
  choice: സ്വന്തം നന്മ
  rationale: ‘തന്റേത്’ എന്ന അക്ഷരാർഥത്തിലുള്ള, അപൂർണ്ണമായി വിട്ടിരിക്കുന്ന പ്രയോഗത്തിന് സന്ദർഭം സൂചിപ്പിക്കുന്ന ‘നന്മ’ ചേർക്കുന്നു; സ്വാർത്ഥലാഭം എന്നതിലേക്ക് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: സ്വന്തത്തിനും മറ്റൊരാളുടേതിനുമിടയിലെ ശക്തമായ വിരുദ്ധത സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ τοῦ ἑτέρου
  choice: മറ്റുള്ളവന്റെ നന്മ
  rationale: ἕτερος ഇവിടെ ഒരാളിൽനിന്നു വ്യത്യസ്തനായ മറ്റൊരാളെ സൂചിപ്പിക്കുന്നു. ‘മറ്റുള്ളവൻ’ ലിംഗനിരപേക്ഷമായി വ്യക്തിയെ സൂചിപ്പിക്കുകയും ആദ്യപ്രയോഗത്തിലെ ‘നന്മ’ സ്വാഭാവികമായി ആവർത്തിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου എന്നീ അപൂർണ്ണ പ്രയോഗങ്ങളിൽ സൂചിതമായ പദം ചേർക്കൽ
  choice: ‘സ്വന്തം നന്മ ... മറ്റുള്ളവന്റെ നന്മ’ എന്ന് അർഥം വ്യക്തമാക്കുക
  alternative: ‘തന്റേത് ... മറ്റുള്ളവന്റേത്’ എന്ന് കൂടുതൽ അക്ഷരാർഥത്തിൽ നൽകുക
  rationale: ഗ്രീക്കിൽ വസ്തു വ്യക്തമാക്കാതെ വിടുന്നുണ്ടെങ്കിലും 1 കൊരിന്ത്യർ 10:23–33-ലെ സന്ദർഭം സ്വന്തം പ്രയോജനത്തിനു പകരം മറ്റൊരാളുടെ ഉപകാരം ലക്ഷ്യമാക്കുന്നതാണ്. ‘നന്മ’ ചേർക്കുന്നത് ഈ ധാർമ്മിക ഊന്നൽ അറിയിക്കുന്നു; അതേസമയം അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഏകവചനമായ ‘മറ്റൊരാൾ’ എന്ന ആശയം ‘മറ്റുള്ളവൻ’ വഴി ലിംഗനിരപേക്ഷമായി നിലനിർത്തുന്നു; ‘അവന്റെ’ പോലുള്ള ലിംഗസൂചന ഒഴിവാക്കി.
