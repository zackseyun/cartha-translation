translation:
  language: ml
  text: അവരെല്ലാവരും ഒരേ ആത്മിക ഭക്ഷണം കഴിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അതിമാനുഷിക ഭക്ഷണം’; ഈ പ്രയോഗം മരുഭൂമിയിലെ മന്നായെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; സന്ദർഭത്തിൽ അതിന് പ്രതിരൂപപരമായ പ്രാധാന്യവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -ഉം (ക്രിയയോടുചേർന്ന സമുച്ചയാർഥം)
  rationale: മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്താൻ മലയാളത്തിലെ സ്വാഭാവിക സമുച്ചയരൂപം ഉപയോഗിച്ചു; ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ അനാവശ്യമായ ‘കൂടാതെ’ ഒഴിവാക്കി.
- source_word: πάντες
  choice: അവരെല്ലാവരും
  rationale: സന്ദർഭത്തിലെ ഇസ്രായേൽജനത്തെ സൂചിപ്പിക്കുന്ന പുരുഷലിംഗ ബഹുവചനത്തിന്റെ സമഗ്രതയും ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ αὐτὸ
  choice: ഒരേ
  rationale: ഭക്ഷണത്തിന്റെ ഏകത്വം/ഒന്നുതന്നെയായിരിപ്പ് മലയാളത്തിൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: πνευματικὸν
  choice: ആത്മിക
  rationale: പൗലോസിന്റെ πνευματικός എന്ന പദത്തിന്റെ വിശാലമായ അർഥവും ദൈവികമായ മരുഭൂമിപരിപാലനത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു; ‘പരിശുദ്ധാത്മാവിനാൽ നൽകിയ’ എന്ന കൂടുതൽ ഇടുങ്ങിയ വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: βρῶμα
  choice: ഭക്ഷണം
  rationale: പൊതുവായ ‘food’ എന്ന അർഥത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാളപദം.
- source_word: ἔφαγον
  choice: കഴിച്ചു
  rationale: അവസാനിച്ച ഭൂതകാലപ്രവൃത്തിയെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: മരുഭൂമിയിലെ മാതൃകാത്മക പശ്ചാത്തലത്തിൽ ‘ആത്മിക ഭക്ഷണം’ എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ആത്മിക ഭക്ഷണം’ നിലനിർത്തി.
  alternative: ‘ദൈവം നൽകിയ മന്നാ’, ‘ആത്മാവ് നൽകിയ ഭക്ഷണം’, അല്ലെങ്കിൽ കർത്തൃമേശയുടെ വ്യക്തമായ മാതൃക എന്നിങ്ങനെ വ്യക്തമാക്കുക.
  rationale: ഈ പ്രയോഗം മരുഭൂമിയിലെ മന്നായെ സൂചിപ്പിക്കുന്നതായി തോന്നുകയും ചുറ്റുപാടിൽ മാതൃകാത്മക പ്രാധാന്യം വഹിക്കുകയും ചെയ്യുന്നു. എന്നാൽ പൗലോസ് ഇവിടെ അതിനെ നേരിട്ട് മന്നാ എന്നോ കർത്തൃമേശയുടെ പ്രതിരൂപം എന്നോ നിർവചിക്കുന്നില്ല; അതിനാൽ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ആത്മിക’ എന്ന സഭാപരിചിതമായ പദം മൂലപദത്തിന്റെ അർഥവ്യാപ്തി സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; ‘അവരെല്ലാവരും’ എന്നത് πάντες എന്ന പദത്തിന്റെ സമഗ്ര ഊന്നൽ വ്യക്തമാക്കുന്നു.
