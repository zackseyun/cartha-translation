id: 1CO.10.28
reference: 1 Corinthians 10:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: ml
  text: എന്നാൽ, ആരെങ്കിലും നിങ്ങളോടു, “ഇത് ബലിയായി അർപ്പിക്കപ്പെട്ടതാണ്”[a] എന്നു പറഞ്ഞാൽ, ഇക്കാര്യം അറിയിച്ച വ്യക്തിയെയും മനസ്സാക്ഷിയെയും[b] പരിഗണിച്ച് നിങ്ങൾ അത് ഭക്ഷിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇത് ബലിമാംസമാണ്.” ഗ്രീക്ക് വിശേഷണം ബലിയായി അർപ്പിക്കപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, നിങ്ങളുടെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേയാളുടെ മനസ്സാക്ഷിയെ പരിഗണിച്ചാണ്; അടുത്ത വാക്യം കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: എന്നാൽ ആരെങ്കിലും നിങ്ങളോട് ... എന്നു പറഞ്ഞാൽ
  rationale: ἐὰν കൂടെയുള്ള subjunctive ഒരു സാദ്ധ്യതാപരമായ സാഹചര്യം അവതരിപ്പിക്കുന്നു; τις എന്ന അനിശ്ചിതത്വം ‘ആരെങ്കിലും’ നിലനിർത്തുന്നു; δέ മുൻവാക്യത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് സൂചിപ്പിക്കുന്നു.
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: ഇത് ബലിയർപ്പിച്ചതാണ്
  rationale: ἱερόθυτος ബലിയായി അർപ്പിക്കപ്പെട്ട ഒന്നിനെ സൂചിപ്പിക്കുന്നു. മൂലപദത്തിൽ ഇല്ലാത്ത ‘വിഗ്രഹത്തിന്’ എന്ന ആശയം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാരൂപം ഉപയോഗിക്കുന്നു.
- source_word: μὴ ἐσθίετε
  choice: നിങ്ങൾ അതു ഭക്ഷിക്കരുത്
  rationale: μή സഹിതമുള്ള present imperative നിരോധനമാണ്; സന്ദർഭത്തിൽ വ്യക്തമായ ഭക്ഷണവസ്തുവിനെ സൂചിപ്പിക്കാൻ ‘അതു’ ചേർക്കുന്നു.
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: അത് അറിയിച്ചയാളെ കരുതിയും
  rationale: accusative-നോടുകൂടിയ διά ഇവിടെ ആ വ്യക്തിയോടുള്ള പരിഗണനയെ സൂചിപ്പിക്കുന്നു; μηνύω എന്നതിന്റെ അറിയിക്കുക/വെളിപ്പെടുത്തുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ τὴν συνείδησιν
  choice: മനസ്സാക്ഷിയെ കരുതിയും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സമാന്തരഘടന മലയാളത്തിൽ മുൻപത്തെ പരിഗണനാഭാവത്തോട് ചേർത്ത് വ്യക്തമാക്കുന്നു; ആരുടെ മനസ്സാക്ഷിയെന്നത് മുഖ്യപാഠത്തിൽ അധികമായി വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: τὴν συνείδησιν ആരുടെ മനസ്സാക്ഷിയെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യപാഠത്തിൽ ‘മനസ്സാക്ഷി’ എന്നു മാത്രം നിലനിർത്തി, അടിക്കുറിപ്പിൽ അറിയിച്ച വ്യക്തിയുടെ മനസ്സാക്ഷിയാണെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: ‘അയാളുടെ മനസ്സാക്ഷിയെ കരുതിയും’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക.
  rationale: അടുത്ത വാക്യം അത് ഭക്ഷിക്കുന്നവന്റെ സ്വന്തം മനസ്സാക്ഷിയല്ല, മറ്റെയാളുടേതാണെന്ന് വിശദീകരിക്കുന്നു. ഈ വാക്യത്തിലെ ഗ്രീക്ക് സംക്ഷിപ്തതയും പൗലോസിന്റെ ആശയപ്രവാഹവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ മലയാളം. ‘ബലിയർപ്പിച്ചതാണ്’ മൂലത്തിലെ ആരാധനാസംബന്ധമായ ആശയം നിലനിർത്തുന്നു; ‘വിഗ്രഹത്തിന്’ എന്ന സന്ദർഭപരമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
