  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς φρονίμοις λέγω· κρίνατε ὑμεῖς ὅ φημι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/015.yaml
  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: ml
  text: വിവേകമുള്ളവരോടു സംസാരിക്കുന്നതുപോലെ ഞാൻ നിങ്ങളോടു സംസാരിക്കുന്നു; ഞാൻ പറയുന്നതു നിങ്ങൾതന്നെ വിലയിരുത്തുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിവേകമുള്ളവർ’ എന്നതിന് ‘ബുദ്ധിയുള്ളവർ,’ ‘ജ്ഞാനമുള്ളവർ,’ അല്ലെങ്കിൽ ‘വിവേകികൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘ഞാൻ പറയുന്നതു നിങ്ങൾതന്നെ വിലയിരുത്തുക’ എന്നതിന് ‘ഞാൻ പറയുന്നതിനെ നിങ്ങൾ സ്വയം വിധിക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: -ഓടെന്നപോലെ
  rationale: പൗലോസ് ശ്രോതാക്കളെ ഏതു നിലയിൽ കണ്ട് അഭിസംബോധന ചെയ്യുന്നു എന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φρονίμοις
  choice: വിവേകമുള്ളവർ
  rationale: പ്രായോഗിക ബുദ്ധി, സൂക്ഷ്മബോധം, നല്ല വിവേചനശക്തി എന്നീ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ‘ജ്ഞാനികൾ’ എന്നതിനെക്കാൾ മിതമായ വിശേഷണമാണിത്.
- source_word: λέγω
  choice: ഞാൻ സംസാരിക്കുന്നു
  rationale: ആദ്യ ക്രിയയുടെ അഭിസംബോധനാഭാവം വ്യക്തമാക്കുകയും പിന്നാലെയുള്ള φημί-യിൽനിന്ന് ശൈലീപരമായി വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κρίνατε
  choice: വിലയിരുത്തുവിൻ
  rationale: ഇവിടെ ആവശ്യപ്പെടുന്നത് കേട്ട വാദത്തെ പരിശോധിച്ച് നിഗമനത്തിലെത്തുന്ന വിവേചനപരമായ വിധിയാണ്; ആധുനിക മലയാളത്തിൽ ‘വിധിക്കുവിൻ’ എന്നതിനെക്കാൾ സന്ദർഭോചിതം.
- source_word: ὑμεῖς
  choice: നിങ്ങൾതന്നെ
  rationale: മൂലപാഠത്തിലെ വ്യക്തമായ സർവനാമത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅ
  choice: -ുന്നത്
  rationale: φημί-യുടെ കർമമായ ‘ഞാൻ പറയുന്നത്’ എന്ന സ്വാഭാവിക മലയാള ബന്ധവാക്യം രൂപപ്പെടുത്തുന്നു.
- source_word: φημι
  choice: ഞാൻ പറയുന്നത്
  rationale: ലളിതവും നേരിട്ടുള്ളതുമായ പ്രസ്താവനാഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശ്രോതാക്കളെക്കുറിച്ചുള്ള വാചാടോപപരമായ വിശേഷണം
  choice: അവരെ ‘വിവേകമുള്ളവർ’ എന്ന് അഭിസംബോധന ചെയ്യുന്നു; ഇത് അവരുടെ എല്ലാ പെരുമാറ്റത്തിനുമുള്ള അംഗീകാരമായി വിവർത്തനം ചെയ്യുന്നില്ല.
  alternative: ഇത് പരിഹാസമാണെന്നോ അവരെ പൂർണമായി ജ്ഞാനികളായി പ്രശംസിക്കുന്നുവെന്നോ വ്യക്തമാക്കുക.
  rationale: വാക്യം പൗലോസിന്റെ വാദം അവർ സ്വയം വിലയിരുത്തണമെന്ന ക്ഷണമായി പ്രവർത്തിക്കുന്നു. പരിഹാസമോ സമ്പൂർണ പ്രശംസയോ മൂലപാഠം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ ആ സംഘർഷം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വിലയിരുത്തുവിൻ’ എന്ന ബഹുവചന ആജ്ഞാരൂപം തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
