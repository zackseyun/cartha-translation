id: 1CO.10.29
reference: 1 Corinthians 10:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: ml
  text: ഞാൻ ഉദ്ദേശിക്കുന്നത് നിന്റെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേയാളുടെ മനസ്സാക്ഷിയെയാണ്[a]. എന്തെന്നാൽ, മറ്റൊരാളുടെ മനസ്സാക്ഷിയാൽ എന്റെ സ്വാതന്ത്ര്യം എന്തിന് വിധിക്കപ്പെടുന്നു?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവന്റെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേയാളുടേതിനെ.’ സന്ദർഭം ‘നിന്റെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേയാളുടേതിനെ’ എന്ന അർഥത്തെ പിന്തുണയ്ക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: ഈ വാചാടോപപരമായ ചോദ്യം പൗലോസിന്റെ സ്വന്തം വെല്ലുവിളിയായോ, ഗ്രീക്കിൽ വ്യക്തമായ ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെ അദ്ദേഹം അവതരിപ്പിക്കുന്ന ഒരു എതിർവാദമായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: മനസ്സാക്ഷി
  rationale: ധാർമികമായി പ്രവൃത്തികളെ വിലയിരുത്തുന്ന ആന്തരിക ബോധത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ സാധാരണ പ്രയോഗത്തിന് ആധുനിക മലയാളത്തിലെ കൃത്യവും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: δὲ λέγω
  choice: ഞാൻ ഉദ്ദേശിക്കുന്നത്
  rationale: മുൻവാക്യത്തിലെ ആശയം വിശദീകരിക്കുകയാണ് ഇവിടെ; പുതിയ കാലസൂചന ചേർക്കാതെ വിശദീകരണസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: നിന്റെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേ വ്യക്തിയുടെ മനസ്സാക്ഷിയെയാണ്
  rationale: ഗ്രീക്കിലെ പദക്രമത്തോട് അടുത്തുനിന്നുകൊണ്ട് സന്ദർഭത്തിൽ അഭിസംബോധിതന്റെ മനസ്സാക്ഷിയും മറ്റേയാളുടേതും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἱνατί γὰρ
  choice: എന്തിന്?
  rationale: കാരണം സൂചിപ്പിക്കുന്ന γάρ-ന്റെ ബന്ധം മലയാളത്തിൽ ചോദ്യത്തിന്റെ തുടർച്ചയിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു; ἱνατίയുടെ വാചാടോപപരമായ ‘എന്തിന്’ നിലനിർത്തുന്നു.
- source_word: ἐλευθερία
  choice: സ്വാതന്ത്ര്യം
  rationale: അനുവദനീയമായ പ്രവൃത്തികളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ വ്യക്തവും മതവിഭാഗപരമായ അധികഭാരം ഇല്ലാത്തതുമായ ആധുനിക മലയാളപദം.
- source_word: κρίνεται
  choice: വിധിക്കപ്പെടുന്നത്
  rationale: κρίνωയുടെ നിഷ്ക്രിയരൂപത്തിലുള്ള വിലയിരുത്തൽ/വിധിനിർണയ അർഥം നിലനിർത്തുന്നു; ‘കുറ്റം വിധിക്കുക’ എന്ന ശക്തമായ അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: മറ്റൊരാളുടെ മനസ്സാക്ഷിയാൽ
  rationale: വിധിക്കുന്ന ഘടകത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നിഷ്ക്രിയപ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ സ്വത്വസൂചക സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: 'സന്ദർഭാനുസരിച്ച് അഭിസംബോധിതന്റെ മനസ്സാക്ഷി: ‘നിന്റെ സ്വന്തം മനസ്സാക്ഷി’'
  alternative: 'രൂപപരമായി കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവന്റെ സ്വന്തം മനസ്സാക്ഷിയല്ല, മറ്റേയാളുടേത്’'
  rationale: ἑαυτοῦ രൂപത്തിൽ മൂന്നാംപുരുഷ ഏകവചനമാണെങ്കിലും, മുൻസന്ദർഭത്തിൽ പൗലോസ് വായനക്കാരനോടു നൽകുന്ന നിർദേശം വിശദീകരിക്കുന്നതിനാൽ രണ്ടാംപുരുഷപ്രയോഗം മലയാളത്തിൽ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. രൂപപരമായ വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: രണ്ടാം ഉപവാക്യത്തിലെ വാചാടോപചോദ്യത്തിന്റെ വക്താവ്
  choice: വക്താവിനെ വിവർത്തനത്തിൽ നിർണയിക്കാതെ വാചാടോപചോദ്യമായി നിലനിർത്തുന്നു
  alternative: ഇത് പൗലോസിന്റെ സ്വന്തം വെല്ലുവിളിയായോ, അദ്ദേഹം ഉദ്ധരണിച്ചിഹ്നമില്ലാതെ അവതരിപ്പിക്കുന്ന എതിർവാദമായോ വായിക്കാം
  rationale: ഗ്രീക്ക് പാഠം വക്താവിന്റെ മാറ്റം അടയാളപ്പെടുത്തുന്നില്ല; അതിനാൽ പ്രധാനപാഠം ദൈവശാസ്ത്രപരമായ ഒരു തീർപ്പ് നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനസ്സാക്ഷി’, ‘സ്വാതന്ത്ര്യം’, ‘വിധിക്കപ്പെടുക’ എന്നീ പരിചിത പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ യഥാർഥ വ്യാകരണ-വ്യാഖ്യാന ദ്വയാർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി; പ്രധാനപാഠത്തിൽ മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
