- from: ഞാൻ ഉദ്ദേശിക്കുന്നത് നിന്റെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേ വ്യക്തിയുടെ മനസ്സാക്ഷിയെയാണ്.[a] മറ്റൊരാളുടെ മനസ്സാക്ഷിയാൽ എന്റെ സ്വാതന്ത്ര്യം വിധിക്കപ്പെടുന്നത് എന്തിന്?[b]
  to: ഞാൻ ഉദ്ദേശിക്കുന്നത് നിന്റെ സ്വന്തം മനസ്സാക്ഷിയെയല്ല, മറ്റേയാളുടെ മനസ്സാക്ഷിയെയാണ്[a]. എന്തെന്നാൽ, മറ്റൊരാളുടെ മനസ്സാക്ഷിയാൽ എന്റെ സ്വാതന്ത്ര്യം എന്തിന് വിധിക്കപ്പെടുന്നു?[b]
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നതിലൂടെ പുനഃസ്ഥാപിച്ചു. രണ്ടാം വാക്യത്തിന്റെ പദക്രമം സ്വാഭാവികമാക്കി; ആശയവും വാചാടോപദ്വയാർഥവും മാറ്റിയിട്ടില്ല. അടിക്കുറിപ്പ് a-യിലെ ‘മറ്റേ വ്യക്തി’ എന്ന പ്രയോഗം പ്രധാനപാഠത്തോടു യോജിക്കുന്ന ‘മറ്റേയാൾ’ ആയി ഏകീകരിച്ചു.
