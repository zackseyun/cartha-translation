source:
  edition: SBLGNT
  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: ml
  text: നിങ്ങളും പിറുപിറുക്കരുത്; അവരിൽ ചിലർ പിറുപിറുക്കുകയും സംഹാരകനാൽ നശിപ്പിക്കപ്പെടുകയും ചെയ്തതുപോലെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μηδὲ
  choice: നിങ്ങളും ... അരുത്
  rationale: മുൻപുള്ള വിലക്കുകളോടുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ ‘-ഉം ... അരുത്’ എന്ന ഘടന ഉപയോഗിച്ചു.
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: പിറുപിറുക്കരുത് / പിറുപിറുക്കുകയും
  rationale: അതൃപ്തിയോടെയുള്ള കുറ്റംപറച്ചിലിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം ഒരേ മലയാള പദമൂലത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: καθάπερ
  choice: ചെയ്തതുപോലെ
  rationale: ഇസ്രായേല്യരുടെ മാതൃകയുമായുള്ള വ്യക്തമായ താരതമ്യം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τινὲς αὐτῶν
  choice: അവരിൽ ചിലർ
  rationale: ഭാഗികത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἀπώλοντο
  choice: നശിപ്പിക്കപ്പെടുകയും ചെയ്തു
  rationale: തുടർന്നുള്ള ὑπό-agent പ്രയോഗത്തോട് ചേർന്ന് ബാഹ്യകർത്താവിനാൽ സംഭവിച്ച നാശം വ്യക്തമാക്കാൻ കർമണിപ്രയോഗം നിലനിർത്തി.
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: സംഹാരകനാൽ
  rationale: ഗ്രീക്കിലെ പദവാചകമായ ‘സംഹാരകൻ’ എന്ന അനിശ്ചിതമായ തിരിച്ചറിയൽ നിലനിർത്തുന്നു; ‘ദൂതൻ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ὁ ὀλοθρευτής എന്ന സംഹാരകന്റെ തിരിച്ചറിയൽ
  choice: സംഹാരകൻ
  alternative: സംഹാരദൂതൻ
  rationale: ഗ്രീക്ക് പാഠം ആ കർത്താവിനെ ‘സംഹാരകൻ’ എന്നു മാത്രമേ വിളിക്കുന്നുള്ളൂ. അതിനാൽ കൂടുതൽ നിർദിഷ്ടമായ തിരിച്ചറിയൽ മുഖ്യപാഠത്തിൽ ചേർക്കാതെ, വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പിറുപിറുക്കുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മരുഭൂമിയിലെ ഇസ്രായേലിന്റെ അതൃപ്തിപൂർണമായ കുറ്റംപറച്ചിലിന്റെ ഭാവം നിലനിർത്തുന്നതുമാണ്. ഗ്രീക്കിലെ ആവർത്തനവും സംഹാരകന്റെ തിരിച്ചറിയലിലെ അനിശ്ചിതത്വവും സംരക്ഷിച്ചു.
