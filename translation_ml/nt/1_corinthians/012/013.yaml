revisions:
- from: എന്തെന്നാൽ, യെഹൂദന്മാരായാലും ഗ്രീക്കുകാരായാലും, അടിമകളായാലും സ്വതന്ത്രരായാലും, നാം എല്ലാവരും ഒരേ ആത്മാവിൽ[a] ഒരേ ശരീരത്തിലേക്കു സ്നാനമേറ്റു; നമുക്കെല്ലാവർക്കും ഒരേ ആത്മാവിനെ[c] പാനം ചെയ്യാൻ നൽകപ്പെടുകയും ചെയ്തു.[b]
  to: എന്തെന്നാൽ, യെഹൂദന്മാരായാലും ഗ്രീക്കുകാരായാലും, അടിമകളായാലും സ്വതന്ത്രരായാലും, നാം എല്ലാവരും ഒരേ ആത്മാവിൽ[a] ഒരേ ശരീരത്തിലേക്കു സ്നാനമേറ്റു; ഒരേ ആത്മാവ് കുടിപ്പാനായി നമുക്കെല്ലാവർക്കും നൽകപ്പെടുകയും ചെയ്തു.[b][c]
  rationale: The revision retains the source order and all essential contrasts while making the second passive clause idiomatic and semantically transparent in Malayalam. Footnotes preserve the genuine ambiguity of ἐν and the contextual interpretive question concerning πνεῦμα, without resolving either denominationally.
