id: 1CO.12.13
reference: 1 Corinthians 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: ml
  text: എന്തെന്നാൽ, യെഹൂദന്മാരായാലും ഗ്രീക്കുകാരായാലും, അടിമകളായാലും സ്വതന്ത്രരായാലും, നാം എല്ലാവരും ഒരേ ആത്മാവിൽ[a] ഒരേ ശരീരത്തിലേക്കു സ്നാനമേറ്റു; ഒരേ ആത്മാവ് കുടിപ്പാനായി നമുക്കെല്ലാവർക്കും നൽകപ്പെടുകയും ചെയ്തു.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരേ ആത്മാവിനാൽ.’ ഗ്രീക്കിലെ ἐν എന്ന പദത്തിന് ‘ആത്മാവിൽ’ എന്ന മണ്ഡലാർഥമോ ‘ആത്മാവിനാൽ’ എന്ന മാർഗ/പ്രവർത്തകാർഥമോ സൂചിപ്പിക്കാനാകും.
    reason: alternative_reading
  - marker: b
    text: 'മറ്റൊരു വിധത്തിൽ: ‘നമുക്കെല്ലാവർക്കും ഒരേ ആത്മാവിനെ കുടിപ്പാൻ കൊടുക്കപ്പെട്ടു.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരേ ആത്മാവ്’ ഇവിടെ പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും അതിനെ പൊതുവായ ഒരു ആത്മീയ യാഥാർഥ്യമായി മനസ്സിലാക്കുന്ന വായനയും സാധ്യമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഏകശരീരതയ്ക്ക് വിശദീകരണം നൽകുന്ന γὰρ-ന്റെ ബന്ധകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; καί നൽകുന്ന ഊന്നൽ വാക്യത്തിന്റെ സമഗ്രഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ഒരേ ആത്മാവിൽ
  rationale: ἐν എന്നതിന്റെ മേഖലാസൂചകമായ ‘ൽ’ രൂപം ഗ്രീക്കിനോട് അടുത്തുനിൽക്കുകയും, ആത്മാവ് സ്നാനത്തിന്റെ മേഖലയാണോ പ്രവർത്തകനാണോ എന്ന യഥാർഥ ആശയദ്വന്ദ്വം തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡμεῖς πάντες
  choice: നാം എല്ലാവരും
  rationale: പ്രകടമായ സർവനാമവും πάντες നൽകുന്ന സമൂഹമൊട്ടാകെയുള്ള ഊന്നലും നിലനിർത്തുന്നു.
- source_word: εἰς ἓν σῶμα
  choice: ഒരേ ശരീരത്തിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന പ്രവേശനം/ഉൾച്ചേരൽ നിലനിർത്തുകയും പൗലോസിന്റെ ഏകശരീരരൂപകം നേരിട്ട് സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐβαπτίσθημεν
  choice: സ്നാനമേറ്റു
  rationale: സഭാസന്ദർഭത്തിൽ βαπτίζω എന്നതിന്റെ പതിവും മാന്യവുമായ മലയാളപ്രയോഗം; ‘മുക്കപ്പെട്ടു’ എന്നു പറഞ്ഞ് സ്നാനരീതിയെ അനാവശ്യമായി മുൻനിറുത്തുന്നില്ല.
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: യെഹൂദന്മാർ ... ഗ്രീക്കുകാർ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ യെഹൂദ്യർ എന്നതിലുപരി വംശീയ-മതപരമായ യെഹൂദന്മാരും അവരോടു വിരുദ്ധമായി ഗ്രീക്കുകാരുമാണ് ഉദ്ദേശ്യം.
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: അടിമകൾ ... സ്വതന്ത്രർ
  rationale: നിയമ-സാമൂഹിക ബന്ധനവും സ്വാതന്ത്ര്യവും തമ്മിലുള്ള വ്യക്തമായ വിരോധം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു; δοῦλοι എന്നത് ‘ദാസർ’ എന്നു മൃദൂകരിക്കുന്നില്ല.
- source_word: ἓν πνεῦμα
  choice: ഒരേ ആത്മാവ്
  rationale: സമീപസന്ദർഭത്തിലെ പരിശുദ്ധാത്മാവിന്റെ ഏകീകരണപ്രവർത്തനം കണക്കിലെടുത്ത് വ്യക്തിപരമായ ദൈവാത്മാവിനെയാണ് പ്രധാന വായനയായി എടുക്കുന്നത്; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐποτίσθημεν
  choice: പാനം ചെയ്യാൻ നൽകപ്പെട്ടു
  rationale: ποτίζω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗവും എല്ലാവരും പങ്കിടുന്ന പാനീയരൂപകവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι എന്നത് ‘ഒരേ ആത്മാവിൽ’ എന്നോ ‘ഒരേ ആത്മാവിനാൽ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ഒരേ ആത്മാവിൽ
  alternative: ഒരേ ആത്മാവിനാൽ
  rationale: ഗ്രീക്കിലെ ἐν മേഖല, മാർഗം, പ്രവർത്തകത്വം എന്നിവ സൂചിപ്പിക്കാം. പ്രധാനപാഠം ഗ്രീക്ക് രൂപത്തോട് ചേർന്നുനിൽക്കുന്നു; ആത്മാവ് സ്നാനത്തിന്റെ മേഖലയോ പ്രവർത്തകനോ എന്ന വിവാദം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- issue: രണ്ടാമത്തെ ἓν πνεῦμα പരിശുദ്ധാത്മാവിനെയാണോ പൊതുവായ ആത്മീയ യാഥാർഥ്യത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ഒരേ ആത്മാവ്
  alternative: ഒരേ ആത്മാവ്/ആത്മീയത എന്ന പൊതുവായ അർഥം
  rationale: ആത്മാവിന്റെ ഏകീകരണപ്രവർത്തനത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും ഗ്രീക്ക് കൈയെഴുത്തിൽ വലിയക്ഷര-ചെറിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: δοῦλοι എന്ന സാമൂഹികപദത്തിന്റെ പരിഭാഷ
  choice: അടിമകൾ
  alternative: ദാസർ/സേവകർ
  rationale: ‘സ്വതന്ത്രർ’ എന്ന പ്രതിപദത്തോടുള്ള വിരോധത്തിൽ ബന്ധിതമായ സാമൂഹികപദവി വ്യക്തമാണ്; അതിനാൽ ‘അടിമകൾ’ എന്നതാണ് കൃത്യം.
- issue: ἐποτίσθημεν എന്ന കർമണിരൂപത്തിന്റെ മലയാളഘടന
  choice: ഒരേ ആത്മാവിനെ പാനം ചെയ്യാൻ നൽകപ്പെട്ടു
  alternative: ഒരേ ആത്മാവ് പാനീയമായി നൽകപ്പെട്ടു
  rationale: ആത്മാവിൽ പങ്കാളികളാകുന്നതിന്റെ പാനീയരൂപകം സംരക്ഷിക്കുന്നു; ഗ്രീക്ക് ഘടനയിൽ സാധ്യമായ മറ്റൊരു വിന്യാസം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്നാനമേറ്റു’, ‘പാനം ചെയ്യാൻ നൽകപ്പെട്ടു’ എന്നീ പ്രയോഗങ്ങൾ സഭാസന്ദർഭത്തിലെ പരിചിതത്വവും ഗ്രീക്ക് കർമണിയുടെ അർഥവും തുലനപ്പെടുത്തുന്നു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിലെ സമാന്തര സാമൂഹികജോടികൾ കോമകളാൽ വ്യക്തമായി വേർതിരിക്കുകയും അവസാന ഉപവാക്യം അർദ്ധവിരാമത്തോടെ ബന്ധിപ്പിക്കുകയും ചെയ്തു.
