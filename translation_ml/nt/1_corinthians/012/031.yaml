id: 1CO.12.31
reference: 1 Corinthians 12:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ζηλοῦτε δὲ τὰ χαρίσματα τὰ ⸀μείζονα. καὶ ἔτι καθ’ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: ml
  text: എന്നാൽ, കൂടുതൽ ശ്രേഷ്ഠമായ കൃപാവരങ്ങൾ തീവ്രമായി ആഗ്രഹിക്കുവിൻ.[a] ഇനിയും അത്യുന്നതമായ ഒരു വഴി ഞാൻ നിങ്ങൾക്കു കാണിച്ചുതരാം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്നാൽ, നിങ്ങൾ കൂടുതൽ ശ്രേഷ്ഠമായ കൃപാവരങ്ങൾ തീവ്രമായി ആഗ്രഹിക്കുന്നു.” ഇവിടെ ζηλοῦτε എന്ന ഗ്രീക്ക് രൂപം ആജ്ഞാർഥമായോ സൂചകാർഥമായോ വായിക്കാം.
    reason: alternative_reading
  - marker: b
    text: പരമ്പരാഗതമായി, “ഇനിയും കൂടുതൽ ശ്രേഷ്ഠമായ ഒരു വഴി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: തീവ്രമായി ആഗ്രഹിക്കുവിൻ
  rationale: ζηλόω ശക്തമായ ആഗ്രഹമോ തീക്ഷ്ണതയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ആജ്ഞാർഥം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; രൂപത്തിന്റെ സൂചകാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: χαρίσματα
  choice: കൃപാവരങ്ങൾ
  rationale: χάρισμα കൃപയാൽ ലഭിക്കുന്ന വരത്തെ സൂചിപ്പിക്കുന്നു. 1 കൊരിന്ത്യർ 12-ന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികവും സഭാപരമായി പരിചിതവുമായ പദമാണ് ‘കൃപാവരങ്ങൾ’; മൂലത്തിൽ ഈ വാക്യഭാഗത്ത് ഇല്ലാത്ത ‘ആത്മിക’ എന്ന വിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: μείζονα
  choice: ശ്രേഷ്ഠമായ
  rationale: താരതമ്യപരമായി കൂടുതൽ വലിയതോ പ്രാധാന്യമുള്ളതോ എന്ന ആശയം സന്ദർഭോചിതമായി നൽകുന്നു; വരങ്ങളുടെ ഭൗതിക വലുപ്പമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: καὶ ἔτι
  choice: അതിലുമേറെ
  rationale: മുൻചർച്ചയോട് തുടർച്ചയും ഇനി പറയുന്നതിന്റെ മേന്മയും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: καθ’ ὑπερβολὴν
  choice: അതിശ്രേഷ്ഠമായ
  rationale: പരിധിയെ അതിക്രമിക്കുന്ന മേന്മയെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁδὸν
  choice: വഴി
  rationale: ജീവിതരീതിയെയോ പ്രവർത്തനമാർഗത്തെയോ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: δείκνυμι
  choice: കാണിച്ചുതരാം
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാലരൂപമാണെങ്കിലും, തൊട്ടുപിന്നാലെ പൗലോസ് അവതരിപ്പിക്കാൻ പോകുന്ന വഴിയെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കാൻ സമീപഭാവാർഥമുള്ള ‘കാണിച്ചുതരാം’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ζηλοῦτε എന്ന രൂപത്തിന്റെ ഭാവം
  choice: 'ആജ്ഞാർഥം: ‘തീവ്രമായി ആഗ്രഹിക്കുവിൻ’'
  alternative: 'സൂചകാർഥം: ‘നിങ്ങൾ തീവ്രമായി ആഗ്രഹിക്കുന്നു’'
  rationale: ഈ ഗ്രീക്ക് രൂപം സന്ദർഭത്തിൽ ആജ്ഞാർഥമായോ സൂചകാർഥമായോ വായിക്കാം. അധ്യായത്തിലെ പ്രബോധനധാരയോട് ആജ്ഞാർഥം നന്നായി ചേരുന്നതിനാൽ അത് മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കൃപാവരങ്ങൾ’ എന്ന പരിചിതപദം സന്ദർഭസൂചന നിലനിർത്തുന്നു; സാങ്കേതികമായ അധികവ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങളോട് ചേർത്തിരിക്കുന്നു.
