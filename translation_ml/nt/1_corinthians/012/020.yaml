  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: ml
  text: എന്നാൽ യാഥാർഥ്യത്തിൽ, അവയവങ്ങൾ പലതാണെങ്കിലും ശരീരം ഒന്നാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അംഗങ്ങൾ പലതാണെങ്കിലും ശരീരം ഒന്നാണ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: യാഥാർഥ്യത്തിൽ
  rationale: മുൻവാക്യത്തിലെ സങ്കൽപ്പസാഹചര്യത്തിന് എതിരായി ഇപ്പോഴുള്ള യഥാർഥ സ്ഥിതി സൂചിപ്പിക്കുന്ന സന്ദർഭപരമായ പ്രയോഗം; വെറും കാലസൂചകമായ ‘ഇപ്പോൾ’ എന്നതിനെക്കാൾ വാദത്തിന്റെ തിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സങ്കൽപ്പത്തോട് ലഘുവായ വൈരുധ്യവും വാദത്തിന്റെ പുനരാരംഭവും സൂചിപ്പിക്കുന്നു.
- source_word: πολλὰ ... μέλη
  choice: അവയവങ്ങൾ പലതാണ്
  rationale: ശരീരരൂപകത്തിലെ ഘടകങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായും ശരീരസംബന്ധിയായും സൂചിപ്പിക്കാൻ ‘അവയവങ്ങൾ’ യോജിക്കുന്നു; ‘അംഗങ്ങൾ’ എന്നതിന് സഭാംഗങ്ങൾ എന്ന അർഥവും വരാമെങ്കിലും മൂലപദത്തിലെ രൂപകപരമായ ഇരട്ടപ്രയോഗം അതിലൂടെ കൂടുതൽ നേരിട്ട് നിലനിൽക്കും.
- source_word: μὲν ... δὲ
  choice: പലതാണെങ്കിലും ... ഒന്നാണ്
  rationale: ബഹുത്വവും ഏകത്വവും തമ്മിലുള്ള തുലിതമായ വൈരുധ്യം മലയാളത്തിലെ ‘-ആണെങ്കിലും’ ഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἓν
  choice: ഒന്ന്
  rationale: അനേകം അവയവങ്ങൾക്ക് എതിരായി ശരീരത്തിന്റെ ഏകത്വത്തിന് ഊന്നൽ നൽകുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പൗലോസിന്റെ വിപുലമായ ശരീരരൂപകവും വൈവിധ്യത്തിനുള്ളിലെ ഏകത്വവും നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശരീരരൂപകത്തിൽ μέλη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അവയവങ്ങൾ
  alternative: അംഗങ്ങൾ
  rationale: ‘അവയവങ്ങൾ’ ശരീരത്തിലെ ഘടകങ്ങൾ എന്ന ചിത്രം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. അതേസമയം, സഭയിലെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന രൂപകപരമായ ‘അംഗങ്ങൾ’ എന്ന സാധ്യത മൂലപദത്തിൽ ഉൾപ്പെട്ടിരിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ശരീരരൂപകത്തിന്റെ വ്യക്തതയ്ക്കായി മുഖ്യവാചകത്തിൽ ‘അവയവങ്ങൾ’ ഉപയോഗിച്ചു; സഭാസംബന്ധിയായ പ്രതിധ്വനി നിലനിർത്താൻ ‘അംഗങ്ങൾ’ അടിക്കുറിപ്പിൽ നൽകി.
