revisions:
- from: 'ദൈവം സഭയിൽ ചിലരെ നിയമിച്ചിരിക്കുന്നു: ഒന്നാമത് അപ്പൊസ്തലന്മാരെ, രണ്ടാമത് പ്രവാചകന്മാരെ, മൂന്നാമത് ഉപദേഷ്ടാക്കളെ; പിന്നെ അത്ഭുതപ്രവൃത്തികൾ[a], പിന്നെ രോഗശാന്തികളുടെ വരങ്ങൾ, സഹായങ്ങൾ, കാര്യനിർവഹണങ്ങൾ[b], പലതരം ഭാഷാഭാഷണങ്ങൾ[c].'
  to: 'ദൈവം സഭയിൽ ചിലരെ നിയമിച്ചിരിക്കുന്നു: ഒന്നാമത് അപ്പൊസ്തലന്മാരെ, രണ്ടാമത് പ്രവാചകന്മാരെ, മൂന്നാമത് അധ്യാപകരെ; പിന്നെ അത്ഭുതപ്രവൃത്തികൾ[a], പിന്നെ രോഗശാന്തികളുടെ വരങ്ങൾ, സഹായങ്ങൾ, കാര്യനിർവഹണങ്ങൾ[b], വിവിധതരം ഭാഷകൾ[c].'
  rationale: The revision corrects the substantive mistranslation of διδασκάλους as ‘advisers’ and replaces an awkward, interpretively narrowing rendering of γένη γλωσσῶν. The ordered list and all other lexical choices are retained, while the footnote preserves the source text’s ambiguity regarding γλῶσσαι.
