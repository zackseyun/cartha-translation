review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys God’s appointment within the church, the ordered sequence, miracles/works of power, gifts of healings, helps, and administrations. However, διδασκάλους means “teachers,” not “advisers”; ഉപദേഷ്ടാക്കൾ normally denotes counsellors/advisers and changes the role. The wording for γένη γλωσσῶν should also avoid the nonstandard and interpretively loaded ഭാഷാഭാഷണങ്ങൾ.
  naturalness: The sentence is generally fluent modern Malayalam. അധ്യാപകരെ is the natural, direct term for teachers in this list. വിവിധതരം ഭാഷകൾ is clear and idiomatic; the footnote can preserve the unresolved ‘tongues/languages’ question without introducing an artificial compound in the main text.
  terminology: സഭ, അപ്പൊസ്തലന്മാർ, പ്രവാചകന്മാർ, രോഗശാന്തികളുടെ വരങ്ങൾ, സഹായങ്ങൾ, and കാര്യനിർവഹണങ്ങൾ are suitable. Replace ഉപദേഷ്ടാക്കളെ with അധ്യാപകരെ. For γένη γλωσσῶν, use വിവിധതരം ഭാഷകൾ and explicitly state in the note that the Greek may mean ‘tongues’ or ‘languages,’ without deciding the disputed referent.
  issues:
  - severity: high
    issue: ഉപദേഷ്ടാക്കളെ renders διδασκάλους.
    rationale: διδάσκαλοι are teachers/instructors. ‘Advisers’ refers to a different role and is not a safe equivalent.
  - severity: medium
