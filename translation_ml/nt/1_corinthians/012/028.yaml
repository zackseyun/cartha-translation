id: 1CO.12.28
reference: 1 Corinthians 12:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: ml
  text: 'ദൈവം സഭയിൽ ചിലരെ നിയമിച്ചിരിക്കുന്നു: ഒന്നാമത് അപ്പൊസ്തലന്മാരെ, രണ്ടാമത് പ്രവാചകന്മാരെ, മൂന്നാമത് അധ്യാപകരെ; പിന്നെ അത്ഭുതപ്രവൃത്തികൾ[a], പിന്നെ രോഗശാന്തികളുടെ വരങ്ങൾ, സഹായങ്ങൾ, കാര്യനിർവഹണങ്ങൾ[b], വിവിധതരം ഭാഷകൾ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ശക്തിപ്രവൃത്തികൾ.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “മാർഗനിർദേശങ്ങൾ” അഥവാ “നേതൃത്വത്തിന്റെ വിവിധ രൂപങ്ങൾ.”
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ “വിവിധതരം നാവുകൾ.” ഗ്രീക്ക് പദത്തിന് “നാവുകൾ” അല്ലെങ്കിൽ “ഭാഷകൾ” എന്നർഥമാകാം; ഈ സന്ദർഭത്തിൽ അത് സാധാരണ ഭാഷകളെയോ ആത്മികവരവുമായി ബന്ധപ്പെട്ട ഭാഷണത്തെയോ സൂചിപ്പിക്കുന്നതാണോ എന്നു വിവർത്തനം തീർപ്പാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: നിയമിച്ചിരിക്കുന്നു
  rationale: സഭയിലെ ചുമതലകളിലേക്കും പ്രവർത്തനങ്ങളിലേക്കും ദൈവം നിയോഗിച്ചതെന്ന ആശയവും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: സഭയിൽ
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ദൈവജനത്തിന്റെ കൂട്ടായ്മയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ പദം.
- source_word: πρῶτον ... δεύτερον ... τρίτον
  choice: ഒന്നാമത് ... രണ്ടാമത് ... മൂന്നാമത്
  rationale: മൂലത്തിലെ ക്രമം അതിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരെ
  rationale: പൊതുവായ ദൂതന്മാരെയല്ല, സഭയിൽ അംഗീകരിക്കപ്പെട്ട അപ്പൊസ്തലിക ദൗത്യം വഹിക്കുന്നവരെയാണ് ഈ പട്ടികയിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: προφήτας
  choice: പ്രവാചകന്മാരെ
  rationale: പ്രവാചകസന്ദേശം അറിയിക്കുന്നവർക്കുള്ള വ്യക്തവും സ്ഥിരവുമായ മലയാളപ്രയോഗം.
- source_word: διδασκάλους
  choice: ഉപദേഷ്ടാക്കളെ
  rationale: സഭയിൽ പഠിപ്പിക്കുന്നവരുടെ ചുമതല സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: δυνάμεις
  choice: അത്ഭുതപ്രവൃത്തികൾ
  rationale: അക്ഷരാർഥത്തിൽ ‘ശക്തികൾ’ എന്നാണെങ്കിലും ഈ വരങ്ങളുടെ പട്ടികയിൽ ദൈവശക്തിയുടെ അത്ഭുതകരമായ പ്രവർത്തനങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; കൂടുതൽ അക്ഷരാർഥമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: χαρίσματα ἰαμάτων
  choice: രോഗശാന്തികളുടെ വരങ്ങൾ
  rationale: ഗ്രീക്കിൽ രണ്ടു നാമങ്ങളും ബഹുവചനമായതിനാൽ ആ രൂപവും വൈവിധ്യവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἀντιλήμψεις
  choice: സഹായങ്ങൾ
  rationale: മറ്റുള്ളവരെ താങ്ങുകയും സഹായിക്കുകയും ചെയ്യുന്ന പ്രവർത്തനങ്ങളെയോ കഴിവുകളെയോ ചുരുക്കമായും വ്യക്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: κυβερνήσεις
  choice: കാര്യനിർവഹണങ്ങൾ
  rationale: നയിക്കുക, ക്രമീകരിക്കുക, നടത്തിപ്പ് നിർവഹിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്നു; ഔദ്യോഗിക അധികാരഘടന അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: γένη γλωσσῶν
  choice: പലതരം ഭാഷാഭാഷണങ്ങൾ
  rationale: ഈ അധ്യായത്തിലെ ആത്മികവരത്തിന്റെ പശ്ചാത്തലത്തിൽ വിവിധതരം ഭാഷാഭാഷണങ്ങളെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്ക് പദത്തിന്റെ ‘നാവുകൾ/ഭാഷകൾ’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
theological_decisions:
- issue: പട്ടികയിലെ ക്രമം സ്ഥിരമായ അധികാരശ്രേണിയെയോ കാലക്രമത്തെയോ പ്രവർത്തനപരമായ പ്രാധാന്യത്തെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘ഒന്നാമത് ... രണ്ടാമത് ... മൂന്നാമത് ... പിന്നെ ... പിന്നെ’ എന്ന ക്രമം വ്യാഖ്യാനപരമായ വിശേഷണങ്ങളില്ലാതെ നിലനിർത്തി.
  alternative: അധികാരശ്രേണി, പ്രത്യക്ഷപ്പെട്ട കാലക്രമം, അല്ലെങ്കിൽ ആപേക്ഷിക പ്രാധാന്യക്രമം എന്നിങ്ങനെ വ്യക്തമാക്കുക.
  rationale: വാക്യം ക്രമപ്പെടുത്തിയ ഒരു പട്ടിക നൽകുന്നുവെങ്കിലും ആ ക്രമത്തിന്റെ സ്വഭാവം വിശദീകരിക്കുന്നില്ല; അതിനാൽ വിവർത്തനം ദൈവശാസ്ത്രപരമായ നിഗമനം ചേർക്കുന്നില്ല.
- issue: γλῶσσαι എന്നതിന്റെ കൃത്യമായ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ഭാഷാഭാഷണങ്ങൾ’ ഉപയോഗിച്ച് ആത്മികവരത്തിന്റെ സന്ദർഭം അറിയിച്ചു; അർഥപരിധി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
  alternative: ‘ഭാഷകൾ’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘നാവുകൾ’ എന്നു മാത്രം നൽകുക.
  rationale: മലയാളത്തിൽ ‘നാവുകൾ’ എന്നു മാത്രം പറയുന്നത് ശരീരാവയവമായി തെറ്റിദ്ധരിക്കപ്പെടാം; ‘ഭാഷകൾ’ എന്നു മാത്രം പറയുന്നത് പ്രതിഭാസത്തെ സാധാരണ മനുഷ്യഭാഷകളായി മുൻകൂട്ടി തീർപ്പാക്കാം. പ്രധാനപാഠവും അടിക്കുറിപ്പും ചേർന്ന് സന്ദർഭവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാപ്രയോഗം സ്വീകരിച്ചു. വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ആദ്യത്തെ മൂന്ന് ഘടകങ്ങളിൽ കർമവിഭക്തി ഉപയോഗിക്കുകയും തുടർന്ന് പ്രവർത്തനങ്ങളും വരങ്ങളും പട്ടികപ്പെടുത്തുകയും ചെയ്ത് ഗ്രീക്ക് വാക്യത്തിന്റെ ഘടന മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളുടെ പിന്നാലെ ചേർത്തിരിക്കുന്നു.
