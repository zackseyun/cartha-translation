id: 1CO.12.25
reference: 1 Corinthians 12:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα μὴ ᾖ ⸀σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσι τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/025.yaml
  text: so that there may be no division in the body[b][a], but that the members may have the same concern for one another.
translation:
  language: ml
  text: ശരീരത്തിൽ ഭിന്നത ഉണ്ടാകാതിരിക്കാനും, അവയവങ്ങൾ പരസ്പരം ഒരേ കരുതൽ പുലർത്താനും വേണ്ടിയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവയവങ്ങൾ പരസ്പരം തുല്യമായി കരുതേണ്ടതിനാണ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ഉണ്ടാകാതെ … വേണ്ടതിനാണ്
  rationale: ἵνα ഇവിടെ മുൻവാക്യത്തിലെ ദൈവിക ക്രമീകരണത്തിന്റെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ഉദ്ദേശ്യാർഥം വ്യക്തമാക്കുന്ന ഘടനയാണ് തിരഞ്ഞെടുത്തത്.
- source_word: σχίσμα
  choice: ഭിന്നത
  rationale: പിളർപ്പ്, വിഭാഗീയത എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളുന്ന പദമാണിത്. ശരീരരൂപകത്തിനും സഭാസന്ദർഭത്തിനും യോജിക്കുകയും പിൽക്കാല സാങ്കേതിക സഭാപദം ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: സഭയെ ശരീരമായി അവതരിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τὸ αὐτό
  choice: ഒരേ കരുതൽ
  rationale: μεριμνῶσι എന്ന ക്രിയയോടൊപ്പം അംഗങ്ങൾക്കിടയിലെ സമാനമായ പരിഗണനയെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥത്തിലുള്ള ‘അതേ കാര്യം’ എന്നതിനെക്കാൾ സന്ദർഭത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ὑπὲρ ἀλλήλων
  choice: പരസ്പരം
  rationale: ഒരാൾ മറ്റൊരാളോടു കാണിക്കുന്ന പരസ്പര പരിഗണന സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു; പകരക്കാരനാകുക എന്ന അർഥം ഇവിടെ വരുത്തുന്നില്ല.
- source_word: μεριμνῶσι
  choice: കരുതൽ പുലർത്തുക
  rationale: ഇവിടെ ഉത്കണ്ഠയല്ല, മറ്റുള്ളവരുടെ നന്മയിലുള്ള സജീവമായ ശ്രദ്ധയും പരിചരണവുമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ശരീരത്തിന്റെ ഭാഗങ്ങളെന്ന നേരിട്ടുള്ള രൂപകം കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സഭയിലെ വ്യക്തികളെയും സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: സഭയെക്കുറിച്ചുള്ള ശരീരരൂപകത്തിൽ σχίσμα എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: ഭിന്നത
  alternative: പിളർപ്പ്
  rationale: ‘ഭിന്നത’ സഭയ്ക്കുള്ളിലെ വേർതിരിവ് വ്യക്തമാക്കുന്നു; അതേസമയം പിൽക്കാലത്തെ പ്രത്യേക സഭാചരിത്രപരമോ വിഭാഗീയമോ ആയ സാങ്കേതിക അർഥം വചനത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: τὸ αὐτό അംഗങ്ങളുടെ കരുതലിന്റെ ഒരേ സ്വഭാവമോ തുല്യതയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാന പാഠത്തിൽ ‘ഒരേ കരുതൽ’; അടിക്കുറിപ്പിൽ തുല്യപരിഗണന എന്ന സാധ്യത
  alternative: പരസ്പരം തുല്യമായി കരുതുക
  rationale: ഗ്രീക്ക് പ്രയോഗം അംഗങ്ങൾക്കുള്ള ഒരേവിധത്തിലുള്ള പരസ്പര ശ്രദ്ധയെ സൂചിപ്പിക്കുന്നു. ‘ഒരേ കരുതൽ’ രൂപത്തോട് കൂടുതൽ അടുത്തുനിൽക്കുമ്പോൾ, തുല്യപരിഗണന എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അവയവങ്ങൾ’ എന്ന പദം ശരീരരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു. വാക്യം മുൻസന്ദർഭവുമായി ബന്ധപ്പെട്ടു നിൽക്കുന്ന ഉദ്ദേശ്യവാക്യമാണെന്നത് ‘വേണ്ടതിനാണ്’ എന്ന ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
