id: 1CO.12.17
reference: 1 Corinthians 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: ml
  text: ശരീരം മുഴുവനും കണ്ണായിരുന്നെങ്കിൽ, കേൾവി എവിടെയായിരിക്കും? ശരീരം മുഴുവനും കേൾവിയായിരുന്നെങ്കിൽ, മണക്കാനുള്ള കഴിവ് എവിടെയായിരിക്കും?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: ശരീരം മുഴുവനും
  rationale: ഗ്രീക്കിലെ സമഗ്രതയെ സ്വാഭാവികമായ മലയാള പദക്രമത്തിൽ നിലനിർത്തുകയും ശരീരം മുഴുവനായി ഒരേയൊരു അവയവമായിത്തീരുന്ന സാങ്കൽപ്പിക ദൃശ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὀφθαλμός
  choice: കണ്ണ്
  rationale: ഏകവചനത്തിലുള്ള ശരീരാവയവരൂപകം നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു; മലയാളത്തിൽ വിധേയസ്ഥാനത്ത് അനിശ്ചിത ഉപപദം ആവശ്യമില്ല.
- source_word: ποῦ
  choice: എവിടെയായിരിക്കും?
  rationale: ‘എവിടെ?’ എന്ന അടിസ്ഥാന അർഥത്തോടൊപ്പം സാങ്കൽപ്പിക നിബന്ധനയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀκοή
  choice: കേൾവി
  rationale: ഈ പദം ‘ചെവി’ എന്ന അവയവത്തെക്കാൾ കേൾക്കാനുള്ള ഇന്ദ്രിയശേഷിയെയാണ് സൂചിപ്പിക്കുന്നത്. രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ മലയാളപദം ഉപയോഗിക്കുന്നത് ഗ്രീക്കിലെ ആവർത്തനം നിലനിർത്തുന്നു.
- source_word: ὅλον
  choice: ശരീരം മുഴുവനും
  rationale: രണ്ടാം വാക്യത്തിൽ ‘ശരീരം’ ഗ്രീക്കിൽ അധ്യാഹരിക്കപ്പെട്ടതാണെങ്കിലും, മലയാളത്തിൽ ‘മുഴുവനും’ മാത്രം ഉപയോഗിക്കുന്നത് അവ്യക്തമാകാം. അതിനാൽ അർഥം മാറ്റാതെ നാമം ആവർത്തിക്കുന്നു.
- source_word: ὄσφρησις
  choice: മണക്കാനുള്ള കഴിവ്
  rationale: ‘മൂക്ക്’ എന്ന അവയവമല്ല, മണക്കുക എന്ന ഇന്ദ്രിയശേഷിയാണ് ഗ്രീക്ക് സൂചിപ്പിക്കുന്നത്. ഈ പ്രയോഗം ആ വ്യത്യാസം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ശരീരാവയവരൂപകത്തിൽ ഇന്ദ്രിയശേഷികളെയോ ഭൗതിക അവയവങ്ങളെയോ പറയണമോ
  choice: ἀκοή, ὄσφρησις എന്നിവയെ യഥാക്രമം ‘കേൾവി’, ‘മണക്കാനുള്ള കഴിവ്’ എന്ന് വിവർത്തനം ചെയ്തു.
  alternative: ‘ചെവി എവിടെ?... മൂക്ക് എവിടെ?’
  rationale: ഗ്രീക്ക് മൂലപാഠം ചെവി, മൂക്ക് എന്നീ അവയവനാമങ്ങൾ ഉപയോഗിക്കുന്നില്ല; കേൾക്കലിന്റെയും മണക്കലിന്റെയും ശേഷികളെയാണ് പറയുന്നത്. പ്രവർത്തനപരമായ ഭാഷ നിലനിർത്തുന്നത് പൗലോസിന്റെ വാക്കുകൾ കൂടുതൽ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ രണ്ട് സാങ്കൽപ്പിക ചോദ്യങ്ങളുടെയും സമാന്തരഘടനയും ഇന്ദ്രിയശേഷികളെ സൂചിപ്പിക്കുന്ന ഭാഷയും നിലനിർത്തി. വായനാസൗകര്യത്തിനായി രണ്ടാം ഉപവാക്യത്തിൽ അധ്യാഹരിക്കപ്പെട്ട ‘ശരീരം’ ആവർത്തിച്ചു.
