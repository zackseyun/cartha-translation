id: 1CO.12.24
reference: 1 Corinthians 12:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ⸀ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ⸀ὑστεροῦντι περισσοτέραν δοὺς τιμήν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/024.yaml
  text: but our presentable parts have no need. Instead[a], God has composed the body, giving greater honor to the part that lacked it,
translation:
  language: ml
  text: എന്നാൽ മാന്യമായി കാണപ്പെടുന്ന നമ്മുടെ അവയവങ്ങൾക്ക് പ്രത്യേക പരിചരണം ആവശ്യമില്ല. മറിച്ച്, കുറവുള്ള അവയവത്തിന് കൂടുതൽ ബഹുമാനം നൽകിക്കൊണ്ട് ദൈവം ശരീരത്തെ ഒരുമിച്ചുചേർത്തു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശരീരത്തെ ഒന്നായി കലർത്തിച്ചേർത്തു.’ വ്യത്യസ്ത ഭാഗങ്ങളെ കലർത്തി ഏകീകൃതമായ ഒരു സമഗ്രതയാക്കുക എന്ന ആശയത്തിന് ഗ്രീക്ക് ക്രിയ ഊന്നൽ നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσχήμονα
  choice: ഭംഗിയായി കാണപ്പെടുന്ന നമ്മുടെ അവയവങ്ങൾ
  rationale: ശരീരത്തിന്റെ പുറമേ മാന്യമായോ ഉചിതമായോ കാണപ്പെടുന്ന ഭാഗങ്ങളെ സൂചിപ്പിക്കുകയും മുൻവാക്യത്തിലെ ഭംഗി കുറഞ്ഞ അവയവങ്ങളോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: χρείαν ἔχει
  choice: അതിന്റെ ആവശ്യമില്ല
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുന്നു; സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ പ്രത്യേക പരിചരണമാണ് ‘അതിന്റെ’ സൂചന.
- source_word: συνεκέρασεν
  choice: ഒരുമിച്ചുചേർത്തു
  rationale: വ്യത്യസ്ത ഭാഗങ്ങളെ ഒരു ഏകീകൃത സമഗ്രതയാക്കി കൂട്ടിച്ചേർക്കുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കലർത്തുക എന്ന ഭാവവും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പൗലൊസിന്റെ കേന്ദ്രരൂപകം വിപുലീകരിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: τῷ ὑστεροῦντι
  choice: കുറവുണ്ടായിരുന്ന അവയവത്തിന്
  rationale: അവയവത്തിന് അന്തർലീനമായ മൂല്യം കുറവാണെന്നല്ല, സന്ദർഭത്തിലെ ബഹുമാനമാണ് കുറവുണ്ടായിരുന്നതെന്ന് സൂചിപ്പിക്കുന്നു.
- source_word: περισσοτέραν τιμήν
  choice: കൂടുതൽ ബഹുമാനം
  rationale: താരതമ്യത്തിന്റെ ശക്തി വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δοὺς
  choice: നൽകിക്കൊണ്ട്
  rationale: ദൈവം ശരീരത്തെ ഒരുമിച്ചുചേർത്തത് കൂടുതൽ ബഹുമാനം നൽകിക്കൊണ്ടാണെന്ന ഉപാധിസംബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ശരീരത്തെ ക്രമീകരിക്കുന്ന ദൈവത്തിന്റെ പ്രവൃത്തിയുടെ വ്യാഖ്യാനം
  choice: കുറവുണ്ടായിരുന്ന അവയവത്തിന് കൂടുതൽ ബഹുമാനം നൽകിക്കൊണ്ട് ദൈവം ശരീരത്തെ ഉദ്ദേശ്യപൂർവം ഏകീകരിച്ചു.
  alternative: ഇത് ശരീരഭാഗങ്ങളുടെ ഭൗതികമായ കലർത്തലിനെ മാത്രം സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ സഭാരൂപകവുമായി ബന്ധമില്ലാതെ മനുഷ്യശരീരഘടനയെ മാത്രം സൂചിപ്പിക്കുന്നു.
  rationale: അടുത്തുള്ള സന്ദർഭം സഭയെ ക്രിസ്തുവിന്റെ ശരീരമായി അവതരിപ്പിക്കുന്ന വിപുലമായ രൂപകമാണ്. വിവർത്തനം ശരീരത്തെയും സഭയെയും അനാവശ്യമായി ഒന്നാക്കി വിശദീകരിക്കാതെ രൂപകവും ദൈവത്തിന്റെ ബഹുമാനം നൽകുന്ന പ്രവർത്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അവയവം’ ശരീരരൂപകത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; ‘ഭംഗിയായി കാണപ്പെടുന്ന’ എന്നത് പഴഞ്ചൻ പ്രയോഗങ്ങൾ ഒഴിവാക്കി εὐσχήμοναയുടെ പുറമേയുള്ള മാന്യത/ഉചിതത്വം കൈമാറുന്നു.
