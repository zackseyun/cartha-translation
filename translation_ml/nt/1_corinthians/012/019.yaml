id: 1CO.12.19
reference: 1 Corinthians 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/019.yaml
  text: If all were one member, where would the body be?
translation:
  language: ml
  text: എല്ലാം ഒരൊറ്റ അവയവമായിരുന്നെങ്കിൽ, ശരീരം എവിടെയുണ്ടാകുമായിരുന്നു?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: സാങ്കൽപ്പികമായ വ്യവസ്ഥ അവതരിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ സ്വാഭാവികമായ വ്യവസ്ഥാസൂചക രൂപം തിരഞ്ഞെടുത്തു.
- source_word: δὲ
  choice: —
  rationale: ഇവിടെ δέ വാദത്തിന്റെ ഒഴുക്കിലെ മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെയും സന്ദർഭത്തിലെ വൈരുധ്യം വ്യക്തമാണ്.
- source_word: ἦν
  choice: ആയിരുന്നെങ്കിൽ
  rationale: യാഥാർഥ്യവിരുദ്ധമോ സാങ്കൽപ്പികമോ ആയ വ്യവസ്ഥയെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ πάντα
  choice: എല്ലാം
  rationale: ശരീരത്തിന്റെ എല്ലാ അവയവങ്ങളെയും ഒന്നായി സൂചിപ്പിക്കുന്നു; ‘എല്ലാ വസ്തുക്കളും’ എന്ന അമൂർത്ത അർഥം ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: ἓν μέλος
  choice: ഒരൊറ്റ അവയവം
  rationale: ἓν എന്നതിന്റെ ഊന്നൽ ‘ഒരൊറ്റ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും μέλος എന്ന ശരീരരൂപകം ‘അവയവം’ എന്ന സ്വാഭാവിക മലയാളപദത്തിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ποῦ
  choice: എവിടെയുണ്ടാകുമായിരുന്നു?
  rationale: സാങ്കൽപ്പിക സാഹചര്യത്തിൽ ശരീരത്തിന്റെ നിലനിൽപ്പിനെ ചോദ്യം ചെയ്യുന്ന വാചാടോപചോദ്യത്തിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: τὸ σῶμα
  choice: ശരീരം
  rationale: പൗലോസിന്റെ രൂപകത്തിലെ നിർദിഷ്ടമായ ശരീരത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ക്രിസ്തുവിന്റെ’ എന്ന വിശദീകരണം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ശരീരരൂപകത്തിന്റെ പരിധി
  choice: വൈവിധ്യമുള്ള അവയവങ്ങൾ ചേർന്നാലേ ശരീരം ഉണ്ടാകൂ എന്ന വാചാടോപചോദ്യമായി വിവർത്തനം ചെയ്തു; ‘ക്രിസ്തുവിന്റെ ശരീരം’ എന്ന് വികസിപ്പിച്ചില്ല.
  alternative: ‘ക്രിസ്തുവിന്റെ ശരീരം എവിടെയുണ്ടാകുമായിരുന്നു?’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ വിവർത്തനം.
  rationale: വിശാലമായ സന്ദർഭം സഭയെ ക്രിസ്തുവിന്റെ ശരീരമായി അവതരിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ τὸ σῶμα, ‘ശരീരം,’ എന്നുമാത്രമാണ്. അതിനാൽ മൂലവാക്യത്തിന്റെ രൂപകവും പരിധിയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ‘അവയവം’ ശരീരരൂപകത്തെ വ്യക്തമായി നിലനിർത്തുന്നു; വാചാടോപചോദ്യത്തിന്റെ സാങ്കൽപ്പിക ഭാവം ‘ആയിരുന്നെങ്കിൽ… ഉണ്ടാകുമായിരുന്നു?’ എന്ന ഘടനയിൽ പകരുന്നു.
