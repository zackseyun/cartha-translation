id: 1CO.12.26
reference: 1 Corinthians 12:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: ml
  text: ഒരു അവയവം കഷ്ടം അനുഭവിക്കുന്നുവെങ്കിൽ, എല്ലാ അവയവങ്ങളും അതിനോടൊപ്പം കഷ്ടം അനുഭവിക്കുന്നു; ഒരു അവയവം ആദരിക്കപ്പെടുന്നുവെങ്കിൽ[a], എല്ലാ അവയവങ്ങളും അതിനോടൊപ്പം സന്തോഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മഹത്ത്വീകരിക്കപ്പെടുന്നു.” ഇവിടെ ഒരു അവയവത്തിനു ബഹുമാനം ലഭിക്കുന്നതാണ് ഉദ്ദേശ്യമെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു; ശരീരം മുഴുവൻ ആ സന്തോഷത്തിൽ പങ്കുചേരുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: …എങ്കിൽ …എങ്കിൽ
  rationale: പരസ്പരം ബന്ധപ്പെട്ട രണ്ടു സാദ്ധ്യതകളെ സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കാനും പൗലോസിന്റെ സങ്കൽപ്പദൃഷ്ടാന്തത്തിലെ സാഹചര്യബലം നിലനിർത്താനും ആവർത്തിച്ച നിബന്ധനാരൂപം ഉപയോഗിച്ചു.
- source_word: πάσχει
  choice: കഷ്ടം അനുഭവിക്കുന്നു
  rationale: ശാരീരിക വേദനയിൽ മാത്രം ഒതുക്കാതെ ദുരിതത്തിന്റെയും വേദനയുടെയും വിശാലമായ അർത്ഥം നൽകുന്ന സ്വാഭാവിക പ്രയോഗം.
- source_word: ἓν μέλος
  choice: ഒരു അവയവം
  rationale: ശരീരസങ്കൽപ്പദൃഷ്ടാന്തം നേരിട്ട് നിലനിർത്തുന്നു; സഭയിലെ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന രൂപകാർഥവും സന്ദർഭത്തിൽ വ്യക്തമാണ്.
- source_word: συμπάσχει
  choice: അതിനോടൊപ്പം കഷ്ടം അനുഭവിക്കുന്നു
  rationale: συν- എന്ന ഉപസർഗം സൂചിപ്പിക്കുന്ന പങ്കുചേരുന്ന കഷ്ടാനുഭവം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; ഏകവചനമായ അവയവത്തെയാണ് ‘അതിന്’ സൂചിപ്പിക്കുന്നത്.
- source_word: πάντα τὰ μέλη
  choice: എല്ലാ അവയവങ്ങളും
  rationale: മൂലത്തിലെ ആവർത്തനവും ശരീരരൂപകവും രണ്ടു വാക്യഭാഗങ്ങളിലും ഒരേപോലെ സംരക്ഷിക്കുന്നു.
- source_word: δοξάζεται
  choice: ആദരിക്കപ്പെടുന്നു
  rationale: ഈ ശരീര-സമൂഹ സന്ദർഭത്തിൽ ലഭിക്കുന്ന ബഹുമാനമോ മാനമോ ആണ് പ്രധാന അർത്ഥം; സാങ്കേതികമായ ദൈവശാസ്ത്രാർഥം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: μέλος
  choice: ഒരു അവയവം
  rationale: രണ്ടാമത്തെ വാക്യഭാഗത്തിൽ സംഖ്യാവാചകമായ ἕν ഇല്ലെങ്കിലും അനിശ്ചിതമായ ഏകവചനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഒരു അവയവം’ എന്നു പറയുന്നു.
- source_word: συγχαίρει
  choice: അതിനോടൊപ്പം സന്തോഷിക്കുന്നു
  rationale: മറ്റൊരു അവയവത്തിനു ലഭിക്കുന്ന ആദരവിൽ പങ്കുചേർന്ന് സന്തോഷിക്കുന്നതെന്ന സംയുക്തക്രിയയുടെ ആശയം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സഭയെന്ന ശരീരത്തിന്റെ രൂപകത്തിൽ δοξάζεται എന്നതിന്റെ അർത്ഥം
  choice: സമൂഹത്തിനുള്ളിൽ ആദരിക്കപ്പെടുന്നു
  alternative: മഹത്ത്വീകരിക്കപ്പെടുന്നു
  rationale: അവയവങ്ങളുടെ പരസ്പരകരുതലും ആശ്രയത്വവുമാണ് തൊട്ടടുത്ത സന്ദർഭം. അതിനാൽ ദൈവികമോ അന്ത്യകാലപരമോ ആയ മഹത്ത്വീകരണം നിർബന്ധമായി സൂചിപ്പിക്കാതെ സാമൂഹികമായ ആദരത്തിന്റെ അർത്ഥം പ്രധാനപാഠത്തിൽ നൽകി; വിശാലമായ പദസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവയവം’ എന്ന പദം ശരീരരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു. സമാന്തരമായ രണ്ടു വാക്യഭാഗങ്ങളിലെ ആവർത്തനം പൗലോസിന്റെ ഊന്നൽ സംരക്ഷിക്കാനായി ഒഴിവാക്കിയിട്ടില്ല.
