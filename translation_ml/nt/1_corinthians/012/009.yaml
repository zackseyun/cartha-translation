source:
  edition: SBLGNT
  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: ml
  text: മറ്റൊരാൾക്ക് അതേ ആത്മാവിനാൽ വിശ്വാസം[a]; മറ്റൊരാൾക്ക് ആ ഏക ആത്മാവിനാൽ രോഗശാന്തികളുടെ വരങ്ങൾ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ (πίστις) എന്നതിന് ‘വിശ്വസ്തത’ എന്നോ ‘ആശ്രയം’ എന്നോ പരിഭാഷപ്പെടുത്താനും കഴിയും.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘രോഗശാന്തികളുടെ വരങ്ങൾ’; രണ്ടു നാമങ്ങളും ബഹുവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: മറ്റൊരാൾക്ക്
  rationale: മുൻവാക്യത്തിൽ ആരംഭിച്ച വിതരണക്രമം തുടരുന്ന ദത്തിവ് ഏകവചനമാണ്. ഗ്രീക്കിലെ ἑτέρῳ, ἄλλῳ എന്നിവയ്ക്കിടയിൽ ഇവിടെ ഉദ്ദേശിക്കാത്ത മൂർച്ചയേറിയ വ്യത്യാസം കൽപ്പിക്കാതെ സ്വാഭാവിക മലയാളം നൽകുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: പൗലോസിന്റെ സാധാരണ പ്രയോഗത്തോടും ഈ ആത്മദാനസന്ദർഭത്തോടും യോജിക്കുന്ന വിശാലമായ പദം. ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: അതേ ആത്മാവിനാൽ
  rationale: ἐν + ദത്തിവ് ഇവിടെ ആത്മാവിന്റെ പ്രവർത്തകത്വം അഥവാ മാധ്യമം സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. αὐτῷ എന്നതിലെ ‘അതേ’ എന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἄλλῳ
  choice: വേറൊരാൾക്ക്
  rationale: ദാനങ്ങളുടെ വിതരണം തുടരുന്നതിനെ സൂചിപ്പിക്കുന്നു. ἑτέρῳ എന്ന ആദ്യപ്രയോഗത്തിൽനിന്നുള്ള പദവൈവിധ്യം ലഘുവായി പ്രതിഫലിപ്പിക്കുമ്പോഴും കൃത്രിമമായ അർത്ഥവ്യത്യാസം സൃഷ്ടിക്കുന്നില്ല.
- source_word: χαρίσματα ἰαμάτων
  choice: രോഗസൗഖ്യങ്ങളുടെ വരങ്ങൾ
  rationale: രണ്ടു നാമങ്ങളും ഗ്രീക്കിൽ ബഹുവചനമാണെന്ന സവിശേഷത നിലനിർത്തുന്നു. ‘രോഗസൗഖ്യം’ എന്നത് സാധാരണ മലയാളത്തിൽ ഉദ്ദേശിച്ച ശാരീരിക/വ്യാധിസംബന്ധമായ സൗഖ്യമാക്കൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: ഏക ആത്മാവിനാൽ
  rationale: ἑνὶ എന്നതിന്റെ ‘ഒന്ന്/ഏകം’ എന്ന ഐക്യഊന്നൽ നിലനിർത്തുകയും ἐν-നെ പ്രവർത്തകത്വം സൂചിപ്പിക്കുന്ന ‘-നാൽ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആത്മദാനങ്ങളുടെ സന്ദർഭത്തിലെ πίστις എന്ന പദത്തിന്റെ അർത്ഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഇവിടെ ആത്മാവു നൽകുന്ന ഒരു പ്രത്യേക ശേഷിയെയാകാം സൂചിപ്പിക്കുന്നത്; എങ്കിലും രക്ഷാകരവിശ്വാസം, അത്ഭുതവിശ്വാസം തുടങ്ങിയ പ്രത്യേക ദൈവശാസ്ത്ര നിർവചനങ്ങൾ പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല. യഥാർഥ പദസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πνεύματι എന്നതിന്റെ സൂചിതവസ്തു
  choice: പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: മനുഷ്യാത്മാവ് അഥവാ പൊതുവായ ‘ആത്മാവ്’
  rationale: 1 കൊരിന്ത്യർ 12-ലെ ചുറ്റുപാടും ദാനവിതരണത്തിന്റെ ആവർത്തിത രൂപവും ഇത് പരിശുദ്ധാത്മാവാണെന്ന് വ്യക്തമാക്കുന്നു; മലയാളത്തിലെ ആദരസൂചക പ്രയോഗം ഈ സൂചനയ്ക്ക് യോജിക്കുന്നു.
- issue: ‘അതേ ആത്മാവ്’ എന്നും ‘ഏക ആത്മാവ്’ എന്നും ഉള്ള വ്യത്യാസം
  choice: ഗ്രീക്കിലെ വ്യത്യാസം നിലനിർത്തുന്നു
  alternative: രണ്ടിടത്തും ‘അതേ ആത്മാവ്’ എന്നു ഏകീകരിക്കുക
  rationale: αὐτῷ, ἑνὶ എന്നീ വ്യത്യസ്ത പദങ്ങൾ യഥാക്രമം ഒരേ ഉറവിടത്തെയും ആത്മാവിന്റെ ഏകത്വത്തെയും ഊന്നുന്നു; അവയെ സമതലപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിലെ പട്ടികയുടെ തുടർച്ചയായതിനാൽ ഗ്രീക്കുപോലെ ക്രിയ വ്യക്തമാക്കാതെ വിതരണരൂപം നിലനിർത്തി. ‘സൗഖ്യങ്ങളുടെ വരങ്ങൾ’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യം വ്യക്തമാക്കാൻ ‘രോഗസൗഖ്യങ്ങളുടെ വരങ്ങൾ’ തിരഞ്ഞെടുത്തു.
