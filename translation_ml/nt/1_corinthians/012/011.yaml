id: 1CO.12.11
reference: 1 Corinthians 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα, διαιροῦν ἰδίᾳ ἑκάστῳ καθὼς βούλεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: ml
  text: എന്നാൽ ഇവയെല്ലാം പ്രവർത്തിപ്പിക്കുന്നത് ഒരേ ആത്മാവുതന്നെയാണ്[a][b]; അവിടുന്ന് താൻ ഇച്ഛിക്കുന്നതുപോലെ ഓരോരുത്തർക്കും പ്രത്യേകം വീതിച്ചുനൽകുന്നു[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രവർത്തിപ്പിക്കുന്നു’ എന്നതിന് ‘ഉളവാക്കുന്നു’ അല്ലെങ്കിൽ ‘ഫലപ്പെടുത്തുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിലെ ‘ഒന്നായതും അതേതന്നെയായതുമായ ആത്മാവ്’ എന്ന പ്രയോഗം വ്യത്യസ്ത ദാനങ്ങൾ ഒരേയൊരു ഉറവിടത്തിൽനിന്നാണെന്നതിന് ഊന്നൽ നൽകുന്നു.
    reason: cross_reference
  - marker: c
    text: ‘വീതിച്ചുനൽകുന്നു’ എന്നതിന് ‘പങ്കിട്ടുനൽകുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ‘താൻ ഇച്ഛിക്കുന്നതുപോലെ’ എന്നതിന് ‘താൻ തിരഞ്ഞെടുക്കുന്നതുപോലെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് ക്രിയയ്ക്ക് ഇച്ഛിക്കുക, തിരഞ്ഞെടുക്കുക, ആഗ്രഹിക്കുക എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: എന്നാൽ ഇവയെല്ലാം
  rationale: δέ മുമ്പുള്ള വൈവിധ്യമാർന്ന ദാനങ്ങളുടെ പട്ടികയിൽനിന്ന് അവയുടെ ഏക ഉറവിടത്തിലേക്കുള്ള മൃദുവായ വ്യത്യാസം സൂചിപ്പിക്കുന്നു; πάντα ... ταῦτα എന്ന സമുച്ചയം ‘ഇവയെല്ലാം’ എന്നു പൂർണതയോടെ നൽകുന്നു.
- source_word: ἐνεργεῖ
  choice: പ്രവർത്തിപ്പിക്കുന്നത്
  rationale: ഇവിടെ ക്രിയ സജീവമായി പ്രവർത്തിക്കുക, ഫലമുണ്ടാക്കുക എന്നീ അർഥങ്ങൾ ഉൾക്കൊള്ളുന്നു. ‘പ്രവർത്തിപ്പിക്കുന്നത്’ ആത്മാവിന്റെ കാരകപ്രവർത്തനം നിലനിർത്തുന്നു; പ്രവർത്തനരീതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: ഒരേ ആത്മാവുതന്നെയാണ്
  rationale: ἓν καὶ τὸ αὐτό വൈവിധ്യമാർന്ന ദാനങ്ങളുടെ ഉറവിടം അതേ ഒരേയൊരു ആത്മാവാണെന്ന ഊന്നൽ നൽകുന്നു. ‘തന്നെയാണ്’ ആ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: διαιροῦν
  choice: വീതിച്ചുനൽകുന്നു
  rationale: ദാനങ്ങൾ ഓരോരുത്തർക്കും പങ്കിട്ടു നൽകുന്നതാണ് സന്ദർഭം. ‘വീതിച്ചുനൽകുന്നു’ പങ്കുവെക്കലിന്റെയും അനുവദിച്ചുനൽകലിന്റെയും ആശയം നൽകുന്നു; പ്രതികൂലമായ ‘വിഭജിക്കുന്നു’ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἰδίᾳ ἑκάστῳ
  choice: ഓരോരുത്തർക്കും പ്രത്യേകം
  rationale: ἑκάστῳ ഓരോ വ്യക്തിയെയും വിതരണപരമായി സൂചിപ്പിക്കുന്നു; ἰδίᾳ ആ നൽകൽ വ്യക്തിവ്യക്തിയായി നടക്കുന്നതാണെന്ന് ഊന്നുന്നു.
- source_word: καθὼς βούλεται
  choice: താൻ ഇച്ഛിക്കുന്നതുപോലെ
  rationale: βούλομαι ഇച്ഛ, തീരുമാനം, തിരഞ്ഞെടുപ്പ് എന്നിവ സൂചിപ്പിക്കാം. ‘താൻ ഇച്ഛിക്കുന്നതുപോലെ’ ആത്മാവിന്റെ വ്യക്തിപരമായ ഉദ്ദേശ്യപ്രവർത്തനം നിലനിർത്തുകയും അർഥപരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα / βούλεται എന്നതിലെ ആത്മാവിന്റെ വ്യക്തിപരമായ പ്രവർത്തനം
  choice: ‘അവിടുന്ന് താൻ ഇച്ഛിക്കുന്നതുപോലെ’ എന്ന് നൽകി ആത്മാവിനെ വ്യക്തിപരമായി പ്രവർത്തിക്കുന്ന കർത്താവായി അവതരിപ്പിച്ചു.
  alternative: വ്യാകരണലിംഗത്തെ പിന്തുടർന്ന് വ്യക്തിത്വം വ്യക്തമാക്കാത്ത ‘അത് ഇച്ഛിക്കുന്നതുപോലെ’ എന്നോ, കർത്താവ് മറച്ച ‘ഇച്ഛപ്രകാരം’ എന്നോ നൽകാം.
  rationale: ഗ്രീക്കിൽ πνεῦμα നപുംസകലിംഗമാണെങ്കിലും βούλεται ആത്മാവിന് ഇച്ഛാശക്തി ചാർത്തുന്നു. മലയാളത്തിലെ ‘അവിടുന്ന്/താൻ’ സന്ദർഭത്തിലെ വ്യക്തിപരമായ ദൈവിക പ്രവർത്തനം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; വ്യാകരണലിംഗത്തിൽനിന്ന് മാത്രം അധിക നിഗമനം വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ ഏക ആത്മാവും വൈവിധ്യമാർന്ന ദാനങ്ങളും തമ്മിലുള്ള ഊന്നൽ നിലനിർത്തി. ‘അവിടുന്ന്’ ആത്മാവിനോടുള്ള ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു; പദപ്രയോഗം സഭാവിഭാഗ-വിശേഷമായ സാങ്കേതിക ഭാഷ ഒഴിവാക്കുന്നു.
