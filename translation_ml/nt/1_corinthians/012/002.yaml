id: 1CO.12.2
reference: 1 Corinthians 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἴδατε ὅτι ὅτε ἔθνη ἦτε πρὸς τὰ εἴδωλα τὰ ἄφωνα ὡς ἂν ἤγεσθε ἀπαγόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: ml
  text: നിങ്ങൾ വിജാതീയരായിരുന്നപ്പോൾ[a], എങ്ങനെയൊക്കെയോ നയിക്കപ്പെട്ട് സംസാരിക്കാൻ കഴിയാത്ത വിഗ്രഹങ്ങളിലേക്കു കൊണ്ടുപോകപ്പെട്ടിരുന്നതു[b] നിങ്ങൾക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ ‘ജാതികൾ’; ഇവിടെ യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിങ്ങൾ എങ്ങനെയൊക്കെയോ നയിക്കപ്പെട്ടിരുന്നുവോ, അങ്ങനെ സംസാരിക്കാൻ കഴിയാത്ത വിഗ്രഹങ്ങളിലേക്കു കൊണ്ടുപോകപ്പെട്ടിരുന്നു.’ ഗ്രീക്കിലെ രണ്ട് കർമണിപ്രയോഗങ്ങൾ അവരുടെ മുൻകാലത്തെ മറ്റുള്ളവരുടെ സ്വാധീനത്തിനു കീഴിലുള്ള നീക്കത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: നിങ്ങൾക്കറിയാം
  rationale: പൗലോസ് വായനക്കാരുടെ പൊതുവായ അറിവിനെ നേരിട്ട് ഓർമിപ്പിക്കുന്ന വർത്തമാനകാല പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔθνη
  choice: വിജാതീയർ
  rationale: ഇവിടെ യഹൂദരല്ലാത്തവരെന്ന വംശീയ-മതപരമായ പശ്ചാത്തലം സൂചിപ്പിക്കുന്നു; ‘ജാതികൾ’ എന്ന അക്ഷരാർഥത്തേക്കാൾ സന്ദർഭത്തിൽ വ്യക്തവും ‘പുറജാതിക്കാർ’ എന്നതിനേക്കാൾ സമകാലികവുമാണ്.
- source_word: τὰ ἄφωνα εἴδωλα
  choice: സംസാരിക്കാത്ത വിഗ്രഹങ്ങൾ
  rationale: ἄφωνα സൂചിപ്പിക്കുന്ന സംസാരിക്കാനാവാത്ത അവസ്ഥ വ്യക്തമായി നൽകുകയും, ചുറ്റുപാടിലെ ആത്മപ്രേരിതമായ സംസാരത്തോടുള്ള വൈരുധ്യം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὡς ἂν ἤγεσθε
  choice: എങ്ങനെയൊക്കെ നയിക്കപ്പെട്ടോ അങ്ങനെയൊക്കെ
  rationale: ὡς ἂν എന്നതിന്റെ അനിശ്ചിത രീതിബോധവും ἤγεσθε എന്ന അപൂർണകാല കർമണിപ്രയോഗവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ἀπαγόμενοι
  choice: നയിച്ചുകൊണ്ടുപോകപ്പെട്ടിരുന്നുവെന്ന്
  rationale: ഒരു സ്വാധീനത്തിന് കീഴിൽ ലക്ഷ്യത്തിലേക്കു കൊണ്ടുപോകപ്പെട്ട തുടർച്ചയായ കർമണി ചലനം പ്രകടമാക്കുന്നു; മുൻപത്തെ ἤγεσθε-യോടുള്ള ആവർത്തനവും പൂർണമായി മായ്ച്ചുകളയുന്നില്ല.
theological_decisions:
- issue: ἔθνη എന്ന പദം കൊരിന്ത്യരുടെ മുൻകാല അവസ്ഥയെ എങ്ങനെ സൂചിപ്പിക്കുന്നു
  choice: ‘വിജാതീയർ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘ജാതികൾ’ അല്ലെങ്കിൽ ‘പുറജാതിക്കാർ’
  rationale: യഹൂദരല്ലാത്ത വംശീയ-മതപരമായ മുൻകാല തിരിച്ചറിവ് നിലനിർത്തുന്നു; പാഠത്തിൽ ഇല്ലാത്ത അധിക ധാർമിക കുറ്റപ്പെടുത്തൽ ചേർക്കുന്നില്ല.
- issue: സംസാരിക്കാത്ത വിഗ്രഹങ്ങളും ആത്മാവിനാൽ ഉണ്ടാകുന്ന സംസാരവും തമ്മിലുള്ള സന്ദർഭപരമായ വൈരുധ്യം
  choice: ‘സംസാരിക്കാത്ത വിഗ്രഹങ്ങൾ’ എന്ന നേരിട്ടുള്ള പ്രയോഗം നിലനിർത്തി
  alternative: ‘ശബ്ദമില്ലാത്ത വിഗ്രഹങ്ങൾ’ അല്ലെങ്കിൽ ‘സംസാരിക്കാൻ കഴിയാത്ത വിഗ്രഹങ്ങൾ’
  rationale: വിഗ്രഹങ്ങളുടെ സംസാരശേഷിയില്ലായ്മ വ്യക്തമാക്കുന്നു; എന്നാൽ ആ വൈരുധ്യത്തെ വാക്യത്തിനകത്ത് വിശദീകരിച്ച് ദൈവശാസ്ത്രപരമായി വികസിപ്പിക്കുന്നില്ല.
- issue: ἤγεσθε, ἀπαγόμενοι എന്നീ രണ്ട് കർമണിപ്രയോഗങ്ങളുടെ ബന്ധം
  choice: ‘നയിക്കപ്പെട്ടോ ... നയിച്ചുകൊണ്ടുപോകപ്പെട്ടിരുന്നു’ എന്ന ആവർത്തനസാദൃശ്യം നിലനിർത്തി
  alternative: ‘എങ്ങനെയായാലും അവയിലേക്കു വഴിതെറ്റിപ്പോയിരുന്നു’
  rationale: മുൻകാല സ്വാധീനത്തിൻ കീഴിലുള്ള അവരുടെ നിഷ്ക്രിയ നീക്കത്തിന് ഗ്രീക്ക് നൽകുന്ന ഊന്നൽ സംരക്ഷിക്കുകയും, അത് സ്വമേധയുള്ള പ്രവർത്തിയായി മാറ്റാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കർമണിപ്രയോഗങ്ങളുടെ ആവർത്തനം മലയാളത്തിൽ അല്പം അസാധാരണമായിരുന്നാലും, ഗ്രീക്കിലെ ദ്വിപ്രയോഗവും അതിന്റെ ഊന്നലും സംരക്ഷിക്കാൻ നിയന്ത്രിതമായി നിലനിർത്തി.
