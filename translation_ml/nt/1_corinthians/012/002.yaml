- from: നിങ്ങൾ വിജാതീയരായിരുന്നപ്പോൾ[a], എങ്ങനെയൊക്കെ നയിക്കപ്പെട്ടോ അങ്ങനെയൊക്കെ, സംസാരിക്കാത്ത വിഗ്രഹങ്ങളിലേക്കു നയിച്ചുകൊണ്ടുപോകപ്പെട്ടിരുന്നുവെന്ന്[b] നിങ്ങൾക്കറിയാം.
