id: 1CO.12.14
reference: 1 Corinthians 12:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ γὰρ τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/014.yaml
  text: For the body is not one member, but many.
translation:
  language: ml
  text: കാരണം, ശരീരം ഒരു അവയവമല്ല, അനേകം അവയവങ്ങളാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തെ വിശദീകരിച്ചു പിന്തുണയ്ക്കുന്ന ബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രണ്ടു ഗ്രീക്ക് അവ്യയങ്ങളെയും കൃത്രിമമായി വേർതിരിച്ചു പകർത്തുന്നില്ല.
- source_word: τὸ σῶμα
  choice: ശരീരം
  rationale: നാമനിർദേശകർത്താവിന്റെ നേരിട്ടുള്ള പരിഭാഷ. സഭയെ സൂചിപ്പിക്കുന്ന രൂപകം സന്ദർഭത്തിലുണ്ടെങ്കിലും മുഖ്യവാക്യത്തിൽ അതിനെ ‘ക്രിസ്തുവിന്റെ ശരീരം’ എന്നു വികസിപ്പിക്കുന്നില്ല.
- source_word: οὐκ ἔστιν
  choice: അല്ല
  rationale: നിഷേധത്തോടുകൂടിയ ലളിതമായ ബന്ധകക്രിയയെ നേരിട്ട് പകർത്തുന്നു; ‘കൊണ്ടു നിർമ്മിതമല്ല’ പോലുള്ള അധിക ആശയം ചേർക്കുന്നില്ല.
- source_word: ἓν μέλος
  choice: ഒരു അവയവം
  rationale: μέλος എന്ന ശരീരരൂപകം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു. ‘ഭാഗം’ കൂടുതൽ പൊതുവായതാണെങ്കിലും ശരീരസംബന്ധിയായ ദൃശ്യത കുറയ്ക്കും.
- source_word: ἀλλὰ πολλά
  choice: അനേകം അവയവങ്ങളാണ്
  rationale: πολλά വിശേഷണനാമമായി വന്നിട്ടുണ്ടെങ്കിലും മലയാളത്തിലെ വ്യക്തതയ്ക്കും വ്യാകരണസ്വാഭാവികതയ്ക്കുമായി മുൻപുള്ള ‘അവയവം’ ആവർത്തിക്കുന്നു.
theological_decisions:
- issue: ‘ശരീരം’ എന്നതിന്റെ രൂപകപരമായ പരാമർശം
  choice: പൗലോസിന്റെ ‘ശരീരം’ എന്ന രൂപകം അതേപടി നിലനിർത്തുക; മുഖ്യവാക്യത്തിൽ ‘ക്രിസ്തുവിന്റെ ശരീരം’ എന്നു വികസിപ്പിക്കാതിരിക്കുക.
  alternative: ‘ക്രിസ്തുവിന്റെ ശരീരം’ എന്നു വ്യക്തമാക്കുക.
  rationale: വിശാലസന്ദർഭം സഭയെ ക്രിസ്തുവിന്റെ ശരീരമായി അവതരിപ്പിക്കുന്നുണ്ടെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം τὸ σῶμα എന്നു മാത്രമാണ് പറയുന്നത്. വികസിപ്പിച്ച പരിഭാഷ വാക്യത്തിൽ ഇല്ലാത്ത സന്ദർഭവ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവയവം’ ശരീരരൂപകം വ്യക്തമായി സൂക്ഷിക്കുന്നു; വാക്യത്തിന്റെ വിശദീകരണസ്വഭാവം ‘കാരണം’ പ്രകടമാക്കുന്നു.
