source:
  edition: SBLGNT
  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: ml
  text: 'പ്രവർത്തനങ്ങൾ പലവിധമുണ്ട്[b]; എന്നാൽ സകലതും എല്ലാവരിലും[a] പ്രവർത്തിക്കുന്നത് ഒരേ ദൈവമാണ്.


    [a] അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “സകലരിലും.” ഗ്രീക്കിൽ ഇവിടെ “ആളുകൾ” എന്ന നാമം വ്യക്തമാക്കിയിട്ടില്ല; ദൈവം ഈ പ്രവർത്തനങ്ങൾ നടത്തുന്നത് സഭയിലെ അംഗങ്ങളിലാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.


    [b] അല്ലെങ്കിൽ, “എന്നാൽ ഒരേ ദൈവംതന്നെ സകലതും എല്ലാവരിലും പ്രവർത്തിക്കുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ കൂടുതൽ അക്ഷരാർഥത്തിൽ, “സകലരിലും.” ഗ്രീക്കിൽ ഇവിടെ “ആളുകൾ” എന്ന നാമം വ്യക്തമാക്കിയിട്ടില്ല; ദൈവം ഈ പ്രവർത്തനങ്ങൾ നടത്തുന്നത് സഭയിലെ അംഗങ്ങളിലാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “എന്നാൽ ഒരേ ദൈവംതന്നെ സകലതും എല്ലാവരിലും പ്രവർത്തിക്കുന്നു.”
    reason: previous_rendering
lexical_decisions:
- source_word: διαιρέσεις
  choice: പലവിധം
  rationale: വ്യത്യസ്ത തരങ്ങൾ എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു; ഭിന്നതയോ സംഘർഷമോ എന്ന ധ്വനി അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: ἐνεργημάτων
  choice: പ്രവർത്തനങ്ങൾ
  rationale: ദൈവിക പ്രവർത്തനത്തിന്റെ പ്രകടനങ്ങളെയോ ഫലങ്ങളെയോ സൂചിപ്പിക്കുന്നു. തുടർന്ന് വരുന്ന ἐνεργῶν എന്ന പദവുമായി ഉള്ള ശബ്ദാർഥബന്ധം ‘പ്രവർത്തിപ്പിക്കുന്നത്’ എന്ന പരിഭാഷയിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὁ δὲ αὐτὸς θεός
  choice: എന്നാൽ ... ഒരേ ദൈവമാണ്
  rationale: വൈവിധ്യത്തിനിടയിലും ഉറവിടം ഒരേ ദൈവമാണെന്ന മൃദുവായ വൈരുധ്യം δέ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ സമ്പൂർണ വാക്യത്തിനായി ‘ആണ്’ ചേർത്തിരിക്കുന്നു.
- source_word: ὁ ἐνεργῶν
  choice: പ്രവർത്തിപ്പിക്കുന്നത്
  rationale: ദൈവത്തിന്റെ സജീവവും തുടർച്ചയുള്ളതുമായ പ്രവർത്തനം വ്യക്തമാക്കുകയും ἐνεργημάτων എന്ന പദവുമായുള്ള ബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ πάντα
  choice: സകലതും
  rationale: ഗ്രീക്കിലെ വിശാലവും സമഗ്രവുമായ പ്രയോഗം നിലനിർത്തുന്നു; ഉടൻ മുമ്പുള്ള ആത്മീയ പ്രകടനങ്ങളിലേക്ക് മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐν πᾶσιν
  choice: എല്ലാവരിലും
  rationale: ഗ്രീക്കിൽ നാമം വ്യക്തമല്ലെങ്കിലും, സഭയിലെ അംഗങ്ങളാണ് സന്ദർഭത്തിലെ സൂചന. വ്യക്തികളെ ഉദ്ദേശിക്കുന്ന വായന മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി നൽകുകയും മൂലത്തിലെ അപ്രകടത അടിക്കുറിപ്പിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τὰ πάντα ἐν πᾶσιν എന്നതിലെ ദൈവപ്രവർത്തനത്തിന്റെ വ്യാപ്തി
  choice: ‘സകലതും എല്ലാവരിലും പ്രവർത്തിപ്പിക്കുന്നത്’ എന്ന വിശാല പ്രയോഗം
  alternative: ‘ഇവയെല്ലാം സകലരിലും പ്രവർത്തിപ്പിക്കുന്നത്’
  rationale: ഉടൻ സമീപമുള്ള സന്ദർഭം സഭയിലെ ആത്മീയ ദാനങ്ങളെയും അവയുടെ പ്രവർത്തനങ്ങളെയും കുറിച്ചാണെങ്കിലും, τὰ πάντα എന്നതിന്റെ വ്യാപ്തി മൂലപാഠം തന്നെ ചുരുക്കുന്നില്ല. അതിനാൽ വിശാലതയും സന്ദർഭപരമായ വ്യക്തിസൂചനയും ഒരുമിച്ച് നിലനിർത്തി, അതിൽനിന്ന് അധികമായ സിദ്ധാന്തനിഗമനം വരുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘പ്രവർത്തനങ്ങൾ—പ്രവർത്തിപ്പിക്കുന്നത്’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ἐνεργημάτων—ἐνεργῶν പദബന്ധം ബോധപൂർവം നിലനിർത്തുന്നു.
