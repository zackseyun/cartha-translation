- from: എന്തെന്നാൽ, ശരീരം ഒന്നായിരിക്കുകയും അതിന് അനേകം അവയവങ്ങൾ ഉണ്ടായിരിക്കുകയും ചെയ്യുന്നതുപോലെ, ശരീരത്തിന്റെ അവയവങ്ങളെല്ലാം അനേകമാണെങ്കിലും അവ ചേർന്ന് ഒരു ശരീരമാണ്; അതുപോലെതന്നെയാണ് മശീഹയും.[a]
