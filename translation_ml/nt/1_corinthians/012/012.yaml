id: 1CO.12.12
reference: 1 Corinthians 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: ml
  text: എന്തെന്നാൽ, ശരീരം ഒന്നായിരിക്കുകയും അതിന് അനേകം അവയവങ്ങൾ ഉണ്ടായിരിക്കുകയും ചെയ്യുന്നതുപോലെ, ശരീരത്തിന്റെ അവയവങ്ങളെല്ലാം അനേകമാണെങ്കിലും ഒരു ശരീരമാണ്; അതുപോലെതന്നെയാണ് മശീഹയും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവും.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘അതുപോലെതന്നെ മശീഹയും’ എന്നാണ്. അനേകം അവയവങ്ങളുള്ള ഒരു ശരീരത്തെ മശീഹയുമായി ബന്ധിപ്പിക്കുന്ന ഈ സംക്ഷിപ്ത പ്രയോഗം തുടർന്നുള്ള വാക്യങ്ങൾ വിശദീകരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: എന്തെന്നാൽ … ചെയ്യുന്നതുപോലെ
  rationale: γάρ എന്നതിന്റെ വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’ എന്നും καθάπερ എന്നതിന്റെ ശക്തമായ ഉപമാസ്വഭാവം ‘ചെയ്യുന്നതുപോലെ’ എന്നും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പൗലൊസിന്റെ ശരീരരൂപകത്തിന് സാധാരണവും വ്യക്തവുമായ മലയാളപദം; വാക്യത്തിലുടനീളം ഒരേപോലെ ഉപയോഗിച്ചു.
- source_word: ἕν
  choice: ഒന്ന് / ഒരു
  rationale: ശരീരത്തിന്റെ ഏകതയെ സൂചിപ്പിക്കുന്ന സംഖ്യാപരവും സമൂഹപരവുമായ അർഥം നിലനിർത്തുന്നു; മലയാളവാക്യഘടനയ്ക്കനുസരിച്ച് ‘ഒന്നായിരിക്കുകയും’, ‘ഒരു ശരീരമാണ്’ എന്നീ രൂപങ്ങൾ ഉപയോഗിച്ചു.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ശരീരത്തിന്റെ ഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം; സഭയിലെ അംഗങ്ങളിലേക്കുള്ള തുടർന്നുള്ള പ്രയോഗത്തിനും രൂപകപരമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: πολλὰ ὄντα
  choice: അനേകമാണെങ്കിലും
  rationale: ഗ്രീക്ക് കൃ定ന്തപ്രയോഗത്തിന്റെ concessive അർഥം—അനേകമായിരുന്നിട്ടും ഒന്ന്—വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἕν ἐστιν σῶμα
  choice: അവ ചേർന്ന് ഒരു ശരീരമാണ്
  rationale: അവയവങ്ങൾ അനേകമായിരിക്കെ അവയുടെ കൂട്ടായ ഏകതയാണ് ഒരു ശരീരം എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു; ‘ചേർന്ന്’ എന്നത് വാക്യത്തിൽ അന്തർലീനമായ കൂട്ടായ അർഥം വ്യക്തമാക്കുന്നു, പുതിയ ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയൽ ചേർക്കുന്നില്ല.
- source_word: οὕτως καὶ ὁ Χριστός
  choice: അതുപോലെതന്നെയാണ് മശീഹയും
  rationale: ഉപമയുടെ നിഗമനം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു. Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർഥം വെറും വ്യക്തിനാമമാക്കാതെ ‘മശീഹ’ എന്ന് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ὁ Χριστός ഒരു ദൈവശാസ്ത്രപരമായ പദവിയായി നിൽക്കുന്നതിനാൽ ‘മശീഹ’ എന്നത് ‘അഭിഷിക്തൻ’ എന്ന പദവിസ്വഭാവം നിലനിർത്തുന്നു. പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ പര്യായമായി നൽകുന്നു.
- issue: ‘അതുപോലെതന്നെയാണ് മശീഹയും’ എന്ന സംക്ഷിപ്ത പ്രസ്താവന
  choice: സഭയെയോ ‘മശീഹയുടെ ശരീരത്തെയോ’ ചേർത്ത് വിശദീകരിക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്തത നിലനിർത്തി
  alternative: അതുപോലെതന്നെയാണ് മശീഹയുടെ ശരീരമായ സഭയും
  rationale: മൂലവാക്യം ‘മശീഹ’ എന്നു മാത്രമാണ് പറയുന്നത്. തുടർന്നുള്ള വാക്യങ്ങൾ ആശയം തുറന്നുകാട്ടുന്നതിനാൽ ഇവിടെ വ്യാഖ്യാനപരമായ വിപുലീകരണം ചേർക്കുന്നത് യഥാർഥ ദൈവശാസ്ത്രപരമായ മുറുക്കം ഇല്ലാതാക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി സ്വീകരിച്ചു. ‘അവയവങ്ങൾ’, ‘ശരീരം’, ‘മശീഹ’ എന്നീ മുഖ്യപദങ്ങൾ രൂപകത്തിന്റെയും പദവിയുടെയും ശക്തി നിലനിർത്തുന്നു; മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംക്ഷിപ്തത വ്യാഖ്യാനിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
