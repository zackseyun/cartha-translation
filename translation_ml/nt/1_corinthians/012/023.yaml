id: 1CO.12.23
reference: 1 Corinthians 12:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: ml
  text: ശരീരത്തിലെ മാനം കുറഞ്ഞവയെന്നു[a] നാം കരുതുന്ന അവയവങ്ങൾക്കു നാം കൂടുതൽ മാനം നൽകുന്നു; കാണിക്കാൻ യോജിക്കാത്ത നമ്മുടെ അവയവങ്ങൾക്കാകട്ടെ[b] കൂടുതൽ മാന്യമായ രൂപമുണ്ട്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാനമില്ലാത്തവയെന്നു.’ ഇവിടെ പറയുന്നത് അവയുടെ യഥാർഥ മൂല്യത്തെക്കാൾ മനുഷ്യരുടെ വിലയിരുത്തലിനെക്കുറിച്ചാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മര്യാദയ്ക്കു നിരക്കാത്ത നമ്മുടെ അവയവങ്ങൾക്കാകട്ടെ.’ ഗ്രീക്കുപദം പൊതുവിൽ കാണിക്കാൻ യോജിക്കാത്തതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘കൂടുതൽ ശോഭയുണ്ട്’ അല്ലെങ്കിൽ ‘കൂടുതൽ മാന്യമായി കാണപ്പെടുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: നാം കരുതുന്ന
  rationale: δοκέω ഇവിടെ വസ്തുനിഷ്ഠമായ യാഥാർഥ്യമല്ല, മനുഷ്യരുടെ വിലയിരുത്തലാണ് സൂചിപ്പിക്കുന്നത്. ‘നാം കരുതുന്ന’ എന്നത് ഈ ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀτιμότερα
  choice: മാനം കുറഞ്ഞവ
  rationale: ἄτιμος എന്നതിന്റെ താരതമ്യരൂപമാണിത്. ‘മാനം കുറഞ്ഞവ’ എന്നത് താരതമ്യഭാവവും തുടർന്നുള്ള τιμή എന്ന പദവുമായുള്ള മാനം/അപമാനം വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: τοῦ σώματος
  choice: ശരീരത്തിൽ … അവയവങ്ങൾ
  rationale: ഭാഗവും സമഗ്രശരീരവും തമ്മിലുള്ള ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുകയും പൗലോസിന്റെ ശരീരരൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τούτοις τιμὴν περισσοτέραν περιτίθεμεν
  choice: അവയവങ്ങൾക്കു നാം കൂടുതൽ മാനം നൽകുന്നു
  rationale: περιτίθημι എന്നതിന് അക്ഷരാർഥത്തിൽ ‘മേൽ/ചുറ്റും ഇടുക’ എന്നാണെങ്കിലും ഇവിടെ ആദരം നൽകുക എന്ന പ്രയോഗാർഥമാണ്. ‘കൂടുതൽ മാനം നൽകുന്നു’ എന്നത് മലയാളത്തിൽ സ്വാഭാവികവും താരതമ്യം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: കാണിക്കാൻ കൊള്ളാത്ത നമ്മുടെ അവയവങ്ങൾ
  rationale: ἀσχήμων പൊതുവിൽ പ്രദർശിപ്പിക്കാൻ അനുയോജ്യമല്ലാത്തതോ മര്യാദയ്ക്കു നിരക്കാത്തതോ ആയ ശരീരഭാഗങ്ങളെ സൂചിപ്പിക്കാം. ഈ പരിഭാഷ അനാവശ്യമായ ധാർമിക കുറ്റബോധം ചേർക്കാതെ സാമൂഹികവും ശാരീരികവുമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: കൂടുതൽ മാന്യമായ രൂപം ലഭിക്കുന്നു
  rationale: εὐσχημοσύνη ഉചിതവും മാന്യവുമായി കാണപ്പെടുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ‘ലഭിക്കുന്നു’ ഉപയോഗിച്ചെങ്കിലും, മറച്ചുവയ്ക്കുകയോ അണിയിക്കുകയോ ചെയ്യുന്നതിലൂടെ ലഭിക്കുന്ന മാന്യമായ അവതരണമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: ശരീരാവയവങ്ങളുടെ ദൃശ്യരൂപകവും സഭയിലെ മാനവും
  choice: വാക്യം യഥാർഥ ശരീരാവയവങ്ങളെക്കുറിച്ചു പറയുന്ന രൂപത്തിൽ നിലനിർത്തി; അതിനെ നേരിട്ട് സഭയിലെ ദുർബല അംഗങ്ങളെക്കുറിച്ചുള്ള അമൂർത്ത പ്രസ്താവനയായി മാറ്റിയില്ല.
  alternative: ‘മാനം കുറഞ്ഞ സഭാംഗങ്ങൾക്ക് കൂടുതൽ ആദരം നൽകുന്നു’ എന്നിങ്ങനെ ആശയവിവർത്തനം ചെയ്യുക.
  rationale: പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗം ശരീരത്തോടുള്ള മനുഷ്യരുടെ പെരുമാറ്റത്തെ ആധാരമാക്കിയാണ് വികസിക്കുന്നത്. ദൃശ്യരൂപകം നിലനിർത്തുമ്പോൾ പ്രയോഗം വാചകത്തിൽനിന്നുതന്നെ ഉയർന്നുവരുന്നു; പരിഭാഷകൻ അത് മുൻകൂട്ടി നിർവചിക്കുന്നില്ല.
- issue: εὐσχημοσύνη എന്നതിലെ മാന്യതയും ദൃശ്യശോഭയും
  choice: ‘മാന്യമായ രൂപം’ എന്ന് പരിഭാഷപ്പെടുത്തി, ഉചിതമായി അവതരിപ്പിക്കപ്പെടുക എന്ന ആശയം മുൻനിർത്തി.
  alternative: ‘ശോഭ’, ‘മര്യാദ’, അല്ലെങ്കിൽ ‘മാന്യമായ മറവ്’.
  rationale: ഗ്രീക്കുപദം പുറമേയുള്ള ശോഭയും സാമൂഹികമായ ഉചിതത്വവും ഉൾക്കൊള്ളുന്നു. ‘മാന്യമായ രൂപം’ ഈ രണ്ടിനും ഇടം നൽകുന്നു; ‘മറവ്’ എന്നു മുഖ്യവാചകത്തിൽ ചേർത്താൽ സന്ദർഭത്തിൽ സൂചിതമായ വസ്ത്രധാരണത്തെ പദത്തിന്റെ നേരിട്ടുള്ള അർഥമാക്കി ചുരുക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘മാനം’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ ἀτιμότερα/τιμή പദബന്ധം കേൾവിയിലും അർഥത്തിലും നിലനിർത്തുന്നു. ശരീരാവയവങ്ങളെക്കുറിച്ചുള്ള ഭാഷ അനാവശ്യമായി പരുഷമാക്കാതെയും മയപ്പെടുത്തി അമൂർത്തമാക്കാതെയും അവതരിപ്പിച്ചു.
