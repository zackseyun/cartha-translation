id: 1CO.12.3
reference: 1 Corinthians 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തിന്റെ ആത്മാവിനാൽ സംസാരിക്കുന്ന ഒരാളും “യേശു ശപിക്കപ്പെട്ടവനാണ്” എന്നു പറയുന്നില്ലെന്നും[a], പരിശുദ്ധാത്മാവിനാൽ അല്ലാതെ ആർക്കും “യേശു കർത്താവാണ്” എന്നു പറയാൻ കഴിയില്ലെന്നും[b] ഞാൻ നിങ്ങളെ അറിയിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യേശു ശപിക്കപ്പെടട്ടെ” എന്നും പരിഭാഷപ്പെടുത്താം; Ἀνάθεμα Ἰησοῦς എന്ന ഗ്രീക്ക് ഉദ്‌ഘോഷത്തിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ പദക്രമം അക്ഷരാർഥത്തിൽ “കർത്താവ് യേശു” എന്നാണ്; ഇവിടെ അത് “യേശു കർത്താവാണ്” എന്ന ഏറ്റുപറച്ചിലിന്റെ അർഥത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: അതുകൊണ്ട്
  rationale: മുൻവിവരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: γνωρίζω ὑμῖν
  choice: ഞാൻ നിങ്ങളെ അറിയിക്കുന്നു
  rationale: ക്രിയയുടെ ‘അറിയിക്കുക’ എന്ന കാരകാർഥം അനാവശ്യമായ ഇച്ഛാഭാവം ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐν πνεύματι θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവിനാൽ
  rationale: ἐν ഇവിടെ ആത്മാവിന്റെ പ്രവർത്തനമോ പ്രേരണയോ സൂചിപ്പിക്കുന്നതായി വായിക്കാം; മലയാളത്തിലെ കരണവിഭക്തി അത് വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: യേശു ശപിക്കപ്പെട്ടവൻ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് ഉദ്‌ഘോഷത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ വിധിവാക്യമായി അവതരിപ്പിക്കുന്നു; ἀνάθεμα എന്നതിന്റെ ശാപാധീനത നിലനിർത്തുന്നു.
- source_word: δύναται εἰπεῖν
  choice: പറയാൻ കഴിയില്ല
  rationale: കഴിവിനെയോ സാധ്യമായിരിക്കലിനെയോ സൂചിപ്പിക്കുന്ന δύναται എന്ന പദത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: Κύριος Ἰησοῦς
  choice: യേശു കർത്താവാണ്
  rationale: നാമനിർദേശക രൂപത്തിലുള്ള ഗ്രീക്ക് വാക്യഭാഗത്തിന്റെ ഏറ്റുപറച്ചിൽസ്വഭാവം മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിനാൽ അല്ലാതെ
  rationale: ഏക അപവാദത്തെ സൂചിപ്പിക്കുന്ന εἰ μήയും ആത്മാവിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ἐν-ഉം സ്വാഭാവിക മലയാളത്തിൽ സംയോജിപ്പിക്കുന്നു.
theological_decisions:
- issue: Κύριος Ἰησοῦς എന്ന ഏറ്റുപറച്ചിലിലെ κύριος
  choice: കർത്താവ്
  alternative: നാഥൻ / യജമാനൻ
  rationale: പൗലോസിന്റെ ക്രിസ്തുസംബന്ധിയായ ഏറ്റുപറച്ചിലിന്റെ ഗൗരവവും κύριος എന്ന സ്ഥാനപ്പേരിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
- issue: “പരിശുദ്ധാത്മാവിനാൽ അല്ലാതെ” എന്നതിലെ ആത്മീയ പ്രാപ്തീകരണം
  choice: വാക്യം പറയുന്നതുപോലെ ആത്മാവിന്റെ പ്രവർത്തനവുമായി ബന്ധപ്പെടുത്തി നിലനിർത്തി
  alternative: വെറും വാക്കുകളുടെ ഉച്ചാരണമായി ചുരുക്കുക, അല്ലെങ്കിൽ സമ്പൂർണമായ മാനസാന്തരസിദ്ധാന്തമായി വികസിപ്പിക്കുക
  rationale: യേശുവിന്റെ കർത്തൃത്വത്തെ യഥാർഥമായി ഏറ്റുപറയുന്നത് പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തോടു ബന്ധിപ്പിക്കുന്നു; എന്നാൽ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ഒരു വിപുലമായ സിദ്ധാന്തവ്യവസ്ഥ പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആത്മാവിനാൽ’, ‘കർത്താവാണ്’ എന്നീ രൂപങ്ങൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ മൂലഭാഷയിലെ ആത്മീയ പ്രവർത്തനവും ഏറ്റുപറച്ചിൽസ്വഭാവവും സംരക്ഷിക്കുന്നു. രണ്ടു അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട മുഖ്യവാക്യങ്ങളിൽ ചേർത്തിരിക്കുന്നു.
