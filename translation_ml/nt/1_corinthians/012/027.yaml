  terminology: ‘മശീഹാ,’ ‘ശരീരം,’ and ‘അവയവങ്ങൾ’ suitably preserve the title and body metaphor. The lexical footnote should not present ‘ഒരു ഭാഗത്തുനിന്നുള്ള അവയവങ്ങൾ’ as a straightforward literal Malayalam equivalent; it is unnatural and risks obscuring the distributive contextual sense.
