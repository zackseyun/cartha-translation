  text: You are the body of Messiah[c][b][a], and members individually.
translation:
  language: ml
  text: നിങ്ങളാകട്ടെ മശീഹായുടെ ശരീരമാണ്; ഓരോരുത്തരും അതിന്റെ അവയവങ്ങളാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹായുടെ ശരീരം’ എന്നതിന് ‘ക്രിസ്തുവിന്റെ ശരീരം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദത്തിന് ‘മശീഹാ’ എന്നും ‘ക്രിസ്തു’ എന്നും നൽകാം; ഇവിടെ അത് ഒരു പദവിയായി പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘ഓരോരുത്തരും അതിന്റെ അവയവങ്ങൾ’ എന്നതിന് ‘പ്രത്യേകമായി അവയവങ്ങൾ’ അഥവാ ‘ഓരോരുത്തരായി അവയവങ്ങൾ’ എന്നും പറയാം. ഗ്രീക്ക് പ്രയോഗം സന്ദർഭത്തിൽ ഓരോരുത്തരും ഒരേ ശരീരത്തിലെ അംഗമാണെന്ന വിതരണാർഥം നൽകുന്നു; ‘അതിന്റെ’ എന്ന പദം ഗ്രീക്കിൽ നേരിട്ട് ഇല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ (നിങ്ങളാകട്ടെ)
  rationale: വ്യക്തമായി ചേർത്തിരിക്കുന്ന ദ്വിതീയപുരുഷ ബഹുവചന സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ ‘നിങ്ങളാകട്ടെ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δέ
  choice: ആകട്ടെ
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധത്തേക്കാൾ, മുമ്പ് വിശദീകരിച്ച ശരീരദൃഷ്ടാന്തം കൊരിന്ത്യരിലേക്കു പ്രയോഗിക്കുന്ന വിഷയമാറ്റവും നേരിയ വൈരുധ്യവും സൂചിപ്പിക്കുന്നു. ‘നിങ്ങളാകട്ടെ’ അതിനെ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: σῶμα Χριστοῦ
  choice: മശീഹായുടെ ശരീരം
  rationale: സഭയെ മശീഹായുടെ ശരീരമായി തിരിച്ചറിയുന്ന ബന്ധം നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥാവിഭക്തി ഉപയോഗിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ മശീഹാപദവിയായി പ്രവർത്തിക്കുന്നു. ‘ക്രിസ്തുവിന്റെ’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ പകരമായി നൽകുന്നു.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ശരീരദൃഷ്ടാന്തം വ്യക്തമായി നിലനിർത്തുകയും, മലയാളത്തിൽ ശരീരത്തിന്റെ ഘടകങ്ങളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐκ μέρους
  choice: ഓരോരുത്തരും
  rationale: ഒരൊറ്റ ശരീരത്തിനുള്ളിൽ ഓരോ വ്യക്തിയും അവയവമാണെന്ന വിതരണാർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘ഭാഗികമായി’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സഭാശരീര പ്രസ്താവനയിൽ Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഇവിടെ പദം അഭിഷിക്തനായവന്റെ പദവിയർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹാ’ ഉപയോഗിച്ചു; പരിചിതമായ ‘ക്രിസ്തു’ രൂപം സാധുവായ പകരമായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: καὶ μέλη ἐκ μέρους എന്നതിലെ ἐκ μέρους-ന്റെ അർഥം
  choice: വിതരണാർഥത്തിൽ ‘ഓരോരുത്തരും അതിലെ അവയവങ്ങൾ’
  alternative: ‘പ്രത്യേകം അവയവങ്ങൾ’ / കൂടുതൽ പദാനുപദമായി ‘ഒരു ഭാഗത്തുനിന്ന്’
  rationale: സന്ദർഭത്തിലെ ഒരൊറ്റ ശരീരവും അനേകം അവയവങ്ങളും തമ്മിലുള്ള ബന്ധം ഇതിലൂടെ വ്യക്തമാകുന്നു. ‘അതിലെ’ എന്നത് ഗ്രീക്കിൽ പ്രകടമല്ലെങ്കിലും മലയാളത്തിൽ ബന്ധം സ്വാഭാവികമാക്കുന്നു; ഈ കാര്യം അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളാകട്ടെ’ എന്നത് Ὑμεῖς δέ-യിലെ ഊന്നലും വിഷയമാറ്റവും ഒരുമിച്ച് വഹിക്കുന്നു. ‘അവയവങ്ങൾ’ ശരീരദൃഷ്ടാന്തം ‘അംഗങ്ങൾ’ എന്നതിനെക്കാൾ സുതാര്യമായി നിലനിർത്തുന്നു.
