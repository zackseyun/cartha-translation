id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: ml
  text: എന്നാൽ, കണ്ണിന് കൈയോട്, “എനിക്ക് നിന്നെ ആവശ്യമില്ല” എന്നു പറയാനാവില്ല; അല്ലെങ്കിൽ, തലയ്ക്ക് കാലുകളോട്, “എനിക്ക് നിങ്ങളെ ആവശ്യമില്ല” എന്നു പറയാനാവില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δύναται
  choice: പറയാനാവില്ല
  rationale: കഴിവില്ലായ്മയെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും അനുചിതത്വമെന്ന അർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തിലെ ശരീരാവയവങ്ങളുടെ പരസ്പരാശ്രിതത്വത്തോടുള്ള വൈരുധ്യബന്ധം സൂചിപ്പിക്കുന്നു.
- source_word: ὁ ὀφθαλμός
  choice: കണ്ണ്
  rationale: പൗലോസ് തുടരുന്ന ശരീരരൂപകം അതേപടി നിലനിർത്തുന്നു.
- source_word: τῇ χειρί
  choice: കൈയോട്
  rationale: ദാതൃവിഭക്തിയിലെ പരോക്ഷകർമത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ശരീരരൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Χρείαν σου οὐκ ἔχω
  choice: എനിക്ക് നിന്നെ ആവശ്യമില്ല
  rationale: χρεία എന്ന ‘ആവശ്യം’ എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; ‘നിന്നെക്കൊണ്ട് പ്രയോജനമില്ല’ എന്ന കൂടുതൽ അവഹേളനപരമായ അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἢ πάλιν
  choice: അതുപോലെ
  rationale: രണ്ടാമത്തെ സമാന ഉദാഹരണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; πάλιν ഇവിടെ ആവർത്തനത്തേക്കാൾ സമാന്തര ഉദാഹരണത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἡ κεφαλή
  choice: തല
  rationale: ശരീരാവയവത്തിന്റെ ദൃശ്യരൂപകം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοῖς ποσίν
  choice: കാലുകളോട്
  rationale: മൂലത്തിലെ ബഹുവചനം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളെ
  rationale: മൂലഗ്രീക്കിലെ ബഹുവചനം മലയാളത്തിൽ നേരിട്ട് പ്രകടമാക്കുന്നു; അതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
theological_decisions:
- issue: സഭയിലെ പരസ്പരാശ്രിതത്വത്തെ സൂചിപ്പിക്കുന്ന ശരീരരൂപകം
  choice: ശരീരാവയവങ്ങളുടെ ദൃശ്യഭാഷ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കലില്ലാതെ നിലനിർത്തി
  alternative: പ്രധാനവാചകത്തിൽ തന്നെ അവയവങ്ങളെ സഭാംഗങ്ങളായി വിശദീകരിക്കുക
  rationale: പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ ആശയം രൂപകത്തിലൂടെയാണ് പ്രവർത്തിക്കുന്നത്; വിശദീകരണം പ്രധാനവാചകത്തിൽ ചേർക്കുന്നത് വിവർത്തനപരിധി കടക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഏകവചനമായ ‘നിന്നെ’യും ബഹുവചനമായ ‘നിങ്ങളെ’യും വേർതിരിച്ച് മൂലഗ്രീക്കിലെ സംഖ്യാവ്യത്യാസം വ്യക്തമായി സംരക്ഷിച്ചിട്ടുണ്ട്.
