revisions:
- from: എന്നാൽ കണ്ണിന് കൈയോട്, “എനിക്ക് നിന്നെ ആവശ്യമില്ല” എന്നു പറയാനാവില്ല; അതുപോലെ തലയ്ക്ക് കാലുകളോട്, “എനിക്ക് നിങ്ങളെ ആവശ്യമില്ല” എന്നും പറയാനാവില്ല.
  to: എന്നാൽ, കണ്ണിന് കൈയോട്, “എനിക്ക് നിന്നെ ആവശ്യമില്ല” എന്നു പറയാനാവില്ല; അല്ലെങ്കിൽ, തലയ്ക്ക് കാലുകളോട്, “എനിക്ക് നിങ്ങളെ ആവശ്യമില്ല” എന്നു പറയാനാവില്ല.
  rationale: The revision replaces ‘അതുപോലെ’ with ‘അല്ലെങ്കിൽ’ to render the disjunctive force of ἢ while retaining the second parallel example indicated by πάλιν. Commas improve readability without affecting meaning. No footnote is needed because Malayalam explicitly distinguishes the singular hand-address from the plural feet-address.
