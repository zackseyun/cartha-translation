  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος πρὸς τὸ συμφέρον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: ml
  text: എന്നാൽ ഓരോരുത്തനും ആത്മാവിന്റെ വെളിപ്പെടൽ പൊതുനന്മയ്ക്കായി നൽകപ്പെടുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രയോജനത്തിനായി’ അല്ലെങ്കിൽ ‘എല്ലാവരുടെയും നന്മയ്ക്കായി.’
    reason: πρὸς τὸ συμφέρον എന്ന പ്രയോഗത്തിന് പൊതുവായ പ്രയോജനം എന്നും എല്ലാവർക്കുമുള്ള നന്മ എന്നും പരിഭാഷപ്പെടുത്താവുന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: ἑκάστῳ
  choice: ഓരോരുത്തനും
  rationale: ദത്തിവ് ഏകവചനം സമൂഹത്തിലെ ഓരോ വ്യക്തിയിലേക്കുമുള്ള വിതരണാർഥം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ ഇത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും നിലനിർത്തുന്നു; ശക്തമായ എതിർപ്പ് സൂചിപ്പിക്കുന്നില്ല.
- source_word: δίδοται
  choice: നൽകപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം സംരക്ഷിക്കുകയും ഇത് ലഭിക്കുന്ന ദാനമാണെന്ന ഭാവം അധിക വ്യാഖ്യാനമില്ലാതെ അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: φανέρωσις
  choice: വെളിപ്പെടൽ
  rationale: കാണാവുന്നതോ തിരിച്ചറിയാവുന്നതോ ആയി പ്രകടമാകുന്നതെന്ന ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആത്മാവുതന്നെ ഓരോരുത്തനിലും പൂർണമായി പ്രത്യക്ഷനാകുന്നു എന്ന അനാവശ്യ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: τοῦ πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: ഗ്രീക്കിലെ നിർദേശത്തെ ചേർത്ത് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു; ഉടൻ വരുന്ന സന്ദർഭം ഇത് പരിശുദ്ധാത്മാവാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: πρὸς τὸ συμφέρον
  choice: പൊതുനന്മയ്ക്കായി
  rationale: പ്രയോഗം സൂചിപ്പിക്കുന്ന പ്രയോജനത്തെയും ഈ അധ്യായത്തിലെ ശരീരസമൂഹത്തിന്റെ പരസ്പരനന്മയെയും സ്വാഭാവികമായി പകർത്തുന്നു; പൊതുവായ പ്രയോജനം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: പൊതുവായ അർഥത്തിലുള്ള ‘ആത്മാവ്’ അഥവാ ‘ആത്മികത’
  rationale: 1 കൊരിന്ത്യർ 12:4, 8–11 ഒരേ ആത്മാവിനെ ദാനങ്ങളുടെ ഉറവിടമായി തിരിച്ചറിയുന്നു. എങ്കിലും മൂലപാഠത്തിൽ ἅγιον ഇല്ലാത്തതിനാൽ പ്രധാനവാചകത്തിൽ ‘പരിശുദ്ധ’ എന്നു ചേർത്തിട്ടില്ല.
- issue: συμφέρον എന്നതിന്റെ പ്രയോജനപരിധി
  choice: സമൂഹത്തിന്റെ പൊതുനന്മ
  alternative: പൊതുവായി പ്രയോജനകരമായത്; വ്യക്തിപരമായ പ്രയോജനം
  rationale: പദത്തിന് പൊതുവായ പ്രയോജനം എന്ന അർഥമുണ്ടെങ്കിലും, അധ്യായത്തിലെ ഏകശരീരവും പരസ്പരശുശ്രൂഷയും സംബന്ധിച്ച വാദം സമൂഹപരമായ ദിശ ശക്തമായി സൂചിപ്പിക്കുന്നു. യഥാർഥമായ വിശാല അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വെളിപ്പെടൽ’ മൂലപദത്തിന്റെ പ്രകടമാകൽ എന്ന അർഥം നിലനിർത്തുന്നു; ‘പൊതുനന്മ’ സന്ദർഭത്തിലെ സമൂഹപരമായ ലക്ഷ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
