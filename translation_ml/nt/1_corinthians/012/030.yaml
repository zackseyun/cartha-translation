id: 1CO.12.30
reference: 1 Corinthians 12:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: ml
  text: എല്ലാവർക്കും രോഗശാന്തികളുടെ വരങ്ങൾ ഉണ്ടോ? തീർച്ചയായും ഇല്ല. എല്ലാവരും അന്യഭാഷകളിൽ സംസാരിക്കുന്നുണ്ടോ?[a] തീർച്ചയായും ഇല്ല. എല്ലാവരും വ്യാഖ്യാനിക്കുന്നുണ്ടോ? തീർച്ചയായും ഇല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭാഷകളിൽ.’ ഈ സന്ദർഭത്തിൽ ഈ പദം സാധാരണയായി ‘അന്യഭാഷകളിൽ സംസാരിക്കൽ’ എന്നു വിളിക്കപ്പെടുന്ന ആത്മികപ്രകടനത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: എല്ലാവർക്കും ... ഉണ്ടോ? / എല്ലാവരും ... ചെയ്യുന്നുണ്ടോ?
  rationale: μή കൊണ്ടാരംഭിക്കുന്ന ഓരോ ചോദ്യവും നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യമാണ്. സ്വാഭാവികമായ മലയാളചോദ്യരൂപം സന്ദർഭത്തിൽ ഈ പ്രതീക്ഷ വ്യക്തമാക്കുകയും വരങ്ങളുടെ വൈവിധ്യം ഊന്നിപ്പറയുകയും ചെയ്യുന്നു.
- source_word: χαρίσματα
  choice: വരങ്ങൾ
  rationale: χάρισμα കൃപയാൽ ലഭിക്കുന്ന ദാനത്തെയോ ആത്മിക അനുഗ്രഹത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ സന്ദർഭത്തിൽ ‘വരങ്ങൾ’ സ്വാഭാവികവും സഭാപരമായി പരിചിതവുമായ പദമാണ്.
- source_word: ἰαμάτων
  choice: രോഗശാന്തികളുടെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനരൂപം നിലനിർത്തി പലവിധ രോഗശാന്തിപ്രവർത്തനങ്ങളെയോ സംഭവങ്ങളെയോ ഉൾക്കൊള്ളുന്ന പ്രയോഗമായി വിവർത്തനം ചെയ്തു.
- source_word: γλώσσαις
  choice: അന്യഭാഷകളിൽ
  rationale: 1 കൊരിന്ത്യർ 12–14-ലെ കരിസ്മാറ്റിക് സന്ദർഭത്തിൽ γλῶσσα സാധാരണയായി ‘അന്യഭാഷ’ എന്നു വിളിക്കപ്പെടുന്ന വരത്തെ സൂചിപ്പിക്കുന്നു. ‘ഭാഷകളിൽ’ എന്നത് പദശാസ്ത്രപരമായി സാധ്യമെങ്കിലും സന്ദർഭസൂചന കുറവാണ്.
- source_word: λαλοῦσιν
  choice: സംസാരിക്കുന്നുണ്ടോ
  rationale: വർത്തമാനകാല ക്രിയ ഇവിടെ പൊതുവായ ശേഷിയെയോ പതിവിനെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം ചോദ്യം സ്വാഭാവികമാക്കുന്നു.
- source_word: διερμηνεύουσιν
  choice: വ്യാഖ്യാനിക്കുന്നുണ്ടോ
  rationale: അന്യഭാഷയിലെ ഉച്ചാരണത്തെ മറ്റുള്ളവർക്ക് ഗ്രഹിക്കാവുന്ന വിധം അർഥമാക്കുന്നതാണ് സന്ദർഭത്തിലെ ആശയം. ‘പരിഭാഷപ്പെടുത്തുന്നു’ എന്നതിനെക്കാൾ ‘വ്യാഖ്യാനിക്കുന്നു’ ഈ ആത്മികവരത്തിന്റെ പ്രവർത്തനപരിധി തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: μή ഉള്ള അലങ്കാരചോദ്യങ്ങളുടെ സ്വഭാവം
  choice: ഓരോ ചോദ്യവും നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന രീതിയിൽ മലയാളചോദ്യരൂപത്തിൽ നൽകുക
  alternative: പ്രതീക്ഷിക്കുന്ന ഉത്തരം സൂചിപ്പിക്കാത്ത ലളിതചോദ്യങ്ങളായി നൽകുക
  rationale: എല്ലാ വിശ്വാസികൾക്കും എല്ലാ വരങ്ങളും ഇല്ലെന്ന ശരീരത്തിലെ വൈവിധ്യത്തെ പൗലോസ് ഊന്നുന്നു. മലയാളത്തിൽ ‘എല്ലാവർക്കും/എല്ലാവരും ... ഉണ്ടോ?’ എന്ന ആവർത്തിത രൂപം അത് സ്വാഭാവികമായി അറിയിക്കുന്നു.
- issue: γλώσσαις എന്നതിന്റെ സന്ദർഭാർഥം
  choice: അന്യഭാഷകളിൽ
  alternative: ഭാഷകളിൽ
  rationale: പദത്തിന് സാധാരണ ഭാഷകളെ സൂചിപ്പിക്കാനാകുമെങ്കിലും, ഇവിടെ പ്രത്യേക ആത്മികവരമാണ് ഉദ്ദേശിക്കുന്നത്. അതേസമയം അതിന്റെ കൃത്യസ്വഭാവത്തെ കൂടുതൽ നിർവചിക്കാതെ ‘അന്യഭാഷകളിൽ’ എന്നു നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂന്നു സമാന്തര അലങ്കാരചോദ്യങ്ങളുടെ താളവും ആവർത്തനവും സംരക്ഷിച്ചു. ‘രോഗശാന്തികളുടെ വരങ്ങൾ’ എന്ന പ്രയോഗത്തിലൂടെ മൂലത്തിലെ ഇരട്ട ബഹുവചനഭാവം നിലനിർത്തി.
