id: 1CO.12.29
reference: 1 Corinthians 12:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: ml
  text: എല്ലാവരും അപ്പോസ്തലന്മാരല്ലല്ലോ? എല്ലാവരും പ്രവാചകന്മാരല്ലല്ലോ? എല്ലാവരും പഠിപ്പിക്കുന്നവരല്ലല്ലോ? എല്ലാവരും അത്ഭുതപ്രവൃത്തികൾ ചെയ്യുന്നവരല്ലല്ലോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “എല്ലാവരും ശക്തികളല്ലല്ലോ?” ഗ്രീക്കിലെ “ശക്തികൾ” എന്ന പദം ഇവിടെ അത്ഭുതകരമായ ശക്തിപ്രവൃത്തികളെയോ അവ ചെയ്യുന്നവരെയോ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത പ്രയോഗമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: അല്ലല്ലോ?
  rationale: μή കൊണ്ടാരംഭിക്കുന്ന ഓരോ ചോദ്യവും നിഷേധാത്മകമായ ഉത്തരം പ്രതീക്ഷിക്കുന്നു. മലയാളത്തിലെ ‘അല്ലല്ലോ?’ എന്ന പ്രയോഗം ഈ വാക്ചാതുര്യവും പ്രതീക്ഷിക്കുന്ന നിഷേധവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സഭാശരീരത്തിലെ എല്ലാവർക്കും ഒരേ ശുശ്രൂഷയോ വരമോ ഇല്ലെന്ന ഊന്നൽ നിലനിർത്തുകയും ഗ്രീക്കിലെ ആവർത്തനം അതേപടി കൈമാറുകയും ചെയ്യുന്നു.
- source_word: ἀπόστολοι
  choice: അപ്പൊസ്തലന്മാർ
  rationale: ഇവിടെ വെറും സന്ദേശവാഹകരെയല്ല, പൗലൊസിന്റെ പട്ടികയിലെ അംഗീകൃത ശുശ്രൂഷാഭൂമികയെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ പദമാണിത്.
- source_word: προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: പ്രവചിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന, സന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാള പദം.
- source_word: διδάσκαλοι
  choice: പഠിപ്പിക്കുന്നവർ
  rationale: ‘അധ്യാപകർ’ എന്നതിനെക്കാൾ സഭാസന്ദർഭത്തിൽ സ്വാഭാവികവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമാണ്; പഠിപ്പിക്കൽ എന്ന പ്രവർത്തനവും നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: δυνάμεις
  choice: അത്ഭുതപ്രവൃത്തികൾ ചെയ്യുന്നവർ
  rationale: ബഹുവചന നാമമായ δυνάμεις അക്ഷരാർഥത്തിൽ ‘ശക്തികൾ/വീര്യപ്രവൃത്തികൾ’ എന്നായാലും, ഈ പട്ടികയിൽ അത്ഭുതകരമായ ശക്തിപ്രവൃത്തികൾ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്ത പ്രയോഗമാണ്. വ്യക്തികൾ തന്നെയാണ് ‘ശക്തികൾ’ എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ശുശ്രൂഷാഭൂമികകളുടെ പട്ടികയിലെ δυνάμεις എന്ന അവസാന ഇനത്തിന്റെ വിവർത്തനം
  choice: എല്ലാവരും അത്ഭുതപ്രവൃത്തികൾ ചെയ്യുന്നവരല്ലല്ലോ?
  alternative: എല്ലാവരും ശക്തികളല്ലല്ലോ? / എല്ലാവർക്കും അത്ഭുതശക്തികളില്ലല്ലോ?
  rationale: ഗ്രീക്ക് വാക്യം നാമംകൊണ്ട് സംക്ഷിപ്തമായി അത്ഭുതകരമായ ശക്തിപ്രവൃത്തികളെയോ അവ ചെയ്യുന്നവരെയോ സൂചിപ്പിക്കുന്നു. പ്രവർത്തനരൂപത്തിലുള്ള മലയാളം പൗലൊസിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു; അതേസമയം അടിക്കുറിപ്പ് പദത്തിന്റെ അക്ഷരാർഥപരമായ രൂപം സംരക്ഷിക്കുന്നു. അത്ഭുതവരങ്ങളുടെ കാലാവധിയെക്കുറിച്ചോ സ്വഭാവത്തെക്കുറിച്ചോ ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ നിലപാട് ഇതിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. നാല് സമാന്തര ചോദ്യങ്ങളുടെയും ആവർത്തനവും നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഭാവവും ‘അല്ലല്ലോ?’ വഴി നിലനിർത്തി. അടിക്കുറിപ്പ് സൂചിക ബന്ധപ്പെട്ട അവസാന ഇനത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
