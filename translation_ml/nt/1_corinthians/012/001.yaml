translation:
  language: ml
  text: ആത്മീയ കാര്യങ്ങളെക്കുറിച്ച്[a], സഹോദരങ്ങളേ[b], നിങ്ങൾ അറിവില്ലാത്തവരായിരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ആത്മീയ വരങ്ങളെക്കുറിച്ച്’; ഗ്രീക്ക് പ്രയോഗം ‘വരങ്ങൾ’ എന്നതിനെക്കാൾ വിശാലമാണ്. എങ്കിലും ഈ അദ്ധ്യായത്തിന്റെ പശ്ചാത്തലം ആത്മാവ് നൽകുന്ന വരങ്ങളിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു. സാദ്ധ്യത കുറവായി, ‘ആത്മീയരായവരെക്കുറിച്ച്’ എന്നും അർഥമാക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘സഹോദരങ്ങളേ’ എന്നത് സഭയെ അഭിസംബോധന ചെയ്യുന്ന പൗലോസിന്റെ പതിവുരൂപമാണ്; ഇതിൽ സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ആത്മീയ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: περί വിഷയം സൂചിപ്പിക്കുന്നതിനാൽ ‘കുറിച്ച്’ എന്നു നൽകി; δέയുടെ മൃദുവായ വിഷയമാറ്റം മലയാളത്തിൽ പ്രത്യേക കാലസൂചകപദം ചേർക്കാതെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τῶν πνευματικῶν
  choice: ആത്മീയ കാര്യങ്ങൾ
  rationale: സവിശേഷണം നാമവൽക്കരിച്ചിരിക്കുന്ന ഈ ഗ്രീക്ക് പ്രയോഗം ‘ആത്മീയ കാര്യങ്ങൾ’, ‘ആത്മീയ വരങ്ങൾ’, അല്ലെങ്കിൽ സാദ്ധ്യത കുറവായി ‘ആത്മീയരായവർ’ എന്നിങ്ങനെ ഗ്രഹിക്കാം. ഗ്രീക്കിലെ വിശാലതയും യഥാർഥമായ അനിശ്ചിതത്വവും മുഖ്യപാഠത്തിൽ നിലനിർത്താൻ ‘ആത്മീയ കാര്യങ്ങൾ’ തിരഞ്ഞെടുത്തു; അദ്ധ്യായത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള ‘വരങ്ങൾ’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം. പൗലോസിന്റെ സഭാസംബോധനയിൽ സ്ത്രീകളും ഉൾപ്പെടാൻ സാധ്യതയുള്ളത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: നിങ്ങൾ അറിവില്ലാത്തവരായിരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നില്ല
  rationale: ἀγνοεῖν എന്നതിന്റെ ‘അറിയാതിരിക്കുക/അറിവില്ലാതിരിക്കുക’ എന്ന അർഥം വ്യക്തമായി നൽകുകയും പൗലോസിന്റെ ഊന്നലുള്ള ഉപദേശപ്രവേശികയുടെ രൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τῶν πνευματικῶν എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: മുഖ്യപാഠത്തിൽ ‘ആത്മീയ കാര്യങ്ങൾ’
  alternative: ‘ആത്മീയ വരങ്ങൾ’; സാദ്ധ്യത കുറവായി ‘ആത്മീയരായവർ’
  rationale: ഗ്രീക്ക് പദം ‘വരങ്ങൾ’ എന്ന് വ്യക്തമായി പറയുന്നില്ല. 12:4–11-ലെ സന്ദർഭം ആത്മാവ് നൽകുന്ന വരങ്ങളിലേക്കും പ്രകടനങ്ങളിലേക്കും വിരൽചൂണ്ടുന്നുവെങ്കിലും, വിശാലമായ പദാർഥവും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും ഇല്ലാതാക്കാതിരിക്കാൻ ‘കാര്യങ്ങൾ’ മുഖ്യപാഠത്തിലും സന്ദർഭാനുസൃതമായ ‘വരങ്ങൾ’ അടിക്കുറിപ്പിലും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഗ്രീക്കിലെ അനിശ്ചിതത്വം മുഖ്യപാഠത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു; അനാവശ്യമായി ‘ഇപ്പോൾ’ എന്ന കാലസൂചകപദം ചേർത്തിട്ടില്ല.
