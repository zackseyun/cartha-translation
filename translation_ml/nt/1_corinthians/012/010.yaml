id: 1CO.12.10
reference: 1 Corinthians 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: ml
  text: മറ്റൊരാൾക്ക് അദ്ഭുതപ്രവൃത്തികൾ[a]; മറ്റൊരാൾക്ക് പ്രവചനം; മറ്റൊരാൾക്ക് ആത്മാക്കളെ വിവേചിച്ചറിയൽ; വേറൊരാൾക്ക് വിവിധതരം ഭാഷകൾ[b]; മറ്റൊരാൾക്ക് ഭാഷകളുടെ വ്യാഖ്യാനം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശക്തികളുടെ പ്രവർത്തനങ്ങൾ’ അല്ലെങ്കിൽ ‘മഹത്തായ ശക്തിപ്രവൃത്തികളുടെ പ്രവർത്തനങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദത്തിന് ‘നാവുകൾ’ എന്നും ‘ഭാഷകൾ’ എന്നും അർഥമാകാം. ആത്മീയവരങ്ങളെക്കുറിച്ചുള്ള പൗലോസിന്റെ ചർച്ചയിൽ ഇത് അറിയപ്പെടുന്ന മനുഷ്യഭാഷകളെയോ മറ്റൊരു സംസാരരൂപത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്നത് തർക്കവിഷയമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: അദ്ഭുതപ്രവൃത്തികൾ
  rationale: ἐνεργήματα എന്നത് പ്രവർത്തനങ്ങളെയോ അവയുടെ ഫലങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ഈ ആത്മീയവരങ്ങളുടെ പട്ടികയിൽ δυνάμεις സാധാരണയായി അത്ഭുതകരമായ ശക്തിപ്രവൃത്തികളെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ അർഥം വ്യക്തമായി നൽകിക്കൊണ്ട് ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: προφητεία
  choice: പ്രവചനം
  rationale: ഇവിടെ പേരെടുത്തിരിക്കുന്ന ആത്മീയവരത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദം; ഗ്രീക്കിലുള്ള അർഥത്തെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: διακρίσεις πνευμάτων
  choice: ആത്മാക്കളെ വിവേചിച്ചറിയാനുള്ള കഴിവുകൾ
  rationale: διακρίσεις എന്ന ബഹുവചനം ആവർത്തിതമായോ വിവിധമായോ ഉള്ള വിവേചനങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ നാമബഹുവചനത്തിന് പകരം സ്വാഭാവികമായി പറഞ്ഞിട്ടും πνευμάτων എന്നതിനെ വിശാലമായ ‘ആത്മാക്കൾ’ എന്ന നിലയിൽ നിലനിർത്തുന്നു.
- source_word: γένη γλωσσῶν
  choice: വിവിധതരം നാവുകൾ
  rationale: γένη എന്നതിന്റെ ‘തരങ്ങൾ’ എന്ന അർഥം വ്യക്തമാക്കുന്നു. γλῶσσαι എന്നതിന് ‘നാവുകൾ’ എന്നു നൽകി ഭാഷകളോ ആത്മീയമായ നാവുപ്രയോഗമോ എന്ന ചർച്ച മുൻകൂട്ടി തീർപ്പാക്കാതെ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: ἑρμηνεία γλωσσῶν
  choice: നാവുകളുടെ വ്യാഖ്യാനം
  rationale: ἑρμηνεία എന്നത് ഉള്ളടക്കം ഗ്രഹിക്കാവുന്ന വിധം അവതരിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘വ്യാഖ്യാനം’ പരിഭാഷ, വിശദീകരണം എന്നീ സാധ്യതകളെ അനാവശ്യമായി വേർതിരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἄλλῳ / ἑτέρῳ
  choice: മറ്റൊരാൾക്ക് / വേറൊരാൾക്ക്
  rationale: ദാതൃവിഭക്തിയിലുള്ള ആവർത്തനം വരങ്ങൾ വ്യത്യസ്ത വ്യക്തികൾക്ക് വിതരണം ചെയ്യപ്പെടുന്നതായി കാണിക്കുന്നു. ἑτέρῳ എന്ന പദമാറ്റം ‘വേറൊരാൾക്ക്’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിച്ചെങ്കിലും വലിയ അർഥവ്യത്യാസം ചുമത്തുന്നില്ല.
theological_decisions:
- issue: δυνάμεων എന്നതിന്റെ സ്വഭാവം
  choice: അദ്ഭുതപ്രവൃത്തികൾ
  alternative: ശക്തിയുടെ പ്രവർത്തനങ്ങൾ; വീര്യപ്രവൃത്തികൾ
  rationale: ഈ ആത്മീയവരങ്ങളുടെ സന്ദർഭത്തിൽ അത്ഭുതകരമായ പ്രവൃത്തികളാണ് സാധ്യതയേറിയ സൂചന. എങ്കിലും കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: γλωσσῶν എന്നതിന്റെ അർഥം
  choice: നാവുകൾ
  alternative: ഭാഷകൾ
  rationale: അറിയപ്പെടുന്ന മനുഷ്യഭാഷകളോ ആത്മീയമായ മറ്റൊരു സംസാരരൂപമോ എന്ന തർക്കം മൂലപദം തന്നെ അന്തിമമായി പരിഹരിക്കുന്നില്ല. ‘നാവുകൾ’ ആ അവ്യക്തത സംരക്ഷിക്കുന്നു; ‘ഭാഷകൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: πνευμάτων എന്നതിന്റെ സൂചന
  choice: ആത്മാക്കൾ എന്ന വിശാലമായ അർഥം നിലനിർത്തി
  alternative: ആത്മീയ ഉച്ചാരണങ്ങൾ; ഉച്ചാരണങ്ങളുടെ പിന്നിലെ ആത്മാക്കൾ; മനുഷ്യാത്മാക്കൾ; ദുഷ്ടാത്മാക്കൾ
  rationale: ഏത് ആത്മാക്കളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് ഗ്രീക്ക് വാചകം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പട്ടികാസ്വഭാവം നിലനിർത്താൻ അർധവിരാമങ്ങൾ ഉപയോഗിച്ചു. ‘ആത്മാക്കളുടെ വിവേചനങ്ങൾ’ എന്ന അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ പ്രയോഗത്തിന് പകരം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രൂപം തെരഞ്ഞെടുത്തു.
