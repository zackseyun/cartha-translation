revisions:
- from: മറ്റൊരാൾക്ക് അദ്ഭുതപ്രവൃത്തികൾ[a]; മറ്റൊരാൾക്ക് പ്രവചനം; മറ്റൊരാൾക്ക് ആത്മാക്കളെ വിവേചിച്ചറിയാനുള്ള കഴിവുകൾ; വേറൊരാൾക്ക് വിവിധതരം നാവുകൾ; മറ്റൊരാൾക്ക് നാവുകളുടെ വ്യാഖ്യാനം[b].
