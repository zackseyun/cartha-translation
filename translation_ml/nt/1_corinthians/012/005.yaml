  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ διαιρέσεις διακονιῶν εἰσιν, καὶ ὁ αὐτὸς κύριος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/005.yaml
  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: ml
  text: ശുശ്രൂഷകളിൽ വൈവിധ്യങ്ങളുണ്ട്[a]; കർത്താവ് ഒരുവൻതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സേവനങ്ങളിൽ’ അല്ലെങ്കിൽ ‘സേവനരീതികളിൽ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: വൈവിധ്യം
  rationale: ഇവിടെ വ്യത്യസ്ത തരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്, ഭിന്നതയെയോ കക്ഷിത്വത്തെയോ അല്ല. അതിനാൽ ‘വൈവിധ്യം’ ഐക്യത്തിനുള്ളിലെ വ്യത്യാസം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διακονιῶν
  choice: ശുശ്രൂഷകൾ
  rationale: സഭയിലെ സേവനപരവും ആത്മീയവുമായ ചുമതലകളെ ഉൾക്കൊള്ളുന്ന പരിചിതമായ മലയാളപദമാണിത്; ‘സേവനങ്ങൾ’ എന്ന അർഥവും അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ αὐτὸς
  choice: ഒരേ
  rationale: വ്യത്യസ്ത ശുശ്രൂഷകൾക്കിടയിലും കർത്താവിന്റെ ഏകതയും മാറ്റമില്ലായ്മയും ഊന്നിപ്പറയുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്ന സ്വാഭാവികമായ പദവി; വാചകത്തിൽ ഇതിന്റെ പരാമർശിതനെ കൂടുതൽ വിശദീകരിക്കുന്നില്ല.
- source_word: καὶ
  choice: എന്നാൽ
  rationale: ഗ്രീക്കിൽ ലളിതമായ ബന്ധകമാണെങ്കിലും, 4–6 വാക്യങ്ങളിലെ ‘വൈവിധ്യം—ഒരേ’ എന്ന ഘടന മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കാൻ രണ്ടാം καί-യ്ക്ക് ‘എന്നാൽ’ ഉപയോഗിച്ചു; ഇത് വിരോധത്തേക്കാൾ താരതമ്യാത്മകമായ വ്യത്യാസം സൂചിപ്പിക്കുന്നു.
- source_word: εἰσιν
  choice: ഉണ്ട്
  rationale: അസ്തിത്വം സൂചിപ്പിക്കുന്ന ക്രിയയുടെ സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: 1 കൊരിന്ത്യർ 12:4–6-ലെ ത്രിതല ഘടനയിൽ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വാചകത്തിൽ ‘കർത്താവ്’ എന്ന പദവി മാത്രം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് ഏറ്റവും സാധ്യതയോടെ കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: കർത്താവായ ദൈവത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പരാമർശം.
  rationale: അടുത്തടുത്ത വാക്യങ്ങളിൽ ‘ഒരേ ആത്മാവ്’, ‘ഒരേ കർത്താവ്’, ‘ഒരേ ദൈവം’ എന്ന ഘടനയുണ്ട്. സാധ്യതയുള്ള ക്രിസ്തുസംബന്ധമായ പരാമർശം അംഗീകരിക്കുമ്പോഴും, മൂലവാചകം വിശദീകരിക്കാതെ അതിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. 12:4–6-ലെ സമാന്തരഘടന കേൾവിയിലും വായനയിലും തെളിയാൻ ‘വൈവിധ്യമുണ്ട് … ഒരേ കർത്താവാണ്’ എന്ന രൂപം ഉപയോഗിച്ചു.
