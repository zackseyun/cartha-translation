id: 1CO.12.16
reference: 1 Corinthians 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: ml
  text: ചെവി, “ഞാൻ കണ്ണല്ലാത്തതിനാൽ ശരീരത്തിന്റെ ഭാഗമല്ല” എന്നു പറഞ്ഞാൽ[a], അതുകൊണ്ട് അത് ശരീരത്തിന്റെ ഭാഗമല്ലാതാകുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ രൂപാനുസൃതമായി: “ഞാൻ കണ്ണല്ലാത്തതിനാൽ ശരീരത്തിൽനിന്നുള്ളവനല്ല” ... “അതുകൊണ്ട് അത് ശരീരത്തിൽനിന്നുള്ളതല്ലാതാകുന്നില്ല.” ഗ്രീക്കിൽ “ശരീരത്തിൽനിന്ന്” എന്ന പ്രയോഗം വാഗ്‌ശക്തിക്കായി ആവർത്തിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐὰν εἴπῃ
  choice: '... എന്നു പറഞ്ഞാൽ'
  rationale: ἐὰν സഹിതമുള്ള aorist subjunctive ഒരു സാങ്കൽപ്പിക നിബന്ധനയാണ്; മലയാളത്തിലെ ‘പറഞ്ഞാൽ’ അത് സ്വാഭാവികമായി നൽകുന്നു. καὶ മുൻ ഉദാഹരണത്തോടുള്ള ബന്ധത്തിൽ വാക്യപ്രവാഹത്തിലൂടെ പ്രതിഫലിക്കുന്നു.
- source_word: τὸ οὖς
  choice: ചെവി
  rationale: ശരീരാവയവത്തെ സൂചിപ്പിക്കുന്ന സാധാരണ പദം; ഉപമയിൽ വ്യക്തിവൽക്കരിച്ചിരിക്കുന്നു.
- source_word: Ὅτι οὐκ εἰμὶ ὀφθαλμός
  choice: ഞാൻ കണ്ണല്ലാത്തതിനാൽ
  rationale: ὅτι ഇവിടെ പ്രസ്താവനയുടെ ഉള്ളടക്കത്തോടൊപ്പം കാരണബന്ധവും നൽകുന്നു; ‘അല്ലാത്തതിനാൽ’ ആ പരാതിയുടെ യുക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐκ τοῦ σώματος
  choice: ശരീരത്തിന്റെ ഭാഗം
  rationale: ഈ ശരീരാവയവ-ഉപമയിൽ ἐκ τοῦ σώματος എന്നത് അംഗത്വം സൂചിപ്പിക്കുന്നു. ‘ശരീരത്തിൽനിന്നുള്ളത്’ എന്ന അക്ഷരാർഥ വിവർത്തനത്തേക്കാൾ ഇത് സ്വാഭാവികവും അർഥസൂക്ഷ്മവുമാണ്.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: അതുകൊണ്ട് അത് ശരീരത്തിന്റെ ഭാഗമല്ലാതാകുന്നില്ല
  rationale: παρὰ τοῦτο സൂചിപ്പിക്കുന്ന അടിസ്ഥാനത്തെ നിഷേധിക്കുകയും ഗ്രീക്കിലെ ആവർത്തിത നിഷേധത്തിന്റെ വാദാത്മക ശക്തി മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശരീരോപമയിലെ അംഗത്വഭാഷയും ആവർത്തിത നിഷേധവും
  choice: ‘ശരീരത്തിന്റെ ഭാഗം’ എന്ന സ്വാഭാവിക അംഗത്വഭാഷ ഉപയോഗിച്ച് ‘ഭാഗമല്ലാതാകുന്നില്ല’ എന്ന നിഷേധഘടന നിലനിർത്തി.
  alternative: ‘ശരീരത്തിൽനിന്നുള്ളതല്ല ... അതിനാൽ ശരീരത്തിൽനിന്നുള്ളതല്ലാതാകുന്നില്ല’ എന്ന കൂടുതൽ രൂപാനുസൃതമായ വിവർത്തനം.
  rationale: പൗലോസിന്റെ നിഗമനനിഷേധം സംരക്ഷിക്കുമ്പോൾ മലയാളത്തിൽ അസ്വാഭാവികമായ ഘടന ഒഴിവാക്കുന്നു; സഭാശരീരത്തെക്കുറിച്ചുള്ള അധിക വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക മാനക മലയാളം; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചെവിയുടെ ഉദ്ധരണിയിൽ ഒന്നാംപുരുഷപ്രയോഗവും തുടർന്നുള്ള പരാമർശത്തിൽ നപുംസക ഏകവചനമായ ‘അത്’ എന്നും ഉപയോഗിച്ചു.
