  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διαιρέσεις δὲ χαρισμάτων εἰσίν, τὸ δὲ αὐτὸ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/004.yaml
  text: There are varieties of gifts[a], but the same Spirit.
translation:
  language: ml
  text: ദാനങ്ങളിൽ വൈവിധ്യമുണ്ട്[a]; എന്നാൽ ആത്മാവ് ഒന്നുതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദാനങ്ങളുടെ വിതരണങ്ങൾ’ അല്ലെങ്കിൽ ‘ദാനങ്ങളിലെ വ്യത്യാസങ്ങൾ.’ ഗ്രീക്ക് പദം സഭയിലെ ഭിന്നതയെയല്ല, ദാനങ്ങൾക്കുള്ളിലെ വൈവിധ്യത്തെയാണ് ഊന്നിപ്പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαιρέσεις
  choice: വൈവിധ്യം
  rationale: ഇവിടെ സഭയിലെ ഭിന്നതയെയല്ല, ദാനങ്ങൾക്കിടയിലെ വ്യത്യസ്ത തരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വൈവിധ്യം’ ഈ ആശയം സ്വാഭാവികമായും പ്രതികൂല ധ്വനിയില്ലാതെയും നൽകുന്നു.
- source_word: δὲ ... δὲ
  choice: —; എന്നാൽ
  rationale: ആദ്യത്തെ δέ പുതിയ വിശദീകരണത്തിലേക്കുള്ള മൃദുവായ സംക്രമണമാണ്; മലയാളത്തിൽ പ്രത്യേകം പദം ചേർക്കാതെ വാക്യാരംഭം സ്വാഭാവികമാക്കി. രണ്ടാമത്തേത് വൈവിധ്യവും ഏകതയും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: χαρισμάτων
  choice: ദാനങ്ങളിൽ
  rationale: χάρισμα കൃപയാൽ നൽകപ്പെടുന്ന ദാനത്തെ, ഈ സന്ദർഭത്തിൽ ആത്മീയ ദാനങ്ങളെ, സൂചിപ്പിക്കുന്നു. ‘ദാനങ്ങൾ’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: τὸ ... αὐτὸ
  choice: ഒരുവൻതന്നെ
  rationale: ദാനങ്ങളുടെ വൈവിധ്യത്തിനിടയിലും അവയുടെ ഉറവിടമായ ആത്മാവിന്റെ ഏകതയും ഒരേ വ്യക്തിത്വവും ഊന്നിപ്പറയുന്നു. വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’ എന്നതിനോട് ചേർന്ന് ‘ഒരുവൻതന്നെ’ സ്വാഭാവികമാണ്.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: 12:3–11-ലെ സന്ദർഭം ദാനങ്ങൾ നൽകുന്ന പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ ദൈവിക വ്യക്തിയെ സൂചിപ്പിക്കുന്ന മാന്യമായ രൂപം ഉപയോഗിച്ചു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവ്; മുഖ്യപാഠത്തിൽ ‘ആത്മാവ്’
  alternative: മനുഷ്യാത്മാവ് അഥവാ ആത്മീയ ശക്തി/തത്ത്വം
  rationale: സമീപസന്ദർഭത്തിൽ ദാനങ്ങൾ വിതരണം ചെയ്യുന്ന ദൈവിക ആത്മാവിനെ ആവർത്തിച്ച് പരാമർശിക്കുന്നു. എന്നാൽ മൂലപാഠത്തിൽ ‘പരിശുദ്ധ’ എന്ന വിശേഷണം ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അത് ചേർക്കാതെ ‘ആത്മാവ്’ എന്നു മാത്രം നൽകി.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭിന്നതകൾ’ എന്ന പ്രതികൂല ധ്വനിയുള്ള പദത്തിനു പകരം സന്ദർഭോചിതമായി ‘വൈവിധ്യം’ ഉപയോഗിച്ചു; മൂലത്തിലെ വൈവിധ്യം–ഏകത വൈരുധ്യം അർധവിരാമവും ‘എന്നാൽ’ എന്ന ബന്ധകവുംകൊണ്ട് നിലനിർത്തി.
