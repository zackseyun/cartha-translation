  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: ml
  text: എന്നാൽ വാസ്തവത്തിൽ, ദൈവം അവയവങ്ങളിൽ ഓരോന്നിനെയും ശരീരത്തിൽ താൻ ഇച്ഛിച്ചതുപോലെ[b] ക്രമപ്പെടുത്തി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വെച്ചു’ അല്ലെങ്കിൽ ‘സ്ഥാപിച്ചു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘താൻ ആഗ്രഹിച്ചതുപോലെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ വാസ്തവത്തിൽ
  rationale: മുൻവാക്യങ്ങളിലെ സാങ്കൽപ്പിക സാധ്യതകളോട് വൈരുധ്യം പ്രകടിപ്പിച്ച് യഥാർഥ സ്ഥിതിയിലേക്കു മടങ്ങുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: ഗ്രീക്ക് കർത്താവിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἔθετο
  choice: ക്രമപ്പെടുത്തി
  rationale: τίθημι എന്നതിന് ‘വെച്ചു/സ്ഥാപിച്ചു’ എന്ന അടിസ്ഥാനാർഥമുണ്ടെങ്കിലും, ശരീരത്തിലെ അവയവങ്ങളുടെ ഉദ്ദേശ്യപൂർവമായ വിന്യാസമാണ് സന്ദർഭത്തിൽ ഊന്നുന്നത്; ‘ക്രമപ്പെടുത്തി’ അത് വ്യക്തമായി നൽകുന്നു.
- source_word: τὰ μέλη
  choice: അവയവങ്ങളെ
  rationale: ശരീരത്തിന്റെ വിവിധ പ്രവർത്തനഭാഗങ്ങളെ സൂചിപ്പിക്കുന്ന കൃത്യവും സാധാരണക്കാർക്ക് മനസ്സിലാകുന്നതുമായ പദം.
- source_word: ἓν ἕκαστον αὐτῶν
  choice: അവയിൽ ഓരോന്നിനെയും
  rationale: ഓരോ അവയവത്തിനുമുള്ള വ്യക്തിഗത ഊന്നൽ നിലനിർത്തുകയും മുൻപറഞ്ഞ അവയവങ്ങളിലേക്കുള്ള ബന്ധം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῷ σώματι
  choice: ശരീരത്തിൽ
  rationale: പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ; ആദ്യം ശരീരരൂപകത്തെയും വിശാലസന്ദർഭത്തിൽ സഭയെയും സൂചിപ്പിക്കുന്നു.
- source_word: καθὼς ἠθέλησεν
  choice: താൻ ഇച്ഛിച്ചതുപോലെ
  rationale: ദൈവത്തിന്റെ സ്വന്തം ഉദ്ദേശത്തോടുള്ള കൃത്യമായ പൊരുത്തവും ഇച്ഛാശക്തിയും ലളിതവും മാന്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശരീരത്തിലെ ഓരോ അവയവത്തിന്റെയും വിന്യാസത്തിലുള്ള ദൈവിക ഉദ്ദേശ്യം
  choice: ഓരോ അവയവത്തെയും ദൈവം തന്റെ ഇച്ഛപ്രകാരം ശരീരത്തിൽ ഉദ്ദേശ്യപൂർവം ക്രമപ്പെടുത്തി.
  alternative: ഉദ്ദേശ്യപൂർവമായ ക്രമീകരണത്തിന് ഊന്നൽ നൽകാതെ ദൈവം അവയവങ്ങളെ വെച്ചു എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: ἔθετο, καθὼς ἠθέλησεν എന്നീ പ്രയോഗങ്ങളും സന്ദർഭത്തിലെ വാദവും വൈവിധ്യം യാദൃച്ഛികമല്ലെന്നും ദൈവത്തിന്റെ ഉദ്ദേശ്യപ്രകാരമാണെന്നും സൂചിപ്പിക്കുന്നു; അതിനപ്പുറമുള്ള ഒരു സിദ്ധാന്തവും പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ദീർഘവാക്യത്തിന്റെ വ്യക്തതയ്ക്കായി ‘അവയിൽ ഓരോന്നിനെയും’ എന്ന വിതരണപ്രയോഗം ഡാഷുകൾക്കുള്ളിൽ നൽകി; ശരീരരൂപകത്തിന്റെ പദസൂക്ഷ്മത നിലനിർത്താൻ ‘അവയവങ്ങൾ’ ഉപയോഗിച്ചു.
