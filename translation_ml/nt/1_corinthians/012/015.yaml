id: 1CO.12.15
reference: 1 Corinthians 12:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: ml
  text: കാൽ[a], “ഞാൻ കൈയല്ലാത്തതിനാൽ ശരീരത്തിൽപ്പെട്ടതല്ല” എന്നു പറഞ്ഞാൽ, അതുകൊണ്ടുമാത്രം അത് ശരീരത്തിൽപ്പെട്ടതല്ലാതാകുന്നില്ലല്ലോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഭാഷാസഹജമായി: “ഞാൻ കൈയല്ലാത്തതിനാൽ ശരീരത്തിന്റെ ഭാഗമല്ല ... അതുകൊണ്ട് അത് ശരീരത്തിന്റെ ഭാഗമല്ലാതാകുന്നില്ലല്ലോ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: ഇങ്ങനെ പറഞ്ഞാൽ
  rationale: ἐὰν സഹിതമുള്ള subjunctive പൊതുവായ ഒരു സാങ്കൽപ്പിക സാഹചര്യം അവതരിപ്പിക്കുന്നു; ‘പറഞ്ഞാൽ’ ആ വ്യവസ്ഥാഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ πούς
  choice: കാൽ
  rationale: പൗലോസിന്റെ ശരീരാവയവരൂപകം വ്യക്തമായി നിലനിർത്താൻ അവയവനാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
- source_word: Ὅτι οὐκ εἰμὶ χείρ
  choice: ഞാൻ കൈ അല്ലാത്തതിനാൽ
  rationale: ὅτι ഇവിടെ കാലിന്റെ നിഗമനത്തിന് കാരണമായി പറയുന്ന വാക്കിനെ അവതരിപ്പിക്കുന്നു; ‘അല്ലാത്തതിനാൽ’ ആ കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τοῦ σώματος
  choice: ശരീരത്തിൽപ്പെട്ടത്
  rationale: ഈ സന്ദർഭത്തിൽ ἐκ τοῦ σώματος ശരീരത്തോടുള്ള അംഗത്വം സൂചിപ്പിക്കുന്നു. ‘ശരീരത്തിൽപ്പെട്ടത്’ എന്നത് ‘ശരീരത്തിൽനിന്നുള്ളത്’ എന്ന അത്യന്തം അക്ഷരാർഥപരവും മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്നതുമായ രൂപത്തെക്കാൾ സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ ആവർത്തനം രണ്ടിടത്തും നിലനിർത്തിയിട്ടുണ്ട്.
- source_word: οὐ παρὰ τοῦτο οὐκ ἔστιν
  choice: അതുകൊണ്ടുമാത്രം ... അല്ലാതാകുന്നില്ലല്ലോ?
  rationale: παρὰ τοῦτο സൂചിപ്പിക്കുന്ന അടിസ്ഥാനത്തെ ‘അതുകൊണ്ടുമാത്രം’ വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ നിഷേധങ്ങളുടെ വാദാത്മക ശക്തിയും ഉത്തരമാവശ്യപ്പെടാത്ത ചോദ്യഭാവവും ‘അല്ലാതാകുന്നില്ലല്ലോ?’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശരീരരൂപകത്തിലെ അംഗത്വഭാഷയും ഇരട്ടനിഷേധവും എത്രമാത്രം സ്വാഭാവികമാക്കണം
  choice: ‘ശരീരത്തിൽപ്പെട്ടത്’ എന്ന അംഗത്വഭാഷ ആവർത്തിച്ച്, അവസാനത്തെ നിഷേധാത്മക വാചാടോപചോദ്യം നിലനിർത്തി.
  alternative: ‘ശരീരത്തിന്റെ ഭാഗമല്ല ... അതുകൊണ്ട് അത് ശരീരത്തിന്റെ ഭാഗമല്ലാതാകുന്നില്ല’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം.
  rationale: ‘ഭാഗം’ ആശയം കൃത്യമായി വ്യക്തമാക്കുന്നുവെങ്കിലും മൂലത്തിലെ ἐκ τοῦ σώματος എന്ന ആവർത്തനത്തിന് ഒരു വ്യാഖ്യാനം ചേർക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം പൗലോസിന്റെ ആവർത്തനവും വാദത്തിലെ സംഘർഷവും സൂക്ഷിക്കുമ്പോൾ ആധുനിക മലയാളത്തിൽ മനസ്സിലാക്കാവുന്നതുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശരീരത്തിൽപ്പെട്ടത്’ സാധാരണ വായനക്കാർക്ക് അംഗത്വം വ്യക്തമാക്കുകയും മൂലത്തിലെ ആവർത്തനം സൂക്ഷിക്കുകയും ചെയ്യുന്നു; ‘അല്ലാതാകുന്നില്ലല്ലോ?’ വാചാടോപചോദ്യത്തിന്റെ പ്രതീക്ഷിത നിഷേധോത്തരം സ്വാഭാവികമായി അറിയിക്കുന്നു.
