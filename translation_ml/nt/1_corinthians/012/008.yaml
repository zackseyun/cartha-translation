id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: ml
  text: ഒരാൾക്കു ആത്മാവിലൂടെ ജ്ഞാനത്തിന്റെ സന്ദേശം[a] നൽകപ്പെടുന്നു; മറ്റൊരാൾക്കാകട്ടെ അതേ ആത്മാവിനനുസരിച്ച്[c] അറിവിന്റെ സന്ദേശം[b] നൽകപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജ്ഞാനത്തിന്റെ വചനം’ / ‘ജ്ഞാനത്തിന്റെ പ്രസ്താവനം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അറിവിന്റെ വചനം’ / ‘അറിവിന്റെ പ്രസ്താവനം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അതേ ആത്മാവിനാൽ.’ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് ഉപസർഗ്ഗം മുമ്പുള്ള ‘ആത്മാവിലൂടെ’ എന്നതിലേതിൽനിന്ന് വ്യത്യസ്തമാണ്; ഏക ആത്മാവെന്ന പൊതുവായ ഉറവിടത്തോടുള്ള അനുസരണം ഇതിലൂടെ ഊന്നിപ്പറയുന്നുണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν ... ἄλλῳ δὲ
  choice: ഒരാൾക്കു ... മറ്റൊരാൾക്കാകട്ടെ
  rationale: വിതരണപരമായ സമാന്തരഘടന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; μὲν...δὲ എന്ന വൈരുധ്യസൂചനയും നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ πνεύματος
  choice: ആത്മാവിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മാർഗം/മധ്യസ്ഥത നിലനിർത്തുകയും പിന്നീട് വരുന്ന κατάയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δίδοται
  choice: നൽകപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു; വരം സ്വയം ഉത്ഭവിക്കുന്നതല്ല, നൽകപ്പെടുന്നതാണെന്ന വാക്യഘടന നിലനിർത്തുന്നു.
- source_word: λόγος σοφίας
  choice: ജ്ഞാനത്തിന്റെ സന്ദേശം
  rationale: λόγος ഇവിടെ ഒരു ഒറ്റ പദത്തേക്കാൾ ആശയവിനിമയമായ വാക്ക്/ഉച്ചാരണം സൂചിപ്പിക്കാം. 'സന്ദേശം' സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാണ്; പരമ്പരാഗത സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: λόγος γνώσεως
  choice: അറിവിന്റെ സന്ദേശം
  rationale: λόγος എന്നതിന് മുൻപത്തെ പ്രയോഗവുമായി ഏകീകരണം പാലിക്കുന്നു; σοφίαയും γνῶσιςയും തമ്മിലുള്ള പദവ്യത്യാസം 'ജ്ഞാനം/അറിവ്' ആയി നിലനിർത്തുന്നു.
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: അതേ ആത്മാവിനനുസരിച്ച്
  rationale: κατάയുടെ അനുസരണം/പൊരുത്തം എന്ന അർഥം സംരക്ഷിക്കുകയും ആദ്യത്തെ διάയിൽനിന്നുള്ള ഗ്രീക്ക് ഉപസർഗ്ഗവ്യത്യാസം മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന 'ആത്മാവ്'
  alternative: മനുഷ്യാത്മാവ്
  rationale: 1 കൊരിന്ത്യർ 12-ന്റെ സമീപസന്ദർഭം വിവിധ വരങ്ങൾ വിതരണം ചെയ്യുന്ന ഏക ദൈവാത്മാവിനെക്കുറിച്ചാണ്; മലയാളത്തിൽ 'ആത്മാവ്' എന്ന സാധാരണ ബൈബിൾപ്രയോഗം അധിക വ്യാഖ്യാനം ചേർക്കാതെ അത് സൂചിപ്പിക്കുന്നു.
- issue: λόγος എന്നതിന്റെ വരദാനസംബന്ധമായ അർഥം
  choice: സന്ദേശം
  alternative: വചനം / വാക്ക് / ഉച്ചാരണം
  rationale: ആശയവിനിമയസ്വഭാവമുള്ള പ്രസ്താവന എന്ന വിശാലത 'സന്ദേശം' സ്വാഭാവികമായി നൽകുന്നു. എന്നാൽ 'വചനം/വാക്ക്' എന്ന കൂടുതൽ രൂപസമീപമായ വായനയും സാധുവായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: διάയും κατάയും തമ്മിലുള്ള വ്യത്യാസം
  choice: ആത്മാവിലൂടെ ... ആത്മാവിനനുസരിച്ച്
  alternative: രണ്ടിടത്തും 'ആത്മാവിനാൽ'
  rationale: ഒരേ ആത്മാവാണ് പൊതുവായ ഉറവിടമെന്ന ആശയം നിലനിൽക്കുമ്പോഴും മൂലപാഠത്തിലെ വ്യത്യസ്ത ഉപസർഗ്ഗങ്ങളെ ഒരേ മലയാളരൂപത്തിലാക്കി സമതലപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 'ജ്ഞാനം' എന്നും 'അറിവ്' എന്നും ഉപയോഗിച്ച് σοφία/γνῶσις വ്യത്യാസം നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
