translation:
  language: ml
  text: മറിച്ച്, ശരീരത്തിലെ ബലഹീനമെന്നു തോന്നുന്ന ഭാഗങ്ങൾ അതിലും അധികം ആവശ്യമായവയാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറിച്ച്, വളരെ കൂടുതലായി, ശരീരത്തിലെ ബലഹീനമെന്നു തോന്നുന്ന ഭാഗങ്ങൾ ആവശ്യമായവയാണ്.’ ഗ്രീക്കിലെ ‘അതിലും അധികം’ എന്ന പ്രയോഗം ശക്തമായ താരതമ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ആവശ്യമായവയാണ്’ എന്നതിന് ‘അത്യന്താപേക്ഷിതമാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ πολλῷ μᾶλλον
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തിലെ ധാരണയെ ശക്തമായി തിരുത്തുന്ന വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ πολλῷ μᾶλλον എന്ന ശക്തിവർധക പ്രയോഗം മുഖ്യവാചകത്തിൽ പ്രത്യേകം പ്രതിഫലിപ്പിക്കാവുന്നതിനാൽ അതിന്റെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τὰ δοκοῦντα
  choice: തോന്നുന്ന
  rationale: യഥാർഥ സ്ഥിതിയല്ല, കാഴ്ചയിലോ വിലയിരുത്തലിലോ അങ്ങനെ അനുഭവപ്പെടുന്നതാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: μέλη τοῦ σώματος
  choice: ശരീരഭാഗങ്ങൾ
  rationale: ശരീരം എന്ന മൂർത്തമായ ഉപമ നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കാവുന്ന രൂപം.
- source_word: ἀσθενέστερα ὑπάρχειν
  choice: ബലഹീനമെന്ന്
  rationale: താരതമ്യാർഥമുള്ള ἀσθενέστερα എന്ന പദം ഇവിടെ ശരീരത്തിലെ മറ്റു ഭാഗങ്ങളോടുള്ള ആപേക്ഷിക ബലഹീനത സൂചിപ്പിക്കുന്നു; δοκοῦντα ... ὑπάρχειν എന്ന ഘടനയോടു ചേർന്ന് ‘ബലഹീനമെന്നു തോന്നുന്ന’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: ἀναγκαῖά ἐστιν
  choice: അത്യന്താപേക്ഷിതമാണ്
  rationale: അവയെ ഒഴിവാക്കാനാവില്ലെന്ന ശക്തമായ ആവശ്യകത സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘ആവശ്യമാണ്’ എന്ന കൂടുതൽ ഔപചാരിക സമാനരൂപവും സാധ്യമാണ്.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിലെ ശരീരോപമയുടെ പ്രാബല്യം
  choice: വാക്യത്തിൽ ശരീരഭാഗങ്ങൾ എന്ന മൂർത്തമായ ഉപമ നിലനിർത്തി.
  alternative: ‘സഭാംഗങ്ങൾ’ എന്നു വ്യാഖ്യാനാത്മകമായി വിവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭത്തിൽ പൗലോസ് സഭയെക്കുറിച്ചാണ് ഉപമ പ്രയോഗിക്കുന്നതെങ്കിലും, ഈ വാക്യം നേരിട്ട് ശരീരഭാഗങ്ങളെക്കുറിച്ചാണ് പറയുന്നത്. അതിനാൽ ഉപമയെ വിശദീകരണപരമായി ലഘൂകരിച്ചിട്ടില്ല.
- issue: ബലഹീനത യാഥാർഥ്യമോ തോന്നലോ
  choice: ‘ബലഹീനമെന്നു തോന്നുന്ന’ എന്നു നൽകി, ബലഹീനതയെ കാഴ്ചപ്പാടിന്റെ തലത്തിൽ നിലനിർത്തി.
  alternative: ‘ബലഹീനമായ’ എന്നു യാഥാർഥ്യസ്ഥിതിയായി അവതരിപ്പിക്കുക.
  rationale: δοκοῦντα എന്ന പദം തോന്നലിനെയോ വിലയിരുത്തലിനെയോ സൂചിപ്പിക്കുന്നു; ഭാഗങ്ങൾ യഥാർഥത്തിൽ ബലഹീനമാണെന്ന് വാക്യം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, ഗൗരവമുള്ള മലയാളം. ‘ശരീരഭാഗങ്ങൾ’ എന്ന പ്രയോഗം ശരീരോപമ നിലനിർത്തുന്നു; സഭാസംബന്ധിയായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് ചേർത്തിട്ടില്ല.
