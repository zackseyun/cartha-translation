    issue: The main text does not translate πολλῷ μᾶλλον.
    rationale: ‘മറിച്ച്’ renders ἀλλά, but it does not convey the additional explicit intensifier/comparative πολλῷ μᾶλλον. The source states the contrast emphatically; this should appear in the translation itself rather than only in a note.
  - severity: low
    issue: The existing first footnote frames the source intensifier as an alternative despite its absence from the main translation.
    rationale: Once the intensifier is translated in the text, the note should instead explain the possible wording or the comparative force, without suggesting that the core source wording is merely optional.
