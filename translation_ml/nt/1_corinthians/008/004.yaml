reference: 1 Corinthians 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: ml
  text: അതിനാൽ, വിഗ്രഹങ്ങൾക്ക് ബലിയർപ്പിച്ച ഭക്ഷണം കഴിക്കുന്നതിനെക്കുറിച്ച്, ലോകത്തിൽ വിഗ്രഹം ഒന്നുമല്ല[a] എന്നും ഏകനായ ദൈവമല്ലാതെ മറ്റൊരു ദൈവവുമില്ല[b] എന്നും നമുക്കറിയാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ലോകത്തിൽ വിഗ്രഹത്തിന് യഥാർഥ അസ്തിത്വമില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഒരുവനല്ലാതെ ഒരു ദൈവവുമില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: ഭക്ഷണം കഴിക്കുന്നത്
  rationale: ഈ നാമം ഭക്ഷണവസ്തുവിനെക്കാൾ ഭക്ഷിക്കുന്ന പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; περὶയോടൊപ്പമുള്ള പ്രയോഗത്തിന്റെ ക്രിയാത്മക അർഥം ഇതിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: εἰδωλοθύτων
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം
  rationale: ബലിവസ്തു മാംസത്തിൽ മാത്രം ഒതുങ്ങണമെന്നില്ല; അതിനാൽ വിശാലമായ ഗ്രീക്ക് പ്രയോഗത്തെ ‘ഭക്ഷണം’ എന്നു വ്യക്തമായി പരിഭാഷപ്പെടുത്തി.
- source_word: οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: വർത്തമാനാർഥമുള്ള ക്രിയാരൂപവും പൗലോസ് വായനക്കാരുമായി പങ്കിടുന്ന അറിവിലേക്കുള്ള അഭ്യർഥനയും നിലനിർത്തുന്നു.
- source_word: οὐδὲν εἴδωλον
  choice: ഒരു വിഗ്രഹവും ഒന്നുമല്ല
  rationale: വിഗ്രഹത്തിന്റെ നിഷ്ഫലതയെയോ യാഥാർഥ്യമില്ലായ്മയെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിന്റെ സംക്ഷിപ്തവും ശക്തവുമായ രൂപം നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ തത്ത്വചിന്താപരമായ അർഥം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചിട്ടില്ല.
- source_word: ἐν κόσμῳ
  choice: ലോകത്തിൽ
  rationale: സൃഷ്ടലോകം അഥവാ യാഥാർഥ്യത്തിന്റെ ലോകമണ്ഡലം എന്ന സാധാരണ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: ഒരുവനല്ലാതെ മറ്റൊരു ദൈവവുമില്ല
  rationale: ഏകദൈവവിശ്വാസപരമായ ഉറച്ച അവകാശവാദം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; θεός എന്ന പദം ഇവിടെ സത്യദൈവത്തെയും ദൈവമെന്നു വിളിക്കപ്പെടുന്നവരെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്നതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനപരമായ മാറ്റം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: വിഗ്രഹങ്ങളുടെ നിലയും ഏകദൈവവിശ്വാസവും സംബന്ധിച്ച പൗലോസിന്റെ പ്രസ്താവന
  choice: വിഗ്രഹം ‘ഒന്നുമല്ല’ എന്നും ഒരുവനല്ലാതെ മറ്റൊരു ദൈവവുമില്ല എന്നും ശക്തമായി പ്രസ്താവിച്ചു.
  alternative: വിഗ്രഹത്തിന് യഥാർഥ അസ്തിത്വമില്ലെന്ന് മുഖ്യവാചകത്തിൽ വിശദീകരിക്കുക; അല്ലെങ്കിൽ രണ്ടാം വാക്യഭാഗത്തിൽ ‘ദേവൻ’ എന്നു ഉപയോഗിച്ച് പുറജാതീയ ദേവന്മാരുമായുള്ള വ്യത്യാസം മുൻനിർത്തുക.
  rationale: ഗ്രീക്ക് വാചകം വിഗ്രഹത്തിന്റെ ശൂന്യതയും ഏകദൈവത്തിന്റെ അനന്യതയും ഒരുമിച്ച് ഉറപ്പിക്കുന്നു. മുഖ്യവാചകം ഈ സംഘർഷം വിശദീകരണത്തിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു; സാധ്യമായ അർഥഭേദങ്ങൾ അടിക്കുറിപ്പുകളിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പറയുമ്പോൾ’ എന്ന ബന്ധപ്രയോഗം περὶയോടുകൂടിയ വിഷയമാറ്റത്തെ മലയാളത്തിൽ സുഗമമാക്കുന്നു. മുഖ്യവാചകത്തിൽ ‘ദൈവം’ എന്നും അടിക്കുറിപ്പിലെ മറ്റൊരു സാധ്യതയിൽ ‘ദേവൻ’ എന്നും ഉപയോഗിച്ച് θεός എന്ന പദത്തിന്റെ സന്ദർഭപരമായ വ്യത്യാസം സൂചിപ്പിച്ചു.
