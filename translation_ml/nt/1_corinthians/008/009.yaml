id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: ml
  text: എന്നാൽ നിങ്ങളുടെ ഈ അവകാശം ഏതെങ്കിലും വിധത്തിൽ ബലഹീനർക്ക് ഇടർച്ചയ്ക്കു കാരണമാകാതിരിക്കാൻ സൂക്ഷിച്ചുകൊള്ളുക.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നിങ്ങളുടെ ഈ സ്വാതന്ത്ര്യം” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് “അധികാരം,” “അവകാശം,” “സ്വാതന്ത്ര്യം” എന്നീ അർത്ഥങ്ങൾ വരാം; ഇവിടെ വിഗ്രഹങ്ങളുമായി ബന്ധപ്പെട്ട ഭക്ഷണം കഴിക്കാൻ ചില വിശ്വാസികൾ തങ്ങൾക്കുണ്ടെന്ന് അവകാശപ്പെട്ട സ്വാതന്ത്ര്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ബലഹീനർ” എന്നത് ഈ വിഷയത്തിൽ മനസ്സാക്ഷി ബലഹീനരായവരെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: സൂക്ഷിച്ചുകൊള്ളുക
  rationale: ജാഗ്രതയോടെയുള്ള കരുതൽ ആവശ്യപ്പെടുന്ന വർത്തമാനകാല ആജ്ഞയുടെ മുന്നറിയിപ്പുസ്വരം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻചർച്ചയിൽനിന്ന് മുന്നറിയിപ്പിലേക്കുള്ള മൃദുവായ വൈരുധ്യപരമായ തിരിവ് സൂചിപ്പിക്കുന്നു.
- source_word: μή πως
  choice: ഏതെങ്കിലും വിധത്തിൽ ... ആകാതിരിക്കാൻ
  rationale: സാധ്യതയുള്ള ദോഷഫലം ഒഴിവാക്കണമെന്ന നിഷേധാത്മക മുൻകരുതൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: നിങ്ങളുടെ ഈ അവകാശം
  rationale: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം കഴിക്കുന്നതിനെക്കുറിച്ച് ചിലർ അവകാശപ്പെട്ട സ്വാതന്ത്ര്യത്തെ ഇവിടെ സൂചിപ്പിക്കുന്നു; ἐξουσίαയുടെ ‘അധികാരം/അവകാശം/സ്വാതന്ത്ര്യം’ എന്ന അർത്ഥവ്യാപ്തിയിൽ സന്ദർഭത്തിന് ‘അവകാശം’ യോജിക്കുന്നു.
- source_word: πρόσκομμα
  choice: ഇടർച്ചയ്ക്കു കാരണമായത്
  rationale: മറ്റൊരാളെ ധാർമികമായോ ആത്മീയമായോ വീഴാൻ ഇടയാക്കുന്ന തടസ്സം എന്ന രൂപകം നിലനിർത്തുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പ്രയോഗമാണ്.
- source_word: γένηται
  choice: ആകുക
  rationale: ദോഷകരമായ ഒരു ഫലമായി തീരുക എന്ന ഉപവാക്യത്തിലെ ലളിതമായ അർത്ഥം നൽകുന്നു.
- source_word: τοῖς ἀσθενέσιν
  choice: ബലഹീനർക്ക്
  rationale: മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു; ഈ അധ്യായത്തിന്റെ സന്ദർഭത്തിൽ മനസ്സാക്ഷി ബലഹീനരായ വിശ്വാസികളെയാണ് ഉദ്ദേശിക്കുന്നത്.
theological_decisions:
- issue: ἐξουσίαയുടെ സന്ദർഭാർഥം
  choice: വിഗ്രഹാർപ്പിത ഭക്ഷണവുമായി ബന്ധപ്പെട്ട് കൊരിന്ത്യർ അവകാശപ്പെട്ട സ്വാതന്ത്ര്യം അഥവാ അവകാശം
  alternative: പൊതുവായ അധികാരം അല്ലെങ്കിൽ ശക്തി
  rationale: 1 കൊരിന്ത്യർ 8-ന്റെ അടുത്ത സന്ദർഭം ഭക്ഷണം കഴിക്കാനുള്ള അവകാശത്തെക്കുറിച്ചാണ്; ‘അവകാശം’ എന്നു നൽകുന്നത് സ്ഥാപനപരമായ അധികാരം അനാവശ്യമായി സൂചിപ്പിക്കാതെ പ്രായോഗികമായ നൈതിക പ്രശ്നം വ്യക്തമാക്കുന്നു.
- issue: τοῖς ἀσθενέσιν എന്നതിന്റെ സൂചന
  choice: ഈ വിഷയത്തിൽ മനസ്സാക്ഷി ബലഹീനരായ സഹവിശ്വാസികൾ
  alternative: പൊതുവായ അർത്ഥത്തിൽ ബലഹീനരായ ആളുകൾ
  rationale: അധ്യായത്തിൽ ‘ബലഹീനർ’ എന്നത് മുറിവേൽക്കാവുന്ന മനസ്സാക്ഷിയുള്ളവരെ സൂചിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ മൂലത്തിന്റെ സംക്ഷിപ്തതയും അർത്ഥതുറപ്പും നിലനിർത്തി, അടിക്കുറിപ്പിൽ സന്ദർഭം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഇടർച്ച’ എന്ന പരിചിതമായ തിരുവെഴുത്തുരൂപകം നിലനിർത്തുമ്പോൾ ‘കാരണമാകുക’ ചേർത്ത് അർത്ഥം തെളിയിച്ചിരിക്കുന്നു; അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
