id: 1CO.8.2
reference: 1 Corinthians 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εἴ τις δοκεῖ ⸀ἐγνωκέναι τι, ⸀οὔπω ⸀ἔγνω καθὼς δεῖ γνῶναι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: ml
  text: താൻ എന്തെങ്കിലും അറിയുന്നുവെന്ന് ആരെങ്കിലും കരുതുന്നെങ്കിൽ,[a] അറിയേണ്ടതുപോലെ അയാൾ ഇനിയും അറിഞ്ഞിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “താൻ എന്തെങ്കിലും അറിഞ്ഞുകഴിഞ്ഞുവെന്ന് ആരെങ്കിലും കരുതുന്നെങ്കിൽ, അറിയേണ്ട വിധത്തിൽ അയാൾ ഇനിയും അറിഞ്ഞിട്ടില്ല.”'
    reason: ἐγνωκέναι എന്ന പൂർണകാലരൂപത്തിന്റെയും καθὼς എന്ന രീതിസൂചനയുടെയും കൂടുതൽ രൂപപരമായ വിവർത്തനം.
lexical_decisions:
- source_word: εἴ τις
  choice: ആരെങ്കിലും ... എങ്കിൽ
  rationale: ഗ്രീക്കിലെ പൊതുവായ അനിശ്ചിത ഏകവചനത്തെയും വ്യവസ്ഥാപക അർഥത്തെയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δοκεῖ
  choice: കരുതുന്നെങ്കിൽ
  rationale: ഇവിടെ വെറും തോന്നലല്ല, സ്വന്തം അറിവിനെക്കുറിച്ചുള്ള വ്യക്തിയുടെ വിലയിരുത്തലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐγνωκέναι τι
  choice: താൻ എന്തെങ്കിലും അറിയുന്നുവെന്ന്
  rationale: പൂർണകാല ക്രിയ സൂചിപ്പിക്കുന്ന അറിവ് നേടിയിരിക്കുന്ന അവസ്ഥ മലയാളത്തിലെ സ്വാഭാവിക വർത്തമാനപ്രയോഗത്തിലൂടെ നൽകുന്നു; τι എന്നതിന്റെ അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: οὔπω ἔγνω
  choice: ഇനിയും അറിഞ്ഞിട്ടില്ല
  rationale: οὔπωയുടെ ‘ഇതുവരെ അല്ല’ എന്ന കാലസൂചനയും അറിവിന്റെ അപൂർണാവസ്ഥയും വ്യക്തമായി നൽകുന്നു.
- source_word: καθὼς δεῖ γνῶναι
  choice: അറിയേണ്ടതുപോലെ
  rationale: അറിവിന്റെ ആവശ്യമായ രീതിയോ മാനദണ്ഡമോ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വിമർശനത്തിന്റെ സ്വഭാവം
  choice: അറിവിനെ മുഴുവനായി നിഷേധിക്കാതെ, അറിയേണ്ട രീതിയിലുള്ള കുറവ് ചൂണ്ടിക്കാണിക്കുന്നു
  alternative: മനുഷ്യന് യാതൊരു അറിവുമില്ലെന്ന സമ്പൂർണ നിഷേധം
  rationale: ‘അറിയേണ്ടതുപോലെ’ എന്ന മാനദണ്ഡവാക്യം വിമർശനം ആത്മവിശ്വാസപൂർണമായ സ്വയംവിലയിരുത്തലിനും അപൂർണമായ അറിവിനുമാണെന്ന് സൂചിപ്പിക്കുന്നു.
- issue: τι എന്നതിന്റെ പരിധി
  choice: എന്തെങ്കിലും
  alternative: ഒരു കാര്യം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പൊതുവായ അനിശ്ചിതത്വം നിലനിർത്തുകയും പ്രസ്താവനയെ പ്രത്യേക വിഷയത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അയാൾ’ ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; τις എന്ന പൊതുവായ ഏകവചനത്തിന്റെ പിന്തുടർച്ച വ്യക്തമാക്കാനാണ് ഉപയോഗിച്ചത്.
