source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: ml
  text: എന്തെന്നാൽ, നിന്റെ അറിവുമൂലം ബലഹീനനായവൻ—ആർക്കുവേണ്ടി മശീഹ മരിച്ചുവോ ആ സഹോദരൻ[b][c]—നശിച്ചുപോകുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നശിക്കുന്നു’ അല്ലെങ്കിൽ ‘തകർന്നുപോകുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദത്തിന് ഗുരുതരമായ നാശമോ തകർച്ചയോ സൂചിപ്പിക്കാം; ഇത് ഇപ്പോഴത്തെ ആത്മീയ തകർച്ചയെയാണോ അന്തിമനാശത്തെയാണോ രണ്ടിനെയുമാണോ ഉദ്ദേശിക്കുന്നതെന്ന് ഇവിടെ തീർപ്പാക്കുന്നില്ല.
    reason: alternative_reading
  - marker: b
    text: ‘സഹോദരൻ’ ഇവിടെ ഒരു സഹവിശ്വാസിയെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പ്രയോഗം വിശ്വാസത്തിലുള്ള സഹോദരനെയോ സഹോദരിയെയോ ഉൾക്കൊള്ളാം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തോസ്’; ഇവിടെ അത് ഒരു പദവിയായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: നശിപ്പിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള പാസീവ് രൂപത്തിന്റെ ഗൗരവവും തുടരുന്ന/സംഭവിക്കുന്ന നാശത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു. ഇത് അന്തിമനാശമാണോ ഇപ്പോഴത്തെ ആത്മീയ തകർച്ചയാണോ എന്ന് മുഖ്യപാഠം തീർപ്പാക്കുന്നില്ല.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന്റെ കാരണം അല്ലെങ്കിൽ വിശദീകരണം അവതരിപ്പിക്കുന്ന ബന്ധകമായി സ്വാഭാവികമാണ്.
- source_word: ὁ ἀσθενῶν
  choice: ബലഹീനനായവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കർത്തൃപ്രത്യയത്തിന്റെ ഏകവചന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഇവിടെ തന്നെ ‘സഹോദരൻ’ ചേർത്ത് ആവർത്തനം മായ്ക്കുന്നില്ല.
- source_word: ἐν τῇ σῇ γνώσει
  choice: നിന്റെ അറിവുനിമിത്തം
  rationale: ἐν ഇവിടെ അറിവുമായി ബന്ധപ്പെട്ട കാരണപരമായോ ഉപാധിപരമായോ ഉള്ള ബന്ധം സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘നിമിത്തം’ ആ കുറ്റപ്പെടുത്തലിന്റെ ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γνῶσις
  choice: അറിവ്
  rationale: അധ്യായത്തിലെ ആവർത്തിതമായ പൗലോസിന്റെ പദപ്രയോഗവും, സ്നേഹമില്ലാതെ പ്രയോഗിക്കുന്ന ‘അറിവ്’ മറ്റൊരാളെ ഹാനിപ്പെടുത്തുന്നു എന്ന വിരോധാഭാസവും നിലനിർത്തുന്നു.
- source_word: ὁ ἀδελφός
  choice: ആ സഹോദരൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനരൂപം നിലനിർത്തുന്നു. വിശ്വാസസഹോദരൻ എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δι’ ὃν
  choice: ആ സഹോദരനുവേണ്ടിയാണ്
  rationale: διά + accusative ഇവിടെ ‘ആർക്കുവേണ്ടി’ എന്ന ഗുണഭോക്തൃ/പ്രതിനിധി ബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; വെറും വ്യക്തിനാമമായി ചുരുക്കിയിട്ടില്ല.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: അയോറിസ്റ്റ് ഇൻഡിക്കേറ്റീവിന്റെ പൂർത്തിയായ ചരിത്രസംഭവം മലയാളത്തിലെ ലളിത ഭൂതകാലം നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀπόλλυται യഥാർഥ വിശ്വാസിയുടെ അന്തിമ നിത്യനാശം നിർബന്ധമായി സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: മുഖ്യപാഠത്തിൽ ‘നശിപ്പിക്കപ്പെടുന്നു’ എന്നു നൽകി, അതിന്റെ പരിധി നിർവചിക്കാതെ വെച്ചു.
  alternative: ‘തകർന്നുപോകുന്നു’ അല്ലെങ്കിൽ ‘നശിക്കുന്നു’
  rationale: ക്രിയയ്ക്ക് കഠിനമായ നാശം/തകർച്ച സൂചിപ്പിക്കാനാകുന്നു. എന്നാൽ സന്ദർഭം ഇപ്പോഴത്തെ ആത്മീയ ഹാനിയെയും മനസ്സാക്ഷിക്കേറ്റ ക്ഷതത്തെയും മുൻനിർത്തുന്നു. അതിനാൽ അന്തിമവിധിയെയോ താൽക്കാലിക ആത്മീയ തകർച്ചയെയോ മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: ἀδελφός ലിംഗനിരപേക്ഷമായി മുഖ്യപാഠത്തിൽ നൽകണമോ
  choice: ‘സഹോദരൻ’ എന്ന പുല്ലിംഗ ഏകവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘സഹവിശ്വാസി’ അല്ലെങ്കിൽ ‘സഹോദരനോ സഹോദരിയോ’
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ പ്രയോഗം വിശ്വാസത്തിലുള്ള സഹോദരിയെയും ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ പറയുന്നു.
- issue: Χριστός വ്യക്തിനാമമായോ പദവിയായോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘മശീഹ’ എന്ന പദവിയായി നൽകി.
  alternative: ‘ക്രിസ്തു’
  rationale: ഈ വാക്യത്തിൽ വീണ്ടെടുപ്പിനായുള്ള മരണത്തെ ഊന്നുന്നതിനാൽ അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ ശക്തി പ്രസക്തമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിന്റെ’ എന്ന ഏകവചനരൂപം മൂലത്തിലെ σῇ എന്ന ഏകവചനത്തെ നിലനിർത്തുന്നു. വാക്യാവസാനത്തിലെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘മശീഹ മരിച്ചത് ആ സഹോദരനുവേണ്ടിയാണ്’ എന്ന കേന്ദ്രീകൃത ഘടന ഉപയോഗിച്ചു.
