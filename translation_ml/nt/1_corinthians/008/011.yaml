revisions:
- from: എന്തെന്നാൽ, നിന്റെ അറിവുനിമിത്തം ബലഹീനനായവൻ നശിപ്പിക്കപ്പെടുന്നു[a]—മശീഹ മരിച്ചത് ആ സഹോദരനുവേണ്ടിയാണ്[b][c].
  to: എന്തെന്നാൽ, നിന്റെ അറിവുമൂലം ബലഹീനനായവൻ—ആർക്കുവേണ്ടി മശീഹ മരിച്ചുവോ ആ സഹോദരൻ[b][c]—നശിച്ചുപോകുന്നു[a].
  rationale: 'The revision removes the unnecessarily explicit agentive passive, while retaining the serious and intentionally unresolved force of ἀπόλλυται. It also restores the Greek apposition: the weak person who is perishing is the brother for whom Messiah died. All original footnote anchors are retained and placed with their respective terms.'
  reviewer_model: gpt-5.6-terra
