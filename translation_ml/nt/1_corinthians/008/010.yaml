id: 1CO.8.10
reference: 1 Corinthians 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: ml
  text: കാരണം, അറിവുള്ള നിന്നെ ഒരാൾ വിഗ്രഹക്ഷേത്രത്തിൽ ഭക്ഷണത്തിന് ചാരിക്കിടക്കുന്നതായി കണ്ടാൽ, ബലഹീനനായ ആ വ്യക്തിയുടെ മനസ്സാക്ഷി വിഗ്രഹങ്ങൾക്കു ബലിയർപ്പിച്ചവ കഴിക്കാൻ പടുത്തുയർത്തപ്പെടുകയില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ധൈര്യപ്പെടുക.” ഗ്രീക്കിൽ അക്ഷരാർഥം “പടുത്തുയർത്തപ്പെടുക” എന്നാണ്; ആത്മികവർധനയെക്കുറിച്ച് പൗലോസ് പതിവായി ഉപയോഗിക്കുന്ന ഭാഷ ഇവിടെ വിരോധാഭാസത്തോടെ പ്രയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ മുന്നറിയിപ്പിന് കാരണമോ വിശദീകരണമോ നൽകുന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: സാങ്കൽപ്പികവും അനിശ്ചിതവുമായ ഏകവചന വ്യക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἴδῃ
  choice: കണ്ടാൽ
  rationale: ἐὰν സഹിതമുള്ള സോപാധിക പ്രയോഗത്തിന്റെ ഭാവിസാധ്യത മലയാളത്തിലെ സ്വാഭാവിക നിബന്ധനാരൂപത്തിൽ നൽകുന്നു.
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: അറിവുള്ള നീ
  rationale: അഭിസംബോധനയുടെ ഊന്നലും അറിവ് എന്ന സ്വഭാവവിശേഷണവും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: γνῶσιν
  choice: അറിവ്
  rationale: 1 കൊരിന്ത്യർ 8-ലെ പ്രമേയപരമായ പദബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: ἐν εἰδωλείῳ
  choice: വിഗ്രഹക്ഷേത്രത്തിൽ
  rationale: വിഗ്രഹാരാധനയുമായി ബന്ധപ്പെട്ട ക്ഷേത്രമോ ആരാധനാസ്ഥലമോ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: κατακείμενον
  choice: ഭക്ഷണത്തിനിരിക്കുന്നതു
  rationale: വിരുന്നിൽ ചാരിക്കിടന്ന് ഭക്ഷണം കഴിക്കുന്ന പുരാതന ഭാവം വാക്കുതോറും അനുകരിക്കാതെ, ഭക്ഷണസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐχὶ
  choice: പടുത്തുയർത്തപ്പെടുകയില്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἡ συνείδησις αὐτοῦ
  choice: അവന്റെ മനസ്സാക്ഷി
  rationale: കാണുന്ന ബലഹീന വ്യക്തിയുടെ നൈതികബോധത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἀσθενοῦς ὄντος
  choice: ബലഹീനനായ
  rationale: ബലഹീനത മനസ്സാക്ഷിയുമായി ബന്ധപ്പെട്ട വ്യക്തിയുടെ അവസ്ഥയാണെന്നത് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: οἰκοδομηθήσεται
  choice: പടുത്തുയർത്തപ്പെടുക
  rationale: പൗലോസിന്റെ പതിവ് ആത്മികവർധനാ പദപ്രയോഗം ഇവിടെ വിരോധാഭാസത്തോടെ ഉപയോഗിക്കുന്നതിലെ സംഘർഷം സംരക്ഷിക്കുന്നു; സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: വിഗ്രഹങ്ങൾക്ക് അർപ്പിച്ച ഭക്ഷണം കഴിക്കാൻ
  rationale: ഫലമോ പ്രവണതയോ സൂചിപ്പിക്കുന്ന ഘടനയെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദോഷകരമായ അനുകരണത്തിന്റെ സന്ദർഭത്തിൽ οἰκοδομηθήσεται എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: പടുത്തുയർത്തപ്പെടുക
  alternative: ധൈര്യപ്പെടുക / പ്രേരിതനാകുക
  rationale: ഗ്രീക്കിൽ പൗലോസ് സാധാരണയായി ആത്മികവർധനയ്ക്കുപയോഗിക്കുന്ന പദം ഇവിടെ സാധ്യതയുള്ള വിരോധാഭാസത്തോടെ ഉപയോഗിക്കുന്നു. അതിനെ വ്യാഖ്യാനപരമായി മിനുക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുകയും പ്രായോഗിക അർഥം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. അലങ്കാരചോദ്യം, ‘അറിവ്’ എന്ന പ്രമേയപദം, ‘പടുത്തുയർത്തപ്പെടുക’ എന്ന വിരോധാഭാസപരമായ ഭാഷ എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
