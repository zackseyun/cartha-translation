  terminology: «അറിവ്», «മനസ്സാക്ഷി», «വിഗ്രഹക്ഷേത്രം», and «പടുത്തുയർത്തപ്പെടുക» appropriately preserve the key terminology. «പടുത്തുയർത്തപ്പെടുക» retains Paul’s edification vocabulary and its likely irony; the footnote supplies the contextual alternative without making it the main-text interpretation.
