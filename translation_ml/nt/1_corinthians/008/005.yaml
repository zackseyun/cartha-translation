    rationale: λεγόμενοι marks beings as designated/called gods; quotation marks add an editorial visual signal that may over-specify the degree of irony or denial. The wording ‘ദേവന്മാർ എന്നു വിളിക്കപ്പെടുന്നവർ’ already carries the source expression naturally.
