source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: ml
  text: കാരണം, സ്വർഗ്ഗത്തിലായാലും ഭൂമിയിലായാലും ദേവന്മാർ എന്നു വിളിക്കപ്പെടുന്നവർ ഉണ്ടെങ്കിൽത്തന്നെ—വാസ്തവത്തിൽ അനേകം ദേവന്മാരും അനേകം കർത്താക്കന്മാരും ഉണ്ടല്ലോ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താക്കന്മാർ’ എന്നത് സാധാരണയായി ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്ന അതേ ഗ്രീക്ക് പദത്തിന്റെ ബഹുവചനമാണ്. ഇവിടെ ആളുകൾ ആ പദവിയിൽ അംഗീകരിക്കുന്ന അനേകം സത്തകളെയോ ശക്തികളെയോ ആണ് സൂചിപ്പിക്കുന്നത്; 6-ാം വാക്യത്തിലെ ഏക കർത്താവിനെയല്ല.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ γὰρ
  choice: കാരണം
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; καί നൽകുന്ന ഊന്നൽ തുടർന്നുള്ള concessive പ്രയോഗത്തിൽ പ്രതിഫലിക്കുന്നു.
- source_word: εἴπερ
  choice: ഉണ്ടെങ്കിൽത്തന്നെ
  rationale: വാദത്തിനുവേണ്ടി ഒരു കാര്യം സമ്മതിച്ചുകൊടുക്കുന്ന ശക്തിപ്പെടുത്തിയ നിബന്ധനാഭാവം നിലനിർത്തുന്നു.
- source_word: λεγόμενοι θεοὶ
  choice: “ദേവന്മാർ” എന്നു വിളിക്കപ്പെടുന്നവർ
  rationale: പങ്കാളിപദത്തിന്റെ അടിസ്ഥാന അർഥമായ designation സംരക്ഷിക്കുകയും ഉദ്ധരണിച്ചിഹ്നങ്ങളിലൂടെ പൗലോസിന്റെ അകലം സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ‘ദേവന്മാർ എന്നു പറയപ്പെടുന്നവർ’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: ആകാശത്തിലായാലും ഭൂമിയിലായാലും
  rationale: രണ്ടു മേഖലകളെയും ഉൾക്കൊള്ളുന്ന സമാന്തര ഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὥσπερ
  choice: വാസ്തവത്തിൽ … ഉണ്ടല്ലോ
  rationale: പരാമർശത്തെ സ്ഥിരീകരിക്കുന്ന ഭാവം മലയാളത്തിലെ ‘വാസ്തവത്തിൽ’ എന്നും ‘ഉണ്ടല്ലോ’ എന്നും ചേർത്ത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θεοὶ πολλοὶ
  choice: അനേകം ദേവന്മാർ
  rationale: ആളുകൾ ദൈവികരായി അംഗീകരിക്കുന്ന പലരെയോ ശക്തികളെയോ സൂചിപ്പിക്കുന്ന ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: κύριοι πολλοί
  choice: അനേകം കർത്താക്കന്മാർ
  rationale: κύριος എന്ന പദത്തിന്റെ മതപരമായ പ്രതിധ്വനി നിലനിർത്തിക്കൊണ്ട്, 6-ാം വാക്യത്തിലെ ഏക കർത്താവിൽനിന്ന് ബഹുവചനംകൊണ്ട് വേർതിരിക്കുന്നു.
theological_decisions:
- issue: വിജാതീയ ദേവതകളോടുള്ള പൗലോസിന്റെ വാചകപരമായ അകലം
  choice: λεγόμενοι θεοὶ എന്നത് ഉദ്ധരണിച്ചിഹ്നങ്ങളോടെ ‘“ദേവന്മാർ” എന്നു വിളിക്കപ്പെടുന്നവർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ദേവന്മാർ എന്നു പറയപ്പെടുന്നവർ’ അല്ലെങ്കിൽ ‘ദേവന്മാർ എന്നു വിളിക്കപ്പെടുന്നവർ’ (ഉദ്ധരണിച്ചിഹ്നങ്ങളില്ലാതെ)
  rationale: ഗ്രീക്ക് പദം ‘വിളിക്കപ്പെടുന്ന’ എന്നും സന്ദർഭത്തിൽ ‘ദേവന്മാർ എന്നു പറയപ്പെടുന്ന’ എന്ന അകലം പുലർത്തുന്ന അർഥത്തിലും വരാം. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ ഏകദൈവവിശ്വാസപരമായ അകലം സൂചിപ്പിക്കുമ്പോഴും ഇവർ യാതൊരു വിധത്തിലും നിലവിലില്ലെന്ന വ്യാഖ്യാനം വാക്യത്തിൽ നിർബന്ധിച്ച് ചേർക്കുന്നില്ല.
- issue: പല κύριοι-കളെയും 6-ാം വാക്യത്തിലെ ഏക കർത്താവിനെയും വേർതിരിക്കൽ
  choice: ബഹുവചനമായി ‘കർത്താക്കന്മാർ’ ഉപയോഗിച്ചു.
  alternative: ‘യജമാനന്മാർ’ അല്ലെങ്കിൽ ‘പ്രഭുക്കന്മാർ’
  rationale: ‘കർത്താക്കന്മാർ’ κύριος എന്ന പദവിയുടെ മതപരവും അധികാരപരവുമായ ഭാവം നിലനിർത്തുന്നു; അതേസമയം ബഹുവചനം ഇവരെ ഏക സത്യകർത്താവിനോട് സമീകരിക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
- issue: ‘അനേകം ദേവന്മാരും അനേകം കർത്താക്കന്മാരും ഉണ്ട്’ എന്ന പ്രസ്താവനയുടെ താത്വിക സംഘർഷം
  choice: പ്രസ്താവനയെ ‘വാസ്തവത്തിൽ … ഉണ്ടല്ലോ’ എന്ന നേരിട്ടുള്ള രൂപത്തിൽ നിലനിർത്തി.
  alternative: ‘ദേവന്മാർ എന്നും കർത്താക്കന്മാർ എന്നും കരുതപ്പെടുന്നവർ അനേകരുണ്ട്’
  rationale: പര്യായം പൗലോസിന്റെ വാക്കുകളെ വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കും. മൂലപാഠത്തിന്റെ യഥാർഥമായ വാചകസംഘർഷവും അടുത്ത വാക്യത്തിലേക്കുള്ള വിരോധാഭാസപരമായ നീക്കവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. λεγόμενοι എന്നതിന്റെ ‘വിളിക്കപ്പെടുന്ന/പറയപ്പെടുന്ന’ വ്യത്യാസം മുഖ്യപാഠത്തിൽ സ്വാഭാവികമായി കൈകാര്യം ചെയ്തതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല; നൽകിയ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
