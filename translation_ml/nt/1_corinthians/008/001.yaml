    rationale: Bare ‘വീർപ്പിക്കുന്നു’ is understandable but less natural for the metaphorical sense of φυσιοῖ. ‘വീർപ്പിച്ചുകളയുന്നു’ more clearly communicates the figurative, adverse effect while retaining the image.
