source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: ml
  text: 'വിഗ്രഹങ്ങൾക്ക് ബലിയർപ്പിച്ച ഭക്ഷണത്തെക്കുറിച്ച്[a]: നമുക്കെല്ലാവർക്കും അറിവുണ്ടെന്നു നാം അറിയുന്നു[b]. അറിവ് വീർപ്പിച്ചുകളയുന്നു; എന്നാൽ സ്നേഹം പണിതുയർത്തുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിഗ്രഹങ്ങൾക്ക് ബലിയർപ്പിച്ച മാംസം’ അല്ലെങ്കിൽ ‘വിഗ്രഹങ്ങൾക്ക് ബലിയർപ്പിച്ച വസ്തുക്കൾ.’
    reason: lexical_alternative
  - marker: b
    text: ‘നമുക്കെല്ലാവർക്കും അറിവുണ്ട്’ എന്ന വാക്കുകളിൽ പൗലോസ് കൊരിന്ത്യരുടെ ഒരു മുദ്രാവാക്യം പ്രതിധ്വനിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: —യെക്കുറിച്ച്
  rationale: ഒരു പുതിയ വിഷയം അവതരിപ്പിക്കുന്ന ലേഖനപരമായ സംക്രമണം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഉറവിടത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: τῶν εἰδωλοθύτων
  choice: വിഗ്രഹങ്ങൾക്ക് ബലിയർപ്പിച്ച ഭക്ഷണം
  rationale: വിഗ്രഹാരാധനയിൽ അർപ്പിച്ച വസ്തുക്കളെയാണ് പദം സൂചിപ്പിക്കുന്നത്; ഈ സന്ദർഭത്തിൽ അത് പ്രധാനമായും ഭക്ഷണമാണ്. ‘മാംസം’ എന്നു മാത്രം ചുരുക്കാതെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: വർത്തമാന അർഥത്തിൽ പ്രവർത്തിക്കുന്ന ക്രിയയെ നേരിട്ടും സ്വാഭാവികമായും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: നമുക്കെല്ലാവർക്കും അറിവുണ്ട്
  rationale: πάντες എന്നതിന്റെ ഉൾക്കൊള്ളുന്ന ഊന്നലും γνῶσις എന്ന പദത്തിന്റെ ആവർത്തനബന്ധവും നിലനിർത്തുന്നു; ഇത് കൊരിന്ത്യരുടെ വാദമാണോ പൗലോസിന്റെ നേരിട്ടുള്ള പ്രസ്താവനയാണോ എന്നു മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: ἡ γνῶσις
  choice: അറിവ്
  rationale: മുൻവാക്യത്തിലെ ‘അറിവ്’ എന്ന പദവുമായി വ്യക്തമായ ശബ്ദബന്ധം നിലനിർത്തുകയും പൊതുവായ അമൂർത്തനാമമായി സ്വാഭാവികമായി പ്രവർത്തിക്കുകയും ചെയ്യുന്നു.
- source_word: φυσιοῖ
  choice: വീർപ്പിക്കുന്നു
  rationale: അഹങ്കാരത്തിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ദൃശ്യമായ ‘വീർപ്പിക്കൽ’ രൂപകം വ്യാഖ്യാനിച്ച് പരത്താതെ നിലനിർത്തുന്നു.
- source_word: ἡ δὲ ἀγάπη
  choice: എന്നാൽ സ്നേഹം
  rationale: വൈരുധ്യം വ്യക്തമായി നൽകുകയും ἀγάπηയെ സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ ‘സ്നേഹം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: οἰκοδομεῖ
  choice: പണിതുയർത്തുന്നു
  rationale: കെട്ടിടനിർമാണത്തിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട് ആധുനിക വായനക്കാർക്ക് മനസ്സിലാകുന്ന സ്വാഭാവിക ഭാഷ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: πάντες (‘എല്ലാവരും’) എന്നത് നിബന്ധനയില്ലാത്ത പൊതുപ്രസ്താവനയാണോ കൊരിന്ത്യരുടെ ഒരു വാദത്തെ പൗലോസ് ഉൾപ്പെടുത്തി പറയുന്നതാണോ
  choice: ‘നമുക്കെല്ലാവർക്കും അറിവുണ്ടെന്ന് നമുക്കറിയാം’ എന്നു മുഖ്യപാഠത്തിൽ യോഗ്യത ചേർക്കാതെ നൽകി
  alternative: ഉദ്ധരണിച്ചിഹ്നങ്ങളോടെ ‘നമുക്കെല്ലാവർക്കും അറിവുണ്ട്’ എന്ന കൊരിന്ത്യൻ മുദ്രാവാക്യമായി പ്രകടമായി അടയാളപ്പെടുത്തുക
  rationale: ഗ്രീക്ക് പാഠത്തിൽ വ്യക്തമായ ഉദ്ധരണിച്ചിഹ്നമോ അകലം പാലിക്കുന്ന സൂചനയോ ഇല്ല. അതിനാൽ മുഖ്യപാഠം അവ്യക്തത സംരക്ഷിക്കുന്നു; സാധ്യത അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വീർപ്പിക്കുന്നു’, ‘പണിതുയർത്തുന്നു’ എന്നീ സമാന്തര ക്രിയകൾ മൂലപാഠത്തിലെ രണ്ടു രൂപകങ്ങളും അവയുടെ മൂർച്ചയുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
