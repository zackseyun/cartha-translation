- from: ഇങ്ങനെ സഹോദരന്മാരോടു[a] പാപം ചെയ്യുകയും അവരുടെ ബലഹീനമായ മനസ്സാക്ഷിയെ മുറിപ്പെടുത്തുകയും ചെയ്യുമ്പോൾ, നിങ്ങൾ മശീഹായോടു[b] പാപം ചെയ്യുന്നു.
