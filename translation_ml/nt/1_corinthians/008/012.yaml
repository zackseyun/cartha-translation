id: 1CO.8.12
reference: 1 Corinthians 8:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: ml
  text: ഇങ്ങനെ സഹോദരന്മാർക്കെതിരെ[a] പാപം ചെയ്യുകയും അവരുടെ ബലഹീനമായ മനസ്സാക്ഷിയെ മുറിപ്പെടുത്തുകയും ചെയ്യുന്നതിലൂടെ, നിങ്ങൾ മശീഹാവിനെതിരെ[b] പാപം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നത് സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തുവിനെതിരെ.’ ഗ്രീക്ക് പദം Χριστός ആണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: ഇങ്ങനെ
  rationale: οὕτως മുൻസന്ദർഭത്തിൽ വിവരിച്ച രീതിയിലേക്കു വിരൽചൂണ്ടുന്നു. δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, വാദത്തിന്റെ തുടർച്ചയാണ്; മലയാളത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെ ‘ഇങ്ങനെ’ എന്നു പറയുന്നത് സ്വാഭാവികമാണ്.
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: സഹോദരന്മാരോടു പാപം ചെയ്യുകയും
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യക്രിയയോടൊപ്പമുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു. εἰς ഇവിടെ ഒരാൾക്കെതിരായ പാപത്തിന്റെ ദിശ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘-ഓടു പാപം ചെയ്യുക’ സ്വാഭാവികമായി അതേ ബന്ധം നൽകുന്നു.
- source_word: τύπτοντες
  choice: മുറിപ്പെടുത്തുകയും
  rationale: τύπτω എന്നതിന്റെ അക്ഷരാർഥം ‘അടിക്കുക’ എന്നാണെങ്കിലും ഇവിടെ മനസ്സാക്ഷിയെ സംബന്ധിച്ച രൂപകാലങ്കാരപ്രയോഗമാണ്. ‘മുറിപ്പെടുത്തുക’ അതിന്റെ ദോഷകരവും വേദനിപ്പിക്കുന്നതുമായ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: അവരുടെ ബലഹീനമായ മനസ്സാക്ഷിയെ
  rationale: ഗ്രീക്കിൽ ‘മനസ്സാക്ഷി’ ഏകവചനത്തിലും αὐτῶν ബഹുവചനത്തിലും വരുന്നു; മലയാളത്തിലും ഈ വിതരണാർഥമുള്ള ഏകവചനം വ്യക്തവും സ്വാഭാവികവുമാണ്. ἀσθενοῦσαν എന്ന വർത്തമാന കൃദന്തം വിശേഷണരൂപത്തിൽ നൽകി.
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: നിങ്ങൾ മശീഹായോടു പാപം ചെയ്യുന്നു
  rationale: εἰς വീണ്ടും വിരുദ്ധദിശയിലുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു. Χριστός എന്ന അഭിഷിക്തപദവിയുടെ അർഥം നിലനിർത്താൻ ‘മശീഹാ’ ഉപയോഗിച്ചു; വർത്തമാനകാല ἁμαρτάνετε ‘പാപം ചെയ്യുന്നു’ എന്നു നൽകി.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിലെ ἀδελφοὺς എന്ന പദത്തിന്റെ പരിധി
  choice: സഹോദരന്മാർ
  alternative: സഹവിശ്വാസികൾ / സഹോദരീസഹോദരന്മാർ
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ രൂപസാദൃശ്യം നിലനിർത്തി. എന്നാൽ സന്ദർഭത്തിൽ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന സഹവിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കാവുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: Χριστός എന്ന പദവിയുടെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ അഭിഷിക്തനായ കർത്താവിനെതിരായ പാപമാണ് പ്രസ്താവിക്കുന്നത്; അതിനാൽ പദവിയുടെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹാ’ നിലനിർത്തി. മലയാളത്തിൽ പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്കിലെ കൃദന്തരൂപങ്ങളുടെ ബന്ധം മലയാളത്തിൽ ‘ചെയ്യുകയും… ചെയ്യുമ്പോൾ’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കി; മുഖ്യപ്രസ്താവനയുടെ ഊന്നൽ അവസാനത്തിൽ നിലനിർത്തി.
