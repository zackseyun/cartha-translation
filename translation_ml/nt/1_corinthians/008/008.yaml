source:
  edition: SBLGNT
  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: ml
  text: എന്നാൽ ഭക്ഷണം നമ്മെ ദൈവത്തോട് അടുപ്പിക്കുകയില്ല[a]; കാരണം, നാം ഭക്ഷിച്ചാലും നമുക്ക് ഒരു നേട്ടവുമില്ല, ഭക്ഷിക്കാതിരുന്നാലും നമുക്ക് ഒരു കുറവുമില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭക്ഷണം ദൈവത്തിന്റെ അംഗീകാരം നമുക്ക് നേടിത്തരുകയില്ല”; അല്ലെങ്കിൽ, “ഭക്ഷണം നമ്മെ ദൈവസന്നിധിയിൽ അവതരിപ്പിക്കുകയില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഭക്ഷിച്ചാൽ നാം മെച്ചപ്പെട്ടവരാകുന്നില്ല; ഭക്ഷിക്കാതിരുന്നാൽ മോശപ്പെട്ടവരാകുന്നതുമില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: ഭക്ഷണം
  rationale: ഒരു പ്രത്യേക മാംസത്തെയോ ഭക്ഷണവേളയെയോ അല്ല, ആഹാരത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പദം.
- source_word: παραστήσει
  choice: ദൈവസന്നിധിയിൽ കൊണ്ടുനിർത്തുകയില്ല
  rationale: παρίστημι എന്ന പദത്തിന്റെ ‘സന്നിധിയിൽ നിർത്തുക/ഹാജരാക്കുക’ എന്ന അടിസ്ഥാനരൂപം നിലനിർത്തുകയും, ഭക്ഷണം ദൈവമുമ്പാകെയുള്ള നിലയെ നിർണയിക്കുന്നില്ലെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: περισσεύομεν
  choice: നമുക്ക് കൂടുതലൊന്നും ലഭിക്കുന്നില്ല
  rationale: ഇവിടെ ഭൗതിക സമൃദ്ധിയേക്കാൾ നേട്ടമോ അധികമോ ഉണ്ടാകുന്നതാണ് ആശയം; തുടർന്നുള്ള ‘കുറവ്’ എന്ന വിരുദ്ധപദവുമായി സമാന്തരത പാലിക്കുന്നു.
- source_word: ὑστερούμεθα
  choice: നമുക്ക് കുറവൊന്നും വരുന്നതുമില്ല
  rationale: കുറവുണ്ടാകുക, പിന്നിലാകുക എന്ന അർഥം ലളിതമായി നൽകുകയും περισσεύομεν എന്നതിനോടുള്ള വിരുദ്ധസമാന്തരത സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ / γὰρ
  choice: എന്നാൽ / (വാക്യഘടനയിലൂടെ വിശദീകരണം)
  rationale: δὲ-യുടെ മൃദുവായ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് വ്യക്തമാക്കുന്നു. γὰρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ തുടർവാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നതിനാൽ പ്രത്യേകം ‘കാരണം’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ഭക്ഷണം ദൈവമുമ്പാകെയുള്ള അംഗീകാരത്തെയാണോ, സമീപ്യതയെയാണോ, പൊതുവായ ആത്മീയ നേട്ടത്തെയാണോ ബാധിക്കാത്തത്
  choice: ‘ദൈവസന്നിധിയിൽ കൊണ്ടുനിർത്തുകയില്ല’ എന്ന് പരിഭാഷപ്പെടുത്തി അടിസ്ഥാനപരമായ അവതരണ/സന്നിധി രൂപകം നിലനിർത്തി.
  alternative: ‘ദൈവത്തിന്റെ അംഗീകാരം നേടിത്തരുകയില്ല’ അല്ലെങ്കിൽ ‘ദൈവത്തോട് അടുപ്പിക്കുകയില്ല.’
  rationale: ഇവയിൽ ഏതെങ്കിലും ഒന്ന് മാത്രം തെരഞ്ഞെടുത്താൽ παραστήσει എന്ന പദത്തിലെ യഥാർഥ വ്യഞ്ജനപരിധി ചുരുങ്ങാം. മുഖ്യപരിഭാഷ ദൈവമുമ്പാകെയുള്ള നിലയെ സൂചിപ്പിക്കുന്നു; അടിക്കുറിപ്പ് സാധ്യമായ സന്ദർഭാർഥങ്ങൾ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ വിരുദ്ധസമാന്തരത ‘കൂടുതൽ/കുറവ്’ എന്ന ജോടിയിലൂടെ നിലനിർത്തി; വ്യാഖ്യാനപരമായ ‘മെച്ചം/മോശം’ അടിക്കുറിപ്പിലേക്ക് മാറ്റി.
