revisions:
- from: എന്നാൽ എല്ലാവർക്കും ഈ അറിവില്ല. ചിലർ ഇന്നുവരെ വിഗ്രഹവുമായുള്ള പരിചയം നിമിത്തം അതിനെ വിഗ്രഹത്തിനു ബലിയർപ്പിച്ച ഭക്ഷണമെന്ന നിലയിൽ കഴിക്കുന്നു; ബലഹീനമായ അവരുടെ മനസ്സാക്ഷി അങ്ങനെ മലിനമാകുന്നു.[a]
  to: എന്നാൽ എല്ലാവർക്കും ഈ അറിവില്ല. ചിലർ, വിഗ്രഹവുമായി ഇന്നുവരെയുള്ള പരിചയം നിമിത്തം,[a] വിഗ്രഹത്തിനു ബലിയർപ്പിച്ച ഭക്ഷണം എന്നു കരുതി കഴിക്കുന്നു; അവരുടെ മനസ്സാക്ഷി ബലഹീനമായതിനാൽ മലിനമാകുന്നു.
  rationale: The revision removes an ambiguous pronoun, improves Malayalam syntax, and preserves the source’s difficult and disputed wording in a focused footnote. ‘ഭക്ഷണം എന്നു കരുതി’ reflects ὡς εἰδωλόθυτον without implying that idols are genuine gods or resolving Paul’s ethical tension for the reader.
