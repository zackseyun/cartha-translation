reference: 1 Corinthians 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: ml
  text: എന്നാൽ എല്ലാവർക്കും ഈ അറിവില്ല. ചിലർ, വിഗ്രഹവുമായി ഇന്നുവരെയുള്ള പരിചയം നിമിത്തം,[a] വിഗ്രഹത്തിനു ബലിയർപ്പിച്ച ഭക്ഷണം എന്നു കരുതി കഴിക്കുന്നു; അവരുടെ മനസ്സാക്ഷി ബലഹീനമായതിനാൽ മലിനമാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിഗ്രഹവുമായി ഇന്നുവരെയുള്ള പരിചയം” എന്ന ഗ്രീക്ക് പ്രയോഗം വ്യാകരണപരമായും പാഠപരമായും ദുഷ്കരമാണ്. ഇതിന് കൂടുതൽ അക്ഷരാർഥത്തിൽ, “വിഗ്രഹത്തോടുള്ള ഇന്നുവരെയുള്ള പതിവ്/പരിചയം നിമിത്തം” എന്നർഥം വരാം; ഇവിടെ മുൻകാല വിഗ്രഹാരാധനയുമായുള്ള ബന്ധത്തിന്റെ സ്വാധീനമാണ് ഉദ്ദേശ്യം. ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ സ്ഥാനത്ത് “പരിചയം” എന്നതിനുപകരം “മനസ്സാക്ഷി” എന്ന വായനയോ ബന്ധപ്പെട്ട മറ്റു രൂപങ്ങളോ കാണുന്നു. മുഖ്യപാഠം SBLGNT വായന പിന്തുടരുന്നു.
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: അറിവ്
  rationale: തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ വിഗ്രഹം ഒന്നുമല്ലെന്ന തിരിച്ചറിവിനെ സൂചിപ്പിക്കുന്നു; പൗലൊസിന്റെ ആവർത്തിത പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: συνήθεια
  choice: പരിചയം
  rationale: വിഗ്രഹാരാധനയുമായുള്ള പതിവായ മുൻബന്ധത്തിന്റെ സ്വാധീനം സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ പദം; വെറും പൊതുവായ ‘ശീലം’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: ഇന്നുവരെ വിഗ്രഹവുമായുള്ള
  rationale: ദുഷ്കരമായ ഗ്രീക്ക് ഘടനയിലെ കാലസൂചനയും വിഗ്രഹത്തോടുള്ള ബന്ധവും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: εἰδωλόθυτον
  choice: വിഗ്രഹത്തിനു ബലിയർപ്പിച്ച ഭക്ഷണം
  rationale: വിഗ്രഹബലിയുമായി ബന്ധപ്പെട്ട ഭക്ഷണമെന്ന ആരാധനാപരമായ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: συνείδησις
  choice: മനസ്സാക്ഷി
  rationale: ധാർമിക ബോധത്തെ സൂചിപ്പിക്കുന്ന പൗലൊസിന്റെ പ്രയോഗത്തിനുള്ള പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἀσθενής
  choice: ബലഹീനമായ
  rationale: ഈ അധ്യായത്തിലെ ഉറപ്പില്ലാത്ത മനസ്സാക്ഷിയെക്കുറിച്ചുള്ള പൗലൊസിന്റെ സ്ഥിരമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: μολύνεται
  choice: മലിനമാകുന്നു
  rationale: മനസ്സാക്ഷിക്കുണ്ടാകുന്ന ധാർമിക അശുദ്ധി സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: വിഗ്രഹത്തിനു ബലിയർപ്പിച്ച ഭക്ഷണത്തിന്റെ നില എങ്ങനെ അവതരിപ്പിക്കണം
  choice: അതിനെ വിഗ്രഹത്തിനു ബലിയർപ്പിച്ച ഭക്ഷണമെന്ന നിലയിൽ കഴിക്കുന്നു
  alternative: വിഗ്രഹബലി കഴിക്കുന്നു
  rationale: ഇത് ഭക്ഷിക്കുന്നവരുടെ ആരാധനാപരമായ ധാരണയെ പ്രകടിപ്പിക്കുന്നു; വിഗ്രഹങ്ങൾ യഥാർഥ ദേവന്മാരാണെന്ന് പൗലൊസ് അംഗീകരിക്കുന്നുവെന്ന സൂചന നൽകുന്നില്ല. വിഗ്രഹം ഒന്നുമല്ലെങ്കിലും മനസ്സാക്ഷി മലിനമാകാം എന്ന വാക്യഭാഗത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദുഷ്കരമായ ഗ്രീക്ക് ഘടനയുടെ കാലസൂചന മുഖ്യപാഠത്തിൽ നിലനിർത്തി; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
