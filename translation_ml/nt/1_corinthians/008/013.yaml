id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഭക്ഷണം എന്റെ സഹോദരന് ഇടർച്ചയുണ്ടാക്കുന്നുവെങ്കിൽ, എന്റെ സഹോദരന് ഇടർച്ചയുണ്ടാക്കാതിരിക്കേണ്ടതിന് ഞാൻ ഇനി ഒരിക്കലും മാംസം തിന്നുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: ഭക്ഷണം
  rationale: സന്ദർഭത്തിൽ പൊതുവായി ‘ഭക്ഷണം’ എന്ന അർഥം; തുടർന്നുള്ള κρέα എന്ന പ്രത്യേക പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: ഇടർച്ചയുണ്ടാക്കുന്നു / ഇടർച്ചയുണ്ടാക്കുക
  rationale: വിശ്വാസജീവിതത്തിൽ വീഴ്ചയ്ക്കോ പാപത്തിലേക്കുള്ള തള്ളലിനോ കാരണമാകുക എന്ന രൂപകാർഥം നിലനിർത്തുന്ന പരിചിതമായ ബൈബിൾപ്രയോഗം.
- source_word: κρέα
  choice: മാംസം
  rationale: ജന്തുമാംസം എന്ന നേരിട്ടുള്ള അർഥം.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: ഒരിക്കലും ... തിന്നുകയില്ല
  rationale: ശക്തമായ നിഷേധവും കാലപരിധിയില്ലാത്ത പ്രതിജ്ഞയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘എന്നേക്കും’ എന്ന പദശഃ ആവർത്തനം മലയാളത്തിൽ അസ്വാഭാവികമാകുന്നതിനാൽ ഒഴിവാക്കി.
theological_decisions:
- issue: σκανδαλίζω എന്നതിന്റെ നൈതിക-ആത്മീയ ശക്തി
  choice: ഇടർച്ചയുണ്ടാക്കുക
  alternative: വിഷമിപ്പിക്കുക / കുറ്റബോധമുണ്ടാക്കുക
  rationale: ഇവിടെ വെറും വികാരവേദനയല്ല, സഹോദരനെ വിശ്വാസപരമായ വീഴ്ചയിലേക്കു നയിക്കുന്നതാണു സന്ദർഭം; അതിനാൽ ശക്തമായ രൂപകം സംരക്ഷിച്ചു.
- issue: εἰς τὸν αἰῶνα എന്ന കാലപ്രയോഗം
  choice: ഒരിക്കലും
  alternative: എന്നേക്കും
  rationale: വാക്യത്തിലെ emphatic οὐ μὴ-യോടൊപ്പം ഇത് ‘ഇനിയൊരിക്കലും’ എന്ന ഉറച്ച പ്രതിജ്ഞയെ സൂചിപ്പിക്കുന്നു. കാലത്തിന്റെ തത്ത്വശാസ്ത്രപരമായ നിർവചനം ഇവിടെ ഇറക്കുമതി ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും ‘ഇടർച്ചയുണ്ടാക്കുക’ എന്നു നിലനിർത്തി.
