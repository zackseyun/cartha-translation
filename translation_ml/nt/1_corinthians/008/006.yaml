id: 1CO.8.6
reference: 1 Corinthians 8:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: ml
  text: എന്നാൽ നമുക്കോ ഒരേയൊരു ദൈവമുണ്ട്—പിതാവ്; അവനിൽനിന്നാണ് സകലവും, നാം അവനുവേണ്ടിയുള്ളവരുമാണ്[b]. ഒരേയൊരു കർത്താവുണ്ട്—യേശു മിശിഹാ[a]; അവനിലൂടെയാണ് സകലവും, നാമും അവനിലൂടെയാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘യേശുക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός എന്ന പദം ‘മിശിഹാ’ എന്ന പദവിയായോ, ചില സന്ദർഭങ്ങളിൽ പേരുപോലെ ‘ക്രിസ്തു’ എന്നോ പ്രവർത്തിക്കാം.
    reason: alternative_reading
  - marker: b
    text: ‘നാം അവനുവേണ്ടിയുള്ളവരുമാണ്’ എന്നതിന് ‘നാം അവനിലേക്കാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ പ്രയോഗത്തിന് ദിശ, ലക്ഷ്യം, അല്ലെങ്കിൽ ഉദ്ദേശ്യം എന്ന അർഥം വരാം; ഇവിടെ ‘അവനുവേണ്ടി’ എന്നത് തിരഞ്ഞെടുക്കപ്പെട്ടിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘അവനിൽനിന്നാണ് സകലവും’ എന്നും ‘അവനിലൂടെയാണ് സകലവും’ എന്നും ഉള്ള സമാന്തരപ്രയോഗങ്ങൾ പിതാവിനെ സകലത്തിന്റെയും ഉറവിടമായും യേശു മിശിഹായെ മധ്യസ്ഥപ്രവർത്തകനായും വ്യത്യസ്തമായി അവതരിപ്പിക്കുന്നു. അവസാനത്തെ ‘നാമും അവനിലൂടെയാണ്’ എന്നത് ഗ്രീക്കിൽ സംക്ഷിപ്തമാണ്; അതിന്റെ അർഥം പാഠം കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’ ἡμῖν
  choice: എന്നാൽ നമുക്കോ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വൈരുധ്യം ‘എന്നാൽ’ വ്യക്തമാക്കുന്നു; ദൃഷ്ടികോണപരമായ ദത്തിവിനെ ‘നമുക്കോ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἷς θεὸς ὁ πατήρ
  choice: ഒരേയൊരു ദൈവമേയുള്ളൂ—പിതാവ്
  rationale: സംഖ്യാപരവും ഏകദൈവവിശ്വാസപരവുമായ ഊന്നൽ നിലനിർത്തി, ‘പിതാവ്’ എന്നത് ആ ഏകദൈവത്തിന്റെ നിർദ്ദിഷ്ട തിരിച്ചറിയലായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐξ οὗ τὰ πάντα
  choice: അവനിൽനിന്നാണ് സകലവും
  rationale: ἐξ ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു; ‘സകലവും’ τὰ πάντα എന്ന പ്രയോഗത്തിന്റെ സമഗ്രവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: നാം അവനുവേണ്ടിയുള്ളവരും
  rationale: εἰς ഇവിടെ ദിശ, ലക്ഷ്യം, ഉദ്ദേശ്യം എന്നിവ ഉൾക്കൊള്ളാം. ‘അവനുവേണ്ടിയുള്ളവർ’ എന്നത് ദൈവമാണ് നമ്മുടെ അന്തിമലക്ഷ്യം എന്ന ആശയം നൽകുമ്പോഴും സാധ്യതകളെ അതിയായി ചുരുക്കുന്നില്ല.
- source_word: εἷς κύριος
  choice: ഒരേയൊരു കർത്താവേയുള്ളൂ
  rationale: ‘ഒരേയൊരു ദൈവം’ എന്നതിനോടുള്ള സമാന്തരഘടനയും κύριος എന്ന പദത്തിന്റെ ശക്തമായ കർത്തൃത്വഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦς Χριστός
  choice: യേശു മശീഹാ
  rationale: ഈ വിശ്വാസപ്രഖ്യാപനഘടനയിൽ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു നൽകി; പേരുപോലെ സ്ഥിരപ്പെട്ട ‘ക്രിസ്തു’ എന്ന വായനയും അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δι’ οὗ τὰ πάντα
  choice: അവനിലൂടെയാണ് സകലവും
  rationale: ജനിതകവിഭക്തിയോടുകൂടിയ διά മാധ്യമത്തെയോ പ്രവർത്തകമാർഗത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ലൂടെ’ എന്നത് ഈ വ്യത്യാസം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: നാമും അവനിലൂടെയാണ്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ക്രിയാലോപം അതേപടി സംരക്ഷിക്കുന്നു; നമ്മുടെ സൃഷ്ടി, ജീവൻ, രക്ഷ എന്നിവയിൽ ഏതാണ് പ്രത്യേകമായി ഉദ്ദേശിച്ചതെന്ന് വിവർത്തനം മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഒരേയൊരു ദൈവം’ എന്നും ‘ഒരേയൊരു കർത്താവ്’ എന്നും ഉള്ള ഏകദൈവവിശ്വാസപ്രഖ്യാപനത്തിന്റെ ബന്ധം
  choice: പിതാവിനെയും യേശു മശീഹായെയും വേർതിരിച്ചുകൊണ്ടുതന്നെ, ഇരുപദപ്രയോഗങ്ങളുടെയും സമാന്തരബലവും നിലനിർത്തി.
  alternative: ‘കർത്താവ്’ എന്ന പദത്തിന്റെ ഭാരം കുറയ്ക്കുകയോ, പിൽക്കാല ത്രിത്വസൂത്രണം വാക്യത്തിലേക്ക് വിശദീകരണമായി ചേർക്കുകയോ ചെയ്യുക.
  rationale: വാക്യം പിതാവിനെ ‘അവനിൽനിന്ന്’ എന്നും യേശുവിനെ ‘അവനിലൂടെ’ എന്നും വ്യത്യസ്ത ബന്ധങ്ങളിൽ അവതരിപ്പിക്കുമ്പോഴും, ഏകദൈവവിശ്വാസത്തിന്റെ ചട്ടക്കൂടിൽ ഇരുവരെയും ശക്തമായി ഉൾക്കൊള്ളുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് തീർക്കാതെ പാഠത്തിന്റെ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: പിതാവിനെയും പുത്രനെയും സംബന്ധിക്കുന്ന വ്യത്യസ്ത പൂർവപ്രത്യയങ്ങൾ
  choice: ἐξ എന്നത് ‘നിന്ന്’, εἰς എന്നത് ‘വേണ്ടി’, διά എന്നത് ‘ലൂടെ’ എന്നു വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: διάയെ ‘മൂലം’ എന്നും εἰςയെ ‘അവനിലേക്കുള്ളവർ’ എന്നും നൽകുക.
  rationale: ഉറവിടം, ലക്ഷ്യം, മാധ്യമം എന്നീ ബന്ധങ്ങൾ പൗലൊസിന്റെ വാചകത്തിലെ പ്രധാന വ്യത്യാസങ്ങളാണ്. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കുള്ളിൽ അവയെ പരമാവധി വ്യക്തമായി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ വിശ്വാസപ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. നീണ്ട ഏകവാക്യം വായനാസൗകര്യത്തിനായി നാല് സമാന്തര ഖണ്ഡങ്ങളാക്കി; ദീർഘവിരാമങ്ങൾ തിരിച്ചറിയൽബന്ധം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
