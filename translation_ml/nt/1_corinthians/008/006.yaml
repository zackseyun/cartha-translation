revisions:
- from: എന്നാൽ നമുക്കോ ഒരേയൊരു ദൈവമേയുള്ളൂ—പിതാവ്. അവനിൽനിന്നാണ് സകലവും; നാം അവനുവേണ്ടിയുള്ളവരും. ഒരേയൊരു കർത്താവേയുള്ളൂ—യേശു മശീഹാ[a]. അവനിലൂടെയാണ് സകലവും; നാമും അവനിലൂടെയാണ്.[b]
