id: 1CO.8.3
reference: 1 Corinthians 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγαπᾷ τὸν θεόν, οὗτος ἔγνωσται ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/003.yaml
  text: But if anyone loves God[a], this one is known by him.
translation:
  language: ml
  text: എന്നാൽ ആരെങ്കിലും ദൈവത്തെ സ്നേഹിക്കുന്നുവെങ്കിൽ, ആ വ്യക്തി അവിടുത്താൽ അറിയപ്പെട്ടിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവിടുന്ന് അംഗീകരിച്ചിരിക്കുന്നു’ എന്നും ‘അവിടുത്താൽ അറിയപ്പെട്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ perfect passive രൂപം ദൈവത്താൽ അറിയപ്പെട്ടിരിക്കുന്ന നില തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: എന്നാൽ … എങ്കിൽ
  rationale: εἰയുടെ ഉപാധിപരമായ അർഥവും δέ മുൻവാക്യത്തോടു സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: ലിംഗനിരപേക്ഷമായ പൊതുവ്യാപ്തിയുള്ള അനിശ്ചിത സർവനാമത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀγαπᾷ
  choice: സ്നേഹിക്കുന്നുവെങ്കിൽ
  rationale: വർത്തമാനകാല സജീവക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ ‘സ്നേഹിക്കുക’ നിലനിർത്തുകയും εἰയോടു ചേർന്ന ഉപാധിഘടന വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: ക്രിയയുടെ കർമമായി വരുന്ന നിർദിഷ്ട ദൈവപരാമർശത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οὗτος
  choice: ആ വ്യക്തി
  rationale: മുമ്പ് പറഞ്ഞ വ്യക്തിയിലേക്കു ഊന്നലോടെ വിരൽചൂണ്ടുന്ന demonstrative സ്വഭാവം നിലനിർത്തുന്നു; ‘അവൻ’ എന്ന ലിംഗസൂചന ഒഴിവാക്കുന്നു.
- source_word: ἔγνωσται
  choice: അറിയപ്പെട്ടിരിക്കുന്നു
  rationale: γινώσκωയുടെ perfect passive രൂപം സൂചിപ്പിക്കുന്ന, മുൻപ്രവൃത്തിയുടെ ഫലമായി തുടരുന്ന ഇപ്പോഴത്തെ അവസ്ഥയെ ഔപചാരികവും ഗ്രാഹ്യവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὑπ’ αὐτοῦ
  choice: അവിടുത്താൽ
  rationale: സർവനാമം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ദൈവത്തെക്കുറിച്ചുള്ള ആദരസൂചക മലയാളപ്രയോഗം ഉപയോഗിച്ചുകൊണ്ട് passive agent വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രസ്താവനയിലെ ദൈവിക ‘അറിയൽ’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അവിടുത്താൽ അറിയപ്പെട്ടിരിക്കുന്നു’ എന്ന വിശാലമായ ബന്ധപരമായ പ്രയോഗം
  alternative: ‘അവിടുന്ന് അംഗീകരിച്ചിരിക്കുന്നു’ / ‘അവിടുത്തെ രക്ഷാകരമായ അറിവിൽ ഉൾപ്പെട്ടിരിക്കുന്നു’
  rationale: ദൈവം കർത്താവായുള്ള γινώσκω കേവലമായ വിവരജ്ഞാനത്തേക്കാൾ ബന്ധപരമായ അറിവോ അംഗീകാരമോ സൂചിപ്പിക്കാം. എന്നാൽ ഗ്രീക്ക് പാഠം ഇവയിൽ ഒന്നായി അർഥം ചുരുക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ വ്യാപ്തിയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആ വ്യക്തി’ എന്നത് ഗ്രീക്കിലെ οὗτος എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നതിനൊപ്പം അനാവശ്യമായ ലിംഗസൂചന ഒഴിവാക്കുന്നു; ‘അവിടുത്താൽ’ ദൈവപരാമർശത്തിന് യോജിച്ച ആദരസൂചക രൂപമാണ്.
