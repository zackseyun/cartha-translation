source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: ml
  text: അങ്ങനെയുള്ളവനെ ജഡത്തിന്റെ നാശത്തിനായി[a] സാത്താനു കൈമാറുക; അങ്ങനെ കർത്താവിന്റെ ദിവസത്തിൽ[b] ആത്മാവ് രക്ഷിക്കപ്പെടേണ്ടതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ജഡത്തിന്റെ തകർച്ചയ്ക്കായി.’ ഈ പ്രയോഗം കടുത്ത ശാരീരിക ശിക്ഷാവിധിയെ സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ ആ മനുഷ്യന്റെ ജഡികവും പാപാഭിമുഖവുമായ പ്രവണതയുടെ നശീകരണത്തെ ആലങ്കാരികമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘കർത്താവിന്റെ’ എന്നതിനുപകരം ‘നമ്മുടെ കർത്താവായ യേശുവിന്റെ’ എന്നോ ‘കർത്താവായ യേശുവിന്റെ’ എന്നോ കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: കൈയിൽ ഏൽപ്പിക്കണം
  rationale: സഭ ചെയ്യേണ്ട നടപടിയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കൈമാറിക്കൊടുക്കുക’ എന്ന മൂലാർഥത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
- source_word: τὸν τοιοῦτον
  choice: അങ്ങനെയുള്ളവനെ
  rationale: പ്രത്യേക കുറ്റക്കാരനെ സൂചിപ്പിക്കുന്നതോടൊപ്പം ഗ്രീക്കിലെ വർഗീകരണസ്വരവും നിലനിർത്തുന്നു; ലിംഗം അനാവശ്യമായി കൂടുതൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: Σατανᾷ
  choice: സാത്താന്റെ കൈയിൽ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപത്തിൽ നൽകുന്നു; παραδίδωμι എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമായ പ്രയോഗമാണിത്.
- source_word: εἰς ὄλεθρον
  choice: നാശത്തിനായി
  rationale: ὄλεθρος സൂചിപ്പിക്കുന്ന കടുത്ത നാശം/തകർച്ച നിലനിർത്തുന്നു; അതിന്റെ കൃത്യമായ സ്വഭാവം നിർണയിക്കുന്നില്ല.
- source_word: τῆς σαρκός
  choice: ജഡത്തിന്റെ
  rationale: ശാരീരിക ദേഹം എന്നും പാപാഭിമുഖമായ ജഡികത എന്നും ഗ്രഹിക്കാവുന്ന σάρξ എന്ന പദത്തിന്റെ യഥാർഥ സന്ദിഗ്ധത ‘ജഡം’ നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ ... വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെയോ ലക്ഷ്യമിട്ട ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὸ πνεῦμα
  choice: ആത്മാവ്
  rationale: മൂലത്തിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘അവന്റെ ആത്മാവ്’ എന്ന് ചേർക്കാതെ നിയന്ത്രണം പാലിക്കുന്നു.
- source_word: σωθῇ
  choice: രക്ഷിക്കപ്പെടേണ്ടതിന്
  rationale: പാസീവ് രൂപവും ഉദ്ദേശ്യസൂചനയും നിലനിർത്തുന്നു; രക്ഷയുടെ മാർഗമോ സ്വഭാവമോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: കർത്താവിന്റെ ദിവസത്തിൽ
  rationale: അന്ത്യകാലസംബന്ധമായ സ്ഥിരപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും മൂലപാഠത്തിലെ ‘കർത്താവ്’ എന്ന ലഘുരൂപം മാത്രം പിന്തുടരുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ജഡത്തിന്റെ നാശം’ എന്നതിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘ജഡത്തിന്റെ നാശം’ എന്ന സന്ദിഗ്ധ പ്രയോഗം നിലനിർത്തി.
  alternative: കടുത്ത ശാരീരിക ശിക്ഷയോ മരണമോ; അല്ലെങ്കിൽ പാപാഭിമുഖമായ ജഡികതയുടെ നശീകരണം.
  rationale: ഗ്രീക്ക് പ്രയോഗം ഇവയിൽ ഒന്ന് നിർബന്ധമായി തീരുമാനിക്കുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം അടിച്ചമർത്തിയിട്ടില്ല.
- issue: ‘ആത്മാവ്’ ആരുടേതാണ്
  choice: ‘അവന്റെ’ എന്ന് ചേർക്കാതെ ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവന്റെ ആത്മാവ്.’
  rationale: സന്ദർഭം കുറ്റക്കാരന്റെ അന്തിമരക്ഷയിലേക്കു ശക്തമായി ചൂണ്ടുന്നുവെങ്കിലും ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ല.
- issue: ‘കർത്താവിന്റെ ദിവസം’ എന്ന പാഠഭേദം
  choice: SBLGNTയിലെ τοῦ κυρίου അനുസരിച്ച് ‘കർത്താവിന്റെ’ എന്നു നൽകി.
  alternative: ‘നമ്മുടെ കർത്താവായ യേശുവിന്റെ’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശുവിന്റെ.’
  rationale: അടിസ്ഥാനപാഠത്തെ വികസിപ്പിക്കാതെ പിന്തുടർന്നു; മറ്റു സാക്ഷ്യങ്ങളിലെ വിപുലരൂപങ്ങൾ അടിക്കുറിപ്പിൽ അറിയിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡം,’ ‘ആത്മാവ്,’ ‘കർത്താവിന്റെ ദിവസം’ എന്നീ ബൈബിൾസംബന്ധമായ പദങ്ങൾ വ്യാഖ്യാനപരമായ സന്ദിഗ്ധത സംരക്ഷിക്കാൻ നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
