reference: 1 Corinthians 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: ml
  text: 'വാസ്തവത്തിൽ, നിങ്ങളുടെ ഇടയിൽ ലൈംഗിക അധാർമികതയുണ്ടെന്ന് റിപ്പോർട്ട് ചെയ്യപ്പെടുന്നു; ജനതകളുടെ ഇടയിൽപോലും ഇല്ലാത്ത തരത്തിലുള്ള ലൈംഗിക അധാർമികതയാണത്[a]: ഒരാൾ തന്റെ അപ്പന്റെ ഭാര്യയുമായി ബന്ധം പുലർത്തുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യഹൂദേതരരുടെ [വിജാതീയരുടെ] ഇടയിൽപോലും.” അക്ഷരാർഥത്തിൽ, “ജനതകളുടെ ഇടയിൽപോലും.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ഒരാൾ തന്റെ അപ്പന്റെ ഭാര്യയെ ഉണ്ടായിരിക്കുന്നു.” അതായത്, തന്റെ അപ്പന്റെ ഭാര്യയുമായി ലൈംഗികബന്ധം പുലർത്തുന്നു. അവൾ അയാളുടെ രണ്ടാനമ്മയായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: വാസ്തവത്തിൽ
  rationale: ഇവിടെ അളവിനെയല്ല, പൗലോസിന്റെ ഞെട്ടലും ഊന്നലും പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: ἀκούεται
  choice: കേൾക്കുന്നു
  rationale: ഒരു കാര്യം പരക്കെ അറിയപ്പെടുകയോ റിപ്പോർട്ട് ചെയ്യപ്പെടുകയോ ചെയ്യുന്നു എന്ന കർമണിപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: കൊരിന്ത്യസഭാസമൂഹത്തിനുള്ളിൽ ഈ കാര്യം നടക്കുന്നു എന്ന സമൂഹപരമായ അർഥം നിലനിർത്തുന്നു.
- source_word: πορνεία
  choice: ലൈംഗിക അധാർമികത
  rationale: അനുവദനീയമല്ലാത്ത ലൈംഗിക പെരുമാറ്റത്തെ വ്യാപകമായി സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥപരിധി നിലനിർത്തുന്നു.
- source_word: τοιαύτη πορνεία
  choice: ഇടയിൽപോലും കാണപ്പെടാത്ത തരത്തിലുള്ള ലൈംഗിക അധാർമികത
  rationale: കുറ്റത്തിന്റെ അസാധാരണവും ഞെട്ടിക്കുന്നതുമായ സ്വഭാവത്തിന് ഗ്രീക്കിലുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: യഹൂദരല്ലാത്തവരുടെ ഇടയിൽപോലും കാണപ്പെടാത്ത
  rationale: ἔθνη എന്നത് ഇവിടെ യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു. മലയാളവാക്യം പൂർണമാക്കാൻ ‘കാണപ്പെടാത്ത’ ചേർത്തിരിക്കുന്നു; ഇത് ഗ്രീക്കിൽ സൂചിതമായ ആശയം വ്യക്തമാക്കുന്നു.
- source_word: ὥστε
  choice: ':'
  rationale: തുടർന്നുവരുന്ന വാക്കുകൾ റിപ്പോർട്ടിന്റെ ഞെട്ടിക്കുന്ന ഉള്ളടക്കം വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ ദ്വിബിന്ദു സ്വാഭാവികമാണ്.
- source_word: γυναῖκά τινα τοῦ πατρὸς ἔχειν
  choice: ഒരാൾ തന്റെ അപ്പന്റെ ഭാര്യയുമായി ബന്ധം പുലർത്തുന്നു
  rationale: ‘അപ്പന്റെ ഭാര്യയെ ഉണ്ടായിരിക്കുക’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലൈംഗിക/ദാമ്പത്യബന്ധപരമായ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു; ‘രണ്ടാനമ്മ’ എന്നു പറഞ്ഞ് മൂലപാഠത്തേക്കാൾ അധികം നിർവചിക്കുന്നില്ല.
theological_decisions:
- issue: ἔθνεσιν എന്നത് മതപരമായി വിലയിരുത്തുന്ന പദമായോ ജനവിഭാഗപരമായ പദമായോ വിവർത്തനം ചെയ്യണമോ
  choice: യഹൂദരല്ലാത്തവർ
  alternative: ജനതകൾ; വിജാതീയർ; പുറജാതിക്കാർ
  rationale: പൗലോസിന്റെ യഹൂദ–യഹൂദേതര വ്യത്യാസം വ്യക്തമായി സൂക്ഷിക്കുകയും ‘വിഗ്രഹാരാധകർ’ പോലുള്ള അധിക വിലയിരുത്തൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: γυναῖκα τοῦ πατρὸς എന്ന സ്ത്രീയെ മുഖ്യപാഠത്തിൽ ‘രണ്ടാനമ്മ’ എന്നു നിർവചിക്കണമോ
  choice: തന്റെ അപ്പന്റെ ഭാര്യ
  alternative: തന്റെ രണ്ടാനമ്മ
  rationale: ഗ്രീക്ക് പ്രത്യേക ബന്ധുത്വപദം ഉപയോഗിക്കുന്നില്ല. അതിനാൽ സാധ്യതയുള്ള കുടുംബബന്ധം നിർബന്ധിതമായി നിശ്ചയിക്കാതെ മൂലപ്രയോഗം നിലനിർത്തുന്നു.
- issue: ἔχειν എന്നതിന്റെ സംക്ഷിപ്ത പ്രയോഗം അക്ഷരാർഥത്തിലോ അർഥവ്യക്തതയോടെയോ നൽകണമോ
  choice: ബന്ധം പുലർത്തുന്നു
  alternative: അപ്പന്റെ ഭാര്യയെ വെച്ചിരിക്കുന്നു; അപ്പന്റെ ഭാര്യയോടൊപ്പം കഴിയുന്നു
  rationale: സന്ദർഭത്തിൽ ഇത് ലൈംഗിക/പങ്കാളിത്തബന്ധത്തെ സൂചിപ്പിക്കുന്നു. ‘ബന്ധം പുലർത്തുന്നു’ അർഥം വ്യക്തമാക്കുമ്പോഴും വിവാഹമോ ഒരുമിച്ചുള്ള താമസമോ നിർബന്ധമായി പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ ഞെട്ടലും കുറ്റത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു; പഴഞ്ചൻ സഭാപദങ്ങളും അനാവശ്യമായ വിശദീകരണങ്ങളും ഒഴിവാക്കുന്നു.
