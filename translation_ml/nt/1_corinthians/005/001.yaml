revisions:
- from: 'നിങ്ങളുടെ ഇടയിൽ ലൈംഗിക അധാർമികത ഉണ്ടെന്നു വാസ്തവത്തിൽ കേൾക്കുന്നു. യഹൂദരല്ലാത്തവരുടെ ഇടയിൽപോലും കാണപ്പെടാത്ത തരത്തിലുള്ള ലൈംഗിക അധാർമികതയാണത്[a]: ഒരാൾ തന്റെ അപ്പന്റെ ഭാര്യയുമായി ബന്ധം പുലർത്തുന്നു[b].'
  to: 'വാസ്തവത്തിൽ, നിങ്ങളുടെ ഇടയിൽ ലൈംഗിക അധാർമികതയുണ്ടെന്ന് റിപ്പോർട്ട് ചെയ്യപ്പെടുന്നു; ജനതകളുടെ ഇടയിൽപോലും ഇല്ലാത്ത തരത്തിലുള്ള ലൈംഗിക അധാർമികതയാണത്[a]: ഒരാൾ തന്റെ അപ്പന്റെ ഭാര്യയുമായി ബന്ധം പുലർത്തുന്നു[b].'
  rationale: The revision repairs the Malayalam rendering of the impersonal passive, retains the emphatic “വാസ്തവത്തിൽ,” and more closely follows the Greek's linkage and lexical breadth. It does not add a marriage status or definitively identify the woman as a stepmother.
  reviewer_model: gpt-5.6-terra
