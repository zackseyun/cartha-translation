revisions:
- from: പഴയ പുളിമാവ് നീക്കിക്കളയുക; അങ്ങനെ നിങ്ങൾ ഒരു പുതിയ മാവുകൂട്ടായിരിക്കട്ടെ—നിങ്ങൾ പുളിപ്പില്ലാത്തവരായിരിക്കുന്നതുപോലെതന്നെ. എന്തെന്നാൽ, നമ്മുടെ പെസഹാക്കുഞ്ഞാടായ[a] മശീഹാ[b] ബലിയായി അർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.
  to: പഴയ പുളിമാവ് നീക്കിക്കളയുക; അങ്ങനെ നിങ്ങൾ ഒരു പുതിയ മാവുകൂട്ടാകേണ്ടതിന്—നിങ്ങൾ പുളിപ്പില്ലാത്തവരായിരിക്കുന്നതുപോലെ. എന്തെന്നാൽ, നമ്മുടെ പെസഹാക്കുഞ്ഞാടായ[a] മശീഹാ[b] ബലിയായി അർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.
