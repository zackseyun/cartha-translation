id: 1CO.5.7
reference: 1 Corinthians 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: ml
  text: പഴയ പുളിമാവ് നീക്കിക്കളയുക; അങ്ങനെ നിങ്ങൾ ഒരു പുതിയ മാവുകൂട്ടാകേണ്ടതിന്—നിങ്ങൾ പുളിപ്പില്ലാത്തവരായിരിക്കുന്നതുപോലെ. എന്തെന്നാൽ, നമ്മുടെ പെസഹാക്കുഞ്ഞാടായ[a] മശീഹാ[b] ബലിയായി അർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നമ്മുടെ പെസഹാ ബലിയായി അർപ്പിക്കപ്പെട്ടു—മശീഹാ.’ ‘പെസഹാ’ എന്ന ഗ്രീക്കുപദം ഇവിടെ പെസഹാക്കുഞ്ഞാടിനെയോ പെസഹാബലിയെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: Χριστός. പെസഹാസന്ദർഭത്തിൽ സ്ഥാനപ്പേർ എന്ന അർഥം മുന്നിട്ടുനിൽക്കുന്നതിനാൽ ഇവിടെ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: നീക്കിക്കളയുക
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള ശക്തമായ ആജ്ഞയാണ്. പഴയ പുളിമാവിനെ സമൂഹത്തിൽനിന്ന് പൂർണമായി ഒഴിവാക്കണമെന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: παλαιὰν ζύμην
  choice: പഴയ പുളിമാവ്
  rationale: പെസഹയുടെയും പുളിപ്പില്ലാത്ത അപ്പത്തിന്റെയും ദൃശ്യബിംബം നിലനിർത്തുന്നു; മുൻകാലത്തെ ദുഷിപ്പിക്കുന്ന സ്വാധീനമെന്ന രൂപകവും സംരക്ഷിക്കുന്നു.
- source_word: ἵνα ἦτε
  choice: അങ്ങനെ നിങ്ങൾ … ആയിരിക്കട്ടെ
  rationale: ഉദ്ദേശ്യത്തെയോ ലക്ഷ്യഫലത്തെയോ സൂചിപ്പിക്കുന്നു. തുടർന്നുള്ള ‘നിങ്ങൾ … ആയിരിക്കുന്നതുപോലെതന്നെ’ എന്ന നിലവിലെ തിരിച്ചറിയലുമായുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: νέον φύραμα
  choice: ഒരു പുതിയ മാവുകൂട്ട്
  rationale: φύραμα എന്നത് കുഴച്ച മാവിന്റെ ഒരു കൂട്ടത്തെയോ അളവിനെയോ സൂചിപ്പിക്കുന്നു. സഭയെ ഒരൊറ്റ പുതിയ മാവുകൂട്ടായി ചിത്രീകരിക്കുന്ന പാചകരൂപകം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καθώς ἐστε ἄζυμοι
  choice: നിങ്ങൾ പുളിപ്പില്ലാത്തവരായിരിക്കുന്നതുപോലെതന്നെ
  rationale: καθώς എന്നതിന്റെ താരതമ്യാർഥമായ ‘അതുപോലെതന്നെ’ സംരക്ഷിക്കുകയും വിശ്വാസികളുടെ നിലവിലെ നിലയെക്കുറിച്ചുള്ള വാക്യത്തിന്റെ ഉറപ്പ് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ πάσχα ἡμῶν
  choice: നമ്മുടെ പെസഹാക്കുഞ്ഞാട്
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘നമ്മുടെ പെസഹാ’ എന്നാണ്. എന്നാൽ ‘ബലിയായി അർപ്പിക്കപ്പെട്ടു’ എന്ന ക്രിയയോടൊപ്പം ഇവിടെ പെസഹാബലിയെയോ കുഞ്ഞാടിനെയോ ഉദ്ദേശിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തമാക്കാൻ ‘കുഞ്ഞാട്’ ചേർത്തിരിക്കുന്നു, അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἐτύθη
  choice: ബലിയായി അർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: θύω ബലിക്കായി അറുക്കുകയോ അർപ്പിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളരൂപം ബലിയുടെ അർഥവും സംഭവത്തിന്റെ നിലനിൽക്കുന്ന പ്രസക്തിയും വ്യക്തമാക്കുന്നു.
- source_word: Χριστός
  choice: മശീഹാ
  rationale: പെസഹാസന്ദർഭത്തിൽ Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായി ശക്തമായി പ്രവർത്തിക്കുന്നു. അതിനാൽ പേരുപോലെ ഉപയോഗിക്കുന്ന ‘ക്രിസ്തു’ എന്നതിനു പകരം സ്ഥാനാർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ സ്വീകരിച്ചു.
theological_decisions:
- issue: പെസഹയുമായി മശീഹായുടെ ബന്ധം എങ്ങനെ അവതരിപ്പിക്കണം
  choice: നമ്മുടെ പെസഹാക്കുഞ്ഞാട്
  alternative: നമ്മുടെ പെസഹാ; നമ്മുടെ പെസഹാബലി
  rationale: മൂലപാഠത്തിൽ ‘കുഞ്ഞാട്’ ഇല്ലെങ്കിലും ‘ബലിയായി അർപ്പിക്കപ്പെട്ടു’ എന്നത് പെസഹാബലിയെ സൂചിപ്പിക്കുന്നു. പ്രധാനവാചകത്തിൽ സന്ദർഭസൂചിതമായ അർഥം വ്യക്തമാക്കുകയും അടിക്കുറിപ്പിൽ ഗ്രീക്കിന്റെ സംക്ഷിപ്തവും അർഥവ്യാപ്തിയുള്ളതുമായ രൂപം സംരക്ഷിക്കുകയും ചെയ്തു.
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിലെ പെസഹാചട്ടക്കൂട് Χριστός എന്നതിന്റെ സ്ഥാനപ്പേർസ്വഭാവം മുന്നോട്ടുകൊണ്ടുവരുന്നു. അതിനാൽ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന അർഥം വായനക്കാരന് നേരിട്ട് ലഭിക്കുന്ന രൂപം തിരഞ്ഞെടുത്തു.
- issue: ആജ്ഞയും നിലവിലെ തിരിച്ചറിയലും തമ്മിലുള്ള സംഘർഷം
  choice: ‘ഒരു പുതിയ മാവുകൂട്ടായിരിക്കട്ടെ’ എന്നും ‘പുളിപ്പില്ലാത്തവരായിരിക്കുന്നതുപോലെതന്നെ’ എന്നും രണ്ടും നിലനിർത്തി
  alternative: നിങ്ങൾ പുളിപ്പില്ലാത്തവരായതിനാൽ പുതിയ മാവായിത്തീരുക
  rationale: പൗലോസ് ഒരേസമയം അവർ ആകേണ്ടതിനെക്കുറിച്ച് ആജ്ഞാപിക്കുകയും അവർ ഇതിനകം പുളിപ്പില്ലാത്തവരാണെന്ന് ഉറപ്പിക്കുകയും ചെയ്യുന്നു. ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘പുളിമാവ്—മാവുകൂട്ട്—പുളിപ്പില്ലാത്തവർ’ എന്ന ആവർത്തിത പാചക-പെസഹാ രൂപകം മുഴുവനായും നിലനിർത്തി. ‘പുളിപ്പില്ലാത്തവരായിരിക്കുന്നതുപോലെതന്നെ’ എന്ന അല്പം ഔപചാരികമായ ഘടന മൂലപാഠത്തിലെ καθώς എന്ന താരതമ്യബന്ധവും ആജ്ഞയും നിലവിലെ നിലയും തമ്മിലുള്ള ഉദ്ദേശ്യപൂർവമായ സംഘർഷവും സംരക്ഷിക്കാനാണ്.
