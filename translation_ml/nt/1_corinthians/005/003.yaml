  - severity: low
    issue: Footnote anchors are both placed at the end of the sentence.
    rationale: Footnote b concerns «ആത്മാവിൽ സന്നിഹിതൻ» and should be anchored directly to that expression; footnote a should follow the judgment verb it qualifies.
