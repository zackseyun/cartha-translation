revisions:
- from: ഞാനാകട്ടെ, ശരീരംകൊണ്ട് അകന്നിരിക്കുന്നെങ്കിലും ആത്മാവിൽ സന്നിഹിതനാണ്; സന്നിഹിതനായിരിക്കുന്നതുപോലെതന്നെ, ഇങ്ങനെ ഈ പ്രവൃത്തി ചെയ്തവനെക്കുറിച്ച് ഞാൻ ഇതിനകം വിധിച്ചുകഴിഞ്ഞിരിക്കുന്നു.[a][b]
