id: 1CO.5.3
reference: 1 Corinthians 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: ml
  text: കാരണം, ഞാൻ ശാരീരികമായി അകന്നിരുന്നാലും ആത്മാവിൽ സന്നിഹിതനായിരിക്കെ[b], സന്നിഹിതനായിരിക്കുന്നതുപോലെ, ഇങ്ങനെ ഇതു ചെയ്തവനെ ഞാൻ ഇതിനകം വിധിച്ചുകഴിഞ്ഞിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിധിച്ചുകഴിഞ്ഞിരിക്കുന്നു” എന്നതിന് “വിധി പ്രസ്താവിച്ചുകഴിഞ്ഞിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “ആത്മാവിൽ സന്നിഹിതൻ” എന്നത് ഇവിടെ പരിശുദ്ധാത്മാവിനെക്കാൾ പൗലോസിന്റെ സ്വന്തം ആത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് കൂടുതൽ സാധ്യതയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὼν τῷ σώματι
  choice: ശരീരംകൊണ്ട് അകന്നിരിക്കുന്നെങ്കിലും
  rationale: ശാരീരികമായി അവിടെ ഇല്ലെന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; മരണത്തെയോ ശരീരത്തിൽനിന്നുള്ള ആത്മാവിന്റെ വേർപാടിനെയോ സൂചിപ്പിക്കുന്നില്ല.
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: ആത്മാവിൽ സന്നിഹിതനാണ്
  rationale: ശരീരത്തിലെ അഭാവത്തോടുള്ള സംക്ഷിപ്തമായ വൈരുധ്യം നിലനിർത്തുന്നു. ഇവിടെ πνεύματι പൗലോസിന്റെ സ്വന്തം ആത്മാവിനെ സൂചിപ്പിക്കാനാണ് കൂടുതൽ സാധ്യത; എന്നാൽ മുഖ്യവാചകം അതിനെ വിശദീകരിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: ἤδη κέκρικα
  choice: ഞാൻ ഇതിനകം വിധിച്ചുകഴിഞ്ഞിരിക്കുന്നു
  rationale: തീരുമാനിക്കപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ വിധിയെ ഗ്രീക്കിലെ perfect രൂപത്തിന് അനുസൃതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς παρὼν
  choice: സന്നിഹിതനായിരിക്കുന്നതുപോലെതന്നെ
  rationale: പൗലോസ് ശാരീരികമായി അവിടെ ഉണ്ടായിരുന്നുവെന്നല്ല, ഉണ്ടായിരിക്കുന്നതുപോലെ വിധി പ്രസ്താവിച്ചുവെന്ന താരതമ്യബലം സൂക്ഷിക്കുന്നു.
- source_word: τὸν ... κατεργασάμενον
  choice: ചെയ്തവനെക്കുറിച്ച്
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന substantival participle സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘മനുഷ്യൻ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: οὕτως τοῦτο
  choice: ഇങ്ങനെ ഈ പ്രവൃത്തി
  rationale: οὕτως എന്ന രീതിസൂചനയും τοῦτο എന്ന നിർദ്ദേശസർവനാമവും രണ്ടും നിലനിർത്തുന്നു; മലയാളത്തിൽ വെറും ‘ഇക്കാര്യം’ എന്നതിലധികം സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: γάρ
  choice: ആകട്ടെ
  rationale: ഈ വാക്യത്തിന്റെ മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രകടമാക്കുന്നു; ‘എന്തെന്നാൽ’ ഇവിടെ ഭാരമുള്ളതാകുമായിരുന്നു.
- source_word: μὲν ... δὲ
  choice: …എങ്കിലും…
  rationale: ശാരീരിക അഭാവവും ആത്മാവിലെ സാന്നിധ്യവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ആത്മാവിൽ സന്നിഹിതൻ’ എന്നതിന്റെ അർഥം
  choice: പൗലോസ് ശാരീരികമായി ഇല്ലെങ്കിലും തന്റെ ആത്മാവിൽ സഭയോടൊപ്പം സന്നിഹിതനാണെന്ന് പറയുന്ന വായന മുഖ്യവാചകത്തിൽ തുറന്ന നിലയിൽ സൂക്ഷിച്ചു.
  alternative: ഇത് പരിശുദ്ധാത്മാവിന്റെ സാന്നിധ്യമോ വെളിപ്പാടോ സൂചിപ്പിക്കുന്നു; അല്ലെങ്കിൽ കൂടുതൽ ശക്തമായ ഒരു മിസ്റ്റിക്കൽ സാന്നിധ്യം സൂചിപ്പിക്കുന്നു.
  rationale: σώματι–πνεύματι വൈരുധ്യം പൗലോസിന്റെ ശരീരവും സ്വന്തം ആത്മാവും തമ്മിലുള്ളതാകാനാണ് കൂടുതൽ സാധ്യത. എന്നിരുന്നാലും വിവർത്തനം ഒരു പ്രത്യേക സിദ്ധാന്തം വാചകത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സന്നിഹിതൻ’, ‘വിധിച്ചുകഴിഞ്ഞിരിക്കുന്നു’ എന്നിവ ന്യായവിധിയുടെ ഗൗരവവും ഗ്രീക്ക് വാക്യത്തിന്റെ സംക്ഷിപ്ത വൈരുധ്യവും സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
