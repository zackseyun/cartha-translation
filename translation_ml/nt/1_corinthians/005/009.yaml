lexical_decisions:
- source_word: Ἔγραψα
  choice: എഴുതി
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റ് സൂചകക്രിയയെ സ്വാഭാവികമായ ലളിതഭൂതകാലത്തിൽ അവതരിപ്പിക്കുന്നു; ‘എഴുതിയിരുന്നു’ എന്ന് പറഞ്ഞ് മുൻകാലത്തെ ഒരു കത്താണെന്ന വ്യാഖ്യാനം മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്ക്
  rationale: എഴുത്തിന്റെ പരോക്ഷകർമത്തെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി സർവനാമത്തിന്റെ നേരായ മലയാളരൂപം.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: കത്തിൽ
  rationale: കൊരിന്ത്യർക്ക് അറിയാവുന്ന ഒരു നിർദിഷ്ട കത്തിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം. മുൻകത്താണോ ഇപ്പോഴത്തെ കത്തിലെ മുൻഭാഗമാണോ എന്ന് മുഖ്യവാചകം തീരുമാനിക്കുന്നില്ല.
- source_word: μὴ συναναμίγνυσθαι
  choice: ഇടപഴകരുതെന്ന്
  rationale: സാമൂഹികമായി കൂടിക്കലരുകയോ കൂട്ടുകൂടുകയോ ചെയ്യരുതെന്ന നിർദേശത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πόρνοις
  choice: ലൈംഗിക അധാർമികതയിൽ ഏർപ്പെടുന്നവരുമായി
  rationale: ലൈംഗിക അധാർമികത സ്വഭാവമായോ പ്രവൃത്തിയായോ ഉള്ള ആളുകളെയാണ് ബഹുവചനനാമം സൂചിപ്പിക്കുന്നത്; പഴഞ്ചനായതോ അനാവശ്യമായി സങ്കുചിതമായതോ ആയ പദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘കത്ത്’ എന്നതിന്റെ സൂചന
  choice: കൊരിന്ത്യർക്ക് അറിയാവുന്ന ഒരു കത്തിനെ സൂചിപ്പിക്കുന്നു; അത് ഏതു കത്തെന്ന് പരിഭാഷയിൽ നിർണയിക്കുന്നില്ല.
  alternative: ഇപ്പോൾ നഷ്ടപ്പെട്ട ഒരു മുൻകത്ത്; അല്ലെങ്കിൽ 1 കൊരിന്ത്യർ ലേഖനത്തിലെ നേരത്തെയുള്ള ഒരു ഭാഗം.
  rationale: ἐν τῇ ἐπιστολῇ എന്ന ഗ്രീക്ക് പ്രയോഗം നിർദിഷ്ടമാണെങ്കിലും ചരിത്രപരമായ ഈ ചോദ്യം സ്വതവേ തീർപ്പാക്കുന്നില്ല; അതിനാൽ മൂലത്തിലെ അവ്യക്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഇടപഴകുക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും συναναμίγνυσθαι എന്നതിലെ സാമൂഹിക കൂട്ടുകെട്ടിന്റെ ഭാവം നൽകുന്നതുമാണ്. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും നിർദേശം, സ്വീകർത്താക്കൾ, കത്ത് എന്നീ ആശയഘടകങ്ങൾ എല്ലാം നിലനിർത്തിയിരിക്കുന്നു.
