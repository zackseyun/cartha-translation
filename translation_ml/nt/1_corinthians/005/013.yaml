id: 1CO.5.13
reference: 1 Corinthians 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοὺς δὲ ἔξω ὁ θεὸς ⸀κρίνει; ⸀ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/013.yaml
  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: ml
  text: എന്നാൽ പുറത്തുള്ളവരെ ദൈവം വിധിക്കുന്നു.[a] നിങ്ങളുടെയിടയിൽനിന്ന് ആ ദുഷ്ടനെ നീക്കിക്കളയുക.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘പുറത്തുള്ളവരെ ദൈവം വിധിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താറുണ്ട്; എന്നാൽ ഗ്രീക്ക് ക്രിയ വർത്തമാനകാലത്തിലാണ്: ‘വിധിക്കുന്നു.’'
    reason: lexical_alternative
  - marker: b
    text: ‘നിങ്ങളുടെ നടുവിൽനിന്ന് ആ ദുഷ്ടനെ പുറത്താക്കുക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ വാക്കുകൾ ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-സമൂഹത്തിൽനിന്ന് ദോഷം നീക്കാനുള്ള സൂത്രവാക്യങ്ങളെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: പുറത്തുള്ളവരെ
  rationale: സഭാസമൂഹത്തിന് പുറത്തുള്ള ആളുകളെയാണ് നാമപദമായി ഉപയോഗിച്ചിരിക്കുന്ന ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘പുറത്തുള്ളവർ’ ബന്ധപരമായ അർഥം അനാവശ്യമായി വിശദീകരിക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ സഭയ്ക്കുള്ളിലുള്ളവരെ വിധിക്കുന്നതുമായുള്ള മൃദുവായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: κρίνει
  choice: വിധിക്കുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല സൂചകക്രിയയെ അതേ കാലത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തെ ആശ്രയിച്ച് ഭാവികാലമായി വ്യാഖ്യാനിക്കാതെ ദൈവത്തിന്റെ പൊതുവായ പ്രവർത്തനമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐξάρατε
  choice: നീക്കിക്കളയുക
  rationale: തീരുമാനാത്മകമായ നടപടിക്കുള്ള ഭൂതകാല ആജ്ഞയുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പിന്നീടുണ്ടായ സഭാപരമായ സാങ്കേതിക പദാവലി ചേർക്കുന്നില്ല.
- source_word: τὸν πονηρὸν
  choice: ആ ദുഷ്ടനെ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ ഏകവചന പുരുഷലിംഗപ്രയോഗം സന്ദർഭത്തിലെ കുറ്റക്കാരനായ പുരുഷനെയും ആവർത്തനപുസ്തകത്തിലെ ഉടമ്പടി-ശുദ്ധീകരണ സൂത്രവാക്യത്തെയും ഓർമിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘ആ ദുഷ്ടനെ’ ഈ നിർദിഷ്ടതയും നൈതിക വിശേഷണവും നിലനിർത്തുന്നു.
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: നിങ്ങളുടെയിടയിൽനിന്ന്
  rationale: സമൂഹത്തിന്റെ ഉള്ളിൽനിന്നുള്ള നീക്കലാണ് ഈ പ്രയോഗത്തിന്റെ അർഥം; ആ സാമുദായിക ആശയം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: സഭാശിക്ഷയെ സംബന്ധിച്ച ആജ്ഞയുടെ സ്വഭാവം
  choice: പുറത്തുള്ളവരുടെ ന്യായവിധി ദൈവത്തിന് വിട്ടുകൊണ്ട്, കുറ്റക്കാരനായ ആളെ തങ്ങളുടെ കൂട്ടായ്മയിൽനിന്ന് സഭ നീക്കണമെന്ന ആജ്ഞയായി വിവർത്തനം ചെയ്തു.
  alternative: ഔപചാരികമായ പുറത്താക്കൽ വ്യക്തമാക്കാതെ, സമൂഹത്തിൽനിന്ന് ദോഷത്തെ പൊതുവായി നീക്കാനുള്ള ആജ്ഞയായി വായിക്കാം.
  rationale: 1 കൊരിന്ത്യർ 5-ന്റെ സന്ദർഭം സഭയ്ക്കുള്ളിലെ ഒരു വ്യക്തമായ അധാർമികതയെക്കുറിച്ചാണ്; ഉള്ളിലുള്ളവരെ സഭ വിധിക്കുന്നതും പുറത്തുള്ളവരെ ദൈവം വിധിക്കുന്നതും പൗലോസ് വേർതിരിക്കുന്നു. എങ്കിലും ഗ്രീക്കിൽ ഇല്ലാത്ത പിൽക്കാല സഭാപരമായ സാങ്കേതിക പദങ്ങൾ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: κρίνει എന്ന ക്രിയയുടെ കാലം
  choice: ‘വിധിക്കുന്നു’ എന്ന വർത്തമാനകാലം നിലനിർത്തി.
  alternative: സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘വിധിക്കും’ എന്നു ഭാവികാലത്തിൽ നൽകാം.
  rationale: ഗ്രീക്ക് രൂപം വർത്തമാനകാലത്തിലാണ്. അത് ദൈവത്തിന്റെ ന്യായവിധിയെക്കുറിച്ചുള്ള പൊതുസത്യമായി മനസ്സിലാക്കാം; ഭാവികാലത്തിലേക്ക് മാറ്റാൻ സന്ദർഭം നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സഭാഭ്രഷ്ട്’ പോലുള്ള പിൽക്കാല സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി. മുഖ്യവാക്യത്തിന്റെ ഒഴുക്ക് തടസ്സപ്പെടുത്താതെ ഗ്രീക്കിലെ വർത്തമാനകാലവും ആവർത്തനപുസ്തക പ്രതിധ്വനിയും അടിക്കുറിപ്പുകളിൽ സൂചിപ്പിച്ചു.
