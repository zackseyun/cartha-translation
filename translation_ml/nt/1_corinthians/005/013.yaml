  source_fidelity: ഗ്രീക്കിലെ δέയുടെ വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെ, τοὺς ἔξω എന്ന സഭാസമൂഹത്തിനു പുറത്തുള്ളവരെ ‘പുറത്തുള്ളവരെ’ എന്നതിലൂടെ, κρίνειയുടെ വർത്തമാനകാലം ‘വിധിക്കുന്നു’ എന്നതിലൂടെ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു. ἐξάρατε എന്ന നിർണായക ആജ്ഞയും τὸν πονηρόν എന്ന സന്ദർഭത്തിലെ നിർദിഷ്ട പുരുഷസൂചനയും ‘ആ ദുഷ്ടനെ നീക്കിക്കളയുക’ എന്നതിൽ യോജ്യമായി നിലനിൽക്കുന്നു. ‘നിങ്ങളുടെയിടയിൽനിന്ന്’ ἐξ ὑμῶν αὐτῶν എന്ന സമൂഹത്തിൽനിന്നുള്ള നീക്കത്തെ വ്യക്തമാക്കുന്നു.
