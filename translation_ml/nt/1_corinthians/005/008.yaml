id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: ml
  text: അതുകൊണ്ട് നമുക്ക് ഉത്സവം ആചരിക്കാം[a]—പഴയ പുളിമാവുകൊണ്ടോ ദുര്‍ഭാവത്തിന്റെയും ദുഷ്ടതയുടെയും പുളിമാവുകൊണ്ടോ അല്ല, ആത്മാർഥതയുടെയും സത്യത്തിന്റെയും പുളിപ്പില്ലാത്ത അപ്പംകൊണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമുക്ക് ആഘോഷിക്കാം” അല്ലെങ്കിൽ “നമുക്ക് ഉത്സവം പാലിക്കാം.” ഗ്രീക്ക് പദം മുൻവാക്യത്തിലെ പെസഹാ-ഉത്സവ രൂപകം തുടരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “ആത്മാർഥതയുടെയും സത്യത്തിന്റെയും പുളിപ്പില്ലാത്ത [വസ്തുക്കൾ]കൊണ്ട്” എന്നാണ്. പെസഹാ-രൂപകം വ്യക്തമാക്കാൻ പരിഭാഷയിൽ “അപ്പം” ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിലെ വാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑορτάζωμεν
  choice: നമുക്ക് ഉത്സവം ആചരിക്കാം
  rationale: വർത്തമാനകാല പ്രേരണാർഥക ഉപവാക്യത്തിന്റെ ‘നമുക്ക് … ചെയ്യാം’ എന്ന ഭാവവും പെസഹാ-ഉത്സവത്തിന്റെ പശ്ചാത്തലവും നിലനിർത്തുന്നു.
- source_word: ζύμῃ παλαιᾷ
  choice: പഴയ പുളിമാവുകൊണ്ട്
  rationale: ζύμηയുടെ അക്ഷരാർഥവും പെസഹാ സന്ദർഭത്തിലെ രൂപകവും ‘പുളിമാവ്’ വ്യക്തമാക്കുന്നു; ἐν ഇവിടെ മലയാളത്തിൽ ഉപകരണാർഥകമായ ‘കൊണ്ട്’ എന്നായി സ്വാഭാവികമാണ്.
- source_word: κακίας
  choice: ദുര്‍ഭാവം
  rationale: മറ്റുള്ളവരോടുള്ള ദുഷ്ടമനോഭാവം അല്ലെങ്കിൽ ദോഷകരമായ മനോനില എന്ന അർഥം നൽകുകയും πονηρίαയിൽനിന്ന് വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πονηρίας
  choice: ദുഷ്ടത
  rationale: വ്യാപകമായ ധാർമിക തിന്മയെ സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ പദം; κακίαയുമായി അർഥവ്യത്യാസം സൂക്ഷിക്കുന്നു.
- source_word: ἀλλ’ ἐν ἀζύμοις
  choice: അല്ല, … പുളിപ്പില്ലാത്ത അപ്പംകൊണ്ട്
  rationale: ἀζύμοις അക്ഷരാർഥത്തിൽ ‘പുളിപ്പില്ലാത്ത [വസ്തുക്കൾ]’ എന്നാണ്; മുൻസന്ദർഭത്തിലെ പെസഹാ-രൂപകം വ്യക്തമായി ഗ്രഹിക്കാനായി ‘അപ്പം’ ചേർത്തിരിക്കുന്നു.
- source_word: εἰλικρινείας
  choice: ആത്മാർഥത
  rationale: കലർപ്പില്ലാത്ത സത്യസന്ധതയും കാപട്യമില്ലായ്മയും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: ἀληθείας
  choice: സത്യം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ‘ആത്മാർഥത’യോടുള്ള പദജോടി സ്വാഭാവികമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ആഹ്വാനത്തിലെ പെസഹാ/ഉത്സവ രൂപകം
  choice: ἑορτάζωμεν എന്നത് ‘നമുക്ക് ഉത്സവം ആചരിക്കാം’ എന്നും ἀζύμοις എന്നത് ‘പുളിപ്പില്ലാത്ത അപ്പം’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നമുക്ക് ആഘോഷിക്കാം’; ‘പുളിപ്പില്ലാത്ത ആത്മാർഥതയും സത്യവുംകൊണ്ട്’
  rationale: മുൻവാക്യം ക്രിസ്തുവിനെ പെസഹാബലിയായി അവതരിപ്പിക്കുന്നതിനാൽ ഉത്സവം, പുളിമാവ്, പുളിപ്പില്ലാത്ത അപ്പം എന്നീ ബന്ധിത രൂപകങ്ങൾ നിലനിർത്തുന്നത് പൗലോസിന്റെ വാദക്രമത്തെ പ്രതിഫലിപ്പിക്കുന്നു. ‘അപ്പം’ മൂലപാഠത്തിൽ വ്യക്തമായി ഇല്ലാത്തതുകൊണ്ട് അത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും ലളിതവുമായ ശൈലി. ‘ഉത്സവം’, ‘പുളിമാവ്’, ‘പുളിപ്പില്ലാത്ത അപ്പം’ എന്നിവയിലൂടെ പെസഹാ-രൂപകത്തിന്റെ തുടർച്ച സംരക്ഷിച്ചു. പഴഞ്ചൻ സഭാഭാഷയും പ്രത്യേക വിഭാഗീയ പദപ്രയോഗങ്ങളും ഒഴിവാക്കി.
