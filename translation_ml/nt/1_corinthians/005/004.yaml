id: 1CO.5.4
reference: 1 Corinthians 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശുവിന്റെ നാമത്തിൽ, നിങ്ങൾ ഒരുമിച്ചുകൂടുകയും എന്റെ ആത്മാവ് നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയും ചെയ്യുമ്പോൾ, നമ്മുടെ കർത്താവായ യേശുവിന്റെ ശക്തിയോടുകൂടെ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: നാമത്തിൽ
  rationale: അധികാരത്തിൻകീഴിൽ പ്രവർത്തിക്കുന്നതെന്ന ആശയം ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും സ്വാഭാവികമായ മലയാള ബൈബിൾഭാഷയും നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: പുതിയനിയമത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരമുള്ള κύριος എന്ന പദവിയെ സ്വാഭാവിക മലയാളത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: വ്യക്തിനാമത്തിന്റെ നിലവാരമുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: συναχθέντων ὑμῶν
  choice: നിങ്ങൾ ഒരുമിച്ചുകൂടുകയും
  rationale: aorist passive participle ഉൾപ്പെട്ട genitive absolute ഘടനയെ സന്ദർഭത്തിന് യോജിച്ച കാലസൂചക ഉപവാക്യത്തിന്റെ ഭാഗമായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ കർത്തൃപ്രയോഗം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: എന്റെ ആത്മാവ് നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അല്പം അപൂർണ്ണവുമായ ഘടന മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം വ്യക്തമാക്കുന്നു; പൗലോസിന്റെ ശാരീരികമല്ലാത്ത സാന്നിധ്യത്തിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: σὺν
  choice: ശക്തിയോടുകൂടെ
  rationale: കൂടെനിൽപ്പ് അഥവാ സഹവർത്തിത്വം സൂചിപ്പിക്കുന്ന ലളിതമായ അർത്ഥം നിലനിർത്തുന്നു.
- source_word: δυνάμει
  choice: ശക്തി
  rationale: ശിക്ഷണനടപടിയിൽ പ്രവർത്തിക്കുന്ന ഫലപ്രദമായ ശക്തി എന്ന വിശാലമായ അർത്ഥം സൂക്ഷിക്കുന്നു; അതിനെ വെറും ഔദ്യോഗിക അധികാരമായി ചുരുക്കുന്നില്ല.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: നമ്മുടെ കർത്താവായ യേശുവിന്റെ
  rationale: ഉറവിടം, ഉടമസ്ഥത തുടങ്ങിയ സൂക്ഷ്മഭേദങ്ങൾ നിർണ്ണയിക്കാതെ ഗ്രീക്ക് genitive-ന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: സഭായോഗത്തിൽ പൗലോസിന്റെ സാന്നിധ്യത്തിന്റെ സ്വഭാവം
  choice: “എന്റെ ആത്മാവ് നിങ്ങളോടുകൂടെ ഉണ്ടായിരിക്കുകയും” എന്നു പരിഭാഷപ്പെടുത്തി, ശാരീരികമല്ലാത്ത യഥാർഥ പങ്കാളിത്തത്തെ സൂചിപ്പിക്കുന്നു.
  alternative: ഇത് പൗലോസിന്റെ മനോഭാവമോ ഉദ്ദേശ്യമോ മാത്രം എന്നു പറയുക, അല്ലെങ്കിൽ കൂടുതൽ ശക്തമായ മിസ്റ്റിക്കൽ സാന്നിധ്യമായി നിർവചിക്കുക.
  rationale: വാക്യം പൗലോസിന്റെ ശാരീരികമല്ലാത്ത പങ്കാളിത്തം ഉറപ്പിക്കുന്നുവെങ്കിലും അതിന്റെ രീതി വിശദീകരിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ പൂർണ്ണവിരാമത്തിനുപകരം കോമ നിലനിർത്തി. ആവശ്യമില്ലാത്ത ദീർഘവിരാമചിഹ്നങ്ങൾ ഒഴിവാക്കി.
