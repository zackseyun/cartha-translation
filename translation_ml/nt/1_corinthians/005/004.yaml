  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിലെ പ്രധാന ഘടകങ്ങൾ വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: “നാമത്തിൽ” (ἐν τῷ ὀνόματι), സഭ ഒരുമിച്ചുകൂടുന്ന കാലസാഹചര്യം (συναχθέντων ὑμῶν), പൗലോസിന്റെ ആത്മാവിന്റെ ശാരീരികമല്ലാത്ത സാന്നിധ്യം, “ശക്തിയോടുകൂടെ” (σὺν τῇ δυνάμει), കർത്താവായ യേശു എന്നീ ഘടകങ്ങൾ എല്ലാം നിലനിൽക്കുന്നു. ‘ഒരുമിച്ചുകൂടുകയും’ സജീവരൂപമാണെങ്കിലും, ഗ്രീക്കിലെ ‘നിങ്ങൾ കൂടിച്ചേർന്നിരിക്കുമ്പോൾ/കൂടിവരുമ്പോൾ’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാന കോമയും ഉചിതമാണ്.'
