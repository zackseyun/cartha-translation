id: 1CO.5.2
reference: 1 Corinthians 5:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: ml
  text: നിങ്ങളോ അഹങ്കാരത്താൽ വീർത്തിരിക്കുകയാണ്! അതിനു പകരം, ഈ പ്രവൃത്തി ചെയ്തവൻ നിങ്ങളുടെ ഇടയിൽനിന്ന് നീക്കപ്പെടേണ്ടതിന് നിങ്ങൾ ദുഃഖിക്കേണ്ടതായിരുന്നില്ലേ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: അഹങ്കാരത്താൽ വീർത്തിരിക്കുകയാണ്
  rationale: ‘വീർത്തിരിക്കുക’ എന്ന രൂപകം നിലനിർത്തുകയും, അഹങ്കാരമാണ് ഉദ്ദേശ്യമെന്ന് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു. പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന അവസ്ഥയും ഇതിൽ പ്രതിഫലിക്കുന്നു.
- source_word: οὐχὶ μᾶλλον
  choice: ദുഃഖിക്കുകയല്ലേ വേണ്ടിയിരുന്നത്?
  rationale: അവരുടെ യഥാർഥ മനോഭാവത്തിനു പകരം ഉണ്ടായിരിക്കേണ്ട പ്രതികരണത്തെ ചൂണ്ടിക്കാട്ടുന്ന ശാസനാത്മകമായ അലങ്കാരചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπενθήσατε
  choice: ദുഃഖിക്കുക
  rationale: സാധാരണ ഖേദത്തേക്കാൾ ശക്തമായ വിലാപത്തിന്റെയും സമൂഹപരമായ ദുഃഖത്തിന്റെയും ആശയം നൽകുന്നു.
- source_word: ἵνα ἀρθῇ
  choice: നീക്കപ്പെടേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള കർമണിപ്രയോഗത്തിന്റെ ഉദ്ദേശ്യ/ഫലഭാവം നിലനിർത്തുന്നു; ആരാണ് നീക്കുന്നത് എന്നു വാചകം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἐκ μέσου ὑμῶν
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന്
  rationale: സമൂഹത്തിന്റെ മധ്യത്തിൽനിന്നുള്ള വേർതിരിക്കലിനെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: ഈ പ്രവൃത്തി ചെയ്തവൻ
  rationale: കുറ്റം ചെയ്ത വ്യക്തിയെ വീണ്ടും പേരെടുത്തുപറയാതെ തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് പ്രയോഗവും ‘പ്രവൃത്തി’ എന്ന പദത്തിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: കുറ്റം ചെയ്തവനോടു ആവശ്യപ്പെടുന്ന നടപടിയുടെ സ്വഭാവം
  choice: നിങ്ങളുടെ ഇടയിൽനിന്ന് നീക്കപ്പെടുക
  alternative: സഭാഭ്രഷ്ടനാക്കപ്പെടുക; ദൈവത്താൽ എടുത്തുകളയപ്പെടുക
  rationale: ἀρθῇ എന്ന കർമണിരൂപം പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല. 3–5, 13 വാക്യങ്ങളുടെ പശ്ചാത്തലത്തിൽ സമൂഹപരമായ ശിക്ഷണത്തിലൂടെയുള്ള നീക്കം ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്നുവെങ്കിലും, ‘സഭാഭ്രഷ്ടനാക്കുക’ എന്ന കൂടുതൽ സാങ്കേതിക പദമോ ദൈവിക മരണവിധിയോ പരിഭാഷയിൽ നിർബന്ധിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആദ്യവാക്യത്തിലെ ആശ്ചര്യചിഹ്നം പൗലോസിന്റെ ശക്തമായ ശാസനാഭാവം പ്രകടമാക്കുന്നു; രണ്ടാംവാക്യം ഗ്രീക്കിലെ അലങ്കാരചോദ്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
