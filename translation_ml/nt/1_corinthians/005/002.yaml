    text: അഥവാ, “നിങ്ങളുടെ മധ്യത്തിൽനിന്ന് എടുത്തുകളയപ്പെടേണ്ടതിന്.” സന്ദർഭത്തിൽ ഇത് സഭയുടെ അച്ചടക്കനടപടിയിലൂടെ സഭാസമൂഹത്തിൽനിന്ന് നീക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
