id: 1CO.5.6
reference: 1 Corinthians 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: ml
  text: നിങ്ങളുടെ വീമ്പുപറച്ചിൽ നല്ലതല്ല. അല്പം പുളിമാവ് കുഴച്ച മാവ് മുഴുവനെയും[a] പുളിപ്പിക്കുന്നു എന്നു നിങ്ങൾക്കറിയില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാവിന്റെ പിണ്ഡം മുഴുവനെയും.’
    reason: φύραμα എന്ന പദത്തിന്റെ പരമ്പരാഗതവും കൂടുതൽ അക്ഷരാർഥപരവുമായ പരിഭാഷ.
lexical_decisions:
- source_word: καλὸν
  choice: നല്ലതല്ല
  rationale: ഇവിടെ καλός കൊരിന്ത്യരുടെ വീമ്പുപറച്ചിലിനെ ധാർമ്മികമായും പ്രായോഗികമായും വിലയിരുത്തുന്നു; ‘നല്ലതല്ല’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: καύχημα
  choice: വീമ്പുപറച്ചിൽ
  rationale: പ്രശംസാർഹമല്ലാത്ത സ്വയംപുകഴ്ത്തലിനെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്; ശാസനയുടെ ഭാവം ഈ പദം വ്യക്തമായി നൽകുന്നു.
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾക്കറിയില്ലേ?
  rationale: പൗലോസിന്റെ പതിവായ ആലങ്കാരിക ചോദ്യരൂപവും ഗ്രീക്കിലെ ‘അറിയുക’ എന്ന അടിസ്ഥാന അർഥവും നിലനിർത്തുന്നു.
- source_word: μικρὰ ζύμη
  choice: അല്പം പുളിമാവ്
  rationale: പുരാതന അപ്പനിർമാണത്തിലെ പുളിപ്പിക്കുന്ന മാവിനെയും പഴഞ്ചൊല്ലിന്റെ സംക്ഷിപ്തഭാവത്തെയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅλον τὸ φύραμα
  choice: കുഴച്ച മാവ് മുഴുവനും
  rationale: φύραμα കുഴച്ചുചേർത്ത മാവിന്റെ പിണ്ഡത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘കുഴച്ച മാവ് മുഴുവനും’ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ζυμοῖ
  choice: പുളിപ്പിക്കുന്നു
  rationale: ζύμηയുമായുള്ള പദബന്ധവും പുളിമാവ് മാവിൽ പ്രവർത്തിക്കുന്ന ദൃശ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുളിമാവിന്റെ രൂപകപ്രയോഗം
  choice: രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘അല്പം പാപം സഭയെ മുഴുവൻ ദുഷിപ്പിക്കുന്നു’ എന്നിങ്ങനെ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുക.
  rationale: സന്ദർഭം പ്രയോഗം വ്യക്തമാക്കുന്നുവെങ്കിലും വാക്യം തന്നിൽ പൗലോസ് പഴഞ്ചൊല്ലുരൂപത്തിലുള്ള ദൃശ്യം മാത്രമാണ് പറയുന്നത്; അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ സൂചന പരിഭാഷയിൽ ചേർത്ത് നിർണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വീമ്പുപറച്ചിൽ’ ശാസനാഭാവം വ്യക്തമാക്കുന്നു; ‘പുളിമാവ്’ പുരാതന ദൃശ്യവും ബൈബിൾപരമായ രൂപകബന്ധവും നിലനിർത്തുന്നു.
