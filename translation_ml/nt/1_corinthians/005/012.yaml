  text: For what is it to me to judge outsiders? Is it not those inside that you are to judge?[a][b]
translation:
  language: ml
  text: പുറത്തുള്ളവരെ വിധിക്കാൻ എനിക്ക് എന്തു കാര്യം?[a] അകത്തുള്ളവരെയല്ലേ നിങ്ങൾ വിധിക്കേണ്ടത്?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പുറത്തുള്ളവരെ വിധിക്കുന്നതുമായി എനിക്ക് എന്തു ബന്ധം?”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, സഭാസമൂഹത്തിനകത്തുള്ളവരെ.
    reason: cultural_note
lexical_decisions:
- source_word: τί γάρ μοι
  choice: എനിക്ക് എന്തു കാര്യം?
  rationale: എന്തെങ്കിലും തനിക്കു ബന്ധപ്പെട്ട കാര്യമാണോ എന്നുചോദിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ വാചാടോപപരമായ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു. മുൻവാക്യവുമായി γάρ സൂചിപ്പിക്കുന്ന വിശദീകരണബന്ധം വാക്യത്തിന്റെ പ്രവാഹത്തിൽ നിലനിൽക്കുന്നു.
- source_word: τοὺς ἔξω
  choice: പുറത്തുള്ളവരെ
  rationale: വെറും ഭൗതികസ്ഥാനമല്ല, ക്രിസ്തീയ സമൂഹത്തിനു പുറത്തുള്ളവരെയാണ് ഈ പദം സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. എതിർപദമായ ‘അകത്തുള്ളവർ’ എന്നതിനോടുള്ള സമാന്തരതയും ഇത് കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: κρίνειν
  choice: വിധിക്കാൻ
  rationale: ചുറ്റുപാടിലുള്ള സഭാശിക്ഷണസന്ദർഭത്തിൽ κρίνω വിധിനിർണയം നടത്തുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘വിധിക്കുക’ പദത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐχὶ
  choice: അല്ലേ
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യത്തിന്റെ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἔσω
  choice: അകത്തുള്ളവരെ
  rationale: സഭാസമൂഹത്തിനകത്തുള്ളവരെ സൂചിപ്പിക്കുകയും ‘പുറത്തുള്ളവർ’ എന്നതിനോടുള്ള ഉദ്ദേശപൂർവമായ വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ὑμεῖς κρίνετε
  choice: നിങ്ങൾ വിധിക്കേണ്ടത്
  rationale: ഗ്രീക്കിൽ രൂപപരമായി വർത്തമാനകാല നിർദ്ദേശകമാണെങ്കിലും സന്ദർഭത്തിൽ സഭയുടെ ഉത്തരവാദിത്വം ഉന്നയിക്കുന്ന ബാധ്യതാഭാവം ഉണ്ട്. ‘വിധിക്കേണ്ടത്’ ആ പ്രായോഗിക ശക്തി നൽകുന്നു; ഇത് വാചാടോപചോദ്യത്തിനുള്ളിൽ തന്നെയാണ് അവതരിപ്പിച്ചിരിക്കുന്നത്.
theological_decisions:
- issue: ‘പുറത്തുള്ളവർ’ എന്നും ‘അകത്തുള്ളവർ’ എന്നും പറയുന്നത് ആരെക്കുറിച്ചാണ്
  choice: സഭാസമൂഹത്തിനു പുറത്തുള്ളവരും അതിനകത്തുള്ളവരും തമ്മിലുള്ള വ്യത്യാസമായി പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാത്തരം ധാർമിക വിലയിരുത്തലുകളെയും സംബന്ധിക്കുന്ന പൊതുവായ പ്രസ്താവനയായി വായിക്കുക.
  rationale: 1 കൊരിന്ത്യർ 5:9–13-ലെ സന്ദർഭം സഭയ്ക്കുള്ളിലെ ശിക്ഷണനടപടിയെക്കുറിച്ചാണ്. അതിനാൽ അകത്ത്/പുറത്ത് എന്ന വൈരുധ്യം നിലനിർത്തുന്നു; എന്നാൽ വാക്യം പറയുന്നതിലുപരി ഒരു വിപുലമായ സിദ്ധാന്തനിഗമനം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: ὑμεῖς κρίνετε വിവരണാത്മകമാണോ ബാധ്യതാസൂചകമാണോ
  choice: സന്ദർഭത്തിലെ ബാധ്യതാഭാവം മുൻനിർത്തി ‘നിങ്ങൾ വിധിക്കേണ്ടത്’ എന്നു നൽകി.
  alternative: രൂപപരമായി കൂടുതൽ നേരിട്ട് ‘നിങ്ങൾ വിധിക്കുന്നില്ലേ?’ എന്നു നൽകുക.
  rationale: വർത്തമാനകാല നിർദ്ദേശകത്തിന് രണ്ടു സൂക്ഷ്മതകളും വഹിക്കാനാകുമെങ്കിലും, തുടർന്നുള്ള ആജ്ഞയും സഭാശിക്ഷണത്തെക്കുറിച്ചുള്ള വാദവും ഉത്തരവാദിത്വം സൂചിപ്പിക്കുന്നു. ചോദ്യരൂപം നിലനിർത്തി ഈ ശക്തി പ്രകടമാക്കി.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാചാടോപചോദ്യങ്ങൾ ഉപയോഗിച്ചു. ‘പുറത്തുള്ളവർ/അകത്തുള്ളവർ’ എന്ന സമാന്തരത ഗ്രീക്ക് പാഠത്തിലെ സമൂഹപരമായ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
