id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: ml
  text: ഈ ലോകത്തിലെ ലൈംഗികമായി അധാർമികരെയോ അത്യാഗ്രഹികളെയോ കവർന്നെടുക്കുന്നവരെയോ[a] വിഗ്രഹാരാധകരെയോ ഉദ്ദേശിച്ചല്ല ഞാൻ പറഞ്ഞത്.[b] അങ്ങനെയെങ്കിൽ നിങ്ങൾ ലോകത്തിൽനിന്നുതന്നെ പുറത്തുപോകേണ്ടിവരുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കവർന്നെടുക്കുന്നവർ’ (ἅρπαξιν) എന്നതിന് ‘കവർച്ചക്കാർ’, ‘ബലമായി പണം തട്ടുന്നവർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ബലപ്രയോഗത്തിലൂടെയോ ചൂഷണത്തിലൂടെയോ മറ്റുള്ളവരുടേത് കൈക്കലാക്കുന്നവരെ ഈ പദം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: സഭയ്ക്കു പുറത്തുള്ള അധാർമികരെയെല്ലാം വിശ്വാസികൾ ഒഴിവാക്കണമെന്നല്ല താൻ ഉദ്ദേശിച്ചതെന്ന് പൗലോസ് വ്യക്തമാക്കുന്നു; 1 കൊരിന്ത്യർ 5:11-ലെ പ്രയോഗവുമായി താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: ഒട്ടും സഹവസിക്കരുത് എന്നല്ല ഞാൻ ഉദ്ദേശിച്ചത്
  rationale: മുൻ നിർദേശത്തിന്റെ വ്യാപ്തി വ്യക്തമാക്കുന്ന ഊന്നൽ സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘സഹവസിക്കുക’ എന്ന ആശയം മുൻവാക്യത്തിൽനിന്ന് സന്ദർഭാനുസൃതമായി പൂർത്തീകരിക്കുന്നു.
- source_word: πόρνοις
  choice: ലൈംഗിക അധാർമികർ
  rationale: ലൈംഗിക ദുർനടപ്പിന്റെ പ്രത്യേകത നിലനിർത്തുകയും ആധുനിക വായനക്കാർക്ക് വ്യക്തമായിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ κόσμου τούτου
  choice: ഈ ലോകത്തിലെ
  rationale: സഭയ്ക്കു പുറത്തുള്ള മനുഷ്യസമൂഹത്തെ സൂചിപ്പിക്കുന്ന κόσμος എന്ന പദത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: πλεονέκταις
  choice: അത്യാഗ്രഹികൾ
  rationale: കൂടുതൽ സ്വന്തമാക്കാനുള്ള അതിരില്ലാത്ത, പലപ്പോഴും ചൂഷണപരമായ ആഗ്രഹം സൂചിപ്പിക്കുന്നു.
- source_word: ἅρπαξιν
  choice: പിടിച്ചുപറിക്കാർ
  rationale: ബലപ്രയോഗത്തിലൂടെയോ ചൂഷണത്തിലൂടെയോ മറ്റുള്ളവരുടേത് കവർന്നെടുക്കുന്നവൻ എന്ന പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘തട്ടിപ്പുകാർ’ എന്നതിനെക്കാൾ വിശാലമായ മൂലാർത്ഥം നൽകുന്നു.
- source_word: εἰδωλολάτραις
  choice: വിഗ്രഹാരാധകർ
  rationale: മലയാളത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ തുല്യപദം.
- source_word: ἐπεὶ ὠφείλετε ἄρα
  choice: അങ്ങനെയെങ്കിൽ ... പോകേണ്ടിവരുമായിരുന്നു
  rationale: മുൻവാക്ക് സമ്പൂർണമായി എടുത്താൽ ഉണ്ടാകുന്ന അസാധ്യമായ പ്രായോഗിക പരിണതിയെ വ്യവസ്ഥാത്മകമായി പ്രകടമാക്കുന്നു.
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: ലോകത്തിൽനിന്നുതന്നെ പുറത്തുപോകുക
  rationale: മൂലവാക്യത്തിലെ മനഃപൂർവമായ തീക്ഷ്ണതയും അതിശയോക്തിസദൃശമായ ദൃശ്യതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: വേർപിരിയൽ നിർദേശത്തിന്റെ വ്യാപ്തി
  choice: സഭയ്ക്കു പുറത്തുള്ള അധാർമികരുമായി എല്ലാ സമ്പർക്കവും ഒഴിവാക്കണമെന്നല്ല പൗലോസ് വ്യക്തമാക്കുന്നത്.
  alternative: എല്ലാ അധാർമികരിൽനിന്നും സമ്പൂർണമായ സാമൂഹിക പിന്മാറ്റമാണ് പൗലോസ് ആവശ്യപ്പെടുന്നത്.
  rationale: വാക്യത്തിലെ οὐ πάντως എന്ന വ്യക്തമാക്കലും, അങ്ങനെ ചെയ്താൽ ലോകത്തിൽനിന്ന് പുറത്തുപോകേണ്ടിവരുമെന്ന പരിണതിയും സമ്പൂർണ സാമൂഹിക പിന്മാറ്റത്തെ നിഷേധിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ പട്ടികയുടെ ഘടന നിലനിർത്തിയിട്ടുണ്ട്. ആദ്യ ഭാഗം മുൻവാക്യത്തിൽനിന്നുള്ള ‘സഹവസിക്കരുത്’ എന്ന ആശയം വ്യക്തതയ്ക്കായി പൂർത്തീകരിക്കുന്നു.
