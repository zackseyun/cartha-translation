  to: ഈ ലോകത്തിലെ ലൈംഗികമായി അധാർമികരെയോ അത്യാഗ്രഹികളെയോ കവർന്നെടുക്കുന്നവരെയോ[a] വിഗ്രഹാരാധകരെയോ ഉദ്ദേശിച്ചല്ല ഞാൻ പറഞ്ഞത്.[b] അങ്ങനെയെങ്കിൽ നിങ്ങൾ ലോകത്തിൽനിന്നുതന്നെ പുറത്തുപോകേണ്ടിവരുമായിരുന്നു.
  rationale: The revision represents the source’s elliptical «not altogether [meaning] the people of this world» directly while retaining the necessary contextual sense of Paul’s preceding instruction. It also moves the lexical footnote to its relevant term and uses a broader Malayalam expression for ἅρπαξιν.
