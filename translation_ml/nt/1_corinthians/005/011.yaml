id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: ml
  text: 'എന്നാൽ ഇപ്പോൾ ഞാൻ നിങ്ങൾക്ക് എഴുതിയത് ഇതാണ്: സഹോദരൻ എന്നു വിളിക്കപ്പെടുന്ന ആരെങ്കിലും ലൈംഗിക അധാർമികതയിൽ ജീവിക്കുന്നവനോ അത്യാഗ്രഹിയോ വിഗ്രഹാരാധകനോ അധിക്ഷേപിക്കുന്നവനോ മദ്യപനോ അന്യായമായി മറ്റുള്ളവരുടെത് കൈക്കലാക്കുന്നവനോ ആണെങ്കിൽ, അയാളുമായി കൂട്ടുകൂടരുത്; അങ്ങനെയുള്ള ഒരാളോടൊപ്പം ഭക്ഷണം കഴിക്കുകപോലും അരുത്.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ ἔγραψα
  choice: എന്നാൽ ഇപ്പോൾ ഞാൻ നിങ്ങൾക്ക് എഴുതിയത് ഇതാണ്
  rationale: ഗ്രീക്ക് എപിസ്റ്റോളറി ഏറിസ്റ്റായ ἔγραψα-യുടെ രൂപം മാനിച്ചുകൊണ്ട്, മലയാളത്തിൽ ഇപ്പോഴത്തെ കത്തിലെ നിർദേശം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: μὴ συναναμίγνυσθαι
  choice: അയാളുമായി സഹവസിക്കരുത്
  rationale: വെറും പരിചയം ഒഴിവാക്കുക എന്നതിലുപരി അടുത്ത സാമൂഹിക ഇടപഴകൽ ഒഴിവാക്കുക എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള ഒരുമിച്ചുള്ള ഭക്ഷണനിരോധനം അതിന്റെ പരിധി വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: സഹോദരൻ എന്നു വിളിക്കപ്പെടുന്ന
  rationale: സഭാസമൂഹത്തിലെ അവകാശപ്പെട്ട തിരിച്ചറിയലിനെയാണ് വാക്യം ചൂണ്ടിക്കാണിക്കുന്നത്; ആ അവകാശവാദത്തിന്റെ സത്യാസത്യത്തെ പരിഭാഷ തീർപ്പാക്കുന്നില്ല.
- source_word: πόρνος
  choice: ലൈംഗിക അധാർമികതയിൽ ജീവിക്കുന്നവൻ
  rationale: തുടർച്ചയായ വ്യക്തിത്വസൂചനയുള്ള നാമരൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഒരൊറ്റ വീഴ്ചയെന്ന് ചുരുക്കുന്നില്ല.
- source_word: πλεονέκτης
  choice: അത്യാഗ്രഹി
  rationale: അധികം സ്വന്തമാക്കാനുള്ള ദുഷ്ടലോഭത്തെ സൂചിപ്പിക്കുന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: λοίδορος
  choice: അധിക്ഷേപിക്കുന്നവൻ
  rationale: നിന്ദിക്കുകയും വാക്കുകളാൽ ആക്രമിക്കുകയും ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പൊതുവായ ‘ദുഷിക്കുന്നവൻ’ എന്നതിനെക്കാൾ വ്യക്തമാണ്.
- source_word: μέθυσος
  choice: മദ്യപൻ
  rationale: പതിവായ മദ്യലഹരിയാൽ അറിയപ്പെടുന്നയാളെ സൂചിപ്പിക്കുന്ന സംക്ഷിപ്തവും സാധാരണവുമായ പദം.
- source_word: ἅρπαξ
  choice: പിടിച്ചുപറിക്കാരൻ
  rationale: ലോഭിയിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് ബലപ്രയോഗത്തിലൂടെയോ ചൂഷണത്തിലൂടെയോ അന്യരുടെത് കൈക്കലാക്കുന്നവനെ സൂചിപ്പിക്കുന്നു.
- source_word: τῷ τοιούτῳ μηδὲ συνεσθίειν
  choice: അങ്ങനെയുള്ള ഒരാളോടൊപ്പം ഭക്ഷണം കഴിക്കുകപോലും അരുത്
  rationale: μηδέ-യുടെ ഊന്നലും συνεσθίειν-ന്റെ ഒരുമിച്ചു ഭക്ഷണം കഴിക്കൽ എന്ന നേരിട്ടുള്ള അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘സഹോദരൻ എന്നു വിളിക്കപ്പെടുന്ന’ വ്യക്തിയുടെ യഥാർഥ ആത്മീയ നില
  choice: അവകാശപ്പെട്ട സമൂഹപരമായ തിരിച്ചറിയൽ മാത്രമായി വിവർത്തനം ചെയ്തു
  alternative: ‘സഹോദരനാണെന്ന് പറയുന്ന’ അല്ലെങ്കിൽ ‘സഹോദരൻ എന്നു പേരുള്ള’
  rationale: ὀνομαζόμενος വ്യക്തി സഹോദരൻ എന്നു അറിയപ്പെടുന്നു/വിളിക്കപ്പെടുന്നു എന്നു പറയുന്നു; അയാൾ യഥാർഥ വിശ്വാസിയാണോ എന്ന തത്ത്വചർച്ച പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
- issue: ഒരുമിച്ചുള്ള ഭക്ഷണത്തിന്റെ പരിധി
  choice: പൊതുവായി ‘ഒപ്പം ഭക്ഷണം കഴിക്കുക’ എന്നു നിലനിർത്തി
  alternative: കർത്തൃമേശയിൽ മാത്രം പങ്കുചേരരുത് എന്നോ എല്ലാ സാധാരണ സമ്പർക്കവും പൂർണമായി വിലക്കുന്നു എന്നോ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പാഠം ഭക്ഷണത്തിന്റെ പ്രത്യേക തരം വ്യക്തമാക്കുന്നില്ല; അതിനാൽ സഭാഭോജനമോ സാധാരണ സാമൂഹിക ഭക്ഷണമോ മാത്രമായി പരിമിതപ്പെടുത്തിയിട്ടില്ല.
- issue: പട്ടികപ്പെടുത്തിയ പെരുമാറ്റങ്ങളുടെ സ്വഭാവം
  choice: വ്യക്തിയെ തിരിച്ചറിയിക്കുന്ന സ്ഥിരമായ/പ്രകടമായ ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന നാമപ്രയോഗങ്ങൾ ഉപയോഗിച്ചു
  alternative: ഒരിക്കൽ അത്തരം പാപം ചെയ്ത ഏതു വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന ക്രിയാപ്രയോഗം
  rationale: ഗ്രീക്കിൽ വിശേഷണാത്മക നാമങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എന്നാൽ മാനസാന്തരമില്ലായ്മ പോലുള്ള ആശയം പാഠത്തിൽ ഇല്ലാത്തതിനാൽ അതു നേരിട്ട് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പട്ടികയുടെ സമാന്തരഘടനയും അവസാന നിരോധനത്തിന്റെ ഊന്നലും സംരക്ഷിച്ചു; മൂലപാഠത്തിൽ ഇല്ലാത്ത സഭാശിക്ഷാ സാങ്കേതികപദങ്ങൾ ഒഴിവാക്കി.
