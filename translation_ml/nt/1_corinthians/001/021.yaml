id: 1CO.1.21
reference: 1 Corinthians 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ ജ്ഞാനത്തിൽ ലോകം ജ്ഞാനത്തിലൂടെ ദൈവത്തെ അറിഞ്ഞില്ല; അതിനാൽ, പ്രഘോഷണത്തിന്റെ ഭോഷത്വത്തിലൂടെ[a][b] വിശ്വസിക്കുന്നവരെ രക്ഷിക്കാൻ ദൈവം പ്രസാദിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പ്രസംഗിക്കുന്നതിന്റെ ഭോഷത്വത്തിലൂടെ.”
    reason: alternative_reading
  - marker: b
    text: അതായത്, ലോകം ഭോഷത്വമായി കണക്കാക്കുന്ന പ്രഘോഷിക്കപ്പെട്ട സന്ദേശം.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: എന്തെന്നാൽ ... അതുകൊണ്ട്
  rationale: γάρ-ന്റെ വിശദീകരണബന്ധവും ἐπειδή-യുടെ കാരണാർഥവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ജ്ഞാനത്തിൽ
  rationale: ἐν എന്നതിന്റെ മണ്ഡലപരമോ ക്രമീകരണപരമോ ആയ അർഥസാധ്യത തീർപ്പാക്കാതെ മൂലപാഠത്തിന്റെ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: οὐκ ἔγνω ὁ κόσμος ... τὸν θεόν
  choice: ലോകം ... ദൈവത്തെ അറിഞ്ഞില്ല
  rationale: γινώσκω എന്നതിലെ ബൗദ്ധികവും ബന്ധപരവുമായ വ്യാപ്തി നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: διὰ τῆς σοφίας
  choice: ജ്ഞാനത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ ഉപാധി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; 'ലോകത്തിന്റെ ജ്ഞാനം' എന്ന് പാഠത്തിൽ ഇല്ലാത്ത ഉടമസ്ഥത ചേർക്കുന്നില്ല.
- source_word: εὐδόκησεν ὁ θεὸς
  choice: ദൈവം പ്രസാദിച്ചു
  rationale: ദൈവത്തിന്റെ നല്ല ഇഷ്ടം എന്ന ആശയം നിലനിർത്തുന്നു; വെറും 'തീരുമാനിച്ചു' എന്നതിനെക്കാൾ εὐδοκέω-യുടെ ഭാവം അടുത്തായി നൽകുന്നു.
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: പ്രഘോഷണത്തിന്റെ ഭോഷത്തത്തിലൂടെ
  rationale: κήρυγμα പ്രഘോഷിക്കപ്പെട്ട സന്ദേശത്തെയും പ്രഘോഷണത്തെയും സൂചിപ്പിക്കാവുന്നതിനാൽ ആ ഇരട്ടസാധ്യത നിലനിർത്തുന്നു; μωρία-യുടെ ഉദ്ദേശപൂർവമായ വിരോധാഭാസവും മയപ്പെടുത്തുന്നില്ല.
- source_word: σῶσαι τοὺς πιστεύοντας
  choice: വിശ്വസിക്കുന്നവരെ രക്ഷിക്കാൻ
  rationale: σῴζω-യ്ക്ക് പതിവായ രക്ഷാഭാഷയും substantival present participle-ന്റെ വ്യക്തമായ അർഥവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος എന്നതിന്റെ അർഥം
  choice: പ്രഘോഷിക്കപ്പെട്ട സന്ദേശം ഭോഷത്തമായി കണക്കാക്കപ്പെടുന്നതാണ് മുഖ്യസൂചന; എന്നാൽ പ്രഘോഷിക്കുന്ന പ്രവൃത്തിയുടെ നിഴലർഥവും തുറന്നുവെക്കുന്നു
  alternative: പ്രസംഗിക്കൽ എന്ന രീതിയുടെ ഭോഷത്തം മാത്രം
  rationale: κήρυγμα സാധാരണയായി പ്രഘോഷിക്കപ്പെട്ട ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുമെങ്കിലും പ്രവൃത്തിയെയും അനുനാദിപ്പിക്കാം. 'പ്രഘോഷണം' രണ്ടും പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല; ഭോഷത്തം ദൈവത്തിന്റെ വിലയിരുത്തലാണെന്ന് തെറ്റായി ഉറപ്പിക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് വിശദീകരിക്കുന്നു.
- issue: ἐν τῇ σοφίᾳ τοῦ θεοῦയിലെ ἐν
  choice: ദൈവത്തിന്റെ ജ്ഞാനത്തിൽ
  alternative: ദൈവത്തിന്റെ ജ്ഞാനത്താൽ
  rationale: മണ്ഡലം, ക്രമീകരണം, ഉപാധി എന്നീ സാധ്യതകളിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കാതെ ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. 'പ്രഘോഷണം', 'പ്രസാദിച്ചു' എന്നീ പദങ്ങൾ പൗലോസിന്റെ ഔപചാരികവും ദൈവശാസ്ത്രപരവുമായ ഭാവം നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
