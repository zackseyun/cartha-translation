revisions:
- from: എന്തെന്നാൽ, ദൈവത്തിന്റെ ജ്ഞാനത്തിൽ, ലോകം ജ്ഞാനത്തിലൂടെ ദൈവത്തെ അറിഞ്ഞില്ല. അതുകൊണ്ട്, വിശ്വസിക്കുന്നവരെ രക്ഷിക്കാൻ പ്രഘോഷണത്തിന്റെ ഭോഷത്തത്തിലൂടെ[a] ദൈവം പ്രസാദിച്ചു.[b]
