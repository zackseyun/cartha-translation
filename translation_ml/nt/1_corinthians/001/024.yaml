id: 1CO.1.24
reference: 1 Corinthians 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: ml
  text: എന്നാൽ വിളിക്കപ്പെട്ടവരായ യെഹൂദന്മാർക്കും ഗ്രീക്കുകാർക്കും മിശിഹാ[a] ദൈവത്തിന്റെ ശക്തിയും ദൈവത്തിന്റെ ജ്ഞാനവും ആകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ക്രിസ്തു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλητοῖς
  choice: വിളിക്കപ്പെട്ടവർക്ക്
  rationale: വിശേഷണം നാമരൂപത്തിൽ ഉപയോഗിച്ച് ദൈവത്തിന്റെ വിളിയാൽ തിരിച്ചറിയപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘വിളിക്കപ്പെട്ടവർ’ എന്നത് അതിന്റെ ക്രിയാത്മക അർഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἰουδαίοις
  choice: യെഹൂദന്മാർക്ക്
  rationale: ‘ഗ്രീക്കുകാർ’ എന്നതിനോടുള്ള പൗലോസിന്റെ വംശീയ-മതപരമായ വിപരീതജോടിയിൽ ‘യെഹൂദന്മാർ’ എന്നതാണ് വ്യക്തവും യോജിച്ചതുമായ പരിഭാഷ.
- source_word: Ἕλλησιν
  choice: ഗ്രീക്കുകാർക്ക്
  rationale: മൂലപാഠത്തിൽ ഉപയോഗിച്ചിരിക്കുന്ന ‘ഗ്രീക്കുകാർ’ എന്ന പദം തന്നെയാണ് നിലനിർത്തിയത്; ‘വിജാതീയർ’ എന്ന വിശാലമായ വ്യാഖ്യാനപദം സ്വീകരിച്ചില്ല.
- source_word: Χριστόν
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുകയും യേശുവിന്റെ മശീഹാത്വം സൂചിപ്പിക്കുകയും ചെയ്യുന്നതിനാൽ അതിന്റെ അർഥം പരിഭാഷപ്പെടുത്തി.
- source_word: θεοῦ δύναμιν
  choice: ദൈവത്തിന്റെ ശക്തി
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടനയും ‘ദൈവത്തിന്റെ’ എന്ന ആവർത്തനവും നിലനിർത്തുന്ന ഔപചാരികവും സ്വാഭാവികവുമായ മലയാളം.
- source_word: θεοῦ σοφίαν
  choice: ദൈവത്തിന്റെ ജ്ഞാനം
  rationale: സമാന്തരമായ മുൻപ്രയോഗത്തോടൊപ്പം മൂലപാഠത്തിലെ ആവർത്തനവും ദൈവബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: implicit copula / verbless predicate relation
  choice: മശീഹാ ... ആകുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന വിധേയബന്ധം മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി പ്രകടിപ്പിക്കാൻ ‘ആകുന്നു’ ചേർത്തു.
theological_decisions:
- issue: Χριστός എന്ന മശീഹാസംബന്ധിയായ സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായതിനാൽ ‘മശീഹാ’ എന്ന് പരിഭാഷപ്പെടുത്തി; പരിചിതമായ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ദാതിവ് സമാനാധികരണബന്ധം വ്യക്തമാക്കാൻ ഇടവരകൾ ഉപയോഗിച്ചു; ‘ദൈവത്തിന്റെ’ എന്ന മൂലപാഠത്തിലെ ആവർത്തനം നിലനിർത്തി.
