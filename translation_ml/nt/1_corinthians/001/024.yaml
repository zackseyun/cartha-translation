    rationale: Recasting these as “വിളിക്കപ്പെട്ടവരായ യെഹൂദന്മാർക്കും ഗ്രീക്കുകാർക്കും” makes explicit that Jews and Greeks are the called persons, while retaining the source syntax and scope.
