  naturalness: “വിളിക്കപ്പെട്ടവർക്കാകട്ടെ—യെഹൂദന്മാർക്കും ഗ്രീക്കുകാർക്കും—” is understandable, but the separated dative phrases and em dashes are less smooth than a single modifier phrase. “വിളിക്കപ്പെട്ടവരായ യെഹൂദന്മാർക്കും ഗ്രീക്കുകാർക്കും” is natural modern standard Malayalam and expresses the intended group without loss.
