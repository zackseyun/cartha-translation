id: 1CO.1.1
reference: 1 Corinthians 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παῦλος κλητὸς ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Σωσθένης ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/001.yaml
  text: Paul[a], a called apostle of Messiah Jesus by the will of God, and Sosthenes our brother,
translation:
  language: ml
  text: ദൈവഹിതത്താൽ മശീഹ യേശുവിന്റെ വിളിക്കപ്പെട്ട അപ്പൊസ്തലനായ പൗലോസും നമ്മുടെ സഹോദരനായ സൊസ്ഥേനേസും,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം.
- source_word: κλητὸς ἀπόστολος
  choice: അപ്പൊസ്തലനായി വിളിക്കപ്പെട്ട
  rationale: κλητός എന്ന വിശേഷണം പൗലോസിന്റെ അപ്പൊസ്തലപദവിയോടു ബന്ധപ്പെട്ടു നിൽക്കുന്നു; മലയാളത്തിൽ അർഥം സ്വാഭാവികമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ അഭിഷിക്തപദവിയെ സൂചിപ്പിക്കുന്ന ശീർഷകമായി ഗ്രഹിച്ച് ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; മലയാള വ്യാകരണത്തിനായി ‘ആയ’ ചേർത്തു.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവഹിതത്താൽ
  rationale: διά സഹിതമുള്ള ഷഷ്ഠീവാക്യം ഇവിടെ ദൈവഹിതം മുഖാന്തരമോ അടിസ്ഥാനമോ ആയുള്ള നിയമനത്തെ സൂചിപ്പിക്കുന്നു; സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: Σωσθένης
  choice: സോസ്തനേസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നേരിട്ടുള്ള മലയാള ലിപ്യന്തരണം.
- source_word: ὁ ἀδελφὸς
  choice: നമ്മുടെ സഹോദരനായ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലെങ്കിലും ലേഖനാഭിവാദ്യത്തിലെ ὁ ἀδελφός വിശ്വാസസമൂഹബന്ധം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ‘നമ്മുടെ സഹോദരൻ’ എന്നത് സ്വാഭാവിക മലയാളത്തിൽ ആ ബന്ധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അഭിവാദ്യത്തിൽ Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ വാക്യത്തിൽ Χριστός യേശുവിന്റെ അഭിഷിക്തപദവിയെ സൂചിപ്പിക്കുന്ന ശീർഷകമായി വായിക്കാവുന്നതിനാൽ ‘മശീഹ’ മുഖ്യവാചകത്തിൽ നൽകി; പരമ്പരാഗതവും നാമസദൃശവുമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: κλητός എന്നതും അപ്പൊസ്തലപദവിയും തമ്മിലുള്ള ബന്ധം
  choice: അപ്പൊസ്തലനായി വിളിക്കപ്പെട്ട
  alternative: വിളിക്കപ്പെട്ട അപ്പൊസ്തലൻ
  rationale: രണ്ടും ഗ്രീക്ക് ഘടന സാധുവായി പ്രതിഫലിപ്പിക്കുന്നു; തിരഞ്ഞെടുത്ത രൂപം പൗലോസ് ദൈവവിളിയാൽ അപ്പൊസ്തലനായെന്ന ബന്ധം സാധാരണ മലയാളവായനക്കാർക്ക് കൂടുതൽ സ്വാഭാവികമായി നൽകുന്നു, പ്രത്യേകമായൊരു സമ്പ്രദായവ്യാഖ്യാനം ചേർക്കാതെ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ലേഖനാഭിവാദ്യശൈലി. വാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
