    text: അഥവാ, “ക്രിസ്തുയേശുവിന്റെ.”
    reason: Χριστοῦ Ἰησοῦ എന്നതിന് പരമ്പരാഗതവും കൂടുതൽ നാമസദൃശവുമായ പരിഭാഷാവികൽപം.
  revision_rationale: The revision more closely mirrors the appositional force of κλητὸς ἀπόστολος, improves the natural Malayalam title-plus-name construction for Χριστοῦ Ἰησοῦ, and regularizes the transliteration of Σωσθένης. The footnote remains correctly anchored to «യേശുവിന്റെ» and preserves the stated lexical alternative.
