- from: ദൈവഹിതത്താൽ മശീഹയായ യേശുവിന്റെ[a] അപ്പൊസ്തലനായി വിളിക്കപ്പെട്ട പൗലോസും നമ്മുടെ സഹോദരനായ സോസ്തനേസും,
  to: ദൈവഹിതത്താൽ മശീഹ യേശുവിന്റെ വിളിക്കപ്പെട്ട അപ്പൊസ്തലനായ പൗലോസും നമ്മുടെ സഹോദരനായ സൊസ്ഥേനേസും,
