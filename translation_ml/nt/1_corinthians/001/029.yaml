translation:
  language: ml
  text: ഒരു ജഡവും ദൈവസന്നിധിയിൽ വീമ്പ് പറയാതിരിക്കേണ്ടതിന്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘ഒരു മനുഷ്യനും ദൈവസന്നിധിയിൽ വീമ്പ് പറയാതിരിക്കേണ്ടതിന്.’ അക്ഷരാർഥം: ‘ഒരു ജഡവും.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: അങ്ങനെ … ഇരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ καυχήσηται
  choice: വീമ്പുപറയാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യവാക്യത്തിലെ നിഷേധത്തോടുകൂടിയ സബ്ജങ്ക്റ്റീവ് ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘വീമ്പുപറയുക’ എന്നത് സ്വയം പുകഴ്ത്തുന്നതിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: πᾶσα σὰρξ
  choice: ഒരു ജഡവും
  rationale: നിഷേധവാക്യത്തിൽ ‘സകല ജഡവും’ എന്നതിന്റെ സാർവത്രികമായ ഒഴിവാക്കൽ മലയാളത്തിലെ ‘ഒരു ജഡവും … ഇല്ല’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു; അതോടൊപ്പം പൗലോസിന്റെ ‘ജഡം’ എന്ന രൂപകാത്മക-വേദപുസ്തകീയ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ, അവന്റെ സാന്നിധ്യത്തിൽ എന്ന അർഥം നൽകുന്ന സംക്ഷിപ്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപ്രയോഗമാണ്.
theological_decisions:
- issue: പൗലോസിന്റെ σάρξ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: പ്രധാന പാഠത്തിൽ ‘ജഡം’ നിലനിർത്തുക
  alternative: ‘മനുഷ്യൻ’ എന്നു വിവർത്തനം ചെയ്യുക
  rationale: ഇവിടെ പദം ‘പാപസ്വഭാവം’ എന്ന ആന്തരിക ധാർമിക തത്ത്വത്തെക്കാൾ ദൈവത്തിന്റെ മുമ്പിലുള്ള മനുഷ്യകുലത്തിന്റെ സൃഷ്ടിജീവിയായ ദൗർബല്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജഡം’ എന്നത് പൗലോസിന്റെ വാചകഭംഗിയും യഥാർഥ പദത്തിന്റെ വിശാലതയും സംരക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് ഉദ്ദേശിക്കുന്ന മനുഷ്യസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ജഡം’ വേദപുസ്തകീയ പദഭംഗി നിലനിർത്തുമ്പോൾ, ‘വീമ്പുപറയുക’ സാധാരണ വായനക്കാർക്ക് καυχάομαι എന്നതിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
