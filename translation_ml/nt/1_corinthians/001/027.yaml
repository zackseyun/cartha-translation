id: 1CO.1.27
reference: 1 Corinthians 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: ml
  text: എന്നാൽ ജ്ഞാനികളെ ലജ്ജിപ്പിക്കാനായി[b] ദൈവം ലോകത്തിലെ മൂഢമായവയെ[a] തിരഞ്ഞെടുത്തു; ശക്തമായവയെ ലജ്ജിപ്പിക്കാനായി[b] ദൈവം ലോകത്തിലെ ദുർബലമായവയെ[c] തിരഞ്ഞെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ലോകം മൂഢമെന്നു കരുതുന്നവയെ.” ഗ്രീക്കിൽ നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “ലജ്ജിപ്പിക്കുക” എന്നതിന് “നാണംകെടുത്തുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ലോകം ദുർബലമെന്നു കരുതുന്നവയെ.” ഇവിടെയും ഗ്രീക്കിൽ നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: τὰ μωρὰ τοῦ κόσμου
  choice: ലോകത്തിലെ ഭോഷമായവയെ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നതിനെ ‘-മായവ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു; ആളുകളിലേക്കു മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἐξελέξατο
  choice: തിരഞ്ഞെടുത്തു
  rationale: ദൈവത്തിന്റെ മനഃപൂർവമായ തിരഞ്ഞെടുപ്പിനെ വ്യക്തവും സാധാരണവുമായ ഭാഷയിൽ അറിയിക്കുന്നു.
- source_word: ἵνα
  choice: -ക്കാനായി
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καταισχύνῃ
  choice: ലജ്ജിപ്പിക്കാനായി
  rationale: ‘ലജ്ജിപ്പിക്കുക/നാണംകെടുത്തുക’ എന്ന അർഥപരിധിയിൽ, ഗൗരവമുള്ളതും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τοὺς σοφούς
  choice: ജ്ഞാനികളെ
  rationale: പുരുഷലിംഗ ബഹുവചന നാമവാചക വിശേഷണത്തെ ആളുകളെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ കൃത്യമായി നൽകുന്നു.
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: ലോകത്തിലെ ദുർബലമായവയെ
  rationale: നപുംസകലിംഗ ബഹുവചന നാമവാചക പ്രയോഗത്തിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കുകയും ആളുകളിലേക്കു മാത്രം പരിമിതപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ ἰσχυρά
  choice: ശക്തമായവയെ
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ബഹുവചനവും ‘ദുർബലമായവ’യോടുള്ള സമാന്തര വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἵνα എന്നതിന്റെ ഉദ്ദേശ്യാർഥം
  choice: ‘ലജ്ജിപ്പിക്കാനായി’ എന്ന നേരിട്ടുള്ള ഉദ്ദേശ്യപ്രയോഗം
  alternative: ‘അങ്ങനെ ... ലജ്ജിതരാകുംവിധം’ എന്ന ഫലാർഥപ്രയോഗം
  rationale: ഇവിടെ ἵνα ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പിന്റെ ഉദ്ദേശ്യം അവതരിപ്പിക്കുന്നു; അതിനെ വെറും അനന്തരഫലമായി മൃദൂകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു സമാന്തര ഘടകങ്ങളും ദൈവം എന്ന കർത്താവിന്റെ ആവർത്തനവും നിലനിർത്തി. ‘ഭോഷമായവ’, ‘ദുർബലമായവ’, ‘ശക്തമായവ’ എന്നീ രൂപങ്ങൾ വസ്തുക്കളെയും സാഹചര്യങ്ങളെയും ആളുകളെയും ഉൾക്കൊള്ളാവുന്ന മൂലപാഠത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു.
