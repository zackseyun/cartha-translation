id: 1CO.1.11
reference: 1 Corinthians 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: ml
  text: കാരണം, എന്റെ സഹോദരങ്ങളേ[a], നിങ്ങളുടെ ഇടയിൽ കലഹങ്ങളുണ്ടെന്ന് ക്ലോയെക്കു ബന്ധപ്പെട്ടവരിൽനിന്ന് എനിക്ക് നിങ്ങളെക്കുറിച്ച് അറിയിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ സഹോദരന്മാരും സഹോദരിമാരും.’ ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്; എന്നാൽ ഈ അഭിസംബോധന വിശ്വാസിസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: അറിവു ലഭിച്ചിരിക്കുന്നു
  rationale: വിവരം പൗലോസിനെ അറിയിക്കപ്പെട്ടു എന്ന നിഷ്ക്രിയ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γάρ
  choice: (വാക്യത്തിന്റെ വിശദീകരണബന്ധത്തിൽ ഉൾക്കൊള്ളിച്ചു)
  rationale: മുൻവാക്യത്തിലെ ആഹ്വാനത്തിന് ഇതു നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിലൂടെ നിലനിർത്തുന്നു; ഒറ്റപ്പെട്ട ‘കാരണം’ ഇവിടെ അസ്വാഭാവികമാകാം.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: ഗ്രീക്ക് പദസമുച്ചയത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; സഭാസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὸ τῶν Χλόης
  choice: ക്ലോവയുടെ ആളുകളാണ്
  rationale: ക്ലോവയുമായി ബന്ധപ്പെട്ട ആളുകൾ എന്ന അർഥം നൽകുന്നു; ‘വീട്ടുകാർ’ എന്നു പറഞ്ഞ് ബന്ധത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἔριδες
  choice: കലഹങ്ങൾ
  rationale: വ്യക്തികൾ തമ്മിലുള്ള തർക്കങ്ങളെയും സംഘർഷങ്ങളെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക പദം; വിശാലമായ ‘ഭിന്നതകൾ’ എന്നതിനെക്കാൾ ഇവിടെ കൃത്യം.
- source_word: ἐν ὑμῖν εἰσιν
  choice: നിങ്ങളുടെ ഇടയിൽ ... ഉണ്ടെന്ന്
  rationale: അസ്തിത്വപ്രയോഗത്തെ സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: സമ്മിശ്രലിംഗ സഭാസമൂഹത്തിൽ ἀδελφοί എന്ന അഭിസംബോധനയുടെ വിവർത്തനം
  choice: എന്റെ സഹോദരങ്ങളേ
  alternative: എന്റെ സഹോദരീസഹോദരങ്ങളേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുരുഷലിംഗ ബഹുവചനം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അത് വിശ്വാസിസമൂഹത്തെ മുഴുവനായി ഉൾക്കൊള്ളാം എന്ന യഥാർഥ അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ വിവരക്രമം സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ വ്യക്തതയ്ക്കായി റിപ്പോർട്ട് ചെയ്ത ഉള്ളടക്കം അവസാനത്തിൽ നൽകിയിരിക്കുന്നു.
