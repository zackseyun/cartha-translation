id: 1CO.1.19
reference: 1 Corinthians 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, എഴുതിയിരിക്കുന്നു: “ജ്ഞാനികളുടെ ജ്ഞാനം ഞാൻ നശിപ്പിക്കും; വിവേകികളുടെ വിവേകം ഞാൻ തള്ളിക്കളയും.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “വിവേകികളുടെ വിവേകം ഞാൻ നിരസിക്കും,” “അസാധുവാക്കും,” അല്ലെങ്കിൽ “നിഷ്ഫലമാക്കും.”'
    reason: ἀθετήσω എന്നതിന് നിരസിക്കുക, അസാധുവാക്കുക, നിഷ്ഫലമാക്കുക എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: γέγραπται
  choice: ഇങ്ങനെ എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സമ്പൂർണ കർമണി സൂത്രവാക്യത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻ പ്രസ്താവനയ്ക്കുള്ള അടിസ്ഥാനമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Ἀπολῶ
  choice: ഞാൻ നശിപ്പിക്കും
  rationale: ἀπόλλυμι എന്ന ക്രിയയുടെ ശക്തിയും ഭാവികാലരൂപവും നേരിട്ട് നിലനിർത്തുന്നു; അർഥം അനാവശ്യമായി തീവ്രമാക്കുന്നില്ല.
- source_word: σοφίαν τῶν σοφῶν
  choice: ജ്ഞാനികളുടെ ജ്ഞാനം
  rationale: മൂലത്തിലെ ഒരേ പദകുടുംബത്തിന്റെ ആവർത്തനവും വാക്ചാതുര്യമുള്ള സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
- source_word: σύνεσιν τῶν συνετῶν
  choice: വിവേകികളുടെ വിവേകം
  rationale: ഗ്രഹണശക്തി, തിരിച്ചറിവ്, വിവേചനം എന്നീ അർഥപരിധികൾ ഉൾക്കൊള്ളുകയും മൂലത്തിലെ cognate ആവർത്തനം മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀθετήσω
  choice: ഞാൻ തള്ളിക്കളയും
  rationale: നിരസിക്കുക, മാറ്റിവയ്ക്കുക, അസാധുവാക്കുക എന്നീ സാധ്യതകളിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ തിരഞ്ഞെടുത്തു; പദത്തിന്റെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിൽ ദൈവം മനുഷ്യജ്ഞാനത്തെ മറിച്ചിടുന്ന വിധം
  choice: “ഞാൻ നശിപ്പിക്കും / ഞാൻ തള്ളിക്കളയും” എന്ന നിയന്ത്രിതമായ ഭാവികാലപ്രയോഗങ്ങൾ
  alternative: “ഞാൻ നിഷ്ഫലമാക്കും” അല്ലെങ്കിൽ “ഞാൻ അസാധുവാക്കും” എന്ന കൂടുതൽ ഫലകേന്ദ്രിതമായ പ്രയോഗങ്ങൾ
  rationale: ഗ്രീക്കിലെ രണ്ട് വ്യത്യസ്ത ക്രിയകളുടെ ശക്തിയും പൗലോസിന്റെ സമാന്തരഘടനയും നിലനിർത്തുന്നു; പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവവും സാധാരണ വായനക്കാർക്ക് വ്യക്തതയും ചേർത്ത ശൈലി. “ജ്ഞാനികളുടെ ജ്ഞാനം / വിവേകികളുടെ വിവേകം” എന്ന സമാന്തരത മൂലത്തിലെ വാക്ചാതുര്യം സംരക്ഷിക്കുന്നു.
