id: 1CO.1.13
reference: 1 Corinthians 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: ml
  text: മശീഹാ വിഭജിക്കപ്പെട്ടിരിക്കുന്നുവോ?[a] പൗലോസാണോ നിങ്ങൾക്കുവേണ്ടി ക്രൂശിക്കപ്പെട്ടത്? അല്ലെങ്കിൽ പൗലോസിന്റെ നാമത്തിലേക്കാണോ നിങ്ങൾ സ്നാനം ഏറ്റത്?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു വിഭജിക്കപ്പെട്ടിരിക്കുന്നുവോ?”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പൗലോസിന്റെ നാമത്തിലാണോ നിങ്ങൾ സ്നാനം ഏറ്റത്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμέρισται
  choice: വിഭജിക്കപ്പെട്ടിരിക്കുന്നുവോ
  rationale: ഗ്രീക്കിലെ perfect passive സൂചിപ്പിക്കുന്ന, സംഭവിച്ച വിഭജനത്തിന്റെ ഇപ്പോഴത്തെ ഫലം നിലനിൽക്കുന്നു എന്ന ഭാവം ഈ രൂപം സംരക്ഷിക്കുന്നു. അതേസമയം പൗലോസിന്റെ നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യരൂപവും നിലനിർത്തുന്നു.
- source_word: ὁ Χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ നിർദേശകപദത്തോടുകൂടിയ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രാധാന്യത്തോടെ വരുന്നതിനാൽ ‘മശീഹാ’ എന്നു നൽകി; പാരമ്പര്യമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: μὴ
  choice: ചോദ്യരൂപത്തിൽ പരോക്ഷമായി പ്രകടിപ്പിച്ചു
  rationale: μή നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന അലങ്കാരചോദ്യത്തെ അടയാളപ്പെടുത്തുന്നു. മലയാളത്തിൽ അധികമായി ‘ഒരിക്കലുമല്ലല്ലോ’ പോലുള്ള വ്യാഖ്യാനം ചേർക്കാതെ ചോദ്യത്തിന്റെ ഘടനതന്നെ ആ പ്രതീക്ഷ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐσταυρώθη
  choice: ക്രൂശിക്കപ്പെട്ടത്
  rationale: aorist passive രൂപവും ക്രൂശുമരണത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള അർഥവും വ്യക്തമായി സംരക്ഷിക്കുന്ന സാധാരണ മലയാളപ്രയോഗം.
- source_word: ὑπὲρ ὑμῶν
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ പ്രതിനിധാനപരമോ പകരമായോ ഉള്ള സാധ്യതകൾ അമിതമായി നിർവചിക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εἰς τὸ ὄνομα
  choice: നാമത്തിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ദിശാത്മകവും ബന്ധത്തിലേക്കുള്ള പ്രവേശനത്തെ സൂചിപ്പിക്കാവുന്നതുമായ ശക്തി സംരക്ഷിക്കാൻ ‘നാമത്തിലേക്ക്’ എന്നു നൽകി. കൂടുതൽ പതിവായ ‘നാമത്തിൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- source_word: ἐβαπτίσθητε
  choice: നിങ്ങൾ സ്നാനം ഏറ്റത്
  rationale: ഗ്രീക്കിലെ passive ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന പ്രയോഗമാണിത്; ‘സ്നാനപ്പെടുത്തപ്പെട്ടത്’ എന്ന കൃത്രിമഭാവം ഒഴിവാക്കുകയും ചോദ്യത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അലങ്കാരചോദ്യത്തിൽ Χριστός എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ὁ Χριστός എന്ന രൂപത്തിൽ സ്ഥാനപ്പേരിന്റെ അർഥം മുന്നിട്ടുനിൽക്കുന്നതിനാൽ ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. വായനക്കാർക്ക് പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- issue: εἰς τὸ ὄνομα എന്ന സ്നാനപ്രയോഗത്തിന്റെ ബന്ധപരമായ അർഥം
  choice: നാമത്തിലേക്ക്
  alternative: നാമത്തിൽ
  rationale: ഒരു വ്യക്തിയോടുള്ള ഐക്യത്തിലേക്കോ ബന്ധത്തിലേക്കോ പ്രവേശനം എന്ന സാധ്യത തുറന്നുവെക്കാൻ εἰς-ന്റെ ദിശാത്മകത സംരക്ഷിച്ചു; അതിനെ പ്രത്യേകമായൊരു സ്നാനസിദ്ധാന്തമായി വിശദീകരിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘പൗലോസാണോ’ എന്നും ‘നാമത്തിലേക്കാണോ’ എന്നും ഉള്ള ഊന്നൽരൂപങ്ങൾ ഗ്രീക്ക് ചോദ്യങ്ങളുടെ വാക്യഘടനയും ശക്തിയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. സഭാപരമായി പരിചിതമായ ‘ക്രൂശിക്കപ്പെട്ടത്’, ‘സ്നാനം’ എന്നീ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും ഏതെങ്കിലും പ്രത്യേക വിഭാഗത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
