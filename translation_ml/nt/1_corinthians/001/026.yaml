id: 1CO.1.26
reference: 1 Corinthians 1:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: ml
  text: 'സഹോദരങ്ങളേ,[a] നിങ്ങളുടെ വിളിയെക്കുറിച്ച് ചിന്തിച്ചുനോക്കൂ: മാനുഷിക മാനദണ്ഡമനുസരിച്ച് ജ്ഞാനികളായവർ നിങ്ങളിൽ അധികമില്ല; ശക്തരായവർ അധികമില്ല; കുലീനകുടുംബത്തിൽ ജനിച്ചവർ അധികമില്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരങ്ങളേ” എന്നത് ഇവിടെ സഭാസമൂഹത്തെ മുഴുവനായി അഭിസംബോധന ചെയ്യുന്നതാണ്; വിശ്വാസികളായ സ്ത്രീകളും പുരുഷന്മാരും ഇതിൽ ഉൾപ്പെടുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: ചിന്തിച്ചുനോക്കൂ
  rationale: രൂപം നിർദേശമായോ പ്രസ്താവനയായോ വായിക്കാമെങ്കിലും, സന്ദർഭത്തിൽ സ്വന്തം അവസ്ഥയെക്കുറിച്ച് ആലോചിക്കാൻ പൗലോസ് വായനക്കാരെ പ്രേരിപ്പിക്കുന്നു. ‘ചിന്തിച്ചുനോക്കൂ’ ഈ ആഹ്വാനത്തിന്റെ സ്വാഭാവിക മലയാളഭാവം നൽകുന്നു.
- source_word: κλῆσιν
  choice: വിളി
  rationale: ഇവിടെ തൊഴിൽ അല്ല, വിശ്വാസികളുടെ നില നിർണയിക്കുന്ന ദൈവത്തിന്റെ വിളിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിളി’ പൗലോസിന്റെ പ്രയോഗത്തോടും മലയാള ക്രൈസ്തവ ഭാഷയോടും യോജിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമാണ്. മുഖ്യവാചകത്തിൽ അത് നിലനിർത്തുകയും സഭയിലെ സ്ത്രീകളെയും പുരുഷന്മാരെയും കൂട്ടമായി അഭിസംബോധന ചെയ്യുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: οὐ πολλοὶ ... σοφοὶ
  choice: ജ്ഞാനികളായവർ നിങ്ങളിൽ അധികമില്ല
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗത്തിൽ കൊരിന്ത്യരോടുള്ള സൂചന അന്തർലീനമാണ്. മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘നിങ്ങളിൽ’ ചേർത്തു; ‘അധികമില്ല’ എന്നത് οὐ πολλοί എന്ന ആവർത്തനത്തെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: κατὰ σάρκα
  choice: മാനുഷിക മാനദണ്ഡമനുസരിച്ച്
  rationale: അക്ഷരാർഥമായ ‘ജഡപ്രകാരം’ എന്നതിലുപരി ഇവിടെ മനുഷ്യരുടെ വിലയിരുത്തൽരീതിയെയാണ് സൂചിപ്പിക്കുന്നത്. ഈ പരിഭാഷ അർഥം വ്യക്തമാക്കുന്നു; പാപസ്വഭാവം എന്ന മറ്റൊരു പൗലോസീയ അർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: δυνατοί
  choice: ശക്തരായവർ
  rationale: സാമൂഹികമോ രാഷ്ട്രീയമോ ആയ പ്രാബല്യം ഉൾക്കൊള്ളാവുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘സ്വാധീനമുള്ളവർ’ എന്നു പറഞ്ഞ് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: εὐγενεῖς
  choice: കുലീനജന്മമുള്ളവർ
  rationale: ഉയർന്ന കുടുംബവംശത്തിലോ സാമൂഹിക പദവിയിലോ ജനിച്ചവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘കുലീനജന്മമുള്ളവർ’ ആ ജന്മസംബന്ധമായ ആശയം വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: κατὰ σάρκα എന്നതിന്റെ അർഥം
  choice: മാനുഷിക മാനദണ്ഡമനുസരിച്ച്
  alternative: ജഡപ്രകാരം
  rationale: ഇവിടെ പൗലോസ് ശരീരത്തെയോ ‘പാപസ്വഭാവത്തെയോ’ കുറിച്ചല്ല, മനുഷ്യസമൂഹത്തിന്റെ ജ്ഞാനമൂല്യനിർണയത്തെക്കുറിച്ചാണ് പറയുന്നത്. അതിനാൽ സന്ദർഭാർഥം വ്യക്തമാക്കി, മറ്റൊരു ദൈവശാസ്ത്രസങ്കൽപ്പം ചേർക്കാതിരിക്കുന്നു.
- issue: κλῆσις എന്ന വിളിയുടെ സ്വഭാവം
  choice: ‘നിങ്ങളുടെ വിളി’ എന്ന സംക്ഷിപ്തത നിലനിർത്തി
  alternative: ‘ദൈവം നിങ്ങളെ വിളിച്ചപ്പോൾ ഉണ്ടായിരുന്ന അവസ്ഥ’ എന്ന് വിശദീകരിക്കൽ
  rationale: വിളിയുടെ ദൈവിക പശ്ചാത്തലം സന്ദർഭത്തിൽ അന്തർലീനമാണെങ്കിലും മൂലവാചകം അതിനെ ഇവിടെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി യഥാർഥ സംക്ഷിപ്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ മൂന്നു പ്രാവശ്യമുള്ള οὐ πολλοί എന്ന ആവർത്തനം ‘അധികമില്ല’ എന്നു മൂന്നു പ്രാവശ്യം നിലനിർത്തി. വാക്യത്തിന്റെ പ്രബോധനാത്മക ഭാവത്തിനായി ‘ചിന്തിച്ചുനോക്കൂ’ ഉപയോഗിച്ചു.
