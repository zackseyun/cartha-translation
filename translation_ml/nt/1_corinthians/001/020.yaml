id: 1CO.1.20
reference: 1 Corinthians 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: ml
  text: ജ്ഞാനി എവിടെ? ശാസ്ത്രി എവിടെ? ഈ യുഗത്തിലെ തർക്കക്കാരൻ എവിടെ?[a] ലോകത്തിന്റെ ജ്ഞാനത്തെ ദൈവം ഭോഷത്വമാക്കിയില്ലയോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഈ യുഗത്തിലെ’ എന്നതും പിന്നീട് വരുന്ന ‘ലോകത്തിന്റെ’ എന്നതും വ്യത്യസ്ത ഗ്രീക്ക് പദങ്ങളുടെ വിവർത്തനങ്ങളാണ്.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘ലോകത്തിന്റെ ജ്ഞാനം ഭോഷമാണെന്ന് ദൈവം കാണിച്ചില്ലയോ?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: എവിടെ?
  rationale: തുടർന്നുവരുന്ന നാമങ്ങളോടൊപ്പം ഒരു വെല്ലുവിളിനിറഞ്ഞ അലങ്കാരചോദ്യമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ‘എവിടെ?’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: σοφός
  choice: ജ്ഞാനി
  rationale: പുരുഷലിംഗ ഏകവചന രൂപത്തിന്റെ പ്രതിനിധാനസ്വഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്ന സംക്ഷിപ്ത മലയാളപദം.
- source_word: γραμματεύς
  choice: ശാസ്ത്രി
  rationale: ചരിത്രപരവും വാചാടോപപരവുമായ മൂർച്ച നിലനിർത്തുന്ന നേരിട്ടുള്ള പരമ്പരാഗത സമാനപദം; പൊതുവായ ‘പണ്ഡിതൻ’ എന്നതിനെക്കാൾ ഉറവിടപദത്തോട് അടുത്തത്.
- source_word: συζητητής
  choice: തർക്കക്കാരൻ
  rationale: വാദപ്രതിവാദത്തിൽ ഏർപ്പെടുന്നയാളെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: τοῦ αἰῶνος τούτου
  choice: ഈ യുഗത്തിലെ
  rationale: വാക്യത്തിന്റെ അവസാനത്തിലുള്ള κόσμος എന്നതിൽനിന്ന് αἰών വേർതിരിച്ചുകാണിക്കാൻ ‘യുഗം’ ഉപയോഗിച്ചു.
- source_word: οὐχὶ
  choice: ഇല്ലയോ?
  rationale: അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് അലങ്കാരചോദ്യത്തിന്റെ ശക്തി പകർത്തുന്നു.
- source_word: ἐμώρανεν
  choice: ഭോഷത്തമാക്കി
  rationale: ക്രിയയുടെ കാരണാത്മകബലം നേരിട്ട് നിലനിർത്തുന്നു; എന്നാൽ ‘ഭോഷമാണെന്ന് തെളിയിച്ചു’ എന്ന അർത്ഥസാധ്യത കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: σοφίαν
  choice: ജ്ഞാനം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ സാധാരണ സമാനപദം; ഇവിടെ ലോകം അവകാശപ്പെടുന്ന ജ്ഞാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: κόσμου
  choice: ലോകത്തിന്റെ
  rationale: മുമ്പുള്ള αἰών-ൽനിന്ന് വ്യത്യസ്തമായി ‘ലോകം’ എന്നു നൽകി ഉറവിടത്തിലെ പദവ്യത്യാസം സംരക്ഷിച്ചു.
theological_decisions:
- issue: ഒരേ വാക്യത്തിലെ αἰών, κόσμος എന്നീ പദങ്ങളുടെ വ്യത്യാസം
  choice: αἰών എന്നത് ‘യുഗം’ എന്നും κόσμος എന്നത് ‘ലോകം’ എന്നും വിവർത്തനം ചെയ്തു.
  alternative: വായനാസൗകര്യത്തിനായി രണ്ടും ‘ലോകം’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: പൗലോസ് രണ്ടു വ്യത്യസ്ത ഗ്രീക്ക് പദങ്ങൾ ഉപയോഗിക്കുന്നതിനാൽ ഇപ്പോഴത്തെ യുഗവും ലോകത്തിന്റെ ജ്ഞാനവും തമ്മിലുള്ള ആശയവ്യത്യാസം മലയാളത്തിലും നിലനിർത്തി.
- issue: ἐμώρανεν എന്ന ക്രിയയുടെ അർത്ഥവ്യാപ്തി
  choice: ‘ഭോഷത്തമാക്കി’ എന്ന കാരണാത്മക വിവർത്തനം സ്വീകരിച്ചു.
  alternative: ‘ഭോഷമാണെന്ന് തെളിയിച്ചു.’
  rationale: ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘ഭോഷത്തമാക്കുക’ എന്നും ‘ഭോഷമാണെന്ന് വെളിപ്പെടുത്തുക/തെളിയിക്കുക’ എന്നും ഗ്രഹിക്കാവുന്ന അർത്ഥവ്യാപ്തിയുണ്ട്; മുഖ്യപാഠത്തിൽ നേരിട്ടുള്ള കാരണാത്മകതയും കുറിപ്പിൽ മറ്റൊരു സാധ്യതയും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, വായിക്കാൻ എളുപ്പമുള്ളതും ഗൗരവമുള്ളതുമായ അലങ്കാരചോദ്യശൈലി നിലനിർത്തി. ‘ശാസ്ത്രി’ ഉറവിടത്തിന്റെ ചരിത്രപരമായ ഭാവം സംരക്ഷിക്കുന്നു; ‘തർക്കക്കാരൻ’ ഇന്നത്തെ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന പദമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
