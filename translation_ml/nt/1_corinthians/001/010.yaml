id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: ml
  text: 'സഹോദരന്മാരേ[a], നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[b] നാമം മുൻനിർത്തി ഞാൻ നിങ്ങളോട് അപേക്ഷിക്കുന്നു: നിങ്ങൾ എല്ലാവരും ഒരേ കാര്യം പറയണം; നിങ്ങളുടെ ഇടയിൽ ഭിന്നതകൾ[c] ഉണ്ടാകരുത്; മറിച്ച്, ഒരേ മനസ്സിലും ഒരേ നിലപാടിലും[e] പൂർണമായി ഒന്നിച്ചുചേർന്നവരായിരിക്കണം[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യാം.
    reason: cultural_note
  - marker: b
    text: പരമ്പരാഗതമായി ‘ക്രിസ്തു’.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പിളർപ്പുകൾ’ അല്ലെങ്കിൽ ‘കക്ഷിഭേദങ്ങൾ’.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘പുനഃസ്ഥാപിക്കപ്പെട്ടിരിക്കണം’, ‘നന്നാക്കി ഒന്നിപ്പിക്കപ്പെട്ടിരിക്കണം’.
    reason: lexical_alternative
  - marker: e
    text: അഥവാ ‘ഒരേ തീരുമാനത്തിൽ’, ‘ഒരേ ബോധ്യത്തിൽ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അപേക്ഷിക്കുന്നു
  rationale: ഇവിടെ ക്രിയ ഒരു വെറും കല്പനയല്ല, ഗൗരവമുള്ള അപ്പൊസ്തലിക അഭ്യർഥനയാണ്. ‘അപേക്ഷിക്കുന്നു’ ആ ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; സഭാസമൂഹം മുഴുവനും ഉൾപ്പെടാം എന്ന വ്യാപക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦ ὀνόματος
  choice: നാമം മുൻനിർത്തി
  rationale: διά + ഷഷ്ഠി ഇവിടെ അഭ്യർഥനയുടെ അടിസ്ഥാനമോ അധികാരമോ സൂചിപ്പിക്കുന്നു. ‘നാമം മുൻനിർത്തി’ എന്നത് അതിനെ അമിതമായി വ്യാഖ്യാനിക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: യേശുവിന്റെ അധികാരവും പുതിയനിയമത്തിലെ വിശ്വാസപ്രഖ്യാപനപരമായ പ്രയോഗവും നിലനിർത്തുന്ന പതിവായ മലയാള പദം.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന അർഥശക്തി നിലനിർത്തുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: നിങ്ങൾ എല്ലാവരും ഒരേ കാര്യം പറയണം
  rationale: വെറും പൊതുവായ യോജിപ്പ് എന്നാക്കി ചുരുക്കാതെ, ‘പറയുക’ എന്ന മൂലരൂപകവും എല്ലാവരിലുമുള്ള ഐക്യവും സംരക്ഷിക്കുന്നു.
- source_word: σχίσματα
  choice: ഭിന്നതകൾ
  rationale: സമൂഹത്തിനുള്ളിലെ പിളർപ്പുകളെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി അറിയിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: κατηρτισμένοι
  choice: പൂർണമായി യോജിച്ചു ചേർന്നിരിക്കണം
  rationale: ശരിയായി ഘടിപ്പിക്കപ്പെടുക, നന്നാക്കപ്പെടുക, പുനഃസ്ഥാപിക്കപ്പെടുക എന്നീ അർഥനിറങ്ങൾ ഉൾക്കൊള്ളുന്ന ക്രിയയെ ഭിന്നതയുടെ സന്ദർഭത്തിൽ ഐക്യം പുനഃസ്ഥാപിച്ച അവസ്ഥയായി അവതരിപ്പിക്കുന്നു.
- source_word: νοῒ
  choice: മനസ്സ്
  rationale: ചിന്തയെയും ഗ്രഹണശേഷിയെയും സൂചിപ്പിക്കുന്ന സാധാരണവും സംക്ഷിപ്തവുമായ തുല്യപദം.
- source_word: γνώμῃ
  choice: നിലപാട്
  rationale: തീരുമാനം, അഭിപ്രായം, ബോധ്യം, പ്രായോഗിക ദിശാബോധം എന്നീ സാധ്യതകൾ തുറന്നുവെക്കുകയും ‘മനസ്സ്’ എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര്
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ വ്യക്തിനാമമെന്നതിലുപരി സ്ഥാനപ്പേരിന്റെ ശക്തി സജീവമാണ്. ‘മശീഹ’ ആ അർഥം വായനക്കാരനു ദൃശ്യമാക്കുന്നു; സഭാപാരമ്പര്യത്തിലെ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- issue: ἀδελφοί എന്ന ലിംഗസൂചക അഭിസംബോധന
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാരേ’, ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതേസമയം പൗലോസ് മുഴുവൻ വിശ്വാസസമൂഹത്തെയുമാണ് അഭിസംബോധന ചെയ്യുന്നതാകാമെന്ന സന്ദർഭപരമായ വ്യാപ്തി മറയ്ക്കുന്നില്ല.
- issue: ഐക്യത്തിനുള്ള ആഹ്വാനത്തിന്റെ പരിധി
  choice: ‘ഒരേ കാര്യം പറയണം’ എന്നും ‘ഒരേ മനസ്സിലും ഒരേ നിലപാടിലും’ എന്നും വ്യത്യസ്ത പദപ്രയോഗങ്ങൾ നിലനിർത്തി
  alternative: എല്ലാ കാര്യങ്ങളിലും ഒരേ അഭിപ്രായക്കാരായിരിക്കണം
  rationale: വാക്യം സമ്പൂർണമായ അഭിപ്രായഏകരൂപത ആവശ്യപ്പെടുന്നു എന്ന് അമിതമായി വ്യാഖ്യാനിക്കാതെ, പൊതുവായ വാക്ക്, മനസ്സ്, നിലപാട് എന്നിവയിൽ പൗലോസ് ഉപയോഗിക്കുന്ന യഥാർഥ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്ക് എളുപ്പവുമായ ശൈലി. വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ‘അപേക്ഷിക്കുന്നു’ ഉപയോഗിച്ചു; ദീർഘമായ ഉപവാക്യഘടന വ്യക്തതയ്ക്കായി അർദ്ധവിരാമങ്ങളാൽ വിഭജിച്ചു. പരമ്പരാഗത സഭാപദങ്ങൾ ആവശ്യമായിടത്ത് മാത്രം ഉപയോഗിക്കുകയും വ്യാഖ്യാനാത്മകമായ അധികചേരുവകൾ ഒഴിവാക്കുകയും ചെയ്തു.
