revisions:
- from: 'ലോകത്തിലെ കുലീനമല്ലാത്തവയെയും നിന്ദിക്കപ്പെട്ടവയെയും[a], ഇല്ലാത്തവയെയും, ഉള്ളവയെ നിഷ്ഫലമാക്കേണ്ടതിന്[b] ദൈവം തിരഞ്ഞെടുത്തു.


    [a] അല്ലെങ്കിൽ, “ഒന്നുമല്ലെന്നു കണക്കാക്കപ്പെടുന്നവയെ.”

    [b] അല്ലെങ്കിൽ, “ഒന്നുമല്ലാതാക്കേണ്ടതിന്.”'
  to: ലോകത്തിലെ കുലീനമല്ലാത്തവയെയും തുച്ഛീകരിക്കപ്പെട്ടവയെയും[a], ഇല്ലാത്തവയെയും, ഉള്ളവയെ നിഷ്ഫലമാക്കാൻ ദൈവം തിരഞ്ഞെടുത്തു.
  rationale: The revision sharpens the lexical sense of ἐξουθενημένα, improves the Malayalam purpose construction, and lightly regularizes the footnote wording. It retains the source's neuter plural rhetorical pattern and does not resolve the “not being/being” contrast into a narrower social paraphrase.
