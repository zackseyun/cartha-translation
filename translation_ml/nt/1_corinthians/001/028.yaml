id: 1CO.1.28
reference: 1 Corinthians 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: ml
  text: ലോകത്തിലെ കുലീനമല്ലാത്തവയെയും തുച്ഛീകരിക്കപ്പെട്ടവയെയും[a], ഇല്ലാത്തവയെയും, ഉള്ളവയെ നിഷ്ഫലമാക്കാൻ ദൈവം തിരഞ്ഞെടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഒന്നുമല്ലെന്ന് കണക്കാക്കപ്പെടുന്നവയെ.”
    reason: ἐξουθενημένα എന്ന പദത്തിലെ അവജ്ഞയോടെയുള്ള തുച്ഛീകരണവും വിലയില്ലാത്തവയായി കണക്കാക്കപ്പെടലും വ്യക്തമാക്കുന്ന അർഥപരമായ മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: ἀγενῆ
  choice: കുലീനമല്ലാത്തവയെ
  rationale: ജന്മമഹിമയോ ഉയർന്ന സാമൂഹികസ്ഥാനമോ ഇല്ലാത്തവ എന്ന ആശയം നിലനിർത്തുന്നു; ജാതിയെ അനാവശ്യമായി മുൻനിർത്തുന്ന പദപ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: ἐξουθενημένα
  choice: നിന്ദിക്കപ്പെട്ടവയെ
  rationale: വിലകെട്ടവരായി കണ്ട് അവജ്ഞയോടെ തള്ളപ്പെട്ടവർ എന്ന പരിപൂർണ കൃതന്തത്തിന്റെ ഭാവം സംക്ഷിപ്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τὰ μὴ ὄντα
  choice: ഇല്ലാത്തവയെ
  rationale: പൗലോസിന്റെ ഉദ്ദേശപൂർവമായ ശക്തമായ പ്രയോഗവും ‘ഉള്ളവ’ എന്നതിനോടുള്ള സമാന്തരവിരുദ്ധതയും നിലനിർത്തുന്നു; സാമൂഹികമായി ഒന്നുമല്ലാത്തവർ എന്ന സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ മാത്രം ഒതുക്കുന്നില്ല.
- source_word: τὰ ὄντα
  choice: ഉള്ളവയെ
  rationale: ‘ഇല്ലാത്തവ’ എന്നതിനോടുള്ള സന്തുലിതമായ വിരുദ്ധപ്രയോഗം കഴിയുന്നത്ര നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: καταργήσῃ
  choice: നിഷ്ഫലമാക്കേണ്ടതിന്
  rationale: പൂർണമായി നശിപ്പിക്കുക എന്നതിലുപരി പ്രവർത്തനശക്തിയോ പ്രാബല്യമോ ഇല്ലാതാക്കുക എന്ന ക്രിയയുടെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξελέξατο
  choice: തിരഞ്ഞെടുത്തു
  rationale: ദൈവത്തിന്റെ ഉദ്ദേശപൂർവമായ തിരഞ്ഞെടുപ്പിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപമാണ്.
theological_decisions:
- issue: τὰ μὴ ὄντα / τὰ ὄντα എന്ന വിരുദ്ധപ്രയോഗം സാമൂഹിക വിഭാഗങ്ങളായോ കേവലമായ അസ്തിത്വപ്രസ്താവനയായോ മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനിക്കണമോ എന്നത്
  choice: ‘ഇല്ലാത്തവ’ / ‘ഉള്ളവ’ എന്ന നേരിട്ടുള്ള വിരുദ്ധപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ഒന്നുമല്ലെന്നു കണക്കാക്കപ്പെടുന്നവർ’ / ‘പ്രാധാന്യമുള്ളവർ’ എന്ന് സാമൂഹികസ്ഥാനത്തിന്റെ അടിസ്ഥാനത്തിൽ പരാവർത്തനം ചെയ്യുക.
  rationale: സന്ദർഭം ലോകത്തിന്റെ കാഴ്ചയിലെ സാമൂഹികസ്ഥാനത്തെക്കുറിച്ചാണെങ്കിലും ഗ്രീക്ക് പ്രയോഗം അതിനേക്കാൾ വിശാലവും തീക്ഷ്ണവുമാണ്. നേരിട്ടുള്ള രൂപം പൗലോസിന്റെ വാചാടോപപരമായ സംഘർഷവും സാമൂഹികസൂചനയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ നപുംസക ബഹുവചനരൂപങ്ങളുടെ വാചാടോപശക്തി ‘-വയെ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി; ‘കുലീനമല്ലാത്ത’ എന്നത് സാമൂഹികസ്ഥാനസൂചന സംരക്ഷിക്കുമ്പോൾ പ്രത്യേക ജാതിവ്യവസ്ഥാഭാവം ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
