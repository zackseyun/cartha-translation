id: 1CO.1.18
reference: 1 Corinthians 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/018.yaml
  text: For the message of the cross is foolishness to those who are perishing[b][a], but to us who are being saved it is the power of God.
translation:
  language: ml
  text: ക്രൂശിന്റെ സന്ദേശം[a] നശിച്ചുകൊണ്ടിരിക്കുന്നവർക്ക് ഭോഷത്വമാണ്; എന്നാൽ രക്ഷിക്കപ്പെടുന്ന നമുക്കോ[b] അത് ദൈവത്തിന്റെ ശക്തിയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രൂശിന്റെ വചനം.”
    reason: lexical_alternative
  - marker: b
    text: “രക്ഷിക്കപ്പെടുന്ന” എന്ന ഗ്രീക്ക് പ്രയോഗം രക്ഷയെ ഇവിടെ തുടരുന്ന യാഥാർഥ്യമായി അവതരിപ്പിക്കുന്നു.
    reason: aspect_clarification
lexical_decisions:
- source_word: λόγος
  choice: സന്ദേശം
  rationale: ഇവിടെ ഒരു ഒറ്റ ‘വാക്ക്’ എന്നതിലുപരി ക്രൂശിനെക്കുറിച്ചു പ്രഖ്യാപിക്കപ്പെടുന്ന ഉള്ളടക്കമാണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ സ്വാഭാവികമായ മലയാളത്തിൽ ‘സന്ദേശം’ എന്നു നൽകി; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: σταυροῦ
  choice: ക്രൂശിന്റെ
  rationale: ക്രിസ്തുവിന്റെ ക്രൂശുമരണത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗം അതേ രൂപത്തിലും ദൈവശാസ്ത്രപരമായ ഭാരത്തിലും നിലനിർത്തുന്നു.
- source_word: ἀπολλυμένοις
  choice: നശിച്ചുകൊണ്ടിരിക്കുന്നവർക്ക്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം സൂചിപ്പിക്കുന്ന തുടരുന്ന അവസ്ഥ സംരക്ഷിക്കുന്നു; ‘നഷ്ടപ്പെട്ടവർ’ എന്നതിനെക്കാൾ മൂലപദത്തിലെ നാശത്തിന്റെ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: μωρία
  choice: ഭോഷത്തം
  rationale: ദൈവത്തിന്റെ ശക്തിയോടുള്ള പൗലോസിന്റെ വൈരുധ്യം വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്ന ആധുനിക മലയാള പദം.
- source_word: σῳζομένοις
  choice: രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്ന നമുക്ക്
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിലെ തുടരുന്ന രക്ഷാനുഭവം സംരക്ഷിക്കുന്നു; ἡμῖν എന്ന വ്യക്തമായ ‘നമുക്ക്’ എന്ന ആശയവും ഉൾക്കൊള്ളുന്നു.
- source_word: δύναμις θεοῦ
  choice: ദൈവത്തിന്റെ ശക്തി
  rationale: ഗ്രീക്കിലെ പദഘടനയും ദൈവശാസ്ത്രപരമായ ഊന്നലും അടുത്തായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: σῳζομένοις എന്നതിലെ രക്ഷയുടെ കാലഭാവം
  choice: രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്ന നമുക്ക്
  alternative: രക്ഷിക്കപ്പെട്ട നമുക്ക്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപം രക്ഷയെ ഇവിടെ തുടരുന്ന യാഥാർഥ്യമായി അവതരിപ്പിക്കുന്നു. അതിനെ കഴിഞ്ഞുകഴിഞ്ഞ ഒരു സംഭവമായി മാത്രം ചുരുക്കാതെ പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘ക്രൂശ്’, ‘ഭോഷത്തം’, ‘ദൈവത്തിന്റെ ശക്തി’ എന്നീ പരിചിതവും സംക്ഷിപ്തവുമായ പ്രയോഗങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ തുടരുന്ന കാലഭാവങ്ങൾ ‘-കൊണ്ടിരിക്കുന്ന’ രൂപത്തിലൂടെ വ്യക്തമാക്കി.
