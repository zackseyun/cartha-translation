id: 1CO.1.9
reference: 1 Corinthians 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: ml
  text: ദൈവം വിശ്വസ്തനാണ്; അവനിലൂടെയാണ് നിങ്ങൾ അവന്റെ പുത്രനും നമ്മുടെ കർത്താവുമായ യേശു മശീഹയോടുള്ള കൂട്ടായ്മയിലേക്കു വിളിക്കപ്പെട്ടത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവനാലാണ്.”
    reason: lexical_alternative
  - marker: b
    text: “കൂട്ടായ്മ” എന്നതിന് “പങ്കാളിത്തം” അഥവാ “പങ്കിടൽ” എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: വിശ്വസ്തൻ
  rationale: ദൈവത്തിന്റെ ആശ്രയയോഗ്യവും സ്ഥിരവുമായ സ്വഭാവത്തെ സൂചിപ്പിക്കുന്ന വിധേയവിശേഷണം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നതുമാണ്.
- source_word: δι’ οὗ
  choice: അവനിലൂടെയാണ്
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά ഇവിടെ ദൈവത്തെ വിളിയുടെ മധ്യസ്ഥൻ/പ്രവർത്തകകാരണം ആയി അവതരിപ്പിക്കുന്നു; ‘അവനാൽ’ എന്ന കാരകാർഥവും സാധ്യമാണ്.
- source_word: ἐκλήθητε
  choice: നിങ്ങൾ ... വിളിക്കപ്പെട്ടത്
  rationale: ആഓറിസ്റ്റ് പാസീവ് രൂപവും പൗലോസിന്റെ ‘വിളി’ എന്ന പ്രയോഗവും നിലനിർത്തുന്നു; ‘ക്ഷണിക്കപ്പെട്ടു’ എന്നതിനെക്കാൾ മൂലപദത്തോട് അടുത്തതാണ്.
- source_word: κοινωνίαν
  choice: കൂട്ടായ്മ
  rationale: ബന്ധപരമായ സഹവാസവും പങ്കാളിത്തവും ഉൾക്കൊള്ളുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: അവന്റെ പുത്രൻ ... യേശു മശീഹയോടുള്ള
  rationale: κοινωνίαയോടു ചേർന്ന ജനിറ്റീവിനെ സ്വാഭാവിക മലയാളത്തിൽ ‘-യോടുള്ള കൂട്ടായ്മ’ എന്നു പ്രകടിപ്പിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός എന്ന അഭിഷിക്തരാജാവിന്റെ പദവിയെ പേരുപോലെ ലിപ്യന്തരം ചെയ്യാതെ അർത്ഥമുള്ള പദവിയായി നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയുടെ മാനകവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: Χριστοῦ എന്നത് ‘ക്രിസ്തു’ എന്ന പേരുപോലുള്ള രൂപത്തിലോ ‘മശീഹ’ എന്ന പദവിയായോ നൽകണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Ἰησοῦ Χριστοῦ എന്ന പരിചിത സംയുക്തത്തിൽ പേരുപോലുള്ള ഉപയോഗം ഉണ്ടായാലും ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന പദവിയുടെ അർത്ഥം ഇവിടെ സജീവമാണ്; അതിനാൽ പദവി വിവർത്തനം ചെയ്തു.
- issue: κοινωνίαν എന്നതിന്റെ ബന്ധപരവും പങ്കാളിത്തപരവുമായ അർത്ഥങ്ങൾ
  choice: കൂട്ടായ്മ
  alternative: പങ്കാളിത്തം / പങ്കിടൽ
  rationale: ഒരു അർത്ഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ ബന്ധവും പങ്കുചേരലും ഒരുപോലെ സൂചിപ്പിക്കുന്ന പ്രാഥമിക പദം തെരഞ്ഞെടുത്തു; പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ഊന്നൽ നിലനിർത്താൻ ‘ദൈവം വിശ്വസ്തനാണ്’ ആദ്യം വെച്ചു; ദീർഘമായ വിശേഷണഘടന മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി ‘അവന്റെ പുത്രനും നമ്മുടെ കർത്താവുമായ’ എന്ന സമന്വിത രൂപം ഉപയോഗിച്ചു.
