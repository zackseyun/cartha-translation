id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: ml
  text: 'ഞാൻ ഉദ്ദേശിക്കുന്നത് ഇതാണ്: നിങ്ങളിൽ ഓരോരുത്തരും, “ഞാൻ പൗലോസിന്റേതാണ്,” “ഞാൻ അപ്പൊല്ലോസിന്റേതാണ്,” “ഞാൻ കേഫാസിന്റേതാണ്,” “ഞാൻ മിശിഹായുടേതാണ്[a]” എന്നിങ്ങനെ പറയുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ക്രിസ്തുവിന്റേതാണ്.”
    reason: Χριστοῦ എന്ന പദത്തിന്റെ പരമ്പരാഗത ലിപ്യന്തരണപരമായ പരിഭാഷ.
lexical_decisions:
- source_word: λέγω δὲ τοῦτο
  choice: ഞാൻ ഉദ്ദേശിക്കുന്നത് ഇതാണ്
  rationale: പൗലോസ് തന്റെ മുൻപ്രസ്താവന വിശദീകരിക്കുന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕκαστος ὑμῶν
  choice: നിങ്ങളിൽ ഓരോരുത്തരും
  rationale: ἕκαστος എന്ന പദത്തിന്റെ വ്യക്തിവിതരണ അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലം സൂചിപ്പിക്കുന്ന തുടർന്നുവരുന്ന സംസാരരീതിയെ ലളിതമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰμι + genitive
  choice: —ന്റേതാണ് / —യുടേതാണ്
  rationale: പൗലോസ്, അപ്പൊല്ലോസ്, കേഫാസ്, മശീഹാ എന്നിവരോടുള്ള പക്ഷബന്ധമോ അവകാശബന്ധമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവ്യാകരണത്തെ അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Κηφᾶ
  choice: കേഫാസ്
  rationale: പൗലോസ് ഇവിടെ Πέτρος എന്നല്ല Κηφᾶς എന്ന പേരാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ പേര് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി വരുന്നതിനാൽ അതിന്റെ അർഥം വിവർത്തനം ചെയ്യുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പക്ഷവിഭാഗത്തിന്റെ മുദ്രാവാക്യത്തിൽ Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായുടേതാണ്
  alternative: ക്രിസ്തുവിന്റേതാണ്
  rationale: Χριστός എന്ന പദവിനാമത്തിന്റെ അർഥം നിലനിർത്തി ‘മശീഹാ’ എന്ന് പരിഭാഷപ്പെടുത്തി; മലയാളത്തിൽ സുപരിചിതമായ പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിക്കുന്ന ഗ്രീക്ക് മുദ്രാവാക്യങ്ങളുടെ സമാന്തരഘടന സംരക്ഷിച്ചിരിക്കുന്നു; പട്ടിക മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘എന്നിങ്ങനെ’ ഉപയോഗിച്ചു.
