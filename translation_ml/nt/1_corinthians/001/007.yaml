id: 1CO.1.7
reference: 1 Corinthians 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ὑμᾶς μὴ ὑστερεῖσθαι ἐν μηδενὶ χαρίσματι, ἀπεκδεχομένους τὴν ἀποκάλυψιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/007.yaml
  text: so that you do not lack any gift as you eagerly await the revelation of our Lord Jesus the Messiah[a][b][c].
translation:
  language: ml
  text: അങ്ങനെ, നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ[c] വെളിപ്പാടിനായി[b] ആകാംക്ഷയോടെ കാത്തിരിക്കുന്ന നിങ്ങൾക്ക് ഒരു കൃപാവരത്തിലും[a] കുറവില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു ആത്മീയവരത്തിലും” അല്ലെങ്കിൽ “ഒരു വരത്തിലും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ വെളിപ്പെടൽ” അല്ലെങ്കിൽ “പ്രത്യക്ഷത.”
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്ക്: “യേശു ക്രിസ്തു”; പദവിയുടെ അർത്ഥം വ്യക്തമാക്കിയാൽ, “യേശു മശീഹ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെ
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച ദൈവകൃപയുടെ ഫലത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാളബന്ധപദം.
- source_word: ὑμᾶς μὴ ὑστερεῖσθαι
  choice: നിങ്ങൾക്ക് ... കുറവില്ല
  rationale: അഭാവമോ ന്യൂനതയോ ഇല്ലെന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἐν μηδενὶ χαρίσματι
  choice: ഒരു കൃപാവരത്തിലും
  rationale: χάρισμα എന്ന പദത്തിലെ കൃപയാൽ ലഭിക്കുന്ന വരം എന്ന ഭാവം നിലനിർത്തുന്നു; μηδενί എന്ന സമഗ്രനിഷേധവും പ്രകടമാക്കുന്നു.
- source_word: ἀπεκδεχομένους
  choice: ആകാംക്ഷയോടെ കാത്തിരിക്കുന്ന
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന പ്രതീക്ഷാനിർഭരമായ കാത്തിരിപ്പിന്റെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: ἀποκάλυψιν
  choice: വെളിപ്പാട്
  rationale: മറനീക്കി വെളിപ്പെടുത്തൽ എന്ന മൂലപദത്തിന്റെ ആശയത്തോട് നേരിട്ട് ചേർന്നുനിൽക്കുന്നു; അന്ത്യകാല സംഭവസൂചനയും നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്നതിന്റെ സാധാരണ പുതിയനിയമ പദവി ‘കർത്താവ്’ ആയി നിലനിർത്തുകയും മലയാളത്തിലെ സ്വാഭാവിക ബന്ധഘടന ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ സ്ഥിരമായ പേരുപോലെ പ്രവർത്തിക്കുന്ന ഗ്രീക്ക് സംയുക്തത്തിന് മലയാളത്തിൽ പരിചിതവും ഗൗരവമുള്ളതുമായ രൂപം; പദവിയെ വ്യക്തമാക്കുന്ന മറ്റൊരു രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: യേശുക്രിസ്തു
  alternative: യേശു മശീഹ
  rationale: ഇവിടെ സംയുക്തം പ്രത്യേകം ഊന്നിയ പദവിയേക്കാൾ സ്ഥിരമായ പേരുസംയുക്തമായി പ്രവർത്തിക്കുന്നു. എങ്കിലും Χριστός എന്നതിന്റെ ‘മശീഹ’ എന്ന പദവിയർത്ഥം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: ἀποκάλυψις എന്നതിന്റെ അന്ത്യകാലസൂചന
  choice: വെളിപ്പാട്
  alternative: പ്രത്യക്ഷത / വെളിപ്പെടൽ
  rationale: മൂലപദത്തിന്റെ ‘മറനീക്കൽ’ എന്ന അർത്ഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ കർത്താവിന്റെ പ്രത്യക്ഷതയെ സൂചിപ്പിക്കാമെന്ന സന്ദർഭപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടനയാണ് ഉപയോഗിച്ചത്. ‘കൃപാവരം,’ ‘വെളിപ്പാട്,’ ‘കർത്താവ്’ എന്നീ സഭാപരിചിത പദങ്ങൾ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; യഥാർത്ഥത്തിലെ സാധ്യതയുള്ള വ്യത്യസ്ത അർത്ഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
