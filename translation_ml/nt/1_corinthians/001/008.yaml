id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: ml
  text: അവൻ നിങ്ങളെ അവസാനംവരെ ഉറപ്പിച്ചു നിർത്തും[a]; നമ്മുടെ കർത്താവായ യേശു മശീഹയുടെ[c] നാളിൽ നിങ്ങൾ കുറ്റമറ്റവരായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്ഥിരപ്പെടുത്തും’ അല്ലെങ്കിൽ ‘ദൃഢപ്പെടുത്തും’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘കുറ്റാരോപണത്തിന് ഇടയില്ലാത്തവർ’ അല്ലെങ്കിൽ ‘ആക്ഷേപമറ്റവർ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തു’; സ്ഥാനനാമത്തിന്റെ അർഥം വ്യക്തമാക്കാൻ ഇവിടെ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: ഉറപ്പിക്കുകയും ചെയ്യും
  rationale: ഒരാളെ സ്ഥിരതയുള്ളവനാക്കുക, ദൃഢപ്പെടുത്തുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘സ്ഥിരപ്പെടുത്തുക’, ‘ദൃഢപ്പെടുത്തുക’ എന്നിവയും സാധ്യമാണ്.
- source_word: ἕως τέλους
  choice: അവസാനംവരെ
  rationale: അന്ത്യപരിധിവരെയുള്ള തുടർച്ച എന്ന കാലസൂചന സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἀνεγκλήτους
  choice: കുറ്റമറ്റവരായിരിക്കത്തക്കവിധം
  rationale: കുറ്റം ചുമത്താൻ അടിസ്ഥാനമില്ലാത്ത അവസ്ഥയെ മലയാളത്തിലെ പരിചിതമായ പദത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലപദത്തിന്റെ നിയമപരമായ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: നാളിൽ
  rationale: അന്ത്യന്യായവിധിയുമായി ബന്ധപ്പെട്ട ‘നാൾ’ എന്ന ബൈബിൾ പ്രയോഗം സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനനാമത്തിന് മലയാള ബൈബിൾ ഭാഷയിലും സാധാരണ ക്രൈസ്തവ പ്രയോഗത്തിലും അംഗീകരിക്കപ്പെട്ട തുല്യപദമാണ്.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഒരു സ്ഥാനനാമമാണെന്ന അർഥം ‘മശീഹ’ നേരിട്ട് സംരക്ഷിക്കുന്നു; മലയാള വാക്യത്തിൽ ബന്ധസൂചകമായ ‘യുടെ’ ചേർത്തിരിക്കുന്നു.
theological_decisions:
- issue: ὃς (‘അവൻ’) എന്ന ബന്ധസർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: മുൻവാക്യത്തിലെ ഏറ്റവും അടുത്ത പുൽലിംഗ ഏകവചന സൂചിതവ്യക്തിയായ കർത്താവായ യേശു മശീഹയെ സൂചിപ്പിക്കുന്നതായി ‘അവൻ’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച ദൈവത്തെ കൂടുതൽ വിശാലമായി സൂചിപ്പിക്കുന്നു എന്നു വായിക്കാം.
  rationale: തൊട്ടുമുമ്പുള്ള വ്യാകരണപരമായ സൂചിതവ്യക്തി ‘നമ്മുടെ കർത്താവായ യേശു മശീഹ’ ആയതിനാൽ ഈ വായനയാണ് ഏറ്റവും സ്വാഭാവികം; എന്നാൽ മലയാളത്തിൽ ‘അവൻ’ എന്നത് മൂലത്തിലെ ബന്ധസർവനാമത്തിന്റെ രൂപം അനാവശ്യമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἀνεγκλήτους എന്ന പദവും βεβαιώσει എന്ന ക്രിയയും തമ്മിലുള്ള ബന്ധം
  choice: അവസാനംവരെ ഉറപ്പിക്കുന്നതിന്റെ ഉദ്ദേശ്യമോ ഫലമോ ആയി ‘കുറ്റമറ്റവരായിരിക്കത്തക്കവിധം’ എന്നു നൽകി.
  alternative: ‘കുറ്റമറ്റവരായി നിങ്ങളെ അവസാനംവരെ ഉറപ്പിക്കും’ എന്ന നിലയിൽ അവസ്ഥാവാചകമായി നേരിട്ട് ബന്ധിപ്പിക്കാം.
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത ഘടന മലയാളത്തിൽ അക്ഷരാർഥമായി പകർത്തിയാൽ അസ്വാഭാവികമാകും; ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധം വ്യക്തമാക്കുന്ന രൂപം അർഥം സംരക്ഷിച്ചുകൊണ്ട് വായന സുഗമമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കർത്താവ്’, ‘മശീഹ’, ‘നാൾ’ തുടങ്ങിയ ബൈബിൾപരമായ പ്രധാന പദങ്ങൾ നിലനിർത്തിയപ്പോൾ, വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഉടൻ ഗ്രഹിക്കാവുന്നവിധം ക്രമപ്പെടുത്തി.
