revisions:
- from: 'കൊരിന്തിലുള്ള ദൈവത്തിന്റെ സഭയ്ക്ക്—മശീഹായായ യേശുവിൽ[a] വിശുദ്ധീകരിക്കപ്പെട്ടവരും വിശുദ്ധരായിരിക്കാൻ വിളിക്കപ്പെട്ടവരുമായ[b] നിങ്ങൾക്ക്—അവരുടേതും നമ്മുടേതുമായ എല്ലാ ഇടങ്ങളിലും[d] നമ്മുടെ കർത്താവായ മശീഹാ യേശുവിന്റെ[c] നാമം വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരോടുംകൂടെ:'
  to: 'കൊരിന്തിലുള്ള ദൈവത്തിന്റെ സഭയ്ക്ക്—മശീഹാ യേശുവിൽ വിശുദ്ധീകരിക്കപ്പെട്ടവരും വിശുദ്ധരായി വിളിക്കപ്പെട്ടവരുമായവർക്ക്—അവരുടേതും നമ്മുടേതുമായ എല്ലാ ഇടങ്ങളിലും നമ്മുടെ കർത്താവായ യേശു മശീഹായുടെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരോടുംകൂടെ:'
  rationale: The revision removes the added purposive nuance from κλητοῖς ἁγίοις and smooths the Messiah-title constructions. It retains the draft’s defensible primary attachment of αὐτῶν καὶ ἡμῶν to ‘all places,’ while the footnote continues to preserve the alternative attachment to ‘our Lord.’
  reviewer_model: gpt-5.6-terra
