id: 1CO.1.2
reference: 1 Corinthians 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: ml
  text: 'കൊരിന്തിലുള്ള ദൈവത്തിന്റെ സഭയ്ക്ക്—മശീഹാ യേശുവിൽ വിശുദ്ധീകരിക്കപ്പെട്ടവരും വിശുദ്ധരായി വിളിക്കപ്പെട്ടവരുമായവർക്ക്—അവരുടേതും നമ്മുടേതുമായ എല്ലാ ഇടങ്ങളിലും നമ്മുടെ കർത്താവായ യേശു മശീഹായുടെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരോടുംകൂടെ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭയ്ക്ക്
  rationale: ‘സഭ’ എന്നത് വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളപദമാണ്; ‘ദൈവത്തിന്റെ’ എന്ന ബന്ധം ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന വ്യക്തമാക്കുന്നു.
- source_word: ἡγιασμένοις
  choice: വിശുദ്ധീകരിക്കപ്പെട്ടവർ
  rationale: പൂർണമായ ഒരു പ്രവൃത്തിയുടെ തുടരുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്ന perfect passive രൂപവും ദൈവിക പ്രവർത്തനത്തിന്റെ കർമണിപ്രയോഗവും ഇതിൽ നിലനിൽക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹായായ യേശുവിൽ
  rationale: Χριστός ഇവിടെ പദവിയായതിനാൽ ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്തു; ἐν എന്ന ബന്ധം ‘-യിൽ’ കൊണ്ട് നേരിട്ട് നിലനിർത്തി.
- source_word: κλητοῖς ἁγίοις
  choice: വിശുദ്ധരായിരിക്കാൻ വിളിക്കപ്പെട്ടവർ
  rationale: ദൈവത്തിന്റെ വിളിയും വിശുദ്ധമായ നിലയും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ ചുരുങ്ങിയ വിശേഷണഘടനയുടെ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: നാമം വിളിച്ചപേക്ഷിക്കുന്നവർ
  rationale: ആരാധനാപരമായി കർത്താവിനെ അഭയം തേടി വിളിക്കുന്ന അർഥം സംരക്ഷിക്കുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പ്രയോഗമാണിത്.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ അധികാരവും ആദ്യകാല ക്രൈസ്തവ വിശ്വാസപ്രഖ്യാപനത്തിലെ ഭാരവും നിലനിർത്തുന്ന സ്ഥാപിത മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹാ യേശു
  rationale: മലയാളത്തിൽ സ്വാഭാവികമായ പദവിനാമക്രമം ഉപയോഗിച്ചുകൊണ്ട് Χριστός എന്നതിന്റെ മശീഹാപദവി പ്രകടമാക്കുന്നു.
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: അവരുടേതും നമ്മുടേതുമായ എല്ലാ ഇടങ്ങളിലും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ജനിറ്റീവ് പ്രയോഗത്തെ സ്ഥലങ്ങളോട് ബന്ധിപ്പിച്ച പ്രധാനവായനയാണ് ഇത്; പദബന്ധത്തിന്റെ യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: രണ്ടിടത്തും ‘മശീഹാ’
  alternative: ‘ക്രിസ്തു’
  rationale: ഇവിടെ പദവിയുടെ അർഥം സജീവമായതിനാൽ അർഥവിവർത്തനമായ ‘മശീഹാ’ പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പുകളിൽ നൽകി.
- issue: κλητοῖς ἁγίοις എന്നതിലെ വിളിയും വിശുദ്ധതയും തമ്മിലുള്ള ബന്ധം
  choice: ‘വിശുദ്ധരായിരിക്കാൻ വിളിക്കപ്പെട്ടവർ’
  alternative: ‘വിളിക്കപ്പെട്ട വിശുദ്ധർ’
  rationale: പ്രധാനപാഠം സ്വാഭാവിക മലയാളത്തിൽ ദൈവവിളിയും വിശുദ്ധമായ തിരിച്ചറിയലും പ്രകടമാക്കുന്നു; എന്നാൽ ഗ്രീക്കിൽ വ്യക്തമായ ഉദ്ദേശ്യസൂചക infinitive ഇല്ലാത്തതിനാൽ കൂടുതൽ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: αὐτῶν καὶ ἡμῶν ഏതിനോടാണ് ചേരുന്നത്
  choice: ‘എല്ലാ ഇടങ്ങളും’ എന്നതിനോട് ബന്ധിപ്പിച്ചു
  alternative: ‘കർത്താവ് അവരുടേതും നമ്മുടേതുമാണ്’ എന്നതിനോട് ബന്ധിപ്പിക്കാം
  rationale: വാക്കുകളുടെ സമീപസ്ഥാനം τόπῳ എന്ന ‘ഇടം’ എന്ന പദത്തോടുള്ള ബന്ധത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും സംക്ഷിപ്തമായ ഗ്രീക്ക് വാക്യഘടന മറ്റൊരു പുരാതനവും വ്യാപകവുമായ വായനയ്ക്കും ഇടനൽകുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാപത്രഭാഷയാണ് ഉപയോഗിച്ചത്. ‘വിശുദ്ധീകരിക്കപ്പെട്ടവർ’, ‘കർത്താവ്’, ‘നാമം വിളിച്ചപേക്ഷിക്കുക’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി. ഗ്രീക്കിലെ ദീർഘമായ അഭിസംബോധന വായിക്കാൻ സഹായിക്കുന്നതിന് വിരാമരേഖകൾ ഉപയോഗിച്ചു.
