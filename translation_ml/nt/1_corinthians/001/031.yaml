id: 1CO.1.31
reference: 1 Corinthians 1:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: ml
  text: 'അങ്ങനെ, എഴുതിയിരിക്കുന്നതുപോലെ: “പുകഴ്ചകൊള്ളുന്നവൻ കർത്താവിൽ പുകഴ്ചകൊള്ളട്ടെ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: അതിനാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ ഉദ്ദേശ്യവും ഫലവും ഈ ഉദ്ധരണിയിലൂടെ വ്യക്തമാകുന്നതിനാൽ, സന്ദർഭബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ താരതമ്യഭാവവും നിലനിൽക്കുന്ന പ്രാബല്യവും സ്വാഭാവികമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ὁ καυχώμενος
  choice: അഭിമാനിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു; καυχάομαι എന്നതിലെ അഭിമാനിക്കൽ/പുകഴ്ചകൊള്ളൽ എന്ന ആശയം ഇവിടെ ‘അഭിമാനിക്കുക’ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ἐν എന്നതിന്റെ ‘ൽ’ എന്ന മേഖല/ആധാരഭാവം നിലനിർത്തുകയും κύριος എന്ന പദത്തെ പതിവും ഗൗരവമുള്ളതുമായ ‘കർത്താവ്’ എന്നു വിവർത്തനം ചെയ്യുകയും ചെയ്യുന്നു.
- source_word: καυχάσθω
  choice: അഭിമാനിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ആജ്ഞാർത്ഥത്തിന്റെ നേരിട്ടുള്ള മലയാളരൂപം; നിർദേശാത്മക ശക്തി നിലനിർത്തുന്നു, എന്നാൽ ‘വേണം’ എന്ന നിർബന്ധവ്യാഖ്യാനം മാത്രം അടിച്ചേൽപ്പിക്കുന്നില്ല.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ ആജ്ഞാർത്ഥത്തിന്റെ വിവർത്തനം
  choice: അഭിമാനിക്കട്ടെ
  alternative: അഭിമാനിക്കണം
  rationale: ഗ്രീക്കിലെ മൂന്നാംപുരുഷ ആജ്ഞാർത്ഥത്തെ രൂപപരമായി അടുത്തും മലയാളത്തിൽ സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു. ‘അഭിമാനിക്കണം’ എന്നത് സാധ്യമായ അർത്ഥവിവർത്തനമാണെങ്കിലും നിർബന്ധത്തിന്റെ ഭാവം കൂടുതൽ ശക്തമാക്കാം.
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: നാഥൻ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തോടും തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയോടും യോജിക്കുന്ന, വ്യാപകമായി മനസ്സിലാകുന്ന പദമാണ് ‘കർത്താവ്’; ഉദ്ധരണി യഹോവയെ സൂചിപ്പിക്കുന്നതും പൗലോസിന്റെ സന്ദർഭത്തിൽ ക്രിസ്തുവുമായി ബന്ധപ്പെടാവുന്നതുമായ അർത്ഥസാന്ദ്രത നിർബന്ധമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്ത് ശൈലി. ‘അഭിമാനിക്കട്ടെ’ എന്നത് ആജ്ഞാർത്ഥം സ്വാഭാവികമായി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് നിർബന്ധസൂചകമായ മറ്റൊരു സാധ്യത രേഖപ്പെടുത്തുന്നു.
