id: 1CO.1.25
reference: 1 Corinthians 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι τὸ μωρὸν τοῦ θεοῦ σοφώτερον τῶν ἀνθρώπων ἐστίν, καὶ τὸ ἀσθενὲς τοῦ θεοῦ ἰσχυρότερον τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: ml
  text: കാരണം, ദൈവത്തിന്റെ ഭോഷത്വം മനുഷ്യരെക്കാൾ ജ്ഞാനമുള്ളതാണ്; ദൈവത്തിന്റെ ബലഹീനത മനുഷ്യരെക്കാൾ ശക്തിയുള്ളതാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ബന്ധകത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഭോഷത്തം
  rationale: പൗലോസ് ഉദ്ദേശപൂർവം ഉപയോഗിക്കുന്ന വൈരുധ്യാത്മകവും പ്രകോപനപരവുമായ പ്രയോഗം വിശദീകരിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: മനുഷ്യരെക്കാൾ ജ്ഞാനമുള്ളത്
  rationale: താരതമ്യഘടനയും ἀνθρώπων എന്ന ലിംഗസമാവേശിയായ ബഹുവചനവും കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ബലഹീനത
  rationale: ആദ്യപാദത്തോടുള്ള സമാന്തരതയും മൂലപാഠത്തിലെ ദൈവത്തെ സംബന്ധിച്ച ധീരമായ ഭാഷയും സംരക്ഷിക്കുന്നു.
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: മനുഷ്യരെക്കാൾ ശക്തിയുള്ളത്
  rationale: താരതമ്യത്തിന്റെ അർഥവും ഇരുപാദങ്ങളിലെ സമാന്തരതയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ഭോഷത്തം’, ‘ദൈവത്തിന്റെ ബലഹീനത’ എന്നീ വൈരുധ്യപ്രയോഗങ്ങൾ
  choice: അവയെ നേരിട്ടുതന്നെ നിലനിർത്തുക
  alternative: മനുഷ്യർക്കു ഭോഷത്തമെന്നോ ബലഹീനതയെന്നോ തോന്നുന്ന ദൈവത്തിന്റെ പ്രവൃത്തി എന്നു വിശദീകരിക്കുക
  rationale: സന്ദർഭം ഇവയെ വാക്ചാതുര്യപരമായ വൈരുധ്യങ്ങളായി വ്യക്തമാക്കുന്നുണ്ടെങ്കിലും, ഈ വാക്യം തന്നെ നൽകുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ നിശ്ശബ്ദമായി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യർ’ ലിംഗസമാവേശിയായി ഉപയോഗിച്ചു; രണ്ടു പാദങ്ങളുടെയും തുല്യഘടന സംരക്ഷിച്ചു.
