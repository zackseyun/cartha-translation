id: 1CO.1.14
reference: 1 Corinthians 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀εὐχαριστῶ ὅτι οὐδένα ὑμῶν ἐβάπτισα εἰ μὴ Κρίσπον καὶ Γάϊον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: ml
  text: ക്രിസ്പൊസിനെയും ഗായൊസിനെയും ഒഴികെ നിങ്ങളിൽ ആരെയും ഞാൻ സ്നാനം കഴിപ്പിച്ചിട്ടില്ല എന്നതിൽ ഞാൻ നന്ദിയുള്ളവനാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: ഞാൻ നന്ദിയുള്ളവനാണ്
  rationale: വർത്തമാനകാലത്തിലുള്ള പൗലോസിന്റെ നന്ദിബോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ‘ഞാൻ നന്ദി പറയുന്നു’ എന്നതും സാധ്യമെങ്കിലും ഇവിടെ ഉള്ളടക്കവാക്യത്തോടൊപ്പം ഈ രൂപം കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: ὅτι
  choice: എന്നതിൽ
  rationale: പൗലോസ് നന്ദിയുള്ളവനായിരിക്കുന്നതിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എന്നതിൽ’ ഈ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐδένα ὑμῶν
  choice: നിങ്ങളിൽ ആരെയും ... ഇല്ല
  rationale: നിഷേധത്തോടു ചേർന്ന് ‘നിങ്ങളിൽ ഒരാളെയും അല്ല’ എന്ന ഗ്രീക്ക് അർഥം വ്യക്തമായി പകരുന്നു.
- source_word: ἐβάπτισα
  choice: ഞാൻ സ്നാനം കഴിപ്പിച്ചു
  rationale: βαπτίζω എന്നതിന് മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ വ്യാപകവും മതവിഭാഗപരമായി രീതിയെ നിർണ്ണയിക്കാത്തതുമായ പരിഭാഷയാണ്; മുങ്ങിക്കൽ എന്ന പ്രത്യേക രീതി വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: εἰ μὴ
  choice: ഒഴികെ
  rationale: ഇവിടെയുള്ള ഒഴിവാക്കൽ നിർമാണത്തിന്റെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: Κρίσπον
  choice: ക്രിസ്പൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നാമനിർദേശരൂപം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
- source_word: Γάϊον
  choice: ഗായൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നാമനിർദേശരൂപം മലയാളത്തിൽ ശബ്ദാനുസൃതമായി ലിപ്യന്തരിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്നാനം കഴിപ്പിക്കുക’ എന്ന പ്രയോഗം ക്രിയയുടെ കർത്താവും സ്വീകരിക്കുന്നവരും തമ്മിലുള്ള ബന്ധം വ്യക്തമാക്കുകയും സ്നാനരീതിയെക്കുറിച്ചുള്ള വിഭാഗീയ നിർവചനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
