  to: എന്നാൽ ഞങ്ങൾ ക്രൂശിക്കപ്പെട്ട മശീഹയെ[a] പ്രസംഗിക്കുന്നു—യഹൂദർക്ക് ഇടർച്ചയും ജനതകൾക്ക്[b] ഭോഷത്വവുമായവനെ.
