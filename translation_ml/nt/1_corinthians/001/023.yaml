id: 1CO.1.23
reference: 1 Corinthians 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ κηρύσσομεν Χριστὸν ἐσταυρωμένον, Ἰουδαίοις μὲν σκάνδαλον ⸀ἔθνεσιν δὲ μωρίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: ml
  text: എന്നാൽ ഞങ്ങൾ ക്രൂശിക്കപ്പെട്ട മശീഹയെ[a] പ്രസംഗിക്കുന്നു—യഹൂദർക്ക് ഇടർച്ചയും ജനതകൾക്ക്[b] ഭോഷത്വവുമായവനെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ക്രൂശിക്കപ്പെട്ട ക്രിസ്തുവിനെ.”
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ “ജനതകൾ”; യഹൂദരോടുള്ള ഈ വൈരുധ്യത്തിൽ ഇവിടെ യഹൂദേതരരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: പ്രസംഗിക്കുന്നു
  rationale: ദൂതന്റെ പരസ്യപ്രഖ്യാപനം എന്ന ആശയം ഉൾക്കൊള്ളുന്നതും പൗലോസിന്റെ പ്രസംഗസന്ദർഭത്തിൽ സ്വാഭാവികവുമായ പദം.
- source_word: Χριστόν
  choice: മശീഹയെ
  rationale: ഇവിടെ യേശുവിന്റെ പദവിയും അവനെക്കുറിച്ചുള്ള പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കവും മുൻനിൽക്കുന്നതിനാൽ പേരുപോലെ ഉപയോഗിക്കുന്ന ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ പദവിയായ ‘മശീഹ’ അനുയോജ്യം.
- source_word: ἐσταυρωμένον
  choice: ക്രൂശിക്കപ്പെട്ട
  rationale: പൂർണകാല കർമണി കൃദന്തത്തിന്റെ ഫലസ്ഥിതി നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി Χριστόν-നെ വിശേഷിപ്പിക്കുന്നു.
- source_word: Ἰουδαίοις
  choice: യഹൂദർക്ക്
  rationale: യഹൂദർ–ജനതകൾ എന്ന വംശീയ-മതപരമായ വൈരുധ്യം ഇവിടെ പ്രധാനമാണ്; ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യർ’ എന്ന അർഥമല്ല.
- source_word: σκάνδαλον
  choice: ഇടർച്ചയ്ക്കു കാരണം
  rationale: വീഴാൻ ഇടയാക്കുന്ന തടസ്സം എന്ന മൂലരൂപകം മലയാളത്തിൽ മനസ്സിലാകുന്ന വിധം സംരക്ഷിക്കുന്നു; വെറും ‘അപമാനം’ എന്നു പറഞ്ഞാൽ ആ രൂപകം നഷ്ടപ്പെടും.
- source_word: ἔθνεσιν
  choice: ജനതകൾക്ക്
  rationale: ഗ്രീക്കിലെ അടിസ്ഥാനപദാർത്ഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; ഈ യഹൂദർ–ജനതകൾ വൈരുധ്യത്തിൽ അത് യഹൂദേതരരെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: μωρίαν
  choice: ഭോഷത്തം
  rationale: ഈ അധ്യായത്തിൽ ആവർത്തിക്കുന്ന ‘മൂഢമെന്ന് കരുതപ്പെടുന്നത്’ എന്ന ആശയബന്ധം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
theological_decisions:
- issue: Χριστός പദവിയായോ പേരുപോലെയോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: അപ്പൊസ്തലിക പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കവും യേശുവിനെക്കുറിച്ചുള്ള മശീഹാവകാശവാദവും സന്ദർഭത്തിൽ മുൻനിൽക്കുന്നു; അതിനാൽ പദവിയുടെ അർഥം തുറന്നുകാട്ടുന്നു.
- issue: σκάνδαλον എന്നതിന്റെ രൂപകം
  choice: ഇടർച്ചയ്ക്കു കാരണം
  alternative: അപമാനം / വിരോധകാരണം
  rationale: ക്രൂശിക്കപ്പെട്ട മശീഹ യഹൂദർക്ക് വീഴ്ച വരുത്തുന്ന തടസ്സമാകുന്നു എന്ന രൂപകവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗഹൃദവുമായ ശൈലി. ‘ഞങ്ങളാകട്ടെ’ δέ-യുടെ വൈരുധ്യവും ἡμεῖς എന്ന സർവനാമത്തിന്റെ ഊന്നലും നൽകുന്നു. അവസാനത്തെ ‘ആയവനെ’ മശീഹയോടുള്ള രണ്ട് വിധേയവിശേഷണങ്ങളുടെ ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആശയത്തെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
