    rationale: The Greek predicate is ‘a stumbling block/obstacle,’ not explicitly ‘a cause of stumbling.’ A direct Malayalam noun preserves the metaphor and ambiguity better.
  - severity: low
    issue: ‘ഭോഷത്തം’ is less precise as an abstract rendering of μωρία.
    rationale: ‘ഭോഷത്വം’ more naturally denotes ‘foolishness’ and better maintains the chapter’s recurring conceptual vocabulary.
