id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾ മശീഹയായ യേശുവിൽ ഉള്ളത് അവനിൽനിന്നാണ്. അവൻ നമുക്കായി ദൈവത്തിൽനിന്നുള്ള ജ്ഞാനവും നീതിയും[a] വിശുദ്ധീകരണവും വീണ്ടെടുപ്പും ആയിത്തീർന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായം.’
    reason: δικαιοσύνη എന്ന പദത്തിന് സന്ദർഭാനുസരണം ‘നീതി/നീതിമത്തം’ എന്നും ‘ന്യായം’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: അവനിൽനിന്നാണ്
  rationale: ἐξ എന്ന പദത്തിന്റെ ഉറവിടം/ഉത്ഭവം എന്ന ആശയം നേരിട്ട് നിലനിർത്തുന്നു; വിശ്വാസികൾ മശീഹയിൽ ആയിരിക്കുന്നതിന്റെ ഉറവിടം ദൈവമാണെന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν എന്ന പൗലോസീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ ‘-യിൽ’ എന്നു നിലനിർത്തുന്നു; Χριστός എന്ന പദത്തിന്റെ പദവിയർഥം ‘മശീഹ’ എന്നു വ്യക്തമാക്കുന്നു.
- source_word: ἐγενήθη
  choice: ആയിത്തീർന്നു
  rationale: γίνομαι സൂചിപ്പിക്കുന്ന ‘ആയിത്തീരുക’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: σοφία
  choice: ജ്ഞാനം
  rationale: 1 കൊരിന്ത്യർ 1-ലെ മാനുഷിക ജ്ഞാനവും ദൈവിക ജ്ഞാനവും തമ്മിലുള്ള വൈരുധ്യത്തിന് യോജിക്കുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἀπὸ θεοῦ
  choice: ദൈവത്തിൽനിന്നുള്ള
  rationale: ഉറവിടത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം നിലനിർത്തുന്നു; വാക്യക്രമത്തിൽ ഇത് ‘ജ്ഞാനം’ എന്നതിനോടാണ് ഏറ്റവും അടുത്ത് ബന്ധിപ്പിച്ചിരിക്കുന്നത്.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: δικαιοσύνηയുടെ പൗലോസീയവും രക്ഷാശാസ്ത്രപരവുമായ വ്യാപ്തി ചുരുക്കാതെ നൽകുന്ന സ്ഥാപിതവും സ്വാഭാവികവുമായ മലയാളപദം; ‘ന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἁγιασμός
  choice: വിശുദ്ധീകരണം
  rationale: വിശുദ്ധമാക്കപ്പെടൽ/വിശുദ്ധനായി വേർതിരിക്കപ്പെടൽ എന്ന ദൈവശാസ്ത്രപരമായ ആശയം കൃത്യമായി സംരക്ഷിക്കുന്ന സ്ഥാപിത പ്രയോഗം.
- source_word: ἀπολύτρωσις
  choice: വീണ്ടെടുപ്പ്
  rationale: ബന്ധനത്തിൽനിന്നുള്ള മോചനവും വിലകൊടുത്തുള്ള വീണ്ടെടുപ്പും ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ പശ്ചാത്തലം മലയാളത്തിലെ സാധാരണ ദൈവശാസ്ത്രപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിൽനിന്നുള്ള ജ്ഞാനം’ എന്നതും തുടർന്നുള്ള മൂന്ന് നാമങ്ങളും തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്ക് വാക്യത്തിന്റെ ഏകോപിത പട്ടിക നിലനിർത്തി, ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നത് ‘ജ്ഞാനം’ എന്നതിനോട് ഏറ്റവും അടുത്തായി ചേർത്തു.
  alternative: ‘ദൈവത്തിൽനിന്നുള്ള’ എന്നത് ജ്ഞാനം, നീതി, വിശുദ്ധീകരണം, വീണ്ടെടുപ്പ് എന്നീ നാലിനെയും ഒരുപോലെ വിശേഷിപ്പിക്കുന്നതായി പുനഃക്രമീകരിക്കുക; അല്ലെങ്കിൽ അവസാനത്തെ മൂന്ന് പദങ്ങളെ ജ്ഞാനത്തിന്റെ വിശദീകരണമായി ഡാഷുകൾക്കുള്ളിൽ നൽകുക.
  rationale: ഗ്രീക്ക് വാക്യഘടന ഈ ബന്ധം പൂർണമായി തീർപ്പാക്കുന്നില്ല. അതിനാൽ വിശദീകരണചിഹ്നങ്ങളോ പുനഃക്രമീകരണമോ ഉപയോഗിച്ച് ഒരു വായന നിർബന്ധിക്കാതെ യഥാർത്ഥത്തിലെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘മശീഹയായ യേശു’, ‘വിശുദ്ധീകരണം’, ‘വീണ്ടെടുപ്പ്’ എന്നീ സ്ഥാപിത ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നവിധം സ്വാഭാവികമാക്കി.
