id: 1CO.1.5
reference: 1 Corinthians 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: ml
  text: കാരണം, അവനിൽ നിങ്ങൾ എല്ലാ വിധത്തിലും—എല്ലാ സംസാരത്തിലും എല്ലാ അറിവിലും—സമ്പന്നരാക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പൗലോസിന്റെ നന്ദിയുടെ കാരണം ഈ ഉപവാക്യം വ്യക്തമാക്കുന്നതിനാൽ കാരണാർഥം സ്വാഭാവികമാണ്.
- source_word: ἐν παντὶ
  choice: എല്ലാ വിധത്തിലും
  rationale: വ്യാപകമായ സമഗ്രത സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; തുടർന്നുള്ള രണ്ട് മേഖലകൾ അതിനെ വിശദീകരിക്കുന്നു.
- source_word: ἐπλουτίσθητε
  choice: സമ്പന്നരാക്കപ്പെട്ടു
  rationale: അയോറിസ്റ്റ് കർമണി രൂപവും സമ്പത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു; ലഭിച്ച സമൃദ്ധിയാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἐν αὐτῷ
  choice: അവനിൽ
  rationale: ἐν എന്നതിന്റെ മേഖല/ഐക്യ അർഥവും ക്രിസ്തുവിലുള്ള നിലയെക്കുറിച്ചുള്ള പൗലോസിന്റെ ഭാഷയും വ്യാഖ്യാനിച്ച് മാറ്റാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν παντὶ λόγῳ
  choice: എല്ലാ സംസാരത്തിലും
  rationale: γνῶσις എന്നതിനോടുള്ള സമാന്തരബന്ധത്തിൽ λόγος ഇവിടെ വാക്കാലുള്ള ആവിഷ്കാരത്തെയോ സംസാരശേഷിയെയോ സൂചിപ്പിക്കാൻ സാധ്യതയുള്ളതിനാൽ ഈ രൂപം തെരഞ്ഞെടുത്തു.
- source_word: πάσῃ γνώσει
  choice: എല്ലാ അറിവിലും
  rationale: ഗ്രീക്കിലെ സമാന്തര ഘടന നിലനിർത്തിക്കൊണ്ട് γνῶσις എന്നതിന്റെ വിശാലമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐν αὐτῷ എന്നതിലെ ബന്ധം
  choice: അവനിൽ
  alternative: അവനാൽ / അവനിലൂടെ
  rationale: കർതൃത്വമോ ഉപകരണമോ മാത്രം നിർണ്ണയിക്കാതെ, ക്രിസ്തുവിലുള്ള മേഖലയെയോ ഐക്യത്തെയോ സൂചിപ്പിക്കുന്ന യഥാർഥ ഗ്രീക്ക് രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ആവർത്തിക്കുന്ന ἐν ഘടന സാധ്യമായത്ര നിലനിർത്തി; വിശദീകരണപരമായ അവസാന രണ്ടു ഘടകങ്ങളെ ഡാഷുകൾകൊണ്ട് വ്യക്തമായി ബന്ധിപ്പിച്ചു.
