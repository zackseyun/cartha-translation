  text: ἐπειδὴ καὶ Ἰουδαῖοι ⸀σημεῖα αἰτοῦσιν καὶ Ἕλληνες σοφίαν ζητοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/022.yaml
  text: For Jews ask for signs[c][b][a], and Greeks seek wisdom.
translation:
  language: ml
  text: എന്തെന്നാൽ, യെഹൂദന്മാർ അടയാളങ്ങൾ ചോദിക്കുന്നു[a][b]; ഗ്രീക്കുകാർ[c] ജ്ഞാനം അന്വേഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യെഹൂദന്മാർ അടയാളങ്ങൾ ചോദിക്കുകയും ഗ്രീക്കുകാർ ജ്ഞാനം അന്വേഷിക്കുകയും ചെയ്യുന്നതിനാൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: ‘അടയാളങ്ങൾ’ എന്നത് ‘അത്ഭുതകരമായ അടയാളങ്ങൾ’ എന്ന അർഥത്തിലും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ഗ്രീക്കുകാർ’ എന്നത് കൂടുതൽ വിശാലമായി ‘ജാതികൾ’ എന്നു പരിഭാഷപ്പെടുത്താം. എന്നാൽ ജ്ഞാനത്തെക്കുറിച്ചുള്ള പരാമർശം കണക്കിലെടുക്കുമ്പോൾ, ഇവിടെ പ്രത്യേകമായ ഗ്രീക്ക് സാംസ്കാരിക പശ്ചാത്തലം നിലനിർത്തുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδή
  choice: കാരണം
  rationale: മുൻപും പിന്നാലെയുമുള്ള വാദവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന കാരണാർഥം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἰουδαῖοι
  choice: യെഹൂദന്മാർ
  rationale: ഇവിടെ ഗ്രീക്കുകാരോടു വിപരീതമായി പരാമർശിക്കപ്പെടുന്ന യഹൂദ ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: σημεῖα
  choice: അടയാളങ്ങൾ
  rationale: ഗ്രീക്കിലെ പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുകയും അത്ഭുതകരമായ അടയാളങ്ങൾ എന്ന സന്ദർഭസാധ്യത തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: αἰτοῦσιν
  choice: ചോദിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള അഭ്യർഥനയെ നേരായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; ‘ആവശ്യപ്പെടുന്നു’ എന്നതിലെ അധിക ബലം ഒഴിവാക്കുന്നു.
- source_word: Ἕλληνες
  choice: ഗ്രീക്കുകാർ
  rationale: ‘ജാതികൾ’ എന്ന വിശാലീകരണത്തിനു പകരം ജ്ഞാനത്തെക്കുറിച്ചുള്ള ഉടൻപിന്നാലെയുള്ള പരാമർശവുമായി ബന്ധപ്പെട്ട ഗ്രീക്ക് സാംസ്കാരിക ചട്ടക്കൂട് സംരക്ഷിക്കുന്നു.
- source_word: σοφίαν
  choice: ജ്ഞാനം
  rationale: പദത്തിന്റെ വിശാലമായ ആശയപരിധി നിലനിർത്തുന്നു; അതിനെ ‘തത്ത്വചിന്താപരമായ ജ്ഞാനം’ എന്നു അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ζητοῦσιν
  choice: അന്വേഷിക്കുന്നു
  rationale: തുടർച്ചയായ തിരച്ചിലിന്റെ വർത്തമാനകാല ഭാവവും ഗ്രീക്കുപദത്തിന്റെ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തര ഘടനയും കാരണാർഥബന്ധവും സംരക്ഷിച്ചിരിക്കുന്നു; വ്യാഖ്യാനപരമായ വികസനങ്ങൾ അടിക്കുറിപ്പുകളിലേക്കു മാറ്റിയിരിക്കുന്നു.
