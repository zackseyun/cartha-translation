  source_fidelity: മുഖ്യവാചകം ഗ്രീക്ക് വാക്യഘടകങ്ങളും പ്രധാന പദങ്ങളും പൊതുവേ കൃത്യമായി പ്രതിഫലിപ്പിക്കുന്നു. എന്നിരുന്നാലും ἵνα-ഉദ്ദേശവാക്യമായ «ἵνα μὴ κενωθῇ» മലയാളത്തിൽ വ്യക്തമായി ഉദ്ദേശം സൂചിപ്പിക്കണം; കരടിലെ അർധവിരാമം ആ ബന്ധം മങ്ങിക്കുന്നു.
  naturalness: «വാക്കിന്റെ ജ്ഞാനത്തിൽ അല്ല» എന്നത് അക്ഷരസാന്നിധ്യമുള്ളതെങ്കിലും ആധുനിക മലയാളത്തിൽ കുറച്ച് അസ്വാഭാവികമാണ്. «വാക്കിന്റെ ജ്ഞാനത്തോടെയല്ല» എന്ന രൂപം അതേ അർഥവ്യാപ്തി നിലനിർത്തിക്കൊണ്ട് കൂടുതൽ സ്വാഭാവികമാണ്. ഉദ്ദേശബന്ധം «അങ്ങനെ ... ശൂന്യമാക്കപ്പെടാതിരിക്കേണ്ടതിന്» എന്നതിലൂടെ വ്യക്തമാണ്.
  terminology: «മശീഹ», «സ്നാനം കഴിപ്പിക്കുക», «സുവാർത്ത അറിയിക്കുക», «ക്രൂശ്» എന്നിവ സ്ഥിരതയോടെയും സന്ദർഭോചിതമായും ഉപയോഗിച്ചിട്ടുണ്ട്. κενωθῇ-യുടെ രൂപകാത്മകമായ നിഷ്ക്രിയപ്രയോഗം മുഖ്യവാചകത്തിൽ വിശദീകരണച്ചേരുവ കൂടാതെ നിലനിർത്തിയിരിക്കുന്നു.
