id: 1CO.1.17
reference: 1 Corinthians 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: ml
  text: കാരണം, മശീഹ[a] എന്നെ അയച്ചത് സ്നാനം കഴിപ്പിക്കാനല്ല[b], സുവാർത്ത അറിയിക്കാനാണ്—വാക്കിന്റെ ജ്ഞാനത്തോടെയല്ല[c]; അങ്ങനെ മശീഹയുടെ ക്രൂശ് ശൂന്യമാക്കപ്പെടാതിരിക്കേണ്ടതിന്[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: Χριστός (ക്രിസ്റ്റോസ്); പരമ്പരാഗതമായി ‘ക്രിസ്തു’.'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘സ്നാനം നൽകാൻ’; പദത്തിന് അടിസ്ഥാനപരമായി ‘മുക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘വാക്ചാതുര്യത്തോടെ’; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘വാക്കിന്റെ ജ്ഞാനത്തോടെ’.
    reason: lexical_alternative
  - marker: d
    text: അഥവാ ‘നിഷ്ഫലമാക്കപ്പെടാതിരിക്കാൻ’ അല്ലെങ്കിൽ ‘അതിന്റെ ശക്തി നഷ്ടപ്പെടുത്താതിരിക്കാൻ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: മശീഹ / മശീഹയുടെ
  rationale: Χριστός എന്നത് ഇവിടെ അർഥവത്തായ അഭിഷിക്തൻ എന്ന പദവിയായി പരിഭാഷപ്പെടുത്തി; രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ രൂപം നിലനിർത്തി.
- source_word: βαπτίζειν
  choice: സ്നാനം കഴിപ്പിക്കാൻ
  rationale: സഭാസന്ദർഭത്തിൽ സ്വാഭാവികവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പ്രയോഗം; സ്നാനരീതിയെക്കുറിച്ചുള്ള കൂടുതൽ ഇടുങ്ങിയ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: εὐαγγελίζεσθαι
  choice: സുവാർത്ത അറിയിക്കാൻ
  rationale: ക്രിയയുടെ സുവാർത്ത പ്രഖ്യാപിക്കുന്ന അർഥം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: σοφίᾳ λόγου
  choice: വാക്കിന്റെ ജ്ഞാനത്തിൽ
  rationale: λόγος എന്നതിന്റെ ‘വാക്ക്/സംസാരം’ എന്ന സാധ്യതയും σοφία എന്നതിന്റെ ‘ജ്ഞാനം’ എന്ന രൂപവും സംരക്ഷിക്കുന്ന, ഗ്രീക്കിനോട് അടുത്ത പരിഭാഷ; വാക്ചാതുര്യം എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κενωθῇ
  choice: ശൂന്യമാക്കപ്പെടാതിരിക്കാൻ
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും ‘ശൂന്യമാക്കുക’ എന്ന ദൃശ്യമായ പദപ്രയോഗവും നിലനിർത്തുന്നു; ‘ശക്തിയില്ലാതാക്കുക’ എന്ന് വിശദീകരിച്ച് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: σταυρὸς
  choice: ക്രൂശ്
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ കൃത്യവും മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സ്ഥാപിതവുമായ പദം.
theological_decisions:
- issue: Χριστός എന്നത് പദവിയായി പരിഭാഷപ്പെടുത്തണമോ പരമ്പരാഗതമായി ‘ക്രിസ്തു’ എന്ന് ലിപ്യന്തരണം ചെയ്യണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: അഭിഷിക്തൻ എന്ന പദവിയുടെ അർഥം വായനക്കാരന് ദൃശ്യമാക്കുകയും വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങൾക്കും ഏകീകൃത രൂപം നൽകുകയും ചെയ്യുന്നു.
- issue: ക്രൂശ് ‘ശൂന്യമാക്കപ്പെടുന്നു’ എന്നതിന്റെ അർഥം വിശദീകരിക്കണമോ
  choice: ശൂന്യമാക്കപ്പെടുക എന്ന രൂപകം അതേപടി നിലനിർത്തി
  alternative: ശക്തിയില്ലാതാക്കപ്പെടുക / ഫലശൂന്യമാക്കപ്പെടുക
  rationale: ക്രൂശിന് സ്വതവേ ശക്തിയില്ലാതാകുന്നു എന്ന സിദ്ധാന്തപരമായ നിഗമനം ചേർക്കാതെ κενόω എന്ന പദത്തിന്റെ രൂപകവും പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ ഭാഷയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാക്കിന്റെ ജ്ഞാനത്തിൽ’ എന്ന അസാധാരണമായെങ്കിലും ഗ്രഹിക്കാവുന്ന പ്രയോഗം മൂലത്തിലെ അർഥവ്യാപ്തി നിലനിർത്താൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു; കൂടുതൽ സ്വാഭാവികമായ വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി.
