reference: 1 Corinthians 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ml
  text: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവായ യേശു മശീഹയിൽനിന്നും നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘കർത്താവായ യേശു ക്രിസ്തുവിൽനിന്നും.’'
    reason: Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ പരമ്പരാഗത മലയാള ലിപ്യന്തരണമായ ‘ക്രിസ്തു’ എന്ന പകരംരൂപം നൽകുന്നു.
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശംസയിലെ ദൈവിക ദാനത്തിന്റെയും അനുകൂലതയുടെയും സമ്പന്നമായ അർഥം നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികവും സുപരിചിതവുമായ പദം.
- source_word: ὑμῖν
  choice: നിങ്ങൾക്കു
  rationale: ആശംസ സ്വീകരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന ദാതൃവിഭക്തിയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്ന പതിവ് പരിഭാഷ.
- source_word: ἀπὸ
  choice: -ൽനിന്നും
  rationale: കൃപയുടെയും സമാധാനത്തിന്റെയും ഉറവിടം വ്യക്തമാക്കുന്നു. മലയാള വ്യാകരണത്തിന് അനുസരിച്ച് ഏക ഗ്രീക്ക് പൂർവപ്രത്യയത്തിന്റെ ബന്ധം ഇരുപേരിലും വിഭക്തിരൂപത്തിലൂടെ പ്രകടിപ്പിച്ചിരിക്കുന്നു.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: ഗ്രീക്കിലെ സമാനാധികരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി അവതരിപ്പിക്കുന്നു; ‘നമ്മുടെ ദൈവവും പിതാവും’ എന്ന വ്യത്യസ്ത ഘടന സൂചിപ്പിക്കുന്നില്ല.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന സ്ഥാനപ്പേരിന്റെ പതിവ് മലയാളരൂപവും അതിന്റെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരെന്ന അർഥം നിലനിർത്തുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: കൃപയും സമാധാനവും പിതാവിൽനിന്നും യേശുവിൽനിന്നും വരുന്നു എന്ന സംയുക്ത ഉറവിടബന്ധം നിലനിർത്തൽ
  choice: ദൈവം, കർത്താവായ യേശു മശീഹ എന്നീ ഇരുവരോടും ‘-ൽനിന്നും’ ചേർത്ത് ഒരേ ഉറവിടബന്ധം വ്യക്തമാക്കി.
  alternative: വാക്യം പുനഃക്രമീകരിച്ച് ഇരുവരുടെയും ഏകോപനം മൃദൂകരിക്കുക, അല്ലെങ്കിൽ യേശുവുമായുള്ള ഉറവിടബന്ധം പരോക്ഷമാക്കുക.
  rationale: ഗ്രീക്കിൽ ഒരേയൊരു ἀπό ഇരുവരെയും നിയന്ത്രിക്കുന്നു. മലയാളത്തിൽ ഓരോ ഏകോപിത നാമപദത്തോടും വിഭക്തി ചേർക്കുന്നത് സ്വാഭാവികമായതിനാൽ, രൂപപരമായ ആവർത്തനം ഉണ്ടായാലും ഒരേ ബന്ധം മാറ്റമില്ലാതെ നിലനിൽക്കുന്നു.
- issue: ആശംസയിൽ ക്രിയ ഇല്ലാത്ത ഗ്രീക്ക് ഘടന മലയാളത്തിൽ അവതരിപ്പിക്കൽ
  choice: സ്വാഭാവികമായ അനുഗ്രഹാശംസയായി ‘ഉണ്ടാകട്ടെ’ ചേർത്തു.
  alternative: ‘നിങ്ങൾക്കു കൃപയും സമാധാനവും’ എന്ന ക്രിയാരഹിത രൂപം.
  rationale: മൂലപാഠത്തിലെ ആശംസാഭാവം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ, സാധാരണ ആധുനിക മലയാളത്തിൽ പൂർണ്ണവും വ്യക്തവുമായ വാക്യമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ അനുഗ്രഹാശംസാരീതി ഉപയോഗിച്ചു. സഭാപരമായി പരിചിതമായ ‘കൃപ’, ‘സമാധാനം’, ‘കർത്താവ്’ എന്നീ പദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്കു സുതാര്യമാക്കി.
