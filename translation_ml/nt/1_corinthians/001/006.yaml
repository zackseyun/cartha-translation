lexical_decisions:
- source_word: καθὼς
  choice: …പോലെ
  rationale: മുൻവാക്യത്തിലെ ആശയവുമായി താരതമ്യമോ പൊരുത്തമോ സൂചിപ്പിക്കുന്ന ബന്ധകശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μαρτύριον
  choice: സാക്ഷ്യം
  rationale: തെളിവായ സാക്ഷ്യത്തിന്റെയും പ്രഖ്യാപിക്കപ്പെട്ട സന്ദേശത്തിന്റെയും അർഥവ്യാപ്തി അനാവശ്യമായി പരാവർത്തനം ചെയ്യാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയെക്കുറിച്ചുള്ള
  rationale: ഇവിടെ ഷഷ്ടീവിഭക്തിയെ കർമബന്ധമായി മനസ്സിലാക്കി, സാക്ഷ്യത്തിന്റെ വിഷയം മശീഹയാണെന്ന് വ്യക്തമാക്കുന്നു; Χριστός എന്ന പദത്തിന്റെ സ്ഥാനനാമസ്വഭാവം ‘മശീഹ’ സംരക്ഷിക്കുന്നു.
- source_word: ἐβεβαιώθη
  choice: ഉറപ്പിക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ നിഷ്ക്രിയരൂപവും ഉറപ്പുള്ളതാക്കി സ്ഥാപിക്കുക എന്ന അർഥവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: ബഹുവചനത്തിലുള്ള അഭിസംബോധന കൊരിന്ത്യസമൂഹത്തിനകത്തെ സ്ഥിരീകരണത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കുന്നു; ‘നിങ്ങളിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοῦ Χριστοῦ എന്നതിലെ ഷഷ്ടീവിഭക്തിയുടെ ബന്ധം
  choice: 'കർമബന്ധം: ‘മശീഹയെക്കുറിച്ചുള്ള സാക്ഷ്യം’'
  alternative: 'കർത്തൃബന്ധമോ ഉടമസ്ഥബന്ധമോ: ‘മശീഹയുടെ സാക്ഷ്യം’'
  rationale: സന്ദർഭത്തിൽ അപ്പൊസ്തലികമായി പ്രഖ്യാപിക്കപ്പെട്ട മശീഹയെക്കുറിച്ചുള്ള സാക്ഷ്യം കൊരിന്ത്യരിൽ ഉറപ്പിക്കപ്പെട്ടതായി വായിക്കുന്നത് യോജിക്കുന്നു; എന്നാൽ ഗ്രീക്കിലെ യഥാർഥ വ്യാകരണദ്വയാർഥത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യവുമായി ബന്ധപ്പെടുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തിയിരിക്കുന്നു; ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരവും സ്ഥാനസൂചകവുമായ ദ്വയാർഥങ്ങൾ അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
