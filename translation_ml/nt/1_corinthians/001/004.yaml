  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: ml
  text: മശീഹയായ യേശുവിൽ[b] നിങ്ങൾക്കു നൽകപ്പെട്ട ദൈവത്തിന്റെ കൃപ നിമിത്തം, നിങ്ങളെക്കുറിച്ച്[a] ഞാൻ എന്റെ ദൈവത്തിന് എപ്പോഴും നന്ദി പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളെ ഓർത്ത് ഞാൻ എന്റെ ദൈവത്തിന് എപ്പോഴും നന്ദി പറയുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ക്രിസ്തുയേശുവിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: നന്ദി പറയുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർച്ചയായ നന്ദിപ്രകടനത്തെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു.
- source_word: τῷ θεῷ μου
  choice: എന്റെ ദൈവത്തിന്
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തിയും μου എന്ന വ്യക്തിപരമായ ഉടമസ്ഥസൂചനയും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: കാലസംബന്ധമായ വിശാല അർഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: περὶ ὑμῶν
  choice: നിങ്ങളെ ഓർത്ത്
  rationale: നന്ദിപ്രകടനസന്ദർഭത്തിൽ περί + genitive സൂചിപ്പിക്കുന്ന ‘നിങ്ങളെ സംബന്ധിച്ച്/നിങ്ങൾ നിമിത്തം’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ രൂപപരമായ പകരം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπὶ τῇ χάριτι
  choice: കൃപ നിമിത്തം
  rationale: പൗലോസിന്റെ നന്ദിയുടെ അടിസ്ഥാനമോ കാരണമോ ആണ് കൃപ എന്ന ἐπί + dative പ്രയോഗത്തിന്റെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: χάριτι
  choice: കൃപ
  rationale: ദൈവത്തിന്റെ സൗജന്യമായ അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന χάρις എന്ന പൗലോസിന്റെ പ്രധാന പദത്തിന് സ്ഥാപിതവും യോജിച്ചതുമായ മലയാള പദം.
- source_word: τοῦ θεοῦ
  choice: ദൈവകൃപ
  rationale: ഗ്രീക്കിലെ genitive ബന്ധം സംയുക്തരൂപത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; കൃപ ദൈവത്തിന്റേതും ദൈവത്തിൽനിന്നുള്ളതുമെന്ന അർഥസാധ്യത അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: നിങ്ങൾക്കു നൽകപ്പെട്ട
  rationale: aorist passive participle-ന്റെ സ്വീകരണകേന്ദ്രിതമായ ഭാവം നിലനിർത്തുകയും ദൈവത്തെ പരോക്ഷ ദാതാവായി വിടുകയും ചെയ്യുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന അഭിഷിക്ത രക്ഷകന്റെ സ്ഥാനപ്പേരിന്റെ അർഥം മലയാളത്തിൽ തുറന്നുകാട്ടുകയും ἐν എന്ന ഐക്യ/ബന്ധപരമായ പ്രയോഗം ‘-യിൽ’ വഴി നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: സ്ഥാനപ്പേരിന്റെ ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന അർഥം പ്രകടമാക്കുന്നു; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν Χριστῷ Ἰησοῦ എന്നതിലെ ἐν-ന്റെ ബന്ധം
  choice: മശീഹയായ യേശുവിൽ
  alternative: മശീഹയായ യേശുവിലൂടെ
  rationale: ഗ്രീക്കിലെ ‘in’ രൂപം നിലനിർത്തി, കൃപയുടെ മാർഗം മാത്രമെന്നായി ബന്ധത്തെ ചുരുക്കാതെ ക്രിസ്തുവുമായുള്ള ഐക്യം/ബന്ധം ഉൾപ്പെടുന്ന അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യക്രമം സ്വീകരിച്ചു. ‘കൃപ’, ‘ദൈവം’, ‘മശീഹ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; അതേസമയം പഴഞ്ചൻ ക്രിയാരൂപങ്ങളും അനാവശ്യമായ സംസ്കൃതഭാരവും ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദത്തിനോ വാക്യത്തിനോ പിന്നാലെ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
