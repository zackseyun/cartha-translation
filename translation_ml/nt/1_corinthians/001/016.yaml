language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/016.yaml
  text: I also baptized the household of Stephanas[a]; beyond that[b], I do not know if I baptized anyone else.
translation:
  language: ml
  text: സ്തെഫനാസിന്റെ വീട്ടുകാരെയും[a] ഞാൻ സ്നാനം കഴിപ്പിച്ചു. അതല്ലാതെ, മറ്റാരെയെങ്കിലും ഞാൻ സ്നാനം കഴിപ്പിച്ചിട്ടുണ്ടോ എന്ന് എനിക്കറിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്തെഫനാസിന്റെ ഭവനത്തെയും.” ഗ്രീക്ക് പദം കെട്ടിടം മാത്രമല്ല, ഒരു ഗൃഹസമൂഹത്തെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: സ്നാനം കഴിപ്പിച്ചു
  rationale: ക്രിയ ഇവിടെ സ്നാനം നിർവഹിച്ചതിനെയാണ് സൂചിപ്പിക്കുന്നത്. സ്നാനത്തിന്റെ പ്രത്യേക രീതി നിർണ്ണയിക്കാതെ, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സഭാപാരമ്പര്യങ്ങളിലുടനീളം മനസ്സിലാകുന്നതുമായ പ്രയോഗമാണിത്.
- source_word: δὲ καὶ
  choice: -യെയും
  rationale: δέ എന്ന മൃദുവായ ബന്ധകവും καί എന്ന കൂട്ടിച്ചേർക്കൽഭാവവും ചേർന്ന് മുമ്പ് പറഞ്ഞവരുടെ പട്ടികയിലേക്ക് സ്തെഫനാസിന്റെ വീട്ടുകാരെ കൂടി ചേർക്കുന്നു; മലയാളത്തിലെ ‘-യെയും’ ആ കൂട്ടിച്ചേർക്കൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸν Στεφανᾶ οἶκον
  choice: സ്തെഫനാസിന്റെ വീട്ടുകാർ
  rationale: οἶκος ഇവിടെ കെട്ടിടത്തെക്കാൾ ഒരു കുടുംബ-ഗൃഹസമൂഹത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. ‘വീട്ടുകാർ’ അതിന്റെ സാമൂഹിക വ്യാപ്തി നിലനിർത്തുകയും ‘കുടുംബം’ എന്നതിനെക്കാൾ വിശാലമായ അംഗത്വസാധ്യത തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: λοιπὸν
  choice: അതല്ലാതെ
  rationale: ഇപ്പോൾ ഓർത്തുപറഞ്ഞ ഒഴിവിനപ്പുറം മറ്റാരും ഉണ്ടായിരുന്നോ എന്ന ശേഷിക്കുന്ന കാര്യത്തിലേക്കുള്ള മാറ്റം ഈ പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: οὐκ οἶδα
  choice: എനിക്കറിയില്ല
  rationale: മൂലപാഠം നേരിട്ട് അറിവില്ലായ്മയാണ് പ്രസ്താവിക്കുന്നത്. സന്ദർഭത്തിൽ ഓർമയുടെ കാര്യമാണെങ്കിലും ‘എനിക്ക് ഓർമയില്ല’ എന്ന് വിശദീകരിച്ച് മാറ്റാതെ ഗ്രീക്കിന്റെ രൂപം നിലനിർത്തുന്നു.
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: മറ്റാരെയെങ്കിലും ഞാൻ സ്നാനം കഴിപ്പിച്ചിട്ടുണ്ടോ എന്ന്
  rationale: εἰ ഇവിടെ പരോക്ഷചോദ്യത്തിലെ അനിശ്ചിതത്വം പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ഓ എന്ന്’ എന്ന ഘടന അത് സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: οἶκος എന്ന പദം സ്നാനം ലഭിച്ചവരുടെ കൃത്യമായ ഘടന വ്യക്തമാക്കുന്നുണ്ടോ
  choice: ‘വീട്ടുകാർ’ എന്ന് വിവർത്തനം ചെയ്ത് അംഗങ്ങളുടെ പ്രായമോ ബന്ധമോ നിർണ്ണയിക്കാതിരിക്കുക
  alternative: ‘കുടുംബം’ എന്ന് വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ വീട്ടിലെ ശിശുക്കളെയോ എല്ലാ അംഗങ്ങളെയോ ഉൾപ്പെടുത്തി വ്യാഖ്യാനിക്കുക
  rationale: ഗ്രീക്ക് പദം ഒരു ഗൃഹസമൂഹത്തെ സൂചിപ്പിക്കാം, എന്നാൽ അതിലെ അംഗങ്ങളുടെ പ്രായം, ബന്ധം, എല്ലാവരും ഉൾപ്പെട്ടോ തുടങ്ങിയ കാര്യങ്ങൾ ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വിഭാഗീയമായ സ്നാനസിദ്ധാന്തം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. പൗലോസിന്റെ ഓർമ്മ തിരുത്തിപ്പറയുന്ന സംഭാഷണസ്വഭാവം നിലനിർത്താൻ ചെറുതും നേരിട്ടുള്ളതുമായ രണ്ട് വാക്യങ്ങൾ ഉപയോഗിച്ചു. ‘സ്നാനം കഴിപ്പിച്ചു’ എന്നത് രീതി നിർണ്ണയിക്കാത്ത സാധാരണ ക്രൈസ്തവ പ്രയോഗമായി സ്വീകരിച്ചു.
