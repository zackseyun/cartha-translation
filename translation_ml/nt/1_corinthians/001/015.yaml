  text: ἵνα μή τις εἴπῃ ὅτι εἰς τὸ ἐμὸν ὄνομα ⸀ἐβαπτίσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/015.yaml
  text: so that no one may say that you were baptized into my name[a].
translation:
  language: ml
  text: നിങ്ങളെ എന്റെ നാമത്തിലേക്കു സ്നാനപ്പെടുത്തി എന്ന് ആരും പറയാതിരിക്കേണ്ടതിന്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “എന്റെ നാമത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μή τις εἴπῃ
  choice: ആരും പറയാതിരിക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യസൂചനയും μή τις എന്ന നിഷേധാർഥക അനിശ്ചിത കർത്താവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς
  choice: നാമത്തിലേക്കു
  rationale: εἰς എന്നതിന്റെ അടിസ്ഥാന ദിശാസൂചക അർഥമായ ‘ലേക്ക്’ നിലനിർത്തി, സ്നാനത്തിലൂടെ സൂചിപ്പിക്കപ്പെടുന്ന ബന്ധത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τὸ ἐμὸν ὄνομα
  choice: എന്റെ നാമം
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള സ്വാമ്യഘടനയെ വ്യക്തവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐβαπτίσθητε
  choice: നിങ്ങൾ സ്നാനം ഏറ്റു
  rationale: ഗ്രീക്കിൽ ഇത് ഭൂതകാല നിഷ്ക്രിയരൂപമാണെങ്കിലും, ‘സ്നാനപ്പെടുത്തപ്പെട്ടു’ എന്ന കൃത്രിമമായ പ്രയോഗത്തിനു പകരം മലയാള ക്രൈസ്തവ ഭാഷയിൽ സ്വാഭാവികവും വിഭാഗീയ വ്യാഖ്യാനം ഒഴിവാക്കുന്നതുമായ പ്രയോഗം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: εἰς τὸ ἐμὸν ὄνομα എന്ന സ്നാനസംബന്ധിയായ പ്രയോഗം
  choice: എന്റെ നാമത്തിലേക്കു
  alternative: എന്റെ നാമത്തിൽ
  rationale: εἰς എന്ന ഉപസർഗത്തിന്റെ ‘ലേക്ക്/അകത്തേക്ക്’ എന്ന ദിശാസൂചന നിലനിർത്തുന്നത് മൂലപാഠത്തിന്റെ ബന്ധപരമായ ദൈവശാസ്ത്രഭാരം മുൻകൂട്ടി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു. കൂടുതൽ പതിവായ ‘നാമത്തിൽ’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. വാക്യം മുൻവാക്യത്തോടു ബന്ധപ്പെടുന്ന ഉദ്ദേശ്യവാക്യഖണ്ഡമായതിനാൽ ‘-വേണ്ടതിന്’ എന്ന അവസാനരൂപം നിലനിർത്തിയിരിക്കുന്നു.
