revisions:
- from: നിങ്ങൾ എന്റെ നാമത്തിലേക്കു സ്നാനം ഏറ്റുവെന്ന് ആരും പറയാതിരിക്കേണ്ടതിന്[a].
  to: നിങ്ങളെ എന്റെ നാമത്തിലേക്കു സ്നാനപ്പെടുത്തി എന്ന് ആരും പറയാതിരിക്കേണ്ടതിന്[a].
  rationale: The revision retains the Greek purpose construction and the literal directional force of εἰς, while replacing the less explicitly passive “സ്നാനം ഏറ്റു” with a natural Malayalam construction that clearly represents “you were baptized.” The alternative idiomatic rendering of εἰς is retained in the footnote.
  reviewer_model: gpt-5.6-terra
