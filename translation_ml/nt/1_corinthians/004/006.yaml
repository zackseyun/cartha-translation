id: 1CO.4.6
reference: 1 Corinthians 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: ml
  text: സഹോദരന്മാരേ,[a] ഈ കാര്യങ്ങൾ ഞാൻ നിങ്ങളെ നിമിത്തം എന്നെയും അപ്പൊല്ലോസിനെയും സംബന്ധിച്ച് പ്രയോഗിച്ചിരിക്കുന്നു; നിങ്ങൾ ഞങ്ങളെ ഉദാഹരണമാക്കി, “എഴുതിയിരിക്കുന്നതിനു അപ്പുറം പോകരുത്”[b] എന്നത് പഠിക്കേണ്ടതിനും, നിങ്ങളിൽ ആരും ഒരാളുടെ പക്ഷംപിടിച്ച് മറ്റൊരാൾക്കെതിരെ അഹങ്കരിക്കാതിരിക്കേണ്ടതിനുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരും സഹോദരിമാരും’ എന്നും അർഥമാകാം; ഗ്രീക്കിലെ ‘സഹോദരന്മാർ’ എന്ന പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട ഒരു സമൂഹത്തെ അഭിസംബോധന ചെയ്യാനും ഉപയോഗിക്കാം.
    reason: cultural_note
  - marker: b
    text: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തമാണ്; അക്ഷരാർഥത്തിൽ, ‘“എഴുതിയിരിക്കുന്നതിനപ്പുറം അല്ല” എന്നത്.’ ഇത് ഒരു മുദ്രാവാക്യമോ ചൊല്ലോ ആയിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ഇക്കാര്യങ്ങൾ
  rationale: മുൻപുള്ള ചർച്ചയെ ബഹുവചനത്തിൽ ചൂണ്ടിക്കാണിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്ക് പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; സമ്മിശ്ര വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: എന്നിലേക്കും അപ്പൊല്ലോസിലേക്കും പ്രയോഗിച്ചിരിക്കുന്നു
  rationale: മുൻചർച്ചയെ പൗലോസിനോടും അപ്പൊല്ലോസിനോടും ബന്ധപ്പെടുത്തി മാതൃകയാക്കിയെന്ന ആലങ്കാരിക കൈമാറ്റം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ ഗുണം/ലക്ഷ്യം സൂചിപ്പിക്കുന്നതിനാൽ വായനാസൗകര്യമുള്ള തുല്യപ്രയോഗം.
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: ഞങ്ങളിലൂടെ ... നിങ്ങൾ പഠിക്കാനും
  rationale: പൗലോസും അപ്പൊല്ലോസും പാഠം പഠിക്കാനുള്ള മാതൃകയോ മാധ്യമമോ ആണെന്ന സംക്ഷിപ്ത ഗ്രീക്ക് ആശയം നൽകുന്നു.
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: “എഴുതിയിരിക്കുന്നതിനു അപ്പുറം പോകരുത്” എന്നത്
  rationale: ക്രിയ സൂചിതമായിരിക്കുന്ന ദീർഘവൃത്തീയ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉപദേശാത്മക ശക്തി വ്യക്തമായി നൽകുന്നു; സംക്ഷിപ്തതയെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: φυσιοῦσθε
  choice: അഹങ്കരിക്കാതിരിക്കാനും
  rationale: ‘ഊതിവീർപ്പിക്കുക’ എന്ന രൂപകം മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമാകുന്നതിനാൽ സന്ദർഭത്തിലെ ഗർവം/അഹങ്കാരം നേരിട്ട് പറയുന്നു.
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: ഒരാളെ അനുകൂലിച്ച് മറ്റൊരാൾക്കെതിരെ
  rationale: കൊരിന്തിലെ കക്ഷിഭാവത്തിന്റെ അനുകൂല-വിരുദ്ധ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: τό· Μὴ ὑπὲρ ἃ γέγραπται എന്ന ദീർഘവൃത്തീയ വാക്യത്തിന്റെ അർഥം
  choice: “എഴുതിയിരിക്കുന്നതിനു അപ്പുറം പോകരുത്” എന്ന ഉപദേശമായി പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: “എഴുതിയിരിക്കുന്നതിനു അപ്പുറമല്ല” എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ മുദ്രാവാക്യരൂപം.
  rationale: ഗ്രീക്ക് വാക്യം സംക്ഷിപ്തവും വ്യാഖ്യാനവൈവിധ്യമുള്ളതുമാണെങ്കിലും, പഠിക്കേണ്ട പാഠമായി ഇത് ഉപദേശാത്മകമായി പ്രവർത്തിക്കുന്നു. വ്യക്തമായ ക്രിയ ചേർക്കുന്നത് ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ രണ്ടു ലക്ഷ്യവാക്യങ്ങളും കക്ഷിഭാവത്തിനെതിരായ മുന്നറിയിപ്പും നിലനിർത്തിയിരിക്കുന്നു; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
