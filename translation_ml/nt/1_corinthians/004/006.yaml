revisions:
- from: സഹോദരന്മാരേ,[a] ഇക്കാര്യങ്ങൾ നിങ്ങൾക്കുവേണ്ടി എന്നിലേക്കും അപ്പൊല്ലോസിലേക്കും പ്രയോഗിച്ചിരിക്കുന്നു. ഞങ്ങളിലൂടെ, “എഴുതിയിരിക്കുന്നതിനു അപ്പുറം പോകരുത്”[b] എന്നത് നിങ്ങൾ പഠിക്കാനും അങ്ങനെ നിങ്ങളിൽ ആരും ഒരാളെ അനുകൂലിച്ച് മറ്റൊരാൾക്കെതിരെ അഹങ്കരിക്കാതിരിക്കാനും വേണ്ടിയാണിത്.
  to: സഹോദരന്മാരേ,[a] ഈ കാര്യങ്ങൾ ഞാൻ നിങ്ങളെ നിമിത്തം എന്നെയും അപ്പൊല്ലോസിനെയും സംബന്ധിച്ച് പ്രയോഗിച്ചിരിക്കുന്നു; നിങ്ങൾ ഞങ്ങളെ ഉദാഹരണമാക്കി, “എഴുതിയിരിക്കുന്നതിനു അപ്പുറം പോകരുത്”[b] എന്നത് പഠിക്കേണ്ടതിനും, നിങ്ങളിൽ ആരും ഒരാളുടെ പക്ഷംപിടിച്ച് മറ്റൊരാൾക്കെതിരെ അഹങ്കരിക്കാതിരിക്കേണ്ടതിനുമാണ്.
  rationale: മൂലത്തിലെ ആലങ്കാരിക ‘പ്രയോഗം’ പൗലോസിനെയും അപ്പൊല്ലോസിനെയും സംബന്ധിച്ചുള്ളതാണെന്ന ബന്ധം തിരുത്തി. ἐν ἡμῖν എന്നതിന്റെ ഉദാഹരണപരമായ സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കി. രണ്ട് ἵνα-ലക്ഷ്യവാക്യങ്ങളും, ‘എഴുതിയിരിക്കുന്നതിനു അപ്പുറം’ എന്ന വിവാദാസ്പദ സംക്ഷിപ്തവാക്യത്തിന്റെ ഉപദേശാത്മക പരിഭാഷയും, അതിന്റെ അസ്പഷ്ടത സൂചിപ്പിക്കുന്ന അടിക്കുറിപ്പും സംരക്ഷിച്ചു.
