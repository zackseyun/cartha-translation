  yaml_path: translation/nt/1_corinthians/004/018.yaml
  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: ml
  text: ഞാൻ നിങ്ങളുടെ അടുക്കൽ വരില്ലെന്ന മട്ടിൽ ചിലർ അഹങ്കാരത്താൽ വീർത്തിരിക്കുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങളുടെ അടുക്കൽ വരില്ലെന്നു കരുതി ചിലർ അഹങ്കാരികളായിരിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: സ്വയം വലിയവരായി കരുതുന്ന അഹങ്കാരത്തിന് ‘വീർത്തിരിക്കുക’ എന്ന രൂപകം പൗലോസ് 1 കൊരിന്ത്യരിൽ ആവർത്തിച്ച് ഉപയോഗിക്കുന്നു; 1 കൊരി 4:6, 4:19; 5:2; 8:1; 13:4 കാണുക.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: എന്ന മട്ടിൽ
  rationale: കൊരിന്ത്യരിൽ ചിലരുടെ മനോഭാവത്തിന് അടിസ്ഥാനം പൗലോസ് വരില്ലെന്ന തെറ്റായ ധാരണയാണെന്ന താരതമ്യാത്മകവും സങ്കൽപ്പാത്മകവുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളുടെ അടുക്കൽ വരില്ലെന്ന്
  rationale: ὡς-നോട് ആശ്രയിച്ചുള്ള ഈ ജനിറ്റീവ് പാർട്ടിസിപ്പിൾ ഘടന പൗലോസിന്റെ നേരിട്ടുള്ള പ്രസ്താവനയല്ല, ചിലർ കരുതുന്ന ഒരു സാഹചര്യമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: δέ
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ മൃദുവായ സംയോജകമാണ്; മുൻവാക്യത്തിൽനിന്നുള്ള ആശയപ്രവാഹം മലയാളത്തിലെ വാക്യക്രമംകൊണ്ട് മതിയായ വിധം പ്രകടമാകുന്നു.
- source_word: ἐφυσιώθησάν
  choice: അഹങ്കാരംകൊണ്ട് വീർപ്പിച്ചിരിക്കുന്നു
  rationale: φυσιόω എന്ന ക്രിയയിലെ ‘വീർപ്പിക്കുക’ എന്ന പൗലോസിന്റെ ആവർത്തിത രൂപകം നിലനിർത്തുകയും അതിന്റെ ഉദ്ദേശ്യം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അഒറിസ്റ്റ് ഇവിടെ ഉണ്ടായെത്തിയ നിലയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വീർപ്പിച്ചിരിക്കുന്നു’ ഉപയോഗിച്ചു.
- source_word: τινες
  choice: ചിലർ
  rationale: സഭയിലെ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന അനിശ്ചിത ബഹുവചനം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: കൊരിന്ത്യരുടെ അഹങ്കാരത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ വിമർശനം
  choice: ‘അഹങ്കാരംകൊണ്ട് വീർപ്പിച്ചിരിക്കുന്നു’ എന്ന രൂപകം നിലനിർത്തുക.
  alternative: ‘അഹങ്കാരികളായിരിക്കുന്നു’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: രൂപകത്തെ നിലനിർത്തുന്നത് മൂലപാഠത്തോടും 1 കൊരിന്ത്യരിൽ പൗലോസ് ആവർത്തിച്ച് ഉപയോഗിക്കുന്ന ഭാഷയോടും കൂടുതൽ വിശ്വസ്തമാണ്; ‘അഹങ്കാരംകൊണ്ട്’ എന്നത് ആ രൂപകത്തിന്റെ അർഥം ആധുനിക വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിങ്ങളുടെ അടുക്കൽ’ എന്നത് πρὸς ὑμᾶς എന്ന ദിശാസൂചന കൃത്യമായി നൽകുന്നു. ‘എന്ന മട്ടിൽ’ സങ്കൽപ്പാത്മക ഭാവം നിലനിർത്തുന്നു; ‘അഹങ്കാരംകൊണ്ട് വീർപ്പിച്ചിരിക്കുന്നു’ പൗലോസിന്റെ രൂപകവും സാധാരണ വായനക്കാരനുള്ള വ്യക്തതയും ഒരുമിപ്പിക്കുന്നു.
