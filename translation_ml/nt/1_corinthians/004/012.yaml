  revision_rationale: 'The revision is limited to explicit number and referent: “കൈകളാൽ” reflects the plural χερσίν, and “ഞങ്ങളെ പീഡിപ്പിക്കുമ്പോൾ” makes explicit the apostles as the recipients of persecution. No object is added to “സഹിച്ചുനിൽക്കുന്നു,” preserving the Greek’s unexpressed object.'
