review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of strenuous labor through manual work, blessing in response to reviling, and endurance under persecution. A small revision makes the plural force of ταῖς ἰδίαις χερσίν explicit and clarifies that the apostles, not an unspecified object, are the ones persecuted.
  naturalness: The Malayalam is clear and suitably dignified. “സ്വന്തം കൈകളാൽ” and “ഞങ്ങളെ പീഡിപ്പിക്കുമ്പോൾ” are natural modern-standard forms and make the parallel clauses more precise.
  terminology: “കഠിനാധ്വാനം,” “അനുഗ്രഹിക്കുന്നു,” and “സഹിച്ചുനിൽക്കുന്നു” appropriately convey κοπιῶμεν, εὐλογοῦμεν, and ἀνεχόμεθα. The footnote’s “നിന്ദിക്കുമ്പോൾ” is a valid lexical alternative for λοιδορούμενοι.
  issues:
  - severity: low
    issue: The manual-work phrase uses singular “കൈകൊണ്ട്” for Greek plural χερσίν.
    rationale: Singular can be idiomatic in Malayalam, but “സ്വന്തം കൈകളാൽ” more directly retains the Greek emphasis on working with their own hands.
  - severity: low
    issue: The persecution clause does not state whom the persecutors persecute.
    rationale: Although the subject can be inferred, “ഞങ്ങളെ പീഡിപ്പിക്കുമ്പോൾ” clearly represents the passive participle διωκόμενοι and matches the preceding parallel clause.
  revised_text: ഞങ്ങൾ സ്വന്തം കൈകളാൽ പണിയെടുത്ത് കഠിനാധ്വാനം ചെയ്യുന്നു. ഞങ്ങളെ അധിക്ഷേപിക്കുമ്പോൾ[a], ഞങ്ങൾ അനുഗ്രഹിക്കുന്നു; ഞങ്ങളെ പീഡിപ്പിക്കുമ്പോൾ, ഞങ്ങൾ സഹിച്ചുനിൽക്കുന്നു.
