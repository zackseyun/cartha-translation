id: 1CO.4.12
reference: 1 Corinthians 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: ml
  text: ഞങ്ങൾ സ്വന്തം കൈകളാൽ പണിയെടുത്ത് കഠിനാധ്വാനം ചെയ്യുന്നു. ഞങ്ങളെ അധിക്ഷേപിക്കുമ്പോൾ[a], ഞങ്ങൾ അനുഗ്രഹിക്കുന്നു; ഞങ്ങളെ പീഡിപ്പിക്കുമ്പോൾ, ഞങ്ങൾ സഹിച്ചുനിൽക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ഞങ്ങളെ നിന്ദിക്കുമ്പോൾ.’'
    reason: λοιδορούμενοι എന്ന പദത്തിന്റെ ‘അധിക്ഷേപിക്കുക/നിന്ദിക്കുക’ എന്ന അടുത്ത അർഥവികല്പം സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: κοπιῶμεν
  choice: കഠിനാധ്വാനം ചെയ്യുന്നു
  rationale: ക്ഷീണം വരുത്തുന്ന കഠിനപ്രയത്നം എന്ന അർഥം വ്യക്തമാക്കുന്നു; സാധാരണ ജോലി ചെയ്യുക എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἐργαζόμενοι
  choice: പണിയെടുത്ത്
  rationale: പ്രധാന ക്രിയയിലെ കഠിനാധ്വാനം എങ്ങനെയാണെന്നു വിശദീകരിക്കുന്ന പങ്കാളിക്രിയയുടെ സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ταῖς ἰδίαις χερσίν
  choice: സ്വന്തം കൈകൊണ്ട്
  rationale: ἰδίαις നൽകുന്ന ഊന്നലും കൈവേലയിലൂടെ സ്വയം അധ്വാനിക്കുന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: λοιδορούμενοι
  choice: ഞങ്ങളെ അധിക്ഷേപിക്കുമ്പോൾ
  rationale: ശകാരിക്കുകയും അപമാനിക്കുകയും ചെയ്യുക എന്ന നിഷ്ക്രിയാർഥം ആധുനികവും മാന്യവുമായ ഭാഷയിൽ നൽകുന്നു; സാഹചര്യസൂചകമായ പങ്കാളിക്രിയ മലയാളത്തിൽ ഉപവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: εὐλογοῦμεν
  choice: ഞങ്ങൾ അനുഗ്രഹിക്കുന്നു
  rationale: ദൂഷണത്തിനു പകരം അനുഗ്രഹം നൽകുന്നു എന്ന വേദപുസ്തകപരമായ പ്രധാന പദവും വിരുദ്ധസമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: διωκόμενοι
  choice: പീഡിപ്പിക്കുമ്പോൾ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിലെ ശത്രുതാപരമായ വേട്ടയാടൽ/പീഡനം എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἀνεχόμεθα
  choice: ഞങ്ങൾ സഹിച്ചുനിൽക്കുന്നു
  rationale: വിരോധപരമായ പെരുമാറ്റം ക്ഷമയോടെ താങ്ങുക എന്ന അർഥം നൽകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത പ്രത്യക്ഷ കർമപദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദുരുപദ്രവത്തോടുള്ള അപ്പൊസ്തലിക പ്രതികരണം
  choice: അധിക്ഷേപത്തിന് അനുഗ്രഹത്താലും പീഡനത്തിന് സഹനത്താലും പ്രതികരിക്കുന്ന അപ്പൊസ്തലന്മാരുടെ പ്രവൃത്തിയായി വാക്യം അവതരിപ്പിക്കുന്നു.
  alternative: ഇത് എല്ലാ വിശ്വാസികൾക്കുമുള്ള പ്രത്യക്ഷ കല്പനയായി വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം കല്പനാരൂപത്തിലല്ല, അപ്പൊസ്തലിക പെരുമാറ്റത്തിന്റെ വിവരണരൂപത്തിലാണ്; അതിന്റെ ധാർമിക ശക്തി നിലനിർത്തിക്കൊണ്ട് അധിക സിദ്ധാന്തവാദം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ മാന്യതയുള്ള ശൈലി. ഗ്രീക്കിലെ സമാന്തര ഘടനയും അർദ്ധവിരാമവും സംരക്ഷിച്ചു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിലെ സ്ഥാനഭ്രഷ്ടമായ അടിക്കുറിപ്പുസൂചകം ശരിയായ പദമായ ‘അധിക്ഷേപിക്കുമ്പോൾ’ എന്നതിനുശേഷം വെച്ചു.
