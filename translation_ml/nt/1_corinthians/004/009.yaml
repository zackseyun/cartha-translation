language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δοκῶ ⸀γάρ, ὁ θεὸς ἡμᾶς τοὺς ἀποστόλους ἐσχάτους ἀπέδειξεν ὡς ἐπιθανατίους, ὅτι θέατρον ἐγενήθημεν τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവം അപ്പൊസ്തലന്മാരായ ഞങ്ങളെ ഏറ്റവും ഒടുവിലുള്ളവരായി, മരണത്തിനു വിധിക്കപ്പെട്ടവരെപ്പോലെ[a], പ്രദർശിപ്പിച്ചുവെന്നാണ് എനിക്കു തോന്നുന്നത്. കാരണം, ഞങ്ങൾ ലോകത്തിനും ദൂതന്മാർക്കും മനുഷ്യർക്കും[c] ഒരു പൊതുകാഴ്ചയായി[b] മാറിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മരിക്കാനായി നിശ്ചയിക്കപ്പെട്ടവരെപ്പോലെ.’ ഗ്രീക്കുപദം മരണത്തിനായി മാറ്റിവെക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു; പൊതുരംഗത്തിലെ വധക്കാഴ്ചയുടെ പശ്ചാത്തലം ഇതിലുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘ഒരു നാടകശാലയായി’; ഇവിടെ ഉദ്ദേശിക്കുന്നത് എല്ലാവരും നോക്കിക്കാണുന്ന പൊതുകാഴ്ചയാണ്.
    reason: lexical_alternative
  - marker: c
    text: ‘മനുഷ്യർ’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്കുപദം പുരുഷന്മാരെ മാത്രം അല്ല, ദൂതന്മാരിൽനിന്നു വ്യത്യസ്തരായ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: എന്തെന്നാൽ … എന്നാണ് എനിക്കു തോന്നുന്നത്
  rationale: γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു; δοκῶ എന്ന ഒന്നാംപുരുഷ വിലയിരുത്തൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: അപ്പൊസ്തലന്മാരായ ഞങ്ങളെ
  rationale: ‘ഞങ്ങളെ’ എന്ന സർവനാമത്തെ ‘അപ്പൊസ്തലന്മാർ’ എന്നു തിരിച്ചറിയിക്കുന്ന ഗ്രീക്ക് സമാനാധികരണഘടന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐσχάτους
  choice: ഏറ്റവും ഒടുവിലുള്ളവരായി
  rationale: അപ്പൊസ്തലന്മാർക്ക് നൽകപ്പെട്ട അവസാനത്തെയും താഴ്ന്നതുമായ സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: ἀπέδειξεν
  choice: പ്രദർശിപ്പിച്ചു
  rationale: തുടർന്നുള്ള പൊതുകാഴ്ചയുടെ രൂപകവുമായി ചേരുന്ന പരസ്യമായി കാട്ടിവെക്കൽ എന്ന ആശയം നൽകുകയും ഗ്രീക്ക് aorist-ന്റെ ഭൂതകാലരൂപം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὡς ἐπιθανατίους
  choice: മരണത്തിനു വിധിക്കപ്പെട്ടവരെപ്പോലെ
  rationale: മരിക്കാനായി നിശ്ചയിക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥവും സാധ്യതയുള്ള രംഗശാലാ പശ്ചാത്തലവും അതിരുകടക്കാതെ പ്രകടമാക്കുന്നു.
- source_word: θέατρον ἐγενήθημεν
  choice: ഒരു പൊതുകാഴ്ചയായി മാറിയിരിക്കുന്നു
  rationale: θέατρον എന്നത് ഇവിടെ കെട്ടിടമായ ‘നാടകശാല’ എന്നതിലുപരി എല്ലാവരും നോക്കിക്കാണുന്ന കാഴ്ചയെ സൂചിപ്പിക്കുന്നതിനാൽ രൂപകത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: ലോകത്തിനും ദൂതന്മാർക്കും മനുഷ്യർക്കും
  rationale: ഗ്രീക്കിലെ മൂന്ന് സമാന്തര dative പ്രയോഗങ്ങളും കാഴ്ച കാണുന്ന വിശ്വവ്യാപക സദസ്സും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀγγέλοις എന്നതിന്റെ അർഥം
  choice: ദൂതന്മാർ—അപ്പൊസ്തലന്മാരുടെ പരസ്യമായ അപമാനം കാണുന്ന സ്വർഗീയ ജീവികൾ
  alternative: സന്ദേശവാഹകർ
  rationale: ‘ലോകം’, ‘മനുഷ്യർ’ എന്നിവയോടൊപ്പമുള്ള പ്രയോഗത്തിൽ അമാനുഷിക സ്വർഗീയ ജീവികൾ എന്ന വായനയാണ് ഏറ്റവും സ്വാഭാവികം; വാക്യത്തിനപ്പുറമുള്ള സിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അപ്പൊസ്തലന്മാർ’, ‘ദൂതന്മാർ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി രണ്ടു മലയാളവാക്യങ്ങളാക്കി.
