id: 1CO.4.7
reference: 1 Corinthians 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: ml
  text: എന്തെന്നാൽ, ആരാണ് നിന്നെ മറ്റുള്ളവരിൽനിന്ന് വേർതിരിക്കുന്നത്?[a] നീ സ്വീകരിക്കാത്തതായി നിനക്കു എന്താണുള്ളത്? നീ അത് സ്വീകരിച്ചിട്ടുണ്ടെങ്കിൽ, സ്വീകരിക്കാത്തതുപോലെ നീ എന്തിന് വീമ്പുപറയുന്നു?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ആരാണ് നിന്നെ വ്യത്യസ്തനാക്കുന്നത്?” ഗ്രീക്ക് ക്രിയയ്ക്ക് “വേർതിരിക്കുക,” “വ്യത്യാസപ്പെടുത്തുക,” “വ്യത്യസ്തനാക്കുക” എന്നീ അർഥങ്ങൾ വരാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: ആരാണ് നിന്നെ വ്യത്യസ്തനാക്കുന്നത്?
  rationale: διακρίνω എന്ന ക്രിയ ഇവിടെ σε എന്ന കർമത്തോടുകൂടി വരുന്നു; കൊരിന്ത്യനെ മറ്റുള്ളവരിൽനിന്ന് ശ്രേഷ്ഠനാക്കുന്ന അടിസ്ഥാനം എന്താണെന്ന വെല്ലുവിളിയാണ് സന്ദർഭത്തിൽ ഉയരുന്നത്. ‘വ്യത്യസ്തനാക്കുന്നത്’ താരതമ്യഭാവവും ചോദ്യത്തിന്റെ മൂർച്ചയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. γάρ മുൻവാക്യവുമായി കാരണബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും, ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ ‘എന്തെന്നാൽ’ ചേർക്കാതെ ചോദ്യക്രമത്തിലൂടെ ബന്ധം നിലനിർത്തുന്നു.
- source_word: τί δὲ ἔχεις
  choice: നിനക്കുള്ളതിൽ ... എന്തുണ്ട്?
  rationale: δὲ ഇവിടെ ശക്തമായ വിരോധമല്ല, ചോദ്യങ്ങളെ ബന്ധിപ്പിക്കുന്ന ലഘു സംയോജകമാണ്. മലയാളത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാത്ത തുടർച്ച സ്വാഭാവികമാണ്.
- source_word: ὃ οὐκ ἔλαβες
  choice: നീ സ്വീകരിക്കാത്തതായി
  rationale: ἔλαβες ലഭിച്ചതിനെ സ്വന്തം ഉത്ഭവമല്ലാത്ത, സ്വീകരിച്ച ഒന്നായി ചിത്രീകരിക്കുന്നു. ‘സ്വീകരിക്കുക’ കർത്താവിനെ വ്യക്തമായി നിലനിർത്തുകയും പൂർത്തിയായ സ്വീകരണത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: നീ അതു സ്വീകരിച്ചതാണെങ്കിൽ
  rationale: καὶ ഇവിടെ ഊന്നൽ നൽകുന്നു. ‘സ്വീകരിച്ചതാണെങ്കിൽ’ എന്ന രൂപം ആ വസ്തു യഥാർത്ഥത്തിൽ ലഭിച്ചതാണെന്ന നിഗമനാത്മക ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘അതു’ മുൻചോദ്യത്തിലെ വസ്തുവിനെ സൂചിപ്പിക്കാൻ ചേർത്തതാണ്.
- source_word: τί καυχᾶσαι
  choice: വീമ്പിളക്കുന്നത് എന്തിന്?
  rationale: καυχάομαι ഇവിടെ അഭിമാനത്തോടെ സ്വയം ഉയർത്തിക്കാട്ടുന്നതിനെ ശാസിക്കുന്നു. ‘വീമ്പിളക്കുക’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സന്ദർഭത്തിലെ നിഷേധാത്മകഭാവം പ്രകടമാക്കുന്നതുമാണ്.
- source_word: ὡς μὴ λαβών
  choice: സ്വീകരിക്കാത്തതുപോലെ
  rationale: 'ഈ കൃദന്തരൂപം യാഥാർഥ്യത്തിന് വിരുദ്ധമായ പെരുമാറ്റരീതിയെ സൂചിപ്പിക്കുന്നു: സ്വീകരിച്ചവൻ സ്വീകരിക്കാത്തവനെപ്പോലെ വീമ്പിളക്കുന്നു. മലയാളത്തിലെ ‘-ത്തതുപോലെ’ രൂപം അത് സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.'
theological_decisions:
- issue: മനുഷ്യന്റെ ശ്രേഷ്ഠതയെയും ലഭിച്ച ദാനങ്ങളെയും കുറിച്ചുള്ള പൗലോസിന്റെ ശാസനയുടെ വ്യാപ്തി
  choice: ഏതൊരു വ്യത്യാസമോ കൈവശമുള്ള കാര്യമോ സ്വയം ഉത്ഭവിച്ചതല്ല, സ്വീകരിച്ചതാണ് എന്ന പൊതുവായ ഭാഷ നിലനിർത്തുന്നു.
  alternative: ഇത് ആത്മീയവരങ്ങളിലേക്കോ ശുശ്രൂഷാപദവികളിലേക്കോ മാത്രം ചുരുക്കുക; അല്ലെങ്കിൽ എല്ലാ കഴിവുകളും പദവികളും അനുഗ്രഹങ്ങളും എന്ന് വിവർത്തനത്തിൽതന്നെ വിശദീകരിക്കുക.
  rationale: അടുത്ത സന്ദർഭം അപ്പൊസ്തലശുശ്രൂഷ, കക്ഷിഭിമാനം, വീമ്പ് എന്നിവയെക്കുറിച്ചാണെങ്കിലും വാക്യത്തിന്റെ ഭാഷ പൊതുവായതാണ്. അതിനാൽ മൂലപാഠത്തേക്കാൾ അർഥം ചുരുക്കുകയോ വിപുലീകരിക്കുകയോ ചെയ്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവമുള്ള ചോദ്യശൈലി ഉപയോഗിച്ചു. ഏകവചനമായ σε/ἔλαβες/καυχᾶσαι എന്നിവയ്ക്ക് ‘നിന്നെ/നീ’ എന്ന ഏകവചനം നിലനിർത്തി. ‘വീമ്പിളക്കുക’ എന്നത് നിഷേധാത്മകമായ καυχάομαι-യുടെ ഭാവം വ്യക്തമായി നൽകുന്നു.
