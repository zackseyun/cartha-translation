review_pass:
  verdict: revise
  source_fidelity: The three rhetorical questions and their sequence are retained. The revision explicitly represents γάρ with “എന്തെന്നാൽ” and renders διακρίνει without introducing a masculine-specific form. “സ്വീകരിച്ചിട്ടുണ്ടെങ്കിൽ” appropriately conveys the emphatic premise εἰ δὲ καὶ ἔλαβες, while the final clause preserves the contrary-to-fact comparison.
  naturalness: The draft’s “നിനക്കുള്ളതിൽ നീ സ്വീകരിക്കാത്തതായി എന്തുണ്ട്?” is understandable but syntactically strained. “നീ സ്വീകരിക്കാത്തതായി നിനക്കു എന്താണുള്ളത്?” is more idiomatic modern standard Malayalam. “വീമ്പുപറയുന്നു” is a more natural verbal expression than “വീമ്പിളക്കുന്നത്” in this rhetorical question.
  terminology: “സ്വീകരിക്കുക” consistently renders receiving, and “വീമ്പുപറയുക” accurately communicates the negative context of καυχᾶσαι without adding theological interpretation. “മറ്റുള്ളവരിൽനിന്ന് വേർതിരിക്കുന്നത്” naturally conveys the comparative contextual force of διακρίνει and avoids the draft’s masculine-marked “വ്യത്യസ്തനാക്കുന്നത്.”
  issues:
  - severity: low
    issue: The causal force of γάρ is absent from the draft.
