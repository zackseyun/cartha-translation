id: 1CO.4.15
reference: 1 Corinthians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: ml
  text: കാരണം, മശീഹയിൽ നിങ്ങൾക്കു പതിനായിരം മേൽനോട്ടക്കാർ[a] ഉണ്ടായാലും പിതാക്കന്മാർ അനേകരില്ല. മശീഹയായ യേശുവിൽ സുവിശേഷത്തിലൂടെ നിങ്ങളെ ജനിപ്പിച്ചത് ഞാനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പതിനായിരം’ എന്നത് ഇവിടെ അത്യധികമായ ഒരു സംഖ്യയെ സൂചിപ്പിക്കുന്ന അതിശയോക്തിയായിരിക്കാം. ‘മേൽനോട്ടക്കാർ’ എന്നതിനുള്ള ഗ്രീക്ക് പദം കുട്ടിയെ നോക്കിനടത്തുകയും നിയന്ത്രിക്കുകയും ചെയ്തിരുന്ന സംരക്ഷകനെയാണ് സൂചിപ്പിക്കുന്നത്; പ്രധാനമായും ക്ലാസ്‌മുറിയിലെ അധ്യാപകനെയല്ല.
    reason: lexical_and_cultural_note
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഞാൻ നിങ്ങളെ ജനിപ്പിച്ചു.’ സുവിശേഷത്തിലൂടെ അവരെ വിശ്വാസത്തിലേക്കു കൊണ്ടുവന്നതിലുള്ള പൗലോസിന്റെ പങ്കിനെ സൂചിപ്പിക്കുന്ന രൂപകമാണിത്.
    reason: metaphor_clarification
lexical_decisions:
- source_word: μυρίους
  choice: പതിനായിരം
  rationale: പദത്തിന്റെ അക്ഷരാർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത്യധികമായ സംഖ്യയെ സൂചിപ്പിക്കുന്ന അതിശയോക്തിയായും സ്വാഭാവികമായി ഗ്രഹിക്കാം.
- source_word: παιδαγωγοὺς
  choice: മേൽനോട്ടക്കാർ
  rationale: ഗ്രീക്കോ-റോമൻ സമൂഹത്തിലെ കുട്ടിയെ നോക്കിനടത്തുകയും നിയന്ത്രിക്കുകയും ചെയ്തിരുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക ക്ലാസ്‌മുറിയിലെ ‘അധ്യാപകൻ’ എന്ന പരിമിത അർഥം ഒഴിവാക്കുന്നു.
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയിൽ / മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന അഭിഷിക്തപദവി ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; പൗലോസിന്റെ ‘ἐν’ പ്രയോഗവും നിലനിർത്തി.
- source_word: πατέρας
  choice: പിതാക്കന്മാർ
  rationale: മൂലപാഠത്തിലെ പിതൃത്വരൂപകം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിലൂടെ
  rationale: διά + genitive ഇവിടെ മാർഗമോ ഉപകരണമോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐγέννησα
  choice: നിങ്ങളെ ജനിപ്പിച്ചത് ഞാനാണ്
  rationale: ‘ജനിപ്പിച്ചു’ എന്ന ശക്തമായ പിതൃത്വരൂപകം നിലനിർത്തുന്നു; ‘ഞാൻ നിങ്ങളുടെ പിതാവായി’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രിയയോട് നേരിട്ടു ചേരുന്നു.
theological_decisions:
- issue: കൊരിന്ത്യരെ പൗലോസ് ‘ജനിപ്പിച്ചു’ എന്ന പിതൃത്വരൂപകം
  choice: ‘സുവിശേഷത്തിലൂടെ നിങ്ങളെ ജനിപ്പിച്ചത് ഞാനാണ്’ എന്നു രൂപകം നിലനിർത്തി.
  alternative: ‘ഞാൻ നിങ്ങളുടെ ആത്മീയപിതാവായി’
  rationale: മൂലപാഠം പൗലോസിന്റെ സുവിശേഷപ്രവർത്തനത്തിലൂടെയുള്ള അവരുടെ വിശ്വാസാരംഭത്തെ ജനനമായി ചിത്രീകരിക്കുന്നു. ‘ആത്മീയപിതാവ്’ എന്നു ചേർക്കുന്നത് പാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനവും സഭാപദവിസംബന്ധമായ ധ്വനിയും ഇറക്കുമതി ചെയ്യാം.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ തർക്കക്രമവും പിതൃത്വരൂപകത്തിന്റെ ശക്തിയും നിലനിർത്തിയിരിക്കുന്നു; ‘മേൽനോട്ടക്കാർ’ എന്നത് പുരാതന സാമൂഹികപങ്ക് ആധുനികമായി വ്യക്തമാക്കുന്നു.
