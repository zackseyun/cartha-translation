id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: ml
  text: 'ഇങ്ങനെ ഏതൊരാളും ഞങ്ങളെ കണക്കാക്കട്ടെ: മശീഹായുടെ[a] ശുശ്രൂഷകരായും ദൈവത്തിന്റെ മർമ്മങ്ങളുടെ കാര്യസ്ഥന്മാരായും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തുവിന്റെ.’ ഗ്രീക്കിലെ Χριστός എന്ന പദം ‘അഭിഷിക്തൻ’ എന്ന പദവിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: ഇങ്ങനെ
  rationale: തുടർന്ന് പറയുന്ന വിധത്തിൽ പൗലോസിനെയും സഹപ്രവർത്തകരെയും വിലയിരുത്തണമെന്ന ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു.
- source_word: ἡμᾶς
  choice: ഞങ്ങളെ
  rationale: λoγιζέσθω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള കർമം; സന്ദർഭത്തിൽ പൗലോസിനെയും അവനോടൊപ്പമുള്ള ശുശ്രൂഷകരെയും സൂചിപ്പിക്കുന്നു.
- source_word: λογιζέσθω
  choice: കണക്കാക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ നിർദേശാത്മക ശക്തി നിലനിർത്തുകയും ഒരാളെ ഒരു പ്രത്യേക നിലയിൽ കാണുക/പരിഗണിക്കുക എന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἄνθρωπος
  choice: ഏതൊരാളും
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപം ഇവിടെ പൊതുവായ അർഥത്തിലാണ്. ആ ലിംഗനിരപേക്ഷ പൊതുവ്യാപ്തി ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: —ആയും
  rationale: ഞങ്ങളെ ഏതു നിലയിലാണ് കണക്കാക്കേണ്ടതെന്നത് മലയാളത്തിലെ സമാന്തരമായ ‘ശുശ്രൂഷകരായും… കാര്യസ്ഥന്മാരായും’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: ὑπηρέτας
  choice: ശുശ്രൂഷകർ
  rationale: δοῦλος എന്ന പദത്തിലെ അടിമസ്ഥിതിയുടെ ശക്തി ഇതിലില്ല; അധികാരത്തിനു കീഴിൽ സേവിക്കുന്നവരെ സൂചിപ്പിക്കാൻ ‘ശുശ്രൂഷകർ’ യോജിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിന്റെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു നൽകി; ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ ചേർത്തു.
- source_word: οἰκονόμους
  choice: കാര്യസ്ഥന്മാർ
  rationale: മറ്റൊരാളുടേതായ ഗൃഹമോ സ്വത്തോ ഉത്തരവാദിത്വത്തോടെ കൈകാര്യം ചെയ്യാൻ ഏൽപ്പിക്കപ്പെട്ടവൻ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: μυστηρίων
  choice: മർമ്മങ്ങൾ
  rationale: ദൈവം വെളിപ്പെടുത്തുന്ന, മുമ്പ് മറഞ്ഞിരുന്ന സത്യങ്ങളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പദപ്രയോഗം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: മർമ്മങ്ങൾ ദൈവത്തിന്റേതും ദൈവത്തിൽനിന്നുള്ളതുമാണെന്ന സ്വാഭാവിക ജനിറ്റീവ് ബന്ധം പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഈ വാക്യത്തിൽ Χριστός ഒരു പേര് മാത്രമെന്നതിലുപരി ദൈവത്തിന്റെ അഭിഷിക്തനായവന്റെ പദവിയെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ‘ക്രിസ്തു’ എന്ന വായനയും സാധുവായ പരമ്പരാഗത പരിഭാഷയായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἄνθρωπος എന്ന പൊതുവായ ഏകവചനം
  choice: ഏതൊരാളും
  alternative: ഒരു മനുഷ്യൻ
  rationale: സന്ദർഭത്തിൽ ആൺവ്യക്തിയെ മാത്രം ഉദ്ദേശിക്കുന്നില്ല; ആരും പൗലോസിനെയും കൂട്ടരെയും ഇങ്ങനെ കണക്കാക്കണം എന്നതാണ് അർഥം. ‘ഏതൊരാളും’ അത് സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി നൽകുന്നു.
- issue: μυστήρια എന്നതിന്റെ അർഥപരിധി
  choice: മർമ്മങ്ങൾ
  alternative: രഹസ്യങ്ങൾ
  rationale: ദൈവിക സത്യങ്ങൾ മറഞ്ഞിരുന്നുവെങ്കിലും വെളിപ്പെടുത്തപ്പെട്ടവയാകാം എന്ന പൗലോസിന്റെ ആശയപരമായ സംഘർഷം ‘മർമ്മങ്ങൾ’ നിലനിർത്തുന്നു; വെറും രഹസ്യവിവരം എന്നായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആജ്ഞാരൂപം നിലനിർത്താൻ ‘കണക്കാക്കട്ടെ’ ഉപയോഗിച്ചു. ‘ശുശ്രൂഷകർ’ എന്നും ‘കാര്യസ്ഥന്മാർ’ എന്നും നൽകിയതിലൂടെ കീഴിലുള്ള സേവനവും ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വവും തമ്മിലുള്ള വ്യത്യാസം സംരക്ഷിച്ചു.
