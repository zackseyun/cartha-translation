id: 1CO.4.10
reference: 1 Corinthians 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: ml
  text: ഞങ്ങൾ മശീഹാനിമിത്തം മൂഢർ[a]; നിങ്ങളോ മശീഹായിൽ ജ്ഞാനികൾ[b]. ഞങ്ങൾ ബലഹീനർ; നിങ്ങളോ ശക്തർ. നിങ്ങൾ ബഹുമാനിതർ; ഞങ്ങളോ അപമാനിതർ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹായ്ക്കുവേണ്ടി’ അല്ലെങ്കിൽ ‘മശീഹാ കാരണം’ എന്നും പരിഭാഷപ്പെടുത്താം. διὰ Χριστόν എന്ന ഗ്രീക്ക് പ്രയോഗം കാരണമോ നിമിത്തമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘മശീഹായിൽ’. ഇത് പൗലോസ് പതിവായി ഉപയോഗിക്കുന്ന ἐν Χριστῷ എന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെയുള്ള ‘ബഹുമാനിതർ’, ‘അപമാനിതർ’ എന്നീ പദങ്ങൾ കേവലം ഉള്ളിലെ വികാരങ്ങളെയല്ല, മറ്റുള്ളവരുടെ കണ്ണിലെ പൊതുമാനത്തെയും അപമാനത്തെയും സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: മൂഢർ
  rationale: കൊരിന്ത്യരുടെ സ്വയംവിലയിരുത്തലിനെതിരായ പൗലോസിന്റെ മൂർച്ചയുള്ള പരിഹാസവും ‘ജ്ഞാനികൾ’ എന്നതിനോടുള്ള നേരിട്ടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: διὰ Χριστόν
  choice: മശീഹാ നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം/നിമിത്തം സ്വാഭാവികമായി നൽകുന്നു; ഉദ്ദേശ്യത്തിന്റെയോ ‘വേണ്ടി’ എന്നതിന്റെയോ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: φρόνιμοι
  choice: ജ്ഞാനികൾ
  rationale: ‘മൂഢർ’ എന്നതിനോടുള്ള പരിഹാസാത്മക വൈരുധ്യം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹായിൽ
  rationale: പൗലോസിന്റെ സവിശേഷമായ ἐν Χριστῷ പ്രയോഗം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ അതിന്റെ ബന്ധാത്മകവും ദൈവശാസ്ത്രപരവുമായ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: ἀσθενεῖς / ἰσχυροί
  choice: ബലഹീനർ / ശക്തർ
  rationale: ശാരീരിക, സാമൂഹിക, അധികാരപരമായ മാനങ്ങൾ ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ ഗ്രീക്കിലെ സമാന്തര വൈരുധ്യം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἔνδοξοι / ἄτιμοι
  choice: ബഹുമാനിതർ / അപമാനിതർ
  rationale: ആന്തരിക വികാരത്തെക്കാൾ മറ്റുള്ളവരുടെ കണ്ണിലെ പൊതുമാനവും അപമാനവും സൂചിപ്പിക്കുന്ന സാമൂഹിക വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡμεῖς / ὑμεῖς
  choice: ഞങ്ങൾ / നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള സർവനാമങ്ങളും അപ്പൊസ്തലന്മാരും കൊരിന്ത്യരും തമ്മിലുള്ള ആവർത്തിത വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: രണ്ടിടത്തും ‘മശീഹാ’
  alternative: ‘ക്രിസ്തു’
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരിന്റെ ഭാരം വഹിക്കുന്നതിനാൽ ‘മശീഹാ’ ഉപയോഗിച്ചു; അതിനെ വെറും വ്യക്തിനാമമാക്കി മാറ്റിയില്ല.
- issue: ἐν Χριστῷ എന്ന പ്രയോഗത്തിന്റെ വ്യാഖ്യാനം
  choice: ‘മശീഹായിൽ’ എന്ന രൂപത്തിൽ തന്നെ നിലനിർത്തുക
  alternative: ‘മശീഹായെ സംബന്ധിച്ചിടത്തോളം’ അല്ലെങ്കിൽ വിശദീകരണപരമായ മറ്റൊരു പരാവർത്തനം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ബന്ധാത്മകവും ഐക്യസൂചകവുമായ ദൈവശാസ്ത്രസാന്ദ്രതയെ ഒരു വ്യാഖ്യാനത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാൻ പദപ്രയോഗം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സുതാര്യവുമായ മലയാളം. ഗ്രീക്കിലെ മൂന്ന് സമാന്തര വൈരുധ്യങ്ങളും ആവർത്തിക്കുന്ന ‘ഞങ്ങൾ/നിങ്ങൾ’ ഊന്നലും ചിഹ്നവിന്യാസത്തിലൂടെ തെളിയിച്ചു; പരിഹാസത്തിന്റെ മൂർച്ച മൃദൂകരിച്ചിട്ടില്ല.
