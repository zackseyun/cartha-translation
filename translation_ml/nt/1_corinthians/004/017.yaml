id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: ml
  text: അതുകൊണ്ടാണ് ഞാൻ തിമൊഥെയൊസിനെ നിങ്ങളുടെ അടുക്കൽ അയച്ചത്. കർത്താവിൽ എനിക്ക് പ്രിയനും വിശ്വസ്തനുമായ മകനാണ്[a] അവൻ. മശീഹാ യേശുവിലുള്ള[b] എന്റെ വഴികൾ അവൻ നിങ്ങളെ ഓർമിപ്പിക്കും—എല്ലായിടത്തും എല്ലാ സഭകളിലും ഞാൻ പഠിപ്പിക്കുന്നതുപോലെതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് τέκνον എന്ന പദത്തിന്റെ കൂടുതൽ അക്ഷരാർഥം ‘കുട്ടി’ അഥവാ ‘സന്താനം’ എന്നാണ്; ഈ സന്ദർഭത്തിൽ ‘മകൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ക്രിസ്തുയേശുവിലുള്ള.’ ഗ്രീക്ക് Χριστός എന്ന പദവി ‘മശീഹാ’ എന്നാണ് അർഥമാക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: അതുകൊണ്ടാണ്
  rationale: മുൻവാദത്തിലേക്കുള്ള കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔπεμψα
  choice: അയച്ചത്
  rationale: ഗ്രീക്ക് ഏയോറിസ്റ്റിനെ സന്ദർഭോചിതമായ ലളിത ഭൂതകാലമായി നൽകുന്നു.
- source_word: Τιμόθεον
  choice: തിമൊഥെയൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: τέκνον
  choice: മകൻ
  rationale: പദത്തിന്റെ അടിസ്ഥാന അർഥം ‘കുട്ടി/സന്താനം’ എന്നാണെങ്കിലും, പുരുഷനായ തിമൊഥെയൊസിനോടുള്ള പൗലോസിന്റെ ആത്മീയ കുടുംബബന്ധം സ്വാഭാവിക മലയാളത്തിൽ ‘മകൻ’ എന്ന് വ്യക്തമാകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: പ്രിയനും വിശ്വസ്തനുമായ
  rationale: പൗലോസിന്റെ സ്നേഹവും തിമൊഥെയൊസിന്റെ ആശ്രയയോഗ്യതയും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ബന്ധത്തിന്റെയും ജീവിത-ശുശ്രൂഷാ മേഖലയുടെയും പൗലോസീയ പ്രയോഗം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἀναμνήσει
  choice: ഓർമിപ്പിക്കും
  rationale: ഭാവികാല പ്രവർത്തനത്തെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τὰς ὁδούς μου
  choice: എന്റെ വഴികൾ
  rationale: യാത്രാമാർഗങ്ങളല്ല, ജീവിതത്തിന്റെയും ശുശ്രൂഷയുടെയും മാതൃകകളെ സൂചിപ്പിക്കുന്ന രൂപകം അതിന്റെ വിശാലതയോടെ നിലനിർത്തുന്നു.
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിലുള്ള
  rationale: പൗലോസിന്റെ ‘വഴികൾ’ മശീഹാ യേശുവുമായുള്ള ബന്ധത്തിൽ നിർവചിക്കപ്പെടുന്നതായി വ്യാകരണബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: എല്ലായിടത്തും എല്ലാ സഭകളിലും ഞാൻ പഠിപ്പിക്കുന്നതുപോലെതന്നെ
  rationale: പൗലോസിന്റെ സാർവത്രികവും സ്ഥിരവുമായ പഠിപ്പിക്കൽ രീതിയോടുള്ള താരതമ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഇവിടെ Χριστός പദവിയുടെ അർഥബലം നിലനിർത്തുന്നതിനായി ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; പരിചിതമായ ലിപ്യന്തരരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘എന്റെ വഴികൾ’ എന്നതിന്റെ പരിധി
  choice: രൂപകം നിലനിർത്തുന്ന ‘എന്റെ വഴികൾ’
  alternative: എന്റെ ജീവിതരീതികൾ / എന്റെ പെരുമാറ്റം
  rationale: ὁδοί പൗലോസിന്റെ ജീവിതം, ശുശ്രൂഷ, പഠിപ്പിക്കൽ എന്നിവയുടെ സ്ഥാപിത മാതൃകകളെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ഒരു അർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാൻ രൂപകം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എന്റെ വഴികൾ’ എന്ന ബൈബിൾരൂപകം നിലനിർത്തിയെങ്കിലും വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
