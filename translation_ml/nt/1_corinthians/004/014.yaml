translation:
  language: ml
  text: നിങ്ങളെ ലജ്ജിപ്പിക്കാനല്ല[a] ഞാൻ ഈ കാര്യങ്ങൾ എഴുതുന്നത്; മറിച്ച്, എന്റെ പ്രിയമക്കളെന്നു കരുതി നിങ്ങളെ ഉപദേശിക്കുകയാണ്[b].
