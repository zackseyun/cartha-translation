id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: ml
  text: നിങ്ങൾ ഇതിനകം തൃപ്തരായിരിക്കുന്നു; ഇതിനകം സമ്പന്നരായിരിക്കുന്നു; ഞങ്ങളെ കൂടാതെ രാജാക്കന്മാരായി വാഴുന്നു. നിങ്ങൾ യഥാർഥത്തിൽ വാഴുന്നവരായിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു![a] അങ്ങനെ ഞങ്ങൾക്കും നിങ്ങളോടൊപ്പം വാഴാമായിരുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “നിങ്ങൾ യഥാർഥത്തിൽ വാണിരുന്നെങ്കിൽ!”'
    reason: lexical_alternative
  - marker: b
    text: 'പൗലോസ് ഇവിടെ പരിഹാസത്തോടെ സംസാരിക്കുന്നു: കൊരിന്ത്യർ ഇതിനകം പൂർണ തൃപ്തിയും സമ്പത്തും രാജകീയ വാഴ്ചയും നേടിയവരെപ്പോലെ പെരുമാറുന്നു.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἤδη
  choice: ഇതിനകം
  rationale: രണ്ടു പ്രാരംഭ വാക്യഭാഗങ്ങളിലും പൗലോസിന്റെ ഊന്നലും പരിഹാസാത്മക ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: κεκορεσμένοι ἐστέ
  choice: തൃപ്തരായിക്കഴിഞ്ഞു
  rationale: പൂർണതയിൽ എത്തിയതിന്റെ ഫലമായ ഇപ്പോഴത്തെ നിലയെ സൂചിപ്പിക്കുന്ന പരിപൂർണ ഘടനയും വയറുനിറഞ്ഞ സംതൃപ്തിയുടെ രൂപകവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπλουτήσατε
  choice: സമ്പന്നരായിക്കഴിഞ്ഞു
  rationale: സമ്പന്നരാകുക എന്ന ക്രിയാത്മക ആശയവും അതിന്റെ ഇപ്പോഴത്തെ ഫലവും സംരക്ഷിക്കുന്നു.
- source_word: χωρὶς ἡμῶν
  choice: ഞങ്ങളെ കൂടാതെ
  rationale: അപ്പൊസ്തലന്മാരിൽനിന്ന് സ്വതന്ത്രമായി ഉയർന്നുവെന്ന കൊരിന്ത്യരുടെ ഭാവത്തെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐβασιλεύσατε
  choice: രാജാക്കന്മാരായി വാഴാൻ തുടങ്ങിയിരിക്കുന്നു / വാഴുന്നവരായിരുന്നെങ്കിൽ
  rationale: βασιλεύω എന്നതിലെ രാജകീയ വാഴ്ചയുടെ ചിത്രം നിലനിർത്തുന്നു. ആദ്യ പ്രയോഗത്തിൽ പരിഹാസാത്മക അവകാശവാദവും രണ്ടാമത്തേതിൽ യാഥാർഥ്യമാകാത്ത ആശംസയും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിക്കുന്നു; 'തുടങ്ങിയിരിക്കുന്നു' എന്നത് സന്ദർഭത്തിൽ ലഭിക്കുന്ന നിലവിലെ വാഴ്ചാഭാവത്തെ വ്യക്തമാക്കുന്നു, എങ്കിലും ഗ്രീക്കിൽ ആരംഭാർഥം നിർബന്ധിതമല്ല.
- source_word: ὄφελόν γε
  choice: യഥാർഥത്തിൽ ... ആയിരുന്നെങ്കിൽ എത്ര നന്നായിരുന്നു!
  rationale: ശക്തമായ ആശംസയെയും γε നൽകുന്ന ഊന്നലിനെയും വായനാസൗകര്യമുള്ള മലയാളത്തിൽ പകർത്തുന്നു; പരിഹാസത്തിനുള്ളിൽ സത്യമായ ആഗ്രഹവും കേൾക്കാൻ ഇടവരുത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: ആശംസയുടെ ലക്ഷ്യമോ ഫലമോ അടുത്ത വാക്യവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: συμβασιλεύσωμεν
  choice: ഞങ്ങൾക്കും നിങ്ങളോടൊപ്പം വാഴാമായിരുന്നു
  rationale: συν- എന്ന സഹവാഴ്ചാ ഘടകവും സാധ്യത/ആശംസാഭാവവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആദ്യത്തെ മൂന്നു പ്രസ്താവനകളുടെ സ്വരം
  choice: നേരിട്ടുള്ള പ്രശംസയായി അല്ല, പരിഹാസാത്മക അവകാശവാദങ്ങളായി വിവർത്തനം ചെയ്തു.
  alternative: കൊരിന്ത്യരുടെ നിലയെ അക്ഷരാർഥത്തിലുള്ള അനുകൂല വിവരണമായി വായിക്കുക.
  rationale: 1 കൊരിന്ത്യർ 4:7–13-ലെ പശ്ചാത്തലം കൊരിന്ത്യരുടെ സ്വയംതൃപ്തിയെയും അപ്പൊസ്തലന്മാരുടെ കഷ്ടതയെയും വിരുദ്ധമായി നിർത്തുന്നു. ആശ്ചര്യചിഹ്നം സ്വരം സൂചിപ്പിക്കുമ്പോഴും മുഖ്യപാഠത്തിൽ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: വാഴ്ചയുടെ സ്വഭാവം
  choice: രാജകീയമായ 'വാഴുക' എന്ന ചിത്രം നിലനിർത്തി.
  alternative: വിജയിക്കുക, അധികാരം നേടുക, ഉന്നതസ്ഥാനത്തെത്തുക എന്നിങ്ങനെ പൊതുവാക്കുക.
  rationale: βασιλεύω, συμβασιλεύω എന്നിവയുടെ രാജകീയവും സാധ്യതയുള്ള അന്ത്യകാലപരവുമായ പ്രതിധ്വനി വാദത്തിന്റെ ഭാഗമാണ്; അതിനെ പൊതുവായ വിജയഭാഷയായി ചുരുക്കരുത്.
- issue: ὄφελον γε-യിലെ പരിഹാസവും യഥാർഥ ആഗ്രഹവും
  choice: യാഥാർഥ്യമാകാത്ത ശക്തമായ ആശംസയായി അവതരിപ്പിച്ചു; അത് വെറും പരിഹാസമെന്നു മുഖ്യപാഠത്തിൽ തീർപ്പാക്കിയില്ല.
  alternative: പൂർണമായും പരിഹാസവാചകമായി മാത്രം അവതരിപ്പിക്കുക.
  rationale: പൗലോസിന്റെ വാക്കുകൾ പരിഹാസത്തിൽനിന്ന് യഥാർഥ സഹവാഴ്ചയ്ക്കുള്ള ആഗ്രഹത്തിലേക്കും നീളാം; ഈ ദൈവശാസ്ത്രപരവും വാചകശൈലീപരവുമായ പിരിമുറുക്ക് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ആവർത്തനം, രാജകീയ രൂപകം, പരിഹാസസ്വരം എന്നിവ നിലനിർത്തി; മുഖ്യപാഠം അമിതമായി വ്യാഖ്യാനാത്മകമാകാതിരിക്കാൻ പശ്ചാത്തലവിവരണം അടിക്കുറിപ്പിലാക്കി.
