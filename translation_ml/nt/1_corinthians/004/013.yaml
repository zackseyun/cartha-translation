- from: അപവാദം കേൾക്കുമ്പോൾ[a] ഞങ്ങൾ അഭ്യർഥിക്കുന്നു. ലോകത്തിന്റെ മാലിന്യംപോലെയും എല്ലാവരുടെയും അഴുക്കുപോലെയും[b] ഞങ്ങൾ ഇന്നുവരെ ആയിത്തീർന്നിരിക്കുന്നു.
  to: അപകീർത്തിപ്പെടുത്തപ്പെടുമ്പോൾ[a] ഞങ്ങൾ അഭ്യർഥിക്കുന്നു; ലോകത്തിന്റെ ചവറുപോലെയും സകലത്തിന്റെയും അഴുക്കുപോലെയും[b] ഞങ്ങൾ ഇന്നുവരെ ആയിത്തീർന്നിരിക്കുന്നു.
  rationale: The revision corrects the subject’s passive experience of defamation and retains the source’s deliberate breadth in πάντων. It also removes the unsupported “gently” nuance from the footnote while preserving the contextual observation that the response is non-retaliatory. The degradation imagery remains vivid but does not assert a debated technical ritual meaning.
