id: 1CO.4.13
reference: 1 Corinthians 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀δυσφημούμενοι παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: ml
  text: അപകീർത്തിപ്പെടുത്തപ്പെടുമ്പോൾ[a] ഞങ്ങൾ അഭ്യർഥിക്കുന്നു; ലോകത്തിന്റെ ചവറുപോലെയും സകലത്തിന്റെയും അഴുക്കുപോലെയും[b] ഞങ്ങൾ ഇന്നുവരെ ആയിത്തീർന്നിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദുഷിച്ചു പറയപ്പെടുമ്പോൾ ഞങ്ങൾ അപേക്ഷിക്കുന്നു.” ഗ്രീക്ക് ക്രിയയ്ക്ക് അഭ്യർഥിക്കുക, അപേക്ഷിക്കുക, പ്രോത്സാഹിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വരാം; ഇവിടെ അധിക്ഷേപത്തിന് പ്രതികാരമായി തിരിച്ചടിക്കാതെ നടത്തുന്ന അഭിസംബോധനയെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: “ചവറ്,” “അഴുക്ക്” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന രണ്ടു ഗ്രീക്ക് പദങ്ങളും അപൂർവവും അതിശക്തവുമാണ്. ശുദ്ധീകരിക്കുമ്പോൾ തുടച്ചോ ചുരണ്ടിയോ നീക്കുന്ന നികൃഷ്ട അവശിഷ്ടത്തെയും അവ സൂചിപ്പിക്കാം. “സകലത്തിന്റെയും” എന്നതിൽ ആളുകളും വസ്തുക്കളും ഉൾപ്പെടുന്ന വിശാലമായ അർഥം സാധ്യമാണ്.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: അപവാദം കേൾക്കുമ്പോൾ
  rationale: ദുഷ്ടമായോ അപകീർത്തികരമായോ സംസാരത്തിന് ഇരയാകുന്നതിനെ സൂചിപ്പിക്കുന്ന കർമണി വർത്തമാന കൃദന്തരൂപം. മലയാളത്തിൽ സമയബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: παρακαλοῦμεν
  choice: ഞങ്ങൾ അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ പീഡനത്തോടുള്ള പ്രതികാരരഹിതമായ, അനുനയപരമായ അഭിസംബോധനയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മൂലത്തിൽ ഇല്ലാത്ത ‘സൗമ്യമായി’ എന്ന ക്രിയാവിശേഷണം ചേർത്തിട്ടില്ല.
- source_word: ὡς
  choice: പോലെയും
  rationale: കർശനമായ താദാത്മ്യമല്ല, ഉപമയാണ് അവതരിപ്പിക്കുന്നത്.
- source_word: περικαθάρματα
  choice: മാലിന്യം
  rationale: ശുദ്ധീകരിക്കുമ്പോൾ നീക്കംചെയ്യപ്പെടുന്ന ഉപേക്ഷിത വസ്തുവിനെയും അതിലൂടെ കടുത്ത സാമൂഹിക നിന്ദയെയും സൂചിപ്പിക്കുന്ന അപൂർവ പദം; ആധുനിക മലയാളത്തിൽ ഗ്രാഹ്യവും ശക്തവുമാണ്.
- source_word: τοῦ κόσμου
  choice: ലോകത്തിന്റെ
  rationale: ബന്ധം സൂചിപ്പിക്കുന്ന ഷഷ്ഠീവിഭക്തിയുടെ നേരായ, സ്വാഭാവിക രൂപം.
- source_word: ἐγενήθημεν
  choice: ഞങ്ങൾ ... ആയിത്തീർന്നിരിക്കുന്നു
  rationale: ഭൂതകാലത്തിൽ സംഭവിച്ച് എഴുതുന്ന സമയത്തോളം തുടരുന്ന അവസ്ഥയെ, ἕως ἄρτιയോടൊപ്പം, മലയാളത്തിലെ പൂർത്തികാലസദൃശ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντων
  choice: എല്ലാവരുടെയും
  rationale: രൂപപരമായി പുല്ലിംഗമോ നപുംസകലിംഗമോ ആകാവുന്ന വിശാലമായ പ്രയോഗം. മലയാളത്തിൽ ‘എല്ലാവരുടെയും’ സാമൂഹിക നിന്ദയുടെ സന്ദർഭത്തോട് നന്നായി ചേരുന്നു; ‘സകലത്തിന്റെയും’ എന്ന വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: περίψημα
  choice: അഴുക്ക്
  rationale: തുടച്ചോ ചുരണ്ടിയോ നീക്കുന്ന നികൃഷ്ട അവശിഷ്ടത്തെ സൂചിപ്പിക്കുന്ന അപൂർവവും ശക്തവുമായ പദം; കൂട്ടുപദമായ ‘മാലിന്യം’ എന്നതിനോട് ചേർന്ന് അപമാനത്തിന്റെ തീവ്രത നിലനിർത്തുന്നു.
- source_word: ἕως ἄρτι
  choice: ഇന്നുവരെ
  rationale: എഴുതുന്ന ഇപ്പോഴത്തെ നിമിഷംവരെ അവസ്ഥ തുടരുന്നതിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: περικαθάρματα / περίψημα എന്നീ ഇരട്ട അപമാനപദങ്ങളുടെ വ്യാഖ്യാനം
  choice: ‘മാലിന്യം’ / ‘അഴുക്ക്’ എന്ന ശക്തമായ സാമൂഹിക അവമതിപ്പിന്റെ ഭാഷയായി പരിഭാഷപ്പെടുത്തി; പ്രായശ്ചിത്തബലി അല്ലെങ്കിൽ ബലിയാടെന്ന വിവാദ സാങ്കേതിക ആശയം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
  alternative: ‘ശുദ്ധീകരണത്തിൽ നീക്കപ്പെടുന്ന ചുരണ്ടിപ്പുകൾ’ എന്ന കൂടുതൽ പദാനുസൃത രൂപം ഉപയോഗിക്കുക, അല്ലെങ്കിൽ ആചാരപരമായ ബലിയാടിന്റെ സൂചന മുഖ്യപാഠത്തിൽ പ്രകടമാക്കുക.
  rationale: സന്ദർഭത്തിന്റെ മുഖ്യ ഊന്നൽ അപ്പൊസ്തലന്മാർ അനുഭവിച്ച അത്യന്തം താഴ്ത്തലും ലോകത്തിന്റെ നിന്ദയുമാണ്. ശുദ്ധീകരണവുമായി ബന്ധപ്പെട്ട പശ്ചാത്തലസൂചന സാധ്യമെങ്കിലും, ഇവിടെ പ്രായശ്ചിത്തത്തെക്കുറിച്ചുള്ള വ്യക്തമായ ഉപദേശപ്രസ്താവനയില്ല.
- issue: πάντων എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘എല്ലാവരുടെയും’ എന്ന് നൽകി സാമൂഹിക സന്ദർഭം മുൻനിർത്തി.
  alternative: ‘സകലത്തിന്റെയും’ എന്ന് നൽകി നപുംസകമായ സർവവ്യാപ്തി പ്രകടിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് രൂപം ലിംഗത്തിൽ യഥാർത്ഥ അനിശ്ചിതത്വം അനുവദിക്കുന്നു. വ്യക്തികളാൽ നിരസിക്കപ്പെടുന്നതെന്ന സന്ദർഭത്തിൽ ‘എല്ലാവരുടെയും’ സ്വാഭാവികമെങ്കിലും, വസ്തുക്കളിലേക്കും വ്യാപിക്കുന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, എന്നാൽ ഗൗരവമുള്ള ശൈലി. അപമാനപദങ്ങളുടെ കടുപ്പം മയപ്പെടുത്തിയിട്ടില്ല; അതേസമയം അപൂർവമായ ആചാരസാങ്കേതിക വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിച്ചിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
