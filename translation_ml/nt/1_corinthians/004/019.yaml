id: 1CO.4.19
reference: 1 Corinthians 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: ml
  text: എന്നാൽ, കർത്താവ് ഇച്ഛിക്കുന്നുവെങ്കിൽ, ഞാൻ വൈകാതെ നിങ്ങളുടെ അടുക്കൽ വരും; അഹങ്കാരത്താൽ വീർത്തിരിക്കുന്നവരുടെ വാക്കല്ല, ശക്തിയാണ് ഞാൻ അറിയുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: എന്നാൽ ഞാൻ വൈകാതെ നിങ്ങളുടെ അടുക്കൽ വരും
  rationale: δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു നൽകി. ταχέως ഇവിടെ പ്രധാനമായും സമീപഭാവിയിലെ സമയത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വൈകാതെ’ സ്വാഭാവികമാണ്. πρὸς ὑμᾶς എന്നത് വ്യക്തികളുടെ അടുക്കലേക്കുള്ള ചലനമായി നിലനിർത്തി.
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: കർത്താവ് ഇച്ഛിച്ചാൽ
  rationale: ഉപാധിവാക്യവും കർത്താവിന്റെ ഇച്ഛയിലുള്ള ആശ്രയവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; κύριος ആരെന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: γνώσομαι
  choice: ഞാൻ മനസ്സിലാക്കും
  rationale: പൗലോസ് നേരിട്ടെത്തി യഥാർഥ സ്ഥിതി തിരിച്ചറിയുമെന്ന സന്ദർഭാർഥം നൽകുന്നു; വെറും ബൗദ്ധികമായ ‘അറിയും’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: τὸν λόγον
  choice: വാക്ക്
  rationale: λόγος എന്നതിന്റെ സംക്ഷിപ്തതയും δύναμις എന്നതുമായ നേരിട്ടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു. ‘പ്രസംഗം’ അല്ലെങ്കിൽ ‘വാചാലത’ എന്നു നൽകുന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും.
- source_word: τῶν πεφυσιωμένων
  choice: അഹങ്കാരത്താൽ വീർപ്പിച്ചിരിക്കുന്നവരുടെ
  rationale: φυσιόω എന്ന പദത്തിലെ വീർപ്പിക്കുന്ന രൂപകവും അഹങ്കാരാവസ്ഥയും ഒരുമിച്ച് വ്യക്തമാക്കുന്നു; perfect participle സൂചിപ്പിക്കുന്ന തുടരുന്ന അവസ്ഥയും ‘ഇരിക്കുന്നവർ’ വഴി നിലനിർത്തുന്നു.
- source_word: ἀλλὰ τὴν δύναμιν
  choice: അവരുടെ ശക്തി
  rationale: വാക്കും ശക്തിയും തമ്മിലുള്ള കൃത്യമായ വൈരുധ്യം സൂക്ഷിക്കുന്നു. മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കാൻ ‘അവരുടെ’ ചേർത്തിട്ടുണ്ടെങ്കിലും ശക്തിയുടെ സ്വഭാവം വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ὁ κύριος എന്നതിന്റെ സൂചിത വ്യക്തി
  choice: കർത്താവ്
  alternative: കർത്താവായ യേശു; ദൈവം
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായി ‘കർത്താവ്’ എന്നു മാത്രമേ പറയുന്നുള്ളൂ. യേശുവിനെയോ പിതാവായ ദൈവത്തെയോ വിവർത്തനത്തിൽ പ്രത്യേകം നിർണ്ണയിക്കാതെ മൂലപാഠത്തിന്റെ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: λόγος–δύναμις വൈരുധ്യത്തിന്റെ സ്വഭാവം
  choice: വാക്കും ശക്തിയും തമ്മിലുള്ള വിശാലമായ വൈരുധ്യം
  alternative: പ്രസംഗവും അത്ഭുതശക്തിയും; വാചാലതയും അപ്പൊസ്തലിക അധികാരവും
  rationale: സന്ദർഭം വെറും അവകാശവാദവും യഥാർഥ ഫലപ്രാപ്തിയും തമ്മിലുള്ള വൈരുധ്യം സൂചിപ്പിക്കാം; എന്നാൽ δύναμις അത്ഭുതശക്തിയെയോ അധികാരത്തെയോ മാത്രം നിർബന്ധമായി സൂചിപ്പിക്കുന്നതായി വിവർത്തനം ചെയ്യുന്നത് അർഥം അനാവശ്യമായി പരിമിതപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘വീർപ്പിച്ചിരിക്കുന്നവർ’ എന്ന രൂപകം പൗലോസിന്റെ ആവർത്തിത പ്രയോഗം നിലനിർത്തുന്നു; അതിന്റെ അഹങ്കാരാർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കാൻ ‘അഹങ്കാരത്താൽ’ ചേർത്തു. പ്രധാനപാഠത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട അടിക്കുറിപ്പിനോട് പൊരുത്തപ്പെടുന്നു.
