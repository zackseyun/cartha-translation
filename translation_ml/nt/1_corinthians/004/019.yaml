revisions:
- from: എന്നാൽ കർത്താവ് ഇച്ഛിച്ചാൽ, ഞാൻ വൈകാതെ നിങ്ങളുടെ അടുക്കൽ വരും; അപ്പോൾ അഹങ്കാരത്താൽ വീർപ്പിച്ചിരിക്കുന്നവരുടെ വാക്കല്ല, അവരുടെ ശക്തി എന്താണെന്നു ഞാൻ മനസ്സിലാക്കും.[a]
  to: എന്നാൽ, കർത്താവ് ഇച്ഛിക്കുന്നുവെങ്കിൽ, ഞാൻ വൈകാതെ നിങ്ങളുടെ അടുക്കൽ വരും; അഹങ്കാരത്താൽ വീർത്തിരിക്കുന്നവരുടെ വാക്കല്ല, ശക്തിയാണ് ഞാൻ അറിയുക.
  rationale: The revision removes interpretive expansions, improves the Malayalam expression for the perfect passive participle, and preserves the Greek’s compact contrast between the speech of the inflated people and power. The former footnote is no longer needed because the revised main text itself directly reflects γνώσομαι and the concise λόγος–δύναμις construction.
