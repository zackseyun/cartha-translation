  yaml_path: translation/nt/1_corinthians/004/002.yaml
  text: In this case[a], moreover[c][b], it is required of stewards that one be found faithful.
translation:
  language: ml
  text: കൂടാതെ, ഇക്കാര്യത്തിൽ[a] കാര്യസ്ഥന്മാരിൽ ഒരാൾ വിശ്വസ്തനായി കാണപ്പെടണമെന്നതാണ് ആവശ്യമായിരിക്കുന്നത്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവിടെ”; അല്ലെങ്കിൽ “ഈ വിഷയത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, “കാര്യസ്ഥന്മാരിൽ അന്വേഷിക്കപ്പെടുന്നു”; അതായത്, അവരിൽനിന്ന് പ്രതീക്ഷിക്കപ്പെടുന്നതോ ആവശ്യപ്പെടുന്നതോ ഇതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: ഇക്കാര്യത്തിൽ
  rationale: സ്ഥലസൂചകമായ ‘ഇവിടെ’ എന്നതിലുപരി, മുൻവാക്യത്തിൽ പറഞ്ഞ ദൈവത്തിന്റെ മർമ്മങ്ങളുടെ കാര്യസ്ഥന്മാർ എന്ന വിഷയത്തെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്.
- source_word: λοιπὸν
  choice: കൂടാതെ
  rationale: വാദത്തെ മുന്നോട്ടുകൊണ്ടുപോകുന്ന ബന്ധകപ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘ഇനി’ എന്നു പറഞ്ഞാൽ അനാവശ്യമായ കാലസൂചന തോന്നാം.
- source_word: ζητεῖται
  choice: ആവശ്യപ്പെടുന്നു
  rationale: പദശഃ ‘അന്വേഷിക്കപ്പെടുന്നു’ എന്നാണെങ്കിലും, ഈ പ്രയോഗത്തിൽ കാര്യസ്ഥനിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന നിർബന്ധിത ഗുണമാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐν τοῖς οἰκονόμοις
  choice: കാര്യസ്ഥന്മാരിൽ
  rationale: ἐν എന്നതിന്റെ വർഗ്ഗത്തിനുള്ളിലെ പരിധി നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: οἰκονόμοις
  choice: കാര്യസ്ഥന്മാർ
  rationale: ഏൽപ്പിച്ച ഭവനകാര്യങ്ങളും സമ്പത്തും കൈകാര്യം ചെയ്യുന്നവൻ എന്ന മൂലരൂപകം ‘കാര്യസ്ഥൻ’ നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: എന്നാണ്
  rationale: ζητεῖται എന്ന ക്രിയയ്ക്കുശേഷം ആവശ്യപ്പെടുന്നതിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πιστός
  choice: വിശ്വസ്തൻ
  rationale: ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വത്തിൽ ആശ്രയിക്കാവുന്നവനും കൂറുള്ളവനും എന്ന അർഥഭാരം നിലനിർത്തുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: ഗ്രീക്കിലെ അനിശ്ചിത ഏകവചനം നിലനിർത്തുന്നു; പുരുഷന്മാർക്ക് മാത്രമായി പ്രസ്താവനയെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: εὑρεθῇ
  choice: കാണപ്പെടുക
  rationale: പരിശോധനയിൽ അങ്ങനെ കണ്ടെത്തപ്പെടുക എന്ന കർമണി അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ ഏകവചനവും ലിംഗകൃത്യതയും
  choice: കാര്യസ്ഥന്മാരിൽ ഒരാൾ വിശ്വസ്തനായി കാണപ്പെടണം
  alternative: ഓരോ കാര്യസ്ഥനും വിശ്വസ്തനായിരിക്കണം
  rationale: τις എന്ന അനിശ്ചിത ഏകവചനവും εὑρεθῇ എന്ന ‘കാണപ്പെടുക’ എന്ന കർമണിരൂപവും നിലനിർത്തുന്നു; വ്യാകരണപരമായ പുല്ലിംഗത്തെ ജൈവലിംഗപരമായ നിയന്ത്രണമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കാര്യസ്ഥൻ’ എന്ന പദം ഏൽപ്പിച്ച ഉത്തരവാദിത്വത്തിന്റെ ഗൃഹനിർവഹണരൂപകം നിലനിർത്തുന്നു. തുടക്കത്തിലെ രണ്ട് ഗ്രീക്ക് വ്യവഹാരസൂചകങ്ങൾ മലയാളത്തിൽ കൃത്രിമമായി തോന്നാതിരിക്കാൻ ‘കൂടാതെ, ഇക്കാര്യത്തിൽ’ എന്നു ക്രമപ്പെടുത്തി.
