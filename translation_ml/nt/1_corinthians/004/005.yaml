id: 1CO.4.5
reference: 1 Corinthians 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: ml
  text: അതുകൊണ്ട്, കർത്താവ് വരുന്നതുവരെ സമയത്തിനു മുമ്പ് ഒന്നിനെയും വിധിക്കരുത്[a]. അവിടുന്ന് ഇരുട്ടിൽ മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങളെ വെളിച്ചത്തുകൊണ്ടുവരുകയും ഹൃദയങ്ങളിലെ ഉദ്ദേശ്യങ്ങളെ വെളിപ്പെടുത്തുകയും ചെയ്യും[b][c]. അപ്പോൾ ഓരോരുത്തർക്കുമുള്ള പ്രശംസ ദൈവത്തിൽനിന്ന് ലഭിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സമയത്തിനു മുമ്പ്’ എന്നതിന് ‘ഉചിതമായ സമയം വരുന്നതിനുമുമ്പ്’ അഥവാ ‘അകാലത്തിൽ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഉദ്ദേശ്യങ്ങൾ’ എന്നതിന് ‘ആലോചനകൾ’ അല്ലെങ്കിൽ ‘മനോഭാവങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അതായത്, കർത്താവ് വരുമ്പോൾ മറഞ്ഞിരിക്കുന്നതെല്ലാം വെളിപ്പെടുത്തി നടത്തുന്ന അന്തിമ വിലയിരുത്തലിൽ.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μὴ πρὸ καιροῦ τι κρίνετε
  choice: സമയത്തിനു മുമ്പ് ഒന്നിനെയും വിധിക്കരുത്
  rationale: πρὸ καιροῦ എന്നത് ഉചിതമായ സമയം വരുന്നതിനുമുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ‘നിയമിത സമയം’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത ആശയം ചേർക്കാതെ സൂക്ഷിക്കുന്നു. τιയുടെ വ്യാപകത ‘ഒന്നിനെയും’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: കർത്താവ് വരുന്നതുവരെ കാത്തിരിക്കുക
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയ്ക്കായി നിരോധനത്തിന്റെ കാലപരിധി സ്വതന്ത്ര വാക്യമായി നൽകുന്നു; ‘കാത്തിരിക്കുക’ സന്ദർഭത്തിൽ അന്തർനിഹിതമായ നിർദേശം വ്യക്തമാക്കുന്നു.
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: ഇരുട്ടിൽ മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങളെ വെളിച്ചത്തുകൊണ്ടുവരും
  rationale: വെളിപ്പെടുത്തൽ എന്ന രൂപകാർഥം നിലനിർത്തിക്കൊണ്ട് κρυπτά, σκότος എന്നീ രണ്ടു ഘടകങ്ങളും പ്രകടമാക്കുന്നു.
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: ഹൃദയങ്ങളിലെ ഉദ്ദേശ്യങ്ങളെ വെളിപ്പെടുത്തും
  rationale: βουλαίയുടെ ‘ഉദ്ദേശ്യങ്ങൾ/ആലോചനകൾ’ എന്ന അർഥവ്യാപ്തിയിൽ സ്വാഭാവികമായ പൊതുപദം തിരഞ്ഞെടുക്കുന്നു; മനസ്സിന്റെ ആന്തരികത സൂചിപ്പിക്കുന്ന ‘ഹൃദയങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: ഓരോരുത്തർക്കുമുള്ള പ്രശംസ ദൈവത്തിൽനിന്ന് ലഭിക്കും
  rationale: ഓരോ വ്യക്തിയെയും വേർതിരിച്ചുകാണിക്കുന്ന ἑκάστῳയും പ്രശംസയുടെ ഉറവിടമായ ദൈവത്തെയും വ്യക്തമായി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
theological_decisions:
- issue: വിധിയുടെ വ്യാപ്തിയും സമയവും
  choice: കർത്താവിന്റെ വരവിനും അന്തിമ വെളിപ്പെടുത്തലിനും മുമ്പുള്ള വിധിനിർണയം പൗലോസ് വിലക്കുന്നു.
  alternative: എല്ലാത്തരം വിവേചനവും വിധിയും പൂർണമായി വിലക്കുന്നു.
  rationale: വിലക്കിനെ ‘കർത്താവ് വരുന്നതുവരെ’ എന്ന കാലപരിധിയോട് മൂലവാക്യം നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; മറ്റു സന്ദർഭങ്ങളിലെ വിവേചനത്തെക്കുറിച്ച് ഈ വാക്യത്തിൽ അധികനിഗമനം ചേർക്കുന്നില്ല.
- issue: ‘കർത്താവ്’ എന്നതിന്റെ വ്യക്തിത്വം
  choice: പദവി വികസിപ്പിക്കാതെ ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു; സന്ദർഭത്തിൽ ഇത് വരാനിരിക്കുന്ന യേശുവിനെ സൂചിപ്പിക്കുന്നു.
  alternative: ‘ദൈവം’ എന്നു പൊതുവായി വ്യക്തമാക്കുക.
  rationale: പൗലോസിന്റെ ഈ അന്ത്യകാലസന്ദർഭത്തിൽ ὁ κύριος യേശുവിനെ ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; എന്നിരുന്നാലും പരിഭാഷ മൂലത്തിലെ പദവി മാത്രം നിലനിർത്തുന്നു.
- issue: ഓരോരുത്തർക്കും ലഭിക്കുന്ന പ്രശംസ
  choice: മൂലത്തിലെ അനുകൂലമായ ‘പ്രശംസ’ എന്ന വാക്ക് അതേപടി നിലനിർത്തുന്നു.
  alternative: ‘വിധി’ അല്ലെങ്കിൽ ‘പ്രതിഫലം’ എന്നു പൊതുവാക്കുക.
  rationale: ἔπαινος വ്യക്തമായി പ്രശംസയെ സൂചിപ്പിക്കുന്നു; ശിക്ഷയെയോ സമഗ്രമായ വിധിഫലത്തെയോ പരിഭാഷയിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവിടുന്ന്’ കർത്താവിനുള്ള ആദരസൂചക സർവനാമമായി ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം വായനാസൗകര്യത്തിനായി മൂന്ന് മലയാളവാക്യങ്ങളാക്കി; അർഥബന്ധവും അന്ത്യകാലപരമായ സംഘർഷവും നിലനിർത്തി.
