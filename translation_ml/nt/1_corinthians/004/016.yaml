  edition: SBLGNT
  text: παρακαλῶ οὖν ὑμᾶς, μιμηταί μου γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/016.yaml
  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു: എന്നെ അനുകരിക്കുന്നവരായിത്തീരുക[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ അനുകർത്താക്കളായിരിക്കുക.’
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരിടത്ത് പൗലോസ് ഇങ്ങനെ വ്യക്തമാക്കുന്നു: ‘ഞാൻ മശിഹായെ അനുകരിക്കുന്നതുപോലെ നിങ്ങൾ എന്നെ അനുകരിക്കുക’ (1 കൊരി 11:1).'
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ പൗലോസ് ഗൗരവത്തോടെയുള്ള ആഹ്വാനമാണ് നടത്തുന്നത്. ‘അഭ്യർഥിക്കുന്നു’ ആ ശക്തി സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനവും ഈ ആഹ്വാനവുമായുള്ള യുക്തിബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളോട്
  rationale: ഗ്രീക്കിൽ ബഹുവചനമായ അഭിസംബോധനയാണ്; മലയാളത്തിലെ ‘നിങ്ങളോട്’ അത് സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μιμηταί
  choice: അനുകരിക്കുന്നവർ
  rationale: മറ്റൊരാളുടെ മാതൃക പിന്തുടർന്ന് അതുപോലെ പ്രവർത്തിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന μιμηταί എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘പിന്തുടരുന്നവർ’ എന്നത് താരതമ്യേന വിശാലവും ദുർബലവുമാണ്.
- source_word: μου
  choice: എന്നെ
  rationale: μιμηταί μου എന്നതിലെ പൗലോസിനെ അനുകരണത്തിന്റെ മാതൃകയായി നേരിട്ട് അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γίνεσθε
  choice: ആയിത്തീരുക
  rationale: γίνομαι എന്ന വർത്തമാനകാല ആജ്ഞാരൂപം ഒരു നില സ്വീകരിക്കുകയോ അതിലേക്കു വരികയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; അതിനാൽ വെറും ‘ആയിരിക്കുക’ എന്നതിനെക്കാൾ ‘ആയിത്തീരുക’ കൃത്യമാണ്.
theological_decisions:
- issue: പൗലോസ് തന്നെ അനുകരിക്കാൻ ആവശ്യപ്പെടുന്നത് വിശാലമായ ക്രിസ്തുകേന്ദ്രീകൃത പശ്ചാത്തലത്തിൽനിന്ന് വേർപെടുത്തിയാൽ അതിശയോക്തിയായി തോന്നാം; എങ്കിലും ഈ വാക്യം പൗലോസിനെ തന്നെയാണ് ഉടനെയുള്ള മാതൃകയായി വ്യക്തമാക്കുന്നത്.
  choice: ‘എന്നെ അനുകരിക്കുന്നവരായിത്തീരുക’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക.
  alternative: ‘എന്റെ മാതൃക പിന്തുടരുക.’
  rationale: ഗ്രീക്ക് പാഠം പൗലോസിനെ അനുകരണത്തിന്റെ നേരിട്ടുള്ള മാതൃകയായി അവതരിപ്പിക്കുന്നു. മുഖ്യവാചകത്തിൽ ഇത് മയപ്പെടുത്താതെ നിലനിർത്തുകയും വിശാലമായ പശ്ചാത്തലം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അനുകരിക്കുന്നവർ’ സാധാരണ വായനക്കാർക്ക് ‘അനുകർത്താക്കൾ’ എന്ന നാമരൂപത്തേക്കാൾ ഉടൻ ഗ്രഹിക്കാവുന്നതായതിനാൽ മുഖ്യവാചകത്തിൽ അത് ഉപയോഗിച്ചു; കൂടുതൽ ചുരുങ്ങിയ നാമരൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
