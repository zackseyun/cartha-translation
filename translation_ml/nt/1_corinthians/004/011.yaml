  text: ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: ml
  text: ഇതുവരെയും[a] ഞങ്ങൾ വിശക്കുകയും ദാഹിക്കുകയും വേണ്ടത്ര വസ്ത്രമില്ലാതെ കഴിയുകയും അടിയേൽക്കുകയും സ്ഥിരമായ പാർപ്പിടമില്ലാതെ അലയുകയും ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ഇപ്പോഴത്തെ ഈ സമയംവരെ.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “ഒരിടത്തും സ്ഥിരതാമസമില്ലാതെ കഴിയുന്നു” അല്ലെങ്കിൽ “അസ്ഥിരമായി അലഞ്ഞുതിരിയുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: ഈ നിമിഷംവരെ
  rationale: ഇപ്പോഴത്തെ സമയംവരെ എന്ന കാലപരിധിയും ἄρτι നൽകുന്ന ഊന്നലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πεινῶμεν
  choice: ഞങ്ങൾ വിശക്കുകയും
  rationale: വർത്തമാനകാലത്തിലെ തുടരുന്ന വിശപ്പിനെ ലളിതമായും നേരിട്ടും അറിയിക്കുന്നു.
- source_word: διψῶμεν
  choice: ദാഹിക്കുകയും
  rationale: വിശപ്പിനോടൊപ്പം തുടരുന്ന അഭാവാവസ്ഥയായി ഗ്രീക്ക് ക്രിയയെ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: γυμνιτεύομεν
  choice: വേണ്ടത്ര വസ്ത്രമില്ലാതെ കഴിയുകയും
  rationale: പൂർണ നഗ്നത നിർബന്ധമായി സൂചിപ്പിക്കാതെ, അപര്യാപ്തമായ വസ്ത്രധാരണം എന്ന സാധാരണ സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: κολαφιζόμεθα
  choice: അടിയേൽക്കുകയും
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിലുള്ള ആവർത്തിച്ചുള്ള ശാരീരിക പീഡനം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അടിയുടെ കൃത്യരൂപം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀστατοῦμεν
  choice: സ്ഥിരമായ പാർപ്പിടമില്ലാതെ അലയുകയും
  rationale: ഒരു സ്ഥിരസ്ഥലമോ താമസമോ ഇല്ലാത്ത അസ്ഥിരാവസ്ഥയും അലച്ചിലും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; വെറും ‘ഭവനരഹിതർ’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ക്രിയയുടെ ചലനാത്മകത വ്യക്തമാക്കുന്നു.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: …ചെയ്യുകയും …ചെയ്യുകയും
  rationale: ആവർത്തിക്കുന്ന καί സൃഷ്ടിക്കുന്ന കഷ്ടതകളുടെ സഞ്ചിതവും ഇടതടവില്ലാത്തതുമായ താളം മലയാളത്തിലെ സമുച്ചയ ക്രിയാരൂപങ്ങളിലൂടെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സ്വവിവരണത്തിന്റെ സ്വഭാവം
  choice: അപ്പൊസ്തലന്മാർ അനുഭവിച്ചുകൊണ്ടിരിക്കുന്ന അഭാവത്തിന്റെയും പീഡനത്തിന്റെയും യാഥാർഥ്യവിവരണം
  alternative: പ്രധാനമായും അതിശയോക്തിപരമായ അലങ്കാരവിവരണം
  rationale: തുടരുന്ന അവസ്ഥകളെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ക്രിയകൾ മൂർത്തമായ കഷ്ടതകളുടെ പട്ടികയാണ് നൽകുന്നത്. പരിഭാഷ അവയെ ശക്തിപ്പെടുത്തുകയോ മയപ്പെടുത്തുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. കഷ്ടതകളുടെ സഞ്ചിതതാളം സംരക്ഷിക്കാൻ സമുച്ചയപ്രത്യയം ആവർത്തിച്ചു. γυμνιτεύομεν-നെ ‘നഗ്നരായി’ എന്ന് അതിരൂക്ഷമാക്കാതെയും ἀστατοῦμεν-നെ വെറും സാമൂഹിക വിഭാഗപദമായി ചുരുക്കാതെയും പരിഭാഷപ്പെടുത്തി.
