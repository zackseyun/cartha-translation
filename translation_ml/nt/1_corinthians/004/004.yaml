id: 1CO.4.4
reference: 1 Corinthians 4:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: ml
  text: എനിക്ക് എനിക്കെതിരായി യാതൊന്നും അറിയില്ല[a]; എങ്കിലും അതുകൊണ്ട് ഞാൻ നീതീകരിക്കപ്പെട്ടവനല്ല[b]. എന്നെ പരിശോധിക്കുന്നവൻ കർത്താവാണ്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നിൽ യാതൊന്നും എനിക്കറിയില്ല’ അല്ലെങ്കിൽ ‘എനിക്കെതിരായി ഒന്നും ഞാൻ അറിയുന്നില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതുകൊണ്ട് ഞാൻ കുറ്റവിമുക്തനല്ല’ അല്ലെങ്കിൽ ‘അതുകൊണ്ട് ഞാൻ ശരിയെന്നു വിധിക്കപ്പെട്ടവനല്ല.’ ഗ്രീക്കിലുള്ളത് ന്യായപരമായ ഒരു പദമാണ്; പൗലോസ് മറ്റിടങ്ങളിൽ ‘നീതീകരിക്കുക’ എന്ന അർത്ഥത്തിലും ഇതു ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘പരിശോധിക്കുന്നവൻ’ എന്നതിന് ‘വിധിക്കുന്നവൻ,’ ‘വിചാരണ ചെയ്യുന്നവൻ,’ അല്ലെങ്കിൽ ‘വിലയിരുത്തുന്നവൻ’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: എനിക്കെതിരായി യാതൊന്നും എന്റെ മനസ്സാക്ഷിയിൽ ബോധ്യമില്ല
  rationale: σύνοιδα എന്ന ക്രിയയും ἐμαυτῷ എന്ന ദത്തിവും ചേർന്ന പ്രയോഗം ഒരാളുടെ മനസ്സാക്ഷിയിൽ തനിക്കെതിരായ കുറ്റമൊന്നും അറിയാത്തതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അർത്ഥം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘എന്റെ മനസ്സാക്ഷിയിൽ ബോധ്യമില്ല’ എന്നു നൽകി; ‘എനിക്കെതിരായി’ എന്നത് സന്ദർഭത്തിലെ ധാർമിക-ന്യായപര സൂചന നിലനിർത്തുന്നു.
- source_word: ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι
  choice: എങ്കിലും അതുകൊണ്ട് ഞാൻ നീതീകരിക്കപ്പെട്ടവനാകുന്നില്ല
  rationale: ἐν τούτῳ ഇവിടെ അടിസ്ഥാനമോ കാരണമോ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതുകൊണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി. δικαιόω എന്ന പൗലോസിന്റെ പ്രധാന ന്യായപര പദബന്ധം നിലനിർത്താൻ ‘നീതീകരിക്കപ്പെട്ടവൻ’ ഉപയോഗിച്ചു; സമ്പൂർണകാലത്തിന്റെ നിലവിലെ ഫലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ὁ δὲ ἀνακρίνων με
  choice: എന്നെ പരിശോധിക്കുന്നവൻ
  rationale: ἀνακρίνωയ്ക്ക് പരിശോധിക്കുക, വിചാരണ ചെയ്യുക, വിലയിരുത്തുക എന്നീ ന്യായപര അർത്ഥങ്ങൾ ഉണ്ടാകാം. അന്തിമ വിധി എന്ന ആശയം അതിരുകടന്ന് ചേർക്കാതെ സൂക്ഷ്മപരിശോധനയുടെ ഭാവം നിലനിർത്താൻ ‘പരിശോധിക്കുന്നവൻ’ തിരഞ്ഞെടുത്തു.
- source_word: κύριός
  choice: കർത്താവ്
  rationale: ഗ്രീക്കിലെ κύριος എന്ന നിർദ്ദിഷ്ട പരാമർശം മലയാള ബൈബിൾ ഭാഷയിൽ സ്വാഭാവികമായ ‘കർത്താവ്’ എന്ന പദംകൊണ്ട് നൽകി; വാക്യത്തിൽ വ്യക്തമാക്കാത്ത ‘യേശു’ എന്ന തിരിച്ചറിയൽ കൂട്ടിച്ചേർത്തില്ല.
theological_decisions:
- issue: δεδικαίωμαι എന്നതിന്റെ ന്യായപരവും ദൈവശാസ്ത്രപരവുമായ ഭാരം
  choice: നീതീകരിക്കപ്പെട്ടവനാകുന്നില്ല
  alternative: കുറ്റവിമുക്തനാകുന്നില്ല; ശരിയെന്നു വിധിക്കപ്പെടുന്നില്ല
  rationale: സന്ദർഭം ശുശ്രൂഷകരുടെ പരിശോധനയും വിധിയും സംബന്ധിച്ചതാണെങ്കിലും പൗലോസിന്റെ δικαιόω പദത്തിന്റെ ന്യായപര-ദൈവശാസ്ത്ര പ്രതിധ്വനി നഷ്ടപ്പെടുത്തരുത്. അതേസമയം, ഈ വാക്യത്തെ വിശാലമായ ഒരു ദൈവശാസ്ത്രപ്രഖ്യാപനമായി വ്യാഖ്യാനിച്ചും തീർക്കുന്നില്ല.
- issue: κύριος ആരെയാണ് സൂചിപ്പിക്കുന്നത്
  choice: കർത്താവ്
  alternative: കർത്താവായ യേശു
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കാമെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം κύριος എന്നു മാത്രമേ പറയുന്നുള്ളൂ. അതിനാൽ വ്യക്തമായിട്ടില്ലാത്ത തിരിച്ചറിയൽ പ്രധാന പാഠത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ἀνακρίνων എന്നതിലെ പരിശോധനയും വിധിയും
  choice: പരിശോധിക്കുന്നവൻ
  alternative: വിധിക്കുന്നവൻ; വിചാരണ ചെയ്യുന്നവൻ
  rationale: ക്രിയയ്ക്ക് ന്യായപര വിലയിരുത്തലിന്റെ ഭാവമുണ്ടെങ്കിലും അന്തിമ വിധി മാത്രമായി അർത്ഥം ചുരുക്കാതിരിക്കാൻ ‘പരിശോധിക്കുന്നവൻ’ നൽകി; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘മനസ്സാക്ഷി’ എന്ന പദം ഗ്രീക്കിൽ പ്രത്യേകം നാമമായി ഇല്ലെങ്കിലും σύνοιδα + ἐμαυτῷ എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളാവിഷ്കാരമായി ഉപയോഗിച്ചു. പ്രധാന ദൈവശാസ്ത്ര പദമായ ‘നീതീകരിക്കുക’ നിലനിർത്തി; സാധ്യതയുള്ള ന്യായപര പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
