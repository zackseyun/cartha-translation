id: 1CO.4.21
reference: 1 Corinthians 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί θέλετε; ἐν ῥάβδῳ ἔλθω πρὸς ὑμᾶς, ἢ ἐν ἀγάπῃ πνεύματί τε πραΰτητος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/021.yaml
  text: What do you want? Should I come to you with a rod[b][a], or with love and a spirit of gentleness?
translation:
  language: ml
  text: നിങ്ങൾക്ക് എന്താണ് വേണ്ടത്? ഞാൻ നിങ്ങളുടെ അടുക്കൽ വടിയുമായി വരണമോ, അതോ സ്നേഹത്തോടും സൗമ്യമായ മനോഭാവത്തോടുകൂടെ വരണമോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സ്നേഹത്തോടും മനോഭാവത്തിലെ സൗമ്യതയോടുകൂടെ.”
    reason: lexical_alternative
  - marker: b
    text: “സൗമ്യമായ മനോഭാവം” എന്നത് പൗലോസിന്റെ സൗമ്യമായ പെരുമാറ്റരീതിയെ സൂചിപ്പിക്കുന്നു. ചിലർ ഇതിലെ “ആത്മാവ്” എന്ന ആശയം പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തോടുള്ള പരോക്ഷസൂചനയായും മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: τί θέλετε
  choice: നിങ്ങൾക്ക് എന്താണ് വേണ്ടത്?
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള വെല്ലുവിളിയുടെ ശക്തി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യരൂപം.
- source_word: ἐν ῥάβδῳ
  choice: വടിയുമായി
  rationale: ῥάβδος എന്നതിന്റെ മൂർത്തമായ അർഥവും ശിക്ഷണത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു; ‘ശിക്ഷയുമായി’ എന്നു പറഞ്ഞാൽ രൂപകത്തെ വ്യാഖ്യാനിച്ച് മാറ്റുന്നതാകും.
- source_word: ἔλθω πρὸς ὑμᾶς
  choice: ഞാൻ നിങ്ങളുടെ അടുക്കൽ ... വരണമോ
  rationale: ആലോചനാത്മകമായ aorist subjunctive-ന്റെ ചോദ്യഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἢ
  choice: അതോ
  rationale: പൗലോസ് വരാവുന്ന രണ്ടു വ്യത്യസ്ത രീതികൾ തമ്മിലുള്ള വ്യക്തമായ വിരോധം പ്രകടമാക്കുന്നു.
- source_word: ἐν ἀγάπῃ
  choice: സ്നേഹത്തോടും
  rationale: ‘വടിയുമായി’ എന്ന സമാന്തര പ്രയോഗത്തോട് ചേരുന്ന രീതിയിൽ ἐν-ന്റെ സഹചര്യ/രീതിഭാവം നൽകുകയും ἀγάπηയെ പതിവുപോലെ ‘സ്നേഹം’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: πνεύματί τε πραΰτητος
  choice: സൗമ്യതയുടെ ആത്മാവോടുംകൂടെ
  rationale: πνεῦμα എന്ന പദത്തിന്റെ സാന്നിധ്യവും πραΰτης എന്നതിന്റെ ഗുണഭാവവും നിലനിർത്തുന്നു. മലയാളത്തിൽ അല്പം ഉയർന്നെങ്കിലും ഗ്രഹിക്കാവുന്ന ഈ രൂപം പൗലോസിന്റെ മനോഭാവമാണോ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനമാണോ എന്ന യഥാർഥ അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: πνεύματί τε πραΰτητος എന്നതിലെ πνεύματι-യുടെ സൂചന
  choice: ‘സൗമ്യതയുടെ ആത്മാവ്’ എന്നു ചെറുതക്ഷര ആശയത്തിൽ, പ്രധാനമായി പൗലോസിന്റെ മനോഭാവത്തെയോ പെരുമാറ്റരീതിയെയോ സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിച്ചു
  alternative: പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ‘സൗമ്യതയുടെ ആത്മാവ്’ എന്നും മനസ്സിലാക്കാം
  rationale: സന്ദർഭത്തിലെ മുഖ്യവിരോധം പൗലോസിന്റെ വരവിന്റെ രണ്ടു രീതികൾ—ശിക്ഷണപരമായ കാഠിന്യവും സ്നേഹപൂർവമായ സൗമ്യതയും—തമ്മിലാണ്. എങ്കിലും ഗ്രീക്കിലെ article ഇല്ലാത്ത πνεῦμα പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനസാധ്യത പൂർണമായി ഒഴിവാക്കുന്നില്ല; അതിനാൽ പ്രധാനവാചകവും അടിക്കുറിപ്പും ആ തുറന്ന നിലപാട് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ നേരിട്ടും ഗൗരവത്തോടെയും രൂപപ്പെടുത്തി. ‘വടി’ എന്ന മൂർത്തരൂപകം മയപ്പെടുത്താതെ നിലനിർത്തി. ‘സൗമ്യതയുടെ ആത്മാവ്’ എന്ന പ്രയോഗം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ വച്ചുകൊണ്ട് മൂലത്തിലെ ആത്മാവ്/മനോഭാവം സംബന്ധിച്ച അവ്യക്തത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
