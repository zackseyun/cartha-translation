reference: 1 Corinthians 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: ml
  text: എന്നെ സംബന്ധിച്ചിടത്തോളം, നിങ്ങൾ എന്നെ പരിശോധിക്കുന്നതോ മനുഷ്യരുടെ വിലയിരുത്തലിന് ഞാൻ വിധേയനാകുന്നതോ തീരെ നിസ്സാരമായ കാര്യമാണ്. എന്നാൽ ഞാൻ എന്നെത്തന്നെപ്പോലും പരിശോധിക്കുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοὶ
  choice: എന്നെ സംബന്ധിച്ചിടത്തോളം
  rationale: സംബന്ധസൂചകമായ ദത്തിവിനെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും പൗലോസിന്റെ വ്യക്തിപരമായ നിലപാട് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: തീരെ നിസ്സാരമായ കാര്യമാണ്
  rationale: കാര്യത്തിന് ഏറ്റവും കുറഞ്ഞ പ്രാധാന്യമേ ഉള്ളൂ എന്ന പ്രയോഗാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἵνα
  choice: … എന്നത്
  rationale: നിസ്സാരമായി കണക്കാക്കുന്ന കാര്യത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀνακριθῶ / ἀνακρίνω
  choice: പരിശോധിക്കുക
  rationale: അന്തിമവിധിയേക്കാൾ സൂക്ഷ്മപരിശോധനയെയോ വിലയിരുത്തലിനെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ അർഥം നൽകുകയും രണ്ടു പ്രയോഗങ്ങളിലും പദബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὑφ’ ὑμῶν
  choice: നിങ്ങൾ എന്നെ പരിശോധിക്കുന്നത്
  rationale: ὑπόയോടുകൂടിയ കർത്തൃബന്ധം മലയാളത്തിലെ സകർമകവാക്യഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: ഏതെങ്കിലും മനുഷ്യവിധിന്യായസഭ പരിശോധിക്കുന്നത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘മനുഷ്യദിവസം’ എന്ന അപൂർവ പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ മനുഷ്യന്യായവിധി/വിലയിരുത്തൽ എന്ന ആശയം വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: ἀλλ’ οὐδὲ
  choice: വാസ്തവത്തിൽ, … പോലും … ഇല്ല
  rationale: പ്രതിവാദത്തിൽനിന്ന് കൂടുതൽ ശക്തമായ പ്രസ്താവനയിലേക്കുള്ള നീക്കവും οὐδέയുടെ ‘പോലും ഇല്ല’ എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: ἐμαυτόν
  choice: എന്നെത്തന്നെ
  rationale: പ്രതിഫലന സർവനാമത്തിന്റെ ഊന്നൽ കൃത്യമായി നൽകുന്നു.
theological_decisions:
- issue: ἀνθρωπίνης ἡμέρας എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘മനുഷ്യവിധിന്യായസഭ’ എന്ന് സന്ദർഭോചിതമായി പരിഭാഷപ്പെടുത്തി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുക.
  alternative: ‘മനുഷ്യദിവസം’ അല്ലെങ്കിൽ ‘മനുഷ്യവിധി’
  rationale: സന്ദർഭത്തിൽ കർത്താവിന്റെ ന്യായവിധിയോടു താരതമ്യപ്പെടുന്ന മനുഷ്യപരിശോധനയെയാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ‘വിധിന്യായസഭ’ നിയമപരവും വിലയിരുത്തൽപരവുമായ സാധ്യത തുറന്നുവെക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്ക് രൂപത്തിന്റെ അസാധാരണതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പരിശോധിക്കുക’ എന്ന പദം അന്തിമവിധി എന്ന ആശയം അതിരുകടന്ന് ചേർക്കാതെ ἀνακρίνωയുടെ സൂക്ഷ്മപരിശോധനാർഥം നിലനിർത്തുന്നു.
