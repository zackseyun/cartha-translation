id: 1CO.4.20
reference: 1 Corinthians 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: ml
  text: കാരണം, ദൈവരാജ്യം വാക്കിലല്ല[a], ശക്തിയിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സംസാരത്തിലല്ല’ അല്ലെങ്കിൽ ‘വെറും വാക്കുകളിലല്ല’; ഇവിടെ വെറും വാചകപ്രകടനത്തെയും ഫലപ്രദമായ ശക്തിയെയും തമ്മിലാണ് വൈരുധ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: കാരണം, ... അല്ല
  rationale: γάρ മുൻവാക്യവുമായി കാരണബന്ധം സൂചിപ്പിക്കുന്നു; ‘കാരണം’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. οὐ നിഷേധം രേഖപ്പെടുത്തുന്നു.
- source_word: ἐν λόγῳ
  choice: വാക്കിൽ
  rationale: λόγος എന്നതിന് ‘വാക്ക്’, ‘സംസാരം’, ‘പ്രസംഗം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. δυνάμει എന്നതിനോടുള്ള മൂർച്ചയുള്ള വൈരുധ്യം നിലനിർത്താൻ ‘വാക്കിൽ’ എന്നു നൽകി; ഇവിടെ വെറും വാചകപ്രകടനം എന്ന ആശയവും സന്ദർഭത്തിൽ ഗ്രഹിക്കാം.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: βασιλεία τοῦ θεοῦ എന്ന സ്ഥിരപ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപമാണിത്; ദൈവത്തിന്റെ ഭരണവും രാജ്യവും എന്ന അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀλλ’ ἐν δυνάμει
  choice: ശക്തിയിലാണ്
  rationale: δύναμις എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘ശക്തി’ λόγος-നോടുള്ള വൈരുധ്യം കൃത്യമായി നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘അല്ല ... ആണ്’ എന്ന ഘടന ഉപയോഗിച്ച് ἀλλά സൂചിപ്പിക്കുന്ന ശക്തമായ വിരോധം സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു.
theological_decisions:
- issue: ‘വാക്ക്’ എന്നും ‘ശക്തി’ എന്നും തമ്മിലുള്ള വൈരുധ്യത്തിന്റെ സ്വഭാവം
  choice: ദൈവരാജ്യത്തിന്റെ യാഥാർഥ്യം വെറും വാക്കുകളിലോ പ്രസംഗത്തിലോ അല്ല, ഫലപ്രദമായ ശക്തിയിലാണെന്ന വിശാലമായ വൈരുധ്യം നിലനിർത്തി.
  alternative: ‘ശക്തി’ എന്നത് പ്രത്യേകമായി അത്ഭുതങ്ങൾ, രൂപാന്തരപ്പെട്ട ജീവിതം, സഭാശിക്ഷണം, അപ്പൊസ്തലിക അധികാരം, അല്ലെങ്കിൽ ആത്മാവിന്റെ പ്രവർത്തനം എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിനെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ശക്തിയുടെ പ്രത്യേക പ്രകടനം നിർവചിക്കുന്നില്ല. അതിനാൽ അതിനെ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തരവിരോധം മലയാളത്തിലെ ‘വാക്കിലല്ല ... ശക്തിയിലാണ്’ എന്ന സ്വാഭാവിക ഘടനയിൽ സൂക്ഷിച്ചു.
