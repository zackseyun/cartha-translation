id: 1CO.15.22
reference: 1 Corinthians 15:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνῄσκουσιν, οὕτως καὶ ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: ml
  text: എന്തെന്നാൽ, ആദാമിൽ എല്ലാവരും മരിക്കുന്നതുപോലെ, മശീഹായിൽ[a] എല്ലാവരും അതുപോലെതന്നെ ജീവിപ്പിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’ ഗ്രീക്ക് പദവിനാമമായ Χριστός ‘ക്രിസ്തു’ എന്നോ അതിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹാ’ എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ അർഥം പ്രകടമാക്കുന്ന രൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_rendering
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: എന്തെന്നാൽ, ... പോലെതന്നെ
  rationale: γάρ എന്നതിന്റെ വിശദീകരണാത്മക ബന്ധം ‘എന്തെന്നാൽ’ എന്നും ὥσπερ എന്നതിന്റെ താരതമ്യബലം ‘പോലെതന്നെ’ എന്നും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ Ἀδὰμ
  choice: ആദാമിൽ
  rationale: ἐν എന്നതിന്റെ സംക്ഷിപ്തവും പ്രതിനിധിത്വപരവുമായ ബന്ധം വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ ഔപചാരികമായി അടുത്തുനിൽക്കുന്ന വിവർത്തനം.
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: രണ്ടിടത്തുമുള്ള πάντες എന്ന പദത്തിന്റെ വ്യാപ്തിയും സമാന്തരഘടനയും യാതൊരു വിശദീകരണപരമായ നിയന്ത്രണവും ചേർക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἀποθνῄσκουσιν
  choice: മരിക്കുന്നു
  rationale: പൊതുവായ യാഥാർഥ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലത്തെ സ്വാഭാവികമായ മലയാള വർത്തമാനകാലത്തിൽ നൽകുന്നു.
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻപത്തെ താരതമ്യത്തോടുള്ള അനുരൂപതയും καίയുടെ കൂട്ടിച്ചേർക്കൽബലവും മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു; വാക്യത്തിൽ ആവർത്തനം ഒഴിവാക്കാൻ ഇതിന്റെ അർഥം ‘പോലെതന്നെ’ എന്ന ഘടനയിലൂടെ സംയോജിപ്പിച്ചിരിക്കുന്നു.
- source_word: ἐν τῷ Χριστῷ
  choice: മശീഹായിൽ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം നൽകുന്ന ‘മശീഹാ’ ഉപയോഗിക്കുന്നു; ‘ആദാമിൽ’ എന്നതിനോടുള്ള സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ζῳοποιηθήσονται
  choice: ജീവിപ്പിക്കപ്പെടും
  rationale: ഭാവികാലവും കർമണിപ്രയോഗവും ഒരുപോലെ സൂക്ഷിക്കുന്നു; ജീവൻ നൽകുന്ന പ്രവർത്തനം കർത്താവ് ആരെന്നത് വാക്യത്തിൽ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
theological_decisions:
- issue: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ‘എല്ലാവരും’ എന്നതിന്റെ വ്യാപ്തി
  choice: രണ്ടിടത്തും നിയന്ത്രണമില്ലാതെ ‘എല്ലാവരും’ എന്നു നിലനിർത്തി.
  alternative: രണ്ടാമത്തെ ‘എല്ലാവരും’ എന്നത് വിശ്വാസികൾക്കു മാത്രമായി വ്യാഖ്യാനിക്കുക, അല്ലെങ്കിൽ രണ്ടും എല്ലാ മനുഷ്യരെയും കൃത്യമായി ഒരേ അർഥത്തിൽ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം πάντες ... πάντες എന്ന ഉദ്ദേശ്യപൂർവമായ സമാന്തരതയാണ് നൽകുന്നത്; അതിന്റെ വ്യാപ്തിയുടെ ദൈവശാസ്ത്രപരമായ ഫലങ്ങൾ ഈ വാക്യം തന്നെ വിശദീകരിക്കുന്നില്ല. അതിനാൽ ആ സംഘർഷം വിവർത്തനത്തിൽ പരിഹരിച്ചിട്ടില്ല.
- issue: Χριστός എന്ന പദവിനാമത്തിന്റെ അവതരണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: അഭിഷിക്തൻ എന്ന പദവിനാമത്തിന്റെ അർഥം വായനക്കാരനു ലഭ്യമാക്കുന്നു; പരമ്പരാഗത രൂപമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജീവിപ്പിക്കപ്പെടും’ എന്ന കർമണിരൂപം അല്പം ഔപചാരികമായിരുന്നാലും ഗ്രീക്ക് ഭാവികാല കർമണിയുടെ ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മത കൃത്യമായി നിലനിർത്തുന്നു.
