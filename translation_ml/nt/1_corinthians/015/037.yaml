reference: 1 Corinthians 15:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: ml
  text: നീ വിതയ്ക്കുന്നതാകട്ടെ, ഉണ്ടാകാനിരിക്കുന്ന ശരീരമല്ല; മറിച്ച്, ഒരുപക്ഷേ ഗോതമ്പിന്റെയോ മറ്റേതെങ്കിലും ഇനത്തിന്റെയോ വെറും ഒരു വിത്തുമണിയാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: വിതയ്ക്കുന്നത്
  rationale: കാർഷികപ്രയോഗമായ ‘വിതയ്ക്കുക’ പൗലോസിന്റെ വിത്തിന്റെ ദൃഷ്ടാന്തം സ്വാഭാവികമായും കൃത്യമായും നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള വിശാലമായ വാദവുമായി ബന്ധം നിലനിർത്തുന്ന പൗലോസിന്റെ പ്രധാന പദമാണ്.
- source_word: τὸ γενησόμενον
  choice: ഉണ്ടാകാനിരിക്കുന്ന
  rationale: γίνομαι എന്ന ക്രിയയുടെ ഭാവിദിശയും ‘അസ്തിത്വത്തിലേക്ക് വരുക’ എന്ന ആശയവും നിലനിർത്തുന്നു; സസ്യവളർച്ചയെന്നൊന്നിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: γυμνὸν κόκκον
  choice: വെറും ഒരു വിത്തുമണി
  rationale: γυμνός എന്നതിന്റെ അലങ്കാരമോ വികസിതരൂപമോ ഇല്ലാത്ത അവസ്ഥ ‘വെറും’ എന്നതിലൂടെ സ്വാഭാവികമായി നൽകുന്നു; κόκκος എന്നത് സന്ദർഭത്തിൽ വിതയ്ക്കുന്ന ഒറ്റ മണിയായതിനാൽ ‘വിത്തുമണി’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἰ τύχοι
  choice: —യുടെയോ
  rationale: ഉദാഹരണപരമായ അനിശ്ചിതത്വം ഗോതമ്പോ മറ്റേതെങ്കിലും ഇനമോ എന്ന മലയാള ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: σίτου
  choice: ഗോതമ്പിന്റെ
  rationale: ഇവിടെ σῖτος പൊതുവായ ധാന്യത്തേക്കാൾ വ്യക്തമായി ഗോതമ്പിനെ സൂചിപ്പിക്കുന്നു.
- source_word: τινος τῶν λοιπῶν
  choice: മറ്റേതെങ്കിലും ഇനത്തിന്റെ
  rationale: ശേഷിക്കുന്ന വിത്തിനങ്ങളിൽ ഏതെങ്കിലും ഒന്ന് എന്ന അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: വിത്തും പുനരുത്ഥാനശരീരവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ശരീരം’ എന്നും ഭാവിദിശയുള്ള ‘ഉണ്ടാകാനിരിക്കുന്ന’ എന്നും നിലനിർത്തി; ദൃഷ്ടാന്തത്തെ അതിലപ്പുറം വിശദീകരിച്ചില്ല.
  alternative: ‘വളർന്നുവരുന്ന ചെടി’ എന്ന ചലനാത്മക പരിഭാഷ.
  rationale: വാക്യം തുടർച്ചയും രൂപാന്തരവും സൂചിപ്പിക്കുന്ന കാർഷികദൃഷ്ടാന്തം ഉപയോഗിക്കുന്നു. ‘ശരീരം’ എന്ന പദം സംരക്ഷിക്കുന്നത് പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള സന്ദർഭബന്ധം നിലനിർത്തുന്നു; എന്നാൽ വാക്യത്തിൽ ഇല്ലാത്ത സമ്പൂർണ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ വാക്യഘടന പകർത്തി അസ്വാഭാവികമാക്കാതെ, വിരോധഘടനയും കാർഷികദൃഷ്ടാന്തവും വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു.
