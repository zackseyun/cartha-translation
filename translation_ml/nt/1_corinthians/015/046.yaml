  text: ἀλλ’ οὐ πρῶτον τὸ πνευματικὸν ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: ml
  text: എന്നാൽ ആദ്യം വരുന്നത് ആത്മികമായതല്ല[a], പ്രാണികമായതാണ്[b]; പിന്നീട് വരുന്നത് ആത്മികമായതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭം അനുസരിച്ച്: ‘ആദ്യം വരുന്നത് പ്രാണിക ശരീരമാണ്; പിന്നീട് ആത്മിക ശരീരവും.’ ചുറ്റുമുള്ള വാക്യങ്ങളിൽ ‘ശരീരം’ എന്നു വ്യക്തമാണെങ്കിലും ഈ വാക്യത്തിൽ പൗലോസ് ആ പദം ഉപയോഗിക്കുന്നില്ല.'
    reason: alternative_reading
  - marker: b
    text: '‘പ്രാണികമായത്’ ഗ്രീക്ക് psychikon എന്ന പദത്തിന്റെ വിവർത്തനമാണ്; സാധാരണ ജീവജീവിതത്തോടു ബന്ധപ്പെട്ടത് എന്നാണ് അർഥം. കൂടുതൽ പദാനുപദമായി: ‘ജീവനോടു ബന്ധപ്പെട്ടത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: ക്രമത്തെയും കാലാനുക്രമത്തെയും നേരിട്ട് സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: πνευματικόν
  choice: ആത്മികമായത്
  rationale: നപുംസകലിംഗ വിശേഷണം നാമവൽക്കരിച്ചാണ് ഗ്രീക്കിൽ ഉപയോഗിച്ചിരിക്കുന്നത്. ‘ശരീരം’ എന്നു ചേർക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സന്ദർഭത്തിലെ വിശാലമായ സൂചനയും നിലനിർത്തുന്നു.
- source_word: ψυχικόν
  choice: പ്രാണികമായത്
  rationale: സാധാരണ ജീവപ്രാണനോടു ബന്ധപ്പെട്ട നിലയെ സൂചിപ്പിക്കുകയും πνευματικόν എന്നതിനോടുള്ള പൗലോസിന്റെ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു. ‘ഭൗതികമായത്’ എന്നത് അർഥം അനാവശ്യമായി ചുരുക്കും; ‘ആത്മീയമല്ലാത്തത്’ ധാർമികമായ നിഷേധഭാവം ചേർക്കാം.
- source_word: ἔπειτα
  choice: അതിന്റെശേഷം
  rationale: തുടർന്നുള്ള ക്രമം വ്യക്തമായി അടയാളപ്പെടുത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: എന്നാൽ ... അല്ല; ... ആണ്
  rationale: ആദ്യം വരുന്നതിനെക്കുറിച്ചുള്ള തിരുത്തൽസ്വഭാവമുള്ള ഗ്രീക്ക് വൈരുധ്യം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ψυχικόν-πνευματικόν വൈരുധ്യത്തിന്റെ വ്യാപ്തി
  choice: ആദ്യം പ്രാണികമായ നിലയും പിന്നീട് ആത്മികമായ നിലയും വരുന്നു എന്ന ക്രമവ്യത്യാസം
  alternative: ‘പ്രാണിക ശരീരം’ എന്നും ‘ആത്മിക ശരീരം’ എന്നും ശരീരങ്ങളെ മാത്രം വ്യക്തമാക്കി വായിക്കൽ
  rationale: ചുറ്റുപാടിലുള്ള വാക്യങ്ങളിൽ ‘ശരീരം’ വ്യക്തമായുണ്ടെങ്കിലും ഈ വാക്യത്തിൽ പൗലോസ് ആ പദം ഒഴിവാക്കി നാമവൽക്കരിച്ച വിശേഷണങ്ങളാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ വിവർത്തനം ‘ശരീരം’ ചേർത്ത് ആശയം ചുരുക്കാതെ സന്ദർഭബന്ധം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായനാസൗകര്യമുള്ളതുമായ മലയാളം. ‘ആത്മികമായത്/പ്രാണികമായത്’ എന്ന സമാന്തരരൂപം ഗ്രീക്കിലെ നാമവൽക്കരിച്ച വിശേഷണങ്ങളുടെ വൈരുധ്യം നിലനിർത്തുന്നു; അടിക്കുറിപ്പുകൾ [a], [b] മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
