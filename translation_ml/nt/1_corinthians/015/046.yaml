    rationale: ψυχικόν derives from ψυχή and here denotes what belongs to ordinary animate life. ‘ജീവനോടു ബന്ധപ്പെട്ടത്’ is more accurate and avoids importing a particular sense of ‘soul.’
  - severity: low
    issue: The alternate-reading footnote should more clearly identify supplied words.
    rationale: Since ‘body’ is absent from this verse but explicit in the immediate context, the footnote should mark ‘ശരീരം’ as a contextual supplementation rather than imply it occurs in the Greek text here.
