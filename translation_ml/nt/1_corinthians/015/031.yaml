id: 1CO.15.31
reference: 1 Corinthians 15:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: ml
  text: ഞാൻ ദിവസവും മരിക്കുന്നു[a]—നമ്മുടെ കർത്താവായ മശീഹാ യേശുവിൽ എനിക്കുള്ള നിങ്ങളെക്കുറിച്ചുള്ള പുകഴ്ചയെച്ചൊല്ലി![b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ദിവസേന ഞാൻ മരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: “നിങ്ങളെക്കുറിച്ച് എനിക്കുള്ള പുകഴ്ച എത്ര ഉറപ്പോ അത്ര ഉറപ്പായി” എന്നോ “നിങ്ങളുടെ പുകഴ്ചയെച്ചൊല്ലി” എന്നോ വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് പ്രയോഗം ശപഥസദൃശമാണ്; ‘പുകഴ്ച’ ആരുടേതാണെന്ന വാക്യഘടനയും ചർച്ചാവിഷയമാണ്.
    reason: alternative_reading
  - marker: c
    text: 'പരമ്പരാഗത വിവർത്തനം: “ക്രിസ്തുയേശു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: ദിവസവും
  rationale: ‘ഓരോ ദിവസവും/ദിവസേന’ എന്ന ആവർത്തനാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἀποθνῄσκω
  choice: ഞാൻ മരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ പൗലോസിന്റെ ശക്തമായ ആലങ്കാരിക പ്രസ്താവന അതേപടി നിലനിർത്തുന്നു; ‘ഞാൻ മരണത്തെ നേരിടുന്നു’ എന്നത് വ്യാഖ്യാനപരമാണ്.
- source_word: νὴ
  choice: സാക്ഷി!
  rationale: ഗ്രീക്കിലെ ശപഥസദൃശമായ ഉറപ്പിക്കൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അതിന്റെ വ്യത്യസ്ത സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τὴν ὑμετέραν καύχησιν
  choice: നിങ്ങളെക്കുറിച്ച് എനിക്കുള്ള അഭിമാനം
  rationale: തുടർന്നുള്ള ‘എനിക്കുള്ള’ എന്ന ബന്ധവാക്യം പൗലോസിന് കൊരിന്ത്യരെക്കുറിച്ചുള്ള അഭിമാനമാണ് ഉദ്ദേശ്യമെന്ന വായനയെ പിന്തുണയ്ക്കുന്നു. ഉടമസ്ഥബന്ധത്തിലെ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ἣν ἔχω
  choice: എനിക്കുള്ള
  rationale: ബന്ധവാക്യത്തിന്റെ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപരമായ അർഥം ‘മശീഹാ’ എന്നു വിവർത്തനം ചെയ്യുകയും പൗലോസിന്റെ ‘യിൽ’ എന്ന ഐക്യഭാഷ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന സ്ഥാനപ്പേരും ἡμῶν എന്ന ഉടമസ്ഥസർവനാമവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗമായോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഇവിടെ Χριστός-ന്റെ സ്ഥാനപരമായ അർഥം നിലനിൽക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: καύχησις എന്ന പദത്തോടുള്ള ὑμετέραν-ന്റെ ബന്ധം
  choice: പൗലോസിന് കൊരിന്ത്യരെക്കുറിച്ചുള്ള അഭിമാനം
  alternative: കൊരിന്ത്യരുടെ സ്വന്തം പ്രശംസ/അഭിമാനം
  rationale: ‘എനിക്കുള്ള’ എന്ന ബന്ധവാക്യം തിരഞ്ഞെടുത്ത വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിലെ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: νὴ ഉൾപ്പെട്ട വാക്യത്തിന്റെ ശപഥസദൃശ സ്വഭാവം
  choice: അഭിമാനം സാക്ഷി
  alternative: ആ അഭിമാനം എത്ര ഉറപ്പോ അത്ര ഉറപ്പായി / നിങ്ങളുടെ അഭിമാനത്തെച്ചൊല്ലി
  rationale: ഉറപ്പിക്കൽശക്തി മലയാളത്തിൽ കേൾവിയാകുന്ന വിധം നൽകുന്നു; കൃത്യമായ വ്യാകരണബന്ധത്തെ അതിരുകടന്ന് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പൗലോസിന്റെ ഉജ്ജ്വലമായ ‘ഞാൻ മരിക്കുന്നു’ എന്ന പ്രയോഗവും ശപഥസദൃശ ഉറപ്പും നിലനിർത്തി; വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിലേക്ക് മാറ്റി.
