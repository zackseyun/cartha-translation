  to: അതുകൊണ്ട്, എന്റെ പ്രിയപ്പെട്ട സഹോദരന്മാരേ[a], ഉറച്ചവരായും അചഞ്ചലരായും ഇരിക്കുക; കർത്താവിന്റെ വേലയിൽ എപ്പോഴും സമൃദ്ധരായി ഏർപ്പെട്ടുകൊണ്ടിരിക്കുക. കർത്താവിലുള്ള നിങ്ങളുടെ അധ്വാനം വ്യർഥമല്ലെന്ന് നിങ്ങൾ അറിയുന്നുവല്ലോ.
