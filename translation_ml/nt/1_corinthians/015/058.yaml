id: 1CO.15.58
reference: 1 Corinthians 15:58
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ പ്രിയപ്പെട്ട സഹോദരന്മാരേ[a], ഉറച്ചവരായും അചഞ്ചലരായും ഇരിക്കുക; കർത്താവിന്റെ വേലയിൽ എപ്പോഴും സമൃദ്ധരായി ഏർപ്പെട്ടുകൊണ്ടിരിക്കുക. കർത്താവിലുള്ള നിങ്ങളുടെ അധ്വാനം വ്യർഥമല്ലെന്ന് നിങ്ങൾ അറിയുന്നുവല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം സന്ദർഭമനുസരിച്ച് സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ കൂട്ടമായി സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻഭാഗത്തെ പുനരുത്ഥാനവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാള സംയോജകം.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: എന്റെ പ്രിയ സഹോദരന്മാരേ
  rationale: വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകൾ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസികളെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἑδραῖοι γίνεσθε
  choice: ഉറച്ചവരുമായി തീരുക
  rationale: ἑδραῖοι എന്നതിലെ ദൃഢതയും γίνεσθε എന്ന ക്രിയയിലെ ‘ആയിത്തീരുക/ആയിരിക്കുക’ എന്ന ചലനാത്മക ആഹ്വാനവും സ്വാഭാവികമായി പകരുന്നു.
- source_word: ἀμετακίνητοι
  choice: കുലുക്കാനാവാത്തവർ
  rationale: സ്വസ്ഥാനത്തുനിന്നോ ബോധ്യത്തിൽനിന്നോ മാറ്റപ്പെടാത്ത ശക്തമായ നിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: περισσεύοντες
  choice: സമൃദ്ധരായിരിക്കുക
  rationale: തുടർച്ചയായും അളവിൽ കവിഞ്ഞും കർത്താവിന്റെ വേലയിൽ ഏർപ്പെടുക എന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: കർത്താവിന്റെ വേലയിൽ
  rationale: ἔργον എന്ന പദത്തിന്റെ വിശാലമായ അർഥം ചുരുക്കാതെ, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളം നൽകുന്നു.
- source_word: ὁ κόπος ὑμῶν
  choice: നിങ്ങളുടെ അധ്വാനം
  rationale: ക്ഷീണം വരുത്തുന്ന കഠിനപ്രയത്നം എന്ന κόπος-ന്റെ ഭാരം ‘അധ്വാനം’ പകരുന്നു.
- source_word: οὐκ ἔστιν κενὸς
  choice: വ്യർഥമല്ല
  rationale: ഫലശൂന്യമോ അർഥരഹിതമോ അല്ലെന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിലുള്ള
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ബന്ധപരവും ഐക്യപരവുമായ വിശാലത വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പദത്തിന്റെ ലിംഗപരമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’; ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും അഭിസംബോധന മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളാമെന്ന അർഥം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: വാക്യാവസാനത്തിലെ ἐν κυρίῳ-യുടെ ബന്ധം
  choice: ‘അധ്വാനം’ എന്നതിനോട് ചേർത്ത് ‘കർത്താവിലുള്ള നിങ്ങളുടെ അധ്വാനം’
  alternative: ‘കർത്താവുനിമിത്തം നിങ്ങളുടെ അധ്വാനം വ്യർഥമല്ല’
  rationale: ഗ്രീക്കിലെ ബന്ധം ഏറ്റവും സ്വാഭാവികമായി അധ്വാനത്തെ വിശേഷിപ്പിക്കുന്നു; കാരണാർഥം ചേർത്ത് വ്യാഖ്യാനം ചുരുക്കുന്നില്ല.
- issue: κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: നാഥൻ
  rationale: പുതിയനിയമപരമായ ദൈവശാസ്ത്രഭാരം വഹിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്ഥാപിതവും ഗൗരവമുള്ളതുമായ തുല്യപദം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പ്രബോധനശൈലി. ‘തീരുക’ γίνεσθε-യുടെ ക്രിയാത്മകത നിലനിർത്തുന്നു; അവസാനത്തെ ἐν κυρίῳ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘കർത്താവിലുള്ള’ എന്നു നൽകിയിരിക്കുന്നു.
