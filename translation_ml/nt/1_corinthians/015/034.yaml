id: 1CO.15.34
reference: 1 Corinthians 15:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: ml
  text: ശരിയായ വിധത്തിൽ സുബോധം വീണ്ടെടുക്കുവിൻ[a]; പാപം ചെയ്തുകൊണ്ടിരിക്കരുത്[b]. നിങ്ങളിൽ ചിലർക്കു ദൈവത്തെക്കുറിച്ച് അറിവില്ല. ഇതു നിങ്ങളുടെ ലജ്ജയ്ക്കായി ഞാൻ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഉചിതമായി സുബോധം വീണ്ടെടുക്കുവിൻ.’ ഈ ക്രിയ അക്ഷരാർഥത്തിൽ മദ്യലഹരിയിൽനിന്ന് തെളിഞ്ഞ ബോധത്തിലേക്കു വരുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അതു രൂപകപ്രയോഗമായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘പാപം ചെയ്യരുത്’ അല്ലെങ്കിൽ ‘പാപം ചെയ്യുന്നതു നിർത്തുവിൻ.’ ഗ്രീക്കിലെ വർത്തമാനകാല ആജ്ഞ തുടരുന്നതോ പതിവായതോ ആയ പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: സുബോധത്തിലേക്കു വരുവിൻ
  rationale: മദ്യലഹരിയിൽനിന്നു തെളിഞ്ഞ ബോധത്തിലേക്കു വരുന്നതിനെ അക്ഷരാർഥത്തിൽ സൂചിപ്പിക്കുന്ന ക്രിയ ഇവിടെ രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘സുബോധത്തിലേക്കു വരുവിൻ’ എന്നത് ആ ദൃശ്യഭാവവും നിർണായകമായ ആജ്ഞയുടെ ശക്തിയും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαίως
  choice: ശരിയായ വിധത്തിൽ
  rationale: ആജ്ഞയെ വിശേഷിപ്പിക്കുന്ന ക്രിയാവിശേഷണത്തിന്റെ ‘ശരിയായി/ഉചിതമായി’ എന്ന അർഥം വ്യക്തമാക്കുന്നു; ‘നീതിപൂർവം’ എന്നു നൽകി അനാവശ്യമായി സാങ്കേതികമായ നീതീകരണഭാവം ചേർക്കുന്നില്ല.
- source_word: μὴ ἁμαρτάνετε
  choice: പാപം ചെയ്തുകൊണ്ടിരിക്കരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞയുടെ തുടരുന്ന അഥവാ പതിവായ പ്രവൃത്തിയെ വിലക്കുന്ന ഭാവം പ്രതിഫലിപ്പിക്കുന്നു; എല്ലാവരും ഒരേ പാപം ഇപ്പോൾ ചെയ്യുന്നു എന്ന് ‘പാപം ചെയ്യുന്നതു നിർത്തുവിൻ’ എന്നതുപോലെ അമിതമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀγνωσίαν θεοῦ
  choice: ദൈവത്തെക്കുറിച്ച് അറിവില്ല
  rationale: ἀγνωσία എന്നത് അറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു; θεοῦ എന്ന ജനിറ്റീവിനെ ഇവിടെ ദൈവത്തെ സംബന്ധിച്ച അറിവില്ലായ്മയായി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, എന്നാൽ ‘ദൈവത്തെ അറിയുന്നില്ല’ എന്ന ബന്ധപരമായ വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: τινες
  choice: ചിലർ
  rationale: ശ്രോതാക്കളിൽപ്പെട്ടതോ അവരുമായി ബന്ധപ്പെട്ടതോ ആയ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക തുല്യപദം.
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: നിങ്ങളുടെ ലജ്ജയ്ക്കായി
  rationale: ശ്രോതാക്കളുടെ ലജ്ജയുമായി ഈ പ്രസ്താവനയ്ക്കുള്ള ബന്ധവും പൗലോസിന്റെ ശാസനാഭാവവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഉദ്ദേശ്യമോ ഫലമോ എന്നത് അതിരുകടന്ന് തീർപ്പാക്കുന്നില്ല.
- source_word: λαλῶ
  choice: ഞാൻ പറയുന്നു
  rationale: സന്ദർഭത്തിൽ മുമ്പുള്ള ശാസനയെ ചൂണ്ടിക്കാണിക്കുന്ന സ്വാഭാവിക വർത്തമാനകാല പ്രയോഗം.
theological_decisions:
- issue: δικαίως എന്നതിന്റെ ധാർമിക ശക്തി
  choice: ശരിയായ വിധത്തിൽ
  alternative: നീതിപൂർവം
  rationale: വാക്യം ധാർമികമായ ശാസനയാണെങ്കിലും, ക്രിയാവിശേഷണം ആദ്യം സുബോധത്തിലേക്കു ശരിയായ രീതിയിൽ മടങ്ങാനുള്ള ആജ്ഞയെയാണ് വിശേഷിപ്പിക്കുന്നത്. ‘ശരിയായ വിധത്തിൽ’ ധാർമിക ഭാവം നിലനിർത്തുകയും ഇവിടെ വ്യക്തമല്ലാത്ത സാങ്കേതികമായ ‘നീതി’ സങ്കൽപ്പം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἀγνωσίαν θεοῦ എന്നതിലെ അറിവിന്റെ സ്വഭാവം
  choice: ദൈവത്തെക്കുറിച്ച് അറിവില്ല
  alternative: ദൈവത്തെ അറിയുന്നില്ല
  rationale: ജനിറ്റീവ് ദൈവത്തെ സംബന്ധിച്ച അറിവില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തെ അറിയുന്നില്ല’ എന്നത് ബന്ധപരമോ രക്ഷാസംബന്ധമോ ആയ അർഥം കൂടുതൽ ശക്തമായി നിർദേശിക്കാം; ഉറവിടത്തിലെ വ്യാപകത നിലനിർത്താൻ കൂടുതൽ നിഷ്പക്ഷമായ രൂപം തെരഞ്ഞെടുത്തു.
- issue: πρὸς ἐντροπὴν എന്നതിൽ ഉദ്ദേശ്യമോ ഫലമോ
  choice: നിങ്ങളുടെ ലജ്ജയ്ക്കായി
  alternative: നിങ്ങളെ ലജ്ജിപ്പിക്കാനാണ്
  rationale: ഗ്രീക്ക് പ്രയോഗം ശ്രോതാക്കളുടെ ലജ്ജയിലേക്കുള്ള ദിശയെയോ ഫലത്തെയോ സൂചിപ്പിക്കാം. തിരഞ്ഞെടുത്ത രൂപം പൗലോസ് മനഃപൂർവം അവരെ ലജ്ജിപ്പിക്കുകയാണ് എന്ന ഉദ്ദേശ്യം മാത്രം നിർബന്ധിക്കാതെ ആ തുറന്ന നില നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ബഹുവചന ആജ്ഞയ്ക്ക് ‘വരുവിൻ’ ഉപയോഗിച്ച് തിരുവെഴുത്തുവായനയ്ക്ക് യോജിച്ച ഗൗരവം നിലനിർത്തിയിരിക്കുന്നു; ശേഷിക്കുന്ന വാക്യഘടന ലളിതവും നേരിട്ടതുമാണ്.
