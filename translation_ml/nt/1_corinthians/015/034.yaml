  rationale: ആദ്യ ആജ്ഞയുടെ മലയാളപ്രയോഗം മാത്രം കൂടുതൽ സ്വാഭാവികമാക്കി. ഉറവിടത്തിലെ രൂപകഭാവം, δικαίως-ന്റെ യോഗ്യത, പാപത്തെക്കുറിച്ചുള്ള വർത്തമാനകാല വിലക്കിന്റെ സൂക്ഷ്മത, ദൈവത്തെ സംബന്ധിച്ച അറിവില്ലായ്മയുടെ നിഷ്പക്ഷത, അവസാന ശാസനയുടെ ഭാവം എന്നിവ മാറ്റമില്ലാതെ സംരക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പുകളുടെ അടയാളങ്ങളും അവയുടെ വാക്യബന്ധവും ശരിയാണ്.
