id: 1CO.15.14
reference: 1 Corinthians 15:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: ml
  text: എന്നാൽ മശീഹ[a] ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ, ഞങ്ങളുടെ പ്രഘോഷണം ശൂന്യമാണ്[b], നിങ്ങളുടെ വിശ്വാസവും[c] അതുപോലെ ശൂന്യമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ ‘ക്രിസ്തു’ (ഗ്രീക്ക്: Χριστός).'
    reason: alternative_reading
  - marker: b
    text: ‘ശൂന്യമാണ്’ എന്നതിനുപകരം, രണ്ടു സ്ഥാനങ്ങളിലും ‘വ്യർഥമാണ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘വിശ്വാസം’ എന്നതിനുപകരം ‘ആശ്രയം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ മശീഹാപദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ, പേരുപോലെ മാത്രം കേൾക്കാവുന്ന പരമ്പരാഗത രൂപത്തേക്കാൾ ‘മശീഹ’ മൂലാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐγήγερται
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല
  rationale: ἐγείρωയുടെ പൂർത്തകാല കർമണിപ്രയോഗം നിലനിർത്തുന്നു; ഉയിർപ്പിക്കപ്പെട്ടതിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: ἄρα
  choice: എങ്കിൽ … ശൂന്യമാണ്
  rationale: സോപാധികവാക്യത്തിൽ നിന്നുള്ള യുക്തിപരമായ നിഗമനം മലയാളത്തിലെ സ്വാഭാവികമായ ‘എങ്കിൽ’ ഘടനയിലൂടെ വ്യക്തമാകുന്നു.
- source_word: κήρυγμα
  choice: പ്രഘോഷണം
  rationale: പ്രസംഗപ്രവൃത്തിയിൽ മാത്രം ഒതുക്കാതെ പരസ്യമായി അറിയിക്കുന്ന സന്ദേശം എന്ന κήρυγμαയുടെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: κενὸν / κενὴ
  choice: ശൂന്യമാണ്
  rationale: സാരമോ സാധുതയോ ഇല്ലാത്തത് എന്ന അർഥം നൽകുകയും രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം നിലനിർത്തി പൗലോസിന്റെ സമാന്തരഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ കൊരിന്ത്യരുടെ വിശ്വസിക്കുന്ന പ്രതികരണമാണ് ഉദ്ദേശിക്കുന്നത്; സാധാരണവും സന്ദർഭോചിതവുമായ മലയാളപദം ‘വിശ്വാസം’ ആണ്.
theological_decisions:
- issue: ഉയിർപ്പിന്റെ പ്രയോഗവും പ്രവർത്തകത്വവും
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല
  alternative: ഉയിർത്തെഴുന്നേറ്റിട്ടില്ല
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുന്നതിനാൽ ദൈവം ഉയിർപ്പിച്ചു എന്ന സൂചന മായുന്നില്ല; അതേസമയം പ്രവർത്തകനെ വിവർത്തനം കൂട്ടിച്ചേർത്ത് വ്യക്തമാക്കുന്നുമില്ല.
- issue: Χριστός പദത്തിന്റെ പദവിസ്വഭാവം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ ഉയിർപ്പുവാദത്തിൽ മശീഹാപദവി പ്രസക്തമായി തുടരുന്നതിനാൽ പദത്തിന്റെ അർഥം തുറന്നുവയ്ക്കുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രഘോഷണം’ പൊതുഅറിയിപ്പിന്റെ ഭാവം നിലനിർത്തുന്നു. ആവർത്തിക്കുന്ന ‘ശൂന്യമാണ്’ എന്ന രൂപം മൂലപാഠത്തിലെ വാചകസമാന്തര്യം സംരക്ഷിക്കുന്നു.
