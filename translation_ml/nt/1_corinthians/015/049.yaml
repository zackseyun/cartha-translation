id: 1CO.15.49
reference: 1 Corinthians 15:49
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: ml
  text: മണ്ണുകൊണ്ടുള്ള മനുഷ്യന്റെ പ്രതിരൂപം നാം ധരിച്ചതുപോലെതന്നെ, സ്വർഗീയ മനുഷ്യന്റെ പ്രതിരൂപവും നാം ധരിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ, “സ്വർഗീയ മനുഷ്യന്റെ പ്രതിരൂപവും നമുക്കു ധരിക്കാം” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: പോലെതന്നെ
  rationale: രണ്ടു അവസ്ഥകൾ തമ്മിലുള്ള വ്യക്തമായ അനുരൂപത സൂചിപ്പിക്കുന്നു.
- source_word: ἐφορέσαμεν
  choice: നാം ധരിച്ചിരിക്കുന്നതു
  rationale: ആദാമിക മനുഷ്യാവസ്ഥയുടെ പ്രതിരൂപം വഹിച്ച അനുഭവം ഇപ്പോഴും പ്രസക്തമാണെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: εἰκόνα
  choice: പ്രതിരൂപം
  rationale: εἰκών എന്ന പദത്തിന്റെ രൂപസാദൃശ്യവും പ്രതിനിധാനവുമായ അർഥം നിലനിർത്തുകയും ആദാം–ക്രിസ്തു താരതമ്യം അമിതമായി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῦ χοϊκοῦ
  choice: മണ്ണുകൊണ്ടുള്ള മനുഷ്യന്റെ
  rationale: ഉല്പത്തിയിലെ പൊടി/മണ്ണ് പശ്ചാത്തലവും മുൻവാക്യങ്ങളിലെ ആദ്യമനുഷ്യനോടുള്ള ബന്ധവും വ്യക്തമാക്കുന്നു.
- source_word: φορέσομεν
  choice: നാം ധരിക്കും
  rationale: SBLGNT-യിലെ ഭാവികാല സൂചകക്രിയയെ പിന്തുടർന്ന് ഭാവിയിലെ രൂപാന്തരത്തെ പ്രസ്താവനയായി അവതരിപ്പിക്കുന്നു.
- source_word: τοῦ ἐπουρανίου
  choice: സ്വർഗീയ മനുഷ്യന്റെ
  rationale: മുൻപത്തെ 'മണ്ണുകൊണ്ടുള്ള മനുഷ്യൻ' എന്ന പ്രയോഗത്തോടുള്ള സമാന്തരതയും സന്ദർഭത്തിലെ രണ്ടാമത്തെ മനുഷ്യനെക്കുറിച്ചുള്ള സൂചനയും നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: രണ്ടാം ഭാഗത്തിലെ കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിലെ 'വും' സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടാം ക്രിയയുടെ ഭാവികാല സൂചകരൂപമോ ആഹ്വാനാത്മക ഉപവാക്യരൂപമോ
  choice: നാം ധരിക്കും
  alternative: നമുക്കു ധരിക്കാം
  rationale: അച്ചടിച്ച SBLGNT പാഠത്തിലെ φορέσομεν ഭാവികാല സൂചകരൂപമാണ്; അതിനാൽ മുഖ്യപാഠം ഭാവിയിലെ ഉയിർപ്പുരൂപാന്തരത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയായി പരിഭാഷപ്പെടുത്തുന്നു. പ്രാധാന്യമുള്ള മറ്റൊരു കൈയെഴുത്തുപാഠം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. 'പ്രതിരൂപം' എന്നത് ആശയത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; 'മണ്ണുകൊണ്ടുള്ള മനുഷ്യൻ' ഉല്പത്തി പശ്ചാത്തലം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
