source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: ml
  text: എന്നാൽ, നമ്മുടെ കർത്താവായ യേശു മിശിഹാവിലൂടെ നമുക്കു വിജയം നൽകുന്ന ദൈവത്തിനു നന്ദി![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'പരമ്പരാഗത മലയാള പ്രയോഗം: “യേശുക്രിസ്തുവിലൂടെ.” ഗ്രീക്ക് ശീർഷകമായ Χριστός എന്നതിന് “മിശിഹാ” എന്നാണ് അർഥം.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: നന്ദി
  rationale: ഇവിടെ χάρις ദൈവത്തോടുള്ള നന്ദിപ്രഖ്യാപനമായാണ് പ്രവർത്തിക്കുന്നത്; ‘ദൈവത്തിനു നന്ദി’ എന്നത് സ്വാഭാവികവും സ്തുതിപരവുമായ മലയാള പ്രയോഗമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മരണത്തെക്കുറിച്ചുള്ള മുൻവാക്യങ്ങളിൽനിന്ന് നന്ദിയിലേക്കുള്ള മൃദുവായ വിരുദ്ധതിരിവ് സൂചിപ്പിക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: നന്ദി അർപ്പിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തിയുടെ നേരായ മലയാളരൂപം.
- source_word: τῷ διδόντι
  choice: നൽകുന്ന
  rationale: വർത്തമാനകാല കൃദന്തരൂപം ദൈവത്തെ വിജയം നൽകുന്നവനായി വിശേഷിപ്പിക്കുന്നു; തുടർച്ചയുള്ളതോ സ്വഭാവസൂചകമോ ആയ അർഥം നിലനിർത്തുന്നു.
- source_word: ἡμῖν
  choice: നമുക്കു
  rationale: ദൈവം വിജയം നൽകുന്ന സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി.
- source_word: τὸ νῖκος
  choice: വിജയം
  rationale: സന്ദർഭത്തിൽ മരണത്തിന്മേലുള്ള നിർദിഷ്ടമായ അന്തിമജയത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ നിർദിഷ്ടപദം വേർതിരിച്ചുള്ള ഉപപദം കൂടാതെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: διὰ
  choice: ആയിലൂടെ
  rationale: ജനിതകവിഭക്തിയോടുകൂടിയ διά മാർഗമോ മധ്യസ്ഥതയോ സൂചിപ്പിക്കുന്നു; ‘യേശു മശിഹായിലൂടെ’ അത് സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന ക്രിസ്തുശീർഷകത്തിന് പരമ്പരാഗതവും വ്യക്തവുമായ ‘കർത്താവ്’ ഉപയോഗിച്ചു; തുടർന്നുള്ള പേരുമായി മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കാൻ ‘ആയ’ ചേർത്തു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശിഹാ
  rationale: Ἰησοῦ വ്യക്തിനാമമായി ‘യേശു’ എന്നും Χριστός അർഥസജീവമായ ശീർഷകമായി ‘മശിഹാ’ എന്നും നൽകി; മലയാള വിഭക്തിസന്ധിയിൽ ‘മശിഹായിലൂടെ’ എന്ന രൂപം സ്വീകരിച്ചു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്ന പേര്-ശീർഷകക്രമത്തിലെ Χριστοῦ-യുടെ പരിഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘മശിഹാ’
  alternative: ‘ക്രിസ്തു’
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ ശീർഷകമായി അർഥസജീവമാണ്. അതിനാൽ അതിന്റെ ‘അഭിഷിക്തൻ/മശിഹാ’ എന്ന ശീർഷകാർഥം സുതാര്യമാക്കാൻ ‘മശിഹാ’ സ്വീകരിച്ചു; മലയാളത്തിലെ പരമ്പരാഗത ‘യേശുക്രിസ്തു’ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ നന്ദിപ്രഖ്യാപനശൈലി. ഗ്രീക്കിലെ വാക്യാരംഭ വിരുദ്ധതിരിവ് ‘എന്നാൽ’ കൊണ്ടും, ദൈവത്തെ വിജയം നൽകുന്നവനായി വിശേഷിപ്പിക്കുന്ന കൃദന്തഘടന മലയാളത്തിലെ ‘നൽകുന്ന ദൈവം’ കൊണ്ടും നിലനിർത്തി.
