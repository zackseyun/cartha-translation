id: 1CO.15.35
reference: 1 Corinthians 15:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλὰ ἐρεῖ τις· Πῶς ἐγείρονται οἱ νεκροί, ποίῳ δὲ σώματι ἔρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: ml
  text: 'എന്നാൽ, ഒരാൾ ചോദിക്കും: “മരിച്ചവർ എങ്ങനെ ഉയിർപ്പിക്കപ്പെടുന്നു?[a] ഏതുതരം ശരീരത്തോടെയാണ് അവർ വരുന്നത്?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മരിച്ചവർ എങ്ങനെ ഉയിർത്തെഴുന്നേൽക്കുന്നു?” ഗ്രീക്ക് ക്രിയ കർമണി പ്രയോഗത്തിലാണ്; അക്ഷരാർഥം “ഉയിർപ്പിക്കപ്പെടുന്നു” എന്നാണ്. ഇത് ദൈവിക പ്രവർത്തകത്വത്തെ സൂചിപ്പിച്ചേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻചർച്ചയിൽനിന്ന് പ്രതീക്ഷിക്കാവുന്ന ഒരു ചോദ്യത്തിലേക്കോ എതിർവാദത്തിലേക്കോ ഉള്ള വൈരുധ്യാത്മക മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐρεῖ τις
  choice: ഒരാൾ ചോദിച്ചേക്കാം
  rationale: അക്ഷരാർഥത്തിൽ ‘ഒരാൾ പറയും’ എന്ന ഭാവികാല പ്രയോഗമാണെങ്കിലും, തുടർന്ന് നേരിട്ടുള്ള ചോദ്യങ്ങൾ വരുന്നതിനാൽ മലയാളത്തിൽ സാങ്കൽപ്പിക സംവാദകനെ പരിചയപ്പെടുത്താൻ ‘ചോദിച്ചേക്കാം’ കൂടുതൽ സ്വാഭാവികമാണ്.
- source_word: Πῶς
  choice: എങ്ങനെ
  rationale: രീതിയെയോ സാധ്യതയെയോ കുറിച്ചുള്ള ചോദ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐγείρονται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കർമണി രൂപം സംരക്ഷിക്കുകയും, പ്രവർത്തകനെ വ്യക്തമായി പേരെടുത്തുപറയാതെ ഉയിർപ്പിക്കുന്ന പ്രവർത്തനത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ νεκροί
  choice: മരിച്ചവർ
  rationale: മരിച്ച മനുഷ്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന substantival adjective-ന്റെ സ്വാഭാവികമായ മലയാള പരിഭാഷയാണ്.
- source_word: ποίῳ ... σώματι
  choice: ഏതുതരം ശരീരത്തോടെയാണ്
  rationale: ποίῳ എന്നതിന്റെ ഗുണപരമായ ‘ഏതുതരം’ എന്ന അർഥവും ദത്തിവിന്റെ സഹവർത്തിത്വഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: (പ്രത്യേക ബന്ധകപദമില്ലാതെ)
  rationale: മലയാളത്തിലെ തുടർച്ചയായ രണ്ട് ചോദ്യങ്ങളിൽ ബന്ധം വ്യക്തമായതിനാൽ ‘കൂടാതെ/എന്നാൽ’ ചേർക്കുന്നത് അനാവശ്യവും കൃത്രിമവുമാകും.
- source_word: ἔρχονται
  choice: അവർ വരുന്നത്
  rationale: ‘വരുന്നു’ എന്ന ഗ്രീക്ക് പദം വ്യാഖ്യാനിച്ച് ‘പ്രത്യക്ഷപ്പെടുന്നു’ എന്നാക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉയിർപ്പിലെ കർമണി പ്രയോഗവും പ്രവർത്തകത്വവും
  choice: മരിച്ചവർ എങ്ങനെ ഉയിർപ്പിക്കപ്പെടുന്നു?
  alternative: മരിച്ചവർ എങ്ങനെ ഉയിർത്തെഴുന്നേൽക്കുന്നു?
  rationale: ἐγείρονται കർമണി രൂപമായതിനാൽ ‘ഉയിർപ്പിക്കപ്പെടുന്നു’ എന്നു നൽകി ദൈവിക പ്രവർത്തകത്വത്തിന്റെ സാധ്യത നിലനിർത്തുന്നു; എന്നാൽ ദൈവത്തെ പ്രവർത്തകനായി വാക്യത്തിൽ തുറന്നുചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. സാങ്കൽപ്പിക എതിർവാദിയെ മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കാൻ ‘ചോദിച്ചേക്കാം’ ഉപയോഗിച്ചു; ഗ്രീക്കിലെ കർമണി രൂപത്തിന്റെ ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മത പ്രധാനവാചകത്തിലും അടിക്കുറിപ്പിലും നിലനിർത്തി.
