  to: 'എന്നാൽ ഈ നശ്വരമായത് അക്ഷയത ധരിക്കുകയും ഈ മർത്യമായത് അമർത്യത ധരിക്കുകയും ചെയ്യുമ്പോൾ, എഴുതപ്പെട്ടിരിക്കുന്ന വചനം യാഥാർഥ്യമാകും[a]: “മരണം വിജയത്തിൽ വിഴുങ്ങപ്പെട്ടിരിക്കുന്നു.”[b]'
