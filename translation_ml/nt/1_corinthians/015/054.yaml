reference: 1 Corinthians 15:54
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: ml
  text: 'എന്നാൽ ഈ നശ്വരമായത് അക്ഷയത ധരിക്കുകയും ഈ മർത്യമായത് അമർത്യത ധരിക്കുകയും ചെയ്യുമ്പോൾ, എഴുതപ്പെട്ടിരിക്കുന്ന വചനം യാഥാർഥ്യമാകും[a]: “മരണം വിജയത്തിൽ വിഴുങ്ങപ്പെട്ടിരിക്കുന്നു.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എഴുതപ്പെട്ടിരിക്കുന്ന വചനം സംഭവിക്കും” അല്ലെങ്കിൽ “നിവൃത്തിയാകും.” ഗ്രീക്ക് ക്രിയയുടെ അടിസ്ഥാന അർഥം “സംഭവിക്കും/ഉണ്ടാകും” എന്നതാണ്.
    reason: alternative_reading
  - marker: b
    text: യെശയ്യാവ് 25:8-ൽനിന്നുള്ള ഉദ്ധരണി; പൗലോസ് ഉദ്ധരിക്കുന്ന ഗ്രീക്ക് പാഠപരമ്പരയുടെ വാക്കുകളെയാണ് ഇത് പ്രതിഫലിപ്പിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: φθαρτὸν
  choice: നശ്വരമായ ഈ ശരീരം
  rationale: നാശത്തിനും ജീർണതയ്ക്കും വിധേയമായ ഇപ്പോഴത്തെ ദേഹത്തെയാണ് നാമവിശേഷണമായി ഉപയോഗിച്ചിരിക്കുന്ന പദം സൂചിപ്പിക്കുന്നത്. സന്ദർഭം വ്യക്തമാക്കാൻ ‘ശരീരം’ ചേർത്തു.
- source_word: ἐνδύσηται
  choice: ധരിക്കുകയും
  rationale: പുതിയൊരു അവസ്ഥ വസ്ത്രംപോലെ ധരിക്കുന്നതെന്ന പൗലോസിന്റെ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀφθαρσίαν
  choice: അനശ്വരത
  rationale: φθαρτός എന്നതിന്റെ വിരുദ്ധാവസ്ഥയായ നാശരാഹിത്യത്തെ വ്യക്തമായും സംക്ഷിപ്തമായും സൂചിപ്പിക്കുന്നു.
- source_word: θνητὸν
  choice: മരണാധീനമായ ഈ ശരീരം
  rationale: മരിക്കാൻ വിധേയമായ അവസ്ഥയെ വ്യക്തമാക്കുന്നു; സന്ദർഭപരമായ സൂചിതനാമമായ ‘ശരീരം’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀθανασίαν
  choice: അമർത്യത
  rationale: മരണരാഹിത്യം എന്ന അർഥമുള്ള നാമത്തിന് നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാള തുല്യപദം.
- source_word: γενήσεται
  choice: നിവൃത്തിയാകും
  rationale: എഴുതപ്പെട്ട വചനം യാഥാർഥ്യമാകുന്നതിനെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. ഗ്രീക്കിലെ γίνομαι അക്ഷരാർഥത്തിൽ ‘സംഭവിക്കും/യാഥാർഥ്യമാകും’ എന്നും വിവർത്തനം ചെയ്യാം; ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: എഴുതപ്പെട്ടിരിക്കുന്ന വചനം
  rationale: λόγος എന്ന പദത്തോടും perfect participle-ന്റെ നിലനിൽക്കുന്ന ഫലത്തോടും അടുത്തുനിൽക്കുന്ന, മലയാളത്തിൽ മാന്യവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: Κατεπόθη
  choice: വിഴുങ്ങപ്പെട്ടിരിക്കുന്നു
  rationale: കർമണിപ്രയോഗവും വിഴുങ്ങൽരൂപകവും സംരക്ഷിക്കുന്നു; ഭാവിയിലെ ആ നിമിഷത്തിൽ പ്രഖ്യാപനം സാക്ഷാത്കരിച്ച നിലയെ മലയാള present-perfect സ്വഭാവത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς νῖκος
  choice: വിജയത്തിൽ
  rationale: മരണത്തിന്റെ പൂർണപരാജയം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാള രൂപം.
theological_decisions:
- issue: γενήσεται എന്ന പദവും തിരുവെഴുത്തിലെ ഉദ്ധരണിയും തമ്മിലുള്ള ബന്ധം
  choice: പ്രധാന പാഠത്തിൽ ‘നിവൃത്തിയാകും’
  alternative: ‘യാഥാർഥ്യമാകും’ അല്ലെങ്കിൽ ‘സംഭവിക്കും’
  rationale: ഉദ്ധരിക്കപ്പെട്ട വചനം സത്യമായി സംഭവിക്കുന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; എന്നാൽ γίνομαι-യിൽ സാങ്കേതികമായ ‘നിവൃത്തി’ പദം നിർബന്ധമല്ലാത്തതിനാൽ കൂടുതൽ അക്ഷരാർഥമുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: Κατεπόθη എന്ന aorist passive-ന്റെ കാലവും ദൃഷ്ടികോണവും
  choice: ‘വിഴുങ്ങപ്പെട്ടിരിക്കുന്നു’
  alternative: ‘വിഴുങ്ങപ്പെട്ടു’ അല്ലെങ്കിൽ ‘വിഴുങ്ങപ്പെടുന്നു’
  rationale: ഭാവിമുഖമായ അന്ത്യകാല സന്ദർഭത്തിൽ, അന്ന് പൂർത്തിയായ യാഥാർഥ്യമായി ഈ പ്രവാചകപ്രഖ്യാപനം നിലകൊള്ളുന്നു എന്ന ശക്തി നൽകുന്നു; കർമണിരൂപം പ്രവർത്തകനെ അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. ‘നശ്വരമായത്/മരണാധീനമായത്’ എന്നു മാത്രം പറയുന്നതിലെ അസ്വാഭാവികത ഒഴിവാക്കാൻ ഗ്രീക്കിൽ സൂചിതമായ ‘ശരീരം’ രണ്ടിടത്തും വ്യക്തമാക്കിയിട്ടുണ്ട്. രൂപകവും ഉദ്ധരണിയുടെ അന്ത്യകാല പിരിമുറുക്കവും നിലനിർത്തി.
