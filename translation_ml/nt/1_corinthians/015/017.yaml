id: 1CO.15.17
reference: 1 Corinthians 15:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: ml
  text: എന്നാൽ മശീഹ ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ[a], നിങ്ങളുടെ വിശ്വാസം വ്യർഥമാണ്[b]; നിങ്ങൾ ഇപ്പോഴും നിങ്ങളുടെ പാപങ്ങളിൽ തന്നെയുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ക്രിസ്തു ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ.’
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, ‘നിങ്ങളുടെ വിശ്വാസം നിഷ്ഫലമാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός അഭിഷിക്തനായ രക്ഷകനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; പാരമ്പര്യ നാമരൂപമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἐγήγερται
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ perfect passive രൂപം ഉയിർപ്പിക്കൽ സംഭവത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും പരോക്ഷമായി സൂചിപ്പിക്കുന്ന ദൈവിക പ്രവർത്തനവും സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ മൂലപാഠത്തിന് അതീതമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ματαία
  choice: വ്യർഥമാണ്
  rationale: പ്രസ്തുത വാദത്തിൽ വിശ്വാസം ഫലപ്രദമല്ലെന്നും ലക്ഷ്യം കൈവരിക്കില്ലെന്നും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ കൊരിന്ത്യരുടെ വിശ്വസിക്കുന്ന പ്രതികരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്ന അർഥമല്ല.
- source_word: ἔτι
  choice: ഇപ്പോഴും
  rationale: മശീഹ ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ലെന്ന സങ്കൽപ്പത്തിൽ പാപങ്ങളിലുള്ള അവസ്ഥ തുടരുന്നു എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: നിങ്ങളുടെ പാപങ്ങളിൽത്തന്നെയാണ്
  rationale: ἐν എന്നതിന്റെ സ്ഥിതി/മേഖലാസൂചന നിലനിർത്തിക്കൊണ്ട്, പാപത്തിന്റെ അവസ്ഥയിൽ തുടരുന്നു എന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള വൈരുധ്യവും നിബന്ധനാപരമായ തുടർച്ചയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിന്റെ ഭാഷയും പ്രവർത്തകത്വവും
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ലെങ്കിൽ
  alternative: ഉയിർത്തെഴുന്നേറ്റിട്ടില്ലെങ്കിൽ
  rationale: നിഷ്ക്രിയരൂപം ഗ്രീക്ക് പ്രയോഗം സംരക്ഷിക്കുകയും പ്രവർത്തകനെ വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു; അതേസമയം പൂർത്തിയായ സംഭവത്തിന്റെ ഇപ്പോഴത്തെ ഫലവും സൂചിപ്പിക്കുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദം അഭിഷിക്തനായവന്റെ ദൈവശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. പരിചിതമായ പാരമ്പര്യരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നത് വായനക്കാരന് സുതാര്യത നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ നിബന്ധന, നിഷ്ക്രിയ പുനരുത്ഥാനപ്രയോഗം, വാദത്തിന്റെ തീക്ഷ്ണമായ നിഗമനം എന്നിവ നിലനിർത്തി. ‘പാപങ്ങളിൽത്തന്നെയാണ്’ എന്ന രൂപം ἔτιയും ἐν-പ്രയോഗവും ചേർന്നുള്ള തുടർച്ചയ്ക്ക് ഊന്നൽ നൽകുന്നു.
