id: 1CO.15.33
reference: 1 Corinthians 15:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε· φθείρουσιν ἤθη χρηστὰ ὁμιλίαι κακαί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/033.yaml
  text: 'Do not be deceived: bad company corrupts good morals[a].'
translation:
  language: ml
  text: 'വഞ്ചിക്കപ്പെടരുത്: “ചീത്ത കൂട്ടുകെട്ടുകൾ നല്ല സ്വഭാവത്തെ ദുഷിപ്പിക്കുന്നു.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ചീത്ത സംഭാഷണങ്ങൾ നല്ല സ്വഭാവത്തെ ദുഷിപ്പിക്കുന്നു.” ഗ്രീക്കുപദത്തിന് സഹവാസത്തെയോ സംഭാഷണത്തെയോ സൂചിപ്പിക്കാം; ഈ സന്ദർഭത്തിന് വിശാലമായ ‘കൂട്ടുകെട്ടുകൾ’ എന്ന അർഥമാണ് കൂടുതൽ യോജിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: വഞ്ചിക്കപ്പെടരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല ആജ്ഞാരൂപം ഒരു വിലക്കാണ്. മധ്യ/കർമണി രൂപത്തിലെ തുറന്ന അർഥം നിലനിർത്തിക്കൊണ്ട്, വഞ്ചന സ്വയം വരുത്തുന്നതാണോ മറ്റുള്ളവരിൽനിന്നാണോ എന്ന് അനാവശ്യമായി നിർണയിക്കാത്ത സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: φθείρουσιν
  choice: ദുഷിപ്പിക്കുന്നു
  rationale: ക്രമേണ മോശമാക്കുക, പ്രത്യേകിച്ച് ധാർമികമായി കെടുത്തുക എന്ന ആശയം നൽകുന്നു. ‘നശിപ്പിക്കുന്നു’ എന്നത് അതിശക്തമാണ്; ‘ദുഷിപ്പിക്കുന്നു’ ധാർമികസന്ദർഭവും പഴഞ്ചൊല്ലിന്റെ ചുരുക്കവും നിലനിർത്തുന്നു.
- source_word: ἤθη
  choice: സ്വഭാവം
  rationale: ἦθος എന്ന പദത്തിന്റെ ബഹുവചനം ശീലങ്ങൾ, പെരുമാറ്റരീതി, ധാർമിക സ്വഭാവം എന്നിവ സൂചിപ്പിക്കാം. മലയാളത്തിൽ ‘നല്ല സ്വഭാവം’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ധാർമിക രൂപീകരണത്തെ ഉൾക്കൊള്ളുന്നതുമാണ്; വ്യാകരണബഹുവചനം കൃത്രിമമായി പകർത്തുന്നില്ല.
- source_word: χρηστὰ
  choice: നല്ല
  rationale: ἤθηയെ ധാർമികമായി വിശേഷിപ്പിക്കുന്ന ലളിതവും നേരിട്ടുള്ളതുമായ തർജമ. ‘സദാചാരമുള്ള’ പോലുള്ള രൂപങ്ങൾ മൂലപദത്തേക്കാൾ വിശദീകരണാത്മകമാകും.
- source_word: ὁμιλίαι
  choice: കൂട്ടുകെട്ടുകൾ
  rationale: ഈ പദത്തിന് സഹവാസം, ഇടപഴകൽ, സംഭാഷണം എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. സന്ദർഭത്തിലെ വിശാലമായ സാമൂഹികബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘കൂട്ടുകെട്ടുകൾ’ തെരഞ്ഞെടുത്തു; സംഭാഷണം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κακαί
  choice: ചീത്ത
  rationale: ധാർമികമായി ഹാനികരമായ കൂട്ടുകെട്ടുകളെ ലളിതമായി സൂചിപ്പിക്കുന്നു. ‘ദുഷ്ട’ എന്നത് കൂടുതൽ ശക്തവും വ്യക്തികളെ സ്വഭാവപരമായി വിധിക്കുന്നതുമായ ഭാവം നൽകാം.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ചുരുക്കവും ഗൗരവമുള്ളതുമായ പഴഞ്ചൊൽശൈലി. ഉദ്ധരണിച്ചിഹ്നങ്ങൾ വാക്യം ഉദ്ധരിക്കപ്പെട്ട പഴഞ്ചൊല്ലായിരിക്കാമെന്ന സാഹിത്യസ്വഭാവം വ്യക്തമാക്കുന്നു; മൂലത്തിലെ നിർബന്ധമായിട്ടില്ലാത്ത യാതൊരു സമുദായവിശേഷ പദപ്രയോഗവും ചേർത്തിട്ടില്ല.
