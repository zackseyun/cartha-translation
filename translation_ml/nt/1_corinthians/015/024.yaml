id: 1CO.15.24
reference: 1 Corinthians 15:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: ml
  text: 'പിന്നെ അവസാനം[a] വരും: അവൻ രാജ്യം ദൈവമായ പിതാവിന്[b] ഏൽപ്പിക്കുകയും സകല ആധിപത്യവും സകല അധികാരവും ശക്തിയും ഇല്ലാതാക്കുകയും ചെയ്യുമ്പോൾ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘പരിപൂർത്തി.’ ഗ്രീക്ക് τέλος എന്ന പദത്തിന് ‘അവസാനം,’ ‘ലക്ഷ്യം,’ ‘പരിപൂർത്തി’ എന്നീ അർത്ഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ദൈവത്തിനും പിതാവിനും’; ഇവിടെ ദൈവം, അതായത് പിതാവ് എന്ന അർത്ഥവും സാധ്യമാണ്.'
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘നിഷ്ഫലമാക്കുമ്പോൾ’ അല്ലെങ്കിൽ ‘പ്രാബല്യമില്ലാതാക്കുമ്പോൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: പിന്നെ
  rationale: പൗലൊസിന്റെ പുനരുത്ഥാനക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸ τέλος
  choice: അവസാനം
  rationale: കാലക്രമത്തിലെ അന്ത്യം എന്ന നേരിട്ടുള്ള അർത്ഥം നിലനിർത്തുന്നു; ലക്ഷ്യം അഥവാ പരിപൂർത്തി എന്ന അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὅταν παραδιδῷ
  choice: ഏൽപ്പിക്കുകയും ... ചെയ്യുമ്പോൾ
  rationale: ഭാവിയിൽ സംഭവിക്കുന്ന രാജഭരണത്തിന്റെ കൈമാറ്റത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὴν βασιλείαν
  choice: രാജ്യം
  rationale: βασιλείαയുടെ രാജ്യം/ഭരണം എന്ന അർത്ഥവ്യാപ്തിയിൽ, കൈമാറ്റത്തിന്റെ ദൃശ്യത്തിന് ഏറ്റവും സ്വാഭാവികമായ പദം.
- source_word: τῷ θεῷ καὶ πατρί
  choice: ദൈവമായ പിതാവിന്
  rationale: ദൈവം, അതായത് പിതാവ് എന്ന സമാനാധികരണബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὅταν καταργήσῃ
  choice: ഇല്ലാതാക്കുകയും ... ചെയ്യുമ്പോൾ
  rationale: പ്രവർത്തനശേഷിയും അധികാരസ്ഥാനവും നിർണായകമായി അവസാനിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു; metaphysical annihilation നിർബന്ധമായി ചുമത്തുന്നില്ല.
- source_word: πᾶσαν ἀρχὴν
  choice: സകല ആധിപത്യവും
  rationale: ἐξουσία, δύναμις എന്നിവയോടൊപ്പമുള്ള അധികാരശക്തികളുടെ ത്രയത്തിൽ ἀρχήയെ അമിതമായി വ്യക്തിവൽക്കരിക്കാതെ ഭരണം/ആധിപത്യം എന്ന നിലയിൽ നൽകുന്നു.
- source_word: πᾶσαν ἐξουσίαν
  choice: സകല അധികാരവും
  rationale: അധികാരം പ്രയോഗിക്കാനുള്ള അവകാശമോ അധികാരമേഖലയോ എന്ന സാധാരണ അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: δύναμιν
  choice: ശക്തിയും
  rationale: ത്രയത്തിലെ വിശാലമായ ശക്തി/പ്രാബല്യം എന്ന അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: τῷ θεῷ καὶ πατρί എന്നതിലെ ‘ദൈവം’–‘പിതാവ്’ ബന്ധം
  choice: സമാനാധികരണമായി ‘ദൈവമായ പിതാവ്’
  alternative: ‘ദൈവത്തിനും പിതാവിനും’ അഥവാ ‘ദൈവവും പിതാവുമായവന്’
  rationale: സന്ദർഭത്തിൽ രാജ്യം ഏൽപ്പിക്കപ്പെടുന്നത് പിതാവിനാണ്; ഈ പരിഭാഷ ദൈവം, അതായത് പിതാവ് എന്ന ഗ്രീക്ക് ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു, പുത്രന്റെ ദൈവത്വത്തെക്കുറിച്ച് പാഠത്തിന് പുറത്തുള്ള നിഗമനം ചേർക്കുന്നില്ല.
- issue: καταργήσῃ എന്നതിന്റെ ശക്തി
  choice: ‘ഇല്ലാതാക്കുക’—പ്രാബല്യമോ പ്രവർത്തനമോ അവസാനിപ്പിക്കുക
  alternative: ‘നശിപ്പിക്കുക’, ‘നിഷ്ഫലമാക്കുക’
  rationale: എല്ലാ എതിർ ആധിപത്യത്തിന്റെയും അധികാരത്തിന്റെയും ശക്തിയുടെയും പ്രവർത്തനസ്ഥാനം നിർണായകമായി അവസാനിപ്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; സമ്പൂർണ അസ്തിത്വനാശം എന്ന വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- issue: ἀρχή വ്യക്തികളെയോ അമൂർത്തമായ ആധിപത്യത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ‘ആധിപത്യം’ എന്ന അമൂർത്ത/സ്ഥാപനാത്മക രൂപം
  alternative: ‘ഭരണാധികാരി’ അല്ലെങ്കിൽ ‘പ്രഭു’
  rationale: ἐξουσία, δύναμις എന്നിവയോടുള്ള സമാന്തരത നിലനിർത്തുകയും ഗ്രീക്കിലെ വ്യക്തിപരവും അമൂർത്തവുമായ സാധ്യത പൂർണമായി അടച്ചുപൂട്ടാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘വരും’ എന്ന മുഖ്യക്രിയയ്ക്ക് പിന്നാലെ കോളൺ ഉപയോഗിച്ച് രണ്ട് ὅταν ഉപവാക്യങ്ങളെയും ഒരേ സമയസൂചനയ്ക്കു കീഴിൽ സ്വാഭാവികമായി കൂട്ടിച്ചേർത്തു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
