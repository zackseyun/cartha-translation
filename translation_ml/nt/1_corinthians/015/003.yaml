id: 1CO.15.3
reference: 1 Corinthians 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഏറ്റവും പ്രാധാന്യമുള്ള കാര്യങ്ങളിൽ ഒന്നായി, ഞാനും സ്വീകരിച്ചതു ഞാൻ നിങ്ങൾക്കു കൈമാറി: മശീഹ നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി തിരുവെഴുത്തുകൾക്കനുസരിച്ച് മരിച്ചു,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παρέδωκα
  choice: ഞാൻ നിങ്ങൾക്കു കൈമാറി
  rationale: സ്വീകരിച്ച ഉപദേശമോ പാരമ്പര്യമോ അധികാരപൂർവം മറ്റുള്ളവർക്കു പകർന്നുനൽകുന്നതാണ് ഇവിടെ παραδίδωμι സൂചിപ്പിക്കുന്നത്; ‘കൈമാറി’ ഈ ആശയം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: ἐν πρώτοις
  choice: ഏറ്റവും പ്രധാനമായ കാര്യമായി
  rationale: ഈ സന്ദർഭത്തിൽ കാലക്രമത്തെക്കാൾ പ്രാധാന്യത്തിലെ മുൻഗണനയാണ് സാധ്യതയേറിയ അർഥം; ഗ്രീക്കിലെ സാധ്യതയുള്ള കാലക്രമാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὃ καὶ παρέλαβον
  choice: എനിക്കു ലഭിച്ചതുതന്നെ
  rationale: സ്വീകരിച്ചതും കൈമാറിയതും ഒരേ ഉള്ളടക്കമാണെന്ന സമാന്തരത ‘തന്നെ’ സ്വാഭാവികമായി ഊന്നിപ്പറയുന്നു.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഈ വിശ്വാസപ്രഖ്യാപനത്തിൽ Χριστός പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം മുൻനിൽക്കുന്നതിനാൽ യഹൂദ മശീഹാപരമായ ആശയം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: അയോറിസ്റ്റ് നിർദേശകത്തിന്റെ പൂർത്തിയായ ഭൂതകാലസംഭവം ലളിതമായ ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി
  rationale: ὑπέρ എന്നതിന്റെ പ്രതിനിധിത്വപരവും കാരണപരവുമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ, പ്രത്യേക പ്രായശ്ചിത്തസിദ്ധാന്തം ഇറക്കുമതി ചെയ്യാതെയും വാക്യത്തിന്റെ രക്ഷാശാസ്ത്രപരമായ അവകാശവാദം നിലനിർത്തുന്നു.
- source_word: κατὰ τὰς γραφάς
  choice: തിരുവെഴുത്തുകൾക്കനുസരിച്ച്
  rationale: തിരുവെഴുത്തുകളോടുള്ള പൊരുത്തമോ അവയ്ക്കനുസൃതമായ സംഭവമോ സൂചിപ്പിക്കുന്ന κατάയുടെ ശക്തിയും γραφάς എന്ന ബഹുവചനവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ ഇത് പേരുപോലെക്കാൾ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ‘മശീഹ’ മൂലപദത്തിന്റെ യഹൂദ-മശീഹാപരമായ അർഥം വ്യക്തമാക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν എന്നതിന്റെ വ്യാപ്തി
  choice: നമ്മുടെ പാപങ്ങൾക്കുവേണ്ടി
  alternative: നമ്മുടെ പാപങ്ങൾ നിമിത്തം
  rationale: പാപങ്ങളോടു ബന്ധപ്പെട്ട് മശീഹയുടെ മരണം രക്ഷാപരമാണെന്ന് വാക്യം ഉറപ്പിക്കുന്നു; എന്നാൽ ‘വേണ്ടി’ എന്നത് ഗ്രീക്കിലേതിനെക്കാൾ ഇടുങ്ങിയ ഒരു പ്രായശ്ചിത്തമാതൃക നിർബന്ധിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എന്തെന്നാൽ’ മുൻസന്ദർഭത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു; ‘കൈമാറി/ലഭിച്ചു’ എന്ന പദജോടി പൗലൊസിന്റെ സ്വീകരണ-പകർച്ച സമാന്തരത സംരക്ഷിക്കുന്നു. വാക്യത്തിലെ വിരാമചിഹ്നം സ്വതന്ത്ര ഉദ്ധരണിയെന്നതിലുപരി അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന വിശ്വാസസംഗ്രഹത്തിന്റെ ആരംഭമെന്ന നിലയിലാണ് നൽകിയിരിക്കുന്നത്.
