    text: അല്ലെങ്കിൽ, ‘ക്രിസ്തു.’ ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് പരമ്പരാഗതമായി ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം.
