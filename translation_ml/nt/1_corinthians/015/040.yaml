id: 1CO.15.40
reference: 1 Corinthians 15:40
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: ml
  text: സ്വർഗീയ ശരീരങ്ങളും ഭൗമിക ശരീരങ്ങളും ഉണ്ട്; എന്നാൽ സ്വർഗീയ ശരീരങ്ങളുടെ തേജസ്സ് ഒരു തരത്തിലുള്ളതും ഭൗമിക ശരീരങ്ങളുടെ തേജസ്സ് മറ്റൊരു തരത്തിലുള്ളതുമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആകാശീയ ശരീരങ്ങളും ഭൗമിക ശരീരങ്ങളും.’'
    reason: ‘സ്വർഗീയ/ഭൗമിക’ എന്ന പദജോടിക്ക് കൂടുതൽ സ്ഥലപരമോ ജ്യോതിശ്ശാസ്ത്രപരമോ ആയ വായന സാധ്യമാണെന്ന lexical alternative രേഖപ്പെടുത്തുന്നു; പ്രധാനവാചകത്തിലെ വിശാലമായ അർഥം മാറ്റുന്നില്ല.
lexical_decisions:
- source_word: σώματα
  choice: ശരീരങ്ങൾ
  rationale: ‘ശരീരം’ എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ഇവിടെ ജ്യോതിർഗോളങ്ങളെയോ പുനരുത്ഥാനശരീരങ്ങളെയോ മറ്റ് ശരീരരൂപങ്ങളെയോ മാത്രമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἐπουράνια
  choice: സ്വർഗീയ
  rationale: ‘സ്വർഗവുമായി ബന്ധപ്പെട്ട’ എന്ന അർഥവും ആകാശഗോളങ്ങളെ സൂചിപ്പിക്കാനുള്ള സാധ്യതയും നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപദം.
- source_word: ἐπίγεια
  choice: ഭൗമിക
  rationale: ἐπουράνια എന്നതിനോടുള്ള സമാന്തരവിരോധം വ്യക്തമായി നൽകുകയും ‘ഭൂമിയിലുള്ള/ഭൂമിയുമായി ബന്ധപ്പെട്ട’ എന്ന അർഥം വഹിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: രണ്ടു വിഭാഗങ്ങളുടെ നിലനിൽപ്പിനും അവയുടെ തേജസ്സിലെ വ്യത്യാസത്തിനും ഇടയിലെ ലളിതമായ വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἑτέρα ... ἑτέρα
  choice: ഒരു തരത്തിലുള്ളത് ... മറ്റൊരു തരത്തിലുള്ളത്
  rationale: വെറും വ്യത്യാസമല്ല, വ്യത്യസ്ത സ്വഭാവമോ തരമോ എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: δόξα
  choice: തേജസ്സ്
  rationale: ഈ ഉപമയിലെ ദൃശ്യമായ പ്രഭയും മഹിമയും സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മഹത്ത്വം’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്, അതേസമയം δόξαയുടെ മഹിമാഭാവം പൂർണമായി നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: സ്വർഗീയ ശരീരങ്ങളുടെ ... ഭൗമിക ശരീരങ്ങളുടെ
  rationale: ഗ്രീക്കിൽ ‘ശരീരങ്ങൾ’ അധ്യാഹൃതമാണെങ്കിലും, മലയാളത്തിൽ അത് ആവർത്തിക്കുന്നത് ആശയം ഉടൻ വ്യക്തമാക്കുകയും തെറ്റായ നിർജീവ വിശേഷണപ്രയോഗം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘സ്വർഗീയ ശരീരങ്ങൾ’, ‘ഭൗമിക ശരീരങ്ങൾ’ എന്നിവയുടെ സൂചിതാർഥം
  choice: ഒരു പ്രത്യേക സൂചിതാർഥത്തിലേക്ക് ചുരുക്കാതെ പൊതുവായ ശരീരവിഭാഗങ്ങളായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ആകാശഗോളങ്ങളും ഭൂമിയിലെ ശരീരങ്ങളും’ അല്ലെങ്കിൽ ‘സ്വർഗീയ ജീവികളും ഭൗമിക ജീവികളും’.
  rationale: ഗ്രീക്ക് σώματα എന്നാണ് പറയുന്നത്; ‘ജീവികൾ’ എന്ന് ചേർക്കുന്നതോ ജ്യോതിർഗോളങ്ങളിലേക്കു മാത്രം പരിമിതപ്പെടുത്തുന്നതോ മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനാത്മകമാകും. പൊതുവായ രൂപം പൗലൊസിന്റെ ഉപമയിലെ ഉദ്ദേശ്യപൂർവമായ വ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും സംരക്ഷിക്കുന്നു.
- issue: δόξαയുടെ അർഥപരിധി
  choice: ‘തേജസ്സ്’ എന്നു നൽകി.
  alternative: ‘മഹത്ത്വം’ അല്ലെങ്കിൽ ‘പ്രഭ’.
  rationale: സന്ദർഭത്തിലെ വ്യത്യസ്തമായ ദൃശ്യശോഭയെ ‘തേജസ്സ്’ നന്നായി അറിയിക്കുന്നു; എന്നാൽ അതിനെ ശുദ്ധമായ ഭൗതികപ്രകാശമായി മാത്രം ചുരുക്കുന്ന ‘പ്രഭ’ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സ്വർഗീയ—ഭൗമിക’, ‘ഒരു തരത്തിലുള്ളത്—മറ്റൊരു തരത്തിലുള്ളത്’ എന്നീ സമാന്തരഘടനകൾ ഗ്രീക്കിലെ തുലിതാളം നിലനിർത്തുന്നു. അടിക്കുറിപ്പുസൂചിക പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
