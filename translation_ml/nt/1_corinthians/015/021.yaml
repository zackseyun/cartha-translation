  revised_text: ഒരു മനുഷ്യനിലൂടെ മരണം വന്നതുകൊണ്ടല്ലോ, ഒരു മനുഷ്യനിലൂടെ മരിച്ചവരുടെ ഉയിർത്തെഴുന്നേൽപ്പും വന്നത്.
