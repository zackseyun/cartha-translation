  text: ἐπειδὴ γὰρ δι’ ἀνθρώπου ⸀θάνατος, καὶ δι’ ἀνθρώπου ἀνάστασις νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/021.yaml
  text: For since death came through a man[b][a], the resurrection of the dead also came through a man.
translation:
  language: ml
  text: ഒരു മനുഷ്യനിലൂടെ മരണം വന്നതുകൊണ്ടല്ലോ, ഒരു മനുഷ്യനിലൂടെ മരിച്ചവരുടെ ഉയിർത്തെഴുന്നേൽപ്പും വന്നത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: എന്തെന്നാൽ ... വന്നതുകൊണ്ട്
  rationale: ἐπειδήയുടെ കാരണസൂചക സ്വഭാവവും γάρ നൽകുന്ന വിശദീകരണബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δι’ ἀνθρώπου
  choice: ഒരു മനുഷ്യനിലൂടെ
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മാധ്യമമോ പ്രവർത്തകത്വമോ സൂചിപ്പിക്കാം. അനാർത്ത്രസ് ഏകവചനവും ആദാം–മശീഹാ സമാന്തരവും നിലനിർത്താൻ ഒരേ പ്രയോഗം രണ്ടു ഖണ്ഡങ്ങളിലും ഉപയോഗിച്ചു.
- source_word: θάνατος
  choice: മരണം വന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ ഇല്ലെങ്കിലും മലയാളവാക്യത്തിന് ആവശ്യമായ ‘വന്നു’ ചേർത്തു; മരണം മനുഷ്യനിലൂടെ പ്രവേശിച്ചതെന്ന ആശയം ഇതിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἀνάστασις νεκρῶν
  choice: മരിച്ചവരുടെ ഉയിർത്തെഴുന്നേൽപ്പ്
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിലെ യഥാർഥമായ മരിച്ചവരുടെ പുനരുത്ഥാനത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്ന, മലയാളത്തിൽ പരിചിതവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: καὶ
  choice: -ഉം
  rationale: രണ്ടാമത്തെ ഖണ്ഡം ഒന്നാമത്തേതിനോട് സമാന്തരമാണെന്ന് മലയാളത്തിലെ സമുച്ചയപ്രത്യയം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആദാമും ക്രിസ്തുവും തമ്മിലുള്ള പ്രതിനിധിപരമായ വൈരുധ്യം
  choice: രണ്ടു ഖണ്ഡങ്ങളിലും ‘ഒരു മനുഷ്യനിലൂടെ’ എന്ന് നിലനിർത്തി; പേരുകൾ മുഖ്യവാചകത്തിൽ ചേർത്തില്ല.
  alternative: ‘ആദാമിലൂടെ ... ക്രിസ്തുവിലൂടെ’ അല്ലെങ്കിൽ ‘ഒരൊറ്റ മനുഷ്യനിലൂടെ ... ഒരൊറ്റ മനുഷ്യനിലൂടെ’
  rationale: ഈ വാക്യം പേരുകൾ പറയുന്നില്ലെങ്കിലും സമീപസന്ദർഭം രണ്ടു മനുഷ്യരെയും തിരിച്ചറിയിക്കുന്നു. മൂലപാഠത്തിന്റെ സംക്ഷിപ്തമായ സമാന്തരഘടനയും അർഥതലത്തിലെ ഉദ്ദേശ്യപൂർവമായ പരോക്ഷതയും ഇങ്ങനെ സംരക്ഷിക്കുന്നു.
- issue: ഉയിർത്തെഴുന്നേൽപ്പിന്റെ സ്വഭാവം
  choice: ‘മരിച്ചവരുടെ ഉയിർത്തെഴുന്നേൽപ്പ്’
  alternative: ‘മരണാനന്തരജീവിതം’ അല്ലെങ്കിൽ ‘ആത്മീയ ഉയിർപ്പ്’
  rationale: 1 കൊരിന്ത്യർ 15-ൽ വാദവിഷയം മരിച്ചവരുടെ യഥാർഥ ഉയിർത്തെഴുന്നേൽപ്പാണ്; അതിനെ അവ്യക്തമായ മരണാനന്തരജീവിതമാക്കി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉയിർത്തെഴുന്നേൽപ്പ്’ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ ബൈബിൾപദമായതിനാൽ നിലനിർത്തി; ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ സമാന്തരത പ്രകടമാക്കാൻ ‘ഒരു മനുഷ്യനിലൂടെ’ രണ്ടു പ്രാവശ്യം ആവർത്തിച്ചു.
