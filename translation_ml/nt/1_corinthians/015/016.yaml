id: 1CO.15.16
reference: 1 Corinthians 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: ml
  text: കാരണം, മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നില്ലെങ്കിൽ, മശീഹാ[a] പോലും ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തു.” ഗ്രീക്ക് പദവിയായ Χριστός എന്നത് “മശീഹാ” എന്നും ദീർഘകാല പാരമ്പര്യമനുസരിച്ച് “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: കാരണം, … ഇല്ലെങ്കിൽ
  rationale: εἰ എന്ന നിബന്ധനയും γάρ എന്ന വിശദീകരണാത്മക ബന്ധകവും പൗലോസിന്റെ വാദക്രമം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: νεκροὶ
  choice: മരിച്ചവർ
  rationale: നാമമായി പ്രവർത്തിക്കുന്ന ബഹുവചന വിശേഷണം മരിച്ച മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἐγείρονται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നില്ല
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും ഉയിർപ്പിക്കൽ മറ്റൊരാളുടെ പ്രവർത്തനമാണെന്ന വ്യാകരണസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐδὲ
  choice: പോലും … ഇല്ല
  rationale: നിബന്ധനയുടെ ശക്തമായ പരിണതഫലം വ്യക്തമാക്കുന്ന ‘not even’ എന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന പദവിയായി വായിക്കാവുന്നതിനാൽ അർത്ഥസുതാര്യമായ ‘മശീഹാ’ ഉപയോഗിക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: οὐκ ἐγήγερται
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല
  rationale: പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലവും സൂചിപ്പിക്കുന്ന perfect passive രൂപത്തിന്റെ കർമണിത്വവും ഫലാവസ്ഥയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള വാദത്തിൽ Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവിയുടെ അർത്ഥം പ്രസക്തമായതിനാൽ ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ നൽകുന്നു; ദീർഘകാല സഭാപാരമ്പര്യത്തിലെ രൂപം യഥാർത്ഥ പരിഭാഷാവികൽപമായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. കർമണിപ്രയോഗവും പൗലോസിന്റെ നിബന്ധനാപരമായ വാദത്തിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു.
