id: 1CO.15.2
reference: 1 Corinthians 15:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: ml
  text: അതിലൂടെ നിങ്ങളും രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നു[a], ഞാൻ നിങ്ങളോടു സുവാർത്തയായി അറിയിച്ച സന്ദേശം നിങ്ങൾ മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ[b]—നിങ്ങൾ വ്യർഥമായി വിശ്വസിച്ചതല്ലെങ്കിൽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ രക്ഷിക്കപ്പെടുന്നു.” ഗ്രീക്കിലെ വർത്തമാനകാലരൂപം തുടരുന്ന പ്രവൃത്തിയായോ കൂടുതൽ പൊതുവായ വർത്തമാനമായോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: “ഞാൻ നിങ്ങളോടു സുവാർത്ത അറിയിച്ച ഏതു വചനം/സന്ദേശമാണ് നിങ്ങൾ മുറുകെപ്പിടിക്കുന്നതെങ്കിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: അതിലൂടെയാണ്
  rationale: διά + genitive ഇവിടെ മാർഗമോ ഉപാധിയോ സൂചിപ്പിക്കുകയും മുൻവാക്യത്തിലെ സുവിശേഷത്തെ പരാമർശിക്കുകയും ചെയ്യുന്നു.
- source_word: σῴζεσθε
  choice: രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നത്
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ തുടരുന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; പൊതുവായ ‘രക്ഷിക്കപ്പെടുന്നു’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τίνι λόγῳ
  choice: സന്ദേശം
  rationale: λόγος ഇവിടെ പൗലോസ് അറിയിച്ച സുവാർത്തയുടെ ഉള്ളടക്കത്തെയോ രൂപത്തെയോ സൂചിപ്പിക്കുന്നു. വ്യവസ്ഥാവാക്യത്തോടു ചേർത്ത് ‘സന്ദേശം’ എന്നു നൽകുന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: εὐηγγελισάμην
  choice: സുവാർത്തയായി അറിയിച്ച
  rationale: ക്രിയയുടെ ‘നല്ല വാർത്ത അറിയിക്കുക’ എന്ന അർഥം സുതാര്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατέχετε
  choice: മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ
  rationale: തുടർന്നും ഉറച്ചുനിൽക്കുകയോ കൈവിടാതെ സൂക്ഷിക്കുകയോ ചെയ്യുന്ന അർഥവും യഥാർഥ വ്യവസ്ഥാരൂപവും നിലനിർത്തുന്നു.
- source_word: ἐκτὸς εἰ μὴ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവ്യവസ്ഥയ്ക്ക് അപവാദം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം ഈ വാക്യഘടനയിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰκῇ
  choice: വ്യർഥമായിപ്പോയി
  rationale: ഫലമില്ലാതെ, നിഷ്ഫലമായി എന്ന മുന്നറിയിപ്പ് സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπιστεύσατε
  choice: നിങ്ങൾ വിശ്വസിച്ചത്
  rationale: സുവാർത്ത സ്വീകരിച്ചപ്പോൾ നടന്ന വിശ്വാസപ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist രൂപം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: σῴζεσθε എന്നതിലെ രക്ഷയുടെ കാലഭാവം
  choice: തുടരുന്ന ഭാവമുള്ള ‘രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നത്’
  alternative: പൊതുവായ വർത്തമാനമായി ‘രക്ഷിക്കപ്പെടുന്നു’
  rationale: ഗ്രീക്ക് വർത്തമാനകാല കർമണി രൂപത്തിന്റെ തുടരുന്ന ഭാവം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; രക്ഷയെക്കുറിച്ചുള്ള ഒരു പൂർണമായ സിദ്ധാന്തക്രമം ഇതിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: εἰ κατέχετε എന്ന വ്യവസ്ഥ
  choice: ‘മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ’ എന്ന യഥാർഥ വ്യവസ്ഥ
  alternative: യഥാർഥ വിശ്വാസത്തിന്റെ തെളിവായി വിശദീകരിച്ച വ്യവസ്ഥ; സത്യമായി മുൻകൂട്ടി കരുതുന്ന അലങ്കാരപ്രയോഗം
  rationale: പൗലോസിന്റെ വ്യവസ്ഥാവാക്യം അതേപടി സൂക്ഷിച്ച് സ്ഥിരോത്സാഹത്തെയോ ഉറപ്പിനെയോ കുറിച്ചുള്ള വിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും മാന്യമായും രൂപപ്പെടുത്തി. ‘സുവാർത്തയായി അറിയിച്ച’ എന്നത് εὐηγγελισάμην എന്ന ക്രിയയുടെ സുവിശേഷാർഥം സുതാര്യമാക്കുന്നു. രക്ഷയുടെ തുടരുന്ന ഭാവവും വ്യവസ്ഥയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിശദീകരിച്ച് തീർക്കാതെ നിലനിർത്തി.
