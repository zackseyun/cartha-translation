revisions:
- from: അതിലൂടെയാണ് നിങ്ങളും രക്ഷിക്കപ്പെട്ടുകൊണ്ടിരിക്കുന്നത്[a]—ഞാൻ നിങ്ങളോടു സുവാർത്തയായി അറിയിച്ച സന്ദേശം നിങ്ങൾ മുറുകെപ്പിടിക്കുന്നുവെങ്കിൽ[b]; അല്ലെങ്കിൽ, നിങ്ങൾ വിശ്വസിച്ചത് വ്യർഥമായിപ്പോയി.
