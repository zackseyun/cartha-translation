  text: καὶ ὅτι ἐτάφη, καὶ ὅτι ἐγήγερται τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/004.yaml
  text: and that he was buried[a], and that he has been raised on the third day according to the Scriptures[b],
translation:
  language: ml
  text: അവൻ അടക്കം ചെയ്യപ്പെട്ടുവെന്നും, തിരുവെഴുത്തുകൾ പ്രകാരം മൂന്നാം ദിവസം അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു എന്നും[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'അഥവാ: “അവൻ ഉയിർപ്പിക്കപ്പെട്ടുവെന്നും.” ഗ്രീക്കിലെ പർഫെക്റ്റ് കാലരൂപം പുനരുത്ഥാനത്തിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രാധാന്യത്തിന് ഊന്നൽ നൽകാം.'
