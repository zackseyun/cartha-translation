    issue: Footnote [a] wrongly proposes attaching ‘according to the Scriptures’ to the burial clause.
    rationale: The Greek places κατὰ τὰς γραφάς after ‘on the third day’ and connects it most directly with ἐγήγερται. The proposed alternative is not supported by the syntax and creates a misleading reading. The [a] anchor and note should be removed.
  - severity: low
    issue: The main perfect-passive wording is slightly cumbersome.
    rationale: ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ more idiomatically expresses the Greek perfect passive than ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നുവെന്നും,’ without reducing the source meaning.
  revised_text: അവൻ അടക്കം ചെയ്യപ്പെട്ടുവെന്നും, തിരുവെഴുത്തുകൾ പ്രകാരം മൂന്നാം ദിവസം അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു എന്നും[b],
