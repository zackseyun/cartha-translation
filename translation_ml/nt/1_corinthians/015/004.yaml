lexical_decisions:
- source_word: ἐτάφη
  choice: അവൻ അടക്കപ്പെട്ടുവെന്നും
  rationale: θάπτω എന്ന ക്രിയയുടെ എയോറിസ്റ്റ് കർമണിപ്രയോഗം ലളിതമായും സ്വാഭാവികമായും നൽകുന്നു; ശവകുടീരത്തിന്റെ സ്വഭാവം പോലുള്ള മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- source_word: ἐγήγερται
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നുവെന്നും
  rationale: ἐγείρω എന്ന ക്രിയയുടെ പർഫെക്റ്റ് കർമണിപ്രയോഗം സൂചിപ്പിക്കുന്ന കഴിഞ്ഞ സംഭവവും അതിന്റെ നിലനിൽക്കുന്ന വർത്തമാന പ്രസക്തിയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; കർമണിരൂപവും സംരക്ഷിക്കുന്നു.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: മൂന്നാം ദിവസം
  rationale: കാലസൂചകമായ ദത്തിവ് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ശേഷം’ ചേർക്കുന്നില്ല.
- source_word: κατὰ τὰς γραφάς
  choice: തിരുവെഴുത്തുകൾക്കനുസരിച്ച്
  rationale: തിരുവെഴുത്തുകളുടെ സാക്ഷ്യത്തോടുള്ള പൊരുത്തമോ നിവൃത്തിയോ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: γραϕάς
  choice: തിരുവെഴുത്തുകൾ
  rationale: പൊതുവായ എഴുത്തുകളെയല്ല, അംഗീകരിക്കപ്പെട്ട വിശുദ്ധലിഖിതങ്ങളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്.
- source_word: ὅτι
  choice: എന്നും
  rationale: വിശ്വാസപ്രഖ്യാപനപരമായ ഉള്ളടക്കവാക്യങ്ങളുടെ ആവർത്തിത ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: —
  rationale: വാക്യഭാഗങ്ങളെ ബന്ധിപ്പിക്കുന്ന ആവർത്തിത καὶ മലയാളത്തിലെ ‘എന്നും’ എന്ന സമാന്തരഘടനയിലും വിരാമചിഹ്നത്തിലും ഉൾക്കൊള്ളുന്നു; പ്രത്യേക ‘കൂടാതെ’ ചേർക്കുന്നത് അസ്വാഭാവികമാകും.
theological_decisions:
- issue: പുനരുത്ഥാനക്രിയയുടെ കാലഭാവവും കർമണിപ്രയോഗവും
  choice: അവൻ ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നുവെന്നും
  alternative: അവൻ ഉയിർപ്പിക്കപ്പെട്ടുവെന്നും
  rationale: ഗ്രീക്കിലെ പർഫെക്റ്റ് കർമണിരൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും ഒരുമിച്ച് മുന്നോട്ടുവയ്ക്കുന്നു. മുഖ്യവിവർത്തനം ഈ സംഘർഷം നിലനിർത്തുന്നു; കൂടുതൽ സ്വാഭാവികമായ ലളിതഭൂതകാലരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘തിരുവെഴുത്തുകൾ’ എന്നതിന്റെ സൂചന
  choice: തിരുവെഴുത്തുകൾ
  alternative: വിശുദ്ധലിഖിതങ്ങൾ
  rationale: പൗലോസ് തിരിച്ചറിയപ്പെട്ട തിരുവെഴുത്തുസമാഹാരത്തെ സൂചിപ്പിക്കുന്നു; ‘യഹൂദ തിരുവെഴുത്തുകൾ’ എന്നു വികസിപ്പിക്കുന്നത് മൂലപാഠത്തിൽ ഇല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
- issue: κατὰ τὰς γραφάς എന്ന പദസമുച്ചയത്തിന്റെ ബന്ധം
  choice: പുനരുത്ഥാനപ്രസ്താവനയോടു ചേർത്തിരിക്കുന്നു
  alternative: അടക്കപ്പെട്ടതിനെക്കുറിച്ചുള്ള പ്രസ്താവനയോടു ചേർത്ത് വായിക്കുക
  rationale: ഗ്രീക്കിൽ ഈ പദസമുച്ചയം ‘മൂന്നാം ദിവസം ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നതിന് ഉടൻ പിന്നാലെയായതിനാൽ അതോടുള്ള ബന്ധമാണ് ഏറ്റവും സ്വാഭാവികം. നൽകിയിരിക്കുന്ന പര്യായവായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മുമ്പത്തെ വാക്യത്തിൽ ആരംഭിച്ച വിശ്വാസപ്രഖ്യാപനപ്പട്ടികയുടെ തുടർച്ചയായതിനാൽ വാക്യഭാഗം കോമയിൽ അവസാനിപ്പിച്ചിരിക്കുന്നു. ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നുവെന്നും’ അല്പം ഔപചാരികമായെങ്കിലും ഗ്രീക്ക് പർഫെക്റ്റിന്റെയും കർമണിരൂപത്തിന്റെയും സംയുക്തബലം നിലനിർത്താൻ തെരഞ്ഞെടുത്തു.
