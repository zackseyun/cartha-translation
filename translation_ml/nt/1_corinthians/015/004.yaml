  verdict: revise
  source_fidelity: 'The main clause sequence is substantially faithful: ἐτάφη is correctly rendered as burial, and ἐγήγερται is appropriately represented with a Malayalam perfect passive. However, footnote [a] introduces an unsupported syntactic alternative. κατὰ τὰς γραφάς occurs with, and most naturally qualifies, the resurrection statement—not the burial statement.'
  naturalness: ‘അടക്കം ചെയ്യപ്പെട്ടുവെന്നും’ and ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ are clear, modern-standard Malayalam. The latter is a more natural perfect-passive form than ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നുവെന്നും’ while retaining the completed event and its present relevance.
  terminology: ‘തിരുവെഴുത്തുകൾ’ suitably renders γραφάς in this Pauline context. ‘തിരുവെഴുത്തുകൾ പ്രകാരം’ is a natural, formal equivalent of κατὰ τὰς γραφάς. The resurrection is kept in passive voice, without adding an explicit agent.
  issues:
