id: 1CO.15.38
reference: 1 Corinthians 15:38
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: ml
  text: എന്നാൽ ദൈവം താൻ ഇച്ഛിച്ചതുപോലെ അതിന് ഒരു ശരീരം നൽകുന്നു; വിത്തുകളിൽ ഓരോന്നിനും അതിന്റേതായ ശരീരവും നൽകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ഓരോ വിത്തിനും അതിന്റേതായ ശരീരം.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “വിത്തുകളിൽ ഓരോന്നിനും” എന്നാണ്; ഇത് വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: അതിന് ഒരു ശരീരം നൽകുന്നു
  rationale: വർത്തമാനകാലത്തിലെ ‘നൽകുന്നു’ ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ദത്തിവിലുള്ള αὐτῷ മുൻസന്ദർഭത്തിലെ വിത്തിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അതിന്’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: σῶμα
  choice: ശരീരം
  rationale: അധ്യായത്തിലുടനീളമുള്ള σῶμα എന്ന പദത്തിന്റെ ബന്ധം കാത്തുസൂക്ഷിക്കുന്ന സാധാരണവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: καθὼς ἠθέλησεν
  choice: താൻ ഇച്ഛിച്ചതുപോലെ
  rationale: ദൈവത്തിന്റെ ഇച്ഛയെയും നിർണയത്തെയും വ്യക്തമാക്കുന്നു; ‘തിരഞ്ഞെടുത്തതുപോലെ’ എന്ന വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: വിത്തുകളിൽ ഓരോന്നിനും
  rationale: ἑκάστῳ സഹിതമുള്ള ഭാഗിക ജനിറ്റീവിന്റെ വിതരണാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ഓരോ ഇനം വിത്തിനും’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἴδιον
  choice: അതിന്റേതായ
  rationale: ഓരോ വിത്തിനും പ്രത്യേകമായി ചേരുന്നതോ അതിനു സ്വന്തമായതോ ആയ ശരീരം എന്ന വ്യക്തിവത്കരണബലം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിത്ത്–ശരീരം ഉപമയിലെ ദൈവിക പ്രവർത്തനവും ഇച്ഛയും
  choice: ഓരോ വിത്തിനും ശരീരം നൽകുന്നത് ദൈവമാണെന്നും അത് അവന്റെ ഇച്ഛപ്രകാരമാണെന്നും പാഠം നേരിട്ട് പറയുന്നു.
  alternative: ശരീരത്തിന്റെ ‘ഇനം’ അല്ലെങ്കിൽ ‘വർഗം’ ദൈവം നിശ്ചയിക്കുന്നു എന്ന് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പറയാം.
  rationale: പൗലോസ് ഊന്നിപ്പറയുന്ന ദൈവിക പ്രവർത്തനവും വ്യത്യസ്ത ശരീരങ്ങളും സംരക്ഷിക്കുമ്പോൾ, മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത സസ്യവർഗപരമായ ആശയം ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘വിത്തുകളിൽ ഓരോന്നിനും’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ ഘടനയും യഥാർഥമായ വിതരണസാധ്യതയും നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് സ്വാഭാവികമായ മറ്റൊരു മലയാളരൂപം നൽകുന്നു.
