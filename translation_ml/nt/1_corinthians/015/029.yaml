reference: 1 Corinthians 15:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: ml
  text: അങ്ങനെയല്ലെങ്കിൽ[a], മരിച്ചവർക്കുവേണ്ടി സ്നാനം ഏൽക്കുന്നവർ എന്തു ചെയ്യും? മരിച്ചവർ ഒരിക്കലും ഉയിർപ്പിക്കപ്പെടുന്നില്ലെങ്കിൽ, പിന്നെ എന്തിനാണ് അവർ മരിച്ചവർക്കുവേണ്ടി സ്നാനം ഏൽക്കുന്നത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മരിച്ചവർക്കായി,’ ‘മരിച്ചവർ നിമിത്തം,’ അല്ലെങ്കിൽ—സാധ്യത കുറവാണെങ്കിലും—‘മരിച്ചവരുടെ മീതെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് മുൻവിനിയോഗപദം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം; പൗലോസ് പരാമർശിക്കുന്ന കൃത്യമായ ആചാരം എന്തായിരുന്നുവെന്നത് അനിശ്ചിതമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള അനന്തരഫലം അവതരിപ്പിക്കുന്ന വാദാത്മക സംക്രമണം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τί ποιήσουσιν
  choice: എന്തു ചെയ്യും
  rationale: ποιέω എന്നതിന്റെ വിശാലവും തുറന്നതുമായ അർഥം നിലനിർത്തി വാചകത്തിന്റെ അലങ്കാരപ്രശ്നസ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: οἱ βαπτιζόμενοι
  choice: സ്നാനം ഏൽക്കുന്നവർ
  rationale: വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപം തുടരുന്നതോ പതിവായതോ ആയ ഒരു പ്രവൃത്തിയായി നൽകുന്നു; അതിന്റെ സാധുതയെക്കുറിച്ച് വിധി പറയുന്നില്ല.
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: മരിച്ചവർക്കുവേണ്ടി
  rationale: ജനിറ്റീവിനോടുകൂടിയ ὑπέρ എന്നതിന്റെ സാധാരണ അർഥമായ ‘വേണ്ടി’ നിലനിർത്തുന്നു; കൃത്യമായ പ്രതിനിധിത്വമോ ആചാരമോ നിർണ്ണയിക്കാതെ അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: εἰ ὅλως
  choice: ഒരിക്കലും ... ഇല്ലെങ്കിൽ
  rationale: ὅλως നൽകുന്ന ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: മരിച്ചവർ ... ഉയിർപ്പിക്കപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ കർമണി രൂപം സംരക്ഷിച്ച് ഉയിർപ്പിക്കുന്ന കർത്താവിനെ വാചകത്തിൽ അനാവശ്യമായി വ്യക്തമാക്കാതിരിക്കുന്നു.
- source_word: τί καὶ
  choice: പിന്നെ എന്തിനാണ്
  rationale: അക്ഷരാർഥമായ ‘എന്തും’ എന്നതിനുപകരം വാദത്തിന്റെ അലങ്കാരപ്രശ്നവും അനന്തരഫലവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: βαπτίζονται
  choice: സ്നാനം ഏൽക്കുന്നത്
  rationale: വർത്തമാനകാല കർമണി ആശയം ആദ്യപ്രയോഗവുമായി ഒത്തിണക്കി മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ὑπὲρ αὐτῶν
  choice: മരിച്ചവർക്കുവേണ്ടി
  rationale: αὐτῶν സൂചിപ്പിക്കുന്നത് മരിച്ചവരെയാണെന്ന് വ്യക്തതയ്ക്കായി ആവർത്തിക്കുന്നു; ആദ്യത്തെ ὑπέρ പ്രയോഗത്തോടുള്ള സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘മരിച്ചവർക്കുവേണ്ടിയുള്ള’ സ്നാനത്തിന്റെ അർഥം
  choice: ‘മരിച്ചവർക്കുവേണ്ടി സ്നാനം ഏൽക്കുന്നവർ’ എന്ന കുറഞ്ഞ വ്യാഖ്യാനമുള്ള രൂപം നിലനിർത്തുന്നു.
  alternative: മരിച്ചവർ നിമിത്തം സ്നാനം ഏൽക്കുന്നവർ; മരിച്ചവരുടെ മീതെ സ്നാനം ഏൽക്കുന്നവർ
  rationale: പരാമർശിക്കപ്പെടുന്ന ആചാരത്തിന്റെ കൃത്യസ്വഭാവം അനിശ്ചിതമാണ്. ഒരു പ്രത്യേക ചരിത്രാചാരമോ സഭാവിഭാഗപരമായ ഉപദേശമോ അംഗീകരിക്കാതെ, പൗലോസിന്റെ ഉയിർപ്പിനെക്കുറിച്ചുള്ള വാദത്തിലെ യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സ്നാനം ഏൽക്കുക’ എന്ന പ്രചാരത്തിലുള്ള പ്രയോഗവും കർമണി ഉയിർപ്പുഭാഷയും ഉപയോഗിച്ചു. അവ്യക്തമായ ὑπέρ ബന്ധം മുഖ്യവാചകത്തിൽ നിർണ്ണയിച്ചുതീർക്കാതെ അടിക്കുറിപ്പിൽ പകരങ്ങൾ നൽകിയിരിക്കുന്നു.
