  verdict: revise
  source_fidelity: The supplied ‘ശരീരം’ is defensible from the immediate resurrection-body context, and the clothing metaphor is retained. However, γάρ (‘for’) should not be omitted in this formally equivalent rendering. ‘അനശ്വരത’ can blur the distinct contrast between decay/perishability (φθαρτός/ἀφθαρσία) and mortality/death (θνητός/ἀθανασία); ‘അക്ഷയത്വം’ more specifically represents ἀφθαρσία.
  naturalness: ‘ധരിക്കണം’ is natural Malayalam and preserves the metaphor. Repeating it in the parallel clauses makes the coordination and necessity clear. ‘കാരണം’ naturally carries the explanatory force at the beginning of this stand-alone verse.
  terminology: Use ‘നശ്വരമായ’/‘അക്ഷയത്വം’ for the perishability–imperishability pair and ‘മർത്യമായ’/‘അമരത്വം’ for the mortality–immortality pair. This retains Paul’s two distinct, parallel contrasts.
  issues:
  - severity: medium
    issue: The explanatory conjunction γάρ is untranslated.
    rationale: The source begins with γὰρ, connecting this statement as an explanation of the preceding verse. Malayalam ‘കാരണം’ preserves that connection without undue stiffness.
  - severity: medium
    issue: ‘അനശ്വരത’ weakens the lexical distinction from ‘അമരത്വം.’
    rationale: ἀφθαρσία concerns freedom from decay or destruction, whereas ἀθανασία concerns freedom from death. ‘അക്ഷയത്വം’ more clearly conveys the former and maintains the paired distinction.
  revised_text: കാരണം, ഈ നശ്വരമായ ശരീരം അക്ഷയത്വം ധരിക്കണം; ഈ മർത്യമായ ശരീരം അമരത്വം ധരിക്കണം.[a]
