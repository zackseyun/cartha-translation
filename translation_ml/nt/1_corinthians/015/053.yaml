id: 1CO.15.53
reference: 1 Corinthians 15:53
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/053.yaml
  text: For this perishable body must put on imperishability[a], and this mortal body must put on immortality.
translation:
  language: ml
  text: കാരണം, ഈ നശ്വരമായ ശരീരം അക്ഷയത്വം ധരിക്കണം; ഈ മർത്യമായ ശരീരം അമരത്വം ധരിക്കണം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ഈ നശ്വരമായത് അക്ഷയത്വം ധരിക്കണം; ഈ മർത്യമായത് അമരത്വം ധരിക്കണം.” ഈ വാക്യത്തിലെ ഗ്രീക്കിൽ ‘ശരീരം’ എന്ന പദം വ്യക്തമായി ഇല്ലെങ്കിലും, സന്ദർഭം ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: വേണം
  rationale: പുനരുത്ഥാനത്തിൽ സംഭവിക്കേണ്ട അനിവാര്യമായ രൂപാന്തരത്തെ സ്വാഭാവികവും ശക്തവുമായി അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: —
  rationale: ഗ്രീക്കിൽ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല; വാക്യത്തിന്റെ നിർബന്ധാത്മക ഘടന ആ ബന്ധം വഹിക്കുന്നു.
- source_word: τὸ φθαρτὸν τοῦτο
  choice: ഈ നശ്വരമായ ശരീരം
  rationale: φθαρτός ജീർണതയ്ക്കും നാശത്തിനും വിധേയമായതിനെ സൂചിപ്പിക്കുന്നു. ശരീരത്തെക്കുറിച്ചുള്ള സമീപസന്ദർഭം വ്യക്തമാക്കാൻ ഗ്രീക്കിൽ പരോക്ഷമായിരിക്കുന്ന ‘ശരീരം’ ചേർത്തു.
- source_word: ἐνδύσασθαι
  choice: ധരിക്കുക
  rationale: വസ്ത്രം ധരിക്കുന്ന രൂപകം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἀφθαρσίαν
  choice: അനശ്വരത
  rationale: നശ്വരതയ്ക്ക് വിരുദ്ധമായ, ജീർണതയോ നാശമോ ഇല്ലാത്ത അവസ്ഥയെ സംക്ഷിപ്തമായി വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: കയും … കയും
  rationale: സമാന്തരമായ രണ്ടു ഘടകങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായി ഏകോപിപ്പിക്കുന്നു.
- source_word: τὸ θνητὸν τοῦτο
  choice: ഈ മർത്യമായ ശരീരം
  rationale: θνητός മരണത്തിന് വിധേയമായതിനെ സൂചിപ്പിക്കുന്നു; സമീപസന്ദർഭത്തെ അടിസ്ഥാനമാക്കി ‘ശരീരം’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: ἀθανασίαν
  choice: അമരത്വം
  rationale: മരണത്തിന് വിധേയമല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്ന സാധാരണവും കൃത്യവുമായ മലയാളപദം.
theological_decisions:
- issue: ഈ വാക്യത്തിൽ σώμα ഇല്ലെങ്കിലും ‘ശരീരം’ ചേർക്കുന്നത്
  choice: രണ്ടു സമാന്തര ഘടകങ്ങളിലും ‘ശരീരം’ വ്യക്തമാക്കി
  alternative: “ഈ നശ്വരമായത് അനശ്വരത ധരിക്കുകയും ഈ മർത്യമായത് അമരത്വം ധരിക്കുകയും വേണം”
  rationale: 1 കൊരിന്ത്യർ 15:42–54-ലെ അടുത്ത സന്ദർഭം ശരീരത്തിന്റെ പുനരുത്ഥാനവും രൂപാന്തരവും സംബന്ധിച്ചതാണ്. അതിനാൽ ‘ശരീരം’ ചേർക്കുന്നത് പുതിയ ദൈവശാസ്ത്രവാദം ഇറക്കുമതി ചെയ്യാതെ പരോക്ഷമായ സൂചന വ്യക്തമാക്കുന്നു; ഗ്രീക്കിന്റെ കൂടുതൽ ഔപചാരിക രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്.
- issue: φθαρτός/ἀφθαρσίαയും θνητός/ἀθανασίαയും തമ്മിലുള്ള വ്യത്യാസം
  choice: നശ്വരം/അനശ്വരത; മർത്യം/അമരത്വം എന്ന രണ്ടു വ്യത്യസ്ത വിരുദ്ധജോടികൾ നിലനിർത്തി
  alternative: രണ്ടിടത്തും ‘നാശം/നാശമില്ലായ്മ’ പോലുള്ള ഏകീകരിച്ച പദാവലി
  rationale: ആദ്യ ജോടി ജീർണതയ്ക്കും നാശത്തിനും വിധേയമായ അവസ്ഥയെയും രണ്ടാം ജോടി മരണത്തിന് വിധേയമായ അവസ്ഥയെയും ഊന്നുന്നു; പൗലോസിന്റെ സമാന്തരതയും സൂക്ഷ്മവ്യത്യാസവും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ധരിക്കുക’ എന്ന പദം വസ്ത്രരൂപകം നിലനിർത്തുന്നു. വായനാസൗകര്യത്തിനായി ‘ശരീരം’ മുഖ്യപാഠത്തിൽ ചേർത്ത്, മൂലത്തിന്റെ കൂടുതൽ ഔപചാരിക ഘടന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
