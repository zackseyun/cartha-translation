  text: ἔσχατον δὲ πάντων ὡσπερεὶ τῷ ἐκτρώματι ὤφθη κἀμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/008.yaml
  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: ml
  text: എല്ലാവരിലും ഒടുവിൽ, അകാലത്തിൽ ജനിച്ച ഒരുവനെന്നപോലെ എനിക്കും അവൻ പ്രത്യക്ഷനായി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഗർഭം അലസിപ്പോയ ഭ്രൂണത്തെപ്പോലെ” അല്ലെങ്കിൽ “ഗർഭച്ഛിദ്രത്തിലൂടെ പുറത്താക്കപ്പെട്ട ഭ്രൂണത്തെപ്പോലെ.” പൗലൊസ് ഇവിടെ കടുത്ത, ആത്മതാഴ്മ പ്രകടമാക്കുന്ന ഒരു ഉപമയാണ് ഉപയോഗിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: എല്ലാവർക്കും ഒടുവിൽ
  rationale: മുമ്പ് പറഞ്ഞ സാക്ഷികളുടെ നിരയിലെ കാലക്രമപരമായ അവസാനത്തെ പ്രത്യക്ഷതയാണെന്ന് സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; δέ ഇവിടെ ശക്തമായ വൈരുധ്യത്തേക്കാൾ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ὡσπερεὶ
  choice: പോലെയുള്ള
  rationale: ഏകദേശമായ ഉപമയുടെ സ്വഭാവം നിലനിർത്തുന്നു; അതിനെ അക്ഷരാർഥത്തിലുള്ള തിരിച്ചറിയലായി കടുപ്പിക്കുന്നില്ല.
- source_word: τῷ ἐκτρώματι
  choice: അകാലത്തിൽ പിറന്നവനെപ്പോലെയുള്ള എനിക്ക്
  rationale: ἔκτρωμα എന്ന പദത്തിലെ അസാധാരണ ജനനവും ആത്മതാഴ്മയും വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു. കൂടുതൽ അക്ഷരാർഥപരവും ഞെട്ടിക്കുന്നതുമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὤφθη
  choice: അവൻ പ്രത്യക്ഷനായി
  rationale: ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തുവിന്റെ ദൃശ്യപ്രത്യക്ഷതകളുടെ ഈ സന്ദർഭത്തിൽ ഗ്രീക്ക് പാസീവ് രൂപത്തിന്റെ അംഗീകൃത സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: κἀμοί
  choice: എനിക്കും
  rationale: καί + ἐμοί എന്ന സംയുക്തരൂപത്തിന്റെ കൂട്ടിച്ചേർക്കൽഭാവം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ ആത്മതാഴ്മ നിറഞ്ഞ ἐκτρώματι എന്ന സ്വയംവിവരണം
  choice: പ്രധാനപാഠത്തിൽ “അകാലത്തിൽ പിറന്നവനെപ്പോലെയുള്ള” എന്ന് നൽകി, കൂടുതൽ അക്ഷരാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: “ഗർഭം അലസിപ്പോയ ശിശുവിനെപ്പോലെയുള്ള” അല്ലെങ്കിൽ “ഗർഭച്ഛിദ്രം ചെയ്യപ്പെട്ടവനെപ്പോലെയുള്ള”
  rationale: പൗലൊസിന്റെ ഉപമയിലെ അസാധാരണതയും കഠിനമായ ആത്മതാഴ്മയും സംരക്ഷിക്കുമ്പോൾ, അത് അദ്ദേഹത്തിന്റെ അപ്പൊസ്തലത്വത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. “അകാലത്തിൽ പിറന്നവൻ” വായനാസൗകര്യം നൽകുന്നു; മൂലത്തിലെ കടുത്ത രൂപകം അടിക്കുറിപ്പിലൂടെ മറച്ചുവയ്ക്കാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
