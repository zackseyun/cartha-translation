  to: എന്നാൽ ദൈവത്തിന്റെ കൃപയാൽ ഞാൻ എന്താണോ അതാണ്. എന്നോടുള്ള അവന്റെ കൃപ ഫലശൂന്യമായില്ല[a]. മറിച്ച്, അവരെല്ലാവരെക്കാളും അധികം ഞാൻ അധ്വാനിച്ചു—എങ്കിലും, ഞാനല്ല, എന്നോടൊപ്പമുള്ള ദൈവത്തിന്റെ കൃപയാണ്.
