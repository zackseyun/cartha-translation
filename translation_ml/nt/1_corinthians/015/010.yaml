reference: 1 Corinthians 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: ml
  text: എന്നാൽ ദൈവത്തിന്റെ കൃപയാൽ ഞാൻ എന്താണോ അതാണ്. എന്നോടുള്ള അവന്റെ കൃപ ഫലശൂന്യമായില്ല[a]. മറിച്ച്, അവരെല്ലാവരെക്കാളും അധികം ഞാൻ അധ്വാനിച്ചു—എങ്കിലും, ഞാനല്ല, എന്നോടൊപ്പമുള്ള ദൈവത്തിന്റെ കൃപയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ശൂന്യമായിത്തീർന്നില്ല’ അല്ലെങ്കിൽ ‘വ്യർഥമായില്ല.’'
    reason: κενή എന്ന പദത്തിന് ‘ശൂന്യമായത്,’ ‘ഫലമില്ലാത്തത്,’ ‘വ്യർഥമായത്’ എന്നീ പരസ്പരം ബന്ധപ്പെട്ട അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: എന്നാൽ ദൈവത്തിന്റെ കൃപയാൽ
  rationale: χάριτι എന്ന ദത്തിവ് കൃപയെ പ്രവർത്തനകാരണമോ ഉപാധിയോ ആയി അവതരിപ്പിക്കുന്നു; അതിനാൽ ‘കൃപയാൽ’ എന്നു നൽകി. δέ മുൻസന്ദർഭത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἰμι ὅ εἰμι
  choice: ഞാൻ എന്തായിരിക്കുന്നുവോ അതായിരിക്കുന്നു
  rationale: പൗലൊസിന്റെ ഇപ്പോഴത്തെ നിലയും വ്യക്തിത്വവും ദൈവകൃപയാൽ രൂപപ്പെട്ടതാണെന്ന ആശയം വ്യക്തമാക്കിക്കൊണ്ട് ഗ്രീക്കിലെ ആവർത്തനഘടന കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: എന്നോടുള്ള അവന്റെ കൃപ
  rationale: εἰς എന്നതിന്റെ പൗലൊസിലേക്കുള്ള ദിശാബോധം ‘എന്നോടുള്ള’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: οὐ κενὴ ἐγενήθη
  choice: ഫലശൂന്യമായില്ല
  rationale: κενός ഇവിടെ ‘ഒഴിഞ്ഞത്’ എന്ന രൂപകത്തോടൊപ്പം ഫലമില്ലാത്തത്, വ്യർഥമായത് എന്നീ അർഥങ്ങളും വഹിക്കുന്നു. ‘ഫലശൂന്യമായില്ല’ കൃപയുടെ ഫലപ്രാപ്തിയെ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: മറിച്ച്, അവരെല്ലാവരെക്കാളും അധികം ഞാൻ അധ്വാനിച്ചു
  rationale: κοπιάω സൂചിപ്പിക്കുന്ന കഠിനവും ക്ഷീണകരവുമായ പ്രയത്നം ‘അധ്വാനിച്ചു’ എന്നതിൽ നിലനിൽക്കുന്നു; ἀλλάയുടെ ശക്തമായ വൈരുധ്യം ‘മറിച്ച്’ നൽകുന്നു.
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: എങ്കിലും ഞാനല്ല, ... ദൈവത്തിന്റെ കൃപയാണ്
  rationale: പൗലൊസിന്റെ യഥാർഥ അധ്വാനത്തെ നിഷേധിക്കാതെ അതിന്റെ നിർണായക പ്രവർത്തകശക്തിയായി ദൈവകൃപയെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: ἡ σὺν ἐμοί
  choice: എന്നോടുകൂടെയുള്ള
  rationale: σύν എന്നതിന്റെ ‘കൂടെ’ എന്ന അർഥം നേരിട്ട് നിലനിർത്തുകയും ഈ വാക്യഭാഗം ‘ദൈവത്തിന്റെ കൃപ’യെ വിശേഷിപ്പിക്കുന്നതാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ അധ്വാനവും ദൈവകൃപയുടെ പ്രവർത്തനവും തമ്മിലുള്ള ബന്ധം
  choice: പൗലൊസ് യഥാർഥത്തിൽ അധ്വാനിച്ചുവെന്നും അതേസമയം ആ അധ്വാനത്തിന്റെ നിർണായക പ്രവർത്തകശക്തി ദൈവകൃപയാണെന്നും വാക്യം ഒരുമിച്ച് ഉറപ്പിക്കുന്നു.
  alternative: ഇതിനെ ‘ദൈവവും പൗലൊസും ചേർന്ന് പ്രവർത്തിച്ചു’ എന്നു വ്യാഖ്യാനിക്കുകയോ പൗലൊസിന്റെ അധ്വാനത്തെ അപ്രധാനമാക്കുന്ന വിധത്തിൽ ദൈവപ്രവർത്തനം മാത്രം ഊന്നുകയോ ചെയ്യാം.
  rationale: ‘ഞാൻ അധ്വാനിച്ചു’ എന്നും ‘എങ്കിലും ഞാനല്ല, ... ദൈവത്തിന്റെ കൃപയാണ്’ എന്നും ഗ്രീക്ക് പാഠം ഒരുപോലെ പറയുന്നു. അതിനാൽ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഒരു പിൽക്കാല വ്യവസ്ഥയ്ക്കനുസരിച്ച് പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച മാന്യമായ ശൈലി ഉപയോഗിച്ചു. ‘കൃപ,’ ‘അധ്വാനിച്ചു’ തുടങ്ങിയ സ്ഥാപിതവും സ്വാഭാവികവുമായ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ഊന്നലും വൈരുധ്യവും ദീർഘവാക്യത്തിന്റെ പ്രവാഹവും സംരക്ഷിച്ചു.
