source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: ml
  text: സൂര്യന് ഒരു മഹത്ത്വമുണ്ട്[a], ചന്ദ്രന് മറ്റൊരു മഹത്ത്വമുണ്ട്, നക്ഷത്രങ്ങൾക്ക് വേറൊരു മഹത്ത്വമുണ്ട്; എന്തെന്നാൽ, ഒരു നക്ഷത്രം മറ്റൊരു നക്ഷത്രത്തിൽനിന്ന് മഹത്ത്വത്തിൽ വ്യത്യസ്തമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യത്തിലുടനീളം ‘തേജസ്സ്’ എന്നോ ‘പ്രകാശം’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് പദമായ δόξα ദൃശ്യമായ പ്രഭയെ സൂചിപ്പിക്കാം; എന്നാൽ ‘മഹത്ത്വം’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് ചുറ്റുമുള്ള പൗലൊസിന്റെ വാദത്തിൽ ആവർത്തിക്കുന്ന പദം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλη
  choice: ഒരു ... മറ്റൊരു ... വേറൊരു
  rationale: ആകാശഗോളങ്ങളുടെ മഹത്ത്വങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ആവർത്തനത്തിലൂടെ വ്യക്തമാക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായ താരതമ്യക്രമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: സന്ദർഭത്തിൽ ദൃശ്യമായ തേജസ്സും പ്രഭയും ഉൾക്കൊള്ളുമ്പോഴും, പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള ചുറ്റുപാടിലെ വാദവുമായി ബന്ധിപ്പിക്കുന്ന പൗലോസിന്റെ ആവർത്തിച്ച പദം സംരക്ഷിക്കുന്നു.
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: സൂര്യന് / ചന്ദ്രന് / നക്ഷത്രങ്ങൾക്ക്
  rationale: δόξαയോട് ആശ്രിതമായ ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയെ മലയാളത്തിലെ സ്വാഭാവിക ഉടമസ്ഥതാ-അർത്ഥമുള്ള ദത്തിവിഭക്തി ഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀστὴρ ... ἀστέρος
  choice: ഒരു നക്ഷത്രം മറ്റൊരു നക്ഷത്രത്തിൽനിന്ന്
  rationale: ഒരേ വിഭാഗത്തിനുള്ളിലെ വ്യത്യാസമാണ് താരതമ്യം ചെയ്യുന്നതെന്ന ഏകവചന-ഏകവചന ഘടന നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: (അർദ്ധവിരാമത്തിനു ശേഷമുള്ള വിശദീകരണബന്ധം)
  rationale: ഗ്രീക്കിൽ ഇത് മുൻവാക്യത്തിന്റെ വിശദീകരണമാണ്. മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ അർദ്ധവിരാമവും വാക്യക്രമവും ആ ബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διαφέρει
  choice: വ്യത്യാസപ്പെട്ടിരിക്കുന്നു
  rationale: മേന്മയോ ശ്രേഷ്ഠതയോ നിർബന്ധമായി ആരോപിക്കാതെ വ്യത്യാസം എന്ന അടിസ്ഥാന അർത്ഥം നൽകുന്നു.
- source_word: ἐν δόξῃ
  choice: മഹത്ത്വത്തിൽ
  rationale: വ്യത്യാസം ഏതു കാര്യത്തിലാണെന്ന് വ്യക്തമാക്കുകയും δόξαയുടെ ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനവാദത്തിലെ ആകാശഗോളങ്ങളുടെ ഉപമയിൽ δόξαയുടെ പരിഭാഷ
  choice: മഹത്ത്വം
  alternative: തേജസ്സ് / പ്രകാശം
  rationale: ഉടൻപ്രസക്തമായ അർത്ഥത്തിൽ ആകാശഗോളങ്ങളുടെ ദൃശ്യപ്രഭ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, പുനരുത്ഥാനശരീരങ്ങളെക്കുറിച്ചുള്ള വിശാലമായ വാദത്തിലെ പദബന്ധം നഷ്ടപ്പെടുത്താതിരിക്കാൻ ‘മഹത്ത്വം’ ഉപയോഗിച്ചു; ദൃശ്യപ്രഭയുടെ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ വചനത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ ആവർത്തനവും ഉപമയുടെ ദൈവശാസ്ത്രബന്ധവും കഴിയുന്നത്ര നിലനിർത്തി; മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി ആദ്യ മൂന്ന് ഘടകങ്ങളിൽ ദത്തിവിഭക്തി പ്രയോഗിച്ചു.
