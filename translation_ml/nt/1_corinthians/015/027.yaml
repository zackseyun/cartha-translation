id: 1CO.15.27
reference: 1 Corinthians 15:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: ml
  text: കാരണം, “അവൻ സകലവും അവന്റെ കാൽക്കീഴിലാക്കി.” എന്നാൽ, “സകലവും കീഴ്പ്പെടുത്തപ്പെട്ടിരിക്കുന്നു” എന്നു പറയുമ്പോൾ[a], സകലവും അവനു കീഴ്പ്പെടുത്തിയവൻ അതിൽ ഉൾപ്പെടുന്നില്ലെന്നത് വ്യക്തമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സകലവും അവനു കീഴ്പ്പെടുത്തിയവനെ ഒഴികെ.”
    reason: ἐκτὸς എന്ന ഒഴിവാക്കൽപ്രയോഗത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള ബദൽ. സകലവും അവനു കീഴ്പ്പെടുത്തിയവൻ ‘സകലവും’ എന്ന പരിധിയിൽ ഉൾപ്പെടുന്നില്ല എന്ന അർഥം ഇതും നൽകുന്നു.
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: സകലവും
  rationale: നപുംസകലിംഗ ബഹുവചനം മനുഷ്യരെ മാത്രം അല്ല, സമഗ്രമായി എല്ലാറ്റിനെയും സൂചിപ്പിക്കുന്നു. ‘സകലവും’ എന്നത് ഈ വ്യാപ്തിയും സങ്കീർത്തനം 8-ന്റെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു.
- source_word: ὑπέταξεν
  choice: കാൽക്കീഴിലാക്കി
  rationale: ὑποτάσσω എന്ന ക്രിയയുടെ അധീനമാക്കുക എന്ന അർഥം തുടർന്നുള്ള ‘കാൽക്കീഴിൽ’ എന്ന വാക്യഭാഗത്തോടു ചേർത്ത് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: അവന്റെ കാൽക്കീഴിൽ
  rationale: ആധിപത്യത്തെയും കീഴടക്കലിനെയും സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തിലെ രൂപകം അതിന്റെ സങ്കീർത്തനപരമായ അനുരണനം നിലനിർത്താൻ അക്ഷരാർഥത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὅταν δὲ εἴπῃ
  choice: എന്നാൽ, … എന്നു പറയുമ്പോൾ
  rationale: ഗ്രീക്കിൽ ക്രിയയുടെ കർത്താവ് തുറന്നു പറഞ്ഞിട്ടില്ല. മലയാളത്തിലും കർത്താവിനെ ചേർക്കാതിരിക്കുന്നത് അത് തിരുവെഴുത്താണോ ദൈവമാണോ പറയുന്നത് എന്ന യഥാർഥ വ്യാകരണപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: ὑποτέτακται
  choice: കീഴ്പ്പെടുത്തപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ passive രൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും ഇപ്പോഴും തുടരുന്ന ഫലാവസ്ഥയെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; ഈ മലയാളരൂപം passive ഭാവവും നിലനിർത്തുന്നു.
- source_word: δῆλον
  choice: വ്യക്തമാണ്
  rationale: വായനക്കാരൻ തിരിച്ചറിയേണ്ട യുക്തിപരമായ നിഗമനം ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: സകലവും അവനു കീഴ്പ്പെടുത്തിയവൻ അതിൽ ഉൾപ്പെടുന്നില്ല
  rationale: ἐκτός ഇവിടെ ഒഴിവാക്കലാണ് സൂചിപ്പിക്കുന്നത്. ‘അതിൽ ഉൾപ്പെടുന്നില്ല’ എന്നത് ‘സകലവും’ എന്നതിൽ കീഴ്പ്പെടുത്തിയവൻ ഉൾപ്പെടുന്നില്ലെന്ന പൗലോസിന്റെ യുക്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: ദത്തിവ് രൂപം സകലവും ആരുടെ അധീനതയിലാക്കപ്പെട്ടു എന്നതു സൂചിപ്പിക്കുന്നു; സന്ദർഭത്തിൽ അത് പുത്രൻ/മശിഹയാണ്.
theological_decisions:
- issue: സകലവും കീഴ്പ്പെടുത്തിയവനും പുത്രനും തമ്മിലുള്ള ബന്ധം
  choice: സകലവും പുത്രനു കീഴ്പ്പെടുത്തിയവൻ ‘സകലവും’ എന്ന പരിധിയിൽ ഉൾപ്പെടുന്നില്ലെന്ന് വാക്യം വ്യക്തമായി പറയുന്നു.
  alternative: ‘സകലവും അവനു കീഴ്പ്പെടുത്തിയവനെ ഒഴികെ’ എന്ന കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം.
  rationale: ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കാതെ, പുത്രനെയും സകലവും അവനു കീഴ്പ്പെടുത്തിയവനെയും വാക്യം വേർതിരിക്കുന്നതും അതിലെ യുക്തിപരമായ ഒഴിവാക്കലും പരിഭാഷ സംരക്ഷിക്കുന്നു.
- issue: ὅταν δὲ εἴπῃ എന്നതിലെ പറയുന്ന കർത്താവ്
  choice: മുഖ്യവാചകത്തിൽ കർത്താവിനെ വ്യക്തമാക്കാതെ ‘എന്നു പറയുമ്പോൾ’ എന്നു നൽകി.
  alternative: ‘അവൻ … എന്നു പറയുമ്പോൾ’ അല്ലെങ്കിൽ ‘തിരുവെഴുത്ത് … എന്നു പറയുമ്പോൾ’.
  rationale: ഗ്രീക്ക് രൂപത്തിൽ കർത്താവ് പരസ്യമായി നൽകിയിട്ടില്ല. ഒരൊറ്റ വ്യാഖ്യാനം നിർബന്ധിക്കാതെ ഈ സന്ദിഗ്ധത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കാൽക്കീഴിൽ’ എന്ന തിരുവെഴുത്തുരൂപകവും passive ആയ ‘കീഴ്പ്പെടുത്തപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപവും ദൈവശാസ്ത്രപരമായും വ്യാകരണപരമായും പ്രധാനമായതിനാൽ സംരക്ഷിച്ചു. ഉദ്ധരണിചിഹ്നങ്ങൾ സങ്കീർത്തനപ്രസ്താവനയെ തിരിച്ചറിയാൻ സഹായിക്കുന്നു.
