  naturalness: ‘സകലവും അവനു കീഴ്പ്പെടുത്തിയവൻ അതിൽ ഉൾപ്പെടുന്നില്ലെന്നത് വ്യക്തമാണ്’ ആധുനിക മാന്യമായ മലയാളമാണ്; ‘അതിൽ’ എന്നത് ‘സകലവും’ എന്ന പരിധിയിലേക്കു സ്വാഭാവികമായി മടങ്ങിച്ചേരുന്നു. എന്നാൽ നിലവിലെ അടിക്കുറിപ്പിലെ ‘അവൻ’ കർത്താവിനെ അനാവശ്യമായി പുരുഷലിംഗത്തിൽ നിർണയിക്കുകയും മുഖ്യവാചകം സംരക്ഷിച്ച തുറന്ന നില ക്ഷയിപ്പിക്കുകയും ചെയ്യുന്നു.
