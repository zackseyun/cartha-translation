reference: 1 Corinthians 15:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ഞങ്ങൾ ദൈവത്തെക്കുറിച്ചുള്ള കള്ളസാക്ഷികളായിപ്പോലും തെളിയുന്നു[a]. കാരണം, ദൈവം മശീഹയെ[b] ഉയിർപ്പിച്ചു എന്നു ഞങ്ങൾ ദൈവത്തിനെതിരായി സാക്ഷ്യം നൽകി. മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നില്ല എന്നത് വാസ്തവമാണെങ്കിൽ, ദൈവം അവനെ ഉയിർപ്പിച്ചില്ലല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: മൂലഭാഷയിൽ അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ കള്ളസാക്ഷികൾ’ എന്നാണ്; ഇവിടെ അത് ദൈവത്തെക്കുറിച്ചുള്ള കള്ളസാക്ഷികൾ എന്ന അർഥത്തിൽ എടുത്തിരിക്കുന്നു. തുടർന്നുവരുന്ന ‘ദൈവത്തിനെതിരായി’ എന്ന പ്രയോഗം വേറിട്ട ഗ്രീക്ക് ഘടനയാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ‘ക്രിസ്തു’; ഇവിടെ അത് പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὑρισκόμεθα
  choice: തെളിയുന്നു
  rationale: നിഷ്ക്രിയരൂപത്തിന്റെ ‘അങ്ങനെയുള്ളവരായി കാണപ്പെടുക/തെളിയുക’ എന്ന ഫലം സൂചിപ്പിക്കുന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ καὶ
  choice: അങ്ങനെയെങ്കിൽ ... പോലുമ്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനവും καίയുടെ ഊന്നലോടുകൂടിയ അധികാർഥവും പ്രകടമാക്കുന്നു.
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: ദൈവത്തെക്കുറിച്ച് കള്ളസാക്ഷ്യം പറഞ്ഞവർ
  rationale: τοῦ θεοῦ എന്ന ഷഷ്ഠിയുടെ വിഷയ/വസ്തു ബന്ധം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; തുടർന്നുള്ള κατὰ τοῦ θεοῦ എന്ന പ്രയോഗവുമായി വേർതിരിച്ചും നിലനിർത്തുന്നു.
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: ഞങ്ങൾ ദൈവത്തിനെതിരായി സാക്ഷ്യം പറഞ്ഞു
  rationale: κατά + genitive എന്നതിന്റെ സാധാരണ വിരുദ്ധാർഥമായ ‘എതിരായി’ നിലനിർത്തി വാദത്തിന്റെ കടുപ്പം സംരക്ഷിക്കുന്നു.
- source_word: ἤγειρεν
  choice: ഉയിർപ്പിച്ചു
  rationale: ദൈവം മരിച്ചവനെ ജീവിപ്പിച്ച പ്രവൃത്തിയെന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവിക സകർമകരൂപത്തിൽ നൽകുന്നു.
- source_word: τὸν Χριστόν
  choice: മശീഹയെ
  rationale: ഇവിടെ Χριστός പേരുപോലെക്കാൾ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ പദവിയാർഥം നൽകുന്നു.
- source_word: εἴπερ ἄρα
  choice: എന്നത് വാസ്തവമാണെങ്കിൽ
  rationale: വാദത്തിനായി ഉന്നയിക്കുന്ന വ്യവസ്ഥയുടെ ‘if indeed/in fact’ എന്ന ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നില്ല
  rationale: പൊതുവായ പ്രസ്താവനയും ഗ്രീക്കിലെ നിഷ്ക്രിയതയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: നിശ്ചയാർഥക ഉപപദവും പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള വാദസന്ദർഭവും ഇവിടെ പദവിയാർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- issue: κατὰ τοῦ θεοῦ എന്നതിന്റെ ശക്തി
  choice: ദൈവത്തിനെതിരായി
  alternative: ദൈവത്തെക്കുറിച്ച്
  rationale: κατά + genitive സാധാരണയായി ‘എതിരായി’ എന്നാണ്; ദൈവം ചെയ്യാത്ത ഒരു പ്രവൃത്തി അവനിൽ ചുമത്തിയാൽ അപ്പൊസ്തലന്മാർ ദൈവത്തിനെതിരായ കള്ളസാക്ഷികളാകുമെന്ന വാദത്തിന്റെ ഗൗരവം ഇത് സംരക്ഷിക്കുന്നു. എന്നാൽ ‘ദൈവത്തെക്കുറിച്ച്’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. നിയമസാക്ഷ്യത്തിന്റെ ഭാവവും പൗലോസിന്റെ വാദത്തിലെ വിരോധാഭാസവും നിലനിർത്തി. ‘ദൈവത്തെക്കുറിച്ച്’ എന്നും ‘ദൈവത്തിനെതിരായി’ എന്നും വേർതിരിച്ച് ഗ്രീക്കിലെ genitive/κατά വ്യത്യാസം പ്രകടമാക്കി.
