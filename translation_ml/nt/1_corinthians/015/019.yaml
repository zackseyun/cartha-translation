  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: ml
  text: ഈ ജീവിതത്തിൽ മാത്രം മശീഹയിൽ[a] നാം പ്രത്യാശ വെച്ചിരിക്കുന്നുവെങ്കിൽ[c], എല്ലാ മനുഷ്യരെക്കാളും അധികം സഹതാപം അർഹിക്കുന്നവർ നാമാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ക്രിസ്തുവിൽ.” ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് “ക്രിസ്തു” എന്നും “മശീഹ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ, “എല്ലാവരിലും ഏറ്റവും സഹതാപം അർഹിക്കുന്നവർ.” ഗ്രീക്കിലെ താരതമ്യരൂപം സന്ദർഭത്തിൽ പരമോന്നതഭാവത്തിലും പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: c
