id: 1CO.15.42
reference: 1 Corinthians 15:42
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: ml
  text: 'മരിച്ചവരുടെ പുനരുത്ഥാനവും അങ്ങനെതന്നെയാണ്: നശ്വരതയിൽ[a] വിതയ്ക്കപ്പെടുന്നു; അനശ്വരതയിൽ ഉയിർപ്പിക്കപ്പെടുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നശിച്ചുപോകാവുന്ന അവസ്ഥയിൽ … നശിച്ചുപോകാത്ത അവസ്ഥയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: φθορά, ἀφθαρσία എന്നീ പദങ്ങൾ ‘നശ്വരത/അനശ്വരത’ എന്ന ഗുണത്തെ മാത്രമല്ല, നാശത്തിന് വിധേയമായതും വിധേയമല്ലാത്തതുമായ അവസ്ഥകളെയും സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: അങ്ങനെതന്നെ
  rationale: മുൻവാക്യങ്ങളിലെ വിത്തിന്റെ ഉപമയുമായി പുനരുത്ഥാനത്തെ ബന്ധിപ്പിക്കുന്ന താരതമ്യാത്മകവും നിഗമനാത്മകവുമായ ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീബന്ധം കൃത്യമായി നിലനിർത്തുകയും സന്ദർഭത്തിലെ മരിച്ചവരുടെ ദേഹപരമായ പുനരുത്ഥാനത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: σπείρεται
  choice: വിതയ്ക്കപ്പെടുന്നു
  rationale: വിത്തിന്റെ ഉപമയും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; ‘അടക്കം ചെയ്യപ്പെടുന്നു’ എന്ന വ്യാഖ്യാനപരമായ പരാവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἐν φθορᾷ
  choice: നശ്വരതയിൽ
  rationale: ഇപ്പോഴത്തെ ശരീരം നാശത്തിനും ക്ഷയത്തിനും വിധേയമാണെന്ന ആശയം സംക്ഷിപ്തമായി നൽകുകയും എതിർപദമായ ‘അനശ്വരത’യോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐγείρεται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിലെ അർഥവും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു; സ്വയം ഉയിർക്കുന്നു എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐν ἀφθαρσίᾳ
  choice: അനശ്വരതയിൽ
  rationale: φθορά–ἀφθαρσία എന്ന നേരിട്ടുള്ള വൈരുധ്യം ‘നശ്വരത–അനശ്വരത’ എന്ന സ്വാഭാവിക മലയാളപദജോടിയിലൂടെ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനശരീരത്തിന്റെ സ്വഭാവവും വിതയ്ക്കൽ–ഉയിർപ്പിക്കൽ രൂപകവും
  choice: കർത്താവ് വ്യക്തമല്ലാത്ത കർമണിപ്രയോഗത്തോടുകൂടി വിതയ്ക്കപ്പെടുന്നു–ഉയിർപ്പിക്കപ്പെടുന്നു എന്ന ദേഹപരമായ രൂപകം നിലനിർത്തി.
  alternative: ‘ശരീരം അടക്കം ചെയ്യപ്പെടുന്നു; നശിക്കാത്തതായി ഉയിർപ്പിക്കപ്പെടുന്നു’ എന്ന് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: സന്ദർഭം ദേഹത്തിന്റെ തുടർച്ചയും രൂപാന്തരവും ഒരുമിച്ച് ഉന്നയിക്കുന്നു. മൂലത്തിലെ രൂപകവും കർത്താവിനെ വ്യക്തമാക്കാത്ത കർമണിപ്രയോഗവും നിലനിർത്തുന്നത് ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുനരുത്ഥാനം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ, അപൂർവമോ അത്യന്തം സംസ്കൃതനിഷ്ഠമോ ആയ പദങ്ങൾ ഒഴിവാക്കി. അർധവിരാമം ഗ്രീക്കിലെ സമാന്തരവൈരുധ്യം വ്യക്തമായി കാണിക്കുന്നു.
