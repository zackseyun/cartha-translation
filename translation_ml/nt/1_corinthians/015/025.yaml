  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, തന്റെ സകല ശത്രുക്കളെയും തന്റെ കാൽക്കീഴിൽ ആക്കുന്നതുവരെ അവൻ വാഴേണ്ടതുണ്ട്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “തന്റെ സകല ശത്രുക്കളെയും തന്റെ കാൽക്കീഴിൽ ആക്കിക്കഴിയുന്നതുവരെ.” ഈ രണ്ട് ക്രിയാരൂപങ്ങൾക്കിടയിൽ നിർബന്ധമായൊരു വ്യത്യാസം ഗ്രീക്ക് പ്രയോഗം ആവശ്യപ്പെടുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ശത്രുക്കളെ “കാൽക്കീഴിൽ” ആക്കുക എന്നത് സമ്പൂർണ കീഴടക്കലിനെ സൂചിപ്പിക്കുന്ന ബൈബിൾരൂപകമാണ്; സങ്കീർത്തനം 110:1 താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: വാഴേണ്ടതുണ്ട്
  rationale: ദൈവിക അനിവാര്യതയുടെയോ നിശ്ചയമായും സംഭവിക്കേണ്ടതിന്റെയോ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: αὐτὸν
  choice: അവൻ
  rationale: ഗ്രീക്കിൽ infinitive ഘടനയുടെ accusative subject ആണെങ്കിലും, മലയാളത്തിൽ സ്വാഭാവികമായ finite-clause രൂപത്തിൽ കർത്താവായി നൽകുന്നു.
- source_word: βασιλεύειν
  choice: വാഴുക
  rationale: രാജാവെന്ന നിലയിലുള്ള ഭരണത്തെ സൂചിപ്പിക്കുന്ന, ബൈബിൾഭാഷയിൽ പരിചിതവും ആധുനിക മലയാളത്തിൽ മാന്യവുമായ പദം.
- source_word: ἄχρι οὗ
  choice: വരെ
  rationale: സൂചിപ്പിച്ച സംഭവത്തിലേക്കുള്ള കാലപരിധി അടയാളപ്പെടുത്തുന്നു; അതിനുശേഷം വാഴ്ച അവസാനിക്കുമെന്ന് ഈ പദം തനിയെ പ്രസ്താവിക്കുന്നില്ല.
- source_word: θῇ
  choice: കാൽക്കീഴിലാക്കിക്കഴിയുക
  rationale: τίθημι എന്ന ക്രിയയുടെ ‘വയ്ക്കുക/ആക്കുക’ എന്ന അർഥവും, ‘വരെ’ എന്ന ഘടനയിൽ ലക്ഷ്യമാക്കിയ കീഴടക്കലിന്റെ പൂർത്തീകരണവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ലളിതമായ ‘കാൽക്കീഴിലാക്കുക’ എന്ന രൂപവും സാധ്യമാണ്.
- source_word: πάντας τοὺς ἐχθροὺς
  choice: തന്റെ സകല ശത്രുക്കളെയും
  rationale: വിരോധികളുടെ സമഗ്രതയും ക്രിസ്തുവുമായുള്ള അവരുടെ ബന്ധവും വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: തന്റെ കാൽക്കീഴിൽ
  rationale: സമ്പൂർണ കീഴടക്കലിന്റെ ബൈബിൾരൂപകം നേരിട്ട് നിലനിർത്തുകയും സങ്കീർത്തനം 110:1-ലെ പ്രതിധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἄχρι οὗ (‘വരെ’) എന്നതിന്റെ കാലപരമായ സൂചന
  choice: ‘വരെ’ എന്ന് വിവർത്തനം ചെയ്തു; ശത്രുക്കൾ കീഴടക്കപ്പെട്ടശേഷം മശിഹായുടെ വാഴ്ച അവസാനിക്കുമെന്ന് സൂചിപ്പിച്ചില്ല.
  alternative: ശത്രുക്കളെ കീഴടക്കുന്നതോടെ അവന്റെ വാഴ്ച അവസാനിക്കുന്നു എന്നു തോന്നിക്കുന്ന വിവർത്തനം.
  rationale: ഗ്രീക്ക് പ്രയോഗം ഇവിടെ ശ്രദ്ധയിൽപ്പെടുന്ന കാലപരിധി അടയാളപ്പെടുത്തുന്നു; എന്നാൽ അതിനുശേഷം പ്രവർത്തനം അവസാനിക്കുമെന്ന് സ്വതവേ ഉറപ്പിക്കുന്നില്ല. അതിനാൽ വാക്യത്തിൽ വ്യക്തമല്ലാത്ത ദൈവശാസ്ത്രനിഗമനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാഴുക’ രാജകീയ ഭരണത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ‘കാൽക്കീഴിൽ’ എന്ന ബൈബിൾരൂപകം വിശദീകരിച്ച് മാറ്റാതെ സംരക്ഷിച്ചിരിക്കുന്നു.
