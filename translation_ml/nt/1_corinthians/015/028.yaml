revisions:
- from: എന്നാൽ സകലവും അവനു കീഴ്പ്പെടുത്തപ്പെടുമ്പോൾ[a], അവനു സകലവും കീഴ്പ്പെടുത്തിയവനു പുത്രൻതന്നെയും കീഴ്പ്പെടുത്തപ്പെടും. അങ്ങനെ ദൈവം സകലത്തിലും സകലവും ആയിരിക്കേണ്ടതിനാണിത്[b].
  to: എന്നാൽ സകലവും അവനു കീഴ്പ്പെടുത്തപ്പെടുമ്പോൾ[a], അപ്പോൾ സകലവും അവനു കീഴ്പ്പെടുത്തിയവനു പുത്രൻ തന്നെയും കീഴ്പ്പെടുത്തപ്പെടും; അങ്ങനെ ദൈവം സകലത്തിലും സകലമായിരിക്കേണ്ടതിന്[b].
  rationale: ‘അപ്പോൾ’ എന്നതിലൂടെ τότε-യുടെ അനുക്രമസൂചന പുനഃസ്ഥാപിച്ചു. ‘അതിനാണിത്’ ഒഴിവാക്കി ἵνα ᾖ-യുടെ ലക്ഷ്യവാക്യം നേരിട്ടും സ്വാഭാവികമായും നൽകി. അവസാന കുറിപ്പിൽ ഒരു സാധ്യമായ വികസിത വായനയെ അക്ഷരാർഥമായി അവകാശപ്പെടാതെ, മൂലത്തിലെ സംക്ഷിപ്തവും വ്യാഖ്യാനപരമായി തുറന്നതുമായ ഭാഷ സംരക്ഷിച്ചു.
