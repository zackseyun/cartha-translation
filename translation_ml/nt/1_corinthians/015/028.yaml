id: 1CO.15.28
reference: 1 Corinthians 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: ml
  text: എന്നാൽ സകലവും അവനു കീഴ്പ്പെടുത്തപ്പെടുമ്പോൾ[a], അപ്പോൾ സകലവും അവനു കീഴ്പ്പെടുത്തിയവനു പുത്രൻ തന്നെയും കീഴ്പ്പെടുത്തപ്പെടും; അങ്ങനെ ദൈവം സകലത്തിലും സകലമായിരിക്കേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എല്ലാം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘സകലവും’ (τὰ πάντα) എന്ന പ്രയോഗം ആവർത്തിച്ച് വരുന്നു; പൗലൊസിന്റെ വാദത്തിന്റെ പ്രപഞ്ചവ്യാപകത ഇതു നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവം എല്ലാവരിലും എല്ലാമായിരിക്കേണ്ടതിന്’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പ്രയോഗം അതിസംക്ഷിപ്തമാണ്; ‘സകലത്തിലും സകലവും’ എന്നത് അതിന്റെ വ്യാപ്തിയും ഉദ്ദേശപൂർവമായ തുറന്ന നിലയും നിലനിർത്തുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: എന്നാൽ ... കീഴ്പ്പെടുത്തപ്പെടുമ്പോൾ
  rationale: ὅταν എന്ന കാലസൂചക ഉപവാക്യവും δέ നൽകുന്ന മൃദുവായ വൈരുധ്യ/തുടർച്ചാഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: കീഴ്പ്പെടുത്തപ്പെടുമ്പോൾ / കീഴ്പ്പെടുത്തപ്പെടും
  rationale: രണ്ടിടത്തുമുള്ള ὑποτάσσω എന്ന ക്രിയയുടെ കർമണിപ്രയോഗവും പദാവർത്തനവും കഴിയുന്നത്ര ഒരേ രൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനു
  rationale: സന്ദർഭത്തിൽ പുത്രനെ സൂചിപ്പിക്കുന്ന ദത്തിവിഭക്തി സർവനാമത്തിന്റെ ബന്ധദിശ നിലനിർത്തുന്നു; മൂലത്തിലെ സർവനാമരൂപം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: നപുംസക ബഹുവചനത്തിന്റെ സമഗ്രവും പ്രപഞ്ചവ്യാപകവുമായ അർഥവ്യാപ്തി സംക്ഷിപ്തമായി നൽകുകയും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: αὐτὸς ὁ υἱὸς
  choice: പുത്രൻതന്നെയും
  rationale: αὐτός നൽകുന്ന ഊന്നലും വാക്യക്രമത്തിലെ ഉൾപ്പെടുത്തൽഭാവവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ ὑποτάξαντι
  choice: കീഴ്പ്പെടുത്തിയവനു
  rationale: ആർട്ടിക്കിളോടുകൂടിയ substantival aorist participle-നെ വ്യക്തവും സംക്ഷിപ്തവുമായ ബന്ധരൂപത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ἵνα ᾖ
  choice: ആയിരിക്കേണ്ടതിനാണിത്
  rationale: ἵνα കൂടിയ subjunctive സൂചിപ്പിക്കുന്ന ലക്ഷ്യ/ഫലബന്ധം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πάντα ἐν πᾶσιν
  choice: സകലത്തിലും സകലവും
  rationale: പൗലൊസിന്റെ അതിസംക്ഷിപ്തവും വ്യാപകവുമായ പ്രയോഗത്തെ വ്യക്തികളിലേക്കു മാത്രം ചുരുക്കാതെ, അതിന്റെ ആവർത്തനവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുത്രൻ കീഴ്പ്പെടുത്തപ്പെടുന്നതും സകലവും കീഴ്പ്പെടുത്തിയവനുമായുള്ള ബന്ധം
  choice: പുത്രൻതന്നെയും ‘കീഴ്പ്പെടുത്തപ്പെടും’ എന്ന് മൂലവാക്യത്തിന്റെ കർമണിരൂപത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘പുത്രൻ സ്വയം കീഴടങ്ങും’ എന്ന സജീവ/സ്വമേധാഭാവമുള്ള രൂപമോ, ഈ കീഴ്പ്പെടൽ ഏതു വിധത്തിലുള്ളതാണെന്ന് ദൈവശാസ്ത്രപരമായി വിശദീകരിക്കുന്ന പരാവർത്തനമോ.
  rationale: വാക്യം പറയുന്ന ഭാവിയിലെ കീഴ്പ്പെടുത്തൽ മങ്ങിക്കാണിക്കാതെയും, സത്താപരമായ താഴ്മയോ അതിന്റെ നിഷേധമോ വിവർത്തനത്തിലേക്ക് കൂട്ടിച്ചേർക്കാതെയും ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: τὰ πάντα / πάντα ἐν πᾶσιν എന്നതിന്റെ വ്യാപ്തി
  choice: ‘സകലവും’, ‘സകലത്തിലും സകലവും’ എന്ന സമഗ്രമായ ഭാഷ ഉപയോഗിച്ചു.
  alternative: ‘എല്ലാവരിലും എല്ലാം’ എന്ന് മനുഷ്യരെയോ വ്യക്തികളെയോ മാത്രം മുൻനിർത്തുന്ന വായന.
  rationale: πᾶς പദകുടുംബത്തിന്റെ ആവർത്തനവും പ്രപഞ്ചവ്യാപകതയും സംരക്ഷിക്കുന്നു; അവസാന പ്രയോഗത്തിലെ വ്യക്തി/വസ്തു സംബന്ധമായ സങ്കുചിതത്വം നിർബന്ധിച്ച് തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കീഴ്പ്പെടുത്തപ്പെടുക’ എന്ന ആവർത്തനം അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്ക് കർമണിരൂപവും പ്രധാന പദത്തിന്റെ ആവർത്തനവും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു. അവസാനത്തെ ‘സകലത്തിലും സകലവും’ എന്ന സംക്ഷിപ്ത രൂപം മൂലത്തിലെ വാചകശക്തിയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
