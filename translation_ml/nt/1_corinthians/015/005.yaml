translation:
  language: ml
  text: അവൻ കേഫാവിന് പ്രത്യക്ഷനായി; പിന്നെ പന്ത്രണ്ടുപേർക്കും എന്നും[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘കേഫാവ് അവനെ കണ്ടു.’ ഗ്രീക്ക് ക്രിയ രൂപത്തിൽ നിഷ്ക്രിയമാണ്; എന്നാൽ ഉയിർത്തെഴുന്നേറ്റശേഷമുള്ള പ്രത്യക്ഷതകളെ വിവരിക്കുന്ന സന്ദർഭങ്ങളിൽ സാധാരണയായി ‘പ്രത്യക്ഷനായി’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘കേഫാ’ എന്നത് ‘പത്രോസ്’ എന്ന പേരിനു തത്തുല്യമായ അരമായ നാമമാണ്.
    reason: cross_reference
  - marker: c
    text: ‘പന്ത്രണ്ടുപേർ’ എന്നത് യേശുവിന്റെ അപ്പൊസ്തലന്മാരുടെ സംഘത്തെ സൂചിപ്പിക്കാൻ സ്ഥിരമായി ഉപയോഗിക്കപ്പെട്ടിരുന്ന പേരാണ്; എല്ലാ സമയത്തും ആ സംഘത്തിൽ കൃത്യം പന്ത്രണ്ടുപേർ ഉണ്ടായിരുന്നുവെന്നല്ല ഇതിന്റെ അർഥം.
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയരൂപമാണിത്. ഉയിർത്തെഴുന്നേറ്റ യേശു സാക്ഷികൾക്കു ദൃശ്യനായ സംഭവങ്ങളെ വിവരിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പ്രത്യക്ഷനായി’ എന്നത് സ്വാഭാവികവും അർത്ഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമായ പ്രയോഗമാണ്.
- source_word: Κηφᾷ
  choice: കേഫാവിനു
  rationale: Κηφᾶς എന്ന വ്യക്തിനാമത്തിന്റെ ദത്തിവിഭക്തിരൂപമാണിത്. ഗ്രീക്ക് പാഠത്തിലെ പേരിനെ ‘പത്രോസ്’ എന്നു സമീകരിക്കാതെ ലിപ്യന്തരണം ചെയ്തു.
- source_word: εἶτα
  choice: പിന്നെ
  rationale: പൗലോസ് ഉദ്ധരിക്കുന്ന സാക്ഷ്യപരമ്പരയിലെ സംഭവക്രമം ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: τοῖς δώδεκα
  choice: പന്ത്രണ്ടുപേർക്കു
  rationale: യേശുവിന്റെ അപ്പൊസ്തലവൃന്ദത്തിന്റെ സ്ഥിരമായ സംഘനാമം അതേപടി നിലനിർത്തുന്നു; ‘പതിനൊന്നുപേർ’ എന്ന ചരിത്രപരമായ സമീകരണം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: καὶ ὅτι
  choice: എന്നും
  rationale: മുൻവാക്യങ്ങളിൽ ആരംഭിച്ച ഉള്ളടക്കവാക്യങ്ങളുടെ പരമ്പര ഈ വാക്യവും തുടരുന്നു. മലയാളത്തിൽ ഉദ്ധരണിപരമ്പരയുടെ അവസാനത്തിൽ വരുന്ന ‘എന്നും’ അതിന്റെ ബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ഉയിർത്തെഴുന്നേറ്റശേഷമുള്ള പ്രത്യക്ഷതയുടെ ഭാഷ
  choice: പ്രത്യക്ഷനായി
  alternative: കാണപ്പെട്ടു
  rationale: പ്രത്യക്ഷതയുടെ രീതി സംബന്ധിച്ച് പാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കാതെ, ഉയിർത്തെഴുന്നേറ്റ യേശു ദൃശ്യനായെന്ന അവകാശവാദം നിലനിർത്തുന്നു. നിഷ്ക്രിയരൂപത്തിന്റെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: യൂദാസിന്റെ അഭാവത്തിലും ‘പന്ത്രണ്ടുപേർ’ എന്ന പ്രയോഗം
  choice: പന്ത്രണ്ടുപേർ
  alternative: അപ്പൊസ്തലന്മാർ / പതിനൊന്നുപേർ
  rationale: τοῖς δώδεκα എന്നത് അപ്പൊസ്തലവൃന്ദത്തിന്റെ സ്ഥാപിതമായ സംഘനാമമാണ്. മറ്റു വിവരണങ്ങളുമായി പൊരുത്തപ്പെടുത്താൻ മൂലപാഠത്തെ മാറ്റാതെ അതിന്റെ ദൈവശാസ്ത്രപരവും ചരിത്രപരവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മുൻവാക്യങ്ങളിലെ ഏല്പിച്ചുകൊടുത്ത കാര്യങ്ങളുടെ പട്ടികയുമായി ബന്ധിപ്പിക്കാൻ ‘എന്നും’ നിലനിർത്തി. ഗ്രീക്കിൽ രണ്ടാം ഘടകത്തിൽ ക്രിയ ആവർത്തിക്കാത്തെങ്കിലും, മലയാളത്തിൽ വ്യക്തതയ്ക്കും സ്വാഭാവികതയ്ക്കുമായി ‘പ്രത്യക്ഷനായി’ ആവർത്തിച്ചു.
