  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: ml
  text: ഒരു നിമിഷത്തിൽ[a], കണ്ണിമയ്ക്കുന്ന നേരത്ത്, അവസാന കാഹളത്തിൽ. കാരണം കാഹളം മുഴങ്ങും; മരിച്ചവർ അക്ഷയരായി ഉയിർപ്പിക്കപ്പെടും; നാം മാറ്റപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിഭജിക്കാനാവാത്ത ഒരു നിമിഷത്തിൽ.’ ഗ്രീക്ക് പ്രയോഗം അത്യന്തം ഹ്രസ്വമായ ഒരു സമയബിന്ദുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: ഒരു നിമിഷത്തിൽ
  rationale: ἄτομος എന്നത് അക്ഷരാർഥത്തിൽ വിഭജിക്കാനാവാത്തത് എന്നാണെങ്കിലും, ഇവിടെ അത്യന്തം ഹ്രസ്വമായ സമയബിന്ദുവിനെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഒരു നിമിഷത്തിൽ’ സ്വാഭാവികമായ മലയാളത്തിൽ ആ കാലസൂചന നൽകുന്നു.
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: കണ്ണിമയ്ക്കുന്ന നേരത്ത്
  rationale: കണ്ണിന്റെ അതിവേഗ ചലനത്തെ ആധാരമാക്കിയുള്ള ഈ പ്രയോഗം സംഭവത്തിന്റെ പെട്ടെന്നുള്ള സ്വഭാവം വ്യക്തമാക്കുന്നു. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗമാണിത്.
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: അവസാനത്തെ കാഹളം മുഴങ്ങുമ്പോൾ
  rationale: ἐν ഇവിടെ കാലസൂചന നൽകുന്നു. σάλπιγξ എന്നതിന് സന്ദർഭോചിതമായി ‘കാഹളം’ എന്നും ἐσχάτῃ എന്നതിന് ‘അവസാനത്തെ’ എന്നും നൽകി; ഏതെങ്കിലും പ്രത്യേക അന്ത്യകാലക്രമം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: σαλπίσει
  choice: കാഹളം മുഴങ്ങും
  rationale: ക്രിയയ്ക്ക് കാഹളം ഊതുക/മുഴങ്ങുക എന്ന അർഥമുണ്ട്. തൊട്ടുമുമ്പുള്ള σάλπιγξ-നെ കർത്താവായി വ്യക്തമാക്കുന്നത് മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: οἱ νεκροὶ
  choice: മരിച്ചവർ
  rationale: മരിച്ച മനുഷ്യരെ സമൂഹമായി സൂചിപ്പിക്കുന്ന substantival adjective മലയാളത്തിൽ സ്വാഭാവികമായി ‘മരിച്ചവർ’ എന്നു നൽകുന്നു.
- source_word: ἐγερθήσονται
  choice: ഉയിർപ്പിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗം നിലനിർത്തുകയും പുനരുത്ഥാനസന്ദർഭം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ἄφθαρτοι
  choice: അക്ഷയരായി
  rationale: ജീർണതയ്ക്കും നാശത്തിനും വിധേയമല്ലാത്ത അവസ്ഥയാണ് ἄφθαρτος സൂചിപ്പിക്കുന്നത്. ‘അക്ഷയരായി’ ചുരുക്കവും ഗൗരവമുള്ളതുമായ മലയാളരൂപമാണ്.
- source_word: ἡμεῖς
  choice: നാം
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി നൽകിയിരിക്കുന്ന ഒന്നാംപുരുഷ ബഹുവചനത്തിന് ഊന്നലും ‘മരിച്ചവർ’ എന്നതോടുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: ἀλλαγησόμεθα
  choice: രൂപാന്തരപ്പെടുകയും ചെയ്യും
  rationale: ἀλλάσσω മാറ്റത്തെ സൂചിപ്പിക്കുന്നു. പുനരുത്ഥാനസന്ദർഭത്തിൽ ‘രൂപാന്തരപ്പെടുക’ സ്വാഭാവികവും അർഥസമ്പന്നവുമാണ്; കർമണിഭാവം മലയാളത്തിൽ സ്വാഭാവിക ക്രിയാരൂപത്തിലൂടെ പ്രകടമാകുന്നു.
theological_decisions:
- issue: അവസാനത്തെ കാഹളത്തെ ഒരു പ്രത്യേക അന്ത്യകാലവ്യവസ്ഥയുമായി ബന്ധിപ്പിക്കാതിരിക്കുക
  choice: അവസാനത്തെ കാഹളം മുഴങ്ങുമ്പോൾ
  alternative: അന്ത്യകാഹളത്തിൽ
  rationale: മൂലപാഠം ‘അവസാനത്തെ കാഹളം’ എന്നു പറയുന്നു; അതിൽക്കവിഞ്ഞ സംഭവക്രമമോ വ്യവസ്ഥയോ വിവർത്തനം നിർണയിക്കുന്നില്ല.
- issue: ‘നാം’ എന്നതിന്റെ പരിധി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതിരിക്കുക
  choice: നാം രൂപാന്തരപ്പെടുകയും ചെയ്യും
  alternative: അന്നു ജീവിച്ചിരിക്കുന്ന നാം രൂപാന്തരപ്പെടും
  rationale: ἡμεῖς എന്ന വ്യക്തമായ സർവനാമം അതേപടി നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ നിന്നുള്ള വിശദീകരണം വാക്യത്തിനകത്ത് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള മലയാളം. പൗലോസിന്റെ ചുരുങ്ങിയ താളം സാധ്യമാകുന്നത്ര നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ ആദ്യ രണ്ടു കാലപ്രയോഗങ്ങൾക്കുശേഷം പ്രധാന സംഭവവാക്യത്തിലേക്കുള്ള ബന്ധം മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘ഇതു സംഭവിക്കും’ ചേർത്തിരിക്കുന്നു.
