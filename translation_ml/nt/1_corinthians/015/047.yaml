  to: ആദ്യ മനുഷ്യൻ ഭൂമിയിൽനിന്നുള്ളവനും പൊടികൊണ്ടുള്ളവനും ആയിരുന്നു; രണ്ടാമത്തെ മനുഷ്യൻ സ്വർഗത്തിൽനിന്നുള്ളവനാണ്.[a]
