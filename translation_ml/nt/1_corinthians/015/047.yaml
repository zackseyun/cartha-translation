  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: ml
  text: ആദ്യ മനുഷ്യൻ ഭൂമിയിൽനിന്നുള്ളവനും പൊടികൊണ്ടുള്ളവനും ആയിരുന്നു; രണ്ടാമത്തെ മനുഷ്യൻ സ്വർഗത്തിൽനിന്നുള്ളവനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഭൂമിസ്വഭാവമുള്ളവൻ’ അല്ലെങ്കിൽ ‘പൊടിയിൽനിന്നുള്ളവൻ.’ ഗ്രീക്ക് വിശേഷണമായ χοϊκός ആദാം പൊടിയിൽനിന്നു സൃഷ്ടിക്കപ്പെട്ടതിനെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: ആദ്യ
  rationale: ആദാം–ക്രിസ്തു വൈരുധ്യത്തിലെ ആദ്യ അംഗത്തെ സൂചിപ്പിക്കുന്ന ക്രമസംഖ്യ; മലയാളത്തിൽ സ്വാഭാവികവും സമാന്തരഘടനയ്ക്കു യോജിച്ചതുമാണ്.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ആദ്യ സന്ദർഭത്തിൽ ആദാമിനെയും രണ്ടാമത്തേതിൽ ക്രിസ്തുവിനെയും പ്രതിനിധിപരമായി സൂചിപ്പിക്കുന്നു; രണ്ടു ഉപവാക്യങ്ങളിലെയും ബോധപൂർവമായ സമാന്തരത നിലനിർത്തുന്നു.
- source_word: ἐκ γῆς
  choice: ഭൂമിയിൽനിന്നുള്ളവൻ
  rationale: ഉത്ഭവവും ഉറവിടവും സൂചിപ്പിക്കുന്നു; ഭൂമിയിൽനിന്നുള്ള സൃഷ്ടിയിലേക്കുള്ള സൂചന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: χοϊκός
  choice: പൊടികൊണ്ടുണ്ടാക്കപ്പെട്ടവൻ
  rationale: ‘പൊടിയാൽ നിർമ്മിതൻ/പൊടിയോടു ബന്ധപ്പെട്ടവൻ’ എന്ന അർഥവും ആദാമിന്റെ സൃഷ്ടിയെക്കുറിച്ചുള്ള പ്രതിധ്വനിയും വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: δεύτερος
  choice: രണ്ടാമത്തെ
  rationale: ആദ്യ മനുഷ്യനോടുള്ള ക്രമപരവും പ്രതിനിധിപരവുമായ വൈരുധ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐξ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്നുള്ളവൻ
  rationale: ഭൗതികമായ ആകാശം എന്നതിലുപരി ഇവിടെ ഉദ്ദേശിക്കുന്ന സ്വർഗീയ ഉത്ഭവം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘രണ്ടാമത്തെ മനുഷ്യൻ’ എന്ന പ്രയോഗത്തിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ അർഥം
  choice: മൂലപാഠത്തെപ്പോലെ ‘രണ്ടാമത്തെ മനുഷ്യൻ’ എന്നു മാത്രം നിലനിർത്തി.
  alternative: ‘രണ്ടാമത്തെ മനുഷ്യനായ ക്രിസ്തു’ എന്നു വ്യക്തമായി ചേർക്കുക.
  rationale: സന്ദർഭം ക്രിസ്തുവിനെ തിരിച്ചറിയിക്കുന്നുവെങ്കിലും ഈ വാക്യത്തിൽ പേര് ചേർത്തിട്ടില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി ആദാം–ക്രിസ്തു മാതൃകാസംബന്ധം അതേപടി സൂക്ഷിച്ചു.
- issue: രണ്ടാമത്തെ ഉപവാക്യത്തിലെ കാലസൂചന
  choice: ‘സ്വർഗത്തിൽനിന്നുള്ളവൻ’ എന്ന നാമവാക്യഘടന ഉപയോഗിച്ചു; ഇത് മലയാളത്തിൽ വർത്തമാന പ്രസ്താവനയായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
  alternative: ‘സ്വർഗത്തിൽനിന്നു വന്നവനായിരുന്നു’ എന്നു ഭൂതകാലമാക്കുക.
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ ക്രിയാപദമില്ല. ആദ്യ ഉപവാക്യത്തിന്റെ ഭൂതകാലം നിർബന്ധമായി രണ്ടാമത്തേതിലേക്കു കൊണ്ടുവരാതെ, നിലവിലുള്ള സ്വർഗീയ ഉറവിടത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ മലയാളം. ‘ആദ്യമനുഷ്യൻ ... രണ്ടാമത്തെ മനുഷ്യൻ’ എന്ന പൗലോസിന്റെ സമാന്തരഘടനയും ‘ഭൂമി ... സ്വർഗം’ എന്ന വൈരുധ്യവും നിലനിർത്തി.
