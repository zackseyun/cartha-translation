  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, നിദ്രപ്രാപിച്ചവരുടെ ആദ്യഫലമായ മശീഹ[a] മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: alternative_reading
  - marker: b
    text: “ആദ്യഫലം” ദൈവത്തിന് അർപ്പിച്ചിരുന്ന വിളവിന്റെ ആദ്യഭാഗത്തെ ഓർമിപ്പിക്കുന്നു; അത് മുൻഗണനയെയും പിന്നാലെ വരാനിരിക്കുന്ന പൂർണവിളവിന്റെ ഉറപ്പിനെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: “നിദ്രപ്രാപിച്ചവർ” എന്നത് മരിച്ചവരെ സൂചിപ്പിക്കുന്ന രൂപകമാണ്; പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ അതിന് പ്രത്യേക പ്രസക്തിയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻവാക്യങ്ങളിലെ സാങ്കൽപ്പിക നിഷേധത്തിൽനിന്ന് ഇപ്പോഴത്തെ യാഥാർഥ്യപ്രഖ്യാപനത്തിലേക്കുള്ള ശക്തമായ വിരുദ്ധതിരിവ് വ്യക്തമാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഈ ദൈവശാസ്ത്രപരമായ സന്ദർഭത്തിൽ പദം അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അർഥം സൂചിപ്പിക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: ἐγήγερται
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ പൂർണ്ണകാല കർമണിപ്രയോഗം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു; പ്രവർത്തകനെ പ്രത്യേകം നിർണ്ണയിക്കാതെ കർമണിരൂപവും നിലനിർത്തുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: νεκρῶν എന്ന ബഹുവചനത്തിന്റെ ‘മരിച്ച ആളുകൾ’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπαρχὴ
  choice: ആദ്യഫലം
  rationale: വിളവിന്റെ ആദ്യം ദൈവത്തിന് അർപ്പിക്കുന്ന ഭാഗത്തെയും പിന്നാലെ വരുന്ന പൂർണവിളവിന്റെ മുന്നറിയിപ്പും ഉറപ്പുമായ പ്രതിനിധിത്വത്തെയും സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം.
- source_word: τῶν κεκοιμημένων
  choice: നിദ്രപ്രാപിച്ചവരുടെ
  rationale: മരണത്തെ നിദ്രയായി അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിലെ രൂപകം, പ്രത്യേകിച്ച് പുനരുത്ഥാനസന്ദർഭത്തിലെ പ്രത്യാശാഭാവം, നേരിട്ട് ‘മരിച്ചവർ’ എന്നു പരത്താതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തിലെ വാച്യവും പ്രവർത്തകത്വവും
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  alternative: ഉയിർത്തെഴുന്നേറ്റിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ കർമണിരൂപം സംരക്ഷിച്ച് ദൈവിക പ്രവർത്തകത്വം മറച്ചുകളയാതെയും പ്രവർത്തകനെ പാഠത്തിൽ ഇല്ലാത്ത വിധം വ്യക്തമാക്കാതെയും ഇരിക്കുന്നു.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός പേര് പോലെയല്ല, ദൈവശാസ്ത്രപരവും പ്രതിനിധിത്വപരവുമായ സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ അതിന്റെ സ്ഥാനപ്പേർസ്വഭാവം ‘മശീഹ’ വ്യക്തമാക്കുന്നു.
- issue: ἀπαρχή എന്ന വിളവുരൂപകത്തിന്റെ അർഥവ്യാപ്തി
  choice: ആദ്യഫലം
  alternative: ആദ്യവിളവ്
  rationale: ആദ്യനിലയും പിന്നാലെ വരുന്ന പൂർണവിളവുമായുള്ള പ്രതിനിധിബന്ധവും ഒരുമിച്ച് നിലനിർത്തുന്നു; ‘ഉറപ്പ്’ എന്ന ആശയം പ്രധാനപാഠത്തിൽ വിശദീകരിച്ച് ചേർക്കാതെ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപം സാധാരണ സംസാരഭാഷയെക്കാൾ ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ പൂർണ്ണകാല കർമണിവാച്യവും തുടർന്നുനിൽക്കുന്ന ഫലവും കൃത്യമായി വഹിക്കുന്നു. അർദ്ധവിരാമം പുനരുത്ഥാനപ്രഖ്യാപനത്തെയും അതിന്റെ ‘ആദ്യഫലം’ എന്ന വിശദീകരണത്തെയും വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
