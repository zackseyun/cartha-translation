id: 1CO.15.44
reference: 1 Corinthians 15:44
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ⸀Εἰ ἔστιν σῶμα ψυχικόν, ⸂ἔστιν καὶ⸃ πνευματικόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: ml
  text: അത് സ്വാഭാവിക ശരീരമായി വിതയ്ക്കപ്പെടുന്നു; ആത്മിക ശരീരമായി ഉയിർപ്പിക്കപ്പെടുന്നു. സ്വാഭാവിക ശരീരം[a] ഉണ്ടെങ്കിൽ, ആത്മിക ശരീരവും ഉണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രാണിക ശരീരം’ … ‘ആത്മിക ശരീരം.’ പൗലോസ് ഇവിടെ ഭൗതിക ശരീരത്തെയും അഭൗതിക അസ്തിത്വത്തെയും തമ്മിൽ എതിർക്കുന്നില്ല; സാധാരണ മനുഷ്യജീവനാൽ സജീവമാക്കപ്പെടുന്ന ശരീരത്തെയും ദൈവാത്മാവിനാൽ സജീവമാക്കപ്പെടുന്ന ശരീരത്തെയും തമ്മിലാണ് വൈരുധ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: വിതയ്ക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗവും സമീപസന്ദർഭത്തിലെ വിത്ത്–പുനരുത്ഥാന രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: മരണത്തിലും പുനരുത്ഥാനത്തിലും മനുഷ്യന്റെ ദേഹധാരിയായ അസ്തിത്വത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ പദം.
- source_word: ψυχικόν
  choice: സ്വാഭാവിക
  rationale: സാധാരണ സൃഷ്ടിജീവനാൽ സവിശേഷമാക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘ഭൗതിക’ എന്നത് ദ്രവ്യശരീരവും അഭൗതിക അസ്തിത്വവും തമ്മിലുള്ള തെറ്റായ വൈരുധ്യം സൃഷ്ടിക്കാം; ‘പ്രാണിക’ ആധുനിക വായനക്കാർക്ക് അസ്പഷ്ടമാണ്.
- source_word: ἐγείρεται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: കർമണിപ്രയോഗം നിലനിർത്തുകയും പുനരുത്ഥാനസന്ദർഭത്തിലെ അർഥം വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: πνευματικόν
  choice: ആത്മിക
  rationale: പൗലോസിന്റെ പദവൈരുധ്യം സംരക്ഷിക്കുന്നു; ഇത് ശരീരരഹിതം എന്നല്ല, ആത്മാവിനാൽ സവിശേഷമാക്കപ്പെടുന്ന ശരീരം എന്നാണ് സന്ദർഭത്തിൽ ഗ്രഹിക്കേണ്ടത്.
- source_word: Εἰ
  choice: ഉണ്ടെങ്കിൽ
  rationale: ഗ്രീക്കിലെ നിബന്ധനാരൂപം അനാവശ്യമായി ഉറപ്പുള്ള പ്രസ്താവനയാക്കി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: രണ്ടാമത്തെ ശരീരത്തെയും കൂട്ടിച്ചേർക്കുന്ന ‘also’ എന്ന അർഥം മലയാളത്തിലെ സ്വാഭാവികമായ അനുബന്ധപ്രത്യയത്തിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: ‘സ്വാഭാവിക ശരീരം’–‘ആത്മിക ശരീരം’ എന്ന വൈരുധ്യത്തിന്റെ അർഥം
  choice: സാധാരണ മനുഷ്യജീവനാൽ സവിശേഷമാക്കപ്പെടുന്ന ശരീരവും ആത്മാവിനാൽ സവിശേഷമാക്കപ്പെടുന്ന ശരീരവും തമ്മിലുള്ള വൈരുധ്യമായി പദപ്രയോഗം സംരക്ഷിച്ചു.
  alternative: ‘ഭൗതിക ശരീരം’–‘അഭൗതിക ശരീരം’ എന്ന വൈരുധ്യം; അല്ലെങ്കിൽ ‘പ്രാണിക ശരീരം’–‘ആത്മശരീരം’.
  rationale: ഗ്രീക്ക് പദങ്ങൾ ദ്രവ്യശരീരത്തെയും ശരീരരഹിതാവസ്ഥയെയും തമ്മിൽ എതിർക്കുന്നില്ല. പുനരുത്ഥാനശരീരത്തിന്റെ യാഥാർഥ്യം നിലനിർത്തിക്കൊണ്ട് പൗലോസിന്റെ പദവൈരുധ്യവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘സ്വാഭാവിക’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; എന്നാൽ അതിന്റെ ഗ്രീക്ക് പശ്ചാത്തലം നഷ്ടപ്പെടാതിരിക്കാൻ അടിക്കുറിപ്പിൽ ‘പ്രാണിക’ എന്ന പദവികല്പവും വൈരുധ്യത്തിന്റെ സ്വഭാവവും നൽകിയിരിക്കുന്നു.
