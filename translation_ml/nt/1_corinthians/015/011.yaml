  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε οὖν ἐγὼ εἴτε ἐκεῖνοι, οὕτως κηρύσσομεν καὶ οὕτως ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/011.yaml
  text: Whether then it was I or they[a], so we proclaim and so you believed.
translation:
  language: ml
  text: അതിനാൽ, ഞാനായാലും അവരായാലും, ഇങ്ങനെയാണ് ഞങ്ങൾ പ്രസംഗിക്കുന്നത്; നിങ്ങൾ വിശ്വസിച്ചതും ഇങ്ങനെയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇതുതന്നെയാണ് ഞങ്ങൾ പ്രസംഗിക്കുന്നത്; ഇതുതന്നെയാണ് നിങ്ങൾ വിശ്വസിച്ചത്.”
    reason: οὕτως എന്ന പദം ‘ഇങ്ങനെ’ എന്ന രീതിസൂചനയായോ മുമ്പ് സംഗ്രഹിച്ച സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തിലേക്കുള്ള സൂചനയായോ മനസ്സിലാക്കാം.
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: ഞാനായാലും അവരായാലും
  rationale: പരസ്പരവികൽപങ്ങളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതിനാൽ
  rationale: മുമ്പ് പറഞ്ഞ പുനരുത്ഥാനസാക്ഷ്യങ്ങളിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐκεῖνοι
  choice: അവർ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പരാമർശിച്ച മറ്റു അപ്പൊസ്തലന്മാരെയും സാക്ഷികളെയും സൂചിപ്പിക്കുന്നു; മൂലപാഠത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οὕτως ... οὕτως
  choice: ഇങ്ങനെയാണ് ... ഇങ്ങനെയാണ്
  rationale: ആവർത്തനം സംരക്ഷിക്കുകയും പ്രസംഗത്തിന്റെയും വിശ്വാസത്തിന്റെയും ഒരേ ഉള്ളടക്കമോ രീതിയോ സൂചിപ്പിക്കാവുന്ന മൂലപാഠത്തിന്റെ വ്യാപ്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κηρύσσομεν
  choice: ഞങ്ങൾ പ്രസംഗിക്കുന്നത്
  rationale: പരസ്യമായി പ്രഖ്യാപിക്കുക എന്ന κηρύσσωയുടെ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; ‘ഞങ്ങൾ’ പൗലോസിനെയും മറ്റു അപ്പൊസ്തലന്മാരെയും ഉൾക്കൊള്ളുന്നു.
- source_word: ἐπιστεύσατε
  choice: നിങ്ങൾ വിശ്വസിച്ചതും
  rationale: കൊരിന്ത്യർ മുമ്പ് വിശ്വസിച്ച സംഭവത്തെ നേരിട്ട് അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത വിശ്വാസവസ്തു പ്രത്യേകം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: അപ്പൊസ്തലിക പ്രസംഗത്തിന്റെ ഐക്യത്തിന്റെ വ്യാപ്തി
  choice: പൗലോസായാലും മറ്റു അപ്പൊസ്തലന്മാരായാലും അവർ ഒരേവിധം പ്രസംഗിച്ചുവെന്നും കൊരിന്ത്യർ അതേവിധം വിശ്വസിച്ചുവെന്നും വാക്യം പറയുന്നു.
  alternative: οὕτως എന്നത് പ്രധാനമായും സന്ദേശത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നതായി വായിച്ച്, ‘ഇതാണ് ഞങ്ങൾ പ്രസംഗിക്കുന്നത്; ഇതാണ് നിങ്ങൾ വിശ്വസിച്ചതും’ എന്നു പരിഭാഷപ്പെടുത്താം.
  rationale: അപ്പൊസ്തലന്മാരുടെ സാക്ഷ്യത്തിലെ ഐക്യം പ്രകടമാക്കുമ്പോഴും, വാക്യം പറയുന്നതിലപ്പുറം സഭാശാസ്ത്രപരമായ അവകാശവാദങ്ങൾ ചേർക്കുന്നില്ല; οὕτως എന്നതിലെ രീതി/ഉള്ളടക്കം സംബന്ധിച്ച സൂക്ഷ്മമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രസംഗിക്കുന്നു’ എന്ന പരിചിതമായ പദം പരസ്യപ്രഖ്യാപനത്തിന്റെ ആശയം നൽകുന്നു. ഗ്രീക്കിലെ സമാന്തര ആവർത്തനം മലയാളത്തിലും നിലനിർത്തിയിരിക്കുന്നു.
