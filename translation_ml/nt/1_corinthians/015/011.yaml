    rationale: ‘ഇതാണ് നിങ്ങൾ വിശ്വസിച്ചതും’ is less idiomatic than a finite alternative such as ‘ഇതുതന്നെയാണ് നിങ്ങൾ വിശ്വസിച്ചത്.’
