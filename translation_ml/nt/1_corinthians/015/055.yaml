  text: ποῦ σου, θάνατε, τὸ ⸂νῖκος; ποῦ σου, θάνατε, τὸ κέντρον⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/055.yaml
  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: ml
  text: “മരണമേ, നിന്റെ ജയം എവിടെ? മരണമേ, നിന്റെ വിഷമുള്ള് എവിടെ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ആദ്യ ഉപവാക്യം, “മരണമേ, നിന്റെ വിഷമുള്ള് എവിടെ?” എന്നു വായിക്കുന്നു. KJV ഉൾപ്പെടെയുള്ള ചില പരമ്പരാഗത വിവർത്തനങ്ങളിൽ ഈ വായന പ്രതിഫലിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: എവിടെ
  rationale: പരിഹാസധ്വനിയുള്ള അലങ്കാരചോദ്യത്തെ അധിക ഊന്നൽ ചേർക്കാതെ നേരിട്ട് അവതരിപ്പിക്കുന്നു.
- source_word: σου
  choice: നിന്റെ
  rationale: രണ്ടാംപുരുഷ ഏകവചന ഉടമസ്ഥതയെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: θάνατε
  choice: മരണമേ
  rationale: മരണത്തെ വ്യക്തിവൽക്കരിച്ച് നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന സംബോധനരൂപവും കാവ്യാത്മക ശക്തിയും നിലനിർത്തുന്നു.
- source_word: νῖκος
  choice: ജയം
  rationale: വിജയം അഥവാ കീഴടക്കൽ എന്ന അർഥം ലളിതവും ശക്തവുമായി നൽകുന്നു; മൂലപാഠത്തിലെ νῖκος എന്ന വായനയാണ് പിന്തുടരുന്നത്.
- source_word: κέντρον
  choice: വിഷമുള്ള്
  rationale: κέντρον എന്നത് കുത്തുന്ന മുള്ളിനെയോ അങ്കുശത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ മരണത്തിന്റെ മാരകമായ കുത്ത് എന്ന രൂപകം സ്വാഭാവികമായി വ്യക്തമാക്കാൻ ‘വിഷമുള്ള്’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ആദ്യ ഉപവാക്യത്തിലെ വിമർശനപാഠവായന
  choice: νῖκος എന്നതിനെ ‘ജയം’ എന്നു മുഖ്യപാഠത്തിൽ വിവർത്തനം ചെയ്തു.
  alternative: ചില കൈയെഴുത്തുപ്രതികൾ അനുസരിച്ച് ആദ്യ ഉപവാക്യത്തിലും ‘വിഷമുള്ള്’ എന്നു വായിക്കാം.
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മൂലപാഠം ആദ്യ ഉപവാക്യത്തിൽ νῖκος എന്നാണ് വായിക്കുന്നത്; ഇത് 54-ാം വാക്യത്തിലെ ജയത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയോടും യോജിക്കുന്നു. പ്രസിദ്ധമായ പരമ്പരാഗത വ്യത്യസ്തവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും വായിക്കാൻ എളുപ്പവുമായ മലയാളം. ആവർത്തിച്ചുള്ള ‘മരണമേ’ എന്ന സംബോധനവും രണ്ട് സമാന്തര ചോദ്യങ്ങളുടെ കാവ്യാത്മകവും വെല്ലുവിളിനിറഞ്ഞതുമായ ഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
