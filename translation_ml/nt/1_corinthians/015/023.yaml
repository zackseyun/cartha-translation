id: 1CO.15.23
reference: 1 Corinthians 15:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: ml
  text: 'എന്നാൽ ഓരോരുത്തനും താന്താന്റെ ക്രമത്തിൽ: ആദ്യഫലമായ മശീഹാ; പിന്നെ, അവന്റെ വരവിൽ മശീഹാവിനുള്ളവർ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന ഉയിർത്തെഴുന്നേൽപ്പിന്റെ ക്രമത്തിൽ ഉൾപ്പെടുന്നവരെ വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: താന്താന്റെ ക്രമത്തിൽ
  rationale: τάγμα ക്രമീകരണം, നിര, നിയുക്തക്രമം എന്നീ അർഥങ്ങൾ വഹിക്കാം. ഇവിടെ ഉയിർത്തെഴുന്നേൽപ്പിന്റെ അനുക്രമമാണ് മുഖ്യം; സൈനികമായ ‘നിര’ എന്ന ഭാവം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ ‘ക്രമം’ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀπαρχὴ
  choice: ആദ്യഫലമായി
  rationale: വിളവിൽനിന്ന് ആദ്യം ദൈവത്തിന് അർപ്പിക്കുന്ന പങ്കിനെയും പിന്നാലെ വരുന്ന വിളവിന്റെ ഉറപ്പിനെയും സൂചിപ്പിക്കുന്ന ബൈബിൾചിത്രം സംരക്ഷിക്കുന്നു. വിഭക്തിപ്രയോഗം ഗ്രീക്കിലെ സംക്ഷിപ്തമായ appositional ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: Χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ പദം അഭിഷിക്തനായവൻ എന്ന പദവിയർഥത്തിൽ പ്രവർത്തിക്കുന്നു. അതിനാൽ പേരുപോലെ ഉപയോഗിക്കുന്ന ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ ‘മശീഹാ’ പദവിയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: οἱ τοῦ Χριστοῦ
  choice: അവനുള്ളവർ
  rationale: ജനിറ്റീവ് ബന്ധം ഉടമസ്ഥതയെയോ ചേർച്ചയെയോ സൂചിപ്പിക്കുന്നു. തൊട്ടുമുമ്പുള്ള ‘മശീഹായുടെ വരവിൽ’ എന്ന പരാമർശം കാരണം ‘അവനുള്ളവർ’ വ്യക്തവും അനാവർത്തനപരവുമാണ്.
- source_word: παρουσίᾳ
  choice: വരവിൽ
  rationale: παρουσία സാന്നിധ്യം, എത്തിച്ചേരൽ, വരവ് എന്നിവ സൂചിപ്പിക്കാം. പൗലോസിന്റെ ഈ ഭാവികാലസന്ദർഭത്തിൽ ‘വരവ്’ സാധാരണ വായനക്കാരന് സംഭവത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു; മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദം പദവിയായോ പേരുപോലെയോ വിവർത്തനം ചെയ്യുക
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ മശീഹായെയും അവനുള്ളവരെയും ഉയിർത്തെഴുന്നേൽപ്പിന്റെ ക്രമത്തിൽ വേർതിരിച്ചുപറയുന്നതിനാൽ പദവിയർഥം ശ്രദ്ധേയമാണ്. ‘മശീഹാ’ ആ അർഥം നേരിട്ട് സംരക്ഷിക്കുന്നു; പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: παρουσία എന്നതിന് സാങ്കേതികമായ അന്ത്യകാലപദം നൽകണമോ
  choice: വരവ്
  alternative: സാന്നിധ്യം അല്ലെങ്കിൽ ആഗമനം
  rationale: മശീഹായ്ക്കുള്ളവർ ഉയിർത്തെഴുന്നേൽക്കുന്ന ഭാവിസംഭവമാണ് സന്ദർഭം. ‘വരവ്’ അതു വ്യക്തമായി അറിയിക്കുമ്പോഴും ഗ്രീക്ക് പദത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവിശദാംശങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ἀπαρχὴ Χριστός എന്ന സംക്ഷിപ്തഘടനയിലെ ബന്ധം
  choice: ആദ്യഫലമായി മശീഹാ
  alternative: ആദ്യഫലമായ മശീഹാ
  rationale: ഗ്രീക്ക് ഘടന മശീഹായെ ആദ്യഫലമായി തിരിച്ചറിയുന്നു. ‘ആദ്യഫലമായി’ ഈ തിരിച്ചറിയൽ വ്യക്തമാക്കുന്നു; ഉപമയോ വെറും വിശേഷണമോ ആയി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘താന്താന്റെ ക്രമത്തിൽ’ എന്നത് വിതരണാർഥവും സ്വാഭാവിക മലയാളപ്രയോഗവും സംരക്ഷിക്കുന്നു. വാക്യത്തിലെ സംക്ഷിപ്തമായ പട്ടികാസ്വഭാവം കോളനും അർദ്ധവിരാമവുംകൊണ്ട് നിലനിർത്തി.
