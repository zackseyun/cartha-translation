  to: 'എന്നാൽ ഓരോരുത്തനും താന്താന്റെ ക്രമത്തിൽ: ആദ്യഫലമായ മശീഹാ; പിന്നെ, അവന്റെ വരവിൽ മശീഹാവിനുള്ളവർ.'
