  text: ἰδοὺ μυστήριον ὑμῖν λέγω· ⸀πάντες οὐ κοιμηθησόμεθα πάντες δὲ ἀλλαγησόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/051.yaml
  text: 'Behold[a], I tell you a mystery: we will not all sleep, but we will all be changed[b],'
translation:
  language: ml
  text: 'ഇതാ, ഞാൻ നിങ്ങളോട് ഒരു രഹസ്യം പറയുന്നു: നമ്മിൽ എല്ലാവരും നിദ്രപ്രാപിക്കുകയില്ല[a]; എന്നാൽ നാമെല്ലാവരും രൂപാന്തരപ്പെടും[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, കൂടുതൽ വ്യാഖ്യാനാത്മകമായി, ‘നമ്മിൽ എല്ലാവരും മരിക്കുകയില്ല.’ ഗ്രീക്കിൽ ‘നിദ്രപ്രാപിക്കുക’ എന്നാണ്; പുനരുത്ഥാനത്തിന്റെ വെളിച്ചത്തിൽ മരണത്തെ സൂചിപ്പിക്കാൻ പുതിയ നിയമത്തിൽ സാധാരണ ഉപയോഗിക്കുന്ന ഒരു രൂപകമാണിത്.
    reason: lexical_alternative
  - marker: b
    text: 'ശ്രദ്ധേയമായ ഒരു പാഠഭേദം ഫലത്തിൽ ഇങ്ങനെ വായിക്കുന്നു: ‘നാമെല്ലാവരും നിദ്രപ്രാപിക്കും; എന്നാൽ നാമെല്ലാവരും രൂപാന്തരപ്പെടുകയില്ല.’ മുഖ്യവാചകം SBLGNTയുടെ പാഠം പിന്തുടരുന്നു.'
    reason: textual_variant
lexical_decisions:
- source_word: ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് വ്യവഹാരസൂചകത്തിന്റെ ഗൗരവവും പ്രഖ്യാപനസ്വഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μυστήριον
  choice: രഹസ്യം
  rationale: വെറും ദുരൂഹപ്രശ്നമല്ല, മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെടുന്നതുമായ ദൈവിക സത്യമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപദമാണിത്.
- source_word: ὑμῖν λέγω
  choice: ഞാൻ നിങ്ങളോട് ... പറയുന്നു
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പ്രഖ്യാപനത്തിന്റെ ശക്തിയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പകരുന്നു.
- source_word: πάντες οὐ κοιμηθησόμεθα
  choice: നാമെല്ലാവരും നിദ്രപ്രാപിക്കുകയില്ല
  rationale: ഗ്രീക്കിലെ ‘ഉറക്കം’ എന്ന മരണരൂപകം നിലനിർത്തുകയും οὐയുടെ വ്യാപ്തി ‘എല്ലാവരും ... ഇല്ല’ എന്ന അർഥത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πάντες δὲ ἀλλαγησόμεθα
  choice: എന്നാൽ നാമെല്ലാവരും രൂപാന്തരപ്പെടും
  rationale: അന്ത്യകാലപരമായ പരിവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ἀλλάσσω എന്ന പദത്തിന്റെ അർഥവും മുൻവാക്യത്തോടുള്ള δέയുടെ വൈരുധ്യവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനസന്ദർഭത്തിലെ ‘നിദ്ര’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: ശാരീരിക മരണത്തിനുള്ള രൂപകമായി ‘നിദ്രപ്രാപിക്കുക’ നിലനിർത്തി
  alternative: ‘മരിക്കുക’ എന്ന് വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക
  rationale: പൗലോസിന്റെ പുനരുത്ഥാനഭാഷയും രൂപകവും സംരക്ഷിക്കുന്നു; അതേസമയം ആത്മാവിന്റെ അവസ്ഥയെക്കുറിച്ചുള്ള പ്രത്യേക ഉപദേശം പരിഭാഷയിൽ ചേർക്കുന്നില്ല.
- issue: വാക്യഭാഗങ്ങളുടെ അർഥവുമായി ബന്ധപ്പെട്ട പാഠഭേദം
  choice: SBLGNTയിലെ ‘നാമെല്ലാവരും നിദ്രപ്രാപിക്കുകയില്ല; എന്നാൽ നാമെല്ലാവരും രൂപാന്തരപ്പെടും’ എന്ന പാഠം മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു
  alternative: ‘നാമെല്ലാവരും നിദ്രപ്രാപിക്കും; എന്നാൽ നാമെല്ലാവരും രൂപാന്തരപ്പെടുകയില്ല’ എന്ന ആശയം നൽകുന്ന ശ്രദ്ധേയമായ പാഠഭേദം
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മൂലപാഠം നേരിട്ട് പരിഭാഷപ്പെടുത്തി; വ്യാഖ്യാനപരമായി പ്രാധാന്യമുള്ള വ്യത്യസ്ത വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘നിദ്രപ്രാപിക്കുക’ എന്നത് അല്പം ഔപചാരികമാണെങ്കിലും മരണത്തിനുള്ള മൂലപാഠത്തിലെ രൂപകവും പുനരുത്ഥാനസന്ദർഭവും വ്യക്തമായി നിലനിർത്തുന്നു; ‘രൂപാന്തരപ്പെടും’ അന്ത്യകാലപരമായ മാറ്റത്തെ സംക്ഷിപ്തമായി പകരുന്നു.
