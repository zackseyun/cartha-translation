id: 1CO.15.45
reference: 1 Corinthians 15:45
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ γέγραπται· Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν· ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζῳοποιοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: ml
  text: 'അങ്ങനെ എഴുതപ്പെട്ടിരിക്കുന്നു: “ആദ്യ മനുഷ്യനായ ആദാം ജീവനുള്ള വ്യക്തിയായിത്തീർന്നു”[a]; ഒടുവിലത്തെ ആദാം ജീവൻ നൽകുന്ന ആത്മാവായിത്തീർന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവനുള്ള ദേഹിയായിത്തീർന്നു.” ഇത് ഉല്പത്തി 2:7-ലെ പരമ്പരാഗത പരിഭാഷയെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ജീവൻ നൽകുന്ന ഒരു ആത്മാവായിത്തീർന്നു.” ഈ പ്രയോഗം ഒടുവിലത്തെ ആദാമിനെ ആദ്യ ആദാമിനോട് വിരുദ്ധമായി വിവരിക്കുന്നു; ഗ്രീക്കിൽ ഇത് ഗുണവാചകമാണ്; ക്രിസ്തുവിനെ വ്യതിരിക്ത വ്യക്തിയായ പരിശുദ്ധാത്മാവുമായി നിർബന്ധമായും നേരിട്ട് സമീകരിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: അതുപോലെ എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: മുൻവാദവുമായി ബന്ധിപ്പിച്ചുകൊണ്ട് തിരുവെഴുത്തിന്റെ പിന്തുണ അവതരിപ്പിക്കുന്ന പ്രയോഗമാണിത്. ‘അതുപോലെ’ οὕτως καί എന്നതിന്റെ ബന്ധകശക്തിയും ‘എഴുതപ്പെട്ടിരിക്കുന്നു’ പതിവായ തിരുവെഴുത്ത്-ഉദ്ധരണി സൂത്രവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἐγένετο
  choice: ആയിത്തീർന്നു
  rationale: സൃഷ്ടിവിവരണത്തിലെ ഫലാവസ്ഥയെയോ മാറ്റത്തെയോ സൂചിപ്പിക്കുന്ന γίνομαι എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: ആദ്യമനുഷ്യൻ
  rationale: ആദാമിനെ ആദ്യ മനുഷ്യനും പ്രതിനിധിയുമായി അവതരിപ്പിച്ച് ഒടുവിലത്തെ ആദാമിനോടുള്ള പൗലോസിന്റെ മാതൃകാപരമായ വിരുദ്ധത സംരക്ഷിക്കുന്നു.
- source_word: Ἀδὰμ
  choice: ആദാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്ഥിരപ്പെട്ട വ്യക്തിനാമരൂപം.
- source_word: εἰς ψυχὴν ζῶσαν
  choice: ജീവനുള്ള ഒരാൾ
  rationale: ഉല്പത്തി 2:7-ന്റെ പ്രതിധ്വനിയിൽ ψυχή വേർപെട്ട അഭൗതിക ഘടകത്തെ മാത്രമല്ല, ജീവിക്കുന്ന വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജീവനുള്ള ഒരാൾ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും മാനവസന്ദർഭത്തിൽ കൃത്യവുമാണ്; പരമ്പരാഗതമായ ‘ജീവനുള്ള ദേഹി’ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: ഒടുവിലത്തെ ആദാം
  rationale: ആദാം–ക്രിസ്തു വിരുദ്ധതയിലുള്ള ἔσχατος എന്നതിന്റെ അന്തിമവും മാതൃകാപരവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: ജീവൻ നൽകുന്ന ആത്മാവ്
  rationale: അനിർദ്ദിഷ്ടവും ഗുണവാചകവുമായ πνεῦμα ζῳοποιοῦν എന്ന പ്രയോഗം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ഉല്പത്തി ഉദ്ധരണിയിലെ ψυχή എന്നതിന്റെ മനുഷ്യശാസ്ത്രപരമായ അർഥം
  choice: ‘ജീവനുള്ള ഒരാൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ജീവനുള്ള ദേഹി’
  rationale: സന്ദർഭത്തിൽ ആദാം ജീവിക്കുന്ന വ്യക്തിയായിത്തീർന്നതാണു മുഖ്യം; വേർപെട്ട ഒരു അഭൗതിക ആത്മാവിനെക്കുറിച്ചുള്ള പ്രത്യേക മനുഷ്യശാസ്ത്രസിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യരുത്. പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ‘ഒടുവിലത്തെ ആദാം ജീവൻ നൽകുന്ന ആത്മാവായിത്തീർന്നു’ എന്നതിന്റെ അർഥം
  choice: ആദാം–ക്രിസ്തു വിരുദ്ധത അക്ഷരാർഥത്തോട് ചേർന്ന് നിലനിർത്തി; ‘ആത്മാവ്’ പൊതുനാമമായി നൽകി.
  alternative: ‘ജീവൻ നൽകുന്ന പരിശുദ്ധാത്മാവായിത്തീർന്നു’ അല്ലെങ്കിൽ ‘ജീവൻ നൽകുന്ന ഒരു ആത്മാവായിത്തീർന്നു’
  rationale: πνεῦμα എന്നതിന് ഗ്രീക്കിൽ നിർദ്ദിഷ്ടാർഥസൂചകമായ ലേഖനമില്ല; പ്രയോഗം ഗുണവാചകമാണ്. അതിനാൽ ക്രിസ്തുവിനെ ത്രിത്വത്തിലെ പരിശുദ്ധാത്മാവെന്ന വ്യക്തിയുമായി നേരിട്ട് സമീകരിക്കുകയോ മലയാളത്തിൽ അസ്വാഭാവികമായ അനിർദ്ദിഷ്ടത ചേർക്കുകയോ ചെയ്യാതെ പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയുടെ തിരുവെഴുത്തുസ്വരം നിലനിർത്തിക്കൊണ്ട് ‘ദേഹി’ പോലുള്ള ഇന്നത്തെ സാധാരണ വായനയിൽ കുറച്ച് അപരിചിതമായ പദം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട വാചകഭാഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തിട്ടുണ്ട്.
