    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അദ്ദേഹം യാക്കോബിന് കാണപ്പെട്ടു … എല്ലാ അപ്പൊസ്തലന്മാർക്കും കാണപ്പെട്ടു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: പിന്നെ
  rationale: ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തുവിന്റെ പ്രത്യക്ഷതകളുടെ ക്രമത്തിലെ അടുത്ത സംഭവത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ὁράω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണിരൂപമാണെങ്കിലും, ഉയിർത്തെഴുന്നേറ്റശേഷമുള്ള പ്രത്യക്ഷതകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം ‘പ്രത്യക്ഷനായി’ എന്നാണ്.
- source_word: Ἰακώβῳ
  choice: യാക്കോബിന്
  rationale: ὤφθη എന്ന ക്രിയയോടു ചേർന്ന ദത്തിവ്; പേരിന്റെ ഗ്രീക്ക് രൂപത്തോട് ചേർന്നുനിൽക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപമാണ് ‘യാക്കോബ്’.
- source_word: εἶτα
  choice: അതിനുശേഷം
  rationale: രണ്ടാമത്തെ ക്രമസൂചക അവ്യയത്തെ വ്യക്തമായി അവതരിപ്പിക്കുകയും സംഭവങ്ങളുടെ പടിപടിയായ ക്രമം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀποστόλοις
  choice: അപ്പൊസ്തലന്മാർക്കും
  rationale: ഈ സന്ദർഭത്തിൽ പൊതുവായ ദൂതന്മാരെയല്ല, നിയോഗിക്കപ്പെട്ട സാക്ഷികളുടെ അംഗീകൃത കൂട്ടത്തെയാണ് പദം സൂചിപ്പിക്കുന്നത്; അതിനാൽ സാങ്കേതിക അർഥം നിലനിർത്തി.
- source_word: πᾶσιν
  choice: എല്ലാ
  rationale: അപ്പൊസ്തലന്മാരുടെ മുഴുവൻ കൂട്ടത്തെയും ഊന്നിപ്പറയുന്ന പദത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
theological_decisions:
- issue: യാക്കോബുമായുള്ള ബന്ധത്തിൽ ‘എല്ലാ അപ്പൊസ്തലന്മാരും’ എന്നതിന്റെ വ്യക്തിത്വവും വ്യാപ്തിയും
  choice: ‘എല്ലാ അപ്പൊസ്തലന്മാർക്കും’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തി, ആരെല്ലാമാണ് ഉൾപ്പെടുന്നതെന്ന് ചുരുക്കി നിർവചിക്കാതിരിക്കുക.
  alternative: ഇത് പന്ത്രണ്ടുപേരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നോ, പന്ത്രണ്ടുപേരിൽനിന്ന് വേറിട്ട വിശാലമായ നിയോഗിതസാക്ഷികളുടെ കൂട്ടമാണെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠം ഈ കൂട്ടത്തിന്റെ കൃത്യമായ അംഗത്വം നിർവചിക്കുന്നില്ല. അതിനാൽ യാക്കോബിനുണ്ടായ പ്രത്യക്ഷതയും തുടർന്ന് ‘എല്ലാ അപ്പൊസ്തലന്മാർക്കും’ ഉണ്ടായ പ്രത്യക്ഷതയും തമ്മിലുള്ള പൗലോസിന്റെ വേർതിരിവ് വ്യാഖ്യാനത്തിലൂടെ പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘പ്രത്യക്ഷനായി’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കെ ഗ്രീക്കിലെ ഉയിർത്തെഴുന്നേൽപ്പു-പ്രത്യക്ഷതാ പ്രയോഗം കൃത്യമായി നൽകുന്നു. പ്രധാന പാഠത്തിലെ [a] അടയാളം അടിക്കുറിപ്പുമായി പൊരുത്തപ്പെടുന്നു.
