translation:
  language: ml
  text: പിന്നെ അദ്ദേഹം യാക്കോബിന് പ്രത്യക്ഷനായി[a]; അതിനുശേഷം എല്ലാ അപ്പൊസ്തലന്മാർക്കും പ്രത്യക്ഷനായി.
  philosophy: optimal-equivalence
  footnotes:
