revisions:
- from: സഹോദരങ്ങളേ, ഞാൻ നിങ്ങളോടു പ്രസംഗിച്ച സുവാർത്ത നിങ്ങളെ അറിയിക്കുന്നു[a]. നിങ്ങൾ അതു സ്വീകരിച്ചു; അതിൽ നിങ്ങൾ ഉറച്ചുനിൽക്കുകയും ചെയ്യുന്നു.
  to: സഹോദരങ്ങളേ, ഞാൻ നിങ്ങളോടു പ്രസംഗിച്ച സുവാർത്ത നിങ്ങളെ അറിയിക്കുന്നു; നിങ്ങളും അതു ഏറ്റുവാങ്ങി അതിൽ നിലകൊള്ളുകയും ചെയ്യുന്നു.[a]
