  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: ml
  text: സഹോദരങ്ങളേ, ഞാൻ നിങ്ങളോടു പ്രസംഗിച്ച സുവാർത്ത നിങ്ങളെ അറിയിക്കുന്നു; നിങ്ങളും അതു ഏറ്റുവാങ്ങി അതിൽ നിലകൊള്ളുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരങ്ങളേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്ന പുല്ലിംഗരൂപമാണ്, എന്നാൽ വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യാൻ ഈ രൂപം പലപ്പോഴും ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: അറിയിക്കുന്നു
  rationale: വർത്തമാനകാല സജീവക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘അറിയിക്കുക’ എന്നതാണ്. സന്ദർഭത്തിൽ മുൻപ് പ്രസംഗിച്ച സുവാർത്ത വീണ്ടും മുന്നോട്ടുവെക്കുന്നതാണെങ്കിലും, ‘ഓർമിപ്പിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലപദത്തിൽ ഇല്ലാത്ത അർഥം മുൻനിറുത്തും.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇത് ശക്തമായ വൈരുധ്യമല്ല, നേരിയ പ്രകരണപരിവർത്തനമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ വാക്യക്രമവും അഭിസംബോധനയും ആ മാറ്റം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന നേരിട്ട് നിലനിർത്തുന്നു. പൗലൊസിന്റെ പ്രയോഗത്തിൽ ഇത് വിശ്വാസസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὸ εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: ‘നല്ല വാർത്ത’ എന്ന അടിസ്ഥാനാർഥം വഹിക്കുന്നതും ആധുനിക മലയാള ക്രൈസ്തവഭാഷയിൽ സ്വാഭാവികവും പൊതുവായി മനസ്സിലാകുന്നതുമായ പദമാണ്.
- source_word: εὐηγγελισάμην
  choice: പ്രസംഗിച്ച
  rationale: സുവാർത്ത അറിയിച്ച മുൻകാല പ്രവർത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘സുവാർത്ത അറിയിച്ച’ എന്ന ആവർത്തനത്തേക്കാൾ വായനാസൗകര്യമുണ്ട്.
- source_word: παρελάβετε
  choice: സ്വീകരിച്ചു
  rationale: സന്ദേശമോ പാരമ്പര്യമോ ഏറ്റുവാങ്ങുക എന്ന വിശാല അർഥം നിലനിർത്തുന്നു; വ്യക്തിപരമായ സമ്മതം കൂടുതൽ ശക്തമായി സൂചിപ്പിക്കുന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐν ᾧ
  choice: അതിൽ
  rationale: സുവാർത്തയെ വിശ്വാസികൾ നിലകൊള്ളുന്ന മണ്ഡലമോ അടിസ്ഥാനമോ ആയി അവതരിപ്പിക്കുന്ന രൂപകം സംരക്ഷിക്കുന്നു; അടുത്ത വാക്യത്തിലെ ആശയം മുൻകൂട്ടി കൊണ്ടുവരുന്ന ‘അതിലൂടെ’ ഒഴിവാക്കുന്നു.
- source_word: ἑστήκατε
  choice: ഉറച്ചുനിൽക്കുന്നു
  rationale: പൂർണ്ണകാലക്രിയ സൂചിപ്പിക്കുന്ന, മുൻപ്രവർത്തിയുടെ ഫലമായി തുടരുന്ന നിലവിലെ സ്ഥിരാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സമ്മിശ്ര വിശ്വാസസമൂഹത്തോടുള്ള ἀδελφοί എന്ന അഭിസംബോധന
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരങ്ങളേ’; സമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗമാകാമെന്ന് അടിക്കുറിപ്പ്
  alternative: ‘സഹോദരീസഹോദരങ്ങളേ’
  rationale: മൂലത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം മറയ്ക്കാതെ നിലനിർത്തുകയും, പൗലൊസിന്റെ സഭാഭിസംബോധനയിലെ ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: ἑστήκατε എന്നതിലെ സ്ഥിരതയുടെ ഭാവം
  choice: ‘ഉറച്ചുനിൽക്കുന്നു’ എന്ന് പരിഭാഷപ്പെടുത്തി തുടരുന്ന അവസ്ഥ പ്രകടിപ്പിച്ചു
  alternative: ‘നിൽക്കുന്നു’
  rationale: ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഫലാവസ്ഥ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വിശ്വാസിയുടെ അന്തിമസ്ഥിരതയെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം ഇതിലൂടെ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ നീണ്ട ബന്ധവാക്യഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി വായനാസൗകര്യം വർധിപ്പിച്ചു; ആവർത്തിച്ച καὶ-കളുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘-ഉം ചെയ്യുന്നു’ വഴി ഭാഗികമായി നിലനിർത്തി.
