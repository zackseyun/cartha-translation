id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: ml
  text: 'സഹോദരന്മാരേ,[a] ഞാൻ ഇതു പറയുന്നു: മാംസവും രക്തവും ദൈവരാജ്യം അവകാശമാക്കാൻ കഴിയില്ല; നശ്വരമായത് അനശ്വരതയെ അവകാശമാക്കുന്നുമില്ല.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിൽ “സഹോദരന്മാരേ” എന്നാണ്, എന്നാൽ ഈ സംബോധന മുഴുവൻ സഭയെയും ഉൾപ്പെടുത്തി ഉപയോഗിച്ചിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “മാംസവും രക്തവും” എന്നത് ഇപ്പോഴത്തെ മരണാധീനമായ മനുഷ്യജീവിതത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; ഇത് ശരീരത്തോടെയുള്ള പുനരുത്ഥാനത്തെ നിഷേധിക്കുന്നില്ല.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: ഞാൻ പറയുന്നത് ഇതാണ്
  rationale: δέയുടെ സന്ദർഭബന്ധം മലയാളത്തിലെ സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ സൂചിപ്പിക്കുകയും, പൗലോസിന്റെ നേരിട്ടുള്ള വിശദീകരണശൈലി നിലനിർത്തുകയും ചെയ്യുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയെ കൃത്യമായി നിലനിർത്തുന്നു; മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: σὰρξ καὶ αἷμα
  choice: മാംസരക്തങ്ങൾക്ക്
  rationale: മരണാധീനമായ ഇപ്പോഴത്തെ മനുഷ്യാവസ്ഥയെ സൂചിപ്പിക്കുന്ന ‘മാംസവും രക്തവും’ എന്ന പ്രയോഗത്തിന്റെ രൂപവും പ്രതിധ്വനിയും സംക്ഷിപ്തമായ മലയാള സംയുക്തരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: βασιλείαν θεοῦ
  choice: ദൈവരാജ്യം
  rationale: θεοῦ എന്ന ബന്ധത്തെ സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: അവകാശമാക്കാൻ / അവകാശമാക്കുന്നു
  rationale: κληρονομέωയുടെ പൈതൃകാവകാശത്തിന്റെയും അന്തിമകാല പ്രാപ്തിയുടെയും ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും രണ്ടു പ്രയോഗങ്ങളിലെയും സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐ δύναται
  choice: കഴിയില്ല
  rationale: അസാധ്യതയെ ലളിതവും കൃത്യവുമായി അറിയിക്കുന്നു.
- source_word: ἡ φθορά
  choice: നശ്വരമായത്
  rationale: ക്ഷയത്തിനും നാശത്തിനും വിധേയമായ അവസ്ഥയെ സൂചിപ്പിക്കുകയും ἀφθαρσίαയുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: τὴν ἀφθαρσίαν
  choice: അനശ്വരതയെ
  rationale: ക്ഷയമില്ലായ്മ എന്ന ആശയം കൃത്യമായി നൽകുന്നു; ‘അമർത്യത’ എന്നു വിവർത്തനം ചെയ്ത് ἀθανασίαയുമായി ലയിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനവുമായി ബന്ധപ്പെട്ട് ‘മാംസരക്തങ്ങൾ’ എന്നതിന്റെ അർഥം
  choice: ഇപ്പോഴത്തെ മരണാധീനവും നശ്വരവുമായ മനുഷ്യജീവിതത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമായി നിലനിർത്തുന്നു.
  alternative: ഭൗതിക ശരീരതയ്ക്കുതന്നെ ദൈവരാജ്യത്തിൽ പ്രവേശിക്കാനാവില്ലെന്ന പ്രസ്താവനയായി വ്യാഖ്യാനിക്കുക.
  rationale: അടുത്ത സന്ദർഭത്തിൽ പൗലോസ് ശരീരത്തിന്റെ ഉപേക്ഷണമല്ല, നശ്വരമായതിൽനിന്ന് അനശ്വരമായതിലേക്കുള്ള രൂപാന്തരമാണ് പഠിപ്പിക്കുന്നത്. അതിനാൽ മുഖ്യപാഠം പ്രയോഗം സംരക്ഷിക്കുകയും തെറ്റിദ്ധാരണ അടിക്കുറിപ്പിൽ തടയുകയും ചെയ്യുന്നു.
- issue: ἀδελφοί എന്ന സംബോധനയുടെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്ന് നിലനിർത്തി, മുഴുവൻ സഭയെയും ഉൾക്കൊള്ളാവുന്ന അർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
  alternative: മുഖ്യപാഠത്തിൽ ‘സഹോദരീസഹോദരന്മാരേ’ എന്നു നൽകുക.
  rationale: മൂലത്തിലെ വ്യാകരണരൂപം സംരക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിലെ സാധ്യതയുള്ള ഉൾക്കൊള്ളുന്ന പ്രയോഗം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ രണ്ടു κληρονομέω പ്രയോഗങ്ങളുടെ സമാന്തരത ‘അവകാശമാക്കുക’ എന്ന ആവർത്തനത്തിലൂടെ നിലനിർത്തി. അടിക്കുറിപ്പ് [a] ബന്ധപ്പെട്ട സംബോധനയ്ക്കുശേഷവും [b] വ്യാഖ്യാനം ആവശ്യമായ മുഴുവൻ പ്രസ്താവനയ്ക്കുശേഷവും ചേർത്തിരിക്കുന്നു.
