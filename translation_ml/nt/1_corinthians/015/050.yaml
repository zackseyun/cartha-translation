- from: 'സഹോദരന്മാരേ,[a] ഞാൻ പറയുന്നത് ഇതാണ്: മാംസരക്തങ്ങൾക്ക് ദൈവരാജ്യം അവകാശമാക്കാൻ കഴിയില്ല; നശ്വരമായത് അനശ്വരതയെ അവകാശമാക്കുന്നുമില്ല.[b]'
  to: 'സഹോദരന്മാരേ,[a] ഞാൻ ഇതു പറയുന്നു: മാംസവും രക്തവും ദൈവരാജ്യം അവകാശമാക്കാൻ കഴിയില്ല; നശ്വരമായത് അനശ്വരതയെ അവകാശമാക്കുന്നുമില്ല.[b]'
