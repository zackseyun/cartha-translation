reference: 1 Corinthians 15:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: ml
  text: എല്ലാ മാംസവും ഒരേ മാംസമല്ല[a]; മനുഷ്യരുടെ മാംസം ഒരുതരം, മൃഗങ്ങളുടെ മാംസം മറ്റൊന്ന്, പക്ഷികളുടെ മാംസം വേറൊന്ന്, മീനുകളുടേത് മറ്റൊന്ന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ ഭാവാനുസൃതമായി: “എല്ലാത്തരം മാംസവും ഒരുപോലെയല്ല.”'
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ ചേർന്ന്: “മനുഷ്യരുടേത് വേറെ, മൃഗങ്ങളുടെ മാംസം വേറെ, പക്ഷികളുടെ മാംസം വേറെ, മീനുകളുടേത് വേറെ.”'
    reason: source_structure
lexical_decisions:
- source_word: σὰρξ
  choice: മാംസം
  rationale: ഇവിടെ പാപസ്വഭാവം എന്ന രൂപകാലങ്കാരിക അർഥമല്ല, സൃഷ്ടജീവികളുടെ ഭൗതിക മാംസമാണ് ഉദ്ദേശിക്കുന്നത്. അതിനാൽ പൗലൊസിന്റെ ആവർത്തനവും വിവിധ ജീവിവർഗങ്ങൾ തമ്മിലുള്ള വ്യത്യാസവും നിലനിർത്താൻ ‘മാംസം’ ഉപയോഗിച്ചു.
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: എല്ലാ മാംസവും ഒരേ മാംസമല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധവും σάρξ എന്ന പദത്തിന്റെ ആവർത്തനവും നേരിട്ട് സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ വ്യക്തമായ പ്രയോഗമാണിത്.
- source_word: ἄλλη
  choice: ഒരുതരം ... മറ്റൊന്ന് ... വേറൊന്ന് ... ഇനിയും മറ്റൊന്ന്
  rationale: ἄλλη സൂചിപ്പിക്കുന്ന വർഗപരമായ വ്യത്യാസം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നതിനൊപ്പം പട്ടികയുടെ ആവർത്തനതാളവും നിലനിർത്തുന്നു.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ബഹുവചന ജനിറ്റീവാണ്.
- source_word: κτηνῶν
  choice: മൃഗങ്ങളുടെ
  rationale: κτηνῶν വളർത്തുമൃഗങ്ങളെയോ മൃഗങ്ങളെ പൊതുവായോ സൂചിപ്പിക്കാം. ഈ സൃഷ്ടജീവിവർഗങ്ങളുടെ പട്ടികയിൽ ‘മൃഗങ്ങൾ’ എന്നത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: πτηνῶν
  choice: പക്ഷികളുടെ
  rationale: പറക്കുന്ന ജീവികൾ എന്ന വിശാലസാധ്യത ഉണ്ടായാലും ഈ പട്ടികയിൽ ‘പക്ഷികൾ’ ആണ് സാധാരണവും സന്ദർഭോചിതവുമായ അർഥം.
- source_word: ἰχθύων
  choice: മീനുകളുടെ
  rationale: ഗ്രീക്ക് ബഹുവചനം ജലജീവികളുടെ ഈ പൊതുവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ ‘മീനുകൾ’ സ്വാഭാവികമാണ്.
- source_word: σὰρξ κτηνῶν / σὰρξ πτηνῶν / ἰχθύων
  choice: മൃഗങ്ങളുടെ മാംസം ... പക്ഷികളുടെ മാംസം ... മീനുകളുടേത്
  rationale: മൃഗങ്ങൾക്കും പക്ഷികൾക്കും ഗ്രീക്ക് σάρξ ആവർത്തിക്കുന്നു; അവസാന ഭാഗത്ത് അത് അധ്യാഹരിക്കുന്നു. മലയാളവും ആദ്യ രണ്ടിടങ്ങളിൽ ‘മാംസം’ ആവർത്തിച്ച് അവസാനത്ത് ‘മീനുകളുടേത്’ എന്നു സ്വാഭാവികമായി അധ്യാഹരിക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ ഈ വാക്യത്തിലെ σάρξ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: അക്ഷരാർഥത്തിലുള്ള ‘മാംസം’
  alternative: ശരീരം; പ്രകൃതി; പാപസ്വഭാവം
  rationale: ഉയിർപ്പിനെയും സൃഷ്ടജീവികളുടെ ഭൗതിക വൈവിധ്യത്തെയും കുറിച്ചുള്ള സന്ദർഭമാണിത്. അതിനാൽ രൂപകാലങ്കാരികമായ ‘പാപസ്വഭാവം’ എന്ന അർഥം ചേർക്കാതെ അക്ഷരാർഥം നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ആദ്യവാക്യത്തിൽ മൂലത്തിലെ ‘മാംസം’ എന്ന ആവർത്തനം നിലനിർത്തി; തുടർന്നുള്ള പട്ടികയിൽ ‘ഒരുതരം/മറ്റൊന്ന്’ എന്ന സ്വാഭാവിക മലയാളഘടനയിലൂടെ വർഗവ്യത്യാസം വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
