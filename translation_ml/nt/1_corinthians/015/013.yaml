source:
  edition: SBLGNT
  text: εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/013.yaml
  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: ml
  text: എന്നാൽ മരിച്ചവരുടെ പുനരുത്ഥാനം ഇല്ലെങ്കിൽ, മശീഹാപോലും ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ക്രിസ്തുപോലും ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദം ‘ക്രിസ്തു’ എന്നോ, അതിന്റെ പദവിയാർഥം വ്യക്തമാക്കാൻ ‘മശീഹാ’ എന്നോ നൽകാം. ‘ഉയിർത്തെഴുന്നേറ്റിട്ടില്ല’ എന്നും പറയാം; എന്നാൽ ഗ്രീക്ക് ക്രിയ കർമണിരൂപത്തിലാണ്—പ്രവർത്തകനെ നേരിട്ട് പറയാതെ ‘ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല’ എന്ന അർഥം.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ … ഇല്ലെങ്കിൽ
  rationale: εἰ എന്ന വ്യവസ്ഥയും δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വിരുദ്ധതയും വാദത്തിന്റെ തുടർച്ചയിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀνάστασις νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: മരിച്ചവരെ ഒരു വിഭാഗമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് സമാസബന്ധം കൃത്യമായി സംരക്ഷിക്കുന്നു; ‘മരിച്ചവരിൽനിന്നുള്ള’ എന്ന് മാറ്റി ഉറവിടാർഥം വരുത്തുന്നില്ല.
- source_word: οὐκ ἔστιν
  choice: ഇല്ല
  rationale: പുനരുത്ഥാനത്തിന്റെ യാഥാർഥ്യമോ അസ്തിത്വമോ നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: οὐδὲ
  choice: …യും … ഇല്ല
  rationale: വ്യവസ്ഥയിൽനിന്നുള്ള ‘പോലും അല്ല’ എന്ന ശക്തമായ നിഗമനം മലയാളത്തിലെ ഉൾക്കൊള്ളുന്ന ‘-യും’ ഘടനയിലൂടെ സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: ഇവിടെ അഭിഷിക്തൻ എന്ന പദവിയാർഥം പ്രസക്തമായതിനാൽ Χριστός എന്ന ശീർഷകം ‘മശീഹാ’ എന്നു നൽകുന്നു.
- source_word: ἐγήγερται
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല
  rationale: പൂർണ്ണകാലത്തിന്റെ നിലവിലുള്ള പ്രസക്തിയും കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു; പ്രവർത്തകനെ—സന്ദർഭത്തിൽ ദൈവത്തെ—വാക്യത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ അവതരണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പദവിയാർഥം മുൻനിർത്തപ്പെടുന്നു; അതിനാൽ ശീർഷകത്തിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ സ്വീകരിച്ചു, പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
- issue: ἐγήγερται എന്ന ക്രിയയുടെ വാച്യം
  choice: ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല
  alternative: ഉയിർത്തെഴുന്നേറ്റിട്ടില്ല
  rationale: ഗ്രീക്കിലെ കർമണിരൂപം സംരക്ഷിച്ച് പ്രവർത്തകനെ വ്യക്തമാക്കാതെ വിടുന്നു; സജീവസ്വഭാവമുള്ള പര്യായം മൂലവാക്യത്തിലെ ദൈവിക കർമണി സൂചന മങ്ങിച്ചേക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പൗലോസിന്റെ വ്യവസ്ഥാപരമായ നിഗമനം സംക്ഷിപ്തമായി നിലനിർത്തി; ദൈവത്തെ പ്രവർത്തകനായി വ്യാഖ്യാനിച്ച് ചേർക്കാതെ ഗ്രീക്കിലെ കർമണിരൂപവും മശീഹാ എന്ന പദവിയാർഥവും സംരക്ഷിച്ചു.
