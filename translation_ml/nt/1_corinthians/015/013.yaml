- from: എന്നാൽ മരിച്ചവരുടെ പുനരുത്ഥാനം ഇല്ലെങ്കിൽ, മശീഹായും ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല.[a]
  to: എന്നാൽ മരിച്ചവരുടെ പുനരുത്ഥാനം ഇല്ലെങ്കിൽ, മശീഹാപോലും ഉയിർപ്പിക്കപ്പെട്ടിട്ടില്ല.[a]
  rationale: The revision preserves every element of the source while making οὐδέ’s emphatic ‘not even’ explicit through ‘പോലും.’ The footnote is adjusted for consistency with the verse’s negated perfect-passive wording; no theological agent is added.
