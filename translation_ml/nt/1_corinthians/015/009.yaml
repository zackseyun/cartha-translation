revisions:
- from: അപ്പൊസ്തലന്മാരിൽ ഏറ്റവും ചെറിയവൻ ഞാനാണ്. ദൈവത്തിന്റെ സഭയെ ഞാൻ പീഡിപ്പിച്ചതിനാൽ അപ്പൊസ്തലൻ എന്നു വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല.[a]
