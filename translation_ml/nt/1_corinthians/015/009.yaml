id: 1CO.15.9
reference: 1 Corinthians 15:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: ml
  text: കാരണം, ഞാൻ അപ്പൊസ്തലന്മാരിൽ ഏറ്റവും ചെറിയവനാണ്; ദൈവത്തിന്റെ സഭയെ ഞാൻ പീഡിപ്പിച്ചതിനാൽ അപ്പൊസ്തലൻ എന്നു വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അപ്പൊസ്തലൻ എന്നു വിളിക്കപ്പെടാൻ തക്കവനല്ല” അല്ലെങ്കിൽ “മതിയായ യോഗ്യതയുള്ളവനല്ല.”
    reason: ἱκανός എന്ന പദത്തിന് ‘യോഗ്യൻ’ എന്നതിനുപുറമേ ‘തക്കവൻ’ എന്നും ‘മതിയായ യോഗ്യതയുള്ളവൻ’ എന്നും അർഥമുണ്ടാകാം.
lexical_decisions:
- source_word: γάρ
  choice: ആണ് (വാക്യത്തിന്റെ വിശദീകരണബന്ധം സന്ദർഭത്തിലൂടെ)
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിൽ നിലനിർത്തുന്നു; പ്രത്യേകം ‘എന്തെന്നാൽ’ ചേർത്താൽ ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമാകാം.
- source_word: ἐλάχιστος
  choice: ഏറ്റവും ചെറിയവൻ
  rationale: ശാരീരിക വലുപ്പമല്ല, അപ്പൊസ്തലന്മാരുടെ ഇടയിലെ പദവി/പ്രാധാന്യത്തിന്റെ താഴ്മയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ വിനയഭാവവും താരതമ്യവും നിലനിർത്തുന്നു.
- source_word: ἀπόστολος / ἀποστόλων
  choice: അപ്പൊസ്തലൻ / അപ്പൊസ്തലന്മാർ
  rationale: ഇവിടെ പൊതുവായ ദൂതന്മാരെയല്ല, അംഗീകരിക്കപ്പെട്ട അപ്പൊസ്തലിക കൂട്ടത്തെയും സ്ഥാനത്തെയും സൂചിപ്പിക്കുന്ന സാങ്കേതിക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἱκανός
  choice: യോഗ്യൻ
  rationale: ἱκανός എന്നതിന് യോഗ്യതയുള്ള, തക്ക, മതിയായ എന്നീ അർഥസാധ്യതകളുണ്ട്. മുൻകാല പീഡനത്തെ ആധാരമാക്കിയ പൗലോസിന്റെ സ്വയംതാഴ്ത്തലിൽ ‘യോഗ്യൻ’ സ്വാഭാവികമാണ്; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καλεῖσθαι
  choice: വിളിക്കപ്പെടാൻ
  rationale: ഗ്രീക്കിലെ കർമണി അനന്തക്രിയാരൂപം നേരെയും സ്വാഭാവികമായും സംരക്ഷിക്കുന്നു.
- source_word: διότι
  choice: …തിനാൽ
  rationale: പൗലോസ് താൻ യോഗ്യനല്ലെന്ന് പറയുന്നതിന്റെ വ്യക്തമായ കാരണം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐδίωξα
  choice: ഞാൻ പീഡിപ്പിച്ചു
  rationale: വിശ്വാസസമൂഹത്തിനെതിരായ പൗലോസിന്റെ മുൻകാല ശത്രുതാപരമായ പ്രവർത്തനത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭ
  rationale: ദൈവത്തിന്റേതായ വിശ്വാസിസമൂഹം എന്ന ജനിറ്റീവ് ബന്ധവും സഭ എന്ന പൗലോസിന്റെ സഭാസംബന്ധമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: ὃς
  choice: വാക്യഘടനയിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഗ്രീക്കിലെ ബന്ധസർവനാമം വാക്കിന് വാക്കായി ‘ആരായ ഞാൻ’ എന്നു കൊടുക്കുന്നതിനെക്കാൾ, രണ്ട് സ്വാഭാവിക മലയാള വാക്യങ്ങളിലൂടെ അതിന്റെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ സ്വഭാവം
  choice: പൗലോസ് അപ്പൊസ്തലന്മാരിൽ താനും ഉൾപ്പെടുന്നുവെന്ന് ഉറപ്പിക്കുമ്പോൾത്തന്നെ, ആ പേര് വഹിക്കാൻ താൻ യോഗ്യനല്ലെന്ന വിനയം പ്രകടിപ്പിക്കുന്നു.
  alternative: പൗലോസ് തന്റെ അപ്പൊസ്തലത്വം പൂർണമായി നിഷേധിക്കുന്നു; അല്ലെങ്കിൽ ധാർമിക അയോഗ്യതയല്ല, സാമൂഹികമായി താഴ്ന്ന സ്ഥാനം മാത്രമാണ് ഉദ്ദേശിക്കുന്നത്.
  rationale: ‘അപ്പൊസ്തലന്മാരിൽ ഏറ്റവും ചെറിയവൻ ഞാനാണ്’ എന്നത് കൂട്ടത്തിലെ അംഗത്വം സമ്മതിക്കുന്നു; ‘വിളിക്കപ്പെടാൻ ഞാൻ യോഗ്യനല്ല’ എന്നത് സഭയെ പീഡിപ്പിച്ച ഭൂതകാലത്തെ അടിസ്ഥാനമാക്കിയ സ്വയംതാഴ്ത്തലാണ്. പരിഭാഷ ഈ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘അപ്പൊസ്തലൻ’, ‘സഭ’, ‘പീഡിപ്പിച്ചു’ എന്നീ പരിചിതമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിന്റെ അസ്വാഭാവിക ബന്ധവാക്യഘടന മലയാളത്തിൽ രണ്ട് വാക്യങ്ങളാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
