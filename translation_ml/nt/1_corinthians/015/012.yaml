id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: ml
  text: മശീഹ[a] മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു എന്നു പ്രഘോഷിക്കപ്പെടുന്നുവെങ്കിൽ, മരിച്ചവരുടെ പുനരുത്ഥാനം ഇല്ലെന്ന് നിങ്ങളിൽ ചിലർ പറയുന്നത് എങ്ങനെയാണ്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ക്രിസ്തു’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് Χριστός എന്ന പദത്തിന് ‘മശീഹ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥവും ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗത രൂപവും നൽകാം; മുഖ്യവാചകത്തിൽ സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഇവിടെ പദം ഒരു ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; അതിനാൽ ശബ്ദലിപ്യന്തരണം മാത്രം ചെയ്യാതെ അതിന്റെ സ്ഥാനപ്പേര്-അർഥം നിലനിർത്തുന്നു.
- source_word: κηρύσσεται
  choice: പ്രഘോഷിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം തുടരുന്ന പരസ്യപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു; ‘പ്രഘോഷിക്കുക’ κηρύσσω എന്നതിന്റെ വിളംബരസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: ബഹുവചനമായ νεκρῶν എന്നതും ‘അവരുടെ ഇടയിൽനിന്ന്’ എന്ന ἐκ-ന്റെ ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐγήγερται
  choice: ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിരൂപം പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ നിലനിൽക്കുന്ന ഫലത്തെയും സൂചിപ്പിക്കുന്നു; കർമണിരൂപം ദൈവത്തിന്റെ പ്രവർത്തനത്തെ പരോക്ഷമായി തുറന്നുവെക്കുന്നു.
- source_word: πῶς
  choice: എങ്ങനെ
  rationale: ചോദ്യത്തിന്റെ വാചാടോപപരമായ പൊരുത്തക്കേട് മലയാളത്തിലെ സ്വാഭാവികമായ ‘എങ്ങനെ?’ എന്ന രൂപം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ὑμῖν τινες
  choice: നിങ്ങളിൽ ചിലർ
  rationale: കൊരിന്ത്യസമൂഹത്തിനുള്ളിലെ ഒരു വിഭാഗത്തെയാണ് ഈ പ്രയോഗം തിരിച്ചറിയുന്നത്.
- source_word: ἀνάστασις νεκρῶν
  choice: മരിച്ചവരുടെ പുനരുത്ഥാനം
  rationale: പൊതുവായ മരിച്ചവരുടെ ഉയിർത്തെഴുന്നേൽപ്പിനെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗവും ജനിറ്റീവ് ബന്ധവും നിലനിർത്തുന്നു.
- source_word: οὐκ ἔστιν
  choice: ഇല്ല
  rationale: അസ്തിത്വം നിഷേധിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് മലയാളത്തിലെ ഏറ്റവും സ്വാഭാവികവും നേരിട്ടുമുള്ള തുല്യരൂപമാണിത്.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിൽ Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ Χριστός സ്ഥാനപ്പേരിന്റെ അർഥഭാരം വഹിക്കുന്നു. ‘മശീഹ’ ആ സ്ഥാനപ്പേര്-അർഥം വ്യക്തമാക്കുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐγήγερται എന്ന കർമണിരൂപത്തിലെ പ്രവർത്താവ്
  choice: പ്രവർത്താവിനെ വ്യക്തമാക്കാതെ ‘ഉയിർപ്പിക്കപ്പെട്ടിരിക്കുന്നു’
  alternative: ദൈവം ഉയിർപ്പിച്ചിരിക്കുന്നു
  rationale: ഗ്രീക്ക് വാചകം പ്രവർത്താവിനെ നേരിട്ട് പറയുന്നില്ല. ദൈവത്തിന്റെ പ്രവർത്തനം സന്ദർഭത്തിൽ സൂചിതമായിരിക്കാമെങ്കിലും അത് മുഖ്യവാചകത്തിൽ ചേർത്ത് അവ്യക്തത പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവശാസ്ത്രപരമായ സാങ്കേതികത ആവശ്യമായിടത്ത് ‘പുനരുത്ഥാനം’ നിലനിർത്തി; ഗ്രീക്കിലെ കർമണിരൂപവും വാദത്തിലെ ചോദ്യഭാവവും സംരക്ഷിച്ചു.
