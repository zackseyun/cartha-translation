id: 1CO.15.43
reference: 1 Corinthians 15:43
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: ml
  text: അത് അപമാനത്തിൽ വിതയ്ക്കപ്പെടുന്നു; മഹത്ത്വത്തിൽ ഉയിർപ്പിക്കപ്പെടുന്നു. അത് ബലഹീനതയിൽ വിതയ്ക്കപ്പെടുന്നു; ശക്തിയിൽ ഉയിർപ്പിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: വിതയ്ക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗം നിലനിർത്തുകയും വിത്തിനെയും ശരീരത്തെയും ബന്ധിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ‘നടപ്പെടുന്നു’ എന്നതിനെക്കാൾ ‘വിതയ്ക്കപ്പെടുന്നു’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: ἀτιμίᾳ
  choice: അപമാനത്തിൽ
  rationale: δόξῃ എന്നതിനോടുള്ള വിരുദ്ധസമാന്തര്യം വ്യക്തമായി നിലനിർത്തുന്നു; വികാരപരമായ ലജ്ജ മാത്രം സൂചിപ്പിക്കാതെ മാനഹീനമായ അവസ്ഥയെ ഉൾക്കൊള്ളുന്നു.
- source_word: ἐγείρεται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നു
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിലെ ‘ഉയിർപ്പിക്കുക’ എന്ന അർഥവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; പ്രവർത്തകനെ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നില്ല.
- source_word: δόξῃ
  choice: മഹത്ത്വത്തിൽ
  rationale: പുനരുത്ഥാനസന്ദർഭത്തിലെ δόξαയുടെ വിശാലവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ അർഥം സംരക്ഷിക്കുന്നു; ‘തേജസ്സിൽ’ എന്നത് ദൃശ്യപ്രഭയിലേക്ക് അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
- source_word: ἀσθενείᾳ
  choice: ബലഹീനതയിൽ
  rationale: ശാരീരിക ദൗർബല്യം ഉൾപ്പെടുന്ന പദത്തിന്റെ പൊതുവായ അർഥം നിലനിർത്തുകയും ‘ശക്തി’യോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: δυνάμει
  choice: ശക്തിയിൽ
  rationale: δύναμις എന്നതിന്റെ സ്വാഭാവിക മലയാളസമാനപദം; പുനരുത്ഥാനജീവന്റെ ശക്തിയെ വെറും പേശിബലമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പുനരുത്ഥാനപ്രയോഗത്തിലെ കർമണിവാചകവും പ്രവർത്തകനും
  choice: ‘ഉയിർപ്പിക്കപ്പെടുന്നു’ എന്ന കർമണിരൂപം ഉപയോഗിച്ച് പ്രവർത്തകനായ ദൈവത്തെ മുഖ്യപാഠത്തിൽ പരാമർശിക്കാതെ വിടുന്നു.
  alternative: ‘ദൈവം അതിനെ ഉയിർപ്പിക്കുന്നു’
  rationale: ഗ്രീക്ക് പാഠം കർമണിപ്രയോഗമാണ് ഉപയോഗിക്കുന്നത്. അതു നിലനിർത്തുന്നത് ദൈവിക പ്രവർത്തകത്വം സൂചിതമായിത്തന്നെ തുടരാൻ അനുവദിക്കുന്നു.
- issue: വ്യക്തമായി പറയാത്ത കർത്താവിന്റെ സൂചകം
  choice: തൊട്ടുമുൻപുള്ള സന്ദർഭത്തിലെ ശരീരത്തെ സൂചിപ്പിക്കാൻ ‘അത്’ ഉപയോഗിക്കുന്നു.
  alternative: ‘ശരീരം വിതയ്ക്കപ്പെടുന്നു ... ശരീരം ഉയിർപ്പിക്കപ്പെടുന്നു’
  rationale: ഗ്രീക്കിൽ കർത്താവ് വാക്യത്തിൽ ആവർത്തിക്കപ്പെടുന്നില്ല; സന്ദർഭത്തിൽ അത് ശരീരമാണ്. മലയാളത്തിലെ ‘അത്’ ഈ ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു, അനാവശ്യ വിശദീകരണം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ടു സമാന്തര വിരുദ്ധജോടികളും ആവർത്തിക്കുന്ന കർമണിഘടനയും സംരക്ഷിച്ചു.
