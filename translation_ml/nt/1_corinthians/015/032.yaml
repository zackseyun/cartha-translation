reference: 1 Corinthians 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: ml
  text: കേവലം മനുഷ്യരുടെ കാഴ്ചപ്പാടിൽ, ഞാൻ എഫെസൊസിൽ വന്യമൃഗങ്ങളോടു പോരാടിയെങ്കിൽ[a], എനിക്ക് എന്തു പ്രയോജനം? മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നില്ലെങ്കിൽ, “നമുക്ക് തിന്നുകയും കുടിക്കുകയും ചെയ്യാം[c], കാരണം നാളെ നാം മരിക്കും.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “മനുഷ്യനെന്ന നിലയിൽ” അല്ലെങ്കിൽ “കേവലം മാനുഷികമായി പറഞ്ഞാൽ.” ഈ പ്രയോഗം പൗലൊസിന്റെ സംസാരരീതിയെയോ അവൻ പരിഗണിക്കുന്ന കാഴ്ചപ്പാടിനെയോ വിശേഷിപ്പിക്കാം.'
    reason: lexical_alternative
  - marker: c
    text: യെശയ്യാവ് 22:13-ലെ ഉദ്ധരണി അല്ലെങ്കിൽ സൂചന.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: കേവലം മാനുഷികമായ നിലയിൽ പറഞ്ഞാൽ
  rationale: ഈ പ്രയോഗം പൗലൊസിന്റെ സംസാരരീതിയെയോ മാനുഷിക കാഴ്ചപ്പാടിനെയോ സൂചിപ്പിക്കാം. സ്വാഭാവികമായ മലയാളത്തിൽ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐθηριομάχησα
  choice: ഞാൻ വന്യമൃഗങ്ങളോടു പോരാടിയെങ്കിൽ
  rationale: ക്രിയയുടെ നേർചിത്രം സംരക്ഷിക്കുന്നു; ഇത് യഥാർഥ മൃഗങ്ങളെയാണോ ക്രൂരരായ മനുഷ്യ എതിരാളികളെയാണോ സൂചിപ്പിക്കുന്നതെന്ന് മുഖ്യപാഠം തീർപ്പാക്കുന്നില്ല.
- source_word: ἐν Ἐφέσῳ
  choice: എഫെസൊസിൽ
  rationale: സ്ഥലനാമത്തിന്റെ പതിവായ മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: τί μοι τὸ ὄφελος
  choice: എനിക്ക് എന്തു പ്രയോജനം?
  rationale: ചോദ്യത്തിന്റെ വാചാടോപശക്തിയും വ്യക്തിപരമായ പ്രയോജനമെന്ന ആശയവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νεκροὶ
  choice: മരിച്ചവർ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് വിശേഷണത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἐγείρονται
  choice: ഉയിർപ്പിക്കപ്പെടുന്നില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ഉയിർപ്പിക്കൽ മറ്റൊരാളുടെ പ്രവർത്തിയാണെന്ന സൂചന അമിതവിശദീകരണമില്ലാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: Φάγωμεν καὶ πίωμεν
  choice: നമുക്ക് തിന്നുകയും കുടിക്കുകയും ചെയ്യാം
  rationale: ആഹ്വാനാർഥകമായ ഗ്രീക്ക് ക്രിയാരൂപങ്ങളുടെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: കാരണം നാളെ നാം മരിക്കും
  rationale: വർത്തമാനകാലരൂപത്തിന്റെ ഭാവിസൂചന സ്വാഭാവികമായി നൽകുകയും ഉദ്ധരണിയുടെ കാരണം വ്യക്തമാക്കുന്ന γὰρ പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐθηριομάχησα എന്നത് യഥാർഥ വന്യമൃഗങ്ങളോടുള്ള പോരാട്ടമാണോ ക്രൂരരായ മനുഷ്യ എതിരാളികളോടുള്ള സംഘർഷത്തിന്റെ രൂപകമാണോ
  choice: മുഖ്യപാഠത്തിൽ ‘വന്യമൃഗങ്ങളോടു പോരാടി’ എന്ന ഗ്രീക്ക് ചിത്രം നിലനിർത്തി അർഥം തീർപ്പാക്കാതിരിക്കുന്നു.
  alternative: എഫെസൊസിലെ ക്രൂരരായ മനുഷ്യ എതിരാളികളോടുള്ള കടുത്ത പോരാട്ടമായി നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യത്തിന്റെ വാദത്തിന് ഈ ചരിത്രപരമായ ചോദ്യം തീർപ്പാക്കേണ്ടതില്ല; അതിനാൽ മൂലപാഠത്തിലെ ഉദ്ദേശ്യപൂർവമായിരിക്കാവുന്ന സംഘർഷവും ദൃശ്യഭാവവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാചകം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തിയിരിക്കുന്നു; എന്നാൽ ഗ്രീക്കിലെ നിബന്ധനാപരമായ വാദം, കർമണിപ്രയോഗം, വന്യമൃഗങ്ങളുടെ ദൃശ്യം, യെശയ്യാവിലെ ഉദ്ധരണി എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.
