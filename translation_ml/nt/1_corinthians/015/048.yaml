  naturalness: ‘മണ്ണുകൊണ്ടുള്ള മനുഷ്യൻ എങ്ങനെയുള്ളവനോ ... അങ്ങനെയുള്ളവർതന്നെ’ എന്ന ഘടന ഗൗരവമുള്ള ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വചനശൈലിക്ക് യോജിച്ചതുമാണ്. അർധവിരാമം രണ്ട് സമാന്തര അർധവാക്യങ്ങളെ വ്യക്തമായി വേർതിരിക്കുന്നു.
  terminology: ‘മണ്ണുകൊണ്ടുള്ള’ χοϊκός-ന്റെ ആദാമിക/സൃഷ്ടിസന്ദർഭം സൂക്ഷിക്കുന്നു; ‘സ്വർഗീയനായ/സ്വർഗീയരായ’ ἐπουράνιος-ന്റെ വിശേഷണസ്വഭാവം നിലനിർത്തുന്നു. ‘സ്വർഗത്തിൽനിന്നുള്ള’ എന്ന, മുൻവാക്യത്തിന്റെ ഭാഷയെ ഇവിടെ ചേർക്കുന്ന പരിഭാഷ ഒഴിവാക്കിയിരിക്കുന്നത് ഉചിതമാണ്.
