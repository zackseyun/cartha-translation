id: 1CO.15.48
reference: 1 Corinthians 15:48
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: ml
  text: മണ്ണുകൊണ്ടുള്ള മനുഷ്യൻ എങ്ങനെയുള്ളവനോ, മണ്ണുകൊണ്ടുള്ളവരും അങ്ങനെയുള്ളവർതന്നെ; സ്വർഗീയനായ മനുഷ്യൻ എങ്ങനെയുള്ളവനോ, സ്വർഗീയരായവരും അങ്ങനെയുള്ളവർതന്നെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: എങ്ങനെയുള്ളവനോ ... അങ്ങനെയുള്ളവർതന്നെ
  rationale: മാതൃകയായ ഏകവചന വ്യക്തിയും അവനോട് ഒത്ത സ്വഭാവമുള്ള ബഹുവചന സമൂഹവും തമ്മിലുള്ള പരസ്പരബന്ധം സ്വാഭാവികമായ മലയാള സമാന്തരഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: χοϊκός
  choice: മണ്ണുകൊണ്ടുള്ള
  rationale: മണ്ണിൽനിന്നുള്ള ആദാമിനെക്കുറിച്ചുള്ള മുൻസന്ദർഭത്തിലെ സൂചന നിലനിർത്തുകയും, വെറും ഭൗമികത എന്നതിലുപരി മണ്ണാൽ നിർണയിക്കപ്പെട്ട ഉത്ഭവവും സ്വഭാവവും പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὁ χοϊκός
  choice: മണ്ണുകൊണ്ടുള്ള മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ നാമവൽക്കരിച്ച ഏകവചന വിശേഷണത്തെ സന്ദർഭാനുസൃതമായി മനുഷ്യനെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കുന്നു; ആദാമും ക്രിസ്തുവും തമ്മിലുള്ള പ്രതിനിധിപരമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: οἱ χοϊκοί
  choice: മണ്ണുകൊണ്ടുള്ളവർ
  rationale: ഏകവചനത്തിലെ അതേ പദബന്ധം ആവർത്തിച്ച്, മണ്ണുകൊണ്ടുള്ള മനുഷ്യന്റെ സ്വഭാവത്തിൽ പങ്കുള്ള മനുഷ്യരെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπουράνιος
  choice: സ്വർഗീയനായ / സ്വർഗീയരായ
  rationale: ‘സ്വർഗത്തിന്റേതായ’ എന്ന വിശേഷണാർഥം നിലനിർത്തുന്നു; 47-ാം വാക്യത്തിലെ ‘സ്വർഗത്തിൽനിന്നുള്ള’ എന്ന വ്യത്യസ്ത പദപ്രയോഗം അനാവശ്യമായി ഇവിടെ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ὁ ἐπουράνιος
  choice: സ്വർഗീയനായ മനുഷ്യൻ
  rationale: ഉടൻമുൻപുള്ള സന്ദർഭത്തിൽ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന ഏകവചന വ്യക്തിയെ വ്യക്തമാക്കുകയും ആദ്യ അർധവാക്യത്തിലെ ‘മനുഷ്യൻ’ എന്ന പ്രയോഗവുമായി സമാന്തരത പാലിക്കുകയും ചെയ്യുന്നു.
- source_word: οἱ ἐπουράνιοι
  choice: സ്വർഗീയരായവർ
  rationale: സ്വർഗീയനായ മനുഷ്യനോട് ഒത്തവരായ മനുഷ്യരെയാണ് സൂചിപ്പിക്കുന്നത്; ദൂതന്മാരെയോ പൊതുവായ സ്വർഗീയ ജീവികളെയോ ഉദ്ദേശിക്കുന്നതായി തോന്നുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഏകവചന നാമവൽക്കരിച്ച വിശേഷണങ്ങളിൽ ‘മനുഷ്യൻ’ ചേർത്ത് ആദാം–ക്രിസ്തു വൈരുധ്യം വ്യക്തമാക്കണമോ
  choice: രണ്ടിടത്തും ‘മനുഷ്യൻ’ ചേർക്കുക
  alternative: ‘മണ്ണുകൊണ്ടുള്ളവൻ ... സ്വർഗീയനായവൻ’ എന്നു മാത്രം നൽകുക
  rationale: 45–49 വാക്യങ്ങളുടെ സന്ദർഭം ആദാമിനെയും ക്രിസ്തുവിനെയും പ്രതിനിധികളായ മനുഷ്യരായി താരതമ്യം ചെയ്യുന്നു. ‘മനുഷ്യൻ’ ചേർക്കുന്നത് സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു, എന്നാൽ പേരുകൾ നേരിട്ട് ചേർത്ത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനം നടത്തുന്നില്ല.
- issue: οἱ ἐπουράνιοι മനുഷ്യരെയാണോ സ്വർഗീയ ജീവികളെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘സ്വർഗീയരായവർ’ എന്ന മനുഷ്യസൂചക ബഹുവചനം ഉപയോഗിക്കുക
  alternative: സന്ദർഭനിരപേക്ഷമായി ‘സ്വർഗീയർ’ എന്നു നൽകുക
  rationale: ഈ ഭാഗം മനുഷ്യരുടെ പുനരുത്ഥാനത്തെയും സ്വർഗീയനായ മനുഷ്യന്റെ പ്രതിച്ഛായ വഹിക്കുന്നവരെയും കുറിച്ചാണ്; അതിനാൽ ദൂതന്മാരെന്ന അർഥം വരുത്താതെ മനുഷ്യസന്ദർഭം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ തുല്യസമാന്തര ഘടന അർധവിരാമത്തോടെ നിലനിർത്തിയിട്ടുണ്ട്. ‘മണ്ണുകൊണ്ടുള്ള’–‘സ്വർഗീയനായ’ എന്ന വൈരുധ്യം ആവർത്തിച്ച് മൂലത്തിലെ ശബ്ദ-ആശയബന്ധം സംരക്ഷിക്കുന്നു. മലയാള പരിഭാഷ തന്നിൽ ഔപചാരികമായ οἷος ... τοιοῦτοι ഘടന വ്യക്തമായി പ്രതിഫലിക്കുന്നതിനാൽ പ്രത്യേക പാഠാന്തരക്കുറിപ്പ് ആവശ്യമില്ല.
