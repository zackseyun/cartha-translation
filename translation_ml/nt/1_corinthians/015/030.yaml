id: 1CO.15.30
reference: 1 Corinthians 15:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί καὶ ἡμεῖς κινδυνεύομεν πᾶσαν ὥραν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/030.yaml
  text: Why are we also in danger every hour?[a]
translation:
  language: ml
  text: നാമും ഓരോ മണിക്കൂറിലും അപകടം നേരിടുന്നത് എന്തിന്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: τί-യെ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘എന്ത്?’ എന്നു വിവർത്തനം ചെയ്യാം; എന്നാൽ ഇവിടെ സന്ദർഭത്തിലെ ആലങ്കാരിക ചോദ്യത്തിന്റെ അർഥം ‘എന്തിന്?’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: എന്തിന്
  rationale: ഈ ആലങ്കാരിക ചോദ്യത്തിൽ τί ഒരു വസ്തുവിനെക്കാൾ പ്രവൃത്തിയുടെ കാരണമോ ഉദ്ദേശ്യമോ ചോദിക്കുന്നു; അതിനാൽ സന്ദർഭത്തിലെ വാദശക്തി ‘എന്തിന്’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: മുൻപ് പറഞ്ഞ ഉദാഹരണങ്ങളോടൊപ്പം പൗലോസിനെയും കൂട്ടരെയും ചേർക്കുന്ന സംയോജക അർഥം മലയാളത്തിലെ ‘നാമും’ എന്ന രൂപം വ്യക്തമാക്കുന്നു.
- source_word: ἡμεῖς
  choice: നാം
  rationale: വ്യക്തമായി നൽകിയിരിക്കുന്ന ബഹുവചന സർവനാമം നിലനിർത്തുന്നു; ചേർന്ന ‘-ഉം’ അതിന്റെ സംയോജക ഊന്നൽ വഹിക്കുന്നു.
- source_word: κινδυνεύομεν
  choice: അപകടത്തിലാകുന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ അപകടാവസ്ഥയിലായിരിക്കുക എന്നത് നിലനിർത്തുന്നു; ‘ജീവൻ പണയപ്പെടുത്തുന്നു’ എന്നത് മൂലപാഠത്തേക്കാൾ വ്യാഖ്യാനപരമായിരിക്കും.
- source_word: πᾶσαν ὥραν
  choice: ഓരോ നാഴികയിലും
  rationale: തുടർച്ചയായ അപകടസാധ്യതയെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മൂലത്തിലെ ‘ഓരോ മണിക്കൂറിലും’ എന്ന രൂപകൽപ്പനയോട് അടുത്തും മലയാളത്തിൽ ഗൗരവപൂർണമായും നൽകുന്നു.
theological_decisions:
- issue: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ വാദത്തിലെ ആലങ്കാരിക ചോദ്യശക്തി
  choice: മരിച്ചവർ ഉയിർപ്പിക്കപ്പെടുന്നില്ലെങ്കിൽ അപ്പൊസ്തലന്മാർ നിരന്തരം അപകടം നേരിടുന്നതിന്റെ നിരർഥകത ചൂണ്ടിക്കാട്ടുന്ന ആലങ്കാരിക ചോദ്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: വിവരം അന്വേഷിക്കുന്ന സാധാരണ ചോദ്യമായി വായിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യഘടനയും തൊട്ടുമുമ്പും ശേഷവുമുള്ള സന്ദർഭവും ആലങ്കാരിക ചോദ്യത്തെ പിന്തുണയ്ക്കുന്നു; അധികമായ ഉപദേശനിഗമനങ്ങൾ ചേർക്കാതെ വാദത്തിലെ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവപൂർണവുമായ ചോദ്യം. ‘നാഴിക’ എന്നത് ഇവിടെ കൃത്യമായ പരമ്പരാഗത സമയഘടകമെന്നല്ല, ὥραയുടെ ‘മണിക്കൂർ/സമയം’ എന്ന അർഥത്തിൽ ഉപയോഗിക്കുന്നു; സാധാരണ വായനക്കാർക്കായി ‘ഓരോ മണിക്കൂറിലും’ എന്നതും പരിഗണിക്കാവുന്നതാണ്.
