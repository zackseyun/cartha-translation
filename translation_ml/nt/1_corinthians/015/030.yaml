revisions:
- from: നാമും ഓരോ നാഴികയിലും അപകടത്തിലാകുന്നത് എന്തിന്?[a]
  to: നാമും ഓരോ മണിക്കൂറിലും അപകടം നേരിടുന്നത് എന്തിന്?[a]
  rationale: The revision replaces the historically specific and potentially misleading ‘നാഴിക’ with the modern, source-faithful ‘മണിക്കൂർ,’ and uses the natural continuous expression ‘അപകടം നേരിടുന്നത്.’ The rhetorical question and the additive ‘also’ remain explicit. The footnote preserves the lexical ambiguity of τί without forcing an unnatural Malayalam literalization.
