revisions:
- from: മരണത്തിന്റെ മുള്ള് പാപമാണ്; പാപത്തിന്റെ ശക്തി ന്യായപ്രമാണവും.[a]
  to: മരണത്തിന്റെ മുള്ള് പാപമാണ്; പാപത്തിന്റെ ശക്തി ന്യായപ്രമാണമാണ്.[a]
