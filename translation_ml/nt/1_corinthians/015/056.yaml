id: 1CO.15.56
reference: 1 Corinthians 15:56
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: ml
  text: മരണത്തിന്റെ മുള്ള് പാപമാണ്; പാപത്തിന്റെ ശക്തി ന്യായപ്രമാണമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ന്യായപ്രമാണം” ഇവിടെ പ്രത്യേകിച്ച് മോശൈക ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതാകാം; എങ്കിലും പാപത്തെ വെളിപ്പെടുത്തുകയും അതിന്റെ പ്രാബല്യം വർധിപ്പിക്കുകയും ചെയ്യുന്ന നിയമത്തിന്റെ വിശാലമായ പങ്കും ഈ പദപ്രയോഗം അനുവദിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: മുള്ള്
  rationale: കുത്തി മുറിവേൽപ്പിക്കുന്ന മൂർച്ചയുള്ള ആയുധം എന്ന രൂപകാർഥം സ്വാഭാവികമായി നൽകുന്നു; മുൻവാക്യത്തിലെ മരണത്തിന്റെ ‘മുള്ള്’ എന്ന ആശയബന്ധവും നിലനിർത്തുന്നു.
- source_word: θανάτου
  choice: മരണത്തിന്റെ
  rationale: മരണത്തോടുള്ള ഉടമസ്ഥതയോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: വ്യക്തിഗത പാപപ്രവൃത്തികൾ എന്നതിലുപരി ഒരു ശക്തിയോ തത്ത്വമോ ആയി പാപത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനം നിലനിർത്തുന്നു.
- source_word: δύναμις
  choice: ശക്തി
  rationale: പാപത്തിന് പ്രവർത്തനശേഷി നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം.
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ മോശൈക ന്യായപ്രമാണത്തെ ശക്തമായി ഓർമിപ്പിക്കുമ്പോഴും, വാക്യം അനുവദിക്കുന്ന വിശാലമായ നിയമസംബന്ധമായ അർഥം പൂർണമായി അടച്ചുകളയുന്നില്ല.
- source_word: δὲ
  choice: ; … വും
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യത്തേക്കാൾ വിശദീകരണപരമായ പുരോഗതിയാണ്; മലയാളത്തിലെ വാക്യഘടനയും ‘-വും’ എന്ന ബന്ധവും അത് സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ന്യായപ്രമാണം’ എന്നതിന്റെ പരിധി
  choice: മോശൈക ന്യായപ്രമാണത്തിന്റെ പ്രതിധ്വനി നിലനിർത്തുന്ന ‘ന്യായപ്രമാണം’ ഉപയോഗിച്ചു; വാചകത്തിൽ കൂടുതൽ വിശദീകരിച്ചില്ല.
  alternative: ‘നിയമം’ എന്ന് പൊതുവായി വിവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ‘മോശെയുടെ ന്യായപ്രമാണം’ എന്ന് വ്യക്തമായി പരിമിതപ്പെടുത്തുക.
  rationale: സന്ദർഭം പ്രത്യേകിച്ച് മോശൈക ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നുവെങ്കിലും, ഗ്രീക്ക് പദം തന്നെ ആ പരിധി തുറന്നുപറയുന്നില്ല. അതിനാൽ അടിക്കുറിപ്പിൽ സാധ്യത വ്യക്തമാക്കിക്കൊണ്ട് വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തര വാക്യഘടനയും പാപത്തെ ഏകവചനത്തിലുള്ള ശക്തിയായി അവതരിപ്പിക്കുന്ന രീതിയും നിലനിർത്തി.
