id: 1CO.15.6
reference: 1 Corinthians 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: ml
  text: അതിനുശേഷം അദ്ദേഹം ഒരേസമയം അഞ്ഞൂറിലധികം സഹോദരന്മാർക്ക് പ്രത്യക്ഷനായി[a]. അവരിൽ ഭൂരിഭാഗവും ഇന്നുവരെ ജീവിച്ചിരിക്കുന്നു; എന്നാൽ ചിലർ നിദ്രപ്രാപിച്ചു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സഹോദരീസഹോദരന്മാർക്ക്.” ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്; ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിൽ ഈ പദം ചിലപ്പോൾ വിശ്വാസികളുടെ വിപുലമായ സമൂഹത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അതായത്, അവർ മരിച്ചു. പുനരുത്ഥാനപ്രത്യാശയുടെ വെളിച്ചത്തിൽ മരണത്തെ സൂചിപ്പിക്കാൻ ആദ്യകാല ക്രൈസ്തവർ സാധാരണയായി ഉപയോഗിച്ചിരുന്ന പ്രയോഗമാണ് “നിദ്രപ്രാപിച്ചു” എന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: അതിനുശേഷം
  rationale: പുനരുത്ഥാനശേഷമുള്ള പ്രത്യക്ഷപ്പെടലുകളുടെ ക്രമം സ്വാഭാവികമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ὤφθη
  choice: പ്രത്യക്ഷനായി
  rationale: ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തുവിന്റെ പ്രത്യക്ഷപ്പെടലിനെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിലെ സ്വാഭാവിക അർഥം നൽകുന്നു; കർത്താവ് പുരുഷനായതിനാൽ ലിംഗസൂചന നിലനിർത്തുന്നു.
- source_word: ἐπάνω πεντακοσίοις ἀδελφοῖς
  choice: അഞ്ഞൂറിലധികം സഹോദരന്മാർക്ക്
  rationale: ἐπάνω എന്നതിന്റെ സംഖ്യാസംബന്ധിയായ ‘അധികം’ എന്ന അർഥവും ἀδελφοῖς എന്ന പുല്ലിംഗ ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: ἐφάπαξ
  choice: ഒരേസമയം
  rationale: എല്ലാവർക്കും ഒരേ അവസരത്തിൽ ഉണ്ടായ പ്രത്യക്ഷപ്പെടലാണെന്ന സമകാലികത വ്യക്തമാക്കുന്നു.
- source_word: οἱ πλείονες
  choice: ഭൂരിഭാഗവും
  rationale: ‘കൂടുതൽ പേർ/ഭൂരിപക്ഷം’ എന്ന substantival comparative-ന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: μένουσιν ἕως ἄρτι
  choice: ഇന്നുവരെ ജീവിച്ചിരിക്കുന്നു
  rationale: μένω എന്നതിന്റെ തുടരുന്ന നില ഈ സന്ദർഭത്തിൽ ജീവിച്ചിരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ശേഷിക്കുന്നു’ എന്നതിനെക്കാൾ വ്യക്തവും സ്വാഭാവികവും.
- source_word: τινὲς δὲ
  choice: എന്നാൽ ചിലർ
  rationale: ഭൂരിഭാഗവും ജീവിച്ചിരിക്കുന്നു എന്ന മുൻവാക്യത്തോടുള്ള ലഘുവായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἐκοιμήθησαν
  choice: നിദ്രപ്രാപിച്ചു
  rationale: മരണത്തെ ‘ഉറക്കം’ എന്നു ചിത്രീകരിക്കുന്ന പൗലോസിന്റെ രൂപകം ചുരുക്കാതെ, ഗൗരവമുള്ള സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοῖς എന്ന പദം മിശ്രലിംഗ വിശ്വാസിസമൂഹത്തെയും ഉൾക്കൊള്ളാമോ എന്നത്
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ
  rationale: ഗ്രീക്കിലെ രൂപം പുല്ലിംഗ ബഹുവചനമായതിനാൽ മുഖ്യപാഠത്തിൽ അത് നിലനിർത്തുന്നു; ആദ്യകാല ക്രൈസ്തവ പ്രയോഗത്തിൽ വിശ്വാസിസമൂഹത്തെ വിപുലമായി സൂചിപ്പിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: പുനരുത്ഥാനസന്ദർഭത്തിൽ ἐκοιμήθησαν എന്നതിന്റെ രൂപകം
  choice: നിദ്രപ്രാപിച്ചു
  alternative: മരിച്ചു
  rationale: 1 കൊരിന്ത്യർ 15-ലെ പുനരുത്ഥാനപ്രത്യാശയുമായി ബന്ധപ്പെട്ട ‘ഉറക്കം’ എന്ന മരണരൂപകം നിലനിർത്തുന്നു; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രത്യക്ഷനായി,’ ‘ഭൂരിഭാഗം,’ ‘നിദ്രപ്രാപിച്ചു’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും തിരുവെഴുത്തിന്റെ ഗൗരവത്തിന് യോജിച്ചതുമാണ്. യഥാർഥ ഗ്രീക്ക് രൂപകവും ഉൾക്കൊള്ളൽസംബന്ധിയായ അർഥസാധ്യതയും അടിക്കുറിപ്പുകളിലൂടെ സംരക്ഷിച്ചിരിക്കുന്നു.
