  text: ⸀ἄφρων, σὺ ὃ σπείρεις, οὐ ζῳοποιεῖται ἐὰν μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: ml
  text: വിവേകമില്ലാത്തവനേ,[a] നീ വിതയ്ക്കുന്നത് ചാകാതെ ജീവിപ്പിക്കപ്പെടുന്നില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മൂഢനേ” അല്ലെങ്കിൽ “ബുദ്ധിയില്ലാത്തവനേ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ജീവനിലേക്കു വരുന്നില്ല.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρων
  choice: ബുദ്ധിയില്ലാത്തവനേ
  rationale: നേരിട്ടുള്ള സംബോധനയും പൗലോസിന്റെ മൂർച്ചയുള്ള ശാസനയും നിലനിർത്തുന്നു; അതേസമയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണ്.
- source_word: σὺ
  choice: നീ
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷ സർവനാമത്തിനുള്ള ഊന്നൽ മലയാളത്തിലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὃ σπείρεις
  choice: നീ വിതയ്ക്കുന്നത്
  rationale: വിത്തുവിതയ്ക്കുന്ന കാർഷിക രൂപകം അതേപടി കാത്തുസൂക്ഷിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ζῳοποιεῖται
  choice: ജീവിപ്പിക്കപ്പെടുന്നില്ല
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ജീവൻ നൽകപ്പെടുന്നു എന്ന അർത്ഥസൂചന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐὰν μὴ
  choice: ചാകാതെ … ഇല്ല
  rationale: ഗ്രീക്കിലെ നിഷേധാത്മക വ്യവസ്ഥ മലയാളത്തിലെ സ്വാഭാവികമായ ‘-ആതെ … ഇല്ല’ ഘടനയിലൂടെ അവതരിപ്പിക്കുന്നു.
- source_word: ἀποθάνῃ
  choice: ചാകാതെ
  rationale: വിത്തിനെക്കുറിച്ചുള്ള കാർഷിക സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്; മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ആദ്യം’ എന്ന ആശയം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: വിത്തിന്റെ മരണമും പുനരുത്ഥാനജീവനും തമ്മിലുള്ള രൂപകബന്ധം
  choice: കാർഷിക രൂപകം വിശദീകരണം ചേർക്കാതെ നിലനിർത്തി.
  alternative: ഇത് ശരീരത്തിന്റെ പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ഉപദേശവാക്യമായി കൂടുതൽ തുറന്നുപറയുക.
  rationale: പൗലോസ് ഇവിടെ വിത്തിന്റെ ഉപമയിലൂടെയാണ് മറുപടി പറയുന്നത്; മൂലപാഠത്തിലില്ലാത്ത ദൈവശാസ്ത്രവിശദീകരണം പരിഭാഷയിൽ ചേർക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സംബോധനയുടെ മൂർച്ച, ‘നീ’ എന്ന ഊന്നൽ, കർമണിപ്രയോഗം, കാർഷിക രൂപകം എന്നിവ സംരക്ഷിച്ചിരിക്കുന്നു.
