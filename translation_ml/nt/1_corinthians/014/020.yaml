reference: 1 Corinthians 14:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], ചിന്തയിൽ കുട്ടികളായിത്തീരരുത്; മറിച്ച്, തിന്മയുടെ കാര്യത്തിൽ ശിശുക്കളായിരിക്കുക[b]; എന്നാൽ ചിന്തയിൽ പക്വതയുള്ളവരായിത്തീരുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരീസഹോദരന്മാരേ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിൽ പുരുഷലിംഗ ബഹുവചനമായ ‘സഹോദരന്മാർ’ എന്ന പദമാണ് സഭയെ സംബോധന ചെയ്യാൻ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ദുരുദ്ദേശത്തിന്റെ കാര്യത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം; κακία എന്ന ഗ്രീക്ക് പദത്തിന് തിന്മ, ദുഷ്ടത, ദുരുദ്ദേശം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചനമായ ഗ്രീക്ക് സംബോധനയുടെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന സന്ദർഭപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: παιδία
  choice: കുട്ടികൾ
  rationale: പൊതുവായി കുട്ടികളെ സൂചിപ്പിക്കുന്ന പദം; νηπιάζετε എന്ന ‘ശിശുക്കളായിരിക്കുക’ എന്ന പ്രയോഗത്തോടും τέλειοι എന്ന പക്വതയോടും ഉള്ള വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: γίνεσθε
  choice: ആയിത്തീരരുത് / ആയിത്തീരുക
  rationale: γίνομαι എന്ന ക്രിയയുടെ ‘ആയിത്തീരുക’ എന്ന ചലനാത്മക അർഥവും രണ്ടു പ്രയോഗങ്ങൾക്കിടയിലെ വാക്യസമാന്തരതയും സംരക്ഷിക്കുന്നു.
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: ചിന്തയിൽ
  rationale: ഗ്രഹണശേഷി, ചിന്ത, മനോഭാവം എന്നിവ സൂചിപ്പിക്കുന്ന φρήν ഇവിടെ ബന്ധസൂചക ദത്തിവിൽ വരുന്നു; ‘ചിന്തയിൽ’ സ്വാഭാവികവും ആവർത്തനത്തിന് യോജിച്ചതുമാണ്.
- source_word: τῇ κακίᾳ
  choice: തിന്മയുടെ കാര്യത്തിൽ
  rationale: κακίαയുടെ വിശാലമായ ധാർമിക അർഥം സംരക്ഷിക്കുന്നു; ‘ദുരുദ്ദേശം’ എന്ന ചുരുങ്ങിയ അർഥത്തിലേക്ക് പാഠത്തെ പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: νηπιάζετε
  choice: ശിശുക്കളായിരിക്കുക
  rationale: ശിശുവായിരിക്കുക എന്ന ക്രിയാത്മക ആശയം വ്യക്തമായി നൽകുകയും ‘കുട്ടികൾ’ എന്ന ആദ്യപ്രയോഗത്തിൽനിന്നുള്ള ഉദ്ദേശ്യപൂർവമായ വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τέλειοι
  choice: പക്വതയുള്ളവർ
  rationale: ഈ സന്ദർഭത്തിൽ τέλειος പാപരഹിതമായ പൂർണതയെയല്ല, വളർച്ചയെത്തിയ പക്വതയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἀλλὰ ... δὲ
  choice: എന്നാൽ ... [പുതിയ വാക്യത്തിലെ വൈരുധ്യം]
  rationale: ആദ്യ വൈരുധ്യം ‘എന്നാൽ’ കൊണ്ട് വ്യക്തമാക്കുന്നു; അവസാന ആഹ്വാനം മലയാളത്തിൽ അനാവശ്യമായ ബന്ധകമില്ലാതെ ശക്തമായി അവതരിപ്പിച്ചിട്ടും ഗ്രീക്കിലെ ആശയമാറ്റം നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ലിംഗസൂചകമായ സഭാസംബോധന
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാരേ’ നിലനിർത്തി, സന്ദർഭത്തിൽ സഹോദരിമാരും ഉൾപ്പെടുന്നതായി അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’
  rationale: ἀδελφοί വ്യാകരണപരമായി പുരുഷലിംഗ ബഹുവചനമാണ്; അതേസമയം മുഴുവൻ സഭയോടുള്ള സംബോധനയായതിനാൽ സ്ത്രീകളും സന്ദർഭപരമായി ഉൾപ്പെടുന്നു. മുഖ്യപാഠം രൂപം സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് വ്യാപ്തി വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- issue: κακίαയുടെ അർഥവ്യാപ്തി
  choice: ‘തിന്മ’ എന്ന വിശാലമായ ധാർമിക അർഥം മുഖ്യപാഠത്തിൽ ഉപയോഗിക്കുക.
  alternative: ‘ദുരുദ്ദേശം’ അഥവാ ‘ദുഷ്ടത’
  rationale: ഇവിടെ അന്തർവ്യക്തിപരമായ വൈരാഗ്യം മാത്രം ഉദ്ദേശിക്കുന്നുവെന്ന് ഉറപ്പില്ല; അതിനാൽ ഗ്രീക്ക് പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു, മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘കുട്ടികൾ—ശിശുക്കൾ—പക്വതയുള്ളവർ’ എന്ന ഗ്രീക്ക് വാക്യത്തിലെ വളർച്ചാസംബന്ധമായ വൈരുധ്യം നിലനിർത്തിയിരിക്കുന്നു. ‘ചിന്തയിൽ’ എന്ന ആവർത്തനം പൗലോസിന്റെ വാക്യഘടനയും ഊന്നലും സംരക്ഷിക്കുന്നു.
