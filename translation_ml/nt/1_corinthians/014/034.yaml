id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: ml
  text: സഭകളിൽ സ്ത്രീകൾ[a] മൗനം പാലിക്കട്ടെ; സംസാരിക്കാൻ[b] അവർക്കു അനുവാദമില്ല. മറിച്ച്, നിയമവും[c] പറയുന്നതുപോലെ അവർ വിധേയരായിരിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ഭാര്യമാർ”; γυνή എന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് “സ്ത്രീ” എന്നും “ഭാര്യ” എന്നും അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: ഏതു തരത്തിലുള്ള സംസാരമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നതെന്ന് ഈ വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല; ചുറ്റുപാടിന്റെ അടിസ്ഥാനത്തിൽ ചിലർ ഇതിനെ കൂടുതൽ പരിമിതമായ അർഥത്തിൽ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: പൗലോസ് ഇവിടെ പ്രത്യേകിച്ച് മോശയുടെ ന്യായപ്രമാണത്തെയോ കൂടുതൽ വിശാലമായി തിരുവെഴുത്തിനെയോ സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: സ്ത്രീകൾ
  rationale: γυνή എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഈ വാക്യത്തിൽ ഭർത്താക്കന്മാരെ വ്യക്തമായി പരാമർശിക്കാത്തതിനാൽ വിശാലമായ ‘സ്ത്രീകൾ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ‘ഭാര്യമാർ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐκκλησίαις
  choice: സഭകളിൽ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἐκκλησία സാധാരണയായി കൂടിവരുന്ന ക്രിസ്തീയ വിശ്വാസസമൂഹങ്ങളെയോ സഭകളെയോ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘സഭകൾ’ സ്വാഭാവികവും പ്രസക്തവുമാണ്.
- source_word: σιγάτωσαν
  choice: മൗനം പാലിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം ഇവിടെ പറയുന്ന സാഹചര്യത്തിൽ മിണ്ടാതിരിക്കുകയോ സംസാരത്തിൽനിന്ന് വിട്ടുനിൽക്കുകയോ ചെയ്യാനുള്ള നിർദേശം നൽകുന്നു. ‘മൗനം പാലിക്കട്ടെ’ അതിന്റെ ആജ്ഞാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπιτρέπεται
  choice: അനുവാദമില്ല
  rationale: കർമണിപ്രയോഗം അനുമതി നിഷേധിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അനുവാദമില്ല’ മലയാളത്തിൽ വ്യക്തവും സംക്ഷിപ്തവുമാണ്.
- source_word: λαλεῖν
  choice: സംസാരിക്കാൻ
  rationale: λαλέω സംസാരിക്കുക എന്ന വിശാലവും നിഷ്പക്ഷവുമായ അർഥമുള്ള ക്രിയയാണ്. ഏതു പ്രത്യേകതരം സംസാരമാണെന്ന് വിവർത്തനത്തിൽ കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: ὑποτασσέσθωσαν
  choice: വിധേയരായിരിക്കട്ടെ
  rationale: വർത്തമാനകാല മധ്യ/കർമണി ആജ്ഞാരൂപം വിധേയത്വത്തിന്റെ നിലപാട് ആവശ്യപ്പെടുന്നു. ‘വിധേയരായിരിക്കട്ടെ’ ആജ്ഞാഭാവം നിലനിർത്തിക്കൊണ്ട് സ്വാഭാവികവും മാന്യവുമായ മലയാളം നൽകുന്നു.
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: നിയമം/ന്യായപ്രമാണം എന്ന ആശയം നൽകുന്ന νόμος എന്ന പദത്തിന് പൗലോസ് ഇവിടെ മോശയുടെ ന്യായപ്രമാണത്തെ പ്രത്യേകമായി ഉദ്ദേശിക്കുന്നുവോ തിരുവെഴുത്തിനെ കൂടുതൽ വിശാലമായി ഉദ്ദേശിക്കുന്നുവോ എന്നത് വിവാദമാണ്. പതിവായ ബൈബിൾ-മലയാള പദമായ ‘ന്യായപ്രമാണം’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ച് കൃത്യമായ സൂചന അടിക്കുറിപ്പിൽ തുറന്നുവയ്ക്കുന്നു.
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: ന്യായപ്രമാണവും പറയുന്നതുപോലെ
  rationale: καθὼς താരതമ്യവും καί ‘കൂടി/വും’ എന്ന അനുബന്ധബലവും നൽകുന്നു. ‘ന്യായപ്രമാണവും പറയുന്നതുപോലെ’ ഈ രണ്ടു ഘടകങ്ങളും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: γυναῖκες ആരെ സൂചിപ്പിക്കുന്നു
  choice: സഭകളിലെ സ്ത്രീകൾ
  alternative: സഭകളിലെ ഭാര്യമാർ
  rationale: ഗ്രീക്ക് പദത്തിന് രണ്ടു അർഥങ്ങളും സാധ്യമാണ്; ഈ വാക്യത്തിൽ ഭർത്താക്കന്മാരെ വ്യക്തമാക്കാത്തതിനാൽ വിശാലമായ അർഥം മുഖ്യപാഠത്തിലും മറ്റേ സാധ്യത അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
- issue: സംസാരനിരോധനത്തിന്റെ വ്യാപ്തി
  choice: സംസാരത്തിന്റെ ഇനം ചുരുക്കി നിർവചിക്കാതെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു
  alternative: ക്രമംകെടുത്തുന്ന സംസാരമോ പ്രവചനങ്ങളെ വിലയിരുത്തുന്നതുമായി ബന്ധപ്പെട്ട സംസാരമോ മാത്രം
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘സംസാരിക്കാൻ’ എന്നു മാത്രമാണ് പറയുന്നത്. ചുറ്റുപാടിന്റെ അടിസ്ഥാനത്തിൽ അതിനെ ചുരുക്കി മനസ്സിലാക്കുന്ന വ്യാഖ്യാനങ്ങൾ ഉണ്ടെങ്കിലും അവ മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: ὁ νόμος എന്നതിന്റെ സൂചന
  choice: ന്യായപ്രമാണം
  alternative: പ്രത്യേകിച്ച് മോശയുടെ ന്യായപ്രമാണം; അല്ലെങ്കിൽ കൂടുതൽ വിശാലമായി തിരുവെഴുത്ത്
  rationale: പൗലോസ് ഉദ്ദേശിക്കുന്ന കൃത്യമായ സ്രോതസ്സ് വാക്യം തന്നെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ സഭാ-വായനാശൈലി സ്വീകരിച്ചു. ‘മൗനം പാലിക്കട്ടെ’, ‘വിധേയരായിരിക്കട്ടെ’ എന്നീ രൂപങ്ങൾ ഗ്രീക്ക് ആജ്ഞാഭാവം നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി വിവാദമായ പരിധികളും സൂചനകളും മുഖ്യപാഠത്തിൽ തീർപ്പാക്കാതെ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
