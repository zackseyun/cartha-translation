id: 1CO.14.9
reference: 1 Corinthians 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον λόγον δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: ml
  text: അതുപോലെ നിങ്ങളും നാവുകൊണ്ട് വ്യക്തമായ വാക്ക് പറയുന്നില്ലെങ്കിൽ, പറയുന്നത് എങ്ങനെ മനസ്സിലാകും? നിങ്ങൾ വായുവിലേക്കു സംസാരിക്കുന്നവരായിരിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: അതുപോലെ നിങ്ങളും
  rationale: മുൻവാക്യങ്ങളിലെ ഉദാഹരണവുമായി പൗലോസ് നടത്തുന്ന താരതമ്യവും കൊരിന്ത്യരോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διὰ τῆς γλώσσης
  choice: നാവുകൊണ്ട്
  rationale: ‘നാവ്’ എന്ന മൂർത്തമായ ദൃശ്യരൂപം വ്യാഖ്യാനിച്ച് ‘ഭാഷ’ എന്നാക്കാതെ നിലനിർത്തുകയും സംസാരമാണ് ഉദ്ദേശ്യമെന്ന് സന്ദർഭത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: εὔσημον λόγον
  choice: വ്യക്തമായി മനസ്സിലാകുന്ന വാക്കുകൾ
  rationale: εὔσημος സൂചിപ്പിക്കുന്ന തിരിച്ചറിയാവുന്ന വ്യക്തതയും ശ്രോതാക്കൾക്ക് ഗ്രഹിക്കാവുന്ന സ്വഭാവവും സാധാരണ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; λόγος ഇവിടെ ഒരൊറ്റ പദത്തിലൊതുങ്ങാത്തതിനാൽ സ്വാഭാവികമായ ബഹുവചനപ്രയോഗം സ്വീകരിച്ചു.
- source_word: δῶτε
  choice: പറയുന്നില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘നൽകുക’ എന്നാണെങ്കിലും ‘വാക്കുകൾ നൽകുക’ എന്നത് മലയാളത്തിൽ കൃത്രിമമായതിനാൽ, ഇവിടെ ഉച്ചരിക്കുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πῶς γνωσθήσεται
  choice: എങ്ങനെ മനസ്സിലാകും?
  rationale: ശ്രോതാക്കളുടെ ഗ്രഹണമാണ് സന്ദർഭത്തിലെ വിഷയം; അതിനാൽ ‘അറിയപ്പെടും’ എന്നതിനെക്കാൾ ‘മനസ്സിലാകും’ ആശയവിനിമയത്തിന്റെ ഉദ്ദേശ്യം കൃത്യമായി നൽകുന്നു.
- source_word: τὸ λαλούμενον
  choice: പറയുന്നത്
  rationale: നാമവൽക്കരിച്ച കർമണി കൃ​ദന്തരൂപത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: നിങ്ങൾ വായുവിനോടു സംസാരിക്കുന്നവരായിരിക്കും
  rationale: മനസ്സിലാക്കപ്പെടാത്ത, ഫലശൂന്യമായ സംസാരത്തിന്റെ രൂപകം നിലനിർത്തുന്നു. εἰς ἀέρα എന്നതിന് മലയാളത്തിൽ സ്വാഭാവികമായ ‘വായുവിനോടു’ ഉപയോഗിച്ചു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നാവ്’, ‘വായു’ എന്നീ മൂലപാഠത്തിലെ ദൃശ്യരൂപങ്ങൾ നിലനിർത്തി; എന്നാൽ മലയാളത്തിൽ കൃത്രിമമാകുന്ന ‘വാക്കുകൾ നൽകുക’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിനു പകരം ‘വാക്കുകൾ പറയുക’ ഉപയോഗിച്ചു.
