- source_word: παρασκευάσεται
  choice: ഒരുങ്ങുക
  rationale: ഭാവികാല മധ്യമരൂപത്തിലെ സ്വയം തയ്യാറാകുക എന്ന ആശയം മലയാളത്തിൽ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς πόλεμον
  choice: യുദ്ധത്തിന്
