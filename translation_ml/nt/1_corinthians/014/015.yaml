id: 1CO.14.15
reference: 1 Corinthians 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: ml
  text: അപ്പോൾ എന്താണു ചെയ്യേണ്ടത്? ഞാൻ ആത്മാവുകൊണ്ട് പ്രാർഥിക്കും; എന്നാൽ മനസ്സുകൊണ്ടും പ്രാർഥിക്കും[b]. ഞാൻ ആത്മാവുകൊണ്ട് സ്തുതിഗാനം പാടും[a][c]; എന്നാൽ മനസ്സുകൊണ്ടും സ്തുതിഗാനം പാടും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവിൽ’ എന്നോ ‘ആത്മാവിനാൽ’ എന്നോ പരിഭാഷപ്പെടുത്താം. ‘ആത്മാവ്’ ഇവിടെ പ്രത്യേകമായി പരിശുദ്ധാത്മാവിനെയാണോ, സംസാരിക്കുന്നവന്റെ മനുഷ്യാത്മാവിനെയാണോ, ആത്മീയമായ ഉച്ചാരണത്തെയാണോ സൂചിപ്പിക്കുന്നത് എന്നു ഗ്രീക്ക് വ്യക്തമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ‘മനസ്സിലാക്കിക്കൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘പാടും’ എന്നോ ‘സംഗീതമുയർത്തും’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: അപ്പോൾ എന്താണു ചെയ്യേണ്ടത്?
  rationale: ഈ പ്രയോഗം മുൻവാദത്തിൽനിന്നുള്ള പ്രായോഗിക നിഗമനം ചോദിക്കുന്ന ആലങ്കാരിക ചോദ്യമാണ്. അക്ഷരാർഥമായ ‘അപ്പോൾ എന്താണ്?’ എന്നതിനെക്കാൾ ഉദ്ദേശ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: προσεύξομαι
  choice: ഞാൻ ... പ്രാർഥിക്കും
  rationale: προσεύχομαι എന്ന ക്രിയയുടെ ഭാവികാലരൂപം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു; മധ്യമപ്രയോഗത്തിന് മലയാളത്തിൽ വേറൊരു ആത്മനേപദപ്രയോഗം ആവശ്യമില്ല.
- source_word: τῷ πνεύματι
  choice: ആത്മാവുകൊണ്ട്
  rationale: ദത്തിവിന്റെ ഉപകരണപരമോ സഹവർത്തിത്വപരമോ ആയ അർഥസാധ്യത നിലനിർത്തുകയും ‘മനസ്സുകൊണ്ട്’ എന്ന സമാന്തരപ്രയോഗത്തോട് പൊരുത്തപ്പെടുകയും ചെയ്യുന്നു. പരിശുദ്ധാത്മാവാണോ മനുഷ്യന്റെ ആത്മാവാണോ എന്നു മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- source_word: τῷ νοΐ
  choice: മനസ്സുകൊണ്ട്
  rationale: νοῦς ഇവിടെ ഗ്രഹണത്തിന്റെയും ബോധപൂർവമായ ചിന്തയുടെയും ശേഷിയെ സൂചിപ്പിക്കുന്നു. ‘മനസ്സുകൊണ്ട്’ എന്നത് πνεῦμα–νοῦς സമാന്തരത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളമാണ്.
- source_word: ψαλῶ
  choice: സ്തുതിഗാനം പാടും
  rationale: ആരാധനാസന്ദർഭത്തിലെ ഗാനരൂപത്തിലുള്ള സ്തുതിയെ വ്യക്തമാക്കുന്നു. വെറും ‘പാടും’ എന്നതിനെക്കാൾ പ്രസക്തി വ്യക്തമാണ്; ‘വീണമീട്ടും’ പോലുള്ള അനാവശ്യമായ വാദ്യസൂചനയും ഒഴിവാക്കുന്നു.
- source_word: δὲ καὶ
  choice: '...കൊണ്ടും'
  rationale: ഒരു രീതിയോടൊപ്പം മറ്റേതും ഉൾപ്പെടുന്നു എന്ന കൂട്ടിച്ചേർക്കലും മൃദുവായ വൈരുധ്യവും മലയാളത്തിലെ ‘-കൊണ്ടും’ എന്ന സമാന്തരഘടന സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: πνεῦμα എന്ന പദം പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യാത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: മുഖ്യപാഠത്തിൽ നിർവചനമില്ലാതെ ‘ആത്മാവ്’ എന്നു നൽകുക
  alternative: ‘പരിശുദ്ധാത്മാവ്’ അല്ലെങ്കിൽ ‘എന്റെ ആത്മാവ്’ എന്നു വ്യക്തമായി നൽകുക
  rationale: സന്ദർഭം ആത്മീയ ഉച്ചാരണവും ഗ്രഹിക്കാവുന്ന ബോധവും തമ്മിലുള്ള വ്യത്യാസത്തെക്കുറിച്ചാണെങ്കിലും, πνεῦμα പരിശുദ്ധാത്മാവിനെയോ സംസാരിക്കുന്നവന്റെ ആത്മാവിനെയോ പരിശുദ്ധാത്മാവാൽ പ്രവർത്തിപ്പിക്കപ്പെടുന്ന മനുഷ്യാത്മാവിനെയോ സൂചിപ്പിക്കാം. ഗ്രീക്ക് ഈ വിഷയം നിർണയിക്കാത്തതിനാൽ പരിഭാഷയും ആ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ആരാധനാപരമായ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ‘ആത്മാവുകൊണ്ട് / മനസ്സുകൊണ്ട്’ എന്ന ആവർത്തിത സമാന്തരഘടന മൂലപാഠത്തിലെ വിരുദ്ധസമാന്തരത സംരക്ഷിക്കുന്നു.
