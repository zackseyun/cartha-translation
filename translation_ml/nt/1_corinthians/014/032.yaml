  text: And the spirits of prophets are subject to prophets,[a]
translation:
  language: ml
  text: പ്രവാചകരുടെ ആത്മാക്കൾ പ്രവാചകർക്ക് വിധേയമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രവാചകരുടേതായ ആത്മാക്കൾ പ്രവാചകർക്ക് വിധേയമാണ്.’ ഈ പ്രയോഗം പ്രവചനപ്രേരണകളെയോ പ്രവാചകരോടു ബന്ധപ്പെട്ട ആത്മീയ പ്രവർത്തനത്തെയോ സൂചിപ്പിക്കാം; പ്രവചനത്തിൽ ആത്മനിയന്ത്രണം നിലനിൽക്കുന്നു എന്ന ആശയത്തിന് ഇത് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: പ്രധാനവാക്യത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഗ്രീക്കിലെ καὶ മുമ്പത്തെ വാദത്തോടു ബന്ധിപ്പിക്കുന്ന സാധാരണ സംയോജകമാണ്. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിൽ തുടക്കത്തിലെ ‘കൂടാതെ/എന്നാൽ’ അസ്വാഭാവികമാകുന്നതിനാൽ ബന്ധത്തിന്റെ ഭാവം വാക്യക്രമത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: πνεύματα
  choice: ആത്മാക്കൾ
  rationale: ‘ആത്മാക്കൾ’ എന്നത് പദത്തിന്റെ അടിസ്ഥാന അർഥവും മൂലവാക്യത്തിലെ അവ്യക്തതയും നിലനിർത്തുന്നു; ‘പ്രവചനപ്രേരണകൾ’ അല്ലെങ്കിൽ ‘ആത്മീയ പ്രവർത്തനം’ എന്ന് പ്രധാനവാക്യത്തിൽ വ്യാഖ്യാനിച്ചു ചുരുക്കുന്നില്ല.
- source_word: προφητῶν
  choice: പ്രവാചകരുടെ
  rationale: ജനിറ്റീവ് ബഹുവചനത്തിന്റെ സ്വാഭാവികമായ ഉടമസ്ഥബന്ധം മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ‘ആത്മാക്കൾ’ എന്ന പദത്തെ വിശേഷിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: προφήταις
  choice: പ്രവാചകർക്ക്
  rationale: ὑποτάσσεται എന്ന ക്രിയയോടുള്ള കീഴ്വഴക്കത്തിന്റെ ദാതൃവിഭക്തി മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; അത് മറ്റു പ്രവാചകരെയാണോ അതേ പ്രവാചകരെയാണോ സൂചിപ്പിക്കുന്നതെന്നത് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ὑποτάσσεται
  choice: കീഴടങ്ങുന്നു
  rationale: അധികാരത്തിനോ നിയന്ത്രണത്തിനോ വിധേയമായിരിക്കുക എന്ന ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു. നപുംസകലിംഗ ബഹുവചന കർത്താവിനൊപ്പം ഗ്രീക്കിൽ ഏകവചന ക്രിയ വന്നിട്ടുള്ളതിനെ മലയാള വ്യാകരണാനുസൃതമായി ബഹുവചനത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: ‘പ്രവാചകരുടെ ആത്മാക്കൾ’ എന്ന പ്രയോഗവും പ്രവചനത്തിലെ ആത്മനിയന്ത്രണവും
  choice: പ്രവാചനവുമായി ബന്ധപ്പെട്ട ആത്മീയ പ്രേരണകൾ പ്രവാചകരുടെ നിയന്ത്രണത്തിന് അതീതമല്ലെന്ന അർഥസാധ്യത നിലനിർത്തുന്നു.
  alternative: ഇത് പ്രവാചകരുടെ മാനുഷിക ആത്മാക്കൾ മറ്റു പ്രവാചകർക്ക് വിധേയമാകുന്നതെയോ പ്രവചനസന്ദേശങ്ങൾ പ്രവാചകർ വിലയിരുത്തുന്നതെയോ സൂചിപ്പിക്കാം.
  rationale: സഭായോഗത്തിലെ ക്രമബദ്ധമായ പ്രവചനത്തെക്കുറിച്ചുള്ള 1 കൊരിന്ത്യർ 14:29–33-ന്റെ പശ്ചാത്തലം ആത്മനിയന്ത്രണത്തെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും πνεύματα എന്ന പദത്തിന്റെ കൃത്യമായ സൂചന പ്രധാനവാക്യത്തിൽ വ്യാഖ്യാനിച്ച് തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളം. ‘പ്രവാചകർ’, ‘ആത്മാക്കൾ’, ‘കീഴടങ്ങുന്നു’ എന്നീ പദങ്ങൾ മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ഗൗരവവും അവ്യക്തതയും നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം പ്രധാനവാക്യത്തിൽ ചേർത്തിരിക്കുന്നു.
