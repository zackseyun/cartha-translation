reference: 1 Corinthians 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: ml
  text: 'ന്യായപ്രമാണത്തിൽ ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “അന്യഭാഷക്കാരിലൂടെയും മറ്റുള്ളവരുടെ അധരങ്ങളിലൂടെയും ഞാൻ ഈ ജനത്തോടു സംസാരിക്കും[a]; എന്നിട്ടുപോലും അവർ എന്റെ വാക്കു കേൾക്കുകയില്ല[b],” എന്ന് കർത്താവ് പറയുന്നു.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “അന്യഭാഷകളാലും വിദേശികളുടെ അധരങ്ങളാലും ഞാൻ ഈ ജനത്തോടു സംസാരിക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവർ എന്നെ അനുസരിക്കുകയില്ല.”'
    reason: lexical_alternative
  - marker: c
    text: ഈ ഉദ്ധരണി യെശയ്യാവ് 28:11–12-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: d
    text: ഇസ്രായേലിന്റെ ദൈവമാണ് ഈ ഉദ്ധരണിയിൽ സംസാരിക്കുന്നത്; അതിനാൽ എബ്രായ പശ്ചാത്തലം പ്രതിഫലിപ്പിക്കാൻ ചില പരിഭാഷകൾ “യഹോവ പറയുന്നു” എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: പൗലോസ് യെശയ്യാവിൽ നിന്നാണ് ഉദ്ധരിക്കുന്നതെങ്കിലും νόμος ഇവിടെ യഹൂദ തിരുവെഴുത്തുകളുടെ വിശാലമായ സമാഹാരത്തെ സൂചിപ്പിക്കുന്നു; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘ന്യായപ്രമാണം’ ഈ പരമ്പരാഗത സൂചന നിലനിർത്തുന്നു.
- source_word: γέγραπται
  choice: ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന perfect passive സൂത്രവാക്യത്തിന്റെ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളരൂപം.
- source_word: ἑτερογλώσσοις
  choice: അന്യഭാഷകൾ സംസാരിക്കുന്നവരിലൂടെ
  rationale: ‘വ്യത്യസ്തമായ ഭാഷകളുള്ളവർ’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചുറ്റുപാടിലെ അന്യഭാഷാവിഷയവുമായുള്ള ബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: χείλεσιν ἑτέρων
  choice: വിദേശികളുടെ അധരങ്ങളിലൂടെ
  rationale: ഉദ്ധരണിയിലെ ‘അധരങ്ങൾ’ എന്ന ദൃശ്യരൂപം നിലനിർത്തിക്കൊണ്ട് ἑτέρων മറ്റൊരു ജനതയെയോ ഭാഷാസമൂഹത്തെയോ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: λαλήσω
  choice: ഞാൻ ... സംസാരിക്കും
  rationale: λαλέω എന്ന ക്രിയയുടെ ലളിതമായ ഭാവികാല അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τῷ λαῷ τούτῳ
  choice: ഈ ജനത്തോടു
  rationale: λαός എന്നതിന് തിരുവെഴുത്തുസന്ദർഭത്തിൽ സ്വാഭാവികമായ ‘ജനം’ ഉപയോഗിച്ചു; dative-നോടൊപ്പം സംസാരിക്കൽ മലയാളത്തിൽ ‘ജനത്തോടു’ എന്നാണ് സ്വാഭാവികം.
- source_word: οὐδ’ οὕτως
  choice: എന്നിട്ടുപോലും
  rationale: ആ അസാധാരണ മാർഗം ഉപയോഗിച്ചാലും അവർ പ്രതികരിക്കില്ലെന്ന ഊന്നൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: εἰσακούσονταί μου
  choice: അവർ എന്റെ വാക്കു കേൾക്കുകയില്ല
  rationale: വെറും ശബ്ദശ്രവണമല്ല, ശ്രദ്ധിക്കുകയും അനുസരിക്കുകയും ചെയ്യുക എന്ന εἰσακούωയുടെ സന്ദർഭാർഥം മലയാളത്തിലെ ‘എന്റെ വാക്കു കേൾക്കുക’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: λέγει κύριος
  choice: എന്ന് കർത്താവ് അരുളിച്ചെയ്യുന്നു
  rationale: κύριος എന്നതിന് ‘കർത്താവ്’ നൽകി; ദൈവിക തിരുവെഴുത്തു പ്രഖ്യാപനത്തിന് dignified ആയ ‘അരുളിച്ചെയ്യുന്നു’ ഉപയോഗിച്ചു, ഗ്രീക്കിലെ വർത്തമാനകാല citation formula നിലനിർത്തി.
theological_decisions:
- issue: ദൈവിക തിരുവെഴുത്ത് ഉദ്ധരണിയിലെ κύριος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κύριος ഉള്ളതിനാൽ പ്രധാനപാഠത്തിൽ അതിന്റെ നേരിട്ടുള്ള തത്തുല്യമായ ‘കർത്താവ്’ സ്വീകരിച്ചു. യെശയ്യാവിന്റെ എബ്രായ പശ്ചാത്തലത്തിൽ ദൈവനാമം ഉള്ളതിനാൽ ‘യഹോവ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു; അതിനെ പ്രധാനപാഠത്തിലേക്ക് നിശ്ശബ്ദമായി ഇറക്കുമതി ചെയ്തില്ല.
- issue: εἰσακούωയിലെ കേൾവി-അനുസരണം അർഥവ്യാപ്തി
  choice: എന്റെ വാക്കു കേൾക്കുകയില്ല
  alternative: എന്നെ അനുസരിക്കുകയില്ല
  rationale: ‘കേൾക്കുക’ എന്ന അടിസ്ഥാന രൂപവും ‘ചെവിക്കൊള്ളുക/അനുസരിക്കുക’ എന്ന പ്രായോഗിക സൂചനയും ഒരുമിച്ചു സൂക്ഷിക്കുന്ന മലയാളപ്രയോഗം തിരഞ്ഞെടുത്തു; കൂടുതൽ വ്യക്തമായ അനുസരണാർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘അധരങ്ങൾ’ എന്ന ഉദ്ധരണിദൃശ്യം നിലനിർത്തിയപ്പോൾ ‘അന്യഭാഷകൾ സംസാരിക്കുന്നവർ’ എന്ന രൂപം വായനാസൗകര്യത്തിനായി അല്പം വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
