  text: But if a revelation is given to another who is seated[b][a], let the first be silent.
translation:
  language: ml
  text: എന്നാൽ ഇരിക്കുന്ന മറ്റൊരാൾക്ക് എന്തെങ്കിലും വെളിപ്പെടുത്തപ്പെട്ടാൽ[a], ആദ്യം സംസാരിച്ചുകൊണ്ടിരിക്കുന്നയാൾ മിണ്ടാതിരിക്കട്ടെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇരിക്കുന്ന മറ്റൊരാൾക്ക് ഒരു വെളിപ്പാട് ലഭിച്ചാൽ.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, മറ്റേയാൾക്ക് സംസാരിക്കാൻ കഴിയേണ്ടതിന് ആദ്യം സംസാരിക്കുന്നയാൾ സംസാരം നിർത്തണം.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: ἐὰν വ്യവസ്ഥയും δὲ നേരിയ വൈരുധ്യമോ തുടർവികാസമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ ഘടന സ്വാഭാവികമായി രണ്ടും നിലനിർത്തുന്നു.
- source_word: ἄλλῳ
  choice: മറ്റൊരാൾക്ക്
  rationale: നിലവിൽ സംസാരിക്കുന്നയാളിൽനിന്നു വ്യത്യസ്തനായ മറ്റൊരു പങ്കാളിയെയാണ് ദത്തിവ് ഏകവചനം സൂചിപ്പിക്കുന്നത്.
- source_word: ἀποκαλυφθῇ
  choice: എന്തെങ്കിലും വെളിപ്പെടുത്തപ്പെട്ടാൽ
  rationale: ആയോറിസ്റ്റ് പാസീവ് സബ്ജങ്ക്റ്റീവിന്റെ വെളിപ്പെടുത്തൽ എന്ന ക്രിയാർഥവും കർത്താവിനെ വ്യക്തമാക്കാത്ത പാസീവ് രൂപവും സംരക്ഷിക്കുന്നു; ഗ്രീക്കിൽ വ്യക്തമായ നാമപദമില്ലാത്തതിനാൽ ‘എന്തെങ്കിലും’ ചേർക്കുന്നത് സ്വാഭാവിക മലയാളത്തിനായുള്ള മിതമായ പൂരണമാകുന്നു.
- source_word: καθημένῳ
  choice: ഇരിക്കുന്ന
  rationale: ἄλλῳ എന്നതിനെ വിശേഷിപ്പിക്കുന്ന വർത്തമാനകാല ദത്തിവ് കൃദന്തത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ὁ πρῶτος
  choice: ആദ്യം സംസാരിച്ചുകൊണ്ടിരിക്കുന്നയാൾ
  rationale: അക്ഷരാർഥം ‘ആദ്യത്തെയാൾ’ എന്നാണെങ്കിലും, സന്ദർഭത്തിൽ ഇപ്പോൾ ആദ്യം സംസാരിക്കുന്ന പ്രവാചകനെയാണ് ഉദ്ദേശിക്കുന്നത്; മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ സന്ദർഭാർഥം തുറന്നുപറയുന്നു.
- source_word: σιγάτω
  choice: മിണ്ടാതിരിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന ആജ്ഞാരൂപത്തിന്റെ ബലം നിലനിർത്തുന്നു; ഇവിടെ മറ്റൊരാൾക്ക് സംസാരിക്കാൻ അവസരം നൽകാൻ നിലവിലെ പ്രസംഗം നിർത്തുക എന്ന സന്ദർഭാർഥമുണ്ട്.
theological_decisions:
- issue: സഭായോഗത്തിലെ പ്രവചനാത്മക വെളിപ്പെടുത്തലിന്റെ സ്വഭാവവും ഉറവിടവും
  choice: ‘എന്തെങ്കിലും വെളിപ്പെടുത്തപ്പെട്ടാൽ’ എന്ന് പാസീവ് രൂപത്തിൽ നൽകുക; വെളിപ്പെടുത്തുന്ന കർത്താവിനെ പേരെടുത്തു പറയാതിരിക്കുക.
  alternative: ‘മറ്റൊരാൾക്ക് ഒരു വെളിപ്പാട് ലഭിച്ചാൽ’ അല്ലെങ്കിൽ ‘ദൈവം മറ്റൊരാൾക്ക് എന്തെങ്കിലും വെളിപ്പെടുത്തിയാൽ’.
  rationale: സന്ദർഭം ദൈവിക വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ വാക്യം കർത്താവിനെ നേരിട്ട് പേരെടുത്തു പറയുന്നില്ല. അതിനാൽ മൂലത്തിലെ സംയമനവും വ്യാകരണപരമായ പാസീവ് രൂപവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സഭാവായനയ്ക്ക് യോജിച്ച മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മിണ്ടാതിരിക്കട്ടെ’ ആജ്ഞയുടെ ബലം നിലനിർത്തുമ്പോഴും അനാവശ്യമായി പരുഷമാകുന്നില്ല.
