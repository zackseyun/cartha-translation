id: 1CO.14.12
reference: 1 Corinthians 14:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: ml
  text: അതുപോലെ നിങ്ങളും, ആത്മീയ വരങ്ങൾക്കായി[a] ഉത്സുകരായിരിക്കയാൽ, സഭയുടെ പടുത്തുയർത്തലിനായി സമൃദ്ധരാകാൻ ശ്രമിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ആത്മീയ കാര്യങ്ങൾ’ അല്ലെങ്കിൽ ‘ആത്മാക്കൾ’ എന്നും അർഥമാക്കാം; സന്ദർഭം ആത്മീയ വരങ്ങളെയോ ആത്മാവിന്റെ പ്രകടനങ്ങളെയോ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: അതുപോലെ നിങ്ങളും
  rationale: മുൻവാക്യങ്ങളിലെ ഉപമയെയും നിഗമനസ്വഭാവത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἐπεὶ
  choice: ആയിരിക്കയാൽ
  rationale: തുടർന്നുള്ള ആഹ്വാനത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു.
- source_word: ζηλωταί
  choice: ഉത്സുകർ
  rationale: തീവ്രമായ താത്പര്യവും ആഗ്രഹവും ആധുനികവും മാന്യവുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: πνευμάτων
  choice: ആത്മീയ വരങ്ങൾ
  rationale: 1 കൊരിന്ത്യർ 12–14-ലെ സന്ദർഭം ആത്മാവിന്റെ വരങ്ങളെയും പ്രകടനങ്ങളെയും കുറിച്ചായതിനാൽ സന്ദർഭോചിതമായ അർഥം മുഖ്യപാഠത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്തവും ദ്വയാർഥസാധ്യതയുള്ളതുമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: സഭയെ പടുത്തുയർത്തുന്നതിനായി
  rationale: οἰκοδομή എന്ന പൗലോസിന്റെ നിർമ്മാണരൂപകം നിലനിർത്തിക്കൊണ്ട് സമൂഹത്തെ ശക്തിപ്പെടുത്തുക എന്ന ആശയം സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമാക്കുന്നു.
- source_word: ζητεῖτε
  choice: ശ്രമിക്കുവിൻ
  rationale: ഉദ്ദേശ്യപൂർവമായ പരിശ്രമത്തിനുള്ള ബഹുവചന ആജ്ഞയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα περισσεύητε
  choice: അവയിൽ സമൃദ്ധരാകാൻ
  rationale: περισσεύω എന്നതിലെ സമൃദ്ധി/വർധന എന്ന ആശയം നിലനിർത്തുന്നു; മലയാളത്തിലെ വ്യക്തതയ്ക്കായി മുൻപറഞ്ഞ ആത്മീയ വരങ്ങളെ സൂചിപ്പിക്കുന്ന ‘അവയിൽ’ ചേർത്തിട്ടുണ്ട്, എന്നാൽ ഇത് ഗ്രീക്കിൽ പ്രത്യക്ഷമായി ഇല്ലെന്ന കാര്യം വ്യാഖ്യാനപരമായ തീരുമാനമായി രേഖപ്പെടുത്തുന്നു.
theological_decisions:
- issue: πνευμάτων എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ആത്മീയ വരങ്ങൾ
  alternative: ആത്മീയ കാര്യങ്ങൾ; ആത്മാക്കൾ
  rationale: അധ്യായത്തിന്റെ സന്ദർഭം സഭയുടെ പടുത്തുയർത്തലിനായി ഉപയോഗിക്കേണ്ട ആത്മാവുമായി ബന്ധപ്പെട്ട വരങ്ങളെയും പ്രകടനങ്ങളെയും കുറിച്ചാണ്. ‘ആത്മാക്കൾ’ എന്ന അക്ഷരാർഥം മലയാളത്തിൽ തെറ്റിദ്ധാരണ സൃഷ്ടിക്കാം; അതേസമയം ഗ്രീക്കിന്റെ യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: περισσεύητε എന്ന ക്രിയയുടെ പരോക്ഷ വിഷയം
  choice: അവയിൽ സമൃദ്ധരാകാൻ
  alternative: സമൃദ്ധരാകാൻ
  rationale: മലയാളത്തിൽ ആശയം പൂർണമാക്കാൻ ആത്മീയ വരങ്ങളെ പരോക്ഷ വിഷയമായി വ്യക്തമാക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ ‘അവയിൽ’ ഇല്ലാത്തതിനാൽ, സഭയുടെ പടുത്തുയർത്തലിൽ സമൃദ്ധരാകുക എന്ന വിശാല വായനയും വ്യാകരണപരമായി സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനാശൈലിയും സ്വീകരിച്ചു. ‘പടുത്തുയർത്തുക’ എന്ന പ്രയോഗം പൗലോസിന്റെ നിർമ്മാണരൂപകം നിലനിർത്തുന്നു; ‘ഉത്സുകർ’, ‘സമൃദ്ധരാകുക’ എന്നിവ മൂലപാഠത്തിന്റെ ഭാവവും ഊന്നലും സംരക്ഷിക്കുന്നു.
