id: 1CO.14.7
reference: 1 Corinthians 14:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅμως τὰ ἄψυχα φωνὴν διδόντα, εἴτε αὐλὸς εἴτε κιθάρα, ἐὰν διαστολὴν τοῖς φθόγγοις μὴ ⸀δῷ, πῶς γνωσθήσεται τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: ml
  text: ശബ്ദം പുറപ്പെടുവിക്കുന്ന ജീവനില്ലാത്ത വസ്തുക്കൾപോലും—കുഴലായാലും കിന്നരമായാലും[a]—സ്വരങ്ങളിൽ വ്യത്യാസം വരുത്തുന്നില്ലെങ്കിൽ, കുഴലിലോ കിന്നരത്തിലോ വായിക്കപ്പെടുന്നത് എന്താണെന്ന് എങ്ങനെ തിരിച്ചറിയും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കിന്നരം’ എന്നതിനുപകരം ‘ലൈർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ κιθάρα പുരാതനമായ ഒരു തന്ത്രിവാദ്യമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: പോലും
  rationale: മുൻവാദത്തിൽനിന്ന് ജീവനില്ലാത്ത വാദ്യങ്ങളിലേക്കുള്ള ഊന്നലോടെയുള്ള ഉദാഹരണപരമായ നീക്കം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: τὰ ἄψυχα
  choice: ജീവനില്ലാത്ത വസ്തുക്കൾ
  rationale: ജീവനുള്ള സംസാരിക്കുന്നവരോടുള്ള വ്യത്യാസം നിലനിർത്തുകയും ഇവിടെ വാദ്യങ്ങളെ സൂചിപ്പിക്കുന്ന വിശാലമായ നപുംസക ബഹുവചനത്തെ പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: φωνὴν διδόντα
  choice: ശബ്ദം പുറപ്പെടുവിക്കുന്ന
  rationale: ‘ശബ്ദം നൽകുന്ന’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: കുഴലായാലും കിന്നരമായാലും
  rationale: αὐλός എന്ന ഊതുവാദ്യത്തിന് ‘കുഴൽ’ സ്വാഭാവികമാണ്; κιθάρα എന്ന പുരാതന തന്ത്രിവാദ്യത്തിന് ചരിത്രപരമായി പൊതുവായ ‘കിന്നരം’ തെരഞ്ഞെടുത്തു.
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: സ്വരങ്ങൾ തമ്മിൽ വേർതിരിവു വരുത്തുന്നില്ലെങ്കിൽ
  rationale: διαστολήയിലെ വ്യത്യാസപ്പെടുത്തലും φθόγγοιയിലെ സംഗീതസ്വരങ്ങളും വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു; ഏകവചന ക്രിയയുള്ള ഗ്രീക്ക് ഘടനയുടെ പൊതുവായ വ്യവസ്ഥാഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πῶς γνωσθήσεται
  choice: എങ്ങനെ തിരിച്ചറിയും?
  rationale: സംഗീതത്തിൽ വായിക്കപ്പെടുന്നതിനെ തിരിച്ചറിയുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു.
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: കുഴലിലോ കിന്നരത്തിലോ വായിക്കുന്നത് എന്താണെന്ന്
  rationale: രണ്ടു articular passive participles-ഉം സൂചിപ്പിക്കുന്ന, അതത് വാദ്യത്തിൽ വായിക്കപ്പെടുന്ന സംഗീതത്തെ മലയാളത്തിൽ ആവർത്തനഭാരം കൂടാതെ വ്യക്തമാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. സംഗീതസന്ദർഭത്തിൽ ‘സ്വരങ്ങൾ’, ‘വായിക്കുന്നത്’, ‘തിരിച്ചറിയും’ എന്നീ സ്വാഭാവിക പദങ്ങൾ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ ഉപമാപരമായ ഊന്നലും ചോദ്യരൂപവും നിലനിർത്തി.
