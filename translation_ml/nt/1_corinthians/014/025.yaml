id: 1CO.14.25
reference: 1 Corinthians 14:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: ml
  text: അവന്റെ ഹൃദയത്തിലെ രഹസ്യങ്ങൾ വെളിപ്പെടുന്നു; അങ്ങനെ അവൻ കവിണ്ണുവീണ് ദൈവത്തെ ആരാധിക്കുകയും, “ദൈവം വാസ്തവമായി നിങ്ങളുടെ ഇടയിൽ ഉണ്ട്”[a] എന്നു പ്രഖ്യാപിക്കുകയും ചെയ്യും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവം വാസ്തവമായി നിങ്ങളിൽ ഉണ്ട്.”'
    reason: ἐν ὑμῖν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നും ‘നിങ്ങളിൽ’ എന്നും അർഥമാകാം.
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: രഹസ്യങ്ങൾ
  rationale: വ്യക്തിയുടെ ഉള്ളിൽ മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങളെയാണ് നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന ഈ നപുംസകലിംഗ ബഹുവചനം സൂചിപ്പിക്കുന്നത്. ‘രഹസ്യങ്ങൾ’ സ്വാഭാവികവും സന്ദർഭത്തിന് യോജിച്ചതുമാണ്.
- source_word: τῆς καρδίας αὐτοῦ
  choice: അവന്റെ ഹൃദയത്തിലെ
  rationale: ‘ഹൃദയം’ എന്ന ബൈബിൾപരമായ മനുഷ്യാന്തരംഗപദം നിലനിർത്തുന്നു; ചിന്തകളും ഉദ്ദേശ്യങ്ങളും ഉൾപ്പെടുന്ന ഉള്ളറയെ ഇത് സൂചിപ്പിക്കുന്നു.
- source_word: φανερὰ γίνεται
  choice: വെളിപ്പെടുന്നു
  rationale: മറഞ്ഞിരുന്നത് പ്രകടമാകുകയോ വ്യക്തമായിത്തീരുകയോ ചെയ്യുന്ന ഭാവം മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: καὶ οὕτως
  choice: അങ്ങനെ
  rationale: ഹൃദയരഹസ്യങ്ങൾ വെളിപ്പെടുന്നതിന്റെ ഫലമായി തുടർന്നുള്ള പ്രതികരണം സംഭവിക്കുന്നു എന്ന ബന്ധം നിലനിർത്തുന്നു.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: കവിണ്ണുവീണ്
  rationale: മുഖം നിലത്താകുന്ന സാഷ്ടാംഗഭാവം സ്വാഭാവിക മലയാളത്തിൽ ദൃശ്യമായി അറിയിക്കുന്നു; തുടർന്നുള്ള ‘ആരാധിക്കുകയും’ എന്ന പദം അതിന്റെ ആരാധനാപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: προσκυνήσει τῷ θεῷ
  choice: ദൈവത്തെ ആരാധിക്കുകയും
  rationale: ഇവിടെ ക്രിയ ദൈവത്തോടുള്ള ആരാധനയെ സൂചിപ്പിക്കുന്നു; ശരീരഭാവം മുൻപത്തെ പ്രയോഗത്തിൽ ഇതിനകം വ്യക്തമാക്കിയിട്ടുണ്ട്.
- source_word: ἀπαγγέλλων
  choice: പ്രഖ്യാപിക്കുകയും
  rationale: ആ വ്യക്തി തിരിച്ചറിഞ്ഞ കാര്യം ഉറപ്പോടെ അറിയിക്കുന്ന ഭാവം നൽകുന്നു; അതിനെ അതിരുകടന്ന് ഔദ്യോഗിക പ്രസംഗമാക്കുന്നില്ല.
- source_word: Ὄντως
  choice: വാസ്തവമായി
  rationale: നിഗമനത്തിന്റെ യാഥാർഥ്യവും ഊന്നലും മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: കൂടിവന്ന സഭാസമൂഹമാണ് അടുത്ത സന്ദർഭം; അതിനാൽ ദൈവം അവരുടെ മധ്യേ സന്നിഹിതനാണെന്ന സമൂഹപരമായ അർഥം ഏറ്റവും നന്നായി നൽകുന്നു. ‘നിങ്ങളിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ ഏറ്റുപറച്ചിലിൽ ἐν ὑμῖν എന്നതിന്റെ അർഥം
  choice: നിങ്ങളുടെ ഇടയിൽ
  alternative: നിങ്ങളിൽ
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം കൂടിവന്ന സഭയെയും അതിന്റെ മധ്യേ പ്രകടമാകുന്ന ദൈവസാന്നിധ്യത്തെയും കുറിച്ചാണ്. അതിനാൽ സമൂഹത്തിന്റെ നടുവിൽ എന്ന അർഥം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; ഗ്രീക്ക് പ്രയോഗത്തിന് അന്തർവാസം സൂചിപ്പിക്കാവുന്നതിനാൽ മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഹൃദയം,’ ‘ആരാധിക്കുക,’ ‘ദൈവം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
