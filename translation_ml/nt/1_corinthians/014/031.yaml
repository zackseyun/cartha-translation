reference: 1 Corinthians 14:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δύνασθε γὰρ καθ’ ἕνα πάντες προφητεύειν, ἵνα πάντες μανθάνωσιν καὶ πάντες παρακαλῶνται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾക്കെല്ലാവർക്കും ഒരാൾവീതം[a] പ്രവചിക്കാൻ കഴിയും; എല്ലാവരും പഠിക്കാനും എല്ലാവർക്കും പ്രോത്സാഹനം ലഭിക്കാനും ഇടയാകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരേസമയം ഒരാൾ വീതം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: പ്രവചിക്കാം
  rationale: രണ്ടാംപുരുഷ ബഹുവചനത്തിലുള്ള ഈ വർത്തമാനകാല ക്രിയ കഴിവിനെയോ സാധ്യതയെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ക്കാം’ രൂപം സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഈ അർഥം നൽകുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻനിർദേശത്തിന് വിശദീകരണമോ അടിസ്ഥാനമോ നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καθ’ ἕνα
  choice: ഓരോരുത്തരായി
  rationale: ക്രമത്തിൽ ഒരാൾ വീതം സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; ‘ഒരേസമയം ഒരാൾ വീതം’ എന്ന അർഥവും അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: πάντες
  choice: എല്ലാവരും / നിങ്ങൾക്കെല്ലാവർക്കും
  rationale: മൂന്നു പ്രാവശ്യമുള്ള ആവർത്തനവും വ്യാപ്തിയും കഴിയുന്നത്ര നിലനിർത്തുന്നു. ആദ്യത്തേത് മലയാളവാക്യഘടനയ്ക്കനുസരിച്ച് ‘നിങ്ങൾക്കെല്ലാവർക്കും’ എന്നും പിന്നീടുള്ളവ ‘എല്ലാവരും/എല്ലാവർക്കും’ എന്നും നൽകിയിരിക്കുന്നു.
- source_word: προφητεύειν
  choice: പ്രവചിക്കുക
  rationale: പൗലോസിന്റെ സ്ഥാപിതമായ ആശയവിഭാഗത്തെ ചുരുക്കിവ്യാഖ്യാനിക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: അങ്ങനെ
  rationale: തുടർന്നുള്ള പഠനവും പ്രോത്സാഹനവും ലക്ഷ്യമോ ഫലമോ ആണെന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: μανθάνωσιν
  choice: പഠിക്കുകയും
  rationale: സഭയിലെ പ്രവചനവചനത്തിലൂടെ എല്ലാവർക്കും പഠിക്കാൻ ഇടയാകുന്ന പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: παρακαλῶνται
  choice: പ്രോത്സാഹനം ലഭിക്കുകയും
  rationale: παρακαλέω എന്ന ക്രിയയ്ക്ക് സന്ദർഭാനുസരിച്ച് പ്രോത്സാഹനം, ഉദ്ബോധനം, ആശ്വാസം എന്നീ അർഥങ്ങൾ വരാം. സഭയുടെ ആത്മികവർധനയെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ‘പ്രോത്സാഹനം ലഭിക്കുക’ വിശാലവും സ്വാഭാവികവുമായ തിരഞ്ഞെടുപ്പാണ്; മറ്റർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: സഭായോഗത്തെക്കുറിച്ചുള്ള നിർദേശത്തിൽ πάντες (‘എല്ലാവരും’) എന്നതിന്റെ വ്യാപ്തി
  choice: ആദ്യപ്രയോഗം ‘നിങ്ങൾക്കെല്ലാവർക്കും’ എന്നും തുടർന്നുള്ളവ ‘എല്ലാവരും/എല്ലാവർക്കും’ എന്നും പരിഭാഷപ്പെടുത്തി; ആരെല്ലാമാണ് ഉൾപ്പെടുന്നതെന്ന് അധികമായി പരിമിതപ്പെടുത്തിയില്ല.
  alternative: ‘നിങ്ങളെല്ലാവരും’ അല്ലെങ്കിൽ ‘എല്ലാ പ്രവാചകന്മാരും’ എന്ന് കൂടുതൽ നിർദിഷ്ടമായി വ്യാഖ്യാനിക്കുക.
  rationale: ആദ്യ πάντες പ്രവചിക്കാൻ അനുമതിയുള്ളവരെ സൂചിപ്പിക്കാനിടയുണ്ട്; പിന്നീടുള്ള രണ്ടെണ്ണം കേൾക്കുന്നവരെയോ സഭയിൽ പങ്കെടുത്തവരെയോ സൂചിപ്പിക്കുന്നു. എന്നാൽ ഗ്രീക്ക് വാചകം ആദ്യത്തേതിനെ ‘പ്രവാചകന്മാർ’ എന്ന് പരിമിതപ്പെടുത്തുന്നില്ല. അതിനാൽ സന്ദർഭം നിർണയിക്കേണ്ട വ്യാപ്തി പരിഭാഷയിൽ സങ്കുചിതമാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘പ്രവചിക്കുക’ എന്ന ബൈബിൾപരമായ പദം നിലനിർത്തിയപ്പോൾ, ശേഷിക്കുന്ന വാക്യഘടന സ്വാഭാവിക മലയാളത്തിലാക്കി. ഗ്രീക്കിലെ πάντες എന്ന ആവർത്തനത്തിന്റെ ഊന്നൽ പരമാവധി സംരക്ഷിച്ചിട്ടുണ്ട്.
