  text: ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ οἰκοδομὴν καὶ παράκλησιν καὶ παραμυθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: ml
  text: എന്നാൽ പ്രവചിക്കുന്നവൻ മനുഷ്യരോടു കെട്ടിപ്പടുക്കലിനും പ്രോത്സാഹനത്തിനും ആശ്വാസത്തിനുംവേണ്ടി സംസാരിക്കുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കെട്ടിപ്പടുക്കലിന്’ എന്നതിന് ‘ഉന്നമനത്തിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രോത്സാഹനം’ എന്നു പരിഭാഷപ്പെടുത്തിയ παράκλησις എന്ന പദത്തിന് ‘പ്രബോധനം’ എന്നും ചില സന്ദർഭങ്ങളിൽ ‘ആശ്വാസം’ എന്നും അർത്ഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: ‘ആശ്വാസം’ എന്നു പരിഭാഷപ്പെടുത്തിയ παραμυθία എന്ന പദത്തിന് ‘സാന്ത്വനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: എന്നാൽ പ്രവചിക്കുന്നവൻ
  rationale: വർത്തമാനകാല കൃതന്തത്തെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകി; δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യമായി ‘എന്നാൽ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἀνθρώποις
  choice: മനുഷ്യരോടു
  rationale: ദത്തിവ് ബഹുവചനം സംസാരത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്നു; ഇവിടെ ലിംഗനിരപേക്ഷമായ പൊതുവായ അർത്ഥമാണ്.
- source_word: λαλεῖ
  choice: സംസാരിക്കുന്നത് ... വേണ്ടിയാണ്
  rationale: λαλέω എന്നതിന്റെ വർത്തമാനകാല അർത്ഥം നിലനിർത്തി; തുടർന്നുള്ള മൂന്ന് ആക്കുസറ്റീവ് നാമങ്ങളുടെ ഉദ്ദേശ്യ/ഫലസൂചന സ്വാഭാവിക മലയാളത്തിൽ ‘വേണ്ടിയാണ്’ എന്ന ഘടനയിലൂടെ വ്യക്തമാക്കി.
- source_word: οἰκοδομὴν
  choice: ആത്മീയ വളർച്ചയ്ക്കും
  rationale: പൗലോസിന്റെ രൂപകാലങ്കാരപരമായ ‘പണിതുയർത്തൽ’ എന്ന ആശയം സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ഭാഷയിൽ അറിയിച്ചു; ‘പണിതുയർത്തലിനും’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: παράκλησιν
  choice: പ്രോത്സാഹനത്തിനും
  rationale: ഈ പദത്തിന് പ്രബോധനം, പ്രോത്സാഹനം, ആശ്വാസം എന്നീ അർത്ഥസാധ്യതകളുണ്ട്; തുടർന്നുള്ള παραμυθίαയിൽനിന്ന് വേർതിരിക്കാനും സന്ദർഭത്തിന്റെ വിശാലത നിലനിർത്താനും ‘പ്രോത്സാഹനം’ തിരഞ്ഞെടുത്തു.
- source_word: παραμυθίαν
  choice: ആശ്വാസത്തിനും
  rationale: സാന്ത്വനപ്പെടുത്തുന്ന അല്ലെങ്കിൽ ആശ്വസിപ്പിക്കുന്ന വാക്കുകളെ സൂചിപ്പിക്കുന്ന പദം; ആധുനിക മലയാളത്തിൽ ‘ആശ്വാസം’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
theological_decisions:
- issue: സഭായോഗത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘പ്രവചിക്കുക’ എന്നതിന്റെ അർത്ഥം
  choice: ‘പ്രവചിക്കുന്നവൻ’ എന്നു തന്നെ നിലനിർത്തി.
  alternative: ‘പ്രസംഗിക്കുന്നവൻ’ അല്ലെങ്കിൽ ‘വെളിപ്പാട് അറിയിക്കുന്നവൻ’
  rationale: προφητεύων എന്ന പദത്തെ പ്രസംഗമെന്നോ ഭാവിപ്രവചനമെന്നോ പ്രത്യേകമായി ചുരുക്കാതെ അതിന്റെ തിരുവെഴുത്തുപരവും ദൈവശാസ്ത്രപരവുമായ അർത്ഥവ്യാപ്തിയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ആത്മീയ’ എന്ന പദം മൂലത്തിൽ നേരിട്ട് ഇല്ലെങ്കിലും οἰκοδομήയുടെ പൗലോസീയ രൂപകാലങ്കാരാർത്ഥം വ്യക്തമാക്കാൻ ഉപയോഗിച്ചു; അക്ഷരാർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകി. മൂന്നു സമാന്തര ഫലങ്ങളും വേർതിരിച്ചുനിർത്തി.
