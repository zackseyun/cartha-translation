id: 1CO.14.16
reference: 1 Corinthians 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: ml
  text: അല്ലാത്തപക്ഷം, നീ ആത്മാവിൽ[b] അനുഗ്രഹം ചൊല്ലുന്നുവെങ്കിൽ, കാര്യങ്ങൾ അറിയാത്തവന്റെ[a] സ്ഥാനത്തുള്ളവൻ നീ നന്ദി അർപ്പിക്കുമ്പോൾ എങ്ങനെ “ആമേൻ” എന്നു പറയും? നീ പറയുന്നത് എന്താണെന്ന് അയാൾ അറിയുന്നില്ലല്ലോ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കാര്യങ്ങൾ അറിയാത്തവൻ” എന്നതിന് ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം (ἰδιώτης) സന്ദർഭമനുസരിച്ച് “പുറത്തുള്ളവൻ,” “സാധാരണക്കാരൻ,” അല്ലെങ്കിൽ “പഠിച്ചിട്ടില്ലാത്തവൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “ആത്മാവിൽ” എന്നത് “ആത്മാവിനാൽ” അല്ലെങ്കിൽ “ആത്മാവോടെ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പ്രയോഗം ഇവിടെ കൂടുതൽ നിർദിഷ്ടമായ വ്യാഖ്യാനം ആവശ്യപ്പെടുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: അല്ലെങ്കിൽ, ... എങ്കിൽ
  rationale: മുൻവാദത്തിൽനിന്ന് ഉയരുന്ന തിരുത്തൽസ്വഭാവമുള്ള നിബന്ധനയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐλογῇς
  choice: അനുഗ്രഹം ചൊല്ലുക
  rationale: കൂടിവരവിലെ വാചികമായ അനുഗ്രഹപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുകയും εὐλογέω എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിൽ
  rationale: ദാതിവിന്റെ ഉപകരണാർഥവും മണ്ഡലാർഥവും പൂർണമായി തീർപ്പാക്കാതെ, മനുഷ്യാത്മാവോ ആത്മാവിനാൽ പ്രേരിതമായ സംസാരമോ എന്ന അവ്യക്തത സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἀναπληρῶν τὸν τόπον
  choice: സ്ഥാനത്തിരിക്കുന്നയാൾ
  rationale: ഒരു പ്രത്യേക സ്ഥാനം വഹിക്കുന്നതെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ἰδιώτου
  choice: അറിവില്ലാത്തവന്റെ
  rationale: സാമൂഹികമായി പുറത്തുള്ളവൻ എന്നതിലുപരി, പറയുന്നത് ഗ്രഹിക്കാൻ ആവശ്യമായ പ്രത്യേക അറിവില്ലാത്തവൻ എന്ന സമീപസന്ദർഭത്തിലെ ഊന്നൽ പ്രകടമാക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: എങ്ങനെ “ആമേൻ” എന്നു പറയും?
  rationale: സഭയുടെ സമ്മതപ്രതികരണമായ ‘ആമേൻ’ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യം രൂപപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: നിന്റെ നന്ദിപ്രകടനത്തോട്
  rationale: ἐπί എന്നതിന്റെ സന്ദർഭോചിതമായ ബന്ധവും εὐχαριστίαയുടെ നന്ദി അർപ്പിക്കൽ എന്ന സാധാരണ അർഥവും നൽകുന്നു; പിൽക്കാല സാങ്കേതിക കൂദാശാർഥം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐπειδὴ τί λέγεις οὐκ οἶδεν
  choice: നീ പറയുന്നത് എന്താണെന്ന് അയാൾ അറിയുന്നില്ലല്ലോ
  rationale: കാരണം സൂചിപ്പിക്കുന്ന ἐπειδήയെ മലയാളത്തിലെ ‘-ല്ലോ’ രൂപത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ‘അറിയുന്നില്ല’ എന്ന οἶδεν-ന്റെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ആരാധനാസന്ദർഭത്തിലെ πνεύματι എന്നതിന്റെ അർഥം
  choice: ആത്മാവിൽ
  alternative: ആത്മാവിനാൽ; സ്വന്തം ആത്മാവോടെ
  rationale: ഇത് സംസാരിക്കുന്നയാളുടെ മനുഷ്യാത്മാവാണോ, പരിശുദ്ധാത്മാവിനാൽ പ്രേരിതമായ സംസാരമാണോ എന്ന് വാക്യം നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ പൊതുവായ പ്രയോഗം നിലനിർത്തുന്നു.
- issue: εὐχαριστία എന്ന പദത്തിന്റെ അർഥം
  choice: നന്ദിപ്രകടനം
  alternative: യൂഖാരിസ്തി
  rationale: സമീപസന്ദർഭം കൂടിവരവിൽ ശബ്ദമായി നന്ദി അർപ്പിക്കുന്നതിനെക്കുറിച്ചാണ്; പിൽക്കാലത്തെ സാങ്കേതിക കൂദാശാനാമം ഇവിടെ നിർബന്ധിതമല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നവിധം ഗൗരവവും ആരാധനാസന്ദർഭത്തിന്റെ ഭാവവും നിലനിർത്തി. ‘ആമേൻ’ എന്ന പരിചിതമായ ആരാധനാപദം മാറ്റമില്ലാതെ സൂക്ഷിച്ചു; ഗ്രീക്കിലെ യഥാർഥ വ്യാഖ്യാനാവ്യക്തതകൾ അടിക്കുറിപ്പുകളിലൂടെ തുറന്നുവെച്ചു.
