id: 1CO.14.19
reference: 1 Corinthians 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: ml
  text: എന്നാൽ സഭയിൽ, ഒരു ഭാഷയിൽ പതിനായിരം വാക്കുകൾ പറയുന്നതിനെക്കാൾ, മറ്റുള്ളവരെയും പഠിപ്പിക്കാൻ എന്റെ മനസ്സുകൊണ്ട് അഞ്ചു വാക്കുകൾ പറയാനാണ് എനിക്കിഷ്ടം.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: സഭയിൽ
  rationale: ഇവിടെ കൂടിവന്നിരിക്കുന്ന ക്രൈസ്തവസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആ ആരാധനാസന്ദർഭത്തിൽ സ്വാഭാവികവും പരമ്പരാഗതവുമായ മലയാളപ്രയോഗമാണ് ‘സഭയിൽ’.
- source_word: θέλω
  choice: എനിക്കിഷ്ടം
  rationale: പദത്തിന് അടിസ്ഥാനമായി ‘ആഗ്രഹിക്കുന്നു’ എന്നർഥമുണ്ടെങ്കിലും, ἢ ഉപയോഗിച്ചുള്ള ഈ താരതമ്യത്തിൽ മുൻഗണനയാണ് പ്രകടമാകുന്നത്. ‘പറയാനാണ് എനിക്കിഷ്ടം’ അത് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πέντε λόγους
  choice: അഞ്ചു വാക്കുകൾ
  rationale: ‘പതിനായിരം വാക്കുകൾ’ എന്ന സംഖ്യാത്മക വിരുദ്ധത നിലനിർത്താൻ λόγους എന്നത് ലളിതമായി ‘വാക്കുകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τῷ νοΐ μου
  choice: എന്റെ മനസ്സുകൊണ്ട്
  rationale: νοῦς എന്ന മനസ്സ്/ഗ്രഹണശക്തി സൂചിപ്പിക്കുന്ന പദം നിലനിർത്തുകയും ഗ്രഹിക്കാവുന്ന സംസാരത്തോടുള്ള സന്ദർഭപരമായ വിരുദ്ധത അനാവശ്യമായി വിശദീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: λαλῆσαι
  choice: പറയാൻ
  rationale: പൊതുവായ വാചികപ്രകടനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളക്രിയയാണ് ‘പറയുക’.
- source_word: ἄλλους κατηχήσω
  choice: മറ്റുള്ളവരെയും പഠിപ്പിക്കാൻ
  rationale: κατηχέω ഇവിടെ വാചികമായി അറിവുനൽകുക, പഠിപ്പിക്കുക എന്ന അർഥത്തിലാണ്. പിൽക്കാല സാങ്കേതിക സഭാപദവി ഇറക്കുമതി ചെയ്യാതെ ‘പഠിപ്പിക്കാൻ’ ആ അർഥം നൽകുന്നു.
- source_word: μυρίους λόγους
  choice: പതിനായിരം വാക്കുകൾ
  rationale: μυρίους എന്നതിന്റെ വ്യക്തമായ സംഖ്യാമൂല്യം നിലനിർത്തുന്നത് ‘അഞ്ചു’ എന്നതുമായുള്ള പൗലോസിന്റെ ശക്തമായ താരതമ്യം സംരക്ഷിക്കുന്നു.
- source_word: ἐν γλώσσῃ
  choice: ഒരു നാവിൽ
  rationale: γλῶσσα എന്നതിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമാകാം. ‘അന്യഭാഷ’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത ‘അന്യ’ എന്ന ആശയം വരും; ‘ഒരു നാവിൽ’ അധ്യായത്തിലെ പ്രത്യേക പ്രയോഗവും അതിന്റെ വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: 1 കൊരിന്ത്യർ 12–14-ലെ γλῶσσα എന്ന പദത്തിന്റെ സ്വഭാവം
  choice: ‘ഒരു നാവിൽ’ എന്നു പരിഭാഷപ്പെടുത്തി, അടിക്കുറിപ്പിൽ ‘ഒരു ഭാഷയിൽ’ എന്ന സാധ്യത നൽകി.
  alternative: ‘ഒരു ഭാഷയിൽ’ അല്ലെങ്കിൽ ‘അന്യഭാഷയിൽ’
  rationale: ഇത് സാധാരണ വിദേശഭാഷയാണോ മറ്റൊരു തരത്തിലുള്ള ആത്മിക സംസാരമാണോ എന്ന് പരിഭാഷയിൽ തീർപ്പാക്കാതിരിക്കാൻ ‘നാവ്’ എന്ന പദം നിലനിർത്തി. ‘അന്യഭാഷ’ എന്നു പറയുന്നത് മൂലപാഠത്തിലില്ലാത്ത നിർണ്ണയം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ‘ഒരു നാവിൽ’ സാധാരണ മലയാളത്തിൽ അല്പം അസാധാരണമായിരിക്കാമെങ്കിലും, മൂലപദത്തിന്റെ ദ്വയാർഥവും ഈ അധ്യായത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു; അടിക്കുറിപ്പ് അർഥസാധ്യത വ്യക്തമാക്കുന്നു.
