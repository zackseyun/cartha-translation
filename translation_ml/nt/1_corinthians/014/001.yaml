id: 1CO.14.1
reference: 1 Corinthians 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διώκετε τὴν ἀγάπην, ζηλοῦτε δὲ τὰ πνευματικά, μᾶλλον δὲ ἵνα προφητεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: ml
  text: സ്നേഹത്തെ പിന്തുടരുക; ആത്മീയ കാര്യങ്ങൾക്കായി[a] തീക്ഷ്ണമായി ആഗ്രഹിക്കുക; എന്നാൽ അതിലും അധികമായി പ്രവചിക്കാൻ ആഗ്രഹിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ആത്മാവിന്റെ കാര്യങ്ങൾ’ അല്ലെങ്കിൽ ‘ആത്മീയ വരങ്ങൾ.’ ഗ്രീക്ക് പ്രയോഗം ‘വരങ്ങൾ’ എന്നതിനെക്കാൾ വിശാലമാണ്; എന്നാൽ ഇവിടെ സന്ദർഭം സഭയിൽ ആത്മാവ് നൽകുന്ന പ്രകടനങ്ങളിൽ ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘മറിച്ച് നിങ്ങൾ പ്രവചിക്കേണ്ടതിന്.’
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: പിന്തുടരുക
  rationale: തുടർച്ചയായും സജീവമായും ലക്ഷ്യം തേടുന്ന ധാർമ്മിക ആഹ്വാനത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τὴν ἀγάπην
  choice: സ്നേഹത്തെ
  rationale: ἀγάπη എന്ന പദത്തിന്റെ സാധാരണവും സ്വാഭാവികവുമായ മലയാളരൂപം; മുൻ അധ്യായവുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: ζηλοῦτε
  choice: തീക്ഷ്ണമായി ആഗ്രഹിക്കുക
  rationale: തീവ്രമായ അഭിലാഷവും ഉത്സാഹവും സൂചിപ്പിക്കുന്ന കല്പനാഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ πνευματικά
  choice: ആത്മീയമായ കാര്യങ്ങൾ
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ ബഹുവചന വിശേഷണത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ‘വരങ്ങൾ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്ത നാമം നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: μᾶλλον δὲ
  choice: എന്നാൽ വിശേഷാൽ
  rationale: δὲയുടെ നേരിയ വിരോധ/മാറ്റസൂചനയും μᾶλλον എന്ന പദത്തിന്റെ മുൻഗണനാബോധവും ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: ἵνα προφητεύητε
  choice: നിങ്ങൾ പ്രവചിക്കേണ്ടതിന്
  rationale: ἵναയും വിധിലിംഗ ക്രിയയും നൽകുന്ന ലക്ഷ്യ/ഉള്ളടക്കബന്ധം സൂക്ഷിക്കുകയും ‘പ്രവചിക്കുക’ എന്ന സ്ഥാപിത ബൈബിൾപദം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: τὰ πνευματικά എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ആത്മീയമായ കാര്യങ്ങൾ’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആത്മീയ വരങ്ങൾ’
  rationale: മൂലപദം ‘വരങ്ങൾ’ എന്നതിലേക്കു മാത്രം ചുരുങ്ങുന്നില്ല; എങ്കിലും 1 കൊരിന്ത്യർ 12–14ന്റെ സന്ദർഭം സഭയിലെ ആത്മാവിനാൽ ലഭിക്കുന്ന പ്രകടനങ്ങളിലേക്കും വരങ്ങളിലേക്കും ശ്രദ്ധ കേന്ദ്രീകരിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- issue: പ്രവചനത്തിനുള്ള മുൻഗണന
  choice: ‘എന്നാൽ വിശേഷാൽ നിങ്ങൾ പ്രവചിക്കേണ്ടതിന്’
  alternative: ‘മറിച്ച് നിങ്ങൾ പ്രവചിക്കേണ്ടതിന്’
  rationale: μᾶλλον δὲയുടെ താരതമ്യപരമായ മുൻഗണന നിലനിർത്തുന്നു; മറ്റു ആത്മീയ പ്രകടനങ്ങളെ പൂർണമായി തള്ളുന്നതായി അർഥം നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കല്പനാശൈലി ഉപയോഗിച്ചു. മൂലത്തിലെ വിശാലമായ τὰ πνευματικά ചുരുക്കാതെ സൂക്ഷിച്ചു; ἵνα ഘടനയുടെ അല്പം അസാധാരണമായ ആശ്രിതബന്ധം അർഥവ്യക്തതയോടെ നിലനിർത്തി.
