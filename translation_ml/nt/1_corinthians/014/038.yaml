    text: ചില കൈയെഴുത്തുപ്രതികളിൽ, “ആരെങ്കിലും അറിയാതിരിക്കുന്നുവെങ്കിൽ, അവൻ അറിയാതിരിക്കട്ടെ” എന്നു വായിക്കുന്നു. ഇവിടെ സ്വീകരിച്ച പാഠത്തിന്റെ അർഥം, “ആരെങ്കിലും ഇത് അംഗീകരിക്കുന്നില്ലെങ്കിൽ, അവനും അംഗീകരിക്കപ്പെടുന്നില്ല” എന്നാണ്.
    reason: textual_variant
