    text: അഥവാ, “ഇത് തിരിച്ചറിയുന്നില്ലെങ്കിൽ … തിരിച്ചറിയപ്പെടുന്നില്ല.” വാക്ചാതുര്യത്തിനായി ഗ്രീക്കിൽ ഒരേ ക്രിയയുടെ കർത്തരി-കർമണി രൂപങ്ങൾ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: എങ്കിൽ
  rationale: ഗ്രീക്കിലെ വ്യവസ്ഥാസൂചക അവ്യയത്തെ സ്വാഭാവികമായ മലയാള വ്യവസ്ഥാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ അംഗീകരിക്കാനുള്ള ആഹ്വാനത്തോടുള്ള വൈരുധ്യവും തുടർച്ചയും വ്യക്തമാക്കുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: ഏതൊരു വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്ന അനിശ്ചിത ഏകവചനത്തിന്റെ സ്വാഭാവിക മലയാളരൂപം.
- source_word: ἀγνοεῖ
  choice: അംഗീകരിക്കുന്നില്ല
  rationale: മുൻവാക്യത്തിൽ പൗലോസിന്റെ വാക്കുകളെ കർത്താവിന്റെ കല്പനയായി തിരിച്ചറിഞ്ഞ് അംഗീകരിക്കുന്നതിനെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ, വെറും അറിവില്ലായ്മയേക്കാൾ അംഗീകരിക്കാതിരിക്കൽ എന്ന അർഥം യോജിക്കുന്നു.
- source_word: ἀγνοεῖται
  choice: അംഗീകരിക്കപ്പെടുന്നില്ല
  rationale: അതേ ക്രിയയുടെ കർമണിരൂപം നിലനിർത്തി, ഗ്രീക്കിലെ സജീവ-കർമണി വാക്ചാതുര്യവും അതിലെ പ്രത്യുത്തരസ്വഭാവവും മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; കർത്താവിനെയോ സഭയെയോ കർത്താവായി പ്രത്യേകം നിർണ്ണയിക്കുന്നില്ല.
theological_decisions:
- issue: ἀγνοεῖται എന്ന കർമണിരൂപത്തിന്റെ അർഥം
  choice: അപ്പൊസ്തലിക നിർദേശം അംഗീകരിക്കാത്ത വ്യക്തി അംഗീകരിക്കപ്പെടുന്നില്ല എന്ന പ്രത്യുത്തരപരമായ അർഥം
  alternative: ‘അയാൾ അറിയപ്പെടുന്നില്ല’ എന്ന വിവരണം; അല്ലെങ്കിൽ പാഠഭേദമനുസരിച്ച് ‘അവൻ അറിവില്ലാത്തവനായിരിക്കട്ടെ’
  rationale: SBLGNT പാഠത്തിൽ കർമണി വർത്തമാന നിർദേശകരൂപമാണ് ഉള്ളത്, കല്പനാരൂപമല്ല. ‘അംഗീകരിക്കപ്പെടുന്നില്ല’ എന്നു വിവർത്തനം ചെയ്യുന്നത് ഫലത്തെ നിലനിർത്തുകയും പ്രവർത്തകനെ അതിയായി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അംഗീകരിക്കുന്നു/അംഗീകരിക്കപ്പെടുന്നു’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ക്രിയാസമാന്തര്യം സംരക്ഷിക്കുന്നു. കുറിപ്പുകളുടെ ക്രമം മുഖ്യവാക്യത്തിലെ [b][a] അടയാളങ്ങളോട് കൃത്യമായി പൊരുത്തപ്പെടുന്നു.
