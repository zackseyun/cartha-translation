  language: ml
  text: എന്നാൽ ആരെങ്കിലും ഇത് അംഗീകരിക്കുന്നില്ലെങ്കിൽ[b][a], അവനും അംഗീകരിക്കപ്പെടുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
