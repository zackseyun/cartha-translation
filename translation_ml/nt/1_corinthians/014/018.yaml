  text: εὐχαριστῶ τῷ ⸀θεῷ, πάντων ὑμῶν μᾶλλον ⸀γλώσσαις ⸀λαλῶ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/018.yaml
  text: I thank God that I speak in tongues more than all of you[a].
translation:
  language: ml
  text: ഞാൻ ദൈവത്തിനു നന്ദി പറയുന്നു; നിങ്ങളെല്ലാവരെയുംകാൾ അധികമായി ഞാൻ അന്യഭാഷകളിൽ സംസാരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ നിങ്ങളെല്ലാവരെയുംകാൾ അധികമായി ഭാഷകളിൽ സംസാരിക്കുന്നു.” ഗ്രീക്ക് പദത്തിന് “ഭാഷകൾ” എന്നും അർത്ഥമാകാം; എന്നാൽ ഇവിടെ അത് 1 കൊരിന്ത്യർ 12–14 അധ്യായങ്ങളിലുടനീളം ചർച്ചചെയ്യുന്ന പ്രതിഭാസത്തെ സൂചിപ്പിക്കുന്നു; പരമ്പരാഗതമായി “അന്യഭാഷകൾ” എന്നു വിവർത്തനം ചെയ്യപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστῶ τῷ θεῷ
  choice: ദൈവത്തിനു നന്ദി പറയുന്നു
  rationale: εὐχαριστῶ എന്ന വർത്തമാനകാല ക്രിയയും അതോടൊപ്പമുള്ള ദാതൃവിഭക്തിയായ τῷ θεῷയും സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ ഇങ്ങനെ പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντων ὑμῶν μᾶλλον
  choice: നിങ്ങളെല്ലാവരെയുംകാൾ അധികമായി
  rationale: μᾶλλον-നോടൊപ്പമുള്ള πάντων ὑμῶν താരതമ്യത്തെ സൂചിപ്പിക്കുന്നു; സമൂഹത്തിലെ എല്ലാവരുമായുള്ള താരതമ്യം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: γλώσσαις
  choice: അന്യഭാഷകളിൽ
  rationale: 1 കൊരിന്ത്യർ 12–14-ലെ പ്രത്യേക പ്രതിഭാസത്തെ സൂചിപ്പിക്കുന്ന പരമ്പരാഗത മലയാള ബൈബിൾപദപ്രയോഗം. ഗ്രീക്കിലെ ‘ഭാഷകൾ’ എന്ന വിശാലമായ അർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: λαλῶ
  choice: ഞാൻ ... സംസാരിക്കുന്നു
  rationale: വർത്തമാനകാല ഉത്തമപുരുഷ ഏകവചനത്തെ ലളിതമായ മലയാള വർത്തമാനകാലത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: γλώσσαις എന്ന പദം ആത്മീയവരങ്ങളെക്കുറിച്ചുള്ള സന്ദർഭത്തിൽ വിവർത്തനം ചെയ്യുന്നത്
  choice: അന്യഭാഷകളിൽ
  alternative: ഭാഷകളിൽ
  rationale: പ്രധാനപാഠത്തിലെ ‘അന്യഭാഷകൾ’ 1 കൊരിന്ത്യർ 12–14-ൽ ചർച്ചചെയ്യുന്ന പ്രതിഭാസത്തിന്റെ പരിചിതമായ പേരിനെ നിലനിർത്തുന്നു. ഇവ അറിയപ്പെടുന്ന മനുഷ്യഭാഷകളാണോ മറ്റൊരു തരത്തിലുള്ള സംസാരമാണോ എന്ന് വാക്യം തന്നെ തീർപ്പാക്കാത്തതിനാൽ ‘ഭാഷകളിൽ’ എന്ന പദാർത്ഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അന്യഭാഷകൾ’ എന്ന പരിചിതമായ ബൈബിൾപദം ഉപയോഗിച്ചെങ്കിലും പ്രതിഭാസത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ തർക്കം തീർപ്പാക്കാതെ പദാർത്ഥപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
