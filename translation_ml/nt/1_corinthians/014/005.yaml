revisions:
- from: നിങ്ങൾ എല്ലാവരും അന്യഭാഷകളിൽ സംസാരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു; എന്നാൽ അതിലും അധികമായി, നിങ്ങൾ പ്രവചിക്കണമെന്ന് ആഗ്രഹിക്കുന്നു. അന്യഭാഷകളിൽ സംസാരിക്കുന്നവനെക്കാൾ പ്രവചിക്കുന്നവൻ ശ്രേഷ്ഠനാണ്—അയാൾ വ്യാഖ്യാനിക്കുന്നില്ലെങ്കിൽ[a]—സഭയ്ക്ക് ആത്മിക വളർച്ച ലഭിക്കേണ്ടതിന്.[b]
  to: നിങ്ങൾ എല്ലാവരും അന്യഭാഷകളിൽ സംസാരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു; എന്നാൽ അതിലും അധികമായി നിങ്ങൾ പ്രവചിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്. അന്യഭാഷകളിൽ സംസാരിക്കുന്നവനെക്കാൾ പ്രവചിക്കുന്നവൻ ശ്രേഷ്ഠനാണ്—അയാൾ വ്യാഖ്യാനിച്ചാൽ ഒഴികെ[a]—സഭ പണിതുയർത്തപ്പെടേണ്ടതിന്.[b]
  rationale: The revision corrects the negated exception clause and its footnote, clarifies that both clauses express Paul’s personal desire, and restores the source’s building-up imagery without the added qualifier “spiritual.” Footnote anchors are placed directly after the relevant exception and upbuilding expressions.
