id: 1CO.14.5
reference: 1 Corinthians 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: ml
  text: നിങ്ങൾ എല്ലാവരും അന്യഭാഷകളിൽ സംസാരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു; എന്നാൽ അതിലും അധികമായി നിങ്ങൾ പ്രവചിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്. അന്യഭാഷകളിൽ സംസാരിക്കുന്നവനെക്കാൾ പ്രവചിക്കുന്നവൻ ശ്രേഷ്ഠനാണ്—അയാൾ വ്യാഖ്യാനിച്ചാൽ ഒഴികെ[a]—സഭ പണിതുയർത്തപ്പെടേണ്ടതിന്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മറ്റാരെങ്കിലും വ്യാഖ്യാനിച്ചാൽ.” ഗ്രീക്കിലെ ഏകവചന ക്രിയ അന്യഭാഷകളിൽ സംസാരിക്കുന്നയാളെ തന്നെയോ, സന്ദർഭത്തിൽ കൂടുതൽ പൊതുവായി വ്യാഖ്യാനം നൽകപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: “പണിതുയർത്തപ്പെടുക” എന്നത് കൂടിവന്നിരിക്കുന്ന സഭ ശക്തിപ്പെടുകയും വളരുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നു
  rationale: പൗലോസിന്റെ വ്യക്തിപരമായ ആഗ്രഹം നേരിട്ടും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: πάντας ὑμᾶς
  choice: നിങ്ങൾ എല്ലാവരും
  rationale: ബഹുവചനവും സമഗ്രതയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λαλεῖν γλώσσαις
  choice: അന്യഭാഷകളിൽ സംസാരിക്കുക
  rationale: 1 കൊരിന്ത്യർ 12–14-ലെ സന്ദർഭത്തിൽ γλῶσσαι എന്ന പദത്തിന്റെ സ്ഥാപിതമായ മലയാള പ്രയോഗം; പ്രസ്തുത ആത്മിക സംസാരരൂപത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: μᾶλλον δὲ
  choice: എന്നാൽ അതിലും അധികമായി
  rationale: അന്യഭാഷകളെ നിരാകരിക്കാതെ പ്രവചനത്തിന് നൽകുന്ന താരതമ്യപരമായ മുൻഗണന വ്യക്തമാക്കുന്നു.
- source_word: ἵνα προφητεύητε
  choice: നിങ്ങൾ പ്രവചിക്കണമെന്ന്
  rationale: θέλω എന്ന ഇച്ഛാസൂചക ക്രിയയ്ക്കു പിന്നാലെയുള്ള ആശയവസ്തുവിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μείζων
  choice: ശ്രേഷ്ഠൻ
  rationale: താരതമ്യത്തെ നിലനിർത്തുന്നു; സന്ദർഭം ഇത് വ്യക്തിയുടെ അന്തർലീന മൂല്യത്തേക്കാൾ സഭയെ വളർത്തുന്നതിലുള്ള പ്രയോജനത്തെക്കുറിച്ചാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: διερμηνεύῃ
  choice: അയാൾ വ്യാഖ്യാനിക്കുന്നില്ലെങ്കിൽ
  rationale: വ്യക്തമായ പുതിയ കർത്താവില്ലാത്ത ഏകവചന ക്രിയ, അടുത്തുള്ള അന്യഭാഷ സംസാരിക്കുന്ന വ്യക്തിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; മറ്റൊരാൾ വ്യാഖ്യാനിക്കാം എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἡ ἐκκλησία
  choice: സഭ
  rationale: ഇവിടെ കൂടിവന്നിരിക്കുന്ന ക്രൈസ്തവസമൂഹത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാള പദം.
- source_word: οἰκοδομὴν λάβῃ
  choice: ആത്മിക വളർച്ച ലഭിക്കുക
  rationale: അക്ഷരാർഥമായ ‘പണിതുയർത്തൽ’ എന്ന രൂപകം വായനാസൗകര്യത്തിനായി അതിന്റെ സന്ദർഭാർഥമായ സമൂഹത്തിന്റെ ആത്മിക വളർച്ചയായി നൽകുന്നു.
theological_decisions:
- issue: പ്രവചിക്കുന്നവന്റെ താരതമ്യപരമായ ശ്രേഷ്ഠത
  choice: സഭയുടെ ആത്മിക വളർച്ചയ്ക്കുള്ള കൂടുതൽ പ്രയോജനത്തിന്റെ അർഥത്തിൽ ‘ശ്രേഷ്ഠൻ’
  alternative: പദവിയിലോ വിശുദ്ധിയിലോ ഉയർന്നവൻ
  rationale: അവസാനത്തെ ഉദ്ദേശ്യവാക്യം താരതമ്യത്തിന്റെ മാനദണ്ഡം സഭയുടെ വളർച്ചയാണെന്ന് സൂചിപ്പിക്കുന്നു; എങ്കിലും മൂലത്തിലെ താരതമ്യഭാഷ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
- issue: διερμηνεύῃ എന്ന ക്രിയയുടെ കർത്താവ്
  choice: അന്യഭാഷ സംസാരിക്കുന്നയാൾ തന്നെയാണ് വ്യാഖ്യാനിക്കുന്നത്
  alternative: മറ്റാരെങ്കിലും വ്യാഖ്യാനിക്കുന്നു / വ്യാഖ്യാനം നൽകപ്പെടുന്നു
  rationale: അടുത്തുള്ള ഏകവചന കർത്താവിലേക്കാണ് വ്യാകരണപരമായി ഏറ്റവും സ്വാഭാവികമായ സൂചന; എന്നാൽ അധ്യായത്തിന്റെ വിശാലസന്ദർഭം മറ്റൊരാൾ വ്യാഖ്യാനിക്കുന്നതിനും ഇടനൽകുന്നതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അന്യഭാഷകൾ,’ ‘പ്രവചിക്കുക,’ ‘സഭ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; οἰκοδομή എന്ന നിർമാണരൂപകം സ്വാഭാവികമായി ‘ആത്മിക വളർച്ച’ എന്നു വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
