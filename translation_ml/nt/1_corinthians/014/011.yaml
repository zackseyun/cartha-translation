language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: ml
  text: അതുകൊണ്ട്, ശബ്ദത്തിന്റെ അർഥം[a] എനിക്ക് അറിയില്ലെങ്കിൽ, സംസാരിക്കുന്നവന് ഞാൻ അന്യനായിരിക്കും[b]; സംസാരിക്കുന്നവൻ എനിക്കും അന്യനായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശബ്ദത്തിന്റെ ശക്തി’; അതായത്, ആ ശബ്ദം നൽകുന്ന ആശയം അല്ലെങ്കിൽ അർഥം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ബാർബറോസ്’; ഇവിടെ അപരിഷ്കൃതനായ ഒരാൾ എന്നല്ല, ഭാഷയിലോ സംസാരത്തിലോ അന്യനായതുകൊണ്ട് മനസ്സിലാകാത്ത ഒരാൾ എന്നാണ് അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: അതുകൊണ്ട് ... എങ്കിൽ
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധവും ἐὰν സൂചിപ്പിക്കുന്ന ഉപാധിയും സ്വാഭാവികമായ മലയാളവാക്യക്രമത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ εἰδῶ
  choice: എനിക്ക് അറിയില്ലെങ്കിൽ
  rationale: οἶδα എന്നതിന്റെ അടിസ്ഥാനാർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഗ്രഹിക്കാതിരിക്കുക എന്ന ആശയവും ഇതിലൂടെ വ്യക്തമാണ്.
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: ശബ്ദത്തിന്റെ അർഥം
  rationale: δύναμις എന്ന പദത്തിന്റെ അക്ഷരാർഥം ‘ശക്തി’ ആണെങ്കിലും ഇവിടെ φωνή നൽകുന്ന അർഥമോ ആശയമോ ആണ് ഉദ്ദേശ്യം. φωνήയെ ‘ശബ്ദം’ എന്നു നൽകുന്നത് വാക്യത്തിന്റെ വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τῷ λαλοῦντι
  choice: സംസാരിക്കുന്നവന്
  rationale: വർത്തമാന കൃദന്തരൂപത്തിന്റെ അർഥം ലളിതവും സ്വാഭാവികവുമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: βάρβαρος
  choice: അന്യൻ
  rationale: ഇവിടെ പദം അപരിഷ്കൃതനായ ഒരാളെ എന്നതിലുപരി, ഭാഷാപരമായി അന്യനും പരസ്പരം മനസ്സിലാകാത്തവനുമായ ഒരാളെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν ἐμοὶ
  choice: എനിക്കും
  rationale: പരസ്പരബന്ധം സൂചിപ്പിക്കുന്ന ഈ പ്രയോഗത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ‘എന്നെ സംബന്ധിച്ചിടത്തോളം’ എന്ന ആശയം ഇതിലുണ്ട്.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. പരസ്പരത വ്യക്തമാക്കാൻ വാക്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തിയിരിക്കുന്നു.
