reference: 1 Corinthians 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: ml
  text: അന്യഭാഷയിൽ സംസാരിക്കുന്നവൻ മനുഷ്യരോടല്ല, ദൈവത്തോടാണ് സംസാരിക്കുന്നത്. കാരണം, ആർക്കും മനസ്സിലാകുന്നില്ല[a]; എന്നാൽ, അവൻ ആത്മാവിൽ മർമങ്ങൾ പറയുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആരും കേൾക്കുന്നില്ല.” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കേൾക്കുക’ എന്നും, ഈ സന്ദർഭത്തിൽ സൂചനയായി ‘മനസ്സിലാക്കുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ആത്മാവിൽ” എന്നത് പരിശുദ്ധാത്മാവിലോ സംസാരിക്കുന്നവന്റെ സ്വന്തം ആത്മാവിലോ എന്നു മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: സംസാരിക്കുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം പൊതുവായ ഏകവചന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ലിംഗം അമിതമായി നിർണ്ണയിക്കാതെ സ്വാഭാവികമായി ഇതു പ്രകടിപ്പിക്കുന്നു.
- source_word: γλώσσῃ
  choice: അന്യഭാഷയിൽ
  rationale: പദത്തിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമുണ്ടെങ്കിലും, ഈ അധ്യായത്തിൽ പ്രത്യേകതരം ഭാഷാസംസാരത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘അന്യഭാഷയിൽ’ എന്നത് ഏകവചനം നിലനിർത്തുകയും ‘ഭാഷാവരം’ എന്നു വ്യാഖ്യാനിച്ച് ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνθρώποις
  choice: മനുഷ്യരോട്
  rationale: ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ദത്തിവ് ബഹുവചനമാണ്.
- source_word: θεῷ
  choice: ദൈവത്തോട്
  rationale: λαλεῖ എന്ന ക്രിയയുടെ ലളിതമായ ദത്തിവ് കർമം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἀκούει
  choice: മനസ്സിലാക്കുന്നില്ല
  rationale: ἀκούω എന്നതിന് അക്ഷരാർഥത്തിൽ ‘കേൾക്കുക’ എന്നാണെങ്കിലും, ഗ്രഹിക്കാനാകാത്ത സംസാരവും അർഥവത്തായ ആശയവിനിമയവും തമ്മിലുള്ള സന്ദർഭവ്യത്യാസത്തിൽ ‘മനസ്സിലാക്കുക’ എന്ന ആശയം സ്വാഭാവികമാണ്. അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിൽ
  rationale: ദത്തിവ് രൂപം പരിശുദ്ധാത്മാവിനെയോ സംസാരിക്കുന്നവന്റെ ആത്മാവിനെയോ സൂചിപ്പിക്കാം. ‘ആത്മാവിൽ’ എന്ന പ്രയോഗം വ്യാകരണരൂപത്തോട് അടുത്തുനിൽക്കുകയും മലയാളത്തിൽ ഈ അവ്യക്തത സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μυστήρια
  choice: മർമങ്ങൾ
  rationale: മറഞ്ഞതോ സാധാരണ ഗ്രഹിക്കപ്പെടാത്തതോ ആയ കാര്യങ്ങൾ എന്ന ആശയവും പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവശാസ്ത്രപരമായ ഗൗരവവും ‘മർമങ്ങൾ’ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: മറിച്ച്
  rationale: മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും വിശദീകരണപരമായ തിരിവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: πνεύματι എന്നതിന്റെ സൂചിതാർത്ഥം
  choice: പ്രധാനവാചകത്തിൽ ‘ആത്മാവിൽ’
  alternative: ‘സ്വന്തം ആത്മാവിൽ’ അല്ലെങ്കിൽ ‘പരിശുദ്ധാത്മാവിൽ’
  rationale: ഗ്രീക്ക് പദരൂപം പരിശുദ്ധാത്മാവിനെയോ സംസാരിക്കുന്നവന്റെ ആത്മാവിനെയോ സൂചിപ്പിക്കാൻ കഴിയും. പ്രധാനവാചകത്തിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കാതെ അവ്യക്തത നിലനിർത്തുകയും അടിക്കുറിപ്പിൽ ഇരുസാധ്യതകളും വ്യക്തമാക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അന്യഭാഷ’ എന്ന പരിചിതമായ പ്രയോഗം ഉപയോഗിച്ചെങ്കിലും ‘ഭാഷാവരം’ പോലുള്ള അധിക വ്യാഖ്യാനം ഒഴിവാക്കി. മലയാളത്തിൽ വലിയക്ഷര-ചെറിയക്ഷര വ്യത്യാസമില്ലാത്തതിനാൽ ‘ആത്മാവിൽ’ എന്നത് ഗ്രീക്കിലെ ദൈവശാസ്ത്രപരമായ അവ്യക്തത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
