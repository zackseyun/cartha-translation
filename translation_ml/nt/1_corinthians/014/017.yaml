  text: σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ’ ὁ ἕτερος οὐκ οἰκοδομεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: ml
  text: നീ നന്നായി നന്ദി അർപ്പിക്കുന്നുവല്ലോ; എന്നാൽ മറ്റേയാൾ കെട്ടിപ്പടുക്കപ്പെടുന്നില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മറ്റേയാൾക്ക് ആത്മീയ വളർച്ച ലഭിക്കുന്നില്ല.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: നീ
  rationale: രണ്ടാംപുരുഷ ഏകവചനത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: μὲν γὰρ
  choice: എന്നതു ശരിതന്നെ
  rationale: γάρ നൽകുന്ന വിശദീകരണഭാവവും μέν ... ἀλλά നൽകുന്ന സമ്മതിച്ചശേഷമുള്ള വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καλῶς
  choice: നന്നായി
  rationale: പ്രവൃത്തി ഉചിതമായോ നല്ല രീതിയിലോ നടക്കുന്നു എന്ന വിലയിരുത്തൽ ലളിതമായി നൽകുന്നു.
- source_word: εὐχαριστεῖς
  choice: നന്ദി അർപ്പിക്കുന്നു
  rationale: സഭായോഗത്തിലെ ദൈവത്തോടുള്ള നന്ദിപ്രകടനമാണ് സന്ദർഭം; ‘നന്ദി അർപ്പിക്കുന്നു’ അതിനെ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: പ്രധാന വൈരുധ്യം വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ ἕτερος
  choice: മറ്റേയാൾ
  rationale: കൂട്ടായ്മയിലെ മറ്റൊരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചനപ്രയോഗം; കേൾവിക്കാരൻ എന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: οὐκ οἰκοδομεῖται
  choice: പണിയപ്പെടുന്നില്ല
  rationale: പൗലോസ് ഉപയോഗിക്കുന്ന കെട്ടിടനിർമാണരൂപകം നിലനിർത്തുന്നു; ആത്മീയ വളർച്ച എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സഭാസന്ദർഭത്തിലെ οἰκοδομέω എന്ന പൗലോസിന്റെ രൂപകം
  choice: പണിയപ്പെടുന്നില്ല
  alternative: ആത്മീയമായി വളർത്തപ്പെടുന്നില്ല
  rationale: പ്രധാനപാഠത്തിൽ മൂലഭാഷയിലെ രൂപകം സംരക്ഷിക്കുകയും അതിനെ ഒരു പ്രത്യേക ഉപദേശപരമായ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; സ്വാഭാവികമായ അർഥവ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ നേരിട്ടും മാന്യവുമായ ശൈലി. ‘നീ’ എന്ന ഏകവചനം മൂലപാഠത്തിന്റെ നേരിട്ടുള്ള അഭിസംബോധന നിലനിർത്തുന്നു; ‘എന്നതു ശരിതന്നെ; എന്നാൽ’ എന്ന ഘടന സമ്മതവും തുടർന്നുള്ള വൈരുധ്യവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
