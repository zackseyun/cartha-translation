language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: ml
  text: അപ്പോൾ കാര്യമെന്താണ്, സഹോദരന്മാരേ[a]? നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ ഓരോരുത്തർക്കും ഒരു സങ്കീർത്തനമുണ്ട്, ഒരു ഉപദേശമുണ്ട്, ഒരു വെളിപ്പാടുണ്ട്, ഒരു ഭാഷയുണ്ട്[b], ഒരു വ്യാഖ്യാനമുണ്ട്. എല്ലാം പടുത്തുയർത്തലിനായി നടക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്ന അഭിസംബോധന സഭയെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കുന്നതിനാൽ സ്ത്രീകളും പുരുഷന്മാരും അതിൽ ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഒരു നാവുണ്ട്.’ ഗ്രീക്ക് പദത്തിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമാകാം. ഈ സന്ദർഭത്തിൽ അത് സാധാരണ മനുഷ്യഭാഷയെയോ മറ്റൊരു തരത്തിലുള്ള ഉച്ചാരണത്തെയോ സൂചിപ്പിക്കുന്നതാണോ എന്നു വാചകം നിർണയിക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: അപ്പോൾ കാര്യമെന്താണ്
  rationale: മുൻചർച്ചയിൽനിന്നുള്ള പ്രായോഗിക നിഗമനം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ആലങ്കാരിക ചോദ്യത്തിന്റെ സ്വാഭാവികമായ മലയാളരൂപം; ‘എന്തു ചെയ്യണം’ എന്നു ചേർത്ത് അർഥം അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന അഭിസംബോധന നിലനിർത്തുന്നു; മിശ്രസഭയെയാണ് പ്രതിനിധാനപരമായി അഭിസംബോധന ചെയ്യുന്നതെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅταν συνέρχησθε
  choice: നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ
  rationale: സഭായോഗത്തിനായി ആവർത്തിച്ചു കൂടിവരുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ പ്രയോഗം.
- source_word: ἕκαστος
  choice: ഓരോരുത്തർക്കും
  rationale: തുടർന്നുവരുന്ന വിവിധ സഭായോഗ സംഭാവനകളുടെ വിതരണസ്വഭാവം വ്യക്തമാക്കുന്നു.
- source_word: ψαλμὸν
  choice: ഒരു സങ്കീർത്തനം
  rationale: പൊതുവായ ‘പാട്ട്’ എന്നതിനെക്കാൾ ഗ്രീക്ക് പദത്തിന്റെ പ്രത്യേകതയും ആരാധനാസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: διδαχὴν
  choice: ഒരു ഉപദേശം
  rationale: സഭയിൽ നൽകുന്ന പഠിപ്പിക്കലിനെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; വ്യവസ്ഥാപിതമായ ‘സിദ്ധാന്തം’ എന്ന ചുരുക്കാർഥം ഒഴിവാക്കുന്നു.
- source_word: ἀποκάλυψιν
  choice: ഒരു വെളിപ്പാട്
  rationale: സഭയിൽ ലഭിക്കുന്ന വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സുതാര്യവുമായ മലയാളപദം.
- source_word: γλῶσσαν
  choice: ഒരു ഭാഷയിൽ സംസാരിക്കാനുണ്ട്
  rationale: ‘അന്യഭാഷ’ എന്നു ചേർത്ത് ഭാഷയുടെ സ്വഭാവം മുൻകൂട്ടി തീരുമാനിക്കാതെ, ഈ അധ്യായത്തിൽ ചർച്ചചെയ്യുന്ന ഭാഷാഭാഷണത്തെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἑρμηνείαν
  choice: ഒരു വ്യാഖ്യാനം
  rationale: ഭാഷാഭാഷണം സഭയ്ക്ക് മനസ്സിലാകുന്ന വിധം അർഥം അറിയിക്കുന്ന പ്രവൃത്തിക്ക് യോജിക്കുന്നു; അത് വിവർത്തനമോ വിശദീകരണമോ എന്നത് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: എല്ലാം പടുത്തുയർത്തുന്നതിനുവേണ്ടി നടക്കട്ടെ
  rationale: οἰκοδομή എന്ന നിർമാണരൂപകം നിലനിർത്തിക്കൊണ്ട്, സഭാസമൂഹത്തെ ശക്തിപ്പെടുത്തുക എന്ന ലക്ഷ്യം വായനാസൗഹൃദമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സഭയോടുള്ള പ്രതിനിധാനപരമായ പുല്ലിംഗ അഭിസംബോധന
  choice: പ്രധാനവാചകത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നിലനിർത്തി, സന്ദർഭത്തിൽ സ്ത്രീകളും ഉൾപ്പെടുന്നുവെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ വ്യാകരണരൂപം സംരക്ഷിക്കുമ്പോഴും അഭിസംബോധനയുടെ സന്ദർഭപരമായ ഉൾക്കൊള്ളൽ മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ഈ അധ്യായത്തിലെ γλῶσσα എന്ന പദത്തിന്റെ അർഥം
  choice: ‘ഒരു ഭാഷയിൽ സംസാരിക്കാനുണ്ട്’ എന്നു പരിഭാഷപ്പെടുത്തി, ‘നാവ്’ എന്ന കൂടുതൽ അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുക.
  alternative: അന്യഭാഷ / നാവ്
  rationale: ഇത് അറിയപ്പെടുന്ന മനുഷ്യഭാഷയാണോ, പ്രത്യേക ആത്മിക ഉച്ചാരണമാണോ, അതിലധികം വിശാലമായൊരു വിഭാഗമാണോ എന്നത് വാചകത്തിനപ്പുറം തീരുമാനിക്കാതെ പൗലോസിന്റെ ചർച്ചയിലെ അർഥവൈഷമ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാസന്ദർഭ ഭാഷ ഉപയോഗിച്ചു. പരമ്പരാഗതമായി പരിചിതമായ ‘സങ്കീർത്തനം’, ‘ഉപദേശം’, ‘വെളിപ്പാട്’, ‘വ്യാഖ്യാനം’ എന്നീ പദങ്ങൾ നിലനിർത്തി; ‘അന്യഭാഷ’ എന്ന വ്യാഖ്യാനാത്മക കൂട്ടിച്ചേർക്കൽ ഒഴിവാക്കി. അവസാനവാക്യത്തിൽ നിർമാണരൂപകം സംരക്ഷിച്ചു.
