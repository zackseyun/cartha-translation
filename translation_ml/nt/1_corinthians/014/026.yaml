revisions:
- from: അപ്പോൾ കാര്യമെന്താണ്, സഹോദരന്മാരേ[a]? നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ ഓരോരുത്തർക്കും ഒരു സങ്കീർത്തനമുണ്ട്, ഒരു ഉപദേശമുണ്ട്, ഒരു വെളിപ്പാടുണ്ട്, ഒരു ഭാഷയിൽ സംസാരിക്കാനുണ്ട്[b], ഒരു വ്യാഖ്യാനമുണ്ട്. എല്ലാം പടുത്തുയർത്തുന്നതിനുവേണ്ടി നടക്കട്ടെ.
  to: അപ്പോൾ കാര്യമെന്താണ്, സഹോദരന്മാരേ[a]? നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ ഓരോരുത്തർക്കും ഒരു സങ്കീർത്തനമുണ്ട്, ഒരു ഉപദേശമുണ്ട്, ഒരു വെളിപ്പാടുണ്ട്, ഒരു ഭാഷയുണ്ട്[b], ഒരു വ്യാഖ്യാനമുണ്ട്. എല്ലാം പടുത്തുയർത്തലിനായി നടക്കട്ടെ.
  rationale: The revision restores the repeated ‘has a …’ structure of the Greek list, preserves the deliberate ambiguity of γλῶσσα through a concise alternative-reading note, and improves the naturalness of the final purpose clause without altering its construction metaphor or congregational scope.
