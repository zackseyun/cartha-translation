review_pass:
  verdict: revise
  source_fidelity: The verse’s distributive list and final imperative are substantially represented. However, γλῶσσαν ἔχει is a noun phrase (‘has a tongue/language’ in this contextual sense), not explicitly ‘has [something] to speak in a language.’ The proposed wording recasts it into a verbal construction and the footnote’s claim that ‘നാവ്’ is merely a literal alternative does not adequately preserve the contextual ambiguity maintained by the source and English audit trail.
  naturalness: The Malayalam is generally clear and appropriately formal. ‘പടുത്തുയർത്തുന്നതിനുവേണ്ടി’ is understandable but cumbersome; ‘പടുത്തുയർത്തലിനായി’ is more idiomatic while retaining the construction metaphor.
  terminology: ‘സങ്കീർത്തനം,’ ‘ഉപദേശം,’ ‘വെളിപ്പാട്,’ and ‘വ്യാഖ്യാനം’ are suitable. For γλῶσσα, ‘ഭാഷ’ is a usable main-text rendering if its potentially technical contextual sense is retained in the note without specifying the phenomenon as ordinary language-speaking.
  issues:
  - severity: medium
    issue: The rendering of γλῶσσαν ἔχει is expanded into ‘ഒരു ഭാഷയിൽ സംസാരിക്കാനുണ്ട്.’
    rationale: The Greek list uses the repeated construction ‘has a …’; changing this item to an infinitival verbal expression is less formally faithful and subtly specifies the contribution as something to be spoken ‘in a language.’
  - severity: medium
    issue: Footnote b calls ‘ഒരു നാവുണ്ട്’ an ‘അക്ഷരാർഥ’ rendering and then characterizes the main phrase as language-speaking.
    rationale: In this chapter γλῶσσα may denote tongue or language in a specialized disputed phenomenon. The annotation should present the lexical alternatives and explicitly avoid resolving whether it is an ordinary known language or another type of utterance.
  - severity: low
    issue: The final purpose phrase is overly heavy.
    rationale: ‘പടുത്തുയർത്തലിനായി’ is a more natural modern Malayalam expression and continues to preserve οἰκοδομή’s building-up metaphor.
  revised_text: അപ്പോൾ കാര്യമെന്താണ്, സഹോദരന്മാരേ[a]? നിങ്ങൾ ഒരുമിച്ചുകൂടുമ്പോൾ ഓരോരുത്തർക്കും ഒരു സങ്കീർത്തനമുണ്ട്, ഒരു ഉപദേശമുണ്ട്, ഒരു വെളിപ്പാടുണ്ട്, ഒരു ഭാഷയുണ്ട്[b], ഒരു വ്യാഖ്യാനമുണ്ട്. എല്ലാം പടുത്തുയർത്തലിനായി നടക്കട്ടെ.
  revised_footnotes:
  - marker: a
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്ന അഭിസംബോധന സഭയെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കുന്നതിനാൽ സ്ത്രീകളും പുരുഷന്മാരും അതിൽ ഉൾപ്പെടുന്നു.
