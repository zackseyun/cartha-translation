review_pass:
  verdict: revise
  source_fidelity: The conditional structure, the inclusive force of πάντες, the contrastive opening, and the repeated ὑπὸ πάντων are retained. However, the draft renders ἐλέγχεται as “അയാൾക്ക് തന്റെ തെറ്റ് ബോധ്യപ്പെടുന്നു,” which adds the explicit possessive and object “his error” not stated in Greek. The revision preserves the verb’s contextual force of conviction/exposure without adding that object.
  naturalness: The revised wording is idiomatic modern standard Malayalam and avoids the somewhat cumbersome construction “അവിശ്വാസിയോ കാര്യങ്ങൾ പരിചയമില്ലാത്ത ഒരാളോ.”
  terminology: “പ്രവചിക്കുക” appropriately retains Paul’s established category. “അവിശ്വാസി” is suitable for ἄπιστος. “അറിവില്ലാത്ത ഒരാൾ” gives the relevant sense of ἰδιώτης without conclusively identifying the person as an outsider; the alternative remains footnoted. “ബോധ്യപ്പെടുക” and “പരിശോധിക്കപ്പെടുക” retain the distinction between ἐλέγχεται and ἀνακρίνεται without importing final condemnation.
  issues:
  - severity: medium
    issue: “തന്റെ തെറ്റ്” is added in the rendering of ἐλέγχεται.
    rationale: The Greek does not explicitly say “his error/sin.” In context it conveys conviction, exposure, or reproof, but the translation should not specify the object beyond the source.
  - severity: low
    issue: “കാര്യങ്ങൾ പരിചയമില്ലാത്ത ഒരാൾ” is underspecified and stylistically heavy.
    rationale: It leaves the relevant domain unclear in Malayalam. “അറിവില്ലാത്ത ഒരാൾ,” with the explanatory footnote, more directly reflects the contextual sense of ἰδιώτης while preserving its ambiguity.
  revised_text: എന്നാൽ എല്ലാവരും പ്രവചിക്കുമ്പോൾ, ഒരു അവിശ്വാസിയോ അറിവില്ലാത്ത ഒരാളോ[a] അകത്തു വന്നാൽ, അവൻ എല്ലാവരാലും ബോധ്യപ്പെടുകയും എല്ലാവരാലും പരിശോധിക്കപ്പെടുകയും ചെയ്യുന്നു.
