id: 1CO.14.24
reference: 1 Corinthians 14:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: ml
  text: എന്നാൽ എല്ലാവരും പ്രവചിക്കുമ്പോൾ, ഒരു അവിശ്വാസിയോ അറിവില്ലാത്ത ഒരാളോ[a] അകത്തു വന്നാൽ, അവൻ എല്ലാവരാലും ബോധ്യപ്പെടുകയും എല്ലാവരാലും പരിശോധിക്കപ്പെടുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പുറത്തുള്ള ഒരാൾ.” ഗ്രീക്ക് പദത്തിന് ബന്ധപ്പെട്ട കാര്യങ്ങളെക്കുറിച്ച് അറിവില്ലാത്തവൻ, അതിൽ പ്രവേശനം ലഭിക്കാത്തവൻ, അല്ലെങ്കിൽ സംസാരിക്കുന്ന കൂട്ടത്തിൽ ഉൾപ്പെടാത്തവൻ എന്നിങ്ങനെ അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാവരും / എല്ലാവരാലും
  rationale: സഭായോഗത്തിൽ പ്രവചിക്കുന്നവരെ ഉൾക്കൊള്ളുന്ന സമഗ്രത നിലനിർത്തുന്നു; ഗ്രീക്കിലെ ആവർത്തനവും മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: προφητεύωσιν
  choice: പ്രവചിക്കുകയും
  rationale: ഈ അധ്യായത്തിലെ പൗലോസിന്റെ സ്ഥിരമായ വിഭാഗമായ പ്രവചനത്തെ അതേപടി നിലനിർത്തുന്നു; അതിനെ വെറും പ്രചോദിതസംസാരമായി ചുരുക്കുന്നില്ല.
- source_word: ἄπιστος
  choice: അവിശ്വാസി
  rationale: സന്ദർഭത്തിൽ വിശ്വസിക്കാത്ത വ്യക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തനല്ലാത്തവൻ’ എന്ന അർഥമല്ല.
- source_word: ἰδιώτης
  choice: കാര്യങ്ങൾ പരിചയമില്ലാത്ത ഒരാൾ
  rationale: സഭായോഗത്തിലെ ഭാഷയും പ്രവർത്തനങ്ങളും സംബന്ധിച്ച അറിവോ പരിചയമോ ഇല്ലാത്ത വ്യക്തി എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആ വ്യക്തി നിർബന്ധമായും സഭയ്ക്കു പുറത്തുള്ളവനാണെന്ന് തീർപ്പാക്കുന്നില്ല.
- source_word: ἐλέγχεται
  choice: തന്റെ തെറ്റ് ബോധ്യപ്പെടുന്നു
  rationale: കേൾക്കുന്നതിലൂടെ വ്യക്തിയുടെ യഥാർഥ അവസ്ഥ വെളിപ്പെട്ട് അയാൾക്ക് ബോധ്യം വരുന്നു എന്ന നൈതികവും ബോധ്യപ്പെടുത്തുന്നതുമായ ശക്തി നൽകുന്നു; അന്തിമശിക്ഷ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: ἀνακρίνεται
  choice: സൂക്ഷ്മമായി പരിശോധിക്കപ്പെടുന്നു
  rationale: പരിശോധിക്കുക, വിലയിരുത്തുക എന്ന ക്രിയയുടെ അർഥം നിലനിർത്തുന്നു; ‘വിധിക്കപ്പെടുന്നു’ എന്നു പറഞ്ഞ് അന്തിമ കുറ്റവിധിയുടെ അർഥം അതിരുകടത്തുന്നില്ല.
- source_word: ὑπὸ πάντων
  choice: എല്ലാവരാലും
  rationale: ഗ്രീക്കിലെ കർത്തൃസൂചനയും രണ്ടു പ്രാവശ്യമുള്ള ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ / -യും
  rationale: ആദ്യത്തേത് മുൻസാഹചര്യത്തോടുള്ള വ്യത്യാസം കാണിക്കുന്നു; രണ്ടാമത്തേത് വ്യവസ്ഥാവാക്യത്തിനുള്ളിലെ ബന്ധമായി സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: τις
  choice: ഒരാൾ
  rationale: വ്യക്തി ആരെന്നു നിർണയിക്കാത്ത ഗ്രീക്ക് അനിശ്ചിതസർവനാമം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സഭായോഗത്തിന്റെ സന്ദർഭത്തിൽ ἰδιώτης എന്നതിന്റെ അർഥം
  choice: കാര്യങ്ങൾ പരിചയമില്ലാത്ത ഒരാൾ
  alternative: പുറത്തുള്ള ഒരാൾ; അറിവില്ലാത്ത ഒരാൾ; സാധാരണക്കാരൻ
  rationale: അടുത്തുള്ള സന്ദർഭം ഗ്രഹിക്കാവുന്ന സംസാരത്തെയും സഭയിലെ സംസാരരീതികൾ അറിയാത്തവരിൽ അതുണ്ടാക്കുന്ന ഫലത്തെയും കുറിച്ചാണ്. തിരഞ്ഞെടുത്ത പദപ്രയോഗം പ്രസക്തമായ അറിവിന്റെയോ പരിചയത്തിന്റെയോ അഭാവം സൂചിപ്പിക്കുന്നു; ആ വ്യക്തി പൂർണമായും ക്രൈസ്തവസമൂഹത്തിനു പുറത്തുള്ളവനാണെന്ന് തീരുമാനിക്കുന്നില്ല. ‘പുറത്തുള്ള ഒരാൾ’ എന്ന സാദ്ധ്യമായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: ἐλέγχεται എന്നതിലെ ബോധ്യവും വെളിപ്പെടുത്തലും
  choice: അയാൾക്ക് തന്റെ തെറ്റ് ബോധ്യപ്പെടുന്നു
  alternative: അയാൾ ശാസിക്കപ്പെടുന്നു; അയാളുടെ അവസ്ഥ വെളിപ്പെടുന്നു; അയാൾ കുറ്റക്കാരനെന്നു ബോധ്യപ്പെടുന്നു
  rationale: പ്രവചനവാക്കുകളാൽ വ്യക്തിയുടെ അവസ്ഥ വെളിപ്പെട്ട് നൈതികബോധ്യം ഉണ്ടാകുന്നതിനെ പ്രകടിപ്പിക്കുന്നു; നിയമപരമായ കുറ്റവിധിയോ അന്തിമശിക്ഷയോ അനാവശ്യമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്ന മലയാളം ഉപയോഗിച്ചു. ഗ്രീക്കിലെ വ്യവസ്ഥാവാക്യഘടനയും ‘എല്ലാവരാലും’ എന്ന ആവർത്തനവും നിലനിർത്തി. ‘കാര്യങ്ങൾ പരിചയമില്ലാത്ത’ എന്ന പ്രയോഗം പൊതുവായ ബുദ്ധിയില്ലായ്മയെ സൂചിപ്പിക്കാതെ സന്ദർഭപരമായ അപരിചിതത്വം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പിന്റെ സൂചിക അർഥപരമായി ബന്ധപ്പെട്ട ἰδιώτης എന്ന പദത്തിന്റെ പരിഭാഷയ്ക്കുശേഷം സ്ഥാപിച്ചു.
