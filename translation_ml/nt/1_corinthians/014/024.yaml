revisions:
- from: എന്നാൽ എല്ലാവരും പ്രവചിക്കുകയും, അവിശ്വാസിയോ കാര്യങ്ങൾ പരിചയമില്ലാത്ത ഒരാളോ[a] അകത്തു വരികയും ചെയ്താൽ, എല്ലാവരാലും അയാൾക്ക് തന്റെ തെറ്റ് ബോധ്യപ്പെടുന്നു; എല്ലാവരാലും അയാൾ സൂക്ഷ്മമായി പരിശോധിക്കപ്പെടുന്നു.
  to: എന്നാൽ എല്ലാവരും പ്രവചിക്കുമ്പോൾ, ഒരു അവിശ്വാസിയോ അറിവില്ലാത്ത ഒരാളോ[a] അകത്തു വന്നാൽ, അവൻ എല്ലാവരാലും ബോധ്യപ്പെടുകയും എല്ലാവരാലും പരിശോധിക്കപ്പെടുകയും ചെയ്യുന്നു.
  rationale: The revision removes the unsupported specification “തന്റെ തെറ്റ്,” improves the naturalness and precision of the rendering of ἰδιώτης, retains the source’s conditional syntax and the repeated “എല്ലാവരാലും,” and keeps the alternative “outsider” interpretation at the correct anchor.
  reviewer_model: gpt-5.6-terra
