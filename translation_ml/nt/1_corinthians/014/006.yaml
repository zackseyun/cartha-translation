id: 1CO.14.6
reference: 1 Corinthians 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: ml
  text: ഇപ്പോൾ, സഹോദരന്മാരേ[a], ഞാൻ അന്യഭാഷകളിൽ സംസാരിച്ചുകൊണ്ട് നിങ്ങളുടെ അടുക്കൽ വന്നാൽ, വെളിപ്പാടിലൂടെയോ അറിവിലൂടെയോ പ്രവചനത്തിലൂടെയോ ഉപദേശത്തിലൂടെയോ നിങ്ങളോടു സംസാരിക്കുന്നില്ലെങ്കിൽ, ഞാൻ നിങ്ങൾക്ക് എന്തു പ്രയോജനം ചെയ്യും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ’; ‘സഹോദരന്മാർ’ എന്ന ഗ്രീക്ക് പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട സഭയെ സംബോധന ചെയ്യാനും ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: ഇപ്പോൾ
  rationale: പൗലോസിന്റെ വാദത്തിലെ ഇപ്പോഴത്തെ വിഷയത്തിലേക്കുള്ള മാറ്റം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു; δέ-യുടെ മൃദുവായ ബന്ധം മലയാളത്തിൽ പ്രത്യേകം ബലപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; മിശ്രസഭയെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: γλώσσαις λαλῶν
  choice: അന്യഭാഷകളിൽ സംസാരിച്ചുകൊണ്ട്
  rationale: 1 കൊരിന്ത്യർ 12–14-ൽ ചർച്ച ചെയ്യുന്ന ആത്മിക സംസാരപ്രതിഭാസത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ പ്രയോഗം; അതിന്റെ സ്വഭാവത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
- source_word: τί ὑμᾶς ὠφελήσω
  choice: ഞാൻ നിങ്ങൾക്ക് എന്തു പ്രയോജനം ചെയ്യും?
  rationale: ὠφελέω എന്നതിന്റെ പ്രയോജനം ചെയ്യുക/സഹായിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും പ്രായോഗിക ആത്മിക ഗുണത്തിൽ ഊന്നൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐὰν μὴ
  choice: സംസാരിക്കുന്നില്ലെങ്കിൽ
  rationale: ഗ്രീക്കിലെ ‘അല്ലെങ്കിൽ/ചെയ്യുന്നില്ലെങ്കിൽ’ എന്ന നിഷേധാത്മക നിബന്ധനയെ മലയാള വാക്യക്രമത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: λαλήσω
  choice: സംസാരിക്കുന്നു
  rationale: മുമ്പത്തെ λαλῶν-നോടുള്ള പദാർത്ഥതുടർച്ച നിലനിർത്തുകയും വാചിക ആശയവിനിമയസന്ദർഭത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν ἀποκαλύψει
  choice: വെളിപ്പാടിലൂടെ
  rationale: ഇവിടെ ἐν സൂചിപ്പിക്കുന്ന മാർഗം അഥവാ മാധ്യമം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν γνώσει
  choice: അറിവിലൂടെ
  rationale: സമാന്തരമായ ἐν-പ്രയോഗത്തിന്റെ ഉപകരണാർഥം നിലനിർത്തുന്നു.
- source_word: ἐν προφητείᾳ
  choice: പ്രവചനത്തിലൂടെ
  rationale: പട്ടികയുടെ സമാന്തരഘടന കാത്തുസൂക്ഷിക്കുകയും προφητείαയെ അധിക വ്യാഖ്യാനം കൂടാതെ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐν διδαχῇ
  choice: ഉപദേശത്തിലൂടെ
  rationale: διδαχήയുടെ പഠിപ്പിക്കൽ/ബോധനം എന്ന ആശയം സഭാസന്ദർഭത്തിൽ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: സഭാസംബോധനയിൽ ἀδελφοί എന്നതിന്റെ വ്യാപ്തി
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: പ്രധാനപാഠം ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുന്നു; എന്നാൽ ഈ സംബോധന മിശ്രസഭയെ പ്രതിനിധിയായി ഉൾക്കൊള്ളാമെന്നത് അടിക്കുറിപ്പിൽ പറയുന്നു.
- issue: ഈ അധ്യായത്തിലെ γλώσσαις എന്നതിന്റെ അർഥം
  choice: അന്യഭാഷകളിൽ
  alternative: ഭാഷകളിൽ
  rationale: 1 കൊരിന്ത്യർ 12–14-ൽ ചർച്ച ചെയ്യുന്ന പ്രത്യേക ആത്മിക സംസാരപ്രതിഭാസത്തെ സന്ദർഭോചിതമായി സൂചിപ്പിക്കുന്നു; അത് അറിയപ്പെടുന്ന മനുഷ്യഭാഷകളോ മറ്റേതെങ്കിലും തരത്തിലുള്ള സംസാരമോ എന്ന ദൈവശാസ്ത്രവിവാദം പരിഹരിക്കുന്നില്ല.
- issue: നാല് ἐν-പ്രയോഗങ്ങളുടെ ബന്ധം
  choice: -ലൂടെ എന്ന ഉപകരണാർഥം
  alternative: -യിൽ എന്ന സ്ഥാന/മാധ്യമാർഥം
  rationale: പ്രയോജനം ചെയ്യുന്ന സംസാരത്തിന്റെ മാർഗങ്ങളെയോ രൂപങ്ങളെയോ പട്ടികപ്പെടുത്തുന്നതായി വായിക്കുന്നത് സന്ദർഭത്തിന് യോജിക്കുന്നു; ഗ്രീക്കിലെ രൂപപരമായ അസ്പഷ്ടതയെ കടുപ്പമുള്ള സാങ്കേതിക വിശദീകരണമായി മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിലെ നിബന്ധനയും നാല് സമാന്തര ഇനങ്ങളും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമാകാൻ മുഖ്യചോദ്യം വാക്യാവസാനത്തിലാക്കി.
