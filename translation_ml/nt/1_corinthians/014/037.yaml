id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: ml
  text: താൻ ഒരു പ്രവാചകനോ ആത്മികനോ ആണെന്ന് ആരെങ്കിലും കരുതുന്നെങ്കിൽ, ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നത് കർത്താവിന്റെ കല്പനയാണെന്ന് അയാൾ അംഗീകരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നത് കർത്താവിന്റേതാണ്’ അഥവാ ‘കർത്താവിൽനിന്നുള്ളതാണ്.’ ‘കല്പന’ എന്ന പദം ഗ്രീക്കിൽ പ്രത്യക്ഷമായി ഇല്ല; സന്ദർഭാർഥം വ്യക്തമാക്കാൻ മുഖ്യപാഠത്തിൽ ചേർത്തതാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: കരുതുന്നെങ്കിൽ
  rationale: ഇവിടെ ഈ പദം ഒരാളുടെ സ്വയംവിലയിരുത്തലിനെയോ അവകാശവാദത്തെയോ സൂചിപ്പിക്കുന്നു. ‘കരുതുന്നു’ എന്നത് തിരുത്തൽസൂചനയുള്ള ഭാവം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: προφήτης
  choice: പ്രവാചകൻ
  rationale: ആത്മികവരങ്ങളെയും പ്രവചനവചനത്തെയും കുറിച്ചുള്ള സന്ദർഭത്തിൽ προφήτης എന്നതിനുള്ള വ്യക്തവും പതിവുമായ മലയാളസമമാണ് ‘പ്രവാചകൻ’.
- source_word: πνευματικός
  choice: ആത്മികൻ
  rationale: ആത്മാവിനാൽ വരം ലഭിച്ചവനെന്നോ ആത്മാവിന്റെ നടത്തിപ്പിലുള്ളവനെന്നോ സ്വയം കരുതുന്ന വ്യക്തിയെ ഈ വിശേഷണം സൂചിപ്പിക്കാം. ‘ആത്മികൻ’ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: ἐπιγινωσκέτω
  choice: അംഗീകരിക്കട്ടെ
  rationale: വെറും അറിവിനേക്കാൾ തിരിച്ചറിഞ്ഞ് സമ്മതിക്കുന്നതിലാണ് സന്ദർഭത്തിലെ ഊന്നൽ. വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ അധികാരഭാവവും ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ἃ γράφω ὑμῖν
  choice: ഞാൻ നിങ്ങൾക്ക് എഴുതുന്നത്
  rationale: ബന്ധസർവനാമവും വർത്തമാനകാല ക്രിയയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: κυρίου ἐστίν
  choice: കർത്താവിന്റെ കല്പനയാണ്
  rationale: ഗ്രീക്കിൽ നാമപദം തുറന്നുപറയാത്ത സംക്ഷിപ്ത പ്രയോഗമാണിത്. സന്ദർഭത്തിൽ പൗലോസ് തന്റെ എഴുത്തിനുള്ള കർത്താവിന്റെ അധികാരം ഉറപ്പിക്കുന്നതിനാൽ ‘കല്പന’ ചേർക്കുന്നത് ഉദ്ദേശ്യാർഥം വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥത്തിലെ സംക്ഷിപ്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: κυρίου ἐστίν എന്ന സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘കർത്താവിന്റെ കല്പനയാണ്’ എന്ന് മുഖ്യപാഠത്തിൽ നൽകി ദൈവിക അധികാരത്തിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
  alternative: ‘കർത്താവിന്റേതാണ്’ അല്ലെങ്കിൽ ‘കർത്താവിൽനിന്നുള്ളതാണ്’.
  rationale: ഗ്രീക്ക് അക്ഷരാർഥത്തിൽ ‘കർത്താവിന്റേതാണ്’ എന്നാണ്; എന്നാൽ ഈ അധ്യായത്തിലെ നിർദേശങ്ങൾ അനുസരിക്കേണ്ടതാണെന്ന വാദത്തിൽ ഇത് കർത്താവിന്റെ അധികാരമുള്ള കല്പനയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘കല്പന’ ഗ്രീക്കിൽ പ്രത്യക്ഷമായി ഇല്ലെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നതിനാൽ യഥാർഥത്തിലെ സംക്ഷിപ്തതയും ആശയസാധ്യതയും മറച്ചുവയ്ക്കുന്നില്ല.
- issue: τις ... προφήτης ... πνευματικός എന്നതിലെ വ്യാകരണലിംഗം
  choice: ‘ആരെങ്കിലും’ എന്ന പൊതുപ്രയോഗത്തോടൊപ്പം ‘അയാൾ’ എന്ന പുല്ലിംഗ ഏകവചനം ഉപയോഗിക്കുന്നു.
  alternative: അവർത്തനത്തിൽ സർവനാമം ഒഴിവാക്കുക, അല്ലെങ്കിൽ ലിംഗനിരപേക്ഷമായ ബഹുവചനം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ രൂപങ്ങൾ പുല്ലിംഗ ഏകവചനമാണെങ്കിലും പരാമർശം ഏതൊരു വ്യക്തിയെയും പൊതുവായി ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ സ്വാഭാവിക വാക്യഘടനയിൽ വ്യാകരണരൂപം നിലനിർത്താൻ ‘അയാൾ’ ഉപയോഗിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ദൈവിക അധികാരം വ്യക്തമാക്കുമ്പോഴും ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും അടിക്കുറിപ്പിലൂടെ സൂക്ഷിച്ചിരിക്കുന്നു.
