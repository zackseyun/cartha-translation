  naturalness: ‘താൻ ഒരു പ്രവാചകനോ ആത്മികനോ ആണെന്ന് ആരെങ്കിലും കരുതുന്നെങ്കിൽ ... അയാൾ അംഗീകരിക്കട്ടെ’ എന്ന വാക്യം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമാണ്. ‘ആത്മികൻ’ ഈ സന്ദർഭത്തിലെ സംക്ഷിപ്ത ഗ്രീക്ക് വിശേഷണത്തിന്റെ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
