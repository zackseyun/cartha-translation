lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻചർച്ചയിൽനിന്നുള്ള നിഗമനവും സംഗ്രഹാത്മകമായ ആഹ്വാനവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: μου എന്ന ഉടമസ്ഥസർവനാമവും പുല്ലിംഗ ബഹുവചനത്തിലുള്ള സംബോധനയും നിലനിർത്തുന്നു; സഭ മുഴുവനെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ζηλοῦτε
  choice: ഉത്സാഹിക്കുവിൻ
  rationale: തുടർച്ചയായ തീക്ഷ്ണമായ അഭിലാഷത്തെയും പരിശ്രമത്തെയും സൂചിപ്പിക്കുന്ന വർത്തമാനകാല ആജ്ഞയുടെ ശക്തി മാന്യവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ προφητεύειν
  choice: പ്രവചിക്കാൻ
  rationale: ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ പ്രവർത്തനത്തെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μὴ κωλύετε
  choice: വിലക്കരുത്
  rationale: സഭയിലെ ഈ പ്രവൃത്തിയെ നിരോധിക്കരുതെന്ന നേരിട്ടുള്ള വിലക്കിനെ കൃത്യമായി അറിയിക്കുന്നു.
- source_word: τὸ λαλεῖν γλώσσαις
  choice: അന്യഭാഷകളിൽ സംസാരിക്കുന്നത്
  rationale: ഈ അധ്യായത്തിൽ ചർച്ചചെയ്യുന്ന ഭാഷകളിൽ സംസാരിക്കുന്ന പ്രവൃത്തിയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; γλώσσαις എന്നതിലെ ഭാഷ/നാവ് എന്ന അർത്ഥവ്യാപ്തിയിൽ സന്ദർഭോചിതമായ ഭാഷ എന്ന അർത്ഥം സ്വീകരിക്കുന്നു.
theological_decisions:
- issue: മിശ്രലിംഗ സഭയെ അഭിസംബോധന ചെയ്യുന്ന ἀδελφοί എന്ന പുല്ലിംഗ ബഹുവചനം
  choice: എന്റെ സഹോദരന്മാരേ
  alternative: എന്റെ സഹോദരീസഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപവും μου എന്നതും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; എന്നാൽ ഇത് സഭയിലെ സ്ത്രീകളെയും ഉൾപ്പെടുത്തി ഉപയോഗിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: γλώσσαις എന്നതിന്റെ സന്ദർഭോചിത അർത്ഥം
  choice: അന്യഭാഷകളിൽ
  alternative: നാവുകളിൽ
  rationale: ഗ്രീക്കുപദത്തിന് നാവുകൾ എന്നും ഭാഷകൾ എന്നും അർത്ഥമുണ്ടാകാം. 1 കൊരിന്ത്യർ 14-ലെ സംസാരപ്രവൃത്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കാൻ ‘അന്യഭാഷകളിൽ’ എന്നു നൽകി; ഭാഷകളുടെ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
