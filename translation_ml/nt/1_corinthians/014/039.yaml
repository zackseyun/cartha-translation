  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ സഹോദരന്മാരേ[a], പ്രവചിക്കാൻ തീക്ഷ്ണമായി ആഗ്രഹിക്കുവിൻ; ഭാഷകളിൽ സംസാരിക്കുന്നത് വിലക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ സഹോദരന്മാരും സഹോദരിമാരുമായവരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാരേ’ എന്നാണ്, എന്നാൽ ഇവിടെ അത് സഭയിലെ മുഴുവൻ വിശ്വാസികളെയും ഉൾപ്പെടുത്തി അഭിസംബോധന ചെയ്യുന്നതാകാം.
