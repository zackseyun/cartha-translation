base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/029.yaml
  text: Let two or three prophets speak[a], and let the others weigh what is said.
translation:
  language: ml
  text: രണ്ടോ മൂന്നോ പ്രവാചകന്മാർ സംസാരിക്കട്ടെ; മറ്റുള്ളവർ പറഞ്ഞത് വിലയിരുത്തട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിധിക്കട്ടെ,’ ‘വിവേചിച്ചറിയട്ടെ,’ അല്ലെങ്കിൽ ‘പരിശോധിക്കട്ടെ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ ഗ്രീക്ക് ക്രിയ പ്രവാചകവചനത്തെ വിലയിരുത്തുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆται
  choice: പ്രവാചകന്മാർ
  rationale: പ്രവാചകസന്ദേശം സംസാരിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ നേരിട്ടുള്ളതും സഭാസന്ദർഭത്തിന് യോജിച്ചതുമായ പരിഭാഷ.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല; അർധവിരാമത്തിലൂടെ നിർദേശങ്ങളുടെ തുടർച്ച വ്യക്തമാക്കി
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, നിർദേശപരമ്പരയിലെ മൃദുവായ മാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും ഈ ബന്ധം സ്വാഭാവികമാണ്.
- source_word: δύο ἢ τρεῖς
  choice: രണ്ടോ മൂന്നോ പേർ
  rationale: സംഖ്യാവാചകപ്രയോഗം നേരിട്ട് നിലനിർത്തി; വ്യക്തികളെ സൂചിപ്പിക്കുന്നതിനായി മലയാളത്തിൽ ‘പേർ’ ചേർത്തു.
- source_word: λαλείτωσαν
  choice: സംസാരിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞയുടെ നിർദേശാത്മക ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ἄλλοι
  choice: മറ്റുള്ളവർ
  rationale: ഇത് മറ്റു പ്രവാചകരെയോ സഭയിലെ ശേഷിച്ചവരെയോ എന്ന് ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ നിർവചിക്കാതെ അതേ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: διακρινέτωσαν
  choice: വിവേചിച്ച് വിലയിരുത്തട്ടെ
  rationale: ഈ സന്ദർഭത്തിൽ പ്രവാചകവചനത്തെ സൂക്ഷ്മമായി പരിശോധിച്ച് നിർണയിക്കുക എന്ന അർത്ഥം വ്യക്തമാക്കുന്നു; കുറ്റവിധി എന്ന പരിമിതമായ ധ്വനി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ‘മറ്റുള്ളവർ’ ആരെയാണ് സൂചിപ്പിക്കുന്നത്?
  choice: ‘മറ്റുള്ളവർ’ എന്ന് പൊതുവായി നിലനിർത്തി.
  alternative: മറ്റു പ്രവാചകർ; അല്ലെങ്കിൽ സഭയിലെ ശേഷിച്ച എല്ലാവരും.
  rationale: οἱ ἄλλοι എന്ന ഗ്രീക്ക് പ്രയോഗം ഈ കൂട്ടത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല. അതിനാൽ സഭാഭരണത്തെയോ പങ്കാളികളുടെ അധികാരത്തെയോ സംബന്ധിച്ച ഒരു പ്രത്യേക വ്യാഖ്യാനം പരിഭാഷയിൽ അടിച്ചേൽപ്പിച്ചിട്ടില്ല.
- issue: വിലയിരുത്തലിന്റെ വിഷയം
  choice: സന്ദർഭത്തിൽ നിന്ന് മനസ്സിലാകുന്ന ‘പറഞ്ഞത്’ എന്ന കർമം വ്യക്തമാക്കി.
  alternative: കർമം പറയാതെ ‘വിവേചിക്കട്ടെ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്കിൽ കർമം പ്രകടമായി ഇല്ലെങ്കിലും പ്രവാചകർ സംസാരിച്ചതാണ് വിലയിരുത്തപ്പെടുന്നത് എന്ന് സന്ദർഭം വ്യക്തമാക്കുന്നു. സ്വാഭാവിക മലയാളത്തിനായി അത് ചേർത്തത് പുതിയ ദൈവശാസ്ത്രനിഗമനം സൃഷ്ടിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ സഭാസന്ദർഭ ഭാഷ. ‘പ്രവാചകന്മാർ’ എന്ന പരമ്പരാഗതമായി പരിചിതമായ പദം നിലനിർത്തിയപ്പോൾ, ബാക്കി വാക്യം സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്ന രീതിയിൽ രൂപപ്പെടുത്തി.
