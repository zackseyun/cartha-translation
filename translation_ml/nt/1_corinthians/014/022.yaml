id: 1CO.14.22
reference: 1 Corinthians 14:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഭാഷകൾ[a] വിശ്വസിക്കുന്നവർക്കല്ല, അവിശ്വാസികൾക്ക് ഒരു അടയാളമാണ്[b]; എന്നാൽ പ്രവചനം അവിശ്വാസികൾക്കല്ല, വിശ്വസിക്കുന്നവർക്കുള്ളതാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്ക് പദത്തിന് അക്ഷരാർഥത്തിൽ ‘നാവുകൾ’ എന്നും സന്ദർഭമനുസരിച്ച് ‘ഭാഷകൾ’ എന്നും അർഥമാകാം. 1 കൊരിന്ത്യർ 12–14-ൽ ഇത് പ്രത്യേകമായൊരു സംസാരപ്രകടനത്തെ സൂചിപ്പിക്കുന്നു; അത് വിദേശഭാഷകളെയാണോ മറ്റൊരു തരത്തിലുള്ള ഉച്ചാരണത്തെയാണോ ഉദ്ദേശിക്കുന്നത് എന്ന് ഈ പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: മുൻവാക്യത്തിൽ ഉദ്ധരിച്ചിരിക്കുന്ന യെശയ്യാവ് 28:11–12-ന്റെ വെളിച്ചത്തിൽ, ചില വ്യാഖ്യാതാക്കൾ ഇതിനെ ന്യായവിധിയുടെ അടയാളമായി മനസ്സിലാക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: γλῶσσαι
  choice: അന്യഭാഷകൾ
  rationale: 1 കൊരിന്ത്യർ 12–14-ലെ പ്രത്യേക ആത്മീയപ്രകടനത്തെ സൂചിപ്പിക്കാൻ മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ പരിചിതമായ പദം; അത് വിദേശഭാഷകളോ ആവേശജന്യമായ ഉച്ചാരണങ്ങളോ ആണെന്ന തർക്കം മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: εἰς σημεῖόν
  choice: ഒരു അടയാളം
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യ/ഫലബന്ധം മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; അടയാളം അനുകൂലമാണോ ന്യായവിധിയുടേതാണോ എന്ന് വ്യക്തമാക്കാതെ വിടുന്നു.
- source_word: τοῖς πιστεύουσιν
  choice: വിശ്വസിക്കുന്നവർക്ക്
  rationale: സുബ്സ്റ്റാന്റീവായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ ക്രിയാത്മകഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: τοῖς ἀπίστοις
  choice: അവിശ്വാസികൾക്ക്
  rationale: വിശ്വസിക്കുന്നവരോടുള്ള വ്യക്തമായ സാമുദായിക-മതപരമായ വൈരുധ്യം സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: προφητεία
  choice: പ്രവചനം
  rationale: ഈ അധ്യായത്തിലെ പ്രവചനവരം/പ്രവർത്തനം സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും നേരിട്ടുള്ളതുമായ മലയാളപദം.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: അന്യഭാഷകളും പ്രവചനവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ആത്മീയവരങ്ങളുടെ സന്ദർഭത്തിലെ γλῶσσαι എന്നതിന്റെ സ്വഭാവം
  choice: അന്യഭാഷകൾ
  alternative: വിദേശഭാഷകൾ; ആവേശജന്യമായ ഉച്ചാരണങ്ങൾ; ഭാഷകൾ
  rationale: പദത്തിന്റെ കൃത്യമായ പ്രതിഭാസസ്വഭാവം വിവാദവിഷയമായതിനാൽ ഏതെങ്കിലും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- issue: അവിശ്വാസികളോടുള്ള σημεῖον എന്ന അടയാളത്തിന്റെ സ്വഭാവം
  choice: ഒരു അടയാളം
  alternative: സ്ഥിരീകരിക്കുന്ന അടയാളം; ന്യായവിധിയുടെ അടയാളം
  rationale: മുൻവാക്യത്തിലെ യെശയ്യാവുദാഹരണം ന്യായവിധിയെന്ന വായനയ്ക്ക് ഇടനൽകുന്നുവെങ്കിലും ഗ്രീക്ക് വാചകം ‘അടയാളം’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവവും സംക്ഷിപ്തതയും പാലിച്ചു. സമാന്തരവാക്യഘടനയും ‘അല്ല... ആണ്’ എന്ന വൈരുധ്യരൂപവും ഗ്രീക്ക് വാചകത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
