id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: ml
  text: അതുകൊണ്ട്, സഭ മുഴുവനും ഒരേ സ്ഥലത്ത് കൂടിവരുകയും എല്ലാവരും അന്യഭാഷകളിൽ സംസാരിക്കുകയും ചെയ്യുമ്പോൾ[a], അറിവില്ലാത്തവരോ അവിശ്വാസികളോ അകത്തേക്കു പ്രവേശിച്ചാൽ[b], നിങ്ങൾക്ക് ഭ്രാന്താണെന്ന് അവർ പറയുകയില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭാഷകളിൽ സംസാരിക്കുകയും ചെയ്യുമ്പോൾ.” ഗ്രീക്ക് പദത്തിന് “ഭാഷകൾ” എന്നർഥം വരാം; എന്നാൽ ഇവിടെ പറയുന്ന പ്രതിഭാസത്തിന്റെ തർക്കവിധേയമായ സ്വഭാവം തീർപ്പാക്കാതിരിക്കാനാണ് പ്രധാനപാഠത്തിൽ ഈ സന്ദർഭത്തിൽ പരിചിതമായ “അന്യഭാഷകൾ” എന്ന പ്രയോഗം ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: “അറിവില്ലാത്തവർ” എന്നതിന് “പുറത്തുനിന്നുള്ളവർ” എന്നും പരിഭാഷപ്പെടുത്താം. സഭയിലെ രീതികളെക്കുറിച്ച് അറിവോ പരിചയമോ ഇല്ലാത്തവരെയായിരിക്കാം ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്; ഇവിടെ അവരെ “അവിശ്വാസികളിൽ”നിന്ന് വേർതിരിച്ചാണ് പറയുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησία
  choice: സഭ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇവിടെ കൂടിവന്നിരിക്കുന്ന ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും സ്ഥിരവുമായ പദം.
- source_word: ἐπὶ τὸ αὐτό
  choice: ഒരേ സ്ഥലത്ത്
  rationale: ഒരേ ഇടത്തിൽ ഒത്തുകൂടുന്നതെന്ന സ്ഥലപരമായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λαλῶσιν γλώσσαις
  choice: അന്യഭാഷകളിൽ സംസാരിക്കുക
  rationale: മലയാള ബൈബിൾഭാഷയിൽ ഈ വരദാനപ്രതിഭാസത്തിനുള്ള പരിചിതമായ പ്രയോഗമാണിത്; പ്രതിഭാസത്തിന്റെ കൃത്യസ്വഭാവം തീർപ്പാക്കാതിരിക്കാനായി അടിക്കുറിപ്പ് ചേർത്തിരിക്കുന്നു.
- source_word: ἰδιῶται
  choice: കാര്യപരിചയമില്ലാത്തവർ
  rationale: സഭയിലെ ഈ ആചാരത്തെക്കുറിച്ച് അറിവോ പരിചയമോ ഇല്ലാത്തവരെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള ‘അവിശ്വാസികൾ’ എന്ന വിഭാഗത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἄπιστοι
  choice: അവിശ്വാസികൾ
  rationale: വിശ്വസിക്കാത്തവരെ സൂചിപ്പിക്കുന്ന വ്യക്തവും പതിവുമായ മലയാളരൂപം.
- source_word: μαίνεσθε
  choice: നിങ്ങൾക്ക് ഭ്രാന്താണ്
  rationale: ഭ്രാന്തുപിടിച്ചിരിക്കുന്നു എന്ന കുറ്റപ്പെടുത്തലിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: συνέλθῃ
  choice: കൂടിവരുക
  rationale: ഒന്നിച്ചുകൂടുക എന്ന അർഥം സഭായോഗത്തിന്റെ സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: 1 കൊരിന്ത്യർ 14-ലെ γλώσσαι എന്നതിന്റെ സ്വഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘അന്യഭാഷകൾ’ എന്നു നൽകി.
  alternative: ‘ഭാഷകൾ’ അല്ലെങ്കിൽ ‘നാവുകൾ’
  rationale: γλῶσσαι ഭാഷകളെ സൂചിപ്പിക്കാമെങ്കിലും ഈ അധ്യായത്തിൽ ചർച്ചചെയ്യുന്ന ആത്മിക വരദാനപ്രതിഭാസത്തിന്റെ അംഗീകൃത പേരായി പ്രവർത്തിക്കുന്നു. ‘അന്യഭാഷകൾ’ എന്ന പരിചിത പ്രയോഗത്തോടൊപ്പം അടിക്കുറിപ്പ് നൽകുന്നത് അവ മനുഷ്യഭാഷകളോ ഉന്മാദസദൃശമായ ഉച്ചാരണമോ രണ്ടും ഉൾപ്പെടുന്നതോ എന്ന തർക്കം പരിഭാഷയിലൂടെ തീർപ്പാക്കുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സഭ’, ‘അവിശ്വാസികൾ’, ‘അന്യഭാഷകൾ’ തുടങ്ങിയ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
