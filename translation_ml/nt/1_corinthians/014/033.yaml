id: 1CO.14.33
reference: 1 Corinthians 14:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: ml
  text: കാരണം, ദൈവം ക്രമക്കേടിന്റെ ദൈവമല്ല, സമാധാനത്തിന്റെ ദൈവമാണ്[a], വിശുദ്ധരുടെ എല്ലാ സഭകളിലും കാണുന്നതുപോലെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവം ആശയക്കുഴപ്പത്തിന്റെ ദൈവമല്ല, സമാധാനത്തിന്റെ ദൈവമാണ്.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “ദൈവത്തിന്റെ വിശുദ്ധജനങ്ങളുടെ എല്ലാ സഭകളിലും ഇതുപോലെയാണ്.” ചിലർ ഈ വാക്യഭാഗത്തെ ഈ വാക്യത്തോടല്ല, തുടർന്നുള്ള വാക്യത്തോടാണ് ബന്ധിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: ക്രമക്കേട്
  rationale: സഭായോഗത്തിലെ നിയന്ത്രണമില്ലാത്തതും അലങ്കോലവുമായ അവസ്ഥയെ സൂചിപ്പിക്കാൻ ‘ക്രമക്കേട്’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘ആശയക്കുഴപ്പം’ എന്ന മാനസിക അർഥത്തിലേക്ക് പദത്തെ ചുരുക്കുന്നില്ല.
- source_word: εἰρήνης
  choice: സമാധാനം
  rationale: ἀκαταστασίαയ്ക്കു വിപരീതമായി സഭയിലെ ക്രമവും ഐക്യവും ഉൾക്കൊള്ളുന്ന സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ പരിഭാഷ.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: നിശ്ചിതവും വ്യക്തിപരവുമായ ഏകദൈവത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: ഉള്ളതുപോലെ
  rationale: എല്ലാ സഭകളിലും കാണുന്ന നിലയുമായുള്ള താരതമ്യം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വാക്യഭാഗത്തിന്റെ ബന്ധത്തിൽ ഉള്ള അവ്യക്തത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐκκλησίαις
  choice: സഭകൾ
  rationale: പ്രാദേശിക ക്രൈസ്തവസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും സന്ദർഭോചിതവുമായ മലയാളപദം.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധർ
  rationale: വിശ്വാസികൾക്കായുള്ള പൗലോസിന്റെ പതിവുപേരിന്റെ പദബന്ധവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻ നിർദേശങ്ങൾക്ക് ഈ പ്രസ്താവന നൽകുന്ന കാരണം മലയാളത്തിൽ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων എന്ന വാക്യഭാഗത്തിന്റെ ബന്ധം
  choice: 33-ാം വാക്യത്തോടു ചേർത്ത്, എല്ലാ സഭകളിലുമുള്ള നിലയുമായുള്ള താരതമ്യമായി വായിക്കുന്നു.
  alternative: തുടർന്നുള്ള 34-ാം വാക്യത്തിന്റെ ആരംഭമായി ബന്ധിപ്പിക്കാം.
  rationale: നൽകിയിരിക്കുന്ന SBLGNT വിരാമചിഹ്നക്രമം ഈ ഭാഗത്തെ 33-ാം വാക്യത്തോടു ചേർക്കുന്നു; എങ്കിലും വാക്യഘടനാപരമായ ബന്ധം വിവാദമായതിനാൽ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സഭാപരമായ ശൈലി. ആവർത്തിച്ചുള്ള ‘ദൈവം’ മലയാളത്തിൽ വിരുദ്ധഘടന വ്യക്തമാക്കുന്നതിനായി നിലനിർത്തി. പ്രധാന വാക്യത്തിലെ ദീർഘവിരാമം താരതമ്യവാക്യഭാഗത്തെ വായനാസൗകര്യത്തോടെ വേർതിരിക്കുമ്പോഴും അതിനെ ഈ വാക്യത്തോടുതന്നെ ബന്ധിപ്പിക്കുന്നു.
