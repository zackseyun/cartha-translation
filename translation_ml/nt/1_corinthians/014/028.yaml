lexical_decisions:
- source_word: διερμηνευτής
  choice: വ്യാഖ്യാനിക്കുന്നവൻ
  rationale: അന്യഭാഷയിൽ പറയുന്നത് മറ്റുള്ളവർക്ക് മനസ്സിലാകുന്നവിധം അർത്ഥം പറഞ്ഞുകൊടുക്കുന്ന വ്യക്തിയെയാണ് സന്ദർഭത്തിൽ സൂചിപ്പിക്കുന്നത്. ‘വ്യാഖ്യാനിക്കുന്നവൻ’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും പ്രവർത്തനത്തെ വ്യക്തമായി അറിയിക്കുന്നതുമാണ്.
- source_word: σιγάτω
  choice: മിണ്ടാതിരിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞയുടെ നിർദേശബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സമ്പൂർണമായ എല്ലാ സംസാരവും നിരോധിക്കുന്നുവെന്ന് അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἐν ἐκκλησίᾳ
  choice: സഭയിൽ
  rationale: 1 കൊരിന്ത്യർ 14-ലെ കൂടിവന്ന ക്രൈസ്തവസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭയിൽ’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്; ‘സഭായോഗത്തിൽ’ എന്നും മനസ്സിലാക്കാം.
- source_word: ἑαυτῷ
  choice: തന്നോട്
  rationale: പ്രതിഫലന സർവനാമത്തിന്റെ ദത്തിവിഭക്തി നേരിട്ട് പകർത്തുന്നു. ‘സ്വകാര്യമായി’ എന്ന ആശയം ചേർക്കാതെ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: λαλείτω
  choice: സംസാരിക്കട്ടെ
  rationale: തുടർന്നുള്ള മൂന്നാംപുരുഷ ആജ്ഞയെ മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: ‘സംസാരിക്കുക’ എന്ന ക്രിയയോടു ചേരുന്ന ദത്തിവിഭക്തിയുടെ സ്വാഭാവിക മലയാളരൂപമാണ്.
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: എന്നാൽ ... ഇല്ലെങ്കിൽ
  rationale: ഉപാധിവാക്യവും δέ സൂചിപ്പിക്കുന്ന വ്യത്യാസവും ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സഭായോഗത്തിലെ മൗനനിർദേശത്തിന്റെ പരിധി
  choice: വ്യാഖ്യാനിക്കുന്നവൻ ഇല്ലാത്തപ്പോൾ സഭയെ അഭിസംബോധന ചെയ്യുന്ന പരസ്യസംസാരം നിർത്തണമെന്ന നിർദേശമായി പരിഭാഷപ്പെടുത്തി; തന്നോടും ദൈവത്തോടും സംസാരിക്കാനുള്ള വിരുദ്ധനിർദേശം അതേപടി നിലനിർത്തി.
  alternative: സംസാരിക്കുന്നയാൾ എല്ലാത്തരം സംസാരവും പൂർണമായി നിർത്തണം; അല്ലെങ്കിൽ സഭയെ അഭിസംബോധന ചെയ്യുന്നതുപോലെ കേൾക്കാവുന്ന രീതിയിൽ തുടർന്നും സംസാരിക്കാം.
  rationale: ‘സഭയിൽ മിണ്ടാതിരിക്കട്ടെ’ എന്നതിനും ‘തന്നോടും ദൈവത്തോടും സംസാരിക്കട്ടെ’ എന്നതിനും ഇടയിലെ വൈരുധ്യം, എല്ലാ സംസാരത്തിനുമുള്ള സമ്പൂർണ വിലക്കിനേക്കാൾ സഭയോടുള്ള പരസ്യമായ ഉച്ചാരണത്തിനുള്ള നിയന്ത്രണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ആത്മീയവരങ്ങളെക്കുറിച്ചുള്ള പ്രത്യേക സഭാവിഭാഗീയ നിലപാട് ചേർക്കാതെ പാഠത്തിലെ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ആജ്ഞകളുടെ നിർദേശബലം ‘-ട്ടെ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. ആശയവ്യക്തതയ്ക്കായി ‘അയാൾ’ ഉപയോഗിച്ചു; ലിംഗനിർണ്ണയം ഉദ്ദേശിക്കുന്നില്ല. അടിക്കുറിപ്പ് യഥാർത്ഥത്തിൽ വിശദീകരിക്കുന്ന ἐν ἐκκλησίᾳ എന്ന ഭാഗമായ ‘സഭയിൽ’ എന്നതിനോടാണ് [a] ചേർത്തിരിക്കുന്നത്.
