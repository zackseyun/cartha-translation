id: 1CO.14.14
reference: 1 Corinthians 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ ഭാഷയിൽ[a] പ്രാർഥിക്കുന്നുവെങ്കിൽ, എന്റെ ആത്മാവ് പ്രാർഥിക്കുന്നു; എന്നാൽ എന്റെ മനസ്സ്[b] ഫലം കായ്ക്കുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാവുകൊണ്ട്” അല്ലെങ്കിൽ “ഒരു ഭാഷയിൽ.” ഗ്രീക്ക് പദത്തിന് മനുഷ്യഭാഷയെയോ, ഈ അധ്യായത്തിൽ ആത്മപ്രേരിതമായ സംസാരത്തെ സൂചിപ്പിക്കുന്ന “നാവ്” എന്ന അർഥത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്റെ ഗ്രാഹ്യശക്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: എന്തെന്നാൽ, … പ്രാർഥിക്കുന്നെങ്കിൽ
  rationale: γάρ-ന്റെ വിശദീകരണഭാവവും ἐάν-ന്റെ വ്യവസ്ഥാഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: προσεύχωμαι
  choice: ഞാൻ … പ്രാർഥിക്കുന്നെങ്കിൽ
  rationale: ἐάν-നോടുകൂടിയ വർത്തമാനകാല subjunctive-നെ മലയാളത്തിലെ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: γλώσσῃ
  choice: അന്യഭാഷയിൽ
  rationale: γλῶσσα എന്നതിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമുണ്ട്. ഈ അധ്യായത്തിലെ ആത്മപ്രേരിതമായ ഭാഷണത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘അന്യഭാഷ’ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ പദമാണ്; ഗ്രീക്കിൽ ‘അന്യ’ എന്ന വിശേഷണം പ്രത്യേകം ഇല്ലാത്തതിനാൽ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: τὸ πνεῦμά μου
  choice: എന്റെ ആത്മാവ്
  rationale: ഉടമസ്ഥസർവനാമവും ‘എന്റെ മനസ്സ്’ എന്നതുമായ വൈരുധ്യവും പ്രഭാഷകന്റെ സ്വന്തം ആത്മാവിനെയാണ് പ്രാഥമികമായി സൂചിപ്പിക്കുന്നത്; പരിശുദ്ധാത്മാവ് എന്ന് വ്യാഖ്യാനിച്ച് ചേർക്കുന്നില്ല.
- source_word: προσεύχεται
  choice: പ്രാർഥിക്കുന്നു
  rationale: ഗ്രീക്ക് വർത്തമാനകാലത്തെ ലളിതവും സ്വാഭാവികവുമായ മലയാള വർത്തമാനരൂപത്തിൽ നൽകുന്നു.
- source_word: ὁ δὲ νοῦς μου
  choice: എന്നാൽ എന്റെ മനസ്സ്
  rationale: νοῦς എന്നത് മനസ്സ്, ഗ്രാഹ്യം, ചിന്താശക്തി എന്നിവയെ സൂചിപ്പിക്കാം. ‘മനസ്സ്’ ആത്മാവുമായുള്ള വൈരുധ്യം നിലനിർത്തുന്ന വിശാലവും നേരിട്ടുള്ളതുമായ തുല്യപദമാണ്.
- source_word: ἄκαρπός ἐστιν
  choice: ഫലം കായ്ക്കുന്നില്ല
  rationale: ἄκαρπος എന്ന പദത്തിലെ ഫലത്തിന്റെ രൂപകം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘പ്രയോജനമില്ല’ എന്ന വ്യാഖ്യാനപരമായ ചുരുക്കം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: τὸ πνεῦμά μου (‘എന്റെ ആത്മാവ്’) എന്നതിന്റെ സൂചിതവിഷയം
  choice: പ്രാർഥിക്കുന്ന വ്യക്തിയുടെ സ്വന്തം ആത്മാവ്
  alternative: ആ വ്യക്തിയിൽ പ്രവർത്തിക്കുന്ന പരിശുദ്ധാത്മാവ്
  rationale: ‘എന്റെ’ എന്ന ഉടമസ്ഥപ്രയോഗവും ‘എന്റെ മനസ്സ്’ എന്ന സമാന്തരവൈരുധ്യവും വ്യക്തിയുടെ ആത്മാവിനെ അനുകൂലിക്കുന്നു. എങ്കിലും വിവർത്തനം ‘പരിശുദ്ധാത്മാവ്’ എന്ന് ചേർത്ത് മറ്റൊരു വായനയെ പൂർണമായി അടച്ചുകളയുന്നില്ല.
- issue: νοῦς എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: മനസ്സ്
  alternative: ഗ്രാഹ്യം / ഗ്രാഹ്യശക്തി
  rationale: ‘മനസ്സ്’ എന്നത് പദത്തിന്റെ വിശാലതയും ആത്മാവ്–മനസ്സ് വൈരുധ്യവും സൂക്ഷിക്കുന്നു; ‘ഗ്രാഹ്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘ഫലം കായ്ക്കുന്നില്ല’ എന്ന പ്രയോഗം പൗലോസിന്റെ രൂപകം നിലനിർത്തുന്നു. ‘അന്യഭാഷ’ സഭാപശ്ചാത്തലത്തിൽ പരിചിതമാണെങ്കിലും മൂലപദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
