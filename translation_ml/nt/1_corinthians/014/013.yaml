  text: Therefore[b][a], the one who speaks in a tongue should pray that he may interpret.
translation:
  language: ml
  text: അതുകൊണ്ട്, അന്യഭാഷയിൽ[a] സംസാരിക്കുന്നയാൾ താൻ വ്യാഖ്യാനിക്കാനായി പ്രാർഥിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം “നാവുകൊണ്ട്”; “ഒരു ഭാഷയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം. ഈ അധ്യായത്തിൽ വ്യാഖ്യാനം ആവശ്യമായ സംസാരത്തിന് പതിവായി ഉപയോഗിക്കുന്ന പദമാണിത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ചർച്ചയിൽനിന്നുള്ള നിഗമനം അവതരിപ്പിക്കുന്ന അനുമാനസൂചക സംയോജകത്തിന്റെ ശക്തി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ὁ λαλῶν
  choice: സംസാരിക്കുന്നയാൾ
  rationale: നാമവൽക്കരിച്ച വർത്തമാനകാല കൃദന്തത്തിന്റെ പൊതുവായ ഏകവചന അർഥവും തുടരുന്ന പ്രവൃത്തിയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γλώσσῃ
  choice: അന്യഭാഷയിൽ
  rationale: സഭയ്ക്ക് വ്യാഖ്യാനം കൂടാതെ മനസ്സിലാകാത്ത സംസാരത്തെ സൂചിപ്പിക്കുന്ന ഈ അധ്യായത്തിലെ പ്രയോഗബന്ധം നിലനിർത്തുന്നു. ഗ്രീക്കിൽ പദം അക്ഷരാർഥത്തിൽ ‘നാവ്’ എന്നും പ്രയോഗത്തിൽ ‘ഭാഷ’ എന്നും വരുന്നതിനാൽ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: προσευχέσθω
  choice: പ്രാർഥിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനാത്മക ശക്തി മാന്യവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പകരുന്നു.
- source_word: ἵνα διερμηνεύῃ
  choice: താൻ വ്യാഖ്യാനിക്കേണ്ടതിന്
  rationale: പ്രാർഥനയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുകയും സംസാരിക്കുന്ന അതേ വ്യക്തി വ്യാഖ്യാനിക്കണമെന്ന ഗ്രീക്ക് ഏകവചനരൂപം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; ‘വിവർത്തനം’ എന്നതിനെക്കാൾ വിശാലമായ അർഥം ‘വ്യാഖ്യാനിക്കുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: γλώσσῃ എന്നതിന്റെ സ്വഭാവം
  choice: അന്യഭാഷയിൽ
  alternative: ഒരു ഭാഷയിൽ; നാവിൽ
  rationale: വ്യാഖ്യാനം ആവശ്യമായ ആത്മിക സംസാരമെന്ന സന്ദർഭബന്ധം ‘അന്യഭാഷ’ നിലനിർത്തുന്നു; അതേസമയം ഇത് സാധാരണ മനുഷ്യഭാഷയാണോ മറ്റൊരു തരത്തിലുള്ള സംസാരമാണോ എന്ന തർക്കം മുഖ്യപാഠത്തിൽ നിർണയിക്കുന്നില്ല.
- issue: വ്യാഖ്യാനിക്കുന്ന വ്യക്തിയുടെ തിരിച്ചറിയൽ
  choice: താൻ വ്യാഖ്യാനിക്കേണ്ടതിന്
  alternative: വ്യാഖ്യാനം ഉണ്ടാകേണ്ടതിന്
  rationale: διερμηνεύῃ എന്ന ഏകവചന ക്രിയയുടെ കർത്താവ് ഭാഷയിൽ സംസാരിക്കുന്ന വ്യക്തി തന്നെയാണെന്ന വ്യാകരണബന്ധം നിലനിർത്തുന്നു. മലയാളത്തിലെ ‘താൻ’ ലിംഗഭേദമില്ലാതെ പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ‘പ്രാർഥിക്കട്ടെ’ ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്നു; ‘താൻ’ ലിംഗനിർപേക്ഷമായി പൊതുവായ ഏകവചനത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
