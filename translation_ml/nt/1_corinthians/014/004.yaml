id: 1CO.14.4
reference: 1 Corinthians 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/004.yaml
  text: The one who speaks in a tongue builds up himself[c][b][a], but the one who prophesies builds up the church.
translation:
  language: ml
  text: ഭാഷയിൽ സംസാരിക്കുന്നവൻ സ്വയം ശക്തിപ്പെടുത്തുന്നു[a][b]; എന്നാൽ പ്രവചിക്കുന്നവൻ സഭയെ ശക്തിപ്പെടുത്തുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിലെ പദത്തിന് ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമാകാം. ഈ അധ്യായത്തിൽ അത് ഭാഷകളിൽ സംസാരിക്കുന്ന വരത്തെ സൂചിപ്പിക്കുന്നതായിരിക്കാം; ആ സംസാരത്തിന്റെ കൃത്യമായ സ്വഭാവം വിവാദവിഷയമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘തന്നെത്തന്നെ’; പുല്ലിംഗ ഏകവചനരൂപം ഇവിടെ പ്രതിനിധിപരമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘കൂടിവരുന്ന സമൂഹത്തെ’ അല്ലെങ്കിൽ ‘വിശ്വാസിസമൂഹത്തെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: സംസാരിക്കുന്നവൻ
  rationale: നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ പ്രതിനിധിപരമായ ഏകവചന ഘടനയും രണ്ടാം പാദത്തിലെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: γλώσσῃ
  choice: അന്യഭാഷയിൽ
  rationale: ഈ അധ്യായത്തിലെ പ്രത്യേക ആത്മിക വരത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗമാണിത്; അതിന്റെ കൃത്യമായ സ്വഭാവം അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- source_word: ἑαυτὸν
  choice: തന്നെ
  rationale: ഗ്രീക്കിലെ പ്രത്യാവർത്തക സർവനാമത്തിന്റെ ഏകവചനവും പ്രതിനിധിപരമായ അർഥവും സ്വാഭാവികമായി നൽകുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ലിംഗനിർണ്ണയം വരുത്തുന്നില്ല.
- source_word: οἰκοδομεῖ
  choice: ആത്മികമായി വളർത്തുന്നു
  rationale: അക്ഷരാർഥമായ ‘പണിയുന്നു’ എന്ന നിർമ്മാണരൂപകത്തിന്റെ സന്ദർഭാർഥം ആത്മിക ശക്തിപ്പെടുത്തലാണ്; സാധാരണ വായനക്കാർക്ക് വ്യക്തത നൽകാൻ അതു സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ δὲ προφητεύων
  choice: എന്നാൽ പ്രവചിക്കുന്നവൻ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും നാമവാചക കൃദന്തത്തിന്റെ ഘടനയും നിലനിർത്തുന്നു.
- source_word: ἐκκλησίαν
  choice: സഭയെ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ കൂടിവരുന്ന വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പരിചിതവും സ്വാഭാവികവുമായ മലയാള പദമാണ്.
theological_decisions:
- issue: 1 കൊരിന്ത്യർ 12–14-ൽ γλώσσῃ എന്നതിന്റെ അർഥം
  choice: അന്യഭാഷയിൽ
  alternative: ഒരു ഭാഷയിൽ; ഭാഷാവരത്തിൽ
  rationale: സന്ദർഭം ആത്മാവിന്റെ ഭാഷാവരത്തെക്കുറിച്ചാണെങ്കിലും സംസാരത്തിന്റെ കൃത്യമായ സ്വഭാവം വിവാദവിധേയമാണ്. മുഖ്യപാഠം പരിചിതമായ പദം ഉപയോഗിക്കുകയും അടിക്കുറിപ്പ് വ്യത്യസ്ത സാധ്യതകൾ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- issue: ἑαυτὸν എന്ന പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: തന്നെ
  alternative: തന്റെതന്നെ ആത്മികവളർച്ചയ്ക്ക് കാരണമാകുന്നു
  rationale: ‘തന്നെ’ ഏകവചന പ്രത്യാവർത്തകത കൃത്യമായി നിലനിർത്തുന്നു; മലയാള വ്യാകരണത്തിൽ ഉറവിടത്തിൽ ഇല്ലാത്ത പ്രത്യേക ലിംഗഭേദം നിർബന്ധിക്കാതെയും പൊതുതത്ത്വം അറിയിക്കുന്നു.
- issue: οἰκοδομεῖ എന്ന നിർമ്മാണരൂപകത്തിന്റെ പ്രകടനം
  choice: ആത്മികമായി വളർത്തുന്നു
  alternative: പണിതുയർത്തുന്നു; ശക്തിപ്പെടുത്തുന്നു
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ആത്മിക പ്രയോജനവും ശക്തിപ്പെടലുമാണ്. ‘ആത്മികമായി’ എന്ന പദം സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; സ്വകാര്യവും സമൂഹപരവുമായ വളർച്ചയ്ക്കിടയിലെ പൗലോസിന്റെ വൈരുധ്യം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ആത്മികമായി വളർത്തുന്നു’ എന്നത് οἰκοδομεῖയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന പദങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
