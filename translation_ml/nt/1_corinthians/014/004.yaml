revisions:
- from: അന്യഭാഷയിൽ സംസാരിക്കുന്നവൻ തന്നെ ആത്മികമായി വളർത്തുന്നു[b][a]; എന്നാൽ പ്രവചിക്കുന്നവൻ സഭയെ[c] ആത്മികമായി വളർത്തുന്നു.
  to: ഭാഷയിൽ സംസാരിക്കുന്നവൻ സ്വയം ശക്തിപ്പെടുത്തുന്നു[a][b]; എന്നാൽ പ്രവചിക്കുന്നവൻ സഭയെ ശക്തിപ്പെടുത്തുന്നു[c].
  rationale: മുഖ്യപാഠത്തിൽ γλώσσῃയുടെ വിവാദമായ സ്വഭാവം നിർണയിക്കാതെ ‘ഭാഷയിൽ’ എന്നു വിവർത്തനം ചെയ്തു; അധ്യായസന്ദർഭത്തിലെ ഭാഷാവരവുമായി ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു. മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘ആത്മികമായി’ ഒഴിവാക്കി, οἰκοδομεῖയുടെ സന്ദർഭാർഥം രണ്ടു പാദങ്ങളിലും ഒരേപോലെ ‘ശക്തിപ്പെടുത്തുന്നു’ എന്നതിലൂടെ നൽകി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടു ചേർത്ത് ക്രമപ്പെടുത്തി.
