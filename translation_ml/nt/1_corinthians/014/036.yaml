id: 1CO.14.36
reference: 1 Corinthians 14:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ ἀφ’ ὑμῶν ὁ λόγος τοῦ θεοῦ ἐξῆλθεν, ἢ εἰς ὑμᾶς μόνους κατήντησεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: ml
  text: അതോ, ദൈവത്തിന്റെ വചനം പുറപ്പെട്ടത് നിങ്ങളിൽനിന്നാണോ?[a] അതോ, അത് എത്തിയത് നിങ്ങളിലേക്കു മാത്രമാണോ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിന്റെ വചനം നിങ്ങളിൽനിന്നാണോ ഉത്ഭവിച്ചത്?”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, “അത് നിങ്ങളിലേക്കു മാത്രമാണോ വന്നത്?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അതോ
  rationale: ആദ്യത്തെയും രണ്ടാമത്തെയും ἤ പൗലോസിന്റെ മൂർച്ചയുള്ള അലങ്കാരചോദ്യങ്ങളെ ബന്ധിപ്പിക്കുന്നു. ‘അതോ’ എന്നത് വ്യത്യസ്ത സാധ്യതകൾ മുന്നോട്ടുവയ്ക്കുന്ന ചോദ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀφ’ ὑμῶν
  choice: നിങ്ങളിൽനിന്ന്
  rationale: ἀπό + genitive ഉറവിടത്തെയോ ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു; ഈ നേരിട്ടുള്ള പരിഭാഷ കൊരിന്ത്യർ ദൈവവചനത്തിന്റെ ഉറവിടമാണോ എന്ന പരിഹാസാത്മക വെല്ലുവിളി നിലനിർത്തുന്നു.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: ഗ്രീക്കിലെ ഔപചാരിക പ്രയോഗം നിലനിർത്തുകയും അതിനെ സുവിശേഷം മാത്രമായോ സഭയിലെ പ്രവചനവചനം മാത്രമായോ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടത്
  rationale: ἐξέρχομαι എന്ന ക്രിയയിലെ ‘പുറത്തേക്കു വരുക/പുറപ്പെടുക’ എന്ന ദൃശ്യരൂപം സംരക്ഷിക്കുന്നു; സന്ദർഭത്തിൽ ‘ഉത്ഭവിക്കുക’ എന്ന ആശയവും ഉൾക്കൊള്ളാം.
- source_word: εἰς ὑμᾶς μόνους
  choice: നിങ്ങളിലേക്കു മാത്രം
  rationale: μόνους നൽകുന്ന പ്രത്യേകതയുടെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κατήντησεν
  choice: എത്തിയത്
  rationale: καταντάω എന്നതിന്റെ ‘എത്തുക, ചെന്നെത്തുക’ എന്ന അർഥം നേരിട്ട് നൽകുന്നു; വചനം കൊരിന്ത്യരിലേക്കു മാത്രമാണോ വന്നതെന്ന ചോദ്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ വചനം’ എന്നതിന്റെ സൂചിതാർഥം
  choice: ‘ദൈവത്തിന്റെ വചനം’ എന്നു വിശാലമായി നിലനിർത്തി
  alternative: ‘സുവിശേഷസന്ദേശം’ അല്ലെങ്കിൽ ‘സഭയിലെ പ്രവചനവചനം’
  rationale: സന്ദർഭത്തിൽ ഇത് സുവിശേഷത്തെയും അപ്പൊസ്തലിക ഉപദേശത്തെയും വിശാലമായി ഉൾക്കൊള്ളാം; പ്രത്യേകമായ ഒരു വ്യാഖ്യാനത്തിലേക്കു പരിഭാഷയെ ചുരുക്കാതിരിക്കുന്നു.
- issue: ചോദ്യങ്ങളുടെ പരിഹാസാത്മക ശാസന
  choice: രണ്ട് ‘അതോ ... ആണോ?’ ചോദ്യങ്ങളായി നിലനിർത്തി
  alternative: ‘എന്ത്!’ എന്ന വിസ്മയപ്രയോഗത്തോടെ ശാസന കൂടുതൽ തുറന്നുപറയുക
  rationale: ഗ്രീക്കിലെ ἤ അടിസ്ഥാനപരമായി വികല്പസൂചകമാണ്; ചോദ്യരൂപം തന്നെ ശാസനയുടെ മൂർച്ച വഹിക്കുന്നതിനാൽ അധിക വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വചനം’ എന്ന സഭാപരിചിതമായ പദം നിലനിർത്തിയിട്ടുണ്ടെങ്കിലും വാക്യഘടന ലളിതമാണ്. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ἤ രണ്ട് ‘അതോ’കളിലൂടെ വ്യക്തമായി പ്രതിഫലിപ്പിച്ചു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
