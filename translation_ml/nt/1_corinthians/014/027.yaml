  source_fidelity: The draft accurately conveys the conditional, the limit of two or at most three speakers, successive speaking, and the requirement that one person interpret. A small adjustment makes the imperative force of διερμηνευέτω more direct and aligns the phrasing more closely with the Greek coordination.
