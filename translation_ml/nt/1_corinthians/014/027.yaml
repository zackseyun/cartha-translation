source:
  edition: SBLGNT
  text: εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: ml
  text: ആരെങ്കിലും അന്യഭാഷയിൽ[a] സംസാരിക്കുന്നുവെങ്കിൽ, രണ്ടുപേരോ പരമാവധി മൂന്നുപേരോ മാത്രം സംസാരിക്കട്ടെ; ഓരോരുത്തരും മാറിമാറി സംസാരിക്കട്ടെ; ഒരാൾ വ്യാഖ്യാനിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരു ഭാഷയിൽ.’ ഗ്രീക്ക് പദത്തിന് അക്ഷരാർഥത്തിൽ ‘നാവ്’ എന്നും ‘ഭാഷ’ എന്നും അർഥമാകാം. ഇവിടെ ‘അന്യഭാഷ’ എന്നത് ഈ അധ്യായത്തിലെ പൗലോസിന്റെ സ്ഥിരമായ പ്രയോഗത്തെ നിലനിർത്തുന്നു; വരത്തിന്റെ സ്വഭാവത്തെക്കുറിച്ചുള്ള വിശാലമായ വിവാദത്തിൽ ഇത് തീർപ്പുകൽപ്പിക്കുന്നില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: അന്യഭാഷയിൽ
  rationale: λαλεῖ എന്ന ക്രിയയോടുകൂടിയ ഈ ദത്തിവ് ഭാഷയിൽ സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. 1 കൊരിന്ത്യർ 12–14-ലെ ആത്മീയവരങ്ങളുടെ പശ്ചാത്തലത്തിൽ മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സ്വാഭാവികമായ ‘അന്യഭാഷ’ ഉപയോഗിക്കുന്നു; എന്നാൽ പ്രതിഭാസത്തിന്റെ കൃത്യസ്വഭാവം നിർണയിക്കാതിരിക്കാൻ പാദക്കുറിപ്പിൽ ‘ഒരു ഭാഷയിൽ’ എന്ന പദസാധ്യത നൽകുന്നു.
- source_word: τις
  choice: ആരെങ്കിലും
  rationale: നിർദിഷ്ടമല്ലാത്ത, പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന സർവനാമത്തിന്റെ സോപാധിക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λαλεῖ
  choice: സംസാരിക്കുന്നുവെങ്കിൽ
  rationale: പൊതുവായ സോപാധിക പ്രസ്താവനയിലെ വർത്തമാനകാല ക്രിയയെ മലയാളത്തിൽ സ്വാഭാവികമായ വ്യവസ്ഥാരൂപത്തിൽ നൽകുന്നു.
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: രണ്ടുപേരോ ഏറിയാൽ മൂന്നുപേരോ മാത്രം സംസാരിക്കട്ടെ
  rationale: സംസാരിക്കുന്നവരുടെ എണ്ണം രണ്ടോ പരമാവധി മൂന്നോ ആയി നിയന്ത്രിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀνὰ μέρος
  choice: ഓരോരുത്തരും മാറിമാറി
  rationale: ഒരേസമയം അല്ല, പ്രത്യേകം ഓരോരുത്തരായി ക്രമത്തിൽ സംസാരിക്കണമെന്ന വിതരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: εἷς
  choice: ഒരാൾ
  rationale: സംഖ്യാനാമം ഇവിടെ വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമമായി പ്രവർത്തിക്കുന്നു.
- source_word: διερμηνευέτω
  choice: വ്യാഖ്യാനിക്കുകയും വേണം
  rationale: സഭയ്ക്ക് അന്യഭാഷാസംസാരം ഗ്രഹിക്കാവുന്ന വിധത്തിൽ അർഥം നൽകണമെന്ന ആജ്ഞയെ സൂചിപ്പിക്കുന്നു; ‘വിവർത്തനം ചെയ്യുക’ എന്നതിനെക്കാൾ അർഥപരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ആത്മീയവരങ്ങളുടെ പശ്ചാത്തലത്തിൽ γλώσσῃ എന്നതിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘അന്യഭാഷയിൽ’ എന്ന് നൽകി, 1 കൊരിന്ത്യർ 12–14-ൽ ചർച്ചചെയ്യുന്ന പ്രതിഭാസത്തെ സൂചിപ്പിക്കുന്നു; അത് മനുഷ്യഭാഷയാണോ സ്വർഗീയഭാഷയാണോ എന്ന് നിർവചിക്കുന്നില്ല.
  alternative: ‘ഒരു ഭാഷയിൽ’ എന്നു നൽകുക; അല്ലെങ്കിൽ പ്രത്യേകമായി പരവശസംസാരമെന്നോ വിദേശ മനുഷ്യഭാഷകളെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം പ്രതിഭാസത്തിന്റെ കൃത്യസ്വഭാവത്തെക്കുറിച്ചുള്ള വിശാലമായ ദൈവശാസ്ത്രവിവാദം തീർപ്പാക്കുന്നില്ല. ‘അന്യഭാഷ’ സന്ദർഭപരവും പരിചിതവുമായിരിക്കെ ആ അനിശ്ചിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാപാരായണശൈലി. ഗ്രീക്കിലെ ചുരുക്കമുള്ള നിയന്ത്രണനിർദേശം മലയാളത്തിൽ വ്യക്തതയ്ക്കായി ‘സംസാരിക്കട്ടെ/സംസാരിക്കണം/വേണം’ എന്നീ വിധിരൂപങ്ങളാൽ തുറന്നുകാട്ടിയിരിക്കുന്നു.
