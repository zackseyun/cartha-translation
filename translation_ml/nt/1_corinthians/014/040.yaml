  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντα ⸀δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: ml
  text: എന്നാൽ എല്ലാം ഉചിതമായും ക്രമപ്രകാരവും നടക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉചിതമായും’ എന്നതിന് ‘യോഗ്യമായ രീതിയിലും’ എന്നും വിവർത്തനം ചെയ്യാം; ഗ്രീക്ക് പദം യോജിച്ചതോ സന്ദർഭത്തിന് ചേർന്നതോ ആയ രീതിയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: എല്ലാം
  rationale: നപുംസകലിംഗ ബഹുവചനമായ ഈ പദത്തിന്റെ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻചർച്ചയിൽനിന്ന് സമാപനസ്വഭാവമുള്ള നിർദേശത്തിലേക്കുള്ള മൃദുവായ വ്യത്യാസമോ സംക്രമണമോ സൂചിപ്പിക്കുന്നു.
- source_word: εὐσχημόνως
  choice: ഉചിതമായും
  rationale: യോഗ്യവും സന്ദർഭത്തിന് ചേരുന്നതുമായ രീതിയെ സൂചിപ്പിക്കുന്നു; സഭായോഗത്തിലെ പെരുമാറ്റത്തെക്കുറിച്ച് അനാവശ്യമായ സാംസ്കാരികമോ സഭാവിഭാഗപരമോ ആയ അർഥം ചേർക്കുന്നില്ല.
- source_word: κατὰ τάξιν
  choice: ക്രമപ്രകാരവും
  rationale: ശരിയായ ക്രമീകരണത്തിനോ അനുക്രമത്തിനോ അനുസൃതമായി എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: γινέσθω
  choice: നടക്കട്ടെ
  rationale: വർത്തമാനകാല മൂന്നാംപുരുഷ ആജ്ഞയുടെ പൊതുനിർദേശസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; πάνταയോടൊപ്പം എല്ലാ കാര്യങ്ങളും ഇങ്ങനെ നടക്കണം എന്ന അർഥം നൽകുന്നു.
theological_decisions:
- issue: സഭായോഗത്തിന്റെ പശ്ചാത്തലത്തിൽ പൗലോസിന്റെ നിർദേശത്തിന്റെ വ്യാപ്തി
  choice: സഭായോഗത്തിൽ എല്ലാം ഉചിതമായും ക്രമത്തോടെയും നടക്കണമെന്ന പൊതുനിർദേശമായി നിലനിർത്തി.
  alternative: ഒരു നിശ്ചിത ആരാധനാക്രമം നിർദേശിക്കുന്ന കർശനമായ ആരാധനാവിധിയായോ, ഉടനെയുള്ള പശ്ചാത്തലത്തിനപ്പുറം എല്ലാ സഭാപ്രവർത്തനങ്ങൾക്കും നേരിട്ട് ബാധകമായ സർവവ്യാപക നിയമമായോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം സഭായോഗത്തിലെ സംസാരവും ക്രമവും സംബന്ധിച്ച തൊട്ടുമുൻപുള്ള ചർച്ചയെ സംഗ്രഹിക്കുന്നു. ഗ്രീക്കിന്റെ പൊതുസ്വഭാവം നിലനിർത്തുകയും പ്രത്യേക സഭാവിഭാഗത്തിന്റെ ആരാധനാരീതി പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവും സഭയിൽ വായിക്കാൻ സ്വാഭാവികവുമായ ശൈലി. ‘ക്രമപ്രകാരം’ എന്ന പ്രയോഗം ഔപചാരികത നിലനിർത്തുമ്പോഴും ഒരു പ്രത്യേക ആരാധനാക്രമം നിർബന്ധിക്കുന്നതായി തോന്നാതിരിക്കാൻ ശ്രദ്ധിച്ചു.
