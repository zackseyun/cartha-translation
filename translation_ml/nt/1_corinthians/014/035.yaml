id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: ml
  text: എന്നാൽ അവർ എന്തെങ്കിലും പഠിക്കാൻ ആഗ്രഹിക്കുന്നുവെങ്കിൽ, വീട്ടിൽവെച്ച് സ്വന്തം ഭർത്താക്കന്മാരോടു ചോദിക്കട്ടെ; കാരണം സഭായോഗത്തിൽ[b] ഒരു സ്ത്രീ[a] സംസാരിക്കുന്നത് ലജ്ജാകരമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരു ഭാര്യ.’ ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘സ്ത്രീ’ എന്നോ ‘ഭാര്യ’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘സഭയിൽ’ അഥവാ ‘കൂടിവന്നിരിക്കുന്ന സഭയിൽ.’ ഗ്രീക്ക് പദം ഇവിടെ ഒരുമിച്ചുകൂടിയ ജനസമൂഹത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: പഠിക്കാൻ
  rationale: μανθάνω എന്ന ക്രിയയുടെ അർഥമായ പഠിക്കുക, അറിഞ്ഞുകൊള്ളുക എന്നിവയിൽ ഇവിടെ ഏറ്റവും നേരിട്ടും സ്വാഭാവികവുമായ പദം ‘പഠിക്കുക’ ആണ്.
- source_word: ἐν οἴκῳ
  choice: വീട്ടിൽവെച്ച്
  rationale: അക്ഷരാർഥമായ ‘വീട്ടിൽ’ എന്നതിനെക്കാൾ, കൂടിവരുന്ന സഭായോഗത്തോടുള്ള ഗാർഹിക വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἰδίους ἄνδρας
  choice: സ്വന്തം ഭർത്താക്കന്മാരോട്
  rationale: ἀνήρ എന്നതിന് ‘പുരുഷൻ’ എന്നും ‘ഭർത്താവ്’ എന്നും അർഥമാകാം; ἰδίους എന്ന വിശേഷണവും വീട്ടിലെ സാഹചര്യവും ഇവിടെ വൈവാഹിക അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു.
- source_word: ἐπερωτάτωσαν
  choice: ചോദിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ ചോദിക്കുക/അന്വേഷിക്കുക എന്ന ശക്തി ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: αἰσχρὸν
  choice: ലജ്ജാകരമാണ്
  rationale: സാമൂഹികവും ധാർമികവുമായ അപമാനബോധം ഉൾക്കൊള്ളുന്ന αἰσχρός എന്ന പദത്തിന്റെ ശക്തി ‘ലജ്ജാകരം’ യോജിച്ചവിധം നൽകുന്നു.
- source_word: γυναικὶ
  choice: ഒരു സ്ത്രീ
  rationale: γυνή എന്നതിന് ‘സ്ത്രീ’ എന്നും ‘ഭാര്യ’ എന്നും അർഥമാകാം. ഇവിടെ രൂപം പൊതുവായ ഏകവചനമായി വായിക്കാവുന്നതിനാൽ മുഖ്യപാഠത്തിൽ ‘സ്ത്രീ’ നൽകി, ‘ഭാര്യ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: λαλεῖν
  choice: സംസാരിക്കുന്നത്
  rationale: λαλέω എന്നതിന്റെ വിശാലമായ ‘സംസാരിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; ഏതു പ്രത്യേകതരം സംസാരമാണെന്ന് പരിഭാഷയിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἐν ἐκκλησίᾳ
  choice: സഭായോഗത്തിൽ
  rationale: ἐκκλησία ഇവിടെ കൂടിവന്നിരിക്കുന്ന ജനസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭായോഗം’ എന്നത് കെട്ടിടമോ സ്ഥാപനമോ എന്ന അനാകാലിക ധാരണ ഒഴിവാക്കി കൂടിവരവിന്റെ പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: സ്ത്രീകൾ സംസാരിക്കുന്നതിനെക്കുറിച്ചുള്ള വിലക്കിന്റെ പരിധി
  choice: പ്രത്യേകതരം സംസാരമായി ചുരുക്കാതെ ഗ്രീക്ക് വാചകം പറയുന്നതുപോലെ വിശാലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: തടസ്സമുണ്ടാക്കുന്ന ചോദ്യങ്ങൾ, പ്രവചനങ്ങളുടെ വിലയിരുത്തൽ, അല്ലെങ്കിൽ കൊരിന്ത്യരുടെ നിലപാടിന്റെ ഉദ്ധരണി എന്നിങ്ങനെ അർഥം പരിമിതപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് വാചകം സംസാരത്തിന്റെ കൃത്യമായ ഇനം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ ഒരു പരിധി മുഖ്യപാഠത്തിൽ ചേർക്കാതെ വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
- issue: γυνή/ἀνήρ എന്നിവ സ്ത്രീ/പുരുഷൻ എന്നോ ഭാര്യ/ഭർത്താവ് എന്നോ പരിഭാഷപ്പെടുത്തണമോ
  choice: ἄνδρας എന്നതിന് ‘ഭർത്താക്കന്മാർ’ എന്നും γυναικὶ എന്നതിന് മുഖ്യപാഠത്തിൽ ‘സ്ത്രീ’ എന്നും നൽകി; ‘ഭാര്യ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
  alternative: രണ്ടിടത്തും ഭാര്യ/ഭർത്താവ് എന്നോ സ്ത്രീ/പുരുഷൻ എന്നോ ഒരേ രീതിയിൽ നൽകുക.
  rationale: ‘സ്വന്തം’ എന്ന പദവും ഗാർഹിക പശ്ചാത്തലവും ἄνδρας എന്നതിന് ‘ഭർത്താക്കന്മാർ’ എന്ന അർഥം ശക്തമാക്കുന്നു. എന്നാൽ γυναικὶ പൊതുവായ ‘സ്ത്രീ’ എന്നോ സന്ദർഭപരമായ ‘ഭാര്യ’ എന്നോ മനസ്സിലാക്കാം; ഈ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘സഭായോഗം’ കൂടിവന്നിരിക്കുന്ന സമൂഹത്തെ സൂചിപ്പിക്കുകയും സഭാകെട്ടിടം എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുകയും ചെയ്യുന്നു. ഗ്രീക്കിലെ ബഹുവചന ആജ്ഞയും ഏകവചന പൊതുപ്രസ്താവനയും മലയാളത്തിൽ നിലനിർത്തിയിരിക്കുന്നു.
