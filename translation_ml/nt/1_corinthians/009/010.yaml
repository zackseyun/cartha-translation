    rationale: The Greek adverb πάντως appears once, in the question “ἢ δι’ ἡμᾶς πάντως λέγει;” The following “δι’ ἡμᾶς γὰρ ἐγράφη” gives a γάρ-ground and does not contain an explicit “yes/certainly.” “തീർച്ചയായും” should therefore be removed from the main text.
  - severity: low
    issue: The footnote’s literal rendering does not exactly correspond to the main-text rendering of μετέχειν.
    rationale: The text says “പങ്കു ലഭിക്കുമെന്ന,” while the note says “പങ്കുചേരുമെന്ന.” Rendering both with “പങ്കുചേരുക” better reflects μετέχειν (‘share/participate’) and keeps the terminology aligned.
