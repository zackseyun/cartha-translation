id: 1CO.9.10
reference: 1 Corinthians 9:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവിടുന്ന് ഇത് പറയുന്നത് പൂർണമായും നമുക്കുവേണ്ടിയാണോ[a]? നമുക്കുവേണ്ടിയാണ് ഇത് എഴുതപ്പെട്ടത്. കാരണം, ഉഴുന്നവൻ പ്രത്യാശയോടെ ഉഴണം; മെതിക്കുന്നവൻ പങ്കുചേരുമെന്ന പ്രത്യാശയോടെ മെതിക്കണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “പൂർണമായും” എന്നതിന് “തീർച്ചയായും” അല്ലെങ്കിൽ “നിശ്ചയമായും” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ ക്രിയാവിശേഷണം ഈ വാചാടോപപരമായ ചോദ്യത്തിന് ശക്തി നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “പങ്കുചേരുമെന്ന പ്രത്യാശയോടെ.” എന്തിൽ പങ്കുചേരുന്നു—വിളവിലോ ധാന്യത്തിലോ—എന്നത് ഗ്രീക്കിൽ വ്യക്തമാക്കിയിട്ടില്ല; കൃഷിസന്ദർഭത്തിൽനിന്നാണ് അത് മനസ്സിലാകുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντως
  choice: പൂർണമായും / തീർച്ചയായും
  rationale: ഈ ക്രിയാവിശേഷണം വാചാടോപപരമായ ചോദ്യത്തെ ശക്തിപ്പെടുത്തുന്നു. ചോദ്യത്തിൽ ‘പൂർണമായും’ എന്നും തുടർന്നുള്ള ഉറപ്പിൽ സ്വാഭാവികമായ മലയാളത്തിനായി ‘തീർച്ചയായും’ എന്നും നൽകി; അടിക്കുറിപ്പിൽ ഗ്രീക്കിലെ ഒരേയൊരു പദത്തിന്റെ വ്യത്യസ്ത സാധ്യതകൾ സൂചിപ്പിക്കുന്നു.
- source_word: δι’ ἡμᾶς
  choice: നമുക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ പ്രയോജനമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു; ‘നമുക്കുവേണ്ടി’ ആ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐγράφη
  choice: എഴുതപ്പെട്ടത്
  rationale: Aorist passive രൂപത്തിന്റെ കർമണി സ്വഭാവം നിലനിർത്തുകയും തിരുവെഴുത്തിനെക്കുറിച്ചുള്ള പ്രസ്താവനയായി മലയാളത്തിൽ സ്വാഭാവികമാവുകയും ചെയ്യുന്നു.
- source_word: ὀφείλει
  choice: ഉഴണം / മെതിക്കണം
  rationale: ബാധ്യതയോ ഉചിതത്വമോ സൂചിപ്പിക്കുന്ന പദം; മലയാളത്തിലെ ‘-ണം’ രൂപം അതിനെ അമിതമായ നിർബന്ധമായി മാറ്റാതെ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐπ’ ἐλπίδι
  choice: പ്രത്യാശയോടെ
  rationale: പ്രവൃത്തിയുടെ പ്രേരകമായ പ്രതീക്ഷയെയോ മനോഭാവത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികവും ആവർത്തനഘടനയ്ക്ക് യോജിച്ചതുമാണ്.
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: ഉഴുന്നവൻ ... ഉഴണം
  rationale: Articular participle-ന്റെ പൊതുവായ കർത്തൃസൂചനയും അതേ ക്രിയയുടെ ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: ὁ ἀλοῶν
  choice: മെതിക്കുന്നവൻ
  rationale: ധാന്യം മെതിക്കുന്ന കൃഷിപ്പണിക്കാരനെ സൂചിപ്പിക്കുന്നു; മുൻപത്തെ ‘ഉഴുന്നവൻ’ എന്ന ഘടനയോട് സമാന്തരത നിലനിർത്തുന്നു.
- source_word: τοῦ μετέχειν
  choice: പങ്കു ലഭിക്കുക
  rationale: ‘പങ്കെടുക്കുക/പങ്കാളിയാകുക’ എന്ന ആശയം വിളവിൽനിന്ന് ഒരു പങ്കു ലഭിക്കുന്ന കൃഷിസന്ദർഭത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വസ്തു മുഖ്യവാചകത്തിൽ പ്രത്യേകമായി ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: μετέχειν എന്നതിന്റെ പരാമർശിക്കാത്ത കർമം
  choice: മുഖ്യവാചകത്തിൽ കർമം ചേർക്കാതെ ‘പങ്കു ലഭിക്കുമെന്ന’ എന്നു നൽകി
  alternative: ‘വിളവിൽ പങ്കു ലഭിക്കുമെന്ന’
  rationale: ഗ്രീക്ക് വാചകത്തിൽ പങ്കിന്റെ കർമം വ്യക്തമാക്കിയിട്ടില്ല. കൃഷിസന്ദർഭം വിളവിനെയോ ധാന്യത്തെയോ സൂചിപ്പിച്ചാലും, യഥാർത്ഥത്തിലെ തുറന്ന നില സംരക്ഷിക്കാൻ അത് അടിക്കുറിപ്പിൽ മാത്രം വിശദീകരിച്ചു.
- issue: πάντως എന്ന പദത്തിന്റെ ശക്തി
  choice: ചോദ്യത്തിൽ ‘പൂർണമായും,’ മറുപടിസ്വഭാവമുള്ള തുടർച്ചയിൽ ‘തീർച്ചയായും’
  alternative: മുഴുവൻ ഭാഗത്തും ‘തീർച്ചയായും’ അല്ലെങ്കിൽ ‘എല്ലാറ്റിനുമുപരി’
  rationale: പദം ചോദ്യം ശക്തിപ്പെടുത്തുന്നു; ‘പൂർണമായും’ അതിന്റെ വ്യാപ്തിയും ‘തീർച്ചയായും’ പൗലോസിന്റെ ഉറപ്പും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. ഈ വ്യത്യാസം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവിടുന്ന്’ എന്നത് മുൻസന്ദർഭത്തിലെ ദൈവത്തെ ആദരസൂചകമായി പരാമർശിക്കുന്നു. കൃഷിപ്രതീകത്തിലെ ഉഴലും ധാന്യം മെതിക്കലും വ്യക്തമായി നിലനിർത്തി; പരാമർശിക്കാത്ത ‘വിളവ്’ മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
