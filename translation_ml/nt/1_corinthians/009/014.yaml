id: 1CO.9.14
reference: 1 Corinthians 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: ml
  text: അതുപോലെതന്നെ, സുവിശേഷം ഘോഷിക്കുന്നവർ സുവിശേഷത്തിൽനിന്ന് ഉപജീവിക്കണമെന്ന് കർത്താവും കല്പിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സുവിശേഷത്തിൽനിന്ന് ജീവിക്കണമെന്ന്.”
    reason: മൂലത്തിലെ ζῆν എന്ന ‘ജീവിക്കുക’ എന്ന ക്രിയാരൂപവും ἐκ τοῦ εὐαγγελίου എന്ന വാചകഘടനയും കൂടുതൽ അക്ഷരാർഥത്തിൽ പ്രതിഫലിപ്പിക്കുന്ന പരിഭാഷ.
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യങ്ങളിലെ ഉദാഹരണങ്ങളോടുള്ള താരതമ്യബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: καὶ
  choice: കർത്താവും
  rationale: കർത്താവിനെക്കുറിച്ചുള്ള കൂട്ടിച്ചേർക്കൽ ഊന്നൽ മലയാളത്തിലെ ‘-ഉം’ പ്രത്യയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ κύριος
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ സാധാരണവും ഗൗരവമുള്ളതുമായ തർജമ; സാധ്യതയുള്ള യേശു എന്ന സൂചനയെ വിവർത്തനത്തിൽ വികസിപ്പിക്കുന്നില്ല.
- source_word: διέταξεν
  choice: കല്പിച്ചു
  rationale: അധികാരപൂർവമായ നിർദേശം എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: τοῖς ... καταγγέλλουσιν
  choice: സുവിശേഷം ഘോഷിക്കുന്നവർ
  rationale: നാമവത്കൃത കൃദന്തരൂപത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും പൊതുവായി പ്രഖ്യാപിക്കുക എന്ന καταγγέλλωയുടെ അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ εὐαγγέλιον
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ ലേഖനങ്ങളിൽ സ്ഥാപിതവും ഇന്നും മനസ്സിലാകുന്നതുമായ മലയാള പദം.
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: സുവിശേഷത്തിൽനിന്ന്
  rationale: ഉപജീവനത്തിന്റെ ഉറവിടമോ മാർഗമോ സൂചിപ്പിക്കുന്ന ἐκ എന്നതിന്റെ രൂപം പരമാവധി നിലനിർത്തുന്നു; ശുശ്രൂഷയിലൂടെ ലഭിക്കുന്ന ഭൗതികപിന്തുണയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: ζῆν
  choice: ഉപജീവിക്കണമെന്ന്
  rationale: ഇവിടെ ‘ജീവിക്കുക’ എന്നത് ഉപജീവനസഹായം ലഭിക്കുക എന്ന സന്ദർഭാർഥത്തിലാണ്; മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് കല്പനയുടെ ആശ്രിത infinitive-ന്റെ ബലം നൽകുന്നു.
theological_decisions:
- issue: ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മൂലപാഠത്തിലെന്നപോലെ ‘കർത്താവ്’ എന്നു മാത്രം നിലനിർത്തി
  alternative: ‘കർത്താവായ യേശു’ എന്നു വ്യക്തമാക്കുക
  rationale: സന്ദർഭത്തിൽ ഇത് യേശുവിനെയും അവിടുത്തെ ഉപദേശത്തെയും സൂചിപ്പിക്കാൻ ഏറെ സാധ്യതയുണ്ടെങ്കിലും, ഗ്രീക്ക് പാഠത്തിൽ ‘യേശു’ എന്നത് ചേർത്തിട്ടില്ല; അതിനാൽ വിവർത്തനം അതു വികസിപ്പിക്കുന്നില്ല.
- issue: ‘സുവിശേഷത്തിൽനിന്ന് ഉപജീവിക്കുക’ എന്നതിന്റെ സ്വഭാവം
  choice: സുവിശേഷഘോഷണത്തിൽ ഏർപ്പെട്ടവർക്ക് ലഭിക്കുന്ന ഭൗതിക ഉപജീവനപിന്തുണ
  alternative: സുവിശേഷത്തിൽനിന്നു ലഭിക്കുന്ന ആത്മീയജീവൻ
  rationale: അടുത്തുള്ള വാദപ്രസംഗം ശുശ്രൂഷകരുടെ ഭൗതികപിന്തുണയ്ക്കുള്ള അവകാശത്തെക്കുറിച്ചാണ്. ‘ഉപജീവിക്കുക’ ആ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; പിന്തുണയുടെ കൃത്യമായ രൂപം നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഘോഷിക്കുക,’ ‘കല്പിക്കുക,’ ‘ഉപജീവിക്കുക’ എന്നീ പദങ്ങൾ സഭാപരമായ പരിചിതത്വവും സാധാരണ വായനാസൗകര്യവും തമ്മിൽ തുലനം ചെയ്യുന്നു. അടിക്കുറിപ്പുസൂചകം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
