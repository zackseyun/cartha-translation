id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ഇവയിൽ ഒന്നും ഉപയോഗിച്ചിട്ടില്ല.[a] എനിക്കുവേണ്ടി ഇങ്ങനെ ചെയ്യപ്പെടേണ്ടതിന് ഞാൻ ഇവ എഴുതിയതുമല്ല. കാരണം, എനിക്കു മരിക്കുന്നതാണ് ഭേദം എന്നതിനേക്കാൾ—എന്റെ അഭിമാനം ആരും നിഷ്ഫലമാക്കുകയില്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, സന്ദർഭം കൂടുതൽ വ്യക്തമാക്കിക്കൊണ്ട്: “ഈ അവകാശങ്ങളിൽ ഒന്നും.”'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക് വാക്യം “എന്നതിനേക്കാൾ—” എന്നിടത്ത് മുറിഞ്ഞ ശേഷം, “എന്റെ അഭിമാനം ആരും നിഷ്ഫലമാക്കുകയില്ല” എന്നു പുനരാരംഭിക്കുന്നു. അർഥം മിനുക്കി: “ആരെങ്കിലും എന്റെ അഭിമാനം നിഷ്ഫലമാക്കുന്നതിനെക്കാൾ മരിക്കുന്നതാണ് എനിക്കു ഭേദം” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: പ്രയോജനപ്പെടുത്തിയിട്ടില്ല
  rationale: മുമ്പ് പറഞ്ഞ അവകാശങ്ങളോ സൗകര്യങ്ങളോ തനിക്കായി ഉപയോഗിച്ചിട്ടില്ലെന്ന പൂർത്തിയായ പ്രവൃത്തിയുടെ ഇപ്പോഴുള്ള നില സ്വാഭാവികമായി അറിയിക്കുന്നു; ദുരുപയോഗം എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: οὐδενὶ τούτων
  choice: ഇവയിൽ ഒന്നും
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ സൂചന നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് മുമ്പ് ചർച്ചചെയ്ത അവകാശങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἔγραψα ... ταῦτα
  choice: ഞാൻ ഇതെഴുതിയത്
  rationale: മുൻവിവരണത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: എനിക്കുവേണ്ടി ഇങ്ങനെ ചെയ്യപ്പെടണം എന്ന ഉദ്ദേശ്യത്തോടെ
  rationale: തനിക്കായി അത്തരം പരിഗണന ലഭിക്കണമെന്ന ലക്ഷ്യത്തോടെയല്ല പൗലോസ് എഴുതുന്നതെന്ന ഉദ്ദേശ്യാർഥവും ഗ്രീക്കിലെ പരോക്ഷമായ കർമണിഭാവവും നിലനിർത്തുന്നു.
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: മരിക്കുന്നതാണ് എനിക്കു ഭേദം
  rationale: താരതമ്യവും ശക്തമായ വ്യക്തിപരമായ മുൻഗണനയും dignified Malayalam-ൽ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ καύχημά μου
  choice: എന്റെ അഭിമാനം
  rationale: καύχημα ഇവിടെ പ്രതിഫലം വാങ്ങാതെ സുവിശേഷം പ്രസംഗിക്കുന്നതിലുള്ള അഭിമാനത്തെയോ അഭിമാനിക്കാനുള്ള അടിസ്ഥാനത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ പദം തിരഞ്ഞെടുത്തു.
- source_word: κενώσει
  choice: നിഷ്ഫലമാക്കുകയില്ല
  rationale: അക്ഷരാർഥമായ ‘ഒഴിഞ്ഞതാക്കുക’ എന്ന രൂപകത്തിന്റെ സന്ദർഭാർഥമായ അസാധുവാക്കുക, ഉള്ളടക്കമില്ലാതാക്കുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἤ എന്ന പദത്തിനു ശേഷമുള്ള പൊട്ടിയ വാക്യഘടന
  choice: ‘ഭേദം—’ എന്നിടത്ത് ദീർഘരേഖ ഉപയോഗിച്ച് ഇടർച്ച നിലനിർത്തി; തുടർന്ന് സ്വതന്ത്രമായ ഉറച്ച പ്രസ്താവന നൽകി.
  alternative: ‘ആരെങ്കിലും എന്റെ അഭിമാനം നിഷ്ഫലമാക്കുന്നതിനെക്കാൾ മരിക്കുന്നതാണ് എനിക്കു ഭേദം’ എന്നു വാക്യം പൂർത്തിയാക്കി മിനുക്കാം.
  rationale: മൂലഗ്രീക്ക് ‘എന്നതിനേക്കാൾ—’ എന്നിടത്ത് പെട്ടെന്ന് മുറിഞ്ഞ് ‘എന്റെ അഭിമാനം ആരും നിഷ്ഫലമാക്കുകയില്ല’ എന്നു പുനരാരംഭിക്കുന്നു. ഈ വികാരതീവ്രമായ അനാകൊലൂഥോൻ വ്യാഖ്യാനിച്ച് നീക്കാതെ നിലനിർത്തുന്നു.
- issue: καύχημα എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ധ്വനി
  choice: അഭിമാനം
  alternative: അഭിമാനിക്കാനുള്ള അടിസ്ഥാനം
  rationale: ഇത് സ്വയംമഹത്വവത്കരണം എന്ന നിർബന്ധിത അർഥത്തിലേക്ക് ചുരുക്കാതെ, പ്രതിഫലം വാങ്ങാതെയുള്ള ശുശ്രൂഷയെക്കുറിച്ചുള്ള പൗലോസിന്റെ അഭിമാനവും അതിന്റെ അടിസ്ഥാനവും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിധം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ഊന്നലും വാക്യഭംഗവും ദീർഘരേഖയിലൂടെ നിലനിർത്തി; സന്ദർഭവ്യാഖ്യാനം പ്രധാനവാചകത്തിലേക്ക് അമിതമായി ചേർക്കാതെ അടിക്കുറിപ്പിൽ നൽകി.
