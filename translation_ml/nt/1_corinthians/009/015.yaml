revisions:
- from: എന്നാൽ ഞാൻ ഇവയിൽ ഒന്നും പ്രയോജനപ്പെടുത്തിയിട്ടില്ല.[a] എനിക്കുവേണ്ടി ഇങ്ങനെ ചെയ്യപ്പെടണം എന്ന ഉദ്ദേശ്യത്തോടെയുമല്ല ഞാൻ ഇതെഴുതിയത്. കാരണം, മരിക്കുന്നതാണ് എനിക്കു ഭേദം—എന്റെ അഭിമാനം ആരും നിഷ്ഫലമാക്കുകയില്ല.[b]
  to: എന്നാൽ ഞാൻ ഇവയിൽ ഒന്നും ഉപയോഗിച്ചിട്ടില്ല.[a] എനിക്കുവേണ്ടി ഇങ്ങനെ ചെയ്യപ്പെടേണ്ടതിന് ഞാൻ ഇവ എഴുതിയതുമല്ല. കാരണം, എനിക്കു മരിക്കുന്നതാണ് ഭേദം എന്നതിനേക്കാൾ—എന്റെ അഭിമാനം ആരും നിഷ്ഫലമാക്കുകയില്ല.[b]
  rationale: The revision replaces an awkward verb with idiomatic modern Malayalam and, more importantly, restores the explicit unfinished ‘than—’ element required by the Greek ἤ. The intentionally disrupted wording is explained by the existing footnote rather than silently regularized.
