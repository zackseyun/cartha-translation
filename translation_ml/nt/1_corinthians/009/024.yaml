id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: ml
  text: ഓട്ടക്കളത്തിൽ[a] ഓടുന്നവരെല്ലാം ഓടുന്നു; എന്നാൽ സമ്മാനം ലഭിക്കുന്നത് ഒരാൾക്കു മാത്രമാണെന്ന് നിങ്ങൾക്കറിയില്ലേ? അതു നേടേണ്ടതിന്[b] അങ്ങനെ ഓടുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്റ്റേഡിയത്തിൽ’ അല്ലെങ്കിൽ ‘ഓട്ടപ്പാതയിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ στάδιον ഓട്ടം നടക്കുന്ന സ്റ്റേഡിയത്തെയോ ഓട്ടപ്പാതയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അതു ജയിക്കേണ്ടതിന്’ അല്ലെങ്കിൽ ‘അതു പിടിച്ചെടുക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ καταλάβητε എന്നതിന് ‘നേടുക,’ ‘പിടിച്ചെടുക്കുക,’ ‘കൈവരിക്കുക’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: നിങ്ങൾക്കറിയില്ലേ?
  rationale: പൗലോസിന്റെ പതിവായ ആലങ്കാരിക ചോദ്യരൂപവും οἶδα എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ എന്ന ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν σταδίῳ
  choice: ഓട്ടക്കളത്തിൽ
  rationale: στάδιον ഓട്ടം നടക്കുന്ന സ്ഥലത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഓട്ടക്കളത്തിൽ’ എന്നത് കായികരൂപകം വ്യക്തമായി നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി കേൾക്കുകയും ചെയ്യുന്നു; ‘സ്റ്റേഡിയത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: τρέχοντες ... τρέχουσιν
  choice: ഓടുന്നവരെല്ലാം ഓടുന്നു
  rationale: മൂലപാഠത്തിലെ τρέχω എന്ന ക്രിയയുടെ ആവർത്തനവും സജീവമായ ഓട്ടരൂപകവും നിലനിർത്തുന്നു.
- source_word: πάντες μὲν ... εἷς δὲ
  choice: എല്ലാം ... എന്നാൽ ... ഒരാൾക്കു മാത്രം
  rationale: μέν...δέ ഘടനയിലെ സമസ്തരെയും ഒരാളെയും തമ്മിലുള്ള വൈരുധ്യം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: λαμβάνει
  choice: ലഭിക്കുന്നത്
  rationale: ‘സ്വീകരിക്കുക/ലഭിക്കുക’ എന്ന നേരിട്ടുള്ള അർഥം നൽകുന്നു; മൂലത്തിൽ വ്യക്തമായി ഇല്ലാത്ത ‘ജയിക്കുന്നു’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: τὸ βραβεῖον
  choice: സമ്മാനം
  rationale: കായികമത്സരത്തിലെ വിജയിക്കു ലഭിക്കുന്ന പുരസ്കാരത്തെ ലളിതവും സാധാരണവുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὕτως
  choice: അങ്ങനെ
  rationale: മുൻപറഞ്ഞ ഓട്ടത്തോടു തുടർന്നുള്ള ആഹ്വാനത്തെ ബന്ധിപ്പിക്കുന്നു; താരതമ്യത്തിന്റെ സ്വഭാവം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: τρέχετε
  choice: ഓടുക
  rationale: വർത്തമാനകാല ആജ്ഞയുടെ ഊർജവും നേരിട്ടുള്ള ആഹ്വാനവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἵνα καταλάβητε
  choice: അതു നേടേണ്ടതിന്
  rationale: καταλαμβάνω എന്നതിന്റെ ‘നേടുക/കൈവരിക്കുക’ എന്ന അർഥം സമ്മാനരൂപകത്തിന് ചേരുന്നു. ‘അതു’ എന്നത് തൊട്ടുമുമ്പുള്ള സമ്മാനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ‘ജയിക്കുക’ അല്ലെങ്കിൽ ‘പിടിച്ചെടുക്കുക’ എന്ന സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ക്രൈസ്തവ പരിശ്രമത്തിനും സ്ഥിരതയ്ക്കും പ്രയോഗിക്കുന്ന കായികരൂപകം
  choice: ഓട്ടത്തിന്റെയും സമ്മാനത്തിന്റെയും മത്സരാത്മക രൂപകം നിലനിർത്തി; രക്ഷയെയോ പ്രതിഫലത്തെയോ കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തില്ല.
  alternative: ‘ജയിക്കാനായി ഓടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പരിഭാഷ.
  rationale: പൗലോസ് ശിസ്തബദ്ധവും ലക്ഷ്യബോധമുള്ളതുമായ പരിശ്രമത്തിന് ആഹ്വാനം ചെയ്യുന്നു. എന്നാൽ ഈ വാക്യം മാത്രം അടിസ്ഥാനമാക്കി യോഗ്യത, പ്രതിഫലം, രക്ഷ, സ്ഥിരത എന്നിവയെക്കുറിച്ചുള്ള വിശാലമായ ദൈവശാസ്ത്രവിവാദങ്ങൾ പരിഭാഷ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘ഓട്ടക്കളം,’ ‘സമ്മാനം,’ ‘ഓടുക’ തുടങ്ങിയ സാധാരണ പദങ്ങൾ കായികരൂപകത്തെ വ്യക്തമായി അവതരിപ്പിക്കുന്നു. വാക്യത്തിലെ ആവർത്തനവും ആലങ്കാരിക ചോദ്യവും ഉദ്ദേശപൂർവം നിലനിർത്തിയിട്ടുണ്ട്.
