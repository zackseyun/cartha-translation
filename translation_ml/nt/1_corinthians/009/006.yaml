  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആലങ്കാരിക ചോദ്യരൂപം ഉപയോഗിച്ചു. ‘ജോലി ചെയ്യാതിരിക്കുക’ എന്നത് സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; സന്ദർഭത്തിലുള്ള കൈത്തൊഴിലിന്റെയും ശുശ്രൂഷാപിന്തുണയുടെയും സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
