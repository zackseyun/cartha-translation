    rationale: In the draft, ‘മാത്രം’ occurs within the dative phrase before ‘ഇല്ലെന്നാണോ,’ which is comprehensible but less direct. Moving it into ‘മാത്രമാണോ ... അവകാശമില്ലാത്തത്?’ clearly expresses that Paul and Barnabas alone are the ones lacking this right.
  - severity: low
    issue: Footnote wording about support
    rationale: ‘ശുശ്രൂഷയ്ക്കായി പിന്തുണ’ could suggest support for the ministry itself. ‘ശുശ്രൂഷയിൽ ഏർപ്പെടുന്നതിനായി പിന്തുണ സ്വീകരിക്കുക’ more clearly describes support received by the workers, while remaining contextual explanation rather than an expansion of the verse.
