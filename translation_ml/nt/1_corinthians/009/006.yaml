    text: ‘ജോലി ചെയ്യാതിരിക്കാനുള്ള അധികാരം’ എന്നും ‘അധ്വാനിക്കാതിരിക്കാനുള്ള സ്വാതന്ത്ര്യം’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ സ്വന്തം ഉപജീവനത്തിനായി കൈത്തൊഴിൽ ചെയ്യാതെ ശുശ്രൂഷയിൽ ഏർപ്പെടുന്നതിനായി പിന്തുണ സ്വീകരിക്കാനുള്ള അവകാശമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: പൗലോസിന്റെ വാദത്തിലെ അടുത്ത ആലങ്കാരിക ചോദ്യം അവതരിപ്പിക്കുന്ന വികല്പസൂചകമായ ബന്ധകം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μόνος
  choice: മാത്രം
  rationale: ‘എനിക്കും ബർന്നബാസിനും’ എന്ന സംയുക്ത കർത്താവിനെ പരിമിതപ്പെടുത്തി, ഈ അവകാശമില്ലാത്തവർ ഇവർ മാത്രമാണോ എന്ന ഊന്നൽ നൽകുന്നു.
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: എനിക്കും ബർന്നബാസിനും
  rationale: ഗ്രീക്കിലെ സംയുക്ത കർത്താവിന്റെ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ ദാതൃവാചക ഘടനയിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: οὐκ ἔχομεν
  choice: ഇല്ലെന്നാണോ
  rationale: നിഷേധത്തോടുകൂടിയ വർത്തമാനകാല ക്രിയയെ ആലങ്കാരിക ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: ἐξουσίαν
  choice: അവകാശം
  rationale: ഇവിടെ ഭരണാധികാരത്തെക്കാൾ അപ്പൊസ്തലന്മാർക്ക് ന്യായമായി ലഭിക്കേണ്ട പിന്തുണയുമായി ബന്ധപ്പെട്ട അർഹതയാണ് ഉദ്ദേശിക്കുന്നത്; ‘അവകാശം’ അത് വ്യക്തമായി പകരുന്നു.
- source_word: μὴ ἐργάζεσθαι
  choice: ജോലി ചെയ്യാതിരിക്കാനുള്ള
  rationale: സ്വന്തം ഉപജീവനത്തിനായി തൊഴിലെടുക്കുന്നതിൽനിന്ന് വിട്ടുനിൽക്കാനുള്ള അവകാശമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്; വ്യാഖ്യാനപരമായ വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർക്കാതെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ലാളിത്യം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിൽ ἐξουσία സൂചിപ്പിക്കുന്ന അവകാശത്തിന്റെ സ്വഭാവം
  choice: സ്വന്തം ഉപജീവനത്തിനായി ജോലി ചെയ്യാതെ സഭകളിൽനിന്ന് ശുശ്രൂഷാപിന്തുണ സ്വീകരിക്കാനുള്ള അപ്പൊസ്തലിക അവകാശം
  alternative: സാമ്പത്തിക പിന്തുണയെ പ്രത്യേകമായി സൂചിപ്പിക്കാത്ത പൊതുവായ അധികാരം അഥവാ സ്വാതന്ത്ര്യം
  rationale: 1 കൊരിന്ത്യർ 9-ന്റെ സമീപസന്ദർഭം അപ്പൊസ്തലന്മാരുടെ ഭക്ഷണത്തിനും മറ്റ് ഭൗതിക ആവശ്യങ്ങൾക്കും പിന്തുണ ലഭിക്കാനുള്ള അവകാശത്തെയും പൗലോസ് ആ അവകാശം സ്വമേധയാ ഉപയോഗിക്കാതിരുന്നതിനെയും കുറിച്ചാണ്. എങ്കിലും മുഖ്യപാഠം ഇതിനെ വിശദീകരിച്ച് വികസിപ്പിക്കാതെ മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
