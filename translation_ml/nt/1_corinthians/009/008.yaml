id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: ml
  text: ഞാൻ ഈ കാര്യങ്ങൾ മനുഷ്യരുടെ കാഴ്ചപ്പാടിൽനിന്നു മാത്രമാണോ പറയുന്നത്?[a] അതോ, ന്യായപ്രമാണവും ഈ കാര്യങ്ങൾ പറയുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മനുഷ്യനനുസരിച്ച്” / “മാനുഷിക വീക്ഷണത്തിൽനിന്ന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: ആണോ
  rationale: ആദ്യ ചോദ്യത്തിൽ നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായ അലങ്കാരചോദ്യമായി അവതരിപ്പിക്കുന്നു; ‘വെറും’ എന്ന പദം നിഷേധിക്കപ്പെടുന്ന മാനുഷിക അടിസ്ഥാനം വ്യക്തമാക്കുന്നു.
- source_word: κατὰ ἄνθρωπον
  choice: വെറും മാനുഷിക കാഴ്ചപ്പാടിൽനിന്ന്
  rationale: ‘മനുഷ്യനനുസരിച്ച്’ എന്ന പദാനുപദ രൂപത്തേക്കാൾ, തിരുവെഴുത്തിന്റെ സാക്ഷ്യത്തോടുള്ള വൈരുധ്യത്തിൽ മനുഷ്യന്റെ മാത്രം വീക്ഷണം അല്ലെങ്കിൽ അടിസ്ഥാനം എന്ന പ്രയോഗാർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ταῦτα
  choice: ഈ കാര്യങ്ങൾ
  rationale: മുൻവാദത്തിലേക്കു വിരൽചൂണ്ടുന്ന ബഹുവചന demonstrative-ന്റെ സംഖ്യയും വാചകബന്ധവും നിലനിർത്തുന്നു.
- source_word: λαλῶ
  choice: പറയുന്നത്
  rationale: പൗലോസ് ഇപ്പോൾ ഉന്നയിക്കുന്ന വാദത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല പ്രയോഗം മലയാളത്തിലെ ചോദ്യഘടനയിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἢ
  choice: '[രണ്ടാമത്തെ സ്വതന്ത്ര ചോദ്യം]'
  rationale: ഗ്രീക്കിലെ ‘അല്ലെങ്കിൽ’ രണ്ട് അലങ്കാരചോദ്യങ്ങളെ ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിൽ നേരിട്ട് ‘അല്ലെങ്കിൽ ... പറയുന്നില്ലേ?’ എന്നു ചേർക്കുന്നത് വിപരീത ഉത്തരങ്ങൾപോലെ തെറ്റിദ്ധരിപ്പിക്കാവുന്നതിനാൽ, രണ്ട് തുടർച്ചയായ ചോദ്യങ്ങളാക്കി അതിന്റെ വാദാത്മക ബന്ധം നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -വും
  rationale: ന്യായപ്രമാണത്തെ മനുഷ്യവാദത്തിനു പുറമേയുള്ള അധികസാക്ഷിയായി ചേർക്കുന്ന additive അർത്ഥം മലയാളത്തിലെ ‘വും’ നൽകുന്നു.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: അടുത്ത വാക്യത്തിൽ ഉദ്ധരിക്കപ്പെടുന്ന മോശൈക ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ക്രൈസ്തവ വായനയിൽ പരിചിതവും പ്രത്യേകവുമായ പദം.
- source_word: οὐ λέγει
  choice: പറയുന്നില്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് നിഷേധചോദ്യത്തിന്റെ അലങ്കാരശക്തി മലയാളത്തിൽ സുതാര്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ὁ νόμος’ എന്നതിന്റെ പരാമർശം
  choice: മോശൈക ന്യായപ്രമാണം/തിരുവെഴുത്തിലെ നിയമസമാഹാരം സൂചിപ്പിക്കുന്ന ‘ന്യായപ്രമാണം’
  alternative: പൊതുവായ നിയമം അല്ലെങ്കിൽ തത്ത്വം
  rationale: തൊട്ടടുത്ത 9-ാം വാക്യം ആവർത്തനം 25:4 ഉദ്ധരിക്കുന്നതിനാൽ ഇവിടെ പൊതുവായ നിയമതത്ത്വമല്ല, തിരുവെഴുത്തിലെ ന്യായപ്രമാണമാണ് സാക്ഷിയായി വരുന്നത്.
- issue: ആദ്യ ചോദ്യത്തിലെ κατὰ ἄνθρωπον എന്നതിന്റെ പരിധി
  choice: ‘വെറും മാനുഷിക കാഴ്ചപ്പാടിൽനിന്ന്’
  alternative: ‘മനുഷ്യനനുസരിച്ച്’ അല്ലെങ്കിൽ ‘മാനുഷിക അധികാരത്തിൽ’
  rationale: പ്രയോഗം മനുഷ്യന്റെ മാത്രം വീക്ഷണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കാം; ‘കാഴ്ചപ്പാട്’ സന്ദർഭത്തിലെ തിരുവെഴുത്തുസാക്ഷ്യവുമായുള്ള വൈരുധ്യം വ്യക്തമാക്കുമ്പോഴും ‘അധികാരം’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ തിരുവെഴുത്തുപദം നിലനിർത്തി. ഗ്രീക്കിലെ ἢ മലയാളത്തിൽ അക്ഷരാർത്ഥമായി ചേർത്താൽ ചോദ്യങ്ങളുടെ താർക്കികബന്ധം അസ്വാഭാവികമാകുന്നതിനാൽ തുടർച്ചയായ രണ്ട് അലങ്കാരചോദ്യങ്ങളായി അവതരിപ്പിച്ചു; [a] മുഖ്യവാചകത്തിൽ കൃത്യമായി ചേർത്തിരിക്കുന്നു.
