id: 1CO.9.7
reference: 1 Corinthians 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: ml
  text: സ്വന്തം ചെലവിൽ ഒരിക്കലെങ്കിലും സൈനികസേവനം ചെയ്യുന്നവൻ ആരുണ്ട്? മുന്തിരിത്തോട്ടം നട്ടിട്ട് അതിന്റെ ഫലം ഭക്ഷിക്കാത്തവൻ ആര്? ആട്ടിൻകൂട്ടത്തെ മേയിച്ചിട്ട് ആ കൂട്ടത്തിന്റെ പാലിൽനിന്ന് കുടിക്കാത്തവൻ ആര്?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “സ്വന്തം വേതനംകൊണ്ട്.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം സൈനികന്റെ വേതനത്തെയോ ഭക്ഷണവിഹിതത്തെയോ സൂചിപ്പിക്കാം; സൈനികൻ തന്റെ സേവനച്ചെലവ് സ്വയം വഹിക്കുന്നില്ല എന്നതാണ് ആശയം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “ആ കൂട്ടത്തിന്റെ പാലിൽനിന്ന് ഭക്ഷിക്കാത്തവൻ.” പാലിനോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികമായ “കുടിക്കുക” എന്നാണ് മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: സൈനികസേവനം ചെയ്യുന്നവൻ
  rationale: സൈനികനായി സേവിക്കുന്നതെന്ന തൊഴിൽപരമായ ഉപമ നിലനിർത്തുന്നു; യുദ്ധത്തിൽ നേരിട്ട് പോരാടുന്നു എന്ന് അനാവശ്യമായി പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἰδίοις ὀψωνίοις
  choice: സ്വന്തം ചെലവിൽ
  rationale: ὀψώνιον സൈനികന്റെ വേതനമോ ഭക്ഷണവിഹിതമോ സൂചിപ്പിക്കാം; ഇവിടെ സ്വന്തം സേവനച്ചെലവ് സൈനികൻതന്നെ വഹിക്കുന്നില്ല എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ποτέ
  choice: ആരുണ്ട്? എന്ന ചോദ്യഘടനയിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഗ്രീക്കിലെ ‘എപ്പോഴെങ്കിലും/ഒരിക്കലെങ്കിലും’ എന്ന ഊന്നൽ മലയാളത്തിലെ ‘ആരുണ്ട്?’ എന്ന നിഷേധാർഥക വാചാടോപചോദ്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: φυτεύει ἀμπελῶνα
  choice: മുന്തിരിത്തോട്ടം നട്ടിട്ട്
  rationale: കാർഷികദൃശ്യം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: τὸν καρπὸν αὐτοῦ
  choice: അതിന്റെ ഫലം
  rationale: καρπός എന്നതിന്റെ നേരിട്ടുള്ള അർഥവും മുന്തിരിത്തോട്ടത്തിൽനിന്നുള്ള വിളവെന്ന ആശയവും സംരക്ഷിക്കുന്നു.
- source_word: ποιμαίνει ποίμνην
  choice: ആട്ടിൻകൂട്ടത്തെ മേയിച്ചിട്ട്
  rationale: ποιμαίνω എന്ന മേയിക്കൽ/പരിപാലിക്കൽ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ποίμνην ഏതു മൃഗക്കൂട്ടമാണെന്ന് ഗ്രീക്ക് നിർദിഷ്ടമാക്കുന്നില്ലെങ്കിലും പാലുമായി ബന്ധപ്പെട്ട പശ്ചാത്തലത്തിൽ ‘ആട്ടിൻകൂട്ടം’ മലയാളത്തിൽ വ്യക്തമാണ്.
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: ആ കൂട്ടത്തിന്റെ പാലിൽനിന്ന്
  rationale: ഉറവിടമോ പങ്കെടുപ്പോ സൂചിപ്പിക്കുന്ന ἐκ എന്ന ഘടകം നിലനിർത്തുന്നു.
- source_word: ἐσθίει
  choice: ഭക്ഷിക്കാത്തവൻ / കുടിക്കാത്തവൻ
  rationale: ആദ്യ പ്രയോഗത്തിൽ അക്ഷരാർഥമായ ‘ഭക്ഷിക്കുക’ നിലനിർത്തി; പാലിനോടൊപ്പം സ്വാഭാവിക മലയാളപ്രയോഗമായ ‘കുടിക്കുക’ ഉപയോഗിച്ചു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
theological_decisions:
- issue: ആവർത്തിക്കുന്ന τίς ചോദ്യങ്ങളിലെ പൊതുവായ പുല്ലിംഗ ഏകവചനം
  choice: ‘ചെയ്യുന്നവൻ/ചെയ്യാത്തവൻ’ എന്ന പ്രതിനിധാനപരമായ പുല്ലിംഗ ഏകവചനം
  alternative: ലിംഗനിരപേക്ഷ ബഹുവചനം ഉപയോഗിക്കുക
  rationale: ഗ്രീക്കിലെ ഏകവചന വാചാടോപ ഉദാഹരണങ്ങളുടെ രൂപവും ഒഴുക്കും മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാർക്കു മാത്രമായി അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മാന്യമായ മലയാളം. മൂന്നു വാചാടോപചോദ്യങ്ങളുടെയും സമാന്തരഘടന നിലനിർത്തിയിട്ടുണ്ട്. ‘ആട്ടിൻകൂട്ടം’ എന്നത് സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചെങ്കിലും ഗ്രീക്കിലെ ποίμνη പൊതുവായി ‘മൃഗക്കൂട്ടം’ എന്ന അർഥവും വഹിക്കാം.
