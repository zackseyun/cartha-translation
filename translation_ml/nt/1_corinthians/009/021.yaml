id: 1CO.9.21
reference: 1 Corinthians 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: ml
  text: ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവരോടു[a] ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവനെപ്പോലെ ഞാൻ ആയിത്തീർന്നു—ഞാൻ ദൈവത്തിന്റെ ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവനല്ലെങ്കിലും, മശിഹായുടെ ന്യായപ്രമാണത്തിനു വിധേയനായിരിക്കുന്നവനാണ്[b]—ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവരെ നേടാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ന്യായപ്രമാണമില്ലാത്തവർ’. ഇവിടെ ഈ പ്രയോഗം മോശയുടെ ന്യായപ്രമാണത്തിനു കീഴിലല്ലാത്തവരെ സൂചിപ്പിക്കുന്നു; അവർ ധാർമികമായി നിയമലംഘകരാണെന്നു അനിവാര്യമായി അർഥമാക്കുന്നില്ല.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്ക് പദപ്രയോഗം ‘മശിഹായുടെ ന്യായപ്രമാണത്തിനു വിധേയനായവൻ’; ‘മശിഹായുടെ ന്യായപ്രമാണത്തിനുള്ളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവർ / ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവൻ
  rationale: ഇവിടെ യഹൂദേതരരായ, മോശയുടെ ന്യായപ്രമാണത്തിനു കീഴിലല്ലാത്തവരെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. ‘നിയമലംഘകർ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് അനാവശ്യമായ ധാർമിക കുറ്റസൂചന നൽകും. ആവർത്തനം ഗ്രീക്ക് പാഠത്തിലെ മൂന്നു പ്രയോഗങ്ങളെയും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὡς
  choice: പോലെ
  rationale: പൗലോസ് അവരോടുള്ള തന്റെ ഇണങ്ങിച്ചേരുന്ന നിലപാടാണ് സൂചിപ്പിക്കുന്നത്; താൻ എല്ലാ അർഥത്തിലും ന്യായപ്രമാണമില്ലാത്തവനായിത്തീർന്നു എന്നല്ല.
- source_word: μὴ ὢν
  choice: എന്നാൽ ഞാൻ ... അല്ല
  rationale: മുൻവാക്യത്തെ നിയന്ത്രിക്കുന്ന concessive ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἔννομος
  choice: വിധേയൻ
  rationale: ഒരു നിയമത്തിന്റെ അധികാരപരിധിക്കുള്ളിലോ അതിനു കീഴിലോ ഇരിക്കുക എന്ന നിയമബന്ധം വ്യക്തമാക്കുന്നു; ‘പുറത്ത്’ എന്ന മുൻപ്രയോഗത്തോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശിഹായുടെ
  rationale: ഇവിടെ Χριστός സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ ‘മശിഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἵνα κερδάνω
  choice: നേടാൻതന്നെ
  rationale: ἵνα ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; κερδαίνω ഈ സുവിശേഷസന്ദർഭത്തിൽ ആളുകളെ വിശ്വാസത്തിലേക്ക് നേടുക എന്ന അർഥത്തിലാണ്, സാമ്പത്തിക ലാഭമല്ല.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ ἄνομος എന്നതിന്റെ അർഥം
  choice: മോശയുടെ ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവർ
  alternative: ധാർമികമായി നിയമലംഘകരോ ദുഷ്ടരോ ആയവർ
  rationale: 1 കൊരിന്ത്യർ 9:20–21-ലെ വൈരുധ്യം ന്യായപ്രമാണത്തിനു കീഴിലുള്ളവരും അതിനു പുറത്തുള്ളവരും തമ്മിലാണ്. ദൈവത്തിന്റെ ന്യായപ്രമാണത്തിനു പുറത്തല്ലെന്ന പൗലോസിന്റെ വിശദീകരണം, ധാർമിക അരാജകത്വമല്ല ഉടമ്പടി-നിയമപരമായ സ്ഥാനമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു.
- issue: ἔννομος Χριστοῦ എന്നതിന്റെ ശക്തി
  choice: മശിഹായുടെ ന്യായപ്രമാണത്തിനു വിധേയൻ
  alternative: മശിഹായുടെ ന്യായപ്രമാണത്തിനുള്ളിൽ
  rationale: പൗലോസ് ദൈവത്തോടുള്ള ധാർമിക ഉത്തരവാദിത്വത്തിൽനിന്നു സ്വതന്ത്രനല്ലെന്നും മശിഹായുമായി ബന്ധപ്പെട്ട ന്യായപ്രമാണത്തിനു വിധേയനാണെന്നും വാക്യം പറയുന്നു. ‘വിധേയൻ’ നിയമബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു; പദപ്രയോഗത്തിലെ ‘ഉള്ളിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: Χριστοῦ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശിഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: ഈ ബന്ധസൂചക പ്രയോഗത്തിൽ Χριστός ഒരു സ്ഥാനപ്പേരായി സജീവമാണ്; അതിനാൽ ‘മശിഹാ’ മൂലപദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം തുറന്നുകാട്ടുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായപ്രമാണം’ മോശയുടെ Torah-യെയും വാക്യത്തിലെ നിയമപരമായ പദകളിയെയും വ്യക്തമാക്കുന്നതിനായി സ്ഥിരമായി ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനം ആശയവൈരുധ്യത്തിനും വാക്യഘടനയ്ക്കും പ്രധാനമായതിനാൽ നിലനിർത്തി.
