- from: ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവരോടു[a] ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവനെപ്പോലെ ഞാൻ ആയി—എന്നാൽ ഞാൻ ദൈവത്തിന്റെ ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവനല്ല, മറിച്ച് മശിഹായുടെ ന്യായപ്രമാണത്തിനു വിധേയനാണ്[b]—ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവരെ നേടാൻതന്നെ.
  to: ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവരോടു[a] ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവനെപ്പോലെ ഞാൻ ആയിത്തീർന്നു—ഞാൻ ദൈവത്തിന്റെ ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവനല്ലെങ്കിലും, മശിഹായുടെ ന്യായപ്രമാണത്തിനു വിധേയനായിരിക്കുന്നവനാണ്[b]—ന്യായപ്രമാണത്തിനു പുറത്തുള്ളവരെ നേടാൻ.
  rationale: The revision removes unsupported emphasis from the purpose clause, makes the concessive force explicit, and improves Malayalam idiom without altering the source's legal contrast, repetition, or theological restraint. Footnotes retain both the contextual sense of ἄνομος and the lexical alternative for ἔννομος Χριστοῦ.
