    text: അഥവാ, “നിങ്ങളിന്മേലുള്ള ഈ അവകാശം” അല്ലെങ്കിൽ “നിങ്ങളിൽനിന്നുള്ള ഈ അവകാശം.” സന്ദർഭത്തിൽ ഇത് കൊരിന്ത്യരിൽനിന്ന് ഭൗതികസഹായം സ്വീകരിക്കാനുള്ള അപ്പൊസ്തലന്മാരുടെ അവകാശത്തെ സൂചിപ്പിക്കുന്നു.
