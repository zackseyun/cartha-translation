revisions:
- from: മറ്റുള്ളവർക്ക് നിങ്ങളിൽനിന്ന് സഹായം ലഭിക്കാനുള്ള ഈ അവകാശത്തിൽ പങ്കുണ്ടെങ്കിൽ, ഞങ്ങൾക്ക് അതിലേറെ അവകാശമില്ലേ? എന്നിട്ടും ഞങ്ങൾ ഈ അവകാശം ഉപയോഗിച്ചിട്ടില്ല. പകരം, മശീഹായുടെ സുവിശേഷത്തിന് യാതൊരു തടസ്സവും ഉണ്ടാക്കാതിരിക്കേണ്ടതിന് ഞങ്ങൾ എല്ലാം സഹിക്കുന്നു.
  to: മറ്റുള്ളവർ നിങ്ങളോടുള്ള ഈ അവകാശത്തിൽ പങ്കാളികളാണെങ്കിൽ, ഞങ്ങൾക്ക് അതിലേറെ അവകാശമില്ലേ? എങ്കിലും ഞങ്ങൾ ഈ അവകാശം ഉപയോഗിച്ചിട്ടില്ല. പകരം, മശീഹായുടെ സുവിശേഷത്തിന് യാതൊരു തടസ്സവും ഉണ്ടാക്കാതിരിക്കാൻ ഞങ്ങൾ എല്ലാം സഹിക്കുന്നു.
  rationale: The revision retains the Greek phrase’s relational breadth in the main text, locates the material-support explanation in a footnote, and corrects the purpose clause so that it reflects ἵνα μή without adding necessity. The rhetorical and contrastive structure, as well as the title-sense rendering of Χριστός as “മശീഹാ,” are retained.
  reviewer_model: gpt-5.6-terra
