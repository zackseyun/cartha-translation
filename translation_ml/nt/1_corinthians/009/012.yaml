id: 1CO.9.12
reference: 1 Corinthians 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: ml
  text: മറ്റുള്ളവർ നിങ്ങളോടുള്ള ഈ അവകാശത്തിൽ പങ്കാളികളാണെങ്കിൽ, ഞങ്ങൾക്ക് അതിലേറെ അവകാശമില്ലേ? എങ്കിലും ഞങ്ങൾ ഈ അവകാശം ഉപയോഗിച്ചിട്ടില്ല. പകരം, മശീഹായുടെ സുവിശേഷത്തിന് യാതൊരു തടസ്സവും ഉണ്ടാക്കാതിരിക്കാൻ ഞങ്ങൾ എല്ലാം സഹിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: സഹായം ലഭിക്കാനുള്ള ഈ അവകാശം
  rationale: സന്ദർഭത്തിൽ അപ്പൊസ്തലന്മാർക്കു കൊരിന്ത്യരിൽനിന്ന് ഭൗതികസഹായം സ്വീകരിക്കാനുള്ള ന്യായമായ അവകാശമാണ് ഉദ്ദേശിക്കുന്നത്. മലയാളത്തിൽ വെറും ‘അധികാരം’ എന്നതിനെക്കാൾ ഈ പ്രയോഗം അർത്ഥം വ്യക്തമായി നൽകുന്നു.
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: നിങ്ങളിൽനിന്ന് സഹായം ലഭിക്കാനുള്ള ഈ അവകാശം
  rationale: ὑμῶν എന്ന ബന്ധത്തെ കൊരിന്ത്യരുടെ സ്വന്തമായ അവകാശമെന്നല്ല, അവരിൽനിന്ന് സഹായം സ്വീകരിക്കുന്നതിനുള്ള അവകാശമെന്നായി വ്യക്തമാക്കുന്നു.
- source_word: μετέχουσιν
  choice: പങ്കുണ്ടെങ്കിൽ
  rationale: ഒരു അവകാശത്തിൽ പങ്കുചേരുകയോ അതിന്റെ പ്രയോജനം അനുഭവിക്കുകയോ ചെയ്യുന്നതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: ഞങ്ങൾക്ക് അതിലേറെ അവകാശമില്ലേ?
  rationale: μᾶλλον എന്ന താരതമ്യശക്തിയും പൗലോസിന്റെ വാഗ്വാദചോദ്യവും നിലനിർത്തുന്നു.
- source_word: ἐχρησάμεθα
  choice: ഉപയോഗിച്ചിട്ടില്ല
  rationale: അവകാശം പ്രയോഗിക്കുകയോ പ്രയോജനപ്പെടുത്തുകയോ ചെയ്തില്ലെന്ന ആശയം ലളിതവും കൃത്യവുമായി നൽകുന്നു.
- source_word: πάντα
  choice: എല്ലാം
  rationale: പൗലോസ് സഹിക്കുന്ന കാര്യങ്ങളുടെ സമഗ്രത നിലനിർത്തുന്നു.
- source_word: στέγομεν
  choice: സഹിക്കുന്നു
  rationale: ഇവിടെ മൂടിവയ്ക്കുക എന്നതിനെക്കാൾ പ്രയാസങ്ങൾ ക്ഷമയോടെ വഹിക്കുക എന്ന അർത്ഥമാണ് സന്ദർഭോചിതം.
- source_word: τινα ἐγκοπὴν
  choice: യാതൊരു തടസ്സവും
  rationale: സുവിശേഷത്തിന്റെ മുന്നേറ്റത്തിനു പ്രതിബന്ധമാകുന്ന എന്തിനെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: δῶμεν
  choice: ഉണ്ടാക്കാതിരിക്കേണ്ടതിന്
  rationale: ἵνα μή യോടുകൂടിയ ഉദ്ദേശ്യവാക്യത്തിന്റെ അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥമായ ‘നൽകുക’ ഇവിടെ കൃത്രിമമാകും.
- source_word: εὐαγγελίῳ
  choice: സുവിശേഷം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ സ്ഥാപിതവും വ്യക്തവുമായ മലയാള തത്തുല്യം.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: ഇവിടെ Χριστός സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ മശീഹാ അർത്ഥം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ വിവർത്തനം
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: τοῦ Χριστοῦ ഇവിടെ പേരുപോലെ മാത്രം അല്ല, അഭിഷിക്തനായവൻ എന്ന സ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. അതിനാൽ മശീഹാ എന്ന പദം സ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവകാശം’ എന്ന അമൂർത്തപദത്തിന്റെ സന്ദർഭാർഥം തെറ്റാതിരിക്കാൻ ‘സഹായം ലഭിക്കാനുള്ള’ എന്ന് വ്യക്തമാക്കി; വാഗ്വാദചോദ്യവും ഉദ്ദേശ്യവാക്യവും നിലനിർത്തി.
