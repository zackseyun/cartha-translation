id: 1CO.9.23
reference: 1 Corinthians 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: ml
  text: എന്നാൽ, സുവാർത്തയ്ക്കുവേണ്ടി[a] ഞാൻ ഇതെല്ലാം ചെയ്യുന്നു; അതിൽ ഞാനും പങ്കാളിയാകേണ്ടതിന്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സുവിശേഷത്തിനുവേണ്ടി.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞാനും അതിൽ പങ്കുചേരേണ്ടതിന്’ അല്ലെങ്കിൽ ‘അതിന്റെ ഒരു സഹപങ്കാളിയായിത്തീരേണ്ടതിന്.’
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ഇതെല്ലാം
  rationale: സന്ദർഭത്തിൽ പൗലോസ് വിവരിച്ച വിവിധ അനുരൂപീകരണങ്ങളെയെല്ലാം സമഗ്രമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഇതെല്ലാം’ സ്വാഭാവികവും വ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യങ്ങളോടുള്ള മൃദുവായ വൈരുധ്യവും ആശയമാറ്റവും വ്യക്തമാക്കുന്നു.
- source_word: ποιῶ
  choice: ഞാൻ ... ചെയ്യുന്നു
  rationale: വർത്തമാനകാല ക്രിയയായ ποιῶ സൂചിപ്പിക്കുന്ന പതിവായ, തുടരുന്ന പ്രവർത്തനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τὸ εὐαγγέλιον
  choice: സുവാർത്തയ്ക്കുവേണ്ടി
  rationale: διά + accusative ഇവിടെ ഉദ്ദേശ്യം, പ്രയോജനം, പ്രേരണ എന്നിവ ഉൾക്കൊള്ളുന്നു. ‘വേണ്ടി’ ഈ വിശാലത നിലനിർത്തുന്നു; εὐαγγέλιον സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം ‘സുവാർത്ത’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ἵνα
  choice: അങ്ങനെ ... വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെ പരിചയപ്പെടുത്തുന്ന ἵναയുടെ ലക്ഷ്യാർഥം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യഘടനയിലൂടെ നിലനിർത്തുന്നു.
- source_word: συγκοινωνὸς
  choice: സഹപങ്കാളി
  rationale: മറ്റുള്ളവരോടൊപ്പം എന്തിലെങ്കിലും പങ്കാളിയാകുക എന്ന συν- ഘടകത്തിന്റെ സഹഭാഗിത്വം ചുരുക്കമായും വ്യക്തമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: αὐτοῦ
  choice: അതിൽ
  rationale: നപുംസകലിംഗമായ εὐαγγέλιον ആണ് ഏറ്റവും അടുത്തതും സ്വാഭാവികവുമായ പൂർവപദം; ‘പങ്കാളി’ എന്നതിനൊപ്പം മലയാളത്തിൽ ‘അതിൽ’ യോജിക്കുന്നു.
- source_word: γένωμαι
  choice: ആയിത്തീരേണ്ടതിന്
  rationale: γίνομαιയുടെ ‘ആയിത്തീരുക’ എന്ന ഭാവവും ἵναയ്ക്ക് ശേഷമുള്ള സാധ്യത/ഉദ്ദേശ്യസ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: സുവാർത്തയിലുള്ള പൗലോസിന്റെ പങ്കാളിത്തത്തിന്റെ അർഥം
  choice: ‘അതിൽ സഹപങ്കാളിയായിത്തീരുക’ എന്ന വിശാലമായ പ്രയോഗം
  alternative: അതിന്റെ അനുഗ്രഹങ്ങളിൽ പങ്കുചേരുക; അതിന്റെ വ്യാപനത്തിൽ പങ്കാളിയാകുക; സുവാർത്താശുശ്രൂഷയിൽ പങ്കാളിയാകുക
  rationale: συγκοινωνός സുവാർത്തയുടെ അനുഗ്രഹങ്ങളിലും അതിന്റെ ദൗത്യത്തിലും ഉള്ള പങ്കാളിത്തത്തെ ഉൾക്കൊള്ളാൻ കഴിയും. മുഖ്യപാഠം ഇവയിൽ ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ യഥാർഥമായ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. പരമ്പരാഗതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ നിലനിർത്തിക്കൊണ്ട്, സാധാരണ വായനക്കാർക്ക് നേരിട്ട് ഗ്രഹിക്കാവുന്ന ‘സുവാർത്ത’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ സഹപങ്കാളിത്തവും ആയിത്തീരലും കഴിയുന്നത്ര വ്യക്തമായി സംരക്ഷിച്ചു.
