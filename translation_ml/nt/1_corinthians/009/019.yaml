id: 1CO.9.19
reference: 1 Corinthians 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: ml
  text: ഞാൻ എല്ലാവരിൽനിന്നും സ്വതന്ത്രനാണെങ്കിലും, കൂടുതൽപേരെ നേടേണ്ടതിന് എന്നെത്തന്നെ എല്ലാവർക്കും അടിമയാക്കി.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്നെത്തന്നെ എല്ലാവരുടെയും ദാസനാക്കി.’ ഗ്രീക്കിൽ അടിമത്തത്തെ സൂചിപ്പിക്കുന്ന ശക്തമായ ഭാഷയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; ‘സ്വതന്ത്രൻ’ എന്നതിനോടുള്ള വൈരുധ്യം നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘അടിമ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: ‘അടിമ’ എന്ന ശക്തമായ മൂലരൂപകത്തിന് കൂടുതൽ മൃദുവായ സ്വാഭാവിക പകരംവായന നൽകുന്നു.
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: സ്വതന്ത്രൻ
  rationale: ആരുടെയും ബന്ധനത്തിനോ അധികാരാവകാശത്തിനോ കീഴിലല്ല എന്ന അർഥം നൽകുന്നു; തുടർന്നുള്ള അടിമത്തഭാഷയോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἐκ πάντων
  choice: എല്ലാവരിൽനിന്നും
  rationale: എല്ലാ മനുഷ്യരോടും ബന്ധപ്പെട്ട് സ്വതന്ത്രനായിരിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും വ്യക്തിസൂചനയും നിലനിർത്തുന്നു.
- source_word: πᾶσιν
  choice: എല്ലാവർക്കും
  rationale: പൗലോസ് സ്വയം ആരുടെ അടിമയാക്കിയെന്നു സൂചിപ്പിക്കുന്ന ദത്തിവ് രൂപം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ‘എല്ലാവരിൽനിന്നും—എല്ലാവർക്കും’ എന്ന സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: എന്നെത്തന്നെ അടിമയാക്കി
  rationale: δουλόω എന്ന ക്രിയയിലെ ശക്തമായ അടിമത്തരൂപകം സംരക്ഷിക്കുന്നു; സ്വമേധയാ ഏറ്റെടുത്ത കീഴ്പെടലും പ്രതിഫലനിർദ്ദേശവും വ്യക്തമാണ്.
- source_word: ἵνα
  choice: വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയുടെ അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοὺς πλείονας
  choice: കൂടുതൽപേരെ
  rationale: താരതമ്യരൂപം സൂചിപ്പിക്കുന്ന ‘കൂടുതൽ ആളുകളെ’ എന്ന അർഥം നിലനിർത്തുന്നു; ‘കഴിയുന്നത്ര പേരെ’ എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: κερδήσω
  choice: നേടുക
  rationale: മനുഷ്യരെ സുവിശേഷപരമായി നേടുക എന്ന രൂപകാർഥം മലയാളത്തിലെ പരിചിതവും സ്വാഭാവികവുമായ പ്രയോഗത്തിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: δουλόω എന്ന അടിമത്തഭാഷയുടെ പരിഭാഷ
  choice: അടിമയാക്കി
  alternative: ദാസനാക്കി / സേവകനാക്കി
  rationale: ‘സ്വതന്ത്രൻ’ എന്നതിനോടുള്ള പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യം കേന്ദ്രസ്ഥാനത്തുള്ളതിനാൽ അടിമത്തത്തിന്റെ ശക്തി മയപ്പെടുത്താതെ നിലനിർത്തുന്നു. ഇത് നിർബന്ധിത അടിമത്തമല്ല, പൗലോസ് സ്വമേധയാ ഏറ്റെടുത്ത സമ്പൂർണ കീഴ്പെടലാണെന്ന് ‘എന്നെത്തന്നെ’ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. മൂലത്തിലെ ‘എല്ലാവരിൽനിന്നും—എല്ലാവർക്കും’ എന്ന വാഗ്‌വൈരുധ്യവും ‘സ്വതന്ത്രൻ—അടിമ’ എന്ന കേന്ദ്രവൈരുധ്യവും സംരക്ഷിച്ചു.
