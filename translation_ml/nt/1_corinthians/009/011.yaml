id: 1CO.9.11
reference: 1 Corinthians 9:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: ml
  text: ഞങ്ങൾ നിങ്ങളുടെ ഇടയിൽ ആത്മീയമായവ വിതച്ചിട്ടുണ്ടെങ്കിൽ, ഞങ്ങൾ നിങ്ങളിൽനിന്ന് ഭൗതികമായവ[a] കൊയ്യുന്നത് അതിരുകടന്ന കാര്യമാണോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശരീരജീവിതവുമായി ബന്ധപ്പെട്ടവ.’ ഗ്രീക്കിൽ ‘ആത്മീയമായവ’ എന്നതിനെ സാധാരണ ശരീരജീവിതത്തോടോ ഭൗതികജീവിതത്തോടോ ബന്ധപ്പെട്ട കാര്യങ്ങളുമായി താരതമ്യം ചെയ്യുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: ആത്മീയമായവ
  rationale: നപുംസകലിംഗ ബഹുവചന വിശേഷണം നാമമായി പ്രയോഗിച്ചിരിക്കുന്നു. ആത്മീയ അനുഗ്രഹങ്ങളെയോ ശുശ്രൂഷയിലൂടെ ലഭിച്ച നന്മകളെയോ മാത്രം ചുരുക്കാതെ ഗ്രീക്കിലെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐσπείραμεν
  choice: വിതച്ചിട്ടുണ്ടെങ്കിൽ
  rationale: പൗലോസും സഹപ്രവർത്തകരും മുമ്പ് നിർവഹിച്ച ശുശ്രൂഷയെയും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയെയും സൂചിപ്പിക്കുന്നു; വിതയ്ക്കൽ–കൊയ്ത്ത് രൂപകം നിലനിർത്തുന്നു.
- source_word: μέγα
  choice: അതിരുകടന്ന കാര്യം
  rationale: ഈ അലങ്കാരചോദ്യത്തിൽ പ്രതീക്ഷിക്കുന്ന സഹായം അമിതമോ യുക്തിരഹിതമോ ആണോ എന്നാണ് μέγα ചോദിക്കുന്നത്. ആ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὰ σαρκικὰ
  choice: ഭൗതികമായവ
  rationale: ഇവിടെ പാപകരമായ ‘ജഡിക’ പ്രവൃത്തികളല്ല, ശരീരജീവിതത്തിനും ശുശ്രൂഷയ്ക്കും വേണ്ട പ്രായോഗികമോ വസ്തുസംബന്ധമോ ആയ പിന്തുണയാണ് ഉദ്ദേശ്യം.
- source_word: θερίσομεν
  choice: കൊയ്യുന്നത്
  rationale: ഭാവികാല ക്രിയയുടെ അർഥം നിബന്ധനാപരമായ അലങ്കാരചോദ്യത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുകയും വിതയ്ക്കൽ–കൊയ്ത്ത് രൂപകം തുടരുകയും ചെയ്യുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങളിൽനിന്ന്
  rationale: കൊയ്യപ്പെടുന്ന ഭൗതിക പിന്തുണയുടെ ഉറവിടം കൊരിന്ത്യരാണെന്ന് ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡμεῖς
  choice: ഞങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ സർവനാമം അപ്പൊസ്തലിക അധ്വാനത്തെയും ലഭിക്കാവുന്ന പിന്തുണയെയും തമ്മിൽ ബന്ധിപ്പിക്കുന്ന ഊന്നൽ വഹിക്കുന്നു.
theological_decisions:
- issue: πνευματικὰ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘ആത്മീയമായവ’ എന്ന വിശാല പ്രയോഗം
  alternative: ‘ആത്മീയ അനുഗ്രഹങ്ങൾ’ അല്ലെങ്കിൽ ‘ആത്മാവിന്റെ കാര്യങ്ങൾ’
  rationale: മൂലപദം ആത്മീയ ശുശ്രൂഷയെയും അതിലൂടെ ലഭിച്ച നന്മകളെയും വിശാലമായി സൂചിപ്പിക്കുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- issue: πνευματικὰ എന്നതിനോടുള്ള വിരുദ്ധതയിൽ σαρκικὰ എന്നതിന്റെ അർഥം
  choice: ശുശ്രൂഷയ്ക്കുള്ള ഭൗതികമോ ശരീരജീവിതസംബന്ധമോ ആയ പിന്തുണ
  alternative: ധാർമികമായി ദുഷിച്ച ‘ജഡിക കാര്യങ്ങൾ’
  rationale: സന്ദർഭത്തിൽ പൗലോസ് അപ്പൊസ്തലന്മാർക്ക് ഉപജീവനസഹായം ലഭിക്കാനുള്ള അവകാശത്തെക്കുറിച്ചാണ് വാദിക്കുന്നത്. അതിനാൽ വിരുദ്ധത ആത്മീയ ശുശ്രൂഷയും ഭൗതിക പിന്തുണയും തമ്മിലാണ്, വിശുദ്ധിയും പാപവും തമ്മിലല്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ആത്മീയമായവ/ഭൗതികമായവ’ എന്ന സമാന്തരഘടന മൂലത്തിലെ വിരുദ്ധതയും കൃഷിരൂപകവും നിലനിർത്തുന്നു.
