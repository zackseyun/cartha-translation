id: 1CO.9.20
reference: 1 Corinthians 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: ml
  text: യഹൂദന്മാർക്കു ഞാൻ യഹൂദനെപ്പോലെയായി[a], യഹൂദന്മാരെ നേടേണ്ടതിന്; ന്യായപ്രമാണത്തിനു കീഴിലുള്ളവർക്കു[b] ഞാൻ ന്യായപ്രമാണത്തിനു കീഴിലുള്ളവനെപ്പോലെയായി—ഞാൻതന്നെ ന്യായപ്രമാണത്തിനു കീഴിലുള്ളവനല്ലെങ്കിലും—ന്യായപ്രമാണത്തിനു കീഴിലുള്ളവരെ നേടേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നേടുക’ എന്നതിന് ‘ലാഭിക്കുക’ അല്ലെങ്കിൽ ‘ജയിച്ചുനേടുക’ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ന്യായപ്രമാണം’ എന്നു പറയുന്നത് മിക്കവാറും മോശെയുടെ ന്യായപ്രമാണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: ആയി
  rationale: γίνομαι എന്ന ക്രിയയുടെ സന്ദർഭോചിതമായ അർഥമായ ഒരു നിലപാടോ പെരുമാറ്റരീതിയോ സ്വീകരിക്കൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; പൗലോസ് വംശീയമായി യഹൂദനല്ലാതായി എന്ന ധ്വനി നൽകുന്നില്ല.
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: യഹൂദന്മാർക്ക് യഹൂദനെപ്പോലെയായി
  rationale: ആവർത്തിക്കുന്ന ὡς എന്നതിന്റെ താരതമ്യബലം ‘പോലെ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു; ബന്ധപ്പെട്ട ജനവിഭാഗത്തോടുള്ള പൗലോസിന്റെ അനുരൂപപ്പെടലാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἵνα ... κερδήσω
  choice: നേടേണ്ടതിന്
  rationale: κερδαίνω എന്നതിന് അക്ഷരാർഥത്തിൽ ലാഭിക്കുക/നേടുക എന്നും ഈ മിഷനറി സന്ദർഭത്തിൽ ആളുകളെ സ്വന്തമാക്കുക അല്ലെങ്കിൽ അനുകൂലരാക്കുക എന്നും അർഥമുണ്ട്. ‘നേടുക’ ഈ അർഥവ്യാപ്തി ചുരുക്കാതെ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τοῖς ὑπὸ νόμον
  choice: ന്യായപ്രമാണത്തിന് കീഴിലുള്ളവർക്ക്
  rationale: ὑπὸ νόμον എന്നത് ഒരു നിയമവ്യവസ്ഥയുടെ അധികാരത്തിനോ ബാധ്യതയ്ക്കോ കീഴിലുള്ള നിലയെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണം’ എന്നത് ബൈബിൾസന്ദർഭത്തിൽ പരിചിതവും മാന്യവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: ὡς ὑπὸ νόμον
  choice: അതിന് കീഴിലുള്ളവനെപ്പോലെയായി
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത താരതമ്യഘടന നിലനിർത്തുന്നതിനൊപ്പം മലയാളത്തിൽ ആവർത്തനം ഭാരം കൂടാതിരിക്കാൻ സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: ഞാൻതന്നെ ന്യായപ്രമാണത്തിന് കീഴിലുള്ളവനല്ലെങ്കിലും
  rationale: വർത്തമാന കൃദന്തരൂപം പൗലോസിന്റെ നിലയെ സമകാലികമായ ഒരു വിട്ടുവീഴ്ചയായി വ്യക്തമാക്കുന്നു. ‘അല്ലെങ്കിലും’ പ്രധാനവാക്യത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: αὐτὸς
  choice: ഞാൻതന്നെ
  rationale: αὐτός നൽകുന്ന ഊന്നൽ മലയാളത്തിലെ ‘തന്നെ’ സംരക്ഷിക്കുന്നു.
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: യഹൂദന്മാരെക്കുറിച്ചുള്ള സമീപസന്ദർഭത്തിൽ മോശൈക ന്യായപ്രമാണമാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന. എന്നാൽ മുഖ്യപാഠത്തിൽ ‘മോശെയുടെ’ എന്ന് ചേർത്ത് അർഥം നിർബന്ധിതമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഞാൻതന്നെ ന്യായപ്രമാണത്തിന് കീഴിലുള്ളവനല്ല’ എന്ന പൗലോസിന്റെ പ്രസ്താവനയുടെ അർഥം
  choice: പൗലോസിന്റെ സ്വന്തം നിലയെ വിശദീകരണയോഗ്യതകളൊന്നും ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
  alternative: ‘ഞാൻതന്നെ മോശെയുടെ ന്യായപ്രമാണത്തിന് കീഴിലുള്ളവനല്ലെങ്കിലും’ എന്നോ അടുത്ത വാക്യത്തിലെ ‘ക്രിസ്തുവിന്റെ നിയമത്തിന് അധീനൻ’ എന്ന ആശയം ചേർത്ത് സമന്വയിപ്പിച്ചോ പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് പൗലോസ് ന്യായപ്രമാണത്തിന് കീഴിലല്ലെന്നു മാത്രമാണ് പറയുന്നത്. അടുത്ത വാക്യത്തിലെ ഭാഷ ഇറക്കുമതി ചെയ്യാതെയും ‘മോശെയുടെ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കാതെയും വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തരഘടനയും പൗലോസിന്റെ ഊന്നലും നിലനിർത്തിയിരിക്കുന്നു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും [a], [b] എന്നിങ്ങനെ ചേർത്തിട്ടുണ്ട്.
