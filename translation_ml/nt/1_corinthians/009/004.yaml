  yaml_path: translation/nt/1_corinthians/009/004.yaml
  text: Do we not have the right to eat and drink?[a]
translation:
  language: ml
  text: ഭക്ഷിക്കാനും കുടിക്കാനും ഞങ്ങൾക്ക് അവകാശമില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഭക്ഷിക്കാനും കുടിക്കാനുമുള്ള അധികാരം.’ ഇവിടെ ‘അവകാശം’ എന്നത് ന്യായമായ അവകാശവാദത്തെയോ സ്വാതന്ത്ര്യത്തെയോ സൂചിപ്പിക്കുന്നു; പൗലോസിന്റെ വാദസന്ദർഭത്തിൽ, ഭൗതിക പിന്തുണ സ്വീകരിക്കാനുള്ള അവകാശമായിരിക്കാം ഉദ്ദേശ്യം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὐκ
  choice: ഇല്ലേ?
  rationale: ഇരട്ട നിഷേധത്തോടുകൂടിയ ഗ്രീക്ക് പ്രയോഗം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ആലങ്കാരിക ചോദ്യമാണ്. മലയാളത്തിലെ ‘ഇല്ലേ?’ അതിന്റെ ചോദ്യംരൂപവും പ്രതീക്ഷിക്കുന്ന സമ്മതവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἔχομεν
  choice: ഞങ്ങൾക്ക് ... ഇല്ലേ
  rationale: വർത്തമാനകാലത്തിലെ ‘ഉണ്ട്/കൈവശമുണ്ട്’ എന്ന ആശയം മലയാളത്തിലെ സ്വാഭാവികമായ ആലങ്കാരിക ചോദ്യഘടനയിൽ ഇങ്ങനെ പ്രകടമാകുന്നു.
- source_word: ἐξουσίαν
  choice: അവകാശം
  rationale: ഇവിടെ ഭരണാധികാരമോ വെറും ശക്തിയോ അല്ല, ന്യായമായ അവകാശമോ അംഗീകൃത സ്വാതന്ത്ര്യമോ ആണ് ഉദ്ദേശ്യം. ‘അവകാശം’ സന്ദർഭത്തിന് യോജിച്ചും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും ഇരിക്കുന്നു.
- source_word: φαγεῖν
  choice: ഭക്ഷിക്കാൻ
  rationale: ἐξουσίαν എന്ന നാമത്തോടു ബന്ധപ്പെട്ട ക്രിയാപ്രവൃത്തിയെ മലയാളത്തിൽ ഉദ്ദേശ്യരൂപത്തിലുള്ള ക്രിയാനാമമായി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καὶ πεῖν
  choice: കുടിക്കാനും
  rationale: രണ്ടു ഏകോപിത ക്രിയകളെയും ‘-ാനും’ രൂപത്തിൽ ചേർക്കുന്നത് ഗ്രീക്കിലെ ‘ഉം/കൂടാതെ’ എന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അപ്പൊസ്തലിക അവകാശത്തിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ഭക്ഷിക്കാനും കുടിക്കാനുമുള്ള ന്യായമായ അവകാശം എന്ന നിലയിൽ പൊതുവായി നിലനിർത്തി; സന്ദർഭത്തിലെ ഭൗതിക പിന്തുണയുടെ സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: സാധാരണ മനുഷ്യർക്കുള്ള ഭക്ഷണപാനീയ സ്വാതന്ത്ര്യത്തെക്കുറിച്ചുള്ള പൊതുപ്രസ്താവന; അല്ലെങ്കിൽ സഭയിൽനിന്ന് ആഹാരപിന്തുണ സ്വീകരിക്കാനുള്ള അവകാശം എന്ന് മുഖ്യപാഠത്തിൽ തന്നെ വ്യക്തമാക്കൽ.
  rationale: 1 കൊരിന്ത്യർ 9-ന്റെ സന്ദർഭം അപ്പൊസ്തലന്മാർക്കും ശുശ്രൂഷകർക്കും ലഭിക്കേണ്ട പിന്തുണയെക്കുറിച്ചാണെങ്കിലും, ഈ വാക്യത്തിലെ ഗ്രീക്ക് പാഠം ‘പിന്തുണ സ്വീകരിക്കുക’ എന്ന് നേരിട്ട് പറയുന്നില്ല. അതിനാൽ സന്ദർഭം അനാവശ്യമായി മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ അർത്ഥവ്യാപ്തി സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി നിലനിർത്താൻ ചുരുക്കവും സ്വാഭാവികവുമായ ‘ഇല്ലേ?’ ഘടന ഉപയോഗിച്ചു.
