id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: ml
  text: അപ്പോൾ എന്റെ പ്രതിഫലം എന്താണ്? ഞാൻ സുവാർത്ത അറിയിക്കുമ്പോൾ, സുവാർത്ത[a] സൗജന്യമായി നൽകുകയും അങ്ങനെ സുവാർത്താപ്രവർത്തനത്തിലുള്ള എന്റെ അവകാശം പൂർണമായി ഉപയോഗിക്കാതിരിക്കുകയും ചെയ്യുന്നതുതന്നെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘സുവിശേഷം’; ഈ വാക്യത്തിലെ ‘സുവാർത്ത’ വരുന്ന എല്ലായിടത്തും.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സുവാർത്തയിലുള്ള എന്റെ അവകാശം പൂർണമായി ഉപയോഗിക്കാതിരിക്കാൻ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: പ്രതിഫലം
  rationale: ഇവിടെ പൗലോസ് സാധാരണ കൂലിയെക്കാൾ വിശാലമായ അർഥത്തിൽ തന്റെ ശുശ്രൂഷയ്ക്കു ലഭിക്കുന്ന പ്രതിഫലത്തെക്കുറിച്ചാണ് ചോദിക്കുന്നത്. പ്രതിഫലം വാങ്ങാതെ പ്രസംഗിക്കുന്നതുതന്നെയാണ് തന്റെ ‘പ്രതിഫലം’ എന്ന വാക്യത്തിലെ വിരോധാഭാസവും ഈ പദം നിലനിർത്തുന്നു.
- source_word: εὐαγγελιζόμενος
  choice: സുവാർത്ത അറിയിക്കുമ്പോൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം മുഖ്യപ്രവർത്തനത്തോടൊപ്പം നടക്കുന്ന സുവാർത്താഘോഷണത്തെ സൂചിപ്പിക്കുന്നു. ഈ പരിഭാഷ അതിന്റെ ക്രിയാത്മക സ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδάπανον
  choice: സൗജന്യമായി
  rationale: ചെലവോ പ്രതിഫലമോ ഈടാക്കാതെ എന്ന അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: θήσω τὸ εὐαγγέλιον
  choice: സുവാർത്ത നൽകുകയും
  rationale: അക്ഷരാർഥത്തിൽ ‘സുവാർത്ത വെക്കുക/സ്ഥാപിക്കുക’ എന്നാണെങ്കിലും സന്ദർഭത്തിൽ അതു മറ്റുള്ളവർക്കു സൗജന്യമായി ലഭ്യമാക്കുക എന്ന ആശയമാണ്. ‘നൽകുക’ ഈ പ്രയോഗത്തിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥമായ ‘നല്ല വാർത്ത’ സഭാപരമായ അർഥഭാരം നഷ്ടപ്പെടുത്താതെ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ രൂപത്തിൽ നൽകുന്നു; പരമ്പരാഗതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καταχρήσασθαι
  choice: പൂർണമായി ഉപയോഗിക്കുക
  rationale: ഈ സന്ദർഭത്തിൽ പൗലോസ് നിയമാനുസൃതമായ അവകാശം മുഴുവനായി വിനിയോഗിക്കാതിരിക്കുന്നതിനെക്കുറിച്ചാണ് പറയുന്നത്. ‘ദുരുപയോഗം ചെയ്യുക’ എന്ന പരിഭാഷ മൂലപദത്തിൽ ഇവിടെ നിർബന്ധമല്ലാത്ത കുറ്റകരമായ ഭാവം ചേർക്കും.
- source_word: ἐξουσίᾳ
  choice: അവകാശം
  rationale: ഒൻപതാം അധ്യായത്തിന്റെ സന്ദർഭത്തിൽ ശുശ്രൂഷയ്ക്കു ഭൗതിക പിന്തുണ ലഭിക്കാനുള്ള ന്യായമായ അവകാശമാണ് മുൻനിരയിൽ; അതിനാൽ വിശാലമായ ‘അധികാരം’ എന്നതിനെക്കാൾ ‘അവകാശം’ കൃത്യമാണ്.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: സുവാർത്താപ്രവർത്തനത്തിലുള്ള
  rationale: ഗ്രീക്ക് പ്രയോഗം സുവാർത്തയുമായി ബന്ധപ്പെട്ട പ്രവർത്തനത്തിലോ ശുശ്രൂഷയിലോ ഉള്ള അവകാശത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ അവ്യക്തത ഒഴിവാക്കാൻ ബന്ധം മിതമായി വ്യക്തമാക്കിയിരിക്കുന്നു; കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ ἐξουσίαയുടെ സ്വഭാവം
  choice: സുവാർത്താപ്രവർത്തനത്തിൽ ഭൗതിക പിന്തുണ സ്വീകരിക്കാനുള്ള പൗലോസിന്റെ ന്യായമായ അവകാശം; അത് പൂർണമായി ഉപയോഗിക്കാതിരിക്കാൻ അദ്ദേഹം സ്വമേധയാ തീരുമാനിക്കുന്നു.
  alternative: പൊതുവായ അപ്പൊസ്തലിക അധികാരം; അല്ലെങ്കിൽ അധികാരത്തിന്റെ ദുരുപയോഗം.
  rationale: 1 കൊരിന്ത്യർ 9-ന്റെ ചുറ്റുപാടിലുള്ള വാദം ഉപജീവനപിന്തുണ ലഭിക്കാനുള്ള അപ്പൊസ്തലന്റെ അവകാശത്തെ ആവർത്തിച്ചു വിശദീകരിക്കുന്നു. അതുകൊണ്ട് കുറ്റകരമായ ചൂഷണം സൂചിപ്പിക്കാതെ ‘അവകാശം’, ‘പൂർണമായി ഉപയോഗിക്കുക’ എന്നു പരിഭാഷപ്പെടുത്തി.
- issue: εὐαγγέλιον എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സുവാർത്ത
  alternative: സുവിശേഷം
  rationale: മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. പരമ്പരാഗത സഭാപദമായ ‘സുവിശേഷം’ സാധുവായ മറ്റൊരു രൂപമായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും θήσω എന്ന പ്രയോഗം വാക്കുതോറും മാറ്റാതെ സന്ദർഭാനുസൃതമായി ‘നൽകുക’ എന്നു പരിഭാഷപ്പെടുത്തി. അവകാശത്തിന്റെ ന്യായസാധുതയും അതു സ്വമേധയാ ഉപയോഗിക്കാതിരിക്കുന്നതും വേർതിരിച്ചു സൂക്ഷിച്ചിട്ടുണ്ട്.
