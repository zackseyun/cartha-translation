  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ രണ്ടു സമാന്തര ഉപവാക്യങ്ങളും കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു: വിശുദ്ധ/ദേവാലയ ശുശ്രൂഷയിൽ ഏർപ്പെടുന്നവർ ദേവാലയത്തിൽനിന്നുള്ളത് ഭക്ഷിക്കുന്നു; യാഗപീഠസേവകർ അർപ്പണങ്ങളുമായി ബന്ധപ്പെട്ട വിഹിതത്തിൽ പങ്കു ലഭിക്കുന്നു. ‘യാഗപീഠത്തിൽ അർപ്പിക്കുന്നവയിൽ’ എന്ന വിശദീകരണാത്മക രൂപം συμμερίζονται എന്നതിന്റെ സന്ദർഭാർഥം ശരിയായി അറിയിക്കുന്നു; അടിക്കുറിപ്പ് കൂടുതൽ അക്ഷരാർഥമായ സാധ്യതയും സൂക്ഷിക്കുന്നു.'
  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമാണ്. ‘ദേവാലയത്തിൽനിന്നുള്ളവ ഭക്ഷിക്കുന്നു’ അല്പം ഔപചാരികമായ പ്രയോഗമാണെങ്കിലും ബൈബിൾ വിവർത്തനരജിസ്റ്ററിൽ വ്യക്തവും സ്വീകാര്യവുമാണ്. വാക്യാവസാനത്തെ ‘നിങ്ങൾ അറിയുന്നില്ലേ?’ പൗലൊസിന്റെ ആലങ്കാരിക ചോദ്യത്തിന്റെ ഊന്നൽ നന്നായി പുനരാവിഷ്കരിക്കുന്നു.
  terminology: ‘ദേവാലയം,’ ‘വിശുദ്ധശുശ്രൂഷകൾ,’ ‘യാഗപീഠം,’ ‘വിഹിതം’ എന്നിവ യഹൂദ ആലയ-യാഗസന്ദർഭത്തിന് യോജിച്ച, സ്ഥിരതയുള്ള പദങ്ങളാണ്. ഇവ പിൽക്കാല സഭാപദവികളെയോ വിഭാഗീയ വ്യാഖ്യാനങ്ങളെയോ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
