id: 1CO.9.13
reference: 1 Corinthians 9:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: ml
  text: ദേവാലയത്തിലെ വിശുദ്ധശുശ്രൂഷകൾ ചെയ്യുന്നവർ ദേവാലയത്തിൽനിന്നുള്ളവ ഭക്ഷിക്കുന്നുവെന്നും[a], യാഗപീഠത്തിനരികിൽ സേവനം ചെയ്യുന്നവർ യാഗപീഠത്തിൽ അർപ്പിക്കുന്നവയിൽ പങ്കു ലഭിക്കുന്നുവെന്നും[b] നിങ്ങൾ അറിയുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘വിശുദ്ധകാര്യങ്ങളിൽ പ്രവർത്തിക്കുന്നവർ ദേവാലയത്തിൽനിന്നുള്ളവ ഭക്ഷിക്കുന്നു.’'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘യാഗപീഠത്തിനരികിൽ സേവനം ചെയ്യുന്നവർ യാഗപീഠവുമായി പങ്കിടുന്നു’; അതായത്, അവിടെ അർപ്പിക്കുന്ന യാഗങ്ങളിൽനിന്ന് അവർക്ക് ഒരു വിഹിതം ലഭിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: നിങ്ങൾ അറിയുന്നില്ലേ?
  rationale: പൗലൊസിന്റെ പതിവായ ആലങ്കാരിക ചോദ്യരൂപത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: ദേവാലയത്തിലെ വിശുദ്ധശുശ്രൂഷകൾ ചെയ്യുന്നവർ
  rationale: τὰ ἱερά എന്നതിലെ ‘വിശുദ്ധകാര്യങ്ങൾ’ എന്ന ആശയവും ഇവിടെ ഉദ്ദേശിക്കുന്ന ദേവാലയസേവനത്തിന്റെ പശ്ചാത്തലവും ഒരുമിച്ചു വ്യക്തമാക്കുന്നു.
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: ദേവാലയത്തിൽനിന്നുള്ളവ ഭക്ഷിക്കുന്നു
  rationale: ദേവാലയസേവകർക്ക് അവിടെനിന്നു ഭക്ഷണവിഹിതം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ‘ഭക്ഷിക്കുന്നു’ എന്ന ദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു.
- source_word: ἱεροῦ
  choice: ദേവാലയം
  rationale: ἱερόν സാധാരണയായി അകത്തെ വിശുദ്ധമന്ദിരം മാത്രമല്ല, ദേവാലയസമുച്ചയത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ദേവാലയം’ അതിന് വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദമാണ്.
- source_word: παρεδρεύοντες
  choice: അരികിൽ സേവനം ചെയ്യുന്നവർ
  rationale: യാഗപീഠത്തിനരികിൽ നിയോഗിക്കപ്പെട്ട് ശുശ്രൂഷ നിർവഹിക്കുന്നതെന്ന പങ്കാളിത്തത്തിന്റെ അർത്ഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: θυσιαστηρίῳ
  choice: യാഗപീഠം
  rationale: ബലിയർപ്പിക്കുന്ന പീഠത്തിനുള്ള കൃത്യവും നിലവാരമുള്ളതുമായ മലയാളപരിഭാഷയാണ്.
- source_word: συμμερίζονται
  choice: അർപ്പിക്കുന്നവയിൽ പങ്കു ലഭിക്കുന്നു
  rationale: കൂടെ ഒരു വിഹിതം കൈപ്പറ്റുക എന്ന ക്രിയയുടെ സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു; യാഗപീഠം തന്നെയാണ് പങ്കാളി എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുമ്പോഴും കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശുദ്ധശുശ്രൂഷയിൽനിന്നുള്ള ഉപജീവനത്തെക്കുറിച്ചുള്ള യാഗാരാധനാ ദൃശ്യഭാഷ
  choice: ദേവാലയത്തിലും യാഗപീഠത്തിനരികിലും സേവിക്കുന്നവർക്ക് ആ ശുശ്രൂഷയുമായി ബന്ധപ്പെട്ട ഭക്ഷണവിഹിതം ലഭിക്കുന്നു എന്ന താരതമ്യം നിലനിർത്തി.
  alternative: അവസാനഭാഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘യാഗപീഠവുമായി പങ്കിടുന്നു’ എന്നു നൽകാം.
  rationale: വിശുദ്ധശുശ്രൂഷ ചെയ്യുന്നവർക്ക് അതിൽനിന്നു ഉപജീവനം ലഭിക്കുന്നു എന്ന പൗലൊസിന്റെ വാദക്രമം വ്യക്തമാക്കുന്നു; അതേസമയം പിൽക്കാല സഭാഘടനകളെയോ പ്രത്യേക സഭാപാരമ്പര്യങ്ങളെയോ വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വിശുദ്ധശുശ്രൂഷകൾ’, ‘ദേവാലയം’, ‘യാഗപീഠം’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ആരാധനാപശ്ചാത്തലത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നതുമാണ്.
