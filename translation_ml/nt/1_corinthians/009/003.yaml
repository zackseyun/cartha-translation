  text: Ἡ ἐμὴ ἀπολογία τοῖς ἐμὲ ἀνακρίνουσίν ⸂ἐστιν αὕτη⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/003.yaml
  text: This is my defense to those who examine me[a].
translation:
  language: ml
  text: എന്നെ പരിശോധിക്കുന്നവരോടുള്ള എന്റെ പ്രതിവാദം ഇതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘എന്നെ വിധിക്കുന്നവരുടെ മുമ്പാകെയുള്ള എന്റെ പ്രതിവാദം ഇതാണ്.’'
    reason: ἀνακρίνω എന്ന പദത്തിന് സന്ദർഭത്തിൽ ‘പരിശോധിക്കുക’ എന്നും ‘വിധിക്കുക’ എന്നും അർഥസാധ്യതയുണ്ട്; ദത്തിവ് ‘-വരോട്’ എന്നോ ‘-വരുടെ മുമ്പാകെ’ എന്നോ അവതരിപ്പിക്കാം.
lexical_decisions:
- source_word: ἀπολογία
  choice: പ്രതിവാദം
  rationale: പൗലോസ് തന്റെ അപ്പൊസ്തലിക അധികാരത്തെയും പ്രവർത്തനരീതിയെയും ചോദ്യം ചെയ്യുന്നവർക്ക് നൽകുന്ന ന്യായീകരണപരമായ മറുപടിയെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്. ‘പ്രതിവാദം’ ഔപചാരികമായ മറുപടിയുടെ ഭാവം നിലനിർത്തുന്നു; ഖേദപ്രകടനം എന്ന തെറ്റായ അർഥം വരുത്തുന്നില്ല.
- source_word: ἀνακρίνουσίν
  choice: പരിശോധിക്കുന്നവരോട്
  rationale: പൗലോസിനെ വിമർശനാത്മകമായി പരിശോധിക്കുകയോ വിലയിരുത്തുകയോ ചെയ്യുന്നവരെയാണ് വർത്തമാനകാല കൃദന്തം സൂചിപ്പിക്കുന്നത്. ‘പരിശോധിക്കുക’ അന്തിമമായ ന്യായവിധി എന്ന ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കാതെ ഈ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: Ἡ ἐμὴ
  choice: എന്റെ
  rationale: ഉടമസ്ഥത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; സന്ദർഭം ആവശ്യപ്പെടാത്ത അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: എന്നെ പരിശോധിക്കുന്നവരോട്
  rationale: ദത്തിവ് ഇവിടെ പ്രതിവാദം ആരോടാണ് ഉന്നയിക്കുന്നത് എന്നതിനെ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു. മലയാളത്തിൽ ‘-വരോട്’ സ്വാഭാവികവും മൂലഘടനയോട് വിശ്വസ്തവുമാണ്.
- source_word: ἐστιν αὕτη
  choice: ഇതാണ്
  rationale: ഗ്രീക്കിലെ തിരിച്ചറിയൽപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ഇത് ആകുന്നു’ എന്ന കൃത്രിമരൂപം ഒഴിവാക്കുന്നു.
