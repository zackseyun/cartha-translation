translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരമായ സൂചന നിലനിർത്തുന്നുവെങ്കിലും അത്യന്തം സാങ്കേതികമായ ഭാഷ ഒഴിവാക്കി.
