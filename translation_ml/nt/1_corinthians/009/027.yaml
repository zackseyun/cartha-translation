  to: എന്നാൽ ഞാൻ എന്റെ ശരീരത്തെ കർശനമായി നിയന്ത്രിക്കുകയും[a] അതിനെ അടിമയാക്കുകയും ചെയ്യുന്നു[b], മറ്റുള്ളവരോടു പ്രസംഗിച്ചശേഷം ഞാൻതന്നെ എങ്ങനെയെങ്കിലും അയോഗ്യനായി[c] തീർന്നുപോകാതിരിക്കാൻ.
