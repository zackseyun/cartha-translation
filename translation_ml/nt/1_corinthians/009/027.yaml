id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ എന്റെ ശരീരത്തെ കർശനമായി നിയന്ത്രിക്കുകയും[a] അതിനെ അടിമയാക്കുകയും ചെയ്യുന്നു[b], മറ്റുള്ളവരോടു പ്രസംഗിച്ചശേഷം ഞാൻതന്നെ എങ്ങനെയെങ്കിലും അയോഗ്യനായി[c] തീർന്നുപോകാതിരിക്കാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ശരീരത്തെ പ്രഹരിച്ചടക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ അക്ഷരാർഥത്തിൽ കണ്ണിനടിയിൽ ഇടിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഇവിടെ അത് കഠിനമായ ആത്മശിക്ഷണത്തിന്റെ രൂപകമായി ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അതിനെ അടിമത്തത്തിലാക്കുന്നു’ അല്ലെങ്കിൽ ‘അതിനെ അടിമയായി കീഴ്പ്പെടുത്തുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അംഗീകരിക്കപ്പെടാത്തവനായി,’ ‘തള്ളപ്പെട്ടവനായി,’ അല്ലെങ്കിൽ ‘പരീക്ഷയിൽ പരാജയപ്പെട്ടവനായി.’ സമീപസന്ദർഭത്തിലെ കായികരൂപകത്തോട് ‘അയോഗ്യൻ’ നന്നായി യോജിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: കഠിനമായി ശിക്ഷണപ്പെടുത്തുന്നു
  rationale: കണ്ണിനടിയിൽ ഇടിക്കുക എന്ന അക്ഷരാർഥമുള്ള ശക്തമായ ക്രിയ ഇവിടെ കായികപരിശീലനത്തിന്റെ പശ്ചാത്തലത്തിൽ കഠിനമായ ആത്മനിയന്ത്രണത്തെ രൂപകമായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വയം പരിക്കേൽപ്പിക്കൽ എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കിക്കൊണ്ട് രൂപകത്തിന്റെ കാഠിന്യം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: σῶμα
  choice: ശരീരം
  rationale: പൗലോസ് ശരീരത്തെ തന്നെയാണ് ശിക്ഷണത്തിന്റെ കർമമായി പറയുന്നത്; അതിനാൽ ‘സ്വയം’ എന്ന് പൊതുവത്കരിക്കാതെ മൂർത്തമായ പദം നിലനിർത്തുന്നു.
- source_word: δουλαγωγῶ
  choice: അടിമയാക്കുന്നു
  rationale: അടിമത്തത്തിലാക്കുക എന്ന ശക്തമായ രൂപകം മയപ്പെടുത്താതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: μή πως
  choice: തീരാതിരിക്കേണ്ടതിനാണ്
  rationale: ഭയപ്പെടുന്ന ഒരു പ്രതികൂല ഫലം ഒഴിവാക്കാനുള്ള ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘എങ്ങനെയെങ്കിലും’ എന്ന സൂക്ഷ്മഭാവം വാക്യത്തിലെ മുന്നറിയിപ്പിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: ἄλλοις
  choice: മറ്റുള്ളവരോടു
  rationale: പ്രഖ്യാപനത്തിന്റെ സ്വീകർത്താക്കളെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κηρύξας
  choice: പ്രസംഗിച്ചശേഷം
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന എയോറിസ്റ്റ് കൃദന്തത്തിന്റെ കാലബന്ധം വ്യക്തമായി നൽകുന്നു; κηρύσσωയുടെ പരസ്യപ്രഖ്യാപനഭാവവും നിലനിർത്തുന്നു.
- source_word: ἀδόκιμος
  choice: അയോഗ്യനായി
  rationale: പരീക്ഷയിൽ അംഗീകാരം ലഭിക്കാത്തതും കായികമത്സരത്തിൽ യോഗ്യത നഷ്ടപ്പെടുന്നതുമായ അർഥസാധ്യതകൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക പദമാണിത്; രക്ഷയോ പ്രതിഫലമോ സംബന്ധിച്ച പ്രത്യേക വ്യാഖ്യാനം നിർബന്ധിക്കുന്നില്ല.
- source_word: γένωμαι
  choice: തീരുക
  rationale: ഭാവിയിൽ സംഭവിച്ചേക്കാമെന്ന് ഭയപ്പെടുന്ന ഫലത്തിന്റെ prospective ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികവും മാന്യവുമായ ഭാഷയിൽ അടയാളപ്പെടുത്തുന്നു.
theological_decisions:
- issue: പൗലോസ് ἀδόκιμος ആകുമെന്നു ഭയപ്പെടുന്നതിന്റെ അർഥം
  choice: കായികമത്സരത്തിന്റെയും പരിശോധനയുടെയും പശ്ചാത്തലത്തിൽ ‘അയോഗ്യനായി തീരുക’ എന്നു പരിഭാഷപ്പെടുത്തി, മുന്നറിയിപ്പിന്റെ ഗൗരവം നിലനിർത്തുന്നു.
  alternative: അന്തിമരക്ഷയിൽ ദൈവത്താൽ തള്ളപ്പെടുക; അല്ലെങ്കിൽ ശുശ്രൂഷയ്ക്കോ പ്രതിഫലത്തിനോ മാത്രം അയോഗ്യനാകുക.
  rationale: ഗ്രീക്ക് പദവും സമീപസന്ദർഭവും ഈ വ്യാഖ്യാനങ്ങളിൽ ഒന്ന് മാത്രമെന്ന് തീർപ്പാക്കുന്നില്ല. അതിനാൽ പരിഭാഷ യഥാർഥ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കായികരൂപകത്തിന്റെ ശക്തിയും അടിമത്തഭാഷയുടെ കാഠിന്യവും നിലനിർത്തിയിട്ടുണ്ട്; എന്നാൽ അനാവശ്യമായി സ്വയംപീഡനത്തെ സൂചിപ്പിക്കാതിരിക്കാൻ മുഖ്യവാചകത്തിൽ വ്യാഖ്യാനാത്മകമായ ‘കഠിനമായി ശിക്ഷണപ്പെടുത്തുന്നു’ ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങൾക്ക് പിന്നാലെ ചേർത്തിട്ടുണ്ട്.
