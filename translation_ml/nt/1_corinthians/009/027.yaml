  verdict: revise
  source_fidelity: 'മുഖ്യവാചകം പൊതുവേ ഗ്രീക്കിനോട് വിശ്വസ്തമാണ്: σῶμα ‘ശരീരം’ എന്നും δουλαγωγῶയുടെ ശക്തമായ അടിമത്തരൂപകവും നിലനിർത്തുന്നു. എന്നാൽ μή πωςയിലെ ‘എങ്ങനെയെങ്കിലും’ എന്ന സൂക്ഷ്മമായ ആശങ്ക നിലവിലെ വാചകത്തിൽ വ്യക്തമല്ല; അത് ചേർക്കണം. ‘അയോഗ്യനായി’ എന്ന പദത്തിലാണ് ἀδόκιμος സംബന്ധിച്ച അടിക്കുറിപ്പ് ചിഹ്നം വരേണ്ടത്.'
  naturalness: ‘കഠിനമായി ശിക്ഷണപ്പെടുത്തുന്നു’ എന്ന പ്രയോഗം ആധുനിക നിലവാരമലയാളത്തിൽ അല്പം കൃത്രിമമാണ്. ‘കർശനമായി നിയന്ത്രിക്കുന്നു’ സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് മൂലക്രിയയുടെ അതിശക്തമായ പ്രഹാരരൂപകം വ്യക്തമാക്കുന്നു.
  terminology: ‘ശരീരം,’ ‘അടിമയാക്കുന്നു,’ ‘പ്രസംഗിച്ചശേഷം,’ ‘അയോഗ്യനായി’ എന്നിവ യോജിച്ച തിരഞ്ഞെടുപ്പുകളാണ്. ‘അയോഗ്യനായി’ കായികസന്ദർഭത്തിലെ disqualification-ഉം പരിശോധനയിൽ അംഗീകാരം ലഭിക്കാത്ത അവസ്ഥയും തുറന്നുവയ്ക്കുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം നിർബന്ധിക്കുന്നില്ല.
