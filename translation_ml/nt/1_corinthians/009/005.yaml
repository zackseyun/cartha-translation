id: 1CO.9.5
reference: 1 Corinthians 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: ml
  text: മറ്റു അപ്പൊസ്തലന്മാരും കർത്താവിന്റെ സഹോദരന്മാരും കേഫാവും ചെയ്യുന്നതുപോലെ, ഒരു വിശ്വാസിനിയായ ഭാര്യയെ[a] കൂടെ കൊണ്ടുപോകാൻ ഞങ്ങൾക്കും അവകാശമില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഒരു സഹോദരിയെ, ഭാര്യയെ”—അതായത്, സഹവിശ്വാസിനിയായ ഭാര്യയെ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: അവകാശം
  rationale: ഇവിടെ പൗലോസ് പൊതുവായ അധികാരത്തെയല്ല, അപ്പൊസ്തലന്മാർക്കുള്ള ന്യായമായ അവകാശത്തെയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἀδελφὴν γυναῖκα
  choice: വിശ്വാസസഹോദരിയായ ഒരു ഭാര്യ
  rationale: രണ്ട് നാമങ്ങളും ചേർന്ന ഈ പ്രയോഗം വിശ്വാസസമൂഹത്തിലെ സഹോദരിയായ ഭാര്യയെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ തെറ്റിദ്ധാരണ ഒഴിവാക്കിക്കൊണ്ട് രണ്ട് ആശയങ്ങളും നിലനിർത്തുന്നു; പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: περιάγειν
  choice: കൂടെ കൊണ്ടുപോകാൻ
  rationale: ശുശ്രൂഷായാത്രകളിൽ ഒരാളെ ഒപ്പം കൊണ്ടുപോകുക എന്ന സന്ദർഭോചിതമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὡς καὶ
  choice: ചെയ്യുന്നതുപോലെ
  rationale: പൗലോസും ബർന്നബാസും അവകാശപ്പെടുന്ന കാര്യത്തിന് സമാന്തരമായ ഉദാഹരണങ്ങളെ സ്വാഭാവികമായി പരിചയപ്പെടുത്തുന്നു.
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: മറ്റുള്ള അപ്പൊസ്തലന്മാർ
  rationale: λοιποί സൂചിപ്പിക്കുന്ന, അതേ കൂട്ടത്തിൽ ശേഷിക്കുന്നവരെന്ന അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: കർത്താവിന്റെ സഹോദരന്മാർ
  rationale: ഗ്രീക്ക് പ്രയോഗം നേരിട്ട് നിലനിർത്തുകയും അവരുടെ കൃത്യമായ കുടുംബബന്ധത്തെക്കുറിച്ചുള്ള പിൽക്കാല വ്യാഖ്യാനങ്ങൾ പരിഭാഷയിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: Κηφᾶς
  choice: കേഫാ
  rationale: മൂലപാഠത്തിലുള്ള പേരിന്റെ രൂപം നിലനിർത്തുന്നു; പത്രോസ് എന്ന് പകരംവയ്ക്കുന്നില്ല.
theological_decisions:
- issue: ‘കർത്താവിന്റെ സഹോദരന്മാർ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ബന്ധത്തിന്റെ സ്വഭാവം വിശദീകരിക്കാതെ ‘കർത്താവിന്റെ സഹോദരന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തുക
  alternative: യേശുവിന്റെ ജൈവസഹോദരന്മാർ, അർധസഹോദരന്മാർ, അല്ലെങ്കിൽ അടുത്ത ബന്ധുക്കൾ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് പ്രയോഗം ഇവരിൽ ഏത് വ്യാഖ്യാനമാണ് ശരിയെന്ന് സ്വതവേ തീർപ്പാക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ തർക്കം പരിഭാഷയിലൂടെ പരിഹരിക്കുന്നില്ല.
- issue: ἀδελφὴν γυναῖκα എന്നതിന്റെ അർഥം
  choice: വിശ്വാസസഹോദരിയായ ഒരു ഭാര്യ
  alternative: ഒരു സഹോദരിയെ ഭാര്യയായി; ഒരു സ്ത്രീവിശ്വാസിനിയെ
  rationale: സന്ദർഭത്തിൽ ഇത് വെറും സ്ത്രീസഹയാത്രികയെയല്ല, വിശ്വാസസമൂഹത്തിൽപ്പെട്ട ഭാര്യയെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്. അസാധാരണമായ പദഘടന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ചോദ്യരൂപം പ്രതീക്ഷിക്കുന്ന അനുകൂല ഉത്തരത്തിന്റെ ഭാവത്തോടെ നിലനിർത്തി; ബന്ധപരവും ദൈവശാസ്ത്രപരവുമായ അനിശ്ചിതത്വങ്ങൾ അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല.
