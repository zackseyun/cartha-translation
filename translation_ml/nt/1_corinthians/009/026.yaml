  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ τοίνυν οὕτως τρέχω ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/026.yaml
  text: 'So then[a], I run in this way: not aimlessly; in this way I box: not beating the air.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ ഇപ്രകാരം ഓടുന്നു: ലക്ഷ്യമില്ലാതെയല്ല[a]; ഇപ്രകാരം ഞാൻ മുഷ്ടിയുദ്ധം ചെയ്യുന്നു: വായുവിനെ അടിക്കുന്നതുപോലെയല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അനിശ്ചിതമായി.” ഗ്രീക്ക് ക്രിയാവിശേഷണം വ്യക്തതയില്ലായ്മയെയോ നിശ്ചിത ലക്ഷ്യമില്ലായ്മയെയോ സൂചിപ്പിക്കാം; ഓട്ടത്തിന്റെ രൂപകത്തിൽ “ലക്ഷ്യമില്ലാതെ” എന്നത് ഉദ്ദേശ്യം കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: അതുകൊണ്ട്
  rationale: മുമ്പുള്ള കായികോപമയിൽനിന്ന് പൗലോസിന്റെ വ്യക്തിപരമായ പ്രയോഗത്തിലേക്കുള്ള നിഗമനപരമായ മാറ്റം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὕτως
  choice: ഓടുന്നത് … ചെയ്യുന്നതും
  rationale: ഗ്രീക്കിൽ ആവർത്തിക്കുന്ന പദം പ്രവർത്തനരീതിക്ക് ഊന്നൽ നൽകുന്നു. മലയാളത്തിൽ അതേ ഘടന പദശഃ ആവർത്തിക്കുന്നത് അസ്വാഭാവികമായതിനാൽ സമാന്തര വാക്യഘടനയിലൂടെ ആ ഊന്നൽ നിലനിർത്തി.
- source_word: τρέχω
  choice: ഞാൻ ഓടുന്നത്
  rationale: മുൻസന്ദർഭത്തിലെ ഓട്ടമത്സരത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; വർത്തമാനകാലത്തിലുള്ള വ്യക്തിപരമായ പ്രവർത്തനവും പ്രകടമാക്കുന്നു.
- source_word: ἀδήλως
  choice: ലക്ഷ്യമില്ലാതെ
  rationale: വ്യക്തതയോ നിശ്ചിത ലക്ഷ്യമോ ഇല്ലാത്ത വിധം എന്ന അർഥപരിധിയിൽ, ഓട്ടത്തിന്റെ രൂപകത്തിന് ഏറ്റവും സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്.
- source_word: πυκτεύω
  choice: ഞാൻ മുഷ്ടിയുദ്ധം ചെയ്യുന്നതും
  rationale: പദം പൊതുവായ പോരാട്ടമല്ല, പ്രത്യേകിച്ച് മുഷ്ടിയുദ്ധത്തെയാണ് സൂചിപ്പിക്കുന്നത്; കായികരൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀέρα δέρων
  choice: വായുവിൽ വെറുതെ ഇടിക്കുന്നവനെപ്പോലെ
  rationale: ലക്ഷ്യത്തിൽ കൊള്ളാത്ത, ഫലമില്ലാത്ത പ്രഹരത്തിന്റെ ദൃശ്യം സ്വാഭാവിക മലയാളത്തിൽ പകർന്നു; ὡς എന്ന താരതമ്യഘടനയും വ്യക്തമാക്കി.
