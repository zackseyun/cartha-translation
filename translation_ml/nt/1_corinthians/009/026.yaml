translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം കായികരൂപകങ്ങൾ വ്യക്തമായി നിലനിർത്തി. ശൈലി ഗൗരവമുള്ളതും സ്വാഭാവികവുമാണ്; ഗ്രീക്കിലെ സമാന്തരത മലയാളവാക്യഘടനയിലൂടെ സംരക്ഷിച്ചു.
