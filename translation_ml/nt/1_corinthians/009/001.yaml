id: 1CO.9.1
reference: 1 Corinthians 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: ml
  text: ഞാൻ സ്വതന്ത്രനല്ലയോ? ഞാൻ അപ്പൊസ്തലനല്ലയോ? നമ്മുടെ കർത്താവായ യേശുവിനെ ഞാൻ കണ്ടിട്ടില്ലയോ? കർത്താവിൽ നിങ്ങൾ എന്റെ പ്രവൃത്തിയല്ലയോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: സ്വതന്ത്രൻ
  rationale: ഇവിടെ പൗലോസ് തന്റെ സ്വാതന്ത്ര്യവും അതോടു ബന്ധപ്പെട്ട അവകാശങ്ങളും ഉറപ്പിക്കുന്നു. മുൻസന്ദർഭവുമായുള്ള ബന്ധവും ഗ്രീക്കിന്റെ നേരിട്ടുള്ള അർത്ഥവും ‘സ്വതന്ത്രൻ’ നിലനിർത്തുന്നു.
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: ഇവിടെ ഒരു സാധാരണ ദൂതനെയല്ല, പൗലോസിന്റെ അംഗീകൃത അപ്പൊസ്തലിക സ്ഥാനത്തെയാണ് സൂചിപ്പിക്കുന്നത്; അതിനാൽ സാങ്കേതികമായ പുതിയനിയമ പദം നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: നമ്മുടെ കർത്താവായ യേശു
  rationale: κύριος എന്ന ക്രിസ്തുസംബന്ധിയായ സ്ഥാനപ്പേര് ‘കർത്താവ്’ എന്നു പരിഭാഷപ്പെടുത്തി. മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പദക്രമത്തിനായി ‘നമ്മുടെ കർത്താവായ യേശു’ എന്നു നൽകി.
- source_word: ἑόρακα
  choice: കണ്ടിട്ടില്ലയോ
  rationale: ഗ്രീക്ക് perfect രൂപം മുൻകാലത്തെ ദർശനത്തിനും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന പ്രസക്തിക്കും ഇടം നൽകുന്നു. മലയാളത്തിലെ സന്ദർഭസഹജമായ ഭൂതകാലരൂപം ആ അവകാശവാദം ലളിതമായി അറിയിക്കുന്നു; ‘ഉയിർത്തെഴുന്നേറ്റ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- source_word: ἔργον
  choice: പ്രവൃത്തി
  rationale: കൊരിന്ത്യർ പൗലോസിന്റെ അപ്പൊസ്തലിക അധ്വാനത്തിന്റെ ഫലമാണെന്ന ആശയം ‘പ്രവൃത്തി’ നേരിട്ട് നിലനിർത്തുന്നു; ‘ഫലം’ എന്നു നൽകി രൂപകം വ്യാഖ്യാനിച്ചുതീർക്കുന്നില്ല.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ സവിശേഷമായ പ്രയോഗത്തിന്റെ ബന്ധപരവും മേഖലാസൂചകവുമായ തുറന്ന അർത്ഥം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὐκ / οὐχὶ / οὐ
  choice: അല്ലയോ? / കണ്ടിട്ടില്ലയോ?
  rationale: ഉവ്വെന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്ന നാല് നിഷേധാത്മക ആലങ്കാരിക ചോദ്യങ്ങളായി ഗ്രീക്ക് ഘടനയും വാദത്തിന്റെ ഊന്നലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യേശുവിനെ കണ്ടുവെന്ന പൗലോസിന്റെ അവകാശവാദത്തിന്റെ സൂചന
  choice: അപ്പൊസ്തലിക സ്ഥാനത്തെ പിന്തുണയ്ക്കുന്ന അവകാശവാദമായി, എന്നാൽ ‘ഉയിർത്തെഴുന്നേറ്റ’ എന്നു മുഖ്യപാഠത്തിൽ ചേർക്കാതെ പരിഭാഷപ്പെടുത്തി
  alternative: ‘ഉയിർത്തെഴുന്നേറ്റ നമ്മുടെ കർത്താവായ യേശുവിനെ’ എന്നു അർത്ഥം വ്യക്തമാക്കി പരിഭാഷപ്പെടുത്തുക
  rationale: സന്ദർഭത്തിൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ കണ്ടതാണ് ഉദ്ദേശ്യമെന്നത് ശക്തമായി സൂചിപ്പിക്കപ്പെടുന്നു; എങ്കിലും ഗ്രീക്കിൽ ‘ഉയിർത്തെഴുന്നേറ്റ’ എന്ന പദമില്ല. അതിനാൽ വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. തുടർച്ചയായ നാല് ആലങ്കാരിക ചോദ്യങ്ങളുടെ ആവർത്തനവും ശക്തിയും നിലനിർത്തി. സഭാപരമായ സാങ്കേതിക പദമായി ‘അപ്പൊസ്തലൻ’ ഉപയോഗിച്ചു.
