base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: ml
  text: ബലഹീനർക്കു ഞാൻ ബലഹീനനായിത്തീർന്നു[a]—ബലഹീനരെ നേടേണ്ടതിന്. എല്ലാവർക്കും ഞാൻ എല്ലാമായിത്തീർന്നിരിക്കുന്നു; എല്ലാവിധത്തിലും[b] ചിലരെ രക്ഷിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മനസ്സാക്ഷിയിൽ ബലഹീനരായവർക്കു ഞാൻ ബലഹീനനായിത്തീർന്നു’; 1 കൊരിന്ത്യരിൽ ഈ പ്രയോഗം പ്രത്യേകിച്ച് എളുപ്പത്തിൽ ബാധിക്കപ്പെടുന്ന മനസ്സാക്ഷിയുള്ളവരെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സാധ്യമായ എല്ലാ മാർഗങ്ങളിലൂടെയും’; ലക്ഷ്യം നേടാൻ കഴിയുന്ന എല്ലാ മാർഗങ്ങളും ഉപയോഗിക്കുക എന്നതാണ് പ്രയോഗത്തിന്റെ ആശയം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: ഞാൻ ... ആയിത്തീർന്നു
  rationale: ആവശ്യത്തിനനുസരിച്ച് ഒരു നിലപാട് സ്വീകരിച്ച പൗലോസിന്റെ കഴിഞ്ഞകാല ശുശ്രൂഷാപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് എയോറിസ്റ്റിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: ബലഹീനർക്കു / ബലഹീനൻ / ബലഹീനരെ
  rationale: മൂലത്തിലെ ആവർത്തനത്തിന്റെ വാഗ്മിത്വബലം നിലനിർത്തുന്നു; മനസ്സാക്ഷിയിൽ ബലഹീനരെന്ന പ്രത്യേക അർഥം സാദ്ധ്യമെങ്കിലും മുഖ്യപാഠം അത്രയ്ക്ക് ചുരുക്കുന്നില്ല.
- source_word: κερδήσω
  choice: നേടേണ്ടതിന്
  rationale: സുവിശേഷപ്രവർത്തനത്തിന്റെ പശ്ചാത്തലത്തിൽ ആളുകളെ അനുകൂലമായി നേടുക എന്ന അർഥം നൽകുന്നു; മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: τοῖς πᾶσιν
  choice: എല്ലാവർക്കും
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തിയിലുള്ള സംക്ഷിപ്ത പ്രയോഗം വ്യക്തികളുമായുള്ള പൗലോസിന്റെ ബന്ധമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: γέγονα
  choice: ഞാൻ ... ആയിത്തീർന്നിരിക്കുന്നു
  rationale: കഴിഞ്ഞ പ്രവൃത്തിയുടെ ഫലമായി തുടരുന്ന നിലയെ സൂചിപ്പിക്കുന്ന പെർഫെക്റ്റ് കാലത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: πάντα
  choice: എല്ലാമായി
  rationale: ‘എല്ലാവർക്കും എല്ലാം’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തിയും വാഗ്മിത്വപരമായ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: πάντως
  choice: എല്ലാവിധത്തിലും
  rationale: ലക്ഷ്യം നേടാൻ സാധ്യമായ എല്ലാ മാർഗങ്ങളും ഉപയോഗിക്കുക എന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; അനീതിയായ ഒത്തുതീർപ്പ് സൂചിപ്പിക്കുന്നില്ല.
- source_word: τινὰς
  choice: ചിലരെയെങ്കിലും
  rationale: എല്ലാവരെയും രക്ഷിക്കുമെന്ന് അവകാശപ്പെടാതെ ‘ചിലർ’ എന്ന അനിശ്ചിതവും വിനീതവുമായ പരിധി നിലനിർത്തുന്നു; ‘എങ്കിലും’ മലയാളത്തിൽ ലക്ഷ്യത്തിന്റെ നിയന്ത്രിത പ്രതീക്ഷ സ്വാഭാവികമാക്കുന്നു.
- source_word: σώσω
  choice: രക്ഷിക്കേണ്ടതിന്
  rationale: സന്ദർഭത്തിലെ യഥാർഥ രക്ഷാഭാഷ നിലനിർത്തുന്നു; പൗലോസ് ആത്യന്തിക രക്ഷകനാണെന്ന വ്യാഖ്യാനം സ്വതവേ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘ബലഹീനർ’ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: മുഖ്യപാഠത്തിൽ വിശാലമായി ‘ബലഹീനർ’ എന്നു നൽകി.
  alternative: മനസ്സാക്ഷിയിൽ ബലഹീനർ; ശക്തിയില്ലാത്തവർ
  rationale: 1 കൊരിന്ത്യർ 8–10 അധ്യായങ്ങളിൽ മനസ്സാക്ഷിയുടെ ദൗർബല്യം പ്രധാനമാണെങ്കിലും, ഈ വാക്യത്തിലെ പദം വിശാലവും ചുറ്റുമുള്ള വിഭാഗങ്ങളോട് സമാന്തരവുമാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ അർഥം അനാവശ്യമായി ചുരുക്കിയില്ല.
- issue: ‘രക്ഷിക്കുക’ എന്ന ക്രിയയുടെ പ്രാബല്യം
  choice: പൗലോസിന്റെ സുവിശേഷലക്ഷ്യമായി ‘രക്ഷിക്കേണ്ടതിന്’ എന്നു നൽകി.
  alternative: രക്ഷയിലേക്കു നേടേണ്ടതിന്; രക്ഷിക്കപ്പെടാൻ സഹായിക്കേണ്ടതിന്
  rationale: σώσω യഥാർഥ രക്ഷാഭാഷയാണ്; അതിനെ ദുർബലപ്പെടുത്താതെ, പൗലോസ് ആത്യന്തിക രക്ഷകനാണെന്ന സിദ്ധാന്തപരമായ വിശദീകരണം പാഠത്തിൽ ചേർക്കാതെയും വിവർത്തനം ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘ബലഹീന’ എന്ന പദത്തിന്റെ മൂന്നുതവണത്തെ ആവർത്തനവും ‘എല്ലാവർക്കും ... എല്ലാം’ എന്ന വാഗ്മിത്വസമാന്തരതയും പരമാവധി സംരക്ഷിച്ചു. [a], [b] അടയാളങ്ങൾ മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
