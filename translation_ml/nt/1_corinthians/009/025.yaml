source:
  edition: SBLGNT
  text: πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα φθαρτὸν στέφανον λάβωσιν, ἡμεῖς δὲ ἄφθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: ml
  text: മത്സരിക്കുന്ന ഏവരും എല്ലാ കാര്യങ്ങളിലും ആത്മനിയന്ത്രണം പാലിക്കുന്നു. അവർ നശിച്ചുപോകുന്ന ഒരു കിരീടം[a] നേടുന്നതിനുവേണ്ടി അങ്ങനെ ചെയ്യുന്നു; നമ്മളോ നശിക്കാത്ത ഒന്ന് നേടുന്നതിനുവേണ്ടി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിജയമാല’; ഗ്രീക്ക് പദം കായികമത്സരങ്ങളിൽ വിജയിക്കു സമ്മാനമായി നൽകപ്പെട്ടിരുന്ന മാലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ഏവരും
  rationale: പങ്കെടുക്കുന്ന ഓരോ വ്യക്തിയെയും ഉൾക്കൊള്ളുന്ന ഗ്രീക്ക് ഏകവചനത്തിന്റെ പ്രതിനിധാനാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀγωνιζόμενος
  choice: മത്സരത്തിൽ പങ്കെടുക്കുന്ന
  rationale: സമീപസന്ദർഭത്തിലെ കായികമത്സരരൂപകം നിലനിർത്തുകയും പൊതുവായ ‘ശ്രമിക്കുന്ന’ എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: πάντα
  choice: എല്ലാ കാര്യങ്ങളിലും
  rationale: നിയന്ത്രണത്തിന്റെ വ്യാപ്തി ഭക്ഷണത്തിലോ പരിശീലനത്തിലോ മാത്രം പരിമിതപ്പെടുത്താതെ ഗ്രീക്കിലെ scope വ്യക്തമാക്കുന്നു.
- source_word: ἐγκρατεύεται
  choice: ആത്മനിയന്ത്രണം പാലിക്കുന്നു
  rationale: പതിവായി സ്വയം നിയന്ത്രിക്കുന്ന പ്രവൃത്തിയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐκεῖνοι μὲν οὖν
  choice: അവർ ... അങ്ങനെ ചെയ്യുന്നത്
  rationale: മുമ്പ് പറഞ്ഞ മത്സരാർത്ഥികളിലേക്കു തിരിച്ചുചൂണ്ടുകയും ἡμεῖς δέയുമായുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἵνα ... λάβωσιν
  choice: നേടാനാണ്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയും സമ്മാനം ലഭിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന λάβωσινഉം സ്വാഭാവികമായി ഒരുമിച്ചു നൽകുന്നു.
- source_word: φθαρτὸν
  choice: നശിച്ചുപോകുന്ന
  rationale: ἄφθαρτον എന്ന വിപരീതപദവുമായി നേരിട്ടുള്ളതും വായനാസൗകര്യമുള്ളതുമായ പദജോടി സൃഷ്ടിക്കുന്നു.
- source_word: στέφανον
  choice: കിരീടം
  rationale: ബഹുമതിയുടെയും പ്രതിഫലത്തിന്റെയും രൂപകം നിലനിർത്തുന്നു; കായികമത്സരത്തിലെ വിജയമാല എന്ന പ്രത്യേക അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡμεῖς δὲ ἄφθαρτον
  choice: നമ്മളോ നശിച്ചുപോകാത്ത ഒന്ന് നേടാൻ
  rationale: ഗ്രീക്കിൽ ആവർത്തിക്കാത്ത ‘കിരീടം’ എന്ന നാമം ‘ഒന്ന്’കൊണ്ട് സൂചിപ്പിച്ച് വൈരുധ്യവും ഉദ്ദേശ്യക്രിയയുടെ സ്വാഭാവികമായ പൂരകവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിഫലരൂപകത്തിന്റെ സ്വഭാവം
  choice: ‘കിരീടം’ എന്ന കായികസമ്മാനരൂപകം നിലനിർത്തി, അത് എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നു വാക്യത്തിനപ്പുറം നിർവചിക്കാതിരിക്കുന്നു.
  alternative: നിത്യജീവൻ എന്നോ സ്വർഗീയ പ്രതിഫലങ്ങൾ എന്നോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഈ വാക്യം പ്രതിഫലത്തിന്റെ ദൈവശാസ്ത്രപരമായ പരാമർശം കൃത്യമായി നിർവചിക്കുന്നില്ല; അതിനാൽ രൂപകം നിലനിർത്തുന്നത് പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യുന്നത് ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. കായികമത്സരരൂപകവും നശിക്കുന്നതു/നശിക്കാത്തതു എന്ന മൂലപാഠത്തിലെ സമാന്തരവൈരുധ്യവും സംരക്ഷിച്ചു; ഗ്രീക്കിൽ ഇല്ലാത്ത ഒരു ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല.
