id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: ml
  text: കാരണം, ഞാൻ സുവിശേഷം പ്രസംഗിക്കുന്നുവെങ്കിൽ[a], എനിക്കു പുകഴ്ചയ്ക്കു കാരണമില്ല; ഒരു നിർബന്ധം എന്റെമേൽ ചുമത്തപ്പെട്ടിരിക്കുന്നു. കാരണം, ഞാൻ സുവിശേഷം പ്രസംഗിക്കാതിരുന്നാൽ എനിക്കു അയ്യോ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സദ്വാർത്ത അറിയിക്കുന്നുവെങ്കിൽ’; ഈ വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങൾക്കും ഇത് ബാധകം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘ഞാൻ സുവിശേഷം പ്രസംഗിക്കാതിരുന്നാൽ എനിക്കു അനർത്ഥം!’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: സുവിശേഷം പ്രസംഗിക്കുന്നുവെങ്കിൽ / സുവിശേഷം പ്രസംഗിക്കാതിരുന്നാൽ
  rationale: ഈ ക്രിയ സദ്വാർത്ത പ്രഖ്യാപിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഇവിടെ അതിന്റെ വിഷയം സന്ദർഭത്തിൽ സുവിശേഷമാണെന്ന് വ്യക്തമായതിനാൽ, മലയാള ക്രൈസ്തവ ഭാഷയിൽ സ്വാഭാവികവും പ്രഖ്യാപനത്തിന്റെ ശക്തി നിലനിർത്തുന്നതുമായ ‘സുവിശേഷം പ്രസംഗിക്കുക’ തിരഞ്ഞെടുത്തു; രണ്ടിടത്തും ഒരേ പദപ്രയോഗം നിലനിർത്തി.
- source_word: καύχημα
  choice: അഭിമാനിക്കാൻ വക
  rationale: സ്വയം പ്രശംസിക്കുന്ന പ്രവൃത്തി മാത്രമല്ല, അതിനുള്ള അടിസ്ഥാനമോ കാരണമോ ഇല്ലെന്നാണ് പൗലോസ് പറയുന്നത്. ‘അഭിമാനിക്കാൻ വകയില്ല’ ഈ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνάγκη
  choice: നിർബന്ധം
  rationale: പൗലോസിന്മേൽ വന്നിരിക്കുന്ന അനിവാര്യമായ ബാധ്യതയെയോ സമ്മർദത്തെയോ ഈ പദം സൂചിപ്പിക്കുന്നു. അതിന്റെ ഉറവിടം ഈ വാക്യത്തിൽ വ്യക്തമാക്കാതെ ‘നിർബന്ധം’ ആ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ἐπίκειται
  choice: എന്റെമേൽ ചുമത്തപ്പെട്ടിരിക്കുന്നു
  rationale: ഒരാളുടെമേൽ എന്തോ വയ്ക്കപ്പെട്ടതോ ബാധ്യതയായി വന്നതോ എന്ന ശക്തി ഈ പ്രയോഗം നൽകുന്നു. പൗലോസിന്റെ ബാധ്യതാബോധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ഈ രൂപം ഉപയോഗിച്ചു.
- source_word: οὐαί
  choice: അയ്യോ കഷ്ടം
  rationale: വെറും ദുഃഖപ്രകടനത്തേക്കാൾ ഗുരുതരമായ ദുരവസ്ഥയെയോ വരാനിരിക്കുന്ന അനർത്ഥത്തെയോ സൂചിപ്പിക്കുന്ന ഗൗരവമുള്ള ഉദ്ഗാരമാണിത്. ‘അയ്യോ കഷ്ടം’ ആ ശക്തി സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἐὰν μὴ
  choice: പ്രസംഗിക്കാതിരുന്നാൽ
  rationale: നിഷേധാത്മക വ്യവസ്ഥ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: വാക്യത്തിലെ വിശദീകരണബന്ധം വ്യക്തമായി സൂചിപ്പിക്കുന്നു. അവസാനത്തെ γάρ മലയാളത്തിലെ വാക്യക്രമത്തിൽ പ്രത്യേകം ആവർത്തിക്കാതെ, മുൻവാചകവും തുടർന്നുള്ള മുന്നറിയിപ്പും തമ്മിലുള്ള കാരണബന്ധം സമഗ്രമായി നിലനിർത്തി.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രസംഗബാധ്യതയുടെ സ്വഭാവം
  choice: അതിന്റെ ഉറവിടം നിർവചിക്കാതെ, തന്റെമേൽ ചുമത്തപ്പെട്ട നിർബന്ധമായി വിവർത്തനം ചെയ്തു.
  alternative: ‘ദൈവം ഈ ദൗത്യം എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു’ എന്ന വ്യാഖ്യാനാത്മക രൂപം; അല്ലെങ്കിൽ ‘ഒരു നിർബന്ധം എന്നെ അമർത്തുന്നു’ എന്ന കൂടുതൽ ശക്തമായ രൂപം.
  rationale: ഈ വാക്യം പൗലോസിന്മേൽ നിർബന്ധമുണ്ടെന്ന് പറയുന്നു; എന്നാൽ അത് ദൈവിക നിയോഗമോ ആന്തരിക പ്രേരണയോ ബാഹ്യ സാഹചര്യങ്ങളോ എന്ന് ഇവിടെ നേരിട്ട് വ്യക്തമാക്കുന്നില്ല. അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
- issue: οὐαί എന്ന ഉദ്ഗാരത്തിന്റെ ശക്തി
  choice: ‘എനിക്ക് അയ്യോ കഷ്ടം!’ എന്ന ഗൗരവമുള്ള മുന്നറിയിപ്പായി നൽകി.
  alternative: ‘എനിക്ക് ഹാ കഷ്ടം!’ അല്ലെങ്കിൽ ‘എനിക്ക് അനർത്ഥം!’
  rationale: പ്രവാചകശൈലിയിലെ ഗൗരവവും വ്യക്തിപരമായ ദുരവസ്ഥയും നിലനിർത്തിക്കൊണ്ട്, ആധുനിക മലയാളത്തിൽ മനസ്സിലാകുന്ന രൂപം തിരഞ്ഞെടുത്തു; വിധിയുടെ കൃത്യസ്വഭാവം കൂട്ടിച്ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘സുവിശേഷം പ്രസംഗിക്കുക’ എന്ന പരിചിത പ്രയോഗം നിലനിർത്തിയെങ്കിലും, അതിന്റെ സാധാരണ അർത്ഥമായ ‘സദ്വാർത്ത അറിയിക്കുക’ അടിക്കുറിപ്പിൽ നൽകി. വാക്യത്തിന്റെ ശക്തിക്കായി അവസാനഭാഗം ഉദ്ഗാരമായി രൂപപ്പെടുത്തി.
