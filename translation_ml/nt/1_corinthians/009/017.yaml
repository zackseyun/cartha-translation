revisions:
- from: കാരണം, ഞാൻ ഇതു സ്വമനസ്സോടെ ചെയ്യുന്നെങ്കിൽ എനിക്കു പ്രതിഫലമുണ്ട്; എന്നാൽ മനസ്സില്ലാതെയാണെങ്കിൽ, ഒരു കാര്യനിർവഹണച്ചുമതല എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു.[a]
  to: കാരണം, ഞാൻ ഇതു സ്വമേധയാ ചെയ്യുന്നെങ്കിൽ എനിക്കു പ്രതിഫലമുണ്ട്; എന്നാൽ മനസ്സില്ലാമനസ്സോടെയാണെങ്കിൽ, കാര്യനിർവഹണത്തിന്റെ ഒരു ഉത്തരവാദിത്വം എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു.[a]
