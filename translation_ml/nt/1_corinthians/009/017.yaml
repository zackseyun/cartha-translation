id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: ml
  text: കാരണം, ഞാൻ ഇതു സ്വമേധയാ ചെയ്യുന്നെങ്കിൽ എനിക്കു പ്രതിഫലമുണ്ട്; എന്നാൽ മനസ്സില്ലാമനസ്സോടെയാണെങ്കിൽ, കാര്യനിർവഹണത്തിന്റെ ഒരു ഉത്തരവാദിത്വം എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു നിയോഗം എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു.”
    reason: οἰκονομία എന്ന പദം ഇവിടെ ഏൽപ്പിക്കപ്പെട്ട നിയോഗം എന്ന അർഥത്തിലും മനസ്സിലാക്കാം. പ്രധാനപാഠം ഏൽപ്പിക്കപ്പെട്ട കാര്യനിർവഹണത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് പ്രസക്തമായ മറ്റൊരു അർഥസാധ്യത നൽകുന്നു.
lexical_decisions:
- source_word: ἑκὼν
  choice: സ്വമനസ്സോടെ
  rationale: പ്രവൃത്തി സ്വന്തം മനസ്സോടെ, സ്വമേധയാ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു; ἄκων എന്ന വിപരീതപദത്തോടുള്ള വ്യത്യാസവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοῦτο πράσσω
  choice: ഞാൻ ഇതു ... ചെയ്യുന്നെങ്കിൽ
  rationale: സന്ദർഭത്തിൽ പറഞ്ഞുവരുന്ന ശുശ്രൂഷാപ്രവർത്തനത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെ ഗ്രീക്കിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: μισθὸν
  choice: പ്രതിഫലം
  rationale: കൂലി എന്ന പരിമിതമായ അർഥത്തിൽ ഒതുക്കാതെ, സേവനത്തിനു ലഭിക്കുന്ന പ്രതിഫലം അഥവാ പാരിതോഷികം എന്ന വിശാല അർഥം നൽകുന്നു.
- source_word: ἄκων
  choice: മനസ്സില്ലാതെ
  rationale: ἑκὼν എന്നതിന്റെ നേരിട്ടുള്ള വിപരീതം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ‘മടിയോടെ’ എന്നതുപോലുള്ള അധിക വികാരാർഥം ചേർക്കുന്നില്ല.
- source_word: οἰκονομίαν
  choice: ഒരു കാര്യനിർവഹണച്ചുമതല
  rationale: ഏൽപ്പിക്കപ്പെട്ട ഒരു ഉത്തരവാദിത്വത്തിന്റെ നടത്തിപ്പാണ് പദം സൂചിപ്പിക്കുന്നത്. പഴയതോ സാങ്കേതികമോ ആയ ‘കാര്യവിചാരകത്വം’ ഒഴിവാക്കി ആ ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: πεπίστευμαι
  choice: എന്നെ ഏൽപ്പിച്ചിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിപ്രയോഗത്തിലെ, മുൻപ് ഏൽപ്പിക്കപ്പെട്ടതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഉത്തരവാദിത്വം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: രണ്ടാം ഉപവാക്യത്തിൽ പൗലോസിന്റെ ശുശ്രൂഷയുടെ സ്വഭാവം
  choice: സ്വമനസ്സോടെയല്ലെങ്കിലും തനിക്കു ഏൽപ്പിക്കപ്പെട്ട കാര്യനിർവഹണച്ചുമതല നിലനിൽക്കുന്നുവെന്ന് പൗലോസ് പറയുന്നു.
  alternative: മനസ്സില്ലാതെ പ്രവർത്തിച്ചാൽ പ്രതിഫലത്തിനു പകരം വെറും കടമ മാത്രമേയുള്ളൂ എന്നോ, സ്വമേധയായ സേവനത്തെയും നിർബന്ധിത ഔദ്യോഗികസ്ഥാനത്തെയും തമ്മിൽ മാത്രം വേർതിരിക്കുന്നു എന്നോ വായിക്കാം.
  rationale: μισθὸν ἔχω എന്നതും οἰκονομίαν πεπίστευμαι എന്നതും തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തുന്നു. പ്രതിഫലവും ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വവും തമ്മിലുള്ള വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘സ്വമനസ്സോടെ/മനസ്സില്ലാതെ’ എന്ന സമാന്തരപ്രയോഗം ഗ്രീക്കിലെ ἑκὼν/ἄκων വൈരുധ്യം വ്യക്തമാക്കുന്നു. അടിക്കുറിപ്പിന്റെ വിഷയം οἰκονομία ആയതിനാൽ സൂചിക അതിനോടു ബന്ധപ്പെട്ട ഉപവാക്യത്തിനു ശേഷം വെച്ചിരിക്കുന്നു.
