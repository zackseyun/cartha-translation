id: 1CO.9.2
reference: 1 Corinthians 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: ml
  text: മറ്റുള്ളവർക്ക് ഞാൻ അപ്പൊസ്തലനല്ലെങ്കിൽ പോലും, നിങ്ങൾക്ക് ഞാൻ തീർച്ചയായും അപ്പൊസ്തലനാണ്; കാരണം, കർത്താവിൽ എന്റെ അപ്പൊസ്തലത്വത്തിന്റെ മുദ്ര[a] നിങ്ങളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തെളിവ്” അല്ലെങ്കിൽ “ആധികാരികതയുടെ സ്ഥിരീകരണം.” ഗ്രീക്കിൽ “മുദ്ര” എന്നാണ്; ഒന്നിന്റെ ആധികാരികത ഉറപ്പാക്കുന്ന മുദ്രയുടെ രൂപകം ഇതിൽ നിലനിൽക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: അപ്പൊസ്തലൻ
  rationale: പൗലോസ് സ്വയം പരാമർശിക്കുന്ന ഈ സന്ദർഭത്തിൽ, പൊതുവായ ‘ദൂതൻ’ എന്നതിലുപരി ദൈവിക നിയോഗവും അംഗീകൃത ശുശ്രൂഷാപദവിയും സൂചിപ്പിക്കുന്ന സാങ്കേതിക അർഥം നിലനിർത്തുന്നു.
- source_word: ἀλλά γε
  choice: എങ്കിലും ... തീർച്ചയായും
  rationale: ἀλλάയുടെ വൈരുധ്യവും γε നൽകുന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: σφραγίς
  choice: മുദ്ര
  rationale: ആധികാരികത സ്ഥിരീകരിക്കുന്ന മുദ്രയുടെ ഗ്രീക്ക് രൂപകം അതേപടി നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് തെളിവ് അഥവാ സാധൂകരണം എന്ന ആശയവും വഹിക്കുന്നു.
- source_word: ἀποστολή
  choice: അപ്പൊസ്തലത്വം
  rationale: പൗലോസിന്റെ അപ്പൊസ്തലനായുള്ള നിയോഗവും പദവിയും സൂചിപ്പിക്കുന്നു; ‘ദൗത്യം’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിലെ സാങ്കേതിക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ സവിശേഷ പ്രയോഗം അക്ഷരാർഥത്തിന് അടുത്തായി സംരക്ഷിക്കുകയും, കൊരിന്ത്യരുടെ അസ്തിത്വം കർത്താവുമായുള്ള ബന്ധത്തിനുള്ളിൽ സ്ഥിതിചെയ്യുന്നു എന്ന ആശയം തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: ἄλλοις
  choice: മറ്റുള്ളവർക്ക്
  rationale: ദാതൃവിഭക്തിയുടെ ബന്ധസൂചന മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; മറ്റുള്ളവരുടെ വിലയിരുത്തലാണോ അവരോടുള്ള ശുശ്രൂഷാബന്ധമാണോ എന്ന സന്ദർഭപരമായ തുറന്നത്വം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തെക്കുറിച്ചുള്ള അവകാശവാദത്തിന്റെ വ്യാപ്തി
  choice: മറ്റുള്ളവരോടുള്ള ബന്ധത്തിൽ തന്റെ അപ്പൊസ്തലത്വം നിഷേധിക്കപ്പെട്ടാലും, കൊരിന്ത്യർ തന്റെ അപ്പൊസ്തലത്വത്തിന്റെ സാക്ഷ്യവും സ്ഥിരീകരണവുമാണെന്ന് പൗലോസ് ഊന്നിപ്പറയുന്നു.
  alternative: താൻ മറ്റാർക്കും അപ്പൊസ്തലനല്ലെന്നും കൊരിന്ത്യർക്കു മാത്രം പരിമിതമായ അർഥത്തിൽ അപ്പൊസ്തലനാണെന്നും പൗലോസ് പറയുന്നു.
  rationale: നിബന്ധനാവാക്യവും തുടർന്നുള്ള കാരണവാക്യവും പ്രതിരോധാത്മകവും വാചാലവുമായ വാദമാണ്; കൊരിന്ത്യസഭയുടെ നിലനിൽപ്പ് പൗലോസിന്റെ അപ്പൊസ്തലത്വത്തെ സാധൂകരിക്കുന്നു. വാക്യം അദ്ദേഹത്തിന്റെ അപ്പൊസ്തലത്വം ആ സഭയിലേക്ക് മാത്രം പരിമിതപ്പെടുത്തേണ്ടതില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൊസ്തലൻ,’ ‘അപ്പൊസ്തലത്വം,’ ‘കർത്താവിൽ’ എന്നീ സഭാപരിചിത പദങ്ങൾ മൂലത്തിലെ സാങ്കേതികവും പൗലോസീയവുമായ പ്രയോഗങ്ങൾ സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു. വാക്യക്രമം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
