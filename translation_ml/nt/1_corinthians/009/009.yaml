id: 1CO.9.9
reference: 1 Corinthians 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: ml
  text: 'മോശയുടെ ന്യായപ്രമാണത്തിൽ ഇങ്ങനെ എഴുതിയിരിക്കുന്നുവല്ലോ: “മെതിച്ചുകൊണ്ടിരിക്കുന്ന കാളയുടെ വായ് കെട്ടരുത്.”[a] കാളകളെക്കുറിച്ചാണോ ദൈവം കരുതുന്നത്?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ധാന്യം ചവിട്ടിമെതിച്ചുകൊണ്ടിരിക്കുന്ന കാളയുടെ വായ് കെട്ടരുത്.”
    reason: ἀλοῶντα എന്ന പദത്തിന്റെ സന്ദർഭോചിതമായ കൂടുതൽ വ്യക്തമായ വിവർത്തനം; ആവർത്തനനിയമത്തിലെ ധാന്യം ചവിട്ടിമെതിക്കുന്ന പശ്ചാത്തലം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: മോശയുടെ ന്യായപ്രമാണത്തിൽ
  rationale: ἐν എന്നതിന്റെ സ്ഥാനസൂചക അർഥവും Μωϋσέως എന്ന ജനിറ്റീവ് ബന്ധവും നിലനിർത്തുന്നു. ‘ന്യായപ്രമാണം’ എന്നത് ഈ തിരുവെഴുത്തുസന്ദർഭത്തിൽ νόμος എന്ന പദത്തിന് സ്വാഭാവികവും പരിചിതവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: γέγραπται
  choice: ഇങ്ങനെ എഴുതിയിരിക്കുന്നുവല്ലോ
  rationale: പെർഫെക്റ്റ് പാസീവ് രൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം ‘എഴുതിയിരിക്കുന്നു’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം ‘വല്ലോ’ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: Οὐ κημώσεις
  choice: വായ് കെട്ടരുത്
  rationale: κημόω എന്നത് മൃഗം ഭക്ഷിക്കാതിരിക്കാൻ അതിന്റെ വായിൽ നിയന്ത്രണം ഇടുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘വായ് കെട്ടുക’ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന തരത്തിലും നിരോധനാർഥം നൽകുന്നു.
- source_word: βοῦν
  choice: കാളയെ
  rationale: ധാന്യം മെതിക്കുന്ന തൊഴിൽമൃഗത്തെ സൂചിപ്പിക്കുന്ന ഏകവചനരൂപത്തിന് ‘കാള’ കൃത്യവും സ്വാഭാവികവുമാണ്.
- source_word: ἀλοῶντα
  choice: മെതിച്ചുകൊണ്ടിരിക്കുന്ന
  rationale: വർത്തമാന കൃദന്തരൂപത്തിലെ തുടരുന്ന പ്രവൃത്തി നിലനിർത്തുന്നു. മൂലപദത്തിൽ ‘ധാന്യം’ പ്രത്യക്ഷമായി ഇല്ലാത്തതിനാൽ പ്രധാനപാഠത്തിൽ അത് ചേർത്തിട്ടില്ല.
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: കാളകളെക്കുറിച്ചാണോ ദൈവം കരുതുന്നത്?
  rationale: μή സൂചിപ്പിക്കുന്ന നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യം ചോദ്യമായിത്തന്നെ നിലനിർത്തുന്നു. ‘മാത്രം’ പോലുള്ള വ്യാഖ്യാനപരമായ പദം ചേർക്കാതെ μέλει എന്നതിന്റെ കരുതൽ/താത്പര്യ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: മൃഗങ്ങളെക്കുറിച്ചുള്ള ദൈവത്തിന്റെ കരുതലിനെപ്പറ്റിയുള്ള പൗലോസിന്റെ വാചാടോപചോദ്യം
  choice: ‘കാളകളെക്കുറിച്ചാണോ ദൈവം കരുതുന്നത്?’ എന്ന് നേരിട്ടുള്ള ചോദ്യമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കാളകളെക്കുറിച്ചു മാത്രമാണോ ദൈവം കരുതുന്നത്?’ അല്ലെങ്കിൽ ‘ദൈവം കാളകളെക്കുറിച്ച് കരുതുന്നില്ലല്ലോ, അല്ലേ?’
  rationale: ഗ്രീക്കിൽ ‘മാത്രം’ എന്ന പദമില്ല; അതു ചേർത്താൽ ചോദ്യത്തിന്റെ വ്യാഖ്യാനം മുൻകൂട്ടി നിശ്ചയിക്കും. അതേസമയം വ്യക്തമായ നിഷേധവാക്യമാക്കുന്നത് മൃഗങ്ങളോടുള്ള ദൈവിക കരുതലിനെ പൗലോസ് പൂർണമായി നിഷേധിക്കുന്നുവെന്ന ധാരണ ശക്തിപ്പെടുത്താം. അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഔപചാരികത നിലനിർത്തിക്കൊണ്ട് ദുഷ്കരമായ നിയമഭാഷ ഒഴിവാക്കി. അടിക്കുറിപ്പുചിഹ്നം അതുമായി ബന്ധപ്പെട്ട ‘മെതിക്കൽ’ പ്രയോഗത്തിനുശേഷം ചേർത്തിരിക്കുന്നു.
