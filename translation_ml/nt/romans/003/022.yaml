id: ROM.3.22
reference: Romans 3:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: ml
  text: യേശു മശീഹയിലുള്ള വിശ്വാസത്തിലൂടെ[b] വിശ്വസിക്കുന്ന എല്ലാവർക്കുമുള്ള ദൈവത്തിന്റെ നീതി[a]—എന്തെന്നാൽ, യാതൊരു വ്യത്യാസവുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ ന്യായം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യേശു മശീഹയുടെ വിശ്വസ്തതയിലൂടെ.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: ദൈവത്തിന്റെ നീതിയുള്ള സ്വഭാവം, നീതിപൂർവമായ പ്രവർത്തനം, ദൈവം നൽകുന്ന നീതിയുള്ള നില എന്നീ പൗലോസിന്റെ ആശയവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്കിലെ സംബന്ധികാവിഭക്തിയെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: πίστις എന്ന പദത്തിന്റെ സാധാരണ അർഥമായ വിശ്വാസം മുഖ്യപാഠത്തിൽ നൽകുന്നു; വിശ്വസ്തത എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായതിനാൽ മലയാളത്തിൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: വിശ്വസിക്കുന്ന എല്ലാവർക്കുമുള്ള
  rationale: ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും വർത്തമാനകർത്തൃവാചകത്തിന്റെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διαστολή
  choice: വ്യത്യാസം
  rationale: ഈ സന്ദർഭത്തിൽ ആളുകൾക്കിടയിൽ വേർതിരിവില്ലെന്ന ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലുള്ള വിശ്വാസം
  alternative: യേശു മശീഹയുടെ വിശ്വസ്തത
  rationale: സംബന്ധികാവിഭക്തി ലക്ഷ്യസംബന്ധിയായോ കർത്തൃസംബന്ധിയായോ ഗ്രഹിക്കാവുന്നതാണ്. കൂടുതൽ സാധാരണമായ ആദ്യവായന മുഖ്യപാഠത്തിലും യഥാർഥമായ മറ്റുസാധ്യത അടിക്കുറിപ്പിലും നിലനിർത്തുന്നു.
- issue: δικαιοσύνη θεοῦ
  choice: ദൈവത്തിന്റെ നീതി
  alternative: ദൈവത്തിന്റെ നീതിന്യായം
  rationale: ‘നീതി’ ദൈവത്തിന്റെ സ്വഭാവം, പ്രവർത്തനം, അവൻ നൽകുന്ന നില എന്നിവയെ മുൻകൂട്ടി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; ന്യായവിധി/നീതിന്യായം എന്ന ഊന്നൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും പൊതുവായ വായനയ്ക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യത്തിൽനിന്ന് വ്യാകരണപരമായി തുടരുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ‘തന്നെയാണിത്’ ഉപയോഗിച്ചു; പുതിയ ദൈവശാസ്ത്രവിവരം ചേർത്തിട്ടില്ല. അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
