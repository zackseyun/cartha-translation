  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: ml
  text: ദൈവം ഏകനായതിനാൽ[a], അവിടുന്ന് പരിച്ഛേദന ഏറ്റവരെ[b] വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിലും പരിച്ഛേദന ഏൽക്കാത്തവരെ വിശ്വാസത്തിലൂടെയും[c] നീതീകരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവം ഏകനാണെങ്കിൽത്തന്നെ.”
    reason: alternative_reading
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥമായി “പരിച്ഛേദനം” എന്നും “അപരിച്ഛേദനം” എന്നും ഉള്ള പദങ്ങൾ യഥാക്രമം പരിച്ഛേദന ഏറ്റവരെയും ഏൽക്കാത്തവരെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: പൗലോസ് ഇവിടെ “വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ” എന്നും “വിശ്വാസത്തിലൂടെ” എന്നും രണ്ടു വ്യത്യസ്ത പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു. ഇത് വ്യക്തമായൊരു ആശയവ്യത്യാസത്തേക്കാൾ ശൈലീപരമായ വ്യത്യാസമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: ആയതിനാൽ
  rationale: ഇവിടെ പൗലോസ് അനിശ്ചിതമായ ഒരു വ്യവസ്ഥ മുന്നോട്ടുവയ്ക്കുന്നതിനെക്കാൾ, എല്ലാവരും അംഗീകരിക്കുന്ന ഏകദൈവവിശ്വാസത്തിൽനിന്ന് ഒരു നിഗമനം ഉന്നയിക്കുകയാണ്. അതിനാൽ കാരണസൂചകമായ ഈ പ്രയോഗം സന്ദർഭത്തിന് സ്വാഭാവികമാണ്; വ്യവസ്ഥാസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἷς ὁ θεός
  choice: ദൈവം ഏകൻ
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള ഏകദൈവപ്രസ്താവന സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαιώσει
  choice: നീതീകരിക്കും
  rationale: δικαιόω എന്ന പൗലോസിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ പ്രയോഗത്തിന് യോജിച്ച സാങ്കേതികപദമാണിത്; ഭാവികാലവും നിലനിർത്തുന്നു.
- source_word: περιτομήν
  choice: പരിച്ഛേദന ഏറ്റവരെ
  rationale: മൂലത്തിലെ ‘പരിച്ഛേദനം’ എന്ന അമൂർത്തനാമം പരിച്ഛേദിതരായ ആളുകളെ സൂചിപ്പിക്കുന്ന ലക്ഷണാലങ്കാരമാണ്. ‘യഹൂദർ’ എന്നു വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്താതെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ
  rationale: ἐκ എന്ന വ്യത്യസ്ത പൂർവപ്രത്യയം സൂചിപ്പിക്കുന്ന അടിസ്ഥാനം മലയാളത്തിൽ വ്യക്തമായി നൽകുകയും തുടർന്നുള്ള διά പ്രയോഗത്തിൽനിന്നുള്ള രൂപവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀκροβυστίαν
  choice: പരിച്ഛേദന ഏൽക്കാത്തവരെ
  rationale: മൂലത്തിലെ ‘അഗ്രചർമം/അപരിച്ഛേദനം’ എന്ന അമൂർത്തനാമം ആളുകളെ സൂചിപ്പിക്കുന്നു. സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ വ്യക്തിവാചക രൂപം സ്വീകരിക്കുന്നു; ‘ജാതികൾ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: διὰ τῆς πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά എന്ന പൂർവപ്രത്യയത്തിന്റെ മാധ്യമസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും ἐκ πίστεως എന്ന മുൻപ്രയോഗവുമായി മൂലത്തിലുള്ള വ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ πίστις എന്നതിന് സാധാരണയും പ്രസക്തവുമായ തുല്യപദം ‘വിശ്വാസം’ ആണ്; ‘വിശ്വസ്തത’ എന്ന് മാറ്റേണ്ട നിർബന്ധിത ഘടന ഇവിടെ ഇല്ല.
theological_decisions:
- issue: ἐκ πίστεως, διὰ τῆς πίστεως എന്നീ പ്രയോഗങ്ങൾക്കിടയിൽ പൗലോസ് ദൈവശാസ്ത്രപരമായ വ്യത്യാസം ഉദ്ദേശിക്കുന്നുണ്ടോ
  choice: ‘വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ’, ‘വിശ്വാസത്തിലൂടെ’ എന്നിങ്ങനെ പൂർവപ്രത്യയവ്യത്യാസം നിലനിർത്തുന്നു; എന്നാൽ അതിനെ പ്രത്യേകമായ ഒരു സിദ്ധാന്തവ്യത്യാസമായി പ്രഖ്യാപിക്കുന്നില്ല.
  alternative: രണ്ടിനെയും ‘വിശ്വാസത്താൽ’ എന്നു പരിഭാഷപ്പെടുത്തി ശൈലീപരമായ സമാനപ്രയോഗങ്ങളായി കാണാം; അല്ലെങ്കിൽ അടിസ്ഥാനം, മാധ്യമം എന്നീ സൂക്ഷ്മ വ്യത്യാസം ശക്തമായി വായിക്കാം.
  rationale: ഗ്രീക്ക് രണ്ടു വ്യത്യസ്ത പൂർവപ്രത്യയങ്ങൾ ഉപയോഗിക്കുന്നതിനാൽ അവയുടെ വ്യത്യാസം വായനക്കാരന് കാണാൻ കഴിയണം. എന്നാൽ സന്ദർഭം ആ വ്യത്യാസത്തെ നിർബന്ധമായും ദൈവശാസ്ത്രപരമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘പരിച്ഛേദിതർ/അപരിച്ഛേദിതർ’ എന്ന സാങ്കേതികരൂപങ്ങൾക്കുപകരം സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘പരിച്ഛേദന ഏറ്റവർ/ഏൽക്കാത്തവർ’ ഉപയോഗിച്ചു. പൗലോസിന്റെ δικαιόω പദസംബന്ധം നിലനിർത്താൻ ‘നീതീകരിക്കും’ സൂക്ഷിച്ചു.
