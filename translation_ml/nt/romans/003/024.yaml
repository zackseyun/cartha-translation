id: ROM.3.24
reference: Romans 3:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: ml
  text: അവന്റെ കൃപയാൽ സൗജന്യമായി, മശീഹാ യേശുവിലുള്ള[b] വീണ്ടെടുപ്പിലൂടെ നീതീകരിക്കപ്പെടുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: പരമ്പരാഗതമായി, ‘ക്രിസ്തുയേശുവിലുള്ള.’
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιούμενοι
  choice: നീതീകരിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപം മുൻവാക്യത്തിലെ ‘എല്ലാവരും’ എന്ന ആശയത്തോട് ചേർന്നു നിൽക്കുന്നു. ‘നീതീകരിക്കപ്പെടുന്നു’ പൗലോസിന്റെ നിയമപരമായ പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും അർത്ഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: δωρεὰν
  choice: സൗജന്യമായി
  rationale: പ്രതിഫലമോ അർഹതയോ കൊണ്ടല്ല, ദാനമായി ലഭിക്കുന്നു എന്ന അർത്ഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῇ αὐτοῦ χάριτι
  choice: അവന്റെ കൃപയാൽ
  rationale: ദൈവത്തിന്റെ അർഹിക്കാത്ത അനുഗ്രഹവും പ്രവർത്തനവും സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ സ്ഥാപിത ദൈവശാസ്ത്രപദമായി χάρις എന്നത് ‘കൃപ’യായി നൽകുന്നു.
- source_word: ἀπολυτρώσεως
  choice: വീണ്ടെടുപ്പ്
  rationale: വിലകൊടുത്തുള്ള മോചനത്തിന്റെ സൂചന നിലനിർത്തുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും ഗ്രഹിക്കാവുന്നതുമായ പദം.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിലുള്ള
  rationale: ἐν എന്ന ബന്ധവും വീണ്ടെടുപ്പ് യേശുവിൽ സ്ഥിതിചെയ്യുന്നു എന്ന ഗ്രീക്ക് ഘടനയും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; Χριστός ഇവിടെ പദവിയായി ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ നീതീകരണഭാഷ
  choice: പ്രധാനപാഠത്തിൽ ‘നീതീകരിക്കപ്പെടുന്നു’ നിലനിർത്തി.
  alternative: ‘നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടുന്നു’
  rationale: δικαιόω എന്ന പദത്തിന്റെ നിയമപരമായ ശക്തി നിലനിർത്തിക്കൊണ്ട് അതിന്റെ അർത്ഥം ഒരു വിശദീകരണത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാനാണ് സംക്ഷിപ്തമായ സാങ്കേതികപദം ഉപയോഗിച്ചത്; വിശദീകരണപരമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- issue: Χριστός എന്ന പദവിയുടെ പരിഭാഷ
  choice: ‘മശീഹാ യേശു’
  alternative: ‘ക്രിസ്തുയേശു’
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന അർത്ഥം വഹിക്കുന്നു. പരമ്പരാഗത രൂപം വായനക്കാർക്കായി അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ പങ്കാളിത്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായ പരിധിയിൽ മുൻവാക്യത്തിന്റെ തുടർച്ചയായി നിലനിർത്തിയിരിക്കുന്നു; വാക്യഘടകങ്ങളുടെ ക്രമം അർത്ഥബന്ധം വ്യക്തമാക്കാൻ ക്രമീകരിച്ചു.
