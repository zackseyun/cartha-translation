id: ROM.3.5
reference: Romans 3:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: ml
  text: എന്നാൽ നമ്മുടെ അനീതി ദൈവത്തിന്റെ നീതിയെ തെളിയിക്കുന്നുവെങ്കിൽ[a], നാം എന്തു പറയും? ക്രോധം വരുത്തുന്ന ദൈവം അനീതിയുള്ളവനാണോ? (ഞാൻ മാനുഷികമായ രീതിയിൽ സംസാരിക്കുകയാണ്.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “നമ്മുടെ നീതികേട് ദൈവത്തിന്റെ നീതിനിഷ്ഠയെ തെളിയിക്കുന്നുവെങ്കിൽ.”
    reason: ἀδικία, δικαιοσύνη എന്നീ പദങ്ങൾക്ക് യഥാക്രമം അനീതി/നീതികേട്, നീതി/നീതിനിഷ്ഠ എന്നീ ബന്ധപ്പെട്ട അർഥങ്ങൾ ഇവിടെ സാധ്യമാണ്.
lexical_decisions:
- source_word: ἀδικία
  choice: അനീതി
  rationale: ദൈവത്തിന്റെ δικαιοσύνηയോടുള്ള നൈതികവും നീതിന്യായപരവുമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘നീതികേട്’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: ഇവിടെ ദൈവത്തിന്റെ നീതിയുള്ള സ്വഭാവവും ന്യായവിധിയിലെ നീതിയും ഒരുമിച്ച് സൂചിപ്പിക്കാവുന്ന സ്വാഭാവിക പദമാണ്; ഗ്രീക്കിലെ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: συνίστησιν
  choice: തെളിയിക്കുന്നു
  rationale: മനുഷ്യരുടെ അനീതി ദൈവത്തിന്റെ നീതിയെ പ്രകടമാക്കുകയോ വ്യക്തമായി കാണിക്കുകയോ ചെയ്യുന്നു എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: μὴ ἄδικος
  choice: ദൈവം അനീതിയുള്ളവനാണോ?
  rationale: μή പ്രതീക്ഷിക്കുന്ന നിഷേധാത്മക ഉത്തരം മലയാളത്തിൽ അധികമായൊരു നിഷേധവാചകം ചേർക്കാതെ സ്വാഭാവികമായ അലങ്കാരചോദ്യമായി നിലനിർത്തുന്നു.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: ക്രോധം വരുത്തുന്ന
  rationale: ἐπιφέρω എന്നതിന്റെ ‘മേൽ വരുത്തുക/കൊണ്ടുവരുക’ എന്ന ന്യായവിധിസംബന്ധിയായ ബലം നിലനിർത്തുന്നു; ‘ശിക്ഷിക്കുന്നു’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: ഞാൻ മാനുഷികമായ രീതിയിൽ സംസാരിക്കുകയാണ്
  rationale: ഇത് പൗലോസ് മനുഷ്യരുടെ വാദരീതിയിൽ സംസാരിക്കുന്നുവെന്ന വിശദീകരണമാണെന്ന് വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ന്യായവിധിയെക്കുറിച്ചുള്ള പൗലോസിന്റെ അലങ്കാരചോദ്യം
  choice: “ക്രോധം വരുത്തുന്ന ദൈവം അനീതിയുള്ളവനാണോ?” എന്ന നേരിട്ടുള്ള ചോദ്യം
  alternative: “ക്രോധം വരുത്തുന്നതിൽ ദൈവം അനീതിയുള്ളവനല്ലല്ലോ?”
  rationale: ഗ്രീക്കിലെ μή ചോദ്യം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നുവെങ്കിലും, മൂലപാഠത്തിലെ ചോദ്യം തന്നെയുള്ള ദൈവനീതിയെക്കുറിച്ചുള്ള സംഘർഷം നിലനിർത്തുകയും അധികമായ ഉറപ്പിക്കൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: നീതി
  alternative: നീതിനിഷ്ഠ
  rationale: ഈ സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ശരിയായ സ്വഭാവവും ന്യായവിധിയിലെ നീതിയും തമ്മിലുള്ള അർഥതീവ്രത തുറന്നുവെക്കുന്നു; ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ അർഥത്തിലേക്ക് പദത്തെ പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചോദ്യം മൂലപാഠത്തിന്റെ അലങ്കാരസ്വഭാവവും ദൈവനീതിയെക്കുറിച്ചുള്ള തീവ്രതയും നിലനിർത്തുന്നു; കോഷ്ഠകവാക്യം പൗലോസിന്റെ വിശദീകരണമായി സൂക്ഷിച്ചിരിക്കുന്നു.
