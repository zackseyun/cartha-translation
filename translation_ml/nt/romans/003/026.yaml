id: ROM.3.26
reference: Romans 3:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: ml
  text: ദൈവത്തിന്റെ സഹിഷ്ണുതയിൽ, ഇപ്പോഴത്തെ കാലത്ത് തന്റെ നീതി പ്രകടമാക്കേണ്ടതിന്—താൻ നീതിമാനും യേശുവിൽ വിശ്വസിക്കുന്നവനെ[b] നീതീകരിക്കുന്നവനും[c] ആയിരിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘യേശുവിന്റെ വിശ്വസ്തതയിൽനിന്നുള്ളവനെ.’
    reason: πίστεως Ἰησοῦ എന്ന വിവാദമായ ജനിറ്റീവ് ഘടനയുടെ subjective-genitive വായന സംരക്ഷിക്കുന്നു.
  - marker: c
    text: അഥവാ, ‘നീതിമാനെന്ന് പ്രഖ്യാപിക്കുന്നവൻ.’
    reason: δικαιόω എന്ന ക്രിയയുടെ ന്യായപരമായ പ്രഖ്യാപനസൂക്ഷ്മത വ്യക്തമാക്കുന്ന സാധുവായ പദവികൽപം നൽകുന്നു.
lexical_decisions:
- source_word: ἀνοχῇ
  choice: ശിക്ഷ നടപ്പാക്കാതെ സഹിച്ചുനിന്നതിലൂടെ
  rationale: ദൈവം ഉടൻ ന്യായവിധി നടപ്പാക്കാതെ മനഃപൂർവം പിടിച്ചുനിന്നുവെന്ന ἀνοχήയുടെ സന്ദർഭോചിതമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἔνδειξιν
  choice: പ്രകടമാക്കുന്നതിനായിരുന്നു
  rationale: ἔνδειξις സൂചിപ്പിക്കുന്ന പരസ്യമായ തെളിയിക്കൽ അഥവാ പ്രകടനം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: ഈ ന്യായവിധിസന്ദർഭത്തിൽ ദൈവത്തിന്റെ righteous/just സ്വഭാവവും പ്രവർത്തനവും ഉൾക്കൊള്ളാൻ ‘നീതി’ സ്വാഭാവികവും വിശാലവുമായ പദമാണ്.
- source_word: νῦν καιρῷ
  choice: ഇപ്പോഴത്തെ കാലത്ത്
  rationale: νῦν എന്ന വർത്തമാനകാല ഊന്നലും καιρός എന്ന നിർണായക കാലസൂചനയും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δίκαιον
  choice: നീതിമാൻ
  rationale: ന്യായപരമായ അർഥം നിലനിർത്തുകയും തുടർന്നുള്ള ‘നീതീകരിക്കുന്നവൻ’ എന്ന പ്രയോഗവുമായി പൗലൊസിന്റെ പദബന്ധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δικαιοῦντα
  choice: നീതീകരിക്കുന്നവൻ
  rationale: വർത്തമാന കർത്തൃവാചക കൃദന്തത്തിന്റെ പ്രവർത്തക അർഥം നൽകുകയും δίκαιον/δικαιοῦντα എന്ന പദപ്രയോഗബന്ധം മലയാളത്തിലും നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: യേശുവിൽ വിശ്വസിക്കുന്നവൻ
  rationale: ജനിറ്റീവ് ഘടനയെ യേശുവിലുള്ള വിശ്വാസം എന്ന സാധാരണ objective-genitive വായനയായി പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; മത്സരിക്കുന്ന വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐκ πίστεως Ἰησοῦ എന്നതിലെ ജനിറ്റീവിന്റെ അർഥം
  choice: യേശുവിൽ വിശ്വസിക്കുന്നവൻ
  alternative: യേശുവിന്റെ വിശ്വസ്തതയിൽനിന്നുള്ളവൻ
  rationale: പ്രധാനപാഠം സാധാരണ objective-genitive വായന പിന്തുടരുന്നു; എന്നാൽ പൗലൊസിന്റെ പ്രയോഗത്തിൽ യഥാർഥമായി ചർച്ചചെയ്യപ്പെടുന്ന subjective-genitive വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: δίκαιον καὶ δικαιοῦντα എന്ന ന്യായപരവും ദൈവശാസ്ത്രപരവുമായ പദബന്ധം
  choice: നീതിമാനായിരിക്കാനും ... നീതീകരിക്കുന്നവനായിരിക്കാനും
  alternative: നീതിയുള്ളവനായിരിക്കാനും ... നീതിമാനെന്ന് പ്രഖ്യാപിക്കുന്നവനായിരിക്കാനും
  rationale: ദൈവം നീതിമാനാണെന്നും വിശ്വാസിയെ നീതീകരിക്കുന്നുവെന്നും ഒരുമിച്ച് പറയുന്ന പൗലൊസിന്റെ ഉദ്ദേശ്യപൂർവമായ പദബന്ധവും സംഘർഷവും പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽനിന്നുള്ള തുടർച്ചയായതിനാൽ ആദ്യ ഘടകം സ്വാഭാവികമാക്കാൻ ‘ദൈവം ശിക്ഷ നടപ്പാക്കാതെ സഹിച്ചുനിന്നതിലൂടെ’ എന്നു വികസിപ്പിച്ചു. ‘നീതി/നീതിമാൻ/നീതീകരിക്കുക’ എന്ന പദകുടുംബം ഉപയോഗിച്ച് ഗ്രീക്കിലെ δικαιοσύνη/δίκαιος/δικαιόω ബന്ധം പരമാവധി സംരക്ഷിച്ചു.
