  to: ദൈവത്തിന്റെ സഹിഷ്ണുതയിൽ, ഇപ്പോഴത്തെ കാലത്ത് തന്റെ നീതി പ്രകടമാക്കേണ്ടതിന്—താൻ നീതിമാനും യേശുവിൽ വിശ്വസിക്കുന്നവനെ[b] നീതീകരിക്കുന്നവനും[c] ആയിരിക്കേണ്ടതിന്.
