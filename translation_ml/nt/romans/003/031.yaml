  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: ml
  text: അപ്പോൾ വിശ്വാസത്തിലൂടെ നാം നിയമത്തെ അസാധുവാക്കുന്നുവോ? ഒരിക്കലുമില്ല! മറിച്ച്, നാം നിയമത്തെ നിലനിർത്തുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “നാം നിയമത്തെ സ്ഥാപിക്കുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: നിയമത്തെ
  rationale: റോമർ ലേഖനത്തിലെ വാദസന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ നിയമത്തെ—പ്രത്യേകിച്ച് തോറയെ—സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സന്ദർഭം നിർദിഷ്ടത വ്യക്തമാക്കുന്നതിനാൽ ‘നിയമത്തെ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാദത്തിൽനിന്ന് ഉയരുന്ന പൗലോസിന്റെ ആലങ്കാരിക ചോദ്യത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: καταργοῦμεν
  choice: അസാധുവാക്കുന്നുവോ
  rationale: നിയമത്തെ ഇല്ലാതാക്കുന്നു എന്നതിലുപരി അതിന്റെ സാധുതയോ പ്രാബല്യമോ ഇല്ലാതാക്കുന്നു എന്ന ആശയം വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῆς πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം നിലനിർത്തുകയും πίστις എന്നതിന് ‘വിശ്വാസം’ എന്ന സ്ഥിരവും സ്വാഭാവികവുമായ പദം ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമില്ല!
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിരാകരണം ആധുനിക മലയാളത്തിൽ ഊന്നലോടെയും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: മുൻചോദ്യത്തിലെ ആശയത്തിന് നേരെയുള്ള ശക്തമായ തിരുത്തൽപ്രതിവാദം വ്യക്തമാക്കുന്നു.
- source_word: ἱστάνομεν
  choice: നിലനിർത്തുന്നു
  rationale: ‘അസാധുവാക്കുന്നു’ എന്നതിനുള്ള വ്യക്തമായ വിപരീതമായി നിയമത്തിന്റെ സാധുത ഉറപ്പോടെ തുടരുന്നു എന്ന അർഥം നൽകുന്നു; നിയമം പുതുതായി ഉണ്ടാക്കുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസവും നിയമവും തമ്മിലുള്ള ബന്ധം
  choice: ‘നാം നിയമത്തെ നിലനിർത്തുന്നു’ എന്ന് മുഖ്യവാചകത്തിൽ നൽകി.
  alternative: ‘നാം നിയമത്തെ സ്ഥാപിക്കുന്നു’
  rationale: ἱστάνομεν എന്നതിന് ‘സ്ഥാപിക്കുന്നു’ എന്നും അർഥമാകാം. എന്നാൽ ആധുനിക മലയാളത്തിൽ അത് നിയമം പുതുതായി ഏർപ്പെടുത്തുന്നു എന്ന ധ്വനി നൽകാനിടയുണ്ട്. ‘നിലനിർത്തുന്നു’ എന്നത് വിശ്വാസം നിയമത്തെ അസാധുവാക്കുന്നില്ലെന്ന പൗലോസിന്റെ നേരിട്ടുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു; പ്രത്യേക മതവിഭാഗീയ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആലങ്കാരിക ചോദ്യം–ശക്തമായ നിരാകരണം–വിപരീതപ്രസ്താവന എന്ന ഗ്രീക്ക് ഘടന സംരക്ഷിച്ചു. ‘ന്യായപ്രമാണം’ എന്ന പരമ്പരാഗത പദത്തിന് പകരം സാധാരണ വായനക്കാർക്ക് നേരിട്ട് മനസ്സിലാകുന്ന ‘നിയമം’ ഉപയോഗിച്ചു.
