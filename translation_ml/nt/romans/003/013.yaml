id: ROM.3.13
reference: Romans 3:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: ml
  text: അവരുടെ തൊണ്ട തുറന്ന ശവക്കുഴിയാണ്; അവരുടെ നാവുകൾകൊണ്ട് അവർ വഞ്ചിക്കുന്നു[a]; അസ്പ് പാമ്പുകളുടെ വിഷം അവരുടെ ചുണ്ടുകൾക്കു കീഴിലുണ്ട്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവർ അവരുടെ നാവുകൾകൊണ്ട് വഞ്ചിച്ചുകൊണ്ടിരുന്നു.” ഗ്രീക്ക് ക്രിയയുടെ അപൂർണഭൂതകാലരൂപം തുടർന്നുകൊണ്ടിരുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “അസ്പ് പാമ്പുകൾ” എന്നതിന് കൂടുതൽ പൊതുവായി “വിഷപ്പാമ്പുകൾ” എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്ക് പദം ഏതു പ്രത്യേക പാമ്പിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നത് ഉറപ്പില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: ശവക്കുഴി
  rationale: മരണത്തിന്റെയും ജീർണതയുടെയും ദൃശ്യബിംബം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘കല്ലറ’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: ἀνεῳγμένος
  choice: തുറന്ന
  rationale: ‘തുറക്കപ്പെട്ട നിലയിലുള്ള’ എന്ന ഗ്രീക്ക് പൂർണകൃത്യത്തിന്റെ ഫലാവസ്ഥ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: λάρυγξ
  choice: തൊണ്ട
  rationale: ശരീരഭാഗത്തെ സൂചിപ്പിക്കുന്ന വ്യക്തവും സാധാരണവുമായ മലയാളപദം.
- source_word: ἐδολιοῦσαν
  choice: വഞ്ചിച്ചുകൊണ്ടിരുന്നു
  rationale: വഞ്ചനാപരമായ സംസാരം തുടർന്നുകൊണ്ടിരുന്നതായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അപൂർണഭൂതകാലത്തിന്റെ ദൈർഘ്യഭാവം നിലനിർത്തുന്നു.
- source_word: ἰὸς
  choice: വിഷം
  rationale: പാമ്പുമായി ബന്ധപ്പെട്ട സാഹചര്യത്തിൽ വിഷദ്രവ്യത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്ന മലയാളപദം.
- source_word: ἀσπίδων
  choice: അണലിപ്പാമ്പുകളുടെ
  rationale: വിഷപ്പാമ്പിനെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, താരതമ്യേന നിർദിഷ്ടമായ മലയാളരൂപം; കൃത്യമായ ഇനതിരിച്ചറിയൽ അനിശ്ചിതമായതിനാൽ കുറിപ്പിൽ മറ്റൊരു രൂപം നൽകുന്നു.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: അവരുടെ ചുണ്ടുകൾക്കു കീഴിൽ
  rationale: മൂലത്തിലെ ശക്തമായ ശരീരദൃശ്യം നേരിട്ട് നിലനിർത്തുന്നു.
