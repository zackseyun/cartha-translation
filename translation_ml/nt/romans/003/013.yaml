  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിലെ സമാന്തര ദൃശ്യങ്ങളും അപൂർണഭൂതകാലത്തിന്റെ തുടർച്ചാഭാവവും സംരക്ഷിച്ചിട്ടുണ്ട്; അപരിചിതമായ ജന്തുനാമം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി, അതിന്റെ സാധ്യത കുറിപ്പിൽ രേഖപ്പെടുത്തി.
