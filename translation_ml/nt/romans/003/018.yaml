id: ROM.3.18
reference: Romans 3:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: ml
  text: അവരുടെ കണ്ണുകൾക്കുമുമ്പിൽ ദൈവഭയം ഇല്ല.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവരുടെ കണ്ണുകൾക്കുമുമ്പിൽ ദൈവത്തോടുള്ള ഭക്ത്യാദരം ഇല്ല.”'
    reason: lexical_alternative
  - marker: b
    text: സങ്കീർത്തനം 36:1-ൽനിന്നുള്ള ഉദ്ധരണി (സെപ്റ്റുഅജിന്റിൽ 35:2).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: ഇല്ല
  rationale: നിഷേധാത്മകമായ വർത്തമാനകാല അസ്തിത്വപ്രയോഗത്തിന്റെ ശക്തി സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: φόβος
  choice: ഭയം
  rationale: ഗ്രീക്കിലെ പ്രാഥമിക അർഥവും തിരുവെഴുത്തിലെ ‘ദൈവഭയം’ എന്ന പരിചിതമായ പ്രയോഗവും നിലനിർത്തുന്നു; ‘ഭക്ത്യാദരം’ എന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: θεοῦ
  choice: ദൈവഭയം
  rationale: ജനിറ്റീവ് ബന്ധത്തെ മലയാളത്തിലെ സ്വാഭാവികവും സ്ഥാപിതവുമായ സംയുക്തപ്രയോഗത്തിലൂടെ അവതരിപ്പിക്കുന്നു; ഭയത്തിന്റെ ലക്ഷ്യം ദൈവമാണെന്നത് വ്യക്തമാക്കുന്നു.
- source_word: ἀπέναντι
  choice: കണ്ണുകൾക്കുമുമ്പിൽ
  rationale: സ്ഥലസൂചകമായ രൂപകത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ബൈബിൾശൈലിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: അവരുടെ കണ്ണുകൾ
  rationale: ‘കണ്ണുകൾ’ എന്ന മൂർത്തമായ ദൃശ്യപ്രതീകം നിലനിർത്തി, കാഴ്ചയെയും ശ്രദ്ധയെയും ധാർമിക ദിശാബോധത്തെയും സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിന്റെ ഭാഷാശൈലി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: φόβος θεοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥവ്യാപ്തി
  choice: ദൈവഭയം
  alternative: ദൈവത്തോടുള്ള ഭക്ത്യാദരം
  rationale: ‘ഭയം’ എന്ന മുഖ്യപദം ദൈവത്തോടുള്ള യുക്തമായ ആദരഭയത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ പ്രധാനപാഠത്തിൽ അതു നിലനിർത്തുന്നു; ‘ഭക്ത്യാദരം’ മാത്രം ഉപയോഗിച്ച് അർഥം ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘ദൈവഭയം’ എന്ന സാധാരണ തിരുവെഴുത്തുപ്രയോഗം മൂലത്തിലെ φόβος θεοῦ എന്നതിന്റെ അർഥതീവ്രതയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
