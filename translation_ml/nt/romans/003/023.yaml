id: ROM.3.23
reference: Romans 3:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: ml
  text: എന്തെന്നാൽ എല്ലാവരും പാപം ചെയ്തിരിക്കുന്നു; ദൈവത്തിന്റെ മഹത്ത്വത്തിൽ എത്തിച്ചേരാതെ പോകുന്നു[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ദൈവത്തിന്റെ മഹത്ത്വം അവർക്കില്ല” അല്ലെങ്കിൽ “ദൈവത്തിന്റെ മഹത്ത്വത്തിൽ അവർ കുറവുള്ളവരായിരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: “ദൈവത്തിന്റെ മഹത്ത്വം” എന്നത് ദൈവത്തിന്റെ സ്വന്തം മഹത്ത്വത്തെയോ, മനുഷ്യർ പ്രതിഫലിപ്പിക്കേണ്ടിയിരുന്ന മഹത്ത്വത്തെയോ, ദൈവം നൽകുന്ന മഹത്ത്വത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: സന്ദർഭത്തിൽ എല്ലാ മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തി സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഗ്രീക്കിൽ ഇത് മുൻവാക്യത്തെ വിശദീകരിക്കുന്നു. ഒറ്റവാക്യമായി ഉദ്ധരിക്കുമ്പോൾ മലയാളത്തിലെ ‘എന്തെന്നാൽ’ അസ്വാഭാവികമായി തോന്നുന്നതിനാൽ, വാക്യത്തിന്റെ വിശദീകരണഭാവം ഘടനയിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: ἥμαρτον
  choice: പാപം ചെയ്തിരിക്കുന്നു
  rationale: അയോറിസ്റ്റ് എല്ലാ മനുഷ്യരുടെയും പാപത്തെ സമഗ്രമായ ഒരു യാഥാർഥ്യമായി അവതരിപ്പിക്കുന്നു; ഈ മലയാളപ്രയോഗം അതിന്റെ പൂർത്തിയായ സംഭവവും ഇപ്പോഴത്തെ പ്രസക്തിയും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑστεροῦνται
  choice: ലഭിക്കാതെ പോകുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള തുടർന്നുനിൽക്കുന്ന കുറവിനെയോ അഭാവത്തെയോ വ്യക്തമാക്കുന്നു; ‘എത്തിച്ചേരുന്നില്ല’ എന്നതിലുപരി ലഭിക്കാതിരിക്കുക/കുറവായിരിക്കുക എന്ന ഗ്രീക്ക് അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: δόξης
  choice: മഹത്ത്വം
  rationale: δόξα എന്ന പദത്തിന്റെ ദൈവിക തേജസ്സും ബഹുമാനവും ഉൾക്കൊള്ളുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സമാനപദമാണ്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തി, അത് ദൈവത്തിനുള്ള മഹത്ത്വമാണോ ദൈവം നൽകുന്ന മഹത്ത്വമാണോ എന്ന് മുഖ്യവാചകത്തിൽ തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ മഹത്ത്വം’ എന്നതിന്റെ അർഥം
  choice: ‘ദൈവത്തിന്റെ മഹത്ത്വം’ എന്ന നിഷ്പക്ഷ പ്രയോഗം നിലനിർത്തി.
  alternative: ദൈവത്തിൽനിന്നു ലഭിക്കുന്ന മഹത്ത്വം; മനുഷ്യർ പ്രതിഫലിപ്പിക്കേണ്ട ദൈവമഹത്ത്വം; ദൈവത്തിന്റെ സ്വന്തം മഹത്ത്വം
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും ഒന്നിലധികം ബന്ധാർഥങ്ങൾ അനുവദിക്കുന്നതുമാണ്. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിച്ചിട്ടില്ല.
- issue: ὑστεροῦνται എന്നതിലെ കുറവ്/അഭാവത്തിന്റെ സ്വഭാവം
  choice: ‘ലഭിക്കാതെ പോകുന്നു’ എന്നു നൽകി, തുടർന്നുനിൽക്കുന്ന അഭാവം പ്രകടമാക്കി.
  alternative: ദൈവത്തിന്റെ മഹത്ത്വത്തിൽ എത്തിച്ചേരുന്നില്ല; ദൈവത്തിന്റെ മഹത്ത്വം കുറവായിരിക്കുന്നു
  rationale: ക്രിയയ്ക്ക് ‘കുറവായിരിക്കുക’, ‘അഭാവപ്പെടുക’, ‘എത്താതിരിക്കുക’ എന്നീ നിഴലർഥങ്ങൾ ഉണ്ടാകാം. മുഖ്യവാചകം വായനാസൗകര്യം കാത്തുകൊണ്ട് ഈ അഭാവത്തെ സൂചിപ്പിക്കുന്നു; പകരങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾ പദമായ ‘മഹത്ത്വം’ നിലനിർത്തിയെങ്കിലും, അസ്വാഭാവികമായ പഴയ വാക്യഘടന ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
