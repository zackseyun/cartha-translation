id: ROM.3.20
reference: Romans 3:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: ml
  text: കാരണം, ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ ആരും[a] അവന്റെ മുമ്പാകെ നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുകയില്ല; ന്യായപ്രമാണത്തിലൂടെയാണ് പാപത്തെക്കുറിച്ചുള്ള അറിവ് ലഭിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘സകല ജഡവും’; ഇവിടെ അർഥം ‘ഒരു മനുഷ്യനും’ എന്നാണ്.
    reason: πᾶσα σὰρξ എന്ന മൂലപ്രയോഗത്തിന്റെ അക്ഷരാർഥം കൃത്യമായി അറിയിച്ചുകൊണ്ട്, മുഖ്യവാചകത്തിലെ സ്വാഭാവികമായ ‘ആരും’ എന്ന പരിഭാഷയെ പിന്തുണയ്ക്കുന്നു.
lexical_decisions:
- source_word: ἔργων νόμου
  choice: ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളാൽ
  rationale: ‘ന്യായപ്രമാണം ആവശ്യപ്പെടുന്ന പ്രവൃത്തികൾ’ എന്ന വ്യാഖ്യാനം വാചകത്തിനുള്ളിൽ ചേർക്കാതെ, ഗ്രീക്കിലെ സംക്ഷിപ്തവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ ബന്ധം നിലനിർത്തുന്നു.
- source_word: δικαιωθήσεται
  choice: നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുകയില്ല
  rationale: നിയമവിധിയുമായി ബന്ധപ്പെട്ട ദൈവശാസ്ത്രപരമായ അർഥവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: πᾶσα σὰρξ
  choice: ആരും
  rationale: ഇവിടെ ‘സകല ജഡവും’ എന്നത് ഒരു മനുഷ്യനും ഒഴിവല്ല എന്നർഥമുള്ള സെമിറ്റിക് പ്രയോഗമാണ്; ‘ആരും’ ആ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: പാപത്തെക്കുറിച്ചുള്ള അറിവ്
  rationale: പാപത്തെ തിരിച്ചറിയുന്ന അറിവ് എന്ന മൂലാർഥം ലളിതവും കൃത്യവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നീതീകരിക്കുക’ എന്നതിന്റെ നിയമവിധിസംബന്ധമായ സ്വഭാവം
  choice: നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുക
  alternative: നീതിമാനാക്കപ്പെടുക / നീതീകരിക്കപ്പെടുക
  rationale: ദൈവം ഒരാളെ നീതിമാനായി വിധിക്കുന്ന ആശയം പ്രകടമാക്കുന്നു; അതേസമയം ഒരു പ്രത്യേക സമ്പ്രദായത്തിന്റെ വിശാലമായ നീതീകരണസിദ്ധാന്തം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: ‘ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ’ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: മൂലത്തിലെ പൊതുവായ പ്രയോഗം അതേപടി നിലനിർത്തുക
  alternative: ന്യായപ്രമാണം ആവശ്യപ്പെടുന്ന എല്ലാ പ്രവൃത്തികളും / യഹൂദ സ്വത്വചിഹ്നങ്ങളായ പ്രവൃത്തികളും
  rationale: ഗ്രീക്ക് വാചകം ഈ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ ഇവിടെ വ്യക്തമായി പരിമിതപ്പെടുത്തുന്നില്ല; അതിനാൽ യഥാർഥമായ വ്യാഖ്യാനതുറപ്പ് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും, ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുക’ എന്ന സുതാര്യമായ പ്രയോഗം ഉപയോഗിച്ച് അനാവശ്യ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
