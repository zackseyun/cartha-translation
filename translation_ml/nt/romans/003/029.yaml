id: ROM.3.29
reference: Romans 3:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ദൈവം യഹൂദരുടെ ദൈവം മാത്രമാണോ? ജനതകളുടെയും ദൈവമല്ലയോ? അതെ, ജനതകളുടെയും ദൈവമാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനതകൾ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദം ഇവിടെ യഹൂദരല്ലാത്തവരെ, അഥവാ ‘വിജാതീയരെ’, സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: പൗലോസിന്റെ വാദത്തിൽ അടുത്ത ആലങ്കാരിക ചോദ്യത്തെ അവതരിപ്പിക്കുന്ന വിഭാജകസംയോജകം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: Ἰουδαίων
  choice: യഹൂദരുടെ
  rationale: θεός എന്ന പദത്തോടു ബന്ധപ്പെടുന്ന ജനിറ്റീവ് മലയാളത്തിൽ ‘യഹൂദരുടെ ദൈവം’ എന്നു സ്വാഭാവികമായി വരുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: θεός എന്നതിനുള്ള പതിവായ മലയാളരൂപം; ആദ്യ ചോദ്യത്തിലെ നിർദിഷ്ട പരാമർശം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: μόνον
  choice: മാത്രം
  rationale: യഹൂദരിലേക്കു മാത്രമുള്ള പരിമിതി എന്ന ആലങ്കാരിക ചോദ്യത്തിന്റെ ഊന്നൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οὐχὶ καὶ
  choice: -യുടെയും ദൈവമല്ലയോ?
  rationale: οὐχί അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണ്; ‘അല്ലയോ?’ ആ പ്രതീക്ഷയും καίയുടെ ഉൾപ്പെടുത്തൽഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐθνῶν
  choice: ജനതകളുടെ
  rationale: ἔθνηയുടെ അടിസ്ഥാന അർത്ഥവും ബഹുവചനവും നിലനിർത്തുന്നു; ഇവിടെ യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്.
- source_word: ναὶ
  choice: അതെ
  rationale: ആലങ്കാരിക ചോദ്യത്തിനുള്ള ഹ്രസ്വവും വ്യക്തവുമായ അനുകൂല ഉത്തരം.
- source_word: καὶ ἐθνῶν
  choice: ജനതകളുടെയും
  rationale: καί യഹൂദരോടൊപ്പം ജനതകളെയും ഉൾപ്പെടുത്തുന്നു; ‘-ഉം’ എന്ന ഉൾപ്പെടുത്തൽരൂപം അത് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἐθνῶν എന്നത് ‘ജനതകൾ’ എന്നോ ‘വിജാതീയർ’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: ജനതകൾ
  alternative: വിജാതീയർ / യഹൂദരല്ലാത്തവർ
  rationale: ‘ജനതകൾ’ മൂലപദത്തിന്റെ ബഹുവചനരൂപവും വ്യാപ്തിയും കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുന്നു. യഹൂദർ–ജനതകൾ എന്ന സന്ദർഭവിരോധം ഇവിടെ യഹൂദരല്ലാത്തവരെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ഈ സന്ദർഭാർഥം രേഖപ്പെടുത്തുന്നു.
- issue: രണ്ടാമത്തെയും അവസാനത്തെയും ഉപവാക്യങ്ങളിൽ ഗ്രീക്കിൽ സൂചിതമായ θεός മലയാളത്തിൽ ആവർത്തിക്കുക
  choice: ‘ദൈവം’ / ‘ദൈവമാണ്’ എന്നു വ്യക്തമാക്കുക
  alternative: ‘ജനതകളുടേതുമല്ലയോ? അതെ, ജനതകളുടേതും’ എന്ന കൂടുതൽ ദീർഘവൃത്തമായ രൂപം
  rationale: മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ നാമം ആവർത്തിക്കുന്നു; ആശയപരമായി ഒന്നും കൂട്ടിച്ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ആലങ്കാരിക ചോദ്യശൈലി. ‘ജനതകൾ’ എന്ന പദം മൂലഭാഷയോട് അടുത്തുനിൽക്കുമ്പോൾ, അടിക്കുറിപ്പ് സന്ദർഭത്തിലെ ‘വിജാതീയർ’ എന്ന അർത്ഥം സാധാരണ വായനക്കാർക്കായി വ്യക്തമാക്കുന്നു.
