id: ROM.3.12
reference: Romans 3:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: ml
  text: എല്ലാവരും വഴിതെറ്റിപ്പോയി; അവർ ഒന്നാകെ പ്രയോജനമില്ലാത്തവരായിത്തീർന്നു.[a] നന്മ ചെയ്യുന്നവൻ ആരുമില്ല;[b] ഒരാൾപോലുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉപയോഗശൂന്യരായിത്തീർന്നു”; “ദുഷിച്ചുപോയി” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നല്ലതു ചെയ്യുന്നവൻ ആരുമില്ല.” χρηστότητα എന്ന പദത്തിന് “ദയ” എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: എല്ലാവരും
  rationale: ഗ്രീക്കിലെ ബഹുവചനത്തിന്റെ സാർവത്രിക വ്യാപ്തി, അവിടെ ഇല്ലാത്ത ഒരു നാമം കൂട്ടിച്ചേർക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἐξέκλιναν
  choice: വഴിതെറ്റിപ്പോയി
  rationale: നേരായ വഴിയിൽനിന്നുള്ള ധാർമിക വ്യതിചലനവും സംഭവിച്ചുകഴിഞ്ഞ പ്രവൃത്തിയുടെ ഫലവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἅμα
  choice: ഒന്നാകെ
  rationale: എല്ലാവരും ഒരേ അവസ്ഥ പങ്കിടുന്നു എന്ന കൂട്ടായ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἠχρεώθησαν
  choice: പ്രയോജനമില്ലാത്തവരായിത്തീർന്നു
  rationale: ക്രിയയുടെ ഫലാവസ്ഥയും ‘ഉപയോഗശൂന്യരാകുക’ എന്ന ശക്തമായ നിഷേധാത്മക വിലയിരുത്തലും നിലനിർത്തുന്നു; ‘ദുഷിച്ചുപോയി’ എന്ന ആശയം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: ποιῶν
  choice: പ്രവർത്തിക്കുന്നവൻ
  rationale: പങ്കാളിക്രിയയുടെ തുടർച്ചയായതോ സ്വഭാവപരമായതോ ആയ പ്രവർത്തനഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χρηστότητα
  choice: നന്മ
  rationale: ഇവിടത്തെ ധാർമിക സന്ദർഭത്തിൽ ‘goodness’ എന്ന അർഥം വ്യക്തമായി നൽകുന്നു; പദത്തിനുള്ള ‘ദയ/കരുണ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἔστιν
  choice: ആരുമില്ല
  rationale: അസ്തിത്വനിഷേധം ലളിതവും ശക്തവുമായി സമകാലിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕως ἑνός
  choice: ഒരാൾപോലുമില്ല
  rationale: ‘ഒരുവൻവരെയും ഇല്ല’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ കൃത്യമായി പകരുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ സമാന്തര ഘടനയും അവസാനത്തെ ശക്തമായ ഊന്നലും സംരക്ഷിച്ചിട്ടുണ്ട്.
