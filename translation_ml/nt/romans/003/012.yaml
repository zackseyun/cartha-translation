  source_fidelity: The translation preserves the universal scope (πάντες), completed departure, collective force (ἅμα), resultant loss of usefulness (ἠχρεώθησαν), and the deliberately repeated, emphatic denial that anyone does χρηστότης. The footnote anchors in the Malayalam draft correctly attach to the words they discuss, unlike the crossed anchors in the supplied English audit trail.
  naturalness: The verse is clear and suitably grave in modern standard Malayalam. Replacing the somewhat formal collocation “നന്മ പ്രവർത്തിക്കുന്നവൻ” with the more idiomatic “നന്മ ചെയ്യുന്നവൻ” improves naturalness without reducing the participle’s general/habitual sense.
  terminology: “പ്രയോജനമില്ലാത്തവരായിത്തീർന്നു” accurately conveys becoming useless/worthless. “നന്മ” is a sound contextual rendering of χρηστότητα. The alternative “ദയ” is appropriate; “കരുണ” is less exact here and is omitted to keep the lexical note precise.
  issues:
