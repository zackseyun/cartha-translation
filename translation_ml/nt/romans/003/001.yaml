id: ROM.3.1
reference: Romans 3:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: ml
  text: അപ്പോൾ യെഹൂദന് എന്തു പ്രത്യേക നേട്ടമാണുള്ളത്? അല്ലെങ്കിൽ, പരിച്ഛേദനയുടെ പ്രയോജനം എന്താണ്?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പരിച്ഛേദനയ്ക്ക് എന്തു മൂല്യമാണുള്ളത്?”
    reason: lexical_alternative
  - marker: b
    text: “യെഹൂദൻ” എന്നത് ഇവിടെ യെഹൂദജനത്തെ പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രതിനിധാനപരമായ ഏകവചനമാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: അപ്പോൾ ... എന്താണ്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള പൗലോസിന്റെ നിഗമനാത്മകമായ മാറ്റവും ചോദ്യരൂപവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ περισσὸν
  choice: മേന്മ
  rationale: ഇവിടെ പദം സൂചിപ്പിക്കുന്നത് അധികമായുള്ള പ്രത്യേക നേട്ടമോ അനുകൂലതയോ ആണ്; ‘മേന്മ’ യെഹൂദന്റെ സവിശേഷ സ്ഥാനം ചോദ്യംചെയ്യുന്ന ഭാവം നിലനിർത്തുന്നു, സ്വഭാവസിദ്ധമായ വംശീയ ശ്രേഷ്ഠത ഉറപ്പിക്കുന്നില്ല.
- source_word: τοῦ Ἰουδαίου
  choice: യെഹൂദന്
  rationale: ഗ്രീക്കിലെ നിർദേശക ഏകവചനം ഒരു വിഭാഗത്തെ പ്രതിനിധാനം ചെയ്യുന്ന പ്രയോഗമാണ്. മലയാളത്തിലെ ഏകവചന ദത്തിവുരൂപം ആ വാചകഘടന സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἢ τίς
  choice: '... എന്താണ്'
  rationale: രണ്ടാമത്തെ സമാന്തര അലങ്കാരചോദ്യത്തെ ലളിതമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘അല്ലെങ്കിൽ’ ചേർക്കാതെതന്നെ രണ്ട് ചോദ്യങ്ങളുടെ വൈരുധ്യസമാന്തര്യം വ്യക്തമാണ്.
- source_word: ἡ ὠφέλεια
  choice: പ്രയോജനം
  rationale: ലഭിക്കുന്ന ഗുണം, ഉപകാരം, ഉപയോഗം എന്നീ ആശയങ്ങൾ വ്യക്തമായി നൽകുകയും περισσόν എന്നതിന് ഉപയോഗിച്ച ‘മേന്മ’യിൽനിന്നുള്ള ചെറിയ അർത്ഥവ്യത്യാസം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τῆς περιτομῆς
  choice: പരിച്ഛേദനകൊണ്ട്
  rationale: ഉടമ്പടിയുടെ അടയാളമായ ആചാരത്തെ നേരിട്ട് പേരുപറയുന്നു; മലയാളത്തിൽ അതിന്റെ പ്രയോജനം ചോദിക്കാൻ കരണാർത്ഥക രൂപം സ്വാഭാവികമാണ്.
theological_decisions:
- issue: Ἰουδαίου എന്ന ഏകവചനത്തെ പ്രതിനിധാനപരമായി നിലനിർത്തണോ, ബഹുവചനമോ വിശദീകരണപരമായ പുനരാഖ്യാനമോ ഉപയോഗിക്കണോ
  choice: യെഹൂദന്
  alternative: യെഹൂദന്മാർക്ക് / യെഹൂദനായ വ്യക്തിക്ക്
  rationale: പൗലോസ് ഉപയോഗിക്കുന്ന ഏകവചനം ഒരു വിഭാഗത്തെ പ്രതിനിധാനം ചെയ്യുന്നതാണ്. അത് നിലനിർത്തുന്നത് അദ്ദേഹത്തിന്റെ അലങ്കാരചോദ്യത്തിന്റെ രൂപം സംരക്ഷിക്കുകയും വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ‘മേന്മ’യും ‘പ്രയോജനം’യും ഉപയോഗിച്ച് περισσόν–ὠφέλεια പദജോടിയിലെ നേരിയ വ്യത്യാസം സൂക്ഷിച്ചു; ‘പരിച്ഛേദനം’ എന്ന പരമ്പരാഗതവും വ്യാപകമായി മനസ്സിലാകുന്നതുമായ ബൈബിൾപദം നിലനിർത്തി.
