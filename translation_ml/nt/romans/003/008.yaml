id: ROM.3.8
reference: Romans 3:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: ml
  text: പിന്നെ, ഞങ്ങളെ അപവാദപ്പെടുത്തുന്നതുപോലെയും ചിലർ ഞങ്ങൾ ഇങ്ങനെ പറയുന്നുവെന്ന് അവകാശപ്പെടുന്നതുപോലെയും, “നന്മ വരേണ്ടതിന് നമുക്ക് തിന്മ ചെയ്യാം” എന്നു പറഞ്ഞുകൂടേ? അവരുടെ ശിക്ഷാവിധി നീതിയുക്തമാണ്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുസൃതമായി: “ഞങ്ങളെ അപവാദപ്പെടുത്തുന്നതുപോലെയും ‘നന്മ വരേണ്ടതിന് നമുക്ക് തിന്മ ചെയ്യാം’ എന്നു ഞങ്ങൾ പറയുന്നുവെന്ന് ചിലർ പറയുന്നതുപോലെയും—അങ്ങനെ പറഞ്ഞുകൂടേ?”'
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ” എന്നത് ഈ ആരോപണവും ന്യായവാദവും ഉന്നയിക്കുകയോ അംഗീകരിക്കുകയോ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: ഞങ്ങൾ അപവാദം പറയപ്പെടുന്നു
  rationale: ഇവിടെ ദൈവനിന്ദയല്ല, പൗലോസിന്റെയും കൂട്ടാളികളുടെയും വാക്കുകളെ ദോഷകരമായി വളച്ചൊടിച്ചു പ്രചരിപ്പിക്കുന്നതാണ് ഉദ്ദേശ്യം; അതിനാൽ ആ അർഥം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: φασίν τινες
  choice: ചിലർ ... അവകാശപ്പെടുന്നു
  rationale: ഇത് വെറും റിപ്പോർട്ടല്ല, എതിരാളികളുടെ ആരോപണമാണെന്ന ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: λέγειν
  choice: ഞങ്ങൾ പറയുന്നതായി
  rationale: ‘പഠിപ്പിക്കുന്നു’ എന്ന് വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ ഗ്രീക്കിലെ ‘പറയുക’ എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു.
- source_word: Ποιήσωμεν
  choice: നമുക്ക് ... ചെയ്യാം
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലെ പ്രേരണാത്മക സബ്ജങ്ക്ടീവിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: τὰ κακὰ
  choice: തിന്മ
  rationale: നപുംസക ബഹുവചന വിശേഷണത്തിന്റെ ആശയത്തെ മലയാളത്തിൽ സ്വാഭാവികമായ സമാഹാരപദംകൊണ്ട് അവതരിപ്പിക്കുന്നു.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: നന്മ വരേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും ‘നന്മ ഉണ്ടാകുക/വരുക’ എന്ന ആശയവും ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: κρίμα
  choice: ശിക്ഷാവിധി
  rationale: ഇവിടെ പൊതുവായ ന്യായവിധിയേക്കാൾ പ്രതികൂലമായ നീതിന്യായ വിധിയാണ് സന്ദർഭോചിതം.
- source_word: ἔνδικόν
  choice: നീതിയുക്തമാണ്
  rationale: വിധി ന്യായവും അർഹവുമാണെന്ന നിയമപരവും ധാർമികവുമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: καὶ μὴ
  choice: അപ്പോൾ എന്തുകൊണ്ട് ഇങ്ങനെ പറഞ്ഞുകൂടാ
  rationale: മുൻവാക്യത്തിലെ വാദം തുടരുന്ന ഗ്രീക്ക് പ്രയോഗം അപൂർണ്ണഘടനയുള്ളതാണ്; അതിന്റെ സൂചിതമായ ചോദ്യം ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ὧν എന്ന ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നവർ
  choice: അത്തരക്കാരുടെ
  alternative: അവരുടെ
  rationale: ഇത് വ്യാജാരോപണം ഉന്നയിക്കുകയോ അതിലെ ‘തിന്മ ചെയ്യാം’ എന്ന ന്യായവാദം അംഗീകരിക്കുകയോ ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം വ്യക്തമാക്കുന്നു; പ്രധാനപാഠം അനാവശ്യമായി നീട്ടാതെ അടിക്കുറിപ്പിൽ പരിധി വിശദീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവും അപൂർണ്ണവുമായ ചോദ്യഘടന വായനാസൗകര്യത്തിനായി വ്യക്തമാക്കിയെങ്കിലും ആരോപണത്തിന്റെ പരിഹാസഭാവവും അന്തിമമായ നീതിന്യായ പ്രസ്താവനയും നിലനിർത്തിയിരിക്കുന്നു.
