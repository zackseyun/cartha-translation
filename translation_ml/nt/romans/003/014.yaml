  yaml_path: translation/nt/romans/003/014.yaml
  text: whose mouth is full of cursing and bitterness.
translation:
  language: ml
  text: അവരുടെ വായ് ശാപവും കയ്പും നിറഞ്ഞതാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: അവരുടെ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞിരിക്കുന്ന ആളുകളെ വിശേഷിപ്പിക്കുന്ന ബന്ധസർവനാമത്തിന്റെ ഉടമസ്ഥതാസംബന്ധമായ അർഥം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸ στόμα
  choice: വായിൽ
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തെ മലയാളത്തിലും സമൂഹവാചകമായി ഏകവചനത്തിൽ നിലനിർത്തുന്നു; γέμει എന്ന ക്രിയയോടൊപ്പം അധികരണവിഭക്തി സ്വാഭാവികമാണ്.
- source_word: ἀρᾶς
  choice: ശാപവാക്കുകളും
  rationale: ദോഷം വരുത്തണമെന്ന ഉദ്ദേശമുള്ള ശപിക്കൽവാക്കുകളെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; 'ശാപം' എന്നതിനെക്കാൾ സംസാരത്തെക്കുറിച്ചുള്ള സന്ദർഭം 'ശാപവാക്കുകൾ' വ്യക്തമാക്കുന്നു.
- source_word: πικρίας
  choice: കയ്പും
  rationale: അടിസ്ഥാന രൂപകവും ധാർമിക ശക്തിയും നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളപദം; സന്ദർഭത്തിൽ കയ്പേറിയ, ദ്വേഷപൂർണമായ സംസാരത്തെയും സൂചിപ്പിക്കാം.
- source_word: γέμει
  choice: നിറഞ്ഞിരിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള 'നിറഞ്ഞിരിക്കുക' എന്ന അവസ്ഥയെ സ്വാഭാവികവും കൃത്യവുമായി അവതരിപ്പിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ഭാഷ. ഗ്രീക്കിലെ സമൂഹവാചക ഏകവചനമായ 'വായ്' നിലനിർത്തിയിരിക്കുന്നു; 'ശാപവാക്കുകൾ' സംസാരപ്രവൃത്തിയെ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
