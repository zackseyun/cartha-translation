- from: അവരുടെ വായിൽ ശാപവാക്കുകളും കയ്പും നിറഞ്ഞിരിക്കുന്നു.
  to: അവരുടെ വായ് ശാപവും കയ്പും നിറഞ്ഞതാണ്.
