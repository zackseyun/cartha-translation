id: ROM.3.27
reference: Romans 3:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: ml
  text: അപ്പോൾ, മേനി പറയാനുള്ള ഇടം എവിടെയാണ്? അത് ഒഴിവാക്കപ്പെട്ടിരിക്കുന്നു. ഏതുതരം നിയമത്തിലൂടെ? പ്രവൃത്തികളുടെ നിയമത്തിലൂടെയോ? അല്ല, വിശ്വാസത്തിന്റെ നിയമത്തിലൂടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: പ്രശംസിക്കാൻ
  rationale: സ്വന്തം നേട്ടത്തിലോ നിലയിലോ അഭിമാനിച്ച് മേനി പറയുന്നതിനെ സൂചിപ്പിക്കുന്ന പദം; ചോദ്യത്തിന്റെ സ്വാഭാവിക മലയാളരൂപത്തിനായി ക്രിയാത്മകമായി പരിഭാഷപ്പെടുത്തി.
- source_word: ἐξεκλείσθη
  choice: അതിന് ഇടമില്ലാതാക്കിയിരിക്കുന്നു
  rationale: ‘പുറത്താക്കപ്പെട്ടു/ഒഴിവാക്കപ്പെട്ടു’ എന്ന ശക്തമായ നിഷേധാർഥം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; പ്രശംസയ്ക്ക് യാതൊരു സ്ഥാനവുമില്ലെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: νόμος
  choice: നിയമം
  rationale: വാക്യത്തിലെ ആവർത്തനവും ‘പ്രവൃത്തികൾ’–‘വിശ്വാസം’ എന്ന വൈരുധ്യവും സംരക്ഷിക്കാൻ ഒരേ പദം ഉപയോഗിച്ചു; ഇവിടെ ‘തത്ത്വം’ എന്ന അർഥസാധ്യത വ്യാഖ്യാനിച്ച് ഉറപ്പിച്ചിട്ടില്ല.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: പൗലൊസിന്റെ വാദത്തിലെ അടിസ്ഥാന പദം നേരിട്ടും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷമായും നൽകുന്നു.
theological_decisions:
- issue: ‘വിശ്വാസത്തിന്റെ നിയമം’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: വിശ്വാസത്തിന്റെ നിയമം
  alternative: വിശ്വാസത്തിന്റെ തത്ത്വം
  rationale: νόμος എന്ന പദത്തിലെ ഉദ്ദേശ്യപൂർവമായ വാക്ചാതുര്യവും സാധ്യതയുള്ള അർഥപിരിമുറുക്കവും സംരക്ഷിക്കുന്നു; അതിനെ മുൻകൂട്ടി ‘തത്ത്വം’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
- issue: പ്രവൃത്തികളും വിശ്വാസവും തമ്മിലുള്ള വൈരുധ്യം
  choice: പ്രവൃത്തികളുടെ നിയമം ... വിശ്വാസത്തിന്റെ നിയമം
  alternative: പ്രവൃത്തികളെ ആശ്രയിക്കുന്ന തത്ത്വം ... വിശ്വാസത്തെ ആശ്രയിക്കുന്ന തത്ത്വം
  rationale: മൂലപാഠത്തിന്റെ സംക്ഷിപ്തമായ പ്രതിവാദരൂപവും ആവർത്തനവും നിലനിർത്തുന്നു; പ്രവൃത്തികളുടെ സ്വഭാവത്തെക്കുറിച്ച് വാക്യത്തിൽ ഇല്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ തുടർച്ചയായ ചോദ്യോത്തര ശൈലിയും സംക്ഷിപ്തതയും നിലനിർത്തി.
