id: ROM.3.21
reference: Romans 3:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, ന്യായപ്രമാണത്തിൽനിന്ന് വേറിട്ട്, ദൈവത്തിന്റെ നീതി[a][b] വെളിപ്പെട്ടിരിക്കുന്നു; ന്യായപ്രമാണവും പ്രവാചകന്മാരും[c] അതിനു സാക്ഷ്യം നൽകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്ന പദത്തിന് ഇവിടെ ‘നീതിമത്തം’ അഥവാ ‘ന്യായം’ എന്ന അർത്ഥഭാവവും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിൽനിന്നുള്ള നീതി’ എന്നും മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: c
    text: ‘ന്യായപ്രമാണവും പ്രവാചകന്മാരും’ എന്നത് ഇവിടെ വിശുദ്ധലിഖിതങ്ങളെ, അതായത് പഴയനിയമത്തിന്റെ സാക്ഷ്യത്തെ, സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: δὲയുടെ വൈരുധ്യസൂചനയും νυνὶയുടെ കാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: χωρὶς νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്ന് വേറിട്ട്
  rationale: χωρίς സൂചിപ്പിക്കുന്ന വേർതിരിവ് വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ νόμος മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ന്യായപ്രമാണം’ തിരഞ്ഞെടുത്തു.
- source_word: δικαιοσύνη θεοῦ
  choice: ദൈവത്തിന്റെ നീതി
  rationale: δικαιοσύνηയുടെ നീതി/നീതിമത്തത എന്നീ അർത്ഥവ്യാപ്തിയും θεοῦ എന്ന ജനിറ്റീവിന്റെ ഉദ്ദേശ്യപൂർവമായ തുറന്ന നിലയും സാധ്യമായത്ര സംരക്ഷിക്കുന്നു.
- source_word: πεφανέρωται
  choice: വെളിപ്പെട്ടിരിക്കുന്നു
  rationale: മുമ്പുണ്ടായ വെളിപ്പെടുത്തലിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന ഗ്രീക്ക് പൂർണകാലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: ന്യായപ്രമാണവും പ്രവാചകന്മാരും അതിനു സാക്ഷ്യം നൽകുന്നു
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ കൃദന്തരൂപത്തിന്റെ സാക്ഷ്യാർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ അസ്വാഭാവികമായ നിഷ്ക്രിയഘടന ഒഴിവാക്കി സജീവവാക്യമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη θεοῦ എന്ന പ്രയോഗത്തിലെ ജനിറ്റീവിന്റെ അർത്ഥം
  choice: ദൈവത്തിന്റെ നീതി
  alternative: ദൈവത്തിൽനിന്നുള്ള നീതി
  rationale: ഈ പ്രയോഗം ദൈവത്തിന്റെ സ്വന്തം നീതിയെയും നീതിപൂർവമായ പ്രവർത്തനത്തെയും സൂചിപ്പിക്കാം; അതോടൊപ്പം ദൈവത്തിൽനിന്ന് ലഭിക്കുന്ന നീതി എന്ന അർത്ഥവും സന്ദർഭത്തിൽ കേൾക്കാം. മുഖ്യപാഠം ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം’, ‘സാക്ഷ്യം നൽകുന്നു’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി.
