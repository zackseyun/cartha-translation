  text: രക്തം ചൊരിയാൻ അവരുടെ കാലുകൾ വേഗതയുള്ളവയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “രക്തം ഒഴിക്കാൻ അവരുടെ കാലുകൾ മൂർച്ചയുള്ളവയാണ്.”'
