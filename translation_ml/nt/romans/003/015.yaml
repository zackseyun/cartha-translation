lexical_decisions:
- source_word: ὀξεῖς
  choice: അതിവേഗം പായുന്നു
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘മൂർച്ചയുള്ള’ എന്നാണെങ്കിലും, അക്രമത്തിലേക്കു പാഞ്ഞടുക്കുന്ന കാലുകളെക്കുറിച്ചുള്ള ഈ പ്രയോഗത്തിൽ വേഗവും സന്നദ്ധതയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: πόδες
  choice: കാലുകൾ
  rationale: ശരീരാവയവത്തിന്റെ ദൃശ്യബിംബം നിലനിർത്തുന്ന നേരിട്ടുള്ള മലയാളപരിഭാഷ.
- source_word: αὐτῶν
  choice: അവരുടെ
  rationale: കാലുകൾ ആരുടേതാണെന്ന ഉടമസ്ഥബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐκχέαι
  choice: ചൊരിയാൻ
  rationale: അക്ഷരാർഥമായ ‘ഒഴിക്കുക’ എന്നതിനെക്കാൾ രക്തത്തോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവും അക്രമത്തിന്റെ അർഥം നിലനിർത്തുന്നതുമായ പ്രയോഗം.
- source_word: αἷμα
  choice: രക്തം
  rationale: സന്ദർഭത്തിന് യോജിച്ച സാധാരണവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. മൂലത്തിലെ കാലുകളുടെ ദൃശ്യബിംബം നിലനിർത്തിക്കൊണ്ട് ὀξεῖς എന്നതിന്റെ സന്ദർഭാർഥം സ്വാഭാവികമായി അവതരിപ്പിച്ചു.
