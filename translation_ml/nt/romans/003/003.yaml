id: ROM.3.3
reference: Romans 3:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: ml
  text: അപ്പോൾ എന്ത്? ചിലർ അവിശ്വസ്തരായിരുന്നെങ്കിൽ, അവരുടെ അവിശ്വസ്തത ദൈവത്തിന്റെ വിശ്വസ്തതയെ നിഷ്ഫലമാക്കുമോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിന്റെ വിശ്വാസം.” ഗ്രീക്കിൽ പദശഃ “ദൈവത്തിന്റെ വിശ്വാസം” എന്നാണ്; എന്നാൽ ഇവിടെ ദൈവത്തിന്റെ വിശ്വസ്തതയെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: അപ്പോൾ എന്ത്?
  rationale: പൗലോസിന്റെ വാദത്തിലെ അടുത്ത ചോദ്യം അവതരിപ്പിക്കുന്ന സംക്ഷിപ്ത പ്രയോഗം; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വാദത്തിന്റെ തിരിവ് നിലനിർത്തുന്നു.
- source_word: ἠπίστησάν
  choice: അവിശ്വസ്തരായിപ്പോയെങ്കിൽ
  rationale: ‘വിശ്വസിച്ചില്ല’ എന്ന അർഥം സാധ്യമാണെങ്കിലും, തുടർന്നുള്ള ἀπιστίαയും ദൈവത്തിന്റെ πίστις-ഉം തമ്മിലുള്ള വിരോധം കണക്കിലെടുക്കുമ്പോൾ വിശ്വസ്തതയുടെ അഭാവം എന്ന ഭാവം ഇവിടെ കൂടുതൽ യോജിക്കുന്നു.
- source_word: τινες
  choice: ചിലർ
  rationale: അനിശ്ചിതമായ ഒരു ബഹുവചനസംഘത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀπιστία
  choice: അവിശ്വസ്തത
  rationale: ἠπίστησάν എന്ന ക്രിയയുമായുള്ള പദബന്ധവും ദൈവത്തിന്റെ πίστις-നോടുള്ള വിരോധവും നിലനിർത്തുന്നു; ‘അവിശ്വാസം’ എന്നതും സാധ്യമാണ്.
- source_word: πίστιν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വിശ്വസ്തത
  rationale: പദശഃ ‘ദൈവത്തിന്റെ വിശ്വാസം’ എന്നാണെങ്കിലും, മനുഷ്യരുടെ അവിശ്വസ്തതയോടുള്ള പ്രതിവിരോധത്തിൽ ദൈവത്തിന്റെ വിശ്വസനീയതയോ വിശ്വസ്തതയോ ആണ് സന്ദർഭത്തിൽ ഏറ്റവും സ്വാഭാവികമായ അർഥം.
- source_word: καταργήσει
  choice: നിഷ്ഫലമാക്കുമോ
  rationale: എന്തെങ്കിലും ഫലമില്ലാത്തതോ പ്രാബല്യമില്ലാത്തതോ ആക്കുക എന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: πίστιν τοῦ θεοῦ എന്ന വിവാദമുള്ള പൗലോസീയ പ്രയോഗത്തിന്റെ പരിഭാഷ
  choice: ദൈവത്തിന്റെ വിശ്വസ്തത
  alternative: ദൈവത്തിന്റെ വിശ്വാസം
  rationale: മനുഷ്യരുടെ ἀπιστίαയും ദൈവത്തിന്റെ πίστις-ഉം തമ്മിലുള്ള നേരിട്ടുള്ള വിരോധം ‘വിശ്വസ്തത’ എന്ന അർഥത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് ഘടനയിലെ യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യരൂപം ഉപയോഗിച്ചു. ‘അവിശ്വസ്തത—വിശ്വസ്തത’ എന്ന ആവർത്തനവിരോധം മൂലപാഠത്തിന്റെ വാചകശക്തി നിലനിർത്തുന്നു; വിവാദമുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
