revisions:
- from: അതുകൊണ്ട്, ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ കൂടാതെ വിശ്വാസത്താൽ ഒരു മനുഷ്യൻ നീതീകരിക്കപ്പെടുന്നു[a] എന്നു ഞങ്ങൾ നിഗമനം ചെയ്യുന്നു.
  to: കാരണം, ഒരു വ്യക്തി വിശ്വാസത്താൽ ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളിൽനിന്ന് വേറിട്ട് നീതീകരിക്കപ്പെടുന്നു എന്നു ഞങ്ങൾ നിഗമനം ചെയ്യുന്നു[a].
  rationale: The revision corrects the explanatory force of γάρ, makes χωρὶς unambiguously separative, and renders generic ἄνθρωπον with inclusive modern Malayalam. It retains the established rendering ‘നീതീകരിക്കപ്പെടുന്നു’ and its lexical-alternative footnote.
