id: ROM.3.28
reference: Romans 3:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: ml
  text: കാരണം, ഒരു വ്യക്തി വിശ്വാസത്താൽ ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളിൽനിന്ന് വേറിട്ട് നീതീകരിക്കപ്പെടുന്നു എന്നു ഞങ്ങൾ നിഗമനം ചെയ്യുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: ഞങ്ങൾ നിഗമനം ചെയ്യുന്നു
  rationale: പൗലൊസിന്റെ യുക്തിപൂർവമായ വിലയിരുത്തലിനെയും നിഗമനത്തെയും സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വാദത്തിന്റെ ഒഴുക്കിന് സ്വാഭാവികമാണ്.
- source_word: γάρ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദവുമായി ബന്ധപ്പെടുത്തി ഇവിടെ നിഗമനപരമായ വിശദീകരണം അവതരിപ്പിക്കുന്നു; മലയാളത്തിലെ വാക്യബന്ധത്തിൽ ‘അതുകൊണ്ട്’ സ്വാഭാവികമാണ്, എങ്കിലും ഗ്രീക്കിൽ വിശദീകരണാത്മകമായ γάρ ആണ്.
- source_word: δικαιοῦσθαι
  choice: നീതീകരിക്കപ്പെടുന്നു
  rationale: പൗലൊസിന്റെ പ്രയോഗവുമായി ദൈവശാസ്ത്രപരമായ തുടർച്ച നിലനിർത്തുന്ന സ്ഥാപിത പദമാണ്; പ്രഖ്യാപനപരമായ അർഥവശം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ദത്തിവ് രൂപത്തിന്റെ ഉപാധിസൂചകമായ അർഥം സ്വാഭാവികമായി നൽകുകയും πίστις എന്ന പദത്തിന്റെ വിശ്വാസം/ആശ്രയം എന്ന പരിധി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἄνθρωπον
  choice: ഒരു മനുഷ്യൻ
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായി മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘ഒരു മനുഷ്യൻ’ പുരുഷന്മാർക്ക് മാത്രമായി പരിമിതമാകാതെ മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കാം.
- source_word: χωρὶς
  choice: കൂടാതെ
  rationale: ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളെ ഒഴിവാക്കുന്ന വേർതിരിവ് ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἔργων νόμου
  choice: ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ
  rationale: പൗലൊസിന്റെ സവിശേഷ പ്രയോഗത്തിന്റെ ഔപചാരിക ബന്ധം നിലനിർത്തുന്നു; അതിനെ പൊതുവായ സൽപ്രവൃത്തികളായോ ധാർമികശ്രമമായോ മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: δικαιοῦσθαι എന്ന പദത്തിന്റെ പൗലൊസീയ അർഥവ്യാപ്തി
  choice: നീതീകരിക്കപ്പെടുന്നു
  alternative: നീതിമാനായി പ്രഖ്യാപിക്കപ്പെടുന്നു
  rationale: പ്രധാനപാഠത്തിൽ പരമ്പരാഗതവും കൃത്യവുമായ ദൈവശാസ്ത്രപദം നിലനിർത്തുന്നു; അതിലെ പ്രഖ്യാപനപരമായ/ന്യായവിധിസംബന്ധിയായ വശം അടിക്കുറിപ്പിൽ ഒരു സാധുവായ പര്യായമായി നൽകുന്നു.
- issue: ἄνθρωπον എന്ന പുൽലിംഗരൂപത്തിന്റെ പൊതുവായ പ്രയോഗം
  choice: ഒരു മനുഷ്യൻ
  alternative: ഒരു വ്യക്തി
  rationale: സന്ദർഭത്തിൽ ഇത് പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്നില്ല, മനുഷ്യനെ പൊതുവായി സൂചിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘മനുഷ്യൻ’ ഈ പൊതുവായ പ്രതിനിധാനാർഥം സ്വാഭാവികമായി വഹിക്കുന്നു.
- issue: πίστειയും ἔργων νόμουയും തമ്മിലുള്ള വൈരുധ്യം
  choice: വിശ്വാസത്താൽ… ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ കൂടാതെ
  alternative: വിശ്വാസം മുഖാന്തരം… ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികളിൽനിന്ന് വേറിട്ട്
  rationale: ഉപാധിയും ഒഴിവാക്കലും തമ്മിലുള്ള പൗലൊസീയ വൈരുധ്യം സംരക്ഷിക്കുന്നു; ‘ന്യായപ്രമാണത്തിന്റെ പ്രവൃത്തികൾ’ എന്തെല്ലാമാണെന്ന് വിവർത്തനം തന്നെ നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നീതീകരിക്കപ്പെടുന്നു’, ‘ന്യായപ്രമാണം’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ ദൈവശാസ്ത്രപരമായ കൃത്യതയ്ക്കായി നിലനിർത്തി. ἄνθρωπον പൊതുവായ മനുഷ്യസൂചനയായതിനാൽ ഇംഗ്ലീഷ് പാഠത്തിലെ ലിംഗവ്യാകരണ അടിക്കുറിപ്പ് മലയാളത്തിൽ ആവശ്യമില്ല.
