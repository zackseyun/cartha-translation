id: ROM.3.6
reference: Romans 3:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: ml
  text: ഒരിക്കലുമല്ല! അങ്ങനെയെങ്കിൽ, ദൈവം ലോകത്തെ എങ്ങനെ വിധിക്കും?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമല്ല!
  rationale: പൗലോസ് ശക്തമായി നിരാകരിക്കാൻ ഉപയോഗിക്കുന്ന പതിവുശൈലിയാണിത്. ഗ്രീക്കിലെ ആഗ്രഹസൂചക രൂപം അക്ഷരാർഥത്തിൽ പകർത്താതെ, അതിന്റെ ഊന്നൽ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπεὶ
  choice: അങ്ങനെയെങ്കിൽ
  rationale: നിരസിക്കപ്പെട്ട മുൻധാരണ അംഗീകരിച്ചാൽ ഉണ്ടാകുന്ന യുക്തിപരമായ ഫലത്തെ ഇവിടെ ഈ പദം അവതരിപ്പിക്കുന്നു; ‘അങ്ങനെയെങ്കിൽ’ വാദത്തിന്റെ ഒഴുക്ക് വ്യക്തമായി പകരുന്നു.
- source_word: κρινεῖ
  choice: എങ്ങനെ വിധിക്കും
  rationale: ഭാവികാല നിർദേശകക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘വിധിക്കാൻ കഴിയും’ എന്ന ശേഷിസൂചന അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: κόσμον
  choice: ലോകത്തെ
  rationale: ദൈവിക ന്യായവിധിയുടെ വിഷയമായ ലോകത്തെ വിശാലമായി സൂചിപ്പിക്കുന്ന സാധാരണവും വ്യക്തവുമായ മലയാള തുല്യപദമാണിത്.
theological_decisions:
- issue: μὴ γένοιτο എന്ന പൗലോസിന്റെ നിരാകരണപ്രയോഗത്തിന്റെ ശക്തി
  choice: മുൻനിഗമനത്തെ ശക്തമായി തള്ളുന്ന ‘ഒരിക്കലുമല്ല!’ എന്ന സ്വാഭാവിക പ്രയോഗം
  alternative: ‘അങ്ങനെ ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ!’ എന്ന കൂടുതൽ രൂപാനുസൃത വിവർത്തനം
  rationale: ഉറവിടത്തിലെ ശക്തമായ നിരാകരണം സംരക്ഷിക്കുമ്പോൾ, മലയാളത്തിൽ കൃത്രിമമായ ആഗ്രഹവാക്യമായി കേൾക്കുന്നത് ഒഴിവാക്കുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ഹ്രസ്വമായ വാക്യത്തിന്റെ വാദാത്മക ശക്തിയും അലങ്കാരപ്രശ്നത്തിന്റെ സ്വഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
