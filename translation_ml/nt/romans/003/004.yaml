  to: 'ഒരിക്കലും അങ്ങനെ സംഭവിക്കരുത്! മറിച്ച്, ദൈവം സത്യവാനായിരിക്കട്ടെ; ഓരോ മനുഷ്യനും കള്ളനായിരിക്കട്ടെ. എഴുതിയിരിക്കുന്നതുപോലെ:


    “അങ്ങയുടെ വാക്കുകളിൽ അങ്ങ് നീതിമാനെന്നു തെളിയേണ്ടതിനും[a],


    അങ്ങയെ വിധിക്കുമ്പോൾ അങ്ങ് ജയിക്കേണ്ടതിനും[b].”'
  rationale: The revision removes the unnecessarily explicit ‘be proved’ wording from the opening Greek contrast, while retaining its rhetorical imperative force. It renders δικαιωθῇς in the quotation as God’s being shown to be in the right and preserves the alternate forensic wording in the footnote. The passive reading of the final clause, along with the Psalm-based active alternative, remains correctly anchored and explained.
