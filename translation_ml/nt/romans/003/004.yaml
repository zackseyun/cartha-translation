id: ROM.3.4
reference: Romans 3:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: ml
  text: 'ഒരിക്കലും അങ്ങനെ സംഭവിക്കരുത്! മറിച്ച്, ദൈവം സത്യവാനായിരിക്കട്ടെ; ഓരോ മനുഷ്യനും കള്ളനായിരിക്കട്ടെ. എഴുതിയിരിക്കുന്നതുപോലെ:


    “അങ്ങയുടെ വാക്കുകളിൽ അങ്ങ് നീതിമാനെന്നു തെളിയേണ്ടതിനും[a],


    അങ്ങയെ വിധിക്കുമ്പോൾ അങ്ങ് ജയിക്കേണ്ടതിനും[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങ് നീതിമാനെന്നു വിധിക്കപ്പെടേണ്ടതിനും” അല്ലെങ്കിൽ “അങ്ങ് നീതിമാനെന്നു സ്ഥാപിക്കപ്പെടേണ്ടതിനും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അങ്ങ് വിധിക്കുമ്പോൾ.” ഇത് സങ്കീർത്തനം 51:4-ന്റെ എബ്രായ പദപ്രയോഗത്തെ കൂടുതൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; എന്നാൽ റോമർ ലേഖനത്തിലെ ഗ്രീക്ക് പദപ്രയോഗം സ്വാഭാവികമായി “അങ്ങയെ വിധിക്കുമ്പോൾ” എന്നാണ് വായിക്കപ്പെടുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലും അങ്ങനെ സംഭവിക്കരുത്!
  rationale: പൗലോസിന്റെ ശക്തമായ നിരാകരണവും ഗ്രീക്കിലെ ആശംസാരൂപത്തിന്റെ ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: ദൈവം സത്യവാനെന്നു ... തെളിയട്ടെ
  rationale: γινέσθω എന്ന ആജ്ഞാർത്ഥത്തിന്റെ ശക്തി നിലനിർത്തിക്കൊണ്ട്, ദൈവം സത്യവാനായി മാറുന്നു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കി അവിടുത്തെ സത്യസന്ധത വെളിപ്പെടുന്നു എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: πᾶς ... ἄνθρωπος
  choice: ഓരോ മനുഷ്യനും
  rationale: ἄνθρωπος ഇവിടെ പുരുഷനെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; മനുഷ്യരെ പൊതുവായി, വിതരണാർഥത്തിൽ സൂചിപ്പിക്കുന്ന πᾶς എന്നതും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ψεύστης
  choice: കള്ളൻ
  rationale: കള്ളം പറയുന്നവനെയോ അസത്യനെയോ സൂചിപ്പിക്കുന്ന നാമത്തിന്റെ നേരിട്ടും പ്രചാരമുള്ളതുമായ മലയാളരൂപം.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവു സൂത്രവാക്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
- source_word: δικαιωθῇς
  choice: നീതിമാനെന്നു വിധിക്കപ്പെടുക
  rationale: ദൈവം നീതിമാനായി മാറുന്നു എന്നല്ല, അവിടുന്ന് നീതിമാനാണെന്ന് ന്യായവിധിയിൽ സ്ഥിരീകരിക്കപ്പെടുന്നു എന്ന forensic അർഥം വ്യക്തമാക്കുന്നു.
- source_word: λόγοις
  choice: വാക്കുകളിൽ
  rationale: ഗ്രീക്കിലെ സാധാരണ അർഥവും സങ്കീർത്തന ഉദ്ധരണിയുടെ ഭാഷയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: νικήσεις
  choice: ജയിക്കുക
  rationale: ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ അനുകൂലമായി വിജയിക്കുക എന്ന അർഥം ലളിതവും ശക്തവുമായി നൽകുന്നു.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: അങ്ങയെ വിധിക്കുമ്പോൾ
  rationale: റോമർ ലേഖനത്തിലെ ഗ്രീക്കിനെ സ്വാഭാവികമായി കർമണിപ്രയോഗമായി വായിക്കുന്നു; ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തെക്കുറിച്ചുള്ള δικαιωθῇς എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധമായ അർഥം
  choice: നീതിമാനെന്നു വിധിക്കപ്പെടുക
  alternative: നീതിമാനെന്നു തെളിയുക; നീതിയുള്ളവനെന്നു സ്ഥിരീകരിക്കപ്പെടുക
  rationale: ദൈവം നീതിമാനായി മാറുന്നു എന്ന ആശയം വാക്യം നൽകുന്നില്ല; മനുഷ്യരുടെ അസത്യത്തിന് എതിരായി ദൈവത്തിന്റെ സത്യവും നീതിയും സ്ഥിരീകരിക്കപ്പെടുന്നതാണ് സന്ദർഭം.
- issue: ἐν τῷ κρίνεσθαί σε എന്നതിലെ കർമണി/കർതൃപ്രയോഗ വ്യത്യാസം
  choice: അങ്ങയെ വിധിക്കുമ്പോൾ
  alternative: അങ്ങ് വിധിക്കുമ്പോൾ
  rationale: റോമർ 3:4-ലെ ഗ്രീക്ക് രൂപം സ്വാഭാവികമായി കർമണിപ്രയോഗമാണ്. എന്നാൽ സങ്കീർത്തനം 51:4-ന്റെ എബ്രായ പാഠം കർതൃപ്രയോഗത്തെ കൂടുതൽ നേരിട്ട് പിന്തുണയ്ക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. ഉദ്ധരണിയിലെ ന്യായവിധിസംബന്ധമായ ഭാഷ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നവിധം സൂക്ഷിച്ചിരിക്കുന്നു; യഥാർഥ പാഠവ്യത്യാസവും അർഥസാധ്യതകളും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തി.
