id: ROM.3.10
reference: Romans 3:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “നീതിമാൻ ആരുമില്ല, ഒരുവൻപോലുമില്ല.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: പോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്ന καθὼς γέγραπται എന്ന പ്രയോഗം സ്വാഭാവികവും അർഥസമാനവുമായി നൽകുന്നു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: പെർഫെക്റ്റ് പാസീവിന്റെ പൂർത്തിയായ എഴുത്തും അതിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും മലയാളത്തിലെ പതിവായ ഉദ്ധരണിസൂത്രത്തിലൂടെ സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι
  choice: ':'
  rationale: ഉദ്ധരണിസൂത്രത്തിനു പിന്നാലെ വരുന്ന ὅτι-യെ പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്താതെ ദ്വിബിന്ദുവിലൂടെ ഉദ്ധരണി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: Οὐκ ἔστιν δίκαιος
  choice: നീതിമാൻ ആരുമില്ല
  rationale: അസ്തിത്വനിഷേധത്തിന്റെ സമഗ്രത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായ രൂപം നൽകുന്നു.
- source_word: οὐδὲ εἷς
  choice: ഒരുവൻപോലുമില്ല
  rationale: ഒരൊറ്റ അപവാദംപോലും ഇല്ലെന്ന ഗ്രീക്കിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രസ്താവനയെ വ്യക്തികേന്ദ്രിതമായി ചുരുക്കണമോ, അതോ ഗ്രീക്കിലെ സമഗ്രവും നിരുപാധികവുമായ വ്യാപ്തി നിലനിർത്തണമോ
  choice: നീതിമാൻ ആരുമില്ല
  alternative: ആരും നീതിമാനല്ല
  rationale: ഗ്രീക്കിലെ പരമാവധി പൊതുവായതും സമ്പൂർണവുമായ നിഷേധവും പൗലോസിന്റെ ഉദ്ധരണിയുടെ മൂർച്ചയും നിലനിർത്തുന്നു; അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീതിമാൻ’ എന്ന സ്ഥാപിതമായ വേദപദം ഉപയോഗിച്ചിട്ടുണ്ടെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ലളിതമാണ്.
