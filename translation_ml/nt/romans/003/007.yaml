id: ROM.3.7
reference: Romans 3:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: ml
  text: എന്നാൽ, എന്റെ നുണയിലൂടെ[b] ദൈവത്തിന്റെ സത്യസന്ധത[a] അവന്റെ മഹത്ത്വത്തിനായി[c] വർധിച്ചുവെങ്കിൽ, പിന്നെ ഞാനും ഇപ്പോഴും ഒരു പാപിയെന്ന നിലയിൽ വിധിക്കപ്പെടുന്നത് എന്തുകൊണ്ട്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ദൈവത്തിന്റെ സത്യം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘എന്റെ അസത്യത്തിലൂടെ.’
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘അവന്റെ മഹത്ത്വത്തിലേക്ക്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സത്യസന്ധത
  rationale: റോമർ 3:4–7-ൽ ദൈവം സത്യവാനും മനുഷ്യൻ നുണയനും എന്ന വൈരുധ്യം മുൻനിൽക്കുന്നതിനാൽ, അമൂർത്തമായ ‘സത്യം’ എന്നതിനെക്കാൾ ദൈവത്തിന്റെ സത്യനിഷ്ഠയെ ‘സത്യസന്ധത’ വ്യക്തമായി സൂചിപ്പിക്കുന്നു; മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: എന്റെ നുണയിലൂടെ
  rationale: ἐν ഇവിടെ സ്ഥലസൂചനയേക്കാൾ ഉപാധി അഥവാ മാർഗം സൂചിപ്പിക്കുന്നു. ‘നുണയിലൂടെ’ ആ ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ψεύσματι
  choice: നുണ
  rationale: ψεύσμα എന്നതിന്റെ നേരിട്ടും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളരൂപമാണിത്; വിശാലമായ ‘അസത്യം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπερίσσευσεν
  choice: വർധിച്ചുവെങ്കിൽ
  rationale: ക്രിയയിലെ പെരുകൽ/സമൃദ്ധിയാകൽ എന്ന ആശയം ലളിതമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; സന്ദർഭത്തിൽ ഇല്ലാത്ത ‘വെളിപ്പെട്ടു’ എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: അവന്റെ മഹത്ത്വത്തിനായി
  rationale: εἰς സൂചിപ്പിക്കാവുന്ന ഫലമോ ലക്ഷ്യമോ കൃത്രിമമായി വേർതിരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τί ἔτι
  choice: ഇപ്പോഴും ... എന്തുകൊണ്ട്
  rationale: ἔτι സൂചിപ്പിക്കുന്ന തുടരുന്ന അവസ്ഥ മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κἀγὼ
  choice: ഞാനും
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപത്തിലെ കൂട്ടിച്ചേർക്കൽഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: κρίνομαι
  choice: വിധിക്കപ്പെടുന്നത്
  rationale: വർത്തമാനകാല കർമണി പ്രയോഗം നിലനിർത്തുകയും അർഥത്തെ മുൻകൂട്ടി ‘ശിക്ഷാവിധി’ എന്ന അന്തിമ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὡς ἁμαρτωλὸς
  choice: ഒരു പാപിയെന്ന നിലയിൽ
  rationale: ὡς എന്നതിന്റെ ‘എന്ന നിലയിൽ’ എന്ന ഭാവവും ἁμαρτωλός എന്ന വ്യക്തിസൂചനയും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ എന്നത് അമൂർത്തമായ ‘ദൈവത്തിന്റെ സത്യം’ എന്നോ ദൈവത്തിന്റെ നൈതിക ഗുണമായ ‘സത്യസന്ധത’ എന്നോ വിവർത്തനം ചെയ്യണമോ എന്നത്.
  choice: ദൈവത്തിന്റെ സത്യസന്ധത
  alternative: ദൈവത്തിന്റെ സത്യം
  rationale: അടുത്ത സന്ദർഭത്തിൽ ദൈവത്തിന്റെ സത്യനിഷ്ഠയും മനുഷ്യന്റെ നുണയും തമ്മിലുള്ള വൈരുധ്യം ഉള്ളതിനാൽ ‘സത്യസന്ധത’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു. എന്നാൽ ഗ്രീക്കിലെ വിശാലമായ അർഥസാധ്യത നഷ്ടപ്പെടാതിരിക്കാൻ ‘ദൈവത്തിന്റെ സത്യം’ അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: κρίνομαι അന്തിമ ശിക്ഷാവിധിയെയാണോ പൊതുവായ വിധിനിർണയത്തെയാണോ സൂചിപ്പിക്കുന്നത്.
  choice: വിധിക്കപ്പെടുന്നത്
  alternative: കുറ്റം വിധിക്കപ്പെടുന്നത് / ശിക്ഷിക്കപ്പെടുന്നത്
  rationale: ഗ്രീക്ക് ക്രിയ ഇവിടെ സ്വതവേ അന്തിമ ശിക്ഷ എന്ന അർഥത്തിലേക്ക് നിർബന്ധിക്കുന്നില്ല. അതിനാൽ വാദത്തിലെ ദൈവനീതിയെക്കുറിച്ചുള്ള സംഘർഷം പരിഹരിക്കാതെ പൊതുവായ ‘വിധിക്കപ്പെടുക’ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ചോദ്യംരൂപം ഉപയോഗിച്ചു. വാക്യത്തിന്റെ വാദാത്മക സ്വഭാവവും നിബന്ധനയും തുടരുന്ന വിധിനിർണയത്തിന്റെ ഭാവവും നിലനിർത്തി. ‘സത്യസന്ധത’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; മുഖ്യപാഠത്തിന്റെ പ്രവാഹം തടസ്സപ്പെടുത്താതെ പ്രധാന പദസാധ്യതകൾ അടിക്കുറിപ്പുകളിൽ നൽകി.
