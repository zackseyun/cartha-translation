  source_fidelity: ഗ്രീക്ക് നിബന്ധനയും വാദാത്മക ചോദ്യവും വിശ്വസ്തമായി പുനരാവിഷ്കരിച്ചിരിക്കുന്നു. ἐν-ന്റെ ഉപാധി/മാർഗഭാവം ‘എന്റെ നുണയിലൂടെ’ എന്നതിൽ, κἀγώ-യുടെ കൂട്ടിച്ചേർക്കൽഭാവം ‘ഞാനും’ എന്നതിൽ, κρίνομαι-യുടെ വർത്തമാന കർമണിഭാവം ‘വിധിക്കപ്പെടുന്നത്’ എന്നതിൽ നിലനിൽക്കുന്നു. ‘വർധിച്ചുവെങ്കിൽ’ ἐπερίσσευσεν-ന്റെ പെരുകൽഭാവം യോജ്യമായി നൽകുന്നു.
