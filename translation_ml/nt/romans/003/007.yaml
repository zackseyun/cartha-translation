  terminology: ‘ദൈവത്തിന്റെ സത്യസന്ധത’ ഈ സന്ദർഭത്തിലെ ദൈവത്തിന്റെ സത്യനിഷ്ഠ/വിശ്വസ്തതയും മനുഷ്യന്റെ നുണയും തമ്മിലുള്ള വൈരുധ്യം നന്നായി പ്രകടമാക്കുന്നു. ‘ദൈവത്തിന്റെ സത്യം’ എന്ന വിശാലമായ പദസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിട്ടുണ്ട്. ‘മഹത്ത്വത്തിനായി’ εἰς τὴν δόξαν αὐτοῦ-വിന്റെ ലക്ഷ്യ/ഫലഭാവത്തിനു സ്വാഭാവികമായ രൂപമാണ്.
