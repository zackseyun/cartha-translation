id: ROM.3.19
reference: Romans 3:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: ml
  text: ന്യായപ്രമാണം പറയുന്നതെല്ലാം ന്യായപ്രമാണത്തിന്റെ കീഴിലുള്ളവരോടാണ്[a] സംസാര Jennings?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: നാം അറിയുന്നു
  rationale: Οἴδαμεν എന്നത് പങ്കിട്ട അറിവിനെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല പ്രസ്താവനയായി നൽകി. δέ ഇവിടെ ശക്തമായ വൈരുധ്യമല്ലാത്തതിനാൽ മലയാളത്തിൽ അനാവശ്യമായ ‘എന്നാൽ’ ചേർത്തില്ല.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിലെ അംഗീകൃത ദൈവിക നിയമത്തെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൻ കീഴിലുള്ളവർ
  rationale: അക്ഷരാർഥം ‘ന്യായപ്രമാണത്തിലുള്ളവർ’ എന്നാണെങ്കിലും, അതിന്റെ അധികാരപരിധിയിൽ ഉള്ളവർ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: λέγει … λαλεῖ
  choice: പറയുന്നു … സംസാരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ രണ്ട് വ്യത്യസ്ത ക്രിയകളായ λέγει, λαλεῖ എന്നിവ തമ്മിലുള്ള വ്യത്യാസം മലയാളത്തിലും നിലനിർത്തി.
- source_word: ἵνα
  choice: …വേണ്ടതിനും …വേണ്ടതിനുമാണ്
  rationale: നിയമം സംസാരിക്കുന്നതിന്റെ ഉദ്ദേശ്യഫലം വ്യക്തമാക്കുന്ന ഗ്രീക്ക് ഉദ്ദേശ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിച്ചു.
- source_word: πᾶν στόμα φραγῇ
  choice: ഓരോ വായും അടയ്ക്കപ്പെടുക
  rationale: സ്വയം ന്യായീകരിച്ച് മറുപടി പറയാനാകാത്ത ന്യായവിധിസംബന്ധമായ ദൃശ്യരൂപം മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: ὑπόδικος γένηται
  choice: കണക്കു ബോധിപ്പിക്കേണ്ട നിലയിലാകുക
  rationale: ὑπόδικος എന്ന പദത്തിന്റെ നിയമപരമായ ഉത്തരവാദിത്വവും γένηται എന്നതിലെ ആ നിലയിലാകുന്ന ഭാവവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു; ‘കുറ്റക്കാരനായി വിധിക്കപ്പെടുക’ എന്ന കൂടുതൽ ശക്തമായ അർഥം പ്രധാനവാചകത്തിൽ നിർബന്ധിച്ചില്ല.
- source_word: πᾶς ὁ κόσμος
  choice: ലോകം മുഴുവൻ
  rationale: ദൈവത്തിന്റെ മുമ്പിൽ വരുന്ന സകല മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന സമഗ്ര വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: ὑπόδικος-നോടൊപ്പമുള്ള ദാതിവ് ദൈവത്തോടുള്ള ഉത്തരവാദിത്വമായി നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὑπόδικος എന്നതിന്റെ ദൈവിക ന്യായവിധിയോടുള്ള നിയമപരമായ ശക്തി
  choice: ലോകം മുഴുവൻ ദൈവത്തോടു കണക്കു ബോധിപ്പിക്കേണ്ട നിലയിലാകുന്നു
  alternative: ലോകം മുഴുവൻ ദൈവത്തിന്റെ ന്യായവിധിക്ക് വിധേയമാകുന്നു / ദൈവസന്നിധിയിൽ കുറ്റക്കാരായി കണ്ടെത്തപ്പെടുന്നു
  rationale: ഈ പദം ദൈവത്തിന്റെ ന്യായാസനത്തിനു മുമ്പിലുള്ള സർവലോക ഉത്തരവാദിത്വം സ്ഥാപിക്കുന്നു. ‘കുറ്റക്കാരായി കണ്ടെത്തപ്പെടുന്നു’ എന്നത് സാധ്യതയുള്ള സന്ദർഭാർഥമായിരുന്നാലും, പദം സ്വതവേ നിർബന്ധിക്കുന്നതിനെക്കാൾ ശക്തമായ അന്തിമവിധി പ്രധാനവാചകത്തിൽ ചേർക്കാതിരിക്കാൻ വിശാലമായ നിയമപരമായ അർഥം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ ദൈവശാസ്ത്രപദം നിലനിർത്തിയെങ്കിലും, വാക്യഘടന മലയാളത്തിന്റെ സ്വാഭാവിക ക്രമത്തിലാക്കി. ഗ്രീക്കിലെ നിയമപരമായ ദൃശ്യരൂപവും ഉദ്ദേശ്യഘടനയും സംരക്ഷിച്ചു; ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
