  revision_rationale: 'A correction is required for naturalness and to remove the redundant repetition of the source verb. The revised rendering should retain the law’s speech to those under its jurisdiction and express the two coordinated purposes directly: every mouth being stopped and the whole world becoming accountable to God. Footnotes should preserve the literal alternative for τοῖς ἐν τῷ νόμῳ and concise lexical alternatives for the judicial expressions.'
