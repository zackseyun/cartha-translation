id: ROM.3.11
reference: Romans 3:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: ml
  text: മനസ്സിലാക്കുന്നവൻ ആരുമില്ല; ദൈവത്തെ അന്വേഷിക്കുന്നവൻ[a] ആരുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെ തേടുന്നവൻ” അല്ലെങ്കിൽ “ദൈവത്തെ തേടിയന്വേഷിക്കുന്നവൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: മനസ്സിലാക്കുന്നവൻ
  rationale: അറിവോടെയും ഉൾക്കാഴ്ചയോടെയും ഗ്രഹിക്കുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκζητῶν
  choice: അന്വേഷിക്കുന്നവൻ
  rationale: ദൈവത്തെ തേടുക എന്ന അടിസ്ഥാനാർഥവും സംയുക്തക്രിയയ്ക്കുണ്ടാകാവുന്ന ഊന്നലും ഈ പദം സംക്ഷിപ്തമായി വഹിക്കുന്നു; കൂടുതൽ ശക്തമായ ഭാവം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐκ ἔστιν
  choice: ആരുമില്ല
  rationale: ഗ്രീക്കിലെ സമ്പൂർണവും സാർവത്രികവുമായ നിഷേധത്തെ സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: മനസ്സിലാക്കുന്നവൻ / അന്വേഷിക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകൃത്‌രൂപങ്ങളെ മലയാളത്തിൽ സ്വാഭാവികമായ കർത്തൃനാമരൂപങ്ങളായി നൽകുന്നു.
- source_word: τὸν θεόν
  choice: ദൈവത്തെ
  rationale: സന്ദർഭത്തിലെ നിർദിഷ്ട ദൈവസൂചന മലയാളത്തിൽ പതിവായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ഉദ്ധരണിശൃംഖലയിലെ നിഷേധത്തിന്റെ വ്യാപ്തി
  choice: രണ്ടു വാക്യഭാഗങ്ങളിലും ‘ആരുമില്ല’ എന്ന നിരുപാധികമായ ഭാഷ നിലനിർത്തി.
  alternative: ‘യഥാർഥത്തിൽ മനസ്സിലാക്കുന്നവൻ ആരുമില്ല; സത്യമായി ദൈവത്തെ അന്വേഷിക്കുന്നവൻ ആരുമില്ല’ എന്ന വ്യാഖ്യാനാത്മക മൃദൂകരണം.
  rationale: ഗ്രീക്ക് പാഠം വ്യക്തമായ സാർവത്രിക നിഷേധമാണ് അവതരിപ്പിക്കുന്നത്; അതിലേക്ക് ഗുണനിർണയപരമായ വിശേഷണങ്ങൾ ചേർക്കുന്നത് പാഠത്തിലെ തീവ്രതയെ വ്യാഖ്യാനിച്ച് പരിമിതപ്പെടുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. സമാന്തരമായ ഗ്രീക്ക് വാക്യഘടന പ്രതിഫലിപ്പിക്കാൻ രണ്ടു ഭാഗങ്ങളിലും ‘ആരുമില്ല’ ആവർത്തിച്ചിട്ടുണ്ട്. ഇംഗ്ലീഷ് മാതൃകയിലെ അടിക്കുറിപ്പുചിഹ്നം അർഥപരമായി ബന്ധപ്പെട്ട ἐκζητῶν എന്ന പദത്തിന്റെ മലയാളപരിഭാഷയ്ക്കരികിൽ സ്ഥാപിച്ചിട്ടുണ്ട്.
