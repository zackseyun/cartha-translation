revisions:
- from: അവനെ ദൈവം അവന്റെ രക്തത്തിലുള്ള വിശ്വാസത്തിലൂടെ പാപപരിഹാരയാഗമായി[a] പരസ്യമായി അവതരിപ്പിച്ചു[b]. മുമ്പ് ചെയ്ത പാപങ്ങളെ ദൈവം ശിക്ഷിക്കാതെ വിട്ടതിനാൽ, തന്റെ നീതി[c] വെളിപ്പെടുത്താനായിരുന്നു ഇത്.
  to: അവനെ ദൈവം പാപപരിഹാരബലിയായി[a] പരസ്യമായി അവതരിപ്പിച്ചു—അവന്റെ രക്തത്തിൽ വിശ്വസിക്കുന്നതിലൂടെ[b]. മുമ്പ് ചെയ്ത പാപങ്ങളെ ദൈവം ശിക്ഷിക്കാതെ വിട്ടതിനാൽ, തന്റെ നീതി[c] വെളിപ്പെടുത്താനായിരുന്നു ഇത്.
