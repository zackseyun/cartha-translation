id: ROM.3.25
reference: Romans 3:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: ml
  text: അവനെ ദൈവം പാപപരിഹാരബലിയായി[a] പരസ്യമായി അവതരിപ്പിച്ചു—അവന്റെ രക്തത്തിൽ വിശ്വസിക്കുന്നതിലൂടെ[b]. മുമ്പ് ചെയ്ത പാപങ്ങളെ ദൈവം ശിക്ഷിക്കാതെ വിട്ടതിനാൽ, തന്റെ നീതി[c] വെളിപ്പെടുത്താനായിരുന്നു ഇത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദൈവകോപശമനം വരുത്തുന്ന ബലി” എന്നും വിവർത്തനം ചെയ്യാം; അല്ലെങ്കിൽ പഴയനിയമത്തിലെ പ്രയോഗമനുസരിച്ച്, പാപപരിഹാരരക്തം തളിച്ചിരുന്ന നിയമപെട്ടകത്തിന്റെ പൊൻമൂടിയായ “കൃപാസനം” എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വാസത്തിലൂടെ, അവന്റെ രക്തത്താൽ” എന്നും വാക്യം ബന്ധിപ്പിക്കാം. അതായത്, വിശ്വാസം സ്വീകരിക്കുന്ന മാർഗവും അവന്റെ രക്തം പാപപരിഹാരത്തിന്റെ മാർഗവും ആണെന്ന വായനയും സാധ്യമാണ്.
    reason: alternative_reading
  - marker: c
    text: അഥവാ “ന്യായം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: പരസ്യമായി അവതരിപ്പിച്ചു
  rationale: സന്ദർഭത്തിൽ ദൈവം ക്രിസ്തുവിനെ എല്ലാവരുടെയും മുമ്പിൽ വെളിവായി മുന്നോട്ടുവെച്ചുവെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘മുൻകൂട്ടി നിശ്ചയിച്ചു’ എന്ന മറ്റൊരു സാധ്യത അനാവശ്യമായി മുഖ്യവാചകത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: ἱλαστήριον
  choice: പാപപരിഹാരയാഗം
  rationale: പാപപരിഹാരത്തിന്റെ ബലിപരമായ പ്രവർത്തനം സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നൽകുന്നു; ദൈവകോപശമനം, കൃപാസനം എന്നീ പ്രധാന വ്യാഖ്യാനസാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: διὰ πίστεως
  choice: വിശ്വാസത്തിലൂടെ
  rationale: διά + ജനിറ്റീവിന്റെ മാധ്യമാർഥവും πίστις എന്നതിന്റെ സാധാരണ പൗലോസ് പ്രയോഗവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: അവന്റെ രക്തത്തിലുള്ള
  rationale: ഗ്രീക്കിലെ ἐν എന്ന ബന്ധം ഔപചാരികമായി സംരക്ഷിച്ച് വിശ്വാസം ക്രിസ്തുവിന്റെ രക്തത്തോടു ബന്ധപ്പെടുന്ന മുഖ്യവായന നൽകുന്നു; ഉപകരണാർഥത്തിലുള്ള മറ്റൊരു ഘടന അടിക്കുറിപ്പിൽ ചേർക്കുന്നു.
- source_word: εἰς ἔνδειξιν
  choice: വെളിപ്പെടുത്താനായിരുന്നു
  rationale: ഉദ്ദേശ്യം അല്ലെങ്കിൽ ഫലം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: ദൈവത്തിന്റെ righteousness/justice എന്നീ പരസ്പരം ചേർന്ന അർഥതലങ്ങൾ മലയാളത്തിലെ ‘നീതി’ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു; ‘ന്യായം’ എന്ന ഊന്നൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πάρεσιν
  choice: ശിക്ഷിക്കാതെ വിട്ടതിനാൽ
  rationale: പൂർണമായ ക്ഷമ എന്ന ആശയത്തിലേക്ക് ലയിപ്പിക്കാതെ, മുൻപുണ്ടായ പാപങ്ങൾക്ക് അപ്പോൾ ശിക്ഷ നടപ്പാക്കാതെ കടന്നുപോയത് എന്ന പ്രത്യേക അർഥം വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: മുമ്പ് ചെയ്ത പാപങ്ങളെ
  rationale: കാലപരമായ മുൻഗണനയും പാപങ്ങൾ ചെയ്തുകഴിഞ്ഞവയാണെന്ന കൃതന്തഭാവവും ലളിതവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: ἱλαστήριον എന്ന വിവാദപദത്തിന്റെ വിവർത്തനം
  choice: പാപപരിഹാരയാഗം
  alternative: ദൈവകോപശമനം വരുത്തുന്ന ബലി; കൃപാസനം
  rationale: ബലി, പാപപരിഹാരം, ദൈവസന്നിധിയിലെ പരിഹാരസ്ഥലം എന്നീ അർഥസാധ്യതകളിൽ ഒന്നിനെ മാത്രം സിദ്ധാന്തപരമായി നിർബന്ധിക്കാതെ, മുഖ്യവാചകം സുലഭമാക്കുകയും മറ്റുള്ളവ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι എന്നതിന്റെ വാക്യഘടന
  choice: അവന്റെ രക്തത്തിലുള്ള വിശ്വാസത്തിലൂടെ
  alternative: വിശ്വാസത്തിലൂടെ, അവന്റെ രക്തത്താൽ
  rationale: മുഖ്യവായനയിൽ വിശ്വാസത്തെ ക്രിസ്തുവിന്റെ രക്തത്തോട് ബന്ധിപ്പിക്കുന്നു; എന്നാൽ ἐν τῷ αὐτοῦ αἵματι എന്നത് പരിഹാരപ്രവൃത്തിയുടെ മാർഗം സൂചിപ്പിക്കാമെന്ന യഥാർഥ വാക്യഘടനാസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: ദൈവത്തെ സംബന്ധിച്ച δικαιοσύνη
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ ദൈവത്തിന്റെ നീതിമത്തതയും ശരിയായ പ്രവർത്തനവും ഉൾക്കൊള്ളുന്നു; ശിക്ഷാവിധിയിലെ justice എന്ന പ്രത്യേക ഊന്നൽ ‘ന്യായം’ എന്ന അടിക്കുറിപ്പിലൂടെ കാണിക്കുന്നു.
- issue: πάρεσις എന്നത് ക്ഷമയോ താൽക്കാലികമായി കടന്നുപോകലോ
  choice: ശിക്ഷിക്കാതെ വിട്ടത്
  alternative: കടന്നുപോയത്; കണക്കിലെടുക്കാതെ വിട്ടത്
  rationale: ἄφεσις എന്ന പൂർണക്ഷമയുടെ പദവുമായി ഇതിനെ ഒന്നാക്കാതെ, മുൻകാല പാപങ്ങൾക്കുള്ള ശിക്ഷ അപ്പോൾ നടപ്പാക്കാതിരുന്നുവെന്ന പദത്തിന്റെ പ്രത്യേകത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘പാപപരിഹാരയാഗം’ പോലുള്ള പരിചിതമായ ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും സാങ്കേതികമായ ‘പ്രൊപിഷിയേഷൻ’ ഒഴിവാക്കി. ഗ്രീക്ക് വാക്യത്തിലെ ദീർഘഘടന മലയാളത്തിലെ വ്യക്തതയ്ക്കായി രണ്ട് വാക്യങ്ങളാക്കി; താർക്കികബന്ധം മാറ്റിയിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
