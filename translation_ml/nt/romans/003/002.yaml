id: ROM.3.2
reference: Romans 3:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: ml
  text: എല്ലാ വിധത്തിലും ഏറെയുണ്ട്. കാരണം, ഒന്നാമതായി, ദൈവത്തിന്റെ അരുളപ്പാടുകൾ[a] അവർക്കു ഏൽപ്പിക്കപ്പെട്ടു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന്റെ വചനങ്ങൾ.”
    reason: λόγια എന്നതിന് ദൈവിക അരുളപ്പാടുകൾ എന്ന പ്രത്യേക അർഥമുണ്ടെങ്കിലും, കൂടുതൽ പൊതുവായി ‘വചനങ്ങൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
lexical_decisions:
- source_word: πολὺ
  choice: വളരെ
  rationale: മുൻവാക്യത്തിൽ ചോദിച്ച പ്രയോജനത്തിന്റെ അളവിനെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപ്രയോഗമാണ്; സംക്ഷിപ്തവും സ്വാഭാവികവുമായി അതേ ഉത്തരം നൽകുന്നു.
- source_word: κατὰ πάντα τρόπον
  choice: എല്ലാ വിധത്തിലും
  rationale: പ്രയോജനം സമഗ്രമാണെന്ന ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന പ്രയോഗം.
- source_word: πρῶτον μὲν γὰρ
  choice: കാരണം, ഒന്നാമതായി
  rationale: γὰρ നൽകുന്ന വിശദീകരണബന്ധവും πρῶτον μὲν ആരംഭിക്കുന്ന ആദ്യ കാരണവും നിലനിർത്തുന്നു; പിന്നാലെ ഉടൻ രണ്ടാമത്തെ ഇനം വരാത്തതുകൊണ്ടുള്ള മൂലപാഠത്തിന്റെ പ്രസംഗഘടന പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ἐπιστεύθησαν
  choice: അവർക്കു ഭരമേൽപ്പിക്കപ്പെട്ടു
  rationale: ഇവിടെ πιστεύω എന്നത് ‘വിശ്വസിച്ചു’ എന്നല്ല, ഉത്തരവാദിത്വത്തോടെ ഏൽപ്പിച്ചു എന്ന അർഥത്തിലാണ്. നിഷ്ക്രിയരൂപം നിലനിർത്തി ദൈവത്തെ ക്രിയയുടെ കർത്താവായി പാഠത്തിൽ പുതുതായി ചേർക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: λόγια
  choice: അരുളപ്പാടുകൾ
  rationale: ദൈവിക വെളിപ്പെടുത്തലുകളെയോ പ്രഖ്യാപനങ്ങളെയോ സൂചിപ്പിക്കുന്ന λόγιαയുടെ പ്രത്യേക ഭാവം, സാധാരണ ‘വാക്കുകൾ’ എന്നതിനെക്കാൾ വ്യക്തമായി നൽകുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഉടമസ്ഥതയോ ഉറവിടമോ സൂചിപ്പിക്കാവുന്ന ഗ്രീക്ക് ഷഷ്ഠീവिभക്തിയെ നേരിട്ടും വ്യാഖ്യാനഭാരം കൂടാതെയും നൽകുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭരമേൽപ്പിക്കപ്പെട്ടു’ എന്നത് ഏൽപ്പിക്കപ്പെട്ട ഉത്തരവാദിത്വത്തിന്റെ ഭാവം വ്യക്തമാക്കുന്നു; ‘അരുളപ്പാടുകൾ’ ദൈവിക വെളിപ്പെടുത്തലിനെ സൂചിപ്പിക്കുന്ന സഭാഭേദാതീതമായ പദമായി ഉപയോഗിച്ചു.
