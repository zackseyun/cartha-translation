  to: എല്ലാ വിധത്തിലും ഏറെയുണ്ട്. കാരണം, ഒന്നാമതായി, ദൈവത്തിന്റെ അരുളപ്പാടുകൾ[a] അവർക്കു ഏൽപ്പിക്കപ്പെട്ടു.
