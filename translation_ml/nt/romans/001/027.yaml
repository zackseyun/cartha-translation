revisions:
- from: അതുപോലെതന്നെ, പുരുഷന്മാരും[a] സ്ത്രീയുമായുള്ള സ്വാഭാവിക ലൈംഗികബന്ധം[b] ഉപേക്ഷിച്ച്, പരസ്പരമുള്ള ആഗ്രഹത്താൽ ജ്വലിച്ചു[c]. പുരുഷന്മാർ പുരുഷന്മാരോടുകൂടെ ലജ്ജാകരമായ പ്രവൃത്തി ചെയ്തുകൊണ്ട്[d], തങ്ങളുടെ വഴിതെറ്റലിനു തക്ക പ്രതിഫലം തങ്ങളിൽത്തന്നെ ഏറ്റുവാങ്ങി[e].
  to: അതുപോലെതന്നെ, പുരുഷന്മാരും[a] സ്ത്രീയുമായുള്ള സ്വാഭാവിക ലൈംഗികബന്ധം[b] ഉപേക്ഷിച്ച്, പരസ്പരത്തോടുള്ള തങ്ങളുടെ ആഗ്രഹത്തിൽ ജ്വലിച്ചു[c]. പുരുഷന്മാർ പുരുഷന്മാരോടുകൂടെ ലജ്ജാകരമായ പ്രവൃത്തി ചെയ്തുകൊണ്ട്[d], തങ്ങളുടെ വഴിതെറ്റലിനു തക്ക പ്രതിഫലം തങ്ങളിൽത്തന്നെ ഏറ്റുവാങ്ങി[e].
  rationale: Only the rendering of εἰς ἀλλήλους has been adjusted. The revision restores the reciprocal direction (‘toward one another’) and retains the Greek’s sense that they were inflamed ‘in their desire,’ while leaving the draft’s otherwise sound terminology, register, and measured treatment of the verse intact. Footnote c is correspondingly aligned with the revised wording.
  reviewer_model: gpt-5.6-terra
