id: ROM.1.27
reference: Romans 1:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: ml
  text: അതുപോലെതന്നെ, പുരുഷന്മാരും[a] സ്ത്രീയുമായുള്ള സ്വാഭാവിക ലൈംഗികബന്ധം[b] ഉപേക്ഷിച്ച്, പരസ്പരത്തോടുള്ള തങ്ങളുടെ ആഗ്രഹത്തിൽ ജ്വലിച്ചു[c]. പുരുഷന്മാർ പുരുഷന്മാരോടുകൂടെ ലജ്ജാകരമായ പ്രവൃത്തി ചെയ്തുകൊണ്ട്[d], തങ്ങളുടെ വഴിതെറ്റലിനു തക്ക പ്രതിഫലം തങ്ങളിൽത്തന്നെ ഏറ്റുവാങ്ങി[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പുരുഷന്മാർ’ എന്നും ‘സ്ത്രീ’ എന്നും പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്ക് പദങ്ങൾ കൂടുതൽ അക്ഷരാർഥത്തിൽ ‘ആണുകൾ’ എന്നും ‘പെൺ’ എന്നും വരാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘സ്ത്രീയുടെ സ്വാഭാവിക ഉപയോഗം.’ സന്ദർഭത്തിൽ ഇത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: c
    text: ‘പരസ്പരത്തോടുള്ള തങ്ങളുടെ കാമാസക്തിയിൽ കത്തിജ്വലിച്ചു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: d
    text: ‘ലജ്ജാകരമായത് ചെയ്തുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: e
    text: ‘തങ്ങളുടെ വഴിതെറ്റലിന് ലഭിക്കേണ്ട പ്രതിഫലം’ അല്ലെങ്കിൽ ‘അർഹമായ തിരിച്ചടി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: പുരുഷന്മാർ / സ്ത്രീ
  rationale: ഗ്രീക്കിൽ സാധാരണ ബന്ധസൂചക പദങ്ങളേക്കാൾ ലിംഗസൂചകമായ ‘ആൺ / പെൺ’ പദങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്. മലയാളത്തിൽ ‘ആണുങ്ങൾ / പെണ്ണ്’ എന്നത് ഈ ജൈവസൂചന കൂടുതൽ നേരിട്ട് നൽകുമെങ്കിലും ഈ സന്ദർഭത്തിൽ അനാവശ്യമായി പരുഷവും സംസാരഭാഷാപരവുമാകാം; അതിനാൽ മാന്യവും സ്വാഭാവികവുമായ ‘പുരുഷന്മാർ / സ്ത്രീ’ സ്വീകരിച്ച് മൂലപദങ്ങളുടെ പ്രത്യേകത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
- source_word: ἀφέντες
  choice: ഉപേക്ഷിച്ച്
  rationale: പ്രധാനക്രിയയ്ക്കു മുമ്പുണ്ടായ വിട്ടുകളയലിനെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: സ്ത്രീയുമായുള്ള സ്വാഭാവിക ലൈംഗികബന്ധം
  rationale: χρῆσις അക്ഷരാർഥത്തിൽ ‘ഉപയോഗം’ എന്നാണെങ്കിലും ഇവിടെ അത് ലൈംഗികബന്ധത്തെ സൂചിപ്പിക്കുന്ന പരോക്ഷപ്രയോഗമാണ്. മലയാളത്തിൽ അക്ഷരാർഥം അസ്വാഭാവികവും തെറ്റിദ്ധരിപ്പിക്കുന്നതുമായതിനാൽ സന്ദർഭാർഥം മുഖ്യവാചകത്തിൽ നൽകി, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους
  choice: പരസ്പരമുള്ള ആഗ്രഹത്താൽ ജ്വലിച്ചു
  rationale: ἐξεκαύθησαν എന്ന ക്രിയയുടെ തീയുടെ രൂപകം നിലനിർത്തുന്നു. ὄρεξις എന്നത് ആഗ്രഹം/കാമാസക്തി എന്ന പരിധിയുള്ളതിനാൽ കൂടുതൽ കുറ്റാരോപകമായ ഒരു പദം നിർബന്ധമാക്കാതെ ‘ആഗ്രഹം’ സ്വീകരിച്ചു.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: പുരുഷന്മാർ പുരുഷന്മാരോടുകൂടെ
  rationale: മൂലത്തിലെ ആവർത്തനവും ‘with’ എന്ന ബന്ധവും നിലനിർത്തുന്നു.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: ലജ്ജാകരമായ പ്രവൃത്തി ചെയ്തുകൊണ്ട്
  rationale: നാമപദത്തിലുള്ള ധാർമ്മിക വിലയിരുത്തൽ നിലനിർത്തുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത പ്രത്യേക പ്രവൃത്തിനാമം ചേർക്കുന്നില്ല.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: തക്ക പ്രതിഫലം
  rationale: ἀντιμισθίαയുടെ അനുരൂപമായ തിരിച്ചുകിട്ടൽ എന്ന ആശയവും ἔδειയുടെ ‘ഉചിതമായ/വേണ്ടിയിരുന്ന’ ഭാവവും സംക്ഷിപ്തമായി നൽകുന്നു. ‘ശിക്ഷ’ എന്നു മാത്രം പറഞ്ഞ് ഫലത്തിന്റെ സ്വഭാവം മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: τῆς πλάνης αὐτῶν ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: തങ്ങളുടെ വഴിതെറ്റലിനു ... തങ്ങളിൽത്തന്നെ ഏറ്റുവാങ്ങി
  rationale: πλάνηയുടെ വഴിതെറ്റൽ/പിശക് ഭാവവും ἑαυτοῖς എന്ന പ്രതിഫലനസർവനാമത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ലിംഗസൂചകമായ മൂലപദങ്ങളെ ബന്ധസൂചക ഭാഷയാക്കി മൃദൂകരിക്കണമോ
  choice: പുരുഷന്മാർ ... സ്ത്രീ ... പുരുഷന്മാർ പുരുഷന്മാരോടുകൂടെ
  alternative: ആണുങ്ങൾ ... പെൺ ... ആണുങ്ങൾ ആണുങ്ങളോടുകൂടെ
  rationale: മൂലത്തിലെ പുരുഷ/സ്ത്രീ വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ രൂപം ഉപയോഗിച്ചു; ഗ്രീക്കിന്റെ കൂടുതൽ ജൈവസൂചകമായ പദപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- issue: ἀσχημοσύνηയുടെ ധാർമ്മിക വിലയിരുത്തൽ എത്രത്തോളം വ്യക്തമാക്കണം
  choice: ലജ്ജാകരമായ പ്രവൃത്തി
  alternative: അശ്ലീലത / സ്വവർഗലൈംഗിക പ്രവൃത്തി
  rationale: മൂലവാചകത്തിലെ ധാർമ്മിക ശക്തി സംരക്ഷിക്കുന്നു; എന്നാൽ ഗ്രീക്ക് നൽകാത്ത ആധുനിക വർഗീകരണമോ കൂടുതൽ നിർദിഷ്ടമായ നാമകരണമോ ചേർക്കുന്നില്ല.
- issue: ἀντιμισθίαയെ ‘ശിക്ഷ’ എന്നു നിർണ്ണയിക്കണമോ
  choice: തക്ക പ്രതിഫലം
  alternative: അർഹമായ ശിക്ഷ
  rationale: പദം അനുരൂപമായ പ്രതിഫലം, തിരിച്ചുകിട്ടൽ, ഫലം എന്നീ ഭാവങ്ങൾ വഹിക്കുന്നു. ‘തക്ക പ്രതിഫലം’ ന്യായവിധിയുടെ ഗൗരവം നിലനിർത്തുമ്പോഴും അതിന്റെ കൃത്യസ്വഭാവം വാചകത്തിൽ ഇല്ലാത്തവിധം നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ലൈംഗികസന്ദർഭം മറച്ചുവയ്ക്കാതെ വ്യക്തമാക്കുന്നു; അതേസമയം സംസാരഭാഷാപരമായ പരുഷതയും മൂലത്തിൽ ഇല്ലാത്ത ആധുനിക സാങ്കേതിക വർഗീകരണങ്ങളും ഒഴിവാക്കുന്നു. ഗ്രീക്ക് വാക്യത്തിന്റെ നീണ്ട പങ്കാളിക്രമം വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി, ആശയബന്ധം നിലനിർത്തി.
