id: ROM.1.5
reference: Romans 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: ml
  text: അവന്റെ നാമത്തിനുവേണ്ടി സകല ജനതകളുടെ ഇടയിൽ[b] വിശ്വാസത്തിന്റെ അനുസരണം[a] ഉണ്ടാകേണ്ടതിന്, അവൻ മുഖാന്തരം ഞങ്ങൾ കൃപയും അപ്പോസ്തലത്വവും പ്രാപിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “വിശ്വാസത്തിൽനിന്ന് ഉളവാകുന്ന അനുസരണം,” അല്ലെങ്കിൽ “വിശ്വാസം തന്നെയാകുന്ന അനുസരണം.”
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ “യഹൂദേതര ജനതകളുടെ ഇടയിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: അവൻ മുഖാന്തരം
  rationale: ജനിറ്റീവോടുകൂടിയ διά ഇവിടെ മധ്യസ്ഥതയെയോ ഉപാധിയെയോ സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ യേശുക്രിസ്തുവിലേക്കുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായി ഈ പ്രയോഗം അർഥം നൽകുന്നു.
- source_word: ἐλάβομεν
  choice: ഞങ്ങൾ … പ്രാപിച്ചു
  rationale: ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ബഹുവചനം അതേപടി നിലനിർത്തുന്നു; ഇത് പൗലോസിനെ മാത്രം സൂചിപ്പിക്കുന്ന ആലങ്കാരിക ബഹുവചനമാണോ, വിശാലമായ കൂട്ടത്തെ സൂചിപ്പിക്കുന്നതാണോ എന്ന് മുഖ്യപാഠത്തിൽ തീർപ്പാക്കുന്നില്ല.
- source_word: χάριν
  choice: കൃപ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ χάρις എന്ന പദത്തിന്റെ പതിവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ തത്തുല്യപദമാണ് ‘കൃപ’.
- source_word: καὶ ἀποστολήν
  choice: അപ്പോസ്തലത്വവും
  rationale: χάριν, ἀποστολήν എന്നീ രണ്ടു സമന്വിത നാമപദങ്ങളെ ഒന്നാക്കി ചുരുക്കാതെ നിലനിർത്തുന്നു. ‘അപ്പോസ്തലത്വം’ ദൈവികമായി നിയോഗിക്കപ്പെട്ട അപ്പോസ്തലന്റെ ചുമതലയും സ്ഥാനവും സൂചിപ്പിക്കുന്നു.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: വിശ്വാസത്തിന്റെ അനുസരണം … ഉണ്ടാകേണ്ടതിന്
  rationale: εἰς ലക്ഷ്യമോ ഉദ്ദേശ്യമോ സൂചിപ്പിക്കുന്നു. ὑπακοὴν πίστεως എന്ന സംക്ഷിപ്ത ജനിറ്റീവ് ഘടനയിലെ യഥാർഥ അർഥവൈവിധ്യം ‘വിശ്വാസത്തിന്റെ അനുസരണം’ എന്ന രൂപത്തിൽ നിലനിർത്തുകയും ലക്ഷ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന്റെ ഇവിടെ യോജിക്കുന്ന പതിവ് പരിഭാഷ ‘വിശ്വാസം’ ആണ്; ‘വിശ്വസ്തത’ പോലുള്ള ഒരു വ്യാഖ്യാനത്തിലേക്ക് മുഖ്യപാഠം ചുരുക്കുന്നില്ല.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: സകല ജനതകളിലും
  rationale: ἔθνη എന്നതിന് ജനതകൾ എന്നും യഹൂദരല്ലാത്തവർ എന്നും അർഥസാധ്യതയുണ്ട്. വിശാലമായ ജനതാസംബന്ധിയായ വ്യാപ്തി മുഖ്യപാഠത്തിൽ സൂക്ഷിക്കുകയും മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: അവന്റെ നാമത്തിനുവേണ്ടി
  rationale: ὑπέρ ഇവിടെ ഉദ്ദേശ്യമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്നു. യേശുവിന്റെ നാമത്തിന്റെ മഹത്വത്തിനും കീർത്തിക്കുംവേണ്ടിയുള്ള പ്രവർത്തനം എന്ന ബൈബിൾസംബന്ധിയായ ഭാരം ഈ സ്വാഭാവിക മലയാളപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὑπακοὴν πίστεως എന്നതിന്റെ വ്യാഖ്യാനം
  choice: വിശ്വാസത്തിന്റെ അനുസരണം
  alternative: വിശ്വാസത്തിൽനിന്ന് ഉളവാകുന്ന അനുസരണം; അല്ലെങ്കിൽ വിശ്വാസം തന്നെയാകുന്ന അനുസരണം
  rationale: ഈ ജനിറ്റീവ് ഘടനയെ വിശ്വാസത്തിൽനിന്നുള്ള അനുസരണമെന്നോ വിശ്വാസം തന്നെയായ അനുസരണമെന്നോ വ്യാഖ്യാനിക്കാം. മുഖ്യപാഠം ഒരു സാധ്യത മാത്രം തിരഞ്ഞെടുത്ത് ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം ഇല്ലാതാക്കാതെ ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും അർഥവൈവിധ്യവും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘വിശ്വാസത്തിന്റെ അനുസരണം’ എന്ന അല്പം സംക്ഷിപ്തമായ രൂപം ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ അർഥവൈവിധ്യം നിലനിർത്താനാണ്; വിശദീകരണസാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. വാക്യത്തിന്റെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി ദീർഘവിരാമംകൊണ്ട് വേർതിരിച്ചു.
