- from: അവൻ മുഖാന്തരം ഞങ്ങൾ കൃപയും അപ്പോസ്തലത്വവും പ്രാപിച്ചു—അവന്റെ നാമത്തിനുവേണ്ടി സകല ജനതകളിലും[b] വിശ്വാസത്തിന്റെ അനുസരണം[a] ഉണ്ടാകേണ്ടതിനാണ് അത്.
