id: ROM.1.17
reference: Romans 1:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: ml
  text: 'കാരണം, അതിൽ ദൈവത്തിന്റെ നീതി[a] വിശ്വാസത്തിൽനിന്ന് വിശ്വാസത്തിലേക്ക്[b] വെളിപ്പെടുന്നു. എഴുതിയിരിക്കുന്നതുപോലെ: “നീതിമാൻ വിശ്വാസത്താൽ ജീവിക്കും.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്തിന്റെ ന്യായം.” “ദൈവത്തിൽനിന്നുള്ള നീതി” എന്നും ഈ പ്രയോഗം മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വാസത്തിൽനിന്ന് വിശ്വാസത്തിലേക്ക്” എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ കൃത്യമായ അർഥം നിർണയിക്കുക ദുഷ്കരമാണ്. “വിശ്വാസത്തിൽനിന്ന് വിശ്വാസത്തിനായി,” “ആരംഭംമുതൽ അവസാനംവരെ വിശ്വാസത്താൽ,” അല്ലെങ്കിൽ “വിശ്വാസത്തിലൂടെ, വിശ്വാസത്തിനായി” എന്നിങ്ങനെയും വ്യാഖ്യാനിക്കാം.
    reason: alternative_reading
  - marker: c
    text: അഥവാ “വിശ്വാസത്താൽ നീതിമാനായവൻ ജീവിക്കും.”
    reason: alternative_reading
  - marker: d
    text: 'ഗ്രീക്കിലെ δὲ എന്ന കണവും ഉൾപ്പെടുത്തി ഇങ്ങനെ വിവർത്തനം ചെയ്യാം: “എന്നാൽ നീതിമാൻ വിശ്വാസത്താൽ ജീവിക്കും.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: ദൈവത്തിന്റെ നീതിയുള്ള സ്വഭാവം, നീതിപൂർവമായ പ്രവർത്തനം, ദൈവം നൽകുന്ന നീതിയുള്ള നില എന്നീ സാധ്യതകളെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്താൻ ‘നീതി’ തിരഞ്ഞെടുത്തു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ഉദ്ദേശ്യപരമായ തുറന്ന സ്വഭാവം കാത്തുസൂക്ഷിക്കുന്നു; ‘ദൈവത്തിൽനിന്നുള്ള’ എന്ന് വ്യാഖ്യാനിച്ച് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: ἐν αὐτῷ
  choice: അതിൽ
  rationale: നപുംസകലിംഗ സർവനാമം മുൻവാക്യത്തിലെ സുവിശേഷത്തെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἀποκαλύπτεται
  choice: വെളിപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ അർഥം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: വിശ്വാസത്തിൽനിന്ന് വിശ്വാസത്തിലേക്ക്
  rationale: ἐκ…εἰς എന്നീ രണ്ടു പൂർവപ്രത്യയങ്ങളുടെ ദിശാസൂചനയും πίστις എന്ന പദത്തിന്റെ ആവർത്തനവും കാത്ത്, ദുഷ്കരമായ പ്രയോഗത്തിന്റെ യഥാർഥ അവ്യക്തത നിലനിർത്തുന്നു.
- source_word: δίκαιος
  choice: നീതിമാൻ
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഏകവചന വിശേഷണത്തിന് മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പരമ്പരാഗത പ്രയോഗം.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: ഹബക്കൂക്ക് ഉദ്ധരണിയിൽ ജീവിക്കുന്നതിന്റെ അടിസ്ഥാനം അഥവാ മാർഗം എന്ന നിലയിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; മറ്റൊരു വാക്യഘടനാപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ζήσεται
  choice: ജീവിക്കും
  rationale: ഭാവികാലത്തിന്റെ ബലം വ്യക്തവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: δικαιοσύνη θεοῦ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: ദൈവത്തിന്റെ നീതി
  alternative: ദൈവത്തിൽനിന്നുള്ള നീതി
  rationale: ഷഷ്ഠീവിഭക്തി ദൈവത്തിന്റെ സ്വന്തം നീതിയെയോ ദൈവവുമായി ബന്ധപ്പെട്ടതോ ദൈവം നൽകുന്നതോ ആയ നീതിയെയോ സൂചിപ്പിക്കാം; മുഖ്യപാഠം ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: ἐκ πίστεως εἰς πίστιν എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: വിശ്വാസത്തിൽനിന്ന് വിശ്വാസത്തിലേക്ക്
  alternative: ആരംഭംമുതൽ അവസാനംവരെ വിശ്വാസത്താൽ; വിശ്വാസത്തിൽനിന്ന് വിശ്വാസത്തിനായി
  rationale: പ്രയോഗം പ്രസിദ്ധമായ വ്യാഖ്യാനപ്രശ്നമാണ്. ഗ്രീക്കിലെ പൂർവപ്രത്യയങ്ങളും ആവർത്തനവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തി ഒരു പ്രത്യേക സിദ്ധാന്തവായന മുഖ്യപാഠത്തിൽ ഉറപ്പിക്കുന്നില്ല.
- issue: ഹബക്കൂക്ക് ഉദ്ധരണിയിലെ ἐκ πίστεως ഏതിനോടാണ് ചേരുന്നത്
  choice: നീതിമാൻ വിശ്വാസത്താൽ ജീവിക്കും
  alternative: വിശ്വാസത്താൽ നീതിമാനായവൻ ജീവിക്കും
  rationale: ഗ്രീക്കിൽ ‘വിശ്വാസത്താൽ’ എന്നത് ‘നീതിമാൻ’ എന്നതിനോടോ ‘ജീവിക്കും’ എന്നതിനോടോ ബന്ധിപ്പിക്കാം. സ്വാഭാവികവും പരമ്പരാഗതവുമായ വായന മുഖ്യപാഠത്തിൽ നൽകി മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ഉദ്ധരണിയിലെ δὲ എന്ന കണത്തിന്റെ പരിഭാഷ
  choice: മുഖ്യപാഠത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  alternative: എന്നാൽ നീതിമാൻ വിശ്വാസത്താൽ ജീവിക്കും
  rationale: δὲ ഇവിടെ ശക്തമായ വിരോധം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; ‘എന്നാൽ’ ചേർത്താൽ പൗലോസിന്റെ പിന്തുണയ്ക്കുന്ന ഉദ്ധരണിയെ തെറ്റായി വിരോധാത്മകമാക്കാം. ഔപചാരികമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘നീതി,’ ‘വിശ്വാസം,’ ‘നീതിമാൻ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും ദുഷ്കരമായ ഗ്രീക്ക് പ്രയോഗങ്ങളുടെ അവ്യക്തത അടിക്കുറിപ്പുകളിൽ തുറന്നുവെച്ചു.
