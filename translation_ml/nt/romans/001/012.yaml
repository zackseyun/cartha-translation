revisions:
- from: അതായത്, നിങ്ങളുടെയും എന്റെയും പരസ്പരമുള്ള വിശ്വാസത്തിലൂടെ നിങ്ങളുടെ ഇടയിൽ നമുക്ക് ഒരുമിച്ചു പ്രോത്സാഹനം ലഭിക്കണമെന്നാണ്.[a]
  to: അതായത്, നിങ്ങളുടെ ഇടയിൽ നിങ്ങളോടൊപ്പം, നിങ്ങളുടെയും എന്റെയും പരസ്പര വിശ്വാസത്തിലൂടെ എനിക്കു പ്രോത്സാഹനം ലഭിക്കേണ്ടതിന്.
