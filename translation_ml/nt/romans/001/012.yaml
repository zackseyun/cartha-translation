id: ROM.1.12
reference: Romans 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: ml
  text: അതായത്, നിങ്ങളുടെ ഇടയിൽ നിങ്ങളോടൊപ്പം, നിങ്ങളുടെയും എന്റെയും പരസ്പര വിശ്വാസത്തിലൂടെ എനിക്കു പ്രോത്സാഹനം ലഭിക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: അതായത്
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളരൂപം.
- source_word: συμπαρακληθῆναι
  choice: നമുക്ക് ഒരുമിച്ചു പ്രോത്സാഹനം ലഭിക്കണം
  rationale: συμ- എന്ന ഘടകം സൂചിപ്പിക്കുന്ന കൂട്ടായ, പരസ്പര പ്രോത്സാഹനം നിലനിർത്തുന്നു. ഗ്രീക്ക് അനന്തക്രിയ കർത്താവിനെ സ്വതവേ വ്യക്തമാക്കാത്തതിനാൽ ഉൾക്കൊള്ളുന്ന ബഹുവചനം സന്ദർഭത്തിലെ പരസ്പരത സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിൽ
  rationale: റോമിലെ വിശ്വാസികളുടെ മധ്യേ സംഭവിക്കുന്ന പ്രോത്സാഹനമെന്ന സാമൂഹിക-സ്ഥാനിക അർഥം നൽകുന്നു.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: പരസ്പരമുള്ള വിശ്വാസത്തിലൂടെ
  rationale: διά സൂചിപ്പിക്കുന്ന മാർഗവും ἐν ἀλλήλοις സൂചിപ്പിക്കുന്ന പരസ്പരബന്ധവും സംരക്ഷിക്കുന്നു; വിശ്വാസം ദൈവത്തിലുള്ള പങ്കിട്ട വിശ്വാസമാണോ പരസ്പരം പ്രകടമാകുന്ന വിശ്വാസമാണോ എന്ന സൂക്ഷ്മമായ അവ്യക്തത പൂർണമായി നീക്കുന്നില്ല.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ πίστις വിശ്വസിക്കുന്ന പ്രതികരണത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; ‘വിശ്വസ്തത’ എന്ന അർഥം ആവശ്യപ്പെടുന്ന നിർണായക സന്ദർഭസൂചനയില്ല.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: നിങ്ങളുടെയും എന്റെയും
  rationale: റോമിലെ വിശ്വാസികളുടെയും പൗലോസിന്റെയും വിശ്വാസത്തിന് തുല്യവും പരസ്പരവുമായ ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: പ്രോത്സാഹനം ഏകദിശയിലാണോ പരസ്പരമാണോ
  choice: പൗലോസിനും റോമിലെ വിശ്വാസികൾക്കും ഒരുമിച്ചു ലഭിക്കുന്ന പരസ്പര പ്രോത്സാഹനം
  alternative: പ്രധാനമായും പൗലോസിന് അവരുടെ ഇടയിൽ ലഭിക്കുന്ന പ്രോത്സാഹനം
  rationale: συμπαρακληθῆναι എന്ന സംയുക്തക്രിയയും ‘നിങ്ങളുടെയും എന്റെയും’ എന്ന സമതുലിതമായ പ്രയോഗവും പരസ്പരതയെ ശക്തമായി സൂചിപ്പിക്കുന്നു; അതിനാൽ വാക്യം അപ്പൊസ്തലനിൽനിന്നുള്ള ഏകദിശ ശുശ്രൂഷയായി ചുരുക്കിയിട്ടില്ല.
- issue: അനന്തക്രിയയുടെ സൂചിത കർത്താവ്
  choice: ‘നമുക്ക്’ എന്ന ഉൾക്കൊള്ളുന്ന ബഹുവചനം മുഖ്യവാചകത്തിൽ ഉപയോഗിച്ചു
  alternative: സന്ദർഭമനുസരിച്ച് ‘എനിക്ക്’ എന്നു നൽകി പൗലോസിന്റെ വ്യക്തിപരമായ അനുഭവം മുൻനിർത്തുക
  rationale: ഗ്രീക്ക് അനന്തക്രിയയിൽ കർത്താവ് രൂപപരമായി രേഖപ്പെടുത്തിയിട്ടില്ല. മുൻസന്ദർഭം പൗലോസിനെ മുൻനിർത്തുന്നുണ്ടെങ്കിലും ക്രിയയുടെ συν- ഘടകം പങ്കിട്ട അനുഭവം സൂചിപ്പിക്കുന്നതിനാൽ മുഖ്യവാചകത്തിൽ സ്വാഭാവികമായ കൂട്ടായ രൂപവും അടിക്കുറിപ്പിൽ മറ്റൊരു സാധ്യതയും നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘പരസ്പരമുള്ള വിശ്വാസം’ എന്ന പ്രയോഗം മൂലപാഠത്തിലെ പരസ്പരത നിലനിർത്തുന്നു; ‘പ്രോത്സാഹനം ലഭിക്കുക’ എന്നത് ആശ്വാസവും ധൈര്യപ്പെടുത്തലും ഉൾക്കൊള്ളുന്ന παρακαλέω പദകുടുംബത്തിന്റെ സന്ദർഭോചിതമായ രൂപമാണ്.
