id: ROM.1.7
reference: Romans 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: ml
  text: 'റോമിലുള്ള ദൈവത്തിന്റെ പ്രിയപ്പെട്ടവരും വിളിക്കപ്പെട്ട വിശുദ്ധരുമായ എല്ലാവർക്കും: നമ്മുടെ പിതാവായ ദൈവത്തിൽനിന്നും കർത്താവായ യേശു മശീഹയിൽനിന്നും നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “വിളിക്കപ്പെട്ട വിശുദ്ധരായവർ”; പരമ്പരാഗതമായി, “വിശുദ്ധരാകാൻ വിളിക്കപ്പെട്ടവർ.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ക്രിസ്തു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: റോമിലുള്ള ... എല്ലാവർക്കും
  rationale: സാർവത്രിക അഭിസംബോധനയും സ്ഥലസൂചനയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്വാഭാവികമായ ദത്തിവിഭക്തി ഘടന ഉപയോഗിക്കുന്നു.
- source_word: ἀγαπητοῖς θεοῦ
  choice: ദൈവത്തിന്റെ പ്രിയപ്പെട്ടവർ
  rationale: ἀγαπητοῖς എന്ന വിശേഷണത്തിന്റെ ബന്ധപരമായ ഊന്നൽ നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κλητοῖς ἁγίοις
  choice: വിശുദ്ധരായി വിളിക്കപ്പെട്ടവർ
  rationale: രണ്ട് വിശേഷണങ്ങളുള്ള ഗ്രീക്ക് ഘടനയുടെ അർത്ഥം വ്യക്തമായി നൽകുന്നു; ദൈവത്തിന്റെ വിളിയെയും വിശുദ്ധരെന്ന നിലയെയും ബന്ധിപ്പിക്കുന്നു, എന്നാൽ ലക്ഷ്യമാത്രമെന്ന ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അഭിവാദ്യത്തിലെ ദൈവശാസ്ത്രപരമായ ആഴവും പതിവായ ബൈബിൾപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: അഭിവാദ്യഭാവവും സമഗ്രക്ഷേമത്തിന്റെ ദൈവശാസ്ത്രപരമായ അർത്ഥവും നിലനിർത്തുന്ന നേരിട്ടുള്ള തുല്യപദം.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ ദൈവം
  rationale: ഗ്രീക്ക് പദബന്ധം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ അധികാരപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ ശക്തി സംരക്ഷിക്കുന്ന അംഗീകൃത മലയാളപദം.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός എന്ന അഭിഷിക്തൻ എന്ന പദവിയുടെ അർത്ഥം സുതാര്യമാക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: κλητοῖς ἁγίοις എന്നതിൽ വിശുദ്ധരെന്ന നിലവാരമോ വിശുദ്ധരാകാനുള്ള ലക്ഷ്യമോ പ്രധാനമാണോ
  choice: വിശുദ്ധരായി വിളിക്കപ്പെട്ടവർ
  alternative: വിശുദ്ധരാകാൻ വിളിക്കപ്പെട്ടവർ; വിളിക്കപ്പെട്ട വിശുദ്ധർ
  rationale: ഗ്രീക്കിൽ ‘ആകാൻ’ എന്ന ക്രിയയില്ല. തെരഞ്ഞെടുത്ത രൂപം വിളിയും വിശുദ്ധരെന്ന തിരിച്ചറിയലും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; എങ്കിലും മലയാളത്തിൽ ‘ആയി’ എന്നത് വായനാസൗകര്യത്തിനുള്ള വ്യാകരണബന്ധമാണ്.
- issue: Χριστός എന്നത് പദവിയായി പരിഭാഷപ്പെടുത്തണമോ പരമ്പരാഗത രൂപത്തിൽ ലിപ്യന്തരണം ചെയ്യണമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ പദവിയായ അർത്ഥം വഹിക്കുന്നു. ‘മശീഹ’ അത് വ്യക്തമാക്കുന്നു; പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: χάρις ὑμῖν καὶ εἰρήνη എന്ന നാമവാക്യ അഭിവാദ്യം മലയാളത്തിൽ എങ്ങനെ നൽകണം
  choice: നിങ്ങൾക്കു കൃപയും സമാധാനവും ഉണ്ടാകട്ടെ
  alternative: നിങ്ങൾക്കു കൃപയും സമാധാനവും
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ആശംസാഭാവം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമാക്കാൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് അഭിസംബോധന മലയാളത്തിൽ വായിക്കാനാകുന്ന വിധം ക്രമീകരിച്ചിരിക്കുന്നു. ‘ഉണ്ടാകട്ടെ’ എന്നത് ആശംസയുടെ നിഗൂഢക്രിയ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
