id: ROM.1.30
reference: Romans 1:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: ml
  text: അപവാദം പറയുന്നവർ, ദൈവത്തെ വെറുക്കുന്നവർ[a], ധിക്കാരികൾ, അഹങ്കാരികൾ, പൊങ്ങച്ചക്കാർ, തിന്മകൾ മെനയുന്നവർ, മാതാപിതാക്കളെ അനുസരിക്കാത്തവർ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ദൈവത്താൽ വെറുക്കപ്പെട്ടവർ.”
    reason: θεοστυγεῖς എന്ന പദത്തിന് സാധ്യമായ കർമണി അർത്ഥം സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: καταλάλους
  choice: അപവാദം പറയുന്നവർ
  rationale: മറ്റുള്ളവർക്കെതിരെ ദുഷ്‌പേര് ഉണ്ടാക്കുന്ന വിധത്തിൽ സംസാരിക്കുന്നവരെയാണ് ഈ പദം സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ അർത്ഥം വ്യക്തമായി എത്തിക്കുന്ന പ്രയോഗമാണിത്.
- source_word: θεοστυγεῖς
  choice: ദൈവത്തെ വെറുക്കുന്നവർ
  rationale: ദോഷങ്ങളുടെ ഈ പട്ടികയിൽ മനുഷ്യരുടെ മനോഭാവങ്ങളും പ്രവൃത്തികളും പറയുന്നതിനാൽ സജീവാർ‍ഥം സ്വാഭാവികമാണ്; നിഷ്ക്രിയാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑβριστάς
  choice: ധിക്കാരികൾ
  rationale: അഹന്തയോടെയുള്ള നിന്ദ്യവും അതിക്രമപരവുമായ പെരുമാറ്റത്തെ സംക്ഷിപ്തമായി സൂചിപ്പിക്കുന്നു; തൊട്ടടുത്തുള്ള അഹങ്കാരസംബന്ധമായ പദത്തിൽനിന്നും വേർതിരിവും നിലനിർത്തുന്നു.
- source_word: ὑπερηφάνους
  choice: അഹങ്കാരികൾ
  rationale: സ്വയം ഉയർത്തിക്കാണുന്ന മനോഭാവത്തെ സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλαζόνας
  choice: പൊങ്ങച്ചക്കാർ
  rationale: വമ്പുപറയുകയും ഇല്ലാത്ത മേന്മ നടിക്കുകയും ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: ἐφευρετὰς κακῶν
  choice: തിന്മകൾ മെനയുന്നവർ
  rationale: പുതിയ ദുഷ്പ്രവൃത്തികൾ ബുദ്ധിപൂർവം ആവിഷ്കരിക്കുന്നതെന്ന ആശയം ‘മെനയുന്നവർ’ സ്വാഭാവികമായി നൽകുന്നു; ‘കണ്ടുപിടിക്കുന്നവർ’ എന്ന യാന്ത്രികഭാവം ഒഴിവാക്കുന്നു.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: മാതാപിതാക്കളെ അനുസരിക്കാത്തവർ
  rationale: വിശേഷണത്തോടുകൂടിയ ദത്തിവ് ബന്ധത്തെ വ്യക്തവും പതിവുമായ മലയാളപ്രയോഗത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: θεοστυγεῖς എന്ന പദത്തിന്റെ കർത്തൃപ്രയോഗമോ കർമണി പ്രയോഗമോ
  choice: ദൈവത്തെ വെറുക്കുന്നവർ
  alternative: ദൈവത്താൽ വെറുക്കപ്പെട്ടവർ
  rationale: പട്ടികയിലെ മറ്റു പദങ്ങൾ മനുഷ്യരുടെ ദുഷ്ടമനോഭാവങ്ങളെയും പെരുമാറ്റങ്ങളെയും വിശേഷിപ്പിക്കുന്നതിനാൽ കർത്തൃപ്രയോഗം സന്ദർഭത്തോട് കൂടുതൽ യോജിക്കുന്നു. എന്നാൽ ചരിത്രപരമായി ചർച്ചചെയ്യപ്പെട്ട കർമണി അർത്ഥവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ദോഷപ്പട്ടികാശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്തമായ നാമവിശേഷണപരമ്പര മലയാളത്തിൽ ‘വർ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി; സമീപാർഥപദങ്ങൾ കഴിയുന്നത്ര വേർതിരിച്ചു.
