id: ROM.1.28
reference: Romans 1:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: ml
  text: തങ്ങളുടെ അറിവിൽ ദൈവത്തെ നിലനിർത്തുന്നത് യോഗ്യമെന്ന് അവർ കരുതാതിരുന്നതുപോലെതന്നെ[a], അനുചിതമായ കാര്യങ്ങൾ ചെയ്യാൻ ദൈവം അവരെ അയോഗ്യമായ[b] മനസ്സിന് വിട്ടുകൊടുത്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെ അംഗീകരിക്കുന്നത്.”
    reason: lexical_alternative
  - marker: b
    text: “അയോഗ്യമായ” എന്നത് നേരത്തെയുള്ള “യോഗ്യമെന്ന്” എന്ന പദവുമായി ബന്ധമുള്ള ഗ്രീക്ക് പദത്തെ വിവർത്തനം ചെയ്യുന്നു; ഇങ്ങനെ പൗലോസിന്റെ പദപ്രയോഗം നിലനിർത്തുന്നു. അഥവാ, “അധഃപതിച്ച മനസ്സ്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: …പോലെതന്നെ
  rationale: ഗ്രീക്കിലെ താരതമ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കാരണബന്ധവും സൂചിപ്പിക്കാമെങ്കിലും അതിനെ മാത്രം ഉറപ്പിച്ചു പറയുന്നില്ല.
- source_word: ἐδοκίμασαν
  choice: യോഗ്യമെന്ന് … കരുതാതിരുന്നു
  rationale: പരിശോധിച്ച് അംഗീകരിക്കുക, ഉചിതമെന്നു കരുതുക എന്ന വിലയിരുത്തൽഭാവം നൽകുകയും ἀδόκιμον എന്ന പദത്തോടുള്ള പദബന്ധം മലയാളത്തിൽ ഭാഗികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: തങ്ങളുടെ അറിവിൽ ദൈവത്തെ നിലനിർത്തുക
  rationale: മൂലവാക്യത്തിലെ ‘അറിവിൽ ഉണ്ടായിരിക്കുക/വെച്ചുകൊള്ളുക’ എന്ന രൂപം സംരക്ഷിക്കുന്നു; ‘ദൈവത്തെ അംഗീകരിക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: παρέδωκεν
  choice: വിട്ടുകൊടുത്തു
  rationale: റോമർ 1-ലെ ആവർത്തിതമായ ദൈവിക ന്യായവിധിയുടെ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδόκιμον νοῦν
  choice: അയോഗ്യമായ മനസ്സ്
  rationale: അംഗീകാരയോഗ്യമല്ലാത്തതോ പരിശോധനയിൽ പരാജയപ്പെട്ടതോ എന്ന അടിസ്ഥാനാർഥം നൽകുന്നു; ἐδοκίμασαν എന്നതുമായ പദപ്രതിധ്വനി ‘യോഗ്യം/അയോഗ്യം’ വഴി സംരക്ഷിക്കുന്നു. ‘അധഃപതിച്ച’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനഭാരമുള്ള പദം മുഖ്യപാഠത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: ποιεῖν
  choice: ചെയ്യാൻ
  rationale: വിട്ടുകൊടുത്തതിന്റെ ഫലം അല്ലെങ്കിൽ ഉദ്ദേശ്യം തുറന്ന നിലയിൽ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അനന്തക്രിയാരൂപത്തിന്റെ നേരിട്ടുള്ള വിവർത്തനം.
- source_word: τὰ μὴ καθήκοντα
  choice: അനുചിതമായ കാര്യങ്ങൾ
  rationale: ചെയ്യാൻ യോജിക്കാത്തതും ഉചിതമല്ലാത്തതുമായ കാര്യങ്ങൾ എന്ന നൈതികഭാവം ലളിതവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἀδόκιμον νοῦν എന്നതിനെ ശക്തമായ പിൽക്കാല ദൈവശാസ്ത്രപദം ഉപയോഗിച്ച് വിവർത്തനം ചെയ്യണമോ എന്നത്
  choice: അയോഗ്യമായ മനസ്സ്
  alternative: അധഃപതിച്ച മനസ്സ്; ദുഷിച്ച മനസ്സ്
  rationale: ദൈവം അവരെ വിട്ടുകൊടുത്ത ന്യായവിധി വാക്യത്തിൽ വ്യക്തമാണ്; എന്നാൽ വിശേഷണത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തഭാരം ചേർക്കാതെ, മൂലത്തിലെ പദപ്രതിധ്വനി സംരക്ഷിക്കുന്നു.
- issue: ἔχειν ἐν ἐπιγνώσει എന്നത് വെറും ‘അംഗീകരിക്കുക’ എന്നു ചുരുക്കണമോ എന്നത്
  choice: തങ്ങളുടെ അറിവിൽ ദൈവത്തെ നിലനിർത്തുക
  alternative: ദൈവത്തെ അംഗീകരിക്കുക
  rationale: മൂലത്തിലെ അസാധാരണമായ പ്രയോഗവും അതിലെ ഉദ്ദേശപൂർവമായ നിരസനത്തിന്റെ ഭാവവും മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സ്വാഭാവികമായ വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘തങ്ങളുടെ അറിവിൽ ദൈവത്തെ നിലനിർത്തുക’ എന്നത് ഉദ്ദേശപൂർവം അല്പം അസാധാരണമായി സൂക്ഷിച്ചിരിക്കുന്നു, കാരണം മൂലഗ്രീക്കിലും പ്രയോഗം വ്യാഖ്യാനസാധ്യതയുള്ളതാണ്. ‘യോഗ്യം/അയോഗ്യം’ എന്ന പദജോടി പൗലോസിന്റെ പദപ്രതിധ്വനി മലയാളത്തിൽ ദൃശ്യമാക്കുന്നു.
