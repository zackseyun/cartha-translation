language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ദൈവം അവരെ അപമാനകരമായ കാമവികാരങ്ങൾക്ക് വിട്ടുകൊടുത്തു; കാരണം, അവരുടെ സ്ത്രീകൾപോലും[a] സ്വാഭാവികമായ ലൈംഗികബന്ധത്തിനു[b] പകരം പ്രകൃതിക്കു വിരുദ്ധമായത് സ്വീകരിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘അവരുടെ പെൺവർ.’'
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘സ്വാഭാവികമായ ഉപയോഗം.’'
    reason: lexical_alternative
  - marker: c
    text: 'അഥവാ: ‘പ്രകൃതിക്കെതിരായത്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ഇക്കാരണത്താൽ
  rationale: മുൻവാക്യങ്ങളിലെ വാദവുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന കാരണസൂചക പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρέδωκεν
  choice: ഏൽപ്പിച്ചുകൊടുത്തു
  rationale: ദൈവം അവരെ അവരുടെ വഴിയുടെ ഫലങ്ങൾക്ക് വിട്ടുകൊടുക്കുന്ന ന്യായവിധിസൂചന നിലനിർത്തുന്നു; വെറും ‘വിട്ടു’ എന്നതിനെക്കാൾ മൂലത്തിലെ παραδίδωμι-യുടെ ശക്തി നന്നായി പ്രകടമാക്കുന്നു.
- source_word: πάθη ἀτιμίας
  choice: അപമാനകരമായ വികാരങ്ങൾ
  rationale: ἀτιμίαയിലെ നിഷേധാത്മക ധാർമിക വിലയിരുത്തൽ മയപ്പെടുത്താതെയും ‘കാമമോഹങ്ങൾ’ പോലുള്ള കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം ചേർക്കാതെയും അവതരിപ്പിക്കുന്നു.
- source_word: θήλειαι
  choice: സ്ത്രീകൾ
  rationale: മൂലപദത്തിന്റെ അക്ഷരാർഥം ‘പെൺവർ’ എന്നതിന് അടുത്തതാണെങ്കിലും മനുഷ്യരെ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘സ്ത്രീകൾ’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: μετήλλαξαν
  choice: മാറ്റിക്കളഞ്ഞു
  rationale: ഒന്നിനു പകരം മറ്റൊന്ന് സ്വീകരിച്ചുവെന്ന കൈമാറ്റഭാവം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: സ്വാഭാവികമായ ലൈംഗികബന്ധം
  rationale: χρῆσις അക്ഷരാർഥത്തിൽ ‘ഉപയോഗം’ ആണെങ്കിലും ഇവിടെ ലൈംഗികസന്ദർഭത്തിലുള്ള പരോക്ഷപ്രയോഗമാണ്; ‘ലൈംഗികബന്ധം’ ആ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്നു, അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τὴν παρὰ φύσιν
  choice: പ്രകൃതിക്കു വിരുദ്ധമായത്
  rationale: παρὰ φύσιν എന്ന ഗ്രീക്ക് പ്രയോഗത്തിലെ വിലയിരുത്തൽ അധിക വ്യാഖ്യാനം ചേർക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ധാർമിക വിലയിരുത്തൽ ശക്തിപ്പെടുത്തണമോ മയപ്പെടുത്തണമോ എന്നത്
  choice: ‘അപമാനകരമായ’, ‘പ്രകൃതിക്കു വിരുദ്ധമായ’ എന്നീ മൂലത്തിലെ വിലയിരുത്തൽപദങ്ങൾ അതേ ശക്തിയിൽ നിലനിർത്തി.
  alternative: മൂലത്തിൽ പറയാത്ത ആധുനിക വ്യക്തിത്വവിഭാഗങ്ങളോ വിശദീകരണങ്ങളോ ചേർക്കുക, അല്ലെങ്കിൽ വിലയിരുത്തൽ മയപ്പെടുത്തി പറയുക.
  rationale: വാക്യത്തിന്റെ യഥാർഥ ധാർമികബലം സംരക്ഷിക്കണം; അതേസമയം പാഠത്തിൽ ഇല്ലാത്ത സമകാലിക വിഭാഗങ്ങളോ സഭാപരമായ വ്യാഖ്യാനങ്ങളോ ഇറക്കുമതി ചെയ്യരുത്.
- issue: φυσικὴ χρῆσις എന്ന പ്രയോഗത്തിന്റെ പരോക്ഷത
  choice: മുഖ്യപാഠത്തിൽ സന്ദർഭാർഥമായ ‘സ്വാഭാവികമായ ലൈംഗികബന്ധം’ ഉപയോഗിച്ച് കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘സ്വാഭാവികമായ ഉപയോഗം’ എന്ന് അക്ഷരാർഥത്തിൽ മാത്രം പരിഭാഷപ്പെടുത്തുക.
  rationale: അക്ഷരാർഥരൂപം മലയാളത്തിൽ അസ്വാഭാവികവും തെറ്റിദ്ധാരണയ്ക്കിടയാക്കുന്നതുമാകാം; സന്ദർഭാർഥം വ്യക്തമാക്കുമ്പോഴും ഉറവിടത്തിലെ പദരൂപം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ധാർമിക വിലയിരുത്തൽ നിലനിർത്തിയെങ്കിലും ആധുനിക സാമൂഹികമോ സഭാപരമോ ആയ വിഭാഗങ്ങൾ ചേർത്തിട്ടില്ല. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ നൽകിയിരിക്കുന്നു.
