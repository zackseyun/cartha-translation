  text: പൗലോസ്—മശീഹയായ യേശുവിന്റെ[b] അടിമ[a], വിളിക്കപ്പെട്ട അപ്പൊസ്തലൻ[c], ദൈവത്തിന്റെ സുവിശേഷത്തിനായി വേർതിരിക്കപ്പെട്ടവൻ—
