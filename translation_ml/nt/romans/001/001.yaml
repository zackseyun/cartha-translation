lexical_decisions:
- source_word: Παῦλος
  choice: പൗലോസ്
  rationale: മലയാളത്തിൽ പ്രചാരത്തിലുള്ളതും ഗ്രീക്ക് പേരിനോട് അടുത്തുനിൽക്കുന്നതുമായ രൂപം.
- source_word: δοῦλος
  choice: അടിമ
  rationale: ഉടമസ്ഥതയ്ക്കും പൂർണ വിധേയത്വത്തിനും ഊന്നൽ നൽകുന്ന ഗ്രീക്ക് പദത്തിന്റെ ശക്തി ‘ശുശ്രൂഷകൻ’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി ഗ്രഹിച്ച് അതിന്റെ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന അർഥം പ്രകടമാക്കുന്നു; മലയാളത്തിലെ സ്വാഭാവികമായ ബന്ധരൂപവും ഉപയോഗിക്കുന്നു.
- source_word: κλητὸς ἀπόστολος
  choice: അപ്പൊസ്തലനായി വിളിക്കപ്പെട്ടവൻ
  rationale: ദൈവിക വിളിയുടെ ആശയവും അപ്പൊസ്തലൻ എന്ന ചുമതലയും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗത്തിന്റെ വ്യാകരണപരമായ തുറന്ന നില അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀφωρισμένος
  choice: വേർതിരിക്കപ്പെട്ടവൻ
  rationale: പാസീവ് കൃതന്തത്തിന്റെ രൂപവും ഒരു പ്രത്യേക ഉദ്ദേശ്യത്തിനായി മാറ്റിവെച്ചതെന്ന ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: ദൈവത്തിന്റെ സുവിശേഷത്തിനായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യം/ഉദ്ദേശ്യം ‘-നായി’ കൊണ്ട് നൽകുകയും θεοῦ എന്ന ബന്ധരൂപം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστός എന്നത് സ്ഥാനപ്പേരായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ സ്വപരിചയത്തിൽ Χριστός-ന്റെ സ്ഥാനപ്പേർസ്വഭാവം വ്യക്തമായി കേൾക്കാൻ ‘മശീഹാ’ ഉപയോഗിച്ചു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: δοῦλος എന്ന ബന്ധത്തിന്റെ ശക്തി
  choice: അടിമ
  alternative: ശുശ്രൂഷകൻ / ദാസൻ
  rationale: പൗലോസ് തന്റെ പൂർണ വിധേയത്വവും മറ്റൊരാളുടേതായ നിലയും പ്രഖ്യാപിക്കുന്നതിനാൽ ശക്തമായ അർഥം മൃദൂകരിക്കാതെ നൽകി.
- issue: κλητὸς ἀπόστολος എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: അപ്പൊസ്തലനായി വിളിക്കപ്പെട്ടവൻ
  alternative: വിളിക്കപ്പെട്ട അപ്പൊസ്തലൻ
  rationale: പ്രധാനപാഠം സ്വാഭാവിക മലയാളത്തിൽ ദൈവിക വിളി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിനോട് രൂപപരമായി കൂടുതൽ അടുത്ത മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ മലയാളം. ഗ്രീക്കിലെ തുടർച്ചയായ മൂന്ന് സ്വപരിചയവാക്യങ്ങളുടെ സമാന്തരത നിലനിർത്താൻ ഡാഷുകൾ ഉപയോഗിച്ചു. ഈ വാക്യം തുടർന്നുള്ള വാക്യങ്ങളിലേക്ക് വ്യാകരണപരമായി നീളുന്നതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിന് പകരം ഡാഷ് നിലനിർത്തി.
