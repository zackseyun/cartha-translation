  text: ἀσυνέτους, ἀσυνθέτους, ⸀ἀστόργους, ἀνελεήμονας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: ml
  text: വിവേകമില്ലാത്തവർ, വാക്കുപാലിക്കാത്തവർ[a], ഉറ്റവരോടു സ്നേഹമില്ലാത്തവർ[b], കരുണയില്ലാത്തവർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശ്വസിക്കാൻ കൊള്ളാത്തവർ” അല്ലെങ്കിൽ “ഉടമ്പടി ലംഘിക്കുന്നവർ.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ പ്രത്യേകിച്ച് കുടുംബാംഗങ്ങളോടും ഉറ്റവരോടും സ്വാഭാവികമായി ഉണ്ടായിരിക്കേണ്ട സ്നേഹവും വാത്സല്യവും ഇല്ലാത്തവരെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: വിവേകമില്ലാത്തവർ
  rationale: ഈ പദം ഗ്രഹണശേഷിയുടെയും ധാർമിക വിവേചനത്തിന്റെയും അഭാവത്തെ സൂചിപ്പിക്കുന്നു. ‘വിവേകമില്ലാത്തവർ’ എന്നത് ബുദ്ധിശക്തി കുറഞ്ഞവർ എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കി ഈ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀσυνθέτους
  choice: വാക്കുപാലിക്കാത്തവർ
  rationale: ധാരണകളോ ഉടമ്പടികളോ പാലിക്കാതെ, ഏറ്റുപറഞ്ഞ ബന്ധങ്ങളിൽ വിശ്വസ്തരല്ലാതിരിക്കുന്നവരെയാണ് പദം സൂചിപ്പിക്കുന്നത്. ‘വാക്കുപാലിക്കാത്തവർ’ ആ ധാർമികവും ബന്ധപരവുമായ അവിശ്വസ്തത വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἀστόργους
  choice: ഉറ്റവരോടു സ്നേഹമില്ലാത്തവർ
  rationale: στοργή എന്ന പദത്തിൽ പ്രത്യേകിച്ച് കുടുംബാംഗങ്ങൾക്കും ഉറ്റവർക്കുമിടയിലെ സ്വാഭാവിക വാത്സല്യമാണ് സൂചിപ്പിക്കപ്പെടുന്നത്. അതിന്റെ നിഷേധാർഥം പൊതുവായ സ്നേഹരാഹിത്യമായി ചുരുക്കാതെ ഈ പരിഭാഷ വ്യക്തമാക്കുന്നു.
- source_word: ἀνελεήμονας
  choice: കരുണയില്ലാത്തവർ
  rationale: കരുണയോ ദയയോ ഇല്ലാത്തവരെന്ന നേരിട്ടുള്ള അർഥം സ്വാഭാവികവും വ്യക്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
