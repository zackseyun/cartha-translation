id: ROM.1.9
reference: Romans 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: ml
  text: എന്റെ ആത്മാവിൽ തന്റെ പുത്രനെക്കുറിച്ചുള്ള സുവിശേഷത്തിൽ ഞാൻ ആരാധനാപൂർവം സേവിക്കുന്ന ദൈവം എനിക്കു സാക്ഷിയാണ്; ഞാൻ ഇടവിടാതെ നിങ്ങളെക്കുറിച്ചു പരാമർശം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: സാക്ഷി
  rationale: പൗലോസിന്റെ പ്രസ്താവനയുടെ സത്യത്തിന് സാക്ഷിയായി ദൈവത്തെ ആഹ്വാനം ചെയ്യുന്ന ശപഥസദൃശ പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: λατρεύω
  choice: ആരാധനാപൂർവം സേവിക്കുന്നു
  rationale: ഈ ക്രിയയിലെ മതപരമായ സേവനത്തിന്റെയും ആരാധനയുടെയും അർത്ഥവ്യാപ്തി ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ πνεύματί μου
  choice: എന്റെ ആത്മാവുകൊണ്ട്
  rationale: ἐν ഇവിടെ മാർഗമോ രീതിയോ സൂചിപ്പിക്കാം; പൗലോസിന്റെ ആന്തരികവും സമ്പൂർണവുമായ സേവനത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: തന്റെ പുത്രനെക്കുറിച്ചുള്ള സുവിശേഷത്തിൽ
  rationale: രണ്ടാമത്തെ ἐν സേവനത്തിന്റെ മേഖലയെ സൂചിപ്പിക്കുന്നു; τοῦ υἱοῦ αὐτοῦ എന്ന ജനിറ്റീവിന്റെ ഉള്ളടക്കസംബന്ധമായ സ്വാഭാവിക മലയാള വായനയാണ് ‘പുത്രനെക്കുറിച്ചുള്ള’.
- source_word: ἀδιαλείπτως
  choice: ഇടവിടാതെ
  rationale: തുടർച്ചയായ ക്രമബദ്ധതയെ ആധുനിക മലയാളത്തിൽ വ്യക്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: നിങ്ങളെ ഓർക്കുന്നു
  rationale: ‘നിങ്ങളെക്കുറിച്ച് പരാമർശം നടത്തുന്നു’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സന്ദർഭോചിതമായ മലയാളരൂപം; പ്രാർത്ഥനാസന്ദർഭം അടുത്ത വാക്യത്തിൽ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: ἐν τῷ πνεύματί μου എന്നതിലെ ἐν-ന്റെ അർത്ഥം
  choice: എന്റെ ആത്മാവുകൊണ്ട്
  alternative: എന്റെ ആത്മാവിൽ
  rationale: മാർഗം/രീതി എന്ന വായനയ്ക്ക് മുൻഗണന നൽകുന്നു; എന്നാൽ ആന്തരിക മണ്ഡലം എന്ന വായനയും വ്യാകരണപരമായി സാധ്യമാണ്.
- issue: τοῦ υἱοῦ αὐτοῦ എന്ന ജനിറ്റീവിന്റെ ബന്ധം
  choice: തന്റെ പുത്രനെക്കുറിച്ചുള്ള
  alternative: തന്റെ പുത്രന്റെ
  rationale: സുവിശേഷത്തിന്റെ ഉള്ളടക്കമായി പുത്രനെ കാണുന്ന വായന മലയാളത്തിൽ കൂടുതൽ വ്യക്തമാണ്; ഉടമസ്ഥതയോ ഉറവിടമോ സൂചിപ്പിക്കുന്ന കൂടുതൽ രൂപപരമായ വായനയും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സുവിശേഷം’ മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ വ്യാപകമായി മനസ്സിലാകുന്നതിനാൽ നിലനിർത്തി; λατρεύωയിലെ ആരാധനാഭാവം നഷ്ടപ്പെടാതിരിക്കാൻ ‘ആരാധനാപൂർവം സേവിക്കുന്നു’ എന്നു നൽകി.
