id: ROM.1.16
reference: Romans 1:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: ml
  text: സുവാർത്തയെക്കുറിച്ച് ഞാൻ ലജ്ജിക്കുന്നില്ല[a]. എന്തെന്നാൽ, വിശ്വസിക്കുന്ന ഏവർക്കും—ആദ്യം യഹൂദനും അതുപോലെ ഗ്രീക്കുകാരനും[b]—രക്ഷയ്ക്കായുള്ള ദൈവശക്തിയാണത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സുവിശേഷം.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ഗ്രീക്കുകാരൻ’ എന്നത് വിശാലമായ അർഥത്തിൽ യഹൂദേതരനെ, അതായത് യഹൂദനല്ലാത്ത ഒരാളെ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: ലജ്ജിക്കുന്നില്ല
  rationale: ലജ്ജ നിമിത്തം പിന്മാറുകയോ പരസ്യമായി ഏറ്റുപറയാൻ മടിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: εὐαγγέλιον
  choice: സുവാർത്ത
  rationale: ‘നല്ല വാർത്ത’ എന്ന മൂലാർഥം വഹിക്കുന്നതും ആധുനിക മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ സാധാരണക്കാർക്ക് വ്യക്തവുമായ പദമാണ്.
- source_word: δύναμις
  choice: ശക്തി
  rationale: ദൈവത്തിന്റെ ഫലപ്രദമായ രക്ഷാപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ തത്തുല്യപദം.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷ ലഭിക്കാനുള്ള
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യ/ഫലസൂചന സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രക്ഷയുടെ കൃത്യമായ പ്രവർത്തനരീതി അനാവശ്യമായി നിർവചിക്കുന്നില്ല.
- source_word: παντὶ τῷ πιστεύοντι
  choice: വിശ്വസിക്കുന്ന ഏവർക്കും
  rationale: παντίയുടെ സർവവ്യാപകവും വിതരണാത്മകവുമായ അർഥവും πιστεύοντι എന്ന വർത്തമാന പങ്കാളിക്രിയയുടെ ബലവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: Ἰουδαίῳ
  choice: യഹൂദനും
  rationale: Ἕλληνι എന്നതിനോടുള്ള പൗലോസിന്റെ ജനതാ-മതപരമായ വൈരുധ്യത്തിൽ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യൻ’ എന്നതിനെക്കാൾ ‘യഹൂദൻ’ യോജിക്കുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: രക്ഷാചരിത്രത്തിലെ മുൻഗണനാക്രമം വ്യാഖ്യാനവിസ്താരം കൂടാതെ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: Ἕλληνι
  choice: ഗ്രീക്കുകാരനും
  rationale: മൂലപാഠത്തിലെ നിർദിഷ്ട ജനനാമം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അതിന്റെ വിശാലമായ യഹൂദേതര സൂചന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τε ... καί
  choice: അതുപോലെ ... -നും
  rationale: മുൻഗണനയ്ക്കുശേഷമുള്ള ഉൾപ്പെടുത്തലും കൂട്ടിച്ചേർക്കലും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ‘ആദ്യം യഹൂദനും അതുപോലെ ഗ്രീക്കുകാരനും’ എന്നതിലെ Ἕλληνι
  choice: പ്രധാനപാഠത്തിൽ ‘ഗ്രീക്കുകാരൻ’; വിശാലമായ യഹൂദേതര അർഥം അടിക്കുറിപ്പിൽ
  alternative: പ്രധാനപാഠത്തിൽ ‘യഹൂദേതരൻ’
  rationale: മൂലപാഠത്തിന്റെ കൃത്യമായ പദപ്രയോഗം സംരക്ഷിക്കുമ്പോൾ, പൗലോസിന്റെ പ്രയോഗത്തിൽ അത് ഗ്രീക്കുകാരെക്കാൾ വിശാലമായി യഹൂദേതരരെ പ്രതിനിധീകരിക്കാമെന്ന അർഥവും മറച്ചുവയ്ക്കുന്നില്ല.
- issue: εἰς σωτηρίαν എന്നതിൽ ശക്തിയും രക്ഷയും തമ്മിലുള്ള ബന്ധം
  choice: ‘രക്ഷ ലഭിക്കാനുള്ള ദൈവത്തിന്റെ ശക്തി’
  alternative: ‘രക്ഷ നൽകുന്ന ദൈവശക്തി’
  rationale: ലക്ഷ്യത്തിലേക്കോ ഫലത്തിലേക്കോ ഉള്ള εἰς എന്ന ബന്ധം നിലനിർത്തുകയും സുവാർത്തയെ രക്ഷയുടെ ലക്ഷ്യത്തിലേക്കു പ്രവർത്തിക്കുന്ന ദൈവശക്തിയായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു; ഗ്രീക്ക് വ്യാകരണത്തിൽ ഇല്ലാത്ത അധിക കാരണവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ കാരണബന്ധം രണ്ട് മലയാള വാക്യങ്ങളാക്കി സ്വാഭാവികമാക്കി; ആശയക്രമവും ‘ആദ്യം’ എന്ന മുൻഗണനയും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
