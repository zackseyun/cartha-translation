id: ROM.1.21
reference: Romans 1:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർ ദൈവത്തെ അറിഞ്ഞിട്ടും ദൈവമെന്ന നിലയിൽ അവനെ മഹത്ത്വപ്പെടുത്തുകയോ നന്ദി അർപ്പിക്കുകയോ ചെയ്തില്ല. മറിച്ച്, അവരുടെ ചിന്തകൾ വ്യർഥമായിത്തീർന്നു[a]; വിവേകമില്ലാത്ത അവരുടെ ഹൃദയം[b] ഇരുണ്ടുപോയി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ ന്യായവിചാരങ്ങളിൽ,’ ‘അവരുടെ ആലോചനകളിൽ,’ അല്ലെങ്കിൽ ‘അവരുടെ ഊഹാപോഹങ്ങളിൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ഹൃദയം’ ഏകവചനത്തിലാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിന്റെ കാരണം വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: γνόντες τὸν θεὸν
  choice: അവർ ദൈവത്തെ അറിഞ്ഞിട്ടും
  rationale: 'സന്ദർഭത്തിലെ concessive ഭാവം നിലനിർത്തുന്നു: ദൈവത്തെ അറിഞ്ഞിരുന്നിട്ടും അതിനൊത്ത പ്രതികരണം അവർ കാട്ടിയില്ല.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: ദൈവമെന്ന നിലയിൽ അവനെ മഹത്ത്വപ്പെടുത്തിയില്ല
  rationale: ὡς θεὸν എന്നത് ദൈവത്തിനുള്ള പദവിക്കും സ്ഥാനത്തിനും യോജിച്ചവിധം എന്ന ആശയം നൽകുന്നു; δοξάζωയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം ‘മഹത്ത്വപ്പെടുത്തുക’ നിലനിർത്തുന്നു.
- source_word: ἢ ηὐχαρίστησαν
  choice: നന്ദി അർപ്പിക്കുകയോ ചെയ്തില്ല
  rationale: നന്ദി പ്രകടിപ്പിക്കുക എന്ന ക്രിയാഭാവം സ്വാഭാവികവും ആദരവുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: അവരുടെ ചിന്തകൾ വ്യർഥമായിത്തീർന്നു
  rationale: διαλογισμοί എന്നതിന്റെ ചിന്തകൾ, ആലോചനകൾ, ന്യായവിചാരങ്ങൾ എന്നീ അർഥസാധ്യതകളിൽ പൊതുവായതും സ്വാഭാവികവുമായ ‘ചിന്തകൾ’ തെരഞ്ഞെടുത്തു; passive സംഭവഭാവം ‘ആയിത്തീർന്നു’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: വിവേകമില്ലാത്ത അവരുടെ ഹൃദയം
  rationale: ἀσύνετος എന്നത് വെറും ബുദ്ധിക്കുറവല്ല, ഗ്രഹണവും വിവേകവും ഇല്ലായ്മയാണെന്ന ആശയം നൽകുന്നു; καρδίαയുടെ ഏകവചനം സംരക്ഷിക്കുന്നു.
- source_word: ἐσκοτίσθη
  choice: ഇരുണ്ടുപോയി
  rationale: ധാർമ്മികവും ബൗദ്ധികവുമായ അന്ധകാരത്തെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുകയും സംഭവിച്ച മാറ്റം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: γνόντες എന്ന participle-ന്റെ concessive ഭാവം
  choice: ദൈവത്തെ അറിഞ്ഞിട്ടും
  alternative: ദൈവത്തെ അറിഞ്ഞശേഷം / ദൈവത്തെ അറിഞ്ഞപ്പോൾ
  rationale: അറിവുണ്ടായിരുന്നിട്ടും യോജിച്ച മഹത്ത്വവും നന്ദിയും നൽകാതിരുന്നതിലെ ഉത്തരവാദിത്വം സന്ദർഭം ഊന്നിപ്പറയുന്നു; അതിൽക്കവിഞ്ഞ ഒരു സിദ്ധാന്തപരമായ നിഗമനം വിവർത്തനം ചേർക്കുന്നില്ല.
- issue: καρδία എന്ന ഏകവചനത്തിന്റെ കൂട്ടായ പ്രയോഗം
  choice: അവരുടെ ഹൃദയം
  alternative: അവരുടെ ഹൃദയങ്ങൾ / അവരുടെ അന്തഃകരണം
  rationale: ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തി, ‘ഹൃദയം’ മുഴുവൻ ആന്തരിക വ്യക്തിത്വത്തെ കൂട്ടായ രീതിയിൽ സൂചിപ്പിക്കുന്നതിനുള്ള സാധ്യത തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ഗൗരവവും മാന്യതയും നിലനിർത്തി. വാക്യത്തിന്റെ ദീർഘഘടന വായനാസൗകര്യത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി; ‘മറിച്ച്’ ശക്തമായ വിരോധബന്ധം നിലനിർത്തുന്നു.
