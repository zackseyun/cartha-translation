  source_fidelity: ഗ്രീക്ക് വാക്യത്തിലെ വിശദീകരണബന്ധം (διότι), concessive ആയ γνόντες («അറിഞ്ഞിട്ടും»), «ദൈവമെന്ന നിലയിൽ» എന്ന ὡς θεόν-ന്റെ ഊന്നൽ, മഹത്ത്വപ്പെടുത്തലും നന്ദിപറച്ചിലും എന്ന ഇരട്ടനിഷേധം, ചിന്തയിലെ വ്യർഥത, ഹൃദയത്തിന്റെ അന്ധകാരീകരണം എന്നിവ വിശ്വസ്തമായി പകർന്നിട്ടുണ്ട്. «അവരുടെ ചിന്തകൾ വ്യർഥമായിത്തീർന്നു» എന്ന പ്രയോഗം ഗ്രീക്കിലെ «അവരുടെ ചിന്തകളിൽ അവർ വ്യർഥരായി» എന്ന രൂപത്തിൽനിന്ന് അല്പം പുനഃക്രമീകരിക്കുന്നുവെങ്കിലും അർഥം സ്വാഭാവികമായി നൽകുന്നു.
  naturalness: ആധുനിക നിലവാരമലയാളത്തിൽ വാചകം വ്യക്തവും ഗൗരവമുള്ളതുമാണ്. «അറിഞ്ഞിട്ടും», «മറിച്ച്», «വിവേകമില്ലാത്ത» എന്നിവ സന്ദർഭത്തിനും രജിസ്റ്ററിനും യോജിക്കുന്നു. രണ്ട് വാക്യങ്ങളാക്കിയത് വായനാസൗകര്യം വർധിപ്പിക്കുന്നു; വിരോധബന്ധം നഷ്ടപ്പെടുന്നില്ല.
  terminology: «ദൈവമെന്ന നിലയിൽ», «മഹത്ത്വപ്പെടുത്തുക», «നന്ദി അർപ്പിക്കുക», «വിവേകമില്ലാത്ത ഹൃദയം» എന്നിവ ഗ്രീക്ക് പദങ്ങൾക്കും സാധാരണ ബൈബിൾ മലയാളത്തിന്റെ മാന്യമായ പ്രയോഗത്തിനും യോജിച്ചവയാണ്. «ഹൃദയം» ഏകവചനമായി നിലനിർത്തിയതും ശരിയാണ്.
