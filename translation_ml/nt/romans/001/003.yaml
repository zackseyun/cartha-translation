id: ROM.1.3
reference: Romans 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: ml
  text: തന്റെ പുത്രനെക്കുറിച്ച്—ആ പുത്രൻ ജഡപ്രകാരം ദാവീദിന്റെ സന്തതിയിൽനിന്ന്[a] വന്നവനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ “ദാവീദിന്റെ വിത്തിൽനിന്ന്.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ജഡപ്രകാരം” എന്നത് പാപസ്വഭാവത്തെയല്ല, മാനുഷിക വംശപരമ്പരയെയോ ഭൗമിക ഉത്ഭവത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: കുറിച്ച്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ സുവിശേഷത്തിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്ന സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: തന്റെ പുത്രനെ
  rationale: സന്ദർഭത്തിലെ ദൈവത്തെയാണ് ‘തന്റെ’ സൂചിപ്പിക്കുന്നത്; ‘പുത്രൻ’ എന്ന ബന്ധപദം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ γενομένου
  choice: ജനിച്ചവനാണ്
  rationale: γίνομαι എന്ന പദം ഇവിടെ ഉത്ഭവത്തെയും വംശപരമായ വരവിനെയും സൂചിപ്പിക്കുന്നു. ‘ജനിച്ചവൻ’ സ്വാഭാവികമായ മലയാളത്തിൽ യഥാർഥ മാനുഷിക ജനനവും ദാവീദിക വംശബന്ധവും പ്രകടമാക്കുന്നു; എന്നാൽ ക്രിസ്തുവിന്റെ പുത്രത്വത്തിന്റെ സ്വഭാവം വിശദീകരിക്കുന്നില്ല.
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: ദാവീദിന്റെ സന്തതിയിൽനിന്ന്
  rationale: σπέρμα എന്നതിന്റെ അക്ഷരാർഥം ‘വിത്ത്’ ആണെങ്കിലും ഇവിടെ ദാവീദിക വംശപരമ്പരയാണ് ഉദ്ദേശ്യം. ‘സന്തതി’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലോസിന്റെ സാർഥകവും ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ളതുമായ σάρξ എന്ന പദത്തെ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ദൈവപുത്രത്വവും ദാവീദിക മാനുഷിക വംശബന്ധവും തമ്മിലുള്ള ബന്ധം
  choice: ‘തന്റെ പുത്രൻ’ എന്നും ‘ജഡപ്രകാരം ദാവീദിന്റെ സന്തതിയിൽനിന്ന് ജനിച്ചവൻ’ എന്നും രണ്ടും നേരിട്ട് നിലനിർത്തി.
  alternative: ‘മാനുഷിക സ്വഭാവത്തെ സംബന്ധിച്ചിടത്തോളം’ എന്ന് വ്യാഖ്യാനപരമായി വികസിപ്പിക്കുക.
  rationale: വാക്യം ദൈവപുത്രത്വത്തെയും യഥാർഥ ദാവീദിക മാനുഷിക വംശബന്ധത്തെയും ഒരുമിച്ച് അവതരിപ്പിക്കുമ്പോഴും അവയുടെ തത്ത്വശാസ്ത്രപരമായ ബന്ധം വിശദീകരിക്കുന്നില്ല. വിവർത്തനം ആ സംഘർഷവും സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സാന്ദ്രമായ വാക്യഘടന ഡാഷ് ഉപയോഗിച്ച് വായനാസൗകര്യത്തോടെ നിലനിർത്തി; ‘ജഡപ്രകാരം’ എന്ന പരമ്പരാഗതവും സ്രോതസ്സിനോട് അടുത്തതുമായ പ്രയോഗം വിശദീകരണ അടിക്കുറിപ്പോടുകൂടെ ഉപയോഗിച്ചു.
