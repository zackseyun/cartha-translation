id: ROM.1.8
reference: Romans 1:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: ml
  text: ആദ്യം, നിങ്ങളെല്ലാവരെയും ഓർത്ത് യേശു മശീഹയിലൂടെ[a] ഞാൻ എന്റെ ദൈവത്തിനു നന്ദി പറയുന്നു; കാരണം നിങ്ങളുടെ വിശ്വാസം[b] ലോകമെങ്ങും പ്രഖ്യാപിക്കപ്പെടുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, യേശുക്രിസ്തുവിലൂടെ.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, വിശ്വസ്തത; ‘വിശ്വാസപൂർവമായ ആശ്രയം’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: ആദ്യമായി
  rationale: പൗലോസിന്റെ പ്രാരംഭ പ്രസ്താവനയെ സ്വാഭാവികമായ മലയാളത്തിൽ അടയാളപ്പെടുത്തുന്നു; μὲν എന്ന വ്യവഹാരകണിക വേറിട്ട് പരിഭാഷപ്പെടുത്താതെ വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εὐχαριστῶ
  choice: ഞാൻ ... നന്ദി പറയുന്നു
  rationale: നന്ദിപ്രകടനത്തിന്റെ നേരിട്ടുള്ള അർഥവും പൗലോസിന്റെ വ്യക്തിപരമായ സ്വരവും നിലനിർത്തുന്നു.
- source_word: τῷ θεῷ μου
  choice: എന്റെ ദൈവത്തിനു
  rationale: ഗ്രീക്കിലെ വ്യക്തിപരമായ ഉടമസ്ഥബന്ധവും ഭക്തിപൂർണമായ സ്വരവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലൂടെ
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά സൂചിപ്പിക്കുന്ന മാധ്യമത്വം ‘യിലൂടെ’ എന്നതിലൂടെ നിലനിർത്തുന്നു; Χριστός എന്ന അഭിഷിക്തനായ രാജാവിന്റെ പദവി ‘മശീഹ’ എന്നു അർഥാനുവാദം ചെയ്യുന്നു.
- source_word: περὶ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരെയും ഓർത്ത്
  rationale: നന്ദിപ്രകടനത്തിന്റെ സാഹചര്യത്തിൽ περίയുടെ ‘നിങ്ങളെ സംബന്ധിച്ച്’ എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും πάντων എന്ന സമഗ്രത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἡ πίστις ὑμῶν
  choice: നിങ്ങളുടെ വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ പ്രധാന അർഥം നൽകുന്നു; ‘വിശ്വസ്തത’, ‘ആശ്രയം’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: καταγγέλλεται
  choice: അറിയിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപവും വ്യാപകമായി പരസ്യമാക്കപ്പെടുന്നുവെന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: ലോകമെങ്ങും
  rationale: പ്രസ്താവനയുടെ വിശാലവും വാഗ്മിതാപരവുമായ വ്യാപ്തി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστοῦയുടെ പരിഭാഷ
  choice: യേശു മശീഹ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവൻ എന്ന ക്രിസ്തുശാസ്ത്രപരമായ പദവിയാണ്; അതിന്റെ അർഥം പ്രകടമാക്കാൻ ‘മശീഹ’ ഉപയോഗിച്ചു. പരിചിതമായ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἡ πίστις ὑμῶν എന്നതിലെ πίστιςയുടെ അർഥം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: റോമിലെ വിശ്വാസികളുടെ പരക്കെ അറിയപ്പെട്ട വിശ്വാസപ്രതികരണമാണ് സന്ദർഭത്തിന് ഏറ്റവും യോജിച്ചത്; എങ്കിലും പദത്തിന്റെ മറ്റ് യഥാർഥ അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഘടനയും കർമണി പ്രയോഗവും നിലനിർത്തിയപ്പോൾ, മലയാളത്തിൽ കൃത്രിമമായി തോന്നുന്ന പദാനുപദക്രമം ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന ‘യേശു മശീഹയിലൂടെ’, ‘വിശ്വാസം’ എന്നീ സ്ഥാനങ്ങളിൽ ചേർത്തു.
