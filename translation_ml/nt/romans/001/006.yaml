id: ROM.1.6
reference: Romans 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: ml
  text: അവരുടെ ഇടയിൽ, യേശു മശീഹായുടേതെന്നു വിളിക്കപ്പെട്ടവരായ നിങ്ങളും ഉൾപ്പെടുന്നു,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യേശു മശീഹായാൽ വിളിക്കപ്പെട്ടവർ”; കൂടുതൽ അക്ഷരാർഥത്തിൽ, “യേശു മശീഹായുടെ വിളിക്കപ്പെട്ടവർ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: അവരുടെ ഇടയിൽ
  rationale: മുൻവാക്യത്തിലെ ജനതകളെ സൂചിപ്പിക്കുന്ന ബഹുവചന ദത്തിവ് ബന്ധസർവനാമം; ആ കൂട്ടത്തിനുള്ളിലെ ഉൾപ്പെടലിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐστε καὶ ὑμεῖς
  choice: നിങ്ങളും ഉൾപ്പെടുന്നു
  rationale: ἐστε എന്ന വർത്തമാനകാല ക്രിയയും καὶ ὑμεῖς എന്ന ഊന്നലോടെയുള്ള ഉൾപ്പെടുത്തലും മലയാളത്തിൽ സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: κλητοὶ
  choice: വിളിക്കപ്പെട്ടവർ
  rationale: ദൈവിക വിളിയുടെ ആശയം നിലനിർത്തുകയും വിശേഷണത്തിന്റെ ബഹുവചന നാമപ്രയോഗം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായുടെ
  rationale: രണ്ടു പദങ്ങളുടെയും ഷഷ്ഠീവിഭക്തി ബന്ധം നിലനിർത്തുന്നു; Χριστός എന്ന പദത്തെ സ്ഥാനപ്പേരായ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായുടേതായി വിളിക്കപ്പെട്ടവർ
  rationale: ഗ്രീക്കിലെ ചുരുക്കിയ ഷഷ്ഠീവിഭക്തി ബന്ധത്തെ ഉടമസ്ഥത/ബന്ധം എന്ന പ്രധാന സാധ്യതയോടെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; കർത്തൃത്വസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: κλητοὶ Ἰησοῦ Χριστοῦ എന്നതിലെ ഷഷ്ഠീവിഭക്തി ബന്ധം
  choice: യേശു മശീഹായുടേതായി വിളിക്കപ്പെട്ടവർ
  alternative: യേശു മശീഹായാൽ വിളിക്കപ്പെട്ടവർ; കൂടുതൽ അക്ഷരാർഥത്തിൽ, യേശു മശീഹായുടെ വിളിക്കപ്പെട്ടവർ
  rationale: മൂലപാഠം വിളിക്കുന്നവനെ വ്യക്തമായി നിർദേശിക്കാതെ ബന്ധമോ ഉടമസ്ഥതയോ കർത്തൃത്വമോ അനുവദിക്കുന്നു. പ്രധാന പാഠം മശീഹായോടുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുമ്പോൾ മറ്റു യഥാർഥ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ദീർഘവാക്യത്തിലെ ഈ ഉപവാക്യത്തിന്റെ ബന്ധസ്വഭാവം സൂചിപ്പിക്കാൻ അവസാനത്തിൽ പൂർണ്ണവിരാമം ഒഴിവാക്കി ആശയവിരാമം ഉപയോഗിക്കാവുന്നതാണെങ്കിലും, സ്വതന്ത്ര വാക്യാവലംബമായി ഇവിടെ പൂർണ്ണവിരാമം നൽകിയിരിക്കുന്നു.
