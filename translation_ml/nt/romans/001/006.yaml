revisions:
- from: അവരുടെ ഇടയിൽ നിങ്ങളും ഉൾപ്പെടുന്നു—യേശു മശീഹായുടേതായി വിളിക്കപ്പെട്ടവർ.[a]
  to: അവരുടെ ഇടയിൽ, യേശു മശീഹായുടേതെന്നു വിളിക്കപ്പെട്ടവരായ നിങ്ങളും ഉൾപ്പെടുന്നു,[a]
  rationale: The revision makes the possessive/relational reading of κλητοὶ Ἰησοῦ Χριστοῦ idiomatic in modern standard Malayalam while leaving the Greek genitive’s possible agentive reading in the footnote. It also retains the source’s continuing punctuation.
