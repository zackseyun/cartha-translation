id: ROM.1.13
reference: Romans 1:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: ml
  text: 'സഹോദരന്മാരേ[a], നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നില്ല: നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ പലപ്പോഴും ഉദ്ദേശിച്ചിരുന്നു, എന്നാൽ ഇന്നുവരെ ഞാൻ തടയപ്പെട്ടു; മറ്റുള്ള യഹൂദേതരരുടെ ഇടയിലെപ്പോലെ നിങ്ങളുടെ ഇടയിലും എനിക്ക് കുറെ ഫലം ലഭിക്കേണ്ടതിനാണ് അത്.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘സഹോദരന്മാർ’ എന്നത് സഹോദരിമാർ ഉൾപ്പെടെയുള്ള സഹവിശ്വാസികളെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഫലം’ ഇവിടെ പൗലോസിന്റെ ശുശ്രൂഷയിലൂടെ ഉണ്ടാകുന്ന ഫലങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘മറ്റുള്ള യഹൂദേതരർ’ എന്നതു ‘മറ്റു ജനതകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് എനിക്ക് ആഗ്രഹമില്ല
  rationale: ഗ്രീക്കിലെ നിഷേധരൂപത്തിലുള്ള പതിവ് പ്രസ്താവന നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: രൂപപരമായി പുല്ലിംഗ ബഹുവചനമായ സംബോധനയെ മുഖ്യപാഠത്തിൽ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭത്തിലെ ഉൾക്കൊള്ളുന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: πολλάκις προεθέμην
  choice: ഞാൻ പലപ്പോഴും പദ്ധതിയിട്ടിരുന്നു
  rationale: ആവർത്തിച്ചുണ്ടായ മുൻകാല ഉദ്ദേശ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐκωλύθην
  choice: എനിക്ക് തടസ്സം നേരിട്ടു
  rationale: പ്രവൃത്തിക്ക് പുറത്തുനിന്ന് തടസ്സമുണ്ടായെന്ന കർമണിപ്രയോഗത്തിന്റെ ആശയം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; തടസ്സത്തിന്റെ കർത്താവിനെ നിർണ്ണയിക്കുന്നില്ല.
- source_word: ἄχρι τοῦ δεῦρο
  choice: ഇന്നുവരെ
  rationale: ഗ്രീക്ക് കാലസൂചനയുടെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: കുറെ ഫലം ലഭിക്കേണ്ടതിന്
  rationale: പൗലോസിന്റെ കാർഷിക രൂപകം നിലനിർത്തുന്നു; ശുശ്രൂഷയുടെ ഫലങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളുടെ ഇടയിലും
  rationale: റോമിലെ വിശ്വാസിസമൂഹവുമായി ബന്ധപ്പെട്ട ഫലം എന്ന കൂട്ടായ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: മറ്റു ജനതകളുടെ ഇടയിൽ
  rationale: ἔθνη എന്ന പദത്തിന്റെ 'ജനതകൾ' എന്ന അടിസ്ഥാനവ്യാപ്തി നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ἔθνη എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: മറ്റു ജനതകൾ
  alternative: മറ്റു ജനതക്കാരായ യഹൂദേതരർ
  rationale: ഗ്രീക്ക് പദത്തിന് 'ജനതകൾ' എന്നും 'യഹൂദേതരർ' എന്നും അർഥസാധ്യതയുണ്ട്. മുഖ്യപാഠം അടിസ്ഥാനരൂപം നിലനിർത്തുന്നു; പൗലോസിന്റെ ദൗത്യസന്ദർഭത്തിലെ യഹൂദേതര അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: καρπός എന്ന രൂപകത്തിന്റെ വ്യാഖ്യാനം
  choice: ഫലം
  alternative: ശുശ്രൂഷയുടെ നേട്ടം
  rationale: മൂലപാഠത്തിലെ രൂപകം സംരക്ഷിച്ച് അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ മാത്രം വ്യക്തമാക്കുന്നു; ഫലം മതപരിവർത്തനം മാത്രമാണെന്നോ ആത്മീയ വളർച്ച മാത്രമാണെന്നോ പരിമിതപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ നിഷേധപ്രസ്താവനയും ‘ഫലം’ എന്ന രൂപകവും സംരക്ഷിച്ചു. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ ബന്ധങ്ങൾ വ്യക്തമായി നിലനിർത്താൻ ദ്വിബിന്ദുവും അർധവിരാമവും ഉപയോഗിച്ചു; മൂലത്തിൽ ഇല്ലാത്ത ആരംഭകാലസൂചകം ചേർത്തിട്ടില്ല.
