revisions:
- from: 'സഹോദരന്മാരേ[a], നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് എനിക്ക് ആഗ്രഹമില്ല: നിങ്ങളുടെ ഇടയിലും കുറെ ഫലം ലഭിക്കേണ്ടതിന്, മറ്റു ജനതകളുടെ ഇടയിൽ എന്നപോലെ, നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ പലപ്പോഴും പദ്ധതിയിട്ടിരുന്നു; എന്നാൽ ഇന്നുവരെ എനിക്ക് തടസ്സം നേരിട്ടു.[b]'
  to: 'സഹോദരന്മാരേ[a], നിങ്ങൾ അറിയാതിരിക്കണമെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നില്ല: നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ പലപ്പോഴും ഉദ്ദേശിച്ചിരുന്നു, എന്നാൽ ഇന്നുവരെ ഞാൻ തടയപ്പെട്ടു; മറ്റുള്ള യഹൂദേതരരുടെ ഇടയിലെപ്പോലെ നിങ്ങളുടെ ഇടയിലും എനിക്ക് കുറെ ഫലം ലഭിക്കേണ്ടതിനാണ് അത്.[b][c]'
  rationale: 'പരിഷ്കാരം ഗ്രീക്ക് വാക്യത്തിന്റെ മുഖ്യബന്ധങ്ങൾ നിലനിർത്തുന്നു: പൗലോസിന്റെ ആവർത്തിച്ച ഉദ്ദേശ്യം, ഇന്നുവരെ ഉണ്ടായ പുറത്തുനിന്നുള്ള തടസ്സം, റോമിലെ വിശ്വാസികൾക്കിടയിൽ ശുശ്രൂഷാഫലം ഉണ്ടാകണമെന്ന ഉദ്ദേശ്യം, മറ്റു യഹൂദേതരർക്കിടയിലെ സമാന്തരം. ‘ഫലം’ രൂപകമായി തന്നെയും ‘സഹോദരന്മാർ’ എന്ന ഔപചാരിക പുല്ലിംഗ സംബോധനം ഉൾക്കൊള്ളുന്ന അടിക്കുറിപ്പോടെയും സൂക്ഷിച്ചിരിക്കുന്നു. ആങ്കറുകൾ അതത് പദങ്ങളുമായി വ്യക്തമായി ബന്ധിപ്പിച്ചു.'
