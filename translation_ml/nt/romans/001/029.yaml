translation:
  language: ml
  text: എല്ലാത്തരം അനീതിയും[a] ദുഷ്ടതയും അത്യാഗ്രഹവും ദുർഭാവവും അവരിൽ നിറഞ്ഞിരിക്കുന്നു; അസൂയ, കൊലപാതകം, കലഹം, വഞ്ചന, ദുഷ്ടസ്വഭാവം എന്നിവകൊണ്ട് അവർ നിറഞ്ഞിരിക്കുന്നു; അവർ രഹസ്യമായി പരദൂഷണം പറയുന്നവരാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സകല അനീതിയും’; ഗ്രീക്ക് പ്രയോഗം സമഗ്രമായ വ്യാപ്തി സൂചിപ്പിക്കുന്നു.
