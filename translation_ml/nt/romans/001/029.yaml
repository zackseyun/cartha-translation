  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ രണ്ടു നിറവ്-പ്രയോഗങ്ങളുടെ സമാന്തരതയും ദുർഗുണപ്പട്ടികയുടെ താളവും പരമാവധി നിലനിർത്തി. അപൂർവമോ പഴഞ്ചനായോ തോന്നാവുന്ന ‘ഏഷണിക്കാർ’ ഒഴിവാക്കി അർഥം നേരിട്ട് വ്യക്തമാക്കുന്ന പ്രയോഗം ഉപയോഗിച്ചു.
