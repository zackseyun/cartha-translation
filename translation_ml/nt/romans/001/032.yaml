id: ROM.1.32
reference: Romans 1:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: ml
  text: ഇത്തരം കാര്യങ്ങൾ ചെയ്യുന്നവർ മരണത്തിന് അർഹരാണ് എന്ന ദൈവത്തിന്റെ നീതിയുള്ള വിധി[a] അവർ അറിഞ്ഞിട്ടും, അവർ അവ ചെയ്യുക മാത്രമല്ല, അവ ചെയ്യുന്നവരെ അംഗീകരിക്കുകയും ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ചട്ടം,’ ‘നിർദേശം,’ അല്ലെങ്കിൽ ‘ന്യായനിർണയം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: അവർ
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച ആളുകളെ സൂചിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി തുടരാൻ ‘അവർ’ ഉപയോഗിച്ചു.
- source_word: δικαίωμα
  choice: നീതിയുള്ള വിധി
  rationale: തുടർന്നുള്ള മരണാർഹതയെക്കുറിച്ചുള്ള വാക്യം വ്യക്തമാക്കുന്ന ദൈവത്തിന്റെ നീതിപൂർവമായ നിയമപരവും ധാർമികവുമായ നിർണയം സൂചിപ്പിക്കുന്നു.
- source_word: ἐπιγνόντες
  choice: അറിഞ്ഞിട്ടും
  rationale: അറിവിനും പ്രവൃത്തിക്കും ഇടയിലെ വൈരുധ്യം വ്യക്തമാക്കുന്ന concessive ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ഇത്തരം കാര്യങ്ങൾ ചെയ്യുന്നവർ
  rationale: പതിവായോ തുടർച്ചയായോ ഉള്ള പെരുമാറ്റത്തെ സൂചിപ്പിക്കുമ്പോഴും മലയാളത്തിൽ ഭാരമില്ലാതെ വായിക്കാവുന്ന പ്രയോഗം.
- source_word: ἄξιοι θανάτου
  choice: മരണത്തിന് അർഹരാണ്
  rationale: ഗ്രീക്കിലെ ന്യായവിധിപരമായ ശക്തി നേരിട്ട് നിലനിർത്തുന്നു; മരണം ഏത് വ്യാപ്തിയിലുള്ളതാണെന്ന് വിവർത്തനം നിർവചിക്കുന്നില്ല.
- source_word: ποιοῦσιν
  choice: അവ ചെയ്യുക
  rationale: ഗ്രീക്കിലെ സാധാരണ ‘ചെയ്യുക’ എന്ന ക്രിയയെ നേരിട്ട് പുനരാവിഷ്കരിക്കുകയും മുൻപത്തെ പ്രവൃത്തികളെ തിരിച്ചുസൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: συνευδοκοῦσιν
  choice: അംഗീകരിക്കുകയും ചെയ്യുന്നു
  rationale: മറ്റുള്ളവരുടെ പ്രവൃത്തികളോട് വെറും യോജിപ്പ് മാത്രമല്ല, സമ്മതവും അനുകൂല നിലപാടും പ്രകടിപ്പിക്കുന്ന അർഥം നൽകുന്നു.
- source_word: τοῖς πράσσουσιν
  choice: അവ ചെയ്യുന്നവരെ
  rationale: ആ പ്രവൃത്തികളിൽ ഏർപ്പെടുന്ന മറ്റുള്ളവരെ വ്യക്തമായി സൂചിപ്പിക്കുകയും വാക്യത്തിലെ ആവർത്തനസമാന്തര്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘മരണത്തിന് അർഹരാണ്’ എന്നതിന്റെ വ്യാപ്തി
  choice: ദൈവിക ന്യായവിധിയുടെ പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു; മരണത്തിന്റെ സ്വഭാവം കൂടുതൽ നിർവചിച്ചില്ല.
  alternative: ഇത് പ്രധാനമായും പൗരശിക്ഷയായ വധശിക്ഷയെയോ, വിശാലമായി അന്ത്യകാല മരണത്തെയോ സൂചിപ്പിക്കുന്നു എന്നു വ്യക്തമാക്കുക.
  rationale: വാക്യം മരണാർഹത പ്രസ്താവിക്കുന്നുവെങ്കിലും ആ മരണത്തിന്റെ പൂർണ വ്യാപ്തി ഇവിടെ നിർവചിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം ചുരുക്കാതെ അവ്യക്തത സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ തർക്കക്രമം ഡാഷുകൾ ഉപയോഗിച്ച് വ്യക്തമായി സൂക്ഷിച്ചു; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
