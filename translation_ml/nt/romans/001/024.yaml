id: ROM.1.24
reference: Romans 1:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: ml
  text: അതുകൊണ്ട് ദൈവം അവരെ അവരുടെ ഹൃദയങ്ങളിലെ മോഹങ്ങളിൽ അശുദ്ധിയിലേക്ക് വിട്ടുകൊടുത്തു—അവരുടെ ശരീരങ്ങൾ അവർക്കിടയിൽത്തന്നെ[a] അപമാനിക്കപ്പെടാൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അവരിൽ’; ഒരുപക്ഷേ ‘അവരവരിൽത്തന്നെ.’
    reason: ἐν αὐτοῖς എന്ന ചുരുക്കപ്രയോഗത്തിന് ‘അവർക്കിടയിൽ,’ ‘അവരിൽ,’ ‘അവരവരിൽത്തന്നെ’ എന്നീ അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παρέδωκεν
  choice: വിട്ടുകൊടുത്തു
  rationale: ഒരു ശക്തിയുടെയോ അവസ്ഥയുടെയോ അധീനതയിലേക്ക് ഏല്പിച്ചുകൊടുക്കുന്ന അർഥവും വാക്യത്തിലെ ന്യായവിധിയുടെ ഗൗരവവും നിലനിർത്തുന്നു; ‘ഉപേക്ഷിച്ചു’ എന്ന അധികവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: അവരുടെ ഹൃദയങ്ങളിലെ മോഹങ്ങളിൽ
  rationale: ἐν എന്നതിന്റെ സാഹചര്യപരമായ അർഥവും ‘ഹൃദയം’ എന്ന ഉറവിടരൂപകവും നിലനിർത്തുന്നു.
- source_word: ἐπιθυμίαις
  choice: മോഹങ്ങളിൽ
  rationale: സന്ദർഭത്തിൽ തെറ്റായ ആഗ്രഹങ്ങളെ സൂചിപ്പിക്കുന്നെങ്കിലും ലൈംഗിക കാമത്തിലേക്കു മാത്രം അർഥം ചുരുക്കാത്ത പദം.
- source_word: ἀκαθαρσίαν
  choice: അശുദ്ധിക്ക്
  rationale: ധാർമിക അശുദ്ധിയെ സൂചിപ്പിക്കുന്ന, നിലവാരമുള്ളതും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ പദം.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: അപമാനിക്കപ്പെടുന്നതിന്
  rationale: ഗ്രീക്കിലെ passive infinitive-നെ നിലനിർത്തുകയും ഉദ്ദേശ്യം/ഫലം എന്ന ബന്ധം പൂർണമായി തീർപ്പാക്കാതെ വിടുകയും ചെയ്യുന്നു.
- source_word: τὰ σώματα αὐτῶν
  choice: അവരുടെ ശരീരങ്ങൾ
  rationale: പൗലൊസിന്റെ ശരീരത്തെക്കുറിച്ചുള്ള വ്യക്തമായ ഊന്നൽ നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവർക്കിടയിൽത്തന്നെ
  rationale: സന്ദർഭത്തിന് യോജിച്ച പരസ്പര/സാമൂഹിക അർഥം സ്വാഭാവികമായി നൽകുന്നു; മറ്റുസാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: παρέδωκεν എന്നതിൽ ദൈവിക ന്യായവിധിയെ വിശദീകരിക്കുന്ന അധികപദങ്ങൾ ചേർക്കണമോ
  choice: വിട്ടുകൊടുത്തു
  alternative: ന്യായവിധിയായി ഉപേക്ഷിച്ചു / ശിക്ഷയായി ഏല്പിച്ചു
  rationale: ദൈവം അവരെ ഒരു അവസ്ഥയ്ക്ക് വിട്ടുകൊടുക്കുന്നു എന്ന വാക്യത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; എന്നാൽ ഉറവിടവാചകത്തിനപ്പുറം ഒരു വ്യവസ്ഥിത ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: τοῦ ἀτιμάζεσθαι ഉദ്ദേശ്യമാണോ ഫലമാണോ
  choice: അപമാനിക്കപ്പെടുന്നതിന്
  alternative: അങ്ങനെ അപമാനിക്കപ്പെട്ടു / അതിന്റെ ഫലമായി അപമാനിക്കപ്പെട്ടു
  rationale: ഗ്രീക്ക് infinitive-ന്റെ ബന്ധത്തിലെ യഥാർഥമായ തുറന്ന നില സംരക്ഷിക്കാൻ നാമവൽക്കരിച്ച ഘടന ഉപയോഗിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഹൃദയം,’ ‘ശരീരം,’ ‘അശുദ്ധി’ എന്നീ ഉറവിടത്തിലെ പ്രധാന രൂപങ്ങളും ആശയങ്ങളും സംരക്ഷിച്ചു; വാക്യത്തിന്റെ സാന്ദ്രത വായനാസൗകര്യത്തിനായി ദീർഘവിരാമംകൊണ്ട് ക്രമപ്പെടുത്തി.
