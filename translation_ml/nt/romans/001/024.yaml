review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential force of Διὸ, the divine handing-over expressed by παρέδωκεν, the heart-desires phrase, the passive dishonoring of the bodies, and the ambiguity of ἐν αὐτοῖς. However, εἰς ἀκαθαρσίαν is more clearly a movement/result-direction expression than the Malayalam dative-like “അശുദ്ധിക്ക്” conveys. “അശുദ്ധിയിലേക്ക്” represents this relation more directly.
  naturalness: The sentence is clear and suitably formal in modern standard Malayalam. “അവർക്കിടയിൽത്തന്നെ” is idiomatic enough in context, and the dash effectively handles the compact Greek infinitival clause. The revised directional phrase is also more natural with “വിട്ടുകൊടുത്തു.”
  terminology: “വിട്ടുകൊടുത്തു,” “ഹൃദയങ്ങൾ,” “മോഹങ്ങൾ,” “അശുദ്ധി,” “ശരീരങ്ങൾ,” and “അപമാനിക്കപ്പെടാൻ” are appropriate, understandable, and theologically noninterpretive. No doctrinal gloss has been introduced.
  issues:
  - severity: medium
    issue: The rendering “അശുദ്ധിക്ക്” does not clearly express εἰς ἀκαθαρσίαν.
    rationale: With παρέδωκεν, εἰς marks the condition or sphere into which they were handed over. “അശുദ്ധിയിലേക്ക്” more faithfully preserves the directional/resultative force without adding interpretation.
  revised_text: അതുകൊണ്ട് ദൈവം അവരെ അവരുടെ ഹൃദയങ്ങളിലെ മോഹങ്ങളിൽ അശുദ്ധിയിലേക്ക് വിട്ടുകൊടുത്തു—അവരുടെ ശരീരങ്ങൾ അവർക്കിടയിൽത്തന്നെ[a] അപമാനിക്കപ്പെടാൻ.
