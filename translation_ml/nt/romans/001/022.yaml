id: ROM.1.22
reference: Romans 1:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/022.yaml
  text: Claiming to be wise[a], they became fools[b],
translation:
  language: ml
  text: തങ്ങൾ ജ്ഞാനികളാണെന്ന് അവകാശപ്പെട്ടുകൊണ്ട്[a] അവർ മൂഢരായിത്തീർന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തങ്ങൾ ജ്ഞാനികളാണെന്ന് പ്രഖ്യാപിച്ചുകൊണ്ട്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവർ മൂഢതയുള്ളവരായിത്തീർന്നു’; അല്ലെങ്കിൽ, ‘അവർ മൂഢരാക്കപ്പെട്ടു.’
    reason: lexical_and_voice_alternative
lexical_decisions:
- source_word: φάσκοντες
  choice: അവകാശപ്പെട്ടുകൊണ്ട്
  rationale: വർത്തമാനകാല കൃദന്തരൂപം അവരുടെ സ്വയംപ്രഖ്യാപനത്തെ സൂചിപ്പിക്കുന്നു. ‘അവകാശപ്പെട്ടുകൊണ്ട്’ എന്നത് പരിഹാസധ്വനി നിലനിർത്തുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളമാണ്.
- source_word: εἶναι
  choice: ആണെന്ന്
  rationale: φάσκοντες എന്നതിനോടു ചേർന്ന് അവരുടെ അവകാശവാദത്തിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്ന അനന്തക്രിയാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σοφοὶ
  choice: ജ്ഞാനികൾ
  rationale: മൂലത്തിലെ വിധേയവിശേഷണത്തിന്റെ വിലയിരുത്തൽഭാവം നിലനിർത്തുകയും തുടർന്നുള്ള ‘മൂഢർ’ എന്ന നാമപദവുമായുള്ള മൂർച്ചയുള്ള വിരുദ്ധസമാന്തര്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐμωράνθησαν
  choice: മൂഢരായിത്തീർന്നു
  rationale: ക്രിയയുടെ സംഭവാരംഭപരമായ ഫലം—അവർ മൂഢരായി—വ്യക്തമാക്കുന്നു. ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപത്തെ നിർബന്ധമായി ബാഹ്യകർതൃപ്രയോഗമാക്കി മാറ്റാതെ അതിന്റെ സന്ദർഭസാധ്യമായ അകർമക അർഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐμωράνθησαν എന്നത് വ്യക്തികളെ ‘മൂഢർ’ എന്നു ശക്തമായി വിശേഷിപ്പിക്കുന്നതായോ ‘മൂഢതയുള്ളവരായി’ എന്ന ഗുണവിവരണമായോ വിവർത്തനം ചെയ്യണമോ
  choice: മൂഢരായിത്തീർന്നു
  alternative: മൂഢതയുള്ളവരായിത്തീർന്നു
  rationale: ‘ജ്ഞാനികൾ’ എന്നും ‘മൂഢർ’ എന്നും ഉള്ള പൗലോസിന്റെ മൂർച്ചയുള്ള വിരോധവും പരിഹാസവും ഈ രൂപം നന്നായി നിലനിർത്തുന്നു; അധികമായ സിദ്ധാന്താർഥം ചേർക്കുന്നില്ല.
- issue: ἐμωράνθησαν എന്ന നിഷ്ക്രിയരൂപത്തിൽ ബാഹ്യകർതാവിനെ വ്യക്തമാക്കണമോ
  choice: ബാഹ്യകർതാവിനെ ചേർക്കാതെ ‘ആയിത്തീർന്നു’ എന്നു നൽകുന്നു
  alternative: മൂഢരാക്കപ്പെട്ടു
  rationale: ഗ്രീക്കുരൂപത്തിന് നിഷ്ക്രിയവും അകർമകവുമായ വ്യാഖ്യാനസാധ്യതയുണ്ട്. സന്ദർഭത്തിൽ പറയാത്ത കർത്താവിനെ ചേർത്ത് ദൈവിക നിഷ്ക്രിയമെന്നോ മറ്റേതെങ്കിലും കാരണബന്ധമെന്നോ തീർപ്പാക്കാതെ യഥാർഥമായ അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അതേസമയം ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജ്ഞാനികൾ—മൂഢർ’ എന്ന സംക്ഷിപ്തവും മൂർച്ചയുള്ളതുമായ വാക്ചാതുര്യവിരോധം സംരക്ഷിച്ചിരിക്കുന്നു.
