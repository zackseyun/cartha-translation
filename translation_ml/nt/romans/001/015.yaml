  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്നെ സംബന്ധിച്ചിടത്തോളം, റോമിലുള്ള നിങ്ങളോടും സുവിശേഷം അറിയിക്കാൻ ഞാൻ ഉത്സുകനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘റോമിലുള്ള നിങ്ങളോടും സുവിശേഷം പ്രസംഗിക്കാൻ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ വിശദീകരണത്തിൽനിന്ന് പൗലോസിന്റെ ഉദ്ദേശ്യത്തിലേക്കു നയിക്കുന്ന നിഗമനസൂചകമായ ബന്ധപദമായി ഇവിടെ സ്വാഭാവികമാണ്.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: എന്നെ സംബന്ധിച്ചിടത്തോളം ... ഞാൻ ഉത്സുകനാണ്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും പ്രയോഗസവിശേഷവുമായ ഘടനയെ മലയാളത്തിൽ സ്വാഭാവികമായി തുറന്നുപറയുന്നു; πρόθυμον സൂചിപ്പിക്കുന്ന സന്നദ്ധതയും തീക്ഷ്ണമായ ആഗ്രഹവും ‘ഉത്സുകൻ’ നിലനിർത്തുന്നു.
- source_word: καὶ ὑμῖν
  choice: നിങ്ങളോടും
  rationale: മറ്റിടങ്ങളിലുള്ളവരോടൊപ്പം റോമിലുള്ളവരും ഉൾപ്പെടുന്നു എന്ന καίയുടെ ഉൾപ്പെടുത്തൽഭാവം ‘-ഉം’ വ്യക്തമായി നൽകുന്നു.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: റോമിലുള്ള
  rationale: സ്വീകർത്താക്കളെ നിർണയിക്കുന്ന ആർട്ടിക്കിളോടുകൂടിയ പൂർവപ്രത്യയപ്രയോഗത്തിന്റെ ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: εὐαγγελίσασθαι
  choice: സുവിശേഷം അറിയിക്കാൻ
  rationale: നല്ല വാർത്ത/സുവിശേഷം പ്രഖ്യാപിക്കുക എന്ന ക്രിയയുടെ അർഥം നൽകുന്നു; ഔപചാരിക പ്രസംഗത്തിൽ മാത്രം ഒതുങ്ങുന്ന ധാരണ ഒഴിവാക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗം വായനാസൗകര്യത്തിനായി തുറന്നുപറഞ്ഞു; καὶ ὑμῖν എന്നതിലെ ഉൾപ്പെടുത്തൽ ഊന്നൽ ‘നിങ്ങളോടും’ എന്നതിൽ നിലനിർത്തി.
