reference: Romans 1:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: ml
  text: എന്തെന്നാൽ, സത്യത്തെ അനീതിയിൽ അടിച്ചമർത്തുന്ന മനുഷ്യരുടെ എല്ലാ ദൈവഭക്തിയില്ലായ്മയ്ക്കും അനീതിക്കും എതിരായി ദൈവത്തിന്റെ ക്രോധം സ്വർഗത്തിൽനിന്ന് വെളിപ്പെടുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വെളിപ്പെട്ടുകൊണ്ടിരിക്കുന്നു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അടിച്ചമർത്തുന്ന” എന്നതിന് “തടഞ്ഞുനിർത്തുന്ന” അല്ലെങ്കിൽ “ഒതുക്കിവെക്കുന്ന” എന്നും അർഥമാകാം.
    reason: lexical_alternative
  - marker: c
    text: “അനീതിയിൽ” എന്നതിന് “അനീതിയാൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: വെളിപ്പെട്ടുകൊണ്ടിരിക്കുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിന്റെ തുടരുന്ന ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ലളിതമായി ‘വെളിപ്പെടുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുകയോ അതിന് അടിസ്ഥാനം നൽകുകയോ ചെയ്യുന്ന പൗലോസിന്റെ ബന്ധകതർക്കം വ്യക്തമാക്കുന്നു.
- source_word: ὀργὴ θεοῦ
  choice: ദൈവത്തിന്റെ ക്രോധം
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ഘടന നേരിട്ട് പകരുകയും ὀργήയുടെ വ്യക്തിപരവും ന്യായവിധിപരവുമായ ശക്തി മയപ്പെടുത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀπ’ οὐρανοῦ
  choice: സ്വർഗത്തിൽനിന്ന്
  rationale: ദൈവിക വെളിപ്പാടിന്റെ ഉറവിടം സൂചിപ്പിക്കുന്ന പ്രയോഗത്തിന്റെ നേരിട്ടുള്ള പരിഭാഷ.
- source_word: πᾶσαν ἀσέβειαν
  choice: എല്ലാ ദൈവഭക്തിയില്ലായ്മ
  rationale: ദൈവത്തോടുള്ള ആദരവിന്റെയും ഭക്തിയുടെയും അഭാവം എന്ന ἀσέβειαയുടെ ദിശ നിലനിർത്തുന്നു.
- source_word: ἀδικίαν
  choice: അനീതി
  rationale: ധാർമികവും ബന്ധപരവുമായ വിശാല അർഥം ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാള പദം; കേവലം സാമൂഹിക അന്യായമായി ചുരുക്കുന്നില്ല.
- source_word: ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: τῶν ... κατεχόντων
  choice: അമർത്തിവെക്കുന്ന
  rationale: സത്യത്തെ വെറും കൈവശംവയ്ക്കുക എന്നതിലുപരി തടഞ്ഞുനിർത്തുകയോ ഒതുക്കുകയോ ചെയ്യുന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: τὴν ἀλήθειαν
  choice: സത്യത്തെ
  rationale: അർഥം ചുരുക്കാതെയുള്ള നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἐν ἀδικίᾳ
  choice: അനീതിയിൽ
  rationale: ἐν എന്നതിന്റെ രൂപപരമായ തുറന്നത്വം സൂക്ഷിച്ച്, അനീതി പ്രവർത്തനത്തിന്റെ മേഖലയോ രീതിയോ ആകാമെന്ന യഥാർഥ ദ്വയാർഥസാധ്യത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὀργὴ θεοῦ എന്നത് വ്യക്തിപരമായ ദൈവിക ക്രോധമോ വ്യക്തിത്വരഹിതമായ ധാർമിക പരിണതഫലമോ
  choice: ദൈവത്തിന്റെ ക്രോധം
  alternative: അനീതിയുടെ സ്വാഭാവികമായ ദുഷ്ഫലം
  rationale: ജനിറ്റീവ് ഘടനയും പൗലോസിന്റെ വാദക്രമവും ദൈവത്തിന്റെ സ്വന്തം ന്യായവിധിപരമായ പ്രതികരണത്തെയാണ് പിന്തുണയ്ക്കുന്നത്; അതിനെ വ്യക്തിത്വരഹിതമായ പ്രക്രിയയായി മയപ്പെടുത്തിയിട്ടില്ല.
- issue: ἐν ἀδικίᾳ ഉപാധിയെയോ മേഖലയെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: അനീതിയിൽ
  alternative: അനീതിയാൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം ‘അനീതിയാൽ’ എന്ന ഉപാധിയെയും ‘അനീതിയിൽ’ എന്ന മേഖലയെയോ രീതിയെയോ അനുവദിക്കുന്നു. മുഖ്യപാഠത്തിൽ കൂടുതൽ രൂപസമീപമായ പ്രയോഗം സ്വീകരിച്ച് പാദക്കുറിപ്പിൽ മറ്റുസാധ്യത നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംയോജിപ്പിച്ചു. ‘ദൈവഭക്തിയില്ലായ്മ’, ‘അനീതി’, ‘ക്രോധം’ എന്നീ സ്ഥാപിതമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ἀδικίαയുടെ ആവർത്തനം ദൈവശാസ്ത്രപരവും വാഗ്മിതാപരവുമായി പ്രസക്തമായതിനാൽ മലയാളത്തിലും ‘അനീതി’ ആവർത്തിച്ചു.
