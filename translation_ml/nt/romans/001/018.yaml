  - severity: low
    issue: The rendering of κατεχόντων is slightly less idiomatic than available alternatives.
    rationale: For suppressing or stifling truth, Malayalam ‘അടിച്ചമർത്തുന്ന’ is more natural than ‘അമർത്തിവെക്കുന്ന,’ while maintaining the contextual sense of κατέχω.
