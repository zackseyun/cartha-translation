id: ROM.1.14
reference: Romans 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: ml
  text: ഗ്രീക്കുകാരോടും ബർബരരോടും[a], ജ്ഞാനികളോടും വിവേകമില്ലാത്തവരോടും ഞാൻ കടപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘വിദേശികളോടും’ അല്ലെങ്കിൽ ‘ഗ്രീക്കുകാരല്ലാത്തവരോടും’. ഇവിടെ ‘ബർബരർ’ എന്നത് ഗ്രീക്കുകാരും ഗ്രീക്കുകാരല്ലാത്തവരും തമ്മിലുള്ള അന്നത്തെ സാധാരണ സാംസ്കാരിക വേർതിരിവാണ് സൂചിപ്പിക്കുന്നത്; അവർ ക്രൂരന്മാരാണെന്ന അർഥം നിർബന്ധമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: ഗ്രീക്കുകാർ
  rationale: ഗ്രീക്ക് ഭാഷാ-സാംസ്കാരിക ലോകത്തിൽപ്പെട്ടവരെ സൂചിപ്പിക്കുന്ന ദത്തിവ് ബഹുവചനം; ആദ്യത്തെ സാമൂഹിക വിരുദ്ധജോടി നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βαρβάροις
  choice: ബർബരർ
  rationale: ഗ്രീക്കുകാർ അല്ലാത്തവരെ സൂചിപ്പിച്ചിരുന്ന അന്നത്തെ പതിവ് ഗ്രീക്ക് സാംസ്കാരിക സംജ്ഞ. ചരിത്രപരമായ വിരുദ്ധജോടി നിലനിർത്താൻ ലിപ്യന്തരണം ഉപയോഗിക്കുകയും ഇന്നത്തെ തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ അടിക്കുറിപ്പ് നൽകുകയും ചെയ്യുന്നു.
- source_word: σοφοῖς
  choice: ജ്ഞാനികൾ
  rationale: ‘വിവേകമില്ലാത്തവർ’ എന്ന വിരുദ്ധപദത്തോടു ചേരുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ പരിഭാഷ.
- source_word: ἀνοήτοις
  choice: വിവേകമില്ലാത്തവർ
  rationale: പദം അറിവില്ലായ്മയെ മാത്രം അല്ല, ഗ്രഹണശേഷിയുടെയോ വിവേകത്തിന്റെയോ അഭാവത്തെയും സൂചിപ്പിക്കാം; ‘അജ്ഞർ’ എന്നതിനെക്കാൾ ഈ വിപുലത നിലനിർത്തുന്നു.
- source_word: ὀφειλέτης
  choice: കടപ്പെട്ടിരിക്കുന്നു
  rationale: നാമരൂപമായ ‘കടക്കാരൻ’ എന്ന രൂപകം നിലനിർത്തുമ്പോഴും ഇവിടെ പണകടമല്ല, നിറവേറ്റേണ്ട ഉത്തരവാദിത്വമാണ് ഉദ്ദേശ്യമെന്നത് സന്ദർഭത്തിൽ വ്യക്തമാകുന്നു.
- source_word: τε ... καὶ / τε ... καὶ
  choice: …ഓടും …ഓടും / …ഓടും …ഓടും
  rationale: രണ്ടു സമതുലിത ജോടികളെയും മലയാളത്തിലെ ആവർത്തിത ‘-ഉം’ ഘടന സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ὀφειλέτης എന്നതിലെ കടത്തിന്റെ രൂപകവും ശുശ്രൂഷാബാധ്യതയും
  choice: ‘ഞാൻ കടപ്പെട്ടിരിക്കുന്നു’ എന്ന് രൂപകം നിലനിർത്തി
  alternative: ‘എനിക്ക് കടമയുണ്ട്’ / ‘ഞാൻ ബാധ്യസ്ഥനാണ്’
  rationale: മൂലത്തിലെ നാമരൂപകത്തിന്റെ ശക്തി സംരക്ഷിക്കുന്നു; അതിനെ വെറും ധനകടമായി ചുരുക്കാതെയും അപ്പൊസ്തലിക ബാധ്യതയുടെ പ്രത്യേക വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കാതെയും ഇരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ചരിത്രപരമായ സാംസ്കാരിക സംജ്ഞയായ ‘ബർബരർ’ അടിക്കുറിപ്പോടെ നിലനിർത്തി; സമാന്തര വാക്യഘടന ആവർത്തിത ‘-ഉം’ ഉപയോഗിച്ച് സംരക്ഷിച്ചു.
