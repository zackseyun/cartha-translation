revisions:
- from: അവർ നശിക്കാത്ത[a] ദൈവത്തിന്റെ മഹത്ത്വത്തെ, നശിക്കുന്ന മനുഷ്യന്റെയും[b] പക്ഷികളുടെയും നാലുകാലികളുടെയും ഇഴജന്തുക്കളുടെയും[c] രൂപമുള്ള ഒരു പ്രതിമയുടെ സാദൃശ്യമായി മാറ്റിക്കളഞ്ഞു[d].
  to: അവർ നശിക്കാത്ത[a] ദൈവത്തിന്റെ മഹത്ത്വം നശിക്കുന്ന മനുഷ്യന്റെയും[b] പക്ഷികളുടെയും നാലുകാലികളുടെയും ഇഴജന്തുക്കളുടെയും[c] പ്രതിമയുടെ സാദൃശ്യത്തിനായി കൈമാറി.
  rationale: The revision corrects the Malayalam expression of exchange so that God's glory is exchanged for the likeness of an image, rather than transformed into that likeness. It also restores the direct genitive sequence “പ്രതിമയുടെ സാദൃശ്യം,” preserving the source's deliberate, somewhat repetitive image language and singular construction. The former note d is unnecessary because the revised main text itself now follows that more literal construction.
