id: ROM.1.23
reference: Romans 1:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: ml
  text: അവർ നശിക്കാത്ത[a] ദൈവത്തിന്റെ മഹത്ത്വം നശിക്കുന്ന മനുഷ്യന്റെയും[b] പക്ഷികളുടെയും നാലുകാലികളുടെയും ഇഴജന്തുക്കളുടെയും[c] പ്രതിമയുടെ സാദൃശ്യത്തിനായി കൈമാറി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ക്ഷയിക്കാത്ത” അല്ലെങ്കിൽ “അക്ഷയനായ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നശ്വരനായ മനുഷ്യൻ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ “ഇഴയുന്നവ” അല്ലെങ്കിൽ “ഇഴയുന്ന ജീവികൾ”; ഈ ഗ്രീക്ക് പദം ആധുനിക ജീവശാസ്ത്രത്തിലെ ഉരഗവർഗത്തെക്കാൾ വിശാലമായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: മാറ്റിക്കളഞ്ഞു
  rationale: സന്ദർഭത്തിലെ മനഃപൂർവമായ പകരംവെക്കലിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: δόξαν
  choice: മഹത്ത്വം
  rationale: ദൈവത്തിന്റെ മഹിമയും ശ്രേഷ്ഠതയും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: ἀφθάρτου
  choice: നശിക്കാത്ത
  rationale: ക്ഷയത്തിനോ നാശത്തിനോ വിധേയനല്ല എന്ന അർഥം ലളിതമായും നേരിട്ടും നൽകുന്നു; φθαρτοῦ എന്നതുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: ഒരു പ്രതിമയുടെ സാദൃശ്യമായി
  rationale: മൂലത്തിലെ സാദൃശ്യം, പ്രതിമ എന്നീ രണ്ടുതലത്തിലുള്ള രൂപഭാഷയും ഏകവചനഘടനയും കഴിയുന്നത്ര നിലനിർത്തുന്നു.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: നശിക്കുന്ന മനുഷ്യൻ
  rationale: ἀφθάρτου/φθαρτοῦ എന്ന വ്യക്തമായ പദവൈരുധ്യം സംരക്ഷിക്കുന്നു; മനുഷ്യന്റെ നശ്വരതയാണ് ഉദ്ദേശ്യം.
- source_word: πετεινῶν
  choice: പക്ഷികൾ
  rationale: വ്യക്തവും സ്വാഭാവികവുമായ സമാനപദം.
- source_word: τετραπόδων
  choice: നാലുകാലികൾ
  rationale: നാലു കാലുള്ള ജന്തുക്കളെ സൂചിപ്പിക്കുന്ന മൂലപദത്തിന്റെ ദൃശ്യഭാവം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἑρπετῶν
  choice: ഇഴജന്തുക്കൾ
  rationale: ഇഴയുകയോ നിലത്തോടു ചേർന്ന് നീങ്ങുകയോ ചെയ്യുന്ന ജീവികളെ ഉൾക്കൊള്ളുന്ന, ആധുനിക ജീവശാസ്ത്രത്തിലെ ‘ഉരഗങ്ങൾ’ എന്ന വിഭാഗത്തേക്കാൾ വിശാലമായ തിരഞ്ഞെടുപ്പ്.
theological_decisions:
- issue: ദൈവത്തിന്റെ അനശ്വരതയും സൃഷ്ടികളുടെ നശ്വരതയും തമ്മിലുള്ള വൈരുധ്യം
  choice: “നശിക്കാത്ത ദൈവം” / “നശിക്കുന്ന മനുഷ്യൻ” എന്ന സമാന്തര പ്രയോഗം
  alternative: “അക്ഷയനായ ദൈവം” / “നശ്വരനായ മനുഷ്യൻ”
  rationale: പൗലൊസിന്റെ ἀφθάρτου/φθαρτοῦ പദവൈരുധ്യം ഒരേ പദമൂലം ഉപയോഗിച്ച് തുറന്നുകാട്ടുന്നു; ദാർശനികമോ സഭാപാരമ്പര്യപരമോ ആയ അധികവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ആവർത്തിത രൂപഭാഷ പൂർണമായി ലളിതമാക്കാതെ, മലയാളത്തിലെ വായനാസൗകര്യത്തിനായി “രൂപമുള്ള ഒരു പ്രതിമയുടെ സാദൃശ്യമായി” എന്നു ക്രമപ്പെടുത്തി.
