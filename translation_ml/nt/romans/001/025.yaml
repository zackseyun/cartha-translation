id: ROM.1.25
reference: Romans 1:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: ml
  text: ദൈവത്തിന്റെ സത്യം അവർ വ്യാജത്തിനുവേണ്ടി കൈമാറി; സ്രഷ്ടാവിനെക്കാൾ സൃഷ്ടിയെ ഭക്തിപൂർവം ആദരിക്കുകയും സേവിക്കുകയും ചെയ്തു. സ്രഷ്ടാവ് എന്നേക്കും വാഴ്ത്തപ്പെട്ടവനാകുന്നു. ആമേൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν ... ἐν
  choice: '... വ്യാജത്തിനായി കൈമാറി'
  rationale: വിലയേറിയതിനെ ഉപേക്ഷിച്ച് മറ്റൊന്ന് സ്വീകരിക്കുന്ന കൈമാറ്റത്തിന്റെ ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: ദൈവത്തെക്കുറിച്ചുള്ള സത്യം
  rationale: ജനിറ്റീവ് ദൈവത്തെ സംബന്ധിക്കുന്ന സത്യം എന്ന നിലയിൽ വായിക്കാം; ‘ദൈവത്തിന്റെ സത്യം’ എന്ന സാധ്യമായ അർഥം കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τῷ ψεύδει
  choice: വ്യാജം
  rationale: നിശ്ചയാർഥക ലേഖനമുള്ള ഏകവചനം കണക്കിലെടുത്ത് പൊതുവായ ‘നുണ’ എന്നതിനെക്കാൾ വിഗ്രഹാരാധനയുടെ അടിസ്ഥാനവ്യാജത്തെ സൂചിപ്പിക്കുന്ന രൂപം തെരഞ്ഞെടുത്തു.
- source_word: ἐσεβάσθησαν
  choice: ആദരിച്ചു
  rationale: λατρεύω എന്ന സേവന/ആരാധനാപദത്തിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ഭക്തിപൂർവമായ ആദരവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλάτρευσαν
  choice: സേവിച്ചു
  rationale: ആരാധനാസംബന്ധമായ സേവനത്തിന്റെ ആശയം നൽകുന്നു; മുൻക്രിയയുമായുള്ള വേർതിരിവും സംരക്ഷിക്കുന്നു.
- source_word: παρὰ τὸν κτίσαντα
  choice: സ്രഷ്ടാവിനെക്കാൾ
  rationale: 'παρά + accusative ഇവിടെ താരതമ്യ/മുൻഗണനാഭാവം നൽകുന്നു: സ്രഷ്ടാവിനുപകരം അല്ലെങ്കിൽ സ്രഷ്ടാവിനെക്കാൾ സൃഷ്ടിക്കു മുൻഗണന നൽകി.'
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും വാഴ്ത്തപ്പെട്ടവൻ
  rationale: ദൈവത്തെക്കുറിച്ചുള്ള സ്തുതിവാക്യത്തിന്റെ സ്വഭാവവും കാലാതീതതയും സ്വാഭാവികമായി പകർന്നു നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ സത്യം’ എന്ന ജനിറ്റീവിന്റെ അർഥം
  choice: ദൈവത്തെക്കുറിച്ചുള്ള സത്യം
  alternative: ദൈവത്തിന്റെ സത്യം / ദൈവത്തിൽനിന്നുള്ള സത്യം
  rationale: സന്ദർഭം മനുഷ്യർ ദൈവത്തെപ്പറ്റിയുള്ള യാഥാർഥ്യം വിഗ്രഹാരാധനയുടെ വ്യാജവുമായി കൈമാറിയതിനെ ഊന്നുന്നു; മറ്റ് ജനിറ്റീവ് സാധ്യതകൾ പൂർണമായി നിഷേധിക്കുന്നില്ല.
- issue: സൃഷ്ടിയോടുള്ള ἐσεβάσθησαν καὶ ἐλάτρευσαν
  choice: ആദരിക്കുകയും സേവിക്കുകയും ചെയ്തു
  alternative: ആരാധിക്കുകയും സേവിക്കുകയും ചെയ്തു
  rationale: രണ്ട് ഗ്രീക്ക് ക്രിയകളുടെയും വ്യത്യാസം സംരക്ഷിക്കാനും ആദ്യത്തേതിനെ രണ്ടാമത്തേതിൽ ലയിപ്പിക്കാതിരിക്കാനും ‘ആദരിച്ചു’ ഉപയോഗിച്ചു; സന്ദർഭം ഈ ആദരം മതപരമാണെന്ന് വ്യക്തമാക്കുന്നു.
- issue: παράയുടെ താരതമ്യവും പകരവുമായ ഭാവം
  choice: സ്രഷ്ടാവിനെക്കാൾ
  alternative: സ്രഷ്ടാവിനു പകരം
  rationale: താരതമ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു; എന്നാൽ സന്ദർഭത്തിൽ സ്രഷ്ടാവിനെ ഉപേക്ഷിച്ച് സൃഷ്ടിയെ തെരഞ്ഞെടുത്ത പകരത്തിന്റെ ആശയവും ഉൾക്കൊള്ളുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും സംരക്ഷിച്ചു. ‘സൃഷ്ടി/സ്രഷ്ടാവ്’ എന്ന പദജോടി ഗ്രീക്കിലെ κτίσις/κτίσας ബന്ധം വ്യക്തമാക്കുന്നു. അനാവശ്യ വ്യാഖ്യാനവിസ്താരം ഒഴിവാക്കി.
