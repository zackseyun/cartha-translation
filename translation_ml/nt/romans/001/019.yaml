id: ROM.1.19
reference: Romans 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: ml
  text: കാരണം, ദൈവത്തെക്കുറിച്ച് അറിയാൻ കഴിയുന്നത് അവരുടെ ഇടയിൽ വ്യക്തമാണ്[a]; ദൈവം അത് അവർക്കു വ്യക്തമാക്കിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവരിൽ” അല്ലെങ്കിൽ “അവരുടെ ഉള്ളിൽ.”
    reason: ἐν αὐτοῖς എന്ന പ്രയോഗത്തിന്റെ ‘അവരുടെ ഇടയിൽ’ എന്ന കൂട്ടായ അർഥത്തിനൊപ്പം സാധ്യമായ ആന്തരിക അർഥവും സംരക്ഷിക്കുന്നു.
lexical_decisions:
- source_word: διότι
  choice: കാരണം
  rationale: മുൻ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവികമായ കാരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: τὸ γνωστὸν
  choice: അറിയാൻ കഴിയുന്നത്
  rationale: നപുംസകലിംഗ വിശേഷണം നാമരൂപത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു; ഇവിടെ മനുഷ്യർക്ക് അറിവിലാകാൻ കഴിയുന്നതെന്ന ആശയം നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തെക്കുറിച്ച്
  rationale: ദൈവത്തെ സംബന്ധിച്ച് അറിയാവുന്ന കാര്യം എന്ന വസ്തുനിഷ്ഠ ജനിറ്റീവ് അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: φανερόν
  choice: വ്യക്തമാണ്
  rationale: തുറന്നുകാണാവുന്നതും തെളിഞ്ഞതുമായ അവസ്ഥയെ ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν αὐτοῖς
  choice: അവരുടെ ഇടയിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സാമൂഹികമോ കൂട്ടായതോ ആയ സ്ഥാനാർഥം മുഖ്യവാചകത്തിൽ നൽകുന്നു; ആന്തരിക സ്ഥാനാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: ദൈവംതന്നെ അത് അവർക്കു വ്യക്തമാക്കിയിരിക്കുന്നു
  rationale: φανερόν എന്നതുമായുള്ള ശബ്ദാർഥബന്ധം ‘വ്യക്തം/വ്യക്തമാക്കി’ എന്നതിലൂടെ നിലനിർത്തുകയും വെളിപ്പെടുത്തലിലെ ദൈവത്തിന്റെ പ്രവർത്തനത്തിന് ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν αὐτοῖς എന്നതിന്റെ അർഥം
  choice: അവരുടെ ഇടയിൽ
  alternative: അവരിൽ / അവരുടെ ഉള്ളിൽ
  rationale: പ്രയോഗം കൂട്ടായതോ പൊതുവായതോ ആയ വെളിപ്പെടുത്തലിനെയും ആന്തരികമായ അറിവിനെയും സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ട്. സൃഷ്ടിയിലൂടെ ലഭ്യമായ വെളിപ്പെടുത്തലിലേക്കുള്ള സന്ദർഭഗതി കണക്കിലെടുത്ത് മുഖ്യവാചകത്തിൽ ‘അവരുടെ ഇടയിൽ’ സ്വീകരിച്ചു; യഥാർഥമായ ദ്വയാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അറിയാൻ കഴിയുന്നത്’ എന്ന പ്രയോഗം τὸ γνωστὸν എന്നതിന്റെ സാധ്യതാർഥം നിലനിർത്തുന്നു. ‘വ്യക്തമാണ്/വ്യക്തമാക്കിയിരിക്കുന്നു’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ φανερόν–ἐφανέρωσεν ബന്ധം പ്രതിഫലിപ്പിക്കുന്നു.
