id: ROM.1.2
reference: Romans 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: ml
  text: വിശുദ്ധ തിരുവെഴുത്തുകളിൽ തന്റെ പ്രവാചകന്മാരിലൂടെ ദൈവം മുമ്പുതന്നെ വാഗ്ദാനം ചെയ്ത സുവിശേഷം[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “വിശുദ്ധ ലിഖിതങ്ങളിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: സുവിശേഷം
  rationale: ബന്ധസർവനാമം റോമർ 1:1-ലെ ‘സുവിശേഷം’ എന്ന നപുംസകലിംഗ ഏകവചന പദത്തെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ഒറ്റപ്പെട്ട ബന്ധവാക്യം അസ്വാഭാവികമായതിനാൽ സൂചിതപദം ആവർത്തിച്ച് ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: προεπηγγείλατο
  choice: മുമ്പുതന്നെ വാഗ്ദാനം ചെയ്ത
  rationale: ക്രിയയിലെ മുൻകാലസൂചനയും വാഗ്ദാനത്തിന്റെ അർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: തന്റെ പ്രവാചകന്മാരിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം/കർതൃത്വം ‘-ലൂടെ’ കൊണ്ട് പ്രകടമാക്കുന്നു; αὐτοῦ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: വിശുദ്ധ തിരുവെഴുത്തുകളിൽ
  rationale: ഗ്രാഫൈ ഇവിടെ അംഗീകൃത വിശുദ്ധലിഖിതങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘തിരുവെഴുത്തുകൾ’ യോജിക്കുന്നു; നിർദ്ദിഷ്ട ഉപപദം ഗ്രീക്കിൽ ഇല്ലാത്തതിനാൽ മലയാളത്തിലും ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: γραφαῖς ἁγίαις എന്നത് ‘വിശുദ്ധ തിരുവെഴുത്തുകൾ’ എന്നോ ‘വിശുദ്ധ ലിഖിതങ്ങൾ’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: വിശുദ്ധ തിരുവെഴുത്തുകളിൽ
  alternative: വിശുദ്ധ ലിഖിതങ്ങളിൽ
  rationale: പൗലോസിന്റെ പ്രയോഗസന്ദർഭത്തിൽ γραφαί സാധാരണ സാഹിത്യത്തെക്കാൾ വിശുദ്ധഗ്രന്ഥരചനകളെ സൂചിപ്പിക്കുന്നു. എങ്കിലും ‘ലിഖിതങ്ങൾ’ എന്ന പദശഃ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഈ വാക്യം റോമർ 1:1-ലെ ‘സുവിശേഷം’ എന്നതിനെ തുടർന്നുള്ള ആശ്രിതഘടകമായതിനാൽ അവസാനം ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു; പ്രസിദ്ധീകരണത്തിൽ 1:1–4 ഒറ്റ വാക്യമായി ചേരുമ്പോൾ വിരാമചിഹ്നം ക്രമീകരിക്കാം.
