  source_fidelity: ‘സുവിശേഷം’ എന്ന മുൻവാക്യത്തിലെ ὃ-യുടെ സൂചിതപദം വ്യക്തമായി ആവർത്തിച്ചിരിക്കുന്നു. προεπηγγείλατο-യിലെ മുൻകാല/മുൻകൂർ വാഗ്ദാനാർഥം ‘മുമ്പുതന്നെ വാഗ്ദാനം ചെയ്ത’ എന്നതിൽ നിലനിൽക്കുന്നു. ‘തന്റെ പ്രവാചകന്മാരിലൂടെ’ διά + genitive-ന്റെ മാധ്യമാർഥവും αὐτοῦ-യുടെ ദൈവസംബന്ധമായ ഉടമസ്ഥതയും വിശ്വസ്തമായി നൽകുന്നു. ‘വിശുദ്ധ തിരുവെഴുത്തുകളിൽ’ ἐν γραφαῖς ἁγίαις-ന്റെ സന്ദർഭോചിതമായ അർഥമാണ്.
