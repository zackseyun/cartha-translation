id: ROM.1.20
reference: Romans 1:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: ml
  text: ദൈവത്തിന്റെ അദൃശ്യഗുണങ്ങൾ[a]—അതായത്, അവിടുത്തെ നിത്യശക്തിയും ദൈവികതയും[b]—ലോകസൃഷ്ടിമുതൽ സൃഷ്ടിക്കപ്പെട്ടവയിലൂടെ ഗ്രഹിക്കപ്പെടുകയും വ്യക്തമായി കാണപ്പെടുകയും ചെയ്യുന്നു; അതിനാൽ അവർക്ക് ഒഴികഴിവില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തെക്കുറിച്ചുള്ള കാണാനാവാത്ത കാര്യങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ദൈവസ്വഭാവം.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദം θειότης ആണ്; കൂടുതൽ ശക്തമായ θεότης എന്ന പദമല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: ദൈവത്തിന്റെ കാണാനാവാത്ത ഗുണങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനം ദൈവത്തെക്കുറിച്ചു ദൃശ്യഗോചരമല്ലാത്ത കാര്യങ്ങളെ വിശാലമായി സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ശക്തിയും ദൈവികതയും വിശദീകരണമായി വരുന്നതിനാൽ ‘ഗുണങ്ങൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; പദത്തിന്റെ വിശാലത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: ലോകം സൃഷ്ടിക്കപ്പെട്ടതുമുതൽ
  rationale: ἀπό ഇവിടെ ആരംഭകാലത്തെ സൂചിപ്പിക്കുന്നു. ദൈവത്തിന്റെ അദൃശ്യഗുണങ്ങൾ സൃഷ്ടിയുടെ ആരംഭംമുതൽ ഗ്രഹിക്കപ്പെടുന്നു എന്ന കാലപരമായ അർഥം ഈ പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῖς ποιήμασιν
  choice: സൃഷ്ടിക്കപ്പെട്ടവയിലൂടെ
  rationale: 'ദത്തി വിഭക്തിക്ക് ഇവിടെ ഉപകരണാർഥമാണ്: ഉണ്ടാക്കപ്പെട്ടവയാണ് ഗ്രഹിക്കുന്നതിനുള്ള മാർഗം. ദൈവമാണ് സ്രഷ്ടാവ് എന്നത് സന്ദർഭത്തിൽ വ്യക്തമെങ്കിലും ഗ്രീക്കിലെ കർമണി രൂപം സംരക്ഷിക്കുന്നു.'
- source_word: νοούμενα
  choice: മനസ്സിലാക്കപ്പെട്ട്
  rationale: കാണാനാവാത്തത് സൃഷ്ടിക്കപ്പെട്ടവയിൽനിന്ന് ബുദ്ധിയാൽ ഗ്രഹിക്കപ്പെടുന്നു എന്ന ചിന്താപരമായ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: καθορᾶται
  choice: വ്യക്തമായി കാണപ്പെടുന്നു
  rationale: ക്രിയയുടെ തീവ്രതയും വർത്തമാനകാലത്തിലെ തുടർച്ചയായ യാഥാർഥ്യവും നിലനിർത്തുന്നു.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: അതായത്, അവിടുത്തെ നിത്യശക്തി
  rationale: ഈ പദസമുച്ചയം മുമ്പുള്ള ‘കാണാനാവാത്ത ഗുണങ്ങൾ’ എന്നതിനെ വിശദീകരിക്കുന്നു. ἀΐδιος എന്നതിന്റെ കാലാതീതവും അവസാനമില്ലാത്തതുമായ അർഥം ‘നിത്യ’ സംരക്ഷിക്കുന്നു.
- source_word: θειότης
  choice: ദൈവികത
  rationale: θειότης ദൈവികമായ ഗുണത്തെയോ സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്നു; θεότης എന്ന കൂടുതൽ ശക്തമായ പദവുമായി ഇതിനെ കലർത്താതെ ‘ദൈവികത’ വ്യത്യാസം നിലനിർത്തുന്നു.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: അതുകൊണ്ട് അവർക്ക് ഒഴികഴിവില്ല
  rationale: ഇവിടെ നിർമാണം ഫലത്തെ പ്രകടിപ്പിക്കുന്നു. ‘അതുകൊണ്ട്’ ആ ഫലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: θειότης എന്ന പദം പൗലൊസിന്റെ പ്രയോഗത്തെക്കാൾ ശക്തമാക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ദൈവികത
  alternative: ദൈവസ്വഭാവം; ദൈവത്വം
  rationale: സൃഷ്ടിയിലൂടെ ദൈവത്തെക്കുറിച്ചുള്ള യഥാർഥ ദൈവിക ഗുണം വെളിവാകുന്നു എന്ന് വാക്യം ഉറപ്പിക്കുന്നു. എന്നാൽ θειότης എന്നത് θεότης അല്ലാത്തതിനാൽ, കൂടുതൽ സത്താപരമായി കേൾക്കാവുന്ന ‘ദൈവത്വം’ എന്നതിനുപകരം ‘ദൈവികത’ ഗ്രീക്കിലെ വ്യത്യാസം നന്നായി നിലനിർത്തുന്നു.
- issue: εἰς τὸ εἶναι എന്നതിലെ ഉദ്ദേശ്യം–ഫലം സാധ്യത
  choice: 'ഫലം: ‘അതുകൊണ്ട് അവർക്ക് ഒഴികഴിവില്ല’'
  alternative: 'ഉദ്ദേശ്യം: ‘അവർക്ക് ഒഴികഴിവില്ലാതിരിക്കേണ്ടതിന്’'
  rationale: സന്ദർഭത്തിൽ സൃഷ്ടിയിലൂടെ ലഭിക്കുന്ന അറിവിന്റെ ഫലമായി മനുഷ്യർ ഒഴികഴിവില്ലാത്തവരാകുന്നു എന്ന വായന കൂടുതൽ സ്വാഭാവികമാണ്; ഗ്രീക്ക് നിർമാണത്തിന് ഉദ്ദേശ്യത്തിന്റെ നിഴൽ ഉണ്ടായിരിക്കാമെങ്കിലും അതിനെ മലയാളത്തിൽ നിർബന്ധിച്ച് ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അവിടുത്തെ’ എന്ന ആദരസൂചക സർവനാമം സ്വാഭാവിക മലയാളശൈലി നൽകുന്നു. ഗ്രീക്കിലെ ദീർഘവാക്യഘടന നിലനിർത്തിക്കൊണ്ട് ഡാഷുകൾ വിശദീകരണഭാഗം വ്യക്തമാക്കുന്നു; അവസാന ഫലവാക്യം വായനാസൗകര്യത്തിനായി വേർതിരിച്ചിരിക്കുന്നു.
