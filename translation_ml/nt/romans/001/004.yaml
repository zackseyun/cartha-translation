reference: Romans 1:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: ml
  text: വിശുദ്ധിയുടെ ആത്മാവനുസരിച്ച്[b], മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനത്താൽ ശക്തിയിൽ ദൈവപുത്രനെന്ന് പ്രഖ്യാപിക്കപ്പെട്ടവനായ നമ്മുടെ കർത്താവായ യേശു മശീഹ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, “പരിശുദ്ധാത്മാവനുസരിച്ച്.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: പ്രഖ്യാപിക്കപ്പെട്ട
  rationale: ὁρίζω എന്ന പദത്തിന് ‘നിർണയിക്കുക’, ‘നിയോഗിക്കുക’, ‘വ്യക്തമായി അടയാളപ്പെടുത്തുക/പ്രഖ്യാപിക്കുക’ എന്നീ അർഥസാധ്യതകളുണ്ട്. ഇവിടെ പുനരുത്ഥാനത്തോടനുബന്ധിച്ച് പുത്രത്വം ശക്തിയിൽ വെളിവായതായി സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും, യേശു അപ്പോഴാണ് ആദ്യമായി ദൈവപുത്രനായത് എന്നു വാചകം നിർബന്ധിക്കുന്നില്ല. പ്രധാന പകരങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: υἱοῦ θεοῦ
  choice: ദൈവപുത്രൻ
  rationale: ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനനാമം നേരിട്ടും സ്വാഭാവികമായും സംരക്ഷിക്കുന്ന മലയാളരൂപം.
- source_word: ἐν δυνάμει
  choice: ശക്തിയിൽ
  rationale: ഗ്രീക്കിലെ അടുത്ത രൂപം സംരക്ഷിക്കുകയും, വെറും ‘ശക്തിയോടെ പ്രഖ്യാപിച്ചു’ എന്ന ക്രിയാവിശേഷണാർഥത്തിലേക്ക് മാത്രം ചുരുക്കാതെ ശക്തിയിലുള്ള പുത്രത്വത്തിന്റെ നിലയോ പ്രകടനമോ തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: വിശുദ്ധിയുടെ ആത്മാവനുസരിച്ച്
  rationale: അപൂർവമായ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും അർഥതുറവും സംരക്ഷിക്കുന്നു. ഇത് പരിശുദ്ധാത്മാവിനെ നേരിട്ട് സൂചിപ്പിക്കുന്നുവോ, വിശുദ്ധിയാൽ സവിശേഷമായ ആത്മീയ മണ്ഡലത്തെയോ സ്വഭാവത്തെയോ സൂചിപ്പിക്കുന്നുവോ എന്നു മുഖ്യവാചകം തീർപ്പാക്കുന്നില്ല.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുള്ള പുനരുത്ഥാനത്താൽ
  rationale: ἐξ ഇവിടെ അടിസ്ഥാനമോ നിർണായക സംഭവമോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; νεκρῶν എന്ന ബഹുവചനത്തിന്റെ കൂട്ടാർഥവും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹ
  rationale: Χριστός ഇവിടെ സ്ഥാനനാമമായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി അതിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ അധികാരപരവും ക്രിസ്തുശാസ്ത്രപരവുമായ അനുരണനങ്ങൾ സൂക്ഷിക്കുന്ന സ്ഥിരവും സ്വാഭാവികവുമായ മലയാളപദം.
theological_decisions:
- issue: ὁρισθέντος എന്നത് യേശു പുനരുത്ഥാനത്തിൽ മാത്രമാണ് ദൈവപുത്രനായതെന്ന് സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘ശക്തിയിൽ ദൈവപുത്രനെന്ന് പ്രഖ്യാപിക്കപ്പെട്ട’ എന്നു നൽകി, പുത്രത്വത്തിന്റെ ശക്തിയിലുള്ള വെളിപ്പാടായി വായിക്കാനുള്ള ഇടം നിലനിർത്തുന്നു.
  alternative: ‘ശക്തിയിൽ ദൈവപുത്രനായി നിയോഗിക്കപ്പെട്ട’ അല്ലെങ്കിൽ ‘ദൈവപുത്രനായി നിർണയിക്കപ്പെട്ട’.
  rationale: ഗ്രീക്ക് പദം നിയമനം, നിർണയം, വ്യക്തമായ അടയാളപ്പെടുത്തൽ എന്നിവ ഉൾക്കൊള്ളാം. യേശുവിന്റെ പുത്രത്വം പുനരുത്ഥാനത്തിൽ ആരംഭിച്ചു എന്ന വ്യാഖ്യാനം ചേർക്കാതെയും പദത്തിന്റെ യഥാർഥ പിരിമുറുക്ക് മായിക്കാതെയും മുഖ്യവാചകം രൂപപ്പെടുത്തി.
- issue: πνεῦμα ἁγιωσύνης പ്രത്യേകമായി പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ‘വിശുദ്ധിയുടെ ആത്മാവ്’ എന്ന സുതാര്യമായ രൂപം ഉപയോഗിച്ച് നിർദ്ദിഷ്ട പരാമർശം തുറന്നുവെക്കുന്നു.
  alternative: ‘പരിശുദ്ധാത്മാവനുസരിച്ച്’ അല്ലെങ്കിൽ ‘അവന്റെ വിശുദ്ധമായ ആത്മാവനുസരിച്ച്’.
  rationale: ഈ അപൂർവപ്രയോഗം 3-ാം വാക്യത്തിലെ ‘ജഡപ്രകാരം’ എന്നതിനോടുള്ള സമാന്തരവിരോധമായിരിക്കാം; അതിനാൽ ഗ്രീക്ക് നൽകുന്നതിലധികം വ്യാഖ്യാനനിശ്ചയം മുഖ്യവാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിച്ച ബന്ധവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ അവസാനം ‘യും’ നിലനിർത്തിയിരിക്കുന്നു. അപൂർവമായ ‘വിശുദ്ധിയുടെ ആത്മാവ്’ എന്ന പ്രയോഗം വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം ഉപയോഗിച്ചു.
