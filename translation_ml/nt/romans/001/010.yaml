source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: ml
  text: എന്റെ പ്രാർഥനകളിൽ എപ്പോഴും, എങ്ങനെയെങ്കിലും ഒടുവിൽ ദൈവത്തിന്റെ ഹിതത്താൽ നിങ്ങളുടെ അടുക്കൽ വരുന്നതിൽ എനിക്ക് വിജയം ലഭിക്കണമെന്നാണ് ഞാൻ അപേക്ഷിക്കുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ അടുക്കൽ വരാൻ എനിക്ക് അനുകൂലത ലഭിക്കണം” അല്ലെങ്കിൽ “നിങ്ങളുടെ അടുക്കലേക്കുള്ള യാത്ര വിജയകരമാകണം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: എപ്പോഴും
  rationale: പൗലോസിന്റെ പതിവായ പ്രാർഥനയെ സൂചിപ്പിക്കുന്ന തുടർച്ചയുടെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: എന്റെ പ്രാർഥനകളിൽ
  rationale: പ്രാർഥനയുടെ സമയത്തും സാഹചര്യത്തിലും എന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δεόμενος
  choice: ഞാൻ അപേക്ഷിക്കുന്നത്
  rationale: പ്രാർഥനാസന്ദർഭത്തിലെ ആത്മാർഥമായ അഭ്യർഥനയെ വ്യക്തമാക്കുന്നു; വെറും ചോദിക്കൽ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ ഭാവം നന്നായി വഹിക്കുന്നു.
- source_word: εἴ πως
  choice: എങ്ങനെയെങ്കിലും
  rationale: ആഗ്രഹത്തോടൊപ്പം മാർഗത്തെക്കുറിച്ചുള്ള അനിശ്ചിതത്വവും നിലനിർത്തുന്നു.
- source_word: ἤδη ποτὲ
  choice: ഇപ്പോഴെങ്കിലും
  rationale: ദീർഘകാലമായി കാത്തിരുന്ന അവസരം ഒടുവിൽ ലഭിക്കണമെന്ന പ്രതീക്ഷയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εὐοδωθήσομαι
  choice: എനിക്ക് വഴി തുറന്നുകിട്ടണം
  rationale: ക്രിയയുടെ ‘വഴി അനുകൂലമാകുക/വിജയകരമായി മുന്നേറുക’ എന്ന പശ്ചാത്തലാർഥം യാത്രാസന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; ധനസമൃദ്ധി എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഹിതത്താൽ
  rationale: പൗലോസിന്റെ വരവ് ദൈവഹിതത്തിന്റെ നിയന്ത്രണത്തിലും അനുമതിയിലുമാണെന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വരാൻ
  rationale: ‘വരുക’ എന്ന മൂലക്രിയയെ അധിക വിശദീകരണമില്ലാതെ നേരിട്ട് പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ യാത്രയും ദൈവഹിതവും തമ്മിലുള്ള ബന്ധം
  choice: ദൈവത്തിന്റെ ഹിതത്താൽ
  alternative: ദൈവത്തിന്റെ ഹിതത്തിനുള്ളിൽ
  rationale: ἐν എന്ന പ്രയോഗം ഇവിടെ ഉപാധി, നിയന്ത്രണം, അല്ലെങ്കിൽ പ്രവർത്തക സാഹചര്യം എന്നിങ്ങനെ ഗ്രഹിക്കാം. പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ കാരണ/അനുമതി ഭാവം നൽകിയെങ്കിലും ദൈവഹിതത്തെ യാന്ത്രിക നിർണ്ണയമായി വ്യാഖ്യാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രാർഥനയുടെ ആത്മാർഥതയും യാത്രയുടെ അനിശ്ചിതത്വവും ദൈവഹിതത്തോടുള്ള ആശ്രയവും നിലനിർത്തിയിരിക്കുന്നു.
