revisions:
- from: എന്തെന്നാൽ, നിങ്ങളെ ഉറപ്പിക്കേണ്ടതിന് എന്തെങ്കിലും ആത്മികവരം നിങ്ങളുമായി പങ്കുവെക്കാൻ നിങ്ങളെ കാണണമെന്ന് ഞാൻ അതിയായി ആഗ്രഹിക്കുന്നു.[a]
  to: എന്തെന്നാൽ, നിങ്ങൾ ഉറപ്പിക്കപ്പെടേണ്ടതിന് നിങ്ങൾക്കു എന്തെങ്കിലും ആത്മിക വരം പകർന്നുനൽകാൻ നിങ്ങളെ കാണാൻ ഞാൻ അതിയായി ആഗ്രഹിക്കുന്നു.
  rationale: The revision directly renders μεταδῶ ὑμῖν as «നിങ്ങൾക്കു ... പകർന്നുനൽകാൻ» and retains the passive ambiguity of στηριχθῆναι as «നിങ്ങൾ ഉറപ്പിക്കപ്പെടേണ്ടതിന്.» It keeps the indefinite «എന്തെങ്കിലും» and the theologically nonrestrictive expression «ആത്മിക വരം.» No footnote is needed once the passive is represented in the main text.
