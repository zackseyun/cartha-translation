id: ROM.1.11
reference: Romans 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾ ഉറപ്പിക്കപ്പെടേണ്ടതിന് നിങ്ങൾക്കു എന്തെങ്കിലും ആത്മിക വരം പകർന്നുനൽകാൻ നിങ്ങളെ കാണാൻ ഞാൻ അതിയായി ആഗ്രഹിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: അതിയായി ആഗ്രഹിക്കുന്നു
  rationale: ശക്തമായ വ്യക്തിപരമായ ആഗ്രഹം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻസന്ദർഭത്തോടുള്ള വിശദീകരണബന്ധം നിലനിർത്തുന്നു.
- source_word: ἰδεῖν
  choice: കാണണമെന്ന്
  rationale: സന്ദർശനം സൂചിപ്പിക്കപ്പെടുന്നുണ്ടെങ്കിലും ഗ്രീക്കിലെ ‘കാണുക’ എന്ന അടിസ്ഥാനാർഥം സംരക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: —വേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: ഗ്രീക്കിലെ അനിശ്ചിതത്വം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μεταδῶ
  choice: പങ്കുവെക്കാൻ
  rationale: ഒരാൾക്കുള്ളത് മറ്റുള്ളവരുമായി പങ്കിടുക അഥവാ പകർന്നുനൽകുക എന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: χάρισμα πνευματικὸν
  choice: ആത്മികവരം
  rationale: ഒരു പ്രത്യേക അത്ഭുതവരമായി അർഥം ചുരുക്കാതെ, ആത്മികമായ ദാനം അല്ലെങ്കിൽ പ്രയോജനം എന്ന വിശാലത നിലനിർത്തുന്നു.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: നിങ്ങളെ ഉറപ്പിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിലെ കർമണിപ്രയോഗം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ആത്മികവരം’ ഒരു പ്രത്യേക അത്ഭുതകരമായ വരത്തെയാണോ വിശാലമായ ആത്മിക പ്രയോജനത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: എന്തെങ്കിലും ആത്മികവരം
  alternative: ആത്മാവിൽനിന്നുള്ള എന്തെങ്കിലും വരം; ആത്മികമായ എന്തെങ്കിലും അനുഗ്രഹം
  rationale: ഗ്രീക്ക് പ്രയോഗം ഒരു സാങ്കേതികമോ അത്ഭുതപരമോ ആയ അർഥം നിർബന്ധിക്കുന്നില്ല; അതിനാൽ അതിന്റെ വിശാലതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: στηριχθῆναι എന്ന കർമണിരൂപം പരിഭാഷയിൽ എങ്ങനെ നൽകണം
  choice: നിങ്ങളെ ഉറപ്പിക്കേണ്ടതിന്
  alternative: നിങ്ങൾ ഉറപ്പിക്കപ്പെടേണ്ടതിന്
  rationale: പ്രധാനവാക്യത്തിൽ സ്വാഭാവിക മലയാളം ഉപയോഗിക്കുമ്പോൾ മൂലത്തിലെ കർമണിഘടന അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു; ഉറപ്പിക്കുന്ന കർത്താവ് ആരെന്നത് അനാവശ്യമായി നിർണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ആത്മികവരം’ പരിചിതമായ ബൈബിൾപദമാണെങ്കിലും ഇവിടെ അതിനെ ഒരു പ്രത്യേക വിഭാഗത്തിലുള്ള വരമായി ചുരുക്കുന്നില്ല.
