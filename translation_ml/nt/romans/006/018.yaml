id: ROM.6.18
reference: Romans 6:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: ml
  text: എന്നാൽ പാപത്തിൽനിന്ന് സ്വതന്ത്രരാക്കപ്പെട്ട നിങ്ങൾ നീതിയുടെ[a] അടിമകളാക്കപ്പെട്ടു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ന്യായത്തിന്റെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നീതിക്ക് അടിമകളാക്കപ്പെട്ടു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: സ്വതന്ത്രരാക്കപ്പെട്ട
  rationale: ഏറിസ്റ്റ് കർമണി കൃദന്തരൂപം അഭിസംബോധിതർ ഏറ്റുവാങ്ങിയ പൂർത്തിയായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഈ പ്രയോഗം കർമണിഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയവുമായി നേരിയ വൈരുധ്യവും വാദത്തിന്റെ തുടർച്ചയും സൂചിപ്പിക്കുന്ന ബന്ധകമായി ഇവിടെ പ്രവർത്തിക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപത്തിൽനിന്ന്
  rationale: ഏകവചനത്തിലുള്ള ‘പാപം’ എന്നത് പൗലോസിന്റെ സന്ദർഭത്തിൽ ഭരിക്കുന്ന ശക്തിയായി വ്യക്തിവൽക്കരിക്കപ്പെട്ട അർഥവും അമൂർത്തമായ അർഥവും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: ἐδουλώθητε
  choice: അടിമകളാക്കപ്പെട്ടു
  rationale: δουλόω എന്ന ക്രിയയിലെ ശക്തമായ അടിമത്തരൂപകം മയപ്പെടുത്താതെ കർമണിഭാവത്തോടെ പകർത്തുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതിക്ക്
  rationale: ദാതൃവിഭക്തി പുതിയ യജമാനത്വത്തിനോ അധീനതയ്ക്കോ ഉള്ള ബന്ധം സൂചിപ്പിക്കുന്നു; ‘നീതി’ ധാർമികവും ന്യായപരവുമായ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
theological_decisions:
- issue: δουλόω എന്ന അടിമത്തരൂപകത്തിന്റെ വിവർത്തനം
  choice: നീതിക്ക് അടിമകളാക്കപ്പെട്ടു
  alternative: നീതിയുടെ ദാസന്മാരായിത്തീർന്നു
  rationale: റോമർ 6-ലെ പാപത്തിന്റെ അധീനതയിൽനിന്ന് നീതിയുടെ അധീനതയിലേക്കുള്ള യജമാനത്വമാറ്റം ശക്തമായി നിലനിർത്തുന്നു; ‘ദാസന്മാർ’ എന്ന മൃദുവായ പ്രയോഗം മൂലത്തിലെ ബന്ധിതാവസ്ഥയുടെ തീക്ഷ്ണത കുറയ്ക്കാം.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: നീതി
  alternative: ന്യായം
  rationale: ഇവിടെ ‘നീതി’ ധാർമിക ശരിത്വം ഉൾപ്പെടെയുള്ള പൗലോസിന്റെ വിശാലമായ പ്രയോഗം തുറന്നുവയ്ക്കുന്നു; ‘ന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ രണ്ട് കർമണിരൂപങ്ങളും പാപം–നീതി എന്ന യജമാനത്വമാറ്റത്തിന്റെ ശക്തമായ രൂപകവും സംരക്ഷിച്ചിരിക്കുന്നു.
