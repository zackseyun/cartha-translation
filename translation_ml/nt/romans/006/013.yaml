id: ROM.6.13
reference: Romans 6:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: ml
  text: നിങ്ങളുടെ അവയവങ്ങളെ അനീതിയുടെ ആയുധങ്ങളായി[a] പാപത്തിനു സമർപ്പിക്കരുത്. പകരം, മരിച്ചവരിൽനിന്ന് ജീവിച്ചിരിക്കുന്നവരെപ്പോലെ നിങ്ങളെത്തന്നെ ദൈവത്തിനു സമർപ്പിക്കുവിൻ; നിങ്ങളുടെ അവയവങ്ങളെ നീതിയുടെ[b] ആയുധങ്ങളായി ദൈവത്തിനു സമർപ്പിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആയുധങ്ങൾ” എന്നതിന് പകരം “ഉപകരണങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “നീതി” എന്നതിന് പകരം “ന്യായം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: സമർപ്പിക്കുക
  rationale: ഒരാളുടെ അധികാരത്തിനോ ഉപയോഗത്തിനോ സ്വയം ഏല്പിച്ചുകൊടുക്കുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും രണ്ടു കല്പനകളിലെയും ആവർത്തനം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ധാർമിക പ്രവർത്തനങ്ങൾക്ക് ഉപയോഗിക്കുന്ന ശരീരഭാഗങ്ങളെയാണ് പൗലോസ് ഉദ്ദേശിക്കുന്നത്; ‘അവയവങ്ങൾ’ ആ ആശയം സംക്ഷിപ്തമായും മാന്യമായും നൽകുന്നു.
- source_word: ὅπλα
  choice: ആയുധങ്ങൾ
  rationale: യുദ്ധസംബന്ധമായ ദൃശ്യരൂപം നിലനിർത്തുന്നു; കൂടുതൽ പൊതുവായ ‘ഉപകരണങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀδικίας
  choice: അനീതി
  rationale: δικαιοσύνηയോടുള്ള നേർവിരുദ്ധത നിലനിർത്തുകയും ധാർമിക തെറ്റിനെയും നീതിരാഹിത്യത്തെയും ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: ἁμαρτίᾳ
  choice: പാപം
  rationale: ഗ്രീക്കിലെ ലളിതമായ നാമരൂപം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വ്യക്തിവൽക്കരണസാധ്യത വിശദീകരിച്ച് തീർക്കുന്നില്ല.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: മരിച്ചവരിൽനിന്ന് ജീവനുള്ളവരെന്നപോലെ
  rationale: ὡσεὶ എന്ന താരതമ്യഭാവവും മരണത്തിൽനിന്നുള്ള ജീവന്റെ ഉയിർപ്പുസംബന്ധമായ പ്രതിധ്വനിയും അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: പൗലോസിന്റെ ധാർമിക-ദൈവശാസ്ത്രപരമായ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളപദമാണിത്; ‘ന്യായം’ എന്ന നിയമ-സാമൂഹിക ഊന്നലുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പാപവും ദൈവവും എതിരാളികളായ യജമാനന്മാരായി പ്രത്യക്ഷപ്പെടുന്ന വൈരുധ്യം
  choice: ‘പാപത്തിനു’, ‘ദൈവത്തിനു’ എന്നീ നേരിട്ടുള്ള ദാതൃവിഭക്തി ബന്ധങ്ങൾ നിലനിർത്തി.
  alternative: ‘പാപത്തിന്റെ സേവനത്തിനായി’, ‘ദൈവത്തിന്റെ സേവനത്തിനായി’ എന്നു വിപുലീകരിക്കുക.
  rationale: അധികാരവും വിധേയത്വവും എന്ന ആശയം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും, ഗ്രീക്കിൽ ഇല്ലാത്ത ‘സേവനം’ എന്ന വ്യാഖ്യാനപദം മുഖ്യവാചകത്തിൽ ചേർക്കാതിരിക്കാൻ നേരിട്ടുള്ള രൂപം സ്വീകരിച്ചു.
- issue: ὡσεὶ ἐκ νεκρῶν ζῶντας എന്നതിന്റെ ഉയിർപ്പുസംബന്ധമായ സൂചന
  choice: ‘മരിച്ചവരിൽനിന്ന് ജീവനുള്ളവരെന്നപോലെ’ എന്ന താരതമ്യരൂപം നിലനിർത്തി.
  alternative: ‘മരിച്ചവരിൽനിന്ന് ജീവിപ്പിക്കപ്പെട്ടവരായി’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: മാറ്റുവിവർത്തനം ദൈവിക കർമ്മത്തെ വ്യക്തമായി ചേർക്കുന്നു; ഗ്രീക്കിലെ താരതമ്യവും വ്യാകരണപരമായ തുറന്ന നിലയും മുഖ്യവാചകം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. കല്പനയുടെ ഗൗരവം നിലനിർത്താൻ ‘സമർപ്പിക്കുവിൻ’ ഉപയോഗിച്ചു; ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും സൂക്ഷിച്ചു. ഇംഗ്ലീഷ് consultation layer-ലുള്ള അടിക്കുറിപ്പ് [b] തെറ്റായ സ്ഥാനത്ത് പ്രത്യക്ഷപ്പെട്ടതിനാൽ, അതിന്റെ ഉള്ളടക്കമനുസരിച്ച് δικαιοσύνης-നോടു ചേർത്തു.
