id: ROM.6.22
reference: Romans 6:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, പാപത്തിൽനിന്ന് സ്വതന്ത്രരാക്കപ്പെടുകയും ദൈവത്തിന് അടിമകളാക്കപ്പെടുകയും ചെയ്തിരിക്കുന്ന നിങ്ങൾക്കു ഫലമുണ്ട്; അത് വിശുദ്ധീകരണത്തിലേക്കു നയിക്കുന്നു[a]; അവസാനം[b], നിത്യജീവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വിശുദ്ധിയിലേക്കു നയിക്കുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അന്തിമഫലം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻ അവസ്ഥയോടുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: പാപത്തിൽനിന്നു സ്വതന്ത്രരാക്കപ്പെടുകയും
  rationale: പൂർത്തിയായതും വിശ്വാസികൾ ഏറ്റുവാങ്ങിയതുമായ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന aorist passive participle-ന്റെ ബലം നിലനിർത്തുന്നു; ഏകവചനമായ ‘പാപം’ ഒരു അധീനശക്തിയെയോ മേഖലയെയോ സൂചിപ്പിക്കാവുന്നതുപോലെ സംരക്ഷിക്കുന്നു.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: ദൈവത്തിന് അടിമകളാക്കപ്പെടുകയും
  rationale: δουλόω എന്നതിലെ ശക്തമായ അടിമത്ത-രൂപകം മയപ്പെടുത്താതെ, passive ഭാവവും ദൈവത്തോടുള്ള ബന്ധവും നിലനിർത്തുന്നു.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: നിങ്ങൾക്കുള്ള ഫലം
  rationale: καρπός എന്ന കാർഷികരൂപകം ‘പ്രയോജനം’ എന്നു പരാവർത്തനം ചെയ്യാതെ സൂക്ഷിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഉടമസ്ഥപ്രയോഗത്തിലൂടെ ἔχετε എന്ന ആശയം നൽകുന്നു.
- source_word: εἰς ἁγιασμόν
  choice: വിശുദ്ധീകരണത്തിലേക്കുള്ളതാണ്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയെയോ ഫലത്തിലേക്കുള്ള നീക്കത്തെയോ നിലനിർത്തുകയും ἁγιασμός എന്നതിന്റെ പ്രക്രിയ/ഫലം എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: τὸ δὲ τέλος
  choice: അതിന്റെ അന്ത്യം
  rationale: τέλος എന്നതിന്റെ ‘അന്ത്യം’/‘അന്തിമഫലം’ എന്നീ അർഥസാധ്യതകളിൽ മൂലപദത്തോട് അടുത്ത രൂപം മുഖ്യവാചകത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: സ്ഥിരവും കൃത്യവുമായ ദൈവശാസ്ത്രപര പ്രയോഗം; appositional ബന്ധത്തിൽ τέλος എന്താണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തോടുള്ള ബന്ധത്തിലെ അടിമത്ത-രൂപകം
  choice: ‘ദൈവത്തിന് അടിമകളാക്കപ്പെടുകയും’ എന്ന ശക്തമായ രൂപകം നിലനിർത്തി.
  alternative: ദൈവത്തെ സേവിക്കുന്നവരാക്കപ്പെടുകയും / ദൈവത്തിന് സമർപ്പിക്കപ്പെടുകയും
  rationale: റോമർ 6-ൽ പാപത്തിനുള്ള മുൻ അടിമത്തവും ദൈവത്തിനുള്ള പുതിയ അടിമത്തവും ഉദ്ദേശപൂർവം വൈരുധ്യപ്പെടുത്തുന്നു; മൃദുവായ ഭാഷ പൗലോസിന്റെ വാദത്തിന്റെ ബലം കുറയ്ക്കും.
- issue: ἁγιασμός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മുഖ്യവാചകത്തിൽ ‘വിശുദ്ധീകരണം’ ഉപയോഗിച്ചു.
  alternative: വിശുദ്ധി
  rationale: ഈ സന്ദർഭത്തിലെ പ്രക്രിയയും ഫലവും ഉൾക്കൊള്ളുന്ന സൂക്ഷ്മത ‘വിശുദ്ധീകരണം’ കൂടുതൽ നന്നായി സംരക്ഷിക്കുന്നു; ‘വിശുദ്ധി’ എന്ന സാധുവായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: τέλος എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ ‘അന്ത്യം’ ഉപയോഗിച്ചു.
  alternative: അന്തിമഫലം
  rationale: പദത്തിന്റെ ഔപചാരിക സാമ്യം നിലനിർത്തുമ്പോഴും, സന്ദർഭത്തിൽ ഫലപരിണാമം ഉദ്ദേശിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. പൗലോസിന്റെ അടിമത്ത-രൂപകം മയപ്പെടുത്തിയിട്ടില്ല; participial ഘടന മലയാളത്തിൽ വായനാസൗകര്യത്തോടെ ഏകോപിപ്പിച്ചിരിക്കുന്നു.
