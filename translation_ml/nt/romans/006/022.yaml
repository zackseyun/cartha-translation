  to: എന്നാൽ ഇപ്പോൾ, പാപത്തിൽനിന്ന് സ്വതന്ത്രരാക്കപ്പെടുകയും ദൈവത്തിന് അടിമകളാക്കപ്പെടുകയും ചെയ്തിരിക്കുന്ന നിങ്ങൾക്കു ഫലമുണ്ട്; അത് വിശുദ്ധീകരണത്തിലേക്കു നയിക്കുന്നു[a]; അവസാനം[b], നിത്യജീവൻ.
  rationale: The revision explicitly renders ἔχετε with ‘നിങ്ങൾക്കു ഫലമുണ്ട്,’ expresses εἰς ἁγιασμόν naturally as movement/result (‘വിശുദ്ധീകരണത്തിലേക്കു നയിക്കുന്നു’), and removes the unsupported possessive in ‘അതിന്റെ അന്ത്യം.’ The two coordinated outcomes are retained, with ‘നിത്യജീവൻ’ appositional to ‘അവസാനം.’ Footnote anchors are retained and placed on the corresponding lexical renderings.
