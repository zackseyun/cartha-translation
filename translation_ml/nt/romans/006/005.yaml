  to: അവന്റെ മരണത്തിന്റെ സാദൃശ്യത്തിൽ നാം അവനോടു ചേർന്നവരായിത്തീർന്നിട്ടുണ്ടെങ്കിൽ[a], അവന്റെ പുനരുത്ഥാനത്തിന്റെ സാദൃശ്യത്തിലും നാം തീർച്ചയായും അവനോടു ചേർന്നവരായിരിക്കും[b].
  rationale: മുഖ്യപാഠം മാറ്റേണ്ട ആവശ്യമില്ല. ἀλλὰ καὶ-യുടെ ബന്ധകവും കൂട്ടിച്ചേർക്കുന്ന ഊന്നലും അടിക്കുറിപ്പിൽ ഉൾപ്പെടുത്തി ഗ്രീക്ക്-വിശദീകരണം കൃത്യമാക്കി.
