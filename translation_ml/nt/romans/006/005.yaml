    issue: അടിക്കുറിപ്പ് b-യിലെ പദാനുപദ ഗ്രീക്ക്-സംഗ്രഹം ἀλλὰ καὶ-യെ വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നില്ല.
