id: ROM.6.5
reference: Romans 6:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ml
  text: അവന്റെ മരണത്തിന്റെ സാദൃശ്യത്തിൽ നാം അവനോടു ചേർന്നവരായിത്തീർന്നിട്ടുണ്ടെങ്കിൽ[a], അവന്റെ പുനരുത്ഥാനത്തിന്റെ സാദൃശ്യത്തിലും നാം തീർച്ചയായും അവനോടു ചേർന്നവരായിരിക്കും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവനോടൊപ്പം ഒന്നിച്ചുവളർന്നവരായിത്തീർന്നിട്ടുണ്ടെങ്കിൽ.’
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ: ‘എന്നാൽ പുനരുത്ഥാനത്തിന്റേതും നാം ആയിരിക്കും’; ആദ്യ ഉപവാക്യത്തിലെ ‘അവനോടു ചേർന്നവർ’ എന്നും ‘സാദൃശ്യത്തിൽ’ എന്നും ഇവിടെ അധ്യാഹരിച്ചിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: അവനോടു ചേർന്നവർ
  rationale: ഈ പദം ജൈവമായി ഒന്നിച്ചുവളരുക എന്ന ചിത്രവും പങ്കാളിത്തപരമായ ഐക്യവും സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ‘അവനോടു ചേർന്നവർ’ ബന്ധപരമായ അർഥം വ്യക്തമായി നൽകുന്നു; പദത്തിന്റെ ചിത്രാത്മകമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: γεγόναμεν
  choice: ആയിത്തീർന്നിട്ടുണ്ട്
  rationale: ഭൂതകാലത്തിൽ സംഭവിച്ച് ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഭാവം ഈ പ്രയോഗം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῷ ὁμοιώματι
  choice: സാദൃശ്യത്തിൽ
  rationale: ദത്തിവ് ഇവിടെ ബന്ധമോ മേഖലയോ സൂചിപ്പിക്കുന്നു. ‘സാദൃശ്യത്തിൽ’ എന്നത് വ്യാഖ്യാനം അധികമായി ചേർക്കാതെ പൗലോസിന്റെ യോഗ്യതപ്പെടുത്തുന്ന ഭാഷ നിലനിർത്തുന്നു.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: അവന്റെ മരണത്തിന്റെ
  rationale: നേരിട്ടുള്ള ഷഷ്ഠീവിഭക്തി ബന്ധം; വിശദീകരണപരമായ വിപുലീകരണം ആവശ്യമില്ല.
- source_word: ἀλλὰ καὶ
  choice: തീർച്ചയായും ... ഉം
  rationale: ആദ്യ ഉപവാക്യത്തിൽനിന്ന് രണ്ടാമത്തേതിലേക്കുള്ള ശക്തമായ പുരോഗമന ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς ἀναστάσεως
  choice: അവന്റെ പുനരുത്ഥാനത്തിന്റെ സാദൃശ്യത്തിലും
  rationale: ഗ്രീക്കിൽ ‘അവന്റെ’ എന്നും ‘സാദൃശ്യത്തിൽ’ എന്നും ആവർത്തിക്കുന്നില്ലെങ്കിലും മുൻ ഉപവാക്യത്തിലെ സമാന്തരഘടനയിൽനിന്ന് അവ മനസ്സിലാക്കപ്പെടുന്നു. വ്യക്തതയ്ക്കായി അവ പാഠത്തിൽ പൂരിപ്പിച്ചിരിക്കുന്നു; ഗ്രീക്കിലെ സംക്ഷിപ്തരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐσόμεθα
  choice: നാം ... അവനോടു ചേർന്നവരായിരിക്കും
  rationale: ഗ്രീക്കിൽ ക്രിയ വെറും ‘നാം ആയിരിക്കും’ എന്നാണ്; മുൻ ഉപവാക്യത്തിലെ σύμφυτοι എന്ന വിധേയപദം ഇവിടെ അധ്യാഹരിക്കപ്പെടുന്നു. മലയാളത്തിൽ പൂർണമായ അർഥത്തിനായി അത് ആവർത്തിച്ചു.
theological_decisions:
- issue: ക്രിസ്തുവുമായുള്ള ഐക്യത്തെ സാക്രമെന്റൽ, മിസ്റ്റിക്കൽ, അല്ലെങ്കിൽ കേവലം രൂപകാലങ്കാരപരമായ അർഥത്തിൽ നിർണയിക്കണമോ എന്നത്
  choice: ‘അവനോടു ചേർന്നവർ’ എന്നും ‘സാദൃശ്യത്തിൽ’ എന്നും നിലനിർത്തി യഥാർഥ പങ്കാളിത്തവും യോഗ്യതപ്പെടുത്തുന്ന ഭാഷയും ഒരുമിച്ച് സംരക്ഷിച്ചു.
  alternative: ‘അവന്റെ മരണത്തിന്റെയും പുനരുത്ഥാനത്തിന്റെയും മാതൃകയോടു ചേർന്നവർ’ അല്ലെങ്കിൽ ‘അവനോടൊപ്പം ഒന്നിച്ചുവളർന്നവർ’
  rationale: വാക്യം ക്രിസ്തുവിലുള്ള യഥാർഥ പങ്കാളിത്തത്തെ സൂചിപ്പിക്കുമ്പോഴും ‘സാദൃശ്യം’ എന്ന പദം ഉപയോഗിക്കുന്നു. ആ പങ്കാളിത്തം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന് ഒരു പ്രത്യേക സിദ്ധാന്തത്തിന്റെ അടിസ്ഥാനത്തിൽ നിർവചിക്കാതെ ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സാദൃശ്യം,’ ‘പുനരുത്ഥാനം’ എന്നീ സ്ഥാപിത ബൈബിൾ-ദൈവശാസ്ത്ര പദങ്ങൾ കൃത്യതയ്ക്കായി നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിന് അനുസരിച്ച് ക്രമപ്പെടുത്തി.
