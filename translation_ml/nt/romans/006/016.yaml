  to: നിങ്ങളെത്തന്നെ അനുസരണത്തിനായി ആരുടെ അടിമകളായി സമർപ്പിക്കുന്നുവോ, നിങ്ങൾ അനുസരിക്കുന്നവന്റെ അടിമകളാണ് എന്ന് അറിയുന്നില്ലയോ? ഒന്നുകിൽ മരണത്തിലേക്കു നയിക്കുന്ന പാപത്തിന്റെ അടിമകളാണ്, അല്ലെങ്കിൽ നീതിയിലേക്കു നയിക്കുന്ന അനുസരണത്തിന്റെ അടിമകളാണ്.[a]
  rationale: The revision retains the Greek question, the repeated slave terminology, and the parallel outcomes of sin and obedience. It replaces an obligation-tinged verbal phrase with the source’s abstract noun, improves the Malayalam relative syntax, and supplies the repeated predicate needed for idiomatic Malayalam without altering the meaning.
