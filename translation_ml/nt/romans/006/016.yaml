id: ROM.6.16
reference: Romans 6:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: ml
  text: നിങ്ങളെത്തന്നെ അനുസരണത്തിനായി ആരുടെ അടിമകളായി സമർപ്പിക്കുന്നുവോ, നിങ്ങൾ അനുസരിക്കുന്നവന്റെ അടിമകളാണ് എന്ന് അറിയുന്നില്ലയോ? ഒന്നുകിൽ മരണത്തിലേക്കു നയിക്കുന്ന പാപത്തിന്റെ അടിമകളാണ്, അല്ലെങ്കിൽ നീതിയിലേക്കു നയിക്കുന്ന അനുസരണത്തിന്റെ അടിമകളാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: നീതിനിഷ്ഠയിലേക്കു നയിക്കുന്ന.'
    reason: δικαιοσύνη എന്ന പദത്തിന്റെ ധാർമിക അർത്ഥഭാവം വ്യക്തമാക്കുന്ന സാധുവായ ഭാഷാന്തരവികൽപം.
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ ... സമർപ്പിക്കുന്നുവോ
  rationale: സ്വയം മറ്റൊരാളുടെ അധികാരത്തിനും ഉപയോഗത്തിനും വിട്ടുകൊടുക്കുക എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δούλους / δοῦλοί
  choice: അടിമകളായി / അടിമകളാണ്
  rationale: പൗലോസിന്റെ ഉപമയിൽ ഉടമസ്ഥതയ്ക്കും അധീനതയ്ക്കും ഉള്ള ശക്തമായ അർത്ഥം നിർണായകമായതിനാൽ മൃദുവായ ‘ദാസർ’ എന്നതിനെക്കാൾ ‘അടിമകൾ’ യോജിക്കുന്നു.
- source_word: εἰς ὑπακοήν
  choice: അനുസരിക്കേണ്ടതിനായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യഭാവം വ്യക്തമായി നൽകുന്നു; മലയാളത്തിൽ അമിത നാമവൽക്കരണം ഒഴിവാക്കുന്നു.
- source_word: ᾧ ὑπακούετε
  choice: നിങ്ങൾ അനുസരിക്കുന്ന ആ ആളുടെ
  rationale: സന്ദർഭത്തിലെ വ്യക്തിപരമായ യജമാനബന്ധം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘യജമാനൻ’ എന്ന പദം ചേർക്കുന്നില്ല.
- source_word: ἁμαρτίας
  choice: പാപത്തിന്റെ
  rationale: പാപത്തെ വ്യക്തിവൽക്കരിക്കുന്ന അടിമത്ത-രൂപകം വാക്യഘടനയിലൂടെ പ്രകടമാകാൻ അനുവദിച്ച് നേരിട്ടുള്ള പദം നിലനിർത്തുന്നു.
- source_word: εἰς θάνατον
  choice: മരണത്തിലേക്കു നയിക്കുന്ന
  rationale: εἰς എന്നതിന്റെ ദിശാപരവും ഫലസൂചകവുമായ ശക്തി വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: ὑπακοῆς
  choice: അനുസരണത്തിന്റെ
  rationale: പാപത്തോടു സമാന്തരമായ അമൂർത്ത നാമം നിലനിർത്തി ഗ്രീക്കിലെ വിരുദ്ധഘടന സംരക്ഷിക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമികവും ബന്ധപരവുമായ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘നീതീകരണം’ എന്ന പ്രത്യേക സിദ്ധാന്താർഥം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ വിരുദ്ധഘടനയിൽ δικαιοσύνηയുടെ വിവർത്തനം
  choice: നീതി
  alternative: നീതിനിഷ്ഠ / ദൈവമുമ്പാകെയുള്ള ശരിയായ നില
  rationale: ഇവിടെ പാപം–മരണം എന്ന ബന്ധത്തിന് എതിർവശത്ത് അനുസരണം–നീതി എന്ന ബന്ധമാണ്. ‘നീതി’ പദത്തിന്റെ ധാർമികവും ദൈവബന്ധപരവുമായ തുറന്ന അർത്ഥം നിലനിർത്തുന്നു; ഒരൊറ്റ സിദ്ധാന്തവ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ചോദ്യം, അടിമത്തത്തിന്റെ ശക്തമായ രൂപകം, പാപം/അനുസരണം എന്നീ വ്യക്തിവൽക്കരിച്ച വിരുദ്ധങ്ങൾ എന്നിവ സംരക്ഷിച്ചു.
