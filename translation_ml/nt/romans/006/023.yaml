id: ROM.6.23
reference: Romans 6:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: ml
  text: എന്തെന്നാൽ, പാപത്തിന്റെ കൂലി മരണം; എന്നാൽ ദൈവത്തിന്റെ കൃപാദാനം[a] നമ്മുടെ കർത്താവായ മിശിഹാ യേശുവിലുള്ള നിത്യജീവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദാനം.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: കൂലി
  rationale: അർഹിച്ചതിനോ ചെയ്ത ജോലിക്കോ ലഭിക്കുന്ന പ്രതിഫലം എന്ന രൂപകം നിലനിർത്തുന്നു; തുടർന്നുള്ള സൗജന്യമായ ദാനത്തോടുള്ള പൗലോസിന്റെ വൈരുധ്യവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തി, പാപത്തിന്റേതായതോ പാപം നൽകുന്നതോ ആയ കൂലി എന്ന ആശയം തുറന്നുവെക്കുന്നു.
- source_word: θάνατος
  choice: മരണം
  rationale: മരണത്തിന്റെ സ്വഭാവത്തെ വിവർത്തനത്തിൽ കൂടുതൽ നിർവചിക്കാതെ ഗ്രീക്കിലെ ലളിതവും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ പദം നേരിട്ട് നൽകുന്നു.
- source_word: χάρισμα
  choice: കൃപാദാനം
  rationale: പ്രതിഫലമായി സമ്പാദിച്ചതല്ലാത്ത, കൃപയിൽനിന്നുള്ള ദാനം എന്ന പദത്തിന്റെ ഭാവം പ്രകടമാക്കുകയും ‘കൂലി’യോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ζωὴ αἰώνιος
  choice: നിത്യജീവൻ
  rationale: കാലദൈർഘ്യവും പുതിയനിയമത്തിലെ ദൈവശാസ്ത്രപരമായ പ്രാധാന്യവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്ന സ്ഥിരപ്രയോഗമാണ്.
- source_word: ἐν
  choice: ഉള്ളിൽ / -ൽ
  rationale: ‘യേശുവിലുള്ള’ എന്ന രൂപം ഉപാധി മാത്രമെന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ, ക്രിസ്തുവിലുള്ള സ്ഥിതിയെയോ ഐക്യത്തെയോ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Χριστῷ
  choice: മശീഹാ
  rationale: Χριστός ഇവിടെ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹാ’ എന്നു നൽകി അഭിഷിക്തൻ എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവ്
  rationale: ആദ്യകാല ക്രൈസ്തവ വിശ്വാസപ്രഖ്യാപനത്തിലെ ഭാരവും സാധാരണ മലയാള ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: ‘മശീഹാ യേശുവിലുള്ള’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘മശീഹാ യേശുവിലൂടെ’ അല്ലെങ്കിൽ ‘മശീഹാ യേശുവിനാൽ’.
  rationale: ഗ്രീക്ക് പ്രയോഗം ഉപാധിയോ കാരണമോ മാത്രം സൂചിപ്പിക്കുന്നതിലുപരി സ്ഥിതിയെയോ ഐക്യത്തെയോ സൂചിപ്പിക്കാം. ‘ഉള്ള’ എന്ന രൂപം ഈ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: χάρισμα എന്നതിലെ കൃപാഭാവം
  choice: പ്രധാനപാഠത്തിൽ ‘കൃപാദാനം’ എന്നു നൽകി.
  alternative: ‘ദാനം’.
  rationale: സാധാരണ ദാനം എന്നതിനേക്കാൾ χάρισμα കൃപയിൽനിന്നുള്ള, സമ്പാദിക്കാത്ത വരത്തെ ഊന്നുന്നു. ഇത് പാപത്തിന്റെ ‘കൂലി’യോടുള്ള വൈരുധ്യവും വ്യക്തമാക്കുന്നു; അതേസമയം ലളിതമായ പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന സ്വീകരിച്ചു. γάρ എന്ന ബന്ധകം ‘എന്തെന്നാൽ’ എന്നു നിലനിർത്തി. ‘കൂലി—കൃപാദാനം’ എന്ന സമ്പാദിച്ചതും സൗജന്യമായി ലഭിച്ചതും തമ്മിലുള്ള മുഖ്യവൈരുധ്യം വ്യക്തമായി സൂക്ഷിച്ചു.
