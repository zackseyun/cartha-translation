id: ROM.6.20
reference: Romans 6:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ പാപത്തിന്റെ അടിമകളായിരുന്നപ്പോൾ നീതിയെ സംബന്ധിച്ചിടത്തോളം സ്വതന്ത്രരായിരുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിയോടുള്ള ബന്ധത്തിൽ.”
    reason: lexical_alternative
  - marker: b
    text: “നീതി” എന്നതിന് “ന്യായം” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: അടിമകൾ
  rationale: റോമർ 6-ലെ പരസ്പരവിരുദ്ധമായ രണ്ട് അടിമത്തങ്ങളുടെ ശക്തമായ രൂപകം നിലനിർത്തുന്നു; ‘ദാസന്മാർ’ എന്നതിനെക്കാൾ ബന്ധിതാവസ്ഥ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപത്തിന്റെ
  rationale: ജനിറ്റീവ് രൂപം പാപത്തിന്റെ ഉടമസ്ഥതയെയോ അധീനമേഖലയെയോ സൂചിപ്പിക്കുന്നവിധം സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐλεύθεροι
  choice: സ്വതന്ത്രർ
  rationale: പാപത്തിന് അടിമകളായിരുന്നവർ നീതിയോടുള്ള ബന്ധത്തിൽ ‘സ്വതന്ത്രർ’ ആയിരുന്നു എന്ന പൗലോസിന്റെ മൂർച്ചയുള്ള വിരോധാഭാസം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: τῇ δικαιοσύνῃ
  choice: നീതിയെ സംബന്ധിച്ചിടത്തോളം
  rationale: ദത്തിവ് രൂപത്തെ ബന്ധം/പരിഗണന സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുന്നു; നീതി ഒരു പീഡകനായിരുന്നുവെന്ന ധ്വനി ഒഴിവാക്കിക്കൊണ്ട് ഗ്രീക്കിലെ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതി
  rationale: δικαιοσύνη എന്ന പൗലോസിന്റെ പദത്തിന് മലയാളത്തിൽ സ്വാഭാവികവും വിശാലവുമായ തത്തുല്യം; ഇവിടെ നീതിയായ നിലയും നീതിയുക്തതയും ഉൾക്കൊള്ളാം.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പാപത്തിന് അടിമകളായിരുന്നവരുടെ നീതിയോടുള്ള ബന്ധം എങ്ങനെ പ്രകടിപ്പിക്കണം
  choice: നീതിയെ സംബന്ധിച്ചിടത്തോളം സ്വതന്ത്രരായിരുന്നു
  alternative: നീതിയിൽനിന്ന് സ്വതന്ത്രരായിരുന്നു
  rationale: നീതിയെ പ്രതികൂലമായി ബന്ധിക്കുന്ന ഒരു ശക്തിയായി ചിത്രീകരിക്കാതെ, ഗ്രീക്കിലെ ബന്ധസൂചക ദത്തിവും പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടിമകൾ’ എന്ന ശക്തമായ രൂപകം മൃദൂകരിക്കാതെ നിലനിർത്തി; ‘നീതിയെ സംബന്ധിച്ചിടത്തോളം’ എന്ന പ്രയോഗം മൂലഭാഷയിലെ ദത്തിവിന്റെ യഥാർഥമായ അവ്യക്തതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
