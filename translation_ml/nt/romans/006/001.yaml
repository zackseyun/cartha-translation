id: ROM.6.1
reference: Romans 6:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: ml
  text: അപ്പോൾ നാം എന്തു പറയണം? കൃപ വർധിക്കേണ്ടതിന് നാം പാപത്തിൽ തുടരണമോ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം പാപത്തിൽ ഉറച്ചുനിൽക്കണമോ ...?”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “കൃപ പെരുകേണ്ടതിന്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: അപ്പോൾ
  rationale: പൗലൊസിന്റെ മുൻവാദത്തിൽനിന്നുള്ള നിഗമനാത്മകമായ മാറ്റവും ചോദ്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കും വ്യക്തമാക്കുന്നു.
- source_word: ἐροῦμεν
  choice: നാം എന്തു പറയണം
  rationale: ഭാവികാലരൂപത്തിലുള്ള ആലോചനാത്മക ചോദ്യത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐπιμένωμεν
  choice: നാം ... തുടരണമോ
  rationale: വർത്തമാനകാല ഉപവാക്യരൂപം സൂചിപ്പിക്കുന്ന തുടർച്ചയായ പ്രവൃത്തിയെയും ആലോചനാത്മക-ധാർമിക ചോദ്യഭാവത്തെയും നിലനിർത്തുന്നു.
- source_word: τῇ ἁμαρτίᾳ
  choice: പാപത്തിൽ
  rationale: പാപത്തിന്റെ മേഖലയിലോ ആചരണത്തിലോ തുടരുക എന്ന ദത്തിവ്യാകരണബന്ധം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἵνα
  choice: -േണ്ടതിന്
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യത്തെയോ നിർദ്ദേശിക്കപ്പെടുന്ന ഫലത്തെയോ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: ഇവിടെ ദൈവത്തിന്റെ കൃപാപൂർണമായ അനുഗ്രഹത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ മലയാള പദം.
- source_word: πλεονάσῃ
  choice: വർധിക്കേണ്ടതിന്
  rationale: അളവിലോ വ്യാപ്തിയിലോ കൂടുക എന്ന ക്രിയയുടെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; കൂടുതൽ സമൃദ്ധമാകുക എന്ന ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ ചോദ്യത്തെ അനുമതിയായോ ബാധ്യതയായോ വെറും പ്രവചനമായോ അവതരിപ്പിക്കണമോ
  choice: തുടരണമോ എന്ന ആലോചനാത്മക ധാർമിക ചോദ്യം
  alternative: തുടരുമോ / തുടരുകയാണോ വേണ്ടത്
  rationale: ഗ്രീക്ക് ഉപവാക്യരൂപം നിർദ്ദേശിക്കപ്പെട്ട പെരുമാറ്റത്തെക്കുറിച്ചുള്ള വാഗ്വൈഭവമുള്ള ചോദ്യം ഉന്നയിക്കുന്നു. ‘തുടരണമോ’ അതിന്റെ ധാർമികബലം വ്യക്തമാക്കുന്നു; അടുത്ത വാക്യത്തിലെ മറുപടി മുൻകൂട്ടി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാഗ്വൈഭവചോദ്യം. ‘കൃപ’, ‘പാപം’ എന്നീ പരിചിത ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തി; ഗ്രീക്കിലെ ഉദ്ദേശ്യ/ഫലസാദ്ധ്യതയിലെ സംഘർഷം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിച്ചു.
