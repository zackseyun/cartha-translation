id: ROM.6.2
reference: Romans 6:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: ml
  text: ഒരിക്കലുമില്ല![a] പാപത്തിനു മരിച്ചവരായ നാം ഇനിയും അതിൽ ജീവിക്കുന്നതെങ്ങനെ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘അങ്ങനെ ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ!’; അതിശക്തമായ നിരാകരണപ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമില്ല!
  rationale: പൗലോസ് ഉപയോഗിക്കുന്ന ശക്തമായ നിരാകരണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും ഊന്നലോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: οἵτινες
  choice: മരിച്ചവരായ നാം
  rationale: വിശ്വാസികളെക്കുറിച്ചുള്ള പൗലോസിന്റെ ഉൾക്കൊള്ളുന്ന ഒന്നാംപുരുഷ ബഹുവചനരീതി നിലനിർത്തുന്നു.
- source_word: ἀπεθάνομεν
  choice: മരിച്ചവരായ
  rationale: നിർണായകമായ ഒരു സംഭവത്തെ സൂചിപ്പിക്കുന്ന ഭൂതകാലരൂപം നിലനിർത്തുന്നു; രൂപകത്തെ വിശദീകരിച്ചു ചുരുക്കുന്നില്ല.
- source_word: τῇ ἁμαρτίᾳ
  choice: പാപത്തിനു
  rationale: പാപത്തോടുള്ള ബന്ധത്തെ സൂചിപ്പിക്കുന്ന ദത്തിവ് മലയാളത്തിലെ ‘പാപത്തിനു മരിക്കുക’ എന്ന സംക്ഷിപ്തവും അർത്ഥസമ്പന്നവുമായ പ്രയോഗത്തിലൂടെ നൽകുന്നു.
- source_word: πῶς ἔτι
  choice: ഇനിയും ... എങ്ങനെ?
  rationale: തുടർന്നും അങ്ങനെ ജീവിക്കുന്നതിനെക്കുറിച്ചുള്ള അവിശ്വാസവും ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ζήσομεν
  choice: ജീവിക്കുന്നതെങ്ങനെ
  rationale: ഭാവികാലരൂപത്തിന്റെ ആലങ്കാരിക പ്രയോഗം സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν αὐτῇ
  choice: അതിൽ
  rationale: സർവനാമം പാപത്തെ ഒരു മേഖല അഥവാ ആധിപത്യവലയംപോലെ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ പ്രസ്താവന ധാർമിക പുരോഗതിയെയാണോ പാപത്തിന്റെ ആധിപത്യവുമായുള്ള നിർണായക വിച്ഛേദത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘പാപത്തിനു മരിച്ചവരായ’ എന്ന രൂപകം വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: ‘പാപത്തിൽനിന്ന് പിന്തിരിഞ്ഞവരായ’ അല്ലെങ്കിൽ ‘പാപത്തോട് പ്രതികരിക്കാത്തവരായ’ എന്ന് വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാഠം രൂപകത്തെ നേരിട്ട് പ്രസ്താവിക്കുന്നു. അതിനെ വിശദീകരിച്ച് ഒരു പ്രത്യേക വിശുദ്ധീകരണസിദ്ധാന്തത്തിലേക്ക് ചുരുക്കാതെ അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരിക്കലുമില്ല’ ശക്തമായ നിരാകരണം നൽകുന്നു; ‘പാപത്തിനു മരിക്കുക’, ‘അതിൽ ജീവിക്കുക’ എന്നീ പൗലോസിന്റെ രൂപകങ്ങൾ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു.
