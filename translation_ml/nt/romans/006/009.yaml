id: ROM.6.9
reference: Romans 6:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: ml
  text: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ട മശീഹ[a] ഇനി മരിക്കുകയില്ലെന്നും, മരണം ഇനി അവന്റെമേൽ ആധിപത്യം ചെലുത്തുകയില്ലെന്നും നാം അറിയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: നാം അറിയുന്നു
  rationale: ഗ്രീക്ക് കൃതന്തം ചുറ്റുമുള്ള വാദത്തിന് അടിസ്ഥാനമായ പങ്കിട്ട അറിവിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ സമാപികക്രിയ ഉപയോഗിച്ച് അർത്ഥബന്ധം നിലനിർത്തുന്നു; ‘കാരണം’ എന്ന ബന്ധം അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός അർത്ഥവത്തായ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു. ‘മശീഹ’ അതിന്റെ യഹൂദ-മെസ്സിയാനിക അർത്ഥം നിലനിർത്തുന്നു.
- source_word: ἐγερθεὶς
  choice: ഉയിർപ്പിക്കപ്പെട്ട
  rationale: അയോറിസ്റ്റ് കർമണി കൃതന്തത്തിന്റെ കർമണിപ്രയോഗവും തുടർന്നുള്ള ‘മരിക്കുകയില്ല’ എന്നതിനുമുമ്പുള്ള പൂർത്തിയായ സംഭവവും സംരക്ഷിക്കുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള ഉയിർപ്പിനെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി … ഇല്ല / ഇനി … ഇല്ല
  rationale: രണ്ടിടത്തും ആവർത്തിക്കുന്ന οὐκέτιയുടെ അന്തിമത്വവും വാക്യത്തിലെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: ἀποθνῄσκει
  choice: മരിക്കുകയില്ല
  rationale: മശീഹ ഇനി മരണത്തിന് വിധേയനല്ലെന്ന തുടരുന്ന യാഥാർഥ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: θάνατος
  choice: മരണം
  rationale: നാമം നേരിട്ട് പരിഭാഷപ്പെടുത്തി, അടുത്ത ക്രിയയുടെ കർത്താവായുള്ള പൗലോസിന്റെ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു.
- source_word: κυριεύει
  choice: വാഴുകയില്ല
  rationale: അധികാരവും ആധിപത്യവും പുലർത്തുക എന്ന ആശയം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിലെ Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദം വെറും പേരിന്റെ ഭാഗമായി മാത്രമല്ല, അഭിഷിക്തനായ വാഗ്ദത്ത രക്ഷകൻ എന്ന സ്ഥാനപ്പേരായും പ്രവർത്തിക്കുന്നു. അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർത്ഥം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് οὐκέτι പ്രയോഗങ്ങളുടെ സമാന്തരത ‘ഇനി’ എന്ന ആവർത്തനത്തിലൂടെ സൂക്ഷിച്ചു. പ്രധാനവാചകത്തിലെ അടിക്കുറിപ്പു ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം ചേർത്തിരിക്കുന്നു.
