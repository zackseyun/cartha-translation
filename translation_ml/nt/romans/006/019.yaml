  to: നിങ്ങളുടെ ജഡത്തിന്റെ ബലഹീനത നിമിത്തം ഞാൻ മനുഷ്യരുടെ സാധാരണ രീതിയിൽ സംസാരിക്കുന്നു. നിങ്ങൾ മുമ്പ് നിങ്ങളുടെ അവയവങ്ങളെ അശുദ്ധിക്കും നിയമരാഹിത്യത്തിനും അടിമകളായി, നിയമരാഹിത്യത്തിലേക്കായി സമർപ്പിച്ചതുപോലെ, ഇപ്പോൾ നിങ്ങളുടെ അവയവങ്ങളെ നീതിക്ക്[a] അടിമകളായി, വിശുദ്ധീകരണത്തിലേക്കായി സമർപ്പിക്കുവിൻ.[b]
  rationale: മൂലഗ്രീക്കിലെ ὥσπερ ... οὕτως എന്ന സമാന്തരതയും, εἰς എന്നതിന്റെ ദിശാ/ഫലബന്ധവും, ἀνομίαയുടെ ഇരട്ട ആവർത്തനവും പുനഃസ്ഥാപിച്ചു. വ്യാഖ്യാനപരമായ ‘കൂടുതൽ’ എന്നും അനാവശ്യമായ സ്വതന്ത്ര ഫലവാക്യവും നീക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവയുടെ വാചകസൂചനകളും നിലനിർത്തി.
