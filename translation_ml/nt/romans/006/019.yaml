  source_fidelity: കരടിലെ ‘അതു കൂടുതൽ അധർമ്മത്തിലേക്കു നയിക്കുകയും’ എന്ന ഭാഗം ഗ്രീക്കിലെ സമാന്തര ഘടനയെ ഒരു സ്വതന്ത്ര ഫലവാക്യമായി മാറ്റുന്നു; ‘കൂടുതൽ’ എന്ന ആശയവും മൂലപാഠത്തിൽ ഇല്ല. ἀνομίαയുടെ നിയമവിരുദ്ധത/നിയമരാഹിത്യം എന്ന ഘടകവും ‘അധർമ്മം’ എന്നതിൽ മങ്ങിയിരിക്കുന്നു.
