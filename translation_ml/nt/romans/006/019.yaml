id: ROM.6.19
reference: Romans 6:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: ml
  text: നിങ്ങളുടെ ജഡത്തിന്റെ ബലഹീനത നിമിത്തം ഞാൻ മനുഷ്യരുടെ സാധാരണ രീതിയിൽ സംസാരിക്കുന്നു. നിങ്ങൾ മുമ്പ് നിങ്ങളുടെ അവയവങ്ങളെ അശുദ്ധിക്കും നിയമരാഹിത്യത്തിനും അടിമകളായി, നിയമരാഹിത്യത്തിലേക്കായി സമർപ്പിച്ചതുപോലെ, ഇപ്പോൾ നിങ്ങളുടെ അവയവങ്ങളെ നീതിക്ക്[a] അടിമകളായി, വിശുദ്ധീകരണത്തിലേക്കായി സമർപ്പിക്കുവിൻ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ന്യായം.”
    reason: δικαιοσύνηയ്ക്ക് പൗലോസിന്റെ പ്രയോഗത്തിൽ ‘നീതി/നീതിനിഷ്ഠ’ പ്രധാന അർഥമാണെങ്കിലും ‘ന്യായം’ എന്ന ബദൽ അർഥവും സാധ്യമാണ്.
  - marker: b
    text: “വിശുദ്ധീകരണം” എന്നത് “വിശുദ്ധി” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: ἁγιασμός ഇവിടെ വിശുദ്ധിയിലേക്കുള്ള പ്രക്രിയയെയോ അതിന്റെ ഫലമായ വിശുദ്ധാവസ്ഥയെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: ഞാൻ മാനുഷികമായ രീതിയിൽ സംസാരിക്കുകയാണ്
  rationale: മനുഷ്യർക്കു ഗ്രഹിക്കാവുന്ന രീതിയിലുള്ള അവതരണമാണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ‘മനുഷ്യോപമ’ എന്നു പറഞ്ഞ് അതിനെ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
- source_word: ἀσθένειαν
  choice: ബലഹീനത
  rationale: ശാരീരികമോ ധാർമികമോ ആയ പരിമിതിയിലേക്കു മാത്രമായി അർഥം ചുരുക്കാതെ ഗ്രീക്കിന്റെ വിശാലത സൂക്ഷിക്കുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: ‘പാപസ്വഭാവം’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയേക്കാൾ ഗ്രീക്കിലെ വിശാലവും ദൈവശാസ്ത്രപരമായി സംഘർഷമുള്ളതുമായ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: παρεστήσατε / παραστήσατε
  choice: സമർപ്പിക്കുകയും / സമർപ്പിക്കുവിൻ
  rationale: ഭൂതകാല പ്രവൃത്തിയും ഇപ്പോഴത്തെ ആഹ്വാനവും തമ്മിലുള്ള ആവർത്തിത ക്രിയാബന്ധവും വിരുദ്ധതയും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ശരീരത്തിന്റെ അംഗങ്ങളെയും അവയിലൂടെ പ്രവർത്തിക്കുന്ന ശേഷികളെയും സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗത്തിന് സ്വാഭാവികമായ മലയാളസമം.
- source_word: δοῦλα
  choice: അടിമകളായി
  rationale: റോമർ 6-ലെ ഉടമസ്ഥത, അധീശത്വം, അനുസരണം എന്നീ അടിമത്തരൂപകത്തിന്റെ ശക്തി ‘ദാസർ’ എന്നതിനെക്കാൾ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀκαθαρσίᾳ
  choice: അശുദ്ധിക്ക്
  rationale: നൈതിക അശുദ്ധിയുടെ അർഥം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: അധർമ്മത്തിനും / അധർമ്മത്തിലേക്കു
  rationale: രണ്ട് സംഭവങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് ഗ്രീക്കിലെ ആവർത്തനവും അധർമ്മം കൂടുതൽ അധർമ്മത്തിലേക്കു വളരുന്ന ആശയവും നിലനിർത്തുന്നു.
- source_word: εἰς τὴν ἀνομίαν
  choice: അതു കൂടുതൽ അധർമ്മത്തിലേക്കു നയിക്കുകയും
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയോ ഫലമോ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ആവർത്തനത്തിലെ വർധനാഭാവം ‘കൂടുതൽ’ എന്നതിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: δικαιοσύνῃ
  choice: നീതിക്ക്
  rationale: നൈതികമായ ശരിതനിമയെ സൂചിപ്പിക്കുന്നതോടൊപ്പം മലയാളത്തിൽ സ്വാഭാവികവും പൗലോസിന്റെ പ്രയോഗവ്യാപ്തി സഹിക്കുന്നതുമായ പദം; ‘നീതിനിഷ്ഠ’ മറ്റൊരു സാധ്യതയാണ്.
- source_word: ἁγιασμόν
  choice: വിശുദ്ധീകരണത്തിലേക്കു
  rationale: വിശുദ്ധമായ അവസ്ഥയിലേക്കുള്ള പ്രക്രിയയെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന εἰς ἁγιασμόν എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘നിങ്ങളുടെ ജഡത്തിന്റെ ബലഹീനത’ എന്നതിലെ σάρξ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: സന്ദർഭം വീണുപോയ മനുഷ്യജീവിതത്തിലെ ദൗർബല്യം ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്ക് പദം അതിനെ ‘പാപസ്വഭാവം’ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്കു നിർബന്ധമായി ചുരുക്കുന്നില്ല.
- issue: δικαιοσύνη എന്ന പൗലോസീയ പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: നീതിനിഷ്ഠ
  rationale: ഇവിടെ അശുദ്ധിക്കും അധർമ്മത്തിനും വിരുദ്ധമായ ധാർമിക ശരിതനിമയാണ് മുൻനിരയിൽ; ‘നീതി’ ആ അർഥവും ന്യായത്തിന്റെ ധ്വനിയും തുറന്നുവെക്കുന്നു.
- issue: ἁγιασμός പ്രക്രിയയോ അവസ്ഥയോ
  choice: വിശുദ്ധീകരണം
  alternative: വിശുദ്ധി
  rationale: εἰς എന്ന ദിശാസൂചനയോടൊപ്പം വിശുദ്ധിയിലേക്കുള്ള നീക്കത്തെയോ ഫലത്തെയോ ‘വിശുദ്ധീകരണം’ കൂടുതൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; അന്തിമാവസ്ഥയായ ‘വിശുദ്ധി’യും വ്യാകരണപരമായി സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി ഉപയോഗിച്ചു. ‘അവയവങ്ങൾ,’ ‘അടിമകൾ,’ ‘ജഡം,’ ‘വിശുദ്ധീകരണം’ എന്നീ പദങ്ങൾ പൗലോസിന്റെ രൂപകവും ആവർത്തനവും ദൈവശാസ്ത്രപരമായ തുറന്നത്വവും സംരക്ഷിക്കുന്നു. മുഖ്യവാക്യത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും [a], [b] ആയി ചേർത്തിരിക്കുന്നു.
