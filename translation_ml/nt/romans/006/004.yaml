revisions:
- from: അതുകൊണ്ട്, സ്നാനത്തിലൂടെ മരണത്തിലേക്കു നാം അവനോടൊപ്പം അടക്കപ്പെട്ടു. പിതാവിന്റെ മഹത്വത്താൽ മശീഹാ[a] മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടതുപോലെ, നാമും ജീവന്റെ പുതുമയിൽ നടക്കേണ്ടതിനായിരുന്നു അത്.
