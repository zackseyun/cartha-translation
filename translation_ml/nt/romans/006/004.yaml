  revision_rationale: The revision removes the detached resumptive expression “അത്” and directly attaches the purpose of believers’ walking in newness of life to their burial with Messiah. The semicolon makes the comparison clause readable while preserving the single logical movement of the Greek sentence. No theological interpretation has been added.
