id: ROM.6.12
reference: Romans 6:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ മർത്യശരീരത്തിൽ പാപം വാഴാനും അതിന്റെ[a] മോഹങ്ങൾ നിങ്ങൾ അനുസരിക്കുന്ന തരത്തിലാകാനും അനുവദിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പാപത്തിന്റെ മോഹങ്ങൾ.’
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: βασιλευέτω
  choice: വാഴാൻ അനുവദിക്കരുത്
  rationale: തുടർച്ചയായ വിലക്കിന്റെ ബലവും രാജാധികാരത്തിന്റെ രൂപകവും നിലനിർത്തുന്നു.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: പൗലോസ് പാപത്തെ വാഴുന്ന ശക്തിയായി വ്യക്തിവൽക്കരിക്കുന്ന ഭാവം ക്രിയയോടൊപ്പം സംരക്ഷിക്കുന്നു.
- source_word: θνητῷ σώματι
  choice: മർത്യശരീരത്തിൽ
  rationale: മരണത്തിന് വിധേയമായ ഇപ്പോഴത്തെ ശരീരാവസ്ഥയെ ചുരുക്കമായും കൃത്യമായും അറിയിക്കുന്നു.
- source_word: εἰς τὸ ὑπακούειν
  choice: അങ്ങനെ ... അനുസരിക്കാതിരിക്കട്ടെ
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യം/ഫലം വ്യക്തമാക്കുകയും മലയാളത്തിലെ വിലക്കുവാക്യത്തോട് സ്വാഭാവികമായി ചേരുകയും ചെയ്യുന്നു.
- source_word: ἐπιθυμίαις
  choice: മോഹങ്ങൾ
  rationale: ലൈംഗികാർഥത്തിൽ മാത്രം ചുരുക്കാതെ, സന്ദർഭത്തിലെ അധാർമിക ആഗ്രഹങ്ങളുടെ ഭാരം നൽകുന്നു.
- source_word: αὐτοῦ
  choice: അതിന്റെ
  rationale: വ്യാകരണപരമായി നപുംസക ഏകവചനമായ σώματι എന്ന ‘ശരീരം’ ആണ് ഏറ്റവും സ്വാഭാവികമായ മുൻപദം; സന്ദർഭപരമായ മറ്റൊരു ബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പാപം പ്രവൃത്തികൾ മാത്രമാണോ, വാഴുന്ന ശക്തിയായാണോ ഇവിടെ ചിത്രീകരിക്കുന്നത്
  choice: ‘പാപം വാഴാൻ’ എന്ന വ്യക്തിവൽക്കരണവും രാജകീയ രൂപകവും നിലനിർത്തി.
  alternative: ‘പാപപ്രവൃത്തികൾ നിങ്ങളെ നിയന്ത്രിക്കരുത്’ എന്ന് വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കുക.
  rationale: βασιλευέτω എന്ന ക്രിയ പാപത്തെ വാഴുന്ന ശക്തിയായി അവതരിപ്പിക്കുന്നു; അതിനെ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം സംരക്ഷിക്കുന്നു.
- issue: αὐτοῦ എന്ന സർവനാമത്തിന്റെ മുൻപദം
  choice: മുഖ്യപാഠത്തിൽ ‘അതിന്റെ’ എന്നത് മർത്യശരീരത്തിന്റെ മോഹങ്ങളെ സൂചിപ്പിക്കുന്നു.
  alternative: പാപത്തിന്റെ മോഹങ്ങൾ എന്നു സന്ദർഭപരമായി മനസ്സിലാക്കുക.
  rationale: αὐτοῦ എന്ന പുംലിംഗ/നപുംസക ഏകവചനരൂപം സ്ത്രീലിംഗമായ ἁμαρτία-യെക്കാൾ നപുംസകമായ σώμα-യോടാണ് വ്യാകരണപരമായി സ്വാഭാവികമായി ചേരുന്നത്; എന്നാൽ സന്ദർഭപരമായ മറ്റൊരു വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാഴുക’ രാജകീയ രൂപകം നിലനിർത്തുന്നു; ‘മോഹങ്ങൾ’ എന്നത് ‘കാമങ്ങൾ’ എന്നതിനെക്കാൾ വിശാലമായ അർഥം നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
