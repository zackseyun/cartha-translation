revisions:
- from: അതുകൊണ്ട്, നിങ്ങളുടെ മർത്യശരീരത്തിൽ പാപം വാഴാൻ അനുവദിക്കരുത്; അങ്ങനെ അതിന്റെ മോഹങ്ങൾ നിങ്ങൾ അനുസരിക്കാതിരിക്കട്ടെ.[a]
  to: അതുകൊണ്ട്, നിങ്ങളുടെ മർത്യശരീരത്തിൽ പാപം വാഴാനും അതിന്റെ[a] മോഹങ്ങൾ നിങ്ങൾ അനുസരിക്കുന്ന തരത്തിലാകാനും അനുവദിക്കരുത്.
  rationale: The revision retains every key lexical and theological element while rendering εἰς τὸ ὑπακούειν as the consequence/manner associated with sin’s reign, rather than as a separate negated command. The footnote marker is placed on “അതിന്റെ,” the word whose antecedent is disputed, and the alternative is stated concisely without deciding the ambiguity beyond the main-text grammatical reading.
