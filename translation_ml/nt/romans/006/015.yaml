id: ROM.6.15
reference: Romans 6:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: ml
  text: അപ്പോൾ എന്ത്? നാം ന്യായപ്രമാണത്തിൻകീഴിലല്ല, കൃപയ്ക്കു കീഴിലാണ് എന്നതിനാൽ പാപം ചെയ്യണമോ?[a] ഒരിക്കലും അരുത്![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നാം പാപം ചെയ്യാനാണോ?’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരുവിധത്തിലും പാടില്ല!’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: അപ്പോൾ എന്ത്?
  rationale: പൗലോസിന്റെ വാദത്തിലെ നിഗമനാത്മകമായ അടുത്ത ചോദ്യം, ഗ്രീക്കിൽ ഇല്ലാത്ത വാക്കുകൾ ചേർക്കാതെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἁμαρτήσωμεν
  choice: നാം ... പാപം ചെയ്യണമോ?
  rationale: ഒന്നാം പുരുഷ ബഹുവചനത്തിലെ deliberative aorist subjunctive രൂപം ഉന്നയിക്കുന്ന ആലോചനാത്മകവും വാചാടോപപരവുമായ നിർദേശം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: എന്നതിനാൽ
  rationale: പാപം ചെയ്യാമെന്ന നിർദേശത്തിന് ഉന്നയിക്കപ്പെടുന്ന കാരണം അല്ലെങ്കിൽ അടിസ്ഥാനം ഇവിടെ വ്യക്തമാക്കുന്നു.
- source_word: ὑπὸ νόμον
  choice: ന്യായപ്രമാണത്തിൻകീഴിൽ
  rationale: νόμος എന്നതിന്റെ നിയമപരവും പൗലോസിന്റെ കൃതികളിൽ പതിഞ്ഞതുമായ അർഥം നിലനിർത്തുന്നു; മൂശെയുടെ ന്യായപ്രമാണം എന്ന് വ്യാഖ്യാനപരമായി ചുരുക്കുന്നില്ല.
- source_word: ὑπὸ χάριν
  choice: കൃപയ്ക്കു കീഴിൽ
  rationale: നിയമത്തോടുള്ള സമാന്തര വിരോധം നിലനിർത്തിക്കൊണ്ട് χάρις എന്ന പദത്തിന്റെ സ്ഥാപിതമായ ദൈവശാസ്ത്രപര അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലും അരുത്!
  rationale: പൗലോസിന്റെ ശക്തമായ നിരാകരണത്തിന്റെ ഭാരം നിലനിർത്തുകയും ആധുനിക വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായി കേൾക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വിരോധത്തിൽ νόμος എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ന്യായപ്രമാണം’ എന്നു പൊതുവായി നൽകുക
  alternative: ‘മൂശെയുടെ ന്യായപ്രമാണം’ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്കിൽ article ഇല്ല; പരിഭാഷയിൽ അതിന്റെ കൃത്യമായ ഉടമ്പടി-ദൈവശാസ്ത്ര വ്യാപ്തി മുൻകൂട്ടി നിർണയിക്കാതെ നിയമം–കൃപ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തിയെങ്കിലും വാക്യഘടന ലളിതമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
