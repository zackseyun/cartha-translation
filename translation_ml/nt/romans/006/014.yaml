id: ROM.6.14
reference: Romans 6:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: ml
  text: എന്തെന്നാൽ, പാപം നിങ്ങളുടെമേൽ ആധിപത്യം പുലർത്തുകയില്ല[a]; കാരണം, നിങ്ങൾ ന്യായപ്രമാണത്തിൻ കീഴിലല്ല[b], കൃപയ്ക്കു കീഴിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളുടെമേൽ വാഴുകയില്ല.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘നിയമത്തിൻ കീഴിൽ’; നിയമത്തിന്റെ അധികാരത്തിനോ വ്യവസ്ഥയ്ക്കോ കീഴിലായിരിക്കുക എന്നർഥമുള്ള പ്രയോഗം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: പാപം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ സാധാരണ അർഥം നിലനിർത്തുന്നു. ഇവിടെ പാപം ഭരിക്കുന്ന ശക്തിയായി വ്യക്തിവൽക്കരിക്കപ്പെട്ടിട്ടുണ്ടെങ്കിലും, അതിനെ പേരുപോലെ അടയാളപ്പെടുത്തുന്നത് ഗ്രീക്കിൽ ഇല്ലാത്ത വ്യാഖ്യാനപാളി ചേർക്കും.
- source_word: κυριεύσει
  choice: ആധിപത്യം പുലർത്തുകയില്ല
  rationale: കർത്തൃത്വമോ അധീശത്വമോ പ്രയോഗിക്കുക എന്ന ക്രിയയുടെ അർഥവും പാപത്തെ ഭരിക്കുന്ന ശക്തിയായി അവതരിപ്പിക്കുന്ന രൂപകവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ νόμον
  choice: ന്യായപ്രമാണത്തിൻ കീഴിൽ
  rationale: നിയമത്തിന്റെ അധികാരത്തിനോ വ്യവസ്ഥയ്ക്കോ കീഴിലായിരിക്കുക എന്ന പൗലോസിന്റെ പ്രയോഗം അറിയിക്കുന്നു. റോമർ ലേഖനത്തിന്റെ പശ്ചാത്തലത്തിൽ ‘ന്യായപ്രമാണം’ മോശൈക നിയമവ്യവസ്ഥയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: നിയമവും കൃപയും തമ്മിലുള്ള പൗലോസിന്റെ വിരുദ്ധതയ്ക്ക് യോജിക്കുന്ന, സ്ഥാപിതവും ദൈവശാസ്ത്രപരമായ ശക്തി നിലനിർത്തുന്നതുമായ പദം.
- source_word: γὰρ … γάρ
  choice: എന്തെന്നാൽ … ;
  rationale: ആദ്യ γὰρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ‘എന്തെന്നാൽ’കൊണ്ട് സൂചിപ്പിക്കുന്നു. രണ്ടാമത്തേത് മലയാളത്തിലെ വാക്യഘടനയും അർധവിരാമവും മുഖേന കാരണവിവരണമായി സ്വാഭാവികമായി പ്രകടമാകുന്നു; ആവർത്തിച്ചുള്ള കാരണബന്ധപദം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: പാപത്തിന്റെ വ്യക്തിവൽക്കരണം കൂടുതൽ വ്യക്തമാക്കണമോ
  choice: ‘പാപം നിങ്ങളുടെമേൽ ആധിപത്യം പുലർത്തുകയില്ല’ എന്ന് നൽകുക
  alternative: ‘പാപം നിങ്ങളുടെ യജമാനനായിരിക്കുകയില്ല’
  rationale: ഗ്രീക്ക് പാപത്തെ ഭരിക്കുന്ന ശക്തിയായി വ്യക്തിവൽക്കരിക്കുന്നു; എന്നാൽ ‘യജമാനൻ’ എന്ന ശക്തമായ രൂപകം മൂലത്തിൽ ആവശ്യപ്പെടുന്നതിലധികം വ്യക്തത ചേർക്കാം. തിരഞ്ഞെടുത്ത രൂപം ദൈവശാസ്ത്രപരമായ ചിത്രം നിലനിർത്തുകയും അധിക വ്യാഖ്യാനം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: νόμος എന്നതിനെ പൊതുവായ നിയമമെന്നോ മോശൈക ന്യായപ്രമാണമെന്നോ വ്യക്തമാക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ന്യായപ്രമാണം’ ഉപയോഗിച്ച്, ‘നിയമത്തിന്റെ അധികാരത്തിനോ വ്യവസ്ഥയ്ക്കോ കീഴിൽ’ എന്ന ആശയം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുക
  alternative: ‘നിയമത്തിൻ കീഴിൽ’
  rationale: റോമർ ലേഖനത്തിലെ സന്ദർഭം മോശൈക നിയമവ്യവസ്ഥയിലേക്കാണ് സ്വാഭാവികമായി ചൂണ്ടുന്നത്. എങ്കിലും മുഖ്യപാഠത്തിൽ ‘മോശെയുടെ’ എന്ന് ചേർത്ത് വ്യാഖ്യാനം പൂർണമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം,’ ‘കൃപ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യക്രമം സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അനുബന്ധ പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ മുഖ്യപാഠത്തിൽ നൽകിയിരിക്കുന്നു.
