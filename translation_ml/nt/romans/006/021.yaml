    rationale: οὖν is inferential (‘therefore/then’ in the logical sense), whereas τότε later in the sentence supplies the temporal ‘then.’ «അങ്ങനെയെങ്കിൽ» distinguishes these functions naturally.
  - severity: low
    issue: Footnote wording «അഥവാ ... എന്നു വായിക്കാം» is potentially misleading.
    rationale: The note gives a lexical rendering alternative for τέλος, not an alternative manuscript reading. It should say that ‘പരിണതി’ may be used in place of ‘അന്ത്യം.’
