reference: Romans 6:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ഇപ്പോൾ നിങ്ങൾ ലജ്ജിക്കുന്ന ആ കാര്യങ്ങളിൽനിന്ന് അന്ന് നിങ്ങൾക്ക് എന്തു ഫലമാണ് ഉണ്ടായിരുന്നത്? ആ കാര്യങ്ങളുടെ അന്ത്യം മരണമാകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അന്ത്യം’ എന്നതിന് പകരം ‘പരിണതി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: എന്തു
  rationale: ഫലത്തിന്റെ സ്വഭാവത്തെയും മൂല്യത്തെയും ചോദ്യം ചെയ്യുന്ന വാചാടോപപരമായ ചോദ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നതിനൊപ്പം ചോദ്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: καρπὸν
  choice: ഫലം
  rationale: പൗലോസിന്റെ ഉൽപ്പാദിത ഫലം എന്ന രൂപകം നിലനിർത്തുന്നു; ‘പ്രയോജനം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: εἴχετε
  choice: നിങ്ങൾക്ക് ... ഉണ്ടായിരുന്നത്
  rationale: മുൻകാലത്തെ തുടർന്നിരുന്ന അവസ്ഥ സൂചിപ്പിക്കുന്ന അപൂർണ്ണഭൂതകാലത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τότε
  choice: അന്ന്
  rationale: νῦν എന്ന ‘ഇപ്പോൾ’ എന്നതിനോടുള്ള കാലവ്യത്യാസം ചുരുക്കമായും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: ἐφ’ οἷς
  choice: ആ കാര്യങ്ങളിൽനിന്ന്
  rationale: മുൻകാല പ്രവൃത്തികളിൽനിന്നു ലഭിച്ച ഫലത്തെക്കുറിച്ചുള്ള സാധ്യതയേറിയ ബന്ധം വ്യക്തമാക്കുന്നു; സൂചിതമായ ‘കാര്യങ്ങൾ’ ചേർക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: ‘അന്ന്’ എന്നതിനോടുള്ള ശക്തമായ കാലവ്യത്യാസം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐπαισχύνεσθε
  choice: നിങ്ങൾ ലജ്ജിക്കുന്ന
  rationale: ധാർമ്മിക ഗൗരവമുള്ള ലജ്ജയെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: τέλος
  choice: അവസാനം
  rationale: അന്ത്യം, പരിണതി എന്നീ രണ്ടുതലങ്ങളുള്ള അർത്ഥസാധ്യത നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായി ‘ഫലം’ എന്നു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἐκείνων
  choice: ആ കാര്യങ്ങളുടെ
  rationale: മുൻവാക്യഭാഗത്തിലെ പ്രവൃത്തികളിലേക്കുള്ള സൂചന വ്യക്തമാക്കാൻ സൂചിത നാമം ചേർക്കുന്നു.
- source_word: θάνατος
  choice: മരണം
  rationale: പദത്തിന്റെ നേരിട്ടുള്ളതും ദൈവശാസ്ത്രപരമായി ഗൗരവമുള്ളതുമായ അർത്ഥം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τέλος എന്നത് ‘അവസാനം’ എന്നോ ‘പരിണതി’ എന്നോ പരിഭാഷപ്പെടുത്തുക
  choice: അവസാനം
  alternative: പരിണതി
  rationale: ‘അവസാനം’ മുൻജീവിതരീതിയുടെ അന്തിമഗതിയും അതിന്റെ അനന്തരഫലവും ഉൾക്കൊള്ളാൻ അനുവദിക്കുന്നു; മൂലപാഠത്തിലെ അർത്ഥവ്യാപ്തി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഫലം’ എന്ന രൂപകവും ‘അന്ന്/ഇപ്പോൾ’ എന്ന കാലവ്യത്യാസവും സംരക്ഷിച്ചിട്ടുണ്ട്. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട വാക്യത്തിന്റെ അവസാനം നൽകിയിരിക്കുന്നു.
