id: ROM.6.7
reference: Romans 6:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: ml
  text: എന്തെന്നാൽ, മരിച്ചയാൾ പാപത്തിൽനിന്ന് നീതീകരിക്കപ്പെട്ടിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പാപത്തിൽനിന്ന് കുറ്റവിമുക്തനായി പ്രഖ്യാപിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം; സന്ദർഭത്തിൽ ‘പാപത്തിൽനിന്ന് സ്വതന്ത്രനായിരിക്കുന്നു’ എന്ന അർഥവും വരാം.
    reason: δεδικαίωται എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധിയായ അടിസ്ഥാനാർഥവും ഈ സന്ദർഭത്തിലെ മോചനസംബന്ധിയായ അർഥസാധ്യതയും സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: മരിച്ചയാൾ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ ഭൂതകാല കൃദന്തം ഇവിടെ നാമപദമായി പ്രവർത്തിക്കുന്നു. ‘മരിച്ചയാൾ’ വ്യക്തിയെ സൂചിപ്പിക്കുമ്പോഴും അനാവശ്യമായി ലിംഗം നിർണയിക്കാതെ പ്രതിനിധാനസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിനുള്ള കാരണമോ വിശദീകരണമോ അവതരിപ്പിക്കുന്ന ബന്ധകമാണ്. മലയാളത്തിൽ ‘കാരണം’ ഈ വിശദീകരണബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δεδικαίωται
  choice: നീതീകരിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: δικαιόω എന്ന ക്രിയയുടെ സാധാരണ ന്യായവിധിസംബന്ധിയായ അർഥം നേരിട്ട് നിലനിർത്തുന്നു. പൂർണ്ണകാലരൂപം സൂചിപ്പിക്കുന്ന, സംഭവിച്ചുകഴിഞ്ഞതും ഇപ്പോഴും നിലനിൽക്കുന്നതുമായ ഫലം ‘-പ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: പാപത്തിൽനിന്ന്
  rationale: ἀπό വേർപാടിനെയോ മോചനത്തെയോ സൂചിപ്പിക്കുന്നു. റോമർ 6-ൽ പാപം ഒരു ആധിപത്യശക്തിയായി വ്യക്തിവൽക്കരിക്കപ്പെടുന്ന സാധ്യത ചുരുക്കാതെ ‘പാപത്തിൽനിന്ന്’ എന്ന പ്രയോഗം കുറ്റവും അധികാരവും സംബന്ധിച്ച അർഥവ്യാപ്തി തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: δικαιόω എന്നത് ഇവിടെ ന്യായവിധിസംബന്ധിയായ ‘നീതീകരിക്കുക’ എന്ന അർഥത്തിലോ മോചനസംബന്ധിയായ ‘സ്വതന്ത്രനാക്കുക’ എന്ന അർഥത്തിലോ ഗ്രഹിക്കണമോ എന്നത്.
  choice: പ്രധാനപാഠത്തിൽ ‘നീതീകരിക്കപ്പെട്ടിരിക്കുന്നു’ എന്നു നൽകി.
  alternative: ‘കുറ്റവിമുക്തനാക്കപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ സന്ദർഭാനുസൃതമായി ‘സ്വതന്ത്രനാക്കപ്പെട്ടിരിക്കുന്നു’.
  rationale: റോമർ 6 പാപത്തിന്റെ ആധിപത്യത്തിൽനിന്നുള്ള മോചനത്തെ ഊന്നുന്നുവെങ്കിലും പൗലോസ് ഇവിടെ മോചനത്തിനുള്ള സാധാരണ ക്രിയയ്ക്കു പകരം δικαιόω ഉപയോഗിക്കുന്നു. അതിനാൽ പ്രധാനപാഠം ന്യായവിധിസംബന്ധിയായ പദം നിലനിർത്തുകയും അടിക്കുറിപ്പ് നിയമപരവും മോചനപരവുമായ മറ്റു വായനകൾ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നവിധം ഗൗരവമുള്ള ശൈലി സ്വീകരിച്ചു. ‘മരിച്ചയാൾ’ ലിംഗം അനാവശ്യമായി നിർണയിക്കാത്ത സ്വാഭാവിക പ്രയോഗമാണ്; ‘നീതീകരിക്കപ്പെട്ടിരിക്കുന്നു’ പൗലോസിന്റെ പദപ്രയോഗത്തിലെ നിയമപരമായ ഭാവം നിലനിർത്തുന്നു.
