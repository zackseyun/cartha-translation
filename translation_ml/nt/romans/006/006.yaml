id: ROM.6.6
reference: Romans 6:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: ml
  text: 'ഇതു നാം അറിയുന്നു: നമ്മുടെ പഴയ മനുഷ്യൻ[a] അവനോടൊപ്പം ക്രൂശിക്കപ്പെട്ടു; പാപത്തിന്റെ ശരീരം നിർവീര്യമാക്കപ്പെടേണ്ടതിനായി[b], നാം ഇനി പാപത്തിന് അടിമകളായിരിക്കാതിരിക്കാൻ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ പഴയ വ്യക്തിത്വം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇല്ലാതാക്കപ്പെടേണ്ടതിനായി” അല്ലെങ്കിൽ “പ്രഭാവശൂന്യമാക്കപ്പെടേണ്ടതിനായി.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “നാം ഇനി പാപത്തെ സേവിക്കാതിരിക്കാൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: ഇതു നാം അറിയുന്നു
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തരൂപത്തിന്റെ മുൻസന്ദർഭത്തോടുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ സ്വാഭാവികമായ പൂർണവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: നമ്മുടെ പഴയ മനുഷ്യൻ
  rationale: പൗലോസിന്റെ മനുഷ്യശാസ്ത്രപരമായ ദൃശ്യഭാഷയും ഏകവചനരൂപവും സംരക്ഷിക്കുന്നു; ഇത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല. കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ‘പഴയ വ്യക്തിത്വം’ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: συνεσταυρώθη
  choice: അവനോടൊപ്പം ക്രൂശിക്കപ്പെട്ടു
  rationale: συν- എന്ന ഘടകം സൂചിപ്പിക്കുന്ന കൂട്ടായ ക്രൂശിക്കപ്പെടൽ വ്യക്തമാക്കുന്നു. ‘അവൻ’ എന്നത് മുൻസന്ദർഭത്തിലെ ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി ഗ്രീക്ക് ക്രിയയിൽ അന്തർലീനമാണ്.
- source_word: καταργηθῇ
  choice: നിർവീര്യമാക്കപ്പെടേണ്ടതിനായി
  rationale: പൂർണമായ ഉന്മൂലനത്തേക്കാൾ പ്രവർത്തനശക്തിയും ആധിപത്യവും നഷ്ടപ്പെടുത്തുക എന്ന സന്ദർഭോചിത അർഥം നൽകുകയും ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: പാപത്തിന്റെ ശരീരം
  rationale: ‘പാപം ഭരിക്കുന്ന ശരീരം’ എന്നിങ്ങനെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്ത ഷഷ്ഠീബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: നാം ഇനി പാപത്തിന് അടിമകളായിരിക്കാതിരിക്കേണ്ടതിന്
  rationale: δουλεύω എന്ന പദത്തിലെ അടിമത്തത്തിന്റെയും യജമാനാധീനതയുടെയും ശക്തമായ രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὁ παλαιὸς ἡμῶν ἄνθρωπος എന്ന മനുഷ്യശാസ്ത്രപരമായ പ്രയോഗം
  choice: നമ്മുടെ പഴയ മനുഷ്യൻ
  alternative: നമ്മുടെ പഴയ വ്യക്തിത്വം
  rationale: ആദാമ്യമായ പഴയ മനുഷ്യാവസ്ഥയെക്കുറിച്ചുള്ള പൗലോസിന്റെ മൂലദൃശ്യഭാഷ സംരക്ഷിക്കുന്നു; അതിനെ വെറും മാനസിക ‘വ്യക്തിത്വം’ ആയി ചുരുക്കുന്നില്ല.
- issue: καταργηθῇ എന്നതിന്റെ ശക്തി
  choice: നിർവീര്യമാക്കപ്പെടുക
  alternative: ഇല്ലാതാക്കപ്പെടുക / പ്രഭാവശൂന്യമാക്കപ്പെടുക
  rationale: പാപത്തിന്റെ ശരീരം അസ്തിത്വത്തിൽനിന്ന് പൂർണമായി നശിക്കുന്നു എന്ന ശക്തമായ നിഗമനം ഇറക്കാതെ, അതിന്റെ പ്രവർത്തനശക്തി തകർക്കപ്പെടുന്നു എന്ന അർഥം മുൻനിർത്തുന്നു.
- issue: രണ്ടാമത്തെ ലക്ഷ്യപ്രയോഗമായ τοῦ μηκέτι δουλεύειν ന്റെ ബന്ധം
  choice: നാം ഇനി പാപത്തിന് അടിമകളായിരിക്കാതിരിക്കേണ്ടതിന്
  alternative: നാം ഇനി പാപത്തെ സേവിക്കാതിരിക്കേണ്ടതിന്
  rationale: ഇത് മുൻപുള്ള ലക്ഷ്യത്തിന്റെ അന്തിമഫലമോ വിശദീകരണമോ ആകാമെന്ന ബന്ധം തുറന്നുവെക്കുന്നു; δουλεύωയിലെ അടിമത്തദൃശ്യം നഷ്ടപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പഴയ മനുഷ്യൻ’, ‘പാപത്തിന്റെ ശരീരം’ എന്നീ പൗലോസിന്റെ സാന്ദ്രമായ പ്രയോഗങ്ങൾ വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തിയിരിക്കുന്നു; വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നതിനായി ലക്ഷ്യഘടകങ്ങൾ ക്രിയയ്ക്കുമുമ്പിൽ വെച്ചിരിക്കുന്നു.
