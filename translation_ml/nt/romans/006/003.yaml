  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: ml
  text: അല്ലെങ്കിൽ, മശീഹാ യേശുവിലേക്കു സ്നാനമേറ്റ നാമെല്ലാവരും അവന്റെ മരണത്തിലേക്കാണു സ്നാനമേറ്റതെന്നു നിങ്ങൾ അറിയുന്നില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ക്രിസ്തു യേശു.” ഗ്രീക്ക്: “ക്രിസ്റ്റോസ് ഈസൂസ്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാക്യവുമായി ഈ ചോദ്യത്തെ ബന്ധിപ്പിക്കുന്ന പൗലോസിന്റെ വാദപരമായ സംക്രമണം നിലനിർത്തുന്നു.
- source_word: ἀγνοεῖτε
  choice: നിങ്ങൾ അറിയുന്നില്ലേ
  rationale: പങ്കുവെക്കപ്പെട്ട അറിവിനെ ഓർമിപ്പിക്കുന്ന അല്പം ശാസനാഭാവമുള്ള അലങ്കാരചോദ്യമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ὅσοι
  choice: നാമെല്ലാവരും
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ക്രിയയോടൊപ്പം വരുന്ന പ്രയോഗത്തിന്റെ ഉൾക്കൊള്ളുന്ന സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: ἐβαπτίσθημεν
  choice: സ്നാനമേറ്റ
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗത്തിന്റെ സംഭവസ്വഭാവം നേരിട്ട് നിലനിർത്തുന്നു; സ്നാനത്തിന്റെ പ്രവർത്തനരീതിയെക്കുറിച്ച് പ്രത്യേക സഭാപാരമ്പര്യ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: εἰς
  choice: -ലേക്ക് / -ലേക്കാണ്
  rationale: രണ്ടിടത്തും ലക്ഷ്യത്തെയോ ഉൾച്ചേരലിനെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; ‘ബന്ധത്തിൽ’ എന്ന മൃദുവായ വ്യാഖ്യാനമോ ‘ഐക്യത്തിലേക്ക്’ എന്ന വിശദീകരണമോ ചേർക്കുന്നില്ല.
- source_word: Χριστὸν Ἰησοῦν
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്നത് ഇവിടെ അഭിഷിക്തനായ മശീഹാ എന്ന സ്ഥാനപ്പേരായി അവതരിപ്പിക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ബന്ധരൂപം ഉപയോഗിക്കുന്നു.
- source_word: θάνατον
  choice: മരണം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ളതും മതിയായതുമായ പരിഭാഷ.
- source_word: αὐτοῦ
  choice: അവന്റെ
  rationale: ഷഷ്ഠീവിഭക്തിയിലുള്ള സർവനാമത്തെ സ്വാഭാവികമായ ഉടമസ്ഥരൂപത്തിൽ പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: സ്നാനത്തോടൊപ്പം വരുന്ന εἰς എന്ന പദം കൂദാശാപരമായ ഫലസിദ്ധിയെയോ പ്രതീകാത്മക തിരിച്ചറിയലെയോ ഉടമ്പടിപരമായ ഐക്യത്തെയോ അനുകൂലിക്കുന്നവിധം വിശദീകരിക്കണമോ എന്നത്.
  choice: രണ്ടിടത്തും ‘-ലേക്ക്’ എന്ന ലക്ഷ്യ/ഉൾച്ചേരൽ സൂചിപ്പിക്കുന്ന രൂപം ഉപയോഗിച്ചു.
  alternative: ‘ബന്ധത്തിൽ’; ‘ഐക്യത്തിലേക്ക്’
  rationale: ഗ്രീക്ക് പ്രയോഗം മശീഹയായ യേശുവിലേക്കും അവന്റെ മരണത്തിലേക്കുമുള്ള നീക്കമോ ഉൾച്ചേരലോ പ്രകടിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘-ലേക്ക്’ ആ ശക്തി നിലനിർത്തുന്നു; എന്നാൽ സ്നാനം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നൊരു പ്രത്യേക സഭാവിഭാഗീയ വിശദീകരണം ഉറപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനം ഉദ്ദേശപൂർവം നിലനിർത്തി; ‘സ്നാനമേറ്റ’ എന്ന ചുരുക്കരൂപം വാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്ക് സംരക്ഷിക്കുന്നു.
