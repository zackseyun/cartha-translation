id: ROM.6.17
reference: Romans 6:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: ml
  text: എന്നാൽ ദൈവത്തിനു നന്ദി! നിങ്ങൾ പാപത്തിന്റെ അടിമകളായിരുന്നെങ്കിലും, നിങ്ങളെ ഏൽപ്പിച്ച ഉപദേശമാതൃകയെ[a] നിങ്ങൾ ഹൃദയപൂർവം അനുസരിച്ചു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഉപദേശത്തിന്റെ രൂപം’ അല്ലെങ്കിൽ ‘ഉപദേശത്തിന്റെ മാനദണ്ഡം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘നിങ്ങളെ അതിലേക്ക് ഏൽപ്പിച്ചു.’'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: എന്നാൽ ദൈവത്തിനു നന്ദി!
  rationale: ദൈവത്തോടുള്ള നന്ദി പ്രകടിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥവും പൗലോസിന്റെ സ്തോത്രഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: പാപത്തിന്റെ അടിമകൾ
  rationale: റോമർ 6-ലെ ഉടമസ്ഥതയുടെയും അധീനതയുടെയും ശക്തമായ അടിമത്തരൂപകം മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: ὑπηκούσατε
  choice: അനുസരിച്ചു
  rationale: കേവലം കേൾക്കുക എന്നതിലുപരി അനുസരണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയുടെ ധാർമിക ശക്തി സംരക്ഷിക്കുന്നു.
- source_word: ἐκ καρδίας
  choice: ഹൃദയപൂർവം
  rationale: ഉള്ളിൽനിന്നുള്ള ആത്മാർഥമായ അനുസരണം സ്വാഭാവികവും വ്യക്തവുമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: τύπον διδαχῆς
  choice: ഉപദേശമാതൃക
  rationale: τύπος എന്നതിലെ മാതൃക, രൂപം, മാനദണ്ഡം എന്നീ അർഥസാധ്യതകളിൽ പ്രധാനമായത് നിലനിർത്തുകയും διδαχήയെ ‘ഉപദേശം’ എന്നു വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: παρεδόθητε
  choice: നിങ്ങളെ ഏല്പിച്ചു
  rationale: വിശ്വാസികൾക്കു ഉപദേശം ഏല്പിക്കപ്പെട്ടു എന്നാക്കി മാറ്റാതെ, വിശ്വാസികൾ തന്നെയാണ് ഉപദേശമാതൃകയ്ക്ക് ഏല്പിക്കപ്പെട്ടത് എന്ന ശ്രദ്ധേയമായ ഗ്രീക്ക് കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: εἰς ὃν
  choice: ഏത് ... മാതൃകയ്ക്ക്
  rationale: ഉപദേശമാതൃകയിലേക്കുള്ള ദിശയെയോ അതിന്റെ അധികാരത്തിനു കീഴിലാകുന്നതിനെയോ സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ ‘അതിലേക്ക്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: δοῦλοι എന്നത് മൃദുവാക്കി ‘ദാസന്മാർ/സേവകർ’ എന്നു നൽകണമോ, ‘അടിമകൾ’ എന്നു നൽകണമോ
  choice: പാപത്തിന്റെ അടിമകൾ
  alternative: പാപത്തിന്റെ ദാസന്മാർ
  rationale: റോമർ 6-ൽ പാപത്തിന്റെ ഉടമസ്ഥതയും ആധിപത്യവും നീതിയോടുള്ള അടിമത്തവുമായുള്ള വിരുദ്ധതയും പ്രധാനമായതിനാൽ ശക്തമായ അടിമത്തരൂപകം സംരക്ഷിച്ചു.
- issue: വിശ്വാസികളെ ഉപദേശമാതൃകയ്ക്ക് ഏല്പിച്ചു എന്ന കർമണിചിത്രം നിലനിർത്തണമോ
  choice: ഏത് ഉപദേശമാതൃകയ്ക്ക് നിങ്ങളെ ഏല്പിച്ചുവോ
  alternative: നിങ്ങൾക്ക് ഏല്പിക്കപ്പെട്ട ഉപദേശമാതൃക
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ ഏല്പിക്കപ്പെടുന്നത് ഉപദേശമല്ല, വിശ്വാസികളാണ്. ആ ദിശ മറിച്ചിടാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും രൂപകത്തിന്റെ ശക്തിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ശ്രദ്ധേയമായ കർമണിചിത്രം കാരണം അല്പം അസാധാരണമായ ‘മാതൃകയ്ക്ക് നിങ്ങളെ ഏല്പിച്ചു’ എന്ന ഘടന ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
