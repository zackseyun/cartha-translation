id: ROM.6.11
reference: Romans 6:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: ml
  text: അതുപോലെ, നിങ്ങളും നിങ്ങളെത്തന്നെ പാപത്തിന് മരിച്ചവരും എന്നാൽ മശീഹയായ യേശുവിൽ ദൈവത്തിന് ജീവനുള്ളവരുമാണെന്ന് കരുതുക[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന് ജീവിക്കുന്നവരെന്നും.”
    reason: lexical_alternative
  - marker: b
    text: “കരുതുക” എന്നതിന് “കണക്കാക്കുക” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തിലെ വാദവുമായി ബന്ധിപ്പിക്കുന്ന അനുമാനാത്മക പ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: λογίζεσθε
  choice: കരുതുക
  rationale: യാഥാർഥ്യമായി കണക്കാക്കുക അഥവാ അങ്ങനെ പരിഗണിക്കുക എന്ന മാനസിക വിലയിരുത്തലിന്റെ ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἑαυτοὺς
  choice: നിങ്ങളെത്തന്നെ
  rationale: ഗ്രീക്കിലെ പ്രത്യാവർത്തക സർവനാമം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: εἶναι
  choice: എന്നും … എന്നും
  rationale: ‘ആയിരിക്കുക’ എന്ന infinitive-ന്റെ ശക്തി മലയാളത്തിലെ പരോക്ഷപൂരക ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: പാപത്തിന് മരിച്ചവർ
  rationale: dative ബന്ധം ‘പാപത്തിന്’ എന്ന് സംക്ഷിപ്തമായി നൽകി, തുടർന്നുള്ള വിരുദ്ധസമാന്തര്യം സംരക്ഷിക്കുന്നു.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: ദൈവത്തിനായി ജീവിക്കുന്നവർ
  rationale: ζῶντας എന്ന വർത്തമാന participle-ന്റെ ‘ജീവിക്കുന്ന’ രൂപം നിലനിർത്തുന്നു; τῷ θεῷ എന്ന ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി ‘ദൈവത്തിനായി’ എന്ന് നൽകുന്നു, എന്നാൽ ഇതിന്റെ ബന്ധാർഥത്തിന് മറ്റു സാധ്യതയുണ്ടെന്ന് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν എന്നത് ‘യിൽ’ ആയി നിലനിർത്തി പൗലോസിന്റെ ഉൾപ്പെടൽ/ബന്ധമേഖലാ ഭാഷയെ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല; Χριστός ഇവിടെ പദവിയെന്ന നിലയിൽ ‘മശീഹ’യായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: Χριστῷ എന്നത് പദവിയായോ പേരുപോലുള്ള രൂപമായോ നൽകുക
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഇവിടെ Χριστός-ന്റെ പദവിയർഥം ദൃശ്യമാക്കുന്നു; ‘യായ’ ചേർക്കുന്നത് മലയാളത്തിൽ ‘മശീഹ യേശു’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
- issue: ἐν Χριστῷ Ἰησοῦ എന്നതിലെ ἐν-ന്റെ ശക്തി
  choice: മശീഹയായ യേശുവിൽ
  alternative: മശീഹയായ യേശുവിലൂടെ / മശീഹയായ യേശു നിമിത്തം
  rationale: ‘യിൽ’ എന്ന നേരിട്ടുള്ള രൂപം നിലനിർത്തി ഐക്യം, ബന്ധം, മേഖല എന്നീ സാധ്യതകളെ തുറന്നുവയ്ക്കുന്നു; കാരണമോ ഉപാധിയോ ആയി മാത്രം നിർണയിക്കുന്നില്ല.
- issue: τῷ θεῷ എന്ന dative-ന്റെ ബന്ധം
  choice: ദൈവത്തിനായി
  alternative: ദൈവത്തോടുള്ള ബന്ധത്തിൽ / ദൈവത്തിന്
  rationale: സ്വാഭാവിക മലയാളത്തിൽ ദൈവത്തെ ലക്ഷ്യമാക്കിയുള്ള ജീവിതം പ്രകടമാക്കുന്നു; ബന്ധത്തിന്റെ മുഴുവൻ വ്യാപ്തി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതിരിക്കാൻ മറ്റൊരു സാദ്ധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിങ്ങളും നിങ്ങളെത്തന്നെ’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ καὶ ὑμεῖς, ἑαυτούς എന്നീ ഊന്നലുകൾ നിലനിർത്തുന്നു. വിരുദ്ധജോടിയായ ‘മരിച്ചവർ / ജീവിക്കുന്നവർ’ സംരക്ഷിച്ചു.
