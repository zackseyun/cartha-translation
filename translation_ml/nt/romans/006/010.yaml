id: ROM.6.10
reference: Romans 6:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവൻ മരിച്ചതാകട്ടെ പാപത്തെ സംബന്ധിച്ച് ഒരിക്കലായി മരിച്ചു; അവൻ ജീവിക്കുന്നതാകട്ടെ ദൈവത്തിനായി ജീവിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവൻ പാപത്തിനുവേണ്ടി മരിച്ചു” അല്ലെങ്കിൽ “അവൻ പാപത്തെ സംബന്ധിച്ചിടത്തോളം മരിച്ചു.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: അവൻ മരിച്ച മരണം
  rationale: ആവർത്തിച്ചുവരുന്ന ക്രിയയോടൊപ്പം നപുംസകലിംഗ ബന്ധസർവനാമം അവന്റെ മരണസംഭവത്തെ സൂചിപ്പിക്കുന്നു. ഈ പ്രയോഗം ഗ്രീക്കിലെ ഊന്നലും രണ്ടു ഉപവാക്യങ്ങളിലെ സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന കാരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: അയോറിസ്റ്റ് ഇവിടെ പൂർത്തിയായ ചരിത്രസംഭവത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ലളിതമായ ഭൂതകാലം യോജിക്കുന്നു.
- source_word: τῇ ἁμαρτίᾳ
  choice: പാപത്തോടുള്ള ബന്ധത്തിൽ
  rationale: ദാത്തീവ് പാപവുമായുള്ള ബന്ധമോ പരിഗണനയോ സൂചിപ്പിക്കാം. മലയാളത്തിലെ ‘പാപത്തിനു മരിച്ചു’ എന്നത് അസ്വാഭാവികവും തെറ്റിദ്ധാരണാജനകവുമായതിനാൽ, പൗലോസിന്റെ ഉദ്ദേശ്യപരമായ സംക്ഷിപ്തത നഷ്ടപ്പെടുത്താതെ ബന്ധാർഥം വ്യക്തമാക്കുന്നു; ‘പാപത്തിനുവേണ്ടി’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐφάπαξ
  choice: എന്നേക്കുമായി ഒരിക്കൽ
  rationale: ഒരിക്കൽ മാത്രം സംഭവിച്ചതും ആവർത്തിക്കപ്പെടാത്തതുമായ പ്രവൃത്തിയുടെ സ്ഥിരപ്രാബല്യം ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: ὃ δὲ ζῇ
  choice: എന്നാൽ അവൻ ജീവിക്കുന്ന ജീവൻ
  rationale: ആദ്യ ഉപവാക്യത്തിലെ ‘അവൻ മരിച്ച മരണം’ എന്ന ഘടനയോടുള്ള ഗ്രീക്ക് സമാന്തരത നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മരണവും ജീവിതവും തമ്മിലുള്ള വ്യക്തമായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനായി
  rationale: ജീവിതം ദൈവത്തിലേക്കു തിരിഞ്ഞതും ദൈവത്തിനായി സമർപ്പിതവുമാണെന്ന ദാത്തീവിന്റെ ദിശാബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആദ്യ ദാത്തീവുമായുള്ള ആശയവൈരുധ്യവും നിലനിൽക്കുന്നു.
theological_decisions:
- issue: τῇ ἁμαρτίᾳ എന്നത് ക്രിസ്തുവിന് വ്യക്തിപരമായ പാപമുണ്ടായിരുന്നുവെന്ന് സൂചിപ്പിക്കാതെ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: പാപത്തോടുള്ള ബന്ധത്തിൽ
  alternative: പാപത്തിനുവേണ്ടി; പാപത്തെ സംബന്ധിച്ചിടത്തോളം
  rationale: ഈ വാക്യഭാഗം ക്രിസ്തുവിന്റെ മരണം പാപവുമായി ഏതു ബന്ധത്തിലായിരുന്നു എന്നു പറയുന്നു; അവനിൽ വ്യക്തിപരമായ പാപമുണ്ടായിരുന്നുവെന്ന് പറയുന്നില്ല. ‘പാപത്തോടുള്ള ബന്ധത്തിൽ’ എന്നത് ബന്ധാർഥം സൂക്ഷിക്കുകയും ‘ദൈവത്തിനായി’ എന്ന വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു; ബലിമരണത്തെ മുൻകൂട്ടി വ്യാഖ്യാനിക്കുന്ന ‘പാപത്തിനുവേണ്ടി’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ മരണം/ജീവൻ സമാന്തരത നിലനിർത്താൻ അല്പം സാഹിത്യപരമായ ആവർത്തനം ബോധപൂർവം സൂക്ഷിച്ചിട്ടുണ്ട്.
