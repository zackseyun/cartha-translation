reference: Romans 12:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: ml
  text: സഹോദരസ്നേഹത്തിൽ പരസ്പരം വാത്സല്യമുള്ളവരായിരിക്കുക; ആദരിക്കുന്നതിൽ പരസ്പരം മുന്നിട്ടുനിൽക്കുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: സഹോദരസ്നേഹത്തിൽ
  rationale: വിശ്വാസസമൂഹത്തിലെ കുടുംബസദൃശമായ പരസ്പരസ്നേഹത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർത്ഥം നേരിട്ടും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: φιλόστοργοι
  choice: വാത്സല്യമുള്ളവരായിരിക്കുക
  rationale: കുടുംബാംഗങ്ങൾ തമ്മിലുള്ള ഊഷ്മളവും സ്നേഹപൂർവവുമായ അടുപ്പമാണ് പദം സൂചിപ്പിക്കുന്നത്; ‘വാത്സല്യം’ ആ ഭാവം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: τιμῇ
  choice: ആദരിക്കുന്നതിൽ
  rationale: τιμή ഇവിടെ മറ്റുള്ളവർക്ക് നൽകുന്ന ബഹുമാനം/ആദരം എന്ന പ്രവർത്തനപരമായ അർത്ഥത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു.
- source_word: προηγούμενοι
  choice: മുന്നിട്ടുനിൽക്കുക
  rationale: പദത്തിന് ‘മുന്നിൽ പോകുക, നേതൃത്വം നൽകുക, മുൻകൈ എടുക്കുക’ എന്ന അർത്ഥവ്യാപ്തിയുണ്ട്. ‘മുന്നിട്ടുനിൽക്കുക’ പരസ്പരം ആദരിക്കുന്നതിൽ ഉത്സാഹപൂർവം മുൻകൈ എടുക്കുക എന്ന ആശയം നിലനിർത്തുന്നു; മത്സരാത്മകത അനാവശ്യമായി ശക്തിപ്പെടുത്തുന്നില്ല.
theological_decisions:
- issue: προηγούμενοι എന്നതിന്റെ അർത്ഥം
  choice: ആദരിക്കുന്നതിൽ പരസ്പരം മുന്നിട്ടുനിൽക്കുക
  alternative: ആദരത്തിൽ പരസ്പരം മറികടക്കുക / പരസ്പരം മുൻഗണന നൽകുക
  rationale: ഗ്രീക്ക് രൂപം ‘മുൻപോട്ട് നയിക്കുക/മുൻകൈ എടുക്കുക’ എന്നും, സന്ദർഭാനുസൃതമായി ‘മറികടക്കുക’ അല്ലെങ്കിൽ ‘മുൻഗണന നൽകുക’ എന്നും ഗ്രഹിക്കാം. തിരഞ്ഞെടുത്ത രൂപം ഈ തുറന്ന അർത്ഥവ്യാപ്തി കഴിയുന്നത്ര സംരക്ഷിക്കുകയും പരസ്പര ആദരവിലേക്കുള്ള സജീവ ആഹ്വാനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ആജ്ഞാരൂപം ഉപയോഗിച്ചു. ആദ്യ അർധത്തിലെ കുടുംബസ്നേഹത്തിന്റെ ഊഷ്മളതയും രണ്ടാം അർധത്തിലെ പരസ്പര ആദരവിനുള്ള സജീവ മുൻകൈയും സമാന്തരമായി നിലനിർത്തി.
