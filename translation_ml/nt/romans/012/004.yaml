id: ROM.12.4
reference: Romans 12:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: ml
  text: എന്തെന്നാൽ, ഒരു ശരീരത്തിൽ നമുക്ക് അനേകം അവയവങ്ങൾ[a] ഉള്ളതുപോലെ, എല്ലാ അവയവങ്ങൾക്കും ഒരേ പ്രവർത്തനമല്ല[b] ഉള്ളത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘അനേകം ശരീരഭാഗങ്ങൾ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘ഒരേ പ്രവൃത്തി.’ ഗ്രീക്ക് പദത്തിന് പ്രവർത്തനം അല്ലെങ്കിൽ പ്രവൃത്തി എന്ന അർഥങ്ങൾ വരാം; ഇവിടെ ശരീരരൂപകത്തിന് ‘പ്രവർത്തനം’ യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: ഉള്ളതുപോലെ
  rationale: അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ഉപമയുടെ താരതമ്യസ്വഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപത്തെ പ്രബോധനത്തോടുള്ള വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐν ἑνὶ σώματι
  choice: ഒരു ശരീരത്തിൽ
  rationale: സഭയെ ഈ വാക്യത്തിൽത്തന്നെ തുറന്നുപറയാതെ ശരീരരൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: πολλὰ μέλη
  choice: അനേകം അവയവങ്ങൾ
  rationale: μέλη എന്ന ശരീരരൂപകത്തിന് സാധാരണ ആധുനിക മലയാളത്തിൽ യോജിച്ച പദം; ശരീരഭാഗങ്ങൾ എന്ന വിശാലമായ അർഥവും സാധ്യമാണ്.
- source_word: ἔχομεν
  choice: നമുക്ക് ... ഉള്ളത്
  rationale: ഒന്നാംപുരുഷ ബഹുവചനവും വർത്തമാനകാല അർഥവും മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὰ δὲ μέλη πάντα
  choice: എല്ലാ അവയവങ്ങൾക്കും ... അല്ല
  rationale: നിഷേധം ഓരോ അവയവത്തെയും മൊത്തമായി നിഷേധിക്കുന്നതല്ല, അവയ്ക്കെല്ലാം ഒരേ പ്രവർത്തനമില്ല എന്ന അർഥമാണെന്ന് സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὐ τὴν αὐτὴν ἔχει πρᾶξιν
  choice: ഒരേ പ്രവർത്തനം അല്ല ഉള്ളത്
  rationale: πρᾶξις എന്നത് പ്രവർത്തനം, നിർവഹിക്കുന്ന ധർമ്മം എന്നിവ സൂചിപ്പിക്കാം; ശരീരരൂപകത്തിൽ 'പ്രവർത്തനം' സ്വാഭാവികവും ആവശ്യത്തിന് വിശാലവുമാണ്.
theological_decisions:
- issue: ശരീരരൂപകത്തിന്റെ സഭാശാസ്ത്രപരമായ സൂചന
  choice: '''ഒരു ശരീരം'', ''അനേകം അവയവങ്ങൾ'' എന്ന രൂപകം അതേപടി നിലനിർത്തി; ''സഭ'' എന്നു വിശദീകരിച്ചില്ല.'
  alternative: '''ഒരു ശരീരമായ സഭയിൽ'' എന്നു പരാവർത്തനം ചെയ്യുക.'
  rationale: അടുത്ത വാക്യത്തിൽ രൂപകത്തിന്റെ പ്രയോഗം വ്യക്തമാകുന്നുവെങ്കിലും, ഈ വാക്യം ഉപമ മാത്രം അവതരിപ്പിക്കുന്നു. അതിനാൽ പാഠത്തിന്റെ ക്രമവും ദൈവശാസ്ത്രപരമായ സൂക്ഷ്മതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. താരതമ്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ വാക്യാവസാനത്തിലെ അപൂർണത ഉദ്ദേശപൂർവം നിലനിർത്തുന്നു.
