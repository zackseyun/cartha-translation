review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents καθάπερ γάρ («എന്തെന്നാൽ … ഉള്ളതുപോലെ»), the one-body/many-members analogy, and the distributive negation: not every member has the same πρᾶξις. It properly leaves the comparison open for the following verse and does not add an explicit ecclesiological referent.'
  naturalness: The wording is generally clear modern Malayalam. However, «ഒരേ പ്രവർത്തനം[b] അല്ല ഉള്ളത്» is less idiomatic in this construction; «ഒരേ പ്രവർത്തനമല്ല ഉള്ളത്» is the normal, smoother form.
  terminology: «അവയവങ്ങൾ» is an appropriate rendering of μέλη in the body metaphor, and «പ്രവർത്തനം» suitably conveys πρᾶξις here. In the footnote, «ധർമ്മം» can suggest moral/religious duty rather than activity or function, so it should be replaced by a less misleading lexical alternative.
  issues:
  - severity: low
    issue: Minor idiomatic correction in the negated predicate
    rationale: Modern standard Malayalam normally contracts this as «ഒരേ പ്രവർത്തനമല്ല ഉള്ളത്» rather than «ഒരേ പ്രവർത്തനം അല്ല ഉള്ളത്».
  - severity: low
    issue: Footnote alternative «ധർമ്മം» is potentially misleading
    rationale: Although it can occasionally mean assigned function, in contemporary Malayalam it readily evokes duty or moral obligation. «പ്രവൃത്തി» better reflects the lexical range of πρᾶξις without importing that nuance.
  revised_text: എന്തെന്നാൽ, ഒരു ശരീരത്തിൽ നമുക്ക് അനേകം അവയവങ്ങൾ[a] ഉള്ളതുപോലെ, എല്ലാ അവയവങ്ങൾക്കും ഒരേ പ്രവർത്തനമല്ല[b] ഉള്ളത്.
