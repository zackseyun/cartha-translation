id: ROM.12.6
reference: Romans 12:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: ml
  text: നമുക്കു നൽകപ്പെട്ട കൃപയ്ക്കനുസരിച്ച് വ്യത്യസ്ത വരങ്ങൾ നമുക്കുള്ളതിനാൽ, പ്രവചനമാണെങ്കിൽ, വിശ്വാസത്തിന്റെ അനുപാതത്തിൽ[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ഒരുവന്റെ വിശ്വാസത്തിന്റെ അളവനുസരിച്ച്’ എന്നും വിവർത്തനം ചെയ്യാം; മറ്റൊരു സാധ്യത: ‘വിശ്വാസത്തോടു പൊരുത്തപ്പെട്ട്.’ ഗ്രീക്ക് പ്രയോഗം സംസാരിക്കുന്നയാൾക്കു നൽകപ്പെട്ട വിശ്വാസത്തിന്റെ അളവിനെയോ ക്രൈസ്തവ വിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തോടുള്ള പൊരുത്തത്തെയോ സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: നമുക്കുള്ളതിനാൽ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തെ മുൻവാക്യത്തിലെ ചിന്ത തുടരുന്ന സാഹചര്യത്തിൽ സ്വാഭാവികമായ മലയാള കാരണബന്ധമായി അവതരിപ്പിക്കുന്നു; δέ സൂചിപ്പിക്കുന്ന മൃദുവായ തുടർച്ച വേറെ പദമിട്ട് അമിതമായി ഊന്നുന്നില്ല.
- source_word: χαρίσματα
  choice: വരങ്ങൾ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ χάρισμα എന്നതിന് സഭാഭാഷയിലും സാധാരണ ആധുനിക മലയാളത്തിലും വ്യക്തമായ പ്രയോഗം; കൃപയിൽനിന്നുള്ള സ്വഭാവം തുടർന്നുള്ള വാക്യഭാഗം വ്യക്തമാക്കുന്നു.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: നമുക്കു നൽകപ്പെട്ട കൃപയ്ക്കനുസരിച്ച്
  rationale: κατά സൂചിപ്പിക്കുന്ന പൊരുത്തം/മാനദണ്ഡം നിലനിർത്തുകയും ദൈവികമായി നൽകപ്പെട്ട കൃപയെന്ന ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: διάφορα
  choice: വ്യത്യസ്തമായ
  rationale: വരങ്ങളുടെ വൈവിധ്യം നേരിട്ടും ലളിതമായും സൂചിപ്പിക്കുന്നു.
- source_word: εἴτε προφητείαν
  choice: പ്രവചനമാണെങ്കിൽ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അപൂർണ്ണവുമായ പട്ടികാഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: വിശ്വാസത്തിന്റെ അനുപാതത്തിൽ
  rationale: ἀναλογίαയുടെ അനുപാതം/പൊരുത്തം എന്ന വിശാല അർത്ഥവും πίστις സംബന്ധിച്ച വ്യാഖ്യാനസന്ദിഗ്ധതയും മുഖ്യപാഠത്തിൽ പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως എന്നതിന്റെ അർത്ഥം
  choice: വിശ്വാസത്തിന്റെ അനുപാതത്തിൽ
  alternative: ഒരുവന്റെ വിശ്വാസത്തിന്റെ അളവനുസരിച്ച്; അല്ലെങ്കിൽ ക്രൈസ്തവ വിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തോടു പൊരുത്തപ്പെട്ട്
  rationale: ഗ്രീക്ക് പ്രയോഗം പ്രവചിക്കുന്നയാൾക്കു നൽകപ്പെട്ട വിശ്വാസത്തിന്റെ അളവിനെയോ അംഗീകരിക്കപ്പെട്ട വിശ്വാസത്തിന്റെ ഉള്ളടക്കത്തോടുള്ള പൊരുത്തത്തെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഈ യഥാർഥ സന്ദിഗ്ധത തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം 7-ാം വാക്യത്തിലേക്കു തുടരുന്നതിനാൽ അവസാനത്തിൽ അർദ്ധവിരാമം ഉപയോഗിച്ചു. ‘പ്രവചിക്കട്ടെ’ എന്ന ക്രിയ ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന ഉപദേശാത്മക പ്രവർത്തിയെ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; എന്നാൽ വിശ്വാസത്തിന്റെ അർത്ഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
