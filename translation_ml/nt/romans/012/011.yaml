id: ROM.12.11
reference: Romans 12:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: ml
  text: ഉത്സാഹത്തിൽ മടിയരാകരുത്; ആത്മാവിൽ ജ്വലിച്ചുകൊണ്ടിരിക്കുക[a]; കർത്താവിനു സേവനം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പരിശുദ്ധാത്മാവിൽ ജ്വലിച്ചുകൊണ്ടിരിക്കുക”; ഇവിടെ πνεύματι എന്നത് വിശ്വാസിയുടെ ആത്മാവിനെയല്ല, പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത് എന്നു മനസ്സിലാക്കിയാൽ.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: ഉത്സാഹത്തിൽ
  rationale: σπουδή ഇവിടെ ഉത്സുകത, ശുഷ്കാന്തി, ജാഗ്രതയോടെയുള്ള പരിശ്രമം എന്നിവ ഉൾക്കൊള്ളുന്നു. ὀκνηροί എന്നതുമായുള്ള വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായതിനാൽ ‘ഉത്സാഹത്തിൽ’ തിരഞ്ഞെടുത്തു.
- source_word: ὀκνηροί
  choice: മടിയരാകരുത്
  rationale: ഈ പദം മന്ദതയെയും വിമുഖതയെയും സൂചിപ്പിക്കുന്നു. ‘മടിയരാകരുത്’ എന്നത് പ്രായോഗികമായ ആഹ്വാനം വ്യക്തമായും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: πνεύματι
  choice: ആത്മാവിൽ
  rationale: ആർട്ടിക്കിൾ ഇല്ലാത്ത ഈ ദത്തിവിഭക്തിരൂപം മനുഷ്യന്റെ ആത്മാവിനെയോ പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കാം. പ്രധാന പാഠത്തിൽ ‘ആത്മാവിൽ’ എന്നു നൽകി ഗ്രീക്കിലെ സംക്ഷിപ്തതയും അവ്യക്തതയും കഴിയുന്നത്ര നിലനിർത്തുന്നു; പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന വായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ζέοντες
  choice: ജ്വലിക്കുന്നവരായിരിക്കുക
  rationale: അക്ഷരാർഥത്തിൽ ‘തിളച്ചുകൊണ്ടിരിക്കുക’ എന്ന ആശയമുള്ള ഈ പദം ഇവിടെ തീക്ഷ്ണതയ്ക്കുള്ള രൂപകമാണ്. ‘ജ്വലിക്കുന്നവരായിരിക്കുക’ അതിന്റെ സജീവമായ രൂപകബലം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവിനെ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ κύριος എന്ന സ്ഥാനപ്പേരിന് പതിവായ മലയാളരൂപം ‘കർത്താവ്’ ആണ്. മലയാളത്തിലെ ക്രിയാസംയോജനത്തിന് അനുസരിച്ച് കർമരൂപം ഉപയോഗിച്ചു.
- source_word: δουλεύοντες
  choice: സേവിക്കുക
  rationale: δουλεύω അടിമസേവനത്തിന്റെ പശ്ചാത്തലമുള്ള പദമാണെങ്കിലും, കർത്താവിനോടുള്ള സമർപ്പണവും അനുസരണവും ആവശ്യപ്പെടുന്ന ഈ പ്രബോധനത്തിൽ ‘സേവിക്കുക’ എന്നതാണ് സ്വാഭാവികവും അർഥസമ്പന്നവും.
theological_decisions:
- issue: τῷ πνεύματι ζέοντες എന്നതിലെ πνεύματι ആരെ/എന്തിനെ സൂചിപ്പിക്കുന്നു
  choice: വിശ്വാസിയുടെ ആത്മാവ് അഥവാ ആന്തരിക മനോഭാവം
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: സമാന്തരമായ പ്രബോധനങ്ങളുടെ ഉടൻപിന്നിലുള്ള സന്ദർഭത്തിൽ, വിശ്വാസിയുടെ ആത്മാവിൽ തീക്ഷ്ണത പുലർത്തുക എന്ന വായന സ്വാഭാവികമാണ്. എങ്കിലും ഗ്രീക്ക് പദപ്രയോഗം പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന വായനയെ നിർണായകമായി ഒഴിവാക്കുന്നില്ല; അതിനാൽ ആ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളം. ഗ്രീക്കിലെ മൂന്ന് സമാന്തര പ്രബോധനങ്ങളുടെ ചുരുക്കവും താളവും അർധവിരാമങ്ങളിലൂടെ നിലനിർത്തി; പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
