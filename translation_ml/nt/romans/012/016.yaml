id: ROM.12.16
reference: Romans 12:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: ml
  text: പരസ്പരം ഒരേ മനോഭാവം പുലർത്തുക; ഉന്നതമായ കാര്യങ്ങളിൽ മനസ്സുവെക്കാതെ[a], എളിയവരോടൊപ്പം ചേർന്നുനടക്കുക[b]. സ്വന്തം കാഴ്ചയിൽ ജ്ഞാനികളായിത്തീരരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഉന്നതമായ കാര്യങ്ങൾ മോഹിക്കരുത്” അല്ലെങ്കിൽ “അഹങ്കരിക്കരുത്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “താഴ്മയുള്ള കാര്യങ്ങളോടു ചേർന്നുപോകുക.” ഗ്രീക്ക് പദം എളിയവരെയോ താഴ്മയുള്ളവരെയോ, അല്ലെങ്കിൽ താഴ്മയുള്ള കാര്യങ്ങളെയോ സാഹചര്യങ്ങളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: പരസ്പരം ഒരേ മനോഭാവം പുലർത്തുക
  rationale: ഈ പ്രയോഗം എല്ലാവരും ഒരേ അഭിപ്രായം ചിന്തിക്കണം എന്നതിലുപരി, സമൂഹത്തിനുള്ളിലെ പരസ്പര ഐക്യവും ഒരേ മനോഭാവവും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായ ആ ബന്ധപരമായ അർഥം ഈ പരിഭാഷ നൽകുന്നു.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: ഉന്നതമായ കാര്യങ്ങളിൽ മനസ്സുവെക്കാതെ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഉയർന്ന കാര്യങ്ങൾ ചിന്തിക്കാതെ’ എന്ന ദൃശ്യഭാഷ നിലനിർത്തുകയും, അഹങ്കാരത്തെയും ഉയർന്ന പദവി അല്ലെങ്കിൽ കാര്യങ്ങൾ തേടുന്നതിനെയും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം തുറന്നുവെക്കുകയും ചെയ്യുന്നു.
- source_word: τοῖς ταπεινοῖς
  choice: എളിയവരോടൊപ്പം
  rationale: പ്രധാനവാചകത്തിൽ സാമൂഹികമായി എളിയവരെയോ താഴ്മയുള്ളവരെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക വായന സ്വീകരിക്കുന്നു; ഗ്രീക്കിൽ താഴ്ന്ന കാര്യങ്ങൾ എന്ന അർഥവും സാധ്യമായതിനാൽ അത് അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: συναπαγόμενοι
  choice: ചേർന്നുനടക്കുക
  rationale: ‘കൂടെ നയിക്കപ്പെടുക/കൊണ്ടുപോകപ്പെടുക’ എന്ന ക്രിയയുടെ സജീവമായ ഭാവം ഭാഗികമായി നിലനിർത്തിക്കൊണ്ട്, എളിയവരുമായി അടുത്ത് ഇടപഴകുകയും അവരുടെ കൂട്ടത്തിൽ ചേരുകയും ചെയ്യുക എന്ന സന്ദർഭാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: സ്വന്തം കാഴ്ചയിൽ ജ്ഞാനികളായിത്തീരരുത്
  rationale: γίνεσθε എന്നതിലെ ‘ആയിത്തീരുക’ എന്ന പ്രക്രിയാഭാവവും, സ്വന്തം വിലയിരുത്തലിൽ ജ്ഞാനിയെന്നു കരുതുന്ന ആത്മാഭിമാനത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὰ ὑψηλά, τοῖς ταπεινοῖς എന്നീ പ്രയോഗങ്ങളുടെ സാമൂഹികവും മനോഭാവപരവുമായ അർഥവ്യാപ്തി
  choice: ഉന്നതമായ കാര്യങ്ങളിൽ മനസ്സുവെക്കാതെ, എളിയവരോടൊപ്പം ചേർന്നുനടക്കുക
  alternative: അഹങ്കരിക്കാതെ, താഴ്മയുള്ള കാര്യങ്ങളിൽ മനസ്സുവെക്കുക
  rationale: പൗലോസിന്റെ വാക്കുകൾക്ക് അഹങ്കാരം ഒഴിവാക്കുക, ഉയർന്ന സാമൂഹിക നില തേടാതിരിക്കുക, എളിയവരോടു ചേരുക, താഴ്മയുള്ള കാര്യങ്ങൾ സ്വീകരിക്കുക എന്നീ പരസ്പരം ബന്ധമുള്ള അർഥങ്ങൾ ഉണ്ടാകാം. പ്രധാനവാചകവും അടിക്കുറിപ്പുകളും ചേർന്ന് ഈ ഉദ്ദേശ്യപൂർവമായ അർഥവ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള പ്രബോധനശൈലി. ‘ഒരേ മനോഭാവം,’ ‘ചേർന്നുനടക്കുക,’ ‘സ്വന്തം കാഴ്ചയിൽ’ എന്നീ പ്രയോഗങ്ങൾ സ്വാഭാവികതയും മൂലപാഠസാന്നിധ്യവും തമ്മിൽ തുലനം ചെയ്യുന്നു.
