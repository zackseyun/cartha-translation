id: ROM.12.3
reference: Romans 12:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: ml
  text: 'എനിക്കു ലഭിച്ച കൃപയാൽ നിങ്ങളിൽ ഓരോരുത്തരോടും ഞാൻ പറയുന്നു: സ്വയം ചിന്തിക്കേണ്ടതിലുമധികം ഉന്നതനായി കരുതാതെ, വിവേകത്തോടെ ചിന്തിക്കണം.[a] ദൈവം ഓരോരുത്തർക്കും വിശ്വാസത്തിന്റെ ഒരു അളവ് വിഭജിച്ചുനൽകിയിരിക്കുന്നതനുസരിച്ചാണ്.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “സുബോധമുള്ളവരായിരിക്കേണ്ടവിധം ചിന്തിക്കണം.”'
    reason: lexical_alternative
  - marker: b
    text: “വിശ്വാസത്തിന്റെ ഒരു അളവ്” എന്നതിന് “വിശ്വാസത്തിന്റെ അളവുകോൽ” എന്നോ, സാധ്യതയായി “വിശ്വാസത്തിന്റെ/വിശ്വസ്തതയുടെ ഒരു അളവ്” എന്നോ അർത്ഥമാകാം. വിശ്വാസവുമായി ബന്ധപ്പെട്ട ദൈവദത്തമായ ഒരു അളവിനെയാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; അതിന്റെ കൃത്യമായ ഭാവം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: എനിക്കു ലഭിച്ച കൃപയാൽ
  rationale: διά + genitive ഇവിടെ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; പൗലൊസിന് ലഭിച്ച ദൈവകൃപയും അതോടു ബന്ധപ്പെട്ട ദൗത്യാധികാരവും അനാവശ്യമായി വികസിപ്പിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: നിങ്ങളിൽ ഓരോരുത്തരോടും
  rationale: സഭാസമൂഹത്തിനുള്ളിലെ ഓരോ വ്യക്തിയെയും അഭിസംബോധന ചെയ്യുന്ന distributive force വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: ഒരാൾ തന്നെക്കുറിച്ച് ചിന്തിക്കേണ്ടതിലധികം ഉയർന്നതായി ചിന്തിക്കാതെ
  rationale: ὑπερφρονέω എന്നതിലെ അതിരുകടന്ന സ്വയംവിലയിരുത്തലും ആവർത്തിക്കുന്ന φρονέω എന്ന ചിന്താ-രൂപകവും കഴിയുന്നത്ര നിലനിർത്തുന്നു. മലയാളത്തിൽ അർത്ഥം വ്യക്തമാക്കാൻ പ്രതിഫലനാർഥമായ ‘തന്നെക്കുറിച്ച്’ ചേർത്തിരിക്കുന്നു.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: സുബോധത്തോടെ ചിന്തിക്കട്ടെ
  rationale: σωφρονέωയിലെ വിവേകം, സമചിത്തത, ആത്മനിയന്ത്രിതമായ വിലയിരുത്തൽ എന്നീ ഭാവങ്ങൾ സംക്ഷിപ്തവും ആധുനികവുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: ἐμέρισεν
  choice: പങ്കിട്ടുകൊടുത്തത്
  rationale: μερίζωയുടെ വിതരണം/വിഭജിച്ചുനൽകൽ എന്ന അർത്ഥം ദൈവത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ പങ്കുവെക്കലായി വ്യക്തമാക്കുന്നു.
- source_word: μέτρον πίστεως
  choice: വിശ്വാസത്തിന്റെ ഒരു അളവ്
  rationale: അനിർദ്ദിഷ്ടമായ μέτρον കാരണം ‘ഒരു അളവ്’ എന്നു നൽകി, πίστις എന്നതിന് അടിസ്ഥാന തിരഞ്ഞെടുപ്പായ ‘വിശ്വാസം’ നിലനിർത്തുന്നു; ഈ അളവ് വിശ്വാസത്തിന്റെ അളവോ വിശ്വാസവുമായി ബന്ധപ്പെട്ട ദൈവദത്ത പങ്കോ എന്നത് നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
theological_decisions:
- issue: μέτρον πίστεως എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം
  choice: ‘വിശ്വാസത്തിന്റെ ഒരു അളവ്’ എന്ന വിശാലവും വ്യാഖ്യാനപരമായി തുറന്നതുമായ രൂപം
  alternative: ‘വിശ്വാസമെന്ന അളവുകോൽ’, ‘വിശ്വസിക്കാനുള്ള ഒരു അളവ്’, അല്ലെങ്കിൽ ‘വിശ്വസ്തതയുടെ ഒരു അളവ്’
  rationale: തുടർന്നുള്ള വാക്യങ്ങൾ വ്യത്യസ്ത വരങ്ങളെക്കുറിച്ചായതിനാൽ ശുശ്രൂഷയ്ക്കുള്ള ദൈവദത്ത ശേഷി എന്ന സൂചന ഉണ്ടാകാം; എങ്കിലും ഗ്രീക്ക് പ്രയോഗം രക്ഷാകരവിശ്വാസം, ശുശ്രൂഷാശേഷി, വിശ്വാസത്തിന്റെ മാനദണ്ഡം എന്നിവയിൽ ഒന്നിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ theological tension നിലനിർത്തുന്നു.
- issue: സ്വയംവിലയിരുത്തലും σωφρονεῖν എന്നതും തമ്മിലുള്ള ബന്ധം
  choice: അഹങ്കാരപരമായ സ്വയംവിലയിരുത്തലിന് പകരം സുബോധമുള്ള ചിന്ത
  alternative: ‘ചിത്തസംയമനമുള്ളവനാകേണ്ടതിന് ചിന്തിക്കുക’
  rationale: ഗ്രീക്കിലെ φρονεῖν/σωφρονεῖν പദപ്രയോഗം മലയാളത്തിൽ പൂർണമായി പുനരാവർത്തിക്കാൻ കഴിയാത്തതിനാൽ, ബൗദ്ധികവും നൈതികവുമായ സമതുലിത വിലയിരുത്തൽ വ്യക്തമാക്കുന്ന രൂപം തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. മൂലത്തിലെ ‘ചിന്തിക്കുക’ എന്ന ആവർത്തനം ഭാഗികമായി നിലനിർത്തി. [a], [b] എന്നീ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
