id: ROM.12.2
reference: Romans 12:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: ml
  text: ഈ യുഗത്തിന്[a] അനുരൂപരാകരുത്; പകരം, നിങ്ങളുടെ മനസ്സിന്റെ നവീകരണത്തിലൂടെ രൂപാന്തരപ്പെടുക. അങ്ങനെ ദൈവത്തിന്റെ ഹിതം—നല്ലതും പ്രസാദകരവും[c] പരിപൂർണവുമായ ആ ഹിതം—എന്താണെന്ന് നിങ്ങൾക്കു വിവേചിച്ചറിയാൻ കഴിയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഈ ലോകത്തിന്.” ഗ്രീക്ക് αἰών കൂടുതൽ കൃത്യമായി “യുഗം” എന്നാണ്; ഇവിടെ അത് ഇപ്പോഴത്തെ ക്രമത്തെയോ കാലഘട്ടത്തെയോ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അല്ലെങ്കിൽ: “ദൈവത്തിന്റെ ഹിതം എന്താണെന്ന് നിങ്ങൾ പരിശോധിച്ച് അംഗീകരിക്കാൻ.” ഗ്രീക്ക് ക്രിയയിൽ പരിശോധിക്കുന്നതും അംഗീകാരയോഗ്യമായത് തിരിച്ചറിയുന്നതും ഉൾപ്പെടാം.'
    reason: lexical_alternative
  - marker: c
    text: “പ്രസാദകരം” എന്നത് ദൈവത്തിനു പ്രസാദകരം എന്നായിരിക്കാം; “സ്വീകാര്യം” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: അനുരൂപരാകരുത്
  rationale: ബാഹ്യമായ ഒരു മാതൃകയോട് ഒത്തുപോകുന്നതിനെ വിലക്കുന്ന വർത്തമാനകാല കർമണി/മധ്യമ ആജ്ഞയുടെ ഭാവം നിലനിർത്തുന്നു; μεταμορφοῦσθε എന്നതുമായുള്ള വൈരുധ്യവും വ്യക്തമാണ്.
- source_word: αἰῶνι τούτῳ
  choice: ഈ യുഗത്തിന്
  rationale: αἰών സൃഷ്ടലോകത്തെയല്ല, ഇപ്പോഴത്തെ കാലഘട്ടത്തെയും അതിന്റെ ക്രമത്തെയും സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘ലോകം’ എന്നതിനെക്കാൾ ‘യുഗം’ കൃത്യമാണ്.
- source_word: μεταμορφοῦσθε
  choice: രൂപാന്തരപ്പെടുക
  rationale: രൂപത്തിലോ അവസ്ഥയിലോ സംഭവിക്കുന്ന ആഴമുള്ള മാറ്റം വ്യക്തമാക്കുകയും ബാഹ്യമായ അനുരൂപപ്പെടലുമായുള്ള വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀνακαινώσει
  choice: നവീകരണത്തിലൂടെ
  rationale: കരണാർഥക ദത്തിവ് സൂചിപ്പിക്കുന്ന, പരിവർത്തനം സംഭവിക്കുന്ന മാർഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: νοός
  choice: നിങ്ങളുടെ മനസ്സിന്റെ
  rationale: മൂലപാഠത്തിൽ ഉടമസ്ഥസർവനാമം പ്രകടമല്ലെങ്കിലും ബഹുവചന അഭിസംബോധനയും മലയാളപ്രയോഗവും ഇതിനെ ന്യായീകരിക്കുന്നു; νοῦς ഇവിടെ നൈതികവും ആത്മീയവുമായ വിവേചനശേഷിയുള്ള മനസ്സാണ്.
- source_word: εἰς τὸ δοκιμάζειν
  choice: അങ്ങനെ ... വിവേചിച്ചറിയാൻ കഴിയും
  rationale: ഉദ്ദേശ്യം/ഫലം വ്യക്തമാക്കുന്ന ഘടന സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; δοκιμάζω-യിലെ പരിശോധിക്കൽ, അംഗീകരിക്കൽ എന്നീ ഭാവങ്ങൾ ‘വിവേചിച്ചറിയുക’ എന്നതിൽ സംക്ഷിപ്തമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ഹിതം ... എന്താണെന്ന്
  rationale: τί എന്ന ചോദനസ്വഭാവവും θεοῦ എന്ന ജനിറ്റീവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἀγαθὸν
  choice: നല്ലത്
  rationale: ദൈവഹിതത്തിന്റെ സ്വഭാവം വിവരിക്കുന്ന ത്രയത്തിലെ നേരിട്ടും സ്വാഭാവികവുമായ പദമാണ്.
- source_word: εὐάρεστον
  choice: പ്രസാദകരം
  rationale: ആർക്കു പ്രസാദകരമെന്നത് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ തുറന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: τέλειον
  choice: പരിപൂർണം
  rationale: ദൈവഹിതത്തെ വിശേഷിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ ‘പരിപൂർണം’ സ്വാഭാവികവും τέλειος എന്ന പദത്തിന്റെ പൂർണതാഭാവം നിലനിർത്തുന്നതുമാണ്.
theological_decisions:
- issue: നൈതിക വൈരുധ്യത്തിൽ αἰών എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ഈ യുഗം
  alternative: ഈ ലോകം; ഇപ്പോഴത്തെ ലോകക്രമം
  rationale: ‘യുഗം’ എന്നത് സൃഷ്ടലോകത്തെ തള്ളിപ്പറയുന്ന ആശയം വരുത്താതെ, ഇപ്പോഴത്തെ കാലഘട്ടത്തിന്റെയും അതിന്റെ നൈതികക്രമത്തിന്റെയും പശ്ചാത്തലം നിലനിർത്തുന്നു.
- issue: ദൈവഹിതത്തോടുള്ള ബന്ധത്തിൽ δοκιμάζειν എന്നതിന്റെ ശക്തി
  choice: വിവേചിച്ചറിയുക
  alternative: പരിശോധിക്കുക; പരിശോധിച്ച് അംഗീകരിക്കുക
  rationale: മനുഷ്യൻ ദൈവഹിതത്തെ വിധിക്കുന്നു എന്ന ധ്വനി ഒഴിവാക്കുമ്പോഴും, പുതുക്കപ്പെട്ട മനസ്സ് അതിനെ പരിശോധിച്ച് നല്ലതെന്നു തിരിച്ചറിയുകയും അംഗീകരിക്കുകയും ചെയ്യുന്നു എന്ന അർഥപരിധി തുറന്നുവെക്കുന്നു.
- issue: εὐάρεστον ആർക്കു പ്രസാദകരം എന്ന ചോദ്യം
  choice: മുഖ്യപാഠത്തിൽ കർമവിഷയം വ്യക്തമാക്കാതെ ‘പ്രസാദകരം’ എന്നു നിലനിർത്തി
  alternative: ദൈവത്തിനു പ്രസാദകരം; സ്വീകാര്യം
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിനു പ്രസാദകരം എന്ന വായന സാധ്യമാണെങ്കിലും ഗ്രീക്ക് അത് തുറന്നുപറയുന്നില്ല; അതിനാൽ വ്യാഖ്യാനപരമായ നിർണ്ണയം അടിക്കുറിപ്പിലേക്കു മാറ്റി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി സ്വീകരിച്ചു. ബഹുവചന അഭിസംബോധന നിലനിർത്തുന്നു. ‘അനുരൂപരാകരുത്/രൂപാന്തരപ്പെടുക’ എന്ന സമാന്തരവൈരുധ്യം ഗ്രീക്ക് ക്രിയകളുടെ ബന്ധം പ്രകടമാക്കുന്നു; അവസാനത്തെ മൂന്ന് വിശേഷണങ്ങൾ ദൈവഹിതത്തോടുള്ള സമാനാധികരണമായി ഡാഷുകൾക്കുള്ളിൽ സൂക്ഷിച്ചു.
