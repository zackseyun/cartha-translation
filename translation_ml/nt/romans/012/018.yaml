id: ROM.12.18
reference: Romans 12:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: ml
  text: സാധ്യമെങ്കിൽ[a], നിങ്ങളാൽ കഴിയുന്നിടത്തോളം, എല്ലാവരോടും സമാധാനത്തോടെ ജീവിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘അതു സാധ്യമാണെങ്കിൽ, നിങ്ങളുടെ ഭാഗത്തുനിന്ന്, എല്ലാവരോടും സമാധാനത്തിലായിരിക്കുക.’'
    reason: മൂലത്തിലെ വ്യവസ്ഥയും ‘നിങ്ങളുടെ ഭാഗത്തുനിന്ന്’ എന്ന ഉത്തരവാദിത്വപരിധിയും കൂടുതൽ രൂപസാദൃശ്യമോടെ നൽകുന്ന മറ്റൊരു വിവർത്തനം.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: സാധ്യമെങ്കിൽ
  rationale: സമാധാനം എല്ലായ്പോഴും കൈവരിക്കാനാകുമെന്ന ഉറപ്പല്ല, യാഥാർഥ്യബോധമുള്ള ഒരു വ്യവസ്ഥയാണ് ഈ പ്രയോഗം നൽകുന്നത്; മലയാളത്തിൽ ഇത് സ്വാഭാവികവും സംക്ഷിപ്തവുമാണ്.
- source_word: τὸ ἐξ ὑμῶν
  choice: നിങ്ങളാൽ കഴിയുന്നിടത്തോളം
  rationale: വായനക്കാരുടെ കഴിവിലും ഉത്തരവാദിത്വത്തിലും ഉൾപ്പെടുന്ന പരിധിയെ ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു; ഫലം മുഴുവനായും അവരുടെ നിയന്ത്രണത്തിലാണെന്ന ധാരണ ഒഴിവാക്കുന്നു.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: എല്ലാവരോടും
  rationale: ἄνθρωποι ഇവിടെ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, സകല മനുഷ്യരെയും ഉൾക്കൊള്ളുന്നതാണ്; ‘എല്ലാവരോടും’ എന്നത് ആ സർവവ്യാപക അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰρηνεύοντες
  choice: സമാധാനത്തോടെ ജീവിക്കുക
  rationale: വർത്തമാനകാല പങ്കാളിത്തരൂപം സന്ദർഭത്തിൽ പ്രബോധനാത്മകമായി പ്രവർത്തിക്കുകയും തുടർച്ചയായ ജീവിതരീതിയെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു; ഈ മലയാളപ്രയോഗം അതു വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: സമാധാനത്തിനുള്ള പ്രബോധനത്തിന്റെ വ്യാപ്തിയും പരിധിയും
  choice: എല്ലാവരോടും സമാധാനം പുലർത്താൻ വിശ്വാസികളെ ആഹ്വാനം ചെയ്യുന്നു; എന്നാൽ അവരുടെ ഉത്തരവാദിത്വം അവരാൽ കഴിയുന്ന പരിധിക്കുള്ളിലാണെന്ന് വ്യക്തമാക്കുന്നു.
  alternative: സമാധാനം യാതൊരു വ്യവസ്ഥയുമില്ലാതെ നിർബന്ധമായും കൈവരിക്കണമെന്നോ, വിശ്വാസികൾ ശരിയായി പ്രവർത്തിച്ചാൽ അത് എപ്പോഴും കൈവരുമെന്നോ വായിക്കുക.
  rationale: εἰ δυνατόν, τὸ ἐξ ὑμῶν എന്നീ രണ്ടു നിയന്ത്രകപ്രയോഗങ്ങളും ചേർന്ന് ആഹ്വാനത്തിന്റെ സർവവ്യാപകത നിലനിർത്തുമ്പോൾ ഫലത്തിന്മേലുള്ള വ്യക്തിയുടെ നിയന്ത്രണപരിധിയും അംഗീകരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രബോധനശൈലി. ‘സമാധാനത്തോടെ ജീവിക്കുക’ തുടർച്ചയായ ജീവിതരീതിയെ പ്രകടിപ്പിക്കുന്നു; ‘നിങ്ങളാൽ കഴിയുന്നിടത്തോളം’ വ്യക്തിയുടെ ഉത്തരവാദിത്വപരിധി വ്യക്തമാക്കുന്നു.
