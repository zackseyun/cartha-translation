id: ROM.12.19
reference: Romans 12:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: ml
  text: 'പ്രിയരേ, നിങ്ങൾതന്നെ പ്രതികാരം ചെയ്യരുത്; പകരം ക്രോധത്തിന് ഇടം കൊടുക്കുക[a]. എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “പ്രതികാരം എനിക്കുള്ളതാണ്; ഞാൻ പകരം വീട്ടും,” എന്ന് കർത്താവ് അരുളിച്ചെയ്യുന്നു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രോധത്തിന് ഇടം വിട്ടുകൊടുക്കുക.” തുടർന്നുള്ള ഉദ്ധരണിയുടെ വെളിച്ചത്തിൽ ഇവിടെ ഉദ്ദേശിക്കുന്നത് ദൈവത്തിന്റെ ക്രോധമാകാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ‘ഞാൻ പകരം വീട്ടും’ എന്നതിന് ന്യായവിധിയനുസരിച്ച് തിരിച്ചടയ്ക്കും എന്ന അർഥമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: നിങ്ങൾതന്നെ പ്രതികാരം ചെയ്യരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകർത്തൃവാചക കൃദന്തം സന്ദർഭത്തിൽ ആജ്ഞാർഥമായി പ്രവർത്തിക്കുന്നു. ‘നിങ്ങൾതന്നെ’ എന്നത് ἑαυτούς എന്ന ആത്മനിർദ്ദേശത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘പ്രതികാരം ചെയ്യരുത്’ എന്നത് ἐκδικέωയുടെ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἀγαπητοί
  choice: പ്രിയരേ
  rationale: സ്നേഹപൂർവമായ സംബോധനവും അതിന്റെ ഗൗരവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: പകരം ക്രോധത്തിന് ഇടം കൊടുക്കുക
  rationale: δότε τόπον എന്ന ‘ഇടം കൊടുക്കുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു. τῇ ὀργῇയെ ‘ക്രോധത്തിന്’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, അത് ദൈവത്തിന്റെ ക്രോധമാണെന്ന് മുഖ്യപാഠത്തിൽ തുറന്നുചേർക്കാതെ ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: γέγραπται γάρ
  choice: എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സ്ഥിരപ്രയോഗത്തെ വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; perfect passive സൂചിപ്പിക്കുന്ന നിലനിൽക്കുന്ന എഴുത്തിന്റെ ഭാവവും ഇതിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: പ്രതികാരം എനിക്കുള്ളത്
  rationale: ദത്തിവ്യാകരണത്തിലൂടെ പ്രകടമാകുന്ന അവകാശം നേരിട്ട് നൽകുന്നു. ‘പ്രതികാരം എന്റേത്’ എന്നതും സാധ്യമെങ്കിലും ‘എനിക്കുള്ളത്’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἐγὼ ἀνταποδώσω
  choice: ഞാൻ പകരം നൽകും
  rationale: ἀνταποδίδωμι എന്നതിലെ തിരിച്ചുനൽകൽ/പ്രതിഫലം നൽകൽ എന്ന ന്യായവിധിസംബന്ധമായ ആശയം നിലനിർത്തുന്നു. സന്ദർഭം ശിക്ഷയിൽ മാത്രം ചുരുക്കാതെ ഉറവിടത്തിലെ പൊതുവായ പ്രത്യുപകാരഭാവം സംരക്ഷിക്കുന്നു.
- source_word: λέγει κύριος
  choice: എന്ന് കർത്താവ് അരുളിച്ചെയ്യുന്നു
  rationale: κύριοςയെ ‘കർത്താവ്’ എന്നു നൽകുന്നു. തിരുവെഴുത്തിലെ ദൈവിക പ്രഖ്യാപനത്തിന് യോജിച്ച ഗൗരവമുള്ള ഉദ്ധരണിസൂത്രമാണ് ‘അരുളിച്ചെയ്യുന്നു’.
theological_decisions:
- issue: τῇ ὀργῇയിലെ ‘ക്രോധം’ ആരുടേതാണ്?
  choice: മുഖ്യപാഠത്തിൽ ‘ക്രോധത്തിന്’ എന്ന സംക്ഷിപ്ത രൂപം നിലനിർത്തി; തുടർന്നുള്ള ഉദ്ധരണിയുടെ വെളിച്ചത്തിൽ അത് ദൈവത്തിന്റെ ക്രോധമാകാനാണ് കൂടുതൽ സാധ്യതയെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘ദൈവത്തിന്റെ ക്രോധത്തിന് ഇടം കൊടുക്കുക’ എന്ന് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ മനുഷ്യക്രോധത്തെ പൊതുവായി സൂചിപ്പിക്കുന്നതായി വായിക്കുക.
  rationale: ആവർത്തനം 32:35-ലെ ദൈവിക പ്രതികാരാവകാശത്തെക്കുറിച്ചുള്ള ഉടൻതുടരുന്ന ഉദ്ധരണി ദൈവത്തിന്റെ ക്രോധത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഗ്രീക്കിൽ θεοῦ ഇല്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘ദൈവത്തിന്റെ’ എന്നു ചേർക്കുന്നത് ഉറവിടത്തിലെ പരോക്ഷത തീർപ്പാക്കും.
- issue: Ἐμοὶ ἐκδίκησις എന്നതിലെ ദൈവിക അവകാശം
  choice: ‘പ്രതികാരം എനിക്കുള്ളത്’
  alternative: ‘പ്രതികാരം എന്റേത്’
  rationale: രണ്ടു രൂപങ്ങളും ദൈവത്തിനുള്ള ന്യായവിധിയുടെ പ്രത്യേക അവകാശം പ്രകടിപ്പിക്കുന്നു. തിരഞ്ഞെടുത്ത രൂപം ദത്തിവ്യാകരണത്തിന്റെ കൈവശം/അവകാശഭാവം വ്യക്തമായി നൽകുന്നു; ഏതെങ്കിലും പ്രത്യേക ശിക്ഷാസിദ്ധാന്തം അധികമായി ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പ്രിയരേ’, ‘കർത്താവ്’, ‘അരുളിച്ചെയ്യുന്നു’ എന്നിവ സ്നേഹപൂർവമായ സംബോധനവും തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഔന്നത്യവും നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും [a], [b] എന്നിങ്ങനെ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
