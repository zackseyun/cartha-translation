id: ROM.12.12
reference: Romans 12:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: ml
  text: പ്രത്യാശയിൽ സന്തോഷിക്കുവിൻ; കഷ്ടതയിൽ[a] സഹിച്ചുനിൽക്കുവിൻ; പ്രാർഥനയിൽ സ്ഥിരമായി തുടരുവിൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കഷ്ടത’ എന്നതിനുപകരം ‘ക്ലേശം’ എന്നും പരിഭാഷപ്പെടുത്താം; θλῖψις കടുത്ത സമ്മർദം, ദുരിതം, അല്ലെങ്കിൽ പീഡനം എന്നിവയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘സ്ഥിരമായി തുടരുവിൻ’ എന്നതിനുപകരം ‘ഉറച്ച സമർപ്പണത്തോടെ തുടരുവിൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; προσκαρτερέω വെറും തുടർച്ചയേക്കാൾ ദൃഢമായ സമർപ്പണത്തിന് ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: ἐλπίς പ്രത്യാശയെയോ പ്രതീക്ഷയെയോ സൂചിപ്പിക്കുന്നു. ഇവിടെ ദത്തിവ് സ്വാഭാവികമായി ‘പ്രത്യാശയിൽ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: χαίροντες
  choice: സന്തോഷിക്കുവിൻ
  rationale: വർത്തമാനകാല കർത്തൃവാചക കൃദന്തമാണെങ്കിലും, ഈ പ്രബോധനപരമ്പരയുടെ ആഹ്വാനസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ ആജ്ഞാരൂപംകൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: θλίψει
  choice: കഷ്ടതയിൽ
  rationale: θλῖψις സമ്മർദം, ദുരിതം, ക്ലേശം എന്നിവ ഉൾക്കൊള്ളുന്നു. ‘കഷ്ടത’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും അർത്ഥഭാരം നിലനിർത്തുന്നതുമാണ്.
- source_word: ὑπομένοντες
  choice: സഹിച്ചുനിൽക്കുവിൻ
  rationale: ὑπομένω പ്രയാസത്തിനിടയിൽ ഉറച്ചുനിന്ന് സഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘സഹിച്ചുനിൽക്കുക’ ഈ സ്ഥിരതയും സഹനവും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: προσευχῇ
  choice: പ്രാർഥനയിൽ
  rationale: προσευχή ഇവിടെ പൊതുവായി പ്രാർഥനയെ സൂചിപ്പിക്കുന്നു; ‘പ്രാർഥനയിൽ’ സ്വാഭാവികമായ ദത്തിവ് പ്രയോഗമാണ്.
- source_word: προσκαρτεροῦντες
  choice: സ്ഥിരമായി തുടരുവിൻ
  rationale: προσκαρτερέω ഒരു കാര്യത്തിൽ ഉറച്ച സമർപ്പണത്തോടെ തുടർന്നുനിൽക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘സ്ഥിരമായി തുടരുക’ തുടർച്ചയുടെയും ദൃഢതയുടെയും ആശയം നിലനിർത്തുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ സമാന്തര കൃദന്തരൂപങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികവും പ്രബോധനപരവുമായ മൂന്ന് ആജ്ഞാരൂപങ്ങളായി നൽകിയിരിക്കുന്നു. ചുരുങ്ങിയ ത്രിഭാഗഘടനയും ആശയസമാന്തര്യവും നിലനിർത്തിയിട്ടുണ്ട്.
