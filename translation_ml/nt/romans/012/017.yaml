id: ROM.12.17
reference: Romans 12:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: ml
  text: ആരോടും തിന്മയ്ക്കു പകരം തിന്മ തിരിച്ചുചെയ്യരുത്; എല്ലാവരുടെയും ദൃഷ്ടിയിൽ നല്ല കാര്യങ്ങളെക്കുറിച്ചു മുൻകൂട്ടി ചിന്തിക്കുക.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാന്യമായ കാര്യങ്ങൾ’ അല്ലെങ്കിൽ ‘ശ്രേഷ്ഠമായ കാര്യങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: ആരോടും … ചെയ്യരുത്
  rationale: μηδενί എന്ന ദത്തിവിഭക്തിരൂപം ἀποδιδόντες എന്ന ക്രിയയുടെ പരോക്ഷകർമമാണ്. നിഷേധക്രിയയോടൊപ്പം ‘ആരോടും’ ഉപയോഗിക്കുന്നത് അതിന്റെ സാർവത്രിക വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: തിന്മയ്ക്കു പകരം തിന്മ
  rationale: κακόν എന്നതിന്റെ ധാർമിക ഗൗരവം ‘തിന്മ’ നിലനിർത്തുന്നു; ἀντί ഇവിടെ പ്രതികാരപരമായ കൈമാറ്റം, അഥവാ ‘പകരം’, സൂചിപ്പിക്കുന്നു.
- source_word: ἀποδιδόντες
  choice: ചെയ്യരുത്
  rationale: വാക്യസന്ദർഭത്തിൽ ഈ വർത്തമാന കൃദന്തരൂപത്തിന് പ്രബോധനാത്മകമായ ആജ്ഞാഭാവമുണ്ട്. ‘തിന്മയ്ക്കു പകരം തിന്മ ചെയ്യരുത്’ എന്നത് പ്രതികാരമായി തിരിച്ചുനൽകുക എന്ന ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: προνοούμενοι
  choice: മുൻകൂട്ടി ശ്രദ്ധിക്കുക
  rationale: προνοέω മുൻകൂട്ടി ചിന്തിക്കുകയും കരുതലോടെ ശ്രദ്ധിക്കുകയും ചെയ്യുക എന്ന ആശയം ഉൾക്കൊള്ളുന്നു. ഭൗതികമായി നൽകുക എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതെ ആസൂത്രിതമായ ധാർമിക ശ്രദ്ധ ഈ പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: καλὰ
  choice: നല്ല കാര്യങ്ങൾ
  rationale: നപുംസകലിംഗ ബഹുവചനമായ καλά ഇവിടെ നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്നു. ‘നല്ല കാര്യങ്ങൾ’ അതിന്റെ വിശാലമായ ധാർമിക അർഥം നിലനിർത്തുന്നു; മാന്യത, ശ്രേഷ്ഠത എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: എല്ലാ മനുഷ്യരുടെയും ദൃഷ്ടിയിൽ
  rationale: ἐνώπιον എന്നതിലെ ‘മുമ്പിൽ/ദൃഷ്ടിയിൽ’ എന്ന ആശയവും പ്രവൃത്തിയുടെ പൊതുദൃശ്യതയും ഈ പരിഭാഷ നിലനിർത്തുന്നു. ἀνθρώπων ഇവിടെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൊതുസമൂഹത്തിന്റെ പശ്ചാത്തലത്തിൽ καλά എന്നതിന്റെ ധാർമികവും മാന്യതാസംബന്ധവുമായ വ്യാപ്തി
  choice: നല്ല കാര്യങ്ങൾ
  alternative: മാന്യമായ കാര്യങ്ങൾ; ശ്രേഷ്ഠമായ കാര്യങ്ങൾ
  rationale: καλά ധാർമികമായി നല്ലതും പൊതുവിൽ മാന്യവും ശ്രേഷ്ഠവുമായതിനെ സൂചിപ്പിക്കാം. മുഖ്യപാഠത്തിലെ വിശാലമായ ‘നല്ല’ എന്ന പദം ഉപദേശത്തെ കേവലം സാമൂഹിക പ്രതിച്ഛായയിലേക്ക് ചുരുക്കുന്നില്ല; മറ്റു സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ പ്രബോധനശൈലി. ഗ്രീക്കിലെ കൃദന്തരൂപങ്ങളുടെ സന്ദർഭജന്യ ആജ്ഞാഭാവം മലയാളത്തിൽ വ്യക്തമായ നിരോധനവും നിർദേശവുമായി അവതരിപ്പിച്ചിരിക്കുന്നു. ‘എല്ലാ മനുഷ്യരുടെയും ദൃഷ്ടിയിൽ’ എന്ന പ്രയോഗം മൂലപാഠത്തിന്റെ പൊതുദൃശ്യത നിലനിർത്തുന്നു.
