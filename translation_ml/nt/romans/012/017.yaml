  naturalness: ‘ആരോടും തിന്മയ്ക്കു പകരം തിന്മ തിരിച്ചുചെയ്യരുത്’ ആധുനിക നിലവാരമലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്. ‘എല്ലാവരുടെയും ദൃഷ്ടിയിൽ നല്ല കാര്യങ്ങളെക്കുറിച്ചു മുൻകൂട്ടി ചിന്തിക്കുക’ പൊതുവിൽ ദൃശ്യമാകുന്ന നല്ലതും മാന്യവുമായ കാര്യങ്ങൾ വിവേകപൂർവം പരിഗണിക്കണമെന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
  terminology: ‘തിന്മ’ κακόν-ന്റെ ധാർമിക വ്യാപ്തി നന്നായി നിലനിർത്തുന്നു. καλά-യ്ക്ക് മുഖ്യപാഠത്തിൽ ‘നല്ല കാര്യങ്ങൾ’ നിലനിർത്താം; അതിന്റെ ‘മാന്യമായ/ശ്രേഷ്ഠമായ’ സൂക്ഷ്മാർഥങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു. ‘എല്ലാവരും’ ἀνθρώπων-ന്റെ പൊതുവായ ഉൾക്കൊള്ളുന്ന അർഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
