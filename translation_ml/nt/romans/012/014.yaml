source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: ml
  text: നിങ്ങളെ പീഡിപ്പിക്കുന്നവരെ അനുഗ്രഹിക്കുവിൻ[a]; അനുഗ്രഹിക്കുവിൻ, ശപിക്കരുത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളെ പിന്തുടരുന്നവരെ.’ ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘പിന്തുടരുക’ എന്നും അർഥമാകാം; എന്നാൽ ഇവിടെ ശത്രുതാപരമായ പീഡനത്തെയാണ് സൂചിപ്പിക്കുന്നത് എന്നു തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: അനുഗ്രഹിക്കുവിൻ
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ ശക്തിയും മറ്റുള്ളവർക്കു നന്മ ആശംസിക്കുന്നതോ ദൈവാനുഗ്രഹം നേരുന്നതോ ആയ മത-ധാർമ്മിക അർഥവും സ്വാഭാവികമായി നൽകുന്നു. പൗലോസിന്റെ ഊന്നൽ നിലനിർത്താൻ ആവർത്തനം അതേപടി സൂക്ഷിച്ചു.
- source_word: τοὺς διώκοντας
  choice: നിങ്ങളെ പീഡിപ്പിക്കുന്നവരെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തം ‘പീഡിപ്പിക്കുന്നവർ’ എന്ന നാമസദൃശ പ്രയോഗമാണ്. διώκω എന്നതിന് ‘പിന്തുടരുക’ എന്നും അർഥമുണ്ടെങ്കിലും, ശത്രുതയുള്ള എതിരാളികളോടുള്ള പെരുമാറ്റമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വ്യക്തതയ്ക്കായി സന്ദർഭത്തിൽ അന്തർലീനമായ ‘നിങ്ങളെ’ ചേർത്തു.
- source_word: καὶ
  choice: (വിരാമചിഹ്നത്തിലൂടെ ബന്ധിപ്പിച്ചു)
  rationale: ഗ്രീക്കിലെ ലളിതമായ ബന്ധം മലയാളത്തിൽ അർധവിരാമവും തുടർന്നുള്ള ആവർത്തിത ആജ്ഞയുംകൊണ്ട് സ്വാഭാവികമായി പ്രകടമാകുന്നു; ‘അനുഗ്രഹിക്കുവിൻ, ശപിക്കരുത്’ എന്ന നേരിട്ടുള്ള വൈരുധ്യം നിലനിൽക്കുന്നു.
- source_word: μὴ καταρᾶσθε
  choice: ശപിക്കരുത്
  rationale: μή ചേർന്ന ആജ്ഞാരൂപത്തിന്റെ നിരോധനശക്തി വ്യക്തവും സംക്ഷിപ്തവുമായി നൽകുന്നു; ‘അനുഗ്രഹിക്കുവിൻ’ എന്നതുമായുള്ള പ്രത്യക്ഷ വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സന്ദർഭത്തിലെ διώκω എന്ന പദത്തിന്റെ അർഥവ്യാപ്തി
  choice: ശത്രുതാപരമായി പീഡിപ്പിക്കുക
  alternative: പിന്തുടരുക
  rationale: διώκω എന്നതിന് പൊതുവായി ‘പിന്തുടരുക’ എന്ന അർഥമുണ്ടെങ്കിലും, പൗലോസിന്റെ ധാർമ്മിക ഉപദേശസന്ദർഭത്തിലും അനുഗ്രഹിക്കൽ–ശപിക്കൽ വൈരുധ്യത്തിലും ഇവിടെ ‘പീഡിപ്പിക്കുക’ എന്ന അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്. മറ്റൊരു യഥാർഥ പദസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ആജ്ഞാശൈലി. ‘അനുഗ്രഹിക്കുവിൻ’ എന്ന രൂപം തിരുവെഴുത്തിന്റെ മാന്യത നിലനിർത്തിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്; മൂലത്തിലെ ആവർത്തനവും അനുഗ്രഹിക്കൽ–ശപിക്കൽ വൈരുധ്യവും സംരക്ഷിച്ചു.
