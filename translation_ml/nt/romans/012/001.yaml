id: ROM.12.1
reference: Romans 12:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: ml
  text: 'അതുകൊണ്ട് സഹോദരന്മാരേ[a], ദൈവത്തിന്റെ കരുണകളെ മുൻനിർത്തി ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു: നിങ്ങളുടെ ശരീരങ്ങളെ ജീവനുള്ളതും വിശുദ്ധവും ദൈവത്തിനു പ്രസാദകരവുമായ യാഗമായി സമർപ്പിക്കുവിൻ. ഇതാണ് നിങ്ങളുടെ യുക്തിപൂർവമായ ആരാധന[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്ന പുരുഷലിംഗരൂപമാണ്, എന്നാൽ സമ്മിശ്ര സമൂഹത്തെ അഭിസംബോധന ചെയ്യാനും ഈ രൂപം പലപ്പോഴും ഉപയോഗിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ ‘ആത്മികമായ ആരാധന’ അല്ലെങ്കിൽ ‘വിവേകപൂർവമായ സേവനം’; ഗ്രീക്ക് പ്രയോഗത്തിന് യുക്തിസഹമായ, യോജിച്ച, ആത്മികമായ ആരാധനയുടെയോ സേവനത്തിന്റെയോ അർഥനിറങ്ങൾ ഉണ്ടാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഇവിടെ ക്രിയ വെറും അപേക്ഷയല്ല, ഗൗരവമുള്ള അപ്പൊസ്തലിക പ്രബോധനമാണ്. ‘അഭ്യർഥിക്കുന്നു’ ആ ശക്തി മാന്യവും സ്വാഭാവികവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: റോമർ 1–11 വരെയുള്ള വാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സമ്മിശ്ര സമൂഹത്തെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കരുണകളെ മുൻനിർത്തി
  rationale: διά + genitive ഇവിടെ അഭ്യർഥനയുടെ അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്നു. ‘മുൻനിർത്തി’ മലയാളത്തിൽ സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു; οἰκτιρμῶν എന്ന ബഹുവചനം ‘കരുണകൾ’ ആയി നിലനിർത്തുന്നു.
- source_word: παραστῆσαι
  choice: സമർപ്പിക്കുവിൻ
  rationale: യാഗസന്ദർഭത്തിൽ ‘മുന്നിൽ അർപ്പിക്കുക/സമർപ്പിക്കുക’ എന്ന ആശയം നൽകുന്നു. മലയാളത്തിൽ ‘സമർപ്പിക്കുക’ യാഗപരമായ അർഥവും സ്വയം ദൈവത്തിനു ഏല്പിക്കുന്ന ഭാവവും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τὰ σώματα ὑμῶν
  choice: നിങ്ങളുടെ ശരീരങ്ങളെ
  rationale: σώματα എന്ന മൂർത്തമായ പദം ‘നിങ്ങളെത്തന്നെ’ എന്നു പൊതുവാക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: θυσίαν ζῶσαν
  choice: ജീവനുള്ള ... യാഗമായി
  rationale: പൗലൊസിന്റെ ഉദ്ദേശ്യപൂർവമായ വിരോധാഭാസമുള്ള യാഗചിത്രം സംരക്ഷിക്കുന്നു.
- source_word: ἁγίαν
  choice: വിശുദ്ധവും
  rationale: ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടതെന്ന അർഥമുള്ള പതിവായും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ളതുമായ മലയാളപദം.
- source_word: εὐάρεστον τῷ θεῷ
  choice: ദൈവത്തിനു പ്രസാദകരവുമായ
  rationale: വെറും അനുവദനീയമെന്നതിലുപരി ദൈവത്തെ പ്രസാദിപ്പിക്കുന്നതെന്ന അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: λογικὴν
  choice: യുക്തിപൂർവമായ
  rationale: λογικός എന്ന പദത്തിന്റെ വിവേകസഹിതമായ, യോജിച്ച, ബുദ്ധിപൂർവമായ എന്നീ അർഥസാധ്യതകളോട് അടുത്തുനിൽക്കുന്നു; ‘ആത്മികമായ’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് മുഖ്യപാഠം ഏകപക്ഷീയമായി നീങ്ങുന്നില്ല.
- source_word: λατρείαν
  choice: ആരാധന
  rationale: ദൈവത്തിനു നൽകുന്ന ആരാധനാപരമായ ശുശ്രൂഷയെ സൂചിപ്പിക്കുന്നു. യാഗചിത്രം സേവനത്തിന്റെ പശ്ചാത്തലം ഇതിനകം നൽകുന്നതിനാൽ ‘ആരാധന’ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
theological_decisions:
- issue: സമ്മിശ്ര വായനാസമൂഹത്തോടുള്ള ἀδελφοί എന്ന സംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: മൂലത്തിലെ വ്യാകരണപരമായി പുരുഷലിംഗത്തിലുള്ള രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. അത് സ്ത്രീകളെയും ഉൾക്കൊള്ളാവുന്ന പ്രതിനിധിപരമായ സംബോധനമാണെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: λογικὴν λατρείαν എന്ന വിവാദാർഥമുള്ള പ്രയോഗം
  choice: യുക്തിപൂർവമായ ആരാധന
  alternative: ആത്മികമായ ആരാധന; വിവേകപൂർവമായ സേവനം
  rationale: ഈ ഗ്രീക്ക് പ്രയോഗത്തിന് യുക്തിസഹമായ, യോജിച്ച, ആത്മികമായ ആരാധന/സേവനം എന്നീ അർഥനിറങ്ങളുണ്ട്. മുഖ്യപാഠം പദത്തിന്റെ യുക്തിബന്ധം നിലനിർത്തുന്നു; മറ്റു പ്രധാന സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായ വായനയ്ക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സമർപ്പിക്കുവിൻ’ എന്നത് വാക്യത്തിലെ നേരിട്ടുള്ള പ്രബോധനത്തിന് അല്പം ഗൗരവം നൽകുന്നു; ബാക്കി പ്രയോഗങ്ങൾ അനാവശ്യമായ പുരാതനഭാഷ ഒഴിവാക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
