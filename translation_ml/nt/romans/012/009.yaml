id: ROM.12.9
reference: Romans 12:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: ml
  text: സ്നേഹം കപടമില്ലാത്തതായിരിക്കട്ടെ.[a] തിന്മയെ വെറുക്കുക; നന്മയോടു പറ്റിച്ചേരുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “സ്നേഹം ആത്മാർഥമായിരിക്കട്ടെ.” ഗ്രീക്കിൽ അക്ഷരാർഥം: “കപടമില്ലാത്ത സ്നേഹം.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ വിശാലമായ നൈതികവും ബന്ധപരവുമായ അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀνυπόκριτος
  choice: കപടമില്ലാത്തതായിരിക്കട്ടെ
  rationale: ‘കപടമില്ലാത്ത’ എന്നത് അഭിനയിക്കപ്പെട്ടതല്ലാത്ത, വ്യാജമല്ലാത്ത സ്നേഹമെന്ന മൂർത്തമായ നൈതിക ആശയം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ക്രിയാരഹിത ഘടന ഉപദേശാത്മക സന്ദർഭത്തിൽ മലയാളത്തിൽ ‘ആയിരിക്കട്ടെ’ ചേർത്ത് സ്വാഭാവികമാക്കി.
- source_word: ἀποστυγοῦντες
  choice: വെറുക്കുക
  rationale: തിന്മയോടുള്ള ശക്തമായ നൈതിക വിരക്തി വ്യക്തമാക്കുന്ന, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദം. സന്ദർഭത്തിലെ ഉപദേശപരമായ കൃതന്തത്തിന് ആജ്ഞാരൂപം നൽകി.
- source_word: τὸ πονηρόν
  choice: തിന്മയെ
  rationale: നപുംസകലിംഗ വിശേഷണം നാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ, ഒരു പ്രത്യേക ദുഷ്‌പ്രവൃത്തിയായി ചുരുക്കാതെ വിശാലമായ നൈതിക വിഭാഗം സൂചിപ്പിക്കുന്നു.
- source_word: κολλώμενοι
  choice: പറ്റിച്ചേരുക
  rationale: ദൃഢമായി ചേർന്നുനിൽക്കുക എന്ന ക്രിയയുടെ സജീവവും ശക്തവുമായ ഭാവം നൽകുന്നു; ഉപദേശാത്മക സന്ദർഭത്തിന് അനുസരിച്ച് ആജ്ഞാരൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
- source_word: τῷ ἀγαθῷ
  choice: നന്മയോടു
  rationale: നാമമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തെ വിശാലമായ നൈതിക അർഥത്തോടെ നൽകുകയും ‘തിന്മയെ’ എന്നതിനോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ക്രിയാരഹിതമായ ആദ്യവാക്യത്തിന്റെയും തുടർന്നുള്ള കൃതന്തങ്ങളുടെയും ഉപദേശാത്മക ശക്തി
  choice: ‘സ്നേഹം ... ആയിരിക്കട്ടെ; ... വെറുക്കുക; ... പറ്റിച്ചേരുക’ എന്ന ഉപദേശങ്ങളുടെ പരമ്പരയായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കപടമില്ലാത്ത സ്നേഹം, തിന്മയെ വെറുത്തുകൊണ്ട്, നന്മയോടു പറ്റിച്ചേർന്നുകൊണ്ട്’ എന്ന കൂടുതൽ രൂപാനുസൃതവും ഖണ്ഡിതവുമായ പരിഭാഷ.
  rationale: റോമർ 12-ലെ സന്ദർഭം ഉപദേശങ്ങളുടെ പരമ്പരയായതിനാൽ ആജ്ഞാത്മക ശക്തി മലയാളത്തിൽ തുറന്നുകാട്ടുന്നത് രചയിതാവിന്റെ ഉദ്ദേശ്യം സ്വാഭാവികമായി അറിയിക്കുന്നു; അതേസമയം ആദ്യ ഗ്രീക്ക് ഘടനയുടെ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഉപദേശശൈലി ഉപയോഗിച്ചു. ‘കപടമില്ലാത്ത’ എന്ന വ്യക്തമായ നൈതിക പ്രയോഗവും ‘പറ്റിച്ചേരുക’ എന്ന സജീവ ക്രിയയും തിരഞ്ഞെടുത്തു; അനാവശ്യമായ സഭാപരമോ വിഭാഗീയമോ ആയ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
