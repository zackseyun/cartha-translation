id: ROM.12.13
reference: Romans 12:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: ml
  text: വിശുദ്ധരുടെ ആവശ്യങ്ങൾ നിറവേറ്റുന്നതിൽ പങ്കാളികളാകുക[a]; അതിഥിസത്കാരം നടത്താൻ ഉത്സാഹപൂർവം ശ്രമിക്കുക[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “വിശുദ്ധരുടെ ആവശ്യങ്ങൾക്കായി സംഭാവന ചെയ്യുക.”
    reason: κοινωνοῦντες എന്നതിന് ആവശ്യങ്ങൾ നിറവേറ്റുന്നതിൽ പങ്കാളിയാകുക എന്ന വിശാലമായ അർഥമുണ്ട്; സംഭാവന നൽകുക എന്നത് സന്ദർഭോചിതമായ ഒരു പകരംരൂപമാണ്.
  - marker: b
    text: ഗ്രീക്കുപദത്തിന് അപരിചിതരെയും സ്വാഗതം ചെയ്ത് പരിചരിക്കുക എന്ന ആശയമുണ്ട്; അക്ഷരാർഥത്തിൽ, “അതിഥികളോടുള്ള സ്നേഹം.”
    reason: φιλοξενിയയുടെ അപരിചിതരോടുള്ള സ്വാഗതപരമായ ഘടകം വ്യക്തമാക്കുന്നു. “ഉത്സാഹപൂർവം ശ്രമിക്കുക” διώκοντες എന്ന സജീവമായ പിന്തുടരൽഭാവം സന്ദർഭാനുസൃതമായി പ്രകടിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: χρείαις
  choice: ആവശ്യങ്ങളിൽ
  rationale: പ്രായോഗികവും ഭൗതികവുമായ ആവശ്യങ്ങളെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἁγίων
  choice: വിശുദ്ധരുടെ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട വിശ്വാസിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; പിൽക്കാലത്തെ പരിമിതമായ സഭാപദവി ഇവിടെ ഉദ്ദേശിക്കുന്നില്ല.
- source_word: κοινωνοῦντες
  choice: പങ്കുചേരുക
  rationale: പങ്കാളിത്തം, പങ്കിടൽ, സഹായം നൽകൽ എന്നീ അർഥസാധ്യതകൾ നിലനിർത്തുന്നു; ധനസഹായത്തിൽ മാത്രം അർഥം ചുരുക്കുന്നില്ല.
- source_word: φιλοξενίαν
  choice: അതിഥിസത്കാരം
  rationale: അപരിചിതരെയും യാത്രക്കാരെയും സ്വാഗതം ചെയ്ത് പരിചരിക്കുന്ന φιλοξενίαയുടെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διώκοντες
  choice: ഉത്സാഹത്തോടെ അവസരങ്ങൾ തേടുക
  rationale: വെറും ആചരണം എന്നതിലുപരി, സജീവമായി പിന്തുടരുകയും അവസരം അന്വേഷിക്കുകയും ചെയ്യുക എന്ന διώκωയുടെ ശക്തി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധർ’ എന്നതിന്റെ സൂചിതർ
  choice: ക്രിസ്തുവിൽ വിശ്വസിക്കുന്ന ദൈവജനസമൂഹം
  alternative: പിൽക്കാല സഭാപാരമ്പര്യത്തിൽ ഔദ്യോഗികമായി വിശുദ്ധരായി പ്രഖ്യാപിക്കപ്പെട്ട പരിമിത വിഭാഗം
  rationale: പൗലോസിന്റെ സാധാരണ പ്രയോഗത്തിൽ ἅγιοι എല്ലാ വിശ്വാസികളെയും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട ജനമായി സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ dignified ആജ്ഞാരൂപം ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ട് participial exhortations മലയാളത്തിൽ സ്വാഭാവികമായ നിർദേശങ്ങളാക്കി. ‘വിശുദ്ധർ’ എന്ന സ്ഥാപിത പൗലോസീയ പദം നിലനിർത്തി; തെറ്റായ പരിമിതാർഥം വ്യാഖ്യാനത്തിൽ വ്യക്തമാക്കിയിട്ടുണ്ട്.
