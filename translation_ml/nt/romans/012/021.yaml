  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: ml
  text: തിന്മയാൽ തോൽപ്പിക്കപ്പെടരുത്[a]; നന്മകൊണ്ട് തിന്മയെ തോൽപ്പിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘തിന്മയായതാൽ തോൽപ്പിക്കപ്പെടരുത്; നന്മയായതിലൂടെ തിന്മയായതിനെ തോൽപ്പിക്കുക.’ ഗ്രീക്കിൽ ആർട്ടിക്കിളോടുകൂടിയ നപുംസകലിംഗ വിശേഷണങ്ങളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അവയെ ‘തിന്മ’, ‘നന്മ’ എന്നോ ‘തിന്മയായത്’, ‘നന്മയായത്’ എന്നോ പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: തോൽപ്പിക്കപ്പെടരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല കർമണി ആജ്ഞയുടെ നിരോധനസ്വഭാവവും νικάωയുടെ ജയിക്കുക/തോൽപ്പിക്കുക എന്ന രൂപകവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: തിന്മയാൽ
  rationale: ὑπό + genitive കർമണി വാക്യത്തിലെ പ്രവർത്തകശക്തിയെ സൂചിപ്പിക്കുന്നു. ആർട്ടിക്കിളോടുകൂടിയ നപുംസകലിംഗ വിശേഷണം പൊതുവായ ധാർമിക വിഭാഗമായി ഇവിടെ ‘തിന്മ’ എന്നു സ്വാഭാവികമായി നൽകാം.
- source_word: ἀλλὰ νίκα
  choice: നന്മകൊണ്ട് ... തോൽപ്പിക്കുക
  rationale: ἀλλάയുടെ ശക്തമായ വൈരുധ്യം മലയാളത്തിലെ അർധവിരാമത്തിനു ശേഷമുള്ള പ്രതിവാക്യം വ്യക്തമാക്കുന്നു; νικάωയുടെ ആവർത്തനം ‘തോൽപ്പിക്കുക’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐν τῷ ἀγαθῷ
  choice: നന്മകൊണ്ട്
  rationale: ἐν + dative ഇവിടെ ഉപാധിയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്നു; ‘-കൊണ്ട്’ അതിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸ κακόν
  choice: തിന്മയെ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ നപുംസകലിംഗ വിശേഷണം പൊതുവായ ധാർമിക യാഥാർഥ്യമായി ഗ്രഹിക്കാം. കർമവിഭക്തി സജീവ ആജ്ഞയിലെ നേരിട്ടുള്ള കർമം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κακός/ἀγαθός എന്നിവയെ വ്യക്തിവൽക്കരിക്കണമോ, ധാർമിക വിഭാഗങ്ങളായി നിലനിർത്തണമോ
  choice: ‘തിന്മ’, ‘നന്മ’ എന്നീ ധാർമിക വിഭാഗങ്ങൾ
  alternative: ‘ദുഷ്ടൻ’ അല്ലെങ്കിൽ ‘തിന്മയായത്/നന്മയായത്’ എന്ന വ്യക്തമായ രൂപങ്ങൾ
  rationale: നപുംസകലിംഗ രൂപങ്ങളും റോമർ 12-ലെ നൈതിക സന്ദർഭവും പൊതുവായ ധാർമിക അർഥത്തെ പിന്തുണയ്ക്കുന്നു. സാത്താനെയോ മറ്റൊരു വ്യക്തിപരമായ പ്രതിയെയോ വാക്യം നിർബന്ധമായി സൂചിപ്പിക്കുന്നില്ല; അതിനാൽ അത്തരം ദൈവശാസ്ത്രപരമായ പ്രത്യേകീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ മലയാളം. മൂലത്തിലെ ജയിക്കുക/തോൽപ്പിക്കുക എന്ന ആവർത്തിത രൂപകം രണ്ട് ഉപവാക്യങ്ങളിലും നിലനിർത്തിയിരിക്കുന്നു; അമൂർത്തവും ഗുണവാചകവുമായ വായനകളിലെ യഥാർഥ അസ്പഷ്ടത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
