id: ROM.12.7
reference: Romans 12:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/007.yaml
  text: if service[a], in service; if the one teaching, in teaching[b];
translation:
  language: ml
  text: സേവനമാണെങ്കിൽ[a], സേവനത്തിൽ; പഠിപ്പിക്കുന്നയാളാണെങ്കിൽ, പഠിപ്പിക്കുന്നതിൽ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ ‘ശുശ്രൂഷയാണെങ്കിൽ, ശുശ്രൂഷയിൽ.’ ഗ്രീക്ക് പദമായ διακονίαയ്ക്ക് സന്ദർഭമനുസരിച്ച് ‘സേവനം’ എന്നോ ‘ശുശ്രൂഷ’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ ‘പഠിപ്പിക്കുന്ന വ്യക്തിയാണെങ്കിൽ, പഠിപ്പിക്കുന്നതിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: ആണെങ്കിൽ
  rationale: കൃപാവരങ്ങളുടെയും പ്രവർത്തനങ്ങളുടെയും സംക്ഷിപ്ത പട്ടികയിൽ ഓരോ ഇനവും നിബന്ധനാസദൃശമായി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: διακονίαν
  choice: സേവനം
  rationale: διακονία എന്ന പദത്തിന്റെ വിശാലമായ സേവനാർഥം നിലനിർത്തുകയും ഔദ്യോഗിക സഭാശുശ്രൂഷ എന്ന പരിമിത അർഥം അനാവശ്യമായി ചുമത്താതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ διακονίᾳ
  choice: സേവനത്തിൽ
  rationale: മൂലപാഠത്തിലെ നാമപദാവർത്തനവും സംക്ഷിപ്തമായ സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു; ആ സേവനമേഖലയിൽ പ്രവർത്തിക്കണമെന്ന സൂചന സന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കാം.
- source_word: ὁ διδάσκων
  choice: പഠിപ്പിക്കുന്നയാൾ
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ പ്രവർത്തനപരമായ ഊന്നൽ നിലനിർത്തുന്നു; ‘അധ്യാപകൻ’ എന്ന ഔദ്യോഗിക സ്ഥാനപ്പേര് അനാവശ്യമായി വരുത്തുന്നില്ല.
- source_word: διδασκαλίᾳ
  choice: പഠിപ്പിക്കുന്നതിൽ
  rationale: ഇവിടെ പഠിപ്പിക്കൽ എന്ന പ്രവർത്തനത്തെ നേരിട്ടും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; ‘ഉപദേശം’ എന്നത് ഉള്ളടക്കത്തിലേക്കു മാത്രം അർഥം ചുരുക്കാൻ ഇടയുണ്ട്.
theological_decisions:
- issue: διακονία എന്നത് സഭാപരമായ സാങ്കേതികപദമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: സേവനം
  alternative: ശുശ്രൂഷ
  rationale: ഈ കൃപാവരപ്പട്ടികയിൽ പദത്തിന് വിശാലമായ പ്രവർത്തനാർഥമുണ്ട്. ‘സേവനം’ ആ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുകയും പ്രത്യേക സഭാപദവിയോ ഔദ്യോഗിക ശുശ്രൂഷയോ മുൻകൂട്ടി നിർണ്ണയിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ὁ διδάσκων എന്നത് ഔദ്യോഗിക സ്ഥാനപ്പേരാക്കണമോ
  choice: പഠിപ്പിക്കുന്നയാൾ
  alternative: അധ്യാപകൻ
  rationale: ഗ്രീക്ക് കൃദന്തം ഒരു പദവിയേക്കാൾ പഠിപ്പിക്കുന്ന പ്രവർത്തനത്തിൽ ഏർപ്പെട്ടിരിക്കുന്ന വ്യക്തിയെയാണ് മുന്നോട്ടുവയ്ക്കുന്നത്; അതിനാൽ പ്രവർത്തനപരമായ രൂപം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന മൂലപാഠത്തിന്റെ സംക്ഷിപ്തവും അപൂർണ്ണവാക്യസദൃശവുമായ സമാന്തരഘടന ഉദ്ദേശപൂർവം നിലനിർത്തിയിരിക്കുന്നു.
