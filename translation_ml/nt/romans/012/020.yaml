id: ROM.12.20
reference: Romans 12:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: ml
  text: എന്നാൽ നിന്റെ ശത്രുവിന് വിശക്കുന്നെങ്കിൽ, അവന് ഭക്ഷണം കൊടുക്കുക; ദാഹിക്കുന്നെങ്കിൽ, അവന് കുടിക്കാൻ കൊടുക്കുക; കാരണം, ഇങ്ങനെ ചെയ്യുന്നതിലൂടെ നീ അവന്റെ തലമേൽ തീക്കനലുകൾ കുന്നുകൂട്ടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ ‘തീയുടെ കനലുകൾ.’ ഈ ദൃശ്യരൂപം മാനസാന്തരത്തിലേക്കു നയിക്കുന്ന ലജ്ജയെയോ, വേദനാജനകമായ ധാർമിക ബോധ്യത്തെയോ, വരാനിരിക്കുന്ന ന്യായവിധിയെയോ സൂചിപ്പിക്കാം; ഗ്രീക്കിലെ രൂപകം പ്രധാനപാഠത്തിൽ അതേപടി നിലനിർത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: എന്നാൽ … എങ്കിൽ
  rationale: ἀλλά മുൻവാക്യത്തിലെ പ്രതികാരനിരോധനത്തോടുള്ള വൈരുധ്യം സൂചിപ്പിക്കുന്നു; ἐάν വ്യവസ്ഥ അവതരിപ്പിക്കുന്നു. ഈ മലയാളപ്രയോഗം രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: നിന്റെ ശത്രുവിന് വിശക്കുന്നെങ്കിൽ
  rationale: ഏകവചനമായ ‘നിന്റെ ശത്രു’ നിലനിർത്തിക്കൊണ്ട്, വിശപ്പിനെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി പറയുന്നു.
- source_word: ψώμιζε αὐτόν
  choice: അവന് ഭക്ഷണം കൊടുക്കുക
  rationale: ψωμίζω ഭക്ഷണം നൽകുക എന്ന മൂർത്തമായ പ്രവൃത്തിയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘ഭക്ഷണം കൊടുക്കുക’ വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമാണ്.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: ദാഹിക്കുന്നെങ്കിൽ, അവന് കുടിക്കാൻ കൊടുക്കുക
  rationale: ποτίζω എന്നത് കുടിക്കാൻ നൽകുക എന്നാണ്; പാനീയം വെള്ളം മാത്രമാണെന്ന് ഗ്രീക്ക് പറയാത്തതിനാൽ ‘വെള്ളം കൊടുക്കുക’ എന്നു ചുരുക്കിയിട്ടില്ല.
- source_word: τοῦτο γὰρ ποιῶν
  choice: ഇങ്ങനെ ചെയ്യുന്നതിലൂടെ
  rationale: കൽപ്പിച്ച പ്രവൃത്തികൾ ചെയ്യുന്നതിന്റെ ഫലമാണ് തുടർവാക്യം എന്നു പങ്കാളിക്രിയാസംരചന വ്യക്തമാക്കുന്നു.
- source_word: ἄνθρακας πυρὸς
  choice: തീക്കനലുകൾ
  rationale: പദാനുപദമായി ‘തീയുടെ കനലുകൾ’ എന്നാകാമെങ്കിലും, ‘തീക്കനലുകൾ’ രൂപകം അതേപടി സൂക്ഷിക്കുന്ന സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളമാണ്.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: നീ അവന്റെ തലമേൽ … കൂമ്പാരമാക്കും
  rationale: σωρεύσεις എന്ന ഭാവികാലക്രിയയിലെ കൂട്ടിയിടുക/കൂമ്പാരമാക്കുക എന്ന ദൃശ്യരൂപവും ἐπί സൂചിപ്പിക്കുന്ന ‘തലമേൽ’ എന്ന സ്ഥാനബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവന്റെ തലമേൽ തീക്കനലുകൾ കൂമ്പാരമാക്കും’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ രൂപകം വ്യാഖ്യാനിക്കാതെ അതേപടി നിലനിർത്തി.
  alternative: മാനസാന്തരത്തിലേക്കു നയിക്കുന്ന ലജ്ജ, വേദനാജനകമായ ധാർമിക ബോധ്യം, അല്ലെങ്കിൽ വരാനിരിക്കുന്ന ന്യായവിധി എന്നു നേരിട്ട് വ്യാഖ്യാനിക്കുക.
  rationale: രൂപകത്തിന്റെ കൃത്യമായ ഉദ്ദേശ്യം വിവാദവിധേയമാണ്. ഏതെങ്കിലും ഒരു ദൈവശാസ്ത്രവായന പാഠത്തിന്മേൽ അടിച്ചേൽപ്പിക്കാതെ ഗ്രീക്കിലെ അർഥതുറവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കൽപ്പനകൾ നേരിട്ടും സ്വാഭാവികമായും നൽകിയിരിക്കുന്നു; വിവാദരൂപകം വിശദീകരിച്ച് തീർപ്പാക്കാതെ സംരക്ഷിച്ചിട്ടുണ്ട്. നൽകിയ ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ‘hungry’ എന്നതിനു ശേഷമാണെങ്കിലും അടിക്കുറിപ്പ് തീക്കനൽരൂപകത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ അടയാളം ബന്ധപ്പെട്ട വാക്യഭാഗത്തിനു ശേഷം സ്ഥാപിച്ചു.
