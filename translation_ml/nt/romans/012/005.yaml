- from: അതുപോലെതന്നെ, അനേകരായ നാം മശീഹായിൽ[a] ഒരു ശരീരമാണ്; ഓരോരുത്തരും പരസ്പരം അവയവങ്ങളാണ്.
  to: അതുപോലെതന്നെ, അനേകരായ നാം മശീഹായിൽ[a] ഒരു ശരീരമാണ്; ഓരോരുത്തരും മറ്റുള്ളവരുടെ അവയവങ്ങളാണ്.
