id: ROM.12.5
reference: Romans 12:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: ml
  text: അതുപോലെതന്നെ, അനേകരായ നാം മശീഹായിൽ[a] ഒരു ശരീരമാണ്; ഓരോരുത്തരും മറ്റുള്ളവരുടെ അവയവങ്ങളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുവിൽ.” ഗ്രീക്കിലെ Χριστός എന്ന സ്ഥാനപ്പേര് “മശീഹാ” എന്നോ “ക്രിസ്തു” എന്നോ പരിഭാഷപ്പെടുത്താം; ഇവിടെ അതിന്റെ സ്ഥാനപ്പേരായ അർഥം നിലനിർത്താൻ “മശീഹാ” എന്നു നൽകിയിരിക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ ശരീരത്തിന്റെയും അവയവങ്ങളുടെയും ഉപമയുമായി ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്ന താരതമ്യസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ πολλοὶ
  choice: അനേകരായ നാം
  rationale: സന്ദർഭത്തിൽ പൗലോസ് തന്നെ ഉൾപ്പെടുന്ന വിശ്വാസിസമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്; ഗ്രീക്കിലെ ബഹുത്വവും അന്തർലീനമായ ഒന്നാംപുരുഷബന്ധവും വ്യക്തമായി നൽകുന്നു.
- source_word: ἓν σῶμά
  choice: ഒരു ശരീരം
  rationale: ഐക്യവും ശരീരരൂപകവും നേരിട്ട് സംരക്ഷിക്കുന്ന സ്വാഭാവികമായ പ്രയോഗം.
- source_word: ἐν Χριστῷ
  choice: മശീഹായിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം സംരക്ഷിക്കുകയും പൗലോസിന്റെ ‘മശീഹായിൽ’ എന്ന ഐക്യഭാഷ മാറ്റമില്ലാതെ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὸ δὲ καθ’ εἷς
  choice: ഓരോരുത്തരും
  rationale: ‘ഓരോരുത്തനെ സംബന്ധിച്ചും’ എന്ന വിതരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἀλλήλων
  choice: പരസ്പരം
  rationale: വിശ്വാസികൾ തമ്മിലുള്ള അന്യോന്യബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പരസ്പരസർവനാമത്തിന്റെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: μέλη
  choice: അവയവങ്ങൾ
  rationale: ശരീരരൂപകത്തെ വ്യക്തമായി നിലനിർത്തുകയും ഓരോ വ്യക്തിയും മറ്റുള്ളവരോടു ചേർന്നിരിക്കുന്നുവെന്ന ആശയം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστῷ-യുടെ പരിഭാഷ
  choice: മശീഹായിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നു. ‘മശീഹാ’ ആ അർഥം തുറന്നുകാട്ടുന്നു; അതേസമയം ‘ക്രിസ്തുവിൽ’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു, അതിനാൽ പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗം ഏതെങ്കിലും പ്രത്യേക വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കപ്പെടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി ഉപയോഗിച്ചു. ‘അവയവങ്ങൾ’ എന്ന പദം ശരീരരൂപകം വ്യക്തമായി സൂക്ഷിക്കുന്നു; വാക്യഘടന ഗ്രീക്കിലെ ഐക്യവും വ്യക്തിഗതമായ പരസ്പരബന്ധവും തമ്മിലുള്ള തുലനം നിലനിർത്തുന്നു.
