source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഹൃദയംകൊണ്ടുള്ള വിശ്വാസം നീതിയിലേക്കും[a] വായ്‌കൊണ്ടുള്ള ഏറ്റുപറച്ചിൽ രക്ഷയിലേക്കും നയിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ന്യായത്തിലേക്ക്.’ ഗ്രീക്ക് δικαιοσύνη എന്ന പദത്തിന് ‘ന്യായം’ എന്നും അർഥമാകാം; എങ്കിലും പൗലോസിന്റെ പ്രയോഗത്തിൽ ‘നീതി’ എന്നതാണ് പതിവായ പരിഭാഷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: ഹൃദയംകൊണ്ട്
  rationale: ഉപകരണാർഥകമായ ദത്തിവിനെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും ആന്തരിക വിശ്വാസത്തെ ഊന്നിപ്പറയുകയും ചെയ്യുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: πιστεύεται
  choice: വിശ്വസിക്കുന്നത്
  rationale: പൊതുവായ, വ്യക്തിനിരപേക്ഷ പ്രസ്താവനയായി വരുന്ന ക്രിയാരൂപത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς δικαιοσύνην
  choice: നീതിയിലേക്ക്
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യത്തിലേക്കോ ഫലത്തിലേക്കോ ഉള്ള ദിശ നിലനിർത്തുന്നു; ബന്ധത്തെ അധികമായി വിശദീകരിക്കുന്നില്ല.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ന്യായവിധിസംബന്ധമായും ധാർമികമായും ഉള്ള അർഥവ്യാപ്തി സാധ്യമായത്ര തുറന്നുവയ്ക്കുന്നു.
- source_word: στόματι
  choice: വായ്‌കൊണ്ട്
  rationale: καρδίᾳ എന്നതിനോടുള്ള ആന്തരികം–ബാഹ്യം സമാന്തരതയും ഉപകരണാർഥവും നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: ഉം
  rationale: വിരോധത്തേക്കാൾ പൂരകമായ രണ്ടാമത്തെ ഘടകത്തെ മലയാളത്തിലെ സമാന്തര ഘടനയിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ὁμολογεῖται
  choice: ഏറ്റുപറയുന്നത്
  rationale: മുൻവാക്യസന്ദർഭത്തിൽ യേശുവിനെ കർത്താവായി പരസ്യമായി അംഗീകരിച്ചു പറയുന്നതിന്റെ ഭാവം നൽകുന്നു; വെറും സ്വകാര്യ സമ്മതമായി ചുരുക്കുന്നില്ല.
- source_word: εἰς σωτηρίαν
  choice: രക്ഷയിലേക്ക്
  rationale: ആദ്യ εἰς പ്രയോഗത്തോടുള്ള ഔപചാരിക സമാന്തരതയും ലക്ഷ്യം/ഫലം എന്ന തുറന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: σωτηρίαν
  choice: രക്ഷ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ഇപ്പോഴത്തെയും അന്തിമവുമായ വിടുതൽ ഉൾക്കൊള്ളാൻ കഴിയുന്ന സാധാരണ ദൈവശാസ്ത്രപരമായ പദമാണ്.
theological_decisions:
- issue: വിശ്വാസവും ഏറ്റുപറച്ചിലും നീതിയോടും രക്ഷയോടും പുലർത്തുന്ന ബന്ധം
  choice: ആന്തരിക വിശ്വാസം നീതിയിലേക്കും വായ്‌കൊണ്ടുള്ള ഏറ്റുപറച്ചിൽ രക്ഷയിലേക്കും ആകുന്നു എന്ന സമാന്തര പ്രസ്താവന അതേപടി നിലനിർത്തി.
  alternative: ഏറ്റുപറച്ചിൽ രക്ഷയുടെ തെളിവ് മാത്രമാണെന്നോ രക്ഷ സമ്പാദിക്കുന്ന അധിക പ്രവൃത്തിയാണെന്നോ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ സമാന്തര εἰς ഘടന രക്ഷാക്രമത്തെ യാന്ത്രികമായി വിശദീകരിക്കുന്നില്ല. അതിനാൽ പാഠത്തിലുള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഹൃദയംകൊണ്ട്… വായ്‌കൊണ്ട്’ എന്നും ‘നീതിയിലേക്ക്… രക്ഷയിലേക്ക്’ എന്നും ഉള്ള സമാന്തരത സംരക്ഷിച്ചു; അമിതമായി പുരാതനമായ ‘നീതീകരണം പ്രാപിക്കുന്നു’ പോലുള്ള വ്യാഖ്യാനാത്മക വിപുലീകരണം ഒഴിവാക്കി.
