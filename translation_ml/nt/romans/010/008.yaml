id: ROM.10.8
reference: Romans 10:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: ml
  text: എന്നാൽ അത് എന്തു പറയുന്നു? “വചനം നിനക്ക് സമീപമുണ്ട്, നിന്റെ വായിലും നിന്റെ ഹൃദയത്തിലും.”[a] അതായത്, ഞങ്ങൾ പ്രസംഗിക്കുന്ന വിശ്വാസത്തിന്റെ വചനം.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ആവർത്തനം 30:14-ലെ ഭാഷയാണ് പൗലോസ് ഇവിടെ പ്രതിധ്വനിപ്പിക്കുന്നത്; താൻ പ്രസംഗിക്കുന്ന സുവിശേഷവചനത്തോട് അദ്ദേഹം അതിനെ ബന്ധിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: “വിശ്വാസത്തിന്റെ വചനം” എന്നത് “വിശ്വാസസന്ദേശം” എന്നും പരിഭാഷപ്പെടുത്താം. πίστις എന്ന ഗ്രീക്ക് പദത്തിന് ചില സന്ദർഭങ്ങളിൽ “ആശ്രയം” അല്ലെങ്കിൽ “വിശ്വസ്തത” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവിവരണത്തോട് വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ മലയാള സംയോജകം.
- source_word: τί λέγει
  choice: അത് എന്തു പറയുന്നു?
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി പറയാത്ത തിരുവെഴുത്ത് എന്ന കർത്താവിനെ ‘അത്’ എന്നതിലൂടെ നിലനിർത്തുന്നു; ‘തിരുവെഴുത്ത്’ എന്നു മുഖ്യവാചകത്തിൽ ചേർത്ത് വ്യാഖ്യാനം ഉറപ്പിക്കുന്നില്ല.
- source_word: Ἐγγύς σου
  choice: നിനക്ക് സമീപമുണ്ട്
  rationale: സ്ഥലപരവും രൂപകപരവുമായ ‘അടുത്ത്/സമീപം’ എന്ന അർഥം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: τὸ ῥῆμα
  choice: വചനം
  rationale: ഉദ്ധരണിയിലും പൗലോസിന്റെ വിശദീകരണത്തിലും ആവർത്തിക്കുന്ന ῥῆμα എന്ന പദത്തിന്റെ ബന്ധം നിലനിർത്തുന്നു; ‘സന്ദേശം’ എന്നത് സാധ്യമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
- source_word: ἐν τῷ στόματί σου
  choice: നിന്റെ വായിലും
  rationale: ആവർത്തനപദമായ ἐν മലയാളത്തിലെ വിഭക്തിപ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകിക്കൊണ്ട് ശരീരരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: നിന്റെ ഹൃദയത്തിലുംതന്നെ
  rationale: καρδίαയുടെ പതിവ് ബൈബിൾരൂപകമായ ‘ഹൃദയം’ നിലനിർത്തുന്നു; ‘തന്നെ’ സമീപത്വത്തിന്റെ ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമാക്കുന്നു.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: ഉദ്ധരണിക്കു പിന്നാലെയുള്ള പൗലോസിന്റെ വിശദീകരണം വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: വിശ്വാസത്തിന്റെ വചനം
  rationale: ആദ്യത്തെ ῥῆμαയുമായുള്ള പദബന്ധവും ഗ്രീക്ക് ഷഷ്ഠിവിഭക്തിയുടെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു; ബന്ധത്തിന്റെ കൃത്യസ്വഭാവം അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്നതിന് ഈ സന്ദർഭത്തിലെ സാധാരണ പൗലോസീയ അർഥം; ‘ആശ്രയം/വിശ്വസ്തത’ തുടങ്ങിയ സാധ്യതകൾ മുഖ്യവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ὃ κηρύσσομεν
  choice: ഞങ്ങൾ പ്രസംഗിക്കുന്ന
  rationale: κηρύσσωയുടെ പരസ്യമായ പ്രഖ്യാപനാർഥം മലയാള ക്രൈസ്തവ-പൊതുപ്രയോഗത്തിൽ വായനാസൗകര്യമുള്ള ‘പ്രസംഗിക്കുക’ എന്നതിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: τὸ ῥῆμα τῆς πίστεως എന്നതിലെ πίστις
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഇവിടെ പ്രസംഗിക്കപ്പെടുന്ന വചനത്തെ വിശ്വാസവുമായി ബന്ധിപ്പിക്കുന്നതാണ് പ്രാഥമിക വായന. ഷഷ്ഠിവിഭക്തി ‘വിശ്വാസത്തെക്കുറിച്ചുള്ള’, ‘വിശ്വാസം ആവശ്യപ്പെടുന്ന’, അല്ലെങ്കിൽ ‘വിശ്വാസത്തിന്റെ സ്വഭാവമുള്ള’ എന്നിങ്ങനെ വ്യാഖ്യാനിക്കാവുന്നതിനാൽ ‘വിശ്വാസത്തിന്റെ’ എന്ന രൂപം ആ ബന്ധം തുറന്നുവെക്കുന്നു.
- issue: ആവർത്തനം 30:14-ലെ ഭാഷയുടെ പ്രയോഗം
  choice: ഉദ്ധരണിയുടെ വാചകരൂപം നിലനിർത്തി, പശ്ചാത്തലം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: മുഖ്യവാചകത്തിൽ ‘തിരുവെഴുത്ത്’ അല്ലെങ്കിൽ ‘സുവിശേഷസന്ദേശം’ എന്നു വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാചകത്തിൽ ഇല്ലാത്ത വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ, പൗലോസ് ഉദ്ധരിച്ച ഭാഷയെ താൻ പ്രസംഗിക്കുന്ന വിശ്വാസത്തിന്റെ വചനത്തോട് ബന്ധിപ്പിക്കുന്ന രീതി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ സംക്ഷിപ്തതയും ‘വചനം’ എന്ന ആവർത്തനവും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
