  to: കാരണം, യെഹൂദനും ഗ്രീക്കുകാരനും തമ്മിൽ യാതൊരു വ്യത്യാസവുമില്ല[a]; എല്ലാവരുടെയും കർത്താവ് ഒരുവൻതന്നെ[b], അവനെ വിളിച്ചപേക്ഷിക്കുന്ന ഏവരോടും സമൃദ്ധമായ ഔദാര്യം കാണിക്കുന്നവൻ.
  rationale: The revision restores the causal connection expressed by γάρ and replaces the added, narrower idea of mercy with ‘സമൃദ്ധമായ ഔദാര്യം,’ which conveys the Lord’s abundant generosity while preserving the source’s metaphorical breadth. It retains ‘കർത്താവ്,’ ‘ഗ്രീക്കുകാരൻ,’ and the qualification that the generosity is toward all who call on him. Footnotes have been adjusted for precision and natural Malayalam.
