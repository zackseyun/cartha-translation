id: ROM.10.12
reference: Romans 10:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: ml
  text: കാരണം, യെഹൂദനും ഗ്രീക്കുകാരനും തമ്മിൽ യാതൊരു വ്യത്യാസവുമില്ല[a]; എല്ലാവരുടെയും കർത്താവ് ഒരുവൻതന്നെ[b], അവനെ വിളിച്ചപേക്ഷിക്കുന്ന ഏവരോടും സമൃദ്ധമായ ഔദാര്യം കാണിക്കുന്നവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ഗ്രീക്കുകാരൻ’; ഇവിടെ ‘യെഹൂദൻ—ഗ്രീക്കുകാരൻ’ എന്ന ജോടി യെഹൂദനും യെഹൂദനല്ലാത്തവനും തമ്മിലുള്ള വ്യത്യാസത്തെ സൂചിപ്പിക്കുന്നു. ചില പരിഭാഷകൾ ‘വിജാതീയൻ’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എല്ലാവർക്കും മേലുള്ള ഒരേ കർത്താവ്.’
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: വ്യത്യാസം
  rationale: കൂട്ടങ്ങൾക്കിടയിൽ വേർതിരിവോ ഭേദമോ ഇല്ലെന്ന ആശയം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: യെഹൂദൻ ... ഗ്രീക്കുകാരൻ
  rationale: മൂലപാഠത്തിലെ ‘ഗ്രീക്കുകാരൻ’ നിലനിർത്തുന്നു; ഇവിടെ ഈ ജോടി യെഹൂദൻ/യെഹൂദനല്ലാത്തവൻ എന്ന വൈരുധ്യമായി പ്രവർത്തിക്കുന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: എല്ലാവരുടെയും കർത്താവ് ഒരുവൻതന്നെ
  rationale: κύριος എന്ന ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേര് ‘കർത്താവ്’ എന്നു നിലനിർത്തുകയും, πάντων എന്നതിനെ സ്വാഭാവികമായി ‘എല്ലാവരുടെയും’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: πλουτῶν εἰς πάντας
  choice: എല്ലാവരോടും ... സമൃദ്ധമായി ദയ കാണിക്കുന്നു
  rationale: ‘സമ്പന്നനായിരിക്കുന്നു’ എന്ന അക്ഷരാർഥരൂപകം മലയാളത്തിൽ ഇവിടെ അസ്വാഭാവികമായതിനാൽ, കർത്താവിന്റെ ഔദാര്യപൂർണമായ സമൃദ്ധി ദിശാസൂചനയോടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: തന്നെ വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരും
  rationale: വിശ്വാസത്തോടെ കർത്താവിനെ വിളിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന ἐπικαλέω എന്ന പദത്തിന് ‘വിളിച്ചപേക്ഷിക്കുക’ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: ചുറ്റുപാടിലുള്ള വാക്യങ്ങൾ ഏറ്റുപറയുന്ന അതേ കർത്താവിനെ സൂചിപ്പിക്കുന്ന വിധം സ്ഥാനപ്പേര് വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തി.
  alternative: ക്രിസ്തുവിനെ പ്രത്യേകം സൂചിപ്പിക്കാത്ത പൊതുവായ ദൈവപരാമർശം.
  rationale: റോമർ 10:9-13 യേശുവിനെ കർത്താവായി ഏറ്റുപറയുന്നതിനെ കേന്ദ്രീകരിക്കുമ്പോഴും യോവേലിന്റെ ഉദ്ധരണിയുടെ പ്രതിധ്വനി നിലനിൽക്കുന്നു; പരിഭാഷ സന്ദർഭം നൽകുന്ന ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം സംരക്ഷിക്കുന്നു.
- issue: ‘എല്ലാവരും’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘തന്നെ വിളിച്ചപേക്ഷിക്കുന്ന’ എന്ന വിശേഷണം ‘എല്ലാവരും’ എന്നതിന്റെ വ്യാപ്തി നിർണ്ണയിക്കുന്നതായി നിലനിർത്തി.
  alternative: എല്ലാ മനുഷ്യർക്കും നിബന്ധനയില്ലാതെ ലഭിക്കുന്ന രക്ഷ എന്ന വായന.
  rationale: വാക്യഘടന അനുഗ്രഹം ലഭിക്കുന്നവരെ കർത്താവിനെ വിളിച്ചപേക്ഷിക്കുന്ന എല്ലാവരായി വ്യക്തമാക്കുന്നു; അതോടൊപ്പം യെഹൂദൻ-ഗ്രീക്കുകാരൻ ഭേദമില്ലാത്ത സർവവ്യാപക ലഭ്യതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘കർത്താവ്’, ‘വിളിച്ചപേക്ഷിക്കുക’ എന്നീ സഭാപരിചിത പദങ്ങൾ സാധാരണ വായനക്കാർക്കും ഗ്രഹിക്കാവുന്ന വിധത്തിൽ നിലനിർത്തി; ഗ്രീക്ക് സമ്പത്തിന്റെ രൂപകം അർഥസമൃദ്ധി നഷ്ടപ്പെടാതെ മലയാളത്തിൽ സ്വാഭാവികമാക്കി.
