id: ROM.10.11
reference: Romans 10:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: ml
  text: 'എന്തെന്നാൽ തിരുവെഴുത്ത് പറയുന്നു: “അവനിൽ വിശ്വസിക്കുന്ന ഏവനും അപമാനിതനാകുകയില്ല[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവനിൽ വിശ്വസിക്കുന്ന ഏവനും ലജ്ജിക്കുകയില്ല.”
    reason: καταισχυνθήσεται എന്ന ഭാവികാല കർമണിരൂപം പൊതുവായ ‘ലജ്ജിക്കുക’ എന്ന ഫലമായും, കൂടുതൽ വ്യക്തമായി ‘അപമാനിതനാകുക’ എന്ന പൊതുപരമായ അർഥമായും വിവർത്തനം ചെയ്യാം.
lexical_decisions:
- source_word: λέγει
  choice: പറയുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന സൂത്രവാക്യത്തിൽ ഗ്രീക്കിലെ വർത്തമാനകാലത്തിന്റെ സജീവത സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് ആധാരം നൽകുന്ന പൗലോസിന്റെ യുക്തിബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: ഇവിടെ സാധാരണ എഴുത്തല്ല, വിശുദ്ധ തിരുവെഴുത്താണ് ഉദ്ദേശ്യം; മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗമാണിത്.
- source_word: Πᾶς ὁ πιστεύων
  choice: വിശ്വസിക്കുന്ന ഏവനും
  rationale: പുരുഷന്മാരിൽ മാത്രം ഒതുങ്ങാത്ത ഗ്രീക്ക് പൊതുപ്രയോഗത്തിന്റെ സർവവ്യാപകത വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐπ’ αὐτῷ
  choice: അവനിൽ
  rationale: വിശ്വാസം ഒരു വ്യക്തിയിൽ അർപ്പിക്കുന്നതും അവനിൽ ആശ്രയിക്കുന്നതുമായ അർത്ഥം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; സർവനാമത്തിന്റെ സൂചന വിശദീകരിച്ച് വിപുലീകരിക്കുന്നില്ല.
- source_word: οὐ καταισχυνθήσεται
  choice: ലജ്ജിതരാക്കപ്പെടുകയില്ല
  rationale: ഭാവികാല നിഷേധവും ഗ്രീക്കിലെ കർമണിപ്രയോഗവും നിലനിർത്തി, അവസാനം അപമാനിക്കപ്പെടുകയോ നിരാശനാക്കപ്പെടുകയോ ചെയ്യില്ലെന്ന ഉറപ്പ് നൽകുന്നു.
theological_decisions:
- issue: Πᾶς ὁ πιστεύων എന്ന പുല്ലിംഗ ഏകവചന പൊതുപ്രയോഗം
  choice: വിശ്വസിക്കുന്ന ഏവനും
  alternative: വിശ്വസിക്കുന്ന ഓരോ പുരുഷനും
  rationale: ഗ്രീക്ക് വ്യാകരണരൂപം പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല; വിശ്വസിക്കുന്ന എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗമാണ്.
- issue: αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: അവനിൽ
  alternative: മിശിഹായിൽ / കർത്താവിൽ
  rationale: സന്ദർഭത്തിൽ സൂചിതൻ വ്യക്തമാണെങ്കിലും, മൂലപാഠത്തിലെ സർവനാമരൂപം നിലനിർത്തുന്നത് ഉദ്ധരണിയുടെ രൂപവും യഥാർഥമായ സൂചനയും സംരക്ഷിക്കുന്നു.
- issue: καταισχυνθήσεται എന്നതിലെ ലജ്ജയുടെ സ്വഭാവം
  choice: ലജ്ജിതരാക്കപ്പെടുകയില്ല
  alternative: ലജ്ജിക്കുകയില്ല
  rationale: ഗ്രീക്കിലെ കർമണിരൂപം പൊതുവായ വികാരലജ്ജയെക്കാൾ അന്തിമമായി അപമാനിതനാക്കപ്പെടാത്തതും ന്യായീകരിക്കപ്പെടുന്നതുമായ ആശയം സൂചിപ്പിക്കാം; ഈ ഭാവം പ്രധാനപാഠത്തിൽ നിലനിർത്തി മറ്റൊരു സാധുവായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ‘എന്തെന്നാൽ’ വാദബന്ധം സൂക്ഷിക്കുന്നു; ‘തിരുവെഴുത്ത് പറയുന്നു’ ഉദ്ധരണിസൂത്രമായി സ്വാഭാവികമാണ്. ഉൾക്കൊള്ളുന്ന പൊതുപ്രയോഗത്തിനായി ‘ഏവനും’ ഉപയോഗിച്ചു.
