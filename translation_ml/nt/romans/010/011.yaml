review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the citation formula, the universal substantival participle, faith directed toward the pronoun's referent, and the future negation. However, «ലജ്ജിതരാക്കപ്പെടുകയില്ല» is an awkward Malayalam rendering and uses a pluralized passive expression after the singular generic «ഏവനും».
  naturalness: «എന്തെന്നാൽ തിരുവെഴുത്ത് പറയുന്നു» and «അവനിൽ വിശ്വസിക്കുന്ന ഏവനും» are natural modern standard Malayalam. Replacing the cumbersome «ലജ്ജിതരാക്കപ്പെടുകയില്ല» with «അപമാനിതനാകുകയില്ല» gives an idiomatic generic-singular expression while conveying the public-shame/vindication force of καταισχυνθήσεται.
  terminology: «തിരുവെഴുത്ത്» is appropriate for ἡ γραφή, and «അവനിൽ വിശ്വസിക്കുന്ന» is an established, natural rendering of πιστεύων ἐπ’ αὐτῷ. «അപമാനിതനാകുകയില്ല» better conveys being put to shame than a merely inward feeling of embarrassment.
  issues:
  - severity: medium
    issue: The main-clause rendering «ലജ്ജിതരാക്കപ്പെടുകയില്ല» is grammatically and stylistically strained.
    rationale: It combines the generic singular subject «ഏവനും» with a pluralized passive form and is not idiomatic modern Malayalam. The Greek future passive denotes not being put to shame; «അപമാനിതനാകുകയില്ല» communicates this naturally without adding interpretation.
