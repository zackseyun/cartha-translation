  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അവരെക്കുറിച്ച് ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു: അവർക്കു ദൈവത്തോടുള്ള തീക്ഷ്ണതയുണ്ട്[a]; എന്നാൽ അത് പരിജ്ഞാനത്തിന് അനുസൃതമല്ല[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ദൈവത്തിന്റെ തീക്ഷ്ണത.” ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തി കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ ദൈവത്തോടുള്ള തീക്ഷ്ണത എന്നാണ് കൂടുതൽ സാധ്യതയുള്ള അർഥം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “പൂർണമായ അറിവിനൊത്തതല്ല” അഥവാ “അറിവിനെ അടിസ്ഥാനമാക്കിയുള്ളതല്ല.”
    reason: lexical_alternative
lexical_decisions:
