  choice: ഞാൻ സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: വർത്തമാനകാലത്തിലെ നേരിട്ടുള്ള സാക്ഷ്യപ്രസ്താവനയുടെ തെളിവുനൽകുന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
