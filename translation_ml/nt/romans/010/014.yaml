id: ROM.10.14
reference: Romans 10:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: ml
  text: അപ്പോൾ, അവർ വിശ്വസിച്ചിട്ടില്ലാത്തവനെ എങ്ങനെ വിളിച്ചപേക്ഷിക്കും? അവർ ആരെക്കുറിച്ച് കേട്ടിട്ടില്ലയോ, അവനിൽ എങ്ങനെ വിശ്വസിക്കും?[a] ഒരാൾ പ്രഘോഷിക്കാതെ അവർ എങ്ങനെ കേൾക്കും?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “അവർ ആരുടെ കാര്യം കേട്ടിട്ടില്ലയോ, അവനിൽ എങ്ങനെ വിശ്വസിക്കും?”'
    reason: οὗ എന്ന ജനിറ്റീവ് ബന്ധസർവനാമം കേൾവിയുടെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നു. “ആരെക്കുറിച്ച്” എന്ന മുഖ്യപാഠം സ്വാഭാവികമാണ്; “ആരുടെ കാര്യം” കൂടുതൽ രൂപസമീപമായ ഒരു മലയാള ബദലാണ്.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: അപ്പോൾ ... എങ്ങനെ
  rationale: οὖν എന്നതിന്റെ നിഗമനാത്മക ബന്ധവും തുടർച്ചയായ ആലങ്കാരിക ചോദ്യങ്ങളുടെ സ്വാഭാവിക മലയാളരൂപവും നിലനിർത്തുന്നു.
- source_word: ἐπικαλέσωνται
  choice: വിളിച്ചപേക്ഷിക്കും
  rationale: കർത്താവിനെ വിളിക്കുകയും സഹായത്തിനായി അഭയം തേടുകയും ചെയ്യുന്ന ആശയം ഉൾക്കൊള്ളുന്ന, സന്ദർഭത്തിന് യോജിച്ച മലയാളപ്രയോഗം.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: തങ്ങൾ വിശ്വസിച്ചിട്ടില്ലാത്തവനെ
  rationale: മലയാളത്തിൽ ἐπικαλέομαι എന്ന ക്രിയയുടെ കർമം സ്വാഭാവികമായി അവതരിപ്പിക്കുമ്പോഴും, വിളിച്ചപേക്ഷിക്കുന്നതിന് മുമ്പ് വിശ്വാസം വേണമെന്ന വാക്യത്തിന്റെ യുക്തിക്രമം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: πιστεύσωσιν
  choice: വിശ്വസിക്കും
  rationale: πιστεύω എന്ന വിശ്വാസഭാഷയുടെ സാധാരണവും നേരിട്ടുള്ളതുമായ മലയാളസമാനപദം; ആലങ്കാരിക ചോദ്യത്തിലെ subjunctive ഭാവം മലയാളത്തിലെ ഭാവികാലചോദ്യത്തിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: οὗ οὐκ ἤκουσαν
  choice: തങ്ങൾ കേട്ടിട്ടില്ലാത്തവനിൽ
  rationale: οὗ എന്ന ജനിറ്റീവ് ബന്ധസർവനാമത്തിന്റെ വ്യക്തിയെ നേരിട്ട് കേൾക്കുക എന്ന സാധ്യത മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ‘അവനെക്കുറിച്ച്’ എന്ന സന്ദേശകേന്ദ്രിത വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: χωρὶς κηρύσσοντος
  choice: ഒരാൾ പ്രഘോഷിക്കാതെ
  rationale: κηρύσσοντος ഒരു പദവിയെക്കാൾ പ്രഘോഷണപ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രസംഗകൻ ഇല്ലാതെ’ എന്നതിനു പകരം പ്രവർത്തനരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: πιστεύω എന്ന വിശ്വാസഭാഷ
  choice: വിശ്വസിക്കുക
  alternative: ആശ്രയിക്കുക / വിശ്വാസം അർപ്പിക്കുക
  rationale: പൗലോസിന്റെ വിശ്വാസസംബന്ധിയായ പദശൃംഖല വ്യാഖ്യാനാത്മകമായി വികസിപ്പിക്കാതെ, സാധാരണ ബൈബിൾ-മലയാളത്തിലും ആധുനിക ഭാഷയിലും വ്യക്തമായ ‘വിശ്വസിക്കുക’ ഉപയോഗിക്കുന്നു.
- issue: οὗ οὐκ ἤκουσαν എന്നതിലെ കേൾവിയുടെ വിഷയം
  choice: തങ്ങൾ കേട്ടിട്ടില്ലാത്തവനിൽ
  alternative: ആരെക്കുറിച്ച് അവർ കേട്ടിട്ടില്ലയോ, അവനിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന് വ്യക്തിയെ കേൾക്കുക എന്നും ആ വ്യക്തിയെക്കുറിച്ചുള്ള സന്ദേശം കേൾക്കുക എന്നും ഗ്രഹിക്കാവുന്ന യഥാർത്ഥ ഭാഷാതല പിരിമുറുക്കമുണ്ട്. മുഖ്യപാഠം കൂടുതൽ രൂപസമീപമായ വായന സ്വീകരിക്കുകയും മറ്റേ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ഗൗരവമുള്ള ശൈലി ഉപയോഗിച്ചു. ‘വിളിച്ചപേക്ഷിക്കുക’, ‘പ്രഘോഷിക്കുക’ എന്നീ പദങ്ങൾ സന്ദർഭത്തിന്റെ മതപരമായ ഭാവം നിലനിർത്തുമ്പോഴും അനാവശ്യമായ സഭാപദവി അർഥം ചേർക്കുന്നില്ല.
