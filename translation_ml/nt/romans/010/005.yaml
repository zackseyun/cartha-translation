id: ROM.10.5
reference: Romans 10:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: ml
  text: 'കാരണം, ന്യായപ്രമാണത്തിൽനിന്നുള്ള നീതിയെക്കുറിച്ച് മോശ എഴുതുന്നു: “അതിനെ ആചരിക്കുന്ന മനുഷ്യൻ അതിൽ ജീവിക്കും.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്നതിന് ‘ന്യായം’ എന്നും വിവർത്തനം ചെയ്യാം (δικαιοσύνη).
    reason: lexical_alternative
  - marker: b
    text: ‘മനുഷ്യൻ’ എന്നത് ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണ്; ഇവിടെ അത് ആചരിക്കുന്ന ഏത് വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ഗ്രീക്കിൽ ‘അതിൽ’ എന്നത് ഏകവചനമാണ്. പൗലോസ് ലേവ്യർ 18:5 പ്രതിധ്വനിപ്പിക്കുന്നു; അതിനാൽ ‘അവയിൽ’ അല്ലെങ്കിൽ ‘അവയാൽ’ എന്ന വ്യാഖ്യാനപരമായ വായനയും സാധ്യമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വാദത്തിന് വിശദീകരണാധിഷ്ഠിതമായ ബന്ധം നൽകുന്നു.
- source_word: γράφει
  choice: എഴുതുന്നത് ഇങ്ങനെയാണ്
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന വർത്തമാനകാല പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവസന്നിധിയിലെ ശരിയായ നിലയും നീതിപരമായ അർഥവും ഉൾക്കൊള്ളുന്ന പതിവ് മലയാള പദം.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്നുള്ള
  rationale: ἐκ സൂചിപ്പിക്കുന്ന ഉറവിടം നിലനിർത്തുകയും തുടർന്നുള്ള വിശ്വാസത്തിൽനിന്നുള്ള നീതിയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: νόμου
  choice: ന്യായപ്രമാണം
  rationale: സന്ദർഭത്തിൽ മോശയുടെ നിയമസംഹിതയെ സൂചിപ്പിക്കുന്ന പരിചിതമായ ബൈബിൾ മലയാളപ്രയോഗം.
- source_word: ὁ ποιήσας
  choice: അനുഷ്ഠിക്കുന്ന
  rationale: കല്പനകൾ പ്രവൃത്തിയിൽ ആക്കുന്ന വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന പൊതുതത്ത്വം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ ഏകവചന പ്രതിനിധിപ്രയോഗം നിലനിർത്തുന്നു; ഇത് ഏതൊരു മനുഷ്യനെയും ഉൾക്കൊള്ളുന്നു.
- source_word: ζήσεται
  choice: ജീവിക്കും
  rationale: ഭാവികാലവും ലേവ്യപുസ്തകത്തിലെ ഉദ്ധരണിയുടെ ജീവൻ സംബന്ധിച്ച ശക്തിയും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν αὐτῇ
  choice: അവയാൽ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ സർവനാമം ഏകവചനമാണെങ്കിലും, ലേവ്യർ 18:5-ലെ കല്പനകൾ അനുഷ്ഠിച്ച് ജീവിക്കുക എന്ന ഉദ്ധരണിസന്ദർഭം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വൈരുധ്യത്തിൽ δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: നീതീകരണം; ന്യായം
  rationale: ‘നീതി’ എന്നത് പദത്തിന്റെ വിശാലമായ അർഥവും 10:6-ലെ വിശ്വാസത്തിൽനിന്നുള്ള നീതിയുമായുള്ള ആശയബന്ധവും നിലനിർത്തുന്നു; ‘നീതീകരണം’ ഇവിടെ അനാവശ്യമായി വ്യാഖ്യാനം ചുരുക്കും.
- issue: ἄνθρωπος എന്നതിന്റെ പ്രതിനിധിസ്വഭാവം
  choice: മനുഷ്യൻ
  alternative: വ്യക്തി
  rationale: മൂലത്തിലെ ഏകവചന മനുഷ്യസൂചന നിലനിർത്തിക്കൊണ്ട് അത് ഏതു വ്യക്തിയെയും പ്രതിനിധീകരിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐν αὐτῇ എന്ന ഏകവചനരൂപവും ലേവ്യർ 18:5-ലെ പ്രതിധ്വനിയും
  choice: അവയാൽ
  alternative: അതിൽ
  rationale: വ്യാകരണരൂപം ഏകവചനമാണെങ്കിലും, ഉദ്ധരിക്കപ്പെടുന്ന കല്പനകൾ അനുഷ്ഠിക്കുന്നതിലൂടെ ജീവിക്കുക എന്ന ഉറവിടസന്ദർഭത്തിലെ അർഥം പ്രധാനപാഠത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തി; സങ്കീർണമായ നാമവാക്യഘടന ഒഴിവാക്കി ഉദ്ധരണി വ്യക്തമായി അവതരിപ്പിച്ചു.
