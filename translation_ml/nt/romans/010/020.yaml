id: ROM.10.20
reference: Romans 10:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: ml
  text: 'എന്നാൽ യെശയ്യാവ് വളരെ ധൈര്യത്തോടെ പറയുന്നു: “എന്നെ അന്വേഷിക്കാതിരുന്നവർ എന്നെ കണ്ടെത്തി[a]; എന്നെക്കുറിച്ച് ചോദിക്കാതിരുന്നവർക്ക് ഞാൻ പ്രത്യക്ഷനായി[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നെ അന്വേഷിക്കാതിരുന്നവരുടെ ഇടയിൽ ഞാൻ കണ്ടെത്തപ്പെട്ടു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “എന്നെക്കുറിച്ച് ചോദിക്കാതിരുന്നവർക്ക് ഞാൻ എന്നെത്തന്നെ വെളിപ്പെടുത്തി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: വളരെ ധൈര്യത്തോടെ പറയുന്നു
  rationale: ക്രിയയിലെ ധൈര്യപ്പെടുക/തുനിയുക എന്ന ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വർത്തമാനകാലത്തിന്റെ സജീവതയും നിലനിർത്തുന്നു.
- source_word: Εὑρέθην
  choice: എന്നെ കണ്ടെത്തി
  rationale: ഗ്രീക്കിലെ ഒന്നാംപുരുഷ ഏകവചന ഭൂതകാല കർമണി രൂപത്തിന്റെ അർഥം മലയാളത്തിലെ സ്വാഭാവിക പ്രയോഗത്തിൽ നൽകുന്നു. ‘ഞാൻ കണ്ടെത്തപ്പെട്ടു’ എന്നത് കൂടുതൽ രൂപാനുസൃതമായെങ്കിലും അസ്വാഭാവികമാണ്.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: എന്നെ അന്വേഷിക്കാതിരുന്നവർ
  rationale: ἐν എന്നതിനെ ഇവിടെ കർമണി ആശയത്തോടു ചേർന്ന വ്യക്തിസൂചനയായി മനസ്സിലാക്കുന്നു; ‘അന്വേഷിക്കാതിരുന്നവരുടെ ഇടയിൽ’ എന്ന രൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ζητοῦσιν
  choice: അന്വേഷിക്കാതിരുന്നവർ
  rationale: ζητέωയുടെ അന്വേഷിക്കുക/തേടുക എന്ന ആശയം dignified ആയ സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐμφανὴς ἐγενόμην
  choice: ഞാൻ പ്രത്യക്ഷനായി
  rationale: ‘വെളിപ്പെട്ടവനായി/പ്രകടനായി’ എന്ന ആശയം അമിത വ്യാഖ്യാനം കൂടാതെ സ്വാഭാവികമായി നൽകുന്നു; ദൈവം തന്നെത്താൻ അറിയിച്ചുവെന്ന കൂടുതൽ സജീവമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπερωτῶσιν
  choice: എന്നെക്കുറിച്ച് ചോദിക്കാതിരുന്നവർക്ക്
  rationale: ചോദിക്കുക/അന്വേഷിച്ചറിയുക എന്ന പൊതുവായ അർഥം നിലനിർത്തുകയും ‘വിളിച്ചപേക്ഷിക്കുക’ എന്ന പ്രത്യേക ദൈവശാസ്ത്രാർഥം ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള വൈരുധ്യം മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: Ἠσαΐας
  choice: യെശയ്യാവ്
  rationale: മലയാള ബൈബിൾ വായനയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: യെശയ്യാ ഉദ്ധരണിയിലെ ദൈവിക സ്വയംവെളിപ്പെടുത്തലിന്റെ വിവർത്തനം
  choice: എന്നെക്കുറിച്ച് ചോദിക്കാതിരുന്നവർക്ക് ഞാൻ പ്രത്യക്ഷനായി
  alternative: എന്നെക്കുറിച്ച് ചോദിക്കാതിരുന്നവർക്ക് ഞാൻ എന്നെത്തന്നെ വെളിപ്പെടുത്തി
  rationale: ഗ്രീക്ക് പദപ്രയോഗം പ്രത്യക്ഷത/പ്രകടതയെ നേരിട്ട് പറയുന്നു; വ്യക്തമായ സ്വയംകാരണപ്രയോഗം ചേർക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ രൂപവും ദൈവിക സ്വയംവെളിപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഉദ്ധരണിയുടെ സമാന്തരഘടന നിലനിർത്തി; കഠിനമായ കർമണി രൂപം മുഖ്യവാചകത്തിൽ സ്വാഭാവിക മലയാളമാക്കി, രൂപസമീപമായ സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
