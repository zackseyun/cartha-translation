id: ROM.10.16
reference: Romans 10:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: ml
  text: 'എന്നാൽ എല്ലാവരും സുവാർത്ത[a] അനുസരിച്ചില്ല. കാരണം യെശയ്യാവ് പറയുന്നു: “കർത്താവേ, ഞങ്ങളുടെ സന്ദേശം[b] ആർ വിശ്വസിച്ചു?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സുവിശേഷം.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഞങ്ങളുടെ വാർത്ത”; അക്ഷരാർഥത്തിൽ, “ഞങ്ങളുടെ കേൾവി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: οὐ πάντες
  choice: എല്ലാവരും … ഇല്ല
  rationale: ഗ്രീക്കിലെ ഭാഗിക നിഷേധം കാത്തുസൂക്ഷിക്കുന്നു; ആരും അനുസരിച്ചില്ല എന്ന സമ്പൂർണ നിഷേധം അർഥമാക്കുന്നില്ല.
- source_word: ὑπήκουσαν
  choice: അനുസരിച്ചില്ല
  rationale: കേവലം കേൾക്കുക എന്നതിലുപരി അനുസരണയോടെയുള്ള പ്രതികരണമാണ് ὑπακούω സൂചിപ്പിക്കുന്നത്.
- source_word: τῷ εὐαγγελίῳ
  choice: സുവാർത്ത
  rationale: εὐαγγέλιον എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥം ആധുനിക മലയാളത്തിൽ സുതാര്യമായി നൽകുന്നു; പരമ്പരാഗതമായ ‘സുവിശേഷം’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Ἠσαΐας
  choice: യെശയ്യാവ്
  rationale: പ്രവാചകന്റെ പേരിന്റെ മലയാളത്തിലെ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: തൊട്ടുമുമ്പുള്ള പ്രസ്താവനയ്ക്ക് തിരുവെഴുത്തിൽനിന്നുള്ള ആധാരം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: തിരുവെഴുത്തിന്റെ സജീവ സാക്ഷ്യത്തെ പ്രതിഫലിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലം നിലനിർത്തുന്നു.
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: സംബോധനാവിഭക്തിയുടെ സ്വാഭാവികവും ആദരപൂർവവുമായ മലയാളരൂപം.
- source_word: τίς
  choice: ആർ
  rationale: ചോദ്യസർവനാമത്തിന്റെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: ഉദ്ധരണിയിലെ ഗ്രീക്ക് എയോറിസ്റ്റിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ഭൂതകാലരൂപത്തിൽ നൽകുന്നു.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: ഞങ്ങളുടെ സന്ദേശം
  rationale: ἀκοή ഇവിടെ കേൾക്കപ്പെട്ട പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കത്തെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭം കാണിക്കുന്നു; പദത്തിന്റെ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ὑπήκουσαν τῷ εὐαγγελίῳ ആവശ്യപ്പെടുന്ന പ്രതികരണത്തിന്റെ സ്വഭാവം
  choice: ‘സുവാർത്ത അനുസരിച്ചില്ല’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘സുവാർത്ത കേട്ടില്ല’ അല്ലെങ്കിൽ ‘സുവാർത്ത ചെവിക്കൊണ്ടില്ല.’
  rationale: ഗ്രീക്ക് ക്രിയ അനുസരണത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു. രക്ഷയുടെ പ്രവർത്തനക്രമത്തെക്കുറിച്ചുള്ള ഏതെങ്കിലും വിഭാഗീയ നിലപാട് ചേർക്കാതെ വിശ്വാസവും അനുസരണപരമായ പ്രതികരണവും തമ്മിലുള്ള പൗലോസിന്റെ ബന്ധം ഇത് സംരക്ഷിക്കുന്നു.
- issue: യെശയ്യാവിന്റെ ഉദ്ധരണിയിലെ ἀκοή എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാന പാഠത്തിൽ ‘സന്ദേശം’ എന്ന് നൽകി.
  alternative: ‘വാർത്ത’ അല്ലെങ്കിൽ അക്ഷരാർഥത്തിൽ ‘കേൾവി.’
  rationale: ഈ പദത്തിന് കേൾക്കുന്ന പ്രവൃത്തിയെയോ കേൾക്കപ്പെടുന്ന ഉള്ളടക്കത്തെയോ സൂചിപ്പിക്കാം. ഇവിടെ പ്രഖ്യാപിക്കപ്പെട്ട ഉള്ളടക്കം എന്ന അർഥം മലയാളത്തിൽ ഏറ്റവും സ്വാഭാവികമാണ്; യഥാർഥമായ പദാർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘സുവാർത്ത’ സാധാരണ വായനക്കാർക്ക് സുതാര്യമാണ്; ‘സുവിശേഷം’ എന്ന പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു. ഇംഗ്ലീഷ് consultation layer-ൽ [b] ‘Lord’ എന്നതിനുശേഷം കാണുന്നുണ്ടെങ്കിലും അതിന്റെ അടിക്കുറിപ്പ് ἀκοή/‘message’ നെക്കുറിച്ചുള്ളതിനാൽ, ഉറവിടഗ്രീക്കിനും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കത്തിനും അനുസരിച്ച് [b] ‘സന്ദേശം’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
