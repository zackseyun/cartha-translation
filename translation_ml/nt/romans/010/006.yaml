id: ROM.10.6
reference: Romans 10:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: ml
  text: 'എന്നാൽ വിശ്വാസത്തിൽനിന്നുള്ള നീതി[a] ഇങ്ങനെ പറയുന്നു: “നിന്റെ ഹൃദയത്തിൽ, ‘ആർ സ്വർഗത്തിലേക്കു കയറിപ്പോകും?’ എന്നു പറയരുത്”[c]—അതായത്, മശീഹയെ[b] താഴേക്ക് കൊണ്ടുവരാൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നീതി’ എന്നതിന് ‘ന്യായം’ എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ ഗ്രീക്ക് പദത്തിന് ഇരു അർത്ഥഛായകളും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തു’; ഇവിടെ Χριστός ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: c
    text: പൗലോസ് ആവർത്തനപുസ്തകം 30:12 പ്രതിധ്വനിപ്പിച്ച് അത് മശീഹയുമായി ബന്ധപ്പെടുത്തി പ്രയോഗിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലുള്ള ധാർമ്മികവും ന്യായവിധിസംബന്ധവുമായ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം; ‘ന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്തിൽനിന്നുള്ള
  rationale: ἐκ എന്ന ഉറവിടസൂചന നേരിട്ട് നിലനിർത്തുകയും ന്യായപ്രമാണത്തെ അടിസ്ഥാനമാക്കിയ നീതിയോടുള്ള സന്ദർഭപരമായ വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: οὕτως λέγει
  choice: ഇങ്ങനെ പറയുന്നു
  rationale: നീതിയെ സംസാരിക്കുന്നതായി അവതരിപ്പിക്കുന്ന മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരണം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: നിന്റെ ഹൃദയത്തിൽ … എന്നു പറയരുത്
  rationale: ചിന്തയുടെയും ഉദ്ദേശ്യത്തിന്റെയും കേന്ദ്രമെന്ന ഹൃദയത്തിന്റെ തിരുവെഴുത്തുപരമായ പ്രയോഗവും ആവർത്തനനിയമത്തിലെ ഉദ്ധരണിയുടെ രൂപവും സംരക്ഷിക്കുന്നു.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: ആർ സ്വർഗത്തിലേക്കു കയറിപ്പോകും?
  rationale: ἀναβαίνω എന്ന മുകളിലേക്കുള്ള ചലനവും εἰς എന്ന ലക്ഷ്യദിശയും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Χριστόν
  choice: മശീഹയെ
  rationale: ഇവിടെ Χριστός വ്യക്തിനാമസദൃശമായ പ്രയോഗത്തേക്കാൾ അഭിഷിക്തൻ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: καταγαγεῖν
  choice: താഴേക്ക് കൊണ്ടുവരാൻ
  rationale: ക്രിയയുടെ ദിശാസൂചനയും വിശദീകരണാത്മകമായ അനന്തക്രിയാരൂപവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വിശ്വാസത്തിൽനിന്നുള്ള നീതി’യുടെ വ്യക്തിവൽക്കരണം
  choice: ‘വിശ്വാസത്തിൽനിന്നുള്ള നീതി ഇങ്ങനെ പറയുന്നു’ എന്ന് നിലനിർത്തി.
  alternative: ‘വിശ്വാസത്താലുള്ള നീതി പറയുന്നത് ഇതാണ്’ എന്ന കൂടുതൽ അമൂർത്തമായ രൂപം.
  rationale: δικαιοσύνη ആണ് λέγει എന്ന ക്രിയയുടെ വ്യാകരണകർത്താവ്; പൗലോസിന്റെ വാഗ്‌ശൈലിയും മുൻവാക്യത്തോടുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: തിരുവെഴുത്തുവ്യാഖ്യാനപരമായ ഈ സന്ദർഭത്തിൽ പദം ഒരു പദവിയായി പ്രവർത്തിക്കുന്നു; അതിനാൽ അതിന്റെ അർത്ഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ തെരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ വ്യക്തിവൽക്കരണവും ഉദ്ധരണിയുടെ ആന്തരിക ചോദ്യരൂപവും വിശദീകരണത്തിന്റെ സംക്ഷിപ്തതയും പരമാവധി നിലനിർത്തി.
