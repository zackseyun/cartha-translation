  naturalness: വാചകം ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്. ഉദ്ധരണിക്കുള്ളിലെ ഉദ്ധരണി, ചോദ്യം, വിശദീകരണഡാഷ് എന്നിവ വായനയെ തടസ്സപ്പെടുത്തുന്നില്ല. ‘കയറിപ്പോകും’ സ്വർഗാരോഹണത്തിന്റെ ദിശാഭാവം വ്യക്തമായി നൽകുന്നു.
