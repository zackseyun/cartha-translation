  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവിന്റെ നാമം വിളിച്ചപേക്ഷിക്കുന്ന ഏവനും രക്ഷിക്കപ്പെടും.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പൗലോസ് യോവേൽ 2:32 ഉദ്ധരിക്കുകയാണ്. യോവേലിൽ ഇവിടെ സൂചിപ്പിക്കുന്നത് YHWH-നെയാണ് (‘യഹോവ’); എന്നാൽ ഈ സന്ദർഭത്തിൽ പൗലോസ് ഈ വചനം യേശുവിനോടു ബന്ധപ്പെടുത്തുന്നു.
    reason: cross_reference
  - marker: b
    text: അഥവാ, ‘വിളിച്ചാശ്രയിക്കുന്ന.’ നാമം വിളിക്കുക എന്ന ഗ്രീക്ക് പ്രയോഗം കർത്താവിനെ നാമം ചൊല്ലി വിളിച്ചപേക്ഷിക്കുകയോ അവിടുത്തെ സഹായം തേടുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: ഏവനും
  rationale: ഈ ഘടനയുടെ പൊതുവായ, സർവരെയും ഉൾക്കൊള്ളുന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് തിരുവെഴുത്തിൽനിന്നുള്ള വിശദീകരണമോ പിന്തുണയോ അവതരിപ്പിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: ἐπικαλέσηται
  choice: വിളിച്ചപേക്ഷിക്കുന്ന
  rationale: വെറുതെ വിളിക്കുക എന്നതിലുപരി, നാമം ഉച്ചരിച്ച് സഹായത്തിനായി അഭയം തേടുകയോ പ്രാർഥിക്കുകയോ ചെയ്യുന്ന ബൈബിൾപ്രയോഗത്തിന്റെ ഭാവം നൽകുന്നു.
- source_word: τὸ ὄνομα
  choice: നാമം
  rationale: വെളിപ്പെടുത്തപ്പെട്ട വ്യക്തിത്വത്തെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്ന തിരുവെഴുത്തിലെ സ്ഥിരപ്രയോഗം അക്ഷുണ്ണമായി നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: ഗ്രീക്കിലെ κύριος എന്ന പദം അതുപോലെ പരിഭാഷപ്പെടുത്തുന്നു; മുഖ്യവാചകത്തിൽ 'യേശു' എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം ചേർക്കുന്നില്ല.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപവും റോമർലേഖനത്തിലെ രക്ഷാസംബന്ധമായ അർഥവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യോവേൽ ഉദ്ധരണിയിലെ ‘കർത്താവ്’ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യവാചകത്തിൽ ‘കർത്താവ്’ എന്നു നിലനിർത്തി, റോമർ 10-ന്റെ സന്ദർഭത്തിൽ പൗലോസ് ഈ വചനം യേശുവിനോടു ബന്ധപ്പെടുത്തുന്നതായി അടിക്കുറിപ്പിൽ അറിയിക്കുക.
  alternative: ‘യഹോവ’ എന്നോ ‘കർത്താവായ യേശു’ എന്നോ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κυρίου മാത്രമാണ്. യോവേൽ 2:32-ൽ ഇത് YHWH-നെ സൂചിപ്പിക്കുമ്പോൾ, റോമർ 10-ന്റെ സമീപസന്ദർഭം ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു. ഉറവിടപാഠത്തിലെ സംക്ഷിപ്തതയും അന്തർപാഠപരമായ ദൈവശാസ്ത്ര സമ്മർദവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വിളിച്ചപേക്ഷിക്കുന്ന’ എന്നത് തിരുവെഴുത്തിലെ പ്രാർഥനാപരമായ ഭാവം സൂക്ഷിക്കുന്നു; ‘ഏവനും’ സർവവ്യാപകത സ്വാഭാവികമായി അറിയിക്കുന്നു.
