id: ROM.10.17
reference: Romans 10:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: ml
  text: അതിനാൽ വിശ്വാസം കേൾവിയിൽനിന്നാണ് ഉണ്ടാകുന്നത്; കേൾവിയാകട്ടെ മശീഹയുടെ വചനത്തിലൂടെയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മശീഹയെക്കുറിച്ചുള്ള വചനത്തിലൂടെ” / “മശീഹയെ സംബന്ധിച്ച സന്ദേശത്തിലൂടെ.” ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിബന്ധം ഒന്നിലധികം വിധങ്ങളിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: അതിനാൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്ന അനുമാനസൂചക അവ്യയത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: റോമർ 10:14–16-ലെ പശ്ചാത്തലത്തിൽ പ്രസംഗിക്കപ്പെട്ട സുവിശേഷം കേൾക്കുന്നതിനുള്ള മനുഷ്യന്റെ പ്രതികരണത്തെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്.
- source_word: ἐξ ἀκοῆς
  choice: കേൾവിയിൽനിന്ന് ഉണ്ടാകുന്നു
  rationale: ἐκ/ἐξ ഉത്ഭവമോ ഉറവിടമോ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ക്രിയാരഹിത പ്രയോഗം സ്വാഭാവിക മലയാളത്തിനായി ‘ഉണ്ടാകുന്നു’ എന്നു പൂരിപ്പിച്ചു.
- source_word: ἀκοή
  choice: കേൾവി
  rationale: കേൾക്കുന്ന പ്രവൃത്തിയെയും കേട്ട സന്ദേശത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്ന പദമാണ്. മുഖ്യപാഠത്തിൽ ഒരേ മലയാളപദം നിലനിർത്തുന്നത് ഗ്രീക്കിലെ ആവർത്തനം സംരക്ഷിക്കുന്നു.
- source_word: δὲ
  choice: യാകട്ടെ
  rationale: രണ്ടാം വാക്യാംശത്തിലേക്കുള്ള മൃദുവായ മാറ്റം സൂചിപ്പിക്കുന്നു; ശക്തമായ വിരോധം സൃഷ്ടിക്കുന്നില്ല.
- source_word: διὰ
  choice: ലൂടെ
  rationale: ഷഷ്ഠിയോടുകൂടിയ διά ഇവിടെ മാർഗമോ മാധ്യമമോ സൂചിപ്പിക്കുന്നു.
- source_word: ῥήματος
  choice: വചനം
  rationale: പറയപ്പെട്ട വാക്കിനെയോ ഉച്ചാരണത്തെയോ സൂചിപ്പിക്കുന്ന ῥῆμαയുടെ പരമ്പരാഗത ഗൗരവവും പ്രസംഗസന്ദർഭവും നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി വരുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി. ഷഷ്ഠീരൂപത്തിന്റെ അടിസ്ഥാനഘടന മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം പ്രസംഗം കേട്ട് വിശ്വസിക്കുന്നതിനെക്കുറിച്ചായതിനാൽ ‘വിശ്വാസം’ ഏറ്റവും അനുയോജ്യം; ‘വിശ്വസ്തത’ എന്ന അർഥം ഇവിടെ പ്രധാനമല്ല.
- issue: ῥήματος Χριστοῦ എന്ന പ്രയോഗത്തിലെ ഷഷ്ഠീബന്ധം
  choice: മശീഹയുടെ വചനം
  alternative: മശീഹയെക്കുറിച്ചുള്ള വചനം; മശീഹയെ സംബന്ധിച്ച സന്ദേശം
  rationale: ഗ്രീക്ക് പ്രയോഗം മശീഹയിൽനിന്നുള്ള വചനം എന്നോ മശീഹയെക്കുറിച്ചുള്ള സന്ദേശം എന്നോ മനസ്സിലാക്കാം. മുഖ്യപാഠം കൂടുതൽ രൂപസമാനമായ വായന നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ ἀκοή എന്ന പദത്തിന്റെ ആവർത്തനം ‘കേൾവി’ എന്നു നിലനിർത്തി; വ്യാകരണപരമായി ആവശ്യമായ ‘ഉണ്ടാകുന്നു’ ചേർത്തു.
