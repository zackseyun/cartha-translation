source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], എന്റെ ഹൃദയത്തിന്റെ ആഗ്രഹവും അവർക്കുവേണ്ടി ദൈവത്തോടുള്ള എന്റെ പ്രാർഥനയും അവരുടെ രക്ഷയ്ക്കായാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ പുല്ലിംഗ ബഹുവചനരൂപമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്, എന്നാൽ അതിന് സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട ഒരു സമൂഹത്തെ അഭിസംബോധന ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ἀδελφός എന്ന പദത്തിന്റെ സംബോധന ബഹുവചനത്തിലെ പുല്ലിംഗരൂപം നിലനിർത്തുന്നു. സഭയിലെ സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെടുന്ന സമൂഹത്തെ ഇതു അഭിസംബോധന ചെയ്യാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εὐδοκία
  choice: ആഗ്രഹം
  rationale: ഇവിടെ പൗലോസ് ഉള്ളിൽനിന്ന് ആഗ്രഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘ആഗ്രഹം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: τῆς ἐμῆς καρδίας
  choice: എന്റെ ഹൃദയത്തിന്റെ
  rationale: മൂലത്തിലെ ജനിറ്റീവ് ബന്ധം നേരിട്ട് സംരക്ഷിക്കുന്ന, മലയാളത്തിൽ മനസ്സിലാകുന്ന പ്രയോഗം.
- source_word: δέησις
  choice: പ്രാർഥന
  rationale: ഈ പദത്തിന് അപേക്ഷയെന്ന ഊന്നലുണ്ടെങ്കിലും, ദൈവത്തോടുള്ള അപേക്ഷയെ മലയാളത്തിൽ സ്വാഭാവികമായി ‘പ്രാർഥന’ എന്നു പറയുന്നു.
- source_word: πρὸς τὸν θεόν
  choice: ദൈവത്തോടുള്ള
  rationale: πρός ഇവിടെ പ്രാർഥനയുടെ ദിശയെയും സ്വീകർത്താവിനെയും സൂചിപ്പിക്കുന്നു; നാമപദഘടനയിൽ ‘ദൈവത്തോടുള്ള’ സ്വാഭാവികമാണ്.
- source_word: ὑπὲρ αὐτῶν
  choice: അവർക്കുവേണ്ടി
  rationale: ὑπέρ സൂചിപ്പിക്കുന്ന പ്രയോജനാർത്ഥമോ പ്രതിനിധാനപരമോ ആയ ബന്ധം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: αὐτῶν
  choice: അവർ
  rationale: സർവനാമത്തിന്റെ സൂചിതർ മുൻസന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നതിനാൽ ‘ഇസ്രായേൽ’ എന്ന നാമം വാക്യത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ സർവനാമം നിലനിർത്തുന്നു.
- source_word: εἰς σωτηρίαν
  choice: അവരുടെ രക്ഷയ്ക്കായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യം വ്യക്തമാക്കുകയും രക്ഷ അവരുമായി ബന്ധപ്പെട്ടതാണെന്ന സ്വാഭാവിക അർത്ഥം പകർന്നുനൽകുകയും ചെയ്യുന്നു.
- source_word: μέν
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ μέν ലഘുവായ വ്യവഹാരസൂചനയാണ്; വാക്യത്തിൽ വ്യക്തമായ δέ-പ്രതിയോഗിയില്ല. മലയാളത്തിൽ പ്രത്യേക പദം ചേർത്താൽ അനാവശ്യമായ ഊന്നൽ ഉണ്ടാകും.
theological_decisions:
- issue: Ἀδελφοί എന്ന ലിംഗസൂചക അഭിസംബോധന
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ / സഹോദരങ്ങളേ
  rationale: മൂലഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു. എന്നാൽ ഈ പരമ്പരാഗത സംബോധന സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന മിശ്രസമൂഹത്തെ അഭിസംബോധന ചെയ്യാൻ കഴിയുന്നതിനാൽ ഉൾക്കൊള്ളുന്ന അർത്ഥം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ സഭാസംബോധനയും പ്രാർഥനാഭാഷയും ഉപയോഗിച്ചു. മൂലത്തിലെ ആവർത്തനഘടന (‘എന്റെ… എന്റെ…’) കഴിയുന്നത്ര നിലനിർത്തി; സർവനാമത്തിന്റെ മുൻസന്ദർഭബന്ധം വിശദീകരിച്ച് പകരംവെച്ചില്ല.
