id: ROM.10.3
reference: Romans 10:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ നീതി[a][b] അറിയാതെയും സ്വന്തം നീതി സ്ഥാപിക്കാൻ ശ്രമിച്ചും അവർ ദൈവത്തിന്റെ നീതിക്കു കീഴടങ്ങിയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ‘നീതി’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് നീതിപൂർവത, ന്യായം, അല്ലെങ്കിൽ മനുഷ്യരെ ദൈവമുമ്പാകെ ശരിയായ നിലയിലാക്കുന്ന ദൈവത്തിന്റെ നീതിപൂർവമായ മാർഗം എന്നിങ്ങനെ അർഥം വരാം. വാക്യത്തിലെ രണ്ടിടത്തും ഇതേ പദമാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘ദൈവത്തിന്റെ നീതി’ എന്നത് ‘ദൈവത്തിൽനിന്നുള്ള നീതി’ എന്നും ‘ദൈവത്തിന്റേതായ നീതി’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്ക് പ്രയോഗം ഒന്നിലധികം അർഥഛായകൾ അനുവദിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: അറിയാതെയും
  rationale: വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ തുടരുന്ന സാഹചര്യാർഥം സ്വാഭാവികമായി നൽകുന്നു; മനഃപൂർവമായ നിരാകരണം എന്ന് അതിരുകടന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ദൈവത്തിന്റെ നീതി, നീതിപൂർവത, മനുഷ്യരെ ദൈവമുമ്പാകെ ശരിയായ നിലയിലാക്കുന്ന പ്രവർത്തനം എന്നിവയുടെ അർഥവ്യാപ്തി നിലനിർത്തുന്ന പ്രചാരമുള്ള മലയാളപദമാണ്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ഉടമസ്ഥത, ഉറവിടം, ദൈവത്തിന്റെ നീതിപൂർവമായ പ്രവർത്തനം എന്നീ സാധ്യതകൾ മുഖ്യവാക്യത്തിൽ അനാവശ്യമായി ചുരുക്കുന്നില്ല; മറ്റ് വായനകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἰδίαν
  choice: സ്വന്തം നീതി
  rationale: ഗ്രീക്കിൽ മുൻപറഞ്ഞ δικαιοσύνη ഇവിടെ അധ്യാഹരിച്ചിരിക്കുന്നു; മലയാളത്തിൽ അർഥം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ നാമം ആവർത്തിക്കുന്നു.
- source_word: ζητοῦντες στῆσαι
  choice: സ്ഥാപിക്കാൻ ശ്രമിച്ചും
  rationale: തുടരുന്ന ശ്രമത്തെ സൂചിപ്പിക്കുന്ന കൃദന്തരൂപവും στῆσαι എന്നതിന്റെ ‘സ്ഥാപിക്കുക’ എന്ന സന്ദർഭാർഥവും സ്വാഭാവികമായി സംയോജിപ്പിക്കുന്നു.
- source_word: οὐχ ὑπετάγησαν
  choice: കീഴടങ്ങിയില്ല
  rationale: സന്ദർഭത്തിലെ മധ്യമാർഥത്തോടടുത്ത സ്വമേധയാ അധീനപ്പെടാത്ത ഭാവം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ നീതി’ എന്ന പൗലോസിന്റെ പ്രയോഗത്തിന്റെ അർഥം
  choice: ‘ദൈവത്തിന്റെ നീതി’ എന്ന രൂപം മുഖ്യവാക്യത്തിൽ നിലനിർത്തി.
  alternative: ‘ദൈവത്തിൽനിന്നുള്ള നീതി’; ‘ദൈവത്തിന്റേതായ നീതി’; ദൈവത്തിന്റെ രക്ഷാകരമായ നീതിപൂർവ പ്രവർത്തനം
  rationale: ഗ്രീക്ക് പ്രയോഗം ഉടമസ്ഥത, ഉറവിടം, ദൈവത്തിന്റെ സ്വഭാവം अथവാ രക്ഷാകര പ്രവർത്തനം എന്നിവയിൽ ഒറ്റ അർഥം മാത്രം നിർബന്ധിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ ഈ അർഥസമ്മർദം പരിഭാഷയിൽ പരിഹരിച്ചുകളയാതെ സൂക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. കൃദന്തരൂപങ്ങളുടെ സമാന്തരത ‘അറിയാതെയും … ശ്രമിച്ചും’ എന്ന ഘടനയിൽ സൂക്ഷിച്ചു; സാങ്കേതിക ദൈവശാസ്ത്രപദങ്ങൾ മുഖ്യവാക്യത്തിൽ കൂട്ടിച്ചേർത്തിട്ടില്ല.
