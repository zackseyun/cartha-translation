  source_fidelity: The Malayalam accurately represents γάρ as an explanation, preserves the parallel present participles (‘അറിയാതെയും … ശ്രമിച്ചും’), supplies the elliptical ‘നീതി’ appropriately with ‘സ്വന്തം നീതി,’ and renders the final aorist as their failure to submit to God’s righteousness. The repeated ‘ദൈവത്തിന്റെ നീതി’ preserves the Greek genitive ambiguity without imposing a single Pauline interpretation.
