id: ROM.10.15
reference: Romans 10:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: ml
  text: 'അയക്കപ്പെടാതെ അവർ എങ്ങനെ പ്രഘോഷിക്കും? എഴുതിയിരിക്കുന്നതുപോലെ: “നല്ല കാര്യങ്ങൾ സന്തോഷവാർത്തയായി അറിയിക്കുന്നവരുടെ പാദങ്ങൾ എത്ര മനോഹരമാണ്![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എത്ര സ്വാഗതാർഹം” അല്ലെങ്കിൽ “എത്ര സമയോചിതം.” ‘മനോഹരം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് വിശേഷണം സൗന്ദര്യത്തോടൊപ്പം ദൂതന്റെ സ്വാഗതാർഹവും യഥാസമയത്തുള്ളതുമായ വരവിനെയും സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: പ്രസംഗിക്കും
  rationale: പൊതുവായി പരസ്യമായി അറിയിക്കുക എന്ന ആശയം നൽകുന്നു; സന്ദർഭത്തിൽ സ്വാഭാവികമായ മലയാളപ്രയോഗമാണിത്, ഔപചാരിക മതപ്രഭാഷണത്തിൽ മാത്രം അർഥം പരിമിതപ്പെടുത്തേണ്ടതില്ല.
- source_word: ἀποσταλῶσιν
  choice: അയക്കപ്പെടാതെ
  rationale: മറ്റൊരാളാൽ അയക്കപ്പെടുന്നു എന്ന കർമണിപ്രയോഗവും അയക്കുന്നവനോടുള്ള ആശ്രയവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന പതിവ് സൂത്രവാക്യത്തിന്റെ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളരൂപം.
- source_word: ὡραῖοι
  choice: മനോഹരം
  rationale: സൗന്ദര്യം എന്ന പ്രാഥമിക അർഥം നിലനിർത്തുന്നു; സ്വാഗതാർഹം, യഥാസമയം വന്നത് എന്നീ സാധ്യതയുള്ള ഭാവങ്ങൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: πόδες
  choice: പാദങ്ങൾ
  rationale: ദൂതന്മാരുടെ വരവിനെ സൂചിപ്പിക്കുന്ന ഉദ്ധരണിയിലെ ദൃശ്യരൂപം അക്ഷുണ്ണമായി സൂക്ഷിക്കുന്നു.
- source_word: εὐαγγελιζομένων
  choice: സുവാർത്ത അറിയിക്കുന്നവരുടെ
  rationale: നല്ല വാർത്ത അറിയിക്കുന്ന പ്രവൃത്തിയെ വ്യക്തമാക്കുകയും പിന്നീട് രൂപപ്പെട്ട സഭാപരമായ സാങ്കേതിക അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὰ ἀγαθά
  choice: നല്ല കാര്യങ്ങളുടെ
  rationale: ‘നല്ല കാര്യങ്ങൾ’ എന്ന ഗ്രീക്ക് പദസമുച്ചയത്തെ വേറിട്ടുതന്നെ നിലനിർത്തി, അതിനെ വീണ്ടും ‘സുവാർത്ത’ എന്നു മാത്രം ലയിപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: സുവാർത്താഘോഷണവുമായി ദൂതന്റെ ഉദ്ധരണിക്കുള്ള ബന്ധം
  choice: അയക്കപ്പെടലിന്റെയും പരസ്യപ്രഖ്യാപനത്തിന്റെയും യുക്തി നിലനിർത്തിക്കൊണ്ട്, നല്ല വാർത്ത അറിയിക്കുന്ന ദൂതന്മാരുടെ വരവ് ആഘോഷിക്കുന്ന യെശയ്യാവിൽനിന്നുള്ള ദൃശ്യരൂപം സംരക്ഷിച്ചു.
  alternative: ‘പ്രസംഗിക്കുക’, ‘സുവിശേഷം പ്രസംഗിക്കുന്നവർ’ എന്നിങ്ങനെ ഔപചാരിക ശുശ്രൂഷാപദവിയെ കൂടുതൽ സൂചിപ്പിക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തുക.
  rationale: പൗലോസിന്റെ വാദക്രമം അയക്കപ്പെടലും പ്രഖ്യാപനവും സംബന്ധിച്ചെങ്കിലും, ഉദ്ധരണി നല്ല വാർത്ത അറിയിക്കുന്നവരെ വിശാലമായി ആഘോഷിക്കുന്നു; അതിനാൽ ഏതെങ്കിലും പ്രത്യേക സഭാപദവി പാഠത്തിലേക്ക് ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയിലെ ‘പാദങ്ങൾ’ എന്ന കാവ്യദൃശ്യവും ‘നല്ല കാര്യങ്ങൾ’ എന്ന പദവ്യത്യാസവും നിലനിർത്തിയിട്ടുണ്ട്.
