id: ROM.10.19
reference: Romans 10:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ ചോദിക്കട്ടെ: ഇസ്രായേൽ അറിഞ്ഞില്ലേ?[a] ആദ്യം മോശെ പറയുന്നു: “ഒരു ജനതയല്ലാത്തതിനെക്കൊണ്ട്[b] ഞാൻ നിങ്ങളിൽ അസൂയ ഉളവാക്കും; വിവേകമില്ലാത്ത ഒരു ജനതയെക്കൊണ്ട് ഞാൻ നിങ്ങളെ കോപിപ്പിക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേൽ മനസ്സിലാക്കിയില്ലേ?” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘അറിയുക’ എന്നും ‘മനസ്സിലാക്കുക’ എന്നും അർഥമാകാം; കേട്ട സന്ദേശത്തിന്റെ പ്രാധാന്യം ഗ്രഹിക്കുക എന്ന ആശയം ഇവിടെ ഉണ്ടായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ആവർത്തനം 32:21-ൽനിന്നുള്ള ഉദ്ധരണി. “ഒരു ജനതയല്ലാത്തത്” എന്നത് യഥാർഥ ജനതയായി കണക്കാക്കപ്പെടാത്ത ഒരു ജനവിഭാഗത്തെ—അതായത് വിജാതീയരെ—സൂചിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ λέγω
  choice: എന്നാൽ ഞാൻ ചോദിക്കട്ടെ
  rationale: അക്ഷരാർഥത്തിൽ ‘എന്നാൽ ഞാൻ പറയുന്നു’ എന്നാണെങ്കിലും, ഇവിടെ തുടർന്നുവരുന്ന ചോദ്യം അവതരിപ്പിക്കുന്ന പ്രയോഗമായതിനാൽ സ്വാഭാവിക മലയാളത്തിൽ ‘ഞാൻ ചോദിക്കട്ടെ’ എന്നു നൽകി.
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: ഇസ്രായേൽ അറിഞ്ഞില്ലേ?
  rationale: γινώσκω എന്ന ക്രിയയുടെ അടിസ്ഥാന അർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ‘മനസ്സിലാക്കുക’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ ആവർത്തിത നിഷേധത്തിന്റെ വാക്ചാതുര്യം സ്വാഭാവികമായ മലയാള ചോദ്യരൂപത്തിൽ നൽകി.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: ആദ്യം മോശെ പറയുന്നു
  rationale: തിരുവെഴുത്തുസാക്ഷികളുടെ ക്രമത്തിൽ മോശെയാണ് ആദ്യത്തെയാൾ എന്ന πρῶτος എന്നതിന്റെ ക്രിയാവിശേഷണബലം നിലനിർത്തുന്നു.
- source_word: παραζηλώσω
  choice: ഞാൻ നിങ്ങളിൽ അസൂയ ഉളവാക്കും
  rationale: അസൂയയിലേക്കു പ്രകോപിപ്പിക്കുക എന്ന കാരണാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: ഒരു ജനതയല്ലാത്തതിനെക്കൊണ്ട്
  rationale: ‘ജനതയല്ലാത്തത്’ എന്ന ഉദ്ധരണിയുടെ അസാധാരണവും കുത്തുള്ളതുമായ പ്രയോഗം വിശദീകരിച്ചു മാറ്റാതെ നിലനിർത്തുന്നു; ἐπίയുടെ ഉപകരണാർഥം ‘-നെക്കൊണ്ട്’ വഴി പ്രകടമാക്കുന്നു.
- source_word: ἔθνει ἀσυνέτῳ
  choice: വിവേകമില്ലാത്ത ഒരു ജനതയെക്കൊണ്ട്
  rationale: ἀσύνετος സൂചിപ്പിക്കുന്ന ഗ്രാഹ്യശേഷി/വിവേകത്തിന്റെ അഭാവം ‘മൂഢ’ എന്ന കൂടുതൽ വിലയിരുത്തൽ നിറഞ്ഞ പദത്തേക്കാൾ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: παροργιῶ ὑμᾶς
  choice: ഞാൻ നിങ്ങളെ കോപിപ്പിക്കും
  rationale: കോപത്തിലേക്കു പ്രകോപിപ്പിക്കുക എന്ന കാരണാർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഒരു ജനതയല്ലാത്തത്’, ‘വിവേകമില്ലാത്ത ഒരു ജനത’ എന്നിവയുടെ സൂചിതവിഭാഗം
  choice: പ്രധാന പാഠത്തിൽ ആരെന്നു വ്യക്തമാക്കാതെ മോശെയുടെ ഉദ്ധരണിയുടെ രൂപം നിലനിർത്തി.
  alternative: വിജാതീയർ; അല്ലെങ്കിൽ ഇസ്രായേൽ യഥാർഥ ജനതയായി കണക്കാക്കാത്ത ഒരു ജനവിഭാഗം.
  rationale: പുറത്തുള്ള ഒരു ജനവിഭാഗത്തെ ദൈവം ഉപയോഗിക്കുമെന്ന ആവർത്തനം പൗലൊസിന്റെ വാദത്തിൽ പ്രസക്തമാണെങ്കിലും, ഗ്രീക്ക് പാഠം അവരെ ഇവിടെ നേരിട്ട് ‘വിജാതീയർ’ എന്നു വിളിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ തിരിച്ചറിയൽ പാഠത്തിലേക്ക് ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പഴയ മതഭാഷയിലെ ദുർഗ്രാഹ്യമായ രൂപങ്ങൾ ഒഴിവാക്കി; അതേസമയം ഉദ്ധരണിയിലെ ‘ഒരു ജനതയല്ലാത്തത്’ എന്ന ഉദ്ദേശപൂർവമായ അസാധാരണതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
