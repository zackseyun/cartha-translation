id: ROM.10.4
reference: Romans 10:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: ml
  text: എന്തെന്നാൽ, വിശ്വസിക്കുന്ന ഏവർക്കും നീതിക്കായി[b] നിയമത്തിന്റെ അവസാനം[a] മശീഹയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ലക്ഷ്യം’ എന്നോ ‘പര്യവസാനം’ എന്നോ ‘പൂർത്തീകരണം’ എന്നോ വിവർത്തനം ചെയ്യാം. ‘അവസാനം’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് പദത്തിന് അവസാനിപ്പിക്കൽ, ലക്ഷ്യം, അല്ലെങ്കിൽ പൂർത്തീകരണം എന്നിങ്ങനെ അർഥമാകാം.
    reason: alternative_reading
  - marker: b
    text: പൗലോസിന്റെ പ്രയോഗത്തിൽ ‘നീതി’ എന്നതിന് പകരം ‘ന്യായം’ എന്നും മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: അവസാനം
  rationale: ‘അവസാനം’ എന്നത് അവസാനിപ്പിക്കൽ, ലക്ഷ്യം, പര്യവസാനം എന്നീ സാധ്യതകൾ ഒരളവുവരെ തുറന്നുവെക്കുന്നു; ലക്ഷ്യം/പൂർത്തീകരണം എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: νόμου
  choice: നിയമത്തിന്റെ
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ഇത് മോശെയുടെ നിയമത്തെ അറിയപ്പെട്ട ഉടമ്പടിവിഭാഗമായി സൂചിപ്പിക്കുന്നു. ആധുനിക വായനക്കാർക്ക് സ്വാഭാവികമായ ‘നിയമം’ ഉപയോഗിച്ചു.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഇസ്രായേലിന്റെ നിയമത്തോടും ഉടമ്പടി പ്രത്യാശകളോടുമുള്ള യേശുവിന്റെ ബന്ധമാണ് ഇവിടെ വിഷയമായതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: εἰς δικαιοσύνην
  choice: നീതിക്കായി
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യ/ഫല ദിശ സംക്ഷിപ്തമായി നിലനിർത്തുകയും വ്യാഖ്യാനം അമിതമായി വികസിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ‘righteousness’ എന്ന ആശയം സൂചിപ്പിക്കാൻ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളപദം. ‘ന്യായം’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: παντὶ τῷ πιστεύοντι
  choice: വിശ്വസിക്കുന്ന ഏവർക്കും
  rationale: വർത്തമാനകൃ​​ദന്തരൂപത്തിന്റെ പ്രവർത്തനഭാവവും എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന παντί എന്ന പദത്തിന്റെ വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തിന് വിശദീകരണം നൽകുന്ന γάρ എന്ന ബന്ധകത്തിന്റെ പ്രവർത്തനം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: τέλος νόμου എന്ന പ്രയോഗം മോശെയുടെ നിയമവുമായി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു
  choice: പ്രധാനവാക്യത്തിൽ ‘നിയമത്തിന്റെ അവസാനം’
  alternative: ‘നിയമത്തിന്റെ ലക്ഷ്യം’, ‘നിയമത്തിന്റെ പര്യവസാനം’, അല്ലെങ്കിൽ ‘നിയമത്തിന്റെ പൂർത്തീകരണം’
  rationale: ഗ്രീക്ക് പദത്തിന് അവസാനിപ്പിക്കൽ എന്ന അർഥവും ലക്ഷ്യം/പര്യവസാനം എന്ന അർഥവും വരാം. പ്രധാനവാക്യത്തിൽ ‘അവസാനം’ ഉപയോഗിച്ച് ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം തീർപ്പാക്കാതെ നിലനിർത്തി, മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ കൊടുക്കുന്നു.
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ യേശുവിന്റെ ഇസ്രായേലിന്റെ നിയമത്തോടും ഉടമ്പടിക്കഥയോടുമുള്ള ബന്ധം മുൻനിരയിൽ വരുന്നതിനാൽ സ്ഥാനപ്പേരിന്റെ മശീഹാത്വ അർഥം പ്രകടമാക്കുന്നു.
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: നീതി
  alternative: ന്യായം
  rationale: പൗലോസിന്റെ വിശാലമായ പ്രയോഗത്തിന് ‘നീതി’ അനുയോജ്യമാണ്; ‘ന്യായം’ എന്ന സാധ്യത ആശയത്തിന്റെ സാമൂഹിക/ന്യായവിധിപരമായ വശം മുന്നോട്ടുകൊണ്ടുവരുന്നതിനാൽ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ സംക്ഷിപ്തതയും τέλος എന്ന പദത്തിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യതയും നിലനിർത്തി; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
