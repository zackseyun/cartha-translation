id: ROM.10.21
reference: Romans 10:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: ml
  text: 'എന്നാൽ ഇസ്രായേലിനെക്കുറിച്ച്[a] അവൻ പറയുന്നു: “ദിവസം മുഴുവൻ ഞാൻ എന്റെ കൈകൾ അനുസരിക്കാത്തതും[b] എതിർത്തുപറയുന്നതുമായ[c] ഒരു ജനത്തിന്റെ നേരെ നീട്ടി.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “എന്നാൽ ഇസ്രായേലിനോട് അവൻ പറയുന്നു.” ഗ്രീക്ക് പ്രയോഗം ഇസ്രായേലിനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നതായോ ഇസ്രായേലിനെക്കുറിച്ചുള്ള പ്രസ്താവനയായോ മനസ്സിലാക്കാം.
    reason: alternative_reading
  - marker: b
    text: “അനുസരിക്കാത്ത” എന്നതിന് “വിശ്വസിക്കാത്ത” എന്നോ “സമ്മതിപ്പിക്കപ്പെടാൻ വിസമ്മതിക്കുന്ന” എന്നോ ഉള്ള അർഥച്ചായവും ഉണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “എതിർക്കുന്ന,” “വിരോധിക്കുന്ന,” അല്ലെങ്കിൽ “എതിരായി പറയുന്ന.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: എന്നാൽ ഇസ്രായേലിനെക്കുറിച്ച്
  rationale: πρός എന്ന പദപ്രയോഗം ഇവിടെ ഇസ്രായേലിനെ അഭിസംബോധന ചെയ്യുന്നതായോ ഇസ്രായേലിനെക്കുറിച്ചു പറയുന്നതായോ ഗ്രഹിക്കാം. മുഖ്യപാഠത്തിൽ സന്ദർഭത്തിന് യോജിച്ച സ്വാഭാവികമായ വിഷയസൂചന സ്വീകരിക്കുകയും മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്തു.
- source_word: λέγει
  choice: അവൻ പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ഉദ്ധരണിസൂത്രം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ കർത്താവ് ദൈവമാണെങ്കിലും ഈ വാക്യത്തിൽ ഗ്രീക്ക് കർത്താവിനെ വ്യക്തമായി പേരിടുന്നില്ല; അതിനാൽ മലയാളത്തിലും ‘അവൻ’ എന്നു മാത്രം നൽകി.
- source_word: Ὅλην τὴν ἡμέραν
  choice: ദിവസം മുഴുവൻ
  rationale: കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: ഞാൻ എന്റെ കൈകൾ … നീട്ടിക്കൊണ്ടിരുന്നു
  rationale: കൈകൾ നീട്ടുന്ന ദൃശ്യരൂപം അക്ഷുണ്ണമായി സൂക്ഷിക്കുന്നു. ‘ദിവസം മുഴുവൻ’ എന്ന കാലദൈർഘ്യത്തോടൊപ്പം ‘നീട്ടിക്കൊണ്ടിരുന്നു’ എന്ന രൂപം ദൈവത്തിന്റെ തുടർച്ചയായ അഭ്യർഥനയെയോ ക്ഷണത്തെയോ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πρὸς λαὸν
  choice: ഒരു ജനത്തിന്റെ നേരെ
  rationale: നീട്ടിയ കൈകളുടെ ദിശയും ജനത്തെ ഒരു സമൂഹമായി കാണുന്ന λαός എന്ന പദത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἀπειθοῦντα
  choice: അനുസരിക്കാത്തതും
  rationale: ഈ പദത്തിൽ അനുസരണക്കേട്, വിശ്വസിക്കാതിരിക്കൽ, സമ്മതിപ്പിക്കപ്പെടാൻ വിസമ്മതിക്കൽ എന്നീ പരസ്പരം ബന്ധപ്പെട്ട ആശയങ്ങളുണ്ട്. മുഖ്യപാഠം ധാർമികവും ഇച്ഛാപരവുമായ നിരസനം വ്യക്തമാക്കുന്നു; മറ്റു അർഥച്ചായങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀντιλέγοντα
  choice: എതിർത്തു സംസാരിക്കുന്നതുമായ
  rationale: ἀντιλέγω എന്നതിന്റെ വാചികമായ എതിർപ്പ്—എതിരായി പറയുക, വാദിക്കുക, വിരോധിക്കുക—വ്യക്തമായി പ്രതിഫലിപ്പിക്കുന്നു; പൊതുവായ ‘എതിർക്കുന്ന’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ സംസാരഘടകം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ മുൻകൈയും ജനത്തിന്റെ നിരസനവും
  choice: ദിവസം മുഴുവൻ കൈകൾ നീട്ടുന്ന ദൈവത്തെയും അനുസരിക്കാതെ എതിർത്തു സംസാരിക്കുന്ന ജനത്തെയും ഒരുമിച്ച് അവതരിപ്പിച്ചു.
  alternative: ‘വിശ്വാസമില്ലാത്ത ജനത’ എന്നിങ്ങനെ വിശ്വാസത്തിന്റെ വശം മാത്രം മുൻനിർത്തുക.
  rationale: ഉദ്ധരണി ദൈവത്തിന്റെ നിലനിൽക്കുന്ന ആഹ്വാനത്തെയും ജനത്തിന്റെ അനുസരണക്കേടും സജീവമായ എതിർപ്പും തമ്മിലുള്ള സംഘർഷം നിലനിർത്തുന്നു. ഇസ്രായേലിന്റെ വിപുലമായ ദൈവശാസ്ത്രപരമായ സ്ഥാനത്തെക്കുറിച്ച് ഈ വാക്യം പറയുന്നതിലധികം വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: λέγει എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവൻ പറയുന്നു’ എന്നു നൽകി കർത്താവിനെ പേരിട്ട് വ്യക്തമാക്കിയില്ല.
  alternative: ‘ദൈവം പറയുന്നു’ എന്നു സന്ദർഭത്തിൽനിന്ന് കർത്താവിനെ തുറന്നു ചേർക്കുക.
  rationale: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയുടെ സന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും ഈ ഗ്രീക്ക് വാക്യത്തിൽ കർത്താവ് പരോക്ഷമാണ്. ആ പരോക്ഷത മലയാളത്തിലും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. കൂട്ടായ ഏകവചനമായ ‘ജനം’ നിലനിർത്തി; കൃത്രിമമായ പദാനുപദക്രമം ഒഴിവാക്കി, എന്നാൽ കൈകൾ നീട്ടുന്ന രൂപകവും രണ്ടു പങ്കാളിത്തവിശേഷണങ്ങളുടെ വ്യത്യസ്ത ഊന്നലുകളും സംരക്ഷിച്ചു.
