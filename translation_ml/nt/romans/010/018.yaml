id: ROM.10.18
reference: Romans 10:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: ml
  text: 'എന്നാൽ ഞാൻ ചോദിക്കുന്നു: അവർ കേട്ടില്ലേ? തീർച്ചയായും കേട്ടു:


    “അവരുടെ ശബ്ദം ഭൂമിയിലെങ്ങും പുറപ്പെട്ടിരിക്കുന്നു[a];


    അവരുടെ വാക്കുകൾ ജനവാസമുള്ള ലോകത്തിന്റെ അറ്റങ്ങളിലേക്കും എത്തിയിരിക്കുന്നു.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ സ്വരം ഭൂമിയിലെങ്ങും പുറപ്പെട്ടിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജനവാസമുള്ള ലോകം’ എന്നതിനുപകരം ലളിതമായി ‘ലോകം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: പൗലോസ് ഇവിടെ സങ്കീർത്തനം 19:4 ഉദ്ധരിച്ച് അതിലെ ഭാഷ സന്ദേശത്തിന്റെ വ്യാപനത്തിന് പ്രയോഗിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: അവർ കേട്ടില്ലേ?
  rationale: μή οὐκ ചേർന്നുള്ള ചോദ്യം അനുകൂലമായ ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാചാടോപചോദ്യമാണ്. മലയാളത്തിൽ ‘കേട്ടില്ലേ?’ അതിന്റെ സ്വാഭാവിക ശക്തി നിലനിർത്തുന്നു.
- source_word: μενοῦνγε
  choice: തീർച്ചയായും കേട്ടു
  rationale: ഊന്നലോടെയുള്ള അനുകൂല മറുപടിയാണ്; ഗ്രീക്കിൽ സൂചിതമായ ക്രിയ മലയാളത്തിൽ വ്യക്തമാക്കി സ്വാഭാവികമാക്കി.
- source_word: φθόγγος
  choice: ശബ്ദം
  rationale: ‘ശബ്ദം’, ‘സ്വരം’ എന്നീ അർഥങ്ങൾ സാധ്യമാണ്. സങ്കീർത്തന ഉദ്ധരണിയുടെ ശ്രാവ്യരൂപകവും തുടർന്നുള്ള ‘വാക്കുകൾ’ എന്ന സമാന്തരപ്രയോഗവും ‘ശബ്ദം’ നന്നായി നിലനിർത്തുന്നു.
- source_word: γῆ
  choice: ഭൂമി
  rationale: സാർവത്രിക വ്യാപ്തിയുള്ള കാവ്യസന്ദർഭത്തിൽ ഒരു പ്രത്യേക ദേശത്തേക്കാൾ മുഴുവൻ ഭൂമിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐξῆλθεν
  choice: പുറപ്പെട്ടിരിക്കുന്നു
  rationale: ഗ്രീക്ക് എയോറിസ്റ്റ് ഭൂതകാലസംഭവം സൂചിപ്പിച്ചാലും, സന്ദേശത്തിന്റെ വ്യാപനഫലം ഇപ്പോഴും പ്രസക്തമാണെന്ന ഉദ്ധരണിസന്ദർഭം മലയാളത്തിലെ ഈ പൂർണ്ണകാലരൂപം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: πέρατα
  choice: അറ്റങ്ങൾ
  rationale: ‘അറ്റങ്ങളിലേക്ക്’ എന്നത് കാവ്യസമാന്തരതയും അതിവ്യാപ്തിയുടെ ആശയവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: οἰκουμένης
  choice: നിവസിതലോകം
  rationale: വെറും ഭൗതിക ഗോളമെന്നതിലുപരി മനുഷ്യർ വസിക്കുന്ന ലോകം എന്ന ഗ്രീക്ക് സൂക്ഷ്മത നിലനിർത്തുന്നു; ‘ലോകം’ എന്ന ലളിതരൂപവും സാധ്യമാണ്.
- source_word: ῥήματα
  choice: വാക്കുകൾ
  rationale: നേരിട്ടുള്ള പദസമതുല്യമാണ്; ‘സന്ദേശം’ എന്ന വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കി ‘ശബ്ദം’ എന്നതുമായുള്ള കാവ്യസമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: സങ്കീർത്തന ഉദ്ധരണിയിലെ ‘അവരുടെ’ എന്നതിന്റെ സൂചിതർ
  choice: സൂചിതരെ വിശദീകരിക്കാതെ സർവനാമം അതേപടി നിലനിർത്തുക
  alternative: സങ്കീർത്തനം 19-ലെ ആകാശങ്ങളെ സൂചിതരായി വ്യക്തമാക്കുക; അല്ലെങ്കിൽ പൗലോസിന്റെ പ്രയോഗത്തിൽ സുവിശേഷപ്രഘോഷകരെയോ അപ്പൊസ്തലന്മാരെയോ സൂചിതരായി വ്യക്തമാക്കുക
  rationale: പൗലോസ് സങ്കീർത്തനം 19:4-ലെ ഭാഷ തന്റെ വാദത്തിൽ പ്രയോഗിക്കുന്നു. ‘അവരുടെ’ എന്നത് ആരെ സൂചിപ്പിക്കുന്നു എന്ന അന്തർപാഠപരമായ പിരിമുറുക്കം മൂലപാഠം തന്നെ തുറന്നുവയ്ക്കുന്നതിനാൽ പരിഭാഷ അതിനെ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഉദ്ധരണിയുടെ കാവ്യസമാന്തരത വരിവിഭജനത്തിലൂടെ നിലനിർത്തി. ‘നിവസിതലോകം’ സാധാരണ സംസാരഭാഷയെക്കാൾ അല്പം ഔപചാരികമാണെങ്കിലും οἰκουμένη എന്ന പദത്തിന്റെ പ്രത്യേക അർഥം കൃത്യമായി സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
