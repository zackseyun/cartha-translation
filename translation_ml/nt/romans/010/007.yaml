id: ROM.10.7
reference: Romans 10:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: ml
  text: അല്ലെങ്കിൽ[a], “ആരാണ് അഗാധത്തിലേക്ക് ഇറങ്ങുക?” (അതായത്, മരിച്ചവരുടെ ഇടയിൽനിന്ന് മശിഹായെ[b] മുകളിലേക്കു കൊണ്ടുവരാൻ).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആഴത്തിലേക്ക്” എന്നും പരിഭാഷപ്പെടുത്താം. പൗലോസ് ആവർത്തനം 30:13-നെ അനുരണിപ്പിക്കുന്നുവെങ്കിലും ഇവിടെ “അഗാധം” എന്ന പദം ഉപയോഗിച്ച്, മശിഹായെ മരിച്ചവരുടെ ഇടയിൽനിന്ന് മുകളിലേക്കു കൊണ്ടുവരുന്നതിന് ആ ഭാഷ പ്രയോഗിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: “ക്രിസ്തോസ്.” ഇവിടെ അതു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ “മശിഹാ” എന്നു പരിഭാഷപ്പെടുത്തി.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: അല്ലെങ്കിൽ
  rationale: ആവർത്തനം 30-ലെ ഉദ്ധരണിയുടെ രണ്ടാമത്തെ വൈരുധ്യഭാഗം ലളിതമായ സംയോജകത്തോടെ അവതരിപ്പിക്കുന്നു.
- source_word: Τίς καταβήσεται
  choice: ആരാണ് … ഇറങ്ങുക?
  rationale: ഭാവികാലത്തിലുള്ള നേരിട്ടുള്ള അലങ്കാരപ്രശ്നം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰς τὴν ἄβυσσον
  choice: അഗാധത്തിലേക്ക്
  rationale: ἄβυσσος എന്ന പ്രത്യേക പദത്തിന്റെ അളവറ്റ ആഴം, മരണബന്ധിയായ ധ്വനി എന്നിവ നിലനിർത്തുന്നു; അതിനെ ‘കല്ലറ’യെന്നോ ‘മരിച്ചവരുടെ ലോകം’ എന്നോ വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: ഗ്രീക്കിലെ വിശദീകരണസൂത്രത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: Χριστόν
  choice: മശിഹായെ
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ മശിഹാ/അഭിഷിക്തൻ എന്ന അർഥം പ്രകടമാക്കുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരുടെ ഇടയിൽനിന്ന്
  rationale: ഗ്രീക്ക് ബഹുവചനപ്രയോഗം വ്യക്തമായി പ്രതിഫലിപ്പിക്കുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: ἀναγαγεῖν
  choice: മുകളിലേക്കു കൊണ്ടുവരാൻ
  rationale: ‘ഇറങ്ങുക’ എന്ന ദിശാസൂചനയോടുള്ള ബന്ധം നിലനിർത്തുന്നു; ക്രിയയെ നേരിട്ട് ‘ഉയിർപ്പിക്കുക’ എന്നു വ്യാഖ്യാനിക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശിഹാ
  alternative: ക്രിസ്തു; അഭിഷിക്തൻ
  rationale: ഈ സന്ദർഭത്തിൽ പദം പേരുപോലെയല്ല, സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്. ‘മശിഹാ’ അതിന്റെ സ്ഥാനപ്പേരായ സ്വഭാവം സാധാരണ വായനക്കാർക്ക് പരിചിതമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
- issue: ‘അഗാധം’ എന്ന പൗലോസിന്റെ വിശദീകരണചിത്രം
  choice: അഗാധം എന്ന രൂപം പ്രധാനവാക്യത്തിൽ നിലനിർത്തുക
  alternative: ആഴം; മരിച്ചവരുടെ ലോകം; പാതാളം
  rationale: പൗലോസ് ആവർത്തനം 30-ന്റെ ഭാഷയെ അനുരണിപ്പിച്ചുകൊണ്ട് അതിനെ മരിച്ചവരുടെ ഇടയിൽനിന്ന് മശിഹായെ കൊണ്ടുവരുന്നതുമായി ബന്ധിപ്പിക്കുന്നു. ‘അഗാധം’ ആ സൂചനയും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ഉദ്ധരണിയുടെ അലങ്കാരപ്രശ്നവും ‘ഇറങ്ങുക/മുകളിലേക്കു കൊണ്ടുവരുക’ എന്ന ദിശാത്മക വൈരുധ്യവും സംരക്ഷിച്ചിരിക്കുന്നു.
