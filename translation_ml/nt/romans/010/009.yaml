id: ROM.10.9
reference: Romans 10:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: ml
  text: കാരണം, നിന്റെ വായ്കൊണ്ട് യേശു കർത്താവാണെന്ന്[a] ഏറ്റുപറയുകയും നിന്റെ ഹൃദയത്തിൽ ദൈവം അവനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചുവെന്ന് വിശ്വസിക്കുകയും ചെയ്താൽ നീ രക്ഷിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യേശുവിനെ കർത്താവായി ഏറ്റുപറയുകയും.”
    reason: κύριον Ἰησοῦν എന്ന ഗ്രീക്ക് പദസമുച്ചയത്തെ കൂടുതൽ സംക്ഷിപ്തമായി വിവർത്തനം ചെയ്യാവുന്ന വ്യാകരണസാധ്യത രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയുടെ വിശദീകരണകാരണം അവതരിപ്പിക്കുന്നതിനാൽ സന്ദർഭത്തിലെ കാരണാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐὰν
  choice: ചെയ്താൽ
  rationale: ഉപാധിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായ സോപാധിക ക്രിയാരൂപത്തിലൂടെ അവതരിപ്പിച്ചു.
- source_word: ὁμολογήσῃς
  choice: ഏറ്റുപറയുക
  rationale: വായ്മൊഴിയായി പരസ്യമായി അംഗീകരിക്കുകയോ പ്രഖ്യാപിക്കുകയോ ചെയ്യുന്ന അർഥം നിലനിർത്തുന്ന സ്വാഭാവികമായ ബൈബിൾപ്രയോഗം.
- source_word: ἐν τῷ στόματί σου
  choice: നിന്റെ വായ്‌കൊണ്ട്
  rationale: വാചികമായ ഏറ്റുപറച്ചിലിന്റെ ഉപകരണം വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κύριον Ἰησοῦν
  choice: യേശു കർത്താവാണെന്ന്
  rationale: അക്കൂസറ്റീവ് ഘടനയിലെ ഏറ്റുപറച്ചിലിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ വ്യക്തമായ വിധേയവാക്യമായി അവതരിപ്പിക്കുന്നു.
- source_word: πιστεύσῃς
  choice: വിശ്വസിക്കുക
  rationale: തുടർന്നുള്ള ὅτι-വാക്യത്തിന്റെ ഉള്ളടക്കത്തോടു ചേർന്ന് ആന്തരിക ബോധ്യത്തെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: നിന്റെ ഹൃദയത്തിൽ
  rationale: ആന്തരിക ബോധ്യത്തിന്റെ ബൈബിൾപരമായ മനുഷ്യശാസ്ത്രാർഥം അമിതവ്യാഖ്യാനമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: ദൈവം അവനെ ഉയിർപ്പിച്ചു
  rationale: അയോറിസ്റ്റ് ക്രിയയുടെ ഭൂതകാല സംഭവാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: മരിച്ചവരുടെ ഇടയിൽനിന്നുള്ള ഉയിർപ്പിനെ കൃത്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σωθήσῃ
  choice: നീ രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും പൗലോസിന്റെ രക്ഷാസന്ദർഭവും നിലനിർത്തുന്നു; രക്ഷിക്കുന്ന കർത്താവിനെ വാക്യത്തിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: കർത്താവ്
  alternative: യജമാനൻ
  rationale: ഈ ഏറ്റുപറച്ചിലിൽ അധികാരവും സമീപസന്ദർഭത്തിലെ തിരുവെഴുത്തുപരമായ അനുരണനവും ഉള്ളതിനാൽ ‘കർത്താവ്’ അനുയോജ്യം; ‘യജമാനൻ’ അർഥത്തെ അനാവശ്യമായി ചുരുക്കും.
- issue: κύριον Ἰησοῦν എന്ന ഏറ്റുപറച്ചിൽഘടന
  choice: യേശു കർത്താവാണെന്ന്
  alternative: യേശുവിനെ കർത്താവായി
  rationale: ഏറ്റുപറയുന്നതിന്റെ ഉള്ളടക്കം വ്യക്തമായി നൽകുന്നു; ഗ്രീക്ക് അനുവദിക്കുന്ന കൂടുതൽ സംക്ഷിപ്തമായ ഘടന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: σωθήσῃ എന്നതിന്റെ രക്ഷാശാസ്ത്രപരമായ ശക്തി
  choice: നീ രക്ഷിക്കപ്പെടും
  alternative: നീ വിടുവിക്കപ്പെടും
  rationale: റോമർ 10-ലെ രക്ഷാസന്ദർഭം സംരക്ഷിക്കുന്നു; പാഠത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഏറ്റുപറയുക,’ ‘കർത്താവ്,’ ‘രക്ഷിക്കപ്പെടും’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി ക്രമപ്പെടുത്തി.
