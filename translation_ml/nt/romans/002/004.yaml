    issue: The participial clause ἀγνοῶν is rendered as an independent question (‘നീ അറിയുന്നില്ലേ?’).
    rationale: Greek has one rhetorical question, qualified by ‘not knowing that ...’. Rendering it with ‘അറിയാതെ’ preserves the syntactic relationship without adding a second interrogative emphasis.
