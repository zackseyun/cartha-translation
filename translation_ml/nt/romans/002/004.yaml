id: ROM.2.4
reference: Romans 2:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ദൈവത്തിന്റെ ദയയുടെയും സഹനത്തിന്റെയും ദീർഘക്ഷമയുടെയും സമൃദ്ധിയെ നീ നിസ്സാരമായി കാണുന്നുവോ, ദൈവത്തിന്റെ ദയ നിന്നെ മാനസാന്തരത്തിലേക്കു നയിക്കുന്നു എന്ന് അറിയാതെ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദയ’ എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കും ‘നന്മ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: സമൃദ്ധി
  rationale: ഗുണങ്ങളുടെ അളവറ്റ ധാരാളിത്തത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് രൂപകം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; അക്ഷരാർഥമായ ‘സമ്പത്ത്’ ഇവിടെ കുറച്ച് കൃത്രിമമാണ്.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: ദയ
  rationale: ദൈവം പാപിയോടു കാണിക്കുന്ന ഹിതകരവും കൃപാപൂർവവുമായ സമീപനത്തിന്റെ വ്യക്തിബന്ധപരമായ ഭാവം നൽകുന്നു; രണ്ടു പ്രയോഗങ്ങളിലും ഒരേ പദം ഉപയോഗിച്ച് മൂലപാഠത്തിലെ ആവർത്തനം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀνοχῆς
  choice: സഹനം
  rationale: വിധി ഉടൻ നടപ്പാക്കാതെ പിടിച്ചുനിർത്തുന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: μακροθυμίας
  choice: ദീർഘക്ഷമ
  rationale: ἀνοχήയിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് ദീർഘകാലം ക്ഷമയോടെ സഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
- source_word: καταφρονεῖς
  choice: നിസ്സാരമായി കാണുന്നുവോ
  rationale: അവജ്ഞയോടെ വിലകുറച്ച് കാണുക എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വെറുക്കുക’ എന്നത് ഇവിടെ അതിശക്തവും അർഥപരമായി ഇടുങ്ങിയതുമാകാം.
- source_word: ἀγνοῶν
  choice: അറിയുന്നില്ലേ
  rationale: മനപ്പൂർവമായ അവഗണന ആരോപിക്കാതെ, അറിയാതിരിക്കലിനെ സൂചിപ്പിക്കുന്ന participle ചോദ്യംരൂപത്തിൽ സ്വാഭാവികമായി ചേർക്കുന്നു.
- source_word: εἰς μετάνοιάν
  choice: മാനസാന്തരത്തിലേക്ക്
  rationale: μετάνοιαയുടെ നൈതികവും ആത്മീയവുമായ തിരിഞ്ഞുവരവിനെ മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും കൃത്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄγει
  choice: നയിക്കുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടർന്നുകൊണ്ടിരിക്കുന്ന ദൈവിക പ്രവർത്തനത്തെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: χρηστότης / χρηστόν എന്നത് ‘ദയ’യോ ‘നന്മ’യോ ആയി പരിഭാഷപ്പെടുത്തണോ എന്നത്
  choice: രണ്ടിടത്തും ‘ദയ’
  alternative: രണ്ടിടത്തും ‘നന്മ’
  rationale: സന്ദർഭം പാപിയോടുള്ള ദൈവത്തിന്റെ ഹിതകരവും ക്ഷമാപൂർവവുമായ ഇടപെടലിനെ ഊന്നുന്നതിനാൽ ‘ദയ’ വ്യക്തിബന്ധപരമായ ഭാവം നന്നായി നൽകുന്നു; എങ്കിലും ‘നന്മ’ സാധുവായ വിശാലാർഥമാണ്.
- issue: ദൈവത്തിന്റെ ദയ മാനസാന്തരത്തെ ഉറപ്പായി സൃഷ്ടിക്കുന്നു എന്നോ അതിലേക്കു നയിക്കുന്നു എന്നോ വിവർത്തനം ചെയ്യണോ എന്നത്
  choice: ‘മാനസാന്തരത്തിലേക്കു നയിക്കുന്നു’ എന്ന് ദിശാസൂചകമായി നിലനിർത്തി
  alternative: ‘മാനസാന്തരം വരുത്തുന്നു’
  rationale: εἰς ... ἄγει ലക്ഷ്യത്തിലേക്കുള്ള നയിപ്പിനെ പറയുന്നു; ഫലത്തിന്റെ അനിവാര്യതയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ നിഗമനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും പൊതുവായും ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ദീർഘക്ഷമ’, ‘മാനസാന്തരം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ ആശയകൃത്യതയ്ക്കായി നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്ത് നൽകിയിരിക്കുന്നു; അത് χρηστότης / χρηστόν എന്ന രണ്ടു പ്രയോഗങ്ങളെയും സംബന്ധിക്കുന്നു.
