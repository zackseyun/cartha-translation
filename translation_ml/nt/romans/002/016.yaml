id: ROM.2.16
reference: Romans 2:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: ml
  text: 'എന്റെ സുവിശേഷപ്രകാരം, ദൈവം മശീഹാ യേശു മുഖാന്തരം[a] മനുഷ്യരുടെ രഹസ്യകാര്യങ്ങളെ ന്യായംവിധിക്കുന്ന നാളിൽ.


    [a] അഥവാ: “ക്രിസ്തുയേശു മുഖാന്തരം.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ക്രിസ്തുയേശു മുഖാന്തരം.”'
    reason: Χριστοῦ Ἰησοῦ എന്നതിന് പദവിയർഥം മുൻനിർത്താത്ത പരമ്പരാഗത പേരുരൂപം.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: ന്യായംവിധിക്കുന്ന നാളിൽ
  rationale: വരാനിരിക്കുന്ന ഒരു നിർദിഷ്ട ന്യായവിധിദിവസത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കാലഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρίνει
  choice: ന്യായംവിധിക്കുന്ന
  rationale: ഗ്രീക്കിൽ വർത്തമാനകാലരൂപമാണെങ്കിലും സന്ദർഭം ഭാവിയിലെ ന്യായവിധിയുടേതാണ്; മലയാളത്തിലെ ബന്ധകക്രിയാരൂപം ആ ഭാവിസൂചനയും ഗ്രീക്ക് ഘടനയും സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: τὰ κρυπτὰ
  choice: രഹസ്യകാര്യങ്ങളെ
  rationale: മനുഷ്യരിൽ മറഞ്ഞിരിക്കുന്നതോ മറ്റുള്ളവർക്ക് അറിയാത്തതോ ആയ കാര്യങ്ങളെ സൂചിപ്പിക്കുന്ന, വ്യക്തവും സ്വാഭാവികവുമായ പ്രയോഗം.
- source_word: τῶν ἀνθρώπων
  choice: മനുഷ്യരുടെ
  rationale: ἄνθρωπος ഇവിടെ പുരുഷന്മാരെ മാത്രം അല്ല, മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: എന്റെ സുവിശേഷപ്രകാരം
  rationale: പൗലോസിന്റെ വ്യക്തിപരമായ ഉടമസ്ഥസർവനാമവും εὐαγγέλιον എന്നതിന്റെ പതിവായ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മധ്യസ്ഥതയെയോ പ്രവർത്തനമാർഗത്തെയോ ‘മുഖാന്തരം’ വ്യക്തമാക്കുന്നു; Χριστός ഇവിടെ പദവിയായുള്ള അർഥം നിലനിർത്താൻ ‘മശീഹയായ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: Χριστοῦ എന്നത് പദവിയായോ പേരിന്റെ ഭാഗമായോ പരിഭാഷപ്പെടുത്തൽ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός എന്നതിന്റെ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന പദവിയർഥം ഇപ്പോഴും പ്രസക്തമാണ്. എന്നാൽ സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ പേരുരൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻസന്ദർഭത്തോട് വ്യാകരണപരമായി ബന്ധപ്പെടുന്ന വാക്യഖണ്ഡമായതിനാൽ അതിന്റെ അപൂർണവാക്യസ്വഭാവം നിലനിർത്തിയിരിക്കുന്നു.
