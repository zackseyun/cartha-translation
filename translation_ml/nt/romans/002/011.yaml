id: ROM.2.11
reference: Romans 2:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: ml
  text: കാരണം ദൈവത്തിന്റെ അടുക്കൽ പക്ഷപാതമില്ല[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അനുകൂലപരിഗണന.”
    reason: προσωπολημψία എന്ന പദത്തിന്റെ മറ്റൊരു സ്വാഭാവിക മലയാളസമാനപദം നൽകുന്നു.
lexical_decisions:
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് അടിസ്ഥാനം നൽകുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσωπολημψία
  choice: പക്ഷപാതം
  rationale: പദവി, വ്യക്തിത്വം, പുറമേയുള്ള ഘടകങ്ങൾ എന്നിവ നോക്കി ഒരാൾക്ക് അനുകൂലമായ പരിഗണന നൽകുന്നതിനെ സൂചിപ്പിക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ധാർമിക-ന്യായിക അർഥം നിലനിർത്തുന്നതുമായ പദമാണ്.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവത്തിന്റെ അടുക്കൽ
  rationale: ദൈവവുമായി ബന്ധപ്പെട്ട സാന്നിധ്യത്തെയോ പരിഗണനയെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തോടു ചേർന്നുനിൽക്കുകയും അസ്തിത്വവാക്യത്തിന്റെ ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ
  choice: കാരണം ദൈവത്തിന്റെ അടുക്കൽ പക്ഷപാതമില്ല.
  rationale: ഗ്രീക്കിലെ അസ്തിത്വഘടനയെ സജീവക്രിയാവാക്യമായി മാറ്റാതെ, വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ നിഷ്പക്ഷതയുടെ അവതരണം
  choice: ദൈവത്തിന്റെ അടുക്കൽ പക്ഷപാതം ഇല്ലെന്ന പൊതുപ്രസ്താവനയായി നിലനിർത്തുക.
  alternative: “ദൈവം പക്ഷപാതം കാണിക്കുന്നില്ല” എന്ന് സജീവക്രിയാവാക്യമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: രണ്ടു രൂപങ്ങളും മുഖ്യസത്യം അറിയിക്കുന്നുവെങ്കിലും, തിരഞ്ഞെടുത്ത രൂപം ഗ്രീക്കിലെ അസ്തിത്വവാക്യഘടന കൂടുതൽ നേരിട്ട് സംരക്ഷിക്കുകയും മൂലത്തിൽ വ്യക്തമല്ലാത്ത ക്രിയാപ്രവർത്തനം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. “ദൈവത്തിന്റെ അടുക്കൽ” എന്ന പ്രയോഗം മൂലഭാഷയുടെ ബന്ധാത്മകവും അസ്തിത്വപരവുമായ ഘടന കാത്തുസൂക്ഷിക്കുന്നു; “പക്ഷപാതം” സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
