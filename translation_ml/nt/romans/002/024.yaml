id: ROM.2.24
reference: Romans 2:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: ml
  text: എന്തെന്നാൽ, “നിങ്ങൾ നിമിത്തം ദൈവത്തിന്റെ നാമം ജനതകളുടെ ഇടയിൽ നിന്ദിക്കപ്പെടുന്നു”[a] എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ജനതകളുടെ ഇടയിൽ” എന്നത് ഈ സന്ദർഭത്തിൽ “യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: പൗലോസ് ഇവിടെ തിരുവെഴുത്തിനെ, പ്രത്യേകിച്ച് യെശയ്യാവ് 52:5-നെയും യെഹെസ്കേൽ 36:20–23-ൽ പ്രതിഫലിക്കുന്ന ആശയങ്ങളെയും, പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ശാസനയ്ക്കുള്ള വിശദീകരണകാരണം അവതരിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ നാമം
  rationale: ഗ്രീക്കിലെ ‘ദൈവത്തിന്റെ നാമം’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ, അതിന്റെ മാനവും പ്രസിദ്ധിയും ഉൾക്കൊള്ളാവുന്ന വിധത്തിൽ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾ നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു; പൗലോസിന്റെ കുറ്റാരോപണം വ്യക്തമായി നൽകുന്നു.
- source_word: βλασφημεῖται
  choice: ദുഷിക്കപ്പെടുന്നു
  rationale: ദൈവനാമത്തെക്കുറിച്ച് നിന്ദാപരമായി സംസാരിക്കുന്നതിന്റെ ശക്തമായ അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; വർത്തമാനകാല കർമണി രൂപവും നിലനിർത്തുന്നു.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: ജനതകളുടെ ഇടയിൽ
  rationale: ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ ‘ജനതകൾ’ എന്ന അർഥം നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: καθὼς γέγραπται
  choice: എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന സൂത്രവാക്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; καθώς സൂചിപ്പിക്കുന്ന പൊരുത്തവും ഉറപ്പും ‘-വല്ലോ’ വഴി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐν τοῖς ἔθνεσιν എന്നതിന്റെ പരിധി
  choice: ജനതകളുടെ ഇടയിൽ
  alternative: യഹൂദരല്ലാത്തവരുടെ ഇടയിൽ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ ബഹുവചന രൂപവും യെശയ്യാവ് 52:5-ലെ പ്രതിധ്വനിയും നിലനിർത്തുന്നു; റോമർ ലേഖനത്തിലെ യഹൂദ–ജനതാ പശ്ചാത്തലത്തിൽ അതിന്റെ പ്രത്യേക സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: തിരുവെഴുത്തിലെ പ്രതിധ്വനി
  choice: പ്രധാന വാചകത്തിൽ ഉദ്ധരണിയായി അടയാളപ്പെടുത്തി, ഉറവിടബന്ധം അടിക്കുറിപ്പിൽ നൽകുന്നു
  alternative: യെശയ്യാവിനെ പ്രധാന വാചകത്തിൽ നേരിട്ട് പേരെടുത്തുപറയുക
  rationale: ഗ്രീക്ക് വാചകം എഴുത്തിന്റെ പേര് പറയുന്നില്ല; അതിനാൽ പ്രധാന വാചകത്തിൽ ഇല്ലാത്ത വ്യക്തീകരണം ചേർക്കാതെ അന്തർഗ്രന്ഥബന്ധം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുഖ്യവാചകത്തിൽ തിരുവെഴുത്ത് ഉദ്ധരണി ഉദ്ധരണിച്ചിഹ്നങ്ങൾകൊണ്ട് വേർതിരിച്ചിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന വാചകത്തിൽ ചേർത്തിട്ടുണ്ട്.
