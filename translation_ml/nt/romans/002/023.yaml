id: ROM.2.23
reference: Romans 2:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: ml
  text: ന്യായപ്രമാണത്തിൽ അഭിമാനിക്കുന്ന നീ, ന്യായപ്രമാണം ലംഘിക്കുന്നതിലൂടെ ദൈവത്തെ അപമാനിക്കുന്നുവോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: ഗ്രീക്കിലെ ἐν എന്ന ബന്ധപദത്തിന്റെ രൂപം നിലനിർത്തുകയും സന്ദർഭത്തിലെ യഹൂദ ന്യായപ്രമാണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: καυχᾶσαι
  choice: അഭിമാനിക്കുന്ന
  rationale: καυχάομαι എന്ന പദത്തിലെ സ്വയംപ്രശംസയുടെയും ആശ്രയബോധത്തിന്റെയും വിമർശനാത്മക ഭാവം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: ന്യായപ്രമാണം ലംഘിക്കുന്നതിലൂടെ
  rationale: διάയുടെ മാർഗസൂചക അർഥവും παράβασις എന്നതിന്റെ അതിർകടക്കൽ/ലംഘനം എന്ന ആശയവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ക്രിയാരൂപത്തിലുള്ള വിവർത്തനം വാക്യത്തെ ഭാരമില്ലാത്തതാക്കുന്നു.
- source_word: τὸν θεὸν
  choice: ദൈവത്തെ
  rationale: നിർദിഷ്ടനായ ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് മലയാളത്തിലെ കർമവിഭക്തി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀτιμάζεις
  choice: അപമാനിക്കുന്നുവോ
  rationale: ἀτιμάζωയുടെ ‘മാനം കെടുത്തുക’ എന്ന ശക്തമായ അർഥവും ഗ്രീക്കിലെ ചോദ്യംചെയ്യുന്ന കുറ്റാരോപണഭാവവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: νόμος എന്ന പദത്തിന്റെ പൗലൊസീയ സന്ദർഭം
  choice: ന്യായപ്രമാണം
  alternative: നിയമം
  rationale: ഇവിടെ യഹൂദന്മാർക്ക് ലഭിച്ച ദൈവിക ന്യായപ്രമാണമാണ് സന്ദർഭപരമായ സൂചന. ‘ന്യായപ്രമാണം’ ആ സൂചന വ്യക്തമാക്കുന്നു; അതേസമയം ഗ്രീക്കിൽ ഇല്ലാത്ത കൂടുതൽ പ്രത്യേകമായ ഒരു സാങ്കേതിക ശീർഷകം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ചോദ്യം. രണ്ടാംപുരുഷ ഏകവചനവും പൗലൊസിന്റെ മൂർച്ചയുള്ള വാഗ്വാദഭാവവും നിലനിർത്തിയിരിക്കുന്നു.
