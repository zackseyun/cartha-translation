id: ROM.2.27
reference: Romans 2:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: ml
  text: സ്വഭാവത്താൽ പരിച്ഛേദനയില്ലാത്തവൻ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നുവെങ്കിൽ, എഴുത്തുപ്രമാണത്തിലൂടെയും പരിച്ഛേദനയിലൂടെയും[a] ന്യായപ്രമാണം ലംഘിക്കുന്ന നിന്നെ അവൻ വിധിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “എഴുത്തുപ്രമാണത്തിലൂടെയും പരിച്ഛേദനയിലൂടെയും” എന്നതിന് സന്ദർഭാനുസൃതമായി “എഴുതപ്പെട്ട പ്രമാണവും പരിച്ഛേദനയും ഉണ്ടായിട്ടും” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: പരിച്ഛേദനയില്ലാത്തവൻ
  rationale: പദത്തിന്റെ അക്ഷരാർഥം ‘പരിച്ഛേദനയില്ലായ്മ’ എന്നാണെങ്കിലും ഇവിടെ അത് പരിച്ഛേദനയില്ലാത്ത വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക പ്രയോഗമാണ്. ‘ജാതിയൻ’ എന്ന് വികസിപ്പിക്കാതെ മൂലപാഠത്തിലെ ശരീരചിഹ്നത്തെ ആസ്പദമാക്കിയ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἐκ φύσεως
  choice: സ്വഭാവത്താൽ
  rationale: പരിച്ഛേദനയില്ലാത്ത സ്വാഭാവിക അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ നേരിട്ടുള്ളതും മലയാളത്തിൽ ഗ്രാഹ്യവുമായ പരിഭാഷ.
- source_word: τελοῦσα
  choice: അനുഷ്ഠിക്കുന്നുവെങ്കിൽ
  rationale: വാക്യസന്ദർഭത്തിൽ കൃത്തിനാമരൂപത്തിന് വ്യവസ്ഥാസൂചകമായ ഭാവമുണ്ട്; ന്യായപ്രമാണം യഥാർഥത്തിൽ നടപ്പാക്കുന്നതിനെ ‘അനുഷ്ഠിക്കുക’ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: νόμον
  choice: ന്യായപ്രമാണം
  rationale: ഇവിടെ മോശെയുടെ ന്യായപ്രമാണം എന്ന നിർദിഷ്ട ആശയമാണ്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ പരിചിതവും മാന്യവുമായ പദം.
- source_word: διὰ γράμματος
  choice: എഴുതപ്പെട്ട പ്രമാണം ഉണ്ടായിട്ടും
  rationale: γράμμα ഇവിടെ എഴുത്തുരൂപത്തിലുള്ള നിയമസംഹിതയെ സൂചിപ്പിക്കുന്നു. διάയുടെ ഘടനയിലൂടെ ലഭിച്ച ആനുകൂല്യം ലംഘനത്തെ തടഞ്ഞില്ലെന്ന സന്ദർഭഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; അക്ഷരാർഥഘടന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: περιτομῆς
  choice: പരിച്ഛേദനം
  rationale: ഉടമ്പടിയുടെ ശരീരചിഹ്നത്തെ നേരിട്ടും സ്ഥിരതയോടെയും പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: παραβάτην νόμου
  choice: ന്യായപ്രമാണം ലംഘിക്കുന്ന
  rationale: παραβάτης എന്നതിന്റെ ലംഘകൻ എന്ന അർഥവും νόμος എന്ന പദവുമായുള്ള വ്യക്തമായ ബന്ധവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀκροβυστίαയെ വംശീയമായി ‘ജാതിയൻ’ എന്നു വ്യക്തമാക്കണമോ
  choice: പ്രധാനപാഠത്തിൽ ‘പരിച്ഛേദനയില്ലാത്തവൻ’ എന്നു നിലനിർത്തി.
  alternative: ജാതിയൻ
  rationale: പൗലോസിന്റെ വിശാലമായ വാദം യെഹൂദരെയും ജാതികളെയും സംബന്ധിക്കുന്നതാണെങ്കിലും ഈ വാക്യത്തിലെ വ്യക്തമായ പദവൈരുധ്യം പരിച്ഛേദനയും പരിച്ഛേദനയില്ലായ്മയും തമ്മിലാണ്. അതിനാൽ മൂലപാഠം പറയാത്ത വംശീയപദം ചേർത്ത് അർഥം നിർണയിക്കുന്നില്ല.
- issue: διὰ γράμματος καὶ περιτομῆς എന്നതിലെ διάയുടെ ബന്ധം
  choice: ‘എഴുതപ്പെട്ട പ്രമാണവും പരിച്ഛേദനയും ഉണ്ടായിട്ടും’ എന്ന ഇളവനുവാദം പ്രധാനപാഠത്തിൽ ഉപയോഗിച്ചു.
  alternative: ‘അക്ഷരത്തിലൂടെയും പരിച്ഛേദനയിലൂടെയും’ അല്ലെങ്കിൽ ‘എഴുതപ്പെട്ട പ്രമാണവും പരിച്ഛേദനയും മുഖേന’
  rationale: ഗ്രീക്ക് διά സാധാരണയായി ‘മുഖേന/വഴി’ എന്ന അർഥം നൽകുമെങ്കിലും, ഇവിടെ എഴുത്തുപ്രമാണവും പരിച്ഛേദനയും കൈവശമുണ്ടായിട്ടും ലംഘകനാകുന്ന വിരോധാഭാസമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കപ്പെടുന്നത്. വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ, മാന്യമായ ബൈബിൾ ശൈലി. ‘പരിച്ഛേദനം’, ‘ന്യായപ്രമാണം’ എന്നീ പരിചിത പദങ്ങൾ നിലനിർത്തി; നീണ്ട ഗ്രീക്ക് ഘടന മലയാളത്തിൽ വ്യക്തമായ വാക്യക്രമത്തിലാക്കി.
