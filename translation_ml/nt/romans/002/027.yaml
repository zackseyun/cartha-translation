revisions:
- from: സ്വഭാവത്താൽ പരിച്ഛേദനയില്ലാത്തവൻ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നുവെങ്കിൽ, എഴുതപ്പെട്ട പ്രമാണവും പരിച്ഛേദനയും ഉണ്ടായിട്ടും ന്യായപ്രമാണം ലംഘിക്കുന്ന നിന്നെ അവൻ വിധിക്കും.[a]
  to: സ്വഭാവത്താൽ പരിച്ഛേദനയില്ലാത്തവൻ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നുവെങ്കിൽ, എഴുത്തുപ്രമാണത്തിലൂടെയും പരിച്ഛേദനയിലൂടെയും[a] ന്യായപ്രമാണം ലംഘിക്കുന്ന നിന്നെ അവൻ വിധിക്കും.
  rationale: പ്രധാനപാഠത്തിൽ διάയുടെ നേരിട്ടുള്ള ‘മുഖേന/വഴി’ എന്ന അർഥം പുനഃസ്ഥാപിച്ചു; പൗലോസിന്റെ വാചകത്തിലെ വിരോധാഭാസം വ്യക്തമാക്കുന്ന ‘ഉണ്ടായിട്ടും’ എന്ന സന്ദർഭാനുസൃത വിവർത്തനം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് സൂചകം അതു വിശദീകരിക്കുന്ന പദസമുച്ചയത്തോടു ചേർത്തു.
