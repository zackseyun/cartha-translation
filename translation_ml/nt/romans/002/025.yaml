id: ROM.2.25
reference: Romans 2:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: ml
  text: നീ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നെങ്കിൽ പരിച്ഛേദനം പ്രയോജനമുള്ളതുതന്നെ[a]. എന്നാൽ നീ ന്യായപ്രമാണം ലംഘിക്കുന്നവനാണെങ്കിൽ, നിന്റെ പരിച്ഛേദനം അഗ്രചർമ്മമായിത്തീർന്നിരിക്കുന്നു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂല്യമുള്ളതാണ്.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിന്റെ പരിച്ഛേദനം അഗ്രചർമ്മമായിത്തീർന്നിരിക്കുന്നു”; അതായത്, ന്യായപ്രമാണം ലംഘിക്കുമ്പോൾ ഉടമ്പടിയുടെ അടയാളമായ പരിച്ഛേദനത്തിന് അതിന്റെ പ്രയോജനം നഷ്ടമാകുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: പരിച്ഛേദനം
  rationale: പൗലൊസിന്റെ ഉടമ്പടിസംബന്ധമായ വിഭാഗത്തെയും ἀκροβυστία എന്ന വിപരീതപദത്തോടുള്ള സമാന്തരതയെയും നിലനിർത്തുന്ന പ്രചാരത്തിലുള്ള ബൈബിൾപദം.
- source_word: μὲν γὰρ
  choice: പ്രയോജനമുള്ളതുതന്നെ
  rationale: μὲν γὰρ നൽകുന്ന ഉറപ്പിച്ച പ്രസ്താവനയും തുടർന്ന് വരുന്ന വൈരുധ്യത്തിനുള്ള ഒരുക്കവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കാൻ ‘തന്നെ’ ഉപയോഗിച്ചു.
- source_word: ὠφελεῖ
  choice: പ്രയോജനമുള്ളത്
  rationale: യഥാർഥമായ ഗുണമോ മൂല്യമോ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐὰν νόμον πράσσῃς
  choice: നീ ന്യായപ്രമാണം അനുഷ്ഠിക്കുന്നെങ്കിൽ
  rationale: πράσσω എന്നതിലെ ചെയ്യുക/പ്രവർത്തിക്കുക എന്ന ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ നിയമാനുസൃതമായ പ്രവൃത്തിയെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: παραβάτης νόμου
  choice: ന്യായപ്രമാണം ലംഘിക്കുന്നവൻ
  rationale: παραβάτης എന്നതിന്റെ ലംഘനാർഥവും νόμος എന്ന പദവുമായുള്ള വ്യക്തമായ ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: ἡ περιτομή σου
  choice: നിന്റെ പരിച്ഛേദനം
  rationale: നേരിട്ടുള്ള അഭിസംബോധനയും പൗലൊസിന്റെ വാദത്തിന്റെ പ്രഹരശക്തിയും നിലനിർത്തുന്ന ലളിതമായ ഉടമസ്ഥപ്രയോഗം.
- source_word: ἀκροβυστία
  choice: അഗ്രചർമം
  rationale: ഗ്രീക്കിലെ മൂർത്തവും ഞെട്ടിക്കുന്നതുമായ വിപരീതപ്രയോഗം സംരക്ഷിക്കുന്നു; ഇവിടെ പരിച്ഛേദനമില്ലാത്ത അവസ്ഥയെയും ഉടമ്പടിചിഹ്നത്തിന്റെ നഷ്ടപ്പെട്ട പ്രാബല്യത്തെയും സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: γέγονεν
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: പൂർണ്ണകാലക്രിയയിലെ മാറ്റവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: അവസാനവാക്യം ശാരീരിക നിലയായോ ഉടമ്പടിപരമായ നിലയായോ വ്യാഖ്യാനിച്ച് പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘നിന്റെ പരിച്ഛേദനം അഗ്രചർമമായിത്തീർന്നിരിക്കുന്നു’ എന്ന മൂർത്തമായ വിരുദ്ധപ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി.
  alternative: ‘നിന്റെ പരിച്ഛേദനം പരിച്ഛേദനമില്ലായ്മയായി കണക്കാക്കപ്പെടുന്നു’
  rationale: γέγονεν വെറും കണക്കാക്കലിനെക്കാൾ ശക്തമായ വാചാടോപപരമായ മറിച്ചിടലാണ് അവതരിപ്പിക്കുന്നത്. വ്യാഖ്യാനപരമായ പകരംവാക്യം ഗ്രീക്കിന്റെ തീക്ഷ്ണത കുറയ്ക്കും; ഉടമ്പടിപരമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം,’ ‘പരിച്ഛേദനം’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ സന്ദർഭത്തിന്റെ നിയമ-ഉടമ്പടി ഭാവം സംരക്ഷിക്കാൻ നിലനിർത്തി. ഗ്രീക്കിലെ ശക്തമായ പരിച്ഛേദനം/അഗ്രചർമം വിരോധം മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു.
