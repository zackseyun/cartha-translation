id: ROM.2.15
reference: Romans 2:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: ml
  text: നിയമത്തിന്റെ പ്രവൃത്തി തങ്ങളുടെ ഹൃദയങ്ങളിൽ എഴുതപ്പെട്ടിരിക്കുന്നുവെന്ന് അവർ കാണിക്കുന്നു.[a] അവരുടെ മനസ്സാക്ഷിയും സാക്ഷ്യം വഹിക്കുമ്പോൾ, അവരുടെ ചിന്തകൾ പരസ്പരം അവരെ കുറ്റപ്പെടുത്തുകയോ അവർക്കുവേണ്ടി വാദിക്കുകയോ ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “നിയമത്തിന്റെ ആവശ്യങ്ങൾ” അഥവാ “നിയമം ആവശ്യപ്പെടുന്നത്.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘പരസ്പരം’ എന്ന പദം ഉൾപ്പെടുന്നു; അതിനാൽ ചിന്തകൾ തമ്മിലുള്ള പരസ്പരബന്ധത്തിന്റെ ഭാവവും ഈ പ്രയോഗത്തിൽ കാണാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: കാണിക്കുന്നു
  rationale: തെളിവായി പ്രകടമാക്കുന്നു എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ‘തെളിയിക്കുന്നു’ എന്നു പറഞ്ഞ് കർശനമായ തെളിവിന്റെ ആശയം അതിരുകടത്തി ചേർക്കുന്നില്ല.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: നിയമത്തിന്റെ പ്രവൃത്തി
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ ‘പ്രവൃത്തി’ എന്ന പദപ്രയോഗം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു; ‘നിയമം ആവശ്യപ്പെടുന്നത്’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: തങ്ങളുടെ ഹൃദയങ്ങളിൽ എഴുതപ്പെട്ടിരിക്കുന്നു
  rationale: ആന്തരികമായി ആലേഖനം ചെയ്യപ്പെട്ടിരിക്കുന്നു എന്ന രൂപകം മലയാളത്തിൽ വ്യക്തവും ഗൗരവമുള്ളതുമായ രീതിയിൽ സംരക്ഷിക്കുന്നു.
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: അവരുടെ മനസ്സാക്ഷിയും അതോടൊപ്പം സാക്ഷ്യം വഹിക്കുന്നു
  rationale: സംയുക്തക്രിയയിലെ സഹസാക്ഷ്യത്തിന്റെ ഭാവം ‘അതോടൊപ്പം’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: അവരുടെ ചിന്തകൾ തമ്മിൽത്തമ്മിൽ
  rationale: വാക്യഘടന ചുരുക്കമുള്ളതും വ്യാഖ്യാനസാധ്യതയുള്ളതുമാണ്; ἀλλήλων എന്നതിലെ പരസ്പരഭാവം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുകയും കൂടുതൽ അക്ഷരാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: കുറ്റപ്പെടുത്തുകയോ അനുകൂലമായി വാദിക്കുകയോ
  rationale: ἀπολογέομαι എന്നത് വെറുതെ ‘ഒഴികഴിവു പറയുക’ എന്നതിലുപരി പ്രതിരോധിച്ച് വാദിക്കുക എന്ന അർഥമുള്ളതിനാൽ ‘അനുകൂലമായി വാദിക്കുക’ എന്നു നൽകി; καὶ നൽകുന്ന ഊന്നൽ ‘-യോ’ ഘടനയിലും വിപരീതമായ രണ്ടാമത്തെ സാധ്യതയിലും സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
theological_decisions:
- issue: ‘നിയമത്തിന്റെ പ്രവൃത്തി’ എന്നത് പൊതുവായ ആന്തരിക ധാർമികബോധത്തെയാണോ നിയമം ആവശ്യപ്പെടുന്ന കാര്യങ്ങളെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനം കുറഞ്ഞ ‘നിയമത്തിന്റെ പ്രവൃത്തി’ നിലനിർത്തി.
  alternative: ‘നിയമം ആവശ്യപ്പെടുന്നത്’ അല്ലെങ്കിൽ ‘നിയമത്തിന്റെ ആവശ്യങ്ങൾ’.
  rationale: ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമുള്ളതും ഈ വ്യാഖ്യാനങ്ങളെക്കാൾ കുറച്ച് വ്യക്തീകരിച്ചതുമാണ്; അതിനാൽ പൗലോസിന്റെ ഭാഷയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: ചിന്തകൾ പരസ്പരം ആരെ കുറ്റപ്പെടുത്തുകയോ അനുകൂലമായി വാദിക്കുകയോ ചെയ്യുന്നു എന്നത്
  choice: ചിന്തകൾ തമ്മിലുള്ള പരസ്പരപരിശോധന നിലനിർത്തിക്കൊണ്ട്, പ്രവർത്തനത്തിന്റെ ലക്ഷ്യമായി പ്രസക്തരായ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ‘അവരെ’ ചേർത്തു.
  alternative: ‘ചിന്തകൾ പരസ്പരം കുറ്റപ്പെടുത്തുകയോ ന്യായീകരിക്കുകയോ ചെയ്യുന്നു’ എന്ന കൂടുതൽ അക്ഷരാർഥമുള്ള വായന.
  rationale: ഗ്രീക്ക് വാക്യഘടന സങ്കുചിതമാണ്. ‘അവരെ’ എന്നത് സന്ദർഭത്തിൽ നിന്ന് പൂർത്തിയാക്കുന്നതാണ്; ἀλλήλων എന്ന പരസ്പരഭാവം ‘തമ്മിൽത്തമ്മിൽ’ എന്നതിലൂടെ നഷ്ടപ്പെടുന്നില്ല. മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിയമത്തിന്റെ പ്രവൃത്തി’ പോലുള്ള മൂലഭാഷയിലെ സാന്ദ്രമായ പദപ്രയോഗം ലളിതീകരിച്ച് ദൈവശാസ്ത്രപരമായി തീർപ്പാക്കാതെ സൂക്ഷിച്ചു; ആശയവ്യക്തതയ്ക്കായി ആവശ്യമായിടത്ത് അടിക്കുറിപ്പുകൾ നൽകി.
