  verdict: revise
  source_fidelity: 'പ്രധാനവാക്യം ഗ്രീക്കിലെ ഘടനയും ആശയവും പൊതുവേ നന്നായി പ്രതിഫലിപ്പിക്കുന്നു: നിയമത്തിന്റെ ‘പ്രവൃത്തി’ എന്ന വ്യാഖ്യാനസാന്ദ്രമായ പ്രയോഗവും, ഹൃദയങ്ങളിലെ എഴുത്തും, മനസ്സാക്ഷിയുടെ സാക്ഷ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്. എന്നാൽ ἀπολογουμένων-ന്റെ വ്യക്തിയോടുള്ള പ്രതിരോധാർഥം ‘അനുകൂലമായി വാദിക്കുക’ എന്നതിനെക്കാൾ ‘അവർക്കുവേണ്ടി വാദിക്കുക’ എന്നു വ്യക്തമാക്കുന്നതാണ് കൂടുതൽ കൃത്യം. μεταξὺ ἀλλήλων-ന്റെ വാക്യഘടനാപരമായ ബന്ധം പൂർണമായി നിർണയിക്കാനാകാത്തതിനാൽ അതിന്റെ പരസ്പരഭാവം പ്രധാനപാഠത്തിലും അടിക്കുറിപ്പിലും സൂക്ഷിച്ചിട്ടുണ്ട്.'
  naturalness: ‘മനസ്സാക്ഷിയും അതോടൊപ്പം സാക്ഷ്യം വഹിക്കുന്നു’ എന്നതിലെ ‘അതോടൊപ്പം’ എന്തിനോടാണ് ചേർന്നുനിൽക്കുന്നതെന്നത് മലയാളത്തിൽ അല്പം അസ്പഷ്ടമാണ്. ‘മനസ്സാക്ഷിയും സാക്ഷ്യം വഹിക്കുമ്പോൾ’ എന്ന ഘടന സ്വാഭാവികവും ഗ്രീക്കിലെ genitive absolute-നോട് യോജിച്ചതുമാണ്. ‘പരസ്പരം’ ആധുനിക നിലവാരമലയാളത്തിൽ ‘തമ്മിൽത്തമ്മിൽ’ എന്നതിനെക്കാൾ സുഗമമാണ്.
  terminology: ‘നിയമത്തിന്റെ പ്രവൃത്തി’ എന്നത് τὸ ἔργον τοῦ νόμου-വിനെ വ്യാഖ്യാനിച്ച് ‘ആവശ്യങ്ങൾ’ ആക്കാതെ പ്രതിഫലിപ്പിക്കുന്ന യോജിച്ച പ്രയോഗമാണ്. ‘മനസ്സാക്ഷി,’ ‘സാക്ഷ്യം വഹിക്കുക,’ ‘കുറ്റപ്പെടുത്തുക’ എന്നിവയും യോജിച്ച രജിസ്റ്ററിലാണ്. ἀπολογέομαι-ക്കായി ‘അവർക്കുവേണ്ടി വാദിക്കുക’ ഉപയോഗിക്കുന്നത് വെറും മാപ്പുപറച്ചിൽ അർഥം ഒഴിവാക്കി പ്രതിരോധത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
