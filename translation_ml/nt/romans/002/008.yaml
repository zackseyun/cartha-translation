  to: 'എന്നാൽ സ്വാർഥാഭിലാഷത്താൽ പ്രേരിതരായി[a] സത്യത്തെ അനുസരിക്കാതെ, മറിച്ച് അനീതിയെ[b] അനുസരിക്കുന്നവർക്ക്: ക്രോധവും ഉഗ്രകോപവും.'
  rationale: The revision more precisely renders ἐριθεία as self-interested ambition, explicitly reflects the Greek adversative δέ, and relocates footnote [b] to its proper lexical anchor. It retains the source's terse, verbless judicial result and preserves the distinction between ὀργή and θυμός.
