id: ROM.2.8
reference: Romans 2:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: ml
  text: 'എന്നാൽ സ്വാർഥാഭിലാഷത്താൽ പ്രേരിതരായി[a] സത്യത്തെ അനുസരിക്കാതെ, മറിച്ച് അനീതിയെ[b] അനുസരിക്കുന്നവർക്ക്: ക്രോധവും ഉഗ്രകോപവും.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്വാർഥതാൽപര്യമുള്ളവരായി.”
    reason: lexical_alternative
  - marker: b
    text: “അനീതി” എന്നതിന് “നീതികേട്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: സ്വാർഥമോഹത്താൽ നയിക്കപ്പെട്ട്
  rationale: ἐξ സൂചിപ്പിക്കുന്ന പ്രേരണയെയോ ഉറവിടത്തെയോ വ്യക്തമാക്കുകയും ἐριθείαയുടെ സ്വാർഥവും മത്സരാത്മകവുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: സത്യത്തെ അനുസരിക്കാതെ
  rationale: ἀπειθέω ഇവിടെ വെറും അവിശ്വാസമല്ല, മനഃപൂർവമായ അനുസരണക്കേടാണ് സൂചിപ്പിക്കുന്നത്; എതിർവശത്തുള്ള πειθομένοις എന്ന പദവുമായുള്ള സമാന്തരതയും ഈ പരിഭാഷ നിലനിർത്തുന്നു.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: അനീതിയെ അനുസരിക്കുന്നവർക്ക്
  rationale: സത്യത്തോടുള്ള അനുസരണക്കേടിന് എതിർദിശയിലുള്ള വിധേയത്വം എന്ന ആശയം നേരിട്ട് പ്രകടമാക്കുന്നു.
- source_word: ἀδικίᾳ
  choice: അനീതി
  rationale: പൗലോസിന്റെ നീതി–അനീതി പദബന്ധം കാത്തുസൂക്ഷിക്കുമ്പോൾ തന്നെ ധാർമിക തെറ്റും നീതിവിരുദ്ധതയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദമാണ്.
- source_word: ὀργὴ
  choice: ക്രോധം
  rationale: ഈ ന്യായവിധിസന്ദർഭത്തിലെ ഗൗരവമുള്ള ദൈവിക കോപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: θυμός
  choice: ഉഗ്രകോപം
  rationale: ὀργήയോടൊപ്പം വരുന്ന ശക്തിവർധകമായ രണ്ടാമത്തെ പദത്തിന്റെ തീവ്രത വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: implicit verbal ellipsis
  choice: അനുസരിക്കുന്നവർക്ക് എന്നതിന് ശേഷം ദ്വിബിന്ദു
  rationale: ഗ്രീക്കിലെ ക്രിയാരഹിതവും സംക്ഷിപ്തവുമായ ഫലപ്രസ്താവന നിലനിർത്തുന്നു; ‘ഉണ്ടാകും’ പോലുള്ള വ്യക്തമല്ലാത്ത ക്രിയ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ദൈവിക ന്യായവിധിയുടെ പശ്ചാത്തലത്തിൽ ἀδικία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അനീതി
  alternative: നീതികേട്
  rationale: ‘അനീതി’ പൗലോസിന്റെ നീതി–അനീതി ദൈവശാസ്ത്രപരമായ പദബന്ധം സംരക്ഷിക്കുകയും ധാർമിക തെറ്റിനെയും നീതിവിരുദ്ധതയെയും ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു; ‘നീതികേട്’ കൂടുതൽ സാധാരണഭാഷാപരമായ സാധുവായ മറ്റൊരു വായനയാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ സമാന്തര ഘടനയും അവസാനത്തെ ക്രിയാരഹിതമായ സംക്ഷിപ്തതയും ദ്വിബിന്ദുവിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
