    rationale: ‘നിയമം ആവശ്യപ്പെടുന്ന കാര്യങ്ങൾ’ corresponds to an acceptable interpretive rendering (‘what the law requires’) but narrows the more open Greek phrase, literally ‘the things of the law.’ Moving it to the footnote better follows optimal equivalence and preserves ambiguity.
