id: ROM.2.14
reference: Romans 2:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: ml
  text: 'നിയമം ഇല്ലാത്ത ജനതകൾ[a] സ്വാഭാവികമായി[b] നിയമത്തിന്റെ കാര്യങ്ങൾ ചെയ്യുമ്പോഴെല്ലാം, നിയമം ഇല്ലെങ്കിലും അവർ തങ്ങൾക്കുതന്നെ നിയമമാണ്.


    [a] അഥവാ “യെഹൂദരല്ലാത്തവർ.”


    [b] അഥവാ “സഹജപ്രേരണയാൽ.”


    [c] അഥവാ “നിയമം ആവശ്യപ്പെടുന്ന കാര്യങ്ങൾ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യെഹൂദരല്ലാത്തവർ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “സഹജപ്രേരണയാൽ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “നിയമം ആവശ്യപ്പെടുന്ന കാര്യങ്ങൾ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യെഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നതിനാൽ ആ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: νόμον / νόμου / νόμος
  choice: നിയമം
  rationale: മോശൈക നിയമം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളപ്പെടുന്നുവെങ്കിലും, അവസാനത്തെ ‘തങ്ങൾക്കുതന്നെ ഒരു നിയമം’ എന്ന പ്രയോഗത്തോടുള്ള പദബന്ധവും വാക്ചാതുര്യവും നിലനിർത്താൻ എല്ലായിടത്തും ‘നിയമം’ ഉപയോഗിച്ചു.
- source_word: φύσει
  choice: സ്വാഭാവികമായി
  rationale: ജന്മസിദ്ധമായ ധാർമികബോധം, സഹജപ്രേരണം, അല്ലെങ്കിൽ സ്വാഭാവിക അവസ്ഥ എന്നിവയിൽ ഒന്നായി അർഥം ചുരുക്കാതെ ഗ്രീക്കിലെ തുറന്ന അർഥസാധ്യത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: നിയമം ആവശ്യപ്പെടുന്ന കാര്യങ്ങൾ ചെയ്യുന്നു
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം അടിക്കുറിപ്പിൽ ചേർത്തിരിക്കുന്നു.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: അവർ തങ്ങൾക്കുതന്നെ ഒരു നിയമമാണ്
  rationale: സ്വയം നിയമനിർമാണം നടത്തുന്നു എന്ന ആശയം അനാവശ്യമായി ശക്തിപ്പെടുത്താതെ ദാതൃവിഭക്തിയുടെ അർഥവും പൗലോസിന്റെ പദപ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: φύσει എന്നത് ധാർമികജ്ഞാനത്തോടും മനസ്സാക്ഷിയോടും എങ്ങനെ ബന്ധപ്പെടുന്നു
  choice: പ്രധാനപാഠത്തിൽ ‘സ്വാഭാവികമായി’ എന്ന് നൽകി അർഥം തുറന്നുവെച്ചു.
  alternative: ‘സഹജപ്രേരണയാൽ’ എന്ന് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ ഒറ്റ പദം ജന്മസിദ്ധമായ ധാർമികബോധം, സഹജപ്രേരണം, പതിവ് പെരുമാറ്റം എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് മാത്രമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് നിർബന്ധിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും സംരക്ഷിച്ചു.
- issue: ἔθνη എന്നത് പൊതുവായ ‘ജനതകൾ’ ആണോ യെഹൂദരല്ലാത്തവരോ
  choice: പ്രധാനപാഠത്തിൽ ‘ജനതകൾ’; അടിക്കുറിപ്പിൽ ‘യെഹൂദരല്ലാത്തവർ.’
  alternative: പ്രധാനപാഠത്തിൽ തന്നെ ‘യെഹൂദരല്ലാത്തവർ’ എന്ന് നൽകുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ അടിസ്ഥാന വ്യാപ്തി നിലനിർത്തിക്കൊണ്ട്, റോമർ 2-ലെ യെഹൂദ-ജനതാ വൈരുധ്യം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. പരമ്പരാഗതമായ ‘ന്യായപ്രമാണം’ എന്നതിനു പകരം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ ‘നിയമം’ ഉപയോഗിച്ചു; ഇതിലൂടെ വാക്യത്തിലെ νόμος എന്ന പദത്തിന്റെ ആവർത്തനവും അവസാന ഉപമയും വ്യക്തമായി നിലനിൽക്കുന്നു.
