id: ROM.2.10
reference: Romans 2:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: ml
  text: എന്നാൽ നന്മ[a] ചെയ്യുന്ന ഏവർക്കും മഹത്ത്വവും ബഹുമാനവും സമാധാനവും ലഭിക്കും—ആദ്യം യെഹൂദനും, ഗ്രീക്കുകാരനും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നല്ലത് ചെയ്യുക.”
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ഗ്രീക്കുകാരൻ” എന്നത് വിശാലമായി യെഹൂദനല്ലാത്തവരെ, അതായത് വിജാതീയരെ, സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: ബഹുമാനത്തോടും അന്തിമ പ്രതിഫലത്തോടും ബന്ധപ്പെട്ട പദത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന സ്വാഭാവികമായ മലയാളപദം.
- source_word: τιμή
  choice: ബഹുമാനം
  rationale: δόξα എന്നതിനോടൊപ്പം വരുന്ന പ്രതിഫലഭാഷയ്ക്ക് യോജിക്കുന്ന, ആധുനിക മലയാളത്തിൽ വ്യക്തമായ തത്തുല്യപദം.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: ആന്തരിക ശാന്തി, ക്ഷേമം, ബന്ധപരമായ പൂർണത എന്നിവയിൽ ഏതെങ്കിലും ഒന്നിലേക്കു മാത്രം അർഥം ചുരുക്കാതെ വിശാലമായ ബൈബിൾസംബന്ധമായ അർഥം നിലനിർത്തുന്നു.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: പ്രവർത്തിക്കുന്ന ഏവർക്കും
  rationale: തുടർച്ചയായോ സ്വഭാവസവിശേഷമായോ നന്മ ചെയ്യുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ ἀγαθόν
  choice: നന്മ
  rationale: ‘നല്ലത്’ അഥവാ ‘നന്മ’ എന്ന അർഥം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: Ἰουδαίῳ
  choice: യെഹൂദനും
  rationale: പ്രതിനിധാനപരമായ ഏകവചനത്തെ നിലനിർത്തി, യെഹൂദനെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: പൗലോസിന്റെ സംക്ഷിപ്തമായ ക്രമസൂചന വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
- source_word: Ἕλληνι
  choice: ഗ്രീക്കുകാരനും
  rationale: ‘യെഹൂദൻ–ഗ്രീക്കുകാരൻ’ എന്ന മൂലപാഠത്തിലെ പദജോടി നിലനിർത്തുന്നു; വിശാലമായ ‘യെഹൂദനല്ലാത്തവൻ’ എന്ന പ്രയോഗാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ക്രോധവും കഷ്ടതയും സംബന്ധിച്ച പ്രസ്താവനയോടുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ യെഹൂദൻ–ഗ്രീക്കുകാരൻ വൈരുധ്യത്തിൽ Ἕλληνι എന്നതിന്റെ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ഗ്രീക്കുകാരൻ’ എന്നു നൽകി, ‘യെഹൂദനല്ലാത്തവർ’ എന്ന വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
  alternative: വിജാതീയൻ / യെഹൂദനല്ലാത്തവൻ
  rationale: മൂലഗ്രീക്കിലെ നേരിട്ടുള്ള ജനവിഭാഗനാമം സംരക്ഷിക്കുമ്പോഴും റോമർ ലേഖനത്തിലെ അതിന്റെ വിശാലമായ വംശീയ-മതപരമായ പ്രയോഗം മറച്ചുവയ്ക്കുന്നില്ല.
- issue: ക്രിയയില്ലാത്ത ഗ്രീക്ക് പ്രതിഫലപ്രസ്താവനയുടെ മലയാളാവിഷ്കാരം
  choice: സ്വാഭാവികമായ പൂർണവാക്യത്തിനായി ‘ലഭിക്കും’ ചേർത്തു.
  alternative: ‘മഹത്ത്വവും ബഹുമാനവും സമാധാനവും’ എന്ന ക്രിയയില്ലാത്ത രൂപം
  rationale: മുൻസന്ദർഭത്തിൽ ദൈവിക ന്യായവിധിയുടെ പ്രതിഫലമാണ് ഉദ്ദേശ്യമെന്നത് വ്യക്തമാണെങ്കിലും, പ്രതിഫലത്തിന്റെ കൃത്യമായ ദൈവശാസ്ത്രസ്വഭാവം കൂടുതൽ നിർവചിക്കാതെ മലയാളത്തിൽ വാക്യം സ്വാഭാവികമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലപാഠത്തിലെ വൈരുധ്യം ‘എന്നാൽ’ എന്നതിലൂടെയും യെഹൂദന് ലഭിക്കുന്ന ‘ആദ്യം’ എന്ന ക്രമസൂചനയിലൂടെയും നിലനിർത്തി. ഡാഷുകൾ പട്ടികാസദൃശമായ ദാതൃപ്രയോഗം വായനാസൗകര്യത്തോടെ വേർതിരിക്കുന്നു.
