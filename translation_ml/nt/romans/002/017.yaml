id: ROM.2.17
reference: Romans 2:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: ml
  text: എന്നാൽ, നീ നിന്നെത്തന്നെ യെഹൂദൻ എന്നു വിളിക്കുകയും[a] നിയമത്തിൽ ആശ്രയിക്കുകയും[b] ദൈവത്തിൽ അഭിമാനം കൊള്ളുകയും ചെയ്യുന്നുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘യെഹൂദൻ എന്ന പേര് വഹിക്കുകയും’ അല്ലെങ്കിൽ ‘യെഹൂദൻ എന്നു വിളിക്കപ്പെടുകയും.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നിയമത്തിൽ വിശ്രമിക്കുകയും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: എന്നാൽ … ചെയ്യുന്നുവെങ്കിൽ
  rationale: εἰയുടെ വ്യവസ്ഥാഭാവവും δέയുടെ മൃദുവായ വൈരുധ്യ-തുടർച്ചാഭാവവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: Ἰουδαῖος
  choice: യെഹൂദൻ
  rationale: റോമർ ലേഖനത്തിലെ പ്രയോഗം മുഖ്യമായി ഭൂമിശാസ്ത്രപരമല്ല, വംശീയ-മതപരമായ തിരിച്ചറിയലിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐπονομάζῃ
  choice: നിന്നെത്തന്നെ … എന്നു വിളിക്കുകയും
  rationale: മധ്യമപ്രയോഗത്തിലെ ആത്മനിർദ്ദേശസാധ്യതയും ആ പേര് സ്വയം അവകാശപ്പെടുന്നു എന്ന പൗലോസിന്റെ വാചാടോപഭാവവും വ്യക്തമാക്കുന്നു; പകരമായ അർഥങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπαναπαύῃ
  choice: ആശ്രയിക്കുകയും
  rationale: ശാരീരികമായ വിശ്രമമല്ല, നിയമത്തിൽ ആത്മവിശ്വാസം വെക്കുന്നതാണ് സന്ദർഭത്തിലെ ആശയം. ‘ആശ്രയിക്കുക’ ആ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: νόμῳ
  choice: നിയമത്തിൽ
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് മോശെയുടെ നിയമമെന്ന തിരിച്ചറിയാവുന്ന ഉടമ്പടിവിഭാഗമാണെന്ന് സന്ദർഭം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിയമം’ സ്വാഭാവികവും പൊതുവായ വായനക്കാർക്ക് ഗ്രാഹ്യവുമാണ്.
- source_word: καυχᾶσαι
  choice: അഭിമാനം കൊള്ളുകയും
  rationale: καυχάομαιയുടെ ആത്മപ്രശംസ/അഭിമാനഭാവം നിലനിർത്തുന്നു; ‘പ്രശംസിക്കുക’ എന്നത് ദൈവത്തെ സ്തുതിക്കുന്നു എന്ന തെറ്റായ ധാരണ ഉണ്ടാക്കാം.
- source_word: ἐν θεῷ
  choice: ദൈവത്തിൽ
  rationale: ἐν എന്ന മുൻവാകിന്റെ രൂപവും പൗലോസിന്റെ ‘ദൈവത്തിൽ അഭിമാനം കൊള്ളുക’ എന്ന പ്രയോഗവും കഴിയുന്നത്ര നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: νόμος ഇവിടെ മോശെയുടെ നിയമത്തെയാണോ പൊതുവായ നിയമത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: പ്രധാനപാഠത്തിൽ ‘നിയമം’
  alternative: ‘മോശെയുടെ നിയമം’ അല്ലെങ്കിൽ ‘ന്യായപ്രമാണം’
  rationale: സന്ദർഭം മോശെയുടെ നിയമത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും, മൂലപാഠത്തിൽ ‘മോശെയുടെ’ എന്നു വ്യക്തമാക്കിയിട്ടില്ല. അതിനാൽ വിശദീകരണം പാഠത്തിൽ ചേർക്കാതെ ‘നിയമം’ എന്ന് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരമ്പരാഗത സഭാപദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘നിയമം’ ഉപയോഗിച്ചു. ഈ വാക്യം അടുത്ത വാക്യങ്ങളിലേക്ക് നീളുന്ന വ്യവസ്ഥാവാക്യമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
