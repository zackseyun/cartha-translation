id: ROM.2.3
reference: Romans 2:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: ml
  text: എന്നാൽ, ഇത്തരം കാര്യങ്ങൾ ചെയ്യുന്നവരെ വിധിക്കുകയും അതേ കാര്യങ്ങൾ തന്നെ ചെയ്യുകയും ചെയ്യുന്ന മനുഷ്യാ,[a] നീ ദൈവത്തിന്റെ ന്യായവിധിയിൽനിന്ന് ഒഴിഞ്ഞുമാറുമെന്ന് കരുതുന്നുവോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വ്യക്തിയേ.’ ഗ്രീക്കിൽ ഇവിടെ ഏകവചനത്തിലുള്ള ‘മനുഷ്യാ’ എന്ന പദം ഒരു പ്രതിനിധിയായ മനുഷ്യനെ അഭിസംബോധന ചെയ്യുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: കരുതുന്നുവോ
  rationale: മനസ്സിൽ കണക്കുകൂട്ടുകയോ ധരിക്കുകയോ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്ന ക്രിയ; വാക്യത്തിലെ ചോദ്യം കുറ്റപ്പെടുത്തുന്ന വാചാടോപചോദ്യമായതിനാൽ ‘കരുതുന്നുവോ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: പ്രതിനിധിയായ ഒരു മനുഷ്യനെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്ന ഏകവചന സംബോധന; ഗ്രീക്കിലെ വാചാടോപശൈലിയും പൊതുമാനുഷിക പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: κρίνων
  choice: വിധിക്കുകയും
  rationale: മറ്റുള്ളവരുടെ പ്രവൃത്തികളെ നൈതികമായി വിലയിരുത്തുന്ന അർഥം നേരിട്ട് നൽകുന്നു; ‘കുറ്റം വിധിക്കുക’ എന്നതിലധികം ശക്തമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: πράσσοντας
  choice: പ്രവർത്തിക്കുന്നവരെ
  rationale: തുടർച്ചയായ പെരുമാറ്റം സൂചിപ്പിക്കുകയും പിന്നാലെയുള്ള ποιῶν എന്ന ക്രിയയിൽനിന്നുള്ള പൗലോസിന്റെ പദവ്യത്യാസം കഴിയുന്നത്ര നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ποιῶν αὐτά
  choice: അതേ കാര്യങ്ങൾതന്നെ ചെയ്യുകയും
  rationale: മുമ്പ് പറഞ്ഞ പ്രവൃത്തികളിലേക്കുള്ള സൂചന വ്യക്തമായി തിരിച്ചുപിടിക്കുകയും കുറ്റപ്പെടുത്തലിലെ വൈരുധ്യത്തിന് സ്വാഭാവികമായ ഊന്നൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐκφεύξῃ
  choice: ഒഴിഞ്ഞുമാറുമെന്ന്
  rationale: വരാനിരിക്കുന്ന ദൈവിക ന്യായവിധിയിൽനിന്ന് രക്ഷപ്പെടുകയോ അതിനെ ഒഴിവാക്കുകയോ ചെയ്യുമെന്ന ആശയം കൃത്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: κρίμα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ ന്യായവിധി
  rationale: ദൈവത്തിന്റെ നീതിന്യായപരമായ വിധിയെ വിശാലമായി സൂചിപ്പിക്കുന്നു; ‘ശിക്ഷാവിധി’ എന്ന് വിവർത്തനം ചെയ്ത് അർഥം അനാവശ്യമായി ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: κρίμα എന്നത് വിധിനിർണയമോ ശിക്ഷാവിധിയോ
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി
  rationale: ഇവിടെ ദൈവത്തിന്റെ നീതിന്യായപരമായ വിധിയെ പൊതുവായി സൂചിപ്പിക്കാം; ശിക്ഷ എന്ന ഫലം മാത്രം മുൻകൂട്ടി നിർണ്ണയിക്കാതെ മൂലപാഠത്തിന്റെ പരിധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘മനുഷ്യാ’ എന്ന സംബോധന പൗലോസിന്റെ നേരിട്ടുള്ള വാചാടോപശൈലി നിലനിർത്തുന്നു. വാക്യക്രമം മലയാളത്തിൽ സ്വാഭാവികമാക്കിയെങ്കിലും വിധിക്കുന്നവനും അതേ പ്രവൃത്തികൾ ചെയ്യുന്നവനും ഒരാളാണെന്ന വൈരുധ്യവും അവസാനത്തെ വാചാടോപചോദ്യവും സംരക്ഷിച്ചിട്ടുണ്ട്.
