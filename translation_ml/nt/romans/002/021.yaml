source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: ml
  text: അതുകൊണ്ട്, മറ്റൊരാളെ പഠിപ്പിക്കുന്ന നീ നിന്നെത്തന്നെ പഠിപ്പിക്കുന്നില്ലേ? “മോഷ്ടിക്കരുത്” എന്നു പ്രഘോഷിക്കുന്ന നീ മോഷ്ടിക്കുന്നുവോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനാത്മകമായ മുന്നേറ്റം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: διδάσκων
  choice: പഠിപ്പിക്കുന്ന
  rationale: കർത്തൃപ്രയോഗത്തിലുള്ള വർത്തമാനകാല പങ്കാളിത്തരൂപത്തിന്റെ സ്വഭാവസൂചന മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണപ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἕτερον
  choice: മറ്റൊരാളെ
  rationale: ഗ്രീക്കിലെ ഏകവചന കർമത്തെ വിശ്വസ്തമായി നിലനിർത്തുന്നു.
- source_word: σεαυτὸν
  choice: നിന്നെത്തന്നെ
  rationale: മറ്റൊരാളെ പഠിപ്പിക്കുന്നതും സ്വയം പഠിപ്പിക്കാത്തതും തമ്മിലുള്ള മൂർച്ചയുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: οὐ διδάσκεις;
  choice: പഠിപ്പിക്കുന്നില്ലേ?
  rationale: നിഷേധാത്മക വാചാടോപചോദ്യത്തിന്റെ ശാസനാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: κηρύσσων
  choice: പരസ്യമായി പ്രസ്താവിക്കുന്ന
  rationale: സഭാപരമായ പ്രത്യേക അർഥം അനാവശ്യമായി ചുമത്താതെ പൊതുവായി വിളിച്ചറിയിക്കുന്നതിന്റെ അർഥം നൽകുന്നു.
- source_word: μὴ κλέπτειν
  choice: “മോഷ്ടിക്കരുത്” എന്നു
  rationale: പ്രഖ്യാപനത്തിന്റെ ഉള്ളടക്കം മലയാളത്തിൽ സ്വാഭാവികമായ നേരിട്ടുള്ള നിരോധനമായി അവതരിപ്പിക്കുന്നു.
- source_word: κλέπτεις;
  choice: മോഷ്ടിക്കുന്നുവോ?
  rationale: പൗലോസിന്റെ നേരിട്ടുള്ള കുറ്റപ്പെടുത്തൽഭാവമുള്ള വാചാടോപചോദ്യം നിലനിർത്തുന്നു.
