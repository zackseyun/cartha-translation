id: ROM.2.29
reference: Romans 2:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: ml
  text: എന്നാൽ ഉള്ളിൽ യെഹൂദനായവനാണു യെഹൂദൻ; ഹൃദയത്തിന്റെ പരിച്ഛേദനം ആത്മാവിൽ, അക്ഷരത്തിലല്ല. അവന്റെ പ്രശംസ മനുഷ്യരിൽനിന്നല്ല, ദൈവത്തിൽനിന്നാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: ഉള്ളിൽ
  rationale: പുറമേയുള്ളതും മറഞ്ഞിരിക്കുന്ന ആന്തരിക യാഥാർഥ്യവും തമ്മിലുള്ള പൗലോസിന്റെ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു; ‘രഹസ്യമായി’ എന്ന തെറ്റായ ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: Ἰουδαῖος
  choice: യെഹൂദൻ
  rationale: ഇവിടെ ഭൂമിശാസ്ത്രപരമായ ‘യെഹൂദ്യൻ’ എന്നതിലുപരി ഉടമ്പടി-മതപരമായ അർഥമാണ് സന്ദർഭത്തിനു യോജിക്കുന്നത്.
- source_word: περιτομὴ καρδίας
  choice: ഹൃദയത്തിന്റെ പരിച്ഛേദന
  rationale: ശാരീരിക അടയാളത്തോടുള്ള വൈരുധ്യം നിലനിർത്തിക്കൊണ്ട് മൂലത്തിലെ രൂപകം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐν πνεύματι
  choice: ആത്മാവിനാൽ
  rationale: പൗലോസിന്റെ ‘ആത്മാവ്–അക്ഷരം’ വൈരുധ്യത്തിൽ പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനമാണ് കൂടുതൽ സാധ്യതയുള്ള സൂചന; ἐν എന്നതിന്റെ ഉപകരണാർഥം മലയാളത്തിലെ ‘-നാൽ’ സ്വാഭാവികമായി നൽകുന്നു. യഥാർഥ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐ γράμματι
  choice: അക്ഷരത്താലല്ല
  rationale: γράμμα എന്ന പദത്തിന്റെ രൂപവും പൗലോസിന്റെ സ്ഥാപിതമായ ‘ആത്മാവ്–അക്ഷരം’ വൈരുധ്യവും അതിവ്യാഖ്യാനം കൂടാതെ സംരക്ഷിക്കുന്നു.
- source_word: οὗ ὁ ἔπαινος
  choice: അവനുള്ള പ്രശംസ
  rationale: ബന്ധസർവനാമം ഉള്ളിലെ യെഹൂദനെ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐξ ἀνθρώπων
  choice: മനുഷ്യരിൽനിന്ന്
  rationale: ലിംഗഭേദം സൂചിപ്പിക്കാത്ത പൊതുവായ ബഹുവചനാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἐκ τοῦ θεοῦ
  choice: ദൈവത്തിൽനിന്ന്
  rationale: മൂലവാക്യത്തിന്റെ നേരിട്ടുള്ളതും വിപുലീകരിക്കാത്തതുമായ വിവർത്തനം.
theological_decisions:
- issue: πνεύματι പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യന്റെ ആത്മാവിനെയോ ആന്തരിക ആത്മീയ യാഥാർഥ്യത്തെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പ്രധാന പാഠത്തിൽ ‘ആത്മാവിനാൽ’ എന്നു നൽകി പരിശുദ്ധാത്മാവിനെ സാധ്യതയേറിയ സൂചനയായി സ്വീകരിച്ചു
  alternative: ‘ആത്മാവിൽ’—മനുഷ്യന്റെ ആന്തരിക ആത്മാവിൽ അഥവാ ആന്തരിക ആത്മീയ യാഥാർഥ്യത്തിൽ
  rationale: ‘അക്ഷരം’ എന്നതിനോടുള്ള പൗലോസിന്റെ വൈരുധ്യം പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തെ കൂടുതൽ സാധ്യതയുള്ളതാക്കുന്നു. എങ്കിലും വ്യാകരണവും ഉടൻസന്ദർഭവും മറ്റൊരു വായനയെ പൂർണമായി ഒഴിവാക്കാത്തതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പരിച്ഛേദന’, ‘ആത്മാവ്’, ‘അക്ഷരം’ എന്നീ പൗലോസിന്റെ പ്രധാന രൂപക-വൈരുധ്യങ്ങൾ സംരക്ഷിച്ചു. ഗ്രീക്കിലെ അപൂർണവാക്യഘടന മലയാളത്തിൽ ഗ്രഹിക്കാനായി ‘യഥാർഥ’ എന്നും രണ്ടാം ഉപവാക്യത്തിൽ ‘അത് ... ഉള്ളതാണ്’ എന്നും പരിമിതമായി പൂരിപ്പിച്ചു.
