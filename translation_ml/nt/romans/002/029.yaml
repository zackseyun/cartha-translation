  to: എന്നാൽ ഉള്ളിൽ യെഹൂദനായവനാണു യെഹൂദൻ; ഹൃദയത്തിന്റെ പരിച്ഛേദനം ആത്മാവിൽ, അക്ഷരത്തിലല്ല. അവന്റെ പ്രശംസ മനുഷ്യരിൽനിന്നല്ല, ദൈവത്തിൽനിന്നാണ്.
  rationale: ഗ്രീക്കിലെ ആന്തരികതയും ഹൃദയപരമായ പരിച്ഛേദനയും സംബന്ധിച്ച രൂപകങ്ങൾ അധികമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി. ἐν πνεύματι οὐ γράμματι എന്ന സമാന്തരഘടന ‘ആത്മാവിൽ, അക്ഷരത്തിലല്ല’ എന്നു വിവർത്തനം ചെയ്ത് വിവാദമായ πνεύμαതി-യുടെ സൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു. അടിക്കുറിപ്പ് ആങ്കർ തിരുത്തിയ പാഠത്തിൽ പ്രസക്തമല്ലാത്തതിനാൽ ഒഴിവാക്കി; അതിലെ വിവരം ഒരു പൊതുവിവർത്തന കുറിപ്പായി മാത്രമേ ഉൾപ്പെടുത്താവൂ, പക്ഷേ ഈ വാക്യപാഠത്തിൽ ആങ്കർ ഇല്ലാത്ത അടിക്കുറിപ്പ് നൽകരുത്.
