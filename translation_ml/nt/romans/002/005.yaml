id: ROM.2.5
reference: Romans 2:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: ml
  text: എന്നാൽ നിന്റെ കാഠിന്യവും മാനസാന്തരപ്പെടാത്ത ഹൃദയവും നിമിത്തം, നീ നിനക്കുതന്നെ കോപം ശേഖരിച്ചുകൊണ്ടിരിക്കുന്നു—കോപത്തിന്റെയും ദൈവത്തിന്റെ നീതിയുക്തമായ വിധിയുടെ വെളിപ്പെടുത്തലിന്റെയും ദിവസത്തേക്കായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ δὲ
  choice: എന്നാൽ ... നിമിത്തം
  rationale: δέയുടെ മൃദുവായ വിരുദ്ധഭാവം ‘എന്നാൽ’ എന്നും, κατάയുടെ സന്ദർഭോചിതമായ കാരണാർഥം ‘നിമിത്തം’ എന്നും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: σκληρότης
  choice: കാഠിന്യം
  rationale: ധാർമികമായ സംവേദനശൂന്യതയെ സൂചിപ്പിക്കുന്ന മൂലരൂപകം നിലനിർത്തുന്നു.
- source_word: ἀμετανόητον καρδίαν
  choice: മാനസാന്തരപ്പെടാത്ത ഹൃദയം
  rationale: ‘ഹൃദയം’ എന്ന ഗ്രീക്ക് രൂപകം നിലനിർത്തിക്കൊണ്ട് ἀμετανόητος എന്നതിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: θησαυρίζεις
  choice: സംഭരിച്ചുവെക്കുകയാണ്
  rationale: തുടർന്നുകൊണ്ടിരിക്കുന്ന ശേഖരണത്തെയും അതിന്റെ ദോഷകരമായ പരിണതിയെയും വ്യക്തമാക്കുന്നു; ‘നിക്ഷേപിക്കുന്നു’ എന്ന അനാവശ്യമായ അനുകൂലധ്വനി ഒഴിവാക്കുന്നു.
- source_word: σεαυτῷ
  choice: നിനക്കുതന്നെ
  rationale: പ്രത്യാഘാതം അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിക്കുതന്നെയാണെന്ന ആത്മനിർദ്ദേശക ദത്തിവിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: ὀργή
  choice: കോപം
  rationale: ദൈവിക ന്യായവിധിയുടെ ഗൗരവമുള്ള രോഷം സന്ദർഭം വ്യക്തമാക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: കോപത്തിന്റെ ദിവസത്തിൽ—... വെളിപ്പെടുന്ന ദിവസത്തിൽ—
  rationale: ἐν ἡμέρᾳ എന്ന കാലസൂചന നിലനിർത്തുന്നു. മലയാളത്തിൽ അസ്വാഭാവികമായ നാമപദശൃംഖല ഒഴിവാക്കാൻ ἀποκάλυψις ക്രിയാരൂപത്തിൽ വ്യക്തമാക്കിയെങ്കിലും കോപദിവസവും വെളിപ്പെടുത്തലും ഒരേ ദിവസത്തോട് ബന്ധിപ്പിക്കുന്നു.
- source_word: δικαιοκρισία
  choice: നീതിപൂർവമായ വിധി
  rationale: δικαιο-യും -κρισίαയും ചേർന്ന പദത്തിന്റെ ‘നീതിയുള്ള/ന്യായമായ വിധി’ എന്ന അർഥം അനാവശ്യ ആവർത്തനമില്ലാതെ നൽകുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: വിധി ദൈവത്തിന്റേതാണെന്ന ജനിറ്റീവ് ബന്ധം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀποκαλύψεως എന്ന നാമരൂപത്തെ അതേപടി നിലനിർത്തണമോ, മലയാളത്തിൽ ക്രിയാരൂപമാക്കണമോ
  choice: ‘ദൈവത്തിന്റെ നീതിപൂർവമായ വിധി വെളിപ്പെടുന്ന ദിവസത്തിൽ’ എന്ന ക്രിയാസംബന്ധിയായ രൂപം
  alternative: ‘കോപത്തിന്റെയും ദൈവത്തിന്റെ നീതിപൂർവമായ വിധിയുടെ വെളിപ്പെടുത്തലിന്റെയും ദിവസത്തിൽ’
  rationale: ഗ്രീക്കിൽ ഏകോപിത നാമങ്ങളാണെങ്കിലും, അക്ഷരാർഥ നാമപദശൃംഖല മലയാളത്തിൽ ദുർഗ്രഹമാണ്. ക്രിയാരൂപം ആ സംഭവബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; വിധി ആരാണ് വെളിപ്പെടുത്തുന്നത് എന്നതുപോലുള്ള അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: δικαιοκρισία ദൈവത്തിന്റെ നീതിസ്വഭാവത്തെയോ വിധിയുടെ നീതിയെയോ സൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കൽ
  choice: വിധിയുടെ ഗുണമായി ‘നീതിപൂർവമായ’
  alternative: ‘നീതിമാനായ ദൈവത്തിന്റെ വിധി’
  rationale: സംയുക്തപദം വിധിയുടെ നീതി/ന്യായതയാണ് നേരിട്ട് വിശേഷിപ്പിക്കുന്നത്; ദൈവത്തിന്റെ സ്വഭാവത്തിലേക്ക് വിശേഷണം മാറ്റുന്നത് ഗ്രീക്ക് ഘടനയെ അനാവശ്യമായി വ്യാഖ്യാനിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ഏകവചന ദ്വിതീയപുരുഷരൂപം സന്ദർഭത്തിലെ വ്യക്തിപരമായ അഭിസംബോധന നിലനിർത്തുന്നു. ദീർഘമായ അന്തിമഘടകത്തിന്റെ ബന്ധം വ്യക്തമാക്കാൻ ഡാഷുകൾ ഉപയോഗിച്ചു.
