revisions:
- from: എന്നാൽ നിന്റെ കാഠിന്യവും മാനസാന്തരപ്പെടാത്ത ഹൃദയവും നിമിത്തം, കോപത്തിന്റെ ദിവസത്തിൽ—ദൈവത്തിന്റെ നീതിപൂർവമായ വിധി[a] വെളിപ്പെടുന്ന ദിവസത്തിൽ—നീ നിനക്കുതന്നെ കോപം സംഭരിച്ചുവെക്കുകയാണ്.
  to: എന്നാൽ നിന്റെ കാഠിന്യവും മാനസാന്തരപ്പെടാത്ത ഹൃദയവും നിമിത്തം, നീ നിനക്കുതന്നെ കോപം ശേഖരിച്ചുകൊണ്ടിരിക്കുന്നു—കോപത്തിന്റെയും ദൈവത്തിന്റെ നീതിയുക്തമായ വിധിയുടെ വെളിപ്പെടുത്തലിന്റെയും ദിവസത്തേക്കായി.
  rationale: The revision makes the future-day relation explicit in idiomatic Malayalam and retains the source text’s coordinated nouns, “wrath” and “revelation,” rather than introducing a finite clause. It preserves the ambiguity of the Greek nominal expression and does not add an agent for the revelation. The footnote is retained with a neutral rationale.
