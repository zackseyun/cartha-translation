id: ROM.2.26
reference: Romans 2:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: ml
  text: അതുകൊണ്ട്, പരിച്ഛേദനയില്ലാത്ത ഒരാൾ ന്യായപ്രമാണത്തിന്റെ ആവശ്യങ്ങൾ പാലിക്കുന്നെങ്കിൽ, അയാളുടെ പരിച്ഛേദനയില്ലായ്മ പരിച്ഛേദനയായി കണക്കാക്കപ്പെടുകയില്ലേ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “പരിച്ഛേദനയില്ലായ്മ ന്യായപ്രമാണത്തിന്റെ ആവശ്യങ്ങൾ പാലിക്കുന്നെങ്കിൽ, അയാളുടെ പരിച്ഛേദനയില്ലായ്മ പരിച്ഛേദനയായി കണക്കാക്കപ്പെടുകയില്ലേ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: പരിച്ഛേദനയേൽക്കാത്ത ഒരാൾ / അയാളുടെ പരിച്ഛേദനയില്ലായ്മ
  rationale: ആദ്യ പ്രയോഗത്തിൽ വ്യക്തിയെയാണ് ഉദ്ദേശിക്കുന്നതെന്നത് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; αὐτοῦ ഉള്ള രണ്ടാം പ്രയോഗത്തിൽ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന ‘പരിച്ഛേദനയില്ലായ്മ’ നിലനിർത്തുന്നു.
- source_word: δικαιώματα
  choice: ന്യായമായ ആവശ്യങ്ങൾ
  rationale: നിയമം ആവശ്യപ്പെടുന്ന കാര്യങ്ങൾ എന്ന ബഹുവചനാർഥവും δικαίωμα എന്ന പദത്തിലെ നീതിയുമായി ബന്ധപ്പെട്ട ഭാവവും ഒരുമിച്ച് നിലനിർത്തുന്നു.
- source_word: νόμου
  choice: ന്യായപ്രമാണത്തിന്റെ
  rationale: പൗലൊസിന്റെ വാദത്തിലെ മോശൈക നിയമത്തെ സൂചിപ്പിക്കുന്നതിന് മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പദം.
- source_word: φυλάσσῃ
  choice: പാലിക്കുന്നെങ്കിൽ
  rationale: കല്പനകളോ നിയമത്തിന്റെ ആവശ്യങ്ങളോ അനുസരിക്കുന്നതിനെ സൂചിപ്പിക്കാൻ സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: λογισθήσεται
  choice: കണക്കാക്കപ്പെടുകയില്ലേ
  rationale: പൗലൊസിന്റെ കണക്കിടൽ/വകവെക്കൽ എന്ന രൂപകം നിലനിർത്തുകയും ഭാവികാല കർമണിപ്രയോഗം പ്രതിഫലിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς περιτομήν
  choice: പരിച്ഛേദനയായി
  rationale: εἰς ഇവിടെ ഫലമോ പദവിയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘ആയി’ എന്ന പ്രയോഗം സ്വാഭാവികമായി ആ അർഥം നൽകുന്നു.
- source_word: οὐχ
  choice: കണക്കാക്കപ്പെടുകയില്ലേ?
  rationale: അനുകൂല ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് നിഷേധാത്മക ആലങ്കാരികചോദ്യം മലയാളത്തിലും നിലനിർത്തുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനയില്ലാത്ത വ്യക്തിയുടെ നിലയും ന്യായപ്രമാണപാലനവും തമ്മിലുള്ള ബന്ധം
  choice: വാക്യത്തിലെ സോപാധികവും ആലങ്കാരികവുമായ പ്രസ്താവന അതേപടി നിലനിർത്തി
  alternative: ഇത് ജാതികളുടെ രക്ഷയെക്കുറിച്ചോ സ്വഭാവനിയമപാലനത്തെക്കുറിച്ചോ ഉള്ള വ്യക്തമായ സിദ്ധാന്തപ്രസ്താവനയായി വിശദീകരിക്കുക
  rationale: ഈ ഒറ്റ വാക്യം അത്തരം വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ പൗലൊസിന്റെ വാദത്തിലെ ഉദ്ദേശ്യപൂർവമായ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം’, ‘പരിച്ഛേദന’ എന്നീ സന്ദർഭാവശ്യമായ ബൈബിൾ പദങ്ങൾ നിലനിർത്തി; വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ആദ്യത്തെ ἀκροβυστία സ്വാഭാവികമാക്കി, അതിന്റെ അക്ഷരാർഥരൂപം അടിക്കുറിപ്പിൽ നൽകി.
