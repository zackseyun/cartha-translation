id: ROM.2.12
reference: Romans 2:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിയമമില്ലാതെ പാപം ചെയ്തവരെല്ലാം നിയമമില്ലാതെതന്നെ നശിച്ചുപോകും[a]; നിയമത്തിനു കീഴിൽ പാപം ചെയ്തവരെല്ലാം നിയമത്തിലൂടെ വിധിക്കപ്പെടും[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: രണ്ടു പ്രയോഗങ്ങളിലും ‘നിയമത്തിന് പുറത്തായി’ എന്നും പരിഭാഷപ്പെടുത്താം; പദാർഥസാധ്യതയായി ‘നിയമവിരുദ്ധമായി’ എന്നും പറയാം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിയമത്തിൽ’ അല്ലെങ്കിൽ ‘നിയമത്തിന്റെ പരിധിക്കുള്ളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘നിയമത്താൽ’ അല്ലെങ്കിൽ ‘നിയമത്തെ മാനദണ്ഡമാക്കി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: നിയമം ഇല്ലാതെ
  rationale: രണ്ട് പ്രയോഗങ്ങളിലും മോശയുടെ നിയമത്തിന്റെ പരിധിക്കു പുറത്തുള്ള അവസ്ഥയെ വ്യക്തമാക്കുന്നു; ‘നിയമവിരുദ്ധമായി’ എന്നത് വെറും അധാർമിക പെരുമാറ്റമെന്ന തെറ്റായ ധാരണയ്ക്ക് ഇടയാക്കാം.
- source_word: ἥμαρτον
  choice: പാപം ചെയ്ത
  rationale: അയോറിസ്റ്റിന്റെ ലളിതമായ ഭൂതകാല ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ക്രിയയുടെ സ്വഭാവത്തെ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: ἀπολοῦνται
  choice: നശിച്ചുപോകും
  rationale: ഭാവികാല ഫലത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും നാശത്തിന്റെ കൃത്യമായ സ്വഭാവത്തെക്കുറിച്ചുള്ള പ്രത്യേക സിദ്ധാന്തം വാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν νόμῳ
  choice: നിയമത്തിന് കീഴിൽ
  rationale: അക്ഷരാർഥമായ ‘നിയമത്തിൽ’ എന്നതിനെക്കാൾ നിയമത്തിന്റെ അധികാരപരിധിക്കുള്ളിൽ ജീവിക്കുന്നതെന്ന പൗലോസിന്റെ വിരുദ്ധസമാന്തര ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: διὰ νόμου
  choice: നിയമത്തിലൂടെ
  rationale: διά സൂചിപ്പിക്കുന്ന മാധ്യമമോ മാനദണ്ഡമോ എന്ന ഭാവം നിലനിർത്തുകയും ἐν νόμῳ എന്നതിൽനിന്നുള്ള വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: κριθήσονται
  choice: ന്യായം വിധിക്കപ്പെടും
  rationale: ന്യായപരമായ വിലയിരുത്തൽ എന്ന നിഷ്പക്ഷ അർഥം നിലനിർത്തുന്നു; ‘ശിക്ഷാവിധി ലഭിക്കും’ എന്ന് പറഞ്ഞ് കുറ്റവിധിയെ മുൻകൂട്ടി നിശ്ചയിക്കുന്നില്ല.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: എല്ലാവരും ... എല്ലാവരും
  rationale: ഉൾപ്പെടുന്ന എല്ലാവരെയും സൂചിപ്പിക്കുന്ന വിതരണാർഥവും രണ്ടു വിഭാഗങ്ങൾക്കിടയിലെ സമാന്തരതയും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: വാക്യത്തിന്റെ തുടക്കത്തിൽ പ്രത്യേകം പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മലയാളത്തിലെ സ്വാഭാവിക വാക്യബന്ധത്തിൽ ഈ കാരണംസൂചക ബന്ധം സന്ദർഭത്തിൽനിന്ന് വ്യക്തമാകുന്നു; ‘എന്തെന്നാൽ’ എന്നും നൽകാവുന്നതാണ്, എന്നാൽ ഒറ്റവാക്യ ഉദ്ധരണിയിൽ അത് കൃത്രിമമായി തോന്നാം.
theological_decisions:
- issue: νόμος എന്നതിന്റെ സൂചന
  choice: പ്രധാനമായും മോശയുടെ നിയമത്തെ സൂചിപ്പിക്കുന്ന ‘നിയമം’
  alternative: പൊതുവായ ധാർമിക നിയമം
  rationale: റോമർ 2-ലെ യെഹൂദ-ജാതി വ്യത്യാസം മോശയുടെ നിയമമുള്ളവരെയും അതില്ലാത്തവരെയും കേന്ദ്രീകരിക്കുന്നു; എങ്കിലും വിശദീകരണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ἀπολοῦνται എന്നതും അന്തിമശിക്ഷയുടെ സ്വഭാവവും
  choice: ‘നശിച്ചുപോകും’ എന്ന് മാത്രം പറഞ്ഞ് അതിന്റെ രീതി നിർവചിക്കാതിരിക്കുക
  alternative: ‘ശിക്ഷാവിധി ലഭിക്കും’ അല്ലെങ്കിൽ ‘പൂർണമായി ഇല്ലാതാക്കപ്പെടും’
  rationale: മൂലവാക്യം വിധിയുടെ ഫലം പ്രസ്താവിക്കുമ്പോഴും അതിന്റെ കൃത്യമായ സ്വഭാവം ഇവിടെ നിർവചിക്കുന്നില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെക്കുന്നു.
- issue: κριθήσονται എന്നതിൽ കുറ്റവിധി ഉൾക്കൊള്ളുന്നുണ്ടോ
  choice: നിഷ്പക്ഷമായി ‘ന്യായം വിധിക്കപ്പെടും’
  alternative: ‘കുറ്റം വിധിക്കപ്പെടും’
  rationale: κρίνω ഇവിടെ ന്യായപരമായ വിധിയെ സൂചിപ്പിക്കുന്നു; കുറ്റവിധിയുടെ അന്തിമ ഭാവം സന്ദർഭം നിർണ്ണയിക്കട്ടെ.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘നിയമത്തിന് കീഴിൽ’ എന്നത് നിയമത്തിന്റെ അധികാരപരിധി സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. സമാന്തര ഘടന നിലനിർത്തിയിട്ടുണ്ട്; അടിക്കുറിപ്പുകളുടെ സൂചകങ്ങൾ ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ നൽകിയിട്ടുണ്ട്.
