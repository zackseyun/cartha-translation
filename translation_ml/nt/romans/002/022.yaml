id: ROM.2.22
reference: Romans 2:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: ml
  text: “വ്യഭിചാരം ചെയ്യരുത്” എന്നു പറയുന്ന നീ വ്യഭിചാരം ചെയ്യുന്നുവോ? വിഗ്രഹങ്ങളെ വെറുക്കുന്ന നീ ക്ഷേത്രങ്ങൾ കൊള്ളയടിക്കുന്നുവോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, വിശാലമായ അർഥത്തിൽ, “വിശുദ്ധകാര്യങ്ങളെ അവമതിക്കുന്നുവോ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: എന്നു പറയുന്ന നീ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപം ഒരു പ്രതിനിധിവ്യക്തിയെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു. ഈ പ്രയോഗം പൗലോസിന്റെ നേരിട്ടുള്ള ആലങ്കാരിക ചോദ്യശൈലി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ μοιχεύειν
  choice: “വ്യഭിചാരം ചെയ്യരുത്”
  rationale: μή ചേർന്ന infinitive പറയപ്പെടുന്ന വിലക്കിന്റെ ഉള്ളടക്കം വ്യക്തമാക്കുന്നു. ‘വ്യഭിചാരം ചെയ്യുക’ എന്നത് μοιχεύωയുടെ കൃത്യവും സാധാരണവുമായ മലയാളസമാനപദമാണ്.
- source_word: μοιχεύεις
  choice: വ്യഭിചാരം ചെയ്യുന്നുവോ?
  rationale: വർത്തമാനകാല സൂചകരൂപം ഇവിടെ കുറ്റപ്പെടുത്തുന്ന ആലങ്കാരിക ചോദ്യമാണ്; മലയാളത്തിലെ സാധാരണ വർത്തമാനകാല ചോദ്യരൂപം അതിന്റെ പൊതുവായ പ്രാബല്യം നിലനിർത്തുന്നു.
- source_word: ὁ βδελυσσόμενος
  choice: വെറുക്കുന്ന നീ
  rationale: βδελύσσομαι ശക്തമായ അറപ്പും നിരസനവും സൂചിപ്പിക്കുന്നു. ‘വെറുക്കുക’ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും സന്ദർഭത്തിൽ മതിയായ ശക്തിയുള്ളതുമാണ്.
- source_word: τὰ εἴδωλα
  choice: വിഗ്രഹങ്ങളെ
  rationale: ഈ സന്ദർഭത്തിൽ εἴδωλα ആരാധനയ്ക്കുള്ള പ്രതിമകളെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വിഗ്രഹങ്ങൾ’ അതിന്റെ വ്യക്തവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപമാണ്.
- source_word: ἱεροσυλεῖς
  choice: ക്ഷേത്രങ്ങൾ കൊള്ളയടിക്കുന്നുവോ?
  rationale: ἱεροσυλέωയുടെ ഏറ്റവും മൂർത്തമായ അർത്ഥം ക്ഷേത്രങ്ങളെയോ അവയുടെ സ്വത്തുക്കളെയോ കൊള്ളയടിക്കുക എന്നതാണ്. വിഗ്രഹങ്ങളെക്കുറിച്ചുള്ള തൊട്ടുമുമ്പത്തെ പരാമർശത്തോടുള്ള വിരോധാഭാസവും ചരിത്രപരമായ ഭാവവും ഈ വിവർത്തനം നിലനിർത്തുന്നു; വിശാലമായ അർത്ഥം അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: ἱεροσυλεῖς എന്നതിന്റെ മൂർത്തമായ അർത്ഥമോ വിശാലമായ അർത്ഥമോ
  choice: പ്രധാനപാഠത്തിൽ ‘ക്ഷേത്രങ്ങൾ കൊള്ളയടിക്കുന്നുവോ?’
  alternative: ‘വിശുദ്ധത ലംഘിക്കുന്നുവോ?’
  rationale: മൂലപദം ക്ഷേത്രക്കൊള്ളയെ നേരിട്ട് സൂചിപ്പിക്കാമെങ്കിലും വിശാലമായി മതനിന്ദാപരമായ അഥവാ വിശുദ്ധത ലംഘിക്കുന്ന പ്രവൃത്തിയെയും സൂചിപ്പിക്കാം. സന്ദർഭത്തിലെ വിഗ്രഹപരാമർശം മൂർത്തമായ അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നതിനാൽ അത് പ്രധാനപാഠത്തിൽ സ്വീകരിച്ചു; യഥാർഥമായ അർത്ഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള ചോദ്യംചെയ്യൽശൈലി ഉപയോഗിച്ചു. ആവർത്തനവും രണ്ട് സമാന്തര ആലങ്കാരിക ചോദ്യങ്ങളും ഗ്രീക്ക് വാക്യത്തിന്റെ കുറ്റപ്പെടുത്തുന്ന ശക്തി നിലനിർത്തുന്നതിനായി സംരക്ഷിച്ചു.
