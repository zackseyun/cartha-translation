  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: ml
  text: കൂടാതെ, നീ തന്നേ അന്ധർക്കു വഴികാട്ടിയും ഇരുട്ടിലുള്ളവർക്കു വെളിച്ചവും ആണെന്ന് നിനക്കു ഉറച്ച ബോധ്യമുണ്ട്;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: ഉറച്ച ബോധ്യമുണ്ട്
  rationale: സമ്പൂർണകാലരൂപം സൂചിപ്പിക്കുന്ന സ്ഥിരപ്പെട്ട ആത്മവിശ്വാസത്തെയോ ബോധ്യത്തെയോ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: τε
  choice: വാക്യഘടനയിലെ തുടർച്ച
  rationale: ഈ കണം മുൻവാക്യത്തോടുള്ള ബന്ധം സൂചിപ്പിക്കുന്നു. ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ അസ്വാഭാവികമായ അധിക സംയോജകം ചേർക്കാതെ, വാക്യാവസാനത്തിലെ അർദ്ധവിരാമം തുടർച്ച തുറന്നുവെക്കുന്നു.
- source_word: σεαυτὸν
  choice: നീ തന്നെയാണെന്ന്
  rationale: പ്രത്യാവർത്തക സർവനാമത്തിന്റെ ഊന്നൽ ‘തന്നെ’ എന്ന രൂപത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: ὁδηγὸν
  choice: വഴികാട്ടി
  rationale: അക്ഷരാർഥവും രൂപകാർഥവും ഒരുപോലെ സ്വാഭാവികമായി വഹിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: τυφλῶν
  choice: അന്ധർക്കു
  rationale: ‘അന്ധരുടെ വഴികാട്ടി’ എന്നതിനെക്കാൾ മലയാളത്തിൽ സ്വാഭാവികമായി ലക്ഷ്യബന്ധം പ്രകടിപ്പിക്കുന്നു; വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ബഹുവചനവും നിലനിർത്തുന്നു.
- source_word: φῶς
  choice: വെളിച്ചം
  rationale: മാർഗദർശനത്തിന്റെയും അറിവിന്റെയും രൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: τῶν ἐν σκότει
  choice: ഇരുട്ടിലുള്ളവർക്ക്
  rationale: വ്യക്തികളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗവും ‘ഇരുട്ട്’ എന്ന രൂപകവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions: []
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പൗലോസ് അഭിസംബോധന ചെയ്യുന്ന വ്യക്തിയുടെ സ്വയംവിശ്വാസം ‘നീ തന്നെയാണ്’ എന്നും ‘ഉറച്ച ബോധ്യമുണ്ട്’ എന്നും ഊന്നിപ്പറയുന്നു. ഗ്രീക്ക് വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അർദ്ധവിരാമം ഉപയോഗിച്ചു.
