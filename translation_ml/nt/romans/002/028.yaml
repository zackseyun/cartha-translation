id: ROM.2.28
reference: Romans 2:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: ml
  text: കാരണം, പുറമേയുള്ളവനാണ് യെഹൂദൻ എന്നല്ല; ശരീരത്തിൽ പുറമേയുള്ളതാണ് പരിച്ഛേദന എന്നുമല്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: യെഹൂദൻ
  rationale: റോമർ ലേഖനത്തിലെ ഈ സന്ദർഭത്തിൽ പ്രദേശപരമായ ‘യെഹൂദ്യൻ’ എന്നതിലുപരി ഇസ്രായേലിന്റെ ഉടമ്പടിജനതയോടുള്ള തിരിച്ചറിയലാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐν τῷ φανερῷ
  choice: പുറമേയുള്ള
  rationale: കാണാവുന്നതും ബാഹ്യവുമായ നിലയെ സൂചിപ്പിക്കുകയും അടുത്ത വാക്യത്തിലെ ആന്തരിക യാഥാർഥ്യത്തോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: περιτομή
  choice: പരിച്ഛേദന
  rationale: ചർച്ചചെയ്യുന്ന ഉടമ്പടിചിഹ്നത്തിനുള്ള കൃത്യവും പ്രചാരത്തിലുള്ളതുമായ മലയാളപദം.
- source_word: ἐν σαρκί
  choice: ജഡത്തിൽ
  rationale: ഇവിടെ σάρξ രൂപകമല്ല, ശരീരസംബന്ധമായ അർഥത്തിലാണ്; ‘ജഡത്തിൽ’ എന്നത് ഗ്രീക്കിന്റെ രൂപവും അടുത്ത വാക്യത്തോടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: ജഡത്തിൽ പുറമേയുള്ളതല്ല പരിച്ഛേദന
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും അല്പം അപൂർണ്ണവുമായ വാക്യഘടനയെ അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘യെഹൂദൻ’, ‘പരിച്ഛേദന’ എന്നിവയിലെ ഉടമ്പടിപരമായ തിരിച്ചറിയൽ
  choice: കേവലം ദൃശ്യവും ബാഹ്യവുമായ അടയാളങ്ങൾകൊണ്ടു മാത്രം യഥാർഥ ഉടമ്പടിസ്ഥാനം നിർവചിക്കപ്പെടുന്നില്ലെന്ന വൈരുധ്യം നിലനിർത്തി.
  alternative: യെഹൂദസ്വത്വം തന്നെ പൗലോസ് നിഷേധിക്കുന്നു എന്നോ അതിനെ പൂർണമായും ഒരു ആത്മീയ വിഭാഗംകൊണ്ട് മാറ്റിസ്ഥാപിക്കുന്നു എന്നോ വിവർത്തനം ചെയ്യുക.
  rationale: വാക്യം ബാഹ്യവും ആന്തരികവും തമ്മിൽ വൈരുധ്യം സൃഷ്ടിക്കുന്നു; യെഹൂദസ്വത്വം എന്ന വിഭാഗത്തെ ഇല്ലാതാക്കുന്നില്ല. 29-ാം വാക്യത്തിൽ പൂർത്തിയാകുന്ന ആശയസംഘർഷം മുൻകൂട്ടി പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള ‘പുറമേ’ എന്ന ആശയവും വാക്യത്തിന്റെ നിഷേധാത്മക സമാന്തരഘടനയും സംരക്ഷിച്ചു.
