id: ROM.2.20
reference: Romans 2:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: ml
  text: ബുദ്ധിയില്ലാത്തവരുടെ പരിശീലകനും, ശിശുക്കളുടെ അധ്യാപകനും, ന്യായപ്രമാണത്തിൽ അറിവിന്റെയും സത്യത്തിന്റെയും രൂപം[a] ഉള്ളവനും—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മൂർത്തരൂപം.”
    reason: μόρφωσις എന്നതിന് ‘രൂപം’ എന്ന പൊതുവായ അർഥത്തോടൊപ്പം അറിവും സത്യവും വ്യക്തമായി ആവിഷ്കരിക്കപ്പെട്ടിരിക്കുന്ന ‘മൂർത്തരൂപം’ എന്ന അർഥവും സാധ്യമാണ്.
lexical_decisions:
- source_word: παιδευτὴν
  choice: അഭ്യസിപ്പിക്കുന്നവൻ
  rationale: പരിശീലനം, ശിക്ഷണം, തിരുത്തൽ എന്നിവ ഉൾക്കൊള്ളാവുന്ന παιδευτής എന്ന പദത്തിന്റെ വിദ്യാഭ്യാസപരമായ ഊന്നൽ സ്വാഭാവികമായി നൽകുന്നു; ശിക്ഷ എന്ന ആശയം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: ἀφρόνων
  choice: ബുദ്ധിയില്ലാത്തവർ
  rationale: വിവേകമോ ബുദ്ധിയോ ഇല്ലാത്തവർ എന്ന നിന്ദാസ്വരം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പ്രയോഗം.
- source_word: διδάσκαλον
  choice: അധ്യാപകൻ
  rationale: പഠിപ്പിക്കുന്ന വ്യക്തി എന്ന അടിസ്ഥാന അർഥം വ്യക്തവും ആധുനികവുമായി നൽകുന്നു.
- source_word: νηπίων
  choice: ശിശുക്കൾ
  rationale: വളർച്ചയെത്താത്തവരെ സൂചിപ്പിക്കുന്ന രൂപകസാധ്യത നിലനിൽക്കുമ്പോഴും പദത്തിന്റെ അക്ഷരാർഥവും വാക്യത്തിലെ വാചാടോപപരമായ മൂർച്ചയും സംരക്ഷിക്കുന്നു.
- source_word: ἔχοντα
  choice: ഉള്ളവൻ
  rationale: മുൻപുള്ള വ്യക്തിവിവരണങ്ങളോടുള്ള കർത്തൃബന്ധം നിലനിർത്തിക്കൊണ്ട് ഗ്രീക്ക് വർത്തമാന കൃതന്തത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: μόρφωσιν
  choice: മൂർത്തരൂപം
  rationale: അറിവും സത്യവും ന്യായപ്രമാണത്തിൽ ദൃശ്യവും നിർദിഷ്ടവുമായ ആവിഷ്കാരം പ്രാപിക്കുന്നു എന്ന അർഥസാധ്യത നൽകുന്നു; ‘രൂപം’ എന്ന കൂടുതൽ നിഷ്പക്ഷമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: γνώσεως
  choice: അറിവ്
  rationale: ἀλήθεια എന്ന പദത്തോടൊപ്പം വരുന്ന γνῶσις എന്നതിന്റെ നേരിട്ടും സ്വാഭാവികവുമായ പരിഭാഷ.
- source_word: ἀληθείας
  choice: സത്യം
  rationale: പൗലോസിന്റെ പരിചിതമായ ആശയജോടി നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: ἐν τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: യഹൂദ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്ന νόμος എന്നതും ἐν എന്നതിന്റെ സ്ഥാന/മാധ്യമബന്ധവും അനാവശ്യ വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ന്യായപ്രമാണവും അറിവ്-സത്യവും തമ്മിലുള്ള ബന്ധം
  choice: ‘ന്യായപ്രമാണത്തിൽ അറിവിന്റെയും സത്യത്തിന്റെയും മൂർത്തരൂപം ഉള്ളവൻ’ എന്ന് തുറന്ന ഘടന നിലനിർത്തി.
  alternative: ‘ന്യായപ്രമാണം അറിവിന്റെയും സത്യത്തിന്റെയും മൂർത്തരൂപമാണ്’ എന്ന് വ്യക്തമായി നിർവചിക്കുക.
  rationale: ഗ്രീക്കിൽ ἔχοντα ... ἐν τῷ νόμῳ എന്ന ഘടന വ്യക്തിയുടെ അവകാശവാദത്തെയും ന്യായപ്രമാണത്തിലെ രൂപത്തെയും ബന്ധിപ്പിക്കുന്നു; അതിനെ ഒരു സ്വതന്ത്ര സിദ്ധാന്തപ്രഖ്യാപനമായി മാറ്റാതിരിക്കാൻ മൂലവാക്യത്തിന്റെ ഘടനയും സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വ്യക്തവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച സ്വയംവിശേഷണങ്ങളുടെ പട്ടിക തുടരുന്നതിനാൽ അവസാനത്തിലെ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നം അതുമായി ബന്ധപ്പെട്ട μόρφωσις എന്ന പദത്തിന്റെ പരിഭാഷയ്ക്കു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
