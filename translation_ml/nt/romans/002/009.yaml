id: ROM.2.9
reference: Romans 2:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: ml
  text: തിന്മ പ്രവർത്തിക്കുന്ന ഓരോ മനുഷ്യന്റെയും ആത്മാവിന്മേൽ കഷ്ടതയും ഞെരുക്കവും വരും—ആദ്യം യഹൂദന്റെമേലും ഗ്രീക്കുകാരന്റെമേലും കൂടി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഓരോ വ്യക്തിയുടെയും” അല്ലെങ്കിൽ “ഓരോ മനുഷ്യന്റെയും.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യഹൂദേതരന്റെമേലും”; ഇവിടെ യഹൂദൻ/ഗ്രീക്കുകാരൻ എന്ന വൈരുധ്യജോടിയിൽ “ഗ്രീക്കുകാരൻ” യഹൂദനല്ലാത്തവനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: കഷ്ടത
  rationale: കടുത്ത ദുരിതം എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; στενοχωρία എന്ന അടുത്ത പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: στενοχωρία
  choice: ഞെരുക്കം
  rationale: ഇടുങ്ങിപ്പോകൽ, സമ്മർദം എന്നീ മൂലചിത്രങ്ങളും അതിൽനിന്നുണ്ടാകുന്ന കടുത്ത മനോവേദനയും സൂചിപ്പിക്കുന്നു; θλῖψις-നോടുള്ള പദജോടിയുടെ തീവ്രത സംരക്ഷിക്കുന്നു.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: ഓരോ മനുഷ്യാത്മാവിനും
  rationale: ψυχή എന്നതിന്റെ ‘ആത്മാവ്’ എന്ന ദൃശ്യഭാഷയും ἀνθρώπου എന്നതിന്റെ പൊതുവായ മനുഷ്യസൂചനയും നിലനിർത്തുന്നു. മലയാളത്തിൽ വിധി ഒരാളുടെമേൽ വരുന്നു എന്ന ആശയം സ്വാഭാവികമായി പറയാൻ ‘-നും’ ഉപയോഗിച്ചു.
- source_word: τοῦ κατεργαζομένου
  choice: പ്രവർത്തിക്കുന്ന
  rationale: തിന്മ ചെയ്യുന്നതിനെ സജീവമായ പ്രവൃത്തിയായി അവതരിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; പതിവായി ചെയ്യുന്നു എന്ന അർഥം അനാവശ്യമായി ഉറപ്പിക്കുന്നില്ല.
- source_word: τὸ κακόν
  choice: തിന്മ
  rationale: നപുംസകലിംഗ ഏകവചന രൂപം ഇവിടെ പൊതുവായി തിന്മയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘തിന്മ’ സംക്ഷിപ്തവും സ്വാഭാവികവുമാണ്.
- source_word: Ἰουδαίου
  choice: യഹൂദൻ
  rationale: റോമർ ലേഖനത്തിലെ ജനവിഭാഗ-മതപരമായ തിരിച്ചറിയലിനെയും യഹൂദൻ/ഗ്രീക്കുകാരൻ എന്ന വിരുദ്ധജോടിയെയും യോജിച്ചവിധം നൽകുന്നു.
- source_word: Ἕλληνος
  choice: ഗ്രീക്കുകാരൻ
  rationale: പൗലൊസിന്റെ യഥാർഥ യഹൂദൻ/ഗ്രീക്കുകാരൻ പദജോടി സംരക്ഷിക്കുന്നു; ‘യഹൂദേതരൻ’ എന്ന വ്യാഖ്യാനപരമായ വിപുലീകരണം മുഖ്യപാഠത്തിലേക്ക് കൊണ്ടുവരുന്നില്ല.
- source_word: πρῶτον
  choice: ആദ്യം
  rationale: മുൻഗണനയുടെയോ ക്രമത്തിന്റെയോ ആശയം അധിക വിശദീകരണമില്ലാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത സംക്ഷിപ്ത ഗ്രീക്ക് വാക്യഭാഗം മലയാളത്തിൽ പൂർണമാക്കണമോ എന്നത്
  choice: കഷ്ടതയും ഞെരുക്കവും ഉണ്ടാകും
  alternative: കഷ്ടതയും ഞെരുക്കവും ഓരോ മനുഷ്യാത്മാവിനും
  rationale: മലയാളത്തിൽ പൂർണവും സ്വാഭാവികവുമായ വാക്യത്തിന് വിധിസന്ദർഭത്തിൽ സൂചിതമായ ഭാവിക്രിയ വ്യക്തമാക്കേണ്ടതുണ്ട്. ‘ഉണ്ടാകും’ എന്നത് പുതിയ ദൈവശാസ്ത്ര ആശയം ചേർക്കാതെ അർഥം വ്യക്തമാക്കുന്നു.
- issue: Ἕλλην എന്ന പദം അക്ഷരാർഥത്തിലോ വ്യാഖ്യാനപരമായോ നൽകുന്നത്
  choice: ഗ്രീക്കുകാരൻ
  alternative: യഹൂദേതരൻ
  rationale: റോമർ ലേഖനത്തിലെ പൗലൊസിന്റെ ആവർത്തിച്ചുള്ള യഹൂദൻ/ഗ്രീക്കുകാരൻ ജോടി മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഈ സന്ദർഭത്തിലെ വിശാലമായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘കഷ്ടതയും ഞെരുക്കവും’ എന്ന പദജോടി മൂലത്തിലെ രണ്ട് വ്യത്യസ്തമായെങ്കിലും പരസ്പരം തീവ്രമാക്കുന്ന പദങ്ങളെ നിലനിർത്തുന്നു. ‘മനുഷ്യാത്മാവ്’ എന്നത് അല്പം ഔപചാരികമായിരുന്നാലും മൂലപാഠത്തിന്റെ ദൃശ്യഭാഷയും വിധിപ്രഖ്യാപനത്തിന്റെ ഗൗരവവും സംരക്ഷിക്കുന്നു.
