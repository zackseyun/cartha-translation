  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: ml
  text: ന്യായപ്രമാണത്തിൽനിന്ന് ഉപദേശം ലഭിക്കുന്നതിനാൽ, അവന്റെ ഹിതം[a] അറിയുകയും ശ്രേഷ്ഠമായവ വിവേചിച്ചറിയുകയും[b] ചെയ്യുന്ന നീ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഹിതം’; ഗ്രീക്കിൽ ‘അവന്റെ’ എന്ന് വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും സന്ദർഭത്തിൽ ദൈവമാണ് സൂചിതൻ.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ ‘വ്യത്യസ്തമായവ പരിശോധിച്ച് അംഗീകരിക്കുകയും’; കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘വ്യത്യസ്തമായ കാര്യങ്ങൾ പരിശോധിക്കുകയും’.
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: അറിയുകയും
  rationale: വർത്തമാനകാല ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ θέλημα
  choice: അവന്റെ ഹിതം
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമം ഇല്ലെങ്കിലും സന്ദർഭത്തിൽ ദൈവമാണ് സൂചിതൻ; ‘അവന്റെ’ എന്നത് മലയാളത്തിൽ സൂചിതബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു, പാദക്കുറിപ്പ് മൂലരൂപം രേഖപ്പെടുത്തുന്നു.
- source_word: δοκιμάζεις
  choice: വിവേചിച്ചറിയുകയും
  rationale: പരിശോധിച്ച് മൂല്യമുള്ളതോ ശ്രേഷ്ഠമോ ആയത് തിരിച്ചറിയുന്ന വിലയിരുത്തൽഭാവം ഉൾക്കൊള്ളുന്നു; വെറും നിഷ്പക്ഷമായ ‘പരിശോധിക്കുക’ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: τὰ διαφέροντα
  choice: ശ്രേഷ്ഠമായവ
  rationale: സന്ദർഭത്തിൽ കൂടുതൽ വിലയുള്ളതോ ഉത്തമമായതോ ആയ കാര്യങ്ങളെ സൂചിപ്പിക്കുന്ന സാദ്ധ്യതയുള്ള പ്രയോഗാർഥം നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ സാദ്ധ്യത പാദക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: κατηχούμενος
  choice: ഉപദേശം ലഭിക്കുന്നതിനാൽ
  rationale: വർത്തമാനകാല കർമണി പങ്കാളിത്തരൂപത്തിന്റെ പഠിപ്പിക്കപ്പെടുക എന്ന അർഥവും, അറിവിന്റെയും വിവേചനത്തിന്റെയും അടിസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ കാരണഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐκ τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ഉറവിടഭാവം സംരക്ഷിക്കുന്നു; νόμος-നെ ഈ യഹൂദസന്ദർഭത്തിൽ ദൈവത്തിന്റെ ന്യായപ്രമാണമായി വ്യക്തമാക്കുന്ന പതിവ് മലയാള ബൈബിൾപദം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: τὸ θέλημα എന്നതിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ഉടമസ്ഥസർവനാമം ഗ്രീക്കിൽ വ്യക്തമല്ല
  choice: മുഖ്യപാഠത്തിൽ ‘അവന്റെ ഹിതം’
  alternative: ‘ഹിതം’ അഥവാ ‘ആ ഹിതം’
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവത്തെക്കുറിച്ചുള്ള പരാമർശം സൂചിതബന്ധം വ്യക്തമാക്കുന്നു; എങ്കിലും ഗ്രീക്കിന്റെ ഔപചാരിക അനിശ്ചിതത്വം പാദക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τὰ διαφέροντα എന്നതിന്റെ അർഥപരിധി
  choice: ‘ശ്രേഷ്ഠമായവ’
  alternative: ‘വ്യത്യസ്തമായവ’ അഥവാ ‘വ്യത്യാസമുള്ള കാര്യങ്ങൾ’
  rationale: ധാർമിക വിവേചനത്തിന്റെ സന്ദർഭത്തിൽ ‘കൂടുതൽ ഉത്തമമായവ’ എന്ന പ്രയോഗാർഥം സാദ്ധ്യതയേറിയതാണ്; അക്ഷരാർഥസാദ്ധ്യത പാദക്കുറിപ്പിൽ നൽകുന്നതിനാൽ വ്യാഖ്യാനപരമായ സംഘർഷം മറയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ‘നീ’ എന്ന അഭിസംബോധനയുടെ തുടർച്ച കാണിക്കാൻ വാക്യാവസാനത്തിൽ ‘ചെയ്യുന്ന നീ’ നിലനിർത്തി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിതമായ ബൈബിൾപദം ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ക്രമപ്പെടുത്തി.
