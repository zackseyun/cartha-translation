id: ROM.2.13
reference: Romans 2:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: ml
  text: കാരണം, നിയമം കേൾക്കുന്നവർ ദൈവത്തിന്റെ മുമ്പാകെ നീതിമാന്മാരല്ല; നിയമം അനുഷ്ഠിക്കുന്നവർ നീതീകരിക്കപ്പെടും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടും”; മറ്റൊരു സാധ്യത: “നീതിയുള്ളവരെന്ന് തെളിയിക്കപ്പെടും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: കേൾക്കുന്നവർ
  rationale: വെറും കേൾവിയും പ്രവൃത്തിയും തമ്മിലുള്ള പൗലോസിന്റെ വിരോധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νόμου
  choice: നിയമം / നിയമത്തിന്റെ
  rationale: ഗ്രീക്കിൽ നിർദേശക ഉപപദമില്ലെങ്കിലും സന്ദർഭത്തിൽ ചർച്ചയിലുള്ള ദൈവനിയമത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘നിയമം’ സ്വാഭാവികമാണ്.
- source_word: δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: ദൈവത്തിന്റെ വിലയിരുത്തലിൽ നീതിയുള്ളവരെന്ന അർഥവും റോമർ ലേഖനത്തിലെ പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവത്തിന്റെ മുമ്പിൽ
  rationale: ദൈവത്തിന്റെ ന്യായവിധിയിലോ വിലയിരുത്തലിലോ ഉള്ള നില എന്ന ആശയം ചുരുക്കമായും കൃത്യമായും നൽകുന്നു.
- source_word: ποιηταὶ
  choice: അനുഷ്ഠിക്കുന്നവർ
  rationale: ‘ചെയ്യുന്നവർ’ എന്നതിനെക്കാൾ നിയമം പ്രവൃത്തിയിൽ പാലിക്കുക എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; കേൾക്കുന്നവരോടുള്ള വിരോധവും നിലനിർത്തുന്നു.
- source_word: δικαιωθήσονται
  choice: നീതീകരിക്കപ്പെടുക
  rationale: ഭാവികാല കർമണിപ്രയോഗവും റോമർ ലേഖനത്തിലെ δικαιόω എന്ന പ്രധാന ദൈവശാസ്ത്രപദത്തിന്റെ തുടർച്ചയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: δικαιωθήσονται എന്ന പദത്തിന്റെ ന്യായവിധിസംബന്ധവും പൗലോസിന്റെ ദൈവശാസ്ത്രപരവുമായ വ്യാപ്തി
  choice: നീതീകരിക്കപ്പെടുക
  alternative: നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടുക; നീതിയുള്ളവരെന്നു തെളിയിക്കപ്പെടുക
  rationale: ‘നീതീകരിക്കപ്പെടുക’ എന്നത് പദത്തിന്റെ ദൈവശാസ്ത്രഭാരം നിലനിർത്തുകയും പ്രഖ്യാപനം മാത്രമോ അന്തിമമായ സ്ഥിരീകരണം മാത്രമോ എന്ന ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് വാക്യത്തെ ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു; മറ്റു സാധ്യമായ അർഥഭാവങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കേൾക്കുന്നവർ—അനുഷ്ഠിക്കുന്നവർ’ എന്ന സമാന്തരവിരോധവും വാക്യത്തിന്റെ ന്യായവിധിസ്വരവും നിലനിർത്തിയിരിക്കുന്നു.
