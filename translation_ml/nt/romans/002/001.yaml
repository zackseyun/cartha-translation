revisions:
- from: അതുകൊണ്ട്, മറ്റുള്ളവരെ വിധിക്കുന്ന മനുഷ്യാ,[a] നീ ആരായാലും നിനക്ക് ഒഴികഴിവില്ല. മറ്റൊരാളെ വിധിക്കുമ്പോൾ നീ നിന്നെത്തന്നെ കുറ്റക്കാരനെന്നു വിധിക്കുന്നു; കാരണം, വിധിക്കുന്ന നീയും അതേ കാര്യങ്ങൾതന്നെ ചെയ്യുന്നു.
  to: അതുകൊണ്ട്, മനുഷ്യാ, വിധിക്കുന്ന നീ ആരായാലും നിനക്കു ഒരു ഒഴികഴിവുമില്ല. കാരണം, മറ്റൊരാളെ വിധിക്കുമ്പോൾ നീ നിന്നെത്തന്നെ കുറ്റക്കാരനായി വിധിക്കുന്നു; വിധിക്കുന്ന നീ അതേ കാര്യങ്ങൾതന്നെ ചെയ്യുന്നു.
  rationale: The revision preserves the Greek's direct singular address, its universalizing force (“നീ ആരായാലും”), the distinction between judging and condemning, and the present ethical force of practicing the same things. The existing footnote is retained unchanged because it accurately explains the representative masculine form without imposing a theological interpretation.
