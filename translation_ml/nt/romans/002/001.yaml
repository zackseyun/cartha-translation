id: ROM.2.1
reference: Romans 2:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: ml
  text: അതുകൊണ്ട്, മനുഷ്യാ, വിധിക്കുന്ന നീ ആരായാലും നിനക്കു ഒരു ഒഴികഴിവുമില്ല. കാരണം, മറ്റൊരാളെ വിധിക്കുമ്പോൾ നീ നിന്നെത്തന്നെ കുറ്റക്കാരനായി വിധിക്കുന്നു; വിധിക്കുന്ന നീ അതേ കാര്യങ്ങൾതന്നെ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀναπολόγητος
  choice: ഒഴികഴിവില്ല
  rationale: സാധുവായ പ്രതിവാദമോ ന്യായീകരണമോ ഇല്ലെന്ന നീതിന്യായസംബന്ധമായ ഭാവം ലളിതമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὦ ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: ഗ്രീക്കിലെ ഏകവചന സംബോധനയുടെ നേരിട്ടുള്ള വാഗ്‌ശൈലി നിലനിർത്തുന്നു; ഇവിടെ അത് മനുഷ്യരെ പൊതുവായി പ്രതിനിധീകരിക്കുന്ന പ്രയോഗമാണ്.
- source_word: πᾶς ὁ κρίνων
  choice: മറ്റുള്ളവരെ വിധിക്കുന്ന മനുഷ്യാ, നീ ആരായാലും
  rationale: πᾶς എന്നതിന്റെ സാർവത്രികത ‘നീ ആരായാലും’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുകയും സംബോധനയുടെ ശക്തി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: മറ്റൊരാളെ വിധിക്കുമ്പോൾ
  rationale: വിധിക്കുന്ന പ്രവൃത്തിയാണ് സ്വയം കുറ്റക്കാരനെന്നു വിധിക്കപ്പെടുന്ന സന്ദർഭവും അടിസ്ഥാനവും എന്ന ഗ്രീക്ക് ഘടനയുടെ പ്രധാന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κατακρίνεις
  choice: കുറ്റക്കാരനെന്നു വിധിക്കുന്നു
  rationale: സാധാരണ ‘വിധിക്കുക’ എന്നതിനെക്കാൾ ശക്തമായ കുറ്റവിധിയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων
  choice: കാരണം, വിധിക്കുന്ന നീയും അതേ കാര്യങ്ങൾതന്നെ ചെയ്യുന്നു
  rationale: വർത്തമാനകാലത്തിലെ തുടർച്ചയായ ധാർമിക പ്രവൃത്തിയെയും വിധിക്കുന്നവനും അതേ പ്രവൃത്തികൾ ചെയ്യുന്നു എന്ന ഊന്നലിനെയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ശാസനയിലെ പ്രതിനിധാനപരമായ പുരുഷലിംഗ സംബോധന
  choice: മുഖ്യപാഠത്തിൽ ‘മനുഷ്യാ’ നിലനിർത്തി, അത് എല്ലാവരെയും പ്രതിനിധീകരിക്കുന്ന സംബോധനയാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
  alternative: ‘വ്യക്തിയേ’ അല്ലെങ്കിൽ ലിംഗസൂചനയില്ലാത്ത മറ്റൊരു സംബോധന
  rationale: ഗ്രീക്ക് പദം വ്യാകരണപരമായി പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ പൊതുവായ പ്രതിനിധാനശക്തിയുണ്ട്. മുഖ്യപാഠം മൂലരൂപത്തിന്റെ വാഗ്‌ശൈലി നിലനിർത്തുന്നു; അടിക്കുറിപ്പ് അതിന്റെ വിശാലമായ പ്രയോഗം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ നേരിട്ടുള്ള ശാസനാശൈലി. ‘നീ ആരായാലും’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ സാർവത്രികത വായനാസൗകര്യത്തോടെ പകർന്നു നൽകുന്നു.
