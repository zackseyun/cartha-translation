- from: അവിടന്ന് ഓരോരുത്തർക്കും അവരവരുടെ[b] പ്രവൃത്തികൾക്കനുസരിച്ച്[a] തിരിച്ചുനൽകും.
  to: അവൻ ഓരോരുത്തർക്കും അവരവരുടെ[b] പ്രവൃത്തികൾ[a]ക്കനുസരിച്ച് തിരിച്ചുനൽകും.
