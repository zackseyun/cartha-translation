  text: ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: ml
  text: അവൻ ഓരോരുത്തർക്കും അവരവരുടെ[b] പ്രവൃത്തികൾ[a]ക്കനുസരിച്ച് തിരിച്ചുനൽകും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പ്രവൃത്തികൾ” എന്നതിനു പകരം “ചെയ്ത കാര്യങ്ങൾ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനം, “അവന്റെ”; ഇവിടെ ഓരോ വ്യക്തിയെയും പൊതുവായി സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: അവിടന്ന്
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ബന്ധസർവനാമത്തിന്റെ തുടർച്ച മലയാളത്തിൽ സ്വാഭാവികവും ആദരസൂചകവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀποδώσει
  choice: തിരിച്ചുനൽകും
  rationale: ന്യായവിധിയുടെയും തക്ക പ്രതിഫലം നൽകുന്നതിന്റെയും പശ്ചാത്തലത്തിൽ ‘നൽകേണ്ടത് തിരിച്ചുനൽകുക’ എന്ന ക്രിയയുടെ ശക്തി നിലനിർത്തുന്നു; അർഥത്തെ ‘സമ്മാനിക്കും’ എന്നു ചുരുക്കുന്നില്ല.
- source_word: ἑκάστῳ
  choice: ഓരോരുത്തർക്കും
  rationale: ഗ്രീക്കിലെ ഏകവചനപരമായ വിതരണാർഥവും ഓരോ വ്യക്തിയിലുമുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κατὰ
  choice: അനുസരിച്ച്
  rationale: മാനദണ്ഡമോ അളവുകോലോ സൂചിപ്പിക്കുന്ന κατὰ എന്ന പദത്തിന്റെ ഈ സന്ദർഭത്തിലെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികൾ
  rationale: ἔργα എന്നതിന്റെ നേരിട്ടുള്ളതും പൗലോസിന്റെ പ്രയോഗസാമ്യം നിലനിർത്തുന്നതുമായ മലയാളപദമാണ്; ‘ചെയ്ത കാര്യങ്ങൾ’ എന്നതും സാധ്യമായ മറ്റൊരു പ്രയോഗമാണ്.
- source_word: αὐτοῦ
  choice: അവരവരുടെ
  rationale: ഗ്രീക്കിൽ പുരുഷലിംഗ ഏകവചനമാണെങ്കിലും ഇവിടെ ഓരോ വ്യക്തിയെയും പൊതുവായി പ്രതിനിധീകരിക്കുന്നു. മലയാളത്തിലെ ‘അവരവരുടെ’ ഈ വിതരണാർഥം ലിംഗഭേദമില്ലാതെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പ്രവൃത്തികൾക്കനുസരിച്ചുള്ള ന്യായവിധി
  choice: പ്രവൃത്തികൾക്കനുസരിച്ച് ഓരോരുത്തർക്കും തിരിച്ചുനൽകുമെന്ന ന്യായപരമായ പ്രതിഫലഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘പെരുമാറും’ എന്ന പൊതുവായ പ്രയോഗമോ ‘സമ്മാനം നൽകും’ എന്ന അനുകൂലാർഥമുള്ള പ്രയോഗമോ ഉപയോഗിക്കുക.
  rationale: വാക്യം പ്രവൃത്തികളെ മാനദണ്ഡമാക്കിയുള്ള പ്രതിഫലം വ്യക്തമായി പറയുന്നു. നീതീകരണത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ മറ്റു പ്രസ്താവനകളുമായി ഇതിനെ വിവർത്തനത്തിൽത്തന്നെ സമന്വയിപ്പിക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ദൈവത്തെ സൂചിപ്പിക്കാൻ ആദരസൂചകമായ ‘അവിടന്ന്’ ഉപയോഗിച്ചു. ‘തിരിച്ചുനൽകും’ എന്നത് ന്യായവിധിയുടെ പ്രതിഫലസ്വരം നിലനിർത്തുന്നു; ‘അവരവരുടെ’ എന്നത് ഓരോ വ്യക്തിയെയും സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
