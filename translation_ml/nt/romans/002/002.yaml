id: ROM.2.2
reference: Romans 2:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: ml
  text: ഇങ്ങനെയുള്ള കാര്യങ്ങൾ ചെയ്യുന്നവർക്കെതിരെയുള്ള ദൈവത്തിന്റെ ന്യായവിധി സത്യത്തിനനുസരിച്ചാണെന്ന് നമുക്കറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സത്യത്തിന് അനുസൃതമായി’; അതായത്, ദൈവത്തിന്റെ ന്യായവിധി സത്യത്തോടു പൊരുത്തപ്പെടുന്നതാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: നമുക്കറിയാം
  rationale: οἶδα എന്ന പൂർണരൂപത്തിന് ഇവിടെ വർത്തമാനകാല അർഥമാണ്; ഉറപ്പോടെ പങ്കുവെക്കുന്ന അറിവിനെ ഈ സ്വാഭാവിക മലയാളപ്രയോഗം നേരിട്ട് അറിയിക്കുന്നു.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധത്തേക്കാൾ ആശയത്തിന്റെ തുടർച്ചയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക ഒഴുക്കിൽ അതിന്റെ ബന്ധകബലം വ്യക്തമായതിനാൽ ‘എന്നാൽ’ എന്ന ശക്തമായ വിരോധസൂചകം ചേർത്തില്ല.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: ദൈവത്തിന്റെ നീതിന്യായപരമായ വിധിയെ സൂചിപ്പിക്കുന്നു; ‘ശിക്ഷാവിധി’ എന്ന് പറഞ്ഞ് ഫലത്തെ മാത്രം മുൻകൂട്ടി നിർണയിക്കാതെ മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: κατὰ ἀλήθειαν
  choice: സത്യത്തിനനുസരിച്ച്
  rationale: വിധി സത്യത്തോടും യാഥാർഥ്യത്തോടും പൊരുത്തപ്പെടുന്നു എന്ന ആശയം നിലനിർത്തുന്നു; ‘നീതിപൂർവം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മകമായ രൂപത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: ἐπὶ
  choice: എതിരെയുള്ള
  rationale: പ്രതികൂലമായ ന്യായവിധി ഏവരുടെമേലാണ് വരുന്നതെന്ന് മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὰ τοιαῦτα
  choice: ഇങ്ങനെയുള്ള കാര്യങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പ്രവൃത്തികളിലേക്കു തിരിച്ചുചൂണ്ടുന്ന നപുംസക ബഹുവചനപ്രയോഗത്തിന്റെ സ്വാഭാവിക തത്തുല്യമാണ്.
- source_word: πράσσοντας
  choice: ചെയ്യുന്നവർ
  rationale: വർത്തമാനകാല കൃദന്തരൂപം തുടർച്ചയായതോ സ്വഭാവസവിശേഷമായതോ ആയ പെരുമാറ്റത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ സന്ദർഭാനുസൃതമായി ‘ചെയ്യുന്നവർ’ അതു സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: κατὰ ἀλήθειαν എന്നത് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘നീതിപൂർവം’ എന്നു നൽകണമോ, സത്യത്തോടുള്ള പൊരുത്തം സുതാര്യമായി നിലനിർത്തണമോ എന്നത്.
  choice: സത്യത്തിനനുസരിച്ച്
  alternative: നീതിപൂർവം
  rationale: ദൈവത്തിന്റെ വിധി സത്യത്തിനും യാഥാർഥ്യത്തിനും അനുസൃതമാണെന്ന പൗലോസിന്റെ ഭാഷയും ദൈവശാസ്ത്രപരമായ ഊന്നലും ഈ രൂപം സംരക്ഷിക്കുന്നു; വിധിയുടെ സ്വഭാവത്തെ വെറും ‘ശരി’ എന്ന ആശയത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ന്യായവിധി’ നീതിന്യായസന്ദർഭം വ്യക്തമായി സൂക്ഷിക്കുന്നു; വാക്യക്രമം സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായിരിക്കെ ഗ്രീക്ക് വാക്യത്തിന്റെ മുഖ്യബന്ധങ്ങൾ നിലനിർത്തുന്നു.
