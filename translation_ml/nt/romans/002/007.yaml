  source_fidelity: 'The draft accurately carries forward the governing verb from Romans 2:6 (“will give/render”) and preserves the Greek recipient construction: eternal life is given to those who, with persevering constancy in doing good, seek glory, honor, and incorruptibility. The three sought objects remain distinct, and no doctrinal explanation is added.'
