id: ROM.2.7
reference: Romans 2:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: ml
  text: നല്ലത് ചെയ്യുന്നതിൽ സ്ഥിരത പുലർത്തിക്കൊണ്ട് മഹത്ത്വവും ബഹുമാനവും അനശ്വരതയും അന്വേഷിക്കുന്നവർക്ക് നിത്യജീവൻ നൽകും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: നല്ലത് ചെയ്യുന്നതിൽ സ്ഥിരത പുലർത്തിക്കൊണ്ട്
  rationale: ὑπομονήയുടെ നിലനിൽക്കുന്ന സഹനവും ദൃഢതയും സ്വാഭാവിക മലയാളത്തിൽ ‘സ്ഥിരത പുലർത്തുക’ എന്നു നൽകി; ἔργου ἀγαθοῦ എന്നതിനെ സന്ദർഭാനുസൃതമായി ‘നല്ലത് ചെയ്യുക’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: മഹത്ത്വവും ബഹുമാനവും അനശ്വരതയും
  rationale: മൂന്നു സമാന്തര നാമങ്ങളെയും വേർതിരിച്ചു നിലനിർത്തുന്നു; ἀφθαρσία എന്നത് ക്ഷയമോ നാശമോ ഇല്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അനശ്വരത’ തെരഞ്ഞെടുത്തു.
- source_word: ζητοῦσιν
  choice: അന്വേഷിക്കുന്നവർക്ക്
  rationale: തുടർച്ചയായ ലക്ഷ്യബോധമുള്ള അന്വേഷണമെന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: ζωὴν αἰώνιον
  choice: നിത്യജീവൻ
  rationale: സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ സ്ഥാപിത മലയാളപ്രയോഗം.
theological_decisions:
- issue: നിത്യജീവനും നല്ല പ്രവൃത്തിയിലെ സ്ഥിരതയും തമ്മിലുള്ള ബന്ധം
  choice: ഗ്രീക്ക് വാക്യത്തിലെ നിബന്ധനാത്മക വിവരണക്രമം അതേപടി നിലനിർത്തി
  alternative: നല്ല പ്രവൃത്തികളെ വിശ്വാസത്തിന്റെ തെളിവായോ നിത്യജീവന്റെ കാരണമായോ വ്യക്തമായി വ്യാഖ്യാനിക്കുക
  rationale: ഈ വാക്യം തന്നെ ആ ബന്ധത്തിന്റെ ദൈവശാസ്ത്രപരമായ വിശദീകരണം നൽകുന്നില്ല; അതിനാൽ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം വിവർത്തനത്തിലേക്ക് ചേർത്തിട്ടില്ല.
- issue: പ്രധാന ക്രിയയുടെ അർത്ഥം മുൻവാക്യത്തിൽ നിന്ന് പൂർത്തിയാക്കൽ
  choice: ‘നൽകും’ എന്ന് വ്യക്തമാക്കി
  alternative: ഗ്രീക്കിലെപ്പോലെ ക്രിയയില്ലാത്ത വാക്യഖണ്ഡമായി വിടുക
  rationale: Romans 2:6-ലെ ἀποδώσει (‘പ്രതിഫലം നൽകും’) എന്ന ക്രിയ 2:7-ലും അർത്ഥപരമായി തുടരുന്നു. സ്വാഭാവിക മലയാളത്തിനായി അത് പൂർത്തിയാക്കിയെങ്കിലും ‘നിത്യജീവൻ’ എന്ന നേരിട്ടുള്ള ഫലം മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലത്തിലെ ഘടനയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചുകൊണ്ട് അസ്വാഭാവികമായ പദാനുപദരീതി ഒഴിവാക്കി.
