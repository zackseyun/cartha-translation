id: ROM.9.5
reference: Romans 9:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: ml
  text: പിതാക്കന്മാർ അവരുടേതാണ്; ജഡപ്രകാരം അവരിൽനിന്നുള്ളവനാണ് മശീഹാ[a]. സകലത്തിനും മീതെയുള്ള, എന്നേക്കും വാഴ്ത്തപ്പെട്ട ദൈവമാണ് അവിടുന്ന്[b]. ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മാനുഷിക വംശപരമ്പരപ്രകാരം.’ അക്ഷരാർഥത്തിൽ, ‘ജഡപ്രകാരം.’
    reason: lexical_alternative
  - marker: b
    text: 'അവസാന ഭാഗത്തെ വേറിട്ട ഒരു സ്തുതിവാക്യമായി എടുത്താൽ: ‘സകലത്തിനും മീതെയുള്ള ദൈവം എന്നേക്കും വാഴ്ത്തപ്പെടുമാറാകട്ടെ. ആമേൻ.’ ഈ വായനയിൽ അത് മശീഹായെ വിശേഷിപ്പിക്കുന്നതല്ല.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: പിതാക്കന്മാർ
  rationale: ഇസ്രായേലിന്റെ ആദരണീയരായ പൂർവപിതാക്കന്മാരെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ ഉടമ്പടി-ചരിത്രപരമായ ഭാഷ നിലനിർത്തുന്ന അടുത്ത മലയാളരൂപമാണിത്.
- source_word: ἐξ ὧν
  choice: അവരിൽനിന്നുള്ളവനാണ്
  rationale: ബന്ധസർവനാമം മുമ്പു പരാമർശിച്ച ഇസ്രായേല്യരിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മശീഹായുടെ മാനുഷിക വംശപരമ്പര സ്വാഭാവികമായ മലയാളത്തിൽ ഇതു വ്യക്തമാക്കുന്നു.
- source_word: ὁ χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ Χριστός ഒരു പേരുപോലെയല്ല, ഇസ്രായേലിനോടു ബന്ധപ്പെട്ട സ്ഥാനപ്പേരായാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; അതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: τὸ κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: ഭൗമികവും മാനുഷികവുമായ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം അടുത്ത രൂപത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ ‘ജഡം’ പാപസ്വഭാവത്തെ സൂചിപ്പിക്കുന്നില്ല.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: അവിടുന്ന് സകലത്തിനും മീതെയുള്ളവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തരൂപം സ്വാഭാവികമായി മശീഹായെ തുടർന്നു വിശേഷിപ്പിക്കുന്നു. ആദരസൂചകമായ ‘അവിടുന്ന്’ മലയാളത്തിൽ വ്യക്തതയും ഗൗരവവും നൽകുന്നു.
- source_word: θεὸς εὐλογητὸς
  choice: വാഴ്ത്തപ്പെട്ട ദൈവം
  rationale: മുൻപുള്ള മശീഹാ-വിവരണത്തോടു സമാനാധികരണമായി ചേർന്നു നിൽക്കുന്ന ഗ്രീക്ക് ഘടനയെ സംക്ഷിപ്തമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും
  rationale: യുഗാന്തരങ്ങളിലേക്കുള്ള കാലപരിധിയെ സൂചിപ്പിക്കുന്ന സ്തുതിവാക്യപ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാള തുല്യരൂപമാണിത്.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: പരമ്പരാഗതമായ ആരാധനാഭാഷയിലെ ലിപ്യന്തരണം നിലനിർത്തി.
theological_decisions:
- issue: ‘ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας’ എന്ന ഭാഗം മശീഹായെ വിശേഷിപ്പിക്കുന്നതാണോ, അതോ ദൈവത്തോടുള്ള വേറിട്ട സ്തുതിവാക്യമാണോ
  choice: 'മശീഹായെ തുടർന്നു വിശേഷിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ എടുത്തു: ‘അവിടുന്ന് സകലത്തിനും മീതെയുള്ളവൻ, എന്നേക്കും വാഴ്ത്തപ്പെട്ട ദൈവം.’'
  alternative: 'വേറിട്ട സ്തുതിവാക്യമായി വായിക്കാം: ‘സകലത്തിനും മീതെയുള്ള ദൈവം എന്നേക്കും വാഴ്ത്തപ്പെടുമാറാകട്ടെ.’'
  rationale: ὁ ὢν എന്ന ആർട്ടിക്കിളോടുകൂടിയ കൃദന്തം ὁ χριστός എന്നതോടു സമാനാധികരണമായി ചേർന്നു നിൽക്കുന്നതാണ് ഗ്രീക്ക് വാക്യത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ ഒഴുക്ക്. എന്നാൽ ആദിമ കൈയെഴുത്തുപ്രതികളിൽ ആധുനിക വിരാമചിഹ്നങ്ങൾ ഇല്ലാത്തതിനാലും ഈ വാക്യവിഭജനം ദീർഘകാലമായി ചർച്ചചെയ്യപ്പെട്ടതിനാലും മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി ഉപയോഗിച്ചു. ‘ജഡപ്രകാരം’ എന്ന പൗലോസിന്റെ സവിശേഷ പ്രയോഗം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. തർക്കവിധേയമായ അവസാന ഭാഗത്തിന്റെ വ്യാകരണപരമായ അനിശ്ചിതത്വം മുഖ്യവായനയിൽ മറച്ചുവയ്ക്കാതെ പകരവായനയായി രേഖപ്പെടുത്തി.
