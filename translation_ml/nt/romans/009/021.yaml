id: ROM.9.21
reference: Romans 9:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, ഒരേ കളിമൺപിണ്ഡത്തിൽനിന്ന് ഒരു പാത്രം മാനത്തിനായും മറ്റൊന്ന് അപമാനത്തിനായും ഉണ്ടാക്കാൻ കുശവന് കളിമണ്ണിന്മേൽ അധികാരമില്ലയോ?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുശവന് കളിമണ്ണിന്മേൽ അവകാശമില്ലയോ?’
    reason: lexical_alternative
  - marker: b
    text: ‘ഒരേ കളിമൺപിണ്ഡത്തിൽനിന്ന്’ എന്നതിന് ‘ഒരേ കളിമൺകൂട്ടത്തിൽനിന്ന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘ഒരു പാത്രം മാന്യമായ ഉപയോഗത്തിനായും മറ്റൊന്ന് സാധാരണ ഉപയോഗത്തിനായും.’
    reason: alternative_reading
  - marker: d
    text: ഈ പ്രതിച്ഛായ യെശയ്യാവ് 29:16; 45:9; യിരെമ്യാവ് 18:1–6 എന്നിവിടങ്ങളിലെ കുശവൻ–കളിമൺ ഭാഗങ്ങളെ അനുസ്മരിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: പൗലോസിന്റെ വാദത്തിലെ അടുത്ത ആലങ്കാരികചോദ്യത്തെ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: അധികാരമില്ലയോ?
  rationale: ἐξουσία വെറും കഴിവല്ല, ന്യായമായ അധികാരമോ അവകാശപരമായ പ്രഭുത്വമോ സൂചിപ്പിക്കുന്നു. ‘അധികാരം’ ആ അർഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: ὁ κεραμεὺς
  choice: കുശവൻ
  rationale: കളിമണ്ണുകൊണ്ട് പാത്രം രൂപപ്പെടുത്തുന്ന ശില്പിക്കുള്ള കൃത്യവും സാധാരണവുമായ മലയാളപദം; പ്രവാചകഗ്രന്ഥങ്ങളിലെ കുശവൻ–കളിമൺ പ്രതിച്ഛായയും നിലനിർത്തുന്നു.
- source_word: τοῦ πηλοῦ
  choice: കളിമണ്ണിന്മേൽ
  rationale: ἐξουσίαയോടൊപ്പമുള്ള ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ ‘അധികാരം ... മേൽ’ എന്നു സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: ഒരേ കളിമൺപിണ്ഡത്തിൽനിന്ന്
  rationale: φύραμα കലർത്തിയുണ്ടാക്കിയ പിണ്ഡത്തെയോ ദ്രവ്യമാസത്തെയോ സൂചിപ്പിക്കുന്നു. സന്ദർഭം വ്യക്തമാക്കാൻ ‘കളിമൺ’ ചേർത്ത ‘പിണ്ഡം’ കൃത്യവും സുതാര്യവുമാണ്.
- source_word: ποιῆσαι
  choice: ഉണ്ടാക്കാൻ
  rationale: സാധാരണവും നേരിട്ടുമുള്ള ക്രിയ; രൂപപ്പെടുത്തൽ എന്ന ആശയം കുശവൻ–കളിമൺ സന്ദർഭത്തിൽ സ്വാഭാവികമായി ഗ്രഹിക്കപ്പെടുന്നു.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: ഒരു ... മറ്റൊന്ന്
  rationale: രണ്ട് വിരുദ്ധഫലങ്ങളെ വ്യക്തമായി ബന്ധിപ്പിക്കുന്നു; μέν...δέയുടെ വ്യത്യാസം അമിതമായി വാക്കുപ്രതി ആക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰς τιμὴν
  choice: മാനത്തിനായി
  rationale: τιμήയുടെ മാനം/ബഹുമതി എന്ന നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ഉപയോഗത്തിന്റെ സ്വഭാവം അനാവശ്യമായി നിർണ്ണയിക്കുന്നില്ല.
- source_word: σκεῦος
  choice: പാത്രം
  rationale: കുശവന്റെ പ്രതിച്ഛായയിൽ സ്വാഭാവികവും കൃത്യവുമായ തത്തുല്യപദം.
- source_word: εἰς ἀτιμίαν
  choice: അപമാനത്തിനായി
  rationale: ἀτιμίαയെ τιμήയുടെ നേരിട്ടുള്ള വിരുദ്ധമായി അവതരിപ്പിക്കുന്നു; ‘സാധാരണ ഉപയോഗം’ എന്ന സന്ദർഭവ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
theological_decisions:
- issue: കുശവന്റെ ἐξουσίαയെ ദൈവാധിപത്യവും മനുഷ്യുത്തരവാദിത്വവും സംബന്ധിച്ച വാദങ്ങൾക്കിടയിൽ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: അധികാരം
  alternative: അവകാശം; ശക്തി
  rationale: ‘അധികാരം’ ന്യായമായ പ്രഭുത്വത്തെ സൂചിപ്പിക്കുമ്പോഴും നിർണ്ണയവാദമോ സ്വാതന്ത്ര്യവാദമോ പോലുള്ള വികസിത സിദ്ധാന്തനിഗമനങ്ങൾ വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല; പൗലോസിന്റെ വാദത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെക്കുന്നു.
- issue: εἰς τιμὴν / εἰς ἀτιμίαν എന്നതിനെ ഉപയോഗവിഭാഗങ്ങളായി വ്യാഖ്യാനിക്കണമോ, മാനം–അപമാനം എന്ന ഭാഷ നിലനിർത്തണമോ
  choice: മാനത്തിനായി ... അപമാനത്തിനായി
  alternative: മാന്യമായ ഉപയോഗത്തിനായി ... സാധാരണ ഉപയോഗത്തിനായി
  rationale: ഗ്രീക്ക് നേരിട്ട് മാനം–അപമാനം എന്ന വിരുദ്ധതയാണ് ഉപയോഗിക്കുന്നത്. അത് നിലനിർത്തുന്നത് പൗലോസിന്റെ ആശയത്തെ വീട്ടുപയോഗത്തിന്റെ പ്രവർത്തനവിഭാഗങ്ങളിലേക്ക് ചുരുക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കുശവൻ’, ‘കളിമൺപിണ്ഡം’, ‘പാത്രം’ എന്നിവ പ്രതിച്ഛായയുടെ സുതാര്യത നിലനിർത്തുന്നു. മുഖ്യവാചകത്തിൽ മാനം–അപമാനം എന്ന ഗ്രീക്ക് വിരുദ്ധത സംരക്ഷിച്ച് കൂടുതൽ വ്യാഖ്യാനാത്മകമായ ഉപയോഗവായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
