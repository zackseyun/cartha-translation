translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ഭാഷ ഉപയോഗിച്ചു. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായതിനാൽ ὅτιയെ വാക്യാന്ത്യത്തിലെ ‘എന്ന്’ കൊണ്ട് പ്രതിനിധീകരിച്ചു; ‘ഹൃദയം’ എന്ന ദൃശ്യമായ ബൈബിൾപ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ നിലനിർത്തി.
