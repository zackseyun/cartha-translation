id: ROM.9.2
reference: Romans 9:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: ml
  text: എനിക്ക് വലിയ ദുഃഖവും[a] നിലയ്ക്കാത്ത വേദനയും[b] എന്റെ ഹൃദയത്തിൽ[c] ഉണ്ടെന്ന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദുഃഖം’ എന്നതിന് ‘വ്യസനം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘വേദന’ എന്നതിന് ‘കടുത്ത മനോവ്യഥ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘എന്റെ ഹൃദയത്തിന്’ എന്നാണ്; മലയാളത്തിൽ ഈ പ്രയോഗം സ്വാഭാവികമായി ‘എന്റെ ഹൃദയത്തിൽ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: എന്ന്
  rationale: മുൻവാക്യത്തിലെ പൗലോസിന്റെ ഉറപ്പിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്നതിനാൽ, കാരണാർഥകമായ ‘കാരണം’ എന്നതിനെക്കാൾ ഉദ്ധരണിപൂരകമായ ‘എന്ന്’ സന്ദർഭത്തിന് യോജിക്കുന്നു.
- source_word: λύπη
  choice: ദുഃഖം
  rationale: ആഴമുള്ള സങ്കടത്തെയോ വ്യസനത്തെയോ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദമാണ് ‘ദുഃഖം’.
- source_word: μοί ἐστιν
  choice: എനിക്ക് … ഉണ്ടെന്ന്
  rationale: εἰμίയോടുകൂടിയ ദത്തിവിഭക്തി ഇവിടെ അനുഭവമോ കൈവശാവസ്ഥയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘എനിക്ക് … ഉണ്ട്’ എന്ന പ്രയോഗം അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: μεγάλη
  choice: വലിയ
  rationale: ദുഃഖത്തിന്റെ തീവ്രത വ്യക്തമാക്കുന്ന നേരിട്ടുള്ള വിശേഷണമാണ്.
- source_word: καὶ
  choice: -വും … -യും
  rationale: രണ്ട് ദുഃഖപ്രകടനങ്ങളെയും മലയാളത്തിലെ സ്വാഭാവികമായ സമുച്ചയഘടനയിൽ ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀδιάλειπτος
  choice: നിലയ്ക്കാത്ത
  rationale: തുടർച്ചയായി അവസാനിക്കാതെ നിലനിൽക്കുന്നതെന്ന ആശയം വ്യക്തവും ശക്തവുമായി പകർന്നുനൽകുന്നു.
- source_word: ὀδύνη
  choice: വേദന
  rationale: കടുത്ത ആന്തരിക വ്യഥയെ സൂചിപ്പിക്കുന്നു; ‘ഹൃദയത്തിൽ’ എന്ന പ്രയോഗത്തോടൊപ്പം വൈകാരിക വേദനയായി സ്വാഭാവികമായി മനസ്സിലാകുന്നു.
- source_word: τῇ καρδίᾳ μου
  choice: എന്റെ ഹൃദയത്തിൽ
  rationale: ഉള്ളിലെ വൈകാരികജീവിതത്തിന്റെ കേന്ദ്രം എന്ന ബൈബിൾപ്രയോഗം നിലനിർത്തുകയും ഗ്രീക്ക് ദത്തിവിഭക്തിയെ സ്വാഭാവിക മലയാള സ്ഥാനാർഥകപ്രയോഗമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
