  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: ml
  text: 'എന്നാൽ യെശയ്യാവ് ഇസ്രായേലിനെക്കുറിച്ച് വിളിച്ചുപറയുന്നു: “ഇസ്രായേൽമക്കളുടെ[a] എണ്ണം കടലിലെ മണൽപോലെ ആയിരുന്നാലും[b], ശേഷിപ്പു രക്ഷിക്കപ്പെടും[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഇസ്രായേലിന്റെ പുത്രന്മാർ,” “ഇസ്രായേലിന്റെ സന്തതികൾ,” അല്ലെങ്കിൽ “ഇസ്രായേല്യർ.” ഗ്രീക്കിൽ അക്ഷരാർഥമായി “ഇസ്രായേലിന്റെ പുത്രന്മാർ” എന്നാണ്; ഇത് പരമ്പരാഗതമായ ഒരു ഉടമ്പടിസംബന്ധിയായ കൂട്ടനാമമാണ്.
    reason: lexical_alternative
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാർഥമായി: “ഇസ്രായേൽമക്കളുടെ എണ്ണം കടലിലെ മണൽപോലെ ആണെങ്കിൽ.” ഇവിടെ ഗ്രീക്ക് വ്യവസ്ഥാവാചകത്തിന് സന്ദർഭത്തിൽ “ആയിരുന്നാലും” എന്ന വിട്ടുവീഴ്ചാഭാവം ഉണ്ടായിരിക്കാം.'
    reason: alternative_reading
  - marker: c
    text: അഥവാ “വിടുവിക്കപ്പെടും.” ഈ പ്രയോഗം രക്ഷിക്കപ്പെട്ട് നിലനിൽക്കുന്ന ഒരു ശേഷിപ്പിനെക്കുറിച്ചുള്ള യെശയ്യാവിന്റെ പ്രവചനത്തെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള മൃദുവായ വൈരുധ്യവും പൗലോസിന്റെ വാഗ്മയപരമായ തിരിവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: κράζει
  choice: വിളിച്ചുപറയുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ സജീവതയും ശക്തമായ പരസ്യപ്രഖ്യാപനത്തിന്റെ ഭാവവും നിലനിർത്തുന്നു.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിനെക്കുറിച്ച്
  rationale: പ്രവാചകവചനത്തിന്റെ സന്ദർഭത്തിൽ ὑπέρ ഇവിടെ ‘ഇസ്രായേലിനുവേണ്ടി’ എന്നതിനെക്കാൾ ‘ഇസ്രായേലിനെ സംബന്ധിച്ച്’ എന്ന അർഥത്തിലാണ് സ്വാഭാവികം.
- source_word: Ἐὰν ᾖ
  choice: ആയിരുന്നാലും
  rationale: വലിയ സംഖ്യയും രക്ഷിക്കപ്പെടുന്ന ശേഷിപ്പും തമ്മിലുള്ള വൈരുധ്യം പ്രകടമാക്കുന്ന concessive ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; കൂടുതൽ അക്ഷരാർഥമായ വ്യവസ്ഥാവാചകം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὁ ἀριθμὸς
  choice: എണ്ണം
  rationale: സാധാരണ വായനക്കാർക്ക് വ്യക്തവും കൃത്യവുമായ മലയാളപ്രയോഗം.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ഇസ്രായേൽമക്കൾ
  rationale: ‘ഇസ്രായേലിന്റെ പുത്രന്മാർ’ എന്ന പരമ്പരാഗത ഉടമ്പടിസംബന്ധിയായ കൂട്ടനാമത്തെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: കടലിലെ മണൽപോലെ
  rationale: തിരുവെഴുത്തിലെ പരിചിതമായ ഉപമയെ മൂലവാചകത്തോട് ചേർന്നും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τὸ ὑπόλειμμα
  choice: ശേഷിപ്പ്
  rationale: നിലനിൽക്കുന്ന ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്ന പ്രവാചക-ദൈവശാസ്ത്രപരമായ ആശയത്തിന് കൃത്യമായ പദം; ഗ്രീക്കിൽ വേറിട്ട് ‘മാത്രം’ ഇല്ലാത്തതിനാൽ അത് മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: റോമർ 9–11-ലെ പൗലോസിന്റെ സന്ദർഭത്തിൽ ദൈവശാസ്ത്രപരമായ ഭാരം സംരക്ഷിക്കുന്നു; പ്രവാചകപശ്ചാത്തലത്തിലെ ‘വിടുവിക്കപ്പെടും’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: Ἐὰν ᾖ എന്ന വ്യവസ്ഥാവാചകത്തിന്റെ അർഥഭാവം
  choice: വിട്ടുവീഴ്ചാഭാവത്തിൽ ‘ആയിരുന്നാലും’
  alternative: കൂടുതൽ അക്ഷരാർഥമായി ‘ആണെങ്കിൽ’ അല്ലെങ്കിൽ ഊന്നലോടെ ‘ആണെങ്കിൽപ്പോലും’
  rationale: ഇസ്രായേലിന്റെ വലിയ സംഖ്യയും രക്ഷിക്കപ്പെടുന്ന ശേഷിപ്പും തമ്മിലുള്ള പ്രവാചകവചനത്തിലെ വൈരുധ്യം വ്യക്തമായി പ്രകടമാക്കുന്നു; വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: σωθήσεται എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ‘രക്ഷിക്കപ്പെടും’
  alternative: ‘വിടുവിക്കപ്പെടും’ അല്ലെങ്കിൽ ‘സംരക്ഷിക്കപ്പെടും’
  rationale: പൗലോസിന്റെ രക്ഷാചരിത്രപരമായ സന്ദർഭത്തിലെ ഗൗരവം നിലനിർത്തുന്നു; യെശയ്യാവിലെ ചരിത്രപരമായ വിടുതൽധ്വനി ഇല്ലാതാക്കാതെ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: τὸ ὑπόλειμμα എന്നതിൽ ‘മാത്രം’ ചേർക്കണമോ
  choice: ‘ശേഷിപ്പ്’ എന്നു മാത്രം വിവർത്തനം ചെയ്യുക
  alternative: ‘ശേഷിപ്പുമാത്രം’
  rationale: ‘ശേഷിപ്പ്’ എന്ന പദം തന്നെ ശേഷിച്ച വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു; മൂലഗ്രീക്കിൽ μόνος ഇല്ലാത്തതിനാൽ ‘മാത്രം’ ചേർത്ത് ഊന്നൽ വർധിപ്പിക്കുന്നതു ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘വിളിച്ചുപറയുന്നു,’ ‘ഇസ്രായേൽമക്കൾ,’ ‘ശേഷിപ്പ്,’ ‘രക്ഷിക്കപ്പെടും’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലവാചകത്തിന്റെ പ്രവാചകഭാവം നിലനിർത്തുന്നതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദത്തിനോ വാക്യഘടകത്തിനോ പിന്നാലെ മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
