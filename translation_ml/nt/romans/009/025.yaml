id: ROM.9.25
reference: Romans 9:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: ml
  text: 'ഹോശേയയിലും അവൻ ഇങ്ങനെ പറയുന്നു: “എന്റെ ജനമല്ലാതിരുന്നവരെ ‘എന്റെ ജനം’ എന്നു വിളിക്കും; സ്നേഹിക്കപ്പെടാതിരുന്നവളെ ‘സ്നേഹിക്കപ്പെട്ടവൾ’ എന്നു വിളിക്കും.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്റെ ജനമല്ലാത്തവനെ ‘എന്റെ ജനം’ എന്നും സ്നേഹിക്കപ്പെടാത്തവളെ ‘സ്നേഹിക്കപ്പെട്ടവൾ’ എന്നും ഞാൻ വിളിക്കും.” ഗ്രീക്കിൽ ആദ്യപ്രയോഗം വ്യാകരണപരമായി ഏകവചനമാണെങ്കിലും ‘ജനം’ സമൂഹവാചകമാണ്.'
    reason: lexical_alternative
  - marker: b
    text: ഹോശേയാ 2:23-ൽ നിന്നുള്ള ഉദ്ധരണി. അധ്യായ-വാക്യസംഖ്യ ചില പാരമ്പര്യങ്ങളിൽ വ്യത്യസ്തമാണ്. ഹോശേയായിലെ പുനഃസ്ഥാപനഭാഷ ദൈവം തനിക്കായി ഒരു ജനത്തെ വിളിക്കുന്നതുമായി പൗലോസ് ബന്ധിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει
  choice: ഹോശേയയുടെ പുസ്തകത്തിലും അവൻ ഇങ്ങനെ പറയുന്നു
  rationale: ഇത് പിന്തുണയ്ക്കുന്ന ഒരു തിരുവെഴുത്തുദ്ധരണി അവതരിപ്പിക്കുന്ന പ്രയോഗമാണ്. ἐν τῷ Ὡσηὲ എന്നത് ഹോശേയയുടെ ഗ്രന്ഥത്തിലെ വാക്കുകളെ സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഹോശേയയുടെ പുസ്തകത്തിൽ’ എന്നു വ്യക്തമാക്കി; καί-യുടെ അനുബന്ധഭാവം ‘-ത്തിലും’ നിലനിർത്തുന്നു. λέγει-യിലെ വ്യക്തിപരമായ ഏകവചനരീതി ‘അവൻ ... പറയുന്നു’ എന്നു സംരക്ഷിച്ചു.
- source_word: Καλέσω
  choice: ഞാൻ വിളിക്കും
  rationale: καλέω ഇവിടെ വെറും പേര് ഉച്ചരിക്കുന്നതിലുപരി ദൈവം ഒരു ജനത്തെ സ്വന്തമായി നാമകരണം ചെയ്യുകയും അംഗീകരിക്കുകയും ചെയ്യുന്ന അർഥം വഹിക്കുന്നു. നേരിട്ടുള്ള ‘വിളിക്കും’ ഹോശേയയിലെ പദപ്രതിധ്വനി നിലനിർത്തുന്നു.
- source_word: τὸν οὐ λαόν μου
  choice: എന്റെ ജനമല്ലാതിരുന്നവരെ
  rationale: ഗ്രീക്കിൽ വ്യാകരണപരമായി ഏകവചനമായിരിക്കുമ്പോഴും λαός സമൂഹവാചകമാണ്. സാധാരണ മലയാളത്തിൽ ജനസമൂഹത്തെ ഉദ്ദേശിക്കുമ്പോൾ ബഹുവചനസദൃശമായ ‘അവരെ’ സ്വാഭാവികമാണ്; ‘ഇരുന്ന’ മുൻസ്ഥിതിയും വ്യക്തമാക്കുന്നു.
- source_word: λαόν μου
  choice: എന്റെ ജനം
  rationale: ഉടമ്പടിബന്ധത്തെ സൂചിപ്പിക്കുന്ന സ്ഥിരമായ ബൈബിൾപ്രയോഗം ചുരുക്കത്തിലും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: സ്നേഹിക്കപ്പെടാതിരുന്നവളെ
  rationale: സ്ത്രീലിംഗ ഏകവചനം ഹോശേയയിലെ പശ്ചാത്തലത്തിന് പ്രധാനമാണ്. ‘അവളെ’ അതു തുറന്നുകാട്ടുകയും passive participle-ന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ἠγαπημένην
  choice: സ്നേഹിക്കപ്പെട്ടവൾ
  rationale: ἀγαπάω എന്ന സ്നേഹപദകുടുംബവുമായുള്ള ബന്ധവും passive അർഥവും നിലനിർത്തുന്നു; ‘പ്രിയപ്പെട്ടവൾ’ എന്നതിനെക്കാൾ മൂലരൂപത്തിന്റെ വാച്യഭാവത്തോട് അടുത്തതാണ്.
theological_decisions:
- issue: ഹോശേയാ ഉദ്ധരണിയിലെ സമൂഹവാചകവും വ്യക്തിവാചകവും
  choice: ആദ്യഭാഗം സമൂഹവാചകമായി ‘എന്റെ ജനമല്ലാതിരുന്നവരെ’ എന്നും രണ്ടാം ഭാഗം സ്ത്രീലിംഗ ഏകവചനമായി ‘സ്നേഹിക്കപ്പെടാതിരുന്നവളെ’ എന്നും പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടുഭാഗവും കർശനമായ ഏകവചനത്തിൽ നൽകുക, അല്ലെങ്കിൽ ഹോശേയയിലെ പേരുകൾപോലെ ‘ലോ-അമ്മി’, ‘ലോ-രുഹാമാ’ എന്നു ലിപ്യന്തരണം ചെയ്യുക.
  rationale: പൗലോസിന്റെ വാദത്തിൽ ദൈവം തനിക്കായി ഒരു ജനത്തെ വിളിക്കുന്നതാണ് മുൻനിരയിൽ; അതിനാൽ λαός-ന്റെ സമൂഹവാചകസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു. എന്നാൽ രണ്ടാം ഭാഗത്തെ സ്ത്രീലിംഗം ഹോശേയയുടെ പ്രവചനപശ്ചാത്തലവുമായി ബന്ധിപ്പിക്കുന്നതിനാൽ അത് സമതലപ്പെടുത്താതെ സൂക്ഷിച്ചു.
- issue: λέγει എന്ന ക്രിയയുടെ പരോക്ഷ കർത്താവ്
  choice: ‘അവൻ ... പറയുന്നു’ എന്നു നൽകി, സന്ദർഭത്തിൽ കർത്താവ് ദൈവമാണെന്ന വ്യക്തിപരമായ തിരുവെഴുത്തുശൈലി നിലനിർത്തി.
  alternative: ‘അതിൽ പറയുന്നു’ എന്ന വ്യക്തിത്വരഹിതമായ citation formula ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിലെ ഏകവചന വ്യക്തിപരമായ ക്രിയ ദൈവത്തിന്റെ വാക്കായുള്ള ഉദ്ധരണിയിലേക്ക് നയിക്കുന്നു; പേര് ചേർത്ത് അർഥം അമിതമായി നിർണ്ണയിക്കാതെ സർവനാമം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ജനം’, ‘വിളിക്കും’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമാക്കി. സ്ത്രീലിംഗ ഏകവചനം ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
