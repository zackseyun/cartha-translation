id: ROM.9.7
reference: Romans 9:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: ml
  text: അബ്രാഹാമിന്റെ സന്തതിയായതുകൊണ്ട് എല്ലാവരും മക്കളാണെന്നുമില്ല.[a] മറിച്ച്, “യിസ്ഹാക്കിൽ നിന്റെ സന്തതി വിളിക്കപ്പെടും.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സന്തതി” എന്നതിന് അക്ഷരാർഥത്തിൽ “വിത്ത്” എന്നും പറയാം. ഗ്രീക്കുപദം ഏകവചനമാണെങ്കിലും സന്തതിയെയോ പിൻതലമുറയെയോ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: “വിളിക്കപ്പെടും” എന്നത് “പേരിടപ്പെടും” എന്നും വിവർത്തനം ചെയ്യാം; സന്ദർഭത്തിൽ “കണക്കാക്കപ്പെടും” അല്ലെങ്കിൽ “തിരിച്ചറിയപ്പെടും” എന്ന അർഥസൂചനയും ഉണ്ടായേക്കാം. ഉല്പത്തി 21:12 കാണുക.
    reason: lexical_alternative_cross_reference
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: ആയതുകൊണ്ടുമാത്രം ... ആകുന്നില്ല
  rationale: οὐδέ മുൻവാക്യത്തിലെ നിഷേധത്തോട് ഈ വാക്യത്തെ ബന്ധിപ്പിക്കുന്നു; ὅτι കാരണബന്ധം നൽകുന്നു. മലയാളത്തിൽ ‘കൊണ്ടുമാത്രം ... ഇല്ല’ എന്ന ഘടന വാദത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σπέρμα Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ സന്തതി
  rationale: σπέρμα ഏകവചനരൂപത്തിലാണെങ്കിലും കൂട്ടാർഥത്തിൽ സന്തതിയെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു. ‘സന്തതി’ ഈ കൂട്ടാർഥവും ഉദ്ധരണിയുമായുള്ള പദബന്ധവും നിലനിർത്തുന്നു.
- source_word: πάντες τέκνα
  choice: എല്ലാവരും മക്കൾ
  rationale: τέκνα ലിംഗഭേദമില്ലാത്ത ‘മക്കൾ’ എന്നാണ്; ഗ്രീക്കിലെ ക്രിയാരഹിതമായ വിധേയഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയയോടെ നൽകിയിരിക്കുന്നു.
- source_word: ἀλλ’
  choice: മറിച്ച്
  rationale: മുൻധാരണയെ തിരുത്തുന്ന ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: Ἐν Ἰσαὰκ
  choice: യിസ്ഹാക്കിൽ
  rationale: ἐν എന്ന പദത്തിന്റെ ഔപചാരിക രൂപവും ഉല്പത്തി 21:12-ലെ ഉദ്ധരണിയുടെ ഭാഷയും സംരക്ഷിക്കുന്നു; വംശപരമ്പര യിസ്ഹാക്കിൽ നിർണ്ണയിക്കപ്പെടുന്നു എന്ന സന്ദർഭാർഥം വായനക്കാരന് ലഭ്യമാണ്.
- source_word: κληθήσεταί
  choice: വിളിക്കപ്പെടും
  rationale: καλέω എന്ന ക്രിയയുടെ ഭാവികാല കർമണി രൂപത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു. ‘കണക്കാക്കപ്പെടും’ എന്ന വ്യാഖ്യാനാത്മക അർഥം മുഖ്യവാചകത്തിൽ മുൻകൂട്ടി ഉറപ്പിക്കുന്നില്ല.
- source_word: σοι σπέρμα
  choice: നിനക്കുള്ള സന്തതി
  rationale: σοι എന്ന ദത്തിവിഭക്തിയുടെ ബന്ധാർഥം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുകയും σπέρμαയുടെ കൂട്ട ഏകവചന സ്വഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ശാരീരിക വംശബന്ധവും മക്കളെന്ന നിലയും തമ്മിലുള്ള ബന്ധം
  choice: അബ്രാഹാമിന്റെ സന്തതിയായിരിക്കുക മാത്രം എല്ലാവരെയും മക്കളാക്കുന്നില്ലെന്ന വ്യത്യാസം നിലനിർത്തുന്നു.
  alternative: പിന്നീടുള്ള വാദത്തിൽ നിന്നുള്ള തിരഞ്ഞെടുപ്പ് സിദ്ധാന്തം ഇവിടെ തന്നെ വിശദമായി ചേർക്കുക; അല്ലെങ്കിൽ വ്യത്യാസത്തെ വെറും ജാതീയമായി ചുരുക്കുക.
  rationale: വാക്യം ജൈവവംശത്തെയും ദൈവവാഗ്ദാനത്തിൽ തിരിച്ചറിയപ്പെടുന്ന സന്തതിയെയും വേർതിരിക്കുന്നു; ആ വ്യത്യാസത്തിന്റെ സമ്പൂർണ ദൈവശാസ്ത്ര വിശദീകരണം ഈ വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: ഉല്പത്തി ഉദ്ധരണിയിലെ κληθήσεταί എന്നതിന്റെ ബലം
  choice: വിളിക്കപ്പെടും
  alternative: കണക്കാക്കപ്പെടും / നിർണ്ണയിക്കപ്പെടും
  rationale: മൂലത്തിലെ വിളിക്കൽ/പേരിടൽ ഭാഷ സംരക്ഷിച്ച്, സന്ദർഭത്തിൽ സാധ്യമായ ‘കണക്കാക്കപ്പെടുക’ എന്ന വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘സന്തതി’ എന്ന ബൈബിൾപരിചിത പദം മൂലത്തിലെ കൂട്ട ഏകവചനവും വാക്യത്തിനുള്ളിലെ ആവർത്തനവും സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; വ്യാഖ്യാനാത്മകമായ ദൈവശാസ്ത്ര പദങ്ങൾ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി.
