revisions:
- from: അബ്രാഹാമിന്റെ സന്തതിയായതുകൊണ്ടുമാത്രം എല്ലാവരും മക്കളാകുന്നില്ല. മറിച്ച്, “യിസ്ഹാക്കിൽ നിനക്കുള്ള സന്തതി വിളിക്കപ്പെടും.”[a][b]
  to: അബ്രാഹാമിന്റെ സന്തതിയായതുകൊണ്ട് എല്ലാവരും മക്കളാണെന്നുമില്ല.[a] മറിച്ച്, “യിസ്ഹാക്കിൽ നിന്റെ സന്തതി വിളിക്കപ്പെടും.”[b]
  rationale: The revision restores the additional negation expressed by οὐδέ without overtranslating it, removes the added restrictive emphasis of ‘മാത്രം,’ and retains the source's ambiguity concerning the status of Abraham's offspring. It also places the lexical footnote at the first relevant term and narrows the κληθήσεται alternatives to meanings supportable by the wording and context.
