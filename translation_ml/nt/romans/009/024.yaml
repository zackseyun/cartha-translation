  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: ml
  text: അതായത്, അവൻ വിളിച്ചവരായ നമ്മെത്തന്നെ—യെഹൂദരിൽനിന്നു മാത്രമല്ല, ജനതകളിൽനിന്നു കൂടിയും—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: നമ്മെത്തന്നെ ... നമ്മെ
  rationale: οὓς എന്ന ബന്ധസർവനാമവും അതിനെ വിശദീകരിക്കുന്ന ἡμᾶς എന്ന പദവും മുൻവാക്യത്തിലെ കരുണാപാത്രങ്ങളുമായി ബന്ധിപ്പിക്കുന്നു. മലയാളത്തിലെ സ്വാഭാവികതയ്ക്കായി മുൻപിൽ ഊന്നൽ നൽകി, പിന്നെ ബന്ധം വ്യക്തമാക്കുന്ന രീതിയിൽ ആവർത്തിച്ചു.
- source_word: καὶ ἐκάλεσεν
  choice: അവൻ വിളിച്ച
  rationale: καλέω എന്ന പൗലോസിന്റെ പ്രാധാന്യമുള്ള പ്രയോഗത്തിന് ‘വിളിച്ചു’ എന്നത് സ്വാഭാവികവും ദൈവശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി വിശദീകരിക്കാത്തതുമായ തുല്യപദമാണ്. καίയുടെ ചേർക്കൽഭാവം വാക്യഘടനയിലും ‘അതായത്’ എന്ന ബന്ധപ്രയോഗത്തിലും പ്രതിഫലിക്കുന്നു.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: മാത്രമല്ല ... നിന്നും
  rationale: രണ്ടു സമൂഹങ്ങളിൽനിന്നുള്ള ഉൾപ്പെടുത്തലിനെ സമതുലിതമായി പ്രകടിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള ഘടന.
- source_word: ἐξ Ἰουδαίων
  choice: യെഹൂദരിൽനിന്ന്
  rationale: ἐξ ഇവിടെ ഉറവിടമോ സമൂഹത്തിൽനിന്നുള്ള തിരഞ്ഞെടുപ്പോ സൂചിപ്പിക്കുന്നു; Ἰουδαίων ഒരു ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐξ ἐθνῶν
  choice: ജനതകളിൽനിന്ന്
  rationale: ἔθνηയുടെ അടിസ്ഥാന അർഥമായ ‘ജനതകൾ’ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് യെഹൂദരല്ലാത്തവരെ സൂചിപ്പിക്കുന്നുവെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: മുൻവാക്യത്തിലെ ‘കരുണാപാത്രങ്ങൾ’ എന്ന പരാമർശവുമായുള്ള ബന്ധം
  choice: അതായത്, അവൻ വിളിച്ച നമ്മെത്തന്നെ
  alternative: അവൻ വിളിച്ചവരായ നമ്മെ
  rationale: ഗ്രീക്കിലെ οὓς ... ἡμᾶς എന്ന ഊന്നലും മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധവും നിലനിർത്തുന്നു; തിരഞ്ഞെടുപ്പ്/വിളി സംബന്ധിച്ച ദൈവശാസ്ത്രവാദങ്ങളെ അധികമായി തീർപ്പാക്കുന്നില്ല.
- issue: ἐθνῶν എന്നതിന്റെ യെഹൂദ–യെഹൂദേതര സന്ദർഭം
  choice: ജനതകളിൽനിന്ന്
  alternative: യെഹൂദേതരരിൽനിന്ന്
  rationale: മൂലപദത്തിന്റെ ‘ജനതകൾ’ എന്ന രൂപം പ്രധാനവാചകത്തിൽ സംരക്ഷിക്കുകയും, ഈ സന്ദർഭത്തിലെ യെഹൂദേതര അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തെ ആശ്രയിക്കുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നിലനിർത്തി. ‘യെഹൂദർ’ എന്ന പൊതുവായി മനസ്സിലാകുന്ന രൂപവും ‘ജനതകൾ’ എന്ന മൂലസമീപ പദവും ഉപയോഗിച്ചു.
