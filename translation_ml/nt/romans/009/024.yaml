    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “അവൻ വിളിച്ചവരായ നമ്മെ.” മുൻവാക്യത്തിൽ പറഞ്ഞ കരുണാപാത്രങ്ങൾ ‘നാം’ തന്നെയാണെന്ന് പൗലോസ് വ്യക്തമാക്കുന്നു.'
