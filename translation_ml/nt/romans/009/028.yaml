  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: ml
  text: കാരണം, കർത്താവ് ഭൂമിയിൽ തന്റെ വചനം പൂർത്തിയാക്കിയും ചുരുക്കിയും നടപ്പാക്കും.[a][c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘കർത്താവ് ഭൂമിയിൽ കാര്യം/വിധി നടപ്പാക്കും.’'
    reason: lexical_alternative
  - marker: b
    text: ‘ചുരുക്കിയും’ എന്നത് ‘വെട്ടിച്ചുരുക്കിയും’ എന്നോ, ആശയപരമായി ‘വേഗത്തിൽ നടപ്പാക്കിയും’ എന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: c
    text: ചിലർ ἐπὶ τῆς γῆς എന്നത് യെശയ്യാവിലെ ആദ്യസന്ദർഭം പ്രതിഫലിപ്പിച്ച് ‘ദേശത്ത്’ എന്നു വിവർത്തനം ചെയ്യുന്നു; എന്നാൽ റോമർ ലേഖനത്തിലെ ഗ്രീക്ക് ഇവിടെ ‘ഭൂമിയിൽ’ എന്നാണ് വായിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: തന്റെ വചനം
  rationale: കർത്താവ് അരുളിച്ചെയ്തത് അവൻ നടപ്പാക്കുമെന്ന പ്രഖ്യാപനാർഥം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സ്വാഭാവികതയ്ക്കായി ‘തന്റെ’ ചേർത്തിരിക്കുന്നു.
- source_word: γὰρ
  choice: (വാക്യബന്ധത്തിൽ ‘കാരണം’)
  rationale: മുൻവാക്യത്തിനുള്ള വിശദീകരണകാരണം സൂചിപ്പിക്കുന്ന γάρ ഈ ഒറ്റവാക്യ അവതരണത്തിൽ പ്രത്യേകം പ്രകടമാക്കിയിട്ടില്ല; തുടർച്ചയായി വായിക്കുമ്പോൾ ‘കാരണം’ എന്നു നൽകാം.
- source_word: συντελῶν
  choice: പൂർത്തിയാക്കി
  rationale: ഉദ്ദേശിച്ച അന്ത്യത്തിലേക്ക് കൊണ്ടുവന്ന് സമാപിപ്പിക്കുക എന്ന ആശയം നൽകുന്നു.
- source_word: καὶ συντέμνων
  choice: ചുരുക്കുകയും
  rationale: ദൈർഘ്യം കുറയ്ക്കുക/ചുരുക്കുക എന്ന ദൃശ്യാർഥം നിലനിർത്തുന്നു; ‘വേഗത്തിൽ’ എന്ന വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ποιήσει
  choice: നിറവേറ്റും
  rationale: വചനമായി അരുളിച്ചെയ്തത് പ്രാവർത്തികമാക്കുക എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന κύριος എന്ന പദത്തിന്റെ പതിവും ഗൗരവമുള്ളതുമായ മലയാളരൂപം.
- source_word: ἐπὶ τῆς γῆς
  choice: ഭൂമിയിൽ
  rationale: റോമർ ലേഖനത്തിലെ ഗ്രീക്ക് പദപ്രയോഗത്തിന്റെ വിശാലാർഥം നിലനിർത്തുന്നു; യെശയ്യാവിന്റെ ആദ്യസന്ദർഭം മുൻനിർത്തിയുള്ള ‘ദേശത്ത്’ എന്ന ചുരുക്കം മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നില്ല.
theological_decisions:
- issue: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിലെ ദൈവിക പ്രവർത്തിയുടെ സ്വഭാവം
  choice: കർത്താവ് തന്റെ പ്രഖ്യാപിത വചനം നിർണായകമായി പൂർത്തിയാക്കി നടപ്പാക്കുന്നു എന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: കർത്താവ് ന്യായവിധി വേഗത്തിലും നിർണായകമായും നടപ്പാക്കുന്നു; അല്ലെങ്കിൽ തന്റെ രക്ഷാ/ന്യായവിധിപ്രവൃത്തി പൂർത്തിയാക്കി ചുരുക്കുന്നു.
  rationale: പദങ്ങൾക്ക് ന്യായവിധിയുടെ ധ്വനി ഉണ്ടാകാമെങ്കിലും ഗ്രീക്ക് നിർബന്ധിക്കാത്ത പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ അതിലെ അർഥപിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും സാധാരണ വായനക്കാർക്കുള്ള വ്യക്തതയും സംയോജിപ്പിച്ചു. ‘നിറവേറ്റും’ എന്നത് λόγον–ποιήσει ബന്ധം സ്വാഭാവികമായി നൽകുന്നു; ‘ചുരുക്കുകയും’ മൂലത്തിലെ ഉദ്ദേശപൂർവമായ അർഥവ്യാപ്തി സംരക്ഷിക്കുന്നു.
