  terminology: ‘അനീതി’ is the appropriate moral-juridical equivalent here. The alternative ‘നീതിരാഹിത്യം’ is defensible for ἀδικία. The footnote correctly identifies the literal force and emphatic character of μὴ γένοιτο without treating the literal wording as the main translation.
