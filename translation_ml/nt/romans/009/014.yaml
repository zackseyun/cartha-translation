id: ROM.9.14
reference: Romans 9:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: ml
  text: അപ്പോൾ നാം എന്തു പറയും? ദൈവത്തിന്റെ ഭാഗത്ത് അനീതിയുണ്ടോ? ഒരിക്കലുമില്ല![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നീതിരാഹിത്യം.’
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘അങ്ങനെ ഒരിക്കലും സംഭവിക്കാതിരിക്കട്ടെ!’ അതിശക്തമായ ഒരു നിഷേധമാണിത്; ‘ഒരുവിധത്തിലും ഇല്ല!’ എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: അപ്പോൾ നാം എന്തു പറയും?
  rationale: പൗലോസ് ഒരു നിഗമനമോ എതിർവാദമോ അവതരിപ്പിക്കാൻ ഉപയോഗിക്കുന്ന പതിവ് ചോദ്യരൂപമാണിത്. ഭാവികാലത്തിന്റെ ആലോചനാത്മക ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μὴ
  choice: …ഉണ്ടോ?
  rationale: നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ഗ്രീക്ക് ചോദ്യകണത്തിന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായ അലങ്കാരചോദ്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀδικία
  choice: അനീതി
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനങ്ങളിൽ നീതികേടോ പക്ഷപാതമോ ഉണ്ടെന്ന ആരോപണമാണ് സന്ദർഭത്തിൽ നിഷേധിക്കുന്നത്. ‘അനീതി’ അതിന്റെ ധാർമ്മികവും ന്യായപരവുമായ അർഥം ലളിതമായി നൽകുന്നു.
- source_word: παρὰ τῷ θεῷ
  choice: ദൈവത്തിന്റെ ഭാഗത്ത്
  rationale: ദൈവത്തിന്റെ പക്ഷത്തോ പ്രവർത്തനത്തിലോ അനീതി ഉണ്ടോ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമില്ല!
  rationale: പൗലോസിന്റെ അതിശക്തമായ നിഷേധം പുരാതനമോ കൃത്രിമമോ ആയി തോന്നാതെ സമകാലിക മലയാളത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: റോമർ 9-ലെ ദൈവനീതിയെക്കുറിച്ചുള്ള എതിർവാദത്തിന് പ്രത്യേക ദൈവശാസ്ത്രവ്യവസ്ഥ ചേർക്കണമോ എന്നത്
  choice: ദൈവത്തിന്റെ ഭാഗത്ത് അനീതി ഉണ്ടെന്ന ആരോപണവും അതിന്റെ ശക്തമായ നിഷേധവും മാത്രം വിവർത്തനം ചെയ്യുന്നു.
  alternative: ‘ദൈവം അനീതിയുള്ളവനാണോ?’ എന്ന് കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പറയാമായിരുന്നു.
  rationale: ഗ്രീക്ക് പാഠം എതിർവാദവും നിഷേധവും സംക്ഷിപ്തമായി അവതരിപ്പിക്കുന്നു; തിരഞ്ഞെടുപ്പ്, തള്ളിക്കളയൽ, ദൈവിക നീതി എന്നിവയെക്കുറിച്ചുള്ള വിശദീകരണം ഈ വാക്യത്തിൽ ചേർക്കുന്നത് പാഠത്തിന്റെ പരിധി കടക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന ഗൗരവമുള്ള ശൈലി. പൗലോസിന്റെ അലങ്കാരചോദ്യവും ശക്തമായ നിഷേധവും സംക്ഷിപ്തമായി നിലനിർത്തിയിരിക്കുന്നു.
