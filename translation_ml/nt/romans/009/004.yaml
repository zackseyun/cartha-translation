- from: അവർ ഇസ്രായേല്യരാണ്; ദത്തുപുത്രത്വവും[c] മഹത്ത്വവും[b] ഉടമ്പടികളും ന്യായപ്രമാണം നൽകപ്പെട്ടതും ആരാധനയും[d] വാഗ്ദാനങ്ങളും അവർക്കുള്ളവയാണ്.[a]
  to: അവർ ഇസ്രായേല്യരാണ്; ദത്തുപുത്രത്വവും[c] മഹിമയും[b] ഉടമ്പടികളും ന്യായപ്രമാണദാനവും ആരാധനയും[d] വാഗ്ദാനങ്ങളും അവർക്കുള്ളവയാണ്.[a]
  rationale: 'The revision makes two safe lexical improvements: ‘മഹിമ’ more accurately renders δόξα in this biblical context, and ‘ന്യായപ്രമാണദാനം’ naturally renders νομοθεσία while retaining its eventive sense. The possessive syntax, ambiguity of ‘the glory,’ and the scope of λατρεία remain unexpanded in the main text. Footnote a is recast as a genuine possessive alternative rather than a misleadingly broad literalization.'
