  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: ml
  text: അവർ ഇസ്രായേല്യരാണ്; ദത്തുപുത്രത്വവും[c] മഹിമയും[b] ഉടമ്പടികളും ന്യായപ്രമാണദാനവും ആരാധനയും[d] വാഗ്ദാനങ്ങളും അവർക്കുള്ളവയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദത്തുപുത്രത്വവും മഹിമയും ഉടമ്പടികളും ന്യായപ്രമാണദാനവും ആരാധനയും വാഗ്ദാനങ്ങളും അവരുടേതാണ്.’
    reason: lexical_alternative
  - marker: b
    text: ‘മഹിമ’ എന്നത് ഇസ്രായേലിന്റെ മധ്യേ വെളിപ്പെട്ട ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: cross_reference
  - marker: c
    text: അഥവാ, ‘പുത്രസ്ഥാനം’ അല്ലെങ്കിൽ ‘പുത്രന്മാരായി ദത്തെടുക്കൽ.’
    reason: lexical_alternative
  - marker: d
    text: അതായത്, ദൈവസന്നിധിയിൽ ഇസ്രായേലിനു നിയമിക്കപ്പെട്ട ഉടമ്പടിപരമായ ആരാധനയും സേവനവും.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: അവർ ഇസ്രായേല്യരാണ്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പൗലോസിന്റെ ബന്ധുജനത്തെ വിശദീകരിക്കുന്ന ബന്ധവാക്യത്തിന്റെ തിരിച്ചറിയൽശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὧν
  choice: അവർക്കുള്ളവയാണ്
  rationale: ജനിറ്റീവ് ബന്ധസർവനാമത്തിന്റെ ഉടമസ്ഥതാസൂചന വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: υἱοθεσία
  choice: ദത്തുപുത്രത്വം
  rationale: ദൈവജനമായ ഇസ്രായേലിന്റെ പുത്രസ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; വ്യക്തിഗത രക്ഷാശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: δόξα
  choice: മഹത്ത്വം
  rationale: ഗ്രീക്കിലെ സാന്ദ്രവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ പദം മുഖ്യവാചകത്തിൽ വിശദീകരിച്ചു ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: διαθῆκαι
  choice: ഉടമ്പടികൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനം കൃത്യമായി നിലനിർത്തുകയും ബൈബിൾപരമായ ഉടമ്പടി ആശയം വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: νομοθεσία
  choice: ന്യായപ്രമാണം നൽകപ്പെട്ടത്
  rationale: പദം ന്യായപ്രമാണത്തെ മാത്രമല്ല, അതിന്റെ നൽകലിനെയും സൂചിപ്പിക്കുന്നതിനാൽ ആ സംഭവാത്മക അർഥം സംരക്ഷിക്കുന്നു.
- source_word: λατρεία
  choice: ആരാധന
  rationale: ദൈവത്തോടുള്ള ഇസ്രായേലിന്റെ നിയമിതമായ ആരാധനയും സേവനവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐπαγγελίαι
  choice: വാഗ്ദാനങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ദൈവം ഇസ്രായേലിനു നൽകിയ വാഗ്ദാനങ്ങളെന്ന അർഥവും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: υἱοθεσία എന്ന പദം ഇസ്രായേലുമായി ബന്ധപ്പെട്ട് സൂചിപ്പിക്കുന്നത്
  choice: ദത്തുപുത്രത്വം
  alternative: പുത്രസ്ഥാനം; പുത്രന്മാരായി ദത്തെടുക്കൽ
  rationale: ഇവിടെ ഇസ്രായേൽ ജനതയ്ക്കുള്ള ചരിത്രപരവും ഉടമ്പടിപരവുമായ പുത്രസ്ഥാനമാണ് പട്ടികപ്പെടുത്തുന്നത്. രൂപകം നിലനിർത്തുകയും അതിന്റെ പരിധി മുഖ്യവാചകത്തിൽ അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ἡ δόξα എന്നതിന്റെ സൂചന
  choice: മഹത്ത്വം
  alternative: ദൈവിക മഹത്ത്വം; മഹത്ത്വപൂർണമായ ദൈവസാന്നിധ്യം
  rationale: ഇത് ഇസ്രായേലിന്റെ മധ്യേ വെളിപ്പെട്ട ദൈവസാന്നിധ്യത്തെ സൂചിപ്പിക്കാൻ സാധ്യതയുണ്ടെങ്കിലും, ഗ്രീക്ക് വാചകം ‘മഹത്ത്വം’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ മുഖ്യവാചകം ആ സാന്ദ്രത നിലനിർത്തുന്നു.
- issue: λατρεία എന്നതിന്റെ വ്യാപ്തി
  choice: ആരാധന
  alternative: ആരാധനാശുശ്രൂഷ; ദൈവസേവനം
  rationale: ഇസ്രായേലിനു നിയമിക്കപ്പെട്ട ഉടമ്പടിപരമായ ആരാധനയെ സൂചിപ്പിക്കുന്നു; ‘ദേവാലയശുശ്രൂഷ’ എന്നു പറഞ്ഞ് പദത്തിന്റെ പരിധി അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. പട്ടികയുടെ ആവർത്തനഘടന സംരക്ഷിച്ചിരിക്കുന്നു. ‘ന്യായപ്രമാണം’, ‘ഉടമ്പടി’, ‘ദത്തുപുത്രത്വം’ തുടങ്ങിയ സ്ഥാപിത ബൈബിൾപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ ഉപയോഗിച്ചു.
