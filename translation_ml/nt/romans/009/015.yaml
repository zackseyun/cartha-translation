reference: Romans 9:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: ml
  text: 'എന്തെന്നാൽ, അവൻ മോശയോടു പറയുന്നു: “ഞാൻ ആരോടു കരുണ കാണിക്കുന്നുവോ, അവനോടു കരുണ കാണിക്കും; ഞാൻ ആരോടു മനസ്സലിവ് കാണിക്കുന്നുവോ, അവനോടു മനസ്സലിവ് കാണിക്കും.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “ഞാൻ ആരോടു കരുണ ചെയ്യുന്നുവോ, അവനോടു കരുണ ചെയ്യും; ഞാൻ ആരോടു കനിവു കാണിക്കുന്നുവോ, അവനോടു കനിവു കാണിക്കും.”'
    reason: lexical_alternative
  - marker: b
    text: പുറപ്പാട് 33:19-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: മോശയോട്
  rationale: λέγει എന്ന ക്രിയയോടൊപ്പമുള്ള ദത്തിവ് പരോക്ഷ കർമത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മോശയോട്’ സ്വാഭാവികമാണ്.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്ക് വിശദീകരണാധാരം നൽകുന്ന ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: λέγει
  choice: അവൻ ... പറയുന്നു
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല ഉദ്ധരണിസൂത്രം നിലനിർത്തുന്നു. പുറപ്പാട് 33:19-ലെ പശ്ചാത്തലത്തിൽ പരോക്ഷ കർത്താവ് ദൈവമാണ്; എന്നാൽ ഗ്രീക്കിൽ പേര് തുറന്നുപറയാത്തതിനാൽ മലയാളത്തിലും ‘അവൻ’ എന്നു വെച്ചു.
- source_word: ἐλεέω (Ἐλεήσω / ἐλεῶ)
  choice: കരുണ കാണിക്കും / കരുണ കാണിക്കുന്നുവോ
  rationale: ഒരേ ഗ്രീക്ക് ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുകയും ദൈവിക കരുണയുടെ അർഥം സ്വാഭാവികമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: ὃν ἂν
  choice: ആരോട് ... അവനോട്
  rationale: അനിശ്ചിതമായ ബന്ധസർവനാമപ്രയോഗത്തെ മലയാളത്തിലെ സ്വാഭാവികമായ ബന്ധ–അനുബന്ധ ഘടനയിൽ അവതരിപ്പിക്കുന്നു; ‘തിരഞ്ഞെടുക്കുന്നു’ പോലുള്ള വ്യാഖ്യാനപദം ചേർത്തിട്ടില്ല.
- source_word: οἰκτίρω (οἰκτιρήσω / οἰκτίρω)
  choice: മനസ്സലിവ് കാണിക്കും / മനസ്സലിവ് കാണിക്കുന്നുവോ
  rationale: ἐλεέω എന്നതിന് ഉപയോഗിച്ച ‘കരുണ’യിൽനിന്നുള്ള പദവ്യത്യാസം കാത്തുകൊണ്ട് സഹാനുഭൂതിപൂർണമായ ദയയെ സൂചിപ്പിക്കുന്നു; ആവർത്തനവും സമാന്തരഘടനയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ സംസാരിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ‘അവൻ ... പറയുന്നു’ എന്ന് വ്യക്തിപരമായി പരിഭാഷപ്പെടുത്തി
  alternative: ‘തിരുവെഴുത്ത് മോശയോടു പറയുന്നു’ എന്ന നിർവ്യക്തമായ അവതരണം
  rationale: ഗ്രീക്കിൽ കർത്താവ് തുറന്നുപറയുന്നില്ലെങ്കിലും പുറപ്പാട് 33:19-ൽ സംസാരിക്കുന്നത് ദൈവമാണ്. എന്നിരുന്നാലും ‘ദൈവം’ എന്ന നാമം പാഠത്തിൽ ചേർക്കാതെ സർവനാമം ഉപയോഗിക്കുന്നത് ഉറവിടത്തിന്റെ സംക്ഷിപ്തതയും പശ്ചാത്തലസൂചനയും ഒരുമിച്ച് കാക്കുന്നു.
- issue: കരുണയും മനസ്സലിവും സംബന്ധിച്ച ദൈവിക സ്വാതന്ത്ര്യം
  choice: മൂലത്തിലെ ആവർത്തനാത്മകമായ പ്രസ്താവന വിശദീകരിക്കാതെ അതേപടി നിലനിർത്തി
  alternative: ‘ഞാൻ തിരഞ്ഞെടുക്കുന്നവനോടു കരുണ കാണിക്കും’ എന്ന വിശദീകരണപരമായ പരിഭാഷ
  rationale: ‘തിരഞ്ഞെടുക്കുക’ എന്ന പദം ഗ്രീക്കിൽ ഇല്ല. തിരഞ്ഞെടുപ്പിനെയും കരുണയെയും സംബന്ധിച്ച ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ മുൻകൂട്ടി തീർപ്പാക്കാതെ പാഠത്തിന്റെ ആവർത്തനവും തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘കരുണ’യും ‘മനസ്സലിവ്’യും ഉപയോഗിച്ച് രണ്ടു ഗ്രീക്ക് ക്രിയകളുടെ അർഥസാമീപ്യവും പദവ്യത്യാസവും ഒരുപോലെ കാത്തു. മൂലത്തിലെ സമാന്തര ആവർത്തനം ചുരുക്കുകയോ വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുകയോ ചെയ്തിട്ടില്ല.
