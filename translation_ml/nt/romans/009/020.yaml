id: ROM.9.20
reference: Romans 9:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: ml
  text: എന്നാൽ[a], മനുഷ്യാ, ദൈവത്തോടു മറുത്തുപറയാൻ നീ ആരാണ്? രൂപം ലഭിച്ചതു അതിനു രൂപം നൽകിയവനോട്, “എന്തിനാണ് നീ എന്നെ ഇങ്ങനെ ഉണ്ടാക്കിയത്?” എന്നു പറയുമോ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മറിച്ച്’ എന്നും പരിഭാഷപ്പെടുത്താം; ഗ്രീക്കിലെ μενοῦνγε മുൻവാക്കിനോടുള്ള ശക്തമായ തിരുത്തലോ എതിർതിരിവോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള ശക്തമായ എതിർതിരിവും തിരുത്തലിന്റെ ഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; ‘മറിച്ച്’ എന്നതും സാധ്യമാണ്.
- source_word: ὦ ἄνθρωπε
  choice: മനുഷ്യാ
  rationale: നേരിട്ടുള്ള ഏകവചന സംബോധനയും മുഴുവൻ മനുഷ്യരാശിയെയും പ്രതിനിധീകരിക്കുന്ന പ്രയോഗവും മലയാളത്തിൽ ലിംഗനിരപേക്ഷമായി സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σὺ τίς εἶ
  choice: നീ ആരാണ്?
  rationale: വെറും വ്യക്തിത്വാന്വേഷണമല്ല, ചോദ്യംചെയ്യുന്നവന്റെ അധികാരത്തെ വെല്ലുവിളിക്കുന്ന മൂർച്ചയുള്ള ആലങ്കാരിക ചോദ്യം നിലനിർത്തുന്നു.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: ദൈവത്തോടു മറുത്തു പറയാൻ
  rationale: ἀνταποκρίνομαι എന്നതിലെ എതിർത്തുപറയുക, തിരിച്ചുവാദിക്കുക എന്ന ഭാവം ‘മറുത്തു പറയുക’ വ്യക്തമായി നൽകുന്നു; നിഷ്പക്ഷമായ ‘മറുപടി പറയുക’ എന്നതിനെ ഒഴിവാക്കുന്നു.
- source_word: μὴ ἐρεῖ
  choice: എന്നു പറയുമോ?
  rationale: μή സഹിതമുള്ള ചോദ്യം ഇല്ല എന്ന ഉത്തരം പ്രതീക്ഷിക്കുന്നു. മലയാളത്തിലെ ‘പറയുമോ?’ എന്ന ആലങ്കാരിക രൂപം ആ പ്രതീക്ഷ സന്ദർഭത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸ πλάσμα
  choice: രൂപപ്പെടുത്തപ്പെട്ടത്
  rationale: രൂപം നൽകപ്പെട്ട വസ്തുവിനെയും രൂപം നൽകിയവനെയും തമ്മിലുള്ള പദബന്ധം നിലനിർത്തുന്നു.
- source_word: τῷ πλάσαντι
  choice: തന്നെ രൂപപ്പെടുത്തിയവനോട്
  rationale: πλάσμα–πλάσαντι എന്ന ഗ്രീക്ക് പദപ്രതിധ്വനി ‘രൂപപ്പെടുത്തപ്പെട്ടത്–രൂപപ്പെടുത്തിയവൻ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു; ‘തന്നെ’ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: Τί με ἐποίησας οὕτως;
  choice: എന്തിനാണ് നീ എന്നെ ഇങ്ങനെ ഉണ്ടാക്കിയത്?
  rationale: ‘എന്തുകൊണ്ട്/എന്തിന് നീ എന്നെ ഇങ്ങനെ ഉണ്ടാക്കി?’ എന്ന മൂലവാക്യത്തിന്റെ അർഥം സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἄνθρωπε എന്ന സംബോധനയുടെ പ്രതിനിധാനസ്വഭാവം
  choice: ‘മനുഷ്യാ’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘പുരുഷാ’ അല്ലെങ്കിൽ ‘മനുഷ്യനേ’
  rationale: ഇവിടെ ഒരു പുരുഷനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നില്ല; ദൈവത്തെ ചോദ്യംചെയ്യുന്ന മനുഷ്യനെ മനുഷ്യരാശിയുടെ പ്രതിനിധിയായി ഏകവചനത്തിൽ അഭിസംബോധന ചെയ്യുന്നു. ‘മനുഷ്യാ’ ആ വ്യാപ്തിയും വാക്യത്തിന്റെ മൂർച്ചയും നിലനിർത്തുന്നു.
- issue: പൗലോസിന്റെ ശാസനാത്മകമായ ആലങ്കാരിക ചോദ്യം
  choice: ‘ദൈവത്തോടു മറുത്തു പറയാൻ നീ ആരാണ്?’
  alternative: ‘ദൈവത്തോടു മറുപടി പറയാൻ നീ ആരാണ്?’
  rationale: വാക്യം ദൈവത്തോടുള്ള സാധാരണ മറുപടിയെ കുറ്റപ്പെടുത്തുന്നില്ല; സൃഷ്ടി സ്രഷ്ടാവിനെ എതിർത്തു ചോദ്യംചെയ്യുന്നതിലെ അനൗചിത്യം ചൂണ്ടിക്കാണിക്കുന്നു. അതിനാൽ ‘മറുത്തു പറയുക’ എന്ന മൂർച്ച നിലനിർത്തി.
- issue: സൃഷ്ടിക്കപ്പെട്ടതും രൂപപ്പെടുത്തിയവനും തമ്മിലുള്ള ഉപമ
  choice: ‘രൂപപ്പെടുത്തപ്പെട്ടത്—രൂപപ്പെടുത്തിയവൻ’ എന്ന സമാന്തര പദപ്രയോഗം നിലനിർത്തി
  alternative: ‘സൃഷ്ടി—സ്രഷ്ടാവ്’
  rationale: ‘സൃഷ്ടി—സ്രഷ്ടാവ്’ ദൈവശാസ്ത്രപരമായി ശരിയായ ആശയം നൽകുമെങ്കിലും, πλάσμα/πλάσαντι എന്നതിലെ രൂപപ്പെടുത്തൽ അഥവാ വാർത്തെടുക്കൽ എന്ന ദൃശ്യോപമയെ കൂടുതൽ പൊതുവാക്കും. മൂലത്തിലെ രൂപകവും അസമത്വവും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മനുഷ്യാ’ എന്ന നേരിട്ടുള്ള സംബോധന പൗലോസിന്റെ ആലങ്കാരിക മൂർച്ച നിലനിർത്തുന്നു. ‘രൂപപ്പെടുത്തപ്പെട്ടത്—രൂപപ്പെടുത്തിയവൻ’ എന്ന ആവർത്തനം ഉദ്ദേശപൂർവം സൂക്ഷിച്ചിരിക്കുന്നു.
