id: ROM.9.1
reference: Romans 9:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: ml
  text: ഞാൻ മശീഹയിൽ സത്യം പറയുന്നു; ഞാൻ കള്ളം പറയുന്നില്ല. പരിശുദ്ധാത്മാവിൽ എന്റെ മനസ്സാക്ഷിയും എന്നോടൊപ്പം സാക്ഷ്യം വഹിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’ Χριστός എന്ന ഗ്രീക്ക് പദം ‘മശീഹ’ എന്ന പദവിയായോ ‘ക്രിസ്തു’ എന്ന പേരുപോലുള്ള പ്രയോഗമായോ വരാം; ഇവിടെ പദവിയായി പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: ‘എന്റെ മനസ്സാക്ഷി എന്നോടൊപ്പം സാക്ഷ്യം വഹിക്കുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘പരിശുദ്ധാത്മാവിൽ’ എന്നത് ‘വിശുദ്ധമായ ഒരു ആത്മാവിൽ’ എന്നും വ്യാകരണപരമായി വായിക്കാനാകുമെങ്കിലും, പൗലോസിന്റെ പ്രയോഗത്തിൽ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സ്വാഭാവികം.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: ഞാൻ സത്യം പറയുന്നു
  rationale: λέγω എന്ന ക്രിയയോടുകൂടിയ ἀλήθειαν എന്ന പ്രയോഗം ‘സത്യമായി സംസാരിക്കുന്നു’ എന്ന അർഥമുള്ള ഗ്രീക്ക് പ്രയോഗമാണ്. മലയാളത്തിൽ ‘ഞാൻ സത്യം പറയുന്നു’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: Χριστός അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്. പൗലോസിന്റെ പ്രസ്താവന മശീഹയുമായുള്ള ബന്ധത്തിൽ നടത്തുന്നതായി ἐν എന്നത് സൂചിപ്പിക്കുന്നു; അതിനാൽ അതിന്റെ പദവിസ്വഭാവം നിലനിർത്തി.
- source_word: οὐ ψεύδομαι
  choice: ഞാൻ കള്ളം പറയുന്നില്ല
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള നിഷേധം ലളിതവും ആധുനികവുമായ മലയാളത്തിൽ നൽകി.
- source_word: συμμαρτυρούσης μοι
  choice: എന്നോടൊപ്പം സാക്ഷ്യം വഹിക്കുന്നു
  rationale: συν- എന്ന ഉപസർഗത്തിലെ ‘കൂടെ/ഒപ്പം’ എന്ന ആശയം നിലനിർത്തുന്നു. ഗ്രീക്കിലെ genitive absolute മലയാളത്തിൽ സ്വാഭാവികമായ ഒരു സമാന്തര പ്രസ്താവനയായി അവതരിപ്പിച്ചു.
- source_word: τῆς συνειδήσεώς μου
  choice: എന്റെ മനസ്സാക്ഷി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ συνείδησις എന്നതിന് സാധാരണവും വ്യക്തവുമായ മലയാളസമാനപദം.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിൽ
  rationale: പൗലോസിന്റെ ഭാഷയിൽ ഇത് ഏറ്റവും സ്വാഭാവികമായി ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു. ἐν എന്ന മുൻപ്രത്യയത്തെ ‘മുഖാന്തരം’ എന്നു ഉപകരണാർഥത്തിൽ അതിവ്യാഖ്യാനിക്കാതെ ‘-യിൽ’ എന്നു നിലനിർത്തി.
theological_decisions:
- issue: πνεύματι ἁγίῳ എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ദൈവത്തിന്റെ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ നൽകി
  alternative: ‘വിശുദ്ധമായ ഒരു ആത്മാവിൽ’ അല്ലെങ്കിൽ പൗലോസിന്റെ വിശുദ്ധീകരിക്കപ്പെട്ട മാനുഷിക ആത്മാവിൽ
  rationale: പൗലോസിന്റെ സാധാരണ പ്രയോഗവും ഈ ഗൗരവമുള്ള സത്യപ്രസ്താവനയുടെ പശ്ചാത്തലവും പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചനയെന്ന് കാണിക്കുന്നു; എങ്കിലും ഗ്രീക്കിലെ വ്യാകരണപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- issue: Χριστός എന്നതിന്റെ പദവിസ്വഭാവം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവിയായ അർഥം പ്രകടമാക്കാൻ ‘മശീഹ’ ഉപയോഗിച്ചു; മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിന്റെ ആവർത്തനാത്മക ഊന്നൽ നിലനിർത്താൻ ‘സത്യം പറയുന്നു; ... കള്ളം പറയുന്നില്ല’ എന്ന് നൽകി. വാക്യത്തിന്റെ അവസാനത്തിലെ കോമ തുടർവാക്യബന്ധത്തിന്റെ ഭാഗമായതിനാൽ ഈ ഒറ്റവാക്യ പ്രസിദ്ധീകരണത്തിൽ പൂർണവിരാമമാക്കി.
