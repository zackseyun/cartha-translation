revisions:
- from: എന്നാൽ ദൈവത്തിന്റെ വചനം പരാജയപ്പെട്ടുപോയി എന്നല്ല. കാരണം, ഇസ്രായേലിൽനിന്നുള്ളവരെല്ലാം[a] ഇസ്രായേൽ അല്ല.[b]
  to: എന്നാൽ, ദൈവത്തിന്റെ വചനം നിഷ്ഫലമായിപ്പോയി എന്നല്ല. കാരണം, ഇസ്രായേലിൽ നിന്നുള്ളവരെല്ലാം[a] ഇസ്രായേൽ അല്ല.[b]
  rationale: The main text retains the Greek’s compact contrast and leaves the theological scope of the second occurrence of ‘Israel’ unresolved. The revised verb is idiomatic Malayalam for God’s word not having become ineffective, and the revised note explains the contrast without imposing a denominational interpretation.
