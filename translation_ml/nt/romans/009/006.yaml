id: ROM.9.6
reference: Romans 9:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: ml
  text: എന്നാൽ, ദൈവത്തിന്റെ വചനം നിഷ്ഫലമായിപ്പോയി എന്നല്ല. കാരണം, ഇസ്രായേലിൽ നിന്നുള്ളവരെല്ലാം[a] ഇസ്രായേൽ അല്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഇസ്രായേലിന്റെ വംശത്തിൽപ്പെട്ടവരെല്ലാം.’ ഗ്രീക്കുപ്രയോഗം ഉത്ഭവത്തെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ആദ്യത്തെ ‘ഇസ്രായേൽ’ ഇസ്രായേലിൽനിന്നുള്ള ഉത്ഭവത്തെയോ വംശപരമ്പരയെയോ സൂചിപ്പിക്കുന്നു; രണ്ടാമത്തെ ‘ഇസ്രായേൽ’ എന്ന പ്രയോഗത്തെ പൗലോസ് അതിൽനിന്ന് വേർതിരിക്കുന്നു. ആ വ്യത്യാസത്തിന്റെ കൃത്യമായ വ്യാപ്തി ഈ വാക്യത്തിൽ വ്യക്തമാക്കുന്നില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: എന്നാൽ ... എന്നല്ല
  rationale: മുമ്പുള്ള വിലാപത്തിൽനിന്ന് ഉണ്ടായേക്കാവുന്ന ഒരു നിഗമനത്തെ തിരുത്തുന്ന നിഷേധപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐκπέπτωκεν
  choice: പരാജയപ്പെട്ടുപോയി
  rationale: മുൻപ് സംഭവിച്ചതിന്റെ ഫലം ഇപ്പോഴും നിലനിൽക്കുന്നു എന്ന പൂർണ്ണകാലഭാവവും, ദൈവവചനം ഫലശൂന്യമായിട്ടില്ല എന്ന സന്ദർഭാർഥവും പ്രകടമാക്കുന്നു.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വചനം
  rationale: λόγος എന്നതിനെ ‘വാഗ്ദാനം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ, അതിന്റെ വിശാലവും ഔപചാരികവുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: οὐ γὰρ πάντες
  choice: കാരണം ... എല്ലാവരും ... അല്ല
  rationale: γάρ മുൻവാക്യത്തിലെ നിഷേധത്തിനുള്ള വിശദീകരണം നൽകുന്നതിനാൽ ‘കാരണം’ യുക്തിബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: ഇസ്രായേലിൽനിന്നുള്ളവർ
  rationale: ἐξ സൂചിപ്പിക്കുന്ന ഉത്ഭവമോ വംശപരമ്പരയോ പ്രധാനവാചകത്തിൽ അമിതമായി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: οὗτοι Ἰσραήλ
  choice: ഇസ്രായേൽ അല്ല
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്ത സമീകരണവാക്യത്തിന്റെ തീവ്രത കാത്തുസൂക്ഷിക്കുകയും ‘ഇസ്രായേൽ’ എന്ന രണ്ടു പ്രയോഗങ്ങൾക്കിടയിലെ വ്യത്യാസം തുറന്ന നിലയിൽ വിടുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേൽ’ എന്ന രണ്ടാമത്തെ പ്രയോഗത്തിന്റെ അർഥം
  choice: ആദ്യത്തെ പ്രയോഗത്തെക്കാൾ ഇടുങ്ങിയ ഉടമ്പടിപരമായ/ദൈവശാസ്ത്രപരമായ അർഥം സൂചിപ്പിക്കുന്നതായി പ്രധാനവാചകം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തി.
  alternative: വംശീയ ഇസ്രായേലിനുള്ളിലെ തിരഞ്ഞെടുക്കപ്പെട്ടവർ; അല്ലെങ്കിൽ കൂടുതൽ വിശാലമായ അർഥത്തിൽ ദൈവത്തിന്റെ യഥാർഥ ജനം.
  rationale: പൗലോസ് ശാരീരിക വംശപരമ്പരയും ദൈവത്തിന്റെ രക്ഷാപദ്ധതിയിൽ ‘ഇസ്രായേൽ’ എന്നതിന്റെ പൂർണ അർഥവും തമ്മിൽ വ്യത്യാസപ്പെടുത്തുന്നു. എന്നാൽ അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി ഈ വാക്യത്തിൽ നിർണ്ണയിക്കാതെ വയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ദൈവത്തിന്റെ വചനം’ എന്ന ഔപചാരിക പ്രയോഗം നിലനിർത്തി; വംശപരമ്പരയെക്കുറിച്ചുള്ള വ്യക്തീകരണം അടിക്കുറിപ്പിലാക്കി; ദൈവശാസ്ത്രപരമായ സംഘർഷം പ്രധാനവാചകത്തിൽ പരിഹരിച്ചിട്ടില്ല.
