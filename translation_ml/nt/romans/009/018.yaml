  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: ml
  text: ആകയാൽ, ദൈവം താൻ ഇച്ഛിക്കുന്നവനോടു കരുണ കാണിക്കുന്നു[a]; താൻ ഇച്ഛിക്കുന്നവനെ കഠിനനാക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കരുണ ചെയ്യുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കഠിനനാക്കുന്നു’ എന്നതിന് ‘ദുശ്ശാഠ്യമുള്ളവനാക്കുന്നു’ എന്ന അർഥവും ഉണ്ട്. ഗ്രീക്കിൽ ഇത് സജീവക്രിയയാണ്; വെറും ‘കഠിനനാകാൻ അനുവദിക്കുന്നു’ എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ആകയാൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന രണ്ടു ഗ്രീക്ക് അവ്യയങ്ങളുടെയും സംയുക്തമായ അനുമാനശക്തി സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ὃν θέλει
  choice: താൻ ഇച്ഛിക്കുന്നവനോട് / താൻ ഇച്ഛിക്കുന്നവനെ
  rationale: θέλει ദൈവത്തിന്റെ ഇച്ഛയെ നേരിട്ട് പ്രസ്താവിക്കുന്നു. രണ്ടു ഉപവാക്യങ്ങളിലും ഒരേ പ്രയോഗം ആവർത്തിച്ച് ഗ്രീക്കിലെ സമാന്തരഘടന നിലനിർത്തുന്നു; വിഭക്തിവ്യത്യാസം മലയാളക്രിയകളുടെ സ്വാഭാവിക പ്രയോഗത്തിനനുസരിച്ചുള്ളതാണ്.
- source_word: ἐλεεῖ
  choice: കരുണ കാണിക്കുന്നു
  rationale: കരുണ പ്രവർത്തിയിൽ പ്രകടമാക്കുക എന്ന ക്രിയാത്മക അർഥം വ്യക്തവും സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: ὃν δὲ θέλει
  choice: താൻ ഇച്ഛിക്കുന്നവനെ … ചെയ്യുന്നു
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം അർധവിരാമത്തിലൂടെയും രണ്ടാമത്തെ വിരുദ്ധക്രിയയിലൂടെയും വ്യക്തമാകുന്നു; ആവർത്തനം ഗ്രീക്കിലെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: σκληρύνει
  choice: കഠിനനാക്കുന്നു
  rationale: ഗ്രീക്കിലെ സജീവക്രിയയും ‘കഠിനമാക്കുക’ എന്ന രൂപകവും നേരിട്ട് നിലനിർത്തുന്നു. വെറും അനുവദനമായി മയപ്പെടുത്തുകയോ ‘ഹൃദയം’ പോലൊരു പ്രകടമല്ലാത്ത പദം മുഖ്യവാചകത്തിൽ ചേർക്കുകയോ ചെയ്യുന്നില്ല.
theological_decisions:
- issue: θέλει എന്നതിലെ ദൈവിക ഇച്ഛ
  choice: ദൈവം ‘താൻ ഇച്ഛിക്കുന്നവനോട്/വനെ’ പ്രവർത്തിക്കുന്നു എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
  alternative: വെറും ആഗ്രഹം, മുൻകൂട്ടിയറിവ്, അല്ലെങ്കിൽ അനുവദിക്കൽ എന്ന രീതിയിൽ പരാവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം രണ്ടു ഉപവാക്യങ്ങളിലും ദൈവത്തിന്റെ ഇച്ഛയെ നേരിട്ട് പറയുന്നു. മുൻനിശ്ചയവും മനുഷ്യ ഉത്തരവാദിത്വവും സംബന്ധിച്ച തർക്കം പരിഭാഷയിൽ തീർപ്പാക്കുന്നില്ല.
- issue: σκληρύνει എന്നതിലെ പ്രവർത്തകത്വം
  choice: സജീവമായി ‘കഠിനനാക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കഠിനനാകാൻ അനുവദിക്കുന്നു’ അല്ലെങ്കിൽ ‘കാഠിന്യത്തിന് ഏൽപ്പിക്കുന്നു’ എന്നു മയപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് സജീവക്രിയ പ്രവർത്തനം വിഷയത്തോടു നേരിട്ട് ബന്ധിപ്പിക്കുന്നു; അനുവദിക്കൽ മാത്രമായി മാറ്റുന്നത് മൂലപാഠത്തിനപ്പുറമുള്ള വ്യാഖ്യാനമാകും.
- issue: ക്രിയകളുടെ മറഞ്ഞിരിക്കുന്ന കർത്താവ്
  choice: സന്ദർഭം വ്യക്തമാക്കുന്ന കർത്താവിനെ മലയാളത്തിൽ ‘ദൈവം’ എന്നു പ്രകടമാക്കി.
  alternative: മലയാളത്തിലും കർത്താവിനെ പറയാതെ ക്രിയകൾ മാത്രം നൽകുക, അല്ലെങ്കിൽ ഒരു സർവനാമം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിൽ കർത്താവ് ക്രിയാരൂപത്തിൽ ഉൾക്കൊള്ളുകയും മുൻസന്ദർഭം ദൈവത്തെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു. ഒറ്റവാക്യമായും വ്യക്തത ലഭിക്കാൻ ‘ദൈവം’ ചേർത്തത് അർഥവ്യാഖ്യാനം മാറ്റുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഇച്ഛിക്കുന്നു’ എന്നത് സന്ദർഭത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; ‘കഠിനനാക്കുന്നു’ മൂലത്തിലെ കാഠിന്യരൂപകവും അസ്വസ്ഥമാക്കുന്ന ദൈവശാസ്ത്ര പിരിമുറുക്കവും മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു.
