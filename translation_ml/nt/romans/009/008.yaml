    rationale: Although understandable as an impersonal Malayalam expression, it can be heard as an active construction with an unstated agent. ‘വാഗ്ദാനത്തിന്റെ മക്കളാണ് സന്തതിയായി കണക്കാക്കപ്പെടുന്നത്’ explicitly retains the passive classification expressed by λογίζεται.
