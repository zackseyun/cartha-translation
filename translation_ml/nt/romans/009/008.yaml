id: ROM.9.8
reference: Romans 9:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: ml
  text: അതായത്, ജഡത്തിന്റെ മക്കൾ ദൈവത്തിന്റെ മക്കളല്ല; വാഗ്ദാനത്തിന്റെ മക്കളാണ് സന്തതിയായി കണക്കാക്കപ്പെടുന്നത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“സന്തതിയായി” എന്നതിന് “വംശജരായി” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം: “വിത്തായി കണക്കാക്കപ്പെടുന്നു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: അതായത്
  rationale: മുൻവാക്യത്തിന്റെ അർഥം വിശദീകരിക്കുന്ന പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദമില്ലാതെ കുട്ടികളെയും വംശജരെയും സൂചിപ്പിക്കുന്ന പദം; മൂന്നു പ്രയോഗങ്ങളിലും ഏകത നിലനിർത്തുന്നു.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: ജഡത്തിന്റെ മക്കൾ
  rationale: സ്വാഭാവിക അഥവാ ശാരീരിക വംശപരമ്പര എന്ന ആശയം ഉൾക്കൊള്ളുമ്പോഴും പൗലോസിന്റെ ജഡം–വാഗ്ദാനം വൈരുധ്യം ഔപചാരികമായി നിലനിർത്തുന്നു.
- source_word: τέκνα τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മക്കൾ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധവും വാക്യത്തിലെ സമാന്തര ഘടനയും വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: വാഗ്ദാനത്തിന്റെ മക്കൾ
  rationale: ദൈവത്തിന്റെ വാഗ്ദാനത്താൽ നിർവചിക്കപ്പെടുന്ന മക്കൾ എന്ന ബന്ധം വ്യാഖ്യാനാതിരേകമില്ലാതെ നിലനിർത്തുന്നു.
- source_word: λογίζεται
  choice: കണക്കാക്കപ്പെടുന്നു
  rationale: ദൈവികമായി അംഗീകരിക്കപ്പെടുക അഥവാ എണ്ണപ്പെടുക എന്ന നിഷ്ക്രിയ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: εἰς σπέρμα
  choice: സന്തതിയായി
  rationale: അബ്രാഹാമിക പശ്ചാത്തലത്തിൽ σπέρμα വംശജരെ സൂചിപ്പിക്കുന്നു; വർഗീകരണാർഥമുള്ള εἰς മലയാളത്തിലെ ‘ആയി’യിലൂടെ വ്യക്തമാകുന്നു.
theological_decisions:
- issue: ശാരീരിക വംശപരമ്പരയും വാഗ്ദാനത്താൽ നിർവചിക്കപ്പെടുന്ന സന്തതിയും തമ്മിലുള്ള വൈരുധ്യം
  choice: ‘ജഡത്തിന്റെ മക്കൾ’ എന്നും ‘വാഗ്ദാനത്തിന്റെ മക്കൾ’ എന്നും പരിഭാഷപ്പെടുത്തി പൗലോസിന്റെ ഭാഷയും ദൈവത്തിന്റെ മക്കൾ/സന്തതി എന്ന വ്യത്യാസവും നിലനിർത്തി.
  alternative: ഇത് കേവലം സമൂഹ-ചരിത്രപരമായോ വ്യക്തിപരമായ മുൻനിർണ്ണയമായോ പരിഭാഷയിൽ തന്നെ വിശദീകരിക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം വൈരുധ്യം പ്രസ്താവിക്കുന്നുവെങ്കിലും റോമർ 9-ലെ വിശാലമായ ദൈവശാസ്ത്രവാദം ഒരു പ്രത്യേക മതവിഭാഗീയ നിലപാടിൽ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജഡം’ എന്ന ബൈബിൾപരമായി പരിചിതമായ പദം വംശപരമ്പരയുടെ അർഥത്തിൽ നിലനിർത്തിയിട്ടുണ്ട്; ‘സന്തതി’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും അബ്രാഹാമിക പശ്ചാത്തലത്തിന് യോജിച്ചതുമാണ്.
