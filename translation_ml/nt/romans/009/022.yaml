id: ROM.9.22
reference: Romans 9:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: ml
  text: എന്നാൽ ദൈവം[a], തന്റെ ക്രോധം പ്രകടമാക്കാനും തന്റെ ശക്തി[b] അറിയിക്കാനും ആഗ്രഹിച്ചുകൊണ്ട്, നാശത്തിനായി ഒരുക്കപ്പെട്ട ക്രോധത്തിന്റെ പാത്രങ്ങളെ[c] വളരെ ക്ഷമയോടെ സഹിച്ചുവെങ്കിൽ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നാൽ ദൈവം ... എങ്കിൽ’ എന്നും മനസ്സിലാക്കാം. ഗ്രീക്കിൽ ഇവിടെ ആരംഭിക്കുന്ന വ്യവസ്ഥാവാക്യം അടുത്ത വാക്യത്തിലേക്കു തുടരുന്നു.
    reason: lexical_alternative
  - marker: b
    text: പദശഃ, ‘അവനാൽ സാധ്യമായത്’; ഇവിടെ ദൈവത്തിന്റെ ശക്തിയെയോ പ്രാബല്യത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘ഒരുക്കപ്പെട്ട’ എന്ന കർമണിപ്രയോഗം ആരാണ് ഈ പാത്രങ്ങളെ ഒരുക്കിയതെന്ന് പറയുന്നില്ല. ഇത് ദൈവത്തിന്റെ പ്രവൃത്തിയെയോ, അവർ സ്വയം കഠിനരായിത്തീർന്നതിനെയോ, ന്യായവിധിക്കായി ഒരുക്കമായ ഒരു അവസ്ഥയെയോ സൂചിപ്പിക്കുന്നുവോ എന്നതിൽ വ്യാഖ്യാതാക്കൾക്കു ഭിന്നാഭിപ്രായമുണ്ട്.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ ... എങ്കിൽ
  rationale: അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന ഗ്രീക്ക് വ്യവസ്ഥാവാക്യത്തിന്റെ അപൂർണ ഘടന നിലനിർത്തുന്നു. മലയാളത്തിൽ ‘എങ്കിൽ’ ക്രിയാഭാഗത്തോടു ചേർക്കുന്നത് സ്വാഭാവികമാണ്.
- source_word: θέλων
  choice: ആഗ്രഹിച്ചുകൊണ്ട്
  rationale: പ്രധാനക്രിയയോടു ബന്ധപ്പെട്ട ദൈവത്തിന്റെ ഉദ്ദേശമോ ആഗ്രഹമോ സൂചിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; കാരണം എന്നോ വഴങ്ങലെന്നോ തീർപ്പാക്കുന്നില്ല.
- source_word: ἐνδείξασθαι
  choice: പ്രകടമാക്കാൻ
  rationale: ലക്ഷ്യബോധത്തോടെ പരസ്യമായി കാണിക്കുക എന്ന ആശയം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὀργή
  choice: ക്രോധം
  rationale: സാധാരണ കോപത്തേക്കാൾ ദൈവിക ന്യായവിധിയുടെ ഭാരം വഹിക്കുന്ന പൗലോസീയ പ്രയോഗത്തിന് യോജിക്കുന്നു.
- source_word: γνωρίσαι
  choice: അറിയിക്കാൻ
  rationale: മറ്റുള്ളവർക്ക് അറിയപ്പെടുമാറാക്കുക എന്ന causative അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: തന്റെ ശക്തി
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ പ്രാബല്യം/ശക്തി എന്ന അർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; പദശഃ സാധ്യതയായ ‘അവനാൽ സാധ്യമായത്’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἤνεγκεν
  choice: സഹിച്ചു
  rationale: ‘മഹാദീർഘക്ഷമയോടെ’ എന്ന രീതിവിശേഷണത്തോടൊപ്പം, ക്ഷമാപൂർവം വഹിക്കുക/സഹിക്കുക എന്ന സന്ദർഭാർഥം നൽകുന്നു.
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: മഹാദീർഘക്ഷമയോടെ
  rationale: μακροθυμίαയിലെ ദീർഘകാലം ക്ഷമിച്ചു നിൽക്കുന്ന ഭാവവും πολλῇയുടെ തീവ്രതയും, വെറും ‘വളരെ ക്ഷമയോടെ’ എന്നതിനെക്കാൾ കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: σκεύη
  choice: പാത്രങ്ങൾ
  rationale: മുൻസന്ദർഭത്തിലെ കുശവൻ–കളിമൺ രൂപകം നിലനിർത്തുന്നു; ‘വസ്തുക്കൾ’ എന്നത് ആ ദൃശ്യരൂപം നഷ്ടപ്പെടുത്തും.
- source_word: σκεύη ὀργῆς
  choice: ക്രോധപാത്രങ്ങൾ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ജനിറ്റീവ് പ്രയോഗത്തിന്റെ ശക്തി നിലനിർത്തുകയും അതിന്റെ കൃത്യബന്ധം അതിവ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κατηρτισμένα
  choice: ഒരുക്കപ്പെട്ട
  rationale: പൂർണകാല കർമണി കൃദന്തം സൂചിപ്പിക്കുന്ന ഒരുക്കപ്പെട്ട നില പ്രകടിപ്പിക്കുന്നു; ആരാണ് ഒരുക്കിയത് എന്ന് വ്യക്തമാക്കുന്നില്ല.
- source_word: εἰς ἀπώλειαν
  choice: നാശത്തിനായി
  rationale: ലക്ഷ്യമോ അന്തിമഫലമോ സൂചിപ്പിക്കുന്ന εἰς-പ്രയോഗത്തിന്റെ സ്വാഭാവികവും നേരിട്ടുള്ളതുമായ മലയാളരൂപം.
theological_decisions:
- issue: κατηρτισμένα (‘ഒരുക്കപ്പെട്ട’) എന്ന കർമണിപ്രയോഗത്തിലെ പ്രവർത്തകന്റെ തിരിച്ചറിയൽ
  choice: ‘ഒരുക്കപ്പെട്ട’ എന്നു കർമണിയായി വിവർത്തനം ചെയ്ത് ആരാണ് ഒരുക്കിയതെന്ന് പറയാതെ വിടുന്നു.
  alternative: ‘ദൈവം നാശത്തിനായി ഒരുക്കിയ’; ‘നാശത്തിന് പാകമായ’; ‘തങ്ങളെത്തന്നെ നാശത്തിനായി ഒരുക്കിയ’
  rationale: ഗ്രീക്ക് പൂർണകാല കർമണി കൃദന്തം ഒരുക്കപ്പെട്ട അവസ്ഥ പറയുന്നു; പ്രവർത്തകനെ തുറന്നു പറയുന്നില്ല. അതിനാൽ ദൈവിക പ്രവർത്തനം, സ്വയംകഠിനീകരണം, അല്ലെങ്കിൽ ന്യായവിധിക്കു പാകമായ അവസ്ഥ എന്നിവയിൽ ഒന്നിനെ മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- issue: εἰ കൊണ്ട് ആരംഭിച്ച് അടുത്ത വാക്യത്തിലേക്കു നീളുന്ന വ്യവസ്ഥാവാക്യത്തിന്റെ സ്വഭാവം
  choice: ‘എന്നാൽ ... എങ്കിൽ’ എന്ന വ്യവസ്ഥാരൂപം നിലനിർത്തി വാക്യം വിരാമചിഹ്നമായി കോമയോടെ അടുത്ത വാക്യത്തിലേക്കു തുറന്നുവയ്ക്കുന്നു.
  alternative: ഇത് നേരിട്ടുള്ള പ്രസ്താവനയാക്കുക; ഈ വാക്യത്തിനുള്ളിൽ പൂർണവാക്യമാക്കി മിനുക്കുക
  rationale: പൗലോസിന്റെ വാക്യഘടന 23-ാം വാക്യത്തിലേക്കു നീളുന്നു. അപൂർണമായ വ്യവസ്ഥാഘടന നിലനിർത്തുന്നത് 22-ാം വാക്യം മാത്രം ഗ്രീക്കിനേക്കാൾ ഉറച്ച പ്രസ്താവനയാക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: θέλων എന്ന കൃദന്തത്തിന്റെ താർക്കികബന്ധം
  choice: ‘ആഗ്രഹിച്ചുകൊണ്ട്’ എന്ന നിഷ്പക്ഷ കൃദന്തരൂപം ഉപയോഗിക്കുന്നു.
  alternative: ‘ആഗ്രഹിച്ചിരുന്നെങ്കിലും’; ‘ആഗ്രഹിച്ചതിനാൽ’
  rationale: കൃദന്തം വഴങ്ങൽ (‘എങ്കിലും’) ആണോ കാരണം (‘കാരണം’) ആണോ എന്ന് ഗ്രീക്ക് വ്യാകരണം മാത്രം നിർബന്ധമായി തീർക്കുന്നില്ല; അതിനാൽ ബന്ധം തുറന്നുവയ്ക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘പാത്രങ്ങൾ’ കുശവൻ–കളിമൺ രൂപകം നിലനിർത്തുന്നു. ‘മഹാദീർഘക്ഷമ’ അല്പം ഉയർന്ന രജിസ്റ്ററിലുള്ളതാണെങ്കിലും μακροθυμίαയുടെ ദീർഘക്ഷമാഭാവം കൃത്യമായി വഹിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടുണ്ട്; [b] ശക്തിക്കു പിന്നാലെയും [c] ഒരുക്കപ്പെട്ട ക്രോധപാത്രങ്ങൾക്കു പിന്നാലെയും അർഥബന്ധം വ്യക്തമാക്കുന്ന സ്ഥാനത്താണ്.
