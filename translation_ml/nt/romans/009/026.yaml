id: ROM.9.26
reference: Romans 9:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: ml
  text: “നിങ്ങൾ എന്റെ ജനമല്ല” എന്ന് അവരോടു പറഞ്ഞ അതേ സ്ഥലത്തുതന്നെ, “ജീവിക്കുന്ന ദൈവത്തിന്റെ പുത്രന്മാർ”[a] എന്ന് അവർ വിളിക്കപ്പെടും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജീവിക്കുന്ന ദൈവത്തിന്റെ മക്കൾ.” ഗ്രീക്കിൽ “പുത്രന്മാർ” എന്നാണ്; ഈ പ്രയോഗത്തിൽ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഹോശേയ 1:10-ൽനിന്നുള്ള ഉദ്ധരണി/സൂചന (സെപ്റ്റ്വജിന്റിൽ 2:1); ഉടമ്പടി പുനഃസ്ഥാപിക്കുന്ന ഭാഷയാണ് ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: മുൻവാക്യത്തോടുള്ള ലളിതമായ ബന്ധം മലയാളവാക്യത്തിന്റെ സ്വാഭാവിക പ്രവാഹത്തിലൂടെ സൂചിപ്പിക്കുന്നു; കൃത്രിമമായി ‘കൂടാതെ’ ചേർത്തിട്ടില്ല.
- source_word: ἐν τῷ τόπῳ οὗ ἐρρέθη αὐτοῖς
  choice: അവരോടു പറഞ്ഞ അതേ സ്ഥലത്തുതന്നെ
  rationale: ഗ്രീക്കിലെ സ്ഥലം–പ്രതിസ്ഥലം ഊന്നൽ ‘അതേ...തന്നെ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നിലനിർത്തുന്നു; passive construction Malayalam idiomatically expressed.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: നിങ്ങൾ എന്റെ ജനമല്ല
  rationale: ഹോശേയയിലെ ഉടമ്പടി-പരമായ ‘എന്റെ ജനം’ എന്ന ഭാഷ വ്യക്തവും നേരിട്ടുമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐκεῖ κληθήσονται
  choice: അവർ വിളിക്കപ്പെടും
  rationale: ‘അതേ സ്ഥലത്തുതന്നെ’ എന്നതിൽ ἐκεῖയുടെ അർത്ഥം ഉൾക്കൊള്ളുന്നു; κληθήσονταιയുടെ ഭാവികാല കർമണിപ്രയോഗവും ദൈവിക കർത്താവിനെ വ്യക്തമാക്കാതിരിക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: υἱοὶ
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുരുഷലിംഗ ബഹുവചനവും പുത്രത്വം/അവകാശം സംബന്ധിച്ച അനുരണനവും സംരക്ഷിക്കുന്നു; ഉൾക്കൊള്ളുന്ന അർത്ഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: θεοῦ ζῶντος
  choice: ജീവിക്കുന്ന ദൈവത്തിന്റെ
  rationale: ‘ജീവിക്കുന്ന ദൈവം’ എന്ന സ്ഥാപിത ബൈബിൾപ്രയോഗം നിലനിർത്തുകയും നിർജീവ വിഗ്രഹങ്ങളോടുള്ള അന്തർലീന വ്യത്യാസം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: υἱοὶ എന്ന പ്രതിനിധി ബഹുവചനത്തിന്റെ വിവർത്തനം
  choice: പുത്രന്മാർ
  alternative: മക്കൾ
  rationale: മൂലപാഠത്തിൽ τέκνα അല്ല, υἱοὶ ആണ്; അതിനാൽ പൗലോസിന്റെ പുത്രത്വ/അവകാശ അനുരണനം നിലനിർത്തുന്നു. അതേസമയം ഇതിന്റെ പരിധിയിൽ സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്നതായി അടിക്കുറിപ്പ് സൂചിപ്പിക്കുന്നു.
- issue: λαός μου എന്ന ഉടമ്പടി-പരമായ തിരിച്ചറിയൽ
  choice: എന്റെ ജനം
  alternative: എന്റെ സ്വന്തം ജനം
  rationale: ഹോശേയയിലെ ഉടമ്പടി-പുനഃസ്ഥാപന സൂത്രവാക്യം അധിക വ്യാഖ്യാനം ചേർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അതേ സ്ഥലത്തുതന്നെ’ എന്ന പ്രയോഗം ἐν τῷ τόπῳ...ἐκεῖ എന്ന ഊന്നിയ പ്രത്യുത്തരം ആവർത്തനഭാരം കൂടാതെ നൽകുന്നു. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ ബന്ധപ്പെട്ട ‘പുത്രന്മാർ’ എന്ന പദത്തിന് ശേഷം നൽകിയിരിക്കുന്നു.
