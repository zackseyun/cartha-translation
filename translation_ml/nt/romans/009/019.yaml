id: ROM.9.19
reference: Romans 9:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: ml
  text: 'അപ്പോൾ നീ എന്നോടു പറയും: “പിന്നെ എന്തിനാണ് അവിടുന്ന് ഇപ്പോഴും കുറ്റം കണ്ടെത്തുന്നത്? അവിടുത്തെ ഉദ്ദേശ്യത്തെ ആരാണ് എതിർത്തുനിന്നിട്ടുള്ളത്?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവിടുത്തെ ഇഷ്ടം” എന്നും പരിഭാഷപ്പെടുത്താം. βούλημα എന്ന ഗ്രീക്കുപദത്തിന് ഇഷ്ടം, ഉദ്ദേശ്യം, തീരുമാനം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: നീ ... ചോദിക്കും
  rationale: ഭാവികാല നിർദേശരൂപം പൗലോസ് മുൻകൂട്ടി പ്രതീക്ഷിക്കുന്ന എതിർചോദ്യത്തെ അവതരിപ്പിക്കുന്നു. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘പറയും’ എന്നാണെങ്കിലും പിന്നാലെ നേരിട്ടുള്ള ചോദ്യങ്ങൾ വരുന്നതിനാൽ മലയാളത്തിൽ ‘ചോദിക്കും’ സ്വാഭാവികമാണ്.
- source_word: μοι
  choice: എന്നോടു
  rationale: ദത്തിവ് പരോക്ഷ കർമത്തെ നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ / പിന്നെ
  rationale: ആദ്യത്തെ οὖν വാദത്തിലെ അടുത്ത ഘട്ടം സൂചിപ്പിക്കുന്ന ‘അപ്പോൾ’ എന്നും രണ്ടാമത്തേത് എതിർചോദ്യത്തിലെ നിഗമനാത്മകമായ ‘പിന്നെ’ എന്നും നൽകി ആവർത്തനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: Τί οὖν ἔτι
  choice: പിന്നെ എന്തിനാണ് ... ഇപ്പോഴും
  rationale: τί ഇവിടെ കുറ്റം ചുമത്താനുള്ള കാരണം ചോദിക്കുന്നതിനാൽ ‘എന്തിന്’ എന്നാണ് സ്വാഭാവികം; ἔτιയുടെ ‘ഇപ്പോഴും’ എന്ന അർഥവും നിലനിർത്തുന്നു.
- source_word: μέμφεται
  choice: കുറ്റം ചുമത്തുന്നത്
  rationale: ‘കുറ്റപ്പെടുത്തുക/കുറ്റം കണ്ടെത്തുക’ എന്ന അർഥം നൽകുന്നു; സന്ദർഭത്തിലെ ഉത്തരവാദിത്വപ്രശ്നം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: അവിടത്തെ ഉദ്ദേശ്യത്തെ
  rationale: βούλημα ദൃഢമായ ഇച്ഛ, ഉദ്ദേശ്യം, തീരുമാനം എന്നിവ സൂചിപ്പിക്കാം. ‘ഉദ്ദേശ്യം’ ദൈവിക നിർണയത്തിന്റെ ആശയം പ്രകടിപ്പിക്കുമ്പോഴും പ്രത്യേക സിദ്ധാന്തപരമായ അർഥം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: τίς ἀνθέστηκεν
  choice: ആർക്കാണ് എതിർത്തുനിൽക്കാൻ കഴിഞ്ഞിട്ടുള്ളത്?
  rationale: ἀνθέστηκεν എന്ന പൂർണകാലരൂപത്തിന്റെ ഇതുവരെയുള്ള പ്രസക്തി ‘കഴിഞ്ഞിട്ടുള്ളത്’ വഴി വ്യക്തമാക്കുന്നു; ‘എതിർത്തുനിൽക്കുക’ എന്നത് മൂലപദത്തിലെ വിരോധിച്ചു നിൽക്കുന്ന ദൃശ്യഭാവം സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ദൈവപരമാധികാരത്തിന്റെ സന്ദർഭത്തിൽ βούλημα വിവർത്തനം ചെയ്യൽ
  choice: അവിടത്തെ ഉദ്ദേശ്യം
  alternative: അവിടത്തെ ഇഷ്ടം / അവിടത്തെ ഹിതം / അവിടത്തെ തീരുമാനം
  rationale: ‘ഉദ്ദേശ്യം’ എന്നത് ആലോചിച്ചുറച്ച ദൈവിക ലക്ഷ്യം സൂചിപ്പിക്കുന്നു; അതേസമയം മനുഷ്യ ഉത്തരവാദിത്വവും ദൈവിക പരമാധികാരവും തമ്മിലുള്ള വാക്യത്തിലെ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: μέμφεται എന്നതിലെ പരാമർശിക്കാത്ത കർത്താവ്
  choice: അവിടന്ന്
  alternative: ദൈവം
  rationale: സന്ദർഭത്തിൽ കർത്താവ് ദൈവമാണെങ്കിലും ഗ്രീക്കിലെ സർവനാമസൂചനയെപ്പോലെ മലയാളത്തിലും ആദരസൂചക സർവനാമം ഉപയോഗിച്ച് മൂലത്തിന്റെ പരോക്ഷത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. പ്രതീക്ഷിക്കപ്പെടുന്ന എതിർചോദ്യത്തിന്റെ വാദാത്മക സ്വരം നിലനിർത്തി; ദൈവത്തെ സൂചിപ്പിക്കാൻ ‘അവിടന്ന്/അവിടത്തെ’ എന്ന ആദരസൂചക പ്രയോഗം സ്വീകരിച്ചു.
