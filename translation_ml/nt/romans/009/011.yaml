source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: ml
  text: എന്തെന്നാൽ, അവർ ഇനിയും ജനിക്കുകയോ നല്ലതോ ചീത്തയോ ആയ യാതൊന്നും ചെയ്യുകയോ ചെയ്യുന്നതിനുമുമ്പ്, തിരഞ്ഞെടുപ്പിനുസരിച്ചുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം നിലനിൽക്കേണ്ടതിന്[a][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരഞ്ഞെടുപ്പിനുസരിച്ചുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം’ എന്നതിന് ‘ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കുന്ന ഉദ്ദേശ്യം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘നിലനിൽക്കേണ്ടതിന്’ എന്നതിന് ‘ഉറച്ചുനിൽക്കേണ്ടതിന്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: അവർ ഇനിയും ജനിക്കുകയോ ... ചെയ്യുന്നതിനുമുമ്പുതന്നെ
  rationale: μήπωയുടെ ‘ഇനിയും ... ഇല്ല’ എന്ന കാലസൂചനയും genitive absolute-ന്റെ മുൻകാലബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ ചേർത്തു നൽകുന്നു. γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ഇവിടെ വാക്യഘടനയിലൂടെ നിലനിൽക്കുന്നു.
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: നല്ലതോ ചീത്തയോ ആയ ഒന്നും പ്രവർത്തിക്കുകയോ
  rationale: μηδέയുടെ നിഷേധാത്മക ഏകോപനം ‘ഒന്നും’ എന്നതിലൂടെ വ്യക്തമാക്കുന്നു. ἀγαθόν–φαῦλον എന്ന വിരുദ്ധജോടിക്ക് സാധാരണവും അതിരുകടക്കാത്തതുമായ ‘നല്ലത്–ചീത്ത’ ഉപയോഗിച്ചു.
- source_word: ἵνα
  choice: നിലനിൽക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യസൂചന സംരക്ഷിക്കുന്നു; ഫലസൂചനയിലേക്കോ വിപുലമായ മുൻനിശ്ചയ വ്യാഖ്യാനത്തിലേക്കോ വാചകത്തെ ചുരുക്കുന്നില്ല.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: തിരഞ്ഞെടുപ്പനുസരിച്ചുള്ള ദൈവത്തിന്റെ ഉദ്ദേശ്യം
  rationale: κατά + ἐκλογή എന്ന ഘടന ദൃശ്യമാക്കി നിലനിർത്തുന്നു. ‘തിരഞ്ഞെടുപ്പ്’ ആധുനിക മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നതും പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ സാങ്കേതിക പദപ്രയോഗം അനാവശ്യമായി അടിച്ചേൽപ്പിക്കാത്തതുമാണ്.
- source_word: μένῃ
  choice: നിലനിൽക്കേണ്ടതിന്
  rationale: μένωയുടെ ‘തുടർന്ന് നിലനിൽക്കുക/നിലകൊള്ളുക’ എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു; ‘സ്ഥാപിക്കപ്പെടുക’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക അർത്ഥം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: മുൻനിശ്ചയത്തിന്റെ പശ്ചാത്തലത്തിൽ ἵναയുടെ ശക്തി
  choice: ഉദ്ദേശ്യവാക്യമായി ‘നിലനിൽക്കേണ്ടതിന്’
  alternative: ഫലസൂചനയായി ‘അങ്ങനെ ... നിലനിന്നു’
  rationale: ഗ്രീക്ക് വ്യാകരണത്തിലെ സ്വാഭാവികമായ ഉദ്ദേശ്യബലം സംരക്ഷിക്കുമ്പോഴും മുൻനിശ്ചയത്തെക്കുറിച്ചുള്ള വിശാലമായ ദൈവശാസ്ത്രവാദം പരിഭാഷയിലൂടെ തീർപ്പാക്കുന്നില്ല.
- issue: ἐκλογήയുടെ പരിഭാഷ
  choice: തിരഞ്ഞെടുപ്പ്
  alternative: തിരഞ്ഞെടുക്കൽ / ദൈവിക തിരഞ്ഞെടുപ്പ്
  rationale: മൂലപദത്തിന്റെ തിരഞ്ഞെടുക്കൽസംബന്ധമായ അർത്ഥം നേരിട്ട് നൽകുന്നു; ‘ദൈവിക’ എന്ന വിശേഷണം ചേർത്ത് വ്യാഖ്യാനം അധികരിപ്പിക്കുന്നില്ല, കാരണം τοῦ θεοῦ ഇതിനകം ഉദ്ദേശ്യത്തെ ദൈവത്തോടു ബന്ധിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിലേക്ക് വ്യാകരണപരമായി തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
