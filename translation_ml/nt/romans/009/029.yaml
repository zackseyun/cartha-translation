id: ROM.9.29
reference: Romans 9:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: ml
  text: 'യെശയ്യാവ് മുമ്പേ പറഞ്ഞിരിക്കുന്നതുപോലെതന്നെ: “സൈന്യങ്ങളുടെ കർത്താവ്[a] നമുക്കു സന്തതിയെ[b][c] ശേഷിപ്പിച്ചിരുന്നില്ലെങ്കിൽ, നാം സൊദോമിനെപ്പോലെ ആയിത്തീരുമായിരുന്നു; ഗൊമോറയെപ്പോലെ ആക്കപ്പെടുമായിരുന്നു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “കർത്താവായ സബായോത്ത്”; ഗ്രീക്കിലെ Σαβαώθ, സാധാരണയായി “സൈന്യങ്ങളുടെ” എന്നു വിവർത്തനം ചെയ്യുന്ന എബ്രായ ദൈവികപദവിയുടെ ലിപ്യന്തരമാണ്.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം “വിത്ത്”; ഇവിടെ ശേഷിച്ച സന്തതിയെയോ പിൻതലമുറയെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: യെശയ്യാവ് 1:9-ലെ ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: പറഞ്ഞിരിക്കുന്നതുപോലെ
  rationale: καθὼς സൂചിപ്പിക്കുന്ന താരതമ്യബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; καί വാക്യബന്ധത്തിലൂടെ ഉൾക്കൊള്ളുന്നു.
- source_word: προείρηκεν
  choice: മുമ്പുതന്നെ പറഞ്ഞിരിക്കുന്നു
  rationale: മുൻപ് പറഞ്ഞതും ഇപ്പോഴും പ്രസക്തവുമായ പ്രസ്താവന എന്ന perfect രൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; പ്രവചനമെന്ന ആശയം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: κύριος Σαβαὼθ
  choice: സൈന്യങ്ങളുടെ കർത്താവ്
  rationale: Σαβαώθ എന്ന എബ്രായ ദൈവികപദവിയുടെ അർത്ഥം വിവർത്തനം ചെയ്യുകയും κύριος എന്നതിന് ആദരസൂചകമായ പതിവു മലയാളം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἐγκατέλιπεν
  choice: ശേഷിപ്പിച്ചിരുന്നില്ലെങ്കിൽ
  rationale: ഈ സാഹചര്യത്തിലെ ‘പിന്നിൽ ശേഷിപ്പിക്കുക’ എന്ന അർത്ഥം സുതാര്യമായി നൽകുന്നു; ‘സംരക്ഷിക്കുക’ എന്ന വ്യാഖ്യാനം നേരിട്ട് ചേർക്കുന്നില്ല.
- source_word: σπέρμα
  choice: സന്തതി
  rationale: അക്ഷരാർഥം ‘വിത്ത്’ ആണെങ്കിലും ഇവിടെ നിലനിൽക്കുന്ന പിൻതലമുറയെ സൂചിപ്പിക്കുന്നു. ‘ശേഷിപ്പ്’ എന്നു വിവർത്തനം ചെയ്ത് സന്ദർഭത്തിലെ ദൈവശാസ്ത്ര ആശയം പദത്തിൽ ഇറക്കിവയ്ക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἂν ἐγενήθημεν
  choice: ആയിത്തീരുകയും
  rationale: പ്രത്യക്ഷവിരുദ്ധമായ ഫലത്തെ സൂചിപ്പിക്കുന്ന ഘടനയും γίνομαι എന്നതിലെ ‘ആയിത്തീരുക’ എന്ന ചലനഭാവവും നിലനിർത്തുന്നു.
- source_word: ἂν ὡμοιώθημεν
  choice: സദൃശരാക്കപ്പെടുകയും ചെയ്യുമായിരുന്നു
  rationale: ὁμοιόω എന്ന passive ക്രിയയുടെ ‘സദൃശരാക്കപ്പെടുക’ എന്ന ഭാവം മുൻ ക്രിയയിൽനിന്ന് വേർതിരിച്ചു നിലനിർത്തുന്നു.
theological_decisions:
- issue: പഴയനിയമ ഉദ്ധരണിയിലെ κύριος Σαβαὼθ എന്ന ദൈവികപദവി
  choice: സൈന്യങ്ങളുടെ കർത്താവ്
  alternative: കർത്താവായ സബായോത്ത് / സൈന്യങ്ങളുടെ യഹോവ
  rationale: ഗ്രീക്ക് പാഠം κύριος എന്നതോടൊപ്പം എബ്രായ പദവിയുടെ ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു. പ്രധാന പാഠത്തിൽ പദവിയുടെ അർത്ഥം വിവർത്തനം ചെയ്യുന്നത് വായനാസൗകര്യവും ഉറവിടാർത്ഥവും സംരക്ഷിക്കുന്നു; യെശയ്യാവിലെ എബ്രായ ദൈവനാമത്തെ നേരിട്ട് ഇറക്കിവയ്ക്കുന്നില്ല.
- issue: σπέρμα എന്നത് ‘ശേഷിപ്പ്’ എന്നു വ്യാഖ്യാനിക്കണമോ
  choice: സന്തതി
  alternative: വിത്ത് / ശേഷിപ്പ്
  rationale: വിശാലസന്ദർഭത്തിൽ ശേഷിപ്പിന്റെ ആശയം ഉണ്ടായാലും ഇവിടെ ഉപയോഗിച്ച പദം σπέρμα ആണ്. ‘സന്തതി’ അതിന്റെ സന്ദർഭാർത്ഥം നൽകുകയും ദൈവശാസ്ത്രപരമായി ഭാരമുള്ള ‘ശേഷിപ്പ്’ എന്ന പദം അനാവശ്യമായി ഇറക്കിവയ്ക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയുടെ ശാസ്ത്രീയ ഗൗരവം നിലനിർത്തിക്കൊണ്ട് അത്യന്തം പഴഞ്ചൻ രൂപങ്ങൾ ഒഴിവാക്കി. paired verbs വ്യത്യസ്തമായി വിവർത്തനം ചെയ്ത് ഗ്രീക്കിലെ ഭേദം സംരക്ഷിച്ചു.
