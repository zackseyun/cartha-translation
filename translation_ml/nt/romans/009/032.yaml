source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: ml
  text: എന്തുകൊണ്ട്? കാരണം, അവർ അതിനെ വിശ്വാസത്തിൽനിന്നല്ല[a], പ്രവൃത്തികളിൽനിന്നെന്നപോലെ[b] അന്വേഷിച്ചു. ഇടർച്ചയുടെ കല്ലിൽ അവർ ഇടറി[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിശ്വാസത്താൽ അല്ല” അല്ലെങ്കിൽ “വിശ്വാസത്തെ അടിസ്ഥാനമാക്കിയല്ല” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “വിശ്വാസത്തിൽനിന്നല്ല” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: “പ്രവൃത്തികളിൽനിന്നെന്ന മട്ടിൽ” അല്ലെങ്കിൽ “പ്രവൃത്തികളിൽനിന്നെന്നപോലെ” എന്നും പരിഭാഷപ്പെടുത്താം. “എന്നപോലെ” എന്ന പ്രയോഗം ഗ്രീക്കിലെ ആശയം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: c
    text: യെശയ്യാവ് 8:14-ലേക്കുള്ള ഒരു സൂചന; അടുത്ത വാക്യവുമായി ബന്ധപ്പെട്ട് യെശയ്യാവ് 28:16-ഉം താരതമ്യം ചെയ്യുക.
    reason: cross_reference
  - marker: d
    text: “ഇടറിപ്പിക്കുന്ന കല്ല്” അല്ലെങ്കിൽ “അപരാധത്തിന്റെ കല്ല്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: എന്തുകൊണ്ട്?
  rationale: പൗലോസിന്റെ വിശദീകരണത്തിന് വഴിതുറക്കുന്ന ഹ്രസ്വമായ അലങ്കാരചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: ആയതിനാൽ
  rationale: മുമ്പുള്ള ചോദ്യത്തിന് കാരണം നൽകുന്ന ബന്ധം മലയാളവാക്യഘടനയ്ക്ക് അനുസരിച്ച് പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἐκ πίστεως
  choice: വിശ്വാസത്തിൽനിന്നല്ല
  rationale: ἐκ എന്നതിന്റെ ‘നിന്ന്’ എന്ന ആശയം നിലനിർത്തുകയും, സാധ്യമായ കൂടുതൽ സ്വാഭാവിക വ്യാഖ്യാനങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: പ്രവൃത്തികളുമായുള്ള പൗലോസിന്റെ വിപരീതസമാന്തരത്തിൽ സാധാരണയും ദൈവശാസ്ത്രപരമായി അനാവശ്യമായ നിർണയം ഒഴിവാക്കുന്നതുമായ പരിഭാഷ.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: പ്രവൃത്തികളിൽനിന്നെന്നപോലെ
  rationale: ὡς എന്ന പദത്തിലെ ‘എന്നപോലെ/എന്ന മട്ടിൽ’ എന്ന സൂക്ഷ്മത സംരക്ഷിക്കുന്നു; വെറും ‘പ്രവൃത്തികളാൽ’ എന്ന് പരത്തുന്നില്ല.
- source_word: ἔργων
  choice: പ്രവൃത്തികൾ
  rationale: റോമർ ലേഖനത്തിലെ വിശ്വാസം–പ്രവൃത്തികൾ വിപരീതസമാന്തരവുമായി യോജിക്കുന്ന സ്ഥിരവും പരിചിതവുമായ പദം.
- source_word: προσέκοψαν
  choice: തട്ടി ഇടറി
  rationale: തടസ്സത്തിൽ കാൽതട്ടി ഇടറുന്ന മൂർത്തമായ രൂപകം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: ഇടറിക്കുന്ന കല്ലിൽ
  rationale: ‘ഇടർച്ചയുടെ കല്ല്’ എന്ന അസ്വാഭാവിക ഘടന ഒഴിവാക്കി, കല്ല് ഇടർച്ചയ്ക്ക് കാരണമാകുന്നു എന്ന ഗ്രീക്ക് ബന്ധം സംക്ഷിപ്തമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: വിശ്വാസം–പ്രവൃത്തികൾ വിപരീതസമാന്തരത്തിലെ πίστις എന്ന പദത്തിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിൽ നീതിയെ അന്വേഷിക്കുന്നതിന്റെ അടിസ്ഥാനമായ വിശ്വാസത്തെയാണ് പ്രവൃത്തികളുമായി വിപരീതമായി നിർത്തുന്നത്. ‘വിശ്വസ്തത’ എന്ന പ്രത്യേക അർഥം ഇവിടെ നിർബന്ധിതമല്ല.
- issue: ὡς മൂലം പ്രവൃത്തികളെക്കുറിച്ചുള്ള പ്രസ്താവനയിലെ സൂക്ഷ്മത
  choice: പ്രവൃത്തികളിൽനിന്നെന്നപോലെ
  alternative: പ്രവൃത്തികളാൽ
  rationale: പാഠത്തിലെ ὡς ഒഴിവാക്കാതെ, പ്രവൃത്തികളാണ് യഥാർഥ ഉറവിടമെന്ന് വിവർത്തനം നേരിട്ട് പ്രഖ്യാപിക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വിശ്വാസത്തിൽനിന്ന്’ എന്ന ഉറവിടരൂപകവും ‘എന്നപോലെ’ എന്ന യഥാർഥ പാഠസൂക്ഷ്മതയും നിലനിർത്തുന്നു; ഇടർച്ചയുടെ രൂപകം സാധാരണ വായനക്കാരന് വ്യക്തമായി അവതരിപ്പിക്കുന്നു.
