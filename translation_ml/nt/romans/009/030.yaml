id: ROM.9.30
reference: Romans 9:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: ml
  text: അപ്പോൾ നാം എന്തു പറയും? നീതി പിന്തുടരാതിരുന്ന ജനതകൾ[a] നീതി പ്രാപിച്ചു—വിശ്വാസത്തിൽനിന്നുള്ള നീതിതന്നെ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ജാതികൾ’; ഇവിടെ യിസ്രായേലല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘വിശ്വാസത്താൽ ലഭിക്കുന്ന നീതി’; ഇവിടെ കുറവ് സാദ്ധ്യതയുള്ള മറ്റൊരു വായന: ‘വിശ്വസ്തതയിൽനിന്നുള്ള നീതി.’'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: അപ്പോൾ നാം എന്തു പറയും?
  rationale: പൗലോസിന്റെ വാദത്തിലെ പതിവായ പരിവർത്തനചോദ്യത്തിന്റെ ആലോചനാത്മക ഭാവി അർഥവും സ്വാഭാവികമായ മലയാളശൈലിയും നിലനിർത്തുന്നു.
- source_word: ἔθνη
  choice: ജനതകൾ
  rationale: പദത്തിന്റെ അടിസ്ഥാനാർഥം നിലനിർത്തുന്നു; ഇവിടെ യിസ്രായേലല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: τὰ μὴ διώκοντα
  choice: പിന്തുടരാതിരുന്ന
  rationale: തുടർച്ചയായോ സ്വഭാവസവിശേഷമായോ ഉള്ള പിന്തുടരലിനെ നിഷേധിക്കുന്ന വർത്തമാന കൃദന്തരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ധാർമികവും ന്യായവിധിസംബന്ധവും ദൈവബന്ധപരവുമായ വ്യാപ്തി പൂർണമായി ചുരുക്കാതെ അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: κατέλαβεν
  choice: പ്രാപിച്ചു
  rationale: പിന്തുടരാതിരുന്ന ഒന്നിനെ കൈവരിക്കുക അഥവാ അതിൽ എത്തിച്ചേരുക എന്ന സന്ദർഭാർഥം ഭൗതികമായ ‘പിടിക്കുക’ എന്ന ധ്വനിയില്ലാതെ നൽകുന്നു.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: വിശ്വാസത്തിൽനിന്നുള്ള നീതിതന്നെ
  rationale: ആദ്യം പറഞ്ഞ നീതിയുടെ സ്വഭാവം വ്യക്തമാക്കുന്ന ആവർത്തനം നിലനിർത്തുന്നു; δέയെ നിർബന്ധമായി വിരോധസൂചകമാക്കാതെ ഊന്നൽ നൽകുന്ന ‘തന്നെ’ ഉപയോഗിക്കുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ ഇവിടെ ഏറ്റവും സാദ്ധ്യമായ വിശ്വാസം/ആശ്രയം എന്ന അർഥം നൽകുന്നു; ‘വിശ്വസ്തത’ എന്ന കുറവ് സാദ്ധ്യതയുള്ള വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വാദത്തിലെ δικαιοσύνηയുടെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘നീതി’ എന്നു പരിഭാഷപ്പെടുത്തി; അതിനെ ദൈവം കണക്കിടുന്ന നീതിയെന്നോ ഉടമ്പടിസമൂഹത്തിലെ അംഗത്വമെന്നോ മാത്രം ചുരുക്കിയില്ല.
  alternative: നീതിമത്തം; ദൈവസന്നിധിയിലെ ശരിയായ നില; ഉടമ്പടിപരമായ നീതി
  rationale: ഈ വാക്യം നീതിയുടെ എല്ലാ ദൈവശാസ്ത്രപരമായ പ്രവർത്തനരീതികളും വിശദീകരിക്കുന്നില്ല; വിശാലതയും സംഘർഷവും നിലനിർത്തുന്ന പദപ്രയോഗമാണ് വേണ്ടത്.
- issue: ἐκ πίστεως എന്നതിന്റെ അർഥം
  choice: ‘വിശ്വാസത്തിൽനിന്നുള്ള’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: വിശ്വാസത്താൽ ലഭിക്കുന്ന; വിശ്വസ്തതയിൽനിന്നുള്ള
  rationale: ἐκ എന്നതിന്റെ ഉറവിടസൂചന സംരക്ഷിക്കുകയും ‘വിശ്വാസത്താൽ മാത്രം’ പോലുള്ള പിൽക്കാല സിദ്ധാന്തപരമായ വിപുലീകരണം ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- issue: δικαιοσύνην δὲ τὴν ἐκ πίστεως എന്നതിലെ δέയുടെ പ്രവർത്തനം
  choice: ‘വിശ്വാസത്തിൽനിന്നുള്ള നീതിതന്നെ’ എന്ന വിശദീകരണാത്മക ഊന്നൽ.
  alternative: ‘എന്നാൽ വിശ്വാസത്തിൽനിന്നുള്ള നീതി’ എന്ന വിരോധസൂചക വായന
  rationale: ആവർത്തിച്ച δικαιοσύνηയെ തുടർന്നുള്ള ആർട്ടിക്കിളോടുകൂടിയ പദസമുച്ചയം പ്രാപിച്ച നീതി ഏതു തരത്തിലുള്ളതാണെന്ന് വ്യക്തമാക്കുന്നു; എങ്കിലും δέയിലെ ചെറിയ തിരിവ് ‘തന്നെ’ എന്ന ഊന്നലിൽ പ്രതിഫലിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീതി’ എന്ന ആവർത്തനം ഗ്രീക്ക് വാക്യത്തിലെ വാദാത്മക ഊന്നലിനായി മനപ്പൂർവം നിലനിർത്തി; ‘ജനതകൾ’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നതുമാണ്.
