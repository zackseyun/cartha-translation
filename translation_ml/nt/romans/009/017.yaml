id: ROM.9.17
reference: Romans 9:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: ml
  text: 'കാരണം, തിരുവെഴുത്ത് ഫറവോനോടു ഇപ്രകാരം പറയുന്നു:[a] “ഈ ഉദ്ദേശ്യത്തിനായിത്തന്നെ ഞാൻ നിന്നെ ഉയർത്തി: നിന്നിൽ എന്റെ ശക്തി പ്രകടമാക്കേണ്ടതിനും എന്റെ നാമം[b] ഭൂമിയിലെങ്ങും ഘോഷിക്കപ്പെടേണ്ടതിനും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പുറപ്പാട് 9:16-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: b
    text: “നാമം” എന്നത് വെറുമൊരു വിളിപ്പേരല്ല; ദൈവം വെളിപ്പെടുത്തിയ തന്റെ മഹത്ത്വത്തെയും കീർത്തിയെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: തിരുവെഴുത്ത് ഫറവോനോടു പറയുന്നതിങ്ങനെ
  rationale: λέγει എന്ന വർത്തമാനകാലവും തിരുവെഴുത്തിനെ സംസാരിക്കുന്നതായി അവതരിപ്പിക്കുന്ന പ്രയോഗവും നിലനിർത്തുന്നു; γάρ മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം ഈ വാക്യഘടനയിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: ഈ ഉദ്ദേശ്യത്തിനായിത്തന്നെ
  rationale: ലക്ഷ്യത്തെയും αὐτό നൽകുന്ന ഊന്നലിനെയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐξήγειρά σε
  choice: ഞാൻ നിന്നെ ഉയർത്തിനിർത്തി
  rationale: ‘എഴുന്നേൽപ്പിച്ചു’, ‘നിലനിൽക്കുമാറാക്കി’, ‘മുന്നോട്ടുകൊണ്ടുവന്നു’ എന്നീ സാധ്യതകളെ അതിയായി ചുരുക്കാതെ, ദൈവം ഫറവോനെ ഈ സ്ഥാനത്തും സാഹചര്യത്തും കൊണ്ടുവന്ന് നിലനിർത്തിയെന്ന വിശാല അർഥം നൽകുന്നു.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: നിന്നിൽ എന്റെ ശക്തി പ്രകടമാക്കേണ്ടതിന്
  rationale: ὅπως എന്ന ലക്ഷ്യാർഥവും ἐν σοὶ എന്ന ‘നിന്നിൽ’ എന്ന തുറന്ന പ്രയോഗവും നിലനിർത്തുന്നു; ‘നിന്നിലൂടെ’ അല്ലെങ്കിൽ ‘നിന്റെമേൽ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: എന്റെ നാമം ... ഘോഷിക്കപ്പെടേണ്ടതിനും
  rationale: διαγγέλλω സൂചിപ്പിക്കുന്ന പരസ്യവും വ്യാപകവുമായ പ്രഖ്യാപനത്തിന്റെ ഭാവവും ഗ്രീക്കിലെ നിർവ്യക്ത കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: ഭൂമിയിലെങ്ങും
  rationale: ‘ദേശത്തെങ്ങും’ എന്ന പരിമിത അർഥത്തേക്കാൾ, പൗലൊസിന്റെ ഉദ്ധരണിയിൽ പ്രകടമായ സർവഭൗമ വ്യാപ്തി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ἐξήγειρά σε എന്നതും ഫറവോന്റെ കാര്യത്തിലുള്ള ദൈവിക പരമാധികാരവും
  choice: “ഞാൻ നിന്നെ ഉയർത്തിനിർത്തി” എന്ന വിശാല അർഥമുള്ള പരിഭാഷ
  alternative: “ഞാൻ നിന്നെ ജീവനോടെ നിലനിർത്തി” / “ഞാൻ നിന്നെ നിലകൊള്ളുമാറാക്കി” / “ഞാൻ നിന്നെ ഉയർത്തിക്കൊണ്ടുവന്നു”
  rationale: ദൈവം ഫറവോനെ ഈ ഉദ്ദേശ്യത്തിനായി മുന്നോട്ടുകൊണ്ടുവന്നതോ നിലനിർത്തിയതോ എന്ന ആശയം വാക്കിൽ ഉൾക്കൊള്ളാം. സൃഷ്ടിച്ചു, വെറും ജീവനോടെ സൂക്ഷിച്ചു, അല്ലെങ്കിൽ സ്ഥാനാരോഹണം ചെയ്യിച്ചു എന്നിങ്ങനെ ഒരു പ്രത്യേക സിദ്ധാന്തവായനയിൽ പാഠത്തെ പൂട്ടാതെ ദൈവിക പരമാധികാരവും മനുഷ്യ ഉത്തരവാദിത്വവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ‘തിരുവെഴുത്ത്’ എന്ന ഏകവചനപ്രയോഗം പൗലൊസിന്റെ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു. ഉദ്ധരണിയുടെ ഗൗരവം കാക്കിക്കൊണ്ട് സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ തെരഞ്ഞെടുത്തു.
