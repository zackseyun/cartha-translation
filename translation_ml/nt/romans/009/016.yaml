id: ROM.9.16
reference: Romans 9:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], അത് ഇച്ഛിക്കുന്നവനെയോ ഓടുന്നവനെയോ[b] ആശ്രയിച്ചല്ല, കരുണ കാണിക്കുന്ന ദൈവത്തെയാണ് ആശ്രയിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ ഔപചാരികമായി: “ആകയാൽ, അത് ഇച്ഛിക്കുന്നവന്റേതുമല്ല, ഓടുന്നവന്റേതുമല്ല, കരുണ കാണിക്കുന്ന ദൈവത്തിന്റേതാണ്.” ഗ്രീക്ക് വാക്യം അധ്യാഹാരസ്വഭാവമുള്ളതാണ്; ദൈവത്തിന്റെ ഉദ്ദേശ്യത്തെയും കരുണയെയും കുറിച്ചുള്ള സന്ദർഭത്തിൽനിന്നാണ് പറയാതെവിട്ട ആശയം ഗ്രഹിക്കേണ്ടത്.'
    reason: lexical_alternative
  - marker: b
    text: “ഓടുന്നു” എന്നത് മനുഷ്യന്റെ പ്രയത്നത്തെയോ കഠിനശ്രമത്തെയോ സൂചിപ്പിക്കുന്ന രൂപകമായിരിക്കാം; എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം “ഓടുന്നു” എന്നാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള പൗലോസിന്റെ നിഗമനം സ്വാഭാവികവും വ്യക്തവുമായി അറിയിക്കുന്നു; കൂട്ടായി വരുന്ന രണ്ടു ഗ്രീക്ക് നിഗമനകണങ്ങളുടെയും ശക്തി മലയാളത്തിൽ ഈ പ്രയോഗം വഹിക്കുന്നു.
- source_word: τοῦ θέλοντος
  choice: ഇച്ഛിക്കുന്നവൻ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാന കൃദന്തത്തിന്റെ വ്യക്തിവാചക സ്വഭാവവും θέλω എന്ന ക്രിയയുടെ ഇച്ഛാശക്തിസംബന്ധമായ അർഥവും നിലനിർത്തുന്നു.
- source_word: τοῦ τρέχοντος
  choice: ഓടുന്നവൻ
  rationale: τρέχω എന്നതിന്റെ അക്ഷരാർഥമായ ‘ഓടുക’ എന്ന ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഇവിടെ മനുഷ്യശ്രമത്തിന്റെ രൂപകാർഥം ഉണ്ടാകാമെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀλλὰ
  choice: അല്ല, ...ത്തെയാണ്
  rationale: മനുഷ്യന്റെ ഇച്ഛയും പ്രയത്നവും ഒരു വശത്തും കരുണ കാണിക്കുന്ന ദൈവം മറുവശത്തും എന്ന ശക്തമായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: കരുണ കാണിക്കുന്ന ദൈവം
  rationale: ദൈവത്തെ അവന്റെ കരുണാപ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് കൃദന്തരൂപത്തിന്റെ സജീവമായ ക്രിയാഭാവം സംരക്ഷിക്കുന്നു.
- source_word: implied predicate/expression
  choice: അത് ... ആശ്രയിച്ചല്ല ... ആശ്രയിക്കുന്നത്
  rationale: ഗ്രീക്കിൽ അധ്യാഹൃതമായിരിക്കുന്ന വിധേയപ്രയോഗം മലയാളവാക്യം പൂർണമാകാൻ പൊതുവായ ‘ആശ്രയിക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ നൽകുന്നു; ‘അത്’ എന്താണെന്ന് രക്ഷ, തിരഞ്ഞെടുപ്പ് തുടങ്ങിയ കൂടുതൽ നിർദിഷ്ട പദങ്ങളാൽ തീർപ്പാക്കാതെ സന്ദർഭത്തിന് വിട്ടുകൊടുക്കുന്നു.
theological_decisions:
- issue: അധ്യാഹൃത കർത്താവും ആശ്രയത്വത്തിന്റെ വ്യാപ്തിയും
  choice: ‘അത് ... ആശ്രയിച്ചല്ല’ എന്ന പൊതുവായ രൂപം ഉപയോഗിച്ച്, ‘അത്’ രക്ഷയോ തിരഞ്ഞെടുപ്പോ ദൈവത്തിന്റെ തീരുമാനമോ ആണെന്ന് മുഖ്യപാഠത്തിൽ നിർദിഷ്ടമാക്കാതിരിക്കുക.
  alternative: ‘ആകയാൽ രക്ഷ മനുഷ്യന്റെ ഇച്ഛയെയോ ശ്രമത്തെയോ ആശ്രയിച്ചല്ല’ അല്ലെങ്കിൽ ‘ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പ് മനുഷ്യന്റെ ഇച്ഛയെ ആശ്രയിച്ചല്ല’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം അധ്യാഹാരസ്വഭാവമുള്ളതാണ്; സമീപസന്ദർഭത്തിൽ ദൈവത്തിന്റെ ഉദ്ദേശ്യവും കരുണയും തിരഞ്ഞെടുപ്പും ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും, ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കാതെ മൂലപാഠത്തിലെ വ്യാപ്തിയും പിരിമുറുക്കവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ അധ്യാഹാരസ്വഭാവം പൂർണമായി ഇല്ലാതാക്കാതെ മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന വാക്യഘടന നൽകി. ‘ഓടുന്നവൻ’ എന്ന മൂലദൃശ്യരൂപവും ദൈവത്തിന്റെ സജീവമായ കരുണാപ്രവൃത്തിയും നിലനിർത്തി.
