  terminology: «ഗർഭം ധരിച്ചപ്പോൾ» is a clear, dignified contextual rendering of the Greek idiom. «നമ്മുടെ പിതാവായ യിസ്ഹാക്ക്» preserves the ancestral/covenantal designation without importing further interpretation.
