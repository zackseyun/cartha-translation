  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: ml
  text: അതുമാത്രമല്ല, റിബെക്കയും നമ്മുടെ പിതാവായ യിസ്ഹാക്ക് എന്ന ഒരുവനിൽനിന്ന് ഗർഭം ധരിച്ചപ്പോൾ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘നമ്മുടെ പിതാവായ യിസ്ഹാക്ക് എന്ന ഒരുവനിൽനിന്ന് ശയനം/കിടക്ക ഉണ്ടായവളായി.’ ഇത് ഒരേ പുരുഷനിൽനിന്നുള്ള ഗർഭധാരണത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: അതുമാത്രമല്ല, ...യും
  rationale: പൗലൊസിന്റെ മുൻവാദത്തോട് മറ്റൊരു ഉദാഹരണം കൂട്ടിച്ചേർക്കുന്ന പരസ്പരബന്ധിത പ്രയോഗം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ῥεβέκκα
  choice: റിബെക്ക
  rationale: പൂർവമാതാവിന്റെ ഗ്രീക്ക് പേരിനോട് ചേർന്നുനിൽക്കുന്ന, മലയാളത്തിൽ പരിചിതമായ ലിപ്യന്തരണം.
- source_word: ἐξ ἑνός
  choice: ഒരേ പുരുഷനിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ ‘ഒരുവനിൽനിന്ന്’ എന്നാണ്; സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ഒരൊറ്റ പുരുഷനായ പിതാവിനെയാണ്. ‘പുരുഷൻ’ എന്നത് വ്യക്തമാക്കുകയും ഇരട്ടകൾക്ക് ഒരേ പിതാവാണെന്ന വാദം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: κοίτην ἔχουσα
  choice: ഗർഭം ധരിച്ചപ്പോൾ
  rationale: അക്ഷരാർഥത്തിൽ കിടക്ക/ശയനം ഉൾക്കൊള്ളുന്ന ഈ പ്രയോഗം ഇവിടെ ലൈംഗികസംഗമത്തിലൂടെയുള്ള ഗർഭധാരണത്തെ സൂചിപ്പിക്കുന്നു. പങ്കാളിക്രിയയുടെ തുടർച്ചയും അടുത്ത വാക്യത്തോടുള്ള വ്യാകരണബന്ധവും ‘ധരിച്ചപ്പോൾ’ നിലനിർത്തുന്നു.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: നമ്മുടെ പിതാവായ യിസ്ഹാക്കിൽനിന്ന്
  rationale: പൂർവികബന്ധം സൂചിപ്പിക്കുന്ന ‘നമ്മുടെ പിതാവ്’ നേരിട്ട് നിലനിർത്തുകയും ἐξ ἑνός സൂചിപ്പിക്കുന്ന ഒരേയൊരു പുരുഷൻ യിസ്ഹാക്കാണെന്ന് വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ തിരഞ്ഞെടുപ്പുസംബന്ധമായ വാദത്തിൽ ഗർഭധാരണ/ശയനപ്രയോഗം എത്ര വ്യക്തമാക്കണം
  choice: റിബെക്ക ഒരേ പുരുഷനായ യിസ്ഹാക്കിൽനിന്ന് ഗർഭം ധരിച്ചു എന്നു വ്യക്തമാക്കുന്നു
  alternative: ‘ഒരുവനിൽനിന്ന് ശയനം ഉണ്ടായവളായി’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപം
  rationale: ഇവിടെ ഇരട്ടകൾക്ക് ഒരേ അമ്മയും ഒരേ അപ്പനുമാണെന്നതാണ് വാദത്തിന് പ്രസക്തം. മലയാളത്തിൽ അസ്വാഭാവികവും തെറ്റിദ്ധാരണാജനകവുമായ ‘ശയനം’ എന്ന അക്ഷരാർഥം ഒഴിവാക്കി ആശയം വ്യക്തമാക്കുന്നു; തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള തുടർവാക്യത്തിലെ നിഗമനം മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- issue: വാക്യം 11-ലേക്ക് നീളുന്ന ഗ്രീക്ക് ഘടന
  choice: ‘ഗർഭം ധരിച്ചപ്പോൾ’ എന്ന അപൂർണ്ണ കാലവാക്യരൂപം നിലനിർത്തുന്നു
  alternative: വാക്യം 10-ൽ തന്നെ ‘ഗർഭം ധരിച്ചു’ എന്ന് പൂർണ്ണവാക്യമാക്കുക
  rationale: SBLGNT-യിൽ പങ്കാളിക്രിയയോടെ ആരംഭിക്കുന്ന ചിന്ത അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നു. മലയാളത്തിലും ആ ബന്ധവും പ്രതീക്ഷയും നിലനിർത്തുന്നത് ഉറവിടഘടനയോട് കൂടുതൽ വിശ്വസ്തമാണ്.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഒരേ പുരുഷനിൽനിന്ന്’ എന്ന രൂപം സന്ദർഭത്തിലെ ഏകപിതൃത്വം വ്യക്തമാക്കുന്നു; ഡാഷുകൾ വിശദീകരണസമാനപദബന്ധം വായിക്കാൻ സഹായിക്കുന്നു. വാക്യം 11-ലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ‘ധരിച്ചപ്പോൾ’ ഉപയോഗിച്ചു.
