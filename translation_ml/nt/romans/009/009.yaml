id: ROM.9.9
reference: Romans 9:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഇത് വാഗ്ദാനത്തിന്റെ വചനമാണ്: “ഈ സമയത്ത് ഞാൻ വരും[a]; സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടാകും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ മടങ്ങിവരും.” ഇവിടെ ഗ്രീക്കിൽ “ഞാൻ വരും” എന്നാണ്; എന്നാൽ ഉല്പത്തിയിലെ പശ്ചാത്തലവാക്യം പ്രതിഫലിപ്പിച്ച് ചില വിവർത്തനങ്ങൾ “മടങ്ങിവരും” എന്നു നൽകുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: വാഗ്ദാനത്തിന്റെ
  rationale: λόγος എന്ന പദത്തെ വിശേഷിപ്പിക്കുന്ന ഈ ജനിറ്റീവ് ദൈവിക വാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘വാഗ്ദാനത്തിന്റെ വചനം’ സ്വാഭാവികവും സന്ദർഭോചിതവുമാണ്.
- source_word: λόγος
  choice: വചനം
  rationale: ഇവിടെ ഉദ്ധരിക്കപ്പെടുന്ന ദൈവിക അരുളപ്പാടിനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘വചനം’ അർഥവും ഗൗരവമുള്ള ശൈലിയും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: (പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധം മലയാളത്തിൽ സന്ദർഭവും ‘ഇതാണ്’ എന്ന ഘടനയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഒറ്റവാക്യമായി വായിക്കുമ്പോൾ കൃത്രിമമാകും.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: ഈ സമയത്ത്
  rationale: നിർദിഷ്ടമായ ഭാവികാലത്തെ സൂചിപ്പിക്കുന്ന വാഗ്ദാനസൂത്രം നേരിട്ട്, സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘നിയമിത സമയത്ത്’ എന്ന വ്യാഖ്യാനം മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തത ചേർക്കും.
- source_word: ἐλεύσομαι
  choice: ഞാൻ വരും
  rationale: ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വരും’ എന്നാണ്; ഉല്പത്തി പശ്ചാത്തലത്തെ ആശ്രയിച്ചുള്ള ‘മടങ്ങിവരും’ എന്നത് അടിക്കുറിപ്പിൽ മാത്രം സൂചിപ്പിക്കുന്നു.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടാകും
  rationale: അക്ഷരാർഥത്തിൽ ‘സാറായ്ക്ക് ഒരു മകൻ ഉണ്ടായിരിക്കും’ എന്ന ദത്തിവ്-ഉടമസ്ഥതാ ഘടനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Σάρρᾳ
  choice: സാറാ
  rationale: വ്യക്തിനാമത്തിന്റെ പ്രചാരത്തിലുള്ള മലയാള ലിപ്യന്തരണം ഉപയോഗിക്കുന്നു.
- source_word: υἱός
  choice: മകൻ
  rationale: പദം പ്രത്യേകമായി പുത്രനെ സൂചിപ്പിക്കുന്നു; അബ്രാഹാം–സാറാ വാഗ്ദാനസന്ദർഭത്തിലെ ലിംഗസൂചന നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിനോടുള്ള വാഗ്ദാനത്തിന്റെ ഉദ്ധരണിയും ദൈവിക പ്രവർത്തനവും
  choice: ദൈവത്തിന്റെ നേരിട്ടുള്ള വാക്കായി വാഗ്ദാനം ലളിതമായി അവതരിപ്പിച്ച് ‘ഞാൻ വരും’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ഉല്പത്തി വിവർത്തനപാരമ്പര്യവുമായി കൂടുതൽ തുറന്ന പൊരുത്തത്തിനായി ‘ഞാൻ മടങ്ങിവരും’ എന്നു നൽകുക.
  rationale: പൗലോസിന്റെ ഗ്രീക്ക് ഉദ്ധരണിയിൽ ἔρχομαι എന്നത് ‘വരുക’ എന്നാണ്; അതിനാൽ ദൈവിക വാഗ്ദാനത്തിന്റെ പ്രാബല്യം നിലനിർത്തിക്കൊണ്ട് റോമർ ലേഖനത്തിലെ മൂലപദത്തിന് മുൻഗണന നൽകുന്നു. പശ്ചാത്തലത്തിലെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ദൈവിക ഉദ്ധരണിക്ക് ‘വചനം’ ഉപയോഗിച്ചു; അനാവശ്യമായ സഭാവിഭാഗ-സവിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
