id: ROM.9.33
reference: Romans 9:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ[a]: “ഇതാ, സീയോനിൽ ഇടർച്ചയ്ക്കുള്ള ഒരു കല്ലും വീഴ്ചയ്ക്കിടയാക്കുന്ന ഒരു പാറയും ഞാൻ സ്ഥാപിക്കുന്നു; അവനിൽ[b] വിശ്വസിക്കുന്നവൻ അപമാനിതനാകുകയില്ല[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പൗലോസ് യെശയ്യാവ് 8:14-ഉം 28:16-ഉം ചേർത്ത് ഉദ്ധരിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “അവന്റെമേൽ.” “അതിൽ” എന്നും പരിഭാഷപ്പെടുത്താം; അപ്പോൾ സർവനാമം കല്ലിനെ സൂചിപ്പിക്കുന്നു. എന്നാൽ പൗലോസിന്റെ സന്ദർഭം ഈ രൂപകത്തെ മിശിഹായ്ക്ക് ബാധകമാക്കുന്നു.
    reason: lexical_and_referential_alternative
  - marker: c
    text: “ലജ്ജിക്കേണ്ടിവരുകയില്ല” അല്ലെങ്കിൽ “നിരാശനാകുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്തിൽനിന്നുള്ള ഉദ്ധരണി പരിചയപ്പെടുത്തുന്ന പതിവ് സൂത്രവാക്യത്തിന്റെ പൂർത്തീകരിക്കപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ἰδοὺ
  choice: ഇതാ
  rationale: ശ്രദ്ധ ക്ഷണിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ശക്തി ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ നേരിട്ട് നൽകുന്നു.
- source_word: τίθημι
  choice: ഞാൻ സ്ഥാപിക്കുന്നു
  rationale: വർത്തമാനകാലം നിലനിർത്തുകയും കല്ല് ഉറപ്പിച്ച് വെക്കുന്ന നിർമ്മാണരൂപകത്തിന് യോജിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν Σιὼν
  choice: സീയോനിൽ
  rationale: ἐν എന്ന സ്ഥലസൂചകത്തിന്റെ സാധാരണ അർഥം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: λίθον προσκόμματος
  choice: ഇടർച്ചയ്ക്കുള്ള ഒരു കല്ല്
  rationale: പ്രസκόμμαയുടെ ഇടറിവീഴാൻ കാരണമാകുന്ന അർഥവും ഗ്രീക്കിലെ നാമബന്ധവും നിലനിർത്തുന്നു.
- source_word: πέτραν σκανδάλου
  choice: വീഴ്ചയ്ക്കിടയാക്കുന്ന ഒരു പാറ
  rationale: മുൻപത്തെ 'ഇടർച്ച' എന്ന പ്രയോഗത്തോട് അനാവശ്യമായ പൂർണ ആവർത്തനം ഒഴിവാക്കിക്കൊണ്ട്, σκάνδαλον സൂചിപ്പിക്കുന്ന കെണി/വീഴ്ചയുടെ കാരണത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: ὁ πιστεύων
  choice: വിശ്വസിക്കുന്നവൻ
  rationale: നാമവത്കരിച്ച ഏകവചന കൃദന്തത്തിന്റെ പൊതുവായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἐπ’ αὐτῷ
  choice: അവനിൽ
  rationale: വിശ്വാസത്തിന്റെ ആശ്രയത്തെ സൂചിപ്പിക്കുന്ന ἐπίയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പുരുഷലിംഗ സർവനാമവും പൗലോസിന്റെ സന്ദർഭത്തിലെ വ്യക്തിപരമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: καταισχυνθήσεται
  choice: അപമാനിതനാകുകയില്ല
  rationale: ഭാവികാല നിഷേധവും കർമണിഭാവവും മാന–അപമാന സൂക്ഷ്മതയും നിലനിർത്തുന്നു; വെറും നിരാശപ്പെടുക എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: സംയുക്ത യെശയ്യാ ഉദ്ധരണിയിലെ αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതവിഷയം
  choice: ‘അവനിൽ’ എന്ന് വ്യക്തിപരമായി പരിഭാഷപ്പെടുത്തി; പൗലോസിന്റെ സന്ദർഭത്തിൽ കല്ല്/പാറയുടെ രൂപകം മിശിഹായ്ക്ക് ബാധകമാകുന്നു.
  alternative: ‘അതിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി കല്ലിനെ വ്യാകരണപരമായ മുൻവിഷയമായി മാത്രം കാണാം.
  rationale: ഗ്രീക്കിൽ αὐτῷ പുരുഷലിംഗമാണ്; റോമർ 9:32–33; 10:11 എന്നീ സന്ദർഭങ്ങൾ ഈ ഉദ്ധരണിയെ വ്യക്തിപരമായും മിശിഹാകേന്ദ്രിതമായും പ്രയോഗിക്കുന്നു. അടിക്കുറിപ്പ് രൂപകത്തിലെ വ്യാകരണപരമായ മറ്റൊരു വായന മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി സ്വീകരിച്ചു. ‘ഇതാ’, ‘സീയോൻ’, ‘അപമാനിതനാകുക’ എന്നിവ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാണ്. സമാന്തര രൂപകങ്ങളായ കല്ലും പാറയും വേർതിരിച്ചുതന്നെ സൂക്ഷിച്ചു.
