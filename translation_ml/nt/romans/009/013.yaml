source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Τὸν Ἰακὼβ ἠγάπησα, τὸν δὲ Ἠσαῦ ἐμίσησα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “യാക്കോബിനെ ഞാൻ സ്നേഹിച്ചു; എന്നാൽ ഏശാവിനെ ഞാൻ വെറുത്തു.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഞാൻ തള്ളിക്കളഞ്ഞു” എന്നും “ഞാൻ കുറവായി സ്നേഹിച്ചു” എന്നും. ഇവിടെ ഉദ്ധരിക്കുന്നത് മലാഖി 1:2–3 ആണ്; ‘വെറുത്തു’ എന്നത് വൈകാരിക ശത്രുതയെക്കാൾ ഉടമ്പടിപരമായ നിരാകരണമോ താരതമ്യത്തിൽ കുറഞ്ഞ മുൻഗണനയോ സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: മലാഖി 1:2–3-ൽ നിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന καθὼς γέγραπται എന്ന സംയുക്തപ്രയോഗത്തിന് സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: പൂർണകാല കർമണിരൂപത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യം സൂചിപ്പിക്കുന്ന പതിവ് തിരുവെഴുത്ത്-ഉദ്ധരണി ശൈലി സംരക്ഷിക്കുന്നു.
- source_word: Ἰακώβ
  choice: യാക്കോബ്
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം; വിഭക്തിചേർക്കുമ്പോൾ ‘യാക്കോബിനെ’.
- source_word: ἠγάπησα
  choice: ഞാൻ സ്നേഹിച്ചു
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ നേരിട്ടുള്ള അർഥവും ഉദ്ധരണിയിലെ aorist രൂപവും ലളിതമായ ഭൂതകാലത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: യാക്കോബിനോടും ഏശാവിനോടുമുള്ള വ്യത്യസ്ത നിലപാടുകൾ തമ്മിലുള്ള വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ἠσαῦ
  choice: ഏശാവ്
  rationale: മലയാളത്തിലെ പ്രചാരത്തിലുള്ള വ്യക്തിനാമരൂപം; വിഭക്തിചേർക്കുമ്പോൾ ‘ഏശാവിനെ’.
- source_word: ἐμίσησα
  choice: ഞാൻ വെറുത്തു
  rationale: μισέω എന്ന ശക്തമായ മൂലപദത്തിന്റെ നേരിട്ടുള്ള അർഥം മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ മറ്റ് സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ദൈവിക തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള ചർച്ചകളുടെയും സെമിറ്റിക് താരതമ്യപ്രയോഗത്തിന്റെയും വെളിച്ചത്തിൽ ‘വെറുത്തു’ എന്നത് മൃദൂകരിക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘ഞാൻ വെറുത്തു’ എന്ന് നിലനിർത്തുന്നു
  alternative: ‘ഞാൻ തള്ളിക്കളഞ്ഞു’ അല്ലെങ്കിൽ ‘കുറച്ചേ സ്നേഹിച്ചുള്ളൂ’
  rationale: ഗ്രീക്ക് ഉദ്ധരണിയിൽ μισέω എന്ന ശക്തമായ ക്രിയ തന്നെയാണ് ഉള്ളത്. അതിനെ മുഖ്യപാഠത്തിൽ മൃദൂകരിക്കുന്നത് വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കും; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും യഥാർഥ അവ്യക്തതയും നിലനിർത്തി മറ്റ് ധാരണകൾ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ‘വെറുത്തു’ എന്ന ശക്തമായ പദം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുകയും വിശദീകരണം അടിക്കുറിപ്പിലേക്ക് മാറ്റുകയും ചെയ്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
