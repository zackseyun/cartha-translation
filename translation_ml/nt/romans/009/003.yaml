id: ROM.9.3
reference: Romans 9:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: ml
  text: എന്തെന്നാൽ, എന്റെ സഹോദരന്മാർക്കുവേണ്ടി—അതായത്, ജഡപ്രകാരം എന്റെ സ്വജനങ്ങൾക്കുവേണ്ടി[c]—ഞാൻതന്നെ മശീഹയിൽനിന്ന് വേർപെട്ട് ശാപഗ്രസ്തനായിത്തീരാൻ[a] ആഗ്രഹിച്ചേനെ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മശീഹയിൽനിന്ന് അകന്ന് ശാപത്തിന് കീഴിലാകാൻ.’ ഗ്രീക്ക് പ്രയോഗം ശാപത്തിന് വിധേയനാകുക, മശീഹയിൽനിന്ന് വേർപെടുക എന്നീ ആശയങ്ങളെ ചേർത്തുനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘എന്റെ സഹോദരന്മാർ’; സന്ദർഭത്തിൽ പൗലൊസ് തന്റെ സഹയിസ്രായേല്യരായ വംശീയ സ്വജനങ്ങളെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: ‘ജഡപ്രകാരം’ എന്നത് ഇവിടെ ശാരീരിക വംശപരമ്പരയെയോ വംശീയബന്ധത്തെയോ സൂചിപ്പിക്കുന്നു; ‘പാപസ്വഭാവം’ എന്നല്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: ആശിച്ചുപോകുമായിരുന്നു
  rationale: അപൂർണകാലരൂപം ഇവിടെ വെറും ഭൂതകാലപ്രവൃത്തിയെയല്ല, അതിതീവ്രവും സങ്കൽപ്പാത്മകവുമായ ഒരു ആഗ്രഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ആശിച്ചുപോകുമായിരുന്നു’ എന്നത് അതിന്റെ സാധ്യതാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധവും പൗലൊസിന്റെ വാദക്രമവും വ്യക്തമാക്കുന്നു.
- source_word: ἀνάθεμα
  choice: ശാപഗ്രസ്തൻ
  rationale: ദൈവശാപത്തിന് വിധേയനായ അവസ്ഥ എന്ന ശക്തമായ അർഥം സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ നൽകുന്നു.
- source_word: αὐτὸς ἐγὼ
  choice: ഞാൻതന്നെ
  rationale: ഗ്രീക്കിലെ ഇരട്ട ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: മശീഹയിൽനിന്ന് വേർപെട്ട്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വേർപാടിന്റെ അർഥം വ്യക്തമാക്കുകയും Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ മശീഹാസൂചന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: മറ്റുള്ളവരുടെ നന്മയ്ക്കായുള്ള പ്രതിനിധിപരവും ത്യാഗപരവുമായ ഭാവം സന്ദർഭോചിതമായി നൽകുന്നു.
- source_word: τῶν ἀδελφῶν μου
  choice: എന്റെ സഹോദരന്മാർ
  rationale: മൂലത്തിലെ പുള്ളിംഗ ബഹുവചനം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പൗലൊസിന്റെ സഹയിസ്രായേല്യരെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
- source_word: τῶν συγγενῶν μου
  choice: എന്റെ സ്വജനങ്ങൾ
  rationale: അടുത്ത കുടുംബബന്ധുക്കളെക്കാൾ വിശാലമായ വംശീയബന്ധത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലൊസിന്റെ സവിശേഷ പ്രയോഗം ഔപചാരികമായി നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് പാപസ്വഭാവമല്ല, ശാരീരിക വംശപരമ്പരയാണ്.
theological_decisions:
- issue: പൗലൊസ് യഥാർഥത്തിൽ പ്രാർഥിച്ചതാണോ, സങ്കൽപ്പാത്മകമായ ആഗ്രഹം പ്രകടിപ്പിച്ചതാണോ
  choice: സാധ്യതാഭാവമുള്ള സങ്കൽപ്പാത്മക ആഗ്രഹമായി ‘ആശിച്ചുപോകുമായിരുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ആശിച്ചു’ അല്ലെങ്കിൽ ‘പ്രാർഥിച്ചു’.
  rationale: മശീഹയിൽനിന്ന് വേർപെടാൻ പൗലൊസ് യഥാർഥമായി പ്രാർഥിച്ചു എന്നു അമിതമായി നിർണ്ണയിക്കാതെ, അവന്റെ വേദനയുടെയും ആത്മത്യാഗസന്നദ്ധതയുടെയും തീവ്രത നിലനിർത്തുന്നു.
- issue: Χριστός സ്ഥാനപ്പേരായോ പേരുപോലെയോ പരിഭാഷപ്പെടുത്തുക
  choice: ‘മശീഹ’ എന്നു നൽകി.
  alternative: ‘ക്രിസ്തു’.
  rationale: ഈ സന്ദർഭത്തിൽ അഭിഷിക്തനായ രാജാവ് എന്ന സ്ഥാനപ്പേരിന്റെ ശക്തി യോജിച്ചതിനാൽ അതിനെ സുതാര്യമാക്കുന്നു.
- issue: κατὰ σάρκα എന്നതിലെ σάρξ-ന്റെ അർഥം
  choice: വംശപരമ്പരയെ സൂചിപ്പിക്കുന്ന ‘ജഡപ്രകാരം’ എന്ന പ്രയോഗം നിലനിർത്തി.
  alternative: ‘പാപസ്വഭാവപ്രകാരം’.
  rationale: ഇവിടെ പൗലൊസ് തന്റെ വംശീയബന്ധം തിരിച്ചറിയിക്കുകയാണ്; ധാർമികമായ പാപസ്വഭാവത്തെക്കുറിച്ചല്ല സംസാരിക്കുന്നത്.
- issue: ἀνάθεμα εἶναι ... ἀπὸ τοῦ Χριστοῦ എന്നതിലെ ശാപവും വേർപാടും തമ്മിലുള്ള ബന്ധം
  choice: ‘മശീഹയിൽനിന്ന് വേർപെട്ട് ശാപഗ്രസ്തനാകാൻ’ എന്നു ഏകീകൃത ആശയമായി നൽകി.
  alternative: ‘മശീഹയിൽനിന്നുള്ള ശാപമായിത്തീരാൻ’ അല്ലെങ്കിൽ ശാപവും വേർപാടും രണ്ടു സ്വതന്ത്ര കാര്യങ്ങളായി നൽകുക.
  rationale: ഗ്രീക്ക് വാക്യം ശാപവിധേയത്വത്തെയും മശീഹയിൽനിന്നുള്ള വേർപാടിനെയും അടുപ്പിച്ച് നിർത്തുന്നു; അവയുടെ കൃത്യബന്ധം അതിലധികം നിർണ്ണയിക്കാതെ പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പൗലൊസിന്റെ വികാരതീവ്രതയും വാക്യത്തിലെ സങ്കൽപ്പാത്മകതയും ഒരുമിച്ച് നിലനിർത്താൻ ‘ആശിച്ചുപോകുമായിരുന്നു’ ഉപയോഗിച്ചു; ‘ജഡപ്രകാരം’ എന്ന പൗലൊസീയ പ്രയോഗത്തിന്റെ അർഥം അടിക്കുറിപ്പിലൂടെ വ്യക്തമാക്കി.
