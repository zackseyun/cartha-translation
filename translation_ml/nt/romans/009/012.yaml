    rationale: In Greek, ἐρρέθη αὐτῇ introduces the following direct quotation, whereas the preceding ‘not from works but from the one calling’ belongs to the continuing argument. Malayalam should not attach that preceding phrase to ‘പറയപ്പെട്ടു’ with ‘എന്നു’ and then introduce a second quotation.
