id: ROM.9.12
reference: Romans 9:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: ml
  text: 'പ്രവൃത്തികളിൽനിന്നല്ല, മറിച്ച് വിളിക്കുന്നവനിൽനിന്നാണ്, അവളോടു പറയപ്പെട്ടു: “മൂത്തവൻ ഇളയവനെ സേവിക്കും.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ഉല്പത്തി 25:23-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: c
    text: അഥവാ, “വലിയവൻ ചെറിയവനെ സേവിക്കും”; യാക്കോബിന്റെയും ഏശാവിന്റെയും പശ്ചാത്തലമാണ് “മൂത്തവൻ/ഇളയവൻ” എന്ന വിവർത്തനത്തിൽ പ്രതിഫലിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: പ്രവൃത്തികളിൽനിന്നല്ല
  rationale: ἐκ + genitive സൂചിപ്പിക്കുന്ന ഉറവിടം/അടിസ്ഥാനം എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ‘പ്രവൃത്തികളുടെ അടിസ്ഥാനത്തിലല്ല’ എന്നത് കൂടുതൽ വിശദീകരണാത്മകമായതിനാൽ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: മറിച്ച് വിളിക്കുന്നവനിൽനിന്നാണ്
  rationale: τοῦ καλοῦντος എന്ന substantival present participle-ന്റെ വർത്തമാനകാലസ്വഭാവവും ദൈവത്തെ പരാമർശിക്കുന്നുവെന്ന അർത്ഥവും, ഗ്രീക്കിൽ ഇല്ലാത്ത നാമം ചേർക്കാതെ, നിലനിർത്തുന്നു.
- source_word: ἐρρέθη αὐτῇ
  choice: അവളോടു പറയപ്പെട്ടു
  rationale: aorist passive citation formula-യുടെ കർമണിപ്രയോഗം സൂക്ഷിക്കുകയും ഗ്രീക്കിൽ വ്യക്തമാക്കാത്ത കർത്താവിനെ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὅτι
  choice: ഉദ്ധരണിചിഹ്നവും ദ്വിബിന്ദുവും
  rationale: ഇവിടെ ὅτι നേരിട്ടുള്ള ഉദ്ധരണിയെ പരിചയപ്പെടുത്തുന്നു; മലയാളത്തിൽ ദ്വിബിന്ദുവും ഉദ്ധരണിചിഹ്നവും സ്വാഭാവികമായി അതു പ്രകടിപ്പിക്കുന്നു.
- source_word: Ὁ μείζων
  choice: മൂത്തവൻ
  rationale: ഉല്പത്തി 25:23-ലെ യാക്കോബ്–ഏശാവ് പശ്ചാത്തലത്തിൽ പ്രായബന്ധം ഉദ്ദേശിക്കുന്നതിനാൽ സ്വാഭാവികമായ മലയാളപ്രയോഗം; ‘വലിയവൻ’ എന്ന കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δουλεύσει
  choice: സേവിക്കും
  rationale: δουλεύω അടിമസേവനത്തിന്റെ നിഴൽവ്യഞ്ജന കൈവരിക്കാമെങ്കിലും, സഹോദരന്മാരുടെയും ജനതകളുടെയും അധീനബന്ധം സൂചിപ്പിക്കുന്ന ഈ ഉദ്ധരണിയിൽ ‘സേവിക്കും’ അർത്ഥം അമിതമായി നിർണ്ണയിക്കാതെ നൽകുന്നു.
- source_word: τῷ ἐλάσσονι
  choice: ഇളയവനെ
  rationale: മείζων എന്നതോടുള്ള വിരുദ്ധജോടിയും ഉല്പത്തി പശ്ചാത്തലവും കണക്കിലെടുത്ത് പ്രായത്തിൽ ഇളയവനെ സൂചിപ്പിക്കുന്നു; ‘ചെറിയവൻ’ എന്ന രൂപം സാധ്യമായ പദാനുപദ പര്യായമാണ്.
theological_decisions:
- issue: ‘പ്രവൃത്തികളിൽനിന്നല്ല, വിളിക്കുന്നവനിൽനിന്നാണ്’ എന്ന വൈരുധ്യത്തിൽനിന്ന് നിബന്ധനയില്ലാത്ത തിരഞ്ഞെടുപ്പിനെ വ്യക്തമായി ചേർത്തുപറയണമോ
  choice: വാക്യത്തിലെ സംക്ഷിപ്തമായ വൈരുധ്യം വ്യാഖ്യാനവിപുലീകരണമില്ലാതെ നിലനിർത്തി.
  alternative: ‘പ്രവൃത്തികൾ കാരണമല്ല, വിളിക്കുന്ന ദൈവമാണ് കാരണം’ എന്ന വിപുലീകരണം.
  rationale: വാക്യം പ്രവൃത്തികളെയും ദൈവത്തിന്റെ വിളിയെയും തമ്മിൽ വ്യക്തമായി വേർതിരിക്കുന്നുവെങ്കിലും, വിശാലമായ സിദ്ധാന്തനിഗമനം ഈ ഒറ്റവാക്യത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ നിർണ്ണയാത്മകമാകും.
- issue: മείζων/ἐλάσσων എന്ന താരതമ്യപദങ്ങൾ പ്രായമോ പദവിയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ഉല്പത്തി പശ്ചാത്തലത്തെ അനുസരിച്ച് ‘മൂത്തവൻ/ഇളയവൻ’ എന്നു മുഖ്യപാഠത്തിൽ നൽകി; ‘വലിയവൻ/ചെറിയവൻ’ എന്ന ഔപചാരിക സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
  alternative: ‘വലിയവൻ ചെറിയവനെ സേവിക്കും.’
  rationale: യാക്കോബ്–ഏശാവ് പശ്ചാത്തലം പ്രായബന്ധമുള്ള വായനയെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; എന്നാൽ ഗ്രീക്ക് താരതമ്യപദങ്ങളുടെ കൂടുതൽ വിശാലമായ അർത്ഥസാധ്യത പൂർണമായി ഇല്ലാതാക്കാതിരിക്കാൻ അടിക്കുറിപ്പ് ചേർത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘പ്രവൃത്തികളിൽനിന്നല്ല … വിളിക്കുന്നവനിൽനിന്നാണ്’ എന്ന സമാന്തരഘടന പൗലോസിന്റെ സംക്ഷിപ്ത വൈരുധ്യം നിലനിർത്തുന്നു. കർമണിപ്രയോഗമായ ‘പറയപ്പെട്ടു’ ഉദ്ധരണിസൂത്രത്തിന്റെ ഔപചാരികത സംരക്ഷിക്കുന്നു.
