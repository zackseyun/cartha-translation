revisions:
- from: എന്നാൽ നീതിയുടെ[a] ഒരു നിയമത്തെ പിന്തുടർന്ന ഇസ്രായേൽ, ആ നിയമത്തിൽ എത്തിച്ചേർന്നില്ല[b].
  to: എന്നാൽ നീതിയുടേതായ ഒരു നിയമത്തെ പിന്തുടർന്നുകൊണ്ടിരുന്ന ഇസ്രായേൽ, ആ നിയമത്തിലെത്തിച്ചേർന്നില്ല[b].
  rationale: The revision corrects the directional force of εἰς in the final phrase and improves the natural expression of the ongoing participial pursuit. The optional ‘justice’ note is omitted because «നീതിന്യായത്തിന്റെ ഒരു നിയമം» is not a sufficiently natural Malayalam lexical alternative and the main rendering already preserves the source ambiguity without doctrinal expansion.
