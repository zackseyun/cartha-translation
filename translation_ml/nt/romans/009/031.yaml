  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: ml
  text: എന്നാൽ നീതിയുടേതായ ഒരു നിയമത്തെ പിന്തുടർന്നുകൊണ്ടിരുന്ന ഇസ്രായേൽ, ആ നിയമത്തിലെത്തിച്ചേർന്നില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘അതിലേക്കെത്തിയില്ല’ എന്നോ ‘ആ നിയമത്തിലെത്തിച്ചേർന്നില്ല’ എന്നോ പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും വ്യാഖ്യാനിക്കാൻ പ്രയാസമുള്ളതുമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: ഇസ്രായേൽ
  rationale: പൗലോസിന്റെ വാദത്തിൽ ജനതയായ ഇസ്രായേലിനെ സൂചിപ്പിക്കുന്ന പേരിന്റെ മലയാളത്തിലെ പ്രചാരത്തിലുള്ള രൂപം.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ജാതികളുമായുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: διώκων
  choice: പിന്തുടർന്ന
  rationale: ലക്ഷ്യം നേടാൻ സജീവമായി ശ്രമിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത ‘എങ്കിലും’ എന്ന concessive ഭാവം ചേർക്കുന്നില്ല.
- source_word: νόμον δικαιοσύνης
  choice: നീതിയുടെ ഒരു നിയമം
  rationale: അനിശ്ചിതമായ νόμον എന്ന രൂപത്തെ ‘ഒരു നിയമം’ എന്നു നിലനിർത്തുകയും, δικαιοσύνης എന്ന ഷഷ്ഠീബന്ധത്തിന്റെ സംക്ഷിപ്തത വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ദൈവസന്നിധിയിലെ ശരിയായ നിലയെന്ന ആശയവും നൈതിക ശരിതനിമയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാളപദം; ‘നീതിന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰς νόμον
  choice: ആ നിയമത്തിൽ
  rationale: ആവർത്തിക്കുന്ന νόμον മുമ്പ് പറഞ്ഞ നിയമത്തെ തിരിച്ചുസൂചിപ്പിക്കുന്നതായി അവതരിപ്പിക്കുന്നു; ‘നിയമത്തിന്റെ ലക്ഷ്യത്തിലേക്ക്’ എന്ന അധിക വ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: οὐκ ἔφθασεν
  choice: എത്തിച്ചേർന്നില്ല
  rationale: ലക്ഷ്യസ്ഥാനത്ത് എത്തുന്നതിൽ പരാജയപ്പെട്ടുവെന്ന അർഥം നൽകുകയും ഗ്രീക്കിലെ സംക്ഷിപ്ത പ്രയോഗം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സന്ദർഭത്തിൽ δικαιοσύνη എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: നീതിന്യായം
  rationale: ഇവിടെ പൗലോസിന്റെ വാദത്തിലുള്ള ശരിയായ നില/നീതിയെന്ന ആശയത്തിന് ‘നീതി’ യോജിക്കുന്നു; നിയമപരമായ ‘നീതിന്യായം’ എന്ന പദസാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: νόμον δικαιοσύνης എന്ന ബന്ധത്തിന്റെ വ്യാഖ്യാനം
  choice: നീതിയുടെ ഒരു നിയമം
  alternative: നീതിയിലേക്കു നയിക്കുന്ന ഒരു നിയമം
  rationale: നിയമം നീതി നൽകുന്നു എന്ന കാരണബന്ധം മൂലപാഠം തുറന്നുപറയുന്നില്ല; അതിനാൽ ഷഷ്ഠീബന്ധത്തിന്റെ യഥാർഥ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. മൂലപാഠത്തിലെ ആവർത്തനവും വാക്യഘടനയിലെ ദുഷ്കരതയും അമിതമായി വിശദീകരിക്കാതെ സൂക്ഷിച്ചിട്ടുണ്ട്.
