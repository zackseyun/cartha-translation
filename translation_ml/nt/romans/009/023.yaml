id: ROM.9.23
reference: Romans 9:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: ml
  text: കൂടാതെ, മഹത്ത്വത്തിനായി അവൻ മുൻകൂട്ടി ഒരുക്കിയ കരുണാപാത്രങ്ങളിന്മേൽ തന്റെ മഹത്ത്വത്തിന്റെ സമൃദ്ധി അറിയിക്കേണ്ടതിനുമായി,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: തന്റെ മഹത്ത്വത്തിന്റെ സമൃദ്ധി
  rationale: ഗ്രീക്കിലെ ഏകവചനമായ πλοῦτον സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ ‘സമൃദ്ധി’ എന്നു നൽകി; ബന്ധവാക്യത്തിന്റെ ഘടനയും നിലനിർത്തി.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: കരുണാപാത്രങ്ങളിന്മേൽ
  rationale: ἐπί എന്നതിന്റെ ‘മേൽ/ഇന്മേൽ’ എന്ന ദിശാഭാവം സംരക്ഷിച്ചു; σκεύη എന്ന പാത്രരൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി.
- source_word: ἃ προητοίμασεν
  choice: മുൻകൂട്ടി ഒരുക്കിയവരാണ് അവർ
  rationale: προητοιμάζω എന്ന ക്രിയയിലെ മുൻകൂർ ഒരുക്കത്തിന്റെ ആശയം വ്യക്തമായി നൽകി; കർത്താവായ ‘അവൻ’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നിലനിർത്തി.
- source_word: εἰς δόξαν
  choice: മഹത്ത്വത്തിനായി
  rationale: εἰς എന്നതിലെ ലക്ഷ്യ/ഉദ്ദേശ്യഭാവം ‘-ത്തിനായി’ കൊണ്ട് പ്രകടിപ്പിച്ചു; δόξα മുമ്പത്തെ അതേ പദവുമായി ഏകീകരിച്ചു.
theological_decisions:
- issue: വാക്യം 22-ൽ ആരംഭിക്കുന്ന ദീർഘമായ വ്യവസ്ഥാപിത ചോദ്യവാക്യത്തിന്റെ തുടർച്ചയാണ്
  choice: ‘അറിയിക്കേണ്ടതിനും’ എന്ന അപൂർണ്ണ-തുടർച്ചാ രൂപവും അവസാനത്തെ ദീർഘവിരാമവും ഉപയോഗിച്ചു
  alternative: ഇത് സ്വതന്ത്രമായ പൂർണ്ണവാക്യമാക്കി മാറ്റുക
  rationale: καὶ ἵνα മുൻവാക്യവുമായി വാക്യഘടനാപരമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നു; സ്വതന്ത്രവാക്യമാക്കുന്നത് മൂലത്തിലെ ഉദ്ദേശ്യബന്ധം മങ്ങിക്കും.
- issue: ‘അവൻ മുൻകൂട്ടി ഒരുക്കിയത്’ ആരെ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം
  choice: ബന്ധസർവനാമത്തിന്റെ നേരിട്ടുള്ള പൂർവ്വപദമായ ‘കരുണാപാത്രങ്ങൾ’ തന്നെയാണ് ഒരുക്കപ്പെട്ടവർ എന്നു വ്യാകരണാനുസൃതമായി വിവർത്തനം ചെയ്തു
  alternative: അവരുടെ പ്രവൃത്തികളെയോ മഹത്ത്വത്തെയോ മുൻകൂട്ടി ഒരുക്കിയതായി വ്യാഖ്യാനിക്കുക
  rationale: ἃ എന്ന നപുംസക ബഹുവചന ബന്ധസർവനാമം σκεύη എന്ന നപുംസക ബഹുവചന പദത്തോടാണ് നേരിട്ട് യോജിക്കുന്നത്; അതിനപ്പുറം ഒരു സിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘കരുണാപാത്രങ്ങൾ’ എന്ന സംയുക്തപദം സാധാരണ വായനക്കാരന് ഗ്രഹിക്കാവുന്ന രീതിയിൽ ബൈബിളിലെ പാത്രരൂപകം സംരക്ഷിക്കുന്നു. വാക്യഭാഗത്തിന്റെ മുൻവാക്യാശ്രിതത്വം ദീർഘവിരാമത്തിലൂടെ സൂചിപ്പിച്ചു.
