id: ROM.11.31
reference: Romans 11:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: ml
  text: അതുപോലെ, ഇവരും ഇപ്പോൾ അനുസരണക്കേടു കാണിച്ചിരിക്കുന്നു; നിങ്ങൾക്കു ലഭിച്ച കരുണയാൽ അവർക്കും ഇപ്പോൾ കരുണ ലഭിക്കേണ്ടതിനാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നിങ്ങളുടെ കരുണയാൽ.” ഗ്രീക്ക് പ്രയോഗം കൂടുതൽ അക്ഷരാർഥത്തിൽ ഇങ്ങനെ പരിഭാഷപ്പെടുത്താം; എന്നാൽ സന്ദർഭത്തിൽ, ദൈവം നിങ്ങൾക്കു കാണിച്ച കരുണയെയാണ് അത് മിക്കവാറും സൂചിപ്പിക്കുന്നത്.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: അതുപോലെ
  rationale: മുൻവാക്യത്തോടുള്ള താരതമ്യവും ആശയബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οὗτοι
  choice: ഇവരും
  rationale: സന്ദർഭത്തിൽ ഇസ്രായേലിനെ ചൂണ്ടിക്കാണിക്കുന്ന സർവനാമത്തിന്റെ സൂചനാബലം നിലനിർത്തുന്നു; καίയുടെ ഉൾപ്പെടുത്തൽഭാവവും ചേർക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: രക്ഷാചരിത്രത്തിലെ ഇപ്പോഴത്തെ ഘട്ടത്തെ സൂചിപ്പിക്കുന്ന കാലപരമായ ഊന്നൽ രണ്ടിടത്തും നിലനിർത്തുന്നു.
- source_word: ἠπείθησαν
  choice: അനുസരിക്കാതിരിക്കുന്നു
  rationale: ἀπειθέω എന്ന പദത്തിലെ അനുസരണക്കേടിന്റെയും അവിശ്വാസത്തിന്റെയും വിശാലമായ ഉടമ്പടിസംബന്ധിയായ അർഥം, വെറും ബൗദ്ധിക അവിശ്വാസമായി ചുരുക്കാതെ നൽകുന്നു.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: നിങ്ങൾക്കു ലഭിച്ച കരുണയിലൂടെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ദത്തിവ് പ്രയോഗം ദൈവത്തിൽനിന്ന് വിജാതീയ വിശ്വാസികൾക്കു ലഭിച്ച കരുണയെ സൂചിപ്പിക്കുന്നതായി സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; വാക്യഘടനയിലെ സാധ്യമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἵνα
  choice: ലഭിക്കേണ്ടതിനാണ്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ αὐτοὶ
  choice: അവർക്കും
  rationale: ഇസ്രായേലും ദൈവകരുണയിൽ ഉൾപ്പെടുന്നു എന്ന ഊന്നൽ ലളിതമായി നിലനിർത്തുന്നു.
- source_word: ἐλεηθῶσιν
  choice: കരുണ ലഭിക്കുക
  rationale: ദൈവം നൽകുന്ന കരുണയെ സൂചിപ്പിക്കുന്ന കർമണിപ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: “നിങ്ങളുടെ കരുണ” എന്നത് വിജാതീയ വിശ്വാസികൾ കാണിക്കുന്ന കരുണയെയാണോ, ദൈവം അവർക്കു നൽകിയ കരുണയെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: നിങ്ങൾക്കു ലഭിച്ച കരുണയിലൂടെ
  alternative: നിങ്ങളുടെ കരുണയിലൂടെ
  rationale: റോമർ 11:30–32-ൽ അനുസരണക്കേടിലായിരുന്ന രണ്ടു വിഭാഗങ്ങൾക്കും ദൈവകരുണ ലഭിക്കുന്നതിനെക്കുറിച്ചാണ് താരതമ്യം. അതിനാൽ വിജാതീയർക്കു ദൈവം നൽകിയ കരുണ എന്നാണ് മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കിയത്; ഗ്രീക്ക് പ്രയോഗത്തിന്റെ യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ആവർത്തിച്ചുള്ള “ഇപ്പോൾ” നിലനിർത്തി. ദൈവത്തെ കർത്താവായി പാഠത്തിൽ തുറന്നു ചേർക്കാതെ, ദൈവിക കർമണി കരുണ ‘ലഭിക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ സൂക്ഷിച്ചു.
