id: ROM.11.12
reference: Romans 11:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: ml
  text: അവരുടെ അതിക്രമം ലോകത്തിന് സമ്പത്തും അവരുടെ നഷ്ടം[a] ജനതകൾക്ക് സമ്പത്തും ആയെങ്കിൽ, അവരുടെ പൂർണത[b] എത്രയധികം സമ്പത്തായിരിക്കും!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “അവരുടെ നഷ്ടം” എന്നതിന് “അവരുടെ പരാജയം” എന്നോ “അവരുടെ കുറവ്” എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: “അവരുടെ പൂർണത” എന്നതിന് “അവരുടെ പൂർണസംഖ്യ” എന്നോ “അവരുടെ പൂർണമായ ഉൾപ്പെടുത്തൽ” എന്നോ അർഥമാകാം. ഗ്രീക്കിൽ അവസാനഭാഗം അക്ഷരാർഥത്തിൽ “അവരുടെ പൂർണത എത്രയധികം!” എന്നാണ്; “സമ്പത്തായിരിക്കും” എന്നത് മുൻപത്തെ സമാന്തര ഉപവാക്യങ്ങളിൽനിന്ന് പൂരിപ്പിച്ചതാണ്.
    reason: ambiguity_and_ellipsis
lexical_decisions:
- source_word: παράπτωμα
  choice: അതിക്രമം
  rationale: തെറ്റായ ചുവട്, കുറ്റം, ലംഘനം എന്നീ ധാർമിക സൂചനകൾ ഉൾക്കൊള്ളുന്ന പദം; സന്ദർഭത്തിൽ കുറ്റകരമായ പ്രവൃത്തിയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πλοῦτος
  choice: സമ്പത്ത്
  rationale: ദൈവിക അനുഗ്രഹത്തിന്റെ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: κόσμου
  choice: ലോകം
  rationale: ഇസ്രായേലിന് അപ്പുറമുള്ള വിശാലമായ മനുഷ്യലോകത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്കിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
- source_word: ἥττημα
  choice: നഷ്ടം
  rationale: പരാജയം, കുറവ്, നഷ്ടം എന്നീ സാധ്യതകളിൽ ഒന്നിനെ അതിയായി നിർണയിക്കാതെ അപൂർവമായ ഗ്രീക്ക് പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: ἐθνῶν
  choice: ജനതകൾ
  rationale: ἔθνη എന്നതിന്റെ അടിസ്ഥാന അർഥം നിലനിർത്തുകയും യെഹൂദേതര ജനങ്ങളെ സന്ദർഭത്തിൽ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികം
  rationale: കുറഞ്ഞതിൽനിന്ന് കൂടുതലിലേക്കുള്ള പൗലോസിന്റെ താരതമ്യവാദം സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: πλήρωμα
  choice: പൂർണത
  rationale: പൂർണസംഖ്യ, പൂർണമായ ഉൾപ്പെടുത്തൽ, പുനഃസ്ഥാപനം എന്നീ സാധ്യതകളെ മുഖ്യവാചകത്തിൽ തീർപ്പാക്കാതെ ഗ്രീക്കിന്റെ ഉദ്ദേശ്യപൂർവമായ വിശാലത സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τὸ πλήρωμα αὐτῶν എന്നതിന്റെ സൂചന
  choice: അവരുടെ പൂർണത
  alternative: അവരുടെ പൂർണസംഖ്യ; അവരുടെ പൂർണമായ ഉൾപ്പെടുത്തൽ; അവരുടെ പുനഃസ്ഥാപനം
  rationale: ഇവിടെ പ്രയോഗം സംക്ഷിപ്തവും ബഹുവ്യഞ്ജകവുമാണ്; ഇസ്രായേലിന്റെ സംഖ്യയെയോ ഉൾപ്പെടുത്തലെയോ അന്തിമ പുനഃസ്ഥാപനത്തെയോ മാത്രം നിർബന്ധിക്കുന്നില്ല.
- issue: അവസാന ഉപവാക്യത്തിലെ സൂചിത ഫലം
  choice: എത്രയധികം അനുഗ്രഹമാകും
  alternative: അവരുടെ പൂർണത എത്രയധികം!
  rationale: ഗ്രീക്കിൽ അവസാനിക്കുന്ന വാക്യം ക്രിയയും ഫലസൂചക നാമവും വിട്ടുകളയുന്നു; മുൻപത്തെ ‘സമ്പത്ത്’ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിനായി ‘അനുഗ്രഹം’ എന്നു വ്യക്തമാക്കുന്നു, എന്നാൽ അതൊരു സൂചിതപൂരണമാണെന്ന് അടിക്കുറിപ്പിൽ അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അതിക്രമം—നഷ്ടം—പൂർണത’, ‘ലോകം—ജനതകൾ’ എന്നീ സമാന്തര ഘടനകൾ പരമാവധി നിലനിർത്തി.
