id: ROM.11.6
reference: Romans 11:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: ml
  text: എന്നാൽ കൃപയാലാണെങ്കിൽ, അത് ഇനി പ്രവൃത്തികളിൽനിന്നല്ല; അല്ലെങ്കിൽ കൃപ ഇനി കൃപയായിത്തീരുന്നില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: കൃപയാൽ
  rationale: ദൈവത്തിന്റെ അർഹിക്കാത്ത അനുഗ്രഹം എന്ന പൗലോസിന്റെ ആശയം സ്വാഭാവികവും സഭാപാരമ്പര്യത്തിൽ സുപരിചിതവുമായ പദത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ ἔργων
  choice: പ്രവൃത്തികളിൽനിന്ന്
  rationale: ἐκ എന്ന ഉറവിട/അടിസ്ഥാന സൂചന സംരക്ഷിക്കുകയും കൃപയും പ്രവൃത്തികളും തമ്മിലുള്ള വാക്യത്തിലെ വൈരുധ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: γίνεται
  choice: ആയിത്തീരുന്നില്ല
  rationale: ‘ആകുന്നു/ആയിത്തീരുന്നു’ എന്ന ക്രിയാത്മക ഭാവം ഒഴിവാക്കാതെ, കൃപയുടെ സ്വഭാവം നഷ്ടപ്പെടുമെന്ന വാദത്തിന്റെ രൂപം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കൃപയും പ്രവൃത്തികളും തമ്മിലുള്ള ബന്ധം
  choice: കൃപയാലാണെങ്കിൽ, അത് ഇനി പ്രവൃത്തികളിൽനിന്നല്ല
  alternative: കൃപയാലാണെങ്കിൽ, അത് പ്രവൃത്തികളുടെ അടിസ്ഥാനത്തിലല്ല
  rationale: വ്യാഖ്യാനപരമായി ‘അടിസ്ഥാനത്തിൽ’ എന്നു വികസിപ്പിക്കാതെ, ഗ്രീക്കിലെ ഉറവിടസൂചനയും പൗലോസിന്റെ കൃത്യമായ വൈരുധ്യവും നിലനിർത്തുന്നു.
- issue: കൃപ ‘കൃപയായിത്തീരുന്നില്ല’ എന്ന ആവർത്തനം
  choice: കൃപ ഇനി കൃപയായിത്തീരുന്നില്ല
  alternative: കൃപ ഇനി കൃപയല്ല
  rationale: ചുരുക്കി സമതലപ്പെടുത്താതെ γίνεται എന്ന പദത്തിന്റെ ചലനാത്മക രൂപവും മൂലവാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ ഊന്നലും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. പൗലോസിന്റെ സംക്ഷിപ്തമായ തർക്കരീതിയും ‘കൃപ’ എന്ന പദത്തിന്റെ ആവർത്തനവും നിലനിർത്തിയിരിക്കുന്നു.
