source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: ml
  text: “ഞാൻ അവരുടെ പാപങ്ങൾ നീക്കിക്കളയുമ്പോൾ, ഇതും അവരോടുള്ള എന്റെ ഉടമ്പടിയായിരിക്കും.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: “എന്നിൽനിന്ന് അവർക്കുള്ള ഉടമ്പടി.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: ഉടമ്പടി
  rationale: പൗലോസിന്റെ തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ പശ്ചാത്തലത്തിൽ, ഈ പദം ദൈവത്തിന്റെ ബന്ധനാത്മകമായ വാഗ്ദാനത്തെ സൂചിപ്പിക്കുന്നു; ‘ഉടമ്പടി’ പഴയനിയമപരമായ ധ്വനിയും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: എന്റെ ഉടമ്പടി
  rationale: പദാനുപദമായി ‘എന്നിൽനിന്നുള്ള ഉടമ്പടി’ എന്നാണെങ്കിലും, സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്റെ ഉടമ്പടി’ ദൈവമാണ് അതിന്റെ ഉറവിടവും കർത്താവും എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: αὐτοῖς
  choice: അവരോടുള്ള
  rationale: ദത്തിവ് രൂപത്തിന് ‘അവർക്ക്’ എന്നും പറയാമെങ്കിലും, ഉടമ്പടിബന്ധത്തെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘അവരോടുള്ള’ അനുയോജ്യമാണ്.
- source_word: ὅταν
  choice: എപ്പോൾ / -ുമ്പോൾ
  rationale: ഇവിടെ ആവർത്തിതമായ ‘എപ്പോഴൊക്കെയോ’ എന്നതിലുപരി, വാഗ്ദാനം സാക്ഷാത്കരിക്കുന്ന സമയമാണ് ഉദ്ദേശിക്കുന്നത്; അതിനാൽ ‘നീക്കിക്കളയുമ്പോൾ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
- source_word: ἀφέλωμαι
  choice: നീക്കിക്കളയുമ്പോൾ
  rationale: പാപങ്ങളെ അകറ്റുകയോ നീക്കുകയോ ചെയ്യുന്നതാണ് ക്രിയയുടെ അർഥം; ‘നീക്കിക്കളയുക’ സമ്പൂർണമായ നീക്കം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἁμαρτίας
  choice: പാപങ്ങൾ
  rationale: ബഹുവചന നാമത്തിന്റെ നേരിട്ടും സ്ഥാപിതവുമായ മലയാള തുല്യപദം.
- source_word: καὶ αὕτη
  choice: ഇതായിരിക്കും
  rationale: മൂലത്തിൽ പ്രത്യക്ഷമായ ഭാവികാല ക്രിയ ഇല്ലെങ്കിലും പ്രവചനാത്മകമായ സന്ദർഭത്തിലെ ലോപിത ക്രിയ മലയാളത്തിൽ പൂർണവാക്യത്തിനായി ‘ആയിരിക്കും’ എന്നു നൽകിയിരിക്കുന്നു; മുൻവാക്യത്തോടുള്ള ബന്ധം ഉദ്ധരണിയുടെ പ്രവാഹംകൊണ്ട് നിലനിൽക്കുന്നതിനാൽ ‘കൂടാതെ’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: പ്രവചനവാഗ്ദാനത്തിലെ διαθήκηയുടെ സ്വഭാവം
  choice: ഉടമ്പടി
  alternative: വിൽപത്രം; കരാർ
  rationale: ഇവിടെ യെശയ്യാ/യിരെമ്യാവ് ഉടമ്പടിഭാഷയുടെ പശ്ചാത്തലത്തിലുള്ള ദൈവിക വീണ്ടെടുപ്പുവാഗ്ദാനമാണ്; ‘ഉടമ്പടി’ ഈ അന്തർപാഠബന്ധം നിലനിർത്തുന്നു, എന്നാൽ ‘വിൽപത്രം’ അനാവശ്യമായ മരണപത്രധ്വനി കൊണ്ടുവരും.
- issue: ὅταν ἀφέλωμαι എന്നതിന്റെ കാലപരമായ ശക്തി
  choice: ഞാൻ അവരുടെ പാപങ്ങൾ നീക്കിക്കളയുമ്പോൾ
  alternative: ഞാൻ അവരുടെ പാപങ്ങൾ നീക്കിക്കളയുമ്പോഴെല്ലാം
  rationale: സന്ദർഭം ആവർത്തിക്കുന്ന പൊതുനിബന്ധനയല്ല, രക്ഷാചരിത്രത്തിലെ ഉറപ്പുള്ള പ്രവചനവാഗ്ദാനമാണ്; വിവർത്തനം അതിന്റെ സമയം അമിതമായി നിർവചിക്കാതെ ഈ ഉറപ്പ് നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന്റെ ഗൗരവം നിലനിർത്തുന്ന മലയാളം. ‘ഉടമ്പടി’, ‘പാപങ്ങൾ’ എന്നീ സ്ഥാപിത പദങ്ങൾ ഉപയോഗിച്ചു. പ്രധാനവാചകത്തിലെ [a] അടയാളം ബന്ധപ്പെട്ട പദസമുച്ചയത്തിനു ശേഷം ചേർത്തിരിക്കുന്നു.
