- from: ദൈവം താൻ മുൻകൂട്ടി അറിഞ്ഞിരുന്ന[a] തന്റെ ജനത്തെ തള്ളിക്കളഞ്ഞിട്ടില്ല. അല്ലെങ്കിൽ, ഏലിയാവിനെക്കുറിച്ചുള്ള ഭാഗത്ത്[b] തിരുവെഴുത്ത് എന്താണ് പറയുന്നതെന്ന് നിങ്ങൾ അറിയുന്നില്ലേ? അവൻ ഇസ്രായേലിന് എതിരായി ദൈവത്തോട് എങ്ങനെ അപേക്ഷിക്കുന്നു[c]?
  to: ദൈവം മുൻകൂട്ടി അറിഞ്ഞിരുന്ന[a] തന്റെ ജനത്തെ തള്ളിക്കളഞ്ഞിട്ടില്ല. അല്ലെങ്കിൽ, ഏലിയാവിനെക്കുറിച്ചുള്ള ഭാഗത്ത്[b] അവൻ ഇസ്രായേലിനെതിരെ ദൈവത്തോട് എങ്ങനെ അപേക്ഷിക്കുന്നുവെന്ന്[c] തിരുവെഴുത്ത് പറയുന്നതു നിങ്ങൾ അറിയുന്നില്ലേ?
