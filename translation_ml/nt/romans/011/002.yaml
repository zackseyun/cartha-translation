id: ROM.11.2
reference: Romans 11:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: ml
  text: ദൈവം മുൻകൂട്ടി അറിഞ്ഞിരുന്ന[a] തന്റെ ജനത്തെ തള്ളിക്കളഞ്ഞിട്ടില്ല. അല്ലെങ്കിൽ, ഏലിയാവിനെക്കുറിച്ചുള്ള ഭാഗത്ത്[b] അവൻ ഇസ്രായേലിനെതിരെ ദൈവത്തോട് എങ്ങനെ അപേക്ഷിക്കുന്നുവെന്ന്[c] തിരുവെഴുത്ത് പറയുന്നതു നിങ്ങൾ അറിയുന്നില്ലേ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുൻകൂട്ടി അറിഞ്ഞിരുന്ന’ എന്നത് ‘മുമ്പേ അറിഞ്ഞിരുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം. ചിലർ ഇതിന് മുൻകൂട്ടിയുള്ള തിരഞ്ഞെടുപ്പ് ഉൾപ്പെടുന്ന കൂടുതൽ ശക്തമായ അർഥം നൽകുന്നു; എന്നാൽ ഇവിടെ ഗ്രീക്ക് പദത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില പരിഭാഷയിൽ നിലനിർത്തിയിരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘ഏലിയാവിൽ’; ഏലിയാവിനെക്കുറിച്ചുള്ള തിരുവെഴുത്തുഭാഗത്തെ സൂചിപ്പിക്കുന്ന ഒരു പ്രയോഗമാണിത്.
    reason: lexical_alternative
  - marker: c
    text: ‘അവൻ ഇസ്രായേലിനെതിരെ ദൈവത്തോട് എങ്ങനെ അഭ്യർഥിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: തള്ളിക്കളഞ്ഞിട്ടില്ല
  rationale: ഈ സന്ദർഭത്തിൽ ἀπωθέομαι എന്നത് ‘നിരസിക്കുക, ഉപേക്ഷിക്കുക’ എന്ന അർഥത്തിലാണ്. ‘തള്ളിക്കളയുക’ ദൈവം തന്റെ ജനത്തെ പൂർണമായി നിരസിച്ചിട്ടില്ലെന്ന പൗലോസിന്റെ പ്രസ്താവന സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸν λαὸν αὐτοῦ
  choice: തന്റെ ജനത്തെ
  rationale: λαός ഇവിടെ ദൈവത്തിന്റെ ഉടമ്പടിജനത്തെ സൂചിപ്പിക്കുന്നു. ആദ്യ ഉപവാക്യത്തിൽ മൂലപാഠം ചേർക്കാത്ത ‘ഇസ്രായേൽ’ എന്ന പേര് ചേർക്കാതെ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: προέγνω
  choice: മുൻകൂട്ടി അറിഞ്ഞിരുന്ന
  rationale: προγινώσκω എന്ന ക്രിയയുടെ അടിസ്ഥാനാർഥമായ ‘മുൻകൂട്ടി അറിയുക’ നിലനിർത്തുന്നു; ‘മുൻകൂട്ടി തിരഞ്ഞെടുത്തു’ പോലുള്ള ശക്തമായ വ്യാഖ്യാനം പ്രധാന പാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἢ οὐκ οἴδατε
  choice: അല്ലെങ്കിൽ ... നിങ്ങൾ അറിയുന്നില്ലേ?
  rationale: പൗലോസിന്റെ വാദത്തിൽ അടുത്ത തെളിവ് അവതരിപ്പിക്കുന്ന ആലങ്കാരിക ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐν Ἠλίᾳ
  choice: ഏലിയാവിനെക്കുറിച്ചുള്ള ഭാഗത്ത്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘ഏലിയാവിൽ’ എന്നതിനു പകരം, ഏലിയാവിനെക്കുറിച്ചുള്ള തിരുവെഴുത്തുഭാഗം എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: ἡ γραφή
  choice: തിരുവെഴുത്ത്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ γραφή വിശുദ്ധ ലിഖിതത്തെ സൂചിപ്പിക്കുന്നു; ‘തിരുവെഴുത്ത്’ ആ അർഥം dignified modern Malayalam-ൽ നൽകുന്നു.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: ദൈവത്തോട് എങ്ങനെ അപേക്ഷിക്കുന്നു
  rationale: ἐντυγχάνω അപേക്ഷിക്കുക, അഭ്യർഥിക്കുക, വാദം ബോധിപ്പിക്കുക എന്നീ അർഥങ്ങൾ വഹിക്കാം. തുടർന്നുള്ള ‘ഇസ്രായേലിന് എതിരായി’ എന്ന പ്രയോഗത്തോടൊപ്പം ‘അപേക്ഷിക്കുന്നു’ നിഷ്പക്ഷമായ അർഥം നിലനിർത്തുന്നു.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: ഇസ്രായേലിന് എതിരായി
  rationale: ജനിറ്റീവോടുകൂടിയ κατά ഇവിടെ പ്രതികൂലമായ ‘എതിരായി’ എന്ന അർഥത്തിലാണ്; ‘ഇസ്രായേൽ’ എന്ന പേര് അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: προέγνω എന്നതും ദൈവിക തിരഞ്ഞെടുപ്പും തമ്മിലുള്ള ബന്ധം
  choice: മുൻകൂട്ടി അറിഞ്ഞിരുന്ന
  alternative: മുൻകൂട്ടി തിരഞ്ഞെടുത്തിരുന്ന; മുൻകൂട്ടി സ്നേഹിച്ചിരുന്ന
  rationale: ഈ വാക്യം ദൈവിക തിരഞ്ഞെടുപ്പിനെക്കുറിച്ചുള്ള വിശാലമായ പൗലോസീയ ചർച്ചയുമായി ബന്ധപ്പെട്ടിരുന്നാലും, ഗ്രീക്ക് പദം മാത്രം ആ തർക്കം നിർണയിക്കുന്നില്ല. അതിനാൽ അടിസ്ഥാനമായ ‘മുൻകൂട്ടി അറിഞ്ഞു’ എന്ന അർഥം നിലനിർത്തി ദൈവശാസ്ത്രപരമായ സംഘർഷം തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ആദരപൂർവവുമായ ശൈലി ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യഘടനയുടെ വാദക്രമം നിലനിർത്തിയപ്പോൾ, ἐν Ἠλίᾳ എന്ന പ്രയോഗം വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധം അർഥാനുസൃതമായി നൽകി. പ്രാചീനമോ സഭാവിഭാഗനിഷ്ഠമോ ആയ സാങ്കേതിക പദങ്ങൾ ഒഴിവാക്കി.
