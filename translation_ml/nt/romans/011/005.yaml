source:
  edition: SBLGNT
  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: ml
  text: അങ്ങനെ, ഇപ്പോഴത്തെ കാലത്തും കൃപയുടെ തിരഞ്ഞെടുപ്പിന് അനുസൃതമായി ഒരു ശേഷിപ്പ് ഉണ്ടായിരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൃപാപൂർവമായ തിരഞ്ഞെടുപ്പിന് അനുസൃതമായി” അല്ലെങ്കിൽ “കൃപയാലുള്ള തിരഞ്ഞെടുപ്പിന് അനുസൃതമായി.”
    reason: κατ’ ἐκλογὴν χάριτος എന്ന പ്രയോഗത്തിലെ ജനിറ്റീവ് ബന്ധത്തിനുള്ള സാധുവായ വ്യത്യസ്ത വായനകൾ അറിയിക്കുന്നു.
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: അങ്ങനെതന്നെ ... -ത്തും
  rationale: മുൻപുള്ള ഏലീയാവിന്റെ ഉദാഹരണത്തിൽനിന്നുള്ള നിഗമനവും അന്നും ഇന്നും തമ്മിലുള്ള സമാന്തരവും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: ഇപ്പോഴത്തെ കാലത്ത്
  rationale: καιρός സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ കാലഘട്ടം എന്ന ആശയം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: λεῖμμα
  choice: ഒരു ശേഷിപ്പ്
  rationale: ദൈവത്താൽ നിലനിർത്തപ്പെട്ട ന്യൂനപക്ഷത്തെ സൂചിപ്പിക്കുന്ന പഴയനിയമ-പൗലോസ് പശ്ചാത്തലമുള്ള പദസങ്കൽപ്പം സംരക്ഷിക്കുന്നു.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: കൃപയുടെ തിരഞ്ഞെടുപ്പനുസരിച്ച്
  rationale: ἐκλογή, χάρις എന്നീ രണ്ട് ആശയങ്ങളും നിലനിർത്തുകയും അവയുടെ ജനിറ്റീവ് ബന്ധം കൂടുതൽ ചുരുക്കി വ്യാഖ്യാനിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: γέγονεν
  choice: ഉണ്ടായിരിക്കുന്നു
  rationale: മുൻപ് സംഭവിച്ചതിന്റെ ഫലമായി ഇപ്പോൾ നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്ന പെർഫെക്റ്റിന്റെ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ഉപദേശപരമായി വിവാദമുള്ള സന്ദർഭത്തിൽ ἐκλογή എന്നതിന്റെ പരിഭാഷ
  choice: തിരഞ്ഞെടുപ്പ്
  alternative: തിരഞ്ഞെടുക്കൽ; തിരഞ്ഞെടുക്കപ്പെട്ട നില
  rationale: പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; അതേസമയം ഒരു പ്രത്യേക സഭാവിഭാഗത്തിന്റെ വ്യാഖ്യാനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- issue: κατ’ ἐκλογὴν χάριτος എന്നതിൽ കൃപയും തിരഞ്ഞെടുപ്പും തമ്മിലുള്ള ബന്ധം
  choice: കൃപയുടെ തിരഞ്ഞെടുപ്പനുസരിച്ച്
  alternative: കൃപയാലുള്ള തിരഞ്ഞെടുപ്പനുസരിച്ച്; കൃപാപൂർവമായ തിരഞ്ഞെടുപ്പനുസരിച്ച്
  rationale: ഉറവിടം, അടിസ്ഥാനം, സ്വഭാവം എന്നിവയിൽ ഏതൊന്നാണ് പ്രധാനമെന്ന് നിർബന്ധമായി തീരുമാനിക്കാതെ മൂലത്തിലെ സാന്ദ്രമായ ജനിറ്റീവ് ബന്ധവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘ശേഷിപ്പ്’, ‘തിരഞ്ഞെടുപ്പ്’, ‘കൃപ’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വാക്യഘടനയിൽ ഉപയോഗിച്ചു.
