- from: അങ്ങനെതന്നെ, ഇപ്പോഴത്തെ കാലത്തും കൃപയുടെ തിരഞ്ഞെടുപ്പനുസരിച്ച് ഒരു ശേഷിപ്പ് ഉണ്ടായിരിക്കുന്നു.[a]
  to: അങ്ങനെ, ഇപ്പോഴത്തെ കാലത്തും കൃപയുടെ തിരഞ്ഞെടുപ്പിന് അനുസൃതമായി ഒരു ശേഷിപ്പ് ഉണ്ടായിരിക്കുന്നു.[a]
  rationale: വാക്യത്തിന്റെ തുടക്കത്തിൽ അങ്ങനെ ഉപയോഗിക്കുന്നത് οὕτως οὖν-ന്റെ നിഗമനസ്വഭാവം സ്വാഭാവികമായി നൽകുന്നു; കാലത്തും എന്നതിലെ ഉം καὶ-യുടെ സമാന്തരത്വം നിലനിർത്തുന്നു. തിരഞ്ഞെടുപ്പിന് അനുസൃതമായി എന്ന മാറ്റം മാത്രം വ്യാകരണ-ശൈലീസ്വാഭാവികത മെച്ചപ്പെടുത്തുന്നു; മൂലത്തിലെ കൃപയും തിരഞ്ഞെടുപ്പും തമ്മിലുള്ള ബന്ധത്തെ കൂടുതൽ നിർവചിക്കുന്നില്ല.
