id: ROM.11.32
reference: Romans 11:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: ml
  text: കാരണം, എല്ലാവരെയും ദൈവം അനുസരണക്കേടിൽ അടച്ചുവെച്ചിരിക്കുന്നു[a][b][c]—എല്ലാവരോടും കരുണ കാണിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അടച്ചുവെച്ചിരിക്കുന്നു’ എന്നതിന് ‘ഒതുക്കിവെച്ചിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘ബന്ധിച്ചുവെച്ചിരിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ചില സന്ദർഭങ്ങളിൽ ‘അനുസരണക്കേട്’ എന്ന പദത്തിന് ‘അവിശ്വാസം’ എന്നും പരിഭാഷ നൽകാം; എന്നാൽ ഇവിടെ അനുസരിക്കാനുള്ള വിസമ്മതം ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
  - marker: c
    text: മൂലഭാഷയിൽ ‘എല്ലാവരെയും / എല്ലാവരോടും’ എന്ന ആശയം രണ്ടിടത്തും ആവർത്തിക്കുന്നു. സന്ദർഭത്തിൽ പൗലോസ് യഹൂദരെയും മറ്റു ജനതകളെയും ഒരുമിച്ച് പരിഗണിക്കുന്നുണ്ടെങ്കിലും, ഈ പദത്തിന്റെ വ്യാപ്തി പരിഭാഷയിൽ മുൻകൂട്ടി ചുരുക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: അടച്ചിട്ടു
  rationale: συγκλείω എന്ന ക്രിയയിലെ ഒരുമിച്ച് അടയ്ക്കുക, പരിമിതപ്പെടുത്തുക എന്ന ദൃശ്യരൂപകം നിലനിർത്തുന്നു; ശിക്ഷാപരമായ ‘തടവിലാക്കി’ എന്നതിനെക്കാൾ വ്യാഖ്യാനഭാരം കുറവാണ്.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാദത്തിന് വിശദീകരണം നൽകുന്ന γάρ എന്ന ബന്ധകം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς πάντας
  choice: എല്ലാവരെയും / എല്ലാവരോടും
  rationale: രണ്ടിടത്തും ‘എല്ലാവരും’ എന്ന ഒരേ വ്യാപകപദം നിലനിർത്തി പൗലോസിന്റെ സമാന്തരത സംരക്ഷിക്കുന്നു; യഹൂദരും ജനതകളും എന്ന സന്ദർഭസൂചന പരിഭാഷയിൽ ചേർത്ത് വ്യാപ്തി മുൻകൂട്ടി ചുരുക്കുന്നില്ല.
- source_word: εἰς ἀπείθειαν
  choice: അനുസരണക്കേടിൽ
  rationale: εἰς ഇവിടെ എത്തിച്ച അവസ്ഥയെയോ പരിധിയെയോ സൂചിപ്പിക്കുന്നു. ἀπείθεια വെറും ബൗദ്ധിക അവിശ്വാസത്തെക്കാൾ അനുസരിക്കാനുള്ള വിസമ്മതം ഉൾക്കൊള്ളുന്ന വിശാലപദമാണ്.
- source_word: ἵνα
  choice: —എല്ലാവരോടും കരുണ കാണിക്കേണ്ടതിന്
  rationale: ἵναയുടെ ഉദ്ദേശ്യസൂചന മലയാളത്തിലെ ‘-േണ്ടതിന്’ എന്ന ഘടനയിലൂടെ സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: ἐλεήσῃ
  choice: കരുണ കാണിക്കേണ്ടതിന്
  rationale: ἐλεάωയുടെ പ്രവർത്തനാത്മക അർഥം വ്യക്തമായി നൽകുന്നു; ഗ്രീക്ക് സബ്ജങ്ക്റ്റീവ് ഇവിടെ ദൈവത്തിന്റെ പ്രവൃത്തിയെക്കുറിച്ചുള്ള അനിശ്ചിതത്വമല്ല, ἵναയോടു ചേർന്ന ഉദ്ദേശ്യഘടനയാണ്.
theological_decisions:
- issue: രണ്ടു പ്രയോഗങ്ങളിലുമുള്ള ‘എല്ലാവരും’ എന്നതിന്റെ വ്യാപ്തി
  choice: τοὺς πάντας രണ്ടു പ്രാവശ്യവും ‘എല്ലാവരും’ എന്ന പദംകൊണ്ട് പരിഭാഷപ്പെടുത്തി സമമിതി നിലനിർത്തുന്നു.
  alternative: ‘എല്ലാ മനുഷ്യരും’, ‘ഓരോരുത്തരും’, അല്ലെങ്കിൽ ‘യഹൂദരും ജനതകളും’ എന്ന് വ്യാഖ്യാനിച്ച് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാക്യം ഒരേ വ്യാപകപ്രയോഗം ആവർത്തിക്കുന്നു. സന്ദർഭത്തിൽ യഹൂദരും ജനതകളും ഒരുമിച്ച് പരിഗണിക്കപ്പെടുന്നുണ്ടെങ്കിലും, സർവരക്ഷയും പ്രതിനിധിപരമായ സർവവ്യാപ്തിയും സംബന്ധിച്ച ചർച്ച പരിഭാഷ തന്നെ തീർപ്പാക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘അടച്ചിട്ടു’ എന്നത് സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മൂലത്തിലെ ദൃശ്യരൂപകം നിലനിർത്തുന്നു. ഡാഷ് ഉദ്ദേശ്യവാക്യത്തിലേക്കുള്ള തിരിവ് വ്യക്തമാക്കുന്നു; ആവർത്തിച്ച ‘എല്ലാവരും’ സ്വാഭാവികമായ വ്യാകരണരൂപമാറ്റത്തോടെ സംരക്ഷിച്ചിരിക്കുന്നു.
