id: ROM.11.16
reference: Romans 11:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: ml
  text: ആദ്യഫലമായി അർപ്പിക്കുന്ന ഭാഗം വിശുദ്ധമാണെങ്കിൽ, മാവിന്റെ മുഴുവൻ പിണ്ഡവും വിശുദ്ധമാണ്; വേര് വിശുദ്ധമാണെങ്കിൽ, കൊമ്പുകളും വിശുദ്ധമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: ആദ്യമായി അർപ്പിക്കുന്ന പങ്ക്
  rationale: ദൈവത്തിന് സമർപ്പിക്കുന്ന ആദ്യവിഹിതം എന്ന ആരാധനാപരമായ ആശയം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; വെറും ‘ആദ്യഭാഗം’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ സമർപ്പണഭാവം നിലനിർത്തുന്നു.
- source_word: ἁγία
  choice: വിശുദ്ധം / വിശുദ്ധമാണ്
  rationale: രണ്ടു ഉപമകളിലുമുള്ള സമാന്തരത നിലനിർത്തുകയും വിശുദ്ധിയുടെ കൃത്യമായ സ്വഭാവം വ്യാഖ്യാനിച്ച് തീർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: φύραμα
  choice: കുഴച്ച മാവ്
  rationale: മാവിന്റെ കലവറയെയോ പിണ്ഡത്തെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ അർത്ഥം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ῥίζα
  choice: വേര്
  rationale: സസ്യശാസ്ത്രപരമായ ഉപമയുടെ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: κλάδοι
  choice: കൊമ്പുകൾ
  rationale: തുടർന്നുവരുന്ന ഒലിവുമരത്തിന്റെ ഉപമയുമായി യോജിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: …ആണെങ്കിൽ, …വും …ആണ്; …ആണെങ്കിൽ, …കളും …ആണ്
  rationale: ഗ്രീക്കിൽ രണ്ടാം അംഗങ്ങളിൽ വിട്ടുകളഞ്ഞിരിക്കുന്ന ക്രിയ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി പൂരിപ്പിക്കുകയും ‘കൂടി’ എന്ന യുക്തിബന്ധം -ഉം രൂപത്തിലൂടെ നിലനിർത്തുകയും ചെയ്യുന്നു; δέയ്ക്ക് ഇവിടെ പ്രത്യേക കാലസൂചകപദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ആദ്യമായി അർപ്പിക്കുന്ന പങ്കിൽനിന്നും വേരിൽനിന്നും മാവിലേക്കും കൊമ്പുകളിലേക്കും ബന്ധപ്പെടുന്ന വിശുദ്ധിയുടെ സ്വഭാവം
  choice: ‘വിശുദ്ധം’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി, അത് ഉടമ്പടിപരമോ പ്രതിനിധാനപരമോ രക്ഷാസംബന്ധമോ എന്ന് നിർവചിക്കാതിരിക്കുന്നു.
  alternative: ‘ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ടത്’ എന്നോ ‘രക്ഷിക്കപ്പെട്ടത്’ എന്നോ വ്യാഖ്യാനാത്മകമായി വ്യക്തമാക്കുക.
  rationale: ഈ വാക്യം വിശുദ്ധി എങ്ങനെ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന് കൃത്യമായി നിർവചിക്കുന്നില്ല; അതിനാൽ പൗലോസിന്റെ ഉപമയിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും തുറന്ന അർത്ഥപരിധിയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ചുരുക്കമുള്ള ഉപമാസമാന്തര്യം നിലനിർത്തിയിട്ടുണ്ട്; ആരാധനാപരമായ ἀπαρχή സാധാരണ വായനക്കാർക്ക് വ്യക്തമാകാൻ വിവരണാത്മകമായി പരിഭാഷപ്പെടുത്തി.
