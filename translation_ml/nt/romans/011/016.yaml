    text: അഥവാ, “മാവിന്റെ പിണ്ഡം.” ഗ്രീക്ക് പദം കുഴച്ച മാവിന്റെ ഒരു പിണ്ഡത്തെയോ കൂട്ടത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
