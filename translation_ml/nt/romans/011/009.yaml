  to: 'ദാവീദ് പറയുന്നു: “അവരുടെ മേശ അവർക്കു കുരുക്കായും കെണിയായും ഇടർച്ചയ്ക്കു കാരണമായും തിരിച്ചടവായും തീരട്ടെ.”[a]'
