reference: Romans 11:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: ml
  text: 'ദാവീദ് പറയുന്നു: “അവരുടെ മേശ അവർക്കു കുരുക്കായും കെണിയായും ഇടർച്ചയ്ക്കു കാരണമായും തിരിച്ചടവായും തീരട്ടെ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കുരുക്കും വേട്ടക്കെണിയും” എന്നും വിവർത്തനം ചെയ്യാം; ഈ രണ്ടു പദങ്ങളും അകപ്പെടുത്തുന്ന ഉപാധികളെ സൂചിപ്പിക്കുന്ന സമീപാർഥപദങ്ങളാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: ദാവീദ്
  rationale: വ്യക്തിനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള ലിപ്യന്തരണം.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലത്തെ സാഹിത്യവർത്തമാനമായി നിലനിർത്തുന്നു.
- source_word: Γενηθήτω
  choice: ആയിത്തീരട്ടെ
  rationale: ഗ്രീക്ക് ആജ്ഞാർത്ഥത്തിന്റെ പ്രാർത്ഥനാത്മകവും ശാപവാക്യപരവുമായ ശക്തി പ്രവചനമാക്കി മൃദൂകരിക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: τράπεζα
  choice: മേശ
  rationale: വിരുന്നിനെയോ ഉപജീവനത്തെയോ വ്യാഖ്യാനമായി ചേർക്കാതെ മൂലത്തിലെ ദൃശ്യമായ concrete image നിലനിർത്തുന്നു.
- source_word: παγίδα
  choice: കുരുക്ക്
  rationale: അകപ്പെടുത്തുന്ന ഉപാധി എന്ന അർഥം നൽകുകയും തുടർന്നുള്ള θήραν-ൽനിന്ന് പദപരമായ വ്യത്യാസം സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: θήραν
  choice: കെണി
  rationale: വേട്ടയുമായി ബന്ധപ്പെട്ട അകപ്പെടുത്തൽ എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്ന സമീപാർഥപദം.
- source_word: σκάνδαλον
  choice: ഇടർച്ചയ്ക്കു കാരണം
  rationale: വെറും മനോവേദനയല്ല, വീഴ്ചയിലേക്കു നയിക്കുന്ന തടസ്സം എന്ന രൂപകം വ്യക്തമാക്കുന്നു.
- source_word: ἀνταπόδομα
  choice: തിരിച്ചടവ്
  rationale: പ്രതിഫലം/പ്രതികാരം എന്ന് മുൻകൂട്ടി നിർണയിക്കാതെ, ചെയ്തതിനുള്ള മടക്കപ്രതിഫലം എന്ന requital-ന്റെ അർഥവ്യാപ്തി സൂക്ഷിക്കുന്നു.
- source_word: αὐτοῖς
  choice: അവർക്കു
  rationale: തിരിച്ചടവിന്റെ ദിശ സൂചിപ്പിക്കുന്ന ദത്തിവിനെ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: സങ്കീർത്തനം 69:22-ലെ ശാപവാക്യ ഉദ്ധരണി
  choice: “ആയിത്തീരട്ടെ” എന്ന നേരിട്ടുള്ള ആജ്ഞാർത്ഥ/പ്രാർത്ഥനാത്മക രൂപം നിലനിർത്തി.
  alternative: “ആയിത്തീരും” എന്ന പ്രവചനരൂപം അല്ലെങ്കിൽ “ആയിത്തീരുമാറാകട്ടെ” എന്ന കൂടുതൽ ഔപചാരിക രൂപം.
  rationale: Γενηθήτω എന്ന ആജ്ഞാർത്ഥത്തിന്റെ കാഠിന്യവും ദൈവവിധിയോടു ബന്ധപ്പെട്ട ഉത്കണ്ഠയും മൃദൂകരിക്കാതെയും, അതിനെ വെറും ഭാവിപ്രവചനമാക്കാതെയും സൂക്ഷിക്കുന്നു.
- issue: ἀνταπόδομα എന്നതിന്റെ നൈതിക സ്വഭാവം
  choice: തിരിച്ചടവ്
  alternative: പ്രതികാരം; ശിക്ഷ; പ്രതിഫലം
  rationale: സന്ദർഭം ശിക്ഷാത്മകമായ ഫലം സൂചിപ്പിച്ചാലും, മൂലപദത്തിലെ requital/repayment എന്ന വ്യാപ്തിയെ ഒരു പ്രത്യേക ദൈവശാസ്ത്രപര നിർവചനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പരമ്പരാഗത ബൈബിൾപദസമ്പത്ത് ആവശ്യമായിടത്ത് മാത്രം ഉപയോഗിച്ചു; ‘ആയിത്തീരട്ടെ’ ശാപവാക്യത്തിന്റെ ശക്തി നിലനിർത്തുന്നു. ഗ്രീക്കിലെ ആവർത്തിച്ചുള്ള καί മലയാളത്തിൽ സ്വാഭാവികമായ ഏകോപനമായി നൽകി.
