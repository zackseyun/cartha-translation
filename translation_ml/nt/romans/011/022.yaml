id: ROM.11.22
reference: Romans 11:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: ml
  text: 'അതുകൊണ്ട് ദൈവത്തിന്റെ ദയയും കാഠിന്യവും ശ്രദ്ധിച്ചുനോക്കുക: വീണുപോയവരോടു കാഠിന്യം; എന്നാൽ, നീ ആ ദയയിൽ തുടരുന്നെങ്കിൽ, നിന്നോടു ദൈവത്തിന്റെ ദയ; അല്ലെങ്കിൽ നീയും വെട്ടിമാറ്റപ്പെടും.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒടിച്ചുമാറ്റപ്പെടും.’ ചുറ്റുമുള്ള ഒലിവുമരത്തിന്റെ രൂപകത്തിന്റെ വെളിച്ചത്തിൽ ഈ പ്രയോഗം സാധ്യമാണ്; എന്നാൽ ഗ്രീക്ക് ക്രിയയുടെ നേരിട്ടുള്ള അർഥം ‘വെട്ടിമാറ്റപ്പെടും’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: ശ്രദ്ധിച്ചുനോക്കുക
  rationale: കേവലം കാണുക എന്നതിലുപരി ഗൗരവമായി പരിഗണിക്കാനുള്ള ആജ്ഞയാണ് ഇവിടെ; ആ ആഹ്വാനത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഇതു നൽകുന്നു.
- source_word: χρηστότητα / χρηστότης
  choice: ദയ
  rationale: ദൈവത്തിന്റെ അനുകമ്പാപൂർവമായ നന്മയെ സൂചിപ്പിക്കുകയും കാഠിന്യത്തോടുള്ള ബന്ധപരമായ വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀποτομίαν / ἀποτομία
  choice: കാഠിന്യം
  rationale: ന്യായവിധിയിലെ മൂർച്ചയും വിട്ടുവീഴ്ചയില്ലായ്മയും സൂചിപ്പിക്കുന്ന ഈ നാമത്തിന് സ്വാഭാവികവും അതിശയോക്തിയില്ലാത്തതുമായ മലയാള തുല്യപദം.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: വീണുപോയവരോട്
  rationale: ἐπίയുടെ ദിശാത്മക/ബന്ധസൂചക അർഥവും substantival participle ആയ πεσόντας സൂചിപ്പിക്കുന്നവരെയും സംക്ഷിപ്തമായി പകർന്നു നൽകുന്നു.
- source_word: ἐπὶ δὲ σὲ
  choice: എന്നാൽ നിന്നോട്
  rationale: മുൻവാക്യഭാഗത്തോടുള്ള സമാന്തര വൈരുധ്യവും ഏകവചന അഭിസംബോധനയും സംരക്ഷിക്കുന്നു.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: നീ ആ ദയയിൽ തുടരുന്നെങ്കിൽ മാത്രം
  rationale: തുടർച്ചയെ സൂചിപ്പിക്കുന്ന ἐπιμένωയും യഥാർഥമായ നിബന്ധനയും വ്യക്തമാക്കുന്നു; 'ആ' എന്നത് തൊട്ടുമുമ്പ് പറഞ്ഞ ദൈവത്തിന്റെ ദയയിലേക്കാണ് വിരൽചൂണ്ടുന്നത്. മലയാളത്തിലെ 'എങ്കിൽ മാത്രം' ഗ്രീക്കിലെ നിബന്ധനയുടെ നിർണായകത സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐπεὶ
  choice: അല്ലെങ്കിൽ
  rationale: ഈ സന്ദർഭത്തിൽ നിബന്ധന പാലിക്കാത്തപക്ഷമുള്ള പ്രതികൂല ഫലം അവതരിപ്പിക്കുന്നതിനാൽ 'അല്ലെങ്കിൽ' മുന്നറിയിപ്പിന്റെ യുക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκκοπήσῃ
  choice: വെട്ടിമാറ്റപ്പെടും
  rationale: ἐκκόπτωയുടെ ഭാവികാല കർമണി രൂപത്തിലെ 'വെട്ടി നീക്കുക' എന്ന നേരിട്ടുള്ള അർഥം സംരക്ഷിക്കുന്നു; ചുറ്റുമുള്ള ഒലിവുമരത്തിന്റെ രൂപകത്തോടും യോജിക്കുന്നു.
theological_decisions:
- issue: ദൈവത്തിന്റെ ദയയിൽ തുടരുന്നതുമായി ബന്ധപ്പെട്ട നിബന്ധനാപൂർവമായ മുന്നറിയിപ്പ്
  choice: ദൈവത്തിന്റെ ദയയിൽ തുടരുന്നെങ്കിൽ മാത്രമേ ആ ദയയുടെ അനുഭവത്തിൽ നിലനിൽക്കൂ; അല്ലെങ്കിൽ അഭിസംബോധിതനും വെട്ടിമാറ്റപ്പെടുമെന്ന നേരിട്ടുള്ള നിബന്ധനാപൂർവ മുന്നറിയിപ്പ് നിലനിർത്തി.
  alternative: ഇത് വെറും സാങ്കൽപ്പിക മുന്നറിയിപ്പായി മൃദൂകരിക്കുകയോ, സ്ഥിരോത്സാഹം/വിശ്വാസത്യാഗം സംബന്ധിച്ച പ്രത്യേക സഭാവിഭാഗ സിദ്ധാന്തം വിവർത്തനത്തിൽ ചേർക്കുകയോ ചെയ്യുക.
  rationale: ഗ്രീക്ക് വാചകം യഥാർഥ നിബന്ധനയും മുന്നറിയിപ്പും അവതരിപ്പിക്കുന്നു; അതിന്റെ വ്യക്തിഗത-സാമൂഹിക പ്രയോഗമോ സ്ഥിരോത്സാഹം-വിശ്വാസത്യാഗം സംബന്ധിച്ച പിന്നീടുള്ള തർക്കങ്ങളോ അത് ഇവിടെ തീർപ്പാക്കുന്നില്ല. അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഏകവചനമായ σὲ/ἐπιμένῃς/σὺ മലയാളത്തിൽ ‘നിന്നോട്/നീ’ എന്നു നിലനിർത്തി. വൈരുധ്യം വ്യക്തമായി കേൾക്കാൻ അർദ്ധവിരാമവും ദീർഘവിരാമവും ഉപയോഗിച്ചു.
