revisions:
- from: എന്നാൽ കൊമ്പുകളിൽ ചിലത് ഒടിച്ചുകളയപ്പെടുകയും, കാട്ടൊലിവുമരമായിരുന്ന നിന്നെ അവയുടെ ഇടയിൽ ഒട്ടിച്ചുചേർക്കുകയും[a], ഒലിവുമരത്തിന്റെ വേരിലും അതിന്റെ സമൃദ്ധിയിലും നീ സഹപങ്കാളിയായിത്തീരുകയും ചെയ്തെങ്കിൽ,[b]
  to: എന്നാൽ കൊമ്പുകളിൽ ചിലത് ഒടിച്ചുമാറ്റപ്പെടുകയും, നീ കാട്ടൊലിവുമരമായിരുന്നിട്ടും അവയുടെ ഇടയിൽ ഒട്ടിച്ചേർക്കപ്പെടുകയും, ഒലിവുമരത്തിന്റെ വേരിലും സമൃദ്ധിയിലും സഹപങ്കാളിയായിത്തീരുകയും ചെയ്തെങ്കിൽ,[b]
  rationale: The revision restores the concessive sense of ἀγριέλαιος ὢν and makes the grafting clause idiomatic while maintaining the source’s passive voice and unresolved olive-tree metaphor. Footnote a remains relevant but its anchor must be retained at the grafting expression; therefore the text is anchored there rather than only at the final clause.
