id: ROM.11.17
reference: Romans 11:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: ml
  text: എന്നാൽ കൊമ്പുകളിൽ ചിലത് ഒടിച്ചുമാറ്റപ്പെടുകയും, നീ കാട്ടൊലിവുമരമായിരുന്നിട്ടും അവയുടെ ഇടയിൽ ഒട്ടിച്ചേർക്കപ്പെടുകയും, ഒലിവുമരത്തിന്റെ വേരിലും സമൃദ്ധിയിലും സഹപങ്കാളിയായിത്തീരുകയും ചെയ്തെങ്കിൽ,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, ‘ഒലിവുമരത്തിന്റെ വേരിന്റെയും സമൃദ്ധിയുടെയും പങ്കാളിയായിത്തീരുകയും’; പരമ്പരാഗതമായി, ‘ഒലിവുമരത്തിന്റെ വേരിന്റെയും പുഷ്ടിയുടെയും പങ്കാളിയായിത്തീരുകയും.’
    reason: ഗ്രീക്കിലെ ജനിറ്റീവ് നിരയുടെ ബന്ധവും πιότης എന്ന പദത്തിന്റെ ‘സമൃദ്ധി/പുഷ്ടി’ അർഥവ്യാപ്തിയും സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: Εἰ δέ
  choice: എന്നാൽ … ചെയ്തെങ്കിൽ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ വൈരുധ്യവും εἰയുടെ ഉപാധിസ്വഭാവവും സ്വാഭാവികമായ മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: τινες τῶν κλάδων
  choice: കൊമ്പുകളിൽ ചിലത്
  rationale: τινες എന്ന അനിശ്ചിതത്വവും τῶν κλάδων എന്ന ഭാഗികബന്ധവും വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἐξεκλάσθησαν
  choice: ഒടിച്ചുകളയപ്പെടുകയും
  rationale: കൊമ്പുകൾ മരത്തിൽനിന്ന് നീക്കപ്പെടുന്ന ദൃശ്യരൂപവും ക്രിയയുടെ കർമണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: ἀγριέλαιος ὢν
  choice: കാട്ടൊലിവുമരമായിരുന്ന
  rationale: അഭിസംബോധിതനെ നേരിട്ട് ‘വിജാതീയൻ’ എന്നു വ്യാഖ്യാനിക്കാതെ ഒലിവുമരത്തിന്റെ രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ concessive ഭാവം മലയാളത്തിൽ തുടർന്നുള്ള വൈരുധ്യത്തിലൂടെ വ്യക്തമാകുന്നു.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: നിന്നെ അവയുടെ ഇടയിൽ ഒട്ടിച്ചുചേർക്കുകയും
  rationale: തോട്ടപരിപാലനത്തിലെ grafting ക്രിയയെ സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുകയും αὐτοῖς എന്ന സർവനാമത്തിന്റെ പരാമർശം തുറന്നുവയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: συγκοινωνὸς
  choice: സഹപങ്കാളി
  rationale: മറ്റുള്ളവരോടൊപ്പമുള്ള പങ്കാളിത്തം സൂചിപ്പിക്കുന്ന σύν- ഘടകം സംരക്ഷിക്കുന്നു.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: ഒലിവുമരത്തിന്റെ വേരിലും അതിന്റെ സമൃദ്ധിയിലും
  rationale: ഗ്രീക്കിലെ സാന്ദ്രമായ ജനിറ്റീവ് നിരയെ അമിതമായി വ്യാഖ്യാനിക്കാതെ, വേര്–സമൃദ്ധി എന്നീ ആശയങ്ങളെ വായനാസൗകര്യത്തോടെ നിലനിർത്തുന്നു.
- source_word: ἐγένου
  choice: സഹപങ്കാളിയായിത്തീരുകയും
  rationale: പുതിയ അവസ്ഥയിലേക്കുള്ള പ്രവേശനം സൂചിപ്പിക്കുന്ന γίνομαιയുടെ അർഥം നൽകുന്നു.
theological_decisions:
- issue: ἀγριέλαιος എന്ന രൂപകത്തിന്റെ തിരിച്ചറിയൽ
  choice: ‘കാട്ടൊലിവുമരം’ എന്ന രൂപകം അക്ഷരാർഥത്തിൽ നിലനിർത്തി.
  alternative: ‘വിജാതീയൻ’ എന്ന വ്യാഖ്യാനപരമായ പദപ്രയോഗം; അല്ലെങ്കിൽ ‘കാട്ടൊലിവിന്റെ തളിർ’.
  rationale: പൗലൊസിന്റെ വാദം ഒലിവുമരത്തിന്റെ രൂപകത്തെ ആശ്രയിക്കുന്നതിനാൽ, അതിനെ ഒരു ദൈവശാസ്ത്രപരമായ തിരിച്ചറിയലാക്കി വിവർത്തനത്തിൽ തന്നെ തീർപ്പാക്കുന്നില്ല.
- issue: വേരും സമൃദ്ധിയും തമ്മിലുള്ള വ്യാകരണബന്ധം
  choice: ‘വേരിലും അതിന്റെ സമൃദ്ധിയിലും’ എന്ന് പങ്കാളിത്തത്തിന്റെ ബന്ധപ്പെട്ട ഘടകങ്ങളായി അവതരിപ്പിച്ചു.
  alternative: ‘ഒലിവുമരത്തിന്റെ സമൃദ്ധമായ വേര്’; അല്ലെങ്കിൽ ‘ഒലിവുമരത്തിന്റെ വേരിലും പുഷ്ടിയിലും’.
  rationale: ഗ്രീക്കിലെ തുടർച്ചയായ ജനിറ്റീവുകൾ പലവിധത്തിൽ ബന്ധിപ്പിക്കാവുന്നതിനാൽ ഒരു മാത്രം വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതെ അർഥസാന്ദ്രത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഏകവചനമായ ‘നീ/നിന്നെ’ നിലനിർത്തിയിരിക്കുന്നു. മൂലവാക്യം ഉപാധിവാക്യമായി അടുത്ത വാക്യത്തിലേക്കു നീളുന്നതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി.
