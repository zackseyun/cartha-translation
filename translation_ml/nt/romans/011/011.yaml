id: ROM.11.11
reference: Romans 11:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: ml
  text: 'അപ്പോൾ ഞാൻ ചോദിക്കുന്നു: അവർ വീഴാനായിട്ടാണോ ഇടറിയത്?[a] ഒരിക്കലുമല്ല! മറിച്ച്, അവരുടെ ലംഘനത്താൽ[b] യഹൂദരല്ലാത്തവർക്ക്[c] രക്ഷ ലഭിച്ചു; അവരിൽ അസൂയ ഉണർത്തുന്നതിനായി.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർ വീഴേണ്ടതിന് ഇടറിയതാണോ?’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ ‘ഇടറുക’, ‘വീഴുക’ എന്നിവയ്ക്ക് വ്യത്യസ്ത പദങ്ങളാണ്; ഈ ചോദ്യം ‘അല്ല’ എന്ന ഉത്തരമാണ് പ്രതീക്ഷിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ അതിക്രമത്തിലൂടെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥം ‘ജനതകൾക്ക്’; ഇവിടെ അത് യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ‘അവരെ അസൂയയിലേക്കു പ്രേരിപ്പിക്കാൻ’ എന്നും പരിഭാഷപ്പെടുത്താം; അതേ രക്ഷ തേടാൻ അവരെ ഉണർത്തുക എന്ന ആശയവും ഇതിൽ ഉൾപ്പെട്ടേക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: അപ്പോൾ ഞാൻ ചോദിക്കുന്നു
  rationale: οὖν-ന്റെ അനുമാനാത്മകമായ ബന്ധം ‘അപ്പോൾ’ നിലനിർത്തുന്നു; λέγω ഇവിടെ പൗലോസ് ഉന്നയിക്കുന്ന അലങ്കാരചോദ്യത്തെ പരിചയപ്പെടുത്തുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഞാൻ ചോദിക്കുന്നു’ എന്നു നൽകി.
- source_word: μὴ ἔπταισαν
  choice: ഇടറിയത്?
  rationale: πταίω എന്നത് ‘ഇടറുക’ എന്നാണ്; തുടർന്നുള്ള πίπτω (‘വീഴുക’) എന്നതിൽനിന്നുള്ള പദവ്യത്യാസം നിലനിർത്തി. μή കാരണം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്ന ചോദ്യം, പിന്നാലെയുള്ള ശക്തമായ നിരാകരണത്തിലൂടെ വ്യക്തമാണ്.
- source_word: ἵνα πέσωσιν
  choice: വീഴാനായിട്ടാണോ
  rationale: ἵνα + subjunctive സൂചിപ്പിക്കുന്ന ഉദ്ദേശ്യം/ഫലം എന്ന തുറന്ന അർത്ഥം സംരക്ഷിക്കുന്നു. ‘പൂർണമായി’ അല്ലെങ്കിൽ ‘വീണ്ടെടുക്കാനാവാത്തവിധം’ പോലുള്ള വ്യാഖ്യാനങ്ങൾ ചേർത്തിട്ടില്ല.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമല്ല!
  rationale: പൗലോസിന്റെ ശക്തമായ നിരാകരണം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും ഊന്നലുള്ളതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: അവരുടെ അതിക്രമം നിമിത്തം
  rationale: παράπτωμα ധാർമികമായ തെറ്റിനെയോ ലംഘനത്തെയോ സൂചിപ്പിക്കുന്നു. ദാതിവിന്റെ കാരണാത്മക/ഉപകരണാത്മക ശക്തി ‘നിമിത്തം’ എന്നതിലൂടെ അവതരിപ്പിച്ചു.
- source_word: ἡ σωτηρία
  choice: രക്ഷ
  rationale: റോമർ ലേഖനത്തിലെ σωτηρίαയുടെ രക്ഷാശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ പദം.
- source_word: τοῖς ἔθνεσιν
  choice: യഹൂദരല്ലാത്തവർക്ക്
  rationale: റോമർ 9–11-ലെ യഹൂദ–ἔθνη വൈരുധ്യത്തിൽ ഉദ്ദേശിക്കുന്നത് യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ്. ‘ജാതികൾ’ എന്ന മലയാളപദം ജാതിവ്യവസ്ഥയുമായി തെറ്റിദ്ധരിക്കപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ അർത്ഥം വ്യക്തമായി നൽകി; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: അവരിൽ അസൂയ ഉണർത്താനാണ് അത്
  rationale: εἰς τό + infinitive-ന്റെ ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ശക്തി നിലനിർത്തുന്നു. παραζηλόωയിലെ അസൂയയും അതിലൂടെ അതേ അനുഗ്രഹം തേടാനുള്ള പ്രേരണയും തമ്മിലുള്ള സാധ്യത തുറന്നുവെച്ചു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ഇടർച്ച അന്തിമമായ വീഴ്ചയാണോ
  choice: ‘ഇടറുക’, ‘വീഴുക’ എന്നീ വ്യത്യസ്ത ക്രിയകൾ നിലനിർത്തി, അവർ വീഴുക എന്നതായിരുന്നു ഇടർച്ചയുടെ ഉദ്ദേശ്യമോ ഫലമോ എന്ന ആശയം വാക്യം നിരാകരിക്കുന്നതായി അവതരിപ്പിച്ചു.
  alternative: ഇത് ഉടനെയുള്ള തകർച്ചയെ മാത്രം നിരാകരിക്കുന്നു എന്നും, അല്ലെങ്കിൽ പൂർണമായെങ്കിലും താൽക്കാലികമായ വീഴ്ചയെ സൂചിപ്പിക്കുന്നു എന്നും വായിക്കാം.
  rationale: മൂലത്തിലെ πταίω–πίπτω വ്യത്യാസം സംരക്ഷിച്ചു; ‘അന്തിമമായി’, ‘പൂർണമായി’, ‘വീണ്ടെടുക്കാനാവാതെ’ തുടങ്ങിയ വ്യാഖ്യാനപദങ്ങൾ ചേർത്ത് ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഹരിച്ചിട്ടില്ല.
- issue: അസൂയ ഉണർത്തുന്നതിന്റെ രക്ഷാചരിത്രപരമായ അർത്ഥം
  choice: യഹൂദരല്ലാത്തവർക്ക് ലഭിച്ച രക്ഷ ഇസ്രായേലിൽ അസൂയ ഉണർത്തുക എന്ന ഉദ്ദേശ്യത്തോടോ ഫലത്തോടോ ബന്ധപ്പെട്ടതായി അവതരിപ്പിച്ചു.
  alternative: ഇത് വെറും പ്രതികൂലമായ അസൂയയെയോ, അതേ രക്ഷ തേടാനുള്ള അനുകരണാത്മക ആഗ്രഹത്തെയോ സൂചിപ്പിക്കാം.
  rationale: παραζηλόωയുടെ അർത്ഥപരിധി ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ പ്രധാനവാചകത്തിൽ സാധാരണ ‘അസൂയ’ ഭാഷയും അടിക്കുറിപ്പിൽ വിശാലമായ സാധ്യതയും നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ജാതികൾ’ എന്ന പദത്തിന്റെ സമകാലിക സാമൂഹിക ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘യഹൂദരല്ലാത്തവർ’ എന്നു നൽകി. പൗലോസിന്റെ അലങ്കാരചോദ്യവും ശക്തമായ നിരാകരണവും ഇടറുക–വീഴുക എന്ന ദൃശ്യപദവ്യത്യാസവും നിലനിർത്തി.
