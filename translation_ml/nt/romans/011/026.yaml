id: ROM.11.26
reference: Romans 11:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: ml
  text: 'ഈ വിധത്തിൽ ഇസ്രായേൽ മുഴുവനും[b] രക്ഷിക്കപ്പെടും[a]. എഴുതിയിരിക്കുന്നതുപോലെതന്നെ: “വിടുവിക്കുന്നവൻ സീയോനിൽനിന്ന്[c] വരും; അവൻ യാക്കോബിൽനിന്ന് ദൈവഭക്തിയില്ലായ്മ അകറ്റിക്കളയും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അങ്ങനെ ഇസ്രായേൽ മുഴുവനും രക്ഷിക്കപ്പെടും.” οὕτως എന്ന ഗ്രീക്ക് പദത്തിന് “അങ്ങനെ” എന്നും പരിഭാഷപ്പെടുത്താം; ഇവിടെ മുൻപ് വിവരിച്ച രീതിയെ സൂചിപ്പിക്കുന്ന “ഈ വിധത്തിൽ” എന്ന അർഥമായിരിക്കാനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: “ഇസ്രായേൽ മുഴുവനും” എന്ന പ്രയോഗത്തിന്റെ അർഥം വ്യാഖ്യാനത്തിൽ തർക്കവിഷയമാണ്. അത് വംശീയ ഇസ്രായേലിനെ മുഴുവനായോ, വിശ്വസിക്കുന്ന ശേഷിപ്പിനെയോ, ദൈവജനത്തിന്റെ പൂർണതയെയോ സൂചിപ്പിക്കുന്നുവെന്ന് പരിഭാഷ തീരുമാനിക്കുന്നില്ല.
    reason: alternative_reading
  - marker: c
    text: പദശഃ, “സീയോനിൽനിന്നു പുറത്തേക്ക്”; ἐκ എന്ന ഗ്രീക്ക് പദം ഇവിടെ ഉറവിടമോ പുറപ്പെടുന്ന സ്ഥലമോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ഈ വിധത്തിൽ
  rationale: മുൻസന്ദർഭത്തിൽ വിവരിച്ച പ്രക്രിയയുടെ രീതിയിലേക്കു വിരൽചൂണ്ടുന്ന അർഥം നിലനിർത്തുന്നു; വെറും ഫലസൂചനയായി ചുരുക്കുന്നില്ല.
- source_word: πᾶς Ἰσραήλ
  choice: ഇസ്രായേൽ മുഴുവനും
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവിക അർഥം നിലനിർത്തുകയും ‘ഇസ്രായേൽ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന തർക്കവിഷയം പരിഭാഷയിൽ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: σωθήσεται
  choice: രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല കർമണിപ്രയോഗവും പൗലൊസിന്റെ സന്ദർഭത്തിലെ രക്ഷാസംബന്ധമായ ശക്തമായ അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെതന്നെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവു സൂത്രവാക്യവും മുൻവാക്യത്തോടുള്ള പൊരുത്തവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἥξει
  choice: വരും
  rationale: പ്രവചനാത്മക ഉദ്ധരണിക്കു യോജിച്ച ലളിതവും സ്വാഭാവികവുമായ സമാനപദം.
- source_word: ἐκ Σιὼν
  choice: സീയോനിൽനിന്ന്
  rationale: ἐκ എന്നതിന്റെ ഉറവിടസൂചന നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളം.
- source_word: ὁ ῥυόμενος
  choice: വിടുവിക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന കർത്തൃവാചക കൃദന്തത്തെ അധിക വ്യാഖ്യാനം കൂടാതെ, ഗൗരവമുള്ളതും വ്യക്തവുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ἀποστρέψει
  choice: അകറ്റിക്കളയും
  rationale: എന്തിനെയെങ്കിലും ഒരാളിൽനിന്ന് തിരിച്ചു നീക്കുന്ന കാരണാർഥക ചലനത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀσεβείας
  choice: അഭക്തികളെ
  rationale: ഗ്രീക്കിലെ ബഹുവചനവും ദൈവത്തോടുള്ള അനാദരവുൾപ്പെടുന്ന ധാർമിക-മതപരമായ ശക്തിയും സംരക്ഷിക്കുന്നു.
- source_word: ἀπὸ Ἰακώβ
  choice: യാക്കോബിൽനിന്ന്
  rationale: ഉദ്ധരണിയിലെ ‘യാക്കോബ്’ എന്ന പേരും ‘ഇസ്രായേൽ’ എന്നതുമായ കാവ്യാത്മക ബന്ധവും മാറ്റമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ഇസ്രായേൽ മുഴുവനും’ എന്നതിന്റെ സൂചിതവിഭാഗം
  choice: വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ ‘ഇസ്രായേൽ മുഴുവനും’ എന്നു നിലനിർത്തി.
  alternative: വംശീയ ഇസ്രായേൽ മുഴുവനും; ഇസ്രായേലിലെ വിശ്വസിക്കുന്ന ശേഷിപ്പ്; വിജാതീയർ ഉൾപ്പെടുന്ന ദൈവജനത്തിന്റെ പൂർണത
  rationale: ഗ്രീക്ക് പ്രയോഗം തന്നെ ഈ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ വ്യക്തമായി തിരഞ്ഞെടുത്തിട്ടില്ല; അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഭാഷയിൽ തീർപ്പാക്കിയിട്ടില്ല.
- issue: ‘വിടുവിക്കുന്നവൻ’ എന്നതിന്റെ മിശിഹാസംബന്ധമായ തിരിച്ചറിയൽ
  choice: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന നാമവാചക പ്രയോഗമായി ‘വിടുവിക്കുന്നവൻ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: വിടുവിക്കുന്ന ഒരുവൻ; രക്ഷകൻ
  rationale: പൗലൊസിന്റെ സന്ദർഭത്തിലെ മിശിഹാസംബന്ധമായ പ്രയോഗത്തിന് യോജിച്ച ഗൗരവം നൽകുന്നു; എന്നാൽ മൂലത്തിൽ ഇല്ലാത്ത വ്യക്തിനാമമോ വിശദീകരണമോ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള തിരുവെഴുത്തുശൈലി ഉപയോഗിച്ചു. ‘അഭക്തികൾ’ അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ ബഹുവചനവും മത-ധാർമിക അർഥവും കൃത്യമായി നിലനിർത്തുന്നതിനായി തിരഞ്ഞെടുത്തു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും അവ വിശദീകരിക്കുന്ന വാക്കുകൾക്കരികിൽ മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
