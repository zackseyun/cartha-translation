  to: 'ഈ വിധത്തിൽ ഇസ്രായേൽ മുഴുവനും[b] രക്ഷിക്കപ്പെടും[a]. എഴുതിയിരിക്കുന്നതുപോലെതന്നെ: “വിടുവിക്കുന്നവൻ സീയോനിൽനിന്ന്[c] വരും; അവൻ യാക്കോബിൽനിന്ന് ദൈവഭക്തിയില്ലായ്മ അകറ്റിക്കളയും.”'
