id: ROM.11.13
reference: Romans 11:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: ml
  text: യഹൂദേതരരായ നിങ്ങളോടാണ് ഞാൻ പറയുന്നത്.[a] ഞാൻ യഹൂദേതരരുടെ അപ്പൊസ്തലനായിരിക്കുന്നതിനാൽ, എന്റെ ശുശ്രൂഷയെ മഹത്വപ്പെടുത്തുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യഹൂദേതരർ’ എന്നതിന് ഇരുസന്ദർഭങ്ങളിലും ‘ജനതകൾ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘എന്റെ ശുശ്രൂഷയെ ബഹുമാനിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: ജാതികളായ നിങ്ങളോടാണ് ഞാൻ പറയുന്നത്
  rationale: Ὑμῖν എന്ന നേരിട്ടുള്ള അഭിസംബോധനയും τοῖς ἔθνεσιν എന്ന അതിന്റെ വിശദീകരണവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ചു നൽകുന്നു. δέ ഇവിടെ ശക്തമായ വിരോധമല്ല, നേരിട്ടുള്ള അഭിസംബോധനയിലേക്കുള്ള മൃദുവായ മാറ്റമാണ്; മലയാളത്തിലെ വാക്യഘടനയും ഊന്നലും അതിന്റെ പ്രവാഹം വഹിക്കുന്നു.
- source_word: ἐφ’ ὅσον
  choice: ആയിരിക്കുന്നിടത്തോളം
  rationale: പൗലോസിന്റെ പ്രസ്താവനയുടെ പരിധിയോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; ഔപചാരികമായെങ്കിലും സ്വാഭാവികമായ മലയാളം.
- source_word: μὲν οὖν
  choice: വാക്യപ്രവാഹത്തിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: ഈ കണികാസമുച്ചയം തുടർച്ചയും മൃദുവായ ഊന്നലും നൽകുന്നു. അതിനെ പ്രത്യേക പദങ്ങളാൽ യാന്ത്രികമായി ആവർത്തിക്കുന്നതിനെക്കാൾ വാക്യക്രമത്തിൽ ഉൾക്കൊള്ളുന്നതാണ് സ്വാഭാവികം.
- source_word: ἐθνῶν ἀπόστολος
  choice: ജാതികളുടെ അപ്പൊസ്തലൻ
  rationale: റോമർ 9–11-ലെ യിസ്രായേൽ–യഹൂദേതര ജനവിഭാഗങ്ങൾ എന്ന വ്യത്യാസം നിലനിർത്തുന്നു. ἀπόστολος ഇവിടെ പൊതുവായ ‘ദൂതൻ’ എന്നതിലുപരി പൗലോസിന്റെ പ്രത്യേക ദൗത്യപദവിയാണ്.
- source_word: τὴν διακονίαν μου
  choice: എന്റെ ശുശ്രൂഷ
  rationale: διακονία പൗലോസിന്റെ അപ്പൊസ്തലിക സേവനത്തെയും നിയോഗത്തെയും സൂചിപ്പിക്കുന്നു; ‘ശുശ്രൂഷ’ ആ സേവനഭാവവും സഭാപരമായ പ്രയോഗവും ഒരുമിച്ച് വഹിക്കുന്നു.
- source_word: δοξάζω
  choice: മഹത്വപ്പെടുത്തുന്നു
  rationale: ശുശ്രൂഷയ്ക്ക് മഹത്വവും ബഹുമാനവും നൽകുക എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു; പൗലോസ് സ്വയം മഹത്വപ്പെടുത്തുന്നു എന്ന ആശയം വരുത്തുന്നില്ല.
theological_decisions:
- issue: പൗലോസ് തന്റെ ശുശ്രൂഷയെ മഹത്വപ്പെടുത്തുന്നു എന്നതിന്റെ അർഥം
  choice: തന്റെ ശുശ്രൂഷയുടെ മഹത്വവും പ്രാധാന്യവും ഉയർത്തിക്കാട്ടുന്നു
  alternative: തന്റെ ശുശ്രൂഷയെ ബഹുമാനിക്കുന്നു; അതിൽ പ്രശംസിക്കുന്നു
  rationale: δοξάζω എന്ന ക്രിയയുടെ കർമം ‘എന്റെ ശുശ്രൂഷ’യാണ്, പൗലോസ് തന്നെയല്ല. അതിനാൽ സ്വയംപുകഴ്ത്തൽ എന്ന വ്യാഖ്യാനം ഇറക്കുമതി ചെയ്യാതെ മൂലവാക്യത്തിന്റെ ശക്തിയും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
- issue: ἔθνη / ἐθνῶν എന്നതിന്റെ സൂചന
  choice: ജാതികൾ, അഥവാ യഹൂദേതര ജനങ്ങൾ
  alternative: രാജ്യങ്ങൾ; ജനതകൾ
  rationale: ഈ സന്ദർഭത്തിൽ യിസ്രായേലിനോടുള്ള വ്യത്യാസത്തിൽ യഹൂദേതരരെ ഉദ്ദേശിക്കുന്നു. ‘ജാതികൾ’ മൂലപദത്തിന്റെ ജനവിഭാഗസൂചന സംരക്ഷിക്കുകയും അടിക്കുറിപ്പ് അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അപ്പൊസ്തലൻ’, ‘ശുശ്രൂഷ’ എന്നീ പരിചിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയിട്ടുണ്ട്; വാക്യഘടന അനാവശ്യമായി സംസ്കൃതഭാരിതമാക്കിയിട്ടില്ല.
