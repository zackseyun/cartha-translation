revisions:
- from: ജാതികളായ നിങ്ങളോടാണ് ഞാൻ പറയുന്നത്.[a] ജാതികളുടെ അപ്പൊസ്തലനായിരിക്കുന്നിടത്തോളം ഞാൻ എന്റെ ശുശ്രൂഷയെ മഹത്വപ്പെടുത്തുന്നു.[b]
  to: യഹൂദേതരരായ നിങ്ങളോടാണ് ഞാൻ പറയുന്നത്.[a] ഞാൻ യഹൂദേതരരുടെ അപ്പൊസ്തലനായിരിക്കുന്നതിനാൽ, എന്റെ ശുശ്രൂഷയെ മഹത്വപ്പെടുത്തുന്നു.[b]
  rationale: The revision corrects the aspectual/logical force of ἐφ’ ὅσον and uses a clear modern Malayalam designation for the Gentile referent in this Jewish–non-Jewish context. It retains the source's mild discourse transition implicitly, preserves the direct address, and keeps the lexical alternatives anchored to their respective expressions.
