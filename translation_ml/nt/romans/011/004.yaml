  terminology: '''ബാൽ'' is an appropriate Malayalam form for Baal. ''മുട്ടുമടക്കാത്ത'' is an apt rendering of the idiom. ''എനിക്കായി'' properly represents ἐμαυτῷ. Footnote a gives legitimate alternatives; footnote b is appropriate for the ''kept/reserved'' nuance.'
