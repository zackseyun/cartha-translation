id: ROM.11.4
reference: Romans 11:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: ml
  text: എന്നാൽ ദൈവികമായ മറുപടി[a] അവനോട് എന്താണു പറയുന്നത്? “ബാലിന് മുട്ടുമടക്കാത്ത ഏഴായിരം പുരുഷന്മാരെ ഞാൻ എനിക്കായി ശേഷിപ്പിച്ചിരിക്കുന്നു[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ദൈവത്തിൽനിന്നുള്ള ഉത്തരം” അഥവാ “അരുളപ്പാട്.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ഞാൻ എനിക്കായി കാത്തുവെച്ചിരിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: ദൈവികമായ മറുപടി
  rationale: ഏലിയാവിനോടുള്ള ദൈവത്തിന്റെ അധികാരപൂർണമായ മറുപടിയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ‘ദൈവികമായ മറുപടി’ എന്നത് ഉറവിടം വ്യക്തമാക്കുകയും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു; ‘അരുളപ്പാട്’ എന്നതും സാധ്യമാണ്.
- source_word: Κατέλιπον
  choice: ശേഷിപ്പിച്ചിരിക്കുന്നു
  rationale: ഭൂതകാലത്തിൽ ദൈവം ചെയ്ത പ്രവൃത്തിയും അതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും ഈ പ്രയോഗം അറിയിക്കുന്നു. ‘ശേഷിപ്പിച്ചിരിക്കുന്നു’ ശേഷിപ്പിന്റെ ആശയം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐμαυτῷ
  choice: എനിക്കായി
  rationale: പ്രതിഫലന ദത്തിവ് ദൈവം ആ പുരുഷന്മാരെ തനിക്കായി ശേഷിപ്പിച്ചതിനെ സൂചിപ്പിക്കുന്നു. ‘എനിക്കായി’ നേരിട്ടും സ്വാഭാവികവുമായ മലയാളമാണ്.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: ഏഴായിരം പുരുഷന്മാരെ
  rationale: ഗ്രീക്കിൽ ലിംഗനിർദിഷ്ടമായ ἄνδρας ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ പൊതുവായ ‘ആളുകൾ’ എന്നതിനു പകരം ‘പുരുഷന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οἵτινες
  choice: …അല്ലാത്ത
  rationale: ഏഴായിരം പുരുഷന്മാരെ നിർവചിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി നാമത്തിനു മുമ്പുള്ള വിശേഷണവാക്യമായി നൽകി.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: മുട്ടുമടക്കാത്ത
  rationale: ആരാധനാപൂർവമായ കീഴടങ്ങലിനെ സൂചിപ്പിക്കുന്ന മൂലപാഠത്തിലെ ദൃശ്യരൂപം മലയാളത്തിലെ പരിചിതമായ ‘മുട്ടുമടക്കുക’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി.
- source_word: τῇ Βάαλ
  choice: ബാലിന്റെ മുമ്പിൽ
  rationale: ബാലിനോടുള്ള ആരാധനാപൂർവമായ മുട്ടുമടക്കലാണ് ഉദ്ദേശ്യം. മലയാളത്തിൽ ‘ബാലിന്റെ മുമ്പിൽ മുട്ടുമടക്കുക’ എന്നത് ബന്ധവും ദൃശ്യവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ സംസാരിക്കുന്നവൻ ദൈവമാണെന്ന് വ്യക്തമാക്കണമോ
  choice: χρηματισμός എന്നത് ‘ദൈവികമായ മറുപടി’ എന്നു നൽകി; ഉദ്ധരണിയിലെ ഒന്നാംപുരുഷ ദൈവവചനം നിലനിർത്തി.
  alternative: ദൈവിക ഉറവിടം വ്യക്തമാക്കാതെ ‘മറുപടി’ എന്നു മാത്രം നൽകുക; അല്ലെങ്കിൽ ‘അരുളപ്പാട്’ എന്നു നൽകുക.
  rationale: സന്ദർഭവും 1 രാജാക്കന്മാർ 19-ലെ ഉറവിടവും ഇത് ദൈവത്തിന്റെ മറുപടിയാണെന്ന് വ്യക്തമാക്കുന്നു. ഈ അർത്ഥം തുറന്നുപറയുന്നത് പാഠത്തിനപ്പുറമുള്ള പ്രത്യേക സിദ്ധാന്തം ചേർക്കുന്നില്ല.
- issue: ἄνδρας എന്ന പദത്തിന്റെ ലിംഗനിർദിഷ്ടത
  choice: പുരുഷന്മാർ
  alternative: ആളുകൾ
  rationale: മൂലപാഠം പൊതുവായ മനുഷ്യർ എന്ന പദമല്ല, പ്രത്യേകമായി പുരുഷന്മാരെ സൂചിപ്പിക്കുന്ന പദമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ ആ വ്യത്യാസം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലപാഠത്തിലെ ചോദ്യം, നേരിട്ടുള്ള ഉദ്ധരണം, ആരാധനാപൂർവമായ മുട്ടുമടക്കലിന്റെ ദൃശ്യരൂപം, പുരുഷലിംഗ നിർദേശം എന്നിവ സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
