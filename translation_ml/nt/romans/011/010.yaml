  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: ml
  text: അവർ കാണാതിരിക്കേണ്ടതിന് അവരുടെ കണ്ണുകൾ ഇരുണ്ടുപോകട്ടെ[a]; അവരുടെ മുതുക് നിരന്തരം[b] കുനിച്ചിടണമേ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവരുടെ കണ്ണുകൾ അന്ധമാകട്ടെ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘ഇരുണ്ടുപോകട്ടെ’ എന്നാണ്; ഇത് മൂലപാഠത്തിലെ ഇരുട്ടിന്റെ ദൃശ്യരൂപം നിലനിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘എപ്പോഴും’ എന്നും വിവർത്തനം ചെയ്യാം. ഈ പ്രയോഗം തുടർച്ചയായതോ സ്ഥിരമായതോ ആയ കാലദൈർഘ്യം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: ഇരുണ്ടുപോകട്ടെ
  rationale: മൂന്നാംപുരുഷ ബഹുവചന നിഷ്ക്രിയ ആജ്ഞാരൂപത്തിന്റെ പ്രാർഥനാത്മക ശാപവിധി നിലനിർത്തുന്നു. ‘അന്ധമാകട്ടെ’ എന്ന വ്യാഖ്യാനപരമായ പദത്തേക്കാൾ ഗ്രീക്കിലെ ഇരുട്ടിന്റെ ദൃശ്യരൂപം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: അവരുടെ കണ്ണുകൾ
  rationale: ശരീരാവയവത്തെ ആധാരമാക്കിയ മൂലരൂപകം വ്യക്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: τοῦ μὴ βλέπειν
  choice: അവർ കാണാതിരിക്കേണ്ടതിന്
  rationale: μή സഹിതമുള്ള ആർട്ടിക്കുലർ ഇൻഫിനിറ്റീവിന്റെ ഉദ്ദേശ്യം/ഫലം എന്ന അർത്ഥവ്യാപ്തി പൂർണമായി തീർപ്പാക്കാതെ പ്രകടിപ്പിക്കുന്നു.
- source_word: τὸν νῶτον αὐτῶν
  choice: അവരുടെ മുതുക്
  rationale: ഗ്രീക്കിലെ ഏകവചനരൂപം നിലനിർത്തുന്ന, മലയാളത്തിൽ സ്വാഭാവികമായ വിതരണാത്മക പ്രയോഗം.
- source_word: διὰ παντός
  choice: നിരന്തരം
  rationale: തുടർച്ചയായോ സ്ഥിരമായോ ഉള്ള കാലദൈർഘ്യം സൂചിപ്പിക്കുന്നു; ‘എന്നേക്കും’ എന്നതിലുള്ള കൂടുതൽ ശക്തമായ അന്തിമത്വം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: σύγκαμψον
  choice: കുനിച്ചിടണമേ
  rationale: ദൈവത്തോടു തിരിഞ്ഞുള്ള ഏകവചന ആജ്ഞയുടെ പ്രാർഥനാത്മക ഭാവവും മുതുക് വളയ്ക്കുന്ന ശാരീരിക രൂപകവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ശാപപ്രാർഥനയായ ഉദ്ധരണിയും ദൈവിക പ്രവർത്തകത്വവും
  choice: ‘ഇരുണ്ടുപോകട്ടെ ... കുനിച്ചിടണമേ’ എന്ന ആജ്ഞാത്മക-പ്രാർഥനാത്മക ശക്തി നിലനിർത്തി.
  alternative: ഇത് വെറും പ്രവചനമായി (‘ഇരുണ്ടുപോകും’) അല്ലെങ്കിൽ പ്രവർത്തകനെ വ്യക്തമാക്കാത്ത ഫലമായി അവതരിപ്പിക്കുക.
  rationale: പൗലോസ് ഉദ്ധരിക്കുന്ന വാക്യം ന്യായവിധിക്കായുള്ള ശാപപ്രാർഥനയുടെ ശക്തി വഹിക്കുന്നു. അതിനെ വെറും പ്രവചനമാക്കി മൃദൂകരിക്കാതെയും പാഠത്തിൽ ഇല്ലാത്ത ദൈവശാസ്ത്ര വിശദീകരണം ചേർക്കാതെയും വിവർത്തനം ചെയ്യുന്നു.
- issue: τοῦ μὴ βλέπειν എന്നതിലെ ഉദ്ദേശ്യം/ഫലം
  choice: ‘കാണാതിരിക്കേണ്ടതിന്’ എന്നു നൽകി ഇരുവശത്തേക്കും തുറന്ന ബന്ധം സൂക്ഷിച്ചു.
  alternative: ഉദ്ദേശ്യം മാത്രമായി ‘കാണാതിരിക്കാനായി’ എന്നോ ഫലം മാത്രമായി ‘അങ്ങനെ അവർ കാണാതെയായി’ എന്നോ നിർണ്ണയിക്കുക.
  rationale: ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം; വിവർത്തനം ആ യഥാർഥ അനിശ്ചിതത്വം അനാവശ്യമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കുനിച്ചിടണമേ’ എന്ന രൂപം ദൈവത്തോടുള്ള ആജ്ഞാത്മക പ്രാർഥനയുടെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു; വാക്യത്തിന്റെ കഠിനമായ ന്യായവിധിസ്വരം മൃദൂകരിച്ചിട്ടില്ല.
