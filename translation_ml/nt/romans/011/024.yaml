id: ROM.11.24
reference: Romans 11:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: ml
  text: 'നീ സ്വഭാവപ്രകാരം ഒരു കാട്ടൊലിവുമരത്തിൽനിന്ന് മുറിച്ചുമാറ്റപ്പെടുകയും, പ്രകൃതിക്കു വിരുദ്ധമായി നട്ടുവളർത്തിയ ഒലിവുമരത്തിൽ ഒട്ടിച്ചുചേർക്കപ്പെടുകയും ചെയ്തുവെങ്കിൽ, സ്വഭാവപ്രകാരമുള്ള ഈ കൊമ്പുകൾ[a] സ്വന്തം ഒലിവുമരത്തിലേക്ക് എത്രയധികം ഒട്ടിച്ചുചേർക്കപ്പെടും![b]


    [a] മറ്റൊരു പരിഭാഷ: “സ്വഭാവപ്രകാരം ഉള്ള ഇവർ.” ഗ്രീക്കിൽ “കൊമ്പുകൾ” എന്ന പദം ഇവിടെ നേരിട്ട് ഇല്ല; ഒലിവുമരത്തിന്റെ ഉപമയും സമീപസന്ദർഭവും പരിഗണിച്ചാണ് അത് ചേർത്തിരിക്കുന്നത്.


    [b] മറ്റൊരു പരിഭാഷ: “സ്വന്തം ഒലിവുമരത്തിലേക്ക് വീണ്ടും ഒട്ടിച്ചുചേർക്കപ്പെടും.” മടങ്ങിവരുന്ന ആശയം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും, “വീണ്ടും” എന്ന പദം ഗ്രീക്ക് ക്രിയയിൽ നേരിട്ട് ഇല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “സ്വഭാവപ്രകാരം ഉള്ള ഇവർ.” ഗ്രീക്കിൽ “കൊമ്പുകൾ” എന്ന പദം ഇവിടെ നേരിട്ട് ഇല്ല; ഒലിവുമരത്തിന്റെ ഉപമയും സമീപസന്ദർഭവും പരിഗണിച്ചാണ് അത് ചേർത്തിരിക്കുന്നത്.'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “സ്വന്തം ഒലിവുമരത്തിലേക്ക് വീണ്ടും ഒട്ടിച്ചുചേർക്കപ്പെടും.” മടങ്ങിവരുന്ന ആശയം സന്ദർഭത്തിൽ സൂചിതമാണെങ്കിലും, “വീണ്ടും” എന്ന പദം ഗ്രീക്ക് ക്രിയയിൽ നേരിട്ട് ഇല്ല.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: മുറിച്ചെടുക്കപ്പെടുകയും
  rationale: ἐκκόπτω എന്ന ക്രിയയുടെ ‘മുറിച്ചുനീക്കുക/മുറിച്ചെടുക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സമീപവാക്യങ്ങളിലെ ‘ഒടിച്ചുകളയുക’ എന്ന രൂപം ഇവിടെ അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἀγριελαίου
  choice: ഒരു കാട്ടൊലിവുമരം
  rationale: വളർത്തിയ ഒലിവുമരത്തോടുള്ള വ്യക്തമായ സസ്യശാസ്ത്രപരമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παρὰ φύσιν
  choice: പ്രകൃതിക്കു വിരുദ്ധമായി
  rationale: κατὰ φύσιν എന്നതിനോടുള്ള പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യം നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: ഒട്ടിച്ചുചേർക്കപ്പെടുകയും / ഒട്ടിച്ചുചേർക്കപ്പെടും
  rationale: ഒലിവുകൊമ്പ് മറ്റൊരു മരത്തിൽ ഗ്രാഫ്റ്റ് ചെയ്യുന്നതിനെ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം; കർമ്മണിപ്രയോഗവും സംരക്ഷിക്കുന്നു.
- source_word: καλλιέλαιον
  choice: നട്ടുവളർത്തിയ ഒലിവുമരം
  rationale: ‘നല്ല ഒലിവുമരം’ എന്ന മൂല്യനിർണയപരമായ ഭാഷ ഒഴിവാക്കി, കൃഷിചെയ്തു വളർത്തുന്ന ഒലിവുമരം എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: πόσῳ μᾶλλον
  choice: എത്രയധികമായി
  rationale: ലഘുവിൽനിന്ന് ഗുരുവിലേക്കുള്ള വാദരൂപം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: സ്വഭാവപ്രകാരം അതിന്റെ കൊമ്പുകളായ ഇവർ
  rationale: ‘കൊമ്പുകൾ’ ഗ്രീക്കിൽ അധ്യാഹൃതമാണെങ്കിലും സമീപസന്ദർഭത്തിലെ ഒലിവുമര-കൊമ്പ് ഉപമ അതിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു; ‘ഇവർ’ എന്നത് വ്യക്തികളെ സൂചിപ്പിക്കുന്നതും നിലനിർത്തുന്നു.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: സ്വന്തം ഒലിവുമരത്തിൽ
  rationale: ἰδίᾳ നൽകുന്ന സ്വന്തബന്ധത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുകയും ഗ്രാഫ്റ്റിംഗ് ഉപമയ്ക്കനുസരിച്ച് ലക്ഷ്യസ്ഥാനം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘ഇവർ’ എന്നത് യിസ്രായേലിനെയോ യെഹൂദരെയോ സൂചിപ്പിക്കുന്നുവെന്ന് വാക്യത്തിൽ തുറന്നുപറയണമോ
  choice: വംശീയനാമം ചേർക്കാതെ ‘സ്വഭാവപ്രകാരം അതിന്റെ കൊമ്പുകളായ ഇവർ’ എന്ന് ഉപമ നിലനിർത്തി.
  alternative: ‘ഈ യെഹൂദർ’ അല്ലെങ്കിൽ ‘ഈ യിസ്രായേല്യർ’
  rationale: സന്ദർഭത്തിൽ സൂച്യം വ്യക്തമായിരുന്നാലും, ഗ്രീക്ക് ഈ വാക്യത്തിൽ വംശീയനാമം ഉപയോഗിക്കുന്നില്ല; അതിനാൽ മൂലപാഠത്തിലെ ഉപമയും പരോക്ഷതയും സംരക്ഷിച്ചു.
- issue: ഗ്രീക്കിൽ നേരിട്ട് ഇല്ലാത്ത ‘കൊമ്പുകൾ’ എന്ന പദം ചേർക്കണമോ
  choice: വായനാസ്പഷ്ടതയ്ക്കായി മുഖ്യപാഠത്തിൽ ‘കൊമ്പുകൾ’ ചേർത്ത് അടിക്കുറിപ്പിൽ വിവരം നൽകി.
  alternative: ‘സ്വഭാവപ്രകാരം അതിൽപ്പെട്ട ഇവർ’
  rationale: മുൻസന്ദർഭം മുറിച്ചുമാറ്റപ്പെട്ടതും ഒട്ടിച്ചുചേർത്തതുമായ കൊമ്പുകളെക്കുറിച്ചാണ്; അതിനാൽ ഇത് കുറഞ്ഞ വ്യാഖ്യാനമുള്ള, സന്ദർഭസമ്മതമായ പൂർത്തീകരണമാണ്.
- issue: ἐγκεντρισθήσονται എന്നതിൽ ‘വീണ്ടും’ ചേർക്കണമോ
  choice: മുഖ്യപാഠത്തിൽ ‘വീണ്ടും’ ചേർത്തില്ല; അടിക്കുറിപ്പിൽ സന്ദർഭസൂചനയായി നൽകി.
  alternative: ‘വീണ്ടും ഒട്ടിച്ചുചേർക്കപ്പെടും’
  rationale: മടങ്ങിച്ചേർക്കൽ റോമർ 11-ന്റെ സന്ദർഭത്തിൽ ന്യായമായ ആശയമാണെങ്കിലും, ഈ ഗ്രീക്ക് ക്രിയയിൽ ‘വീണ്ടും’ നേരിട്ട് പ്രകടമല്ല; അതിനാൽ യഥാർഥ ഭാഷാപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഗ്രാഫ്റ്റ് ചെയ്യുക’ എന്ന വിദേശപദത്തിനു പകരം സാധാരണ വായനക്കാരന് ഉപമ മനസ്സിലാകുന്ന ‘ഒട്ടിച്ചുചേർക്കുക’ ഉപയോഗിച്ചു. ‘സ്വഭാവപ്രകാരം/പ്രകൃതിക്കു വിരുദ്ധമായി’ എന്ന സമാന്തരവൈരുധ്യം ഉദ്ദേശ്യപൂർവം നിലനിർത്തി.
