id: ROM.11.20
reference: Romans 11:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: ml
  text: ശരി[a]; അവിശ്വാസം നിമിത്തം അവർ ഒടിച്ചുമാറ്റപ്പെട്ടു; നീയോ വിശ്വാസത്താൽ നിലകൊള്ളുന്നു[b]. അഹങ്കരിക്കരുത്[c]; പകരം ഭയപ്പെടുക[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നന്നായി’ എന്നോ ‘അതു സത്യമാണ്’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിശ്വാസത്തിലൂടെ’ എന്നോ ‘ആശ്രയത്താൽ’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത്: ‘ഉന്നതഭാവം പുലർത്തരുത്’ അഥവാ ‘അഭിമാനത്തോടെ ചിന്തിക്കരുത്.’'
    reason: lexical_alternative
  - marker: d
    text: അതായത്, അഹങ്കാരപൂർവമായ അമിതവിശ്വാസത്തിനു പകരം ദൈവസന്നിധിയിൽ വിനയപൂർവമായ ഭയത്തോടും ജാഗ്രതയോടും കൂടെ ജീവിക്കുക.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: ശരി
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവന ശരിവെക്കുന്ന പ്രതികരണമാണ്; ‘ശരി’ എന്നത് അതിന്റെ സമ്മതസൂചന സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀπιστίᾳ
  choice: അവിശ്വാസം നിമിത്തം
  rationale: സന്ദർഭത്തിൽ ദാതിവ് കാരണത്തെ സൂചിപ്പിക്കുന്നു; πίστις എന്നതിനോടുള്ള വിരോധവും ‘അവിശ്വാസം’ നിലനിർത്തുന്നു.
- source_word: ἐξεκλάσθησαν
  choice: ഒടിച്ചുമാറ്റപ്പെട്ടു
  rationale: ഒലിവുമരത്തിന്റെ കൊമ്പുകളെക്കുറിച്ചുള്ള ചുറ്റുപാടിലെ രൂപകം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: ദാതിവ് ഇവിടെ നിലകൊള്ളുന്നതിനുള്ള മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു; ἀπιστίαയോടുള്ള നേരിട്ടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: ἕστηκας
  choice: നിലകൊള്ളുന്നു
  rationale: പൂർണ്ണകാലരൂപം മുൻപ്രവൃത്തിയുടെ ഫലമായ ഇപ്പോഴത്തെ സ്ഥിരാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘നിലകൊള്ളുന്നു’ അതിനെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ὑψηλὰ φρόνει
  choice: അഹങ്കരിക്കരുത്
  rationale: സ്വയം ഉയർന്നവനെന്നു കരുതുന്ന മനോഭാവത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: φοβοῦ
  choice: ഭയപ്പെടുക
  rationale: മുന്നറിയിപ്പിന്റെ തീക്ഷ്ണത മയപ്പെടുത്താതെ സൂക്ഷിക്കുന്നു; സന്ദർഭം ദൈവസന്നിധിയിലെ വിനയപൂർവമായ ഭയവും ജാഗ്രതയും ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: ἀπιστίαയോടു വൈരുധ്യത്തിലുള്ള πίστις എന്നതിന്റെ അർഥം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: അവിശ്വാസത്തോടുള്ള വൈരുധ്യം മനുഷ്യന്റെ വിശ്വാസപ്രതികരണത്തെയാണ് ഇവിടെ ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും ‘ആശ്രയം’ എന്നത് സാധുവായ വിശദീകരണപരമായ പകരമാണ്.
- issue: φοβοῦ എന്ന ആജ്ഞയുടെ ശക്തി
  choice: ഭയപ്പെടുക
  alternative: ഭയഭക്തിയോടെ ഇരിക്കുക; ഭയമുള്ളവനായിരിക്കുക
  rationale: ദൈവത്തിന്റെ ദയയും കാഠിന്യവും പരിഗണിച്ച് അഹങ്കാരത്തിനെതിരായ മുന്നറിയിപ്പാണിത്. ‘ഭയപ്പെടുക’ എന്നത് അതിനെ വെറും ബഹുമാനമായി മയപ്പെടുത്തുകയോ പരിഭ്രാന്തിയായി അതിശയിപ്പിക്കുകയോ ചെയ്യാതെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഒലിവുമരത്തിന്റെ കൊമ്പ് ഒടിച്ചുമാറ്റുന്ന രൂപകം സംരക്ഷിച്ചു. ‘ഭയപ്പെടുക’ എന്ന മൂർച്ചയുള്ള ആജ്ഞയെ മുഖ്യവാചകത്തിൽ മയപ്പെടുത്തിയിട്ടില്ല; സന്ദർഭപരമായ വിശദീകരണം അടിക്കുറിപ്പിൽ നൽകി.
