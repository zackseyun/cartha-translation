id: ROM.11.14
reference: Romans 11:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: ml
  text: എങ്ങനെയെങ്കിലും എന്റെ സ്വന്തജനത്തിൽ അസൂയ ഉണർത്തി, അവരിൽ ചിലരെ രക്ഷിക്കാനാകുമെങ്കിൽ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ πως
  choice: എങ്ങനെയെങ്കിലും … കഴിയുമെന്ന പ്രത്യാശയിൽ
  rationale: ഈ പ്രയോഗം ഉറപ്പിനെയല്ല, പൗലോസിന്റെ പ്രത്യാശയോടുകൂടിയ ലക്ഷ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ സ്വാഭാവികമായി ആ അനിശ്ചിതത്വവും ഉദ്ദേശ്യവും പ്രകടമാക്കുന്നു.
- source_word: παραζηλώσω
  choice: അസൂയ ഉണർത്തി
  rationale: വിജാതീയരുടെ ഉൾപ്പെടുത്തലിലൂടെ ഇസ്രായേലിൽ അസൂയ ഉളവാകുന്ന സമീപസന്ദർഭത്തിലെ ആശയം നിലനിർത്തുന്നു; വെറും ‘അസൂയപ്പെടുത്തുക’ എന്നതിനെക്കാൾ സ്വാഭാവികമായ മലയാളമാണ്.
- source_word: μου τὴν σάρκα
  choice: എന്റെ സ്വന്തജനം
  rationale: പദശഃ ‘എന്റെ ജഡം’ എന്നാണെങ്കിലും ഇവിടെ പൗലോസിന്റെ വംശീയ ബന്ധുക്കളായ സഹയഹൂദരെയാണ് സൂചിപ്പിക്കുന്നത്. മുഖ്യവാചകത്തിൽ അർത്ഥം സ്വാഭാവികമായി നൽകിയിട്ട് പദശഃ രൂപം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: σώσω
  choice: രക്ഷിക്കാൻ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇതിന് രക്ഷാസംബന്ധിയായ പൂർണ ഭാരം ഉണ്ട്; അതിനാൽ സാധാരണവും ദൈവശാസ്ത്രപരമായി സുതാര്യവുമായ പദം ഉപയോഗിച്ചു.
- source_word: τινὰς ἐξ αὐτῶν
  choice: അവരിൽ ചിലരെ
  rationale: മുമ്പു പറഞ്ഞ കൂട്ടത്തിൽനിന്നുള്ള ഒരു വിഭാഗത്തെയാണ് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഇത് കൃത്യവും സ്വാഭാവികവുമാണ്.
theological_decisions:
- issue: പൗലോസ് തന്റെ വംശീയ സമൂഹത്തെ σάρξ എന്നു വിളിക്കുന്നത്
  choice: മുഖ്യവാചകത്തിൽ ‘എന്റെ സ്വന്തജനം’; അടിക്കുറിപ്പിൽ ‘എന്റെ ജഡം’ എന്ന പദശഃ രൂപം
  alternative: ‘എന്റെ ജഡം’ എന്നു മുഖ്യവാചകത്തിൽ നൽകുക
  rationale: ഇവിടെ σάρξ ‘പാപസ്വഭാവം’ എന്നല്ല, സ്വാഭാവിക വംശബന്ധം എന്ന അർത്ഥത്തിലാണ്. ‘എന്റെ ജഡം’ എന്ന നേരിട്ടുള്ള മലയാളം സാധാരണ വായനക്കാരനെ തെറ്റിദ്ധരിപ്പിക്കാം; അതിനാൽ സന്ദർഭാർഥം മുഖ്യവാചകത്തിലും മൂലരൂപകം അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
- issue: ‘അവരിൽ ചിലരെ ഞാൻ രക്ഷിക്കും’ എന്നതിലെ പൗലോസിന്റെ പ്രവർത്തകഭാഷ
  choice: ‘അവരിൽ ചിലരെ രക്ഷിക്കാൻ’ എന്നു നേരിട്ട് നിലനിർത്തി
  alternative: ‘അവരിൽ ചിലർ രക്ഷിക്കപ്പെടാൻ ഇടയാക്കുക’
  rationale: സ്രോതസ്സിലെ ഒന്നാംപുരുഷ പ്രവർത്തകക്രിയയുടെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യത്തിലെ ആശയത്തെ ആശ്രയിക്കുന്നതിനാൽ, εἴ πως എന്നതിലെ അനിശ്ചിത പ്രത്യാശയെ ‘എങ്ങനെയെങ്കിലും … കഴിയുമെന്ന പ്രത്യാശയിൽ’ എന്നു അവതരിപ്പിച്ചു.
