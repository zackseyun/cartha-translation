id: ROM.11.29
reference: Romans 11:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: ml
  text: കാരണം, ദൈവത്തിന്റെ ദാനങ്ങളും വിളിയും പിൻവലിക്കപ്പെടാത്തവയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവത്തിന് അവയെക്കുറിച്ച് ഖേദമുണ്ടാകുന്നില്ല” അല്ലെങ്കിൽ “അവൻ അവ തിരിച്ചെടുക്കുന്നില്ല.” പഴയ വിവർത്തനങ്ങളിൽ “പശ്ചാത്താപമില്ലാത്തവ” എന്നും കാണാം.
    reason: ἀμεταμέλητα എന്ന പദത്തിന്റെ ‘ഖേദിക്കാത്തത്’ എന്നും ‘തിരിച്ചെടുക്കാത്തത്’ എന്നും ഉള്ള അർഥസാധ്യതകൾ സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: പിൻവലിക്കപ്പെടാത്തവയാണ്
  rationale: ഈ പദത്തിന് ‘പശ്ചാത്താപത്തിനോ ഖേദത്തിനോ ഇടയില്ലാത്തത്’ എന്നും ‘തിരിച്ചെടുക്കപ്പെടാത്തത്’ എന്നും അർഥസാധ്യതയുണ്ട്. ദൈവത്തിന്റെ ദാനങ്ങളും വിളിയും റദ്ദാക്കപ്പെടുകയില്ല എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ ഇതു വ്യക്തമാക്കുന്നു; അതേസമയം ‘മാറ്റമില്ലാത്തവ’ എന്നതുപോലെ അർഥപരിധി അതിരുകടക്കുന്നില്ല.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് അടിസ്ഥാനമോ വിശദീകരണമോ നൽകുന്ന ബന്ധകത്തിന്റെ ശക്തി വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: τὰ χαρίσματα
  choice: ദാനങ്ങൾ
  rationale: കൃപയാൽ നൽകപ്പെടുന്ന വരങ്ങൾ എന്ന ആശയം ഉൾക്കൊള്ളുന്ന സാധാരണവും മാന്യവുമായ മലയാളപദം; ബഹുവചനം നിലനിർത്തുന്നു.
- source_word: ἡ κλῆσις
  choice: വിളി
  rationale: ദൈവത്തിന്റെ ആഹ്വാനം എന്ന പൗലോസിന്റെ ഗൗരവമുള്ള പ്രയോഗം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു; അതിന്റെ ഫലപ്രാപ്തിയെക്കുറിച്ചുള്ള വ്യാഖ്യാനം വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ദാനങ്ങളോടും വിളിയോടും ദൈവത്തിനുള്ള ഉറവിടബന്ധമോ ഉടമസ്ഥബന്ധമോ ഏതാണ് മുഖ്യം എന്നു നിർണയിക്കാതെ ഗ്രീക്ക് ജനിറ്റീവിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ദാനങ്ങളും വിളിയും’ എന്നതിന്റെ സന്ദർഭപരമായ വ്യാപ്തി
  choice: ഇത് ഇസ്രായേലിനെ മാത്രം സൂചിപ്പിക്കുന്നതാണോ പൊതുവായി ദൈവത്തിന്റെ കൃപാദാനങ്ങളെയും വിളിയെയും കുറിച്ചുള്ള തത്ത്വമാണോ എന്ന് മുഖ്യവാക്യത്തിൽ വ്യക്തമാക്കാതെ മൂലപ്രയോഗം നിലനിർത്തി.
  alternative: റോമർ 9–11-ന്റെ സന്ദർഭത്തിൽ ഇസ്രായേലിന്റെ ഉടമ്പടിപരമായ അനുഗ്രഹങ്ങളെയും വിളിയെയും വ്യക്തമായി പരാമർശിക്കുക; അല്ലെങ്കിൽ എല്ലാ ദൈവിക ദാനങ്ങൾക്കും വിളിക്കും ബാധകമായ പൊതുതത്ത്വമായി തുറന്നുപറയുക.
  rationale: അടുത്ത സന്ദർഭം ശക്തമായി ഇസ്രായേലിനെ സംബന്ധിക്കുന്നുവെങ്കിലും, ഈ ഗ്രീക്ക് വാക്യം അതിന്റെ കർമവിഷയം വീണ്ടും തുറന്നുപറയുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും പ്രയോഗവ്യാപ്തിയിലെ തുറന്ന നിലയും വിവർത്തനം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘അപരിവർത്തനീയമാണ്’ പോലുള്ള സാങ്കേതിക പദത്തിനു പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘പിൻവലിക്കപ്പെടാത്തവയാണ്’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യവാക്യത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
