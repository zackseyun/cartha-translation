id: ROM.11.19
reference: Romans 11:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: ml
  text: 'അപ്പോൾ നീ പറയും: “എന്നെ ഒട്ടിച്ചുചേർക്കുന്നതിനായി ശാഖകൾ ഒടിച്ചുമാറ്റപ്പെട്ടു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: നീ പറയും
  rationale: λέγω എന്ന ക്രിയയുടെ ഭാവികാല കർത്തരി നിർദേശകരൂപം, ഏകവചന ദ്വിതീയപുരുഷൻ. പൗലോസ് സങ്കൽപ്പിത സംഭാഷകനോട് നേരിട്ട് സംസാരിക്കുന്ന ശൈലി നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അപ്പോൾ
  rationale: വാദത്തിന്റെ തുടർച്ചയും നിഗമനസ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Ἐξεκλάσθησαν
  choice: ഒടിച്ചുകളഞ്ഞു
  rationale: ἐκκλάω എന്ന ക്രിയയുടെ ഭൂതകാല കർമണി രൂപം. ഒലിവുമരത്തിന്റെ രൂപകം നിലനിർത്താൻ ‘മുറിച്ചുകളഞ്ഞു’ എന്നതിനെക്കാൾ ‘ഒടിച്ചുകളഞ്ഞു’ യോജിക്കുന്നു; മലയാളത്തിൽ കർമണി അർഥം സന്ദർഭവും ക്രിയാരൂപവും സ്വാഭാവികമായി നൽകുന്നു.
- source_word: κλάδοι
  choice: കൊമ്പുകൾ
  rationale: മരത്തിന്റെ ശാഖകളെ സൂചിപ്പിക്കുന്ന രൂപകത്തിന് സാധാരണവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἵνα
  choice: -േണ്ടതിന്
  rationale: ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കുന്ന ἵνα-വാക്യത്തിന്റെ തുറന്ന അർഥപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐγὼ
  choice: എന്നെ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ ഒന്നാംപുരുഷ സർവനാമത്തിന്റെ ഊന്നൽ മലയാളത്തിലെ വാക്യക്രമത്തിൽ ആദ്യം വെച്ചുകൊണ്ട് പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ἐγκεντρισθῶ
  choice: ഒട്ടിച്ചുചേർക്കേണ്ടതിന്
  rationale: ἐγκεντρίζω എന്നതിന്റെ കർമണി അർഥവും തോട്ടകൃഷിയിലെ grafting എന്ന പ്രവൃത്തിയും മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു. ‘അവയുടെ ഇടയിൽ’ എന്ന ആശയം ഈ വാക്യത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: സംസാരിക്കുന്നത് പൗലോസിന്റെ വാദത്തിലെ സങ്കൽപ്പിത സംഭാഷകനാണെന്ന് വ്യക്തമാക്കണമോ
  choice: വിശദീകരണം ചേർക്കാതെ നേരിട്ടുള്ള ഏകവചന ദ്വിതീയപുരുഷ അഭിസംബോധന നിലനിർത്തി
  alternative: “അപ്പോൾ ആരെങ്കിലും പറയും” അല്ലെങ്കിൽ “അപ്പോൾ നീ പറഞ്ഞേക്കാം”
  rationale: ഗ്രീക്ക് പാഠം നേരിട്ട് ‘നീ പറയും’ എന്നാണ് പറയുന്നത്. ‘ആരെങ്കിലും’ ചേർക്കുന്നതോ സാധ്യതാഭാവമാക്കുന്നതോ പാഠത്തെ വ്യാഖ്യാനപരമായി വികസിപ്പിക്കും.
- issue: ἵνα-വാക്യം ദൈവിക ഉദ്ദേശ്യത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ അംഗീകൃത പ്രസ്താവനയായി ശക്തിപ്പെടുത്തണമോ
  choice: സംഭാഷകന്റെ അവകാശവാദമായി ഉദ്ദേശ്യവാക്യം നേരിട്ട് പരിഭാഷപ്പെടുത്തി
  alternative: “എനിക്ക് ഒട്ടിച്ചുചേരാൻ കഴിയേണ്ടതിന്”
  rationale: ഇത് സങ്കൽപ്പിത ജാതീയവിശ്വാസിയുടെ നിഗമനമാണ്; അതിനെ പൗലോസിന്റെ അംഗീകൃത ദൈവശാസ്ത്രപ്രസ്താവനയായി പരിഭാഷയിൽ മാറ്റിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ഒലിവുമരത്തിന്റെ രൂപകം സംരക്ഷിച്ചിരിക്കുന്നു. വാക്യത്തിലെ സംക്ഷിപ്തമായ വാദശൈലിയും ‘എന്നെ’ എന്ന സർവനാമത്തിന്റെ പ്രാധാന്യവും നിലനിർത്തിയിരിക്കുന്നു.
