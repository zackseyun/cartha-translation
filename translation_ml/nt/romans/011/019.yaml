revisions:
- from: 'അപ്പോൾ നീ പറയും: “എന്നെ ഒട്ടിച്ചുചേർക്കേണ്ടതിന് കൊമ്പുകൾ ഒടിച്ചുകളഞ്ഞു.”'
  to: 'അപ്പോൾ നീ പറയും: “എന്നെ ഒട്ടിച്ചുചേർക്കുന്നതിനായി ശാഖകൾ ഒടിച്ചുമാറ്റപ്പെട്ടു.”'
  rationale: The revision preserves the direct address and the imagined speaker's claim while correcting the source-language passive voice. It retains the olive-tree metaphor and renders the ἵνα purpose clause naturally, without implying that the statement is Paul's endorsed theological conclusion.
