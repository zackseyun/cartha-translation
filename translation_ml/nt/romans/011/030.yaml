id: ROM.11.30
reference: Romans 11:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: ml
  text: കാരണം, നിങ്ങൾ ഒരിക്കൽ ദൈവത്തോട് അനുസരണക്കേട് കാണിച്ചവരായിരുന്നതുപോലെ, ഇപ്പോൾ അവരുടെ അനുസരണക്കേടുനിമിത്തം നിങ്ങൾക്കു കരുണ ലഭിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: കാരണം
  rationale: γάρ എന്നതിന്റെ വിശദീകരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ὥσπερ ആരംഭിക്കുന്ന താരതമ്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്നതിനാൽ, ഇവിടെ അസ്വാഭാവികമായ അപൂർണ താരതമ്യഘടന ഒഴിവാക്കി; ആശയബന്ധം തുടർന്നുള്ള വാക്യത്തിലേക്ക് തുറന്നുനിൽക്കുന്നു.
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: രണ്ടാം പുരുഷ ബഹുവചനം നേരിട്ട് നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ജാതികളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും അത് വാക്യത്തിലേക്ക് വിശദീകരണമായി ചേർത്തിട്ടില്ല.
- source_word: ποτε
  choice: ഒരിക്കൽ
  rationale: മുൻകാലാവസ്ഥയും νῦν സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ അവസ്ഥയും തമ്മിലുള്ള വ്യത്യാസം സംക്ഷിപ്തമായി പ്രകടമാക്കുന്നു.
- source_word: ἠπειθήσατε τῷ θεῷ
  choice: ദൈവത്തെ അനുസരിക്കാതിരുന്നവരായിരുന്നു
  rationale: ἀπειθέω എന്ന പദത്തിലെ അനുസരണക്കേടിന്റെ ഭാവം നിലനിർത്തുകയും ദൈവത്തോടുള്ള ബന്ധപരവും നൈതികവുമായ നിലപാട് സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: νῦν δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻകാല അനുസരണക്കേടും ഇപ്പോഴത്തെ കരുണലഭിക്കലും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം നിലനിർത്തുന്നു.
- source_word: ἠλεήθητε
  choice: നിങ്ങൾക്കു കരുണ ലഭിച്ചിരിക്കുന്നു
  rationale: ദൈവിക കരുണ സ്വീകരിച്ചവരെന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ സ്വീകർത്തൃകേന്ദ്രിതമായ ഊന്നൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: അവരുടെ അനുസരണക്കേടുനിമിത്തം
  rationale: ദാതിവിന്റെ കാരണപരമോ ഉപകരണപരമോ ആയ സാധ്യതയിൽ കാരണബന്ധം വ്യക്തമായി നൽകുന്നു; τούτων എന്നത് സന്ദർഭത്തിലെ അവരെ സൂചിപ്പിക്കുന്നതിനാൽ ‘അവരുടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
theological_decisions:
- issue: ἀπειθέω / ἀπείθεια എന്ന പദകുടുംബത്തിന്റെ അർഥം
  choice: അനുസരിക്കാതിരിക്കുക / അനുസരണക്കേട്
  alternative: വിശ്വസിക്കാതിരിക്കുക / അവിശ്വാസം
  rationale: ഈ സന്ദർഭത്തിൽ വിശ്വാസമില്ലായ്മയും അനുസരണക്കേടും അർഥപരമായി പരസ്പരം ചേരാം. എങ്കിലും ക്രിയയും നാമവും തമ്മിലുള്ള ബന്ധം നിലനിർത്താനും അർഥത്തെ ബൗദ്ധിക അവിശ്വാസത്തിലേക്ക് മാത്രം ചുരുക്കാതിരിക്കാനും പ്രധാന പാഠത്തിൽ അനുസരണക്കേടിന്റെ ഭാഷ ഉപയോഗിച്ചു; മറ്റുസാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
- issue: τῇ τούτων ἀπειθείᾳ എന്ന ദാതിവിന്റെ ബന്ധം
  choice: അവരുടെ അനുസരണക്കേടുനിമിത്തം
  alternative: അവരുടെ അനുസരണക്കേടിലൂടെ
  rationale: ഗ്രീക്ക് ദാതിവ് കാരണപരമായും ഉപകരണപരമായും ഗ്രഹിക്കാവുന്നതാണ്. മലയാളത്തിലെ ‘നിമിത്തം’ കാരണബന്ധം വ്യക്തമായി നൽകുമ്പോഴും ദൈവത്തിന്റെ രക്ഷാപ്രവർത്തനത്തെ അനുസരണക്കേട് സ്വതന്ത്രമായി സൃഷ്ടിച്ചുവെന്ന ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘കരുണ ലഭിച്ചിരിക്കുന്നു’ എന്നത് സ്വാഭാവികതയ്ക്കായി ഉപയോഗിച്ചു. വാക്യം 11:31-ൽ പൂർത്തിയാകുന്ന താരതമ്യത്തിന്റെ ആദ്യഭാഗമായതിനാൽ അവസാനത്തിൽ പൂർണവിരാമത്തിനു പകരം തുടർച്ച സൂചിപ്പിക്കുന്ന കോമ ഉപയോഗിക്കാവുന്നതാണ്; നൽകിയ കരടിൽ സ്വതന്ത്ര വാക്യമായി വായിക്കാനും സാധിക്കുന്ന വിധം പൂർണവിരാമം വെച്ചിരിക്കുന്നു.
