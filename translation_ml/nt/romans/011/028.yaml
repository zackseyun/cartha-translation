id: ROM.11.28
reference: Romans 11:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: ml
  text: സുവിശേഷത്തെ സംബന്ധിച്ചിടത്തോളം[a], നിങ്ങൾ നിമിത്തം അവർ ശത്രുക്കളാണ്; എന്നാൽ തിരഞ്ഞെടുപ്പിനെ സംബന്ധിച്ചിടത്തോളം, പിതാക്കന്മാർ[b] നിമിത്തം അവർ പ്രിയപ്പെട്ടവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സുവിശേഷത്തിന്റെ കാര്യത്തിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പിതാക്കന്മാർ’ എന്നത് യിസ്രായേലിന്റെ ഗോത്രപിതാക്കന്മാരെ, പ്രത്യേകിച്ച് അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് എന്നിവരെ, സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: സുവിശേഷത്തെ സംബന്ധിച്ചിടത്തോളം
  rationale: κατά + accusative ഇവിടെ പരിഗണനയുടെ മേഖലയെ സൂചിപ്പിക്കുന്നു. μέν…δέ കൊണ്ടുള്ള വിരുദ്ധസമാന്തര ഘടന നിലനിർത്തിക്കൊണ്ട് ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἐχθροὶ
  choice: ശത്രുക്കളാണ്
  rationale: നാമസദൃശമായി പ്രയോഗിച്ചിരിക്കുന്ന ബഹുവചന വിശേഷണത്തിന്റെ ബന്ധപരമായ ശക്തി നിലനിർത്തുന്നു; ‘വിരോധമുള്ളവർ’ എന്നു മയപ്പെടുത്തുകയോ ‘വെറുക്കപ്പെട്ടവർ’ എന്നു ദൈവത്തിന്റെ മനോഭാവമായി വ്യാഖ്യാനിക്കുകയോ ചെയ്യുന്നില്ല.
- source_word: δι’ ὑμᾶς
  choice: നിങ്ങൾ നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കാവുന്ന കാരണം/പ്രയോജനം എന്ന ഇരട്ടനിറം അനാവശ്യമായി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: എന്നാൽ തിരഞ്ഞെടുപ്പിനെ സംബന്ധിച്ചിടത്തോളം
  rationale: ആദ്യപാദത്തോടുള്ള സമാന്തരതയും വിരോധവും നിലനിർത്തുന്നു; ἐκλογήയുടെ ദൈവശാസ്ത്രപരമായ ഭാരം വ്യാഖ്യാനപരമായ വിപുലീകരണമില്ലാതെ ‘തിരഞ്ഞെടുപ്പ്’ എന്ന പദം വഹിക്കുന്നു.
- source_word: ἀγαπητοὶ
  choice: പ്രിയപ്പെട്ടവരാണ്
  rationale: അവർ സ്നേഹിക്കപ്പെടുന്നവരാണെന്ന ബന്ധപരവും ഉടമ്പടിസംബന്ധവുമായ ആശയം dignified, natural Malayalam-ൽ പ്രകടമാക്കുന്നു; ‘ശത്രുക്കൾ’ എന്നതുമായുള്ള വാക്യത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
- source_word: διὰ τοὺς πατέρας
  choice: പിതാക്കന്മാർ നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന അടിസ്ഥാനമോ കാരണമോ നേരിട്ട് നൽകുന്നു; πατέρες എന്ന പൗലോസിന്റെ ഉടമ്പടിസംബന്ധമായ ചുരുക്കപ്രയോഗം മുഖ്യവാചകത്തിൽ വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘അവർ’ എന്നതിന്റെ സൂചിതവിഷയം
  choice: റോമർ 9–11-ലെ വാദത്തിൽ യിസ്രായേൽ/യെഹൂദജനതയെ സമൂഹമായി സൂചിപ്പിക്കുന്ന വിധത്തിൽ സർവനാമം നിലനിർത്തി.
  alternative: പൗലോസിന്റെ കാലത്തെ അവിശ്വാസികളായ യെഹൂദരെ മാത്രം സൂചിപ്പിക്കുന്നു എന്നു മുഖ്യവാചകത്തിൽ ചുരുക്കുക.
  rationale: സന്ദർഭം യിസ്രായേലിനെ സമൂഹമായി പരിഗണിക്കുന്നുവെങ്കിലും അന്നത്തെ അവിശ്വാസസ്ഥിതി പശ്ചാത്തലത്തിലുണ്ട്. പരിഭാഷ ഗ്രീക്കിനേക്കാൾ ഇടുങ്ങിയ പരിധി നിർണ്ണയിക്കുന്നില്ല.
- issue: ‘ശത്രുക്കൾ’ എന്നതിന്റെ അർഥം
  choice: സുവിശേഷവുമായി ബന്ധപ്പെട്ട അവരുടെ നിലയെ സൂചിപ്പിക്കുന്നതായി, അതോടൊപ്പം ‘പ്രിയപ്പെട്ടവർ’ എന്ന മറുവശവും പൂർണമായി നിലനിർത്തി.
  alternative: ദൈവം അവരെ സമ്പൂർണമായി വെറുക്കുന്നു എന്നോ അവർ വെറും സാമൂഹിക എതിരാളികളാണെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: വാക്യം തന്നെയുള്ള ‘ശത്രുക്കൾ/പ്രിയപ്പെട്ടവർ’ എന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കണം.
- issue: ‘പിതാക്കന്മാർ’ എന്നതിന്റെ അർഥം
  choice: മുഖ്യവാചകത്തിൽ അക്ഷരാർഥപ്രയോഗം നിലനിർത്തി; അടിക്കുറിപ്പിൽ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ് തുടങ്ങിയ ഗോത്രപിതാക്കന്മാരെ വ്യക്തമാക്കുന്നു.
  alternative: മുഖ്യവാചകത്തിൽ തന്നെ ‘ഗോത്രപിതാക്കന്മാർ’ എന്നു വിപുലീകരിക്കുക, അല്ലെങ്കിൽ പൊതുവായി എല്ലാ പൂർവികരെയും ഉദ്ദേശിക്കുന്നതായി എടുക്കുക.
  rationale: റോമർ 9–11-ൽ ഈ പദം ഗോത്രപിതാക്കന്മാരെയും അവർക്കു നൽകിയ വാഗ്ദാനങ്ങളെയും സ്വാഭാവികമായി ഓർമിപ്പിക്കുന്നു; എന്നാൽ മൂലവാചകത്തിന്റെ സംക്ഷിപ്തത മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. μέν…δέ വിരുദ്ധസമാന്തരത ‘…സംബന്ധിച്ചിടത്തോളം… എന്നാൽ …സംബന്ധിച്ചിടത്തോളം…’ എന്ന ഘടനയിലൂടെ സംരക്ഷിച്ചു. കാരണം/പ്രയോജനം, ശത്രുത/സ്നേഹം, ഇപ്പോഴത്തെ സുവിശേഷബന്ധം/തിരഞ്ഞെടുപ്പിന്റെ ഉടമ്പടിബന്ധം എന്നീ സംഘർഷങ്ങൾ വ്യാഖ്യാനിച്ച് ഒതുക്കിയിട്ടില്ല.
