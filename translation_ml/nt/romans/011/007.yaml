id: ROM.11.7
reference: Romans 11:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: ml
  text: അപ്പോൾ എന്ത്? ഇസ്രായേൽ അന്വേഷിക്കുന്നത് അതിന് നേടാനായില്ല; എന്നാൽ തിരഞ്ഞെടുക്കപ്പെട്ടവർ[a] അതു നേടി. ശേഷിച്ചവരോ കഠിനരാക്കപ്പെട്ടു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: ‘തിരഞ്ഞെടുപ്പ് അതു നേടി.’ ഇവിടെ ‘തിരഞ്ഞെടുപ്പ്’ എന്നത് തിരഞ്ഞെടുക്കപ്പെട്ട ആളുകളെ സൂചിപ്പിക്കുന്നതാകാം.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘മരവിപ്പിക്കപ്പെട്ടു.’ ഈ ക്രിയ കഠിനരാക്കപ്പെടുന്നതിനെയോ ആത്മീയമായി സംവേദനശൂന്യരാക്കപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കാം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: അപ്പോൾ എന്ത്?
  rationale: പൗലോസ് മുൻവാദത്തിൽനിന്നുള്ള നിഗമനമോ ഫലമോ ഉന്നയിക്കാൻ ഉപയോഗിക്കുന്ന സംക്ഷിപ്തമായ ആലങ്കാരിക ചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: ഇസ്രായേൽ അന്വേഷിക്കുന്നത്
  rationale: ἐπιζητεῖ എന്ന വർത്തമാനകാല ക്രിയയിലെ തുടരുന്ന അന്വേഷണഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ‘ഇസ്രായേൽ’ ഇവിടെ സമൂഹമായാണ് വരുന്നത്.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: അതിന് ലഭിച്ചില്ല
  rationale: ἐπιτυγχάνω ഇവിടെ അന്വേഷിച്ചതു നേടുക/ലഭിക്കുക എന്ന അർഥത്തിലാണ്. മുമ്പുള്ള ‘ഇസ്രായേൽ’ എന്ന സമൂഹനാമത്തെ ഏകവചനമായി സൂചിപ്പിച്ച് ഗ്രീക്കിലെ ആവർത്തനത്തിനുള്ള പശ്ചാത്തലം നിലനിർത്തുന്നു.
- source_word: ἡ δὲ ἐκλογὴ ἐπέτυχεν
  choice: എന്നാൽ തിരഞ്ഞെടുക്കപ്പെട്ടവർക്ക് അതു ലഭിച്ചു
  rationale: ἐκλογή അക്ഷരാർഥത്തിൽ ‘തിരഞ്ഞെടുപ്പ്’ ആണെങ്കിലും, ‘ശേഷിച്ചവർ’ എന്ന വ്യക്തിസമൂഹത്തോടുള്ള വൈരുധ്യം ഇവിടെ തിരഞ്ഞെടുക്കപ്പെട്ട ആളുകളെ സൂചിപ്പിക്കുന്നതായി കാണിക്കുന്നു. ‘ലഭിച്ചു’ എന്ന ആവർത്തനം ἐπέτυχεν എന്ന ക്രിയയുടെ ആവർത്തനം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: οἱ δὲ λοιποὶ
  choice: ശേഷിച്ചവരോ
  rationale: തിരഞ്ഞെടുക്കപ്പെട്ടവരോട് വൈരുധ്യത്തിൽ നിൽക്കുന്ന ബാക്കിയുള്ള ആളുകളെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐπωρώθησαν
  choice: കഠിനരാക്കപ്പെട്ടു
  rationale: ആത്മീയ സംവേദനക്ഷമത നഷ്ടപ്പെടുന്ന കാഠിന്യത്തിന്റെ രൂപകം നിലനിർത്തുകയും ഗ്രീക്കിലെ കർമണിപ്രയോഗം അനിശ്ചിത കർത്താവോടുകൂടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἡ ἐκλογὴ എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ‘തിരഞ്ഞെടുക്കപ്പെട്ടവർ’ എന്നു വ്യക്തിസമൂഹമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘തിരഞ്ഞെടുപ്പ്’
  rationale: ‘ശേഷിച്ചവർ’ എന്ന തുടർന്നുള്ള വിരുദ്ധസമൂഹം ഇവിടെ അമൂർത്തമായ തിരഞ്ഞെടുപ്പിനേക്കാൾ തിരഞ്ഞെടുക്കപ്പെട്ട ആളുകളെയാണ് ഉദ്ദേശിക്കുന്നതെന്ന് സൂചിപ്പിക്കുന്നു. അടിക്കുറിപ്പിൽ അക്ഷരാർഥം സംരക്ഷിക്കുന്നു.
- issue: ἐπωρώθησαν എന്നതിലെ കർത്താവും പ്രവർത്തകത്വവും
  choice: കർത്താവിനെ വ്യക്തമാക്കാതെ ‘കഠിനരാക്കപ്പെട്ടു’ എന്ന കർമണിപ്രയോഗം നിലനിർത്തി.
  alternative: ‘ദൈവം അവരെ കഠിനരാക്കി’ അല്ലെങ്കിൽ ‘അവർ സ്വയം കഠിനരായി’
  rationale: ഗ്രീക്ക് വാക്യം പ്രവർത്തകനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവിക ന്യായവിധിയും മനുഷ്യ ഉത്തരവാദിത്വവും സംബന്ധിച്ച വേദഭാഗത്തിലെ സംഘർഷം പരിഭാഷയിൽ ഏകപക്ഷീയമായി പരിഹരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിലെ ശക്തമായ വൈരുധ്യം അർദ്ധവിരാമംകൊണ്ടും ‘എന്നാൽ’, ‘-രോ’ എന്നീ ഘടകങ്ങളിലൂടെയും നിലനിർത്തി. കർമണിപ്രയോഗത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം സംരക്ഷിച്ചു.
