id: ROM.11.15
reference: Romans 11:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: ml
  text: എന്തെന്നാൽ, അവരുടെ തിരസ്കാരം ലോകത്തിനു അനുരഞ്ജനം ആണെങ്കിൽ, അവരുടെ സ്വീകാര്യത മരിച്ചവരിൽനിന്നുള്ള ജീവനല്ലാതെ മറ്റെന്തായിരിക്കും?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വീകരിക്കൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പദം ‘തിരസ്കാരം’ എന്നതിനോട് വിപരീതമായി നിൽക്കുന്നു; വീണ്ടും സ്വീകരിക്കപ്പെടുന്നതെയോ അംഗീകരിക്കപ്പെടുന്നതെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘മരിച്ചവരിൽനിന്നുള്ള ജീവൻ’ എന്നത് അസാധാരണമായ ആത്മീയ നവീകരണത്തെ ആലങ്കാരികമായി സൂചിപ്പിക്കാം; അല്ലെങ്കിൽ കൂടുതൽ പ്രത്യേകമായി ഉയിർത്തെഴുന്നേൽപ്പിനെ സൂചിപ്പിക്കാം. പൗലോസ് ഈ പ്രയോഗം സംക്ഷിപ്തവും സൂചനാസമ്പന്നവുമായി വിടുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: തിരസ്കാരം
  rationale: ബന്ധപരമായി തള്ളിക്കളയപ്പെടുകയോ മാറ്റിനിർത്തപ്പെടുകയോ ചെയ്യുന്ന ആശയം സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു; ‘നഷ്ടം’ എന്നതിനെക്കാൾ ശക്തവും സ്വാഭാവികവുമാണ്.
- source_word: καταλλαγὴ
  choice: അനുരഞ്ജനം
  rationale: തകർന്ന ബന്ധം പുനഃസ്ഥാപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പതിവ് ആശയം കൃത്യമായി നൽകുന്നു.
- source_word: κόσμου
  choice: ലോകത്തിന്റെ
  rationale: സന്ദർഭത്തിൽ ജനതകൾ ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ഗ്രീക്ക് പദത്തിന്റെ വിശാലത ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: πρόσλημψις
  choice: സ്വീകാര്യത
  rationale: ἀποβολή എന്ന ‘തിരസ്കാരം’ എന്ന പദത്തോടുള്ള പ്രത്യക്ഷ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും വീണ്ടും സ്വീകരിക്കപ്പെടുക എന്ന അർഥം ഉൾക്കൊള്ളുകയും ചെയ്യുന്നു.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്നുള്ള ജീവൻ
  rationale: ഗ്രീക്കിന്റെ സജീവവും സംക്ഷിപ്തവുമായ പ്രയോഗം നിലനിർത്തുന്നു; ആത്മീയ നവീകരണമോ ഉയിർത്തെഴുന്നേൽപ്പോ എന്ന് മുഖ്യവാചകത്തിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: εἰ μὴ
  choice: അല്ലാതെ മറ്റെന്ത്
  rationale: ആലങ്കാരിക ചോദ്യത്തിലെ പ്രതീക്ഷിക്കപ്പെടുന്ന ഊന്നിയ ഉത്തരത്തെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: γὰρ
  choice: എങ്കിൽ
  rationale: വാക്യത്തിലെ കാരണാത്മക-താർക്കിക ബന്ധം വ്യവസ്ഥാവാക്യഘടനയിലൂടെ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാകുന്നു; വേറിട്ട ‘കാരണം’ ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതാകും.
theological_decisions:
- issue: ‘മരിച്ചവരിൽനിന്നുള്ള ജീവൻ’ എന്നതിന്റെ അർഥം
  choice: ആത്മീയ നവീകരണമാണോ ഉയിർത്തെഴുന്നേൽപ്പാണോ എന്ന് നിർണ്ണയിക്കാതെ തുറന്ന അന്തകാലസൂചനയായി നിലനിർത്തി.
  alternative: വലിയ ആത്മീയ ഉണർവ്; അന്തിമ ഉയിർത്തെഴുന്നേൽപ്പ്; ഇവ രണ്ടും ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്ത പ്രയോഗം.
  rationale: പൗലോസിന്റെ പ്രയോഗം സംക്ഷിപ്തവും സൂചനാസമ്പന്നവുമാണ്; ഗ്രീക്കിൽ ഉള്ള ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം പരിഭാഷ പരിഹരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യസ്വഭാവവും ‘തിരസ്കാരം/സ്വീകാര്യത’ എന്ന വിരുദ്ധജോടിയും സംരക്ഷിച്ചു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
