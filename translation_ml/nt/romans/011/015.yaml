    rationale: πρόσλημψις is contrasted with ἀποβολή; ‘വൈരുധ്യം പുലർത്തുന്നു’ can suggest a contradiction rather than a deliberate antithesis. ‘വിപരീതമായി നിൽക്കുന്നു’ is clearer.
  revised_text: എന്തെന്നാൽ, അവരുടെ തിരസ്കാരം ലോകത്തിനു അനുരഞ്ജനം ആണെങ്കിൽ, അവരുടെ സ്വീകാര്യത മരിച്ചവരിൽനിന്നുള്ള ജീവനല്ലാതെ മറ്റെന്തായിരിക്കും?[a][b]
