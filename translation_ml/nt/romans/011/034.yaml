  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: ml
  text: എന്തെന്നാൽ, കർത്താവിന്റെ മനസ്സ് അറിഞ്ഞത് ആര്? അല്ലെങ്കിൽ, അവിടുത്തെ ഉപദേഷ്ടാവായിത്തീർന്നത് ആര്?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ പൗലോസ് യെശയ്യാവ് 40:13-നെ പ്രതിധ്വനിപ്പിക്കുന്നു. അവിടത്തെ ഗ്രീക്ക് പാഠത്തിലും കർത്താവിന്റെ മനസ്സ് ആരറിഞ്ഞു എന്നും അവിടുത്തെ ഉപദേഷ്ടാവായത് ആര് എന്നും ചോദിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: ആര്
  rationale: അലങ്കാരപ്രശ്നം ആരംഭിക്കുന്ന ചോദനസർവനാമം; ലളിതവും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിച്ച് അതിന് അടിസ്ഥാനം നൽകുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἔγνω
  choice: അറിഞ്ഞവൻ
  rationale: γινώσκωയുടെ അടിസ്ഥാനാർഥമായ ‘അറിയുക’ നിലനിർത്തുന്നു; അലങ്കാരപ്രശ്നത്തിൽ മലയാളത്തിൽ സ്വാഭാവികമായ പൂർത്തികൃത്യഭാവം നൽകുന്നു.
- source_word: νοῦν
  choice: മനസ്സ്
  rationale: ചിന്ത, ഉദ്ദേശ്യം, ഗ്രഹണം എന്നിവ ഉൾക്കൊള്ളാവുന്ന νοῦς എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പാരമ്പര്യപരവുമായ തുല്യപദം.
- source_word: κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്നതിന് പ്രോജക്റ്റിന്റെ സാധാരണ പരിഭാഷ; യെശയ്യാവിൽനിന്നുള്ള പ്രതിധ്വനിയെ പുതിയനിയമത്തിന്റെ ഗ്രീക്ക് രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: സമാന്തരമായ രണ്ടാമത്തെ അലങ്കാരപ്രശ്നത്തെ ആദ്യത്തേതുമായി വിഭാജകമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: σύμβουλος
  choice: ഉപദേഷ്ടാവ്
  rationale: ഉപദേശം നൽകുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, ആധുനികവും മാന്യവുമായ മലയാളപദം.
- source_word: αὐτοῦ
  choice: അവിടുത്തെ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന മാന്യമായ മലയാള സർവനാമരൂപം; ഉടമസ്ഥബന്ധം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἐγένετο
  choice: ആയിത്തീർന്നവൻ
  rationale: ‘ആകുക/ആയിത്തീരുക’ എന്ന γίνομαιയുടെ അർഥവും ഒരാൾ ആ സ്ഥാനത്തെത്തിയെന്ന ആശയവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: യെശയ്യാവിൽനിന്നുള്ള ഉദ്ധരണിയിലെ ‘കർത്താവ്’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: വാചകത്തിൽ ‘കർത്താവ്’ എന്നു മാത്രം നൽകി, സൂചനയെ കൂടുതൽ ചുരുക്കിനിർവചിച്ചില്ല.
  alternative: യെശയ്യാവിന്റെ പശ്ചാത്തലത്തിലെ ദൈവനാമം മുൻനിർത്തി ‘യഹോവ’ എന്നോ പ്രത്യേക അക്ഷരരൂപത്തിലോ നൽകുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ κυρίου എന്നാണ്; പൗലോസിന്റെ ഗ്രീക്ക് ഉദ്ധരണിരൂപവും ദൈവത്തിന്റെ അഗാധജ്ഞാനത്തെക്കുറിച്ചുള്ള സന്ദർഭവും അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ മാന്യവും തിരുവെഴുത്തുശൈലിക്ക് യോജിച്ചതുമായ ഭാഷ ഉപയോഗിച്ചു. ‘ഉപദേഷ്ടാവ്’ വ്യക്തവും സ്വാഭാവികവുമാണ്; അലങ്കാരപ്രശ്നങ്ങളുടെ സമാന്തരഘടന സംരക്ഷിച്ചു.
