id: ROM.11.23
reference: Romans 11:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: ml
  text: അവരും അവിശ്വാസത്തിൽ തുടരാതിരുന്നാൽ ഒട്ടിച്ചേർക്കപ്പെടും; കാരണം അവരെ വീണ്ടും ഒട്ടിച്ചേർക്കാൻ ദൈവത്തിനു കഴിയും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: അവരും
  rationale: καί എന്നതിന്റെ കൂട്ടിച്ചേർക്കൽഭാവവും ἐκεῖνοι എന്നതിന്റെ മുൻപ് പറഞ്ഞവരിലേക്കുള്ള സൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: തുടരാതിരുന്നാൽ
  rationale: ἐάν സഹിതമുള്ള വർത്തമാനകാല subjunctive സൂചിപ്പിക്കുന്ന വ്യവസ്ഥയും ἐπιμένω എന്നതിന്റെ തുടർന്നുനിൽക്കുക എന്ന ദൈർഘ്യഭാവവും നിലനിർത്തുന്നു.
- source_word: τῇ ἀπιστίᾳ
  choice: അവിശ്വാസത്തിൽ
  rationale: റോമർ 11-ലെ വിശ്വാസം–അവിശ്വാസം എന്ന നേരിട്ടുള്ള വൈരുധ്യം കാത്തുസൂക്ഷിക്കുന്നു; ഇവിടെ ‘അവിശ്വസ്തത’യെക്കാൾ ‘അവിശ്വാസം’ പ്രസക്തമാണ്.
- source_word: ἐγκεντρισθήσονται
  choice: ഒട്ടിച്ചേർക്കപ്പെടും
  rationale: ഒലിവുമരത്തിന്റെ കൊമ്പ് ഒട്ടിക്കുന്ന രൂപകം നിലനിർത്തുന്ന വ്യക്തമായ ഭാവികാല കർമണിപ്രയോഗം; ഈ ആദ്യ ക്രിയയിൽ πάλιν ഇല്ലാത്തതിനാൽ ‘വീണ്ടും’ ഇവിടെ ചേർത്തിട്ടില്ല.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: കാരണം ... ദൈവത്തിനു കഴിയും
  rationale: γάρ നൽകുന്ന കാരണബന്ധവും δυνατός എന്നതിന്റെ ദൈവിക കഴിവിനുള്ള ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ പകരുന്നു.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: അവരെ വീണ്ടും ഒട്ടിച്ചേർക്കാൻ
  rationale: πάλιν എന്ന പുനഃസ്ഥാപനഭാവം രണ്ടാം ഉപവാക്യത്തിൽതന്നെ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ഒരേ രൂപകക്രിയ ആവർത്തിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ ἀπιστίαയുടെ അർഥം
  choice: അവിശ്വാസം
  alternative: അവിശ്വസ്തത
  rationale: റോമർ 11-ൽ ഉൾപ്പെടുത്തലുമായി ബന്ധപ്പെട്ട വിശ്വാസം–അവിശ്വാസം എന്ന വൈരുധ്യമാണ് ഉടനടി സന്ദർഭം. അതിനാൽ വിശാലമായ ഉടമ്പടിപരമായ ആശയം ഇറക്കുമതി ചെയ്യാതെ ‘അവിശ്വാസം’ ഉപയോഗിച്ചു.
- issue: ആദ്യത്തെ ഒട്ടിക്കൽക്രിയയിൽ പുനഃസ്ഥാപനം വ്യക്തമാക്കണമോ
  choice: ആദ്യ ഉപവാക്യത്തിൽ ‘ഒട്ടിച്ചേർക്കപ്പെടും’; രണ്ടാം ഉപവാക്യത്തിൽ ‘വീണ്ടും ഒട്ടിച്ചേർക്കാൻ’
  alternative: ആദ്യ ഉപവാക്യത്തിലും ‘വീണ്ടും ഒട്ടിച്ചേർക്കപ്പെടും’
  rationale: πάλιν ഗ്രീക്കിൽ രണ്ടാം ഉപവാക്യത്തിലാണ് വ്യക്തമായി വരുന്നത്. അതിന്റെ സ്ഥാനം മാനിച്ച് പുനഃസ്ഥാപനഭാവം അവിടെ പ്രകടിപ്പിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, മാന്യവും സ്വാഭാവികവുമായ ശൈലി. ഒലിവുമരത്തിലെ കൊമ്പൊട്ടിക്കൽ രൂപകം ‘ഒട്ടിച്ചേർക്കുക’ എന്ന പദത്തിലൂടെ നിലനിർത്തി. വിവർത്തനത്തിൽ യാതൊരു അടിക്കുറിപ്പും ആവശ്യമില്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ അടിക്കുറിപ്പുചിഹ്നങ്ങൾ ചേർത്തിട്ടില്ല.
