revisions:
- from: എന്തെന്നാൽ, സകലവും അവനിൽനിന്നും അവനിലൂടെയും അവനിലേക്കും ആകുന്നു.[a] മഹത്ത്വം എന്നേക്കും അവനുണ്ടാകട്ടെ.[b] ആമേൻ.
  to: എന്തെന്നാൽ, സകലവും അവനിൽനിന്നും അവനിലൂടെയും അവനിലേക്കും ആകുന്നു.[a] അവനു എന്നേക്കും മഹത്വം ഉണ്ടായിരിക്കട്ടെ.[b] ആമേൻ.
  rationale: 'രണ്ടാം വാക്യത്തിൽ മാത്രം ചെറിയ ശൈലീപരവും പദരൂപപരവുമായ തിരുത്തൽ വരുത്തിയിരിക്കുന്നു: ‘മഹത്വം’ നിലവാരരൂപമാണ്; ‘അവനു എന്നേക്കും മഹത്വം ഉണ്ടായിരിക്കട്ടെ’ ഗ്രീക്കിലെ ദോക്സോളജിക്കൽ അഭിസംബോധന, മഹത്വത്തിന്റെ ആഖ്യാനം, അനന്തകാലസൂചന എന്നിവ മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമായി ക്രമീകരിക്കുന്നു. അർഥമോ സർവനാമസൂചിതനോ മാറ്റിയിട്ടില്ല; അടിക്കുറിപ്പുകളുടെ ആങ്കറുകളും ഉള്ളടക്കവും നിലനിർത്തിയിരിക്കുന്നു.'
