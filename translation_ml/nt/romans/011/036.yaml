id: ROM.11.36
reference: Romans 11:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: ml
  text: എന്തെന്നാൽ, സകലവും അവനിൽനിന്നും അവനിലൂടെയും അവനിലേക്കും ആകുന്നു.[a] അവനു എന്നേക്കും മഹത്വം ഉണ്ടായിരിക്കട്ടെ.[b] ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “കാരണം, സകലവും അവനിൽനിന്നും അവനിലൂടെയും അവനിലേക്കും ആകുന്നു.”'
    reason: ὅτι എന്ന പദത്തിന്റെ കാരണസൂചകമായ മറ്റൊരു സ്വാഭാവിക പരിഭാഷ.
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: “യുഗങ്ങളിലേക്ക്.”'
    reason: εἰς τοὺς αἰῶνας എന്ന ഗ്രീക്ക് കാലപ്രയോഗത്തിന്റെ അക്ഷരരൂപം അറിയിക്കുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: എന്തെന്നാൽ
  rationale: മുൻപുള്ള സ്തുതിവചനത്തിന്റെ കാരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് സംയോജകത്തിന്റെ കാരണസൂചകബലം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτοῦ
  choice: അവനിൽനിന്നും
  rationale: ἐκ/ἐξ സൂചിപ്പിക്കുന്ന ഉറവിടം അഥവാ ഉത്ഭവം സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവനിലൂടെയും
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമമോ പ്രവർത്തനമാർഗമോ നിലനിർത്തുന്നു.
- source_word: εἰς αὐτὸν
  choice: അവനിലേക്കും
  rationale: ലക്ഷ്യം, ദിശ, അന്തിമോദ്ദേശ്യം എന്നിവ ഉൾക്കൊള്ളാവുന്ന εἰς എന്ന പദത്തിന്റെ മനപ്പൂർവം വിശാലമായ അർഥം ഒരു വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: സൃഷ്ടിസംബന്ധമായ സമഗ്രവ്യാപ്തി dignified ആയ, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: αὐτῷ ἡ δόξα
  choice: മഹത്ത്വം അവനുണ്ടാകട്ടെ
  rationale: ക്രിയയില്ലാത്ത ഗ്രീക്ക് സ്തുതിവാക്യത്തിന്റെ ആരാധനാപരമായ ആശംസാബലം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കാൻ ‘ഉണ്ടാകട്ടെ’ ചേർത്തിരിക്കുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘യുഗങ്ങളിലേക്ക്’ എന്ന ഗ്രീക്ക് പ്രയോഗം അനന്തകാലത്തെ സൂചിപ്പിക്കുന്നതിനാൽ ആ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: മലയാള ക്രൈസ്തവ ആരാധനാഭാഷയിൽ സ്ഥാപിതമായ ലിപ്യന്തരണം നിലനിർത്തുന്നു.
theological_decisions:
- issue: αὐτοῦ/αὐτόν/αὐτῷ എന്നീ സർവനാമങ്ങളുടെ സൂചിതൻ
  choice: സമീപസന്ദർഭപ്രകാരം ദൈവമാണ് സൂചിതൻ; എങ്കിലും പാഠത്തിൽ ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തുന്നു.
  alternative: സർവനാമങ്ങൾക്ക് പകരം ഓരോ തവണയും ‘ദൈവം’ എന്നു വ്യക്തമാക്കുക.
  rationale: റോമർ 11:33–35-ലെ സന്ദർഭം സൂചിതനെ വ്യക്തമാക്കുന്നു. എന്നാൽ ഗ്രീക്കിലെ ആവർത്തിത സർവനാമങ്ങളുടെ വാഗ്മിത്വം സംരക്ഷിക്കുകയും പാഠത്തേക്കാൾ അധികമായി വ്യക്തീകരിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: εἰς αὐτόν എന്നതിലെ ദിശയും ലക്ഷ്യവും
  choice: ‘അവനിലേക്ക്’ എന്നു പരിഭാഷപ്പെടുത്തി ദിശാത്മകവും അന്തിമലക്ഷ്യപരവുമായ അർഥസാധ്യതകൾ നിലനിർത്തുന്നു.
  alternative: ‘അവനുവേണ്ടി’ എന്നു പരിഭാഷപ്പെടുത്തി ഉദ്ദേശ്യത്തെ മുൻനിർത്തുക.
  rationale: εἰς ഇവിടെ ലക്ഷ്യം, ദിശ, ഉദ്ദേശ്യം എന്നിവ സൂചിപ്പിക്കാം. ‘അവനിലേക്ക്’ ഈ ദൈവകേന്ദ്രിതമായ അന്തിമദിശയെ സംരക്ഷിക്കുമ്പോൾ അർഥത്തെ ഒറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: αὐτῷ ἡ δόξα എന്ന ക്രിയാരഹിത സ്തുതിവാക്യം
  choice: ‘മഹത്ത്വം എന്നേക്കും അവനുണ്ടാകട്ടെ’ എന്ന ആശംസാത്മക സ്തുതിയായി നൽകുന്നു.
  alternative: ‘മഹത്ത്വം അവനുള്ളതാണ്’ എന്ന അവകാശപ്രസ്താവനയായി നൽകുക.
  rationale: ഗ്രീക്ക് രൂപം രണ്ടിനും ഇടം നൽകുന്നുവെങ്കിലും സന്ദർഭം സ്തുതിവചനമായതിനാൽ ആശംസാത്മക രൂപം ആരാധനാപരമായ ശക്തി നന്നായി പ്രകടിപ്പിക്കുന്നു; കുറിപ്പിലൂടെ അക്ഷരഘടന സംബന്ധിച്ച വിവരം നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും സ്തുതിവചനത്തിന് യോജിച്ച ഗൗരവമുള്ളതുമായ ശൈലി. ‘സകലവും’ എന്നത് വാക്യത്തിന്റെ സർവവ്യാപകതയും ഉയർന്ന ഭാവവും നിലനിർത്തുന്നു; അനാവശ്യമായ പുരാതനപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
