id: ROM.11.25
reference: Romans 11:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: ml
  text: 'സഹോദരന്മാരേ,[a] നിങ്ങൾ നിങ്ങളുടെ സ്വന്തം ദൃഷ്ടിയിൽ ജ്ഞാനികളാകാതിരിക്കേണ്ടതിന്, ഈ മർമ്മത്തെക്കുറിച്ച് നിങ്ങൾ അറിവില്ലാത്തവരായിരിക്കരുതെന്നാണ് എന്റെ ആഗ്രഹം: യഹൂദേതര ജനതകളുടെ പൂർണത പ്രവേശിക്കുന്നതുവരെ ഇസ്രായേലിന് ഭാഗികമായ ഒരു കാഠിന്യം സംഭവിച്ചിരിക്കുന്നു.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാരേ’ എന്നാണ്, എങ്കിലും ഇതു സ്ത്രീപുരുഷന്മാർ ഉൾപ്പെട്ട ഒരു കൂട്ടത്തെ അഭിസംബോധന ചെയ്യാനും ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘യഹൂദേതര ജനതകളുടെ പൂർണത’ എന്നതിന് ‘യഹൂദേതര ജനതകളുടെ പൂർണസംഖ്യ’ എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: അറിയാതിരിക്കുക
  rationale: പൗലോസിന്റെ പതിവുശൈലിയായ οὐ θέλω ὑμᾶς ἀγνοεῖν എന്നതിനെ സ്വാഭാവികമായ മലയാളത്തിൽ ‘നിങ്ങൾ അറിയാതിരിക്കരുതെന്ന് ഞാൻ ആഗ്രഹിക്കുന്നു’ എന്നു നൽകി; അവഹേളനസ്വരം ഒഴിവാക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; റോമിലെ സമ്മിശ്രസഭയെ അഭിസംബോധന ചെയ്യുന്നതിനാൽ സ്ത്രീകളും ഉൾപ്പെടാമെന്ന കാര്യം വ്യാഖ്യാനപരമായി തുറന്നുവെക്കുന്നു.
- source_word: μυστήριον
  choice: മർമ്മം
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെട്ടതുമായ ദൈവിക ഉദ്ദേശ്യം എന്ന പൗലോസീയ ആശയം വഹിക്കുന്ന, സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ പദം.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: നിങ്ങൾ സ്വന്തം കണ്ണിൽ ജ്ഞാനികളാകാതിരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യസൂചനയും സ്വയം ജ്ഞാനികളെന്ന ധാരണയ്‌ക്കെതിരായ മുന്നറിയിപ്പും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πώρωσις
  choice: കാഠിന്യം
  rationale: ആത്മികമായ കടുപ്പം അല്ലെങ്കിൽ പ്രതികരണശൂന്യത സൂചിപ്പിക്കുന്നു; വാചകത്തിലെ ദൈവശാസ്ത്രപരമായ ഭാരം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἀπὸ μέρους
  choice: ഭാഗികമായ
  rationale: കാഠിന്യത്തിന്റെ വ്യാപ്തി പരിമിതമാണെന്ന ആശയം നൽകുന്നു; അതിനെ കാലദൈർഘ്യമായി മാത്രം വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τῷ Ἰσραήλ ... γέγονεν
  choice: ഇസ്രായേലിന് ... ഉണ്ടായിരിക്കുന്നു
  rationale: ഗ്രീക്ക് ദത്തിവും perfect രൂപവും മലയാളത്തിൽ ഇപ്പോഴും നിലനിൽക്കുന്ന അവസ്ഥയായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: πλήρωμα τῶν ἐθνῶν
  choice: ജനതകളുടെ പൂർണത
  rationale: ഇവിടെ ἔθνη ഇസ്രായേലിനോടു വ്യത്യസ്തമായ യഹൂദേതര ജനതകളെ സൂചിപ്പിക്കുന്നു. πλήρωμα എന്നതിന്റെ ‘പൂർണത/പൂർണസംഖ്യ/പൂർണ ഉൾച്ചേരൽ’ എന്നീ സാധ്യതകളിൽ ഒന്ന് നിർബന്ധിച്ച് ഉറപ്പിക്കാതെ പദരൂപത്തിലെ തുറന്ന നില സംരക്ഷിക്കുന്നു.
- source_word: εἰσέλθῃ
  choice: അകത്തു പ്രവേശിക്കുന്നതുവരെ
  rationale: ἄχρι οὗ-യോടൊപ്പമുള്ള പരിധിബിന്ദു സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ആരിലേക്കോ എവിടേക്കോ പ്രവേശിക്കുന്നു എന്ന് മൂലവാക്യം വ്യക്തമാക്കാത്തതിനാൽ അത് ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ‘ജനതകളുടെ പൂർണത’ എന്നതിന്റെ അർഥം
  choice: ‘ജനതകളുടെ പൂർണത’ എന്ന് തുറന്ന നിലയിൽ വിവർത്തനം ചെയ്തു.
  alternative: ‘ജനതകളുടെ പൂർണസംഖ്യ’ അല്ലെങ്കിൽ ‘ജനതകളുടെ പൂർണ ഉൾച്ചേരൽ’.
  rationale: πλήρωμα എന്ന പദം സംഖ്യ, ഉൾച്ചേരൽ, അന്ത്യകാല പൂർണീകരണം എന്നിവയിൽ ഏതാണ് കൃത്യമായി ഉദ്ദേശിക്കുന്നതെന്നത് വിവാദവിഷയമാണ്; പ്രധാനപാഠം അത് തീർപ്പാക്കുന്നില്ല.
- issue: ഇസ്രായേലിന്റെ കാഠിന്യത്തിന്റെ വ്യാപ്തി
  choice: ‘ഭാഗികമായ ഒരു കാഠിന്യം’ എന്ന് നൽകി.
  alternative: ‘ഇസ്രായേലിൽ ഒരു ഭാഗത്തിന് കാഠിന്യം’ എന്ന് നൽകാം.
  rationale: ἀπὸ μέρους കാഠിന്യത്തിന്റെ ഭാഗിക സ്വഭാവം സൂചിപ്പിക്കുന്നു; ഇസ്രായേൽ മുഴുവനും ഒരേവിധം കഠിനപ്പെട്ടുവെന്ന വായന ഒഴിവാക്കുന്നു, എന്നാൽ ഏത് ‘ഭാഗം’ എന്ന് നിർവചിക്കുന്നില്ല.
- issue: ἀδελφοί എന്ന സംബോധനയുടെ പരിധി
  choice: ‘സഹോദരന്മാരേ’ എന്ന മൂലരൂപസന്നിഹിത സംബോധന നിലനിർത്തി.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’.
  rationale: ഗ്രീക്ക് രൂപം പുല്ലിംഗ ബഹുവചനമാണ്; അതേസമയം ഒരു സമ്മിശ്ര സമൂഹത്തെ അഭിസംബോധന ചെയ്യാൻ ഈ രൂപം ഉപയോഗിക്കാമെന്ന സാധ്യത നിലനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ താർക്കിക ഒഴുക്ക് നിലനിർത്തിയിട്ടുണ്ട്. ‘മർമ്മം’, ‘കാഠിന്യം’, ‘പൂർണത’ എന്നീ പദങ്ങൾ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിക്കുന്നു.
