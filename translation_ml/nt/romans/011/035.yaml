  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: ml
  text: അല്ലെങ്കിൽ, അവിടുത്തേക്കു ആദ്യം കൊടുത്ത് തിരിച്ചുകിട്ടേണ്ടവൻ ആർ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവിടുത്തേക്കു മുൻകൂട്ടി കൊടുത്ത്.”
    reason: lexical_alternative
  - marker: b
    text: അതായത്, ദൈവം തിരിച്ചുകൊടുക്കാൻ കടപ്പെട്ടവനാകുന്ന വിധത്തിൽ ആരും ദൈവത്തിന് ഒന്നും കൊടുത്തിട്ടില്ല.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: അല്ലെങ്കിൽ
  rationale: തുടർച്ചയായ ആലങ്കാരിക ചോദ്യങ്ങളിൽ അടുത്തത് അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ സംയോജകപദം.
- source_word: τίς
  choice: ആരാണ്
  rationale: ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ചോദനസർവനാമം; ആലങ്കാരിക ചോദ്യത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: προέδωκεν
  choice: ആദ്യം കൊടുത്തത്
  rationale: മുൻകൂട്ടിയോ മറ്റൊരാൾക്കു മുമ്പെയോ കൊടുക്കുക എന്ന ക്രിയയുടെ മുൻഗണനാഭാവം നിലനിർത്തുന്നു; ദൈവത്തെ കടക്കാരനാക്കുന്ന ഒരു മുൻദാനം ആരും നൽകിയിട്ടില്ല എന്ന ആശയവും പ്രകടമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവിടത്തേക്ക്
  rationale: സന്ദർഭത്തിൽ ദൈവത്തെയാണ് ആദ്യത്തെ ദത്തിവ് സർവനാമം സൂചിപ്പിക്കുന്നത്; ദൈവത്തെക്കുറിച്ചുള്ള മാന്യവും സ്വാഭാവികവുമായ മലയാളപ്രയോഗം.
- source_word: καὶ
  choice: —ാൻ
  rationale: ഗ്രീക്കിലെ ഏകോപനബന്ധം മലയാളത്തിൽ ഫലസൂചകമായ ആലങ്കാരിക ചോദ്യഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; അർഥബന്ധം മാറ്റുന്നില്ല.
- source_word: ἀνταποδοθήσεται
  choice: തിരികെ നൽകപ്പെടാൻ
  rationale: ഭാവികാല നിഷ്ക്രിയക്രിയയുടെ പ്രതിഫലമായി മടക്കിനൽകുക എന്ന അർഥം സൂക്ഷിക്കുന്നു; മലയാളത്തിലെ ആലങ്കാരിക ചോദ്യത്തിന് യോജിച്ച രൂപം.
- source_word: αὐτῷ
  choice: അയാൾക്ക്
  rationale: മടക്കിനൽകൽ ലഭിക്കുന്ന, ആദ്യം കൊടുത്തതായി സങ്കൽപ്പിക്കുന്ന വ്യക്തിയെയാണ് സന്ദർഭപരമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയക്കുഴപ്പമില്ലാതെ സ്വാഭാവികമായി പറയുന്നു.
theological_decisions:
- issue: ആദ്യത്തെ αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: സന്ദർഭമനുസരിച്ച് ദൈവത്തെ സൂചിപ്പിക്കുന്ന “അവിടത്തേക്ക്” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: “ദൈവത്തിന്” എന്ന് നാമം വ്യക്തമാക്കുക.
  rationale: മൂലപാഠത്തിൽ നാമമല്ല, സർവനാമമാണ്; സന്ദർഭത്തിൽ സൂചിതൻ വ്യക്തമായതിനാൽ സർവനാമരൂപവും മാന്യഭാവവും നിലനിർത്തി.
- issue: രണ്ടാമത്തെ αὐτῷ എന്ന സർവനാമത്തിന്റെ സൂചിതൻ
  choice: ആദ്യം കൊടുത്തതായി സങ്കൽപ്പിക്കുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന “അയാൾക്ക്” എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ആദ്യ സർവനാമത്തോടു രൂപപരമായ സാമ്യം സൂക്ഷിച്ച് “അവിടത്തേക്ക്” എന്നു നൽകുക.
  rationale: വാക്യത്തിന്റെ പ്രതിദാനതർക്കത്തിൽ തിരികെ ലഭിക്കേണ്ടത് ആദ്യം കൊടുത്ത വ്യക്തിക്കാണ്. മലയാളത്തിൽ ഒരേ മാന്യസർവനാമം ആവർത്തിച്ചാൽ പ്രതിഫലം ദൈവത്തിനാണെന്ന തെറ്റായ ധാരണ ഉണ്ടാകാം.
- issue: προέδωκεν എന്നതിലെ മുൻഗണനാഭാവവും ദൈവിക കടപ്പാടും
  choice: “ആദ്യം” ഉൾപ്പെടുത്തി.
  alternative: “കൊടുത്തത്” എന്നു മാത്രം നൽകുക.
  rationale: ദൈവത്തിന് മുമ്പായി കൊടുത്ത് ദൈവത്തെ പ്രതിദാനം ചെയ്യാൻ ബാധ്യസ്ഥനാക്കാൻ ആർക്കും കഴിയില്ലെന്ന ആലങ്കാരിക ചോദ്യത്തിന്റെ ശക്തി മൂലക്രിയയിലെ മുൻഗണനാഭാവത്തോടൊപ്പം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആലങ്കാരിക ചോദ്യത്തിന്റെ സ്വാഭാവികതയ്ക്കായി രണ്ടാം ഖണ്ഡം “—ാൻ?” എന്ന ഘടനയിൽ നൽകിയിരിക്കുന്നു; ദൈവത്തെ സൂചിപ്പിക്കാൻ “അവിടത്തേക്ക്” എന്ന ആദരസൂചക സർവനാമം ഉപയോഗിച്ചു.
