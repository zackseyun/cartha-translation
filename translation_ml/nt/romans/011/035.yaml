- from: അല്ലെങ്കിൽ, ആരാണ് അവിടത്തേക്ക് ആദ്യം കൊടുത്തത്[a], അയാൾക്ക് അതു തിരികെ നൽകപ്പെടാൻ?[b]
  to: അല്ലെങ്കിൽ, അവിടുത്തേക്കു ആദ്യം കൊടുത്ത് തിരിച്ചുകിട്ടേണ്ടവൻ ആർ?[a][b]
  rationale: The text is revised because the first dative pronoun must be corrected from the locative expression “അവിടത്തേക്ക്” to honorific “അവിടുത്തേക്കു,” and the final clause needs a complete, natural Malayalam rhetorical-question construction. “ആദ്യം” retains the priority expressed by προέδωκεν; “തിരിച്ചുകിട്ടേണ്ടവൻ” conveys the prospective reciprocal repayment of ἀνταποδοθήσεται. The verse remains a single rhetorical question and does not specify more than the Greek does.
