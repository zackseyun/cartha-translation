revisions:
- from: കാരണം, സ്വാഭാവിക ശാഖകളെ[a] ദൈവം ഒഴിവാക്കിയില്ലെങ്കിൽ, നിന്നെയും അവിടന്ന് ഒഴിവാക്കുകയില്ല.
  to: കാരണം, ദൈവം സ്വാഭാവികമായ ശാഖകളെ വെറുതെ വിട്ടില്ലെങ്കിൽ, നിന്നെയും അവിടന്ന് വെറുതെ വിടുകയില്ല.
  rationale: The revision corrects the reversed sense introduced by “ഒഴിവാക്കിയില്ലെങ്കിൽ” and uses the repeated expression “വെറുതെ വിടുക” to convey both occurrences of φείδομαι (“spare”). It preserves the explanatory conditional, the unexplicated branch metaphor, and the Greek singular “you.”
