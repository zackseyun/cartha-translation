id: ROM.11.21
reference: Romans 11:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: ml
  text: കാരണം, ദൈവം സ്വാഭാവികമായ ശാഖകളെ വെറുതെ വിട്ടില്ലെങ്കിൽ, നിന്നെയും അവിടന്ന് വെറുതെ വിടുകയില്ല.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: കാരണം, ... ഇല്ലെങ്കിൽ
  rationale: γάρ നൽകുന്ന മുൻവാക്യത്തോടുള്ള വിശദീകരണബന്ധവും εἰ നൽകുന്ന വ്യവസ്ഥയും സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ὁ θεὸς
  choice: ദൈവം
  rationale: θεός എന്നതിന് സാധാരണവും മാന്യവുമായ മലയാള പരിഭാഷ.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: സ്വാഭാവിക ശാഖകളെ
  rationale: κατὰ φύσιν എന്നതിന്റെ ‘പ്രകൃത്യാ/സ്വാഭാവികമായി ഉള്ള’ എന്ന അർഥം ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു; ഒലിവുമരത്തിന്റെ രൂപകം വ്യാഖ്യാനിച്ച് മാറ്റുന്നില്ല.
- source_word: οὐκ ἐφείσατο
  choice: ഒഴിവാക്കിയില്ല
  rationale: φείδομαι സൂചിപ്പിക്കുന്ന ദോഷത്തിൽനിന്നോ ശിക്ഷയിൽനിന്നോ ‘ഒഴിവാക്കുക, വെറുതെ വിടുക’ എന്ന ആശയം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; അടുത്ത ഉപവാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: οὐδὲ σοῦ φείσεται
  choice: നിന്നെയും അവിടന്ന് ഒഴിവാക്കുകയില്ല
  rationale: οὐδέയുടെ ‘...യും ഇല്ല’ എന്ന നിഷേധാത്മക തുടർച്ചയും σοῦ എന്ന ഏകവചന അഭിസംബോധനയും ഭാവികാല മുന്നറിയിപ്പും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘സ്വാഭാവിക ശാഖകൾ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: പ്രധാനപാഠത്തിൽ ശാഖകളുടെ രൂപകം അതേപടി നിലനിർത്തി.
  alternative: ‘ഇസ്രായേൽജനത്തെ’ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സന്ദർഭത്തിൽ സൂചന ഇസ്രായേലിലേക്കാണെങ്കിലും, ഗ്രീക്ക് പാഠം ഇവിടെ രൂപകമാണ് ഉപയോഗിക്കുന്നത്; അതിനാൽ വിവർത്തനം വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ‘നിന്നെ’ അഭിസംബോധന ചെയ്യുന്ന മുന്നറിയിപ്പിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി
  choice: ഏകവചനത്തിലുള്ള നേരിട്ടുള്ള മുന്നറിയിപ്പായി പരിഭാഷപ്പെടുത്തി; രക്ഷ, വിശ്വാസത്യാഗം, തിരഞ്ഞെടുപ്പ് എന്നിവയെക്കുറിച്ചുള്ള സിദ്ധാന്തപരമായ വിശദീകരണം ചേർത്തില്ല.
  alternative: ഒരു പ്രത്യേക രക്ഷാശാസ്ത്ര ചട്ടക്കൂടനുസരിച്ച് മുന്നറിയിപ്പ് വിശദീകരിക്കുക.
  rationale: വാക്യം യഥാർഥ മുന്നറിയിപ്പ് നൽകുന്നു; എന്നാൽ വ്യക്തിപരമോ സമൂഹപ്രതിനിധിയായോ ഉള്ള പ്രയോഗത്തെക്കുറിച്ചുള്ള വിശാലമായ തർക്കങ്ങൾ ഈ വാക്യം മാത്രം തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അവിടന്ന്’ ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചക ഏകവചന സർവനാമമായി ഉപയോഗിച്ചു. രൂപകവും നേരിട്ടുള്ള മുന്നറിയിപ്പും നിലനിർത്തി.
