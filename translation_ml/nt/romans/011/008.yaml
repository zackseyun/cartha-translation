id: ROM.11.8
reference: Romans 11:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “ദൈവം അവർക്കു മരവിപ്പിന്റെ ആത്മാവും[a] കാണാതിരിക്കാൻ കണ്ണുകളും കേൾക്കാതിരിക്കാൻ ചെവികളും ഇന്നേ ദിവസംവരെ കൊടുത്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഗാഢനിദ്രയുടെ ആത്മാവ്.” ഈ പ്രയോഗം യെശയ്യാവ് 29:10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു; എന്നാൽ ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദം മരവിപ്പ്, ബോധമന്ദത, സ്തബ്ധാവസ്ഥ എന്നിവയെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്തിൽനിന്നുള്ള ഉദ്ധരണി അവതരിപ്പിക്കുന്ന പതിവു പ്രയോഗം; καθώς എന്നതിന്റെ താരതമ്യഭാവവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: ദൈവം അവർക്കു ... കൊടുത്തു
  rationale: ദൈവത്തെ പ്രവർത്തനത്തിന്റെ നേരിട്ടുള്ള കർത്താവായി നിലനിർത്തുകയും aorist ക്രിയയെ ലളിതമായ ഭൂതകാലത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: πνεῦμα κατανύξεως
  choice: മരവിപ്പിന്റെ ആത്മാവ്
  rationale: κατάνυξις സൂചിപ്പിക്കുന്ന മാനസിക-ആത്മീയ മരവിപ്പ്, ബോധമന്ദത, പ്രതികരണശൂന്യത എന്നിവ മലയാളത്തിൽ സംക്ഷിപ്തമായി അറിയിക്കുന്നു; യെശയ്യാവിലെ ‘ഗാഢനിദ്ര’ എന്ന പ്രതിധ്വനി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: കാണാതിരിക്കാൻ കണ്ണുകൾ
  rationale: τοῦ μή + infinitive എന്ന ഘടനയിലെ ഉദ്ദേശ്യ/ഫലസാധ്യത തീർപ്പാക്കാതെ, ഉദ്ധരണിയുടെ സംക്ഷിപ്തമായ സമാന്തരരൂപം നിലനിർത്തുന്നു.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: കേൾക്കാതിരിക്കാൻ ചെവികൾ
  rationale: മുൻവാക്യഘടകത്തോടുള്ള സമാന്തരത നിലനിർത്തുകയും ἀκούω എന്നതിന്റെ അടിസ്ഥാനമായ ‘കേൾക്കുക’ എന്ന അർഥം നൽകുകയും ചെയ്യുന്നു.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: ഇന്നേദിവസംവരെ
  rationale: ‘ഇന്നുവരെ’ എന്ന ആശയത്തോടൊപ്പം ഗ്രീക്കിലെ ഊന്നലും ഗൗരവമുള്ള ഉദ്ധരണിശൈലിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കഠിനീകരണത്തിലോ ആത്മീയ പ്രതികരണശൂന്യതയിലോ ദൈവിക പ്രവർത്തനം
  choice: ‘ദൈവം ... കൊടുത്തു’ എന്ന നേരിട്ടുള്ള പ്രസ്താവന നിലനിർത്തി.
  alternative: ‘ദൈവം അനുവദിച്ചു’ അല്ലെങ്കിൽ ‘ദൈവം അവരെ ഏൽപ്പിച്ചു.’
  rationale: Ἔδωκεν എന്ന ക്രിയയുടെ വ്യക്തമായ കർത്താവ് ὁ θεός ആണ്. അതിനെ വെറും അനുവാദമായി മയപ്പെടുത്താതെ, അതേസമയം വാക്യം പറയുന്നതിലധികം ഒരു പ്രത്യേക സിദ്ധാന്തസംവിധാനം ചേർക്കാതെയും ദൈവിക ന്യായവിധിയും മനുഷ്യ ഉത്തരവാദിത്വവും തമ്മിലുള്ള പാഠത്തിലെ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘മരവിപ്പ്’ എന്നത് അസ്വാഭാവികമായ സാങ്കേതികപദം ഒഴിവാക്കി മൂലപദത്തിന്റെ ബോധമന്ദത/പ്രതികരണശൂന്യത നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
