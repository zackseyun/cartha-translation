id: ROM.11.3
reference: Romans 11:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: ml
  text: “കർത്താവേ, അവർ അങ്ങയുടെ പ്രവാചകന്മാരെ കൊന്നു; അങ്ങയുടെ യാഗപീഠങ്ങൾ ഇടിച്ചുകളഞ്ഞു; ഞാൻ മാത്രം ശേഷിച്ചു; അവർ എന്റെ ജീവനെ[a] തേടുന്നു.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: കൂടുതൽ അക്ഷരാർഥത്തിൽ, ‘അവർ എന്റെ പ്രാണനെ തേടുന്നു’; ഇവിടെ ഈ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം ‘അവർ എന്റെ ജീവനെടുക്കാൻ നോക്കുന്നു’ എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: കർത്താവേ
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള സംബോധനയായ κύριος-ന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: ἀπέκτειναν
  choice: കൊന്നു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘കൊലപ്പെടുത്തി’ എന്നത് മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധിക ധാർമിക ഊന്നൽ വരുത്താം.
- source_word: θυσιαστήριά
  choice: യാഗപീഠങ്ങൾ
  rationale: യാഗത്തിനുള്ള പീഠം എന്ന θυσιαστήριον-ന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായും സംക്ഷിപ്തമായും നൽകുന്നു.
- source_word: κατέσκαψαν
  choice: ഇടിച്ചുകളഞ്ഞു
  rationale: പീഠങ്ങളെ നിലംപരിശാക്കുകയോ പൊളിച്ചുകളയുകയോ ചെയ്ത പ്രവൃത്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κἀγὼ
  choice: ഞാൻ
  rationale: καὶ ἐγώ എന്ന സംയുക്തരൂപം വാക്യബന്ധത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു; ‘ഞാൻ പോലും’ എന്ന അധിക ഊന്നൽ ചേർക്കുന്നില്ല.
- source_word: ὑπελείφθην μόνος
  choice: ഞാൻ മാത്രം ശേഷിച്ചു
  rationale: μόνος നൽകുന്ന സംഖ്യാത്മക ഏകാന്തതയും ὑπελείφθην നൽകുന്ന ശേഷിച്ചിരിക്കലും സംരക്ഷിക്കുന്നു.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: അവർ എന്റെ ജീവനെ തേടുന്നു
  rationale: ഇവിടെ ψυχή എന്നത് അമൂർത്തമായ ‘ആത്മാവ്’ അല്ല, ഏലിയാവിന്റെ ജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; ‘തേടുന്നു’ എന്നത് ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും ഭീഷണിയുടെ അർഥവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭീഷണിസൂചകമായ ζητοῦσιν τὴν ψυχήν μου എന്ന പ്രയോഗത്തിൽ ψυχή പരിഭാഷപ്പെടുത്തൽ
  choice: എന്റെ ജീവനെ
  alternative: എന്റെ ആത്മാവിനെ
  rationale: സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത് ഏലിയാവിന്റെ ജീവനെടുക്കാനുള്ള ശ്രമമാണ്; ‘ആത്മാവ്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നത് മൂലവാക്യം ഉദ്ദേശിക്കാത്ത ദൈവശാസ്ത്രപരമായ മനുഷ്യഘടനാവ്യാഖ്യാനം വരുത്തും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. ദൈവത്തോടുള്ള സംബോധനയിൽ ‘അങ്ങയുടെ’ ഉപയോഗിച്ച് ആദരസൂചകഭാവം നിലനിർത്തി. സമാന്തര ഉപവാക്യങ്ങളുടെ താളം അർധവിരാമങ്ങളിലൂടെ സംരക്ഷിച്ചു.
