id: ROM.11.1
reference: Romans 11:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: ml
  text: 'അതുകൊണ്ട് ഞാൻ ചോദിക്കുന്നു: ദൈവം തന്റെ ജനത്തെ നിരസിച്ചുവോ?[a] ഒരിക്കലുമില്ല![b] കാരണം, ഞാനും ഒരു ഇസ്രായേല്യനാണ്—അബ്രാഹാമിന്റെ സന്തതിയിൽപ്പെട്ടവൻ[c], ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ടവൻ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘തന്റെ ജനത്തെ തള്ളിക്കളഞ്ഞുവോ?’'
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്കിൽ ശക്തമായ നിരാകരണം പ്രകടിപ്പിക്കുന്ന പ്രയോഗം; അക്ഷരാർഥത്തോട് അടുത്തതായി: ‘അങ്ങനെ സംഭവിക്കാതിരിക്കട്ടെ!’ എന്നും വിവർത്തനം ചെയ്യാം.'
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘അബ്രാഹാമിന്റെ വിത്തിൽനിന്നുള്ളവൻ.’ ഇവിടെ ‘വിത്ത്’ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: അതുകൊണ്ട് ഞാൻ ചോദിക്കുന്നു
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; λέγω ഇവിടെ ഒരു അലങ്കാരപ്രശ്നം അവതരിപ്പിക്കുന്നതിനാൽ, സ്വാഭാവിക മലയാളത്തിൽ ‘ഞാൻ ചോദിക്കുന്നു’ എന്നു നൽകി.
- source_word: μὴ ἀπώσατο
  choice: നിരസിച്ചുവോ?
  rationale: ἀπωθέομαι എന്നത് തള്ളിക്കളയുക അഥവാ നിരസിക്കുക എന്ന ആശയം വഹിക്കുന്നു. μή ചേർന്ന ചോദ്യം നിഷേധാത്മക ഉത്തരം പ്രതീക്ഷിക്കുന്നുവെങ്കിലും അത് വിവർത്തനത്തിൽ വിശദീകരിച്ച് ചേർക്കാതെ ചോദ്യരൂപം നിലനിർത്തി.
- source_word: τὸν λαὸν αὐτοῦ
  choice: തന്റെ ജനത്തെ
  rationale: λαός എന്നതിന്റെ സാധാരണ അർഥമായ ‘ജനം’ നിലനിർത്തുകയും αὐτοῦ സൂചിപ്പിക്കുന്ന ദൈവവുമായുള്ള ഉടമസ്ഥതാ/ഉടമ്പടിബന്ധം ‘തന്റെ’ എന്നതിലൂടെ വ്യക്തമാക്കുകയും ചെയ്തു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമില്ല!
  rationale: പൗലോസിന്റെ ശക്തമായ നിരാകരണം സ്വാഭാവികവും ഊന്നലുള്ളതുമായ ആധുനിക മലയാളത്തിൽ നൽകി; ഇത് വെറും ‘ഇല്ല’ എന്നതിനെക്കാൾ ശക്തമാണ്.
- source_word: καὶ γὰρ ἐγὼ
  choice: ഞാനും
  rationale: γάρ നൽകുന്ന തെളിവുബന്ധം വാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു; καίയും ഊന്നിയ ἐγώയും ചേർന്ന സ്വയംസാക്ഷ്യം ‘ഞാനും’ എന്നു സംക്ഷിപ്തമായി നൽകി.
- source_word: Ἰσραηλίτης
  choice: ഒരു ഇസ്രായേല്യൻ
  rationale: വംശീയവും ഉടമ്പടിസംബന്ധവുമായ തിരിച്ചറിയൽ സൂചിപ്പിക്കുന്ന നേരിട്ടുള്ള മലയാളസമാനം.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ സന്തതിയിൽപ്പെട്ടവൻ
  rationale: σπέρμα അക്ഷരാർഥത്തിൽ ‘വിത്ത്’ ആണെങ്കിലും ഇവിടെ വംശപരമ്പരയെ സൂചിപ്പിക്കുന്നു; ‘സന്തതി’ ആ രൂപകത്തിന്റെ ബൈബിൾപരമായ ഗൗരവവും കൂട്ടായ വംശാർഥവും നിലനിർത്തുന്നു.
- source_word: φυλῆς Βενιαμίν
  choice: ബെന്യാമീൻ ഗോത്രത്തിൽപ്പെട്ടവൻ
  rationale: φυλή എന്നതിന്റെ നേരിട്ടുള്ള സമാനം ‘ഗോത്രം’; ആവർത്തിച്ച ഗ്രീക്ക് വംശനിർദ്ദേശം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കാൻ ‘പ്പെട്ടവൻ’ ഉപയോഗിച്ചു.
theological_decisions:
- issue: ദൈവം ഇസ്രായേലിനെ നിരസിച്ചതിന്റെ വ്യാപ്തി
  choice: ‘നിരസിച്ചുവോ?’ എന്ന് മാത്രം നൽകി; ‘പൂർണമായി’, ‘എന്നേക്കുമായി’ തുടങ്ങിയ വിശേഷണങ്ങൾ ചേർത്തില്ല.
  alternative: ‘എന്നേക്കുമായി തള്ളിക്കളഞ്ഞുവോ?’ അല്ലെങ്കിൽ ‘പൂർണമായി നിരസിച്ചുവോ?’
  rationale: ഗ്രീക്കിൽ വ്യാപ്തിയോ കാലപരിധിയോ വ്യക്തമാക്കുന്ന ക്രിയാവിശേഷണം ഇല്ല. അതിനാൽ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തി, അതിന്റെ വ്യാപ്തി തുടർന്നുള്ള സന്ദർഭം വ്യക്തമാക്കാൻ വിട്ടു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഗൗരവമുള്ള മലയാളം. അലങ്കാരപ്രശ്നത്തിന്റെ ശക്തിയും പൗലോസിന്റെ ഊന്നിയ നിരാകരണവും നിലനിർത്തിയിട്ടുണ്ട്; അനാവശ്യമായ ദൈവശാസ്ത്ര വിശദീകരണം മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
