revisions:
- from: ആ കൊമ്പുകളെക്കാൾ മേന്മ നടിക്കരുത്.[a] ഇനി നീ മേന്മ നടിക്കുന്നെങ്കിൽ, നീയല്ല വേരിനെ താങ്ങുന്നത്; വേരാണ് നിന്നെ താങ്ങുന്നത്.[b]
  to: ആ കൊമ്പുകൾക്കെതിരെ അഹങ്കരിക്കരുത്.[a] എന്നാൽ നീ അങ്ങനെ അഹങ്കരിക്കുന്നുവെങ്കിൽ, വേരിനെ താങ്ങുന്നത് നീയല്ല; നിന്നെ താങ്ങുന്നതു വേരാണ്.[b]
  rationale: The revision directly expresses the κατά-relationship in κατακαυχάομαι as ‘against’ without forcing a doctrinal interpretation of the branches. It retains the conditional repetition, the olive-tree imagery, and the emphatic contrast between the addressee and the root. Footnote a preserves the equally viable ‘over’ nuance, and footnote b preserves the more literal ‘bear/carry’ rendering of βαστάζω.
