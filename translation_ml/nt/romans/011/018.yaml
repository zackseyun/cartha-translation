id: ROM.11.18
reference: Romans 11:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: ml
  text: ആ കൊമ്പുകൾക്കെതിരെ അഹങ്കരിക്കരുത്.[a] എന്നാൽ നീ അങ്ങനെ അഹങ്കരിക്കുന്നുവെങ്കിൽ, വേരിനെ താങ്ങുന്നത് നീയല്ല; നിന്നെ താങ്ങുന്നതു വേരാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ആ കൊമ്പുകളുടെമേൽ വീമ്പുപറയരുത്.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘നീ വേരിനെ വഹിക്കുന്നില്ല; വേര് നിന്നെ വഹിക്കുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: മേന്മ നടിക്കരുത് / മേന്മ നടിക്കുന്നെങ്കിൽ
  rationale: ക്രിയയ്ക്ക് മറ്റുള്ളവരെക്കാൾ താൻ ഉയർന്നവനാണെന്നു വീമ്പുപറയുക എന്ന ബന്ധപരമായ അർഥമുണ്ട്. ‘മേന്മ നടിക്കുക’ എന്നത് കൊമ്പുകൾക്കെതിരായ അഹങ്കാരഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; രണ്ട് പ്രയോഗങ്ങളിലും ഒരേ പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: τῶν κλάδων
  choice: ആ കൊമ്പുകളെക്കാൾ
  rationale: ലേഖനവും സന്ദർഭവും സൂചിപ്പിക്കുന്ന നിർദിഷ്ട കൊമ്പുകളെ ‘ആ കൊമ്പുകൾ’ എന്നു നൽകുന്നു. ജനിറ്റീവിനോടു ചേർന്ന κατα-ക്രിയയുടെ താരതമ്യപരവും പ്രതികൂലവുമായ ബന്ധം ‘കൊമ്പുകളെക്കാൾ’ എന്നതിലൂടെ മുഖ്യപാഠത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ῥίζαν / ῥίζα
  choice: വേര്
  rationale: ഒലിവുമരത്തിന്റെ രൂപകം കാത്തുസൂക്ഷിക്കാനും രണ്ടു പ്രയോഗങ്ങളിലെയും ഏകത നിലനിർത്താനും ‘വേര്’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: βαστάζεις
  choice: താങ്ങുന്നത്
  rationale: മരത്തിന്റെ രൂപകത്തിൽ വഹിക്കുകയും നിലനിർത്തുകയും ചെയ്യുന്ന ആശയം ‘താങ്ങുക’ സ്വാഭാവികമായി നൽകുന്നു; ഭൗതിക രൂപകവും ആശ്രയബന്ധവും ഒരുപോലെ നിലനിൽക്കുന്നു.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: നീയല്ല വേരിനെ താങ്ങുന്നത്; വേരാണ് നിന്നെ താങ്ങുന്നത്
  rationale: ‘നീ’യും ‘വേര്’യും തമ്മിലുള്ള ഗ്രീക്കിലെ ഊന്നിയ വൈരുധ്യവും ആശ്രയബന്ധത്തിന്റെ മറിച്ചിടലും ‘നീയല്ല ... വേരാണ്’ എന്ന ഘടനയിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: μὴ
  choice: നടിക്കരുത്
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപത്തോടുള്ള നേരിട്ടുള്ള നിരോധനം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പ്രവൃത്തി തുടരുന്നതാണോ തുടങ്ങാനിരിക്കുന്നതാണോ എന്ന് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ ഒലിവുമരരൂപകത്തിലെ വേരിന്റെയും കൊമ്പുകളുടെയും തിരിച്ചറിയൽ
  choice: വേരും കൊമ്പുകളും എന്ന രൂപകം വിശദീകരണമില്ലാതെ അതേപടി നിലനിർത്തുന്നു.
  alternative: വേരിനെ പിതാക്കന്മാർ, അബ്രാഹാം, അല്ലെങ്കിൽ ഉടമ്പടിവാഗ്ദാനങ്ങൾ എന്നും കൊമ്പുകളെ പ്രത്യേക ജനവിഭാഗങ്ങൾ എന്നും മുഖ്യപാഠത്തിൽ തുറന്നു തിരിച്ചറിയുക.
  rationale: ഗ്രീക്ക് വാക്യം ഇവയുടെ തിരിച്ചറിയൽ ഇവിടെ വിശദമാക്കുന്നില്ല. അത്തരം വിശദീകരണം പരിഭാഷയിൽ ചേർക്കുന്നത് വ്യാഖ്യാനത്തെ പാഠമാക്കുകയും സന്ദർഭത്തിൽ നിലനിൽക്കുന്ന ദൈവശാസ്ത്രപരമായ തുറന്ന നില ചുരുക്കുകയും ചെയ്യും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മേന്മ നടിക്കുക’ സാധാരണ വായനക്കാർക്ക് അഹങ്കാരപരമായ താരതമ്യം വ്യക്തമാക്കുന്നു; അടിക്കുറിപ്പ് ഗ്രീക്കിലെ പ്രതികൂലമായ ‘എതിരെ’ എന്ന സാധ്യത സംരക്ഷിക്കുന്നു. ‘താങ്ങുക’ ആശ്രയബന്ധം വ്യക്തമാക്കുമ്പോൾ ‘വഹിക്കുക’ എന്ന കൂടുതൽ പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
