id: ROM.11.33
reference: Romans 11:33
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: ml
  text: ഹാ, ദൈവത്തിന്റെ സമ്പത്തിന്റെയും ജ്ഞാനത്തിന്റെയും അറിവിന്റെയും ആഴം എത്ര അഗാധം![a] അവിടുത്തെ വിധികൾ എത്ര അന്വേഷിച്ചറിയാനാവാത്തവയും അവിടുത്തെ വഴികൾ എത്ര പിന്തുടർന്ന് കണ്ടെത്താനാവാത്തവയും ആകുന്നു![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ഹാ, ദൈവത്തിന്റെ ജ്ഞാനത്തിന്റെയും അറിവിന്റെയും സമ്പത്തിന്റെ ആഴം!” ഗ്രീക്ക് വാക്യഘടനയിൽ “സമ്പത്ത്” എന്നതിനെ തുടർന്നുള്ള “ജ്ഞാനം”, “അറിവ്” എന്നിവയോട് കൂടുതൽ അടുത്ത് ബന്ധിപ്പിക്കാം. മുഖ്യപാഠം സമ്പത്ത്, ജ്ഞാനം, അറിവ് എന്നീ മൂന്നും ദൈവത്തിന്റേതായ ഗുണങ്ങളായി വായിക്കുന്നു.'
    reason: alternative_reading
  - marker: b
    text: “പിന്തുടർന്ന് കണ്ടെത്താനാവാത്തവ” എന്നത് കാലടിപ്പാടുകൾ പിന്തുടരുന്നതുപോലെ അന്വേഷിച്ചിട്ടും കണ്ടെത്താനാവാത്തത് എന്ന ആശയം നൽകുന്നു; അങ്ങനെ ഇത് “അന്വേഷിച്ചറിയാനാവാത്തവ” എന്ന ആദ്യ പദത്തിൽനിന്നുള്ള സൂക്ഷ്മവ്യത്യാസം നിലനിർത്തുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: ഹാ
  rationale: സ്തുത്യാശ്ചര്യം പ്രകടിപ്പിക്കുന്ന ഉദ്ഗാരത്തിന്റെ ശക്തി ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: βάθος
  choice: ആഴം എത്ര അഗാധം
  rationale: രൂപകാത്മകമായ അളവറ്റ ആഴം സ്വാഭാവികമായ മലയാള ഉദ്ഗാരവാക്യമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: πλούτου
  choice: സമ്പത്ത്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലുള്ള സമൃദ്ധിയുടെയും വിലമതിക്കാനാവാത്ത ധനത്തിന്റെയും രൂപകം നിലനിർത്തുന്നു.
- source_word: σοφίας
  choice: ജ്ഞാനം
  rationale: ദൈവത്തിന്റെ വിവേകപൂർണമായ ആലോചനയെയും പ്രവർത്തനക്രമത്തെയും സൂചിപ്പിക്കുന്ന പതിവ് മലയാള പദം.
- source_word: γνώσεως
  choice: അറിവ്
  rationale: σοφίαയിൽനിന്നുള്ള പദാർഥവ്യത്യാസം നിലനിർത്താൻ വേറിട്ടും സുതാര്യമായും പരിഭാഷപ്പെടുത്തി.
- source_word: ἀνεξεραύνητα
  choice: അന്വേഷിച്ചറിയാനാവാത്തവ
  rationale: പൂർണമായി പരിശോധിച്ചോ അന്വേഷിച്ചോ ഗ്രഹിക്കാനാവാത്തത് എന്ന അർഥം വ്യക്തമാക്കുന്നു.
- source_word: κρίματα
  choice: വിധികൾ
  rationale: ദൈവത്തിന്റെ ന്യായവിധികളെയും തീരുമാനങ്ങളെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന വിശാലമായ പദം.
- source_word: ἀνεξιχνίαστοι
  choice: പിന്തുടർന്ന് കണ്ടെത്താനാവാത്തവ
  rationale: കാലടിപ്പാടുകൾ പിന്തുടരുന്നതുപോലെ അന്വേഷിച്ചിട്ടും കണ്ടെത്താനാവാത്തത് എന്ന പദത്തിന്റെ രൂപകം നിലനിർത്തുകയും മുൻ വിശേഷണത്തിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ὁδοὶ
  choice: വഴികൾ
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനരീതികളെയും നടപടിക്രമങ്ങളെയും സൂചിപ്പിക്കുന്ന ഉറവിടത്തിലെ രൂപകം നിലനിർത്തുന്നു.
- source_word: αὐτοῦ
  choice: അവിടുത്തെ
  rationale: ദൈവത്തെ സൂചിപ്പിക്കുന്ന ആദരസൂചകമായ സ്വാഭാവിക മലയാള സർവനാമരൂപം; ഗ്രീക്കിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: θεοῦ എന്ന ജനിറ്റീവിന് മുൻപുള്ള മൂന്നു നാമങ്ങളോടുമുള്ള ബന്ധം
  choice: സമ്പത്ത്, ജ്ഞാനം, അറിവ് എന്നീ മൂന്നും ദൈവത്തിന്റേതായി വായിച്ചു.
  alternative: “ദൈവത്തിന്റെ ജ്ഞാനത്തിന്റെയും അറിവിന്റെയും സമ്പത്തിന്റെ ആഴം” എന്ന കൂടുതൽ അടുത്ത ഘടന.
  rationale: ഗ്രീക്ക് വാക്യഘടന രണ്ടുവായനകൾക്കും ഇടനൽകുന്നു. മുഖ്യപാഠത്തിലെ മൂന്നംഗ സമുച്ചയം സന്ദർഭത്തിലെ സ്തുതിഭാവത്തിന് സ്വാഭാവികമാണ്; മറ്റുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ἀνεξεραύνητα, ἀνεξιχνίαστοι എന്നീ വിശേഷണങ്ങളുടെ വ്യത്യാസം
  choice: “അന്വേഷിച്ചറിയാനാവാത്തവ”, “പിന്തുടർന്ന് കണ്ടെത്താനാവാത്തവ” എന്നിങ്ങനെ വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടിനും “ഗ്രഹിക്കാനാവാത്തവ” പോലുള്ള അടുത്ത പര്യായങ്ങൾ ഉപയോഗിക്കുക.
  rationale: രണ്ടാമത്തെ ഗ്രീക്ക് പദത്തിലുള്ള പിന്തുടർന്ന് കണ്ടെത്തുക എന്ന രൂപകഭാവം നിലനിർത്തി; അതിനെ സാങ്കേതികമായ ദൈവശാസ്ത്രവ്യത്യാസമായി അതിരുകടന്ന് വ്യാഖ്യാനിച്ചില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ള സ്തുത്യുദ്ഗാരശൈലി. സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന പദങ്ങൾ ഉപയോഗിച്ചുകൊണ്ട് ഗ്രീക്കിലെ ആവർത്തനവും സമാന്തരഘടനയും രണ്ട് വിശേഷണങ്ങളിലെ സൂക്ഷ്മവ്യത്യാസവും സംരക്ഷിച്ചു.
