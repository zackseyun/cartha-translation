id: ROM.4.18
reference: Romans 4:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: ml
  text: 'പ്രതീക്ഷയ്ക്കു വിരുദ്ധമായിരുന്നിട്ടും[a], അനേകം ജനതകളുടെ[c] പിതാവായിത്തീരേണ്ടതിന് അവൻ പ്രതീക്ഷയോടെ വിശ്വസിച്ചു—അരുളിച്ചെയ്തിരുന്നതുപോലെ: “നിന്റെ സന്തതി ഇപ്രകാരമായിരിക്കും.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പ്രതീക്ഷയ്ക്ക് അതീതമായി” അല്ലെങ്കിൽ “പ്രതീക്ഷയ്ക്കെതിരായി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “നിന്റെ വിത്ത്”; ഗ്രീക്കിലെ ഏകവചന സമാഹാരബിംബം കൂടുതൽ അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്ന രൂപം.
    reason: lexical_alternative
  - marker: c
    text: ഉല്പത്തി 15:5-ൽനിന്നുള്ള ഉദ്ധരണി; ഉല്പത്തി 17:5-ഉം താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: പ്രതീക്ഷയ്ക്കു വിരുദ്ധമായിരുന്നിട്ടും
  rationale: παρά + accusative സാധാരണ പ്രതീക്ഷയ്ക്കു വിരുദ്ധമായ സാഹചര്യം സൂചിപ്പിക്കുന്നു. ‘ആയിരുന്നിട്ടും’ എന്ന പ്രയോഗം ഗ്രീക്കിലെ വിരോധാഭാസം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐπ’ ἐλπίδι
  choice: പ്രതീക്ഷയോടെ
  rationale: അബ്രാഹാമിന്റെ വിശ്വാസം പ്രതീക്ഷയുടെ അടിസ്ഥാനത്തിലോ ഭാവത്തിലോ ആയിരുന്നുവെന്ന ആശയം നൽകുകയും മുൻവാക്യഭാഗത്തോടുള്ള അലങ്കാരപരമായ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύω എന്ന ക്രിയയ്ക്ക് നേരിട്ടും പൗലോസിന്റെ പ്രയോഗവുമായി യോജിച്ചും നിൽക്കുന്ന സാധാരണ മലയാളരൂപം.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: ആയിത്തീരേണ്ടതിന്
  rationale: εἰς τό + infinitive-ൽ അടങ്ങിയിരിക്കുന്ന ഉദ്ദേശ്യത്തിന്റെയും പ്രതീക്ഷിത ഫലത്തിന്റെയും സാധ്യത സംക്ഷിപ്തമായി നിലനിർത്തുന്നു; ഒന്നിനെ മാത്രം നിർബന്ധിച്ച് തീരുമാനിക്കുന്നില്ല.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: അനേകം ജനതകളുടെ പിതാവ്
  rationale: ἔθνη ഇവിടെ ഉല്പത്തിയിലെ വാഗ്ദാനത്തിന്റെ പശ്ചാത്തലത്തിൽ പല ജനസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്നു; ‘വിജാതീയർ’ എന്നു പരിഭാഷപ്പെടുത്തി യഹൂദ-വിജാതീയ വൈരുധ്യം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: κατὰ τὸ εἰρημένον
  choice: അരുളിച്ചെയ്തിരുന്നതുപോലെ
  rationale: മുമ്പ് ഉച്ചരിക്കപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യമുള്ളതുമായ ദൈവിക വചനത്തിന്റെ ഭാവം സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുഭാഷയിൽ നൽകുന്നു.
- source_word: Οὕτως ἔσται
  choice: ഇപ്രകാരമായിരിക്കും
  rationale: ഉദ്ധരണിയുടെ പ്രവചനാത്മക സ്വരം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τὸ σπέρμα σου
  choice: നിന്റെ സന്തതി
  rationale: σπέρμα എന്ന ഏകവചന സമാഹാരപദത്തിന്റെ ആശയം ‘സന്തതി’ സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ‘വിത്ത്’ എന്ന കൂടുതൽ അക്ഷരാർഥപരമായ രൂപവും അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിക വാഗ്ദാനത്തിലെ πολλῶν ἐθνῶν എന്നതിന്റെ സൂചന
  choice: ‘അനേകം ജനതകൾ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അനേകം വിജാതീയർ’ അല്ലെങ്കിൽ ‘അനേകം ജനസമൂഹങ്ങൾ’
  rationale: പൗലോസ് ഇവിടെ ഉല്പത്തിയിലെ അബ്രാഹാമിക വാഗ്ദാനം അനുസ്മരിക്കുന്നതിനാൽ ‘ജനതകൾ’ അതിന്റെ വിശാലമായ ഉടമ്പടിപശ്ചാത്തലം നിലനിർത്തുന്നു; ‘വിജാതീയർ’ എന്നത് പിന്നീടുള്ള യഹൂദ-വിജാതീയ വ്യത്യാസം ഈ വാക്യത്തിൽ അതിരുകടന്ന് കൊണ്ടുവരാം.
- issue: εἰς τὸ γενέσθαι എന്നതിലെ ഉദ്ദേശ്യം–ഫലം ബന്ധം
  choice: ‘ആയിത്തീരേണ്ടതിന്’ എന്നു നൽകി, ലക്ഷ്യവും പ്രതീക്ഷിത ഫലവും തുറന്നുവെച്ചു.
  alternative: ‘അങ്ങനെ അവൻ ... ആയിത്തീർന്നു’
  rationale: ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. പൂർത്തിയായ ഫലം മാത്രം വ്യക്തമാക്കുന്ന പരിഭാഷയേക്കാൾ prospective force സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘പ്രതീക്ഷയ്ക്കു വിരുദ്ധമായിരുന്നിട്ടും ... പ്രതീക്ഷയോടെ’ എന്ന ഘടന മൂലത്തിലെ paradox നിലനിർത്തുന്നു. ഉദ്ധരണിയിൽ അതിപുരാതനമായ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
