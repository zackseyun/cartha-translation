id: ROM.4.12
reference: Romans 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: ml
  text: പരിച്ഛേദനയുള്ളവരുടെ പിതാവും[a]—പരിച്ഛേദനം ലഭിച്ചവർ മാത്രമായിരിക്കാതെ, നമ്മുടെ പിതാവായ അബ്രാഹാം പരിച്ഛേദനയേൽക്കാത്ത അവസ്ഥയിൽ പുലർത്തിയ വിശ്വാസത്തിന്റെ കാൽപ്പാടുകൾ പിന്തുടരുന്നവരുടെ പിതാവും—ആകേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘പരിച്ഛേദനയുടെ പിതാവ്.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: പരിച്ഛേദനയുള്ളവരുടെ പിതാവ്
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘പരിച്ഛേദനയുടെ പിതാവ്’ മലയാളത്തിൽ ആചാരത്തിന്റെ ഉത്ഭവകർത്താവ് എന്ന തെറ്റായ ധാരണ നൽകാം. സന്ദർഭത്തിൽ പരിച്ഛേദനയുള്ള ജനവിഭാഗത്തോടുള്ള അബ്രാഹാമിന്റെ പിതൃത്വമാണ് ഉദ്ദേശിക്കുന്നത്; അക്ഷരാർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: പരിച്ഛേദനം ലഭിച്ചവർ എന്നതിൽ മാത്രം ഒതുങ്ങാതെ
  rationale: ബാഹ്യപരിച്ഛേദനം മാത്രം ഉള്ളവരല്ല, അബ്രാഹാമിന്റെ വിശ്വാസമാതൃക പിന്തുടരുന്നവരാണ് ഇവിടെ നിർദേശിക്കപ്പെടുന്നത്. ഈ രൂപം ഗ്രീക്കിലെ ‘മാത്രമല്ല’ എന്ന നിയന്ത്രണം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: കാൽപ്പാടുകളിൽ നടക്കുന്നവർ
  rationale: στοιχεῖν എന്ന ക്രമമായി നടക്കുക/പിന്തുടരുക എന്ന ആശയവും ἴχνη എന്ന കാൽപ്പാട്-ദൃശ്യവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: റോമർ 4-ലെ വാദത്തിൽ അബ്രാഹാമിന്റെ വിശ്വസിക്കുന്ന പ്രതികരണമാണ് മുഖ്യം; ‘വിശ്വസ്തത’യേക്കാൾ ‘വിശ്വാസം’ സന്ദർഭോചിതമാണ്.
- source_word: ἐν ἀκροβυστίᾳ
  choice: പരിച്ഛേദനയേൽക്കാത്ത അവസ്ഥയിൽ
  rationale: അബ്രാഹാം പരിച്ഛേദനയ്ക്കുമുമ്പ് ഉണ്ടായിരുന്ന അവസ്ഥയെ വ്യക്തമാക്കുന്ന, അപമാനകരമല്ലാത്ത സ്വാഭാവിക മലയാളരൂപം.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: നമ്മുടെ പിതാവായ അബ്രാഹാം
  rationale: സമൂഹപരമായ ‘നമ്മുടെ പിതാവ്’ എന്ന വിശേഷണം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക പദക്രമം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനയുള്ള എല്ലാവർക്കും അബ്രാഹാം പിതാവാണോ, അതോ അവന്റെ വിശ്വാസത്തിന്റെ കാൽപ്പാടുകളിൽ നടക്കുന്ന പരിച്ഛേദിതർക്കു മാത്രമോ?
  choice: പരിച്ഛേദനം ലഭിച്ചതിൽ മാത്രം ഒതുങ്ങാതെ അബ്രാഹാമിന്റെ വിശ്വാസമാതൃക പിന്തുടരുന്ന പരിച്ഛേദിതരെയാണ് വാക്യം നിർദേശിക്കുന്നത്.
  alternative: യാതൊരു നിബന്ധനയുമില്ലാതെ പരിച്ഛേദനയുള്ള എല്ലാവരുടെയും പിതാവാണ് അബ്രാഹാം.
  rationale: οὐκ…μόνον ἀλλὰ καί എന്ന ഘടന പരിച്ഛേദിതരുടെ കൂട്ടത്തെ തുടർന്നുള്ള വിശ്വാസനടപ്പുകൊണ്ട് വിശേഷിപ്പിക്കുന്നു. വിവർത്തനം ഈ നിയന്ത്രണം നിലനിർത്തുന്നു; അതിന്റെ ദൈവശാസ്ത്രപരമായ ഫലങ്ങൾ അധികമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മുൻവാക്യത്തിൽ ആരംഭിക്കുന്ന ഉദ്ദേശ്യഘടനയുമായി ബന്ധം നിലനിർത്താൻ ‘ആകേണ്ടതിന്’ ഉപയോഗിച്ചു. ‘കാൽപ്പാടുകളിൽ നടക്കുന്നവർ’ എന്ന ബൈബിൾസഹജ രൂപകം സ്വാഭാവികമായതിനാൽ സംരക്ഷിച്ചു.
