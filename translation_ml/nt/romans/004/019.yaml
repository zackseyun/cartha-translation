id: ROM.4.19
reference: Romans 4:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: ml
  text: വിശ്വാസത്തിൽ ദുർബലനാകാതെ, ഏകദേശം നൂറു വയസ്സുള്ളവനായിരുന്നതിനാൽ മരിച്ചുപോയതുപോലെയായിരുന്ന തന്റെ ശരീരത്തെയും അവൻ പരിഗണിച്ചു[a]; സാറായുടെ ഗർഭപാത്രത്തിന്റെ നിർജ്ജീവതയും[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പാഠപരമ്പരയിൽ: “മരിച്ചുപോയതുപോലെയായിരുന്ന തന്റെ ശരീരത്തെ അവൻ പരിഗണിച്ചില്ല.”'
    reason: textual_variant
  - marker: b
    text: “സാറായുടെ ഗർഭപാത്രത്തിന്റെ വന്ധ്യത” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: ദുർബലനാകാതെ
  rationale: വിശ്വാസത്തിന്റെ ശക്തി ക്ഷയിക്കാതിരുന്നതിനെ സൂചിപ്പിക്കുന്ന വിധത്തിൽ നിഷേധത്തോടുകൂടിയ കൃതന്തത്തിന്റെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: ഇവിടെ അബ്രാഹാം ദൈവത്തിന്റെ വാഗ്ദാനത്തിൽ ആശ്രയിച്ചതാണ് സന്ദർഭാർഥം; സാധാരണവും ദൈവശാസ്ത്രപരമായി നിഷ്പക്ഷവുമായ പദം നിലനിർത്തുന്നു.
- source_word: κατενόησεν
  choice: പരിഗണിച്ചു
  rationale: യാഥാർഥ്യത്തെ ശ്രദ്ധാപൂർവം കണക്കിലെടുത്തു എന്ന ആശയം നൽകുന്നു; വെറും കണ്ടു എന്നതിലേക്കോ സൂക്ഷ്മമായി വിശകലനം ചെയ്തു എന്നതിലേക്കോ അർഥം ചുരുക്കുന്നില്ല.
- source_word: νενεκρωμένον
  choice: ജീവനറ്റതുപോലെയായിരുന്ന
  rationale: അക്ഷരാർഥത്തിലുള്ള ശാരീരികമരണമല്ല, സന്താനോത്പാദനശേഷിയുടെ കാര്യത്തിൽ മരിച്ചതിനു തുല്യമായ നിലയാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: ഏകദേശം നൂറു വയസ്സുള്ളതിനാൽ
  rationale: πού നൽകുന്ന ഏകദേശഭാവം ‘ഏകദേശം’ എന്നതിലൂടെ സൂക്ഷിക്കുകയും ശരീരം ജീവനറ്റതുപോലെ കണക്കാക്കാനുള്ള സാഹചര്യമായി പ്രായത്തെ ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: νέκρωσιν
  choice: നിർജീവാവസ്ഥ
  rationale: മൂലത്തിലെ മരണരൂപകം നിലനിർത്തുന്നതിനൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം നൽകുന്നു.
- source_word: μήτρας Σάρρας
  choice: സാറായുടെ ഗർഭപാത്രത്തിന്റെ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ശരീരരൂപകം സ്വാഭാവിക മലയാളത്തിലെ ഉടമസ്ഥപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ ശരീരത്തെയും സാറായുടെ ഗർഭപാത്രത്തെയും കുറിച്ചുള്ള മരണരൂപകം മൃദൂകരിക്കണമോ
  choice: ‘ജീവനറ്റതുപോലെ’, ‘നിർജീവാവസ്ഥ’ എന്നീ മരണബന്ധിത പ്രയോഗങ്ങൾ നിലനിർത്തി
  alternative: ‘സന്താനോത്പാദനശേഷിയില്ലാത്തത്’, ‘വന്ധ്യത’ എന്നിങ്ങനെ വ്യാഖ്യാനാത്മകമായി വിവർത്തനം ചെയ്യുക
  rationale: അസാധ്യമായ അവസ്ഥയ്ക്കുമേൽ ദൈവത്തിന്റെ വാഗ്ദാനം പ്രവർത്തിച്ചതിനെ ഊന്നുന്ന പൗലോസിന്റെ സമാന്തര മരണഭാഷ പരമാവധി നിലനിർത്തുന്നു.
- issue: κατενόησεν ഉൾപ്പെടുന്ന പാഠഭേദം
  choice: അവൻ തന്റെ ശരീരത്തെയും സാറായുടെ ഗർഭപാത്രത്തിന്റെ അവസ്ഥയെയും പരിഗണിച്ചു എന്ന പാഠം മുഖ്യവാചകത്തിൽ
  alternative: അവൻ തന്റെ ജീവനറ്റതുപോലെയായ ശരീരത്തെ പരിഗണിച്ചില്ല
  rationale: നൽകിയിരിക്കുന്ന SBLGNT മുഖ്യപാഠത്തെ പിന്തുടരുന്നു; മറ്റൊരു പുരാതന പാഠപരമ്പരയിലെ നിഷേധം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘവാക്യബന്ധവും മരണരൂപകവും സംരക്ഷിച്ചു; പാഠഭേദവും വ്യാഖ്യാനാത്മക പദവികല്പവും അടിക്കുറിപ്പുകളിലാക്കി.
