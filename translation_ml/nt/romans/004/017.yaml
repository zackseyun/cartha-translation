reference: Romans 4:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “ഞാൻ നിന്നെ അനേകം ജനതകളുടെ പിതാവാക്കിയിരിക്കുന്നു.”[b]—അവൻ വിശ്വസിച്ച, മരിച്ചവർക്കു ജീവൻ നൽകുകയും ഇല്ലാത്തവയെ ഉള്ളവയെപ്പോലെ വിളിക്കുകയും ചെയ്യുന്ന ദൈവത്തിന്റെ സന്നിധിയിൽ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ വ്യാഖ്യാനാത്മകമായി: “നിലവിലില്ലാത്തവയെ അസ്തിത്വത്തിലേക്കു വിളിക്കുന്ന ദൈവം.”'
    reason: alternative_reading
  - marker: b
    text: “ജനതകൾ” എന്നത് ചില സന്ദർഭങ്ങളിൽ “വിജാതീയർ” എന്നും അർഥമാക്കാം; എന്നാൽ ഇവിടെ ഉല്പത്തിയിൽനിന്നുള്ള ഉദ്ധരണിയായതിനാൽ വിശാലമായ അർഥമാണ് കൂടുതൽ സാധ്യതയുള്ളത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവുശൈലി സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; ഗ്രീക്കിലെ perfect passive സൂചിപ്പിക്കുന്ന, എഴുതപ്പെട്ടതും ഇപ്പോഴും പ്രാബല്യത്തിലുള്ളതുമായ ഭാവവും ഇതിൽ കേൾക്കുന്നു.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: അനേകം ജനതകളുടെ പിതാവ്
  rationale: ഉല്പത്തി ഉദ്ധരണിയിലെ വിശാലമായ ജനസമൂഹങ്ങളെയാണ് ἐθνῶν സൂചിപ്പിക്കുന്നത്; യഹൂദരല്ലാത്തവർ എന്ന പരിമിതമായ അർഥം പ്രധാനവാചകത്തിൽ അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: τέθεικά σε
  choice: ഞാൻ നിന്നെ ... പിതാവാക്കിയിരിക്കുന്നു
  rationale: perfect രൂപത്തിന്റെ പൂർത്തിയായതും നിലനിൽക്കുന്നതുമായ ഭാവം ‘ആക്കിയിരിക്കുന്നു’ സ്വാഭാവികമായി കൈമാറുന്നു.
- source_word: κατέναντι οὗ ἐπίστευσεν θεοῦ
  choice: താൻ വിശ്വസിച്ച ദൈവത്തിന്റെ സന്നിധിയിൽ
  rationale: κατέναντι എന്നതിന്റെ ദൈവസന്നിധിയിലുള്ള നില എന്ന ആശയം സംരക്ഷിക്കുകയും οὗ ἐπίστευσεν എന്നതിലെ വിശ്വാസത്തിന്റെ വ്യക്തിപരമായ ലക്ഷ്യം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: മരിച്ചവർക്കു ജീവൻ നൽകുന്ന
  rationale: ദൈവത്തെ ജീവൻ നൽകുന്നവനായി ചിത്രീകരിക്കുന്ന present participle-ന്റെ സ്വഭാവസൂചന ലളിതവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: ഇല്ലാത്തവയെ ഉള്ളവയെപ്പോലെ വിളിക്കുന്ന
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തവും വ്യാഖ്യാനസാധ്യതയുള്ളതുമായ പ്രയോഗത്തോട് അടുത്തുനിൽക്കുന്നു; സൃഷ്ടിച്ച് അസ്തിത്വത്തിലാക്കുന്നു എന്ന വ്യാഖ്യാനം പ്രധാനവാചകത്തിൽ നിർബന്ധിക്കുന്നില്ല.
theological_decisions:
- issue: അബ്രാഹാം ‘പിതാവായത്’ എന്ന ആശയം κατέναντι എന്ന പദബന്ധവുമായി എങ്ങനെ ബന്ധിപ്പിക്കണം
  choice: താൻ വിശ്വസിച്ച ദൈവത്തിന്റെ സന്നിധിയിലാണ് അവൻ പിതാവായത്
  alternative: താൻ വിശ്വസിച്ച ദൈവത്തിന്റെ മുമ്പാകെ
  rationale: ഗ്രീക്കിലെ ellipsis മലയാളത്തിൽ ഗ്രഹിക്കാവുന്നവിധം പൂർത്തിയാക്കുന്നു; ദൈവത്തിന്റെ കാഴ്ചപ്പാടിലോ സന്നിധിയിലോ വാഗ്ദാനം സാധുവാണെന്ന ബന്ധം സംരക്ഷിക്കുന്നു.
- issue: അവസാനവാക്യം സൃഷ്ടിയില്ലായ്മയിൽനിന്നുള്ള സൃഷ്ടിയെ നേരിട്ട് പ്രസ്താവിക്കുന്നതായി പരിഭാഷപ്പെടുത്തണോ
  choice: ഇല്ലാത്തവയെ ഉള്ളവയെപ്പോലെ വിളിക്കുന്നു
  alternative: നിലവിലില്ലാത്തവയെ അസ്തിത്വത്തിലേക്കു വിളിക്കുന്നു
  rationale: മൂലവാക്യം ദൈവത്തിന്റെ സൃഷ്ടിശക്തിയെ സൂചിപ്പിക്കാമെങ്കിലും അതിന്റെ രൂപം കൂടുതൽ സംക്ഷിപ്തവും തുറന്നതുമാണ്. പ്രധാനവാചകം ആ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനതുറവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ തിരുവെഴുത്തുശൈലി. ദീർഘമായ ഗ്രീക്ക് വാക്യബന്ധം വായനാസൗകര്യത്തിനായി ഉദ്ധരണിക്ക് ശേഷവും dash-നുശേഷവും വ്യക്തമായി ക്രമപ്പെടുത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനവാചകത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
