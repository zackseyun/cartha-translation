id: ROM.4.10
reference: Romans 4:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: ml
  text: അപ്പോൾ, അത് എങ്ങനെയാണ് കണക്കാക്കപ്പെട്ടത്[a]? അദ്ദേഹം പരിച്ഛേദിതനായിരിക്കുമ്പോഴോ, അപരിച്ഛേദിതനായിരിക്കുമ്പോഴോ? പരിച്ഛേദിതനായിരിക്കുമ്പോഴല്ല, അപരിച്ഛേദിതനായിരിക്കുമ്പോഴാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “കണക്കാക്കപ്പെട്ടു” എന്നതിന് “എണ്ണപ്പെട്ടു” എന്നും “വരവായി കണക്കാക്കപ്പെട്ടു” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: അപ്പോൾ ... എപ്പോഴാണ്?
  rationale: πῶς എന്നത് അക്ഷരാർഥത്തിൽ ‘എങ്ങനെ’ എന്നാണെങ്കിലും, തുടർന്നുള്ള ἐν περιτομῇ ... ἢ ἐν ἀκροβυστίᾳ എന്ന സാഹചര്യവൈരുധ്യം കണക്കാക്കൽ നടന്നത് ഏത് അവസ്ഥയിലായിരുന്നുവെന്ന് ചോദിക്കുന്നു. സ്വാഭാവിക മലയാളത്തിൽ ‘എപ്പോഴാണ്?’ ഈ സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു; οὖν-ന്റെ വാദതുടർച്ച ‘അപ്പോൾ’ കൊണ്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐλογίσθη
  choice: അത് കണക്കാക്കപ്പെട്ടു
  rationale: λογίζομαι എന്ന ക്രിയയുടെ നിഷ്ക്രിയരൂപം നിലനിർത്തുന്നു. ‘അത്’ മുൻവാക്യത്തിലെ വിശ്വാസം നീതിയായി കണക്കാക്കപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നു. ‘കണക്കാക്കുക’ എന്നത് സാമ്പത്തിക അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുക്കാതെ പൗലോസിന്റെ ആവർത്തിത പദപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἐν περιτομῇ ὄντι
  choice: അദ്ദേഹം പരിച്ഛേദനയേറ്റ നിലയിലായിരുന്നപ്പോൾ
  rationale: ‘പരിച്ഛേദനയിൽ ആയിരിക്കുമ്പോൾ’ എന്ന വാക്കൊപ്പമുള്ള അസ്വാഭാവികത ഒഴിവാക്കി, περιτομή എന്ന നാമവും ὄντι എന്ന അവസ്ഥാസൂചനയും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐν ἀκροβυστίᾳ
  choice: പരിച്ഛേദനയേൽക്കാത്ത നിലയിലായിരുന്നപ്പോൾ
  rationale: ἀκροβυστία ഇവിടെ പരിച്ഛേദനയില്ലാത്ത അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. വിരുദ്ധജോടിയുടെ സമാന്തരത നിലനിർത്താൻ ‘പരിച്ഛേദനയേൽക്കാത്ത നില’ എന്നു നൽകി.
- source_word: οὐκ ... ἀλλ’
  choice: '... അല്ല, ... ആണ്'
  rationale: ഗ്രീക്കിലെ ശക്തമായ നിഷേധ-വൈരുധ്യം മലയാളത്തിലെ സ്വാഭാവിക ‘അല്ല ... ആണ്’ ഘടനയിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: കണക്കാക്കപ്പെട്ടതിന്റെ പരാമർശവിഷയം
  choice: ‘അത്’ എന്ന സർവനാമം ഉപയോഗിച്ച് മുൻസന്ദർഭത്തിലേക്കുള്ള ബന്ധം നിലനിർത്തി
  alternative: ‘വിശ്വാസം നീതിയായി’ എന്ന് ഈ വാക്യത്തിൽ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യത്തിൽ കർത്തൃപദം തുറന്നുപറയാതെ മുൻസന്ദർഭത്തിൽനിന്ന് ഗ്രഹിക്കേണ്ടതാണ്. വിശദീകരണം മുഖ്യപാഠത്തിലേക്ക് ചേർക്കാതെ അതേ ആശ്രിതത്വം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും പൊതുവായ വായനയ്ക്ക് വ്യക്തവുമായ ശൈലി. ‘പരിച്ഛേദനം’ എന്ന സ്ഥാപിത ബൈബിൾ-മതപര പദം നിലനിർത്തി; ഗ്രീക്കിലെ നാമപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ അവസ്ഥാവാക്യമായി നൽകി. അടിക്കുറിപ്പ് ചിഹ്നം ബന്ധപ്പെട്ട ആദ്യത്തെ ‘പരിച്ഛേദനയേറ്റ’ പദത്തിനു പിന്നാലെ നൽകിയെങ്കിലും, അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ἐλογίσθη എന്ന പദത്തിന്റെ പരിഭാഷാവികല്പങ്ങളെയാണ് വിശദീകരിക്കുന്നത്.
