id: ROM.4.1
reference: Romans 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: ml
  text: അപ്പോൾ, ജഡപ്രകാരം നമ്മുടെ പൂർവപിതാവായ അബ്രാഹാം എന്തു കണ്ടെത്തിയെന്നു നാം പറയണം?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജഡപ്രകാരം നമ്മുടെ പൂർവപിതാവ്’ എന്നതിന് കൂടുതൽ സ്വാഭാവികമായി ‘നമ്മുടെ ശാരീരിക പൂർവികൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘ജഡപ്രകാരം’ എന്നത് ‘കണ്ടെത്തി’ എന്നതിനോടു ബന്ധപ്പെടുത്തി, ‘അബ്രാഹാം മാനുഷിക മാർഗത്തിൽ എന്തു കണ്ടെത്തി?’ അല്ലെങ്കിൽ ‘കേവലം മാനുഷിക നിലയിൽ അബ്രാഹാം എന്തു കണ്ടെത്തി?’ എന്നും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: അപ്പോൾ നാം എന്തു പറയും?
  rationale: പൗലോസിന്റെ വാദത്തിലെ തുടർച്ചയും ആലോചനാപരമായ വാചാടോപചോദ്യത്തിന്റെ സ്വഭാവവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὑρηκέναι
  choice: കണ്ടെത്തിയെന്നാണ് പറയേണ്ടത്
  rationale: പൂർണകാല അനന്തക്രിയയുടെ ഫലപ്രാധാന്യം ‘കണ്ടെത്തി’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു; മലയാള വാക്യഘടനയിൽ ഉദ്ധൃതചോദ്യത്തിന്റെ ആശയം വ്യക്തമായി നൽകാൻ ‘എന്നാണ് പറയേണ്ടത്’ ചേർത്തിരിക്കുന്നു.
- source_word: Ἀβραὰμ
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പ്രയോഗത്തിൽ സുപരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: προπάτορα ἡμῶν
  choice: നമ്മുടെ പൂർവപിതാവായ
  rationale: പുരുഷ ഏകവചനത്തിലുള്ള പൂർവികബന്ധവും പൗലോസ് പ്രകടിപ്പിക്കുന്ന പങ്കിട്ട തിരിച്ചറിയലും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലോസിന്റെ σάρξ പദപ്രയോഗത്തിന്റെ രൂപപരവും ആശയപരവുമായ ബന്ധം സൂക്ഷിക്കുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് ശാരീരിക വംശബന്ധമാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κατὰ σάρκα എന്നതിന്റെ ബന്ധവ്യാപ്തി
  choice: ‘ജഡപ്രകാരം നമ്മുടെ പൂർവപിതാവായ’ എന്ന് അബ്രാഹാമുമായുള്ള ശാരീരിക വംശബന്ധത്തെ വിശേഷിപ്പിക്കുന്നതായി പ്രധാന പാഠത്തിൽ നൽകിയിരിക്കുന്നു.
  alternative: ഈ പദസമുച്ചയം ‘കണ്ടെത്തി’ എന്നതിനോടു ബന്ധപ്പെടുത്തി, അബ്രാഹാം മാനുഷിക മാർഗത്തിലോ കേവലം മാനുഷിക നിലയിലോ എന്തു കണ്ടെത്തി എന്നു മനസ്സിലാക്കാം.
  rationale: ‘അബ്രാഹാം, നമ്മുടെ പൂർവപിതാവ്’ എന്ന സമാനാധികരണ ഘടനയും റോമരിലെ വംശപരമായ തിരിച്ചറിയലിനെക്കുറിച്ചുള്ള വാദസന്ദർഭവും പ്രധാന വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ഗ്രീക്ക് പദക്രമം മറ്റൊരു ബന്ധസാധ്യത അനുവദിക്കുന്നതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജഡപ്രകാരം’ എന്ന പൗലോസീയ പ്രയോഗം പ്രധാന പാഠത്തിൽ സൂക്ഷിച്ച് അതിന്റെ സന്ദർഭാർഥവും യഥാർത്ഥ വ്യാകരണസന്ദിഗ്ധതയും അടിക്കുറിപ്പുകളിൽ വ്യക്തമാക്കിയിരിക്കുന്നു.
