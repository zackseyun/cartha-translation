revisions:
- from: അവൻ പരിച്ഛേദനത്തിന്റെ അടയാളം സ്വീകരിച്ചു—പരിച്ഛേദനമില്ലാതിരുന്നപ്പോൾ അവനുണ്ടായിരുന്ന വിശ്വാസത്താലുള്ള നീതിയുടെ മുദ്രയായി. അങ്ങനെ, പരിച്ഛേദനമില്ലാതിരിക്കെ വിശ്വസിക്കുന്ന എല്ലാവരുടെയും പിതാവായിത്തീരാനും അവർക്കും നീതി കണക്കിടപ്പെടാനും ഇടയായി.[a][b]
  to: അവൻ പരിച്ഛേദനത്തിന്റെ അടയാളം സ്വീകരിച്ചു—പരിച്ഛേദനമില്ലാതിരുന്നപ്പോൾ അവനുണ്ടായിരുന്ന വിശ്വാസത്താലുള്ള നീതിയുടെ മുദ്രയായി.[b] പരിച്ഛേദനമില്ലാത്തവരായിരിക്കെ വിശ്വസിക്കുന്ന എല്ലാവരുടെയും പിതാവായിരിക്കേണ്ടതിനും, അവർക്കും നീതി കണക്കാക്കപ്പെടേണ്ടതിനുമായി.[a][b]
  rationale: The revision retains the draft’s sound lexical choices but restores the two parallel Greek purpose clauses with “ആയിരിക്കേണ്ടതിനും … വേണ്ടതിനുമായി.” It also places the uncircumcision note at both relevant expressions and refines the accounting footnote to match the revised infinitival construction.
