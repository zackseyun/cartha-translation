id: ROM.4.11
reference: Romans 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: ml
  text: അവൻ പരിച്ഛേദനത്തിന്റെ അടയാളം സ്വീകരിച്ചു—പരിച്ഛേദനമില്ലാതിരുന്നപ്പോൾ അവനുണ്ടായിരുന്ന വിശ്വാസത്താലുള്ള നീതിയുടെ മുദ്രയായി.[b] പരിച്ഛേദനമില്ലാത്തവരായിരിക്കെ വിശ്വസിക്കുന്ന എല്ലാവരുടെയും പിതാവായിരിക്കേണ്ടതിനും, അവർക്കും നീതി കണക്കാക്കപ്പെടേണ്ടതിനുമായി.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവർക്കും നീതി വരവുവെക്കപ്പെടേണ്ടതിനായി” അല്ലെങ്കിൽ “കണക്കിൽ ചേർക്കപ്പെടേണ്ടതിനായി.”
    reason: λογίζομαι എന്ന കണക്കെടുപ്പ് രൂപകത്തിനുള്ള സ്വാഭാവിക മലയാളപര്യായങ്ങൾ.
  - marker: b
    text: അക്ഷരാർഥത്തിൽ “പരിച്ഛേദനമില്ലായ്മയിൽ/വഴി”; അതായത്, പരിച്ഛേദനം ചെയ്യപ്പെട്ടിട്ടില്ലാത്ത അവസ്ഥയിൽ.
    reason: ἐν τῇ ἀκροβυστίᾳ, δι’ ἀκροβυστίας എന്നീ പ്രയോഗങ്ങളുടെ അവസ്ഥാസൂചകമായ അർഥം വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: σημεῖον
  choice: അടയാളം
  rationale: ഉടമ്പടിയുടെ പശ്ചാത്തലത്തിൽ പരിച്ഛേദനം ബാഹ്യമായി സൂചിപ്പിക്കുന്ന ഒന്നാണെന്ന ആശയം സ്വാഭാവികവും വ്യക്തവുമായി നിലനിർത്തുന്നു.
- source_word: περιτομή
  choice: പരിച്ഛേദനം
  rationale: പൗലോസിന്റെ വാദത്തിലെ ആചാരത്തെ കൃത്യമായി സൂചിപ്പിക്കുന്ന സ്ഥിരപ്രയോഗം.
- source_word: σφραγίς
  choice: മുദ്ര
  rationale: സ്ഥിരീകരണത്തിന്റെയും ആധികാരിക സാക്ഷ്യത്തിന്റെയും രൂപകം ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: ദൈവസന്നിധിയിലെ ശരിയായ നിലയും നീതിസംബന്ധമായ അർഥവ്യാപ്തിയും മലയാളത്തിൽ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: ഇവിടെ മുൻനിൽക്കുന്നത് വിശ്വാസത്തോട് ബന്ധപ്പെട്ട നീതിയാണ്; ‘വിശ്വസ്തത’ എന്ന അർഥം അനാവശ്യമായി മുൻനിർത്തുന്നില്ല.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: പരിച്ഛേദനമില്ലാതിരുന്നപ്പോൾ
  rationale: അബ്രാഹാമിന്റെ അന്നത്തെ അവസ്ഥയും കാലബന്ധവും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: വിശ്വസിക്കുന്ന എല്ലാവരുടെയും പിതാവ്
  rationale: പ്രതിനിധിത്വപരമായ പിതൃത്വഭാഷയെ വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: δι’ ἀκροβυστίας
  choice: പരിച്ഛേദനമില്ലാതിരിക്കെ
  rationale: ഇവിടെ διά ഉപാധിയെയല്ല, അവർ വിശ്വസിക്കുന്ന അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: λογισθῆναι
  choice: കണക്കിടപ്പെടുക
  rationale: പൗലോസിന്റെ കണക്കുവയ്ക്കൽ രൂപകം സംരക്ഷിക്കുകയും സാങ്കേതിക മതഭാഷയുടെ ഭാരം കുറയ്ക്കുകയും ചെയ്യുന്നു.
- source_word: καί
  choice: അവർക്കും
  rationale: പരിച്ഛേദനമില്ലാത്ത വിശ്വാസികൾക്കും നീതി കണക്കിടപ്പെടുന്നു എന്ന ഉൾപ്പെടുത്തൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പരിച്ഛേദനവും നീതിയും തമ്മിലുള്ള ബന്ധം
  choice: പരിച്ഛേദനം, അബ്രാഹാമിന് പരിച്ഛേദനത്തിനു മുമ്പേ വിശ്വാസത്താൽ ഉണ്ടായിരുന്ന നീതിയുടെ അടയാളവും മുദ്രയുമാണ്.
  alternative: പരിച്ഛേദനം തന്നെയാണ് നീതി ലഭ്യമാക്കുന്ന മാർഗമെന്ന് തോന്നിക്കുന്നവിധം വാക്യം രൂപപ്പെടുത്താം.
  rationale: ഗ്രീക്ക് വാക്യം പരിച്ഛേദനത്തെ മുമ്പേ ഉണ്ടായിരുന്ന വിശ്വാസത്താലുള്ള നീതിയുടെ തുടർന്നുള്ള സാക്ഷ്യമായി അവതരിപ്പിക്കുന്നു; പിന്നീടുണ്ടായ മതശാസ്ത്ര വ്യവസ്ഥകൾ ഇതിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- issue: τῆς δικαιοσύνης τῆς πίστεως എന്ന ബന്ധം
  choice: ‘വിശ്വാസത്താലുള്ള നീതി’ എന്ന് പരിഭാഷപ്പെടുത്തി, നീതി വിശ്വാസത്തോട് ബന്ധപ്പെട്ടതാണെന്ന ആശയം നൽകി.
  alternative: ‘വിശ്വാസത്തിന്റെ നീതി’ എന്ന് കൂടുതൽ പദാനുപദമായി നൽകാം.
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ബന്ധത്തിന്റെ അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; അതേസമയം നീതി വിശ്വാസത്തിന്റെ നൈതിക ഗുണമാണെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘അടയാളം’, ‘മുദ്ര’, ‘കണക്കിടപ്പെടുക’ എന്നീ പ്രധാന പൗലോസീയ രൂപകങ്ങൾ നിലനിർത്തി; ദീർഘമായ ഗ്രീക്ക് വാക്യഘടന വായനാസൗകര്യത്തിനായി ഡാഷും പൂർണ്ണവിരാമവും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി.
