  rationale: The revision removes the unnatural interrogative-shaped relative clause, preserves the emphatic οὐ μή with “ഒരിക്കലും,” and uses the idiomatic accounting expression “കണക്കിൽ കൂട്ടുക.” “ധന്യൻ” supplies an established biblical-register rendering of μακάριος while retaining the concise proverbial form of the Greek citation.
