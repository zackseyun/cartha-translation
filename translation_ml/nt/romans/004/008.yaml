  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: ml
  text: കർത്താവ് പാപം ഒരിക്കലും കണക്കിൽ കൂട്ടാത്ത മനുഷ്യൻ[a] ധന്യൻ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ആ വ്യക്തി”; ഇവിടെ “മനുഷ്യൻ” എന്നത് പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, പ്രതിനിധാനപരമായ പൊതുവായ അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: “കർത്താവ് പാപം തീർച്ചയായും കണക്കിൽ കൂട്ടുകയില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: ദൈവാനുഗ്രഹത്താൽ ലഭിക്കുന്ന നിലയെ സൂചിപ്പിക്കുന്നതും തിരുവെഴുത്തിലെ അനുഗ്രഹഭാഷയുടെ ഗൗരവം നിലനിർത്തുന്നതുമായ സ്വാഭാവിക പ്രയോഗം; കേവലം മാനസിക സന്തോഷമോ ലൗകിക ഭാഗ്യമോ എന്ന ധ്വനി ഒഴിവാക്കുന്നു.
- source_word: ἀνήρ
  choice: മനുഷ്യൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധാനസ്വഭാവം നിലനിർത്തുന്നു; ഇവിടെ അർഥം പുരുഷന്മാർക്കു മാത്രമായി പരിമിതമല്ല.
- source_word: οὗ
  choice: ആരുടെ ... ആ
  rationale: ബന്ധസർവനാമത്തിന്റെ ഷഷ്ഠിവിഭക്തിബന്ധം സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐ μὴ
  choice: ഒരിക്കലും ... ഇല്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തിന്റെ ശക്തി സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: λογίσηται
  choice: കണക്കിൽപ്പെടുത്തുക
  rationale: റോമർ 4-ലെ കണക്കെടുപ്പ് രൂപകം നിലനിർത്തുന്നു; സാങ്കേതിക ദൈവശാസ്ത്രപദം അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്നതിന് മലയാള തിരുവെഴുത്തുഭാഷയിൽ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ പരിഭാഷ.
- source_word: ἁμαρτίαν
  choice: പാപം
  rationale: ഗ്രീക്കിലെ ഏകവചനത്തെ ഒരു വിഭാഗസങ്കൽപ്പമായി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രതിനിധാനപരമായ പുല്ലിംഗപ്രയോഗം
  choice: മുഖ്യവാചകത്തിൽ ‘മനുഷ്യൻ’ എന്ന് നിലനിർത്തി, അതിന്റെ പൊതുവായ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: ‘വ്യക്തി’ അല്ലെങ്കിൽ ‘ആൾ’
  rationale: ἀνήρ വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമാണെങ്കിലും ഈ ഉദ്ധരണിയിൽ പുരുഷന്മാരെ മാത്രം സൂചിപ്പിക്കുന്നില്ല. ഉറവിടരൂപവും ഉൾക്കൊള്ളുന്ന അർഥവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
- issue: οὐ μή എന്ന ഊന്നിയ നിഷേധം
  choice: ‘ഒരിക്കലും ... ഇല്ല’
  alternative: ‘തീർച്ചയായും ... ഇല്ല’
  rationale: കർത്താവ് പാപം കണക്കിൽപ്പെടുത്താത്തതിന്റെ ശക്തമായ നിഷേധം പ്രകടമാക്കുന്നു; എന്നാൽ അതിനെക്കുറിച്ച് വാചകത്തിൽ ഇല്ലാത്ത ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കണക്കിൽപ്പെടുത്തുക’ എന്നത് സന്ദർഭത്തിലെ അക്കൗണ്ടിങ് രൂപകം കാത്തുസൂക്ഷിക്കുന്നു; ‘മനുഷ്യൻ’ ഉറവിടത്തിലെ പ്രതിനിധാനപരമായ ഏകവചനരൂപം നിലനിർത്തുന്നു.
