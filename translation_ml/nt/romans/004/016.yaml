  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, അത് വിശ്വാസത്താലാണ്[a], അങ്ങനെ അത് കൃപപ്രകാരമായിരിക്കാനും വാഗ്ദാനം എല്ലാ സന്തതിക്കും[b] ഉറപ്പുള്ളതായിരിക്കാനും—നിയമത്തിൽനിന്നുള്ളവർക്കു മാത്രമല്ല, അബ്രാഹാമിന്റെ വിശ്വാസമുള്ളവർക്കും—അബ്രാഹാം നമ്മുടെ എല്ലാവരുടെയും പിതാവാണ്[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശ്വാസം’ എന്നത് ഇവിടെ ‘ആശ്രയം’ എന്നും മനസ്സിലാക്കാം; ‘വിശ്വസ്തത’ എന്ന അർത്ഥം ഈ സന്ദർഭത്തിൽ കുറച്ച് സാധ്യതയുള്ളതാണ്.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘വിത്ത്’; ഇവിടെ അബ്രാഹാമിന്റെ സന്തതിയെ കൂട്ടമായി സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത രൂപം: ‘അബ്രാഹാമിന്റെ വിശ്വാസത്തിൽനിന്നുള്ള ഒരാൾക്കും.’ ഗ്രീക്കിലെ ഏകവചനം ഇവിടെ ഒരു സമൂഹത്തെ കൂട്ടമായി സൂചിപ്പിക്കാം.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ നിഗമനത്തിലേക്കുള്ള ബന്ധം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: വിശ്വാസം അടിസ്ഥാനമോ മാർഗമോ ആണെന്ന പൗലോസിന്റെ ആശയം, ഗ്രീക്കിലെ സംക്ഷിപ്തത പൂർണമായി വിശദീകരിക്കാതെ, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἵνα κατὰ χάριν
  choice: അങ്ങനെ അത് കൃപപ്രകാരമായിരിക്കാനും
  rationale: ἵνα എന്ന ഉദ്ദേശ്യബന്ധവും κατὰ χάριν എന്ന ‘കൃപയ്ക്ക് അനുസൃതമായി’ എന്ന ആശയവും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: βεβαίαν τὴν ἐπαγγελίαν
  choice: വാഗ്ദാനം ... ഉറപ്പായിരിക്കാനും
  rationale: വാഗ്ദാനത്തിന്റെ വിശ്വാസ്യതയും ഉറപ്പും βεβαίαν എന്ന പദത്തിന് യോജിച്ച ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: παντὶ τῷ σπέρματι
  choice: എല്ലാ സന്തതിക്കും
  rationale: σπέρμα എന്ന ഏകവചനരൂപം ഇവിടെ കൂട്ടാർത്ഥത്തിൽ അബ്രാഹാമിന്റെ സന്തതികളെ സൂചിപ്പിക്കുന്നതിനാൽ ‘സന്തതി’ ആ കൂട്ടാർത്ഥം നിലനിർത്തുന്നു.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: നിയമത്തിൽനിന്നുള്ളവർക്കു മാത്രമല്ല
  rationale: ഗ്രീക്കിലെ ഏകവചനസമുച്ചയപ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായ ബഹുവചനമായി നൽകുന്നു; ‘നിയമത്തിൽനിന്നുള്ള’ എന്ന ബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ
  choice: അബ്രാഹാമിന്റെ വിശ്വാസത്തിൽനിന്നുള്ളവർക്കും
  rationale: ഗ്രീക്കിലെ സാന്ദ്രവും അല്പം ദ്വയാർത്ഥവുമായ ഘടനയെ അനാവശ്യമായി ‘അതേ വിശ്വാസം പങ്കിടുന്നവർ’ എന്നു വിശദീകരിക്കാതെ അടുത്തായി നിലനിർത്തുന്നു.
- source_word: πατὴρ πάντων ἡμῶν
  choice: നമ്മുടെ എല്ലാവരുടെയും പിതാവ്
  rationale: കുടുംബപരവും ഉടമ്പടിസംബന്ധവുമായ പിതൃത്വഭാഷ നേരിട്ടും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκ πίστεως എന്നതിലെ πίστις വിശ്വാസം, ആശ്രയം, അതോ വിശ്വസ്തത എന്നാണോ നൽകേണ്ടത്
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഈ സന്ദർഭത്തിലെ നിയമം–കൃപ–വാഗ്ദാനം എന്ന വാദക്രമത്തിൽ ‘വിശ്വാസം’ ഏറ്റവും യോജിക്കുന്നു; ‘ആശ്രയം’ സാധ്യമായ അർത്ഥനിറമാണ്, ‘വിശ്വസ്തത’ ഇവിടെ കുറച്ച് സാധ്യതയുള്ളതാണ്.
- issue: τῷ ἐκ πίστεως Ἀβραάμ എന്ന ഘടന എത്രമാത്രം വിശദീകരിക്കണം
  choice: അബ്രാഹാമിന്റെ വിശ്വാസത്തിൽനിന്നുള്ളവർ
  alternative: അബ്രാഹാമിന്റെ വിശ്വാസം പങ്കിടുന്നവർ; അബ്രാഹാമിന്റെ വിശ്വാസത്തിൽനിന്നുള്ള ഒരാൾ
  rationale: തിരഞ്ഞെടുത്ത രൂപം ഗ്രീക്കിലെ ‘from the faith of Abraham’ എന്ന ബന്ധം സംരക്ഷിക്കുകയും, അബ്രാഹാമിനെപ്പോലെ വിശ്വസിക്കുന്നവർ എന്ന വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധമായി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ആദ്യ ഉപവാക്യത്തിലെ ഗ്രീക്കിൽ തുറന്നുപറയാത്ത കർത്താവിനെ പൂരിപ്പിക്കണോ
  choice: ‘അത്’ എന്ന സർവനാമം ഉപയോഗിച്ച് സന്ദർഭത്തിലെ സൂചന നിലനിർത്തുക
  alternative: വാഗ്ദാനം വിശ്വാസത്താലാണ്; അവകാശം വിശ്വാസത്തിലൂടെയാണ് ലഭിക്കുന്നത്
  rationale: ‘വാഗ്ദാനം’ അല്ലെങ്കിൽ ‘അവകാശം’ എന്ന് വ്യക്തമാക്കുന്നത് സന്ദർഭപരമായി സാധ്യമെങ്കിലും, മൂലവാക്യത്തിലെ ഉദ്ദേശപൂർവമായ സംക്ഷിപ്തതയെക്കാൾ കൂടുതൽ വ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘കൃപ’, ‘വിശ്വാസം’, ‘വാഗ്ദാനം’, ‘നിയമം’ എന്നീ പൗലോസിന്റെ പ്രധാന ദൈവശാസ്ത്രപദങ്ങൾ സ്ഥിരതയ്ക്കായി നിലനിർത്തി. മൂലത്തിലെ ദീർഘവാക്യം മലയാളത്തിൽ വായനാസൗകര്യത്തിനായി അർദ്ധവിരാമവും ഡാഷും ഉപയോഗിച്ച് ക്രമപ്പെടുത്തി; അവസാനത്തെ ബന്ധവാക്യം പൂർണവാക്യമാക്കി.
