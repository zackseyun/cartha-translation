  naturalness: The proposed revision is concise, idiomatic in a solemn/scriptural register, and preserves the balanced parallelism of the Greek citation.
  terminology: ‘ഭാഗ്യവാന്മാർ’ is the established, natural Malayalam beatitude term for Μακάριοι. ‘നിയമലംഘനങ്ങൾ’ and ‘പാപങ്ങൾ’ appropriately retain the lexical distinction without overstating it. ‘മൂടപ്പെട്ട’ preserves the biblical metaphor more directly than ‘മറയ്ക്കപ്പെട്ട.’
