id: ROM.4.7
reference: Romans 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: ml
  text: നിയമലംഘനങ്ങൾ ക്ഷമിക്കപ്പെട്ടവരും[a] പാപങ്ങൾ മൂടപ്പെട്ടവരും ഭാഗ്യവാന്മാർ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അധർമ്മങ്ങൾ ക്ഷമിക്കപ്പെട്ടവരും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: അനുഗൃഹീതർ
  rationale: കേവലം മാനസികമായ സന്തോഷത്തെയോ ഭാഗ്യത്തെയോ സൂചിപ്പിക്കാതെ ദൈവിക അനുഗ്രഹം ലഭിച്ച നിലയെ പ്രഖ്യാപിക്കുന്ന പദമായി തിരഞ്ഞെടുത്തു.
- source_word: ἀφέθησαν
  choice: ക്ഷമിക്കപ്പെടുകയും
  rationale: ἀφίημι എന്ന ക്രിയയുടെ ക്ഷമ/മോചനം എന്ന അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്ക് എയോറിസ്റ്റ് പാസീവിന്റെ പൂർത്തിയായ ഫലം സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: ἀνομίαι
  choice: നിയമലംഘനങ്ങൾ
  rationale: പൊതുവായ തെറ്റുകളെന്നതിലുപരി നിയമത്തോടുള്ള ലംഘനം എന്ന ἀνομίαയുടെ ഭാവം സാധാരണ വായനക്കാർക്ക് സുതാര്യമായി നിലനിർത്തുന്നു.
- source_word: ἐπεκαλύφθησαν
  choice: മറയ്ക്കപ്പെടുകയും
  rationale: സങ്കീർത്തനം 32:1-ൽ നിന്നുള്ള ഉദ്ധരണിയിലെ ‘മൂടുക/മറയ്ക്കുക’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: ἁμαρτίαι
  choice: പാപങ്ങൾ
  rationale: ἁμαρτίαι എന്നതിന് പ്രമാണികവും സുതാര്യവുമായ മലയാള പദം; ഇവിടെ പരാവർത്തനം ആവശ്യമില്ല.
theological_decisions:
- issue: ‘നിയമലംഘനങ്ങൾ’ എന്നും ‘പാപങ്ങൾ’ എന്നും ഉള്ള പദങ്ങളുടെ ബന്ധം
  choice: രണ്ടു ഗ്രീക്ക് പദങ്ങളും മലയാളത്തിൽ വ്യത്യസ്ത പദങ്ങളായി നിലനിർത്തി.
  alternative: രണ്ടും ‘പാപങ്ങൾ’ എന്ന ഒരേ പൊതുപദംകൊണ്ട് പരിഭാഷപ്പെടുത്തുക.
  rationale: പൗലോസ് സങ്കീർത്തനത്തിലെ കാവ്യസമാന്തരത നിലനിർത്തുമ്പോഴും പരസ്പരം ബന്ധപ്പെട്ടെങ്കിലും ഒരേ പദമല്ലാത്ത രണ്ടു പ്രയോഗങ്ങൾ ഉപയോഗിക്കുന്നു. അതിനാൽ വാക്യം പറയുന്നതിലധികം കർശനമായ ദൈവശാസ്ത്രവ്യത്യാസം ചുമത്താതെ രണ്ടും വേർതിരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. മൂലത്തിലെ രണ്ടു പാസീവ് ക്രിയകളും കാവ്യസമാന്തരതയും ‘മറയ്ക്കുക’ എന്ന രൂപകവും നിലനിർത്തി.
