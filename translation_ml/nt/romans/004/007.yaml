    rationale: ‘അനുഗൃഹീതർ’ is understandable, but ‘ഭാഗ്യവാന്മാർ’ is more natural and established for Μακάριοι in a beatitude, while retaining its declarative blessedness in context.
  revised_text: നിയമലംഘനങ്ങൾ ക്ഷമിക്കപ്പെട്ടവരും[a] പാപങ്ങൾ മൂടപ്പെട്ടവരും ഭാഗ്യവാന്മാർ.
