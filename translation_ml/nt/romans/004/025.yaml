  source_fidelity: ഗ്രീക്ക് മൂലത്തിലെ സമാന്തര നിഷ്ക്രിയ ക്രിയാരൂപങ്ങളായ παρεδόθη, ἠγέρθη എന്നിവ ‘ഏൽപ്പിക്കപ്പെടുകയും’/‘ഉയിർപ്പിക്കപ്പെടുകയും’ എന്ന രൂപങ്ങളിൽ നന്നായി പ്രതിഫലിക്കുന്നു. διὰ + accusative-ന്റെ ആദ്യ കാരണാർഥം ‘നിമിത്തം’ കൊണ്ടും, രണ്ടാമത്തെ വാക്യഭാഗത്തിലെ സന്ദർഭോചിതമായ ലക്ഷ്യാർഥവായന ‘നീതീകരണത്തിനായി’ കൊണ്ടും യുക്തമായി നൽകിയിരിക്കുന്നു.
