id: ROM.4.25
reference: Romans 4:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: ml
  text: നമ്മുടെ അതിക്രമങ്ങൾ നിമിത്തം ഏൽപ്പിക്കപ്പെടുകയും നമ്മുടെ നീതീകരണത്തിനായി ഉയിർപ്പിക്കപ്പെടുകയും ചെയ്തവൻ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മുടെ നീതീകരണം നിമിത്തം.”
    reason: alternative_reading
  - marker: b
    text: “നീതീകരണം” എന്നത് “കുറ്റവിമുക്തരാക്കൽ” എന്നോ “നീതിമാന്മാരായി പ്രഖ്യാപിക്കൽ” എന്നോ പ്രകടിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: ഏൽപ്പിക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ നിഷ്ക്രിയരൂപവും ദൈവം പ്രവർത്തകനായിരിക്കാമെന്ന സൂചനയും നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമാണ്.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: നമ്മുടെ അതിക്രമങ്ങൾ നിമിത്തം
  rationale: διά + ദ്വിതീയാവിഭക്തിയുടെ കാരണാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: παραπτώματα
  choice: അതിക്രമങ്ങൾ
  rationale: παράπτωμα സൂചിപ്പിക്കുന്ന ധാർമ്മിക ലംഘനത്തെ പൊതുവായ ‘പാപങ്ങൾ’ എന്നതിലേക്കു ചുരുക്കാതെ സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: ἠγέρθη
  choice: ഉയിർപ്പിക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ ലളിതമായ നിഷ്ക്രിയരൂപം സംരക്ഷിക്കുകയും മരിച്ചവരിൽനിന്നുള്ള ഉയിർത്തെഴുന്നേൽപ്പിനെ മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: നമ്മുടെ നീതീകരണത്തിനായി
  rationale: ഇവിടെ διά + ദ്വിതീയാവിഭക്തിക്ക് ലക്ഷ്യാർഥം നൽകുന്ന സന്ദർഭോചിതമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; കാരണാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: δικαίωσιν
  choice: നീതീകരണം
  rationale: പൗലോസിന്റെ നിയമപരവും രക്ഷാസംബന്ധവുമായ ആശയഗൗരവം നിലനിർത്തുന്ന സ്ഥാപിത മലയാള ദൈവശാസ്ത്രപദമാണ്.
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν എന്നത് ലക്ഷ്യം/ഫലം (‘നമ്മുടെ നീതീകരണത്തിനായി’) ആണോ കാരണം (‘നമ്മുടെ നീതീകരണം നിമിത്തം’) ആണോ എന്നത്.
  choice: നമ്മുടെ നീതീകരണത്തിനായി
  alternative: നമ്മുടെ നീതീകരണം നിമിത്തം
  rationale: ഉയിർപ്പ് വിശ്വാസികളുടെ നീതീകരണവുമായി രക്ഷാസംബന്ധമായി ചേർന്നിരിക്കുന്നുവെന്ന സന്ദർഭോചിതവും പരമ്പരാഗതവുമായ വായന മുഖ്യപാഠത്തിൽ സ്വീകരിക്കുന്നു; വ്യാകരണപരമായി സാധ്യമായ കാരണാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ സമാന്തര നിഷ്ക്രിയ ക്രിയാരൂപങ്ങൾ നിലനിർത്തി; സാങ്കേതികമായ ‘നീതീകരണം’ സാധാരണ വായനക്കാർക്കായി അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
