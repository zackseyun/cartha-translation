id: ROM.4.5
reference: Romans 4:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: ml
  text: എന്നാൽ പ്രവൃത്തി ചെയ്യാതെ, അഭക്തനെ നീതീകരിക്കുന്നവനിൽ[b] വിശ്വസിക്കുന്നവന്റെ വിശ്വാസം നീതിയായി[d] കണക്കാക്കപ്പെടുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: അഥവാ, “നീതിമാനെന്ന് പ്രഖ്യാപിക്കുന്നവനിൽ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “വരവുവെക്കപ്പെടുന്നു” അല്ലെങ്കിൽ “എണ്ണപ്പെടുന്നു.”
    reason: lexical_alternative
  - marker: d
    text: അഥവാ, “നീതിനിഷ്ഠയായി”; പൗലോസിന്റെ രചനകളിൽ δικαιοσύνη എന്ന പദത്തിന് സന്ദർഭമനുസരിച്ച് “ന്യായം” എന്ന അർത്ഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: പ്രവൃത്തി ചെയ്യാത്തവനാകട്ടെ
  rationale: μήയോടുകൂടിയ substantival participle-ന്റെ രൂപവും തുടർന്ന് വരുന്ന ‘വിശ്വസിക്കുന്നു’ എന്നതുമായ വൈരുധ്യവും നിലനിർത്തുന്നു; എല്ലാ അധ്വാനത്തെയും പൊതുവായി അപലപിക്കുന്നുവെന്ന വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: വിശ്വസിക്കുന്നു
  rationale: πιστεύω എന്ന വിശ്വാസ-പദസമൂഹവുമായി പദബന്ധം നിലനിർത്തുകയും ἐπί സൂചിപ്പിക്കുന്ന ആശ്രയഭാവം ‘...വനിൽ’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν δικαιοῦντα
  choice: നീതീകരിക്കുന്നവൻ
  rationale: പൗലോസിന്റെ വാദത്തിലെ പ്രധാന ദൈവശാസ്ത്രപദത്തിന്റെ സാങ്കേതിക ശക്തിയും δικαιοσύνηയുമായുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: τὸν ἀσεβῆ
  choice: അഭക്തൻ
  rationale: ദൈവത്തോടുള്ള ഭക്തിയില്ലായ്മയെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും സൂചിപ്പിക്കുന്നു; ‘ദുഷ്ടൻ’ എന്നത് പൊതുവായ ധാർമ്മിക ദുഷ്ടതയിലേക്ക് അർത്ഥം ചായിക്കാം.
- source_word: λογίζεται
  choice: കണക്കാക്കപ്പെടുന്നു
  rationale: കണക്കിടൽ/അംഗീകരിക്കൽ എന്ന രൂപകം വ്യക്തമായി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: ἡ πίστις αὐτοῦ
  choice: അവന്റെ വിശ്വാസം
  rationale: ഉടനെയുള്ള πιστεύοντι എന്ന ക്രിയയുമായുള്ള ബന്ധം നിലനിർത്തുന്നു; ഇവിടെ ‘വിശ്വസ്തത’യെക്കാൾ വിശ്വസിക്കുന്ന നിലപാടാണ് സന്ദർഭത്തിന് യോജിച്ചത്.
- source_word: εἰς δικαιοσύνην
  choice: നീതിയായി
  rationale: λογίζομαι ... εἰς എന്ന പ്രയോഗത്തിന്റെ ‘ഒന്നായി കണക്കാക്കുക’ എന്ന ഫലം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: δικαιοῦντα എന്ന ദൈവശാസ്ത്രഭാരമുള്ള പദത്തിന്റെ വിവർത്തനം
  choice: നീതീകരിക്കുന്നവൻ
  alternative: നീതിമാനെന്ന് പ്രഖ്യാപിക്കുന്നവൻ
  rationale: നീതീകരണം പ്രഖ്യാപനമാണോ അതിലധികമോ എന്ന ദൈവശാസ്ത്രചർച്ചയെ മുഖ്യപാഠം നിർബന്ധമായി തീർപ്പാക്കാതെ, പൗലോസിന്റെ മുഖ്യപദവും δικαιοσύνηയുമായുള്ള ബന്ധവും സംരക്ഷിക്കുന്നു.
- issue: πίστις/πιστεύω എന്ന പദസമൂഹത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം / വിശ്വസിക്കുന്നു
  alternative: ആശ്രയം / ആശ്രയിക്കുന്നു; വിശ്വസ്തത
  rationale: പ്രവൃത്തിയും വിശ്വസിക്കലും തമ്മിലുള്ള ഉടനെയുള്ള വൈരുധ്യം ഇവിടെ ‘വിശ്വാസം’ എന്ന അർത്ഥത്തെ പിന്തുണയ്ക്കുന്നു; ആശ്രയഭാവം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: εἰς δικαιοσύνην എന്നതിലെ δικαιοσύνη
  choice: നീതി
  alternative: നീതിനിഷ്ഠ; ന്യായം
  rationale: നീതീകരിക്കുന്നു എന്ന പദവുമായി ആശയബന്ധം നിലനിർത്തുകയും ‘നീതി’ എന്ന പദത്തിന്റെ നൈതികവും ന്യായവിധിസംബന്ധവുമായ വ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ രണ്ട് participle-കളുടെ വൈരുധ്യം ‘പ്രവൃത്തി ചെയ്യാത്തവനാകട്ടെ ... വിശ്വസിക്കുന്നു’ എന്ന ഘടനയിൽ സൂക്ഷിച്ചു. ദൈർഘ്യമേറിയ ഏകവാക്യം മലയാളത്തിൽ വ്യക്തമായി വായിക്കാനായി അർധവിരാമം ഉപയോഗിച്ചു; ദൈവശാസ്ത്രപരമായി നിർണായകമായ ‘നീതീകരിക്കുക—നീതി’ പദബന്ധം നിലനിർത്തി.
