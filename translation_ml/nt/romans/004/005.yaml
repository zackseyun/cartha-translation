  - severity: low
    issue: Footnote d’s first alternative is grammatically mismatched.
    rationale: Since the main text has ‘നീതിയായി,’ the alternative lexical noun should be ‘നീതിനിഷ്ഠ’ (used as ‘നീതിനിഷ്ഠയായി’ in the sentence), rather than presenting the inflected adverbial form as the lexical alternative.
