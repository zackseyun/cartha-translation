    issue: ‘അതിക്രമം’ παράβασις-ന്റെ അർഥം അപര്യാപ്തമായി വ്യക്തമാക്കുന്നു.
    rationale: παράβασις ഒരു നിയമമോ നിർദേശമോ അതിരോ ലംഘിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അതിക്രമം’ മലയാളത്തിൽ അധികപ്രവൃത്തി, ദുരുപയോഗം, അല്ലെങ്കിൽ അതിരുകടക്കൽ എന്ന വിശാല അർഥത്തിലേക്കും പോകാം. ‘ലംഘനം’ നിയമത്തിന്റെ അഭാവവും transgression-ന്റെ അഭാവവും തമ്മിലുള്ള പൗലോസിന്റെ യുക്തിബന്ധം കൂടുതൽ കൃത്യമായി നിലനിർത്തുന്നു.
