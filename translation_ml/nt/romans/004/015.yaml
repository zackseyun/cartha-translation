id: ROM.4.15
reference: Romans 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: ml
  text: കാരണം നിയമം ക്രോധം വരുത്തുന്നു.[a] എന്നാൽ നിയമമില്ലാത്തിടത്ത് ലംഘനവും ഇല്ല.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായപ്രമാണം ക്രോധം വരുത്തുന്നു.’
    reason: νόμος ഇവിടെ പ്രത്യേകമായി മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
  - marker: b
    text: അഥവാ, ‘അതിക്രമവും ഇല്ല.’
    reason: παράβασις എന്നതിന് സാധ്യമായ മറ്റൊരു മലയാള പദപ്രയോഗം.
lexical_decisions:
- source_word: νόμος
  choice: നിയമം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലുള്ള വിശാലത നിലനിർത്താനും പ്രധാനപാഠത്തിൽത്തന്നെ മോശെയുടെ ന്യായപ്രമാണത്തിലേക്ക് അർഥം പരിമിതപ്പെടുത്താതിരിക്കാനും ‘നിയമം’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: ὀργή
  choice: ക്രോധം
  rationale: സാധാരണ കോപത്തെക്കാൾ ന്യായവിധിയുമായി ബന്ധപ്പെട്ട ഗൗരവം ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ ‘ക്രോധം’ തിരഞ്ഞെടുത്തു; ആരുടെ ക്രോധമെന്നത് മൂലപാഠം വ്യക്തമാക്കാത്തതിനാൽ ‘ദൈവക്രോധം’ എന്നു വിശദീകരിച്ചില്ല.
- source_word: κατεργάζεται
  choice: വരുത്തുന്നു
  rationale: പ്രവർത്തനത്തിന്റെ ഫലമായി ഒന്നുണ്ടാകുന്നു എന്ന കാരണാത്മക ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: οὗ δὲ
  choice: എന്നാൽ ... ഇല്ലാത്തിടത്ത്
  rationale: δέ സൂചിപ്പിക്കുന്ന നേരിയ വൈരുധ്യവും οὗ എന്ന സ്ഥലസംബന്ധിയായ ആശയവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: παράβασις
  choice: അതിക്രമം
  rationale: അറിയപ്പെട്ട അതിരോ കൽപ്പനയോ കടന്നുപോകുന്ന പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്ന പദമായി തിരഞ്ഞെടുത്തു; ‘ലംഘനം’ എന്നതും സാധ്യമാണ്.
theological_decisions:
- issue: പൗലോസിന്റെ വാദത്തിൽ νόμος എന്നതിന്റെ വ്യാപ്തി
  choice: നിയമം
  alternative: ന്യായപ്രമാണം
  rationale: ഈ വാക്യം നിയമവും അതിക്രമവും തമ്മിലുള്ള പൊതുതത്ത്വം പ്രസ്താവിക്കുന്നു. അതിനെ പ്രധാനപാഠത്തിൽ മോശെയുടെ ന്യായപ്രമാണത്തിലേക്ക് മാത്രം പരിമിതപ്പെടുത്താതെ, ആ പശ്ചാത്തലം സാധ്യമായി നിലനിർത്തുന്നു.
- issue: ὀργή ആരുടെ ക്രോധമാണ്
  choice: ക്രോധം
  alternative: ദൈവക്രോധം
  rationale: സന്ദർഭത്തിൽ ദൈവത്തിന്റെ ന്യായവിധിക്രോധം ഉദ്ദേശിക്കപ്പെട്ടിരിക്കാമെങ്കിലും ഗ്രീക്ക് പാഠത്തിൽ ഉടമസ്ഥൻ വ്യക്തമാക്കിയിട്ടില്ല; അതിനാൽ ആ വ്യക്തത വിവർത്തനത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന ഉപയോഗിച്ചു. ഗ്രീക്ക് പാഠത്തിലെ കാരണബന്ധം ‘കാരണം’ എന്നും വൈരുധ്യം ‘എന്നാൽ’ എന്നും വ്യക്തമാക്കി; സാങ്കേതികമോ സഭാവിഭാഗ-വിശേഷമോ ആയ ഭാഷ ഒഴിവാക്കി.
