  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: ml
  text: മറിച്ച്, നമുക്കുവേണ്ടിയും ഇത് എഴുതപ്പെട്ടതാണ്—നമ്മുടെ കർത്താവായ യേശുവിനെ മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിച്ചവനിൽ വിശ്വസിക്കുന്ന നമുക്കു അത് കണക്കാക്കപ്പെടാനിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “ആശ്രയിക്കുന്ന.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ δι’ ἡμᾶς
  choice: നമുക്കുവേണ്ടിയും എഴുതപ്പെട്ടതാണ്
  rationale: മുൻവാക്യത്തിൽനിന്ന് മനസ്സിലാകുന്ന ‘എഴുതപ്പെട്ടു’ എന്ന ക്രിയ മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി വ്യക്തമാക്കുന്നു; καὶ എന്നതിന്റെ ചേർക്കൽഭാവം ‘-യും’ നിലനിർത്തുന്നു. ἀλλάയുടെ വിരുദ്ധഭാവം മുൻസന്ദർഭത്തോടുള്ള ബന്ധത്തിൽ ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്നു.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: അത് കണക്കാക്കപ്പെടാനിരിക്കുന്ന നമ്മൾക്ക്
  rationale: μέλλει എന്ന ഭാവിദിശയും λογίζεσθαι എന്ന കണക്കിടൽ/അംഗീകരിക്കൽ രൂപകവും നിലനിർത്തുന്നു. ഗ്രീക്കിൽ പരോക്ഷമായി നിൽക്കുന്ന കർമ്മത്തെ ‘അത്’ എന്നു നൽകി മുൻസന്ദർഭത്തിലേക്കുള്ള ബന്ധം സംരക്ഷിക്കുന്നു.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: വിശ്വസിക്കുന്ന
  rationale: ἐπί സഹിതമുള്ള πιστεύω ഒരു വ്യക്തിയിലേക്കു തിരിഞ്ഞ വിശ്വാസത്തെയോ ആശ്രയത്തെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘-ൽ വിശ്വസിക്കുക’ സ്വാഭാവികമാണ്.
- source_word: τὸν ἐγείραντα
  choice: ഉയിർപ്പിച്ചവൻ
  rationale: ദൈവത്തെ അവന്റെ പ്രവൃത്തിയിലൂടെ സൂചിപ്പിക്കുന്ന substantival participle സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: നമ്മുടെ കർത്താവായ യേശു
  rationale: κύριος എന്ന പദത്തിന് പരമ്പരാഗതവും ആധുനിക മലയാളത്തിലും ഗ്രാഹ്യവുമായ ‘കർത്താവ്’ ഉപയോഗിക്കുന്നു; appositional ബന്ധം ‘-ആയ’കൊണ്ട് വ്യക്തമാക്കുന്നു.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: പുനരുത്ഥാനഭാഷയിലെ ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും കൃത്യവുമായ മലയാളരൂപം.
theological_decisions:
- issue: λογίζεσθαι എന്ന ക്രിയയുടെ പരോക്ഷ കർമ്മം വ്യക്തമാക്കണമോ
  choice: ‘അത് കണക്കാക്കപ്പെടാനിരിക്കുന്ന’
  alternative: ‘നീതി കണക്കാക്കപ്പെടാനിരിക്കുന്ന’
  rationale: മുൻസന്ദർഭത്തിൽ നീതിയാണ് ഉദ്ദേശ്യമെങ്കിലും ഗ്രീക്ക് ഈ വാക്യത്തിൽ കർമ്മം ആവർത്തിക്കുന്നില്ല. ‘അത്’ എന്നത് അർഥഗ്രാഹ്യത നൽകുമ്പോഴും മൂലപാഠത്തിലെ ellipsis സംരക്ഷിക്കുന്നു.
- issue: πιστεύουσιν ἐπὶ വിശ്വാസമോ ആശ്രയമോ
  choice: ‘വിശ്വസിക്കുന്ന’ എന്നത് മുഖ്യപാഠത്തിൽ
  alternative: ‘ആശ്രയിക്കുന്ന’
  rationale: പദത്തിന്റെ വിശ്വാസവും വ്യക്തിയിൽ ആശ്രയം വെക്കുന്നതുമായ അർഥപരിധി നിലനിർത്താൻ സാധാരണ ബൈബിൾ-മലയാളമായ ‘വിശ്വസിക്കുക’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ച് മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ ശൈലി. മുൻവാക്യത്തിൽനിന്ന് ഉൾക്കൊള്ളുന്ന ‘എഴുതപ്പെട്ടതാണ്’ സ്വാഭാവികതയ്ക്കായി ചേർത്തു; ദീർഘമായ ഗ്രീക്ക് ഘടന ഡാഷും ‘അതായത്’ എന്ന വിശദീകരണബന്ധവും ഉപയോഗിച്ച് വ്യക്തമാക്കിയിരിക്കുന്നു.
