  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: ml
  text: ജോലി ചെയ്യുന്നവന് കൂലി ദാനമായി കണക്കാക്കപ്പെടുന്നില്ല[a]; മറിച്ച്, കൊടുക്കാനുള്ളതായിട്ടാണ് കണക്കാക്കപ്പെടുന്നത്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൃപയുടെ അടിസ്ഥാനത്തിൽ കണക്കാക്കപ്പെടുന്നില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ബാധ്യതയായിട്ടാണ്” അല്ലെങ്കിൽ “കടമായി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: ജോലി ചെയ്യുന്നവന്
  rationale: വർത്തമാനകാല കൃതന്തം നിർദ്ദിഷ്ട ആർട്ടിക്കിളോടുകൂടെ നാമസമാനമായി ഉപയോഗിച്ചിരിക്കുന്നു; ജോലി ചെയ്യുന്ന ഒരാളെ പൊതുവായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: μισθὸς
  choice: കൂലി
  rationale: തൊഴിലിന് അർഹമായി ലഭിക്കുന്ന പ്രതിഫലം എന്ന ആശയം ‘കൂലി’ കൃത്യമായും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായും നൽകുന്നു.
- source_word: λογίζεται
  choice: കണക്കാക്കപ്പെടുന്നു
  rationale: ഒരാളുടെ അക്കൗണ്ടിൽ വകയിരുത്തുകയോ കണക്കിൽപ്പെടുത്തുകയോ ചെയ്യുന്ന പൗലോസിന്റെ ധനകാര്യരൂപകം ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κατὰ χάριν
  choice: കൃപാദാനമായി
  rationale: അധ്വാനിച്ച് സമ്പാദിച്ച കൂലിയും അർഹതയില്ലാതെ ലഭിക്കുന്ന കൃപാദാനവും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കൃപ’ എന്ന ദൈവശാസ്ത്രപരമായ പദവും നിലനിർത്തുന്നു.
- source_word: ὀφείλημα
  choice: കൊടുക്കാനുള്ള കടം
  rationale: നൽകാൻ ബാധ്യതയുള്ള, ഒരാൾക്ക് അവകാശപ്പെട്ട തുക എന്ന അർഥം പ്രകടമാക്കുകയും കൃപാദാനത്തോടുള്ള വൈരുധ്യം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വാദവുമായി ബന്ധിപ്പിക്കുന്ന ലഘുവായ വൈരുധ്യസൂചകം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; കാലസൂചകമായ ‘ഇപ്പോൾ’ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: തൊഴിൽ-കൂലി വൈരുധ്യത്തിൽ χάρις എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ‘കൃപാദാനമായി’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കൃപയുടെ അടിസ്ഥാനത്തിൽ’ അല്ലെങ്കിൽ ‘കൃപയായി’
  rationale: വാക്യം സമ്പാദിച്ച പ്രതിഫലത്തെ അർഹതയില്ലാതെ ലഭിക്കുന്ന കൃപയുമായി താരതമ്യം ചെയ്യുന്നു. ‘കൃപാദാനം’ ഈ സന്ദർഭത്തിലെ ദാനസ്വഭാവം വ്യക്തമാക്കുന്നതിനൊപ്പം χάρις എന്ന പദത്തിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനം ഇല്ലാതാക്കുന്നില്ല.
- issue: ὀφείλημα എന്നതിലെ കടം/ബാധ്യത രൂപകം
  choice: ‘കൊടുക്കാനുള്ള കടം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ബാധ്യത’ അല്ലെങ്കിൽ ‘കൊടുക്കാനുള്ളത്’
  rationale: മൂലപാഠത്തിലെ സാമ്പത്തികരൂപകവും കൂലി തൊഴിലാളിക്ക് അവകാശപ്പെട്ടതാണ് എന്ന ആശയവും വ്യക്തമായി നിലനിർത്തുന്നു; അധികമായ ഒരു ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘കൂലി’, ‘കണക്കാക്കപ്പെടുന്നു’, ‘കടം’ എന്നീ സാധാരണ പദങ്ങൾ മൂലത്തിലെ തൊഴിൽ-അക്കൗണ്ടിംഗ് രൂപകം നിലനിർത്തുന്നു. വ്യക്തതയ്ക്കായി രണ്ടാം ഖണ്ഡത്തിൽ ക്രിയ ആവർത്തിച്ചിരിക്കുന്നു.
