  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: ml
  text: എന്തെന്നാൽ, ന്യായപ്രമാണത്തിൽനിന്നുള്ളവർ അവകാശികളാണെങ്കിൽ[a], വിശ്വാസം ശൂന്യമായിരിക്കുന്നു[b], വാഗ്ദാനം പ്രാബല്യമില്ലാതായിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ന്യായപ്രമാണത്തെ അടിസ്ഥാനമാക്കിയുള്ളവർ.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വിശ്വാസം ശൂന്യമാക്കപ്പെട്ടിരിക്കുന്നു.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘വാഗ്ദാനം ഫലരഹിതമാക്കപ്പെട്ടിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘അസാധുവാക്കപ്പെട്ടിരിക്കുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: ന്യായപ്രമാണത്തെ അടിസ്ഥാനമാക്കിയുള്ളവർ
  rationale: ἐκ νόμου എന്ന പൗലോസീയ പ്രയോഗം ന്യായപ്രമാണത്തോടുള്ള ബന്ധത്താൽ നിർവചിക്കപ്പെടുന്നവരെ സൂചിപ്പിക്കുന്നു. ‘ന്യായപ്രമാണം അനുസരിക്കുന്നവർ’ എന്നു പറഞ്ഞ് ആശയം അനാവശ്യമായി ചുരുക്കാതെ, മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: κληρονόμοι
  choice: അവകാശികൾ
  rationale: അവകാശവും പൈതൃകവും ലഭിക്കുന്നവരെ സൂചിപ്പിക്കുന്ന, ഈ വാഗ്ദാനസന്ദർഭത്തിന് യോജിച്ച സാധാരണ മലയാളപദം.
- source_word: κεκένωται
  choice: അർഥശൂന്യമായിത്തീർന്നിരിക്കുന്നു
  rationale: ‘ഒഴിഞ്ഞതാക്കുക’ എന്ന രൂപകത്തിന്റെ ഫലമായി വിശ്വാസം ഉള്ളടക്കമോ പ്രയോജനമോ ഇല്ലാത്തതായിത്തീരുന്നു എന്ന ആശയവും ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ നിലനിൽക്കുന്ന ഫലവും സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: റോമർ 4-ലെ ന്യായപ്രമാണവും വിശ്വാസവും തമ്മിലുള്ള വാദക്രമം വ്യക്തമായി നിലനിർത്തുന്ന പതിവ് പരിഭാഷ.
- source_word: κατήργηται
  choice: പ്രാബല്യമില്ലാതായിത്തീർന്നിരിക്കുന്നു
  rationale: പൂർണമായി ഇല്ലാതാക്കപ്പെട്ടു എന്നതിലുപരി ഫലമോ പ്രാബല്യമോ നഷ്ടപ്പെട്ടിരിക്കുന്നു എന്ന അർഥവും perfect രൂപത്തിന്റെ തുടർന്നുനിൽക്കുന്ന ഫലവും നൽകുന്നു.
- source_word: ἡ ἐπαγγελία
  choice: വാഗ്ദാനം
  rationale: മുൻസന്ദർഭത്തിൽ ചർച്ചചെയ്യുന്ന പ്രത്യേക വാഗ്ദാനത്തെ ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദം νόμος എന്നതിനോടുള്ള പൗലോസീയ വൈരുധ്യത്തിൽ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: വിശ്വാസം
  alternative: വിശ്വസ്തത; ആശ്രയം
  rationale: ഈ സന്ദർഭത്തിൽ അവകാശം ന്യായപ്രമാണത്തിലൂടെയാണോ വിശ്വാസത്തിലൂടെയാണോ എന്നതാണ് വാദം. അതിനാൽ ‘വിശ്വാസം’ പൗലോസിന്റെ ആശയരേഖയും പദത്തിന്റെ യഥാർഥ വ്യാപ്തിയും ഏറ്റവും നന്നായി നിലനിർത്തുന്നു.
- issue: οἱ ἐκ νόμου എന്ന പ്രയോഗത്തിന്റെ ബന്ധസൂചന
  choice: ന്യായപ്രമാണത്തെ അടിസ്ഥാനമാക്കിയുള്ളവർ
  alternative: ന്യായപ്രമാണത്തിൽനിന്നുള്ളവർ; ന്യായപ്രമാണം അനുസരിക്കുന്നവർ
  rationale: ഈ പ്രയോഗം കേവലം നിയമാനുഷ്ഠാനത്തെ മാത്രമാണെന്ന് തീർപ്പാക്കാതെ, ന്യായപ്രമാണവുമായി ബന്ധപ്പെട്ട ഉറവിടമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്ന യഥാർഥ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. γάρ-നെ ‘എങ്കിൽ’ എന്ന നിബന്ധനാഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളിച്ചിരിക്കുന്നു; ആശയവിരാമം വ്യക്തമാക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു. സാങ്കേതികമായ പദാനുപദഭാഷ ഒഴിവാക്കിയെങ്കിലും മൂലത്തിലെ രൂപകവും perfect ക്രിയാരൂപങ്ങളുടെ നിലനിൽക്കുന്ന ഫലവും അടിക്കുറിപ്പുകളിലും മുഖ്യവാചകത്തിലും സംരക്ഷിച്ചിട്ടുണ്ട്.
