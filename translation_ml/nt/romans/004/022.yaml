lexical_decisions:
- source_word: διό
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐλογίσθη
  choice: കണക്കാക്കപ്പെട്ടു
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തുകയും റോമർ 4-ലെ കണക്കിടൽ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് വിപുലീകരിക്കാതെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: αὐτῷ
  choice: അവന്
  rationale: ദത്തിവ് രൂപത്തിന്റെ വ്യക്തിപരമായ പരാമർശം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; സന്ദർഭത്തിൽ ഇത് അബ്രാഹാമിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς
  choice: -യായി
  rationale: ἐλογίσθη ... εἰς δικαιοσύνην എന്ന പ്രയോഗത്തിലെ നിലയെയോ ഫലത്തെയോ മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ പ്രധാന അർഥവും പദപരമ്പരയുടെ തുടർച്ചയും നിലനിർത്തുന്നു; ‘ന്യായം’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ കണക്കിടൽഭാഷയ്ക്ക് അധിക സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: അത് അവന് നീതിയായി കണക്കാക്കപ്പെട്ടു
  alternative: അത് അവന്റെ കണക്കിൽ നീതിയായി വരവുവെക്കപ്പെട്ടു / അത് അവന് നീതിയായി ഗണിക്കപ്പെട്ടു
  rationale: പ്രഖ്യാപനാത്മകമായ കണക്കിടൽരൂപകം സംരക്ഷിക്കുമ്പോഴും ഗ്രീക്ക് വാചകം വ്യക്തമായി പറയുന്നതിലധികം സിദ്ധാന്തപരമായ ഉള്ളടക്കം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിഘടനയും നിഗമനബന്ധവും നിലനിർത്തിയിട്ടുണ്ട്; പ്രധാന പൗലോസീയ പദത്തിന് ‘നീതി’ ഉപയോഗിച്ചു.
