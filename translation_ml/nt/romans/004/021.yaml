  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: ml
  text: താൻ വാഗ്ദാനം ചെയ്തതു ചെയ്യാനും അവൻ[c] കഴിവുള്ളവനാണെന്ന്[b] പൂർണമായി ബോധ്യപ്പെട്ടവനായി[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പൂർണമായി ഉറപ്പുള്ളവനായി’ അല്ലെങ്കിൽ ‘പൂർണമായി ബോധ്യപ്പെട്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ശക്തനാണ്/കഴിവുള്ളവനാണ്’ എന്ന വർത്തമാനകാലപ്രയോഗമാണ്.
    reason: lexical_alternative
  - marker: c
    text: സന്ദർഭത്തിൽ ‘അവൻ’ ദൈവത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: പൂർണമായി ഉറച്ചുകൊണ്ട്
  rationale: പങ്കാളിക്രിയ പൂർണമായ ഉറപ്പിന്റെ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ഈ രൂപം ഗ്രീക്കിലെ ശക്തിയും മുൻവാക്യത്തോടുള്ള വ്യാകരണബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: അബ്രാഹാമിന്റെ ഉറപ്പിന്റെ ഉള്ളടക്കം അവതരിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ὃ
  choice: ചെയ്തതു
  rationale: ബന്ധസർവനാമത്തിന്റെ അർഥം ‘വാഗ്ദാനം ചെയ്തതു’ എന്ന മലയാളഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ἐπήγγελται
  choice: വാഗ്ദാനം ചെയ്തതു
  rationale: ഗ്രീക്ക് പൂർണകാലം പൂർത്തിയായ വാഗ്ദാനത്തിനുള്ള തുടർന്നുനിൽക്കുന്ന പ്രാബല്യം സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ഈ രൂപം സന്ദർഭത്തിൽ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δυνατός ἐστιν
  choice: ശക്തനാണെന്ന്
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാലമായ ‘ശക്തനാണ്’ എന്ന അർഥം നിലനിർത്തുന്നു; ഇവിടെ കഴിവിനോടൊപ്പം ദൈവത്തിന്റെ ശക്തിയും പ്രകടമാകുന്നതിനാൽ ‘ശക്തൻ’ യോജിക്കുന്നു.
- source_word: καὶ
  choice: ചെയ്യാൻ
  rationale: ഇവിടത്തെ καί വാഗ്ദാനം ചെയ്യുക മാത്രമല്ല, അതു ചെയ്യാനുള്ള ശക്തിയും ഉണ്ടെന്ന ഊന്നൽ നൽകുന്നു. മലയാളത്തിലെ അനന്തക്രിയാഘടനയിൽ ആ ബന്ധം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: ποιῆσαι
  choice: ചെയ്യാൻ
  rationale: ποιέω എന്ന പൊതുവായ ക്രിയയുടെ ലളിതത്വം കാത്തുസൂക്ഷിക്കുന്നു; ‘നിറവേറ്റാൻ’ എന്നത് സാധ്യമായെങ്കിലും കൂടുതൽ വ്യാഖ്യാനാത്മകമാണ്.
theological_decisions:
- issue: വാഗ്ദാനം ചെയ്തവന്റെയും അതു ചെയ്യാൻ ശക്തനായവന്റെയും പരോക്ഷ കർത്താവ്
  choice: പ്രധാനപാഠത്തിൽ ‘അവൻ’ എന്ന സർവനാമം നിലനിർത്തി; അടിക്കുറിപ്പിൽ അത് ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി വ്യക്തമാക്കി.
  alternative: ‘ദൈവം’ എന്ന് പ്രധാനപാഠത്തിൽ നേരിട്ട് ചേർക്കുക.
  rationale: സമീപസന്ദർഭം ദൈവത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന് വ്യക്തമാക്കുന്നു; എന്നാൽ ഈ വാക്യത്തിൽ ഗ്രീക്ക് കർത്താവിനെ പേരെടുത്ത് പറയുന്നില്ല. അതിനാൽ സർവനാമം ഉറവിടത്തിന്റെ പരോക്ഷത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. പങ്കാളിക്രിയാരൂപം മുൻവാക്യത്തോടുള്ള ബന്ധം നിലനിർത്തുന്നു. ‘നിറവേറ്റാൻ’ എന്ന വ്യാഖ്യാനാത്മക പദത്തിനു പകരം ഗ്രീക്കിലെ പൊതുവായ ποιῆσαι അനുസരിച്ച് ‘ചെയ്യാൻ’ സ്വീകരിച്ചു.
