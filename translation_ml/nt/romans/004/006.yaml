revisions:
- from: 'അതുപോലെതന്നെ, ആർക്കു ദൈവം പ്രവൃത്തികൾ കൂടാതെ നീതി[c] കണക്കിടുന്നുവോ[b], ആ മനുഷ്യന്റെ[a] അനുഗൃഹീതാവസ്ഥയെക്കുറിച്ച് ദാവീദും പറയുന്നു:'
