id: ROM.4.6
reference: Romans 4:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: ml
  text: 'അതുപോലെതന്നെ, ദൈവം പ്രവൃത്തികൾ കൂടാതെ നീതിയെ[c] ആരുടെ കണക്കിൽ ചേർക്കുന്നുവോ[b], ആ മനുഷ്യന്റെ[a] ഭാഗ്യത്തെക്കുറിച്ച് ദാവീദും പറയുന്നു:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വ്യക്തിയുടെ”; ഇവിടെ “മനുഷ്യൻ” എന്നത് പ്രതിനിധാനപരമായ അർഥത്തിലാണ്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “കണക്കാക്കുന്നുവോ” അല്ലെങ്കിൽ “വകവെക്കുന്നുവോ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “ന്യായം.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാദത്തോടുള്ള താരതമ്യം സ്വാഭാവികമായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: καὶ
  choice: ദാവീദും
  rationale: ദാവീദിനെ ഒരു അധിക സാക്ഷിയായി ചേർക്കുന്ന καί-യുടെ അർഥം ‘-ഉം’ എന്ന ഘടനയിലൂടെ നൽകുന്നു.
- source_word: λέγει
  choice: പറയുന്നു
  rationale: ഉദ്ധരണി അവതരിപ്പിക്കുന്ന വർത്തമാനകാല ക്രിയയെ സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μακαρισμός
  choice: അനുഗൃഹീതാവസ്ഥ
  rationale: അനുഗൃഹീതനായിരിക്കുന്ന അവസ്ഥയെയോ അങ്ങനെ പ്രഖ്യാപിക്കപ്പെടുന്നതിനെയോ സൂചിപ്പിക്കുന്ന ഭാവനാമത്തിന്റെ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀνθρώπου
  choice: മനുഷ്യന്റെ
  rationale: ഏകവചനവും പ്രതിനിധാനപരവുമായ അർഥം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ സ്ത്രീപുരുഷഭേദമില്ലാതെ പ്രയോഗിക്കാവുന്ന സ്വാഭാവിക പദം ഉപയോഗിക്കുന്നു.
- source_word: λογίζεται
  choice: കണക്കിടുന്നുവോ
  rationale: കണക്കിൽ വകവെക്കുക എന്ന രൂപകത്തെ ലളിതവും നിലവിലുള്ളതുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ഭാരമേറിയ സാങ്കേതിക ദൈവശാസ്ത്രപദം ഒഴിവാക്കുന്നു.
- source_word: δικαιοσύνην
  choice: നീതി
  rationale: δικαιοσύνηയുടെ പൗലൊസീയ ദൈവശാസ്ത്രപരമായ പ്രയോഗവും ധാർമിക-ന്യായപരമായ അർഥപരിധിയും മലയാളത്തിലെ ‘നീതി’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: χωρὶς ἔργων
  choice: പ്രവൃത്തികൾ കൂടാതെ
  rationale: ദൈവത്തിന്റെ കണക്കിടലും പ്രവൃത്തികളും തമ്മിലുള്ള വേർതിരിവ് വ്യക്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀνθρώπου എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ ഏകവചനം
  choice: മനുഷ്യന്റെ
  alternative: വ്യക്തിയുടെ
  rationale: ഗ്രീക്കിലെ ഏകവചനം നിലനിർത്തുന്നു; മലയാളത്തിൽ ‘മനുഷ്യൻ’ ഇവിടെ പുരുഷന്മാരിൽ മാത്രം പരിമിതമല്ലാതെ മനുഷ്യവ്യക്തിയെ പ്രതിനിധീകരിക്കുന്നു.
- issue: λογίζεται എന്ന കണക്കെടുപ്പ്-രൂപകം
  choice: കണക്കിടുന്നുവോ
  alternative: കണക്കാക്കുന്നുവോ / വകവെക്കുന്നുവോ
  rationale: ദൈവം നീതിയെ ഒരാളുടെ കണക്കിൽ ചേർക്കുന്നു എന്ന മൂലപാഠത്തിലെ രൂപകം സംരക്ഷിക്കുകയും അതിനെ ‘നീതിമാനായി പ്രഖ്യാപിക്കുന്നു’ എന്ന് വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: പൗലൊസിന്റെ δικαιοσύνη
  choice: നീതി
  alternative: നീതിനിഷ്ഠ
  rationale: പദത്തിന്റെ ന്യായപരവും ബന്ധപരവും ധാർമികവുമായ അർഥസാധ്യതകൾ ഒരൊറ്റ വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിലെ താരതമ്യം, ദാവീദിന്റെ അധികസാക്ഷ്യം, കണക്കെടുപ്പ്-രൂപകം, പ്രവൃത്തികളിൽനിന്നുള്ള വേർതിരിവ് എന്നിവ നിലനിർത്തിയിരിക്കുന്നു. അടുത്തുവരുന്ന ദാവീദിന്റെ ഉദ്ധരണിയിലേക്കുള്ള ബന്ധം സൂചിപ്പിക്കാൻ അവസാനം ദ്വിബിന്ദു ഉപയോഗിച്ചു.
