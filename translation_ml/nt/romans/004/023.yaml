  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: ml
  text: “അത് അവന് കണക്കാക്കപ്പെട്ടു” എന്ന് എഴുതപ്പെട്ടത് അവനുവേണ്ടി മാത്രം ആയിരുന്നില്ല;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന് കണക്കിൽ ചേർത്തു” അല്ലെങ്കിൽ “അവന് കണക്കാക്കി.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: എഴുതപ്പെട്ടത്
  rationale: തിരുവെഴുത്തിലെ രേഖാമൂലമായ പ്രസ്താവനയുമായുള്ള ബന്ധം നിലനിർത്തുന്ന സ്വാഭാവിക കർമണിപ്രയോഗം.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ വാദത്തിന്റെ തുടർച്ച/നേരിയ മാറ്റം സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ വാക്യക്രമവും സന്ദർഭവും ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ ചേർത്താൽ അനാവശ്യമായ ശക്തമായ വൈരുധ്യം തോന്നാം.
- source_word: δι’ αὐτὸν μόνον
  choice: അവനുവേണ്ടി മാത്രം
  rationale: അബ്രാഹാമിനെ മാത്രം ഉദ്ദേശിച്ചല്ല ഈ വാക്കുകൾ എഴുതപ്പെട്ടത് എന്ന ഊന്നൽ ലളിതമായി സംരക്ഷിക്കുന്നു.
- source_word: ὅτι
  choice: എന്ന്
  rationale: എഴുതപ്പെട്ട വാക്കുകളുടെ ഉള്ളടക്കം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ധരണിരീതിയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἐλογίσθη
  choice: കണക്കിട്ടു
  rationale: λογίζομαι എന്ന പദത്തിന്റെ കണക്കുകൂട്ടൽ/കണക്കിൽ ചേർക്കൽ എന്ന രൂപകം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇല്ലാത്ത സിദ്ധാന്തപരമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: αὐτῷ
  choice: അവനു
  rationale: ദാതൃവിഭക്തിയുടെ അർഥം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: നീതീകരണസന്ദർഭത്തിലെ λογίζομαι എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: കണക്കിട്ടു
  alternative: കണക്കാക്കി; വകവെച്ചുകൊടുത്തു
  rationale: ‘കണക്കിട്ടു’ പൗലോസിന്റെ കണക്കെടുപ്പ്-രൂപകം കാത്തുസൂക്ഷിക്കുകയും അത് എങ്ങനെ മനസ്സിലാക്കണമെന്ന സിദ്ധാന്തപരമായ ചോദ്യം വിവർത്തനം തന്നെ തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. മൂലത്തിലെ ഉദ്ധരണിഘടന നിലനിർത്തി; അടുത്ത വാക്യത്തിലേക്ക് നീളുന്ന വ്യാകരണബന്ധം സൂചിപ്പിക്കാൻ അർധവിരാമം ഉപയോഗിച്ചു.
