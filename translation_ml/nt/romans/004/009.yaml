id: ROM.4.9
reference: Romans 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, ഈ ഭാഗ്യാവസ്ഥ പരിച്ഛേദനയുള്ളവർക്കു മാത്രമാണോ, അതോ പരിച്ഛേദനയില്ലാത്തവർക്കും കൂടിയാണോ? കാരണം, “അബ്രാഹാമിന്റെ വിശ്വാസം അദ്ദേഹത്തിന് നീതിയായി കണക്കാക്കപ്പെട്ടു” എന്നു നാം പറയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρισμός
  choice: അനുഗൃഹീതാവസ്ഥ
  rationale: മുമ്പുള്ള 4:6–8-ലെ ഭാഗ്യപ്രഖ്യാപനത്തിലൂടെ വിവരിച്ച അനുഗൃഹീതാവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്; ‘അനുഗ്രഹം’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ അവസ്ഥാഭാവം വ്യക്തമാക്കുന്നു.
- source_word: περιτομή
  choice: പരിച്ഛേദനയുള്ളവർ
  rationale: പദം അക്ഷരാർഥത്തിൽ ‘പരിച്ഛേദനം’ എന്നാണെങ്കിലും ഇവിടെ പരിച്ഛേദനയുടെ അടയാളമുള്ള ജനവിഭാഗത്തെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായി വ്യക്തികളെ സൂചിപ്പിച്ചു.
- source_word: ἀκροβυστία
  choice: പരിച്ഛേദനയില്ലാത്തവർ
  rationale: περιτομή എന്നതിനോടുള്ള സമാന്തരവിരോധം നിലനിർത്തിക്കൊണ്ട്, പരിച്ഛേദനം ചെയ്യാത്ത ജനവിഭാഗത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: πίστις
  choice: വിശ്വാസം
  rationale: സന്ദർഭത്തിലും ഉല്പത്തി ഉദ്ധരണിയുടെ പൗലോസീയ പ്രയോഗത്തിലും പദത്തിന്റെ സാധാരണവും യോജിച്ചതുമായ അർഥം.
- source_word: ἐλογίσθη
  choice: കണക്കാക്കപ്പെട്ടു
  rationale: λογίζομαι എന്ന പദത്തിലെ കണക്കിടൽ/വിലയിരുത്തൽ ഭാവം ദൈവശാസ്ത്രപരമായി വികസിപ്പിക്കാതെ ലഭ്യമായ കർമണിപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: ദൈവമുമ്പാകെയുള്ള ശരിയായ നിലയും നൈതിക നീതിയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന സ്വാഭാവിക മലയാള പദം; സന്ദർഭം ആവശ്യപ്പെടുന്നതിലധികം അർഥം നിർണ്ണയിക്കുന്നില്ല.
- source_word: εἰς δικαιοσύνην
  choice: നീതിയായി
  rationale: കണക്കാക്കലിന്റെ ഫലം/ബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം മലയാളത്തിൽ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ വിശ്വാസവും നീതിയും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള പൗലോസിന്റെ വാചകം
  choice: “അബ്രാഹാമിന്റെ വിശ്വാസം അദ്ദേഹത്തിനു നീതിയായി കണക്കാക്കപ്പെട്ടു.”
  alternative: “അബ്രാഹാമിന്റെ വിശ്വാസം അദ്ദേഹത്തിനു നീതിക്കായി കണക്കാക്കപ്പെട്ടു.”
  rationale: εἰς δικαιοσύνην എന്നതിനെ ‘നീതിയായി’ എന്നു നൽകുന്നത് ഉദ്ധരണിയുടെ കണക്കാക്കൽഭാഷ സംരക്ഷിക്കുന്നു; അതിനെ ഒരു പ്രത്യേക സിദ്ധാന്തവ്യവസ്ഥയായി വികസിപ്പിക്കാതെ വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ആദ്യ ചോദ്യത്തിലെ ἐπίയുടെ പരിധിഭാവം ‘മാത്രമാണോ ... കൂടിയാണോ’ എന്ന സ്വാഭാവിക വിരോധത്തിലൂടെ വ്യക്തമാക്കി. മൂലത്തിലെ γάρ നിലനിർത്താൻ ‘കാരണം’ ഉപയോഗിച്ചു.
