reference: Romans 4:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: ml
  text: കാരണം, അബ്രാഹാം പ്രവൃത്തികളുടെ അടിസ്ഥാനത്തിലാണ് നീതീകരിക്കപ്പെട്ടതെങ്കിൽ[a], അവന് അഭിമാനിക്കാൻ വകയുണ്ട്[b]—എന്നാൽ ദൈവത്തിന്റെ മുമ്പാകെയല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നീതിമാനായി പ്രഖ്യാപിക്കപ്പെട്ടതെങ്കിൽ.”'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “അവന് അഭിമാനിക്കാൻ കാരണമുണ്ട്.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: കാരണം, ... എങ്കിൽ
  rationale: γάρ മുൻവാദവുമായി കാരണാത്മക ബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘കാരണം’ എന്നും, εἰ നിബന്ധന അവതരിപ്പിക്കുന്നതിനാൽ ‘എങ്കിൽ’ എന്നും നൽകി; നിബന്ധന യാഥാർഥ്യമാണോ സങ്കൽപ്പമാണോ എന്ന് അധികമായി നിർണയിച്ചില്ല.
- source_word: Ἀβραὰμ
  choice: അബ്രാഹാം
  rationale: മലയാള ബൈബിൾ പാരമ്പര്യത്തിലും പൊതുവ്യവഹാരത്തിലും സ്ഥാപിതമായ പേരുരൂപം.
- source_word: ἐξ ἔργων
  choice: പ്രവൃത്തികളുടെ അടിസ്ഥാനത്തിൽ
  rationale: ἐκ ഇവിടെ ഉറവിടം/അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. ‘പ്രവൃത്തികളാൽ’ എന്നതിനെക്കാൾ ഈ രൂപം നീതീകരണത്തിന്റെ അടിസ്ഥാനത്തെ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: ἐδικαιώθη
  choice: നീതീകരിക്കപ്പെട്ടു
  rationale: δικαιόω എന്ന പൗലോസീയ പദത്തിന്റെ ന്യായവിധിസംബന്ധമായ അർഥവും ദൈവശാസ്ത്രപരമായ പദബന്ധവും നിലനിർത്തുന്നു; ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെട്ടു’ എന്ന സാധുവായ വിശദീകരണരൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: ἔχει καύχημα
  choice: അവന് അഭിമാനിക്കാൻ വകയുണ്ട്
  rationale: καύχημα എന്ന നാമത്തിന്റെ ‘അഭിമാനിക്കാനുള്ള കാരണം/അടിസ്ഥാനം’ എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: എന്നാൽ ദൈവത്തിന്റെ മുമ്പാകെയല്ല
  rationale: πρὸς θεόν ഇവിടെ ദൈവസന്നിധിയിലെ വിലയിരുത്തലിനെ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിന്റെ മുമ്പാകെ’ എന്നത് സംക്ഷിപ്തവും മാന്യവും സന്ദർഭോചിതവുമാണ്.
theological_decisions:
- issue: നിബന്ധന യാഥാർഥ്യമോ സങ്കൽപ്പമോ എന്നത്
  choice: ‘നീതീകരിക്കപ്പെട്ടതെങ്കിൽ’ എന്ന് നേരിട്ട് വിവർത്തനം ചെയ്തു.
  alternative: ‘നീതീകരിക്കപ്പെട്ടിരുന്നെങ്കിൽ’ അല്ലെങ്കിൽ ‘വാസ്തവത്തിൽ നീതീകരിക്കപ്പെട്ടതെങ്കിൽ’
  rationale: ഗ്രീക്ക് നിബന്ധനയുടെ വാദാത്മക തുറന്ന നില സംരക്ഷിച്ചു; പ്രവൃത്തികളാൽ നീതീകരണം അസാധ്യമാണെന്ന പൗലോസിന്റെ തുടർനിഗമനം ഈ വാക്യത്തിന്റെ രൂപത്തിൽ മുൻകൂട്ടി ചേർത്തില്ല.
- issue: ἐδικαιώθη എന്നതിന്റെ വിവർത്തനം
  choice: ‘നീതീകരിക്കപ്പെട്ടു’
  alternative: ‘നീതിമാനായി പ്രഖ്യാപിക്കപ്പെട്ടു’
  rationale: പ്രധാന പാഠത്തിൽ പൗലോസിന്റെ സാങ്കേതികവും ന്യായവിധിസംബന്ധവുമായ പദം സംക്ഷിപ്തമായി നിലനിർത്തി; പ്രഖ്യാപനാത്മക അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പൗലോസിന്റെ സംക്ഷിപ്ത വാദശൈലി നിലനിർത്തിക്കൊണ്ട്, ‘പ്രവൃത്തികളുടെ അടിസ്ഥാനത്തിൽ’ എന്ന പ്രയോഗം ആശയബന്ധം വ്യക്തമായി നൽകുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ പ്രധാന പാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
