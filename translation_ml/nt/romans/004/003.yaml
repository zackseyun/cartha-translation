id: ROM.4.3
reference: Romans 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: ml
  text: തിരുവെഴുത്ത് എന്താണു പറയുന്നത്? “അബ്രാഹാം ദൈവത്തെ വിശ്വസിച്ചു; അത് അവന് നീതിയായി കണക്കാക്കപ്പെട്ടു[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന് നീതിയായി വകവെക്കപ്പെട്ടു” അല്ലെങ്കിൽ “അവന്റെ കണക്കിൽ നീതിയായി ചേർക്കപ്പെട്ടു.”
    reason: lexical_alternative
  - marker: b
    text: ‘നീതിയായി’ എന്നതിന് ‘ന്യായമായി’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: തിരുവെഴുത്ത്
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് ഏതെങ്കിലും സാധാരണ എഴുത്തിനെയല്ല, വിശുദ്ധ ലിഖിതത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘തിരുവെഴുത്ത്’ ആ അർഥം സ്വാഭാവികമായും വ്യക്തമായും നൽകുന്നു.
- source_word: Ἐπίστευσεν
  choice: വിശ്വസിച്ചു
  rationale: πιστεύω എന്ന ക്രിയയുടെ അയോറിസ്റ്റ് രൂപത്തെ നേരിട്ടും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു; വ്യാഖ്യാനപരമായ വികസനം ഒഴിവാക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തെ
  rationale: πιστεύω-യോടൊപ്പമുള്ള ദത്തിവ് ഇവിടെ ദൈവം പറഞ്ഞത് അബ്രാഹാം സത്യമെന്നു വിശ്വസിച്ചു എന്ന ആശയം നൽകുന്നു. ‘ദൈവത്തിൽ വിശ്വസിച്ചു’ എന്നതിനെക്കാൾ ഗ്രീക്ക് ഘടനയോട് അടുത്തതാണ് ‘ദൈവത്തെ വിശ്വസിച്ചു’.
- source_word: ἐλογίσθη
  choice: കണക്കാക്കപ്പെട്ടു
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം നിലനിർത്തുകയും λογίζομαι എന്നതിന്റെ കണക്കിടുക/വകവെക്കുക എന്ന ആശയം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς δικαιοσύνην
  choice: നീതിയായി
  rationale: ഇവിടത്തെ εἰς എന്ന ഘടനയുടെ ഫലപരമായ അർഥവും δικαιοσύνη എന്ന പദത്തിന്റെ പൗലോസീയ വ്യാപ്തിയും ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
theological_decisions:
- issue: നീതീകരണസന്ദർഭത്തിൽ δικαιοσύνη എന്നതിന്റെ പരിഭാഷ
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ എന്നത് വ്യക്തിയുടെ നേരായ നിലയെയും ദൈവത്തിന്റെ നീതിപൂർവമായ വിധിയെയും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ പൗലോസീയ സന്ദർഭത്തിന് യോജിക്കുന്നു. ‘ന്യായം’ എന്ന സാധുവായ പദാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഉദ്ധരണിയുടെ കർമണിഘടനയും ‘അത്’ എന്ന സർവനാമത്തിലൂടെ ഗ്രീക്കിലെ വ്യാകരണപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചിട്ടുണ്ട്.
