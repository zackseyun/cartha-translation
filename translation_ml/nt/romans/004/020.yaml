id: ROM.4.20
reference: Romans 4:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: ml
  text: എന്നിട്ടും, ദൈവത്തിന്റെ വാഗ്ദാനത്തെക്കുറിച്ച് അവൻ അവിശ്വാസത്താൽ ചാഞ്ചാടിയില്ല[a]; മറിച്ച് വിശ്വാസത്തിൽ[b] ശക്തിപ്പെട്ട് ദൈവത്തിന് മഹത്ത്വം നൽകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “അവിശ്വാസം നിമിത്തം സംശയിച്ചില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “വിശ്വാസത്താൽ ശക്തിപ്പെട്ട്.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: എന്നിട്ടും, ദൈവത്തിന്റെ വാഗ്ദാനത്തെക്കുറിച്ച്
  rationale: εἰς എന്നതിന്റെ ഇവിടെ ഉള്ള വിഷയസംബന്ധിയായ അർഥം ‘...യെക്കുറിച്ച്’ എന്നു സ്വാഭാവികമായി നൽകുന്നു; δέ മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്നിട്ടും’ എന്നു വിവർത്തനം ചെയ്തു.
- source_word: οὐ διεκρίθη
  choice: ചാഞ്ചാടിയില്ല
  rationale: διακρίνω ഇവിടെ കേവലമായ ബൗദ്ധിക സംശയത്തേക്കാൾ ഉള്ളിലെ അസ്ഥിരതയെയും മടിച്ചുനിൽപ്പിനെയും സൂചിപ്പിക്കുന്നു; ‘ചാഞ്ചാടിയില്ല’ ഈ അർഥവും തുടർന്നുള്ള ശക്തിപ്പെടലുമായുള്ള വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: τῇ ἀπιστίᾳ
  choice: അവിശ്വാസത്താൽ
  rationale: ദാതിവ് ഇവിടെ കാരണം, ഉപാധി, അല്ലെങ്കിൽ അനുബന്ധാവസ്ഥ എന്നിങ്ങനെ ഗ്രഹിക്കാവുന്നതാണ്. സ്വാഭാവിക മലയാളത്തിനായി ‘അവിശ്വാസത്താൽ’ സ്വീകരിച്ചു; വ്യത്യസ്തമായ അർഥസാധ്യത പ്രധാന പാഠത്തിലെ ക്രിയയോടനുബന്ധിച്ച അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐνεδυναμώθη
  choice: ശക്തിപ്പെട്ട്
  rationale: ഗ്രീക്കിലെ പാസീവ് ആശയം നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ വാക്യപ്രവാഹത്തിന് അനുയോജ്യമായി ബന്ധക്രിയാരൂപം ഉപയോഗിച്ചു; ശക്തിയുടെ കർത്താവ് ആരെന്നത് പാഠം പറയുന്നതിലധികം വ്യക്തമാക്കിയിട്ടില്ല.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: അവിശ്വാസത്തോടുള്ള പൗലോസിന്റെ വൈരുധ്യം നിലനിർത്താൻ സ്ഥിതി/മേഖല സൂചിപ്പിക്കുന്ന ‘വിശ്വാസത്തിൽ’ സ്വീകരിച്ചു; ഉപാധിസൂചനയായ ‘വിശ്വാസത്താൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: ദൈവത്തിന് മഹത്ത്വം നൽകി
  rationale: ഗ്രീക്കിലെ അനുബന്ധ പങ്കാളിത്തക്രിയ മലയാളത്തിൽ മുഖ്യവാക്യത്തിന്റെ സ്വാഭാവിക സമാപനമായി നൽകി; ദൈവത്തെ മഹത്ത്വപ്പെടുത്തുക എന്ന അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: അബ്രാഹാമിന്റെ പ്രതികരണം കേവലമായ ബൗദ്ധിക സംശയമായോ വിശാലമായ വിശ്വാസചാഞ്ചാട്ടമായോ അവതരിപ്പിക്കണമോ
  choice: അവിശ്വാസത്താൽ ചാഞ്ചാടിയില്ല
  alternative: അവിശ്വാസം നിമിത്തം സംശയിച്ചില്ല
  rationale: സന്ദർഭത്തിൽ διεκρίθη ഉള്ളിലെ വിഭജിതാവസ്ഥയെയും മടിച്ചുനിൽപ്പിനെയും ഉൾക്കൊള്ളുന്നു. അതിനെ ‘ചാഞ്ചാടിയില്ല’ എന്നു നൽകുന്നത് അർഥപരിധി ചുരുക്കാതെ വിശ്വാസത്തിൽ ശക്തിപ്പെട്ടതുമായുള്ള വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- issue: വിശ്വാസം ശക്തിപ്പെടലിന്റെ മേഖലയാണോ ഉപാധിയാണോ
  choice: വിശ്വാസത്തിൽ ശക്തിപ്പെട്ട്
  alternative: വിശ്വാസത്താൽ ശക്തിപ്പെട്ട്
  rationale: τῇ πίστει എന്ന ദാതിവിന് രണ്ടുവിധ വായനയും സാധ്യമാണ്. പ്രധാന പാഠത്തിൽ അവിശ്വാസം/വിശ്വാസം എന്ന സമാന്തര വൈരുധ്യം മുൻനിർത്തി ‘വിശ്വാസത്തിൽ’ സ്വീകരിക്കുകയും ഉപാധിസൂചന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വാഗ്ദാനം’, ‘വിശ്വാസം’, ‘അവിശ്വാസം’, ‘മഹത്ത്വം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയെങ്കിലും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാന പാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
