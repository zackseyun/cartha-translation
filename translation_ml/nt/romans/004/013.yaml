id: ROM.4.13
reference: Romans 4:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: ml
  text: അബ്രാഹാമിനോ അവന്റെ സന്തതിക്കോ[a] അവൻ ലോകത്തിന്റെ അവകാശിയായിരിക്കുമെന്ന വാഗ്ദാനം ന്യായപ്രമാണത്തിലൂടെയല്ല, വിശ്വാസത്തിന്റെ[d] നീതിയിലൂടെയാണ്[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “വിത്ത്.” ഗ്രീക്കുപദം ഏകവചനമാണെങ്കിലും “സന്തതി” അല്ലെങ്കിൽ “പിൻതലമുറക്കാർ” എന്ന സമൂഹവാചക അർഥത്തിൽ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “വിശ്വാസത്താലുള്ള നീതിയിലൂടെ” അല്ലെങ്കിൽ “വിശ്വാസത്തിൽനിന്നു വരുന്ന നീതിയിലൂടെ.”
    reason: alternative_reading
  - marker: c
    text: “നീതി” എന്നതിന് ചില പൗലോസീയ സന്ദർഭങ്ങളിൽ “ന്യായം” എന്നും പരിഭാഷ നൽകാം.
    reason: lexical_alternative
  - marker: d
    text: “വിശ്വാസം” എന്നതിന് സന്ദർഭമനുസരിച്ച് “വിശ്വസ്തത” അല്ലെങ്കിൽ “ആശ്രയം” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: വാഗ്ദാനം
  rationale: ദൈവിക വാഗ്ദാനം എന്ന പൗലോസിന്റെ സാധാരണ അർഥം സ്വാഭാവികവും വ്യക്തവുമായി നൽകുന്നു.
- source_word: σπέρματι
  choice: സന്തതി
  rationale: ഗ്രീക്കിൽ ഏകവചനമായിരിക്കുമ്പോഴും സമൂഹവാചകമായി പ്രവർത്തിക്കാവുന്ന പദത്തിന്റെ ഏകവചന-സമൂഹവാചക സ്വഭാവം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κληρονόμον ... κόσμου
  choice: ലോകത്തിന്റെ അവകാശി
  rationale: κληρονόμος എന്ന അവകാശഭാഷയും κόσμος എന്ന പദത്തിന്റെ വിശാലമായ വ്യാപ്തിയും ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: διὰ νόμου
  choice: ന്യായപ്രമാണത്തിലൂടെ
  rationale: പൗലോസിന്റെ വാദസന്ദർഭത്തിൽ മോശെയുടെ ന്യായപ്രമാണത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും διὰയുടെ മാർഗാർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ബന്ധപരവും ന്യായവിധിസംബന്ധവുമായ അർഥവ്യാപ്തി ഉൾക്കൊള്ളുന്ന, മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതമായ പദം.
- source_word: πίστεως
  choice: വിശ്വാസം
  rationale: ഇവിടെ ന്യായപ്രമാണത്തോടു വിരുദ്ധമായി നിൽക്കുന്ന πίστις എന്ന പദത്തിന്റെ ഏറ്റവും സ്വാഭാവികമായ അർഥം; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: വിശ്വാസത്തിന്റെ നീതിയിലൂടെ
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ഷഷ്ഠീവ്യാകരണബന്ധം വ്യാഖ്യാനിച്ച് തീർക്കാതെ, മലയാളത്തിൽ ഗ്രഹിക്കാവുന്ന ഔപചാരിക ഘടനയായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: δικαιοσύνης πίστεως എന്നതിലെ ബന്ധം
  choice: വിശ്വാസത്തിന്റെ നീതിയിലൂടെ
  alternative: വിശ്വാസത്താലുള്ള നീതിയിലൂടെ; വിശ്വാസത്തിൽനിന്നു വരുന്ന നീതിയിലൂടെ
  rationale: ന്യായപ്രമാണവും വിശ്വാസവും തമ്മിലുള്ള പൗലോസിന്റെ വൈരുധ്യം വ്യക്തമാകുന്നു; എന്നാൽ ഷഷ്ഠീവ്യാകരണബന്ധം കൃത്യമായി എങ്ങനെ വികസിപ്പിക്കണമെന്നത് മൂലപാഠം തുറന്നുവെക്കുന്നതിനാൽ മുഖ്യപാഠം അതിനെ തീർപ്പാക്കുന്നില്ല.
- issue: αὐτόν എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: അവൻ
  alternative: അബ്രാഹാം; സന്തതി
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചന സർവനാമത്തിന്റെ രൂപം നിലനിർത്തുകയും അത് ആരെ സൂചിപ്പിക്കുന്നു എന്നതിനെ മുഖ്യപാഠത്തിൽ അധികമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. “ന്യായപ്രമാണം,” “അവകാശി,” “നീതി” എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തുമ്പോഴും വാക്യഘടന സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതാക്കി. മൂലത്തിലെ സംക്ഷിപ്തതയും സർവനാമ-ഷഷ്ഠീവ്യാകരണ അവ്യക്തതകളും അനാവശ്യമായി പരിഹരിച്ചിട്ടില്ല.
