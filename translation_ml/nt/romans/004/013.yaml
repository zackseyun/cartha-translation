  naturalness: The register and core terminology are natural modern standard Malayalam. Recasting the clause so that “വാഗ്ദാനം” is the grammatical subject is both more idiomatic and closer to the Greek.
  terminology: “സന്തതി,” “ലോകത്തിന്റെ അവകാശി,” “ന്യായപ്രമാണം,” “നീതി,” and “വിശ്വാസം” are suitable. “വിശ്വാസത്തിന്റെ നീതിയിലൂടെ” appropriately preserves the compact, potentially debated genitival relation without doctrinally resolving it.
  issues:
