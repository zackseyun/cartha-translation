    issue: “വാഗ്ദാനം ലഭിച്ചത്” adds a reception event not expressed by the Greek.
    rationale: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία ... ἀλλὰ διὰ δικαιοσύνης πίστεως contrasts the promise’s relation to law and righteousness of faith. It does not say that Abraham or his offspring ‘received’ the promise through either means.
