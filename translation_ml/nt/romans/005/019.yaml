id: ROM.5.19
reference: Romans 5:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: ml
  text: കാരണം, ഒരൊറ്റ മനുഷ്യന്റെ അനുസരണക്കേടിലൂടെ അനേകർ പാപികളാക്കപ്പെട്ടതുപോലെ[a], ഒരൊറ്റ മനുഷ്യന്റെ[b] അനുസരണത്തിലൂടെ അനേകർ നീതിമാന്മാരാക്കപ്പെടും[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപികളായി നിയമിക്കപ്പെട്ടു.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ, ‘ആ ഒരുവന്റെ അനുസരണത്തിലൂടെ’; ആദ്യ ഉപവാക്യത്തിൽനിന്ന് വ്യക്തമായതിനാൽ ‘മനുഷ്യൻ’ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നീതിമാന്മാരായി നിയമിക്കപ്പെടും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: അനുസരണക്കേട്
  rationale: അനുസരിക്കാതിരിക്കലിനെ നേരിട്ട് സൂചിപ്പിക്കുകയും ὑπακοήയുമായുള്ള ആദാം–ക്രിസ്തു വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ഒരൊറ്റ മനുഷ്യന്റെ
  rationale: ലേഖനവും ഏകവചനസംഖ്യയും നൽകുന്ന തിരിച്ചറിയൽസ്വഭാവവും പ്രതിനിധിപരമായ ഒരേയൊരു മനുഷ്യനെക്കുറിച്ചുള്ള ഊന്നലും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἁμαρτωλοὶ
  choice: പാപികൾ
  rationale: ഇവിടെ വിശേഷണം നാമപദസമാനമായി പ്രയോഗിക്കപ്പെട്ടതിനാൽ ‘പാപികൾ’ എന്നത് വ്യക്തവും പതിവുമായ പരിഭാഷയാണ്.
- source_word: κατεστάθησαν
  choice: പാപികളാക്കപ്പെട്ടു
  rationale: ഒരു നിലയിലേക്കോ പദവിയിലേക്കോ കൊണ്ടുവരപ്പെട്ടു എന്ന καθίστημι എന്ന ക്രിയയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; കൂടുതൽ സാങ്കേതികമായ വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: οἱ πολλοί
  choice: അനേകർ
  rationale: ഗ്രീക്കിലെ നിർദിഷ്ടമായ ബഹുസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പ്രയോഗം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; അതിനെ വ്യാഖ്യാനപരമായി ‘എല്ലാവരും’ എന്നു മാറ്റുന്നില്ല.
- source_word: ὑπακοῆς
  choice: അനുസരണം
  rationale: παρακοήയുടെ നേരിട്ടുള്ള ആശയവിപരീതം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: τοῦ ἑνὸς
  choice: ഒരൊറ്റ മനുഷ്യന്റെ
  rationale: രണ്ടാം ഉപവാക്യത്തിൽ ἀνθρώπου ആവർത്തിച്ചിട്ടില്ലെങ്കിലും ആദ്യ ഉപവാക്യത്തിൽനിന്ന് അത് വ്യക്തമായി അധ്യാഹരിക്കപ്പെടുന്നു; സമാന്തരഘടന വ്യക്തമാക്കാൻ മലയാളത്തിൽ ‘മനുഷ്യൻ’ ചേർത്തിരിക്കുന്നു.
- source_word: δίκαιοι
  choice: നീതിമാന്മാർ
  rationale: പൗലോസിന്റെ δικ- പദസമൂഹത്തോടുള്ള ബന്ധം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി ഗ്രഹിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: κατασταθήσονται
  choice: നീതിമാന്മാരാക്കപ്പെടും
  rationale: ആദ്യ ഉപവാക്യത്തിലെ κατεστάθησαν എന്ന ക്രിയയോടുള്ള ഭാവികാല നിഷ്ക്രിയ സമാന്തരത നിലനിർത്തുന്നു; ‘നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടും’ എന്ന കൂടുതൽ വ്യാഖ്യാനപരമായ പരിഭാഷ ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: οἱ πολλοί എന്നതിന്റെ വ്യാപ്തി
  choice: അനേകർ
  alternative: എല്ലാവരും; അനേകം ആളുകൾ
  rationale: മൂലപാഠത്തിലെ οἱ πολλοί എന്ന പ്രയോഗം വ്യാഖ്യാനപരമായി ‘എല്ലാവരും’ എന്നു വിപുലീകരിക്കാതെ അതിന്റെ യഥാർഥ രൂപവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: κατασταθήσονται δίκαιοι എന്നത് നില/പദവി സൂചിപ്പിക്കുന്ന ഭാഷയിലോ ന്യായവിധിപരമായ പ്രഖ്യാപനഭാഷയിലോ പരിഭാഷപ്പെടുത്തുക
  choice: നീതിമാന്മാരാക്കപ്പെടും
  alternative: നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെടും; നീതിമാന്മാരായി സ്ഥാപിക്കപ്പെടും
  rationale: ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്നത് δικαιόω അല്ല, καθίστημι + δίκαιοι ആണ്. അതിനാൽ ഒരു പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം അടിച്ചേൽപ്പിക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷയോട് ചേർന്നുനിൽക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരൊറ്റ’ എന്ന രൂപം രണ്ട് പ്രതിനിധിമനുഷ്യർക്കിടയിലെ സമാന്തരത വ്യക്തമാക്കുന്നു. ‘പാപികളാക്കപ്പെട്ടു / നീതിമാന്മാരാക്കപ്പെടും’ എന്ന സമാന്തര നിഷ്ക്രിയഘടന ഗ്രീക്കിലെ കാല-വാച്യവ്യത്യാസം സംരക്ഷിക്കുന്നു.
