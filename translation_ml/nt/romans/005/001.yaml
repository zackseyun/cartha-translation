id: ROM.5.1
reference: Romans 5:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: ml
  text: അതുകൊണ്ട്, വിശ്വാസത്താൽ[b] നീതീകരിക്കപ്പെട്ടവരായ നമുക്ക് നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ[c] ദൈവവുമായി സമാധാനമുണ്ട്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ചില കൈയെഴുത്തുപ്രതികളിൽ: “നമുക്ക് ദൈവവുമായി സമാധാനം പുലർത്താം.”'
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ, “വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ.”
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്ക് ക്രിസ്റ്റോസ്—“മശീഹ”; പരമ്പരാഗതമായി “ക്രിസ്തു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: നീതീകരിക്കപ്പെട്ടവരായ
  rationale: δικαιόω എന്ന ക്രിയയുടെ ഭൂതകാല നിഷ്ക്രിയ കൃദന്തരൂപമാണിത്. പൗലോസിന്റെ പ്രയോഗത്തിലെ നിയമപരവും ബന്ധപരവുമായ അർഥവ്യാപ്തി അനാവശ്യമായി ചുരുക്കാതെ ‘നീതീകരിക്കപ്പെട്ട’ എന്നു നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്താൽ
  rationale: ἐκ എന്നതിന്റെ അക്ഷരാർഥം ‘നിന്ന്’ എന്നാണെങ്കിലും ഈ പൗലോസീയ പ്രയോഗത്തിൽ ‘വിശ്വാസത്താൽ’ എന്നത് സ്വാഭാവികവും അർഥസമുചിതവുമാണ്; ‘വിശ്വാസത്തിന്റെ അടിസ്ഥാനത്തിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: εἰρήνην
  choice: സമാധാനം
  rationale: ദൈവവുമായുള്ള പുനഃസ്ഥാപിതബന്ധം ഉൾക്കൊള്ളുന്ന പദത്തിന്റെ വിശാലത സംരക്ഷിക്കുന്നു; ‘അനുരഞ്ജനം’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കുന്നില്ല.
- source_word: ἔχομεν
  choice: നമുക്ക് … ഉണ്ട്
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ സൂചകഭാവമായ ἔχομεν പിന്തുടരുന്നു. ആഹ്വാനഭാവത്തിലുള്ള ἔχωμεν എന്ന പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: πρὸς τὸν θεὸν
  choice: ദൈവവുമായി
  rationale: ‘സമാധാനം’ എന്ന നാമത്തോടൊപ്പം ബന്ധപരമായ അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ ആദരസൂചകവും പുതുനിയമപരവുമായ സാധാരണ മലയാളരൂപം.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി പ്രവർത്തിക്കുന്നു; അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിക്കുകയും പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ദൈവശാസ്ത്രത്തിൽ δικαιωθέντες എന്നതിന്റെ അർഥം
  choice: ‘നീതീകരിക്കപ്പെട്ടവരായ’ എന്നു വിവർത്തനം ചെയ്തു; കൂടുതൽ വിപുലമായ സിദ്ധാന്തവാക്യമായി വ്യാഖ്യാനിച്ചില്ല.
  alternative: ‘നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെട്ടവരായ’ അല്ലെങ്കിൽ ‘നീതിമാന്മാരാക്കപ്പെട്ടവരായ’
  rationale: ദൈവത്തിന്റെ നീതീകരണപ്രവൃത്തിയുടെ ഫലമാണ് വാക്യം പറയുന്നത്; അതിന്റെ മുഴുവൻ രീതി ഇവിടെ നിർവചിക്കുന്നില്ല. അതിനാൽ ദൈവശാസ്ത്രപരമായ സംഘർഷവും അർഥവ്യാപ്തിയും തുറന്നുവെക്കുന്നു.
- issue: ‘ദൈവവുമായി സമാധാനം’ എന്നതിന്റെ സ്വഭാവം
  choice: ബന്ധപരമായ സമാധാനം എന്ന നിലയിൽ ലളിതമായി ‘ദൈവവുമായി സമാധാനം’ എന്നു നൽകി.
  alternative: ദൈവം നൽകുന്ന ആന്തരിക മനഃശാന്തി; അല്ലെങ്കിൽ വ്യക്തമായി ‘ദൈവവുമായി അനുരഞ്ജനം’
  rationale: സന്ദർഭം ദൈവവുമായുള്ള പുനഃസ്ഥാപിതബന്ധത്തെ പ്രധാനമായി സൂചിപ്പിക്കുന്നു; എങ്കിലും ഗ്രീക്ക് പദം ‘സമാധാനം’ തന്നെയാണ്. അതിനാൽ കൂടുതൽ വ്യാഖ്യാനാത്മകമായ പദം മുഖ്യപാഠത്തിൽ ചേർത്തില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ കൃദന്തരൂപവും നിഗമനബന്ധവും നിലനിർത്തിക്കൊണ്ട് മലയാളവാക്യഘടന വായനാസൗകര്യത്തിന് ക്രമപ്പെടുത്തി. പാഠഭേദവും പ്രധാന പദവികല്പങ്ങളും അടിക്കുറിപ്പുകളിൽ സംരക്ഷിച്ചു.
