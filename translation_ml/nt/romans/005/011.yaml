id: ROM.5.11
reference: Romans 5:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: ml
  text: അതുമാത്രമല്ല, നമ്മുടെ കർത്താവായ[b] യേശു മശീഹയിലൂടെ[c] നാം ദൈവത്തിൽ അഭിമാനിക്കുകയും[a] ചെയ്യുന്നു. അവനിലൂടെ നമുക്ക് ഇപ്പോൾ ആ അനുരഞ്ജനം[d] ലഭിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദൈവത്തിൽ ആനന്ദിക്കുകയും’ അല്ലെങ്കിൽ ‘ദൈവത്തെക്കുറിച്ച് പ്രശംസിക്കുകയും’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കർത്താവ്’ എന്നതിന് ചില സന്ദർഭങ്ങളിൽ ‘യജമാനൻ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: 'ഗ്രീക്ക്: ക്രിസ്റ്റോസ്; പരമ്പരാഗതമായി ‘ക്രിസ്തു’.'
    reason: alternative_reading
  - marker: d
    text: ‘അനുരഞ്ജനം’ എന്നും, ‘ആ’ ചേർക്കാതെയും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: അഭിമാനിക്കുകയും
  rationale: καυχάομαι എന്ന പദത്തിന്റെ ‘അഭിമാനിക്കുക/പ്രശംസിക്കുക’ എന്ന മുഖ്യഭാവം നേരിട്ട് നിലനിർത്തുന്നു. ഇവിടെ അഭിമാനത്തിന്റെ ആധാരവും വിഷയവും ദൈവമായതിനാൽ സ്വയംപുകഴ്ത്തൽ എന്ന പ്രതികൂലാർഥം സന്ദർഭം ഒഴിവാക്കുന്നു.
- source_word: ἐν τῷ θεῷ
  choice: ദൈവത്തിൽ
  rationale: ἐν സഹിതമുള്ള ദത്തിവ് ഇവിടെ അഭിമാനത്തിന്റെ ആധാരത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കുന്നു; ‘ദൈവത്തിൽ’ എന്ന പ്രയോഗം ഗ്രീക്കിന്റെ രൂപവും പൗലോസിന്റെ ദൈവകേന്ദ്രിതമായ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: κυρίου
  choice: കർത്താവായ
  rationale: പുതിയനിയമത്തിലെ ക്രിസ്തുശാസ്ത്രപരമായ κύριος എന്ന അഭിസംബോധനയ്ക്ക് സ്വാഭാവികവും പ്രചാരത്തിലുള്ളതുമായ മലയാളരൂപം.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ വാഗ്ദത്ത രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; ‘മശീഹ’ ആ പദവിയുടെ അർഥം സുതാര്യമാക്കുന്നു.
- source_word: καταλλαγὴν
  choice: ആ അനുരഞ്ജനം
  rationale: καταλλαγή ശത്രുത മാറി ബന്ധം പുനഃസ്ഥാപിക്കപ്പെടുന്നതിനെ സൂചിപ്പിക്കുന്നു. ഗ്രീക്കിലെ നിർദ്ദിഷ്ടോപപദവും മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പ്രത്യേക അനുരഞ്ജനത്തിലേക്കുള്ള സൂചനയും ‘ആ’ എന്നതിലൂടെ നിലനിർത്തുന്നു.
- source_word: ἐλάβομεν
  choice: പ്രാപിച്ചത്
  rationale: λαμβάνω എന്നതിന്റെ സ്വീകരിക്കൽ/ലഭിക്കൽ ഭാവം നൽകുന്നു; νῦν സഹിതം ക്രിസ്തുവിലൂടെ ഇതിനകം ലഭിച്ച ഇപ്പോഴത്തെ യാഥാർഥ്യം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός വെറും പേരിന്റെ ഭാഗമെന്നതിലുപരി പദവിയായി പ്രവർത്തിക്കുന്നു. അതിനാൽ അതിന്റെ മശീഹാസംബന്ധിയായ അർഥം വായനക്കാരന് വ്യക്തമാക്കുന്ന രൂപം സ്വീകരിച്ചു.
- issue: ἐν τῷ θεῷ എന്നതിലെ അഭിമാനത്തിന്റെ സ്വഭാവം
  choice: ദൈവത്തിൽ അഭിമാനിക്കുന്നു
  alternative: ദൈവത്തിൽ ആനന്ദിക്കുന്നു
  rationale: പൗലോസിന്റെ καυχάομαι എന്ന പ്രയോഗത്തിലെ ധൈര്യപൂർവമായ പ്രശംസ/അഭിമാനഭാവം നിലനിർത്തുന്നു; അതിനെ വെറും വികാരപരമായ സന്തോഷമായി ചുരുക്കുന്നില്ല.
- issue: τὴν καταλλαγὴν എന്നതിലെ നിർദ്ദിഷ്ടത
  choice: ആ അനുരഞ്ജനം
  alternative: അനുരഞ്ജനം
  rationale: നിർദ്ദിഷ്ടോപപദം മുൻവാക്യങ്ങളിൽ വിവരിച്ച ദൈവിക അനുരഞ്ജനത്തിലേക്ക് തിരിച്ചുചൂണ്ടുന്നു; എങ്കിലും മലയാളത്തിൽ നിർദ്ദിഷ്ടത പറയാതെ വിടുന്നതും സാധ്യമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘അഭിമാനിക്കുക’ എന്നത് ഉറവിടപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു; വാക്യസന്ദർഭം അത് അഹങ്കാരമല്ല, ദൈവകേന്ദ്രിതമായ പ്രശംസയാണെന്ന് വ്യക്തമാക്കുന്നു. ‘അവനിലൂടെയാണല്ലോ’ എന്ന രൂപം δι’ οὗ എന്ന ബന്ധവും വാക്യത്തിന്റെ വിശദീകരണഭാവവും സ്വാഭാവികമായി കൈമാറുന്നു.
