revisions:
- from: അതുമാത്രമല്ല, നമ്മുടെ കർത്താവായ[b] യേശു മശീഹയിലൂടെ[c] നാം ദൈവത്തിൽ അഭിമാനിക്കുകയും[a] ചെയ്യുന്നു. അവനിലൂടെയാണല്ലോ നാം ഇപ്പോൾ ആ അനുരഞ്ജനം[d] പ്രാപിച്ചത്.
  to: അതുമാത്രമല്ല, നമ്മുടെ കർത്താവായ[b] യേശു മശീഹയിലൂടെ[c] നാം ദൈവത്തിൽ അഭിമാനിക്കുകയും[a] ചെയ്യുന്നു. അവനിലൂടെ നമുക്ക് ഇപ്പോൾ ആ അനുരഞ്ജനം[d] ലഭിച്ചിരിക്കുന്നു.
  rationale: വാക്യത്തിന്റെ അടിസ്ഥാന വിവർത്തനതീരുമാനങ്ങൾ നിലനിർത്തി, അവസാനവാക്യത്തെ മാത്രം ആധുനിക മലയാളത്തിൽ കൂടുതൽ സ്വാഭാവികമാക്കി. ഇതിലൂടെ ‘ഇപ്പോൾ സ്വീകരിച്ചിരിക്കുന്നു’ എന്ന ഗ്രീക്ക് ആശയവും δι’ οὗ (‘അവനിലൂടെ’) എന്ന ബന്ധവും വ്യക്തമായി നിലനിൽക്കുന്നു. എല്ലാ കുറിപ്പു-അടയാളങ്ങളും അവയുടെ പദങ്ങളോടു ബന്ധിപ്പിച്ചുതന്നെ സൂക്ഷിച്ചിട്ടുണ്ട്.
