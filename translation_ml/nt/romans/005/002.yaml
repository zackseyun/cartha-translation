source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: ml
  text: അവൻ മുഖാന്തരം, വിശ്വാസത്താൽ, നാം നിലകൊള്ളുന്ന ഈ കൃപയിലേക്കുള്ള പ്രവേശനവും നമുക്കു ലഭിച്ചിരിക്കുന്നു; ദൈവത്തിന്റെ മഹത്ത്വത്തെക്കുറിച്ചുള്ള പ്രത്യാശയിൽ നാം അഭിമാനിക്കുകയും ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സന്തോഷിക്കുന്നു” അല്ലെങ്കിൽ “ആനന്ദിക്കുന്നു.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: പ്രവേശനം
  rationale: ദൈവകൃപയുടെ നിലയിലേക്കു കൊണ്ടുവരപ്പെട്ടതിനെ സൂചിപ്പിക്കുന്നതിനാൽ ‘പ്രവേശനം’ സ്വാഭാവികവും മൂലപദത്തിന്റെ ആശയത്തോട് അടുത്തതുമാണ്.
- source_word: πίστει
  choice: വിശ്വാസത്താൽ
  rationale: കരണാർഥത്തിലുള്ള ദാതിവിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: χάριν
  choice: കൃപ
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ ദൈവം സൗജന്യമായി നൽകുന്ന അനുഗ്രഹപൂർണമായ നിലയെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും യോജിച്ചതുമായ പദമാണ്.
- source_word: ἑστήκαμεν
  choice: നാം നിലകൊള്ളുന്ന
  rationale: മുൻപ് സംഭവിച്ച പ്രവൃത്തിയുടെ ഫലമായി ഇപ്പോഴും തുടരുന്ന അവസ്ഥ എന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ഭാവം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: καυχώμεθα
  choice: നാം അഭിമാനിക്കുന്നു
  rationale: പൗലോസ് ഉദ്ദേശിക്കുന്ന ആത്മവിശ്വാസപൂർണമായ പ്രശംസയുടെ അല്പം ഞെട്ടിക്കുന്ന ശക്തി നിലനിർത്തുന്നു; ‘സന്തോഷിക്കുന്നു’ എന്നതിനെക്കാൾ മൂലപദബന്ധം വ്യക്തമാണ്.
- source_word: ἐπ’ ἐλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: അഭിമാനത്തിന്റെ അടിസ്ഥാനമോ മണ്ഡലമോ പ്രത്യാശയാണെന്ന തുറന്ന ഭാവം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: δόξης τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വം
  rationale: ജനിറ്റീവ് ഘടനയെ സുതാര്യമായും ഗൗരവമുള്ള ഭാഷാശൈലിയിലും നൽകുന്നു.
theological_decisions:
- issue: καυχώμεθα എന്ന പദത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം
  choice: നാം അഭിമാനിക്കുന്നു
  alternative: നാം സന്തോഷിക്കുന്നു / ആനന്ദിക്കുന്നു
  rationale: ‘അഭിമാനിക്കുന്നു’ എന്നത് പൗലോസിന്റെ മനഃപൂർവമായ വാക്ശക്തിയും സമീപപ്രയോഗങ്ങളുമായുള്ള പദബന്ധവും സംരക്ഷിക്കുന്നു. കൂടുതൽ മൃദുവായ പദം ആ സംഘർഷം കുറയ്ക്കും.
- issue: δόξης τοῦ θεοῦ എന്നതോടുള്ള പ്രത്യാശയുടെ ബന്ധം
  choice: ദൈവത്തിന്റെ മഹത്ത്വം പ്രാപിക്കുമെന്ന പ്രത്യാശ
  alternative: ദൈവത്തിന്റെ മഹത്ത്വത്തെക്കുറിച്ചുള്ള പ്രത്യാശ
  rationale: എന്തിനെയാണ് പ്രത്യാശിക്കുന്നത് എന്നത് മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘പ്രാപിക്കുമെന്ന’ ചേർത്തു; വിശ്വാസികൾ മഹത്ത്വത്തിൽ പങ്കുചേരുന്ന ഭാവം ഇതിൽ സാധ്യമാണ്, എന്നാൽ ഗ്രീക്കിലെ ജനിറ്റീവിന്റെ എല്ലാ സാധ്യതകളും പൂർണമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവൻ മുഖാന്തരം’ മുൻവാക്യത്തിലെ യേശുക്രിസ്തുവിലേക്കുള്ള ബന്ധം നിലനിർത്തുന്നു. പ്രധാനപദങ്ങളായ കൃപ, വിശ്വാസം, മഹത്ത്വം എന്നിവ സാധാരണ വായനക്കാർക്കു പരിചിതമായ ബൈബിൾ പദാവലിയിൽ സൂക്ഷിച്ചു.
