  terminology: “വിശ്വാസത്താൽ,” “കൃപ,” and “നിലകൊള്ളുന്ന” are suitable established terms. “അഭിമാനിക്കുന്നു” appropriately retains the rhetorical force of καυχώμεθα; the lexical-alternative footnote is correctly anchored to that expression.
  issues:
