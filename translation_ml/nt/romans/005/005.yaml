id: ROM.5.5
reference: Romans 5:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: ml
  text: എന്നാൽ പ്രത്യാശ നമ്മെ ലജ്ജിതരാക്കുന്നില്ല[a]. കാരണം, നമുക്കു നൽകപ്പെട്ട പരിശുദ്ധാത്മാവിലൂടെ ദൈവത്തിന്റെ സ്നേഹം[b] നമ്മുടെ ഹൃദയങ്ങളിൽ ചൊരിയപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിരാശപ്പെടുത്തുന്നില്ല.”
    reason: lexical_alternative
  - marker: b
    text: വ്യാകരണപരമായി “നമുക്ക് ദൈവത്തോടുള്ള സ്നേഹം” എന്നും മനസ്സിലാക്കാം; എന്നാൽ സന്ദർഭത്തിൽ അതിന് സാധ്യത കുറവാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: പ്രത്യാശ
  rationale: പുതിയനിയമസന്ദർഭത്തിൽ പ്രതീക്ഷയോടൊപ്പം ഉറച്ച ആശ്രയവും സൂചിപ്പിക്കുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളപദം.
- source_word: δέ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഗ്രീക്കിൽ ഇത് ലഘുവായ ബന്ധകമാണ്; മുൻവാക്യത്തോടുള്ള ബന്ധം മലയാളത്തിലെ വാക്യപ്രവാഹത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു. ‘എന്നാൽ’ എന്നു ചേർത്താൽ ആവശ്യത്തിലധികം വൈരുധ്യം തോന്നാം.
- source_word: καταισχύνει
  choice: നമ്മെ ലജ്ജിതരാക്കുന്നില്ല
  rationale: ക്രിയയുടെ ലജ്ജ/അപമാന അർത്ഥം നിലനിർത്തുന്നു; മലയാളത്തിൽ ആവശ്യമായ കർമമായി സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ‘നമ്മെ’ ചേർത്തിരിക്കുന്നു.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സ്നേഹം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തി ഘടനയെ അടുത്തായി നിലനിർത്തുന്നു; സന്ദർഭം പ്രധാനമായി ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹത്തെ പിന്തുണയ്ക്കുമ്പോഴും മറ്റൊരു വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐκκέχυται
  choice: ചൊരിയപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാലത്തിന്റെ—കഴിഞ്ഞ പ്രവൃത്തിയും ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലവും—ഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: നമ്മുടെ ഹൃദയങ്ങളിൽ
  rationale: മൂലത്തിലെ രൂപകവും ബഹുവചനവും നേരിട്ട് നിലനിർത്തുന്ന സ്വാഭാവിക പരിഭാഷ.
- source_word: διὰ πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിലൂടെ
  rationale: διά + genitive ഇവിടെ മാധ്യമം/കരണം സൂചിപ്പിക്കുന്നു; അതിനാൽ ‘-ലൂടെ’ യോജിക്കുന്നു.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: നമുക്കു നൽകപ്പെട്ട
  rationale: പരിശുദ്ധാത്മാവിനെ വിശേഷിപ്പിക്കുന്ന ഗ്രീക്ക് കൃുദന്തരൂപം മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ എന്നതിലെ genitive-ന്റെ അർത്ഥം
  choice: ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹം എന്ന പ്രധാന വായനയോടെ ‘ദൈവത്തിന്റെ സ്നേഹം’
  alternative: നമുക്ക് ദൈവത്തോടുള്ള സ്നേഹം
  rationale: പരിശുദ്ധാത്മാവിലൂടെ അത് ഹൃദയങ്ങളിൽ ചൊരിയപ്പെട്ടിരിക്കുന്നു എന്ന തുടർവാക്യം ദൈവത്തിന്റെ സ്നേഹമാണ് പ്രധാന അർത്ഥമെന്നതിനെ ശക്തമായി പിന്തുണയ്ക്കുന്നു. എങ്കിലും വ്യാകരണപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- issue: καταισχύνει എന്ന ക്രിയയിലെ ലജ്ജയും നിരാശയും തമ്മിലുള്ള ഭാവം
  choice: ലജ്ജിതരാക്കുന്നില്ല
  alternative: നിരാശപ്പെടുത്തുന്നില്ല
  rationale: മൂലക്രിയയുടെ ലജ്ജാ-അപമാന ഭാവം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭോചിതമായ ‘നിരാശപ്പെടുത്തുന്നില്ല’ എന്ന അർത്ഥം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായിരിക്കത്തക്കവിധം സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ നിലനിൽക്കുന്ന ഫലം ‘ചൊരിയപ്പെട്ടിരിക്കുന്നു’ എന്ന രൂപത്തിൽ സൂക്ഷിച്ചു; അനാവശ്യമായ സഭാവിഭാഗ-സവിശേഷ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
