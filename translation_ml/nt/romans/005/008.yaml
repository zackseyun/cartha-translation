id: ROM.5.8
reference: Romans 5:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: ml
  text: എന്നാൽ, നാം ഇനിയും പാപികളായിരിക്കുമ്പോൾത്തന്നെ, മശീഹ[b] നമുക്കുവേണ്ടി[c] മരിച്ചു എന്നതിലൂടെ ദൈവം നമ്മോടുള്ള[a] തന്റെ സ്വന്തം സ്നേഹം പ്രകടമാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘നമ്മിലേക്കുള്ള’.'
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘ക്രിസ്തോസ്’; പരമ്പരാഗതമായി ‘ക്രിസ്തു’. ഇവിടെ ഒരു പദവിയായി ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അല്ലെങ്കിൽ: ‘നമ്മുടെ നിമിത്തം’. ‘നമ്മുടെ സ്ഥാനത്ത്’ എന്ന ആശയവുമായി ഈ പദപ്രയോഗത്തെ ബന്ധപ്പെടുത്തി മനസ്സിലാക്കാറുണ്ട്; എന്നാൽ ഇവിടെ ഗ്രീക്ക് അതിനെ മാത്രം നിർബന്ധിക്കുന്നില്ല.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: συνίστησιν
  choice: പ്രകടമാക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയ സൂചിപ്പിക്കുന്ന സജീവമായ വെളിപ്പെടുത്തലും തെളിവായി കാട്ടലും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻചിന്തയോടുള്ള മൃദുവായ വൈരുധ്യവും വാദത്തിലെ തിരിവും നിലനിർത്തുന്നു.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: തന്റെ സ്വന്തം സ്നേഹം
  rationale: ἑαυτοῦ നൽകുന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ സൂക്ഷിക്കുന്നു.
- source_word: εἰς ἡμᾶς
  choice: നമ്മോടുള്ള
  rationale: സ്നേഹം നമ്മിലേക്കു ദിശപ്പെടുത്തിയിരിക്കുന്നതിനെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘നമുക്കുവേണ്ടിയുള്ള’ എന്ന ഗുണഭോക്തൃഭാവം അനാവശ്യമായി മുൻകൂട്ടി ചേർക്കുന്നില്ല.
- source_word: ὅτι
  choice: എന്നതിലൂടെ
  rationale: ദൈവം തന്റെ സ്നേഹം എങ്ങനെ പ്രകടമാക്കുന്നു എന്ന വിശദീകരണബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: നാം ഇനിയും പാപികളായിരിക്കുമ്പോൾത്തന്നെ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ടിന്റെ കാലികവും വിട്ടുവീഴ്ചാത്മകവുമായ ശക്തിയും ἔτιയുടെ ഊന്നലും നിലനിർത്തുന്നു.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു ക്രിസ്തുശാസ്ത്രപരമായ പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർത്ഥം പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: നമ്മുടെ പ്രയോജനത്തിനും പക്ഷത്തുമായി സംഭവിച്ച മരണം എന്ന വിശാലമായ അർത്ഥം നൽകുന്നു; ‘നമ്മുടെ സ്ഥാനത്ത്’ എന്ന കൂടുതൽ നിർദിഷ്ടമായ പ്രായശ്ചിത്തവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: ലളിതമായ ഏറിസ്റ്റ് ക്രിയയുടെ നേരിട്ടുള്ള സ്വാഭാവിക പരിഭാഷ.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിൽ Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: സന്ദർഭത്തിൽ ഇത് വെറും പേരുപോലെ മാത്രമല്ല, അഭിഷിക്തനായവൻ എന്ന പദവിയായും പ്രവർത്തിക്കുന്നു; അതിനാൽ പദവിയുടെ അർത്ഥം നിലനിർത്തി ‘മശീഹ’ എന്നു നൽകി.
- issue: ὑπὲρ ἡμῶν എന്നതിന്റെ പ്രായശ്ചിത്തസംബന്ധമായ വ്യാപ്തി
  choice: നമുക്കുവേണ്ടി
  alternative: നമ്മുടെ സ്ഥാനത്ത്
  rationale: ഗ്രീക്ക് പ്രയോഗം പ്രതിനിധിത്വം, പ്രയോജനം, പകരംവഹിക്കൽ തുടങ്ങിയ ചർച്ചകൾക്ക് ഇട നൽകുന്നു. ഈ വാക്യം ആവശ്യപ്പെടുന്നതിലധികം നിർദിഷ്ടമാക്കാതെ വിശാലതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ മുഖ്യ ഊന്നലായ ‘ഇനിയും പാപികളായിരിക്കുമ്പോൾത്തന്നെ’ എന്ന വിരോധാഭാസം മുന്നിൽ നിലനിർത്തി. ‘മശീഹ’ എന്ന പദവി ഉപയോഗിക്കുകയും ὑπέρ എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി പ്രധാനവാചകത്തിൽ ചുരുക്കാതിരിക്കുകയും ചെയ്തു.
