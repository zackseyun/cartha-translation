id: ROM.5.21
reference: Romans 5:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: ml
  text: അങ്ങനെതന്നെ, പാപം മരണത്തിൽ രാജ്യം വാണതുപോലെ, കൃപയും നീതിയിലൂടെ നിത്യജീവനിലേക്കു നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ രാജ്യം വാഴേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: അങ്ങനെ … വാഴേണ്ടതിന്
  rationale: മുൻവാക്യവുമായി ബന്ധിപ്പിക്കുന്ന ഉദ്ദേശ്യ/ഫലസൂചനയും തുടർന്നുള്ള ഗ്രീക്ക് വിധിസാധ്യതാരൂപത്തിന്റെ ഭാവവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: രാജ്യം വാണു / രാജ്യം വാഴേണ്ടതിന്
  rationale: പാപത്തെയും കൃപയെയും രാജാക്കന്മാരെപ്പോലെ ചിത്രീകരിക്കുന്ന പൗലോസിന്റെ രൂപകം നിലനിർത്തുന്നു; ആദ്യത്തേത് സംഭവവിവരണമായും രണ്ടാമത്തേത് ἵνα നിയന്ത്രിക്കുന്ന ഉദ്ദേശ്യ/ഫലരൂപമായും വേർതിരിക്കുന്നു.
- source_word: ἐν τῷ θανάτῳ
  choice: മരണത്തിൽ
  rationale: ἐν സൂചിപ്പിക്കുന്ന മണ്ഡലാർഥം ചുരുക്കമായും വ്യാഖ്യാനഭാരം കൂട്ടാതെയും സംരക്ഷിക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: പാപത്തോടു വിരുദ്ധമായി വ്യക്തിവൽക്കരിക്കപ്പെട്ടിരിക്കുന്ന പൗലോസിന്റെ മുഖ്യപദത്തിന് സ്വാഭാവികവും സ്ഥിരവുമായ മലയാളരൂപം.
- source_word: διὰ δικαιοσύνης
  choice: നീതിയിലൂടെ
  rationale: διάയുടെ ഉപാധിസൂചനയും δικαιοσύνηയുടെ നീതി/നീതിമത്തത എന്ന അർഥവ്യാപ്തിയും മലയാളത്തിലെ ‘നീതി’ സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: εἰς ζωὴν αἰώνιον
  choice: നിത്യജീവനിലേക്ക്
  rationale: εἰς എന്നതിന്റെ ലക്ഷ്യദിശയും ζωὴ αἰώνιος എന്ന പ്രയോഗത്തിന്റെ പൂർണ അർഥഭാരവും വ്യക്തമാക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ
  rationale: Χριστός എന്നത് ഇവിടെ പദവിയായി വ്യക്തമാക്കാൻ ‘മശീഹ’ ഉപയോഗിക്കുകയും τοῦ κυρίου ἡμῶν എന്ന വിശേഷണം യേശുവിനോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: δικαιοσύνηയുടെ അർഥവ്യാപ്തി
  choice: നീതി
  alternative: നീതിമത്തത
  rationale: ‘നീതി’ ദൈവികമായ ശരിത്തനവും ന്യായവും ഉൾക്കൊള്ളാൻ കഴിയുന്നതിനാൽ പദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു; ‘നീതിമത്തത’ മാത്രം ഉപയോഗിച്ചാൽ ന്യായത്തിന്റെ വശം മങ്ങിയേക്കാം.
- issue: Χριστός പദവിയോ പേരിന്റെ ഭാഗമോ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ പ്രയോഗത്തിൽ അഭിഷിക്തനായവൻ എന്ന പദവിയുടെ അർഥം സുതാര്യമാക്കുന്നു; പരിചിതമായ ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: ἐν τῷ θανάτῳ എന്നതിലെ ബന്ധം
  choice: മരണത്തിൽ
  alternative: മരണത്തിലൂടെ
  rationale: ἐν എന്നതിന്റെ പ്രാഥമിക മണ്ഡലാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഉപാധിയെന്ന വായന സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘രാജ്യം വാഴുക’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ രാജകീയ രൂപകവും പാപം–കൃപ സമാന്തരഘടനയും നിലനിർത്തുന്നു.
