  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: ml
  text: ആകയാൽ, ഇപ്പോൾ അവന്റെ രക്തത്താൽ[b] നീതീകരിക്കപ്പെട്ട[a] നാം, എത്രയോ അധികം അവൻ മുഖാന്തരം ക്രോധത്തിൽനിന്ന്[c] രക്ഷിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെട്ട.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അവന്റെ രക്തം മുഖാന്തരം.”
    reason: lexical_alternative
  - marker: c
    text: സന്ദർഭം സൂചിപ്പിക്കുന്നത് ദൈവിക ക്രോധമാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: ആകയാൽ ... എത്രയോ അധികം ഉറപ്പാണ്
  rationale: οὖν സൂചിപ്പിക്കുന്ന നിഗമനബന്ധം ‘ആകയാൽ’ നിലനിർത്തുന്നു. πολλῷ ... μᾶλλον എന്ന ശക്തിപ്പെടുത്തിയ താരതമ്യം മലയാളത്തിൽ തെറ്റായി ‘കൂടുതൽ അളവിൽ രക്ഷിക്കപ്പെടുക’ എന്ന് ധരിക്കപ്പെടാതിരിക്കാൻ, മുൻവാക്യത്തിൽനിന്നുള്ള എത്രയോ ശക്തമായ നിഗമനമായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: δικαιωθέντες
  choice: നീതീകരിക്കപ്പെട്ട
  rationale: ഭാവികാലത്തിലെ മുഖ്യക്രിയയ്ക്കു മുമ്പേ പൂർത്തിയായ ദൈവിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന ഭൂതകാല നിഷ്ക്രിയ പങ്കാളിക്രിയയുടെ ബലം നിലനിർത്തുന്നു; പൗലോസിന്റെ δικαιόω പദസമൂഹത്തോടുള്ള പദസുസ്ഥിരതയും കാക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: നീതീകരണത്തിന്റെ ഫലമായ നിലവിലെ അവസ്ഥയെ സൂചിപ്പിക്കുന്ന കാലവാചകം നേരിട്ട് പകർന്നു നൽകുന്നു.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: അവന്റെ രക്തത്താൽ
  rationale: ἐν ഇവിടെ മാർഗമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നതായി മലയാളത്തിലെ കരണമർത്ഥകമായ ‘-ത്താൽ’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; ബലിമരണസൂചന വിശദീകരിച്ച് കൂട്ടിച്ചേർക്കുന്നില്ല.
- source_word: σωθησόμεθα
  choice: നാം ... രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല നിഷ്ക്രിയരൂപം നിലനിർത്തി, ഇനിയും പൂർത്തിയാകാനുള്ള രക്ഷയെ സൂചിപ്പിക്കുന്നു.
- source_word: δι’ αὐτοῦ
  choice: അവൻ മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമമോ പ്രവർത്തകത്വമോ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: ക്രോധത്തിൽനിന്ന്
  rationale: ἀπό സൂചിപ്പിക്കുന്ന വിടുതൽ നിലനിർത്തുന്നു. മൂലപാഠത്തിൽ ‘ദൈവത്തിന്റെ’ എന്നത് തുറന്നുപറയാത്തതിനാൽ അത് മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
theological_decisions:
- issue: δικαιωθέντες എന്ന പദത്തിലെ നീതീകരണഭാഷയുടെ സ്വഭാവം
  choice: മുഖ്യപാഠത്തിൽ ‘നീതീകരിക്കപ്പെട്ട’ നിലനിർത്തുന്നു
  alternative: ‘നീതിമാന്മാരായി പ്രഖ്യാപിക്കപ്പെട്ട’
  rationale: പൗലോസിന്റെ പ്രധാന പദസമൂഹത്തോടുള്ള ബന്ധം നിലനിർത്തുകയും നീതീകരണം എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്നതിനെക്കുറിച്ചുള്ള ഒരു പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വിശദീകരണം മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: τῆς ὀργῆς എന്നതിന്റെ സൂചിത കർത്താവ്
  choice: ‘ക്രോധം’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തുന്നു
  alternative: ‘ദൈവത്തിന്റെ ക്രോധം’
  rationale: സന്ദർഭം ദൈവിക ക്രോധത്തെയാണ് ശക്തമായി സൂചിപ്പിക്കുന്നത്; എങ്കിലും θεοῦ എന്ന പദം ഗ്രീക്കിൽ ഇല്ലാത്തതിനാൽ ആ വിപുലീകരണം മുഖ്യപാഠത്തിലല്ല, അടിക്കുറിപ്പിലാണ് നൽകുന്നത്.
- issue: πολλῷ ... μᾶλλον എന്ന താരതമ്യത്തിന്റെ അർത്ഥം
  choice: രക്ഷയുടെ അളവല്ല, നിഗമനത്തിന്റെ ശക്തിയാണ് വ്യക്തമാക്കുന്നത്
  alternative: ‘എത്രയോ അധികമായി രക്ഷിക്കപ്പെടും’
  rationale: പൗലോസ് കുറഞ്ഞതിൽനിന്ന് കൂടുതലിലേക്കുള്ള വാദമാണ് ഉന്നയിക്കുന്നത്. ‘അധികമായി രക്ഷിക്കപ്പെടും’ എന്ന അക്ഷരാനുകരണം മലയാളത്തിൽ രക്ഷയ്ക്ക് അളവുകളുണ്ടെന്ന അനാവശ്യ വ്യാഖ്യാനം സൃഷ്ടിക്കാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നീതീകരിക്കപ്പെട്ട’, ‘ക്രോധം’ എന്നീ ദൈവശാസ്ത്രപരമായി പ്രാധാന്യമുള്ള പദങ്ങൾ വിശദീകരണപരമായ പരാവർത്തനം കൂടാതെ നിലനിർത്തി; വാക്യത്തിന്റെ a fortiori നിഗമനം സാധാരണ വായനക്കാർക്ക് തെറ്റിദ്ധാരണയില്ലാത്ത വിധം സ്വാഭാവികമാക്കി.
