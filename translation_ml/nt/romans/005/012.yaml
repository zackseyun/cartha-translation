id: ROM.5.12
reference: Romans 5:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: ml
  text: അതുകൊണ്ട്, ഒരു മനുഷ്യനിലൂടെ പാപം ലോകത്തിൽ പ്രവേശിക്കുകയും പാപത്തിലൂടെ മരണം വരുകയും ചെയ്തതുപോലെ, എല്ലാവരും പാപം ചെയ്തതിനാൽ[a] മരണം എല്ലാ മനുഷ്യരിലേക്കും വ്യാപിച്ചു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, കൂടുതൽ പരമ്പരാഗതമായി: “അവനിൽ എല്ലാവരും പാപം ചെയ്തു.”'
    reason: ἐφ’ ᾧ എന്നതിന്റെ പ്രതിനിധിത്വപരമായ മറ്റൊരു വായന സംരക്ഷിക്കാൻ.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനപരമായ മാറ്റം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: ഒരു മനുഷ്യനിലൂടെ
  rationale: ജനിതകവിഭക്തിയോടുകൂടിയ διά-യുടെ മധ്യമം/ഉപകരണം എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ആദാം എന്ന പുരുഷപ്രതിനിധിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἡ ἁμαρτία
  choice: പാപം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച പതിവുപദം; മൂലപാഠത്തിലില്ലാത്ത വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: ലോകത്തിൽ പ്രവേശിച്ചു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശാഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: പാപത്തിലൂടെ മരണം വരുകയും
  rationale: ഒരു മനുഷ്യനിലൂടെ പാപം, പാപത്തിലൂടെ മരണം എന്ന സമാന്തരഘടന നിലനിർത്തുന്നു; ഗ്രീക്കിൽ രണ്ടാമത്തെ ക്രിയ സൂചിതമായിരിക്കുന്നതിനാൽ മലയാളവാക്യത്തിൽ സ്വാഭാവികമായി ‘വരുക’ ചേർക്കുന്നു.
- source_word: οὕτως
  choice: ചെയ്തതുപോലെ
  rationale: ὥσπερ…οὕτως എന്ന താരതമ്യഘടന മലയാളത്തിൽ ഏകീകൃതമായി അവതരിപ്പിക്കുന്നു.
- source_word: εἰς πάντας ἀνθρώπους
  choice: എല്ലാ മനുഷ്യരിലേക്കും
  rationale: പുരുഷന്മാരെ മാത്രം അല്ല, മുഴുവൻ മനുഷ്യരെയും ഉൾക്കൊള്ളുന്ന പൊതുവായ അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὁ θάνατος διῆλθεν
  choice: മരണം … വ്യാപിച്ചു
  rationale: മരണം മനുഷ്യവർഗമൊട്ടാകെ എത്തിച്ചേർന്നതിന്റെ വ്യാപ്തി διέρχομαι ഇവിടെ സൂചിപ്പിക്കുന്നതിനാൽ ‘വ്യാപിച്ചു’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: ἐφ’ ᾧ
  choice: ചെയ്തതിനാൽ
  rationale: സന്ദർഭത്തിൽ കാരണാർഥം ഏറ്റവും സ്വാഭാവികമായി നൽകുന്നു; പ്രതിനിധിത്വപരമായ പരമ്പരാഗത വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: πάντες ἥμαρτον
  choice: എല്ലാവരും പാപം ചെയ്തു
  rationale: ഗ്രീക്ക് aorist-നെ വേറൊരു കാല-വീക്ഷണം ഇറക്കുമതി ചെയ്യാതെ ഭൂതകാലപ്രയോഗമായി നൽകുന്നു.
theological_decisions:
- issue: ἐφ’ ᾧ πάντες ἥμαρτον എന്നതിന്റെ അർഥം
  choice: 'കാരണാർഥം: ‘എല്ലാവരും പാപം ചെയ്തതിനാൽ’'
  alternative: 'പ്രതിനിധിത്വപരമായ/ഉൾക്കൊള്ളുന്ന അർഥം: ‘അവനിൽ എല്ലാവരും പാപം ചെയ്തു’'
  rationale: ഗ്രീക്ക് ഘടന സന്ദർഭത്തിൽ കാരണാർഥത്തെ സ്വാഭാവികമായി പിന്തുണയ്ക്കുന്നു. എന്നാൽ ആദാമും മനുഷ്യരാശിയും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള പ്രധാന ദൈവശാസ്ത്രപരമായ ചർച്ച ഇതിൽ ഉൾപ്പെട്ടതിനാൽ പരമ്പരാഗതമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. വാക്യം അടുത്ത വാക്യങ്ങളിൽ പൂർത്തിയാകുന്ന ഗ്രീക്ക് താരതമ്യഘടനയായതിനാൽ അവസാനത്തിലെ ദീർഘരേഖ നിലനിർത്തിയിരിക്കുന്നു.
