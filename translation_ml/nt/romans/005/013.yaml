revisions:
- from: കാരണം, ന്യായപ്രമാണം വരുന്നതുവരെ പാപം ലോകത്തിൽ ഉണ്ടായിരുന്നു; എന്നാൽ ന്യായപ്രമാണം ഇല്ലാത്തിടത്ത് പാപം കണക്കിൽപ്പെടുത്തപ്പെടുന്നില്ല.[a]
