id: ROM.5.13
reference: Romans 5:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: ml
  text: കാരണം, ന്യായപ്രമാണം വരുന്നതുവരെ പാപം ലോകത്തിൽ ഉണ്ടായിരുന്നു; എന്നാൽ ന്യായപ്രമാണം ഇല്ലാത്തിടത്ത് പാപം കണക്കാക്കപ്പെടുന്നില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ഒരാളുടെ കണക്കിൽ ചേർക്കപ്പെടുന്നില്ല” അല്ലെങ്കിൽ “ആരോപിക്കപ്പെടുന്നില്ല.”
    reason: ἐλλογεῖται എന്ന ക്രിയയുടെ കണക്കുപുസ്തകപരമായ ‘ഒരാളുടെ കണക്കിൽ ചാർത്തുക’ എന്ന അർഥവും, അതിൽനിന്ന് വരുന്ന ആരോപണപരമായ അർഥസാധ്യതയും വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: കാരണം, ന്യായപ്രമാണം വരുന്നതുവരെ
  rationale: ἄχρι νόμου സൂചിപ്പിക്കുന്ന, ന്യായപ്രമാണം നൽകപ്പെടുന്നതിലേക്കു നീളുന്ന കാലപരിധി സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; γάρ-ന്റെ വിശദീകരണബന്ധം ‘കാരണം’ നിലനിർത്തുന്നു.
- source_word: νόμου
  choice: ന്യായപ്രമാണം
  rationale: റോമർ 5-ലെ ആദാംമുതൽ മോശവരെയുള്ള സന്ദർഭത്തിൽ മോശൈക ന്യായപ്രമാണമാണ് പ്രധാന സൂചന; എന്നാൽ ‘മോശയുടെ’ എന്ന് മൂലത്തിൽ ഇല്ലാത്തത് ചേർത്തിട്ടില്ല.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: പൗലോസിന്റെ ഏകവചന അമൂർത്തപ്രയോഗവും അതിനുണ്ടാകാവുന്ന വ്യക്തിവൽക്കരണഭാവവും അധികവ്യാഖ്യാനം കൂടാതെ നിലനിർത്തുന്നു.
- source_word: ἐν κόσμῳ
  choice: ലോകത്തിൽ
  rationale: മനുഷ്യലോകത്തിൽ പാപം സന്നിഹിതമായിരുന്നു എന്ന ലളിതവും സ്വാഭാവികവുമായ അർഥം നൽകുന്നു.
- source_word: ἐλλογεῖται
  choice: കണക്കിൽപ്പെടുത്തപ്പെടുന്നില്ല
  rationale: ക്രിയയിലെ കണക്കുപുസ്തക/അക്കൗണ്ടിംഗ് ഭാവം നിലനിർത്തുകയും ‘ചുമത്തപ്പെടുക’, ‘ആരോപിക്കപ്പെടുക’ തുടങ്ങിയ കൂടുതൽ വ്യാഖ്യാനഭാരമുള്ള പദങ്ങൾ മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ ὄντος νόμου
  choice: ന്യായപ്രമാണം ഇല്ലാത്തിടത്ത്
  rationale: ന്യായപ്രമാണത്തിന്റെ അഭാവം പ്രസ്താവനയുടെ വ്യവസ്ഥയായി വരുന്ന genitive absolute സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഇത് സ്ഥലം മാത്രമല്ല, സാഹചര്യം സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്.
theological_decisions:
- issue: νόμος എന്നതിന്റെ സന്ദർഭപരമായ സൂചന
  choice: ‘ന്യായപ്രമാണം’ എന്നു പരിഭാഷപ്പെടുത്തി; മോശൈക ന്യായപ്രമാണത്തെ സന്ദർഭം സൂചിപ്പിക്കാൻ അനുവദിച്ചു.
  alternative: പൊതുവായ അർഥത്തിൽ ‘നിയമം’ എന്നു പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ ‘മോശയുടെ ന്യായപ്രമാണം’ എന്നു വ്യക്തമാക്കുക.
  rationale: റോമർ 5:14-ലെ ‘ആദാംമുതൽ മോശവരെ’ എന്ന കാലപരിധി മോശൈക ന്യായപ്രമാണത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എങ്കിലും ഗ്രീക്കിൽ ‘മോശയുടെ’ എന്നു നേരിട്ട് ഇല്ലാത്തതിനാൽ അത് വാചകത്തിൽ ചേർത്തിട്ടില്ല.
- issue: ἐλλογεῖται എന്നതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം
  choice: മുഖ്യവാചകത്തിൽ ‘കണക്കിൽപ്പെടുത്തപ്പെടുന്നില്ല’ ഉപയോഗിച്ചു.
  alternative: ‘ഒരാളുടെ കണക്കിൽ ചുമത്തപ്പെടുന്നില്ല’ അല്ലെങ്കിൽ ‘ആരോപിക്കപ്പെടുന്നില്ല’.
  rationale: കണക്കിൽ ചാർത്തുക എന്ന അടിസ്ഥാനരൂപകം സംരക്ഷിക്കുമ്പോഴും പാപാരോപണം സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തപരമായ നിഗമനം പരിഭാഷയിൽ നിർബന്ധിക്കുന്നില്ല; ശക്തമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത ബൈബിൾപദം സന്ദർഭപരമായ കൃത്യതയ്ക്കായി നിലനിർത്തി; ‘കണക്കിൽപ്പെടുത്തപ്പെടുന്നു’ എന്ന പദം അക്കൗണ്ടിംഗ് രൂപകവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
