  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: ml
  text: ലംഘനം[b] പെരുകേണ്ടതിന് ന്യായപ്രമാണം അതോടൊപ്പം കടന്നുവന്നു[a]; എന്നാൽ പാപം പെരുകിയിടത്ത് കൃപ[c] അതിലുമേറെ കവിഞ്ഞൊഴുകി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘കടന്നുവന്നു’; ഗ്രീക്ക് പദം മറ്റൊന്നിനോടൊപ്പം അഥവാ അധികമായി പ്രവേശിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ലംഘനം’ എന്നതിന് ‘അതിക്രമം’ അഥവാ ‘കുറ്റം’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘കൃപ അത്യധികം പെരുകി.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ മോശെയുടെ ന്യായപ്രമാണമാണ് ഏറ്റവും സ്വാഭാവികമായ സൂചന; മലയാള ബൈബിൾഭാഷയിൽ പരിചിതവും വ്യക്തവുമായ പദം.
- source_word: παρεισῆλθεν
  choice: അതോടൊപ്പം കടന്നുവന്നു
  rationale: വെറും ‘വന്നു’ എന്നതിലുപരി, മറ്റൊന്നിനോടൊപ്പം അഥവാ അധികമായി പ്രവേശിച്ചു എന്ന παρά-യുടെ സൂക്ഷ്മത നിലനിർത്തുന്നു.
- source_word: ἵνα πλεονάσῃ
  choice: പെരുകേണ്ടതിന്
  rationale: ἵνα സഹിതമുള്ള subjunctive-ന്റെ ഉദ്ദേശ്യാർഥം സംരക്ഷിക്കുന്നു; ദൈവം പാപത്തെ അംഗീകരിക്കുന്നു എന്ന വിശദീകരണം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: τὸ παράπτωμα
  choice: ലംഘനം
  rationale: ഒരു നിർദിഷ്ട അതിക്രമമോ വീഴ്ചയോ സൂചിപ്പിക്കുന്ന παράπτωμα എന്ന പദത്തിന് സ്വാഭാവികവും സന്ദർഭോചിതവുമായ മലയാളം.
- source_word: οὗ
  choice: പെരുകിയിടത്ത്
  rationale: സ്ഥലസംബന്ധിയായ ‘where’ എന്ന ബന്ധം സ്വാഭാവിക മലയാള ഘടനയിൽ നൽകുന്നു.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: ἁμαρτίαയുടെ പതിവും വ്യക്തവുമായ പൗലോസീയ വിവർത്തനം.
- source_word: ὑπερεπερίσσευσεν
  choice: അതിലുമേറെ കവിഞ്ഞൊഴുകി
  rationale: സാധാരണ പെരുക്കത്തേക്കാൾ അതിവിപുലമായ സമൃദ്ധിയെ സൂചിപ്പിക്കുന്ന ഇരട്ട തീവ്രത മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: χάρις എന്ന ദൈവശാസ്ത്രപദത്തിന്റെ സ്ഥാപിതവും സാധാരണ വായനക്കാർക്ക് പരിചിതവുമായ മലയാളം.
theological_decisions:
- issue: ന്യായപ്രമാണം വന്നതിന്റെ ഫലം/ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയുടെ ദൈവശാസ്ത്രപരമായ സംഘർഷം
  choice: ‘ലംഘനം പെരുകേണ്ടതിന്’ എന്ന ഉദ്ദേശ്യാർഥമുള്ള ഘടന
  alternative: ‘ലംഘനം പെരുകിയതിന്റെ ഫലമായി’ അഥവാ ‘ലംഘനം പെരുകുകയും ചെയ്തു’
  rationale: ഗ്രീക്ക് വാക്യഘടനയിലെ ഉദ്ദേശ്യബലം മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു; പാപത്തോടുള്ള ദൈവിക അംഗീകാരം എന്ന നിഗമനം വാചകത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം’, ‘കൃപ’ എന്നീ സ്ഥാപിത ദൈവശാസ്ത്രപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, ക്രിയകൾ സ്വാഭാവികമായ സമകാലിക ഭാഷയിൽ നൽകി.
