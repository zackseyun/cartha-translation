id: ROM.5.7
reference: Romans 5:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: ml
  text: നീതിമാനുവേണ്ടി ഒരാൾ മരിക്കുക അപൂർവമാണ്[a]; എന്നാൽ നല്ലവനുവേണ്ടി ഒരുപക്ഷേ ആരെങ്കിലും പോലും മരിക്കാൻ തുനിഞ്ഞേക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “നീതിമാൻ” എന്നും “നല്ലവൻ” എന്നും ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്കുപദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം ഉദ്ദേശപൂർവമായിരിക്കാം. രണ്ടും വ്യാകരണപരമായി പുല്ലിംഗരൂപങ്ങളാണെങ്കിലും പൊതുവായി ഏതൊരു വ്യക്തിയെയും സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: അപൂർവമാണ്
  rationale: ഇവിടെ ഒരു പ്രവൃത്തി വളരെ വിരളമായേ സംഭവിക്കൂ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘വളരെ പ്രയാസത്തോടെ’ എന്ന രീതിയിലുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ὑπὲρ
  choice: വേണ്ടി
  rationale: ഒരാളുടെ നന്മയ്ക്കായോ അയാളെ പ്രതിനിധീകരിച്ചോ മരിക്കുന്നതിന്റെ ആശയം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δικαίου
  choice: നീതിമാൻ
  rationale: നീതിയാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്ന substantival adjective-ന്റെ അർഥം നിലനിർത്തുന്നു. മലയാളത്തിൽ ഇത് വ്യാകരണപരമായി പുരുഷലിംഗരൂപമായതിനാൽ പൊതുവായ വ്യക്തിയെയും സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀποθανεῖται
  choice: മരിക്കുക
  rationale: ഗ്രീക്കിലെ ഭാവികാലം പൊതുസത്യസദൃശമായ പ്രസ്താവനയിൽ മലയാളത്തിൽ ക്രിയാനാമരൂപവും ‘അപൂർവമാണ്’ എന്ന വിധേയവും ചേർത്ത് സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: τοῦ ἀγαθοῦ
  choice: നല്ലവനായ ഒരാൾ
  rationale: δικαίου എന്നതിൽനിന്ന് വ്യത്യസ്തമായ ἀγαθός എന്ന നൈതിക വിഭാഗം ‘നല്ലവൻ’ എന്ന പദത്തിലൂടെ നിലനിർത്തുന്നു; അത് ‘ദയാലു’ എന്നോ ‘ഉപകാരി’ എന്നോ ചുരുക്കി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τάχα
  choice: ഒരുപക്ഷേ
  rationale: സാധ്യതയെ മാത്രം സൂചിപ്പിക്കുന്ന അളന്ന ഭാവം കൃത്യമായി നൽകുന്നു.
- source_word: καὶ
  choice: -പ്പെട്ടേക്കാം എന്ന ഉയർത്തിപ്പറയുന്ന ഘടനയിൽ ഉൾക്കൊള്ളിച്ചു
  rationale: Ascensive καί നൽകുന്ന ‘പോലും/even’ എന്ന ഊന്നൽ മലയാളത്തിലെ ‘ധൈര്യപ്പെട്ടേക്കാം’ എന്ന സാധ്യതാപരവും അസാധാരണത സൂചിപ്പിക്കുന്നതുമായ ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: τολμᾷ
  choice: ധൈര്യപ്പെട്ടേക്കാം
  rationale: τόλμαω എന്നതിലെ ധൈര്യപ്പെടുക/തുനിയുക എന്ന അർഥവും τάχα സൂചിപ്പിക്കുന്ന സാധ്യതയും ഒരുമിച്ച് നൽകുന്നു.
- source_word: ἀποθανεῖν
  choice: മരിക്കാൻ
  rationale: മരണത്തെക്കുറിച്ചുള്ള ആവർത്തനം രണ്ടാം ഉപവാക്യത്തിലും തുറന്നുവെച്ച് infinitive-നെ നേരിട്ട് വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: δικαίου, ἀγαθοῦ എന്നീ പദങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം നിലനിർത്തണമോ
  choice: ‘നീതിമാൻ’, ‘നല്ലവനായ ഒരാൾ’ എന്നിങ്ങനെ വ്യത്യസ്തമായി പരിഭാഷപ്പെടുത്തി.
  alternative: രണ്ടും സമീപാർത്ഥങ്ങളായി കണ്ട് ഒരേ മലയാളപദം ഉപയോഗിക്കുക.
  rationale: പൗലോസ് ഉദ്ദേശിച്ചിരിക്കാവുന്ന ‘നീതിയുള്ളവൻ’–‘നല്ലവൻ’ വ്യത്യാസം പരിഹരിക്കാതെ നിലനിർത്തുന്നു; അതിന്റെ കൃത്യസ്വഭാവം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. വാക്യത്തിന്റെ വാദഗതി സ്വാഭാവികമാക്കിക്കൊണ്ട് പ്രധാന പദവ്യത്യാസവും മരണത്തെക്കുറിച്ചുള്ള ആവർത്തനവും സംരക്ഷിച്ചു.
