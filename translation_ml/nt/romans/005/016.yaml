id: ROM.5.16
reference: Romans 5:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: ml
  text: പാപം ചെയ്ത ഒരുവനിലൂടെ ഉണ്ടായതുപോലെയല്ല ഈ ദാനം[a]. ഒരു അതിക്രമത്തിൽനിന്നുണ്ടായ ന്യായവിധി ശിക്ഷാവിധിയിൽ കലാശിച്ചു[b]; എന്നാൽ അനേകം അതിക്രമങ്ങൾക്കുശേഷം ലഭിച്ച കൃപാദാനം നീതീകരണത്തിൽ കലാശിച്ചു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പാപം ചെയ്ത ഒരു മനുഷ്യനിലൂടെ ഉണ്ടായതുപോലെയല്ല ഈ ദാനം.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഒരൊറ്റ കുറ്റത്തിൽനിന്നുണ്ടായ ന്യായവിധി ശിക്ഷാവിധിയിൽ കലാശിച്ചു.’
    reason: lexical_alternative
  - marker: c
    text: ‘നീതീകരണം’ എന്നതിന് ‘നീതിയുള്ള വിധി’ എന്നോ ‘കുറ്റവിമോചനം’ എന്നോ പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: ദാനം
  rationale: നൽകപ്പെട്ട സമ്മാനം എന്ന അടിസ്ഥാനാർഥം ലളിതമായും സ്വാഭാവികമായും അറിയിക്കുന്നു; χάρισμα എന്ന പദത്തിൽനിന്നുള്ള വ്യത്യാസവും നിലനിർത്തുന്നു.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: പാപം ചെയ്ത ഒരുവനിലൂടെ ഉണ്ടായത്
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ പ്രയോഗത്തിൽ വ്യക്തിയെക്കുറിച്ചുള്ള സൂചന നിലനിർത്തുകയും, താരതമ്യം മലയാളത്തിൽ പൂർണമാക്കാൻ ‘ഉണ്ടായത്’ എന്നത് മിതമായി പൂരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: നിയമപരമായ തീരുമാനത്തെയോ വിധിയെയോ സൂചിപ്പിക്കുന്നു; തുടർന്നുള്ള ശിക്ഷാവിധിയുമായുള്ള ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἐξ ἑνὸς
  choice: ഒരു അതിക്രമത്തിൽനിന്ന്
  rationale: പിന്നീടുള്ള ‘അനേകം അതിക്രമങ്ങൾ’ എന്ന പ്രയോഗത്തോടുള്ള വിരുദ്ധസമാന്തര്യം കണക്കിലെടുത്ത് ἑνός ഒരു അതിക്രമത്തെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατάκριμα
  choice: ശിക്ഷാവിധി
  rationale: കുറ്റക്കാരനെന്നു വിധിക്കുന്ന ന്യായിക ഫലം മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: χάρισμα
  choice: കൃപാദാനം
  rationale: കൃപയിൽനിന്നുള്ള ദാനം എന്ന χάρισμαയുടെ പ്രത്യേക ഊന്നൽ നിലനിർത്തുകയും ആദ്യത്തെ δώρημαയിൽനിന്ന് വേർതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: παραπτωμάτων
  choice: അതിക്രമങ്ങൾ
  rationale: ധാർമികവും നിയമപരവുമായ ലംഘനത്തിന്റെ അർഥം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: δικαίωμα
  choice: നീതീകരണം
  rationale: κατάκριμαയോടു വിരുദ്ധമായി നിൽക്കുന്ന അനുകൂല ന്യായിക ഫലം ഇവിടെ അറിയിക്കുന്നു; വിധി അല്ലെങ്കിൽ കുറ്റവിമോചനം എന്ന കൂടുതൽ മൂർത്തമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: κατάκριμαയോടുള്ള വിരുദ്ധതയിൽ δικαίωμαയുടെ ന്യായിക അർഥം
  choice: നീതീകരണം
  alternative: നീതിയുള്ള വിധി; കുറ്റവിമോചനം
  rationale: വാക്യത്തിന്റെ ഘടന ന്യായവിധി/ശിക്ഷാവിധി, കൃപാദാനം/δικαίωμα എന്നീ ന്യായിക വിരുദ്ധജോടികളിലാണ്. ‘നീതീകരണം’ ഈ വിരുദ്ധത സ്വാഭാവികമായി അറിയിക്കുന്നു; പദത്തിന്റെ വിധിസംബന്ധമായ മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ന്യായിക വിരുദ്ധതകൾ വ്യക്തമായി നിലനിർത്തിയിരിക്കുന്നു. εἰς സൂചിപ്പിക്കുന്ന ഫലബന്ധം ‘കലാശിച്ചു’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി നൽകിയിരിക്കുന്നു.
