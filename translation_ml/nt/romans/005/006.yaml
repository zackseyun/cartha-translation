id: ROM.5.6
reference: Romans 5:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: ml
  text: കാരണം, നാം ഇനിയും ബലഹീനരായിരിക്കുമ്പോൾ, തക്ക സമയത്ത് മശീഹ ദൈവഭക്തിയില്ലാത്തവർക്കായി[a] മരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവഭക്തിയില്ലാത്തവർക്കുവേണ്ടി.”
    reason: ὑπέρ എന്ന പദത്തിന് ഇവിടെ ‘ആർക്കായി’ എന്നും ‘ആർക്കുവേണ്ടി/ആരുടെ പക്ഷമായി’ എന്നും പ്രകടിപ്പിക്കാവുന്ന അർഥവ്യാപ്തിയുണ്ട്.
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ ഒരു പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ പരമ്പരാഗത ലിപ്യന്തരണത്തേക്കാൾ അതിന്റെ അർഥം സൂചിപ്പിക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: നാം ഇനിയും ബലഹീനരായിരിക്കുമ്പോൾ
  rationale: Genitive absolute സ്വാഭാവികമായ മലയാള കാലവാക്യമായി നൽകി; ἀσθενῶν സൂചിപ്പിക്കുന്ന വിശാലമായ അശക്താവസ്ഥയെ അമിതമായി വ്യാഖ്യാനിക്കാതെ ‘ബലഹീനർ’ എന്നു നിലനിർത്തി.
- source_word: ἔτι
  choice: ഇനിയും
  rationale: തുടർന്നുനിന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ആവർത്തനത്തിന്റെ ആശയം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ ഒരിക്കൽ വ്യക്തമായി പ്രകടിപ്പിച്ചു.
- source_word: κατὰ καιρὸν
  choice: തക്ക സമയത്ത്
  rationale: യോജിച്ചതോ നിർണയിക്കപ്പെട്ടതോ ആയ സമയമെന്ന ആശയം സ്വാഭാവികവും വ്യാഖ്യാനഭാരം കുറഞ്ഞതുമായ രീതിയിൽ നൽകുന്നു.
- source_word: ὑπὲρ
  choice: വർക്കായി
  rationale: മരണം അവർക്കുവേണ്ടിയായിരുന്നു എന്ന ഗുണഭോക്തൃ/പ്രതിനിധാനപരമായ വിശാലത നിലനിർത്തുന്നു; കൃത്യമായ പ്രായശ്ചിത്തസിദ്ധാന്തം വിവർത്തനത്തിൽ നിർബന്ധിക്കുന്നില്ല.
- source_word: ἀσεβῶν
  choice: ദൈവഭക്തിയില്ലാത്തവർ
  rationale: ദൈവത്തോടുള്ള ഭക്തിയോ ആദരവോ ഇല്ലാത്തവരെന്ന നൈതിക-മതപരമായ അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: Aorist ക്രിയയുടെ നേരായ, സ്വാഭാവികമായ പരിഭാഷ.
theological_decisions:
- issue: ὑπὲρ ἀσεβῶν എന്ന പ്രയോഗത്തിൽ മശീഹയുടെ മരണത്തിന്റെ ബന്ധം
  choice: ദൈവഭക്തിയില്ലാത്തവർക്കായി
  alternative: ദൈവഭക്തിയില്ലാത്തവർക്കുവേണ്ടി
  rationale: മശീഹയുടെ മരണം ദൈവഭക്തിയില്ലാത്തവരുടെ നന്മയ്ക്കും അവരുടെ പക്ഷത്തുമാണെന്ന് വാക്യം വ്യക്തമാക്കുന്നു. എന്നാൽ ὑπέρ എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമോ പകരമായോ ഉള്ള കൃത്യമായ സിദ്ധാന്തവ്യാഖ്യാനം പരിഭാഷയിൽ തീർപ്പാക്കാതെ തുറന്നുവെച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ കാരണം സൂചിപ്പിക്കുന്ന γάρ ‘കാരണം’ എന്നു നിലനിർത്തി; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക വായനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
