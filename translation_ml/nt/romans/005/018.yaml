id: ROM.5.18
reference: Romans 5:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഒരു ലംഘനത്തിലൂടെ എല്ലാ മനുഷ്യർക്കും ശിക്ഷാവിധി വന്നതുപോലെ, ഒരു നീതിപ്രവൃത്തിയിലൂടെ എല്ലാ മനുഷ്യർക്കും ജീവൻ നൽകുന്ന നീതീകരണവും വന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: “ഒരു നീതിപ്രവൃത്തിയിലൂടെ ... ജീവന്റെ നീതീകരണത്തിലേക്ക്.”'
    reason: δικαιώματος, δικαίωσιν ζωῆς എന്നീ പ്രയോഗങ്ങളുടെ കൂടുതൽ അക്ഷരാർഥത്തിലുള്ള രൂപം നൽകുന്നു.
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: ഇരട്ട നിഗമനസൂചകത്തിന്റെ ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: παραπτώματος
  choice: ലംഘനം
  rationale: ഒരു തെറ്റായ അതിക്രമപ്രവൃത്തിയെ സൂചിപ്പിക്കുകയും പൊതുവായ ‘പാപം’ എന്ന അമൂർത്ത പദത്തേക്കാൾ ഗ്രീക്കിലെ പ്രവൃത്തികേന്ദ്രിത അർത്ഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κατάκριμα
  choice: ശിക്ഷാവിധി
  rationale: ന്യായവിധിയിലൂടെ കുറ്റക്കാരനെന്നു വിധിക്കുന്ന κατάκριμα എന്ന പദത്തിന്റെ നിയമപരമായ ശക്തി വ്യക്തമാക്കുന്നു.
- source_word: δικαιώματος
  choice: നീതിപ്രവൃത്തി
  rationale: ഇവിടെ ഏകവചനത്തിലുള്ള പദം ക്രിസ്തുവിന്റെ നിർണായകമായ നീതിയുള്ള പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
- source_word: δικαίωσιν ζωῆς
  choice: ജീവൻ നൽകുന്ന നീതീകരണം
  rationale: ‘ജീവന്റെ നീതീകരണം’ എന്ന അക്ഷരാർഥപ്രയോഗത്തിലെ ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുമ്പോഴും നിയമപരവും ജീവദായകവുമായ ആശയങ്ങൾ സംരക്ഷിക്കുന്നു.
- source_word: πάντας ἀνθρώπους
  choice: എല്ലാ മനുഷ്യർക്കും
  rationale: രണ്ട് താരതമ്യഭാഗങ്ങളിലും ഒരേ വ്യാപ്തി നിലനിർത്തുകയും ലിംഗഭേദമില്ലാതെ മനുഷ്യരെയാകെ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: രണ്ടാമത്തെ πάντας ἀνθρώπους എന്ന പ്രയോഗത്തിന്റെ വ്യാപ്തി ദൈവശാസ്ത്രപരമായി പരിമിതപ്പെടുത്തണമോ എന്നത്
  choice: പ്രധാന പാഠത്തിൽ ‘എല്ലാ മനുഷ്യർക്കും’ എന്നു തന്നെ നിലനിർത്തി.
  alternative: ‘വിശ്വസിക്കുന്ന എല്ലാവർക്കും’ അല്ലെങ്കിൽ ‘നീതീകരിക്കപ്പെടുന്ന എല്ലാവർക്കും’
  rationale: ഗ്രീക്ക് താരതമ്യത്തിന്റെ ഇരുപാതികളിലും അതേ പദപ്രയോഗം ആവർത്തിക്കുന്നു. വിവർത്തനത്തിൽ അതിന്റെ വ്യാപ്തി ചുരുക്കുന്നത് പാഠം വിശാലസന്ദർഭത്തിൽ നിലനിർത്തുന്ന ദൈവശാസ്ത്രപരമായ സംഘർഷം മുൻകൂട്ടി പരിഹരിക്കുമായിരുന്നു.
- issue: δικαιώματος ക്രിസ്തുവിന്റെ പ്രവൃത്തിയെ സൂചിപ്പിക്കുന്നുവെന്നത് പാഠത്തിൽ വ്യക്തമാക്കണമോ എന്നത്
  choice: ‘ഒരു നീതിപ്രവൃത്തി’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു; ‘ക്രിസ്തുവിന്റെ’ എന്ന് ചേർത്തില്ല.
  alternative: ‘ക്രിസ്തുവിന്റെ ഒരു നീതിപ്രവൃത്തി’
  rationale: സന്ദർഭം സൂചന നൽകുന്നുവെങ്കിലും ഈ വാക്യത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ കർത്താവിന്റെ പേര് ഇല്ല; അതിനാൽ വിവർത്തനം വ്യാഖ്യാനപരമായ ചേർക്കൽ ഒഴിവാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പൗലോസിന്റെ സമാന്തരഘടനയും നിയമപരമായ പദസമ്പത്തും കഴിയുന്നത്ര സംരക്ഷിച്ചിരിക്കുന്നു; സ്വാഭാവിക വായനയ്ക്കായി ആവശ്യമായ ക്രിയ മാത്രം മലയാളത്തിൽ ചേർത്തിരിക്കുന്നു.
