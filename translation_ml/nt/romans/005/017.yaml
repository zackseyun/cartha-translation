revisions:
- from: ഒരുവന്റെ അതിക്രമം നിമിത്തം ആ ഒരുവൻമുഖാന്തരം മരണം രാജാവായി വാണുവെങ്കിൽ, കൃപയുടെ സമൃദ്ധിയും നീതിയുടെ ദാനവും സ്വീകരിക്കുന്നവർ ആ ഒരുവനായ യേശുമശിഹായിലൂടെ ജീവന്റെ മണ്ഡലത്തിൽ എത്രയധികമായി രാജാക്കന്മാരായി വാഴും!
  to: ഒരുവന്റെ അതിക്രമത്താൽ മരണം ആ ഒരുവൻ മുഖാന്തരം വാണുവെങ്കിൽ, കൃപയുടെ സമൃദ്ധിയും നീതിയുടെ ദാനവും സ്വീകരിക്കുന്നവർ ആ ഒരുവനായ യേശു മശിഹായിലൂടെ ജീവനിൽ എത്രയധികം വാഴും.
