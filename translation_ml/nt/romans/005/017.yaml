id: ROM.5.17
reference: Romans 5:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: ml
  text: ഒരുവന്റെ അതിക്രമത്താൽ മരണം ആ ഒരുവൻ മുഖാന്തരം വാണുവെങ്കിൽ, കൃപയുടെ സമൃദ്ധിയും നീതിയുടെ ദാനവും സ്വീകരിക്കുന്നവർ ആ ഒരുവനായ യേശു മശിഹായിലൂടെ ജീവനിൽ എത്രയധികം വാഴും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώματι
  choice: അതിക്രമം
  rationale: തെറ്റായ ചുവടിനെയോ ലംഘനത്തെയോ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ആശയം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു; ആദാം–മശിഹാ താരതമ്യത്തിനും യോജിക്കുന്നു.
- source_word: ἐβασίλευσεν
  choice: രാജാവായി വാണു
  rationale: ക്രിയയിലെ രാജകീയ രൂപകം വ്യക്തമായി നിലനിർത്തുകയും വാക്യത്തിന്റെ അവസാനത്തിലെ βασιλεύσουσιν എന്ന ക്രിയയുമായുള്ള സമാന്തരത സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: περισσείαν
  choice: സമൃദ്ധി
  rationale: അളവുകവിഞ്ഞ നിറവിനെ ലളിതവും സ്വാഭാവികവുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: χάριτος
  choice: കൃപ
  rationale: ദൈവിക അനുഗ്രഹവും സൗജന്യദാനത്തിന്റെ ഭാവവും വഹിക്കുന്ന, പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച സ്ഥിരമായ മലയാളപദം.
- source_word: δωρεᾶς
  choice: ദാനം
  rationale: കൃപ എന്ന സമീപപദം സൗജന്യത ഇതിനകം സൂചിപ്പിക്കുന്നതിനാൽ അധികവിവരണം ചേർക്കാതെ ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
- source_word: δικαιοσύνης
  choice: നീതി
  rationale: δικαιοσύνηയുടെ ദൈവസന്നിധിയിലെ ശരിയായ നിലയും ന്യായമായ ക്രമവും ഉൾക്കൊള്ളാവുന്ന സ്വാഭാവിക മലയാളപദം; ഇവിടെ അതിനെ ഒറ്റ സിദ്ധാന്തപരമായ വ്യാഖ്യാനമായി ചുരുക്കുന്നില്ല.
- source_word: λαμβάνοντες
  choice: സ്വീകരിക്കുന്നവർ
  rationale: ഈ ദാനങ്ങളെ സ്വീകരിക്കുന്നവരെന്ന നിലയിൽ ആളുകളെ വിശേഷിപ്പിക്കുന്ന വർത്തമാന കൃദന്തരൂപം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν ζωῇ
  choice: ജീവന്റെ മണ്ഡലത്തിൽ
  rationale: വെറും ജീവിച്ചിരിക്കുക എന്നതിലേക്കു ചുരുക്കാതെ, മരണത്തിന്റെ ഭരണത്തോടു വിരുദ്ധമായ ജീവന്റെ മേഖലയെന്ന സാധ്യത വ്യക്തമാക്കുന്നു.
- source_word: βασιλεύσουσιν
  choice: രാജാക്കന്മാരായി വാഴും
  rationale: മരണം വാണു എന്ന മുൻവാക്യത്തോടുള്ള രാജകീയ വിരോധസമാന്തരത ശക്തമായി നിലനിർത്തുന്നു.
- source_word: Χριστοῦ
  choice: മശിഹാ
  rationale: Χριστός എന്ന അഭിഷിക്തനായ രാജാവിന്റെ പദവിസൂചന മലയാളത്തിൽ നിലനിർത്തുന്നു; യേശു എന്ന പേരോടൊപ്പം ചേർന്ന് സ്വാഭാവികമായി ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνης എന്ന പദത്തിന്റെ പൗലോസീയ പ്രയോഗം
  choice: നീതിയുടെ ദാനം
  alternative: നീതീകരിക്കപ്പെട്ട നിലയുടെ ദാനം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാലത സംരക്ഷിക്കാൻ പ്രധാനപാഠത്തിൽ 'നീതി' ഉപയോഗിച്ചു; 'നീതീകരിക്കപ്പെട്ട നില' എന്നു പറഞ്ഞാൽ ഈ സന്ദർഭത്തിലെ ഒരു സിദ്ധാന്തപരമായ വശം മാത്രം മുൻകൂട്ടി നിർണ്ണയിക്കപ്പെടാം.
- issue: ἐν ζωῇ എന്ന പ്രയോഗത്തിന്റെ പരിധി
  choice: ജീവന്റെ മണ്ഡലത്തിൽ
  alternative: ജീവനിൽ
  rationale: മരണം രാജാവായി വാണു എന്നതോടുള്ള വിരോധത്തിൽ ജീവൻ ഒരു ഭരണവലയമായി ഗ്രഹിക്കാവുന്ന അർത്ഥം നിലനിർത്തുന്നു; അതേസമയം നിത്യജീവൻ എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ ചേർത്തിട്ടില്ല.
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστός
  choice: യേശുമശിഹാ
  alternative: യേശുക്രിസ്തു
  rationale: Χριστός എന്ന പദത്തിന്റെ പദവിസ്വഭാവം 'മശിഹാ' വ്യക്തമാക്കുന്നു; ഈ കൂട്ടുപ്രയോഗം പേരുപോലെ വായിക്കാവുന്ന സാധ്യത 'യേശുക്രിസ്തു' എന്ന പരിചിതരൂപത്തിലുണ്ട്, എങ്കിലും മൂലപദത്തിന്റെ അർത്ഥം നേരിട്ട് നൽകുന്നതിന് മുഖ്യപാഠത്തിൽ 'മശിഹാ' തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ ദീർഘമായ നിബന്ധനാവാക്യവും 'ഒരുവൻ' എന്ന ആവർത്തനവും മരണം/ജീവൻ, വാണു/വാഴും എന്നീ സമാന്തരങ്ങളും നിലനിർത്തി. പ്രസിദ്ധീകരണപാഠത്തിൽ അടിക്കുറിപ്പുകളില്ലാത്തതിനാൽ അടിക്കുറിപ്പുകുറികളും ചേർത്തിട്ടില്ല.
