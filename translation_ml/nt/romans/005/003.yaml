id: ROM.5.3
reference: Romans 5:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: ml
  text: അതുമാത്രമല്ല, കഷ്ടതകളിലും നാം ആനന്ദിക്കുന്നു[a]—കഷ്ടത[b] സഹനശക്തി[c] ഉളവാക്കുന്നു എന്ന് അറിഞ്ഞുകൊണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആനന്ദിക്കുന്നു’ എന്നതിന് ‘അഭിമാനിക്കുന്നു’ അല്ലെങ്കിൽ ‘ആഹ്ലാദിക്കുന്നു’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘കഷ്ടത’ എന്നതിന് ‘പീഡനം’, ‘ദുരിതം’ അല്ലെങ്കിൽ ‘കഷ്ടാനുഭവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: c
    text: ‘സഹനശക്തി’ എന്നതിന് ‘സ്ഥിരതയോടെയുള്ള സഹനം’ അല്ലെങ്കിൽ ‘അടിയുറച്ചുനിൽക്കാനുള്ള കഴിവ്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: ആനന്ദിക്കുന്നു
  rationale: ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള ഉറപ്പിൽനിന്ന് ഉണ്ടാകുന്ന ആഹ്ലാദമാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്. ‘ആനന്ദിക്കുന്നു’ എന്നത് അഹങ്കാരത്തിന്റെ അനാവശ്യ ധ്വനി വരുത്താതെ ഈ അനുകൂല അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; ‘അഭിമാനിക്കുന്നു’, ‘ആഹ്ലാദിക്കുന്നു’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: θλίψεσιν / θλῖψις
  choice: കഷ്ടതകളിലും / കഷ്ടത
  rationale: സമ്മർദം, ദുരിതം, പീഡനം എന്നിവ ഉൾക്കൊള്ളുന്ന θλῖψις എന്ന പദത്തിന്റെ വിശാലത സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന വിധത്തിൽ ‘കഷ്ടത’ നൽകുന്നു. ആദ്യപ്രയോഗത്തിലെ ബഹുവചനവും തുടർന്നുള്ള പൊതുതത്ത്വത്തിലെ ഏകവചനവും ഗ്രീക്കിനെ അനുസരിച്ച് നിലനിർത്തുന്നു.
- source_word: ὑπομονήν
  choice: സഹനശക്തി
  rationale: പ്രതികൂല സാഹചര്യങ്ങളിൽ ക്ഷമയോടെ തുടർന്നുനിൽക്കാനുള്ള ശേഷിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു. ‘സഹിഷ്ണുത’ എന്നതിന് മറ്റുള്ളവരെ പൊറുക്കുക എന്ന ധ്വനിയും വരാവുന്നതിനാൽ ഇവിടെ ‘സഹനശക്തി’ കൂടുതൽ കൃത്യമാണ്.
- source_word: κατεργάζεται
  choice: ഉളവാക്കുന്നു
  rationale: കഷ്ടതയുടെ ഫലമായി സഹനശക്തി രൂപപ്പെടുന്നു എന്ന കാരണഫലബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰδότες
  choice: അറിഞ്ഞുകൊണ്ട്
  rationale: ഗ്രീക്കിലെ പങ്കാളിക്രിയയുടെ രൂപവും പ്രധാന പ്രസ്താവനയുമായുള്ള ബന്ധവും അനാവശ്യമായി കാരണവാക്യമാക്കി തീർക്കാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ആത്മീയമായി അനുകൂലമായ സന്ദർഭത്തിൽ καυχώμεθα എന്നതിന്റെ അർഥം
  choice: സ്വയം പുകഴ്ത്തുന്നതല്ല, ദൈവത്തിന്റെ പ്രവർത്തനത്തിലുള്ള ഉറപ്പിൽനിന്നുള്ള ആനന്ദം
  alternative: ‘അഭിമാനിക്കുന്നു’ അല്ലെങ്കിൽ ‘ആഹ്ലാദിക്കുന്നു’
  rationale: പൗലോസിന്റെ വാദം കഷ്ടതയിൽ ദൈവം ഉളവാക്കുന്ന ഫലത്തിലുള്ള ഉറപ്പിനെക്കുറിച്ചാണ്. ‘ആനന്ദിക്കുന്നു’ ഈ ദൈവകേന്ദ്രിത ഭാവം നൽകുന്നു; അതേസമയം മൂലപദത്തിലെ ‘boast/exult’ സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
- issue: കഷ്ടതയും സഹനശക്തിയും തമ്മിലുള്ള ബന്ധം
  choice: കഷ്ടത സഹനശക്തി ഉളവാക്കുന്നു എന്ന നേരിട്ടുള്ള പ്രസ്താവന
  alternative: കഷ്ടത ഉണ്ടായാൽ എല്ലായ്പ്പോഴും യാന്ത്രികമായി സഹനശക്തി ലഭിക്കുന്നു എന്ന വ്യാഖ്യാനം
  rationale: വാക്യത്തിലെ കാരണഫലഭാഷ അതേപടി നിലനിർത്തുന്നു; എന്നാൽ അതിന്റെ പ്രവർത്തനരീതി വിശദീകരിക്കുന്ന ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം വാചകത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള മാറ്റം സംരക്ഷിച്ചു. εἰδότες എന്നതിനെ ‘അറിഞ്ഞുകൊണ്ട്’ എന്നു നൽകി ബന്ധത്തിലെ സൂക്ഷ്മത തുറന്നുവെച്ചു; ദീർഘമായ ഉപവാക്യഘടന വായിക്കാൻ എളുപ്പമാക്കാൻ ദീർഘരേഖ ഉപയോഗിച്ചു.
