id: ROM.5.4
reference: Romans 5:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: ml
  text: സഹനശക്തി തെളിയിക്കപ്പെട്ട സ്വഭാവത്തെ[a] ഉളവാക്കുന്നു; തെളിയിക്കപ്പെട്ട സ്വഭാവം പ്രത്യാശയെ ഉളവാക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പരീക്ഷിക്കപ്പെട്ട സ്വഭാവം’ അല്ലെങ്കിൽ ‘അംഗീകാരം.’
    reason: δοκιμή എന്ന ഗ്രീക്കുപദത്തിന് പരിശോധനയിലൂടെ തെളിഞ്ഞ സ്വഭാവം, പരീക്ഷിക്കപ്പെട്ട നില, അംഗീകാരം എന്നീ അടുത്ത അർഥസാധ്യതകളുണ്ട്.
lexical_decisions:
- source_word: ὑπομονή
  choice: സഹനസ്ഥിരത
  rationale: പരീക്ഷണങ്ങൾക്കിടയിൽ ക്ഷമയോടെ ഉറച്ചുനിൽക്കുന്ന ആശയം ഒരുമിച്ച് അറിയിക്കാൻ ഈ പദം തിരഞ്ഞെടുത്തു; വെറും നിഷ്ക്രിയമായ സഹനത്തേക്കാൾ മൂലപദത്തിന്റെ സ്ഥിരതയുള്ള സഹിച്ചുനിൽപ്പ് ഇതിൽ വ്യക്തമാകുന്നു.
- source_word: δοκιμή
  choice: തെളിയിക്കപ്പെട്ട സ്വഭാവം
  rationale: പരിശോധനയിലൂടെ യഥാർഥമെന്ന് തെളിഞ്ഞ വ്യക്തിത്വഗുണമാണ് ഇവിടെ ഉദ്ദേശിക്കുന്നത്. ഇത് പരിശോധനയുടെ പ്രക്രിയയെന്നതിലുപരി അതിന്റെ ഫലത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: ἐλπίς
  choice: പ്രത്യാശ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ദൈവത്തിൽ അധിഷ്ഠിതമായ പ്രതീക്ഷയെ സ്വാഭാവികവും പ്രമാണികവുമായി അറിയിക്കുന്ന സാധാരണ മലയാളപദം.
- source_word: δὲ
  choice: വാക്യഘടനയിലെ തുടർച്ച
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, ഫലങ്ങളുടെ ശൃംഖലയാണ് δέ സൂചിപ്പിക്കുന്നത്. അതിനാൽ പ്രത്യേക വിരോധസൂചകപദം ചേർക്കാതെ മലയാളത്തിലെ സമാന്തര ഘടനയിലൂടെ ബന്ധം പ്രകടമാക്കി.
- source_word: ellipsis of κατεργάζεται
  choice: ഉളവാക്കുന്നു
  rationale: മുൻവാക്യഭാഗത്തിൽനിന്ന് മനസ്സിലാക്കേണ്ട ക്രിയ ഗ്രീക്കിൽ ആവർത്തിച്ചിട്ടില്ല. മലയാളത്തിൽ ഫലശൃംഖല വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ക്രിയ ഒരിക്കൽ അവസാനം ചേർത്തു.
theological_decisions:
- issue: വിശുദ്ധീകരണത്തിന്റെ ഫലശൃംഖലയിൽ δοκιμή എന്ന പദത്തിന്റെ അർഥം
  choice: പരിശോധനയിലൂടെ യഥാർഥമെന്ന് തെളിയിക്കപ്പെട്ട സ്വഭാവഗുണം
  alternative: പരിശോധനയുടെ പ്രക്രിയ; അംഗീകാരം
  rationale: ഈ ശൃംഖലയിൽ സഹനസ്ഥിരതയുടെ ഫലമായാണ് δοκιμή വരുന്നത്. അതിനാൽ പരിശോധന എന്ന സംഭവത്തേക്കാൾ അതിലൂടെ തെളിഞ്ഞ സ്വഭാവം എന്ന ഫലാർഥം സന്ദർഭത്തിന് യോജിക്കുന്നു; അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തമായ ഫലശൃംഖലയും ആവർത്തനവും നിലനിർത്തി; ഗ്രീക്കിലെ ക്രിയാലോപം മലയാളത്തിൽ ഒരു ക്രിയകൊണ്ട് സ്വാഭാവികമായി പൂരിപ്പിച്ചു.
