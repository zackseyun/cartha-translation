  to: സഹനശക്തി തെളിയിക്കപ്പെട്ട സ്വഭാവത്തെ[a] ഉളവാക്കുന്നു; തെളിയിക്കപ്പെട്ട സ്വഭാവം പ്രത്യാശയെ ഉളവാക്കുന്നു.
