revisions:
- from: നാം ശത്രുക്കളായിരിക്കുമ്പോൾത്തന്നെ ദൈവപുത്രന്റെ മരണത്തിലൂടെ ദൈവത്തോടു നിരപ്പിക്കപ്പെട്ടുവെങ്കിൽ, നിരപ്പിക്കപ്പെട്ടവരായ നാം അവന്റെ ജീവനാൽ[a] എത്രയധികമായി രക്ഷിക്കപ്പെടും!
  to: എന്തെന്നാൽ, നാം ശത്രുക്കളായിരിക്കുമ്പോൾ ദൈവപുത്രന്റെ മരണത്തിലൂടെ ദൈവത്തോടു നിരപ്പിക്കപ്പെട്ടുവെങ്കിൽ, നിരപ്പിക്കപ്പെട്ടശേഷം അവന്റെ ജീവനാൽ[a] എത്രയധികം നാം രക്ഷിക്കപ്പെടും.
