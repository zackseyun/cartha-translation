id: ROM.5.10
reference: Romans 5:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: ml
  text: എന്തെന്നാൽ, നാം ശത്രുക്കളായിരിക്കുമ്പോൾ ദൈവപുത്രന്റെ മരണത്തിലൂടെ ദൈവത്തോടു നിരപ്പിക്കപ്പെട്ടുവെങ്കിൽ, നിരപ്പിക്കപ്പെട്ടശേഷം അവന്റെ ജീവനാൽ[a] എത്രയധികം നാം രക്ഷിക്കപ്പെടും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അവന്റെ ജീവനിൽ.”
    reason: ἐν എന്ന പദത്തെ ഉപാധിപരമായി (‘ജീവനാൽ’) അല്ലാതെ സ്ഥിതിവാചകമോ സഹവർത്തിത്വപരമോ ആയി മനസ്സിലാക്കാവുന്ന യഥാർഥ വ്യാകരണസാധ്യത.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: …എങ്കിൽ
  rationale: γάρ മുൻവാക്യത്തിലെ വാദത്തെ പിന്തുണയ്ക്കുന്നു; മലയാളത്തിൽ വാക്യത്തിന്റെ സമഗ്രമായ ന്യായീകരണപ്രവാഹവും εἰയുടെ വ്യവസ്ഥാഭാവവും സ്വാഭാവികമായ വ്യവസ്ഥാഘടനയിലൂടെ വ്യക്തമാകുന്നതിനാൽ വേറിട്ട ‘എന്തെന്നാൽ’ ചേർത്തില്ല.
- source_word: ἐχθροὶ ὄντες
  choice: നാം ശത്രുക്കളായിരിക്കുമ്പോൾത്തന്നെ
  rationale: ὄντες സൂചിപ്പിക്കുന്ന അന്നത്തെ അവസ്ഥയും ἐχθροίയുടെ ബന്ധപരമായ ‘ശത്രുക്കൾ’ എന്ന അർഥവും നിലനിർത്തുന്നു; ‘ത്തന്നെ’ അനുകൂലമല്ലാത്ത ആ അവസ്ഥയിലായിരുന്നപ്പോഴുള്ള പ്രവൃത്തിയെ ഊന്നുന്നു.
- source_word: κατηλλάγημεν / καταλλαγέντες
  choice: നിരപ്പിക്കപ്പെട്ടു / നിരപ്പിക്കപ്പെട്ടവരായ
  rationale: καταλλάσσωയുടെ ബന്ധപുനഃസ്ഥാപനവും രണ്ടു രൂപങ്ങളിലുമുള്ള ദൈവിക കർമ്മവാച്യവും നിലനിർത്താൻ ഒരേ മൂലപദപ്രയോഗം ഉപയോഗിച്ചു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോടു
  rationale: καταλλάσσωയോടുകൂടിയ ദത്തിവ് സൂചിപ്പിക്കുന്ന ബന്ധലക്ഷ്യം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: ദൈവപുത്രന്റെ മരണത്തിലൂടെ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം ‘മരണത്തിലൂടെ’ എന്നു നൽകുന്നു. മലയാളത്തിലെ സർവനാമസന്ദിഗ്ധത ഒഴിവാക്കി αὐτοῦയുടെ ദൈവസംബന്ധം ‘ദൈവപുത്രൻ’ എന്ന സ്വാഭാവിക സംയുക്തത്തിലൂടെ വ്യക്തമാക്കുന്നു; പുത്രത്വപദവി നിലനിർത്തുന്നു.
- source_word: πολλῷ μᾶλλον
  choice: എത്രയധികമായി
  rationale: പൗലോസിന്റെ ശക്തമായ a-fortiori താരതമ്യവാദം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σωθησόμεθα
  choice: രക്ഷിക്കപ്പെടും
  rationale: ഭാവികാല കർമ്മവാച്യവും രക്ഷയുടെ ഭാവിമുഖമായ പ്രസ്താവനയും സൂക്ഷിക്കുന്നു.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: അവന്റെ ജീവനാൽ
  rationale: മരണം/ജീവൻ സമാന്തരതയിൽ ἐνനെ ഉപാധി/കാരണം എന്ന നിലയിൽ വായിക്കുന്ന പ്രധാന വ്യാഖ്യാനം നൽകുന്നു; ഗ്രീക്കിലെ സ്ഥിതിവാചക സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν τῇ ζωῇ αὐτοῦ എന്നതിന്റെ ബലം
  choice: 'ഉപാധിപരമായി: ‘അവന്റെ ജീവനാൽ’'
  alternative: 'സ്ഥിതിവാചകമോ സഹവർത്തിത്വപരമോ ആയി: ‘അവന്റെ ജീവനിൽ’'
  rationale: ‘പുത്രന്റെ മരണത്തിലൂടെ’ എന്ന മുൻപ്രയോഗത്തോടുള്ള മരണം/ജീവൻ വൈരുധ്യം ഉപാധിപരമായ വായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും ἐνയുടെ യഥാർഥ സ്ഥിതിവാചക സാധ്യത തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിരപ്പിക്കുക’ ബന്ധപുനഃസ്ഥാപനത്തിന്റെ അർഥം പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധം നൽകുന്നു. വാദഘടന മലയാളത്തിന്റെ സ്വാഭാവിക വ്യവസ്ഥാവാക്യക്രമത്തിൽ അവതരിപ്പിച്ചു; ആശയവിപുലീകരണം ഒഴിവാക്കി.
