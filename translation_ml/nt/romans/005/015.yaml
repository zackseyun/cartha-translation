id: ROM.5.15
reference: Romans 5:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: ml
  text: 'എന്നാൽ ആ ദാനം അതിക്രമം പോലെയല്ല. ആ ഒരുവന്റെ അതിക്രമം നിമിത്തം അനേകർ മരിച്ചുവെങ്കിൽ, ദൈവത്തിന്റെ കൃപയും ഒരേ മനുഷ്യനായ യേശു മശീഹായുടെ[b] കൃപയിലുള്ള ദാനവും അനേകരിലേക്ക് എത്രയോ അധികമായി കവിഞ്ഞൊഴുകി!


    [a] അഥവാ, “കൃപയാൽ വന്ന ദാനം.”


    [b] അഥവാ, “യേശുക്രിസ്തു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കൃപയാൽ വന്ന ദാനം.”
    reason: ἐν χάριτι എന്ന പ്രയോഗത്തിന്റെ ഉപാധിപരമായ വ്യാഖ്യാനസാധ്യത സംരക്ഷിക്കാൻ.
  - marker: b
    text: അഥവാ, “യേശുക്രിസ്തു.”
    reason: Χριστός എന്ന പദവിയുടെ അർഥവിവർത്തനത്തോടൊപ്പം പരമ്പരാഗത ലിപ്യന്തരണരൂപം നൽകാൻ.
lexical_decisions:
- source_word: παράπτωμα
  choice: അതിക്രമം
  rationale: തെറ്റായ പ്രവൃത്തിയുടെയും ധാർമിക ലംഘനത്തിന്റെയും ശക്തി നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം.
- source_word: χάρισμα
  choice: ദാനം
  rationale: ആദാമിന്റെ അതിക്രമത്തോടുള്ള ദൈവത്തിന്റെ ദാനത്തിന്റെ വൈരുധ്യം ലളിതമായി നിലനിർത്തുന്നു; കൃപയുടെ സ്വഭാവം തുടർന്നുള്ള χάρις പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: അനേകർ / അനേകരിലേക്ക്
  rationale: ഒരുവൻ–അനേകർ എന്ന പൗലോസിന്റെ പ്രതിനിധാനപരമായ വൈരുധ്യം നിലനിർത്തുന്നു; ‘എല്ലാവരും’ എന്നു വ്യാഖ്യാനിച്ച് വ്യാപ്തി മുൻകൂട്ടി തീർപ്പാക്കുന്നില്ല.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ കൃപ
  rationale: ഗ്രീക്കിലെ ബന്ധഘടനയും തുടർന്നുള്ള മനുഷ്യന്റെ കൃപയോടുള്ള സമാന്തരതയും വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: കൃപയാൽ ലഭിച്ച ദാനം
  rationale: ἐν എന്നതിന്റെ കാരണോപാധിപരമോ അനുബന്ധപരമോ ആയ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ഒരേയൊരു മനുഷ്യന്റെ
  rationale: ഒരുവൻ–അനേകർ എന്ന ഊന്നിയ സമാന്തരതയും നിർദിഷ്ടതയും നിലനിർത്തുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: മശീഹയായ യേശുവിന്റെ
  rationale: Χριστός എന്നതിന്റെ പദവിപരമായ അർഥം കേൾവിയാകുന്ന വിധത്തിൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐπερίσσευσεν
  choice: കവിഞ്ഞൊഴുകി
  rationale: περισσεύω എന്നതിലെ സമൃദ്ധിയുടെയും പരിധികവിഞ്ഞ വർധനയുടെയും ശക്തി ദൃശ്യവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആദാം–മശീഹാ സമാന്തരതയിലെ ‘അനേകർ’ എന്നതിന്റെ വ്യാപ്തി
  choice: ‘അനേകർ’ എന്നു നിലനിർത്തി; ‘എല്ലാവരും’ എന്നു തീർപ്പാക്കിയില്ല.
  alternative: പ്രതിനിധാനപരമായ സമഗ്രവ്യാപ്തി വ്യക്തമാക്കാൻ ‘എല്ലാവരും’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഈ വാക്യത്തിലെ പൗലോസിന്റെ വാചാടോപം ഒരുവൻ–അനേകർ എന്ന ഭാഷയാണ് ഉപയോഗിക്കുന്നത്. അതേ ഭാഷ നിലനിർത്തുന്നത് ഈ വാക്യം മാത്രമുപയോഗിച്ച് വിശാലമായ ദൈവശാസ്ത്രനിഗമനം അടിച്ചേൽപ്പിക്കുന്നത് ഒഴിവാക്കുന്നു.
- issue: ἐν χάριτι എന്നതിന്റെ ബന്ധം
  choice: മുഖ്യപാഠത്തിൽ കാരണോപാധിപരമായി ‘കൃപയാൽ ലഭിച്ച’ എന്നു നൽകി.
  alternative: ‘കൃപയിലുള്ള ദാനം’ അല്ലെങ്കിൽ ‘കൃപയാൽ വന്ന ദാനം.’
  rationale: ഗ്രീക്ക് പ്രയോഗം ഉപാധി, മേഖല, അല്ലെങ്കിൽ അനുബന്ധം സൂചിപ്പിക്കാം. വായനാസൗകര്യത്തിനായി മുഖ്യപാഠത്തിൽ സ്വാഭാവിക രൂപം ഉപയോഗിച്ച് യഥാർഥ വ്യാകരണസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഒരേയൊരു മനുഷ്യന്റെ—മശീഹയായ യേശുവിന്റെ—’ എന്ന ഇടയ്ക്കുള്ള വിശദീകരണഘടന ഗ്രീക്കിലെ ഏകമനുഷ്യൻ/യേശു മശീഹാ എന്ന ബന്ധവും ഒരുവൻ–അനേകർ സമാന്തരതയും വ്യക്തമായി നിലനിർത്തുന്നു.
