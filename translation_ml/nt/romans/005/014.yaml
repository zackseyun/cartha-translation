id: ROM.5.14
reference: Romans 5:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: ml
  text: എന്നിട്ടും, ആദാം മുതൽ മോശെ വരെ മരണം വാണു—ആദാമിന്റെ ലംഘനത്തിനു സമാനമായ വിധത്തിൽ പാപം ചെയ്യാത്തവരുടെമേൽപ്പോലും. വരാനിരിക്കുന്നവന്റെ പ്രതിരൂപമാണ് ആദാം.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘പ്രതിരൂപം’ എന്നതിന് ‘മാതൃക’ എന്നോ ‘മുൻസൂചന’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘വരാനിരിക്കുന്നവൻ’; സന്ദർഭത്തിൽ ഇത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നിട്ടും
  rationale: മുൻവാക്യത്തോടുള്ള ശക്തമായ വൈരുധ്യം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: മരണം വാണു
  rationale: മരണത്തെ രാജാധികാരം ചെലുത്തുന്ന ശക്തിയായി ചിത്രീകരിക്കുന്ന പൗലോസിന്റെ വ്യക്തിവൽക്കരണം നിലനിർത്തുന്നു.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: ആദാംമുതൽ മോശവരെ
  rationale: കാലപരിധി സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: പാപം ചെയ്യാത്തവരുടെമേൽപ്പോലും
  rationale: മരണത്തിന്റെ വാഴ്ചയുടെ വ്യാപ്തിയും καί നൽകുന്ന ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: ആദാമിന്റെ ലംഘനത്തിനു സമാനമായ വിധത്തിൽ
  rationale: ὁμοίωμα സൂചിപ്പിക്കുന്ന സാമ്യം സംരക്ഷിക്കുകയും ആ സാമ്യത്തിന്റെ കൃത്യസ്വഭാവം അനാവശ്യമായി നിർവചിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: παράβασις
  choice: ലംഘനം
  rationale: ഒരു കല്പനയുടെ അതിർത്തി കടക്കുന്നതെന്ന ആശയം dignified, പൊതുവായി ഗ്രഹിക്കാവുന്ന മലയാളത്തിൽ നൽകുന്നു.
- source_word: τύπος
  choice: പ്രതിരൂപം
  rationale: ആദാമും വരാനിരിക്കുന്നവനും തമ്മിലുള്ള മാതൃകാപരമായ correspondence നിലനിർത്തുന്നു; അർഥം ‘മുൻസൂചന’ എന്നതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: τοῦ μέλλοντος
  choice: വരാനിരിക്കുന്നവന്റെ
  rationale: സന്ദർഭത്തിലെ ക്രിസ്തുസൂചന നിലനിർത്തിക്കൊണ്ട് ‘ക്രിസ്തു’ എന്ന് മുഖ്യവാചകത്തിൽ ചേർത്ത് അവ്യക്തത പരിഹരിക്കുന്നില്ല.
theological_decisions:
- issue: ‘വരാനിരിക്കുന്നവൻ’ ആരാണ്
  choice: മുഖ്യവാചകത്തിൽ ‘വരാനിരിക്കുന്നവൻ’ എന്നു നിലനിർത്തി, സന്ദർഭത്തിൽ അത് ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: മുഖ്യവാചകത്തിൽ നേരിട്ട് ‘ക്രിസ്തു’ എന്നു നൽകുക.
  rationale: റോമർ 5:12–21-ൽ ഉദ്ദേശ്യം ക്രിസ്തുവാണെങ്കിലും, ഗ്രീക്ക് പാഠത്തിലെ പരോക്ഷപ്രയോഗം സംരക്ഷിക്കുന്നത് വ്യാഖ്യാനം പാഠത്തിലേക്ക് ചേർക്കാതിരിക്കാൻ സഹായിക്കുന്നു.
- issue: ആദാം τύπος ആകുന്നതിന്റെ സ്വഭാവം
  choice: ‘പ്രതിരൂപം’ എന്നു നൽകുന്നു.
  alternative: ‘മാതൃക’ അല്ലെങ്കിൽ ‘മുൻസൂചന’ എന്നു നൽകുക.
  rationale: ആദാം ക്രിസ്തുവിനോട് എല്ലാ കാര്യത്തിലും ഒരുപോലെയാണെന്ന ധാരണ ഒഴിവാക്കി, പൗലോസ് സ്ഥാപിക്കുന്ന typological correspondence തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മരണത്തിന്റെ രാജവാഴ്ച എന്ന രൂപകം ‘മരണം വാണു’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തി. ബന്ധവാക്യത്തിലെ ആശയക്കുഴപ്പം കുറയ്ക്കാൻ അവസാന ഭാഗം സ്വതന്ത്രവാക്യമാക്കി; [a], [b] അടിക്കുറിപ്പുകൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്ക് പിന്നാലെ ചേർത്തു.
