base_translation:
  language: en
  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: ml
  text: ദൈവം തിരഞ്ഞെടുത്തവർക്കെതിരെ ആർ കുറ്റം ചുമത്തും? നീതിമാന്മാരെന്ന് പ്രഖ്യാപിക്കുന്നത് ദൈവമാണ്.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'മറ്റൊരു പരിഭാഷ: “ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവർ.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “ദൈവം തിരഞ്ഞെടുത്തവരെ ആർ കുറ്റപ്പെടുത്തും?”'
    reason: lexical_alternative
  - marker: c
    text: '“നീതിമാന്മാരെന്ന് പ്രഖ്യാപിക്കുന്നത്” എന്നതിന് ഇവിടെ ന്യായാസനപരമായ അർഥമുണ്ട്: നീതിമാന്മാർ എന്നു വിധി പ്രസ്താവിക്കുന്നത് ദൈവമാണ്.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: ആർ
  rationale: നിയമപരമായ പശ്ചാത്തലത്തിലുള്ള അലങ്കാരചോദ്യത്തിന് നേരിട്ടും സ്വാഭാവികവുമായ മലയാളരൂപം.
- source_word: ἐγκαλέσει
  choice: കുറ്റം ചുമത്തും
  rationale: വെറും കുറ്റപ്പെടുത്തൽ എന്നതിലുപരി ഒരാൾക്കെതിരെ ഔപചാരികമായി കുറ്റാരോപണം ഉന്നയിക്കുന്ന നിയമപരമായ ഭാവം വ്യക്തമാക്കുന്നു.
- source_word: κατὰ
  choice: എതിരെ
  rationale: കുറ്റാരോപണത്തെ സൂചിപ്പിക്കുന്ന ക്രിയയോടൊപ്പം വരുന്ന κατάയുടെ പ്രതിപക്ഷാർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκλεκτῶν θεοῦ
  choice: ദൈവം തിരഞ്ഞെടുത്തവർ
  rationale: സാരവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വിശേഷണത്തിന്റെ അർഥം സാധാരണ വായനക്കാർക്ക് സുതാര്യമാക്കുകയും പിൽക്കാല സാങ്കേതിക ദൈവശാസ്ത്രപദം അനാവശ്യമായി ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: θεὸς ὁ δικαιῶν
  choice: നീതിമാന്മാരായി പ്രഖ്യാപിക്കുന്നത് ദൈവമാണ്
  rationale: മുൻനിറുത്തിയ θεός എന്ന പദത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; δικαιόωയുടെ ഈ സന്ദർഭത്തിലെ ന്യായാസനപരമായ അർഥവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐκλεκτῶν എന്ന പദം പിൽക്കാല തിരഞ്ഞെടുപ്പ്-സിദ്ധാന്തങ്ങളിലൊന്നിലേക്ക് ചുരുക്കാതെ പരിഭാഷപ്പെടുത്തൽ
  choice: ദൈവം തിരഞ്ഞെടുത്തവർ
  alternative: ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവർ
  rationale: ദൈവത്തിന്റെ തിരഞ്ഞെടുപ്പിനെ വാചകം പറയുന്നതുപോലെ നിലനിർത്തുന്നു; എന്നാൽ ഏതെങ്കിലും പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനത്തിന്റെ സാങ്കേതിക പദാവലി അടിച്ചേൽപ്പിക്കുന്നില്ല.
- issue: δικαιῶν എന്നതിന്റെ അർഥം
  choice: നീതിമാന്മാരായി പ്രഖ്യാപിക്കുന്നത്
  alternative: നീതീകരിക്കുന്നത്
  rationale: ഈ ഭാഗത്തെ ന്യായാസനപരമായ രൂപകം തുറന്നുകാട്ടി, ദൈവം അനുകൂലവിധി പ്രഖ്യാപിക്കുന്നു എന്ന ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- issue: θεὸς ὁ δικαιῶν എന്ന ഖണ്ഡത്തിന്റെ വാക്യസ്വഭാവം
  choice: “നീതിമാന്മാരായി പ്രഖ്യാപിക്കുന്നത് ദൈവമാണ്” എന്ന ഉത്തരവാക്യം
  alternative: “നീതിമാന്മാരായി പ്രഖ്യാപിക്കുന്ന ദൈവമോ?” എന്ന തുടർ അലങ്കാരചോദ്യം
  rationale: റോമർ 8:34-ലെ തുടർന്നുള്ള ചോദ്യവുമായി ചേർന്ന് വായിക്കുമ്പോൾ ഉത്തരവാക്യം പ്രസക്തവും സ്വാഭാവികവുമാണ്; എങ്കിലും ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളുടെ ആദിമ വിരാമചിഹ്നരഹിത സ്വഭാവം കാരണം ചോദ്യമായി വായിക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, ഔപചാരികതയും സാധാരണ വായനാസൗകര്യവും സമതുലിതമാക്കി. “കുറ്റം ചുമത്തും” എന്ന പ്രയോഗം കോടതിസംബന്ധമായ ഭാവം നിലനിർത്തുന്നു; “നീതിമാന്മാരായി പ്രഖ്യാപിക്കുന്നത്” എന്നത് സാങ്കേതികമായ “നീതീകരിക്കുന്നു” എന്ന പദത്തേക്കാൾ സുതാര്യമാണ്.
