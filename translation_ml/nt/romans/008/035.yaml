id: ROM.8.35
reference: Romans 8:35
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: ml
  text: മശീഹയുടെ സ്നേഹത്തിൽനിന്ന് നമ്മെ ആർ വേർപെടുത്തും? കഷ്ടതയോ ദുരിതമോ പീഡനമോ ക്ഷാമമോ വസ്ത്രമില്ലായ്മയോ അപകടമോ വാളോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “മശീഹയോടുള്ള നമ്മുടെ സ്നേഹത്തിൽനിന്ന്.” ഗ്രീക്ക് ജനിറ്റീവ് ഇങ്ങനെയും വായിക്കാം; എങ്കിലും സന്ദർഭം “മശീഹയുടെ നമ്മോടുള്ള സ്നേഹം” എന്ന അർഥത്തെയാണ് കൂടുതൽ പിന്തുണയ്ക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: ആർ
  rationale: വ്യക്തിയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ചോദകസർവനാമവും പൗലോസിന്റെ പ്രഭാവമുള്ള അലങ്കാരചോദ്യവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: χωρίσει
  choice: വേർപെടുത്തുക
  rationale: ഭാവിയിലോ സാധ്യതയിലോ സംഭവിക്കാവുന്ന വേർതിരിക്കലിനെ മലയാളത്തിൽ സ്വാഭാവികമായ ചോദ്യരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: ἀγάπης
  choice: സ്നേഹം
  rationale: ἀγάπη എന്ന പദത്തിന്റെ സാധാരണവും ഗൗരവമുള്ളതുമായ മലയാള സമാനപദം.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹയുടെ
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി; സന്ദർഭം സൂചിപ്പിക്കുന്ന കർത്തൃജനിറ്റീവ് മുഖ്യവായനയായി സ്വീകരിച്ചു.
- source_word: θλῖψις
  choice: കഷ്ടത
  rationale: സമ്മർദവും ക്ലേശവും ഉൾക്കൊള്ളുന്ന വിശാലമായ അർഥം സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: στενοχωρία
  choice: ദുരിതം
  rationale: ഞെരുക്കവും കടുത്ത ബുദ്ധിമുട്ടും സൂചിപ്പിക്കുന്ന, ‘കഷ്ടത’യിൽനിന്ന് വേർതിരിച്ചറിയാവുന്ന സ്വാഭാവിക പദം.
- source_word: διωγμός
  choice: പീഡനം
  rationale: വിരോധത്തിന്റെ പേരിൽ പിന്തുടർന്ന് ഉപദ്രവിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതവും കൃത്യവുമായ പരിഭാഷ.
- source_word: λιμός
  choice: ക്ഷാമം
  rationale: വ്യക്തിപരമായ വിശപ്പിനെക്കാൾ ഗുരുതരമായ ആഹാരദൗർലഭ്യമാണ് ഗ്രീക്ക് പദം സൂചിപ്പിക്കുന്നത്.
- source_word: γυμνότης
  choice: വസ്ത്രമില്ലായ്മ
  rationale: അക്ഷരാർഥം വ്യക്തമാക്കുകയും ആധുനിക വായനക്കാർക്ക് ദാരിദ്ര്യജന്യമായ വസ്ത്രാഭാവം സ്വാഭാവികമായി മനസ്സിലാക്കാൻ സഹായിക്കുകയും ചെയ്യുന്നു.
- source_word: κίνδυνος
  choice: അപകടം
  rationale: ജീവനും സുരക്ഷയ്ക്കും ഭീഷണിയായ അവസ്ഥയെ ആധുനിക മലയാളത്തിൽ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: μάχαιρα
  choice: വാൾ
  rationale: മാരകമായ അക്രമഭീഷണിയുടെ മൂർത്തമായ ഗ്രീക്ക് ദൃശ്യരൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: τοῦ Χριστοῦ എന്ന ജനിറ്റീവിന്റെ അർഥബന്ധം
  choice: മശീഹയുടെ നമ്മോടുള്ള സ്നേഹം
  alternative: മശീഹയോടുള്ള നമ്മുടെ സ്നേഹം
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് സിദ്ധാന്തപരമായി രണ്ടുവിധം വായിക്കാമെങ്കിലും റോമർ 8:31–39-ന്റെ സന്ദർഭം വിശ്വാസികളോടുള്ള മശീഹയുടെ സ്നേഹത്തെ ശക്തമായി പിന്തുണയ്ക്കുന്നു; മറുവായന അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ചോദ്യത്തിന്റെ അലങ്കാരബലം നിലനിർത്തി; പട്ടിക സംക്ഷിപ്തവും ശ്രവ്യവുമാക്കി.
