id: ROM.8.14
reference: Romans 8:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ ആത്മാവിനാൽ നയിക്കപ്പെടുന്നവരൊക്കെയും അവരാണ് ദൈവത്തിന്റെ പുത്രന്മാർ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ദൈവത്തിന്റെ മക്കൾ.’ ‘പുത്രന്മാർ’ എന്നത് ഗ്രീക്കിലെ പദപ്രയോഗവും ഈ സന്ദർഭത്തിലെ പുത്രസ്വീകാരത്തിന്റെയും അവകാശത്തിന്റെയും സൂചനയും നിലനിർത്തുന്നു; ഇതിൽ സ്ത്രീകളും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: നയിക്കപ്പെടുന്നവരൊക്കെയും
  rationale: ബഹുവചനത്തിലുള്ള സാർവത്രിക വിഭാഗാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയത്തെ വിശദീകരിക്കുന്ന ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: πνεύματι θεοῦ
  choice: ദൈവത്തിന്റെ ആത്മാവിനാൽ
  rationale: ἄγονται എന്ന ക്രിയയോടു ചേർന്ന കരണമൂലക ദാതിവ് അർഥം നിലനിർത്തുകയും ‘ദൈവത്തിന്റെ ആത്മാവ്’ എന്ന പൗലോസിന്റെ പ്രയോഗം നേരിട്ട് പകരുകയും ചെയ്യുന്നു.
- source_word: ἄγονται
  choice: നയിക്കപ്പെടുന്ന
  rationale: വർത്തമാനകാല കർമണിപ്രയോഗത്തിന്റെ തുടർച്ചാസൂചന അമിതമായി വിശദീകരിക്കാതെ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: οὗτοι
  choice: അവരാണ്
  rationale: ഗ്രീക്കിലെ സൂചകസർവനാമത്തിന്റെ ഊന്നൽ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: υἱοί
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായ പുല്ലിംഗ ബഹുവചനം സംരക്ഷിക്കുകയും റോമർ 8-ലെ പുത്രസ്വീകാരത്തിന്റെയും അവകാശത്തിന്റെയും ആശയബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: രണ്ടിടത്തുമുള്ള ജനിറ്റീവ് ബന്ധം സുതാര്യമായും ആവർത്തനം നിലനിർത്തിയും പകരുന്നു.
theological_decisions:
- issue: υἱοί θεοῦ എന്നത് ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ എന്നോ കൂടുതൽ ഉൾക്കൊള്ളുന്ന പ്രയോഗത്തിലോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്.
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  alternative: ദൈവത്തിന്റെ മക്കൾ
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ബഹുവചനവും ഈ സന്ദർഭത്തിലെ പുത്രസ്വീകാര-അവകാശ സൂചനയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; ഇവിടെ സ്ത്രീകളും ഉൾപ്പെടുന്നുവെന്ന അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അവരാണ്’ എന്ന പ്രയോഗം οὗτοι എന്നതിന്റെ ഊന്നൽ നിലനിർത്തുന്നു; ‘പുത്രന്മാർ’ എന്നതിന്റെ ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിക്കുന്നു.
