id: ROM.8.18
reference: Romans 8:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ഇപ്പോഴത്തെ കാലത്തെ കഷ്ടതകൾ നമുക്കു[a] വെളിപ്പെടാനിരിക്കുന്ന മഹത്ത്വത്തോടു താരതമ്യം ചെയ്യാൻ തക്കവയല്ല എന്നു ഞാൻ കരുതുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നമ്മിൽ വെളിപ്പെടാനിരിക്കുന്ന.”
    reason: εἰς ἡμᾶς എന്ന ഗ്രീക്ക് പ്രയോഗം ‘നമുക്കു’ എന്നതിനൊപ്പം ‘നമ്മിൽ’ എന്നും അർഥമാക്കാൻ കഴിയും.
lexical_decisions:
- source_word: Λογίζομαι
  choice: ഞാൻ കരുതുന്നു
  rationale: വെറുമൊരു തോന്നലല്ല, ആലോചിച്ചുള്ള വിലയിരുത്തലാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്; ആ അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻപ്രസ്താവനയ്ക്കുള്ള വിശദീകരണമോ അടിസ്ഥാനമോ അവതരിപ്പിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: οὐκ ἄξια ... πρὸς
  choice: താരതമ്യം ചെയ്യാൻ തക്കവയല്ല
  rationale: ἄξιαയും πρὸςഉം ചേർന്നുള്ള അസമമായ താരതമ്യത്തിന്റെ ആശയം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ παθήματα
  choice: കഷ്ടതകൾ
  rationale: അനുഭവിക്കുന്ന ദുരിതങ്ങളെയും യാതനകളെയും സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ പദം.
- source_word: τοῦ νῦν καιροῦ
  choice: ഇപ്പോഴത്തെ കാലത്തെ
  rationale: നിലവിലെ സമയഘട്ടം എന്ന അർഥം അനാവശ്യമായ യുഗസംബന്ധമായ വ്യാഖ്യാനം ചേർക്കാതെ നൽകുന്നു.
- source_word: τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι
  choice: വെളിപ്പെടാനിരിക്കുന്ന മഹത്ത്വം
  rationale: μέλλουσαν എന്ന ഭാവിസൂചനയും ἀποκαλυφθῆναι എന്ന നിഷ്ക്രിയ വെളിപ്പെടുത്തൽ ആശയവും സ്വാഭാവികമായ ഒരു മലയാള പ്രയോഗത്തിൽ ഒരുമിച്ചു സംരക്ഷിക്കുന്നു.
- source_word: εἰς ἡμᾶς
  choice: നമുക്കു
  rationale: മഹത്ത്വം വിശ്വാസികൾക്കു വെളിപ്പെടുത്തപ്പെടുന്നു എന്ന ദിശാസൂചന നൽകുന്നു; ‘നമ്മിൽ’ എന്ന പങ്കാളിത്തപരമായ സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: εἰς ἡμᾶς എന്ന പ്രയോഗത്തിൽ മഹത്ത്വം വെളിപ്പെടുന്നതിന്റെ ബന്ധം
  choice: നമുക്കു
  alternative: നമ്മിൽ
  rationale: ഗ്രീക്ക് പ്രയോഗം ‘നമുക്കു’ എന്നും ‘നമ്മിൽ’ എന്നും അടുത്ത ബന്ധമുള്ള രണ്ട് രീതിയിൽ ഗ്രഹിക്കാം. പ്രധാന പാഠത്തിൽ സ്വാഭാവികമായ ദിശാസൂചന സ്വീകരിച്ചെങ്കിലും, വ്യാഖ്യാനപരവും ദൈവശാസ്ത്രപരവുമായി പ്രസക്തമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ യുക്തിപരമായ ബന്ധവും താരതമ്യത്തിന്റെ ശക്തിയും നിലനിർത്തിക്കൊണ്ട്, മലയാളത്തിൽ അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
