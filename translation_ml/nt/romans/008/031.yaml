id: ROM.8.31
reference: Romans 8:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: ml
  text: അപ്പോൾ, ഈ കാര്യങ്ങളെക്കുറിച്ച് നാം എന്തു പറയും?[a] ദൈവം നമുക്കുവേണ്ടിയാണെങ്കിൽ,[b] നമുക്ക് എതിരായി ആർ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഈ കാര്യങ്ങളോട് പ്രതികരിച്ച് നാം എന്തു പറയും?’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവം നമുക്കുവേണ്ടിയായതിനാൽ, നമുക്ക് എതിരായി ആർ?’ ഇവിടെ ‘എങ്കിൽ’ എന്നത് സംശയം പ്രകടിപ്പിക്കുന്നതല്ല; സത്യമായി അംഗീകരിച്ച കാര്യം മുൻനിർത്തിയുള്ള അലങ്കാരപ്രശ്നമാണ്.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: അപ്പോൾ ... നാം എന്തു പറയും?
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനപരമായ മാറ്റം സൂചിപ്പിക്കുന്നു; ഭാവികാല ക്രിയയായ ἐροῦμεν ഇവിടെ ആലോചനാത്മകവും അലങ്കാരപ്രശ്നാത്മകവുമായ അർത്ഥത്തിലാണ്. ‘അപ്പോൾ ... നാം എന്തു പറയും?’ എന്നത് ഈ ശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πρὸς ταῦτα
  choice: ഈ കാര്യങ്ങളെക്കുറിച്ച്
  rationale: πρός ഇവിടെ മുമ്പ് പറഞ്ഞ കാര്യങ്ങളോടുള്ള ബന്ധമോ പ്രതികരണമോ സൂചിപ്പിക്കുന്നു. അക്ഷരാർഥത്തോട് ചേർന്ന ‘ഈ കാര്യങ്ങളോട്’ എന്നതിനെക്കാൾ ‘ഈ കാര്യങ്ങളെക്കുറിച്ച്’ സാധാരണ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്; പ്രതികരണത്തിന്റെ സൂക്ഷ്മത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: ദൈവം നമുക്കുവേണ്ടിയാണെങ്കിൽ
  rationale: εἰ എന്ന വ്യവസ്ഥാസൂചകം ‘എങ്കിൽ’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു. ὑπέρ ഈ സന്ദർഭത്തിൽ അനുകൂല നിലപാടിനെയും പിന്തുണയെയും സൂചിപ്പിക്കുന്നതിനാൽ ‘നമുക്കുവേണ്ടി’ എന്ന് വിവർത്തനം ചെയ്തു.
- source_word: τίς καθ’ ἡμῶν
  choice: നമുക്ക് എതിരായി ആർ?
  rationale: κατά + genitive എതിർപ്പിനെ സൂചിപ്പിക്കുന്നു. τίς ചേർന്ന് വിജയോത്സുകമായ അലങ്കാരപ്രശ്നം സൃഷ്ടിക്കുന്നതിനാൽ ചുരുക്കവും ശക്തവുമായ ഈ മലയാളരൂപം തിരഞ്ഞെടുത്തു.
theological_decisions:
- issue: εἰ ὁ θεὸς ὑπὲρ ἡμῶν എന്നതിലെ വ്യവസ്ഥയുടെ ശക്തി
  choice: മുഖ്യപാഠത്തിൽ ‘ദൈവം നമുക്കുവേണ്ടിയാണെങ്കിൽ’
  alternative: ‘ദൈവം നമുക്കുവേണ്ടിയായതിനാൽ’ അഥവാ ‘ദൈവം നമുക്കുവേണ്ടിയാണല്ലോ’
  rationale: ഗ്രീക്കിലെ εἰ എന്ന രൂപം സംരക്ഷിക്കാൻ ‘എങ്കിൽ’ ഉപയോഗിച്ചു. സന്ദർഭത്തിൽ ഇത് ദൈവത്തിന്റെ അനുകൂലതയെ സംശയിക്കുന്നതല്ല, സത്യമായി അംഗീകരിച്ച അടിസ്ഥാനത്തിൽ ഉയരുന്ന അലങ്കാരപ്രശ്നമാണ്; ആ അർത്ഥശക്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ നിഗമനപരമായ മാറ്റവും തുടർന്നുള്ള വിജയോത്സുക അലങ്കാരപ്രശ്നവും ചുരുക്കത്തോടെ നിലനിർത്തി.
