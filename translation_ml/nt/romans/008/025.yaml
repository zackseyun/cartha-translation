  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: ml
  text: എന്നാൽ നാം കാണാത്തതിനെ പ്രത്യാശിക്കുന്നുവെങ്കിൽ, സഹിഷ്ണുതയോടെ അതിനായി കാത്തിരിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്ഥിരോത്സാഹത്തോടെ.”
    reason: lexical_alternative
  - marker: b
    text: ക്രിയയ്ക്ക് “ആകാംക്ഷയോടെ കാത്തിരിക്കുക” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ … എങ്കിൽ
  rationale: εἰയുടെ നിബന്ധനാഭാവവും δέയുടെ മൃദുവായ വൈരുധ്യ/തുടർച്ചാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ οὐ βλέπομεν
  choice: കാണാത്തതിനെയാണ്
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘കാണാൻ കഴിയാത്തത്’ എന്നു പറഞ്ഞ് കഴിവില്ലായ്മയുടെ ആശയം ചേർക്കുന്നില്ല.
- source_word: ἐλπίζομεν
  choice: നാം പ്രത്യാശിക്കുന്നു
  rationale: വർത്തമാനകാലത്തെ തുടർച്ചയായ പ്രത്യാശയും ഭാവിയിലേക്കുള്ള പ്രതീക്ഷയും നിലനിർത്തുന്നു.
- source_word: δι’ ὑπομονῆς
  choice: സഹനസ്ഥിരതയോടെ
  rationale: ὑπομονήയിലെ ക്ഷമയോടെയുള്ള സഹനവും പ്രയാസത്തിനിടയിലെ സ്ഥിരതയും ഒരുമിച്ച് പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀπεκδεχόμεθα
  choice: അതിനായി ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു
  rationale: ക്രിയയിലെ പ്രതീക്ഷയോടെയും ഉറ്റുനോക്കിയും കാത്തിരിക്കുന്ന ഭാവം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: കാണാത്ത ഭാവിനിവൃത്തിയോടുള്ള ക്രൈസ്തവ പ്രത്യാശയുടെ സൂചന
  choice: ഗ്രീക്ക് ബന്ധവാക്യം പറയുന്നതുപോലെ വസ്തുവിനെ ‘കാണാത്തത്’ എന്ന നിലയിൽ മാത്രം നിലനിർത്തി.
  alternative: സന്ദർഭത്തെ അടിസ്ഥാനമാക്കി രക്ഷ, വീണ്ടെടുപ്പ്, അല്ലെങ്കിൽ പുനരുത്ഥാനം എന്നു വ്യക്തമാക്കുക.
  rationale: സമീപസന്ദർഭം സൂചന നൽകുന്നുവെങ്കിലും ഈ വാക്യം പ്രത്യാശയുടെ വസ്തുവിനെ പ്രത്യേകം നിർവചിക്കുന്നില്ല; അതിനാൽ ഉള്ളടക്കത്തിലെ സംയമനവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘സഹനസ്ഥിരത’ ὑπομονήയുടെ ക്ഷമയും ദൃഢതയും ചുരുക്കമായി വഹിക്കുന്നു; പാദക്കുറിപ്പുകൾ മുഖ്യവാചകത്തിലെ [a], [b] അടയാളങ്ങളുമായി പൊരുത്തപ്പെടുന്നു.
