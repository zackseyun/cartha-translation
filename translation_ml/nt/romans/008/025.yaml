revisions:
- from: എന്നാൽ കാണാത്തതിനെയാണ് നാം പ്രത്യാശിക്കുന്നതെങ്കിൽ, സഹനസ്ഥിരതയോടെ അതിനായി ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.[a][b]
  to: എന്നാൽ നാം കാണാത്തതിനെ പ്രത്യാശിക്കുന്നുവെങ്കിൽ, സഹിഷ്ണുതയോടെ അതിനായി കാത്തിരിക്കുന്നു.[a][b]
  rationale: The revision retains the conditional and mildly contrasting force of εἰ δέ, explicitly represents the first-person plural in οὐ βλέπομεν, and preserves the present ongoing force of the two verbs. It avoids placing the eager-expectant nuance of ἀπεκδεχόμεθα in the main line, where it is best treated as a lexical alternative, consistent with the English audit trail. Footnote anchors remain valid and correspond to the relevant expressions.
