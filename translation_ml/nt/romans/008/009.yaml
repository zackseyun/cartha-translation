  terminology: ‘ജഡം,’ ‘ആത്മാവ്,’ ‘വസിക്കുന്നു,’ ‘മശിഹാ’ എന്നിവ സ്ഥിരതയുള്ളതും സന്ദർഭോചിതവുമാണ്. ‘അവന്റേതല്ല’ ഗ്രീക്കിലെ αὐτοῦ-വിന്റെ അവ്യക്തത സംരക്ഷിക്കുന്ന ഉചിതമായ രൂപമാണ്.
  issues:
