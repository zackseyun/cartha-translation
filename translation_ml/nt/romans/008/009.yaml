id: ROM.8.9
reference: Romans 8:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: ml
  text: എന്നാൽ നിങ്ങൾ ജഡത്തിലല്ല, ആത്മാവിലാണ്[a]—തീർച്ചയായും ദൈവത്തിന്റെ ആത്മാവ് നിങ്ങളിൽ വസിക്കുന്നുവെങ്കിൽ. എന്നാൽ മശിഹായുടെ ആത്മാവ്[b] ഇല്ലാത്ത ആരും അവന്റേതല്ല[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘പാപസ്വഭാവത്തിലല്ല, ആത്മാവിലാണ്.’ ഗ്രീക്കിൽ അക്ഷരാർഥം: ‘ജഡത്തിലല്ല.’'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ക്രിസ്തുവിന്റെ ആത്മാവ്.’
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥം: ‘അവന്റേതല്ല.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ ‘ജഡം’ എന്ന മുഖ്യപദവും, ശരീരം എന്നതിലുപരി ഒരു അസ്തിത്വമണ്ഡലത്തെ സൂചിപ്പിക്കുന്ന അതിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: തുടർന്നുള്ള ‘ദൈവത്തിന്റെ ആത്മാവ്’, ‘മശിഹായുടെ ആത്മാവ്’ എന്നീ നിർദേശങ്ങൾ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: οἰκεῖ
  choice: വസിക്കുന്നു
  rationale: സ്ഥിരമായി പാർക്കുക എന്ന അന്തർവാസത്തിന്റെ ഭാവം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Χριστοῦ
  choice: മശിഹായുടെ
  rationale: Χριστός ഇവിടെ പദവിയായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ ‘മശിഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: അവന്റേതല്ല
  rationale: ഗ്രീക്കിലെ ഉടമസ്ഥതാസൂചകമായ സംക്ഷിപ്ത പ്രയോഗം നേരിട്ട് നിലനിർത്തുകയും സർവനാമത്തിന്റെ സൂചനാവ്യക്തിയെ അമിതമായി വ്യക്തമാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἴπερ
  choice: വാസ്തവമായി ... എങ്കിൽ
  rationale: നിബന്ധനാരൂപവും വാദപ്രകാരം സത്യമെന്നു കരുതുന്ന ഊന്നലും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു.
- source_word: Ὑμεῖς
  choice: നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ വ്യക്തമായി പറഞ്ഞിരിക്കുന്ന ബഹുവചന സർവനാമവും അതിന്റെ വൈരുധ്യാത്മക ഊന്നലും നിലനിർത്തുന്നു.
- source_word: οὗτος
  choice: ആരും
  rationale: ‘τις ... οὗτος’ എന്ന ഗ്രീക്ക് ഘടന മലയാളത്തിൽ സ്വാഭാവികമായി ‘ഇല്ലാത്ത ആരും’ എന്നു നൽകി; എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന പ്രതിനിധിക ഏകവചനബലം നിലനിൽക്കുന്നു.
theological_decisions:
- issue: ‘ജഡത്തിൽ’ എന്നും ‘ആത്മാവിൽ’ എന്നും ഉള്ള പൗലോസിന്റെ വൈരുധ്യം
  choice: പരിശുദ്ധാത്മാവിന്റെ അന്തർവാസവുമായി ബന്ധപ്പെട്ട അസ്തിത്വമണ്ഡല ഭാഷയായി നിലനിർത്തി; ‘ജഡം’ എന്ന പദം മാറ്റിയില്ല
  alternative: ‘പാപസ്വഭാവത്തിൽ’ എന്നും ‘ആത്മാവിനാൽ നിയന്ത്രിക്കപ്പെടുന്ന ജീവിതത്തിൽ’ എന്നും വ്യാഖ്യാനിച്ച് പറയുക
  rationale: വാക്യം പൗലോസിന്റെ പ്രധാന ദൈവശാസ്ത്രപദങ്ങൾ ഉപയോഗിക്കുന്നു; അവയെ വ്യാഖ്യാനപരമായ പരാവർത്തനത്തിലൂടെ ചുരുക്കുന്നത് യഥാർഥ പിരിമുറുക്കം നഷ്ടപ്പെടുത്തും.
- issue: ‘അവന്റേതല്ല’ എന്നതിലെ സർവനാമത്തിന്റെ സൂചനാവ്യക്തി
  choice: മലയാളത്തിലും സർവനാമമായി നിലനിർത്തി; അടുത്തുള്ള സൂചനാവ്യക്തി മശിഹായാണ്
  alternative: ‘ദൈവത്തിന്റേതല്ല’ അല്ലെങ്കിൽ ‘മശിഹായുടേതല്ല’ എന്ന് വ്യക്തമായി ചേർക്കുക
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണപരമായ സൂചനാവ്യക്തി മശിഹായാണെങ്കിലും, ഗ്രീക്ക് സർവനാമത്തെക്കാൾ അധികമായി പരിഭാഷ വ്യക്തമാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജഡം’, ‘ആത്മാവ്’, ‘വസിക്കുന്നു’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യഘടന മലയാളവായനയ്ക്ക് അനുസൃതമായി ലളിതമാക്കി.
