id: ROM.8.15
reference: Romans 8:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: ml
  text: എന്തെന്നാൽ, വീണ്ടും ഭയത്തിലേക്കു നയിക്കുന്ന അടിമത്തത്തിന്റെ ആത്മാവിനെയല്ല നിങ്ങൾ സ്വീകരിച്ചത്; മറിച്ച്, ദത്തുപുത്രത്വത്തിന്റെ ആത്മാവിനെയാണ്[a] നിങ്ങൾ സ്വീകരിച്ചത്. ആ ആത്മാവിൽ[b] നാം, “അബ്ബാ! പിതാവേ!” എന്നു നിലവിളിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ദത്തുപുത്രത്വം’ എന്നത് ദത്തെടുക്കപ്പെടുന്നതും പുത്രന്മാരുടെ നിയമപരമായ സ്ഥാനവും അവകാശവും ലഭിക്കുന്നതും സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ഈ ‘ആത്മാവ്’ പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി വായിക്കാം.
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: അക്ഷരാർഥത്തിൽ ‘അതിൽ/അവനിൽ’; ‘ആ ആത്മാവിനാൽ’ എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: അടിമത്തത്തിന്റെ ആത്മാവ്
  rationale: δουλείαയിലെ അടിമബന്ധത്തിന്റെ ശക്തി നിലനിർത്തുകയും തുടർന്നുള്ള ദത്തുപുത്രത്വവുമായി ഉള്ള സമാന്തരവിരോധം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: πάλιν εἰς φόβον
  choice: വീണ്ടും ഭയത്തിലേക്കു നയിക്കുന്ന
  rationale: πάλιν എന്നതിലെ ‘വീണ്ടും’ എന്ന ആശയവും εἰς φόβον എന്നതിലെ ദിശ/ഫല ആശയവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πνεῦμα υἱοθεσίας
  choice: ദത്തുപുത്രത്വത്തിന്റെ ആത്മാവ്
  rationale: υἱοθεσίαയിലെ നിയമപരമായ ദത്തെടുക്കലും പുത്രസ്ഥാനവും ഒരുമിച്ച് സൂചിപ്പിക്കുന്നു; πνεῦμα വ്യക്തിപരമായ പരിശുദ്ധാത്മാവിനെയാണോ ലഭിച്ച മനോഭാവത്തെയാണോ സൂചിപ്പിക്കുന്നത് എന്ന വ്യാകരണ-സന്ദർഭ പിരിമുറുക്കം പൂർണമായി തീർപ്പാക്കുന്നില്ല.
- source_word: ἐν ᾧ
  choice: ആ ആത്മാവിൽ
  rationale: ഗ്രീക്കിലെ ἐν എന്ന മുൻനിലപദത്തിന്റെ രൂപം കാത്തുസൂക്ഷിക്കുകയും ‘അവനാൽ’ എന്ന വ്യക്തിപരവും ഉപകരണാർഥവുമായ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ നിർബന്ധിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κράζομεν
  choice: നിലവിളിക്കുന്നു
  rationale: ക്രിയയുടെ ശക്തവും വികാരതീവ്രവുമായ വിളിയുടെ സ്വഭാവം നൽകുന്നു.
- source_word: Αββα ὁ πατήρ
  choice: “അബ്ബാ! പിതാവേ!”
  rationale: അരമായ രൂപമായ Αββα ലിപ്യന്തരം ചെയ്യുകയും ὁ πατήρനെ നേരിട്ടുള്ള സംബോധനയായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα υἱοθεσίας എന്നത് പരിശുദ്ധാത്മാവിനെ വ്യക്തമായി സൂചിപ്പിക്കുന്നുവോ, അതോ ദത്തുപുത്രത്വവുമായി ബന്ധപ്പെട്ട ‘ആത്മാവ്/മനോഭാവം’ എന്ന സമാന്തര പ്രയോഗമാണോ
  choice: മുഖ്യവാചകത്തിൽ ‘ദത്തുപുത്രത്വത്തിന്റെ ആത്മാവ്’ എന്നു നൽകി സന്ദർഭത്തിലെ വ്യക്തിപരമായ സൂചന തുറന്നുവെച്ചു.
  alternative: ‘ദത്തുപുത്രത്വം നൽകുന്ന പരിശുദ്ധാത്മാവ്’
  rationale: റോമർ 8-ന്റെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നുവെങ്കിലും, ലേഖനത്തിലെ ‘അടിമത്തത്തിന്റെ ആത്മാവ്’ / ‘ദത്തുപുത്രത്വത്തിന്റെ ആത്മാവ്’ എന്ന സമാന്തരഘടനയെ വിശദീകരണപരമായ വിവർത്തനംകൊണ്ട് ഇല്ലാതാക്കാതിരിക്കാൻ.
- issue: ἐν ᾧയുടെ വ്യക്തിപരമോ ഉപകരണാർഥമോ ആയ വ്യാഖ്യാനം
  choice: ‘ആ ആത്മാവിൽ’
  alternative: ‘ആ ആത്മാവിനാൽ’ അഥവാ ‘അവനാൽ’
  rationale: ‘അവനാൽ’ എന്നത് പരിശുദ്ധാത്മാവെന്ന വ്യക്തിപരമായ വായന വ്യക്തമാക്കുന്നു; എന്നാൽ ഗ്രീക്ക് രൂപം അക്ഷരാർഥത്തിൽ ‘അതിൽ/അവനിൽ’ ആയതിനാൽ മുഖ്യവാചകം ആ രൂപവും അവ്യക്തതയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ദത്തുപുത്രത്വം’ സാങ്കേതികമായെങ്കിലും പൗലോസിന്റെ നിയമപരവും അവകാശപരവുമായ ആശയം ചുരുക്കത്തിൽ കാത്തുസൂക്ഷിക്കുന്നതിനാൽ നിലനിർത്തി; അതിന്റെ അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
