  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: ml
  text: തന്റെ സ്വന്തം പുത്രനെപ്പോലും ഒഴിവാക്കാതെ[a], നമുക്കെല്ലാവർക്കും വേണ്ടി[b] അവനെ ഏൽപ്പിച്ചുകൊടുത്ത[c] ദൈവം, അവനോടൊപ്പം സകലവും നമുക്കു കൃപയായി നൽകാതിരിക്കുമോ[d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ഒഴിവാക്കാതെ” എന്നതിന് “വിട്ടുവെക്കാതെ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: “നമുക്കെല്ലാവർക്കും വേണ്ടി” എന്നത് “നമ്മെല്ലാവരുടെയും നന്മയ്ക്കായി” എന്നും അർഥമാക്കാം.
    reason: alternative_reading
  - marker: c
    text: “ഏൽപ്പിച്ചുകൊടുത്ത” എന്നതിന് “കൈമാറിക്കൊടുത്ത” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: d
    text: “കൃപയായി നൽകുക” എന്നതിന് “ദാനമായി നൽകുക” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: ദൈവം
  rationale: മുൻസന്ദർഭത്തിലെ ദൈവത്തെയാണ് ബന്ധസർവനാമം സൂചിപ്പിക്കുന്നത്. ഗ്രീക്കിലെ ഊന്നൽ മലയാളത്തിൽ ‘സ്വന്തം പുത്രനെപ്പോലും’ എന്ന പ്രയോഗത്തിലൂടെ സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: സ്വന്തം പുത്രനെപ്പോലും
  rationale: ἴδιος സൂചിപ്പിക്കുന്ന സ്വന്തബന്ധത്തിന്റെ ശക്തി ‘സ്വന്തം’ നിലനിർത്തുന്നു; ‘പോലും’ γε-യുടെ ഊന്നലും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐφείσατο
  choice: കരുതിവെക്കാതെ
  rationale: പുത്രനെ തനിക്കായി ഒഴിച്ചുവെക്കുകയോ വിട്ടുകൊടുക്കാതിരിക്കുകയോ ചെയ്തില്ല എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു; തുടർന്നുള്ള ‘ഏല്പിച്ചുകൊടുത്ത’ എന്ന വിരുദ്ധപ്രവൃത്തിയോടും നന്നായി ചേരുന്നു.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: നമുക്കെല്ലാവർക്കുംവേണ്ടി
  rationale: ὑπέρ-ന്റെ പ്രയോജനാർഥവും പ്രതിനിധാനസാധ്യതയും സാങ്കേതിക പ്രായശ്ചിത്തഭാഷയായി ചുരുക്കാതെ നിലനിർത്തുന്നു; πάντων-ന്റെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും വ്യക്തമാക്കുന്നു.
- source_word: παρέδωκεν αὐτόν
  choice: അവനെ ഏല്പിച്ചുകൊടുത്ത
  rationale: കഷ്ടതയ്ക്കും മരണത്തിനുമായി കൈമാറിയെന്ന παραδίδωμι-യുടെ ഗൗരവം ആധുനികവും സ്വാഭാവികവുമായ മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: πῶς οὐχὶ καὶ
  choice: നൽകാതിരിക്കുമോ
  rationale: വലിയ ദാനം നൽകിയ ദൈവം ശേഷിക്കുന്നതും നൽകുമെന്ന പൗലോസിന്റെ ശക്തമായ നിഷേധാത്മക വാചാടോപചോദ്യം മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: σὺν αὐτῷ
  choice: അവനോടൊപ്പം
  rationale: പുത്രനോടുകൂടെ എന്ന σύν-ന്റെ നേരിട്ടുള്ള ബന്ധം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: τὰ πάντα
  choice: സകലവും
  rationale: പൗലോസിന്റെ വിശാലമായ പ്രയോഗം അനാവശ്യമായി പരിമിതപ്പെടുത്താതെ, ഗൗരവമുള്ള സാധാരണ മലയാളത്തിൽ നൽകുന്നു.
- source_word: χαρίσεται
  choice: കൃപയായി നൽകുക
  rationale: വെറും ‘നൽകുക’ എന്നതിനെക്കാൾ χαρίζομαι-യിലെ കൃപാപൂർവവും സൗജന്യവുമായ ദാനത്തിന്റെ ഭാവം പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ὑπὲρ ἡμῶν πάντων എന്നത് പകരക്കാരനായുള്ള മരണം എന്നു സാങ്കേതികമായി വ്യക്തമാക്കണമോ
  choice: നമുക്കെല്ലാവർക്കുംവേണ്ടി
  alternative: നമുക്കെല്ലാവർക്കും പകരമായി
  rationale: ഗ്രീക്ക് പ്രയോഗം പ്രയോജനത്തിനുവേണ്ടിയുള്ളതും പ്രതിനിധാനപരവുമായ പ്രവൃത്തിയെ ഉൾക്കൊള്ളാം; എന്നാൽ ഈ വാക്യം മാത്രം ആവശ്യപ്പെടുന്നതിനെക്കാൾ കൃത്യമായ ഒരു പ്രായശ്ചിത്തസൂത്രം വിവർത്തനത്തിൽ ചേർക്കാതിരിക്കാൻ വിശാലമായ പ്രയോഗം നിലനിർത്തുന്നു.
- issue: τὰ πάντα എന്നതിന്റെ വ്യാപ്തി വിവർത്തനത്തിൽ നിർവചിക്കണമോ
  choice: സകലവും
  alternative: നമുക്ക് ആവശ്യമായ സകലവും
  rationale: സന്ദർഭം അതിന്റെ അർഥവ്യാപ്തിയെ നിയന്ത്രിച്ചേക്കാമെങ്കിലും, ഗ്രീക്ക് വാചകം തന്നിൽ ആ നിയന്ത്രണം തുറന്നുപറയുന്നില്ല; അതിനാൽ യഥാർഥമായ വിശാലതയും വ്യാഖ്യാനാത്മക സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ വാചകരീതി. മുഖ്യവാക്യത്തിലെ നിഷേധാത്മക വാചാടോപചോദ്യം നിലനിർത്തിയിട്ടുണ്ട്. ‘പുത്രൻ’ എന്നത് യേശുവിനെ സൂചിപ്പിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ ബഹുമാനപ്രയോഗമായി ഉപയോഗിച്ചിരിക്കുന്നു; അധികമായ സിദ്ധാന്താർഥം ചേർത്തിട്ടില്ല.
