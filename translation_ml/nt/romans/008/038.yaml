  text: 'എന്തെന്നാൽ, എനിക്ക് ഉറപ്പുണ്ട്: മരണമോ ജീവനോ, ദൂതന്മാരോ അധിപതികളോ[a], ഇപ്പോഴുള്ളവയോ വരാനിരിക്കുന്നവയോ, ശക്തികളോ—ഇവയൊന്നും'
  philosophy: optimal-equivalence
