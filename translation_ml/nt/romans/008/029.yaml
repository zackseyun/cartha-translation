revisions:
- from: കാരണം, അവൻ മുൻകൂട്ടി അറിഞ്ഞവരെ[a] തന്റെ പുത്രന്റെ സ്വരൂപത്തോട് അനുരൂപരാകാൻ മുൻകൂട്ടി നിശ്ചയിക്കുകയും ചെയ്തു; അങ്ങനെ അനേകം സഹോദരന്മാരുടെ[b] ഇടയിൽ അവൻ ആദ്യജാതൻ ആകേണ്ടതിന്.
  to: എന്തെന്നാൽ, അവൻ മുൻകൂട്ടി അറിഞ്ഞവരെ തന്റെ പുത്രന്റെ സ്വരൂപത്തോട് അനുരൂപരാകേണ്ടതിന് മുൻകൂട്ടി നിശ്ചയിച്ചു; അങ്ങനെ തന്റെ പുത്രൻ അനേകം സഹോദരന്മാരുടെ[b] ഇടയിൽ ആദ്യജാതൻ ആകേണ്ടതിന്.[a]
  rationale: The main revision clarifies the grammatical relationship of predestination and conformity, and explicitly identifies the Son as the referent of the final clause. The foreknowledge note is adjusted to express the relational interpretation idiomatically while retaining it as only one possible understanding. Footnote anchors are repositioned so [a] directly qualifies ‘മുൻകൂട്ടി അറിഞ്ഞവരെ’ and [b] directly qualifies ‘സഹോദരന്മാരുടെ.’
