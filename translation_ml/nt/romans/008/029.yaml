id: ROM.8.29
reference: Romans 8:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ml
  text: എന്തെന്നാൽ, അവൻ മുൻകൂട്ടി അറിഞ്ഞവരെ തന്റെ പുത്രന്റെ സ്വരൂപത്തോട് അനുരൂപരാകേണ്ടതിന് മുൻകൂട്ടി നിശ്ചയിച്ചു; അങ്ങനെ തന്റെ പുത്രൻ അനേകം സഹോദരന്മാരുടെ[b] ഇടയിൽ ആദ്യജാതൻ ആകേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മുമ്പേ അറിഞ്ഞവരെ”; ഇവിടെ “അറിഞ്ഞു” എന്നതിന് ബന്ധപരമായ അർഥമുണ്ടെന്നും, അതായത് “മുൻകൂട്ടി അവരിലേക്കു തന്റെ ശ്രദ്ധ തിരിച്ചതിനെ” സൂചിപ്പിക്കുന്നുവെന്നും ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗമാണ്; ദൈവകുടുംബത്തിലെ സ്ത്രീകളെയും പുരുഷന്മാരെയും ഇവിടെ ഉദ്ദേശിച്ചിരിക്കാം.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: മുൻകൂട്ടി അറിഞ്ഞവരെ
  rationale: ഗ്രീക്കിലെ കാലപൂർവതയും ‘അറിയുക’ എന്ന അടിസ്ഥാനാർഥവും നിലനിർത്തുന്നു; ബന്ധപരമായ തിരഞ്ഞെടുപ്പോ കേവലമായ മുൻഅറിവോ എന്ന് വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല.
- source_word: προώρισεν
  choice: മുൻകൂട്ടി നിശ്ചയിക്കുകയും ചെയ്തു
  rationale: προ- എന്ന കാലപൂർവതയും ὁρίζω എന്ന നിർണയാർഥവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: συμμόρφους
  choice: അനുരൂപരാകാൻ
  rationale: രൂപത്തിൽ ഒത്തവരാകുക എന്ന ആശയം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു; ഉദ്ദേശിക്കപ്പെടുന്ന രൂപാന്തരവും സൂചിപ്പിക്കുന്നു.
- source_word: εἰκόνος
  choice: സ്വരൂപത്തോട്
  rationale: ‘സ്വരൂപം’ എന്നത് εἰκών എന്ന പദത്തിന്റെ രൂപസാദൃശ്യവും ബൈബിൾപരമായ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: υἱοῦ
  choice: പുത്രന്റെ
  rationale: വ്യക്തമായ പുത്രപദവിയും ക്രിസ്തുശാസ്ത്രപരമായ പ്രാധാന്യവും നേരിട്ട് സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ εἶναι
  choice: ആകേണ്ടതിന്
  rationale: ഈ ഘടനയിലെ ഉദ്ദേശ്യം/ഫലം എന്ന ഇരു നിഴലുകളും മലയാളത്തിൽ തുറന്നുവെക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്.
- source_word: πρωτότοκον
  choice: ആദ്യജാതൻ
  rationale: ‘ആദ്യം ജനിച്ചവൻ’ എന്ന രൂപകം മാറ്റിപ്പറയാതെ നിലനിർത്തുകയും അതിലെ പ്രഥമസ്ഥാനത്തിന്റെ നിഴൽ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀδελφοῖς
  choice: സഹോദരന്മാരുടെ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ ബഹുവചനം മുഖ്യപാഠത്തിൽ പ്രതിഫലിപ്പിക്കുന്നു; സ്ത്രീകളും ഉൾപ്പെടാവുന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിന് വിശദീകരണാടിസ്ഥാനം നൽകുന്ന ബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: προέγνω എന്നത് മുൻഅറിവ്/മുൻതിരഞ്ഞെടുപ്പ് സംബന്ധിച്ച തർക്കം തീർപ്പാക്കുന്ന വിധത്തിൽ പരിഭാഷപ്പെടുത്തണമോ
  choice: ‘മുൻകൂട്ടി അറിഞ്ഞവരെ’ എന്ന് പരിഭാഷപ്പെടുത്തി അർഥസാന്ദ്രത നിലനിർത്തി.
  alternative: ‘മുൻകൂട്ടി തന്റെ സ്നേഹം വെച്ചവരെ’ അല്ലെങ്കിൽ കേവല ബൗദ്ധിക മുൻഅറിവിനെ വ്യക്തമാക്കുന്ന വ്യാഖ്യാനപരമായ പദപ്രയോഗം.
  rationale: ഗ്രീക്ക് ക്രിയ തന്നെ ഉദ്ദേശിക്കുന്ന ബന്ധത്തിന്റെ കൃത്യമായ സ്വഭാവം ഇവിടെ നിർവചിക്കുന്നില്ല; അതിനാൽ വിഭാഗീയമായ വ്യാഖ്യാനം മുഖ്യപാഠത്തിൽ ചേർക്കുന്നില്ല.
- issue: ἀδελφοῖς എന്ന പുല്ലിംഗ ബഹുവചനം ലിംഗനിരപേക്ഷമായി മുഖ്യപാഠത്തിൽ നൽകണമോ
  choice: ‘സഹോദരന്മാർ’ മുഖ്യപാഠത്തിൽ നിലനിർത്തി, ഉൾക്കൊള്ളുന്ന സാധ്യത അടിക്കുറിപ്പിൽ അറിയിച്ചു.
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അല്ലെങ്കിൽ ‘ദൈവകുടുംബത്തിലെ അംഗങ്ങൾ’.
  rationale: മൂലപാഠത്തിന്റെ വ്യാകരണരൂപം കൃത്യമായി പ്രതിഫലിപ്പിക്കുമ്പോഴും ഉദ്ദേശിക്കപ്പെടുന്ന സംഘം സ്ത്രീപുരുഷന്മാരെ ഉൾക്കൊള്ളാം എന്ന വിവരം മറച്ചുവെക്കുന്നില്ല.
- issue: εἰς τὸ εἶναι ഉദ്ദേശ്യമോ ഫലമോ എന്നത് തീർപ്പാക്കണമോ
  choice: ‘ആകേണ്ടതിന്’ എന്ന പ്രയോഗം ഉപയോഗിച്ചു.
  alternative: ‘അങ്ങനെ അവൻ ... ആയി’ എന്ന ഫലകേന്ദ്രിത പരിഭാഷ.
  rationale: ഗ്രീക്ക് ഘടനയിൽ ഉദ്ദേശ്യവും ഫലവും തമ്മിലുള്ള നിഴൽ പൂർണമായി വേർതിരിക്കാനാകാത്തതിനാൽ രണ്ടിനും ഇടം നൽകുന്ന മലയാളരൂപം തിരഞ്ഞെടുത്തു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘മുൻകൂട്ടി അറിഞ്ഞു/നിശ്ചയിച്ചു,’ ‘സ്വരൂപം,’ ‘ആദ്യജാതൻ’ എന്നീ പദങ്ങൾ മൂലപാഠത്തിന്റെ ദൈവശാസ്ത്രസാന്ദ്രത സംരക്ഷിക്കുന്നു; അനാവശ്യമായി പഴഞ്ചൻ ക്രിയാരൂപങ്ങൾ ഒഴിവാക്കി.
