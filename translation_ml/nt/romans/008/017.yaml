id: ROM.8.17
reference: Romans 8:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: ml
  text: നാം മക്കളാണെങ്കിൽ, അവകാശികളുമാണ്—ദൈവത്തിന്റെ അവകാശികളും മശീഹയോടുകൂടെ സഹാവകാശികളും. നാം വാസ്തവത്തിൽ അവനോടുകൂടെ കഷ്ടം അനുഭവിക്കുന്നുവെങ്കിൽ, നാമും അവനോടുകൂടെ മഹത്ത്വീകരിക്കപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദം സൂചിപ്പിക്കാത്ത ബഹുവചനപദം; ദൈവകുടുംബത്തിലെ മക്കളുടെ നിലയും അവകാശബന്ധവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κληρονόμοι
  choice: അവകാശികൾ
  rationale: അവകാശമായി ലഭിക്കുന്നതിൽ പങ്കുള്ളവരെ സൂചിപ്പിക്കുന്ന നിയമപരവും കുടുംബപരവുമായ പദം.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തിയുടെ ബന്ധം നേരിട്ടും വ്യക്തമായും നിലനിർത്തുന്നു.
- source_word: συγκληρονόμοι
  choice: സഹാവകാശികൾ
  rationale: συν- ഉപസർഗം സൂചിപ്പിക്കുന്ന പങ്കിട്ട അവകാശസ്ഥാനം സംക്ഷിപ്തമായും കൃത്യമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹ
  rationale: അഭിഷിക്തനായ രാജാവെന്ന സ്ഥാനപ്പേരിന്റെ ഭാവം നിലനിർത്തുന്നു; മലയാളവാക്യത്തിൽ വിഭക്തിചേർത്ത് ‘മശീഹയോടൊപ്പം’ എന്നു നൽകി.
- source_word: εἴπερ
  choice: വാസ്തവത്തിൽ ... എങ്കിൽ
  rationale: യഥാർഥ നിബന്ധനയും പ്രസ്താവനയിലെ ഊന്നലും ഒരുപോലെ നിലനിർത്തുന്നു; ‘ആകയാൽ’ എന്ന ഉറപ്പിലേക്കു ദുർബലപ്പെടുത്തുന്നില്ല.
- source_word: συμπάσχομεν
  choice: അവനോടൊപ്പം കഷ്ടം അനുഭവിക്കുന്നു
  rationale: συν- ഉപസർഗത്തിലെ കൂടെപങ്കാളിത്തം സന്ദർഭത്തിൽ മശീഹയോടുള്ള ബന്ധമായി തുറന്നുപറയുന്നു.
- source_word: ἵνα
  choice: മഹത്ത്വീകരിക്കപ്പെടേണ്ടതിനാണ് അത്
  rationale: ഉദ്ദേശ്യം/ഫലം സൂചിപ്പിക്കുന്ന ബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: συνδοξασθῶμεν
  choice: അവനോടൊപ്പം മഹത്ത്വീകരിക്കപ്പെടുക
  rationale: ദൈവം നൽകുന്ന മഹത്ത്വം സ്വീകരിക്കുന്ന നിഷ്ക്രിയഭാവവും συν- സൂചിപ്പിക്കുന്ന കൂടെപങ്കാളിത്തവും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: εἴπερ συμπάσχομεν എന്നത് പ്രതിഫലം നേടുന്ന പുണ്യപ്രവൃത്തിയെയാണോ, മശീഹയോടുള്ള ഐക്യത്തിൽ പ്രതീക്ഷിക്കപ്പെടുന്ന കഷ്ടപങ്കാളിത്തത്തെയാണോ സൂചിപ്പിക്കുന്നത്
  choice: ‘നാം വാസ്തവത്തിൽ അവനോടൊപ്പം കഷ്ടം അനുഭവിക്കുന്നുവെങ്കിൽ’ എന്ന യഥാർഥ നിബന്ധനയായി പരിഭാഷപ്പെടുത്തി; കഷ്ടം മഹത്ത്വം സമ്പാദിക്കുന്നു എന്ന ആശയം ചേർത്തില്ല.
  alternative: ‘നാം അവനോടൊപ്പം കഷ്ടം അനുഭവിക്കുന്നതിനാൽ’ എന്ന കാരണവാക്യമായി ദുർബലപ്പെടുത്തുക, അല്ലെങ്കിൽ കഷ്ടാനുഭവത്തെ മഹത്ത്വത്തിനുള്ള പുണ്യാധാരമായി വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്കിൽ നിബന്ധനാഭാവം യഥാർഥമാണ്; എന്നാൽ സന്ദർഭം അവകാശം സമ്പാദിക്കുന്ന പ്രവൃത്തിയെക്കാൾ മശീഹയോടുള്ള പങ്കാളിത്തത്തെക്കുറിച്ചാണ്. അതിനാൽ ഉള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമ-കുടുംബസങ്കൽപ്പമായ ‘അവകാശികൾ’, പങ്കിട്ട നില സൂചിപ്പിക്കുന്ന ‘സഹാവകാശികൾ’, കൂടെ അനുഭവിക്കുന്ന കഷ്ടവും മഹത്ത്വവും എന്നിവ വ്യക്തമായി സൂക്ഷിച്ചു.
