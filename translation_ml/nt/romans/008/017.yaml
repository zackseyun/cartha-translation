  revision_rationale: The revision preserves the draft’s accurate lexical and theological choices but replaces the final explanatory construction with a direct Malayalam purpose clause. It explicitly includes «നാമും» for καὶ and retains the passive, shared-glory sense of συνδοξασθῶμεν without implying that suffering merits glory.
