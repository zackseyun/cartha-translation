id: ROM.8.24
reference: Romans 8:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: ml
  text: പ്രത്യാശയിലാണല്ലോ നാം രക്ഷിക്കപ്പെട്ടത്[a]. എന്നാൽ കാണപ്പെടുന്ന പ്രത്യാശ പ്രത്യാശയല്ല[b]. താൻ കാണുന്നതിനെ ആരാണ് പ്രത്യാശിക്കുന്നത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “പ്രത്യാശയാൽ നാം രക്ഷിക്കപ്പെട്ടു.”
    reason: alternative_reading
  - marker: b
    text: അതായത്, പ്രത്യാശ ഇനിയും കാണാത്തതിനെ സംബന്ധിക്കുന്നതാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: 'ഈ ദത്തിവ് ഇവിടെ മണ്ഡലമോ നിലയോ സൂചിപ്പിക്കുന്നതായി എടുത്തിരിക്കുന്നു: രക്ഷ യാഥാർഥ്യമാണെങ്കിലും അതിന്റെ പൂർണത ഇനിയും കാഴ്ചയായിട്ടില്ല. ‘പ്രത്യാശയാൽ’ എന്ന ഉപകരണാർഥം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കി, സാധ്യതയായി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.'
- source_word: ἐσώθημεν
  choice: നാം രക്ഷിക്കപ്പെട്ടു
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗം ലളിതമായ ഭൂതകാല കർമണിയായി നിലനിർത്തുന്നു; രക്ഷയുടെ കർത്താവിനെ വാചകത്തിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: ἐλπὶς ... βλεπομένη
  choice: കാണപ്പെടുന്ന പ്രത്യാശ
  rationale: വർത്തമാന കർമണി കൃദന്തത്തിന്റെ രൂപവും പ്രത്യാശയും കാഴ്ചയും തമ്മിലുള്ള വിരോധവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: പ്രത്യാശയല്ല
  rationale: ഗ്രീക്കിലെ ഗുണസൂചക നിഷേധം സ്വാഭാവികവും ശക്തവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ
  choice: കാണുന്നതിനെ
  rationale: നപുംസകലിംഗ ബന്ധസർവനാമം ഒരാൾ കാണുന്ന വസ്തുവിനെ പൊതുവായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ക്രിയയോടു ചേർത്ത രൂപം സ്വാഭാവികമാണ്.
- source_word: βλέπει
  choice: കാണുന്നു
  rationale: വർത്തമാനകാലത്തിന്റെ പൊതുസത്യസ്വഭാവം ലളിതമായ വർത്തമാനത്തിൽ നിലനിർത്തുന്നു.
- source_word: τίς ἐλπίζει
  choice: ആരാണ് പ്രത്യാശിക്കുന്നത്?
  rationale: ഗ്രീക്കിലെ അലങ്കാരപ്രശ്നവും വർത്തമാനകാലവും ലിംഗനിരപേക്ഷമായ മലയാളരൂപത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τῇ ἐλπίδι ἐσώθημεν എന്നതിൽ രക്ഷയും പ്രത്യാശയും തമ്മിലുള്ള ബന്ധം
  choice: മുഖ്യവാചകത്തിൽ ‘പ്രത്യാശയിൽ നാം രക്ഷിക്കപ്പെട്ടു’ എന്ന് നൽകി, ഇപ്പോഴുള്ള രക്ഷയും ഇനിയും ദൃശ്യമാകാത്ത അതിന്റെ പൂർണതയും തമ്മിലുള്ള പൗലോസിന്റെ സംഘർഷം നിലനിർത്തുന്നു.
  alternative: ‘പ്രത്യാശയാൽ നാം രക്ഷിക്കപ്പെട്ടു’ എന്ന ഉപകരണാർഥമുള്ള വിവർത്തനം.
  rationale: സന്ദർഭം രക്ഷയുടെ ‘ഇതിനകം/ഇനിയും അല്ല’ എന്ന സ്വഭാവത്തെ ഉയർത്തിക്കാട്ടുന്നു. പ്രത്യാശയെ രക്ഷയുടെ കാര്യകാരണമായി നിർവചിക്കാതെ ഗ്രീക്കിലെ ദത്തിവിന്റെ യഥാർഥ ദ്വയാർഥസാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന ഗൗരവമുള്ള മലയാളം. ‘പ്രത്യാശ’ എന്ന സ്ഥിരമായ ബൈബിൾപദം നിലനിർത്തി. γάρ ന്റെ വിശദീകരണഭാവം ‘ആണല്ലോ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടിപ്പിച്ചു; അലങ്കാരപ്രശ്നത്തിൽ ലിംഗനിരപേക്ഷമായ ‘ഒരാൾ/ആരാണ്’ ഉപയോഗിച്ചു.
