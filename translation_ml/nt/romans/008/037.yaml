  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: ml
  text: എന്നാൽ, ഇവയൊക്കെയിലും നമ്മെ സ്നേഹിച്ചവനിലൂടെ നാം മഹാവിജയം നേടുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നാം അത്യധികമായി ജയിക്കുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: സമീപസന്ദർഭത്തിൽ, ഇത് മിക്കവാറും ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ കഷ്ടതകളും പരാജയസാധ്യതയും തമ്മിലുള്ള ശക്തമായ വൈരുധ്യം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἐν τούτοις πᾶσιν
  choice: ഇവയിലെല്ലാം
  rationale: മുൻവാക്യത്തിൽ നിരത്തിയ കഷ്ടതകളെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും അർഥബന്ധവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: ὑπερνικῶμεν
  choice: നാം അത്യന്തം ജയം നേടുന്നു
  rationale: νικάω എന്ന ‘ജയിക്കുക’ എന്ന ക്രിയയെ ὑπέρ- തീവ്രമാക്കുന്നു; അതുകൊണ്ട് സാധാരണ വിജയത്തേക്കാൾ ശക്തവും നിർണായകവുമായ ജയത്തെ ക്രിയാരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: διὰ
  choice: മുഖാന്തരം
  rationale: ജനിറ്റീവിനോടുകൂടിയ διά ഇവിടെ മാർഗമോ പ്രവർത്തകമാധ്യമമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ‘മുഖാന്തരം’ അത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: നമ്മെ സ്നേഹിച്ചവൻ
  rationale: നാമവൽക്കരിച്ച എയോറിസ്റ്റ് കൃദന്തരൂപത്തെ വ്യക്തിനാമം ചേർക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുകയും പൂർത്തിയായ സ്നേഹപ്രവൃത്തിയുടെ ഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ‘നമ്മെ സ്നേഹിച്ചവൻ’ ആരാണ്?
  choice: പ്രധാനവാചകത്തിൽ പേര് വ്യക്തമാക്കാതെ ‘നമ്മെ സ്നേഹിച്ചവൻ’ എന്നു തന്നെയാക്കി.
  alternative: സമീപസന്ദർഭത്തിന്റെ അടിസ്ഥാനത്തിൽ ‘ക്രിസ്തു മുഖാന്തരം’ എന്നു വ്യക്തമാക്കുക; അല്ലെങ്കിൽ ദൈവത്തെ സൂചിപ്പിക്കുന്നതായി ഗ്രഹിക്കുക.
  rationale: റോമർ 8:35-ലെ സമീപസന്ദർഭം ക്രിസ്തുവിലേക്കു ശക്തമായി വിരൽചൂണ്ടുന്നുവെങ്കിലും ഈ വാക്യത്തിലെ ഗ്രീക്ക് പദപ്രയോഗം പേര് പറയുന്നില്ല. അതിനാൽ മൂലപാഠത്തിന്റെ തുറന്ന സൂചന പ്രധാനവാചകത്തിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അതിവിജയികളാകുന്നു’ പോലുള്ള കൃത്രിമ നാമപ്രയോഗത്തിനു പകരം ഗ്രീക്കിലെ ക്രിയാരൂപം നിലനിർത്താൻ ‘അത്യന്തം ജയം നേടുന്നു’ ഉപയോഗിച്ചു; സൂചിത വ്യക്തിയുടെ പേര് പ്രധാനവാചകത്തിൽ ചേർത്തിട്ടില്ല.
