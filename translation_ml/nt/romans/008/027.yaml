id: ROM.8.27
reference: Romans 8:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: ml
  text: ഹൃദയങ്ങളെ പരിശോധിക്കുന്നവൻ ആത്മാവിന്റെ മനോഭാവം എന്തെന്ന് അറിയുന്നു; കാരണം, ആത്മാവ് വിശുദ്ധർക്കുവേണ്ടി ദൈവത്തിന് അനുസൃതമായി[a] മധ്യസ്ഥത വഹിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ദൈവഹിതപ്രകാരം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: പരിശോധിക്കുന്നവൻ
  rationale: ἐραυνάω സൂചിപ്പിക്കുന്ന സജീവവും ആഴത്തിലുള്ളതുമായ അന്വേഷണഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καρδίας
  choice: ഹൃദയങ്ങളെ
  rationale: καρδίαയുടെ ബൈബിൾപരമായ രൂപകം നിലനിർത്തുന്നു; അനാവശ്യമായി ‘അന്തരംഗം’ എന്ന വ്യാഖ്യാനത്തിലേക്ക് വികസിപ്പിക്കുന്നില്ല.
- source_word: τί τὸ φρόνημα
  choice: മനോഭാവം എന്തെന്ന്
  rationale: റോമർ 8-ലെ φρόνημα വെറും ബുദ്ധിയെയല്ല, ചിന്താഗതിയെയോ ആഭിമുഖ്യത്തെയോ സൂചിപ്പിക്കുന്നു; ‘മനോഭാവം’ ഈ അർത്ഥവ്യാപ്തി വായനാസൗകര്യത്തോടെ നൽകുന്നു.
- source_word: τοῦ πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിനെക്കുറിച്ചായതിനാൽ ദൈവാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐντυγχάνει
  choice: മധ്യസ്ഥത വഹിക്കുന്നു
  rationale: പ്രാർത്ഥനാപരമായ ഇടപെടലിന്റെയും മറ്റുള്ളവർക്കുവേണ്ടിയുള്ള അപേക്ഷയുടെയും സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
- source_word: ὑπὲρ ἁγίων
  choice: വിശുദ്ധർക്കുവേണ്ടി
  rationale: ὑπέρ + genitive എന്ന പ്രയോഗത്തിന്റെ പ്രതിനിധിത്വപരമായ അർത്ഥവും പൗലോസിന്റെ ἅγιοι എന്ന പതിവുപദവും നിലനിർത്തുന്നു.
- source_word: κατὰ θεὸν
  choice: ദൈവത്തിന് അനുസൃതമായി
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ ‘ദൈവത്തിന് അനുസൃതമായി’ എന്ന രൂപം നിലനിർത്തുകയും മൂലത്തിൽ വ്യക്തമല്ലാത്ത ‘ഹിതം’ മുഖ്യവാക്യത്തിൽ ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: κατὰ θεὸν എന്നത് ‘ദൈവഹിതപ്രകാരം’ എന്നു വ്യക്തമാക്കണമോ
  choice: മുഖ്യവാക്യത്തിൽ ‘ദൈവത്തിന് അനുസൃതമായി’ എന്നു നൽകി.
  alternative: ദൈവഹിതപ്രകാരം
  rationale: സന്ദർഭത്തിൽ ദൈവഹിതത്തോടുള്ള ഒത്തുപോക്ക് ഉദ്ദേശിക്കപ്പെടാം; എന്നാൽ ഗ്രീക്കിൽ ‘ഹിതം’ എന്ന പദം തുറന്നുപറയുന്നില്ല. അതിനാൽ മുഖ്യവാക്യം മൂലത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ നിയന്ത്രണവും നിലനിർത്തുന്നു; സാധാരണ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ഹൃദയങ്ങൾ,’ ‘വിശുദ്ധർ,’ ‘മധ്യസ്ഥത’ എന്നീ സ്ഥാപിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; κατὰ θεὸν എന്ന പ്രയോഗത്തിലെ യഥാർഥ സംക്ഷിപ്തത അടിക്കുറിപ്പോടെ സംരക്ഷിച്ചു.
