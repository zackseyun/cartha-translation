id: ROM.8.21
reference: Romans 8:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: ml
  text: കാരണം സൃഷ്ടി തന്നെയും ജീർണതയുടെ അടിമത്തത്തിൽനിന്ന് മോചിതമായി ദൈവമക്കളുടെ മഹത്ത്വത്തിന്റെ സ്വാതന്ത്ര്യത്തിലേക്കു പ്രവേശിക്കും.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ, ആശയപരമായി: “ദൈവമക്കളുടെ മഹത്ത്വപൂർണമായ സ്വാതന്ത്ര്യത്തിലേക്ക്.”'
    reason: τῆς δόξης എന്ന ജനിറ്റീവിനെ വിശേഷണാർഥത്തിൽ ഗ്രഹിക്കുന്ന മറ്റൊരു സ്വാഭാവിക വിവർത്തനം.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രത്യാശയുടെ അടിസ്ഥാനം വിശദീകരിക്കുന്ന കാരണാർഥം നിലനിർത്തുന്നു.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: സൃഷ്ടി തന്നെയും
  rationale: καὶയുടെ ഉൾപ്പെടുത്തൽഭാവവും αὐτὴയുടെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു; κτίσις ഇവിടെ സൃഷ്ടലോകത്തെ സമഗ്രമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἐλευθερωθήσεται
  choice: മോചിതമായി ... പ്രവേശിക്കും
  rationale: ഭാവികാല നിഷ്ക്രിയമായ മോചനപ്രവൃത്തി അറിയിക്കുന്നു; εἰς സൂചിപ്പിക്കുന്ന പുതിയ അവസ്ഥയിലേക്കുള്ള പ്രവേശനവുമായി സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: ജീർണതയുടെ അടിമത്തത്തിൽനിന്ന്
  rationale: δουλείαയുടെ ശക്തമായ അടിമത്തരൂപകം നിലനിർത്തുന്നു; സൃഷ്ടലോകത്തിന്റെ നശ്വരതയും ക്ഷയവും സൂചിപ്പിക്കുന്ന φθοράയ്ക്ക് ‘ജീർണത’ യോജിക്കുന്നു.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: സ്വാതന്ത്ര്യത്തിലേക്കു പ്രവേശിക്കും
  rationale: ഒരു പുതിയ അവസ്ഥയിലേക്കുള്ള ഗതിയെ സൂചിപ്പിക്കുന്ന εἰς വ്യക്തമായി പ്രകടമാക്കുന്നു.
- source_word: τῆς δόξης
  choice: മഹത്ത്വത്തിന്റെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം വ്യാഖ്യാനാത്മകമായ വിശേഷണമായി മാറ്റാതെ നിലനിർത്തുന്നു.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: ദൈവമക്കളുടെ
  rationale: τέκναയുടെ ലിംഗസമാവേശിയായ കുടുംബബന്ധവും പരിചിതമായ ബൈബിൾപ്രയോഗവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ എന്ന ജനിറ്റീവ് ശൃംഖലയുടെ വിവർത്തനം
  choice: ദൈവമക്കളുടെ മഹത്ത്വത്തിന്റെ സ്വാതന്ത്ര്യം
  alternative: ദൈവമക്കളുടെ മഹത്ത്വപൂർണമായ സ്വാതന്ത്ര്യം
  rationale: ‘മഹത്ത്വത്തിന്റെ സ്വാതന്ത്ര്യം’ എന്ന രൂപം ഗ്രീക്കിലെ ബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു; സ്വാതന്ത്ര്യം മഹത്ത്വമുള്ളതാണോ, മക്കളുടെ മഹത്ത്വത്തിൽ പങ്കുള്ളതാണോ എന്ന അർഥസാധ്യത അനാവശ്യമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടിമത്തം’ രൂപകത്തിന്റെ ശക്തി കാത്തുസൂക്ഷിക്കുന്നു; ‘മഹത്ത്വത്തിന്റെ സ്വാതന്ത്ര്യം’ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്നത്വം നിലനിർത്തുന്നു.
