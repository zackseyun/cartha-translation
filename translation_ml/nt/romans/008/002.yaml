    rationale: The suffix in «മശീഹയായ» makes the expression sound descriptive rather than presenting «മശീഹാ» as the title directly joined to the name. Replacing it with «മശീഹാ യേശുവിൽ» preserves the Greek title-name construction and reads more naturally in modern standard Malayalam.
  - severity: low
    issue: The traditional-rendering footnote spells the conventional form as «ക്രിസ്തുയേശുവിൽ».
    rationale: «ക്രിസ്തു യേശുവിൽ» more clearly represents the traditional two-word expression “Christ Jesus” and is standard Malayalam orthography for this title-name sequence.
