id: ROM.8.2
reference: Romans 8:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: ml
  text: എന്തെന്നാൽ, ജീവന്റെ ആത്മാവിന്റെ നിയമം[a] മശീഹാ യേശുവിൽ[c] നിന്നെ[b] പാപത്തിന്റെയും മരണത്തിന്റെയും നിയമത്തിൽനിന്ന് മോചിപ്പിച്ചിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “പ്രവർത്തനതത്ത്വം”: “ജീവന്റെ ആത്മാവിന്റെ പ്രവർത്തനതത്ത്വം.”'
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിന്നെ” എന്നതിനുപകരം “എന്നെ” എന്നു വായിക്കുന്നു.
    reason: textual_variant
  - marker: c
    text: 'പരമ്പരാഗത പരിഭാഷ: “ക്രിസ്തു യേശുവിൽ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: നിയമം
  rationale: രണ്ട് പ്രാവശ്യവും ഒരേ പദം ഉപയോഗിച്ച് പൗലോസിന്റെ ആവർത്തനവും രൂപകത്തിലെ അർഥപിരിമുറുക്കവും നിലനിർത്തുന്നു; ‘പ്രവർത്തനതത്ത്വം’ എന്നത് സാധ്യമായ വ്യാഖ്യാനമാണെങ്കിലും അർഥപരിധി ചുരുക്കും.
- source_word: πνεύματος
  choice: ആത്മാവിന്റെ
  rationale: റോമർ 8-ന്റെ സന്ദർഭത്തിൽ ജീവൻ നൽകുന്ന ദൈവാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; മൂലത്തിലെ സംക്ഷിപ്തത നിലനിർത്താൻ ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വികസിപ്പിച്ചില്ല.
- source_word: ζωῆς
  choice: ജീവന്റെ
  rationale: ‘ജീവന്റെ ആത്മാവ്’ എന്ന ജനിറ്റീവ് ഘടന വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേര് ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; പൗലോസിന്റെ ഐക്യഭാഷ സംരക്ഷിക്കാൻ ἐν എന്നത് ‘-യിൽ’ ആയി നിലനിർത്തി.
- source_word: ἠλευθέρωσέν
  choice: മോചിപ്പിച്ചിരിക്കുന്നു
  rationale: പൂർത്തിയായ പ്രവൃത്തിയെയും അതിന്റെ തുടരുന്ന ഫലത്തെയും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ലിംഗസൂചനയുള്ള പ്രയോഗം ഒഴിവാക്കുന്നു.
- source_word: σε
  choice: നിന്നെ
  rationale: SBLGNT-യിലെ രണ്ടാംപുരുഷ ഏകവചനമായ σε പിന്തുടരുന്നു; ‘എന്നെ’ എന്ന പ്രധാന പാഠഭേദം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἁμαρτίας
  choice: പാപത്തിന്റെ
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ പാപത്തെ അമൂർത്ത യാഥാർഥ്യമായും അടിമപ്പെടുത്തുന്ന ശക്തിയായും ഉൾക്കൊള്ളാൻ ഏകവചനം നിലനിർത്തുന്നു.
- source_word: θανάτου
  choice: മരണത്തിന്റെ
  rationale: ‘പാപത്തിന്റെയും മരണത്തിന്റെയും’ എന്ന സംയുക്ത ഘടനയിൽ മൂലപാഠത്തിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
theological_decisions:
- issue: πνεύματος എന്നത് പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യാത്മാവിനെയോ ഒരു ആത്മീയ തത്ത്വത്തെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: ദൈവാത്മാവിനെ സൂചിപ്പിക്കുന്ന ‘ആത്മാവ്’
  alternative: മനുഷ്യാത്മാവ് അഥവാ ഒരു ആത്മീയ പ്രവർത്തനതത്ത്വം
  rationale: റോമർ 8-ൽ ജഡം, പാപം, മരണം എന്നിവയ്ക്കെതിരെ ജീവൻ നൽകുന്ന ആത്മാവിനെ അവതരിപ്പിക്കുന്ന സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് ശക്തമായി അനുകൂലിക്കുന്നത്. എങ്കിലും മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. ‘ജീവന്റെ ആത്മാവിന്റെ നിയമം’ എന്ന സാന്ദ്രമായ ഘടന പൗലോസിന്റെ ആശയപിരിമുറുക്കം വിശദീകരിച്ച് ഇല്ലാതാക്കാതെ സൂക്ഷിക്കുന്നു; ‘മോചിപ്പിച്ചിരിക്കുന്നു’ സാധാരണ വായനക്കാർക്ക് വ്യക്തവും ലിംഗനിരപേക്ഷവുമാണ്.
