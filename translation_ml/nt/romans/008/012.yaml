  terminology: ‘ജഡം’ is an appropriate formally corresponding rendering of σάρξ in Romans 8. ‘കടപ്പെട്ടവരാണ്’ retains the debt metaphor, while the footnote appropriately supplies the contextual, nonliteral sense without placing it in the main text. The inclusive-address footnote is suitable.
