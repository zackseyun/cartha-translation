source:
  edition: SBLGNT
  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരേ[a], നാം കടപ്പെട്ടവരാണ്; എന്നാൽ ജഡപ്രകാരം ജീവിക്കേണ്ടതിന് ജഡത്തോടല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരീസഹോദരന്മാരേ”; ഗ്രീക്കിൽ “സഹോദരന്മാരേ” എന്ന സംബോധനയാണ്, എന്നാൽ അത് വിശ്വാസസമൂഹം മുഴുവനെയും അഭിസംബോധന ചെയ്യുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ “ജഡം” വെറും ശരീരത്തെ മാത്രമല്ല, ദൈവത്തിനെതിരായ പാപാധീന മനുഷ്യാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; അഥവാ “പാപസ്വഭാവം.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനവും തുടർച്ചയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; വിശ്വാസസമൂഹം മുഴുവനെയും ഉൾക്കൊള്ളുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὀφειλέται ἐσμέν
  choice: നാം കടപ്പെട്ടവരാണ്
  rationale: സാമ്പത്തിക കടമല്ല, ബാധ്യതയാണ് സന്ദർഭാർത്ഥമെങ്കിലും, മൂലത്തിലെ ‘കടക്കാർ’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: σάρξ / σαρκί
  choice: ജഡം / ജഡത്തോട്
  rationale: റോമർ 8-ലെ ജഡം–ആത്മാവ് വൈരുധ്യവും പൗലോസിന്റെ ആവർത്തിത പദപ്രയോഗവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: ജഡപ്രകാരം ജീവിക്കേണ്ടതിന്
  rationale: ജഡത്തിന്റെ മാനദണ്ഡമനുസരിച്ചുള്ള ജീവിതത്തോടുള്ള ബാധ്യതയാണ് നിഷേധിക്കപ്പെടുന്നതെന്ന് അടുത്ത രൂപസാദൃശ്യത്തോടെ അറിയിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ σάρξ എന്ന പദം വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തണമോ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘പാപസ്വഭാവം’ എന്നത് സന്ദർഭത്തിലെ ഒരു വ്യാഖ്യാനമാണെങ്കിലും, ‘ജഡം’ പൗലോസിന്റെ പദാവലിയും അതിലുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു; വ്യാഖ്യാനപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കടപ്പെട്ടവരാണ്’, ‘ജഡം’ എന്നീ രൂപകപദങ്ങൾ മൂലപാഠത്തിന്റെ പദസാന്ദ്രതയും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
