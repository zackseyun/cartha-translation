id: ROM.8.4
reference: Romans 8:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: ml
  text: ജഡത്തിനനുസരിച്ചല്ല, ആത്മാവിനനുസരിച്ച് നടക്കുന്നവരായ നമ്മിൽ ന്യായപ്രമാണത്തിന്റെ നീതിയുക്തമായ ആവശ്യം നിറവേറ്റപ്പെടേണ്ടതിന്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: നിറവേറേണ്ടതിന്
  rationale: ഉദ്ദേശ്യത്തെയോ ഉദ്ദേശിച്ച ഫലത്തെയോ സൂചിപ്പിക്കുന്ന ἵνα-വാക്യഘടനയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; മുൻവാക്യത്തോടുള്ള ആശ്രിതബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: δικαίωμα
  choice: നീതിപൂർവമായ ആവശ്യം
  rationale: ഇവിടെ ഒരു പ്രത്യേക ചട്ടത്തേക്കാൾ ന്യായപ്രമാണം ആവശ്യപ്പെടുന്ന നീതിയുള്ള കാര്യമാണ് ഉദ്ദേശിക്കുന്നത്; നിയമപരവും ധാർമികവുമായ ഭാവങ്ങൾ ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിലെ ദൈവിക നിയമത്തെ സൂചിപ്പിക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ പദം.
- source_word: πληρωθῇ
  choice: നിറവേറേണ്ടതിന്
  rationale: അയോറിസ്റ്റ് പാസീവ് സബ്ജങ്‌ടീവിന്റെ ഉദ്ദേശ്യഭാവവും കർമണിപ്രയോഗവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു; ആരാൽ നിറവേറുന്നു എന്ന് അനാവശ്യമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: ἐν എന്നതിന്റെ നേരിട്ടുള്ള അർഥം സൂക്ഷിക്കുന്നു; ‘നമ്മാൽ’ എന്ന് മാറ്റി മനുഷ്യപ്രവർത്തനത്തിന് മൂലപാഠത്തിലധികം ഊന്നൽ നൽകുന്നത് ഒഴിവാക്കുന്നു.
- source_word: περιπατοῦσιν
  choice: നടക്കുന്നവരായ
  rationale: ജീവിതരീതിയെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ‘നടക്കുക’ എന്ന രൂപകം നിലനിർത്തുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: സാർക്സ് എന്ന പദത്തിന്റെ രൂപകപരമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷയെ മുഖ്യപാഠത്തിൽ കൊണ്ടുവരുന്നില്ല.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: റോമർ 8-ന്റെ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് സാധ്യതയേറിയ സൂചന; എങ്കിലും ഗ്രീക്കിലുള്ള സാദ്ധ്യമായ പൊതുവായ ‘ആത്മാവ്’ എന്ന വായനയും കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: ജഡത്തെ അനുസരിച്ച് ... ആത്മാവിനെ അനുസരിച്ച്
  rationale: κατά സൂചിപ്പിക്കുന്ന മാനദണ്ഡമോ ജീവിതദിശയോ വ്യക്തമായി അവതരിപ്പിക്കുകയും സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα മനുഷ്യാത്മാവിനെയോ പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ആത്മാവ്; സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവ് എന്നാണ് മനസ്സിലാക്കുന്നത്
  alternative: മനുഷ്യന്റെ ആത്മാവ്, അല്ലെങ്കിൽ പൊതുവായി ആത്മീയമായ ജീവിതദിശ
  rationale: റോമർ 8-ന്റെ സമീപസന്ദർഭം പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനത്തിനും മേഖലയ്ക്കും ശക്തമായ ഊന്നൽ നൽകുന്നു. എന്നാൽ മലയാളത്തിൽ വലിയക്ഷരംകൊണ്ട് വ്യത്യാസം കാണിക്കാനാകാത്തതിനാലും ഗ്രീക്ക് പദം ഒറ്റയ്ക്ക് കൂടുതൽ പൊതുവായി വായിക്കാവുന്നതിനാലും അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: ἐν ἡμῖν എന്നത് ‘നമ്മിൽ’ എന്നോ ‘നമ്മാൽ’ എന്നോ
  choice: നമ്മിൽ
  alternative: നമ്മാൽ; നമ്മുടെ ഇടയിൽ
  rationale: ἐν എന്ന മൂലപാഠരൂപം നേരിട്ട് സംരക്ഷിക്കുകയും നിവൃത്തി മനുഷ്യർ നിർവഹിക്കുന്നു എന്ന ശക്തമായ അവകാശവാദം പാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്യാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘നടക്കുക’ എന്ന ബൈബിൾ രൂപകവും ‘ന്യായപ്രമാണം’ എന്ന പരിചിത പദവും നിലനിർത്തി. ഈ വാക്യം ἵνα കൊണ്ടാരംഭിക്കുന്നതിനാൽ മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന ഉദ്ദേശ്യവാക്യത്തിന്റെ അപൂർണത മലയാളത്തിലും ഉദ്ദേശപൂർവം സംരക്ഷിച്ചിട്ടുണ്ട്.
