  terminology: σάρξ-ന് ‘ജഡം’ നിലനിർത്തുന്നത് ശരീരം എന്ന ഭൗതിക അർഥത്തിലേക്കുള്ള അനാവശ്യ ചുരുക്കം ഒഴിവാക്കുന്നു. πνεῦμα-ന് ഉറവിടത്തിൽ ഇല്ലാത്ത വിശേഷണം ചേർക്കാതെ ‘ആത്മാവ്’ ഉപയോഗിച്ചിരിക്കുന്നു. ‘ജഡത്തിന്റെ കാര്യങ്ങൾ/ആത്മാവിന്റെ കാര്യങ്ങൾ’ τὰ τῆς σαρκὸς, τὰ τοῦ πνεύματος എന്നിവയിലെ വിശാലവും ആവർത്തിതവുമായ പ്രയോഗം സംരക്ഷിക്കുന്നു.
