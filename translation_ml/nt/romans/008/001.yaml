id: ROM.8.1
reference: Romans 8:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഇപ്പോൾ മശീഹാ യേശുവിലുള്ളവർക്ക്[b] ഒരു ശിക്ഷാവിധിയും ഇല്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പിന്നീടുള്ള ചില കൈയെഴുത്തുപ്രതികൾ ‘ജഡപ്രകാരം നടക്കാത്തവർ’ എന്നു കൂട്ടിച്ചേർക്കുന്നു. ഏറ്റവും പുരാതനമായ ഗ്രീക്ക് സാക്ഷ്യങ്ങൾ ഇവിടെ ഹ്രസ്വമായ പാഠത്തെ പിന്തുണയ്ക്കുന്നു.
    reason: textual_variant
  - marker: b
    text: അല്ലെങ്കിൽ ‘ക്രിസ്തു യേശു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: ഒരു … പോലും ഇല്ല
  rationale: κατάκριμα എന്ന നാമത്തോടൊപ്പം ചേർത്ത് ഗ്രീക്കിലെ സമ്പൂർണ നിഷേധത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനമാണെന്ന് വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ യുക്തിബന്ധപദം.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: മശീഹായിൽ ദൈവം ചെയ്തതിന്റെ ഫലമായ നിലവിലെ യാഥാർഥ്യത്തെ സൂചിപ്പിക്കുന്ന കാലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κατάκριμα
  choice: ശിക്ഷാവിധി
  rationale: വെറും കുറ്റബോധമല്ല, പ്രതികൂലമായ ന്യായവിധിയും അതിന്റെ ശിക്ഷാത്മക ഫലവും സൂചിപ്പിക്കുന്ന പ്രചാരമുള്ള മലയാളപദം.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിലുള്ളവർക്ക്
  rationale: ദാതൃകാർഥം ‘…വർക്ക്’ എന്നും ἐν എന്നതിന്റെ പങ്കാളിത്ത/ഐക്യ ഭാഷ ‘…യിൽ ഉള്ളവർ’ എന്നും നിലനിർത്തുന്നു.
- source_word: Χριστῷ
  choice: മശീഹാ
  rationale: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം സജീവമായി നിലനിർത്തുന്നു; ‘ക്രിസ്തു’ എന്ന ലിപ്യന്തരണപരമായ പര്യായം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: Ἰησοῦ
  choice: യേശു
  rationale: Ἰησοῦς എന്ന വ്യക്തിനാമത്തിന്റെ മലയാളത്തിലെ സ്ഥിരപ്രയോഗം.
theological_decisions:
- issue: ‘മശീഹാ യേശുവിലുള്ളവർ’ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: മശീഹാ യേശുവിനോടു ചേർന്നവരും അവനിൽ ഉൾപ്പെട്ടവരുമായ ആളുകളെ തിരിച്ചറിയിക്കുന്ന പങ്കാളിത്ത/ഐക്യ പ്രയോഗമായി ‘ഉള്ളിൽ/ഉള്ളവർ’ എന്ന ഭാഷ നിലനിർത്തി.
  alternative: ‘മശീഹാ യേശു നിമിത്തം’ എന്ന കാരണാർഥത്തിലുള്ള ലഘൂകരിച്ച വായന.
  rationale: പൗലോസിന്റെ ἐν Χριστῷ എന്ന സമ്പന്നമായ പ്രയോഗത്തെ ഒരൊറ്റ കാരണവ്യാഖ്യാനമായി ചുരുക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ ആഴവും തുറന്ന അർഥവ്യാപ്തിയും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ വാക്യഘടന. ‘ശിക്ഷാവിധി’ ന്യായാലയപരമായ ഭാവം സൂക്ഷിക്കുന്നു; ‘മശീഹാ യേശുവിലുള്ളവർ’ പൗലോസിന്റെ ഐക്യ/പങ്കാളിത്ത ഭാഷ വിശദീകരിച്ചു തീർക്കാതെ നിലനിർത്തുന്നു.
