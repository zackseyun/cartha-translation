id: ROM.8.39
reference: Romans 8:39
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ml
  text: ഉയരത്തിനോ ആഴത്തിനോ സൃഷ്ടിക്കപ്പെട്ട മറ്റൊന്നിനുമോ[a] നമ്മുടെ കർത്താവായ മശീഹാ യേശുവിലുള്ള[b] ദൈവത്തിന്റെ സ്നേഹത്തിൽനിന്ന്[c] നമ്മെ വേർപെടുത്താൻ കഴിയുകയില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സൃഷ്ടിയിലെ മറ്റെന്തിനുമോ” അല്ലെങ്കിൽ “മറ്റൊരു സൃഷ്ടിക്കുമോ.”
    reason: lexical_alternative
  - marker: b
    text: “മശീഹാ യേശു” എന്നത് പരമ്പരാഗതമായി “ക്രിസ്തുയേശു” എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ “ദൈവത്തിന്റെ സ്നേഹം” എന്നത് മിക്കവാറും ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: ഉയരം
  rationale: βάθος എന്ന പദത്തോടുള്ള വൈരുധ്യജോടിയിൽ സ്ഥലപരമായ അർഥമാണ് ഏറ്റവും സ്വാഭാവികം; ‘ഉയരം’ ആ അലങ്കാരപരമായ വിരുദ്ധത നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: βάθος
  choice: ആഴം
  rationale: ὕψωμα എന്നതിനോടൊപ്പം അതിരുകളായ അളവുകളെ സൂചിപ്പിക്കുന്ന ജോടിയാണ്; ‘ആഴം’ സ്വാഭാവികവും നേരിട്ടുള്ളതുമാണ്.
- source_word: κτίσις ἑτέρα
  choice: സൃഷ്ടിക്കപ്പെട്ട മറ്റൊന്ന്
  rationale: κτίσις എന്നതിന് ‘സൃഷ്ടി’ എന്നും ‘സൃഷ്ടിക്കപ്പെട്ട ജീവി/വസ്തു’ എന്നും അർഥമാകാം. ഇവിടെ സൃഷ്ടിതലത്തിലുള്ള മറ്റൊന്നിനും വേർപെടുത്താനാവില്ല എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും ἑτέραയുടെ ‘മറ്റൊരു’ എന്ന ബലം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: δυνήσεται
  choice: കഴിയുകയില്ല
  rationale: ഭാവികാലത്തിലുള്ള കഴിവില്ലായ്മ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: χωρίσαι
  choice: വേർപെടുത്താൻ
  rationale: ബന്ധത്തിൽനിന്ന് അകറ്റുക അഥവാ വിച്ഛേദിക്കുക എന്ന സന്ദർഭാർഥം കൃത്യമായി നൽകുന്നു.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സ്നേഹം
  rationale: ഗ്രീക്ക് ജനിറ്റീവ് ഘടന പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭം ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും വ്യാകരണപരമായ സാധ്യതയെ പൂർണമായി അടച്ചുപൂട്ടുന്നില്ല.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹാ യേശുവിലുള്ള
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയായതിനാൽ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തി; ἐν എന്ന ബന്ധം ‘ഉള്ള’ എന്ന രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: κυρίῳ ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന പദത്തിന്റെ സ്ഥാപിതവും സന്ദർഭോചിതവുമായ മലയാളരൂപം ഉപയോഗിച്ച് യേശുവുമായുള്ള സമാനാധികരണബന്ധം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ സ്നേഹം’ എന്ന ജനിറ്റീവിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ജനിറ്റീവ് ഘടന നിലനിർത്തി; അടിക്കുറിപ്പിൽ ദൈവം നമ്മോടു കാണിക്കുന്ന സ്നേഹം എന്ന സന്ദർഭസാധ്യത വ്യക്തമാക്കി.
  alternative: നമ്മൾ ദൈവത്തോടു കാണിക്കുന്ന സ്നേഹം; അല്ലെങ്കിൽ രണ്ടർഥങ്ങളും ഉദ്ദേശപൂർവം ഉൾക്കൊള്ളുന്ന പ്രയോഗം.
  rationale: റോമർ 8:31–39 ദൈവം തന്റെ ജനത്തിനുവേണ്ടി പ്രവർത്തിക്കുന്നതിലാണ് ഊന്നുന്നത്; അതിനാൽ ദൈവത്തിന്റെ നമ്മോടുള്ള സ്നേഹമാണ് ഏറ്റവും സാധ്യതയുള്ളത്. എങ്കിലും τοῦ θεοῦ എന്ന രൂപത്തെ പ്രധാനപാഠത്തിൽ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: Χριστός ഒരു പദവിയോ പരമ്പരാഗത നാമരൂപമോ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഗ്രീക്കിൽ ഇത് ‘അഭിഷിക്തൻ’ എന്ന പദവിയാണ്; ‘മശീഹാ’ അതിന്റെ പദവിസ്വഭാവം സാധാരണ വായനക്കാരന് കൂടുതൽ സുതാര്യമാക്കുന്നു. പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മുൻവാക്യത്തിലെ നിഷേധപട്ടിക തുടരുന്നതിനാൽ ‘ഉയരത്തിനോ ആഴത്തിനോ’ എന്ന തുടർച്ചാസ്വഭാവം നിലനിർത്തി. അതിരൂക്ഷമായ സഭാപരിഭാഷകളും സാങ്കേതിക ദൈവശാസ്ത്രഭാഷയും ഒഴിവാക്കി.
