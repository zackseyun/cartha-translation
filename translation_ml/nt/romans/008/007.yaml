id: ROM.8.7
reference: Romans 8:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: ml
  text: കാരണം ജഡത്തിന്റെ[a] മനോഭാവം ദൈവത്തോടുള്ള ശത്രുതയാണ്; എന്തെന്നാൽ, അത് ദൈവത്തിന്റെ നിയമത്തിനു കീഴടങ്ങുന്നില്ല; കാരണം അതിനു കീഴടങ്ങാൻ കഴിയുകപോലുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘പാപസ്വഭാവത്തിന്റെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയ്ക്കുള്ള കാരണം അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് ബന്ധകത്തിന്റെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φρόνημα
  choice: മനോഭാവം
  rationale: കേവലം ബുദ്ധിയെയല്ല, മനസ്സിന്റെ സ്ഥിരമായ ചായ്‌വിനെയും ദിശാബോധത്തെയും സൂചിപ്പിക്കുന്ന പദമാണ്.
- source_word: σάρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ രൂപകാലങ്കാരപരമായ പ്രയോഗത്തിലെ സ്രോതസ്സുപദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; അർത്ഥവ്യക്തീകരണമായ മറ്റൊരു പരിഭാഷ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἔχθρα
  choice: ശത്രുത
  rationale: വെറും വിരോധഭാവമല്ല, ദൈവത്തിനെതിരായി ദിശതിരിഞ്ഞിരിക്കുന്ന എതിർപ്പിനെ സൂചിപ്പിക്കുന്ന നാമരൂപം സംരക്ഷിക്കുന്നു.
- source_word: εἰς θεόν
  choice: ദൈവത്തോടുള്ള
  rationale: ശത്രുതയുടെ ലക്ഷ്യവും ദിശയും സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ὑποτάσσεται
  choice: കീഴടങ്ങുന്നില്ല
  rationale: ദൈവത്തിന്റെ നിയമത്തിന് വിധേയമാകാത്തതിനെ വ്യക്തവും സാധാരണവുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: νόμῳ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ നിയമത്തിനു
  rationale: ഗ്രീക്കിലെ ബന്ധനിർമാണവും ‘നിയമം’ എന്ന പദത്തിന്റെ ഔപചാരിക ഭാരവും നിലനിർത്തുന്നു.
- source_word: οὐδὲ γὰρ δύναται
  choice: കാരണം കീഴടങ്ങാൻ അതിനു കഴിയുകപോലുമില്ല
  rationale: δύναται സൂചിപ്പിക്കുന്ന കഴിവില്ലായ്മയും οὐδέ നൽകുന്ന ഊന്നലും നിലനിർത്തുന്നു; വെറും മനസ്സില്ലായ്മയായി മൃദൂകരിക്കുന്നില്ല.
theological_decisions:
- issue: σάρξ എന്ന പദത്തെ ‘ജഡം’ എന്നോ വ്യാഖ്യാനപരമായി ‘പാപസ്വഭാവം’ എന്നോ പരിഭാഷപ്പെടുത്തൽ
  choice: മുഖ്യപാഠത്തിൽ ‘ജഡം’; വ്യാഖ്യാനപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ.
  alternative: പാപസ്വഭാവം
  rationale: സന്ദർഭത്തിൽ ഇത് ശരീരപദാർത്ഥത്തെക്കാൾ ദൈവത്തിനെതിരായ വീണുപോയ മനുഷ്യചായ്‌വിനെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, പൗലോസിന്റെ സ്രോതസ്സുപദത്തിന്റെ രൂപകവും അർത്ഥവ്യാപ്തിയും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു.
- issue: അവസാന ഉപവാക്യം മനസ്സില്ലായ്മയായോ കഴിവില്ലായ്മയായോ അവതരിപ്പിക്കൽ
  choice: ‘കീഴടങ്ങാൻ അതിനു കഴിയുകപോലുമില്ല’ എന്ന വ്യക്തമായ കഴിവില്ലായ്മയുടെ പ്രസ്താവന.
  alternative: അത് കീഴടങ്ങുകയില്ല
  rationale: δύναται നേരിട്ട് കഴിവിനെക്കുറിച്ചാണ് പറയുന്നത്. അതിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ വിശദീകരണം ചേർക്കാതെ പാഠത്തിലെ സംഘർഷം അതേപടി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘മനോഭാവം,’ ‘ശത്രുത,’ ‘കീഴടങ്ങുക’ എന്നീ സാധാരണക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങൾ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ കാരണബന്ധങ്ങൾ കഴിയുന്നത്ര വ്യക്തമായി നിലനിർത്തിയെങ്കിലും മലയാളത്തിന്റെ വായനാസൗകര്യത്തിനായി വിരാമചിഹ്നങ്ങളാൽ ഉപവാക്യങ്ങൾ വേർതിരിച്ചു.
