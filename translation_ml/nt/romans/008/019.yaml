id: ROM.8.19
reference: Romans 8:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, ദൈവത്തിന്റെ പുത്രന്മാർ[a] വെളിപ്പെടുന്നതിനെ സൃഷ്ടി അത്യാകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ദൈവമക്കൾ.” ഗ്രീക്കിൽ “പുത്രന്മാർ” എന്നാണ്; ഇത് പുത്രസ്ഥാനത്തെയും അവകാശിത്വത്തെയും ഊന്നിക്കാട്ടാനും ഇടയുണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തെ വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀποκαραδοκία
  choice: അത്യാകാംക്ഷയോടെ
  rationale: തീവ്രവും പ്രതീക്ഷാനിർഭരവുമായ കാത്തിരിപ്പിനെ സൂചിപ്പിക്കുന്ന നാമത്തെ മലയാളത്തിൽ ക്രിയാവിശേഷണരൂപത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: κτίσεως
  choice: സൃഷ്ടി
  rationale: സന്ദർഭത്തിലെ വിശാലമായ പ്രപഞ്ചപരമായ അർഥം നിലനിർത്തുന്നു; ഒറ്റപ്പെട്ട ഒരു സൃഷ്ടജീവിയെ സൂചിപ്പിക്കുന്നതായി ചുരുക്കുന്നില്ല.
- source_word: ἀποκάλυψιν
  choice: വെളിപ്പെടുന്നതിനായി
  rationale: ഇപ്പോൾ മറഞ്ഞിരിക്കുന്ന ദൈവപുത്രന്മാരുടെ സ്ഥാനം ഭാവിയിൽ പ്രത്യക്ഷമാകുന്നതെന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: υἱῶν
  choice: പുത്രന്മാർ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചനം നിലനിർത്തുകയും പൗലോസിന്റെ സന്ദർഭത്തിലെ പുത്രസ്ഥാനത്തിന്റെയും അവകാശിത്വത്തിന്റെയും സാധ്യതയുള്ള ധ്വനി സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ബന്ധം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ഷഷ്ഠീവಿಭക്തിയെ നേരിട്ട്, സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπεκδέχεται
  choice: കാത്തിരിക്കുന്നു
  rationale: മുന്നോട്ടുനോക്കിയുള്ള പ്രതീക്ഷയുടെ അർഥം നൽകുന്നു; കാത്തിരിപ്പിന്റെ തീവ്രത ἀποκαραδοκία എന്ന പദത്തിന്റെ പരിഭാഷയിൽ ഇതിനകം വ്യക്തമാക്കിയതിനാൽ അനാവശ്യ ആവർത്തനം ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: υἱῶν θεοῦ എന്നത് ലിംഗസമാവേശകമായി ‘ദൈവമക്കൾ’ എന്നോ, ഗ്രീക്കിലെ പുല്ലിംഗം നിലനിർത്തി ‘ദൈവത്തിന്റെ പുത്രന്മാർ’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്.
  choice: ദൈവത്തിന്റെ പുത്രന്മാർ
  alternative: ദൈവമക്കൾ
  rationale: ഗ്രീക്ക് പദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്; കൂടാതെ ‘പുത്രന്മാർ’ എന്നത് പൗലോസിന്റെ വാദത്തിലെ പുത്രസ്ഥാനത്തിന്റെയും അവകാശിത്വത്തിന്റെയും ധ്വനി നിലനിർത്താൻ ഇടയാക്കുന്നു. എന്നാൽ സന്ദർഭത്തിൽ സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന ‘ദൈവമക്കൾ’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ അമൂർത്ത നാമഘടന മലയാളത്തിൽ സ്വാഭാവികമായ ക്രിയാവിശേഷണഘടനയായി നൽകിയിരിക്കുന്നു; മൂലത്തിലെ അർഥവും ദൈവശാസ്ത്രപരമായ ധ്വനിയും നിലനിർത്തിയിട്ടുണ്ട്.
