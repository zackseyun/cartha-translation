id: ROM.8.36
reference: Romans 8:36
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: ml
  text: 'എഴുതിയിരിക്കുന്നതുപോലെ: “അങ്ങേക്കുവേണ്ടി ഞങ്ങൾ ദിവസം മുഴുവൻ വധിക്കപ്പെടുന്നു; അറുക്കാനുള്ള ആടുകളായി ഞങ്ങൾ കണക്കാക്കപ്പെട്ടു.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്തിൽനിന്നുള്ള ഉദ്ധരണിയെ മുൻസന്ദർഭവുമായി ബന്ധിപ്പിക്കുന്ന താരതമ്യഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: പൂർണകാല കർമണി രൂപം സൂചിപ്പിക്കുന്ന, ഇന്നും പ്രാബല്യമുള്ള തിരുവെഴുത്തിനെ പരിചയപ്പെടുത്തുന്ന പതിവുപ്രയോഗം.
- source_word: Ἕνεκεν σοῦ
  choice: അങ്ങയെ നിമിത്തം
  rationale: ദൈവത്തോടുള്ള നേരിട്ടുള്ള അഭിസംബോധനയും ‘നിങ്ങളുടെ കാരണത്താൽ/നിങ്ങൾക്കുവേണ്ടി’ എന്ന കാരണാർഥവും മാന്യമായ ഭാഷയിൽ സംരക്ഷിക്കുന്നു.
- source_word: θανατούμεθα
  choice: വധിക്കപ്പെടുന്നു
  rationale: വർത്തമാനകാല കർമണി രൂപത്തിലെ തുടർച്ചയായ മാരകപീഡനത്തിന്റെ ഭാവം ചുരുക്കമായും ഗൗരവത്തോടെയും നൽകുന്നു.
- source_word: ὅλην τὴν ἡμέραν
  choice: ദിവസം മുഴുവൻ
  rationale: കാലവ്യാപ്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സ്വാഭാവികവും വ്യക്തവുമായ മലയാള തുല്യം.
- source_word: ἐλογίσθημεν
  choice: കണക്കാക്കപ്പെട്ടു
  rationale: λογίζομαι എന്ന പദത്തിന്റെ ‘ഒരു നിലയിൽ എണ്ണുക/കണക്കാക്കുക’ എന്ന അർഥം കർമണി രൂപത്തിൽ അടുത്തായി നിലനിർത്തുന്നു; ‘കരുതപ്പെട്ടു’ എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ὡς
  choice: ആയി
  rationale: ആടുകളോടുള്ള താരതമ്യം മലയാളവാക്യഘടനയിൽ നേരിട്ടും സ്വാഭാവികമായും പ്രകടമാക്കുന്നു.
- source_word: πρόβατα σφαγῆς
  choice: അറുക്കാനുള്ള ആടുകൾ
  rationale: വധത്തിനായി നിശ്ചയിക്കപ്പെട്ട ആടുകളുടെ ദൃശ്യബിംബം അനാവശ്യ വ്യാഖ്യാനമില്ലാതെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: കഷ്ടാനുഭവത്തിന്റെ പശ്ചാത്തലത്തിലുള്ള സങ്കീർത്തനം 44:22-ന്റെ ഉദ്ധരണി
  choice: വിശ്വാസസമൂഹം തുടർച്ചയായി മരണത്തിന് വിധേയരാക്കപ്പെടുന്നതായുള്ള കൂട്ടായ വിലാപവും അറവിനുള്ള ആടുകളുടെ ദൃശ്യബിംബവും അതേപടി നിലനിർത്തി.
  alternative: ഇത് രക്തസാക്ഷിത്വത്തെ മാത്രം സൂചിപ്പിക്കുന്നതായി കൂടുതൽ വ്യാഖ്യാനാത്മകമായി പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പാഠം പ്രത്യേകമായ ഒരു ദാർശനിക പ്രയോഗത്തിലേക്ക് അർഥത്തെ ചുരുക്കുന്നില്ല; അതിനാൽ അതിലെ കഷ്ടാനുഭവവും ദൈവത്തോടുള്ള അഭിസംബോധനയും നിലനിൽക്കുന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും വിശദീകരിച്ച് തീർക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ മാന്യരൂപമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു; ഉദ്ധരണിയുടെ കവിതാത്മക ശക്തി നിലനിർത്തിക്കൊണ്ട് പഴഞ്ചൻ പദപ്രയോഗങ്ങൾ ഒഴിവാക്കി.
