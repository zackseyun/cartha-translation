id: ROM.8.3
reference: Romans 8:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: ml
  text: 'ജഡംമൂലം അതു ദുർബലമായിരുന്നതുകൊണ്ട് ന്യായപ്രമാണത്തിനു ചെയ്യാൻ കഴിയാതിരുന്നത്[a] ദൈവം ചെയ്തു: സ്വന്തം പുത്രനെ പാപജഡത്തിന്റെ സാദൃശ്യത്തിൽ[d], പാപത്തിനുവേണ്ടി[c], അയച്ചുകൊണ്ട് അവൻ ജഡത്തിൽ പാപത്തെ കുറ്റംവിധിച്ചു[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ അക്ഷരാർഥത്തിൽ: ‘ന്യായപ്രമാണത്തിന്റെ അസാമർഥ്യം.’'
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ജഡം’ എന്നത് വീഴ്ചമൂലമുള്ള ദുർബലതയിലുള്ള മനുഷ്യജഡത്തെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു. ചില വിവർത്തനങ്ങൾ ചില സന്ദർഭങ്ങളിൽ ഇതിനെ കൂടുതൽ വ്യാഖ്യാനാത്മകമായി ‘പാപസ്വഭാവം’ എന്നു നൽകുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ‘പാപത്തിനുവേണ്ടി’ എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് ബലിസംബന്ധമായ അർഥത്തിൽ ‘പാപയാഗമായി’ എന്നും വരാം.
    reason: alternative_reading
  - marker: d
    text: ‘പാപജഡത്തിന്റെ സാദൃശ്യത്തിൽ’ എന്നത് പുത്രന്റെ യഥാർഥ മനുഷ്യത്വത്തെ ഉറപ്പിക്കുമ്പോഴും, അവനു പാപം ആരോപിക്കുന്നതിൽനിന്ന് അവനെ സൂക്ഷ്മമായി വേർതിരിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിനു ചെയ്യാൻ കഴിയാതിരുന്നത്
  rationale: ഗ്രീക്കിലെ നപുംസകലിംഗ പ്രയോഗം ന്യായപ്രമാണത്തിന്റെ അസാമർഥ്യത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികവും വ്യക്തവുമായ ക്രിയാത്മക രൂപം സ്വീകരിച്ചു.
- source_word: νόμος
  choice: ന്യായപ്രമാണം
  rationale: റോമർ ലേഖനത്തിന്റെ പശ്ചാത്തലത്തിൽ മോശൈക ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കുന്ന പതിവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: ജഡം നിമിത്തം ദുർബലമായിരുന്നതിനാൽ
  rationale: ന്യായപ്രമാണത്തിന്റെ ദൗർബല്യത്തിനു കാരണം ജഡമാണെന്ന വിശദീകരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: πέμψας
  choice: അയച്ച്
  rationale: ദൈവം പ്രവർത്തിച്ചത് സ്വന്തം പുത്രനെ അയച്ചുകൊണ്ടാണെന്ന ഉപകരണാർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: സ്വന്തം പുത്രനെ
  rationale: ἑαυτοῦ നൽകുന്ന ഊന്നൽ ‘സ്വന്തം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: പാപജഡത്തിന്റെ സാദൃശ്യത്തിൽ
  rationale: ‘സാദൃശ്യം’ എന്ന സൂക്ഷ്മതയും യഥാർഥ മനുഷ്യത്വവും പുത്രനിൽ പാപം ആരോപിക്കാതെയുള്ള വ്യത്യാസവും ഒരുമിച്ച് നിലനിർത്തുന്ന ഔപചാരിക പ്രയോഗം.
- source_word: περὶ ἁμαρτίας
  choice: പാപത്തിനുവേണ്ടി
  rationale: ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലവും യഥാർഥത്തിൽ അവ്യക്തവുമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ബലിയർപ്പണസൂചന അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: പാപത്തെ ശിക്ഷാവിധിക്കു വിധേയമാക്കി
  rationale: κατακρίνω എന്ന ക്രിയയുടെ ന്യായവിധിപരമായ ശക്തി ‘കുറ്റം വിധിച്ചു’ എന്നതിനെക്കാൾ ലക്ഷ്യം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῇ σαρκί
  choice: ജഡത്തിൽ
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘അവന്റെ ജഡത്തിൽ’ എന്നു മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കാതെ സംക്ഷിപ്തതയും സാധ്യതയുള്ള അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: രണ്ടിടത്തും ‘ജഡം’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: ‘പാപസ്വഭാവം’ അല്ലെങ്കിൽ ‘മനുഷ്യന്റെ ദുർബലമായ ജഡം’
  rationale: പൗലോസിന്റെ ഒരേ പദത്തിന്റെ പാളികളുള്ള പ്രയോഗം സംരക്ഷിക്കുകയും വ്യാഖ്യാനത്തെ മുഖ്യപാഠത്തിൽ കുത്തിനിറക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: περὶ ἁμαρτίας എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘പാപത്തിനുവേണ്ടി’.
  alternative: ‘പാപയാഗമായി’
  rationale: സെപ്റ്റുവജിന്റിലെ ബലിസംബന്ധമായ പ്രയോഗം പ്രധാന സാധ്യതയായിരിക്കുമ്പോഴും, ഗ്രീക്ക് വാക്യഭാഗത്തിന് കൂടുതൽ പൊതുവായ അർഥവും സാധ്യമാണ്; അതിനാൽ ബലിയർപ്പണാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: ‘പാപജഡത്തിന്റെ സാദൃശ്യത്തിൽ’ എന്നതിന്റെ ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം
  choice: ‘സാദൃശ്യം’ നിലനിർത്തി; പുത്രന്റെ യഥാർഥ മനുഷ്യത്വത്തെയോ പാപരാഹിത്യത്തെയോ അതിവ്യാഖ്യാനം ചെയ്തില്ല.
  alternative: ‘പാപമുള്ള മനുഷ്യസ്വഭാവത്തിൽ’ അല്ലെങ്കിൽ ‘പാപജഡംപോലെ തോന്നുന്ന രൂപത്തിൽ’
  rationale: മൂലപാഠം യഥാർഥ ജഡധാരണയും പാപത്തിൽനിന്നുള്ള വ്യത്യാസവും തമ്മിലുള്ള സൂക്ഷ്മമായ സംഘർഷം നിലനിർത്തുന്നു; വിവർത്തനവും അത് സംരക്ഷിക്കണം.
- issue: ἐν τῇ σαρκί ആരുടെ ജഡത്തെ സൂചിപ്പിക്കുന്നു
  choice: ‘ജഡത്തിൽ’ എന്ന നിർവചിക്കാത്ത രൂപം നിലനിർത്തി.
  alternative: ‘അവന്റെ ജഡത്തിൽ’
  rationale: സന്ദർഭം പുത്രന്റെ ജഡത്തെ ശക്തമായി സൂചിപ്പിച്ചാലും ഗ്രീക്കിൽ ‘അവന്റെ’ എന്ന പദമില്ല; അതിനാൽ മുഖ്യപാഠത്തിൽ അധിക നിർണ്ണയം ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം’, ‘ജഡം’, ‘ശിക്ഷാവിധി’ എന്നീ പദങ്ങൾ പൗലോസിന്റെ നിയമപരവും ദൈവശാസ്ത്രപരവുമായ ഭാവം സംരക്ഷിക്കുന്നു. ഗ്രീക്ക് വാക്യഘടനയുടെ അസ്വാഭാവികത മലയാളത്തിൽ കുറച്ചെങ്കിലും, ‘ദൈവം ചെയ്തു’ എന്ന അനുപൂരകക്രിയയിലൂടെ മുഖ്യവിരുദ്ധത വ്യക്തമാക്കി.
