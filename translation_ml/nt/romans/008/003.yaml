  source_fidelity: മുഖ്യമായ തിരുത്തൽ κατέκρινε എന്ന ന്യായവിധിപരമായ ക്രിയയിലാണ്. ‘ശിക്ഷാവിധിക്കു വിധേയമാക്കി’ എന്നത് പാപത്തിന്മേൽ ശിക്ഷ നടപ്പാക്കി എന്ന കൂടുതൽ ശക്തവും അല്പം വ്യത്യസ്തവുമായ അർഥത്തിലേക്കു നീങ്ങാം. ‘പാപത്തെ കുറ്റംവിധിച്ചു’ ഗ്രീക്കിലെ ‘condemned’ എന്ന ന്യായികബലം കൂടുതൽ നേരിട്ട് നൽകുന്നു. ‘ജഡത്തിൽ’ എന്ന നിർവചിക്കാത്ത അവസാനപ്രയോഗവും περὶ ἁμαρτίας-ന്റെ വിശാലതയും നിലനിർത്തിയിരിക്കുന്നു.
  naturalness: ‘ജഡംമൂലം അതു ദുർബലമായിരുന്നതുകൊണ്ട്’ എന്ന ക്രമം ആധുനിക മലയാളത്തിൽ കൂടുതൽ തെളിച്ചമുള്ളതാണ്; ‘അതു’ ന്യായപ്രമാണത്തെ വ്യക്തമായി തിരിച്ചെടുക്കുന്നു. ‘...സാദൃശ്യത്തിൽ, പാപത്തിനുവേണ്ടി, അയച്ചുകൊണ്ട്’ എന്ന ക്രമം ഈ രണ്ടു ഗ്രീക്ക് പ്രയോഗങ്ങളും പുത്രനെ അയച്ച പ്രവർത്തനത്തോടു ചേർന്നിരിക്കുന്നതു സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
  terminology: ‘ന്യായപ്രമാണം,’ ‘ജഡം,’ ‘സ്വന്തം പുത്രൻ,’ ‘സാദൃശ്യം’ എന്നിവ നിലനിർത്തുന്നു. ‘പാപജഡം’ എന്ന സാന്ദ്രമായ പ്രയോഗം മൂലത്തിലെ σαρκὸς ἁμαρτίας-ന്റെ ബന്ധം സംരക്ഷിക്കുന്നതിനാൽ നിലനിർത്തിയിരിക്കുന്നു. ‘പാപയാഗമായി’ എന്ന ബലിസംബന്ധമായ സാധ്യത മുഖ്യപാഠത്തിൽ അടിച്ചേൽപ്പിക്കാതെ അടിക്കുറിപ്പിൽ മാത്രം നൽകിയിരിക്കുന്നു.
