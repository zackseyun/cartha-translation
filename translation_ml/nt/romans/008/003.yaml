revisions:
- from: 'ജഡം നിമിത്തം ദുർബലമായിരുന്നതിനാൽ ന്യായപ്രമാണത്തിനു ചെയ്യാൻ കഴിയാതിരുന്നത്[a] ദൈവം ചെയ്തു: പാപജഡത്തിന്റെ സാദൃശ്യത്തിൽ[d] സ്വന്തം പുത്രനെ അയച്ച്, പാപത്തിനുവേണ്ടി[c], അവൻ ജഡത്തിൽ പാപത്തെ ശിക്ഷാവിധിക്കു വിധേയമാക്കി[b].'
  to: 'ജഡംമൂലം അതു ദുർബലമായിരുന്നതുകൊണ്ട് ന്യായപ്രമാണത്തിനു ചെയ്യാൻ കഴിയാതിരുന്നത്[a] ദൈവം ചെയ്തു: സ്വന്തം പുത്രനെ പാപജഡത്തിന്റെ സാദൃശ്യത്തിൽ[d], പാപത്തിനുവേണ്ടി[c], അയച്ചുകൊണ്ട് അവൻ ജഡത്തിൽ പാപത്തെ കുറ്റംവിധിച്ചു[b].'
  rationale: ന്യായവിധിസംബന്ധമായ κατέκρινε-യെ ‘കുറ്റംവിധിച്ചു’ എന്നു തിരുത്തി, അനാവശ്യമായി ശിക്ഷ നടപ്പാക്കൽ സൂചിപ്പിക്കുന്നത് ഒഴിവാക്കി. ന്യായപ്രമാണത്തിന്റെ ദുർബലതയെ സൂചിപ്പിക്കുന്ന ഉപവാക്യം കൂടുതൽ സ്വാഭാവികവും വ്യക്തമുമായി പുനഃക്രമീകരിച്ചു. മറ്റെല്ലാ പ്രധാന അർഥസാധ്യതകളും, പ്രത്യേകിച്ച് περὶ ἁμαρτίας-ന്റെ ബലിസംബന്ധമായ വായനയും ἐν τῇ σαρκί-യിലെ നിർവചിക്കാത്തത്വവും, സംരക്ഷിച്ചിരിക്കുന്നു.
