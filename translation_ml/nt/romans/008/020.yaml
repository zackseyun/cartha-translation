  rationale: A safe syntactic and idiomatic revision has been made. It retains the source’s passive construction, the creation’s unwillingness, the deliberately unidentified subject of subjection, and the ambiguity and concise placement of “in hope.” Footnote b remains part of the complete footnote set but has no anchor in the supplied main text, matching the English audit trail’s likewise unanchored b note and avoiding an unsupported relocation of the note.
