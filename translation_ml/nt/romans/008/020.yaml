  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: ml
  text: എന്തെന്നാൽ, സൃഷ്ടി വ്യർഥതയ്ക്ക്[a] വിധേയമാക്കപ്പെട്ടു—അതിന്റെ സ്വന്തം ഇഷ്ടപ്രകാരമല്ല, അതിനെ വിധേയമാക്കിയവൻ നിമിത്തം—പ്രത്യാശയിൽ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘നിരർഥകതയ്ക്ക്’ അല്ലെങ്കിൽ ‘ഫലശൂന്യതയ്ക്ക്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ ‘പ്രത്യാശയോടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: വ്യർഥതയ്ക്ക്
  rationale: ഇവിടെ പദം ധാർമിക തിന്മയെയല്ല, ലക്ഷ്യം കൈവരിക്കാനാകാത്ത നിരർഥകവും ഫലശൂന്യവുമായ അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വ്യർഥത’ പൗലോസിന്റെ ആശയം ചുരുക്കമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἡ κτίσις
  choice: സൃഷ്ടി
  rationale: റോമർ 8:19–22-ലെ സന്ദർഭത്തിൽ ഇത് ഒരു പ്രത്യേക സൃഷ്ടജീവിയെയല്ല, സൃഷ്ടിക്കപ്പെട്ട ലോകത്തെ സമൂഹമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὑπετάγη
  choice: കീഴ്പ്പെടുത്തപ്പെട്ടു
  rationale: സൃഷ്ടിയുടെമേൽ പുറത്തുനിന്ന് അടിച്ചേൽപ്പിക്കപ്പെട്ട വിധേയാവസ്ഥയെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് കർമണിപ്രയോഗം നിലനിർത്തുന്നു.
- source_word: οὐχ ἑκοῦσα
  choice: സ്വമനസ്സാലല്ല
  rationale: സൃഷ്ടി സ്വന്തം ഇച്ഛപ്രകാരം ഈ അവസ്ഥ സ്വീകരിച്ചതല്ലെന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: അതിനെ കീഴ്പ്പെടുത്തിയവൻ നിമിത്തമാണ്
  rationale: διά + accusative എന്നതിന്റെ കാരണാർഥം നിലനിർത്തുകയും പ്രവർത്തകന്റെ വ്യക്തിത്വം വാക്യത്തിൽ വ്യക്തമാക്കാതെ ഗ്രീക്കിലെ സംയമനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐφ’ ἑλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: ഗ്രീക്കിലെ ചുരുക്കവും ഭാവിയിലേക്കുള്ള പ്രതീക്ഷയും നിലനിർത്തുന്നു; അടുത്ത വാക്യത്തിലേക്കുള്ള ആശയബന്ധവും തുറന്നുവയ്ക്കുന്നു.
theological_decisions:
- issue: സൃഷ്ടിയെ കീഴ്പ്പെടുത്തിയവന്റെ വ്യക്തിത്വം
  choice: പ്രധാനപാഠത്തിൽ ‘അതിനെ കീഴ്പ്പെടുത്തിയവൻ’ എന്നു മാത്രം നൽകി വ്യക്തിത്വം നിർണയിച്ചില്ല.
  alternative: ദൈവം; ആദാമിന്റെ വീഴ്ച; ചില വ്യാഖ്യാനങ്ങളിൽ സാത്താൻ.
  rationale: ഗ്രീക്ക് പാഠം പ്രവർത്തകനെ തുറന്ന് തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ വ്യാഖ്യാനപരമായ സാധ്യത പ്രധാനപാഠത്തിൽ തീർപ്പാക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
- issue: ἐφ’ ἑλπίδι എന്നതിന്റെ ബന്ധം
  choice: ‘പ്രത്യാശയിൽ’ എന്ന് വാക്യാന്തത്തിൽ നിലനിർത്തി.
  alternative: ‘പ്രത്യാശയോടെ’; അല്ലെങ്കിൽ അടുത്ത വാക്യത്തിലെ മോചനപ്രസ്താവനയോട് കൂടുതൽ വ്യക്തമായി ബന്ധിപ്പിച്ച വിപുലീകരണം.
  rationale: ഗ്രീക്ക് വാക്യഘടനയിലെ സംക്ഷിപ്തതയും ‘കീഴ്പ്പെടുത്തൽ പ്രത്യാശയിൽ സംഭവിച്ചു’ എന്ന സാധ്യതയും അടുത്ത വാക്യത്തിലേക്കുള്ള ബന്ധവും ഒരുപോലെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്കിലെ കർമണിപ്രയോഗവും പ്രവർത്തകനെ സംബന്ധിച്ച അനിശ്ചിതത്വവും സംരക്ഷിച്ചു. ഡാഷുകൾ വാക്യത്തിന്റെ പ്രധാന ഒഴുക്ക് വ്യക്തമാക്കുന്നു; എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
