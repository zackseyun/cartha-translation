- from: എന്തെന്നാൽ, സൃഷ്ടി വ്യർഥതയ്ക്ക്[a] കീഴ്പ്പെടുത്തപ്പെട്ടു—സ്വമനസ്സാലല്ല, അതിനെ കീഴ്പ്പെടുത്തിയവൻ നിമിത്തമാണ്[b]—പ്രത്യാശയിൽ[c].
