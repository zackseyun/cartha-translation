revisions:
- from: ആരാണ് ശിക്ഷാവിധി കല്പിക്കുന്നവൻ? മരിച്ചവനായ മശീഹയാണ്[a]—അതിലുപരി, ഉയിർപ്പിക്കപ്പെട്ടവൻ[b]—ദൈവത്തിന്റെ വലതുഭാഗത്തിരിക്കുന്നവൻ[c], നമുക്കുവേണ്ടി മധ്യസ്ഥത വഹിക്കുന്നവനും[d] അവൻതന്നെ.
  to: ശിക്ഷാവിധി കൽപ്പിക്കുന്നവൻ ആര്? മരിച്ചവനും—അതിലുമുപരിയായി, ഉയിർപ്പിക്കപ്പെട്ടവനും—ദൈവത്തിന്റെ വലതുഭാഗത്തിരിക്കുന്നവനും നമുക്കുവേണ്ടി മധ്യസ്ഥത വഹിക്കുന്നവനും ആയ മശീഹയോ?
