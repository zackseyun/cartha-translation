id: ROM.8.34
reference: Romans 8:34
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: ml
  text: ശിക്ഷാവിധി കൽപ്പിക്കുന്നവൻ ആര്? മരിച്ചവനും—അതിലുമുപരിയായി, ഉയിർപ്പിക്കപ്പെട്ടവനും—ദൈവത്തിന്റെ വലതുഭാഗത്തിരിക്കുന്നവനും നമുക്കുവേണ്ടി മധ്യസ്ഥത വഹിക്കുന്നവനും ആയ മശീഹയോ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακρινῶν
  choice: ശിക്ഷാവിധി കല്പിക്കുന്നവൻ
  rationale: നാമവാചകമായി ഉപയോഗിച്ചിരിക്കുന്ന വർത്തമാനകാല കൃദന്തത്തിന്റെ ന്യായവിധി/കുറ്റം വിധിക്കൽ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ പദം അഭിഷിക്തനായ രക്ഷകൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥത്തിൽ പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകി.
- source_word: ἀποθανών
  choice: മരിച്ചവൻ
  rationale: ഭൂതകാലത്തിലെ ചരിത്രസംഭവത്തെ സംക്ഷിപ്തമായ കൃദന്തരൂപത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: μᾶλλον δὲ
  choice: അതിലുപരി
  rationale: മരണത്തിൽനിന്ന് ഉയിർപ്പിലേക്കുള്ള പൗലോസിന്റെ ഊന്നലും ആശയപരമായ കയറ്റവും സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: ἐγερθείς
  choice: ഉയിർപ്പിക്കപ്പെട്ടവൻ
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗം നിലനിർത്തി, മശീഹ ഉയിർപ്പിക്കപ്പെട്ടു എന്ന വാചകഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ വലതുഭാഗത്തിരിക്കുന്നവൻ
  rationale: ഉന്നത ബഹുമാനത്തിന്റെയും അധികാരത്തിന്റെയും സ്ഥാനത്തെ സൂചിപ്പിക്കുന്ന ബൈബിൾപ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐντυγχάνει
  choice: മധ്യസ്ഥത വഹിക്കുന്നവൻ
  rationale: മറ്റുള്ളവർക്കുവേണ്ടി ദൈവസന്നിധിയിൽ അപേക്ഷിക്കുന്നതെന്ന സന്ദർഭാർഥം വ്യക്തവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὑπὲρ ἡμῶν
  choice: നമുക്കുവേണ്ടി
  rationale: പ്രതിനിധിയായും നമ്മുടെ നന്മയ്ക്കായും പ്രവർത്തിക്കുന്നു എന്ന അർഥം സ്വാഭാവികമായി അറിയിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ രക്ഷാശാസ്ത്രപരമായ സന്ദർഭത്തിൽ Χριστός ഒരു പേരുമാത്രമായല്ല, സ്ഥാനപ്പേരായും അർഥവത്താകുന്നതിനാൽ ‘മശീഹ’ തെരഞ്ഞെടുത്തു.
- issue: ἐγερθείς എന്ന ക്രിയയുടെ കർമണിഭാവം
  choice: ഉയിർപ്പിക്കപ്പെട്ടവൻ
  alternative: ഉയിർത്തെഴുന്നേറ്റവൻ
  rationale: ദൈവം പ്രവർത്തിച്ചുവെന്ന സൂചനയെ വാചകത്തിൽ നിർബന്ധമായി വിശദീകരിക്കാതെ, ഗ്രീക്കിലെ കർമണിരൂപം അതേപടി സംരക്ഷിക്കുന്നു.
- issue: ἐν δεξιᾷ τοῦ θεοῦ എന്ന രൂപകപ്രയോഗം
  choice: ദൈവത്തിന്റെ വലതുഭാഗത്ത്
  alternative: ദൈവത്തിന്റെ പരമോന്നത അധികാരസ്ഥാനത്ത്
  rationale: രൂപകത്തെ വ്യാഖ്യാനമായി മാറ്റാതെ ബൈബിൾപ്രയോഗം മുഖ്യവാചകത്തിൽ നിലനിർത്തുകയും അർഥസൂചന അടിക്കുറിപ്പിൽ നൽകുകയും ചെയ്തു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലത്തിലെ ആവർത്തിച്ച ὁ/ὅς ഘടന ‘മരിച്ചവൻ… ഉയിർപ്പിക്കപ്പെട്ടവൻ… ഇരിക്കുന്നവൻ… മധ്യസ്ഥത വഹിക്കുന്നവൻ’ എന്ന സമാന്തര കൃദന്തരൂപങ്ങളിലൂടെ ഭാഗികമായി നിലനിർത്തി. സ്രോതസ്സിൽ Ἰησοῦς ഇല്ലാത്തതിനാൽ ഇംഗ്ലീഷ് consultation layer-ലുള്ള ‘Jesus’ ചേർത്തിട്ടില്ല.
