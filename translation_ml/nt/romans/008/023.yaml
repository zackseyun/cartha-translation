id: ROM.8.23
reference: Romans 8:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: ml
  text: അതുമാത്രമല്ല, ആത്മാവിന്റെ ആദ്യഫലം[a] ഉള്ള നാംതന്നെയും നമ്മുടെ ഉള്ളിൽത്തന്നെ ഞരങ്ങിക്കൊണ്ട്, പുത്രന്മാരായി ദത്തെടുക്കപ്പെടൽ[b]—അതായത്, നമ്മുടെ ശരീരങ്ങളുടെ വീണ്ടെടുപ്പ്[c]—ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ആദ്യഫലമായി ആത്മാവ്.”
    reason: alternative_reading
  - marker: b
    text: അല്ലെങ്കിൽ ലളിതമായി, “ദത്തെടുക്കൽ.” ഗ്രീക്കുപദത്തിൽ അക്ഷരാർഥത്തിൽ പുത്രസ്ഥാനത്തിന്റെ ആശയവും ഉൾപ്പെടുന്നു.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ “നമ്മുടെ ശരീരത്തിന്റെ” എന്നു ഏകവചനമാണ്; ഇവിടെ അത് ഓരോരുത്തരുടെയും ശരീരത്തെ സൂചിപ്പിക്കുന്ന വിതരണാർഥത്തിൽ ഉപയോഗിച്ചിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: അതുമാത്രമല്ല
  rationale: മുൻവാക്യത്തിലെ ആശയം തുടർന്നുകൊണ്ട് പൗലോസ് അവതരിപ്പിക്കുന്ന കൂട്ടിച്ചേർക്കലും വൈരുധ്യബലവും സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: നാംപോലും … നമ്മുടെ ഉള്ളിൽത്തന്നെ
  rationale: സൃഷ്ടി മാത്രമല്ല, വിശ്വാസികളായ ‘നാമും’ ഞരങ്ങുന്നു എന്ന ആവർത്തിച്ച ഊന്നൽ മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: ആത്മാവിന്റെ ആദ്യഫലം
  rationale: ἀπαρχή എന്നതിന്റെ ആദ്യഫലം/ആദ്യവിഹിതം എന്ന അർഥം സൂക്ഷിക്കുന്നു; τοῦ πνεύματος എന്ന ഷഷ്ഠീബന്ധത്തിന്റെ ഉറവിടപരമോ സമാനാധികരണപരമോ ആയ സാധ്യത പ്രധാനപാഠത്തിൽ തീർപ്പാക്കാതെ വിടുന്നു.
- source_word: ἔχοντες
  choice: ഉള്ള
  rationale: ഗ്രീക്കിലെ വർത്തമാനകാല കൃദന്തരൂപത്തെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ മലയാള വിശേഷണവാക്യമായി നൽകുന്നു.
- source_word: ἐν ἑαυτοῖς
  choice: നമ്മുടെ ഉള്ളിൽത്തന്നെ
  rationale: ഞരക്കം ആന്തരികമാണെന്ന ആശയവും ആത്മവാചക ഊന്നലും വ്യക്തമാക്കുന്നു.
- source_word: στενάζομεν
  choice: ഞരങ്ങിക്കൊണ്ട്
  rationale: മുൻസന്ദർഭത്തിൽ സൃഷ്ടിയുടെ ഞരക്കവുമായി ഉള്ള പദബന്ധം നിലനിർത്തുന്ന നേരിട്ടുള്ള പദമാണ്.
- source_word: υἱοθεσίαν
  choice: പുത്രന്മാരായി ദത്തെടുക്കപ്പെടുന്നത്
  rationale: ദത്തെടുക്കൽ എന്ന ആശയത്തോടൊപ്പം ഗ്രീക്കുപദത്തിലെ പുത്രസ്ഥാനത്തിന്റെ ഘടകവും സൂക്ഷിക്കുന്നു; ഇവിടെ എല്ലാ വിശ്വാസികളും അവകാശികളെന്ന നിലയിലാണ് ഉൾപ്പെടുന്നത്.
- source_word: ἀπεκδεχόμενοι
  choice: ആകാംക്ഷയോടെ കാത്തിരിക്കുന്നു
  rationale: തീവ്രവും പ്രതീക്ഷാഭരിതവുമായ കാത്തിരിപ്പിനെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὴν ἀπολύτρωσιν
  choice: വീണ്ടെടുപ്പ്
  rationale: പൗലോസിന്റെ ദൈവശാസ്ത്രപരവും ഭാവികാലപരവുമായ ആശയഭാരം നിലനിർത്തുന്ന പരിചിതമായ മലയാള പദമാണ്.
- source_word: τοῦ σώματος ἡμῶν
  choice: നമ്മുടെ ശരീരങ്ങളുടെ
  rationale: ഗ്രീക്കിൽ ഏകവചനമാണെങ്കിലും ഓരോ വിശ്വാസിയുടെയും ശരീരത്തെ സൂചിപ്പിക്കുന്ന വിതരണാർഥം സ്വാഭാവിക മലയാളത്തിൽ ബഹുവചനമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: υἱοθεσίαν എന്നതിലെ പുത്രത്വ-അവകാശി പ്രതിച്ഛായ സ്ത്രീകളെ പരാമർശത്തിൽനിന്ന് ഒഴിവാക്കാതെ എങ്ങനെ സൂക്ഷിക്കണം
  choice: പുത്രന്മാരായി ദത്തെടുക്കപ്പെടുന്നത്
  alternative: ദത്തെടുക്കപ്പെടുന്നത്
  rationale: ഗ്രീക്കുപദത്തിൽ പുത്രത്വഘടകം വ്യക്തമാണ്; പൗലോസിന്റെ കാലഘട്ടത്തിലെ നിയമപരമായ അവകാശസ്ഥാനത്തെ അത് ഓർമ്മിപ്പിക്കുന്നു. പരാമർശം എല്ലാ വിശ്വാസികളെയും ഉൾക്കൊള്ളുമ്പോഴും മൂലപാഠത്തിലെ ഈ പ്രതിച്ഛായ പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
- issue: ‘ആത്മാവിന്റെ ആദ്യഫലം’ എന്നത് ആത്മാവിൽനിന്നുള്ള ആദ്യവിഹിതത്തെയോ ആദ്യഫലമായ ആത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ആത്മാവിന്റെ ആദ്യഫലം
  alternative: ആദ്യഫലമായി ആത്മാവ്
  rationale: ഗ്രീക്ക് ഷഷ്ഠീബന്ധം ഒന്നിലധികം വിധത്തിൽ ഗ്രഹിക്കാം. പ്രധാനപാഠം ആ അവ്യക്തതയ്ക്കു ഇടം നൽകുകയും സമാനാധികരണ വായന അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘ഞരങ്ങുക,’ ‘വീണ്ടെടുപ്പ്,’ ‘ദത്തെടുക്കപ്പെടുക’ തുടങ്ങിയ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും പൗലോസിന്റെ ആശയബന്ധങ്ങൾ നിലനിർത്തുന്നതുമായ പദങ്ങൾ ഉപയോഗിച്ചു. മൂലത്തിലെ ഊന്നൽ മലയാളത്തിൽ അസ്വാഭാവികമായ ആവർത്തനമാക്കാതെ ‘നാംപോലും … ഉള്ളിൽത്തന്നെ’ എന്ന രൂപത്തിൽ പുനരാവിഷ്കരിച്ചു.
