  edition: SBLGNT
  text: οἱ δὲ ἐν σαρκὶ ὄντες θεῷ ἀρέσαι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: ml
  text: ജഡത്തിൽ ഉള്ളവർക്ക് ദൈവത്തെ പ്രസാദിപ്പിക്കാൻ കഴിയില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “പാപസ്വഭാവത്തിൽ.” ഗ്രീക്കിൽ “ജഡത്തിൽ” എന്നാണ്; ഈ സന്ദർഭത്തിൽ ഇത് പൗലോസ് ഉപയോഗിക്കുന്ന ഒരു പ്രധാന പദമാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: ഉള്ളവർ
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തപ്രയോഗം ഒരു വിഭാഗം ആളുകളെയും അവരുടെ നിലവിലെ അവസ്ഥയെയും സൂചിപ്പിക്കുന്നു; ‘ഉള്ളവർ’ സ്വാഭാവികമായി അത് നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: —
  rationale: മുൻവാക്യത്തോടുള്ള തുടർച്ചയോ വൈരുധ്യമോ സൂചിപ്പിക്കുന്ന ഈ ബന്ധകത്തിന് ഇവിടെ പ്രത്യേകം മലയാളപദം ചേർക്കാതെതന്നെ സന്ദർഭബന്ധം വ്യക്തമാണ്.
- source_word: ἐν σαρκὶ
  choice: ജഡത്തിൽ
  rationale: റോമർ 8-ൽ σάρξ പൗലോസിന്റെ ആശയബന്ധം വഹിക്കുന്ന നിർണായക പദമാണ്. അതിനെ വ്യാഖ്യാനിച്ച് ഒതുക്കാതെ ‘ജഡം’ എന്ന പദം നിലനിർത്തുന്നു.
- source_word: θεῷ ἀρέσαι
  choice: ദൈവത്തെ പ്രസാദിപ്പിക്കാൻ
  rationale: ഗ്രീക്കിലെ ദത്തിവിഭക്തിയോടുകൂടിയ ἀρέσκω എന്ന പ്രയോഗത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമാണിത്.
- source_word: οὐ δύνανται
  choice: കഴിയില്ല
  rationale: നിഷേധിക്കപ്പെട്ട കഴിവിനെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വിവാദാർഥമുള്ള σάρξ എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: ജഡത്തിൽ
  alternative: പാപസ്വഭാവത്തിൽ
  rationale: ‘പാപസ്വഭാവം’ എന്നത് സാധ്യമായ സന്ദർഭവ്യാഖ്യാനമാണെങ്കിലും, അത് പദത്തിന്റെ അർഥവ്യാപ്തി മുൻകൂട്ടി തീർപ്പാക്കാം. അതിനാൽ മുഖ്യവാചകത്തിൽ പൗലോസിന്റെ പദബന്ധം സംരക്ഷിച്ച് വ്യാഖ്യാനപരമായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജഡം’ സാധാരണ സംസാരത്തിൽ അപൂർവമായിരുന്നാലും, ഇവിടെ മൂലപദത്തിന്റെ ആശയബന്ധവും ദൈവശാസ്ത്രപരമായ തുറന്ന നിലയും സംരക്ഷിക്കാൻ ഉചിതമാണ്.
