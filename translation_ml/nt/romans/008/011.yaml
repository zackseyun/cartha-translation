id: ROM.8.11
reference: Romans 8:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ml
  text: എന്നാൽ, മരിച്ചവരിൽ നിന്ന് യേശുവിനെ ഉയിർപ്പിച്ചവന്റെ ആത്മാവ് നിങ്ങളിൽ വസിക്കുന്നുവെങ്കിൽ, മരിച്ചവരിൽ നിന്ന് മശീഹയായ യേശുവിനെ[a] ഉയിർപ്പിച്ചവൻ നിങ്ങളിൽ വസിക്കുന്ന തന്റെ ആത്മാവ് നിമിത്തം നിങ്ങളുടെ മർത്യശരീരങ്ങളെയും കൂടി ജീവിപ്പിക്കും.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ഗ്രീക്ക്: “ക്രിസ്തുയേശുവിനെ.”'
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “നിങ്ങളിൽ വസിക്കുന്ന തന്റെ ആത്മാവിലൂടെ നിങ്ങളുടെ മർത്യശരീരങ്ങളെയും ജീവിപ്പിക്കും.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: രണ്ടിടത്തും പൗലോസിന്റെ വാദത്തിൽ പരിശുദ്ധാത്മാവാണ് സൂചിതൻ; മനുഷ്യാത്മാവോ വ്യക്തിത്വമില്ലാത്ത ശക്തിയോ അല്ല.
- source_word: ἐγείραντος / ἐγείρας
  choice: ഉയിർപ്പിച്ച
  rationale: മരണത്തിൽനിന്നുള്ള ശാരീരിക പുനരുത്ഥാനത്തെ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐκ νεκρῶν
  choice: മരിച്ചവരിൽനിന്ന്
  rationale: മരിച്ചവരുടെ കൂട്ടത്തിൽനിന്നുള്ള ഉയിർപ്പിനെ സംക്ഷിപ്തമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: വസിക്കുന്നു / വസിക്കുന്ന
  rationale: രണ്ടു രൂപങ്ങൾക്കുമിടയിലെ പദബന്ധം നിലനിർത്തുകയും ഉള്ളിൽ സ്ഥിരമായി വസിക്കുക എന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: Χριστὸν Ἰησοῦν
  choice: മശീഹയായ യേശു
  rationale: Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തനായ മശീഹ എന്ന സ്ഥാനനാമബലം വ്യക്തമാക്കുന്നു; അതേസമയം പരിചിതമായ ‘ക്രിസ്തുയേശു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ζῳοποιήσει
  choice: ജീവിപ്പിക്കും
  rationale: ഭാവികാലത്തിലുള്ള ജീവൻ നൽകുന്ന പ്രവൃത്തിയെ നേരിട്ടും സ്വാഭാവികമായും അറിയിക്കുന്നു.
- source_word: θνητὰ σώματα
  choice: മർത്യശരീരങ്ങൾ
  rationale: ശരീരങ്ങളുടെ യാഥാർഥ്യവും മരണവിധേയത്വവും ഒരുപോലെ നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷ.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: വസിക്കുന്ന തന്റെ ആത്മാവ് നിമിത്തം
  rationale: SBLGNT-യിൽ διά-യോടൊപ്പം accusative ഘടനയുള്ളതിനാൽ അതിന്റെ സ്വാഭാവിക കാരണാർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ διὰ + accusative കാരണാർഥമാണോ ഉപകരണാർഥമാണോ
  choice: തന്റെ ആത്മാവ് നിമിത്തം
  alternative: തന്റെ ആത്മാവിലൂടെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ accusative ഘടന കാരണാർഥത്തെ നേരിട്ട് പിന്തുണയ്ക്കുന്നു. എന്നാൽ പാഠഭേദവും പരിഭാഷാപാരമ്പര്യവും പിന്തുണയ്ക്കുന്ന ഉപകരണാർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: Χριστός ഇവിടെ സ്ഥാനനാമമോ പതിവുപേരിന്റെ ഭാഗമോ
  choice: മശീഹയായ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: ഗ്രീക്കിലെ സ്ഥാനനാമസാധ്യത മറച്ചുവയ്ക്കാതെ മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കുന്നു; മലയാള ക്രൈസ്തവ ഉപയോഗത്തിലെ പരിചിതരൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വസിക്കുന്നു/വസിക്കുന്ന’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ lexical continuity നിലനിർത്തുന്നു; ‘മർത്യശരീരങ്ങൾ’ ദൈവശാസ്ത്രപരമായ കൃത്യതയും സാധാരണ വായനാസൗകര്യവും സമന്വയിപ്പിക്കുന്നു.
