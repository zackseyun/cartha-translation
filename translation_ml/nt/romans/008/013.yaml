id: ROM.8.13
reference: Romans 8:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: ml
  text: എന്തെന്നാൽ, നിങ്ങൾ ജഡപ്രകാരം ജീവിക്കുന്നുവെങ്കിൽ, നിങ്ങൾ മരിക്കാൻ പോകുന്നു; എന്നാൽ ആത്മാവിനാൽ ശരീരത്തിന്റെ പ്രവൃത്തികളെ മരണപ്പെടുത്തുന്നുവെങ്കിൽ, നിങ്ങൾ ജീവിക്കും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വാദത്തെ വിശദീകരിക്കുന്ന ബന്ധകശക്തി നിലനിർത്തുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡത്തെ അനുസരിച്ച്
  rationale: σάρξ എന്ന പൗലോസിന്റെ സാന്ദ്രമായ രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുകയും κατάയുടെ മാനദണ്ഡാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: ζῆτε
  choice: ജീവിക്കുന്നെങ്കിൽ
  rationale: വർത്തമാനകാല ക്രിയയെയും സോപാധിക വാക്യഘടനയെയും സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: മരിക്കാൻ പോകുന്നു
  rationale: μέλλω സഹിതമുള്ള അനന്തക്രിയയുടെ പ്രതീക്ഷിത ഭാവിയെ സ്വാഭാവികമായി നൽകുന്നു; അത്യന്തം ഉടനടിയെന്ന ധ്വനി നിർബന്ധിക്കുന്നില്ല.
- source_word: πνεύματι
  choice: ആത്മാവിനാൽ
  rationale: ദാതൃവിഭക്തിയെ ഉപകരണാർഥത്തിൽ നൽകുന്നു; റോമർ 8-ന്റെ സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചന.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: ശരീരത്തിന്റെ പ്രവൃത്തികളെ
  rationale: πράξεις എന്നതിന്റെ നൈതികവും മൂർത്തവുമായ അർഥവും τοῦ σώματος എന്ന ബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: θανατοῦτε
  choice: കൊന്നുകളയുന്നെങ്കിൽ
  rationale: തുടർച്ചയായ നൈതിക നിർമാർജനത്തിന്റെ ശക്തമായ മരണരൂപകം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂക്ഷിക്കുന്നു.
- source_word: ζήσεσθε
  choice: നിങ്ങൾ ജീവിക്കും
  rationale: ഗ്രീക്കിലെ ഭാവികാലത്തെ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: πνεύματι പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യാത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: പരിശുദ്ധാത്മാവ് എന്ന സൂചനയോടെ ‘ആത്മാവിനാൽ’
  alternative: മനുഷ്യാത്മാവിനാൽ; അല്ലെങ്കിൽ ഉദ്ദേശപൂർവം അവ്യക്തമായ ‘ആത്മാവിനാൽ’
  rationale: റോമർ 8-ലെ ആവർത്തിച്ചുള്ള പ്രയോഗവും ജഡം–ആത്മാവ് വൈരുധ്യവും പരിശുദ്ധാത്മാവിനെ ശക്തമായി സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ആദരസൂചക വലിയക്ഷരവ്യത്യാസം ഇല്ലാത്തതിനാൽ പദം സ്വാഭാവികമായി സന്ദർഭാധീനതയും നിലനിർത്തുന്നു.
- issue: σάρξ എന്നതിനെ വ്യാഖ്യാനാത്മകമായി ‘പാപസ്വഭാവം’ എന്നു നൽകണമോ
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘പാപസ്വഭാവം’ പൗലോസിന്റെ ശരീരം/ജഡം സംബന്ധിച്ച രൂപകത്തെ ഒരു പ്രത്യേക മാനവശാസ്ത്ര വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാം. ‘ജഡം’ മൂലപദത്തിന്റെ രൂപകവും ശരീരവുമായി ഉള്ള ഉദ്ദേശപൂർവമായ സംഘർഷവും സൂക്ഷിക്കുന്നു; അടിക്കുറിപ്പ് സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ജഡം’ എന്ന പരമ്പരാഗത ബൈബിൾപദം മൂലരൂപകം സംരക്ഷിക്കാൻ ഉപയോഗിച്ചു; അടിക്കുറിപ്പിലൂടെ അതിന്റെ സന്ദർഭാർഥം വ്യക്തമാക്കി.
