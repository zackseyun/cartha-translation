    text: 'അക്ഷരാർഥം: ‘ജഡപ്രകാരം.’ ഇവിടെ ‘ജഡം’ ദൈവത്തോടു വിരോധമുള്ള മനുഷ്യജീവിതത്തിന്റെ പ്രവണതയെ സൂചിപ്പിക്കുന്നു.'
    reason: lexical_alternative
