id: ROM.8.22
reference: Romans 8:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: ml
  text: സൃഷ്ടി മുഴുവനും ഇന്നുവരെ ഒരുമിച്ചു ഞരങ്ങുകയും ഒരുമിച്ചു പ്രസവവേദന അനുഭവിക്കുകയും ചെയ്യുന്നു എന്നു നാം അറിയുന്നുവല്ലോ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സൃഷ്ടി മുഴുവനും’ എന്നതിന് ‘സകല സൃഷ്ടിയും’ എന്നും പറയാം; ‘ഓരോ സൃഷ്ടവസ്തുവും’ എന്ന അർഥവും വ്യാകരണപരമായി സാധ്യമാണെങ്കിലും ഇവിടെ വിശാലമായ പ്രപഞ്ചവ്യാപക അർഥത്തിനാണ് കൂടുതൽ സാധ്യത.
    reason: lexical_alternative
  - marker: b
    text: ‘പ്രസവവേദന അനുഭവിക്കുന്നു’ എന്ന പ്രയോഗം പ്രസവനോവിനെ ഓർമിപ്പിക്കുന്നു; അതിനാൽ ഇത് കഷ്ടതയെ മാത്രമല്ല, പുതുജീവനിലേക്കു നയിക്കുന്ന കഷ്ടതയെയും സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: നാം അറിയുന്നു
  rationale: രൂപത്തിൽ perfect ആയ οἶδα ഇവിടെ വർത്തമാനകാല അർഥമുള്ള, പങ്കുവെക്കപ്പെടുന്ന ഉറച്ച അറിവിനെ സൂചിപ്പിക്കുന്നു.
- source_word: γὰρ
  choice: -വല്ലോ
  rationale: മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വാക്യാന്ത്യത്തിലെ ‘എന്നറിയുന്നുവല്ലോ’ എന്ന പ്രയോഗത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: πᾶσα ἡ κτίσις
  choice: സൃഷ്ടി മുഴുവനും
  rationale: നിർദിഷ്ടപദത്തോടുകൂടിയ πᾶσα ഇവിടെ വിതരണാത്മകമായ ‘ഓരോ സൃഷ്ടവസ്തുവും’ എന്നതിലുപരി സമഗ്രമായ സൃഷ്ടലോകത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: συστενάζει
  choice: ഒരുമിച്ചു ഞരങ്ങുന്നു
  rationale: συν- ഉപസർഗത്തിലെ കൂട്ടായ്മയുടെ ഭാവവും στενάζω എന്നതിലെ വേദനാപൂർണമായ ഞരക്കവും സംരക്ഷിക്കുന്നു.
- source_word: συνωδίνει
  choice: ഒരുമിച്ചു പ്രസവവേദന അനുഭവിക്കുന്നു
  rationale: പ്രസവവേദനയുടെ പ്രത്യേക ദൃശ്യവും συν- ഉപസർഗത്തിലെ കൂട്ടായ അനുഭവവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἄχρι τοῦ νῦν
  choice: ഇന്നുവരെ
  rationale: അവസ്ഥ ഇപ്പോഴത്തെ സമയംവരെ തുടരുന്നു എന്ന കാലസൂചന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നൽകുന്നു.
theological_decisions:
- issue: κτίσις എന്നത് ‘സൃഷ്ടി’ എന്നോ ‘സൃഷ്ടവസ്തു/ജീവി’ എന്നോ പരിഭാഷപ്പെടുത്തണോ
  choice: സൃഷ്ടി
  alternative: ഓരോ സൃഷ്ടവസ്തുവും
  rationale: റോമർ 8:19–23-ൽ മനുഷ്യരല്ലാത്ത സൃഷ്ടലോകത്തെ പൗലോസ് വ്യക്തിവൽക്കരിച്ച് സമഗ്രമായി അവതരിപ്പിക്കുന്നു. ‘സൃഷ്ടി’ ആ വിശാല പ്രപഞ്ചവ്യാപക അർഥം ചുരുക്കാതെ നിലനിർത്തുന്നു.
- issue: συνωδίνει എന്ന പ്രസവദൃശ്യം പൊതുവായ കഷ്ടാനുഭവമായി ലഘൂകരിക്കണോ
  choice: പ്രസവവേദന അനുഭവിക്കുന്നു
  alternative: കഷ്ടപ്പെടുന്നു
  rationale: മൂലപദം പൊതുവായ വേദനയല്ല, പ്രസവവേദനയെ പ്രത്യേകമായി ഉണർത്തുന്നു; അതിനാൽ ഭാവിയിലെ പുതുജീവനിലേക്കു നീങ്ങുന്ന വേദന എന്ന സൂചന പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ഞരങ്ങുക’ വേദനയുടെ ശ്രാവ്യഭാവം നൽകുന്നു; ആവർത്തിച്ച ‘ഒരുമിച്ചു’ എന്നത് ഗ്രീക്കിലെ രണ്ടു συν- സംയുക്തക്രിയകളുടെയും കൂട്ടായ ഭാവം ഉദ്ദേശപൂർവം സംരക്ഷിക്കുന്നു.
