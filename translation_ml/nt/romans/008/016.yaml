id: ROM.8.16
reference: Romans 8:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: ml
  text: ആത്മാവുതന്നെ[a] നമ്മുടെ ആത്മാവിനോടൊപ്പം സാക്ഷ്യം പറയുന്നു[b]—നാം ദൈവത്തിന്റെ മക്കളാണെന്ന്[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവുതന്നെ’ എന്നതിലെ ‘തന്നെ’ ഗ്രീക്കിലെ ഊന്നൽ നിലനിർത്തുന്നു; ഇവിടെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_clarification
  - marker: b
    text: അഥവാ ‘നമ്മുടെ ആത്മാവിനോട് സാക്ഷ്യപ്പെടുത്തുന്നു.’ ഗ്രീക്ക് പ്രയോഗം പ്രധാനമായി നമ്മുടെ ആത്മാവിനോടൊപ്പമുള്ള സാക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ ‘ദൈവത്തിന്റെ മക്കൾ’; ‘മക്കൾ’ ആൺമക്കളെയും പെൺമക്കളെയും ഉൾക്കൊള്ളുന്നു.
    reason: lexical_clarification
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: ആത്മാവുതന്നെ
  rationale: αὐτό നൽകുന്ന ഊന്നൽ ‘തന്നെ’ എന്ന പ്രയോഗം സ്വാഭാവികമായി നിലനിർത്തുന്നു. സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപാഠത്തിൽ ഇല്ലാത്ത ‘പരിശുദ്ധ’ എന്ന വിശേഷണം മുഖ്യവാചകത്തിൽ ചേർത്തിട്ടില്ല.
- source_word: συμμαρτυρεῖ
  choice: സാക്ഷ്യം പറയുന്നു
  rationale: ക്രിയയുടെ സാക്ഷ്യം നൽകുക എന്ന അർഥം സാധാരണ ആധുനിക മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു; കൂടെ/ഒരുമിച്ച് സാക്ഷ്യം നൽകുന്ന ഘടകം ‘നമ്മുടെ ആത്മാവിനോടൊപ്പം’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: τῷ πνεύματι ἡμῶν
  choice: നമ്മുടെ ആത്മാവിനോടൊപ്പം
  rationale: 'സύν- ഘടകമുള്ള συμμαρτυρεῖ എന്ന ക്രിയയോടുള്ള ദത്തി ഇവിടെ സഹവർത്തിത്വമായി ഗ്രഹിക്കുന്നത് യുക്തമാണ്: ദൈവത്തിന്റെ ആത്മാവ് നമ്മുടെ ആത്മാവിനോടൊപ്പം സാക്ഷ്യം പറയുന്നു.'
- source_word: ὅτι ἐσμὲν
  choice: നാം … ആണെന്ന്
  rationale: ὅτι അവതരിപ്പിക്കുന്ന പ്രസ്താവനയുടെ ഉള്ളടക്കം മലയാളത്തിലെ സ്വാഭാവിക പരോക്ഷവാക്യഘടനയിൽ നൽകുന്നു.
- source_word: τέκνα θεοῦ
  choice: ദൈവത്തിന്റെ മക്കൾ
  rationale: τέκνα ലിംഗഭേദമില്ലാതെ ‘മക്കൾ’ എന്നാണ്; ‘പുത്രന്മാർ’ എന്നു പരിഭാഷപ്പെടുത്തി അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: αὐτὸ τὸ πνεῦμα എന്നതിലെ വ്യക്തിത്വവും ഊന്നലും
  choice: ആത്മാവുതന്നെ
  alternative: ആത്മാവ് തന്നെത്താൻ / പരിശുദ്ധാത്മാവുതന്നെ
  rationale: ഗ്രീക്കിൽ πνεῦμα വ്യാകരണപരമായി നപുംസകലിംഗമാണെങ്കിലും ഇവിടെ പ്രവർത്തിക്കുന്ന ദൈവാത്മാവാണ് സൂചിതൻ. മലയാളത്തിൽ ‘തന്നെ’ ഊന്നൽ നൽകുന്നു; ലിംഗസൂചക സർവനാമം നിർബന്ധമാക്കാതെ വ്യക്തിപരമായ പ്രവർത്തനവും നിലനിർത്തുന്നു.
- issue: τῷ πνεύματι ἡμῶν എന്ന ദത്തിയുടെ ബന്ധം
  choice: നമ്മുടെ ആത്മാവിനോടൊപ്പം
  alternative: നമ്മുടെ ആത്മാവിനോട്
  rationale: συμμαρτυρεῖ എന്ന സംയുക്തക്രിയ ഒരുമിച്ചുള്ള സാക്ഷ്യത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു. എന്നിരുന്നാലും ദത്തിയെ സ്വീകരിക്കുന്നവനായി കാണുന്ന മറ്റൊരു വായനയ്ക്കുള്ള സാധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. ‘സാക്ഷ്യം പറയുന്നു’ പൊതുവായ വായനക്കാർക്ക് ‘സാക്ഷ്യം വഹിക്കുന്നു’ എന്നതിനെക്കാൾ നേരിട്ട് മനസ്സിലാകുന്ന പ്രയോഗമാണ്. ‘ആത്മാവ്’ എന്ന ആവർത്തനം മൂലപാഠത്തിലെ ദൈവാത്മാവ്/മനുഷ്യാത്മാവ് വ്യത്യാസം നിലനിർത്തുന്നു.
