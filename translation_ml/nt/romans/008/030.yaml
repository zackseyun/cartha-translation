id: ROM.8.30
reference: Romans 8:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: ml
  text: അവൻ മുൻകൂട്ടി നിശ്ചയിച്ചവരെ[a] വിളിക്കുകയും ചെയ്തു; വിളിച്ചവരെ നീതീകരിക്കുകയും ചെയ്തു; നീതീകരിച്ചവരെ മഹത്വപ്പെടുത്തുകയും ചെയ്തു[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “മുൻകൂട്ടി നിയമിച്ചവരെ.”
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ “മഹത്വപ്പെടുത്തി” എന്നത് ഭൂതകാലരൂപത്തിലാണ്; ഭാവിയിൽ ലഭിക്കാനിരിക്കുന്ന മഹത്വം അത്ര ഉറപ്പുള്ളതായതിനാൽ അത് ഇതിനകം പൂർത്തിയായതുപോലെ ഇവിടെ പറയുന്നതാണെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: മുൻകൂട്ടി നിശ്ചയിച്ചു
  rationale: മുൻകൂട്ടി തീരുമാനിക്കുക അഥവാ നിയമിക്കുക എന്ന ഗ്രീക്ക് അർഥം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു; ഒരു പ്രത്യേക ദൈവശാസ്ത്രസംവിധാനത്തിന്റെ വിശദീകരണം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- source_word: ἐκάλεσεν
  choice: വിളിച്ചു
  rationale: καλέωയുടെ നേരിട്ടുള്ള അർഥവും പൗലോസിന്റെ ക്രമശൃംഖലയിലെ ദൈവശാസ്ത്രബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: ἐδικαίωσεν
  choice: നീതീകരിച്ചു
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിലെ ന്യായവിധിസംബന്ധമായ അർഥം ചുരുക്കമായും പതിവായും നൽകുന്നു; ‘നീതിമാന്മാരായി പ്രഖ്യാപിച്ചു’ എന്ന വിശദീകരണാർഥവും ഇതിൽ ഉൾക്കൊള്ളാനാകും.
- source_word: ἐδόξασεν
  choice: മഹത്ത്വപ്പെടുത്തി
  rationale: ഗ്രീക്കിലെ aorist രൂപത്തെ ഭൂതകാലത്തിൽത്തന്നെ നിലനിർത്തി പൗലോസിന്റെ വാക്യക്രമവും വാചകബലവും സംരക്ഷിക്കുന്നു.
- source_word: οὓς ... τούτους
  choice: '...ചെയ്തവരെ ...ചെയ്തു'
  rationale: ഓരോ ഘട്ടത്തിലും അതേ ആളുകളെയാണ് സൂചിപ്പിക്കുന്നതെന്ന ആവർത്തിത പരസ്പരബന്ധം സ്വാഭാവികമായ മലയാളവാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം / കൂടി എന്ന അർഥമുള്ള ‘-കയും ചെയ്തു’ ഘടന
  rationale: ഓരോ ഘട്ടവും മുമ്പത്തേതിനോടു ചേർക്കുന്ന additive force മലയാളത്തിലെ ‘വിളിക്കുകയും ചെയ്തു’ തുടങ്ങിയ ഘടനയിലൂടെ പ്രകടമാക്കുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിലെ തുടർച്ചയായ വാക്യപ്രവാഹം അത് സ്വാഭാവികമായി വഹിക്കുന്നു.
theological_decisions:
- issue: προώρισεν എന്നതിന്റെ മുൻനിർണയാർഥം മയപ്പെടുത്തണമോ
  choice: മുൻകൂട്ടി നിശ്ചയിച്ചു
  alternative: മുൻകൂട്ടി നിയമിച്ചു
  rationale: ഗ്രീക്ക് പദം മുൻകൂട്ടിയുള്ള തീരുമാനത്തെ വ്യക്തമാക്കുന്നു. അതിനെ നിലനിർത്തുന്നു; എന്നാൽ അതിന്റെ രീതി സംബന്ധിച്ച പിൽക്കാല സഭാവിഭാഗീയ വ്യാഖ്യാനങ്ങൾ ചേർക്കുന്നില്ല.
- issue: ἐδόξασεν ഭൂതകാലമായോ ഭാവികാലമായോ വിവർത്തനം ചെയ്യണമോ
  choice: മഹത്ത്വപ്പെടുത്തി
  alternative: മഹത്ത്വപ്പെടുത്തും
  rationale: ഗ്രീക്കിൽ aorist indicative ആയതിനാൽ മുഖ്യപാഠത്തിൽ ഭൂതകാലരൂപം സംരക്ഷിക്കുന്നു. ഭാവിയിലെ മഹത്ത്വം അത്ര ഉറപ്പുള്ളതിനാൽ പൂർത്തിയായതായി പറയുന്നതാകാം എന്ന ധാരണ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ ആവർത്തിത ശൃംഖലയും ഓരോ ഘട്ടത്തിലുമുള്ള ‘കൂടി’ എന്ന ആശയവും ‘-കയും ചെയ്തു’ എന്ന സമാന്തരഘടനയിലൂടെ നിലനിർത്തിയിരിക്കുന്നു.
