id: ROM.8.10
reference: Romans 8:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: ml
  text: എന്നാൽ മശീഹ നിങ്ങളിൽ ഉണ്ടെങ്കിൽ, പാപം നിമിത്തം ശരീരം മരിച്ചിരിക്കുന്നു[b]; നീതി നിമിത്തം ആത്മാവോ[a] ജീവൻ ആണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ആത്മാവ്’ എന്നത് ദൈവം ജീവിപ്പിച്ച മനുഷ്യാത്മാവിനെയോ പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ശരീരം മരണത്തിന് അധീനമാണ്’ അല്ലെങ്കിൽ ‘ശരീരം മർത്യമാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ പദവിയായ അർത്ഥം നിലനിർത്തുന്നതിനാൽ, വെറും പേരായി ലിപ്യന്തരണം ചെയ്യാതെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: σῶμα
  choice: ശരീരം
  rationale: σῶμα എന്നത് സാധാരണയായി ശരീരത്തെയാണ് സൂചിപ്പിക്കുന്നത്; σάρξ എന്നതിന്റെ അർത്ഥമായ ‘ജഡം’ ഇവിടെ കൊണ്ടുവരുന്നില്ല.
- source_word: νεκρὸν
  choice: മരിച്ചതാണ്
  rationale: ഗ്രീക്കിലെ ശക്തമായ ‘dead’ എന്ന വിശേഷണരൂപം നിലനിർത്തുന്നു; മരണാധീനത എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: διὰ ἁμαρτίαν
  choice: പാപം നിമിത്തം
  rationale: Accusative-നോടുകൂടിയ διάയുടെ കാരണാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: മനുഷ്യാത്മാവിനെയോ പരിശുദ്ധാത്മാവിനെയോ സൂചിപ്പിക്കാവുന്ന സന്ദർഭപരമായ അവ്യക്തത നിലനിർത്തുന്ന പദമാണ് ‘ആത്മാവ്’.
- source_word: ζωὴ
  choice: ജീവനാണ്
  rationale: ‘ജീവിച്ചിരിക്കുന്നു’ എന്ന വിശേഷണാർഥമാക്കാതെ ζωήയുടെ നാമരൂപവും പൗലോസിന്റെ സാന്ദ്രമായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: διὰ δικαιοσύνην
  choice: നീതി നിമിത്തം
  rationale: διάയുടെ കാരണാർഥം നിലനിർത്തുകയും δικαιοσύνηയുടെ പൗലോസീയ അർത്ഥവ്യാപ്തി ‘നീതി’കൊണ്ട് സ്വാഭാവികമായി നൽകുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: πνεῦμα ആരെ സൂചിപ്പിക്കുന്നു
  choice: ആത്മാവ്
  alternative: പരിശുദ്ധാത്മാവ്
  rationale: ശരീരത്തോടുള്ള വൈരുധ്യം മനുഷ്യാത്മാവിനെ സൂചിപ്പിക്കാമെങ്കിലും, മുൻസന്ദർഭം പരിശുദ്ധാത്മാവിനെയും മുന്നിൽ കൊണ്ടുവരുന്നു. പ്രധാനപാഠം ഈ സംഘർഷം തീർപ്പാക്കുന്നില്ല; അടിക്കുറിപ്പ് രണ്ടു സാധ്യതകളും വ്യക്തമാക്കുന്നു.
- issue: σῶμα νεκρὸν എന്നതിന്റെ ശക്തി
  choice: ശരീരം മരിച്ചതാണ്
  alternative: ശരീരം മരണത്തിന് അധീനമാണ് / മർത്യമാണ്
  rationale: പാപത്തിന്റെ ഫലമായി ശരീരം മർത്യമായിരിക്കുന്നു എന്ന ആശയം സന്ദർഭത്തിൽ ഉണ്ടായേക്കാം; എങ്കിലും νεκρόν എന്ന മൂലപദത്തിന്റെ നേരിട്ടുള്ള ശക്തി പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു.
- issue: δικαιοσύνηയുടെ അർത്ഥവ്യാപ്തി
  choice: നീതി
  alternative: ന്യായം
  rationale: ‘നീതി’ പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ച വിശാലത നൽകുന്നു; ന്യായം/justice എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. മൂലവാക്യത്തിലെ ശരീരം–ആത്മാവ് വൈരുധ്യവും ‘ആത്മാവ് ജീവനാണ്’ എന്ന സാന്ദ്രമായ നാമവാക്യവും സംരക്ഷിച്ചു; വ്യാഖ്യാനപരമായ തീർപ്പുകൾ അടിക്കുറിപ്പുകളിലേക്ക് മാറ്റി.
