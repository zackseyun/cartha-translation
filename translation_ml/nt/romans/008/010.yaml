  to: എന്നാൽ മശീഹ നിങ്ങളിൽ ഉണ്ടെങ്കിൽ, പാപം നിമിത്തം ശരീരം മരിച്ചിരിക്കുന്നു[b]; നീതി നിമിത്തം ആത്മാവോ[a] ജീവൻ ആണ്.
  rationale: The revision strengthens the Malayalam expression of the Greek present-state predicate νεκρόν without resolving Paul’s contextual mortality nuance. It retains the deliberately ambiguous “ആത്മാവ്” for πνεῦμα and preserves the causal and nominal structure of the final clause. Footnote c is made syntactically complete.
