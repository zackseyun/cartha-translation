id: ROM.7.7
reference: Romans 7:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: ml
  text: അപ്പോൾ നാം എന്തു പറയും? ന്യായപ്രമാണം പാപമാണോ? ഒരിക്കലുമല്ല! മറിച്ച്, ന്യായപ്രമാണത്തിലൂടെയല്ലാതെ ഞാൻ പാപത്തെ അറിയുമായിരുന്നില്ല. കാരണം, “മോഹിക്കരുത്” എന്നു ന്യായപ്രമാണം പറഞ്ഞിരുന്നില്ലെങ്കിൽ മോഹം[a] എന്തെന്ന് ഞാൻ അറിയുമായിരുന്നില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആഗ്രഹം”; എന്നാൽ തൊട്ടുപിന്നാലെ കല്പന ഉദ്ധരിക്കുന്നതിനാൽ ഇവിടെ നിരോധിതമായ മോഹം എന്ന പ്രത്യേക അർഥത്തിനാണ് മുൻതൂക്കം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: അപ്പോൾ നാം എന്തു പറയും?
  rationale: പൗലോസിന്റെ വാദത്തിലെ ആലങ്കാരികമായ പരിവർത്തനചോദ്യം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: റോമർ ലേഖനത്തിലെ ഈ സന്ദർഭത്തിൽ മോശെയുടെ നിയമത്തെ സൂചിപ്പിക്കുന്നതിനുള്ള സ്ഥാപിതവും വ്യക്തവുമായ മലയാളപദം.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: ഗ്രീക്കിലെ നാമരൂപവും നിയമം പാപത്തോടുതന്നെ തുല്യമാണോ എന്ന മൂർച്ചയുള്ള ചോദ്യവും നിലനിർത്തുന്നു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമല്ല!
  rationale: സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായ മലയാളത്തിൽ ശക്തമായ നിഷേധം പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀλλὰ
  choice: മറിച്ച്
  rationale: മുൻചോദ്യത്തിന്റെ ശക്തമായ നിഷേധത്തിനു ശേഷമുള്ള തിരുത്തൽസ്വഭാവമുള്ള വൈരുധ്യം വ്യക്തമാക്കുന്നു.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: ന്യായപ്രമാണത്തിലൂടെയല്ലാതെ ഞാൻ പാപത്തെ അറിയുമായിരുന്നില്ല
  rationale: εἰ μὴ എന്ന വ്യവസ്ഥാപരമായ ആശയം മലയാളത്തിലെ സോപാധിക ക്രിയാരൂപത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘അറിയുക’ എന്നത് മൂലപദത്തോട് അടുത്തുനിൽക്കുന്നു.
- source_word: ἐπιθυμίαν
  choice: മോഹം
  rationale: ഇത് ആഗ്രഹം എന്നും മോഹം എന്നും അർഥമാകാം; എന്നാൽ പിന്നാലെയുള്ള പത്താം കല്പനയുടെ ഉദ്ധരണം നിരോധിതമായ മോഹം എന്ന പ്രത്യേക അർഥത്തെ പിന്തുണയ്ക്കുന്നു.
- source_word: οὐκ ᾔδειν
  choice: എന്തെന്ന് ഞാൻ അറിയുമായിരുന്നില്ല
  rationale: മുൻവാക്യത്തിലെ അറിവിന്റെ ആശയവുമായി സമാന്തരത നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമാക്കുന്നു.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: മോഹിക്കരുത്
  rationale: ഗ്രീക്ക് വിലക്കിന്റെ ശക്തി ലളിതവും നേരിട്ടുള്ളതുമായ മലയാള കല്പനാരൂപത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ന്യായപ്രമാണവും പാപവും തമ്മിലുള്ള ബന്ധം
  choice: ന്യായപ്രമാണം പാപമാണോ?
  alternative: ന്യായപ്രമാണം പാപകരമാണോ?
  rationale: ഗ്രീക്കിലെ വിധേയനാമം ന്യായപ്രമാണത്തിന് പാപസ്വഭാവമുണ്ടോ എന്നു മാത്രമല്ല, അത് പാപം തന്നെയാണോ എന്നു ചോദിക്കുന്നു; അതിനാൽ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ മൂർച്ച മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന വിധത്തിൽ ലളിതവും അതേസമയം തിരുവെഴുത്തിന് യോജിച്ച മാന്യവുമായ ശൈലി. വാദത്തിന്റെ ആവർത്തനവും ശക്തമായ നിഷേധവും സംരക്ഷിച്ചിരിക്കുന്നു.
