id: ROM.7.21
reference: Romans 7:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ml
  text: അതുകൊണ്ട്, നന്മ ചെയ്യാൻ ആഗ്രഹിക്കുന്ന എനിക്ക് തിന്മ എന്റെ അരികിൽത്തന്നെയുണ്ടെന്ന ഈ നിയമം[a] ഞാൻ കണ്ടെത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തത്ത്വം” അല്ലെങ്കിൽ “ചട്ടം.”
    reason: νόμος ഇവിടെ ഒരു പ്രവർത്തനതത്ത്വത്തെയോ സ്ഥിരമായി അനുഭവപ്പെടുന്ന ക്രമത്തെയോ സൂചിപ്പിക്കാമെന്ന വ്യാഖ്യാനസാധ്യത വ്യക്തമാക്കാൻ.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: ഞാൻ കണ്ടെത്തുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള ക്രിയയെ തുടർന്നുനിൽക്കുന്ന തിരിച്ചറിവായി സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന ബന്ധപദത്തിന്റെ ശക്തി നിലനിർത്തുന്നു.
- source_word: νόμον
  choice: നിയമം
  rationale: νόμος എന്ന പദത്തിന്റെ നിയമസംബന്ധമായ പ്രതിധ്വനിയും സന്ദർഭത്തിലെ അർത്ഥവൈവിധ്യവും നിലനിർത്തുന്നു; ഇവിടെ ഒരു പ്രവർത്തനതത്ത്വമോ പതിവായ ക്രമമോ ഉദ്ദേശിച്ചിരിക്കാമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: നന്മ ചെയ്യാൻ ആഗ്രഹിക്കുന്ന എന്നിൽ
  rationale: ഗ്രീക്കിലെ ദത്തിവ് ഘടനയും θέλω എന്ന പദത്തിന്റെ ഇച്ഛാശക്തിയും മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: τὸ καλὸν
  choice: നന്മ
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തെ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായും സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: τὸ κακὸν
  choice: തിന്മ
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ നൈതിക അർത്ഥം നേരിട്ട് പകരുന്നു.
- source_word: παράκειται
  choice: എന്റെ അരികിൽത്തന്നെയുണ്ട്
  rationale: അരികിൽ കിടക്കുക, സമീപത്ത് സന്നിഹിതമായിരിക്കുക എന്നീ ആശയങ്ങൾ സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും തിന്മയുടെ ഉടനെയുള്ള സാന്നിധ്യം ഊന്നിപ്പറയുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: νόμον എന്നത് മോശെയുടെ ന്യായപ്രമാണത്തെയാണോ, ഒരു പ്രവർത്തനതത്ത്വത്തെയോ ആവർത്തിച്ചുവരുന്ന ക്രമത്തെയോ ആണോ സൂചിപ്പിക്കുന്നത്
  choice: മുഖ്യപാഠത്തിൽ “നിയമം” എന്ന് നിലനിർത്തി.
  alternative: “തത്ത്വം” അല്ലെങ്കിൽ “ചട്ടം”
  rationale: പൗലോസ് ഉപയോഗിച്ച νόμος എന്ന പദത്തിന്റെ നിയമസംബന്ധമായ പ്രതിധ്വനി നഷ്ടപ്പെടുത്താതെയും, അതിനെ മോശെയുടെ ന്യായപ്രമാണമായി മാത്രം നിർണയിക്കാതെയും അർത്ഥത്തിലെ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്ക് വാക്യത്തിന്റെ ആശയക്രമം കഴിയുന്നത്ര നിലനിർത്തിയെങ്കിലും അസ്വാഭാവികമായ പദാനുപദ ഘടന ഒഴിവാക്കി.
