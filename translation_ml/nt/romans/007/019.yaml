revisions:
- from: എന്തെന്നാൽ, ഞാൻ ആഗ്രഹിക്കുന്ന നന്മ ഞാൻ ചെയ്യുന്നില്ല; എന്നാൽ ഞാൻ ആഗ്രഹിക്കാത്ത തിന്മ—അതുതന്നെ ഞാൻ പ്രവർത്തിക്കുന്നു.[a]
  to: എന്തെന്നാൽ, ഞാൻ ആഗ്രഹിക്കുന്ന നന്മ ഞാൻ ചെയ്യുന്നില്ല; എന്നാൽ ഞാൻ ആഗ്രഹിക്കാത്ത തിന്മ—അതുതന്നെ ഞാൻ ചെയ്യുന്നു.[a]
  rationale: The revision preserves every major source-language feature represented by the draft while replacing an unnatural Malayalam verb choice. Because ποιῶ and πράσσω overlap substantially, rendering both with the natural Malayalam verb ‘ചെയ്യുന്നു’ is preferable; the footnote transparently preserves awareness of the Greek lexical variation.
