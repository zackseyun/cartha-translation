  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഞാൻ ആഗ്രഹിക്കുന്ന നന്മ ഞാൻ ചെയ്യുന്നില്ല; എന്നാൽ ഞാൻ ആഗ്രഹിക്കാത്ത തിന്മ—അതുതന്നെ ഞാൻ ചെയ്യുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ വാക്യത്തിന്റെ ആദ്യഭാഗത്തും രണ്ടാംഭാഗത്തും വ്യത്യസ്ത ക്രിയകളാണ് ഉപയോഗിച്ചിരിക്കുന്നത്; എങ്കിലും അവയുടെ അർത്ഥങ്ങൾ ഗണ്യമായി ഒത്തുചേരുന്നു. ഇവിടെ രണ്ടും സ്വാഭാവിക മലയാളത്തിൽ ‘ചെയ്യുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: ആഗ്രഹിക്കുന്നു
  rationale: ഇവിടെ ഉദ്ദേശ്യവും ഇച്ഛയും സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ ആധുനിക മലയാളപ്രയോഗം.
- source_word: ποιῶ
  choice: ചെയ്യുന്നു
  rationale: സാധാരണവും നേരിട്ടുള്ളതുമായ പരിഭാഷ; വാക്യത്തിന്റെ രണ്ടാം ഭാഗത്തെ πράσσω എന്ന വ്യത്യസ്ത ക്രിയയിൽനിന്ന് കഴിയുന്നത്ര വേർതിരിക്കുന്നു.
- source_word: ἀγαθόν
  choice: നന്മ
  rationale: തിന്മയോടുള്ള ശക്തമായ ധാർമ്മിക വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κακὸν
  choice: തിന്മ
  rationale: വെറും ‘മോശമായത്’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ ധാർമ്മിക ഭാരം വ്യക്തമാക്കുകയും ‘നന്മ’യോടുള്ള സമാന്തരത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: πράσσω
  choice: പ്രവർത്തിക്കുന്നു
  rationale: ποιῶ എന്ന ‘ചെയ്യുന്നു’ എന്ന ക്രിയയിൽനിന്നുള്ള ഗ്രീക്ക് പദവ്യത്യാസം സൂചിപ്പിക്കുന്നു; എങ്കിലും രണ്ടിന്റെയും അർത്ഥപരിധികൾ തമ്മിൽ ഗണ്യമായ മേളനമുണ്ട്.
- source_word: τοῦτο
  choice: അതുതന്നെ
  rationale: ഗ്രീക്കിലെ ഊന്നൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οὐ γὰρ
  choice: എന്തെന്നാൽ ... ഇല്ല
  rationale: γάρ-ന്റെ വിശദീകരണാത്മക ബന്ധം മുൻവാക്യത്തോടു നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലൊസിന്റെ ധാർമ്മിക വൈരുധ്യം മൃദൂകരിക്കണമോ
  choice: ‘നന്മ’ / ‘തിന്മ’ എന്ന നേരിട്ടുള്ള ധാർമ്മിക വിഭാഗങ്ങൾ നിലനിർത്തി.
  alternative: ‘ശരിയായത്’ / ‘തെറ്റായത്’ അല്ലെങ്കിൽ ‘നല്ലത്’ / ‘മോശമായത്’.
  rationale: ἀγαθόν, κακόν എന്നിവ ഇവിടെ ശക്തമായ ധാർമ്മിക അർത്ഥം വഹിക്കുന്നു; വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം മൃദൂകരിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എന്തെന്നാൽ’ വിശദീകരണബന്ധവും ദീർഘരേഖ τοῦτο-യുടെ ഊന്നലും നിലനിർത്തുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
