  text: συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: ml
  text: എന്റെ ആന്തരിക മനുഷ്യന്റെ കാര്യത്തിൽ ഞാൻ ദൈവത്തിന്റെ ന്യായപ്രമാണത്തിൽ ആനന്ദിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്റെ ആന്തരിക സ്വത്വത്തിന്റെ കാര്യത്തിൽ’ അല്ലെങ്കിൽ ‘എന്റെ ആന്തരിക അസ്തിത്വത്തിന്റെ കാര്യത്തിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήδομαι
  choice: ആനന്ദിക്കുന്നു
  rationale: ഈ ക്രിയ കേവലമായ ബൗദ്ധിക യോജിപ്പല്ല, സന്തോഷത്തോടെയുള്ള അംഗീകാരമാണ് സൂചിപ്പിക്കുന്നത്; ‘ആനന്ദിക്കുന്നു’ അതിന്റെ ഭാവാത്മക ശക്തി സ്വാഭാവികമായി നൽകുന്നു.
- source_word: νόμῳ
  choice: ന്യായപ്രമാണത്തിൽ
  rationale: റോമർ ലേഖനത്തിലെ പൗലോസിന്റെ പ്രയോഗത്തിൽ νόμος ദൈവത്തിന്റെ നിയമത്തെ ശക്തമായി സൂചിപ്പിക്കുന്നു; ‘ന്യായപ്രമാണം’ ആ സ്ഥാപിതമായ ബൈബിൾപ്രയോഗവും ദൈവശാസ്ത്രപരമായ ഭാരവും നിലനിർത്തുന്നു.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: ജനിറ്റീവ് ബന്ധം നേരിട്ട്, സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: κατὰ
  choice: എന്ന നിലയിൽ
  rationale: κατά ഇവിടെ ഏത് നിലയിലോ പരിഗണനയിലോ ഈ ആനന്ദം സത്യമാണ് എന്നു വ്യക്തമാക്കുന്നു; ‘എന്ന നിലയിൽ’ ഗ്രീക്കിലെ ബന്ധം നിലനിർത്തുകയും ‘എന്റെ’ എന്നു മൂലത്തിൽ ഇല്ലാത്ത പദം ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: ആന്തരികമനുഷ്യൻ
  rationale: പൗലോസിന്റെ വ്യക്തിരൂപകം നിലനിർത്തുന്നു; അതിനെ മനുഷ്യഘടനയെക്കുറിച്ചുള്ള ഒരു സാങ്കേതിക സിദ്ധാന്തമായി വിശദീകരിക്കുന്നില്ല. കൂടുതൽ സ്വാഭാവികമായ അർത്ഥവികല്പങ്ങൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘ആന്തരികമനുഷ്യൻ’ എന്ന പ്രയോഗത്തിന്റെ മനുഷ്യശാസ്ത്രപരമായ സൂക്ഷ്മത
  choice: ‘ആന്തരികമനുഷ്യൻ എന്ന നിലയിൽ’ എന്ന് രൂപകം നിലനിർത്തി വിവർത്തനം ചെയ്തു.
  alternative: ‘എന്റെ ആന്തരികസ്വത്വത്തിൽ’ അല്ലെങ്കിൽ ‘എന്റെ ഉള്ളിൽ’
  rationale: മൂലത്തിലെ വ്യക്തിരൂപകവും κατὰ എന്നതിന്റെ ബന്ധവും സംരക്ഷിക്കുന്നു; അതേസമയം മനുഷ്യന്റെ ഘടനയെക്കുറിച്ചുള്ള പ്രത്യേക ദൈവശാസ്ത്ര മാതൃക ഒന്നും വാക്യത്തിൽ ഇറക്കിവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ഗൗരവവും വായനാസൗകര്യവും തുലനം ചെയ്തു. ‘ന്യായപ്രമാണം’ പൗലോസിന്റെ νόμος പ്രയോഗത്തിന്റെ പതിവായ ബൈബിൾഭാരം കാത്തുസൂക്ഷിക്കുന്നു; ‘ആന്തരികമനുഷ്യൻ’ മൂലത്തിലെ രൂപകം നിലനിർത്തുന്നു.
