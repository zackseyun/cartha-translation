id: ROM.7.20
reference: Romans 7:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ ഇച്ഛിക്കാത്തത് തന്നെയാണ് ചെയ്യുന്നതെങ്കിൽ, അത് ചെയ്യുന്നത് ഇനി ഞാനല്ല; എന്നിൽ വസിക്കുന്ന പാപമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ ... ചെയ്യുന്നുവെങ്കിൽ
  rationale: മുൻവാദത്തെ തുടർന്നുകൊണ്ടുള്ള വ്യവസ്ഥയും മൃദുവായ വൈരുധ്യവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: ഞാൻ ഇച്ഛിക്കാത്തതു ചെയ്യുന്നു
  rationale: ഗ്രീക്കിലെ relative-correlative ഘടനയുടെ ഊന്നൽ അമിതവിസ്താരമില്ലാതെ വ്യക്തമായി നൽകുന്നു; θέλω എന്നത് ഇവിടെ മനസ്സിന്റെ ഇച്ഛയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘ഇച്ഛിക്കുക’ തെരഞ്ഞെടുത്തു.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: അതു ചെയ്യുന്നത് ഇനി ഞാനല്ല
  rationale: οὐκέτιയുടെ ‘ഇനി ... അല്ല’ എന്ന അർഥവും ἐγώയ്ക്കുള്ള വൈരുധ്യാത്മക ഊന്നലും സ്വാഭാവികമായി സംരക്ഷിക്കുന്നു. ποιῶയും κατεργάζομαιയും ഒരേ മലയാളക്രിയയിൽ വരുന്നത് ശൈലീപരമായി സ്വാഭാവികവും ഈ വാക്യത്തിലെ പ്രവർത്തകനെക്കുറിച്ചുള്ള മുഖ്യവൈരുധ്യം വ്യക്തമാക്കുന്നതുമാണ്.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: എന്നിൽ വസിക്കുന്ന പാപം
  rationale: οἰκέωയുടെ ഉള്ളിൽ പാർക്കുന്നുവെന്ന രൂപകവും ἁμαρτίαയെ വ്യക്തിവൽക്കരിക്കുന്ന പൗലോസിന്റെ പ്രയോഗവും നിലനിർത്തുന്നു; ‘പാപസ്വഭാവം’ പോലുള്ള വ്യാഖ്യാനപരമായ പദം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: ‘ഞാൻ’ എന്നും ‘എന്നിൽ വസിക്കുന്ന പാപം’ എന്നും തമ്മിലുള്ള പൗലോസിന്റെ വ്യത്യാസം വ്യക്തിപരമായ ഉത്തരവാദിത്വം ഇല്ലാതാക്കുന്ന വിധത്തിലോ പാപത്തെ വെറും അമൂർത്ത ആശയമാക്കുന്ന വിധത്തിലോ വ്യാഖ്യാനിക്കണമോ എന്നത്.
  choice: ‘അതു ചെയ്യുന്നത് ഇനി ഞാനല്ല; എന്നിൽ വസിക്കുന്ന പാപമാണ്’ എന്ന് ഗ്രീക്കിലെ വൈരുധ്യം നേരിട്ട് നിലനിർത്തി.
  alternative: ഉത്തരവാദിത്വത്തെയോ മനുഷ്യസ്വഭാവത്തെയോ വിശദീകരിക്കുന്ന വ്യാഖ്യാനാത്മക പരാവർത്തനം നൽകുക; അല്ലെങ്കിൽ ‘പാപസ്വഭാവം’ എന്നു വിവർത്തനം ചെയ്യുക.
  rationale: മൂലപാഠം ἁμαρτία (‘പാപം’) എന്നാണ് പറയുന്നത്; σάρξ (‘ജഡം’) എന്നോ ‘പാപസ്വഭാവം’ എന്നോ അല്ല. അതിനാൽ വിവാദമായ ദൈവശാസ്ത്രപരമായ ഉദ്ദേശ്യം വിവർത്തനം തന്നെ തീർപ്പാക്കാതെ വാക്യത്തിലെ സംഘർഷം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഇംഗ്ലീഷ് consultation layer-ലുള്ള [a] അടിക്കുറിപ്പ് അതിന്റെ സ്ഥാനത്തോടോ ഗ്രീക്ക് പാഠത്തിലെ യഥാർഥ വിവർത്തനവൈകല്യത്തോടോ പൊരുത്തപ്പെടാത്തതിനാൽ ഉൾപ്പെടുത്തിയിട്ടില്ല.
