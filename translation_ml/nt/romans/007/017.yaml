- from: എന്നാൽ ഇപ്പോൾ അതു പ്രവർത്തിക്കുന്നത് ഇനി ഞാനല്ല[a], എന്നിൽ വസിക്കുന്ന പാപമാണ്.
  to: എന്നാൽ ഇപ്പോൾ അത് ചെയ്യുന്നത്[a] ഇനി ഞാനല്ല, മറിച്ച് എന്നിൽ വസിക്കുന്ന പാപമാണ്.
