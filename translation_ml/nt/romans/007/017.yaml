id: ROM.7.17
reference: Romans 7:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ അത് ചെയ്യുന്നത്[a] ഇനി ഞാനല്ല, മറിച്ച് എന്നിൽ വസിക്കുന്ന പാപമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇനി അത് ചെയ്യുന്നത് ഞാനല്ല; എന്നിൽ വസിക്കുന്ന പാപമാണ്.”
    reason: ഗ്രീക്കിലെ ഊന്നലുള്ള ἐγώയെ മലയാളത്തിൽ മുൻപോട്ടു കൊണ്ടുവരുന്ന സ്വാഭാവികമായ പദക്രമവ്യത്യാസം.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: മുൻവാക്യത്തിലെ വാദത്തിൽനിന്നുള്ള കാലപരവും യുക്തിപരവുമായ വൈരുധ്യപരിവർത്തനം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: പ്രവർത്തനവുമായി താൻ തിരിച്ചറിയപ്പെടുന്നതിൽനിന്നുള്ള വേർതിരിവ് സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: ἐγὼ
  choice: ഞാനല്ല
  rationale: ഗ്രീക്കിലെ പ്രത്യക്ഷവും ഊന്നലുള്ളതുമായ സർവനാമം മലയാളത്തിൽ ക്രിയയ്ക്കുമുമ്പായി നിലനിർത്തി ഊന്നൽ നൽകുന്നു.
- source_word: κατεργάζομαι
  choice: പ്രവർത്തിക്കുന്നത്
  rationale: സന്ദർഭത്തിൽ മുമ്പ് പറഞ്ഞ പ്രവൃത്തി ചെയ്തുനിറവേറ്റുന്നതിനെ സൂചിപ്പിക്കുന്നു; ‘പ്രവർത്തിക്കുന്നത്’ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: αὐτὸ
  choice: അതു
  rationale: മുൻസന്ദർഭത്തിൽ പറഞ്ഞ പ്രവൃത്തിയിലേക്കു തിരിച്ചുചൂണ്ടുന്ന നപുംസകലിംഗ സർവനാമത്തിന്റെ സൂചന നിലനിർത്തുന്നു.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: എന്നിൽ വസിക്കുന്ന പാപം
  rationale: പാപത്തെ വ്യക്തിവൽക്കരിക്കുന്ന പൗലോസിന്റെ ശക്തമായ രൂപകം നിലനിർത്തുകയും വർത്തമാനകാല കൃതന്തത്തിന്റെ തുടർച്ചാഭാവം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οἰκοῦσα
  choice: വസിക്കുന്ന
  rationale: ‘ജീവിക്കുന്ന’ എന്നതിനെക്കാൾ ഗ്രീക്കിലെ പാർപ്പിടരൂപകവും ഗൗരവമുള്ള ഭാവവും കൃത്യമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ‘ഞാൻ’ എന്നും ‘എന്നിൽ വസിക്കുന്ന പാപം’ എന്നും പൗലോസ് വരയ്ക്കുന്ന വ്യത്യാസം ഉത്തരവാദിത്വം ഒഴിവാക്കുന്നതായി തെറ്റിദ്ധരിക്കപ്പെടാം.
  choice: വാക്യത്തിലെ ശക്തമായ വ്യത്യാസം വിശദീകരിച്ചു മയപ്പെടുത്താതെ അതേപടി നിലനിർത്തുന്നു.
  alternative: ആന്തരിക സംഘർഷത്തിന് ഊന്നൽ നൽകുന്ന വിധത്തിൽ പരാവർത്തനം ചെയ്യുക, അല്ലെങ്കിൽ ഉത്തരവാദിത്വത്തെക്കുറിച്ചുള്ള തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ വിശദീകരണം ചേർക്കുക.
  rationale: മൂലവാക്യം പ്രവർത്തകത്വത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷം ഉദ്ദേശപൂർവം ശക്തമായി അവതരിപ്പിക്കുന്നു; വിവർത്തനം അതിനെ പരിഹരിക്കാതെ സംരക്ഷിക്കണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വസിക്കുന്ന’ എന്ന പദം പാപത്തിന്റെ വ്യക്തിവൽക്കരണവും പാർപ്പിടരൂപകവും നിലനിർത്തുന്നു. മുഖ്യവാക്യത്തിലെ ‘ഞാനല്ല’ എന്ന ക്രമം ἐγώയുടെ ഊന്നൽ പ്രകടമാക്കുന്നു.
