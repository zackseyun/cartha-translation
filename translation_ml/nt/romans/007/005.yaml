id: ROM.7.5
reference: Romans 7:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: ml
  text: നാം ജഡത്തിൽ ആയിരുന്നപ്പോൾ[a], ന്യായപ്രമാണത്തിലൂടെ ഉണ്ടായിരുന്ന പാപകരമായ വികാരങ്ങൾ[b] നമ്മുടെ അവയവങ്ങളിൽ[c] പ്രവർത്തിച്ചിരുന്നത് മരണത്തിലേക്കു ഫലം കായിക്കേണ്ടതിനായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘പാപാധീനമായ മനുഷ്യാവസ്ഥയിൽ.’ ഇവിടെ ‘ജഡം’ എന്നത് ശരീരം മാത്രമല്ല, പഴയ പാപാധീന മനുഷ്യാവസ്ഥയെയും സൂചിപ്പിക്കാം.'
    reason: alternative_reading
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘പാപങ്ങളുടെ വികാരങ്ങൾ.’'
    reason: lexical_alternative
  - marker: c
    text: ഇവിടെ ‘അവയവങ്ങൾ’ എന്നത് പ്രവർത്തനോപകരണങ്ങളായ ശരീരഭാഗങ്ങളെയും അവയുടെ ശേഷികളെയും സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: ജഡത്തിൽ
  rationale: പൗലോസിന്റെ സവിശേഷമായ ജഡം/ആത്മാവ് വൈരുധ്യവും ഇതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: പാപകരമായ വികാരങ്ങൾ
  rationale: പാപത്താൽ സ്വഭാവനിർണയം ചെയ്യപ്പെട്ട ഉള്ളിലെ പ്രേരണകളെയാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. അക്ഷരാർഥത്തിലുള്ള ‘പാപങ്ങളുടെ വികാരങ്ങൾ’ മലയാളത്തിൽ അസ്വാഭാവികവും അവ്യക്തവുമാണ്.
- source_word: τὰ διὰ τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിലൂടെ ഉണ്ടായ
  rationale: διά എന്നതിന്റെ മാധ്യമ/കാരണസൂചന നിലനിർത്തുന്നു; ‘ഉണർത്തപ്പെട്ട’ എന്നു ചേർത്ത് സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനം വാക്യത്തിലേക്ക് ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: ἐνηργεῖτο
  choice: പ്രവർത്തിച്ച്
  rationale: ഭൂതകാലത്ത് തുടർന്നിരുന്ന പ്രവർത്തനത്തെ തുടർന്നുള്ള ‘കായിച്ചുകൊണ്ടിരുന്നു’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: നമ്മുടെ അവയവങ്ങളിൽ
  rationale: ശരീരഭാഗങ്ങളെയും പ്രവർത്തനോപകരണങ്ങളായ അവയുടെ ശേഷികളെയും ഉൾക്കൊള്ളുന്ന പൗലോസിന്റെ പ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: മരണത്തിനായി ഫലം കായിച്ചുകൊണ്ടിരുന്നു
  rationale: ഫലം കായിക്കുക എന്ന രൂപകം നിലനിർത്തുകയും ദിശ/ഫലസൂചന നൽകുന്ന മരണബന്ധം ഉദ്ദേശപൂർവം കടുപ്പത്തോടെ സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν τῇ σαρκί എന്ന പ്രയോഗം അക്ഷരസുതാര്യമായി വേണമോ വ്യാഖ്യാനാത്മകമായി വേണമോ
  choice: ജഡത്തിൽ
  alternative: പാപാധീനമായ മനുഷ്യാവസ്ഥയിൽ
  rationale: ‘പാപസ്വഭാവത്തിൽ’ എന്നു മാത്രം പറഞ്ഞാൽ പൗലോസിന്റെ σάρξ എന്ന ബഹുവ്യഞ്ജക പദത്തെ ഒരു നിശ്ചിത മാനവശാസ്ത്രസൂത്രമായി ചുരുക്കും. മുഖ്യപാഠം പദരൂപവും പിരിമുറുക്കവും നിലനിർത്തുന്നു; അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: διὰ τοῦ νόμου പാപവികാരങ്ങളെ ‘ഉണർത്തി’ എന്നു വ്യക്തമാക്കണമോ
  choice: ന്യായപ്രമാണത്തിലൂടെ ഉണ്ടായ
  alternative: ന്യായപ്രമാണത്താൽ ഉണർത്തപ്പെട്ട
  rationale: വിശാലസന്ദർഭത്തിൽ ‘ഉണർത്തപ്പെട്ട’ സാധ്യമെങ്കിലും, ഈ പദസമുച്ചയം സ്വതന്ത്രമായി അത്ര വ്യക്തമായി പറയുന്നില്ല. അതിനാൽ കാരണ/മാധ്യമബന്ധം തുറന്ന നിലയിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ജഡം’, ‘ന്യായപ്രമാണം’, ‘ഫലം കായിക്കുക’ എന്നീ പൗലോസീയ പ്രയോഗങ്ങൾ അന്തർപാഠബന്ധവും രൂപകവും നിലനിർത്താൻ സംരക്ഷിച്ചു; അപരിചിതത്വം അടിക്കുറിപ്പുകൾകൊണ്ട് പരിഹരിച്ചു.
