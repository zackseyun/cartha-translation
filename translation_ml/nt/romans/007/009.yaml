id: ROM.7.9
reference: Romans 7:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: ml
  text: ഒരിക്കൽ ഞാൻ ന്യായപ്രമാണം കൂടാതെ ജീവനുള്ളവനായിരുന്നു; എന്നാൽ കല്പന വന്നപ്പോൾ പാപം ജീവൻ പ്രാപിച്ചു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘വീണ്ടും ജീവിച്ചു.’
    reason: ἀνέζησεν എന്നതിന് പുനർജീവനെന്ന ഭാവവും പ്രകടിപ്പിക്കാനാകുന്നതിനാൽ ഈ പദാർഥവികല്പം നൽകുന്നു.
lexical_decisions:
- source_word: ἔζων
  choice: ജീവനുള്ളവനായിരുന്നു
  rationale: തൊട്ടടുത്ത സന്ദർഭത്തിലെ ജീവൻ–മരണം വൈരുധ്യം നിലനിർത്താൻ കേവലം ‘ജീവിച്ചിരുന്നു’ എന്നതിനു പകരം അവസ്ഥ സൂചിപ്പിക്കുന്ന പ്രയോഗം സ്വീകരിച്ചു.
- source_word: χωρὶς νόμου
  choice: ന്യായപ്രമാണം കൂടാതെ
  rationale: χωρίς എന്നതിന്റെ വേർപാടിന്റെ ആശയം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ഇവിടെ νόμος മോശെയുടെ ന്യായപ്രമാണത്തെ സൂചിപ്പിക്കാനുള്ള സാധ്യതയ്ക്കൊത്ത പതിവ് ബൈബിൾപദമാണ് ‘ന്യായപ്രമാണം’.
- source_word: ποτέ
  choice: ഒരിക്കൽ
  rationale: പൗലോസിന്റെ ഭൂതകാലപരാമർശം ലളിതമായും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: കല്പന വന്നപ്പോൾ
  rationale: ഗ്രീക്കിലെ genitive absolute ഘടനയെ അതിന്റെ കാലസംബന്ധമായ അർഥം കാത്തുകൊണ്ട് സ്വാഭാവിക മലയാള ഉപവാക്യമാക്കി.
- source_word: ἐντολῆς
  choice: കല്പന
  rationale: νόμος എന്ന ‘ന്യായപ്രമാണ’ത്തിൽനിന്ന് വേർതിരിച്ചുകൊണ്ട് നിർദിഷ്ട ആജ്ഞയെ സൂചിപ്പിക്കുന്ന, മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പദം.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: പൗലോസ് വ്യക്തിവൽക്കരിച്ച് ഏകവചനത്തിൽ ഉപയോഗിക്കുന്ന ആശയം അതേപടി നിലനിർത്തുന്നു.
- source_word: ἀνέζησεν
  choice: ജീവൻ പ്രാപിച്ചു
  rationale: വ്യക്തിവൽക്കരിച്ച പാപം സജീവമാകുന്ന രൂപകം വ്യക്തമായി നൽകുന്നു; ‘വീണ്ടും ജീവിച്ചു’ എന്ന സാധ്യതയുള്ള അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
theological_decisions:
- issue: ഒന്നാംപുരുഷ പ്രസ്താവന പൗലോസിന്റെ വ്യക്തിപരമായ അനുഭവമാണോ, ഇസ്രായേലിനെയോ മനുഷ്യരാശിയെയോ പ്രതിനിധാനം ചെയ്യുന്നതാണോ
  choice: വ്യാഖ്യാനപരമായ വിശദീകരണമില്ലാതെ ലളിതമായ ഒന്നാംപുരുഷ പ്രസ്താവന നിലനിർത്തി.
  alternative: ഇത് പൗലോസിന്റെ കർശനമായ ആത്മകഥാപരമായ പ്രസ്താവനയെന്നോ, ഇസ്രായേലിനെയോ മനുഷ്യരാശിയെയോ പ്രതിനിധാനം ചെയ്യുന്ന പ്രസ്താവനയെന്നോ തുറന്നുപറയുക.
  rationale: ഈ വാക്യത്തിലെ ഗ്രീക്ക് മാത്രം വിശാലമായ വ്യാഖ്യാനപ്രശ്നം തീർപ്പാക്കുന്നില്ല; അതിനാൽ അതിന്റെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില പരിഭാഷയിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം’, ‘കല്പന’ എന്നീ വ്യത്യസ്ത പദങ്ങൾ νόμος–ἐντολή വ്യത്യാസം കാത്തുസൂക്ഷിക്കുന്നു.
