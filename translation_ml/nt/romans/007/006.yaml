id: ROM.7.6
reference: Romans 7:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, നമ്മെ ബന്ധിച്ചുവെച്ചിരുന്നതിന് മരിച്ചവരായ നാം ന്യായപ്രമാണത്തിൽനിന്ന് മോചിതരായിരിക്കുന്നു. അങ്ങനെ നാം അക്ഷരത്തിന്റെ പഴക്കത്തിലല്ല, ആത്മാവിന്റെ പുതുമയിൽ സേവിക്കേണ്ടതിന്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ആത്മാവിന്റെ പുതുമയിൽ” എന്നത് പരിശുദ്ധാത്മാവിനെയല്ല, മനുഷ്യാത്മാവിനെയോ പൊതുവായി ‘ആത്മാവിനെ’യോ സൂചിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം. “അക്ഷരത്തിന്റെ പഴക്കത്തിൽ” എന്നതിന് “എഴുതപ്പെട്ട നിയമസംഹിതയുടെ പഴയ രീതിയിൽ” എന്നും വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: ന്യായപ്രമാണത്തിൽനിന്ന് മോചിതരായിരിക്കുന്നു
  rationale: നിയമം ഇല്ലാതായി എന്നല്ല, അതിന്റെ ബന്ധനാധികാരത്തിൽനിന്ന് വിശ്വാസികൾ വിടുവിക്കപ്പെട്ടു എന്ന ബന്ധപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἀποθανόντες ἐν ᾧ κατειχόμεθα
  choice: നമ്മെ പിടിച്ചുവെച്ചിരുന്നതിനു മരിച്ചവരായ നാം
  rationale: മരിച്ചത് ന്യായപ്രമാണമല്ല, ‘നാം’ ആണെന്ന ഗ്രീക്ക് വ്യാകരണം നിലനിർത്തുകയും κατέχω എന്നതിലെ പിടിച്ചുവെക്കൽ/ബന്ധനം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: δουλεύειν
  choice: സേവിക്കുന്നു
  rationale: അടിമസേവനത്തിന്റെ പശ്ചാത്തലനിറം പൂർണമായി മായ്ക്കാതെ, ഈ വാക്യത്തിലെ സേവനരീതിയിലേക്കുള്ള ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν καινότητι πνεύματος
  choice: ആത്മാവിന്റെ പുതുമയിൽ
  rationale: καινότης എന്ന അമൂർത്തനാമവും ‘പഴക്കം’ എന്നതിനോടുള്ള സമാന്തരവിരോധവും കാത്തുസൂക്ഷിക്കുന്നു; πνεῦμα പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി മുഖ്യവായന സ്വീകരിക്കുന്നു.
- source_word: οὐ παλαιότητι γράμματος
  choice: അക്ഷരത്തിന്റെ പഴക്കത്തിലല്ല
  rationale: γράμμα എന്ന പൗലോസിന്റെ സംക്ഷിപ്ത പ്രയോഗവും καινότης/παλαιότης എന്ന വാക്ചാതുര്യപരമായ സമാന്തരതയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: മരിച്ചത് ന്യായപ്രമാണമാണോ വിശ്വാസികളാണോ
  choice: ‘നാം’ മരിച്ചവരാണ്
  alternative: ന്യായപ്രമാണം നമ്മോടുള്ള ബന്ധത്തിൽ മരിച്ചു
  rationale: ἀποθανόντες എന്ന കർത്തൃവിശേഷണം നാമനിർദേശക ബഹുവചനമായതിനാൽ അതിന്റെ കർത്താവ് ഉൾക്കൊള്ളപ്പെട്ടിരിക്കുന്ന ‘നാം’ തന്നെയാണ്.
- issue: πνεύματος പരിശുദ്ധാത്മാവിനെയോ മനുഷ്യാത്മാവിനെയോ സൂചിപ്പിക്കുന്നുവോ
  choice: ആത്മാവ്—പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്ന മുഖ്യവായന
  alternative: മനുഷ്യാത്മാവ് അല്ലെങ്കിൽ ആത്മീയമായ പുതിയ നില
  rationale: പൗലോസിന്റെ ‘ആത്മാവ്–അക്ഷരം’ വിരോധവും പുതിയ ഉടമ്പടിയുടെ പശ്ചാത്തലവും പരിശുദ്ധാത്മാവെന്ന വായനയെ കൂടുതൽ സാധ്യതയുള്ളതാക്കുന്നു; യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘ന്യായപ്രമാണം’ പൗലോസിന്റെ മോശൈക നിയമസന്ദർഭം സൂചിപ്പിക്കാൻ ഉപയോഗിച്ചു. ‘പുതുമ/പഴക്കം’ എന്ന രൂപസമാന്തരതയും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും കാത്തുസൂക്ഷിച്ചു.
