id: ROM.7.11
reference: Romans 7:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: ml
  text: എന്തെന്നാൽ, പാപം കല്പനയിലൂടെ അവസരം മുതലെടുത്ത്[a] എന്നെ വഞ്ചിക്കുകയും അതിലൂടെ[b] എന്നെ കൊല്ലുകയും ചെയ്തു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സന്ദർഭം പ്രയോജനപ്പെടുത്തി.’
    reason: lexical_alternative
  - marker: b
    text: ‘അത്’ എന്നത് കല്പനയെ സൂചിപ്പിക്കുന്നു.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പ്രസ്താവനയെ വിശദീകരിക്കുന്ന ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἁμαρτία
  choice: പാപം
  rationale: പൗലോസിന്റെ സാധാരണ പദപ്രയോഗം നിലനിർത്തുകയും ഇവിടെ പ്രവർത്തിക്കുന്ന ഒരു ശക്തിയായി പാപത്തെ വ്യക്തിവൽക്കരിക്കുന്ന വ്യാകരണഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἀφορμὴν λαβοῦσα
  choice: അവസരം മുതലെടുത്ത്
  rationale: ലഭിച്ച സാഹചര്യം പ്രയോജനപ്പെടുത്തുക എന്ന അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പാപത്തിന്റെ സജീവമായ പ്രവർത്തനവും നിലനിർത്തുന്നു.
- source_word: διὰ τῆς ἐντολῆς
  choice: കല്പനയിലൂടെ
  rationale: διάയുടെ ഉപകരണാർഥവും ἐντολήയുടെ ഏകവചനവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἐξηπάτησέν
  choice: വഞ്ചിക്കുകയും
  rationale: വഴിതെറ്റിക്കുന്ന വഞ്ചന എന്ന അടിസ്ഥാനാർഥം വ്യക്തമായി നൽകുന്നു; ക്രിയയുടെ തീവ്രത അനാവശ്യമായി പെരുപ്പിക്കുന്നില്ല.
- source_word: με
  choice: എന്നെ
  rationale: നേരിട്ടുള്ള കർമത്തെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δι’ αὐτῆς
  choice: അതിലൂടെ
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം കല്പനയെ സൂചിപ്പിക്കുന്നു; ആവർത്തനം ഒഴിവാക്കി ഉപകരണാർഥം നിലനിർത്തുന്നു.
- source_word: ἀπέκτεινεν
  choice: കൊല്ലുകയും ചെയ്തു
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: പാപത്തെ പൗലോസ് വ്യക്തിവൽക്കരിക്കുന്നതിന്റെ അളവ്
  choice: ഗ്രീക്കിലെപ്പോലെ പാപത്തെ അവസരം മുതലെടുക്കുകയും വഞ്ചിക്കുകയും കൊല്ലുകയും ചെയ്യുന്ന സജീവ കർത്താവായി അവതരിപ്പിച്ചു.
  alternative: പാപത്തെ അമൂർത്തമായ ഫലമോ പ്രവണതയോ ആയി മൃദൂകരിച്ച് പരിഭാഷപ്പെടുത്തുക.
  rationale: തുടർച്ചയായ പ്രവൃത്തികളുടെ വ്യാകരണകർത്താവ് പാപമാണ്. അധിക വ്യാഖ്യാനം ചേർക്കാതെ ഈ ദൈവശാസ്ത്രപരവും അലങ്കാരികവുമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, ഗൗരവമുള്ള ശൈലി. ‘കല്പന’, ‘പാപം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തി; വാക്യഘടന സ്വാഭാവികമാക്കി.
