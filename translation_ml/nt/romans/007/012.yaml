id: ROM.7.12
reference: Romans 7:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: ml
  text: അതിനാൽ, നിയമം വിശുദ്ധമാണ്; കല്പനയും വിശുദ്ധവും നീതിയുള്ളതും നല്ലതുമാണ്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: അതിനാൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: νόμος
  choice: നിയമം
  rationale: സന്ദർഭത്തിൽ മോശെയുടെ നിയമത്തെ സൂചിപ്പിക്കാമെങ്കിലും, പൗലോസിന്റെ പദപ്രയോഗത്തെ അനാവശ്യമായി കൂടുതൽ നിർവചിക്കാതെ നിലനിർത്തുന്നു.
- source_word: ἅγιος
  choice: വിശുദ്ധം
  rationale: ധാർമിക നിർമലതയും ദൈവത്തിനായി വേർതിരിക്കപ്പെട്ട നിലയും ഉൾക്കൊള്ളുന്ന പതിവും യോജിച്ചതുമായ പരിഭാഷ.
- source_word: ἐντολή
  choice: കല്പന
  rationale: നിയമത്തിനുള്ളിലെ ഒരു പ്രത്യേക ആജ്ഞയെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: δικαία
  choice: നീതിയുള്ളത്
  rationale: കല്പനയുടെ ധാർമിക നീതിയെ വ്യക്തമാക്കുന്നു; ‘ന്യായമായത്’ എന്നതിനെക്കാൾ ഈ സന്ദർഭത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἀγαθή
  choice: നല്ലത്
  rationale: ധാർമിക നന്മയും പ്രയോജനകരമായ സ്വഭാവവും വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: μὲν
  choice: പ്രത്യേകമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ വ്യക്തമായ δέ-വിരുദ്ധഘടന ഇല്ലാത്തതിനാൽ അതിന്റെ മൃദുവായ ഊന്നൽ മലയാളവാക്യത്തിന്റെ ഘടനയിൽ സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
theological_decisions:
- issue: νόμος എന്നത് മോശെയുടെ നിയമമെന്ന് തുറന്നുപറയണമോ
  choice: ‘നിയമം’ എന്ന് മാത്രം പരിഭാഷപ്പെടുത്തി
  alternative: ‘മോശെയുടെ നിയമം’ / ‘ന്യായപ്രമാണം’
  rationale: സന്ദർഭം മോശെയുടെ നിയമത്തിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, മൂലവാക്യം അതിനെ ഇവിടെ പേരെടുത്ത് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അർത്ഥം അമിതമായി നിർണ്ണയിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നിയമം’, ‘കല്പന’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപദങ്ങളുടെ ബന്ധം വ്യക്തമായി നിലനിർത്തുന്നതുമാണ്.
