  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: ml
  text: ന്യായപ്രമാണം ആത്മികമാണെന്ന് നാം അറിയുന്നുവല്ലോ; എന്നാൽ ഞാൻ ജഡികനാണ്[a], പാപത്തിന്റെ കീഴിൽ വിൽക്കപ്പെട്ടവനാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജഡത്തിൽപ്പെട്ടവൻ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പാപത്തിന് അടിമയായി വിറ്റുകളയപ്പെട്ടവൻ,” അതായത് പാപത്തിന്റെ അധികാരത്തിൻകീഴിൽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: നാം അറിയുന്നു
  rationale: പൗലോസും വായനക്കാരും പങ്കിടുന്ന ഉറച്ച അറിവിനെ സ്വാഭാവികവും നേരിട്ടുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ νόμος
  choice: ന്യായപ്രമാണം
  rationale: റോമർ ലേഖനത്തിലെ മോശൈക നിയമസന്ദർഭത്തിന് യോജിക്കുന്നതും മലയാള ബൈബിൾ ഭാഷയിൽ പരിചിതവുമായ പദം; വാക്യത്തിൽ അനാവശ്യമായ വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: πνευματικός
  choice: ആത്മികം
  rationale: നിയമം ആത്മാവിന്റെ മണ്ഡലത്തോടോ സ്വഭാവത്തോടോ ബന്ധപ്പെട്ടിരിക്കുന്നു എന്ന ആശയം സംക്ഷിപ്തമായി നിലനിർത്തുകയും σάρκινος എന്നതുമായ വൈരുധ്യം പ്രകടമാക്കുകയും ചെയ്യുന്നു.
- source_word: σάρκινός
  choice: ജഡികൻ
  rationale: ‘പാപസ്വഭാവമുള്ളവൻ’ എന്ന വ്യാഖ്യാനാത്മക വികസനം ഒഴിവാക്കി, മൂലത്തിലെ ‘ജഡം’ എന്ന പദകുടുംബവും ‘ആത്മികം’ എന്നതിനോടുള്ള വൈരുധ്യവും സംരക്ഷിക്കുന്നു.
- source_word: πεπραμένος
  choice: വിൽക്കപ്പെട്ടവൻ
  rationale: പൂർണ്ണകാല കർമണി പങ്കുപദം സൂചിപ്പിക്കുന്ന, വിറ്റഴിക്കപ്പെട്ടതിന്റെ ഫലമായി തുടരുന്ന അവസ്ഥ നിലനിർത്തുന്നു.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: പാപത്തിന് അധീനനായി
  rationale: ഗ്രീക്കിലെ ‘പാപത്തിന്റെ കീഴിൽ’ എന്ന അധീനതാസൂചന സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; പാപത്തിന്റെ അധികാരത്തിൻകീഴിലുള്ള അവസ്ഥയെയാണ് സൂചിപ്പിക്കുന്നത്.
theological_decisions:
- issue: പൗലോസിന്റെ ജഡസംബന്ധമായ ഭാഷ എത്രത്തോളം വ്യാഖ്യാനിക്കണം
  choice: പ്രധാനപാഠത്തിൽ ‘ജഡികൻ’ എന്നു നിലനിർത്തി.
  alternative: ‘പാപസ്വഭാവമുള്ളവൻ’ അല്ലെങ്കിൽ ‘ആത്മികനല്ലാത്തവൻ’
  rationale: മൂലപദത്തിന്റെ രൂപകവും ‘ആത്മികം’ എന്നതിനോടുള്ള ഉദ്ദേശ്യപൂർവമായ വൈരുധ്യവും നിലനിർത്തുന്നു; പൗലോസിന്റെ മനുഷ്യസ്വഭാവദർശനത്തെ പിന്നീടുള്ള ഒരു സിദ്ധാന്തസൂത്രത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- issue: πεπραμένος എന്ന അടിമച്ചന്ത രൂപകത്തിന്റെ വ്യക്തത
  choice: പ്രധാനപാഠത്തിൽ ‘പാപത്തിന് അധീനനായി വിൽക്കപ്പെട്ടവൻ’ എന്ന് നൽകി.
  alternative: ‘പാപത്തിന് അടിമയായി വിൽക്കപ്പെട്ടവൻ’
  rationale: ‘വിൽക്കപ്പെട്ടവൻ’ എന്ന മൂലരൂപകം സംരക്ഷിക്കുമ്പോൾ ὑπό സൂചിപ്പിക്കുന്ന അധീനതയും വ്യക്തമാക്കുന്നു; അടിമത്തത്തിന്റെ നിഗൂഢാർഥം അടിക്കുറിപ്പിൽ തുറന്നുപറയുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ മലയാളം. ‘ന്യായപ്രമാണം,’ ‘ആത്മികം,’ ‘ജഡികൻ’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ ഉപയോഗിച്ചെങ്കിലും വാക്യഘടന സ്വാഭാവികമാക്കി. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
