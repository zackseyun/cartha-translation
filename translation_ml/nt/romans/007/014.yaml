    issue: The relation expressed by ὑπὸ τὴν ἁμαρτίαν is rendered imprecisely in the main text.
    rationale: ‘പാപത്തിന് അധീനനായി വിൽക്കപ്പെട്ടവൻ’ can read as ‘sold while being subject to sin.’ The Greek describes the speaker as having been sold into a state ‘under sin.’ ‘പാപത്തിന്റെ കീഴിൽ വിൽക്കപ്പെട്ടവൻ’ preserves both the sale image and the resulting subjection.
