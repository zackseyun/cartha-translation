id: ROM.7.10
reference: Romans 7:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: ml
  text: എന്നാൽ ഞാൻ മരിച്ചു; ജീവനിലേക്കുള്ള[a] ഈ കല്പനതന്നെ എനിക്ക് മരണത്തിലേക്കുള്ളതായി തെളിഞ്ഞു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: ‘ജീവൻ നൽകേണ്ടിയിരുന്ന.’'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: ‘ഈ കല്പനതന്നെ എനിക്ക് മരണത്തിൽ കലാശിക്കുന്നതായി തെളിഞ്ഞു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: ഞാൻ മരിച്ചു
  rationale: ഒന്നാംപുരുഷ ഏകവചനത്തിലെ ഭൂതകാലസംഭവം നേരിട്ട് അവതരിപ്പിക്കുന്നു; പ്രക്രിയയെയോ അവസ്ഥയെയോ അധികമായി വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: εὑρέθη μοι
  choice: എനിക്ക് ... ആയി തെളിഞ്ഞു
  rationale: നിഷ്ക്രിയക്രിയയും μοι എന്ന ദത്തിവും ചേർന്നുള്ള അനുഭവപരവും കണ്ടെത്തലോടു ബന്ധപ്പെട്ടതുമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐντολή
  choice: കല്പന
  rationale: നിയമപരവും പൗലോസിന്റെ പ്രയോഗത്തിന് യോജിച്ചതുമായ ഏകവചനപദം; മൂലത്തിൽ ഇല്ലാത്ത ‘ന്യായപ്രമാണത്തിലെ’ എന്ന വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἡ εἰς ζωὴν
  choice: ജീവനിലേക്കുള്ള
  rationale: εἰς എന്നതിന്റെ ദിശയെയോ ഫലത്തെയോ സൂചിപ്പിക്കുന്ന തുറന്ന അർഥം നിലനിർത്തുന്നു; ‘ജീവൻ നൽകാൻ ഉദ്ദേശിച്ച’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക രൂപം മുഖ്യവാചകത്തിൽ ഒഴിവാക്കുന്നു.
- source_word: αὕτη
  choice: ഈ കല്പനതന്നെ
  rationale: ചൂണ്ടിക്കാണിക്കുന്ന αὕτη എന്ന പദത്തിന്റെ ഊന്നൽ ‘ഈ ... തന്നെ’ എന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εἰς θάνατον
  choice: മരണത്തിലേക്കുള്ളതായി
  rationale: ആദ്യത്തെ εἰς ζωὴν എന്ന പ്രയോഗത്തോടുള്ള ജീവൻ–മരണം സമാന്തരവിരോധം കഴിയുന്നത്ര നിലനിർത്തുന്നു; കല്പന നേരിട്ട് മരണം വരുത്തി എന്ന കാരണവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
theological_decisions:
- issue: കല്പന മരണം ‘വരുത്തി’ എന്ന് കാരണബന്ധം കൂടുതൽ വ്യക്തമായി പറയണമോ
  choice: എനിക്ക് മരണത്തിലേക്കുള്ളതായി തെളിഞ്ഞു
  alternative: എനിക്ക് മരണത്തിന് കാരണമായി
  rationale: ഗ്രീക്ക് വാചകം കല്പനയുടെ കണ്ടെത്തപ്പെട്ട ഫലം അവതരിപ്പിക്കുന്നു; കാരണബന്ധം അതിലധികം വിശദീകരിക്കാതെ ദൈവശാസ്ത്രപരമായ സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ജീവനിലേക്കുള്ള / മരണത്തിലേക്കുള്ള’ എന്ന സമാന്തരരൂപം അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ വാഗ്‌വൈരുധ്യം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
