id: ROM.7.16
reference: Romans 7:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: ml
  text: എന്നാൽ, ഞാൻ ആഗ്രഹിക്കാത്തത് ഞാൻ ചെയ്യുന്നുവെങ്കിൽ, ന്യായപ്രമാണത്തോടു യോജിച്ചുകൊണ്ട് അത് നല്ലതാണെന്ന് ഞാൻ സമ്മതിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: എന്നാൽ … എങ്കിൽ
  rationale: εἰയുടെ വ്യവസ്ഥാസ്വഭാവവും δέയുടെ മൃദുവായ വൈരുധ്യ/തുടർച്ചാഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὃ … τοῦτο
  choice: …താണു
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധിത ഘടനയുടെ ഊന്നൽ മലയാളത്തിലെ സ്വാഭാവിക വിധേയഘടനയിലൂടെ സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: θέλω
  choice: ആഗ്രഹിക്കുക
  rationale: പ്രവൃത്തിക്കു വിരുദ്ധമായി നിൽക്കുന്ന ഉള്ളിലെ ഇച്ഛയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ποιῶ
  choice: ചെയ്യുക
  rationale: സാധാരണ വർത്തമാനകാല പ്രവൃത്തിയെ ഗ്രീക്കിനൊത്ത ലളിതത്വത്തിൽ അവതരിപ്പിക്കുന്നു.
- source_word: σύμφημι
  choice: അതോടു യോജിക്കുന്നു
  rationale: ദാതിവിലുള്ള τῷ νόμῳ സൂചിപ്പിക്കുന്നതുപോലെ, ന്യായപ്രമാണത്തിന്റെ വിധിയോടുള്ള സമ്മതം വ്യക്തമാക്കുന്നു.
- source_word: τῷ νόμῳ
  choice: ന്യായപ്രമാണം / അതിനോടു
  rationale: റോമർ ലേഖനത്തിലെ അറിയപ്പെട്ട നിയമത്തെ സൂചിപ്പിക്കുന്ന നിർദിഷ്ട പ്രയോഗം നിലനിർത്തുന്നു; ആവർത്തനം ഒഴിവാക്കാൻ പിന്നീട് സർവനാമം ഉപയോഗിക്കുന്നു.
- source_word: καλός
  choice: നല്ലത്
  rationale: ന്യായപ്രമാണത്തിന്റെ അനുകൂലമായ ധാർമ്മിക ഗുണത്തെ അധികവ്യാഖ്യാനമില്ലാതെ നേരിട്ട് നൽകുന്നു.
theological_decisions:
- issue: വാക്യം ന്യായപ്രമാണത്തെയാണോ നല്ലതെന്ന് വിശേഷിപ്പിക്കുന്നത്
  choice: “ന്യായപ്രമാണം നല്ലതാണെന്ന്” എന്നായി പരിഭാഷപ്പെടുത്തി.
  alternative: “ന്യായപ്രമാണം ശരിയാണെന്ന്”
  rationale: ὅτι καλός എന്നത് ന്യായപ്രമാണത്തിന്റെ നന്മയെക്കുറിച്ചുള്ള പൗലോസിന്റെ വ്യക്തമായ സമ്മതമായി സ്വാഭാവികമായി വായിക്കപ്പെടുന്നു; ‘ശരി’ എന്നു നൽകിയാൽ ഗുണപരമായ καλός എന്ന പദത്തിന്റെ വ്യാപ്തി ചുരുങ്ങാം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘നിയമം’ എന്നതിനെക്കാൾ ബൈബിൾസന്ദർഭത്തിൽ വ്യക്തത നൽകുന്ന ‘ന്യായപ്രമാണം’ ഉപയോഗിച്ചു; വാക്യത്തിന്റെ വ്യവസ്ഥയും ന്യായപ്രമാണത്തിന്റെ നന്മയെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ സംഘർഷവും വിശദീകരണമില്ലാതെ നിലനിർത്തി.
