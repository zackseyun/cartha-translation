id: ROM.7.25
reference: Romans 7:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ ദൈവത്തിനു നന്ദി! ആകയാൽ, ഞാൻതന്നെ മനസ്സുകൊണ്ട് ദൈവത്തിന്റെ നിയമത്തെ സേവിക്കുന്നു; ജഡംകൊണ്ടോ പാപത്തിന്റെ നിയമത്തെ സേവിക്കുന്നു.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജഡം’ എന്നതിന് ‘പാപസ്വഭാവം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: ‘പാപത്തിന്റെ നിയമം’ എന്നതിന് ‘പാപത്തിന്റെ തത്ത്വം’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: ദൈവത്തിനു നന്ദി
  rationale: ദാതൃവിഭക്തിയോടുകൂടിയ ഈ ഉദ്‌ഘോഷപ്രയോഗത്തിൽ χάρις ദൈവത്തോടുള്ള നന്ദിപ്രകടനമാണ്; ‘കൃപ’ എന്ന ഗുണമോ ദാനമോ ഇവിടെ ഉദ്ദേശ്യമല്ല.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹയിലൂടെ
  rationale: διά + ഷഷ്ഠി ‘വഴി/മുഖാന്തരം’ എന്ന മധ്യസ്ഥത സൂചിപ്പിക്കുന്നു. Χριστός ഇവിടെ പദവിയായി ‘മശീഹ’ എന്നും κύριος മാന്യമായി ‘കർത്താവ്’ എന്നും പരിഭാഷപ്പെടുത്തി.
- source_word: Ἄρα οὖν
  choice: ആകയാൽ
  rationale: രണ്ട് അനുമാനസൂചക കണങ്ങളും ചേർന്ന് മുൻവാദത്തിന്റെ നിഗമനാത്മക സംഗ്രഹം അവതരിപ്പിക്കുന്നു; ‘ആകയാൽ’ മലയാളത്തിൽ അതിന്റെ സ്വാഭാവിക സംക്രമണശക്തി നൽകുന്നു.
- source_word: αὐτὸς ἐγώ
  choice: ഞാൻ തന്നെയാകട്ടെ
  rationale: αὐτός ചേർന്ന ἐγώയുടെ ഊന്നൽ നിലനിർത്തുകയും തുടർന്നുള്ള വൈരുധ്യമുള്ള രണ്ടു സേവനങ്ങളിലേക്കു ശ്രദ്ധ തിരിക്കുകയും ചെയ്യുന്നു.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: മനസ്സുകൊണ്ട് ... ജഡംകൊണ്ട്
  rationale: ദാതൃവിഭക്തികൾ ഇവിടെ ഏത് വശംകൊണ്ടോ ശേഷികൊണ്ടോ സേവിക്കുന്നു എന്നത് സൂചിപ്പിക്കുന്നു. μέν...δέയിലെ സമതുലിത വൈരുധ്യം മലയാളത്തിലെ സമാന്തര ഘടനയിൽ നിലനിർത്തി.
- source_word: δουλεύω
  choice: സേവിക്കുന്നു
  rationale: ക്രിയയ്ക്ക് അടിമസേവനത്തിന്റെ ശക്തമായ നിഴലുണ്ടെങ്കിലും ഈ സമാന്തര സംഗ്രഹവാക്യത്തിൽ ‘സേവിക്കുന്നു’ സ്വാഭാവികവും അധീനതയുടെ അർത്ഥം വഹിക്കുന്നതുമാണ്.
- source_word: νόμῳ θεοῦ
  choice: ദൈവത്തിന്റെ നിയമം
  rationale: റോമർ 7-ലെ νόμος എന്ന പദത്തിന്റെ തുടർച്ചയും തുടർന്നുള്ള ‘പാപത്തിന്റെ നിയമം’ എന്ന സമാന്തരതയും നിലനിർത്തുന്നു.
- source_word: σαρκὶ
  choice: ജഡം
  rationale: പൗലോസിന്റെ σάρξ എന്ന പദവും ‘മനസ്സ്’ എന്നതിനോടുള്ള അതിന്റെ സംഘർഷവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ സൂക്ഷിക്കുന്നു; ‘പാപസ്വഭാവം’ എന്നു നൽകിയാൽ മൂലത്തിൽ ഉള്ളതിലും അധികം നിർവചിക്കപ്പെടും.
- source_word: νόμῳ ἁμαρτίας
  choice: പാപത്തിന്റെ നിയമം
  rationale: ‘ദൈവത്തിന്റെ നിയമം’ എന്നതിനോടുള്ള ഉദ്ദേശ്യപൂർവമായ പദസമാന്തരത നിലനിർത്തുന്നു; ‘പാപത്തിന്റെ തത്ത്വം’ എന്ന വ്യാഖ്യാനാത്മക രൂപം മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചില്ല.
theological_decisions:
- issue: ധാർമ്മികമായി ഭാരമുള്ള പൗലോസീയ സന്ദർഭത്തിൽ σάρξ എങ്ങനെ നൽകണം
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ഗ്രീക്കിൽ പാപപ്രവണതയെ നേരിട്ട് സൂചിപ്പിക്കുന്ന പ്രത്യേക പദമല്ല, σάρξ തന്നെയാണ്. ‘ജഡം’ എന്നു നിലനിർത്തുന്നത് മനുഷ്യനെക്കുറിച്ചുള്ള പൗലോസിന്റെ സംഘർഷഭരിതമായ ഭാഷ വ്യാഖ്യാനത്തിലൂടെ മുൻകൂട്ടി പരിഹരിക്കാതെ സൂക്ഷിക്കുന്നു.
- issue: νόμος എന്ന പദത്തിന്റെ ആവർത്തനം
  choice: രണ്ടിടത്തും ‘നിയമം’
  alternative: രണ്ടാമത്തേതിൽ ‘തത്ത്വം’
  rationale: ദൈവത്തിന്റെ നിയമവും പാപത്തിന്റെ നിയമവും തമ്മിലുള്ള പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ സമാന്തരതയും ദൈവശാസ്ത്രപരമായ സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ രജിസ്റ്റർ. മൂലത്തിലെ സമാന്തരഘടനയും ‘മനസ്സ്/ജഡം’, ‘ദൈവത്തിന്റെ നിയമം/പാപത്തിന്റെ നിയമം’ എന്നീ വൈരുധ്യങ്ങളും നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
