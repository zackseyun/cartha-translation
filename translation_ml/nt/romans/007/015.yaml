id: ROM.7.15
reference: Romans 7:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: ml
  text: ഞാൻ ചെയ്യുന്നതെന്തെന്ന് എനിക്കു മനസ്സിലാകുന്നില്ല. കാരണം, ഞാൻ ആഗ്രഹിക്കുന്നത് ഞാൻ ചെയ്യുന്നില്ല; പകരം, ഞാൻ വെറുക്കുന്നതുതന്നെ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: ഞാൻ ചെയ്യുന്നത്
  rationale: സന്ദർഭത്തിൽ പ്രവൃത്തിയായി നടപ്പാക്കുക എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐ γινώσκω
  choice: എനിക്കുതന്നെ മനസ്സിലാകുന്നില്ല
  rationale: ഇവിടെ വെറും അറിവില്ലായ്മയേക്കാൾ സ്വന്തം പ്രവൃത്തിയെ ഗ്രഹിക്കാനോ അംഗീകരിക്കാനോ കഴിയാത്ത അർഥമാണ് പ്രസക്തം; ‘തന്നെ’ ആന്തരിക സംഘർഷത്തിന് സ്വാഭാവിക ഊന്നൽ നൽകുന്നു.
- source_word: θέλω
  choice: ഞാൻ ആഗ്രഹിക്കുന്നത്
  rationale: ഇച്ഛയെയോ ഉദ്ദേശത്തെയോ ലളിതവും വ്യാപകവുമായ ഭാഷയിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: πράσσω / ποιῶ
  choice: ചെയ്യുന്നില്ല / ചെയ്യുന്നു
  rationale: ഗ്രീക്ക് ക്രിയകളിലെ സൂക്ഷ്മ വ്യത്യാസം ഈ വാക്യത്തിൽ മലയാളത്തിൽ നിർബന്ധമായി വേർതിരിച്ചാൽ കൃത്രിമമാകും; ആവർത്തിത പ്രവൃത്തിയുടെ ആശയം വർത്തമാനകാല രൂപത്തിൽ നിലനിർത്തുന്നു.
- source_word: μισῶ
  choice: ഞാൻ വെറുക്കുന്നത്
  rationale: ശക്തമായ നൈതിക വിരക്തി മൃദൂകരിക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: പ്രസംഗകന്റെ ‘ഞാൻ’ ആരെ സൂചിപ്പിക്കുന്നു എന്ന വ്യാഖ്യാനം
  choice: വാക്യത്തിൽ ഒന്നാംപുരുഷ ആന്തരിക സംഘർഷം മാത്രം നിലനിർത്തി
  alternative: ഇത് പൗലോസിന്റെ ക്രിസ്തീയ ജീവിതമോ ക്രിസ്തുവിനു മുമ്പുള്ള അവസ്ഥയോ എന്നു വിവർത്തനത്തിൽ വ്യക്തമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യം ആ തിരിച്ചറിയൽ സ്വയം തീർപ്പാക്കുന്നില്ല; അതിനാൽ വിവർത്തനം വ്യാഖ്യാനപരമായ ഒരു പക്ഷം സ്വീകരിക്കുന്നില്ല.
- issue: γάρ എന്ന ബന്ധപദത്തിന്റെ ബലം
  choice: കാരണം
  alternative: എന്തെന്നാൽ / തീർച്ചയായും
  rationale: തുടർന്നുള്ള വാക്യം ആദ്യ പ്രസ്താവനയ്ക്ക് വിശദീകരണകാരണം നൽകുന്നു; നൽകിയിരിക്കുന്ന സന്ദർഭത്തിലും ഇത് വ്യക്തവും സ്വാഭാവികവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തനവും ആന്തരിക വിരോധവും നിലനിർത്തിയിരിക്കുന്നു; അനാവശ്യ സാങ്കേതിക പദങ്ങളും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
