id: ROM.7.3
reference: Romans 7:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: ml
  text: അങ്ങനെ, ഭർത്താവ് ജീവിച്ചിരിക്കുമ്പോൾ അവൾ മറ്റൊരു പുരുഷനോടു ചേർന്നാൽ[a], അവൾ വ്യഭിചാരിണി എന്നു വിളിക്കപ്പെടും. എന്നാൽ ഭർത്താവ് മരിച്ചാൽ, അവൾ നിയമത്തിൽനിന്ന് സ്വതന്ത്രയാണ്[b]; അതിന്റെ ഫലമായി, മറ്റൊരു പുരുഷനോടു ചേർന്നാലും അവൾ വ്യഭിചാരിണിയല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘അവൾ മറ്റൊരു പുരുഷന്റെ ഭാര്യയായാൽ’ അല്ലെങ്കിൽ ‘അവൾ മറ്റൊരു പുരുഷന്റേതായാൽ.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘നിയമം’ എന്നത് ഉടനടി സൂചിപ്പിക്കുന്നത് വിവാഹബന്ധത്തെ നിയന്ത്രിക്കുന്ന നിയമബന്ധനത്തെയാണ്.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: ഭർത്താവ് ജീവിച്ചിരിക്കുമ്പോൾ
  rationale: ജനിറ്റീവ് അബ്സല്യൂട്ട് സൂചിപ്പിക്കുന്ന സമകാലിക സാഹചര്യത്തെ വ്യക്തമായി നൽകുന്നു.
- source_word: μοιχαλὶς
  choice: വ്യഭിചാരിണി
  rationale: വ്യഭിചാരം ചെയ്യുന്ന സ്ത്രീയെ നിർദിഷ്ടമായി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് നാമത്തിന്റെ നേരിട്ടുള്ള തത്തുല്യപദമാണിത്.
- source_word: χρηματίσει
  choice: വിളിക്കപ്പെടും
  rationale: ഈ സന്ദർഭത്തിലെ ‘എന്നു വിളിക്കപ്പെടുക/കണക്കാക്കപ്പെടുക’ എന്ന അർഥവും ഭാവികാലബലവും നിലനിർത്തുന്നു.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ
  choice: അവൾ മറ്റൊരു പുരുഷന്റേതായാൽ
  rationale: γίνομαι + ദേറ്റീവ് സൂചിപ്പിക്കുന്ന ബന്ധത്തിലേക്കുള്ള പ്രവേശനം പ്രതിഫലിപ്പിക്കുന്നു; ‘ഭാര്യയായാൽ’ എന്ന് ചേർത്ത് മൂലത്തിൽ ഉള്ളതിലധികം നിർദിഷ്ടമാക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: അവൾ ആ നിയമത്തിൽനിന്ന് സ്വതന്ത്രയാണ്
  rationale: ബന്ധനത്തിൽനിന്നുള്ള സ്വാതന്ത്ര്യവും νόμος എന്ന പദത്തിന്റെ അടിസ്ഥാനരൂപവും നിലനിർത്തുന്നു; ‘ആ’ എന്നത് സന്ദർഭത്തിൽ പറഞ്ഞ വിവാഹബന്ധനിയമത്തെ ചൂണ്ടുന്നു.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: അതിനാൽ ... അവൾ വ്യഭിചാരിണിയല്ല
  rationale: ആർട്ടിക്കുലാർ ഇൻഫിനിറ്റീവ് പ്രകടിപ്പിക്കുന്ന ഫലം സ്വാഭാവിക മലയാളവാക്യമായി നൽകുന്നു.
- source_word: γενομένην ἀνδρὶ ἑτέρῳ
  choice: മറ്റൊരു പുരുഷന്റേതായാലും
  rationale: മുൻപ്രയോഗവുമായി ഏകീകരണം പാലിക്കുകയും, ഭർത്താവിന്റെ മരണശേഷമുള്ള സാഹചര്യത്തിൽ വ്യഭിചാരിണിയല്ലെന്ന വൈരുധ്യഫലം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: νόμος എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘ആ നിയമം’ എന്ന് നൽകി; അടിക്കുറിപ്പിൽ ഉടനെയുള്ള സൂചന വിവാഹബന്ധത്തെ നിയന്ത്രിക്കുന്ന നിയമബന്ധനമാണെന്ന് വ്യക്തമാക്കി.
  alternative: ‘വിവാഹനിയമം’ എന്ന് പ്രധാനപാഠത്തിൽ വ്യക്തമാക്കുക; അല്ലെങ്കിൽ വിശാലമായ പൗലൊസീയ അർഥത്തിൽ ‘നിയമം’ എന്നു വായിക്കുക.
  rationale: സന്ദർഭം വിവാഹിതയായ സ്ത്രീയുടെ ഭർത്താവുമായുള്ള നിയമപരമായ ബന്ധമാണ്. എന്നാൽ പദം നേരിട്ട് ‘വിവാഹനിയമം’ എന്ന് വിവർത്തനം ചെയ്യാതെ ഗ്രീക്കിന്റെ പൊതുവായ രൂപവും വ്യാഖ്യാനപരമായ തുറന്ന നിലയും കാത്തുസൂക്ഷിക്കുന്നു.
- issue: γένηται ἀνδρὶ ἑτέρῳ എന്ന ബന്ധപ്രയോഗത്തിന്റെ നിർദിഷ്ടത
  choice: ‘മറ്റൊരു പുരുഷന്റേതായാൽ’
  alternative: ‘മറ്റൊരു പുരുഷന്റെ ഭാര്യയായാൽ’ അല്ലെങ്കിൽ ‘മറ്റൊരു പുരുഷനോടു ചേർന്നാൽ’
  rationale: വിവാഹസന്ദർഭം വ്യക്തമായിരുന്നാലും, മൂലപ്രയോഗത്തിൽ ‘ഭാര്യ’ എന്ന നാമം തുറന്നുപറയുന്നില്ല. അതിനാൽ ബന്ധത്തിന്റെ യഥാർഥ അവ്യക്തത പ്രധാനപാഠത്തിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യം. നിയമപരമായ വാദത്തിന്റെ കൃത്യതയ്ക്കായി ‘വ്യഭിചാരിണി’, ‘നിയമം’, ‘സ്വതന്ത്ര’ എന്നീ പദങ്ങൾ നിലനിർത്തി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
