  to: അങ്ങനെ, ഭർത്താവ് ജീവിച്ചിരിക്കുമ്പോൾ അവൾ മറ്റൊരു പുരുഷനോടു ചേർന്നാൽ[a], അവൾ വ്യഭിചാരിണി എന്നു വിളിക്കപ്പെടും. എന്നാൽ ഭർത്താവ് മരിച്ചാൽ, അവൾ നിയമത്തിൽനിന്ന് സ്വതന്ത്രയാണ്[b]; അതിന്റെ ഫലമായി, മറ്റൊരു പുരുഷനോടു ചേർന്നാലും അവൾ വ്യഭിചാരിണിയല്ല.
  rationale: The revision improves the Malayalam rendering of the source idiom γένηται/γενομένην ἀνδρὶ ἑτέρῳ, preserves its relational ambiguity in the main text, and keeps the legal force of νόμος without adding unnecessary specificity. Footnote anchors and the complete footnote set are retained.
