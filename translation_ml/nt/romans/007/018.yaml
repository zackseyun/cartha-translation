id: ROM.7.18
reference: Romans 7:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: ml
  text: എന്നിൽ—അതായത്, എന്റെ ജഡത്തിൽ[a]—നന്മയൊന്നും വസിക്കുന്നില്ലെന്ന് എനിക്കറിയാം. കാരണം, നന്മ ചെയ്യാനുള്ള ഇച്ഛ എനിക്കുണ്ട്; എന്നാൽ നന്മ പ്രവർത്തിച്ചുനടത്തുന്നത് എനിക്കില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “പാപസ്വഭാവത്തിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: പൂർണകാലരൂപമാണെങ്കിലും ഇവിടെ വർത്തമാനാർഥത്തിലാണ്; സ്വാഭാവികമായ മലയാളസമാനത.
- source_word: οἰκεῖ
  choice: വസിക്കുന്നില്ല
  rationale: ഉള്ളിൽ വസിക്കുക എന്ന പൗലോസിന്റെ രൂപകം നിലനിർത്തുന്നു.
- source_word: ἀγαθόν
  choice: നന്മയൊന്നും
  rationale: οὐκ എന്ന നിഷേധത്തോടുകൂടിയ substantival neuter adjective മലയാളത്തിൽ സ്വാഭാവികമായി ‘നന്മയൊന്നും ... ഇല്ല’ എന്നു വരുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ പദപ്രയോഗവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും വ്യാഖ്യാനിച്ച് തീർക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὸ θέλειν
  choice: നന്മ ചെയ്യാനുള്ള മനസ്സ്
  rationale: ശുദ്ധമായ ‘ഇച്ഛിക്കൽ’ എന്ന അമൂർത്തരൂപത്തേക്കാൾ സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്; തുടർന്നുള്ള τὸ καλόν ഇതിന്റെ ലക്ഷ്യം വ്യക്തമാക്കുന്നു.
- source_word: παράκειταί μοι
  choice: എനിക്കുണ്ട്
  rationale: അടുത്തുണ്ടാകുക/സന്നിഹിതമായിരിക്കുക എന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ ലഭ്യതയോ ഉള്ളിലുള്ള സാന്നിധ്യമോ ആയി അറിയിക്കുന്നു.
- source_word: κατεργάζεσθαι
  choice: പ്രവർത്തിക്കുന്നത്
  rationale: നന്മ യാഥാർഥ്യത്തിൽ നടപ്പാക്കുകയെന്ന അർഥം നൽകുന്നു.
- source_word: τὸ καλόν
  choice: നന്മ
  rationale: Substantival adjective സൂചിപ്പിക്കുന്ന ധാർമിക നന്മ ലളിതമായും കൃത്യമായും നൽകുന്നു.
- source_word: οὔ
  choice: ഇല്ല
  rationale: ഗ്രീക്കിലെ സംക്ഷിപ്തമായ elliptical നിഷേധം മലയാളത്തിൽ സ്വാഭാവികമായി പൂരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ധാർമികമായി ഭാരമുള്ള പൗലോസിന്റെ σάρξ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: ‘പാപസ്വഭാവം’ എന്നത് സാധ്യതയുള്ള വ്യാഖ്യാനമാണെങ്കിലും പദത്തിന്റെ അർഥം മുൻകൂട്ടി തീർപ്പാക്കുന്നു; ‘ജഡം’ മൂലപദവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തുന്നു.
- issue: അവസാനത്തെ elliptical οὔ എങ്ങനെ പൂരിപ്പിക്കണം
  choice: അത് പ്രവർത്തിക്കുന്നില്ല
  alternative: നന്മ പ്രവർത്തിക്കാനുള്ള കഴിവ് എനിക്കില്ല
  rationale: കഴിവില്ലായ്മയെ വ്യക്തമായി ചേർക്കാതെ, മൂലവാക്യത്തിലെ സംക്ഷിപ്തതയും അവ്യക്തതയും പരമാവധി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളം; സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ പൗലോസിന്റെ ഗൗരവവും ‘വസിക്കുക’ എന്ന രൂപകവും നിലനിർത്തുന്ന ശൈലി. ‘ജഡം’ എന്ന പദത്തിന് വ്യാഖ്യാനപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
