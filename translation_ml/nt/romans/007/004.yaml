id: ROM.7.4
reference: Romans 7:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: ml
  text: അതുകൊണ്ട്, എന്റെ സഹോദരന്മാരേ[a], മശീഹയുടെ[b] ശരീരം മുഖാന്തരം നിങ്ങളും ന്യായപ്രമാണത്തോടുള്ള ബന്ധത്തിൽ കൊല്ലപ്പെട്ടു; നിങ്ങൾ മറ്റൊരുവന്റേതായിത്തീരേണ്ടതിന്[c]—അതായത്, മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവന്റേതായിത്തീരാൻ—അങ്ങനെ നാം ദൈവത്തിനായി ഫലം കായ്ക്കേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരീസഹോദരന്മാരേ” എന്നും അർഥമാകാം; ഗ്രീക്കിലെ “സഹോദരന്മാർ” എന്ന പദം സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട ഒരു സമൂഹത്തെ സംബോധന ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഗ്രീക്ക്: ക്രിസ്റ്റോസ്; ഇവിടെ “മശീഹ” (അഭിഷിക്തൻ) എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നു. “ക്രിസ്തു” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, “നിങ്ങൾ മറ്റൊരുവന്റേതായിത്തീരേണ്ടതിന്.” ഈ വാക്കുകൾ മുൻവാക്യങ്ങളിലെ വിവാഹദൃഷ്ടാന്തം തുടരുന്നു.
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള വിവാഹദൃഷ്ടാന്തത്തിൽനിന്ന് നിഗമനത്തിലേക്കുള്ള ബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; മിശ്രസംഘത്തെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: ന്യായപ്രമാണത്തോടുള്ള ബന്ധത്തിൽ കൊല്ലപ്പെട്ടു
  rationale: അയോറിസ്റ്റ് കർമണിപ്രയോഗം ‘കൊല്ലപ്പെട്ടു’ എന്നു നിലനിർത്തുന്നു. ഗ്രീക്ക് ദത്തിവിന്റെ ബന്ധസൂചന ‘ന്യായപ്രമാണത്തോടുള്ള ബന്ധത്തിൽ’ എന്നു വ്യക്തമാക്കുന്നു; ‘ന്യായപ്രമാണത്തിൽനിന്ന് മോചിതരായി’ എന്ന വ്യാഖ്യാനാത്മക പരിഹാരം ഒഴിവാക്കുന്നു.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: മശീഹയുടെ ശരീരം മുഖാന്തരം
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാധ്യമം നിലനിർത്തുകയും Χριστός എന്ന അഭിഷിക്തസ്ഥാനപ്പേരിനെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: നിങ്ങൾ മറ്റൊരുവന്റേതായിത്തീരേണ്ടതിന്
  rationale: മുൻസന്ദർഭത്തിലെ വിവാഹസാദൃശ്യം നിലനിർത്താൻ ഉടമസ്ഥ/ബന്ധപരമായ ഗ്രീക്ക് പ്രയോഗം അടുത്തായി പകർന്നു.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: മരിച്ചവരിൽനിന്ന് ഉയിർപ്പിക്കപ്പെട്ടവന്റേതായിത്തീരേണ്ടതിന്
  rationale: കർമണിപ്രയോഗവും ‘മരിച്ചവരിൽനിന്ന്’ എന്ന ബഹുവചനസൂചനയും നിലനിർത്തുന്നു; ആവർത്തനം മലയാളത്തിൽ ബന്ധം വ്യക്തമാക്കുന്നു.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: അങ്ങനെ നാം ദൈവത്തിനായി ഫലം കായിക്കേണ്ടതിനുതന്നെ
  rationale: ‘നിങ്ങൾ’ എന്നതിൽനിന്ന് ‘നാം’ എന്നതിലേക്കുള്ള മൂലപാഠത്തിലെ വ്യക്തിമാറ്റവും ഫലം കായിക്കുക എന്ന രൂപകവും ഉദ്ദേശസൂചനയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം പ്രസക്തമായതിനാൽ ‘മശീഹ’ ഉപയോഗിച്ചു; പതിവുപേരായി മാത്രം വായിച്ചു തീർക്കുന്നില്ല.
- issue: τῷ νόμῳ എന്ന ദത്തിവിന്റെ ബന്ധം
  choice: ന്യായപ്രമാണത്തോടുള്ള ബന്ധത്തിൽ കൊല്ലപ്പെട്ടു
  alternative: ന്യായപ്രമാണത്തിന് മരിച്ചവരായി / ന്യായപ്രമാണത്തിൽനിന്ന് മോചിതരായി
  rationale: മൂലത്തിലെ അസാധാരണമായ ‘നിയമത്തോടു മരിക്കുക’ എന്ന ബന്ധം സംരക്ഷിക്കുകയും അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥം ഒരൊറ്റ വിശദീകരണത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: വിവാഹരൂപകത്തിലെ γενέσθαι ἑτέρῳ
  choice: മറ്റൊരുവന്റേതായിത്തീരുക
  alternative: മറ്റൊരുവനോടു ചേർക്കപ്പെടുക
  rationale: ‘മറ്റൊരുവന്റേതാകുക’ എന്ന ഗ്രീക്ക് ഘടനയും വിവാഹബന്ധത്തിന്റെ പശ്ചാത്തലവും നിലനിർത്തുന്നു; വിവാഹം എന്ന പദം മൂലത്തിൽ ഇല്ലാത്തതിനാൽ മുഖ്യവാക്യത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവമുള്ള മലയാളം. ‘ന്യായപ്രമാണം’, ‘മുഖാന്തരം’, ‘ഉയിർപ്പിക്കപ്പെട്ടവൻ’ എന്നിവ ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദങ്ങളാണ്. മൂലത്തിലെ കർമണിപ്രയോഗം, വിവാഹരൂപകം, ‘നിങ്ങൾ’ മുതൽ ‘നാം’ വരെയുള്ള മാറ്റം എന്നിവ ഉദ്ദേശപൂർവം സംരക്ഷിച്ചു.
