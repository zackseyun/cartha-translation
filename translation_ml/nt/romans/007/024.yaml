id: ROM.7.24
reference: Romans 7:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: ml
  text: ഞാൻ എത്ര ദയനീയനായ മനുഷ്യനാണ്! ഈ മരണത്തിന്റെ ശരീരത്തിൽനിന്ന് എന്നെ ആർ രക്ഷിക്കും?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എന്നെ വിടുവിക്കും.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: ദയനീയനായ
  rationale: കടുത്ത ദുരിതവും നിസ്സഹായതയും പ്രകടമാക്കുന്ന, ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായ പദം; പൗലോസിന്റെ വേദനനിറഞ്ഞ നിലവിളിയുടെ ശക്തി നിലനിർത്തുന്നു.
- source_word: ἄνθρωπος
  choice: മനുഷ്യൻ
  rationale: പൗലോസ് ഇവിടെ തന്നെക്കുറിച്ചാണ് പറയുന്നത്; ‘മനുഷ്യൻ’ എന്നത് പുരുഷ ഏകവചനസന്ദർഭത്തിനും പൊതുവായ മാനുഷിക അർത്ഥത്തിനും സ്വാഭാവികമായി ചേരുന്നു.
- source_word: τίς
  choice: ആർ
  rationale: ഒരു വിടുവിക്കുന്ന വ്യക്തിയെക്കുറിച്ചുള്ള ചോദ്യമായതിനാൽ വ്യക്തിവാചകമായ ചോദ്യം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ῥύσεται
  choice: രക്ഷിക്കും
  rationale: അപകടത്തിൽനിന്നോ അടിമത്തത്തിൽനിന്നോ പുറത്തുകൊണ്ടുവരുക എന്ന ക്രിയയുടെ സജീവമായ അർത്ഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘വിടുവിക്കും’ എന്നത് അടുത്ത പദാന്തരമാണ്.
- source_word: ἐκ
  choice: -യിൽനിന്ന്
  rationale: വേർപെടലിന്റെയും പുറത്തേക്കുള്ള രക്ഷയുടെയും ആശയം കൃത്യമായി സൂചിപ്പിക്കുന്നു.
- source_word: σώματος
  choice: ശരീരം
  rationale: മൂലപാഠത്തിലെ മൂർത്തമായ ‘ശരീരം’ എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ θανάτου τούτου
  choice: ഈ മരണശരീരം
  rationale: ഗ്രീക്കിലെ സങ്കീർണമായ സമാസബന്ധം വായനാസൗകര്യമുള്ള മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. അക്ഷരാർഥത്തോട് കൂടുതൽ അടുത്ത ‘ഈ മരണത്തിന്റെ ശരീരം’ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചിരിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ τοῦ σώματος τοῦ θανάτου τούτου എന്ന പ്രയോഗത്തിന്റെ അവതരണം
  choice: ഈ മരണശരീരത്തിൽനിന്ന്
  alternative: ഈ മരണത്തിന്റെ ശരീരത്തിൽനിന്ന്
  rationale: പ്രധാനപാഠത്തിലെ രൂപം മലയാളത്തിൽ സ്വാഭാവികവും ശക്തവുമാണ്; അതേസമയം ‘ശരീരം’, ‘മരണം’ എന്നിവ തമ്മിലുള്ള ബന്ധം വ്യാഖ്യാനിച്ച് തീർപ്പാക്കുന്നില്ല. ഗ്രീക്കിലെ കൂടുതൽ അക്ഷരാർഥപരമായ ഘടന അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ആദ്യവാക്യത്തിൽ അധികമായി ഒരു വ്യാഖ്യാനാത്മക വിസ്മയസൂചകം ചേർക്കാതെ ഗ്രീക്കിലെ ആത്മവേദന നേരിട്ട് അവതരിപ്പിച്ചു; രണ്ടാം വാക്യത്തിലെ ശരീരം–മരണം രൂപകവും അതിന്റെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
