id: ROM.7.13
reference: Romans 7:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, നന്മയായത് എനിക്കു മരണമായിത്തീർന്നോ? ഒരിക്കലുമില്ല! മറിച്ച്, പാപമാണ്—അത് പാപമായി വെളിപ്പെടേണ്ടതിന്, നന്മയായതിലൂടെ എനിക്കു മരണം ഉളവാക്കിയത്[a]; അങ്ങനെ കല്പനയിലൂടെ പാപം അത്യന്തം പാപകരമായിത്തീരേണ്ടതിനുതന്നെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്നിൽ മരണം ഉളവാക്കിയത്’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: μοι എന്ന ദാതിവ് ഇവിടെ ‘എനിക്കു’ എന്ന വ്യക്തിപരമായ ബന്ധമായോ ‘എന്നിൽ’ എന്ന sphere/reference ഭാവമായോ സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്നതാണ്.
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: നന്മയായത്
  rationale: നപുംസകലിംഗത്തിലുള്ള substantival വിശേഷണത്തിന്റെ ‘നല്ലതായ കാര്യം/നന്മയായത്’ എന്ന ആശയം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ കല്പനയുടെ നന്മയെ സൂചിപ്പിക്കാനും യോജിക്കുന്നു.
- source_word: ἐγένετο θάνατος
  choice: മരണമായിത്തീർന്നോ
  rationale: γίνομαι എന്നതിന്റെ ‘ആയിത്തീരുക’ എന്ന predicative force നിലനിർത്തുകയും ചോദ്യം സ്വാഭാവികമായി അവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: μὴ γένοιτο
  choice: ഒരിക്കലുമില്ല!
  rationale: പൗലോസിന്റെ ശക്തമായ നിഷേധം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: ἡ ἁμαρτία
  choice: പാപമാണ്
  rationale: നന്മയായതല്ല, പാപമാണ് മരണത്തിന് ഉത്തരവാദി എന്ന ഗ്രീക്ക് വിരോധഘടന വ്യക്തമാക്കുന്നു; പാപത്തിന്റെ വ്യക്തിവൽക്കരണവും നിലനിർത്തുന്നു.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: അത് പാപമായി വെളിപ്പെടേണ്ടതിന്
  rationale: ആവർത്തിച്ചുള്ള ἁμαρτίαയുടെ predicate force-ഉം purpose clause-ഉം നിലനിർത്തുന്നു.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: നന്മയായതിലൂടെ
  rationale: instrumental διάയും വാക്യത്തിന്റെ ആരംഭത്തിലെ Τὸ ... ἀγαθὸν എന്ന പ്രയോഗവുമായുള്ള ആവർത്തനബന്ധവും സൂക്ഷിക്കുന്നു.
- source_word: μοι κατεργαζομένη θάνατον
  choice: എനിക്കു മരണം ഉളവാക്കിയത്
  rationale: κατεργάζομαιയുടെ ഫലം ഉളവാക്കുക എന്ന അർഥവും μοι എന്ന ദാതിവിന്റെ വ്യക്തിപരമായ ബന്ധവും സ്വാഭാവികമായി നൽകുന്നു; ‘എന്നിൽ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: അത്യന്തം പാപകരമായിത്തീരുക
  rationale: അളവുകടന്ന തീവ്രതയും ἁμαρτωλός എന്ന വിശേഷണസ്വഭാവവും മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: διὰ τῆς ἐντολῆς
  choice: കല്പനയിലൂടെ
  rationale: നിയമവുമായി ബന്ധപ്പെട്ട ἐντολήയെ ‘കല്പന’ എന്നു പരിഭാഷപ്പെടുത്തി instrumental construction നിലനിർത്തുന്നു.
theological_decisions:
- issue: നല്ല കല്പനയും മരണം ഉളവാക്കുന്ന പാപവും തമ്മിലുള്ള കർത്തൃത്വഭേദം
  choice: നന്മയായത് മരണമായി മാറിയെന്ന ആശയം നിഷേധിച്ച്, നന്മയായതിലൂടെ മരണം ഉളവാക്കിയ കർത്താവായി പാപത്തെ അവതരിപ്പിച്ചു.
  alternative: കല്പന തന്നെയാണ് കുറ്റകരമായി മരണം വരുത്തിയതെന്നു തോന്നിപ്പിക്കുന്ന കൂടുതൽ സ്വതന്ത്രമായ പരിഭാഷ.
  rationale: μὴ γένοιτο എന്ന ശക്തമായ നിഷേധത്തിനു ശേഷമുള്ള ἀλλὰ ἡ ἁμαρτία എന്ന വിരോധം ഉത്തരവാദിത്വം പാപത്തിനാണ് നൽകുന്നത്. അതേസമയം, പാപം നന്മയായ കല്പനയെ ഉപാധിയാക്കുന്നു എന്ന പൗലോസിന്റെ സംഘർഷഭരിതമായ ആശയം മൃദൂകരിക്കാതെ സൂക്ഷിച്ചു.
- issue: രണ്ടു ἵνα ഉപവാക്യങ്ങളുടെ ലക്ഷ്യ/ഫല സ്വഭാവം
  choice: ‘വെളിപ്പെടേണ്ടതിന്’, ‘ആയിത്തീരേണ്ടതിന്’ എന്നിങ്ങനെ ലക്ഷ്യഭാവം നിലനിർത്തി.
  alternative: ‘അങ്ങനെ വെളിപ്പെട്ടു’, ‘അങ്ങനെ ആയിത്തീർന്നു’ എന്ന ശുദ്ധ ഫലവാചകം.
  rationale: ഗ്രീക്കിലെ ആവർത്തിച്ച ἵνα ഘടനയെ നിർണ്ണായകമായി ഒരൊറ്റ ദൈവശാസ്ത്ര വ്യാഖ്യാനത്തിലേക്ക് ചുരുക്കാതെ ലക്ഷ്യ-ഫല സംഘർഷം നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘നന്മയായത്’, ‘കല്പന’, ‘പാപകരം’ എന്നീ പദങ്ങൾ പൗലോസിന്റെ ആവർത്തനവും ആശയബന്ധവും നിലനിർത്തുന്നു. ദീർഘമായ ഗ്രീക്ക് വാക്യത്തിന്റെ തർക്കക്രമം em dash, semicolon എന്നിവകൊണ്ട് വായനാസൗകര്യത്തോടെ സൂക്ഷിച്ചിട്ടുണ്ട്.
