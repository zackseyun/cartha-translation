  source_fidelity: 'ഗ്രീക്ക് വാക്യത്തിന്റെ മുഖ്യവിരോധം കൃത്യമായി നിലനിർത്തിയിരിക്കുന്നു: ‘നന്മയായത്’ മരണമായിത്തീർന്നതല്ല; പാപമാണ് നന്മയായതിലൂടെ മരണം ഉളവാക്കുന്നത്. രണ്ട് ἵνα ലക്ഷ്യവാക്യങ്ങളും, διὰ τοῦ ἀγαθοῦ / διὰ τῆς ἐντολῆς എന്ന ഉപാധി-ബന്ധവും, കൂടാതെ καθ’ ὑπερβολὴν ἁμαρτωλός എന്ന ശക്തീകരണവും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു.'
