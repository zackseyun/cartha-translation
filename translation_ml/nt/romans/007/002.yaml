id: ROM.7.2
reference: Romans 7:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: ml
  text: വിവാഹിതയായ ഒരു സ്ത്രീ, അവളുടെ ഭർത്താവ് ജീവിച്ചിരിക്കുന്ന കാലത്തോളം, നിയമത്താൽ അവളുടെ ഭർത്താവിനോടു ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു; എന്നാൽ ഭർത്താവ് മരിച്ചാൽ, ഭർത്താവിനെ സംബന്ധിച്ച നിയമത്തിൽനിന്ന് അവൾ മോചിതയാകുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭർത്താവിന്റെ നിയമത്തിൽനിന്ന് അവൾ മോചിതയാകുന്നു.” ഗ്രീക്ക് പ്രയോഗം അവളെ ഭർത്താവുമായി ബന്ധിച്ചിരുന്ന നിയമബന്ധത്തെയായിരിക്കാം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: വിവാഹിതയായ ഒരു സ്ത്രീ
  rationale: വിവാഹബന്ധത്തിനു കീഴിലുള്ള സ്ത്രീ എന്ന അർഥം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ ζῶντι ἀνδρί
  choice: ഭർത്താവ് ജീവിച്ചിരിക്കുന്ന കാലത്തോളം ... അയാളോടു
  rationale: ഭർത്താവിന്റെ ജീവിച്ചിരിപ്പാണ് നിയമബന്ധം നിലനിൽക്കുന്നതിനുള്ള കാലപരിധിയെന്ന് സന്ദർഭാനുസൃതമായി വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ ദത്തിവ് ബന്ധവും നിലനിർത്തുന്നു.
- source_word: δέδεται
  choice: ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പൂർണ്ണകാല കർമണി രൂപം സൂചിപ്പിക്കുന്ന, മുൻപ് സ്ഥാപിക്കപ്പെട്ടതും ഇപ്പോഴും തുടരുന്നതുമായ ബന്ധിതാവസ്ഥ പ്രകടമാക്കുന്നു.
- source_word: νόμῳ
  choice: നിയമത്താൽ
  rationale: ഇവിടെ പ്രത്യേകമായി മോശെയുടെ ന്യായപ്രമാണമെന്നതിലുപരി വിവാഹത്തെ നിയന്ത്രിക്കുന്ന നിയമതത്ത്വത്തെ സൂചിപ്പിക്കുന്ന അനിർദ്ദിഷ്ട പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: κατήργηται
  choice: മോചിതയാകുന്നു
  rationale: നിയമത്തിന്റെ പ്രാബല്യത്തിൽനിന്നോ ബാധ്യതയിൽനിന്നോ ഒഴിവാകുക എന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി നൽകുന്നു; ‘നശിപ്പിക്കപ്പെടുന്നു’ എന്ന അസന്ദർഭികമായ പദാനുപദ വിവർത്തനം ഒഴിവാക്കുന്നു.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: ഭർത്താവുമായി അവളെ ബന്ധിച്ച നിയമത്തിൽനിന്ന്
  rationale: സങ്കുചിതമായ ഗ്രീക്ക് ഷഷ്ഠീബന്ധം ഭർത്താവാണ് നിയമദാതാവ് എന്ന തെറ്റിദ്ധാരണ കൂടാതെ, അവളെ ഭർത്താവുമായി ബന്ധിച്ച നിയമബന്ധമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: νόμῳ / τοῦ νόμου എന്നത് പ്രത്യേകമായി മോശെയുടെ ന്യായപ്രമാണമാണോ, പൊതുവായ വിവാഹനിയമബന്ധമാണോ
  choice: വിവാഹത്തെ സംബന്ധിക്കുന്ന പൊതുവായ നിയമബന്ധം
  alternative: വിവാഹത്തിനു ബാധകമായ മോശെയുടെ ന്യായപ്രമാണം
  rationale: ഉടൻ വരുന്ന വിവാഹസന്ദർഭവും ആദ്യത്തെ νόμῳ എന്ന പദത്തിന്റെ അനാർത്രസ് രൂപവും പൊതുവായ നിയമതത്ത്വത്തെ അനുകൂലിക്കുന്നു. എങ്കിലും ‘നിയമം’ എന്ന പദം നിലനിർത്തിയതിനാൽ പൗലോസിന്റെ വിശാലമായ ന്യായപ്രമാണചർച്ചയുമായുള്ള ബന്ധം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നിയമപരവും വിവാഹപരവുമായ ഉപമ വ്യക്തമാക്കുന്നതിനൊപ്പം ‘നിയമം’ എന്ന ആവർത്തനം സംരക്ഷിച്ചിരിക്കുന്നു.
