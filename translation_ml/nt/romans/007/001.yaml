id: ROM.7.1
reference: Romans 7:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: ml
  text: അതോ, സഹോദരന്മാരേ[a], നിങ്ങൾ അറിയുന്നില്ലേ—നിയമം അറിയുന്നവരോടാണല്ലോ ഞാൻ സംസാരിക്കുന്നത്—ഒരു വ്യക്തി ജീവിച്ചിരിക്കുന്നിടത്തോളം കാലം നിയമം അയാളുടെമേൽ അധികാരം ചെലുത്തുന്നുവെന്ന്[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നത് ഗ്രീക്കിലെ പുരുഷലിംഗ ബഹുവചനമായ adelphoi എന്ന പദത്തിന്റെ വിവർത്തനമാണ്; ഈ സന്ദർഭത്തിൽ പൗലോസിന്റെ ശ്രോതാക്കളായ സ്ത്രീകളും ഇതിൽ ഉൾപ്പെടുന്നതായിരിക്കാം.
    reason: cultural_note
  - marker: b
    text: അഥവാ, ‘അയാളുടെമേൽ ആധിപത്യം പുലർത്തുന്നു.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: അല്ലെങ്കിൽ
  rationale: മുൻവാദവുമായി ബന്ധിപ്പിക്കുന്ന പൗലോസിന്റെ വാദാത്മകമായ സംക്രമണം നിലനിർത്തുന്നു.
- source_word: ἀγνοεῖτε
  choice: നിങ്ങൾ അറിയുന്നില്ലേ?
  rationale: പങ്കിട്ട അറിവിലേക്കുള്ള അഭ്യർഥനയായ ഗ്രീക്ക് വാചാടോപചോദ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിന്റെ രൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; ഈ അഭിസംബോധനയുടെ സന്ദർഭപരമായ ഉൾക്കൊള്ളൽ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: നിയമം അറിയുന്നവരോടാണല്ലോ ഞാൻ സംസാരിക്കുന്നത്
  rationale: γάρ നൽകുന്ന വിശദീകരണഭാവവും നിയമപരിചയമുള്ള ശ്രോതാക്കളെയാണ് അഭിസംബോധന ചെയ്യുന്നതെന്ന ആശയവും വ്യക്തമായി പകരുന്നു.
- source_word: νόμον / ὁ νόμος
  choice: നിയമം
  rationale: മോശെയുടെ ന്യായപ്രമാണത്തിലേക്ക് മാത്രമായി വിവർത്തനത്തിൽ ചുരുക്കാതെ ഗ്രീക്കിലെ വിശാലത സംരക്ഷിക്കുന്നു.
- source_word: κυριεύει
  choice: അധികാരം പുലർത്തുന്നു
  rationale: ആധിപത്യം അഥവാ അധികാരം ചെലുത്തുക എന്ന അർഥം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ἀνθρώπου
  choice: ഒരു വ്യക്തി / അയാളുടെമേൽ
  rationale: ഇവിടെ ἄνθρωπος പൊതുവായ മനുഷ്യവ്യക്തിയെ സൂചിപ്പിക്കുന്നതിനാൽ ലിംഗവിശേഷം അനാവശ്യമായി ചുമത്തുന്നില്ല.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: ജീവിച്ചിരിക്കുന്ന കാലത്തോളം
  rationale: ഗ്രീക്കിലെ സമയപരിധി സൂചിപ്പിക്കുന്ന പ്രയോഗം ചുരുക്കവും സ്വാഭാവികവുമായി പകരുന്നു.
theological_decisions:
- issue: νόμος എന്നതിന്റെ വ്യാപ്തി
  choice: ‘നിയമം’ എന്നു മാത്രം വിവർത്തനം ചെയ്തു
  alternative: ‘മോശെയുടെ ന്യായപ്രമാണം’ അല്ലെങ്കിൽ ‘നിയമതത്ത്വം’
  rationale: സമീപസന്ദർഭത്തിൽ മോശെയുടെ ന്യായപ്രമാണം പ്രധാനമായി മനസ്സിലുണ്ടെങ്കിലും, ഗ്രീക്ക് വാചകം ഇവിടെ അതിന്റെ വ്യാപ്തി പൂർണമായി നിർണ്ണയിക്കുന്നില്ല; അതിനാൽ ആ അർഥവ്യാപ്തി വിവർത്തനത്തിൽ തുറന്നുവെക്കുന്നു.
- issue: κυριεύει എന്നതിലെ അധികാരത്തിന്റെ സ്വഭാവം
  choice: ‘അധികാരം പുലർത്തുന്നു’
  alternative: ‘ഭരിക്കുന്നു’
  rationale: നിയമത്തിന്റെ നിയമാനുസൃത അധികാരത്തെ വ്യക്തമാക്കുന്നു; ‘ഭരിക്കുന്നു’ എന്നതിനെക്കാൾ മലയാളത്തിൽ ഈ സന്ദർഭത്തിന് സ്വാഭാവികമാണ്, എന്നാൽ ആധിപത്യത്തിന്റെ ആശയം നഷ്ടപ്പെടുത്തുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. വിശദീകരണഭാഗം ദീർഘരേഖകൾക്കിടയിൽ നൽകി ഗ്രീക്കിലെ ഇടക്കുറിപ്പിന്റെ സ്വഭാവം നിലനിർത്തി.
