id: ROM.7.8
reference: Romans 7:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: ml
  text: എന്നാൽ പാപം കല്പനയിലൂടെ അവസരം മുതലെടുത്ത്[a] എന്നിൽ എല്ലാത്തരം മോഹവും[b] ഉളവാക്കി. കാരണം, ന്യായപ്രമാണം കൂടാതെ പാപം മൃതമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “അവസരമാക്കി.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “എല്ലാ ആഗ്രഹവും”; ഈ സന്ദർഭത്തിൽ പ്രത്യേകമായി മോഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμὴν ... λαβοῦσα
  choice: അവസരം മുതലെടുത്ത്
  rationale: ‘അവസരം കൈക്കൊണ്ട്’ എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുകയും പാപം കല്പനയെ പ്രയോജനപ്പെടുത്തുന്ന സജീവശക്തിയായി ചിത്രീകരിക്കുന്ന രൂപകം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἡ ἁμαρτία
  choice: പാപം
  rationale: മൂലപാഠത്തിൽ പാപം പ്രവർത്തിക്കുന്ന ഒരു ശക്തിയായി വ്യക്തിവൽക്കരിക്കപ്പെടുന്നു; ‘പാപം’ എന്ന കർത്തൃപ്രയോഗം അത് വ്യാഖ്യാനിച്ച് മയപ്പെടുത്താതെ നിലനിർത്തുന്നു.
- source_word: διὰ τῆς ἐντολῆς
  choice: കല്പനയിലൂടെ
  rationale: സന്ദർഭത്തിൽ മുമ്പ് ഉദ്ധരിച്ച പ്രത്യേക കല്പനയിലേക്കാണ് ഏകവചനം വിരൽചൂണ്ടുന്നത്; διά സൂചിപ്പിക്കുന്ന മാധ്യമാർഥവും ഈ പ്രയോഗം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: κατειργάσατο
  choice: ഉളവാക്കി
  rationale: ഒരു ഫലം പ്രവർത്തിപ്പിച്ചുണ്ടാക്കുക എന്ന ക്രിയയുടെ ശക്തി ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: എല്ലാത്തരം മോഹവും
  rationale: തൊട്ടുമുമ്പുള്ള ‘മോഹിക്കരുത്’ എന്ന കല്പനയുടെ പശ്ചാത്തലത്തിൽ ἐπιθυμίαയ്ക്ക് ‘മോഹം’ യോജിക്കുന്നു; πᾶσαν ഇവിടെ വിവിധ രൂപങ്ങളെയെല്ലാം ഉൾക്കൊള്ളുന്ന വിധത്തിൽ ‘എല്ലാത്തരം’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: χωρὶς γὰρ νόμου
  choice: ന്യായപ്രമാണം കൂടാതെ
  rationale: νόμος-ന് പൗലൊസിന്റെ ഈ സന്ദർഭത്തിൽ പതിവായ ‘ന്യായപ്രമാണം’ ഉപയോഗിക്കുകയും χωρὶς എന്നതിന്റെ വേർപാട്/അഭാവം വ്യക്തമാക്കുകയും ചെയ്യുന്നു. γάρ-ന്റെ വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യക്രമത്തിൽ സ്വാഭാവികമായി പ്രകടമാണ്.
- source_word: νεκρά
  choice: മൃതമാണ്
  rationale: ‘പ്രവർത്തനരഹിതം’ എന്നു വ്യാഖ്യാനിക്കാതെ മൂലപാഠത്തിലെ ശക്തമായ മരണരൂപകം നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പാപത്തിന്റെ വ്യക്തിവൽക്കരണവും ‘മൃതം’ എന്ന രൂപകവും
  choice: പാപത്തെ പ്രവർത്തിക്കുന്ന കർത്താവായി നിലനിർത്തി νεκρά എന്നത് ‘മൃതമാണ്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: പാപത്തെ അമൂർത്തമായി അവതരിപ്പിച്ച് ‘പ്രവർത്തനരഹിതമാണ്’ എന്നു വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പാപത്തെ കല്പനയെ മുതലെടുത്ത് മോഹം ഉളവാക്കുന്ന ശക്തിയായി അവതരിപ്പിക്കുന്നു. അതിന്റെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും മരണരൂപകവും പരിഭാഷയിൽ പരിഹരിച്ചുകളയരുത്.
- issue: ἐπιθυμίαയുടെ സന്ദർഭാർഥം
  choice: മോഹിക്കരുത് എന്ന കല്പനയുമായുള്ള ബന്ധം കാത്ത് ‘മോഹം’ ഉപയോഗിച്ചു.
  alternative: പൊതുവായ അർഥത്തിൽ ‘ആഗ്രഹം’ ഉപയോഗിക്കുക.
  rationale: ἐπιθυμίαയ്ക്ക് പൊതുവായി ആഗ്രഹം എന്ന അർഥമുണ്ടെങ്കിലും റോമർ 7:7-ലെ കല്പന ഈ വാക്യത്തിൽ അന്യന്റെതു മോഹിക്കുന്നതെന്ന പ്രത്യേക അർഥം സജീവമാക്കുന്നു; വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘കല്പന’, ‘ന്യായപ്രമാണം’, ‘പാപം’ എന്നീ സ്ഥാപിത ബൈബിൾ പദങ്ങൾ നിലനിർത്തിയപ്പോൾ വാക്യഘടന സ്വാഭാവികമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കു പിന്നാലെ ചേർത്തിരിക്കുന്നു.
