  terminology: “പാപം,” “കല്പന,” and “ന്യായപ്രമാണം” are established and appropriate biblical terms. “മൃതമാണ്” preserves the Greek’s stark metaphor without interpretive softening. “മോഹം” is contextually appropriate for ἐπιθυμία, with the broader lexical possibility retained in a note.
