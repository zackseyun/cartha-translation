id: ROM.7.23
reference: Romans 7:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: ml
  text: എന്നാൽ എന്റെ അവയവങ്ങളിൽ മറ്റൊരു നിയമം[a] ഞാൻ കാണുന്നു; അത് എന്റെ മനസ്സിന്റെ നിയമത്തോടു പോരാടുകയും, എന്റെ അവയവങ്ങളിലുള്ള പാപത്തിന്റെ നിയമത്തിൽ എന്നെ തടവുകാരനാക്കുകയും ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഇവിടെ ആവർത്തിച്ചുവരുന്ന ‘നിയമം’ എന്നതിന് ‘തത്ത്വം’ എന്നോ ‘ശക്തി’ എന്നോ അർഥമാകാം.
    reason: lexical_alternative
  - marker: b
    text: 'അക്ഷരാർഥത്തിൽ: ‘പാപത്തിന്റെ നിയമത്തിൽ എന്നെ തടവുകാരനാക്കുന്നു.’ ഇതിന്റെ അർഥം പാപത്തിന്റെ നിയമത്തിന്റെ അധികാരത്തിൻകീഴിൽ തടവിലാക്കപ്പെടുന്നു എന്നതാണ്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: ഞാൻ കാണുന്നു
  rationale: വർത്തമാനകാലത്തിലുള്ള നേരിട്ടുള്ള തിരിച്ചറിവിന്റെ ഭാവം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἕτερον νόμον
  choice: മറ്റൊരു നിയമം
  rationale: മുമ്പ് പറഞ്ഞ നിയമത്തോടുള്ള വൈരുധ്യം നിലനിർത്തുകയും νόμος എന്ന ആവർത്തിത പദം വ്യാഖ്യാനിച്ച് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: νόμον / νόμῳ (ആവർത്തനം)
  choice: നിയമം
  rationale: പൗലോസ് ആവർത്തിക്കുന്ന νόμος എന്ന പദത്തിന്റെ വാക്ചാതുര്യവും ദൈവിക നിയമം, മനസ്സിന്റെ നിയമം, പാപത്തിന്റെ നിയമം എന്നിവയ്ക്കിടയിലെ ആശയസംഘർഷവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: എന്റെ ശരീരാവയവങ്ങളിൽ
  rationale: μέλη എന്നതിന്റെ ശരീരസംബന്ധിയായ ബഹുവചനരൂപം വ്യക്തമാക്കുന്നതോടൊപ്പം ആധുനിക മലയാളവായനക്കാർക്ക് സ്വാഭാവികമായി ഗ്രഹിക്കാവുന്ന ഭാഷ നൽകുന്നു.
- source_word: ἀντιστρατευόμενον
  choice: പോരാടുകയും
  rationale: മൂലത്തിലെ സൈനികരൂപകം സംക്ഷിപ്തവും ശക്തവുമായി നിലനിർത്തുന്നു.
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: എന്റെ മനസ്സിന്റെ നിയമത്തോട്
  rationale: νοῦς എന്നത് ഇവിടെ ചിന്തയും ഇച്ഛയും ഉൾപ്പെടുന്ന ആന്തരിക ശേഷിയെ സൂചിപ്പിക്കുന്നു; ‘മനസ്സ്’ അതിന്റെ നേരിട്ടുള്ള, സാധാരണ മലയാളരൂപമാണ്.
- source_word: αἰχμαλωτίζοντά με
  choice: എന്നെ തടവുകാരനാക്കുകയും
  rationale: യുദ്ധരൂപകത്തിന്റെ തുടർച്ചയും ബലമായി കീഴ്പ്പെടുത്തപ്പെടുന്ന അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: പാപത്തിന്റെ നിയമത്തിനു കീഴിൽ
  rationale: ἐν എന്നതിന്റെ പദാനുപദ രൂപം ‘നിയമത്തിൽ’ എന്നായാലും, പിടിക്കപ്പെട്ട് അതിന്റെ അധീനതയിലാകുന്ന അർഥം മലയാളത്തിൽ വ്യക്തമായി നൽകാൻ ‘നിയമത്തിനു കീഴിൽ’ ഉപയോഗിച്ചു; വ്യത്യസ്ത സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἁμαρτίας
  choice: പാപം
  rationale: സന്ദർഭത്തിലെ സാധാരണവും കൃത്യവുമായ തത്തുല്യപദമാണ്.
theological_decisions:
- issue: ഈ വാക്യത്തിലെ νόμος എന്ന പദം ‘നിയമം’ എന്നോ വ്യാഖ്യാനാത്മകമായി ‘തത്ത്വം/ശക്തി’ എന്നോ പരിഭാഷപ്പെടുത്തണമോ എന്നത്.
  choice: എല്ലാ പ്രയോഗങ്ങളിലും ‘നിയമം’ നിലനിർത്തി.
  alternative: ‘തത്ത്വം’, ‘പ്രവർത്തനതത്ത്വം’, അല്ലെങ്കിൽ ‘ശക്തി’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ആവർത്തിതമായ νόμος ഭാഷ പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ ആശയസംഘർഷം നിലനിർത്തുന്നു. അതിനെ ‘തത്ത്വം’ അല്ലെങ്കിൽ ‘ശക്തി’ എന്നു മാറ്റുന്നത് വാക്യത്തിന്റെ അർഥം മുൻകൂട്ടി വ്യാഖ്യാനിച്ച് തീർക്കും.
- issue: ἐν τῷ νόμῳ τῆς ἁμαρτίας എന്നതിലെ ἐν എങ്ങനെ പ്രകടിപ്പിക്കണം എന്നത്.
  choice: ‘പാപത്തിന്റെ നിയമത്തിനു കീഴിൽ’ എന്നു നൽകി.
  alternative: ‘പാപത്തിന്റെ നിയമത്തിൽ’ അല്ലെങ്കിൽ ‘പാപത്തിന്റെ നിയമത്താൽ’ എന്നു നൽകുക.
  rationale: തടവിലാക്കപ്പെടുന്നതിന്റെ ഫലമായ അധീനത മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുമ്പോഴും, ഗ്രീക്ക് ഘടനയുടെ കൂടുതൽ പദാനുപദ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യഘടന രണ്ട് മലയാളവാക്യങ്ങളാക്കി, എന്നാൽ കർത്താവും പങ്കാളിക്രിയകളുടെ ബന്ധവും യുദ്ധരൂപകവും നിലനിർത്തി. ‘ശരീരാവയവങ്ങൾ’ എന്നത് ‘അവയവങ്ങൾ’ എന്നതിലേക്കാൾ ഉടൻ ഗ്രഹിക്കാവുന്നതും μέλη എന്ന ശരീരരൂപകത്തെ ‘ശരീരം’ എന്ന ഏകപദത്തിലേക്ക് ചുരുക്കാതിരിക്കുന്നതുമാണ്.
