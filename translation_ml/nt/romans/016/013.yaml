id: ROM.16.13
reference: Romans 16:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: ml
  text: കർത്താവിൽ തിരഞ്ഞെടുക്കപ്പെട്ട[a] റൂഫൊസിനെയും അവന്റെ അമ്മയെയും—എന്റെയും അമ്മയെ—അഭിവാദനം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവിൽ വിശിഷ്ടനായവൻ’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് വിശേഷണത്തിന് ‘ശ്രേഷ്ഠൻ’ അഥവാ ‘പ്രമുഖൻ’ എന്ന അർഥവും വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: വന്ദനം പറയുക
  rationale: ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ അഭിവാദനാർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: Ῥοῦφον
  choice: റൂഫൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തെ മലയാളത്തിൽ നേരിട്ട് ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἐκλεκτὸν
  choice: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  rationale: ‘തിരഞ്ഞെടുക്കപ്പെട്ട’ എന്ന അടിസ്ഥാന അർഥവും വ്യക്തിയെ സൂചിപ്പിക്കുന്ന വിശേഷണപ്രയോഗവും നിലനിർത്തുന്നു; സാങ്കേതികമായ ഒരു പ്രത്യേക ദൈവശാസ്ത്ര വ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ബന്ധത്തെയോ മേഖലയെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ഉദ്ദേശ്യപൂർവമായ അസ്പഷ്ടത സംരക്ഷിക്കുന്നു.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: അവന്റെ അമ്മയും എന്റെയും അമ്മയായവൾ
  rationale: അക്ഷരാർഥത്തിലുള്ള ‘അവന്റെയും എന്റെയും അമ്മ’ എന്ന ഊഷ്മളമായ ബന്ധപ്രയോഗം, ജൈവമാതൃത്വമാണെന്ന് തെറ്റിദ്ധരിപ്പിക്കാതെ, മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: ἐκλεκτὸν ἐν κυρίῳ എന്നതിന്റെ അർഥം
  choice: കർത്താവിൽ തിരഞ്ഞെടുക്കപ്പെട്ടവൻ
  alternative: കർത്താവിൽ വിശിഷ്ടനായവൻ / ശ്രേഷ്ഠനായവൻ
  rationale: ദൈവത്താൽ തിരഞ്ഞെടുക്കപ്പെട്ടവൻ എന്ന അർഥവും ക്രിസ്തീയ സമൂഹത്തിൽ വിശിഷ്ടനായവൻ എന്ന അർഥസാധ്യതയും ഗ്രീക്കിൽ നിലനിൽക്കുന്നു. മുഖ്യപാഠം അടിസ്ഥാനാർഥം നൽകുകയും അടിക്കുറിപ്പ് മറ്റൊരു സാധ്യമായ അർഥം അറിയിക്കുകയും ചെയ്യുന്നു.
- issue: μητέρα αὐτοῦ καὶ ἐμοῦ എന്നതിലെ മാതൃത്വം
  choice: അവന്റെ അമ്മയും എന്റെയും അമ്മയായവൾ
  alternative: എനിക്കും അമ്മയെപ്പോലെ ആയിരുന്ന അവന്റെ അമ്മ
  rationale: പൗലൊസിന്റെ സ്നേഹപൂർവമായ കുടുംബബന്ധപ്രയോഗം വിശദീകരിച്ചു പരാവർത്തനം ചെയ്യാതെ കഴിയുന്നത്ര നിലനിർത്തുന്നു; സന്ദർഭം ബന്ധപരമായ അർഥം സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ സഭാലേഖന ശൈലി. ‘കർത്താവ്’, ‘വന്ദനം പറയുക’ എന്നീ പ്രയോഗങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും മൂലപാഠത്തോട് അടുത്തതുമാണ്.
