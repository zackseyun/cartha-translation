- from: അവരുടെ വീട്ടിലുള്ള സഭയെയും[a] വന്ദനം അറിയിക്കുക. എനിക്ക് പ്രിയനായ എപ്പൈനത്തൊസിനും വന്ദനം അറിയിക്കുക. അവൻ മശീഹയ്ക്കായുള്ള ഏഷ്യയുടെ[b] ആദ്യഫലമാണ്.[c]
