id: ROM.16.5
reference: Romans 16:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: ml
  text: അവരുടെ വീട്ടിലുള്ള സഭയെയും[a] വന്ദനം അറിയിക്കുക. എന്റെ പ്രിയനായ എപൈനേതൊസിനും വന്ദനം അറിയിക്കുക. അവൻ മശീഹയ്ക്കായുള്ള ഏഷ്യയുടെ[b] ആദ്യഫലമാണ്.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘അവരുടെ വീട്ടിൽ കൂടിവരുന്ന സഭയെയും.’
    reason: lexical_alternative
  - marker: b
    text: ഇവിടെ ‘ഏഷ്യ’ എന്നത് ഇന്നത്തെ ഏഷ്യാ ഭൂഖണ്ഡത്തെയല്ല, റോമൻ പ്രവിശ്യയായ ഏഷ്യയെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: cultural_note
  - marker: c
    text: 'അർഥം: ‘ഏഷ്യയിൽ മശീഹയിൽ വിശ്വസിച്ച ആദ്യത്തെയാൾ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: അവരുടെ വീട്ടിലുള്ള സഭ
  rationale: സഭ അവരുടെ വീട്ടുമായി ബന്ധപ്പെട്ടതോ അവിടെ കൂടിവരുന്നതോ ആണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം, കൂടിവരുന്നു എന്ന് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചുറപ്പിക്കാതെ, സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀσπάσασθε
  choice: വന്ദനം അറിയിക്കുക
  rationale: ലേഖനത്തിലെ അഭിവാദനപ്പട്ടികയ്ക്ക് യോജിച്ച, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളപ്രയോഗം.
- source_word: Ἐπαίνετον
  choice: എപ്പൈനത്തൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപം മലയാളലിപിയിൽ പകർത്തുന്നു.
- source_word: ἀγαπητόν μου
  choice: എനിക്ക് പ്രിയനായ
  rationale: പൗലൊസിന്റെ വ്യക്തിപരമായ സ്നേഹവും ഊഷ്മളതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀπαρχὴ
  choice: ആദ്യഫലം
  rationale: ആദ്യ വിളവിന്റെ ഭാഗം എന്ന പൗലൊസിന്റെ രൂപകം സംരക്ഷിക്കുന്നു; അതിനെ മുഖ്യപാഠത്തിൽ വെറും ‘ആദ്യ വിശ്വാസി’ എന്ന് വ്യാഖ്യാനിക്കുന്നില്ല.
- source_word: τῆς Ἀσίας
  choice: ഏഷ്യയുടെ
  rationale: ജനിറ്റീവ് ബന്ധം അടുത്തായി നിലനിർത്തുന്നു; ഇവിടെ ഉദ്ദേശിക്കുന്നത് റോമൻ പ്രവിശ്യയാണെന്ന ചരിത്രവിവരം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰς Χριστόν
  choice: മശീഹയ്ക്കായുള്ള
  rationale: εἰς സൂചിപ്പിക്കുന്ന ലക്ഷ്യ/ബന്ധഭാവം ἀπαρχή എന്ന രൂപകത്തോടൊപ്പം നിലനിർത്തുന്നു; Χριστός എന്ന പദത്തിന്റെ പദവിയർഥം ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: Χριστόν എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ Χριστός ഒരു പദവിയായി വായിക്കാവുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു; അധികമായ വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν എന്നതിന്റെ അർഥം
  choice: മശീഹയ്ക്കായുള്ള ഏഷ്യയുടെ ആദ്യഫലം
  alternative: ഏഷ്യയിൽ മശീഹയിൽ വിശ്വസിച്ച ആദ്യത്തെയാൾ
  rationale: ‘ആദ്യഫലം’ എന്ന മൂലരൂപകവും εἰς എന്നതിലെ ബന്ധ/ലക്ഷ്യഭാവവും മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുന്നു; സന്ദർഭപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ലേഖനശൈലി ഉപയോഗിച്ചു. ‘ആദ്യഫലം’ എന്ന ബൈബിൾരൂപകം സംരക്ഷിച്ചെങ്കിലും അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ബന്ധപ്പെട്ട പദങ്ങളോടോ വാക്യത്തോടോ ചേർത്തിരിക്കുന്നു.
