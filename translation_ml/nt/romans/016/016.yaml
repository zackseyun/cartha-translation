id: ROM.16.16
reference: Romans 16:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: ml
  text: വിശുദ്ധ ചുംബനത്തോടെ[a] പരസ്പരം അഭിവാദ്യം ചെയ്യുക. മശീഹായുടെ എല്ലാ സഭകളും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധ ചുംബനം’ വിശ്വാസികൾക്കിടയിലെ വിശുദ്ധമായ സ്നേഹവും കൂട്ടായ്മയും പ്രകടിപ്പിച്ചിരുന്ന, അന്നത്തെ സംസ്കാരത്തിൽ അംഗീകരിക്കപ്പെട്ട ഒരു അഭിവാദനരീതിയായിരുന്നു.
    reason: cultural_note
  - marker: b
    text: അഥവാ, “ക്രിസ്തുവിന്റെ എല്ലാ സഭകളും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: പരസ്പരം അഭിവാദ്യം ചെയ്യുക
  rationale: ἀσπάζομαι എന്ന ക്രിയയുടെ കൽപ്പനാരൂപവും ἀλλήλους എന്ന പരസ്പരസർവനാമവും സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ സംക്ഷിപ്തമായി പകർത്തുന്നു.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: വിശുദ്ധ ചുംബനത്തോടെ
  rationale: ἐν സഹചരണമോ മാർഗമോ സൂചിപ്പിക്കുന്നു; φίλημα ‘ചുംബനം’ എന്നും ἁγίῳ അതിനെ വിശുദ്ധമായത് എന്നു വിശേഷിപ്പിക്കുന്നു.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തുകളിലെ ആശംസ അറിയിക്കൽ എന്ന അർഥം നേരിട്ട് പകർത്തുന്നു; ὑμᾶς ബഹുവചനമാണെങ്കിലും മലയാളത്തിലെ ‘നിങ്ങളെ’ അത് സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: എല്ലാ സഭകളും
  rationale: നിർദ്ദേശകപദത്തോടുകൂടിയ πᾶσαιയുടെ സമഗ്രത നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: τοῦ Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ പദവിനാമമായി ഗ്രഹിക്കാവുന്നതിനാൽ അതിന്റെ യഹൂദ പശ്ചാത്തലത്തിലുള്ള അർഥം സുതാര്യമാക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു; സമ്പർക്കം/അവകാശബന്ധം ജനിറ്റീവ് രൂപത്തിൽ നിലനിർത്തി.
theological_decisions:
- issue: Χριστοῦ എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: സഭകളുടെ ഉടമസ്ഥതയോ ബന്ധമോ സൂചിപ്പിക്കുന്ന ഈ സന്ദർഭത്തിൽ Χριστός എന്ന പദവിനാമത്തിന്റെ അർഥം ‘മശീഹാ’ വ്യക്തമായി നിലനിർത്തുന്നു. പരിചിതമായ പരമ്പരാഗത രൂപമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അഭിവാദ്യം ചെയ്യുക’ കത്തിന്റെ ആശംസാഭാവം നിലനിർത്തുന്നു; ‘വിശുദ്ധ ചുംബനം’ എന്ന ചരിത്രപരമായ പ്രയോഗം വിശദീകരിച്ച് തന്നെയാണു സൂക്ഷിച്ചിരിക്കുന്നത്.
