source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: ml
  text: സഹോദരന്മാരേ[a], നിങ്ങൾ പഠിച്ച ഉപദേശത്തിനു വിരുദ്ധമായി ഭിന്നതകളും ഇടർച്ചയ്ക്കുള്ള കാരണങ്ങളും ഉണ്ടാക്കുന്നവരെ ശ്രദ്ധിക്കുക; അവരിൽനിന്ന് അകന്നുമാറുക എന്നു ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാർ’ എന്നാണ്, എന്നാൽ ഇവിടെ മുഴുവൻ സഭാസമൂഹത്തെയും അഭിസംബോധന ചെയ്യുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ശക്തവും എന്നാൽ മാന്യവുമായ പൗലോസിന്റെ ഇടയപരമായ അഭ്യർഥനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ബഹുവചന സംബോധന നേരിട്ട് നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളാൻ സാധ്യതയുള്ള പ്രാതിനിധ്യപ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: σκοπεῖν
  choice: ശ്രദ്ധിക്കുക
  rationale: ഇവിടെ ഉദ്ദേശിക്കുന്നത് ചിലരെ ജാഗ്രതയോടെ നിരീക്ഷിക്കുകയും അവരെക്കുറിച്ച് കരുതലോടിരിക്കുകയും ചെയ്യുക എന്നതാണ്; മലയാളത്തിൽ ‘ശ്രദ്ധിക്കുക’ ഇരു ഭാവങ്ങളും സന്ദർഭത്തിൽ നൽകുന്നു.
- source_word: διχοστασίας
  choice: ഭിന്നതകൾ
  rationale: സമൂഹത്തിനുള്ളിലെ വിഭജനങ്ങളും ചേരിതിരിവുകളും സൂചിപ്പിക്കുന്ന വ്യക്തവും സ്വാഭാവികവുമായ പദം.
- source_word: σκάνδαλα
  choice: ഇടർച്ചയ്ക്കുള്ള കാരണങ്ങൾ
  rationale: സ്കάνδαλον എന്നതിലെ ഇടറിവീഴാൻ കാരണമാകുന്ന തടസ്സത്തിന്റെ രൂപകം നിലനിർത്തുകയും വെറും മനോവേദന എന്ന അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: παρὰ τὴν διδαχήν
  choice: ഉപദേശത്തിനു വിരുദ്ധമായി
  rationale: παρά + accusative ഇവിടെ ലഭിച്ച ഉപദേശത്തിന്റെ മാനദണ്ഡത്തിൽനിന്നുള്ള വ്യതിചലനമോ എതിർപ്പോ സൂചിപ്പിക്കുന്നു.
- source_word: ἐμάθετε
  choice: നിങ്ങൾ പഠിച്ച
  rationale: റോമിലെ വിശ്വാസികൾ മുമ്പ് അഭ്യസിച്ച ഉപദേശത്തെ സൂചിപ്പിക്കുന്ന സജീവവും നേരിട്ടുള്ളതുമായ പരിഭാഷ.
- source_word: ποιοῦντας
  choice: ഉണ്ടാക്കുന്നവരെ
  rationale: ഭിന്നതകളും ഇടർച്ചയ്ക്കുള്ള കാരണങ്ങളും സൃഷ്ടിക്കുന്ന ആളുകളെയാണ് participle സൂചിപ്പിക്കുന്നത്.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: അവരിൽനിന്ന് അകന്നുമാറുക
  rationale: ἐκκλίνωയിലെ ദിശാസൂചകമായ ‘തിരിഞ്ഞുമാറുക’ എന്ന ഭാവവും ആജ്ഞയുടെ ശക്തിയും സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: റോമിലെ സഭയോടുള്ള ἀδελφοί എന്ന സംബോധനയുടെ പ്രാതിനിധ്യവ്യാപ്തി
  choice: പ്രധാന പാഠത്തിൽ ‘സഹോദരന്മാരേ’ എന്നു നിലനിർത്തി, മുഴുവൻ സഭയെയും ഉദ്ദേശിച്ചിരിക്കാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: പ്രധാന പാഠത്തിൽ ‘സഹോദരീസഹോദരന്മാരേ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വ്യാകരണലിംഗം പ്രധാന പാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും, പൗലോസിന്റെ ഉപയോഗത്തിൽ മിശ്രലിംഗ സഭാസമൂഹത്തെ അഭിസംബോധന ചെയ്യാനുള്ള സാധ്യത അടിക്കുറിപ്പ് വഴി വായനക്കാരന് നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്കിലെ δέ-യ്ക്ക് പ്രത്യേക കാലസൂചകപദമില്ലാത്തതിനാൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല. നീണ്ട ഗ്രീക്ക് വാക്യഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ആശ്രിത ക്രിയകളെ സമാന്തരമായി ക്രമപ്പെടുത്തി.
