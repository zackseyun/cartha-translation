id: ROM.16.7
reference: Romans 16:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: ml
  text: എന്റെ ബന്ധുക്കളും സഹതടവുകാരുമായ അന്ത്രൊനിക്കൊസിനും യൂനിയയ്ക്കും[a] വന്ദനം പറയുക. അവർ അപ്പൊസ്തലന്മാരുടെ ഇടയിൽ ശ്രദ്ധേയരാണ്[b]; അവർ എനിക്കുമുമ്പേ മശീഹയിൽ ആയിത്തീർന്നവരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘യൂനിയ’: മറ്റൊരു വായന ‘യൂനിയാസ്’ എന്ന പുരുഷനാമമാണ്; എന്നാൽ ഗ്രീക്ക് രൂപവും ചരിത്രപരമായ നാമപ്രയോഗവും സ്ത്രീനാമമായ ‘യൂനിയ’യ്ക്കാണ് കൂടുതൽ പിന്തുണ നൽകുന്നത്.'
    reason: alternative_reading
  - marker: b
    text: ‘അപ്പൊസ്തലന്മാരുടെ ഇടയിൽ പ്രമുഖർ’ എന്നും പരിഭാഷപ്പെടുത്താം; ഈ പദസമുച്ചയത്തിന് ‘അപ്പൊസ്തലന്മാർക്ക് സുപരിചിതർ’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: വന്ദനം പറയുക
  rationale: ലേഖനത്തിലെ നേരിട്ടുള്ള ആജ്ഞയുടെ സ്വഭാവം നിലനിർത്തുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: Ἀνδρόνικον
  choice: അന്ത്രൊനിക്കൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: Ἰουνίαν
  choice: യൂനിയ
  rationale: ഗ്രീക്ക് രൂപവും ചരിത്രപരമായ നാമപ്രയോഗവും പരിഗണിക്കുമ്പോൾ സ്ത്രീനാമമായ യൂനിയയാണ് കൂടുതൽ സാധ്യതയുള്ളത്; മറ്റൊരു വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: συγγενεῖς μου
  choice: എന്റെ ബന്ധുക്കൾ
  rationale: ഈ പദത്തിന് രക്തബന്ധുക്കൾ എന്നും ഒരേ ജനവിഭാഗത്തിൽപ്പെട്ടവർ എന്നും അർഥമാകാം. വ്യാഖ്യാനം അതിയായി നിർണയിക്കാതെ ബന്ധസൂചന നിലനിർത്തുന്നു.
- source_word: συναιχμαλώτους μου
  choice: സഹതടവുകാർ
  rationale: പൗലോസിനോടൊപ്പം തടവനുഭവിച്ചവരെ സൂചിപ്പിക്കുന്ന സംയുക്തപദത്തിന്റെ വ്യക്തമായ മലയാളരൂപം.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: അപ്പൊസ്തലന്മാരുടെ ഇടയിൽ ശ്രദ്ധേയർ
  rationale: പദപ്രയോഗത്തിന്റെ നേരിട്ടുള്ള അർഥം നൽകുമ്പോഴും അവർ അപ്പൊസ്തലന്മാരിൽ ഉൾപ്പെട്ടവരാണോ അപ്പൊസ്തലന്മാർക്ക് സുപരിചിതരാണോ എന്ന വിവാദം അടിക്കുറിപ്പിലൂടെ തുറന്നുവെക്കുന്നു.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: എനിക്കുമുമ്പേ അവർ മശീഹയിൽ ആയിരുന്നു
  rationale: അവർ പൗലോസിനുമുമ്പ് മശീഹയുമായുള്ള ബന്ധത്തിൽ വന്നതും ആ നില തുടർന്നതുമായ ആശയം, ഗ്രീക്കിലെ ‘മശീഹയിൽ’ എന്ന പ്രയോഗം വ്യാഖ്യാനിച്ച് മാറ്റാതെ, നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἰουνίαν എന്ന പേരിന്റെ ലിംഗപരമായ തിരിച്ചറിയൽ
  choice: സ്ത്രീനാമമായ ‘യൂനിയ’
  alternative: പുരുഷനാമമായ ‘യൂനിയാസ്’
  rationale: ഗ്രീക്ക് രൂപത്തിനും പുരാതന നാമപ്രയോഗത്തിനും ഏറ്റവും യോജിക്കുന്നത് സ്ത്രീനാമമാണ്; ചരിത്രപരമായി സ്വാധീനമുള്ള മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: ἐπίσημοι ἐν τοῖς ἀποστόλοις എന്നതിന്റെ അർഥം
  choice: ‘അപ്പൊസ്തലന്മാരുടെ ഇടയിൽ ശ്രദ്ധേയർ’
  alternative: ‘അപ്പൊസ്തലന്മാർക്ക് സുപരിചിതർ’
  rationale: വാക്യം ഇവരെ അപ്പൊസ്തലന്മാരുടെ കൂട്ടത്തിൽ ശ്രദ്ധേയരായി ചിത്രീകരിക്കാം; അല്ലെങ്കിൽ അപ്പൊസ്തലന്മാർക്ക് പ്രസിദ്ധരായവരെന്ന് അർഥമാകാം. മുഖ്യപാഠം നേരിട്ടുള്ള വായന സ്വീകരിക്കുകയും യഥാർഥമായ അർഥസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- issue: ἐν Χριστῷ എന്ന പദസമുച്ചയം
  choice: ‘മശീഹയിൽ’
  alternative: ‘മശീഹയിൽ വിശ്വസിക്കുന്നവരായി’
  rationale: മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായി സമൃദ്ധമായ ബന്ധസൂചകപ്രയോഗം ഒരു പരിവർത്തനസൂത്രമായി ചുരുക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മശീഹയിൽ’ എന്ന മൂലഭാഷാ പ്രയോഗവും അപ്പൊസ്തലന്മാരെ സംബന്ധിച്ച യഥാർഥ അർഥസന്ദിഗ്ധതയും സംരക്ഷിച്ചിരിക്കുന്നു.
