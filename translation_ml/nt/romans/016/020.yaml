id: ROM.16.20
reference: Romans 16:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: ml
  text: സമാധാനത്തിന്റെ ദൈവം ഉടൻതന്നെ സാത്താനെ നിങ്ങളുടെ കാൽക്കീഴിൽ തകർത്തുകളയും. നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: സമാധാനത്തിന്റെ ദൈവം
  rationale: പൗലോസിന്റെ രചനകളിൽ പതിവുള്ള ജനിറ്റീവ് വിശേഷണം നേരിട്ട് നിലനിർത്തുന്നു; വ്യാഖ്യാനാത്മകമായ ‘സമാധാനം നൽകുന്ന ദൈവം’ എന്ന വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: συντρίψει
  choice: തകർത്തുകളയും
  rationale: ഭാവികാലത്തിലെ ഉറച്ച പ്രവൃത്തിയും കാൽക്കീഴിലാക്കുന്ന സമ്പൂർണ പരാജയത്തിന്റെ ദൃശ്യവും സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: τὸν Σατανᾶν
  choice: സാത്താനെ
  rationale: ഗ്രീക്കിൽ വ്യക്തിനാമമായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അർഥവിവർത്തനം ചെയ്യാതെ മലയാളത്തിലെ അംഗീകൃത ലിപ്യന്തരണം സ്വീകരിക്കുന്നു.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: നിങ്ങളുടെ കാൽക്കീഴിൽ
  rationale: വിജയവും കീഴടക്കലും സൂചിപ്പിക്കുന്ന പ്രയോഗം നിലനിർത്തുന്നു; ‘നിങ്ങളുടെ’ എന്നത് ബഹുവചന സമൂഹാഭിസംബോധന സംരക്ഷിക്കുന്നു.
- source_word: ἐν τάχει
  choice: ഉടൻതന്നെ
  rationale: പ്രവൃത്തിയുടെ വേഗത്തെക്കാൾ അതിന്റെ സമീപകാലസംഭവത്തെ ഇവിടെ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἡ χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ അനുഗ്രഹവാക്യത്തിലെ മുഖ്യ ദൈവശാസ്ത്രപദം പരാവർത്തനം ചെയ്യാതെ നിലനിർത്തുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: ബന്ധസൂചകമായ ജനിറ്റീവിനെ മലയാളത്തിലെ സ്വാഭാവിക അനുഗ്രഹവാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തുവിന്റെ
  rationale: മലയാള ക്രൈസ്തവ ഉപയോഗത്തിൽ Χριστός ഇവിടെ യേശുവിന്റെ പേരോടു ചേർന്ന സ്ഥിരവും സ്വാഭാവികവുമായ നാമരൂപമായി കേൾക്കുന്നതിനാൽ ‘യേശുക്രിസ്തു’ സ്വീകരിക്കുന്നു.
- source_word: μεθ’ ὑμῶν
  choice: നിങ്ങളോടുകൂടെ ഇരിക്കട്ടെ
  rationale: ഗ്രീക്കിൽ സൂചിതമായിരിക്കുന്ന ക്രിയ മലയാളത്തിലെ അനുഗ്രഹാശംസയ്ക്ക് ആവശ്യമായതിനാൽ ചേർക്കുന്നു.
theological_decisions:
- issue: അനുഗ്രഹവാക്യത്തിലെ Χριστοῦ എന്നതിന്റെ വിവർത്തനം
  choice: ക്രിസ്തു
  alternative: മശീഹാ
  rationale: ഈ സ്ഥിരമായ അനുഗ്രഹവാക്യത്തിൽ Χριστός വ്യക്തമായ പദവിവരണത്തേക്കാൾ യേശുവിന്റെ പേരോടു ചേർന്ന നാമസദൃശ ഘടകമായി പ്രവർത്തിക്കുന്നു. ‘യേശുക്രിസ്തു’ ആ അർഥവും മലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ഉപയോഗവും സംരക്ഷിക്കുന്നു; ‘യേശുമശീഹാ’ ഇവിടെ അസ്വാഭാവികമാണ്.
- issue: സഭയുടെ പങ്കാളിത്തം സൂചിപ്പിക്കുന്ന ὑπὸ τοὺς πόδας ὑμῶν
  choice: നിങ്ങളുടെ കാൽക്കീഴിൽ
  alternative: തന്റെ കാൽക്കീഴിൽ
  rationale: മൂലപാഠത്തിലെ രണ്ടാംപുരുഷ ബഹുവചനം മാറ്റാതെ നിലനിർത്തുന്നു; ദൈവമാണ് തകർക്കുന്നത്, എന്നാൽ സാത്താൻ വിശ്വാസിസമൂഹത്തിന്റെ കാൽക്കീഴിലാകുന്നു എന്ന പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മൂലപാഠത്തിലെ സമൂഹാഭിസംബോധനയും അനുഗ്രഹവാക്യത്തിന്റെ ഔപചാരിക ഭാവവും നിലനിർത്തിയിരിക്കുന്നു. നൽകിയ ഇംഗ്ലീഷ് കുറിപ്പ് ‘Jesus Christ’ എന്ന പരമ്പരാഗത രൂപത്തെ പകരവായനയായി പറയുന്നുണ്ടെങ്കിലും SBLGNT-യിൽ Χριστοῦ തന്നെയുണ്ട്; മലയാളത്തിൽ ‘യേശുക്രിസ്തു’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചതിനാൽ പ്രത്യേക അടിക്കുറിപ്പ് ആവശ്യമില്ല.
