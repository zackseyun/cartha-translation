  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: ml
  text: നിങ്ങൾക്കുവേണ്ടി[a] വളരെ അധ്വാനിച്ച മറിയത്തെ അഭിവാദ്യം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിങ്ങൾക്കുവേണ്ടി” എന്നതിനുപകരം “ഞങ്ങൾക്കുവേണ്ടി” എന്നോ “നിങ്ങളുടെ ഇടയിൽ” എന്നോ കാണുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: കത്തിന്റെ പശ്ചാത്തലത്തിൽ ആശംസ അറിയിക്കാൻ ഉപയോഗിച്ച ബഹുവചന ആജ്ഞാരൂപം; ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം.
- source_word: Μαριάμ
  choice: മറിയം
  rationale: ബൈബിൾ മലയാളത്തിൽ സുസ്ഥിരവും പരിചിതവുമായ പേരുരൂപം.
- source_word: ἥτις
  choice: …ചെയ്ത
  rationale: മറിയത്തെ വിശേഷിപ്പിക്കുന്ന ബന്ധവാക്യം മലയാളത്തിൽ സ്വാഭാവികമായി കൃതന്തഘടനയിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ നേരിയ ഗുണസൂചന അധികമായി വ്യക്തമാക്കുന്നില്ല.
- source_word: πολλὰ
  choice: വളരെ
  rationale: ക്രിയാവിശേഷണമായി അധ്വാനത്തിന്റെ അളവും തീവ്രതയും സൂചിപ്പിക്കുന്നു.
- source_word: ἐκοπίασεν
  choice: അധ്വാനിച്ച
  rationale: κοπιάω സൂചിപ്പിക്കുന്ന കഠിനവും ക്ഷീണകരവുമായ പ്രയത്‌നം ‘അധ്വാനിക്കുക’ വ്യക്തമായി പകരുന്നു; ഗ്രീക്ക് അരിസ്റ്റിന്റെ ഭൂതകാലസൂചന നിലനിർത്തുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: സ്വീകൃത SBLGNT പാഠത്തിലെ ദിശയോ പ്രയോജനമോ സൂചിപ്പിക്കുന്ന പ്രയോഗം; റോമിലെ വിശ്വാസികൾക്കുവേണ്ടിയുള്ള അധ്വാനം എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: വാക്യത്തിന്റെ അവസാന ഭാഗത്തെ പാഠഭേദം
  choice: നിങ്ങൾക്കുവേണ്ടി
  alternative: ഞങ്ങൾക്കുവേണ്ടി; നിങ്ങളുടെ ഇടയിൽ
  rationale: SBLGNT പാഠം εἰς ὑμᾶς (‘നിങ്ങൾക്കുവേണ്ടി’) എന്നാണ്. εἰς ἡμᾶς (‘ഞങ്ങൾക്കുവേണ്ടി’), ἐν ὑμῖν (‘നിങ്ങളുടെ ഇടയിൽ’) എന്നീ പ്രധാന പാഠഭേദങ്ങൾ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘വളരെ അധ്വാനിച്ച’ എന്നത് മൂലത്തിലെ πολλὰ ἐκοπίασεν എന്ന തീവ്രപ്രയത്‌നത്തെ സ്വാഭാവികമായി പകരുന്നു; പാഠഭേദസൂചകം പേരിനോടു ചേർത്ത് നൽകിയിരിക്കുന്നു.
