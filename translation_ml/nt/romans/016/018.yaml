id: ROM.16.18
reference: Romans 16:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ml
  text: ഇത്തരക്കാർ നമ്മുടെ കർത്താവായ മശീഹായെ[a] സേവിക്കുന്നില്ല; സ്വന്തം വയറിനെയാണു[b] സേവിക്കുന്നത്. മധുരവാക്കുകളും മുഖസ്തുതികൊണ്ടും അവർ നിഷ്കളങ്കരുടെ[c] ഹൃദയങ്ങളെ വഞ്ചിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മുടെ കർത്താവായ ക്രിസ്തുവിനെ.’
    reason: alternative_reading
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, ‘സ്വന്തം വയറിനെ’; സ്വസുഖാസക്തിയുടെ ശക്തമായ ഒരു രൂപകം.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘നിരപരാധികളുടെ,’ ‘കപടതയില്ലാത്തവരുടെ,’ അല്ലെങ്കിൽ ‘ഒന്നും സംശയിക്കാത്തവരുടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: ഇത്തരക്കാർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ ഭിന്നതയും ഇടർച്ചയും ഉണ്ടാക്കുന്ന ആളുകളിലേക്കുള്ള സൂചന സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: നമ്മുടെ കർത്താവായ മശീഹാ
  rationale: κύριος എന്നത് ‘കർത്താവ്’ എന്നും Χριστός എന്ന അഭിഷിക്തസ്ഥാനപ്പേര് ‘മശീഹാ’ എന്നും വിവർത്തനം ചെയ്തു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘യേശു’ ചേർത്തിട്ടില്ല.
- source_word: δουλεύουσιν
  choice: സേവിക്കുന്നു
  rationale: അടിമയെപ്പോലെ സേവിക്കുക എന്ന അടിസ്ഥാനഭാവം ഉള്ള ക്രിയയാണെങ്കിലും, ഇവിടെ കർത്താവിനെ സേവിക്കുന്നതും സ്വന്തം വയറിനെ സേവിക്കുന്നതും തമ്മിലുള്ള വൈരുധ്യം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: κοιλίᾳ
  choice: വയർ
  rationale: സ്വാർത്ഥവും സ്വഭോഗപരവുമായ മോഹങ്ങളെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ മൂർത്തമായ രൂപകം വ്യാഖ്യാനിച്ച് മൃദൂകരിക്കാതെ നിലനിർത്തുന്നു.
- source_word: χρηστολογίας
  choice: മധുരവാക്കുകൾ
  rationale: കേൾക്കാൻ ഇമ്പമുള്ളതും ആളുകളെ വശീകരിക്കുന്നതുമായ സംസാരത്തെ സ്വാഭാവിക മലയാളത്തിൽ സൂചിപ്പിക്കുന്നു.
- source_word: εὐλογίας
  choice: മുഖസ്തുതി
  rationale: ഈ വഞ്ചനാസന്ദർഭത്തിൽ യഥാർഥ അനുഗ്രഹമല്ല, പ്രീതിപ്പെടുത്താനായി പറയുന്ന പ്രശംസാവാക്കുകളാണ് ഉദ്ദേശിക്കുന്നത്.
- source_word: ἐξαπατῶσι
  choice: വഞ്ചിക്കുന്നു
  rationale: ശക്തമായ വഞ്ചനയെ സൂചിപ്പിക്കുന്ന സംയുക്തക്രിയയുടെ സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καρδίας
  choice: ഹൃദയങ്ങൾ
  rationale: ബുദ്ധിയെ മാത്രം അല്ല, ആന്തരിക വ്യക്തിത്വത്തെ സൂചിപ്പിക്കുന്ന വേദപുസ്തകപ്രയോഗം സംരക്ഷിക്കുന്നു.
- source_word: ἀκάκων
  choice: ഒന്നും സംശയിക്കാത്തവർ
  rationale: കപടതയില്ലാത്തവർ, നിരപരാധികൾ എന്നീ സാധ്യതകളിൽ, വഞ്ചിക്കപ്പെടാനുള്ള അവരുടെ ജാഗ്രതക്കുറവ് ഈ മുന്നറിയിപ്പിന്റെ സന്ദർഭത്തിൽ വ്യക്തമായി പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സ്ഥാനപ്പേരായ Χριστός എങ്ങനെ വിവർത്തനം ചെയ്യണം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ ഒരു സ്ഥാനപ്പേരായതിനാൽ അതിന്റെ അർഥം പ്രകടമാക്കുന്ന ‘മശീഹാ’ മുഖ്യപാഠത്തിൽ ഉപയോഗിച്ചു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഗ്രീക്കിലെ വൈരുധ്യത്തിന് ഊന്നൽ നൽകാൻ രണ്ടാം ഉപവാക്യത്തിൽ ‘സേവിക്കുന്നത്’ ആവർത്തിച്ചു. ‘വയർ’ എന്ന മൂർത്തരൂപകവും ἀκάκων എന്ന പദത്തിന്റെ അർഥവ്യാപ്തിയും അടിക്കുറിപ്പുകളോടെ സംരക്ഷിച്ചു.
