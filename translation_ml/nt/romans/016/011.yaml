id: ROM.16.11
reference: Romans 16:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: ml
  text: എന്റെ സ്വജനമായ[a] ഹെരോദ്യോനെ അഭിവാദ്യം ചെയ്യുക. നാർക്കിസ്സൊസിന്റെ കൂട്ടത്തിൽപ്പെട്ടവരിൽ[b] കർത്താവിലുള്ളവരെ അഭിവാദ്യം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘എന്റെ ബന്ധു’ എന്നോ ‘എന്റെ സഹയഹൂദൻ’ എന്നോ അർഥമാകാം; ഗ്രീക്ക് പദം രക്തബന്ധുവിനെയോ പൗലോസിന്റെ സ്വന്തം ജനത്തിൽപ്പെട്ട ഒരാളെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: നാർക്കിസ്സൊസിന്റെ ഭവനത്തിലോ സ്വത്തുവകയോടു ബന്ധപ്പെട്ടവരോ ആയ, കർത്താവിൽ വിശ്വസിക്കുന്നവരെയായിരിക്കാം ഇത് സൂചിപ്പിക്കുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: കത്തിന്റെ അവസാനഭാഗത്തെ ആശംസാസന്ദർഭത്തിൽ ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ അർഥം സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: Ἡρῳδίωνα
  choice: ഹെരോദ്യോൻ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ലിപ്യന്തരണരീതിയിൽ നൽകിയിരിക്കുന്നു.
- source_word: συγγενῆ μου
  choice: എന്റെ സ്വന്തക്കാരനായ
  rationale: ഈ പദം രക്തബന്ധുവിനെയോ പൗലോസിന്റെ സ്വന്തം ജനത്തിൽപ്പെട്ട ഒരാളെയോ സൂചിപ്പിക്കാം. ‘സ്വന്തക്കാരൻ’ ഈ ബന്ധത്തിന്റെ വീതി ഒരളവുവരെ നിലനിർത്തുന്നു; കൃത്യമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: നാർക്കിസ്സൊസിന്റെ ആളുകളിൽ
  rationale: നാർക്കിസ്സൊസുമായി ബന്ധപ്പെട്ട ഒരു കൂട്ടത്തെ സൂചിപ്പിക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘വീട്ടുകാർ’ എന്ന പദം പ്രധാനവാചകത്തിൽ ചേർക്കാതെ ബന്ധത്തിന്റെ സ്വഭാവം തുറന്നുവെക്കുന്നു.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: കർത്താവിലുള്ളവരെ
  rationale: പൗലോസിന്റെ ‘കർത്താവിൽ’ എന്ന സവിശേഷ പ്രയോഗവും അതിന്റെ ദൈവശാസ്ത്രപരമായ അർഥവ്യാപ്തിയും വിശദീകരണപരമായി ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: κυρίῳ
  choice: കർത്താവ്
  rationale: ഈ പൗലോസ്യ ക്രിസ്തീയ പ്രയോഗത്തിൽ κύριος എന്ന പദത്തിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാളരൂപം.
theological_decisions:
- issue: συγγενής എന്ന പദത്തിന്റെ ബന്ധസൂചന
  choice: ‘എന്റെ സ്വന്തക്കാരനായ’ എന്നു വിശാലമായി പരിഭാഷപ്പെടുത്തി, സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘എന്റെ ബന്ധുവായ’ അല്ലെങ്കിൽ ‘എന്റെ സഹയഹൂദനായ’.
  rationale: വാക്യം രക്തബന്ധമോ ഒരേ ജനവിഭാഗത്തിൽപ്പെട്ടതോ എന്ന് നിർണയിക്കുന്നില്ല; അതിനാൽ ഒരു അർഥം മാത്രം പ്രധാനവാചകത്തിൽ ഉറപ്പിച്ചിട്ടില്ല.
- issue: നാർക്കിസ്സൊസുമായി ബന്ധപ്പെട്ടവരുടെ പരിധി
  choice: ‘നാർക്കിസ്സൊസിന്റെ ആളുകളിൽ’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നാർക്കിസ്സൊസിന്റെ വീട്ടുകാരിൽ’ അല്ലെങ്കിൽ ‘നാർക്കിസ്സൊസിന്റെ ഭവനത്തിൽപ്പെട്ടവരിൽ’.
  rationale: ഗ്രീക്ക് പ്രയോഗം നാർക്കിസ്സൊസുമായുള്ള ബന്ധം സൂചിപ്പിക്കുന്നുവെങ്കിലും ‘വീട്’ എന്ന നാമം നേരിട്ട് ഉപയോഗിക്കുന്നില്ല. സാധ്യതയുള്ള ഭവന/സ്വത്ത്-സംഘ അർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘അഭിവാദ്യം ചെയ്യുക’, ‘കർത്താവിലുള്ളവർ’ എന്നീ പ്രയോഗങ്ങൾ കത്തിന്റെ ഔപചാരിക ഭാവവും പൗലോസിന്റെ ഭാഷാശൈലിയും നിലനിർത്തുന്നു. അർഥസന്ദിഗ്ധമായ ബന്ധസൂചനകൾ പ്രധാനവാചകത്തിൽ അമിതമായി വിശദീകരിക്കാതെ അടിക്കുറിപ്പുകളിൽ അവതരിപ്പിച്ചു.
