- from: എന്റെ സ്വന്തക്കാരനായ[a] ഹെരോദ്യോനെ അഭിവാദ്യം ചെയ്യുക. നാർക്കിസ്സൊസിന്റെ ആളുകളിൽ[b] കർത്താവിലുള്ളവരെ അഭിവാദ്യം ചെയ്യുക.
  to: എന്റെ സ്വജനമായ[a] ഹെരോദ്യോനെ അഭിവാദ്യം ചെയ്യുക. നാർക്കിസ്സൊസിന്റെ കൂട്ടത്തിൽപ്പെട്ടവരിൽ[b] കർത്താവിലുള്ളവരെ അഭിവാദ്യം ചെയ്യുക.
  rationale: The revision replaces two Malayalam expressions that either obscure or overstate the Greek. ‘സ്വജനമായ’ retains the deliberate ambiguity of συγγενής, with the alternative senses stated in the footnote. ‘നാർക്കിസ്സൊസിന്റെ കൂട്ടത്തിൽപ്പെട്ടവരിൽ’ communicates association without importing ‘household,’ ‘servants,’ or another specific social relationship into the main text. The second phrase continues to identify only the believers among that associated group.
