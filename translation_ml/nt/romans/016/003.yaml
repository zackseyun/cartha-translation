id: ROM.16.3
reference: Romans 16:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: ml
  text: മശീഹായ യേശുവിൽ[b] എന്റെ സഹപ്രവർത്തകരായ പ്രിസ്കയെയും[a] അക്വിലയെയും അഭിവാദ്യം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പ്രിസ്ക എന്നത് ഔപചാരിക നാമരൂപമാണ്; മറ്റിടങ്ങളിൽ ഇതേ വ്യക്തിക്ക് ഉപയോഗിക്കുന്ന കൂടുതൽ പരിചിതമായ രൂപം ‘പ്രിസ്കില്ല’ എന്നാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, ‘ക്രിസ്തുയേശുവിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: കത്തുകളിലെ ആശംസ അറിയിക്കാനുള്ള നിർദേശമാണ് ഈ ബഹുവചന ആജ്ഞാരൂപം. ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: Πρίσκαν
  choice: പ്രിസ്ക
  rationale: മൂലപാഠത്തിലുള്ള ഔപചാരിക നാമരൂപം ലിപ്യന്തരണം ചെയ്തു; മറ്റിടങ്ങളിൽ പരിചിതമായ ‘പ്രിസ്കില്ല’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകി.
- source_word: Ἀκύλαν
  choice: അക്വില
  rationale: Ἀκύλας എന്ന വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: συνεργούς μου
  choice: എന്റെ സഹപ്രവർത്തകരായ
  rationale: പൗലൊസിനോടൊപ്പം പൊതുവായ ദൗത്യത്തിൽ പ്രവർത്തിക്കുന്നവരെന്ന സഹകരണാർഥവും μου എന്ന ഉടമസ്ഥബന്ധവും സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹായ യേശുവിൽ
  rationale: ἐν എന്നത് ബന്ധത്തിന്റെയോ പ്രവർത്തനത്തിന്റെയോ മേഖലയെ സൂചിപ്പിക്കുന്നു; Χριστός ഇവിടെ യേശുവിന്റെ പദവിയായ ‘മശീഹാ’ എന്ന അർഥത്തിൽ വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: പൗലൊസിന്റെ ἐν Χριστῷ Ἰησοῦ എന്ന പ്രയോഗത്തിലെ Χριστός എങ്ങനെ നൽകണം
  choice: മശീഹായ യേശുവിൽ
  alternative: ക്രിസ്തുയേശുവിൽ
  rationale: Χριστός എന്ന പദത്തിന്റെ പദവിസ്വഭാവം വ്യക്തമാക്കാൻ ‘മശീഹാ’ ഉപയോഗിച്ചു. മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ പരിചിതമായ ‘ക്രിസ്തുയേശു’ എന്ന രൂപം സുതാര്യതയ്ക്കായി അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അഭിവാദ്യം ചെയ്യുക’ എന്ന രൂപം അനാവശ്യമായ പുരാതനഭാവം ഒഴിവാക്കുന്നു; പേരുകളും മശീഹാ എന്ന പദവിയും വായനാസൗകര്യത്തോടെ നൽകിയിരിക്കുന്നു.
