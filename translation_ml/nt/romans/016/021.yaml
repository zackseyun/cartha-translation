id: ROM.16.21
reference: Romans 16:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: ml
  text: എന്റെ സഹപ്രവർത്തകനായ തിമൊഥെയൊസ് നിങ്ങളെ വന്ദനം ചെയ്യുന്നു; എന്റെ സ്വജനങ്ങളായ[a] ലൂക്യൊസും യാസോനും സൊസിപത്രൊസും വന്ദനം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘എന്റെ ബന്ധുക്കളായ’ അല്ലെങ്കിൽ ‘എന്നെപ്പോലെ യഹൂദരായവർ.’ ഗ്രീക്ക് പദം കുടുംബബന്ധത്തെയോ വിശാലമായ വംശീയ/ജനതാബന്ധത്തെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: വന്ദനം ചെയ്യുന്നു
  rationale: ലേഖനസന്ദർഭത്തിൽ ἀσπάζομαι എന്നത് അഭിവാദ്യം അറിയിക്കുക എന്ന അർഥത്തിലാണ്; പട്ടികയിലെ എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗമാണിത്.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: റോമിലെ സ്വീകർത്താക്കളെ കൂട്ടമായി സൂചിപ്പിക്കുന്ന ദ്വിതീയപുരുഷ ബഹുവചന കർമരൂപം.
- source_word: συνεργός
  choice: സഹപ്രവർത്തകൻ
  rationale: പൗലൊസിനോടൊപ്പം ഒരേ ശുശ്രൂഷാപ്രവർത്തനത്തിൽ ഏർപ്പെട്ടിരിക്കുന്നവനെ സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമാണ്.
- source_word: Τιμόθεος
  choice: തിമൊഥെയൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Λούκιος
  choice: ലൂക്യൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Ἰάσων
  choice: യാസോൻ
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ ശബ്ദരൂപത്തോട് ചേർന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Σωσίπατρος
  choice: സൊസിപത്രൊസ്
  rationale: ഈ വാക്യത്തിലെ പൂർണ ഗ്രീക്ക് നാമരൂപമായ Σωσίπατρος പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം; ചുരുക്കരൂപമായ ‘സൊപത്രൊസ്’ സ്വീകരിച്ചിട്ടില്ല.
- source_word: συγγενεῖς
  choice: ബന്ധുക്കൾ
  rationale: കുടുംബബന്ധത്തെയും വിശാലമായ വംശീയ/ജനതാബന്ധത്തെയും സൂചിപ്പിക്കാൻ കഴിയുന്ന പദം. മലയാളത്തിലെ ‘ബന്ധുക്കൾ’ പ്രധാന അർഥം സ്വാഭാവികമായി നൽകുന്നു; വിശാലസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: συγγενεῖς μου എന്നതിന്റെ വ്യാപ്തി
  choice: എന്റെ ബന്ധുക്കൾ
  alternative: എന്റെ സ്വജനങ്ങൾ; എന്നെപ്പോലെ യഹൂദരായവർ
  rationale: പദം രക്തബന്ധുക്കളെയോ വിശാലമായ വംശീയ-ജനതാബന്ധമുള്ളവരെയോ സൂചിപ്പിക്കാം. വാക്യം തന്നെ ഉദ്ദേശ്യം നിർണയിക്കാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘ബന്ധുക്കൾ’ നൽകി മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ അഭിവാദനഘടന മലയാളത്തിൽ സ്വാഭാവികമാക്കാൻ ക്രിയ അവസാനം നൽകി; συγγενεῖς എന്നതിലെ യഥാർഥ സന്ദിഗ്ധത അടിക്കുറിപ്പിലൂടെ നിലനിർത്തി.
