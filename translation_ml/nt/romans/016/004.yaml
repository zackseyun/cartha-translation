id: ROM.16.4
reference: Romans 16:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: ml
  text: അവർ എന്റെ ജീവനുവേണ്ടി സ്വന്തം കഴുത്തുകൾ പണയംവെച്ചവരാണ്.[a] അവരോടു ഞാൻ മാത്രമല്ല, വിജാതീയരുടെ എല്ലാ സഭകളും നന്ദി പറയുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, ‘സ്വന്തം കഴുത്ത് വെച്ചു.’ മരണഭീഷണിക്ക് സ്വയം വിധേയരാകുന്നതിനെ സൂചിപ്പിക്കുന്ന പ്രയോഗം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ജാതികളുടെ എല്ലാ സഭകളും’ അല്ലെങ്കിൽ ‘എല്ലാ ജനതകളുടെയും സഭകളും.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: അവരാണ് അവർ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ പ്രിസ്കയെയും അക്വിലാസിനെയും വിവരിക്കുന്ന ബന്ധവാക്യത്തിന്റെ ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: എന്റെ ജീവൻ രക്ഷിക്കാനായി
  rationale: ഇവിടെ ψυχή അമൂർത്തമായ ആത്മാവിനെയല്ല, പൗലോസിന്റെ ഭൗതികജീവനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ഉദ്ദേശ്യം വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: സ്വന്തം കഴുത്തുകൾ അപകടത്തിലാക്കിയവരാണ്
  rationale: അക്ഷരാർഥചിത്രമായ ‘കഴുത്ത്’ നിലനിർത്തിക്കൊണ്ട്, മരണഭീഷണിക്ക് സ്വയം വിധേയരാക്കി എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു. വ്യക്തികൾ രണ്ടുപേരായതിനാൽ മലയാളത്തിൽ ബഹുവചനം ഉപയോഗിച്ചു.
- source_word: οἷς ... εὐχαριστῶ
  choice: അവരോടു ... നന്ദിയുള്ളവരാണ്
  rationale: εὐχαριστέωയുടെ ദാതൃബന്ധം ‘അവരോടു’ എന്നതിലൂടെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: οὐκ ἐγὼ μόνος ... ἀλλὰ καὶ
  choice: ഞാൻ മാത്രമല്ല ... എല്ലാ സഭകളും
  rationale: പൗലോസ് ഒറ്റയ്ക്കല്ല, മറ്റു സഭകളും നന്ദിയുള്ളവരാണ് എന്ന ഊന്നിയ വൈരുധ്യം സംരക്ഷിക്കുന്നു.
- source_word: πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν
  choice: ജനതകളിൽനിന്നുള്ള എല്ലാ സഭകളും
  rationale: ἐκκλησίαιയെ ‘സഭകൾ’ എന്നും ἔθνηയെ യഹൂദേതര ജനവിഭാഗങ്ങൾ എന്ന സന്ദർഭാർഥം സൂചിപ്പിക്കുന്ന ‘ജനതകളിൽനിന്നുള്ള’ എന്നും പരിഭാഷപ്പെടുത്തി; ‘വിജാതീയർ’ എന്ന മതപരമ്പരാഗത പദത്തിന്റെ അനാവശ്യ ഭാരവും ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ψυχή എന്നതിന്റെ സന്ദർഭാർഥം
  choice: ജീവൻ
  alternative: ആത്മാവ്
  rationale: സ്വയം മരണഭീഷണിക്ക് വിധേയരാക്കിയ പ്രവൃത്തിയാണ് സന്ദർഭം; അതിനാൽ പൗലോസിന്റെ ജീവൻ എന്ന അർഥമാണ് യോജിച്ചത്.
- issue: ἐθνῶν എന്നതിന്റെ അർഥം
  choice: ജനതകളിൽനിന്നുള്ള
  alternative: വിജാതീയരുടെ / ജാതികളുടെ
  rationale: റോമർ ലേഖനത്തിലെ യഹൂദ-യഹൂദേതര പശ്ചാത്തലം നിലനിർത്തുന്നതിനൊപ്പം സാധാരണ വായനക്കാർക്ക് വ്യക്തവും മാന്യവുമായ ഭാഷ ഉപയോഗിക്കുന്നു.
- issue: ‘കഴുത്ത് വെച്ചു’ എന്ന ഗ്രീക്ക് രൂപകത്തിന്റെ പരിഭാഷ
  choice: കഴുത്തുകൾ അപകടത്തിലാക്കി
  alternative: കഴുത്തുകൾ വെച്ചു / ജീവൻ പണയംവെച്ചു
  rationale: മൂലത്തിലെ ശരീരരൂപകം സംരക്ഷിക്കുകയും അതിന്റെ മാരകാപകടസൂചന വ്യക്തമാക്കുകയും ചെയ്യുന്നു; അവർ യഥാർഥത്തിൽ മരിച്ചുവെന്ന ധ്വനി വരാതിരിക്കാൻ ‘ജീവൻ അർപ്പിച്ചു’ ഒഴിവാക്കി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിന്റെ തുടർച്ചയായിരുന്നാലും ഒറ്റവാക്യമായി വായിക്കാവുന്ന വിധത്തിൽ ബന്ധം വ്യക്തമാക്കി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തി.
