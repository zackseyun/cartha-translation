id: ROM.16.12
reference: Romans 16:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: ml
  text: കർത്താവിൽ അധ്വാനിച്ച ത്രുഫൈനയെയും ത്രുഫോസയെയും[a] അഭിവാദ്യം ചെയ്യുക. കർത്താവിൽ വളരെ അധ്വാനിച്ച പ്രിയപ്പെട്ടവളായ[b] പെർസിസിനെയും അഭിവാദ്യം ചെയ്യുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കർത്താവിൽ കഠിനമായി അധ്വാനിക്കുന്ന” / “കർത്താവിൽ കഠിനമായി പണിപ്പെട്ട.”
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “പ്രിയപ്പെട്ടവളായ”; “എന്റെ” എന്ന പദം ഗ്രീക്ക് പാഠത്തിലില്ല.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: ലേഖനത്തിലെ അഭിവാദനപ്പട്ടികയിൽ സ്വാഭാവികവും സംക്ഷിപ്തവുമായ ആധുനിക മലയാള പ്രയോഗം; ‘സ്വാഗതം ചെയ്യുക’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: ത്രുഫൈനയെയും ത്രുഫോസയെയും
  rationale: വ്യക്തിനാമങ്ങൾ വിവർത്തനം ചെയ്യാതെ ഗ്രീക്ക് ഉച്ചാരണത്തോട് അടുത്തവിധം മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: അധ്വാനിച്ച / അധ്വാനിച്ച
  rationale: κοπιάω എന്ന ഒരേ ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തുന്നു; കഠിനമായ പരിശ്രമത്തിന്റെ ആശയം ‘അധ്വാനിക്കുക’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ സമൃദ്ധമായ ബന്ധപരവും പ്രവർത്തനമണ്ഡലപരവുമായ പ്രയോഗം ചുരുക്കാതെ നിലനിർത്തുന്നു; ‘കർത്താവിനുവേണ്ടി’ എന്നു മാത്രം പറഞ്ഞ് അർഥം പരിമിതപ്പെടുത്തുന്നില്ല.
- source_word: Περσίδα
  choice: പെർസിസിനെ
  rationale: വ്യക്തിനാമം ഗ്രീക്കിൽനിന്ന് മലയാളത്തിലേക്ക് ലിപ്യന്തരിച്ചു.
- source_word: τὴν ἀγαπητήν
  choice: പ്രിയപ്പെട്ടവളായ
  rationale: സ്ത്രീലിംഗ വിശേഷണത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘എന്റെ’ എന്ന ഉടമസ്ഥസൂചന ചേർക്കുന്നില്ല.
- source_word: πολλὰ
  choice: വളരെ
  rationale: ἐκοπίασεν എന്ന ക്രിയയെ വിശേഷിപ്പിച്ച് പെർസിസിന്റെ അധ്വാനത്തിന്റെ അളവിന് ഊന്നൽ നൽകുന്ന സ്വാഭാവിക മലയാള രൂപം.
theological_decisions:
- issue: പൗലോസിന്റെ ശുശ്രൂഷാപ്രയോഗമായ ἐν κυρίῳ എന്നതിന്റെ അർഥം
  choice: കർത്താവിൽ
  alternative: കർത്താവിനുവേണ്ടി / കർത്താവിന്റെ സേവനത്തിൽ
  rationale: കർത്താവുമായുള്ള ബന്ധത്തിലും അവിടുത്തെ അധീനതയിലുള്ള പ്രവർത്തനമണ്ഡലത്തിലും നടന്ന അധ്വാനം എന്ന വിശാലമായ ആശയം നിലനിർത്തുന്നു.
- issue: ἀγαπητήν എന്നതിൽ ഉടമസ്ഥസൂചന ചേർക്കാതിരിക്കുക
  choice: പ്രിയപ്പെട്ടവളായ
  alternative: എനിക്കു പ്രിയപ്പെട്ടവളായ
  rationale: ഗ്രീക്ക് പാഠത്തിൽ μου (‘എന്റെ’) ഇല്ലാത്തതിനാൽ പൗലോസിന്റെ വ്യക്തിപരമായ ഉടമസ്ഥസൂചന വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം ഉപയോഗിച്ചു. ‘അഭിവാദ്യം ചെയ്യുക’ എന്ന ആവർത്തനം ഗ്രീക്ക് വാക്യഘടനയുടെ സമാന്തരത നിലനിർത്തുന്നു; ‘കർത്താവിൽ’ എന്ന പൗലോസീയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ സൂക്ഷിച്ചു.
