id: ROM.16.10
reference: Romans 16:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: ml
  text: മശീഹയിൽ[a] അംഗീകൃതനായ അപ്പെല്ലെസിന് അഭിവാദനം അറിയിക്കുക. അരിസ്തൊബൂലൊസിന്റെ വീട്ടുകാർക്ക് അഭിവാദനം അറിയിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, പരമ്പരാഗതമായി, ‘ക്രിസ്തുവിൽ.’
    reason: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിചിതമായ പരമ്പരാഗത പരിഭാഷ നൽകുന്നു.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: ബഹുവചന ആജ്ഞയുടെ ആശയം സ്വാഭാവികവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: Ἀπελλῆν
  choice: അപ്പെല്ലെസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ മലയാള ലിപ്യന്തരണം.
- source_word: τὸν δόκιμον
  choice: യോഗ്യനെന്നു തെളിഞ്ഞ
  rationale: പരിശോധിക്കപ്പെട്ട് യഥാർഥനോ സ്വീകാര്യനോ എന്നു തെളിഞ്ഞ വ്യക്തി എന്ന δόκιμος എന്ന പദത്തിന്റെ അഭിനന്ദനാർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; പരീക്ഷയുടെ രീതി അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: പൗലോസിന്റെ ബന്ധം/വ്യാപ്തി സൂചിപ്പിക്കുന്ന ‘ἐν’ പ്രയോഗം നിലനിർത്തുകയും Χριστός എന്ന സ്ഥാനപ്പേരിനെ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: അരിസ്തൊബൂലൊസിന്റെ ഭവനത്തിലുള്ളവരെ
  rationale: അരിസ്തൊബൂലൊസുമായി ബന്ധപ്പെട്ട ഭവനാംഗങ്ങളെയോ ഭൃത്യരെയോ ആളുകളെയോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം വ്യക്തമായി നൽകുന്നു; അരിസ്തൊബൂലൊസ് തന്നെ അവരിൽ ഉൾപ്പെട്ടിരുന്നുവെന്ന് പ്രസ്താവിക്കുന്നില്ല.
theological_decisions:
- issue: ἐν Χριστῷ എന്ന പൗലോസിന്റെ പ്രയോഗത്തിലെ Χριστῷ എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ ഭാവം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകി; അതേസമയം പരമ്പരാഗതവും പരിചിതവുമായ ‘ക്രിസ്തുവിൽ’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു. ‘യിൽ’ എന്നത് പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ ബന്ധ/വ്യാപ്തി പ്രയോഗത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘യോഗ്യനെന്നു തെളിഞ്ഞ’ എന്നത് പദാനുപദ കാഠിന്യം ഒഴിവാക്കി δόκιμος എന്നതിന്റെ അംഗീകാരഭാവം നിലനിർത്തുന്നു. അടിക്കുറിപ്പ് സൂചകം അതുമായി ബന്ധപ്പെട്ട ‘മശീഹയിൽ’ എന്ന പദത്തിനു പിന്നാലെ തന്നെയാണ് നൽകിയിരിക്കുന്നത്.
