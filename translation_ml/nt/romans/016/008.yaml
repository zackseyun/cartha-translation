  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: ml
  text: കർത്താവിൽ എനിക്കു പ്രിയനായ അംപ്ലിയാത്തൊസിന്[a] അഭിവാദനം അറിയിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ ഗ്രീക്ക് പേരിനെ ‘അംപ്ലിയാസ്’ എന്നും എഴുതാറുണ്ട്; ഇവിടെ SBLGNTയിലെ പാഠരൂപം ‘അംപ്ലിയാത്തൊസ്’ എന്നതിനെ പിന്തുണയ്ക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: കത്തുകളിലെ ആശംസ അറിയിക്കാനുള്ള കല്പനയായി വരുന്ന ദ്വിതീയപുരുഷ ബഹുവചന ക്രിയയാണ്. മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംക്ഷിപ്ത തുല്യപ്രയോഗം ‘അഭിവാദ്യം ചെയ്യുക’ എന്നതാണ്.
- source_word: Ἀμπλιᾶτον
  choice: അംപ്ലിയാത്തൊസ്
  rationale: SBLGNTയിലെ Ἀμπλιᾶτον എന്ന ആക്കുസറ്റീവ് രൂപത്തെ അതിന്റെ നാമനിർദേശരൂപമായ Ἀμπλιᾶτος എന്നു തിരിച്ചറിഞ്ഞ് മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു. ‘അംപ്ലിയാസ്’ എന്ന ഹ്രസ്വരൂപം ചില പാഠപരമ്പരകളിൽ കാണുന്നതിനാൽ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἀγαπητόν μου
  choice: എനിക്കു പ്രിയനായ
  rationale: പൗലോസിന്റെ വ്യക്തിപരമായ സ്നേഹവും ബന്ധത്തിന്റെ ഊഷ്മളതയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ഈ പൗലോസീയ പ്രയോഗത്തിന്റെ ബന്ധപരവും വിശ്വാസസമൂഹപരവുമായ അർഥവ്യാപ്തി നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ‘യേശു’ ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ സ്നേഹപ്രകടനവും ἐν κυρίῳ എന്നതിന്റെ ബന്ധവും
  choice: ‘കർത്താവിൽ എനിക്കു പ്രിയനായ’ എന്ന നിലയിൽ ἐν κυρίῳ എന്നത് അംപ്ലിയാത്തൊസിനോടുള്ള പൗലോസിന്റെ സ്നേഹബന്ധത്തെ വിശ്വാസസമൂഹത്തിന്റെ ചട്ടക്കൂടിൽ വിശേഷിപ്പിക്കുന്നു.
  alternative: ഇത് വെറും ‘എന്റെ പ്രിയ സുഹൃത്ത്’ എന്ന വ്യക്തിപരമായ അർഥത്തിൽ മാത്രം എടുക്കുക, അല്ലെങ്കിൽ ‘കർത്താവിൽ അഭിവാദ്യം ചെയ്യുക’ എന്നിങ്ങനെ അഭിവാദ്യക്രിയയോടു ചേർക്കുക.
  rationale: ഗ്രീക്ക് പദക്രമവും ഘടനയും τὸν ἀγαπητόν μου ἐν κυρίῳ എന്ന മുഴുവൻ വിശേഷണഭാഗത്തെ Ἀμπλιᾶτον എന്ന പേരോടു ബന്ധിപ്പിക്കുന്നതാണ് ഏറ്റവും സ്വാഭാവികം. അതിനാൽ ‘കർത്താവിൽ’ എന്ന ദൈവശാസ്ത്രപരമായ ചട്ടക്കൂട് വ്യക്തമാക്കാതെ ഇല്ലാതാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വ്യക്തിനാമം ഉറവിടപാഠത്തിന് അനുസരിച്ച് ലിപ്യന്തരിച്ചു; ‘കർത്താവിൽ’ എന്ന സ്ഥാപിത ബൈബിൾപ്രയോഗം നിലനിർത്തി.
