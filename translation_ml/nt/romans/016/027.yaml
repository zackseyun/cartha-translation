source:
  edition: robinson-pierpont-2005-byzantine
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: ml
  text: ജ്ഞാനിയായ ഏക ദൈവത്തിന്, യേശു മശീഹയിലൂടെ—അവന് എന്നേക്കും മഹത്വം ഉണ്ടാകട്ടെ. ആമേൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം റോമർ 16:25–27-ലെ സമാപന സ്തുതിവാക്യം പൂർത്തിയാക്കുന്നു. റോമർ 16:25-ൽ സൂചിപ്പിച്ചതുപോലെ, ആദ്യകാല കൈയെഴുത്തുപ്രതികളിൽ ഈ സ്തുതിവാക്യം ഉൾപ്പെടുന്നതിലും അതിന്റെ സ്ഥാനത്തിലും ഗണ്യമായ വ്യത്യാസങ്ങളുണ്ട്; എന്നാൽ ബൈസന്റൈൻ ഭൂരിപക്ഷ പാരമ്പര്യത്തിൽ ഇത് ഇവിടെ നിലനിൽക്കുന്നു.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: ജ്ഞാനിയായ ഏക ദൈവത്തിന്
  rationale: μόνῳ എന്ന പദത്തിന്റെ ‘ഏക/ഒരേയൊരു’ എന്ന ഊന്നലും σοφῷ θεῷ എന്നതിന്റെ ‘ജ്ഞാനിയായ ദൈവം’ എന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിലൂടെ
  rationale: διά + genitive ഇടനിലയെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്നതിനാൽ ‘യിലൂടെ’ എന്നു പരിഭാഷപ്പെടുത്തി; Χριστός എന്ന അഭിഷിക്തപദവി ‘മശീഹ’യായി നൽകി.
- source_word: ᾧ
  choice: അവന്
  rationale: ദത്തിവിലുള്ള ബന്ധസർവനാമത്തിന്റെ പരാമർശം ദൈവത്തെയോ അടുത്തുള്ള യേശു മശീഹയെയോ വ്യാകരണപരമായി ഓർമിപ്പിക്കാവുന്നതിനാൽ, ഗ്രീക്കിലെ നേരിയ സന്ദിഗ്ധത പരിഹരിക്കാതെ ‘അവന്’ എന്നു നിലനിർത്തുന്നു.
- source_word: εἰς τοὺς αἰῶνας
  choice: എന്നേക്കും
  rationale: അക്ഷരാർഥത്തിൽ ‘യുഗങ്ങളിലേക്ക്’ എന്നാണെങ്കിലും, അവസാനമില്ലാത്ത കാലത്തെ സൂചിപ്പിക്കുന്ന പതിവു ഗ്രീക്ക് പ്രയോഗമായതിനാൽ സ്വാഭാവികമായ ‘എന്നേക്കും’ തെരഞ്ഞെടുത്തു.
- source_word: ἡ δόξα
  choice: മഹത്വം ഉണ്ടാകട്ടെ
  rationale: സ്തുതിവാക്യത്തിന്റെ ആശംസാത്മകമായ അർഥം മലയാളത്തിൽ പൂർണ്ണവും സ്വാഭാവികവുമായ വാക്യമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ᾧ എന്ന ബന്ധസർവനാമത്തിന്റെ പൂർവപദം
  choice: ‘അവന്’ എന്നു നൽകി പൂർവപദം തുറന്നുവച്ചു
  alternative: ‘ദൈവത്തിന്’ എന്നു ആവർത്തിച്ച് ദൈവത്തെ മാത്രം പൂർവപദമാക്കുക
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ ‘ദൈവം’ പ്രധാന പൂർവപദമായിരിക്കുമ്പോഴും ‘യേശു മശീഹ’ അടുത്തായി വരുന്നതിനാൽ ചെറിയ പരാമർശസന്ദിഗ്ധതയുണ്ട്; അത് വിവർത്തനത്തിൽ നിശ്ശബ്ദമായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരപൂർവവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. സ്തുതിവാക്യത്തിന്റെ ഗൗരവം നിലനിർത്താൻ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു; വിഭാഗീയ സാങ്കേതികഭാഷ ഒഴിവാക്കി.
