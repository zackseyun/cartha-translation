  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: ml
  text: കത്ത് എഴുതിയ തെർത്തിയൊസ് എന്ന ഞാൻ[a] കർത്താവിൽ നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'സാധ്യത കുറവാണെങ്കിലും ഇങ്ങനെയും പരിഭാഷപ്പെടുത്താം: “കർത്താവിൽ കത്ത് എഴുതിയ തെർത്തിയൊസ് എന്ന ഞാൻ നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.” ഗ്രീക്കിലെ “കർത്താവിൽ” എന്ന പദസമുച്ചയം “എഴുതിയ” എന്നതിനോടു ചേർത്തു മനസ്സിലാക്കാം; എന്നാൽ അത് അഭിവാദനത്തെ വിശേഷിപ്പിക്കുന്നതാണു കൂടുതൽ സ്വാഭാവികം.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: കത്തിന്റെ സമാപനഭാഗത്തിലെ ആശംസയെ ആധുനികവും മാന്യവുമായ മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത അധിക ഊഷ്മളത ചേർക്കുന്നില്ല.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാം പുരുഷ ബഹുവചന കർമരൂപം മലയാളത്തിൽ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐγὼ Τέρτιος
  choice: തെർത്തിയൊസ് എന്ന ഞാൻ
  rationale: പ്രകടമായ ἐγώ എന്ന സർവനാമം തെർത്തിയൊസിന്റെ സ്വയംപരിചയപ്പെടുത്തലിന് ഊന്നൽ നൽകുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ക്രമത്തിൽ അതു നിലനിർത്തുന്നു.
- source_word: ὁ γράψας
  choice: എഴുതിയ
  rationale: കത്ത് എഴുതി രേഖപ്പെടുത്തിയ വ്യക്തിയായി തെർത്തിയൊസിനെ തിരിച്ചറിയിക്കുന്ന ഭൂതകാല കൃദന്തരൂപത്തിന്റെ അർഥം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: τὴν ἐπιστολήν
  choice: ഈ കത്ത്
  rationale: ἐπιστολή എന്നത് വായനാസൗഹൃദമായ ‘കത്ത്’ എന്നു പരിഭാഷപ്പെടുത്തി; സന്ദർഭത്തിൽ ഇപ്പോൾ വായിക്കപ്പെടുന്ന കത്തുതന്നെയാണെന്ന മലയാളത്തിലെ സ്വാഭാവിക സൂചനയ്ക്കായി ‘ഈ’ ഉപയോഗിച്ചു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: പൗലോസിന്റെ രചനകളിലെ ബന്ധപരമോ ആത്മീയ മണ്ഡലപരമോ ആയ പ്രയോഗം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ പരമ്പരാഗതവും സ്വാഭാവികവുമായ രൂപത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐν κυρίῳ ഏതിനോടാണ് ചേരുന്നത്
  choice: ‘കർത്താവിൽ’ എന്നത് പ്രധാന ക്രിയയായ ‘അഭിവാദ്യം ചെയ്യുന്നു’ എന്നതിനോടു ചേർത്തു.
  alternative: ‘കർത്താവിൽ ഈ കത്ത് എഴുതിയ തെർത്തിയൊസ് എന്ന ഞാൻ നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു’—അത് ‘എഴുതിയ’ എന്നതിനോടു ചേർക്കാം.
  rationale: വാക്യഘടനയിലും ലേഖനസമാപനത്തിലെ അഭിവാദനസന്ദർഭത്തിലും ഈ പദസമുച്ചയം അഭിവാദനത്തെ വിശേഷിപ്പിക്കുന്നതാണു കൂടുതൽ സ്വാഭാവികം. എങ്കിലും ഗ്രീക്കിൽ മറ്റൊരു ബന്ധവും വ്യാകരണപരമായി സാധ്യമായതിനാൽ അടിക്കുറിപ്പിൽ അത് സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ലേഖനശൈലി ഉപയോഗിച്ചു. ‘അഭിവാദ്യം ചെയ്യുന്നു’ എന്നത് സഭാപരമായ സന്ദർഭത്തിന് യോജിച്ചെങ്കിലും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന രൂപമാണ്. ഗ്രീക്കിലെ പദക്രമം യാന്ത്രികമായി പകർത്താതെ, സ്വയംപരിചയപ്പെടുത്തലിലെ ഊന്നലും ‘കർത്താവിൽ’ എന്നതിന്റെ യഥാർഥ അനിശ്ചിതത്വവും നിലനിർത്തി.
