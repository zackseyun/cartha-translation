revisions:
- from: എന്നാൽ ഇപ്പോൾ വെളിപ്പെടുത്തപ്പെടുകയും പ്രവാചകഗ്രന്ഥങ്ങളിലൂടെ, നിത്യനായ ദൈവത്തിന്റെ കല്പനപ്രകാരം, വിശ്വാസത്തിന്റെ അനുസരണത്തിനായി സകല ജനതകൾക്കും അറിയിക്കപ്പെടുകയും ചെയ്തിരിക്കുന്നു[a]—
