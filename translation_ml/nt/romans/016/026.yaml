source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ വെളിപ്പെട്ടും, പ്രവാചകഗ്രന്ഥങ്ങളിലൂടെ നിത്യനായ ദൈവത്തിന്റെ കല്പനപ്രകാരം വിശ്വാസത്തിന്റെ അനുസരണത്തിനായി സകല ജനതകൾക്കും അറിയിക്കപ്പെട്ടും ഇരിക്കുന്ന[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഈ വാക്യം റോമർ 16:25–27-ലെ സമാപന സ്തുതിവചനത്തിന്റെ തുടർച്ചയാണ്. അതിന്റെ സ്ഥാനത്തെയും കൈയെഴുത്തുപ്രതി തെളിവുകളെയും കുറിച്ച് റോമർ 16:25-ലെ കുറിപ്പ് കാണുക.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: വെളിപ്പെടുത്തപ്പെടുകയും
  rationale: മുമ്പ് മറഞ്ഞിരുന്ന ‘രഹസ്യം’ ഇപ്പോൾ വെളിച്ചത്തുകൊണ്ടുവന്നു എന്ന അർഥം നൽകുന്നു; 25-ാം വാക്യത്തിലെ μυστηρίου എന്നതിലേക്കാണ് ഈ കൃതന്തം തിരിഞ്ഞുനിൽക്കുന്നത്.
- source_word: γραφαῖς προφητικαῖς
  choice: പ്രവാചകഗ്രന്ഥങ്ങളിലൂടെ
  rationale: പ്രവാചകസ്വഭാവമുള്ള വിശുദ്ധലിഖിതങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികവും കൃത്യവുമായ പ്രയോഗം.
- source_word: ἐπιταγὴν
  choice: കല്പന
  rationale: ദൈവത്തിന്റെ അധികാരപൂർണമായ നിർദേശം എന്ന ആശയം വ്യക്തമായി നൽകുന്നു.
- source_word: ὑπακοὴν πίστεως
  choice: വിശ്വാസത്തിന്റെ അനുസരണം
  rationale: ഗ്രീക്കിലെ ഉദ്ദേശ്യപൂർവമായ ബന്ധവും റോമർ 1:5-ുമായുള്ള ആവർത്തനവും സംരക്ഷിക്കുന്നു; ‘വിശ്വാസത്തിൽനിന്നുള്ള അനുസരണം’ എന്നും ‘വിശ്വാസമാകുന്ന അനുസരണം’ എന്നും ഗ്രഹിക്കാവുന്ന യഥാർഥ അവ്യക്തത പരിഭാഷയിൽ തുറന്നുവെക്കുന്നു.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകൾക്കും
  rationale: യഹൂദേതരരെ മാത്രം സൂചിപ്പിക്കുന്നതായി ചുരുക്കാതെ സാർവലൗകിക വ്യാപ്തി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ὑπακοὴ πίστεως എന്ന ബന്ധത്തിന്റെ അർഥം
  choice: വിശ്വാസത്തിന്റെ അനുസരണം
  alternative: വിശ്വാസത്തിൽനിന്നുള്ള അനുസരണം
  rationale: ജനിറ്റീവ് ബന്ധം എങ്ങനെ വ്യാഖ്യാനിക്കണമെന്നത് പരിഭാഷയിൽ തീർപ്പാക്കാതെ, മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സാന്ദ്രതയും റോമർ 1:5-ലെ സമാന്തരപ്രയോഗവും കാത്തുസൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ഗ്രീക്ക് വാക്യഘടനയുടെ തുടർച്ച സൂചിപ്പിക്കാൻ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം ഉപയോഗിച്ചു; ഇത് 27-ാം വാക്യത്തിലേക്കു നീളുന്ന ഒറ്റ വാക്യത്തിന്റെ ഭാഗമാണ്. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
