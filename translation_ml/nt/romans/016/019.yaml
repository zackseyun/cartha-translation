id: ROM.16.19
reference: Romans 16:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: ml
  text: നിങ്ങളുടെ അനുസരണം എല്ലാവരുടെയും അറിവിലെത്തിയിരിക്കുന്നുവല്ലോ.[a] അതുകൊണ്ട് നിങ്ങളെക്കുറിച്ച് ഞാൻ സന്തോഷിക്കുന്നു.[b] എന്നാൽ നന്മയെ സംബന്ധിച്ച് നിങ്ങൾ ജ്ഞാനികളും തിന്മയെ സംബന്ധിച്ച് നിഷ്കളങ്കരും[c] ആയിരിക്കണമെന്നാണ് ഞാൻ ആഗ്രഹിക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “നിങ്ങളുടെ അനുസരണം എല്ലാവർക്കും അറിയപ്പെട്ടിരിക്കുന്നു.” ഗ്രീക്കിൽ അക്ഷരാർഥം: “നിങ്ങളുടെ അനുസരണം എല്ലാവരിലേക്കും എത്തിയിരിക്കുന്നു.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “നിങ്ങൾ നിമിത്തം ഞാൻ സന്തോഷിക്കുന്നു.”
    reason: lexical_alternative
  - marker: c
    text: “നിഷ്കളങ്കർ” എന്നതിന് “നിർമലർ,” “കലർപ്പില്ലാത്തവർ,” അഥവാ “കപടമില്ലാത്തവർ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: അനുസരണം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് കേൾവി മാത്രമല്ല, അനുസരണപരമായ പ്രതികരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: εἰς πάντας ἀφίκετο
  choice: എല്ലാവരിലേക്കും എത്തിയിരിക്കുന്നു
  rationale: ഗ്രീക്കിലെ ‘എത്തുക’ എന്ന രൂപകം നിലനിർത്തുകയും അവരുടെ അനുസരണം വ്യാപകമായി അറിയപ്പെട്ടുവെന്ന സന്ദർഭാർഥം സ്വാഭാവികമായി സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: നിങ്ങളെക്കുറിച്ച് ഞാൻ സന്തോഷിക്കുന്നു
  rationale: ἐπί സഹിതമുള്ള χαίρω ഇവിടെ സന്തോഷത്തിന്റെ കാരണമോ വിഷയമോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ഈ രൂപം സ്വാഭാവികവും അർഥവ്യാപ്തി നിലനിർത്തുന്നതുമാണ്.
- source_word: σοφούς
  choice: ജ്ഞാനികൾ
  rationale: നന്മയുടെ കാര്യത്തിലുള്ള പ്രായോഗിക വിവേകവും തിരിച്ചറിവും പ്രകടിപ്പിക്കുന്നു.
- source_word: εἰς τὸ ἀγαθόν
  choice: നന്മയെ സംബന്ധിച്ച്
  rationale: ജ്ഞാനം പ്രവർത്തിക്കേണ്ട വിഷയമേഖലയെ സൂചിപ്പിക്കുകയും തുടർന്നുള്ള സമാന്തര ഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀκεραίους
  choice: നിഷ്കളങ്കർ
  rationale: കലർപ്പില്ലാത്തത്, നിർമലമായത്, കപടമില്ലാത്തത് എന്നീ അർഥഛായകളോടെ തിന്മയാൽ മലിനമാകാത്ത നിലയെ സൂചിപ്പിക്കുന്നു.
- source_word: εἰς τὸ κακόν
  choice: തിന്മയെ സംബന്ധിച്ച്
  rationale: മുൻവാക്യഭാഗത്തോടുള്ള സമാന്തരത നിലനിർത്തി നിഷ്കളങ്കതയുടെ വിഷയമേഖല വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: πάντας എന്നതിന്റെ വ്യാപ്തി
  choice: ‘എല്ലാവരിലേക്കും’ എന്ന വിശാലവും വാചാടോപപരവുമായ പ്രസ്താവന നിലനിർത്തി.
  alternative: ‘എല്ലാ സഭകളിലും അറിയപ്പെട്ടിരിക്കുന്നു’ എന്ന പരിമിത വ്യാഖ്യാനം.
  rationale: മൂലപാഠം പരിധി വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ഗണിതപരമായ സർവവ്യാപകതയോ സഭകളിലേക്കുള്ള പരിമിതിയോ വിവർത്തനത്തിൽ ചേർത്തിട്ടില്ല.
- issue: σοφοὺς...ἀκεραίους എന്ന ധാർമിക വൈരുധ്യം
  choice: നന്മയെ സംബന്ധിച്ച ജ്ഞാനവും തിന്മയെ സംബന്ധിച്ച നിഷ്കളങ്കതയും സമാന്തരമായി നിലനിർത്തി.
  alternative: തിന്മയെക്കുറിച്ചുള്ള അജ്ഞതയോ നിഷ്കപടമായ ലാളിത്യമോ എന്ന വ്യാഖ്യാനം.
  rationale: വാക്യം പക്വമായ ധാർമിക വിവേകത്തെയും തിന്മയാൽ മലിനമാകാത്ത നിലയെയും ചേർത്തുപറയുന്നു; അജ്ഞത എന്ന ആശയം അനാവശ്യമായി ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ കാരണം–നിഗമന ബന്ധവും നന്മ/തിന്മ സമാന്തരതയും വ്യക്തമായി നിലനിർത്തി; വ്യാഖ്യാനപരമായ അധികവാക്കുകൾ മുഖ്യപാഠത്തിൽ ഒഴിവാക്കി.
