lexical_decisions:
- source_word: στηρίξαι
  choice: ഉറപ്പിച്ചുനിർത്താൻ
  rationale: വിശ്വാസികളെ ശക്തരാക്കുകയും സ്ഥിരതയോടെ നിലനിൽക്കാൻ ഇടയാക്കുകയും ചെയ്യുക എന്ന ആശയം ഒരുമിച്ച് നൽകുന്നു.
- source_word: τὸ κήρυγμα Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയുടെ പ്രസംഗം
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിയുടെ സ്വാഭാവികമായ അസ്പഷ്ടത—യേശു നടത്തിയ പ്രസംഗമോ യേശുവിനെക്കുറിച്ചുള്ള പ്രസംഗമോ—അനാവശ്യമായി പരിഹരിക്കാതെ നിലനിർത്തുന്നു; Χριστός എന്ന പദം പദവിനാമമായി ‘മശീഹ’ എന്നു നൽകുന്നു.
- source_word: μυστηρίου
  choice: രഹസ്യം
  rationale: മുമ്പ് മറഞ്ഞിരുന്നതും പിന്നീട് ദൈവം വെളിപ്പെടുത്തിയതുമായ സത്യത്തെ സൂചിപ്പിക്കുന്ന സന്ദർഭോചിതമായ സാധാരണ മലയാളപദം.
- source_word: σεσιγημένου
  choice: വെളിപ്പെടുത്താതെ സൂക്ഷിച്ചിരുന്ന
  rationale: അക്ഷരാർഥമായ ‘മൗനമാക്കപ്പെട്ട’ എന്നതിനെക്കാൾ ഇവിടെ രഹസ്യം മുൻകാലത്ത് അറിയിക്കപ്പെടാതെ ഇരുന്നതെന്ന സന്ദർഭാർഥം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു; perfect passive-ന്റെ തുടർച്ചയായ മുൻകാലാവസ്ഥയും സൂചിപ്പിക്കുന്നു.
- source_word: χρόνοις αἰωνίοις
  choice: ദീർഘയുഗങ്ങളോളം
  rationale: ഈ ബഹുവചന കാലപ്രയോഗം അനന്തതയെക്കാൾ ദീർഘമായ ഭൂതകാലഘട്ടങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സ്വാഭാവികമായി വിവർത്തനം ചെയ്യുന്നു.
theological_decisions:
- issue: τὸ κήρυγμα Ἰησοῦ Χριστοῦ എന്നതിലെ ഷഷ്ഠീവിഭക്തിയുടെ ബന്ധം
  choice: യേശു മശീഹയുടെ പ്രസംഗം
  alternative: യേശു മശീഹയെക്കുറിച്ചുള്ള പ്രസംഗം
  rationale: മൂലപാഠം പ്രസംഗത്തിന്റെ കർത്താവാണോ വിഷയമാണോ യേശു എന്ന് വ്യാകരണപരമായി നിർബന്ധിച്ച് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ അസ്പഷ്ടത നിലനിർത്തുന്നു.
- issue: മശീഹാരഹസ്യം വെളിപ്പെടുത്തപ്പെട്ട കാലബന്ധം
  choice: ഇപ്പോൾ വെളിപ്പെടുത്തിയതനുസരിച്ച്
  alternative: രഹസ്യത്തിന്റെ വെളിപ്പെടുത്തലനുസരിച്ച്
  rationale: തുടർന്നുള്ള വാക്യഭാഗം വെളിപ്പെടുത്തൽ ഇപ്പോഴത്തെ രക്ഷാചരിത്രഘട്ടത്തിൽ സംഭവിച്ചതായി വ്യക്തമാക്കുന്നതിനാൽ മലയാളത്തിൽ സ്വാഭാവിക ബന്ധം നൽകുന്നു; എന്നാൽ ‘ഇപ്പോൾ’ എന്ന ആശയം 25-ാം വാക്യത്തിലെ പ്രത്യേക കാലവാചകമായി കാണാതെ വാക്യഘടനയുടെ അർഥബന്ധമായി ഉപയോഗിക്കുന്നു.
