  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: ml
  text: '[a] എന്റെ സുവിശേഷത്തിനും യേശു മശീഹയുടെ പ്രസംഗത്തിനും അനുസൃതമായി നിങ്ങളെ ഉറപ്പിച്ചുനിർത്താൻ കഴിവുള്ളവന്—ദീർഘയുഗങ്ങളോളം വെളിപ്പെടുത്താതെ സൂക്ഷിക്കപ്പെട്ടിരുന്ന രഹസ്യത്തിന്റെ വെളിപ്പെടുത്തലിനൊത്തവണ്ണം—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25–27 വാക്യങ്ങളിലെ സമാപന സ്തുതിവാക്യം പുരാതന കൈയെഴുത്തുപ്രതികളിൽ വ്യത്യസ്ത സ്ഥാനങ്ങളിലാണ് കാണപ്പെടുന്നത്. ബൈസന്റൈൻ ഭൂരിപക്ഷ പാരമ്പര്യത്തിൽ ഇത് 14-ാം അധ്യായത്തിന്റെ അവസാനത്തും, ഇപ്പോൾ ലഭ്യമായതിൽ ഏറ്റവും പഴക്കമുള്ള പപ്പിറസ് പ്രതിയിൽ 15-ാം അധ്യായത്തിനുശേഷവും, പ്രധാനപ്പെട്ട നാലാം നൂറ്റാണ്ടിലെ കൈയെഴുത്തുപ്രതികളിലും ലത്തീൻ പാരമ്പര്യത്തിലും ഇവിടെ 16-ാം അധ്യായത്തിന്റെ അവസാനത്തുമാണ്. ചില പ്രതികളിൽ ഇത് ഒന്നിലധികം സ്ഥാനങ്ങളിൽ കാണപ്പെടുന്നു; ചുരുക്കം ചിലതിൽ ഇത് പൂർണമായി ഒഴിവാക്കിയിരിക്കുന്നു. മിക്ക ആധുനിക വിവർത്തനങ്ങളും പൗലോസിന്റെ ലേഖനത്തിന്റെ സമാപനമായി ഇത് ഇവിടെത്തന്നെ നിലനിർത്തുന്നു.
