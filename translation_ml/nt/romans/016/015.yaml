id: ROM.16.15
reference: Romans 16:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: ml
  text: ഫിലോലോഗൊസിനും യൂലിയയ്ക്കും[a], നേരെയൊസിനും അവന്റെ സഹോദരിക്കും, ഒലുമ്പാസിനും അവരോടുകൂടെ ഉള്ള സകല വിശുദ്ധർക്കും വന്ദനം അറിയിക്കുവിൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ഈ പേര് പുരുഷനാമമായി എടുത്താൽ ‘യൂലിയാസ്’ എന്നും വരാം; എന്നാൽ ഗ്രീക്ക് രൂപം സാധാരണയായി സ്ത്രീനാമമായ ‘യൂലിയ’ എന്നാണ് മനസ്സിലാക്കപ്പെടുന്നത്.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: വന്ദനം പറയുക
  rationale: കത്തുകളുടെ പശ്ചാത്തലത്തിൽ ആശംസ അറിയിക്കാനുള്ള ബഹുവചന ആജ്ഞയെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Φιλόλογον
  choice: ഫിലോലോഗൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നാമനിർദേശരൂപം മലയാള ലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു; വിഭക്തി വാക്യത്തിൽ ചേർത്തു.
- source_word: Ἰουλίαν
  choice: യൂലിയ
  rationale: ഈ രൂപം സാധാരണയായി സ്ത്രീനാമമായ യൂലിയയെയാണ് സൂചിപ്പിക്കുന്നത്; ചർച്ചചെയ്യപ്പെട്ട പുരുഷനാമസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Νηρέα
  choice: നേരെയൊസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമത്തിന്റെ നാമനിർദേശരൂപത്തെ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: അവന്റെ സഹോദരി
  rationale: ἀδελφή എന്നത് സഹോദരി എന്നും αὐτοῦ എന്നത് അവന്റെ എന്നും സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി; അടുത്തുള്ള നേരെയൊസിനെയാണ് സർവനാമം സൂചിപ്പിക്കുന്നത്.
- source_word: Ὀλυμπᾶν
  choice: ഒലുമ്പാസ്
  rationale: Ὀλυμπᾶς എന്ന വ്യക്തിനാമം ഗ്രീക്ക് ഉച്ചാരണത്തോട് ചേർന്ന രീതിയിൽ മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: τοὺς σὺν αὐτοῖς
  choice: അവരോടുകൂടെയുള്ളവർ
  rationale: σύν സഹവാസത്തെയോ കൂട്ടായ്മയെയോ സൂചിപ്പിക്കുന്നു; മലയാളത്തിൽ ബന്ധവാചകമായി സ്വാഭാവികമായി നൽകി.
- source_word: πάντας ἁγίους
  choice: സകല വിശുദ്ധർ
  rationale: പൗലൊസിന്റെ പ്രയോഗത്തിൽ ἅγιοι സഹവിശ്വാസികളെ സൂചിപ്പിക്കുന്നു. ‘വിശുദ്ധർ’ എന്നത് സ്ഥാപിതമായ ബൈബിൾപദം നിലനിർത്തുന്നു; πάντας എന്നതിന് ‘സകല’ നൽകി.
theological_decisions:
- issue: പൗലൊസിന്റെ അഭിവാദനപ്പട്ടികയിലെ ἅγιοι എന്ന പദം
  choice: വിശുദ്ധർ
  alternative: വിശുദ്ധജനങ്ങൾ / ദൈവത്തിന്റെ വിശുദ്ധജനം
  rationale: ഇവിടെ ഈ പദം പേരെടുത്തവരോടൊപ്പമുള്ള സഹവിശ്വാസികളെയാണ് സൂചിപ്പിക്കുന്നത്. ‘വിശുദ്ധർ’ പൗലൊസിന്റെ സഭാപരമായ പതിവുപയോഗം നിലനിർത്തുന്നു; പിന്നീട് രൂപപ്പെട്ട ഔദ്യോഗിക വിശുദ്ധപദവി എന്ന അർഥം വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: Ἰουλίαν എന്ന പേരിന്റെ ലിംഗം
  choice: യൂലിയ
  alternative: യൂലിയാസ്
  rationale: ഗ്രീക്ക് രൂപവും സാധാരണ നാമപ്രയോഗവും പരിഗണിക്കുമ്പോൾ സ്ത്രീനാമമായ യൂലിയ എന്നതാണ് ഏറ്റവും സ്വാഭാവികം. പരിഭാഷാചരിത്രത്തിൽ പുരുഷനാമസാധ്യത ചർച്ചചെയ്യപ്പെട്ടതിനാൽ അത് അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ആദരവാർന്ന മലയാളം. വ്യക്തിനാമങ്ങൾ ഗ്രീക്ക് രൂപങ്ങളിൽനിന്ന് ലിപ്യന്തരണം ചെയ്തു. ‘വന്ദനം പറയുക’ കത്തുകളിലെ അഭിവാദനനിർദേശം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു; ‘വിശുദ്ധർ’ എന്ന സ്ഥാപിത പൗലൊസീയ പദം നിലനിർത്തി.
