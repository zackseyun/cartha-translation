id: ROM.16.24
reference: Romans 16:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: ml
  text: നമ്മുടെ കർത്താവായ യേശുക്രിസ്തുവിന്റെ കൃപ നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ.[a] ആമേൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ഈ വാക്യം കാണപ്പെടുന്നു; മറ്റുചിലതിൽ ഇത് ഇല്ല. അതിനാൽ പല ആധുനിക ഗ്രീക്ക് പതിപ്പുകളും റോമർ ലേഖനത്തിന്റെ സമാപനഭാഗത്തിലെ പാഠഭേദമായി ഇതിനെ അടയാളപ്പെടുത്തുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: കൃപ
  rationale: പൗലോസിന്റെ ആശീർവാദവാക്യങ്ങളിൽ പതിവായി വരുന്ന പദം; ദൈവത്തിന്റെ സൗജന്യമായ അനുഗ്രഹവും പ്രീതിയും ഉൾക്കൊള്ളുന്ന സ്ഥാപിത മലയാളപ്രയോഗം.
- source_word: κυρίου
  choice: കർത്താവ്
  rationale: യേശുവിന്റെ അധികാരവും കർത്തൃത്വവും സൂചിപ്പിക്കുന്ന κύριος എന്ന ക്രിസ്തുശീർഷകത്തിന്റെ സ്വാഭാവികവും മാന്യവുമായ മലയാളരൂപം.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശുക്രിസ്തു
  rationale: Χριστός എന്നത് ‘അഭിഷിക്തൻ/മശീഹ’ എന്ന ശീർഷകത്തിൽ നിന്നുള്ളതാണെങ്കിലും, ഈ സ്ഥിരമായ നാമ-ശീർഷകസംയോജനത്തിന് മലയാളത്തിൽ വ്യാപകവും സ്വാഭാവികവുമായ രൂപം ‘യേശുക്രിസ്തു’ ആണ്.
- source_word: μετὰ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ
  rationale: μετάയുടെ ‘കൂടെ’ എന്ന അർഥവും πάντων ὑμῶν എന്നതിലെ മുഴുവൻ ശ്രോതാക്കളെയും ഉൾക്കൊള്ളുന്ന വ്യാപ്തിയും നിലനിർത്തുന്നു.
- source_word: Ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപാരമ്പര്യത്തിൽ പരിചിതമായ ശബ്ദാന്തരണം; ഉറപ്പിന്റെയും സമ്മതത്തിന്റെയും സമാപനപ്രയോഗം നിലനിർത്തുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്നതിലെ Χριστός എങ്ങനെ പ്രതിനിധീകരിക്കണം
  choice: യേശുക്രിസ്തു
  alternative: യേശു മശീഹ
  rationale: Χριστός ശീർഷകപരമായി ‘മശീഹ’ എന്നാണ് അർഥമെങ്കിലും, മലയാളത്തിൽ ‘യേശുക്രിസ്തു’ എന്ന സംയുക്തരൂപം അർഥപരവും സഭാപാരമ്പര്യപരവും പൊതുവായി ഗ്രഹിക്കാവുന്നതുമാണ്; ‘ക്രിസ്തു’ എന്നത് ശീർഷകസ്വഭാവം പൂർണമായി ഇല്ലാതാക്കുന്നില്ല.
- issue: ഈ വാക്യത്തിന്റെ പാഠസാന്നിധ്യം
  choice: വാക്യം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി പാഠഭേദം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു
  alternative: വാക്യം ഒഴിവാക്കുക അല്ലെങ്കിൽ ചതുരക്കൗതുകക്കുറികളിൽ നൽകുക
  rationale: നൽകിയ SBLGNT പാഠത്തിൽ വാക്യം ചിഹ്നിതമായ പാഠഭേദമായി ഉൾപ്പെട്ടിരിക്കുന്നു; അതിനാൽ വിവർത്തനം നൽകുകയും പ്രധാന കൈയെഴുത്തുപ്രതിസാക്ഷ്യത്തിലെ അനിശ്ചിതത്വം തുറന്നുപറയുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ആശീർവാദവാക്യശൈലി. ‘ഇരിക്കട്ടെ’ എന്നത് ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കാതെ വരുന്ന ആശംസയുടെ സ്വാഭാവിക മലയാളപൂരണം. പാഠഭേദ അടിക്കുറിപ്പിന്റെ ചിഹ്നം മുഖ്യപാഠത്തിൽ ചേർത്തിട്ടുണ്ട്.
