  source_fidelity: The draft accurately preserves the two greetings, Gaius as host of Paul and of the whole church, and Quartus as “the brother.” The civic title οἰκονόμος is plausibly rendered as a treasurer, but a more standard Malayalam term is preferable. The Greek forms of the personal names are better represented with short final -ൊസ് rather than -ോസ്.
