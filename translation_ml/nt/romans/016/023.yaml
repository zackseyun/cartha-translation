id: ROM.16.23
reference: Romans 16:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: ml
  text: എന്റെയും സഭ മുഴുവന്റെയും ആതിഥേയനായ ഗായൊസ് നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു. നഗരഭണ്ഡാരാധികാരിയായ[a] എരസ്തൊസും സഹോദരനായ ക്വാർത്തൊസും നിങ്ങളെ അഭിവാദ്യം ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നഗരകാര്യസ്ഥൻ.’ ഗ്രീക്ക് പദത്തിന് നഗരഭരണത്തിലെ ഒരു കാര്യനിർവാഹകനെ പൊതുവായി സൂചിപ്പിക്കാനും കഴിയും; ഇവിടെ ‘നഗരഭണ്ഡാരാധികാരി’ എന്നത് സാധ്യതയുള്ള ഔദ്യോഗിക ചുമതലയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: അഭിവാദ്യം ചെയ്യുന്നു
  rationale: പൗലോസിന്റെ ലേഖനസമാപനങ്ങളിൽ ഈ ക്രിയ ആശംസ അറിയിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നു. ‘അഭിവാദ്യം ചെയ്യുന്നു’ എന്നത് വ്യക്തിപരമായ അഭിവാദനത്തിന്റെ നേരിട്ടുള്ള ഭാവം നിലനിർത്തുന്ന സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്.
- source_word: ξένος
  choice: ആതിഥേയൻ
  rationale: ഗായോസ് കർത്താവും ‘എന്റെയും സഭ മുഴുവന്റെയും’ എന്ന ബന്ധസൂചകപ്രയോഗവും ഉള്ളതിനാൽ, ഇവിടെ ‘അപരിചിതൻ’ എന്നതല്ല, മറ്റുള്ളവരെ സ്വീകരിച്ചു പാർപ്പിക്കുന്ന വ്യക്തി എന്ന അർഥമാണ് യോജിക്കുന്നത്.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: സഭ മുഴുവൻ
  rationale: ἐκκλησία ഇവിടെ ക്രിസ്തീയ സമൂഹത്തെ സൂചിപ്പിക്കുന്നു; ὅλης എന്ന പദത്തിന്റെ വ്യാപ്തി ‘മുഴുവൻ’ എന്നു വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: οἰκονόμος τῆς πόλεως
  choice: നഗരത്തിന്റെ ഖജാൻജി
  rationale: οἰκονόμος കാര്യനിർവാഹകനെയോ കാര്യസ്ഥനെയോ സൂചിപ്പിക്കാം. നഗരഭരണസന്ദർഭത്തിൽ ധനകാര്യച്ചുമതലയുള്ള ഔദ്യോഗിക പദവിയെന്ന സാധ്യത ‘ഖജാൻജി’ വ്യക്തമായി അറിയിക്കുന്നു; വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀδελφός
  choice: സഹോദരൻ
  rationale: മൂലപാഠം പുരുഷലിംഗ ഏകവചനമാണ്; ക്വാർത്തോസ് ഒരു സഹവിശ്വാസിയാണെന്ന ബന്ധം ‘സഹോദരൻ’ സ്വാഭാവികമായി നിലനിർത്തുന്നു. മൂലത്തിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ എന്ന ഉടമസ്ഥസൂചന ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: ἐκκλησία എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഭ
  alternative: കൂട്ടായ്മ / വിശ്വാസിസമൂഹം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തിൽ ഇത് സാധാരണയായി ക്രിസ്തീയ സമൂഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘സഭ’ അധികമായ സഭാശാസ്ത്രവ്യാഖ്യാനം ചേർക്കാതെ ആ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- issue: ἀδελφός എന്ന കുടുംബബന്ധപദത്തിന്റെ ലിംഗവും ബന്ധഭാവവും
  choice: സഹോദരൻ
  alternative: സഹവിശ്വാസി / നമ്മുടെ സഹോദരൻ
  rationale: മൂലപാഠത്തിലെ പുരുഷലിംഗ ഏകവചനവും കുടുംബസദൃശമായ വിശ്വാസബന്ധവും നിലനിർത്തുന്നു. ‘സഹവിശ്വാസി’ രൂപകം മങ്ങിക്കളയും; ‘നമ്മുടെ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത വിപുലീകരണമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സുതാര്യവുമായ ലേഖനശൈലി ഉപയോഗിച്ചു. ‘എന്റെയും സഭ മുഴുവന്റെയും ആതിഥേയനായ’ എന്ന ഘടന ഗ്രീക്ക് ബന്ധക്രമം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ഇംഗ്ലീഷ് ഉപദേശപാഠത്തിൽ അടിക്കുറിപ്പിന്റെ ചിഹ്നം ‘Gaius’ എന്നതിനു പിന്നാലെ വന്നിരുന്നെങ്കിലും അടിക്കുറിപ്പ് οἰκονόμος എന്ന പദത്തെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ പ്രസക്തമായ ‘ഖജാൻജി’ എന്ന പദത്തിനു പിന്നാലെ [a] ചേർത്തു.
