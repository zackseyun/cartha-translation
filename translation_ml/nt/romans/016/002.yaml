id: ROM.16.2
reference: Romans 16:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: ml
  text: വിശുദ്ധജനങ്ങൾക്ക് യോജിക്കുന്നവിധം നിങ്ങൾ അവളെ കർത്താവിൽ സ്വീകരിക്കുകയും, നിങ്ങളുടെ സഹായം ആവശ്യമാകുന്ന ഏത് കാര്യത്തിലും അവൾക്കു തുണനിൽക്കുകയും ചെയ്യുക. കാരണം, അവൾതന്നെ പലരുടെയും—എന്റെയും—പോഷകയായിത്തീർന്നിരിക്കുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഉപകാരി,” “സഹായക,” അല്ലെങ്കിൽ “സംരക്ഷക.” ഗ്രീക്കുപദം മറ്റുള്ളവർക്ക് പിന്തുണയും വിഭവസഹായവും നൽകിയ ഒരു സ്ത്രീയെ, സാമൂഹിക അർഥത്തിൽ, സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: സ്വീകരിക്കുക
  rationale: സഭാസമൂഹത്തിലേക്ക് ഫേബെയെ അനുകൂലമായും ആതിഥ്യമര്യാദയോടെയും സ്വീകരിക്കുക എന്ന ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν κυρίῳ
  choice: കർത്താവിൽ
  rationale: ക്രിസ്തീയ കൂട്ടായ്മയുടെ ബന്ധവും മണ്ഡലവും സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ പ്രയോഗം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἀξίως τῶν ἁγίων
  choice: വിശുദ്ധജനങ്ങൾക്ക് യോജിച്ചവിധം
  rationale: ἀξίως എന്നതിന്റെ രീതിസൂചനയും ἅγιοι എന്നത് വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്നതും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പകരുന്നു.
- source_word: παραστῆτε αὐτῇ
  choice: അവൾക്കു തുണനിൽക്കുക
  rationale: ആവശ്യത്തിൽ ഒരാളുടെ പക്ഷത്തു നിന്നു സഹായിക്കുകയും പിന്തുണയ്ക്കുകയും ചെയ്യുക എന്ന സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: ഏതു കാര്യത്തിൽ അവൾക്ക് നിങ്ങളെ ആവശ്യമുണ്ടായാലും
  rationale: πρᾶγμα എന്നതിന്റെ വിശാലമായ ‘കാര്യം’ എന്ന അർഥവും χρῄζῃ ὑμῶν എന്നതിലെ അവർക്കുള്ള ആവശ്യം എന്ന ആശയവും അമിതവ്യാഖ്യാനം കൂടാതെ നൽകുന്നു.
- source_word: προστάτις
  choice: രക്ഷാധികാരി
  rationale: പലർക്കും സാമൂഹികമോ ഭൗതികമോ പ്രായോഗികമോ ആയ പിന്തുണ നൽകിയ സ്ത്രീ എന്ന ശക്തമായ അർഥം സൂക്ഷിക്കുന്നു; വെറും ‘സഹായക’ എന്നതിനെക്കാൾ മൂലപദത്തിന്റെ സ്ഥാനമാനവും പ്രവർത്തനശേഷിയും പ്രകടമാക്കുന്നു.
- source_word: ἐμοῦ αὐτοῦ
  choice: എന്റെതന്നെയും
  rationale: പൗലോസ് സ്വയം ഊന്നിപ്പറയുന്നതും καί നൽകുന്ന ‘കൂടി’ എന്ന അർഥവും സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഫേബെയെക്കുറിച്ചുള്ള προστάτις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: രക്ഷാധികാരി
  alternative: ഉപകാരി; സഹായക; സംരക്ഷക
  rationale: പദം സാധാരണ സഹായത്തെക്കാൾ ശക്തമായ, മറ്റുള്ളവർക്കുവേണ്ടി നിലകൊണ്ട് വിഭവങ്ങളും പിന്തുണയും നൽകിയ ഒരു സാമൂഹികപങ്ക് സൂചിപ്പിക്കാം. പിന്നീട് രൂപപ്പെട്ട സഭാപദവി ചേർക്കാതെയും ഫേബെയുടെ പ്രാധാന്യം കുറയ്ക്കാതെയും ‘രക്ഷാധികാരി’ ഈ സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ മാന്യവും വായിക്കാൻ എളുപ്പവുമായ ശൈലി. ‘വിശുദ്ധർ’ എന്നത് പ്രത്യേക പദവിയുള്ള കുറച്ചുപേരായി തെറ്റിദ്ധരിക്കപ്പെടാതിരിക്കാൻ ‘വിശുദ്ധജനങ്ങൾ’ ഉപയോഗിച്ചു. ദീർഘമായ ഗ്രീക്ക് വാക്യം മലയാളത്തിലെ സ്വാഭാവിക പ്രവാഹത്തിനായി രണ്ട് വാക്യങ്ങളാക്കി.
