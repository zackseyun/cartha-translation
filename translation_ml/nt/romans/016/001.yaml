id: ROM.16.1
reference: Romans 16:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: ml
  text: നമ്മുടെ സഹോദരിയും കെംക്രെയയിലെ സഭയുടെ ശുശ്രൂഷകയുമായ[a] ഫേബയെ ഞാൻ നിങ്ങൾക്കു ശുപാർശ ചെയ്യുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കെംക്രെയയിലെ സഭയുടെ ഡീക്കൻ’ എന്നും ‘കെംക്രെയയിലെ സഭയിലെ സേവിക’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ διάκονος (ദിയാക്കൊനോസ്) എന്ന പദം അംഗീകൃതമായ ഒരു സഭാശുശ്രൂഷാചുമതലയെയോ പൊതുവായി സേവിക്കുന്ന ഒരാളെയോ സൂചിപ്പിക്കാം.
    reason: διάκονος എന്ന പദത്തിലെ പദവിസൂചനയും പൊതുസേവനസൂചനയും സംരക്ഷിക്കുമ്പോൾ, ‘സഭയുടെ/സഭയിലെ’ എന്ന മൂലപാഠത്തിലെ സഭയോടുള്ള ബന്ധവും നിലനിർത്താൻ.
lexical_decisions:
- source_word: Συνίστημι
  choice: ഞാൻ നിങ്ങൾക്കു ശുപാർശ ചെയ്യുന്നു
  rationale: കത്തുകളിലെ പരിചയപ്പെടുത്തൽസന്ദർഭത്തിൽ ഈ ക്രിയ ഒരാളെ സ്വീകർത്താക്കൾക്കു അനുകൂലമായി പരിചയപ്പെടുത്തി ശുപാർശ ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ശുപാർശ ചെയ്യുന്നു’ സ്വാഭാവികവും അർഥസൂക്ഷ്മത നിലനിർത്തുന്നതുമാണ്.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, ലഘുവായ പ്രഭാഷണപരിവർത്തനമാണ്. വാക്യാരംഭത്തിൽ ‘ഇനി’ എന്നു ചേർത്താൽ മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന തോന്നാം; മലയാളത്തിലെ പുതിയ വാക്യത്തിന്റെ ഘടന തന്നെ ഈ പരിവർത്തനം സ്വാഭാവികമായി വഹിക്കുന്നു.
- source_word: Φοίβην
  choice: ഫേബയെ
  rationale: വ്യക്തിനാമം മലയാളത്തിലെ സ്വാഭാവിക ഉച്ചാരണരീതിക്കനുസരിച്ച് ലിപ്യന്തരിച്ചു; വിഭക്തിപ്രത്യയം ചേർത്ത് വാക്യത്തിലെ കർമമായി നൽകി.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: നമ്മുടെ സഹോദരി
  rationale: പൗലോസിന്റെ സഭാപരമായ കുടുംബഭാഷ നേരിട്ട് നിലനിർത്തുന്നു; ‘വിശ്വാസത്തിലെ’ എന്ന വിശദീകരണം മൂലപാഠത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οὖσαν καὶ
  choice: സഹോദരിയും … ശുശ്രൂഷകയായ
  rationale: καί-യുടെ കൂട്ടിച്ചേർക്കൽബലം മലയാളത്തിലെ ‘-യും … -യായ’ ഘടനയിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: διάκονον
  choice: ശുശ്രൂഷക
  rationale: διάκονος എന്നത് പൊതുവായ സേവനത്തെയും അംഗീകൃത സഭാശുശ്രൂഷയിലെ ചുമതലയെയും സൂചിപ്പിക്കാം. ‘ശുശ്രൂഷക’ ഈ രണ്ടിനുമിടയിലെ അർഥവ്യാപ്തി ഒരു പരിധിവരെ നിലനിർത്തുന്നു; പദവിനാമമായ ‘ഡീക്കൻ’ എന്നും പൊതുവായ ‘സേവിക’ എന്നും വായിക്കാവുന്നതാണെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῆς ἐκκλησίας
  choice: സഭയിലെ
  rationale: പൗലോസിന്റെ കത്തുകളിൽ ἐκκλησία സാധാരണയായി പ്രാദേശിക ക്രിസ്തീയ വിശ്വാസസമൂഹത്തെ സൂചിപ്പിക്കുന്നു. ‘സഭ’ ആ അർഥത്തിന് വ്യക്തവും പതിവുമായ മലയാളപ്രയോഗമാണ്.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: കെംക്രെയയിലെ
  rationale: സ്ഥലനാമം ഗ്രീക്ക് രൂപത്തെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരിച്ചു; ἐν സൂചിപ്പിക്കുന്ന സ്ഥലബന്ധം മലയാളത്തിലെ ‘-യിലെ’ എന്ന രൂപത്തിൽ സ്വാഭാവികമായി നൽകി.
theological_decisions:
- issue: διάκονον എന്നത് പൊതുവായ സേവനപദമാണോ അംഗീകൃത സഭാശുശ്രൂഷയിലെ സ്ഥാനമാണോ
  choice: പ്രധാനപാഠത്തിൽ ‘ശുശ്രൂഷക’
  alternative: ‘ഡീക്കൻ’ അല്ലെങ്കിൽ ‘സേവിക’
  rationale: ഒരു പ്രത്യേക സഭയോടുള്ള ബന്ധം ഇവിടെ പറയുന്നതിനാൽ അംഗീകൃത ശുശ്രൂഷാചുമതല എന്ന സാധ്യത ഗൗരവമായി നിലനിൽക്കുന്നു. എന്നാൽ ഈ പദം പിന്നീടുണ്ടായ ഏതെങ്കിലും സഭാവിഭാഗത്തിന്റെ ഔദ്യോഗിക സ്ഥാനഘടന നിർബന്ധമായും സൂചിപ്പിക്കുന്നു എന്നു മൂലപാഠം തീർപ്പാക്കുന്നില്ല. അതിനാൽ പ്രധാനപാഠത്തിൽ വിശാലമായ ‘ശുശ്രൂഷക’ ഉപയോഗിച്ച് മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന ഉപയോഗിച്ചു. ‘ശുശ്രൂഷക’ സഭാസന്ദർഭത്തിന് യോജിച്ചതും സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നതുമാണ്. വാക്യം അനാവശ്യമായ വ്യാഖ്യാനപദങ്ങൾ ചേർക്കാതെ സംക്ഷിപ്തമായി നിലനിർത്തി.
