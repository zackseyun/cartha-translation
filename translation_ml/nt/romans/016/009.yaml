id: ROM.16.9
reference: Romans 16:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: ml
  text: മശീഹയിൽ[a] ഞങ്ങളുടെ സഹപ്രവർത്തകനായ ഉർബാനൊസിനും എനിക്കു പ്രിയനായ സ്താഖ്യുസിനും വന്ദനം പറയുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ക്രിസ്തുവിൽ.’
    reason: Χριστός എന്ന ഗ്രീക്ക് പദത്തിന് മലയാളത്തിൽ പ്രചാരമുള്ള മറ്റൊരു പരിഭാഷ.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: വന്ദനം പറയുക
  rationale: ആശംസാപട്ടികയിലെ ബഹുവചന ആജ്ഞയെ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: Οὐρβανὸν
  choice: ഉർബാനൊസ്
  rationale: ഗ്രീക്ക് രൂപത്തെ അടിസ്ഥാനമാക്കി വ്യക്തിനാമം മലയാളലിപിയിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: συνεργὸν ἡμῶν
  choice: ഞങ്ങളുടെ സഹപ്രവർത്തകൻ
  rationale: ഒരുമിച്ചു പ്രവർത്തിക്കുന്ന പങ്കാളിയെന്ന συνεργός എന്ന പദത്തിന്റെ അർഥവും ἡμῶν എന്ന ഉടമസ്ഥബന്ധവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിൽ
  rationale: ἐν എന്ന ബന്ധപദത്തിന്റെ ഉൾബന്ധം/പ്രവർത്തനമണ്ഡലം എന്ന തുറന്ന അർഥം സൂക്ഷിക്കുകയും Χριστός ഇവിടെ പദവിയായി ഗ്രഹിക്കാവുന്നതിനാൽ ‘മശീഹ’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: Στάχυν
  choice: സ്താക്കുസ്
  rationale: ഗ്രീക്ക് വ്യക്തിനാമമായ Στάχυς-ന്റെ വിഭക്തിരഹിത രൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: ἀγαπητόν μου
  choice: എനിക്കു പ്രിയനായ
  rationale: പൗലൊസിന്റെ വ്യക്തിപരമായ സ്നേഹവും ഊഷ്മളതയും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστός-ന്റെ പരിഭാഷ
  choice: മശീഹയിൽ
  alternative: ക്രിസ്തുവിൽ
  rationale: ഈ പ്രയോഗത്തിൽ Χριστός-ന്റെ പദവിസ്വഭാവം ഇപ്പോഴും വ്യക്തമാകുന്നതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ നൽകി; സഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് എളുപ്പം മനസ്സിലാകുന്ന മാന്യവും സംക്ഷിപ്തവുമായ ആശംസാശൈലി. ഗ്രീക്കിലെ രണ്ടു കർമങ്ങളെയും ‘-നും … -നും’ എന്ന സമാന്തരഘടനയിൽ ചേർത്തിരിക്കുന്നു.
