id: ROM.16.14
reference: Romans 16:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: ml
  text: അസുങ്ക്രിതൊസിനെയും ഫ്ലെഗോനെയും ഹെർമെസിനെയും പത്രൊബാസിനെയും ഹെർമാസിനെയും അവരോടൊപ്പമുള്ള സഹോദരന്മാരെയും അഭിവാദ്യം ചെയ്യുക.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: അഭിവാദ്യം ചെയ്യുക
  rationale: കത്തിന്റെ സമാപനത്തിലെ അഭിവാദ്യപ്പട്ടികയിൽ വരുന്ന ബഹുവചന ആജ്ഞാരൂപം. ആധുനിക മാനകമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ സംക്ഷിപ്ത പ്രയോഗം.
- source_word: Ἀσύγκριτον
  choice: അസുങ്ക്രിതൊസ്
  rationale: വ്യക്തിനാമം; ഗ്രീക്ക് ഉച്ചാരണരൂപത്തെ അടിസ്ഥാനമാക്കി മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Φλέγοντα
  choice: ഫ്ലെഗോൻ
  rationale: വ്യക്തിനാമം; ഗ്രീക്ക് നാമത്തിന്റെ അടിസ്ഥാനരൂപം മലയാളത്തിൽ ലിപ്യന്തരണം ചെയ്തു.
- source_word: Ἑρμῆν
  choice: ഹെർമെസ്
  rationale: വ്യക്തിനാമം; ഇവിടെ ഗ്രീക്ക് ദേവന്റെ പരാമർശമല്ല, അഭിവാദ്യപ്പട്ടികയിലെ ഒരാളുടെ പേരാണ്.
- source_word: Πατροβᾶν
  choice: പത്രൊബാസ്
  rationale: വ്യക്തിനാമം; മൂലഭാഷയിലെ രൂപത്തെ അടുത്ത് പിന്തുടരുന്ന മലയാള ലിപ്യന്തരണം.
- source_word: Ἑρμᾶν
  choice: ഹെർമാസ്
  rationale: വ്യക്തിനാമം; തൊട്ടുമുമ്പുള്ള Ἑρμῆν എന്ന പേരിൽനിന്ന് വ്യക്തമായി വേർതിരിച്ചിരിക്കുന്നു.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: അവരോടൊപ്പമുള്ള സഹോദരന്മാർ
  rationale: σὺν αὐτοῖς എന്നത് ‘അവരോടൊപ്പം’ എന്നും, വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായ ἀδελφούς എന്നത് ‘സഹോദരന്മാർ’ എന്നും നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; സന്ദർഭം നിർബന്ധിക്കാത്തതിനാൽ ലിംഗസമാവേശപരമായ വികസനം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: സമൂഹത്തെ സൂചിപ്പിക്കുന്ന ἀδελφούς എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: സഹോദരന്മാർ
  alternative: സഹോദരീസഹോദരന്മാർ / സഹവിശ്വാസികൾ
  rationale: ഗ്രീക്ക് പദം വ്യക്തമായി പുല്ലിംഗ ബഹുവചനമാണ്. ഈ ഹ്രസ്വമായ അഭിവാദ്യത്തിൽ സമ്മിശ്രലിംഗ സമൂഹം നിർബന്ധമായി സൂചിപ്പിക്കുന്ന സന്ദർഭസൂചനയില്ലാത്തതിനാൽ മൂലരൂപം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക മാനകമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ കത്തുശൈലി. വ്യക്തിനാമങ്ങൾ ഗ്രീക്ക് മൂലരൂപങ്ങളെ അടിസ്ഥാനമാക്കി ലിപ്യന്തരണം ചെയ്തു; ‘ഹെർമെസ്’ എന്നും ‘ഹെർമാസ്’ എന്നും ഉള്ള വ്യത്യാസം നിലനിർത്തി. ഇംഗ്ലീഷ് പാഠത്തിലെ [a] അടിക്കുറിപ്പ് വാക്യത്തിലെ തെറ്റായ സ്ഥാനത്താണെന്നും അതിലെ വ്യാഖ്യാനം മുഖ്യപാഠം തന്നെയാണെന്നും കണക്കാക്കി മലയാള കരടിൽ അനാവശ്യ അടിക്കുറിപ്പ് ചേർത്തിട്ടില്ല.
