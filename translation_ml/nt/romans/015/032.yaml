id: ROM.15.32
reference: Romans 15:32
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: ml
  text: ദൈവഹിതത്താൽ ഞാൻ സന്തോഷത്തോടെ നിങ്ങളുടെ അടുക്കൽ വന്ന് നിങ്ങളോടൊപ്പം വിശ്രമം പ്രാപിക്കേണ്ടതിന്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളോടൊപ്പം ഒരുമിച്ചു നവോന്മേഷം പ്രാപിക്കേണ്ടതിന്” അല്ലെങ്കിൽ “നിങ്ങളോടൊപ്പം വിശ്രമം കണ്ടെത്തേണ്ടതിന്.” ഗ്രീക്ക് ക്രിയ പങ്കിട്ട നവോന്മേഷത്തെയോ വിശ്രമത്തെയോ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: —വേണ്ടതിന്
  rationale: മുൻവാക്യത്തിലെ അപേക്ഷയുടെ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നതിനാൽ ഗ്രീക്കിലെ ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐν χαρᾷ
  choice: സന്തോഷത്തോടെ
  rationale: വരവിനോടൊപ്പമുള്ള ഭാവമോ രീതിയോ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വന്ന്
  rationale: പ്രധാനക്രിയയ്ക്കു കീഴിലുള്ള aorist participle-നെ മലയാളത്തിലെ സ്വാഭാവിക ക്രിയാശൃംഖലയായി പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: διὰ θελήματος θεοῦ
  choice: ദൈവഹിതത്താൽ
  rationale: ദൈവത്തിന്റെ ഇഷ്ടമനുസരിച്ചും അതിന്റെ പ്രവർത്തനഫലമായും വരുന്നതെന്ന διά + genitive ഘടനയുടെ ആശയം സംക്ഷിപ്തമായി നൽകുന്നു.
- source_word: συναναπαύσωμαι
  choice: നിങ്ങളോടൊപ്പം ആശ്വാസം പ്രാപിക്കേണ്ടതിന്
  rationale: συν- സൂചിപ്പിക്കുന്ന പങ്കിട്ട അനുഭവവും ἀναπαύομαι സൂചിപ്പിക്കുന്ന വിശ്രമം/ആശ്വാസവും നിലനിർത്തുന്നു; പരസ്പരത സാധ്യതയായി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: റോമിലെ വിശ്വാസികളുമായുള്ള പൗലോസിന്റെ പ്രതീക്ഷിച്ച കൂട്ടായ്മയുടെ പരസ്പരസ്വഭാവം
  choice: നിങ്ങളോടൊപ്പം ആശ്വാസം പ്രാപിക്കുക
  alternative: നിങ്ങളും ഞാനും പരസ്പരം നവോന്മേഷം പ്രാപിക്കുക; നിങ്ങളോടൊപ്പം വിശ്രമം കണ്ടെത്തുക
  rationale: പൗലോസ് അവർക്കു ശുശ്രൂഷ നൽകുന്നതു മാത്രമല്ല, അവരോടൊപ്പമുള്ള കൂട്ടായ്മയിൽ താനും ആശ്വാസം പ്രാപിക്കുമെന്ന സംയുക്തഭാവം സംരക്ഷിക്കുന്നു; എന്നാൽ ക്രിയയിൽ പരസ്പരത എത്ര ശക്തമായി ഉൾക്കൊള്ളുന്നു എന്നത് മുഖ്യവാചകത്തിൽ അതിരുകടന്ന് നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. “ദൈവഹിതത്താൽ” എന്നത് ചുരുക്കവും പരിചിതവുമാണ്; “ആശ്വാസം പ്രാപിക്കുക” പങ്കിട്ട വിശ്രമം/നവോന്മേഷം എന്ന അർഥപരിധി സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്നവിധം നൽകുന്നു.
