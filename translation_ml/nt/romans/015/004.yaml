id: ROM.15.4
reference: Romans 15:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: ml
  text: മുമ്പേ എഴുതപ്പെട്ടതെല്ലാം നമ്മെ പഠിപ്പിക്കാനായി എഴുതപ്പെട്ടതാണ്; സഹനത്തിലൂടെയും തിരുവെഴുത്തുകളുടെ പ്രോത്സാഹനത്തിലൂടെയും[a] നമുക്കു പ്രത്യാശ ഉണ്ടായിരിക്കാനായി[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘തിരുവെഴുത്തുകളുടെ ആശ്വാസത്തിലൂടെയും’; παράκλησις എന്ന പദത്തിന് പ്രോത്സാഹനം, ആശ്വാസം, ഉദ്ബോധനം എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നാം പ്രത്യാശ പുലർത്തേണ്ടതിന്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: എല്ലാം
  rationale: ὅσα എന്ന നപുംസകലിംഗ ബഹുവചന സർവനാമത്തിന്റെ സമഗ്രമായ വ്യാപ്തി ‘മുമ്പേ എഴുതപ്പെട്ടതെല്ലാം’ എന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിൽ നിലനിർത്തുന്നു.
- source_word: προεγράφη
  choice: മുമ്പേ എഴുതപ്പെട്ട
  rationale: προ- എന്ന കാലസൂചന നിലനിർത്തി, ഇവിടെ ഉദ്ദേശിക്കുന്നത് മുൻകാലത്ത് എഴുതപ്പെട്ട തിരുവെഴുത്തുകളാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: നമ്മെ പഠിപ്പിക്കാനായി
  rationale: εἰς എന്നതിന്റെ ഉദ്ദേശ്യാർഥവും διδασκαλίαയുടെ പഠിപ്പിക്കൽ/പ്രബോധനം എന്ന ആശയവും സാധാരണക്കാർക്ക് സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐγράφη
  choice: എഴുതപ്പെട്ടതാണ്
  rationale: ഗ്രീക്കിലെ ‘എഴുതുക’ എന്ന ക്രിയയുടെ ആവർത്തനം മലയാളത്തിലും നിലനിർത്തി വാക്യത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കുന്നു.
- source_word: διὰ τῆς ὑπομονῆς
  choice: സഹനത്തിലൂടെ
  rationale: ὑπομονή പ്രതികൂലതകളിൽ ഉറച്ചുനിൽക്കുന്ന ക്ഷമാപൂർവമായ സഹനത്തെ സൂചിപ്പിക്കുന്നു; ‘സഹനം’ സംക്ഷിപ്തവും പരിചിതവുമാണ്.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: തിരുവെഴുത്തുകളിൽനിന്നുള്ള പ്രോത്സാഹനത്തിലൂടെ
  rationale: παράκλησις നൽകുന്ന ശക്തിപ്പെടുത്തൽ ‘പ്രോത്സാഹനം’ എന്നു പരിഭാഷപ്പെടുത്തി; τῶν γραφῶν അതിന്റെ ഉറവിടമെന്ന നിലയിൽ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു, അതേസമയം മറ്റു അർഥസാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τῶν γραφῶν
  choice: തിരുവെഴുത്തുകൾ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ γραφαί വിശുദ്ധലിഖിതങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാള ബൈബിൾ പ്രയോഗത്തിൽ ‘തിരുവെഴുത്തുകൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്.
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: നാം പ്രത്യാശ പുലർത്തേണ്ടതിന്
  rationale: ‘പ്രത്യാശ ഉണ്ടായിരിക്കുക’ എന്ന ഗ്രീക്ക് ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ἵναയോടുകൂടിയ വർത്തമാനകാല വിധിലിംഗത്തിന്റെ ഉദ്ദേശ്യഭാവം ‘വേണ്ടതിന്’ വഴി നിലനിർത്തുന്നു.
theological_decisions:
- issue: പ്രത്യാശ ഉളവാക്കുന്നതിൽ തിരുവെഴുത്തുകളുടെ പങ്ക്
  choice: ‘തിരുവെഴുത്തുകളിൽനിന്നുള്ള പ്രോത്സാഹനം’ എന്ന് പരിഭാഷപ്പെടുത്തി, തിരുവെഴുത്തുകൾ പ്രോത്സാഹനത്തിന്റെ ഉറവിടമാണെന്ന നേരിട്ടുള്ള ബന്ധം നിലനിർത്തി.
  alternative: സഹനവും പ്രോത്സാഹനവും രണ്ടും തിരുവെഴുത്തുകൾ നൽകുന്നതായി വാക്യഘടന വികസിപ്പിക്കാം.
  rationale: ഗ്രീക്കിൽ τῶν γραφῶν നേരിട്ട് παρακλήσεως-നോടാണ് ചേർന്നുനിൽക്കുന്നത്. അതിനാൽ സഹനവും തിരുവെഴുത്തുകളും തമ്മിലുള്ള ബന്ധം വിവർത്തനത്തിൽ നിർബന്ധമായി വിശദീകരിക്കാതെ മൂലപാഠത്തിലെ പരിധിയും തുറന്ന നിലയും സംരക്ഷിക്കുന്നു.
- issue: ἵνα ... ἔχωμεν എന്നതിലെ ഉദ്ദേശ്യവും സാധ്യതാഭാവവും
  choice: ‘നാം പ്രത്യാശ പുലർത്തേണ്ടതിന്’
  alternative: ‘നമുക്കു പ്രത്യാശ ഉണ്ടായിരിക്കാനായി’
  rationale: പ്രധാന പരിഭാഷ ഉദ്ദേശ്യഭാവം വ്യക്തമാക്കുന്നു; ഇത് നൈതിക കല്പനയായി മാത്രം വായിക്കപ്പെടാതിരിക്കാനായി കൂടുതൽ സാധ്യതാഭാവമുള്ള രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി സ്വീകരിച്ചു. ‘മുമ്പേ എഴുതപ്പെട്ടതെല്ലാം ... എഴുതപ്പെട്ടതാണ്’ എന്ന ആവർത്തനം മൂലപാഠത്തിന്റെ വാക്ചാതുര്യം സംരക്ഷിക്കുന്നു. ‘തിരുവെഴുത്തുകൾ’, ‘സഹനം’, ‘പ്രത്യാശ’ എന്നീ പരിചിതമായ ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, διδασκαλίαയെ കൂടുതൽ സ്വാഭാവികമായി ‘നമ്മെ പഠിപ്പിക്കാനായി’ എന്നു നൽകി.
