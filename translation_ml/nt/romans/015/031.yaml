id: ROM.15.31
reference: Romans 15:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: ml
  text: യെഹൂദ്യയിലെ അനുസരിക്കാത്തവരിൽനിന്ന് ഞാൻ വിടുവിക്കപ്പെടാനും[a] യെരൂശലേമിനുവേണ്ടിയുള്ള എന്റെ ശുശ്രൂഷ വിശുദ്ധർക്ക് സ്വീകാര്യമായിത്തീരാനും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “യെഹൂദ്യയിലെ അവിശ്വസിക്കുന്നവരിൽനിന്ന് ഞാൻ വിടുവിക്കപ്പെടാനും.” ഗ്രീക്ക് പദത്തിന് വിശ്വസിക്കാൻ വിസമ്മതിക്കുക എന്നും അതിനാൽ അനുസരിക്കാതിരിക്കുക എന്നും അർഥമാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: …വാനും …വാനും
  rationale: പ്രാർഥനാഭ്യർഥനയുടെ രണ്ട് സമന്വിത ഉദ്ദേശ്യങ്ങൾ മലയാളത്തിൽ സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ῥυσθῶ
  choice: ഞാൻ വിടുവിക്കപ്പെടാൻ
  rationale: അപകടത്തിൽനിന്നുള്ള രക്ഷയെ സൂചിപ്പിക്കുന്ന നിഷ്ക്രിയ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: അനുസരിക്കാത്തവരിൽനിന്ന്
  rationale: അവിശ്വാസവും അനുസരണക്കേടും ഉൾക്കൊള്ളാവുന്ന പദത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു; മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: യെഹൂദ്യയിലെ
  rationale: സ്ഥലസൂചന സ്വാഭാവികമായ മലയാളരൂപത്തിൽ നൽകുന്നു.
- source_word: διακονία
  choice: ശുശ്രൂഷ
  rationale: പൗലോസ് യെരൂശലേമിലേക്കു കൊണ്ടുപോകുന്ന സഹായവുമായി ബന്ധപ്പെട്ട സേവനത്തെ സൂചിപ്പിക്കുന്നു; വെറും ധനസഹായമായി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: യെരൂശലേമിനുവേണ്ടിയുള്ള
  rationale: ശുശ്രൂഷയുടെ ലക്ഷ്യവും ദിശയും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: εὐπρόσδεκτος
  choice: സ്വീകാര്യമായിത്തീരാൻ
  rationale: അനുകൂലമായി സ്വീകരിക്കപ്പെടുക എന്ന വിലയിരുത്തൽഭാവവും γένηται-യുടെ സംഭവിച്ചുവരുന്ന ഭാവവും ചേർത്ത് നൽകുന്നു.
- source_word: τοῖς ἁγίοις
  choice: വിശുദ്ധർക്ക്
  rationale: വിശ്വാസികളെക്കുറിച്ചുള്ള പൗലോസിന്റെ പതിവ് വിശേഷണം അതിന്റെ ദൈവശാസ്ത്രപരമായ ഭാരം നിലനിർത്തി നൽകുന്നു.
- source_word: γένηται
  choice: ആയിത്തീരാൻ
  rationale: വെറും നിലനിൽപ്പിനേക്കാൾ ‘അങ്ങനെ ആയിവരുക’ എന്ന γίνομαι-യുടെ ചലനാത്മക ഭാവം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀπειθούντων എന്ന പദം യെഹൂദ്യയിലെ എതിർപ്പുകാരെ സംബന്ധിച്ച് സൂചിപ്പിക്കുന്നത്
  choice: അനുസരിക്കാത്തവർ
  alternative: അവിശ്വസിക്കുന്നവർ
  rationale: ഗ്രീക്ക് പദത്തിന് വിശ്വസിക്കാൻ വിസമ്മതിക്കുക എന്നും അതിലൂടെ അനുസരിക്കാതിരിക്കുക എന്നും അർഥമാകാം. പ്രധാനപാഠം വിശാലമായ അർഥം നിലനിർത്തുന്നു; സാധുവായ മറ്റൊരു വായന അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. വാക്യം മുൻവാക്യത്തിൽ ആരംഭിച്ച പ്രാർഥനാഭ്യർഥനയുടെ ആശ്രിതഘടകമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. ‘ശുശ്രൂഷ’, ‘വിശുദ്ധർ’ എന്നീ പൗലോസീയ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് പരിചിതമായ സഭാഭാഷയുടെ പരിധിയിൽ സൂക്ഷിച്ചു.
