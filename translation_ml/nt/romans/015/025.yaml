id: ROM.15.25
reference: Romans 15:25
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ ഞാൻ വിശുദ്ധരെ സേവിക്കാനായി യെരൂശലേമിലേക്കു പോകുകയാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘വിശുദ്ധരെ സേവിച്ചുകൊണ്ട്’ എന്നും പരിഭാഷപ്പെടുത്താം. διακονῶν എന്ന പദത്തിന് പ്രായോഗികമായി സേവിക്കുക എന്ന അർഥമുണ്ട്; ഇവിടെ യെരൂശലേമിലെ വിശ്വാസികൾക്കായി ശേഖരിച്ച സംഭാവന എത്തിക്കുന്നതിനെ ഇത് സൂചിപ്പിക്കുന്നതായിരിക്കാം (റോമർ 15:26 കാണുക).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: νυνί ഇപ്പോഴത്തെ സമയത്തെ ഊന്നിപ്പറയുന്നു; δέ സന്ദർഭത്തിലെ മൃദുവായ വൈരുധ്യവും തുടർച്ചയും സൂചിപ്പിക്കുന്നു. ‘എന്നാൽ ഇപ്പോൾ’ രണ്ടും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: πορεύομαι
  choice: ഞാൻ ... പോകുകയാണ്
  rationale: വർത്തമാനകാലരൂപം ഇപ്പോഴത്തെ യാത്രയെയോ ഉറച്ച യാത്രാഭിപ്രായത്തെയോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘പോകുകയാണ്’ നേരിട്ടും സ്വാഭാവികവുമാണ്.
- source_word: εἰς Ἰερουσαλὴμ
  choice: യെരൂശലേമിലേക്കു
  rationale: εἰς ഇവിടെ യാത്രയുടെ ലക്ഷ്യസ്ഥാനം സൂചിപ്പിക്കുന്നു; ദിശാസൂചകമായ ‘-ലേക്കു’ അതിനെ കൃത്യമായി നൽകുന്നു.
- source_word: διακονῶν
  choice: സേവിക്കാനായി
  rationale: ഈ വർത്തമാന കർത്തൃവാചക കൃദന്തരൂപം യാത്രയുടെ ഉദ്ദേശ്യമോ അനുബന്ധ സാഹചര്യമോ സൂചിപ്പിക്കാം. അടുത്ത വാക്യത്തിലെ ധനസഹായസന്ദർഭത്തോടു ചേർന്ന് പ്രായോഗിക സേവനമാണ് ഉദ്ദേശ്യമെങ്കിലും, ‘സേവിക്കാനായി’ പദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
- source_word: τοῖς ἁγίοις
  choice: വിശുദ്ധരെ
  rationale: പൗലൊസിന്റെ പ്രയോഗത്തിൽ οἱ ἅγιοι വിശ്വാസിസമൂഹത്തെ സൂചിപ്പിക്കുന്ന പതിവുപദമാണ്. ‘വിശുദ്ധർ’ ഉറവിടത്തിലെ സഭാസംബന്ധമായ പദപ്രയോഗം വ്യാഖ്യാനപരമായി വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘വിശുദ്ധർ’ ആരെ സൂചിപ്പിക്കുന്നു
  choice: മുഖ്യവാചകത്തിൽ ‘വിശുദ്ധർ’ എന്ന ഉറവിടപദം നിലനിർത്തി; സന്ദർഭത്തിൽ യെരൂശലേമിലെ വിശ്വാസികളെയാണ് സൂചിപ്പിക്കുന്നത്
  alternative: ‘യെരൂശലേമിലെ ദരിദ്രരായ വിശ്വാസികൾ’ എന്നു വ്യക്തമായി വികസിപ്പിക്കുക
  rationale: 15:26 പ്രകാരം പ്രത്യേകിച്ച് അവിടത്തെ ദരിദ്ര വിശ്വാസികൾക്കായുള്ള സംഭാവനയാണ് പശ്ചാത്തലം. എങ്കിലും 15:25 തന്നെ ‘വിശുദ്ധർ’ എന്നു മാത്രമാണ് പറയുന്നത്; അതിനാൽ സന്ദർഭവിവരം മുഖ്യവാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: διακονῶν എന്നതിന്റെ ബന്ധം
  choice: യാത്രയുടെ ഉദ്ദേശ്യമായി ‘സേവിക്കാനായി’
  alternative: അനുബന്ധപ്രവർത്തിയായി ‘സേവിച്ചുകൊണ്ട്’
  rationale: ഗ്രീക്ക് കൃദന്തം ഉദ്ദേശ്യമോ അനുബന്ധ സാഹചര്യമോ ആയി ഗ്രഹിക്കാം. ഇവിടെ യാത്ര യെരൂശലേമിലെ വിശ്വാസികൾക്കുള്ള സഹായവുമായി ബന്ധപ്പെട്ടതിനാൽ ഉദ്ദേശ്യപ്രയോഗം സ്വാഭാവികമാണ്; അടിക്കുറിപ്പ് സേവനത്തിന്റെ പ്രത്യേക സ്വഭാവവും പകരം വായനയും സൂചിപ്പിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ശുശ്രൂഷ’ എന്ന സഭാപരമായി സങ്കുചിതമായി കേൾക്കാവുന്ന പദത്തിനു പകരം സാധാരണക്കാർക്ക് വ്യക്തമായ ‘സേവിക്കുക’ ഉപയോഗിച്ചു; ‘വിശുദ്ധർ’ എന്ന പൗലൊസിന്റെ സമൂഹനാമം നിലനിർത്തി.
