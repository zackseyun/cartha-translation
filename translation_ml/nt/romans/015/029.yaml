id: ROM.15.29
reference: Romans 15:29
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: ml
  text: നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ മശീഹായുടെ അനുഗ്രഹത്തിന്റെ പൂർണതയോടെ ഞാൻ വരുമെന്ന് എനിക്കറിയാം.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ക്രിസ്തുവിന്റെ അനുഗ്രഹത്തിന്റെ പൂർണതയോടെ.”
    reason: Χριστοῦ എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന് മലയാളത്തിൽ പ്രചാരത്തിലുള്ള ‘ക്രിസ്തു’ എന്ന പര്യായരൂപം.
lexical_decisions:
- source_word: οἶδα
  choice: എനിക്കറിയാം
  rationale: പൗലോസിന്റെ ഉറച്ച അറിവും ആത്മവിശ്വാസവും നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; വെറും അഭിപ്രായമായി മയപ്പെടുത്തുന്നില്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ നേരിയ ആശയബന്ധമാണ് സൂചിപ്പിക്കുന്നത്. മലയാളത്തിലെ വാക്യപ്രവാഹത്തിൽ പ്രത്യേക സംയോജകപദം ചേർക്കാതെയും ആ ബന്ധം സ്വാഭാവികമായി നിലനിൽക്കുന്നു; ‘എന്നാൽ’ എന്നു നൽകിയാൽ മൂലത്തിലുള്ളതിലധികം വൈരുധ്യം തോന്നാം.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വരുമ്പോൾ
  rationale: ഭാവികാല പ്രധാനക്രിയയോടുള്ള കൃതന്തത്തിന്റെ കാലസംബന്ധം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐλεύσομαι
  choice: ഞാൻ വരും
  rationale: ἔρχομαι എന്ന ക്രിയയുടെ ഭാവികാല അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: ἐν πληρώματι
  choice: പൂർണതയോടെ
  rationale: ἐν എന്നതിന്റെ രീതി/അനുബന്ധസാഹചര്യ അർഥവും πλήρωμα സൂചിപ്പിക്കുന്ന സമൃദ്ധിയും സമ്പൂർണതയും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: εὐλογίας
  choice: അനുഗ്രഹത്തിന്റെ
  rationale: πλήρωμα എന്നതിനോടുള്ള ജനിറ്റീവ് ബന്ധം നിലനിർത്തി, ആ പൂർണതയെ നിർവചിക്കുന്നത് അനുഗ്രഹമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: Χριστοῦ
  choice: മശീഹായുടെ
  rationale: Χριστός ഇവിടെ അഭിഷിക്തനായവനെ സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം ‘മശീഹാ’ എന്നു നൽകുന്നു; പേരുപോലെ മാത്രം ലിപ്യന്തരണം ചെയ്യുന്നില്ല.
theological_decisions:
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹായുടെ
  alternative: ക്രിസ്തുവിന്റെ
  rationale: സന്ദർഭത്തിൽ Χριστός ഒരു ക്രിസ്തുശാസ്ത്രപരമായ സ്ഥാനപ്പേരാണ്. ‘മശീഹാ’ അതിന്റെ സ്ഥാനപ്പേർസ്വഭാവം തുറന്നുകാട്ടുന്നു; മലയാളസഭാപാരമ്പര്യത്തിൽ പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ പര്യായമായി നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ ആവർത്തനമായ ‘വരുമ്പോൾ … വരും’ നിലനിർത്തിയെങ്കിലും മലയാളത്തിൽ സ്വാഭാവികമാകുന്ന വാക്യക്രമം ഉപയോഗിച്ചു.
