id: ROM.15.7
reference: Romans 15:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: ml
  text: അതുകൊണ്ട്, മശീഹ നിങ്ങളെ സ്വീകരിച്ചതുപോലെ നിങ്ങളും പരസ്പരം സ്വീകരിക്കുക—ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: προσλαμβάνεσθε / προσελάβετο
  choice: സ്വീകരിക്കുക / സ്വീകരിച്ചു
  rationale: ഇരുരൂപങ്ങൾക്കുമിടയിലെ പൗലോസിന്റെ ഉദ്ദേശ്യപൂർവമായ പദസാമ്യം നിലനിർത്തുന്നു; സഭാസമൂഹത്തിൽ ഒരാളെ ഉൾക്കൊള്ളുന്ന ബന്ധപരമായ സ്വീകരണവും വ്യക്തമാക്കുന്നു.
- source_word: ἀλλήλους
  choice: പരസ്പരം
  rationale: പരസ്പരതയുടെ അർഥം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: καθὼς καὶ
  choice: '...അതുപോലെ ...യും'
  rationale: താരതമ്യവും καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: ὁ Χριστὸς
  choice: മശീഹ
  rationale: നിശ്ചയോപപദത്തോടുകൂടിയ Χριστός ഇവിടെ അഭിഷിക്തൻ എന്ന പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ യഹൂദ-മശീഹീയ അർഥം നിലനിർത്തുന്നു.
- source_word: ὑμᾶς
  choice: നിങ്ങളെ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന കർമത്തെ നേരിട്ട് പ്രതിനിധീകരിക്കുന്നു.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി
  rationale: εἰς സൂചിപ്പിക്കാവുന്ന ലക്ഷ്യഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; മഹത്ത്വത്തിലേക്ക്/മഹത്ത്വം ഫലമായി എന്ന സാധ്യത അതിരുകടന്ന് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദവിയുടെ ഭാവം പ്രകടമായതിനാൽ ‘മശീഹ’ തിരഞ്ഞെടുത്തു; ഇത് ക്രിസ്തുശാസ്ത്രപരമായ അധിക വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: προσλαμβάνομαι എന്നതിന്റെ സഭാസമൂഹപരമായ സൂക്ഷ്മത
  choice: സ്വീകരിക്കുക
  alternative: സ്വാഗതം ചെയ്യുക / കൈക്കൊള്ളുക
  rationale: ശക്തരും ദുർബലരും ഉൾപ്പെടുന്ന വിശ്വാസിസമൂഹത്തിലെ പരസ്പര ഉൾക്കൊള്ളൽ സൂചിപ്പിക്കുമ്പോഴും, മലയാളത്തിൽ കൃത്രിമമായ ഊഷ്മളതയോ വെറും ആതിഥേയത്വമോ മാത്രം ചുമത്തുന്നില്ല.
- issue: εἰς δόξαν τοῦ θεοῦ എന്നതിലെ ലക്ഷ്യം/ഫലം
  choice: ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി
  alternative: ദൈവത്തിന്റെ മഹത്ത്വത്തിലേക്ക് / ദൈവത്തിനു മഹത്ത്വം ഉണ്ടാകേണ്ടതിന്
  rationale: ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കാവുന്ന εἰς എന്നതിന്റെ പരിധിക്കുള്ളിൽ സ്വാഭാവികമായി നിൽക്കുന്നു; കാരണബന്ധം അനാവശ്യമായി വിശദീകരിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിത ക്രിയയുടെ സമാന്തരത നിലനിർത്താൻ ‘സ്വീകരിക്കുക/സ്വീകരിച്ചു’ ഉപയോഗിച്ചു; സാധാരണ വായനക്കാർക്ക് അപരിചിതമല്ലാത്ത ‘മശീഹ’ പദവി സ്വീകരിച്ചു.
