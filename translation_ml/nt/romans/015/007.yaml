  source_fidelity: The Malayalam accurately represents the inferential Διὸ ('അതുകൊണ്ട്'), the reciprocal imperative ('പരസ്പരം സ്വീകരിക്കുക'), the comparison with the Messiah's reception of the readers, and the purposive/resultative εἰς δόξαν τοῦ θεοῦ ('ദൈവത്തിന്റെ മഹത്ത്വത്തിനായി'). The repeated use of സ്വീകരിക്കുക/സ്വീകരിച്ചു appropriately preserves the Greek verbal parallel. The Malayalam clause order is idiomatic and does not alter the source meaning.
