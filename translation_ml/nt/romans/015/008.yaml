  to: എന്തെന്നാൽ, പിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദാനങ്ങൾ ഉറപ്പിക്കേണ്ടതിന്, ദൈവത്തിന്റെ സത്യത്തിനുവേണ്ടി[a] മശീഹ പരിച്ഛേദനയേറ്റവർക്കു ശുശ്രൂഷകനായിത്തീർന്നിരിക്കുന്നു എന്നു ഞാൻ പറയുന്നു.
  rationale: പരിച്ഛേദനയുമായി ബന്ധപ്പെട്ട genitive-ന്റെ അർഥം മലയാളത്തിൽ തെറ്റായി ഉടമസ്ഥബന്ധമായി വായിക്കപ്പെടാതിരിക്കാനായി ‘പരിച്ഛേദനയേറ്റവരുടെ ശുശ്രൂഷകൻ’ എന്നത് ‘പരിച്ഛേദനയേറ്റവർക്കു ശുശ്രൂഷകനായി’ എന്നു പരിഷ്കരിച്ചു. ഇതിലൂടെ സേവനത്തിന്റെ ലക്ഷ്യജനത്തെ വ്യക്തമാക്കുന്നു; മറ്റ് എല്ലാ വിവർത്തനതീരുമാനങ്ങളും നിലനിർത്തിയിരിക്കുന്നു.
