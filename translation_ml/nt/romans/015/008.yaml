id: ROM.15.8
reference: Romans 15:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: ml
  text: എന്തെന്നാൽ, പിതാക്കന്മാർക്കു നൽകിയ വാഗ്ദാനങ്ങൾ ഉറപ്പിക്കേണ്ടതിന്, ദൈവത്തിന്റെ സത്യത്തിനുവേണ്ടി[a] മശീഹ പരിച്ഛേദനയേറ്റവർക്കു ശുശ്രൂഷകനായിത്തീർന്നിരിക്കുന്നു എന്നു ഞാൻ പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവത്തിന്റെ സത്യസന്ധതയ്ക്കുവേണ്ടി.” പിതാക്കന്മാർക്കു നൽകിയ ഉടമ്പടിവാഗ്ദാനങ്ങൾ ദൈവം വിശ്വസ്തതയോടെ പാലിക്കുന്നതിനെ ഇത് ഊന്നിപ്പറയുന്നു.
    reason: ἀλήθεια θεοῦ എന്നത് ‘ദൈവത്തിന്റെ സത്യം’ എന്നും ‘ദൈവത്തിന്റെ സത്യസന്ധത/വിശ്വസ്തത’ എന്നും മനസ്സിലാക്കാവുന്ന lexical alternative ആണ്.
lexical_decisions:
- source_word: λέγω γὰρ
  choice: എന്തെന്നാൽ ... എന്നു ഞാൻ പറയുന്നു
  rationale: γάρ മുൻവാക്യങ്ങളോടുള്ള വിശദീകരണബന്ധം സൂചിപ്പിക്കുന്നതിനാൽ ‘എന്തെന്നാൽ’ ഉപയോഗിച്ചു; λέγω എന്നതിന്റെ നേരിട്ടുള്ള അർഥം ‘ഞാൻ പറയുന്നു’ എന്നു നിലനിർത്തി.
- source_word: Χριστόν
  choice: മശീഹ
  rationale: ഇസ്രായേൽ, പരിച്ഛേദനം, പിതാക്കന്മാർക്കുള്ള വാഗ്ദാനങ്ങൾ എന്നിവയാണ് സന്ദർഭം; അതിനാൽ Χριστός ഇവിടെ നാമസദൃശമായ ‘ക്രിസ്തു’ എന്നതിലുപരി സ്ഥാനപ്പേരായ ‘മശീഹ’യായി അവതരിപ്പിച്ചു.
- source_word: διάκονον
  choice: ശുശ്രൂഷകൻ
  rationale: നിയോഗിക്കപ്പെട്ട സേവനമാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘ശുശ്രൂഷകൻ’ സ്വാഭാവികവും മാന്യവുമായ മലയാളമാണ്; സഭയിലെ പിൽക്കാല ഔദ്യോഗിക പദവിയായ ‘ഡീക്കൻ’ എന്ന അർഥം ഇതിൽ അനാവശ്യമായി ചേർക്കുന്നില്ല.
- source_word: γεγενῆσθαι
  choice: ആയിത്തീർന്നിരിക്കുന്നു
  rationale: γίνομαι എന്നതിന്റെ perfect infinitive, ആയിത്തീർന്നതിന്റെ ഇപ്പോഴും നിലനിൽക്കുന്ന ഫലം സൂചിപ്പിക്കുന്നു; ‘ആയിത്തീർന്നിരിക്കുന്നു’ ആ ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: περιτομῆς
  choice: പരിച്ഛേദനയേറ്റവരുടെ
  rationale: ജനവിഭാഗത്തെ, അതായത് യഹൂദരെ, സൂചിപ്പിക്കുന്ന genitive ആണ്. ‘പരിച്ഛേദനയേറ്റവരുടെ ശുശ്രൂഷകൻ’ മൂലഘടന നിലനിർത്തുകയും മലയാളത്തിൽ അർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: ദൈവത്തിന്റെ സത്യത്തിനുവേണ്ടി
  rationale: ὑπέρ ലക്ഷ്യം/പ്രയോജനം സൂചിപ്പിക്കുന്നു. ἀλήθεια θεοῦ എന്നതിലെ ‘സത്യം’ എന്ന വിശാല അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തി; ദൈവത്തിന്റെ വിശ്വസ്തത എന്ന സന്ദർഭോചിതമായ ന്യൂനൻസ് അടിക്കുറിപ്പിൽ നൽകി.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: ഉറപ്പിക്കേണ്ടതിന്
  rationale: ഈ ഘടന ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; βεβαιόω വാഗ്ദാനങ്ങളെ ദൃഢീകരിക്കുക/സ്ഥിരീകരിക്കുക എന്ന അർഥത്തിൽ ‘ഉറപ്പിക്കുക’ എന്നു സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: τὰς ἐπαγγελίας
  choice: വാഗ്ദാനങ്ങൾ
  rationale: പൗലോസിന്റെ ഉടമ്പടിസന്ദർഭത്തിൽ ἐπαγγελίαι എന്നതിന്റെ സാധാരണയും വ്യക്തവുമായ മലയാളരൂപം.
- source_word: τῶν πατέρων
  choice: പിതാക്കന്മാർക്കു നൽകിയ
  rationale: വാഗ്ദാനങ്ങളുടെ സ്വീകർത്താക്കളായ ഇസ്രായേലിന്റെ പൂർവപിതാക്കന്മാരെയാണ് genitive സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ബന്ധം വ്യക്തവും സ്വാഭാവികവുമാക്കാൻ ‘പിതാക്കന്മാർക്കു നൽകിയ’ എന്നു പറഞ്ഞു.
theological_decisions:
- issue: Χριστός എന്നതിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇസ്രായേലിന്റെ രക്ഷാചരിത്രവും പരിച്ഛേദനയും പിതാക്കന്മാർക്കുള്ള വാഗ്ദാനങ്ങളും മുൻനിൽക്കുന്ന ഈ സന്ദർഭത്തിൽ Χριστός സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- issue: ἀλήθεια θεοῦ എന്നതിന്റെ ന്യൂനൻസ്
  choice: ദൈവത്തിന്റെ സത്യം
  alternative: ദൈവത്തിന്റെ സത്യസന്ധത / വിശ്വസ്തത
  rationale: പദസമുച്ചയം വിശാലമായി ദൈവത്തിന്റെ സത്യത്തെയും പ്രത്യേകിച്ച് വാഗ്ദാനങ്ങൾ പാലിക്കുന്ന അവിടുത്തെ വിശ്വസ്തതയെയും സൂചിപ്പിക്കാം. മുഖ്യവാചകത്തിൽ വിശാലത നിലനിർത്തി, ഉടമ്പടിവിശ്വസ്തതയുടെ ശക്തമായ സന്ദർഭന്യൂനൻസ് അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: περιτομῆς എന്ന genitive-ന്റെ ബന്ധം
  choice: പരിച്ഛേദനയേറ്റവരുടെ ശുശ്രൂഷകൻ
  alternative: പരിച്ഛേദനയേറ്റവർക്കുള്ള ശുശ്രൂഷകൻ
  rationale: മൂലത്തിലെ genitive ബന്ധം മുഖ്യവാചകത്തിൽ നിലനിർത്തി. സന്ദർഭത്തിൽ ഇത് പരിച്ഛേദനയേറ്റ ജനത്തിനുവേണ്ടിയുള്ള സേവനത്തെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ലക്ഷ്യബന്ധം മാത്രം ചേർത്ത് മൂലത്തിലെ വിശാലത ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും വായനാസൗകര്യമുള്ളതുമായ ശൈലി. ‘പരിച്ഛേദനയേറ്റവർ’, ‘ശുശ്രൂഷകൻ’, ‘പിതാക്കന്മാർ’ എന്നീ പദങ്ങൾ രക്ഷാചരിത്രപരമായ കൃത്യത നിലനിർത്തുന്നു; വാക്യക്രമം മലയാളത്തിലെ സ്വാഭാവിക ഉദ്ദേശ്യഘടനയ്ക്കനുസരിച്ച് ക്രമപ്പെടുത്തി.
