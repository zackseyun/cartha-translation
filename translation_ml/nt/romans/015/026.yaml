  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: ml
  text: എന്തെന്നാൽ, മക്കെദോന്യയും അഖായയും യെരൂശലേമിലെ വിശുദ്ധന്മാരിൽപ്പെട്ട ദരിദ്രർക്കുവേണ്ടി ഒരു സംഭാവന നൽകാൻ സന്തോഷപൂർവം തീരുമാനിച്ചു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു പങ്കിടൽ നടത്താൻ.” ഭൗതികസഹായത്തിലൂടെ പ്രകടമാകുന്ന കൂട്ടായ്മയ്ക്കും പങ്കാളിത്തത്തിനും ഗ്രീക്ക് പ്രയോഗം ഊന്നൽ നൽകുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: സന്തോഷത്തോടെ തീരുമാനിച്ചിരിക്കുന്നു
  rationale: ക്രിയയിലെ അനുകൂല മനോഭാവവും സ്വമേധയായുള്ള തീരുമാനവും സ്വാഭാവിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു. സന്ദർഭത്തിൽ പൂർത്തിയായ തീരുമാനം ഇപ്പോഴത്തെ യാത്രാപദ്ധതിയുമായി ബന്ധപ്പെട്ടതിനാൽ പൂർണവർത്തമാനരൂപം യോജിക്കുന്നു.
- source_word: γὰρ
  choice: (പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല)
  rationale: ഈ ഒറ്റവാക്യത്തിന്റെ മുൻസന്ദർഭം നൽകപ്പെട്ടിട്ടില്ലാത്തതിനാൽ ‘എന്തെന്നാൽ’ എന്നു തുടങ്ങുന്നത് മലയാളത്തിൽ അപൂർണമായി തോന്നും; ഗ്രീക്കിൽ ഇത് മുൻവാക്യത്തിനുള്ള വിശദീകരണബന്ധമാണ്.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: മക്കെദോന്യയും അഖായയും
  rationale: ഗ്രീക്കിലെ പ്രദേശനാമങ്ങൾ തന്നെയാണ് കർത്താക്കൾ; അവിടങ്ങളിലെ വിശ്വാസസമൂഹങ്ങളെ സൂചിപ്പിക്കുന്ന ലാക്ഷണിക പ്രയോഗം വിശദീകരിച്ച് വികസിപ്പിച്ചിട്ടില്ല.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: ഒരു സംഭാവന നൽകാൻ
  rationale: ഈ ധനശേഖരണസന്ദർഭത്തിൽ κοινωνία ഭൗതികസഹായമായി പ്രകടമാകുന്ന പങ്കാളിത്തത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ഒരു’ എന്നത് τινάയുടെ അനിശ്ചിതത്വം നിലനിർത്തുന്നു; പങ്കിടൽ എന്ന ആഴമുള്ള ഭാവം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: εἰς τοὺς πτωχοὺς
  choice: ദരിദ്രർക്കുവേണ്ടി
  rationale: εἰς ഇവിടെ സഹായത്തിന്റെ ഗുണഭോക്താക്കളെ സൂചിപ്പിക്കുന്നു; ആ ലക്ഷ്യബന്ധം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τῶν ἁγίων
  choice: വിശുദ്ധന്മാരിലെ
  rationale: ദരിദ്രർ വിശുദ്ധന്മാരുടെ കൂട്ടത്തിൽപ്പെട്ടവരാണെന്ന ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ കൃത്യമായി വ്യക്തമാക്കുന്നു.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: യെരൂശലേമിലുള്ള
  rationale: സ്ഥലസൂചന വിശുദ്ധന്മാരെ വിശേഷിപ്പിക്കുന്നതായി നേരിട്ട് നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ പ്രയോഗത്തിൽ ἅγιοι എന്നതിന്റെ പരിഭാഷ
  choice: വിശുദ്ധന്മാർ
  alternative: ദൈവത്തിന്റെ വിശുദ്ധജനം
  rationale: പൗലോസ് വിശ്വാസസമൂഹത്തെ വിളിക്കുന്ന പതിവുപദത്തിന്റെ സഭാപരവും ദൈവശാസ്ത്രപരവുമായ സ്വഭാവം നിലനിർത്തുന്നു; പിന്നീടുള്ള പ്രത്യേക വിശുദ്ധപദവിയെ വാക്യത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: κοινωνίαയുടെ ഭൗതികവും കൂട്ടായ്മാപരവുമായ അർഥവ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സംഭാവന’; അടിക്കുറിപ്പിൽ ‘പങ്കിടൽ’
  alternative: പങ്കിടൽ നടത്താൻ
  rationale: സന്ദർഭത്തിലെ സാമ്പത്തിക സഹായം വായനക്കാരന് വ്യക്തമായി നൽകുന്നതിനൊപ്പം, ഗ്രീക്ക് പദത്തിലെ കൂട്ടായ്മയുടെയും പങ്കാളിത്തത്തിന്റെയും ഭാവം അടിക്കുറിപ്പിലൂടെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പ്രദേശനാമങ്ങളെ ഗ്രീക്കിലെപ്പോലെ കർത്താക്കളാക്കി നിലനിർത്തിയിട്ടുണ്ട്; ‘സംഭാവന’ സാധാരണ വായനക്കാർക്ക് സാമ്പത്തികസന്ദർഭം വ്യക്തമായി നൽകുന്നു.
