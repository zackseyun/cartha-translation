revisions:
- from: മക്കെദോന്യയും അഖായയും യെരൂശലേമിലുള്ള വിശുദ്ധന്മാരിലെ ദരിദ്രർക്കുവേണ്ടി ഒരു സംഭാവന നൽകാൻ സന്തോഷത്തോടെ തീരുമാനിച്ചിരിക്കുന്നു.[a]
  to: എന്തെന്നാൽ, മക്കെദോന്യയും അഖായയും യെരൂശലേമിലെ വിശുദ്ധന്മാരിൽപ്പെട്ട ദരിദ്രർക്കുവേണ്ടി ഒരു സംഭാവന നൽകാൻ സന്തോഷപൂർവം തീരുമാനിച്ചു.[a]
