- from: 'വീണ്ടും അവൻ പറയുന്നു: “ജനതകളേ, അവന്റെ ജനത്തോടൊപ്പം ആനന്ദിക്കുവിൻ.”[a]'
  to: 'വീണ്ടും അവൻ പറയുന്നു: “യഹൂദേതരരേ, അവന്റെ ജനത്തോടൊപ്പം ആനന്ദിക്കുവിൻ.”[a]'
  rationale: The revision places the contextually intended Pauline sense of ἔθνη, “യഹൂദേതരരേ,” in the main text and moves the broader lexical rendering “ജനതകളേ” to the footnote. All other wording is retained because it faithfully and naturally represents the Greek citation.
