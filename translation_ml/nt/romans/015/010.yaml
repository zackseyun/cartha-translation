id: ROM.15.10
reference: Romans 15:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: ml
  text: 'വീണ്ടും അവൻ പറയുന്നു: “യഹൂദേതരരേ, അവന്റെ ജനത്തോടൊപ്പം ആനന്ദിക്കുവിൻ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ജനതകളേ, അവന്റെ ജനത്തോടൊപ്പം ആനന്ദിക്കുവിൻ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: മറ്റൊരു തിരുവെഴുത്ത് ഉദ്ധരണി അവതരിപ്പിക്കുന്ന സൂത്രവാക്യത്തിൽ ‘വീണ്ടും’ എന്നത് സ്വാഭാവികവും കൃത്യവുമാണ്.
- source_word: λέγει
  choice: അവൻ പറയുന്നു
  rationale: തിരുവെഴുത്ത് ഇപ്പോഴും സംസാരിക്കുന്നതായി കാണിക്കുന്ന ഗ്രീക്ക് വർത്തമാനകാലം നിലനിർത്തുന്നു; കർത്താവിനെ ഗ്രീക്ക് വാചകം വ്യക്തമായി പേരെടുത്തുപറയാത്തതും അതേപടി സംരക്ഷിക്കുന്നു.
- source_word: Εὐφράνθητε
  choice: ആനന്ദിക്കുവിൻ
  rationale: ആജ്ഞാരൂപത്തിന്റെ ബലവും ഉന്നതമായെങ്കിലും വായനാസൗകര്യമുള്ള ശൈലിയും നൽകുന്നു.
- source_word: ἔθνη
  choice: ജനതകളേ
  rationale: ἔθνη എന്ന പദത്തിന്റെ അടിസ്ഥാനപരമായ ബഹുവചന അർഥമായ ‘ജനതകൾ’ സംരക്ഷിക്കുന്നു; റോമർ 15-ലെ യഹൂദേതരരെ സൂചിപ്പിക്കുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: അവന്റെ ജനത്തോടൊപ്പം
  rationale: μετάയുടെ സഹവർത്തിത്വാർഥവും λαός എന്ന പദത്തിലെ ഉടമ്പടിജനത്തെക്കുറിച്ചുള്ള സൂചനയും അനാവശ്യ വിശദീകരണമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: യഹൂദരും യഹൂദേതരരും ചേർന്നുള്ള സ്തുതിയുടെ സന്ദർഭത്തിൽ ἔθνηയുടെ വിവർത്തനം
  choice: ജനതകളേ
  alternative: യഹൂദേതരരേ
  rationale: ‘ജനതകൾ’ എന്നത് ഉദ്ധരിച്ച ഗ്രീക്ക് വാചകത്തിന്റെ വിശാലമായ അർഥം നിലനിർത്തുന്നു. പൗലോസിന്റെ തത്സമയ വാദത്തിൽ ഇത് യഹൂദേതരരെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നതിനാൽ ആ സന്ദർഭപരമായ വായന അടിക്കുറിപ്പിൽ നൽകുന്നു; ഇതിലൂടെ അർഥവ്യാപ്തിയും ദൈവശാസ്ത്രപരമായ ഉന്നവും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാര മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. ബഹുവചന അഭിസംബോധനയും ആജ്ഞാരൂപവും വ്യക്തമാക്കാൻ ‘ജനതകളേ’, ‘ആനന്ദിക്കുവിൻ’ എന്നിവ ഉപയോഗിച്ചു.
