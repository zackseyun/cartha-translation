    issue: The main text renders ἔθνη as “ജനതകളേ,” while the footnote gives “യഹൂദേതരരേ.”
    rationale: Although “nations” is lexically possible, Romans 15:8–12 specifically argues for Gentiles joining God’s people in praise. The English POB likewise adopts “Gentiles” in the text and preserves “nations” as the alternative. Malayalam should follow this contextual rendering while retaining the lexical breadth in a note.
