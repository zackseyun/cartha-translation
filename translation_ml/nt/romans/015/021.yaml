id: ROM.15.21
reference: Romans 15:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: ml
  text: 'എന്നാൽ എഴുതിയിരിക്കുന്നതുപോലെ: “അവനെക്കുറിച്ച് അറിയിക്കപ്പെട്ടിട്ടില്ലാത്തവർ കാണും[b][a]; കേട്ടിട്ടില്ലാത്തവർ മനസ്സിലാക്കും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: പൗലൊസ് ഇവിടെ യെശയ്യാവ് 52:15 ഉദ്ധരിക്കുന്നു. യെശയ്യാവിന്റെ പശ്ചാത്തലത്തിൽ ‘അവൻ’ എന്ന സർവനാമം ദാസനെന്ന വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; പൗലൊസ് ഇവിടെ അത് തന്റെ സുവിശേഷപ്രഘോഷണവുമായി ബന്ധപ്പെടുത്തി പ്രയോഗിക്കുന്നു.
    reason: cross_reference
  - marker: b
    text: 'അല്ലെങ്കിൽ: “അവനെ സംബന്ധിച്ച് ഒന്നും അറിയിക്കപ്പെട്ടിട്ടില്ലാത്തവർ കാണും; കേട്ടിട്ടില്ലാത്തവർ മനസ്സിലാക്കും.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ പൗലൊസിന്റെ ശുശ്രൂഷാലക്ഷ്യവുമായി വിരുദ്ധബന്ധം സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാള പ്രയോഗം.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കാനുള്ള പതിവ് സൂത്രവാക്യം; ഗ്രീക്കിലെ perfect passive-ന്റെ നിലനിൽക്കുന്ന ഫലം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച് അറിയിക്കപ്പെട്ടിട്ടില്ലാത്തവർ
  rationale: ദാതിവ് ബന്ധസർവനാമത്തെ മലയാളത്തിൽ വ്യക്തികളെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക ഘടനയാക്കി; ἀναγγέλλω എന്നതിന്റെ ‘അറിയിക്കുക/പ്രഖ്യാപിക്കുക’ എന്ന അർഥവ്യാപ്തിയിൽ ഇവിടെ ‘അറിയിക്കപ്പെട്ടിട്ടില്ലാത്തവർ’ വ്യക്തവും ഗൗരവമുള്ളതുമാണ്.
- source_word: περὶ αὐτοῦ
  choice: അവനെക്കുറിച്ച്
  rationale: περί + genitive സൂചിപ്പിക്കുന്ന വിഷയബന്ധം നിലനിർത്തുന്നു; αὐτοῦ എന്ന സർവനാമത്തെ ‘ക്രിസ്തു’ എന്നാക്കി വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കുന്നില്ല.
- source_word: ὄψονται
  choice: കാണും
  rationale: ഭാവികാലക്രിയയുടെ നേരിട്ടുള്ള അർഥം നിലനിർത്തുന്നു; ‘ഗ്രഹിക്കും’ എന്ന വ്യാഖ്യാനത്തിലൂടെ അടുത്ത സമാന്തരക്രിയയുമായുള്ള വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: കേട്ടിട്ടില്ലാത്തവർ
  rationale: perfect രൂപം സൂചിപ്പിക്കുന്ന, ഇതുവരെ കേൾക്കാത്ത നില മലയാളത്തിലെ സ്വാഭാവിക രൂപത്തിൽ അറിയിക്കുന്നു.
- source_word: συνήσουσιν
  choice: മനസ്സിലാക്കും
  rationale: ഭാവികാലത്തിലുള്ള ‘ഗ്രഹിക്കുക/മനസ്സിലാക്കുക’ എന്ന അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: യെശയ്യാവിന്റെ ഉദ്ധരണിയിൽ ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ സൂചിതവ്യക്തി
  choice: പ്രധാനപാഠത്തിൽ ‘അവനെക്കുറിച്ച്’ എന്ന സർവനാമം നിലനിർത്തി.
  alternative: ‘മശീഹയെക്കുറിച്ച്’ അല്ലെങ്കിൽ ‘ക്രിസ്തുവിനെക്കുറിച്ച്’ എന്ന് വികസിപ്പിക്കുക.
  rationale: ഗ്രീക്ക് പാഠത്തിൽ αὐτοῦ എന്ന സർവനാമമാണ്. യെശയ്യാവിന്റെ പശ്ചാത്തലത്തിൽ അത് ദാസരൂപത്തെ സൂചിപ്പിക്കുകയും പൗലൊസ് ഇവിടെ തന്റെ സുവിശേഷപ്രഘോഷണവുമായി ബന്ധപ്പെടുത്തി പ്രയോഗിക്കുകയും ചെയ്യുന്നു; എന്നാൽ പ്രധാനപാഠത്തിൽ സൂചിതവ്യക്തിയെ വ്യാഖ്യാനിച്ച് പേരിടുന്നത് മൂലപാഠത്തേക്കാൾ അധികം വ്യക്തമാക്കലായിരിക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ഉദ്ധരണിയുടെ പ്രവചനാത്മക സമാന്തരഘടനയും ‘കാണും / മനസ്സിലാക്കും’ എന്ന വ്യത്യാസവും നിലനിർത്തി. നൽകിയ ഇംഗ്ലീഷ് POB-യിലെ അടിക്കുറിപ്പ്-ക്രമം അനുസരിച്ച് മുഖ്യപാഠത്തിൽ [b][a] ചേർത്തിരിക്കുന്നു.
