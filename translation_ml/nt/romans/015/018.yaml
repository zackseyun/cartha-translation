id: ROM.15.18
reference: Romans 15:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: ml
  text: ജാതികളുടെ[a] അനുസരണത്തിനായി മശീഹാ എന്നിലൂടെ വാക്കാലും പ്രവൃത്തിയാലും നടപ്പാക്കിയതല്ലാതെ മറ്റൊന്നിനെക്കുറിച്ചും സംസാരിക്കാൻ ഞാൻ ധൈര്യപ്പെടുകയില്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജനതകളുടെ.”
    reason: lexical_alternative
  - marker: b
    text: 'മറ്റൊരു പരിഭാഷ: “ജാതികളുടെ അനുസരണത്തിനായി മശീഹാ എന്നിലൂടെ വാക്കാലും പ്രവൃത്തിയാലും നടപ്പാക്കിയതല്ലാതെ മറ്റൊന്നും സംസാരിക്കാൻ ഞാൻ ധൈര്യപ്പെടുകയില്ല.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: ഞാൻ ധൈര്യപ്പെടുകയില്ല
  rationale: ഭാവികാല ക്രിയയുടെ ധൈര്യപ്പെടുക/തുനിയുക എന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: … കാര്യങ്ങളല്ലാതെ മറ്റൊന്നിനെക്കുറിച്ചും സംസാരിക്കാൻ
  rationale: ഗ്രീക്കിലെ നിയന്ത്രണാർഥമുള്ള പ്രയോഗം മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അവതരിപ്പിക്കുന്നു.
- source_word: κατειργάσατο
  choice: നിറവേറ്റിയ
  rationale: ഫലപ്രദമായി സാധിക്കുക അഥവാ കൊണ്ടുവരിക എന്ന അർഥം നൽകുന്നു; മശീഹായെ മുഖ്യ പ്രവർത്തകനായി നിലനിർത്തുന്നു.
- source_word: Χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ അഭിഷിക്തനായവൻ എന്ന സ്ഥാനപ്പേരിന്റെ ഭാവം പ്രകടമാണ്.
- source_word: δι’ ἐμοῦ
  choice: എന്നിലൂടെ
  rationale: മശീഹാ മുഖ്യ പ്രവർത്തകനും പൗലോസ് ഉപകരണവും ആണെന്ന കർത്തൃത്വബന്ധം സൂക്ഷിക്കുന്നു.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: ജാതികളുടെ അനുസരണത്തിനായി
  rationale: ലക്ഷ്യമോ ഫലമോ സൂചിപ്പിക്കാവുന്ന εἰς എന്ന പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം നിലനിർത്തുകയും ἔθνη എന്നത് റോമർ ലേഖനത്തിലെ യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്ന സാഹചര്യവുമായി യോജിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: λόγῳ καὶ ἔργῳ
  choice: വാക്കാലും പ്രവൃത്തിയാലും
  rationale: പ്രഖ്യാപനവും പ്രവർത്തനവും മശീഹാ പൗലോസിലൂടെ ഉപയോഗിച്ച മാർഗങ്ങളാണെന്ന ഉപകരണാർഥം സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്നതിന്റെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ വാക്യത്തിൽ പൗലോസിലൂടെ പ്രവർത്തിക്കുന്ന യേശുവിന്റെ മശീഹാസ്ഥാനം സൂചിപ്പിക്കുന്ന സ്ഥാനപ്പേരായി പദം വായിക്കാം; അതിനാൽ സ്ഥാനപ്പേരിന്റെ അർഥം നേരിട്ട് നൽകുന്നു.
- issue: ἔθνη എന്നതിന്റെ സാഹചര്യാർഥം
  choice: ജാതികൾ
  alternative: ജനതകൾ
  rationale: റോമർ ലേഖനത്തിലെ യഹൂദർ–യഹൂദരല്ലാത്തവർ എന്ന പശ്ചാത്തലത്തിൽ ‘ജാതികൾ’ യഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്ന പതിവ് ബൈബിൾ പ്രയോഗമാണ്; ‘ജനതകൾ’ എന്ന വിശാലാർഥവും സാധ്യമാണ്.
- issue: εἰς ὑπακοὴν എന്നതിലെ ലക്ഷ്യം/ഫലം
  choice: അനുസരണത്തിനായി
  alternative: അനുസരണത്തിലേക്കു നയിക്കാൻ
  rationale: ഗ്രീക്ക് നാമവാക്യത്തിന്റെ സംക്ഷിപ്തതയും ലക്ഷ്യമോ ഫലമോ എന്ന സാദ്ധ്യമായ ഇരട്ട ഭാവവും ആദ്യ രൂപം കൂടുതൽ നന്നായി സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ജാതികളുടെ അനുസരണം’ എന്ന അല്പം ഔപചാരികമായ ഘടന മൂലഭാഷയിലെ ദൈവശാസ്ത്രപരമായ സംക്ഷിപ്തതയും ലക്ഷ്യം/ഫലം സംബന്ധിച്ച തുറന്ന നിലയും സംരക്ഷിക്കാൻ ഉദ്ദേശപൂർവം നിലനിർത്തി.
