  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: ml
  text: സമാധാനത്തിന്റെ ദൈവം നിങ്ങളെല്ലാവരോടും കൂടെ ഇരിക്കട്ടെ. ആമേൻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ δέ ശക്തമായ വിരോധമല്ല, മൃദുവായ ബന്ധമോ സമാപനത്തിലേക്കുള്ള മാറ്റമോ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ വാക്യസന്ദർഭവും ആശംസാരൂപവും ഈ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർക്കുന്നത് അനാവശ്യമാണ്.
- source_word: θεὸς τῆς εἰρήνης
  choice: സമാധാനത്തിന്റെ ദൈവം
  rationale: പൗലൊസിന്റെ തിരിച്ചറിയാവുന്ന ഈ ജനിറ്റീവ് വിശേഷണം പരാവർത്തനം ചെയ്യാതെ നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: εἰρήνης
  choice: സമാധാനം
  rationale: εἰρήνηയുടെ സാധാരണവും സ്വാഭാവികവുമായ മലയാളരൂപം; സമഗ്രക്ഷേമത്തിന്റെയും അനുരഞ്ജിതബന്ധത്തിന്റെയും ആശയവ്യാപ്തി ഇതിൽ ഉൾക്കൊള്ളാം.
- source_word: μετὰ πάντων ὑμῶν
  choice: നിങ്ങളെല്ലാവരോടുംകൂടെ ഇരിക്കുമാറാകട്ടെ
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ലെങ്കിലും ഇത് സമാപനാശീർവാദമായതിനാൽ മലയാളത്തിൽ ആശംസാഭാവം വ്യക്തമാക്കാൻ ‘ഇരിക്കുമാറാകട്ടെ’ ചേർത്തു; πάντων എന്നതിന്റെ ഉൾക്കൊള്ളുന്ന ഊന്നൽ ‘എല്ലാവരും’ സംരക്ഷിക്കുന്നു.
- source_word: ἀμήν
  choice: ആമേൻ
  rationale: ആരാധനാപരമായ സമാപനപ്രയോഗം എന്ന നിലയിൽ വിവർത്തനം ചെയ്യാതെ മലയാളത്തിൽ പതിവായ രൂപം നിലനിർത്തുന്നു.
theological_decisions:
- issue: ക്രിയയില്ലാത്ത വാക്യം പ്രസ്താവനയായോ ആശീർവാദപ്രാർത്ഥനയായോ നൽകണമോ
  choice: 'ആശീർവാദപ്രാർത്ഥനയായി: ‘സമാധാനത്തിന്റെ ദൈവം നിങ്ങളെല്ലാവരോടുംകൂടെ ഇരിക്കുമാറാകട്ടെ.’'
  alternative: ‘സമാധാനത്തിന്റെ ദൈവം നിങ്ങളെല്ലാവരോടുംകൂടെ ഇരിക്കുന്നു.’
  rationale: ഗ്രീക്കിൽ വ്യക്തമായ optative അല്ലെങ്കിൽ imperative ക്രിയയില്ലെങ്കിലും ലേഖനത്തിന്റെ സമാപനസൂത്രത്തിൽ ഈ ഘടന സ്വാഭാവികമായി ഒരു ആശംസയോ പ്രാർത്ഥനയോ ആണ്. അതിനാൽ സ്രോതസ്സിന്റെ പ്രവർത്തനം മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; പ്രസ്താവനയായി തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ആശീർവാദശൈലി. സഭാപരമായി പരിചിതമായ ‘സമാധാനത്തിന്റെ ദൈവം’, ‘ആമേൻ’ എന്നീ പ്രയോഗങ്ങൾ നിലനിർത്തി; വിഭാഗീയ സവിശേഷതകൾ ചേർത്തിട്ടില്ല.
