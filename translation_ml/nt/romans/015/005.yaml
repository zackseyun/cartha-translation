id: ROM.15.5
reference: Romans 15:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: ml
  text: സഹനത്തിന്റെയും പ്രോത്സാഹനത്തിന്റെയും ദൈവം, മശീഹാ യേശുവിന് അനുസൃതമായി[b] നിങ്ങൾ പരസ്പരം ഒരേ മനോഭാവം പുലർത്താൻ[a] ഇടയാക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘ഒരേ മനസ്സുള്ളവരായിരിക്കാൻ’ അല്ലെങ്കിൽ ‘ഏകമനസ്സുള്ളവരായിരിക്കാൻ’.
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ അക്ഷരാർഥമായി ‘മശീഹാ യേശുവിന് അനുസൃതമായി’. ‘മശീഹാ’ എന്നത് Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം സംരക്ഷിക്കുന്നു.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: ദൈവം
  rationale: δέ ഇവിടെ ശക്തമായ വൈരുധ്യം സൂചിപ്പിക്കുന്നതിലുപരി മൃദുവായ ബന്ധകമാണ്; മലയാളത്തിൽ പ്രത്യേക ബന്ധകപദം ചേർക്കാതെ പ്രാർഥനാശംസയുടെ സ്വാഭാവിക ഒഴുക്ക് നിലനിർത്തുന്നു.
- source_word: τῆς ὑπομονῆς
  choice: സഹിച്ചുനിൽക്കാനുള്ള ശക്തിയുടെ
  rationale: ὑπομονή സമ്മർദത്തിനിടയിലും ഉറച്ചുനിൽക്കുന്ന സഹനത്തെ സൂചിപ്പിക്കുന്നു. ‘സഹിഷ്ണുത’ എന്നത് മറ്റുള്ളവരെ പൊറുക്കുക എന്ന അർഥത്തിലേക്ക് ചുരുങ്ങാൻ സാധ്യതയുള്ളതിനാൽ ഈ പ്രയോഗം തിരഞ്ഞെടുത്തു.
- source_word: τῆς παρακλήσεως
  choice: പ്രോത്സാഹനത്തിന്റെ
  rationale: παράκλησις ആശ്വാസം, പ്രോത്സാഹനം, ഉദ്ബോധനം എന്നിവ ഉൾക്കൊള്ളാം; 15:4-ലെ സന്ദർഭത്തിൽ ശക്തിപ്പെടുത്തുന്ന വിശാലമായ ആശയം ‘പ്രോത്സാഹനം’ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δῴη
  choice: ഇടയാക്കട്ടെ
  rationale: δίδωμι എന്ന ക്രിയയുടെ optative രൂപം ഇവിടെ പ്രാർഥനാപരമായ ആശംസയാണ്. മലയാളത്തിലെ ‘ഇടയാക്കട്ടെ’ ആ ആശംസാഭാവം സ്വാഭാവികമായി പകരുന്നു.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ഒരേ മനോഭാവം പുലർത്താൻ
  rationale: φρονεῖν ചിന്ത, വീക്ഷണം, മനോഭാവം എന്നിവയെ സൂചിപ്പിക്കുന്നു. എല്ലാ വിഷയങ്ങളിലും ഒരേ അഭിപ്രായം വേണമെന്ന അതിശക്തമായ അർഥം ചുമത്താതെ പങ്കിട്ട മനോഭാവം പ്രകടമാക്കുന്നു.
- source_word: ἐν ἀλλήλοις
  choice: പരസ്പരം
  rationale: വിശ്വാസിസമൂഹത്തിനുള്ളിലെ പരസ്പരബന്ധത്തിന്റെ മേഖല ചുരുക്കമായും സ്വാഭാവികമായും വ്യക്തമാക്കുന്നു.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: മശീഹാ യേശുവിന് അനുസൃതമായി
  rationale: κατά ഇവിടെ ഒരു മാനദണ്ഡത്തോടോ മാതൃകയോടോ ഉള്ള അനുരൂപത സൂചിപ്പിക്കുന്നു; Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം ‘മശീഹാ’ എന്നു സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ യേശു
  alternative: ക്രിസ്തുയേശു
  rationale: Χριστός ഒരു വെറും പേരുപോലെ മാറ്റാതെ ‘അഭിഷിക്തൻ/മശീഹാ’ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം വായനക്കാരന് ലഭ്യമാക്കുന്നു.
- issue: τὸ αὐτὸ φρονεῖν എന്നതിന്റെ വ്യാപ്തി
  choice: പരസ്പരം ഒരേ മനോഭാവം പുലർത്തുക
  alternative: എല്ലാ കാര്യത്തിലും ഒരേ അഭിപ്രായം പുലർത്തുക
  rationale: വാക്യം ഐക്യമുള്ള മനോഭാവം ആവശ്യപ്പെടുന്നു; എല്ലാ അനുബന്ധ വിഷയങ്ങളിലും സമ്പൂർണ അഭിപ്രായഏകരൂപത ആവശ്യപ്പെടുന്നു എന്ന് പരിഭാഷയിൽ അധികമായി തീരുമാനിക്കുന്നില്ല.
- issue: τῆς ὑπομονῆς καὶ τῆς παρακλήσεως എന്ന ജനിറ്റീവ് പ്രയോഗം
  choice: സഹിച്ചുനിൽക്കാനുള്ള ശക്തിയുടെയും പ്രോത്സാഹനത്തിന്റെയും ദൈവം
  alternative: സഹനവും പ്രോത്സാഹനവും നൽകുന്ന ദൈവം
  rationale: ദൈവം ഇവയുടെ ഉറവിടമോ ദാതാവോ ആണെന്ന സന്ദർഭബോധം നിലനിൽക്കുന്നു; എന്നാൽ ജനിറ്റീവ് ബന്ധത്തെ ‘നൽകുന്ന’ എന്നു മാത്രം തുറന്നുപറഞ്ഞ് അതിന്റെ സാധ്യതകൾ അനാവശ്യമായി ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. പ്രാർഥനാശംസയുടെ ഭാവത്തിന് ‘ഇടയാക്കട്ടെ’ ഉപയോഗിച്ചു; അതിരുകടന്ന സഭാപദാവലിയും വിഭാഗീയ വ്യാഖ്യാനവും ഒഴിവാക്കി.
