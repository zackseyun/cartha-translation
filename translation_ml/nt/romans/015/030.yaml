id: ROM.15.30
reference: Romans 15:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: ml
  text: സഹോദരന്മാരേ,[b] നമ്മുടെ കർത്താവായ യേശു മശീഹായാലും[a] ആത്മാവിന്റെ സ്നേഹത്താലും[c] എനിക്കുവേണ്ടി ദൈവത്തോടുള്ള പ്രാർഥനകളിൽ എന്നോടൊപ്പം പോരാടാൻ ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ “ക്രിസ്തു.” ഗ്രീക്കിലെ ക്രിസ്റ്റോസ് എന്ന സ്ഥാനപ്പേരിന് “അഭിഷിക്തൻ” അഥവാ “മശീഹാ” എന്നാണ് അർഥം.
    reason: alternative_reading
  - marker: b
    text: “സഹോദരന്മാർ” എന്നത് ഗ്രീക്കിൽ വ്യാകരണപരമായി പുല്ലിംഗമാണ്; എന്നാൽ ഇവിടെ സഹോദരന്മാരും സഹോദരിമാരും ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസസമൂഹത്തെയും അഭിസംബോധന ചെയ്യുന്നതാകാം.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ “ആത്മാവ് കാണിക്കുന്ന സ്നേഹം” / “ആത്മാവ് ഉളവാക്കുന്ന സ്നേഹം.” ഗ്രീക്കിലെ ബന്ധരൂപം ഒന്നിലധികം വിധത്തിൽ മനസ്സിലാക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ഞാൻ നിങ്ങളോട് അഭ്യർഥിക്കുന്നു
  rationale: ഗൗരവവും ആത്മാർഥതയുമുള്ള അഭ്യർഥനയെ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അറിയിക്കുന്നു; വെറും അപേക്ഷയെക്കാൾ ശക്തമായെങ്കിലും അതിരുകടന്ന യാചനയല്ല.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, പ്രസംഗത്തിലെ ഒരു മാറ്റമാണ് സൂചിപ്പിക്കുന്നത്. മലയാള വാക്യക്രമം ആ ബന്ധം സ്വാഭാവികമായി വഹിക്കുന്നതിനാൽ കൃത്രിമമായി ‘എന്നാൽ’ അല്ലെങ്കിൽ ‘ഇപ്പോൾ’ ചേർത്തിട്ടില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: ഗ്രീക്കിലെ വ്യാകരണപരമായി പുല്ലിംഗമായ സംബോധനരൂപം നിലനിർത്തുന്നു; മുഴുവൻ വിശ്വാസസമൂഹത്തെയും ഉൾക്കൊള്ളാവുന്ന പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: നമ്മുടെ കർത്താവായ യേശു മശീഹായെ പ്രതിയും
  rationale: διά + genitive അഭ്യർഥനയുടെ അടിസ്ഥാനമോ പ്രേരകബന്ധമോ സൂചിപ്പിക്കുന്നു. ആവർത്തിക്കുന്ന διάയെ ‘പ്രതിയും’ എന്ന സമാന്തര ഘടനയിൽ നിലനിർത്തി; Χριστός എന്ന പദത്തിന്റെ അഭിഷിക്തൻ എന്ന സ്ഥാനാർഥം ‘മശീഹാ’യായി നൽകി.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: ആത്മാവിന്റെ സ്നേഹത്തെ
  rationale: ഗ്രീക്ക് genitive-ന്റെ യഥാർഥ അസ്പഷ്ടത—ആത്മാവ് കാണിക്കുന്ന സ്നേഹമോ ആത്മാവ് ഉളവാക്കുന്ന സ്നേഹമോ—മലയാളത്തിലും നിലനിർത്തുന്നു.
- source_word: συναγωνίσασθαί μοι
  choice: എന്നോടൊപ്പം പോരാടണമെന്ന്
  rationale: συν- എന്ന കൂട്ടായ്മയും ἀγωνίζομαι എന്ന കഠിനശ്രമത്തിന്റെ രൂപകശക്തിയും ഒരുമിച്ച് സൂക്ഷിക്കുന്നു; പ്രാർഥനയിലെ തീവ്രമായ പങ്കാളിത്തമാണ് ഉദ്ദേശ്യം.
- source_word: ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: എനിക്കുവേണ്ടി ദൈവത്തോടുള്ള പ്രാർഥനകളിൽ
  rationale: ‘നിങ്ങളുടെ’ എന്ന ഉറവിടത്തിലില്ലാത്ത ഉടമസ്ഥപദം ചേർക്കാതെ, പ്രാർഥന ദൈവത്തോടാണെന്നും പൗലോസിനുവേണ്ടിയാണെന്നും വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ആത്മാവ്’ എന്നതിന്റെ പരാമർശം
  choice: പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നതായി ‘ആത്മാവ്’
  alternative: മനുഷ്യാത്മാവ് അല്ലെങ്കിൽ വ്യക്തിത്വമില്ലാത്ത ആത്മീയ സ്വാധീനം
  rationale: പൗലോസിന്റെ പ്രയോഗവും ഈ ഘടനയും പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എന്നാൽ സ്നേഹവുമായുള്ള genitive ബന്ധം വ്യാഖ്യാനിച്ച് തീർത്തിട്ടില്ല.
- issue: Χριστοῦ എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: Χριστός എന്നത് ‘അഭിഷിക്തൻ’ എന്ന സ്ഥാനപ്പേരാണ്; സെമിറ്റിക് പശ്ചാത്തലം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ പ്രധാനപാഠത്തിൽ നൽകി, പരിചിതമായ പരമ്പരാഗത രൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- issue: ἀδελφοί എന്ന സംബോധനയുടെ വ്യാപ്തി
  choice: സഹോദരന്മാരേ
  alternative: സഹോദരീസഹോദരന്മാരേ
  rationale: ഉറവിടത്തിലെ വ്യാകരണപരമായ പുല്ലിംഗരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; അത് സ്ത്രീകളെയും പുരുഷന്മാരെയും ഉൾക്കൊള്ളുന്ന മുഴുവൻ വിശ്വാസസമൂഹത്തെ അഭിസംബോധന ചെയ്യാമെന്ന വിവരം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്നതുമായ ശൈലി. ‘പ്രതിയും’ എന്ന ആവർത്തനം ഉറവിടത്തിലെ ഇരട്ട διά ഘടന സംരക്ഷിക്കുന്നു. ‘പോരാടുക’ എന്നത് ശാരീരിക സംഘർഷമല്ല, തീക്ഷ്ണമായ കൂട്ടുപ്രാർഥനയുടെ രൂപകമാണ്.
