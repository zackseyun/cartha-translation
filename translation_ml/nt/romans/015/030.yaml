    issue: “പ്രതിയും” mistranslates the force of διὰ in both parallel phrases.
    rationale: In this context Paul appeals on the basis of/in view of the Lord Jesus the Messiah and the Spirit's love. Malayalam “X-യെ പ്രതി” denotes ‘about/concerning X’ and thus changes the relation. Instrumental “-യാലും/-ത്താലും” is both idiomatic and semantically suitable.
