  to: നമ്മിൽ ഓരോരുത്തരും തന്റെ അയൽക്കാരന്റെ നന്മയ്ക്കായി[a] അവനെ പടുത്തുയർത്തുന്നതിനായി[b] പ്രസാദിപ്പിക്കട്ടെ.
