source:
  edition: SBLGNT
  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: ml
  text: നമ്മിൽ ഓരോരുത്തരും തന്റെ അയൽക്കാരന്റെ നന്മയ്ക്കായി[a] അവനെ പടുത്തുയർത്തുന്നതിനായി[b] പ്രസാദിപ്പിക്കട്ടെ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “നല്ലതിലേക്കായി” അല്ലെങ്കിൽ “നന്മ ഉണ്ടാകേണ്ടതിന്.” ഇവിടെ ഗ്രീക്ക് പ്രയോഗം വെറും തൃപ്തിപ്പെടുത്തലിനെയല്ല, പ്രയോജനകരമായതിനെ ലക്ഷ്യമാക്കുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'അഥവാ: “വളർച്ചയ്ക്കായി” അല്ലെങ്കിൽ “പടുത്തുയർത്തലിനായി.” ഗ്രീക്കിൽ അക്ഷരാർഥം “പടുത്തുയർത്തൽ”; ഇവിടെ മറ്റൊരാളെ ശക്തിപ്പെടുത്തുന്നതിന്റെ രൂപകമായി ഉപയോഗിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: നമ്മിൽ ഓരോരുത്തരും
  rationale: വിതരണാർഥമുള്ള ഏകവചനവും ഭാഗികബന്ധം സൂചിപ്പിക്കുന്ന ἡμῶν എന്ന രൂപവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τῷ πλησίον
  choice: തന്റെ അയൽക്കാരനെ
  rationale: ധാർമ്മിക അർഥത്തിൽ ഒരാളുടെ സമീപസ്ഥനെയോ സഹമനുഷ്യനെയോ സൂചിപ്പിക്കുന്നു; ഏകവചനഘടന മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀρεσκέτω
  choice: പ്രസാദിപ്പിക്കട്ടെ
  rationale: മൂന്നാംപുരുഷ ഏകവചന വർത്തമാനകാല ആജ്ഞാരൂപത്തിന്റെ പ്രബോധനശക്തി നിലനിർത്തുന്നു; തുടർന്നുള്ള ഉദ്ദേശ്യവാക്യങ്ങൾ ഇത് വെറും മുഖസ്തുതിയല്ലെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: εἰς τὸ ἀγαθὸν
  choice: നന്മയ്ക്കായി
  rationale: ലക്ഷ്യമോ പ്രയോജനമോ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പരിഭാഷ; അയൽക്കാരന്റെ നന്മയാണ് സന്ദർഭത്തിൽ ഉദ്ദേശിക്കുന്നത്.
- source_word: πρὸς οἰκοδομήν
  choice: അവനെ പടുത്തുയർത്തേണ്ടതിന്
  rationale: οἰκοδομή എന്ന പദത്തിലെ ‘പണിയുക/പടുത്തുയർത്തുക’ എന്ന രൂപകം നിലനിർത്തുകയും വ്യക്തിയെ ശക്തിപ്പെടുത്തുക എന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: അയൽക്കാരനെ പ്രസാദിപ്പിക്കുക എന്ന ആജ്ഞയുടെ പരിധി
  choice: അയൽക്കാരന്റെ നന്മയും പടുത്തുയർത്തലും ലക്ഷ്യമാക്കിയ പ്രസാദിപ്പിക്കൽ
  alternative: മറ്റുള്ളവരെ യാതൊരു പരിധിയുമില്ലാതെ തൃപ്തിപ്പെടുത്തണമെന്ന വായന
  rationale: εἰς τὸ ἀγαθὸν, πρὸς οἰκοδομήν എന്നീ രണ്ട് ഉദ്ദേശ്യപ്രയോഗങ്ങൾ ആജ്ഞയെ നിയന്ത്രിക്കുന്നു. അതിനാൽ അംഗീകാരം നേടാനുള്ള ശ്രമമെന്നല്ല, മറ്റൊരാളുടെ യഥാർഥ നന്മയും വളർച്ചയും ലക്ഷ്യമാക്കിയ പ്രവർത്തിയെന്ന നിലയിലാണ് പരിഭാഷ.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പടുത്തുയർത്തുക’ എന്ന രൂപകം മൂലപാഠത്തോട് ചേർന്നുനിൽക്കുന്നു; ‘പ്രസാദിപ്പിക്കുക’ എന്നത് പരമ്പരാഗതമായെങ്കിലും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന പദമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിരിക്കുന്നു.
