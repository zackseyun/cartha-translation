revisions:
- from: ശക്തരായ നാം ബലഹീനരുടെ ബലഹീനതകൾ[a] ചുമക്കേണ്ടതാണ്; നമ്മെത്തന്നെ പ്രസാദിപ്പിക്കരുത്.
  to: ശക്തരായ നാം ബലഹീനരുടെ ബലഹീനതകൾ[a] വഹിക്കാനും നമ്മെത്തന്നെ പ്രസാദിപ്പിക്കാതിരിക്കാനും ബാധ്യസ്ഥരാണ്.
  rationale: The revision makes the governing force of ὀφείλομεν apply equally to both coordinated infinitives, while preserving the original’s ethical obligation, strong/weak terminology, and burden-bearing metaphor. The footnote is adjusted only for natural, contextually accurate Malayalam.
