source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: ml
  text: ശക്തരായ നാം ബലഹീനരുടെ ബലഹീനതകൾ[a] വഹിക്കാനും നമ്മെത്തന്നെ പ്രസാദിപ്പിക്കാതിരിക്കാനും ബാധ്യസ്ഥരാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ബലഹീനരുടെ പരിമിതികൾ” അല്ലെങ്കിൽ “വീഴ്ചകൾ.” ഗ്രീക്കുപദത്തിന് ബലഹീനതകൾ, പരിമിതികൾ, വീഴ്ചകൾ എന്നീ അർഥങ്ങൾ വരാം. ഇവിടെ, മുൻ അധ്യായത്തിൽ ചർച്ച ചെയ്ത മനസ്സാക്ഷിയുടെ പരിമിതികളെയോ സംശയങ്ങളെയോ പ്രധാനമായും സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: ചുമക്കേണ്ടതാണ്
  rationale: ധാർമിക ബാധ്യത വ്യക്തമാക്കുന്നു; എന്നാൽ സ്വതന്ത്രമായ ഒരു കൽപ്പനയായി കടുപ്പിക്കാതെ മൂലത്തിലെ സൂചകക്രിയയുടെ പ്രബോധനസ്വരം നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: മുൻ ചർച്ചയിൽനിന്നുള്ള മൃദുവായ തുടർച്ച മലയാളത്തിലെ സ്വാഭാവിക വാക്യപ്രവാഹത്തിലൂടെ പ്രകടമാകുന്നു; മൂലത്തിൽ ഇല്ലാത്ത കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: ശക്തരായ നാം
  rationale: ഊന്നലുള്ള ‘നാം’ എന്ന സർവനാമവും ‘ശക്തർ’ എന്ന വിശേഷണപ്രയോഗവും സ്വാഭാവികമായി പകർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് പ്രധാനമായും മനസ്സാക്ഷിയിലെ ശക്തിയെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: τὰ ἀσθενήματα
  choice: ബലഹീനതകൾ
  rationale: പരിമിതികൾ, മനസ്സാക്ഷിസംബന്ധമായ മടികൾ, വീഴ്ചകൾ എന്നിവ ഉൾക്കൊള്ളാവുന്ന മൂലപദത്തിന്റെ വിശാലത നിലനിർത്തുന്നു; ധാർമിക കുറ്റം മാത്രം സൂചിപ്പിക്കുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: τῶν ἀδυνάτων
  choice: ബലഹീനരുടെ
  rationale: റോമർ 14–15-ലെ ശക്തർ–ബലഹീനർ എന്ന വിരുദ്ധജോടി വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: βαστάζειν
  choice: ചുമക്കുക
  rationale: മറ്റൊരാളുടെ ഭാരം വഹിക്കുന്ന രൂപകം സംരക്ഷിക്കുന്നു; വെറുതെ സഹിച്ചുകൊടുക്കുക എന്നതിലേക്കു അർഥം ചുരുക്കുന്നില്ല.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: നമ്മെത്തന്നെ പ്രസാദിപ്പിക്കരുത്
  rationale: ആത്മകേന്ദ്രിതമായ സംതൃപ്തി തേടാതിരിക്കുക എന്ന നൈതിക വൈരുധ്യം സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
theological_decisions:
- issue: ‘ശക്തർ’, ‘ബലഹീനർ’ എന്നീ പ്രയോഗങ്ങളുടെ അർഥം
  choice: റോമർ 14-ന്റെ സന്ദർഭത്തിൽ, മനസ്സാക്ഷിയുടെ സ്വാതന്ത്ര്യത്തിലും ഉറപ്പിലും വ്യത്യാസമുള്ള വിശ്വാസികളെയാണ് പ്രധാനമായും സൂചിപ്പിക്കുന്നത്.
  alternative: സാമൂഹികമായി ശക്തരും അധികാരമില്ലാത്തവരും, അല്ലെങ്കിൽ ശാരീരികമായി ശക്തരും ബലഹീനരും.
  rationale: തൊട്ടുമുൻപുള്ള സന്ദർഭം ഭക്ഷണം, ദിവസങ്ങളുടെ ആചരണം, മനസ്സാക്ഷി എന്നിവയെക്കുറിച്ചുള്ള ഭിന്നതകളാണ് ചർച്ച ചെയ്യുന്നത്; എങ്കിലും പരിഭാഷയിൽ സന്ദർഭാർഥം വിശദീകരിച്ച് മൂലപദങ്ങളുടെ വിശാലത ഇല്ലാതാക്കിയിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശക്തർ/ബലഹീനർ’, ‘ചുമക്കുക’ എന്നീ രൂപകങ്ങൾ നിലനിർത്തി; വിഭാഗീയ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
