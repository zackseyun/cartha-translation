revisions:
- from: യഹൂദരല്ലാത്തവർക്കായി[a] മശീഹയായ യേശുവിന്റെ ശുശ്രൂഷകനായി, ദൈവത്തിന്റെ സുവിശേഷത്തിന്റെ പുരോഹിതശുശ്രൂഷ നിർവഹിക്കേണ്ടതിനും[b], അങ്ങനെ യഹൂദരല്ലാത്തവരുടെ വഴിപാട്[c] പരിശുദ്ധാത്മാവിനാൽ[d] വിശുദ്ധീകരിക്കപ്പെട്ട് ദൈവത്തിനു സ്വീകാര്യമായിത്തീരേണ്ടതിനുമാണ്.
  to: യഹൂദരല്ലാത്തവരോടു മശീഹ യേശുവിന്റെ ശുശ്രൂഷകനായും, ദൈവത്തിന്റെ സുവിശേഷത്തിന്റെ പുരോഹിതശുശ്രൂഷ നിർവഹിക്കുന്നവനായും ഞാൻ ഇരിക്കേണ്ടതിന്, അങ്ങനെ യഹൂദരല്ലാത്തവരുടെ വഴിപാട്[c] പരിശുദ്ധാത്മാവിനാൽ[d] വിശുദ്ധീകരിക്കപ്പെട്ട് ദൈവത്തിനു സ്വീകാര്യമായിത്തീരേണ്ടതിന്.
  rationale: «മശീഹയായ യേശു» എന്ന തെറ്റായ ശീർഷകരൂപം «മശീഹ യേശു» എന്നാക്കി. മുഖ്യവാചകം ἱερουργοῦντα എന്ന പുരോഹിതഭാവമുള്ള വർത്തമാന കൃദ്‌വ്യയത്തെ ശുശ്രൂഷകന്റെ പ്രവർത്തനത്തെ വിവരിക്കുന്ന സ്വാഭാവിക മലയാളരൂപത്തിൽ പുനഃക്രമീകരിക്കുന്നു. προσφορὰ τῶν ἐθνῶν-ന്റെ ദ്വയാർഥതയും ἐν πνεύματι ἁγίῳ-ന്റെ വ്യത്യസ്ത വായനയും അടിക്കുറിപ്പുകളിൽ നിലനിർത്തിയിരിക്കുന്നു. അടിക്കുറിപ്പ് a, b എന്നിവയ്ക്ക് മുഖ്യവാചകത്തിൽ പ്രത്യേക ആങ്കർ ഇല്ലാത്തതിനാൽ അവ ഒഴിവാക്കി; ശേഷിക്കുന്ന എല്ലാ അടിക്കുറിപ്പുകൾക്കും ആങ്കറുകൾ ഉണ്ട്.
