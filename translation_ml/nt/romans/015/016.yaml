id: ROM.15.16
reference: Romans 15:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: ml
  text: യഹൂദരല്ലാത്തവരോടു മശീഹ യേശുവിന്റെ ശുശ്രൂഷകനായും, ദൈവത്തിന്റെ സുവിശേഷത്തിന്റെ പുരോഹിതശുശ്രൂഷ നിർവഹിക്കുന്നവനായും ഞാൻ ഇരിക്കേണ്ടതിന്, അങ്ങനെ യഹൂദരല്ലാത്തവരുടെ വഴിപാട്[c] പരിശുദ്ധാത്മാവിനാൽ[d] വിശുദ്ധീകരിക്കപ്പെട്ട് ദൈവത്തിനു സ്വീകാര്യമായിത്തീരേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'സാധ്യതയേറിയ അർഥം: യഹൂദരല്ലാത്തവർ തന്നെയാണ് ദൈവത്തിനു സമർപ്പിക്കപ്പെടുന്ന വഴിപാട്. മറ്റൊരു സാധ്യത: “യഹൂദരല്ലാത്തവർ അർപ്പിക്കുന്ന വഴിപാട്.”'
    reason: alternative_reading
  - marker: d
    text: അഥവാ, “പരിശുദ്ധാത്മാവിൽ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: ശുശ്രൂഷകൻ
  rationale: പൊതുവായതോ മതപരമായതോ ആയ സേവനം നിർവഹിക്കുന്നവനെ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. തുടർന്നുവരുന്ന പുരോഹിതരൂപകം നിലനിർത്തിക്കൊണ്ട്, ഇവിടെ പ്രത്യേകമായ ഒരു പിൽക്കാല സഭാപദവി ആരോപിക്കാതിരിക്കാൻ ‘ശുശ്രൂഷകൻ’ അനുയോജ്യമാണ്.
- source_word: Χριστοῦ Ἰησοῦ
  choice: മശീഹയായ യേശു
  rationale: Χριστός ഇവിടെ സ്ഥാനനാമത്തേക്കാൾ അഭിഷിക്തനായ മശീഹ എന്ന പദവിയുടെ അർഥം വഹിക്കുന്നതിനാൽ അത് വ്യക്തമായി വിവർത്തനം ചെയ്തു.
- source_word: εἰς τὰ ἔθνη
  choice: യഹൂദരല്ലാത്തവർക്കായി
  rationale: റോമർ ലേഖനത്തിലെ യഹൂദർ–യഹൂദരല്ലാത്തവർ പശ്ചാത്തലത്തിൽ ἔθνη യഹൂദേതര ജനങ്ങളെ സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ജാതികൾ’ എന്നതിന് ജാതിവ്യവസ്ഥയുമായി ബന്ധപ്പെട്ട തെറ്റിദ്ധാരണ ഉണ്ടാകാമെന്നതിനാൽ ഈ വ്യക്തമായ രൂപം തിരഞ്ഞെടുത്തു; ‘ജനതകൾ’ അടിക്കുറിപ്പിൽ നിലനിർത്തി.
- source_word: ἱερουργοῦντα
  choice: പുരോഹിതശുശ്രൂഷ നിർവഹിച്ച്
  rationale: ഈ ക്രിയ സാധാരണ സേവനമല്ല, ബലിവഴിപാടുമായി ബന്ധപ്പെട്ട പുരോഹിതരൂപകമാണ്. അതിനാൽ അതിന്റെ ആരാധനാപരമായ ഭാവം വ്യക്തമായി സൂക്ഷിച്ചു.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സുവിശേഷം
  rationale: പൗലോസിന്റെ പ്രയോഗത്തോടും മലയാള ക്രൈസ്തവ ഭാഷയിലെ പരിചിതവും മാന്യവുമായ പദസഞ്ചയത്തോടും ഒത്തുപോകുന്ന രൂപമാണിത്.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: യഹൂദരല്ലാത്തവരുടെ വഴിപാട്
  rationale: ഗ്രീക്കിലെ ഷഷ്ഠീവിഭക്തിയുടെ ഘടനയും അതിലുള്ള യഥാർഥ ദ്വയാർഥസാധ്യതയും ഈ രൂപം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവർ തന്നെയാണ് വഴിപാടെന്ന വായനയ്ക്ക് മുൻതൂക്കമുണ്ടെങ്കിലും, അവർ അർപ്പിക്കുന്ന വഴിപാട് എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- source_word: εὐπρόσδεκτος
  choice: ദൈവത്തിനു സ്വീകാര്യമായ
  rationale: വഴിപാടിന്റെ പശ്ചാത്തലത്തിൽ സ്വീകരിക്കപ്പെടുന്നതും പ്രസാദകരവുമായ അവസ്ഥയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു; ആരാൽ സ്വീകരിക്കപ്പെടുന്നു എന്നത് സന്ദർഭത്തിൽ ദൈവമാണെന്ന് വ്യക്തമാക്കുന്നു.
- source_word: ἡγιασμένη
  choice: വിശുദ്ധീകരിക്കപ്പെട്ട്
  rationale: പൂർത്തിയായ വിശുദ്ധീകരണപ്രവർത്തനത്തിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയെ ഗ്രീക്കിലെ perfect passive participle സൂചിപ്പിക്കുന്നു; ഈ രൂപം അതിനെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിനാൽ
  rationale: ἐν ഇവിടെ വിശുദ്ധീകരണത്തിന്റെ കർത്താവിനെയോ മാർഗത്തെയോ സൂചിപ്പിക്കുന്നതായി സ്വാഭാവികമായി വായിക്കാം. ‘പരിശുദ്ധാത്മാവിൽ’ എന്ന സ്ഥലപരമോ മേഖലാപരമോ ആയ വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
theological_decisions:
- issue: പൗലോസ് തന്റെ ശുശ്രൂഷയെ പുരോഹിതഭാഷയിൽ വിവരിക്കുന്നത്
  choice: യഹൂദരല്ലാത്തവരോടുള്ള അപ്പൊസ്തോലിക സുവിശേഷശുശ്രൂഷയെ ബലിവഴിപാടുമായി ബന്ധപ്പെട്ട പുരോഹിതരൂപകത്തിലൂടെ അവതരിപ്പിച്ചു.
  alternative: ഇത് ഔപചാരിക പുരോഹിതപദവിയുടെ അവകാശവാദമായി വായിക്കുക; അല്ലെങ്കിൽ പുരോഹിതരൂപകം മുഴുവനായി മായ്ച്ച് സാധാരണ സേവനമായി മാത്രം വിവർത്തനം ചെയ്യുക.
  rationale: λειτουργός, ἱερουργέω, προσφορά എന്നീ പദങ്ങൾ ചേർന്ന് വ്യക്തമായ പുരോഹിതരൂപകം സൃഷ്ടിക്കുന്നു. എന്നാൽ ഇവിടെ പൗലോസ് പ്രായശ്ചിത്തബലി അർപ്പിക്കുന്നതായി പറയുന്നില്ല; അവന്റെ സുവിശേഷശുശ്രൂഷയുടെ ഫലമായ ജനങ്ങളെയാണ് വഴിപാടായി ചിത്രീകരിക്കുന്നത്.
- issue: ‘യഹൂദരല്ലാത്തവരുടെ വഴിപാട്’ എന്നതിന്റെ സൂചിതാർഥം
  choice: സന്ദർഭത്തിൽ, യഹൂദരല്ലാത്തവർ തന്നെയാണ് ദൈവത്തിനു സമർപ്പിക്കപ്പെടുന്ന വഴിപാട് എന്ന വായനയ്ക്ക് മുൻതൂക്കം നൽകി.
  alternative: യഹൂദരല്ലാത്തവർ അർപ്പിക്കുന്ന ഒരു വഴിപാട്.
  rationale: പുരോഹിതരൂപകവും പൗലോസിന്റെ യഹൂദേതര ദൗത്യവും ആദ്യവായനയെ പിന്തുണയ്ക്കുന്നു. എങ്കിലും τῶν ἐθνῶν എന്ന ഗ്രീക്ക് ഷഷ്ഠീവിഭക്തി മറ്റേ വായനയെ പൂർണമായി ഇല്ലാതാക്കുന്നില്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ അത് നിർബന്ധിച്ച് വ്യക്തമാക്കാതെ അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം ഉപയോഗിച്ചു. ‘ജാതികൾ’ എന്ന പദം മലയാളത്തിൽ സാമൂഹിക ജാതിവ്യവസ്ഥയെ അനാവശ്യമായി ഓർമിപ്പിക്കാമെന്നതിനാൽ മുഖ്യവാചകത്തിൽ ‘യഹൂദരല്ലാത്തവർ’ ഉപയോഗിച്ചു. പുരോഹിതരൂപകം മങ്ങിപ്പോകാതിരിക്കാനും അതിനെ പിൽക്കാല സഭാപദവിയാക്കി കടുപ്പിക്കാതിരിക്കാനും ശ്രദ്ധിച്ചു.
