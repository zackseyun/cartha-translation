id: ROM.15.20
reference: Romans 15:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: ml
  text: 'ഇങ്ങനെയാണ് ഞാൻ ലക്ഷ്യമാക്കുന്നത്: മശീഹായുടെ പേര് മുമ്പേ അറിയിക്കപ്പെട്ടിട്ടുള്ള ഇടങ്ങളിലല്ല[a] സുവാർത്ത അറിയിക്കുക, മറ്റൊരാളുടെ അടിത്തറമേൽ പണിയാതിരിക്കാനായി.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അക്ഷരാർഥത്തിൽ: “മശീഹാ പേരെടുക്കപ്പെട്ടിട്ടുള്ള ഇടങ്ങളിലല്ല.” ഇവിടെ ‘പേര് അറിയിക്കപ്പെട്ടിട്ടുള്ള’ എന്നത് മശീഹായെക്കുറിച്ച് മുമ്പേ പ്രഖ്യാപിക്കപ്പെട്ടിട്ടുള്ള ഇടങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.'
    reason: മൂലത്തിലെ ὠνομάσθη എന്ന കർമണിപ്രയോഗത്തിന്റെ അക്ഷരാർഥവും സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: οὕτως δὲ
  choice: ഇങ്ങനെ
  rationale: മുൻവാക്യങ്ങളിലെ പൗലോസിന്റെ ശുശ്രൂഷാവിവരണവുമായി ഈ പ്രസ്താവനയെ ബന്ധിപ്പിക്കുന്ന മൃദുവായ തുടർച്ച സ്വാഭാവികമായി നൽകുന്നു.
- source_word: φιλοτιμούμενον
  choice: ഞാൻ അഭിലഷിക്കുന്നു
  rationale: വ്യക്തിപരമായ ഉത്സാഹപൂർവമായ ലക്ഷ്യത്തെയും ആഗ്രഹത്തെയും സൂചിപ്പിക്കുന്നു; ഇതിനെ പൊതുവായ കല്പനയാക്കി മാറ്റുന്നില്ല.
- source_word: εὐαγγελίζεσθαι
  choice: സുവാർത്ത അറിയിക്കുക
  rationale: സുവാർത്താപ്രഖ്യാപനം എന്ന ക്രിയാത്മക അർഥം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: മശീഹായുടെ പേര് അറിയിക്കപ്പെട്ടിട്ടുള്ള ഇടങ്ങളിലല്ല
  rationale: സ്ഥലസൂചക നിഷേധവും ὠνομάσθη എന്ന കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; മലയാളത്തിൽ വെറും പേര് ഉച്ചരിക്കപ്പെട്ടു എന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കാൻ ‘പേര് അറിയിക്കപ്പെട്ടു’ എന്നു നൽകി.
- source_word: Χριστός
  choice: മശീഹാ
  rationale: ഇവിടെ പൗലോസ് പ്രഖ്യാപിക്കപ്പെടുന്ന വ്യക്തിയുടെ സ്ഥാനപ്പേരായാണ് Χριστός ഉപയോഗിക്കുന്നത്; അതിനാൽ ‘മശീഹാ’ യോജിക്കുന്നു.
- source_word: ἵνα μὴ
  choice: പണിയാതിരിക്കാനാണ് അത്
  rationale: നിഷേധാത്മക ഉദ്ദേശ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: മറ്റൊരാളുടെ അടിത്തറമേൽ പണിയുക
  rationale: മുൻകാല അപ്പൊസ്തലിക പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്ന നിർമാണരൂപകം വ്യാഖ്യാനിച്ച് വികസിപ്പിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദം പേരുപോലുള്ള സ്ഥിരരൂപത്തേക്കാൾ പ്രഖ്യാപിക്കപ്പെടുന്ന സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു.
- issue: പൗലോസിന്റെ ശുശ്രൂഷാനയത്തിന്റെ വ്യാപ്തി
  choice: പൗലോസിന്റെ വ്യക്തിപരമായ അഭിലാഷമായി അവതരിപ്പിച്ചു
  alternative: മശീഹാ മുമ്പേ അറിയിക്കപ്പെട്ട സ്ഥലങ്ങളിലെ എല്ലാ ശുശ്രൂഷയും വിലക്കുന്ന സാർവത്രിക നിയമമായി അവതരിപ്പിക്കൽ
  rationale: φιλοτιμούμενον വ്യക്തിപരമായ ലക്ഷ്യത്തെ സൂചിപ്പിക്കുന്നു; മൂലപാഠം പറയാത്ത പൊതുകല്പന വിവർത്തനത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദൈവശാസ്ത്രപരമായ അധികവ്യാഖ്യാനം ഒഴിവാക്കി നിർമാണരൂപകവും പൗലോസിന്റെ വ്യക്തിപരമായ അഭിലാഷവും സംരക്ഷിച്ചു.
