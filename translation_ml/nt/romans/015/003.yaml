id: ROM.15.3
reference: Romans 15:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: ml
  text: 'എന്തെന്നാൽ, മശീഹപോലും തന്നെത്തന്നെ പ്രസാദിപ്പിച്ചില്ല[a]. മറിച്ച്, എഴുതിയിരിക്കുന്നതുപോലെ: “അങ്ങയെ നിന്ദിച്ചവരുടെ നിന്ദകൾ എന്റെമേൽ പതിച്ചു.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ക്രിസ്തുപോലും.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: മശീഹപോലും
  rationale: γάρ നൽകുന്ന മുൻവാക്യത്തോടുള്ള കാരണബന്ധം സന്ദർഭത്തിൽ സ്വാഭാവികമായി നിലനിൽക്കുന്നു; καίയുടെ ഊന്നൽ ‘പോലും’ കൊണ്ട് പ്രകടമാക്കുന്നു.
- source_word: ὁ Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ നിർദ്ദിഷ്ടപദത്തോടുകൂടിയ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്നു പരിഭാഷപ്പെടുത്തി.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: തന്നെത്തന്നെ പ്രസാദിപ്പിച്ചില്ല
  rationale: ക്രിയയുടെ ‘പ്രസാദിപ്പിക്കുക’ എന്ന ആശയവും ആത്മവാചക സർവനാമവും സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: മറിച്ച്, എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: വിരുദ്ധബന്ധവും പതിവായ തിരുവെഴുത്ത് ഉദ്ധരണിസൂത്രവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ὀνειδισμοί
  choice: നിന്ദകൾ
  rationale: വാക്കാലുള്ള അധിക്ഷേപവും അപമാനവും ഉൾക്കൊള്ളുന്ന, ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്നതുമായ പദം.
- source_word: τῶν ὀνειδιζόντων σε
  choice: അങ്ങയെ നിന്ദിച്ചവരുടെ
  rationale: മൂലത്തിലെ സമാനധാതുപദങ്ങളുടെ ആവർത്തനം ‘നിന്ദിച്ചവരുടെ നിന്ദകൾ’ എന്ന രൂപത്തിൽ സംരക്ഷിക്കുന്നു; ദൈവത്തെ അഭിസംബോധന ചെയ്യുന്ന ഉദ്ധരണിയിൽ ആദരസൂചകമായ ‘അങ്ങയെ’ ഉപയോഗിക്കുന്നു.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: എന്റെമേൽ പതിച്ചു
  rationale: അയോറിസ്റ്റിന്റെ ലളിത ഭൂതകാലബലവും ‘മേൽ വീഴുക/പതിക്കുക’ എന്ന ദൃശ്യരൂപവും നേരിട്ട് പകരുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഈ സന്ദർഭത്തിൽ പദം പേരുപോലെയല്ല, സ്ഥാനപ്പേരായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ ‘മശീഹ’ മുഖ്യപാഠത്തിൽ നൽകി, പരിചിതമായ മറ്റുരൂപം അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: തിരുവെഴുത്ത് ഉദ്ധരണിയിലെ സംസാരിക്കുന്നവന്റെ തിരിച്ചറിയൽ
  choice: ഉദ്ധരണി പറയുന്നതിലധികം വ്യക്തമായി തിരിച്ചറിയിക്കാതെ നിലനിർത്തി
  alternative: ‘എന്നെ’ എന്നത് മശീഹയെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ വിശദീകരിക്കുക
  rationale: പൗലോസ് ഈ സങ്കീർത്തനവാക്യം മശീഹയ്ക്കു ബാധകമാക്കുന്നുവെങ്കിലും, ഉദ്ധരണിയുടെ ശബ്ദം സ്വതന്ത്രമായി നിലനിർത്തുന്നത് മൂലപാഠത്തിലെ ദൈവശാസ്ത്രപരമായ ബന്ധവും സംഘർഷവും സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. സങ്കീർത്തന ഉദ്ധരണിയുടെ കാവ്യാത്മക ഭാവം നിലനിർത്തിക്കൊണ്ട് അപൂർവമോ അതിപുരാതനമോ ആയ പദങ്ങൾ ഒഴിവാക്കി.
