  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: ml
  text: അതുകൊണ്ട്, ദൈവത്തെ സംബന്ധിച്ച കാര്യങ്ങളിൽ മശീഹ യേശുവിൽ എനിക്ക് അഭിമാനിക്കാൻ വകയുണ്ട്[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ ‘എനിക്ക് അഭിമാനിക്കാം’ അല്ലെങ്കിൽ ‘അഭിമാനിക്കാൻ എനിക്ക് അടിസ്ഥാനമുണ്ട്.’
    reason: lexical_alternative
  - marker: b
    text: ഗ്രീക്കിൽ ‘Χριστῷ Ἰησοῦ’ (‘ക്രിസ്തു യേശുവിൽ’); Χριστός ഇവിടെ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ യേശുവിൽ’ എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്നു.
    reason: alternative_reading
  - marker: c
    text: അഥവാ ‘ദൈവവുമായി ബന്ധപ്പെട്ട കാര്യങ്ങളിൽ’ അല്ലെങ്കിൽ ‘ദൈവകാര്യങ്ങളിൽ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: എനിക്ക് ... വകയുണ്ട്
  rationale: വർത്തമാനകാലത്തിലെ ഒന്നാംപുരുഷ ഏകവചന പ്രസ്താവനയെ സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു. καύχησιν എന്ന നാമത്തോടൊപ്പം ചേർന്ന് ‘അഭിമാനിക്കാൻ വകയുണ്ട്’ എന്ന ആശയം നൽകുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: καύχησιν
  choice: അഭിമാനിക്കാൻ വക
  rationale: ‘അഭിമാനം/അഭിമാനിക്കൽ’ എന്ന പൗലോസിന്റെ ആവർത്തിച്ചുവരുന്ന ആശയബന്ധം നിലനിർത്തുന്നതിനൊപ്പം, ഈ സന്ദർഭത്തിലെ ‘അഭിമാനിക്കാൻ അടിസ്ഥാനം’ എന്ന പ്രയോഗാർഥം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: മശീഹയായ യേശുവിൽ
  rationale: ἐν എന്നതിനെ ‘-യിൽ’ എന്നു നിലനിർത്തി ഐക്യം അഥവാ പ്രവർത്തനമണ്ഡലം സൂചിപ്പിക്കുന്നു; Χριστός ഇവിടെ സജീവമായ സ്ഥാനപ്പേരായതിനാൽ ‘മശീഹ’ എന്നു വിവർത്തനം ചെയ്യുന്നു.
- source_word: τὰ πρὸς τὸν θεόν
  choice: ദൈവത്തെ സംബന്ധിച്ച കാര്യങ്ങളിൽ
  rationale: ദൈവവുമായി ബന്ധപ്പെട്ട ശുശ്രൂഷാപരമോ മറ്റു കാര്യങ്ങളോ ഉൾക്കൊള്ളാവുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വിശാലത കാത്തുസൂക്ഷിക്കുന്നു; അതിനെ പുരോഹിതശുശ്രൂഷയിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: θεόν
  choice: ദൈവം
  rationale: ഈ സന്ദർഭത്തിലെ θεός എന്ന പദത്തിന്റെ സാധാരണവും വ്യക്തവുമായ മലയാളരൂപം.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός യേശുവിന്റെ സ്ഥാനപ്പേരായി അർഥസജീവമാണ്; അതിനാൽ ലിപ്യന്തരണം ചെയ്യാതെ സ്ഥാനപ്പേരിന്റെ അർഥം വിവർത്തനം ചെയ്യുന്നു.
- issue: പൗലോസിന്റെ καύχησις എന്ന അവകാശവാദത്തിന്റെ സ്വഭാവം
  choice: ദൈവത്തെ സംബന്ധിച്ച കാര്യങ്ങളിൽ മശീഹയായ യേശുവിൽ അഭിമാനിക്കാൻ തനിക്കു വകയുണ്ടെന്ന് പൗലോസ് പറയുന്നു
  alternative: പൗലോസ് പൊതുവായ ആത്മവിശ്വാസമോ വെറും വ്യക്തിപരമായ ആഹ്ലാദമോ മാത്രമാണ് പ്രകടിപ്പിക്കുന്നത്
  rationale: ‘മശീഹയായ യേശുവിൽ’, ‘ദൈവത്തെ സംബന്ധിച്ച കാര്യങ്ങളിൽ’ എന്നീ പരിധികൾ നിലനിർത്തുന്നു; എന്നാൽ അഭിമാനത്തിന്റെ കൃത്യസ്വഭാവം വിശദീകരിച്ച് വാക്യത്തിൽ ചേർക്കാതെ അതിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘വകയുണ്ട്’ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന രീതിയിൽ അവകാശത്തിന്റെയും അടിസ്ഥാനത്തിന്റെയും ഭാവം നൽകുന്നു; വാക്യത്തിന്റെ ഔപചാരിക ഗൗരവവും നിലനിർത്തുന്നു.
