id: ROM.15.11
reference: Romans 15:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: ml
  text: 'വീണ്ടും: “സകല ജനതകളേ[b], കർത്താവിനെ[a] സ്തുതിക്കുവിൻ; സകല ജനങ്ങളും അവനെ പുകഴ്ത്തട്ടെ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “യഹോവയെ.” ഈ ഉദ്ധരണിയുടെ എബ്രായമൂലത്തിൽ ദൈവനാമം ഉപയോഗിച്ചിരിക്കുന്നു; ഗ്രീക്ക് തിരുവെഴുത്തുപാഠത്തിൽ അതിനെ κύριος (“കർത്താവ്”) എന്നു പ്രതിനിധീകരിക്കുന്നു.
    reason: alternative_reading
  - marker: b
    text: അഥവാ “സകല വിജാതീയരേ.” ἔθνη എന്ന ഗ്രീക്കുപദത്തിന് “ജനതകൾ” എന്നും “വിജാതീയർ” എന്നും അർഥമാകാം. ഇവിടെ ഉദ്ധരണിക്ക് സാർവത്രികമായ അർഥമുണ്ടെങ്കിലും വിജാതീയരെക്കുറിച്ചുള്ള പൗലോസിന്റെ വാദത്തിനും ഇത് യോജിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: പൗലോസ് ഉദ്ധരിക്കുന്ന മറ്റൊരു തിരുവെഴുത്തുവാക്യം അവതരിപ്പിക്കുന്ന സ്വാഭാവികമായ വ്യവഹാരസൂചകമാണിത്.
- source_word: Αἰνεῖτε
  choice: സ്തുതിക്കുവിൻ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന ആജ്ഞയുടെ ശക്തി നിലനിർത്തുന്ന, മാന്യവും വ്യക്തവുമായ മലയാളപ്രയോഗം.
- source_word: πάντα τὰ ἔθνη
  choice: സകല ജനതകളേ
  rationale: ἔθνη എന്നത് ‘ജനതകൾ’ എന്നും ‘വിജാതീയർ’ എന്നും അർഥമാക്കാം. ഉദ്ധരണിയിലെ സാർവത്രിക ആഹ്വാനം ‘ജനതകൾ’ നന്നായി പ്രകടിപ്പിക്കുന്നു; റോമർ 15-ലെ വിജാതീയസന്ദർഭം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τὸν κύριον
  choice: കർത്താവിനെ
  rationale: ഗ്രീക്ക് κύριος എന്ന പദത്തിന്റെ നേരിട്ടുള്ളതും പുതിയനിയമത്തിൽ സ്വാഭാവികവുമായ പരിഭാഷ. ഉദ്ധരിക്കപ്പെട്ട എബ്രായമൂലത്തിലെ ദൈവനാമസംബന്ധം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐπαινεσάτωσαν
  choice: പുകഴ്ത്തട്ടെ
  rationale: മൂന്നാംപുരുഷ ബഹുവചന ആജ്ഞയുടെ ആഹ്വാനസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു; ആദ്യ ക്രിയയുമായുള്ള പദവ്യത്യാസവും സൂക്ഷിക്കുന്നു.
- source_word: αὐτὸν
  choice: അവനെ
  rationale: മുൻപുള്ള ‘കർത്താവിനെ’ നേരിട്ട് സൂചിപ്പിക്കുന്ന സർവനാമം സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: πάντες οἱ λαοί
  choice: സകല ജനങ്ങളും
  rationale: ἔθνη എന്നതിന് ഉപയോഗിച്ച ‘ജനതകൾ’ എന്ന പദത്തിൽനിന്ന് λαοί-യുടെ വ്യത്യാസം സൂക്ഷിക്കുകയും സമാന്തരഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഇസ്രായേലിന്റെ ദൈവത്തെ സൂചിപ്പിക്കുന്ന പഴയനിയമ ഉദ്ധരണിയിലെ κύριος
  choice: കർത്താവ്
  alternative: യഹോവ
  rationale: റോമർ ലേഖനത്തിന്റെ ഗ്രീക്ക് പാഠത്തിൽ κύριος ആണുള്ളത്; അതിനാൽ മുഖ്യപാഠത്തിൽ ‘കർത്താവ്’ സ്വീകരിച്ചു. എന്നാൽ ഉദ്ധരണിയുടെ എബ്രായമൂലത്തിൽ ദൈവനാമം ഉള്ളതിനാൽ ‘യഹോവ’ എന്ന വായന അടിക്കുറിപ്പിൽ നൽകി.
- issue: യഹൂദർ–വിജാതീയർ എന്ന പൗലോസിന്റെ സന്ദർഭത്തിലെ ἔθνη
  choice: ജനതകൾ
  alternative: വിജാതീയർ
  rationale: ഉദ്ധരണിയുടെ ആരാധനാഹ്വാനം സാർവത്രികമായതിനാൽ വിശാലമായ ‘ജനതകൾ’ മുഖ്യപാഠത്തിൽ സ്വീകരിച്ചു; പൗലോസിന്റെ വാദത്തിലെ വിജാതീയസംബന്ധം നഷ്ടപ്പെടാതിരിക്കാൻ മറ്റർഥം അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ, തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച മാന്യമായ ശൈലി ഉപയോഗിച്ചു. ‘സ്തുതിക്കുവിൻ’ അല്പം ഔപചാരികമാണെങ്കിലും ബഹുവചന ആജ്ഞ വ്യക്തമായി നൽകുന്നു; ‘ജനതകൾ/ജനങ്ങൾ’ എന്ന വ്യത്യാസം ഗ്രീക്കിലെ ἔθνη/λαοί വ്യത്യാസം നിലനിർത്തുന്നു.
