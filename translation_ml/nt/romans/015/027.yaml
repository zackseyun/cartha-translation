id: ROM.15.27
reference: Romans 15:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: ml
  text: അങ്ങനെ ചെയ്യുന്നതിൽ അവർ സന്തോഷിച്ചു; വാസ്തവത്തിൽ, അവർ അവരോടു കടപ്പെട്ടവരുമാണ്. എന്തെന്നാൽ, യെഹൂദരല്ലാത്ത ജനതകൾ[a] അവരുടെ ആത്മീയ കാര്യങ്ങളിൽ[b] പങ്കാളികളായിട്ടുണ്ടെങ്കിൽ, അവർക്ക് ഭൗതിക കാര്യങ്ങളിൽ[c] ശുശ്രൂഷ ചെയ്യാൻ അവരും കടപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ജനതകൾ’ എന്നും, ‘വിജാതീയർ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഇവിടെ യെഹൂദരല്ലാത്ത ജനതകളെയാണ് സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: ‘അവരുടെ ആത്മീയ അനുഗ്രഹങ്ങളിൽ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിൽ അക്ഷരാർഥം ‘അവരുടെ ആത്മീയ കാര്യങ്ങളിൽ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ജഡിക കാര്യങ്ങളിൽ’ എന്നാണ്; ഇവിടെ ആത്മീയ കാര്യങ്ങൾക്ക് വിപരീതമായി ഭൗതികമോ ദേഹസംബന്ധമോ ആയ സഹായമാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: അങ്ങനെ ചെയ്യുന്നതിൽ അവർ സന്തോഷിച്ചു
  rationale: സന്ദർഭത്തിൽ മുൻവാക്യത്തിലെ സംഭാവനയെ സൂചിപ്പിക്കുന്ന പ്രവൃത്തി ഉൾക്കൊള്ളുകയും, മനസ്സോടെയുള്ള അംഗീകാരവും സന്തോഷവും സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: അവർ അവരോടു കടപ്പെട്ടവരുമാണ്
  rationale: ὀφειλέται സൂചിപ്പിക്കുന്ന ധാർമിക ബാധ്യതയെ വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: τὰ ἔθνη
  choice: ജനതകൾ
  rationale: ഗ്രീക്കിലെ പദത്തിന് അടുത്തുനിൽക്കുന്ന രൂപം; പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ യെഹൂദരല്ലാത്ത ജനങ്ങളെ സൂചിപ്പിക്കുന്നതായി അടിക്കുറിപ്പ് വ്യക്തമാക്കുന്നു.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: അവരുടെ ആത്മീയ കാര്യങ്ങളിൽ
  rationale: നാമീകരിച്ച വിശേഷണത്തിന്റെ തുറന്ന അർത്ഥം നിലനിർത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘അനുഗ്രഹങ്ങൾ’ എന്ന നാമം പ്രധാനവാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ἐκοινώνησαν
  choice: പങ്കുചേർന്നിട്ടുണ്ടെങ്കിൽ
  rationale: κοινωνέωയുടെ പങ്കാളിത്തബോധം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: ഭൗതിക കാര്യങ്ങൾകൊണ്ട്
  rationale: ആത്മീയ കാര്യങ്ങളോടുള്ള സന്ദർഭോചിതമായ വൈരുധ്യവും യെരൂശലേമിലേക്കുള്ള ഭൗതിക സഹായവും വ്യക്തമാക്കുന്നു; ഇവിടെ പാപസ്വഭാവം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: λειτουργῆσαι
  choice: ശുശ്രൂഷിക്കാനും
  rationale: സേവനത്തിന്റെ ഗൗരവവും സഹായപ്രവൃത്തിയുടെ സ്വഭാവവും നിലനിർത്തുന്നു; പുരോഹിതശുശ്രൂഷയിലേക്കു മാത്രം അർത്ഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: σαρκικοῖς എന്നതിന്റെ അർത്ഥം πνευματικοῖς എന്നതിനോടുള്ള വൈരുധ്യത്തിൽ
  choice: ഭൗതിക കാര്യങ്ങൾ
  alternative: ജഡിക കാര്യങ്ങൾ
  rationale: പണസഹായത്തിന്റെ തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ ഇത് ഭൗതികമോ ദേഹസംബന്ധമോ ആയ പിന്തുണയെ സൂചിപ്പിക്കുന്നു; പാപകരമായ ‘ജഡികത’യെ അല്ല.
- issue: αὐτῶν / αὐτοῖς സർവനാമങ്ങളുടെ സൂചന
  choice: യെരൂശലേമിലെ വിശുദ്ധർ/യെഹൂദവിശ്വാസികൾ
  alternative: വിശാലമായ അർത്ഥത്തിൽ ഇസ്രായേൽ
  rationale: റോമർ 15:25–26-ലെ അടുത്ത സന്ദർഭം യെരൂശലേമിലെ വിശുദ്ധർക്കായുള്ള സംഭാവനയാണ്; അതിനാൽ സർവനാമങ്ങൾ ഏറ്റവും നേരിട്ട് അവരെയാണ് സൂചിപ്പിക്കുന്നത്, എങ്കിലും വാദത്തിന് വിശാലമായ രക്ഷാചരിത്ര പശ്ചാത്തലമുണ്ട്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ശുശ്രൂഷിക്കുക’ എന്ന പദം മതപദവിയിലേക്കു ചുരുക്കാതെ സേവനബോധത്തിൽ ഉപയോഗിച്ചു. ഗ്രീക്കിലെ ആവർത്തിച്ച ബാധ്യതാഭാവവും ആത്മീയ–ഭൗതിക വൈരുധ്യവും നിലനിർത്തി.
