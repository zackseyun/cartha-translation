  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തിത തടസ്സവും തടസ്സപ്പെടുത്തിയ വ്യക്തി/കാരണം വ്യക്തമല്ലെന്നതും സംരക്ഷിച്ചിരിക്കുന്നു.
