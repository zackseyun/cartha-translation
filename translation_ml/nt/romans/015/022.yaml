  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: ml
  text: ഇക്കാരണത്താൽ ഞാനും പലപ്പോഴും നിങ്ങളുടെ അടുക്കൽ വരുന്നതിൽനിന്ന് തടയപ്പെട്ടിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “പല തവണ” അല്ലെങ്കിൽ “ആവർത്തിച്ച്”; τὰ πολλὰ എന്ന ഗ്രീക്ക് പ്രയോഗം ഒരു കാര്യം പലവട്ടം സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: അതുകൊണ്ടുതന്നെ
  rationale: മുൻവാക്യങ്ങളിലെ പൗലോസിന്റെ ദൗത്യവിവരണത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമാക്കുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ കാരണ-നിഗമന പ്രയോഗമാണ്.
- source_word: καὶ
  choice: -തന്നെ
  rationale: ഇവിടെ മുൻപറഞ്ഞ കാര്യവുമായി പൗലോസിന്റെ അനുഭവത്തെ ബന്ധിപ്പിക്കുന്ന ചേർക്കൽ/ഊന്നൽഭാവം നൽകുന്നു; Διὸ καὶ എന്ന സംയുക്തത്തിന്റെ സ്വാഭാവിക മലയാളരൂപമായി ഉപയോഗിച്ചു.
- source_word: ἐνεκοπτόμην
  choice: ഞാൻ ... തടയപ്പെട്ടു
  rationale: അപൂർണ്ണഭൂതകാലത്തിലെ ആവർത്തിതമോ തുടർച്ചയായതോ ആയ തടസ്സം സൂചിപ്പിക്കുകയും, തടസ്സപ്പെടുത്തിയ കർത്താവിനെ നിർണയിക്കാതെ ഗ്രീക്കിലെ നിഷ്ക്രിയഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὰ πολλὰ
  choice: പലപ്പോഴും
  rationale: പല തവണ ആവർത്തിച്ചു സംഭവിച്ചതിനെ സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണപരമായ ഗ്രീക്ക് ശൈലിയെ വ്യക്തവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: τοῦ ἐλθεῖν
  choice: വരുന്നതിൽനിന്ന്
  rationale: തടയപ്പെട്ട പ്രവൃത്തിയെ നേരിട്ട് വ്യക്തമാക്കുന്ന articular infinitive-ന്റെ പ്രവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ
  rationale: റോമിലെ വിശ്വാസികളുടെ അടുത്തേക്കുള്ള ദിശയും വ്യക്തിപരമായ സമീപനവും സൂചിപ്പിക്കുന്നു; ‘വരുക’ എന്ന ക്രിയയോടൊപ്പം സ്വാഭാവികമാണ്.
