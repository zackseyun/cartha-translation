id: ROM.15.28
reference: Romans 15:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: ml
  text: അതുകൊണ്ട്, ഈ കാര്യം പൂർത്തിയാക്കി ഈ ഫലം അവർക്കു മുദ്രവെച്ചശേഷം[a][b], ഞാൻ നിങ്ങളുടെ വഴി സ്പെയിനിലേക്കു പോകും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അവർക്കു ഈ ഫലം സുരക്ഷിതമായി ഏല്പിച്ചശേഷം’ എന്നും വിവർത്തനം ചെയ്യാം. ‘മുദ്രവെക്കുക’ എന്ന ക്രിയ, സ്വീകർത്താക്കൾക്കുള്ള ഈ സംഭാവന ഔപചാരികമായി ഉറപ്പാക്കി ഏല്പിക്കുന്നതിനെ സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: ‘ഈ ഫലം’ എന്നത് ജാതികളിൽനിന്നുള്ള വിശ്വാസികൾ യെരൂശലേമിലെ വിശുദ്ധർക്കുവേണ്ടി ശേഖരിച്ച ധനസഹായത്തെ സൂചിപ്പിക്കുന്നു.
    reason: cultural_note
  - marker: c
    text: ‘നിങ്ങളിലൂടെ’ എന്നും വിവർത്തനം ചെയ്യാം. സ്പെയിനിലേക്കുള്ള യാത്രയിൽ റോം വഴി പോകാനാണ് പൗലോസ് ഉദ്ദേശിക്കുന്നതെന്നായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: അതുകൊണ്ട്, ഈ കാര്യം പൂർത്തിയാക്കി
  rationale: οὖν മുൻവിവരണവുമായി നിഗമനപരമായ ബന്ധം സൂചിപ്പിക്കുന്നു; τοῦτο മുമ്പ് പറഞ്ഞ ധനശേഖരണവും അതിന്റെ ഏല്പിക്കലും ഉൾപ്പെടുന്ന കാര്യത്തെ സൂചിപ്പിക്കുന്നു. ἐπιτελέσας പ്രധാന ഭാവിക്രിയയ്ക്കു മുമ്പ് പൂർത്തിയാകുന്ന പ്രവൃത്തിയാണ്.
- source_word: σφραγισάμενος αὐτοῖς
  choice: അവർക്കായി മുദ്രവെച്ചശേഷം
  rationale: σφραγίζω എന്നതിന്റെ ദൃശ്യരൂപകം നിലനിർത്തുന്നു. സന്ദർഭത്തിൽ സംഭാവന സ്വീകർത്താക്കൾക്കു ഔപചാരികമായും സുരക്ഷിതമായും ഏല്പിച്ചുറപ്പിക്കുന്നതെന്ന ആശയം ഉണ്ടായേക്കാം; αὐτοῖς എന്ന ദാതിവിന് സ്വാഭാവികമായി ‘അവർക്കായി’ നൽകി.
- source_word: τὸν καρπὸν τοῦτον
  choice: ഈ ഫലം
  rationale: ജാതിവിശ്വാസികളുടെ ഉദാരതയുടെ മൂർത്തമായ ഫലമായ യെരൂശലേമിലേക്കുള്ള ധനസഹായത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം വിവർത്തനത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀπελεύσομαι
  choice: ഞാൻ … പോകും
  rationale: തുടർന്നുള്ള യാത്രയെ സൂചിപ്പിക്കുന്ന ഭാവിക്രിയ; മലയാളത്തിൽ ‘പോകും’ സ്വാഭാവികവും അർഥപര്യാപ്തവുമാണ്.
- source_word: δι’ ὑμῶν
  choice: നിങ്ങളുടെ വഴി
  rationale: διά + genitive ഇവിടെ റോമിലുള്ള വായനക്കാരുടെ ഇടം വഴിയായുള്ള യാത്രയെ സൂചിപ്പിക്കുന്നു. അവരുടെ സഹായവും സൂചനയിൽ ഉണ്ടായേക്കാമെങ്കിലും മുഖ്യപാഠത്തിൽ അതു നിർബന്ധമായി ചേർക്കുന്നില്ല.
- source_word: εἰς Σπανίαν
  choice: സ്പെയിനിലേക്കു
  rationale: ലക്ഷ്യസ്ഥാനത്തിലേക്കുള്ള ദിശ സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: യെരൂശലേം സംഭാവനയുമായി ബന്ധപ്പെട്ട ‘മുദ്രവെക്കുക’ എന്ന രൂപകത്തിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘മുദ്രവെച്ചശേഷം’ എന്ന രൂപകം നിലനിർത്തി.
  alternative: ‘സുരക്ഷിതമായി ഏല്പിച്ചശേഷം’ അല്ലെങ്കിൽ ‘ലഭിക്കുമെന്ന് ഉറപ്പാക്കിയശേഷം’
  rationale: ഇത് ഉപദേശപരമായ നിർണായക വിഷയം അല്ലെങ്കിലും വ്യാഖ്യാനപരമായ തുറന്നത്വമുണ്ട്. രൂപകം മാറ്റാതെ സൂക്ഷിക്കുന്നത് σφραγισάμενος എന്ന പദത്തിന്റെ സാക്ഷ്യം നിലനിർത്തുന്നു; സാധ്യതയുള്ള സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്കു ഗ്രാഹ്യവുമായ മലയാളം. ‘ഫലം’, ‘മുദ്രവെക്കുക’ എന്നീ മൂലപാഠരൂപകങ്ങൾ നിലനിർത്തി; അവയുടെ സന്ദർഭാർഥം അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
