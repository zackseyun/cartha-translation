  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: ml
  text: 'എന്റെ സഹോദരങ്ങളേ,[a] നിങ്ങളെക്കുറിച്ച് എനിക്കുതന്നെ ഉറപ്പുണ്ട്: നിങ്ങളുംതന്നെ നന്മ നിറഞ്ഞവരും സകല അറിവുകൊണ്ട് നിറഞ്ഞവരും പരസ്പരം ഉപദേശിക്കാൻ[b] കഴിവുള്ളവരുമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “സഹോദരങ്ങൾ” എന്നു വിവർത്തനം ചെയ്തിരിക്കുന്ന ഗ്രീക്ക് പദമായ adelphoi, സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടുന്ന സഹവിശ്വാസികളുടെ കൂട്ടത്തെ അഭിസംബോധന ചെയ്യാനും ഉപയോഗിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “പരസ്പരം ബുദ്ധിയുപദേശിക്കാൻ” അല്ലെങ്കിൽ “പരസ്പരം മുന്നറിയിപ്പു നൽകാൻ.”
    reason: lexical_alternative
lexical_decisions:
