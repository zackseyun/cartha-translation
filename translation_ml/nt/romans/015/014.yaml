- source_word: δέ
  choice: പ്രത്യേക പദമായി വിവർത്തനം ചെയ്തിട്ടില്ല
  rationale: ഇവിടെ ശക്തമായ വൈരുധ്യമല്ല, മൃദുവായ ആശയമാറ്റമാണ്; മലയാള വാക്യക്രമത്തിൽ പ്രത്യേക സംയോജകപദമില്ലാതെയും അത് സ്വാഭാവികമായി പ്രകടമാകുന്നു.
- source_word: ἀδελφοί μου
  choice: എന്റെ സഹോദരങ്ങളേ
