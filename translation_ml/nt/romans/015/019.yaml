    rationale: Neither 'ദൈവത്തിന്റെ ആത്മാവ്' nor 'പരിശുദ്ധാത്മാവ്' is presented by the supplied SBLGNT source as a textual reading. The note must describe these as translation alternatives, not as readings in different manuscripts.
