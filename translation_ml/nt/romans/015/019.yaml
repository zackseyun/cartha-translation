id: ROM.15.19
reference: Romans 15:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: ml
  text: അടയാളങ്ങളുടെയും അത്ഭുതങ്ങളുടെയും ശക്തിയാലും ആത്മാവിന്റെ ശക്തിയാലും[a], അങ്ങനെ യെരൂശലേം മുതൽ ചുറ്റുമുള്ള പ്രദേശങ്ങളിലാകെ ഇല്ലിരിക്കം വരെ ഞാൻ മശീഹയുടെ സുവിശേഷം പൂർണമായി പ്രഘോഷിച്ചിരിക്കുന്നു.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “പരിശുദ്ധാത്മാവിന്റെ ശക്തിയാൽ.”'
    reason: alternative_translation
  - marker: b
    text: 'കൂടുതൽ അക്ഷരാനുസൃതമായി: “മശീഹയുടെ സുവിശേഷം ഞാൻ നിറവേറ്റിയിരിക്കുന്നു”; അഥവാ, അതിന്റെ പ്രഘോഷണം പൂർത്തിയാക്കിയിരിക്കുന്നു.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει σημείων καὶ τεράτων
  choice: അടയാളങ്ങളുടെയും അത്ഭുതങ്ങളുടെയും ശക്തിയാൽ
  rationale: ἐν δυνάμει എന്നത് ഇവിടെ പ്രവർത്തനമാർഗമോ പ്രാബല്യമുള്ള ശക്തിയോ സൂചിപ്പിക്കുന്നു. σημείων καὶ τεράτων എന്ന പതിവുജോടി അതിന്റെ രണ്ടു ഘടകങ്ങളും നിലനിർത്തി സ്വാഭാവികമായ മലയാളത്തിൽ നൽകി.
- source_word: ἐν δυνάμει πνεύματος
  choice: ആത്മാവിന്റെ ശക്തിയാൽ
  rationale: ആവർത്തിക്കുന്ന ἐν δυνάμει എന്ന ഘടന നിലനിർത്തുന്നു. പൗലോസിന്റെ സന്ദർഭത്തിൽ πνεύματος പരിശുദ്ധാത്മാവിനെയാണ് ഏറ്റവും സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്; എന്നാൽ മൂലപാഠത്തിൽ ἁγίου ഇല്ലാത്തതിനാൽ മുഖ്യപാഠത്തിൽ ‘പരിശുദ്ധ’ എന്നു ചേർത്തിട്ടില്ല.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: യെരൂശലേംമുതൽ ചുറ്റുമുള്ള പ്രദേശങ്ങളിലാകെ
  rationale: κύκλῳ ഇവിടെ ഭൂമിശാസ്ത്രപരമായി ചുറ്റുമുള്ള മേഖലകളെ വ്യാപകമായി സൂചിപ്പിക്കുന്ന ക്രിയാവിശേഷണമാണ്. മലയാളത്തിൽ അർഥം വ്യക്തമായി ലഭിക്കാൻ ‘പ്രദേശങ്ങളിലാകെ’ എന്നു വ്യക്തമാക്കി.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: ഇല്ലൂരിക്കോൻവരെ
  rationale: μέχρι യാത്രയുടെയോ ശുശ്രൂഷാവ്യാപ്തിയുടെയോ അറ്റം സൂചിപ്പിക്കുന്നു. Ἰλλυρικόν എന്ന സ്ഥലനാമം മലയാള ലിപ്യന്തരണത്തിൽ നൽകി.
- source_word: πεπληρωκέναι
  choice: പൂർണമായി പ്രഘോഷിച്ചിരിക്കുന്നു
  rationale: സുവിശേഷത്തെ ഒരു വിശാലപ്രദേശത്ത് പൂർണമായി അറിയിച്ചതോ അതിന്റെ പ്രഘോഷണം നിറവേറ്റിയതോ ആണ് സന്ദർഭാർഥം. ഗ്രീക്കിലെ perfect രൂപം സൂചിപ്പിക്കുന്ന പൂർത്തിയായ ഫലം ‘പ്രഘോഷിച്ചിരിക്കുന്നു’ എന്നതിലൂടെ നിലനിർത്തി.
- source_word: τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: മശീഹയുടെ സുവിശേഷം
  rationale: εὐαγγέλιον എന്നതിന് സഭാപരവും പൊതുവായി മനസ്സിലാകുന്നതുമായ ‘സുവിശേഷം’ ഉപയോഗിച്ചു. Χριστός ഇവിടെ അർഥവത്തായ പദവിയായതിനാൽ ‘മശീഹ’ എന്നു നൽകി; genitive-ന്റെ ബന്ധം അമിതമായി വിശദീകരിക്കാതെ നിലനിർത്തി.
theological_decisions:
- issue: πνεύματος എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: ആത്മാവ്—സന്ദർഭത്തിൽ പരിശുദ്ധാത്മാവ്
  alternative: ‘പരിശുദ്ധാത്മാവ്’ എന്ന് വ്യക്തമായി വിവർത്തനം ചെയ്യുക; അല്ലെങ്കിൽ പൊതുവായ ‘ആത്മാവ്’ എന്ന് ഗ്രഹിക്കുക
  rationale: അടയാളങ്ങളും അത്ഭുതങ്ങളും ഉൾപ്പെടുന്ന ദൈവികമായി ശക്തിപ്പെടുത്തപ്പെട്ട അപ്പൊസ്തലശുശ്രൂഷയുടെ സന്ദർഭം പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും മൂലപാഠത്തിൽ വിശേഷണം ഇല്ലാത്തതിനാൽ മുഖ്യവാക്യം അതിനെ ചേർക്കുന്നില്ല.
- issue: πεπληρωκέναι τὸ εὐαγγέλιον എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: സുവിശേഷം പൂർണമായി പ്രഘോഷിച്ചു
  alternative: സുവിശേഷം നിറവേറ്റി / സുവിശേഷപ്രഘോഷണം പൂർത്തിയാക്കി
  rationale: ‘സുവിശേഷം നിറവേറ്റി’ എന്ന അക്ഷരാനുസൃത രൂപം മലയാളത്തിൽ തെറ്റിദ്ധാരണയുണ്ടാക്കാം. ഭൂമിശാസ്ത്രപരമായ ശുശ്രൂഷാവ്യാപ്തിയുടെ സന്ദർഭത്തിൽ സുവിശേഷം പൂർണമായി അറിയിച്ചതാണ് ഉദ്ദേശമെന്ന് പ്രകടമാക്കുന്നു; ‘നിറവേറ്റി’ എന്ന രൂപം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
- issue: τοῦ Χριστοῦ എന്ന genitive ബന്ധം
  choice: മശീഹയുടെ സുവിശേഷം
  alternative: മശീഹയെക്കുറിച്ചുള്ള സുവിശേഷം
  rationale: ഗ്രീക്ക് പ്രയോഗം ഉടമസ്ഥത, ഉത്ഭവം, ഉള്ളടക്കം എന്നീ ബന്ധങ്ങളിൽ ഒന്നിലധികം സൂചനകൾ അനുവദിക്കുന്നു. ‘മശീഹയുടെ’ എന്നത് ആ സങ്കീർണത അനാവശ്യമായി തീർപ്പാക്കാതെ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാക്യത്തിലെ സമാന്തരമായ ‘ശക്തിയാൽ’ ഘടന നിലനിർത്തി. സ്ഥലനാമങ്ങൾ മലയാള ബൈബിൾ വായനക്കാർക്ക് പരിചിതമായ രൂപങ്ങളോട് ചേർന്ന ലിപ്യന്തരണത്തിൽ നൽകി; ദുർഗ്രാഹ്യമായ അക്ഷരാനുവാദത്തിനു പകരം സന്ദർഭാർഥം മുഖ്യപാഠത്തിൽ വ്യക്തമാക്കി, യഥാർഥ പദസാദ്ധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
