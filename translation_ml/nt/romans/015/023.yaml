source:
  edition: SBLGNT
  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, ഈ പ്രദേശങ്ങളിൽ എനിക്ക് ഇനി ഇടമില്ലാത്തതിനാലും[a] അനേകം വർഷങ്ങളായി നിങ്ങളുടെ അടുക്കൽ വരാൻ ഞാൻ ആഗ്രഹിച്ചുകൊണ്ടിരിക്കുന്നതിനാലും,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അക്ഷരാർഥത്തിൽ, “ഈ പ്രദേശങ്ങളിൽ ഇനി ഇടമില്ലാത്തതിനാൽ.” ഇവിടെ ഗ്രീക്ക് പ്രയോഗം ഭൗതികമായ സ്ഥലമില്ലായ്മയെക്കാൾ, അവിടെ തന്റെ ശുശ്രൂഷ തുടരാൻ ശേഷിക്കുന്ന പ്രവർത്തനപരിധിയോ അവസരമോ ഇല്ലെന്ന അർഥം നൽകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: എന്നാൽ ഇപ്പോൾ
  rationale: δέയുടെ സന്ദർഭമാറ്റവും νυνίയുടെ വർത്തമാനകാലസൂചനയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: μηκέτι τόπον ἔχων
  choice: എനിക്ക് ഇനി പ്രവർത്തിക്കാൻ ഇടമില്ലാത്തതിനാൽ
  rationale: μηκέτιയുടെ ‘ഇനി ഇല്ല’ എന്ന അർഥവും τόπον ἔχων എന്ന പ്രയോഗത്തിന്റെ ശുശ്രൂഷയ്ക്കുള്ള ഇടം/സാധ്യത എന്ന സന്ദർഭാർഥവും വ്യക്തമാക്കുന്നു; ഇത് വെറും ഭൗതികസ്ഥാനമെന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: ഈ പ്രദേശങ്ങളിൽ
  rationale: κλίμασι സൂചിപ്പിക്കുന്ന ഭൂമിശാസ്ത്രപരമായ മേഖലകളെ വ്യക്തവും സാധാരണവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐπιποθίαν ... ἔχων
  choice: ആഗ്രഹിച്ചുകൊണ്ടിരിക്കുന്നതിനാൽ
  rationale: ശക്തവും തുടർന്നുനിൽക്കുന്നതുമായ ആഗ്രഹത്തെ സ്വാഭാവിക മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു; ἀπὸ ἱκανῶν ἐτῶν എന്ന കാലദൈർഘ്യവുമായി യോജിക്കുന്നു.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വരാൻ
  rationale: ഗ്രീക്കിലെ infinitival content നേരിട്ട് നിലനിർത്തുന്നു; ‘സന്ദർശിക്കാൻ’ എന്ന അധിക സൂക്ഷ്മാർഥം ചേർക്കുന്നില്ല.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: അനേകം വർഷങ്ങളായി
  rationale: ഭൂതകാലത്തിൽ ആരംഭിച്ച് ഇപ്പോഴും തുടരുന്ന ദൈർഘ്യം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: τόπον ἔχων എന്നതിന്റെ അർഥവ്യാപ്തി
  choice: മുഖ്യവാചകത്തിൽ ‘പ്രവർത്തിക്കാൻ ഇടം’
  alternative: ‘ഇടം’ അല്ലെങ്കിൽ ‘അവസരം’
  rationale: റോമർ 15-ലെ മിഷനറി സന്ദർഭം പ്രവർത്തനപരിധിയെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപകാത്മക വ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു; പ്രത്യേക സഭാപരമായ വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഈ വാക്യം അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന ദീർഘവാക്യത്തിന്റെ ഭാഗമായതിനാൽ അവസാനത്തിൽ കോമ നിലനിർത്തി. രണ്ട് participial ഘടകങ്ങളും മലയാളത്തിൽ കാരണസൂചകമായ ‘-തിനാൽ’ ഘടനകളാക്കി, വാക്യബന്ധം വ്യക്തമായി സൂക്ഷിച്ചു.
