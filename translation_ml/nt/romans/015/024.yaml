id: ROM.15.24
reference: Romans 15:24
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: ml
  text: ഞാൻ സ്പെയിനിലേക്കു[a] പോകുമ്പോഴെല്ലാം—കാരണം, വഴിയിൽ നിങ്ങളെ കാണാനും, ആദ്യം നിങ്ങളോടൊപ്പമുള്ള കൂട്ടായ്മയിൽ എനിക്കു കുറച്ചെങ്കിലും സംതൃപ്തി ലഭിച്ചാൽ[c], അവിടേക്കുള്ള യാത്രയ്ക്കായി നിങ്ങളാൽ യാത്രയയക്കപ്പെടാനും[b] ഞാൻ പ്രത്യാശിക്കുന്നു—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ഞാൻ സ്പെയിനിലേക്കു പോകുമ്പോൾ’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്ക് പ്രയോഗം അനിശ്ചിതമായ ഒരു ഭാവിസമയത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: ‘അവിടേക്കുള്ള യാത്രയിൽ നിങ്ങൾ എന്നെ സഹായിക്കാനും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഈ ക്രിയയ്ക്ക് തുടർയാത്രയ്ക്കായി സഹായിക്കുക, യാത്രയാക്കുക, അല്ലെങ്കിൽ അനുഗമിക്കുക എന്ന അർഥമുണ്ടാകാം.
    reason: lexical_alternative
  - marker: c
    text: അക്ഷരാർഥത്തിൽ, ‘ആദ്യം നിങ്ങളെക്കൊണ്ട് ഭാഗികമായി നിറഞ്ഞാൽ.’ ഇത് മുന്നോട്ടുപോകുന്നതിനു മുമ്പ് അവരോടൊപ്പമുള്ള പരിമിതമായ കൂട്ടായ്മയിൽ സംതൃപ്തി നേടുന്നതിനെ സൂചിപ്പിക്കുന്നതായി തോന്നുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: ഞാൻ ... പോകുമ്പോൾ
  rationale: ὡς ἄν സഹിതമുള്ള subjunctive അനിശ്ചിതമായ ഭാവികാലസൂചന നൽകുന്നു. മലയാളത്തിൽ ‘പോകുമ്പോൾ’ സ്വാഭാവികമായി ഈ ഭാവിസന്ദർഭം വഹിക്കുന്നു; അതിന്റെ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: Σπανίαν
  choice: സ്പെയിനിലേക്കു
  rationale: സ്ഥലനാമത്തിന്റെ ആധുനിക മലയാളരൂപം.
- source_word: ἐλπίζω γὰρ
  choice: ഞാൻ പ്രത്യാശിക്കുന്നു
  rationale: ἐλπίζω ആഗ്രഹത്തോടുകൂടിയ പ്രതീക്ഷയെ സൂചിപ്പിക്കുന്നു. γάρ നൽകുന്ന വിശദീകരണബന്ധം മലയാളത്തിലെ വാക്യഘടനയും ദീർഘവിരാമവും വഴി സ്വാഭാവികമായി പ്രതിഫലിക്കുന്നു.
- source_word: διαπορευόμενος
  choice: വഴിമധ്യേ
  rationale: മറ്റൊരു ലക്ഷ്യസ്ഥാനത്തേക്കുള്ള യാത്രയ്ക്കിടെ കടന്നുപോകുന്നതാണ് സന്ദർഭം; ‘വഴിമധ്യേ’ ചുരുക്കവും സ്വാഭാവികവുമാണ്.
- source_word: θεάσασθαι ὑμᾶς
  choice: നിങ്ങളെ കാണാമെന്നും
  rationale: വ്യക്തിപരമായ കൂടിക്കാഴ്ചയെ സൂചിപ്പിക്കുന്ന ലളിതവും സ്വാഭാവികവുമായ വിവർത്തനം.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: അവിടേക്കുള്ള യാത്രയ്ക്കായി നിങ്ങൾ എന്നെ യാത്രയാക്കുമെന്നും
  rationale: προπέμπω തുടർയാത്രയ്ക്കായി അയയ്ക്കുക, സഹായിക്കുക, ചിലപ്പോൾ അനുഗമിക്കുക എന്നീ ആശയങ്ങൾ ഉൾക്കൊള്ളാം. ‘യാത്രയാക്കുക’ പിന്തുണയുടെ കൃത്യരൂപം നിർണ്ണയിക്കാതെ പൊതുവായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: '... സംതൃപ്തി നേടിയശേഷം'
  rationale: വ്യവസ്ഥാപരമായ ഭാവിസാധ്യതയെ മലയാളത്തിൽ സുതാര്യമായി അവതരിപ്പിക്കുന്നു. ‘സംതൃപ്തി നേടുക’ എന്നത് നിറയുക എന്ന രൂപകത്തിന്റെ സന്ദർഭോചിതമായ സ്വാഭാവിക അർഥം നൽകുന്നു.
- source_word: ὑμῶν πρῶτον ἀπὸ μέρους
  choice: ആദ്യം നിങ്ങളുടെ കൂട്ടായ്മയിൽ കുറച്ചെങ്കിലും
  rationale: πρῶτον സമയക്രമം സൂചിപ്പിക്കുന്നു; ἀπὸ μέρους പൂർണതയല്ലാത്ത അളവോ പരിമിതമായ അവസരമോ തുറന്നുവെക്കുന്നു. ὑμῶν എന്ന ബന്ധസൂചനയെ ‘നിങ്ങളുടെ കൂട്ടായ്മയിൽ’ എന്ന് സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: റോമിലെ വിശ്വാസികൾ നൽകുമെന്ന് പൗലോസ് പ്രതീക്ഷിച്ച സഹായത്തിന്റെ സ്വഭാവം
  choice: ‘നിങ്ങൾ എന്നെ യാത്രയാക്കുക’ എന്ന് പൊതുവായി വിവർത്തനം ചെയ്തു.
  alternative: ‘യാത്രയിൽ എന്നെ സഹായിക്കുക’ അല്ലെങ്കിൽ ‘എന്നെ അനുഗമിച്ച് അയയ്ക്കുക.’
  rationale: മൂലക്രിയ ഭൗതികസഹായം, യാത്രാസജ്ജീകരണം, അനുഗമിക്കൽ എന്നിവ ഉൾക്കൊള്ളാമെങ്കിലും അവയിൽ ഒന്നിനെ മാത്രം പാഠം നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ പ്രത്യേക സഭാ-മിഷൻ സംവിധാനമോ സാമ്പത്തികസഹായമോ ചേർത്തിട്ടില്ല.
- issue: റോമക്കാരോടൊപ്പമുള്ള പൗലോസിന്റെ പ്രതീക്ഷിത സംതൃപ്തി
  choice: ‘നിങ്ങളുടെ കൂട്ടായ്മയിൽ കുറച്ചെങ്കിലും സംതൃപ്തി നേടുക.’
  alternative: ‘നിങ്ങളാൽ ഭാഗികമായി നിറയുക’ അല്ലെങ്കിൽ ‘കുറച്ചുകാലം നിങ്ങളുടെ കൂട്ടായ്മ ആസ്വദിക്കുക.’
  rationale: ἐμπλησθῶ എന്ന നിറവിന്റെ ആശയവും ἀπὸ μέρους എന്ന പരിമിതിയും സന്ദർഭത്തിൽ ബന്ധപരമായ സംതൃപ്തിയെ സൂചിപ്പിക്കുന്നു. എന്നാൽ അത് വികാരപരമായ നിറവാണോ സമയപരിമിതിയാണോ എന്ന് കൃത്യമായി തീർപ്പാക്കാതെ അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. നീണ്ട ഗ്രീക്ക് വാക്യത്തിന്റെ യാത്രാക്രമവും വ്യവസ്ഥാപരതയും നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിൽ വായനാസൗകര്യം ഉറപ്പാക്കി. വാക്യം അടുത്ത വാക്യത്തിലേക്ക് തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമം നിലനിർത്തി.
