id: ROM.15.13
reference: Romans 15:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: ml
  text: പരിശുദ്ധാത്മാവിന്റെ ശക്തിയാൽ നിങ്ങൾ പ്രത്യാശയിൽ സമൃദ്ധരാകേണ്ടതിന്, പ്രത്യാശയുടെ ദൈവം നിങ്ങൾ വിശ്വസിക്കുന്നതിൽ സകല സന്തോഷവും സമാധാനവുംകൊണ്ട് നിങ്ങളെ നിറയ്ക്കട്ടെ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: പ്രത്യാശയുടെ ദൈവം
  rationale: δὲ ഇവിടെ നേരിയ ബന്ധസൂചകമാണ്; മലയാളത്തിൽ പ്രത്യേക പദം ചേർക്കാതെ വാക്യബന്ധം സ്വാഭാവികമായി നിലനിർത്താം. τῆς ἐλπίδος എന്ന പ്രയോഗത്തിന്റെ സ്രോതസ്സ്/സ്വഭാവസൂചനയിലെ തുറന്നത്വം ‘പ്രത്യാശയുടെ ദൈവം’ സംരക്ഷിക്കുന്നു.
- source_word: πληρώσαι
  choice: നിറയ്ക്കട്ടെ
  rationale: ആശംസയോ പ്രാർഥനയോ സൂചിപ്പിക്കുന്ന aorist optative മലയാളത്തിൽ ‘നിറയ്ക്കട്ടെ’ എന്നു സ്വാഭാവികമായി വരുന്നു; നിറവിന്റെ രൂപകവും നിലനിൽക്കുന്നു.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: സകല സന്തോഷവും സമാധാനവുംകൊണ്ട്
  rationale: πληρόω-യോടൊപ്പമുള്ള content genitives നിറയ്ക്കപ്പെടുന്നതിന്റെ ഉള്ളടക്കം പറയുന്നു. ‘സകല’ πάσης എന്ന പദത്തിന്റെ സമഗ്രത വ്യക്തമാക്കുന്നു.
- source_word: ἐν τῷ πιστεύειν
  choice: നിങ്ങൾ വിശ്വസിക്കുന്നതിൽ
  rationale: ἐν + articular infinitive വിശ്വസിക്കുന്ന പ്രവൃത്തിയുടെയോ അവസ്ഥയുടെയോ മേഖലയെ/സാഹചര്യത്തെ സൂചിപ്പിക്കുന്നു. ‘വിശ്വാസത്തിൽ’ എന്ന നാമരൂപത്തേക്കാൾ ഗ്രീക്കിലെ ക്രിയാത്മകത ഇത് കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: അങ്ങനെ ... നിങ്ങൾ ... സമൃദ്ധരാകട്ടെ
  rationale: εἰς τὸ + infinitive ഉദ്ദേശ്യമോ ഫലമോ സൂചിപ്പിക്കാം. പ്രാർഥനാസന്ദർഭത്തിൽ ‘അങ്ങനെ’ ഈ ബന്ധം വ്യക്തമാക്കുകയും അതിനെ അനാവശ്യമായി ഒരൊറ്റ വിഭാഗമായി തീർപ്പാക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐν τῇ ἐλπίδι
  choice: പ്രത്യാശയിൽ
  rationale: ἐν എന്നതിന്റെ മേഖലാസൂചന നിലനിർത്തുന്നു; വാക്യത്തിന്റെ ആദ്യഭാഗത്തിലെ ἐλπίδος-നോടുള്ള പദബന്ധവും ‘പ്രത്യാശ’ ആവർത്തിക്കുന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
- source_word: ἐν δυνάμει
  choice: ശക്തിയാൽ
  rationale: ഇവിടെ മാർഗം/കരണഭാവം പ്രധാനമാണ്; മലയാളത്തിലെ ‘-യാൽ’ അതിനെ ചുരുക്കമായും സ്വാഭാവികമായും പ്രകടിപ്പിക്കുന്നു.
- source_word: πνεύματος ἁγίου
  choice: പരിശുദ്ധാത്മാവിന്റെ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ദൈവിക പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിലെ പതിവായ ആദരപൂർവമായ സംയുക്തരൂപം ഉപയോഗിക്കുന്നു.
theological_decisions:
- issue: πνεύματος ἁγίου എന്നതിന്റെ സൂചന
  choice: പരിശുദ്ധാത്മാവ്
  alternative: പരിശുദ്ധമായ ആത്മാവ് / വിശുദ്ധാത്മാവ്
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ ഈ പ്രയോഗം ദൈവിക പരിശുദ്ധാത്മാവിനെ സൂചിപ്പിക്കുന്നു. ‘പരിശുദ്ധാത്മാവ്’ മലയാളത്തിലെ വ്യക്തവും വ്യാപകവുമായ ബൈബിൾപ്രയോഗമാണ്; വാചകത്തിൽ ഇല്ലാത്ത അധിക സിദ്ധാന്തവിവരണം ചേർക്കുന്നില്ല.
- issue: εἰς τὸ περισσεύειν എന്നതിലെ ഉദ്ദേശ്യം–ഫലം ബന്ധം
  choice: അങ്ങനെ ... സമൃദ്ധരാകട്ടെ
  alternative: നിങ്ങൾ ... സമൃദ്ധരാകേണ്ടതിന്
  rationale: ഗ്രീക്ക് ഘടന ഉദ്ദേശ്യമോ ഫലമോ ഉൾക്കൊള്ളാൻ കഴിയും. ‘അങ്ങനെ’ രണ്ടിന്റെയും നിഗൂഢബന്ധം നിലനിർത്തുന്നു; ‘ആകേണ്ടതിന്’ ഉദ്ദേശ്യമായി മാത്രം കൂടുതൽ ശക്തമായി നിർണ്ണയിച്ചേനേ.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും പൊതുവായ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ആശീർവാദ/പ്രാർഥനാഭാവം ‘-ട്ടെ’ രൂപങ്ങളിലൂടെ നിലനിർത്തി. സാങ്കേതിക സഭാഭാഷ പരമാവധി ഒഴിവാക്കി; ‘പ്രത്യാശ’, ‘സമാധാനം’, ‘പരിശുദ്ധാത്മാവ്’ എന്നീ ഉറച്ച ബൈബിൾപദങ്ങൾ മാത്രം സ്വീകരിച്ചു.
