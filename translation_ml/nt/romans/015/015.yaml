source:
  edition: SBLGNT
  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: ml
  text: എങ്കിലും, ദൈവം എനിക്കു നൽകിയ കൃപ നിമിത്തം[b], നിങ്ങളെ വീണ്ടും ഓർമിപ്പിക്കാനെന്നവണ്ണം, ചില കാര്യങ്ങളിൽ ഞാൻ നിങ്ങളോട് കുറച്ചുകൂടി ധൈര്യത്തോടെ എഴുതിയിട്ടുണ്ട്[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഭാഗികമായി ഞാൻ നിങ്ങളോട് കുറച്ചുകൂടി ധൈര്യത്തോടെ എഴുതിയിട്ടുണ്ട്.” ഗ്രീക്കുപദക്രമം പൗലോസ് കൂടുതൽ ധൈര്യത്തോടെ എഴുതിയെന്നോ ചില കാര്യങ്ങളെക്കുറിച്ച് ധൈര്യത്തോടെ എഴുതിയെന്നോ മനസ്സിലാക്കാം.
    reason: lexical_alternative
  - marker: b
    text: 'ഇവിടെ “ദൈവം എനിക്കു നൽകിയ കൃപ” എന്നത് പൊതുവായ അർഥത്തിലുള്ള കൃപ മാത്രമല്ല; ജാതികളുടെ ഇടയിൽ ശുശ്രൂഷ ചെയ്യാൻ പൗലോസിനു ദൈവം നൽകിയ നിയോഗവും ശക്തീകരണവും പ്രത്യേകമായി ഉൾക്കൊള്ളുന്നു. കാണുക: വാക്യങ്ങൾ 16–17.'
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: കുറച്ചുകൂടി ധൈര്യത്തോടെ
  rationale: താരതമ്യാർഥമുള്ള ക്രിയാവിശേഷണത്തിന്റെ ‘കൂടുതൽ ധൈര്യത്തോടെ’ എന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എങ്കിലും
  rationale: മുൻവാക്യങ്ങളിലെ പ്രശംസയ്ക്കു പിന്നാലെയുള്ള മൃദുവായ വൈരുധ്യവും വിഷയത്തിലേക്കുള്ള മടക്കവും സൂചിപ്പിക്കുന്നു.
- source_word: ἔγραψα
  choice: എഴുതിയിട്ടുണ്ട്
  rationale: ലേഖനസന്ദർഭത്തിലെ aorist-നെ മലയാളത്തിൽ സ്വാഭാവികമായി പൂർത്തിയായ എഴുത്തുപ്രവൃത്തിയായി അവതരിപ്പിക്കുന്നു.
- source_word: ἀπὸ μέρους
  choice: ചില കാര്യങ്ങളിൽ
  rationale: പൗലോസ് പ്രത്യേക വിഷയങ്ങളെ സംബന്ധിച്ച് ധൈര്യത്തോടെ എഴുതിയെന്ന സന്ദർഭോചിത അർഥം നൽകുന്നു; മറ്റൊരു സാധ്യമായ ബന്ധം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: നിങ്ങളെ വീണ്ടും ഓർമിപ്പിക്കാനെന്നവണ്ണം
  rationale: ὡς സഹിതമുള്ള participle-ന്റെ ഉദ്ദേശ്യം/ഭാവം സ്വാഭാവികമായി നൽകുകയും സംയുക്തക്രിയയിലെ വീണ്ടും ഓർമിപ്പിക്കൽ എന്ന അർഥം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: διὰ τὴν χάριν
  choice: കൃപ നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണം/അടിസ്ഥാനം വ്യക്തമാക്കുന്നു; χάρις എന്ന പൗലോസിന്റെ വിശാലമായ പദം ചുരുക്കാതെ ‘കൃപ’യായി നിലനിർത്തുന്നു.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: ദൈവം എനിക്കു നൽകിയ
  rationale: ദൈവത്തെ നൽകുന്ന കർത്താവായി വ്യക്തമായി അവതരിപ്പിച്ച് passive നിർമാണത്തിന്റെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ഈ സന്ദർഭത്തിലെ χάρις എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനപാഠത്തിൽ ‘കൃപ’ എന്ന വിശാലപദം നിലനിർത്തി, പൗലോസിനു ലഭിച്ച ശുശ്രൂഷാനിയോഗം/ശക്തീകരണം എന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
  alternative: പൊതുവായ ദൈവിക അനുഗ്രഹം; അല്ലെങ്കിൽ പ്രധാനപാഠത്തിൽ നേരിട്ട് ‘ശുശ്രൂഷാനിയോഗം’ എന്നു പരിഭാഷപ്പെടുത്തൽ.
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ ജാതികളുടെ ഇടയിലെ പൗലോസിന്റെ ശുശ്രൂഷയാണ് ഈ കൃപയുടെ പ്രത്യേക സന്ദർഭം. എങ്കിലും χάρις-ന്റെ ദൈവശാസ്ത്രപരമായ വിശാലത നഷ്ടപ്പെടാതിരിക്കാൻ പ്രധാനപാഠത്തിൽ ‘കൃപ’ തന്നെ വേണം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ ഒറ്റവാക്യഘടന നിലനിർത്തിയെങ്കിലും മലയാളത്തിലെ വ്യക്തതയ്ക്കായി കാരണം സൂചിപ്പിക്കുന്ന ഘടകം ആദ്യം കൊണ്ടുവന്നു. ἀπὸ μέρους ഏതിനോടാണ് ചേർന്നുനിൽക്കുന്നത് എന്ന യഥാർഥ വ്യാകരണസന്ദിഗ്ധത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
