revisions:
- from: 'വീണ്ടും യെശയ്യാവ് പറയുന്നു: “യിശ്ശായിയുടെ വേര് ഉണ്ടാകും; ജനതകളെ ഭരിക്കാനായി എഴുന്നേല്‍ക്കുന്നവനും വരും. അവനില്‍ ജനതകള്‍ പ്രത്യാശവെക്കും.”'
  to: 'വീണ്ടും യെശയ്യാവ് പറയുന്നു: “യിശ്ശായിയുടെ വേര്‍—ജനതകളെ ഭരിക്കാന്‍ എഴുന്നേല്‍ക്കുന്നവന്‍—ഉണ്ടാകും; അവനില്‍ ജനതകള്‍ പ്രത്യാശ വെക്കും.”'
