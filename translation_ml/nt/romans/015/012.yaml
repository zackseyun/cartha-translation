id: ROM.15.12
reference: Romans 15:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: ml
  text: 'വീണ്ടും യെശയ്യാവ് പറയുന്നു: “യിശ്ശായിയുടെ വേര്‍—ജനതകളെ ഭരിക്കാന്‍ എഴുന്നേല്‍ക്കുന്നവന്‍—ഉണ്ടാകും; അവനില്‍ ജനതകള്‍ പ്രത്യാശ വെക്കും.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: യിശ്ശായിയുടെ വേര്
  rationale: ഉറവിടത്തിലെ രൂപകം നേരിട്ട് നിലനിര്‍ത്തുന്നു; മശീഹയെ സൂചിപ്പിക്കുന്ന വംശപരമായ പ്രയോഗത്തിന്റെ തുറന്ന സ്വഭാവം സംരക്ഷിക്കുന്നു.
- source_word: ἔσται
  choice: ഉണ്ടാകും
  rationale: ഗ്രീക്കിലെ ഭാവികാലമായ ‘ആയിരിക്കും/ഉണ്ടാകും’ എന്ന അര്‍ഥം സംരക്ഷിക്കുന്നു; ‘വരും’ എന്നു മാത്രം പറഞ്ഞ് ആശയം മുന്‍കൂട്ടി വ്യാഖ്യാനിക്കുന്നത് ഒഴിവാക്കുന്നു.
- source_word: ὁ ἀνιστάμενος
  choice: എഴുന്നേല്‍ക്കുന്നവന്‍
  rationale: പങ്കുപദത്തിന്റെ സജീവവും താരതമ്യേന അക്ഷരാര്‍ഥപരവുമായ രൂപം നിലനിര്‍ത്തുന്നു; പുനരുത്ഥാനത്തെ മാത്രം നിര്‍ബന്ധമായി സൂചിപ്പിക്കുന്ന തരത്തില്‍ ചുരുക്കുന്നില്ല.
- source_word: ἄρχειν ἐθνῶν
  choice: ജനതകളെ ഭരിക്കാനായി
  rationale: ἄρχειν എന്നതിന്റെ ഭരണാധികാരം വ്യക്തമാക്കുന്നു; ἐθνῶν എന്ന പദം ഇവിടെ യഹൂദേതരര്‍ എന്ന സാങ്കേതിക പദത്തിലേക്ക് ചുരുക്കാതെ വിശാലമായ ‘ജനതകള്‍’ ആയി നല്‍കുന്നു.
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: അവനില്‍ ജനതകള്‍ പ്രത്യാശവെക്കും
  rationale: ἐπί + dative എന്ന ആശ്രയാര്‍ഥവും ഭാവികാല പ്രത്യാശയും സ്വാഭാവിക മലയാളത്തില്‍ നിലനിര്‍ത്തുന്നു.
theological_decisions:
- issue: ‘യിശ്ശായിയുടെ വേര്’ എന്ന മശീഹാപരമായ രൂപകം
  choice: രൂപകം അതേപടി നിലനിര്‍ത്തി
  alternative: ‘യിശ്ശായിയുടെ വംശജനായവന്‍’ എന്ന് വിശദീകരിക്കുക
  rationale: പൗലോസ് ഉദ്ധരിക്കുന്ന യെശയ്യാവിലെ രൂപകത്തിന്റെ കാവ്യാത്മകവും ദൈവശാസ്ത്രപരവുമായ സംഘര്‍ഷം പരിഭാഷയില്‍ തന്നെയുണ്ടാകണം.
- issue: ὁ ἀνιστάμενος എന്നതിലെ സാധ്യതയുള്ള പുനരുത്ഥാനസൂചന
  choice: ‘എഴുന്നേല്‍ക്കുന്നവന്‍’
  alternative: ‘ഉയിര്‍ത്തെഴുന്നേല്‍ക്കുന്നവന്‍’
  rationale: സന്ദര്‍ഭത്തില്‍ അധികാരത്തിനായി ഉദയം ചെയ്യുക എന്ന അര്‍ഥം സ്വാഭാവികമാണ്; പുനരുത്ഥാനാര്‍ഥം മാത്രം ഉറപ്പിക്കുന്ന വിവര്‍ത്തനം ഉറവിടത്തിലെ അര്‍ഥവ്യാപ്തിയെ അനാവശ്യമായി ചുരുക്കും.
- issue: ἐθνῶν/ἔθνη എന്നതിന്റെ പരിധി
  choice: രണ്ടിടത്തും ‘ജനതകള്‍’
  alternative: ‘വിജാതീയര്‍’ അല്ലെങ്കില്‍ ‘യഹൂദേതരര്‍’
  rationale: പദത്തിന്റെ ദേശീയ-ജനവിഭാഗപരമായ വിശാലത സംരക്ഷിക്കുകയും ഒരു സഭാപരമായ സാങ്കേതിക അര്‍ഥം മാത്രം അടിച്ചേല്‍പ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും വായിക്കാന്‍ എളുപ്പവുമായ മലയാളം. ഉദ്ധരണിയുടെ പ്രവാചക-കാവ്യഭാവം നിലനിര്‍ത്താന്‍ ‘വേര്’, ‘എഴുന്നേല്‍ക്കുന്നവന്‍’, ‘പ്രത്യാശവെക്കും’ എന്നീ പദങ്ങള്‍ ഉപയോഗിച്ചു. ഗ്രീക്ക് വാക്യത്തിലെ καί-ബന്ധം മലയാളത്തില്‍ സ്വാഭാവികമാക്കാന്‍ രണ്ടാമത്തെ ഘടകത്തില്‍ ‘വരും’ ചേര്‍ത്തു; ആദ്യത്തെ ἔσται ‘ഉണ്ടാകും’ എന്നായി പ്രത്യേകം സംരക്ഷിച്ചു.
