  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: ml
  text: 'വിജാതീയരും[a] ദൈവത്തിന്റെ കരുണനിമിത്തം അവനെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്—എഴുതിയിരിക്കുന്നതുപോലെ: “അതുകൊണ്ട് ഞാൻ ജനതകളുടെ ഇടയിൽ അങ്ങയെ സ്തുതിക്കും; അങ്ങയുടെ നാമത്തിനു സ്തുതിഗാനം പാടും.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “വിജാതീയർ” എന്നതിന് “യഹൂദരല്ലാത്ത ജനതകൾ” എന്നും പരിഭാഷപ്പെടുത്താം. ഉദ്ധരണിയിലെ “ജനതകളുടെ ഇടയിൽ” എന്നതിന് “വിജാതീയരുടെ ഇടയിൽ” എന്നും പറയാം. പൗലോസിന്റെ വാദത്തിൽ ἔθνη പ്രത്യേകിച്ച് യഹൂദരല്ലാത്തവരെയാണ് സൂചിപ്പിക്കുന്നത്; എന്നാൽ ഉദ്ധരിച്ച വാക്യത്തിൽ അതിന് “ജനതകൾ” എന്ന വിശാലമായ അർഥവും ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: ജാതികൾ
  rationale: റോമർ ലേഖനത്തിലെ സന്ദർഭത്തിൽ യഹൂദരല്ലാത്ത ജനവിഭാഗങ്ങളെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്. മലയാളത്തിൽ ‘ജാതികൾ’ എന്നത് ആ അർഥവും ‘രാഷ്ട്രങ്ങൾ/ജനതകൾ’ എന്ന വിശാലമായ ഉദ്ധരണി-അർഥവും ഒരളവുവരെ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ ἐλέους
  choice: ദൈവത്തിന്റെ കരുണ നിമിത്തം
  rationale: ὑπέρ + ഷഷ്ഠി ഇവിടെ കാരണമോ അടിസ്ഥാനമോ സൂചിപ്പിക്കുന്നു. സന്ദർഭം ആവശ്യപ്പെടുന്ന ദൈവിക ഉടമസ്ഥത വ്യക്തമാക്കാൻ ‘ദൈവത്തിന്റെ’ ചേർത്തു.
- source_word: δοξάσαι
  choice: മഹത്ത്വപ്പെടുത്തേണ്ടതിന്
  rationale: മുൻവാക്യത്തെ ആശ്രയിക്കുന്ന aorist infinitive-ന്റെ ഉദ്ദേശ്യ/ഫലബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: καθὼς γέγραπται
  choice: എഴുതിയിരിക്കുന്നതുപോലെ
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്ന പതിവു സൂത്രവാക്യത്തിന്റെ സ്വാഭാവികവും ഔപചാരികവുമായ മലയാളരൂപം.
- source_word: ἐξομολογήσομαί
  choice: ഞാൻ ... സ്തുതിക്കും
  rationale: ഇവിടെ പാപസമ്മതമല്ല, ദൈവത്തോടുള്ള പരസ്യമായ സ്തുതി/കൃതജ്ഞതയാണ് അർഥം; തുടർന്നുള്ള ψαλῶ-യോടുള്ള സമാന്തരതയും ഇത് പിന്തുണയ്ക്കുന്നു.
- source_word: ἐν ἔθνεσι
  choice: ജാതികളുടെ മധ്യേ
  rationale: ἐν + dative-ന്റെ സ്ഥാനാർഥമായ ‘among’ നിലനിർത്തുന്നു. പൗലോസിന്റെ വിജാതീയപ്രയോഗവും മൂലഉദ്ധരണിയിലെ ‘ജനതകൾ’ എന്ന വിശാലസാധ്യതയും സംരക്ഷിക്കുന്നു.
- source_word: ψαλῶ
  choice: സ്തുതിഗാനം ആലപിക്കും
  rationale: ആരാധനാപരമായ പാട്ടുസ്വഭാവം വ്യക്തമാക്കുന്നു; കാനോനിക സങ്കീർത്തനങ്ങൾ മാത്രം എന്ന അനാവശ്യ പരിമിതി വരുത്തുന്നില്ല.
- source_word: τῷ ὀνόματί σου
  choice: അങ്ങയുടെ നാമത്തിനു
  rationale: ψαλῶ-യോടു ചേരുന്ന dative-ഉം ദൈവനാമത്തോടുള്ള സ്തുതിയുടെ ബൈബിൾ പ്രയോഗവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ആരംഭത്തിലെ infinitive clause-ന്റെ ബന്ധവും പ്രാബല്യവും
  choice: മുൻവാക്യത്തിൽനിന്നു തുടരുന്ന ഉദ്ദേശ്യ/ഫലവാക്യമായി ‘മഹത്ത്വപ്പെടുത്തേണ്ടതിന്’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘ജാതികൾ ദൈവത്തെ മഹത്ത്വപ്പെടുത്താനും’ എന്ന കൂടുതൽ പദാനുപദവും അപൂർണ്ണവുമായ രൂപം.
  rationale: ഗ്രീക്ക് വാക്യം 8-ാം വാക്യത്തെ വ്യാകരണപരമായി ആശ്രയിക്കുന്നു. മലയാളത്തിൽ ബന്ധം ഗ്രഹിക്കാവുന്നതാക്കുന്നു; അതേസമയം അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- issue: ἔθνη/ἔθνεσι എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനവാക്യത്തിലും ഉദ്ധരണിയിലും ‘ജാതികൾ’ ഉപയോഗിച്ചു.
  alternative: ‘വിജാതീയർ’ / ‘ജനതകൾ’ അല്ലെങ്കിൽ ‘രാഷ്ട്രങ്ങൾ’.
  rationale: സന്ദർഭത്തിൽ യഹൂദരല്ലാത്തവരെന്ന പൗലോസിന്റെ പ്രയോഗവും ഉദ്ധരണിയിലെ വിശാലമായ ‘ജനതകൾ’ എന്ന അർഥവും ഒരുമിച്ച് തുറന്നുവയ്ക്കാൻ ‘ജാതികൾ’ സഹായിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവുമായ സാധാരണ മലയാളം. ദൈവത്തോടുള്ള അഭിസംബോധനയിൽ ആദരസൂചകമായ ‘അങ്ങ്’ ഉപയോഗിച്ചു. വാക്യം 8-നെ ആശ്രയിക്കുന്നതിനാൽ തുടർച്ച സൂചിപ്പിക്കുന്ന ‘ആകട്ടെ’യും dash-ഉം ഉപയോഗിച്ചു; ഒറ്റവാക്യമായി വായിക്കുമ്പോഴും വ്യാകരണബന്ധം വ്യക്തമാണ്.
