revisions:
- from: 'ജാതികളാകട്ടെ, ദൈവത്തിന്റെ കരുണ നിമിത്തം അവനെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്[a]—എഴുതിയിരിക്കുന്നതുപോലെ: “അതുകൊണ്ട് ഞാൻ ജാതികളുടെ മധ്യേ അങ്ങയെ സ്തുതിക്കും; അങ്ങയുടെ നാമത്തിനു സ്തുതിഗാനം ആലപിക്കും.”'
  to: 'വിജാതീയരും[a] ദൈവത്തിന്റെ കരുണനിമിത്തം അവനെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്—എഴുതിയിരിക്കുന്നതുപോലെ: “അതുകൊണ്ട് ഞാൻ ജനതകളുടെ ഇടയിൽ അങ്ങയെ സ്തുതിക്കും; അങ്ങയുടെ നാമത്തിനു സ്തുതിഗാനം പാടും.”'
  rationale: The revision avoids the common modern-Malayalam caste sense of “ജാതികൾ.” It renders the argumentative application in Romans with “വിജാതീയർ” while retaining “ജനതകൾ” in the cited wording, where the underlying term can carry the broader sense “nations.” The dependent syntax, mercy motif, and parallel praise language remain unchanged.
