id: ROM.15.6
reference: Romans 15:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: ml
  text: അങ്ങനെ നിങ്ങൾ ഏകമനസ്സോടെ, ഒരേ വായാൽ[a], നമ്മുടെ കർത്താവായ യേശു മശീഹായുടെ[b] ദൈവവും പിതാവുമായവനെ മഹത്ത്വപ്പെടുത്തേണ്ടതിന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പ്രയോഗസഹജമായി: “ഒരേ സ്വരത്തിൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ഒരേ വായാൽ” എന്നാണ്; ഐക്യമായ സ്തുതിയെ ഈ പ്രയോഗം ഊന്നിപ്പറയുന്നു.'
    reason: lexical_alternative
  - marker: b
    text: 'പരമ്പരാഗതമായി: “യേശുക്രിസ്തുവിന്റെ.” Χριστός എന്ന ഗ്രീക്ക് സ്ഥാനപ്പേരിന്റെ അർഥം “മശീഹാ” എന്നാണ്.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: അങ്ങനെ … മഹത്ത്വപ്പെടുത്തേണ്ടതിന്
  rationale: മുൻവാക്യത്തിലെ പ്രബോധനത്തിൽനിന്ന് ഉളവാകേണ്ട ഉദ്ദേശ്യവും ഫലവും സൂചിപ്പിക്കുന്ന ἵναയുടെ ആശ്രിതവാക്യസ്വഭാവം നിലനിർത്തുന്നു.
- source_word: ὁμοθυμαδόν
  choice: ഏകമനസ്സോടെ
  rationale: കൂട്ടായ മനസ്സിന്റെയും ലക്ഷ്യത്തിന്റെയും ഐക്യം സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐν ἑνὶ στόματι
  choice: ഒരേ വായാൽ
  rationale: ഐക്യമായ സ്തുതിയെ ചിത്രീകരിക്കുന്ന ഗ്രീക്കിലെ വ്യക്തമായ ശരീരരൂപകം സംരക്ഷിക്കുന്നു; കൂടുതൽ പ്രയോഗസഹജമായ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: δοξάζητε
  choice: മഹത്ത്വപ്പെടുത്തേണ്ടതിന്
  rationale: ἵναയോടുകൂടിയ വർത്തമാനകാല വിധിലിംഗത്തിന്റെ ഉദ്ദേശ്യാർഥം മലയാളത്തിലെ ആശ്രിത ഉദ്ദേശ്യഘടനയിൽ പ്രകടമാക്കുന്നു.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: ദൈവവും പിതാവുമായവനെ
  rationale: ഒരേ നിർദേശകപദത്തിന്റെ കീഴിലുള്ള രണ്ടു നാമങ്ങളും ഒരേ വ്യക്തിയെ സൂചിപ്പിക്കുന്നു എന്ന അടുത്ത ബന്ധം അമിതവ്യാഖ്യാനമില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: τοῦ κυρίου ἡμῶν
  choice: നമ്മുടെ കർത്താവായ
  rationale: κύριος എന്ന പദത്തിന് പതിവായ ‘കർത്താവ്’ ഉപയോഗിക്കുകയും ἡμῶν എന്ന ഉടമസ്ഥബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹായുടെ
  rationale: യേശു എന്ന പേര് ലിപ്യന്തരം ചെയ്യുകയും Χριστός എന്ന സ്ഥാനപ്പേര് അതിന്റെ അർഥമായ ‘മശീഹാ’ എന്നു പരിഭാഷപ്പെടുത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ എന്ന പേര്-സ്ഥാനപ്പേര് സംയോജനത്തിലെ Χριστοῦയുടെ പരിഭാഷ
  choice: യേശു മശീഹായുടെ
  alternative: യേശുക്രിസ്തുവിന്റെ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ മശീഹാപദവിയെ സൂചിപ്പിക്കുന്നതിനാൽ അതിന്റെ അർഥം പരിഭാഷയിൽ പ്രകടമാക്കുന്നു; പരമ്പരാഗത ലിപ്യന്തരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. മൂലത്തിലെ ഉദ്ദേശ്യാശ്രിത വാക്യഘടനയും ‘ഒരേ വായാൽ’ എന്ന ദൃശ്യരൂപകവും നിലനിർത്തിയിരിക്കുന്നു.
