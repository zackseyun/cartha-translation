  to: ഇങ്ങനെ ക്രിസ്തുവിനെ സേവിക്കുന്നവൻ ദൈവത്തിന് പ്രസാദമുള്ളവനും മനുഷ്യരാൽ അംഗീകരിക്കപ്പെട്ടവനും ആകുന്നു.
