id: ROM.14.18
reference: Romans 14:18
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ml
  text: ഇങ്ങനെ ക്രിസ്തുവിനെ സേവിക്കുന്നവൻ ദൈവത്തിന് പ്രസാദമുള്ളവനും മനുഷ്യരാൽ അംഗീകരിക്കപ്പെട്ടവനും ആകുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ഇങ്ങനെ
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ നീതി, സമാധാനം, പരിശുദ്ധാത്മാവിലുള്ള സന്തോഷം എന്നിവയാൽ നിർവചിക്കപ്പെടുന്ന സേവനരീതിയെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു; ഗ്രീക്കിലെ ഏകവചന സൂചനയുടെ സന്ദർഭാർഥം നിലനിർത്തുന്നു.
- source_word: δουλεύων τῷ Χριστῷ
  choice: ക്രിസ്തുവിനെ സേവിക്കുന്നവൻ
  rationale: δουλεύω എന്നതിലെ അധീനതയും സമർപ്പിത സേവനവും ലളിതവും dignified ആയ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: εὐάρεστος τῷ θεῷ
  choice: ദൈവത്തിനു പ്രസാദകരൻ
  rationale: ദൈവത്തിന് ഇഷ്ടവും സ്വീകാര്യവുമായിരിക്കുക എന്ന അർഥം നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: മനുഷ്യരുടെ മുമ്പിൽ അംഗീകാരം ലഭിച്ചവൻ
  rationale: δόκιμος എന്നത് പരിശോധനയിൽ തെളിഞ്ഞ് അംഗീകരിക്കപ്പെട്ടവൻ എന്ന ആശയം വഹിക്കുന്നു; ദൈവിക അംഗീകാരമല്ല, മനുഷ്യരുടെ വിലയിരുത്തലിലുള്ള അംഗീകാരമാണെന്ന് വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἐν τούτῳ എന്നതിന്റെ സൂചന
  choice: ഇങ്ങനെ
  alternative: ഇക്കാര്യത്തിൽ
  rationale: സർവനാമം എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നതിൽ ചെറിയ വ്യാഖ്യാനസാധ്യതയുണ്ടെങ്കിലും, മുൻസന്ദർഭത്തിലെ ജീവിതരീതിയോടുള്ള ബന്ധം തുറന്നുവെക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ് ‘ഇങ്ങനെ’.
- issue: τοῖς ἀνθρώποις എന്ന പൊതുവായ മനുഷ്യസൂചന
  choice: മനുഷ്യരുടെ മുമ്പിൽ
  alternative: പുരുഷന്മാരാൽ
  rationale: ἄνθρωποι ഇവിടെ ലിംഗവിശേഷമില്ലാതെ മനുഷ്യരെ പൊതുവായി സൂചിപ്പിക്കുന്നു; ‘പുരുഷന്മാർ’ എന്ന പരിഭാഷ അനാവശ്യമായി അർഥം ചുരുക്കും.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ വാക്യഘടന. ‘ക്രിസ്തു’ എന്ന പരമ്പരാഗതവും വ്യാപകമായി ഗ്രഹിക്കപ്പെടുന്നതുമായ രൂപം ഉപയോഗിച്ചു; അനാവശ്യമായ വ്യാഖ്യാനവിപുലീകരണം ഒഴിവാക്കി.
