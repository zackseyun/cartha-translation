id: ROM.14.2
reference: Romans 14:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: ml
  text: ഒരാൾ എല്ലാം ഭക്ഷിക്കാമെന്ന് വിശ്വസിക്കുന്നു[a]; എന്നാൽ ബലഹീനനായവൻ[b] പച്ചക്കറികൾ ഭക്ഷിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ഒരാൾക്ക് എല്ലാം ഭക്ഷിക്കാമെന്ന് ബോധ്യമുണ്ട്.’
    reason: lexical_alternative
  - marker: b
    text: ‘ബലഹീനനായവൻ’ എന്ന പ്രയോഗം ഈ സന്ദർഭത്തിൽ ഭക്ഷണാചാരങ്ങളെക്കുറിച്ചുള്ള വിശ്വാസത്തിലോ മനസ്സാക്ഷിയിലോ ഉള്ള ബലഹീനതയെ സൂചിപ്പിക്കുന്നു (റോമർ 14:1 കാണുക).
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: ഒരാൾ
  rationale: വൈരുധ്യത്തിന്റെ ആദ്യഭാഗത്തെ അവതരിപ്പിക്കുന്ന പ്രതിനിധാനപരമായ ഏകവചനം ലിംഗം അനാവശ്യമായി വ്യക്തമാക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πιστεύει
  choice: വിശ്വസിക്കുന്നു
  rationale: ഇവിടെ ക്രിയ അനന്തരൂപമായ φαγεῖν-നെ നിയന്ത്രിച്ച് ഭക്ഷണത്തെക്കുറിച്ചുള്ള വ്യക്തിപരമായ ബോധ്യത്തെ സൂചിപ്പിക്കുന്നു; അതേസമയം πιστεύω എന്ന പദത്തിന്റെ അടിസ്ഥാന അർഥബന്ധം നിലനിർത്തുന്നു.
- source_word: φαγεῖν πάντα
  choice: എല്ലാം ഭക്ഷിക്കാമെന്ന്
  rationale: πάντα ഭക്ഷണനിയന്ത്രണമില്ലായ്മയെ സൂചിപ്പിക്കുന്നു. സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന അനുവാദത്തിന്റെ ആശയം മലയാളത്തിലെ ‘-ക്കാം’ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ὁ δὲ
  choice: എന്നാൽ ... ആ ആൾ
  rationale: വാക്യത്തിന്റെ രണ്ടാം, വിരുദ്ധ അംഗത്തെ മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അടയാളപ്പെടുത്തുന്നു.
- source_word: ἀσθενῶν
  choice: ബലഹീനനായ
  rationale: ശാരീരിക ദൗർബല്യമെന്ന് വിശദീകരിക്കാതെ പൗലോസ് ഉപയോഗിക്കുന്ന വിലയിരുത്തൽ നിലനിർത്തുന്നു; സന്ദർഭം വിശ്വാസം/മനസ്സാക്ഷി സംബന്ധിച്ച അർഥം നൽകുന്നു.
- source_word: λάχανα
  choice: പച്ചക്കറികൾ
  rationale: തോട്ടവിളകളെയോ പച്ചക്കറികളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് ആധുനിക മലയാളത്തിൽ ഏറ്റവും വ്യക്തമായ പൊതുപദമാണിത്.
- source_word: ἐσθίει
  choice: ഭക്ഷിക്കുന്നു
  rationale: ഗ്രീക്കിൽ വ്യക്തമായി ഇല്ലാത്ത ‘മാത്രം’ ചേർക്കാതെ ലളിതമായ പ്രസ്താവന അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀσθενῶν എന്നതിലെ ബലഹീനതയുടെ സ്വഭാവം
  choice: ഈ വാക്യത്തിൽ ‘ബലഹീനനായ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി.
  alternative: ‘വിശ്വാസത്തിൽ ബലഹീനനായ’
  rationale: റോമർ 14:1-ലെ ഉടൻസന്ദർഭം വിശ്വാസം/മനസ്സാക്ഷി സംബന്ധിച്ച ബലഹീനതയാണെന്ന് വ്യക്തമാക്കുന്നുവെങ്കിലും, 14:2-ൽ ഗ്രീക്ക് പാഠം ‘ബലഹീനനായവൻ’ എന്നു മാത്രമാണ് പറയുന്നത്. അതിനാൽ മുഖ്യപാഠം വിശദീകരണം ചേർക്കാതെ മൂലവാചകത്തിന്റെ സംക്ഷിപ്തതയും ആശയസംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘ഭക്ഷിക്കാമെന്ന്’ അനുവാദസന്ദർഭം സ്വാഭാവികമായി നൽകുന്നു; ‘മാത്രം’ മൂലപാഠത്തിൽ ഇല്ലാത്തതിനാൽ ഒഴിവാക്കി. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തി.
