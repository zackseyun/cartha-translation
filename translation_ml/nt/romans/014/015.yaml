id: ROM.14.15
reference: Romans 14:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: ml
  text: എന്തെന്നാൽ, ഭക്ഷണം നിമിത്തം നിന്റെ സഹോദരൻ ദുഃഖിതനാകുന്നുവെങ്കിൽ, നീ ഇനി സ്നേഹത്തിന് അനുസരിച്ചല്ല നടക്കുന്നത്. നിന്റെ ഭക്ഷണംകൊണ്ട്, ആ വ്യക്തിക്കുവേണ്ടി മശീഹ മരിച്ചതല്ലോ, ആ വ്യക്തിയെ നശിപ്പിക്കരുത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നശിപ്പിക്കുക’ എന്നതിന് ‘തകർക്കുക’ അല്ലെങ്കിൽ ‘നാശത്തിലാക്കുക’ എന്നും അർഥമാകാം. ഗ്രീക്ക് ക്രിയ ശക്തമായ ആത്മീയ ഹാനിയെ സൂചിപ്പിക്കാം; എന്നാൽ അതിന്റെ കൃത്യമായ ദൈവശാസ്ത്രപരമായ ഫലം ഈ വാക്യം വ്യക്തമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: ഭക്ഷണം / നിന്റെ ഭക്ഷണംകൊണ്ട്
  rationale: ഇവിടെ പദം മാംസം മാത്രമല്ല, പൊതുവായി ഭക്ഷണത്തെ സൂചിപ്പിക്കുന്നു. ദത്തിവ് രൂപത്തിന്റെ ഉപാധി/കാരണം എന്ന ഭാവം ‘ഭക്ഷണംകൊണ്ട്’ നിലനിർത്തുന്നു.
- source_word: ἀδελφός
  choice: സഹോദരൻ
  rationale: ഗ്രീക്ക് പദത്തിന്റെ പുല്ലിംഗ ഏകവചനരൂപം പ്രധാനപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ ഇത് സഹവിശ്വാസിയെ പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാം.
- source_word: λυπεῖται
  choice: ദുഃഖിതനാകുന്നു
  rationale: മറ്റൊരാളുടെ പ്രവൃത്തി മൂലം ഉണ്ടാകുന്ന ദുഃഖവും മനോവ്യഥയും സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: κατὰ ἀγάπην περιπατεῖς
  choice: സ്നേഹത്തിന് അനുസരിച്ചല്ല നടക്കുന്നത്
  rationale: κατάയുടെ മാനദണ്ഡഭാവവും പൗലൊസിന്റെ ധാർമികമായ ‘നടക്കുക’ എന്ന രൂപകവും നിലനിർത്തുന്നു.
- source_word: ἀπόλλυε
  choice: നശിപ്പിക്കരുത്
  rationale: ക്രിയയുടെ ശക്തമായ മുന്നറിയിപ്പ് നിലനിർത്തുന്നു; അത് അന്തിമനാശമാണോ ഗുരുതരമായ ആത്മീയ തകർച്ചയാണോ എന്ന് പരിഭാഷയിൽ തീരുമാനിക്കുന്നില്ല.
- source_word: ὑπὲρ οὗ
  choice: ആ വ്യക്തിക്കുവേണ്ടി
  rationale: ὑπέρ + genitive എന്നതിന്റെ പ്രതിനിധാനപരവും ബലിദാനപരവുമായ ‘വേണ്ടി’ എന്ന അർഥം നൽകുന്നു.
- source_word: Χριστός
  choice: മശീഹ
  rationale: ഇവിടെ Χριστός ഒരു സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹ’ ഉപയോഗിക്കുന്നു.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: അയോറിസ്റ്റ് ക്രിയ മരണത്തെ നേരിട്ട് സൂചിപ്പിക്കുന്നു.
- source_word: ἐκεῖνον
  choice: ആ വ്യക്തിയെ
  rationale: ദൂരസൂചക സർവനാമത്തിന്റെ ഊന്നൽ നിലനിർത്തുകയും മലയാളത്തിൽ സ്വാഭാവികമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: εἰ γὰρ
  choice: എന്തെന്നാൽ ... എങ്കിൽ
  rationale: γάρ മുൻവാദത്തോടുള്ള വിശദീകരണബന്ധവും εἰയുടെ ഉപാധിഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀπόλλυε എന്ന ക്രിയ സൂചിപ്പിക്കുന്ന നാശത്തിന്റെ സ്വഭാവം
  choice: ‘നശിപ്പിക്കരുത്’ എന്ന ശക്തമായ മുന്നറിയിപ്പ്
  alternative: ‘തകർക്കരുത്’ / ‘നിത്യനാശത്തിലാക്കരുത്’
  rationale: വാക്യം ഗുരുതരമായ ആത്മീയ ഹാനിയെ സൂചിപ്പിച്ചാലും, താൽക്കാലിക തകർച്ചയാണോ അന്തിമനാശമാണോ എന്ന് വ്യക്തമാക്കുന്നില്ല; അതിനാൽ ആ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
- issue: ἀδελφός എന്നതിന്റെ വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരൻ’
  alternative: ‘സഹോദരനോ സഹോദരിയോ’ / ‘സഹവിശ്വാസി’
  rationale: മൂലഭാഷയിലെ പുല്ലിംഗ ഏകവചനം നിലനിർത്തുന്നു; സഭാസന്ദർഭത്തിൽ പദം സഹവിശ്വാസികളെ പ്രതിനിധാനപരമായി ഉൾക്കൊള്ളാമെന്ന കാര്യം വിശദീകരണത്തിൽ വ്യക്തമാക്കാം.
- issue: Χριστός എന്ന സ്ഥാനപ്പേരിന്റെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ പദം സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നു; ‘മശീഹ’ അതിന്റെ അഭിഷിക്തനായ രാജാവ് എന്ന സ്ഥാനാർഥം കൂടുതൽ സുതാര്യമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. പൗലൊസിന്റെ ‘നടക്കുക’ എന്ന നൈതിക രൂപകവും മുന്നറിയിപ്പിന്റെ ശക്തിയും നിലനിർത്തിയിട്ടുണ്ട്.
