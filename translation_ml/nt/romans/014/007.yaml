  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: ml
  text: കാരണം, നമ്മിൽ ആരും തനിക്കുവേണ്ടി ജീവിക്കുന്നില്ല[a]; ആരും തനിക്കുവേണ്ടി മരിക്കുന്നുമില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ: “തനിക്കുതന്നെ.” ഗ്രീക്കിലെ ആത്മനിഷ്ഠ ദാതിവിഭക്തിയെ കൂടുതൽ പദാനുപദമായി ഇങ്ങനെ നൽകാം; എന്നാൽ ഇവിടെ ഒരാൾ തന്നെ അന്തിമ ലക്ഷ്യമാക്കി ജീവിക്കുന്നതോ മരിക്കുന്നതോ ആണ് ഉദ്ദേശിക്കപ്പെടാൻ കൂടുതൽ സാധ്യത.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς ... ἡμῶν
  choice: നമ്മിൽ ആരും ... ഇല്ല
  rationale: ഭാഗികസംബന്ധത്തെ സൂചിപ്പിക്കുന്ന ἡμῶν സഹിതമുള്ള സമ്പൂർണ നിഷേധം സ്വാഭാവികമായ മലയാളത്തിൽ ഇങ്ങനെ വ്യക്തമാകുന്നു; രണ്ടു ഉപവാക്യങ്ങളിലെയും സാർവത്രിക നിഷേധവും നിലനിർത്തുന്നു.
- source_word: γὰρ
  choice: പ്രത്യേക പദമായി പരിഭാഷപ്പെടുത്തിയിട്ടില്ല
  rationale: ഈ വാക്യം മുൻവാക്യത്തിന്റെ വിശദീകരണമാണെന്ന ബന്ധം മലയാളത്തിലെ പ്രവാഹത്തിൽ വ്യക്തമാണ്. ‘കാരണം’ എന്നു ചേർത്താൽ ഒറ്റയ്ക്ക് ഉദ്ധരിക്കുമ്പോൾ അസ്വാഭാവികത വരാം; എങ്കിലും വിശദീകരണസ്വരം വാക്യഘടനയിൽ നിലനിൽക്കുന്നു.
- source_word: ἑαυτῷ
  choice: തനിക്കുവേണ്ടി
  rationale: സ്വയം അന്തിമ ലക്ഷ്യമോ പരിഗണനാകേന്ദ്രമോ ആക്കി ജീവിക്കുകയോ മരിക്കുകയോ ചെയ്യുന്നതല്ല എന്ന സന്ദർഭാർഥം ഇത് സ്വാഭാവികമായി നൽകുന്നു. ദാതിവിഭക്തിയുടെ കൂടുതൽ പദാനുപദമായ സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: ζῇ
  choice: ജീവിക്കുന്നില്ല
  rationale: പൊതുവായ സത്യത്തെ സൂചിപ്പിക്കുന്ന വർത്തമാനകാലാർഥം നിലനിർത്തുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: സമാന്തരമായ രണ്ടാമത്തെ ഉപവാക്യത്തെ ആദ്യത്തേതിനോടു സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ἀποθνῄσκει
  choice: മരിക്കുന്നുമില്ല
  rationale: ζῇ എന്നതിനോടുള്ള സമാന്തരതയും പൊതുസത്യത്തിന്റെ വർത്തമാനകാലസ്വഭാവവും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἑαυτῷ എന്ന പ്രത്യയദാതിവിന്റെ അർഥം
  choice: തനിക്കുവേണ്ടി
  alternative: തന്നിലേക്കായി / തനിക്കായി
  rationale: തുടർന്നുള്ള വാക്യത്തിൽ വ്യക്തമാകുന്ന ‘കർത്താവിനുവേണ്ടി’ എന്ന ദിശാബോധത്തോടുള്ള വൈരുധ്യം സൂക്ഷിക്കുന്നു; അതേസമയം അധികമായ ദൈവശാസ്ത്രവ്യാഖ്യാനം വാചകത്തിലേക്ക് ചേർക്കുന്നില്ല.
- issue: ഗ്രീക്കിലെ ഏകവചന പുല്ലിംഗ പ്രത്യയത്തിന്റെ മലയാളാവിഷ്കാരം
  choice: തനിക്ക്
  alternative: അവനവനുവേണ്ടി
  rationale: മലയാളത്തിൽ ‘ആരും ... തനിക്ക്’ എന്നത് ലിംഗനിരപേക്ഷമായി വ്യക്തികളെ പൊതുവായി ഉൾക്കൊള്ളുകയും ഗ്രീക്കിലെ ഏകവചനഘടന നിലനിർത്തുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘തനിക്കുവേണ്ടി’ എന്ന ആവർത്തനം ഗ്രീക്കിലെ കൃത്യമായ സമാന്തരതയും വാക്യത്തിന്റെ ഊന്നലും സംരക്ഷിക്കുന്നു.
