id: ROM.14.4
reference: Romans 14:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: ml
  text: മറ്റൊരാളുടെ വീട്ടടിമയെ വിധിക്കാൻ നീ ആർ? സ്വന്തം യജമാനന്റെ മുമ്പിലാണ് അവൻ നിൽക്കുന്നതോ വീഴുന്നതോ. എന്നാൽ അവൻ നിലനിറുത്തപ്പെടും; അവനെ നിലനിറുത്താൻ കർത്താവിനു കഴിവുണ്ടല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അവസാനത്തെ ‘കർത്താവ്’ എന്നത് ഉപമയിലെ ആ അടിമയുടെ യജമാനനെ സൂചിപ്പിക്കുന്നതായും മനസ്സിലാക്കാം; എന്നാൽ ഇവിടെ ദൈവശാസ്ത്രപരമായ അർഥത്തിൽ കർത്താവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്നതാണ് കൂടുതൽ സാധ്യത.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: വിധിക്കാൻ നീ ആർ?
  rationale: ഊന്നലോടെയുള്ള ഗ്രീക്ക് വാചകത്തിന്റെ ശാസനാത്മകമായ ആലങ്കാരിക ചോദ്യം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἀλλότριον οἰκέτην
  choice: മറ്റൊരാളുടെ വീട്ടടിമയെ
  rationale: οἰκέτης വീട്ടിലെ സേവനബന്ധത്തിലുള്ള അടിമയെ സൂചിപ്പിക്കുന്നു; ‘വീട്ടടിമ’ ഗൃഹബന്ധവും ബന്ധിതമായ സാമൂഹിക നിലയും ചുരുക്കമായി സംരക്ഷിക്കുന്നു.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: സ്വന്തം യജമാനന്റെ മുമ്പിലാണ്
  rationale: ദാതൃവിഭക്തി ഇവിടെ ഉത്തരവാദിത്വബന്ധം സൂചിപ്പിക്കുന്നു. അടിമയുടെ ഉപമയിൽ κύριος എന്നതിന് ‘യജമാനൻ’ സ്വാഭാവികമാണ്; അവസാനത്തെ ദൈവശാസ്ത്രപരമായ ‘കർത്താവ്’ എന്ന പ്രയോഗത്തിൽനിന്ന് വ്യത്യാസവും വ്യക്തമാക്കുന്നു.
- source_word: στήκει ἢ πίπτει
  choice: നിൽക്കുന്നതോ വീഴുന്നതോ
  rationale: വിരുദ്ധമായ രണ്ട് ക്രിയകളുടെ രൂപകവും അവയുടെ ആവർത്തനബന്ധവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: σταθήσεται
  choice: നിലനിറുത്തപ്പെടും
  rationale: ഭാവികാല കർമണി രൂപവും സൂചിതമായ പ്രവർത്തകശക്തിയും മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; വെറും ‘നിൽക്കും’ എന്നു പറഞ്ഞ് കർമണി സൂക്ഷ്മത നഷ്ടപ്പെടുത്തുന്നില്ല.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: അവനെ നിലനിറുത്താൻ കർത്താവിനു കഴിവുണ്ടല്ലോ
  rationale: γάρ നൽകുന്ന കാരണബന്ധം ‘ഉണ്ടല്ലോ’ എന്ന സ്വാഭാവിക മലയാളഘടനയിൽ പ്രകടമാക്കുന്നു; ἵστημι-യുടെ കാരകഭാവം ‘നിലനിറുത്താൻ’ എന്നതിലൂടെ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: അവസാനത്തെ ὁ κύριος ആരെ സൂചിപ്പിക്കുന്നു
  choice: ദൈവശാസ്ത്രപരമായ അർഥത്തിൽ ‘കർത്താവ്’
  alternative: വീട്ടടിമയുടെ ഉപമയിലെ അവന്റെ യജമാനൻ
  rationale: പൗലോസിന്റെ പ്രയോഗവും ഒരാളെ നിലനിറുത്താനുള്ള ശക്തിയെക്കുറിച്ചുള്ള ഉറപ്പും ഇവിടെ കർത്താവിനെ സൂചിപ്പിക്കുന്നതാണ് കൂടുതൽ സാധ്യതയുള്ളത്. എങ്കിലും ഉപമയിലെ യജമാനനുമായുള്ള പദബന്ധം യഥാർഥമായതിനാൽ അത് അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘വീട്ടടിമ’ ചരിത്രപരമായ ബന്ധിത സാമൂഹിക സ്ഥാനം മറയ്ക്കാതെ നൽകുന്നു. ‘നിൽക്കുക/വീഴുക/നിലനിറുത്തുക’ എന്ന രൂപകബന്ധം കഴിയുന്നത്ര സൂക്ഷിച്ചിട്ടുണ്ട്.
