  source_fidelity: 'ഗ്രീക്ക് വാക്യഘടനയും മുഖ്യപദങ്ങളും വിശ്വസ്തമായി പ്രതിഫലിക്കുന്നു: ἀλλότριον οἰκέτην ‘മറ്റൊരാളുടെ വീട്ടടിമ,’ τῷ ἰδίῳ κυρίῳ ‘സ്വന്തം യജമാനന്റെ മുമ്പിൽ,’ στήκει ἢ πίπτει എന്ന വിരുദ്ധരൂപകം, σταθήσεται എന്ന ഭാവി കർമണി ആശയം, അവസാനത്തെ στῆσαι αὐτόν എന്ന കാരകപ്രയോഗം എന്നിവ സംരക്ഷിച്ചിട്ടുണ്ട്.'
