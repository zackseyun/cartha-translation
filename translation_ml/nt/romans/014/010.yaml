  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: ml
  text: എന്നാൽ നീ, നിന്റെ സഹോദരനെ[a] വിധിക്കുന്നത് എന്തിന്? അല്ലെങ്കിൽ നീയും നിന്റെ സഹോദരനെ നിസ്സാരനായി കാണുന്നത് എന്തിന്? കാരണം, നാമെല്ലാവരും ദൈവത്തിന്റെ[b] ന്യായാസനത്തിനുമുമ്പിൽ നിൽക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്റെ സഹോദരനെയോ സഹോദരിയെയോ”; ഗ്രീക്കിൽ “നിന്റെ സഹോദരനെ.”
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ക്രിസ്തുവിന്റെ ന്യായാസനം” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: എന്നാൽ നീ
  rationale: δέയുടെ വൈരുധ്യസൂചനയും മുൻനിരയിൽ നിൽക്കുന്ന σύയുടെ ഊന്നലും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τί κρίνεις
  choice: വിധിക്കുന്നത് എന്തിന്?
  rationale: ഈ ആലങ്കാരിക ചോദ്യത്തിൽ τί എന്നത് ‘എന്തിന്’ എന്ന അർഥത്തിലാണ്; κρίνωയെ ‘കുറ്റം വിധിക്കുക’ എന്നാക്കി അതിവ്യാഖ്യാനിക്കാതെ ‘വിധിക്കുക’ എന്നു നിലനിർത്തുന്നു.
- source_word: τὸν ἀδελφόν σου
  choice: നിന്റെ സഹോദരനെ
  rationale: ἀδελφός വ്യാകരണപരമായി പുല്ലിംഗ ഏകവചനമായതിനാൽ മുഖ്യപാഠത്തിൽ അതിന്റെ രൂപം കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ വിശ്വാസസമൂഹപരമായ വ്യാപ്തി അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἢ καὶ σὺ
  choice: അല്ലെങ്കിൽ നീയും
  rationale: καίയുടെ കൂട്ടിച്ചേർക്കൽഭാവവും രണ്ടാമത്തെ ‘നീ’ എന്ന ഊന്നലും സംരക്ഷിക്കുന്നു.
- source_word: τί ἐξουθενεῖς
  choice: നിസ്സാരനായി കാണുന്നത് എന്തിന്?
  rationale: ἐξουθενέω ഒരാളെ വിലയില്ലാത്തവനായി കണ്ട് അവജ്ഞയോടെ പെരുമാറുന്നതിനെ സൂചിപ്പിക്കുന്നു; സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷയിൽ ആ അർഥം നൽകുന്നു.
- source_word: πάντες γὰρ
  choice: നാമെല്ലാവരും
  rationale: πάντες പൗലോസിനെയും വായനക്കാരെയും ഉൾക്കൊള്ളുന്നു; γάρ നൽകുന്ന വിശദീകരണബന്ധം മുൻവാക്യങ്ങളിൽനിന്ന് സ്വാഭാവികമായി വ്യക്തമാകുന്നതിനാൽ മലയാളത്തിൽ പ്രത്യേക ബന്ധപദം ചേർക്കാതെ വാക്യപ്രവാഹം നിലനിർത്തുന്നു.
- source_word: παραστησόμεθα
  choice: നിൽക്കും
  rationale: ന്യായാധിപന്റെ മുമ്പാകെ ഹാജരായി നിൽക്കുക എന്ന കോടതിസംബന്ധമായ ദൃശ്യഭാവം സംക്ഷിപ്തമായി സംരക്ഷിക്കുന്നു.
- source_word: τῷ βήματι
  choice: ന്യായാസനത്തിനുമുമ്പിൽ
  rationale: βῆμα ഇവിടെ ന്യായവിധി നടത്തുന്ന അധികാരാസനത്തെ സൂചിപ്പിക്കുന്നു; ‘ന്യായാസനം’ നിയമപരവും സ്ഥാപിതവുമായ മലയാളസമാനപദമാണ്.
- source_word: τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ τοῦ θεοῦ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
theological_decisions:
- issue: എല്ലാവരും ആരുടെ βῆμαയുടെ മുമ്പാകെയാണ് നിൽക്കുന്നത്?
  choice: ദൈവത്തിന്റെ ന്യായാസനം
  alternative: ക്രിസ്തുവിന്റെ ന്യായാസനം
  rationale: നൽകിയിരിക്കുന്ന ഗ്രീക്ക് മുഖ്യപാഠം τοῦ θεοῦ എന്നു വായിക്കുന്നതിനാൽ ‘ദൈവത്തിന്റെ’ എന്നു മുഖ്യപാഠത്തിൽ പരിഭാഷപ്പെടുത്തി. ചില കൈയെഴുത്തുപ്രതികളിലെ ‘ക്രിസ്തുവിന്റെ’ എന്ന വായനയെ മുഖ്യപാഠവുമായി സമന്വയിപ്പിക്കാതെ അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: 'ആധുനിക മാനക മലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ഗൗരവമുള്ള ശൈലി. ആലങ്കാരിക ചോദ്യങ്ങളുടെ നേരിട്ടുള്ള ശാസനാഭാവവും കോടതിദൃശ്യവും നിലനിർത്തി. ഇംഗ്ലീഷ് ഉപദേശപാളിയിലെ അടിക്കുറിപ്പ്-അക്ഷരങ്ങളുടെ പ്രത്യക്ഷമായ സ്ഥാനമാറ്റം തിരുത്തി: സഹോദരൻ/സഹോദരി എന്ന വ്യത്യാസത്തിന് [a], ദൈവം/ക്രിസ്തു എന്ന പാഠഭേദത്തിന് [b].'
