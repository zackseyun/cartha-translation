id: ROM.14.9
reference: Romans 14:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: ml
  text: ഇതിനുവേണ്ടിയാണല്ലോ മശീഹ മരിക്കുകയും വീണ്ടും ജീവിക്കുകയും ചെയ്തത്[a]—മരിച്ചവരുടെയും ജീവിച്ചിരിക്കുന്നവരുടെയും മേൽ ഭരിക്കാനായി.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ജീവിച്ചു”; കൂടുതൽ വ്യക്തമായി, “ജീവനിലേക്കു ഉയിർത്തെഴുന്നേറ്റു.” ഗ്രീക്കിൽ അക്ഷരാർഥമായി “മരിച്ചു, ജീവിച്ചു” എന്നാണ്; സന്ദർഭം പുനരുത്ഥാനജീവിതത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: ഇതിനുവേണ്ടിയാണല്ലോ
  rationale: εἰς τοῦτο എന്നതിന്റെ ഉദ്ദേശ്യസൂചനയും γάρ നൽകുന്ന വിശദീകരണബന്ധവും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ ഒരുമിച്ച് പ്രകടമാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ സ്ഥാനപ്പേരായി വരുന്നതിനാൽ അതിന്റെ അർഥം നിലനിർത്തുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: ἀπέθανεν
  choice: മരിച്ചു
  rationale: സാധാരണവും നേരിട്ടുള്ളതുമായ ക്രിയാരൂപം; അധിക വിശദീകരണം ചേർക്കുന്നില്ല.
- source_word: ἔζησεν
  choice: വീണ്ടും ജീവിച്ചു
  rationale: ‘മരിച്ചു’ എന്നതിനോടുള്ള കൂട്ടുചേരലും തുടർന്നുള്ള സന്ദർഭവും പുനരുത്ഥാനജീവിതത്തെ സൂചിപ്പിക്കുന്നു. ‘വീണ്ടും’ സന്ദർഭസൂചന വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ അക്ഷരാർഥമായ ‘ജീവിച്ചു’ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἵνα
  choice: —…ഭരിക്കേണ്ടതിന്
  rationale: ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്ന ἵναയെ മലയാളത്തിൽ സ്വാഭാവികമായ ഉദ്ദേശ്യഘടനയായി പരിഭാഷപ്പെടുത്തി.
- source_word: νεκρῶν καὶ ζώντων
  choice: മരിച്ചവരെയും ജീവിച്ചിരിക്കുന്നവരെയും ഒരുപോലെ
  rationale: രണ്ട് വിഭാഗങ്ങളെയും ഉൾക്കൊള്ളുന്ന καὶ…καὶ ഘടനയുടെ ഊന്നൽ ‘ഒരുപോലെ’ എന്നതിലൂടെ സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: κυριεύσῃ
  choice: ഭരിക്കേണ്ടതിന്
  rationale: ക്രിയയുടെ നേരിട്ടുള്ള അർഥമായ അധികാരം നടത്തുക, ഭരിക്കുക എന്ന ആശയം സംരക്ഷിക്കുന്നു; അതിനെ നാമപദവിയായ ‘കർത്താവ്’ എന്നു മാറ്റുന്നില്ല.
theological_decisions:
- issue: ἔζησεν എന്ന പുനരുത്ഥാനസൂചനയുള്ള ക്രിയയുടെ പരിഭാഷ
  choice: വീണ്ടും ജീവിച്ചു
  alternative: ജീവിച്ചു; ഉയിർത്തെഴുന്നേറ്റു
  rationale: മരണത്തിനു ശേഷമുള്ള ജീവിതമാണ് സന്ദർഭം സൂചിപ്പിക്കുന്നത്. എന്നാൽ മൂലപാഠത്തിൽ ‘ഉയിർത്തെഴുന്നേറ്റു’ എന്ന പ്രത്യേക ക്രിയ ഇല്ലാത്തതിനാൽ അത്ര വ്യക്തമായി വികസിപ്പിക്കാതെ, അക്ഷരാർഥപരമായ മറ്റുവായന അടിക്കുറിപ്പിൽ സൂക്ഷിച്ചു.
- issue: κυριεύσῃയിലെ ക്രിസ്തുവിന്റെ അധികാരം
  choice: മരിച്ചവരെയും ജീവിച്ചിരിക്കുന്നവരെയും ഒരുപോലെ ഭരിക്കേണ്ടതിന്
  alternative: മരിച്ചവരുടെയും ജീവിച്ചിരിക്കുന്നവരുടെയും കർത്താവായിരിക്കേണ്ടതിന്
  rationale: κυριεύω ഒരു ക്രിയയായതിനാൽ ‘ഭരിക്കുക’ അതിന്റെ പ്രവർത്തനാത്മക അർഥം നേരിട്ട് നൽകുന്നു. ‘കർത്താവായിരിക്കുക’ എന്നത് സാധുവായ ദൈവശാസ്ത്രപരമായ വ്യാഖ്യാനമെങ്കിലും ഇവിടെ നാമപദവിയെ കൂടുതലായി മുന്നോട്ടുകൊണ്ടുവരും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പൗലോസിന്റെ വിശദീകരണാത്മക ബന്ധം ‘ആണല്ലോ’ എന്നും ഉദ്ദേശ്യബന്ധം ‘ഭരിക്കേണ്ടതിന്’ എന്നും നൽകി; ദൈവശാസ്ത്രപരമായ അർഥം അനാവശ്യമായി വികസിപ്പിച്ചിട്ടില്ല.
