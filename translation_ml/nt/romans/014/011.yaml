id: ROM.14.11
reference: Romans 14:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “ഞാൻ ജീവിച്ചിരിക്കുന്നതുപോലെ, കർത്താവ് അരുളിച്ചെയ്യുന്നു, എന്റെ മുമ്പിൽ എല്ലാ മുട്ടും മടങ്ങും; എല്ലാ നാവും ദൈവത്തോട് ഏറ്റുപറയും[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘അംഗീകരിക്കും’ എന്നും ‘ദൈവത്തെ സ്തുതിക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. സന്ദർഭമനുസരിച്ച് ഗ്രീക്ക് ക്രിയയ്ക്ക് ഏറ്റുപറയുക, അംഗീകരിക്കുക, സ്തുതിക്കുക എന്നീ അർഥഭാവങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: ഇങ്ങനെ എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്തിലെ ഉദ്ധരണി അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാല കർമണിപ്രയോഗത്തിന്റെ ആധികാരികവും തുടർന്നുനിൽക്കുന്നതുമായ ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Ζῶ ἐγώ
  choice: ഞാൻ ജീവിക്കുന്നതുപോലെതന്നെ
  rationale: ദൈവത്തിന്റെ ജീവനാൽ ഉറപ്പുനൽകുന്ന ശപഥസദൃശമായ പ്രഖ്യാപനത്തിന്റെ ഗൗരവം നിലനിർത്തുന്നു; വെറും ‘ഞാൻ ജീവിക്കുന്നു’ എന്നതിനെക്കാൾ സന്ദർഭോചിതമാണ്.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന പദത്തിന്റെ സാധാരണവും മാന്യവുമായ മലയാള പരിഭാഷ; ഗ്രീക്കിൽ ദൈവനാമമല്ല, κύριος തന്നെയായതിനാൽ ‘യഹോവ’ എന്നു മാറ്റിയിട്ടില്ല.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: എന്റെ മുമ്പിൽ എല്ലാ മുട്ടും മടങ്ങും
  rationale: മുട്ടുമടക്കുന്നതിന്റെ കീഴടങ്ങൽ/വണക്കം സൂചിപ്പിക്കുന്ന ദൃശ്യരൂപം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു. ἐμοί എന്ന ദാതുവിന്റെ ബന്ധം ‘എന്റെ മുമ്പിൽ’ എന്ന പ്രയോഗത്തിലൂടെ വ്യക്തമാക്കുന്നു.
- source_word: πᾶσα γλῶσσα
  choice: എല്ലാ നാവും
  rationale: വ്യക്തികളെന്നു പരാവർത്തനം ചെയ്യാതെ മൂലത്തിലെ ശരീരാവയവരൂപകവും തിരുവെഴുത്തുസ്വരവും സംരക്ഷിക്കുന്നു.
- source_word: ἐξομολογήσεται
  choice: ഏറ്റുപറയും
  rationale: പരസ്യമായി സമ്മതിക്കുക/അംഗീകരിക്കുക എന്ന മുഖ്യഭാവം നൽകുന്നു; സ്തുതിക്കുക എന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തോട്
  rationale: ദാതുവിനെ വ്യക്തമായി പരിഭാഷപ്പെടുത്തുകയും, മുൻവാക്യത്തിലെ ഒന്നാംപുരുഷമായ ‘എന്റെ’ എന്നതിൽനിന്ന് ‘ദൈവത്തോട്’ എന്നതിലേക്കുള്ള മൂലപാഠത്തിലെ മാറ്റം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഉദ്ധരണിയിലെ ‘കർത്താവ്’, ‘എന്റെ’, ‘ദൈവത്തോട്’ എന്നീ പരാമർശങ്ങളുടെ ബന്ധം
  choice: ‘കർത്താവ് അരുളിച്ചെയ്യുന്നു ... എന്റെ മുമ്പിൽ ... ദൈവത്തോട്’ എന്ന മൂലപാഠരൂപം മാറ്റമില്ലാതെ നിലനിർത്തി.
  alternative: അവസാനഭാഗം ‘എന്നോട് ഏറ്റുപറയും’ എന്നു സമാന്തരമാക്കുക, അല്ലെങ്കിൽ കർത്താവിനെയും ദൈവത്തെയും കുറിച്ചുള്ള ക്രിസ്തുശാസ്ത്രപരമായ നിഗമനം പരിഭാഷയിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: ഒന്നാംപുരുഷ ദൈവവചനത്തിൽനിന്ന് ‘ദൈവത്തോട്’ എന്ന പ്രയോഗത്തിലേക്കുള്ള മാറ്റം പൗലോസിന്റെ വാചകത്തിൽ യഥാർത്ഥമായി നിലനിൽക്കുന്നു. അതിനെ സമന്വയിപ്പിക്കുകയോ പ്രത്യേക സിദ്ധാന്തനിഗമനം പരിഭാഷയിൽ ചേർക്കുകയോ ചെയ്യാതെ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം സംരക്ഷിച്ചു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിൽ, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നെങ്കിലും തിരുവെഴുത്ത് ഉദ്ധരണിക്ക് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘അരുളിച്ചെയ്യുന്നു’ ഉദ്ധരണിയിലെ ദൈവിക പ്രഖ്യാപനത്തിന് മാന്യഭാവം നൽകുന്നു. ലഭിച്ച ഇംഗ്ലീഷ് പാഠത്തിൽ [a] ‘As I live’ എന്നതിനു പിന്നാലെയാണെങ്കിലും അടിക്കുറിപ്പിന്റെ ഉള്ളടക്കം ἐξομολογήσεται എന്ന ക്രിയയെക്കുറിച്ചായതിനാൽ മലയാളത്തിൽ സൂചകം ‘ഏറ്റുപറയും’ എന്നതിനുശേഷം സ്ഥാപിച്ചു.
