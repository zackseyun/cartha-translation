  source_fidelity: 'മൂലപാഠത്തിന്റെ പ്രധാന ആശയങ്ങൾ കരടിൽ കൃത്യമായി പ്രതിഫലിക്കുന്നു: ഭക്ഷണത്തിന്റെ പേരിൽ ദൈവത്തിന്റെ പ്രവൃത്തി തകർക്കരുത്; എല്ലാം ശുദ്ധമാണ്; ഇടർച്ചയുമായി ബന്ധപ്പെട്ട് ഭക്ഷിക്കുന്നത് ധാർമികമായി തിന്മയാണ്. διὰ προσκόμματος എന്ന ചുരുക്കപ്രയോഗത്തെ ‘മറ്റൊരാൾക്ക് ഇടർച്ചയുണ്ടാക്കുന്ന’ എന്ന സന്ദർഭാനുസൃത അർഥത്തിൽ പ്രധാനപാഠത്തിൽ നൽകിയതും, മറ്റൊരു വ്യാകരണ/സന്ദർഭസാധ്യത കുറിപ്പിൽ സൂക്ഷിച്ചതും ഉചിതമാണ്.'
  naturalness: ‘ശുദ്ധംതന്നെ’ എന്ന ചേർത്തെഴുത്തും പ്രയോഗവും ആധുനിക നിലവാരമലയാളത്തിൽ അല്പം അസ്വാഭാവികമാണ്. ‘എല്ലാം ശുദ്ധമാണ്; എന്നാൽ’ എന്ന രൂപം μέν...ἀλλάയുടെ വിരുദ്ധബന്ധം വ്യക്തമായി പ്രകടിപ്പിക്കുകയും സ്വാഭാവിക ബൈബിൾഗദ്യമായി കേൾക്കുകയും ചെയ്യുന്നു. കുറിപ്പിലും ഇതേ മെച്ചപ്പെടുത്തൽ ആവശ്യമാണ്.
