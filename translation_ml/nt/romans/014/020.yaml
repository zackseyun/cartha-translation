id: ROM.14.20
reference: Romans 14:20
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: ml
  text: ഭക്ഷണത്തിനുവേണ്ടി ദൈവത്തിന്റെ പ്രവൃത്തി തകർത്തുകളയരുത്. എല്ലാം ശുദ്ധമാണ്[a]; എന്നാൽ മറ്റൊരാൾക്ക് ഇടർച്ചയുണ്ടാക്കുന്ന വിധത്തിൽ ഭക്ഷിക്കുന്നയാൾക്ക് അത് തിന്മയാണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: സന്ദർഭം ഭക്ഷണത്തെക്കുറിച്ചായതിനാൽ, “എല്ലാ ഭക്ഷണവും ശുദ്ധമാണ്” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഇടർച്ചയോടെ ഭക്ഷിക്കുന്നയാൾക്ക് അത് തിന്മയാണ്.” ഗ്രീക്ക് പ്രയോഗം ഇടർച്ച മറ്റൊരാൾക്കാണോ ഭക്ഷിക്കുന്നയാൾക്കുതന്നെയാണോ ഉണ്ടാകുന്നതെന്ന് തുറന്നുവയ്ക്കാം.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: ഭക്ഷണത്തിനുവേണ്ടി
  rationale: ἕνεκεν + ജനിറ്റീവ് കാരണം അഥവാ ഉദ്ദേശ്യം സൂചിപ്പിക്കുന്നു; നിസ്സാരമായ ഭക്ഷണകാര്യത്തിനായി ദൈവപ്രവൃത്തി നശിപ്പിക്കരുതെന്ന വൈരുധ്യം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κατάλυε
  choice: തകർത്തുകളയരുത്
  rationale: μή സഹിതമുള്ള വർത്തമാനകാല ആജ്ഞയുടെ നിരോധനസ്വഭാവവും, പണിതുയർത്തിയ ഒന്നിനെ പൊളിച്ചുകളയുന്ന രൂപകവും ഈ പ്രയോഗം സൂക്ഷിക്കുന്നു.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ പ്രവൃത്തി
  rationale: ജനിറ്റീവ് ബന്ധവും പ്രയോഗത്തിന്റെ വിശാലമായ ദൈവശാസ്ത്രപരമായ അർഥവും നേരിട്ട് നിലനിർത്തുന്നു.
- source_word: πάντα μὲν καθαρά
  choice: എല്ലാം ശുദ്ധംതന്നെ
  rationale: πάντα എന്നതിന്റെ വിശാലത നിലനിർത്തുന്നു; സന്ദർഭം അത് ഭക്ഷണത്തെക്കുറിച്ചാണെന്ന് വ്യക്തമാക്കുന്നു. μέν ന്റെ ഊന്നൽ ‘തന്നെ’ എന്നും καθαράയുടെ ശുദ്ധി-ഭാഷ ‘ശുദ്ധം’ എന്നും പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: κακὸν
  choice: തിന്മയാണ്
  rationale: ‘തെറ്റ്’ എന്നതിനെക്കാൾ κακόν ന്റെ ധാർമിക ഗൗരവം ശക്തമായി നിലനിർത്തുന്നു.
- source_word: τῷ ἀνθρώπῳ
  choice: ഭക്ഷിക്കുന്നയാൾക്ക്
  rationale: ἄνθρωπος ഇവിടെ പൊതുവായി ഒരു വ്യക്തിയെ സൂചിപ്പിക്കുന്നു; മലയാളത്തിലെ ‘യാൾ’ സ്വാഭാവികവും ലിംഗനിരപേക്ഷവുമാണ്.
- source_word: διὰ προσκόμματος
  choice: മറ്റൊരാൾക്ക് ഇടർച്ചയുണ്ടാക്കുന്ന വിധത്തിൽ
  rationale: πρόσκομμα എന്ന ഇടർച്ചയുടെ രൂപകം നിലനിർത്തിക്കൊണ്ട്, ഭക്ഷിക്കുന്നതിലൂടെ മറ്റൊരാൾ ഇടറുന്നു എന്ന സന്ദർഭാർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐσθίοντι
  choice: ഭക്ഷിക്കുന്നയാൾക്ക്
  rationale: ആർട്ടിക്കിളോടുകൂടിയ വർത്തമാനകാല കൃദന്തത്തിന്റെ വ്യക്തിയെ വിശേഷിപ്പിക്കുന്ന സ്വഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ‘ശുദ്ധം’ എന്ന പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ‘എല്ലാം ശുദ്ധംതന്നെ’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തി, ഭക്ഷണസന്ദർഭം വ്യാഖ്യാനക്കുറിപ്പിൽ വ്യക്തമാക്കുക.
  alternative: ‘എല്ലാ ഭക്ഷണവും ശുദ്ധമാണ്’ എന്ന് വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്കിൽ πάντα എന്ന് മാത്രമാണ്; ‘ഭക്ഷണം’ ആവർത്തിക്കുന്നില്ല. അതിനാൽ വാചകത്തിന്റെ വിശാലതയും ശുദ്ധി-ഭാഷയും നിലനിർത്തി, സന്ദർഭപരമായ അർഥം കുറിപ്പിൽ നൽകുന്നു.
- issue: διὰ προσκόμματος എന്നതിലെ അർഥസാധ്യത
  choice: മറ്റൊരാൾക്ക് ഇടർച്ചയുണ്ടാക്കുന്ന വിധത്തിലുള്ള ഭക്ഷണം എന്ന ബന്ധപരമായ അർഥം പ്രധാനപാഠത്തിൽ നൽകുക.
  alternative: തനിക്കുതന്നെ മനസ്സാക്ഷിയിൽ ഇടർച്ചയുണ്ടായിട്ടും ഭക്ഷിക്കുന്നു എന്നർഥത്തിൽ വായിക്കുക.
  rationale: റോമർ 14-ലെ സഹവിശ്വാസിയെ ഇടറിക്കാതിരിക്കാനുള്ള ആഹ്വാനം പ്രധാന വായനയെ പിന്തുണയ്ക്കുന്നു; എങ്കിലും ഗ്രീക്ക് പ്രയോഗം ചുരുക്കമായതിനാൽ മറ്റൊരു സാധ്യത കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
- issue: τῷ ἀνθρώπῳ എന്ന പൊതുവായ ഏകവചനം
  choice: ലിംഗനിരപേക്ഷമായ ‘ഭക്ഷിക്കുന്നയാൾക്ക്’ ഉപയോഗിക്കുക.
  alternative: ‘ഭക്ഷിക്കുന്ന മനുഷ്യന്’ എന്ന് രൂപപരമായി അടുത്ത് പരിഭാഷപ്പെടുത്തുക.
  rationale: ἄνθρωπος ഇവിടെ പുരുഷനെ പ്രത്യേകിച്ച് വേർതിരിക്കുന്നില്ല; മലയാളത്തിൽ പൊതുവായ വ്യക്തിയെ സൂചിപ്പിക്കാൻ ‘യാൾ’ കൂടുതൽ സ്വാഭാവികവും കൃത്യവുമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ബൈബിൾ ഗദ്യം. ‘തകർത്തുകളയരുത്’, ‘ശുദ്ധം’, ‘ഇടർച്ച’ എന്നിവ മൂലപാഠത്തിലെ നിർമ്മാണരൂപകം, ശുദ്ധി-ഭാഷ, stumbling രൂപകം എന്നിവ നിലനിർത്തുന്നു.
