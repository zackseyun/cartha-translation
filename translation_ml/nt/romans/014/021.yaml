id: ROM.14.21
reference: Romans 14:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: ml
  text: മാംസം ഭക്ഷിക്കാതിരിക്കുന്നതും വീഞ്ഞ് കുടിക്കാതിരിക്കുന്നതും നിന്റെ സഹോദരൻ ഇടറുകയോ, വീഴ്ചയിൽ അകപ്പെടുകയോ, ദുർബലനാകുകയോ ചെയ്യാൻ ഇടയാക്കുന്ന ഒന്നും ചെയ്യാതിരിക്കുന്നതും നല്ലതാണ്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ഈ സന്ദർഭത്തിൽ കൂടുതൽ ഉൾക്കൊള്ളുന്ന വിധത്തിൽ, “നിന്റെ സഹോദരനോ സഹോദരിയോ”—അതായത്, ഒരു സഹവിശ്വാസി.
    reason: ἀδελφός പുല്ലിംഗ ഏകവചനമാണെങ്കിലും സന്ദർഭത്തിൽ ഏതൊരു സഹവിശ്വാസിയെയും പ്രതിനിധാനപരമായി സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: καλὸν
  choice: നല്ലതാണ്
  rationale: ഇവിടെ καλός ഒരു പ്രവൃത്തിയെ ധാർമികമായി ഉചിതവും പ്രശംസനീയവുമായി വിലയിരുത്തുന്നു; ‘നല്ലതാണ്’ സ്വാഭാവികവും അർഥവ്യാപ്തിയുള്ളതുമാണ്.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: മാംസം ഭക്ഷിക്കാതിരിക്കുന്നത്
  rationale: ആർട്ടിക്കുലാർ ഇൻഫിനിറ്റീവിന്റെ അമൂർത്ത പ്രവൃത്തിഭാവം നിലനിർത്തുകയും κρέαയെ ഭക്ഷണസന്ദർഭത്തിൽ സ്വാഭാവികമായി ‘മാംസം’ എന്നു നൽകുകയും ചെയ്യുന്നു.
- source_word: μηδὲ πιεῖν οἶνον
  choice: വീഞ്ഞു കുടിക്കാതിരിക്കുന്നത്
  rationale: μηδέ ചേർക്കുന്ന രണ്ടാമത്തെ വിട്ടുനിൽക്കൽ വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μηδὲ ἐν ᾧ
  choice: ഇടയാക്കുന്ന മറ്റൊന്നും ചെയ്യാതിരിക്കുന്നത്
  rationale: ഗ്രീക്കിൽ അവസാന ഘടകം ക്രിയാലോപമുള്ളതാണ്. മലയാളത്തിൽ അർഥം പൂർണമാക്കാൻ സൂചിതമായ പ്രവൃത്തി ‘മറ്റൊന്നും ചെയ്യാതിരിക്കുന്നത്’ എന്നു മിതമായി പൂരിപ്പിച്ചു.
- source_word: ὁ ἀδελφός σου
  choice: നിന്റെ സഹോദരൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം മുഖ്യപാഠത്തിൽ കൃത്യമായി നിലനിർത്തുന്നു; സന്ദർഭത്തിലെ സഹവിശ്വാസി എന്ന ഉൾക്കൊള്ളുന്ന പ്രയോഗം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: προσκόπτει
  choice: ഇടറുക
  rationale: ആത്മീയമോ ധാർമികമോ ആയ തടസ്സത്തെ സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ രൂപകം മലയാളത്തിൽ ‘ഇടറുക’ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: σκανδαλίζεται
  choice: പാപത്തിലേക്കു വീഴുക
  rationale: നിഷ്ക്രിയരൂപത്തിന്റെ ‘കെണിയിലാകുക/വീഴ്ത്തപ്പെടുക’ എന്ന ആശയം, προσκόπτει എന്നതിലെ ‘ഇടറുക’യുമായി പൂർണമായി ലയിപ്പിക്കാതെ, സന്ദർഭോചിതമായി വ്യക്തമാക്കുന്നു.
- source_word: ἀσθενεῖ
  choice: ദുർബലനാകുക
  rationale: ശാരീരിക ദൗർബല്യമായി ചുരുക്കാതെ, ഈ സന്ദർഭത്തിലെ മനസ്സാക്ഷിയിലോ വിശ്വാസത്തിലോ ഉണ്ടാകുന്ന ബലക്ഷയത്തിന്റെ വിശാലത നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἀδελφός എന്ന പദത്തിന്റെ പ്രതിനിധാനപരമായ വ്യാപ്തി
  choice: മുഖ്യപാഠത്തിൽ ‘നിന്റെ സഹോദരൻ’
  alternative: ‘നിന്റെ സഹോദരനോ സഹോദരിയോ’ അഥവാ ‘നിന്റെ സഹവിശ്വാസി’
  rationale: മൂലപാഠത്തിലെ പുല്ലിംഗ ഏകവചനം സംരക്ഷിക്കുന്നു. എന്നാൽ സന്ദർഭത്തിൽ ഇത് സ്ത്രീപുരുഷഭേദമില്ലാതെ സഹവിശ്വാസിയെ സൂചിപ്പിക്കാമെന്ന കാര്യം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: προσκόπτει, σκανδαλίζεται എന്നീ സമീപാർഥ ക്രിയകളുടെ വേർതിരിവ്
  choice: ‘ഇടറുകയോ പാപത്തിലേക്കു വീഴുകയോ’
  alternative: ‘ഇടറുകയോ കുറ്റപ്പെടുകയോ’
  rationale: രണ്ട് ക്രിയകളുടെയും അർഥസാമീപ്യം നിലനിർത്തിയിട്ടും അവയെ ഒരേ മലയാളപദത്തിൽ ലയിപ്പിക്കുന്നില്ല. σκανδαλίζεταιയെ വെറും മാനസികമായ ‘കുറ്റപ്പെടൽ’ ആയി ചുരുക്കാതെ ധാർമിക കെണിയിലാകുന്ന ആശയം പ്രകടമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘മാംസം’, ‘വീഞ്ഞ്’, ‘ഇടറുക’, ‘ദുർബലനാകുക’ എന്നിവ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ബൈബിൾസന്ദർഭത്തിന് യോജിച്ചതുമാണ്. ഗ്രീക്കിലെ ക്രിയാലോപം മലയാളത്തിൽ മിതമായി പൂരിപ്പിച്ചിരിക്കുന്നു.
