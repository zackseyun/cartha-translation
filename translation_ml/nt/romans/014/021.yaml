- from: മാംസം ഭക്ഷിക്കാതിരിക്കുന്നതും വീഞ്ഞു കുടിക്കാതിരിക്കുന്നതും നിന്റെ സഹോദരൻ ഇടറുകയോ പാപത്തിലേക്കു വീഴുകയോ ദുർബലനാകുകയോ ചെയ്യാൻ ഇടയാക്കുന്ന മറ്റൊന്നും ചെയ്യാതിരിക്കുന്നതും നല്ലതാണ്.[a]
