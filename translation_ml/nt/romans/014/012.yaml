  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: ml
  text: അതുകൊണ്ട്, നമ്മിൽ ഓരോരുത്തനും തന്നെക്കുറിച്ച്[a] കണക്കു കൊടുക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “തന്നെപ്പറ്റി” അല്ലെങ്കിൽ, സന്ദർഭാനുസരിച്ച്, “തനിക്കുവേണ്ടി.” ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ “തന്നെ സംബന്ധിച്ച്” എന്നാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സൂചിപ്പിക്കുന്ന പദം; ആ യുക്തിബന്ധം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἕκαστος ἡμῶν
  choice: നമ്മിൽ ഓരോരുത്തനും
  rationale: ἕκαστος എന്നതിന്റെ വ്യക്തിവിതരണ അർത്ഥവും ἡμῶν എന്ന ഭാഗിക ഷഷ്ഠിയുടെ അർത്ഥവും വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: περὶ ἑαυτοῦ
  choice: തന്നെക്കുറിച്ച്
  rationale: περί + ഷഷ്ഠിയുടെ ‘സംബന്ധിച്ച്/കുറിച്ച്’ എന്ന അടിസ്ഥാന അർത്ഥം നിലനിർത്തുന്നു; ആത്മവാചക സർവനാമം ഓരോ വ്യക്തിയെയും പ്രത്യേകം സൂചിപ്പിക്കുന്നു.
- source_word: λόγον
  choice: കണക്കു
  rationale: λόγον δώσει എന്ന പ്രയോഗത്തിൽ വിലയിരുത്തലിനോ ന്യായവിധിക്കോ മുമ്പാകെ കണക്കു നൽകുക എന്ന ആശയമാണ്; ‘കണക്കു ബോധിപ്പിക്കുക’ മലയാളത്തിൽ സ്വാഭാവികമായ പ്രയോഗമാണ്.
- source_word: δώσει
  choice: ബോധിപ്പിക്കും
  rationale: ഭാവികാലത്തെ നിലനിർത്തിക്കൊണ്ട് λόγον δώσει എന്ന സംയുക്തപ്രയോഗം സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: ആത്മവാചക സർവനാമത്തിന്റെ വ്യക്തിവിതരണ സ്വഭാവം
  choice: തന്നെക്കുറിച്ച്
  alternative: അവരവരെക്കുറിച്ച് / തനിക്കുവേണ്ടി
  rationale: ഗ്രീക്ക് വാക്യം ഓരോ വ്യക്തിയെയും ഏകവചനത്തിൽ പ്രത്യേകം കണക്കു പറയേണ്ടവനായി അവതരിപ്പിക്കുന്നു. മലയാളത്തിലെ ‘തന്നെക്കുറിച്ച്’ ലിംഗഭേദം അനാവശ്യമായി ചേർക്കാതെ ആ വ്യക്തിവിതരണ അർത്ഥം സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക പ്രമാണമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കണക്കു ബോധിപ്പിക്കും’ എന്നത് മൂലത്തിലെ ന്യായപരമായോ വിലയിരുത്തൽപരമായോ ഉള്ള പ്രയോഗത്തെ സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികമായി എത്തിക്കുന്നു.
