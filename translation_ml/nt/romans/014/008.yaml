id: ROM.14.8
reference: Romans 14:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: ml
  text: എന്തെന്നാൽ, നാം ജീവിക്കുന്നെങ്കിൽ കർത്താവിനായി ജീവിക്കുന്നു; നാം മരിക്കുന്നെങ്കിൽ കർത്താവിനായി മരിക്കുന്നു.[a] അങ്ങനെ, നാം ജീവിച്ചാലും മരിച്ചാലും കർത്താവിന്റേതാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കർത്താവിനുവേണ്ടി’ എന്നും വിവർത്തനം ചെയ്യാം. ‘കർത്താവിനായി ജീവിക്കുന്നു’, ‘കർത്താവിനായി മരിക്കുന്നു’ എന്നീ ആവർത്തിച്ച പ്രയോഗങ്ങളിലെ ഗ്രീക്ക് ദാതിവിഭക്തിക്ക് ബന്ധം, ദിശാബോധം, അല്ലെങ്കിൽ പ്രയോജനം സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘നാം കർത്താവിനുള്ളവരാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: നാം … എങ്കിൽ
  rationale: γάρ ഈ വാക്യത്തെ മുൻവാക്യത്തിലെ ആശയത്തിന്റെ വിശദീകരണമായി ബന്ധിപ്പിക്കുന്നു; എന്നാൽ മലയാളത്തിൽ വാക്യാരംഭത്തിൽ ‘എന്തെന്നാൽ’ ചേർക്കുന്നത് ഇവിടെ ഭാരമുള്ളതാകുന്നതിനാൽ, വിശദീകരണബന്ധം സ്വാഭാവികമായ വാക്യപ്രവാഹത്തിലൂടെ നിലനിർത്തി. ἐάν τε ആവർത്തിച്ചുള്ള ഉപാധിവാക്യങ്ങൾ ‘… എങ്കിൽ’ എന്നു നൽകി.
- source_word: ζῶμεν / ζῶμεν
  choice: ജീവിക്കുന്നെങ്കിൽ / ജീവിക്കുന്നത്
  rationale: ζάω എന്ന ക്രിയയുടെ ആവർത്തനം നിലനിർത്തി; ഉപാധിയും അതിന്റെ ഫലവാക്യവും മലയാളത്തിൽ സ്വാഭാവികമായി വേർതിരിച്ചു.
- source_word: τῷ κυρίῳ
  choice: കർത്താവിനായാണ്
  rationale: ദാതിവിഭക്തി കർത്താവിനോടുള്ള ബന്ധം, ദിശാബോധം, അല്ലെങ്കിൽ പ്രയോജനം സൂചിപ്പിക്കാം. ‘കർത്താവിനായാണ്’ സാധാരണ മലയാളത്തിൽ സ്വാഭാവികവും ആവർത്തനഘടന നിലനിർത്തുന്നതുമാണ്; അതിന്റെ വിശാലമായ സാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കി.
- source_word: κύριος
  choice: കർത്താവ്
  rationale: κύριος എന്ന ബഹുമാനപദവിയുടെ ദൈവശാസ്ത്രപരമായ ഭാരവും സന്ദർഭത്തിലെ ക്രിസ്തുസംബന്ധമായ സൂചനയും നിലനിർത്തുന്ന സ്ഥിരമായ മലയാളപ്രയോഗം.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: മരിക്കുന്നെങ്കിൽ / മരിക്കുന്നത്
  rationale: ക്രിയയെ പൊതുവായ ജീവൻ–മരണം വിരുദ്ധജോടിയായി നേരിട്ട് വിവർത്തനം ചെയ്തു; പുരോഗമനപ്രവർത്തി എന്ന അർഥം അനാവശ്യമായി ചേർത്തില്ല.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള സമാന്തര ഉപാധിവാക്യങ്ങളിൽനിന്നുള്ള നിഗമനം വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: τοῦ κυρίου ἐσμέν
  choice: കർത്താവിനുള്ളവരാണ്
  rationale: ജനിറ്റീവ് ഘടനയിലെ ഉടമസ്ഥതയും ഉൾപ്പെടലും സംക്ഷിപ്തമായി പ്രകടിപ്പിക്കുന്നു; ‘കർത്താവിന്റെവരാണ്’ എന്നതിനേക്കാൾ ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: κύριος എന്ന പദത്തിന്റെ സൂചിതവ്യക്തി
  choice: ‘കർത്താവ്’ എന്ന പദവി മാത്രം ഉപയോഗിച്ചു; യേശു എന്നു വാചകത്തിൽ വ്യക്തമാക്കിച്ചേർത്തില്ല.
  alternative: ‘കർത്താവായ യേശു’ അല്ലെങ്കിൽ പൊതുവായി ‘ദൈവം’ എന്നു നൽകുക.
  rationale: തൊട്ടടുത്ത സന്ദർഭം ക്രിസ്തുവിലേക്കു വിരൽചൂണ്ടുന്നുവെങ്കിലും, ഗ്രീക്ക് വാചകം κύριος എന്ന പദവി മാത്രമാണ് ഉപയോഗിക്കുന്നത്. അതിനാൽ സന്ദർഭസൂചനയും വിശാലമായ ദൈവശാസ്ത്രപ്രതിധ്വനിയും ഒരുപോലെ നിലനിൽക്കുന്നു.
- issue: കർത്താവിനോടു ബന്ധപ്പെട്ട് ജീവിക്കുകയും മരിക്കുകയും ചെയ്യുന്നതിന്റെ ഭാവം
  choice: മുഖ്യവാചകത്തിൽ ‘കർത്താവിനായാണ്’ എന്നു നൽകി, ബന്ധം/ദിശ/പ്രയോജനം എന്നിവയുടെ വിശാലത അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
  alternative: ‘കർത്താവിനുവേണ്ടി’, ‘കർത്താവിനോടുള്ള ബന്ധത്തിൽ’, അല്ലെങ്കിൽ ‘കർത്താവിന്റെ അധികാരത്തിൻ കീഴിൽ’ എന്നു നൽകുക.
  rationale: ദാതിവിഭക്തിയെ സേവനം, പ്രയോജനം, അല്ലെങ്കിൽ അധികാരം എന്ന ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതിരിക്കണം; അവസാനത്തെ ‘കർത്താവിനുള്ളവരാണ്’ എന്ന വാക്യം ബന്ധവും ഉടമസ്ഥതയും ഊന്നുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ജീവിക്കുക/മരിക്കുക എന്ന സമാന്തര ആവർത്തനവും നിഗമനഘടനയും നിലനിർത്തി; അസ്വാഭാവികമായ പദാനുപദവിവർത്തനം ഒഴിവാക്കി.
