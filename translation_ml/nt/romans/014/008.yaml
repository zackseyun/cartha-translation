revisions:
- from: നാം ജീവിക്കുന്നെങ്കിൽ, കർത്താവിനായാണ് ജീവിക്കുന്നത്; നാം മരിക്കുന്നെങ്കിൽ, കർത്താവിനായാണ് മരിക്കുന്നത്.[a] അതുകൊണ്ട്, നാം ജീവിച്ചാലും മരിച്ചാലും കർത്താവിനുള്ളവരാണ്.[b]
  to: എന്തെന്നാൽ, നാം ജീവിക്കുന്നെങ്കിൽ കർത്താവിനായി ജീവിക്കുന്നു; നാം മരിക്കുന്നെങ്കിൽ കർത്താവിനായി മരിക്കുന്നു.[a] അങ്ങനെ, നാം ജീവിച്ചാലും മരിച്ചാലും കർത്താവിന്റേതാണ്.[b]
  rationale: ‘എന്തെന്നാൽ’ ചേർത്ത് γάρ-ന്റെ വിശദീകരണബന്ധം പുനഃസ്ഥാപിച്ചു. ‘കർത്താവിനായി’ എന്ന കൂടുതൽ നിഷ്പക്ഷമായ രൂപം ഉപയോഗിച്ച് ദാതിവിഭക്തിയുടെ ബന്ധ/ദിശ/പ്രയോജന സാധ്യതകൾ ഒരു അർഥത്തിലേക്ക് ചുരുക്കാതെ നിലനിർത്തി. അവസാന ജനിറ്റീവ് ഘടനയെ ‘കർത്താവിന്റേതാണ്’ എന്നു നേരിട്ട് വിവർത്തനം ചെയ്തു; അർഥസമാനമായ സ്വാഭാവിക ബദൽ അടിക്കുറിപ്പിൽ നൽകി.
