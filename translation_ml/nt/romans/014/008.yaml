review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional life/death parallel, the repeated relation to the Lord, and the concluding belonging statement. However, it omits γάρ (‘for’), which explicitly marks the verse as explanatory in relation to the preceding argument. ‘കർത്താവിനായാണ്’ is viable, but ‘കർത്താവിനായി’ avoids excessive emphatic focus while retaining the broad relational/orientational sense of the Greek dative.
  naturalness: The revised wording is idiomatic, concise modern standard Malayalam and retains the Greek's balanced repetition and inferential conclusion.
  terminology: ‘കർത്താവ്’ appropriately renders κύριος without over-specifying the referent. ‘കർത്താവിന്റേതാണ്’ naturally and directly conveys τοῦ κυρίου ἐσμέν; the alternative ‘കർത്താവിനുള്ളവരാണ്’ is retained in the footnote.
  issues:
  - severity: medium
    issue: γάρ is not represented in the draft.
    rationale: The opening ‘For’ is an explicit explanatory connector in the Greek and should be represented in Malayalam, naturally as ‘എന്തെന്നാൽ’.
  - severity: low
    issue: The main wording uses the emphatic form ‘കർത്താവിനായാണ്’ twice.
    rationale: The Greek repetition does not itself require emphatic focus. ‘കർത്താവിനായി ജീവിക്കുന്നു/മരിക്കുന്നു’ is more neutral and natural while preserving the dative's broad relation.
  revised_text: എന്തെന്നാൽ, നാം ജീവിക്കുന്നെങ്കിൽ കർത്താവിനായി ജീവിക്കുന്നു; നാം മരിക്കുന്നെങ്കിൽ കർത്താവിനായി മരിക്കുന്നു.[a] അങ്ങനെ, നാം ജീവിച്ചാലും മരിച്ചാലും കർത്താവിന്റേതാണ്.[b]
