id: ROM.14.6
reference: Romans 14:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: ml
  text: ആ ദിവസത്തെ ആചരിക്കുന്നവൻ കർത്താവിനുവേണ്ടി അതിനെ ആചരിക്കുന്നു.[a] ഭക്ഷിക്കുന്നവൻ കർത്താവിനുവേണ്ടി ഭക്ഷിക്കുന്നു; കാരണം, അവൻ ദൈവത്തിനു നന്ദി പറയുന്നു. ഭക്ഷിക്കാത്തവൻ കർത്താവിനുവേണ്ടി ഭക്ഷിക്കുന്നില്ല; അവനും ദൈവത്തിനു നന്ദി പറയുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ആ ദിവസത്തെ പ്രത്യേകം പരിഗണിക്കുന്നവൻ കർത്താവിനെ മുൻനിർത്തി അങ്ങനെ ചെയ്യുന്നു.” ‘ആചരിക്കുന്നു’ എന്നു പരിഭാഷപ്പെടുത്തിയ ഗ്രീക്ക് ക്രിയയ്ക്ക് മനസ്സുവെക്കുക, പരിഗണിക്കുക എന്നീ അർഥങ്ങളും വരാം; ഇവിടെ ഒരു ദിവസത്തിന് പ്രായോഗികമായി പ്രത്യേക പരിഗണന നൽകുന്നതാണ് സാധ്യതയേറിയ അർഥം.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: ആചരിക്കുന്നവൻ / ആചരിക്കുന്നു
  rationale: ദിവസത്തോടു പ്രത്യേക പരിഗണന കാണിച്ച് അതനുസരിച്ച് പ്രവർത്തിക്കുന്നതാണു സന്ദർഭത്തിലെ അർഥം. വെറും മാനസിക ചിന്തയെക്കാൾ പ്രായോഗികമായ ആചരണം ‘ആചരിക്കുക’ സ്വാഭാവികമായി അറിയിക്കുന്നു; ‘പരിഗണിക്കുക’ എന്ന വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: τὴν ἡμέραν
  choice: ആ ദിവസത്തെ
  rationale: ഗ്രീക്കിലെ നിർദേശക ഉപപദവും തൊട്ടുമുമ്പുള്ള സന്ദർഭത്തിൽ ചർച്ചയായ ദിവസവും സൂചിപ്പിക്കാൻ ‘ആ ദിവസം’ സ്വാഭാവികമാണ്; അത് ശബ്ബത്തോ പെരുന്നാൾദിവസമോ ഉപവാസദിവസമോ എന്ന് നിർണയിക്കുന്നില്ല.
- source_word: κυρίῳ
  choice: കർത്താവിനുവേണ്ടി
  rationale: പ്രവൃത്തിയുടെ ദിശയും ഉദ്ദേശ്യവും വ്യക്തമാക്കുന്ന ദാതൃവിഭക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു. κύριος എന്ന പദത്തിന്റെ ‘കർത്താവ്’ എന്ന വ്യത്യസ്ത പരാമർശം നിലനിർത്തുന്നു.
- source_word: ἐσθίων / ἐσθίει
  choice: ഭക്ഷിക്കുന്നവൻ / ഭക്ഷിക്കുന്നു
  rationale: വിവാദത്തിലുള്ള ഭക്ഷണരീതിയെ പൊതുവായ പതിവായി അവതരിപ്പിക്കുന്ന വർത്തമാനകാല പ്രയോഗവും ആവർത്തനവും സംരക്ഷിക്കുന്നു.
- source_word: εὐχαριστεῖ
  choice: നന്ദി പറയുന്നു
  rationale: ദൈവത്തോടു നേരിട്ടുള്ള നന്ദിപ്രകടനം ആധുനിക മലയാളത്തിൽ വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τῷ θεῷ
  choice: ദൈവത്തിനു
  rationale: നന്ദി ആരോടാണ് അർപ്പിക്കുന്നതെന്ന് ഗ്രീക്ക് ദാതൃവിഭക്തിക്കനുസരിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: ὁ μὴ ἐσθίων
  choice: ഭക്ഷിക്കാത്തവൻ
  rationale: ‘ഭക്ഷിക്കുന്നവൻ’ എന്നതുമായുള്ള സമാന്തരഘടന സംക്ഷിപ്തവും വ്യക്തവുമായി നിലനിർത്തുന്നു; ‘വർജിക്കുന്നവൻ’ എന്നത് മൂലത്തിൽ ഇല്ലാത്ത ആചാരപരമായ ഭാവം ശക്തമാക്കാം.
theological_decisions:
- issue: ‘ആ ദിവസം’ ആചരിക്കുന്നതിന്റെ അർഥം
  choice: റോമർ 14-ൽ ചർച്ചയായ ഒരു ദിവസത്തിന് പ്രത്യേക പരിഗണന നൽകി ആചരിക്കുന്നതെന്ന പൊതുവായ പരാമർശം
  alternative: ശബ്ബത്ത്, യഹൂദപെരുന്നാൾ, അല്ലെങ്കിൽ ഉപവാസദിവസം എന്നിവയിൽ ഏതെങ്കിലുമൊന്നിനെ പ്രത്യേകമായി സൂചിപ്പിക്കുന്നു
  rationale: വാക്യം ദിവസത്തെ തിരിച്ചറിയിക്കുന്നില്ല. അതിനാൽ മതവിഭാഗപരമോ ചരിത്രപരമോ ആയ ഒരു നിർവചനം പാഠത്തിലേക്ക് ചേർക്കാതെ മൂലത്തിലെ വിശാലത നിലനിർത്തുന്നു.
- issue: κύριος എന്നതിന്റെ പരാമർശം
  choice: കർത്താവ്
  alternative: ദൈവം
  rationale: പൗലോസിന്റെ ഈ സന്ദർഭത്തിൽ κύριος സാധാരണയായി കർത്താവായ യേശുവിനെ സൂചിപ്പിക്കുമ്പോൾ നന്ദി θεός ആയ ദൈവത്തിനാണ്. രണ്ടും ഒരേ പദമാക്കി വ്യത്യാസം ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു വ്യക്തമായ, എന്നാൽ മാന്യമായ മലയാളം. ‘കർത്താവ്’, ‘ദൈവം’ എന്നീ പദങ്ങളുടെ മൂലഭാഷാപരമായ വ്യത്യാസം സംരക്ഷിച്ചു. ദിവസത്തിന്റെ സ്വഭാവം നിർണയിക്കാതെ വാചകത്തിന്റെ പൊതുത്വവും ഭക്ഷിക്കുന്നവനും ഭക്ഷിക്കാത്തവനും തമ്മിലുള്ള സമാന്തരതയും നിലനിർത്തി.
