  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: ml
  text: നിനക്കുള്ള വിശ്വാസം[a] ദൈവസന്നിധിയിൽ നിനക്കുതന്നെ സൂക്ഷിക്കുക. താൻ അംഗീകരിക്കുന്ന കാര്യത്തിൽ സ്വയം വിധിക്കാത്തവൻ[b] അനുഗൃഹീതനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിനക്കുള്ള ബോധ്യം.” ഇവിടെ “വിശ്വാസം” എന്നത് തർക്കവിഷയമായ കാര്യത്തെക്കുറിച്ചുള്ള വ്യക്തിപരമായ ബോധ്യത്തെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: “സ്വയം വിധിക്കാത്തവൻ” എന്നതിന് “സ്വയം കുറ്റംവിധിക്കാത്തവൻ” എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: വിശ്വാസം
  rationale: πίστις എന്ന പദത്തിന്റെ പതിവ് പരിഭാഷ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ തർക്കവിഷയമായ കാര്യത്തെക്കുറിച്ച് ദൈവസന്നിധിയിൽ ഒരാൾക്കുള്ള വ്യക്തിപരമായ ബോധ്യവും ഇതിൽ ഉൾപ്പെടുന്നു.
- source_word: κατὰ σεαυτὸν
  choice: നിനക്കുതന്നെ ഉള്ളതായി
  rationale: സ്വന്തം വിശ്വാസബോധ്യം മറ്റുള്ളവരിൽ അടിച്ചേൽപ്പിക്കാതെ വ്യക്തിപരമായി സൂക്ഷിക്കണമെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: ദൈവസന്നിധിയിൽ
  rationale: ദൈവത്തിന്റെ മുമ്പിലുള്ള ഉത്തരവാദിത്വവും ബോധപൂർവമായ നിലപാടും സംക്ഷിപ്തവും മാന്യവുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: μακάριος
  choice: അനുഗൃഹീതൻ
  rationale: വെറും മാനസിക സന്തോഷത്തേക്കാൾ നൈതികവും ദൈവശാസ്ത്രപരവുമായ ഭാരം നിലനിർത്തുന്നു.
- source_word: κρίνων ἑαυτὸν
  choice: തന്നെത്താൻ വിധിക്കാത്തവൻ
  rationale: κρίνω എന്നതിന്റെ അടിസ്ഥാനമായ ‘വിധിക്കുക’ എന്ന അർഥം നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ സ്വയം കുറ്റംവിധിക്കുന്ന അർഥസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐν ᾧ δοκιμάζει
  choice: താൻ അംഗീകരിക്കുന്ന കാര്യത്തിൽ
  rationale: പരിശോധിച്ചശേഷം അംഗീകരിക്കുക എന്ന δοκιμάζωയുടെ സൂക്ഷ്മതയും ἐν സൂചിപ്പിക്കുന്ന മേഖലയോ സാഹചര്യവുമാണ് ഈ പ്രയോഗം നൽകുന്നത്.
theological_decisions:
- issue: തർക്കവിഷയമായ ആചാരങ്ങളുടെ പശ്ചാത്തലത്തിൽ πίστις എന്നതിന്റെ അർഥം
  choice: ‘വിശ്വാസം’ എന്ന മുഖ്യപദം നിലനിർത്തി, ഇവിടെ വ്യക്തിപരമായ ബോധ്യം എന്ന സന്ദർഭാർഥം ഉൾക്കൊള്ളുക
  alternative: ‘ബോധ്യം’ എന്ന് നേരിട്ട് പരിഭാഷപ്പെടുത്തുക; അല്ലെങ്കിൽ ദൈവത്തിലുള്ള പൊതുവായ ആശ്രയം എന്നു വായിക്കുക
  rationale: അടുത്തുള്ള സന്ദർഭം മനസ്സാക്ഷിയെയും തർക്കവിഷയമായ ആചാരങ്ങളെയും കുറിച്ചാണ്. എങ്കിലും πίστις എന്ന പ്രധാന പദത്തിന്റെ വ്യാപ്തി ചുരുക്കാതെ അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നത് യഥാർഥമായ അസ്പഷ്ടത നിലനിർത്തുന്നു.
- issue: κρίνων ἑαυτόν എന്നതിലെ വിധിയുടെ തീവ്രത
  choice: മുഖ്യവാചകത്തിൽ ‘വിധിക്കുക’
  alternative: ‘കുറ്റംവിധിക്കുക’
  rationale: ഗ്രീക്ക് പദത്തിന്റെ വിശാല അർഥം മുഖ്യവാചകത്തിൽ നിലനിർത്തുന്നു; ഈ സന്ദർഭത്തിൽ ‘കുറ്റംവിധിക്കുക’ എന്ന ശക്തമായ അർഥം സാധ്യമാണെന്ന് അടിക്കുറിപ്പ് അറിയിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഏകവചന അഭിസംബോധനയും മൂന്നാംപുരുഷ നൈതിക പ്രസ്താവനയും ഗ്രീക്കിനനുസരിച്ച് നിലനിർത്തി. ‘ദൈവസന്നിധിയിൽ’ എന്ന സഭാപരിചിത പദം സാധാരണ വായനക്കാർക്കും വ്യക്തമാണ്.
