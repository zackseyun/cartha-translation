revisions:
- from: അതുകൊണ്ട്, നിങ്ങൾക്കുള്ള നന്മ ദുഷിക്കപ്പെടാൻ ഇടയാകരുത്.[a]
  to: അതുകൊണ്ട്, നിങ്ങളുടെ നന്മ ദൂഷിക്കപ്പെടാതിരിക്കട്ടെ.[a]
  rationale: The revision corrects the Malayalam lexical form to «ദൂഷിക്കപ്പെടുക» and uses a direct passive prohibition. It preserves the source text’s compactness, its logical connection (“അതുകൊണ്ട്”), and the intentionally unspecified sense of “your good.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:09:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the inferential οὖν, the prohibitive force of μὴ with the present passive imperative, and the deliberately broad referent of ὑμῶν τὸ ἀγαθόν. However, «ദുഷിക്കപ്പെടുക» is not the appropriate standard Malayalam verb here; «ദൂഷിക്കപ്പെടുക» conveys being maligned, reproached, or spoken of abusively and better represents βλασφημείσθω.
  naturalness: «നിങ്ങളുടെ നന്മ ദൂഷിക്കപ്പെടാതിരിക്കട്ടെ» is concise, idiomatic in a dignified modern Bible register, and directly reflects the Greek third-person passive imperative. It avoids adding an agent or narrowing «the good» to liberty or privilege.
  terminology: Use «ദൂഷിക്കപ്പെടുക» (not «ദുഷിക്കപ്പെടുക») for defamatory or reproachful speech. «നിങ്ങളുടെ നന്മ» appropriately preserves the possessive and the broad, substantival sense of τὸ ἀγαθόν.
  issues:
  - severity: medium
    issue: The main text uses «ദുഷിക്കപ്പെടാൻ».
    rationale: This form is lexically unsuitable/ambiguous in modern standard Malayalam for βλασφημέω, which in this context concerns malicious or defamatory speech. «ദൂഷിക്കപ്പെടുക» is the established and accurate term.
  - severity: low
    issue: The phrasing «ഇടയാകരുത്» is less direct than the Greek passive imperative.
    rationale: It is not a serious meaning error, but «ദൂഷിക്കപ്പെടാതിരിക്കട്ടെ» more closely and naturally renders “let it not be maligned.”
  revised_text: അതുകൊണ്ട്, നിങ്ങളുടെ നന്മ ദൂഷിക്കപ്പെടാതിരിക്കട്ടെ.[a]
  revised_footnotes:
  - marker: a
    text: അഥവാ, “നിന്ദിക്കപ്പെടാതിരിക്കട്ടെ” അല്ലെങ്കിൽ “അപകീർത്തിപ്പെടുത്തപ്പെടാതിരിക്കട്ടെ.” ഗ്രീക്ക് ക്രിയ നിന്ദാപരമായോ അപകീർത്തികരമായോ സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  revision_rationale: The revision corrects the Malayalam lexical form to «ദൂഷിക്കപ്പെടുക» and uses a direct passive prohibition. It preserves the source text’s compactness, its logical connection (“അതുകൊണ്ട്”), and the intentionally unspecified sense of “your good.”
