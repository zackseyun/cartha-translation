id: ROM.14.16
reference: Romans 14:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: ml
  text: അതുകൊണ്ട്, നിങ്ങളുടെ നന്മ ദൂഷിക്കപ്പെടാതിരിക്കട്ടെ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിന്ദിക്കപ്പെടാതിരിക്കട്ടെ” അല്ലെങ്കിൽ “അപകീർത്തിപ്പെടുത്തപ്പെടാതിരിക്കട്ടെ.” ഗ്രീക്ക് ക്രിയ നിന്ദാപരമായോ അപകീർത്തികരമായോ സംസാരിക്കുന്നതിനെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: ദുഷിക്കപ്പെടാൻ ഇടയാകരുത്
  rationale: μήയോടുകൂടിയ വർത്തമാനകാല കർമണി ആജ്ഞാരൂപം ഒരു വിലക്ക് പ്രകടിപ്പിക്കുന്നു. ‘ഇടയാകരുത്’ എന്ന പ്രയോഗം അതിന്റെ വിലക്കുസ്വഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; ‘ദുഷിക്കപ്പെടുക’ അപകീർത്തികരമായോ നിന്ദാപരമായോ സംസാരത്തെ സൂചിപ്പിക്കുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὑμῶν
  choice: നിങ്ങൾക്കുള്ള
  rationale: τὸ ἀγαθόν എന്നതുമായുള്ള ഉടമസ്ഥതയുടെയോ ബന്ധത്തിന്റെയോ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τὸ ἀγαθόν
  choice: നന്മ
  rationale: നപുംസകലിംഗ വിശേഷണം നാമരൂപത്തിൽ വന്നിരിക്കുന്നതിനാൽ ‘നന്മ’ എന്ന് സംക്ഷിപ്തമായി പരിഭാഷപ്പെടുത്തി. ഇത് സ്വാതന്ത്ര്യം, അവകാശം, അനുഗ്രഹം എന്നിങ്ങനെ ഏതെങ്കിലും ഒരു വ്യാഖ്യാനത്തിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: ‘നിങ്ങൾക്കുള്ള നന്മ’ (ὑμῶν τὸ ἀγαθόν) എന്നതിന്റെ സൂചിതവിഷയം
  choice: സൂചിതവിഷയം വ്യക്തമാക്കാതെ വിശാലമായി ‘നിങ്ങൾക്കുള്ള നന്മ’ എന്നു നിലനിർത്തി.
  alternative: നിങ്ങളുടെ സ്വാതന്ത്ര്യം; നിങ്ങളുടെ അവകാശം; നിങ്ങളുടെ നല്ല സാക്ഷ്യം
  rationale: ഗ്രീക്ക് പ്രയോഗം സംക്ഷിപ്തവും വിശാലവുമാണ്. തർക്കവിഷയങ്ങളുമായി ബന്ധപ്പെട്ട വിശ്വാസികളുടെ ബോധ്യം, സ്വാതന്ത്ര്യം, അനുഗ്രഹം എന്നിവ ഇതിൽ ഉൾപ്പെടാം; എന്നാൽ അവയിൽ ഒന്നിനെ മാത്രം തിരഞ്ഞെടുത്താൽ മൂലപാഠത്തിൽ വ്യക്തമല്ലാത്ത വ്യാഖ്യാനം ചേർക്കും.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. മൂലത്തിലെ സംക്ഷിപ്തതയും ‘നന്മ’ എന്ന പദത്തിന്റെ വിശാലമായ സൂചനയും നിലനിർത്തി.
