  rationale: മുഖ്യപാഠത്തിൽ ἐξουθενείτω-യുടെ ‘അവജ്ഞയോടെ, തുച്ഛമായി കാണുക’ എന്ന പ്രത്യേക അർഥം പ്രതിഫലിപ്പിക്കാൻ മാത്രം പരിഷ്കരിച്ചു. മറ്റെല്ലാ ഘടകങ്ങളും—ഭക്ഷിക്കൽ/ഭക്ഷിക്കാതിരിക്കൽ എന്ന പൊതുവായ പ്രയോഗം, വിധിക്കുന്നതിന്റെ നിരോധനം, ദൈവം സ്വീകരിച്ച ‘അവൻ’ എന്ന സർവനാമത്തിന്റെ വ്യാഖ്യാനാത്മകമായി തുറന്ന നില—നിലനിർത്തിയിരിക്കുന്നു.
