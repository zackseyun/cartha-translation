id: ROM.14.3
reference: Romans 14:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: ml
  text: ഭക്ഷിക്കുന്നവൻ ഭക്ഷിക്കാത്തവനെ അവജ്ഞയോടെ കാണരുത്[a]; ഭക്ഷിക്കാത്തവൻ ഭക്ഷിക്കുന്നവനെ വിധിക്കരുത്[b]. കാരണം, ദൈവം അവനെ സ്വീകരിച്ചിരിക്കുന്നു[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിസ്സാരനായി കരുതരുത്’ അല്ലെങ്കിൽ ‘തുച്ഛീകരിക്കരുത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘അവനെക്കുറിച്ച് വിധി കൽപ്പിക്കരുത്.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘സ്വാഗതം ചെയ്തിരിക്കുന്നു’ അല്ലെങ്കിൽ ‘കൈക്കൊണ്ടിരിക്കുന്നു.’ ഈ ക്രിയയ്ക്ക് ഒരാളെ കൂട്ടായ്മയിലേക്ക് സ്വീകരിക്കുക എന്ന അർഥവും ഉണ്ട്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων / τὸν μὴ ἐσθίοντα
  choice: ഭക്ഷിക്കുന്നവൻ / ഭക്ഷിക്കാത്തവൻ
  rationale: ഗ്രീക്കിലെ നാമവാചകമായി പ്രവർത്തിക്കുന്ന വർത്തമാനകാല കൃദന്തരൂപങ്ങളുടെ പരസ്പരവിരുദ്ധമായ ഘടന മലയാളത്തിൽ സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു. വാക്യം പറയുന്നതിലധികമായി പ്രത്യേക ഭക്ഷണരീതികളെയോ ചില ഭക്ഷണങ്ങളിൽനിന്നുള്ള വർജ്ജനത്തെയോ വ്യക്തമാക്കുന്നില്ല.
- source_word: ἐξουθενείτω
  choice: നിന്ദിക്കരുത്
  rationale: ഒരാളെ വിലകെട്ടവനായി കണ്ട് അവഹേളിക്കുക എന്ന ശക്തമായ ധാർമിക അർഥം ഈ പദം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: ഭക്ഷിക്കാത്തവൻ
  rationale: δέ സൂചിപ്പിക്കുന്ന വൈരുധ്യം സമാന്തരമായ രണ്ടു നിരോധനങ്ങളിലൂടെ വ്യക്തമാണ്; മലയാളത്തിൽ അധികമായ ഒരു ബന്ധപദം ചേർക്കാതെ ഘടന സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: κρινέτω
  choice: വിധിക്കരുത്
  rationale: സഹവിശ്വാസിയെക്കുറിച്ച് വിധി കൽപ്പിക്കുക എന്ന വിശാലമായ അർഥം നിലനിർത്തുന്നു; ‘കുറ്റം വിധിക്കരുത്’ എന്ന് പറഞ്ഞാൽ അർഥം അനാവശ്യമായി ശിക്ഷാവിധിയിലേക്കു ചുരുങ്ങും.
- source_word: γὰρ
  choice: കാരണം
  rationale: മുൻപുള്ള രണ്ടു നിരോധനങ്ങൾക്കും ദൈവത്തിന്റെ സ്വീകരണം അടിസ്ഥാനമാണെന്ന വിശദീകരണബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു.
- source_word: προσελάβετο
  choice: സ്വീകരിച്ചിരിക്കുന്നു
  rationale: ഒരാളെ അടുപ്പത്തിലേക്കോ കൂട്ടായ്മയിലേക്കോ കൈക്കൊള്ളുക എന്ന സന്ദർഭോചിതമായ ബന്ധപരമായ അർഥം നൽകുന്നു. മലയാളത്തിൽ ‘സ്വാഗതം ചെയ്തിരിക്കുന്നു’ എന്നതിനെക്കാൾ സ്വാഭാവികമാണ്.
theological_decisions:
- issue: ഭക്ഷിക്കുന്നതും ഭക്ഷിക്കാത്തതും തമ്മിലുള്ള വൈരുധ്യത്തിന്റെ പരിധി
  choice: വാക്യത്തിലുള്ളതുപോലെ ഭക്ഷിക്കൽ–ഭക്ഷിക്കാതിരിക്കൽ എന്ന പൊതുവായ രൂപത്തിൽ പരിഭാഷപ്പെടുത്തി.
  alternative: എല്ലാ ഭക്ഷണവും കഴിക്കൽ–ചില ഭക്ഷണങ്ങളിൽനിന്ന് ഒഴിഞ്ഞുനിൽക്കൽ എന്ന് വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: സമീപസന്ദർഭം ഭക്ഷണാചാരങ്ങളെക്കുറിച്ചാണെങ്കിലും, ഈ വാക്യം പ്രത്യേക ഭക്ഷണങ്ങളെയോ സസ്യാഹാരത്തെയോ നേരിട്ട് പറയുന്നില്ല. അതിനാൽ സന്ദർഭവിവരം മുഖ്യപാഠത്തിലേക്ക് ഇറക്കുമതി ചെയ്തിട്ടില്ല.
- issue: ‘ദൈവം അവനെ സ്വീകരിച്ചിരിക്കുന്നു’ എന്നതിലെ αὐτόν എന്ന സർവനാമത്തിന്റെ സൂചന
  choice: ‘അവനെ’ എന്ന ഏകവചന സർവനാമം നിലനിർത്തി; അത് ആരെയാണെന്നത് മുഖ്യപാഠത്തിൽ വിശദീകരിച്ചില്ല.
  alternative: ‘ആ വ്യക്തിയെ’ എന്നു പരിഭാഷപ്പെടുത്തുക, അല്ലെങ്കിൽ ഭക്ഷിക്കുന്നവനെ മാത്രമാണ് ഉദ്ദേശിക്കുന്നതെന്ന് വ്യക്തമാക്കുക.
  rationale: ഏറ്റവും അടുത്ത വ്യാകരണപരമായ മുൻപദം ഭക്ഷിക്കുന്നവനാണെങ്കിലും, പരസ്പരബന്ധമുള്ള വാദത്തിന്റെ വിശാലമായ പ്രയോഗം ദൈവം സ്വീകരിച്ച സഹവിശ്വാസിയിലേക്കാണ്. ഗ്രീക്കിലെ സൂചനാപരമായ തുറന്ന നില പരിഭാഷ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. സമാന്തര നിരോധനങ്ങളുടെ താളവും ഗ്രീക്കിലെ ഏകവചന വ്യക്തിസൂചനയും സംരക്ഷിച്ചിട്ടുണ്ട്.
