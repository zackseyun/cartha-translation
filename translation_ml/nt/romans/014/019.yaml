id: ROM.14.19
reference: Romans 14:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: ml
  text: അതുകൊണ്ട്[a], സമാധാനത്തിന് ഉതകുന്ന കാര്യങ്ങളും പരസ്പരം വളർത്തിയെടുക്കാൻ സഹായിക്കുന്ന കാര്യങ്ങളും നമുക്ക് പിന്തുടരാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അതിനാൽ, സമാധാനത്തിന്റെ കാര്യങ്ങളും പരസ്പരം പണിതുയർത്തുന്നതിനുള്ള കാര്യങ്ങളും നമുക്ക് പിന്തുടരാം.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം അവതരിപ്പിക്കുന്ന രണ്ട് അനുമാനസൂചക അവ്യയങ്ങളുടെ സംയുക്തബലം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τὰ τῆς εἰρήνης
  choice: സമാധാനത്തിന് ഉതകുന്നത്
  rationale: പദാനുപദമായി ‘സമാധാനത്തിന്റെ കാര്യങ്ങൾ’ എന്ന ഘടനയാണെങ്കിലും, സമാധാനത്തെ പ്രോത്സാഹിപ്പിക്കുന്ന കാര്യങ്ങളാണ് ഉദ്ദേശ്യം; മലയാളത്തിൽ ഈ ആശയം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διώκωμεν
  choice: നമുക്ക് പിന്തുടരാം
  rationale: വർത്തമാനകാല ഹോർട്ടേറ്ററി സബ്ജങ്ക്റ്റീവ് സമൂഹമായി തുടർച്ചയോടെ പ്രവർത്തിക്കാനുള്ള ആഹ്വാനമാണ്. ‘പിന്തുടരാം’ എന്നത് വെറും അന്വേഷിക്കുന്നതിനെക്കാൾ ക്രിയയുടെ ശക്തമായ ഭാവം നിലനിർത്തുന്നു.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: പണിതുയർത്തുന്നത്
  rationale: οἰκοδομή എന്ന പദത്തിന്റെ അടിസ്ഥാനമായ കെട്ടിടനിർമാണ രൂപകം നിലനിർത്തിക്കൊണ്ട്, വ്യക്തികളെയും സമൂഹത്തെയും വളർത്തി ബലപ്പെടുത്തുക എന്ന ആലങ്കാരിക അർഥം നൽകുന്നു.
- source_word: τῆς εἰς ἀλλήλους
  choice: പരസ്പരം
  rationale: വിശ്വാസസമൂഹത്തിനുള്ളിലെ അന്യോന്യമായ പണിതുയർത്തലാണ് പ്രയോഗം സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ‘പരസ്പരം’ ഈ പരസ്പരബന്ധം സംക്ഷിപ്തമായും വ്യക്തമായും അറിയിക്കുന്നു.
theological_decisions:
- issue: സാമൂഹിക പണിതുയർത്തലിന്റെ വ്യാപ്തി
  choice: സമാധാനത്തിനും പരസ്പര പണിതുയർത്തലിനും ഉതകുന്ന കാര്യങ്ങൾ സമൂഹമായി പിന്തുടരാനുള്ള ആഹ്വാനമായി വിവർത്തനം ചെയ്തു.
  alternative: വ്യക്തിയുടെ സ്വന്തം ധാർമിക പുരോഗതിയെ മാത്രം കേന്ദ്രീകരിക്കുന്ന വായന.
  rationale: ഒന്നാംപുരുഷ ബഹുവചനത്തിലുള്ള ആഹ്വാനവും ἀλλήλους എന്ന പരസ്പരസൂചക പദവും റോമർ 14-ലെ മനസ്സാക്ഷിവിഷയക ഭിന്നതകളുടെ പശ്ചാത്തലവും സമൂഹജീവിതത്തെയാണ് ഊന്നുന്നത്. പ്രത്യേക സഭാപാരമ്പര്യത്തിന്റെ വ്യാഖ്യാനം ചേർക്കാതെ ഈ ഊന്നൽ നിലനിർത്തി.
translation_notes:
  register: സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന ആധുനിക നിലവാരമലയാളം; പൗലോസിന്റെ സമൂഹത്തോടുള്ള ഗൗരവമുള്ള പ്രബോധനസ്വരം നിലനിർത്തുന്നു. ‘പണിതുയർത്തുക’ എന്ന രൂപകം ഗ്രീക്ക് പദത്തിന്റെ ദൃശ്യഭാവം കാത്തുസൂക്ഷിക്കുമ്പോഴും സന്ദർഭത്തിൽ വളർത്തി ബലപ്പെടുത്തുക എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
