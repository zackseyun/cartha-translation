id: ROM.14.1
reference: Romans 14:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: ml
  text: വിശ്വാസത്തിൽ ബലഹീനനായവനെ സ്വീകരിക്കുക[a]; അഭിപ്രായങ്ങളെച്ചൊല്ലിയുള്ള തർക്കങ്ങൾക്കായി അല്ല[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സ്വാഗതം ചെയ്യുക’ എന്നും വിവർത്തനം ചെയ്യാം. ഗ്രീക്ക് ക്രിയ ഒരാളെ സ്വന്തം കൂട്ടായ്മയിലേക്കു ചേർത്തു സ്വീകരിക്കുക എന്ന അർഥം നൽകാം.
    reason: lexical_alternative
  - marker: b
    text: ‘വിവാദവിഷയങ്ങളായ അഭിപ്രായങ്ങളെ വിധിക്കാനല്ല’ എന്നോ ‘ന്യായവാദങ്ങളെച്ചൊല്ലിയുള്ള കലഹങ്ങൾക്കായല്ല’ എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: ബലഹീനനായവനെ
  rationale: നിശ്ചയാർഥക പദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തരൂപം വ്യക്തിയെ സൂചിപ്പിക്കുന്നു. ‘ബലഹീനനായവൻ’ എന്നത് ബലഹീനതയുടെ സ്വഭാവം അനാവശ്യമായി ‘മനസ്സാക്ഷി’ എന്നു വിശദീകരിക്കാതെ മൂലത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: τῇ πίστει
  choice: വിശ്വാസത്തിൽ
  rationale: ദത്തിവ് ഇവിടെ ബലഹീനത ഏതു കാര്യത്തിൽ അഥവാ ഏതു മണ്ഡലത്തിലാണ് എന്നത് സൂചിപ്പിക്കുന്നു. സന്ദർഭം ഒരു വസ്തുനിഷ്ഠമായ സിദ്ധാന്തസമുച്ചയത്തെക്കാൾ വ്യക്തിയുടെ വിശ്വാസബോധത്തോടാണ് ബന്ധപ്പെട്ടിരിക്കുന്നത്.
- source_word: προσλαμβάνεσθε
  choice: സ്വീകരിക്കുക
  rationale: മധ്യമരൂപത്തിലുള്ള ബഹുവചന ആജ്ഞ മറ്റൊരാളെ തങ്ങളോടൊപ്പം കൂട്ടിക്കൊള്ളുകയും കൂട്ടായ്മയിൽ സ്വീകരിക്കുകയും ചെയ്യുന്നതിനെ സൂചിപ്പിക്കുന്നു. ആധുനിക മലയാളത്തിൽ ‘സ്വീകരിക്കുക’ സ്വാഭാവികവും ഗൗരവമുള്ളതുമാണ്.
- source_word: μὴ εἰς
  choice: വേണ്ടിയല്ല
  rationale: ഒരാളെ സ്വീകരിക്കുന്നതിന്റെ ഒഴിവാക്കേണ്ട ഉദ്ദേശ്യം ഈ ഘടന വ്യക്തമാക്കുന്നു. ‘വേണ്ടിയല്ല’ മലയാളത്തിൽ ആ ഉദ്ദേശ്യനിഷേധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: διακρίσεις
  choice: തർക്കിക്കുന്നതിന്
  rationale: ഈ സന്ദർഭത്തിൽ നാമം വെറും നിഷ്പക്ഷമായ വേർതിരിവുകളെക്കാൾ ഭിന്നാഭിപ്രായങ്ങളെ വിലയിരുത്തുന്നതിൽനിന്നുണ്ടാകുന്ന തർക്കങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: διαλογισμῶν
  choice: അഭിപ്രായങ്ങളെച്ചൊല്ലി
  rationale: അകത്തെ ചിന്തകൾ, ന്യായവാദങ്ങൾ, അഭിപ്രായങ്ങൾ എന്നിവയെ സൂചിപ്പിക്കാവുന്ന പദമാണിത്. വിവാദവിഷയങ്ങളായ അഭിപ്രായങ്ങൾ എന്ന സന്ദർഭാർഥം വായനാസൗകര്യത്തോടെ നൽകുന്നു; പാദക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നിലനിർത്തുന്നു.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: δέ ഇവിടെ പുതിയ പ്രബോധനത്തിലേക്കുള്ള നീക്കത്തോടൊപ്പം, സ്വീകരിക്കണമെന്ന കല്പനയും അതിന്റെ തെറ്റായ ഉദ്ദേശ്യവും തമ്മിലുള്ള മൃദുവായ വൈരുധ്യം അടയാളപ്പെടുത്തുന്നു. അർധവിരാമത്തിനു ശേഷമുള്ള ‘എന്നാൽ’ മലയാളത്തിൽ അത് സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ആശ്രയം; വിശ്വസ്തത
  rationale: ഇവിടെ വിവാദപരമായ ആചാരങ്ങളെക്കുറിച്ചുള്ള ഒരു വിശ്വാസിയുടെ ബോധ്യത്തിലെ ബലഹീനതയാണ് സന്ദർഭം. അതിനാൽ ‘വിശ്വാസം’ മൂലത്തിന്റെ ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിലനിർത്തുന്നു; ‘വിശ്വസ്തത’ ഈ സന്ദർഭത്തിൽ യോജിക്കുന്നില്ല.
- issue: διακρίσεις διαλογισμῶν എന്ന പ്രയോഗത്തിന്റെ ബന്ധം
  choice: അഭിപ്രായങ്ങളെച്ചൊല്ലി തർക്കിക്കുക
  alternative: ചിന്തകളെ വിധിക്കുക; ന്യായവാദങ്ങളെച്ചൊല്ലി കലഹിക്കുക
  rationale: ഗ്രീക്ക് പ്രയോഗം അഭിപ്രായങ്ങൾ തർക്കവിഷയമാകുന്നതോ അവയെ വിധിക്കുന്നതോ എന്ന രണ്ടു സമീപാർഥങ്ങൾക്ക് ഇടനൽകുന്നു. പ്രധാനപാഠം സ്വാഭാവികമായ സന്ദർഭാർഥം നൽകുന്നു; വ്യത്യസ്ത വ്യാഖ്യാനം പാദക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ മലയാളമാണ് ഉപയോഗിച്ചത്. പഴയ ശൈലിയിലുള്ള ‘സ്വീകരിപ്പിൻ’ ഒഴിവാക്കി, ഗൗരവമുള്ള ആജ്ഞാരൂപമായി ‘സ്വീകരിക്കുക’ തിരഞ്ഞെടുത്തു. മൂലത്തിലെ സംക്ഷിപ്തതയും രണ്ടാം പകുതിയിലെ അർഥസന്ദിഗ്ധതയും കഴിയുന്നത്ര നിലനിർത്തി.
