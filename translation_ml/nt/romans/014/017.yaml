id: ROM.14.17
reference: Romans 14:17
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: ml
  text: കാരണം, ദൈവരാജ്യം തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നതല്ല; മറിച്ച് പരിശുദ്ധാത്മാവിലുള്ള നീതിയും[a] സമാധാനവും സന്തോഷവുമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നീതിനിഷ്ഠ” അല്ലെങ്കിൽ “ന്യായം.” ഗ്രീക്ക് പദമായ δικαιοσύνη ശരിയായിരിപ്പ്, ധാർമ്മികനിഷ്ഠ, അല്ലെങ്കിൽ നീതിപൂർവമായ പ്രവർത്തനം എന്നിവയെ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία τοῦ θεοῦ
  choice: ദൈവരാജ്യം
  rationale: മലയാള ക്രൈസ്തവ പ്രയോഗത്തിൽ സ്വാഭാവികവും സ്ഥാപിതവുമായ പദമാണ്; ദൈവത്തിന്റെ രാജത്വം, ഭരണം, രാജ്യവാസ്തവം എന്നിവയുടെ അർത്ഥവ്യാപ്തി നിലനിർത്തുന്നു.
- source_word: βρῶσις καὶ πόσις
  choice: തിന്നുകയും കുടിക്കുകയും ചെയ്യുന്നത്
  rationale: രണ്ടു നാമങ്ങളും ഇവിടെ പ്രവർത്തനങ്ങളെ സൂചിപ്പിക്കുന്നതിനാൽ സമാന്തരമായ ക്രിയാരൂപത്തിൽ നൽകി; ഭക്ഷണപാനീയങ്ങളെ സംബന്ധിച്ച തർക്കങ്ങളുടെ പശ്ചാത്തലവും ഇതിലൂടെ വ്യക്തമാകുന്നു.
- source_word: δικαιοσύνη
  choice: നീതി
  rationale: ശരിത്വം, ധാർമ്മികനിഷ്ഠ, നീതിപൂർവമായ പെരുമാറ്റം എന്നീ അർത്ഥങ്ങൾ ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപദം. 'നീതീകരണം' എന്ന ആശയം അനാവശ്യമായി ചുരുക്കി ചുമത്തുന്നില്ല.
- source_word: εἰρήνη
  choice: സമാധാനം
  rationale: വ്യക്തിപരമായ ശാന്തിയെയും സമൂഹത്തിലെ ഐക്യത്തെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പതിവ് മലയാളപരിഭാഷ.
- source_word: χαρά
  choice: സന്തോഷം
  rationale: സാധാരണ വായനക്കാർക്ക് സ്വാഭാവികവും dignified ആയ പദം; ആത്മാവിൽ അനുഭവപ്പെടുന്ന ആനന്ദത്തെ വ്യക്തമാക്കുന്നു.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: പരിശുദ്ധാത്മാവിലുള്ള
  rationale: ἐν എന്നതിന്റെ മേഖല/ബന്ധം സൂചിപ്പിക്കുന്ന അർത്ഥം നിലനിർത്തുന്നു; പൗലോസിന്റെ പ്രയോഗത്തിൽ വ്യക്തിപരമായ പരിശുദ്ധാത്മാവിനെയാണ് സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നത്.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാദത്തെ വിശദീകരിക്കുന്ന ബന്ധം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: δικαιοσύνη എന്ന പദത്തിന്റെ അർത്ഥവ്യാപ്തി
  choice: നീതി
  alternative: നീതിനിഷ്ഠ / ശരിത്വം
  rationale: മലയാളത്തിലെ 'നീതി' ദൈവസന്നിധിയിലെ ശരിയായ നിലയും ധാർമ്മിക-സാമൂഹിക നീതിയും ഉൾക്കൊള്ളാൻ കഴിയുന്നു. ഒരു പ്രത്യേക സിദ്ധാന്തപരമായ വ്യാഖ്യാനം മാത്രം നിർബന്ധിക്കാതെ ഗ്രീക്ക് പദത്തിന്റെ യഥാർഥ വ്യാപ്തി കാക്കാൻ പര്യായസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിച്ചു.
- issue: ἐν πνεύματι ἁγίῳ എന്നതിലെ ἐν
  choice: പരിശുദ്ധാത്മാവിലുള്ള
  alternative: പരിശുദ്ധാത്മാവിനാൽ
  rationale: '''ഉള്ള'' എന്ന രൂപം മേഖലയും പ്രവർത്തകത്വവും തമ്മിലുള്ള ഗ്രീക്ക് അവ്യയത്തിന്റെ സാധ്യത തുറന്നുവെക്കുന്നു; ''ആത്മാവിനാൽ'' എന്നു മാത്രം നൽകി ഉപകരണാർഥമായി തീർച്ചപ്പെടുത്തുന്നില്ല.'
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന മാന്യമായ മലയാളം. ഗ്രീക്ക് വാക്യത്തിന്റെ നിഷേധ-വിരുദ്ധ ഘടനയും 'നീതി, സമാധാനം, സന്തോഷം' എന്ന ത്രിപദസമാന്തരതയും നിലനിർത്തി.
