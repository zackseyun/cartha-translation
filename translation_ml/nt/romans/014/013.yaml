id: ROM.14.13
reference: Romans 14:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: ml
  text: അതുകൊണ്ട് നാം ഇനി പരസ്പരം വിധിക്കരുത്. പകരം, ഒരു സഹോദരന്റെ[a] വഴിയിൽ ഇടർച്ചക്കല്ലോ പാപത്തിൽ വീഴാനുള്ള കാരണമോ[b] വെക്കാതിരിക്കാൻ തീരുമാനിക്കുക.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഒരു സഹോദരന്റെയോ സഹോദരിയുടെയോ”; ഗ്രീക്കിൽ ഏകവചനമായി “സഹോദരൻ” എന്നാണ്. ഇവിടെ ഉദ്ദേശിക്കുന്നത് ഒരു സഹവിശ്വാസിയെയാണ്.
    reason: alternative_reading
  - marker: b
    text: അഥവാ, “വീഴ്ചയ്ക്കുള്ള കാരണമോ” അല്ലെങ്കിൽ “കെണിയോ”; മറ്റൊരാളുടെ വികാരങ്ങളെ വെറുതെ വേദനിപ്പിക്കുന്നതല്ല, അയാളെ പാപത്തിലേക്കു വീഴ്ത്തുന്ന കാര്യമാണിവിടെ ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: അതുകൊണ്ട് ... ഇനി ... അരുത്
  rationale: οὖν മുൻവാദത്തിൽനിന്നുള്ള നിഗമനബന്ധം സൂചിപ്പിക്കുന്നു; Μηκέτι തുടരുന്ന പ്രവൃത്തി അവസാനിപ്പിക്കണമെന്ന അർഥം നൽകുന്നു.
- source_word: ἀλλήλους κρίνωμεν
  choice: നാം ... പരസ്പരം വിധിക്കരുത്
  rationale: ആഹ്വാനാർഥക ഉപവാക്യത്തെ സ്വാഭാവിക മലയാള നിർദേശമായി നൽകുകയും κρίνω എന്നതിന്റെ വിധിനിർണയഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: പകരം ... തീരുമാനിക്കുക
  rationale: κρίνω എന്ന ക്രിയയുടെ ആവർത്തനത്തിലുള്ള വാക്ചാതുര്യം മലയാളത്തിൽ പൂർണമായി പകർത്താനാകാത്തതിനാൽ, മറ്റുള്ളവരെ വിധിക്കുന്നതിനുപകരം സ്വന്തം പെരുമാറ്റത്തെക്കുറിച്ച് ഉറച്ച തീരുമാനം എടുക്കുക എന്ന വ്യത്യസ്ത പ്രയോഗം വ്യക്തമാക്കുന്നു.
- source_word: τὸ μὴ τιθέναι
  choice: വെക്കാതിരിക്കാൻ
  rationale: തീരുമാനത്തിന്റെ ഉള്ളടക്കമായി വരുന്ന articular infinitive-നെ മലയാളത്തിൽ ഉദ്ദേശ്യ/നിശ്ചയാർഥക രൂപത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: πρόσκομμα
  choice: ഇടർച്ചക്കല്ല്
  rationale: ഒരാളെ ആത്മീയമായോ ധാർമികമായോ ഇടറിക്കുന്ന വസ്തുവെന്ന ദൃശ്യരൂപകം സംരക്ഷിക്കുന്നു.
- source_word: τῷ ἀδελφῷ
  choice: ഒരു സഹോദരന്റെ വഴിയിൽ
  rationale: ഏകവചനമായ ἀδελφῷ പിന്തുടരുന്നു; τιθέναιയോടുള്ള ദത്തിവിന്റെ സന്ദർഭാർഥം മലയാളത്തിൽ 'വഴിയിൽ' എന്നു സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: σκάνδαλον
  choice: പാപത്തിൽ വീഴാനുള്ള കാരണം
  rationale: ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധരിപ്പിക്കാവുന്ന 'അപമാനം' പോലുള്ള പദം ഒഴിവാക്കി, മറ്റൊരാളെ പാപത്തിലേക്കു വീഴ്ത്തുന്ന കാരണമെന്ന സന്ദർഭാർഥം വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ἀδελφῷ എന്ന പുരുഷലിംഗ ഏകവചനത്തിന്റെ പ്രതിനിധിപരമായ പ്രയോഗം
  choice: സഹോദരൻ
  alternative: സഹോദരനോ സഹോദരിയോ; സഹവിശ്വാസി
  rationale: മൂലപാഠത്തിലെ ഏകവചന പുരുഷലിംഗരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; സന്ദർഭത്തിൽ അത് ഏതു സഹവിശ്വാസിയെയും ഉൾക്കൊള്ളാമെന്ന് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- issue: σκάνδαλον എന്നതിന്റെ ധാർമിക-ആത്മീയ ശക്തി
  choice: പാപത്തിൽ വീഴാനുള്ള കാരണം
  alternative: കെണി; വീഴ്ചയ്ക്കുള്ള കാരണം
  rationale: ഇത് വികാരങ്ങളെ വേദനിപ്പിക്കുന്നതിനെക്കാൾ, മറ്റൊരാളെ പാപത്തിലേക്കോ ആത്മീയ വീഴ്ചയിലേക്കോ നയിക്കുന്ന കാര്യമാണെന്ന് വ്യക്തമാക്കുന്നു; πρόσκομμαയോടുള്ള അർഥസാമീപ്യവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. 'വിധിക്കുക/തീരുമാനിക്കുക' എന്ന വ്യത്യാസത്തിലൂടെ ഗ്രീക്കിലെ κρίνω ആവർത്തനത്തിന്റെ ആശയപരമായ വാക്ചാതുര്യം കൈമാറുന്നു; 'ഇടർച്ചക്കല്ല്' എന്ന രൂപകം നിലനിർത്തിക്കൊണ്ട് σκάνδαλον വിശദമായി വിവർത്തനം ചെയ്യുന്നു.
