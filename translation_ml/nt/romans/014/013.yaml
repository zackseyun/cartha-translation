  terminology: “ഇടർച്ചക്കല്ല്” πρόσκομμα-യുടെ ഉറച്ച രൂപകം സംരക്ഷിക്കുന്നു. σκάνδαλον-നു “അപമാനം” പോലുള്ള ആധുനികമായി തെറ്റിദ്ധരിപ്പിക്കാവുന്ന പദം ഒഴിവാക്കി “പാപത്തിൽ വീഴാനുള്ള കാരണം” എന്നു നൽകിയിരിക്കുന്നത് സന്ദർഭാനുസൃതമാണ്. “സഹോദരൻ” മൂലപാഠത്തിലെ പുരുഷലിംഗ ഏകവചനം നിലനിർത്തുന്നു; ഉൾക്കൊള്ളുന്ന സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ യുക്തമായി വിശദീകരിക്കുന്നു.
