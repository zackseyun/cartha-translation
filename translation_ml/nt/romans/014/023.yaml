  verdict: revise
  source_fidelity: The draft accurately conveys the overall contrast between doubtful eating, condemnation, and action not arising from faith. However, it leaves the explicit conditional force of ἐὰν φάγῃ (“if he eats”) only implicit, and “അവൻ ചെയ്യുന്നത്” broadens the immediate referent from the act of eating to conduct generally. The revision restores both the condition and the direct referent without specifying the unstated agent of the passive κατακέκριται.
  naturalness: “സംശയിക്കുന്നവൻ ഭക്ഷിച്ചാൽ” is clear, idiomatic modern Malayalam. “കുറ്റംവിധിക്കപ്പെട്ടിരിക്കുന്നു” naturally communicates the Greek perfect passive as a present state resulting from judgment. The repeated “വിശ്വാസത്തിൽനിന്നുള്ളത്” preserves the deliberate Greek repetition while remaining readable.
  terminology: “വിശ്വാസം” appropriately retains πίστις, and “പാപമാണ്” directly represents ἁμαρτία ἐστίν. The footnote is retained as a contextual lexical clarification, but its anchor is moved to the relevant expression rather than to “condemned.”
  issues:
  - severity: medium
    issue: The conditional force of ἐὰν φάγῃ is not explicit.
    rationale: “സംശയത്തോടെ ഭക്ഷിക്കുന്നവൻ” can describe a person who habitually eats with doubt, whereas the Greek says that the doubting person is condemned if he eats. “സംശയിക്കുന്നവൻ ഭക്ഷിച്ചാൽ” preserves the conditional syntax.
  - severity: medium
    issue: “അവൻ ചെയ്യുന്നത്” is broader than the immediate referent.
    rationale: The clause ὅτι οὐκ ἐκ πίστεως refers in context to the doubtful act of eating. Using “അത്” after “ഭക്ഷിച്ചാൽ” preserves this reference without extending it to all that the person does.
  - severity: low
    issue: The footnote marker is attached to the condemnation clause although the note explains ἐκ πίστεως.
    rationale: Moving the anchor to “വിശ്വാസത്തിൽനിന്നുള്ളതല്ല” makes the note’s referent clear.
  revised_text: എന്നാൽ, സംശയിക്കുന്നവൻ ഭക്ഷിച്ചാൽ കുറ്റംവിധിക്കപ്പെട്ടിരിക്കുന്നു, കാരണം അത് വിശ്വാസത്തിൽനിന്നുള്ളതല്ല[a]; വിശ്വാസത്തിൽനിന്നുള്ളതല്ലാത്തതെല്ലാം പാപമാണ്.
