source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: ml
  text: എന്നാൽ, സംശയിക്കുന്നവൻ ഭക്ഷിച്ചാൽ കുറ്റംവിധിക്കപ്പെട്ടിരിക്കുന്നു, കാരണം അത് വിശ്വാസത്തിൽനിന്നുള്ളതല്ല[a]; വിശ്വാസത്തിൽനിന്നുള്ളതല്ലാത്തതെല്ലാം പാപമാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “അത് ഉറച്ച ബോധ്യത്തിൽനിന്ന് വരുന്നതല്ലാത്തതിനാൽ.” ഗ്രീക്കിൽ അക്ഷരാർഥം “വിശ്വാസത്തിൽനിന്ന്” എന്നാണ്; ദൈവസന്നിധിയിൽ ഉറച്ച ബോധ്യത്തോടെ പ്രവർത്തിക്കുക എന്ന ആശയവും ഇതിൽ ഉൾപ്പെടാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: സംശയത്തോടെ ... ചെയ്യുന്നവൻ
  rationale: ഭക്ഷണത്തെക്കുറിച്ചുള്ള ഈ സന്ദർഭത്തിൽ ഈ പദം മറ്റുള്ളവരോടുള്ള തർക്കത്തെയല്ല, ഉള്ളിലെ മടിയെയും സംശയത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമാകാൻ ക്രിയയോടു ചേർത്ത് വിവർത്തനം ചെയ്തു.
- source_word: ἐὰν φάγῃ
  choice: ഭക്ഷിക്കുന്നവൻ
  rationale: ἐάν സഹിതമുള്ള aorist subjunctive നിബന്ധനാപരമായ പ്രവൃത്തിയാണ്. മലയാളത്തിലെ ഈ ഘടന സന്ദർഭത്തിൽ ‘ഭക്ഷിച്ചാൽ’ എന്ന ആശയം സ്വാഭാവികമായി ഉൾക്കൊള്ളുന്നു.
- source_word: κατακέκριται
  choice: ശിക്ഷാവിധിക്കു വിധേയനാകുന്നു
  rationale: perfect passive സൂചിപ്പിക്കുന്ന വിധിക്കപ്പെട്ട അവസ്ഥ വ്യക്തമാക്കുന്നു; വിധിക്കുന്ന കർത്താവ് ദൈവമോ മനസ്സാക്ഷിയോ എന്നു ഗ്രീക്ക് വ്യക്തമാക്കാത്തതിനാൽ അതു ചേർത്തിട്ടില്ല.
- source_word: ὅτι
  choice: കാരണം
  rationale: ശിക്ഷാവിധിയുടെ കാരണം അവതരിപ്പിക്കുന്ന ബന്ധം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐκ πίστεως
  choice: വിശ്വാസത്തിൽനിന്ന്
  rationale: πίστις എന്ന പൗലോസിന്റെ പ്രധാന പദത്തെ ‘വിശ്വാസം’ എന്നു നിലനിർത്തുകയും ἐκ എന്നതിന്റെ ഉറവിട/അടിസ്ഥാന ഭാവം സംരക്ഷിക്കുകയും ചെയ്യുന്നു. ദൈവസന്നിധിയിലെ ഉറച്ച ബോധ്യം എന്ന സന്ദർഭനിറം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: πᾶν ... ὃ
  choice: '...അല്ലാത്തതെല്ലാം'
  rationale: ഗ്രീക്കിലെ സമഗ്രമായ വ്യാപ്തി സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: ἁμαρτία ἐστίν
  choice: പാപമാണ്
  rationale: വിശേഷണരൂപമായ ‘പാപകരമാണ്’ എന്നതിനു പകരം predicate noun-ന്റെ നേരിട്ടുള്ള ശക്തി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ധാർമികമായി പ്രാധാന്യമുള്ള ഈ പൗലോസീയ സന്ദർഭത്തിൽ πίστις എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: വിശ്വാസം
  alternative: ഉറച്ച ബോധ്യം; ആശ്രയം; വിശ്വസ്തത
  rationale: ഇവിടെ വ്യക്തിയുടെ ദൈവസന്നിധിയിലെ ഉറച്ച ബോധ്യം ഉൾപ്പെട്ടിട്ടുണ്ടെങ്കിലും ‘വിശ്വാസം’ പൗലോസിന്റെ വിപുലമായ പദപ്രയോഗം സംരക്ഷിക്കുന്നു; അർഥത്തെ വെറും വ്യക്തിപരമായ അഭിപ്രായമായി ചുരുക്കുന്നില്ല.
- issue: κατακέκριται എന്നതിലെ ശിക്ഷാവിധിയുടെ വ്യാപ്തിയും കർത്താവും
  choice: ശിക്ഷാവിധിക്കു വിധേയനാകുന്നു
  alternative: സ്വയം കുറ്റക്കാരനെന്നു വിധിക്കുന്നു; ദൈവസന്നിധിയിൽ ശിക്ഷാവിധിക്കു വിധേയനാകുന്നു
  rationale: ഗ്രീക്ക് passive വിധിക്കുന്ന കർത്താവിനെ വ്യക്തമാക്കുന്നില്ല. അതിനാൽ ദൈവവിധിയാണോ മനസ്സാക്ഷിയുടെ കുറ്റവിധിയാണോ രണ്ടും ആണോ എന്നു വിവർത്തനം തീരുമാനിച്ചിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ഗ്രീക്കിലെ ആവർത്തിക്കുന്ന ‘വിശ്വാസത്തിൽനിന്ന്’ എന്ന പ്രയോഗം നിലനിർത്തി; വിധിക്കുന്ന കർത്താവിനെ വ്യക്തമാക്കാതെ മൂലത്തിലെ ദൈവശാസ്ത്രപരമായ തുറന്ന നില സംരക്ഷിച്ചു.
