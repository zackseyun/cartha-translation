id: ROM.14.5
reference: Romans 14:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: ml
  text: ഒരാൾ ഒരു ദിവസത്തെ മറ്റൊരു ദിവസത്തേക്കാൾ പ്രാധാന്യമുള്ളതായി കണക്കാക്കുന്നു[a]; മറ്റൊരാൾ എല്ലാ ദിവസങ്ങളെയും ഒരുപോലെ കണക്കാക്കുന്നു[b]. ഓരോരുത്തനും സ്വന്തം മനസ്സിൽ പൂർണമായി ബോധ്യപ്പെട്ടിരിക്കട്ടെ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, ‘ഒരാൾ ഒരു ദിവസത്തെ മറ്റൊരു ദിവസത്തേക്കാൾ വിശേഷപ്പെട്ടതായി കരുതുന്നു.’
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥം ‘എല്ലാ ദിവസവും’; സന്ദർഭത്തിലെ അർഥം ‘എല്ലാ ദിവസങ്ങളെയും ഒരുപോലെ’ അഥവാ ‘എല്ലാ ദിവസങ്ങളും ഒരുപോലെ’ എന്നാണ്.
    reason: lexical_alternative
  - marker: c
    text: അല്ലെങ്കിൽ, ‘പൂർണ ഉറപ്പുള്ളവനായിരിക്കട്ടെ’ അഥവാ ‘പൂർണമായി വിശ്വസിച്ചുറച്ചിരിക്കട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: കണക്കാക്കുന്നു
  rationale: ഇവിടെ ക്രിയ കുറ്റം വിധിക്കുന്നതല്ല, ദിവസങ്ങളെ വിലയിരുത്തി അവയ്ക്കിടയിൽ വ്യത്യാസം കാണിക്കുന്നതാണ്. ‘കണക്കാക്കുന്നു’ എന്നത് ആ വിലയിരുത്തൽ സ്വാഭാവികമായ മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: ഒരു ദിവസത്തെ മറ്റൊരു ദിവസത്തേക്കാൾ പ്രാധാന്യമുള്ളതായി
  rationale: παρά ഉൾക്കൊള്ളുന്ന താരതമ്യഭാവം വ്യക്തമാക്കുന്നു; എന്നാൽ ശബ്ബത്ത്, പെരുന്നാൾ, ഉപവാസദിവസം എന്നിങ്ങനെ ഗ്രീക്കിൽ ഇല്ലാത്ത ഒരു പ്രത്യേക അർഥം ചേർക്കുന്നില്ല.
- source_word: πᾶσαν ἡμέραν
  choice: എല്ലാ ദിവസങ്ങളെയും ഒരുപോലെ
  rationale: അക്ഷരാർഥം ‘എല്ലാ ദിവസവും’ എന്നാണ്. ആദ്യ ഉപവാക്യത്തോടുള്ള വൈരുധ്യം ദിവസങ്ങൾക്കിടയിൽ വ്യത്യാസം കാണാത്തതാണെന്ന് സൂചിപ്പിക്കുന്നതിനാൽ ‘ഒരുപോലെ’ ചേർക്കുന്നത് സന്ദർഭോചിതമായ optimal-equivalence പരിഭാഷയാണ്.
- source_word: ἕκαστος
  choice: ഓരോരുത്തനും
  rationale: ഗ്രീക്കിലെ ഏകവചനപരവും വിതരണാത്മകവുമായ ഊന്നൽ നിലനിർത്തുന്ന, എല്ലാവരെയും ഉൾക്കൊള്ളുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: സ്വന്തം മനസ്സിൽ
  rationale: νοῦς എന്നതിലെ മനസ്സ്, ചിന്ത, വിവേചനം എന്നീ ആശയങ്ങളെ നേരായും സ്വാഭാവികമായും നൽകുന്നു.
- source_word: πληροφορείσθω
  choice: പൂർണമായി ബോധ്യപ്പെട്ടിരിക്കട്ടെ
  rationale: വർത്തമാനകാല നിഷ്ക്രിയ ആജ്ഞാരൂപം ഉറച്ചതും പൂർണവുമായ വ്യക്തിപരമായ ബോധ്യത്തെ സൂചിപ്പിക്കുന്നു. ഈ മലയാളരൂപം ഉറപ്പും നിലനിൽക്കുന്ന അവസ്ഥയും പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: ഇവിടെ പറയുന്ന ‘ദിവസങ്ങൾ’ ഏതൊക്കെയാണെന്ന് വ്യക്തമാക്കണമോ
  choice: ‘ദിവസം’ എന്ന പൊതുവായ പരാമർശം അതേപടി നിലനിർത്തി.
  alternative: ശബ്ബത്തുകൾ, യെഹൂദ പെരുന്നാൾദിവസങ്ങൾ, ഉപവാസദിവസങ്ങൾ, അല്ലെങ്കിൽ പ്രത്യേക ഭക്തിദിവസങ്ങൾ എന്നു വ്യക്തമാക്കുക.
  rationale: പൗലോസ് ഈ വാക്യത്തിൽ ദിവസങ്ങളുടെ സ്വഭാവം വ്യക്തമാക്കുന്നില്ല. അതിനാൽ പരിഭാഷ വ്യാഖ്യാനപരമായ ഒരു തീരുമാനം വായനക്കാരനുവേണ്ടി എടുത്തിട്ടില്ല.
- issue: ഏകവചന പുല്ലിംഗരൂപങ്ങളുടെ അവതരണം
  choice: ‘ഓരോരുത്തനും സ്വന്തം മനസ്സിൽ’ എന്ന ലിംഗനിരപേക്ഷവും ഏകവചനപരവുമായ സ്വാഭാവിക മലയാളഘടന ഉപയോഗിച്ചു.
  alternative: ‘അവൻ തന്റെ മനസ്സിൽ’ എന്ന പുല്ലിംഗ ഏകവചനരൂപം ഉപയോഗിക്കുക.
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനം പ്രതിനിധാനപരമായി എല്ലാവരെയും ഉൾക്കൊള്ളുന്നു. മലയാളത്തിലെ ‘ഓരോരുത്തനും സ്വന്തം’ എന്ന ഘടന ആ ഏകവചന-വിതരണാത്മക അർഥം നഷ്ടപ്പെടുത്താതെ സ്വാഭാവികമായി ഉൾക്കൊള്ളൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ദിവസങ്ങളെക്കുറിച്ചുള്ള അവ്യക്തത സംരക്ഷിച്ചു; മതവിഭാഗപരമായ പദങ്ങളോ പ്രത്യേക ആചാരങ്ങളുടെ പേരുകളോ ചേർത്തിട്ടില്ല. ആവർത്തിക്കുന്ന κρίνει എന്ന ക്രിയയ്ക്ക് രണ്ടിടത്തും ‘കണക്കാക്കുന്നു’ ഉപയോഗിച്ച് വാക്യത്തിന്റെ സമാന്തരഘടന നിലനിർത്തി.
