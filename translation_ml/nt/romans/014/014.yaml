id: ROM.14.14
reference: Romans 14:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: ml
  text: 'കർത്താവായ യേശുവിൽ ഞാൻ അറിയുകയും ഉറപ്പായി ബോധ്യപ്പെട്ടിരിക്കുകയും ചെയ്യുന്നു: ഒന്നും അതിൽത്തന്നെ അശുദ്ധമല്ല[a]; എന്നാൽ എന്തെങ്കിലും അശുദ്ധമാണെന്ന് കരുതുന്ന ഒരാൾക്ക് അത് അശുദ്ധമാണ്.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സാധാരണം.’ ഇവിടെ ഗ്രീക്ക് പദം സാധാരണയായി ആചാരപരമായി അശുദ്ധമോ അശുദ്ധമായി കണക്കാക്കപ്പെടുന്നതോ ആയ ഒന്നിനെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: ഞാൻ അറിയുന്നു
  rationale: സാധാരണ അറിവിനെ സൂചിപ്പിക്കുന്ന ക്രിയ; മലയാളത്തിൽ നേരിട്ടും സ്വാഭാവികവുമായ തുല്യപ്രയോഗം.
- source_word: πέπεισμαι
  choice: ഉറച്ച ബോധ്യമുള്ളവനായിരിക്കുന്നു
  rationale: പൂർണ്ണകാലരൂപം ഇപ്പോഴും നിലനിൽക്കുന്ന ദൃഢബോധ്യത്തെ സൂചിപ്പിക്കുന്നു; വെറും അഭിപ്രായമല്ലെന്ന ഭാവം നിലനിർത്തുന്നു.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: കർത്താവായ യേശുവിൽ
  rationale: ἐν എന്ന മുൻപ്രത്യയത്തിന്റെ ബന്ധം ‘മുഖാന്തരം’ എന്നാക്കി നിർണയിക്കാതെ, ഗ്രീക്കിലെ തുറന്ന ഭാവം സംരക്ഷിക്കുന്നു.
- source_word: κοινόν
  choice: അശുദ്ധം
  rationale: ഭക്ഷണവും ശുദ്ധി-അശുദ്ധി ധാരണയും സംബന്ധിച്ച സന്ദർഭത്തിൽ ‘സാധാരണ’ എന്നതിലുപരി ആചാരപരമായി അശുദ്ധമോ വിശുദ്ധോപയോഗത്തിന് യോജിക്കാത്തതോ എന്ന അർഥമാണ് പ്രസക്തം.
- source_word: δι’ ἑαυτοῦ
  choice: അതിൽത്തന്നെ
  rationale: ഒരു വസ്തുവിന് സ്വഭാവതഃ അശുദ്ധിയില്ലെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τῷ λογιζομένῳ
  choice: കരുതുന്ന ഒരാൾക്ക്
  rationale: ഒരു കാര്യത്തെ ഒരു പ്രത്യേക നിലയിൽ കണക്കാക്കുകയോ കാണുകയോ ചെയ്യുക എന്ന ബൗദ്ധിക വിലയിരുത്തൽ ലളിതമായി നൽകുന്നു.
- source_word: τι
  choice: എന്തെങ്കിലും
  rationale: പൊതുവായ അനിശ്ചിത വസ്തുവിനെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: ἐκείνῳ κοινόν
  choice: ആ ഒരാൾക്ക് അത് അശുദ്ധമാണ്
  rationale: വാക്യത്തിന്റെ വ്യക്തിഗത പ്രയോഗം നിലനിർത്തുന്നു; ഗ്രീക്കിൽ ഇല്ലാത്ത ലിംഗപരമായ പരിമിതി ഒഴിവാക്കുന്നു.
theological_decisions:
- issue: ഭക്ഷണ-ശുദ്ധി സന്ദർഭത്തിലെ κοινός എന്ന പദത്തിന്റെ അർഥം
  choice: പ്രധാനവാചകത്തിൽ ‘അശുദ്ധം’ എന്ന് പരിഭാഷപ്പെടുത്തി
  alternative: ‘സാധാരണം’ അല്ലെങ്കിൽ ‘പൊതുവായത്’
  rationale: വസ്തുവിന് സ്വഭാവതഃ അശുദ്ധിയുണ്ടെന്നല്ല, ഒരാളുടെ വിലയിരുത്തലിൽ അത് അശുദ്ധമാകുന്നു എന്ന പൗലോസിന്റെ സംഘർഷഭരിതമായ പ്രസ്താവന നിലനിർത്തുന്നു. പദത്തിന്റെ അക്ഷരാർഥസാദ്ധ്യത അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
- issue: ἐν κυρίῳ Ἰησοῦ എന്നതിലെ ബന്ധം
  choice: ‘കർത്താവായ യേശുവിൽ’ എന്ന് തുറന്ന നിലയിൽ സൂക്ഷിച്ചു
  alternative: ‘കർത്താവായ യേശുവാൽ’ അല്ലെങ്കിൽ ‘കർത്താവായ യേശുവിൽനിന്ന്’
  rationale: ഈ ബോധ്യത്തിന്റെ ഉറവിടമോ മാർഗമോ മാത്രം നിർണയിക്കാതെ, കർത്താവുമായുള്ള പൗലോസിന്റെ ബന്ധത്തിനുള്ളിൽ നിലനിൽക്കുന്ന അറിവും ബോധ്യവും എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വ്യാപ്തി സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഉറച്ച ബോധ്യം’ πέπεισμαι എന്നതിലെ നിലനിൽക്കുന്ന ദൃഢവിശ്വാസം നൽകുന്നു; ‘അതിൽത്തന്നെ’ സ്വഭാവതഃ എന്ന ആശയം അനാവശ്യ സാങ്കേതികതയില്ലാതെ വ്യക്തമാക്കുന്നു.
