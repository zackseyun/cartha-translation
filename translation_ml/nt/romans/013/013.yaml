id: ROM.13.13
reference: Romans 13:13
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: ml
  text: പകലിലെന്നപോലെ നമുക്ക് മാന്യമായി നടക്കാം[a]—ഉന്മത്തമായ ആഘോഷങ്ങളിലും മദ്യലഹരിയിലും അല്ല; അവിഹിത ലൈംഗികബന്ധങ്ങളിലും ലജ്ജയില്ലാത്ത അഴിഞ്ഞാട്ടങ്ങളിലും അല്ല; കലഹത്തിലും അസൂയയിലും[b] അല്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “മര്യാദയോടെ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ഈർഷ്യയിൽ”; ഗ്രീക്ക് പദത്തിന് അസൂയയെയോ ഈർഷ്യയെയോ സൂചിപ്പിക്കാം, എന്നാൽ ഈ ദോഷപ്പട്ടികയിൽ അർഥം പ്രതികൂലമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: പകലിലെന്നപോലെ
  rationale: ചുറ്റുപാടിലുള്ള പകൽ–രാത്രി രൂപകം വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കാതെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὐσχημόνως
  choice: മാന്യമായി
  rationale: മറ്റുള്ളവരുടെ മുമ്പിൽ ഉചിതവും ആദരണീയവുമായ പെരുമാറ്റം എന്ന ആശയം ആധുനികവും dignified ആയ മലയാളത്തിൽ നൽകുന്നു.
- source_word: περιπατήσωμεν
  choice: നമുക്ക് ... നടക്കാം
  rationale: പൗലോസിന്റെ ജീവിതനടപ്പിനെ സൂചിപ്പിക്കുന്ന ‘നടക്കുക’ എന്ന രൂപകം നിലനിർത്തുകയും പ്രഥമപുരുഷ ബഹുവചന പ്രബോധനത്തിന്റെ ഭാവം പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: κώμοις
  choice: ഉന്മത്തമായ ആഘോഷങ്ങൾ
  rationale: മദ്യപാനത്തോടു ചേർന്ന നിയന്ത്രണമില്ലാത്ത വിരുന്നും ആഘോഷത്തിമിർപ്പും സൂചിപ്പിക്കുന്നു; ആധുനിക ഉപയോഗത്തിൽ ലൈംഗിക അർഥത്തിലേക്ക് അനാവശ്യമായി ചുരുങ്ങാവുന്ന പദം ഒഴിവാക്കുന്നു.
- source_word: μέθαις
  choice: മദ്യലഹരി
  rationale: മത്താവസ്ഥയെയോ ആവർത്തിച്ചുള്ള മദ്യോന്മാദത്തെയോ വ്യക്തമായി സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപ്രയോഗം.
- source_word: κοίταις
  choice: അവിഹിത ലൈംഗികബന്ധങ്ങൾ
  rationale: അക്ഷരാർഥമായ ‘കിടക്കകൾ’ മലയാളത്തിൽ ഉദ്ദേശ്യം മറച്ചുകളയും; ഇവിടെ കിടക്കയെ ലൈംഗിക ദുർന്നടപ്പിനുള്ള പരോക്ഷസൂചനയായി ഉപയോഗിച്ചിരിക്കുന്നതിനാൽ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἀσελγείαις
  choice: ലജ്ജയില്ലാത്ത അഴിഞ്ഞാട്ടങ്ങൾ
  rationale: നിയന്ത്രണമില്ലാത്തതും ധാർഷ്ട്യപൂർവവുമായ ദുർന്നടപ്പെന്ന വിശാലത നിലനിർത്തുന്നു; ലൈംഗികസന്ദർഭസാധ്യത ഉണ്ടെങ്കിലും പദത്തെ അതിലേക്കു മാത്രം ചുരുക്കുന്നില്ല.
- source_word: ἔριδι
  choice: കലഹം
  rationale: തർക്കം, ഭിന്നത, മത്സരപരമായ സംഘർഷം എന്നിവ ഉൾക്കൊള്ളുന്ന സംക്ഷിപ്തവും സ്വാഭാവികവുമായ പദം.
- source_word: ζήλῳ
  choice: അസൂയ
  rationale: ദോഷങ്ങളുടെ പട്ടികയിൽ പദത്തിന്റെ പ്രതികൂല അർഥം ആവശ്യമാണ്; ‘അസൂയ’ അതു വ്യക്തമായി നൽകുന്നു, അടുത്ത അർഥമുള്ള ‘ഈർഷ്യ’ അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
theological_decisions:
- issue: ധാർമിക പ്രബോധനത്തിലെ പകൽ–രാത്രി രൂപകം
  choice: ‘പകലിലെന്നപോലെ’ എന്ന് രൂപകം നേരിട്ട് നിലനിർത്തി.
  alternative: ‘പകൽ ആയിരിക്കുന്നതുപോലെ’ അഥവാ രൂപകത്തെ വിശദീകരിച്ചുള്ള ഒരു ധാർമിക പ്രസ്താവന.
  rationale: വാക്യം പകൽ–രാത്രി വൈരുധ്യത്തിൽ പങ്കുചേരുന്നു; എന്നാൽ പരിഭാഷ വാക്യത്തിൽ തുറന്നുപറയാത്ത ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കരുത്.
- issue: κοίταις എന്ന പദത്തിലെ ലൈംഗിക പരോക്ഷപ്രയോഗം
  choice: ‘അവിഹിത ലൈംഗികബന്ധങ്ങൾ’ എന്ന് അർഥാനുസൃതമായി പരിഭാഷപ്പെടുത്തി.
  alternative: അക്ഷരാർഥത്തിൽ ‘കിടക്കകൾ’.
  rationale: അക്ഷരാർഥം മലയാളത്തിൽ അവ്യക്തമായിരിക്കും; ഗ്രീക്കിലെ വ്യക്തമായ ലൈംഗിക ധാർമികസൂചന അർഥാനുസൃത പരിഭാഷയിലൂടെ സംരക്ഷിക്കുന്നു.
- issue: ἀσελγείαις എന്ന പദത്തിന്റെ വ്യാപ്തി
  choice: ‘ലജ്ജയില്ലാത്ത അഴിഞ്ഞാട്ടങ്ങൾ’ എന്ന് വിശാലമായി പരിഭാഷപ്പെടുത്തി.
  alternative: ‘കാമാസക്തി’ എന്ന് പൂർണമായി ലൈംഗിക അർഥത്തിലേക്ക് ചുരുക്കുക.
  rationale: സന്ദർഭത്തിൽ ലൈംഗിക നിഴൽ ശക്തമാണെങ്കിലും പദത്തിന് ധാർഷ്ട്യപൂർവവും നിയന്ത്രണമില്ലാത്തതുമായ പെരുമാറ്റം എന്ന വിശാല അർഥവുമുണ്ട്; ആ യഥാർഥ വ്യാപ്തി നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നടക്കാം’ എന്ന പൗലോസ്യ രൂപകം നിലനിർത്തിയപ്പോൾ ദോഷപ്പട്ടിക വായിക്കാൻ എളുപ്പമാക്കാൻ സമാന്തര ഘടനയും അർധവിരാമങ്ങളും ഉപയോഗിച്ചു.
