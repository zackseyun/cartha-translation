id: ROM.13.3
reference: Romans 13:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: ml
  text: ഭരണാധികാരികൾ നല്ല പ്രവൃത്തിക്ക് ഭയകാരണമല്ല, ദുഷ്‌പ്രവൃത്തിക്കാണ്.[a] അധികാരത്തെ ഭയപ്പെടാതിരിക്കാൻ നീ ആഗ്രഹിക്കുന്നുവോ?[b] നന്മ ചെയ്യുക; അതിൽനിന്ന് നിനക്കു പ്രശംസ ലഭിക്കും.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നല്ല പെരുമാറ്റത്തിന് … ദുഷ്‌പെരുമാറ്റത്തിനാണ്.” ഗ്രീക്ക് വാചകം നല്ലതും ദുഷിച്ചതുമായ കാര്യങ്ങളെ പൊതുവായ നൈതിക അർഥത്തിൽ പരസ്പരം വിരുദ്ധമായി നിർത്തുന്നു.
    reason: lexical_alternative
  - marker: b
    text: 'ഇത് ആലങ്കാരിക ചോദ്യമായും വായിക്കാം; അർഥം: അധികാരത്തെ ഭയപ്പെടേണ്ടിവരാതിരിക്കാനാണോ നീ ആഗ്രഹിക്കുന്നത്?'
    reason: lexical_alternative
  - marker: c
    text: “അതിൽനിന്ന്” എന്നത് ഭരണാധികാരത്തെ സൂചിപ്പിക്കുന്നു.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: ഭരണാധികാരികൾ
  rationale: ഭരണചുമതലയോ ഭരണപദവിയോ വഹിക്കുന്നവരെ സൂചിപ്പിക്കുന്നു; രാഷ്ട്രീയസന്ദർഭം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: φόβος
  choice: ഭയകാരണം
  rationale: പ്രയോഗത്തിലെ വിധേയനാമത്തിന്റെ ആശയം, അതായത് ഭയപ്പെടേണ്ട കാരണമോ വസ്തുവോ എന്ന അർഥം, സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: നല്ല പ്രവൃത്തിക്ക് … ദുഷ്‌പ്രവൃത്തിക്കാണ്
  rationale: നല്ലതും ദുഷിച്ചതുമായ പെരുമാറ്റത്തെക്കുറിച്ചുള്ള പൊതുവായ നൈതിക വൈരുധ്യം നിലനിർത്തുന്നു; ഏകവചനരൂപവും കഴിയുന്നത്ര സംരക്ഷിക്കുന്നു.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: ഭയപ്പെടാതിരിക്കാൻ നീ ആഗ്രഹിക്കുന്നുവോ?
  rationale: θέλεις സഹിതമുള്ള നിഷേധ infinitive-ന്റെ വാചകഘടനയും വാക്യത്തിന്റെ ആലങ്കാരിക ചോദ്യസ്വഭാവവും കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἐξουσίαν
  choice: അധികാരത്തെ
  rationale: നിശ്ചിതമായ ഏകവചന ഭരണാധികാരസ്ഥാപനത്തെ സൂചിപ്പിക്കുന്നു; ചുറ്റുപാടിലെ റോമർ 13-ലെ പ്രയോഗവുമായി ബന്ധം നിലനിർത്തുന്നു.
- source_word: τὸ ἀγαθὸν ποίει
  choice: നന്മ ചെയ്യുക
  rationale: നാമവൽക്കരിച്ച വിശേഷണത്തിന്റെ പൊതുവായ നൈതിക അർഥം സ്വാഭാവികവും സംക്ഷിപ്തവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἕξεις ἔπαινον
  choice: നിനക്കു പ്രശംസ ലഭിക്കും
  rationale: അക്ഷരാർഥമായ ‘പ്രശംസ ഉണ്ടായിരിക്കും’ എന്നതിനെക്കാൾ സ്വാഭാവിക മലയാളം; ഭാവികാലവും പ്രശംസ എന്ന ആശയവും കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: ἐξ αὐτῆς
  choice: അതിൽനിന്ന്
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമം മുമ്പുള്ള ἐξουσία-യെ സൂചിപ്പിക്കുന്നു; സ്ഥാപനത്തെ അനാവശ്യമായി വ്യക്തിവൽക്കരിക്കാതെ ബന്ധം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: ഭരണാധികാരികളെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ഭരണാധികാരത്തിന്റെ സാധാരണയോ ഉദ്ദേശിക്കപ്പെട്ടതോ ആയ പ്രവർത്തനത്തെക്കുറിച്ചുള്ള നേരിട്ടുള്ള പ്രസ്താവനയായി വിവർത്തനം ചെയ്തു.
  alternative: എല്ലാ ഭരണാധികാരികളും എല്ലായ്പോഴും നന്മയെ പ്രശംസിക്കുകയും തിന്മയെ ശിക്ഷിക്കുകയും ചെയ്യുന്നു എന്ന നിരുപാധിക സാർവത്രിക അവകാശവാദമായോ, പരിഹാസമായോ വായിക്കുക.
  rationale: മൂലവാചകത്തിലുള്ള സംഘർഷം നിലനിർത്തുന്നു; എല്ലാ ഭരണാധികാരികളുടെ പ്രവൃത്തികൾക്കും ദൈവശാസ്ത്രപരമായ സമ്പൂർണ അംഗീകാരം ചേർക്കുകയോ, വാചകസൂചനകളില്ലാത്ത പരിഹാസം ഇറക്കുമതി ചെയ്യുകയോ ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘ഭരണാധികാരികൾ’ രാഷ്ട്രീയസന്ദർഭം വ്യക്തമാക്കുന്നു; ‘അധികാരം’ മൂലത്തിലെ ഏകവചന സ്ഥാപനപരമായ പരാമർശം നിലനിർത്തുന്നു. ആലങ്കാരിക ചോദ്യം ഗ്രീക്ക് ഘടനപ്രകാരം സംരക്ഷിച്ചു.
