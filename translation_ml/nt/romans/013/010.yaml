  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: ml
  text: സ്നേഹം അയൽക്കാരന് ഒരു ദോഷവും ചെയ്യുന്നില്ല[a]; അതുകൊണ്ട് സ്നേഹമാണ് നിയമത്തിന്റെ പൂർത്തീകരണം[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “സ്നേഹം അയൽക്കാരനോടു തിന്മ പ്രവർത്തിക്കുന്നില്ല.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “സ്നേഹമാണ് നിയമത്തിന്റെ പൂർണത.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും വ്യാപകവുമായ തത്തുല്യം; വാക്യത്തിലെ രണ്ടു പ്രയോഗങ്ങൾക്കും ഒരേ പദം നൽകി ആവർത്തനത്തിന്റെ ഊന്നൽ നിലനിർത്തുന്നു.
- source_word: τῷ πλησίον
  choice: അയൽക്കാരന്
  rationale: ദത്തിവ് സൂചിപ്പിക്കുന്ന ബാധിത വ്യക്തിയെ സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ഇവിടെ പദം പൊതുവായ അർഥത്തിലാണ്.
- source_word: κακὸν
  choice: ഒരു ദോഷവും
  rationale: മറ്റൊരാൾക്കു വരുത്തുന്ന തിന്മയെയോ ഹാനിയെയോ സന്ദർഭോചിതമായി ഉൾക്കൊള്ളുന്നു; നിഷേധവാക്യത്തിൽ ‘ഒരു ദോഷവും’ സ്വാഭാവികമാണ്.
- source_word: οὐκ ἐργάζεται
  choice: ചെയ്യുന്നില്ല
  rationale: ἐργάζομαι എന്നതിന്റെ ‘ചെയ്യുക/പ്രവർത്തിക്കുക/ഉളവാക്കുക’ എന്ന ആശയം κακόν-നോടൊപ്പം ലളിതവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: πλήρωμα
  choice: പൂർത്തീകരണം
  rationale: നിയമത്തെ അതിന്റെ ഉദ്ദേശ്യപൂർണതയിലെത്തിക്കുന്നതു എന്ന ആശയം വ്യക്തമാക്കുന്നു; ഗ്രീക്കിലെ നാമവാക്യഘടനയും നിലനിർത്തുന്നു.
- source_word: οὖν
  choice: അതുകൊണ്ട്
  rationale: മുൻപ്രസ്താവനയിൽനിന്നുള്ള നിഗമനം ആധുനിക മലയാളത്തിൽ വ്യക്തമായി സൂചിപ്പിക്കുന്നു.
- source_word: νόμου
  choice: നിയമത്തിന്റെ
  rationale: സന്ദർഭത്തിൽ തിരിച്ചറിയപ്പെടുന്ന ദൈവനിയമത്തെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സ്വാഭാവികമായ ഷഷ്ഠീവിഭക്തി പ്രയോഗിക്കുന്നു.
theological_decisions:
- issue: സ്നേഹവും നിയമവും തമ്മിലുള്ള ബന്ധം
  choice: സ്നേഹമാണ് നിയമത്തിന്റെ പൂർത്തീകരണം
  alternative: സ്നേഹം നിയമത്തിന്റെ പൂർണതയാണ്; സ്നേഹം നിയമം നിറവേറ്റുന്നു
  rationale: ഗ്രീക്ക് പാഠം ക്രിയാപ്രധാനമായ ‘നിറവേറ്റുന്നു’ എന്ന രൂപമല്ല, നാമവാക്യമാണ്. അതിനാൽ നിയമത്തോടുള്ള സ്നേഹത്തിന്റെ ബന്ധം അധികമായി വ്യാഖ്യാനിക്കാതെ മൂലഘടനയും ദൈവശാസ്ത്രപരമായ ഊന്നലും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അയൽക്കാരൻ’, ‘നിയമം’, ‘സ്നേഹം’ എന്നീ പരിചിത ബൈബിൾപദങ്ങൾ നിലനിർത്തിയപ്പോൾ, അത്യന്തം സാങ്കേതികമായ ഭാഷ ഒഴിവാക്കി.
