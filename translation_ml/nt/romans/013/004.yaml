revisions:
- from: അത് നിന്റെ നന്മയ്ക്കായി പ്രവർത്തിക്കുന്ന ദൈവത്തിന്റെ സേവകനാണ്. എന്നാൽ നീ തിന്മ ചെയ്താൽ ഭയപ്പെടുക; അത് വാൾ വഹിക്കുന്നത് വെറുതെയല്ല. തിന്മ പ്രവർത്തിക്കുന്നവന്റെമേൽ ക്രോധം നടപ്പാക്കുന്ന പ്രതികാരകനായി അത് ദൈവത്തിന്റെ സേവകനാണ്.[a]
  to: അത് നിന്റെ നന്മയ്ക്കായി ദൈവത്തിന്റെ സേവകനാണ്. എന്നാൽ നീ തിന്മ ചെയ്താൽ ഭയപ്പെടുക; അത് വാൾ വെറുതെ വഹിക്കുന്നതല്ല. അത് ദൈവത്തിന്റെ സേവകനാണ്, തിന്മ ചെയ്യുന്നവന്റെമേൽ ക്രോധം[a] വരുത്താൻ പ്രതികാരം നടപ്പാക്കുന്നവൻ.
  rationale: The revision follows the Greek clause structure more directly and improves Malayalam idiom. It preserves the repeated designation of the authority as God’s servant, retains the sword metaphor, and renders ἔκδικος εἰς ὀργὴν as a punitive agent acting to bring wrath, without inserting “God’s wrath” into the main text. The footnote is anchored to “ക്രോധം” and records both the compact alternative and the unresolved possessive reference.
