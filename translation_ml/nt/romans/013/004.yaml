id: ROM.13.4
reference: Romans 13:4
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: ml
  text: അത് നിന്റെ നന്മയ്ക്കായി ദൈവത്തിന്റെ സേവകനാണ്. എന്നാൽ നീ തിന്മ ചെയ്താൽ ഭയപ്പെടുക; അത് വാൾ വെറുതെ വഹിക്കുന്നതല്ല. അത് ദൈവത്തിന്റെ സേവകനാണ്, തിന്മ ചെയ്യുന്നവന്റെമേൽ ക്രോധം[a] വരുത്താൻ പ്രതികാരം നടപ്പാക്കുന്നവൻ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘തിന്മ ചെയ്യുന്നവന്റെമേൽ ക്രോധത്തിനായി പ്രതികാരം നടപ്പാക്കുന്നവൻ.’ ഗ്രീക്കിൽ ഈ ‘ക്രോധം’ ദൈവത്തിന്റേതാണെന്ന് നേരിട്ട് പറഞ്ഞിട്ടില്ല.'
    reason: source_ambiguity
lexical_decisions:
- source_word: διάκονός
  choice: സേവകൻ
  rationale: ദൈവത്തിന്റെ നിയോഗം നിർവഹിക്കുന്ന അധികാരിയെയാണ് ഇവിടെ സൂചിപ്പിക്കുന്നത്. ‘സേവകൻ’ എന്നത് സഭാപദവിയിലേക്കു ചുരുക്കാതെ ഈ ഏജൻസി-അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: നിന്റെ നന്മയ്ക്കായി പ്രവർത്തിക്കുന്ന
  rationale: ദാതിവും ഉദ്ദേശ്യസൂചക പ്രയോഗവും ചേർന്ന് അധികാരിയുടെ പ്രവർത്തനം അഭിസംബോധന ചെയ്യപ്പെടുന്ന വ്യക്തിയുടെ നന്മയ്ക്കാണെന്ന ആശയം നൽകുന്നു.
- source_word: τὸ κακὸν ποιῇς
  choice: നീ തിന്മ ചെയ്താൽ
  rationale: κακόν എന്നതിന്റെ ധാർമ്മിക അർഥം ലളിതവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: φοβοῦ
  choice: ഭയപ്പെടുക
  rationale: ശിക്ഷ നടപ്പാക്കാനുള്ള അധികാരിയുടെ പങ്കിനെക്കുറിച്ചുള്ള നേരിട്ടുള്ള ആജ്ഞയായി ഗ്രീക്ക് രൂപം പുനരാവിഷ്കരിക്കുന്നു.
- source_word: οὐ γὰρ εἰκῇ
  choice: വെറുതെയല്ല
  rationale: εἰκῇ ഇവിടെ ‘ഉദ്ദേശ്യമില്ലാതെ’ അഥവാ ‘ഫലമില്ലാതെ’ എന്ന അർഥം നൽകുന്നു; ‘വെറുതെയല്ല’ ആ ആശയം സാധാരണ മലയാളത്തിൽ വ്യക്തമായി പറയുന്നു.
- source_word: τὴν μάχαιραν φορεῖ
  choice: വാൾ വഹിക്കുന്നത്
  rationale: വാൾ എന്ന മൂർത്തമായ പ്രതീകവും പതിവായി കൈവശം വഹിക്കുന്നതിനെ സൂചിപ്പിക്കുന്ന φορέωയുടെ ഭാവവും സംരക്ഷിക്കുന്നു.
- source_word: ἔκδικος
  choice: പ്രതികാരകൻ
  rationale: നീതിപൂർവമായ പ്രതികാരം അഥവാ ശിക്ഷ നടപ്പാക്കുന്ന ഏജന്റിനെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ പ്രതികാരാത്മക ശക്തി നിലനിർത്തുന്നു.
- source_word: εἰς ὀργὴν
  choice: ക്രോധം നടപ്പാക്കുന്ന
  rationale: ‘ശിക്ഷ’ എന്നു മാത്രം പരിഭാഷപ്പെടുത്തി ὀργήയുടെ ക്രോധഭാവം ഇല്ലാതാക്കാതെ, മലയാളത്തിൽ ക്രിയാത്മകമായി ഗ്രഹിക്കാവുന്ന രൂപം നൽകുന്നു.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: തിന്മ പ്രവർത്തിക്കുന്നവന്റെമേൽ
  rationale: തിന്മ ചെയ്യുന്ന പ്രവൃത്തിയാൽ വിശേഷിപ്പിക്കപ്പെടുന്ന വ്യക്തിയെയും അവന്റെമേൽ വരുന്ന പ്രതികാരനടപടിയെയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: അധികാരിയുടെ ശിക്ഷാപരമായ പങ്കും ക്രോധത്തിന്റെ ഉറവിടവും
  choice: ‘ക്രോധം നടപ്പാക്കുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി, അതിനെ പ്രധാനവാചകത്തിൽ ‘ദൈവത്തിന്റെ ക്രോധം’ എന്നു വ്യക്തമാക്കുന്നില്ല.
  alternative: ‘തിന്മ ചെയ്യുന്നവന്റെമേൽ ദൈവത്തിന്റെ ക്രോധം വരുത്തുന്ന’
  rationale: സന്ദർഭത്തിൽ അധികാരി ദൈവത്തിന്റെ സേവകനാണെങ്കിലും εἰς ὀργὴν എന്ന പ്രയോഗത്തിൽ ‘ദൈവത്തിന്റെ’ എന്ന ഉടമസ്ഥപദം നേരിട്ട് ഇല്ല. അതിനാൽ ദൈവിക ഏജൻസിയുമായുള്ള ബന്ധം നിലനിർത്തിക്കൊണ്ട് ക്രോധത്തിന്റെ ഉറവിടത്തെ ഗ്രീക്കിനേക്കാൾ വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു മനസ്സിലാകുന്ന, എന്നാൽ ഗൗരവം നിലനിർത്തുന്ന ശൈലി. ഭരണാധികാരിയെ സൂചിപ്പിക്കുന്ന നപുംസക സർവനാമമായ ‘അത്’ മുൻവാക്യസന്ദർഭത്തോട് യോജിക്കുന്നു. അവസാന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ സംക്ഷിപ്തതയും ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും അടിക്കുറിപ്പിലൂടെ തുറന്നുവെച്ചിരിക്കുന്നു.
