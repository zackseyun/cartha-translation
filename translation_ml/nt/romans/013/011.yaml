id: ROM.13.11
reference: Romans 13:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: ml
  text: 'ഇതും ചെയ്യുക, കാലത്തെ തിരിച്ചറിഞ്ഞുകൊണ്ട്: ഉറക്കത്തിൽനിന്ന് ഉണരാൻ നിങ്ങൾക്കു[a] ഇതിനകം സമയമായിരിക്കുന്നു. കാരണം, നാം വിശ്വസിച്ചപ്പോഴത്തെക്കാൾ[b] നമ്മുടെ രക്ഷ ഇപ്പോൾ കൂടുതൽ അടുത്തിരിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘നിങ്ങൾക്കു’ എന്നതിനുപകരം ‘നമുക്കു’ എന്നു വായിക്കുന്ന ചില കൈയെഴുത്തുപ്രതികളുണ്ട്.
    reason: textual_variant
  - marker: b
    text: അഥവാ, ‘നാം ആദ്യം വിശ്വസിച്ചപ്പോഴത്തെക്കാൾ.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ ‘നാം വിശ്വസിച്ചപ്പോൾ’ എന്നു മാത്രമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: ഇതും ചെയ്യുക
  rationale: മുൻവാക്യങ്ങളിലെ ധാർമിക പ്രബോധനങ്ങളിലേക്കാണ് τοῦτο വിരൽചൂണ്ടുന്നത്. സന്ദർഭത്തിൽ ഉൾക്കൊള്ളുന്ന ആജ്ഞാഭാവം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: εἰδότες τὸν καιρόν
  choice: നിങ്ങൾ ഈ കാലം അറിയുന്നുവല്ലോ
  rationale: വർത്തമാനകാലത്തിന്റെ നിർണായക സ്വഭാവം മനസ്സിലാക്കുന്നു എന്ന ആശയം നിലനിർത്തുന്നു; കൃുദന്തരൂപത്തിന്റെ സന്ദർഭജന്യ കാരണഭാവം ‘അറിയുന്നുവല്ലോ’ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: സമയം നിങ്ങൾക്ക് ഇതിനകം വന്നിരിക്കുന്നു
  rationale: ὥραയുടെ അടിയന്തരതയും ἤδηയുടെ ‘ഇതിനകം’ എന്ന ഊന്നലും വായനാസൗകര്യമുള്ള മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; SBLGNTയിലെ രണ്ടാംപുരുഷ ബഹുവചനമായ ὑμᾶς പിന്തുടരുന്നു.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: ഉറക്കത്തിൽനിന്ന് ഉണരേണ്ട
  rationale: ഉറക്കം എന്ന രൂപകം വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നേരിട്ട് നിലനിർത്തുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: νῦν γὰρ
  choice: എന്തെന്നാൽ ... ഇപ്പോൾ
  rationale: γάρ നൽകുന്ന കാരണബന്ധവും νῦν സൂചിപ്പിക്കുന്ന ഇപ്പോഴത്തെ നിമിഷവും വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: നമ്മുടെ രക്ഷ ഇപ്പോൾ കൂടുതൽ അടുത്തിരിക്കുന്നു
  rationale: σωτηρίαയെ ‘രക്ഷ’ എന്നു നൽകുകയും അതിന്റെ സമീപിച്ചുകൊണ്ടിരിക്കുന്ന ഭാവി പൂർത്തീകരണത്തെ ‘കൂടുതൽ അടുത്തിരിക്കുന്നു’ എന്നു സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: നാം വിശ്വസിച്ചപ്പോഴത്തെക്കാൾ
  rationale: ഗ്രീക്കിൽ ഇല്ലാത്ത ‘ആദ്യം’ എന്ന ആശയം മുഖ്യവാചകത്തിൽ ചേർക്കാതെ ἐπιστεύσαμεν എന്ന ലളിതമായ ക്രിയാഭാവം നിലനിർത്തുന്നു.
theological_decisions:
- issue: വിശ്വസിച്ച സമയത്തേക്കാൾ ഇപ്പോൾ അടുത്തിരിക്കുന്ന ‘രക്ഷ’യുടെ അർഥം
  choice: ‘നമ്മുടെ രക്ഷ’ എന്നു മാത്രം നൽകി അതിന്റെ പരിധി ചുരുക്കാതിരിക്കുന്നു.
  alternative: ‘നമ്മുടെ അന്തിമരക്ഷ’ അല്ലെങ്കിൽ ‘കർത്താവിന്റെ വരവിലുള്ള വിടുതൽ’
  rationale: രക്ഷ വിശ്വാസികളുടേതാണെന്നും അതേസമയം ഇനിയും അടുത്തുവരുന്നതാണെന്നും വാക്യം പറയുന്നു. അതിനാൽ ഇതിനകം ലഭിച്ചതും ഇനിയും പൂർത്തിയാകാനുള്ളതുമായ രക്ഷയുടെ പിരിമുറുക്കം വ്യാഖ്യാനത്തിലൂടെ ഇല്ലാതാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി സ്വീകരിച്ചു. മൂലത്തിലെ ഉറക്കരൂപകവും രക്ഷയുടെ ഇതിനകം/ഇനിയും എന്ന ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും നിലനിർത്തി. അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ അവ വിശദീകരിക്കുന്ന പദപ്രയോഗങ്ങൾക്കരികിൽ ചേർത്തു.
