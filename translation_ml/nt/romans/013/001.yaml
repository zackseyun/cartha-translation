id: ROM.13.1
reference: Romans 13:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: ml
  text: ഓരോരുത്തരും ഭരണാധികാരികൾക്കു[a] വിധേയരായിരിക്കട്ടെ. എന്തെന്നാൽ, ദൈവത്തിൽ നിന്നല്ലാതെ ഒരു അധികാരവുമില്ല; നിലവിലുള്ള ഭരണാധികാരികൾ ദൈവത്താൽ നിയമിക്കപ്പെട്ടവയാണ്.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘മേലധികാരികൾക്ക്’ അല്ലെങ്കിൽ ‘ഉന്നത അധികാരികൾക്ക്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദൈവത്താൽ സ്ഥാപിക്കപ്പെട്ടവയാണ്’ അല്ലെങ്കിൽ ‘ദൈവത്താൽ ക്രമത്തിൽ നിർത്തപ്പെട്ടവയാണ്.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: ഓരോ വ്യക്തിയും
  rationale: അക്ഷരാർഥത്തിൽ ‘ഓരോ ജീവനും/ആത്മാവും’ എന്നാകാമെങ്കിലും, കൊയ്നേ ഗ്രീക്കിൽ ഇവിടെ ഓരോ മനുഷ്യനെയും സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പ്രയോഗമാണ്. ‘ഓരോ വ്യക്തിയും’ എന്നത് വിതരണാത്മകമായ πᾶσα എന്ന ബലവും ആധുനിക മലയാളത്തിലെ വ്യക്തതയും നിലനിർത്തുന്നു.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: ഭരണാധികാരികൾക്കു
  rationale: ἐξουσίαις അധികാരമുള്ളവരെയോ അധികാരസംവിധാനങ്ങളെയോ സൂചിപ്പിക്കുന്നു; ὑπερεχούσαις അവരുടെ മേൽസ്ഥാനത്തെയും ഭരണചുമതലയെയും വ്യക്തമാക്കുന്നു. പൗരഭരണസന്ദർഭത്തിൽ ‘ഭരണാധികാരികൾ’ സ്വാഭാവികവും വ്യക്തവുമാണ്; കൂടുതൽ അക്ഷരാർഥപരമായ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ὑποτασσέσθω
  choice: കീഴടങ്ങിയിരിക്കട്ടെ
  rationale: വർത്തമാനകാല ആജ്ഞാരൂപം ക്രമബദ്ധമായ അധീനതയിൽ തുടരുക എന്ന ആശയം നൽകുന്നു. ‘കീഴടങ്ങിയിരിക്കട്ടെ’ അതിന്റെ തുടർച്ചയും ആജ്ഞാഭാവവും മലയാളത്തിൽ സ്വാഭാവികമായി അറിയിക്കുന്നു; എല്ലാ പ്രവൃത്തികളോടുമുള്ള നിരുപാധിക അനുസരണം എന്ന ആശയം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: ദൈവത്തിൽനിന്നല്ലാതെ യാതൊരു അധികാരവുമില്ല
  rationale: ὑπὸ θεοῦ ഇവിടെ അധികാരത്തിന്റെ ആത്യന്തിക ഉറവിടത്തെ സൂചിപ്പിക്കുന്നു. ‘ദൈവത്തിൽനിന്ന്’ എന്നത് ഉറവിടം വ്യക്തമായി അറിയിക്കുമ്പോൾ ഗ്രീക്കിനേക്കാൾ അധികമായ ഏജൻസി വ്യാഖ്യാനം ചുമത്തുന്നില്ല.
- source_word: αἱ δὲ οὖσαι
  choice: നിലവിലുള്ള അധികാരങ്ങൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചനരൂപം മുമ്പുള്ള ἐξουσίαις എന്നതിനെയാണ് തിരികെ സൂചിപ്പിക്കുന്നത്. ‘നിലവിലുള്ള അധികാരങ്ങൾ’ എന്നത് മലയാളത്തിൽ പരാമർശം വ്യക്തമാക്കുന്നു.
- source_word: τεταγμέναι
  choice: ക്രമീകരിക്കപ്പെട്ടവയാണ്
  rationale: τάσσω എന്ന ക്രിയയുടെ പൂർണ്ണകാല കർമണിരൂപം, ദൈവം ക്രമത്തിൽ നിർത്തിയതിന്റെ ഫലമായി നിലനിൽക്കുന്ന അവസ്ഥയെ സൂചിപ്പിക്കുന്നു. ‘ക്രമീകരിക്കപ്പെട്ടവ’ നിയമിക്കപ്പെട്ടത്, സ്ഥാപിക്കപ്പെട്ടത്, ക്രമത്തിൽ നിർത്തപ്പെട്ടത് എന്നീ അർഥസാധ്യതകളെ അമിതമായി ചുരുക്കാതെ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: പൗരാധികാരവും ദൈവവും തമ്മിലുള്ള ബന്ധത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയുടെ വ്യാപ്തി
  choice: ഭരണാധികാരത്തിൻ്റെ ആത്യന്തിക ഉറവിടം ദൈവമാണെന്നും നിലവിലുള്ള അധികാരങ്ങൾ ദൈവിക ക്രമീകരണത്തിൽ നിലകൊള്ളുന്നുവെന്നും വാക്യം പറയുന്നതായി പരിഭാഷപ്പെടുത്തി.
  alternative: ഓരോ ഭരണകൂടത്തിൻ്റെയും ഓരോ പ്രവൃത്തിയും ദൈവം ധാർമ്മികമായി അംഗീകരിക്കുന്നു എന്ന ശക്തമായ വായന; അല്ലെങ്കിൽ യഥാർഥ ഭരണാധികാരികളെയല്ല, അധികാരം എന്ന അമൂർത്ത തത്ത്വത്തെ മാത്രം പൗലോസ് ഉദ്ദേശിക്കുന്നു എന്ന ദുർബലമായ വായന.
  rationale: ഗ്രീക്ക് പാഠം യഥാർഥത്തിൽ നിലവിലുള്ള അധികാരങ്ങളെ പരാമർശിക്കുകയും അവ ദൈവത്താൽ τεταγμέναι ആണെന്ന് പറയുകയും ചെയ്യുന്നു. എന്നാൽ എല്ലാ ഭരണനടപടികൾക്കും നിരുപാധിക ദൈവിക അംഗീകാരം ഉണ്ടെന്ന് ഈ വാക്യം തന്നെ പറയുന്നില്ല. ‘ക്രമീകരിക്കപ്പെട്ടവ’ എന്നത് ഈ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ഗൗരവപൂർണവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘ഓരോ വ്യക്തിയും’ എന്നത് പഴയ ‘ഓരോ ആത്മാവും’ എന്ന അക്ഷരാർഥപ്രയോഗം സൃഷ്ടിക്കാവുന്ന തെറ്റിദ്ധാരണ ഒഴിവാക്കുന്നു. മുഖ്യപാഠത്തിലെ ‘ക്രമീകരിക്കപ്പെട്ടവ’ ഗ്രീക്കിലെ τάσσω എന്ന പദത്തിന്റെ വ്യാപ്തി നിലനിർത്തുന്നു; കൂടുതൽ പരിചിതമായ പകരങ്ങൾ അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
