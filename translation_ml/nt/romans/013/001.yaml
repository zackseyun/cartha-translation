- from: ഓരോ വ്യക്തിയും ഭരണാധികാരികൾക്കു[a] കീഴടങ്ങിയിരിക്കട്ടെ. എന്തെന്നാൽ, ദൈവത്തിൽനിന്നല്ലാതെ യാതൊരു അധികാരവുമില്ല; നിലവിലുള്ള അധികാരങ്ങൾ ദൈവത്താൽ ക്രമീകരിക്കപ്പെട്ടവയാണ്.[b]
  to: ഓരോരുത്തരും ഭരണാധികാരികൾക്കു[a] വിധേയരായിരിക്കട്ടെ. എന്തെന്നാൽ, ദൈവത്തിൽ നിന്നല്ലാതെ ഒരു അധികാരവുമില്ല; നിലവിലുള്ള ഭരണാധികാരികൾ ദൈവത്താൽ നിയമിക്കപ്പെട്ടവയാണ്.[b]
