  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: ml
  text: അതുകൊണ്ട്, വിധേയരായിരിക്കേണ്ടത്[a] അനിവാര്യമാണ്—ക്രോധം[b] നിമിത്തം മാത്രമല്ല, മനസ്സാക്ഷിയുടെ നിമിത്തവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കീഴ്പെട്ടിരിക്കേണ്ടത്.’
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ശിക്ഷ നിമിത്തം.’ ഗ്രീക്കിൽ അക്ഷരാർഥം ‘ക്രോധം നിമിത്തം’ എന്നാണ്; ഇത് ഭരണാധികാരിയുടെ ശിക്ഷാനടപടിയെയോ, കൂടുതൽ വിശാലമായി ഭരണാധികാരത്തിലൂടെ പ്രവർത്തിക്കുന്ന ദൈവക്രോധത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യങ്ങളിലെ ഭരണാധികാരികളെക്കുറിച്ചുള്ള വാദത്തിൽനിന്നുള്ള നിഗമനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἀνάγκη
  choice: അനിവാര്യമാണ്
  rationale: വ്യക്തിപരമല്ലാത്ത അനിവാര്യതയെ നേരിട്ടും ഗൗരവത്തോടെയും പ്രകടിപ്പിക്കുന്നു.
- source_word: ὑποτάσσεσθαι
  choice: കീഴടങ്ങേണ്ടത്
  rationale: ഭരണാധികാരികളോടുള്ള ഉചിതമായ വിധേയനിലപാടിനെ സൂചിപ്പിക്കുന്നു; മൂലപദം പറയുന്നതിലധികമായി നിരുപാധിക അനുസരണം എന്ന ആശയം ചേർക്കുന്നില്ല.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: … നിമിത്തം മാത്രമല്ല, … നിമിത്തവും
  rationale: ഗ്രീക്കിലെ പരസ്പരബന്ധമുള്ള വിരുദ്ധ-കൂട്ടിച്ചേർക്കൽ ഘടന സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: διὰ τὴν ὀργὴν
  choice: ക്രോധം നിമിത്തം
  rationale: διά + accusative സൂചിപ്പിക്കുന്ന കാരണമോ പ്രേരണയോ നിലനിർത്തുന്നു. ὀργήയെ ‘ശിക്ഷ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ ‘ക്രോധം’ എന്നു പരിഭാഷപ്പെടുത്തി അതിന്റെ സന്ദിഗ്ധത സംരക്ഷിക്കുന്നു.
- source_word: διὰ τὴν συνείδησιν
  choice: മനസ്സാക്ഷി നിമിത്തം
  rationale: വിധേയത്വത്തിനുള്ള ആന്തരിക ധാർമ്മിക പ്രേരണയെ നേരിട്ട് പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ὀργή (‘ക്രോധം’) ആരുടേതാണ് എന്നത്
  choice: ‘ക്രോധം’ എന്നു മാത്രം നൽകി സൂചിത വ്യക്തിയെ നിർണ്ണയിക്കാതെ വിട്ടു.
  alternative: ‘ദൈവക്രോധം’ അല്ലെങ്കിൽ ‘ഭരണാധികാരിയുടെ ശിക്ഷ’
  rationale: സമീപസന്ദർഭത്തിൽ ദൈവം സ്ഥാപിച്ച അധികാരവും വാൾ വഹിക്കുന്ന ഭരണാധികാരിയും രണ്ടും വരുന്നു; ഈ വാക്യത്തിൽ ഗ്രീക്ക് സൂചിത വ്യക്തിയെ വ്യക്തമാക്കുന്നില്ല.
- issue: ὑποτάσσεσθαι എന്നതിന്റെ വ്യാപ്തി
  choice: ‘കീഴടങ്ങേണ്ടത്’
  alternative: ‘കീഴ്പെട്ടിരിക്കേണ്ടത്’
  rationale: ആവശ്യപ്പെടുന്ന വിധേയനിലപാട് വ്യക്തമാക്കുന്നു; എന്നാൽ പാഠം പ്രസ്താവിക്കാത്ത നിരുപാധിക അനുസരണത്തിന്റെ സിദ്ധാന്തം ഇതിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. വാക്യത്തിന്റെ നിഗമനസ്വഭാവവും ‘മാത്രമല്ല … നിമിത്തവും’ എന്ന തുലിത ഘടനയും നിലനിർത്തി. അടിക്കുറിപ്പുകളുടെ സൂചനകൾ അവ വിശദീകരിക്കുന്ന പദങ്ങളോടുതന്നെ ചേർത്തിരിക്കുന്നു.
