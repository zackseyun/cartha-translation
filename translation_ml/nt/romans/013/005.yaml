- from: അതുകൊണ്ട്, കീഴടങ്ങേണ്ടത്[a] അനിവാര്യമാണ്—ക്രോധം[b] നിമിത്തം മാത്രമല്ല, മനസ്സാക്ഷി നിമിത്തവും.
