id: ROM.13.14
reference: Romans 13:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: ml
  text: എന്നാൽ കർത്താവായ യേശു മശീഹയെ ധരിക്കുവിൻ; ജഡത്തിനുവേണ്ടി അതിന്റെ മോഹങ്ങൾക്കായി യാതൊരു ഒരുക്കവും ചെയ്യരുത്.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: ധരിക്കുവിൻ
  rationale: വസ്ത്രം ധരിക്കുന്നതിന്റെ രൂപകം നിലനിർത്തിക്കൊണ്ട്, ഒരു ജീവിതരീതിയോ വ്യക്തിത്വമോ സ്വീകരിക്കുക എന്ന മധ്യമപ്രയോഗത്തിലുള്ള ആജ്ഞയുടെ ആശയം സ്വാഭാവികമായി അറിയിക്കുന്നു.
- source_word: κύριον
  choice: കർത്താവായ
  rationale: യേശുവിന്റെ പദവിയായി κύριος വഹിക്കുന്ന ക്രിസ്തുശാസ്ത്രപരമായ ഭാരം നിലനിർത്തുന്നു; മലയാളത്തിലെ സ്വാഭാവിക വിശേഷണഘടനയ്ക്കായി ‘കർത്താവായ’ എന്നു ചേർത്തു.
- source_word: Χριστόν
  choice: മശീഹ
  rationale: ഇവിടെ ഇത് പേരിന്റെ ഭാഗമായി മാത്രം അല്ല, അഭിഷിക്തൻ എന്ന പദവിയായാണ് പ്രവർത്തിക്കുന്നത്; അതിനാൽ പദവിയുടെ അർഥം നിലനിർത്തുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: യാതൊരു ഒരുക്കവും ചെയ്യരുത്
  rationale: മുൻകൂട്ടി ആസൂത്രണം ചെയ്യുകയോ സൗകര്യമൊരുക്കുകയോ ചെയ്യരുത് എന്ന സംയുക്തപ്രയോഗത്തിന്റെ ആശയം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: σάρξ
  choice: ജഡം
  rationale: പൗലോസിന്റെ രൂപകാത്മക പദപ്രയോഗവും അതിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും ചുരുക്കി വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
- source_word: εἰς ἐπιθυμίας
  choice: മോഹങ്ങൾക്കായി
  rationale: ഉദ്ദേശ്യമോ ഫലദിശയോ സൂചിപ്പിക്കുന്ന εἰς എന്നതിനെ വ്യാഖ്യാനപരമായി ‘നിറവേറ്റാൻ’ എന്നു വികസിപ്പിക്കാതെ, മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ചെറിയ അർഥവ്യാപ്തിയും നിലനിർത്തുന്നു.
theological_decisions:
- issue: ധാർമികമായി പ്രതികൂലമായ പൗലോസിന്റെ σάρξ എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: ജഡം
  alternative: പാപസ്വഭാവം
  rationale: സന്ദർഭം ക്രമരഹിതമായ മനുഷ്യാഭിലാഷങ്ങളെ സൂചിപ്പിക്കുന്നുവെങ്കിലും, ‘പാപസ്വഭാവം’ എന്നു വിവർത്തനം ചെയ്യുന്നത് പൗലോസിന്റെ മനുഷ്യശാസ്ത്രത്തെ കൂടുതൽ ഇടുങ്ങിയ രീതിയിൽ വ്യാഖ്യാനിച്ചേക്കാം. അതിനാൽ പ്രധാനപാഠത്തിൽ ‘ജഡം’ നിലനിർത്തി വ്യാഖ്യാനപരമായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ നൽകി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ധരിക്കുവിൻ’ എന്ന രൂപം വസ്ത്രരൂപകവും ബഹുവചന ആജ്ഞയും സംരക്ഷിക്കുന്നു; അവസാന വാക്യഭാഗം ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയോട് ചേർന്നുനിൽക്കുന്നു.
