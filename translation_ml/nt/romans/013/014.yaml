    text: അഥവാ, “പാപസ്വഭാവം.” ഗ്രീക്കിൽ അക്ഷരാർഥം “ജഡം” എന്നാണ്; ദൈവത്താൽ നയിക്കപ്പെടുന്ന ജീവിതത്തിനു വിരുദ്ധമായ മനുഷ്യന്റെ വീണുപോയ പ്രേരണകളെ സൂചിപ്പിക്കാൻ പൗലോസ് ഈ പദം പലപ്പോഴും ഉപയോഗിക്കുന്നു.
    reason: lexical_alternative
