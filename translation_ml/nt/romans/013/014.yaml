revisions:
- from: എന്നാൽ കർത്താവായ യേശു മശീഹയെ ധരിക്കുവിൻ; ജഡത്തിന്റെ[a] മോഹങ്ങൾക്കായി യാതൊരു ഒരുക്കവും ചെയ്യരുത്.
  to: എന്നാൽ കർത്താവായ യേശു മശീഹയെ ധരിക്കുവിൻ; ജഡത്തിനുവേണ്ടി അതിന്റെ മോഹങ്ങൾക്കായി യാതൊരു ഒരുക്കവും ചെയ്യരുത്.
  rationale: The revision makes ‘ജഡം’ the object for which provision is not to be made, while retaining desires as the subsequent purpose/direction. The footnote now supplies a genuine lexical alternative for σάρξ and preserves the main text’s theological openness.
