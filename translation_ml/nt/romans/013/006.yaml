- from: ഇക്കാരണത്താലാണ് നിങ്ങൾ നികുതിയും കൊടുക്കുന്നത്; അവർ ദൈവത്തിന്റെ ശുശ്രൂഷകരായി ഈ കാര്യത്തിനുതന്നെ നിരന്തരം ശ്രദ്ധ ചെലുത്തുന്നു.
  to: ഇക്കാരണത്താലാണ് നിങ്ങൾ നികുതികളും അടയ്ക്കുന്നത്; കാരണം, അവർ ദൈവത്തിന്റെ ശുശ്രൂഷകരാണ്; ഈ കാര്യത്തിനുതന്നെ അവർ നിരന്തരം ഏർപ്പെട്ടിരിക്കുന്നു.
