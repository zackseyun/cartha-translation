id: ROM.13.6
reference: Romans 13:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: ml
  text: ഇക്കാരണത്താലാണ് നിങ്ങൾ നികുതികളും അടയ്ക്കുന്നത്; കാരണം, അവർ ദൈവത്തിന്റെ ശുശ്രൂഷകരാണ്; ഈ കാര്യത്തിനുതന്നെ അവർ നിരന്തരം ഏർപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: നികുതിയും കൊടുക്കുന്നത്
  rationale: φόρος ഭരണകൂടത്തിനു കൊടുക്കുന്ന നേരിട്ടുള്ള നികുതിയെയാണ് സൂചിപ്പിക്കുന്നത്; τελεῖτε എന്നത് ഇവിടെ ‘കൊടുക്കുക/അടയ്ക്കുക’ എന്ന സാധാരണ അർഥത്തിൽ സ്വാഭാവികമായി പരിഭാഷപ്പെടുത്തി.
- source_word: λειτουργοὶ θεοῦ
  choice: ദൈവത്തിന്റെ ശുശ്രൂഷകർ
  rationale: λειτουργός ഔദ്യോഗികമോ പൊതുസേവനപരമോ ആയ സേവകനെ സൂചിപ്പിക്കാം. ‘ശുശ്രൂഷകർ’ ദൈവത്തോടുള്ള ബന്ധം നിലനിർത്തുകയും അനാവശ്യമായി പ്രത്യേക സഭാപദവി സൂചിപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: εἰς αὐτὸ τοῦτο προσκαρτεροῦντες
  choice: ഈ കാര്യത്തിനുതന്നെ നിരന്തരം ശ്രദ്ധ ചെലുത്തുന്നു
  rationale: προσκαρτερέω എന്നതിലെ സ്ഥിരതയോടെ ഏർപ്പെട്ടിരിക്കുക/അർപ്പിതരായിരിക്കുക എന്ന ഭാവവും αὐτὸ τοῦτο എന്ന ഊന്നലും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ഭരണാധികാരികളെ ‘ദൈവത്തിന്റെ ശുശ്രൂഷകർ’ എന്നു വിളിക്കുന്നത്
  choice: വാക്യത്തിലെ നേരിട്ടുള്ള ദൈവബന്ധം അതേപടി നിലനിർത്തി
  alternative: ‘ദൈവത്തിനുവേണ്ടി സേവിക്കുന്നവർ’ അല്ലെങ്കിൽ ‘ദൈവം നിയമിച്ച സേവകർ’
  rationale: ഗ്രീക്ക് വാചകം θεοῦ എന്ന ബന്ധം മാത്രം വ്യക്തമാക്കുന്നു; ‘നിയമിച്ച’ എന്ന ആശയം ഈ വാക്യത്തിൽ ചേർക്കുന്നത് മൂലപാഠത്തേക്കാൾ കൂടുതൽ വ്യാഖ്യാനപരമായിരിക്കും.
- issue: ‘ഈ കാര്യം’ എന്തിനെ സൂചിപ്പിക്കുന്നു എന്നത്
  choice: ‘ഈ കാര്യത്തിനുതന്നെ’ എന്ന അനിശ്ചിത സൂചന നിലനിർത്തി
  alternative: ‘നികുതി പിരിവിനുതന്നെ’ അല്ലെങ്കിൽ ‘ഭരണകാര്യങ്ങൾക്കുതന്നെ’
  rationale: αὐτὸ τοῦτο എന്നതിന്റെ കൃത്യമായ പരിധി സന്ദർഭത്തിൽ വ്യാഖ്യാനിക്കേണ്ടതാണ്; പരിഭാഷയിൽ അത് ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കിയില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘നികുതി അടയ്ക്കുന്നു’ എന്നതും സാധ്യമെങ്കിലും, വായനാസൗകര്യത്തിനായി ‘നികുതി കൊടുക്കുന്നു’ സ്വീകരിച്ചു; ‘നിരന്തരം ശ്രദ്ധ ചെലുത്തുന്നു’ ഔദ്യോഗിക സേവനത്തിലെ സ്ഥിരമായ ഏർപ്പെടൽ വ്യക്തമാക്കുന്നു.
