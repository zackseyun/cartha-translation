id: ROM.13.9
reference: Romans 13:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: ml
  text: എന്തെന്നാൽ, “വ്യഭിചാരം ചെയ്യരുത്; കൊലപാതകം ചെയ്യരുത്[a]; മോഷ്ടിക്കരുത്; മോഹിക്കരുത്” എന്നീ കൽപ്പനകളും, മറ്റേതെങ്കിലും കൽപ്പനയുണ്ടെങ്കിൽ അതും, “നിന്നെപ്പോലെതന്നെ നിന്റെ അയൽക്കാരനെയും സ്നേഹിക്കണം” എന്ന ഈ വചനത്തിൽ[b] സംഗ്രഹിക്കപ്പെട്ടിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കൊലപാതകം ചെയ്യരുത്’ എന്നത് ‘കൊല്ലരുത്’ എന്ന പൊതുവായ വിവർത്തനത്തെക്കാൾ കൃത്യമാണ്; ഗ്രീക്ക് ക്രിയ അന്യായമായ മനുഷ്യഹത്യയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “ഈ പ്രസ്താവനയിൽ.” ഇവിടെ ഉപയോഗിച്ചിരിക്കുന്ന ഗ്രീക്ക് പദത്തിന് സന്ദർഭമനുസരിച്ച് ‘വചനം,’ ‘പ്രസ്താവന,’ ‘ചൊല്ല്’ എന്നീ അർഥങ്ങൾ വരാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ആശയം വിശദീകരിച്ചുകൊണ്ട് കൽപ്പനകളുടെ പട്ടിക അവതരിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ ബന്ധകശക്തി സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: Οὐ μοιχεύσεις
  choice: വ്യഭിചാരം ചെയ്യരുത്
  rationale: ദശകൽപ്പനയുടെ ഉദ്ധരണിയിലെ ഭാവികാല ക്രിയയ്ക്ക് ആജ്ഞാർഥമാണുള്ളത്; മലയാളത്തിൽ ഔപചാരികവും സ്വാഭാവികവുമായ നിരോധനരൂപം ഉപയോഗിച്ചു.
- source_word: Οὐ φονεύσεις
  choice: കൊലപാതകം ചെയ്യരുത്
  rationale: φονεύω പൊതുവായ എല്ലാ കൊല്ലലിനെയുംക്കാൾ അന്യായമായ മനുഷ്യഹത്യയെ സൂചിപ്പിക്കുന്നതിനാൽ ‘കൊല്ലരുത്’ എന്നതിനെക്കാൾ കൃത്യമാണ്.
- source_word: Οὐ κλέψεις
  choice: മോഷ്ടിക്കരുത്
  rationale: ഉദ്ധരിച്ച കൽപ്പനയുടെ നിരോധനശക്തി ചുരുക്കവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: മോഹിക്കരുത്
  rationale: ദശകൽപ്പനയുടെ പശ്ചാത്തലത്തിൽ മറ്റുള്ളവരുടേതിനെ സ്വന്തമാക്കാനുള്ള മോഹത്തെ സൂചിപ്പിക്കുന്ന പതിവും യോജിച്ചതുമായ പദമാണ്.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: മറ്റേതെങ്കിലും കൽപ്പനയുണ്ടെങ്കിൽ അതും
  rationale: പട്ടികയിൽ പറഞ്ഞിട്ടില്ലാത്ത എല്ലാ കൽപ്പനകളിലേക്കും വ്യാപിക്കുന്ന അനിശ്ചിതവും ഉൾക്കൊള്ളുന്നതുമായ അർഥം നിലനിർത്തുന്നു.
- source_word: ἀνακεφαλαιοῦται
  choice: സംഗ്രഹിക്കപ്പെട്ടിരിക്കുന്നു
  rationale: പല കൽപ്പനകളെയും ഒരു പ്രധാന പ്രസ്താവനയ്ക്കു കീഴിൽ ഒരുമിച്ചുകൊണ്ടുവരുന്നു എന്ന ക്രിയയുടെ അർഥം വ്യക്തമായി നൽകുന്നു.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: ഈ വചനത്തിൽ
  rationale: λόγος ഇവിടെ പിന്നാലെ വരുന്ന തിരുവെഴുത്തുപ്രസ്താവനയെ സൂചിപ്പിക്കുന്നു; ‘വചനം’ അതിന്റെ സംക്ഷിപ്തതയും തിരുവെഴുത്തുസംബന്ധവും സംരക്ഷിക്കുന്നു.
- source_word: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν
  choice: നിന്നെപ്പോലെതന്നെ നിന്റെ അയൽക്കാരനെയും സ്നേഹിക്കണം
  rationale: ലേവ്യപുസ്തക ഉദ്ധരണിയുടെ ആജ്ഞാർഥവും ‘അയൽക്കാരൻ’ എന്ന ബന്ധപദവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു; ‘തന്നെ’ താരതമ്യത്തിന് ഊന്നൽ നൽകുന്നു.
theological_decisions:
- issue: ഉദ്ധരിച്ച ദശകൽപ്പനകളുടെ നിരോധനരൂപം
  choice: ‘ചെയ്യരുത്’ എന്ന നിയമപരവും തിരുവെഴുത്തുപരവുമായ രൂപം
  alternative: ‘ചെയ്യാതിരിക്കുക’ എന്ന നാമധാതുരൂപം
  rationale: ഗ്രീക്കിലെ ഭാവികാലരൂപങ്ങൾ ഇവിടെ ആജ്ഞകളായി പ്രവർത്തിക്കുന്നു; മലയാളത്തിലെ ‘ചെയ്യരുത്’ അവയുടെ നേരിട്ടുള്ള കൽപ്പനാഭാവവും പഴയനിയമബന്ധവും നിലനിർത്തുന്നു.
- issue: φονεύσεις എന്നതിന്റെ വ്യാപ്തി
  choice: കൊലപാതകം ചെയ്യരുത്
  alternative: കൊല്ലരുത്
  rationale: മൂലപദം എല്ലാ തരത്തിലുള്ള ജീവഹത്യയെയും പൊതുവായി നിരോധിക്കുന്നതായി വിവർത്തനത്തിലൂടെ വികസിപ്പിക്കാതെ, മനുഷ്യനെ അന്യായമായി കൊല്ലുന്നതിനെ സൂചിപ്പിക്കുന്ന കൂടുതൽ കൃത്യമായ രൂപം സ്വീകരിച്ചു.
- issue: λόγος എന്നതിന്റെ അർഥം
  choice: വചനം—സംഗ്രഹിക്കുന്ന തിരുവെഴുത്തുപ്രസ്താവന
  alternative: പ്രസ്താവന / വാക്ക്
  rationale: ഇത് ഒറ്റ പദമല്ല, പിന്നാലെ ഉദ്ധരിക്കുന്ന സമ്പൂർണ വാക്യമാണ്. ‘വചനം’ മൂലത്തിലെ സംക്ഷിപ്തതയും തിരുവെഴുത്തുസ്വരവും കാത്തുസൂക്ഷിക്കുന്നു; പകരം അർഥം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ തിരുവെഴുത്തുശൈലി. കൽപ്പനകൾക്ക് സാധാരണ വായനക്കാർക്ക് ഉടൻ മനസ്സിലാകുന്ന ‘ചെയ്യരുത്’ രൂപം ഉപയോഗിച്ചു. വാക്യത്തിന്റെ ദൈർഘ്യം നിയന്ത്രിക്കാൻ അർദ്ധവിരാമങ്ങൾ നൽകിയെങ്കിലും ഗ്രീക്ക് വാക്യത്തിലെ പട്ടികയും സമാഹാരഘടനയും നിലനിർത്തി.
