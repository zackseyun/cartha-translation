id: ROM.13.2
reference: Romans 13:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: ml
  text: അതുകൊണ്ട്, അധികാരത്തെ എതിർക്കുന്നവൻ ദൈവത്തിന്റെ ക്രമീകരണത്തെയാണ്[a] എതിർത്തിരിക്കുന്നത്; എതിർത്തുനിന്നവർ തങ്ങൾക്കുതന്നെ ന്യായവിധി[b] ഏറ്റുവാങ്ങും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദൈവം ഏർപ്പെടുത്തിയ ക്രമത്തെയാണ്” അല്ലെങ്കിൽ “ദൈവത്തിന്റെ ക്രമവിധാനത്തെയാണ്.”
    reason: lexical_alternative
  - marker: b
    text: “ന്യായവിധി” എന്നത് “ശിക്ഷാവിധി” എന്നോ “കുറ്റവിധി” എന്നോ പരിഭാഷപ്പെടുത്താം; എന്നാൽ ഇവിടെ അന്തിമമായ കുറ്റശിക്ഷ എന്ന ശക്തമായ അർഥം ഗ്രീക്ക് പദം നിർബന്ധമാക്കുന്നില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞതിൽനിന്നുള്ള നിഗമനം വ്യക്തമാക്കുന്ന സ്വാഭാവികമായ മലയാളപ്രയോഗം.
- source_word: ὁ ἀντιτασσόμενος
  choice: എതിർക്കുന്നവൻ
  rationale: വർത്തമാനകാല മധ്യകൃദ്‌രൂപത്തിന്റെ പൊതുവായ, സ്വഭാവസൂചക അർഥം ലളിതമായി നൽകുന്നു.
- source_word: τῇ ἐξουσίᾳ
  choice: അധികാരത്തെ
  rationale: ഏകവചനം നിലനിർത്തുന്നു; ഭരണാധികാരമാണ് ഉദ്ദേശ്യമെന്നത് തൊട്ടുമുൻപുള്ള സന്ദർഭം വ്യക്തമാക്കുന്നു.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: ദൈവം ഏർപ്പെടുത്തിയ ക്രമത്തെ
  rationale: διαταγή എന്നതിലെ ദൈവിക ക്രമീകരണം/നിശ്ചയം എന്ന ആശയം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; വെറും നിയമകല്പന എന്നതിലേക്ക് അർഥം ചുരുക്കുന്നില്ല.
- source_word: ἀνθέστηκεν
  choice: എതിർത്തിരിക്കുന്നു
  rationale: പൂർത്തിയായ നിലപാടിന്റെ ഇപ്പോഴത്തെ പ്രസക്തി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണ്ണകാലത്തിന്റെ ഭാവം നിലനിർത്തുന്നു.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: എതിർത്തുനിന്നവർ
  rationale: അത്തരമൊരു എതിർപ്പിന്റെ നിലപാട് സ്വീകരിച്ചവരെ സൂചിപ്പിക്കുകയും മുൻക്രിയയുമായുള്ള ആശയബന്ധം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἑαυτοῖς
  choice: തങ്ങൾക്കുതന്നെ
  rationale: ഫലം എതിർക്കുന്നവരിലേക്കുതന്നെ തിരിച്ചുവരുന്നു എന്ന ആത്മവാചക ദാതിവിന്റെ ഊന്നൽ പ്രകടമാക്കുന്നു.
- source_word: κρίμα
  choice: ന്യായവിധി
  rationale: അന്തിമ ശിക്ഷാവിധി എന്ന ശക്തമായ അർഥം നിർബന്ധമായി ചേർക്കാതെ κρίμα എന്ന പദത്തിന്റെ വിശാലമായ ന്യായവിധി അർഥം സംരക്ഷിക്കുന്നു.
- source_word: λήμψονται
  choice: ഏറ്റുവാങ്ങും
  rationale: ഭാവികാലത്തിലെ ‘സ്വീകരിക്കുക/വരുത്തിക്കൊള്ളുക’ എന്ന ആശയം നേരായും സ്വാഭാവികമായും നൽകുന്നു.
theological_decisions:
- issue: κρίμα എന്നതിന്റെ വ്യാപ്തി
  choice: ന്യായവിധി
  alternative: ശിക്ഷാവിധി / കുറ്റവിധി
  rationale: ഇവിടെ ദൈവികമോ ന്യായപരമോ ആയ വിധിയുടെ മുന്നറിയിപ്പുണ്ട്; എന്നാൽ അത് അന്തിമനിത്യശിക്ഷയാണെന്ന് വാക്യം നിർബന്ധമായി വ്യക്തമാക്കുന്നില്ല.
- issue: ἐξουσία ആരെ സൂചിപ്പിക്കുന്നു
  choice: സന്ദർഭത്തിൽ ഭരണാധികാരം; പാഠത്തിൽ ‘അധികാരം’
  alternative: വിശാലമായ അർഥത്തിലുള്ള അധികാരം
  rationale: റോമർ 13:1-ലെ സമീപസന്ദർഭം ഭരണാധികാരങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്. എങ്കിലും മൂലപാഠത്തിന്റെ ഏകവചനവും സംക്ഷിപ്തതയും കാക്കാൻ വാക്യത്തിൽ ‘അധികാരം’ എന്നു നിലനിർത്തുന്നു.
- issue: ദൈവിക διαταγήയുടെ സ്വഭാവം
  choice: ദൈവം ഏർപ്പെടുത്തിയ ക്രമം
  alternative: ദൈവത്തിന്റെ ക്രമവിധാനം / ദൈവത്തിന്റെ കല്പന
  rationale: അധികാരത്തെക്കുറിച്ച് ദൈവം ഏർപ്പെടുത്തിയ ക്രമം എന്ന ബന്ധം പ്രകടമാക്കുന്നു; പ്രത്യേക രാഷ്ട്രീയ സംവിധാനത്തിന് നിരുപാധിക ദൈവിക അംഗീകാരം നൽകുന്ന തരത്തിൽ ആശയം വികസിപ്പിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘എതിർക്കുന്നവൻ/എതിർത്തുനിന്നവർ’ എന്ന ആവർത്തനബന്ധം മൂലപാഠത്തിലെ പദബന്ധം കേൾവിയാകുന്ന വിധത്തിൽ നിലനിർത്തി. അർഥം അതിരുകടന്ന് വിശദീകരിക്കാതിരിക്കാൻ ‘ഭരണാധികാരം’ എന്നതിനു പകരം സന്ദർഭാധീനമായ ‘അധികാരം’ ഉപയോഗിച്ചു.
