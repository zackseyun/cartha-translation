id: ROM.13.7
reference: Romans 13:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: ml
  text: 'എല്ലാവർക്കും അവർക്കു കൊടുക്കാനുള്ളത് കൊടുക്കുക: നികുതി കൊടുക്കേണ്ടവന് നികുതി; ചുങ്കം കൊടുക്കേണ്ടവന് ചുങ്കം; ഭയപ്പെടേണ്ടവനെ ഭയപ്പെടുക; ബഹുമാനിക്കേണ്ടവനെ ബഹുമാനിക്കുക.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: കൊടുക്കാനുള്ളത് കൊടുക്കുക
  rationale: ‘തിരികെ നൽകുക/അർഹമായത് നൽകുക’ എന്ന ബാധ്യതയുടെ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: φόρος
  choice: നികുതി
  rationale: സാധാരണയായി നേരിട്ടോ ചുമത്തപ്പെട്ടോ ഈടാക്കുന്ന നികുതിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക പദം.
- source_word: τέλος
  choice: ചുങ്കം
  rationale: φόρος എന്നതിൽനിന്നുള്ള വ്യത്യാസം നിലനിർത്തിക്കൊണ്ട് തീരുവ, കസ്റ്റംസ്, പരോക്ഷ ഈടാക്കൽ തുടങ്ങിയ അർഥപരിധി സൂചിപ്പിക്കുന്നു.
- source_word: φόβος
  choice: ഭയം
  rationale: ഗ്രീക്ക് പദത്തിന്റെ നേരിട്ടുള്ള അർഥവും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കവും ‘ആദരവ്’ എന്നു മൃദൂകരിക്കാതെ സംരക്ഷിക്കുന്നു.
- source_word: τιμή
  choice: ബഹുമാനം
  rationale: വിലമതിക്കൽ, ആദരിക്കൽ എന്നീ ആശയങ്ങൾ ഇവിടെ വ്യക്തിയോടുള്ള ബഹുമാനമായി സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: φόβος എന്നതിന്റെ പ്രയോഗം
  choice: ഭയം
  alternative: ആദരവ് / ഭയഭക്തി
  rationale: മൂലപദത്തിന്റെ യഥാർഥ ശക്തി സംരക്ഷിക്കുകയും φόβος-τιμή വ്യത്യാസം മായ്ച്ചുകളയാതിരിക്കുകയും ചെയ്യുന്നു; ഭയത്തിന്റെ അർഹനായ വ്യക്തി ആരെന്നത് വിവർത്തനം നിർണയിക്കുന്നില്ല.
- issue: നാലു ദാതൃപ്രയോഗങ്ങളുടെ ലക്ഷ്യവ്യക്തി
  choice: ‘കൊടുക്കേണ്ടവന്/കാണിക്കേണ്ടവനോട്’ എന്ന പൊതുവായ രൂപം
  alternative: ഭരണാധികാരികൾക്കു മാത്രം എന്നു വ്യക്തമാക്കൽ
  rationale: സന്ദർഭം ഭരണാധികാരികളുമായി ബന്ധപ്പെട്ടതാണെങ്കിലും, πᾶσι എന്ന വിശാലപ്രയോഗവും മൂലവാക്യത്തിന്റെ സംക്ഷിപ്തതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും ഗൗരവമുള്ളതുമായ ശൈലി. ഗ്രീക്കിലെ ആവർത്തനാത്മക സമാന്തരഘടന കഴിയുന്നത്ര നിലനിർത്തി; മലയാളത്തിൽ സ്വാഭാവികതയ്ക്കായി φόβος, τιμή എന്നിവയോടൊപ്പം ‘കാണിക്കുക’ ഉപയോഗിച്ചു.
