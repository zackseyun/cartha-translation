  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: ml
  text: ആരോടും ഒന്നും കടപ്പെട്ടിരിക്കരുത്; പരസ്പരം സ്നേഹിക്കുകയല്ലാതെ. എന്തെന്നാൽ, മറ്റൊരാളെ[a] സ്നേഹിക്കുന്നവൻ ന്യായപ്രമാണം നിറവേറ്റിയിരിക്കുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, ‘മറ്റെയാളെ.’ ഗ്രീക്കിൽ: ‘മറ്റേയാൾ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: ആരോടും ഒന്നും കടപ്പെട്ടിരിക്കരുത്
  rationale: ഗ്രീക്കിലെ ഇരട്ട സമഗ്രപ്രയോഗമായ ‘ആരോടും ഒന്നും’ എന്ന ആശയം നിലനിർത്തുന്നു. ὀφείλετε എന്നതിലെ കടത്തിന്റെയും ബാധ്യതയുടെയും അർഥവ്യാപ്തി ‘കടപ്പെട്ടിരിക്കുക’ സ്വാഭാവികമായി സൂക്ഷിക്കുന്നു.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: പരസ്പരം സ്നേഹിക്കുക എന്ന കടമ മാത്രമേ നിങ്ങൾക്കുണ്ടാകാവൂ
  rationale: εἰ μὴ എന്ന അപവാദവും articular infinitive സൂചിപ്പിക്കുന്ന തുടർന്നുനിൽക്കുന്ന ഏക ബാധ്യതയും സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു; ‘കടമ’ സന്ദർഭത്തിൽ നിന്നുള്ള ലഘുവായ പൂരിപ്പിക്കലാണ്.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: സ്നേഹിക്കുക / സ്നേഹിക്കുന്നവൻ
  rationale: ἀγαπάω എന്ന ക്രിയയുടെ സാധാരണവും ദൈവശാസ്ത്രപരമായി അനാവശ്യ വിപുലീകരണമില്ലാത്തതുമായ മലയാള സമാനപദം ഉപയോഗിക്കുന്നു.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: എന്തെന്നാൽ ... സ്നേഹിക്കുന്നവൻ
  rationale: γάρ-ന്റെ കാരണബന്ധവും substantival participle-ന്റെ പ്രതിനിധാന ഏകവചനവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: τὸν ἕτερον
  choice: മറ്റെയാളെ
  rationale: ഗ്രീക്കിലെ ‘the other’ എന്ന നേരിട്ടുള്ള പ്രയോഗം സൂക്ഷിക്കുന്നു; ഈ വാക്യത്തിൽ ഇല്ലാത്ത ‘അയൽക്കാരൻ’ എന്ന പദം ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: νόμον
  choice: ന്യായപ്രമാണം
  rationale: തുടർന്നുള്ള വാക്യങ്ങളിൽ മോശൈക കല്പനകളെ സൂചിപ്പിക്കുന്ന സന്ദർഭത്തിന് യോജിച്ച, മലയാള ക്രൈസ്തവ വായനക്കാർക്ക് പരിചിതമായ പദം.
- source_word: πεπλήρωκεν
  choice: നിറവേറ്റിയിരിക്കുന്നു
  rationale: perfect tense-ന്റെ പൂർത്തിയായ പ്രവൃത്തിയും തുടരുന്ന ഫലാവസ്ഥയും മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: കടത്തെക്കുറിച്ചുള്ള നിരോധനത്തിന്റെ വ്യാപ്തി
  choice: കടപ്പെട്ടിരിക്കരുത് എന്ന പ്രസ്താവന നേരിട്ട് നിലനിർത്തി, പരസ്പരസ്നേഹത്തെ തുടരുന്ന ഏക കടമയായി അവതരിപ്പിച്ചു.
  alternative: എല്ലാത്തരം വായ്പയെടുക്കലിനുമുള്ള സമ്പൂർണ നിരോധനമായി വ്യാഖ്യാനിക്കുക; അല്ലെങ്കിൽ ധാർമിക ബാധ്യതയുടെ രൂപകമായി മാത്രം ചുരുക്കുക.
  rationale: ഗ്രീക്ക് പാഠം കടം/ബാധ്യതയുടെ ഭാഷ ഉപയോഗിക്കുന്നുവെങ്കിലും സാമ്പത്തിക വായ്പയെക്കുറിച്ചുള്ള വിശാലമായ നൈതികവാദം തീർപ്പാക്കുന്നില്ല. അതിനാൽ പാഠത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷം പരിഹരിക്കാതെ സൂക്ഷിച്ചു.
- issue: νόμος എന്നതിന്റെ സൂചന
  choice: ‘ന്യായപ്രമാണം’ എന്ന് പരിഭാഷപ്പെടുത്തി.
  alternative: ‘നിയമം’ എന്നു പൊതുവായി പരിഭാഷപ്പെടുത്തുക.
  rationale: അടുത്ത വാക്യങ്ങളിലെ മോശൈക കല്പനകളുടെ പശ്ചാത്തലം ഇവിടെ നിർണായകമാണ്; എങ്കിലും നിറവേറ്റലിന്റെ സ്വഭാവത്തെക്കുറിച്ച് അധിക സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരിചിത ബൈബിൾപദം നിലനിർത്തിയപ്പോൾ ശേഷിക്കുന്ന വാക്യഘടന സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി രൂപപ്പെടുത്തി.
