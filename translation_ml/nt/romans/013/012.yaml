id: ROM.13.12
reference: Romans 13:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: ml
  text: രാത്രി ഏറെ കഴിഞ്ഞിരിക്കുന്നു[a]; പകൽ അടുത്തിരിക്കുന്നു. അതുകൊണ്ട് നമുക്ക് അന്ധകാരത്തിന്റെ പ്രവൃത്തികളെ ഉപേക്ഷിച്ച് വെളിച്ചത്തിന്റെ ആയുധസന്നാഹം[b] ധരിക്കാം.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘രാത്രി മുന്നേറിയിരിക്കുന്നു.’ ഗ്രീക്ക് ക്രിയ രാത്രി മുന്നോട്ടു നീങ്ങിയതായി ചിത്രീകരിക്കുന്നു; അതായത്, അതിന്റെ ഭൂരിഭാഗവും കഴിഞ്ഞിരിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘വെളിച്ചത്തിന്റെ ആയുധങ്ങൾ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: രാത്രി
  rationale: ‘പകൽ’ എന്നതിനോടുള്ള കാലസംബന്ധമായ രൂപകവൈരുധ്യം അതേപടി നിലനിർത്തുന്നു; ധാർമ്മിക അർഥം ‘അന്ധകാരം’ എന്ന തുടർന്നുള്ള പദം വ്യക്തമാക്കുന്നു.
- source_word: προέκοψεν
  choice: ഏറെ കഴിഞ്ഞിരിക്കുന്നു
  rationale: മുന്നേറുക/പുരോഗമിക്കുക എന്ന മൂലചിത്രം ഇവിടെ രാത്രി ഗണ്യമായി കടന്നുപോയെന്ന സ്വാഭാവിക മലയാളപ്രയോഗത്തിലൂടെ അറിയിക്കുന്നു; പൂർണമായി അവസാനിച്ചു എന്ന അതിവ്യാഖ്യാനം ഒഴിവാക്കുന്നു.
- source_word: ἡ ἡμέρα
  choice: പകൽ
  rationale: ‘രാത്രി’യോടുള്ള ദൃശ്യവും കാലസംബന്ധവുമായ വൈരുധ്യം സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἤγγικεν
  choice: അടുത്തിരിക്കുന്നു
  rationale: അടുത്തുവന്നതിന്റെ ഫലമായ ഇപ്പോഴത്തെ സമീപസ്ഥിതി സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പൂർണകാലത്തിന്റെ ആശയം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἀποβαλώμεθα
  choice: നമുക്ക് … ഉപേക്ഷിച്ച്
  rationale: ആഹ്വാനാത്മക ഉപയോക്തൃഭാവം ‘നമുക്ക്’ എന്നതിലൂടെ നൽകുന്നു. വസ്ത്രം ഊരിക്കളയുന്ന ചിത്രം ഭാഗികമായി മങ്ങുന്നുവെങ്കിലും മലയാളത്തിൽ പ്രവൃത്തികളോടൊപ്പം ‘ഉപേക്ഷിക്കുക’ കൂടുതൽ സ്വാഭാവികമാണ്; പിന്നാലെയുള്ള ‘ധരിക്കാം’ രൂപകത്തെ നിലനിർത്തുന്നു.
- source_word: τὰ ἔργα
  choice: പ്രവൃത്തികളെ
  rationale: പൗലോസിന്റെ ധാർമ്മിക പദപ്രയോഗത്തിനൊത്ത, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ സമാനപദം.
- source_word: τοῦ σκότους
  choice: അന്ധകാരത്തിന്റെ
  rationale: ധാർമ്മിക രൂപകത്തെ ‘തിന്മ’ എന്നു വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ അക്ഷരചിത്രം നിലനിർത്തുന്നു.
- source_word: ἐνδυσώμεθα
  choice: ധരിക്കാം
  rationale: ആഹ്വാനാത്മക അർഥവും വസ്ത്രധാരണരൂപകവും സംക്ഷിപ്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: τὰ ὅπλα
  choice: ആയുധവർഗം
  rationale: ὅπλα യുദ്ധോപകരണങ്ങളെയോ ആയുധങ്ങളെയോ സൂചിപ്പിക്കാം. ‘ധരിക്കുക’ എന്ന ക്രിയയോടൊപ്പം പ്രതിരോധോപകരണങ്ങൾ ഉൾപ്പെടെയുള്ള സമഗ്ര യുദ്ധസജ്ജീകരണം വ്യക്തമാക്കാൻ ‘ആയുധവർഗം’ തെരഞ്ഞെടുത്തു; ‘ആയുധങ്ങൾ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τοῦ φωτός
  choice: വെളിച്ചത്തിന്റെ
  rationale: അന്ധകാരത്തോടുള്ള ധാർമ്മികവും യുഗാന്ത്യപരവുമായ രൂപകവൈരുധ്യം വ്യാഖ്യാനിക്കാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: രാത്രി–പകൽ എന്ന യുഗാന്ത്യരൂപകം
  choice: ‘രാത്രി’, ‘പകൽ’ എന്നീ കാലരൂപങ്ങൾ അക്ഷരചിത്രമായി നിലനിർത്തി; അവയുടെ ധാർമ്മികവും രക്ഷാചരിത്രപരവുമായ സൂചന വ്യാഖ്യാനിക്കാതെ വിട്ടു.
  alternative: ‘ഈ അന്ധകാരയുഗം അവസാനിക്കാറായി; പുതിയ യുഗം അടുത്തു’ എന്ന വ്യാഖ്യാനപരമായ പരിഭാഷ.
  rationale: മൂലവാക്യത്തിലെ കാലപരവും ധാർമ്മികവുമായ ഇരട്ടസൂചന നിലനിർത്തുകയും പ്രത്യേക യുഗാന്ത്യവ്യാഖ്യാനം അടിച്ചേൽപ്പിക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- issue: ὅπλα τοῦ φωτός എന്നതിന്റെ പരിധി
  choice: പ്രതിരോധസജ്ജീകരണവും മറ്റു യുദ്ധോപകരണങ്ങളും ഉൾക്കൊള്ളാവുന്ന ‘വെളിച്ചത്തിന്റെ ആയുധവർഗം’.
  alternative: ‘വെളിച്ചത്തിന്റെ ആയുധങ്ങൾ’.
  rationale: ‘ധരിക്കുക’ എന്ന ക്രിയ ധരിക്കാവുന്ന യുദ്ധസജ്ജീകരണത്തെ അനുകൂലിക്കുന്നു; എന്നാൽ ὅπλα എന്ന പദത്തിന്റെ ‘ആയുധങ്ങൾ’ എന്ന സാധാരണ അർഥം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. രാത്രി/പകൽ, അന്ധകാരം/വെളിച്ചം എന്നീ സമാന്തരരൂപങ്ങൾ നിലനിർത്തി. ‘ആയുധവർഗം’ സാധാരണ വായനയിൽ ഗ്രഹിക്കാവുന്നതും ‘ധരിക്കുക’ എന്ന യുദ്ധസജ്ജീകരണരൂപകത്തോട് യോജിക്കുന്നതുമാണ്.
