  source_fidelity: '‘രാത്രി ഏറെ കഴിഞ്ഞിരിക്കുന്നു’ προέκοψεν എന്നതിന്റെ ‘വളരെയധികം കടന്നുപോയി/മുന്നേറി’ എന്ന ആശയം കൃത്യമായി നൽകുന്നു. ‘പകൽ അടുത്തിരിക്കുന്നു’ ἤγγικεν-ന്റെ ഇപ്പോഴത്തെ സമീപസ്ഥിതിയും നിലനിർത്തുന്നു. ‘അന്ധകാരത്തിന്റെ പ്രവൃത്തികളെ ഉപേക്ഷിച്ച്’ എന്നത് ആഹ്വാനാത്മക അർഥം നൽകുന്നുവെങ്കിലും ἀποβαλώμεθα-യിലെ വസ്ത്രം ഊരിക്കളയുന്ന ദൃശ്യം അല്പം മങ്ങുന്നു; എന്നിരുന്നാലും അർഥവ്യതിയാനം ഉണ്ടാക്കുന്നില്ല. മുഖ്യ തിരുത്തൽ ὅπλα-യുമായി ബന്ധപ്പെട്ടതാണ്: ‘ആയുധവർഗം’ എന്നത് ഗ്രീക്കിലെ സാധാരണ കൂട്ടായ യുദ്ധസജ്ജീകരണ/ആയുധാർഥത്തെ കൃത്യമായും സ്വാഭാവികമായും പ്രതിനിധീകരിക്കുന്നില്ല.'
