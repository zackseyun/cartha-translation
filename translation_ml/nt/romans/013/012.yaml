  terminology: ‘രാത്രി/പകൽ’, ‘അന്ധകാരം/വെളിച്ചം’, ‘പ്രവൃത്തികൾ’ എന്നിവ യോജിച്ചും സ്ഥിരതയോടെയും ഉപയോഗിച്ചിട്ടുണ്ട്. ‘വെളിച്ചത്തിന്റെ ആയുധസന്നാഹം’ ധരിക്കുക എന്നത് ὅπλα-യുടെ ‘armor/equipment’ സാധ്യതയെ തുറന്നുവയ്ക്കുന്നു; ‘വെളിച്ചത്തിന്റെ ആയുധങ്ങൾ’ എന്ന അടിക്കുറിപ്പ് അതിന്റെ സാധാരണ ‘weapons’ അർഥവും സംരക്ഷിക്കുന്നു.
