  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: ml
  text: നിന്റെ മക്കളിൽ ചിലരെയാണ്[a] സത്യത്തിൽ[b] നടക്കുന്നതായി ഞാൻ കണ്ടത്; നമുക്കു പിതാവിൽനിന്ന് ലഭിച്ച കല്പനപ്രകാരം തന്നെയാണ് അവർ നടക്കുന്നത്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിന്റെ മക്കളുടെ ഇടയിൽനിന്നുള്ള ചിലരെ.’ ഗ്രീക്ക് പ്രയോഗം എല്ലാവരെയും നിർബന്ധമായും ഉൾപ്പെടുത്താതെ ഒരു വിഭാഗത്തെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘സത്യത്തിൽ നടക്കുന്നു.’ ഈ പ്രയോഗം വെറും സത്യസന്ധതയെ മാത്രമല്ല, വെളിപ്പെടുത്തപ്പെട്ട സത്യത്തിനനുസരിച്ച് ജീവിക്കുന്നതിനെയും സൂചിപ്പിച്ചേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: അത്യന്തം സന്തോഷിച്ചു
  rationale: പൂർത്തിയായ സന്തോഷപ്രതികരണത്തെയും λίαν നൽകുന്ന ശക്തമായ ഊന്നലിനെയും സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ പ്രകടിപ്പിക്കുന്നു.
- source_word: εὕρηκα
  choice: കണ്ടെത്തിയതിൽ
  rationale: ഗ്രീക്കിലെ perfect രൂപത്തിന്റെ കണ്ടെത്തലും അതിന്റെ ഇപ്പോഴത്തെ പ്രസക്തിയും സന്ദർഭത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐκ τῶν τέκνων σου
  choice: നിന്റെ മക്കളിൽ ചിലർ
  rationale: ἐκ + genitive സൂചിപ്പിക്കുന്ന ഭാഗിക അർഥം വ്യക്തമാക്കുന്നു; എല്ലാവരെയും കുറിച്ചാണെന്ന് അതിരുകടന്ന് പറയുന്നില്ല.
- source_word: περιπατοῦντας
  choice: നടക്കുന്നതായി
  rationale: യോഹന്നാന്റെ ധാർമ്മിക ജീവിതത്തെ സൂചിപ്പിക്കുന്ന ‘നടക്കുക’ എന്ന രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: വെറും ആത്മാർഥതയെന്നതിലുപരി സത്യം നിർണയിക്കുന്ന ജീവിതമേഖലയെയോ മാനദണ്ഡത്തെയോ സൂചിപ്പിക്കാൻ കഴിയുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ തുറന്ന അർഥം നിലനിർത്തുന്നു.
- source_word: καθὼς
  choice: പ്രകാരംതന്നെ
  rationale: മക്കളുടെ നടത്തവും ലഭിച്ച കല്പനയും തമ്മിലുള്ള കൃത്യമായ പൊരുത്തം സൂചിപ്പിക്കുന്നു.
- source_word: ἐντολὴν ἐλάβομεν
  choice: നമുക്കു ലഭിച്ച കല്പന
  rationale: ἐντολήയുടെ യോഹന്നാനീയ ഭാരമുള്ള ‘കല്പന’ എന്ന അർഥവും ഒന്നാം പുരുഷ ബഹുവചനവും സംരക്ഷിക്കുന്നു.
- source_word: παρὰ τοῦ πατρός
  choice: പിതാവിൽനിന്ന്
  rationale: മൂലപാഠത്തിലുള്ള ‘പിതാവ്’ എന്ന പദവി വിശദീകരിച്ചു വികസിപ്പിക്കാതെ അതേപടി നിലനിർത്തുന്നു.
theological_decisions:
- issue: ‘പിതാവ്’ എന്നതിന്റെ പരാമർശം
  choice: പിതാവിൽനിന്ന്
  alternative: പിതാവായ ദൈവത്തിൽനിന്ന്
  rationale: ഗ്രീക്കിൽ ‘പിതാവ്’ എന്നുമാത്രമാണ്; ‘ദൈവം’ ചേർക്കാതെ യോഹന്നാനീയ പദവി സംരക്ഷിക്കുന്നു.
- issue: ‘നിന്റെ മക്കൾ’ എന്നതിന്റെ വ്യാപ്തി
  choice: നിന്റെ മക്കളിൽ ചിലർ
  alternative: നിന്റെ മക്കൾ
  rationale: ഭാഗികമായ ἐκ പ്രയോഗം ചിലരെയാണു വ്യക്തമാക്കുന്നത്; എല്ലാവരെയും കുറിച്ചുള്ള അവകാശവാദം പാഠം ഉന്നയിക്കുന്നില്ല.
- issue: ἐν ἀληθείᾳ എന്ന പ്രയോഗത്തിന്റെ അർഥം
  choice: സത്യത്തിൽ
  alternative: സത്യസന്ധമായി
  rationale: വെറും ആത്മാർഥതയായി ചുരുക്കാതെ, വെളിപ്പെടുത്തപ്പെട്ട സത്യത്തിനനുസരിച്ചുള്ള ജീവിതമെന്ന സാധ്യതയും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന മാന്യമായ മലയാളം. ‘നടക്കുക’ എന്ന ബൈബിളിലെ ധാർമ്മിക രൂപകം നിലനിർത്തി; ഭാഗികതയും ദൈവശാസ്ത്രപരമായ തുറന്ന അർഥവും അടച്ചുപൂട്ടിയിട്ടില്ല.
