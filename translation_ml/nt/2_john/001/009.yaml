id: 2JN.1.9
reference: 2 John 1:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: ml
  text: മശീഹായുടെ ഉപദേശത്തിൽ നിലനിൽക്കാതെ മുന്നോട്ടുപോകുന്ന[a] ഏവനും ദൈവം അവനില്ല. ആ ഉപദേശത്തിൽ[b] നിലനിൽക്കുന്നവന് പിതാവും പുത്രനും അവനുണ്ട്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മുന്നോട്ടുപോകുന്ന’ എന്നതിന് ‘വളരെ മുന്നോട്ടുപോകുന്ന’ അല്ലെങ്കിൽ ‘മുന്നേറിപ്പോകുന്ന’ എന്നും പരിഭാഷപ്പെടുത്താം; ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ലംഘിക്കുന്ന’ എന്നാണ്.
    reason: textual_variant
  - marker: b
    text: ‘മശീഹായുടെ ഉപദേശം’ എന്നത് മശീഹാ നൽകിയ ഉപദേശത്തെയോ മശീഹായെക്കുറിച്ചുള്ള ഉപദേശത്തെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: അതിനെ മറികടന്ന് മുന്നോട്ടുപോകുന്ന ഏവനും
  rationale: πᾶς + articular participle എന്ന ഘടനയുടെ പൊതുവായ ‘ഏവനും’ എന്ന അർഥം നിലനിർത്തുന്നു. προάγων എന്നതിലെ മുന്നോട്ടുപോകുന്ന രൂപകം സൂക്ഷിക്കുമ്പോൾ, സന്ദർഭത്തിൽ ഉപദേശത്തിന്റെ പരിധി കടക്കുന്നതെന്ന പ്രതികൂല സൂചന ‘മറികടന്ന്’ വ്യക്തമാക്കുന്നു; പാഠഭേദമായ ‘ലംഘിക്കുന്ന’ എന്ന അർഥം മുഖ്യപാഠത്തിൽ ഇറക്കുമതി ചെയ്യുന്നില്ല.
- source_word: μὴ μένων
  choice: നിലനിൽക്കാതെ
  rationale: യോഹന്നാന്റെ രചനകളിലെ μένω എന്ന പ്രധാന ക്രിയയുടെ തുടരുക/വസിക്കുക/നിലനിൽക്കുക എന്ന ഭാവം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ സൂക്ഷിക്കുന്നു.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: മശീഹായുടെ ഉപദേശത്തിൽ
  rationale: διδαχή എന്നത് സഭാപരമായ ‘സിദ്ധാന്തം’ എന്നതിനെക്കാൾ പൊതുവായും വായനാസൗഹൃദമായും ‘ഉപദേശം’ എന്നു പരിഭാഷപ്പെടുത്തി. Χριστός എന്ന പദവി ‘മശീഹാ’ എന്നു നൽകി. ജനിറ്റീവിലുള്ള ഉറവിടം/വിഷയം എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: θεὸν οὐκ ἔχει
  choice: ദൈവത്തെ ഉള്ളവനല്ല
  rationale: ഗ്രീക്കിലെ കടുപ്പമുള്ള ‘ദൈവത്തെ ഇല്ല/ഉള്ളവനല്ല’ എന്ന പ്രസ്താവനയെ ‘ദൈവവുമായി കൂട്ടായ്മയില്ല’ എന്നു വ്യാഖ്യാനിച്ചു വികസിപ്പിക്കാതെ സൂക്ഷിക്കുന്നു.
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: ആ ഉപദേശത്തിൽ നിലനിൽക്കുന്നവൻ
  rationale: ആദ്യ ഉപവാക്യവുമായി ഉള്ള സമാന്തരതയും μένω എന്ന ക്രിയയുടെ ആവർത്തനവും നിലനിർത്തുന്നു. ‘ആ’ എന്നത് മുമ്പ് പറഞ്ഞ മശീഹായുടെ ഉപദേശത്തെ സ്വാഭാവികമായി തിരിച്ചുചൂണ്ടുന്നു.
- source_word: οὗτος
  choice: -വനോ … -വനാണ്
  rationale: മലയാളത്തിലെ വിരുദ്ധഊന്നൽ നൽകുന്ന ‘-ഓ’യും നിർണ്ണായകമായ ‘ആണ്’യും ചേർന്ന് οὗτος എന്നതിന്റെ ഊന്നൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു; കൃത്രിമമായ ‘ഇവൻ തന്നെയാണ്’ ഒഴിവാക്കുന്നു.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: പിതാവിനെയും പുത്രനെയും ഉള്ളവനാണ്
  rationale: καὶ…καὶ എന്ന സമാന്തരബന്ധം ‘-നെയും…-നെയും’ വഴി സൂക്ഷിക്കുകയും വ്യക്തിപരമായ ‘പിതാവ്’, ‘പുത്രൻ’ എന്നീ ശീർഷകങ്ങൾ നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: προάγων എന്ന പദത്തിന്റെ സന്ദർഭാർഥവും പാഠഭേദവും
  choice: ‘അതിനെ മറികടന്ന് മുന്നോട്ടുപോകുന്ന’ എന്നു പരിഭാഷപ്പെടുത്തി
  alternative: ‘വളരെ മുന്നോട്ടുപോകുന്ന’, ‘മുന്നേറിപ്പോകുന്ന’, അല്ലെങ്കിൽ ചില കൈയെഴുത്തുപ്രതികളനുസരിച്ച് ‘ലംഘിക്കുന്ന’
  rationale: SBLGNTയിലെ προάγων എന്ന വായനയാണ് മുഖ്യപാഠത്തിന് അടിസ്ഥാനം. മുന്നോട്ടുപോകുന്ന രൂപകവും ഉപദേശത്തിന്റെ അതിരു കടക്കുന്ന പ്രതികൂല സന്ദർഭവും ഒരുമിച്ച് സൂക്ഷിച്ചു; παραβαίνων എന്ന പാഠഭേദത്തെ മുഖ്യപാഠമാക്കിയില്ല.
- issue: ‘മശീഹായുടെ ഉപദേശം’ എന്ന ജനിറ്റീവ് ഘടനയുടെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘മശീഹായുടെ ഉപദേശം’ എന്ന ചുരുക്കരൂപം നിലനിർത്തി
  alternative: ‘മശീഹാ നൽകിയ ഉപദേശം’ അല്ലെങ്കിൽ ‘മശീഹായെക്കുറിച്ചുള്ള ഉപദേശം’
  rationale: τοῦ Χριστοῦ എന്ന ജനിറ്റീവ് ഉപദേശത്തിന്റെ ഉറവിടത്തെയോ വിഷയത്തെയോ സൂചിപ്പിക്കാം. ഇരു സാധ്യതകളും ദൈവശാസ്ത്രപരമായി പ്രസക്തമായതിനാൽ ഒന്നിനെ മാത്രം നിർബന്ധിച്ചില്ല.
- issue: Χριστός എന്ന പദവി
  choice: മശീഹാ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός പദവിയായി പ്രവർത്തിക്കുന്നതിനാൽ അതിന്റെ അർഥം വ്യക്തമാക്കുന്ന ‘മശീഹാ’ ഉപയോഗിച്ചു.
- issue: θεὸν οὐκ ἔχει എന്ന ബന്ധഭാഷ
  choice: ‘ദൈവത്തെ ഉള്ളവനല്ല’ എന്ന നേരിട്ടുള്ള രൂപം
  alternative: ‘ദൈവവുമായി കൂട്ടായ്മയില്ല’
  rationale: കൂട്ടായ്മ എന്ന ആശയം സന്ദർഭത്തിൽ ഉൾക്കൊള്ളാമെങ്കിലും ഗ്രീക്ക് വാചകത്തിൽ അത് തുറന്നുപറയുന്നില്ല. യോഹന്നാന്റെ ഉദ്ദേശപൂർവമായ കടുപ്പവും ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. ‘ഉപദേശം’, ‘നിലനിൽക്കുക’ എന്നീ പദങ്ങൾ യോഹന്നാന്റെ ആവർത്തനവും സമാന്തരതയും സൂക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
