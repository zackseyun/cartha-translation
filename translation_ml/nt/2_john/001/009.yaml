revisions:
- from: മശീഹായുടെ ഉപദേശത്തിൽ നിലനിൽക്കാതെ അതിനെ മറികടന്ന് മുന്നോട്ടുപോകുന്ന ഏവനും ദൈവത്തെ ഉള്ളവനല്ല[a]. ആ ഉപദേശത്തിൽ നിലനിൽക്കുന്നവനോ പിതാവിനെയും പുത്രനെയും ഉള്ളവനാണ്[b].
  to: മശീഹായുടെ ഉപദേശത്തിൽ നിലനിൽക്കാതെ മുന്നോട്ടുപോകുന്ന[a] ഏവനും ദൈവം അവനില്ല. ആ ഉപദേശത്തിൽ[b] നിലനിൽക്കുന്നവന് പിതാവും പുത്രനും അവനുണ്ട്.
