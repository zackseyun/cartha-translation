id: 2JN.1.10
reference: 2 John 1:10
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: ml
  text: ആരെങ്കിലും നിങ്ങളുടെ അടുക്കൽ വന്ന് ഈ ഉപദേശം കൊണ്ടുവരുന്നില്ലെങ്കിൽ, അയാളെ നിങ്ങളുടെ വീട്ടിൽ സ്വീകരിക്കരുത്; അയാളെ അഭിവാദ്യം ചെയ്യരുത്.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, “അയാൾക്ക് ‘അഭിവാദ്യം’ എന്നു പറയരുത്” എന്നാണ്.
    reason: lexical_alternative
  - marker: b
    text: സന്ദർഭത്തിൽ, “ഈ ഉപദേശം” കൊണ്ടുവരാത്ത ഒരാളെക്കുറിച്ചാണ് മുന്നറിയിപ്പ്—ചുറ്റുമുള്ള വാക്യങ്ങളിൽ വിവരിക്കുന്ന അപ്പൊസ്തലിക വിശ്വാസസമ്മതത്തിൽനിന്ന് വ്യത്യസ്തമായ സന്ദേശവുമായി വരുന്ന ഒരു സഞ്ചാരി ഉപദേശകനായിരിക്കാം.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: ആരെങ്കിലും … ചെയ്താൽ
  rationale: അനിശ്ചിതവും പൊതുവുമായ വ്യവസ്ഥയെ സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വരികയും
  rationale: സ്വീകർത്താക്കളിലേക്കുള്ള വരവ് നേരിട്ട് പ്രകടിപ്പിക്കുന്നു; സഭാപരമായ കൂടുതൽ അർഥം വാചകത്തിൽ ചേർക്കുന്നില്ല.
- source_word: ταύτην τὴν διδαχήν
  choice: ഈ ഉപദേശം
  rationale: διδαχή എന്നതിന്റെ പഠിപ്പിക്കൽ/ഉപദേശം എന്ന അർഥം ആധുനികവും ഗൗരവമുള്ളതുമായ മലയാളത്തിൽ നൽകുകയും സൂചകമായ ‘ഈ’ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: οὐ φέρει
  choice: കൊണ്ടുവരാതിരിക്കുകയും
  rationale: ഒരു ഉപദേശം കൊണ്ടുവരുക എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ രൂപവും സന്ദർഭാർഥവും സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: അയാളെ നിങ്ങളുടെ വീട്ടിൽ സ്വീകരിക്കരുത്
  rationale: λαμβάνωയുടെ സ്വീകരിക്കുക എന്ന വിശാലതയും οἰκίαയുടെ അതിഥിസൽക്കാരസന്ദർഭവും അതിരുകടന്ന് വ്യാഖ്യാനിക്കാതെ നൽകുന്നു.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: അയാൾക്ക് അഭിവാദ്യം പറയുകയും അരുത്
  rationale: ‘അയാളോട് സന്തോഷിക്ക എന്നു പറയരുത്’ എന്ന ഗ്രീക്ക് ഘടനയുടെ ആശയം, വെറും ‘അഭിവാദ്യം ചെയ്യരുത്’ എന്നതിനെക്കാൾ ഉറവിടരൂപത്തോട് അടുത്തും മലയാളത്തിൽ മനസ്സിലാകുന്നതുമായ രീതിയിൽ നൽകുന്നു.
theological_decisions:
- issue: തെറ്റായ ഉപദേശം കൊണ്ടുവരുന്നയാളോടുള്ള വിലക്കിന്റെ വ്യാപ്തി
  choice: ഈ ഉപദേശം കൊണ്ടുവരാത്തയാളെ വീട്ടിൽ സ്വീകരിക്കരുതെന്നും അയാൾക്ക് അഭിവാദ്യം പറയരുതെന്നും ഉള്ള മൂർത്തമായ ഭാഷ നിലനിർത്തി.
  alternative: എല്ലാത്തരം സാമൂഹിക സമ്പർക്കത്തിനുമുള്ള സമ്പൂർണ വിലക്കായി വികസിപ്പിക്കുക; അല്ലെങ്കിൽ സഭയിലെ അധ്യാപകനായി ഔദ്യോഗികമായി സ്വീകരിക്കുന്നതിലേക്കു മാത്രം ചുരുക്കുക.
  rationale: സന്ദർഭം സഞ്ചാരി ഉപദേശകരെയും അപ്പൊസ്തലിക സാക്ഷ്യത്തോടുള്ള വിശ്വസ്തതയെയും സൂചിപ്പിക്കാം; എങ്കിലും ഗ്രീക്ക് വാചകം പ്രയോഗത്തിന്റെ കൃത്യമായ അതിരുകൾ നിർവചിക്കുന്നില്ല. അതിനാൽ ആ വ്യാഖ്യാനതീവ്രത നിലനിർത്തുന്നു.
- issue: αὐτόν / αὐτῷ എന്ന ഏകവചന പുല്ലിംഗ സർവനാമങ്ങൾ
  choice: അയാളെ / അയാൾക്ക്
  alternative: അവരെ / അവർക്ക്
  rationale: മലയാളത്തിൽ ആദരസൂചക ബഹുവചനം ഉപയോഗിച്ചാൽ ഉറവിടത്തിലെ ഏകവചനരൂപം മറയാം; ‘അയാൾ’ വ്യക്തിയെ ഏകവചനത്തിൽ വ്യക്തമാക്കുന്നു, എന്നാൽ അവഹേളനഭാവം ഉദ്ദേശിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ഉപദേശം,’ ‘സ്വീകരിക്കുക,’ ‘അഭിവാദ്യം പറയുക’ എന്നീ പദങ്ങൾ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതും ഉറവിടത്തിന്റെ രൂപത്തോട് ആവശ്യത്തിന് അടുത്തതുമാണ്. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യവാചകത്തിൽ ചേർത്തിരിക്കുന്നു.
