id: 2JN.1.5
reference: 2 John 1:5
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: ml
  text: 'ഇപ്പോൾ, വനിതേ, ഞാൻ നിന്നോടു അപേക്ഷിക്കുന്നു: നിനക്കു പുതിയൊരു കല്പന എഴുതുന്നതുപോലെയല്ല, ആദിമുതൽ നമുക്കുണ്ടായിരുന്ന കല്പന എഴുതുന്നതുപോലെ—നാം പരസ്പരം സ്നേഹിക്കണം.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶ
  choice: അപേക്ഷിക്കുന്നു
  rationale: ഇവിടെ ἐρωτάω വിനയപൂർവമായ അഭ്യർഥനയെ സൂചിപ്പിക്കുന്നു; ‘അപേക്ഷിക്കുന്നു’ കത്തിന്റെ സ്വരം നിലനിർത്തുകയും ‘നിർബന്ധിക്കുന്നു’ എന്നതിലധികം ശക്തി ചേർക്കാതിരിക്കുകയും ചെയ്യുന്നു.
- source_word: κυρία
  choice: പ്രിയ വനിതേ
  rationale: κυρία എന്ന സംബോധനത്തിന്റെ അടിസ്ഥാന അർഥം ‘വനിതേ/നാഥേ’ എന്നാണ്. മലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ സംബോധനത്തിനായി ‘പ്രിയ വനിതേ’ ഉപയോഗിച്ചു; ഇതിനെ സഭയെന്നോ വ്യക്തിനാമമെന്നോ മുഖ്യവാചകത്തിൽ തീർപ്പാക്കിയിട്ടില്ല.
- source_word: ἐντολὴν καινὴν
  choice: ഒരു പുതിയ കല്പന
  rationale: യോഹന്നാനീയ രചനകളിലെ പ്രയോഗബന്ധം നിലനിർത്തുന്ന നേരിട്ടുള്ള പരിഭാഷയാണ്.
- source_word: γράφων σοι
  choice: നിനക്ക് എഴുതുന്നതുപോലെ
  rationale: οὐχ ὡς ... ἀλλά എന്ന താരതമ്യഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἣν εἴχομεν
  choice: നമുക്കുണ്ടായിരുന്ന കല്പന
  rationale: അപൂർണഭൂതകാലരൂപത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; ἀπ’ ἀρχῆς എന്ന പ്രയോഗത്തോടൊപ്പം പണ്ടുമുതൽ ലഭിച്ചിരുന്ന കല്പനയെ സൂചിപ്പിക്കുന്നു.
- source_word: ἀπ’ ἀρχῆς
  choice: ആദിമുതൽ
  rationale: യോഹന്നാനീയ സാഹിത്യത്തിലെ ആവർത്തിതമായ ‘ആദിമുതൽ’ എന്ന ആശയം സംക്ഷിപ്തമായും സ്വാഭാവികമായും നിലനിർത്തുന്നു.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: നാം പരസ്പരം സ്നേഹിക്കണം
  rationale: ἵνα സഹിതമുള്ള ഉപവാക്യം കല്പനയുടെ ഉള്ളടക്കമായി വായിക്കപ്പെടുന്നു; ‘സ്നേഹിക്കണം’ അതിന്റെ പ്രബോധനാത്മക ഭാവം സ്വാഭാവിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: κυρία എന്നതിന്റെ സൂചിതവ്യക്തി
  choice: മുഖ്യവാചകത്തിൽ ‘വനിതേ’ എന്നു പരിഭാഷപ്പെടുത്തി സൂചിതവ്യക്തിയെ നിർണയിക്കാതെ വിടുന്നു.
  alternative: ഇത് ഒരു പ്രാദേശിക സഭയുടെ പ്രതീകാത്മക സംബോധനമെന്നോ ‘കുറിയ’ എന്ന വ്യക്തിനാമമെന്നോ വ്യാഖ്യാനിക്കുക.
  rationale: ഗ്രീക്ക് പദം ഈ വ്യാഖ്യാനസാധ്യതകൾ അനുവദിക്കുന്നുവെങ്കിലും അവയിൽ ഒന്നിനെ നിർബന്ധിക്കുന്നില്ല; അതിനാൽ യഥാർഥമായ അനിശ്ചിതത്വം പരിഭാഷയിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും കത്തുരൂപത്തിന് യോജിച്ചതുമായ ശൈലി. ‘പ്രിയ’ എന്നത് മലയാളത്തിലെ സ്വാഭാവിക സംബോധനത്തിനായി ചേർത്തതാണെങ്കിലും κυρίαയുടെ വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
