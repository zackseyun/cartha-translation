source:
  edition: SBLGNT
  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: ml
  text: ഞങ്ങൾ അധ്വാനിച്ചു നേടിയതു നിങ്ങൾ നഷ്ടപ്പെടുത്താതിരിക്കാനും പൂർണമായ പ്രതിഫലം ലഭിക്കാനും നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുവിൻ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “ഞങ്ങൾ അധ്വാനിച്ചു നേടിയതു” എന്നതിനുപകരം “നിങ്ങൾ അധ്വാനിച്ചു നേടിയതു” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: നിങ്ങൾ നിങ്ങളെത്തന്നെ സൂക്ഷിച്ചുകൊള്ളുക
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞ തുടർച്ചയായ ജാഗ്രത ആവശ്യപ്പെടുന്നു. പ്രതിഫലന സർവനാമം മുന്നറിയിപ്പ് വായനക്കാരോടുതന്നെയാണെന്നത് നിലനിർത്തുന്നു.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: അങ്ങനെ ... നിങ്ങൾ നഷ്ടപ്പെടുത്താതെ
  rationale: ἵναയും നിഷേധത്തോടുകൂടിയ aorist subjunctive-ഉം ഒഴിവാക്കേണ്ട ഫലമോ ലക്ഷ്യമോ സൂചിപ്പിക്കുന്നു. ഈ സന്ദർഭത്തിൽ ἀπόλλυμι എന്നത് നശിപ്പിക്കുക എന്നതിലുപരി കൈവരിച്ച ഫലം നഷ്ടപ്പെടുത്തുക എന്നാണ്.
- source_word: ἃ εἰργασάμεθα
  choice: ഞങ്ങൾ അധ്വാനിച്ചുണ്ടാക്കിയതു
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിലെ ഒന്നാംപുരുഷ ബഹുവചനമായ εἰργασάμεθα നിലനിർത്തുന്നു. perfect രൂപം മുൻ അധ്വാനവും ഇപ്പോഴും പ്രസക്തമായ അതിന്റെ ഫലവും സൂചിപ്പിക്കുന്നു.
- source_word: μισθὸν πλήρη
  choice: പൂർണമായ പ്രതിഫലം
  rationale: ആത്മീയ പ്രബോധനത്തിന്റെ പശ്ചാത്തലത്തിൽ μισθός-ന് ‘കൂലി’യെക്കാൾ ‘പ്രതിഫലം’ സ്വാഭാവികമാണ്; πλήρη അതിന്റെ പൂർണത ഊന്നിപ്പറയുന്നു.
- source_word: ἀπολάβητε
  choice: പ്രാപിക്കട്ടെ
  rationale: സമാന്തരമായ aorist subjunctive-ന്റെ ഉദ്ദേശ്യ/ഫലഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു. ‘തിരികെ ലഭിക്കുക’ എന്ന സാധ്യതയുള്ള സൂക്ഷ്മഭാവം ഇവിടെ നിർബന്ധിതമല്ല.
theological_decisions:
- issue: εἰργασάμεθα എന്ന ക്രിയയുടെ കർത്താവ്
  choice: ഞങ്ങൾ അധ്വാനിച്ചുണ്ടാക്കിയതു
  alternative: നിങ്ങൾ അധ്വാനിച്ചുണ്ടാക്കിയതു
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം ഒന്നാംപുരുഷ ബഹുവചനമാണ്; അതിനാൽ അപ്പൊസ്തോലിക ശുശ്രൂഷകർ അധ്വാനിച്ചുണ്ടാക്കിയ ഫലം വായനക്കാർ നഷ്ടപ്പെടുത്തരുതെന്ന അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു. വായനക്കാരുടെ സ്വന്തം അധ്വാനത്തിലേക്കു ശ്രദ്ധ മാറ്റുന്ന രണ്ടാംപുരുഷ പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള ശൈലി. ‘സൂക്ഷിച്ചുകൊള്ളുക’ തുടർച്ചയായ ജാഗ്രതയുടെ ആജ്ഞാഭാവവും ‘പ്രതിഫലം’ μισθός എന്ന പദത്തിന്റെ സന്ദർഭോചിത അർഥവും നൽകുന്നു.
