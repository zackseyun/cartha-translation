id: 2JN.1.6
reference: 2 John 1:6
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: ml
  text: 'സ്നേഹം എന്നത് ഇതാണ്: നാം അവന്റെ കല്പനകൾ അനുസരിച്ച് നടക്കണം. ഇതാണ് ആ കല്പന[a]: ആദിമുതൽ നിങ്ങൾ കേട്ടതുപോലെ, നിങ്ങൾ അതിൽ നടക്കണം.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ സ്നേഹത്തിൽ നടക്കണം.” ‘അതിൽ’ എന്ന സർവനാമം ‘കല്പന’യ്ക്കു പകരം ‘സ്നേഹം’ എന്നതിനെ സൂചിപ്പിക്കുന്നതാകാം.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: സ്നേഹം
  rationale: യോഹന്നാന്റെ രചനകളിലെ പ്രയോഗവുമായി പദബന്ധം നിലനിർത്തുന്ന, ആധുനിക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ തത്തുല്യം.
- source_word: ἵνα περιπατῶμεν
  choice: നാം ... നടക്കണം
  rationale: ഇവിടെ ἵνα സ്നേഹം പ്രായോഗികമായി എന്താണെന്നതിന്റെ ഉള്ളടക്കം വിശദീകരിക്കുന്നു. മലയാളത്തിൽ സ്വാഭാവികമായി ബാധ്യതയും ആഹ്വാനവും പ്രകടമാക്കുന്നു.
- source_word: περιπατέω
  choice: നടക്കുക
  rationale: ധാർമ്മിക ജീവിതത്തെ സൂചിപ്പിക്കുന്ന യോഹന്നാനീയ രൂപകം പരത്തിവ്യാഖ്യാനിക്കാതെ സൂക്ഷിക്കുന്നു; വാക്യത്തിലെ ആവർത്തനവും നിലനിർത്തുന്നു.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: അവന്റെ കല്പനകൾ അനുസരിച്ച്
  rationale: κατάയുടെ അനുരൂപത/അനുസരണം എന്ന അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ബഹുവചനം സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: ἐντολάς / ἐντολή
  choice: കല്പനകൾ / കല്പന
  rationale: ഒരേ മൂലപദത്തിന്റെ ബഹുവചനത്തിൽനിന്ന് ഏകവചനത്തിലേക്കുള്ള ശ്രദ്ധേയമായ മാറ്റം നിലനിർത്തുന്നു.
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: ഇതാണ് ആ കല്പന
  rationale: ഗ്രീക്കിൽ ഉടമസ്ഥസർവനാമമില്ലാത്തതിനാൽ ‘അവന്റെ കല്പന’ എന്ന് ചേർക്കുന്നില്ല. നിർദ്ദിഷ്ട ഏകവചനമായ ἡ ἐντολήയെ ‘ആ കല്പന’ എന്നു സ്വാഭാവികമായി പ്രതിഫലിപ്പിക്കുന്നു.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: നിങ്ങൾ ആദിമുതൽ കേട്ടതുപോലെ
  rationale: യോഹന്നാനീയമായ ‘ആദിമുതൽ’ എന്ന പ്രയോഗവും ἠκούσατεയുടെ ഭൂതകാല അർഥവും സംരക്ഷിക്കുന്നു.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: നിങ്ങൾ അതിൽ നടക്കണം
  rationale: സ്ത്രീലിംഗ ഏകവചന സർവനാമത്തിന്റെ അവ്യക്തതയും ‘നടക്കുക’ എന്ന രൂപകവും വ്യാഖ്യാനവികാസമില്ലാതെ നിലനിർത്തുന്നു.
theological_decisions:
- issue: അവസാന ഉപവാക്യത്തിലെ αὐτῇ എന്ന സർവനാമത്തിന്റെ പൂർവപദം
  choice: തൊട്ടുമുമ്പുള്ള ഏകവചനമായ ‘കല്പന’യെ സൂചിപ്പിക്കുന്നതായി മുഖ്യപാഠത്തിൽ ‘അതിൽ’ എന്നു നൽകി
  alternative: ആദ്യ ഉപവാക്യത്തിലെ ‘സ്നേഹം’ എന്നതിനെ സൂചിപ്പിച്ച് ‘സ്നേഹത്തിൽ നടക്കണം’ എന്നും മനസ്സിലാക്കാം
  rationale: വ്യാകരണപരമായി ഏറ്റവും അടുത്ത സ്ത്രീലിംഗ ഏകവചന പൂർവപദം ἐντολή ആണ്. എന്നാൽ ἀγάπηയും സ്ത്രീലിംഗ ഏകവചനമാണ്; ആശയപരമായ ബന്ധവും ശക്തമാണ്. അതിനാൽ അവ്യക്തത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ ലളിതവും മാന്യവുമായ ശൈലി. ‘നടക്കുക’ എന്ന ആവർത്തിത ധാർമ്മിക രൂപകവും ‘കല്പനകൾ/കല്പന’ എന്ന ബഹുവചന-ഏകവചന വ്യത്യാസവും സൂക്ഷിച്ചിരിക്കുന്നു. അടിക്കുറിപ്പ് ചിഹ്നം മുഖ്യപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
