revisions:
- from: വഞ്ചകരായ പലരും ലോകത്തിലേക്കു പുറപ്പെട്ടിരിക്കുന്നു. മനുഷ്യശരീരത്തിൽ വരുന്ന യേശുവാണ് മശീഹയെന്ന് അവർ ഏറ്റുപറയുന്നില്ല.[a] ഇങ്ങനെയുള്ളവനാണ് വഞ്ചകനും എതിർമശീഹയും.
  to: എന്തെന്നാൽ, അനേകം വഞ്ചകർ ലോകത്തിലേക്കു പുറപ്പെട്ടിരിക്കുന്നു—ജഡത്തിൽ വരുന്ന യേശു മശീഹയെ ഏറ്റുപറയാത്തവർ.[a] ഇങ്ങനെയുള്ളവനാണ് വഞ്ചകനും അന്തിക്രിസ്തുവും.
  rationale: The revision restores the causal connection, makes Jesus the Messiah—rather than Messiahhood—the object of the denied confession, preserves the present participial wording without forcing a completed-past interpretation, and uses established Malayalam terminology for ‘antichrist.’
