id: 2JN.1.7
reference: 2 John 1:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: ml
  text: എന്തെന്നാൽ, അനേകം വഞ്ചകർ ലോകത്തിലേക്കു പുറപ്പെട്ടിരിക്കുന്നു—ജഡത്തിൽ വരുന്ന യേശു മശീഹയെ ഏറ്റുപറയാത്തവർ.[a] ഇങ്ങനെയുള്ളവനാണ് വഞ്ചകനും അന്തിക്രിസ്തുവും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ഗ്രീക്കിൽ ‘ജഡത്തിൽ വരുന്ന യേശു മശീഹയെ’ എന്നാണ്; ‘വരുന്ന’ എന്നത് വർത്തമാന കൃതന്തരൂപമാണ്. ‘ജഡത്തിൽ’ ഇവിടെ യഥാർഥ മനുഷ്യദേഹധാരണത്തെയാണ് സൂചിപ്പിക്കുന്നത്. ‘ജഡത്തിൽ വന്ന’ എന്ന വിവർത്തനവും കാണപ്പെടുന്നു.
    reason: ἐρχόμενον എന്ന വർത്തമാന കൃതന്തരൂപത്തിന്റെ വിവർത്തനസാധ്യതയും ἐν σαρκίയുടെ ഈ സന്ദർഭത്തിലെ അർഥവും വ്യക്തമാക്കുന്നു.
lexical_decisions:
- source_word: ὅτι
  choice: കാരണം എന്ന ബന്ധം പ്രത്യേക പദമില്ലാതെ വാക്യബന്ധത്തിലൂടെ സൂചിപ്പിച്ചു
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ ജാഗ്രതയ്ക്കുള്ള കാരണം നൽകുന്നു; മലയാളത്തിൽ സ്വതന്ത്രമായി ഉദ്ധരിക്കുമ്പോൾ കൃത്രിമമായ തുടക്കം ഒഴിവാക്കാൻ വിശദീകരണബന്ധം സ്വാഭാവിക വാക്യക്രമത്തിലൂടെ നിലനിർത്തുന്നു.
- source_word: πολλοὶ πλάνοι
  choice: വഞ്ചകരായ പലരും
  rationale: πλάνος ഇവിടെ സ്വയം തെറ്റിയവരെ മാത്രമല്ല, മറ്റുള്ളവരെ വഴിതെറ്റിക്കുന്നവരെയാണ് സൂചിപ്പിക്കുന്നത്.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: ലോകത്തിലേക്കു പുറപ്പെട്ടിരിക്കുന്നു
  rationale: പൊതുരംഗത്തിലേക്കുള്ള അവരുടെ വ്യാപനം സൂചിപ്പിക്കുകയും അഒറിസ്റ്റിന്റെ ഫലം ഇപ്പോഴും പ്രസക്തമാണെന്ന ഭാവം സ്വാഭാവിക മലയാളത്തിൽ നൽകുകയും ചെയ്യുന്നു.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: അവർ ഏറ്റുപറയുന്നില്ല
  rationale: ὁμολογέωയുടെ തുറന്നുപറയുന്ന/വിശ്വാസം സമ്മതിക്കുന്ന ഭാവം ‘ഏറ്റുപറയുക’ നിലനിർത്തുന്നു.
- source_word: Ἰησοῦν Χριστόν
  choice: യേശുവാണ് മശീഹ
  rationale: Χριστός ഇവിടെ യേശുവിന്റെ പദവിയെക്കുറിച്ചുള്ള ഏറ്റുപറച്ചിലിന്റെ ഭാഗമായതിനാൽ പേരുപോലെ ‘ക്രിസ്തു’ എന്നതിനെക്കാൾ പദവിയായ ‘മശീഹ’ അനുയോജ്യം.
- source_word: ἐρχόμενον ἐν σαρκί
  choice: മനുഷ്യശരീരത്തിൽ വരുന്ന
  rationale: വർത്തമാന കൃതന്തമായ ἐρχόμενον എന്ന രൂപം ‘വരുന്ന’ എന്നു നിലനിർത്തുന്നു; ἐν σαρκί യഥാർഥമായ ദേഹധാരണയെ സൂചിപ്പിക്കുന്നതിനാൽ സാധാരണ വായനക്കാർക്കു വ്യക്തമായ ‘മനുഷ്യശരീരത്തിൽ’ തിരഞ്ഞെടുത്തു.
- source_word: οὗτός ἐστιν ὁ πλάνος
  choice: ഇങ്ങനെയുള്ളവനാണ് വഞ്ചകൻ
  rationale: മുൻപുള്ള ബഹുവചനവിവരണത്തിൽപ്പെടുന്ന ഓരോ വ്യക്തിയെയും ഏകവചനത്തിൽ മാതൃകയായി ചൂണ്ടിക്കാണിക്കുന്ന οὗτος എന്നതിന്റെ ബലം നിലനിർത്തുന്നു.
- source_word: ὁ ἀντίχριστος
  choice: എതിർമശീഹ
  rationale: ἀντίχριστος എന്ന പദത്തിലെ മശീഹാവിരോധത്തിന്റെ അർഥം സുതാര്യമായി നൽകുന്നു; പരിചിതമായ ‘അന്തിക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
theological_decisions:
- issue: Χριστός എന്ന പദത്തിന്റെ വിവർത്തനം
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ യേശുവിന്റെ മശീഹാപദവിയാണ് ഏറ്റുപറച്ചിലിന്റെ ഉള്ളടക്കമായി മുൻനിൽക്കുന്നത്; അതിനാൽ പദവിയുടെ അർഥം വ്യക്തമാക്കുന്നു.
- issue: ἐρχόμενον ἐν σαρκί എന്നതിന്റെ കാലഭാവം
  choice: മനുഷ്യശരീരത്തിൽ വരുന്ന
  alternative: മനുഷ്യശരീരത്തിൽ വന്ന
  rationale: ഗ്രീക്കിലെ വർത്തമാന കൃതന്തത്തിന്റെ യഥാർഥ രൂപം സംരക്ഷിക്കുന്നു; പൂർത്തിയായ ഭൂതകാലമെന്ന വ്യാഖ്യാനത്തിലേക്ക് വാചകത്തെ ചുരുക്കുന്നില്ല.
- issue: σάρξ എന്നതിന്റെ അർഥം
  choice: മനുഷ്യശരീരം, അഥവാ യഥാർഥ ദേഹധാരണം
  alternative: ജഡം; പാപസ്വഭാവം
  rationale: ഈ ക്രിസ്തുശാസ്ത്രപരമായ സന്ദർഭത്തിൽ σάρξ യഥാർഥ മനുഷ്യദേഹത്തെയാണ് സൂചിപ്പിക്കുന്നത്, ധാർമികമായ പാപസ്വഭാവത്തെയല്ല.
- issue: οὗτος എന്ന ഏകവചനത്തിന്റെ പരാമർശം
  choice: ഇങ്ങനെയുള്ളവൻ
  alternative: ഇതാണ്
  rationale: ബഹുവചനത്തിലുള്ള വഞ്ചകരിൽ ഈ സ്വഭാവമുള്ള ഏതൊരു വ്യക്തിയെയും ഏകവചനത്തിൽ വർഗ്ഗീകരിക്കുന്ന സാധ്യത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘മനുഷ്യശരീരത്തിൽ’ സാധാരണ വായനക്കാർക്കു സുതാര്യമാണ്; ‘ഇങ്ങനെയുള്ളവൻ’ ഏകവചനത്തിന്റെ വ്യക്തിവൽക്കരണബലം നിലനിർത്തുന്നു. മുഖ്യപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പുസൂചകങ്ങളും ചേർത്തിട്ടുണ്ട്.
