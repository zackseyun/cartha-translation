id: 2JN.1.3
reference: 2 John 1:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: ml
  text: കൃപയും കരുണയും സമാധാനവും പിതാവായ ദൈവത്തിൽനിന്നും പിതാവിന്റെ പുത്രനായ യേശുവായ മശീഹ[a]യിൽനിന്നും സത്യത്തിലും സ്നേഹത്തിലും നമ്മോടുകൂടെ ഉണ്ടായിരിക്കും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘യേശുക്രിസ്തുവിൽനിന്നും’ എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കിലെ Χριστός എന്ന പദവി പരമ്പരാഗതമായി ‘ക്രിസ്തു’ എന്നു ലിപ്യന്തരണം ചെയ്യപ്പെടുന്നു; ഇവിടെ അതിന്റെ പദവിയർത്ഥം നിലനിർത്താൻ ‘മശീഹ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: ഉണ്ടായിരിക്കും
  rationale: εἰμίയുടെ ഭാവികാല സൂചകക്രിയയായതിനാൽ ആശംസാരൂപമാക്കി മാറ്റാതെ ഉറപ്പുള്ള ഭാവികാലമായി പരിഭാഷപ്പെടുത്തി.
- source_word: μεθ’ ἡμῶν
  choice: നമ്മോടുകൂടെ
  rationale: μετά + genitive ഇവിടെ സഹവാസം സൂചിപ്പിക്കുന്നു; ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവും അർത്ഥസുതാര്യവുമായ പ്രയോഗം.
- source_word: χάρις ἔλεος εἰρήνη
  choice: കൃപയും കരുണയും സമാധാനവും
  rationale: മൂന്നു നാമങ്ങളും ἔσταιയുടെ സംയുക്ത കർത്താക്കളാണ്; ഗ്രീക്ക് ക്രമം നിലനിർത്തി മലയാള സംയോജകങ്ങൾ ചേർത്തു.
- source_word: παρὰ θεοῦ πατρός
  choice: പിതാവായ ദൈവത്തിൽനിന്നും
  rationale: παρά + genitive ഉറവിടം സൂചിപ്പിക്കുന്നതിനാൽ ‘നിന്നും’; πατρός ദൈവത്തെ വിശേഷിപ്പിക്കുന്നതായി സ്വാഭാവിക മലയാളത്തിൽ നൽകി, മൂലത്തിൽ ഇല്ലാത്ത ‘നമ്മുടെ’ ചേർത്തില്ല.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിൽനിന്നും
  rationale: Χριστός വ്യക്തിനാമമെന്നതിലുപരി അഭിഷിക്തനായ രാജാവിനെ സൂചിപ്പിക്കുന്ന പദവിയാണ്; അതിനാൽ പതിവ് ലിപ്യന്തരണമായ ‘ക്രിസ്തു’ക്കു പകരം പദവിയുടെ അർത്ഥം വഹിക്കുന്ന ‘മശീഹ’ ഉപയോഗിച്ചു.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: പിതാവിന്റെ പുത്രനായ
  rationale: യേശു മശീഹയെ പിതാവിന്റെ പുത്രനായി സമാനാധികരണത്തിൽ തിരിച്ചറിയുന്ന ബന്ധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: സത്യത്തിലും സ്നേഹത്തിലും
  rationale: ἐνയുടെ അടിസ്ഥാന ‘യിൽ’ ബന്ധവും രണ്ടു ഗുണാത്മക നാമങ്ങളുടെ സമാന്തരതയും നിലനിർത്തുന്നു; നിർദിഷ്ടത സൂചിപ്പിക്കുന്ന അധിക പദം ചേർത്തിട്ടില്ല.
theological_decisions:
- issue: Χριστοῦ എന്ന പദവിയുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: Χριστός ഇവിടെ യേശുവിനോടു ചേർന്ന പദവിയായി പ്രവർത്തിക്കുന്നു. ‘മശീഹ’ അതിന്റെ അഭിഷിക്തൻ എന്ന പദവിയർത്ഥം വഹിക്കുന്നു; പരമ്പരാഗത ‘ക്രിസ്തു’ സാധുവായ ലിപ്യന്തരണപരമായ പര്യായമായി അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: τοῦ υἱοῦ τοῦ πατρός എന്നതിന്റെ ബന്ധം
  choice: യേശു മശീഹയെ ‘പിതാവിന്റെ പുത്രൻ’ എന്നു സമാനാധികരണത്തിൽ തിരിച്ചറിയുന്നു
  alternative: യേശുവിനെത്തുടർന്നുള്ള കൂടുതൽ അയഞ്ഞ വിവരണവാക്യം
  rationale: ആവർത്തിച്ച നിർദേശകങ്ങളോടുകൂടിയ genitive ഘടന ഏറ്റവും സ്വാഭാവികമായി യേശുവിനെ പിതാവിന്റെ പുത്രനായി നേരിട്ട് തിരിച്ചറിയുന്നു; അതിലധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
- issue: ἔσταιയുടെ വാക്യഭാവം
  choice: പ്രസ്താവനാത്മക ഭാവി—‘ഉണ്ടായിരിക്കും’
  alternative: ആശംസ—‘ഉണ്ടാകട്ടെ’
  rationale: മൂലപദം future indicative ആണ്, optative അല്ല; അതിനാൽ അനുഗ്രഹാശംസയുടെ സന്ദർഭമുണ്ടെങ്കിലും വ്യാകരണരൂപത്തിലെ ഉറപ്പിനെ നിലനിർത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ഗൗരവമുള്ളതും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ ശൈലി. വാക്യത്തിന്റെ ഗ്രീക്ക് ക്രമവും ഭാവികാല ഉറപ്പും സാധ്യമായത്ര നിലനിർത്തിക്കൊണ്ട് മലയാളത്തിലെ സ്വാഭാവിക സംയോജനവും വിഭക്തിരൂപങ്ങളും ഉപയോഗിച്ചു.
