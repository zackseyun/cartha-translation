id: 2JN.1.2
reference: 2 John 1:2
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: ml
  text: നമ്മിൽ നിലനിൽക്കുന്ന സത്യം നിമിത്തമാണ്; അത് എന്നേക്കും നമ്മോടുകൂടെ ഉണ്ടായിരിക്കും[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നമ്മിൽ വസിക്കുന്ന സത്യം.’
    reason: μένω എന്ന പദത്തിന് ‘നിലനിൽക്കുക’ എന്നതിനൊപ്പം ‘വസിക്കുക’ എന്ന അർഥവും സാധ്യമാണ്; യോഹന്നാനീയ പ്രയോഗത്തിലെ ഈ അർഥനിറം കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
lexical_decisions:
- source_word: διὰ
  choice: നിമിത്തമാണ്
  rationale: Accusative-നോടുകൂടിയ διά ഇവിടെ കാരണം അഥവാ അടിസ്ഥാനം സൂചിപ്പിക്കുന്നു. മുൻവാക്യത്തിലെ സ്നേഹത്തിന്റെ അടിസ്ഥാനത്തെ സ്വാഭാവികമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു.
- source_word: ἀλήθειαν
  choice: സത്യം
  rationale: യോഹന്നാന്റെ പ്രയോഗത്തിൽ സമ്പന്നമായ ദൈവശാസ്ത്രപരമായ അർഥസാധ്യതകൾ ഉണ്ടെങ്കിലും, മൂലത്തിലെ പൊതുവായ നാമപദത്തെ വ്യാഖ്യാനിച്ച് ചുരുക്കാതെ നിലനിർത്തുന്നു.
- source_word: τὴν μένουσαν
  choice: നിലനിൽക്കുന്നതും
  rationale: μένω എന്നതിന്റെ വർത്തമാനകാല കൃദന്തരൂപം തുടർച്ചയായ സാന്നിധ്യത്തെയോ സ്ഥിരതയെയോ സൂചിപ്പിക്കുന്നു. ‘നിലനിൽക്കുന്നു’ ആ ദൈർഘ്യഭാവം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἐν ἡμῖν
  choice: നമ്മിൽ
  rationale: ἐν + dative എന്ന ഘടനയുടെ നേരിട്ടുള്ള അർഥമായ ‘നമ്മിൽ’ നിലനിർത്തുന്നു; ‘നമ്മുടെ ഇടയിൽ’ എന്ന സമൂഹപരമായ വായനയും സാധ്യമെങ്കിലും ഇവിടെ അത്ര നേരിട്ടല്ല.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: എന്നേക്കും നമ്മോടുകൂടെ ഉണ്ടായിരിക്കുന്നതുമായ
  rationale: μετά + genitive എന്നതിന് ‘നമ്മോടുകൂടെ’ എന്നും ἔσται എന്നതിന് ഭാവികാല അർഥവും നൽകുന്നു. മലയാളത്തിലെ വിശേഷണഘടനയിൽ ‘ഉണ്ടായിരിക്കും’ എന്ന ഭാവത്തെ ‘ഉണ്ടായിരിക്കുന്ന’ എന്നു സ്വാഭാവികമായി ബന്ധിപ്പിച്ചിരിക്കുന്നു.
- source_word: εἰς τὸν αἰῶνα
  choice: എന്നേക്കും
  rationale: തുടർച്ചയായ, അവസാനമില്ലാത്ത കാലത്തെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന് വ്യക്തവും സ്വാഭാവികവുമായ മലയാള തുല്യം.
theological_decisions:
- issue: ‘സത്യം’ എന്നതിന്റെ യോഹന്നാനീയ ദൈവശാസ്ത്രപരമായ അർഥം
  choice: ‘സത്യം’ എന്ന പൊതുപദം തന്നെ നിലനിർത്തുക
  alternative: ‘സുവിശേഷസത്യം’ / ‘സത്യോപദേശം’ / ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്ന പ്രത്യേക വ്യാഖ്യാനം
  rationale: ഗ്രീക്ക് പദം ഇവിടെ സുവിശേഷസന്ദേശം, സത്യോപദേശം, ക്രിസ്തുവുമായി ബന്ധപ്പെട്ട ദൈവിക വെളിപ്പാട് തുടങ്ങിയ അർഥസാധ്യതകളിൽ ഒന്നിനെ മാത്രം വ്യക്തമായി നിർണ്ണയിക്കുന്നില്ല. അതിനാൽ മൂലത്തിലെ സമ്പന്നമായ അവ്യക്തത സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ഈ വാക്യം മുൻവാക്യവുമായി വ്യാകരണപരമായി ബന്ധപ്പെട്ടു നിൽക്കുന്നതിനാൽ ‘നിമിത്തമാണ്’ എന്ന അവസാനരൂപം കാരണം/അടിസ്ഥാനം വ്യക്തമാക്കുന്നു. ‘നമ്മോടുകൂടെ’ എന്ന രൂപം ദൈവവചനപരമായ ഗൗരവം നിലനിർത്തുമ്പോഴും സാധാരണ വായനക്കാർക്ക് വ്യക്തമാണ്.
