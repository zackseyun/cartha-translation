id: 2JN.1.12
reference: 2 John 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: ml
  text: 'നിങ്ങൾക്ക് എഴുതാൻ പല കാര്യങ്ങളുണ്ടെങ്കിലും, കടലാസും മഷിയും ഉപയോഗിച്ച് എഴുതാൻ ഞാൻ ആഗ്രഹിച്ചില്ല. പകരം, നിങ്ങളുടെ അടുക്കൽ വന്ന് മുഖാമുഖം സംസാരിക്കാൻ ഞാൻ പ്രത്യാശിക്കുന്നു, അങ്ങനെ നിങ്ങളുടെ[a] സന്തോഷം പൂർണമാകേണ്ടതിന്.


    [a] ചില കൈയെഴുത്തുപ്രതികളിൽ “നിങ്ങളുടെ സന്തോഷം” എന്നതിനുപകരം “നമ്മുടെ സന്തോഷം” എന്നു വായിക്കുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ “നിങ്ങളുടെ സന്തോഷം” എന്നതിനുപകരം “നമ്മുടെ സന്തോഷം” എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: നിങ്ങൾക്ക് എഴുതാൻ പല കാര്യങ്ങളുണ്ടെങ്കിലും
  rationale: കർത്താവിനുള്ള പല കാര്യങ്ങളും എന്ന ബഹുവചനഭാവം നിലനിർത്തുകയും, സന്ദർഭത്തിൽ പങ്കുപദപ്രയോഗത്തിനുള്ള concessive അർഥം സ്വാഭാവിക മലയാളത്തിൽ ‘ഉണ്ടെങ്കിലും’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ ἐβουλήθην
  choice: ഞാൻ ആഗ്രഹിച്ചില്ല
  rationale: βούλομαι സൂചിപ്പിക്കുന്ന ഇച്ഛയെയോ മനസ്സിനെയോ ലളിതവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: കടലാസും മഷിയും ഉപയോഗിച്ച്
  rationale: διάയോടുകൂടിയ ഷഷ്ഠിവിഭക്തി ഇവിടെ ഉപാധിയെ സൂചിപ്പിക്കുന്നു. ‘ഉപയോഗിച്ച്’ ആ അർഥം സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; χάρτης എന്നതിനെ സാധാരണ വായനക്കാർക്കു ഗ്രഹിക്കാവുന്ന ‘കടലാസ്’ എന്നു നൽകിയിരിക്കുന്നു.
- source_word: ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: നിങ്ങളുടെ അടുക്കൽ വന്ന് … എന്നു ഞാൻ പ്രത്യാശിക്കുന്നു
  rationale: πρός നൽകുന്ന ദിശാഭാവവും സന്ദർശിക്കാനെത്തുക എന്ന പ്രയോഗാർഥവും നിലനിർത്തുന്നു.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: മുഖാമുഖം സംസാരിക്കാൻ
  rationale: പദശഃ ‘വായോടു വായ്’ എന്നതിനു പകരം നേരിട്ടുള്ള വ്യക്തിപരമായ സംഭാഷണം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് ശൈലിയുടെ സ്വാഭാവിക മലയാള തുല്യം ഉപയോഗിക്കുന്നു.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: അങ്ങനെ നിങ്ങളുടെ സന്തോഷം പൂർണമാകാൻ
  rationale: ἵναയുടെ ഉദ്ദേശ്യഭാവവും πεπληρωμένη ᾖ സൂചിപ്പിക്കുന്ന പൂർണതയിലെത്തിയ അവസ്ഥയും ചുരുക്കവും സ്വാഭാവികവുമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: സന്തോഷം ആരുടേതെന്നു നിർണ്ണയിക്കുന്ന സർവനാമത്തിലെ പാഠഭേദം
  choice: നിങ്ങളുടെ സന്തോഷം
  alternative: നമ്മുടെ സന്തോഷം
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠത്തിൽ ὑμῶν (‘നിങ്ങളുടെ’) എന്നാണ്; അതിനാൽ മുഖ്യപാഠത്തിൽ അതു പിന്തുടരുന്നു. ചില കൈയെഴുത്തുപ്രതികളിലെ ἡμῶν (‘നമ്മുടെ’) എന്ന അർഥവത്തായ പാഠഭേദം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. കത്തിന്റെ വ്യക്തിപരമായ ഭാവം നിലനിർത്തുന്നു; പഴഞ്ചൻ പദങ്ങളും സഭാവിഭാഗ-വിശേഷ പ്രയോഗങ്ങളും ഒഴിവാക്കിയിരിക്കുന്നു.
