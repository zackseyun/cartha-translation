reference: 2 John 1:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: ml
  text: 'മൂപ്പൻ, തിരഞ്ഞെടുക്കപ്പെട്ട മാന്യസ്ത്രീക്കും[a] അവളുടെ മക്കൾക്കും: ഞാൻ നിങ്ങളെ സത്യത്തിൽ[b] സ്നേഹിക്കുന്നു; ഞാൻ മാത്രമല്ല, സത്യം അറിഞ്ഞിട്ടുള്ള എല്ലാവരും നിങ്ങളെ സ്നേഹിക്കുന്നു—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘തിരഞ്ഞെടുക്കപ്പെട്ട സ്ത്രീക്കും’ എന്നും പരിഭാഷപ്പെടുത്താം. ‘മാന്യസ്ത്രീ’ എന്നത് ഒരു പ്രാദേശിക സഭയെ രൂപകമായി സൂചിപ്പിക്കുന്നതായി ചിലർ മനസ്സിലാക്കുന്നു; മറ്റുചിലർ ‘കുറിയ’ ഒരു വ്യക്തിനാമമാണെന്ന് കരുതുന്നു.
    reason: alternative_reading
  - marker: b
    text: ‘യഥാർഥമായി’ എന്നും അർഥമാകാം; യോഹന്നാന്റെ രചനകളിൽ ഈ പ്രയോഗത്തിന് ‘സത്യത്തിൽ’ എന്ന ദൈവശാസ്ത്രപരമായ അർഥധ്വനിയും ഉണ്ടായേക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: മൂപ്പൻ
  rationale: കത്തിന്റെ ആരംഭത്തിലെ സ്വയംവിശേഷണമായി ഇത് പ്രായം, അംഗീകൃത സ്ഥാനം, നേതൃത്വം എന്നീ സാധ്യതകൾ തുറന്നുവയ്ക്കുന്നു; കൂടുതൽ സാങ്കേതികമായ സഭാപദവി നിർബന്ധിക്കുന്നില്ല.
- source_word: ἐκλεκτῇ
  choice: തിരഞ്ഞെടുക്കപ്പെട്ട
  rationale: ദൈവത്താൽ തിരഞ്ഞെടുക്കപ്പെട്ടത് എന്ന ആശയം സ്വാഭാവികമായി നൽകുകയും സ്ത്രീയെയോ വ്യക്തിവൽക്കരിച്ച സഭയെയോ സൂചിപ്പിക്കാനുള്ള സാധ്യത നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: κυρίᾳ
  choice: മാന്യസ്ത്രീ
  rationale: κυρία എന്നതിന്റെ സാധാരണ അഭിസംബോധനാർഥം മാന്യവും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികവുമായി നൽകുന്നു; വ്യക്തിനാമമെന്ന സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: അവളുടെ മക്കൾ
  rationale: τέκνα ലിംഗഭേദമില്ലാതെ മക്കളെ സൂചിപ്പിക്കുന്നു; യഥാർഥ കുടുംബത്തെയും സഭാംഗങ്ങളെന്ന രൂപകത്തെയും അനുവദിക്കുന്നു.
- source_word: οὓς ἐγὼ ἀγαπῶ
  choice: സത്യത്തിൽ ഞാൻ സ്നേഹിക്കുന്നവരാണ് നിങ്ങൾ
  rationale: ഗ്രീക്കിലെ ബന്ധവാക്യത്തിന്റെ വ്യക്തിപരമായ ബഹുവചനസൂചന മലയാളത്തിൽ വ്യക്തമായി നൽകുന്നു; സ്നേഹത്തിന് അനാവശ്യ തീവ്രത ചേർക്കുന്നില്ല.
- source_word: ἐν ἀληθείᾳ
  choice: സത്യത്തിൽ
  rationale: ‘യഥാർഥമായി’ എന്ന രീതിയെയും യോഹന്നാനീയമായ ‘സത്യത്തിന്റെ മണ്ഡലത്തിൽ’ എന്ന അർഥധ്വനിയെയും ഒരുപോലെ നിലനിർത്തുന്നു.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: ഞാൻ മാത്രമല്ല, ... എല്ലാവരും
  rationale: എഴുത്തുകാരനും വിശാലമായ വിശ്വാസിസമൂഹവും തമ്മിലുള്ള ഗ്രീക്ക് ഊന്നൽ സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  choice: സത്യം അറിഞ്ഞിട്ടുള്ള എല്ലാവരും
  rationale: പൂർണ്ണകാല കൃദന്തം സൂചിപ്പിക്കുന്ന, മുമ്പ് അറിഞ്ഞതിന്റെ ഫലമായി ഇപ്പോഴും നിലനിൽക്കുന്ന അറിവ് ‘അറിഞ്ഞിട്ടുള്ള’ എന്ന രൂപം നൽകുന്നു.
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳ എന്ന അഭിസംബോധനയുടെ തിരിച്ചറിയൽ
  choice: ‘തിരഞ്ഞെടുക്കപ്പെട്ട മാന്യസ്ത്രീ’ എന്നു പൊതുനാമമായി പരിഭാഷപ്പെടുത്തി, ഒരു സ്ത്രീയെയോ വ്യക്തിവൽക്കരിച്ച പ്രാദേശിക സഭയെയോ സൂചിപ്പിക്കാമെന്ന അവ്യക്തത നിലനിർത്തി.
  alternative: ഒരു പ്രത്യേക ക്രിസ്തീയ സ്ത്രീ; സഭയും അതിലെ അംഗങ്ങളും; ‘കുറിയ’ എന്ന വ്യക്തിനാമം.
  rationale: ഗ്രീക്ക് ഈ സാധ്യതകളിൽ ഒന്നിനെ നിർബന്ധമായി തീർപ്പാക്കുന്നില്ല; അതിനാൽ മുഖ്യവാചകത്തിൽ സാധാരണ നാമാർഥവും അടിക്കുറിപ്പിൽ മറ്റുസാധ്യതകളും നൽകുന്നു.
- issue: ἐν ἀληθείᾳ എന്നതിന്റെ അർഥം
  choice: ‘സത്യത്തിൽ’
  alternative: ‘യഥാർഥമായി’; ‘സത്യത്തിനുള്ളിൽ’
  rationale: ആത്മാർഥതയെയും യോഹന്നാനീയമായ ദൈവശാസ്ത്രപരമായ ‘സത്യം’ എന്ന അർഥധ്വനിയെയും ഒരുമിച്ച് സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. കത്തുരൂപം വ്യക്തമാക്കാൻ ‘എഴുതുന്നത്’ ചേർത്തിട്ടുണ്ട്. എന്നാൽ അടിക്കുറിപ്പ് ചിഹ്നങ്ങൾ ബന്ധപ്പെട്ട വാക്കുകൾക്കരികിൽ വരേണ്ടതിനാൽ പ്രസിദ്ധീകരണപാഠത്തിൽ അവയുടെ സ്ഥാനം ക്രമപ്പെടുത്തി.
