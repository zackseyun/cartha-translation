  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: ml
  text: നിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട സഹോദരിയുടെ മക്കൾ നിനക്കു വന്ദനം പറയുന്നു.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: വന്ദനം പറയുന്നു
  rationale: കത്ത് അവസാനിപ്പിക്കുമ്പോഴുള്ള അഭിവാദനം സ്വാഭാവികവും മാന്യവുമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: τὰ τέκνα
  choice: മക്കൾ
  rationale: ലിംഗനിർണയം ചെയ്യാത്ത ബഹുവചനമായ τέκναയുടെ അർഥം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: τῆς ἀδελφῆς σου τῆς ἐκλεκτῆς
  choice: നിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ട സഹോദരിയുടെ
  rationale: ἐκλεκτός എന്ന പദത്തിന്റെ ‘തിരഞ്ഞെടുക്കപ്പെട്ട’ എന്ന അർഥവും ഗ്രീക്ക് വാക്യത്തിലെ ബന്ധവും നിലനിർത്തുന്നു; സഹോദരി ഒരു വ്യക്തിയെയോ സഭയെയോ സൂചിപ്പിക്കുന്നുവെന്നത് നിർണയിക്കുന്നില്ല.
theological_decisions:
- issue: ‘തിരഞ്ഞെടുക്കപ്പെട്ട സഹോദരി’ എന്ന പ്രയോഗത്തിന്റെ സൂചന
  choice: രൂപകമോ വ്യക്തിപരമോ എന്ന് വ്യക്തമാക്കാതെ മൂലപാഠത്തിന്റെ ഭാഷ അതേപടി നിലനിർത്തി.
  alternative: ‘തിരഞ്ഞെടുക്കപ്പെട്ട സഭ’ എന്നിങ്ങനെ വ്യക്തമായി വ്യാഖ്യാനിക്കുക.
  rationale: ἡ ἀδελφή രണ്ടാമത്തെ സഭയെ രൂപകമായി സൂചിപ്പിക്കാമെങ്കിലും ഒരു സ്ത്രീയെയും സൂചിപ്പിക്കാം; മൂലപാഠം ഈ സാധ്യതകൾ തീർപ്പാക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള മലയാളത്തിൽ, കത്തിന്റെ സമാപനാഭിവാദനത്തിന് യോജിച്ച ലളിതവും മാന്യവുമായ ശൈലി.
