id: 2JN.1.11
reference: 2 John 1:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: ml
  text: കാരണം, അവനോട് “അഭിവാദ്യം” പറയുന്നവൻ[a] അവന്റെ ദുഷ്‌പ്രവൃത്തികളിൽ പങ്കുചേരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സ്വാഗതം.” ഗ്രീക്കിലെ χαίρειν ഒരു പതിവ് അഭിവാദനസൂത്രമാണ്. ഈ സന്ദർഭത്തിൽ അത് വെറും കുശലാന്വേഷണമല്ല, സ്വീകരണമോ അംഗീകാരമോ പ്രകടിപ്പിക്കുന്നതായി മനസ്സിലാക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: പറയുന്നവൻ
  rationale: നിശ്ചയാർഥക ഉപപദത്തോടുകൂടിയ വർത്തമാനകാല കൃദന്തം പൊതുവായി അങ്ങനെ ചെയ്യുന്ന ഏതൊരാളെയും സൂചിപ്പിക്കുന്നു; ‘പറയുന്നവൻ’ ഗ്രീക്ക് ഘടനയും പൊതുവായ പ്രയോഗവും നിലനിർത്തുന്നു.
- source_word: γάρ
  choice: കാരണം
  rationale: മുൻവാക്യത്തിലെ വിലക്കിന്റെ കാരണം അവതരിപ്പിക്കുന്ന വിശദീകരണബന്ധം സ്വാഭാവികമായ മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: αὐτῷ
  choice: അവനോട്
  rationale: മുൻവാക്യത്തിൽ പറഞ്ഞ വ്യക്തിയിലേക്കു മടങ്ങിച്ചൂണ്ടുന്ന ദത്തിവിഭക്തി സർവനാമത്തെ അനാവശ്യ വിശദീകരണം ചേർക്കാതെ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു.
- source_word: χαίρειν
  choice: “അഭിവാദ്യം”
  rationale: λέγων എന്നതിനു ശേഷം വന്നിരിക്കുന്ന ഈ ക്രിയാരൂപം ഇവിടെ പതിവ് അഭിവാദനസൂത്രമായി പ്രവർത്തിക്കുന്നു. ‘അഭിവാദ്യം’ എന്നത് ‘സന്തോഷിക്കുക’ എന്ന അക്ഷരാർഥത്തെക്കാൾ സന്ദർഭോചിതവും, ‘സ്വാഗതം’ എന്ന കൂടുതൽ വ്യാഖ്യാനാത്മക പദത്തെക്കാൾ സംയമിതവുമാണ്.
- source_word: κοινωνεῖ
  choice: പങ്കുചേരുന്നു
  rationale: ദത്തിവിഭക്തിയോടുകൂടിയ κοινωνέω ഒരു കാര്യത്തിലെ പങ്കാളിത്തത്തെയോ പങ്കുവഹിക്കലിനെയോ സൂചിപ്പിക്കുന്നു. ‘പങ്കുചേരുന്നു’ ധാർമിക സഹഭാഗിത്വം വ്യക്തമാക്കുന്നു; സഭാപരമായ പ്രത്യേക അർഥമുള്ള പദം അടിച്ചേൽപ്പിക്കുന്നില്ല.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: അവന്റെ ദുഷ്‌പ്രവൃത്തികളിൽ
  rationale: ἔργα എന്നത് പ്രവൃത്തികളെയും πονηρά അവയുടെ ദുഷ്ടസ്വഭാവത്തെയും സൂചിപ്പിക്കുന്നു. മലയാളത്തിൽ ‘ദുഷ്‌പ്രവൃത്തികൾ’ സ്വാഭാവികവും കൃത്യവുമാണ്.
theological_decisions:
- issue: ഈ അഭിവാദ്യം വെറും മര്യാദയെയാണോ, അതോ അംഗീകാരവും സഹഭാഗിത്വവും ഉൾക്കൊള്ളുന്നുവോ
  choice: വാക്യം അഭിവാദനസൂത്രം പറയുന്നതിനെ ദുഷ്‌പ്രവൃത്തികളിലെ പങ്കാളിത്തവുമായി ബന്ധിപ്പിക്കുന്നു; മുൻവാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽ ഇത് വ്യാജോപദേശകനെ സ്വീകരിക്കുകയും പിന്തുണയ്ക്കുകയും ചെയ്യുന്നതുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു.
  alternative: എല്ലാ സാഹചര്യങ്ങളിലും ഏതുതരം മര്യാദാപൂർവമായ അഭിവാദനവും നിരോധിക്കുന്നു.
  rationale: χαίρειν സാധാരണ അഭിവാദനസൂത്രമാണെങ്കിലും κοινωνεῖ എന്ന ശക്തമായ പങ്കാളിത്തഭാഷയും 10-ാം വാക്യത്തിലെ വീട്ടിൽ സ്വീകരിക്കുന്ന പശ്ചാത്തലവും ദൗത്യത്തിനുള്ള അംഗീകാരമോ പിന്തുണയോ സൂചിപ്പിക്കുന്നു. എങ്കിലും ഈ വ്യാഖ്യാനം മുഖ്യവാചകത്തിൽ വികസിപ്പിക്കാതെ ഗ്രീക്കിന്റെ സംക്ഷിപ്തതയും സംഘർഷവും നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിന്റെ വിശദീകരണബന്ധവും പൊതുവായ കർത്തൃപ്രയോഗവും സൂക്ഷിച്ചു; സന്ദർഭത്തിൽനിന്നുള്ള വ്യാഖ്യാനം മുഖ്യവാചകത്തിലേക്ക് അനാവശ്യമായി ചേർത്തിട്ടില്ല.
