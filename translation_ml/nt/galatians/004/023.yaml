id: GAL.4.23
reference: Galatians 4:23
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: ml
  text: എന്നാൽ അടിമസ്ത്രീയിൽനിന്നുള്ള മകൻ ജഡപ്രകാരം[a] ജനിച്ചവനാണ്; സ്വതന്ത്രയായ സ്ത്രീയിൽനിന്നുള്ള മകനോ വാഗ്ദാനത്തിലൂടെ[b] ജനിച്ചവനാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അഥവാ, “സാധാരണ മാനുഷികരീതിയിൽ” / “മാനുഷിക മാർഗങ്ങളാൽ.” ഗ്രീക്കിൽ: “ജഡപ്രകാരം.”'
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “വാഗ്ദാനത്താൽ.” സാധാരണ മാനുഷിക ജനനത്തിലൂടെ മാത്രമല്ല, ദൈവത്തിന്റെ വാഗ്ദാനത്തിന്റെ ഫലമായാണ് ഈ ജനനം ഉണ്ടായതെന്ന് ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: അടിമസ്ത്രീ
  rationale: ഹാഗാറിന്റെ അടിമനില പൗലോസിന്റെ തുടർന്നുള്ള വാദത്തിൽ നിർണായകമായതിനാൽ, മൃദുവായ ‘ദാസി’ എന്നതിനെക്കാൾ സാമൂഹിക വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: κατὰ σάρκα
  choice: ജഡപ്രകാരം
  rationale: പൗലോസിന്റെ σάρξ എന്ന മുഖ്യപദം നിലനിർത്തുകയും ഇവിടെ സാധാരണ മാനുഷിക ജനനത്തെയാണ് സൂചിപ്പിക്കുന്നതെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുകയും ചെയ്യുന്നു.
- source_word: γεγέννηται
  choice: ജനിച്ചവനാണ്
  rationale: ഗ്രീക്ക് പൂർണകാല കർമണിരൂപത്തിന്റെ ഫലം നിലനിൽക്കുന്നതായി സൂചിപ്പിക്കുന്നതോടൊപ്പം ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമാണ്.
- source_word: ἐλευθέρα
  choice: സ്വതന്ത്രയായ സ്ത്രീ
  rationale: അടിമസ്ത്രീയുമായുള്ള നിയമപരവും സാമൂഹികവുമായ വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: δι’ ἐπαγγελίας
  choice: വാഗ്ദാനത്തിലൂടെ
  rationale: വാഗ്ദാനം ജനനത്തിന്റെ മാർഗമോ നിർണായക കാരണമോ ആണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം നിലനിർത്തുന്നു; മൂലത്തിൽ നിർദേശകപദം ഇല്ലാത്തതിനാൽ ‘ആ വാഗ്ദാനം’ എന്ന് ചേർത്തിട്ടില്ല.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: മകൻ ... മകനോ
  rationale: സന്ദർഭത്തിൽ അന്തർലീനമായ ‘മകൻ’ രണ്ടു ഘടകങ്ങളിലും വ്യക്തമാക്കി, μὲν…δὲ എന്ന താരതമ്യവൈരുധ്യം മലയാളത്തിലെ ‘…; …നോ’ ഘടനയിലൂടെ സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: κατὰ σάρκα എന്നതും δι’ ἐπαγγελίας എന്നതും തമ്മിലുള്ള വൈരുധ്യം
  choice: ‘ജഡപ്രകാരം’ എന്നും ‘വാഗ്ദാനത്തിലൂടെ’ എന്നും നൽകി പൗലോസിന്റെ പദപ്രയോഗവും ദൈവവാഗ്ദാനത്തിന്റെ നിർണായക പങ്കും നിലനിർത്തി.
  alternative: ‘സാധാരണ മാനുഷികരീതിയിൽ’ എന്നും ‘ദൈവത്തിന്റെ വാഗ്ദാനത്തിന്റെ ഫലമായി’ എന്നും കൂടുതൽ വ്യാഖ്യാനാത്മകമായി നൽകാം.
  rationale: ഇവിടെ ഭൗതികജനനം പാപമാണെന്നല്ല ആശയം; സാധാരണ മാനുഷിക ജനനവും ദൈവവാഗ്ദാനത്താൽ ഉണ്ടായ ജനനവും തമ്മിലുള്ള ഉടമ്പടിസംബന്ധമായ വൈരുധ്യമാണ്. മുഖ്യപാഠം ആ ദൈവശാസ്ത്രപരമായ പിരിമുറുക്കം മുൻകൂട്ടി തീർപ്പാക്കാതെ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും മാന്യവുമായ ശൈലി. ‘അടിമസ്ത്രീ’ സാമൂഹികനില വ്യക്തമായി സൂക്ഷിക്കുന്നു; ‘ജഡപ്രകാരം’ പൗലോസിന്റെ സാങ്കേതിക പദപ്രയോഗം നിലനിർത്തുന്നതിനാൽ അതിന്റെ സന്ദർഭാർഥം അടിക്കുറിപ്പിൽ വിശദീകരിച്ചിരിക്കുന്നു.
