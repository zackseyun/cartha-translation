id: GAL.4.14
reference: Galatians 4:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: ml
  text: എന്റെ ശാരീരികാവസ്ഥ നിങ്ങൾക്ക് ഒരു പരീക്ഷണമായിരുന്നിട്ടും[a], നിങ്ങൾ എന്നെ നിസ്സാരമായി കാണുകയോ വെറുപ്പോടെ തള്ളിക്കളയുകയോ ചെയ്തില്ല[b]; മറിച്ച്, നിങ്ങൾ എന്നെ ദൈവദൂതനെപ്പോലെ[c], മശീഹയായ യേശുവിനെപ്പോലെ സ്വീകരിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘എന്റെ ജഡത്തിലുള്ള നിങ്ങളുടെ പരീക്ഷണം.’ ഗ്രീക്ക് പാഠത്തിലെ ഈ വാക്യഘടന ദുഷ്കരമാണ്; എന്റെ ശാരീരികാവസ്ഥ നിങ്ങൾക്ക് പരീക്ഷണമായി എന്ന അർഥവും സാധ്യമാണ്.'
    reason: alternative_reading
  - marker: b
    text: ‘തള്ളിക്കളയുക’ എന്നതിന് ഉപയോഗിച്ച ഗ്രീക്ക് ക്രിയയുടെ അക്ഷരാർഥം ‘തുപ്പിക്കളയുക’ എന്നാണ്; വെറുപ്പോടെയുള്ള നിരാകരണമാണ് ഉദ്ദേശ്യം.
    reason: lexical_alternative
  - marker: c
    text: ‘ദൈവദൂതൻ’ എന്ന ഗ്രീക്ക് പദത്തിന് ‘ദൈവത്തിന്റെ ദൂതൻ’ എന്നും ‘സന്ദേശവാഹകൻ’ എന്നും അർഥമാകാം; ഇവിടെ മശീഹയായ യേശുവുമായുള്ള സമാന്തര താരതമ്യം കാരണം ‘ദൈവദൂതൻ’ എന്നാണ് പരിഭാഷപ്പെടുത്തിയിരിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: പരീക്ഷണം
  rationale: സന്ദർഭത്തിൽ ഇത് പാപത്തിലേക്കുള്ള പ്രലോഭനമല്ല, പൗലോസിന്റെ ശാരീരികാവസ്ഥ ഗലാത്യർക്കുണ്ടാക്കിയ പരീക്ഷണമാണ്.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: എന്റെ ശാരീരികാവസ്ഥ നിങ്ങൾക്ക് ഒരു പരീക്ഷണമായിരുന്നിട്ടും
  rationale: ദുഷ്കരമായ ഗ്രീക്ക് ഘടനയുടെ സന്ദർഭസഹജമായ അർഥം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; അക്ഷരാർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἐξουθενήσατε
  choice: നിന്ദിക്കുകയോ
  rationale: ഒരാളെ നിസ്സാരനായി കണ്ട് അവഹേളിക്കുക എന്ന ക്രിയയുടെ വ്യക്തിബന്ധപരമായ അർഥം വ്യക്തമാക്കുന്നു.
- source_word: ἐξεπτύσατε
  choice: വെറുപ്പോടെ തള്ളിക്കളയുകയോ
  rationale: അക്ഷരാർഥത്തിൽ ‘തുപ്പിക്കളയുക’ എന്ന ശക്തമായ വെറുപ്പിന്റെയും നിരാകരണത്തിന്റെയും ഭാവം സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐδέξασθέ με
  choice: നിങ്ങൾ എന്നെ സ്വീകരിച്ചു
  rationale: ആദരപൂർവമായ വ്യക്തിപരമായ സ്വീകരണം സൂചിപ്പിക്കുന്ന ലളിതവും മാന്യവുമായ പ്രയോഗം.
- source_word: ἄγγελον θεοῦ
  choice: ദൈവത്തിന്റെ ഒരു ദൂതനെപ്പോലെ
  rationale: ἄγγελος എന്നതിന് ദൂതൻ എന്നും ദൈവദൂതൻ എന്നും അർഥമാകാം; മലയാളത്തിലെ ‘ദൂതൻ’ മൂലപദത്തിന്റെ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: Χριστὸν Ἰησοῦν
  choice: മശീഹയായ യേശുവിനെപ്പോലെതന്നെ
  rationale: Χριστός ഇവിടെ സ്ഥാനപ്പേരായി പ്രവർത്തിക്കുന്നതിനാൽ ‘മശീഹ’ എന്ന് പരിഭാഷപ്പെടുത്തി; ആവർത്തിച്ച ὡς-ന്റെ ഊന്നൽ ‘പോലെതന്നെ’ കൊണ്ട് അറിയിച്ചു.
theological_decisions:
- issue: ‘ദൈവത്തിന്റെ ഒരു ദൂതനെപ്പോലെ, മശീഹയായ യേശുവിനെപ്പോലെ’ എന്ന താരതമ്യത്തിന്റെ അർഥം
  choice: ഗലാത്യർ പൗലോസിനെ അത്യുന്നത ആദരവോടെ സ്വീകരിച്ച രീതിയെയാണ് ഇത് വിവരിക്കുന്നത്.
  alternative: രണ്ടാമത്തെ താരതമ്യം ആദ്യത്തേതിനെ വാക്ചാതുര്യപരമായി ശക്തിപ്പെടുത്തുന്നു.
  rationale: രണ്ട് ὡς ഘടകങ്ങളും സ്വീകരിച്ച രീതിയെ സൂചിപ്പിക്കുന്നു; പൗലോസിനെ യേശുവുമായി സത്താപരമായി ഒന്നാക്കുന്നില്ല.
- issue: σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: ശാരീരികാവസ്ഥ
  alternative: ജഡം; പാപസ്വഭാവം
  rationale: ഇവിടെ പൗലോസിന്റെ ശരീരസംബന്ധമായ ദൗർബല്യമോ അസുഖമോ ആണ് സന്ദർഭം; ധാർമികമായ ‘പാപസ്വഭാവം’ എന്ന അർഥം ചുമത്തുന്നത് അനുചിതമാണ്.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യമായ മാന്യമായ മലയാളം. ദുഷ്കരമായ ആദ്യഘടനയുടെ പ്രധാന അർഥം വാചകത്തിൽ സ്വാഭാവികമായി നൽകിയപ്പോൾ അതിന്റെ യഥാർഥ വ്യാകരണപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിച്ചു.
