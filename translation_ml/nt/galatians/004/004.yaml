    issue: ‘അയച്ചുവിട്ടു’ may suggest dismissal or sending away.
    rationale: Although it can convey ‘sent out,’ Malayalam usage may give it a nuance not required by ἐξαπέστειλεν. ‘അയച്ചു’ is natural and fully faithful; the footnote can note the compound verb’s stronger/sending-forth nuance.
  - severity: low
    issue: Use of the less common spelling ‘നിന്നു’ in ‘സ്ത്രീയിൽനിന്നു.’
    rationale: ‘സ്ത്രീയിൽനിന്ന്’ is more standard in contemporary formal Malayalam and does not alter the meaning.
