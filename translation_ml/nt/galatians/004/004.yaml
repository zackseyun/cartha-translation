  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: ml
  text: എന്നാൽ കാലം തികഞ്ഞപ്പോൾ[a], ദൈവം തന്റെ പുത്രനെ അയച്ചു[b]—സ്ത്രീയിൽനിന്ന് ജനിച്ചവനായും[c], നിയമത്തിന് കീഴിൽ ജനിച്ചവനായും[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കാലത്തിന്റെ പൂർണത വന്നപ്പോൾ” അല്ലെങ്കിൽ “കാലം പൂർത്തിയായപ്പോൾ.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “അയച്ചുവിട്ടു” അല്ലെങ്കിൽ “പുറത്തേക്ക് അയച്ചു.” ഗ്രീക്കിലെ സംയുക്തക്രിയയ്ക്ക് സാധാരണ “അയച്ചു” എന്നതിനെക്കാൾ ശക്തമായ ഭാവമുണ്ട്.
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, “ഒരു സ്ത്രീയിൽനിന്ന് ജനിച്ചവനായും.” ഈ പ്രയോഗം പുത്രന്റെ യഥാർഥ മനുഷ്യജനനത്തെ ഊന്നിപ്പറയുന്നു.
    reason: lexical_alternative
  - marker: d
    text: ഇവിടെ പ്രധാനമായി ഉദ്ദേശിക്കുന്നത് മോശെയുടെ നിയമത്തിന്റെ അധികാരപരിധിക്കു കീഴിൽ എന്നതാണ്.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ …പ്പോൾ
  rationale: δέ സൂചിപ്പിക്കുന്ന മൃദുവായ സന്ദർഭമാറ്റവും ὅτε സൂചിപ്പിക്കുന്ന സമയബന്ധവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു; അനാവശ്യമായി ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: കാലം തികഞ്ഞപ്പോൾ
  rationale: ‘കാലത്തിന്റെ പൂർണത വന്നു’ എന്ന അക്ഷരാർഥപരമായെങ്കിലും അസ്വാഭാവികമായ പ്രയോഗത്തിനു പകരം, സമയം ഉദ്ദേശിച്ച പൂർത്തിയിലെത്തിയ നിർണായക ഘട്ടത്തെ മലയാളത്തിൽ വ്യക്തമായി അറിയിക്കുന്നു.
- source_word: ἐξαπέστειλεν
  choice: അയച്ചുവിട്ടു
  rationale: സാധാരണ ἀποστέλλω-യെക്കാൾ ശക്തമായ ἐξαποστέλλω എന്ന സംയുക്തക്രിയയുടെ ‘പുറത്തേക്ക് അയയ്ക്കുക’ എന്ന ഭാവം സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: തന്റെ പുത്രനെ
  rationale: ദൈവമാണ് വാക്യത്തിലെ കർത്താവ് എന്നതിനാൽ αὐτοῦ എന്ന ഉടമസ്ഥബന്ധം മലയാളത്തിൽ സംശയമില്ലാതെ വ്യക്തമാക്കുന്ന സ്വാഭാവിക രൂപം.
- source_word: γενόμενον ἐκ γυναικός
  choice: സ്ത്രീയിൽനിന്നു ജനിച്ചവനായി
  rationale: γίνομαι എന്നതിന്റെ അടിസ്ഥാനാർഥം ‘ആകുക/ഉണ്ടാകുക’ എന്നാണെങ്കിലും ഈ ഘടനയിൽ യഥാർഥ മനുഷ്യജനനമാണ് സൂചിപ്പിക്കുന്നത്; ἐκ എന്നതിന്റെ ഉറവിടഭാവവും ‘യിൽനിന്നു’ നിലനിർത്തുന്നു.
- source_word: γενόμενον ὑπὸ νόμον
  choice: നിയമത്തിന് കീഴിൽ ജനിച്ചവനായി
  rationale: ആവർത്തിക്കുന്ന γενόμενον എന്ന പങ്കാളിത്തരൂപത്തിന്റെ സമാന്തരഘടന നിലനിർത്തുകയും ὑπό സൂചിപ്പിക്കുന്ന അധികാരപരിധി ‘കീഴിൽ’ എന്നു പ്രകടിപ്പിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: γενόμενον ἐκ γυναικός എന്നതിലെ പുത്രന്റെ യഥാർഥ മനുഷ്യത്വം
  choice: സ്ത്രീയിൽനിന്നു ജനിച്ചവനായി
  alternative: സ്ത്രീയിൽനിന്ന് ഉണ്ടായവനായി
  rationale: ‘ദൈവം തന്റെ പുത്രനെ അയച്ചുവിട്ടു’ എന്നത് സൂചിപ്പിക്കുന്ന മുൻനിലനിൽപ്പിനെ ഇല്ലാതാക്കാതെ, അവന്റെ യഥാർഥ മനുഷ്യജനനം വ്യക്തമാക്കുന്നു.
- issue: ὑπὸ νόμον എന്നതിലെ νόμος-ന്റെ സൂചന
  choice: നിയമത്തിന് കീഴിൽ
  alternative: മോശെയുടെ നിയമത്തിന് കീഴിൽ
  rationale: ഗലാത്യലേഖനത്തിന്റെ പശ്ചാത്തലത്തിൽ മോശെയുടെ നിയമമാണ് പ്രധാന സൂചന. എങ്കിലും മൂലപാഠത്തിന്റെ സംക്ഷിപ്തതയും ചില വ്യാഖ്യാനപരമായ തുറന്ന നിലയും മുഖ്യവാചകത്തിൽ സംരക്ഷിച്ച്, നിർദിഷ്ടീകരണം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ ഗൗരവമുള്ള ശൈലി. ‘ന്യായപ്രമാണം’ എന്ന പരമ്പരാഗത സഭാപദത്തിനു പകരം കൂടുതൽ പൊതുവായി മനസ്സിലാകുന്ന ‘നിയമം’ ഉപയോഗിച്ചു. ഡാഷ് ഉപയോഗിച്ച് രണ്ട് സമാന്തര പങ്കാളിത്തപ്രയോഗങ്ങളും ‘പുത്രനെ’ വിശേഷിപ്പിക്കുന്നതായി വ്യക്തമാക്കി.
