  terminology: ‘അടിമത്തത്തിലാണ്’ appropriately preserves δουλεύει and the passage’s slavery/freedom contrast. The footnote inaccurately calls the Greek article before Hagar a ‘നിർദേശകപദം’ (demonstrative); it should be identified as an article/definiteness marker, without treating it as a Greek demonstrative.
  issues:
