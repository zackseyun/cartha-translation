source:
  edition: SBLGNT
  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: ml
  text: ഹാഗാർ അറേബ്യയിലെ സീനായി പർവതമാണ്[a]; അവൾ ഇപ്പോഴത്തെ യെരൂശലേമിനോട് അനുരൂപമാണ്, കാരണം അവൾ തന്റെ മക്കളോടൊപ്പം അടിമത്തത്തിലാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഈ ഹാഗാർ അറേബ്യയിലെ സീനായി പർവതമാണ്.” ഗ്രീക്കിൽ ‘ഹാഗാർ’ എന്ന പേരിനു മുമ്പ് ഒരു നിശ്ചയാർഥക ആർട്ടിക്കിൾ ഉണ്ട്; അതിനാൽ ഈ ഉപവാക്യത്തിന്റെ വാക്യഘടന ദുഷ്കരമാണ്.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: ഹാഗാർ
  rationale: δέയെ നേരിയ തുടർച്ചാസൂചകമായി ഗ്രഹിക്കുന്നു; മലയാളത്തിൽ അനാവശ്യമായ ഒരു തുടക്കപദം ചേർക്കുന്നില്ല. Ἁγὰρ-നു മുമ്പുള്ള τὸ സൃഷ്ടിക്കുന്ന വാക്യഘടനാപ്രയാസം മുഖ്യവാചകത്തിൽ സ്വാഭാവികമാക്കി, അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: അറേബ്യയിലുള്ള സീനായിമലയാണ്
  rationale: ഗ്രീക്കിലെ നേരിട്ടുള്ള സമീകരണം ‘പ്രതിനിധാനം ചെയ്യുന്നു’ എന്നു വ്യാഖ്യാനിച്ചുമാറ്റാതെ നിലനിർത്തുന്നു; ഭൂമിശാസ്ത്രനാമം അതിരുകടന്ന് വിശദീകരിക്കുന്നില്ല.
- source_word: συστοιχεῖ
  choice: ചേർന്നുനിൽക്കുന്നു
  rationale: ഒരേ നിരയിലോ വിഭാഗത്തിലോ നിൽക്കുക, പരസ്പരം ഒത്തുചേരുക എന്ന രൂപകാത്മക ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; വെറും സ്ഥലസാമീപ്യം ഉദ്ദേശിക്കുന്നില്ല.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: ഇപ്പോഴത്തെ യെരൂശലേം
  rationale: അടുത്ത വാക്യത്തിലെ ‘മുകളിലുള്ള യെരൂശലേം’ എന്ന വൈരുധ്യത്തിനായി νῦν എന്ന കാലസൂചന വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: δουλεύει
  choice: അടിമത്തത്തിലാണ്
  rationale: സേവനം എന്ന പൊതുവായ അർഥത്തിലേക്ക് മയപ്പെടുത്താതെ, ഈ ഭാഗത്തിലെ അടിമത്തം–സ്വാതന്ത്ര്യം വൈരുധ്യം വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: തന്റെ മക്കളോടൊപ്പം
  rationale: μετάയുടെ സഹവർത്തിത്വവും τέκναയുടെ കുടുംബപരവും ആലങ്കാരികവുമായ അർഥവും സ്വാഭാവികമായി നൽകുന്നു.
theological_decisions:
- issue: ഹാഗാറിനെ സീനായിമലയുമായി നേരിട്ട് സമീകരിക്കുന്ന പൗലോസിന്റെ ആലങ്കാരിക പ്രസ്താവന
  choice: ‘ഹാഗാർ ... സീനായിമലയാണ്’ എന്ന നേരിട്ടുള്ള സമീകരണം നിലനിർത്തി.
  alternative: ‘ഹാഗാർ സീനായിമലയെ പ്രതിനിധാനം ചെയ്യുന്നു’
  rationale: ഗ്രീക്ക് വാചകം നേരിട്ടുള്ള സമീകരണഭാഷയാണ് ഉപയോഗിക്കുന്നത്. വ്യാഖ്യാനപരമായ ‘പ്രതിനിധാനം ചെയ്യുന്നു’ ചേർത്താൽ പൗലോസിന്റെ വാചകശക്തി മയങ്ങും.
- issue: συστοιχεῖ സൂചിപ്പിക്കുന്ന ബന്ധത്തിന്റെ സ്വഭാവം
  choice: ‘ഇപ്പോഴത്തെ യെരൂശലേമിനോടു ചേർന്നുനിൽക്കുന്നു’
  alternative: ‘ഇപ്പോഴത്തെ യെരൂശലേമിനോട് യോജിക്കുന്നു’ / ‘അതേ നിരയിൽ നിൽക്കുന്നു’
  rationale: ആലങ്കാരിക താരതമ്യത്തിലെ ഒരേ നിരയിലോ വിഭാഗത്തിലോ ഉള്ള correspondence സംരക്ഷിക്കുന്നു; ബന്ധം കൃത്യമായി ഏതു രീതിയിലുള്ളതെന്ന് അതിരുകടന്ന് നിർവചിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘അടിമത്തത്തിലാണ്’ എന്ന പ്രയോഗം ഭാഗത്തിന്റെ അടിമത്തം–സ്വാതന്ത്ര്യം വൈരുധ്യം വ്യക്തമാക്കുന്നു. ‘ചേർന്നുനിൽക്കുന്നു’ എന്നത് ഇവിടെ ഭൗമസാമീപ്യമല്ല, ആലങ്കാരികമായി ഒരേ നിരയിലോ വിഭാഗത്തിലോ ഉൾപ്പെടുന്നതാണ്.
