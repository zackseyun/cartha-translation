id: GAL.4.9
reference: Galatians 4:9
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: ml
  text: എന്നാൽ ഇപ്പോൾ, നിങ്ങൾ ദൈവത്തെ അറിഞ്ഞശേഷം—അതിലും ശരിയായി പറഞ്ഞാൽ, ദൈവത്താൽ അറിയപ്പെട്ടശേഷം—എങ്ങനെയാണ് നിങ്ങൾ വീണ്ടും ആ ദുർബലവും ദരിദ്രവുമായ മൂലഘടകങ്ങളിലേക്ക്[a] തിരിഞ്ഞ്, അവയ്ക്ക് വീണ്ടും, പുതുതായി അടിമകളാകാൻ ആഗ്രഹിക്കുന്നത്?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “മൂലഘടകങ്ങൾ” എന്നതിന് “മൂലശക്തികൾ,” “അടിസ്ഥാന തത്ത്വങ്ങൾ,” അല്ലെങ്കിൽ “പ്രാഥമിക കാര്യങ്ങൾ” എന്നും അർഥമാകാം.
    reason: στοιχεῖα എന്ന ഗ്രീക്കുപദത്തിന് ഇവിടെ ഒന്നിലധികം സാദ്ധ്യമായ അർഥങ്ങളുണ്ട്; ഈ വിവാദം പരിഹരിച്ചെന്നപോലെ മുഖ്യപാഠം അവതരിപ്പിക്കാതിരിക്കാൻ പകരങ്ങൾ രേഖപ്പെടുത്തുന്നു.
lexical_decisions:
- source_word: γνόντες θεόν
  choice: ദൈവത്തെ അറിഞ്ഞിരിക്കെ
  rationale: അയോരിസ്റ്റ് കൃദന്തരൂപം ദൈവത്തെ അറിയാനിടയായതിനെ സൂചിപ്പിക്കുന്നു; മുഖ്യചോദ്യത്തോടുള്ള കൃദന്തബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: അല്ല, ദൈവത്താൽ അറിയപ്പെട്ടിരിക്കെ
  rationale: μᾶλλον δέയുടെ തിരുത്തൽഭാവവും γνωσθέντεςന്റെ കർമണിപ്രയോഗവും നിലനിർത്തുന്നു; ദൈവത്തിന്റെ പ്രവർത്തനത്തിന് വാക്യം നൽകുന്ന മുൻഗണന സംരക്ഷിക്കുന്നു.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: എങ്ങനെയാണ് വീണ്ടും ... തിരിയുന്നത്?
  rationale: πῶς എന്നതിലെ ആശ്ചര്യവും ശാസനാഭാവവും ചോദ്യരൂപത്തിൽ പ്രകടമാക്കുകയും വർത്തമാനകാലത്തിലുള്ള തിരിച്ചുപോക്ക് നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: ആ ബലഹീനവും ദരിദ്രവുമായ മൂലഘടകങ്ങൾ
  rationale: ἀσθενῆ, πτωχὰ എന്നീ വിശേഷണങ്ങൾ നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു. στοιχεῖα എന്ന വിവാദപദത്തെ വ്യക്തിവൽക്കരിക്കാതെ, അടിസ്ഥാന ഘടകങ്ങൾ, തത്ത്വങ്ങൾ, പ്രപഞ്ചശക്തികൾ എന്നിവയിലേക്കുള്ള സാധ്യത തുറന്നുവയ്ക്കുന്ന പൊതുവായ പദം തിരഞ്ഞെടുക്കുന്നു.
- source_word: πάλιν ἄνωθεν
  choice: വീണ്ടും ആദ്യംമുതൽ
  rationale: ആവർത്തനവും പുതുതായി തുടക്കം കുറിക്കുന്നതുമായ സംയുക്ത ഊന്നൽ മലയാളത്തിൽ സംക്ഷിപ്തമായി നിലനിർത്തുന്നു.
- source_word: δουλεύειν θέλετε
  choice: അടിമപ്പെടാൻ നിങ്ങൾ ആഗ്രഹിക്കുന്നുവോ
  rationale: δουλεύειν എന്നതിലെ അടിമത്തബിംബം ദുർബലപ്പെടുത്താതെ θέλετεയുടെ ഇച്ഛാഭാവവും പൗലോസിന്റെ ശാസനയും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഗലാത്യർ 4:9-ലെ στοιχεῖα എന്ന പദത്തിന്റെ അർഥം
  choice: മൂലഘടകങ്ങൾ
  alternative: മൂലശക്തികൾ; അടിസ്ഥാന തത്ത്വങ്ങൾ; പ്രാഥമിക കാര്യങ്ങൾ
  rationale: ഈ പദം പഴയ ക്രമത്തിന്റെ അടിസ്ഥാന മതതത്ത്വങ്ങളെയോ പ്രപഞ്ചശക്തികളെയോ സൂചിപ്പിക്കാം. മുഖ്യപാഠം ഏതെങ്കിലും ഒരു വ്യാഖ്യാനം നിർബന്ധിക്കാതെ അർഥവ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു; മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകുന്നു.
- issue: “ദൈവത്താൽ അറിയപ്പെട്ടു” എന്നതിന്റെ ഊന്നൽ
  choice: ദൈവത്തെ അവർ അറിയുന്നതിനെ പൗലോസ് തിരുത്തി, ദൈവത്താൽ അവർ അറിയപ്പെട്ടതിനു മുൻഗണന നൽകുന്നു
  alternative: ദൈവിക മുൻകൈയെ സൂചിപ്പിക്കാത്ത, ബന്ധത്തെ മാത്രം ഊന്നുന്ന വായന
  rationale: μᾶλλον δέ യഥാർഥമായ തിരുത്തൽ സൂചിപ്പിക്കുന്നു. കർമണിപ്രയോഗം നിലനിർത്തുന്നതിലൂടെ വാക്യത്തിലെ ദൈവിക പ്രവർത്തനത്തിന്റെ ഊന്നൽ സംരക്ഷിക്കപ്പെടുന്നു; എന്നാൽ അതിനപ്പുറം ഒരു സിദ്ധാന്തവ്യവസ്ഥയും ഇറക്കുമതി ചെയ്യുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ചോദ്യശൈലി ഉപയോഗിച്ചു. പൗലോസിന്റെ ആശ്ചര്യവും ശാസനയും നിലനിർത്തി; പഴഞ്ചൻ പദപ്രയോഗങ്ങളും സഭാവിഭാഗസവിശേഷമായ വ്യാഖ്യാനങ്ങളും ഒഴിവാക്കി.
