id: GAL.4.16
reference: Galatians 4:16
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: ml
  text: അങ്ങനെയെങ്കിൽ, നിങ്ങളോടു സത്യം പറയുന്നതുകൊണ്ട് ഞാൻ നിങ്ങളുടെ ശത്രുവായിത്തീർന്നോ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളോടു സത്യസന്ധമായി സംസാരിക്കുന്നതുകൊണ്ട്.’ ἀληθεύων എന്ന ഗ്രീക്ക് പങ്കാളിക്രിയയ്ക്ക് ‘സത്യസന്ധമായി സംസാരിക്കുക’ എന്നും ‘സത്യം പറയുക’ എന്നും അർഥമാകാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: അങ്ങനെയെങ്കിൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനവും തുടർന്നുള്ള ആലങ്കാരിക ചോദ്യത്തിലേക്കുള്ള മാറ്റവും സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: ἐχθρὸς ὑμῶν
  choice: നിങ്ങളുടെ ശത്രു
  rationale: ബന്ധസൂചകമായ ജനിറ്റീവിനെയും ശത്രുവായി കണക്കാക്കപ്പെടുന്ന വ്യക്തിയെന്ന അർഥത്തെയും വ്യക്തവും സ്വാഭാവികവുമായി പകരുന്നു.
- source_word: γέγονα
  choice: ഞാൻ ... ആയിത്തീർന്നോ?
  rationale: പെർഫെക്റ്റ് ക്രിയ സൂചിപ്പിക്കുന്ന സംഭവിച്ച മാറ്റവും അതിന്റെ ഇപ്പോഴത്തെ ഫലാവസ്ഥയും മലയാളത്തിലെ ‘ആയിത്തീർന്നോ’ എന്ന പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: ἀληθεύων ὑμῖν
  choice: നിങ്ങളോടു സത്യം പറയുന്നതുകൊണ്ട്
  rationale: പങ്കാളിക്രിയയുടെ മാർഗം/കാരണം സൂചിപ്പിക്കുന്ന ബന്ധവും ഗലാത്യരോടുള്ള സത്യസന്ധമായ സംസാരവും സ്വാഭാവിക മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; ഗ്രീക്കിലെ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വാദത്തിൽ ἀληθεύων എന്നതിന്റെ അർഥം
  choice: ഗലാത്യരോടു സത്യം പറഞ്ഞതിനാൽ താൻ അവരുടെ ശത്രുവായിത്തീർന്നോ എന്നു പൗലോസ് ചോദിക്കുന്നു.
  alternative: അവരോടു സത്യസന്ധമായി സംസാരിച്ചതിനാൽ താൻ അവരുടെ ശത്രുവായിത്തീർന്നോ എന്നു പൗലോസ് ചോദിക്കുന്നു.
  rationale: സമീപസന്ദർഭത്തിലെ നേരിട്ടുള്ള ശാസനയോടും അഭ്യർഥനയോടും ‘സത്യം പറയുക’ നന്നായി ചേരുന്നു; എന്നാൽ ‘സത്യസന്ധമായി സംസാരിക്കുക’ എന്ന യഥാർഥ ശാബ്ദിക സാധ്യത അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ചോദ്യം ആലങ്കാരികമാണെന്ന സ്വരം നിലനിർത്തിയിട്ടുണ്ട്; മൂലത്തിലെ പെർഫെക്റ്റിന്റെ ഫലാവസ്ഥ ‘ആയിത്തീർന്നോ’ എന്നതിലൂടെ സൂചിപ്പിക്കുന്നു.
