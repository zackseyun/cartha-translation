source:
  edition: SBLGNT
  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: ml
  text: എന്റെ മക്കളേ, നിങ്ങളിൽ മശീഹാ രൂപപ്പെടുന്നതുവരെ നിങ്ങൾക്കുവേണ്ടി ഞാൻ വീണ്ടും പ്രസവവേദന അനുഭവിക്കുന്നു.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘മശീഹാ’ എന്നതിന് പകരം ‘ക്രിസ്തു’ എന്നും വിവർത്തനം ചെയ്യാം. Χριστός എന്ന പദവിനാമത്തെയാണ് ‘മശീഹാ’ എന്നു നൽകിയിരിക്കുന്നത്.
    reason: alternative_reading
  - marker: b
    text: ‘നിങ്ങളിൽ’ എന്നത് ‘നിങ്ങളുടെ ഇടയിൽ’ എന്നും അർത്ഥമാക്കാം; അങ്ങനെ വായിക്കുമ്പോൾ സമൂഹപരമായ അർത്ഥത്തിന് കൂടുതൽ ഊന്നൽ ലഭിക്കുന്നു.
    reason: lexical_alternative
  - marker: c
    text: 'അക്ഷരാർഥത്തിൽ: ‘ഞാൻ വീണ്ടും പ്രസവവേദനയിലാണ്’ അല്ലെങ്കിൽ ‘ഞാൻ വീണ്ടും പ്രസവവേദന അനുഭവിക്കുന്നു.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: എന്റെ മക്കളേ
  rationale: സ്നേഹപൂർവമായ സംബോധനയെ സ്വാഭാവികവും മാന്യവുമായ മലയാളത്തിൽ അവതരിപ്പിക്കുന്നു; മൂലത്തിൽ വ്യക്തമല്ലാത്ത ചെറുപ്പം ‘കുഞ്ഞുമക്കളേ’ എന്നു ചേർത്ത് അതിവ്യക്തമാക്കുന്നില്ല.
- source_word: οὓς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പ്രസവവേദനയുടെ രൂപകത്തോടു ചേർന്ന് ബന്ധസർവനാമത്തിന്റെ കർമബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: πάλιν
  choice: വീണ്ടും
  rationale: ആവർത്തനത്തിന്റെ നേരിട്ടുള്ളതും സ്വാഭാവികവുമായ തുല്യപദം.
- source_word: ὠδίνω
  choice: പ്രസവവേദന അനുഭവിക്കുന്നു
  rationale: പ്രസവവേദനയുടെ ശക്തമായ മാതൃരൂപകം നിലനിർത്തുകയും ആധുനിക മലയാളത്തിൽ വ്യക്തമായി വായിക്കപ്പെടുകയും ചെയ്യുന്നു.
- source_word: μέχρις οὗ
  choice: രൂപപ്പെടുന്നതുവരെ
  rationale: തുടർന്നുനിൽക്കുന്ന വേദനയുടെ സമയപരിധിയും ലക്ഷ്യവും ‘വരെ’ എന്ന ഘടനയിലൂടെ കൃത്യമായി നൽകുന്നു.
- source_word: μορφωθῇ
  choice: രൂപപ്പെടുക
  rationale: ക്രിയയുടെ കർമണിപ്രയോഗം സംരക്ഷിക്കുന്നു; ‘സ്വഭാവം കൈവരിക്കുക’ പോലുള്ള വ്യാഖ്യാനപരമായ വിപുലീകരണം ഒഴിവാക്കുന്നു.
- source_word: Χριστὸς
  choice: മശീഹാ
  rationale: അഭിഷിക്തൻ എന്ന പദവിയർത്ഥം നിലനിർത്തുന്നു; പരിചിതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ പകരമായി നൽകുന്നു.
- source_word: ἐν ὑμῖν
  choice: നിങ്ങളിൽ
  rationale: വ്യക്തികളുടെ ഉള്ളിലുള്ള രൂപപ്പെടലിനെയും ബഹുവചന അഭിസംബോധനയിലെ സമൂഹപരമായ മാനത്തെയും തുറന്നുവയ്ക്കുന്ന സംക്ഷിപ്ത വിവർത്തനം.
theological_decisions:
- issue: ‘മശീഹാ നിങ്ങളിൽ രൂപപ്പെടുക’ എന്നതിന്റെ അർത്ഥം
  choice: പൗലോസിന്റെ രൂപകം അതേപടി നിലനിർത്തി ‘മശീഹാ നിങ്ങളിൽ രൂപപ്പെടുക’ എന്നു വിവർത്തനം ചെയ്തു.
  alternative: മശീഹായുടെ സ്വഭാവം ഓരോരുത്തരുടെയും ഉള്ളിൽ വളരുന്നു; അല്ലെങ്കിൽ സമൂഹത്തിനിടയിൽ മശീഹാ രൂപംകൊള്ളുന്നു; അല്ലെങ്കിൽ ഇത് പ്രധാനമായും മാനസാന്തര/പുതുജനന രൂപകമാണ്.
  rationale: ഗ്രീക്ക് വാചകം വ്യക്തിപരമായ ആന്തരിക രൂപപ്പെടലിനും സമൂഹപരമായ മാനത്തിനും ഇടം നൽകുന്നു; ഒരു സാങ്കേതിക ദൈവശാസ്ത്ര വിശദീകരണമായി അതിനെ ചുരുക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. പ്രസവത്തിന്റെ മാതൃരൂപകവും കർമണിപ്രയോഗവും മൂലത്തിലെ വ്യക്തി–സമൂഹ അർത്ഥസാധ്യതയും സംരക്ഷിച്ചിട്ടുണ്ട്.
