id: GAL.4.26
reference: Galatians 4:26
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν ⸀μήτηρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: ml
  text: എന്നാൽ മുകളിലുള്ള യെരൂശലേം സ്വതന്ത്രയാണ്; അവളാണ്[a] നമ്മുടെ അമ്മ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'കൂടുതൽ പദാനുപദമായി: ‘അത് നമ്മുടെ അമ്മയാണ്.’ യെരൂശലേമിനെ ഇവിടെ അമ്മയായി വ്യക്തിവൽക്കരിച്ചിരിക്കുന്നതിനാലാണ് പ്രധാന പാഠത്തിൽ ‘അവൾ’ എന്നു നൽകിയിരിക്കുന്നത്.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ ഇപ്പോഴത്തെ യെരൂശലേമിനോടുള്ള വ്യക്തമായ വൈരുധ്യം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: ἄνω
  choice: മുകളിലുള്ള
  rationale: ഭൗമികമായ യെരൂശലേമിനോട് വിപരീതമായി വരുന്ന സ്ഥലസൂചന നിലനിർത്തുന്നു; ‘സ്വർഗീയ’ എന്നു വ്യാഖ്യാനിച്ച് അർഥം ചുരുക്കുന്നില്ല.
- source_word: Ἰερουσαλήμ
  choice: യെരൂശലേം
  rationale: മലയാള ബൈബിൾഭാഷയിൽ പരിചിതമായ പേരുരൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐλευθέρα
  choice: സ്വതന്ത്രയാണ്
  rationale: ചുറ്റുപാടിലെ അടിമ–സ്വതന്ത്ര വൈരുധ്യം നിലനിർത്തുന്ന വിധത്തിൽ സ്ത്രീലിംഗമായി വ്യക്തിവൽക്കരിച്ച യെരൂശലേമിന്റെ നില വ്യക്തമാക്കുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘സ്ത്രീ’ എന്ന നാമം ചേർക്കുന്നില്ല.
- source_word: ἥτις
  choice: അവളാണ്
  rationale: യെരൂശലേമിനെ അമ്മയായി വ്യക്തിവൽക്കരിക്കുന്ന സന്ദർഭത്തിൽ സ്വാഭാവികമായ സ്ത്രീലിംഗ സർവനാമം ഉപയോഗിക്കുന്നു; ബന്ധസർവനാമത്തിന്റെ കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
- source_word: μήτηρ
  choice: അമ്മ
  rationale: പൗലോസിന്റെ ഹാഗാർ–സാറാ രൂപകത്തിലെ മാതൃരൂപകം ലളിതവും നേരിട്ടുമായ ഭാഷയിൽ നിലനിർത്തുന്നു.
- source_word: ἡμῶν
  choice: നമ്മുടെ
  rationale: ഒന്നാംപുരുഷ ബഹുവചന ഉടമസ്ഥബന്ധം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: ‘മുകളിലുള്ള യെരൂശലേം’ എന്നതിന്റെ വ്യക്തിവൽക്കരണം
  choice: സ്ത്രീരൂപത്തിൽ വ്യക്തിവൽക്കരിച്ച് ‘അവളാണ് നമ്മുടെ അമ്മ’ എന്നു പരിഭാഷപ്പെടുത്തുക.
  alternative: കൂടുതൽ പദാനുപദമായി ‘അത് നമ്മുടെ അമ്മയാണ്’ അഥവാ ‘അവൾ നമ്മുടെ അമ്മയായിരിക്കുന്നു’ എന്നു നൽകുക.
  rationale: സാറയോടും സ്വതന്ത്രസ്ത്രീയോടും ബന്ധപ്പെടുത്തി പൗലോസ് അവതരിപ്പിക്കുന്ന രൂപകത്തിൽ യെരൂശലേം മാതാവായി വ്യക്തിവൽക്കരിക്കപ്പെടുന്നു. സ്ത്രീലിംഗ സർവനാമം ഈ രൂപകം വ്യക്തമാക്കുന്നു; എന്നാൽ അതിനപ്പുറമുള്ള ദൈവശാസ്ത്ര വ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മുകളിലുള്ള’ എന്ന രൂപം സ്ഥലരൂപകം സംരക്ഷിക്കുന്നു; ‘സ്വതന്ത്രയാണ്’ എന്നും ‘അവളാണ്’ എന്നും നൽകിയിരിക്കുന്നത് സന്ദർഭത്തിലെ സ്ത്രീരൂപ വ്യക്തിവൽക്കരണം സ്വാഭാവികമാക്കുന്നു.
