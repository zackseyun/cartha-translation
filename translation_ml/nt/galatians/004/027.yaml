id: GAL.4.27
reference: Galatians 4:27
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: ml
  text: 'എന്തെന്നാൽ, ഇങ്ങനെ എഴുതിയിരിക്കുന്നു: “പ്രസവിക്കാത്ത വന്ധ്യയായ സ്ത്രീയേ, ആനന്ദിക്കൂ; പ്രസവവേദന അനുഭവിക്കാത്തവളേ, പൊട്ടിപ്പുറപ്പെട്ട് ആർത്തുവിളിക്കൂ; കാരണം, ഭർത്താവുള്ള സ്ത്രീയുടെ മക്കളെക്കാൾ ഉപേക്ഷിക്കപ്പെട്ട സ്ത്രീയുടെ മക്കൾ അധികമാണ്.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: യെശയ്യാവ് 54:1-ൽനിന്നുള്ള ഉദ്ധരണി.
    reason: cross_reference
  - marker: b
    text: “ഉപേക്ഷിക്കപ്പെട്ട” എന്നതിന് “കൈവിടപ്പെട്ട” അല്ലെങ്കിൽ “ഏകാന്തമാക്കപ്പെട്ട” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നു
  rationale: തിരുവെഴുത്ത് ഉദ്ധരിക്കുന്നതിനുള്ള സ്വാഭാവികമായ മലയാളപ്രയോഗം; ഗ്രീക്ക് പൂർണകാലത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും സൂചിപ്പിക്കുന്നു.
- source_word: Εὐφράνθητι
  choice: ആനന്ദിക്കുക
  rationale: സന്തോഷിക്കാനുള്ള ആജ്ഞയെ മാന്യവും പ്രവാചകീയ ഉദ്ധരണിക്ക് യോജിച്ചതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: പ്രസവിക്കാത്ത വന്ധ്യയായ സ്ത്രീയേ
  rationale: വിളിച്ചുപറയുന്ന സ്ത്രീയെ വ്യക്തമാക്കുകയും തുടർന്നുനിൽക്കുന്ന സന്താനരാഹിത്യത്തിന്റെ ആശയം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ῥῆξον καὶ βόησον
  choice: ആർത്തുവിളിച്ചു ഘോഷിക്കുക
  rationale: പെട്ടെന്നുള്ള ഉച്ചത്തിലുള്ള ആഹ്ലാദപ്രകടനം സൂചിപ്പിക്കുന്ന രണ്ടു ആജ്ഞകളുടെയും ശക്തി സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: പ്രസവവേദന അനുഭവിക്കാത്തവളേ
  rationale: ὠδίνω എന്ന പദത്തിലെ പ്രസവവേദനയുടെ പ്രത്യേക അർഥം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: മക്കളെക്കാൾ അധികമാണ് ... മക്കൾ
  rationale: താരതമ്യത്തെ വ്യക്തവും സ്വാഭാവികവുമായ മലയാള വാക്യഘടനയിൽ അവതരിപ്പിക്കുന്നു.
- source_word: τῆς ἐρήμου
  choice: ഉപേക്ഷിക്കപ്പെട്ട സ്ത്രീയുടെ
  rationale: ഈ രൂപകസന്ദർഭത്തിൽ പദത്തിനുള്ള ഏകാന്തമാക്കപ്പെട്ട, കൈവിടപ്പെട്ട എന്ന ആശയം നൽകുന്നു; വെറും മരുഭൂമി എന്ന സ്ഥലാർഥം ഒഴിവാക്കുന്നു.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: ഭർത്താവുള്ള സ്ത്രീയുടെ
  rationale: ἀνήρ ഇവിടെ ഭർത്താവ് എന്ന അർഥത്തിലാണെന്നത് നേരിട്ട് പ്രകടിപ്പിക്കുകയും ഗ്രീക്കിലെ വൈരുധ്യം നിലനിർത്തുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ഗലാത്യർ 4-ലെ രൂപകാലങ്കാരപരമായ പശ്ചാത്തലത്തിനുള്ളിൽ യെശയ്യാവ് 54:1 ഉദ്ധരിക്കുന്നത്
  choice: ഉദ്ധരണിയിലെ പ്രവാചകീയ മാതൃരൂപകം അതേപടി പരിഭാഷപ്പെടുത്തി; പൗലൊസിന്റെ ചുറ്റുമുള്ള വിശദീകരണം വാക്യത്തിനുള്ളിൽ ചേർത്തില്ല.
  alternative: ‘മുകളിലുള്ള യെരൂശലേം’ അല്ലെങ്കിൽ സാറാ എന്ന തിരിച്ചറിയൽ ഉദ്ധരണിയുടെ വാക്കുകളിൽത്തന്നെ വ്യക്തമാക്കുക.
  rationale: ഇത് വ്യക്തമായ തിരുവെഴുത്ത് ഉദ്ധരണിയാണ്. അതിന്റെ സ്വന്തം ചിത്രഭാഷ സംരക്ഷിക്കുകയും സന്ദർഭത്തിലെ പൗലൊസിന്റെ വാദം അതിനെ വ്യാഖ്യാനിക്കാൻ അനുവദിക്കുകയും ചെയ്യുന്നതാണ് ഉറവിടത്തോടു കൂടുതൽ വിശ്വസ്തം.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സാധാരണ വായനക്കാർക്ക് മനസ്സിലാകുന്ന, എന്നാൽ തിരുവെഴുത്ത് ഉദ്ധരണിയുടെ ഗൗരവവും പ്രവാചകീയ താളവും നിലനിർത്തുന്ന ഭാഷയാണ് ഉപയോഗിച്ചത്. എല്ലാ അടിക്കുറിപ്പു ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
