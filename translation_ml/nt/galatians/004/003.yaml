id: GAL.4.3
reference: Galatians 4:3
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: ml
  text: അതുപോലെതന്നെ, നാമും കുട്ടികളായിരുന്നപ്പോൾ ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങളുടെ കീഴിൽ അടിമകളായിരുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “ലോകത്തിന്റെ മൂലശക്തികൾക്ക്”; ഗ്രീക്ക് പദം അടിസ്ഥാന ഘടകങ്ങളെയോ തത്ത്വങ്ങളെയോ, അല്ലെങ്കിൽ പ്രാപഞ്ചിക ആത്മീയ ശക്തികളെയോ സൂചിപ്പിക്കാം.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: അതുപോലെതന്നെ
  rationale: മുൻവാക്യത്തിലെ അവകാശിയുടെ ഉപമയുമായുള്ള താരതമ്യം സ്വാഭാവികമായും സംക്ഷിപ്തമായും നിലനിർത്തുന്നു.
- source_word: ἡμεῖς
  choice: നാമും
  rationale: ഗ്രീക്കിലെ ഊന്നലുള്ള ഒന്നാംപുരുഷ ബഹുവചനം ‘-ഉം’ ചേർത്ത് വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: ὅτε ἦμεν νήπιοι
  choice: കുട്ടികളായിരുന്നപ്പോൾ
  rationale: νήπιοι ഇവിടെ ശൈശവത്തേക്കാൾ പ്രായപൂർത്തിയാകാത്ത അവസ്ഥയെയും അപക്വതയെയും സൂചിപ്പിക്കുന്നു; മുൻപത്തെ അവകാശിയുടെ ഉപമയോടും ഇത് ചേരുന്നു.
- source_word: ὑπὸ
  choice: കീഴിൽ എന്ന ആശയം ‘അടിമപ്പെട്ടിരുന്നു’ എന്ന ക്രിയാസംയോജനത്തിൽ
  rationale: അധീനതയുടെയും നിയന്ത്രണത്തിന്റെയും ആശയം മലയാളത്തിൽ അനാവശ്യ ആവർത്തനമില്ലാതെ പ്രകടമാക്കുന്നു.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങൾ
  rationale: στοιχεῖα എന്ന തർക്കവിധേയമായ പദത്തെ അടിസ്ഥാന ഘടകങ്ങൾ/തത്ത്വങ്ങൾ എന്ന അർഥത്തിൽ മുഖ്യപാഠത്തിൽ അവതരിപ്പിക്കുമ്പോഴും ആത്മീയ ശക്തികൾ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ἤμεθα δεδουλωμένοι
  choice: അടിമപ്പെട്ടിരുന്നു
  rationale: ഗ്രീക്കിലെ ശക്തമായ അടിമത്തഭാഷയും തുടർന്നുനിന്ന അവസ്ഥയുടെ ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: τὰ στοιχεῖα τοῦ κόσμου എന്നതിന്റെ അർഥം
  choice: മുഖ്യപാഠത്തിൽ ‘ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങൾ’
  alternative: ‘ലോകത്തിന്റെ മൂലശക്തികൾ’ അഥവാ ലോകവുമായി ബന്ധപ്പെട്ട ആത്മീയ ശക്തികൾ
  rationale: ഉടൻമുമ്പുള്ള സന്ദർഭം പ്രായപൂർത്തിയാകാത്ത അവകാശി അധീനതയിൽ കഴിയുന്നതിനെക്കുറിച്ചായതിനാൽ വ്യക്തിത്വരഹിതമായ വായന മുഖ്യപാഠത്തിന് യോജിക്കുന്നു. എന്നാൽ ഈ ഗ്രീക്ക് പ്രയോഗം പ്രാപഞ്ചിക ആത്മീയ ശക്തികളെയും സൂചിപ്പിക്കാമെന്നതിനാൽ ആ ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ, എന്നാൽ ഗൗരവമുള്ള മലയാളം. ‘അടിമപ്പെട്ടിരുന്നു’ എന്നത് മൂലത്തിലെ അടിമത്തഭാഷയുടെ ശക്തി നിലനിർത്തുന്നു; തർക്കവിധേയമായ στοιχεῖα എന്ന പദത്തിന്റെ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിലൂടെ സംരക്ഷിച്ചിട്ടുണ്ട്.
