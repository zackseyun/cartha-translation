revisions:
- from: അതുപോലെതന്നെ, നാമും കുട്ടികളായിരുന്നപ്പോൾ ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങൾക്ക്[a] അടിമപ്പെട്ടിരുന്നു.
  to: അതുപോലെതന്നെ, നാമും കുട്ടികളായിരുന്നപ്പോൾ ലോകത്തിന്റെ അടിസ്ഥാന ഘടകങ്ങളുടെ കീഴിൽ അടിമകളായിരുന്നു.[a]
  rationale: The revision supplies the explicit “under” relationship encoded by ὑπὸ while retaining the draft’s restrained rendering of στοιχεῖα and its footnoted ambiguity. The wording does not settle whether στοιχεῖα denotes basic principles/elements or cosmic spiritual powers.
  reviewer_model: gpt-5.6-terra
