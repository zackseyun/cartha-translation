    issue: The main text expands τὸν νόμον as “നിയമം പറയുന്നത്.”
    rationale: Greek says literally ‘do you not hear the law?’ The expansion interprets the law as speaking and weakens the exact repeated lexical link with the earlier ‘under the law.’ This contextual sense is better retained in a note rather than inserted into the translation.
