id: GAL.4.21
reference: Galatians 4:21
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: ml
  text: 'നിയമത്തിന് കീഴിലായിരിക്കാൻ ആഗ്രഹിക്കുന്നവരേ, എന്നോടു പറയൂ: നിങ്ങൾ നിയമം കേൾക്കുന്നില്ലേ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ നിയമത്തെ ശ്രദ്ധിച്ചു കേൾക്കുന്നില്ലേ?” ഗ്രീക്ക് ക്രിയയ്ക്ക് ‘കേൾക്കുക’ എന്നും ‘ശ്രദ്ധിച്ചു കേൾക്കുക’ എന്നും അർഥമാകാം. ഇവിടെ ‘നിയമം’ എന്നത് മോശയുടെ നിയമത്തെയും, പ്രത്യേകിച്ച് പൗലോസ് അടുത്തതായി ഉദ്ധരിക്കുന്ന തിരുവെഴുത്തുവിവരണത്തെയും സൂചിപ്പിക്കുന്നതായിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: എന്നോടു പറയൂ
  rationale: വർത്തമാനകാല ബഹുവചന ആജ്ഞാരൂപത്തിന്റെ നേരിട്ടുള്ള വെല്ലുവിളിയും മറുപടി ആവശ്യപ്പെടുന്ന ഭാവവും സ്വാഭാവിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: നിയമത്തിന് കീഴിലായിരിക്കാൻ ആഗ്രഹിക്കുന്നവരേ
  rationale: ആ അഭിലാഷത്താൽ വിശേഷിപ്പിക്കപ്പെടുന്ന സംഘത്തെ നേരിട്ട് അഭിസംബോധന ചെയ്യുന്നു; ‘നിയമത്തിന് കീഴിൽ’ എന്ന പ്രയോഗം പൗലോസിന്റെ നിയമപരവും ഉടമ്പടിസംബന്ധവുമായ രൂപകം സംരക്ഷിക്കുന്നു.
- source_word: νόμον / τὸν νόμον
  choice: നിയമം
  rationale: രണ്ടിടത്തും ഒരേ പദം ഉപയോഗിച്ച്, ഒരുവശത്ത് നിയമത്തിന്റെ അധികാരത്തിന് കീഴിലാകുന്നതും മറുവശത്ത് നിയമഗ്രന്ഥം പറയുന്നത് കേൾക്കുന്നതുമായ പദപ്രയോഗബന്ധം നിലനിർത്തുന്നു.
- source_word: οὐκ ἀκούετε
  choice: പറയുന്നത് കേൾക്കുന്നില്ലേ?
  rationale: ἀκούω എന്നതിന് ‘കേൾക്കുക’ എന്നും ‘ശ്രദ്ധിച്ചു കേൾക്കുക/അനുസരിക്കുക’ എന്നും അർഥമാകാം. അടുത്തതായി ഉദ്ധരിക്കുന്ന തിരുവെഴുത്തിന്റെ സന്ദേശത്തിൽ ശ്രദ്ധ ചെലുത്തുക എന്ന സന്ദർഭസൂചന സ്വാഭാവികമായി അറിയിക്കാൻ ‘നിയമം പറയുന്നത് കേൾക്കുക’ എന്ന് വിവർത്തനം ചെയ്തു.
theological_decisions:
- issue: ‘നിയമം’ എന്നതിന്റെ സൂചകം
  choice: രണ്ടിടത്തും ‘നിയമം’ എന്ന് തന്നെയാക്കി; രണ്ടാമത്തേതിൽ ‘നിയമം പറയുന്നത്’ എന്ന രൂപത്തിൽ ഗ്രന്ഥപരമായ അർഥവും സൂചിപ്പിച്ചു.
  alternative: ‘മോശയുടെ നിയമം’ അല്ലെങ്കിൽ ‘ന്യായപ്രമാണം’ എന്ന് വ്യക്തമായി നിർവചിക്കുക.
  rationale: νόμος ഇവിടെ മോശൈക നിയമവ്യവസ്ഥയെയും തുടർന്ന് ഉദ്ധരിക്കുന്ന നിയമഗ്രന്ഥത്തെയും ഒരുമിച്ച് സൂചിപ്പിക്കുന്ന പൗലോസിന്റെ ഉദ്ദേശപൂർവമായ പദപ്രയോഗമാണ്. ‘മോശയുടെ’ എന്ന് ചേർക്കുന്നത് സൂചകം അനാവശ്യമായി നേരത്തേ ചുരുക്കും.
- issue: ἀκούετε എന്നതിലെ കേൾവി-ശ്രദ്ധ അർഥവ്യാപ്തി
  choice: പ്രധാനവാക്യത്തിൽ ‘പറയുന്നത് കേൾക്കുന്നില്ലേ?’
  alternative: ‘നിയമത്തെ ശ്രദ്ധിക്കുന്നില്ലേ?’ അല്ലെങ്കിൽ ‘നിയമം നിങ്ങൾ കേൾക്കുന്നില്ലേ?’
  rationale: കേവലമായ ശ്രവണവും ശ്രദ്ധാപൂർവം കേട്ട് ഗ്രഹിക്കലും തമ്മിലുള്ള ഗ്രീക്ക് പദത്തിന്റെ അർഥവ്യാപ്തി പൂർണമായി ഒറ്റ അർഥത്തിലേക്ക് ചുരുക്കാതെ, സന്ദർഭത്തിലെ ശാസ്ത്രവചനപരമായ ഊന്നൽ വ്യക്തമാക്കുന്നു.
translation_notes:
  register: ആധുനിക മാനക മലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ നേരിട്ടുള്ള അഭിസംബോധന ഉപയോഗിച്ചു. ‘ന്യായപ്രമാണം’ എന്ന സഭാപാരമ്പര്യ പദത്തിന് പകരം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ‘നിയമം’ സ്വീകരിച്ചു; അതിലൂടെ ഗ്രീക്കിലെ ആവർത്തനവും വാക്യത്തിലെ ദൈവശാസ്ത്രപരമായ സംഘർഷവും നിലനിർത്തി.
