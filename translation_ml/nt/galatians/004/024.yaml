language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: ml
  text: 'ഇവ ആലങ്കാരികമായി വ്യാഖ്യാനിക്കപ്പെടുന്നു[a], കാരണം ഈ സ്ത്രീകൾ രണ്ടു ഉടമ്പടികളാണ്: ഒന്ന് സീനായ് മലയിൽനിന്നുള്ളതും അടിമത്തത്തിലേക്കു മക്കളെ പ്രസവിക്കുന്നതുമാണ്; അതാണ് ഹാഗാർ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഇവ ആലങ്കാരികമായി പറയപ്പെടുന്നു” അല്ലെങ്കിൽ “ഇവ ഒരു ആലങ്കാരിക വ്യാഖ്യാനമാണ്.” മുമ്പുള്ള വിവരണത്തെ പൗലോസ് ആലങ്കാരികമായി ഉപയോഗിക്കുന്നുവെന്നാണ് ഗ്രീക്ക് പ്രയോഗം സൂചിപ്പിക്കുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: ഇവ
  rationale: മുമ്പു പറഞ്ഞ സാറാ–ഹാഗാർ വിവരണത്തിലേക്കു പിന്നോട്ടു ചൂണ്ടുന്ന നപുംസക ബഹുവചന സർവനാമത്തിന്റെ സൂചന സ്വാഭാവികവും സംക്ഷിപ്തവുമായി നിലനിർത്തുന്നു.
- source_word: ἀλληγορούμενα
  choice: ആലങ്കാരികമായി വ്യാഖ്യാനിക്കപ്പെടുന്നു
  rationale: ἐστιν ചേർന്ന വർത്തമാനകാല കർമണി പ്രയോഗത്തെ നിലനിർത്തുകയും, മുമ്പുള്ള വിവരണം പൗലോസ് ആലങ്കാരികമായി ഉപയോഗിക്കുന്നു എന്ന ആശയം വ്യക്തമാക്കുകയും ചെയ്യുന്നു; വിവരണത്തിന്റെ ചരിത്രപരതയെ നിഷേധിക്കുന്നതായി വിവർത്തനം ചെയ്യുന്നില്ല.
- source_word: αὗται
  choice: ഈ സ്ത്രീകൾ
  rationale: സ്ത്രീലിംഗ ബഹുവചന നിർദേശക സർവനാമം മുമ്പു പറഞ്ഞ രണ്ടു സ്ത്രീകളെയാണ് സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ ആശയക്കുഴപ്പം ഒഴിവാക്കാൻ ‘സ്ത്രീകൾ’ വ്യക്തമാക്കിയിരിക്കുന്നു.
- source_word: διαθῆκαι
  choice: ഉടമ്പടികൾ
  rationale: സീനായ് പശ്ചാത്തലത്തിലും പൗലോസിന്റെ ദൈവശാസ്ത്രപരമായ പ്രയോഗത്തിലും ‘ഉടമ്പടി’യാണ് യോജിച്ച സ്ഥാപിത പദം.
- source_word: μία μὲν
  choice: ഒന്ന്
  rationale: μέν അടുത്ത വാക്യത്തിൽ പൂർത്തിയാകുന്ന താരതമ്യത്തിന്റെ ആദ്യഭാഗം തുറക്കുന്നു; മലയാളത്തിൽ ‘ഒന്ന്’ എന്നത് ഈ അപൂർണമായ പ്രതിവിന്യാസം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: സീനായ് മലയിൽനിന്നുള്ളത്
  rationale: ഉടമ്പടിയുടെ ഉറവിടം അഥവാ ആരംഭസ്ഥലം വ്യക്തമാക്കുന്ന ἀπόയുടെ അർഥം കൃത്യമായി നൽകുന്നു.
- source_word: εἰς δουλείαν
  choice: അടിമത്തത്തിലേക്കു
  rationale: εἰς സൂചിപ്പിക്കുന്ന ദിശയെയോ ഫലത്തെയോ നിലനിർത്തുന്നു; δουλείαയുടെ ബന്ധിതവും അധീനവുമായ അവസ്ഥയ്ക്ക് ‘അടിമത്തം’ പൂർണ ശക്തി നൽകുന്നു.
- source_word: γεννῶσα
  choice: മക്കളെ പ്രസവിക്കുന്നു
  rationale: സ്ത്രീലിംഗ ഏകവചന വർത്തമാനകാല കർത്തരി കൃദന്തത്തിന്റെ മാതൃത്വരൂപകം വ്യക്തവും സ്വാഭാവികവുമായി പകർന്നു നൽകുന്നു.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: അതാണ് ഹാഗാർ
  rationale: മലയാളത്തിൽ വ്യാകരണലിംഗമില്ലാത്തതിനാൽ ‘അവൾ’ എന്ന് ചേർത്ത് മുൻപദത്തെ അനാവശ്യമായി വ്യക്തിവൽക്കരിക്കാതെ, ഉടമ്പടിയെയും ഹാഗാറിനെയും ആലങ്കാരികമായി തിരിച്ചറിയിക്കുന്ന വാക്യം സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: സാറാ–ഹാഗാർ വിവരണത്തെ പൗലോസ് ഉപയോഗിക്കുന്ന രീതി
  choice: മുമ്പുള്ള കാര്യങ്ങൾ ആലങ്കാരികമായി വ്യാഖ്യാനിക്കപ്പെടുന്നു
  alternative: ഈ കാര്യങ്ങൾ ഒരു ആലങ്കാരികകഥയാണ്
  rationale: ἀλληγορούμενα വ്യാഖ്യാനരീതിയെയോ വാഗ്‌പ്രയോഗത്തെയോ സൂചിപ്പിക്കുന്നു. അതിനാൽ ഉല്പത്തി വിവരണം ചരിത്രപരമല്ലെന്ന നിഗമനം വിവർത്തനത്തിൽ ചേർക്കാതെ പൗലോസിന്റെ ആലങ്കാരിക പ്രയോഗം മാത്രം വ്യക്തമാക്കുന്നു.
- issue: δουλείαയുടെ അർഥശക്തി
  choice: അടിമത്തം
  alternative: ദാസ്യം / അധീനത
  rationale: രണ്ടു ഉടമ്പടികൾ തമ്മിലുള്ള പൗലോസിന്റെ വൈരുധ്യത്തിൽ ബന്ധിതമായ അവസ്ഥയാണ് കേന്ദ്ര ആശയം; ‘അടിമത്തം’ അതിന്റെ ശക്തി മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്ന, എന്നാൽ തിരുവെഴുത്തിന് യോജിച്ച ഗൗരവമുള്ള മലയാളം. ‘ആലങ്കാരികമായി വ്യാഖ്യാനിക്കപ്പെടുന്നു’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും ഗ്രീക്കിലെ കർമണി രൂപവും വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വവും സംരക്ഷിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും മുഖ്യപാഠത്തിൽ ചേർത്തിരിക്കുന്നു.
