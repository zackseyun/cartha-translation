id: GAL.4.15
reference: Galatians 4:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: ml
  text: എന്നാൽ, നിങ്ങൾക്കുണ്ടായിരുന്ന ആ ഭാഗ്യബോധം എവിടെപ്പോയി?[a] സാധ്യമായിരുന്നെങ്കിൽ, നിങ്ങളുടെ കണ്ണുകൾ ചൂഴ്ന്നെടുത്ത്[b] എനിക്കു തരുമായിരുന്നു എന്നു ഞാൻ നിങ്ങളോടു സാക്ഷ്യപ്പെടുത്തുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ അനുഗൃഹീതാവസ്ഥ” അല്ലെങ്കിൽ “നിങ്ങളുടെ അനുഗ്രഹം.” ഗ്രീക്കുപദം അനുഗൃഹീതരായിരിക്കുന്ന അവസ്ഥയെയോ അങ്ങനെ പ്രഖ്യാപിക്കുന്നതിനെയോ സൂചിപ്പിക്കാം.
    reason: lexical_alternative
  - marker: b
    text: അക്ഷരാർഥത്തിൽ, “നിങ്ങളുടെ കണ്ണുകൾ ചൂഴ്ന്നെടുത്ത്.” ഇത് അവരുടെ മുൻകാല സമർപ്പണത്തെക്കുറിച്ചുള്ള അതിശയോക്തിയായിരിക്കാം; ചിലർ ഇത് പൗലോസിന്റെ ശരീരാവസ്ഥയെ സൂചിപ്പിക്കുന്നതായി കരുതുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: അപ്പോൾ ... എവിടെപ്പോയി?
  rationale: മുമ്പുണ്ടായിരുന്ന മനോഭാവത്തിന് ഇപ്പോൾ എന്തു സംഭവിച്ചു എന്നു ചോദിക്കുന്ന വാഗ്‌രൂപചോദ്യമായി സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു; οὖν-ന്റെ തുടർച്ചയും നിഗമനഭാവവും ‘അപ്പോൾ’ സൂചിപ്പിക്കുന്നു.
- source_word: ὁ μακαρισμὸς ὑμῶν
  choice: നിങ്ങൾക്കുണ്ടായിരുന്ന ആ ഭാഗ്യബോധം
  rationale: μακαρισμός അനുഗൃഹീതരായിരിക്കുന്ന അവസ്ഥയെയോ അങ്ങനെ കരുതുന്ന/പ്രഖ്യാപിക്കുന്ന മനോഭാവത്തെയോ സൂചിപ്പിക്കാം. പൗലോസിനെ സ്വീകരിച്ചതിൽ തങ്ങൾ ഭാഗ്യവാന്മാരാണെന്ന ഗലാത്യരുടെ മുൻകാല ബോധം സന്ദർഭത്തിൽ പ്രകടമാക്കുന്നു; അടിക്കുറിപ്പിൽ മറ്റു സാധ്യതകൾ നിലനിർത്തുന്നു.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: ഞാൻ നിങ്ങളെക്കുറിച്ച് സാക്ഷ്യപ്പെടുത്തുന്നു
  rationale: ഇവിടെ പൗലോസ് ഗലാത്യരുടെ മുൻകാല സമർപ്പണത്തിന് സാക്ഷ്യം പറയുന്നതിനാൽ ὑμῖν എന്നത് ‘നിങ്ങളെക്കുറിച്ച്/നിങ്ങൾക്കുവേണ്ടി’ എന്ന ആശയത്തിൽ സ്വാഭാവികമായി നൽകുന്നു; പ്രസ്താവനയുടെ ഗൗരവവും നിലനിർത്തുന്നു.
- source_word: ὅτι
  choice: എന്നു
  rationale: പൗലോസ് സാക്ഷ്യപ്പെടുത്തുന്നതിന്റെ ഉള്ളടക്കം പരിചയപ്പെടുത്തുന്നു; കാരണാർഥമായി വായിക്കുന്നില്ല.
- source_word: εἰ δυνατὸν
  choice: സാധ്യമായിരുന്നെങ്കിൽ
  rationale: സംഭവിക്കാത്ത ഒരു സാദ്ധ്യതയെ സന്ദർഭം സൂചിപ്പിക്കുന്നതിനാൽ മലയാളത്തിലെ ഭൂതകാല പ്രത്യയമുള്ള സോപാധികരൂപം സ്വാഭാവികമാണ്; ഗ്രീക്കിലെ സംക്ഷിപ്തതയും സംരക്ഷിക്കുന്നു.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: നിങ്ങളുടെ കണ്ണുകൾ ചൂഴ്ന്നെടുത്ത്
  rationale: ἐξορύσσω എന്ന ക്രിയയുടെ ശക്തവും ദൃശ്യവുമായ ‘ചൂഴ്ന്നെടുക്കുക’ എന്ന അർഥം മൃദൂകരിക്കാതെ സൂക്ഷിക്കുന്നു. കണ്ണുകളെക്കുറിച്ചുള്ള പരാമർശം അക്ഷരാർഥത്തിൽ നിലനിർത്തുന്നു.
- source_word: ἐδώκατέ μοι
  choice: എനിക്കു തരുമായിരുന്നു
  rationale: കണ്ണുകൾ എന്ന കർമം മുൻവാക്യഭാഗത്തിൽ വ്യക്തമായതിനാൽ മലയാളത്തിൽ ആവർത്തിക്കാതെ സ്വാഭാവികമായി നൽകുന്നു; സോപാധിക സാഹചര്യത്തിലെ ഫലവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: കണ്ണുകളെക്കുറിച്ചുള്ള ഭാഷയെ അക്ഷരരൂപത്തിൽ നിലനിർത്തണമോ പൊതുവായ ഔദാര്യപ്രകടനമായി മൃദൂകരിക്കണമോ
  choice: ‘നിങ്ങളുടെ കണ്ണുകൾ ചൂഴ്ന്നെടുത്ത് എനിക്കു തരുമായിരുന്നു’ എന്ന ദൃശ്യബിംബം നിലനിർത്തി.
  alternative: ‘നിങ്ങൾ എനിക്ക് എന്തും തരുമായിരുന്നു’ എന്ന പൊതുവായ പ്രയോഗം.
  rationale: ഗ്രീക്ക് പാഠം കണ്ണുകളെ വ്യക്തമായി പരാമർശിക്കുകയും ശക്തമായ ക്രിയ ഉപയോഗിക്കുകയും ചെയ്യുന്നു. ഇത് അതിശയോക്തിയായിരിക്കാം; പൗലോസിന്റെ ശരീരാവസ്ഥയെ സൂചിപ്പിക്കുന്നതായിരിക്കാനും ഇടയുണ്ട്. വിവർത്തനം ഈ വ്യാഖ്യാനങ്ങളിൽ ഒന്നിനെ തീർപ്പാക്കാതെ മൂലത്തിലെ ദൃശ്യബിംബം സംരക്ഷിക്കുന്നു.
- issue: μακαρισμός എന്നതിന്റെ അർഥപരിധി
  choice: പ്രധാനപാഠത്തിൽ ‘ഭാഗ്യബോധം’ ഉപയോഗിച്ചു; അനുഗൃഹീതാവസ്ഥയും അതിനെക്കുറിച്ചുള്ള ധാരണയും ഉൾക്കൊള്ളുന്ന മറ്റു സാധ്യതകൾ അടിക്കുറിപ്പിൽ നൽകി.
  alternative: ‘അനുഗൃഹീതാവസ്ഥ’ അല്ലെങ്കിൽ ‘അനുഗ്രഹം’ മാത്രം ഉപയോഗിക്കുക.
  rationale: സന്ദർഭത്തിൽ ഗലാത്യർ പൗലോസിനെ സ്വീകരിച്ചപ്പോൾ തങ്ങളെ ഭാഗ്യവാന്മാരായി കരുതിയ മുൻ മനോഭാവമാണ് മുൻനിൽക്കുന്നത്; എന്നാൽ പദത്തിന്റെ അവസ്ഥ/പ്രഖ്യാപനം എന്ന അർഥവ്യാപ്തി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. വാഗ്‌രൂപചോദ്യത്തിന്റെ ഊന്നലും കണ്ണുകളെക്കുറിച്ചുള്ള മൂലപാഠത്തിന്റെ ശക്തമായ ദൃശ്യബിംബവും നിലനിർത്തിയിരിക്കുന്നു; വ്യാഖ്യാനപരമായ അനിശ്ചിതത്വങ്ങൾ അടിക്കുറിപ്പുകളിൽ തുറന്നുവെക്കുന്നു.
