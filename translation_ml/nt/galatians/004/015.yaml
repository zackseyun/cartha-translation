    issue: “ഞാൻ നിങ്ങളെക്കുറിച്ച് സാക്ഷ്യപ്പെടുത്തുന്നു” renders μαρτυρῶ ὑμῖν inaccurately.
    rationale: 'ὑμῖν is the dative of the persons addressed: Paul testifies to the Galatians. The content clause concerns what they would have done, but the Greek does not say that Paul is testifying “about” them.'
