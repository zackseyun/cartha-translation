id: GAL.4.31
reference: Galatians 4:31
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: ml
  text: അതുകൊണ്ട്, സഹോദരന്മാരേ[a], നാം അടിമസ്ത്രീയുടെ മക്കളല്ല; മറിച്ച് സ്വതന്ത്രസ്ത്രീയുടെ മക്കളാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘സഹോദരീസഹോദരന്മാരേ’; ഗ്രീക്കിൽ ‘സഹോദരന്മാരേ’ എന്നാണ്. എങ്കിലും സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട ഒരു സമൂഹത്തെ പ്രതിനിധാനപരമായി അഭിസംബോധന ചെയ്യാനും ഈ പദം ഉപയോഗിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: അതുകൊണ്ട്
  rationale: മുൻപുള്ള സാദൃശ്യവ്യാഖ്യാനത്തിൽനിന്നുള്ള നിഗമനം സൂചിപ്പിക്കുന്നതിനാൽ ഗ്രീക്കിലെ അനുമാനാത്മക ബന്ധം സ്വാഭാവികമായി നിലനിർത്തുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചനത്തിലുള്ള സംബോധനരൂപം നിലനിർത്തുന്നു; മിശ്രലിംഗ സഭാസമൂഹത്തെയും പ്രതിനിധിയായി ഉൾക്കൊള്ളാനാകുന്ന പ്രയോഗമാണെന്ന കാര്യം അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκ ἐσμὲν
  choice: നാം ... അല്ല
  rationale: വർത്തമാനകാല നിഷേധം നേരിട്ട് പരിഭാഷപ്പെടുത്തുന്നു; മൂലത്തിൽ ഇല്ലാത്ത ‘ഇനി’ പോലുള്ള കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: παιδίσκης
  choice: അടിമസ്ത്രീയുടെ
  rationale: ഹാഗാറും സാറയും തമ്മിലുള്ള താരതമ്യത്തിൽ അടിമസ്ഥിതിയാണ് നിർണായകം; അതിനാൽ മൃദുവായ ‘ദാസി’ എന്നതിനെക്കാൾ ‘അടിമസ്ത്രീ’ വൈരുധ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗഭേദമില്ലാതെ സന്തതികളെയോ മക്കളെയോ സൂചിപ്പിക്കുന്ന പദത്തിന് സ്വാഭാവികമായ മലയാളരൂപം.
- source_word: ἀλλὰ
  choice: അല്ല, ... ആണ്
  rationale: മലയാളത്തിലെ നിഷേധാത്മക വൈരുധ്യഘടന ഉപയോഗിച്ച് രണ്ട് തിരിച്ചറിവുകൾ തമ്മിലുള്ള വ്യക്തമായ വിരോധം പ്രകടിപ്പിക്കുന്നു.
- source_word: τῆς ἐλευθέρας
  choice: സ്വതന്ത്രസ്ത്രീയുടെ
  rationale: സ്ത്രീലിംഗ വിശേഷണം നാമമായി ഉപയോഗിച്ച് സാറയെ സൂചിപ്പിക്കുന്നു; ‘സ്വതന്ത്രസ്ത്രീ’ സ്ത്രീയെക്കുറിച്ചുള്ള പരാമർശവും അടിമത്തത്തോടുള്ള വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: ഹാഗാറും സാറയും തമ്മിലുള്ള പൗലോസിന്റെ സാദൃശ്യപരമായ വൈരുധ്യം എത്ര വ്യക്തമായി നൽകണം
  choice: പ്രധാനപാഠത്തിൽ ‘അടിമസ്ത്രീ’ എന്നും ‘സ്വതന്ത്രസ്ത്രീ’ എന്നും നൽകുന്നു.
  alternative: ‘ദാസി ... സ്വതന്ത്രയായവൾ’
  rationale: ഗലാത്യർ 4:21–31-ലെ വാദത്തിൽ അടിമത്തവും സ്വാതന്ത്ര്യവും തമ്മിലുള്ള വൈരുധ്യം കേന്ദ്രസ്ഥാനത്താണ്; ഈ രൂപം അധികമായ സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കാതെ ആ മൂർച്ച നിലനിർത്തുന്നു.
- issue: മിശ്രലിംഗ സദസ്സിനോടുള്ള ἀδελφοί എന്ന സംബോധന എങ്ങനെ പരിഭാഷപ്പെടുത്തണം
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരന്മാരേ’ നിലനിർത്തി വിശാലമായ അഭിസംബോധന അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
  alternative: ‘സഹോദരീസഹോദരന്മാരേ’
  rationale: ഗ്രീക്കിലെ പുരുഷലിംഗ കുടുംബസംബോധന സംരക്ഷിക്കുമ്പോഴും അത് സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെട്ട സമൂഹത്തെ പ്രതിനിധിയായി അഭിസംബോധന ചെയ്യാമെന്ന അർഥം മറച്ചുവയ്ക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അടിമസ്ത്രീ/സ്വതന്ത്രസ്ത്രീ’ എന്ന സമാന്തരഘടന മൂലത്തിലെ സാമൂഹികവും ദൈവശാസ്ത്രപരവുമായ വൈരുധ്യം നിലനിർത്തുന്നു; വായനാസൗകര്യത്തിനായി രണ്ടാമത്തെ ‘മക്കൾ’ മലയാളത്തിൽ ആവർത്തിച്ചിരിക്കുന്നു.
