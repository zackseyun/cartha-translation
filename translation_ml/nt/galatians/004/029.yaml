  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: ml
  text: എന്നാൽ അന്ന് ജഡപ്രകാരം ജനിച്ചവൻ[a] ആത്മാവിൻപ്രകാരം ജനിച്ചവനെ[b] പീഡിപ്പിച്ചിരുന്നതുപോലെതന്നെ, ഇപ്പോഴും അങ്ങനെതന്നെയാണ്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ “സാധാരണ മാനുഷിക രീതിയിൽ ജനിച്ചവൻ”; അക്ഷരാർഥം: “ജഡപ്രകാരം ജനിച്ചവൻ.”'
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ “ആത്മാവിൻപ്രകാരമുള്ളവനെ”; സമാന്തരത വ്യക്തമാക്കാൻ ആദ്യ ഉപവാക്യത്തിലെ “ജനിച്ച” എന്ന പദം ഇവിടെ ചേർത്തിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തിലെ വിശദീകരണവുമായി വൈരുധ്യം സൂചിപ്പിക്കുന്ന സ്വാഭാവികമായ സംയോജകപദം.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: അന്ന് ... പോലെതന്നെ, ഇപ്പോഴും അങ്ങനെതന്നെയാണ്
  rationale: ഗ്രീക്കിലെ ഭൂതകാല–വർത്തമാനകാല താരതമ്യഘടന വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: ὁ κατὰ σάρκα γεννηθεὶς
  choice: ജഡപ്രകാരം ജനിച്ചവൻ
  rationale: σάρξ എന്ന പൗലോസിന്റെ പദം ‘ജഡം’ എന്നു നിലനിർത്തി, ഇവിടെ സാധാരണ മാനുഷിക ജനനമാണ് ഉദ്ദേശ്യമെന്ന വ്യാഖ്യാനസാധ്യത അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: ἐδίωκε
  choice: പീഡിപ്പിച്ചിരുന്നതു
  rationale: ശത്രുതാപരമായ ഉപദ്രവം എന്ന അർഥം നൽകുകയും അപൂർണഭൂതകാല ക്രിയയുടെ തുടർച്ചയോ പതിവോ സൂചിപ്പിക്കുകയും ചെയ്യുന്നു.
- source_word: τὸν κατὰ πνεῦμα
  choice: ആത്മാവിൻപ്രകാരം ജനിച്ചവനെ
  rationale: രണ്ടാം ഉപവാക്യത്തിൽ ഗ്രീക്കിൽ ‘ജനിച്ച’ എന്നത് അധ്യാഹരിക്കപ്പെട്ടതാണെങ്കിലും സമാന്തരഘടന മലയാളത്തിൽ വ്യക്തമാക്കാൻ അത് ആവർത്തിക്കുന്നു; κατά എന്നതിനെ കേവലം കരണാർഥത്തിലേക്ക് ചുരുക്കുന്നില്ല.
- source_word: πνεῦμα
  choice: ആത്മാവ്
  rationale: ഗലാത്യലേഖനത്തിലെ വാഗ്ദത്തം–ജഡം വൈരുധ്യത്തിന്റെ പശ്ചാത്തലത്തിൽ പരിശുദ്ധാത്മാവിനെയാണ് സൂചിപ്പിക്കുന്നതെന്ന വായന സ്വീകരിക്കുന്നു.
- source_word: νῦν
  choice: ഇപ്പോൾ
  rationale: പഴയ സംഭവരീതിയെ പൗലോസിന്റെ സമകാലിക സാഹചര്യവുമായി നേരിട്ട് ബന്ധിപ്പിക്കുന്ന ലളിതമായ കാലസൂചകം.
theological_decisions:
- issue: ഇശ്മായേൽ–യിസ്ഹാക്ക് വൈരുധ്യത്തിൽ κατὰ σάρκα എന്നതിന്റെ അർഥം
  choice: ‘ജഡപ്രകാരം’—സാധാരണ മാനുഷിക ജനനത്തിലൂടെ ജനിച്ചത്
  alternative: ‘പാപസ്വഭാവപ്രകാരം ജനിച്ചത്’ അല്ലെങ്കിൽ ‘ലൗകികമായി ജനിച്ചത്’
  rationale: ഗലാത്യർ 4:23, 29-ലെ സമീപസന്ദർഭം സ്വാഭാവിക മാനുഷിക ജനനത്തെയും വാഗ്ദത്തം/ആത്മാവ് അനുസരിച്ചുള്ള ജനനത്തെയും തമ്മിൽ താരതമ്യം ചെയ്യുന്നു; ഇവിടെ പാപസ്വഭാവം എന്ന അർഥം നിർബന്ധമല്ല.
- issue: πνεῦμα എന്നതിന്റെ സൂചിതാർഥം
  choice: പരിശുദ്ധാത്മാവ്
  alternative: മനുഷ്യാത്മാവ് അല്ലെങ്കിൽ പൊതുവായ ആത്മീയ തത്ത്വം
  rationale: സാറാ–ഹാഗാർ രൂപകത്തിലും വാഗ്ദത്തത്തിന്റെ മക്കളെക്കുറിച്ചുള്ള വിശാലസന്ദർഭത്തിലും ദൈവിക ആത്മാവാണ് ഏറ്റവും സാധ്യതയുള്ള സൂചിതാർഥം; എങ്കിലും മുഖ്യവാചകം ഗ്രീക്കിന്റെ സംക്ഷിപ്തത നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ വ്യക്തവും മാന്യവുമായ ശൈലി. ‘ജഡം’, ‘ആത്മാവ്’ എന്നീ പൗലോസിന്റെ പ്രധാന പദങ്ങൾ നിലനിർത്തിയപ്പോൾ അവയുടെ സന്ദർഭാർഥം അടിക്കുറിപ്പുകളിൽ വിശദീകരിച്ചു.
