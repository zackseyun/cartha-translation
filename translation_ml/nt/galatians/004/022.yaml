id: GAL.4.22
reference: Galatians 4:22
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: ml
  text: എന്തെന്നാൽ, അബ്രാഹാമിന് രണ്ടു പുത്രന്മാർ ഉണ്ടായിരുന്നു എന്ന് എഴുതിയിരിക്കുന്നുവല്ലോ—ഒരാൾ അടിമസ്ത്രീയിൽനിന്നും മറ്റൊരാൾ സ്വതന്ത്രസ്ത്രീയിൽനിന്നും.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: എഴുതിയിരിക്കുന്നുവല്ലോ
  rationale: തിരുവെഴുത്തിനെ ആധാരമാക്കുന്ന ഗ്രീക്ക് പൂർണകാല കർമണിപ്രയോഗത്തിന്റെ നിലനിൽക്കുന്ന പ്രാബല്യവും മലയാളത്തിലെ സ്വാഭാവികമായ ഉദ്ധരണിസൂത്രവും സംരക്ഷിക്കുന്നു.
- source_word: γὰρ
  choice: എന്തെന്നാൽ
  rationale: മുൻവാദത്തിന് വിശദീകരണാടിസ്ഥാനം നൽകുന്ന ബന്ധകശക്തി വ്യക്തമാക്കുന്നു.
- source_word: δύο υἱοὺς
  choice: രണ്ടു പുത്രന്മാർ
  rationale: υἱούς പൊതുവായ മക്കളെയല്ല, ആൺമക്കളെയാണ് സൂചിപ്പിക്കുന്നത്; 'പുത്രന്മാർ' dignifiedവും കൃത്യവുമാണ്.
- source_word: ἔσχεν
  choice: ഉണ്ടായിരുന്നു
  rationale: മാതാപിതൃബന്ധത്തിന്റെ സന്ദർഭത്തിൽ ἔσχεν എന്നതിന്റെ അർത്ഥം അധിക വ്യാഖ്യാനം ചേർക്കാതെ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἕνα ... καὶ ἕνα
  choice: ഒരാൾ ... മറ്റൊരാൾ
  rationale: ഗ്രീക്കിലെ സമാന്തരഘടന മലയാളത്തിൽ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
- source_word: ἐκ τῆς παιδίσκης
  choice: അടിമസ്ത്രീയിൽനിന്നും
  rationale: ἐκ മാതൃവംശബന്ധം സൂചിപ്പിക്കുന്നു; παιδίσκηയുടെ ബന്ധിത സാമൂഹികപദവിയും തുടർന്നുള്ള അടിമത്തം–സ്വാതന്ത്ര്യം വൈരുധ്യവും വ്യക്തമാക്കുന്നു.
- source_word: ἐκ τῆς ἐλευθέρας
  choice: സ്വതന്ത്രസ്ത്രീയിൽനിന്നും
  rationale: സുബ്സ്റ്റാന്റീവ് വിശേഷണമായ ἐλευθέρας സ്ത്രീയുടെ സ്വതന്ത്ര സാമൂഹികപദവിയെ സൂചിപ്പിക്കുന്നു; ആദ്യ പദവുമായി സമാന്തരത നിലനിർത്തുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ വാദത്തിലെ അടിമത്തം–സ്വാതന്ത്ര്യം എന്ന സാമൂഹികവും ദൈവശാസ്ത്രപരവുമായ വൈരുധ്യം
  choice: παιδίσκη/ἐλευθέρα എന്നവയെ 'അടിമസ്ത്രീ'/'സ്വതന്ത്രസ്ത്രീ' എന്ന് പരിഭാഷപ്പെടുത്തുക
  alternative: '''ദാസി''/''സ്വതന്ത്രസ്ത്രീ'''
  rationale: '''അടിമസ്ത്രീ'' എന്നത് നിയമ-സാമൂഹിക ബന്ധിതാവസ്ഥയെ വ്യക്തമായി കാണിക്കുകയും ചുറ്റുപാടിലുള്ള പൗലോസിന്റെ വാദത്തിലെ അടിമത്തം–സ്വാതന്ത്ര്യം വൈരുധ്യം മങ്ങാതിരിക്കാൻ സഹായിക്കുകയും ചെയ്യുന്നു; അതേസമയം വാചകത്തിന് പുറത്തുള്ള സിദ്ധാന്തം ചേർക്കുന്നില്ല.'
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. 'എഴുതിയിരിക്കുന്നുവല്ലോ' എന്ന രൂപം വാദാത്മക ബന്ധവും തിരുവെഴുത്തിന്റെ നിലവിലുള്ള പ്രാബല്യവും ഒരുമിച്ച് നൽകുന്നു. ഗ്രീക്കിലെ ἐκ ആവർത്തനത്തിന് അനുസരിച്ച് രണ്ടു ഭാഗങ്ങളിലും 'യിൽനിന്നും' നിലനിർത്തി.
