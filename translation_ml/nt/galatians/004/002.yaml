revisions:
- from: പകരം, പിതാവ് നിശ്ചയിച്ച സമയംവരെ അവൻ രക്ഷാകർത്താക്കളുടെയും കാര്യസ്ഥന്മാരുടെയും കീഴിലാണ്[a][b].
  to: എന്നാൽ, അവന്റെ പിതാവ് നിയമിച്ച സമയംവരെ അവൻ സംരക്ഷകരുടെയും കാര്യസ്ഥന്മാരുടെയും കീഴിലാണ്[a][b].
  rationale: എന്നാൽ restores the ordinary adversative force of ἀλλά. സംരക്ഷകർ more accurately denotes guardians or supervisors appointed over a minor, distinct from കാര്യസ്ഥന്മാർ, who manage household or estate affairs. അവന്റെ പിതാവ് നിയമിച്ച retains the contextually likely sense that the father fixes the appointed time; footnote b preserves the more literal genitive-based alternative.
