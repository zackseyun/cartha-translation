  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: ml
  text: എന്നാൽ, അവന്റെ പിതാവ് നിയമിച്ച സമയംവരെ അവൻ സംരക്ഷകരുടെയും കാര്യസ്ഥന്മാരുടെയും കീഴിലാണ്[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘കാര്യസ്ഥന്മാർ’ എന്നതിന് ‘വീടിന്റെയോ സ്വത്തിന്റെയോ നടത്തിപ്പുകാർ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
  - marker: b
    text: അല്ലെങ്കിൽ, ‘പിതാവിന്റെ നിശ്ചിത സമയംവരെ’ എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: പകരം
  rationale: മുൻവാക്യത്തിലെ അവകാശിയായിരിക്കുമ്പോഴും അടിമയിൽനിന്ന് വ്യത്യാസമില്ലെന്ന ആശയത്തെ വിശദീകരിക്കുന്ന വൈരുധ്യം സ്വാഭാവികമായി ബന്ധിപ്പിക്കുന്നു.
- source_word: ὑπὸ
  choice: കീഴിലാണ്
  rationale: അധികാരത്തിനും മേൽനോട്ടത്തിനും വിധേയനായിരിക്കുന്ന സ്ഥിതി വ്യക്തമാക്കുകയും ഗ്രീക്കിലെ അധീനതാഭാവം നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἐπιτρόπους
  choice: രക്ഷാകർത്താക്കൾ
  rationale: പ്രായപൂർത്തിയാകാത്ത അവകാശിയുടെ വ്യക്തിപരമായ സംരക്ഷണവും മേൽനോട്ടവും ഏൽക്കപ്പെട്ടവരെ സൂചിപ്പിക്കുന്നു.
- source_word: οἰκονόμους
  choice: കാര്യസ്ഥന്മാർ
  rationale: വീടിന്റെയോ സ്വത്തിന്റെയോ കാര്യങ്ങൾ കൈകാര്യം ചെയ്യുന്നവരെ സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പദത്തിന്റെ ചരിത്രപരമായ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἄχρι τῆς προθεσμίας
  choice: നിശ്ചയിച്ച സമയംവരെ
  rationale: മുൻകൂട്ടി നിശ്ചയിക്കപ്പെട്ട സമയപരിധി എന്ന ആശയം വ്യക്തവും സ്വാഭാവികവുമായി അറിയിക്കുന്നു.
- source_word: τοῦ πατρός
  choice: പിതാവ്
  rationale: സന്ദർഭത്തിൽ സമയം നിശ്ചയിക്കുന്ന വ്യക്തി പിതാവാണെന്ന കർത്തൃബന്ധം മലയാളത്തിൽ വ്യക്തമായി പ്രകടിപ്പിക്കുന്നു; 'അവന്റെ' എന്നത് അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: τοῦ πατρός എന്ന ജനിറ്റീവിന്റെ അർഥം
  choice: 'സമയം നിശ്ചയിക്കുന്ന കർത്താവായി പിതാവിനെ അവതരിപ്പിച്ചു: ‘പിതാവ് നിശ്ചയിച്ച’.'
  alternative: ‘പിതാവിന്റെ നിശ്ചിത സമയംവരെ’ അല്ലെങ്കിൽ കൂടുതൽ പദാനുപദമായി ‘പിതാവിന്റെ സമയംവരെ’.
  rationale: പ്രായപൂർത്തിയാകാത്ത അവകാശിയെക്കുറിച്ചുള്ള ഉപമയിൽ കാലം നിശ്ചയിക്കുന്നത് പിതാവാണെന്നതാണ് സന്ദർഭസഹജമായ അർഥം. എന്നിരുന്നാലും ജനിറ്റീവിന്റെ കൂടുതൽ പദാനുപദ രൂപം അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, ലളിതവും മാന്യവുമായ മലയാളം. ‘രക്ഷാകർത്താക്കൾ’ വ്യക്തിയുടെ മേൽനോട്ടത്തെയും ‘കാര്യസ്ഥന്മാർ’ വീടിന്റെയോ സ്വത്തിന്റെയോ നടത്തിപ്പിനെയും വേർതിരിക്കുന്നു. പ്രധാനപാഠത്തിലെ എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
