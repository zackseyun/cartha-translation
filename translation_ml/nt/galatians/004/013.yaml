revisions:
- from: എന്നാൽ, എന്റെ ശരീരത്തിന്റെ അസുഖം നിമിത്തമാണ് ഞാൻ ആദ്യമായി നിങ്ങളോടു സുവാർത്ത അറിയിച്ചതെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.[a]
  to: എന്നാൽ, ശാരീരികമായ ഒരു അസുഖം നിമിത്തമാണ് ഞാൻ ആദ്യം നിങ്ങളോടു സുവാർത്ത അറിയിച്ചതെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.[a]
  rationale: The revision removes the added possessive, improves idiomatic Malayalam, and keeps the source’s ambiguity between illness and weakness available in the footnote. The physical—not ethical—reference of σάρξ is retained without imposing a theological interpretation.
