source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: ml
  text: എന്നാൽ, ശാരീരികമായ ഒരു അസുഖം നിമിത്തമാണ് ഞാൻ ആദ്യം നിങ്ങളോടു സുവാർത്ത അറിയിച്ചതെന്ന് നിങ്ങൾക്കറിയാമല്ലോ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘ശാരീരിക ബലഹീനത നിമിത്തം.’ ഗ്രീക്കിൽ അക്ഷരാർഥത്തിൽ, ‘മാംസത്തിന്റെ അസുഖം/ബലഹീനത നിമിത്തം’ എന്നാണ്; ഇവിടെ അത് ശാരീരികമായ അവസ്ഥയെ സൂചിപ്പിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: നിങ്ങൾക്കറിയാമല്ലോ
  rationale: οἶδα വർത്തമാനകാല അർഥത്തിൽ വരുന്നു. സന്ദർഭത്തിൽ പൗലോസ് വായനക്കാരുടെ മുൻ അറിവിനെ ഓർമിപ്പിക്കുന്നതിനാൽ ‘അറിയാമല്ലോ’ സ്വാഭാവികമാണ്.
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള മൃദുവായ വ്യത്യാസവും ആശയമാറ്റവും സൂചിപ്പിക്കുന്നു.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: എന്റെ ശരീരത്തിന്റെ അസുഖം നിമിത്തം
  rationale: διά + accusative ഇവിടെ കാരണം സൂചിപ്പിക്കുന്നു. ἀσθένεια ‘അസുഖം’ എന്നും ‘ബലഹീനത’ എന്നും അർഥമാകാം; τῆς σαρκός അതിനെ ശാരീരിക അവസ്ഥയായി നിർണയിക്കുന്നു. പ്രധാന പാഠം സാധ്യതയേറിയ ‘അസുഖം’ സ്വീകരിക്കുകയും മറ്റർഥം അടിക്കുറിപ്പിൽ നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: εὐηγγελισάμην
  choice: സുവാർത്ത അറിയിച്ചു
  rationale: സുവാർത്താപരമായ പ്രഖ്യാപനത്തിന്റെ ക്രിയാബലം സാധാരണ വായനക്കാർക്ക് വ്യക്തമായി നൽകുന്നു.
- source_word: ὑμῖν
  choice: നിങ്ങളോട്
  rationale: ദാതൃവിഭക്തിയിലെ പരോക്ഷ കർമത്തെ മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു.
- source_word: τὸ πρότερον
  choice: ആദ്യമായി
  rationale: പൗലോസ് അവരോടു സുവാർത്ത അറിയിച്ച ആദ്യ അവസരത്തെയോ ആദ്യ സന്ദർശനത്തെയോ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളരൂപം.
theological_decisions:
- issue: ἀσθένειαν τῆς σαρκὸς എന്നതിലെ σάρξ എന്ന പദത്തിന്റെ അർഥം
  choice: 'ശാരീരിക അർഥം: ‘ശരീരത്തിന്റെ അസുഖം’'
  alternative: ‘ശാരീരിക ബലഹീനത’; രൂപകാലങ്കാരപരമായ ബലഹീനത; പാപസ്വഭാവം
  rationale: സന്ദർഭം പൗലോസിന്റെ മുൻകാല ശാരീരിക അവസ്ഥയെക്കുറിച്ചാണ്; ധാർമിക ദുഷ്ടതയെയോ ‘പാപസ്വഭാവം’ എന്ന ആശയത്തെയോ പാഠം ഇവിടെ സൂചിപ്പിക്കുന്നില്ല. എങ്കിലും ἀσθένεια എന്നതിലെ അസുഖം/ബലഹീനത എന്ന യഥാർഥ അർഥവ്യാപ്തി അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘സുവാർത്ത അറിയിച്ചു’ സഭാപരമായ സാങ്കേതികപദപ്രയോഗം ഒഴിവാക്കിക്കൊണ്ട് മൂലക്രിയയുടെ പ്രഖ്യാപനാർഥം നിലനിർത്തുന്നു. ‘അറിയാമല്ലോ’ പൗലോസിന്റെ ഓർമിപ്പിക്കുന്ന ഭാവം സ്വാഭാവികമായി പകരുന്നു.
