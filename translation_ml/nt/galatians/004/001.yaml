id: GAL.4.1
reference: Galatians 4:1
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: ml
  text: 'ഞാൻ പറയുന്നത് ഇതാണ്: അവകാശി ഒരു കുട്ടിയായിരിക്കുന്നിടത്തോളം[a], എല്ലാറ്റിന്റെയും ഉടമയായിരുന്നാലും, ഒരു അടിമയിൽനിന്ന്[b] ഒട്ടും വ്യത്യസ്തനല്ല.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘പ്രായപൂർത്തിയാകാത്തവൻ.’ ഗ്രീക്കിലെ νήπιος എന്ന പദം ഒരു ചെറിയ കുട്ടിയെയോ പക്വതയെത്താത്തവനെയോ സൂചിപ്പിക്കാം; ഇവിടെ നിയമപരമായി പ്രായപൂർത്തിയായിട്ടില്ലാത്ത അവകാശിയെയാണ് ഉദ്ദേശിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ദാസനിൽനിന്ന്.’ ഗ്രീക്കിലെ δοῦλος സാധാരണയായി മറ്റൊരാളുടെ ഉടമസ്ഥതയിലോ അധികാരത്തിലോ ഉള്ള അടിമയെ സൂചിപ്പിക്കുന്നു; പൗലോസിന്റെ താരതമ്യത്തിന്റെ ശക്തി നിലനിർത്താൻ മുഖ്യപാഠത്തിൽ ‘അടിമ’ എന്നു നൽകിയിരിക്കുന്നു.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: ഞാൻ പറയുന്നത് ഇതാണ്
  rationale: λέγω വിശദീകരണം അവതരിപ്പിക്കുന്നു; δέയുടെ മൃദുവായ സംക്രമണബലം മലയാളത്തിലെ സ്വാഭാവികമായ ഈ ആമുഖഘടനയിൽ പ്രതിഫലിക്കുന്നു, എന്നാൽ അനാവശ്യമായി ശക്തമായ വൈരുധ്യം സൃഷ്ടിക്കുന്നില്ല.
- source_word: ἐφ’ ὅσον χρόνον
  choice: ആയിരിക്കുന്നിടത്തോളം
  rationale: ഒരു പരിധിവരെയുള്ള കാലദൈർഘ്യം സൂചിപ്പിക്കുന്ന ഗ്രീക്ക് പ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ പകർത്തുന്നു.
- source_word: ὁ κληρονόμος
  choice: അവകാശി
  rationale: സ്വത്ത് അവകാശമായി ലഭിക്കേണ്ട വ്യക്തിയെ സൂചിപ്പിക്കുന്ന, സാധാരണ വായനക്കാർക്ക് പരിചിതമായ മലയാളപദം.
- source_word: νήπιός
  choice: ഒരു കുട്ടി
  rationale: νήπιος ശിശുവിനെയോ പ്രായപൂർത്തിയാകാത്ത കുട്ടിയെയോ സൂചിപ്പിക്കാം; അവകാശത്തിന്റെ ഉപമയിൽ പ്രായപൂർത്തിയാകാത്ത നിലയാണ് പ്രസക്തം. ‘കുട്ടി’ സ്വാഭാവികമാണ്; കൂടുതൽ നിയമസാങ്കേതികമായ അർഥം അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: οὐδὲν διαφέρει
  choice: ഒട്ടും വ്യത്യസ്തനല്ല
  rationale: പ്രായോഗികമായി യാതൊരു വ്യത്യാസവുമില്ലെന്ന ശക്തമായ നിഷേധം വ്യക്തവും സ്വാഭാവികവുമായി നൽകുന്നു.
- source_word: δούλου
  choice: ഒരു അടിമയിൽനിന്ന്
  rationale: δοῦλος ഇവിടെ മറ്റൊരാളുടെ അധികാരത്തിനു കീഴിലുള്ള ബന്ധിതാവസ്ഥയെ സൂചിപ്പിക്കുന്നു; പൗലോസിന്റെ താരതമ്യത്തിന്റെ ശക്തി നിലനിർത്താൻ ‘അടിമ’ അനുയോജ്യം.
- source_word: κύριος πάντων ὤν
  choice: എല്ലാറ്റിന്റെയും ഉടമയായിരുന്നാലും
  rationale: ഇവിടെ κύριος ദൈവിക സ്ഥാനപ്പേരല്ല, ഉടമസ്ഥതയെയും അധികാരത്തെയും സൂചിപ്പിക്കുന്നു. കർത്തൃവാചകത്തിന് സന്ദർഭത്തിൽ അന്തർലീനമായ concessive ഭാവം ‘ആയിരുന്നാലും’ വ്യക്തമാക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ഉപമയിലെ δοῦλος എന്ന പദത്തിന്റെ പരിഭാഷ
  choice: അടിമ
  alternative: ദാസൻ / സേവകൻ
  rationale: അവകാശിക്ക് താൽക്കാലികമായി സ്വാതന്ത്ര്യമോ പ്രായോഗിക അധികാരമോ ഇല്ലെന്ന താരതമ്യത്തിന് ബന്ധിതാവസ്ഥ നിർണായകമാണ്. ‘അടിമ’ ആ ശക്തി സുതാര്യമായി നിലനിർത്തുന്നു; ‘സേവകൻ’ അതിനെ ദുർബലപ്പെടുത്താം.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് എളുപ്പം ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. അവകാശവുമായി ബന്ധപ്പെട്ട ഉപമയിലെ നിയമപരമായ സൂചന നിലനിർത്തിക്കൊണ്ട് അത്യധികം സാങ്കേതികമായ ഭാഷ ഒഴിവാക്കി. ഗ്രീക്ക് വാക്യത്തിലെ concessive ബന്ധം മലയാളത്തിൽ സ്വാഭാവികമായി വ്യക്തമാക്കി.
