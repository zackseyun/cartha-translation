id: GAL.4.30
reference: Galatians 4:30
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: ml
  text: എന്നാൽ തിരുവെഴുത്ത് എന്താണ് പറയുന്നത്? “അടിമസ്ത്രീയെയും[a] അവളുടെ മകനെയും പുറത്താക്കുക[b]; കാരണം അടിമസ്ത്രീയുടെ മകന് സ്വതന്ത്രസ്ത്രീയുടെ മകനോടൊപ്പം അനന്തരാവകാശം ലഭിക്കുകയേയില്ല[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ദാസി” എന്നും പരിഭാഷപ്പെടുത്താം. ഗ്രീക്കുപദം അടിമനിലയിലുള്ള സ്ത്രീയെ സൂചിപ്പിക്കുന്നു; ഈ ഭാഗത്തിലെ അടിമത്തം–സ്വാതന്ത്ര്യം വൈരുധ്യം വ്യക്തമാക്കാൻ “അടിമസ്ത്രീ” എന്നു പരിഭാഷപ്പെടുത്തി.
    reason: lexical_alternative
  - marker: b
    text: ഈ ഉദ്ധരണി ഉല്പത്തി 21:10-നെ പ്രതിധ്വനിപ്പിക്കുന്നു.
    reason: cross_reference
  - marker: c
    text: 'ഗ്രീക്കിൽ ഊന്നിയ നിഷേധമാണ്: “അനന്തരാവകാശം ലഭിക്കുകയേയില്ല”; “ഒരിക്കലും അനന്തരാവകാശം ലഭിക്കില്ല” എന്നും പരിഭാഷപ്പെടുത്താം.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള വൈരുധ്യപരമായ തിരിവ് സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: τί λέγει ἡ γραφή
  choice: തിരുവെഴുത്ത് എന്താണ് പറയുന്നത്
  rationale: വർത്തമാനകാലവും തിരുവെഴുത്തിനെ സംസാരിക്കുന്ന അധികാരമായി അവതരിപ്പിക്കുന്ന ഉദ്ധരണിസൂത്രവും നിലനിർത്തുന്നു.
- source_word: Ἔκβαλε
  choice: പുറത്താക്കുക
  rationale: ἐκβάλλω സൂചിപ്പിക്കുന്ന ശക്തമായ പുറത്താക്കൽ കല്പനയെ മൃദൂകരിക്കാതെ സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: παιδίσκην
  choice: അടിമസ്ത്രീ
  rationale: സ്ത്രീയുടെ അടിമനിലയാണ് പദം സൂചിപ്പിക്കുന്നത്; ഈ ഭാഗത്തിലെ അടിമത്തം–സ്വാതന്ത്ര്യം വൈരുധ്യം വ്യക്തമായി നിലനിർത്തുന്നു.
- source_word: υἱὸν αὐτῆς
  choice: അവളുടെ മകൻ
  rationale: ഗ്രീക്കിലെ ലളിതമായ ഉടമസ്ഥബന്ധം അധിക വ്യാഖ്യാനം കൂടാതെ പുനരാവിഷ്കരിക്കുന്നു.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: കാരണം ... അവകാശം ലഭിക്കുകയേയില്ല
  rationale: οὐ μή എന്ന ഊന്നിയ നിഷേധത്തെ മലയാളത്തിലെ ‘-യേയില്ല’ രൂപം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
- source_word: μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας
  choice: സ്വതന്ത്രസ്ത്രീയുടെ മകനോടൊപ്പം
  rationale: പങ്കുചേരലിനെയോ സഹാവകാശത്തെയോ സൂചിപ്പിക്കുന്ന μετάയും നാമമായി പ്രയോഗിച്ചിരിക്കുന്ന ‘സ്വതന്ത്രയായവൾ’ എന്ന വിശേഷണവും വ്യക്തമായി നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ ഹാഗാർ–സാറാ രൂപകത്തിലെ παιδίσκη എന്ന പദം
  choice: അടിമസ്ത്രീ
  alternative: ദാസി / വേലക്കാരി
  rationale: സമീപസന്ദർഭത്തിലെ കേന്ദ്രവൈരുധ്യം അടിമത്തവും സ്വാതന്ത്ര്യവും തമ്മിലുള്ളതാണ്. ‘ദാസി’യോ ‘വേലക്കാരി’യോ അടിമനിലയെ മങ്ങിയതാക്കാം; ‘അടിമസ്ത്രീ’ ആ ഘടകം വ്യക്തമായി സംരക്ഷിക്കുന്നു.
- issue: οὐ γὰρ μὴ κληρονομήσει എന്നതിലെ നിഷേധത്തിന്റെ ശക്തി
  choice: അവകാശം ലഭിക്കുകയേയില്ല
  alternative: അവകാശം ലഭിക്കില്ല / ഒരിക്കലും അവകാശം ലഭിക്കില്ല
  rationale: ഗ്രീക്കിലെ ഊന്നിയ നിഷേധം നിലനിർത്തുന്നു; അതേസമയം വാക്യം പറയുന്നതിലപ്പുറം ഒരു പ്രത്യേക ദൈവശാസ്ത്രവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ ശൈലി. ‘പുറത്താക്കുക’ ഉദ്ധരണിയിലെ കാഠിന്യവും ‘-യേയില്ല’ ഊന്നിയ നിഷേധവും സംരക്ഷിക്കുന്നു; അനാവശ്യമായ പാരമ്പര്യഭാഷയും വിഭാഗീയ പദപ്രയോഗവും ഒഴിവാക്കി.
