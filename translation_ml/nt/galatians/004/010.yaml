  text: You are carefully observing days and months and seasons and years.
translation:
  language: ml
  text: നിങ്ങൾ ദിവസങ്ങളും മാസങ്ങളും കാലങ്ങളും വർഷങ്ങളും സൂക്ഷ്മമായി ആചരിക്കുന്നു.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങൾ ദിവസങ്ങളും മാസങ്ങളും നിശ്ചിത സമയങ്ങളും വർഷങ്ങളും ആചരിക്കുന്നു.” ഇവിടെ പറയുന്ന പട്ടിക കലണ്ടറനുസരിച്ചുള്ള ആചരണങ്ങളെ സൂചിപ്പിക്കുന്നു; “കാലങ്ങൾ” (καιρούς) എന്നതിന് “നിശ്ചിത സമയങ്ങൾ” എന്നും പരിഭാഷപ്പെടുത്താം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: ദിവസങ്ങൾ
  rationale: ἡμέραയുടെ ബഹുവചനത്തെ ലളിതമായി നിലനിർത്തുന്നു; മതപരമായ കലണ്ടർസന്ദർഭം വാക്യത്തിന്റെ പശ്ചാത്തലത്തിൽനിന്ന് വ്യക്തമാകട്ടെ.
- source_word: παρατηρεῖσθε
  choice: സൂക്ഷ്മമായി ആചരിക്കുന്നു
  rationale: വർത്തമാനകാല ക്രിയയുടെ തുടരുന്ന പ്രവൃത്തിയും ശ്രദ്ധാപൂർവമായ ആചരണത്തിന്റെ സൂചനയും സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: μῆνας
  choice: മാസങ്ങൾ
  rationale: μήν എന്ന പദത്തിന്റെ നേരിട്ടുള്ള കലണ്ടർ അർഥം.
- source_word: καιρούς
  choice: കാലങ്ങൾ
  rationale: നിശ്ചിതമോ അനുയോജ്യമോ ആയ സമയങ്ങളെ സൂചിപ്പിക്കാവുന്ന καιρός എന്ന പദത്തിന്റെ വ്യാപ്തി കാത്തുസൂക്ഷിക്കുന്നു; ‘ഉത്സവങ്ങൾ’ എന്ന് അമിതമായി നിർവചിക്കുന്നില്ല.
- source_word: ἐνιαυτούς
  choice: വർഷങ്ങൾ
  rationale: ἐνιαυτός എന്ന പദത്തിന്റെ നേരിട്ടുള്ള അർഥം; പട്ടികയുടെ ക്രമം പൂർത്തിയാക്കുന്നു.
- source_word: καὶ
  choice: -കളും / ഉം
  rationale: ആവർത്തിക്കുന്ന καὶയുടെ സമാഹാരാത്മക താളം മലയാളത്തിലെ ഏകോപക പ്രത്യയങ്ങളിലൂടെ സ്വാഭാവികമായി പുനരാവിഷ്കരിക്കുന്നു.
theological_decisions:
- issue: ഇവ യെഹൂദമതപരമോ വിശുദ്ധമോ ആയ കലണ്ടർ ആചരണങ്ങളാണെന്ന് മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കണമോ
  choice: ‘ദിവസങ്ങൾ, മാസങ്ങൾ, കാലങ്ങൾ, വർഷങ്ങൾ’ എന്ന സമയപദങ്ങൾ വിശേഷണങ്ങളില്ലാതെ നിലനിർത്തി.
  alternative: ‘വിശേഷ ദിവസങ്ങൾ’ അല്ലെങ്കിൽ ‘മതപരമായ ദിവസങ്ങൾ’ എന്നു വ്യക്തമാക്കുക.
  rationale: ഗ്രീക്ക് വാചകം സമയഘടകങ്ങൾക്കു വിശേഷണങ്ങൾ ചേർക്കുന്നില്ല. ആചാരപരമായ കലണ്ടർസന്ദർഭം പശ്ചാത്തലത്തിൽ സൂചിതമാണെങ്കിലും അത് മുഖ്യവാചകത്തിൽ അധികമായി നിർവചിക്കരുത്.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ ലളിതവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘ആചരിക്കുന്നു’ എന്നത് കലണ്ടർക്രമത്തിലുള്ള മതാചരണസന്ദർഭത്തിൽ ‘നിരീക്ഷിക്കുന്നു’ എന്നതിനെക്കാൾ സ്വാഭാവികം; ‘സൂക്ഷ്മമായി’ ക്രിയയിലെ ശ്രദ്ധാപൂർവമായ ആചരണസൂചന നിലനിർത്തുന്നു.
