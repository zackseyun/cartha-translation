id: GAL.4.7
reference: Galatians 4:7
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: ml
  text: അതുകൊണ്ട് നീ ഇനി അടിമയല്ല, മകനാണ്[a]; മകനാണെങ്കിൽ, ദൈവത്തിലൂടെ അവകാശിയും ആണ്[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘കുട്ടി.’ ഗ്രീക്കിൽ ‘മകൻ’ എന്നാണ്. പൗലോസിന്റെ ദത്തെടുക്കൽ–അവകാശ വാദത്തിന്റെ ആശയബന്ധം ഈ പദം നിലനിർത്തുന്നു; എന്നാൽ ഈ സ്ഥാനം എല്ലാ വിശ്വാസികൾക്കും ബാധകമാണ്.
    reason: lexical_alternative
  - marker: b
    text: ചില കൈയെഴുത്തുപ്രതികളിൽ ‘ക്രിസ്തുവിലൂടെ ദൈവത്തിന്റെ അവകാശി’ (അഥവാ, ‘മിശിഹായിലൂടെ ദൈവത്തിന്റെ അവകാശി’) എന്നു വായിക്കുന്നു.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: അതുകൊണ്ട്
  rationale: മുൻവാദത്തിൽനിന്നുള്ള നിഗമനം സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ വ്യക്തമാക്കുന്നു.
- source_word: οὐκέτι
  choice: ഇനി ... അല്ല
  rationale: നിലയിൽ വന്ന മാറ്റം സൂചിപ്പിക്കുന്ന കാലപരമായ നിഷേധം കൃത്യമായി നിലനിർത്തുന്നു.
- source_word: δοῦλος
  choice: അടിമ
  rationale: പുത്രത്വത്തോടും അവകാശത്തോടും വിപരീതമായി നിൽക്കുന്ന ബന്ധിതാവസ്ഥ ഇവിടെ പ്രാധാന്യമുള്ളതിനാൽ ശക്തമായ അർഥം സംരക്ഷിക്കുന്നു.
- source_word: υἱός
  choice: മകൻ
  rationale: ഗ്രീക്കിലെ പുല്ലിംഗ ഏകവചനവും ദത്തെടുക്കൽ–അവകാശ പാരമ്പര്യത്തിന്റെ നിയമപരമായ ആശയബന്ധവും സംരക്ഷിക്കുന്നു; ഇത് എല്ലാ വിശ്വാസികൾക്കും ബാധകമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κληρονόμος
  choice: അവകാശി
  rationale: അവകാശമായി ലഭിക്കുന്ന സമ്പത്തിന്റെയോ സ്ഥാനത്തിന്റെയോ അവകാശിയെ സൂചിപ്പിക്കുന്ന സ്വാഭാവിക മലയാളപദം.
- source_word: διὰ θεοῦ
  choice: ദൈവത്തിലൂടെ
  rationale: SBLGNT-യിലെ διά + genitive ഘടനയുടെ മധ്യസ്ഥത/കർതൃത്വസൂചനയെ അനാവശ്യമായി വ്യാഖ്യാനിക്കാതെ നേരിട്ട് സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: υἱός എന്ന ലിംഗസൂചക പുത്രഭാഷ
  choice: മകൻ
  alternative: കുട്ടി / ദൈവത്തിന്റെ കുഞ്ഞ്
  rationale: പൗലോസിന്റെ ദത്തെടുക്കൽ–അവകാശ വാദത്തിലെ നിയമപരമായ പുത്രസ്ഥാന സൂചന നഷ്ടപ്പെടാതിരിക്കാൻ ‘മകൻ’ നിലനിർത്തുന്നു; ഈ സ്ഥാനം സ്ത്രീപുരുഷഭേദമില്ലാതെ വിശ്വാസികൾക്കെല്ലാം ബാധകമാണെന്ന് അടിക്കുറിപ്പിൽ പറയുന്നു.
- issue: വാക്യാന്ത്യത്തിലെ പാഠഭേദം
  choice: ദൈവത്തിലൂടെ
  alternative: ക്രിസ്തുവിലൂടെ ദൈവത്തിന്റെ അവകാശി / മശീഹയിലൂടെ ദൈവത്തിന്റെ അവകാശി
  rationale: നൽകിയിരിക്കുന്ന SBLGNT പാഠം διὰ θεοῦ എന്നാണ്; അതിനാൽ മുഖ്യപാഠം അതനുസരിക്കുന്നു, ശ്രദ്ധേയമായ കൈയെഴുത്തുപ്രതി വ്യത്യാസം അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. രണ്ടാംപുരുഷ ഏകവചനമായ ‘നീ’ ഗ്രീക്കിലെ εἶ എന്ന രൂപത്തെ പിന്തുടരുന്നു. ചെറുവാക്യങ്ങളിലൂടെ പൗലോസിന്റെ നിഗമനക്രമം നിലനിർത്തിയിരിക്കുന്നു.
