id: GAL.4.28
reference: Galatians 4:28
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: ml
  text: എന്നാൽ സഹോദരന്മാരേ,[a] നിങ്ങൾ യിസ്ഹാക്കിനെപ്പോലെ വാഗ്ദത്തത്തിന്റെ മക്കളാകുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘സഹോദരന്മാരേ’ എന്നത് ഇവിടെ പുരുഷലിംഗ ബഹുവചനത്തിലുള്ള സംബോധനയാണ്; സഭയെ പ്രതിനിധാനപരമായി അഭിസംബോധന ചെയ്യുന്ന ഈ പ്രയോഗത്തിൽ പുരുഷന്മാരും സ്ത്രീകളും ഉൾപ്പെടുന്നുവെന്ന് കരുതാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: നിങ്ങൾ
  rationale: രണ്ടാംപുരുഷ ബഹുവചന സർവനാമം വ്യക്തമായി നിലനിർത്തുന്നു; മലയാളത്തിൽ സ്വാഭാവികമായ ഊന്നൽ ലഭിക്കുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തിൽനിന്നുള്ള മൃദുവായ മാറ്റവും സന്ദർഭത്തിലുള്ള വൈരുധ്യവും സൂചിപ്പിക്കുന്നു; കാലസൂചന ചേർക്കുന്നില്ല.
- source_word: ἀδελφοί
  choice: സഹോദരന്മാരേ
  rationale: പുരുഷലിംഗ ബഹുവചന സംബോധനയുടെ രൂപം നിലനിർത്തുന്നു; സഭയിലെ സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്ന പ്രതിനിധാനപരമായ പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: κατὰ Ἰσαὰκ
  choice: യിസ്ഹാക്കിനെപ്പോലെ
  rationale: യിസ്ഹാക്ക് ഒരു മാതൃകയോ താരതമ്യബിന്ദുവോ ആണെന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐπαγγελίας
  choice: വാഗ്ദത്തത്തിന്റെ
  rationale: ‘വാഗ്ദത്തത്തിന്റെ മക്കൾ’ എന്ന പൗലോസീയ പ്രയോഗവും അതിന്റെ ദൈവശാസ്ത്രപരമായ അനുരണനവും സംരക്ഷിക്കുന്നു.
- source_word: τέκνα
  choice: മക്കൾ
  rationale: ലിംഗനിരപേക്ഷമായ സന്താനബന്ധവും കുടുംബസ്ഥാനവും സ്വാഭാവിക മലയാളത്തിൽ അറിയിക്കുന്നു.
- source_word: ἐστέ
  choice: ആകുന്നു
  rationale: രണ്ടാംപുരുഷ ബഹുവചന വർത്തമാനകാല ബന്ധകക്രിയയെ ഗൗരവമുള്ള, വായനാസൗകര്യമുള്ള ശൈലിയിൽ നൽകുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ രൂപകവാദത്തിൽ വിശ്വാസികളെ യിസ്ഹാക്കിനോടു ബന്ധപ്പെടുത്തുന്നത്
  choice: ‘യിസ്ഹാക്കിനെപ്പോലെ വാഗ്ദത്തത്തിന്റെ മക്കളാകുന്നു’
  alternative: ‘യിസ്ഹാക്കിനെപ്പോലെ വാഗ്ദത്തത്താൽ ജനിച്ച മക്കളാകുന്നു’
  rationale: ഗ്രീക്ക് വാക്യഘടനയിൽ യിസ്ഹാക്ക് താരതമ്യത്തിന്റെ മാതൃകയും ‘വാഗ്ദത്തത്തിന്റെ മക്കൾ’ വിധേയപൂരകവുമാണ്. ജനനത്തിന്റെ രീതി പോലുള്ള അധിക വിശദീകരണം ചേർക്കാതെ ഈ ബന്ധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിൽ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘വാഗ്ദത്തത്തിന്റെ മക്കൾ’ എന്ന ഉറവിടരൂപകം വ്യാഖ്യാനിച്ച് ലഘൂകരിക്കാതെ നിലനിർത്തി; സംബോധനയ്ക്കു പിന്നാലെ അടിക്കുറിപ്പ് ചിഹ്നം ചേർത്തു.
