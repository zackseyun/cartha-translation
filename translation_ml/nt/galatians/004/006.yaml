  alternative: വിശ്വാസികൾ ആത്മാവിനാൽ നിലവിളിക്കുന്നു
  rationale: κρᾶζον എന്ന നപുംസക ഏകവചന കൃദന്തം τὸ πνεῦμα എന്നതിനോടാണ് വ്യാകരണപരമായി യോജിക്കുന്നത്; അതിനാൽ ഈ വാക്യത്തിൽ ആത്മാവാണ് വ്യക്തമായ കർത്താവ്.
