  register: 'ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘പുത്രന്മാർ’, ‘ഹൃദയങ്ങൾ’, ‘അബ്ബാ’ എന്നീ പ്രധാന ബൈബിൾപരമായ പദങ്ങൾ നിലനിർത്തി. പാഠഭേദ അടിക്കുറിപ്പിനുള്ള [c] മുഖ്യപാഠത്തിൽ ‘നമ്മുടെ ഹൃദയങ്ങളിലേക്ക്[c]’ എന്നിടത്ത് ചേർക്കണം; സമർപ്പിച്ച വാചകത്തിൽ അത് തിരുത്തി വായിക്കേണ്ട പൂർണ്ണരൂപം: ‘നിങ്ങൾ പുത്രന്മാരായതിനാൽ[a], ദൈവം തന്റെ പുത്രന്റെ ആത്മാവിനെ നമ്മുടെ ഹൃദയങ്ങളിലേക്ക്[c] അയച്ചു. ആ ആത്മാവ് “അബ്ബാ[b], പിതാവേ!” എന്നു നിലവിളിക്കുന്നു.’'
