  choice: നമ്മുടെ ഹൃദയങ്ങൾ
  alternative: നിങ്ങളുടെ ഹൃദയങ്ങൾ
  rationale: നൽകിയ SBLGNT പാഠത്തിലെ ἡμῶν (‘നമ്മുടെ’) മുഖ്യപാഠത്തിൽ പിന്തുടരുന്നു; അറിയപ്പെടുന്ന ὑμῶν (‘നിങ്ങളുടെ’) പാഠഭേദം അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തുന്നു.
