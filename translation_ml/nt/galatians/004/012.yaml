id: GAL.4.12
reference: Galatians 4:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: ml
  text: സഹോദരങ്ങളേ[b], എന്നെപ്പോലെ ആയിത്തീരുക[a]; കാരണം ഞാനും നിങ്ങളെപ്പോലെ ആയിരിക്കുന്നു[c]. ഞാൻ നിങ്ങളോടു അപേക്ഷിക്കുന്നു. നിങ്ങൾ എന്നോട് യാതൊരു അനീതിയും ചെയ്തില്ല.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “ഞാൻ ആയിരിക്കുന്നതുപോലെ ആയിത്തീരുക.”
    reason: lexical_alternative
  - marker: b
    text: “സഹോദരങ്ങളേ” എന്ന സംബോധന ഇവിടെ വിശ്വാസസമൂഹത്തെ മുഴുവനായി ഉദ്ദേശിക്കുന്നതും സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്നതുമായിരിക്കാം.
    reason: cultural_note
  - marker: c
    text: അഥവാ, “ഞാനും നിങ്ങളെപ്പോലെ ആയിത്തീർന്നു.” ഗ്രീക്കിൽ ഇവിടെ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല.
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: ആയിത്തീരുക
  rationale: γίνομαι എന്ന ക്രിയയുടെ വർത്തമാനകാല ബഹുവചന ആജ്ഞാരൂപം ഒരു നിലയിലേക്കോ സമീപനത്തിലേക്കോ വരാനുള്ള ആഹ്വാനമാണ്; അതിനാൽ വെറും ‘ആയിരിക്കുക’ എന്നതിനെക്കാൾ ‘ആയിത്തീരുക’ ഉചിതം.
- source_word: ὡς ἐγώ
  choice: എന്നെപ്പോലെ
  rationale: ὡς ഇവിടെ താരതമ്യം സൂചിപ്പിക്കുന്നു. സ്വാഭാവികമായ മലയാളത്തിൽ ‘എന്നെപ്പോലെ’ ആ താരതമ്യം വ്യക്തമായി നൽകുന്നു.
- source_word: ὅτι
  choice: കാരണം
  rationale: അടുത്ത വാക്യഭാഗം അഭ്യർഥനയ്ക്കുള്ള കാരണം നൽകുന്നതായാണ് സന്ദർഭത്തിൽ സ്വാഭാവികമായി മനസ്സിലാകുന്നത്.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: ഞാനും നിങ്ങളെപ്പോലെ ആയിരിക്കുന്നു
  rationale: ഗ്രീക്കിൽ ക്രിയ വ്യക്തമാക്കിയിട്ടില്ല. വാക്യത്തിന്റെ അപൂർണത നിലനിർത്താൻ കഴിയാത്ത മലയാളത്തിൽ വർത്തമാനസ്ഥിതി സൂചിപ്പിക്കുന്ന ‘ആയിരിക്കുന്നു’ ചേർത്തു; ‘ആയിത്തീർന്നു’ എന്ന സന്ദർഭാധിഷ്ഠിത വായന അടിക്കുറിപ്പിൽ നൽകിയിരിക്കുന്നു.
- source_word: ἀδελφοί
  choice: സഹോദരങ്ങളേ
  rationale: വിളിസംബോധനയായ പുല്ലിംഗ ബഹുവചനം നേരിട്ട് പ്രതിഫലിപ്പിക്കുന്നു; വിശ്വാസസമൂഹമൊട്ടാകെ ഉൾപ്പെടാൻ സാധ്യതയുള്ള പ്രയോഗമാണെന്നത് അടിക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു.
- source_word: δέομαι ὑμῶν
  choice: ഞാൻ നിങ്ങളോട് അപേക്ഷിക്കുന്നു
  rationale: δέομαι ഗൗരവമുള്ള അഭ്യർഥനയാണ്. ‘അപേക്ഷിക്കുന്നു’ അതിന്റെ ശക്തി മാന്യവും ആധുനികവുമായ മലയാളത്തിൽ നൽകുന്നു.
- source_word: οὐδέν με ἠδικήσατε
  choice: നിങ്ങൾ എന്നോട് ഒരു അനീതിയും ചെയ്തിട്ടില്ല
  rationale: οὐδέν നിഷേധത്തെ ഊന്നുകയും ἀδικέω അനീതി ചെയ്യുക/ദ്രോഹിക്കുക എന്ന ആശയം നൽകുകയും ചെയ്യുന്നു. മലയാളത്തിലെ പൂർണ്ണനിഷേധഘടന അർഥം സ്വാഭാവികമായി പകരുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന സംബോധനയുടെ ഉൾക്കൊള്ളുന്ന വ്യാപ്തി
  choice: പ്രധാനപാഠത്തിൽ ‘സഹോദരങ്ങളേ’ നിലനിർത്തി, സ്ത്രീകളെയും ഉൾപ്പെടുന്ന മുഴുവൻ വിശ്വാസസമൂഹത്തെയായിരിക്കാം ഇത് അഭിസംബോധന ചെയ്യുന്നതെന്ന് അടിക്കുറിപ്പിൽ വിശദീകരിച്ചു.
  alternative: സഹോദരീസഹോദരങ്ങളേ
  rationale: ഉറവിടത്തിലെ പുല്ലിംഗ ബഹുവചനരൂപം പ്രധാനപാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും അതിന്റെ സാധ്യതയുള്ള സമൂഹവ്യാപ്തി മറച്ചുവയ്ക്കാതിരിക്കാൻ ഈ രീതി സഹായിക്കുന്നു.
- issue: κἀγὼ ὡς ὑμεῖς എന്ന ക്രിയാരഹിത വാക്യഭാഗം
  choice: ‘ഞാനും നിങ്ങളെപ്പോലെ ആയിരിക്കുന്നു’ എന്ന് നൽകി.
  alternative: ‘ഞാനും നിങ്ങളെപ്പോലെ ആയിത്തീർന്നു’
  rationale: ഗ്രീക്കിൽ രണ്ടാമത്തെ ഉപവാക്യത്തിൽ ക്രിയയില്ല; അതിനാൽ വർത്തമാനസ്ഥിതിയും മുൻകാല തിരിച്ചറിയലും വ്യാകരണപരമായി സാധ്യമാണ്. പ്രധാനപാഠം കുറവ് വ്യാഖ്യാനാത്മകമായ വർത്തമാനവായന സ്വീകരിക്കുകയും മറ്റേ വായന അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുകയും ചെയ്യുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ഗ്രീക്കിലെ വികാരഭരിതമായ അഭ്യർഥന ചെറുവാക്യങ്ങളിലൂടെ വ്യക്തമാക്കിയിരിക്കുന്നു. എല്ലാ അടിക്കുറിപ്പ് ചിഹ്നങ്ങളും പ്രധാനപാഠത്തിൽ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
