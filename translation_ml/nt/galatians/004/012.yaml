  terminology: ‘സഹോദരങ്ങളേ’ ἀδελφοίയുടെ പുല്ലിംഗ ബഹുവചന സംബോധന സംരക്ഷിക്കുന്നു; അതിന്റെ സമൂഹവ്യാപ്തി അനുബന്ധക്കുറിപ്പിൽ വ്യക്തമാക്കുന്നു. κἀγὼ ὡς ὑμεῖς എന്ന ഭാഗത്തിന്റെ വ്യാഖ്യാനപരമായ മുൻകാലവായന പ്രധാനപാഠത്തിലേക്ക് ചേർക്കാതെ അടിക്കുറിപ്പിൽ നിലനിർത്തിയിരിക്കുന്നു.
