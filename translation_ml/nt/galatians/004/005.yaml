revisions:
- from: നിയമത്തിൻകീഴിലുള്ളവരെ അവൻ വീണ്ടെടുക്കേണ്ടതിനും, നാം പുത്രസ്ഥാനത്തേക്കുള്ള ദത്തെടുക്കൽ[a] പ്രാപിക്കേണ്ടതിനും തന്നേ.
  to: നിയമത്തിൻകീഴിലുള്ളവരെ അവൻ വീണ്ടെടുക്കേണ്ടതിനും, നാം പുത്രസ്ഥാനമെന്ന ദത്താവകാശം[a] പ്രാപിക്കേണ്ടതിനും.
