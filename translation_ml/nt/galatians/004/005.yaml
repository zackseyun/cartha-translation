source:
  edition: SBLGNT
  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: ml
  text: നിയമത്തിൻകീഴിലുള്ളവരെ അവൻ വീണ്ടെടുക്കേണ്ടതിനും, നാം പുത്രസ്ഥാനമെന്ന ദത്താവകാശം[a] പ്രാപിക്കേണ്ടതിനും.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ദത്തെടുക്കൽ.” ഗ്രീക്കുപദം അക്ഷരാർഥത്തിൽ “പുത്രന്മാരായി ദത്തെടുക്കൽ” എന്ന ആശയമാണ് നൽകുന്നത്; പൂർണ പുത്രസ്ഥാനവും അവകാശാവകാശവും അതിൽ ഊന്നിപ്പറയപ്പെടുന്നു. സ്ത്രീകളും പുരുഷന്മാരും ഉൾപ്പെടെ എല്ലാ വിശ്വാസികളുമാണ് ഇതിൽ ഉൾപ്പെടുന്നത്.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: —വേണ്ടതിന്
  rationale: രണ്ടു ഉപവാക്യങ്ങളിലുമുള്ള ഉദ്ദേശ്യാർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: τοὺς ὑπὸ νόμον
  choice: നിയമത്തിൻകീഴിലുള്ളവരെ
  rationale: സന്ദർഭത്തിൽ മോശൈക നിയമത്തിന്റെ അധികാരത്തിൻകീഴിലുള്ളവരെയാണ് പ്രധാനമായി സൂചിപ്പിക്കുന്നത്; മലയാളത്തിൽ സംക്ഷിപ്തവും വ്യക്തവുമാണ്.
- source_word: ἐξαγοράσῃ
  choice: വീണ്ടെടുക്കേണ്ടതിന്
  rationale: വിലകൊടുത്തു മോചിപ്പിക്കുക എന്ന വാണിജ്യ-വിമോചന ഭാവം ‘വീണ്ടെടുക്കുക’ നിലനിർത്തുന്നു.
- source_word: τὴν υἱοθεσίαν
  choice: പുത്രസ്ഥാനത്തേക്കുള്ള ദത്തെടുക്കൽ
  rationale: ദൈവകുടുംബത്തിലേക്കുള്ള ദത്തെടുക്കലിനൊപ്പം പുത്രന്മാർക്കുള്ള പൂർണ സ്ഥാനവും അവകാശവും സൂചിപ്പിക്കുന്ന υἱοθεσίαയുടെ ലിംഗസൂചകവും അവകാശപരവുമായ ഭാവം കാത്തുസൂക്ഷിക്കുന്നു.
- source_word: ἀπολάβωμεν
  choice: നാം … പ്രാപിക്കേണ്ടതിന്
  rationale: ഇവിടെ പ്രധാനമായ ‘ലഭിക്കുക/സ്വീകരിക്കുക’ എന്ന അർഥം dignified Malayalam-ൽ സ്വാഭാവികമായി നൽകുന്നു; ‘തിരികെ ലഭിക്കുക’ എന്ന ഭാവം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: υἱοθεσίαയിലെ ലിംഗസൂചകവും ഉൾക്കൊള്ളുന്ന പരാമർശവും
  choice: പുത്രസ്ഥാനത്തേക്കുള്ള ദത്തെടുക്കൽ
  alternative: ദത്തെടുക്കൽ; പുത്രത്വം
  rationale: ‘പുത്രസ്ഥാനം’ പുരാതന അവകാശക്രമത്തിലെ പൂർണ മകസ്ഥാനവും അവകാശാവകാശവും നിലനിർത്തുന്നു; അതേസമയം അടിക്കുറിപ്പ് ഈ അനുഗ്രഹം സ്ത്രീപുരുഷഭേദമില്ലാതെ എല്ലാ വിശ്വാസികളെയും ഉൾക്കൊള്ളുന്നതാണെന്ന് വ്യക്തമാക്കുന്നു.
- issue: ‘നിയമത്തിൻകീഴിലുള്ളവർ’ എന്നതിന്റെ പരാമർശം
  choice: സന്ദർഭത്തിൽ പ്രധാനമായി മോശൈക നിയമത്തിൻകീഴിലുള്ളവർ
  alternative: ഏതൊരു നിയമത്തിനും വിധേയരായ മനുഷ്യർ പൊതുവിൽ
  rationale: ഗലാത്യർ 4:4–5-ലെ സമീപസന്ദർഭം തോറായുടെ ഉടമ്പടിവ്യവസ്ഥയെ പ്രധാനമായി സൂചിപ്പിക്കുന്നു; എന്നാൽ വാക്യം തന്നെ അതിലപ്പുറമുള്ള ദൈവശാസ്ത്രപരമായ വ്യാപ്തി നിർബന്ധമായി അടച്ചുപൂട്ടുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രാഹ്യവുമായ മലയാളം. ആവർത്തിക്കുന്ന ἵναയുടെ ഉദ്ദേശ്യാർഥം സമാന്തരമായ ‘—വേണ്ടതിന്’ ഘടനയിൽ സൂക്ഷിച്ചു. ‘തന്നേ’ മുൻവാക്യവുമായി ഈ വാക്യത്തിന്റെ ഉദ്ദേശ്യബന്ധം അടയാളപ്പെടുത്തുന്നു.
