id: GAL.4.11
reference: Galatians 4:11
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: ml
  text: നിങ്ങളെക്കുറിച്ച് എനിക്ക് ഭയമുണ്ട്[a]—നിങ്ങൾക്കുവേണ്ടി ഞാൻ അധ്വാനിച്ചത് എങ്ങനെയെങ്കിലും വ്യർഥമായിപ്പോയോ എന്ന്.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “നിങ്ങളുടെ കാര്യത്തിൽ എനിക്ക് ആശങ്കയുണ്ട്.”
    reason: φοβοῦμαι ὑμᾶς എന്ന പ്രയോഗം ഭയത്തെയും ആശങ്കയെയും സൂചിപ്പിക്കാം; ഇവിടെ രണ്ടാമത്തേതാണ് സന്ദർഭോചിതമായ അർഥം.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: എനിക്ക് ഭയമുണ്ട്
  rationale: വർത്തമാനകാലത്തിലുള്ള പൗലോസിന്റെ ഇപ്പോഴത്തെ ആശങ്ക വ്യക്തമാക്കുന്നു; സന്ദർഭത്തിൽ ഇത് ഗലാത്യരെ ഭയപ്പെടുന്നതല്ല, അവരുടെ അവസ്ഥയെക്കുറിച്ചുള്ള ഭയമാണ്.
- source_word: ὑμᾶς
  choice: നിങ്ങളെക്കുറിച്ച്
  rationale: φοβοῦμαι എന്ന ക്രിയയോടുകൂടിയ കർമകാർകം ഇവിടെ ആശങ്കയുടെ വിഷയത്തെ സൂചിപ്പിക്കുന്നു. ‘നിങ്ങളെക്കുറിച്ച്’ എന്നത് അവരെ ഭയപ്പെടുന്നു എന്ന തെറ്റായ ധാരണ ഒഴിവാക്കി അവരുടെ ആത്മീയാവസ്ഥയെക്കുറിച്ചുള്ള കരുതൽ പ്രകടമാക്കുന്നു.
- source_word: μή πως
  choice: എങ്ങനെയെങ്കിലും … ആയിപ്പോയോ എന്ന്
  rationale: പൗലോസിന്റെ ഭയത്തിന്റെ ഉള്ളടക്കവും അനിശ്ചിതമായ ആശങ്കയും സ്വാഭാവികമായ ആധുനിക മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εἰκῇ
  choice: വ്യർഥമായി
  rationale: ഫലമില്ലാതെ, ഉദ്ദേശ്യം കൈവരിക്കാതെ എന്ന അർഥം സംക്ഷിപ്തവും ഗൗരവമുള്ളതുമായ ഭാഷയിൽ നൽകുന്നു.
- source_word: κεκοπίακα
  choice: ഞാൻ അധ്വാനിച്ചത്
  rationale: κοπιάω എന്ന ക്രിയയിലെ കഠിനപ്രയത്നത്തിന്റെ ഭാവവും, പൂർത്തിയായ അധ്വാനത്തിന് ഇപ്പോഴും പ്രസക്തിയുണ്ടെന്ന പൂർണകാലത്തിന്റെ സൂചനയും നിലനിർത്തുന്നു.
- source_word: εἰς ὑμᾶς
  choice: നിങ്ങൾക്കുവേണ്ടി
  rationale: പൗലോസിന്റെ അധ്വാനം അവരിലേക്കു ലക്ഷ്യമിട്ടതും അവരുടെ നന്മയ്ക്കായിരുന്നതുമാണെന്ന് സ്വാഭാവികമായി വ്യക്തമാക്കുന്നു; ‘നിങ്ങളുടെ ഇടയിൽ’ എന്ന സ്ഥലപരമായ അർഥത്തിലേക്ക് മാത്രം ചുരുക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ ഭയത്തിന്റെ സ്വഭാവം
  choice: ഗലാത്യർക്കുവേണ്ടിയുള്ള തന്റെ അപ്പൊസ്തലിക അധ്വാനം ഫലശൂന്യമായിപ്പോയിരിക്കാമെന്ന ഇടയപരമായ ആശങ്ക
  alternative: അവരുടെ ആത്മീയാവസ്ഥയുമായി നേരിട്ട് ബന്ധമില്ലാത്ത പൊതുവായ വ്യക്തിപരമായ ഉത്കണ്ഠ
  rationale: φοβοῦμαι … μή πως … εἰκῇ κεκοπίακα എന്ന ഘടന, ചെയ്ത അധ്വാനം വ്യർഥമായിരിക്കാമെന്ന നിർദിഷ്ട ആശങ്കയാണ് പ്രകടിപ്പിക്കുന്നത്; എങ്കിലും അത് തീർച്ചയായും വ്യർഥമായി എന്ന് പ്രസ്താവിക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘എങ്ങനെയെങ്കിലും … ആയിപ്പോയോ എന്ന്’ എന്ന ഘടന ഗ്രീക്കിലെ ആശങ്കയും അനിശ്ചിതത്വവും നിലനിർത്തുന്നു; ‘അധ്വാനിച്ചത്’ കഠിനപ്രയത്നത്തിന്റെ ഭാവം സംരക്ഷിക്കുന്നു.
