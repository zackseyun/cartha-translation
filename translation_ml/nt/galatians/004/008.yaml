id: GAL.4.8
reference: Galatians 4:8
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: ml
  text: എന്നാൽ അക്കാലത്ത്[a], നിങ്ങൾ ദൈവത്തെ അറിയാതിരുന്നപ്പോൾ, സ്വഭാവത്താൽ ദൈവങ്ങളല്ലാത്തവയ്ക്ക് നിങ്ങൾ അടിമകളായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: ‘എന്നാൽ മുമ്പ്, ദൈവത്തെ അറിയാതെ, സ്വഭാവത്താൽ ദൈവങ്ങളല്ലാത്തവയ്ക്ക് നിങ്ങൾ അടിമകളായിരുന്നു.’'
    reason: τότε μὲν-ന്റെ ‘മുമ്പ്’ എന്ന കാലസൂചനയും οὐκ εἰδότες-ന്റെ ‘ദൈവത്തെ അറിയാതെ’ എന്ന പങ്കുപ്രയോഗപരമായ അവതരണവും നൽകുന്നു.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: എന്നാൽ
  rationale: മുൻവാദത്തോടുള്ള വൈരുധ്യം സ്വാഭാവികവും വ്യക്തവുമായി സൂചിപ്പിക്കുന്നു.
- source_word: τότε μὲν
  choice: അക്കാലത്ത്
  rationale: ഗലാത്യരുടെ മുൻകാല അവസ്ഥയെ ചൂണ്ടിക്കാട്ടുകയും അടുത്ത വാക്യത്തിൽ വരുന്ന ഇപ്പോഴത്തെ അവസ്ഥയുമായുള്ള താരതമ്യത്തിന് വഴിയൊരുക്കുകയും ചെയ്യുന്നു.
- source_word: οὐκ εἰδότες θεὸν
  choice: നിങ്ങൾ ദൈവത്തെ അറിയാതിരുന്നപ്പോൾ
  rationale: കൃന്തകപ്രയോഗത്തിന്റെ കാലസംബന്ധമായ അർഥം വ്യക്തമാക്കുന്നു; ‘അറിയുക’ എന്നത് സത്യദൈവത്തെക്കുറിച്ചുള്ള ബന്ധപരമായ അറിവിനെയും ഉൾക്കൊള്ളാൻ കഴിയുന്ന പദമാണ്.
- source_word: ἐδουλεύσατε
  choice: അടിമകളായി സേവിച്ചു
  rationale: δουλεύω എന്ന പദത്തിലെ സേവനവും അടിമത്തവും ഒരുപോലെ നിലനിർത്തുകയും ഗലാത്യലേഖനത്തിലെ അടിമത്തം–സ്വാതന്ത്ര്യം പ്രമേയവുമായി ബന്ധം കാത്തുസൂക്ഷിക്കുകയും ചെയ്യുന്നു.
- source_word: τοῖς φύσει μὴ οὖσι θεοῖς
  choice: സ്വഭാവത്താൽ ദൈവങ്ങളല്ലാത്തവയ്ക്ക്
  rationale: പരാമർശിക്കപ്പെടുന്നവയെ വിഗ്രഹങ്ങളെന്നോ ദുഷ്ടാത്മാക്കളെന്നോ നിർണയിക്കാതെ ഗ്രീക്കിലെ പൊതുവായ സൂചനയും അവ യഥാർഥത്തിൽ ദൈവങ്ങളല്ലെന്ന നിഷേധവും നിലനിർത്തുന്നു.
- source_word: φύσει
  choice: സ്വഭാവത്താൽ
  rationale: അവയുടെ യഥാർഥ സ്വരൂപത്തെക്കുറിച്ചുള്ള പ്രസ്താവനയാണെന്ന ആശയം ഔപചാരികമായി സംരക്ഷിക്കുന്നു.
theological_decisions:
- issue: മുൻകാല ആരാധനയുടെ വിഷയങ്ങൾ എന്തായിരുന്നു
  choice: ‘സ്വഭാവത്താൽ ദൈവങ്ങളല്ലാത്തവ’ എന്ന അസ്തിത്വപരമായ നിഷേധം നിലനിർത്തി.
  alternative: ‘യഥാർഥത്തിൽ ദൈവങ്ങളല്ലാത്തവ’ അല്ലെങ്കിൽ ‘ദൈവങ്ങൾ എന്നു തെറ്റായി വിളിക്കപ്പെടുന്നവ’
  rationale: വിഗ്രഹങ്ങളോ ദുഷ്ടാത്മശക്തികളോ എന്നു പൗലോസ് ഇവിടെ വ്യക്തമാക്കാത്തതിനാൽ വിവർത്തനം ആ ചോദ്യം തീർപ്പാക്കുന്നില്ല; അതേസമയം അവ ദൈവങ്ങളല്ലെന്ന വാക്യത്തിന്റെ ഉറച്ച നിഷേധം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘അടിമകളായി സേവിച്ചു’ എന്ന പ്രയോഗം അല്പം ഔപചാരികമാണെങ്കിലും മൂലത്തിലെ δουλεύω എന്ന പദത്തിന്റെ അടിമത്തസൂചന നഷ്ടപ്പെടാതെ സ്വാഭാവികമായി വായിക്കാം. ‘അവയ്ക്ക്’ എന്ന രൂപം പരാമർശിക്കപ്പെടുന്നവ വ്യക്തികളാണോ വസ്തുക്കളാണോ എന്നത് അനാവശ്യമായി തീരുമാനിക്കുന്നില്ല.
