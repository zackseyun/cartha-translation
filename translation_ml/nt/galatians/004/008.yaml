- from: എന്നാൽ അക്കാലത്ത്[a], നിങ്ങൾ ദൈവത്തെ അറിയാതിരുന്നപ്പോൾ, സ്വഭാവത്താൽ ദൈവങ്ങളല്ലാത്തവയ്ക്ക് അടിമകളായി സേവിച്ചു.
  to: എന്നാൽ അക്കാലത്ത്[a], നിങ്ങൾ ദൈവത്തെ അറിയാതിരുന്നപ്പോൾ, സ്വഭാവത്താൽ ദൈവങ്ങളല്ലാത്തവയ്ക്ക് നിങ്ങൾ അടിമകളായിരുന്നു.
  rationale: The revision replaces the redundant ‘അടിമകളായി സേവിച്ചു’ with ‘അടിമകളായിരുന്നു,’ preserving the force of ἐδουλεύσατε as bondage to the stated entities and improving natural modern Malayalam. The footnote is correspondingly updated and avoids adding ‘യഥാർഥ,’ since the main wording already expresses the ontological denial inherent in φύσει μὴ οὖσι θεοῖς.
