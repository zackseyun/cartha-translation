id: GAL.1.15
reference: Galatians 1:15
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: ml
  text: എന്നാൽ, എന്റെ അമ്മയുടെ ഗർഭത്തിൽനിന്നുതന്നെ[a] എന്നെ വേർതിരിച്ചുവെക്കുകയും തന്റെ കൃപയാൽ എന്നെ വിളിക്കുകയും ചെയ്തവന് പ്രസാദമായപ്പോൾ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അല്ലെങ്കിൽ, “ജനനംമുതൽ”; യിരെമ്യാവ് 1:5-ലെയും യെശയ്യാവ് 49:1-ലെയും പ്രവാചകവിളിയുടെ ഭാഷയുമായി താരതമ്യം ചെയ്യുക.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: എന്നാൽ … ആയപ്പോൾ
  rationale: ὅτεയുടെ കാലസൂചനയും δέയുടെ മൃദുവായ വിരുദ്ധത/തുടർച്ചയും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: εὐδόκησεν
  choice: പ്രസാദമായപ്പോൾ
  rationale: ദൈവത്തിന്റെ സ്വതന്ത്രമായ സദിഷ്ടത്തെ സൂചിപ്പിക്കുന്ന പദത്തിന്റെ ഭാവം നിലനിർത്തുന്നു; വെറും ‘തീരുമാനിച്ചപ്പോൾ’ എന്നാക്കി അർഥം ചുരുക്കുന്നില്ല.
- source_word: ὁ ἀφορίσας με
  choice: എന്നെ വേർതിരിച്ചുവെക്കുകയും … ചെയ്തവൻ
  rationale: നിശ്ചിത ഉദ്ദേശ്യത്തിനായി മാറ്റിവെക്കുക എന്ന ആശയം പ്രകടമാക്കുന്നു; ‘തിരഞ്ഞെടുത്തു’ അല്ലെങ്കിൽ ‘നിയമിച്ചു’ എന്നു വിവർത്തനം ചെയ്ത് പ്രത്യേക സിദ്ധാന്തവ്യാഖ്യാനം ചേർക്കുന്നില്ല.
- source_word: ἐκ κοιλίας μητρός μου
  choice: എന്റെ അമ്മയുടെ ഗർഭത്തിൽനിന്നുതന്നെ
  rationale: ഗ്രീക്കിലെ മൂർത്തമായ ഗർഭചിത്രവും പ്രവാചകവിളിയുടെ ഭാഷാശൈലിയും സംരക്ഷിക്കുന്നു.
- source_word: καλέσας
  choice: എന്നെ വിളിക്കുകയും
  rationale: ദൈവിക വിളിയുടെ തൊഴിൽപരവും രക്ഷാസംബന്ധവുമായ വ്യാപ്തി വിശദീകരിച്ച് പരിമിതപ്പെടുത്താതെ സാധാരണ പൗലോസീയ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: തന്റെ കൃപയാൽ
  rationale: διά + genitive സൂചിപ്പിക്കുന്ന മാർഗം/മാധ്യമം മലയാളത്തിൽ സ്വാഭാവികമായ കരണപ്രയോഗത്തിലൂടെ നൽകുന്നു.
theological_decisions:
- issue: ἀφορίσας എന്ന പദത്തിൽ മുൻനിയമനം അല്ലെങ്കിൽ തിരഞ്ഞെടുപ്പ് സംബന്ധിച്ച പ്രത്യേക സിദ്ധാന്തം ചേർക്കണമോ
  choice: വേർതിരിച്ചുവെക്കുക
  alternative: തിരഞ്ഞെടുത്തു / നിയമിച്ചു / വേർപെടുത്തി
  rationale: മൂലപാഠം ദൈവം ഒരു ഉദ്ദേശ്യത്തിനായി മാറ്റിവെച്ചതിനെ സൂചിപ്പിക്കുന്നു; എന്നാൽ അതിനെ ഒരു സമ്പൂർണ സിദ്ധാന്തപ്രസ്താവനയായി നിർവചിക്കുന്നില്ല.
- issue: ἐκ κοιλίας μητρός μου എന്നത് ഗർഭകാലത്തെയോ ജനനംമുതലെയോ സൂചിപ്പിക്കുന്നുണ്ടോ
  choice: അമ്മയുടെ ഗർഭത്തിൽനിന്നുതന്നെ
  alternative: ജനനംമുതൽ
  rationale: മൂലപാഠത്തിന്റെ ദൃശ്യരൂപം മുഖ്യപാഠത്തിൽ നിലനിർത്തി, സാധ്യമായ കാലപരമായ വ്യാഖ്യാനം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും ഗൗരവമുള്ളതുമായ സാധാരണ മലയാളം ഉപയോഗിച്ചു. വാക്യം അടുത്ത വാക്യത്തിൽ തുടരുന്നതിനാൽ അവസാനത്തിൽ ദീർഘവിരാമചിഹ്നം നൽകി; ഗ്രീക്കിലെ ദൈവസൂചകമായ വിശേഷണപങ്കാളിത്തരൂപം ‘ചെയ്തവൻ’ എന്ന രൂപത്തിൽ പരസ്യമായി ‘ദൈവം’ ചേർക്കാതെ നിലനിർത്തി.
