reference: Galatians 1:12
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: ml
  text: കാരണം, ഞാൻ അത് ഒരു മനുഷ്യനിൽനിന്നും സ്വീകരിച്ചിട്ടില്ല; അത് എന്നെ ആരും പഠിപ്പിച്ചിട്ടുമില്ല. മറിച്ച്, യേശു മശീഹയിൽനിന്നുള്ള ഒരു വെളിപ്പാടിലൂടെയാണ് എനിക്കത് ലഭിച്ചത്.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “യേശു മശീഹയെക്കുറിച്ചുള്ള ഒരു വെളിപ്പാടിലൂടെ.”
    reason: ἀποκαλύψεως Ἰησοῦ Χριστοῦ എന്ന ഗ്രീക്ക് പ്രയോഗം യേശു മശീഹയിൽനിന്നുള്ള വെളിപ്പാടിനെയോ യേശു മശീഹയെക്കുറിച്ചുള്ള വെളിപ്പാടിനെയോ സൂചിപ്പിക്കാം.
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: ഒരു മനുഷ്യനിൽനിന്നും
  rationale: ഏതെങ്കിലും ഒരു മനുഷ്യനിൽനിന്നുള്ള കൈമാറ്റത്തെ പൊതുവായി നിഷേധിക്കുന്ന ഏകവചനപ്രയോഗം സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു.
- source_word: παρέλαβον
  choice: സ്വീകരിച്ചതല്ല
  rationale: പാരമ്പര്യമോ സന്ദേശമോ മറ്റൊരാളിൽനിന്ന് ഏറ്റുവാങ്ങുക എന്ന സന്ദർഭോചിതമായ അർഥം നൽകുന്നു.
- source_word: ἐδιδάχθην
  choice: ആരും എന്നെ അത് പഠിപ്പിച്ചതുമല്ല
  rationale: ഗ്രീക്കിലെ കർമണിപ്രയോഗത്തിന്റെ ആശയം വ്യക്തവും സ്വാഭാവികവുമായ മലയാളത്തിൽ പ്രകടമാക്കുന്നു; മനുഷ്യനിൽനിന്നുള്ള ഉപദേശത്തെ നിഷേധിക്കുന്ന വൈരുധ്യവും നിലനിർത്തുന്നു.
- source_word: δι’ ἀποκαλύψεως
  choice: ഒരു വെളിപ്പാടിലൂടെ
  rationale: διά സൂചിപ്പിക്കുന്ന മാർഗം/മാധ്യമം എന്ന ആശയവും വെളിപ്പാടിന്റെ സംഭവസ്വഭാവവും വ്യക്തമാക്കുന്നു.
- source_word: Ἰησοῦ Χριστοῦ
  choice: യേശു മശീഹയിൽനിന്നുള്ള
  rationale: സമീപസന്ദർഭത്തിലെ മനുഷ്യരിൽനിന്നല്ല എന്ന ഉറവിടവൈരുധ്യത്തിന് യോജിച്ച് കർത്തൃ/ഉറവിടസംബന്ധിയായ ഷഷ്ഠിയെ മുഖ്യവാചകത്തിൽ വ്യക്തമാക്കുന്നു; വിഷയസംബന്ധിയായ മറ്റൊരു സാധ്യത അടിക്കുറിപ്പിൽ സൂക്ഷിക്കുന്നു.
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦ എന്നതിലെ ഷഷ്ഠിയുടെ ബന്ധം
  choice: യേശു മശീഹയിൽനിന്നുള്ള വെളിപ്പാട്
  alternative: യേശു മശീഹയെക്കുറിച്ചുള്ള വെളിപ്പാട്
  rationale: തൊട്ടുമുമ്പുള്ള വാക്യഭാഗം സന്ദേശത്തിന്റെ ഉറവിടം മനുഷ്യനല്ലെന്ന് ഊന്നുന്നതിനാൽ ഉറവിട/കർത്തൃവായന മുഖ്യവാചകത്തിൽ സ്വീകരിച്ചു. എന്നാൽ ഗ്രീക്ക് വ്യാകരണം വിഷയസംബന്ധിയായ വായനയും അനുവദിക്കുന്നതിനാൽ അതിനെ അടിക്കുറിപ്പിൽ രേഖപ്പെടുത്തി.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് സുഗ്രാഹ്യവുമായ മലയാളം. ‘മശീഹ’ എന്നത് Χριστός എന്ന പദത്തിന്റെ പദവിസ്വഭാവം നിലനിർത്തുന്നു. അവസാന ഭാഗത്തിലെ ഗ്രീക്ക് ദീർഘവാക്യഘടന സ്വാഭാവികമാക്കാൻ ‘എനിക്ക് അത് ലഭിച്ചത്’ എന്നു പൂരിപ്പിച്ചിരിക്കുന്നു.
