id: GAL.1.14
reference: Galatians 1:14
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: ml
  text: എന്റെ ജനത്തിലെ എന്റെ സമപ്രായക്കാരായ പലരേക്കാളും ഞാൻ യെഹൂദമതത്തിൽ[a] മുന്നേറിക്കൊണ്ടിരുന്നു; എന്റെ പൂർവികരുടെ പാരമ്പര്യങ്ങളോടു[b] അവരേക്കാൾ ഏറെ തീക്ഷ്ണത പുലർത്തുന്നവനുമായിരുന്നു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “യെഹൂദമതം” എന്നത് സന്ദർഭമനുസരിച്ച് “യെഹൂദരുടെ മതം” എന്നോ കൂടുതൽ വിശാലമായി “യെഹൂദരുടെ ജീവിതരീതി” എന്നോ വിവർത്തനം ചെയ്യാം.
    reason: lexical_alternative
  - marker: b
    text: 'പദാനുപദമായി: “എന്റെ പിതാക്കന്മാരുടെ പാരമ്പര്യങ്ങളോടു.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: മുന്നേറിക്കൊണ്ടിരുന്നു
  rationale: അപൂർണ ഭൂതകാലരൂപം കഴിഞ്ഞകാലത്ത് തുടർന്നുകൊണ്ടിരുന്ന പുരോഗതിയെ സൂചിപ്പിക്കുന്നു; താരതമ്യസന്ദർഭവും ഈ പ്രയോഗം നിലനിർത്തുന്നു.
- source_word: Ἰουδαϊσμῷ
  choice: യെഹൂദമതത്തിൽ
  rationale: തിരിച്ചറിയാവുന്ന യെഹൂദ മതപാരമ്പര്യത്തെ സ്വാഭാവികവും സംക്ഷിപ്തവുമായി അറിയിക്കുന്നു; പദത്തിന്റെ വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: എന്റെ സമപ്രായക്കാരായ പലരെയുംകാൾ
  rationale: ὑπέρ എന്നതിന്റെ താരതമ്യബലവും συνηλικιώτας എന്നതിലെ ഒരേ പ്രായക്കാരെന്ന ആശയവും നേരിട്ട് പകരുന്നു.
- source_word: ἐν τῷ γένει μου
  choice: എന്റെ ജനത്തിൽ
  rationale: γένος സൂചിപ്പിക്കുന്ന സ്വന്തം ജനവിഭാഗം അഥവാ വംശീയ-സാമൂഹിക കൂട്ടായ്മയെ ആധുനിക മലയാളത്തിൽ തെറ്റിദ്ധാരണയില്ലാതെ വ്യക്തമാക്കുന്നു.
- source_word: περισσοτέρως
  choice: അത്യധികം
  rationale: പൗലോസിന്റെ തീക്ഷ്ണതയുടെ ഉയർന്ന അളവ് സ്വാഭാവിക മലയാളത്തിൽ പ്രകടമാക്കുന്നു; വ്യക്തമല്ലാത്ത ഒരു അധിക താരതമ്യവസ്തു ചേർക്കുന്നില്ല.
- source_word: ζηλωτὴς ὑπάρχων
  choice: തീക്ഷ്ണത പുലർത്തുകയും ചെയ്തിരുന്നു
  rationale: പങ്കാളിക്രിയയുടെ അനുബന്ധഭാവവും ζηλωτής എന്നതിലെ ഉത്സാഹപൂർണമായ തീക്ഷ്ണതയും രാഷ്ട്രീയ അർഥമുള്ള സാങ്കേതിക പദം ഉപയോഗിക്കാതെ പകരുന്നു.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: എന്റെ പൂർവികരുടെ പാരമ്പര്യങ്ങൾക്കുവേണ്ടി
  rationale: πατρικός എന്നതിലെ പിതാക്കന്മാരിൽനിന്നോ പൂർവികരിൽനിന്നോ ലഭിച്ച പാരമ്പര്യമെന്ന ആശയം വ്യക്തവും മാന്യവുമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു.
theological_decisions:
- issue: Ἰουδαϊσμός എന്ന പദത്തിന്റെ പരിധി
  choice: പ്രധാനവാചകത്തിൽ “യെഹൂദമതം” ഉപയോഗിച്ച് വിശാലമായ അർഥസാധ്യത അടിക്കുറിപ്പിൽ നൽകുന്നു.
  alternative: “യെഹൂദരുടെ ജീവിതരീതി”
  rationale: സന്ദർഭത്തിൽ മതസംവിധാനവും അതിനോടനുബന്ധിച്ച ജീവിതരീതിയും രണ്ടും ഉൾപ്പെടാൻ സാധ്യതയുള്ളതിനാൽ പ്രധാനവാചകത്തിൽ ഒറ്റ വ്യാഖ്യാനം അതിയായി ഉറപ്പിക്കുന്നില്ല.
- issue: πατρικαὶ παραδόσεις എന്നതിലെ ബന്ധസൂചന
  choice: “എന്റെ പൂർവികരുടെ പാരമ്പര്യങ്ങൾ”
  alternative: “എന്റെ പിതാക്കന്മാരുടെ പാരമ്പര്യങ്ങൾ”
  rationale: ഇത് അടുത്ത തലമുറയിലെ പിതാവിനെ മാത്രം സൂചിപ്പിക്കുന്നതല്ല, തലമുറകളായി കൈമാറിയ പാരമ്പര്യങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; അടിക്കുറിപ്പ് കൂടുതൽ പദാനുപദ രൂപം സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ദീർഘമായ ഗ്രീക്ക് വാക്യഘടനയുടെ ബന്ധം അർദ്ധവിരാമത്തിലൂടെ നിലനിർത്തിയിരിക്കുന്നു; മതവിഭാഗപരമായ വ്യാഖ്യാനം ചേർത്തിട്ടില്ല.
