source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: ml
  text: എന്നാൽ, ഞങ്ങളോ സ്വർഗത്തിൽനിന്ന് ഒരു ദൂതനോ, ഞങ്ങൾ നിങ്ങളോടു സുവാർത്ത അറിയിച്ചതിനു വിരുദ്ധമായി നിങ്ങളോടു സുവാർത്ത അറിയിച്ചാൽപ്പോലും[a], അവൻ ശപിക്കപ്പെട്ടവനായിരിക്കട്ടെ[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, ‘നിങ്ങളോടു സുവിശേഷം പ്രസംഗിച്ചാൽ.’ ഗ്രീക്കിൽ ‘സുവാർത്ത അറിയിക്കുക’ എന്ന അർഥമുള്ള ക്രിയയാണ് ഉപയോഗിച്ചിരിക്കുന്നത്.
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, ‘ഞങ്ങൾ നിങ്ങളോടു അറിയിച്ചതിൽനിന്നു വ്യത്യസ്തമായി’ അല്ലെങ്കിൽ ‘ഞങ്ങൾ നിങ്ങളോടു അറിയിച്ചതിനപ്പുറം.’
    reason: lexical_alternative
  - marker: c
    text: അഥവാ, ‘അവൻ അനാഥേമ ആയിരിക്കട്ടെ’ അല്ലെങ്കിൽ ‘അവൻ ശാപത്തിൻ കീഴിലായിരിക്കട്ടെ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: എന്നാൽ ... അറിയിച്ചാൽപോലും
  rationale: ἀλλάയുടെ ശക്തമായ വിരുദ്ധഭാവവും καίയുടെ ഊന്നലും ἐάν സൂചിപ്പിക്കുന്ന സോപാധികതയും സ്വാഭാവിക മലയാള വാക്യഘടനയിൽ നിലനിർത്തുന്നു.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: ഞങ്ങളോ സ്വർഗത്തിൽനിന്നുള്ള ഒരു ദൂതനോ
  rationale: പൗലോസ് തന്നെയും കൂട്ടാളികളെയും ഉൾപ്പെടുത്തുന്ന ഊന്നലും സ്വർഗീയ ദൂതനുമായുള്ള ശക്തമായ താരതമ്യവും അധിക വ്യാഖ്യാനം കൂടാതെ സൂക്ഷിക്കുന്നു.
- source_word: εὐαγγελίζηται
  choice: സുവാർത്തയായി അറിയിച്ചാൽ
  rationale: ഗ്രീക്കിലെ ക്രിയാരൂപത്തെ ക്രിയാപ്രയോഗമായി തന്നെ അവതരിപ്പിക്കുകയും സാധാരണ വായനക്കാർക്ക് വ്യക്തമായ ഭാഷ ഉപയോഗിക്കുകയും ചെയ്യുന്നു.
- source_word: παρ’ ὃ
  choice: വിരുദ്ധമായത്
  rationale: മുമ്പ് അറിയിച്ച സന്ദേശത്തിൽനിന്നുള്ള വ്യതിചലനത്തെ ഈ സന്ദർഭത്തിൽ ശക്തമായി പ്രകടിപ്പിക്കുന്നു; ‘വ്യത്യസ്തമായത്’, ‘അതിലപ്പുറമായത്’ എന്നീ സാധ്യതകൾ അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: εὐηγγελισάμεθα
  choice: ഞങ്ങൾ ... സുവാർത്തയായി അറിയിച്ചത്
  rationale: ആദ്യത്തെ εὐαγγελίζηται എന്ന ക്രിയയുമായുള്ള പദബന്ധം ദൃശ്യമാക്കുകയും ആവർത്തനം മലയാളത്തിൽ സ്വാഭാവികമായി നിലനിർത്തുകയും ചെയ്യുന്നു.
- source_word: ἀνάθεμα ἔστω
  choice: അവൻ ശപിക്കപ്പെട്ടവനായിരിക്കട്ടെ
  rationale: ശാപവിധിയുടെ ഗൗരവം വ്യക്തമായ ആധുനിക മലയാളത്തിൽ നൽകുന്നു; പിൽക്കാല സഭാസാങ്കേതിക അർഥം അനാവശ്യമായി ചേർക്കുന്നില്ല.
theological_decisions:
- issue: പൗലോസിന്റെ ശാപപ്രഖ്യാപനത്തിന്റെ അർഥം
  choice: അപ്പൊസ്തലിക സുവാർത്തയ്ക്കു വിരുദ്ധമായ സന്ദേശം അറിയിക്കുന്ന ആരും യഥാർഥ ശാപവിധിക്ക് വിധേയനാകട്ടെ എന്ന ശക്തമായ പ്രഖ്യാപനമായി ‘അവൻ ശപിക്കപ്പെട്ടവനായിരിക്കട്ടെ’ എന്നു പരിഭാഷപ്പെടുത്തി.
  alternative: ‘അവൻ അനാഥേമ ആയിരിക്കട്ടെ’ എന്ന സഭാസാങ്കേതിക രൂപം, അല്ലെങ്കിൽ ‘അവൻ ശാപത്തിൻ കീഴിലായിരിക്കട്ടെ’ എന്ന വിപുലീകരിച്ച രൂപം.
  rationale: മൂലവാക്യത്തിന്റെ ന്യായവിധിപരമായ ഗൗരവം സംരക്ഷിക്കുമ്പോഴും അതിൽ ഇല്ലാത്ത പ്രത്യേക സഭാശിക്ഷാസങ്കൽപ്പം ചേർക്കാതിരിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമുള്ള, മാന്യവും സാധാരണ വായനക്കാർക്ക് ഗ്രഹിക്കാവുന്നതുമായ മലയാളം. ‘സുവാർത്തയായി അറിയിക്കുക’ എന്ന ആവർത്തനം മൂലഗ്രീക്കിലെ രണ്ടു സമാനക്രിയകളുടെ ബന്ധം തെളിയിക്കുന്നു. വാക്യത്തിന്റെ ശക്തമായ മുന്നറിയിപ്പും ശാപവിധിയുടെ ഗൗരവവും മൃദൂകരിച്ചിട്ടില്ല.
