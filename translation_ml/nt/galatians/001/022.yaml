language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: ml
  text: എന്നാൽ യെഹൂദ്യയിലെ മശീഹയിലുള്ള[b] സഭകൾക്ക് ഞാൻ മുഖപരിചയമില്ലാത്തവനായിരുന്നു[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കണ്ടുപരിചയമില്ലാത്തവനായിരുന്നു” അല്ലെങ്കിൽ “നേരിട്ടു പരിചയമില്ലാത്തവനായിരുന്നു.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ, “ക്രിസ്തുവിലുള്ള.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: എന്നാൽ
  rationale: മുൻവാക്യവുമായി ഉള്ള മൃദുവായ മാറ്റമോ വൈരുധ്യമോ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀγνοούμενος τῷ προσώπῳ
  choice: എന്നെ മുഖപരിചയമുണ്ടായിരുന്നില്ല
  rationale: അവർ പൗലോസിനെ നേരിട്ടു കണ്ടറിഞ്ഞിരുന്നില്ല എന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ അർഥം സ്വാഭാവികമായ മലയാളത്തിൽ നൽകുന്നു; വെറും പൊതുവായ അറിവില്ലായ്മ എന്നതിലേക്കു ചുരുക്കുന്നില്ല.
- source_word: ἐκκλησίαις
  choice: സഭകൾക്ക്
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിൽ വിശ്വാസികളുടെ പ്രാദേശിക സമൂഹങ്ങളെയാണ് സൂചിപ്പിക്കുന്നത്; ആധുനിക മലയാളത്തിൽ ‘സഭകൾ’ വ്യക്തവും പതിവുമായ പദമാണ്.
- source_word: Ἰουδαίας
  choice: യെഹൂദ്യയിലെ
  rationale: ഭൂമിശാസ്ത്രനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἐν Χριστῷ
  choice: മശീഹയിലുള്ള
  rationale: Χριστός എന്ന പദത്തിന്റെ സ്ഥാനപ്പേരായ അർഥം നിലനിർത്തുകയും സഭകൾ മശീഹയോടുള്ള ബന്ധത്തിൽ നിലകൊള്ളുന്നു എന്ന വാക്യഘടന സംരക്ഷിക്കുകയും ചെയ്യുന്നു.
theological_decisions:
- issue: ἐν Χριστῷ എന്നതിലെ Χριστῷ-യുടെ പരിഭാഷ
  choice: മശീഹ
  alternative: ക്രിസ്തു
  rationale: ഇവിടെ Χριστός അഭിഷിക്തൻ എന്ന സ്ഥാനപ്പേരിന്റെ അർഥം വഹിക്കുന്നതിനാൽ ‘മശീഹ’ അത് നേരിട്ട് സംരക്ഷിക്കുന്നു; പരമ്പരാഗതമായ ‘ക്രിസ്തു’ എന്ന രൂപം അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. ‘മുഖപരിചയം’ എന്ന സ്വാഭാവിക പ്രയോഗം ഗ്രീക്കിലെ τῷ προσώπῳ എന്ന മുഖം/നേരിട്ടുള്ള പരിചയം സൂചിപ്പിക്കുന്ന ആശയം നിലനിർത്തുന്നു.
