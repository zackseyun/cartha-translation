  text: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί, ταῖς ἐκκλησίαις τῆς Γαλατίας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/002.yaml
  text: 'and all the brothers with me[a], to the churches of Galatia:'
translation:
  language: ml
  text: 'എന്നോടൊപ്പമുള്ള എല്ലാ സഹോദരന്മാരും,[a] ഗലാത്യയിലെ സഭകൾക്ക്:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “സഹോദരന്മാരും സഹോദരിമാരും.” ഗ്രീക്കിൽ “സഹോദരന്മാർ” എന്നാണ്; എന്നാൽ ഇരുപാലിലുമുള്ള സഹവിശ്വാസികൾ ഇതിൽ ഉൾപ്പെട്ടിരിക്കാം.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: എന്നോടുകൂടെയുള്ള എല്ലാ സഹോദരന്മാരും
  rationale: ഗ്രീക്കിലെ പദക്രമവും പൗലോസിനോടുകൂടെ ഉണ്ടായിരുന്ന സഹവിശ്വാസികളെന്ന അർഥവും സ്വാഭാവികമായ മലയാളത്തിൽ നിലനിർത്തുന്നു. ἀδελφοί വ്യാകരണപരമായി പുല്ലിംഗ ബഹുവചനമായതിനാൽ മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’ എന്നു നൽകി; സ്ത്രീകളും ഉൾപ്പെട്ടിരിക്കാവുന്ന പ്രയോഗസാധ്യത അടിക്കുറിപ്പിൽ സൂചിപ്പിക്കുന്നു.
- source_word: ἐκκλησίαις
  choice: സഭകൾക്ക്
  rationale: പൗലോസിന്റെ ലേഖനാഭിവാദ്യത്തിൽ ἐκκλησία എന്നതിന് സ്വാഭാവികവും സ്ഥാപിതവുമായ മലയാള തുല്യപദം ‘സഭ’ ആണ്; ദത്തിവിഭക്തിയിലെ സ്വീകർത്താവിനെ ‘-ക്ക്’ ഉപയോഗിച്ച് വ്യക്തമാക്കുന്നു.
- source_word: τῆς Γαλατίας
  choice: ഗലാത്യയിലെ
  rationale: ഗ്രീക്കിലെ ജനിറ്റീവ് ബന്ധം മലയാളത്തിൽ സ്ഥലബന്ധം സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്ന ‘ഗലാത്യയിലെ’ എന്ന രൂപത്തിൽ നൽകുന്നു.
- source_word: καὶ
  choice: -ഉം
  rationale: ഈ വാക്യം മുൻവാക്യത്തിലെ പൗലോസിനോട് സഹ-അയച്ചവരെ ചേർക്കുന്നതിനാൽ καὶയുടെ ബന്ധകപ്രവർത്തനം ‘സഹോദരന്മാരും’ എന്ന ചേർക്കൽപ്രത്യയം വഴി മലയാളത്തിൽ സ്വാഭാവികമായി പ്രകടിപ്പിക്കുന്നു.
theological_decisions:
- issue: ἀδελφοί എന്ന പുല്ലിംഗ ബഹുവചനം സ്ത്രീകളെയും ഉൾക്കൊള്ളുന്നുണ്ടോ
  choice: മുഖ്യപാഠത്തിൽ ‘സഹോദരന്മാർ’
  alternative: ‘സഹോദരീസഹോദരന്മാർ’ അഥവാ ‘സഹവിശ്വാസികൾ’
  rationale: മൂലപദത്തിന്റെ വ്യാകരണരൂപം മുഖ്യപാഠത്തിൽ സംരക്ഷിക്കുമ്പോഴും അതിന്റെ സന്ദർഭപരമായ ഉൾക്കൊള്ളൽസാധ്യത നിർണ്ണയിച്ചുറപ്പിക്കാതെ അടിക്കുറിപ്പിൽ നൽകുന്നു.
translation_notes:
  register: ആധുനികവും മാന്യവും സാധാരണ വായനക്കാർക്ക് വ്യക്തവുമായ മലയാളം. മുൻവാക്യത്തിൽ ആരംഭിച്ച ലേഖനാഭിവാദ്യത്തിന്റെ തുടർച്ച സൂചിപ്പിക്കാൻ സ്വതന്ത്രമായ ‘കൂടാതെ’ എന്നതിനു പകരം ‘-ഉം’ ഉപയോഗിച്ചു. അടിക്കുറിപ്പ് ചിഹ്നം വാക്യാവസാനത്തിൽ ചേർത്തിരിക്കുന്നു.
