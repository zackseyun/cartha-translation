id: GAL.1.19
reference: Galatians 1:19
language:
  code: ml
  name: Malayalam
  native_name: മലയാളം
  variant: modern standard Malayalam
source:
  edition: SBLGNT
  text: ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: ml
  text: എന്നാൽ അപ്പൊസ്തലന്മാരിൽ കർത്താവിന്റെ സഹോദരനായ യാക്കോബിനെയല്ലാതെ മറ്റാരെയും ഞാൻ കണ്ടില്ല.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'അല്ലെങ്കിൽ: “മറ്റൊരു അപ്പൊസ്തലനെയും ഞാൻ കണ്ടില്ല; കർത്താവിന്റെ സഹോദരനായ യാക്കോബിനെ മാത്രം കണ്ടു.” ഈ പ്രയോഗം യാക്കോബിനെ അപ്പൊസ്തലന്മാരിൽ ഉൾപ്പെടുത്തണമെന്നില്ലെന്ന് ചിലർ മനസ്സിലാക്കുന്നു.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: മറ്റാരെയും
  rationale: τῶν ἀποστόλων എന്ന വിഭാഗസൂചക പ്രയോഗത്തോടൊപ്പം ‘അവരിൽ മറ്റൊരാളെ/മറ്റാരെയും’ എന്ന അർഥം സ്വാഭാവികമായി നൽകുന്നു.
- source_word: δέ
  choice: എന്നാൽ
  rationale: മുൻവാക്യത്തോടുള്ള മൃദുവായ വൈരുധ്യം മലയാളത്തിൽ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: ἀποστόλων
  choice: അപ്പൊസ്തലന്മാരിൽ
  rationale: പൗലോസിന്റെ സന്ദർഭത്തിലെ അംഗീകൃത അപ്പൊസ്തലവൃന്ദത്തെ സൂചിപ്പിക്കുന്ന സ്ഥാപിതമായ മലയാള പദമാണ്; വിഭക്തി മൂലത്തിലെ partitive ബന്ധവും പ്രകടമാക്കുന്നു.
- source_word: οὐκ εἶδον
  choice: ഞാൻ കണ്ടില്ല
  rationale: ലളിതമായ ഭൂതകാല നിഷേധം വ്യക്തവും സ്വാഭാവികവുമായി നിലനിർത്തുന്നു.
- source_word: εἰ μὴ
  choice: അല്ലാതെ
  rationale: ഇവിടെ ഉപാധിയല്ല, ഒഴിവാക്കൽ സൂചിപ്പിക്കുന്ന പ്രയോഗമാണ്; മലയാളത്തിലെ ‘അല്ലാതെ’ അതിന് യോജിക്കുന്നു.
- source_word: Ἰάκωβον
  choice: യാക്കോബിനെ
  rationale: Ἰάκωβος എന്ന പേരിന്റെ മലയാള ബൈബിൾ പാരമ്പര്യത്തിൽ സ്ഥാപിതമായ രൂപം ഉപയോഗിക്കുന്നു.
- source_word: ἀδελφὸν
  choice: സഹോദരനായ
  rationale: മൂലപദത്തിന്റെ സാധാരണവും നേരിട്ടുള്ളതുമായ കുടുംബബന്ധാർഥം നിലനിർത്തുന്നു; ‘ബന്ധു’ എന്ന വിശാലീകരണം ആവശ്യമില്ല.
- source_word: τοῦ κυρίου
  choice: കർത്താവിന്റെ
  rationale: κύριος എന്ന ബിരുദത്തിന് സ്ഥാപിതവും മാന്യവുമായ മലയാള രൂപം; ഉടമസ്ഥബന്ധവും നേരിട്ട് പ്രകടമാക്കുന്നു.
theological_decisions:
- issue: യാക്കോബിനെ ‘അപ്പൊസ്തലന്മാരിൽ’ ഒരാളായി ഈ വാക്യം ഉൾപ്പെടുത്തുന്നുണ്ടോ
  choice: മുഖ്യവാചകത്തിൽ ‘മറ്റു അപ്പൊസ്തലന്മാരിൽ ... യാക്കോബിനെയല്ലാതെ’ എന്ന് നൽകി, യാക്കോബ് ഒഴിവാക്കൽവാക്യത്തിൽ ഉൾപ്പെടുന്നു എന്ന ഏറ്റവും സ്വാഭാവികമായ വാക്യഘടന നിലനിർത്തി.
  alternative: പത്രോസല്ലാതെ മറ്റൊരു അപ്പൊസ്തലനെയും പൗലോസ് കണ്ടില്ല; കൂടാതെ യാക്കോബിനെ കണ്ടു, എന്നാൽ യാക്കോബിനെ അപ്പൊസ്തലനായി വർഗീകരിക്കണമെന്നില്ല എന്നും ചിലർ ഗ്രഹിക്കുന്നു.
  rationale: εἰ μὴ സാധാരണയായി ‘മറ്റു അപ്പൊസ്തലന്മാരിൽ ആരെയും കണ്ടില്ല’ എന്ന പ്രസ്താവനയ്ക്ക് ഒഴിവാക്കൽ അവതരിപ്പിക്കുന്നു. എന്നാൽ വാക്യഘടനയുടെ വർഗീകരണഫലത്തെക്കുറിച്ചുള്ള യഥാർഥ വ്യാഖ്യാനവ്യത്യാസം അടിക്കുറിപ്പിൽ സംരക്ഷിക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ശൈലി. ‘അപ്പൊസ്തലൻ’, ‘കർത്താവ്’, ‘യാക്കോബ്’ എന്നീ സ്ഥാപിത ബൈബിൾ പദരൂപങ്ങൾ നിലനിർത്തി. മൂലത്തിലെ ഒഴിവാക്കൽഘടനയും അതിലുള്ള ദൈവശാസ്ത്രപരമായ അനിശ്ചിതത്വവും മുഖ്യവാചകത്തിലും അടിക്കുറിപ്പിലും സംരക്ഷിച്ചു.
