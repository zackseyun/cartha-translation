revisions:
- from: എന്നാൽ മറ്റു അപ്പൊസ്തലന്മാരിൽ കർത്താവിന്റെ സഹോദരനായ യാക്കോബിനെയല്ലാതെ മറ്റാരെയും ഞാൻ കണ്ടില്ല.[a]
  to: എന്നാൽ അപ്പൊസ്തലന്മാരിൽ കർത്താവിന്റെ സഹോദരനായ യാക്കോബിനെയല്ലാതെ മറ്റാരെയും ഞാൻ കണ്ടില്ല.[a]
  rationale: The revision moves ‘അപ്പൊസ്തലന്മാരിൽ’ before the exception phrase, giving a clear Malayalam equivalent of ‘none of the other apostles except James’ while retaining the natural syntactic implication that James is the exception. The footnote preserves the legitimate alternative construal without deciding the disputed classification in the translation itself.
  reviewer_model: gpt-5.6-terra
