  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: ml
  text: പിന്നെ, മൂന്നു വർഷത്തിനുശേഷം കേഫാസിനെ[b] നേരിൽ കണ്ട് പരിചയപ്പെടാൻ[a] ഞാൻ യെരൂശലേമിലേക്കു പോയി; അദ്ദേഹത്തോടൊപ്പം പതിനഞ്ചു ദിവസം താമസിച്ചു.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ, “കേഫാസിനെ സന്ദർശിക്കാൻ.” വ്യക്തിപരമായി കണ്ടുമുട്ടി ഒരാളെ പരിചയപ്പെടുക എന്ന അർഥവും ഈ ഗ്രീക്ക് ക്രിയയ്ക്കുണ്ടാകാം.
    reason: lexical_alternative
  - marker: b
    text: കേഫാസ് എന്നത് പത്രോസിന്റെ അരമായ പേരാണ്.
    reason: name_explanation
lexical_decisions:
- source_word: Ἔπειτα
  choice: പിന്നെ
  rationale: പൗലോസ് വിവരിക്കുന്ന സംഭവക്രമത്തിലെ അടുത്ത ഘട്ടത്തെ സ്വാഭാവികമായി സൂചിപ്പിക്കുന്നു.
- source_word: μετὰ ἔτη τρία
  choice: മൂന്നു വർഷത്തിനുശേഷം
  rationale: കാലപരിധിയെ ഗ്രീക്കിനോടു ചേർന്നും ആധുനിക മലയാളത്തിൽ സ്വാഭാവികമായും അവതരിപ്പിക്കുന്നു.
- source_word: ἀνῆλθον
  choice: പോയി
  rationale: യെരൂശലേമിലേക്കുള്ള യാത്രയാണ് സന്ദർഭത്തിലെ മുഖ്യ ആശയം. മലയാളത്തിൽ ‘കയറിപ്പോയി’ എന്നത് ഇവിടെ കൃത്രിമമായി തോന്നാവുന്നതിനാൽ ദിശാസൂചന ലക്ഷ്യസ്ഥാനപ്രയോഗത്തിൽ ഉൾക്കൊള്ളുന്നു.
- source_word: εἰς Ἱεροσόλυμα
  choice: യെരൂശലേമിലേക്കു
  rationale: സ്ഥലനാമത്തിന്റെ മലയാളത്തിൽ പ്രചാരമുള്ള രൂപവും ലക്ഷ്യസ്ഥാനത്തിന്റെ അർഥവും നിലനിർത്തുന്നു.
- source_word: ἱστορῆσαι
  choice: നേരിൽ കണ്ട് പരിചയപ്പെടാൻ
  rationale: വെറും സൗഹൃദസന്ദർശനത്തേക്കാൾ, വ്യക്തിപരമായ കൂടിക്കാഴ്ചയിലൂടെ ഒരാളെ പരിചയപ്പെടുക എന്ന അപൂർവ ഗ്രീക്ക് ക്രിയയുടെ സൂക്ഷ്മത സ്വാഭാവികമായി നൽകുന്നു; ‘സന്ദർശിക്കാൻ’ എന്ന സാധ്യത അടിക്കുറിപ്പിൽ നിലനിർത്തുന്നു.
- source_word: Κηφᾶν
  choice: കേഫാസിനെ
  rationale: പൗലോസ് ഉപയോഗിച്ച അരമായ പേരിന്റെ ഗ്രീക്ക് രൂപം പത്രോസ് എന്നു ഏകീകരിക്കാതെ ലിപ്യന്തരണം ചെയ്യുന്നു.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: അദ്ദേഹത്തോടൊപ്പം ... താമസിച്ചു
  rationale: കേഫാസിനോടൊപ്പം നിർദിഷ്ട കാലം തുടർന്നിരുന്നുവെന്ന ആശയം സ്വാഭാവിക മലയാളത്തിൽ നൽകുന്നു.
- source_word: ἡμέρας δεκαπέντε
  choice: പതിനഞ്ചു ദിവസം
  rationale: കാലദൈർഘ്യം നേരിട്ടും വ്യക്തമായും അവതരിപ്പിക്കുന്നു.
theological_decisions:
- issue: പൗലോസിന്റെ സന്ദർശനലക്ഷ്യമായി ἱστορῆσαι എന്ന ക്രിയയുടെ അർഥം
  choice: നേരിൽ കണ്ട് പരിചയപ്പെടാൻ
  alternative: സന്ദർശിക്കാൻ; വിവരങ്ങൾ ചോദിച്ചറിയാൻ
  rationale: ക്രിയയിൽ വ്യക്തിപരമായി കണ്ടു പരിചയപ്പെടുക എന്ന ആശയം ഉണ്ടായേക്കാം; എന്നാൽ പൗലോസ് കേഫാസിൽനിന്ന് ഉപദേശം സ്വീകരിക്കാനോ ഔദ്യോഗിക അംഗീകാരം നേടാനോ പോയി എന്ന പ്രത്യേക ദൈവശാസ്ത്രനിഗമനം വാക്യത്തിൽ ചേർക്കുന്നില്ല.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും മാന്യവുമായ ഗദ്യശൈലി. അപൂർവ ക്രിയയുടെ അർഥസൂക്ഷ്മത മുഖ്യവാചകത്തിലും അതിന്റെ യഥാർഥ പകരസാധ്യത അടിക്കുറിപ്പിലും സംരക്ഷിച്ചിരിക്കുന്നു.
