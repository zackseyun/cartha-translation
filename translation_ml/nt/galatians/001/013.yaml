source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: ml
  text: 'യെഹൂദമതത്തിലെ എന്റെ മുൻകാല ജീവിതരീതിയെക്കുറിച്ച്[a][b] നിങ്ങൾ കേട്ടിട്ടുണ്ടല്ലോ: ദൈവത്തിന്റെ സഭയെ ഞാൻ അളവില്ലാത്തവിധം[c] പീഡിപ്പിക്കുകയും അതിനെ തകർത്തുകൊണ്ടിരിക്കുകയും[d] ചെയ്തിരുന്നു.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: അഥവാ “എന്റെ മുൻകാല പെരുമാറ്റത്തെക്കുറിച്ച്” അല്ലെങ്കിൽ “എന്റെ മുൻകാല ജീവിതനടപ്പിനെക്കുറിച്ച്.”
    reason: lexical_alternative
  - marker: b
    text: അഥവാ “യെഹൂദരുടെ മതത്തിൽ.”
    reason: lexical_alternative
  - marker: c
    text: അഥവാ “അതിരുകടന്ന്” അല്ലെങ്കിൽ “അസാധാരണമായ തോതിൽ.”
    reason: lexical_alternative
  - marker: d
    text: അഥവാ “അതിനെ നശിപ്പിച്ചുകൊണ്ടിരിക്കുകയും” അല്ലെങ്കിൽ “അതിനെ നശിപ്പിക്കാൻ ശ്രമിച്ചുകൊണ്ടിരിക്കുകയും.”
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: ἀναστροφήν
  choice: ജീവിതരീതി
  rationale: ഒറ്റപ്പെട്ട പ്രവൃത്തികളെയല്ല, ഒരാളുടെ മൊത്തത്തിലുള്ള പെരുമാറ്റത്തെയും ജീവിതനടപ്പിനെയും സൂചിപ്പിക്കുന്ന പദമാണ്; ആ വ്യാപ്തി സ്വാഭാവികമായ മലയാളത്തിൽ ‘ജീവിതരീതി’ വ്യക്തമാക്കുന്നു.
- source_word: ποτε
  choice: ആയിരുന്ന കാലത്തെ
  rationale: പൗലോസിന്റെ ഇപ്പോഴത്തെ നിലയിൽനിന്ന് വ്യത്യസ്തമായ മുൻകാലത്തെ സൂചിപ്പിക്കുന്നു; ‘യെഹൂദമതത്തിൽ ആയിരുന്ന കാലത്തെ’ എന്ന പ്രയോഗം ആ സമയബന്ധം സ്വാഭാവികമായി പ്രകടമാക്കുന്നു.
- source_word: Ἰουδαϊσμῷ
  choice: യെഹൂദമതത്തിൽ
  rationale: യെഹൂദ മതപരമായ സ്വത്വവും ആചാരജീവിതവും ഉൾപ്പെടുന്ന സ്ഥാപിതമായ അർഥം നേരിട്ട് നൽകുന്നു.
- source_word: καθ’ ὑπερβολὴν
  choice: അളവില്ലാത്തവിധം
  rationale: പീഡനത്തിന്റെ അസാധാരണമായ തീവ്രത ഊന്നിപ്പറയുന്ന ഗ്രീക്ക് പ്രയോഗത്തിന്റെ വാചാടോപശക്തി നിലനിർത്തുന്നു.
- source_word: ἐδίωκον
  choice: പീഡിപ്പിക്കുകയും … ചെയ്തിരുന്നു
  rationale: അപൂർണ്ണഭൂതകാല ക്രിയ തുടർച്ചയായിരുന്ന മുൻകാല പ്രവർത്തനത്തെ സൂചിപ്പിക്കുന്നു; ‘ചെയ്തിരുന്നു’ ആ ഭാവം മലയാളത്തിൽ സ്വാഭാവികമായി നൽകുന്നു.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: ദൈവത്തിന്റെ സഭയെ
  rationale: ഇവിടെ പൗലോസ് ഉപദ്രവിച്ച ദൈവത്തിന്റേതായ വിശ്വാസിസമൂഹമാണ് ഉദ്ദേശ്യം; ‘സഭ’ മലയാള ക്രൈസ്തവപ്രയോഗത്തിൽ വ്യക്തവും സന്ദർഭോചിതവുമാണ്.
- source_word: ἐπόρθουν
  choice: അതിനെ തകർത്തുകൊണ്ടിരിക്കുകയും
  rationale: വെറും എതിർപ്പിനേക്കാൾ ശക്തമായ നാശകരമായ ആക്രമണം ഈ ക്രിയ സൂചിപ്പിക്കുന്നു; അപൂർണ്ണഭൂതകാലത്തിന്റെ തുടർച്ചയും ‘തകർത്തുകൊണ്ടിരിക്കുക’ നിലനിർത്തുന്നു.
theological_decisions:
- issue: ἐκκλησία എന്നത് ‘സഭ’ എന്നോ ‘കൂട്ടം’ എന്നോ പരിഭാഷപ്പെടുത്തുന്നത്
  choice: ദൈവത്തിന്റെ സഭ
  alternative: ദൈവത്തിന്റെ കൂട്ടം / സമൂഹം
  rationale: മശീഹായെ അനുഗമിച്ചിരുന്ന തിരിച്ചറിയാവുന്ന വിശ്വാസിസമൂഹമാണ് സന്ദർഭത്തിലെ സൂചന. അധികമായ സഭാശാസ്ത്ര അവകാശവാദങ്ങൾ ചേർക്കാതെ അതിനെ വ്യക്തമായി അറിയിക്കാൻ ‘സഭ’ അനുയോജ്യമാണ്.
- issue: ἐπόρθουν പൂർത്തിയായ നാശമെന്നോ നശിപ്പിക്കാനുള്ള ശ്രമമെന്നോ മനസ്സിലാക്കുന്നത്
  choice: അതിനെ തകർത്തുകൊണ്ടിരിക്കുകയും
  alternative: അതിനെ നശിപ്പിക്കാൻ ശ്രമിച്ചുകൊണ്ടിരിക്കുകയും
  rationale: ക്രിയയുടെ ശക്തമായ നാശകരമായ അർഥം മുഖ്യപാഠത്തിൽ നിലനിർത്തുന്നു; എന്നാൽ അപൂർണ്ണഭൂതകാലരൂപം ശ്രമാത്മകമായി മനസ്സിലാക്കാനുള്ള സാധ്യത അടിക്കുറിപ്പിൽ തുറന്നുവെക്കുന്നു.
translation_notes:
  register: ആധുനിക നിലവാരമലയാളത്തിലെ സ്വാഭാവികവും ഗൗരവമുള്ളതുമായ ശൈലി. ‘കേട്ടിട്ടുണ്ടല്ലോ’ എന്നത് γάρ സഹിതമുള്ള ഓർമ്മപ്പെടുത്തൽഭാവം പ്രകടമാക്കുന്നു. തുടർച്ചയായ രണ്ട് അപൂർണ്ണഭൂതകാല ക്രിയകളുടെ ഭാവം അവസാനത്തെ ‘ചെയ്തിരുന്നു’ രണ്ടിനും ബാധകമാകുന്ന വിധത്തിൽ ക്രമീകരിച്ചിട്ടുണ്ട്.
